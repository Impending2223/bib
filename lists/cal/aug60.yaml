# Cal. IX August 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: IX
entries:
  - id: cal.1960-08-02.governors-mi
    when: Aug. 2
    date: '1960-08-02'
    thread: governors
    also: [elections-1960]
    c: 'Michigan, Democratic primary for governor, Williams retiring after six terms: Swainson, lieutenant governor, 274,743, 50.8 percent; Hare, secretary of state, 205,086, 37.9; a Detroit councilman, 11.3. The Republican nominee of 1958 again, unopposed.'
    n: 'Votes: [Wikipedia, "1960 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1960_Michigan_gubernatorial_election), from the [*Michigan Manual 1961–1962*, pp. 399–400](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179231&view=1up&seq=471) (Check: not read here). [[w.glazer-wounded-warrior]]; [[w.noer-soapy]]. Names: Swainson, Hare, Williams.'
    tags: [state:mi, name:swainson-john-b, name:hare-james-m, name:williams-g-mennen]
  - id: cal.1960-08-02.governors-mo
    when: Aug. 2
    date: '1960-08-02'
    thread: governors
    also: [elections-1960]
    c: 'Missouri, governor. Democratic primary: Dalton, the attorney general, 86.4 percent, four others 13.6. Republican: Farmer 54.1, two others 45.9.'
    n: '[*Official Manual, State of Missouri, 1961–1962*, 1212–1213](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/34903). [[w.peirce-great-plains-states-of]]. Names: Dalton, Farmer.'
    tags: [state:mo, name:dalton-john-m, name:farmer-edward-g]
  - id: cal.1960-08-02.governors-ks
    when: Aug. 2
    date: '1960-08-02'
    thread: governors
    also: [elections-1960]
    c: 'Kansas, governor. Republican primary: Anderson, the attorney general, 48.7 percent, Boyd 44.4, one other 6.9. Governor Docking renominated.'
    n: 'Votes: [Wikipedia, "1960 Kansas gubernatorial election"](https://en.wikipedia.org/wiki/1960_Kansas_gubernatorial_election) (Check: the *Kansas Election Statistics* of the year). [[w.socolofsky-kansas-governors]]; [[w.peirce-great-plains-states-of]]. Names: Anderson, George Docking, Boyd.'
    tags: [state:ks, name:anderson-john-jr, name:boyd-mcdill, name:docking-george]
  - id: cal.1960-08-03.desegregation-schools-houston
    when: Aug. 3
    date: '1960-08-03'
    thread: desegregation-schools
    c: 'Houston. Judge Ben C. Connally finds the school board''s plan "a subterfuge designed only to accomplish further evasion and delay" and orders his own: desegregation a grade a year, from the first grade in September 1960, complete in 1972. Aug. 12, the plan set out grade by grade.'
    n: '*Ross v. Dyer*, [312 F.2d 191](https://static.case.law/f2d/312/case-pdfs/0191-01.pdf), 192 (5th Cir. 1962), recites the orders of Apr. 8, Aug. 3 and Aug. 12, 1960. [[w.kellar-make-haste-slowly]]; [[w.feagin-free-enterprise-city]]. Names: Ben C. Connally.'
    tags: [state:tx, city:houston, name:connally-ben-c]
  - id: cal.1960-08-04.middle-east
    when: Aug. 4
    date: '1960-08-04'
    thread: middle-east
    c: 'Herter to Ben Gurion: no Hawks. A defensive missile in Israel would bring the neighbors missiles, surface-to-surface perhaps, against which the Hawk is no defense. The electronic equipment offered May 23 stands.'
    n: 'FRUS 1958–60, XIII, doc. [163](https://history.state.gov/historicaldocuments/frus1958-60v13/d163). See [[cal.1960-03-10.middle-east]]. Names: Herter, Ben Gurion.'
    tags: [name:herter-christian-a, name:ben-gurion-david]
  - id: cal.1960-08-06.cuba
    when: Aug. 6
    date: '1960-08-06'
    thread: cuba
    c: 'Castro, under Law 851, nationalizes 26 American companies: 36 sugar mills, the oil refineries, the electric and telephone companies.'
    n: 'FRUS 1958–60, VI, docs. [570](https://history.state.gov/historicaldocuments/frus1958-60v06/d570) (Bonsal, Aug. 2), [571](https://history.state.gov/historicaldocuments/frus1958-60v06/d571) (the Mexican offer of good offices, Aug. 3). [[w.morley-imperial-state-and-revolution]]. Check the counts. See [[cal.1960-07-06.cuba-2]]. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1960-08-08.congress
    when: Aug. 8
    date: '1960-08-08'
    thread: congress
    also: [program]
    c: 'Congress back after the conventions, as Johnson and Rayburn planned; both Democratic nominees in the Senate. Eisenhower''s message: the mutual security cuts restored, $600 million for Latin America, school construction, medical care for the aged, the minimum wage, area assistance, forty judgeships, the Antarctic Treaty; "we cannot adjourn the public interest."'
    n: '[Special Message to the Congress Upon Its Reconvening](https://www.presidency.ucsb.edu/documents/special-message-the-congress-upon-its-reconvening); [Joint Statement of Senator John F. Kennedy and Senator Lyndon B. Johnson](https://www.presidency.ucsb.edu/documents/joint-statement-senator-john-f-kennedy-and-senator-lyndon-b-johnson) (July 30). [[w.caro-passage-of-power]]; [[w.dallek-lone-star-rising]]; [[w.hardeman-rayburn]]; [[w.sundquist-politics-and-policy]]; [[w.morgan-eisenhower-versus-the-spenders]]; [[w.kallina-kennedy-v-nixon]]. Names: Johnson, Rayburn, Eisenhower.'
    tags: [name:johnson-lyndon-b, name:rayburn-sam, name:eisenhower-dwight-d]
  - id: cal.1960-08-09.voting-rights
    when: Aug. 9
    date: '1960-08-09'
    thread: voting-rights
    c: 'Senate tables, [54–28](https://voteview.com/rollcall/RS0860388), on Clark''s motion, Dirksen''s bill of the two proposals left out of the act of May: a commission on equal job opportunity under government contracts, aid to districts desegregating schools. Kennedy and Johnson for tabling, Dirksen and Javits against. Kennedy: the Republicans would use civil rights to block school aid, housing, medical care and the minimum wage.'
    n: 'S. 3823, 86th Cong. [Statement by Senator John F. Kennedy, on Use of Civil Rights Legislation](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-use-civil-rights-legislation). See [[cal.1960-02-15.voting-rights]]. Names: Clark, Dirksen, Javits, Kennedy, Johnson.'
    tags: [name:clark-joseph-s, name:dirksen-everett, name:javits-jacob-k, name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1960-08-09.laos
    when: Aug. 9
    date: '1960-08-09'
    thread: laos
    c: Kong Le's paratroop battalion takes Vientiane, the night of Aug. 8–9, the cabinet away at Luang Prabang.
    n: 'FRUS 1958–60, XVI, docs. [355](https://history.state.gov/historicaldocuments/frus1958-60v16/d355), [359](https://history.state.gov/historicaldocuments/frus1958-60v16/d359) (NSC, Aug. 12), [361](https://history.state.gov/historicaldocuments/frus1958-60v16/d361). [[w.rust-before-the-quagmire]]; [[w.jacobs-universe-unraveling]]; [[w.dommen-conflict-in-laos]]; [[w.fall-anatomy-of-a-crisis]]; [[w.stevenson-end-of-nowhere]]; [[w.conboy-shadow-war]]. Names: Kong Le.'
    tags: [name:kong-le, place:vientiane]
  - id: cal.1960-08-09.congo
    when: Aug. 9
    date: '1960-08-09'
    thread: congo
    c: 'Security Council: Belgium to take its troops out of Katanga, the UN force to enter it, and to take no part in any internal conflict; 9–0, France and Italy abstaining.'
    n: '[S.C. Res. 146](https://docs.un.org/S/RES/146%281960%29). FRUS 1958–60, XIV, docs. [168](https://history.state.gov/historicaldocuments/frus1958-60v14/d168), [169](https://history.state.gov/historicaldocuments/frus1958-60v14/d169) (Lodge). See [[cal.1960-06-30.congo]].'
    tags: [name:lodge-henry-cabot]
  - id: cal.1960-08-10.testing
    when: Aug. 10
    date: '1960-08-10'
    thread: testing
    c: 'Senate approves the Antarctic Treaty, [12 U.S.T. 794](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-12-1/lltreaties-12-1.pdf#page=816), [402 U.N.T.S. 71](https://treaties.un.org/doc/Publication/UNTS/Volume%20402/volume-402-I-5778-English.pdf), [66–21](https://voteview.com/rollcall/RS0860390), Engle''s motion to put it off to January refused, [29–56](https://voteview.com/rollcall/RS0860389). Antarctica for peaceful purposes only: no bases, maneuvers or nuclear explosions; the parties'' observers free to inspect. Eisenhower ratifies Aug. 18.'
    n: 'Signed at Washington, Dec. 1, 1959, by the twelve; in force June 23, 1961. [[w.beck-international-politics-of-antarctica]]. Names: Engle, Eisenhower.'
    tags: [name:engle-clair, name:eisenhower-dwight-d]
  - id: cal.1960-08-11.defense
    when: Aug. 11
    date: '1960-08-11'
    thread: defense
    c: 'Gates to Eisenhower, the Joint Chiefs split on targeting: a national target policy and a single integrated plan, drawn by a Director of Strategic Target Planning, the commander of SAC at Omaha, as an added duty. Burke appeals against it. Eisenhower: the first strike "must be simultaneous"; Gates to go ahead and bring the plan back in December.'
    n: '[FRUS 1958–60, III, doc. 113](https://history.state.gov/historicaldocuments/frus1958-60v03/d113). The first plan, SIOP-62, approved in December. [[w.rosenberg-origins-of-overkill]]; [[w.kaplan-wizards-of-armageddon]]; [[w.roman-eisenhower-and-the-missile]]; [[w.kistiakowsky-scientist-at-the-white]]. Check when the decision was made public. Names: Gates, Eisenhower, Burke.'
    tags: [name:gates-thomas-s-jr, name:eisenhower-dwight-d, name:burke-arleigh-a]
  - id: cal.1960-08-11.space
    when: Aug. 11
    date: '1960-08-11'
    thread: space
    also: [defense]
    c: 'Discoverer XIII''s capsule taken from the Pacific: the first object recovered from orbit.'
    n: 'Check: the record. [[w.corona]]; [[w.eye-in-the-sky]]; [[w.mcdougall-heavens-and-the-earth]]; [[w.divine-sputnik-challenge]].'
  - id: cal.1960-08-12.congo
    when: Aug. 12
    date: '1960-08-12'
    thread: congo
    c: Hammarskjöld flies into Elisabethville with Swedish troops. Lumumba protests his dealing with Tshombe.
    n: 'FRUS 1958–60, XIV, doc. [175](https://history.state.gov/historicaldocuments/frus1958-60v14/d175) (Hammarskjöld''s reading of the resolution). See [[cal.1960-06-30.congo]]. Names: Hammarskjöld, Lumumba, Tshombe.'
    tags: [name:hammarskjold-dag, name:lumumba-patrice, name:tshombe-moise]
  - id: cal.1960-08-12.space
    when: Aug. 12
    date: '1960-08-12'
    thread: space
    c: Echo I, a 100-foot balloon, orbited from Cape Canaveral, Fla. Eisenhower's recorded message sent from Goldstone, Cal., off the balloon to Holmdel, N.J.
    n: '[Message Recorded for Transmission Via Communication Satellite Echo I](https://www.presidency.ucsb.edu/documents/message-recorded-for-transmission-via-communication-satellite-echo-i). [[w.galloway-politics-and-technology-of]]; [[w.mcdougall-heavens-and-the-earth]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-08-12.japan-and-korea
    when: Aug. 12
    date: '1960-08-12'
    thread: korea
    c: Korea's new Assembly elects Yun Po-sun President. Check the date.
    n: '[Message to President Po Sun Yun of Korea](https://www.presidency.ucsb.edu/documents/message-president-po-sun-yun-korea) (Aug. 29). FRUS 1958–60, XVIII, doc. [328](https://history.state.gov/historicaldocuments/frus1958-60v18/d328). [[w.brazinsky-nation-building-in-south]]. Names: Yun.'
    tags: [name:yun-po-sun, name:eisenhower-dwight-d]
  - id: cal.1960-08-13.laos
    when: Aug. 13–14
    date: '1960-08-13'
    thread: laos
    c: The Laotian Assembly censures the Somsanith government, Aug. 13; it resigns Aug. 14, and the King names Souvanna Phouma.
    n: 'FRUS 1958–60, XVI, doc. [366](https://history.state.gov/historicaldocuments/frus1958-60v16/d366) (Brown, Aug. 15). See [[cal.1960-08-09.laos]]. Names: Somsanith, Savang Vatthana, Souvanna Phouma.'
    tags: [name:souvanna-phouma, name:savang-vatthana, name:somsanith]
  - id: cal.1960-08-15.space
    when: Aug. 15
    date: '1960-08-15'
    thread: space
    also: [defense]
    c: Eisenhower shown Discoverer XIII's capsule at the White House.
    n: '[Remarks Upon Inspection of the Capsule Retrieved from the Satellite Discoverer XIII](https://www.presidency.ucsb.edu/documents/remarks-upon-inspection-the-capsule-retrieved-from-the-satellite-discoverer-xiii) (Aug. 15, 1960); [Statement by the President on U.S. Achievements in Space](https://www.presidency.ucsb.edu/documents/statement-the-president-us-achievements-space) (Aug. 17). See [[cal.1960-08-11.space]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-08-16.latin-america
    when: Aug. 16–21
    date: '1960-08-16'
    thread: latin-america
    c: Foreign ministers of the American republics at San José, Costa Rica. Trujillo's government condemned for the attempt on Betancourt's life, June 24; members to break relations with it and stop selling it arms.
    n: '[FRUS 1958–60, V, doc. 340](https://history.state.gov/historicaldocuments/frus1958-60v05/d340) (Herter and Tello, Aug. 16); [FRUS 1958–60, VI, doc. 578](https://history.state.gov/historicaldocuments/frus1958-60v06/d578) (editorial note). [[w.rabe-eisenhower-and-latin-america]]; [[w.diederich-trujillo]]. Names: Trujillo, Betancourt.'
    tags: [name:betancourt-romulo, name:trujillo-rafael, name:herter-christian-a]
  - id: cal.1960-08-16.europe-and-the-alliance
    when: Aug. 16
    date: '1960-08-16'
    thread: cyprus
    c: 'Cyprus independent. The constitution signed at Nicosia by Britain, Greece, Turkey and the Cypriots; the Treaties of Alliance, of Guarantee and of Establishment; Britain keeps its bases. Makarios President, Kutchuk Vice President. The United States recognizes the Republic; the consulate general an embassy. Eisenhower to Makarios: a tribute to his statesmanship and Kutchuk''s.'
    n: '[Message to President Makarios on the Occasion of the Independence of the Republic of Cyprus](https://www.presidency.ucsb.edu/documents/message-president-makarios-the-occasion-the-independence-the-republic-cyprus) (Aug. 16, 1960). [FRUS 1958–60, X, pt. 1, doc. 356](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d356) (editorial note: the treaties, Cmd. 1093 and 1252; recognition). [[w.nicolet-united-states-policy-towards]]. Names: Makarios III, Kutchuk, Eisenhower.'
    tags: [name:makarios-iii, name:kutchuk-fazil, name:eisenhower-dwight-d]
  - id: cal.1960-08-16.laos
    when: Aug. 16
    date: '1960-08-16'
    thread: laos
    c: Phoumi at Savannakhet moves to retake Vientiane; the embassy tells him the United States will not back it by force.
    n: 'FRUS 1958–60, XVI, doc. [369](https://history.state.gov/historicaldocuments/frus1958-60v16/d369). See [[cal.1960-08-09.laos]]. Names: Phoumi Nosavan.'
    tags: [name:phoumi-nosavan, place:savannakhet]
  - id: cal.1960-08-17.soviet-union
    when: Aug. 17–19
    date: '1960-08-17'
    thread: soviet-union-u2
    c: Powers tried in Moscow before the Military Collegium of the Supreme Court. Pleads guilty. Ten years, three of them in prison.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-238) (Aug. 17, 1960). [[w.powers-operation-overflight]]. See [[cal.1960-05-01.soviet-union]]. Names: Powers.'
    tags: [name:powers-francis-gary]
  - id: cal.1960-08-18.congo-2
    when: Aug. 18
    date: '1960-08-18'
    thread: congo-lumumba
    c: 'NSC on the Congo. Dillon: Lumumba serves the Soviets; Dulles: he is in Soviet pay. Eisenhower: the UN to stay in the Congo even if European troops must be asked for. Robert H. Johnson, the note-taker, testifies in 1975 that he heard the President say something he took as an order to kill Lumumba; the minutes record none.'
    n: '[FRUS 1958–60, XIV, doc. 180](https://history.state.gov/historicaldocuments/frus1958-60v14/d180) and its first note. [S. Rep. No. 94-465, 13–16, 55–60 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=24) (K–J Adm. II.H.3). [[w.kalb-congo-cables]]; [[w.weissman-american-foreign-policy-in]]; [[w.mahoney-jfk]]; [[w.namikas-battleground-africa]]; [[w.devlin-chief-of-station-congo]]; [[w.witte-de-moord-op-lumumba]]; [[w.gerard-death-in-the-congo]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Dillon, Dulles, Lumumba, Eisenhower, Robert H. Johnson.'
    tags: [name:dillon-c-douglas, name:dulles-allen-w, name:lumumba-patrice, name:eisenhower-dwight-d, name:johnson-robert-h]
  - id: cal.1960-08-18.cuba
    when: Aug. 18
    date: '1960-08-18'
    thread: cuba
    c: 'Dulles and Bissell report to Eisenhower on the Cuba program: the exile front in Mexico, the Swan Island radio, some 500 Cubans to be trained in Guatemala. Eisenhower approves funds from the reserve, "so long as the Joint Chiefs, Defense, State and the CIA think we have a good chance of being successful."'
    n: '[FRUS 1958–60, VI, doc. 577](https://history.state.gov/historicaldocuments/frus1958-60v06/d577) (Gray''s memorandum). See [[cal.1960-03-17.cuba]]. Made public: FRUS 1958–60, VI (1991). Check for an earlier release. Names: Dulles, Bissell, Eisenhower.'
    tags: [name:dulles-allen-w, name:bissell-richard-m-jr, name:eisenhower-dwight-d]
  - id: cal.1960-08-18.jobs-and-wages
    when: Aug. 18
    date: '1960-08-18'
    thread: jobs-and-wages
    c: 'Senate passes Kennedy''s minimum wage bill, [62–34](https://voteview.com/rollcall/RS0860402): $1.25 by the third year; coverage to about four million more workers, after hotels, motels, restaurants, and auto and farm implement dealers are excluded, [87–8](https://voteview.com/rollcall/RS0860400). The House bill of June 30, Kitchin''s substitute: $1.15, [341–72](https://voteview.com/rollcall/RH0860163).'
    n: 'H.R. 12677, 86th Cong. [Press Release of Senator John F. Kennedy, on Minimum Wage Bill](https://www.presidency.ucsb.edu/documents/press-release-senator-john-f-kennedy-minimum-wage-bill-washington-dc). [[w.sundquist-politics-and-policy]]; [[w.kallina-kennedy-v-nixon]]. Names: Kennedy, Kitchin.'
    tags: [name:kennedy-john-f, name:kitchin-alvin-p]
  - id: cal.1960-08-19.latin-america
    when: Aug. 19
    date: '1960-08-19'
    thread: latin-america
    c: Senate authorizes $500 million for Latin America's social development and $100 million for Chile's earthquake recovery, [54–19](https://voteview.com/rollcall/RS0860404).
    n: S. 3861, 86th Cong. See [[cal.1960-07-11.latin-america]].
  - id: cal.1960-08-19.space
    when: Aug. 19
    date: '1960-08-19'
    thread: space
    also: [defense]
    c: 'Discoverer XIV''s capsule caught in the air near Hawaii: the first film from a Corona camera, more of the Soviet Union than all the U-2 flights.'
    n: 'Made public: the Corona photographs declassified by Executive Order 12,951, Feb. 22, 1995. See [[cal.1960-08-11.space]].'
  - id: cal.1960-08-19.japan-and-korea
    when: Aug. 19
    date: '1960-08-19'
    thread: korea
    c: Korea's Assembly confirms Chang Myon Prime Minister. Check the date.
    n: '[Message to Prime Minister Chang Myon of Korea](https://www.presidency.ucsb.edu/documents/message-prime-minister-chang-myon-korea) (Aug. 29). FRUS 1958–60, XVIII, doc. [330](https://history.state.gov/historicaldocuments/frus1958-60v18/d330) (McConaughy, Aug. 24). See [[cal.1960-08-12.japan-and-korea]]. Names: Chang.'
    tags: [name:chang-myon, name:eisenhower-dwight-d]
  - id: cal.1960-08-22.cuba
    when: Aug. 22
    date: '1960-08-22'
    thread: cuba
    also: [latin-america]
    c: 'The foreign ministers'' second meeting at San José opens, on Peru''s request: the defense of the inter-American system against threats.'
    n: '[FRUS 1958–60, VI, doc. 578](https://history.state.gov/historicaldocuments/frus1958-60v06/d578) (editorial note). [[w.rabe-eisenhower-and-latin-america]]; [[w.paterson-contesting-castro]]; [[w.schoultz-that-infernal-little-cuban]].'
  - id: cal.1960-08-23.medicare
    when: Aug. 23
    date: '1960-08-23'
    thread: medicare
    also: [welfare]
    c: 'Senate rejects the Anderson–Kennedy amendment, hospital care for the aged through Social Security, [44–51](https://voteview.com/rollcall/RS0860407); Javits''s, federal-state matching, [28–67](https://voteview.com/rollcall/RS0860406). Passes the Kerr–Mills bill, grants for the medically needy aged, [91–2](https://voteview.com/rollcall/RS0860409).'
    n: 'H.R. 12580, 86th Cong. [Statement by Senator John F. Kennedy on the Senate Floor on Medical Care for the Aged](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-the-senate-floor-medical-care-for-the-aged). [[w.morgan-robert-s-kerr]]. See [[cal.1960-03-31.medicare]]. Names: Anderson, Kerr, Kennedy, Javits, Mills.'
    tags: [name:anderson-clinton-p, name:kennedy-john-f, name:javits-jacob-k, name:kerr-robert-s, name:mills-wilbur-d]
  - id: cal.1960-08-23.latin-america
    when: Aug. 23
    date: '1960-08-23'
    thread: latin-america
    c: Eisenhower asks discretion to buy the Dominican share of Cuba's cut sugar quota elsewhere.
    n: '[Special Message to the Congress on the Sugar Quota of the Dominican Republic](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-sugar-quota-the-dominican-republic) (Aug. 23, 1960). See [[cal.1960-08-16.latin-america]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-08-24.press-and-broadcasting
    when: Aug. 24
    date: '1960-08-24'
    thread: press-and-broadcasting
    also: [elections-1960]
    c: Section 315's equal-time rule suspended for the nominees for President and Vice President in 1960, [74 Stat. 554](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg554-3.pdf). Broadcasters may give the two parties' nominees time without giving it to the others. The FCC to report by Mar. 1, 1961.
    n: S.J. Res. 207, 86th Cong. [[w.great-debates]]; [[w.equal-time]].
  - id: cal.1960-08-24.elections-1960
    when: Aug. 24
    date: '1960-08-24'
    thread: elections-1960
    c: 'Eisenhower''s news conference. Asked for a major idea of Nixon''s he had adopted: "If you give me a week, I might think of one. I don''t remember."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-240) (Aug. 24, 1960). The campaign: [[w.white-making-of-the-president]]; [[w.kallina-kennedy-v-nixon]]; [[w.donaldson-first-modern-campaign]]; [[w.rorabaugh-real-making-of-the]]; [[w.matthews-kennedy-and-nixon]]; [[w.pietrusza-1960]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]; [[w.nixon-six-crises]]. Names: Eisenhower, Nixon.'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m]
  - id: cal.1960-08-24.foreign-aid
    when: Aug. 24–26
    date: '1960-08-24'
    thread: foreign-aid
    c: Senate restores $297 million of the House's mutual security cuts and adds $100 million to the contingency fund, [67–26](https://voteview.com/rollcall/RS0860410). The conference keeps $31 million of the restoration. Eisenhower asks it sent back, Aug. 26; the Senate adopts the report, [57–24](https://voteview.com/rollcall/RS0860411).
    n: 'H.R. 12619, 86th Cong. [Statement by the President Concerning Mutual Security Appropriations](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-mutual-security-appropriations); [Letter to the Majority and Minority Leaders of the Senate](https://www.presidency.ucsb.edu/documents/letter-the-majority-and-minority-leaders-the-senate-mutual-security-appropriations) (Aug. 26). [[w.kaufman-trade-and-aid]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-08-25.middle-east
    when: Aug. 25
    date: '1960-08-25'
    thread: middle-east
    c: 'Iran. The Majlis elections rigged for the Shah''s Melliyun Party. Dulles to the NSC: "fixed elections can produce dangerous repercussions," as in Korea and Turkey.'
    n: 'FRUS 1958–60, XII, docs. [297](https://history.state.gov/historicaldocuments/frus1958-60v12/d297) (Wailes, Aug. 18), [298](https://history.state.gov/historicaldocuments/frus1958-60v12/d298), [299](https://history.state.gov/historicaldocuments/frus1958-60v12/d299) (editorial note: the NSC). [[w.rubin-paved-with-good-intentions]]; [[w.abrahamian-iran-between-two-revolutions]]; [[w.bill-eagle-and-the-lion]]; [[w.gasiorowski-u-s-foreign-policy]]; [[w.milani-shah]]. Names: Pahlavi, Dulles.'
    tags: [name:pahlavi-mohammed-reza, name:dulles-allen-w]
  - id: cal.1960-08-25.congo
    when: Aug. 25–26
    date: '1960-08-25'
    thread: congo-lumumba
    c: 'Special Group, Aug. 25: Gray reports "extremely strong feelings" for "very straightforward action"; planning not to rule out "consideration" of any activity "which might contribute to getting rid of Lumumba." Dulles to the station in Léopoldville, Aug. 26: "his removal must be an urgent and prime objective."'
    n: '[FRUS 1964–68, XXIII, docs. 12](https://history.state.gov/historicaldocuments/frus1964-68v23/d12) (the minutes), [14](https://history.state.gov/historicaldocuments/frus1964-68v23/d14) (the cable, dated Aug. 27). [S. Rep. No. 94-465, 14–15 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=25) (K–J Adm. II.H.3). See [[cal.1960-08-18.congo-2]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Gray, Dulles, Lumumba.'
    tags: [name:gray-gordon, name:dulles-allen-w, name:lumumba-patrice, name:devlin-lawrence-r]
  - id: cal.1960-08-25.space
    when: Aug. 25
    date: '1960-08-25'
    thread: space
    also: [defense]
    c: 'Special NSC meeting. Eisenhower approves the panel''s report on satellite reconnaissance: a recoverable camera satellite at very high priority, the program under a civilian office reporting to the Secretary of Defense.'
    n: 'FRUS 1958–60, III, docs. [115](https://history.state.gov/historicaldocuments/frus1958-60v03/d115), [116](https://history.state.gov/historicaldocuments/frus1958-60v03/d116) (the report), [117](https://history.state.gov/historicaldocuments/frus1958-60v03/d117) (the actions). [[w.kistiakowsky-scientist-at-the-white]], 387–388. See [[cal.1960-08-11.space]]. Made public: the National Reconnaissance Office''s existence, Sept. 18, 1992. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:kistiakowsky-george-b, name:gates-thomas-s-jr]
  - id: cal.1960-08-26.latin-america
    when: Aug. 26
    date: '1960-08-26'
    thread: latin-america
    c: The United States breaks relations with the Dominican Republic.
    n: 'Check the date of the break. See [[cal.1960-08-16.latin-america]].'
  - id: cal.1960-08-26.medicare
    when: Aug. 26
    date: '1960-08-26'
    thread: medicare
    also: [welfare]
    c: House adopts the Kerr–Mills conference report, [369–17](https://voteview.com/rollcall/RH0860178).
    n: 'H.R. 12580, 86th Cong. See [[cal.1960-08-23.medicare]].'
  - id: cal.1960-08-27.sit-ins
    when: Aug. 27
    date: '1960-08-27'
    thread: sit-ins
    c: Jacksonville. White men with ax handles and baseball bats attack Negro youths of the NAACP's Youth Council after their sit-ins downtown; fighting in Hemming Park and the streets.
    n: '[[w.bartley-keeping-the-faith]]. See [[cal.1960-02-01.sit-ins]].'
  - id: cal.1960-08-27.desegregation-schools-la
    when: Aug. 27
    date: '1960-08-27'
    thread: desegregation-schools
    c: 'New Orleans. A three-judge court, Wright among its members, voids Louisiana''s school laws: Act 496 of 1960, separate schools, the legislature alone to classify them, the governor to take over a board under a desegregation order; Act 542 of 1960, the governor to close a school threatened by disorder; Act 319 of 1956; and a State court''s injunction of July 29 against the Orleans Parish board. Temporary injunction, Aug. 29. Wright''s plan of May 16 stands: desegregation from the first grade.'
    n: '*Bush v. Orleans Parish School Board*, [187 F. Supp. 42](https://static.case.law/f-supp/187/case-pdfs/0042-01.pdf) (E.D. La. 1960). [[w.baker-second-battle-of-new]]; [[w.inger-politics-and-reality-in]]; [[w.crain-politics-of-school-desegregation]]; [[w.fairclough-race-and-democracy]]; [[w.bass-unlikely-heroes]]. Names: Wright.'
    tags: [name:wright-j-skelly, state:la, city:new-orleans]
  - id: cal.1960-08-28.cuba
    when: Aug. 28–29
    date: '1960-08-28'
    thread: cuba
    also: [latin-america]
    c: 'San José. The Cuban delegation walks out; the Declaration of San José approved, 19–0: any extracontinental intervention condemned. Cuba not named; Eisenhower, Aug. 28: if this is the best Herter can achieve, accept it. Check the days of the walkout and the vote.'
    n: '[FRUS 1958–60, VI, doc. 578](https://history.state.gov/historicaldocuments/frus1958-60v06/d578) (editorial note: Goodpaster''s memorandum, Aug. 28). [FRUS 1958–60, V, doc. 342](https://history.state.gov/historicaldocuments/frus1958-60v05/d342) (Herter and López Mateos on it, Sept. 16). See [[cal.1960-08-22.cuba]]. Names: Eisenhower, Herter.'
    tags: [name:eisenhower-dwight-d, name:herter-christian-a]
  - id: cal.1960-08-29.elections-1960
    when: Aug. 29
    date: '1960-08-29'
    thread: elections-1960
    c: Nixon into Walter Reed, the knee he struck on a car door at Greensboro, Aug. 17, infected. In the hospital to Sept. 9.
    n: '[Press Conference of Vice President Nixon, WFMY-TV, Greensboro, NC](https://www.presidency.ucsb.edu/documents/press-conference-vice-president-nixon-wfmy-tv-greensboro-nc) (Aug. 17). [[w.nixon-six-crises]]. Check the date he left. See [[cal.1960-08-24.elections-1960]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1960-08-29.middle-east
    when: Aug. 29
    date: '1960-08-29'
    thread: middle-east
    c: Iran. Eqbal and his cabinet resign; Sharif-Emami Prime Minister.
    n: 'Check: the record. See [[cal.1960-08-25.middle-east]]. Names: Eqbal, Sharif-Emami.'
    tags: [name:eqbal-manuchehr, name:sharif-emami-jafar]
