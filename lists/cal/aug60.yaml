# Cal. IX August 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: IX
entries:
  - id: cal.1960-08-06.cuba
    when: Aug. 6
    date: '1960-08-06'
    thread: cuba
    c: 'Castro, under Law 851, nationalizes 26 American companies: 36 sugar mills, the oil refineries, the electric and telephone companies.'
    n: 'FRUS 1958–60, VI, docs. [570](https://history.state.gov/historicaldocuments/frus1958-60v06/d570) (Bonsal, Aug. 2), [571](https://history.state.gov/historicaldocuments/frus1958-60v06/d571) (the Mexican offer of good offices, Aug. 3). [[w.morley-imperial-state-and-revolution]]. See [[cal.1960-07-06.cuba-2]]. Names: Castro (K–J Adm. III.J).'
    tags: [name:castro-fidel]
  - id: cal.1960-08-08.congress
    when: Aug. 8
    date: '1960-08-08'
    thread: congress
    also: [program]
    c: 'Congress back after the conventions, as Johnson and Rayburn planned; both Democratic nominees in the Senate. Eisenhower''s message: the mutual security cuts restored, $600 million for Latin America, school construction, medical care for the aged, the minimum wage, area assistance, forty judgeships, the Antarctic Treaty; "we cannot adjourn the public interest."'
    n: '[Special Message to the Congress Upon Its Reconvening](https://www.presidency.ucsb.edu/documents/special-message-the-congress-upon-its-reconvening); [Joint Statement of Senator John F. Kennedy and Senator Lyndon B. Johnson](https://www.presidency.ucsb.edu/documents/joint-statement-senator-john-f-kennedy-and-senator-lyndon-b-johnson) (July 30). [[w.caro-passage-of-power]]; [[w.dallek-lone-star-rising]]; [[w.hardeman-rayburn]]; [[w.sundquist-politics-and-policy]]; [[w.morgan-eisenhower-versus-the-spenders]]; [[w.kallina-kennedy-v-nixon]]. Names: Johnson (K–J Adm. III.D); Rayburn (K–J Cong. III.C); Eisenhower (Opp. III.E).'
    tags: [name:johnson-lyndon-b, name:rayburn-sam, name:eisenhower-dwight-d]
  - id: cal.1960-08-09.voting-rights
    when: Aug. 9
    date: '1960-08-09'
    thread: voting-rights
    c: 'Senate tables, [54–28](https://voteview.com/rollcall/RS0860388), on Clark''s motion, Dirksen''s bill of the two proposals left out of the act of May: a commission on equal job opportunity under government contracts, aid to districts desegregating schools. Kennedy and Johnson for tabling, Dirksen and Javits against. Kennedy: the Republicans would use civil rights to block school aid, housing, medical care and the minimum wage.'
    n: 'S. 3823, 86th Cong. [Statement by Senator John F. Kennedy, on Use of Civil Rights Legislation](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-use-civil-rights-legislation). See [[cal.1960-02-15.voting-rights]]. Names: Clark (K–J Cong. III.B); Dirksen (Opp. III.A); Javits (K–J Cong. III.E); Kennedy (Viet. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:clark-joseph-s, name:dirksen-everett, name:javits-jacob-k, name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1960-08-09.laos
    when: Aug. 9–16
    date: '1960-08-09'
    thread: laos
    c: 'Kong Le''s paratroop battalion takes Vientiane, the night of Aug. 8–9, the cabinet away at Luang Prabang. The Assembly censures the Somsanith government, Aug. 13; it resigns Aug. 14, and the King names Souvanna Phouma. Phoumi at Savannakhet moves to retake the capital; the embassy tells him, Aug. 16, the United States will not back it by force.'
    n: 'FRUS 1958–60, XVI, docs. [355](https://history.state.gov/historicaldocuments/frus1958-60v16/d355), [359](https://history.state.gov/historicaldocuments/frus1958-60v16/d359) (NSC, Aug. 12), [361](https://history.state.gov/historicaldocuments/frus1958-60v16/d361), [366](https://history.state.gov/historicaldocuments/frus1958-60v16/d366), [369](https://history.state.gov/historicaldocuments/frus1958-60v16/d369). [[w.rust-before-the-quagmire]]; [[w.jacobs-universe-unraveling]]; [[w.dommen-conflict-in-laos]]; [[w.fall-anatomy-of-a-crisis]]; [[w.stevenson-end-of-nowhere]]; [[w.conboy-shadow-war]]. Names: Kong Le, Souvanna Phouma, Phoumi Nosavan (Viet. III.I).'
    tags: [name:kong-le, name:souvanna-phouma, name:phoumi-nosavan, name:savang-vatthana, name:somsanith]
  - id: cal.1960-08-09.congo
    when: Aug. 9–12
    date: '1960-08-09'
    thread: congo
    c: 'Security Council: Belgium to take its troops out of Katanga, the UN force to enter it, and to take no part in any internal conflict; 9–0, France and Italy abstaining. Hammarskjöld flies into Elisabethville with Swedish troops, Aug. 12. Lumumba protests his dealing with Tshombe.'
    n: '[S.C. Res. 146](https://docs.un.org/S/RES/146%281960%29). FRUS 1958–60, XIV, docs. [168](https://history.state.gov/historicaldocuments/frus1958-60v14/d168), [169](https://history.state.gov/historicaldocuments/frus1958-60v14/d169) (Lodge), [175](https://history.state.gov/historicaldocuments/frus1958-60v14/d175) (Hammarskjöld''s reading of the resolution). See [[cal.1960-06-30.congo]]. Names: Hammarskjöld, Lumumba, Tshombe (K–J Adm. III.J).'
    tags: [name:hammarskjold-dag, name:lumumba-patrice, name:tshombe-moise]
  - id: cal.1960-08-10.testing
    when: Aug. 10
    date: '1960-08-10'
    thread: testing
    c: 'Senate approves the Antarctic Treaty, [12 U.S.T. 794](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-12-1/lltreaties-12-1.pdf#page=816), [402 U.N.T.S. 71](https://treaties.un.org/doc/Publication/UNTS/Volume%20402/volume-402-I-5778-English.pdf), [66–21](https://voteview.com/rollcall/RS0860390), Engle''s motion to put it off to January refused, [29–56](https://voteview.com/rollcall/RS0860389). Antarctica for peaceful purposes only: no bases, maneuvers or nuclear explosions; the parties'' observers free to inspect. Eisenhower ratifies Aug. 18.'
    n: 'Signed at Washington, Dec. 1, 1959, by the twelve; in force June 23, 1961. [[w.beck-international-politics-of-antarctica]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:engle-clair, name:eisenhower-dwight-d]
  - id: cal.1960-08-11.defense
    when: Aug. 11
    date: '1960-08-11'
    thread: defense
    c: 'Gates to Eisenhower, the Joint Chiefs split on targeting: a national target policy and a single integrated plan, drawn by a Director of Strategic Target Planning, the commander of SAC at Omaha, as an added duty. Burke appeals against it. Eisenhower: the first strike "must be simultaneous"; Gates to go ahead and bring the plan back in December.'
    n: '[FRUS 1958–60, III, doc. 113](https://history.state.gov/historicaldocuments/frus1958-60v03/d113). The first plan, SIOP-62, approved in December. [[w.rosenberg-origins-of-overkill]]; [[w.kaplan-wizards-of-armageddon]]; [[w.roman-eisenhower-and-the-missile]]; [[w.kistiakowsky-scientist-at-the-white]]. Check when the decision was made public. Names: Burke (K–J Adm. III.F); Eisenhower (Opp. III.E).'
    tags: [name:gates-thomas-s-jr, name:eisenhower-dwight-d, name:burke-arleigh-a]
  - id: cal.1960-08-11.space
    when: Aug. 11–19
    date: '1960-08-11'
    thread: space
    also: [defense]
    c: 'Discoverer XIII''s capsule taken from the Pacific, Aug. 11: the first object recovered from orbit. Eisenhower shown it at the White House, Aug. 15. Discoverer XIV''s caught in the air near Hawaii, Aug. 19: the first film from a Corona camera, more of the Soviet Union than all the U-2 flights.'
    n: '[Remarks Upon Inspection of the Capsule Retrieved from the Satellite Discoverer XIII](https://www.presidency.ucsb.edu/documents/remarks-upon-inspection-the-capsule-retrieved-from-the-satellite-discoverer-xiii) (Aug. 15); [Statement by the President on U.S. Achievements in Space](https://www.presidency.ucsb.edu/documents/statement-the-president-us-achievements-space) (Aug. 17). [[w.corona]]; [[w.eye-in-the-sky]]; [[w.mcdougall-heavens-and-the-earth]]; [[w.divine-sputnik-challenge]]. Made public: the Corona photographs declassified by Executive Order 12,951, Feb. 22, 1995. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-08-12.space
    when: Aug. 12
    date: '1960-08-12'
    thread: space
    c: 'Echo I, a 100-foot balloon, orbited from Cape Canaveral, Fla. Eisenhower''s recorded message sent from Goldstone, Calif., off the balloon to Holmdel, N.J.'
    n: '[Message Recorded for Transmission Via Communication Satellite Echo I](https://www.presidency.ucsb.edu/documents/message-recorded-for-transmission-via-communication-satellite-echo-i). [[w.galloway-politics-and-technology-of]]; [[w.mcdougall-heavens-and-the-earth]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-08-12.japan-and-korea
    when: Aug. 12–19
    date: '1960-08-12'
    thread: japan-and-korea
    c: 'Korea''s new Assembly elects Yun Po-sun President, Aug. 12, and confirms Chang Myon Prime Minister a week later. Check the dates.'
    n: '[Message to President Po Sun Yun of Korea](https://www.presidency.ucsb.edu/documents/message-president-po-sun-yun-korea); [Message to Prime Minister Chang Myon of Korea](https://www.presidency.ucsb.edu/documents/message-prime-minister-chang-myon-korea) (Aug. 29). FRUS 1958–60, XVIII, docs. [328](https://history.state.gov/historicaldocuments/frus1958-60v18/d328), [330](https://history.state.gov/historicaldocuments/frus1958-60v18/d330). [[w.brazinsky-nation-building-in-south]].'
    tags: [name:yun-po-sun, name:chang-myon]
  - id: cal.1960-08-16.latin-america
    when: Aug. 16–26
    date: '1960-08-16'
    thread: latin-america
    c: 'Foreign ministers of the American republics at San José, Costa Rica, Aug. 16–21. Trujillo''s government condemned for the attempt on Betancourt''s life, June 24; members to break relations with it and stop selling it arms. Eisenhower asks discretion to buy the Dominican share of Cuba''s cut quota elsewhere, Aug. 23. The United States breaks relations, Aug. 26.'
    n: '[Special Message to the Congress on the Sugar Quota of the Dominican Republic](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-sugar-quota-the-dominican-republic) (Aug. 23). [FRUS 1958–60, V, doc. 340](https://history.state.gov/historicaldocuments/frus1958-60v05/d340) (Herter and Tello, Aug. 16). [[w.rabe-eisenhower-and-latin-america]]; [[w.diederich-trujillo]]. Names: Trujillo (K–J Adm. III.J); Eisenhower (Opp. III.E).'
    tags: [name:betancourt-romulo, name:trujillo-rafael, name:eisenhower-dwight-d, name:herter-christian-a]
  - id: cal.1960-08-17.soviet-union
    when: Aug. 17–19
    date: '1960-08-17'
    thread: soviet-union
    c: Powers tried in Moscow before the Military Collegium of the Supreme Court. Pleads guilty. Ten years, three of them in prison.
    n: '[[w.powers-operation-overflight]]. See [[cal.1960-05-01.soviet-union]]. Names: Powers (K–J Adm. III.I).'
    tags: [name:powers-francis-gary]
  - id: cal.1960-08-18.congo-2
    when: Aug. 18
    date: '1960-08-18'
    thread: congo
    c: 'NSC on the Congo. Dillon: Lumumba serves the Soviets; Dulles: he is in Soviet pay. Eisenhower: the UN to stay in the Congo even if European troops must be asked for. Robert H. Johnson, the note-taker, testifies in 1975 that he heard the President say something he took as an order to kill Lumumba; the minutes record none.'
    n: '[FRUS 1958–60, XIV, doc. 180](https://history.state.gov/historicaldocuments/frus1958-60v14/d180) and its first note. [S. Rep. No. 94-465, 13–16, 55–60 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=24) (K–J Adm. II.H.3). [[w.kalb-congo-cables]]; [[w.weissman-american-foreign-policy-in]]; [[w.mahoney-jfk]]; [[w.namikas-battleground-africa]]; [[w.devlin-chief-of-station-congo]]; [[w.witte-de-moord-op-lumumba]]; [[w.gerard-death-in-the-congo]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Dillon (K–J Adm. III.H); Dulles (K–J Adm. III.I); Lumumba (K–J Adm. III.J); Eisenhower (Opp. III.E).'
    tags: [name:dillon-c-douglas, name:dulles-allen-w, name:lumumba-patrice, name:eisenhower-dwight-d, name:johnson-robert-h]
  - id: cal.1960-08-18.cuba
    when: Aug. 18
    date: '1960-08-18'
    thread: cuba
    c: 'Dulles and Bissell report to Eisenhower on the Cuba program: the exile front in Mexico, the Swan Island radio, some 500 Cubans to be trained in Guatemala. Eisenhower approves funds from the reserve, "so long as the Joint Chiefs, Defense, State and the CIA think we have a good chance of being successful."'
    n: '[FRUS 1958–60, VI, doc. 577](https://history.state.gov/historicaldocuments/frus1958-60v06/d577) (Gray''s memorandum). See [[cal.1960-03-17.cuba]]. Made public: FRUS 1958–60, VI (1991). Check for an earlier release. Names: Dulles, Bissell (K–J Adm. III.I); Eisenhower (Opp. III.E).'
    tags: [name:dulles-allen-w, name:bissell-richard-m-jr, name:eisenhower-dwight-d]
  - id: cal.1960-08-18.jobs-and-wages
    when: Aug. 18
    date: '1960-08-18'
    thread: jobs-and-wages
    c: 'Senate passes Kennedy''s minimum wage bill, [62–34](https://voteview.com/rollcall/RS0860402): $1.25 by the third year; coverage to about four million more workers, after hotels, motels, restaurants, and auto and farm implement dealers are excluded, [87–8](https://voteview.com/rollcall/RS0860400). The House bill of June 30, Kitchin''s substitute: $1.15, [341–72](https://voteview.com/rollcall/RH0860163).'
    n: 'H.R. 12677, 86th Cong. [Press Release of Senator John F. Kennedy, on Minimum Wage Bill](https://www.presidency.ucsb.edu/documents/press-release-senator-john-f-kennedy-minimum-wage-bill-washington-dc). [[w.sundquist-politics-and-policy]]; [[w.kallina-kennedy-v-nixon]]. Names: Kennedy (Viet. III.A).'
    tags: [name:kennedy-john-f, name:kitchin-alvin-p]
  - id: cal.1960-08-19.latin-america
    when: Aug. 19
    date: '1960-08-19'
    thread: latin-america
    c: Senate authorizes $500 million for Latin America's social development and $100 million for Chile's earthquake recovery, [54–19](https://voteview.com/rollcall/RS0860404).
    n: S. 3861, 86th Cong. See [[cal.1960-07-11.latin-america]].
  - id: cal.1960-08-22.cuba
    when: Aug. 22–29
    date: '1960-08-22'
    thread: cuba
    also: [latin-america]
    c: 'The foreign ministers'' second meeting at San José, on Peru''s request: the defense of the inter-American system against threats. The Cuban delegation walks out; the Declaration of San José approved, 19–0: any extracontinental intervention condemned. Cuba not named.'
    n: '[FRUS 1958–60, VI, doc. 578](https://history.state.gov/historicaldocuments/frus1958-60v06/d578). [FRUS 1958–60, V, doc. 342](https://history.state.gov/historicaldocuments/frus1958-60v05/d342) (Herter and López Mateos on it, Sept. 16). [[w.rabe-eisenhower-and-latin-america]]; [[w.paterson-contesting-castro]]; [[w.schoultz-that-infernal-little-cuban]].'
  - id: cal.1960-08-23.medicare
    when: Aug. 23–29
    date: '1960-08-23'
    thread: medicare
    also: [welfare]
    c: 'Senate rejects the Anderson–Kennedy amendment, hospital care for the aged through Social Security, [44–51](https://voteview.com/rollcall/RS0860407); Javits''s, federal-state matching, [28–67](https://voteview.com/rollcall/RS0860406). Passes the Kerr–Mills bill, grants for the medically needy aged, [91–2](https://voteview.com/rollcall/RS0860409). Conference report: House, Aug. 26, [369–17](https://voteview.com/rollcall/RH0860178); Senate, Aug. 29, [74–11](https://voteview.com/rollcall/RS0860412).'
    n: 'H.R. 12580, 86th Cong. [Statement by Senator John F. Kennedy on the Senate Floor on Medical Care for the Aged](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-the-senate-floor-medical-care-for-the-aged). [[w.morgan-robert-s-kerr]]. See [[cal.1960-03-31.medicare]]. Names: Anderson, Kerr (K–J Cong. III.B); Kennedy (Viet. III.A); Javits (K–J Cong. III.E); Mills (K–J Cong. III.D).'
    tags: [name:anderson-clinton-p, name:kennedy-john-f, name:javits-jacob-k, name:kerr-robert-s, name:mills-wilbur-d]
  - id: cal.1960-08-24.press-and-broadcasting
    when: Aug. 24
    date: '1960-08-24'
    thread: press-and-broadcasting
    also: [elections-1960]
    c: 'Section 315''s equal-time rule suspended for the nominees for President and Vice President in 1960, [74 Stat. 554](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg554-3.pdf). Broadcasters may give the two parties'' nominees time without giving it to the others. The FCC to report by Mar. 1, 1961.'
    n: 'S.J. Res. 207, 86th Cong. [[w.great-debates]]; [[w.equal-time]].'
  - id: cal.1960-08-24.elections-1960
    when: Aug. 24
    date: '1960-08-24'
    thread: elections-1960
    c: 'Eisenhower''s news conference. Asked for a major idea of Nixon''s he had adopted: "If you give me a week, I might think of one. I don''t remember."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-240) (Aug. 24, 1960). The campaign: [[w.white-making-of-the-president]]; [[w.kallina-kennedy-v-nixon]]; [[w.donaldson-first-modern-campaign]]; [[w.rorabaugh-real-making-of-the]]; [[w.matthews-kennedy-and-nixon]]; [[w.pietrusza-1960]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]; [[w.nixon-six-crises]]. Names: Eisenhower, Nixon (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m]
  - id: cal.1960-08-24.foreign-aid
    when: Aug. 24–26
    date: '1960-08-24'
    thread: foreign-aid
    c: 'Senate restores $297 million of the House''s mutual security cuts and adds $100 million to the contingency fund, [67–26](https://voteview.com/rollcall/RS0860410). The conference keeps $31 million of the restoration. Eisenhower asks it sent back, Aug. 26; the Senate adopts the report, [57–24](https://voteview.com/rollcall/RS0860411).'
    n: 'H.R. 12619, 86th Cong. [Statement by the President Concerning Mutual Security Appropriations](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-mutual-security-appropriations); [Letter to the Majority and Minority Leaders of the Senate](https://www.presidency.ucsb.edu/documents/letter-the-majority-and-minority-leaders-the-senate-mutual-security-appropriations) (Aug. 26). [[w.kaufman-trade-and-aid]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-08-25.congo
    when: Aug. 25–26
    date: '1960-08-25'
    thread: congo
    c: 'Special Group, Aug. 25: Gray reports "extremely strong feelings" for "very straightforward action"; planning not to rule out "consideration" of any activity "which might contribute to getting rid of Lumumba." Dulles to the station in Léopoldville, Aug. 26: "his removal must be an urgent and prime objective."'
    n: '[FRUS 1964–68, XXIII, docs. 12](https://history.state.gov/historicaldocuments/frus1964-68v23/d12) (the minutes), [14](https://history.state.gov/historicaldocuments/frus1964-68v23/d14) (the cable, dated Aug. 27). [S. Rep. No. 94-465, 14–15 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=25) (K–J Adm. II.H.3). See [[cal.1960-08-18.congo-2]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Dulles (K–J Adm. III.I); Lumumba (K–J Adm. III.J).'
    tags: [name:gray-gordon, name:dulles-allen-w, name:lumumba-patrice, name:devlin-lawrence-r]
  - id: cal.1960-08-25.space
    when: Aug. 25
    date: '1960-08-25'
    thread: space
    also: [defense]
    c: 'Special NSC meeting. Eisenhower approves the panel''s report on satellite reconnaissance: a recoverable camera satellite at very high priority, the program under a civilian office reporting to the Secretary of Defense.'
    n: 'FRUS 1958–60, III, docs. [115](https://history.state.gov/historicaldocuments/frus1958-60v03/d115), [116](https://history.state.gov/historicaldocuments/frus1958-60v03/d116) (the report), [117](https://history.state.gov/historicaldocuments/frus1958-60v03/d117) (the actions). [[w.kistiakowsky-scientist-at-the-white]], 387–388. See [[cal.1960-08-11.space]]. Made public: the National Reconnaissance Office''s existence, Sept. 18, 1992. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:kistiakowsky-george-b, name:gates-thomas-s-jr]
  - id: cal.1960-08-27.sit-ins
    when: Aug. 27
    date: '1960-08-27'
    thread: sit-ins
    c: 'Jacksonville. White men with ax handles and baseball bats attack Negro youths of the NAACP''s Youth Council after their sit-ins downtown; fighting in Hemming Park and the streets.'
    n: '[[w.bartley-keeping-the-faith]]. See [[cal.1960-02-01.sit-ins]].'
  - id: cal.1960-08-29.elections-1960
    when: Aug. 29
    date: '1960-08-29'
    thread: elections-1960
    c: Nixon into Walter Reed, the knee he struck on a car door at Greensboro, Aug. 17, infected. In the hospital to Sept. 9.
    n: '[Press Conference of Vice President Nixon, WFMY-TV, Greensboro, NC](https://www.presidency.ucsb.edu/documents/press-conference-vice-president-nixon-wfmy-tv-greensboro-nc) (Aug. 17). [[w.nixon-six-crises]]. See [[cal.1960-08-24.elections-1960]]. Names: Nixon (Opp. III.E).'
    tags: [name:nixon-richard-m]
