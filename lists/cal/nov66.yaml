# Cal. LXXXIV November 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXIV
entries:
  - id: cal.1966-11-01.vietnam
    when: Nov. 1–2
    date: '1966-11-01'
    thread: vietnam
    also: [japan-and-korea]
    c: 'Seoul, from Oct. 31. Johnson and Park, Nov. 1; Johnson to the National Assembly, and their joint statement, Nov. 2. To Anchorage the same day, across the date line: the Fish Protein Concentrate Act signed there. At Dulles that night, the trip''s end: 31,500 miles, seven nations, seventeen days.'
    n: '[Joint Statement Following Discussions With President Park of Korea](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-park-korea); [Remarks Before the Korean National Assembly, Seoul, Korea](https://www.presidency.ucsb.edu/documents/remarks-before-the-korean-national-assembly-seoul-korea); [Remarks at Dulles International Airport Upon Returning From the Asian-Pacific Trip](https://www.presidency.ucsb.edu/documents/remarks-dulles-international-airport-upon-returning-from-the-asian-pacific-trip) (Nov. 2, 1966). [Remarks Upon Signing Bills Relating to Health and Education](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bills-relating-health-and-education) (Nov. 3, 1966) (the mileage). FRUS 1964–68, XXIX, pt. 1, doc. [96](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d96). See [[cal.1966-10-17.vietnam]].'
    tags: [name:johnson-lyndon-b, name:park-chung-hee]
  - id: cal.1966-11-02.cuba
    when: Nov. 2
    date: '1966-11-02'
    thread: cuba
    also: [immigration]
    c: 'Cuban Adjustment Act signed, [80 Stat. 1161](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1161.pdf): a native or citizen of Cuba admitted or paroled since Jan. 1, 1959, and present two years may be made a permanent resident, at the Attorney General''s discretion, his residence dated from thirty months before. Nov. 10, Johnson waives the $25 fee: some 123,000 eligible, about 4,000 more a month.'
    n: '[Statement by the President Upon Directing the Waiver of Permanent Resident Application Fees for Cuban Refugees](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-directing-the-waiver-permanent-resident-application-fees-for) (Nov. 10, 1966). [[w.garcia-havana-usa]]; [[w.masud-piloto-from-welcomed-exiles-to]]. See [[cal.1965-11-06.cuba]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-03.cities-and-housing
    when: Nov. 3
    date: '1966-11-03'
    thread: cities-and-housing
    c: 'Demonstration Cities and Metropolitan Development Act signed in the East Room, with the clean water act, [80 Stat. 1255](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1255.pdf): grants for comprehensive city demonstration programs, $12 million a year for planning in fiscal 1967 and 1968, then $400 million for 1968 and $500 million for 1969; grants and guarantees for metropolitan planning and new communities. Weaver and Wood to run it.'
    n: 'Statute (K–J Cong. II.J.2). [Remarks Upon Signing the Demonstration Cities Bill and the Clean Water Restoration Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-demonstration-cities-bill-and-the-clean-water-restoration-bill) (Nov. 3, 1966). See [[cal.1966-01-26.cities-and-housing]]. Names: Weaver (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:wood-robert-c]
  - id: cal.1966-11-03.conservation
    when: Nov. 3
    date: '1966-11-03'
    thread: conservation
    c: 'Clean Water Restoration Act signed, [80 Stat. 1246](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1246.pdf), Muskie''s bill: sewage-treatment grants authorized at $450 million for fiscal 1968, rising to $1.25 billion for 1971, $3.4 billion in four years; a study of the Nation''s estuaries.'
    n: '[Remarks Upon Signing the Demonstration Cities Bill and the Clean Water Restoration Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-demonstration-cities-bill-and-the-clean-water-restoration-bill) (Nov. 3, 1966). [[w.milazzo-unlikely-environmentalists]]. See [[cal.1965-10-02.conservation]]. Names: Muskie (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:muskie-edmund-s]
  - id: cal.1966-11-03.school-aid
    when: Nov. 3
    date: '1966-11-03'
    thread: school-aid
    also: [health]
    c: 'Four bills signed in the East Room, the morning after the trip: the Elementary and Secondary Education Amendments, [80 Stat. 1191](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1191.pdf), with a new title for the education of handicapped children; the Higher Education Amendments, [80 Stat. 1240](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1240.pdf); the Comprehensive Health Planning and Public Health Service Amendments, [80 Stat. 1180](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1180-2.pdf), grants to the States for health planning and services in place of grants disease by disease (Check); the Allied Health Professions Personnel Training Act, [80 Stat. 1222](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1222.pdf).'
    n: '[Remarks Upon Signing Bills Relating to Health and Education](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bills-relating-health-and-education) (Nov. 3, 1966). [[w.graham-uncertain-triumph]]. See [[cal.1965-04-11.school-aid]]; [[cal.1965-11-08.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-03.program
    when: Nov. 3
    date: '1966-11-03'
    thread: program
    c: 'Fair Packaging and Labeling Act signed in the East Room, [80 Stat. 1296](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1296.pdf), Hart''s bill: a package''s net contents stated in a uniform place on its principal display panel; HEW to write the rules for foods, drugs and cosmetics, the Federal Trade Commission for other goods; voluntary standards against needless package sizes (Check). With it the Child Protection Act, [80 Stat. 1303](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1303.pdf): hazardous toys and children''s articles banned from interstate commerce.'
    n: '[Remarks at the Signing of the Truth-in-Packaging and Child Protection Bills](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-truth-packaging-and-child-protection-bills) (Nov. 3, 1966). [[w.peterson-restless]]. See [[cal.1964-02-05.program]]. Names: Hart (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:hart-philip-a]
  - id: cal.1966-11-03.succession
    when: Nov. 3–19
    date: '1966-11-03'
    thread: succession
    c: 'Johnson announces an operation, on his doctors'' advice: a bulge at the scar of last year''s gall bladder operation to be repaired, a polyp removed from his throat. Burkley: no sign of a serious problem. Both done at Bethesda Naval Hospital Nov. 16. Nov. 19, to the ranch, his voice hoarse; there until Congress meets.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1179) (Nov. 3, 1966); [The President''s Meeting With the Press on His Departure From the Hospital](https://www.presidency.ucsb.edu/documents/the-presidents-meeting-with-the-press-his-departure-from-the-hospital) (Nov. 19, 1966). [[w.gilbert-mortal-presidency]]. See [[cal.1965-10-08.succession]].'
    tags: [name:johnson-lyndon-b, name:burkley-george-g]
  - id: cal.1966-11-04.elections-1966
    when: Nov. 4
    date: '1966-11-04'
    thread: elections-1966
    also: [vietnam]
    c: 'News conference. Asked of Nixon''s statement of Nov. 3, that the Manila communiqué''s terms for withdrawal would leave South Vietnam to the Viet Cong: "I do not want to get into a debate on a foreign policy meeting in Manila with a chronic campaigner like Mr. Nixon." His habit to find fault with his government "during a period of October every 2 years." On the House, now 295–140: a loss of 40 or 50 seats, the average since 1890, would not stop the program.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1180) (Nov. 4, 1966). [[w.perlstein-nixonland-2008]]; [[w.witcover-resurrection-of-richard-nixon]]. See [[cal.1966-10-17.vietnam]]. Names: Nixon (Opp. III.E).'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1966-11-04.opinion
    when: Nov. 4
    date: '1966-11-04'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, special survey, a secret ballot for the candidate or party one would like to see win: Democratic 52 percent, Republican 48. Midwest: Republican 55, Democratic 45.'
    n: '[[w.gallup-poll]], III, 2035.'
  - id: cal.1966-11-05.conservation
    when: Nov. 5
    date: '1966-11-05'
    thread: conservation
    c: 'Indiana Dunes National Lakeshore Act signed, [80 Stat. 1309](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1309.pdf), the statement released at San Antonio: thirteen miles of dunes and shore on Lake Michigan kept for public use. Douglas''s bill, S. 360; the Park Service had proposed it in 1916.'
    n: '[Statement by the President Upon Signing Bill Establishing the Indiana Dunes National Lakeshore](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-establishing-the-indiana-dunes-national) (Nov. 5, 1966). [[w.franklin-duel-for-the-dunes]]; [[w.douglas-in-the-fullness-of]]. Names: Douglas (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:douglas-paul-h]
  - id: cal.1966-11-06.transportation
    when: Nov. 6
    date: '1966-11-06'
    thread: transportation
    c: 'News conference at Fredericksburg, Tex. Boyd, Under Secretary of Commerce for Transportation, to be the first Secretary of Transportation, his nomination to go to the Senate in January. The department: 31 agencies and bureaus, nearly 100,000 employees, almost $6 billion.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1183) (Nov. 6, 1966). See [[cal.1966-03-02.transportation]]. Names: Boyd (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:boyd-alan-s]
  - id: cal.1966-11-07.opinion
    when: Nov. 7
    date: '1966-11-07'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, final poll, Oct. 31–Nov. 5: the party one would like to see win the congressional district: Democratic 52.5 percent, Republican 47.5; no opinion 4. Outside the South, 50 and 50.'
    n: '[[w.gallup-poll]], III, 2035.'
  - id: cal.1966-11-08.elections-1966
    when: Nov. 8
    date: '1966-11-08'
    thread: elections-1966
    also: [georgia, states-and-cities]
    c: 'Midterms. House 248 D–187 R, from 295–140 at the 89th''s opening: Republicans up 47. Senate 64 D–36 R, three seats to the Republicans: Percy over Douglas in Illinois, 54.9 percent; Hatfield in Oregon; Baker in Tennessee. Brooke, Massachusetts'' attorney general, over Peabody, 60.7: the first Negro elected to the Senate by popular vote. Governors: Republicans 25, up eight. Reagan over Brown in California, 57.6. Rockefeller a third term in New York, 44.6 in a field of four; Romney re-elected in Michigan, 60.5. Agnew in Maryland; Winthrop Rockefeller in Arkansas and Kirk in Florida, their States'' first Republican governors since Reconstruction; Lurleen Wallace in Alabama. Georgia: Callaway (R) 46.5, Maddox (D) 46.2, write-ins for Arnall 7.1 (Check): no majority; the General Assembly to choose.'
    n: '[*Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf) (Clerk of the House, 1967). [The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-11) (Nov. 10, 1966): "We thought that we would lose one. We lost three." Governors'' figures: Wikipedia''s tables of each race (Check against the States'' canvasses). [[w.dallek-right-moment]]; [[w.cannon-governor-reagan]]; [[w.rarick-california-rising]]; [[w.brooke-bridging-the-divide]]; [[w.douglas-in-the-fullness-of]]; [[w.smith-on-his-own-terms]]; [[w.ward-arkansas-rockefeller]]; [[w.witcover-white-knight]]; [[w.short-everything-is-pickrick]]; [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.kabaservice-rule-and-ruin]]; [[w.savage-jfk-lbj-and-the]]. See [[cal.1966-01-04.states-and-cities]]; [[cal.1966-11-04.elections-1966]]. Names: Percy, Hatfield, Brooke (Opp. III.B); Douglas (K–J Cong. III.B); Baker (Cong. III.C); Reagan, Rockefeller, Romney, Agnew, Winthrop Rockefeller, Kirk (Opp. III.H); Brown, Maddox (K–J Cong. III.F); Callaway (Opp. III.D); Wallace (K–J Cong. III.K); Arnall (K–J Cong. III.K).'
    tags: [election:1966, name:percy-charles-h, name:douglas-paul-h, name:hatfield-mark-o, name:baker-howard-h-jr, name:brooke-edward-w, name:peabody-endicott, name:reagan-ronald, name:brown-edmund-g, name:rockefeller-nelson, name:romney-george-w, name:agnew-spiro-t, name:rockefeller-winthrop, name:kirk-claude-r-jr, name:callaway-howard-h, name:maddox-lester, name:wallace-lurleen-b, name:arnall-ellis]
  - id: cal.1966-11-08.specials
    when: Nov. 8
    date: '1966-11-08'
    thread: specials
    c: Arkansas 4th, special. Pryor (D) holds the seat Oren Harris left Feb. 2 for the federal bench, 64.5 to 35.5 over Lowe (R); the same day, the full term. Harris unopposed in 1964.
    n: 'Votes: CQ Guide 6th (2010) 1277. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1966-11-08-h-AR-4, name:pryor-david-h, name:harris-oren]
  - id: cal.1966-11-08.specials-2
    when: Nov. 8
    date: '1966-11-08'
    thread: specials
    c: Michigan 9th, special. Vander Jagt (R) holds Griffin's seat, 66.6 to 33.4 over Dongvillo (D); the same day, the full term. Griffin resigned May 10, appointed to the Senate on Patrick McNamara's death; elected to it the same day. Swing 9.2 to R.
    n: 'Votes: CQ Guide 6th (2010) 1278. See [[cal.1961-04-04.states-and-cities]]. Names: Griffin (Opp. III.B).'
    tags: [special:1966-11-08-h-MI-9, name:vander-jagt-guy-a, name:griffin-robert-p, name:mcnamara-patrick-v]
  - id: cal.1966-11-08.economy
    when: Nov. 8
    date: '1966-11-08'
    thread: economy
    c: 'The investment tax credit on machinery and equipment, and accelerated depreciation on buildings, suspended, [80 Stat. 1508](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1508.pdf): asked Sept. 8 against inflation and tight money; restored by law in January 1968. Johnson''s statement: long-term interest rates down about a quarter point from their summer peaks.'
    n: '[Statement by the President Upon Signing Bill Suspending the Investment Tax Credit and Accelerated Depreciation Allowance](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-suspending-the-investment-tax-credit-and) (Nov. 8, 1966). [[w.collins-more]]; [[w.zelizer-taxing-america]]; [[w.okun-political-economy-of-prosperity]]. See [[cal.1965-12-05.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-08.crime-and-hijacking
    when: Nov. 8
    date: '1966-11-08'
    thread: crime-and-hijacking
    c: 'Narcotic Addict Rehabilitation Act signed, [80 Stat. 1438](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1438.pdf): an addict charged with a federal crime may be committed for treatment in place of prosecution; one convicted, sentenced to treatment; one not charged, committed at his own or a relative''s request (Check). With it a National Commission on Reform of Federal Criminal Laws, [80 Stat. 1516](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1516.pdf), and the Law Enforcement Assistance Act extended to 1970, [80 Stat. 1506](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1506.pdf).'
    n: '[Statement by the President Upon Signing Bills To Aid in the Crusade Against Crime](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bills-aid-the-crusade-against-crime) (Nov. 8, 1966). [[w.musto-quest-for-drug-control]]; [[w.flamm-law-and-order]]. See [[cal.1965-09-22.crime-and-hijacking]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-08.poverty
    when: Nov. 8
    date: '1966-11-08'
    thread: poverty
    c: 'Economic Opportunity Amendments signed, [80 Stat. 1451](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1451.pdf), the statement released at San Antonio: $1.75 billion authorized for fiscal 1967, $846 million of it for community action; sums set program by program, Head Start and legal services named.'
    n: '[Statement by the President Upon Signing Bill To Provide for Continued Progress in the Nation''s War on Poverty](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-provide-for-continued-progress-the-nations-war) (Nov. 8, 1966). [[w.davies-from-opportunity-to-entitlement]]. See [[cal.1965-10-09.poverty]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-08.governors
    when: Nov. 8
    date: '1966-11-08'
    thread: governors
    also: [elections-1966]
    c: 'Thirty-five governors elected: Republicans 23, Democrats 12. Republicans took ten States, Democrats two. Reagan (R) over Governor Brown in California; Rockefeller (R) re-elected in New York; Winthrop Rockefeller (R) in Arkansas and Kirk (R) in Florida, each State''s first Republican governor since Reconstruction; Agnew (R) over Mahoney in Maryland; Lurleen Wallace (D) in Alabama. Georgia: no majority; to the legislature. Governorships after the election: 25 each.'
    n: '[Wikipedia, "1966 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1966_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.sabato-goodbye-to-good-time]]. See [[cal.1966-11-08.elections-1966]]. Names: Brown (K–J Cong. III.F); Reagan, Nelson Rockefeller, Winthrop Rockefeller, Kirk, Agnew (Opp. III.H); Mahoney, Lurleen Wallace (K–J Cong. III.K).'
    tags: [governors:1966-11-08, name:reagan-ronald, name:brown-edmund-g, name:rockefeller-nelson, name:rockefeller-winthrop, name:kirk-claude-r-jr, name:agnew-spiro-t, name:mahoney-george-p, name:wallace-lurleen-b]
  - id: cal.1966-11-10.india-and-china
    when: Nov. 10–Dec. 22
    date: '1966-11-10'
    thread: india-and-china
    also: [foreign-aid, farm]
    c: 'Grain for India, after a second failed monsoon. Nov. 10, Johnson to Freeman, by telephone, on his recommendation of a further allocation: "I can''t do that and feed India another year. I''m not going to unless Congress does." Freeman''s team, Nov. 27: India has met most of its Rome commitments. Poage, Dole and Jack Miller, sent to India, recommend 1.8 million tons, Dec. 20. Dec. 22, Freeman announces 900,000 tons, half wheat, half sorghum, "on a low key basis."'
    n: 'FRUS 1964–68, XXV, docs. [389](https://history.state.gov/historicaldocuments/frus1964-68v25/d389), [393](https://history.state.gov/historicaldocuments/frus1964-68v25/d393), [404](https://history.state.gov/historicaldocuments/frus1964-68v25/d404), [407](https://history.state.gov/historicaldocuments/frus1964-68v25/d407). [[w.ahlberg-transplanting-the-great-society]]; [[w.kux-india-and-the-united]]; [[w.mcmahon-cold-war-on-the]]. Made public: the telephone conversation, the LBJ Library''s recordings, and FRUS 1964–68, XXV, doc. 389. See [[cal.1966-01-10.india-and-china]]. Names: Freeman (K–J Adm. III.G); Dole (Opp. III.D).'
    tags: [name:johnson-lyndon-b, name:freeman-orville-l, name:poage-william-r, name:dole-bob, name:miller-jack-r]
  - id: cal.1966-11-11.vietnam
    when: Nov. 11–17
    date: '1966-11-11'
    thread: vietnam
    c: 'Force levels. McNamara to Wheeler, Nov. 11: the Joint Chiefs'' plan of 504,000 Americans in South Vietnam by December 1967 and 522,200 by June 1968 cut, for planning, to 463,300 and 469,300; South Vietnam''s inflation the reason. Nov. 14, to Johnson: the barrier south of the 17th parallel to go ahead, fences, wire, mines and sensors some 30 kilometers west from the sea, an air barrier beyond. Nov. 17, his draft memorandum: 469,000 by June 30, 1968; a supplemental of $12.4 billion in January.'
    n: 'FRUS 1964–68, IV, docs. [301](https://history.state.gov/historicaldocuments/frus1964-68v04/d301), [307](https://history.state.gov/historicaldocuments/frus1964-68v04/d307), [312](https://history.state.gov/historicaldocuments/frus1964-68v04/d312). [[w.drea-mcnamara-clifford-and-the-2011]]; [[w.gibbons-u-s-government-and-1995]]; [[w.shapley-promise-and-power]]. Made public: [[w.pentagon-papers]], IV, 133–35, 364–85. Names: McNamara, Wheeler (K–J Adm. III.F).'
    tags: [name:mcnamara-robert-s, name:wheeler-earle, name:johnson-lyndon-b]
  - id: cal.1966-11-11.foreign-aid
    when: Nov. 11
    date: '1966-11-11'
    thread: foreign-aid
    also: [farm]
    c: 'Food for Peace Act of 1966 signed, [80 Stat. 1526](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1526.pdf), the "Food for Freedom" of the February message: sales for foreign currencies to give way to sales for dollars on credit; a country''s own efforts at food production and population to be weighed. Johnson''s statement, Nov. 12: agreements only after "carefully considering" self-help; the surpluses "are gone."'
    n: '[Statement by the President Upon Signing the Food for Peace Act of 1966](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-food-for-peace-act-1966) (Nov. 12, 1966). [[w.ahlberg-transplanting-the-great-society]]. See [[cal.1964-10-08.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-11.space
    when: Nov. 11–15
    date: '1966-11-11'
    thread: space
    c: 'Gemini 12, the program''s last flight: Lovell and Aldrin, four days, docked with an Agena. Aldrin outside the capsule five and a half hours in three periods. Johnson''s statement from Bethesda Naval Hospital: ten flights with two men in orbit, all brought home. Nov. 23, at the ranch, the program''s awards.'
    n: '[Statement by the President Following the Completion of the Final Flight in the Gemini Program](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-completion-the-final-flight-the-gemini-program) (Nov. 15, 1966); [Remarks at an Award Ceremony at the LBJ Ranch Marking the Conclusion of the Gemini Space Program](https://www.presidency.ucsb.edu/documents/remarks-award-ceremony-the-lbj-ranch-marking-the-conclusion-the-gemini-space-program) (Nov. 23, 1966). [[w.hacker-on-the-shoulders-of]]. See [[cal.1965-12-15.space]]. Names: Aldrin (K–J Cong. III.K).'
    tags: [name:johnson-lyndon-b, name:lovell-james-a-jr, name:aldrin-edwin-e-jr]
  - id: cal.1966-11-13.program
    when: Nov. 13
    date: '1966-11-13'
    thread: program
    c: 'Foreign Investors Tax Act signed, [80 Stat. 1539](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1539.pdf). Its Title III, the Presidential Election Campaign Fund Act, Long''s: a taxpayer may direct $1 of his tax to a fund for the presidential campaigns, the Comptroller General its keeper, a bipartisan board to advise. Johnson: "only a beginning"; the disclosure bill of May to be asked again.'
    n: '[Statement by the President Upon Signing the Foreign Investors Tax Act and the Presidential Election Campaign Fund Act](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-investors-tax-act-and-the-presidential) (Nov. 13, 1966). [[w.mann-legacy-to-power]]; [[w.zelizer-on-capitol-hill]]. Names: Long (K–J Cong. III.A).'
    tags: [name:johnson-lyndon-b, name:long-russell-b]
  - id: cal.1966-11-13.crime-and-hijacking
    when: Nov. 13
    date: '1966-11-13'
    thread: crime-and-hijacking
    c: 'The District of Columbia crime bill, passed in the session''s last hours, vetoed by memorandum: a suspect held for questioning four hours without arrest, six after it before he is taken to a magistrate; any witness at the scene held as a material witness. "I cannot approve it."'
    n: '[Memorandum of Disapproval of the District of Columbia Crime Bill](https://www.presidency.ucsb.edu/documents/memorandum-disapproval-the-district-columbia-crime-bill) (Nov. 13, 1966). [[w.flamm-law-and-order]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-13.opinion
    when: Nov. 13
    date: '1966-11-13'
    thread: opinion
    also: [vietnam, europe-and-the-alliance]
    c: 'Gallup''s affiliates in three countries: the United States should begin to withdraw its troops, carry on at its present level of fighting, or increase its attacks on North Vietnam. France: 68, 8, 5 percent. West Germany: 51, 19, 15. Australia: 21, 43, 24.'
    n: '[[w.gallup-poll]], III, 2035.'
  - id: cal.1966-11-14.court
    when: Nov. 14
    date: '1966-11-14'
    thread: court
    c: '*Adderley v. Florida*, [385 U.S. 39](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385039/usrep385039.pdf): the trespass convictions of 32 Florida A&M students, of some 200 who demonstrated on the Leon County jail''s grounds at Tallahassee against their schoolmates'' arrest, affirmed. Black for the Court, 5–4: a jail is built for security, not open to the public; the sheriff could order them off. Douglas, with Warren, Brennan and Fortas, dissenting.'
    n: '[[w.powe-warren-court-and-american]]; [[w.kalman-long-reach-of-the-2017]]. Names: Black, Douglas, Warren, Brennan, Fortas (K–J Cong. III.G).'
    tags: [name:black-hugo-l, name:douglas-william-o, name:warren-earl, name:brennan-william-j-jr, name:fortas-abe]
  - id: cal.1966-11-16.opinion
    when: Nov. 16
    date: '1966-11-16'
    thread: opinion
    also: [elections-1966, elections-1968]
    c: 'Gallup, Oct. 21–26: can identify Reagan, 75 percent; college-educated 94, grade school 50; West 84, South 63. Of them: favorable 54, unfavorable 18.'
    n: '[[w.gallup-poll]], III, 2035–36. See [[cal.1966-11-08.elections-1966]]. Names: Reagan (Opp. III.F).'
    tags: [name:reagan-ronald]
  - id: cal.1966-11-17.georgia
    when: Nov. 17
    date: '1966-11-17'
    thread: georgia
    also: [elections-1966]
    c: 'A three-judge federal court at Atlanta: the constitution''s choice of a governor by the General Assembly, from the two highest, where no candidate has a majority, denies the voters equal protection. The Assembly enjoined from choosing between Callaway and Maddox.'
    n: '*Morris v. Fortson*, [262 F. Supp. 93](https://static.case.law/f-supp/262/case-pdfs/0093-01.pdf) (N.D. Ga. 1966). *Fortson v. Morris* (Opp. II.H.1). [[w.short-everything-is-pickrick]]; [[w.kruse-white-flight]]. See [[cal.1966-11-08.elections-1966]]. Names: Callaway (Opp. III.D); Maddox (K–J Cong. III.F).'
    tags: [name:callaway-howard-h, name:maddox-lester]
