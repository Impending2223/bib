# Cal. LXXXIV November 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXIV
entries:
  - id: cal.1966-11-01.vietnam
    when: Nov. 1–2
    date: '1966-11-01'
    thread: vietnam
    also: [japan-and-korea]
    c: 'Seoul, from Oct. 31. Johnson and Park, Nov. 1; Johnson to the National Assembly, and their joint statement, Nov. 2. To Anchorage the same day, across the date line: the Fish Protein Concentrate Act signed there. At Dulles that night, the trip''s end: 31,500 miles, seven nations, seventeen days.'
    n: '[Joint Statement Following Discussions With President Park of Korea](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-park-korea); [Remarks Before the Korean National Assembly, Seoul, Korea](https://www.presidency.ucsb.edu/documents/remarks-before-the-korean-national-assembly-seoul-korea); [Remarks at Dulles International Airport Upon Returning From the Asian-Pacific Trip](https://www.presidency.ucsb.edu/documents/remarks-dulles-international-airport-upon-returning-from-the-asian-pacific-trip) (Nov. 2, 1966). [Remarks Upon Signing Bills Relating to Health and Education](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bills-relating-health-and-education) (Nov. 3, 1966) (the mileage). FRUS 1964–68, XXIX, pt. 1, doc. [96](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d96). See [[cal.1966-10-17.vietnam]]. Names: Johnson (K–J Adm. III.D); Park Chung Hee (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:park-chung-hee]
  - id: cal.1966-11-02.cuba
    when: Nov. 2
    date: '1966-11-02'
    thread: cuba
    also: [immigration]
    c: 'Cuban Adjustment Act signed, [80 Stat. 1161](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1161.pdf): a native or citizen of Cuba admitted or paroled since Jan. 1, 1959, and present two years may be made a permanent resident, at the Attorney General''s discretion, his residence dated from thirty months before. Nov. 10, Johnson waives the $25 fee: some 123,000 eligible, about 4,000 more a month.'
    n: '[Statement by the President Upon Directing the Waiver of Permanent Resident Application Fees for Cuban Refugees](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-directing-the-waiver-permanent-resident-application-fees-for) (Nov. 10, 1966). [[w.garcia-havana-usa]]; [[w.masud-piloto-from-welcomed-exiles-to]]. See [[cal.1965-11-06.cuba]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-03.cities-and-housing
    when: Nov. 3
    date: '1966-11-03'
    thread: cities-and-housing
    c: 'Demonstration Cities and Metropolitan Development Act signed in the East Room, with the clean water act, [80 Stat. 1255](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1255.pdf): grants for comprehensive city demonstration programs, $12 million a year for planning in fiscal 1967 and 1968, then $400 million for 1968 and $500 million for 1969; grants and guarantees for metropolitan planning and new communities. Weaver and Wood to run it.'
    n: 'Statute (K–J Cong. II.J.2). [Remarks Upon Signing the Demonstration Cities Bill and the Clean Water Restoration Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-demonstration-cities-bill-and-the-clean-water-restoration-bill) (Nov. 3, 1966). See [[cal.1966-01-26.cities-and-housing]]. Names: Weaver, Wood (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:wood-robert-c]
  - id: cal.1966-11-03.conservation
    when: Nov. 3
    date: '1966-11-03'
    thread: conservation
    c: 'Clean Water Restoration Act signed, [80 Stat. 1246](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1246.pdf), Muskie''s bill: sewage-treatment grants authorized at $450 million for fiscal 1968, rising to $1.25 billion for 1971, $3.4 billion in four years; a study of the Nation''s estuaries.'
    n: '[Remarks Upon Signing the Demonstration Cities Bill and the Clean Water Restoration Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-demonstration-cities-bill-and-the-clean-water-restoration-bill) (Nov. 3, 1966). [[w.milazzo-unlikely-environmentalists]]. See [[cal.1965-10-02.conservation]]. Names: Muskie (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:muskie-edmund-s]
  - id: cal.1966-11-03.school-aid
    when: Nov. 3
    date: '1966-11-03'
    thread: school-aid
    also: [health]
    c: 'Four bills signed in the East Room, the morning after the trip: the Elementary and Secondary Education Amendments, [80 Stat. 1191](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1191.pdf), with a new title for the education of handicapped children; the Higher Education Amendments, [80 Stat. 1240](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1240.pdf); the Comprehensive Health Planning and Public Health Service Amendments, [80 Stat. 1180](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1180-2.pdf), grants to the States for health planning and services in place of grants disease by disease (Check); the Allied Health Professions Personnel Training Act, [80 Stat. 1222](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1222.pdf).'
    n: '[Remarks Upon Signing Bills Relating to Health and Education](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bills-relating-health-and-education) (Nov. 3, 1966). [[w.graham-uncertain-triumph]]. See [[cal.1965-04-11.school-aid]]; [[cal.1965-11-08.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-03.program
    when: Nov. 3
    date: '1966-11-03'
    thread: program
    c: 'Fair Packaging and Labeling Act signed in the East Room, [80 Stat. 1296](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1296.pdf), Hart''s bill: a package''s net contents stated in a uniform place on its principal display panel; HEW to write the rules for foods, drugs and cosmetics, the Federal Trade Commission for other goods; voluntary standards against needless package sizes (Check). With it the Child Protection Act, [80 Stat. 1303](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1303.pdf): hazardous toys and children''s articles banned from interstate commerce.'
    n: '[Remarks at the Signing of the Truth-in-Packaging and Child Protection Bills](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-truth-packaging-and-child-protection-bills) (Nov. 3, 1966). [[w.peterson-restless]]. See [[cal.1964-02-05.program]]. Names: Hart (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:hart-philip-a]
  - id: cal.1966-11-03.succession
    when: Nov. 3–19
    date: '1966-11-03'
    thread: succession
    c: 'Johnson announces an operation, on his doctors'' advice: a bulge at the scar of last year''s gall bladder operation to be repaired, a polyp removed from his throat. Burkley: no sign of a serious problem. Both done at Bethesda Naval Hospital Nov. 16. Nov. 19, to the ranch, his voice hoarse; there until Congress meets.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1179) (Nov. 3, 1966); [The President''s Meeting With the Press on His Departure From the Hospital](https://www.presidency.ucsb.edu/documents/the-presidents-meeting-with-the-press-his-departure-from-the-hospital) (Nov. 19, 1966). [[w.gilbert-mortal-presidency]]. See [[cal.1965-10-08.succession]]. Names: Johnson (K–J Adm. III.D); Burkley (K–J Adm. III.C).'
    tags: [name:johnson-lyndon-b, name:burkley-george-g]
  - id: cal.1966-11-04.elections-1966
    when: Nov. 4
    date: '1966-11-04'
    thread: elections-1966
    also: [vietnam]
    c: 'News conference. Asked of Nixon''s statement of Nov. 3, that the Manila communiqué''s terms for withdrawal would leave South Vietnam to the Viet Cong: "I do not want to get into a debate on a foreign policy meeting in Manila with a chronic campaigner like Mr. Nixon." His habit to find fault with his government "during a period of October every 2 years." On the House, now 295–140: a loss of 40 or 50 seats, the average since 1890, would not stop the program.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1180) (Nov. 4, 1966). [[w.perlstein-nixonland-2008]]; [[w.witcover-resurrection-of-richard-nixon]]. See [[cal.1966-10-17.vietnam]]. Names: Nixon (Opp. III.E); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1966-11-04.opinion
    when: Nov. 4
    date: '1966-11-04'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, special survey, a secret ballot for the candidate or party one would like to see win: Democratic 52 percent, Republican 48. Midwest: Republican 55, Democratic 45.'
    n: '[[w.gallup-poll]], III, 2035.'
  - id: cal.1966-11-05.conservation
    when: Nov. 5
    date: '1966-11-05'
    thread: conservation
    c: 'Indiana Dunes National Lakeshore Act signed, [80 Stat. 1309](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1309.pdf), the statement released at San Antonio: thirteen miles of dunes and shore on Lake Michigan kept for public use. Douglas''s bill, S. 360; the Park Service had proposed it in 1916.'
    n: '[Statement by the President Upon Signing Bill Establishing the Indiana Dunes National Lakeshore](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-establishing-the-indiana-dunes-national) (Nov. 5, 1966). [[w.franklin-duel-for-the-dunes]]; [[w.douglas-in-the-fullness-of]]. Names: Douglas (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:douglas-paul-h]
  - id: cal.1966-11-06.transportation
    when: Nov. 6
    date: '1966-11-06'
    thread: transportation
    c: 'News conference at Fredericksburg, Tex. Boyd, Under Secretary of Commerce for Transportation, to be the first Secretary of Transportation, his nomination to go to the Senate in January. The department: 31 agencies and bureaus, nearly 100,000 employees, almost $6 billion.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1183) (Nov. 6, 1966). See [[cal.1966-03-02.transportation]]. Names: Boyd (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:boyd-alan-s]
  - id: cal.1966-11-07.opinion
    when: Nov. 7
    date: '1966-11-07'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, final poll, Oct. 31–Nov. 5: the party one would like to see win the congressional district: Democratic 52.5 percent, Republican 47.5; no opinion 4. Outside the South, 50 and 50.'
    n: '[[w.gallup-poll]], III, 2035.'
  - id: cal.1966-11-08.elections-1966
    when: Nov. 8
    date: '1966-11-08'
    thread: elections-1966
    also: [georgia, states-and-cities]
    c: 'Midterms. House 248 D–187 R, from 295–140 at the 89th''s opening: Republicans up 47. Senate 64 D–36 R, three seats to the Republicans: Percy over Douglas in Illinois, 54.9 percent; Hatfield in Oregon; Baker in Tennessee. Brooke, Massachusetts'' attorney general, over Peabody, 60.7: the first Negro elected to the Senate by popular vote. Governors: Republicans 25, up eight. Reagan over Brown in California, 57.6. Rockefeller a third term in New York, 44.6 in a field of four; Romney re-elected in Michigan, 60.5. Agnew in Maryland; Winthrop Rockefeller in Arkansas and Kirk in Florida, their States'' first Republican governors since Reconstruction; Lurleen Wallace in Alabama. Georgia: Callaway (R) 46.5, Maddox (D) 46.2, write-ins for Arnall 7.1 (Check): no majority; the General Assembly to choose.'
    n: '[*Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf) (Clerk of the House, 1967). [The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-11) (Nov. 10, 1966): "We thought that we would lose one. We lost three." Governors'' figures: Wikipedia''s tables of each race (Check against the States'' canvasses). [[w.dallek-right-moment]]; [[w.cannon-governor-reagan]]; [[w.rarick-california-rising]]; [[w.brooke-bridging-the-divide]]; [[w.douglas-in-the-fullness-of]]; [[w.smith-on-his-own-terms]]; [[w.ward-arkansas-rockefeller]]; [[w.witcover-white-knight]]; [[w.short-everything-is-pickrick]]; [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.kabaservice-rule-and-ruin]]; [[w.savage-jfk-lbj-and-the]]. See [[cal.1966-01-04.states-and-cities]]; [[cal.1966-11-04.elections-1966]]. Names: Percy, Hatfield, Brooke (Opp. III.B); Douglas (K–J Cong. III.B); Baker (Cong. III.C); Reagan, Nelson Rockefeller, Romney, Agnew, Winthrop Rockefeller, Kirk (Opp. III.H); Brown, Maddox, Peabody (K–J Cong. III.F); Callaway (Opp. III.D); Lurleen Wallace, Arnall (K–J Cong. III.K).'
    tags: [election:1966, name:percy-charles-h, name:douglas-paul-h, name:hatfield-mark-o, name:baker-howard-h-jr, name:brooke-edward-w, name:peabody-endicott, name:reagan-ronald, name:brown-edmund-g, name:rockefeller-nelson, name:romney-george-w, name:agnew-spiro-t, name:rockefeller-winthrop, name:kirk-claude-r-jr, name:callaway-howard-h, name:maddox-lester, name:wallace-lurleen-b, name:arnall-ellis, state:ma]
  - id: cal.1966-11-08.specials
    when: Nov. 8
    date: '1966-11-08'
    thread: specials
    c: Arkansas 4th, special. Pryor (D) holds the seat Oren Harris left Feb. 2 for the federal bench, 64.5 to 35.5 over Lowe (R); the same day, the full term. Harris unopposed in 1964.
    n: 'Votes: CQ Guide 6th (2010) 1277. See [[cal.1961-04-04.states-and-cities]]. Names: Pryor, Harris (K–J Cong. III.D).'
    tags: [special:1966-11-08-h-AR-4, name:pryor-david-h, name:harris-oren]
  - id: cal.1966-11-08.specials-2
    when: Nov. 8
    date: '1966-11-08'
    thread: specials
    c: Michigan 9th, special. Vander Jagt (R) holds Griffin's seat, 66.6 to 33.4 over Dongvillo (D); the same day, the full term. Griffin resigned May 10, appointed to the Senate on Patrick McNamara's death; elected to it the same day. Swing 9.2 to R.
    n: 'Votes: CQ Guide 6th (2010) 1278. See [[cal.1961-04-04.states-and-cities]]. Names: Vander Jagt (Opp. III.D); Griffin (Opp. III.B); Patrick McNamara (K–J Cong. III.B).'
    tags: [special:1966-11-08-h-MI-9, name:vander-jagt-guy-a, name:griffin-robert-p, name:mcnamara-patrick-v]
  - id: cal.1966-11-08.economy
    when: Nov. 8
    date: '1966-11-08'
    thread: economy
    c: 'The investment tax credit on machinery and equipment, and accelerated depreciation on buildings, suspended, [80 Stat. 1508](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1508.pdf): asked Sept. 8 against inflation and tight money; restored by law in January 1968. Johnson''s statement: long-term interest rates down about a quarter point from their summer peaks.'
    n: '[Statement by the President Upon Signing Bill Suspending the Investment Tax Credit and Accelerated Depreciation Allowance](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-suspending-the-investment-tax-credit-and) (Nov. 8, 1966). [[w.collins-more]]; [[w.zelizer-taxing-america]]; [[w.okun-political-economy-of-prosperity]]. See [[cal.1965-12-05.economy]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-08.crime-and-hijacking
    when: Nov. 8
    date: '1966-11-08'
    thread: crime-and-hijacking
    c: 'Narcotic Addict Rehabilitation Act signed, [80 Stat. 1438](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1438.pdf): an addict charged with a federal crime may be committed for treatment in place of prosecution; one convicted, sentenced to treatment; one not charged, committed at his own or a relative''s request (Check). With it a National Commission on Reform of Federal Criminal Laws, [80 Stat. 1516](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1516.pdf), and the Law Enforcement Assistance Act extended to 1970, [80 Stat. 1506](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1506.pdf).'
    n: '[Statement by the President Upon Signing Bills To Aid in the Crusade Against Crime](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bills-aid-the-crusade-against-crime) (Nov. 8, 1966). [[w.musto-quest-for-drug-control]]; [[w.flamm-law-and-order]]. See [[cal.1965-09-22.crime-and-hijacking]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-08.poverty
    when: Nov. 8
    date: '1966-11-08'
    thread: poverty
    c: 'Economic Opportunity Amendments signed, [80 Stat. 1451](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1451.pdf), the statement released at San Antonio: $1.75 billion authorized for fiscal 1967, $846 million of it for community action; sums set program by program, Head Start and legal services named.'
    n: '[Statement by the President Upon Signing Bill To Provide for Continued Progress in the Nation''s War on Poverty](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-provide-for-continued-progress-the-nations-war) (Nov. 8, 1966). [[w.davies-from-opportunity-to-entitlement]]. See [[cal.1965-10-09.poverty]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-08.governors
    when: Nov. 8
    date: '1966-11-08'
    thread: governors
    also: [elections-1966]
    c: 'Thirty-five governors elected: Republicans 23, Democrats 12. Republicans took ten States, Democrats two. Reagan (R) over Governor Brown in California; Rockefeller (R) re-elected in New York; Winthrop Rockefeller (R) in Arkansas and Kirk (R) in Florida, each State''s first Republican governor since Reconstruction; Agnew (R) over Mahoney in Maryland; Lurleen Wallace (D) in Alabama. Georgia: no majority; to the legislature. Governorships after the election: 25 each.'
    n: '[Wikipedia, "1966 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1966_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.sabato-goodbye-to-good-time]]. See [[cal.1966-11-08.elections-1966]]. Names: Brown (K–J Cong. III.F); Reagan, Nelson Rockefeller, Winthrop Rockefeller, Kirk, Agnew (Opp. III.H); Mahoney, Lurleen Wallace (K–J Cong. III.K).'
    tags: [governors:1966-11-08, name:reagan-ronald, name:brown-edmund-g, name:rockefeller-nelson, name:rockefeller-winthrop, name:kirk-claude-r-jr, name:agnew-spiro-t, name:mahoney-george-p, name:wallace-lurleen-b]
  - id: cal.1966-11-08.alabama-al
    when: Nov. 8
    date: '1966-11-08'
    thread: alabama
    also: [governors, elections-1966]
    c: 'Alabama. Lurleen Wallace (D) elected governor over U.S. Representative James D. Martin (R), 537,505 to 262,943, 63.4 percent; an independent 47,655. Sparkman (D) re-elected to the Senate over John Grenier (R), 60.1 percent. Dallas County: Baker elected sheriff.'
    n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [625](https://archive.org/details/alabama-official-statistical-register-1967/page/n626)–[627](https://archive.org/details/alabama-official-statistical-register-1967/page/n628). [*Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf) (Clerk of the House, 1967). [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.bartley-southern-politics-and-the]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.jeffries-bloody-lowndes]]. See [[cal.1966-05-03.elections-1966]]; [[cal.1966-11-08.elections-1966]]. Names: Lurleen Wallace, Grenier, Wilson Baker (K–J Cong. III.K); Martin (Opp. III.I); Sparkman (K–J Cong. III.B).'
    tags: [state:al, name:wallace-lurleen-b, name:martin-james-d, name:sparkman-john, name:grenier-john, name:baker-wilson]
  - id: cal.1966-11-08.governors-ny
    when: Nov. 8
    date: '1966-11-08'
    thread: governors
    also: [elections-1966]
    c: New York. Rockefeller (R) elected to a third term, 2,690,626, 44.6 percent; O'Connor (D) 2,298,363, 38.1; Adams (Conservative) 513,023, 8.5; Franklin D. Roosevelt Jr. (Liberal) 507,234, 8.4. The Conservatives take the third line on the ballot from the Liberals.
    n: '[Wikipedia, "1966 New York state election"](https://en.wikipedia.org/wiki/1966_New_York_state_election). Check: the *Legislative Manual*, 1967. See [[cal.1966-09-07.governors-ny]]. Names: Rockefeller (Opp. III.H); O''Connor (K–J Cong. III.F); Paul Adams (K–J Cong. III.K); Roosevelt (K–J Adm. III.G).'
    tags: [state:ny, name:rockefeller-nelson, name:oconnor-frank-d, name:adams-paul-l, name:roosevelt-franklin-d-jr]
  - id: cal.1966-11-08.state-constitutions-ny
    when: Nov. 8
    date: '1966-11-08'
    thread: state-constitutions
    also: [legislatures, elections-1966]
    c: 'New York. Delegates to the constitutional convention of 1967 elected, fifteen at large from party lists and three from each Senate district: 99 Democrats, 82 Republicans, three Liberals, two Conservatives declared elected (Check). The legislature, under the court''s districts: Republicans keep the Senate, Democrats the Assembly (Check).'
    n: '[*New York Times*, Oct. 30, 1966](https://www.nytimes.com/1966/10/30/archives/atlarge-slate-may-control-constitutional-parley-15-to-be-elected.html); [Wikipedia, "1966 New York state election"](https://en.wikipedia.org/wiki/1966_New_York_state_election). [[w.dullea-charter-revision-in-the]]. See [[cal.1965-11-02.state-constitutions-ny]]; [[cal.1966-03-22.legislatures-ny]].'
    tags: [state:ny]
  - id: cal.1966-11-08.states-and-cities-nyc
    when: Nov. 8
    date: '1966-11-08'
    thread: states-and-cities
    also: [state-constitutions, crime-and-hijacking, elections-1966]
    c: 'New York City. The Patrolmen''s Benevolent Association''s amendment to the charter carries, nearly two to one (Check the vote): the civilian review board abolished; complaints against the police reviewed by five of the department''s own employees, named by Leary.'
    n: '[Wikipedia, "Howard R. Leary"](https://en.wikipedia.org/wiki/Howard_R._Leary). Check: the Board of Elections'' canvass. [[w.cannato-ungovernable-city]]; [[w.flamm-law-and-order]]; [[w.black-people-and-the-police]]; [[w.freeman-working-class-new-york]]. See [[cal.1966-07-11.crime-and-hijacking-nyc]]. Names: Leary (K–J Cong. III.K).'
    tags: [state:ny, city:nyc, name:leary-howard-r]
  - id: cal.1966-11-08.south-carolina-sc
    when: Nov. 8
    date: '1966-11-08'
    thread: south-carolina
    also: [governors, elections-1966]
    c: 'South Carolina. Governor: McNair (D) over Rogers (R), 58.2 percent, the first Republican to oppose a Democrat for governor since 1938. Senate: Thurmond, a Republican since 1964, re-elected, 62.2; Hollings (D) over Parker (R), 51.3, for Johnston''s unexpired term.'
    n: '[Clerk, *Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf), 39. Governor: [Wikipedia](https://en.wikipedia.org/wiki/1966_South_Carolina_gubernatorial_election); Check: *Supplemental Report of the Secretary of State* (1967), 18. [[w.kalk-origins-of-the-southern]]; [[w.black-rise-of-southern-republicans]]. See [[cal.1966-06-14.south-carolina-sc]]; [[cal.1966-11-08.elections-1966]]. Names: Thurmond (K–J Cong. III.B); McNair, Hollings (K–J Cong. III.F); Rogers, Parker (K–J Cong. III.K).'
    tags: [name:mcnair-robert-e, name:rogers-joseph-o-jr, name:thurmond-strom, name:hollings-ernest-f, name:parker-marshall-j, state:sc]
  - id: cal.1966-11-08.state-constitutions-la
    when: Nov. 8
    date: '1966-11-08'
