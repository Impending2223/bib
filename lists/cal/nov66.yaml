    n: '[Mass. *Election Statistics*, 1966 (P.D. 43), p. 8](https://archive.org/details/electionstatisti19651966mass/page/n81). See [[cal.1966-09-13.governors-ma]]; [[cal.1964-11-03.state-constitutions-ma]]; [[cal.1966-11-08.governors]]. Names: Volpe (Opp. III.H); McCormack (K–J Cong. III.K).'
    tags: [state:ma, name:volpe-john-a, name:mccormack-edward-j-jr]
  - id: cal.1966-11-08.state-and-city-finance-ma
    when: Nov. 8
    date: '1966-11-08'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: 'Massachusetts. The sales tax of 1966, 3 percent on retail sales, food, clothing and prescription medicines exempt, with a use tax and a Local Aid Fund for the cities and towns, in force since Apr. 1 and to run through 1967, put to the voters. Question 5, the law on referendum: yes 1,391,100, no 358,879. Question 6, the act by its title: yes 1,070,599, no 446,460.'
    n: '[Mass. *Election Statistics*, 1966 (P.D. 43), pp. 368–379](https://archive.org/details/electionstatisti19651966mass/page/n441). Passed by the House, 118–102, and the Senate, 21–16. [[w.hogarty-massachusetts-politics-and-public]]. Names: Volpe (Opp. III.H).'
    tags: [state:ma, name:volpe-john-a]
  - id: cal.1966-11-08.governors-me
    when: Nov. 8
    date: '1966-11-08'
    thread: governors
    also: [elections-1966]
    c: Maine. Curtis (D) over Reed (R), the governor, 172,036 to 151,802, 53.1 percent.
    n: '[Maine, "1966 General Election: Governor"](https://digitalmaine.com/tabulations_for_elections_1960s/47). [Wikipedia, "1966 Maine gubernatorial election"](https://en.wikipedia.org/wiki/1966_Maine_gubernatorial_election). See [[cal.1966-06-20.governors-me]]; [[cal.1966-11-08.governors]]. Names: Curtis (K–J Cong. III.F); Reed (Opp. III.H).'
    tags: [state:me, name:curtis-kenneth-m, name:reed-john-h]
  - id: cal.1966-11-10.india-and-china
    when: Nov. 10–Dec. 22
    date: '1966-11-10'
    thread: india-and-china
    also: [foreign-aid, farm]
    c: 'Grain for India, after a second failed monsoon. Nov. 10, Johnson to Freeman, by telephone, on his recommendation of a further allocation: "I can''t do that and feed India another year. I''m not going to unless Congress does." Freeman''s team, Nov. 27: India has met most of its Rome commitments. Poage, Dole and Jack Miller, sent to India, recommend 1.8 million tons, Dec. 20. Dec. 22, Freeman announces 900,000 tons, half wheat, half sorghum, "on a low key basis."'
    n: '[Johnson and Freeman, 3:36 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-orville-freeman-november-10-1966), Conversation WH6611-02-11027 (Miller Center). FRUS 1964–68, XXV, docs. [389](https://history.state.gov/historicaldocuments/frus1964-68v25/d389), [393](https://history.state.gov/historicaldocuments/frus1964-68v25/d393), [404](https://history.state.gov/historicaldocuments/frus1964-68v25/d404), [407](https://history.state.gov/historicaldocuments/frus1964-68v25/d407). [[w.ahlberg-transplanting-the-great-society]]; [[w.kux-india-and-the-united]]; [[w.mcmahon-cold-war-on-the]]. Made public: the telephone conversation, the LBJ Library''s recordings, and FRUS 1964–68, XXV, doc. 389. See [[cal.1966-01-10.india-and-china]]. Names: Freeman (K–J Adm. III.G); Dole (Opp. III.D); Poage (K–J Cong. III.D); Miller (Opp. III.B); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:freeman-orville-l, name:poage-william-r, name:dole-bob, name:miller-jack-r]
  - id: cal.1966-11-10.european-community
    when: Nov. 10–15
    date: '1966-11-10'
    thread: european-community
    c: 'Wilson to the Commons: "a new high-level approach" to the Six; the EFTA''s heads of government to London, then Wilson and his Foreign Secretary to each capital of the Six; "We mean business." Johnson to Wilson, Nov. 15: "immensely heartened by your courageous announcement."'
    n: '[HC Deb, Nov. 10, 1966](https://api.parliament.uk/historic-hansard/commons/1966/nov/10/european-economic-community-1), vol. 735, cc. 1539–51. FRUS 1964–68, XIII, docs. [215](https://history.state.gov/historicaldocuments/frus1964-68v13/d215) (Wilson to Johnson, Nov. 11), [216](https://history.state.gov/historicaldocuments/frus1964-68v13/d216). [[w.wilson-labour-government-1964-1970]]; [[w.pimlott-harold-wilson]]; [[w.young-this-blessed-plot]]; [[w.parr-britains-policy-towards-the]]. See [[cal.1964-10-26.european-community]]. Names: Wilson (K–J Adm. III.J); Johnson (K–J Adm. III.D).'
    tags: [name:wilson-harold, name:johnson-lyndon-b]
  - id: cal.1966-11-11.vietnam
    when: Nov. 11–17
    date: '1966-11-11'
    thread: vietnam
    c: 'Force levels. McNamara to Wheeler, Nov. 11: the Joint Chiefs'' plan of 504,000 Americans in South Vietnam by December 1967 and 522,200 by June 1968 cut, for planning, to 463,300 and 469,300; South Vietnam''s inflation the reason. Nov. 14, to Johnson: the barrier south of the 17th parallel to go ahead, fences, wire, mines and sensors some 30 kilometers west from the sea, an air barrier beyond. Nov. 17, his draft memorandum: 469,000 by June 30, 1968; a supplemental of $12.4 billion in January.'
    n: 'FRUS 1964–68, IV, docs. [301](https://history.state.gov/historicaldocuments/frus1964-68v04/d301), [307](https://history.state.gov/historicaldocuments/frus1964-68v04/d307), [312](https://history.state.gov/historicaldocuments/frus1964-68v04/d312). [[w.drea-mcnamara-clifford-and-the-2011]]; [[w.gibbons-u-s-government-and-1995]]; [[w.shapley-promise-and-power]]. Made public: [[w.pentagon-papers]], IV, 133–35, 364–85. Names: McNamara, Wheeler (K–J Adm. III.F); Johnson (K–J Adm. III.D).'
    tags: [name:mcnamara-robert-s, name:wheeler-earle, name:johnson-lyndon-b]
  - id: cal.1966-11-11.foreign-aid
    when: Nov. 11
    date: '1966-11-11'
    thread: foreign-aid
    also: [farm]
    c: 'Food for Peace Act of 1966 signed, [80 Stat. 1526](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1526.pdf), the "Food for Freedom" of the February message: sales for foreign currencies to give way to sales for dollars on credit; a country''s own efforts at food production and population to be weighed. Johnson''s statement, Nov. 12: agreements only after "carefully considering" self-help; the surpluses "are gone."'
    n: '[Statement by the President Upon Signing the Food for Peace Act of 1966](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-food-for-peace-act-1966) (Nov. 12, 1966). [[w.ahlberg-transplanting-the-great-society]]. See [[cal.1964-10-08.foreign-aid]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-11.space
    when: Nov. 11–15
    date: '1966-11-11'
    thread: space
    c: 'Gemini 12, the program''s last flight: Lovell and Aldrin, four days, docked with an Agena. Aldrin outside the capsule five and a half hours in three periods. Johnson''s statement from Bethesda Naval Hospital: ten flights with two men in orbit, all brought home. Nov. 23, at the ranch, the program''s awards.'
    n: '[Statement by the President Following the Completion of the Final Flight in the Gemini Program](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-completion-the-final-flight-the-gemini-program) (Nov. 15, 1966); [Remarks at an Award Ceremony at the LBJ Ranch Marking the Conclusion of the Gemini Space Program](https://www.presidency.ucsb.edu/documents/remarks-award-ceremony-the-lbj-ranch-marking-the-conclusion-the-gemini-space-program) (Nov. 23, 1966). [[w.hacker-on-the-shoulders-of]]. See [[cal.1965-12-15.space]]. Names: Aldrin, Lovell (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:lovell-james-a-jr, name:aldrin-edwin-e-jr]
  - id: cal.1966-11-11.states-and-cities-us
    when: Nov. 11
    date: '1966-11-11'
    thread: states-and-cities
    also: [state-and-city-finance]
    c: 'Memorandum to the heads of ten departments and agencies giving aid: "The basis of creative federalism is cooperation." The chief executives of States, counties and cities to be consulted on programs that touch them; the Budget Director to arrange it with the Advisory Commission on Intergovernmental Relations. Federal grants to States and localities: $7.0 billion in fiscal 1960, $12.9 billion in 1966, $15.2 billion in 1967.'
    n: '[Memorandum on the Need for "Creative Federalism" Through Cooperation With State and Local Officials](https://www.presidency.ucsb.edu/documents/memorandum-the-need-for-creative-federalism-through-cooperation-with-state-and-local) (Nov. 11, 1966), released at San Antonio. Office of Management and Budget, Historical Tables, [Table 12.1](https://www.govinfo.gov/content/pkg/BUDGET-2025-TAB/xls/BUDGET-2025-TAB-13-1.xlsx) (outlays as revised today). [[w.conlan-new-federalism]]; [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1964-10-28.state-and-city-finance-us]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-13.program
    when: Nov. 13
    date: '1966-11-13'
    thread: program
    c: 'Foreign Investors Tax Act signed, [80 Stat. 1539](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1539.pdf). Its Title III, the Presidential Election Campaign Fund Act, Long''s: a taxpayer may direct $1 of his tax to a fund for the presidential campaigns, the Comptroller General its keeper, a bipartisan board to advise. Johnson: "only a beginning"; the disclosure bill of May to be asked again.'
    n: '[Statement by the President Upon Signing the Foreign Investors Tax Act and the Presidential Election Campaign Fund Act](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-investors-tax-act-and-the-presidential) (Nov. 13, 1966). [[w.mann-legacy-to-power]]; [[w.zelizer-on-capitol-hill]]. Names: Long (K–J Cong. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:long-russell-b]
  - id: cal.1966-11-13.crime-and-hijacking
    when: Nov. 13
    date: '1966-11-13'
    thread: crime-and-hijacking
    c: 'The District of Columbia crime bill, passed in the session''s last hours, vetoed by memorandum: a suspect held for questioning four hours without arrest, six after it before he is taken to a magistrate; any witness at the scene held as a material witness. "I cannot approve it."'
    n: '[Memorandum of Disapproval of the District of Columbia Crime Bill](https://www.presidency.ucsb.edu/documents/memorandum-disapproval-the-district-columbia-crime-bill) (Nov. 13, 1966). [[w.flamm-law-and-order]].'
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1966-11-13.opinion
    when: Nov. 13
    date: '1966-11-13'
    thread: opinion
    also: [vietnam, europe-and-the-alliance]
    c: 'Gallup''s affiliates in three countries: the United States should begin to withdraw its troops, carry on at its present level of fighting, or increase its attacks on North Vietnam. France: 68, 8, 5 percent. West Germany: 51, 19, 15. Australia: 21, 43, 24.'
    n: '[[w.gallup-poll]], III, 2035.'
  - id: cal.1966-11-13.middle-east
    when: Nov. 13–20
    date: '1966-11-13'
    thread: middle-east
    c: 'Israel''s raid on Samu and villages near Hebron: tanks and jet aircraft. The State Department to Israel: the United States deplores it, cannot condone retaliation. Nov. 20, Rostow to Johnson: the raid has weakened Hussein''s hold on his army; Rusk proposes a warning to Eshkol.'
    n: 'FRUS 1964–68, XVIII, docs. [332](https://history.state.gov/historicaldocuments/frus1964-68v18/d332), [333](https://history.state.gov/historicaldocuments/frus1964-68v18/d333), [339](https://history.state.gov/historicaldocuments/frus1964-68v18/d339). [[w.oren-six-days-of-war]]; [[w.shlaim-lion-of-jordan]]. Names: Rostow, Rusk (K–J Adm. III.E); Hussein ibn Talal, Eshkol (K–J Adm. III.J).'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:hussein-ibn-talal, name:rusk-dean, name:eshkol-levi]
  - id: cal.1966-11-14.court
    when: Nov. 14
    date: '1966-11-14'
    thread: court
    c: '*Adderley v. Florida*, [385 U.S. 39](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385039/usrep385039.pdf): the trespass convictions of 32 Florida A&M students, of some 200 who demonstrated on the Leon County jail''s grounds at Tallahassee against their schoolmates'' arrest, affirmed. Black for the Court, 5–4: a jail is built for security, not open to the public; the sheriff could order them off. Douglas, with Warren, Brennan and Fortas, dissenting.'
    n: '[[w.powe-warren-court-and-american]]; [[w.kalman-long-reach-of-the-2017]].'
  - id: cal.1966-11-16.opinion
    when: Nov. 16
    date: '1966-11-16'
    thread: opinion
    also: [elections-1966, elections-1968]
    c: 'Gallup, Oct. 21–26: can identify Reagan, 75 percent; college-educated 94, grade school 50; West 84, South 63. Of them: favorable 54, unfavorable 18.'
    n: '[[w.gallup-poll]], III, 2035–36. See [[cal.1966-11-08.elections-1966]]. Names: Reagan (Opp. III.F).'
    tags: [name:reagan-ronald]
  - id: cal.1966-11-17.georgia
    when: Nov. 17
    date: '1966-11-17'
    thread: georgia
    also: [elections-1966]
    c: 'A three-judge federal court at Atlanta: the constitution''s choice of a governor by the General Assembly, from the two highest, where no candidate has a majority, denies the voters equal protection. The Assembly enjoined from choosing between Callaway and Maddox.'
    n: '*Morris v. Fortson*, [262 F. Supp. 93](https://static.case.law/f-supp/262/case-pdfs/0093-01.pdf) (N.D. Ga. 1966). *Fortson v. Morris* (Opp. II.H.1). [[w.short-everything-is-pickrick]]; [[w.kruse-white-flight]]. See [[cal.1966-11-08.elections-1966]]. Names: Callaway (Opp. III.D); Maddox (K–J Cong. III.F).'
    tags: [name:callaway-howard-h, name:maddox-lester]
  - id: cal.1966-11-18.opinion
    when: Nov. 18
    date: '1966-11-18'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Aug. 18–23, in the thirteen Southern States: the South better off with two parties of about equal strength in place of one strong party: better off 78 percent, not 22; no opinion, printed apart, 14.'
    n: '[[w.gallup-poll]], III, 2036.'
  - id: cal.1966-11-20.opinion
    when: Nov. 20
    date: '1966-11-20'
    thread: opinion
    c: 'Gallup, Oct. 1–6, by race: satisfied with their housing, whites 77 percent, Negroes 51; with their family income, 67 and 45; with their work, 87 and 69; with their children''s education, 76 and 64. Very happy, 48 and 30.'
    n: '[[w.gallup-poll]], III, 2036–37.'
  - id: cal.1966-11-23.opinion
    when: Nov. 23
    date: '1966-11-23'
    thread: opinion
    also: [economy, vietnam]
    c: 'Gallup, Oct. 21–26: an income tax increase to help pay for the war in Vietnam: favor 19 percent, oppose 73; Republicans 20 favor, Democrats 20, independents 17. Prices and wages frozen for as long as the war lasts: a good idea 33, a poor idea 51.'
    n: '[[w.gallup-poll]], III, 2037.'
  - id: cal.1966-11-25.middle-east
    when: Nov. 25
    date: '1966-11-25'
    thread: middle-east
    c: 'Security Council, Resolution 228: censures Israel for the "large-scale and carefully planned military action" of Nov. 13 in Jordan; if reprisals recur, "further and more effective steps." 14–0, one abstaining; the United States for.'
    n: '[S.C. Res. 228](https://undocs.org/S/RES/228(1966)) (Nov. 25, 1966). FRUS 1964–68, XVIII, doc. [349](https://history.state.gov/historicaldocuments/frus1964-68v18/d349). See [[cal.1966-11-13.middle-east]].'
  - id: cal.1966-11-27.opinion
    when: Nov. 27
    date: '1966-11-27'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Nov. 10–15: Republicans'' choice for 1968: Romney 39, Nixon 31, Reagan 8, Rockefeller 5, Percy 5, Hatfield 3, Lindsay 2. Independents: Romney 34, Nixon 22, Reagan 13, Rockefeller 11, Percy 7, Hatfield 3, Lindsay 3.'
    n: '[[w.gallup-poll]], III, 2038. Names: Romney, Rockefeller (Opp. III.H); Nixon (Opp. III.E); Reagan (Opp. III.F); Percy, Hatfield (Opp. III.B); Lindsay (Opp. III.D).'
    tags: [name:romney-george-w, name:nixon-richard-m, name:reagan-ronald, name:rockefeller-nelson, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v]
  - id: cal.1966-11-29.economy
    when: Nov. 29
    date: '1966-11-29'
    thread: economy
    c: Austin. Johnson orders $5.3 billion of fiscal 1967 programs cut or put off, to bring spending down $3 billion this fiscal year; Congress had added $3.2 billion in obligational authority and $2.5 billion in spending. Highways $1.1 billion; housing and urban development about $1 billion; HEW $530 million. The cuts from the $29 billion of the budget he can control.
    n: '[Statement by the President Announcing a Cutback in Federal Spending for the Current Fiscal Year](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-cutback-federal-spending-for-the-current-fiscal-year); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1182) (Nov. 29, 1966). [[w.bernstein-guns-or-butter]]; [[w.collins-more]]; [[w.morgan-deficit-government]]. See [[cal.1966-11-08.economy]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-29.india-and-china
    when: Nov. 29
    date: '1966-11-29'
    thread: india-and-china
    c: General Assembly, China's seat. The "important question" resolution, two-thirds needed to change the representation, carried 66–48–7; the Albanian resolution to seat Peking and expel the Republic of China lost 46–57–17, against 47–47–20 in 1965; Italy's proposed study committee lost 34–62–25.
    n: FRUS 1964–68, XXX, doc. [220](https://history.state.gov/historicaldocuments/frus1964-68v30/d220). [[w.foot-practice-of-power]].
  - id: cal.1966-11-30.opinion
    when: Nov. 30
    date: '1966-11-30'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Nov. 10–15: the convention''s choice between Romney and Nixon. Republicans: Romney 51, Nixon 42. Independents: Romney 56, Nixon 32.'
    n: '[[w.gallup-poll]], III, 2038. Names: Romney (Opp. III.H); Nixon (Opp. III.E).'
    tags: [name:romney-george-w, name:nixon-richard-m]
