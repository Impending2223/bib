  - id: cal.1961-04-19.cuba
    when: Apr. 19
    date: '1961-04-19'
    time: 1961-04-19T08:37Z
    thread: cuba-bay-of-pigs
    c: 'After a White House meeting from 11:58 p.m., the Chiefs order six unmarked Navy aircraft over the beachhead, 6:30 to 7:30 a.m.: defend the brigade from air attack, seek no combat, attack nothing on the ground. The brigade''s B-26s arrive an hour early; two shot down.'
    n: 'FRUS 1961–63, X, docs. [140](https://history.state.gov/historicaldocuments/frus1961-63v10/d140), [141](https://history.state.gov/historicaldocuments/frus1961-63v10/d141) (Burke to Dennison); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), pars. 72, 83. [[w.reeves-president-kennedy]], 93–95 (the six jets, their insignia off); [[w.jones-bay-of-pigs]], 118–20 (the six jets; the B-26s alone over the beach; two shot down, four Americans killed); [[w.bissell-reflections-of-a-cold]], 188–89 (the night meeting; the hour''s cover; the time); [[w.sorensen-kennedy]], 299, 307 (the postmidnight meeting; the unmarked jets; the B-26s an hour early); [[w.thomas-robert-kennedy]], 121 (the meeting after midnight; Lemnitzer''s "go guerrilla"; Burke, prodded by Robert Kennedy, for an hour of air cover; the planes'' markings painted out); [[w.poole-joint-chiefs-of-staff]], 115 (at 0337 the Chiefs order Dennison to send six unmarked aircraft, 0630 to 0730; "Pilots carry as little identification as possible"). [[w.fursenko-one-hell-of-a]], 96. Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 277–79 (the meeting). Check: Woods (269), after Johnson and Gwertzman (210), has congressional leaders at the meeting after the reception, Russell, Rayburn and Fulbright among them, and Kennedy to Fulbright on leaving: "Well, you''re the only one who can say I told you so.". See [[cal.1961-04-15.cuba]]. Names: Burke. Check: Reeves has the jets over the beach at 6:30, an hour before the B-26s (95). Check: Jones has Bissell get the President''s approval about 3:30 a.m. (118).'
