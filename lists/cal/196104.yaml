    date: '1961-04-27'
    thread: laos
    also: [vietnam-congress]
    c: 'Kennedy calls in the congressional leaders after the NSC, Johnson with him. McNamara on the means of intervening in Laos; Burke for intervening, or all Southeast Asia lost. By Bowles''s telegram to Rusk, "Mansfield at one end of spectrum and Bridges at other," but "complete unanimity" against American forces in Laos; "probably ... considerable support" for them in Thailand and South Vietnam. By Mann''s account, Bridges alone for sending forces; Mansfield: "fruitless"; Dirksen: "nothing to show for it"; Russell: "get our people out and write the country off."'
    n: '[FRUS 1961–63, XXIV, doc. 65](https://history.state.gov/historicaldocuments/frus1961-63v24/d65) (Bowles to Rusk, Tosec 23, Apr. 27, 10:31 p.m.). [[w.mann-grand-delusion]], 230–31. Made public: FRUS 1961–63, XXIV. Check: Bowles gives "complete unanimity" against forces in Laos, Bridges among them; Mann, Bridges for sending them. To check: [[w.gibbons-u-s-government-and]], II, 29; [[w.johnson-right-hand-of-power]], 324 (cited by [[w.mann-grand-delusion]], 231 n.19, for the senators'' words); the memorandum of the meeting, NSF, Clifton Series, Kennedy Library (cited by FRUS 1961–63, XXIV, doc. 65 n.2). See [[cal.1961-04-27.laos]]. Names: Kennedy, Johnson, McNamara, Burke, Bowles, Rusk, Mansfield, Bridges, Dirksen, Russell.'
    src:
