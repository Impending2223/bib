    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 51–55; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 511–518 (Apr. 12–30, 1961; Liu''s stay at Tianhua brigade, day by day: Apr. 13 the brigade cadres'' forum, Apr. 14 the team cadres, Apr. 15 the Shijiachong mess hall and members'' forum, Apr. 17 the general branch committee, Apr. 19–22 the work group on dropping the mess halls and restitution, Apr. 24 handicrafts, Apr. 25 commerce and housing, Apr. 27 the peasants and the Sixty Articles, Apr. 30 the work group and the work teams); [[w.dikotter-maos-great-famine]], 119 n.17a–e (in a village where he stops on his way home, unnamed, Liu finds the deaths covered up by the local leaders and an official report far from what he sees, and clashes with the local boss; Duan Shucheng, a cadre dismissed as a rightist in 1959, tells him how the brigade won its red flag and its leaders persecuted dissent: a crop of 360 tonnes in 1960 reported as 600, 180 kilos a head left after requisitions). Made public: 1996. Check: [[w.dikotter-maos-great-famine]], 119, does not name the village where Liu meets Duan Shucheng (the conversations of Apr. 25, 28 and 30); whether it is Tianhua. To check: [[w.huainian-liu-shaoqi-tongzhi]], 60, 65, 327, 331, 342–44, 346–62 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 51 n.84a); [[w.hong-qi-piaopiao]], No. 20, 1980, 242 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 51 n.84b); [[w.selections-from-china-mainland]], (Supplement), No. 26, 16–17 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 51 n.84c); [[w.macfarquhar-origins-of-the-cultural]], I, 370 n.27 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 51 n.84d); [[w.huainian-liu-shaoqi-tongzhi]], 60, 323 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 52 n.88a); [[w.shangkun-huainian-liu-shaoqi-tongzhi]], 13–14 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 52 n.88b); [[w.joint-publications-research-service]], No. 75921, 13–14 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 52 n.88c); [[w.selections-from-china-mainland]], (Supplement), No. 26, 4, 17 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 52 n.88d); [[w.huainian-liu-shaoqi-tongzhi]], 61, 324–25, 329, 346–48, 326 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 54 n.89a); [[w.survey-of-china-mainland]], (Supplement), No. 194, 30 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 54 n.89b); [[w.liu-shaoqi-yanjiu-lunwenji]], 377 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 55 n.95a); [[w.huainian-liu-shaoqi-tongzhi]], 350–51 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 55 n.95b); Liu Shaoqi, conversations of Apr. 25, 28 and 30, 1961, Hunan Provincial Archives, 141-1-1873, pp. 106–150 (cited by [[w.dikotter-maos-great-famine]], 119 n.17a–c); Huang Zheng, Wang Guangmei fangtan lu (2006), 238–240 (cited by [[w.dikotter-maos-great-famine]], 119 n.17d); Jin Chongji and Huang Zheng, eds., Liu Shaoqi zhuan (1998), 865–866 (cited by [[w.dikotter-maos-great-famine]], 119 n.17e). Names: Liu Shaoqi, Tao Zhu, Wang Renzhong, Zhang Pinghua.'
