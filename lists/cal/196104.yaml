    place: neijiang
    thread: china-leadership
    c: 'Neijiang 内江. Zhu De 朱德 hears the heads of the Neijiang prefectural committee 中共内江地委 on their work and on the natural gas reserves of southern Sichuan 川南: Sichuan has many people and many medicinal herbs, and old handicraft trades, bamboo weaving and straw hats; handicrafts and a many-sided economy, sericulture 蚕丝业 among them, to be grown.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1802. Made public: 2016. Names: Zhu De.'
    tags: [polity:prc, name:zhu-de, vis:only:prc]
  - id: cal.1961-04-17.china-leadership-12
    when: Apr. 17
    date: '1961-04-17'
    place: longchang
    thread: china-leadership
    c: Longchang 隆昌, Sichuan 四川. Zhu De 朱德 inspects the Longchang natural gas field 隆昌天然气矿.{1} Told that the gas, besides fuel, power and carbon black, can be made into fertilizer, rubber, man-made fiber and other chemical goods, he asks them to produce as much gas as they can and use it fully.{2}
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1803. Made public: 2016. Names: Zhu De.'
    tags: [polity:prc, name:zhu-de, vis:only:prc@2]
