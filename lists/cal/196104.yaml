    c: 'The CIA''s air base at Puerto Cabezas, Nicaragua, to headquarters, 12:07 p.m.: air support of the beachhead "completely out of our hands";{1} five Cuban pilots, six copilots, two American pilots and a copilot lost, killed or captured. Two crews shot down in the hour of the Navy''s cover, 6:30 to 7:30 a.m.{2}'
