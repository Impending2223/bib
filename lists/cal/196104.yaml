    c: 'The White House situation room, 7 a.m.: Dulles, Cabell and Bissell give Kennedy, Bundy, Rostow and the military aide the news from the beaches; no fallback raised.{1} Rostow to spend the day at the CIA''s headquarters. By Bissell''s account, after Rostow''s.{2}'
