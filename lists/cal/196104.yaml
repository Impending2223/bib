    thread: cuba
    c: 'The Joint Chiefs to McNamara, JCSM-278-61, Wheeler signing: an outline plan, from CINCLANT''s Operation Plan 312-61, for overthrowing Castro by American force. Airborne and Marine assault on western Cuba; Havana held by D+8; organized resistance over by D+30 to D+54; 18 days from the decision to the landing; ground casualties about 16 percent. "Swift, sharp, and overwhelming," and an incident created to justify it.'
    n: '[FRUS 1961–63, X, doc. 178](https://history.state.gov/historicaldocuments/frus1961-63v10/d178). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 149. See [[cal.1961-04-20.cuba-3]]. Names: McNamara, Wheeler, Castro. Check: Jones has Havana held within a week and a withdrawal within ninety days (149); the plan''s table: control of Havana D+6 to D+8, withdrawal of combat forces D+60 to D+90.'
