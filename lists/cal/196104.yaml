  - id: cal.1961-04-17.cuba-2
    when: Apr. 17
    date: '1961-04-17'
    thread: cuba-bay-of-pigs
    c: 4:30 a.m., Rusk's home. Cabell asks again for Navy fighters to cover the ships; Rusk calls the President and puts Cabell on. After speaking with Rusk, Kennedy refuses. By Cabell's memoir, the early-warning destroyers allowed, thirty miles out.
    n: '[FRUS 1961–63, X, doc. 108](https://history.state.gov/historicaldocuments/frus1961-63v10/d108), par. 7 (Cabell to Taylor, May 9, Bissell concurring). Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 88–89; [[w.bissell-reflections-of-a-cold]], 186 (Cabell''s appeal from Rusk''s apartment, refused). To check: [[w.cabell-memoirs-of-war-peace]], 376–77 (cited by [[w.jones-bay-of-pigs]], 89 n.40). See [[cal.1961-04-16.cuba]]. Names: Rusk, Cabell, Kennedy.'
