    c: 'The Bay of Pigs.{1} At dawn eight B-26s of the exile force, from Puerto Cabezas, Nicaragua, strike three airfields: Campo Libertad, San Antonio de los Baños, Santiago.{2} Five aircraft destroyed.{3} A B-26 lands at Key West, another at Miami, its pilot a defector by the cover story.{4} The diversionary landing east of Guantanamo aborted.{5}'
