    date: '1961-04-18'
    place: washington
    thread: cuba-bay-of-pigs
    c: 'The White House, Tuesday night, the news of the brigade''s failure and capture confirmed.{1} Kennedy, with little to say to anybody, walks out of his office into the Rose Garden and stays alone almost an hour. O''Donnell to Salinger, watching: "He must be the loneliest man in the world tonight."{2}'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 307 (O''Donnell''s and Powers''s account); [[w.salinger-with-kennedy]], 148–49 (after the night meeting Kennedy breaks off and walks the south grounds alone while O''Donnell and Salinger watch from a window; not the words). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Salinger. Check: the day (the book has "Tuesday night," Apr. 18; the brigade''s surrender was Apr. 19).'
    src:
      c: d0ca7105
      rows:
        - 'w.odonnell-johnny-we-hardly-knew 307: ?'
        - 'w.salinger-with-kennedy 148–49: ?'
