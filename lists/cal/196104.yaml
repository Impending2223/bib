    c: 'King at the White House to see Wofford;{1} Kennedy stops by, five minutes.{2} No word of civil rights, King recalls: the Bay of Pigs two days past.{3} His letter of Mar. 16 asking a conference unanswered but for O''Donnell''s advice to try again in late April.{4} A brief talk with Robert Kennedy at Justice the week before, on the bus terminals.{5}'
