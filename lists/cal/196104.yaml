    when: Apr. 25
    date: '1961-04-25'
    thread: china-leadership
    also: [laos]
    c: 'The PLA *Bulletin of Activities* no. 17, for cadres of regimental rank and above, carries "Several Important Problems Concerning the Current International Situation": three ways to settle the world''s problems, sharing the spoils, refused, China wanting "one inch of land from others" from no one; peaceful coexistence, firm against the United States, at peace with as many others as may be, but coexistence and neutralism transitional; and the socialist camp and the national independence movements strengthened. Africa the center of the anticolonial struggle; the Congo, Cuba, Laos. Nothing of North Vietnam''s struggle.'
    n: '[[w.guan-vietnamese-communists-relations-with]], 190–191. Made public: 1966 ([[w.politics-of-the-chinese]]). To check: [[w.politics-of-the-chinese]], 480–487 (cited by [[w.guan-vietnamese-communists-relations-with]], 191 n.46).'
