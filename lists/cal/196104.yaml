    c: 'Bundy to the President, before the noon meeting: the situation "not a bit good";{1} Castro''s forces stronger, the popular response weaker. The CIA''s request for Navy cover to the B-26s attacking the tanks to be granted.{2} "The right course now is to eliminate the Castro air force, by neutrally-painted U.S. planes if necessary, and then let the battle go its way."{3}'
    n: '[FRUS 1961–63, X, doc. 119](https://history.state.gov/historicaldocuments/frus1961-63v10/d119). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 116; [[w.thomas-robert-kennedy]], 120 ("not a bit good"). See [[cal.1961-04-15.cuba]]. Names: McGeorge Bundy, Kennedy, Castro.'
