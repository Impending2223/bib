    c: Michigan voters approve a constitutional convention. Romney leads Citizens for Michigan.
    n: 'To check: [[w.sturm-constitution-making-in-michigan]]; [[w.harris-romneys-way]]. Names: Romney.'
    tags: [name:romney-george-w, state:mi]
  - id: cal.1961-04-03.cuba
    when: Apr. 3
    date: '1961-04-03'
    thread: cuba-bay-of-pigs
    c: 'The State Department''s pamphlet *Cuba*, the White Paper: Castro has delivered Cuba to the Sino-Soviet bloc; Cuba called on to sever its links with the Communist movement. Drafted in Inter-American Affairs, revised in the White House by Schlesinger and Goodwin.'
    n: '[FRUS 1961–63, X, doc. 79](https://history.state.gov/historicaldocuments/frus1961-63v10/d79); Department of State Publication 7171. Ordered by NSAM 31: see [[cal.1961-03-11.cuba]]. Names: Castro, Schlesinger, Goodwin.'
    tags: [name:castro-fidel, name:schlesinger-arthur-m-jr, name:goodwin-richard-n]
  - id: cal.1961-04-04.states-and-cities
    when: Apr. 4
    date: '1961-04-04'
    thread: states-and-cities
    also: [specials]
    c: Texas special election for Johnson's seat. Seventy-one candidates; Tower first, Blakley second. Runoff set.
    n: 'To check: [[w.knaggs-two-party-texas]]; [[w.tower-consequences]]. Names: Johnson, Tower, Blakley.'
    tags: [name:johnson-lyndon-b, name:tower-john-g, name:blakley-william-a, state:tx]
  - id: cal.1961-04-04.cuba
    when: Apr. 4
    date: '1961-04-04'
    thread: cuba-bay-of-pigs
    c: 'The State Department, 6 p.m. Kennedy polls his advisers on Zapata. Fulbright, invited, speaks against it; Rusk opposed; Berle, Mann, McNamara for. Hawkins: groups of 200 too small. Kennedy still wants it to look like a rising from inside.'
    n: '[FRUS 1961–63, X, doc. 80](https://history.state.gov/historicaldocuments/frus1961-63v10/d80) (Gray''s notes). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 251–52 (Rusk''s part he calls "mild disclaimers"). See [[cal.1961-03-29.cuba]]. Names: Kennedy, Fulbright, Rusk, Berle, Mann, McNamara, Hawkins.'
    src:
      c: afb0ff69
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d80: all'
        - 'w.schlesinger-thousand-days-1965 251–52: A-E, G'
    tags: [name:kennedy-john-f, name:fulbright-j-william, name:rusk-dean, name:berle-adolf-a, name:mann-thomas-c, name:mcnamara-robert-s, name:hawkins-jack]
  - id: cal.1961-04-04.mayors-los-angeles
    when: Apr. 4
    date: '1961-04-04'
    thread: mayors
    also: [elections-1961]
    c: 'Los Angeles, nonpartisan primary for mayor: Poulson, mayor since 1953, over Yorty, once a U.S. Representative, 179,273 to 122,478, 39.7 percent; Councilman McGee 115,635, 25.6 percent; six others. Poulson and Yorty to a runoff, May 31.'
    n: 'Votes: [Wikipedia, "1961 Los Angeles mayoral election"](https://en.wikipedia.org/wiki/1961_Los_Angeles_mayoral_election), from Our Campaigns; Check: the City Clerk''s canvass. To check: [[w.bollens-yorty]]; [[w.sonenshein-politics-in-black-and]]. Names: Poulson, Yorty, McGee.'
    tags: [state:ca, city:los-angeles, name:poulson-norris, name:yorty-sam, name:mcgee-patrick-d]
  - id: cal.1961-04-04.mayors-st-louis
    when: Apr. 4
    date: '1961-04-04'
    thread: mayors
    also: [elections-1961]
    c: St. Louis re-elects Tucker (D) mayor, a third term.
    n: 'City of St. Louis, ["Raymond R. Tucker"](https://www.stlouis-mo.gov/government/about/history/mayors/mayor.cfm?id=987) (Check: the day, the opponent and the vote). To check: [[w.gordon-mapping-decline]]. Names: Tucker.'
    tags: [state:mo, city:st-louis, name:tucker-raymond-r]
  - id: cal.1961-04-04.cuba-2
    when: Apr. 4
    date: '1961-04-04'
    thread: cuba-bay-of-pigs
    c: 'Berle, Bonsal and Schlesinger with Miró Cardona, the afternoon: the Council''s draft program speaks to the investor and the dispossessed owner, not the worker, the farmer or the Negro; the Council to move from Miami to New York. Miró agrees.'
    n: '[[w.schlesinger-thousand-days-1965]], 259–60. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-03-20.cuba]]. Names: Berle, Bonsal, Schlesinger, Miró Cardona.'
    src:
      c: 0e585c5c
      rows:
        - 'w.schlesinger-thousand-days-1965 260: all'
    tags: [name:berle-adolf-a, name:bonsal-philip-w, name:schlesinger-arthur-m-jr, name:miro-cardona-jose]
  - id: cal.1961-04-05.opinion
    when: Apr. 5
    date: '1961-04-05'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Mar. 10–15: under the school bill, more important here, new buildings 38 percent, teachers'' salaries 26, both 27.'
    n: '[[w.gallup-poll]], III, 1713.'
  - id: cal.1961-04-05.european-community
    when: Apr. 5–8
    date: '1961-04-05'
    thread: european-community
    also: [europe-and-the-alliance]
    c: 'Macmillan in Washington. The Americans: if Britain joins the Six and accepts the Rome Treaty''s political and institutional obligations, the United States will support it; a commercial arrangement alone, not. Ball had told Heath the same in London, Mar. 30. Joint statement, Apr. 8: "further steps toward the economic and political unity of Europe."'
    n: 'Remarks at the Reading of the Joint Statement Following Discussions With Prime Minister Macmillan, [1961 Pub. Papers 251](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=309) (Apr. 8, 1961). FRUS 1961–63, XIII, doc. [3](https://history.state.gov/historicaldocuments/frus1961-63v13/d3) (circular, Apr. 12). To check: [[w.camps-britain-and-the-european]]; [[w.macmillan-pointing-the-way-1959]]; [[w.ball-past-has-another-pattern]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.ludlow-dealing-with-britain]]; [[w.milward-uk-and-the-european]]. See [[cal.1960-05-03.european-community]]. Names: Macmillan, Heath, Ball.'
    tags: [name:macmillan-harold, name:ball-george-w, name:heath-edward-r-g, name:kennedy-john-f]
  - id: cal.1961-04-05.cuba
    when: Apr. 5
    date: '1961-04-05'
    thread: cuba-bay-of-pigs
    c: 'Schlesinger to Kennedy, after the meeting of Apr. 4: for quiet infiltration and air drops; against the beachhead. However Cuban the force, the United States held accountable; a protracted civil war.'
    n: '[FRUS 1961–63, X, doc. 81](https://history.state.gov/historicaldocuments/frus1961-63v10/d81). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 252–55. See [[cal.1961-04-04.cuba]]. Names: Schlesinger, Kennedy. Check: an earlier release.'
    src:
      c: fe40a44e
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d81: all'
        - 'w.schlesinger-thousand-days-1965 252: A-B'
        - 'w.schlesinger-thousand-days-1965 254: C-D'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f]
  - id: cal.1961-04-06.opinion
    when: Apr. 6–11
    date: '1961-04-06'
    thread: opinion
    c: Approval 78 percent, disapproval 6, in the series today; not released at the time. In the field the week before the landing.
    n: See [[cal.1961-02-10.opinion]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-04-06.europe-and-the-alliance
    when: Apr. 6
    date: '1961-04-06'
    thread: europe-and-the-alliance-jupiters
    also: [defense]
    c: 'The Jupiters for Turkey. NSAM 35: State, Defense and the CIA to review the deployment, Acheson''s NATO task force having advised Polaris for the alliance instead.'
    n: '[NSAM No. 35](https://history.state.gov/historicaldocuments/frus1961-63v16/d361) (Apr. 6, 1961). FRUS 1961–63, XVI, doc. [362](https://history.state.gov/historicaldocuments/frus1961-63v16/d362) (Apr. 20). To check: [[w.harris-troubled-alliance]]; [[w.nash-other-missiles-of-october]]. Names: Acheson.'
    tags: [name:kennedy-john-f, name:acheson-dean-g, name:bundy-mcgeorge]
  - id: cal.1961-04-06.cuba-bay-of-pigs
    when: Apr. 6
    date: '1961-04-06'
    thread: cuba-bay-of-pigs
    c: 'Another meeting on the landing. Schlesinger, after it: "We seem now destined to go ahead on a quasi-minimum basis—a large-scale infiltration (hopefully) rather than an invasion."'
    n: '[[w.schlesinger-thousand-days-1965]], 256, from his notes. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-03-29.cuba]]. Names: Schlesinger.'
    src:
      c: f0482888
      rows:
        - 'w.schlesinger-thousand-days-1965 256: all'
    tags: [name:schlesinger-arthur-m-jr]
  - id: cal.1961-04-07.cuba
    when: Apr. 7
    date: '1961-04-07'
    thread: cuba-bay-of-pigs
    also: [press-and-broadcasting]
    c: '*New York Times*, front page: Szulc, from Miami, on anti-Castro units trained to invade Cuba. Cut in New York the night before: nothing on the CIA, nor that a landing was imminent; one column, not four.'
    n: '[*New York Times*, Apr. 7, 1961](https://timesmachine.nytimes.com/timesmachine/1961/04/07/issue.html). Made public, the cuts: Clifton Daniel''s address to the World Press Institute, June 1, 1966. To check: [[w.talese-kingdom-and-the-power]]; [[w.wyden-bay-of-pigs]]. See [[cal.1961-01-10.cuba]]. Names: Szulc. Check: the headline; the cuts against Daniel''s text.'
    tags: [name:szulc-tad]
  - id: cal.1961-04-07.cuba-2
    when: Apr. 7
    date: '1961-04-07'
    thread: cuba-bay-of-pigs
    c: 'Goodwin to Rusk, the morning, against the operation. Rusk: "Maybe we''ve been oversold on the fact that we can''t say no to this." Kennedy, seen by Schlesinger that afternoon, has decided: the operation pared to a mass infiltration; "If we have to get rid of these 800 men, it is much better to dump them in Cuba than in the United States."'
    n: '[[w.schlesinger-thousand-days-1965]], 256–58, from his notes. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-05.cuba]]. Names: Goodwin, Rusk, Kennedy, Schlesinger.'
    src:
      c: a6cdeea8
      rows:
        - 'w.schlesinger-thousand-days-1965 257–58: all'
    tags: [name:goodwin-richard-n, name:rusk-dean, name:kennedy-john-f, name:schlesinger-arthur-m-jr]
  - id: cal.1961-04-08.cuba
    when: Apr. 8
    date: '1961-04-08'
    thread: cuba-bay-of-pigs
    c: 'Barnes and Schlesinger brief Stevenson for the UN debate on Cuba, by Schlesinger''s account too vaguely: Stevenson left thinking nothing would happen during the debate.'
    n: '[[w.schlesinger-thousand-days-1965]], 271. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-05.cuba]]. Names: Barnes, Schlesinger, Stevenson.'
    src:
      c: 604a6cfe
      rows:
        - 'w.schlesinger-thousand-days-1965 271: A'
    tags: [name:barnes-c-tracy, name:schlesinger-arthur-m-jr, name:stevenson-adlai-e]
  - id: cal.1961-04-10.cuba
    when: Apr. 10
    date: '1961-04-10'
    thread: cuba-bay-of-pigs
    c: 'Schlesinger to Kennedy: the political, diplomatic and economic planning behind the operational. The Cuban leaders to be convinced that no American troops will be sent in any circumstances; recognition only when they have a better than even chance on their own.'
    n: '[FRUS 1961–63, X, doc. 86](https://history.state.gov/historicaldocuments/frus1961-63v10/d86). [[w.schlesinger-thousand-days-1965]], 253, 262. Made public, in part: [[w.schlesinger-thousand-days-1965]], 262 (1965); in full, FRUS 1961–63, X (1997). See [[cal.1961-04-05.cuba]]. Names: Schlesinger, Kennedy.'
    src:
      c: dc135e70
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d86: all'
        - 'w.schlesinger-thousand-days-1965 253: A'
        - 'w.schlesinger-thousand-days-1965 262: B-C'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f]
  - id: cal.1961-04-11.cuba
    when: Apr. 11
    date: '1961-04-11'
    thread: cuba-bay-of-pigs
    also: [robert-kennedy]
    c: 'At a birthday party for his wife, Robert Kennedy to Schlesinger: "You may be right or you may be wrong, but the President has made his mind up. Don''t push it any further."'
    n: '[[w.schlesinger-thousand-days-1965]], 259. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-05.cuba]]. Names: Robert Kennedy, Schlesinger.'
    src:
      c: 806e70a6
      rows:
        - 'w.schlesinger-thousand-days-1965 259: A'
    tags: [name:kennedy-robert-f, name:schlesinger-arthur-m-jr]
  - id: cal.1961-04-12.space
    when: Apr. 12
    date: '1961-04-12'
    thread: space
    c: Gagarin orbits the earth.
    n: 'Statement by the President on the Orbiting of a Soviet Astronaut, [1961 Pub. Papers 257](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=315). Message to Chairman Khrushchev Concerning the Flight of the Soviet Astronaut, [1961 Pub. Papers 257](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=315). To check: [[w.logsdon-decision-to-go-to]]; [[w.logsdon-john-f-kennedy-and]]; [[w.mcdougall-heavens-and-the-earth]]; [[w.lambright-powering-apollo]]; [[w.dallek-johnson-project-apollo-and]]. Names: Webb, Wiesner, Johnson, Gagarin.'
    tags: [name:gagarin-yuri, name:webb-james-e, name:wiesner-jerome-b, name:johnson-lyndon-b]
  - id: cal.1961-04-12.cuba
    when: Apr. 12
    date: '1961-04-12'
    thread: cuba-bay-of-pigs
    c: Press conference. "There will not be, under any conditions, an intervention in Cuba by the United States Armed Forces." The Government to see that no Americans are involved in actions inside Cuba.
    n: 'The President''s News Conference, [1961 Pub. Papers 258](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=316), item 4. See [[cal.1961-04-04.cuba]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-04-12.cuba-2
    when: Apr. 12
    date: '1961-04-12'
    thread: cuba-bay-of-pigs
    c: 'The White House, 5:45 p.m. Bissell''s last revision: a pilot to land at Miami as a defector; air strikes on D-2. Kennedy stresses no association with the United States; training in the United States to stop. No-go times: noon, Apr. 14, for the strikes; noon, Apr. 16, for the landing.'
    n: 'FRUS 1961–63, X, docs. [92](https://history.state.gov/historicaldocuments/frus1961-63v10/d92) (Gray''s notes), [93](https://history.state.gov/historicaldocuments/frus1961-63v10/d93) (the CIA''s paper); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 33. Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 262 (the meeting: the operation to be wholly Cuban; Berle and Schlesinger to see Miró Cardona). See [[cal.1961-04-04.cuba]]. Names: Bissell, John F. Kennedy.'
    src:
      c: f25709ee
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d92: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d231: all'
        - 'w.schlesinger-thousand-days-1965 262: D'
    tags: [name:bissell-richard-m-jr, name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:kennedy-robert-f, name:lemnitzer-lyman-l, name:bundy-mcgeorge]
  - id: cal.1961-04-12.cuba-3
    when: Apr. 12
    date: '1961-04-12'
    thread: cuba-bay-of-pigs
    c: 'Katzenbach, Office of Legal Counsel, to Robert Kennedy, on intervention: a neutral state breaks international law if it lets organized armed forces attack from its territory, pass through it, or be organized and trained there; not if private parties provide arms, even stockpile them, or recruit and train volunteers short of an organized force.'
    n: '[1 Op. O.L.C. Supp. 225](https://www.justice.gov/olc/file/477221/dl#page=241) (Apr. 12, 1961), memorandum opinion for the Attorney General. Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1960-03-17.cuba]]. Names: Katzenbach, Robert Kennedy.'
    tags: [name:katzenbach-nicholas, name:kennedy-robert-f]
  - id: cal.1961-04-12.cuba-4
    when: Apr. 12
    date: '1961-04-12'
    thread: cuba-bay-of-pigs
    also: [soviet-union]
    c: 'Kornienko of the Soviet Embassy calls on Schlesinger: puzzled by American policy on Cuba; might not Castro try negotiation? Schlesinger: the Communists'' monopoly of political action the issue. Reported to Kennedy and Rusk.'
    n: '[[w.schlesinger-thousand-days-1965]], 262–64. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-05.cuba]]. Names: Kornienko, Schlesinger, Castro, Kennedy, Rusk.'
    src:
      c: 039c565a
      rows:
        - 'w.schlesinger-thousand-days-1965 263–64: all'
    tags: [name:kornienko-georgi-m, name:schlesinger-arthur-m-jr, name:castro-fidel, name:kennedy-john-f, name:rusk-dean]
  - id: cal.1961-04-12.right-and-the-military
    when: Apr. 12
    date: '1961-04-12'
    thread: right-and-the-military
    c: 'Senate. Milton Young of North Dakota (R), condemned by letter-writers for opposing the John Birch Society, prints a Wichita lawyer''s letter and his reply, with Welch''s words from *The Politician*: Eisenhower "consciously serving the Communist conspiracy, for all of his adult life." McGee (D) on Welch''s speech in Los Angeles the night before.'
    n: '[107 Cong. Rec. 5607–08](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt5/pdf/GPO-CRECB-1961-pt5-3-1.pdf). [[w.perlstein-before-the-storm]], 118 (Welch''s words). Check: Perlstein gives the speech to Stephen Young of Ohio, citing the Record of Apr. 12, 1961, 5268 ff.; the bound Record of the day prints Milton Young''s. Names: Milton Young, Welch, Eisenhower, McGee.'
    src:
      c: a5a038a6
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt5/pdf/GPO-CRECB-1961-pt5-3-1.pdf: all'
        - 'w.perlstein-before-the-storm 118: B'
        - 'via w.perlstein-before-the-storm 118 n.2: B'
    tags: [name:young-milton-r, name:welch-robert, name:eisenhower-dwight-d, name:mcgee-gale-w]
  - id: cal.1961-04-12.cuba-5
    when: Apr. 12
    date: '1961-04-12'
    thread: cuba-bay-of-pigs
    also: [robert-kennedy]
    c: 'Bissell, at the President''s instruction, briefs Robert Kennedy at the Justice Department on the landing: the chances two out of three, and failure "almost impossible," the men able to become guerrillas if the beachhead failed. By Kennedy''s memorandum of June 1, his first word of the plan, "about four or five days prior to the actual event."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 443–44. To check: Robert Kennedy, memorandum dictated June 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 444 n.1). See [[cal.1961-04-15.cuba]]. Names: Bissell, Robert Kennedy. Check: the day ("I think about the twelfth of April").'
    src:
      c: 7044a765
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 443–44: all'
        - 'via w.schlesinger-robert-kennedy-and-his 444 n.1: all'
    tags: [name:bissell-richard-m-jr, name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1961-04-13.european-community
    when: Apr. 13
    date: '1961-04-13'
    thread: european-community
    also: [europe-and-the-alliance]
    c: 'Kennedy to Adenauer: Britain best in the Community on an unconditional basis.'
    n: 'FRUS 1961–63, XIII, doc. [4](https://history.state.gov/historicaldocuments/frus1961-63v13/d4). See [[cal.1961-04-05.european-community]]. Names: Kennedy, Adenauer.'
    tags: [name:kennedy-john-f, name:adenauer-konrad]
  - id: cal.1961-04-13.cuba
    when: Apr. 13
    date: '1961-04-13'
    thread: cuba-bay-of-pigs
    c: 'New York, the Century. Berle and Schlesinger tell Miró Cardona no American troops will be sent and recognition will not be automatic. Miró: everyone knows the United States is behind it; "This help must come"; 10,000 Cubans will join the landing. He later said Berle promised 10,000 American troops; Schlesinger''s notes have arms for the Cubans who rose.'
    n: '[FRUS 1961–63, X, doc. 101](https://history.state.gov/historicaldocuments/frus1961-63v10/d101) (Schlesinger to Kennedy, Apr. 14). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 262, 264–65 (the instruction, 262; the lunch, 264–65). See [[cal.1961-04-12.cuba-2]]. Names: Berle, Schlesinger, Miró Cardona.'
    src:
      c: c5cf1be7
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d101: all'
        - 'w.schlesinger-thousand-days-1965 262: B'
        - 'w.schlesinger-thousand-days-1965 264–65: all'
