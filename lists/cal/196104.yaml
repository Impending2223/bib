  - id: cal.1961-04-18.cuba-9
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    c: 'The White House situation room, 7 a.m.: Dulles, Cabell and Bissell give Kennedy, Bundy, Rostow and the military aide the news from the beaches; no fallback raised. Rostow to spend the day at the CIA''s headquarters. By Bissell''s account, after Rostow''s.'
    n: '[[w.bissell-reflections-of-a-cold]], 188. To check: [[w.rostow-diffusion-of-power]], 209; Rostow, oral history interview by Richard Neustadt, Apr. 11, 1964, Kennedy Library (cited by [[w.bissell-reflections-of-a-cold]], 188 n.38). See [[cal.1961-04-18.cuba-4]]. Names: Dulles, Cabell, Bissell, Kennedy, McGeorge Bundy, Rostow.'
