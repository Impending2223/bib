    when: Apr. 3
    date: '1961-04-03'
    thread: cuba-bay-of-pigs
    c: 'Galbraith to Kennedy, told of the plan by Bowles: against it. "The futile campaign to the Yalu ruined the Democrats in 1950"; Dulles got Guatemala "at the price of losing all South America"; the U-2 "did not weigh the political cost of failure."'
    n: '[[w.jones-bay-of-pigs]], 66. To check: Galbraith to Kennedy, Apr. 3, 1961, in James Goodman, ed., *Letters to Kennedy: John Kenneth Galbraith* (1998), 64 (cited by [[w.jones-bay-of-pigs]], 66 n.56). See [[cal.1961-03-31.cuba-2]]. Names: Galbraith, Kennedy, Bowles.'
