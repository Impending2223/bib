  - id: cal.1961-04-30.latin-america-dominican-republic
    when: Apr. 30
    date: '1961-04-30'
    thread: latin-america-dominican-republic
    c: 'Dearborn to headquarters: the dissidents say the assassination will be attempted in the first week of May, with three carbines, four to six 12-gauge shotguns and other small arms; they will go ahead with what they have. "Owing to far-reaching political implications involved in release or non-release of requested items, Headquarters may wish discuss foregoing with State Department."'
    n: '[[w.sen-church-alleged-assassination-plots]], 206 (the cable; the report says the dissidents want the machine guns still). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, Apr. 30, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 206). See [[cal.1961-04-27.latin-america-dominican-republic]].'
  - id: cal.1961-04.cuba-bay-of-pigs-11
    when: Apr., before the 12th
    date: 1961-04
    at: before 1961-04-12
    thread: cuba-bay-of-pigs
    c: 'A council of war before the press conference of Apr. 12. A staff member who had sent Kennedy a memorandum against the plan suggests that if the exiles proclaim a government, are recognized, and ask for help, supporting forces might have to go in. Kennedy: "Under no circumstances. The minute I land one marine, we''re in this thing up to our necks. I can''t get the United States into a war, and then lose it, no matter what it takes. I''m not going to risk an American Hungary. And that''s what it could be, a fucking slaughter. ... Is that understood, gentlemen?" The deputy director of the CIA and the Joint Chiefs'' representative: "Yes, Mr. President."'
    n: '[[w.goodwin-remembering-america]], 174 (Goodwin''s account; the staff member not named). Names: Kennedy. Check: the day.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-04.cuba-bay-of-pigs-12
    when: Apr., the week of the 12th
    date: 1961-04
    at: before 1961-04-09
    place: washington
    thread: cuba-bay-of-pigs
    c: 'The State Department. Bissell goes over the final plans: the exiles "to establish a beachhead, establish a revolutionary government, and rally the oppressed army and people of Cuba to the banner of liberation." If they cannot hold: "they''ll move into the mountains here ... and form guerrilla units which we can resupply by air. That''s the worst that can happen." Goodwin asks how we know the Cuban people will support the rebels; Bissell, to his uniformed aide: "We have an NIE [National Intelligence Estimate] on that, don''t we?" The officer nods.'
    n: '[[w.goodwin-remembering-america]], 174–76 (Goodwin''s account; the map not topographical, the swamps not shown; the contingency never told the brigade). Names: Bissell, Goodwin. Check: the day; "that same week" as the press conference of Apr. 12 (174).'
    tags: [name:bissell-richard-m-jr, name:goodwin-richard-n]
  - id: cal.1961-04.cuba-4
    when: Apr., before the landing
    date: 1961-04
    at: before 1961-04-17
    place: washington
    thread: cuba-bay-of-pigs
    c: 'The Oval Office, on Goodwin''s return from Rio, the invasion approved. Kennedy leads him to a window over the Rose Garden: "Well, Dick, it looks like we''re finally going to put your Cuban policy into action": Goodwin''s campaign statement on the "freedom fighters."'
    n: '[[w.goodwin-remembering-america]], 179–80 (Goodwin''s account). See [[cal.1960-10-19.elections-1960-kennedy]]. Names: Kennedy, Goodwin. Check: the day; on Goodwin''s return from Rio, before the landing of Apr. 17.'
    tags: [name:kennedy-john-f, name:goodwin-richard-n]
  - id: cal.1961-04.cuba-bay-of-pigs-9
    when: Apr., early
    date: 1961-04
    at: before 1961-04-01
    place: washington
    thread: cuba-bay-of-pigs
    c: 'Bundy and Bell, at a weekly meeting with Sorensen, let him learn "almost accidentally" of the Cuba plan and its imminence. Sorensen asks the President in the Oval Office; he grimaces and will not discuss it, saying that those who know the subject are trying to protect themselves: "I know, everyone''s grabbing their nuts on this one."'
    n: '[[w.sorensen-counselor]], 316 (Sorensen''s account, written in 2008; "early in April"; the words as the page prints them; not the day). Names: Bundy, Bell, Sorensen, Kennedy. Check: the day.'
    tags: [name:sorensen-theodore-c, name:kennedy-john-f, name:bundy-mcgeorge, name:bell-david-e]
  - id: cal.1961-04.cuba-bay-of-pigs-13
    when: Apr., after the failure
    date: 1961-04
    at: after 1961-04-19
    thread: cuba-bay-of-pigs
    c: 'Sorensen holds a background session for the press, putting the failure in context: Kennedy had fired the weapon, but it had been built and loaded by his predecessor, Eisenhower. Kennedy publicly rejects the line.'
    n: '[[w.sorensen-counselor]], 317 (Sorensen''s account, written in 2008: "After it was over"; Kennedy''s answer at his press conference of Apr. 21, "I am the responsible officer of the government, and that is quite obvious," not entered here; not the day or the reporters). Names: Sorensen, Kennedy, Eisenhower. Check: the day.'
    tags: [name:sorensen-theodore-c, name:kennedy-john-f, name:eisenhower-dwight-d]
