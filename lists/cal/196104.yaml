    also: [cuba-bay-of-pigs]
    c: 'The 479th NSC, 10 a.m. to 12:02 p.m., Kennedy presiding, thirty-three present: Laos, and Cuba after the landing.{1} The congressional leaders to be told of Laos that morning.{2} By Rostow''s account, the worst White House meeting he attended: the Chiefs would not guarantee success even with the 60,000 men they had asked a month before; Johnson proposes they put their views in writing; seven memoranda, it is said, from the four Chiefs and the three service secretaries.{3}'
