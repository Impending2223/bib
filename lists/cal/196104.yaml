  - id: cal.1961-04-19.cuba-3
    when: Apr. 19
    date: '1961-04-19'
    thread: cuba-bay-of-pigs
    c: 'Berle and Schlesinger fly to the Opa-Locka airbase, Fla., where the Revolutionary Council is held under guard; Varona and Ray indict the CIA. Told the beachhead is lost, they fly the Council to Washington. Kennedy receives its members at the White House till six: no intervention; "you are all free men."'
    n: '[[w.schlesinger-thousand-days-1965]], 279–85, from his notes. [[w.reeves-president-kennedy]], 94, 96–97 (Opa-Locka; the Council flown to Washington and received). [[w.sorensen-kennedy]], 307 (Kennedy receives the Council). Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-15.cuba]]. Names: Berle, Schlesinger, Varona, Ray, Kennedy.'
