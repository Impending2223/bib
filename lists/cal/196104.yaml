    tags: [name:kennedy-john-f, name:kennedy-robert-f]
  - id: cal.1961-04-18.specials
    when: Apr. 18
    date: '1961-04-18'
    thread: specials
    c: 'Arkansas 6th, special. Catherine Dorris Norrell to her husband''s seat over the runner-up, 10,209 to 5,955, 43.1 percent, five Democrats running. No swing: Norrell unopposed in 1960.'
    n: 'Shares: Wikipedia. Check the date: April 18 or 19. Votes: CQ Guide 6th (2010) 1266. See [[cal.1961-04-04.states-and-cities]]. Names: Norrell.'
