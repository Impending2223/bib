  - id: cal.1961-04-24.cuba
    when: Apr. 24
    date: '1961-04-24'
    thread: cuba-bay-of-pigs
    c: 'The Taylor board''s second meeting, the Green Study Group, 10:20 a.m. to 5 p.m. at the CIA. Bissell''s chronology: by early January the 300 men for infiltration become a strike force, no paper recording the shift; 38 Special Forces officers at the camp, Jan. 12; the President briefed Jan. 28, no opinion offered; a meeting about Feb. 17, D-Day of Mar. 5 let slip a month. The paramilitary staff''s paper the same day: no written directives after Mar. 17, slow decisions, control too centralized.'
