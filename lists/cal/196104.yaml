    c: 'Chen Yun 陈云, by letter to Zhou Enlai 周恩来, reports on his Hangzhou 杭州 and Nanjing 南京 meetings on fertilizer plant: five works of 50,000 tons of synthetic ammonia finished a year and five begun, 250,000 tons of new capacity a year (a million tons of fertilizer), a pace only America has had for some years, against 620,000 tons of capacity in all since before 1949; whether it can be done will take years of trial to tell; imported materials 16 million dollars; materials first, then plant, then building; the small works of 800 and 2,000 tons still to be tried; he can still work half-days.'
