  - id: cal.1961-04-25.laos-3
    when: Apr. 25
    date: '1961-04-25'
    place: moscow
    thread: laos
    also: [soviet-union]
    c: 'Moscow, morning. The senior members of the International Commission for Laos, on their way to New Delhi and Indochina, consult the Soviet Foreign Ministry, Pushkin presiding: a political settlement the Russians'' aim; war with the United States to be avoided, concessions to the neutrals at the left''s expense; the conference to last no more than six weeks. No one from Peking, Hanoi or the NLHX asked.'
    n: '[[w.guan-vietnamese-communists-relations-with]], 191 (by Marek Thee, of the Polish delegation). Made public: 1973 ([[w.thee-notes-of-a-witness]]). To check: [[w.thee-notes-of-a-witness]], 16–18 (cited by [[w.guan-vietnamese-communists-relations-with]], 191 n.47). Names: Pushkin.'
    tags: [polity:ussr, polity:poland, polity:india, name:pushkin-georgiyi-maksimovich, vis:only:ussr+poland+india+canada]
