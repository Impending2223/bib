  - id: cal.1961-04-25.china-leadership-5
    when: Apr. 25
    date: '1961-04-25'
    place: tianhua
    thread: china-leadership
    also: [china]
    c: 'Tianhua brigade. In the morning Liu Shaoqi climbs Tianhua Hill to see the forest destruction. Afterward he convenes the work group on rural commerce: the supply and marketing cooperative is to belong to the members'' congress, not to the commune; its Party and political work are under the commune''s Party committee, and the commune may supervise it economically. In the afternoon he convenes the group on housing: houses pulled down must be paid for, brigade and commune cadres bearing the duty, and the compensation come out of the commune''s public fund. Housing is not to be settled in a year; two, three, four, five years if need be. In the evening he goes to Changsha.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 515–516 (Apr. 25, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
