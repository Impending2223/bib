    c: 'Changsha. Mao to Wang Dongxing, by letter: telephone Wang Renzhong and Wang Yanchun to be at Changsha at 2 p.m. on the 14th for three to five days, with the Hubei three-level conference''s bulletins and papers, to help the Hunan comrades on two matters, the mass line and seizing the initiative in time.{1} Hunan has not carried out the twelve-article policy in earnest, and in half a year has not cleared the five winds; power in many places not yet taken back from the enemy.{2} Copies to the Hunan secretariat, Liu Shaoqi, Tan Zhenlin and Hu Qiaomu.{3}'
