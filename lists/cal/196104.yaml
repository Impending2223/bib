        - 'via w.schlesinger-robert-kennedy-and-his 472 n.14: G'
        - 'w.jones-bay-of-pigs 120–21: B'
    tags: [name:lemnitzer-lyman-l, name:burke-arleigh-a, name:rusk-dean, name:bundy-mcgeorge, name:bissell-richard-m-jr, name:dulles-allen-w, name:kennedy-robert-f, name:bohlen-charles-e, name:bowles-chester, name:kennedy-john-f]
  - id: cal.1961-04-19.cuba-bay-of-pigs
    when: Apr. 19
    date: '1961-04-19'
    thread: cuba-bay-of-pigs
    also: [republican-party]
    c: 'Washington, Nixon''s house, after 7:30 p.m., by Nixon''s account. Allen Dulles, come to brief him for a speech: "Everything is lost. The Cuban invasion is a total failure." Two of the three air strikes canceled at the last. Dulles: he should have told the President "that we must not fail"; "It was the greatest mistake of my life."'
    n: '[[w.nixon-rn]], 232–33. See [[cal.1960-03-17.cuba]]. Names: Nixon, Dulles.'
    src:
