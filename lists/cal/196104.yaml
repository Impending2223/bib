        reads: 'Salinger: after the Cabinet Room conference, which "didn''t end until 4 A.M.," he and O''Donnell watched him for "the next forty-five minutes" walk "around the south grounds"'
        at: 148–49
  - id: cal.1961-04-18.cuba-bay-of-pigs-3
    when: Apr. 18
    date: '1961-04-18'
    place: washington
    thread: cuba-bay-of-pigs
    follows:
      - cal.1961-04-18.cuba-3
    c: 'The President''s office, after the lunch with Reston. O''Donnell suggests the line: the Cuban insurgents should say they have achieved their basic objectives, supply and reinforcement, and vanish into the hills. Kennedy is still turning over the idea of evacuating the patriots from the beaches; Bundy fears that would give evidence of U.S. intervention with no gain. Bundy: Dulles had more misgivings than he ever expressed to the President, out of loyalty to Bissell; he himself could not accept Bissell''s estimates of such a situation again. By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 113. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-04-18.cuba-3]]. Names: O''Donnell, Kennedy, Bundy, Dulles, Bissell, Schlesinger.'
    tags: [name:odonnell-kenneth-p, name:kennedy-john-f, name:bundy-mcgeorge, name:dulles-allen-w, name:bissell-richard-m-jr, name:schlesinger-arthur-m-jr, city:washington]
