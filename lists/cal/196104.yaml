    c: 'Stevenson to Kennedy and Rusk, from New York, noon: the atmosphere at the UN "highly unsatisfactory and extremely dangerous to U.S. position throughout world"; the Soviets and Castro''s Cubans hold the moral initiative, partly for want of planning to defend the American position. The seven-power resolution "best we can do." Everyone believes the United States engineered the revolt; whatever happens, "we are in for period of very serious political trouble."'
