  - id: cal.1961-04-04.cuba
    when: Apr. 4
    date: '1961-04-04'
    thread: cuba-bay-of-pigs
    c: 'The State Department, 6 p.m. Kennedy polls his advisers on Zapata. Fulbright, invited, speaks against it; Rusk opposed; Berle, Mann, McNamara for. Hawkins: groups of 200 too small. Kennedy still wants it to look like a rising from inside.'
    n: '[FRUS 1961–63, X, doc. 80](https://history.state.gov/historicaldocuments/frus1961-63v10/d80) (Gray''s notes). [[w.reeves-president-kennedy]], 79–82 (the meeting at State; the vote; Fulbright); [[w.jones-bay-of-pigs]], 66; [[w.bissell-reflections-of-a-cold]], 174–75 (the poll; Berle''s "Let ''er rip"; Nitze on Fulbright); [[w.rusk-as-i-saw-it-1990]], 213 (the advisers polled; Rusk''s reservation); [[w.sorensen-kennedy]], 305, 307 (the advisers polled; Fulbright''s objection); [[w.mcnamara-in-retrospect]], ch. 1 (the meeting at State, some twenty present; Fulbright alone against; McNamara for). [[w.fursenko-one-hell-of-a]], 88 (Kennedy''s wish for less "noise"). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 251–52 (Rusk''s part he calls "mild disclaimers"). Check: McNamara has Rusk, "though not enthusiastic," say yes, as he did, and all the Joint Chiefs endorse the plan (ch. 1). See [[cal.1961-03-29.cuba]]. Names: Kennedy, Fulbright, Rusk, Berle, Mann, McNamara, Hawkins. Check: Rusk places the poll in his own office after a press conference at the State Department, he the only one there to voice a reservation (213).'
    src:
      c: afb0ff69
      rows:
