    thread: china-leadership
    c: 'Peking. Lin Biao 林彪 chairs the Military Commission''s Standing Committee, its 26th meeting: He Long 贺龙, Luo Ronghuan 罗荣桓, Ye Jianying 叶剑英 and Luo Ruiqing 罗瑞卿; Liu Yalou 刘亚楼, Liang Biye and others observing. Luo Ronghuan, against Lin''s "learning with questions in mind," proposes striking the phrase from the document. By the standard Party histories Lin has to agree, does not hide his anger, and leaves the meeting unexpectedly.'
    n: '[[w.teiwes-tragedy-of-lin-biao]], 193. Made public: 1991 ([[w.yao-luo-ruiqing]]). To check: [[w.yao-luo-ruiqing]], 205 (cited by [[w.teiwes-tragedy-of-lin-biao]], 193 n.55). See [[cal.1961.china-leadership-81]]. Names: Lin Biao, He Long, Luo Ronghuan, Ye Jianying, Luo Ruiqing, Liu Yalou.'
