  - id: cal.1961-04-20.europe-and-the-alliance
    when: Apr. 20–24
    date: '1961-04-20'
    thread: europe-and-the-alliance
    also: [european-community]
    c: 'Policy directive, "NATO and the Atlantic Nations," from Acheson''s review; approved Apr. 21; NSAM 40, Apr. 24, for its execution. First priority in Europe to forces for contingencies short of nuclear or massive attack; the American divisions to stay. Support for European integration: Britain not to stay apart "by hopes of a ''special'' relation with the U.S."; the Six to welcome it.'
