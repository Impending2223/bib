    c: 'The Joint Chiefs to McNamara, JCSM-278-61, Wheeler signing: an outline plan, from CINCLANT''s Operation Plan 312-61, for overthrowing Castro by American force. Airborne and Marine assault on western Cuba;{1} Havana held by D+8; organized resistance over by D+30 to D+54;{2} 18 days from the decision to the landing; ground casualties about 16 percent.{3} "Swift, sharp, and overwhelming," and an incident created to justify it.{4}'
