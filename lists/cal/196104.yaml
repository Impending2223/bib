    c: 'Peking 北京. Chen Yun 陈云 sees the Shanghai Pingtan Troupe 上海评弹团 perform in a theater.{1} Afterwards he meets its members: at Nanjing 南京 some days before he heard an opening song in praise of the Great Leap 大跃进, "rice yielding 200,000 jin, a melon of 200 jin, peaches as big as a face", such things once sung but not to be sung now; Jiangsu 江苏 to be told to look over such lyrics.{2}'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 84. Made public: 2015. Names: Chen Yun.'
