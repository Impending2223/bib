    c: 'Peking.{1} Deng Xiaoping, with Peng Zhen, who organizes five teams from the city party, inquires into communes around the capital: Deng at Shunyi county, with his wife and Liao Mosha;{2} Peng Zhen leads twenty-three in a forty-day survey of Huairou county;{3} Liu Ren a six-person team to Fengtai.{4}'
