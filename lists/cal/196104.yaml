  - id: cal.1961-04.china-leadership-13
    when: Apr.–May
    date: 1961-04
    thread: china-leadership
    c: 'The Central Control Commission 中央監委 sends Li Jian 李堅, head of its rural section 農村處, and Zhang Huan 張環 to Anhui 安徽 to inquire further. Going straight to the counties, they learn of mass deaths in 28 counties, among them Bengbu''s 15; the head of the Bengbu supervisory committee, Deng Yancai 鄧衍才, tells them the 15 counties have lost a million. In Fengyang 鳳陽 and Dingyuan 定遠 they learn more, and at the provincial level Li gathers the supervisory committee''s staff and demands they report the truth; Zeng Xisheng 曾希聖, shown Li''s material, slaps the table: "they are carrying on espionage in Anhui!"'
    n: '[[w.yang-jisheng-mubei]], I, 325–326. Made public: 2008. To check: Li Jian 李堅, talk with Yang Jisheng, Apr. 9, 2001 (afternoon, at Li''s home) (cited by [[w.yang-jisheng-mubei]], I, 325 n.98). Check: the days; the book gives "Apr. and May 1961". Zeng''s outburst is undated. Names: Zeng Xisheng.'
    src:
      c: c2d0b926
      rows:
        - 'w.yang-jisheng-mubei I, 325–326: all'
        - 'via w.yang-jisheng-mubei I, 325 n.98: all'
    tags: [polity:prc, vis:only:prc, ok:fields-place, name:zeng-xisheng]
  - id: cal.1961-04.china-leadership-14
    when: Apr.
    date: 1961-04
    thread: china-leadership
    c: The research group of the rectification work group 整社工作組 at Guabu 瓜埠 commune, Luhe 六合 county, issues its preliminary investigation report on the cadres' style at the commune 《關於六合縣瓜埠公社幹部作風問題的初步調查報告》; the Navy Political Department's political theory teaching office prints it. At Baojiang 保江 brigade the Party branch secretary, Ma Qiyin 馬其銀, reported 1,070,000 jin of grain for 1959 against an actual 960,000, and the levy was set on 1,070,000. When it could not be met, households were searched and the private-plot grain and the rations all taken; members ate wild herbs, and edema, deaths, outflow and abandoned infants followed. Of the brigade's 41 cadres all but one team head had beaten people, and 28 percent of its laborers were beaten. Ma beat 20 or 30 people a month and followed the commune secretary Wen 溫 in all. When the brigade had 201 edema cases, 75 deaths, 22 abandoned infants and 13 outflow, he still falsely reported 30,000 jin of grain in hand.
    n: '[[w.yang-jisheng-mubei]], I, 378, 382. Made public: 2008. To check: Guabu commune rectification research group 瓜埠公社整社工作研究小組, "Guanyu Liuhe xian Guabu gongshe ganbu zuofeng wenti de chubu diaocha baogao" 《關於六合縣瓜埠公社幹部作風問題的初步調查報告》, April 1961, printed by the Navy Political Department''s political theory teaching office (cited by [[w.yang-jisheng-mubei]], I, 378 n.26; I, 382 n.32). See [[cal.1960-01-27.china-leadership-7]]. Check: the day.'
    src:
      c: 53de95e7
      rows:
