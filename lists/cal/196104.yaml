        - 'via w.bissell-reflections-of-a-cold 188 n.38a: A-B'
        - 'via w.bissell-reflections-of-a-cold 188 n.38b: A-B'
    tags: [name:dulles-allen-w, name:cabell-charles-p, name:bissell-richard-m-jr, name:kennedy-john-f, name:bundy-mcgeorge, name:rostow-walt-w]
  - id: cal.1961-04-18.cuba-11
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    c: 'Rostow at the CIA''s headquarters through the day: the staff "pulling at Dickie''s coat, begging him to send in the army"; the cables worse and worse. Rostow calls O''Donnell: Bissell has a message for the President; at night he drives Bissell to the White House. By Bissell''s account, after Rostow''s.'
    n: '[[w.bissell-reflections-of-a-cold]], 188–89. To check: Rostow, interview by Jonathan E. Lewis (cited by [[w.bissell-reflections-of-a-cold]], 189 n.39). See [[cal.1961-04-18.cuba-9]]. Names: Rostow, Bissell, O''Donnell.'
    src:
      c: 731a441c
      rows:
        - 'w.bissell-reflections-of-a-cold 188–89: all'
    tags: [name:rostow-walt-w, name:bissell-richard-m-jr, name:odonnell-kenneth-p]
  - id: cal.1961-04-18.cuba-5
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    c: 'Bundy to the President, before the noon meeting: the situation "not a bit good"; Castro''s forces stronger, the popular response weaker. The CIA''s request for Navy cover to the B-26s attacking the tanks to be granted. "The right course now is to eliminate the Castro air force, by neutrally-painted U.S. planes if necessary, and then let the battle go its way."'
    n: '[FRUS 1961–63, X, doc. 119](https://history.state.gov/historicaldocuments/frus1961-63v10/d119). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 116. See [[cal.1961-04-15.cuba]]. Names: McGeorge Bundy, Kennedy, Castro.'
    src:
      c: 667b0cec
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d119: all'
        - 'w.jones-bay-of-pigs 116: D'
        - 'via w.jones-bay-of-pigs 116 n.9b: D'
    tags: [name:bundy-mcgeorge, name:kennedy-john-f, name:castro-fidel]
  - id: cal.1961-04-18.cuba-6
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    c: 'Gray, for the Chiefs, on Burke''s telephoned word from the White House, to Dennison and Clark. 1:37 p.m.: unmarked Navy aircraft to reconnoiter the beach. 2:49 p.m.: unmarked Navy planes readied for possible combat, unmarked boats for evacuation; "We are operating almost entirely in the dark"; no intention of intervening with American forces.'
    n: 'FRUS 1961–63, X, docs. [122](https://history.state.gov/historicaldocuments/frus1961-63v10/d122); [123](https://history.state.gov/historicaldocuments/frus1961-63v10/d123). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 117. See [[cal.1961-04-18.cuba-4]]. Names: David Gray, Burke, Dennison.'
