      c: fa8af241
      rows:
        - 'w.schlesinger-thousand-days-1965 269: all'
    tags: [name:castro-fidel]
  - id: cal.1961-04-14.cuba-bay-of-pigs-2
    when: Apr. 14
    date: '1961-04-14'
    place: washington
    thread: cuba-bay-of-pigs
    c: 'The White House, the Friday before the landings. Kennedy, for the first time, talks to O''Donnell of the Cuban invasion plan, and shows him that morning''s message from a Marine colonel who had inspected the brigade in Guatemala, confident it could carry out its mission. Of calling the plan off: "I don''t know if we could go down there and take the guns away from them." Of opposition among his top officials: "Not one, unless you count Bill Fulbright among our top officials."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 305–07 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Fulbright.'
    tags: [name:kennedy-john-f, name:odonnell-kenneth-p, name:fulbright-j-william, polity:cuba]
  - id: cal.1961-04-14.space
    when: Apr. 14
    date: '1961-04-14'
    thread: space
    c: 'Sorensen''s office: Bell and his assistants, Wiesner and his space experts, Dryden. The Soviet lead in rocket thrust will win every first, but a manned lunar landing is far enough off that the United States might have as good a chance. Sorensen, by his recollection, first discusses the moon here.'
    n: '[[w.sorensen-counselor]], 334–35 (Sorensen''s account, written in 2008: "That Friday, April 14"; "I believe it was at this meeting"; the meetings that day "merge in my memory"). Names: Sorensen, Bell, Wiesner, Dryden.'
    tags: [name:sorensen-theodore-c, name:bell-david-e, name:wiesner-jerome-b, name:dryden-hugh-l]
  - id: cal.1961-04-14.space-2
    when: Apr. 14
    date: '1961-04-14'
    place: washington
    thread: space
    c: 'The Cabinet Room, evening: the President, Sorensen, other advisers and Hugh Sidey on the options in space. Sidey asks about going to the moon; Kennedy: "Wait here," and calls Sorensen into the Oval Office, incredulous but excited: "Get it staffed out. ... Go find out what McNamara''s department thinks."'
    n: '[[w.sorensen-counselor]], 335–36 (Sorensen''s account, written in 2008; "I do not recall precisely what was said"; Sorensen then tells Sidey, "We''re going to the moon," not entered). See [[cal.1961-04-12.space-2]]. Names: Kennedy, Sorensen, Sidey.'
    tags: [name:sorensen-theodore-c, name:kennedy-john-f, name:sidey-hugh]
