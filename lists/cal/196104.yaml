    c: 'The second strike cancelled.{1} At 9:30 p.m.{2} Bundy tells Cabell: no air strikes at dawn until they can fly from a strip in the beachhead.{3} Cabell and Bissell to Rusk, 10:15: strikes in the beachhead allowed, the airfields not;{4} they do not ask to speak to the President.{5} The order reaches Puerto Cabezas with the crews in their cockpits.{6}'
