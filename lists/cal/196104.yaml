    c: 'D plus two. A White House meeting on Cuba: Lemnitzer, Burke, Rusk, Bundy, Bissell, Dulles. By Robert Kennedy''s memorandum of June 1, "everybody really seemed to fall apart"; he urges them to plan for the next six months or a year. About three, troops into Cuba discussed, Bohlen for, Rusk against, and a blockade; "it ended up in not doing a great deal." By Bowles''s account, the consensus "to get tough with Castro."'
