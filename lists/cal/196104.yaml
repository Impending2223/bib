    also: [laos]
    c: 'The People''s Army with the Pathet Lao opens the Central Laos campaign along Route 9: Cha Ky, Ban Dong, Xê Pôn and Muong Phine taken, the base in central and southern Laos widened; the Lao Party agrees to the strategic supply road''s moving west of the Trường Sơn. Before it, Campaign 128, Military Region 4''s battalions with the Pathet Lao along Route 12 to Nadu and Nhommarath.'
    n: '[[w.lich-su-khang-chien-chong-my]], III, 129; [[w.guan-vietnamese-communists-relations-with]], 189 (the Central Military Committee, with the Lao Động and NLHX Central Committees'' consent, approves the plan of Military Region V and Group 559 for the Route 9 region and southern Laos; the 325th Division, the 19th border-defense battalion of Military Region IV, the 927th Battalion of Hà Tĩnh and the Pathet Lao, under the 325th Division and Group 559; opened Apr. 11). Made public: 2013. Check: the day: opened Apr. 11, 1961, by [[w.guan-vietnamese-communists-relations-with]], 189. To check: [[w.bam-opening-the-trail]], 9–15 (cited by [[w.guan-vietnamese-communists-relations-with]], 189 n.40).'
    tags: [polity:drv, vis:only:drv]
