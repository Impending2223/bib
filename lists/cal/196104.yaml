    thread: press-and-broadcasting
    also: [cuba]
    c: 'Schlesinger sends Kennedy "Our Men in Miami," Karl Meyer''s article due in the *New Republic*;{1} Kennedy: "Stop it."{2} Schlesinger, after seeing the publisher: "Gil Harrison came through like a gentleman and a patriot. He asked no questions and said he would drop the piece."{3}'
    n: '[[w.reeves-president-kennedy]], 83; [[w.schlesinger-journals]], 109 (Thursday morning Gil Harrison sent over the pseudonymous "Our Men in Miami," a careful and substantially accurate account of CIA activities in Miami; Schlesinger handed it to the President, who "soon sent me word that he hoped it could be stopped"; Schlesinger "called Gil," who "accepted the suggestion promptly and without questions"; not Karl Meyer or the words attributed to Kennedy and Harrison). Check: Schlesinger''s part: [[w.schlesinger-journals]], 109, has him telephone Harrison ("So I called Gil"), not see him. To check: Schlesinger to Kennedy, Apr. 6, 1961, Schlesinger Papers, box W-5, Kennedy Library; Schlesinger to Kennedy, follow-up, Apr. 6, 1961, Schlesinger Papers, box W-5, Kennedy Library (cited by [[w.reeves-president-kennedy]], 83). See [[cal.1961-04-07.cuba]]. Names: Schlesinger, Kennedy.'
