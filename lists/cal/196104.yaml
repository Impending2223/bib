    when: Apr. 18
    date: '1961-04-18'
    time: 1961-04-18T21:52Z
    thread: cuba-bay-of-pigs
    c: 'Dennison, at Norfolk. 4:52 p.m.: six F3H fighters at Key West, their markings painted out, armed with air-to-air missiles, ready for combat over the beach by daylight Apr. 19. 6:06 p.m., to the Chiefs: an amphibious squadron to stand by to evacuate; every American aircraft a Navy type "and will be recognized as such"; "I too have been operating in the dark."'
    n: 'FRUS 1961–63, X, docs. [126](https://history.state.gov/historicaldocuments/frus1961-63v10/d126) (to McElroy); [129](https://history.state.gov/historicaldocuments/frus1961-63v10/d129). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 117. See [[cal.1961-04-18.cuba-4]]. Names: Dennison.'
