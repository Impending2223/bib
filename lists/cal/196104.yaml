    c: 'Kennedy, given Schlesinger''s account of Miró, calls Bissell: Miró to go ahead on the understanding of no American military intervention, or the operation is cancelled. Barnes to New York; Miró assents. By Bissell''s memoir the President also has him reduce the strike of Apr. 15, to be "minimal": Bissell cuts the sixteen B-26s to eight.'
