    c: 'The White House, 5:45 p.m.{1} Bissell''s last revision: a pilot to land at Miami as a defector; air strikes on D-2.{2} Kennedy stresses no association with the United States;{3} training in the United States to stop. No-go times: noon, Apr. 14, for the strikes; noon, Apr. 16, for the landing.{4}'
