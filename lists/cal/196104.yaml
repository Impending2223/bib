  - id: cal.1961-04-30.china-leadership-2
    when: Apr. 30
    date: '1961-04-30'
    place: tianhua
    thread: china-leadership
    also: [china]
    c: 'Tianhua brigade. In the morning Liu Shaoqi convenes the work group on what to do next: the mass line to be carried through from start to end, the "charity" view dropped; it is easy to say and hard to do; in these three years the masses were not allowed to run their own affairs, and that is why houses were pulled down and residents moved. In the evening he talks with some of the brigade''s cadres, hoping they will draw the lesson, correct the errors and make the brigade well. Afterward he goes to Changsha.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 516–518 (Apr. 30, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1961-04.china-leadership-9
    when: Apr., mid to late
    date: 1961-04
    at: after 1961-04-10
    place: tianhua
    thread: china-leadership
    also: [china]
    c: 'At Tianhua brigade Liu Shaoqi learns of the case of Feng Guoquan and his son, the brigade''s stock-keepers: a plow ox they fed died in Feb. 1957, a three-inch iron wire was found in its lung at autopsy, and they were criticized and held as saboteurs. Liu orders the Hunan Public Security Department to look into it; it reviews the case, the verdict is reversed and Feng is cleared.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 518 (Apr., mid to late, 1961). The chronology gives only "mid and late April" (4月中下旬) for Liu''s learning of it. Its sequel: the Hunan department''s report to the Hunan committee and the Ministry of Public Security of June 30, and Liu''s reading of it in Peking July 10, are entries of their own. Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
