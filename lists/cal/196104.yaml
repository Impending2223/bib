    time: 1961-04-06T14:15Z
    place: washington
    thread: cuba-bay-of-pigs
    c: 'The White House, 9:15 a.m., an hour and a half.{1} Bissell on Masferrer to be arrested and a B-25 and boats seized; a pilot''s defection on D-3 with air strikes; a guerrilla landing on D-2. Apr. 16 the last day to call it off. Kennedy: continue planning; the strikes limited; the operation to look Cuban.{2} Schlesinger, after it: "We seem now destined to go ahead on a quasi-minimum basis—a large-scale infiltration (hopefully) rather than an invasion."{3}'
    n: '[FRUS 1961–63, X, doc. 84](https://history.state.gov/historicaldocuments/frus1961-63v10/d84) (the appointment book; Gray''s notes). [[w.schlesinger-thousand-days-1965]], 256, from his notes (the quotation). [[w.jones-bay-of-pigs]], 67–68 (the meeting; Bissell''s measures; the last day). Made public: [[w.schlesinger-thousand-days-1965]] (1965); FRUS 1961–63, X (1997). Check: the Cuba Study Group (FRUS 1961–63, X, doc. 231, par. 30) has the defection strikes on D-2, and Bissell at the meeting of Apr. 6 for an all-out strike on D-Day instead. See [[cal.1961-03-29.cuba]]. Names: Bissell, Kennedy, Schlesinger.'
    src:
      c: bf2fbf27
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d84: 1, 2'
        - 'w.schlesinger-thousand-days-1965 256: 3'
        - 'w.jones-bay-of-pigs 67–68: 2'
        - 'via w.jones-bay-of-pigs 68 n.60a: 1, 2'
        - 'via w.jones-bay-of-pigs 68 n.60b: 1, 2'
    tags: [name:schlesinger-arthur-m-jr, name:bissell-richard-m-jr, name:kennedy-john-f]
