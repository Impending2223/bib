  - id: cal.1961-04-17.cuba-bay-of-pigs
    when: Apr. 17
    date: '1961-04-17'
    thread: cuba-bay-of-pigs
    also: [robert-kennedy]
    c: 'Williamsburg, Va., about 10 a.m., at the end of Robert Kennedy''s speech. The President by telephone: they have landed; "I don''t think it''s going as well as it should." Robert Kennedy flies back, and spends most of the next three or four days at the White House. By his account.'
    n: '[[w.robert-kennedy-in-his]], 242–43. See [[cal.1961-04-17.cuba]]. Names: Kennedy, Robert Kennedy.'
