    thread: china-leadership
    c: Hu Qiaomu 胡喬木 and others of the Central investigation group report on settling the mess-hall question in Shaoshan 韶山 commune. The halls, they find, take a third to a half of a team's labor for firewood, vegetables and cooking, and so cut the work point. In Wangchong 旺沖 team of Shaoshan brigade a work point was worth 0.94 yuan in 1957; in 1961, with 1,466 days of farm work and 1,812 for the hall, it fell to 0.32, against 0.69 without the hall. The team's pigs fell from 54 to 4 and its chickens from over 100 to 11.
    n: '[[w.yang-jisheng-mubei]], II, 760–761; [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 303–309 (the investigation group''s report, undated there, printed in full among the four enclosures to Hu Qiaomu''s letter of Apr. 14, which the Center forwarded Apr. 26). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 303–309). See [[cal.1961-04-15.china-leadership-5]]. Names: Hu Qiaomu.'
