    time: 1961-04-20T16:00Z
    place: washington
    thread: cuba
    also: [vietnam]
    c: 'The Cabinet, 11 a.m. to noon, by Bowles''s notes: "about as grim as any meeting";{1} Kennedy "quite shattered." Goldberg: not to be undertaken without readiness to send troops. Robert Kennedy and Bell the angriest.{2} Kennedy puts Gilpatric at the head of a Presidential Task Force on Vietnam.{3} Then the Oval Office, half an hour, with Johnson, McNamara and Robert Kennedy, who turns on Bowles;{4} "an almost frantic reaction for an action program."{5} McNamara to the President that afternoon: "A program of action to prevent Communist domination of South Viet-Nam," to be ready in a week.{6}'
