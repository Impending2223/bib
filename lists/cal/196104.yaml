    c: 'Huairou 怀柔. Peng Zhen 彭真 presides at the Peking municipal committee''s forum hearing Liu Ren 刘仁 and the suburban county and district secretaries on the size of communes and brigades, the five groups present: the aim to free the productive forces and solve the two egalitarianisms; the peasant a laborer and a small owner, more pay for more work; members cannot "see, grasp or manage" their interests; the old advanced cooperative suits the present level; "three contracts and a bonus," fair work points; the communes set up without inquiry or trial.'
