    when: Apr. 14
    date: '1961-04-14'
    thread: latin-america
    c: 'Kennedy to the OAS Council at the Pan American Union: the Alliance for Progress to be speeded, through the institutions already in being. Schlesinger''s draft; Kennedy cuts its two passages against Castro.'
    n: 'Remarks at the Protocolary Session of the Council of the Organization of American States, [1961 Pub. Papers 276](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=334) (Apr. 14, 1961). [[w.schlesinger-thousand-days-1965]], 265–66. See [[cal.1961-03-13.latin-america]]. Names: Kennedy, Schlesinger, Castro.'
    src:
      c: c14d32a5
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=334: all'
        - 'w.schlesinger-thousand-days-1965 266: all'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:castro-fidel]
  - id: cal.1961-04-14.cuba
    when: Apr. 14
    date: '1961-04-14'
    thread: cuba-bay-of-pigs
    c: 'Kennedy, given Schlesinger''s account of Miró, calls Bissell: Miró to go ahead on the understanding of no American military intervention, or the operation is cancelled. Barnes to New York; Miró assents.'
