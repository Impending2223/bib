    c: 'Clark, from the Essex, to Dennison, the brigade''s messages intercepted.{1} 4:42 p.m.: "Blue Beach must have jet air support in next few hours or will be wiped out"; "Red Beach wiped out."{2} 11:52 p.m., San Román: "Do you back us up or quit?"; "Please don''t desert us"; "I will not be evacuated. Will fight to the end if we have to."{3}'
