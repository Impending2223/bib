    place: hangzhou
    thread: china-leadership
    also: [laos, china]
    c: 'Zhou Enlai and Souvanna Phouma issue a joint statement: a widened Geneva conference of fourteen states, as Prince Sihanouk proposed, is the only effective way to a peaceful settlement in Laos;{1} the two governments decide to establish diplomatic relations and exchange ambassadors.{2} On the next day Zhou returns to Peking.{3}'
