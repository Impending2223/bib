    c: 'Yibin 宜宾, Sichuan 四川. Zhu De 朱德 arrives and inspects the Anbian People''s Commune 安边人民公社 of Yibin county 宜宾县.{1} He hears its report, and on the masses'' hardships interjects: the difficulties a fact; the Communist Party''s 共产党 leaders must face them and press on, not shrink; difficulty is passing, morale to be raised; the leaders'' chief task now the masses'' livelihood; our revolution began in the mountain gullies, the mountain areas'' building to be sped and the people''s life bettered.{2}'
