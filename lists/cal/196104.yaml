    c: 'Hangzhou, 9 a.m.{1} Mao to Deng Xiaoping: a notice calling a work conference at Peking May 15 (the drafting committee of the Sixty Articles May 9), to finish Guangzhou''s work: the members'' and cadres'' views, the Sixty Articles revised, the "five winds";{2} meanwhile ten to fifteen days'' inquiry into mess halls, grain, supply, hills and forests, draught animals, repayment, handicrafts, supply cooperatives.{3} Settled that evening with Zhou Enlai, Deng and Tian Jiaying.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 25, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 61 (the topics Mao sent Deng Xiaoping, circulated to the provinces the day he received them); [[w.jianguo-yilai-mao-zedong]], XVI, 13–15 (Apr. 25, 1961; the letter to Deng Xiaoping: the dates, the tasks, the topics for inquiry; written at 9 a.m., Mao asking Deng to draft the notice with Tian Jiaying, settle it that evening and send it by telegram next day); [[w.deng-xiaoping-nianpu-1904]], III, 1633–1634 (Apr. 25, 1961; Deng reads Mao''s letter of that morning; footnote 2: the work conference sat in Peking May 21–June 12; evening (晚), Deng, Zhou and Tian Jiaying at Mao''s lodging on the draft notice; the Zhejiang inquiry team to spend ten days at Shengxian on the villages'' problems); [[w.mao-zedong-zhuan]], V, ch. 68 n.8 (Apr. 25: Mao has Deng Xiaoping and Tian Jiaying draft the notice calling a Central Work Conference in Peking in May, to finish Guangzhou''s task; the notice goes out that evening; the topics for inquiry listed). [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 317 n.1 (the Center''s notice of Apr. 25 calling the work conference for mid-May, quoted: the mess halls, grain, the supply system, the hills and woods, fuel hills for the peasants, "three guarantees and one reward", draught animals and tools to brigade or team, rectification and restitution in the first- and second-class counties, communes and brigades, handicrafts and the supply and marketing cooperatives, to be studied at points for ten to fifteen days). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.mao-zedong-shuxin-xuanji]], 578–82 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 61 n.124a); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 465–72, 482–85, 488, 494–503, 507–11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 61 n.124b); [[w.bian-mao-zedong-he-tade]], 50–53 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 61 n.124c); Mao Zedong 毛泽东, letter to Deng Xiaoping 邓小平 on the notice convening a Central Work Conference (manuscript 手稿), Apr. 25, 1961; in [[w.mao-zedong-wenji]], VIII, 268–269 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.8). Names: Mao Zedong, Deng Xiaoping, Zhou Enlai, Tian Jiaying.'
