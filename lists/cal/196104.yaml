    date: '1961-04-18'
    time: 1961-04-18T21:42Z
    thread: cuba-bay-of-pigs
    c: 'Clark, from the Essex, to Dennison, the brigade''s messages intercepted. 4:42 p.m.: "Blue Beach must have jet air support in next few hours or will be wiped out"; "Red Beach wiped out." 11:52 p.m., San Román: "Do you back us up or quit?"; "Please don''t desert us"; "I will not be evacuated. Will fight to the end if we have to."'
    n: 'FRUS 1961–63, X, docs. [125](https://history.state.gov/historicaldocuments/frus1961-63v10/d125); [135](https://history.state.gov/historicaldocuments/frus1961-63v10/d135). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 117–18. To check: Kirkpatrick, "Inspector General''s Survey of the Cuban Operation," Oct. 1961, 40, in [[w.bay-of-pigs-declassified]] (cited by [[w.jones-bay-of-pigs]], 118 n.18). See [[cal.1961-04-18.cuba-4]]. Names: Dennison, San Román.'
