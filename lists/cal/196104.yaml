    when: Apr. 19
    date: '1961-04-19'
    thread: cuba-bay-of-pigs
    c: By five, some twenty men left on Blue Beach. Five row a small boat out by hand; eight in another killed by an aircraft. Through the next days two Americans and Cuban frogmen pick up twenty-six survivors in the keys west of the bay; the five picked up by a destroyer four days later.
