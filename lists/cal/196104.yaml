  - id: cal.1961-04-21.cuba-bay-of-pigs-3
    when: Apr. 21
    date: '1961-04-21'
    place: washington
    thread: cuba-bay-of-pigs
    c: 'The President''s breakfast with Rusk, Salinger, Bundy, Sorensen, Goodwin and Schlesinger, to prepare the press conference on Cuba. Kennedy: "There is only one person in the clear [in Cuba]—that''s Bill Fulbright." Of Schlesinger''s memorandum against the expedition: "Arthur wrote me a memorandum that will look pretty good when he gets around to writing his book on my administration—only he better not publish that memorandum while I''m still alive!" By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 118; [[w.goodwin-remembering-america]], 181 (Goodwin''s account, from his notes: the breakfast before the press conference; Kennedy: "The happiest people in government today are the ones who can say they didn''t know anything about it"; "I''ll make a short opening statement designed to cut off questions about Cuba, and not take any more questions on the subject"; concern that the blame not fall wholly on the CIA, after Reston''s story that the operation was not properly staffed and had no NSC meeting; "It was decided to leak the story that this operation had been carefully studied by the Joint Chiefs of Staff, and approved"; he "could fire Allen Dulles," but Dulles "helped keep the Republicans off his back"; "if we just sit tight for about three weeks, things will cool off"; not those present by name, Fulbright or Schlesinger''s memorandum). Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-04-21.cuba]]. Names: Rusk, Salinger, Bundy, Sorensen, Goodwin, Schlesinger, Kennedy, Fulbright.'
    src:
      c: a81e583e
      rows:
