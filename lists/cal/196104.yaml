  - id: cal.1961-04-01.soviet-union
    when: Apr. 1
    date: '1961-04-01'
    thread: soviet-union
    also: [berlin-and-vienna, cuba-bay-of-pigs]
    c: 'Thompson with Khrushchev, on Laos, the Congo and Cuba.{1} Khrushchev agrees to the President''s proposal of a meeting at the end of May, in Vienna or Stockholm.{2} On Cuba: the Soviet Union has no base there, the only base the American one;{3} why no diplomatic relations with Havana?{4}'
    n: 'FRUS 1961–63, V, doc. [51](https://history.state.gov/historicaldocuments/frus1961-63v05/d51) (its n.7, telegram 2361: the meeting); X, doc. [77](https://history.state.gov/historicaldocuments/frus1961-63v10/d77) (Cuba). [[w.fursenko-one-hell-of-a]], 88, 90 (Vienna or Stockholm; Cuba); [[w.fursenko-khrushchevs-cold-war]], 347 (Khrushchev agrees to meet; the Americans then ask June and Vienna); [[w.sorensen-kennedy]], 642 (the warning on Laos conveyed to Khrushchev by Thompson, and by Nehru). See [[cal.1961-02-22.berlin-and-vienna]]. Names: Thompson, Khrushchev.'
