    c: 'Lemnitzer to Dennison, 6:30 p.m., JCS 468-61: the operation, once begun, now cancelable until the landing, and aborted if American forces intervene. Premature intervention to be avoided: Castro''s ships or aircraft engaged only when a friendly ship''s destruction is imminent;{1} an initial strafing or bomb run acceptable.{2}'
