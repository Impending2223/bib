  - id: cal.1961-04-19.cuba-4
    when: Apr. 19
    date: '1961-04-19'
    place: washington
    thread: cuba
    also: [robert-kennedy]
    c: 'Robert Kennedy to the President, through O''Donnell: no return to waiting and hoping.{1} Three courses: American troops, rejected "for good and sufficient reasons (although this might have to be reconsidered)"; a blockade;{2} or the American republics, through the OAS, to keep all outside arms from Cuba, perhaps after a reported MIG attack on Guantánamo.{3} "If we don''t want Russia to set up missile bases in Cuba, we had better decide now what we are willing to do to stop it."{4}'
    n: '[FRUS 1961–63, X, doc. 157](https://history.state.gov/historicaldocuments/frus1961-63v10/d157). [[w.schlesinger-robert-kennedy-and-his]], 471; [[w.jones-bay-of-pigs]], 133 (the memorandum); [[w.thomas-robert-kennedy]], 121–22 (the memorandum, dictated in the early morning: "Something forceful and determined must be done"; the staged attack on Guantánamo; Soviet missiles). [[w.fursenko-one-hell-of-a]], 96–97. See [[cal.1961-04-15.cuba]]. Names: Robert Kennedy, Kennedy, O''Donnell.'
