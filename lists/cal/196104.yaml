      c: 7a57689d
      rows:
        - 'w.schlesinger-thousand-days-1965 275–76: all'
    tags: [name:kennedy-john-f, name:reston-james, name:schlesinger-arthur-m-jr, name:dulles-allen-w]
  - id: cal.1961-04-18.cuba-4
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    also: [robert-kennedy]
    c: 'D plus one, by Robert Kennedy''s memorandum of June 1. About noon or one o''clock the CIA asks air cover; the President for it; Rusk strongly against, no American forces having been the commitment. Robert Kennedy: not enough is known to say whether it would save the men. Burke to send the Navy over the beach to see; about 7 p.m., no fighting seen, the beachhead some ten miles deep. By Burke''s account, taped that day: the Cabinet Room from noon, "Real big mess," the Chiefs kept ignorant; the President then in his office with Rusk, McNamara, Dulles, Lemnitzer and Burke, Rusk against doing much; unmarked Navy aircraft over the beach, Navy cover, evacuation and an air drop discussed, only the drop decided. Later the President calls Burke twice, relying on him.'
    n: 'FRUS 1961–63, X, docs. [121](https://history.state.gov/historicaldocuments/frus1961-63v10/d121) (Burke''s conversation with Wilhide); [124](https://history.state.gov/historicaldocuments/frus1961-63v10/d124) (Burke to Dennison, 3:23 p.m.: the questions and actions discussed). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-robert-kennedy-and-his]], 445–46. [[w.jones-bay-of-pigs]], 116 (the meeting, Burke''s account). To check: Robert Kennedy, memorandum dictated June 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 446 n.2). See [[cal.1961-04-15.cuba]]. Names: Robert Kennedy, Kennedy, Rusk, Burke, McNamara, Dulles, Lemnitzer.'
    src:
