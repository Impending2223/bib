    c: 'Changsha.{1} Liu Shaoqi receives guests from Africa: Abdoulaye Diallo, secretary-general of the All-African Peoples'' Conference, Camara Bengaly (卡马拉·本加里), member of the Guinean Democratic Party''s politburo, Sow Mamadou (索·玛玛杜), deputy head of the Guinean government''s planning ministry, and Keita Koumandian (凯塔·库曼迪亚), general secretary of Guinea''s teachers'' union.{2} African peoples'' struggle against imperialism and colonialism is advancing; imperialism is isolated in Africa and its agents are few; it still has strength and is slippery, will change its method, and the aim is still profit; full independence will take a long struggle.{3}'
