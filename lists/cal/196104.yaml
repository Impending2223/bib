    time_zone: Europe/Moscow
  - id: cal.1961-04-25.china-leadership-10
    when: Apr. 25
    date: '1961-04-25'
    place: peking
    thread: china-leadership
    c: 'Peking 北京. Chen Yun 陈云 sees the Shanghai Pingtan Troupe 上海评弹团 perform.{1} He receives Wu Zongxi 吴宗锡 and the young storytellers of *Qingchun zhi ge* 《青春之歌》, Shi Wenlei 石文磊 and Zhao Kaisheng 赵开生 among them: a ballad needs flesh as well as bones, and jokes; the audience wants the good to come through; a revolutionary story ends in victory, as history did; Yang Zirong 杨子荣 of *Lin hai xue yuan* 《林海雪原》 really died but the novel lets him live, and the ballad may invent too; a piece takes not three years to revise but ten; a general who wins has lost battles.{2}'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 84–85. Made public: 1997 ([[w.chen-yun-tongzhi-guanyu-1997]], where the nianpu says it is printed). To check: [[w.chen-yun-tongzhi-guanyu-1997]]; [[w.chen-yun-tongzhi-guanyu]] (the 1983 first edition, which may print it earlier). Names: Chen Yun.'
    tags: [polity:prc, name:chen-yun, vis:only:prc@2]
  - id: cal.1961-04-26.laos
    when: Apr. 26
    date: '1961-04-26'
    time: 1961-04-26T20:30Z
    place: washington
    thread: laos
    c: 'Kennedy with Bowles, McNamara, Burke, Rostow and Bundy on Laos, the Cabinet Room: the cables from Vientiane, the Laotian army "on the ropes."{1} The advisers agree a large war there unjustified, even at the loss of Laos; Kennedy refuses to decide against intervention, and presses Macmillan, through Bruce, and the British and French envoys for a cease-fire.{2} Naval forces into the South China Sea and the Gulf of Siam; the forces for Laos under SEATO''s plans alerted.{3}'
    n: '[FRUS 1961–63, XXIV, doc. 62](https://history.state.gov/historicaldocuments/frus1961-63v24/d62) (the meeting, by Bundy''s memorandum). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 241 (the naval forces, the alert); [[w.schlesinger-thousand-days-1965]], 337 (the reports of Pathet Lao attacks, Apr. 26); [[w.poole-joint-chiefs-of-staff]], 128 (McNamara, Nitze, Burke acting chairman; CINCPAC to prepare for moves into South Vietnam and Thailand for air strikes). Names: Kennedy, Bowles, McNamara, Burke, Rostow, Bundy, Macmillan, Bruce. Check: Kaplan''s note for the naval forces cites Harriman''s cable of May 1 ([FRUS 1961–63, XXIV, doc. 74](https://history.state.gov/historicaldocuments/frus1961-63v24/d74)), which does not name them.'
