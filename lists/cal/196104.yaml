    also: [laos]
    c: 'Hangzhou, the Hangzhou Hotel, evening.{1} Mao receives Souvanna Phouma and Prince Souphanouvong, brought by Zhou Enlai that afternoon;{2} Chen Yi and Wu Xiuquan present.{3} Souvanna will answer the call of the Geneva co-chairmen, Gromyko and Home, for a cease-fire with a statement and talks with Vientiane on its means. Mao: the statement good, the Savannakhet group invited to Khang Khay; they want peace now only because of nine months'' fighting; keep alert.{4}'
    n: '"[Transcript of Talks during Chairman Mao''s reception of Prince Souvanna Phouma and Prince Souphanouvong](https://digitalarchive.umd.edu/document/120883)" (Apr. 24, 1961), PRC FMA 204-01438-01, 24–29, obtained by Yiming Feng, trans. Marian Rosenberg, Wilson Center Digital Archive (secret, not reviewed; the Hangzhou Hotel, with Zhou and Chen Yi speaking; the record gives no hour and does not say when Zhou brought the princes, A and B; Souvanna says they asked Zhou to arrange the visit. Souvanna says he and his brother will give statements after the co-chairs'' appeal and watch Vientiane''s answer; Mao calls the statement very good, says the enemy wants peace only because of the nine months'' offensive and will break agreements, and advises keeping guard, moving the capital to the Plain of Jars and weighing the elections). [[w.zedong-mao-zedong-nianpu]], IV, Apr. 24, 1961. [[w.zhou-enlai-nianpu-1949]], II, 407, Apr. 24, 1961 (Zhou takes the two princes to Hangzhou (the reception by Mao itself is not named)). [[w.zhou-enlai-waijiao-huodong]], 310 (Apr. 24, 1961; 晚10时, 杭州; 陪同毛泽东主席会见); [[w.macfarquhar-origins-of-the-cultural]], III, 123 (Souvanna Phouma''s visit: the road to Yunnan); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 192 (Apr. 22–25, 1961; Souvanna Phouma, Prime Minister, and Prince Souphanouvong, chairman of the Neo Lao Hak Xat, visit; Mao receives them (at Hangzhou, as the entry has it)); [[w.chen-yi-nianpu]], 869 (Apr. 24, 1961, evening; Chen Yi present when Mao receives Souvanna Phouma and Souphanouvong at Hangzhou); [[w.guan-vietnamese-communists-relations-with]], 190. Made public: 1993. To check: [[w.survey-of-china-mainland]], No. 2486, 24–26 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 123 n.24a); [[w.cheng-jianguo-yilai-jun-shi]], 189 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 123 n.24b). Names: Mao Zedong, Souvanna Phouma, Souphanouvong, Zhou Enlai, Chen Yi, Wu Xiuquan, Gromyko, Home.'
