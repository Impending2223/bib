    thread: china-leadership
    c: 'Liu Shaoqi arrives in Hunan for forty-four days'' investigation, "guerrilla style": two jeeps, Wang Guangmei as secretary, a few provincial cadres, bowl and chopsticks;{1} Hunan''s first secretary Zhang Pinghua kept out.{2} He goes first to Ningxiang, his native county, and five days with Wangjiawan team.{3}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 50; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 510 (Apr. 1–8, 1961; Liu leaves Guangzhou for Changsha Apr. 1, having told the Central-South Bureau''s and the Hunan committee''s officials that he will go to the peasants'' homes as in the old base areas, with few people, everything simple; Apr. 2 reaches Wangjiawan team, Donghutang commune, Ningxiang, lodging in the old pig farm; hears the work groups Apr. 3 and 4–7; Apr. 8 leaves for Shaoshan); [[w.dikotter-maos-great-famine]], 119 n.16 (Liu sets off from Changsha on Apr. 2 in two jeeps with his wife and a few close assistants, bowl and chopsticks in the light luggage). Made public: 1996. To check: [[w.huainian-liu-shaoqi-tongzhi]], 60, 335 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.78a); [[w.shien-ji-shaoqi-tongzhi-guancha]], 24–26 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.78b); [[w.huainian-liu-shaoqi-tongzhi]], 60 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.79a); [[w.selections-from-china-mainland]], (Supplement), No. 26, 1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.79b); Dongfang Hong Bao (East is red news), Mar. 9, 1967 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.79c); [[w.liu-shaoqi-fan-geming]], 37 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.79d); [[w.aiguo-zhongguo-da-guang-jiao]], 19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.80a); [[w.wei-chinese-staff-system]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.80b); [[w.selections-from-china-mainland]], (Supplement), No. 26, 6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.81a); [[w.huainian-liu-shaoqi-tongzhi]], 68, 335, 342–43 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.81b); [[w.xingdou-liu-shaoqi-he-tade]], 500 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 50 n.81c); Huang Zheng, Liu Shaoqi yisheng (