    when: Apr. 21
    date: '1961-04-21'
    place: washington
    thread: cuba-bay-of-pigs
    follows:
      - cal.1961-04-21.cuba-bay-of-pigs-3
    c: 'The President''s office, later in the day, Schlesinger coming to say goodbye before leaving for Italy. Johnson, sitting by the desk, invites him in. Schlesinger: the most effective way to restore world confidence would be a quick and visible reorganization of the CIA. Johnson agrees; he cannot understand how Dulles and Bissell could be so wrong, Dulles having said in that very office that he was much more confident of the Cuban operation than he had ever been of Guatemala. By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 118. After [[cal.1961-04-21.cuba-bay-of-pigs-3|the breakfast]]: "Later in the day," in Schlesinger''s journal (118). Made public: [[w.schlesinger-journals]] (2007). Names: Johnson, Schlesinger, Dulles, Bissell.'
    tags: [name:johnson-lyndon-b, name:schlesinger-arthur-m-jr, name:dulles-allen-w, name:bissell-richard-m-jr, city:washington]
