  - id: cal.1961-04-14.cuba-bay-of-pigs
    when: Apr. 14
    date: '1961-04-14'
    thread: cuba-bay-of-pigs
    c: 'Puerto Cabezas. The American advisers disclose the invasion plan to the brigade: three beaches along forty miles of shore in the Bay of Pigs area; paratroops inland to hold the roads across the swamps; Castro''s air force neutralized in advance; the beach held three days. Late afternoon, Luis Somoza at the dock: "Bring me a couple of hairs from Castro''s beard." The flotilla of seven small ships sails for Cuba.'
