  - id: cal.1961-04-18.governors-nj
    when: Apr. 18
    date: '1961-04-18'
    thread: governors
    also: [elections-1961]
    c: 'New Jersey primaries for governor. Democratic: Hughes, the county leaders'' choice since Feb. 13, over two others, 222,789 to 41,772, 84.2 percent. Republican: Mitchell, Eisenhower''s Secretary of Labor, in since Jan. 14 with Case''s backing, over Walter H. Jones, State senator, the county organizations'' candidate, 202,188 to 160,553, 43.7 percent; Dumont, State senator, 95,761, 20.7 percent.'
    n: '[*Results of the Primary Election Held April 18, 1961*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1961-primary-election.pdf) (Secretary of State); figures here from [Wikipedia, "1961 New Jersey gubernatorial election"](https://en.wikipedia.org/wiki/1961_New_Jersey_gubernatorial_election) (Hughes 222,789; Mitchell 202,188, Jones 160,553, Dumont 95,761); check against the Results. To check: [[w.salmore-new-jersey-politics-and]]; [[w.peirce-mid-atlantic-states-of]]. Names: Hughes, Eisenhower, Mitchell, Case, Jones, Dumont.'
