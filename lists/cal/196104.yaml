  - id: cal.1961-04-20.economy
    when: Apr. 20
    date: '1961-04-20'
    thread: economy
    c: 'Tax message. An investment credit: 15 percent of new plant and equipment spending above depreciation, 6 percent between half of depreciation and all of it, 10 percent on the first $5,000; about $1.7 billion a year. To pay for it: withholding of 20 percent on dividends and interest from Jan. 1, 1962, about $600 million; the dividend credit and exclusion repealed; income kept abroad and expense accounts taxed.'
    n: 'Special Message to the Congress on Taxation, [1961 Pub. Papers 290](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=348) (Apr. 20, 1961). [[w.zelizer-taxing-america]], 185–88 (the 15 percent credit, withholding, income abroad); [[w.stein-fiscal-revolution-in-america]], 390–91 (the credit, income abroad, withholding). To check: [[w.manley-politics-of-finance]]; "Pending Tax Matters: 1961", National Archives, RG 56, Office of Tax Policy, Box 68, File: Tax Reform 1961-1962 (cited by [[w.zelizer-taxing-america]], 187 n.23).'
