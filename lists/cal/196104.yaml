  - id: cal.1961-04-19.cuba-7
    when: Apr. 19
    date: '1961-04-19'
    thread: cuba-bay-of-pigs
    c: 'Clark, from the Essex, to Dennison. 8:40 a.m.: the brigade still an organized fighting unit, not turning to guerrilla war; nothing landed by sea in the night. 12:06 p.m.: the brigade holds a quarter to half a mile of beach under artillery fire; "Believe evacuation impossible without active engagement with Castro forces." 1:57 p.m.: a Castro B-26 over the beach; "I am initiating air to air combat over beach area." 3:20 p.m.: a destroyer straddled by a shore battery, withdrawn at full speed. 3:45 p.m.: no chance of evacuation seen; the destroyers clear of the beach.'
    n: 'FRUS 1961–63, X, docs. [143](https://history.state.gov/historicaldocuments/frus1961-63v10/d143); [149](https://history.state.gov/historicaldocuments/frus1961-63v10/d149); [152](https://history.state.gov/historicaldocuments/frus1961-63v10/d152); [155](https://history.state.gov/historicaldocuments/frus1961-63v10/d155) and n.1. Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 121 (the destroyers withdrawn). See [[cal.1961-04-18.cuba-4]]. Names: Dennison, Castro.'
