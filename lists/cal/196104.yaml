    c: 'D plus two.{1} A White House meeting on Cuba: Lemnitzer, Burke, Rusk, Bundy, Bissell, Dulles.{2} By Robert Kennedy''s memorandum of June 1, "everybody really seemed to fall apart"; he urges them to plan for the next six months or a year. About three, troops into Cuba discussed, Bohlen for, Rusk against, and a blockade; "it ended up in not doing a great deal."{3} By Bowles''s account, the consensus "to get tough with Castro."{4}'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 471–72; [[w.thomas-robert-kennedy]], 122 (Robert Kennedy pacing the Cabinet Room: "We''ve got to do something"; the President "regarded as a paper tiger by the Russians"). [[w.jones-bay-of-pigs]], 120–21 (Lemnitzer and Bissell on the guerrilla course). To check: Robert Kennedy, memorandum dictated June 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 472 n.13); Chester Bowles, oral history interview by R. R. R. Brooks, Feb. 2, 1965, 33, JFK Library (cited by [[w.schlesinger-robert-kennedy-and-his]], 472 n.14, for the consensus). Check: Bowles''s account may be of the Cabinet meeting of Apr. 20, which his notes describe ([FRUS 1961–63, X, doc. 158](https://history.state.gov/historicaldocuments/frus1961-63v10/d158)). See [[cal.1961-04-15.cuba]]. Names: Lemnitzer, Burke, Rusk, Bundy, Bissell, Dulles, Robert Kennedy, Bohlen, Bowles.'
