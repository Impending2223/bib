  - id: cal.1961-04-19.cuba-3
    when: Apr. 19
    date: '1961-04-19'
    place: opa-locka
    thread: cuba-bay-of-pigs
    c: 'Berle and Schlesinger fly to the Opa-Locka airbase, Fla., where the Revolutionary Council is held under guard;{1} Varona and Ray indict the CIA.{2} Told the beachhead is lost, they fly the Council to Washington.{3} Kennedy receives its members at the White House till six: no intervention;{4} "you are all free men."{5}'
    n: '[[w.schlesinger-thousand-days-1965]], 279–85, from his notes; [[w.sen-church-alleged-assassination-plots]], 124 (a CIA memorandum for the record of Apr. 24, 1961: on Apr. 19–20 the President and other officials, McNamara and Lemnitzer among them, met a translator and several members of Cuban groups of the Bay of Pigs, one of them a party to the passage of poison pills to Cuba in March or April; the atmosphere one of depression over the failure; not the Council by name, Opa-Locka, Berle and Schlesinger, the hour or the words); [[w.schlesinger-journals]], 113–17 (Apr. 19: Berle and Schlesinger fly south by MATS and reach Opa-locka at 8:15; six Council members in fatigues (Miró Cardona, Ray, Varona, Hevia, Carrillo, Maseo) with Bender of the CIA; Varona''s and Ray''s indictment of the CIA; past 10 Washington says the operation is substantially over; Schlesinger telephones the White House twice and Kennedy wants the Council brought there; in the Cabinet Room late in the afternoon Kennedy expresses regret and explains "why he had decided against American intervention"; the page does not give "till six" or "you are all free men"). [[w.reeves-president-kennedy]], 94, 96–97 (Opa-Locka; the Council flown to Washington and received). [[w.sorensen-kennedy]], 307 (Kennedy receives the Council). Made public: [[w.schlesinger-thousand-days-1965]] (1965). Told the beachhead lost: [[w.schlesinger-thousand-days-1965]], 279–85. See [[cal.1961-04-15.cuba]]. Names: Berle, Schlesinger, Varona, Ray, Kennedy.'
