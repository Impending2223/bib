  - id: cal.1961-04-18.cuba-10
    when: Apr. 18
    date: '1961-04-18'
    time: 1961-04-18T08:00Z
    thread: cuba-bay-of-pigs
    c: 'Shelling from 3 and 4 a.m. at Red Beach and San Blas; the brigade back on Blue Beach. Told evacuation would begin after dark, San Román: "I will not be evacuated." Afternoon: six B-26s from Puerto Cabezas, two flown by American contract pilots, catch a column of tanks and trucks north of Playa Larga: seven tanks and twenty trucks destroyed, by Jones some 1,800 casualties. Castro comes down from Havana.'
    n: '[[w.jones-bay-of-pigs]], 114–15. See [[cal.1961-04-18.cuba-4]]. Names: San Román, Castro.'
