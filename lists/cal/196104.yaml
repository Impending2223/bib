  - id: cal.1961-04-17.cuba-3
    when: Apr. 17
    date: '1961-04-17'
    thread: cuba-bay-of-pigs
    c: 'Before 1 a.m., through the station in Miami, word to Lynch of the D-Day strikes cancelled: "Castro still has operational aircraft. ... Unload all men and supplies and take the ships to sea." The landing at Green Beach dropped, the 3rd Battalion to Blue Beach. 3:15 a.m., Castro told of landings at Girón and Larga; his aircraft to take off at dawn.'
    n: '[[w.jones-bay-of-pigs]], 101–2. See [[cal.1961-04-17.cuba]]. Names: Castro.'
    src:
      c: 271a4316
      rows:
        - 'w.jones-bay-of-pigs 101–2: all'
    tags: [name:castro-fidel]
  - id: cal.1961-04-17.cuba-4
    when: Apr. 17
    date: '1961-04-17'
    thread: cuba-bay-of-pigs
    c: 'Blue Beach after dawn. The *Blagar* downs a Sea Fury; a T-33 downs a brigade B-26 at the Girón strip. Lynch handed: "Castro''s air force 100% destroyed." 7:30 a.m., 172 paratroopers dropped from five C-46s and a C-54 by San Blas, their ammunition missing the drop zone. By 8:25 the vehicles and tanks ashore; Girón and its airfield taken, 130 militia captured.'
    n: '[[w.jones-bay-of-pigs]], 102–4. See [[cal.1961-04-17.cuba]]. Names: San Román.'
    src:
      c: 8c8fefb8
      rows:
        - 'w.jones-bay-of-pigs 102–4: all'
    tags: [name:san-roman-jose-perez]
  - id: cal.1961-04-17.cuba-5
    when: Apr. 17
    date: '1961-04-17'
    thread: cuba-bay-of-pigs
    c: Red Beach. Only 270 of the 2nd Battalion's 399 men get ashore, seven of nine landing craft failing; the 5th Battalion's 180 kept aboard the *Houston* by their commander, Montero Duque. A T-33's rockets hit the *Houston*, which runs aground, up to twenty killed in the water. Three hours later a Sea Fury's rocket sets the *Río Escondido* afire off Girón; she explodes, ten days' ammunition and the communications van lost.
    n: '[[w.jones-bay-of-pigs]], 106–7. See [[cal.1961-04-17.cuba]].'
    src:
      c: ac812668
      rows:
        - 'w.jones-bay-of-pigs 106–7: all'
  - id: cal.1961-04-17.cuba-6
    when: Apr. 17
    date: '1961-04-17'
    thread: cuba-bay-of-pigs
    c: 'The ships ordered out to sea till dark, the Navy''s cover at the twelve-mile limit promised. Crutchfield, for five destroyers: "My heart is with you, but I cannot help you." Mutineers on the *Blagar* subdued; the *Atlántico* and *Caribe* run south, the *Caribe* turned by a destroyer''s shot across her bow. San Blas attacked about 3 p.m.; tanks at Playa Larga by midafternoon; the brigade falls back on Blue Beach.'
    n: '[[w.jones-bay-of-pigs]], 105, 107–9. See [[cal.1961-04-17.cuba]].'
    src:
      c: 98d40b0b
      rows:
        - 'w.jones-bay-of-pigs 105, 107–9: all'
  - id: cal.1961-04-17.cuba-7
    when: Apr. 17
    date: '1961-04-17'
    thread: cuba-bay-of-pigs
    c: 'Night. Four C-54s and two C-46s drop supplies, five drops good at Blue Beach. Six B-26s sent against San Antonio de los Baños, two aborting, the rest lost in cloud; three more at dawn, Apr. 18, the same. The day''s air: four brigade B-26s down to T-33s; two Sea Furies and two B-26s of Castro''s down.'
    n: '[[w.jones-bay-of-pigs]], 109–10. See [[cal.1961-04-17.cuba]]. Names: Castro.'
    src:
      c: '66195394'
      rows:
        - 'w.jones-bay-of-pigs 109–10: all'
    tags: [name:castro-fidel]
