    when: Apr. 17
    date: '1961-04-17'
    place: neijiang
    thread: china-leadership
    c: 'Neijiang 内江. Zhu De 朱德 inspects the second team of the second brigade of the Zhumu People''s Commune 株木人民公社.{1} At a forum with the peasants: thanks for speaking the truth; a good meeting, no blockade of news, much said from the heart, much learned that is true.{2}'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1803. Made public: 2016. Names: Zhu De.'
    tags: [polity:prc, name:zhu-de, vis:only:prc@2]
  - id: cal.1961-04-17.cuba-bay-of-pigs-6
