        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d123: A, C-E'
        - 'w.jones-bay-of-pigs 117: B-D'
        - 'via w.jones-bay-of-pigs 117 n.12a: B-D'
    tags: [name:gray-david-w, name:burke-arleigh-a, name:dennison-robert-l]
  - id: cal.1961-04-18.cuba-7
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    c: 'Dennison, at Norfolk. 4:52 p.m.: six F3H fighters at Key West, their markings painted out, armed with air-to-air missiles, ready for combat over the beach by daylight Apr. 19. 6:06 p.m., to the Chiefs: an amphibious squadron to stand by to evacuate; every American aircraft a Navy type "and will be recognized as such"; "I too have been operating in the dark."'
    n: 'FRUS 1961–63, X, docs. [126](https://history.state.gov/historicaldocuments/frus1961-63v10/d126) (to McElroy); [129](https://history.state.gov/historicaldocuments/frus1961-63v10/d129). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 117. See [[cal.1961-04-18.cuba-4]]. Names: Dennison.'
    src:
      c: 2c9481ce
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d126: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d129: C-E'
        - 'w.jones-bay-of-pigs 117: B, D'
        - 'via w.jones-bay-of-pigs 117 n.14a: B'
        - 'via w.jones-bay-of-pigs 117 n.14b: D'
    tags: [name:dennison-robert-l, name:mcelroy-neil-h]
  - id: cal.1961-04-18.cuba-8
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    c: 'Clark, from the Essex, to Dennison, the brigade''s messages intercepted. 4:42 p.m.: "Blue Beach must have jet air support in next few hours or will be wiped out"; "Red Beach wiped out." 11:52 p.m., San Román: "Do you back us up or quit?"; "Please don''t desert us"; "I will not be evacuated. Will fight to the end if we have to."'
    n: 'FRUS 1961–63, X, docs. [125](https://history.state.gov/historicaldocuments/frus1961-63v10/d125); [135](https://history.state.gov/historicaldocuments/frus1961-63v10/d135). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 117–18. To check: Kirkpatrick, "Inspector General''s Survey of the Cuban Operation," Oct. 1961, 40, in [[w.bay-of-pigs-declassified]] (cited by [[w.jones-bay-of-pigs]], 118 n.18). See [[cal.1961-04-18.cuba-4]]. Names: Dennison, San Román.'
    src:
