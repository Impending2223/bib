  - id: cal.1961-04-26.china-leadership
    when: Apr. 26
    date: '1961-04-26'
    place: peking
    thread: china-leadership
    c: 'Peking. The Secretariat, Deng Xiaoping presiding, hears Mao''s views: the Sixty Articles in part wrongly put; ownership not settled (the draught animals to brigade or team?); the mess halls, once "socialism''s heart," if the masses are unhappy, down "this year or next"; most supply systems untenable; the Twelve Articles not carried out, repayment incomplete; the peasants the losers.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 26, 1961. [[w.deng-xiaoping-nianpu-1904]], III, 1634 (Apr. 26, 1961; 5 p.m.; Deng presides, Zhou attends, and relays Mao on a work conference to revise the draft regulations: the Sixty Articles in part wrongly put; ownership not settled; the mess halls glaring; the supply system mostly untenable; work not deep, no mass line, the peasants losing by the policy, the system unsettled; agriculture to be made firm); [[w.peng-zhen-nianpu-1902]], IV, 124 (Apr. 26, 1961, afternoon; the 251st meeting; Peng Zhen there, Zhou and Chen Yun attending; Deng relays Mao''s instruction on a work conference and revising the Sixty Articles; the conference set for Peking on May 15); [[w.chen-yun-nianpu-xiuding]], III, 85 (afternoon: Chen Yun attends the Secretariat, which relays Mao''s instructions on a work conference and revising the Sixty Articles). Made public: 2013. Names: Deng Xiaoping, Mao Zedong.'
    tags: [polity:prc, name:deng-xiaoping, name:mao-zedong, vis:only:prc]
    time_range:
      - 1961-04-26T04:00Z
      - 1961-04-26T10:00Z
    time_band: afternoon
    time_zone: Asia/Shanghai
  - id: cal.1961-04-26.china-leadership-2
    when: Apr. 26
    date: '1961-04-26'
    thread: china-leadership
    c: 'Mao authorizes the circulation of Hu Qiaomu''s report to him from Sichuan: the mess-halls "an impediment to developing production and a cancer in relations between party and masses."{1} Deng Xiaoping sends it, on Mao''s wish, to the bureaus and committees, with four enclosures, subtitled as Hu''s material on the mess halls.{2} The document is Zhongfa [61] 323, titled "several important documents the Chairman commented on."{3} Hu''s letter of Apr. 14: in three brigades of the former Dongjiao commune at Xiangxiang, 707 dead from October 1958 to March 1961, 13.5 percent of their people, by report; in two brigades nearby, about 20 percent over three years; in the county about 30,000 in three years.{4}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 65–66; [[w.mao-zedong-zhuan]], V, ch. 68 (Apr. 26: Deng Xiaoping, on Mao''s wish, sends Hu Qiaomu''s letter and its four enclosures (on the mess halls of Shaoshan commune, Hunan) to the bureaus and committees as a reference on the mess halls). [[w.yang-jisheng-mubei]], II, 1173 (Zhongfa [61] 323 of Apr. 26 sends the whole country Hu Qiaomu''s letter and four attachments, titled "several important documents the Chairman commented on"; the first formal report to urge dissolving the mess halls); [[w.yang-jisheng-mubei]], I, 304 (Zhongfa [61] 323 of Apr. 26: the document declares that whether a mess hall is kept is for the peasants to say; only after it were the mess halls formally dissolved in Bo county); [[w.yang-jisheng-mubei]], II, 767 n.53 (Apr. 26: the Center''s document Zhongfa [61] 323 sends the whole country Hu Qiaomu''s letter and four attachments as a reference for settling the mess-hall question; the comment does not say whether the halls are to be dissolved nor whether to send the papers down); [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–315 (the Center''s forwarding of Apr. 26, on Mao''s instruction, of Hu Qiaomu''s letter and four enclosures on the mess halls, for reference, the bureaus and committees to decide whether to pass them down, with Mao''s comment of Apr. 15; Hu''s letter of Apr. 14 to Mao, from Shaoshan 韶山: the Shaoshan brigade to meet Apr. 16 on mess halls, hills and woods, houses and quotas; at Xiangxiang 湘乡, three brigades of the former Dongjiao commune 707 dead from October 1958 to March 1961, 13.5 percent of their people, and in two brigades nearby the deaths over three years about 20 percent); [[w.mao-zedong-zhuan]], V, ch. 68. [[w.yang-jisheng-mubei]], II, 1173; [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 301–302. Made public: 1997. Check: Mubei gives the Center''s document of Apr. 26 as Zhongfa [61] 323 in its chronology (II, 1173) and as [61] 1323 in its chapter on Jilin (I, 362). Check: Mubei has Hu Qiaomu heading the Central investigation group at Shaoshan, Hunan (II, 1173; see [[cal.1961-04-19.china-leadership-13]]) and the document of Apr. 26 forwarding "Hu Qiaomu''s Hunan investigation" (I, 362); the entry gives his report as from Sichuan. To check: [[w.dangdai-zhongguode-hunan]], 2, 631 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 65 n.148a); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 467 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 65 n.148b); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 467–70, 489–91 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 65 n.149a); [[w.de-zhu-de-xuanji-selected]], 440 n.318 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 65 n.149b); Hu Qiaomu, report on Shaoshan, 1961, summarized in [[w.zedong-jianguo-yilai-mao-zedong]], 9, 467–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 65 n.149c). Names: Mao Zedong, Hu Qiaomu, Deng Xiaoping.'
