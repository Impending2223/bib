  - id: cal.1961-04-15.cuba
    when: Apr. 15
    date: '1961-04-15'
    thread: cuba-bay-of-pigs
    c: 'The Bay of Pigs. At dawn eight B-26s of the exile force, from Puerto Cabezas, Nicaragua, strike three airfields: Campo Libertad, San Antonio de los Baños, Santiago. Five aircraft destroyed. A B-26 lands at Key West, another at Miami, its pilot a defector by the cover story. The diversionary landing east of Guantanamo aborted.'
    n: 'FRUS 1961–63, X, docs. [102](https://history.state.gov/historicaldocuments/frus1961-63v10/d102), [104](https://history.state.gov/historicaldocuments/frus1961-63v10/d104) (Castro''s communiqué; Miró Cardona''s statement), [93](https://history.state.gov/historicaldocuments/frus1961-63v10/d93) (the cover plan, Apr. 12); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231) (Taylor''s Memorandum No. 1, June 13), pars. 35–36. Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.poole-joint-chiefs-of-staff]], 114 (the strike; five destroyed; the defector at Miami); [[w.fursenko-one-hell-of-a]], 92–93 (the strike; some 60 percent of Castro''s air force destroyed); [[w.jones-bay-of-pigs]], 76–80 (the strike: nine of seventeen B-26s off, eight to Cuba; Key West and Miami; the diversion abandoned; five destroyed, by the photographs of Apr. 16); [[w.bissell-reflections-of-a-cold]], 183 (half-strength, Castro''s air force not destroyed); [[w.rusk-as-i-saw-it-1990]], 211 (the raid from Nicaragua; the landing at Key West); [[w.sorensen-kennedy]], 300 (the first strike; the cover story); [[w.fursenko-khrushchevs-cold-war]], 348 (explosions at Havana, Santiago and San Antonio de los Baños early Apr. 15). The Cuban record: [[w.playa-giron]], the prisoners'' interrogations. [[w.schlesinger-thousand-days-1965]], 270–71; the operation, 233–97. To check: [[w.lynch-decision-for-disaster]] (by a CIA officer ashore); [[w.wyden-bay-of-pigs]]; [[w.rasenberger-brilliant-disaster]]; [[w.thomas-very-best-men]]; [[w.operation-zapata]]; [[w.bay-of-pigs-declassified]]; [[w.gleijeses-ships-in-the-night]]; [[w.higgins-perfect-failure]]; Beerli''s memorandum, Apr. 15, 1961, [FRUS 1961–63, X, doc. 103](https://history.state.gov/historicaldocuments/frus1961-63v10/d103) (cited by [[w.jones-bay-of-pigs]], 79 n.13). See [[cal.1960-03-17.cuba]].'
