  - id: cal.1961-04-11.vietnam-hanoi
    when: Apr. 11
    date: '1961-04-11'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Secretariat, Hanoi: directive no. 17-CT/TW on grain. Farm output in 1960 fell badly; two months to the corn, sweet potato and fifth-month harvests, shortage and hunger in the fifth-month lowlands and where the last crop failed. By the Politburo''s directive the Prime Minister''s directive no. 130-TTg of Apr. 4; the zone, city and province committees to see that "no one at all" in their areas dies of hunger.'
    n: '*Chỉ thị của Ban Bí thư số 17-CT/TW về vấn đề lương thực*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 300–04. Made public: 2002.'
    tags: [polity:drv]
  - id: cal.1961-04-11.soviet-union-leadership
    when: Apr. 11
    date: '1961-04-11'
    place: pitsunda
    thread: soviet-union-leadership
    also: [soviet-union-space]
    c: 'Khrushchev, dictating at Pitsunda the day before Gagarin''s flight: Ustinov has called, the launch is set for 9:07 next morning. He has stopped the plan to bring the cosmonaut, Gagarin, to Pitsunda, and will go himself and persuade Mikoyan; a full welcome at Vnukovo, a short meeting, the Kremlin and a reception, perhaps a demonstration on Red Square. An appeal from the Central Committee and the government to the people, the party and all progressive mankind, to go out when the ship has landed: the first in space, Soviet, and the plea for general disarmament under the strictest control.'
    n: '[[w.khrushchev-dva-tsveta-vremeni]], II, 387–89 (VI, doc. 20). Made public: 2009. Names: Khrushchev, Mikoyan, Ustinov, Gagarin.'
    tags: [name:khrushchev-nikita-s, name:mikoyan-anastas, name:ustinov-dmitriy-f, name:gagarin-yuri, polity:ussr, vis:only:ussr]
