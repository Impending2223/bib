    c: 'Lunch with Reston and Schlesinger. Kennedy: "I probably made a mistake in keeping Allen Dulles on";{1} his brother wasted at Justice, "Bobby should be in CIA";{2} defeat "an incident, not a disaster";{3} no Marines.{4}'
