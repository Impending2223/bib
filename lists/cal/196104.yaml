  - id: cal.1961-04-15.cuba
    when: Apr. 15
    date: '1961-04-15'
    thread: cuba-bay-of-pigs
    c: 'The Bay of Pigs. At dawn eight B-26s of the exile force, from Puerto Cabezas, Nicaragua, strike three airfields: Campo Libertad, San Antonio de los Baños, Santiago. Five aircraft destroyed. A B-26 lands at Key West, another at Miami, its pilot a defector by the cover story. The diversionary landing east of Guantanamo aborted.'
    n: 'FRUS 1961–63, X, docs. [102](https://history.state.gov/historicaldocuments/frus1961-63v10/d102), [104](https://history.state.gov/historicaldocuments/frus1961-63v10/d104) (Castro''s communiqué; Miró Cardona''s statement), [93](https://history.state.gov/historicaldocuments/frus1961-63v10/d93) (the cover plan, Apr. 12); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231) (Taylor''s Memorandum No. 1, June 13), pars. 35–36. Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.lynch-decision-for-disaster]], by a CIA officer ashore; [[w.poole-joint-chiefs-of-staff]], 114 (the strike; five destroyed; the defector at Miami). The Cuban record: [[w.playa-giron]], the prisoners'' interrogations. [[w.schlesinger-thousand-days-1965]], 270–71; the operation, 233–97. To check: [[w.wyden-bay-of-pigs]]; [[w.rasenberger-brilliant-disaster]]; [[w.fursenko-one-hell-of-a]]; [[w.thomas-very-best-men]]; [[w.operation-zapata]]; [[w.bay-of-pigs-declassified]]; [[w.bissell-reflections-of-a-cold]]; [[w.gleijeses-ships-in-the-night]]; [[w.higgins-perfect-failure]]; [[w.jones-bay-of-pigs]]. See [[cal.1960-03-17.cuba]].'
