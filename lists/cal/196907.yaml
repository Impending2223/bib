section: '196907'
entries:
  - id: cal.1969-07-02.china-leadership
    when: July 2
    date: '1969-07-02'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai calls the heads of the Health Ministry''s military control commission and hears of the line and questions for the national health work conference. On cleaning the ranks, citing the AB League of history and the recent digging out of the "Inner Mongolian People''s Revolutionary Party", he stresses guarding against enlargement: but for present counterrevolutionaries, agents and renegades, general political and historical problems need only be explained clearly; many who erred as capitalist-roaders erred in understanding; the cleaning is to be both serious and calm, with no forced confession. On medical research: the nation''s medical workers are a great force to be roused to catch up with the world''s best; a good doctor is most studious, modest, objective and calm; giving up treatment and research on a common disease is against Mao Zedong Thought, and the nation is to be called on to have someone study the cure for tumors.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 300–301 (July 2, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-02.china-leadership-2
    when: July 2
    date: '1969-07-02'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the briefing "On certain policy limits in the Foreign Ministry''s deep digging of ''May 16''", writes: the Foreign Ministry''s great-alliance committee, military representatives and Party committee are to be told to guard against enlarging the "May 16" case and to forbid forced confession, to investigate, to value witnesses, material evidence and corroboration and not trust confessions lightly; so great a revolution cannot be without bad people and counterrevolutionaries sowing discord, vigilance is needed but also care not to fall into their schemes.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 301 (July 2, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-03.soviet-union-leadership
    when: July 3–5
    date: '1969-07-03'
    thread: soviet-union-leadership
    also: [middle-east]
    c: Moscow. Atassi and the Syrian party-state delegation. Brezhnev meets them with Podgorny and Kosygin at Vnukovo, July 3, 5 p.m.; negotiates, July 4, 11 to 3, and July 5, 10 to 2, at the head of the Soviet government delegation in the Kremlin; a lunch July 5, 3 to 5; sees them off at 5.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 348 (July 3–5). Names: Brezhnev, Podgorny, Kosygin, Atassi.'
    tags: [name:brezhnev-leonid, name:podgorny-nikolai-v, name:kosygin-aleksei, name:atassi-noureddine-el, polity:ussr, polity:syria]
  - id: cal.1969-07-03.china-leadership
    when: July 3
    date: '1969-07-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hangzhou, afternoon: approves in principle Zhou Enlai''s plan to cut the Party and State central organs: the Cultural Revolution Group kept, with the General Office, Organization and Liaison Departments; the Propaganda and Investigation Departments and the Control Commission dropped, merged or sent down; the State Council''s working group of Zhou, Xie Fuzhi, Li Xiannian, Ji Dengkui, Li Desheng, Li Fuchun, Yu Qiuli, Su Yu and Su Jing, with Zhou head and Li Xiannian and Ji deputies; 62 ministries to 21.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 3, 1969; [[w.zhou-enlai-nianpu-1949-2020]], III, 301 (July 3, 1969; Zhou''s report and Mao''s note). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Xie Fuzhi, Li Xiannian, Li Fuchun, Ji Dengkui, Li Desheng, Yu Qiuli, Su Yu, Su Jing.'
    src:
      c: 8369ed5e
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, July 3, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 301: A, B, C, D'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:xie-fuzhi, name:li-xiannian, name:li-fuchun, vis:only:prc]
  - id: cal.1969-07-03.china-leadership-2
    when: July 3
    date: '1969-07-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai again reports to Mao on the arrangement for Ji Dengkui and Li Desheng: their division of work is settled at the Center''s meetings; beside collective meetings and temporary tasks Ji is to manage Party rectification and building and the workers'', youth and women''s movements, Li the Military Commission Office Group''s general political work; both join the State Council''s business group and keep their posts in the provinces and army. The Politburo''s daily working meeting is, the nianpu notes, thirteen: Zhou, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Ye Qun, Xie Fuzhi, Li Zuopeng, Qiu Huizuo, Li Desheng and Ji Dengkui.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 301 (July 3, 1969). Made public: 2020. See [[cal.1969-06-25.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Ye Qun, Xie Fuzhi, Li Zuopeng, Qiu Huizuo.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:chen-boda, name:kang-sheng, name:jiang-qing, name:yao-wenyuan, name:huang-yongsheng, name:wu-faxian, name:ye-qun, name:xie-fuzhi, name:li-zuopeng, name:qiu-huizuo, vis:only:prc]
  - id: cal.1969-07-04.china-leadership
    when: July 4
    date: '1969-07-04'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai speaks to the members of the Tibet Military Region''s study class in Peking: the PLA in Tibet has merit in history and in the Cultural Revolution, but they must stand the test; the Cultural Revolution cannot but be affected by objective conditions, they are decades-old soldiers with their own judgment; the army allows no factions, it must stand above them with proletarian Party spirit; the PLA and the Tibetan people are inseparable, and whatever the hardship the PLA must set the example.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 302 (July 4, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-04.china-leadership-2
    when: July 4
    date: '1969-07-04'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai calls the heads of the coal, railway and water and power departments to a meeting.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 302 (July 4, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-07.soviet-union-leadership
    when: July 7–8
    date: '1969-07-07'
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    c: Moscow. Stoph and the East German party-government delegation. Brezhnev goes to Vnukovo for them, July 7, after 1 p.m.; negotiates with them in the Kremlin, 4 to 6; July 8, 10 to 1; dinner at the reception house, 7 to 8.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 349 (July 7–8). Names: Brezhnev, Stoph.'
    tags: [name:brezhnev-leonid, name:stoph-willi, polity:ussr, polity:gdr]
  - id: cal.1969-07-07.china-leadership
    when: July 7
    date: '1969-07-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the Shanxi revolutionary committee core group''s notice to the Cultural Revolution Group on reopening the south Datong-Puzhou railway, writes Chen Boda, Xie Fuzhi and Ji Dengkui: the text only once says that if such incidents go on they will be traced severely and the ringleaders punished by law, but how to forbid, how to punish is not said, and troublemakers can ignore it; they might be asked for a further notice strictly forbidding each item, those who break it to be arrested by force and punished by law. On July 8 the core group replies that it has revised the notice as he said.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 302 (July 7, 1969). Made public: 2020. Names: Zhou Enlai, Chen Boda, Xie Fuzhi.'
    tags: [polity:prc, name:zhou-enlai, name:chen-boda, name:xie-fuzhi, vis:only:prc]
  - id: cal.1969-07-07.china-leadership-2
    when: July 7
    date: '1969-07-07'
    thread: china-leadership
    also: [vietnam-hanoi]
    c: Zhou Enlai meets Trường Chinh, chairman of the Standing Committee of the DRV's National Assembly.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 302 (July 7, 1969). Made public: 2020. Names: Zhou Enlai, Trường Chinh.'
    tags: [polity:prc, polity:drv, name:zhou-enlai, name:truong-chinh, vis:only:prc+drv]
  - id: cal.1969-07-08.china-leadership
    when: July 8
    date: '1969-07-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao at Hangzhou hears Zhejiang''s committee and district chiefs Nan Ping and Chen Liyun: Nan Ping tells him Nanjing''s Party meeting does not let democracy speak and he left; Mao sends him back, take care, and yield to the majority if unconvinced. On Chen''s merging of communes and production teams: careful, rich with rich and poor with poor, not rich with poor; the team stays the base.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 8, 1969. Made public: 2013. Names: Mao Zedong, Nan Ping, Chen Liyun.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-07-08.china-leadership-2
    when: July 8
    date: '1969-07-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the Shanghai revolutionary committee''s report on its summer patriotic public health campaign, writes: it is to be publicized in the papers, and similar summer mass campaigns to wipe out pests and disease launched in Peking, Tianjin, Shenyang, Harbin, Shijiazhuang, Qingdao, Nanjing, Hangzhou, Wuhan, Guangzhou, Chongqing, Chengdu, Lanzhou and Xi''an; towns and villages everywhere are to hold one or two each early spring and midsummer as a standing rule, not again abolished. He will tell the national health conference, which has this item. The Center forwards the report on his note.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 303 (July 8, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-12.china-leadership
    when: July 12
    date: '1969-07-12'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai, on a paper on international questions, writes: documents of this kind are to go to the four old comrades studying international questions, Ye Jianying, Chen Yi, Xu Xiangqian and Nie Rongzhen.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 303 (July 12, 1969). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Chen Yi, Xu Xiangqian, Nie Rongzhen.'
    tags: [polity:prc, name:zhou-enlai, name:ye-jianying, name:chen-yi, name:xu-xiangqian, name:nie-rongzhen, vis:only:prc]
  - id: cal.1969-07-13.china-leadership
    when: July 13
    date: '1969-07-13'
    thread: china-leadership
    also: [south-asia, soviet-union]
    c: 'Mao, 1 p.m.: approves Zhou Enlai''s speech for that night''s banquet for General Nur Khan, member of Pakistan''s presidential executive committee, which attacks the Soviet "Asian collective security" scheme as a step to a new anti-China military pact of social-imperialism.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 13, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Nur Khan.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-13.china-leadership-2
    when: July 13–16
    date: '1969-07-13'
    thread: china-leadership
    also: [south-asia, china]
    c: Zhou Enlai holds talks with Pakistan's government friendship delegation, invited to China, under Nur Khan, member of the President's executive council; Nur Khan hands over President Yahya Khan's reply to Zhou. Zhou says the two countries strictly observe the five principles of mutual respect for sovereignty and territorial integrity, mutual non-aggression, non-interference in internal affairs, equality and mutual benefit, and peaceful coexistence.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 303 (July 13, 1969). Made public: 2020. See [[cal.1969-07-13.china-leadership]]. Names: Zhou Enlai.'
    tags: [polity:prc, polity:pakistan, name:zhou-enlai, vis:only:prc+pakistan]
  - id: cal.1969-07-14.soviet-union-leadership
    when: July 14
    date: '1969-07-14'
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    c: Moscow. Brezhnev, with the members of the party-government delegation, negotiates with the East German delegation led by Stoph in the Kremlin, 10 to 12; sees them off at Vnukovo, 4 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 350 (July 14). Names: Brezhnev, Stoph.'
    tags: [name:brezhnev-leonid, name:stoph-willi, polity:ussr, polity:gdr]
  - id: cal.1969-07-17.china-leadership
    when: July 17
    date: '1969-07-17'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, receiving people of the Seventh Ministry, gives a stern warning of the two factions'' long factionalism, which badly hurts the cutting-edge work: if it goes on, in the end discipline will be applied and both organizations declared dissolved. Petty-bourgeois anarchism must be struck hard, and so must bourgeois factionalism; these two are the ministry''s fatal wounds. On the "651" test project he is to give a death order: everyone on it goes to the line and has it done in a week: "don''t you want revolution? this is revolution"; Qian Xuesen is to lead, the Party Center gives him a death order; those who do not are dismissed from public posts and Party members expelled from the Party; it is not that they cannot but that they will not; those breaking discipline are to be dealt with as breaking Party, state and army law, from warning and docked pay to dismissal.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 303–304 (July 17, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-18.china-leadership
    when: July 18
    date: '1969-07-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the two Seventh Ministry factions'' seizing each other''s materials: it is banditry, lawless anarchism; he decides that Garrison troops go to bring both factions'' heads together and recover the seized material.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 18, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-18.china-leadership-2
    when: July 18
    date: '1969-07-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: A strong earthquake strikes the Bohai Gulf at noon and does damage on the coasts of Liaoning, Hebei and Shandong, the worst in Shandong. At 6 p.m. Zhou Enlai calls an emergency meeting with heads of the Academy of Sciences, the Ministry of Geology and others on watching for earthquakes and relief, and decides to form an earthquake work group with Li Siguang leader and Liu Xiyao deputy, send observation groups to Shandong, Liaoning and elsewhere to strengthen observation and forecasting, and send an air observation group to see the damage and its changes.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 18, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-18.china-leadership-3
    when: July 18
    date: '1969-07-18'
    thread: china-leadership
    also: [vietnam-hanoi]
    c: 'Zhou Enlai receives at short notice, at their request, Vietnam''s Vice Minister of Foreign Trade, Lý Ban, and Ambassador Ngô Minh Loan. Lý says President Hồ much hopes to come to China. Zhou: China is ready at any time to receive and welcome Hồ for convalescence, but given Hồ''s heart trouble it cannot invite him casually; it is for the doctors to judge and the Vietnam Workers'' Party Central Committee to decide.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 18, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, polity:drv, name:zhou-enlai, vis:only:prc+drv]
  - id: cal.1969-07-18.china-leadership-4
    when: July 18
    date: '1969-07-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai passes to the Politburo''s members in Peking the report of July 17 by the Peking Hospital''s revolutionary committee and PLA propaganda team on Fan Wenlan''s illness: Fan, in hospital with pneumonia and due to rest, left early to work and "caused a new serious cerebral arteriosclerosis"; saved, but not out of danger and "still being watched and rescued". Fan dies July 29.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 18, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-21.soviet-union-leadership
    when: July 21–23
    date: '1969-07-21'
    thread: soviet-union-leadership
    c: Warsaw. Brezhnev and Podgorny fly out July 21, 9 a.m., for the twenty-fifth anniversary of People's Poland; leave Warsaw July 23, 3:25 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 352 (July 21–23). Names: Brezhnev, Podgorny.'
    tags: [name:brezhnev-leonid, name:podgorny-nikolai-v, polity:ussr, polity:poland]
  - id: cal.1969-07-21.china-leadership
    when: July 21
    date: '1969-07-21'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: the Military Commission Office Group proposes a leading group of 15 for the PLA daily, with Xiao Li to head. Mao: "Xiao Li has been sent down, she should not hold the post".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 21, 1969. Made public: 2013. Names: Mao Zedong, Xiao Li.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-07-22.china-leadership
    when: July 22, 23
    date: '1969-07-22'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai presides over the Politburo's meeting on Shanxi, which passes the paper settling Shanxi's problem; afterward he reports the Politburo's view to Mao and Lin Biao.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 304 (July 22, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-07-23.china-leadership
    when: July 23
    date: '1969-07-23'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves the Center''s notice of July 23 on Shanxi (the "July 23" Notice) at the request of Shanxi''s revolutionary committee: all organizations to obey the Center''s earlier bans on beating, smashing and looting; those who take ground by arms or hold out, the Army to surround, press politically, disarm; no assaults on army arms; runaways pursued.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 23, 1969; [[w.zhou-enlai-nianpu-1949-2020]], III, 304–305 (July 22–23, 1969; the Shanxi notice as issued). Names: Mao Zedong.'
    src:
      c: ad4fa375
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, July 23, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 304–305: A, B, C, D'
    tags: [polity:prc, name:mao-zedong]
  - id: cal.1969-07.vietnam-hanoi
    when: July
    date: 1969-07
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'COSVN''s ninth conference, early in July, under the Politburo''s resolution: more than a year of the general offensive and uprising, a new situation. The enemy''s strategy and the tasks ahead; military attack and the building of the armed forces; mass work, the political struggle in town and country, troop proselytizing; the revolutionary government strengthened, security against the enemy''s espionage.'
    n: '*Nghị quyết Hội nghị trung ương cục lần thứ chín, tháng 7 năm 1969* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered; a passage perhaps lost, by the editors'' note, which they place at p. 365). Made public: 2004. See [[cal.1968-10.vietnam-hanoi]]. Check: the conference''s month: "early July 1969" by the resolution, August by COSVN''s resolution of Oct. 5; it extends to June 1970 the recruiting drive of the "Hồ Chí Minh class" just past.'
    tags: [polity:drv, polity:us, vis:only:drv]
  - id: cal.1969-07.china-leadership
    when: July, early
    date: 1969-07
    at: before 1969-07-01
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai drafts the "Several provisions (draft) on the Mao Zedong Thought study classes run by the Center": the classes, run on Mao''s instruction, have done much, but they lack a summing-up of experience, some have no clear line and do not tie theory and principle to local practice, they are dragged on too long and lose the purpose of Center-run classes, above all the classes'' leading group has not seriously taken hold. For now Zhou is in charge of the Xuzhou-Haizhou, Xinjiang and Sichuan classes; the leading group has Chen Boda first deputy leader and Huang Yongsheng executive deputy. The paper goes out July 4 as a Center document.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 302 (July 1969). Made public: 2020. Names: Zhou Enlai, Chen Boda, Huang Yongsheng, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:chen-boda, name:huang-yongsheng, name:mao-zedong, vis:only:prc]
  - id: cal.1969-07-23.china-leadership-2
    when: July 23
    date: '1969-07-23'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai sees Han Xianchu, Yang Dezhi and others in turn.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 305 (July 23, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-25.china-leadership
    when: July 25
    date: '1969-07-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai receives the "two teams and one committee", the workers' and PLA propaganda teams and the military control commission, of the Seventh Ministry and the cadres and mass delegates of its systems, and reads the Center's July 23 notice on Shanxi. He lists the ministry's two factions' long extreme anarchism and extreme democracy and calls on them to wipe out bourgeois factionalism as the notice requires. With the American moon landing a success and other countries' science and technology leaping forward, they need the spirit of internationalism and patriotism, to grasp revolution, promote production, work and war preparation, to steady order and uphold the country's honor.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 305 (July 25, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-26.china-leadership
    when: July 26
    date: '1969-07-26'
    thread: china-leadership
    also: [china]
    c: Zhou Enlai receives a letter from Sihanouk forwarding the letter of June 17 from Mansfield, the Senate's Democratic leader, asking to come to China to see Zhou and make contact on Sino-American relations. The nianpu adds that afterward President Nixon, on visits to some Asian and European countries, said repeatedly that the United States does not agree to the Soviet proposal of a system of "Asian collective security", will not join any action to isolate China, and is willing to talk with China.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 26, 1969). Made public: 2020. The nianpu''s note puts the proposal''s origin at Brezhnev''s June 1969 speech at the Moscow meeting. Names: Zhou Enlai, Mike Mansfield, Richard Nixon.'
    tags: [polity:prc, name:zhou-enlai, name:mansfield-mike, name:nixon-richard-m, vis:only:prc]
  - id: cal.1969-07-26.china-leadership-2
    when: July 26
    date: '1969-07-26'
    thread: china-leadership
    also: [soviet-union, china]
    c: Soviet First Deputy Foreign Minister Kuznetsov summons China's chargé in the Soviet Union and hands him the Soviet Council of Ministers' internal statement to China's State Council, asking for high-level Sino-Soviet talks.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 26, 1969). Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1969-07-26.china-leadership-3
    when: July 26–28
    date: '1969-07-26'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai convenes a flood-control conference with the Peking Military Region, the Hebei revolutionary committee, the provincial military district and the 38th Army, and hands down the flood-fighting tasks fixed by the Center.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 26, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-28.china-leadership
    when: July 28
    date: '1969-07-28'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai reads the Peking Military Region''s "Request on drawing troops for flood fighting" and the Hebei revolutionary committee''s notice and reports to Mao and Lin Biao: this year''s floods are heavier than usual; the Jingjiang dyke was breached opposite Jiayu through armed fights and neglect of its protection, with no small loss; the flood season has come in North China while the Baoding area''s armed fights have not stopped, and after discussion all agree to put the thousand-li dyke of the south branch of the Daqing River under military control.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 28, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-07-30.china-leadership
    when: July 30
    date: '1969-07-30'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai tells all the members of the Xuzhou-Haizhou study class run by the Center that the Xuzhou-Haizhou situation has long lagged; set against the Center''s July 23 notice on Shanxi, its problems are quite grave, chiefly because bourgeois factionalism and armed fights greatly hurt farm and industrial production. The notice applies to the whole country and Xuzhou-Haizhou must carry it out: stop armed fights, hand in arms, grasp revolution by trades and catch up, above all at this urgent time of preparing for war and famine and serving the people, to unite and get production restored fast.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306–307 (July 30, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
