  - id: cal.1969-07.china-leadership
    when: July, early
    date: 1969-07
    at: before 1969-07-01
    thread: china-zhou
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai drafts the "Several provisions (draft) on the Mao Zedong Thought study classes run by the Center": the classes, run on Mao''s instruction, have done much, but they lack a summing-up of experience, some have no clear line and do not tie theory and principle to local practice, they are dragged on too long and lose the purpose of Center-run classes, above all the classes'' leading group has not seriously taken hold. For now Zhou is in charge of the Xuzhou-Haizhou, Xinjiang and Sichuan classes; the leading group has Chen Boda first deputy leader and Huang Yongsheng executive deputy.{1} The paper goes out July 4 as a Center document.{2}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 302 (July 1969). Made public: 2020. To check: Central Committee, "Several provisions on the Mao Zedong Thought study classes run by the Center", July 4, 1969, sent out July 8 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 453 n.1). Names: Zhou Enlai, Chen Boda, Huang Yongsheng, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:chen-boda, name:huang-yongsheng, name:mao-zedong, vis:only:prc]
    variants:
      - unit: '2'
