    c: Moscow. Atassi and the Syrian party-state delegation. Brezhnev meets them with Podgorny and Kosygin at Vnukovo, July 3, 5 p.m.; negotiates, July 4, 11 to 3, and July 5, 10 to 2, at the head of the Soviet government delegation in the Kremlin; a lunch July 5, 3 to 5; sees them off at 5.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 348 (July 3–5). Names: Brezhnev, Podgorny, Kosygin, Atassi.'
    tags: [name:brezhnev-leonid, name:podgorny-nikolai-v, name:kosygin-aleksei, name:atassi-noureddine-el, polity:ussr, polity:syria]
  - id: cal.1969-07-03.china-leadership
    when: July 3
    date: '1969-07-03'
    place: hangzhou
    thread: china-mao-foreign
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hangzhou, afternoon: approves in principle Zhou Enlai''s plan to cut the Party and State central organs: the Cultural Revolution Group kept, with the General Office, Organization and Liaison Departments;{1} the Propaganda and Investigation Departments and the Control Commission dropped, merged or sent down; the State Council''s working group of Zhou, Xie Fuzhi, Li Xiannian, Ji Dengkui, Li Desheng, Li Fuchun, Yu Qiuli, Su Yu and Su Jing, with Zhou head and Li Xiannian and Ji deputies; 62 ministries to 21.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 3, 1969; [[w.zhou-enlai-nianpu-1949-2020]], III, 301 (July 3, 1969; Zhou''s report and Mao''s note); [[w.jianguo-yilai-mao-zedong]], XIX, 451–452 (July 3, 1969; Mao''s "Agreed in principle" on Zhou Enlai''s report of July 3, dated by Mao "July 3, 6 p.m." (xiawu liu shi 下午六时); the report adds that Li Zhen, Yin Guoguang and Liu Xiyao sit in on the working group and that the military control heads of the United Front Department, the NPC, the CPPCC, the Nationalities Commission, the Religious Affairs Bureau and the democratic parties'' offices form one group; the book gives no place); [[w.macfarquhar-maos-last-revolution]], 297 (Mao reaffirms the plan "in principle" July 3). Made public: 2013. Check: [[w.macfarquhar-maos-last-revolution]], 297 n.65, cites the Zhou chronology of 1997 ([[w.zhou-enlai-nianpu-1949]], III, 300) and the Wengao''s first edition (XIII, 51, printed for internal circulation) for May 29 and July 3; the 1997 page answers to the 2020 edition''s late May (III, 294–295), so whether the 1997 chronology prints Mao''s note of July 3; if it does, Made public: 1997. To check: Zhou Enlai, report of July 3, 1969 on the plan to cut the organs of the Central Committee and the State (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 451 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], XIII, 51 (cited by [[w.macfarquhar-maos-last-revolution]], 297 n.65a); [[w.zhou-enlai-nianpu-1949]], III, 300 (cited by [[w.macfarquhar-maos-last-revolution]], 297 n.65b). Names: Mao Zedong, Zhou Enlai, Xie Fuzhi, Li Xiannian, Li Fuchun, Ji Dengkui, Li Desheng, Yu Qiuli, Su Yu, Su Jing.'
    src:
      c: 8369ed5e
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, July 3, 1969: 1, 2'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 301: 1, 2'
        - 'w.jianguo-yilai-mao-zedong XIX, 451–452: 1, 2'
        - 'via w.jianguo-yilai-mao-zedong XIX, 451 n.1: 1, 2'
        - 'w.macfarquhar-maos-last-revolution 297: 1'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:xie-fuzhi, name:li-xiannian, name:li-fuchun, vis:only:prc, name:ji-dengkui, name:li-desheng, name:su-jing, name:su-yu, name:yu-qiuli]
  - id: cal.1969-07-03.china-leadership-2
    when: July 3
    date: '1969-07-03'
    thread: china-zhou
    also: [india-and-china-cultural-revolution, china-army]
    c: 'Zhou Enlai again reports to Mao on the arrangement for Ji Dengkui and Li Desheng: their division of work is settled at the Center''s meetings; beside collective meetings and temporary tasks Ji is to manage Party rectification and building and the workers'', youth and women''s movements, Li the Military Commission Office Group''s general political work; both join the State Council''s business group and keep their posts in the provinces and army. The Politburo''s daily working meeting is, the nianpu notes, thirteen: Zhou, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Ye Qun, Xie Fuzhi, Li Zuopeng, Qiu Huizuo, Li Desheng and Ji Dengkui.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 301 (July 3, 1969). Made public: 2020. See [[cal.1969-06-25.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Ye Qun, Xie Fuzhi, Li Zuopeng, Qiu Huizuo, Ji Dengkui, Li Desheng.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:chen-boda, name:kang-sheng, name:jiang-qing, name:yao-wenyuan, name:huang-yongsheng, name:wu-faxian, name:ye-qun, name:xie-fuzhi, name:li-zuopeng, name:qiu-huizuo, vis:only:prc, name:ji-dengkui, name:li-desheng]
