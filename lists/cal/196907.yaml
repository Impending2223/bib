  - id: cal.1969-07-05.china-leadership
    when: July 5
    date: '1969-07-05'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi has a relapse of bronchial pneumonia: fever, cough, rapid breathing, many moist rales in both lungs and a quickened heartbeat. The consulting doctors'' "Condition Report" says that because of his age, long illness in bed, emaciation and poor resistance he is liable to shock, heart failure and diabetic ketoacidosis, so the outlook is poor and he may die at any time. After emergency treatment his condition is for the time stable.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (July 5, 1969). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
