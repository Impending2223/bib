list: cal
section: CXVII
entries:
  - id: cal.1969-07-03.soviet-union-leadership
    when: July 3–5
    date: '1969-07-03'
    thread: soviet-union-leadership
    also: [middle-east]
    c: Moscow. Atassi and the Syrian party-state delegation. Brezhnev meets them with Podgorny and Kosygin at Vnukovo, July 3, 5 p.m.; negotiates, July 4, 11 to 3, and July 5, 10 to 2, at the head of the Soviet government delegation in the Kremlin; a lunch July 5, 3 to 5; sees them off at 5.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 348 (July 3–5). Names: Brezhnev, Podgorny, Kosygin, Atassi.'
    tags: [name:brezhnev-leonid, name:podgorny-nikolai-v, name:kosygin-aleksei, name:atassi-noureddine-el, polity:ussr, polity:syria]
  - id: cal.1969-07-03.china-leadership
    when: July 3
    date: '1969-07-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hangzhou, afternoon: approves in principle Zhou Enlai''s plan to cut the Party and State central organs: the Cultural Revolution Group kept, with the General Office, Organization and Liaison Departments; the Propaganda and Investigation Departments and the Control Commission dropped, merged or sent down; the State Council''s working group of Zhou, Xie Fuzhi, Li Xiannian, Ji Dengkui, Li Desheng, Li Fuchun, Yu Qiuli, Su Yu and Su Jing, with Zhou head and Li Xiannian and Ji deputies; 62 ministries to 21.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 3, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Xie Fuzhi, Li Xiannian, Li Fuchun, Ji Dengkui, Li Desheng, Yu Qiuli, Su Yu, Su Jing.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:xie-fuzhi, name:li-xiannian, name:li-fuchun, vis:only:prc]
  - id: cal.1969-07-07.soviet-union-leadership
    when: July 7–8
    date: '1969-07-07'
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    c: Moscow. Stoph and the East German party-government delegation. Brezhnev goes to Vnukovo for them, July 7, after 1 p.m.; negotiates with them in the Kremlin, 4 to 6; July 8, 10 to 1; dinner at the reception house, 7 to 8.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 349 (July 7–8). Names: Brezhnev, Stoph.'
    tags: [name:brezhnev-leonid, name:stoph-willi, polity:ussr, polity:gdr]
  - id: cal.1969-07-08.china-leadership
    when: July 8
    date: '1969-07-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao at Hangzhou hears Zhejiang''s committee and district chiefs Nan Ping and Chen Liyun: Nan Ping tells him Nanjing''s Party meeting does not let democracy speak and he left; Mao sends him back, take care, and yield to the majority if unconvinced. On Chen''s merging of communes and production teams: careful, rich with rich and poor with poor, not rich with poor; the team stays the base.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 8, 1969. Made public: 2013. Names: Mao Zedong, Nan Ping, Chen Liyun.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-07-13.china-leadership
    when: July 13
    date: '1969-07-13'
    thread: china-leadership
    also: [south-asia, soviet-union]
    c: 'Mao, 1 p.m.: approves Zhou Enlai''s speech for that night''s banquet for General Nur Khan, member of Pakistan''s presidential executive committee, which attacks the Soviet "Asian collective security" scheme as a step to a new anti-China military pact of social-imperialism.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 13, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Nur Khan.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-14.soviet-union-leadership
    when: July 14
    date: '1969-07-14'
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    c: Moscow. Brezhnev, with the members of the party-government delegation, negotiates with the East German delegation led by Stoph in the Kremlin, 10 to 12; sees them off at Vnukovo, 4 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 350 (July 14). Names: Brezhnev, Stoph.'
    tags: [name:brezhnev-leonid, name:stoph-willi, polity:ussr, polity:gdr]
  - id: cal.1969-07-21.soviet-union-leadership
    when: July 21–23
    date: '1969-07-21'
    thread: soviet-union-leadership
    c: Warsaw. Brezhnev and Podgorny fly out July 21, 9 a.m., for the twenty-fifth anniversary of People's Poland; leave Warsaw July 23, 3:25 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 352 (July 21–23). Names: Brezhnev, Podgorny.'
    tags: [name:brezhnev-leonid, name:podgorny-nikolai-v, polity:ussr, polity:poland]
  - id: cal.1969-07-21.china-leadership
    when: July 21
    date: '1969-07-21'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: the Military Commission Office Group proposes a leading group of 15 for the PLA daily, with Xiao Li to head. Mao: "Xiao Li has been sent down, she should not hold the post".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 21, 1969. Made public: 2013. Names: Mao Zedong, Xiao Li.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-07-23.china-leadership
    when: July 23
    date: '1969-07-23'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves the Center''s notice of July 23 on Shanxi (the "July 23" Notice) at the request of Shanxi''s revolutionary committee: all organizations to obey the Center''s earlier bans on beating, smashing and looting; those who take ground by arms or hold out, the Army to surround, press politically, disarm; no assaults on army arms; runaways pursued.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 23, 1969. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong]
  - id: cal.1969-07.vietnam-hanoi
    when: July
    date: 1969-07
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'COSVN''s ninth conference, early in July, under the Politburo''s resolution: more than a year of the general offensive and uprising, a new situation. The enemy''s strategy and the tasks ahead; military attack and the building of the armed forces; mass work, the political struggle in town and country, troop proselytizing; the revolutionary government strengthened, security against the enemy''s espionage.'
    n: '*Nghị quyết Hội nghị trung ương cục lần thứ chín, tháng 7 năm 1969* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered; a passage perhaps lost, by the editors'' note, which they place at p. 365). Made public: 2004. See [[cal.1968-10.vietnam-hanoi]]. Check: the conference''s month: "early July 1969" by the resolution, August by COSVN''s resolution of Oct. 5; it extends to June 1970 the recruiting drive of the "Hồ Chí Minh class" just past.'
    tags: [polity:drv, polity:us, vis:only:drv]
