    tags: [polity:us, name:nixon-richard-m]
  - id: cal.1969-07-26.china-leadership
    when: July 26
    date: '1969-07-26'
    thread: china-zhou-foreign
    also: [china-foreign]
    c: Zhou Enlai receives a letter from Sihanouk forwarding the letter of June 17 from Mansfield, the Senate's Democratic leader, asking to come to China to see Zhou and make contact on Sino-American relations. The nianpu adds that afterward President Nixon, on visits to some Asian and European countries, said repeatedly that the United States does not agree to the Soviet proposal of a system of "Asian collective security", will not join any action to isolate China, and is willing to talk with China.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 306 (July 26, 1969); [[w.jian-zhou-enlai]], 620 ("Five days later," Sihanouk relays to Zhou Mansfield''s letter seeking to visit for a "solution to the twenty-year confrontation"). Made public: 2020. The nianpu''s note puts the proposal''s origin at Brezhnev''s June 1969 speech at the Moscow meeting. To check: [[w.zhou-enlai-nianpu-1949]], III, 312 (cited by [[w.jian-zhou-enlai]], 620 n.18a); [[w.xiong-xianghui-dakai-zhong-mei-guanxi]], 76–77 (cited by [[w.jian-zhou-enlai]], 620 n.18b). Names: Zhou Enlai, Mike Mansfield, Richard Nixon.'
    tags: [polity:prc, name:zhou-enlai, name:mansfield-mike, name:nixon-richard-m, vis:only:prc]
