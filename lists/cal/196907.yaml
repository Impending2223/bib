  - id: cal.1969-07-08.china-leadership
    when: July 8
    date: '1969-07-08'
    place: hangzhou
    thread: china-mao
    also: [india-and-china-cultural-revolution]
    c: 'Mao at Hangzhou hears Zhejiang''s committee and district chiefs Nan Ping and Chen Liyun: Nan Ping tells him Nanjing''s Party meeting does not let democracy speak and he left; Mao sends him back, take care, and yield to the majority if unconvinced. On Chen''s merging of communes and production teams: careful, rich with rich and poor with poor, not rich with poor; the team stays the base.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, July 8, 1969; [[w.mao-zedong-zhuan]], VI, ch. 78 n.13 (July 8 in Zhejiang Mao says to Nan Ping 南萍 and Chen Liyun 陈励耘: the new cadres are to be taught and helped, they are to serve as ''apprentice officials'', having no experience, the old cadres have it; he asks closely about the layout of industry in Zhejiang and the output of the Xin''an River hydroelectric station and speaks of building a railway from Hangzhou to Changxing, n.13; the book does not give Nan Ping''s complaint of Nanjing, or communes and teams, or Hangzhou). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 78). To check: Mao Zedong 毛泽东, talk with Nan Ping 南萍 and Chen Liyun 陈励耘 (record 谈话记录), July 8, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.13). Names: Mao Zedong, Nan Ping, Chen Liyun.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc, name:chen-liyun, name:nan-ping]
  - id: cal.1969-07-08.china-leadership-2
    when: July 8
    date: '1969-07-08'
    thread: china-zhou
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the Shanghai revolutionary committee''s report on its summer patriotic public health campaign, writes: it is to be publicized in the papers, and similar summer mass campaigns to wipe out pests and disease launched in Peking, Tianjin, Shenyang, Harbin, Shijiazhuang, Qingdao, Nanjing, Hangzhou, Wuhan, Guangzhou, Chongqing, Chengdu, Lanzhou and Xi''an; towns and villages everywhere are to hold one or two each early spring and midsummer as a standing rule, not again abolished. He will tell the national health conference, which has this item. The Center forwards the report on his note.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 303 (July 8, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-08.china
    when: July 8
    date: '1969-07-08'
    thread: china
    also: [soviet-union]
    c: 'Foreign Ministry note to the Soviet embassy: strong protest at Soviet border troops and gunboats'' entering, on July 8, the Bacha island and other Chinese land on the Chinese side of the main channel of the Heilong River in Fuyuan county, Heilongjiang, in armed provocation, and at six sorties of Soviet aircraft circling low over the island and the Chinese bank village of Bacha. China asks the Soviet government to stop violating Chinese territory in deeds and not in words, and keeps the right to claim for losses.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 217–218 (July 8, 1969); [[w.khoo-collateral-damage]], 57 (clashes again on July 8). Check: the island''s name, from the Chinese 八岔岛, and the village, 八岔村. To check: [[w.lewis-imagined-enemies]], 53 (cited by [[w.khoo-collateral-damage]], 57 n.88).'
    src:
      c: d55e22aa
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 217–218: all'
        - 'w.khoo-collateral-damage 57: ?'
    tags: [polity:prc, polity:ussr]
