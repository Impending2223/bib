    c: Dayong county 大庸縣, Hunan 湖南, late at night. Ding Zuxiao 丁祖曉, a woman commune member, who with her sister Ding Zuxia 丁祖霞 wrote leaflets against the "loyalty" rites ("the Five Firsts," "like the court of a feudal emperor"), is arrested.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 647. The words: 1969 年 7 月 5 日深夜 (II, 647). To check: Tian Daye 田大業 and Wu Zhaolin 吳兆麟, 〈湘西「特一號」案始末〉, in Han Shangyu 韓尚於, ed., *Wenge xiyuan lu* 《文革洗冤錄》 (Tuanjie chubanshe 團結出版社, 1993), 25–32 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 647 n.31).'
