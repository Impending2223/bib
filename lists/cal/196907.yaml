    c: Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying send Zhou Enlai their second report on the world situation.
    n: '[[w.macfarquhar-maos-last-revolution]], 315; [[w.mao-zedong-zhuan]], VI, ch. 78 (July 11 Chen Yi and the other old marshals put forward their paper ''A preliminary estimate of the war situation'' 《对战争形势的初步估计》; the book does not say it was the second report, nor that it went to Zhou Enlai). [[w.yang-jisheng-tiandi-fanfu]], II, 1102 ("A preliminary estimate of the war situation": the U.S. will not lightly attack China, its strategic weight in the West; the Soviet threat the greatest); [[w.khoo-collateral-damage]], 57, 66–67 (the marshals'' report, July 11, presented to Zhou: the Soviet revisionists have made China their main enemy, a greater threat than the Americans; Xiong Xianghui and Yao Guang assisting); [[w.jian-zhou-enlai]], 620 (printed "June 11," the note dating the report July 11, 1969: the US imperialists, their weight in the West, could not easily attack China and push Asian countries to the front; "the Soviet revisionists see us as the main enemy," yet would face "great difficulty" in a big war; no advice on policy); [[w.friedman-shadow-cold-war]], 177 (the four marshals, Chen Yi among them, report on the possibility of war: a Soviet attack unlikely; dated June in Friedman); [[w.liu-jixian-ye-jianying-nianpu]], II, 983 (July 11, 1969; Ye Jianying 叶剑英 with Chen Yi, Xu Xiangqian and Nie Rongzhen signs the report to Zhou, for Mao, "A preliminary estimate of the war situation" 《对战争形势的初步估计》: the Sino-Soviet contradiction greater than the Sino-American, the Soviet-American greater than the Sino-Soviet; a great war against China not likely soon). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 281, 301–302, 305). To check: the four marshals'' second report, July 11, 1969 (extracts), in [[w.barnouin-chinese-foreign-policy-during]], 139–144 (cited by [[w.macfarquhar-maos-last-revolution]], 316 n.36a); [[w.zhou-enlai-nianpu-1949]], III, 281, 301–302, 305 (cited by [[w.macfarquhar-maos-last-revolution]], 315 n.35a); Zhang Baojun, "Dakai Zhong Mei guanxi damen shimo", in [[w.gongheguo-zhongda-shijian-he]], II, 673–717 (cited by [[w.macfarquhar-maos-last-revolution]], 315 n.35b); [[w.rongzhen-inside-the-red-star]] (cited by [[w.macfarquhar-maos-last-revolution]], 315 n.35c); [[w.lewis-imagined-enemies]], 53 (cited by [[w.khoo-collateral-damage]], 57 n.89); [[w.xiong-xianghui-dakai-zhong-mei-guanxi]] (cited by [[w.khoo-collateral-damage]], 67 n.170a); [[w.jian-all-under-the-heaven]], 166–168, 170–171 (cited by [[w.khoo-collateral-damage]], 67 n.170b); Report by the four marshals to the Central Committee, "A Preliminary Evaluation of the War Situation," July 11, 1969, in [[w.jian-all-under-the-heaven]], 166–168 (cited by [[w.jian-zhou-enlai]], 620 n.17); [[w.barnouin-chinese-foreign-policy-during]], 139–42 (cited by [[w.friedman-shadow-cold-war]], 177 n.138a); [[w.jisen-cultural-revolution-in-the]], 292–301 (cited by [[w.friedman-shadow-cold-war]], 177 n.138b). See [[cal.1969-06-02.china-leadership]]. Names: Chen Yi, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Zhou Enlai.'
