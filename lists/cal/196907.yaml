    thread: china-mao
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves the Center''s notice of July 23 on Shanxi (the "July 23" Notice) at the request of Shanxi''s revolutionary committee: all organizations to obey the Center''s earlier bans on beating, smashing and looting;{1} those who take ground by arms or hold out, the Army to surround, press politically, disarm; no assaults on army arms; runaways pursued.{2}'
