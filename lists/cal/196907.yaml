    thread: laos
    also: [vietnam-hanoi]
    c: Laos. Under cover of American air and artillery, a mixed force from Sam Thong–Long Tieng and Vang Vieng, Vang Pao's men, the right-wing army and 5,000 Thais, 18 battalions and 52 companies of special forces in all, opens Kou Kiet and drives into the center of the Plain of Jars. The rains have flooded the defenders' works; the advance is fast, with villages burned.
