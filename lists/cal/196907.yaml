  - id: cal.1969-07-04.china-leadership
    when: July 4
    date: '1969-07-04'
    place: peking
    thread: china-zhou
    also: [china-army]
    c: 'Zhou Enlai speaks to the members of the Tibet Military Region''s study class in Peking: the PLA in Tibet has merit in history and in the Cultural Revolution, but they must stand the test; the Cultural Revolution cannot but be affected by objective conditions, they are decades-old soldiers with their own judgment; the army allows no factions, it must stand above them with proletarian Party spirit; the PLA and the Tibetan people are inseparable, and whatever the hardship the PLA must set the example.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 302 (July 4, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
