  - id: cal.1969-07-25.china-leadership
    when: July 25
    date: '1969-07-25'
    thread: china-zhou-foreign
    also: [india-and-china-cultural-revolution, china-army, china-propaganda]
    c: Zhou Enlai receives the "two teams and one committee", the workers' and PLA propaganda teams and the military control commission, of the Seventh Ministry and the cadres and mass delegates of its systems, and reads the Center's July 23 notice on Shanxi. He lists the ministry's two factions' long extreme anarchism and extreme democracy and calls on them to wipe out bourgeois factionalism as the notice requires. With the American moon landing a success and other countries' science and technology leaping forward, they need the spirit of internationalism and patriotism, to grasp revolution, promote production, work and war preparation, to steady order and uphold the country's honor.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 305 (July 25, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-07-25.vietnam
    when: July 25
    date: '1969-07-25'
    place: guam
    thread: vietnam
    also: [china]
    c: 'Guam.{1} Nixon: the United States will avoid new commitments to help with internal security in Asia (the "Guam doctrine").{2}'
    n: '[[w.macfarquhar-maos-last-revolution]], 320; [[w.lich-su-khang-chien-chong-my]], VI, 15–16, 29 and n. (the Guam address of July 1969 in three points: the United States to keep its treaty commitments; a nuclear shield against a nuclear power; in other aggression, aid on request, the threatened state to supply the manpower for its own defense; the history names it the Nixon Doctrine and has Laird, Jan. 14, 1970, call Vietnamization its first test). To check: [[w.mann-about-face]], 23–28 (cited by [[w.macfarquhar-maos-last-revolution]], 321 n.62). Names: Nixon.'
    src:
      c: dbdca0d5
      rows:
