  - id: cal.1969-07.vietnam-hanoi
    when: July, early
    date: 1969-07
    at: before 1969-07-01
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'COSVN''s ninth conference, early in July, under the Politburo''s resolution: more than a year of the general offensive and uprising, a new situation.{1} The enemy''s strategy and the tasks ahead; military attack and the building of the armed forces; mass work, the political struggle in town and country, troop proselytizing; the revolutionary government strengthened, security against the enemy''s espionage.{2}'
    n: '*Nghị quyết Hội nghị trung ương cục lần thứ chín, tháng 7 năm 1969* (the appendix). [[w.van-kien-dang-toan]], XXX, 365 (the print''s page, by the editors'' own reference to their note on a passage perhaps lost; the copy''s appendix pages unnumbered, the note at its PDF 183); [[w.lich-su-khang-chien-chong-my]], VI, 128–30 (the conference, July 1969, on the Politburo''s resolution "of April 1969"; its findings, the tasks and the directions, military attack first; and, not in `c`, COSVN''s reorganization of the battlefields there: a Military Region 7 of Subregion 4, Biên Hòa, Bà Rịa, Long Khánh and the Rừng Sác special zone; the inner Saigon districts joined again under Nguyễn Văn Linh, the city committee''s secretary; Võ Văn Kiệt secretary of the Region 9 committee, Lê Đức Anh its commander). Made public: 2004. See [[cal.1968-10.vietnam-hanoi]]. Check: the conference''s month: "early July 1969" by the resolution, August by COSVN''s resolution of Oct. 5; it extends to June 1970 the recruiting drive of the "Hồ Chí Minh class" just past.'
    src:
      c: 1ff95921
      rows:
