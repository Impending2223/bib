  - id: cal.1967-07-02.vietnam-operations
    when: July 2
    date: '1967-07-02'
    thread: vietnam-operations
    c: Buffalo. North of Côn Thiên, near the old marketplace on Route 561, two companies of the 1st Battalion, 9th Marines, caught by North Vietnamese infantry and artillery; the battalion's losses that day 53 killed, 190 wounded, 34 missing (by July 5, 84 dead and 9 missing). The 3d Battalion, 9th Marines, sent in.
    n: '[[w.telfer-u-s-marines-in]], 95–104. To check: [[w.nolan-operation-buffalo]]. See [[cal.1967-09.vietnam]].'
    tags: [place:con-thien, place:dmz]
    short: Buffalo
  - id: cal.1967-07-03.school-aid
    when: July 3
    date: '1967-07-03'
    thread: school-aid
    c: 'Cannon to Cater: the Budget Bureau against a special Hispanic program, Titles I and III enough; but they rest on local initiative, and California and Texas have forbidden bilingual teaching.'
    n: '[[w.graham-uncertain-triumph]], 157. To check: Memorandum, Cannon to Cater, July 3, 1967, EX LE/FA 2, WHCF, LBJ Library (cited by [[w.graham-uncertain-triumph]], 157 n.53). Names: Cater.'
    src:
      c: b9df8b25
      rows:
        - 'w.graham-uncertain-triumph 157: all'
        - 'via w.graham-uncertain-triumph 157 n.53: all'
    tags: [name:cater-s-douglass]
  - id: cal.1967-07-04.middle-east
    when: July 4
    date: '1967-07-04'
    thread: middle-east-six-day-war-aftermath
    also: [soviet-union]
    c: 'The General Assembly''s emergency session on the war. The Yugoslav draft, Israel to withdraw to the lines of June 4, 53–46–20, the United States against; the Latin American draft, withdrawal with an end to belligerency, 57–43–20, the United States for; neither has two-thirds. Resolution 2253 (ES-V), 99–0–20: Israel to rescind its measures altering the status of Jerusalem; the United States abstaining.'
    n: 'G.A. Res. [2253 (ES-V)](https://undocs.org/A/RES/2253(ES-V)) (July 4, 1967). FRUS 1964–68, XIX, doc. [342](https://history.state.gov/historicaldocuments/frus1964-68v19/d342). Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-06-05.middle-east]]; [[cal.1967-06-19.middle-east]].'
    short: the General Assembly's emergency session
  - id: cal.1967-07-05.congo
    when: July 5
    date: '1967-07-05'
    thread: congo
    c: Mutiny of the white mercenaries in the Congolese army. Some 160 of them, most French and Belgian, leading 1,000 to 2,000 Katangese troops, take Kisangani and Bukavu; Tshombe had been flown to Algiers June 30, his aircraft hijacked. Mobutu asks Johnson for help.
    n: 'FRUS 1964–68, XXIII, doc. [504](https://history.state.gov/historicaldocuments/frus1964-68v23/d504). Made public: FRUS 1964–68, XXIII (2013). To check: [[w.kelly-americas-tyrant]]; [[w.devlin-chief-of-station-congo]]. Names: Tshombe, Mobutu, Johnson.'
    tags: [name:tshombe-moise, name:mobutu-joseph-d, name:johnson-lyndon-b]
    short: the mercenaries' mutiny
