  - id: cal.1967-07-07.vietnam
    when: July 7–11
    date: '1967-07-07'
    thread: vietnam-program-5
    also: [defense]
    c: 'McNamara, Katzenbach and Wheeler in Vietnam, to settle the next increase, Program 5. MACV''s briefings: a main-force war, the North''s part in it growing. McNamara holds the increase within a ceiling of 525,000. July 11, with Bunker, to Nguyễn Văn Thiệu and Nguyễn Cao Kỳ, Johnson''s message: the elections must be honest and seen to be.'
    n: '[FRUS 1964–68, V, doc. 233](https://history.state.gov/historicaldocuments/frus1964-68v05/d233); [doc. 236](https://history.state.gov/historicaldocuments/frus1964-68v05/d236). [[w.westmoreland-soldier-reports]], 230 (McNamara in Saigon in July); [[w.mcnamara-in-retrospect]], ch. 10 at n.8 (with Katzenbach and Wheeler; optimistic briefings from Westmoreland and Bunker). Made public: [[w.pentagon-papers]], IV, 515–528 (1971); FRUS 1964–68, V (2002). [[w.mcnamara-in-retrospect]], 283; [[w.gibbons-u-s-government-and]], IV, 725–29 (the mission; the briefings; the 525,000; not the message of July 11); [[w.cosmas-joint-chiefs-of-staff]], 62–63 (the mission; the 525,000); [[w.herring-lbj-and-vietnam]], 115 (McNamara and Katzenbach in Vietnam in July); [[w.berman-lyndon-johnsons-war]], 54–55 (the arrival in the morning at Tan Son Nhut; ten hours in the "High Noon Conference Room"; two days of briefings, then the field and the Delta; Westmoreland: "The war is not a stalemate. We are winning slowly but steadily"); [[w.macv-command-history-1967]], 147–48 (July 11, Westmoreland''s deputy gives McNamara, on his ninth visit, and Wheeler five force packages, without the reserves or longer tours; the fifth approved, 19 of the 21 battalions asked; the ceiling of 525,000); [[w.drea-mcnamara-clifford-and-the-2011]], 140 (arrival at Tân Sơn Nhứt July 7, five days, Program 5). See [[cal.1967-05-19.vietnam]]. Names: McNamara, Katzenbach, Wheeler, Bunker, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Johnson.'
