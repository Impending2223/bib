  - id: cal.1967-07-01.robert-kennedy
    when: July 1
    date: '1967-07-01'
    thread: robert-kennedy
    c: 'The Grand Canyon. Robert Kennedy leads a seven-mile climb out, 110 degrees at noon; some fly out with the younger children by helicopter. On the way he recites the St. Crispin''s Day speech: "We few, we happy few, we band of brothers."'
    n: '[[w.thomas-robert-kennedy]], 17–18. To check: *New York Times*, July 1–2, 1967 (cited by [[w.thomas-robert-kennedy]], 396). See [[cal.1967-06.robert-kennedy]]. Names: Robert Kennedy. Check: Guthman, on the trip: only children under ten on the helicopter, the trip "hard" but "not brutal" (396).'
    src:
      c: 83bec93e
      rows:
        - 'w.thomas-robert-kennedy 17–18: all'
        - 'via w.thomas-robert-kennedy 17 n.grand-canyon-rafting-trip: all'
    tags: [name:kennedy-robert-f, state:az]
