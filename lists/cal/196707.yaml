        - 'via w.mann-grand-delusion 547 n.18: all'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1967-07-01.elections-1968
    when: July 1
    date: '1967-07-01'
    thread: elections-1968
    c: 'Agnew, to the *Washington Post*: "sort of out on the end of the ice floe" in promoting Rockefeller, who has sent Slote to Annapolis to dissuade him; he will not back off.'
    n: '[[w.smith-on-his-own-terms]], 498. To check: *Washington Post*, July 1, 1967; Les Slote, interview by Richard Norton Smith (cited by [[w.smith-on-his-own-terms]], 498). Check: the day of Slote''s visit. See [[cal.1967-05-01.elections-1968]]. Names: Agnew, Rockefeller.'
