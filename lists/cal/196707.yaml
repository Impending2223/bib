    n: 'William Bundy to Rusk, July 18: [FRUS 1964–68, V, doc. 248](https://history.state.gov/historicaldocuments/frus1964-68v05/d248) ("however it happened, must have been a blow"). [[w.vietnam-victory-in-vietnam]], 211; [[w.nguyen-hanois-war]], 87–88, 97–98. Check: MACV''s History, 45, has Hanoi broadcast July 8 that Thanh died of a heart attack in a Hanoi hospital July 6; a North Vietnamese soldier''s notebook taken in August, killed in action July 6; another report, wounded in a July air strike on the Iron Triangle. See [[cal.1964-09.vietnam]]. Names: Nguyễn Chí Thanh.'
