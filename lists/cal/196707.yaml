  - id: cal.1967-07-06.conservation-or
    when: July 6
    date: '1967-07-06'
    thread: conservation
    c: 'Oregon. McCall signs the Beach Bill (H.B. 1601): the wet sand to sixteen feet above low tide the State''s; a public easement over the dry sand to the line of vegetation. Brought on by a Cannon Beach, Or., motel owner''s fencing of the dry sand, 1966.'
    n: 'Check: Or. Laws 1967. [Wikipedia, "Oregon Beach Bill"](https://en.wikipedia.org/wiki/Oregon_Beach_Bill). To check: [[w.walth-fire-at-edens-gate]]; [[w.peirce-pacific-states-of-america]]. Names: McCall.'
    tags: [state:or, name:mccall-tom]
