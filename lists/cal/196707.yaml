  - id: cal.1967-07-01.state-and-city-finance-mi
    when: July 1
    date: '1967-07-01'
    thread: state-and-city-finance
    c: 'Michigan. The legislature passes Romney''s fiscal program, the State''s first income tax: 2.6 percent on individuals, an exemption of $1,200 a dependent, from Oct. 1; 5.6 percent on corporations and 7 on financial institutions, from Jan. 1, 1968; the business activities tax repealed; relief from property and city income taxes. House 62–44, June 30; Senate 22–15, July 1, refusing it immediate effect. Act 281; Romney signs (Check the day).'
    n: '*Pontiac Press*, [July 1, 1967](https://our.oakland.edu/bitstreams/796dd1e2-b1a8-4121-8d3a-f058cea60603/download), 1. [Income Tax Act of 1967](https://www.legislature.mi.gov/documents/mcl/pdf/MCL-206-1.pdf), 1967 PA 281, in force Oct. 1, 1967. To check: [[w.mollenhoff-george-romney]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1963-09-11.state-and-city-finance-mi]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
    short: Michigan's first income tax
  - id: cal.1967-07-01.states-and-cities-us
    when: July 1
    date: '1967-07-01'
    thread: states-and-cities
    also: [elections-1968]
    c: 'St. Louis. The Democratic Governors'' Conference: a statement of accord with Johnson on the peace in Vietnam, crime, and equality of opportunity; McKeithen and Maddox abstain. Johnson comes, briefs them in confidence, and signs the Older Americans Act Amendments before them.'
    n: 'Remarks to the Conference of Democratic Governors in St. Louis, [1967 Pub. Papers 671](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=63); The President''s News Conference in St. Louis Following the Democratic Governors Conference, [1967 Pub. Papers 673](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=65) (July 1, 1967), Harold Hughes''s statement. To check: [[w.sparacino-democratic-and-republican-governors]]; [[w.sabato-goodbye-to-good-time]]. See [[cal.1967-03-18.states-and-cities-us]]. Names: Johnson, Harold Hughes, McKeithen, Maddox.'
    tags: [name:johnson-lyndon-b, name:hughes-harold-e, name:mckeithen-john-j, name:maddox-lester, state:mo]
  - id: cal.1967-07-01.vietnam
    when: July 1
    date: '1967-07-01'
    thread: vietnam
    c: 'Rostow to Johnson: "Viet-Nam situation is not a stalemate"; "We are moving slowly but steadily"; the enemy "moving downhill, paying a heavy price for aggression."'
    n: '[[w.mann-grand-delusion]], 547. Check: the day, from Mann''s note; his text gives "July." To check: Rostow to Johnson, July 1, 1967, NSF, Country File, Vietnam, Box 55, LBJ Library (cited by [[w.mann-grand-delusion]], 547 n.18). Names: Rostow, Johnson.'
    src:
      c: ad363ddd
      rows:
