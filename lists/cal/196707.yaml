    c: 'Johnson''s address on civil disorders, 10:30 p.m. "We have endured a week such as no nation should live through." A National Advisory Commission on Civil Disorders: Kerner chairman, Lindsay vice chairman; Fred Harris and Brooke of the Senate, Corman and McCulloch of the House; Abel of the Steelworkers, Thornton of Litton Industries, Wilkins of the NAACP, Peden of Kentucky''s Commerce Department, Jenkins, Atlanta''s chief of police. The looting and arson "not part of the civil rights protest"; new riot-control training for the National Guard; the FBI to look for evidence of conspiracy; the House''s defeat of the rat bill and the cut in model cities funds named. A day of prayer, July 30.'
    n: 'The President''s Address to the Nation on Civil Disorders, [1967 Pub. Papers 721](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=113) (July 27, 1967). [Johnson and Lindsay, 5:02 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-lindsay-july-27-1967), July 27, Conversation WH6707-01-12009 (Miller Center). [[w.califano-triumph-and-tragedy-of]], 219–20 (decided that day; Califano against; Kerner chosen to be controlled; Ginsburg called back from Seattle; "if we should settle for order that is imposed by the muzzle of a gun"); [[w.branch-at-canaans-edge]], 633 ("We deplore the few who rely upon words and works of terror"); [[w.bernstein-guns-or-butter]], 419. To check: [[w.report-of-the-national]]; [[w.gillon-separate-and-unequal]]; [[w.barnhart-kerner]]; [[w.harris-potomac-fever]]; [[w.cannato-ungovernable-city]]; [[w.flamm-law-and-order]]; [[w.mclaughlin-long-hot-summer-of]]; New York Times, July 28, 1967, rojop MG WL (cited by [[w.branch-at-canaans-edge]], 633); New York Times, July 29, 1967, p. 24 (cited by [[w.branch-at-canaans-edge]], 633); "U.S. Combat Loss in Vietnam Drops to Six-Month Low," NYT, Aug. 4, 1967, p. 1 (cited by [[w.branch-at-canaans-edge]], 633). Names: Kerner, Lindsay, Harris, Brooke, Corman, McCulloch, Abel, Thornton, Wilkins, Peden, Jenkins, Johnson.'
