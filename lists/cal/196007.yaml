  - id: cal.1960-07-04.elections-1960
    when: July 4
    date: '1960-07-04'
    thread: elections-1960-nomination
    c: 'New York. Kennedy''s televised press conference, the reply to Truman, drafted with Sorensen at Hyannis Port: if "fourteen years in major elective office is insufficient experience," that rules out every President of the century; an age test would have kept "Christopher Columbus from even discovering America." "If the people of this nation select me to be their President, I believe that I am ready."'
    n: '[[w.sorensen-kennedy]], 152–53. See [[cal.1960-07-02.elections-1960-2]]. Names: Kennedy, Truman, Sorensen.'
    src:
      c: 50b1ec60
      rows:
        - 'w.sorensen-kennedy 152–53: all'
    tags: [name:kennedy-john-f, name:truman-harry-s, name:sorensen-theodore-c]
    time_range:
      - 1960-07-04T13:00Z
      - 1960-07-04T21:00Z
    time_band: workday daytime
    time_zone: America/New_York
    range_basis: kind
  - id: cal.1960-07-04.elections-1960-2
    when: July 4
    date: '1960-07-04'
    thread: elections-1960-los-angeles
    c: 'Los Angeles. India Edwards, for Johnson, with Connally: Kennedy has Addison''s disease and "would not be alive today if it were not for cortisone"; a public evaluation of his fitness. By her account, Johnson lashes out at her. The *Times* puts it on page 19.'
    n: '[[w.shesol-mutual-contempt]], 35. To check: India Edwards oral history, LBJ Library; [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), 19 (cited by [[w.shesol-mutual-contempt]], 35). Names: Connally, Kennedy, Johnson.'
    src:
      c: ed53a73a
      rows:
        - 'w.shesol-mutual-contempt 35: all'
        - 'via w.shesol-mutual-contempt 35 n.unspeakable: A-B'
    tags: [name:connally-john, name:kennedy-john-f, name:johnson-lyndon-b]
    time_range:
      - 1960-07-04T16:00Z
      - 1960-07-05T00:00Z
    time_band: workday daytime
    time_zone: America/Los_Angeles
    range_basis: kind
  - id: cal.1960-07-04.robert-kennedy
    when: July 4
    date: '1960-07-04'
    thread: elections-1960-los-angeles
    follows:
      - cal.1960-07-04.elections-1960-2
    c: 'Robert Kennedy, at a press conference: his brother has no "ailment classically described as Addison''s disease"; any statement to the contrary "malicious and false." A doctors'' report: health "excellent." "I am confident that Senator Johnson will repudiate the irresponsible statements."'
    n: '[[w.shesol-mutual-contempt]], 35–36; [[w.thomas-robert-kennedy]], 97 (a press conference; a medical report on his brother''s health). Check: Thomas quotes the report''s word as "superb" (97). Answering Edwards: [[w.shesol-mutual-contempt]], 35–36. To check: Myer Feldman oral history, JFK Library; [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html) (cited by [[w.shesol-mutual-contempt]], 35–36). See [[cal.1960-07-04.elections-1960-2]]. Names: Robert Kennedy, Kennedy, Johnson. Check: the day; Shesol: "a quick press conference."'
    src:
      c: ab1fd14c
      rows:
        - 'w.shesol-mutual-contempt 35–36: all'
        - 'w.thomas-robert-kennedy 97: A, C'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1960-07-05.state-constitutions-ok
    when: July 5
    date: '1960-07-05'
    thread: state-constitutions
    also: [electoral-college]
    c: Oklahoma, with the primary, votes on three amendments. Presidential electors may be nominated at party conventions, adopted, 220,575 to 172,219, 56.2 percent. Legislators' pay of $200 a month refused, 156,723 to 236,438, 39.9 percent. A county levy for health departments adopted, 201,218 to 193,497, 51.0 percent.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 16–17](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=16). To check: [[w.morgan-oklahoma-politics-and-policies]]; [[w.peirce-great-plains-states-of]].'
    tags: [state:ok]
  - id: cal.1960-07-05.elections-1960
    when: July 5
    date: '1960-07-05'
    thread: elections-1960
    c: 'Johnson announces in the New Senate Office Building''s auditorium, Rayburn in the front row: "I am, as of this moment, a candidate for the office of President of the United States." The next President "a working President," not a talking or a traveling one.'
    n: '[[w.caro-passage-of-power]], 97–98; [[w.young-two-suns-of-the]], 34 (the day); [[w.white-making-of-the-president]], 134 (July 5 the announcement); [[w.shesol-mutual-contempt]], 36 (the announcement, at one o''clock; not Rayburn or the words). [[w.mcpherson-political-education]], 175 (the announcement before a big crowd in the Senate auditorium). To check: Washington Evening Star, July 6, 1960 (McGrory) (cited by [[w.caro-passage-of-power]], 97). Names: Johnson, Rayburn.'
