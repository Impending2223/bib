        - 'w.white-making-of-the-president 134: A'
    tags: [name:johnson-lyndon-b, name:rayburn-sam]
  - id: cal.1960-07-06.cuba-2
    when: July 6
    date: '1960-07-06'
    thread: cuba
    c: 'Sugar Act extended a year, [74 Stat. 330](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg330-2.pdf), the President given Cuba''s quota to fix. Eisenhower signs and proclaims the cut: 700,000 short tons, the rest of Cuba''s 1960 quota but 39,752. Havana''s Law 851 the same day: American property may be nationalized.'
    n: 'Statement by the President Upon Signing Bill and Proclamation Relating to the Cuban Sugar Quota, [1960–61 Pub. Papers 562](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=614); [Proclamation 3355](https://www.presidency.ucsb.edu/documents/proclamation-3355-determination-cuban-sugar-quota), [25 Fed. Reg. 6414](https://www.govinfo.gov/app/details/FR-1960-07-08). Senate, July 2: the President''s resolution, [84–0](https://voteview.com/rollcall/RS0860384); July 3, the conference report, [32–24](https://voteview.com/rollcall/RS0860387). FRUS 1958–60, VI, docs. [543](https://history.state.gov/historicaldocuments/frus1958-60v06/d543), [544](https://history.state.gov/historicaldocuments/frus1958-60v06/d544) (the meeting with the President, July 6). [[w.fursenko-one-hell-of-a]], 50 (the cut). To check: [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]]; [[w.morley-imperial-state-and-revolution]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.leogrande-back-channel-to-cuba]]. Names: Eisenhower. Check: Fursenko and Naftali have Congress cut the rest of the quota from 744,000 to 44,000 short tons, July 3 (50), citing FRUS 1958–60, VI, doc. 544.'
    src:
      c: 758de4b7
      rows:
