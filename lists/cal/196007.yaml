  - id: cal.1960-07.china-leadership-21
    when: July
    date: 1960-07
    thread: china-economy
    c: 'Chen Yun 陈云 and Li Xiannian 李先念 confer several times on emergency measures, in the economic crisis, to steady the market and meet the needs of food, clothing and daily use: first more grain, farm and side-line goods and light-industry goods, then a narrower gap between the goods on sale and the people''s purchasing power, the basic necessities of the townspeople and the mining districts above all; production in one hand, livelihood in the other.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 41–42. Made public: 2015. Names: Chen Yun, Li Xiannian.'
    tags: [polity:prc, name:chen-yun, name:li-xiannian, vis:only:prc]
