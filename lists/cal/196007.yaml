    date: '1960-07-05'
    place: bonn
    thread: foreign-aid
    also: [europe-and-the-alliance-federal-republic]
    c: 'Bonn, the Development Assistance Group''s meeting opens, van Scherpenberg in the chair. Upton, Assistant Secretary of the Treasury: West Germany not pulling its weight in aid; Britain, Canada and France agree.{1} Van Scherpenberg outlines Bonn''s plans, a five-year $500,000,000 aid program; Reinhardt, of the Economy Ministry, defends them. The meeting runs through Thursday.{2}'
    n: Sydney Gruson, "Bonn Called Lax on Aid Programs," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 8.
    src:
      c: fdc2b132
      rows:
