    thread: elections-1960-los-angeles
    also: [robert-kennedy]
    c: 'Kennedy offers Johnson second place;{1} Robert Kennedy to Johnson''s suite that afternoon;{2} the accounts of what he said differ.{3} Johnson nominated by acclamation that night, the rules suspended over shouts from the galleries.{4} Kennedy to Johnson''s suite about 10:15 a.m.; the labor leaders and liberals protest in Kennedy''s.{5} Rayburn and Connally with Johnson when Robert Kennedy comes.{6} McCormack moves to suspend the rules;{7} Collins rules two-thirds needed and declares Johnson nominated by acclamation.{8} Robert Kennedy asks Rayburn whether Johnson might be interested in being chairman of the national committee; Johnson, after Kennedy''s call: "If the candidate will have me, I''ll join with him in making a fight for it."{9} By Graham''s account he tells Kennedy that Bobby is telling Rayburn and Johnson there is opposition; Kennedy: "Bobby''s been out of touch."{10}'
    n: '[[w.caro-passage-of-power]], 109–43 (the accounts of the day); [[w.schlesinger-robert-kennedy-and-his]], 206–11 (Robert Kennedy''s account, and Graham''s against it); [[w.mann-walls-of-jericho]], 276–78 (the offer, about 10 a.m.; Robert Kennedy''s call; the accounts); [[w.white-making-of-the-president]], 172–77 (Kennedy to Johnson''s suite at 10:15; the labor leaders against; Johnson accepts by telephone; the decision after three); [[w.guthman-we-band-of-brothers]], 77–80 (the choice of Johnson, by Jackson''s account; Robert Kennedy''s comments on Potter''s draft, 78–79); [[w.shesol-mutual-contempt]], 48–56 (the offer; Robert Kennedy''s visits to Johnson''s suite; the accounts: Robert Kennedy''s, Connally''s, Graham''s, Rowe''s); [[w.bernstein-guns-or-butter]], 5; [[w.thomas-robert-kennedy]], 97–98 (Robert Kennedy''s account; Kennedy on the telephone with Johnson half an hour before Robert Kennedy reached his suite; Conway to Robert Kennedy: "If you do this, you''re going to fuck everything up"); [[w.white-making-of-the-president-1965]], 411–15 (by Graham''s account: Robert Kennedy with Rayburn, about 1:30; Graham to Kennedy about 2:30, "in three minutes," then "It''s all set"; Robert Kennedy back, saying there is opposition; Kennedy to Graham: "Bobby''s been out of touch"; Johnson''s statement); [[w.wofford-of-kennedys-and-kings]], 53–57 (Shriver told about 2:30 a.m. Johnson would accept; Kennedy to Johnson at ten; the liberals'' and labor''s protests in the suite; Robert Kennedy to Johnson''s suite in the early afternoon; the offer confirmed about three); [[w.odonnell-johnny-we-hardly-knew]], 216, 220–23 (after Graham''s call, Robert Kennedy to Johnson''s suite, where Rayburn and Connally were: "Do you think he might be interested in being chairman of the national committee?" Rayburn: "Shit!"; Graham to Kennedy, "Bobby''s down here telling Rayburn and Lyndon that there''s opposition"; Johnson: "If the candidate will have me, I''ll join with him in making a fight for it"; the nomination by acclamation, McCormack''s motion, 223; not the hours or the galleries); [[w.schlesinger-journals]], 75–76 (Graham''s account to Schlesinger at dinner on July 15: Kennedy called Johnson early Thursday and called on him about 10:30 without raising the ticket; after 3 o''clock he telephoned him to ask him to go on it; Robert Kennedy came to Rayburn, then into Johnson''s suite, saying Johnson would face a floor fight and should withdraw; Graham got Kennedy on the telephone, who said it was too late, his statement already released; not the nomination by acclamation); [[w.obrien-no-final-victories]], 85–86 (the nomination: to avoid a roll call, with Reuther and Governor Williams of Michigan opposed, McCormack moves to suspend the rules and nominate by voice vote, Ribicoff, with O''Brien beside him, ready if anything fails; Collins rules two-thirds needed and, to a chorus of ayes and a scattering of no''s, declares Johnson nominated by acclamation; not the offer, Robert Kennedy''s visits or the galleries); [[w.odonnell-johnny-we-hardly-knew]], 221–22; [[w.white-making-of-the-president-1965]], 414. [[w.kallina-kennedy-v-nixon]], 74–79 (the offer; Robert Kennedy''s two calls on Johnson; the nomination). [[w.sorensen-kennedy]], 165–66. See [[cal.1960-07-12.elections-1960]]. Names: Kennedy, Johnson, Robert Kennedy, Rayburn, Connally, McCormack, Collins. Check: Caro gives the voice vote in the hall about evenly divided, Rayburn calling "Say ''aye''!" (143), not shouts from the galleries. Check: Sorensen has Robert Kennedy go to Johnson at his brother''s request, and mention the National Committee chairmanship as an alternative (166).'
