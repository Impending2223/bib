    c: 'Nixon flies to New York to see Rockefeller at his Fifth Avenue apartment, the night of July 22.{1} Their statement, July 23, fourteen points: the platform''s civil rights and defense planks redrawn in Chicago.{2} Goldwater: "the Munich of the Republican Party."{3} At the press conference he had called to release his Arizona and South Carolina delegates to Nixon: "immoral politics," a "sell-out on nearly every point."{4} By Nixon''s account, he offers Rockefeller second place;{5} declined.{6}'
    n: 'The convention: [[w.white-making-of-the-president]]. [[w.perlstein-before-the-storm]], 81–85; [[w.young-two-suns-of-the]], 27 (the meeting at Rockefeller''s New York home, July 22; Goldwater''s "Munich"); [[w.nixon-six-crises]], 314–16 (the meeting, arranged through Brownell; Nixon flies to New York the afternoon of Friday, July 22; the statement argued from about ten to 4:30 the next morning); [[w.white-suite-3505]], 22 (Goldwater''s "Munich"); [[w.white-making-of-the-president]], 196–99, 388–90 (Nixon''s call to Brownell; Rockefeller''s terms; Nixon at 810 Fifth Avenue at 7:30; an hour and a half at dinner on second place, refused; the four-way telephone to Chicago; done at 3:20 a.m.; released by five; Goldwater''s "Munich," 199; the text, Appendix B, 388–90); [[w.goldberg-barry-goldwater]], 145 (Nixon leaves Washington July 22, the convention three days off; the Fifth Avenue apartment; Nixon offers Rockefeller the Vice Presidency, declined; the details telephoned to Chicago early the next morning; Goldwater: "surrender to Rockefeller," "immoral politics," "the Munich of the Republican Party"); [[w.smith-on-his-own-terms]], 343–45 (Nixon''s call to Brownell; Rockefeller''s terms, the meeting at his apartment at Nixon''s asking; Nixon by Eastern Airlines in the late afternoon, there after 7:30; second place offered, declined, "standby equipment," by Kissinger''s account foreign policy and the State''s patronage promised too; Percy on the telephone three hours; fourteen points, half on defense; "There must be no ceiling on America''s security"); [[w.smith-on-his-own-terms]], 346 (the predawn release, "the Treaty of Fifth Avenue"; Goldwater: "the Munich of the Republican Party"); [[w.novak-agony-of-the-g]], 22–23 (Nixon''s telephone call from Washington; dinner at the apartment; civil rights, medical care, national defense; the conservatives on "the sellout of Fifth Avenue"); [[w.smith-on-his-own-terms]], 346 (Goldwater: "the Munich of the Republican Party," dictated by "a spokesman for the ultra-liberals"). [[w.kallina-kennedy-v-nixon]], 91–92 (the meeting; the fourteen points); [[w.nixon-rn]], 215 (the meeting in New York, July 22; the offer). [[w.gifford-center-cannot-hold]], 52–53, 76, 154–55 (the meeting, at Nixon''s asking; the fourteen points, seven domestic and seven foreign; the statement on the wire the morning of July 23; Goldwater''s press conference). [[w.kabaservice-rule-and-ruin]], 28–29 (Nixon to New York, July 22, unknown to several of his aides; the night at Rockefeller''s Fifth Avenue apartment; the fourteen-point statement the next morning; Goldwater''s "Republican Munich"; the civil rights plank redrawn). Check: Kabaservice, 28, has Rockefeller not want second place and Nixon later say he did not offer it. Rockefeller''s statement in the morning, Nixon''s flight that afternoon: [[w.white-making-of-the-president]], 196; [[w.nixon-six-crises]], 314. To check: [[w.persico-imperial-rockefeller]]; [[w.pietrusza-1960]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]. Names: Nixon, Rockefeller, Goldwater. Check: Gifford, 52, has the meeting "the Saturday before the convention opened"; 76, July 22, a Friday. Check: White, 22, puts Nixon''s visit on "Saturday, July 23," and a seven-hour meeting. Check: in *Six Crises*, 314, Nixon does not offer Rockefeller second place, and Rockefeller says he does not want it; *RN*, 215, has the offer.'
