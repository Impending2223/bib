    also: [china-moscow-1960]
    c: 'Peking 北京.{1} The Secretariat 书记处 calls the secretaries of the Party groups of the industrial, communications, culture and education units and relays some matters.{2} Deng presides; Peng Zhen attends. The two parties have grown further apart since the summit, above all at Bucharest; Khrushchev calls Lenin''s theses outdated; the Center will not "set its watch" by Moscow. For two years Soviet aid has been squeezed, key items withheld, experts recalled before their terms. At worst: subversion, no advanced techniques, a front with imperialism. China is not afraid: a strategic system in each region, industry spread, 240 million militia, grain self-sufficient everywhere.{3}'
    n: '[[w.yang-shangkun-riji]], I, 524 (July 4, 1960); [[w.deng-xiaoping-nianpu-1904]], III, 1563–1564 (July 4, 1960; morning; Deng presides at the enlarged Secretariat, the Party group secretaries of the central ministries present, on the latest in the differences. Deng: since the summit further apart, above all at Bucharest; Khrushchev calls Lenin outdated; not "one finger"; the Center will not "set its watch"; Soviet aid squeezed, experts withdrawn early; in the worst case subversion, no advanced techniques, a front with imperialism; China not afraid: a system unafraid of atomic war, strategic systems in each region, industry spread, 240 million militia, grain self-sufficient everywhere); [[w.peng-zhen-nianpu-1902]], IV, 44 (July 4, 1960, morning; the 196th meeting; Peng Zhen there; Deng Xiaoping on the situation abroad and at home and the latest in the two parties'' differences; the secretaries of the central organs'' Party groups sitting in); [[w.deng-xiaoping-nianpu-1904]], III, 1563–64; [[w.peng-zhen-nianpu-1902]], IV, 44 (Peng Zhen; Deng''s talk). The words: 上午 (I, 524). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Peng Zhen, Khrushchev.'
    src:
      c: 080f473a
      rows:
