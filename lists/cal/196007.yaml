        - 'w.young-two-suns-of-the 34: 1'
        - 'w.mcpherson-political-education 175: 1'
        - 'w.white-making-of-the-president 134: 1'
        - 'w.shesol-mutual-contempt 36: 1'
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html: 3'
    tags: [name:johnson-lyndon-b, name:rayburn-sam, name:kennedy-john-f, name:dodd-thomas-j, name:inouye-daniel-k, ok:note-substance]
