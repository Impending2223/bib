    also: [robert-kennedy]
    c: 'Los Angeles, the morning after the nomination.{1} Schlesinger urges Robert Kennedy to bring in the Stevenson people.{2} Robert Kennedy: "Arthur, human nature requires that you allow us forty-eight hours. Adlai has given us a rough time over the last three days."{3} Soon after he sends Doyle, who ran the Stevenson campaign, Eugene McCarthy and Schlesinger to the Stevenson loyalists of southern California.{4}'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 211; [[w.schlesinger-journals]], 74 (at Kennedy headquarters after the nomination, Schlesinger urges conciliation of the Stevenson people; Robert Kennedy: "Arthur, human nature requires that you allow us 48 hours. Adlai has given us a rough time over the last three days"; the page gives no hour and has neither Doyle nor McCarthy; the journal entry is headed July 14). Check: the day; the journal cited is of July 15. To check: Schlesinger, journal, July 15, 1960, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 211 n.86). Names: Schlesinger, Robert Kennedy, Stevenson, Eugene McCarthy.'
