    place: washington
    thread: cuba
    also: [congress]
    c: Senate, after 2 a.m., passes a compromise sugar bill by voice vote, the key test 30–29. The President may cut Cuba's quota at once; the deficit to be bought from Panama, Haiti, the Netherlands, the Philippines, Costa Rica and Taiwan.
    n: 'Russell Baker, "Congress Recess Delayed by Fight over Cuba Sugar," [*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1. Check: the test vote''s question; the *Times* of July 4. To check: 106 Cong. Rec. (1960), the day''s pages. See [[cal.1960-07-02.cuba-2]]. Law: [[cal.1960-07-06.cuba-2]].'
    time_zone: America/New_York
  - id: cal.1960-07-03.cuba-2
    when: July 3
    date: '1960-07-03'
    place: washington
    thread: cuba
    also: [congress]
    c: Congress passes the sugar bill. Conferees agree; House by a unanimous shout; Senate, after two hours, 32–24. The President to set Cuba's quota for 1960 and the first quarter of 1961 at any figure; cuts made up from fifteen other countries, the Philippines 15 percent of the rest; the President may allot 160,000 tons to domestic growers.{1} The conferees agree at 4:15 a.m., the House acts at 5:50; Cooley leads the House's fight.{2}
    n: '"Congress Passes Cuba Sugar Bill; Quits till August," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 2; William M. Blair, "Stakes Were High for Sugar Lobby," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2; Tad Szulc, "Cuba Awaits Cut by U.S. on Sugar," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2. Check: the vote''s question and the bill''s number. To check: 106 Cong. Rec. (1960). Law: [[cal.1960-07-06.cuba-2]]. Names: Cooley, McCormack.'
