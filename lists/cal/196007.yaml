  - id: cal.1960-07-13.elections-1960-nomination
    when: July 13
    date: '1960-07-13'
    thread: elections-1960-nomination
    c: 'Washington. When Wyoming''s votes give Kennedy the nomination, Goodwin and the staff of the Senate office leave for the Democratic National Committee''s headquarters on K Street, where the committee staff are watching a television broadcast of the convention. They put briefcases and cartons of papers on the desks: by "inviolable tradition" the National Committee, its records and staff belong to the nominee.'
    n: '[[w.goodwin-remembering-america]], 90 (Goodwin''s account; the broadcast "from Constitution Hall"). See [[cal.1960-07-13.elections-1960]]. Names: Kennedy, Goodwin. Check: the day; Wyoming''s votes came late on July 13 in Los Angeles, after midnight in Washington.'
