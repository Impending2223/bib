    when: July 5
    date: '1960-07-05'
    place: tunis
    thread: europe-and-the-alliance-france
    c: 'Abbas, by the Tunis and Moroccan radios, after the communique of July 4: "Sooner or later real negotiation will impose itself"; the war can still be long; the talks at Melun "positive."{1} The speech, in French, recorded in the study of his villa at Tunis.{2}'
    n: 'Thomas F. Brady, "Algerian Deems Talks Inevitable," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). Names: Abbas.'
    src:
      c: 1f38b941
