    c: 'The Soviet delegation''s report to the Central Committee on its visit to Ghana: Nkrumah still under British control, his talk of socialism empty; Touré impresses them more. Undermine Nkrumah from the left: support "progressive" elements, invite more Ghanaian officials, train more Ghanaian technical cadres in the USSR, enlarge the embassy at Accra, more propaganda.'
    n: '[[w.friedman-shadow-cold-war]], 47. Made public: 2015. To check: Report of Soviet delegation on visit to Ghana, June 28–July 10, 1960, RGANI f.5 o.30 d.336, 96–107 (cited by [[w.friedman-shadow-cold-war]], 47 n.84). Names: Nkrumah, Touré.'
