    c: 'Thompson''s Independence Day reception, some 500 Muscovites. Mikoyan, Kozlov and Ignatov of the Presidium; Mikoyan: relations "must improve"; Kozlov: within six to eight months. Thompson not asked this year to speak on Moscow television.{1} Asked about Cuba, Mikoyan says the Soviet Union has tankers enough to deliver crude oil there. Van Cliburn plays.{2}'
    n: 'Osgood Caruthers, "Big Soviet Crowd at July 4 Party," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). Names: Thompson, Mikoyan, Kozlov, Ignatov.'
