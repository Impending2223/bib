    also: [soviet-union]
    c: 'The Foreign Ministry hands the Soviet Embassy the government''s reply to the note of July 16 recalling the experts: the recall against the treaty of alliance and the norms between socialist states;{1} China would keep every expert to the end of his term;{2} if the Soviets insist, "great regret."{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, July 30, 1960; [[w.zhou-enlai-nianpu-1949]], II, 335–36, July 30, 1960 (the note''s draft discussed at the Standing Committee the evening before); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 154 (July 31, 1960; the Foreign Ministry''s note to the Soviet embassy in answer to its note of July 16: the Soviet note charges a hostile line toward the Soviet Union and decides on its own to recall all experts; China has always given its experts all materials, internal and public, and such mutual introduction among socialist states is normal; the unilateral withdrawal and breaking of agreements and contracts will damage China''s construction; China hopes the Soviet government will reconsider, and will keep all experts whose terms are unfinished); [[w.deng-xiaoping-nianpu-1904]], III, 1568–1569 (July 31, 1960; the reply delivered: the recall breaks the agreements and contracts, will cost China''s construction losses and difficulties, is rare even in ordinary international relations; China, reserving its view, respects the Soviet government''s wishes); [[w.zhang-sino-soviet-economic-cooperation]], 214 (Beijing''s first response, July 31: the Kremlin to reconsider, or at least let the experts stay until their contracts expire); [[w.peng-zhen-nianpu-1902]], IV, 48 (July 31, 1960; the reply: most contracts unexpired, the sudden recall "显然破坏了两国政府所签订的有关协定和合同", rare in international relations, indefensible in law, morals and politics; the Soviet government asked to reconsider; failing that, China respects its view, reserving its own). To check: [[w.bianjibu-dangdai-zhongguo-waijiao]], 117–18 (cited by [[w.zhang-sino-soviet-economic-cooperation]], 214 n.94). See [[cal.1960-07.china]]. Made public: 1997.'
