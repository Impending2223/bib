    c: 'Kennedy accepts at the Memorial Coliseum: "the New Frontier of which I speak is not a set of promises—it is a set of challenges." On his religion: no "religious pressure or obligation." Johnson accepts the same evening.'
    n: '[Address Accepting the Democratic Nomination for President](https://www.presidency.ucsb.edu/documents/address-accepting-the-democratic-nomination-for-president-the-memorial-coliseum-los); [Address of Senator Lyndon B. Johnson Accepting the Democratic Party Nomination for the Vice Presidency](https://www.presidency.ucsb.edu/documents/address-senator-lyndon-b-johnson-accepting-the-democratic-party-nomination-for-the-vice). [[w.kallina-kennedy-v-nixon]], 79–80 (the address at the Coliseum); [[w.white-making-of-the-president]], 177–78 (the acceptance, quoted); [[w.sorensen-counselor]], 217–19 (Sorensen''s drafting of the acceptance speech: his letter two weeks before the convention soliciting drafts; "the New Frontier" first in one of his drafts, by his recollection; not the text). [[w.sorensen-kennedy]], 166–67 (the acceptance; the New Frontier). To check: John Kenneth Galbraith to Kennedy, n.d., Galbraith Papers, JFK Library (cited by [[w.kallina-kennedy-v-nixon]], 80 n.78). See [[cal.1960-07-12.elections-1960]]. Names: Kennedy, Johnson.'
