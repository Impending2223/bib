    date: '1960-07-03'
    place: nyc
    thread: elections-1960-nomination
    c: 'Harriman, on WRCA-TV''s "Searchlight": Truman''s charge will not move many; the convention "entirely open." Expects New York''s delegation to cast at least 105 votes for Kennedy on the first ballot.'
    n: '"Harriman Doubts Truman''s Charge," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 4. See [[cal.1960-07-02.elections-1960-2]]. Names: Harriman, Truman, Kennedy.'
