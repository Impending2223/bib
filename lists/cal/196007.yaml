  - id: cal.1960-07-14.elections-1960-los-angeles-14
    when: July 14
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: 'Los Angeles, North Rossmore Avenue, after two o''clock in the morning. Kennedy, who has read aloud Johnson''s telegram, "LBJ now means Let''s Back Jack," has Powers try to reach Johnson by telephone; a sleepy aide: Johnson is in bed. Kennedy telephones a message by Evelyn Lincoln''s husband, Abe, who types it and takes it by hand to Johnson''s suite: Kennedy wants to see Johnson at ten that morning. To Powers: "I wish I had asked Lyndon and George Smathers to be at that meeting of Southern governors we''ve got scheduled for eleven-thirty."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 214–15 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Johnson, Powers, Lincoln, Smathers.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:powers-david-f, name:lincoln-evelyn, city:los-angeles, name:smathers-george-a]
  - id: cal.1960-07-14.elections-1960-los-angeles-15
    when: July 14
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: 'Los Angeles, the Biltmore, Kennedy''s suite, about eight. Kennedy takes Robert Kennedy into a bedroom and closes the door. Coming out, Robert Kennedy: "If you''re sure it''s what you want to do, go ahead and see him." By Powers''s account, Johnson is the "him."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 215 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Robert Kennedy, Johnson, Powers.'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:johnson-lyndon-b, name:powers-david-f, city:los-angeles]
  - id: cal.1960-07-14.elections-1960-los-angeles-16
    when: July 14
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: 'Los Angeles, the Biltmore, Robert Kennedy''s bedroom, half an hour after Kennedy tells him of the offer. Salinger to O''Donnell: Robert Kennedy "just asked me to add up the electoral votes in the states we''re sure of, and to add Texas." O''Donnell, to Robert Kennedy in the bathtub: "Don''t tell me it''s Johnson." "I guess it is. He''s seeing him now." O''Donnell: "Do you realize this is a disaster? Nixon will love this. ... I want to talk to your brother myself on this one."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 216 (O''Donnell''s and Powers''s account); [[w.salinger-with-kennedy]], 44 (Salinger''s memorandum: Robert Kennedy''s room at the Biltmore, O''Donnell there, Robert Kennedy asks Salinger to compute electoral votes, is "seriously thinking of Johnson," and says Kennedy will see Johnson at 10 a.m.; O''Donnell protests violently, Salinger with him; not the bathtub or the words). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Salinger, Robert Kennedy, Johnson, Nixon.'
    src:
      c: ca08ec41
      rows:
        - 'w.odonnell-johnny-we-hardly-knew 216: ?'
        - 'w.salinger-with-kennedy 44: ?'
    tags: [name:odonnell-kenneth-p, name:salinger-pierre, name:kennedy-robert-f, name:johnson-lyndon-b, city:los-angeles, name:nixon-richard-m]
    variants:
      - unit: B
        witness: w.salinger-with-kennedy
        reads: 'Salinger: Robert Kennedy "asked me to compute the number of electoral votes in New England and in the ''solid South''"; Kennedy "was going over to see Johnson at 10 A.M."'
        at: '44'
  - id: cal.1960-07-14.elections-1960-los-angeles-17
    when: July 14
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: 'Los Angeles, the Statler Hilton, the labor leaders assembled. Reuther and Meany, who had seen Kennedy earlier with Goldberg, are "violently angry" at the choice of Johnson; Conway "coming at me as if he was about to slug me" (O''Donnell). Rose: if Johnson is on the ticket, Kennedy will not be on the Liberal party''s line in New York. The labor people shout they will put up a candidate of their own and make a floor fight. Rose telephones Dubinsky in New York; Dubinsky, by Rose: "Kennedy is making a smart move." The shouts of "sellout" and "double cross" resume. O''Donnell and Robert Kennedy the targets.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 218–19 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Reuther, Meany, Conway, Goldberg, Kennedy, Johnson, O''Donnell, Robert Kennedy.'
    tags: [name:reuther-walter, name:meany-george, name:conway-jack-t, name:goldberg-arthur-j, name:kennedy-john-f, name:johnson-lyndon-b, name:odonnell-kenneth-p, name:kennedy-robert-f, city:los-angeles]
  - id: cal.1960-07-14.elections-1960-los-angeles-18
    when: July 14
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: Los Angeles, the Biltmore, Kennedy's suite, a meeting of Southern governors approving Johnson. Soapy Williams of Michigan walks in by accident and shouts that if Johnson is nominated he will lead a floor fight against the nomination. A few of the Southerners jump up to take a punch at him; Ribicoff steps in. Kennedy, in an armchair, watches "without saying a word."
    n: '[[w.odonnell-johnny-we-hardly-knew]], 220 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Williams, Kennedy, Johnson, Ribicoff.'
    tags: [name:williams-g-mennen, name:kennedy-john-f, name:johnson-lyndon-b, name:ribicoff-abraham, city:los-angeles]
  - id: cal.1960-07-14.elections-1960-los-angeles-19
    when: July 14
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: 'Los Angeles, the afternoon. Between four-thirty, when Conway tells O''Donnell that the labor people and the liberals of Michigan''s delegation are "definitely planning a fight to the finish" against the ticket, and seven-thirty, when he telephones him on the floor that there will be no floor fight and no candidate against Johnson: by O''Donnell''s later account, Reuther and his people make their own pact with Johnson, their opposition dropped if he supports the convention''s civil rights platform. Johnson writes a letter to that effect; Woodcock, vice-president of the United Automobile Workers, presents it to a caucus of the Michigan delegation. Williams still against the nomination.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 222–23 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Conway, O''Donnell, Reuther, Johnson, Williams. Check: the hour of the pact (the authors: between four-thirty and seven).'
    tags: [name:conway-jack-t, name:odonnell-kenneth-p, name:reuther-walter, name:johnson-lyndon-b, name:williams-g-mennen, city:los-angeles]
  - id: cal.1960-07-14.elections-1960-los-angeles-20
    when: July 14
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: 'Los Angeles, about 3:20 p.m., Stevenson''s quarters. The Governor, "visibly shaken," comes out to Schlesinger: Phil Graham has just called him to say Kennedy has chosen Lyndon Johnson for Vice President. By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 74. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1960-07-14.elections-1960]]. Names: Stevenson, Schlesinger, Kennedy, Johnson.'
    tags: [name:stevenson-adlai-e, name:schlesinger-arthur-m-jr, name:kennedy-john-f, name:johnson-lyndon-b, city:los-angeles, state:ca]
  - id: cal.1960-07-14.elections-1960-los-angeles-21
    when: July 14–15
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: Los Angeles, the Biltmore, the night after the vice-presidential nomination. John S. Knight's story says Johnson forced Kennedy to take him; Salinger denies it under his own name. Rayburn, through Moyers, wants a denial in Kennedy's name and a call from Kennedy to Knight; Salinger and Robert Kennedy draft the statement, and Robert Kennedy telephones Knight, whose confidence in the story is shaken. By Salinger's memorandum of the week after.
    n: '[[w.salinger-with-kennedy]], 44–45. Names: Salinger, Rayburn, Moyers, Robert Kennedy, Kennedy, Johnson.'
    tags: [name:salinger-pierre, name:kennedy-john-f, name:kennedy-robert-f, name:johnson-lyndon-b, name:rayburn-sam, name:moyers-bill]
  - id: cal.1960-07-14.elections-1960-los-angeles-22
    when: July 14
    date: '1960-07-14'
    thread: elections-1960-los-angeles
    c: Los Angeles, about three in the afternoon. Kennedy tells Clifford, Symington's campaign manager, that Johnson will be the vice-presidential candidate, and that he is surprised Johnson was willing to make a fight for second place. By Salinger's memorandum of the week after.
    n: '[[w.salinger-with-kennedy]], 45 (Clifford confides it to Governor Blair of Missouri, the source of Knight''s story). See [[cal.1960-07-14.elections-1960]]. Names: Kennedy, Clifford, Symington, Johnson, Salinger.'
    tags: [name:kennedy-john-f, name:clifford-clark, name:symington-william-s, name:johnson-lyndon-b, name:salinger-pierre]
