  - id: cal.1960-07-05.china-leadership
    when: July 5
    date: '1960-07-05'
    place: beidaihe
    thread: china-shanghai-1960
    also: [soviet-union, china-moscow-1960, china-mao-foreign]
    c: 'Beidaihe.{1} The Central Work Conference opens (July 5–Aug. 10), on the world and on cutting back at home: the enlarged Politburo Standing Committee, Mao presiding, hears Peng Zhen on Bucharest and first secretaries on farms and factories.{2} Mao: agriculture truly the base, squeezed ten years;{3} rest and food for the people; the communes'' three levels of ownership; industry''s front shortened; 30 million tons of steel in 1962 with the full range of kinds, no 100 million by 1969.{4} Zhu De attends.{5} Chen Yi attends.{6}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, July 5, 1960; [[w.zhou-enlai-nianpu-1949]], II, 329, July 6, 1960 (Zhou at Beidaihe); [[w.lengxi-shinian-lunzhan-1956-1966]], 308 (the conference July 5 to Aug. 10; its two matters, the economy''s adjustment and Sino-Soviet relations; attention went to the second; Wu the only one of the writers a member of the conference); [[w.macfarquhar-origins-of-the-cultural]], III, 11 (the conference; its directive on agriculture and grain); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 491 (July 5–Aug. 10, 1960; Liu attends the Central Work Conference at Beidaihe, chiefly on international questions and the adjustment of the domestic economy; it approves Li Fuchun''s and Bo Yibo''s report on the main measures for third-quarter industrial and transport output, issues instructions on the whole Party running agriculture and grain and on an increase-production and economy campaign centered on grain and steel, and decides to compress the capital construction line, safeguard steel and iron, clear up the labor force and strengthen agriculture); [[w.yang-shangkun-riji]], I, 524–525 (July 5, 1960; 5 to 9 p.m.; Mao with the members of the Politburo and some local comrades: three days for reading documents, then reports; the outcome of the dispute abroad turns on the work at home; industry and agriculture not yet through, the front to be shortened, three to five years to get through); [[w.yang-jisheng-mubei]], II, 1171 (the Beidaihe work conference, July 5–Aug. 10, studies the home economy with the Sino-Soviet question, adopts three directives, on saving grain and steel through output and thrift, on all the Party farming and growing grain, and on an urgent country-wide drive to buy for export, and proposes an adjustment of the economy); [[w.deng-xiaoping-nianpu-1904]], III, 1564 (July 5–Aug. 10, 1960; Deng attends; chiefly the world and the first readjustment of the economy; the Center''s directives on the whole Party taking up agriculture and grain and on an output-and-thrift campaign centered on grain and steel; capital construction cut, steel secured, labor cleared, the farm front strengthened; one account book from now on; a notice to cadres on Bucharest and Sino-Soviet relations. The afternoon of the 5th, Deng at Mao''s enlarged Standing Committee, which hears first secretaries on output and Peng Zhen on Bucharest); [[w.chen-yi-nianpu]], 824 (July 5–Aug. 10, 1960; Chen Yi attends the Center''s work conference at Beidaihe, on the world and on adjusting the economy; its documents include the directive on the whole Party''s going in for agriculture and grain 《关于全党动手，大办农业、大办粮食的指示》); [[w.peng-zhen-nianpu-1902]], IV, 44–45 (July 5–Aug. 10, 1960; Peng Zhen attends; the measures for industrial production in the third quarter, the Center''s directives on agriculture and grain and on economy centered on grain and steel adopted; capital construction cut; no more "two books" of the plan, nothing outside it; the notice on telling Party members of Bucharest; the regional bureaus; July 5, afternoon, at Mao''s enlarged Standing Committee, Peng reports on Bucharest; Mao: the quarrel abroad settled by the work at home; industry and agriculture not through the pass; shorten the front, a battle of annihilation, three to five years); [[w.zhu-de-nianpu-xinbian]], III, 1779 (July 5–Aug. 10, 1960; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 at Beidaihe 北戴河, on readjusting the economy and on the world; its directives on the whole Party turning to agriculture and grain, and on the drive for output and economy centered on grain and steel); [[w.chen-yun-nianpu-xiuding]], III, 39 (Chen Yun at the Central Work Conference, July 5–Aug. 10; July 5, the enlarged Standing Committee, from the afternoon to 8:30 p.m.; the work conference sets "low standards" and "melons and vegetables in place of grain", one account only in the plans from now on, the production team the basic accounting unit for five years at least, private plots); [[w.zhu-de-nianpu-xinbian]], III, 1779; [[w.chen-yi-nianpu]], 824. Made public: 1996. Check: MacFarquhar dates the conference July 15–Aug. 10. To check: [[w.history-of-the-chinese]], 286 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 11 n.3b). Names: Mao Zedong, Peng Zhen, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Dong Biwu, Li Fuchun, He Long, Li Xiannian, Ke Qingshi, Li Jingquan, Tan Zhenlin, Lu Dingyi, Chen Boda, Kang Sheng, Bo Yibo, Wang Jiaxiang, Chen Yi.'
