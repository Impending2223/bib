  - id: cal.1960-07-04.robert-kennedy
    when: July 4
    date: '1960-07-04'
    place: los-angeles
    thread: elections-1960-los-angeles
    follows:
      - cal.1960-07-04.elections-1960-2
    c: 'Robert Kennedy, at a press conference: his brother has no "ailment classically described as Addison''s disease";{1} any statement to the contrary "malicious and false."{2} A doctors'' report: health "excellent."{3} He releases it, dated June 11, signed by Dr. Eugene J. Cohen and Dr. Janet Travell.{5} "I am confident that Senator Johnson will repudiate the irresponsible statements."{4}'
    n: '[[w.shesol-mutual-contempt]], 35–36; [[w.thomas-robert-kennedy]], 97 (a press conference; a medical report on his brother''s health); [[w.sorensen-counselor]], 193 (at a convention press conference two of Johnson''s top aides question Kennedy''s life expectancy on the ground of Addison''s disease; the Kennedy for President press office issues a statement from Robert Kennedy that the candidate "does not now nor has he ever had an ailment described classically as Addison''s Disease, which is a tuberculous destruction of the adrenal gland"; not the day, the doctors'' report or "malicious and false"). Check: Thomas quotes the report''s word as "superb" (97). Answering Edwards: [[w.shesol-mutual-contempt]], 35–36. Check: Counselor, 193, has the statement come from the press office as Robert Kennedy''s, "does not now nor has he ever had an ailment described classically as Addison''s Disease, which is a tuberculous destruction of the adrenal gland"; the entry has him say it at a press conference, "ailment classically described as Addison''s disease.". W. H. Lawrence, "Johnson Backers Urge Health Test," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html) (it reads "described classically"). To check: Myer Feldman oral history, JFK Library. See [[cal.1960-06-11.elections-1960-kennedy]], [[cal.1960-07-04.elections-1960-2]]. Names: Robert Kennedy, Kennedy, Johnson. Check: the day; Shesol: "a quick press conference."'
    src:
      c: fba710cd
      rows:
        - 'w.shesol-mutual-contempt 35–36: 1, 2, 3, 4'
        - 'w.thomas-robert-kennedy 97: 1, 3'
        - 'w.sorensen-counselor 193: ?'
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html: 2, 3, 5, 4'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1960-07-04.elections-1960-los-angeles
    when: July 4
    date: '1960-07-04'
    place: los-angeles
    thread: elections-1960-los-angeles
    follows:
      - cal.1960-07-04.elections-1960-2
    c: 'Los Angeles. Salinger with Kennedy and Robert Kennedy on the Connally–Edwards charge: they would ignore it as unworthy of a reply; Salinger urges a quick one, before the Republicans can repeat it. Kennedy''s physicians are reached and a medical statement agreed: an adrenal insufficiency under control for many years, which none of his doctors considers Addison''s disease. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 40–41. Check: the day (Salinger puts the Connally–Edwards press conference "on the first day of the convention," July 11; see [[cal.1960-07-04.elections-1960-2]], [[cal.1960-07-04.robert-kennedy]]). Names: Salinger, Kennedy, Robert Kennedy, Connally.'
    tags: [name:salinger-pierre, name:kennedy-john-f, name:kennedy-robert-f, name:connally-john]
  - id: cal.1960-07-04.china-leadership
    when: July 4
    date: '1960-07-04'
    thread: china-zhou-foreign
    also: [china-army]
    c: 'Zhou Enlai to Koirala, answering his letter of July 3, which says some 300 Chinese troops remain at Mustang and have fired on villagers at Mugu: Chinese troops never entered Mustang or Mugu; the order of July 2 was carried out by midnight, the troops all withdrawn ten kilometers from the border north of the Namja pass and east of the Marti and Heping passes; the Mustang group, if the report is not mistaken, is probably Tibetan rebels using the PLA''s name, whom Nepal''s army may disarm.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 329 (July 4, 1960). Made public: 1997. Names: Zhou Enlai, Koirala.'
    tags: [polity:prc, polity:nepal, name:zhou-enlai, name:koirala-bisweswar-prasad, vis:only:prc+nepal]
