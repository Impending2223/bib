    c: 'Beidaihe, the work conference in plenary session, Mao presiding: Peng Zhen on the Bucharest meeting and the differences between the two parties.{1} Zhou Enlai is present.{2} Peng reports the Center''s line: unity through criticism or struggle to a new unity; reconnaissance turned into an encounter battle; three steps, objection, refutation with their own view, the facts; Khrushchev''s "father party" shown; the Center''s three last moves, amendments, a signature with reservations, a statement.{3} The discussion, by Wu''s account, takes up seven points: two lines, war and peace, Khrushchev''s rage, the surprise attack, a long struggle, no fear of a break, the reply to the notification. Mao: a struggle of "encirclement" and counter-encirclement.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, July 8, 1960; [[w.zhou-enlai-nianpu-1949]], II, 330, July 8, 1960 (Zhou present; Peng Zhen''s report on the two parties'' talks and Bucharest); [[w.lengxi-shinian-lunzhan-1956-1966]], 309–313 (Peng Zhen''s report on Bucharest at the conference''s second day, with seven points the discussion took up (two lines, war and peace, Khrushchev''s rage, the surprise attack, a long struggle, no fear of a break, the reply to the notification); Mao''s closing remarks on the counter-encirclement); [[w.yang-shangkun-riji]], I, 525 (July 8, 1960; 5 to 9 p.m., the plenary; Peng Zhen''s report); [[w.deng-xiaoping-nianpu-1904]], III, 1565 (July 8, 1960; afternoon; Deng at the plenary; footnote 1: the talks of June 17 at Moscow, Peng Zhen''s delegation with Kozlov and others of the Presidium); [[w.mao-zedong-zhuan]], V, ch. 66 (July 8: Peng Zhen reports to the conference on the Bucharest meeting; the groups discuss it, and the Standing Committee decides that Zhou Enlai give a systematic account of the Comintern''s relations with the CCP, in practice the CPSU''s). [[w.peng-zhen-nianpu-1902]], IV, 45–46 (July 8, 1960, afternoon; Peng Zhen''s report on the talks and the Bucharest meeting: the Center''s line, unity through criticism or struggle to a new unity, "后发制人，留有余地"; reconnaissance turned into an encounter battle; three steps: objection, refutation with their own view, the facts; Khrushchev''s "father party" shown; the Center''s three last moves: amendments, a signature with reservations, a statement; the struggle long and hard, a contradiction among the people, to be waged "有理、有利、有节"); [[w.zhou-enlai-nianpu-1949]], II, 330; [[w.peng-zhen-nianpu-1902]], IV, 45–46; [[w.lengxi-shinian-lunzhan-1956-1966]], 309–313. Made public: 1997. Check: Wu dates Peng''s report July 6, the conference''s second day ([[w.lengxi-shinian-lunzhan-1956-1966]], 309); the Peng and Deng chronologies, July 8. Names: Mao Zedong, Peng Zhen, Zhou Enlai, Khrushchev.'
