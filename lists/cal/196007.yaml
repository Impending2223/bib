  - id: cal.1960-07-03.elections-1960-rockefeller
    when: July 3
    date: '1960-07-03'
    thread: elections-1960-rockefeller
    also: [cuba]
    c: 'Rockefeller on CBS''s "Face the Nation": the Republican leadership does not want a contest of men or issues, "a mistake"; Nixon could not win in a popular election far from New York''s stand; odds 99 to 1 on his nomination. On Cuba, a meeting of foreign ministers; the sugar premium might be impounded for the expropriated.{1} Percy, chairman of the resolutions committee, to come to New York next week to discuss the platform with him. On his name being placed in nomination: "There is no plan to my knowledge."{2}'
    n: 'Douglas Dales, "Rockefeller Says G.O.P. Bars a Test of Men and Issues," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 28. Names: Rockefeller, Nixon, Percy.'
    src:
      c: a05e04a3
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html: 1, 2'
    tags: [name:rockefeller-nelson, name:nixon-richard-m, name:percy-charles-h, ok:fields-place]
  - id: cal.1960-07-03.elections-1960-nomination
    when: July 3
    date: '1960-07-03'
    place: los-angeles
    thread: elections-1960-nomination
    c: 'Collins, the convention''s permanent chairman, on NBC''s "Meet the Press": an orderly procedure for changes of votes during a roll call, fair to all. Has telegraphed Truman twice, without answer, urging him to attend.{1} He understands that the Rules Committee, Loveless its chairman, is weighing a rule on changes during roll calls.{2}'
    n: '"Collins Pledges Fair Convention," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html). Names: Collins, Truman, Loveless.'
    src:
      c: 34f36999
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html: 1, 2'
    tags: [name:collins-leroy, name:truman-harry-s, name:loveless-herschel-c]
