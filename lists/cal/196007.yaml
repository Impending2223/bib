  - id: cal.1960-07-05.cuba-4
    when: July 5
    date: '1960-07-05'
    place: london
    thread: cuba
    also: [europe-and-the-alliance-britain]
    c: 'The Foreign Office discloses Britain''s "strong" note on the seizure of Shell''s refinery, delivered by Fordham, the ambassador: "deepest concern and displeasure"; the refinery to be restored "on a normal footing." No reply.{1} Shell''s debt to its crude-oil suppliers, Cuba refusing the remittances, reached $17,000,000 by June, the *New York Times* reports.{2}'
    n: 'Walter H. Waggoner, "Britain Protests Shell Plant Loss," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). The question in the Lords is entered apart ([[cal.1960-07-05.cuba-7]]). Check: the note''s day.'
    src:
