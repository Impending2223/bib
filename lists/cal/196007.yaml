    date: '1960-07-03'
    place: washington
    thread: congress
    c: Congress passes the Senate's version of Summerfield's bill against obscene mail. Post Office may stop an addressee's mail only by a court order on probable cause.{1} The Post Office had asked forty-five-day stop orders, and the House had passed the bill so; the compromise passes the Senate without objection.{2}
    n: '"Congress Passes Cuba Sugar Bill," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 2. Check: the hour and the bill''s number. Names: Summerfield.'
