    tags: [name:monroney-almer-s, name:stevenson-adlai-e]
  - id: cal.1960-07-03.elections-1960
    when: July 3–4
    date: '1960-07-03'
    thread: elections-1960-nomination
    c: Johnson will not rule out taking second place.
    n: '[[w.kallina-kennedy-v-nixon]], 76; [[w.shesol-mutual-contempt]], 43 (his words of July 3, "from running the elevator to the top job," and of July 4). To check: Richard L. Lyons, "Kennedy Set to Offer Johnson Second Place," Washington Post, July 12, 1960 (cited by [[w.kallina-kennedy-v-nixon]], 76 n.68). Names: Johnson. Check: the form and the place.'
