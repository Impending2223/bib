    also: [europe-and-the-alliance-britain]
    c: 'Macmillan, in the Commons, on Noel-Baker''s question: no American U-2 flights from British bases without his knowledge; declines to say whether any were approved or made.{1} Labour members ask of a report that a Senate committee had evidence of reconnaissance flights from Lakenheath; Macmillan has not seen it and will reply in writing.{2}'
