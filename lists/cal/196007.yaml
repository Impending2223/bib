    date: '1960-07-04'
    place: linz
    thread: soviet-union
    c: 'Khrushchev in Austria: Linz, the United Austrian steel works, the West no help to Austria, "Who will help you?"; Salzburg, against the "revanchist circles" next door; the Soviet Union would not "remain idle" if Austria''s neutrality were infringed. Fuschl, his lodging.{1} Pittermann is at the plant. At "Wils," a state breeding farm, he accepts two prize bulls.{2}'
    n: 'A. M. Rosenthal, "Austrians Ignore Khrushchev Tour," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 9. Check: M. S. Handler, "Khrushchev Looks to Reds'' Triumph," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, has Khrushchev at a party in the Residenz, Salzburg, the night of July 4. Names: Khrushchev.'
    src:
