    when: July 4
    date: '1960-07-04'
    place: london
    thread: cyprus
    c: 'Macleod, Colonial Secretary: a bill naming Cyprus''s independence day may pass Parliament before the month''s end; the settlement''s documents to be initialed at Nicosia within days by the five parties.'
    n: '"Action Expected in July," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). See [[cal.1960-07-04.cyprus]]. Names: Macleod.'
