    thread: elections-1960-los-angeles
    c: 'Los Angeles, the Biltmore, Kennedy''s suite, the Golden Door. A message from Kenny, Hudson County leader: after a long caucus that morning, Governor Meyner still holds New Jersey''s forty-one votes for himself on the first ballot; Kennedy can count on thirty-one on the second.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 208 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy.'
    tags: [name:kennedy-john-f, state:nj, city:los-angeles]
