    n: '"Congress Passes Cuba Sugar Bill; Quits till August," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1. Pending: aid to schools, minimum wage, medical aid for the aged, housing, the size of the foreign aid appropriation. See [[cal.1960-06-29.congress]].'
