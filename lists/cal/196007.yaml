    c: Khrushchev recalls all Soviet experts from China and sharply cuts Soviet material and military aid.{1} In Peking the Soviet chargé, Sudarikov, hands the note to Vice Foreign Minister Zhang Hanfu.{2} All experts to leave between July 28 and Sept. 1.{3} 1,390 experts to go and more than 900 not to be sent; 343 contracts for experts and 257 projects of scientific and technical cooperation ended.{4}
