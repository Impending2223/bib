    date: '1960-07-04'
    place: washington
    thread: rules
    also: [congress]
    c: Liberal Democrats of the Democratic Study Group, Holifield, Frank Thompson and Stewart Udall leading, Bolling, not of the group, their tactician, organize a drive to curb House Rules at the opening of the next Congress; the twenty-one-day rule among the proposals; an "outside coalition" of voters being organized.
    n: 'John D. Morris, "Drive On to Curb House Rules Unit," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 22. Check: the day. Names: Holifield, Thompson, Udall, Bolling.'
