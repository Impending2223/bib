    n: 'Harry Gilroy, "Congolese Police Kill 10 in Clash," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 8. Split under R17: the Kasai arrest order and the Otraco strike, reported in the same story, are entries of their own. See [[cal.1960-07-02.congo]]. Names: Bomboko, Ileo.'
