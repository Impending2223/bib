  - id: cal.1960-07-05.china-leadership-2
    when: July 5
    date: '1960-07-05'
    thread: china-shanghai-1960
    also: [china-mao-foreign, china-foreign]
    c: 'Mao 毛泽东 to Yang Shangkun 杨尚昆: this batch of documents is of interest, sixteen of them; print them as one book at once and send to the comrades at the Central Work Conference at Beidaihe 北戴河. He titles them ''Sixteen reports on the present situation''. They are, in the Public Security Ministrys internal publication of July 1, a ministry paper and cables from the embassies in fifteen countries, among them the embassy in Denmark on Jespersen''s impressions of his visit, Wang Bingnan 王炳南 at Warsaw, and Ke Hua 柯华 on Nkrumah''s audience at Accra.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 264–265 (July 5, 1960; Mao''s note of July 5, written on the Ministry''s internal publication; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Ministry of Public Security, internal publication of July 1, 1960 (a paper of the ministry and cables from the embassies in fifteen countries) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1a); Chinese embassy in Denmark, cable of July 1, 1960 to the Central Committee''s International Liaison Department and the Foreign Ministry, on the Danish party chairman Jespersen''s impressions of his visit to China (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1b); Wang Bingnan, Chinese ambassador in Poland, cable of June 30, 1960 to the Foreign Ministry and the International Liaison Department, on a talk with the deputy head of the Polish party''s propaganda department (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1c); Chinese embassy in Hungary, cable of June 29, 1960 to the International Liaison Department and the Foreign Ministry, on the Hungarian internal bulletin''s report of Khrushchev''s speech at the Romanian Workers'' Party reception (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1d); Chinese embassy in the Soviet Union, cable of July 1, 1960 to the Foreign Ministry, on the Soviet press and leaders'' continued propaganda for peaceful coexistence (cited by [[w.jianguo-yilai-mao-zedong]], XV, 264 n.1e); Chinese embassy in the Soviet Union, cable of June 29, 1960 to the Foreign Ministry, that the Soviet press said nothing of the *Renmin ribao* 人民日报 editorial of June 29 on the Bucharest meeting (cited by [[w.jianguo-yilai-mao-zedong]], XV, 265 n.1f); Ke Hua, Chinese ambassador in Guinea, at the Republic of Ghana''s founding ceremony, cable of July 2, 1960 to the Foreign Ministry, on President Nkrumah''s audience that day (cited by [[w.jianguo-yilai-mao-zedong]], XV, 265 n.1g). Names: Mao Zedong, Yang Shangkun, Jespersen, Wang Bingnan, Ke Hua, Nkrumah.'
