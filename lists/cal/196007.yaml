    tags: [ok:name-untagged]
  - id: cal.1960-07-05.soviet-union
    when: July 5
    date: '1960-07-05'
    place: kaprun
    thread: soviet-union
    c: 'Khrushchev, at the Kaprun dam, to correspondents: "Life is short ... I want to see the Red Flag fly over the whole world in my lifetime." By Bad Gastein to Villach.{1} He praises the dam''s engineers, builders and workmen. Furtseva, the Minister of Culture, is with him. He calls communism his "elixir of life." Kaprun was largely financed with United States aid funds, the *Times* reports.{2}'
    n: 'M. S. Handler, "Khrushchev Looks to Reds'' Triumph," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 15. Names: Khrushchev, Furtseva.'
    src:
      c: a9fd9001
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html: 1, 2'
    tags: [name:khrushchev-nikita-s, ok:fields-place, name:furtseva-yekaterina-a]
  - id: cal.1960-07-05.testing
    when: July 5
    date: '1960-07-05'
    place: geneva
    thread: testing
    c: 'Geneva, the test-ban talks'' 224th session. Tsarapkin accepts Wright''s plan of July 1 for the control organization: a directorate of six, the chief administrator and his principal deputy neutrals, two from each side. Wadsworth: the plan under sympathetic consideration; American approval expected within days.'
    n: '"Minor Gains Made at Test-Ban Talks," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html); Thomas J. Hamilton, "U.S. Said to Drop Plan for Session of U.N. Arms Body," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 6 (Tsarapkin accepts the plan; the American consideration). Names: Tsarapkin, Wadsworth.'
    tags: [ok:name-untagged, name:tsarapkin-semen-k, name:wadsworth-james-j]
  - id: cal.1960-07-05.elections-1960-los-angeles
    when: July 5
    date: '1960-07-05'
    place: los-angeles
    thread: elections-1960-los-angeles
    also: [medicare]
    c: 'Los Angeles. The Platform Committee opens four days of hearings, Bowles in the chair. Annis, for the American Medical Association, against medical care through Social Security; the plank "socialism." Butler: the convention not rigged.{1} Other witnesses: Bishop Gerald H. Kennedy of the Methodist Church for the National Council of Churches; Cecil E. Burney of Corpus Christi, Tex., for the American Bar Association. Nearly ninety are to appear. Butler predicts a platform without a major floor fight.{2}'
    n: 'Leo Egan, "Democrats Hear Ideas for Planks," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20. W. H. Lawrence, "Democratic Hopefuls Face Early Test on Voting Rule," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1 (the four days of hearings; the debate on Social Security; Butler''s prediction). Names: Bowles, Annis, Butler.'
    src:
      c: ee300de2
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html: 1, 2'
    tags: [name:bowles-chester, name:annis-edward-r, ok:name-untagged, ok:fields-time]
