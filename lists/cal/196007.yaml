    thread: elections-1960-nomination
    also: [press-and-broadcasting]
    c: Kennedy to answer Truman at his own news conference, the Roosevelt Hotel, New York, July 4. NBC, by Kintner's telegram, to carry it live, radio and television; CBS to tape it and use what it judges news; ABC portions.{1} The conference arranged by telephone from Hyannis Port; Sorensen flies in from the West Coast July 3; Shriver, Kennedy's brother-in-law, makes the arrangements, 100 seats for the press.{2}
    n: 'Clayton Knowles, "Kennedy Replies to Charge Today," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 4; Jack Gould, "TV: Battle of Unequals," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html). Reply: [[cal.1960-07-04.elections-1960]]. Names: Kennedy, Truman, Sorensen, Shriver.'
