    range_basis: kind
  - id: cal.1960-07-04.elections-1960-2
    when: July 4
    date: '1960-07-04'
    thread: elections-1960-los-angeles
    c: 'Los Angeles. India Edwards, for Johnson, with Connally: Kennedy has Addison''s disease and "would not be alive today if it were not for cortisone"; a public evaluation of his fitness. By her account, Johnson lashes out at her. The *Times* puts it on page 19.'
    n: '[[w.shesol-mutual-contempt]], 35; [[w.salinger-with-kennedy]], 40 (the press conference of Connally and India Edwards: Kennedy has Addison''s disease and might prove physically unfit; Johnson''s statement denying advance knowledge; not the words quoted, the *Times* or the day). Check: the day: [[w.salinger-with-kennedy]], 40, puts the Connally–Edwards press conference "on the first day of the convention" (July 11). To check: India Edwards oral history, LBJ Library; [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 19 (cited by [[w.shesol-mutual-contempt]], 35). Names: Connally, Kennedy, Johnson.'
    src:
      c: ed53a73a
      rows:
        - 'w.shesol-mutual-contempt 35: all'
        - 'via w.shesol-mutual-contempt 35 n.unspeakable: A-B'
        - 'w.salinger-with-kennedy 40: ?'
    tags: [name:connally-john, name:kennedy-john-f, name:johnson-lyndon-b]
    time_range:
      - 1960-07-04T16:00Z
      - 1960-07-05T00:00Z
    time_band: workday daytime
    time_zone: America/Los_Angeles
    range_basis: kind
  - id: cal.1960-07-04.robert-kennedy
    when: July 4
    date: '1960-07-04'
    thread: elections-1960-los-angeles
    follows:
      - cal.1960-07-04.elections-1960-2
    c: 'Robert Kennedy, at a press conference: his brother has no "ailment classically described as Addison''s disease"; any statement to the contrary "malicious and false." A doctors'' report: health "excellent." "I am confident that Senator Johnson will repudiate the irresponsible statements."'
    n: '[[w.shesol-mutual-contempt]], 35–36; [[w.thomas-robert-kennedy]], 97 (a press conference; a medical report on his brother''s health); [[w.sorensen-counselor]], 193 (at a convention press conference two of Johnson''s top aides question Kennedy''s life expectancy on the ground of Addison''s disease; the Kennedy for President press office issues a statement from Robert Kennedy that the candidate "does not now nor has he ever had an ailment described classically as Addison''s Disease, which is a tuberculous destruction of the adrenal gland"; not the day, the doctors'' report or "malicious and false"). Check: Thomas quotes the report''s word as "superb" (97). Answering Edwards: [[w.shesol-mutual-contempt]], 35–36. Check: Counselor, 193, has the statement come from the press office as Robert Kennedy''s, "does not now nor has he ever had an ailment described classically as Addison''s Disease, which is a tuberculous destruction of the adrenal gland"; the entry has him say it at a press conference, "ailment classically described as Addison''s disease.". To check: Myer Feldman oral history, JFK Library; [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html) (cited by [[w.shesol-mutual-contempt]], 35–36). See [[cal.1960-07-04.elections-1960-2]]. Names: Robert Kennedy, Kennedy, Johnson. Check: the day; Shesol: "a quick press conference."'
    src:
      c: ab1fd14c
      rows:
        - 'w.shesol-mutual-contempt 35–36: all'
        - 'w.thomas-robert-kennedy 97: A, C'
        - 'w.sorensen-counselor 193: ?'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1960-07-04.elections-1960-los-angeles
    when: July 4
    date: '1960-07-04'
    thread: elections-1960-los-angeles
    c: 'Los Angeles. Salinger with Kennedy and Robert Kennedy on the Connally–Edwards charge: they would ignore it as unworthy of a reply; Salinger urges a quick one, before the Republicans can repeat it. Kennedy''s physicians are reached and a medical statement agreed: an adrenal insufficiency under control for many years, which none of his doctors considers Addison''s disease. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 40–41. Check: the day (Salinger puts the Connally–Edwards press conference "on the first day of the convention," July 11; see [[cal.1960-07-04.elections-1960-2]], [[cal.1960-07-04.robert-kennedy]]). Names: Salinger, Kennedy, Robert Kennedy, Connally.'
    tags: [name:salinger-pierre, name:kennedy-john-f, name:kennedy-robert-f, name:connally-john]
