  - id: cal.1960-07-04.elections-1960-2
    when: July 4
    date: '1960-07-04'
    place: los-angeles
    thread: elections-1960-los-angeles
    c: 'Los Angeles. India Edwards, for Johnson, with Connally: Kennedy has Addison''s disease and "would not be alive today if it were not for cortisone";{1} a public evaluation of his fitness. By her account, Johnson lashes out at her. The *Times* puts it on page 19.{2} Edwards is co-chairman of Citizens for Johnson; Connally offers Johnson''s medical record.{3}'
    n: '[[w.shesol-mutual-contempt]], 35; [[w.salinger-with-kennedy]], 40 (the press conference of Connally and India Edwards: Kennedy has Addison''s disease and might prove physically unfit; Johnson''s statement denying advance knowledge; not the words quoted, the *Times* or the day). W. H. Lawrence, "Johnson Backers Urge Health Test," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). Check: the words: the *Times* has no "today." Check: the day: [[w.salinger-with-kennedy]], 40, puts the Connally–Edwards press conference "on the first day of the convention" (July 11). Check: the *Times* dates it July 4. Check: the page: 19 by [[w.shesol-mutual-contempt]], 35. To check: India Edwards oral history, LBJ Library. Names: Connally, Kennedy, Johnson.'
    src:
      c: f1548ee4
      rows:
        - 'w.shesol-mutual-contempt 35: 1, 2'
        - 'via w.shesol-mutual-contempt 35 n.unspeakable: 1'
        - 'w.salinger-with-kennedy 40: ?'
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html: 1, 3'
    tags: [name:connally-john, name:kennedy-john-f, name:johnson-lyndon-b]
    time_range:
      - 1960-07-04T16:00Z
