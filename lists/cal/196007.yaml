    when: July 4
    date: '1960-07-04'
    place: tunis
    thread: europe-and-the-alliance-france
    c: 'The Algerian Provisional Government, by communique, rejects the conditions France set at Melun for peace talks in Paris, "in effect a refusal to negotiate": its delegation, Abbas at its head, kept from all contact, even with Ben Bella and the other prisoners. Its acceptance of de Gaulle''s invitation stands; its envoys will return if the conditions are worked out by the two parties.{1} Paris is silent.{2}'
    n: 'Thomas F. Brady, "Algerians Balk at French Terms for Peace Talks," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 14, 15. Names: Abbas, de Gaulle.'
