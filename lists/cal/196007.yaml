    c: 'Khrushchev, in Moscow: "Soviet artillerymen can support the Cuban people with their rocket fire" if the Pentagon intervenes. Eisenhower, at Newport, R.I.: the United States will not "permit the establishment of a regime dominated by international Communism in the Western Hemisphere."'
    n: 'Statement by the President Concerning Premier Khrushchev''s Announcement of Support for the Castro Regime in Cuba, [1960–61 Pub. Papers 567](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=619). [FRUS 1958–60, VI, doc. 549](https://history.state.gov/historicaldocuments/frus1958-60v06/d549), quoting Khrushchev to the All-Russian Teachers'' Congress. See [[cal.1960-07-06.cuba-2]]. Names: Khrushchev, Eisenhower.'
    tags: [name:khrushchev-nikita-s, name:eisenhower-dwight-d]
