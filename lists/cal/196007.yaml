    c: 'Johnson, by telephone with Representative Thornberry, on the offer: if he refused and Kennedy lost, "they''ll blame me for it, and then my position as majority leader might be in jeopardy"; if Kennedy won, "they''ll say, ''He won without your help.''" Then: "I may owe a responsibility to try to carry this country for the Democratic party."'
    n: '[[w.mann-walls-of-jericho]], 277. To check: [[w.baker-wheeling-and-dealing]], 126; [[w.miller-lyndon]], 256 (cited by [[w.mann-walls-of-jericho]], 277). See [[cal.1960-07-14.elections-1960]]. Names: Johnson, Thornberry.'
