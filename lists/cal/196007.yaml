  - id: cal.1960-07-01.elections-1960
    when: July 1
    date: '1960-07-01'
    thread: elections-1960-nomination
    c: 'Georgetown, Kennedy''s house, at breakfast, by Clifford''s account. Kennedy: about 600 delegates of the 761 needed; would Symington withdraw before the first ballot and support him? "I''d like to talk with you about having him on the ticket." Symington''s answer, through Clifford: not while a deadlock is possible.'
    n: '[[w.clifford-counsel-to-the-president-2]], 314. Names: Kennedy, Clifford, Symington.'
    src:
      c: 5679aeaf
      rows:
        - 'w.clifford-counsel-to-the-president-2 314: all'
    tags: [name:kennedy-john-f, name:clifford-clark, name:symington-william-s]
    time_range:
      - 1960-07-01T10:00Z
      - 1960-07-01T16:00Z
    time_band: morning
    time_zone: America/New_York
  - id: cal.1960-07-01.soviet-union
    when: July 1
    date: '1960-07-01'
    thread: soviet-union
    also: [defense]
    c: 'An RB-47 out of a base in Britain, on a reconnaissance mission over the Barents Sea, shot down by the Soviet Air Force. Four of the crew killed, two taken. American intelligence: never nearer than thirty miles to Soviet airspace.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 290. To check: editorial note, FRUS 1958–60, X, pt. 1, 540–42 (cited by [[w.fursenko-khrushchevs-cold-war]], 290 n.87). Report: [[cal.1960-07-11.soviet-union]].'
    src:
      c: 36c28ae2
      rows:
        - 'w.fursenko-khrushchevs-cold-war 290: all'
        - 'via w.fursenko-khrushchevs-cold-war 290 n.87: all'
    short: the RB-47
  - id: cal.1960-07-01.elections-1960-rockefeller
    when: July 1
    date: '1960-07-01'
    thread: elections-1960-rockefeller
    also: [defense]
    c: 'Cabinet. Gates: his staff''s tentative figures put Rockefeller''s defense proposals closer to $10 billion. Eisenhower: Congress, in its present mood, would probably prefer the larger figure.'
    n: '[[w.watson-into-the-missile-age]], 769 (Rockefeller''s own estimate $3 billion). To check: handwritten notes of the Cabinet meeting, July 1, 1960, C-55 (2), Box 5, Cabinet ser., OSS files, WHO, DDEL (cited by [[w.watson-into-the-missile-age]], 769 n.171). See [[cal.1960-06-08.elections-1960]]. Names: Gates, Rockefeller, Eisenhower.'
    tags: [name:gates-thomas-s-jr, name:rockefeller-nelson, name:eisenhower-dwight-d]
  - id: cal.1960-07-01.latin-america-dominican-republic
    when: July 1
    date: '1960-07-01'
    thread: latin-america-dominican-republic
    c: 'CIA memorandum to Cabell, acting Director of Central Intelligence, prepared for King''s signature and signed by his deputy: an opposition leader asked Farland for arms, which presumably "would be used against key members of the Trujillo regime." It recommends 12 sterile rifles with telescopic sights and 500 rounds: "Approval for delivery of these arms has been given by Assistant Secretary of State Roy Rubottom."'
    n: '[[w.sen-church-alleged-assassination-plots]], 193 (the memorandum quoted). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA memorandum, July 1, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 193). See [[cal.1960-06.latin-america-dominican-republic]]. Names: Cabell, King, Rubottom, Trujillo.'
    tags: [name:cabell-charles-p, name:king-j-c, name:rubottom-roy-r-jr, name:trujillo-rafael]
  - id: cal.1960-07-01.latin-america-dominican-republic-2
    when: July 1
    date: '1960-07-01'
    thread: latin-america-dominican-republic
    c: 'CIA headquarters to Dearborn: the plan to airdrop 12 telescopically sighted rifles into the Dominican Republic. Can the dissidents realign the sights if the drop throws them off?'
    n: '[[w.sen-church-alleged-assassination-plots]], 194 (the cable; the rifles were never furnished). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to Dearborn, July 1, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 194). See [[cal.1960-07-01.latin-america-dominican-republic]].'
  - id: cal.1960-07-02.amendments
    when: July 2
    date: '1960-07-02'
    thread: amendments
    also: [women, congress]
    c: 'Senate takes up the equal rights amendment, S.J. Res. 69, on Johnson''s motion. Hayden''s rider adopted by voice: the article not to impair any rights, benefits or exemptions the law gives women. Then recommitted to Judiciary on Butler''s motion, Hayden agreeing. No roll call.'
    n: '[106 Cong. Rec. 15,678–79, 15,686](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt12/pdf/GPO-CRECB-1960-pt12-2-1.pdf) (1960). The Senate sat through the night of July 1 and adjourned at 8:33 a.m., July 2: [Daily Digest, 106 Cong. Rec. D432](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=430) (1960). Check: the hour on the Record''s pages; before midnight, the act is July 1''s. To check: [[w.kyvig-explicit-and-authentic-acts]]; [[w.harrison-on-account-of-sex]]. Names: Johnson, Hayden, Butler.'
    tags: [name:johnson-lyndon-b, name:hayden-carl, name:butler-john-m]
    short: the equal rights amendment recommitted
    time_range:
      - 1960-07-02T04:00Z
      - 1960-07-02T12:33Z
    time_zone: America/New_York
  - id: cal.1960-07-02.elections-1960-2
    when: July 2
    date: '1960-07-02'
    thread: elections-1960-nomination
    c: 'Truman''s televised press conference. His endorsement of Symington repeated; Johnson, Bowles, Meyner and six others added. The convention "prearranged ... mockery ... controlled ... by one candidate." To Kennedy: "are you certain that you are quite ready for the country, or that the country is ready for you"; "May I urge you to be patient?"'
    n: '[[w.sorensen-kennedy]], 151–52; [[w.clifford-counsel-to-the-president-2]], 321; [[w.wofford-of-kennedys-and-kings]], 49 (July 2, Truman on television against Kennedy; Symington, Johnson, Bowles, Meyner and "several others"; "be patient"; not the quotations or the number); [[w.odonnell-johnny-we-hardly-knew]], 201 (the televised press conference of July 2: Kennedy "too young" and "not quite ready," the convention "prearranged"; Symington, Johnson, Meyner and Bowles preferred, Stevenson "pointedly" excluded). To check: [*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html). Check: Clifford gives Kennedy''s answer ("If fourteen years in major elective office is insufficient experience ...") without its day. Reply: [[cal.1960-07-04.elections-1960]]. Names: Truman, Symington, Johnson, Bowles, Kennedy.'
    src:
      c: a2189c1e
      rows:
        - 'w.sorensen-kennedy 151–52: all'
        - 'w.clifford-counsel-to-the-president-2 321: all'
        - 'w.wofford-of-kennedys-and-kings 49: ?'
        - 'w.odonnell-johnny-we-hardly-knew 201: A'
    tags: [name:truman-harry-s, name:symington-william-s, name:johnson-lyndon-b, name:bowles-chester, name:kennedy-john-f]
    aliases: [cal.1960-07-02.elections-1960]
