    c: 'Beidaihe, the plenary session, Mao presiding.{1} Zhou Enlai on the experts'' recall ("to press us") and foreign trade: owed the Soviet Union, chiefly in grain, oil, meat and eggs, 1.6 billion rubles in trade and 0.7 billion in loans falling due, 2.3 billion next year.{2} Mao: pay it all next year if it can be done;{3} foreign trade to Zhou, Li Fuchun and Li Xiannian, with offices at the center and in the provinces.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, July 31, 1960; [[w.zhou-enlai-nianpu-1949]], II, 336, July 31, 1960 (Zhou''s report on Sino-Soviet relations); [[w.lengxi-shinian-lunzhan-1956-1966]], 337–338 (Zhou on the experts, the aid projects, trade and debt; the experts to be talked to by their unit heads, thanked, seen off warmly in small farewells, a large one later in Peking); [[w.yang-shangkun-riji]], I, 531 (July 31, 1960; 4 to 8 p.m.; Zhou on the Soviet recall of the experts and on foreign trade); [[w.deng-xiaoping-nianpu-1904]], III, 1569 (July 31, 1960; Deng at the work conference; Zhou on Sino-Soviet relations); [[w.mao-zedong-zhuan]], V, ch. 66 n.47 (July 31: Mao presiding, Zhou Enlai on the withdrawal of the experts and on foreign trade: the debts to the Soviet Union, half of China''s foreign trade, about 2.5 billion rubles, a point of the nation''s credit and of the fight with modern revisionism). [[w.jian-zhou-enlai]], 453 (July 31, at Mao''s request: the recall to "pressure us"; China to defend its honor and repay all its debts); [[w.peng-zhen-nianpu-1902]], IV, 48 (July 31, 1960; Peng Zhen at the plenary hearing Zhou on the experts'' withdrawal and trade with the Soviet Union); [[w.zhu-de-nianpu-xinbian]], III, 1780 (July 31, 1960; Zhu De 朱德 at the Politburo Standing Committee 中共中央政治局常委 meeting on grain, the frontier sciences and the note on the experts'' recall (by the book''s note: 1,390 experts recalled, 343 contracts and supplements and 257 projects of scientific and technical cooperation cancelled)). Made public: 1997. Check: Wu (337) has the Politburo at Beidaihe, before July 31, decide to repay in five years, Mao: not a ruble short ([[cal.1960-07.china-leadership]]). To check: Zhou Enlai 周恩来, speech at the Beidaihe Central Work Conference 北戴河中央工作会议, July 31, 1960 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.47); Zhou''s speech at the Beidaihe conference, July 31, 1960 (cited by [[w.jian-zhou-enlai]], 453 n.44a); [[w.xianzhi-mao-z