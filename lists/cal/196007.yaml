    n: 'Tad Szulc, "Ex-Cuban Premier Quits Regime and Asks Asylum," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 3. The Foreign Ministry''s answer, that afternoon, is entered apart ([[cal.1960-07-05.cuba-6]]). Names: Miró Cardona, Dorticós.'
