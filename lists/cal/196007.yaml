  - id: cal.1960-07-13.elections-1960-los-angeles-4
    when: July 13
    date: '1960-07-13'
    thread: elections-1960-los-angeles
    c: 'Los Angeles, the Biltmore, Kennedy''s suite, before the balloting. Hawaii delegates, some in Stevenson hats, tell him their caucus gave Stevenson 3½ votes, Johnson 3, Kennedy 1½. Kennedy, "for the first time that week," chastises a delegation: neither Stevenson nor Johnson can win; he ticks off New York, Pennsylvania, Illinois and Ohio on his fingers.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 208 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Stevenson, Johnson.'
