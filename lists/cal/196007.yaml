    when: July 4
    date: '1960-07-04'
    place: los-angeles
    thread: elections-1960-los-angeles
    c: J. Leonard Reinsch, the convention's director, reports rooms found for all who asked, both rival delegations from Puerto Rico among them; the police to open command posts at the Biltmore and the Sports Arena.
    n: Gladwin Hill, "Democrats Open Hearings Today on Platform Issues," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 23.
