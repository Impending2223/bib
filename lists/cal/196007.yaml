    tags: [ok:name-untagged]
  - id: cal.1960-07-05.elections-1960-3
    when: July 5
    date: '1960-07-05'
    place: oklahoma
    thread: elections-1960
    also: [congress]
    c: 'Oklahoma Democratic primary for Senator. Kerr renominated for a third term over Thomas Dunn, 87,784 to 17,681, 78.5 percent; D. R. Condo 6,331: 1,146 of 3,220 precincts, unofficial. House: in the Sixth District, Wickersham, a former Representative, leads Toby Morris, the incumbent; Edmondson, Jarman and Steed win; Albert and Belcher unopposed. Republican Senate primary: Crawford leads Hyde.'
    n: '"Kerr Wins Oklahoma Primary; One Incumbent in Hard Race," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (all but the percent). Check: the official returns (the State Election Board). See [[cal.1960-07-05.state-constitutions-ok]]. Names: Kerr, Wickersham, Edmondson, Jarman, Steed, Albert.'
    tags: [state:ok, name:kerr-robert-s, name:wickersham-victor-e, name:edmondson-edmond-a, name:jarman-john, name:steed-thomas-j, name:albert-carl]
