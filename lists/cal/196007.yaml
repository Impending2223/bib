    time_zone: Africa/Tunis
    range_basis: record
  - id: cal.1960-07-05.cyprus
    when: July 5
    date: '1960-07-05'
    place: nicosia
    thread: cyprus
    c: 'Cyprus''s Council of Ministers sets the elections: the House of Representatives July 31, the Greek and Turkish Communal Chambers Aug. 7.{2} It also approves an amendment to the electoral law for two more members of the Greek Communal Chamber, one Armenian, one Maronite.{4} Britain is to keep two bases, ninety-nine square miles, the *New York Times* reports.{3}'
    cut_from:
      '2': '1'
      '3': '1'
    n: Lawrence Fellows, "Cyprus Will Vote July 31 and Aug. 7," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) (not the bases); "Britain Keeps 99 Miles," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) (the bases). The bargain with A.K.E.L. is entered apart ([[cal.1960-07-05.cyprus-2]]).
    src:
      c: 698d42db
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html: 2, 4, 3'
