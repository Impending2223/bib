withdrawn in July and early August); [[w.pleshakov-nikita-khrushchev-and-sino]], 239 (the advisors and technicians withdrawn in August); [[w.brothers-in-arms]], 362 (Chen Yi to Chervonenko, Aug. 4, 1960: the Chinese told July 16; some 1,400 to 1,500 specialists); [[w.brothers-in-arms]], 381 (Deng Xiaoping''s speech of July 8, 1963, in the Soviet record: on July 16 the Soviet side decided to withdraw over 1,300 specialists between July 28 and Sept. 1; over 900 recalled from business trips; contracts and agreements broken); [[w.peng-zhen-nianpu-1902]], IV, 46 (July 16, 1960; Sudarikov, the Soviet chargé d''affaires, hands Zhang Hanfu, Vice Foreign Minister, the Soviet government''s note recalling its experts and advisers, the military among them); [[w.peng-zhen-nianpu-1902]], IV, 46–47 (on July 25, 1960, without waiting for China''s answer, the Soviet side gives notice that all its experts will leave between July 28 and Sept. 1; the page''s note: from July 28 to Sept. 1, 1,390 experts recalled, over 900 not sent, 343 contracts and supplements torn up, 257 scientific and technical projects ended); [[w.friedman-shadow-cold-war]], 52 (Khrushchev suddenly decides to remove all Soviet specialists from the PRC; Peking notified "two days after the conclusion of the plenum"); [[w.guan-vietnamese-communists-relations-with]], 150 (the Chinese told July 16, the Central Committee in session July 5–Aug. 10: 1,390 experts recalled without consultation, 343 contracts and 257 projects of scientific and technical cooperation ended, the blueprints taken home); [[w.chang-friends-and-enemies]], 216 (in July Khrushchev orders all Soviet technicians and advisers withdrawn and ends hundreds of agreements and contracts; almost 1,400 specialists leave, taking blueprints and plans); [[w.chen-yun-nianpu-xiuding]], III, 40 (the nianpu''s note: the Soviet note of July 16 recalling the experts; from July 28 to Sept. 1 all 1,390 Soviet experts in China withdrawn, more than 900 not sent, 343 contracts and supplements and 257 projects of scientific and technical cooperation torn up); [[w.peng-zhen-nianpu-1902]], IV, 46; [[w.lengxi-shinian-lunzhan-1956-1966]], 335; [[w.yang-jisheng-mubei]], II, 1171; [[w.peng-zhen-nianpu-1902]], IV, 47 n.1. Washington''s knowledge: [FRUS 1958–60, XIX, doc. 348](https://history.state.gov/historicaldocuments/frus1958-60v19/d348) (State''s Bureau of Intelligence and Research, Aug. 26: "an unusual exodus of Soviet technicians" reported from Peking since Aug. 12; 2,000 to 3,000 in China in all; "no firm evidence" yet that it is tied to the dispute). Check: the day: Wu (335, 338) has the note handed July 16, as the Mao nianpu. Check: [[w.westad-introduction]], 25, has the Soviet government inform Liu Shaoqi, not Zhang Hanfu; [[w.friedman-shadow-cold-war]], 52, has Peking notified "two days after the conclusion of the plenum.". To check: [[w.bianjibu-dangdai-zhongguo-waijiao]], 116–19 (cited by [[w.jian-maos-china-and-the]], 82 n.158a); [[w.jin-1949-1989-niande-zhongguo]], 364 (cited by [[w.jian-maos-china-and-the]], 82 n.158b); Chen Jian, "A Crucial Step toward the Breakdown of the Sino-Soviet Alliance," *Cold War International History Project Bulletin*, nos. 8–9 (1996–97), 246, 249–50 (cited by [[w.jian-maos-china-and-the]], 82 n.158); [[w.sino-soviet-dispute]], 174–205 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.17a); [[w.macfarquhar-origins-of-the-cultural]], II, 264–292 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.17b); Letter of recall, in Russian and Chinese, Ministry of Foreign Affairs Archives, Peking, July 16, 1960, 109-924-1, pp. 4–8 (cited by [[w.dikotter-maos-great-famine]], 105 n.5); Soviet embassy''s note to the Chinese Foreign Ministry about recalling all Soviet experts in China, July 16, 1960 (cited by [[w.jian-zhou-enlai]], 453 n.43); Report of Frol Kozlov at CC CPSU plenum, July 7, 1960, RGANI f.2 o.1 d.458, 65 (cited by [[w.friedman-shadow-cold-war]], 52 n.106); [[w.zong-huaiwen-years-of-trial-tur