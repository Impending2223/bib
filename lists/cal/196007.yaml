  - id: cal.1960-07-05.middle-east
    when: July 5
    date: '1960-07-05'
    place: buenos-aires
    thread: middle-east
    also: [latin-america, jewish-diaspora]
    c: 'Israel, by a note handed in at Buenos Aires by its ambassador, Levavi, asks Argentina to consider the Eichmann case closed: its apology, with the Security Council''s resolution, "adequate reparation." Argentina''s demand for his return tacitly rejected.'
    n: '"Argentina Asked to End Nazi Case," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 8. Check: the hour.'
    tags: [ok:fields-time]
  - id: cal.1960-07-05.cuba
    when: July 5
    date: '1960-07-05'
    place: havana
    thread: cuba
    also: [oil]
    c: 'The United States'' note, delivered by Bonsal to the Cuban Foreign Ministry: the seizure of the Texaco and Esso refineries arbitrary, inequitable, without authority under Cuban law, contrary to Cuba''s commitments; "a violation of accepted standards of ethics and morality"; it asks the seizure rescinded.{2} The note answers Guevara''s reading of the Mineral Fuel Law of 1938: the article applies only to oil from Cuban soil; the refineries were built under Law Decree 1758 of Nov. 2, 1954, which requires them to refine no Government crude.{4} More than $50,000,000 owed the companies.{3}'
    cut_from:
      '2': '1'
      '3': '1'
    n: '"Text of U.S. Protest to Cuba on Refinery Action," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 2; William J. Jorden, "U.S. Files Protest on Cuban Seizure of Oil Refineries," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 2. Names: Bonsal, Guevara.'
    src:
      c: 5cd7e6c9
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html: 2, 4, 3'
    tags: [name:bonsal-philip-w, name:guevara-ernesto]
  - id: cal.1960-07-05.cuba-2
    when: July 5
    date: '1960-07-05'
    place: washington
    thread: cuba
    c: Agriculture halts new imports of Cuban sugar pending the President's action under the new act.{1} Cuba's quota for the year is 3,119,655 tons, about 740,000 not yet received, the *Times* reports.{2}
    n: 'William J. Jorden, "U.S. Files Protest on Cuban Seizure of Oil Refineries," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 2. Split under R17: the White House''s word on the signing and the State Department''s announcement of the Advisory Committee''s meeting, in the same story, are entries of their own. Law: [[cal.1960-07-06.cuba-2]].'
    src:
