  - id: cal.1960-07-04.elections-1960
    when: July 4
    date: '1960-07-04'
    thread: elections-1960-nomination
    c: 'New York. Kennedy''s televised press conference, the reply to Truman, drafted with Sorensen at Hyannis Port: if "fourteen years in major elective office is insufficient experience," that rules out every President of the century; an age test would have kept "Christopher Columbus from even discovering America." "If the people of this nation select me to be their President, I believe that I am ready."'
    n: '[[w.sorensen-kennedy]], 152–53; [[w.wofford-of-kennedys-and-kings]], 49–50 (July 4, Kennedy''s reply: the age test "would have kept Jefferson from writing the Declaration ... and Christopher Columbus from even discovering America"; fourteen years in office rules out "all but three of the ten names" and every President of the century; not the press conference, New York or Sorensen); [[w.odonnell-johnny-we-hardly-knew]], 201–02 (Kennedy asked for equal time and replied on the Fourth: Truman''s open convention one that "studies all the candidates, reviews their records, and then takes his advice"; fourteen years in the House and the Senate more experience than any twentieth-century President had when elected; at forty-three older than Washington, Jefferson and Columbus; not the entry''s quotations); [[w.sorensen-counselor]], 182–83 (Truman''s denunciation; Sorensen summoned to Hyannis Port from Los Angeles; the reply on national television, with Jefferson, Columbus and Alexander the Great from Sorensen''s file of young achievers; the notes typed on the porch by Mrs. William Battle; Sorensen''s account, written in 2008; not the day or the quotations); [[w.sorensen-counselor]], 134 (the closing, a quotation of Lincoln suggested by the historian James MacGregor Burns, "on the eve of the 1960 Democratic National Convention," for the speech in answer to Truman; no other historian could find that Lincoln had said the words; Sorensen''s account, written in 2008; not the words quoted). Check: Wofford, 50, has Kennedy answer Truman''s question "are you certain that you are ready?" with Lincoln''s reply: "I see the storm coming and I know His hand is in it. If He has a place and work for me, I believe that I am ready.". See [[cal.1960-07-02.elections-1960-2]]. Names: Kennedy, Truman, Sorensen.'
    src:
      c: 50b1ec60
      rows:
        - 'w.sorensen-kennedy 152–53: all'
        - 'w.wofford-of-kennedys-and-kings 49–50: C'
        - 'w.odonnell-johnny-we-hardly-knew 201–02: ?'
        - 'w.sorensen-counselor 182–83: ?'
        - 'w.sorensen-counselor 134: ?'
    tags: [name:kennedy-john-f, name:truman-harry-s, name:sorensen-theodore-c]
    time_range:
      - 1960-07-04T13:00Z
      - 1960-07-04T21:00Z
