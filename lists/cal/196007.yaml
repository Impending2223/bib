    when: July 5
    date: '1960-07-05'
    place: washington
    thread: elections-1960-nixon
    also: [jewish-diaspora]
    c: 'Nixon, by telegram to Bernard Abrams, national commander of the Jewish War Veterans, repudiates the support George Lincoln Rockwell, of the American Nazi party, reportedly voiced for him: "I completely repudiate him and the evil he represents."'
    n: '"Nixon Hits Rockwell," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). Names: Nixon.'
    tags: [name:nixon-richard-m, ok:name-untagged, ok:fields-place]
  - id: cal.1960-07-05.voting-rights
    when: July 5
    date: '1960-07-05'
    place: washington
    thread: voting-rights
    c: 'Eisenhower signs the Stella, Mo., school bill, the vehicle of the Senate''s civil rights debate: the district pays $1,500 for the use of the Fort Crowder barracks.'
    n: '"Stella Bill Signed," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). To check: the act''s Statutes at Large cite. See [[cal.1960-02-15.voting-rights]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, state:mo]
  - id: cal.1960-07-05.desegregation-schools
    when: July 5
    date: '1960-07-05'
    place: baton-rouge
    thread: desegregation-schools
    c: 'Davis, after meeting Gremillion and the Orleans Parish School Board: New Orleans'' schools "will continue to operate on a segregated basis," despite Judge Wright''s order of May to integrate the first grades in September.'
    n: '"Gov. Davis Is Firm," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). Names: Davis, Wright.'
    tags: [name:davis-jimmie-h, state:la, city:baton-rouge, ok:name-untagged, name:wright-j-skelly]
  - id: cal.1960-07-05.elections-1960-nomination
    when: July 5
    date: '1960-07-05'
    place: nyc
    thread: elections-1960-nomination
    follows:
      - cal.1960-07-05.elections-1960-nomination-12
    c: 'Wagner, chairman of the New York delegation, at a City Hall news conference: the delegation not rigged, no unit rule; he would "like to see young men get a chance."{1} Asked about Truman''s charge of a rigged convention, Wagner says Truman has "every right" to his opinion. Too busy to visit the Stevenson headquarters; Stevenson "an old and good friend." More than 100 of the delegation''s 114 votes are indicated for Kennedy, the *Times* reports.{2}'
    n: '"Wagner Denies State Delegation Is Rigged to Favor Kennedy," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). Split under R17: the Stevenson pickets at City Hall, in the same story, are an entry of their own. The order: the pickets came first. See [[cal.1960-07-02.elections-1960-2]]. Names: Wagner, Truman, Stevenson, Kennedy.'
    src:
      c: 741f687b
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html: 1, 2'
    tags: [name:wagner-robert-f-jr, name:truman-harry-s, name:stevenson-adlai-e, name:kennedy-john-f]
