    c: 'Yun Po-sun promulgates the Illicit Wealth Disposition Law, Law 623, Chang Do-young, Paek Sŏn-jin and Ko Wŏn-jŭng countersigning. Officials and politicians who amassed 50 million hwan or more by their posts from July 1, 1953 to May 15, 1961; businessmen who gained 100 or 200 million or more, by the kind of gain, from state property, loans, contracts, purchases abroad or unpaid taxes, and those who sent property abroad: their gains forfeit.'
