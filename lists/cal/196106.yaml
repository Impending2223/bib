  - id: cal.1961-06-02.china
    when: June 2
    date: '1961-06-02'
    thread: china
    c: 'Paris, the press luncheon. Asked how Communist China can normalize relations with the West: "we desire peace and we desire to live in amity with the Chinese people"; the attacks on the United States since before he took office "constant, immediate, and in many cases malevolent." "But it takes two to make peace." No evidence of it today.'
    n: 'Remarks and Question and Answer Period at the Press Luncheon in Paris, [1961 Pub. Papers 429](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=487) (June 2, 1961), at 436. [[w.sorensen-kennedy]], 665 (the answer, quoted). See [[cal.1961-05-31.berlin-and-vienna]]. Names: Kennedy.'
    src:
      c: 7c3b70ae
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=487: all'
        - 'w.sorensen-kennedy 665: B, D'
    tags: [name:kennedy-john-f]
  - id: cal.1961-06-03.berlin-and-vienna
    when: June 3–4
    date: '1961-06-03'
    thread: berlin-and-vienna
    c: 'Vienna summit. Khrushchev hands over an aide-mémoire: a German peace treaty within six months, and an end to Western rights in Berlin. Kennedy to Reston afterward: the worst thing in his life. Laos the only agreement.'
    n: 'FRUS 1961–63, V, docs. [83](https://history.state.gov/historicaldocuments/frus1961-63v05/d83)–[89](https://history.state.gov/historicaldocuments/frus1961-63v05/d89); XIV, docs. [32](https://history.state.gov/historicaldocuments/frus1961-63v14/d32), [33](https://history.state.gov/historicaldocuments/frus1961-63v14/d33) (the memoranda of conversation); XXIV, docs. [107](https://history.state.gov/historicaldocuments/frus1961-63v24/d107), [108](https://history.state.gov/historicaldocuments/frus1961-63v24/d108) (Laos). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 150–51 (the meeting; the aide-mémoire, a treaty by December); [[w.schulimson-joint-chiefs-of-staff]], 87 (Laos the only agreement); [[w.rusk-as-i-saw-it-1990]], 220–21 (the summit; Berlin; the aide-mémoire; Laos); [[w.sorensen-kennedy]], 543–50 (the summit; the aide-mémoire); [[w.fursenko-khrushchevs-cold-war]], 360–64 (the garden walk; three inspections a year, a veto; the aide-mémoire; "Then it will be a cold winter"); [[w.dobrynin-in-confidence]], 45–47 ("the most tense"; a treaty with East Germany "not later than in December"; three inspections a year; by Dobrynin''s account); [[w.sorensen-kennedy]], 646–47 (Laos at Vienna: a verified cease-fire, a neutral and independent Laos; Rusk and Gromyko to be locked in a room). [[w.schlesinger-thousand-days-1965]], 358–74. [[w.reeves-president-kennedy]], 156–72 (the talks; the aides-mémoire; Reston). [[w.fursenko-one-hell-of-a]], 129–31 (the talks, Berlin and the treaty by December; Laos). Check: Dobrynin dates the summit July 3–4 (44–45). To check: [[w.beschloss-crisis-years]]; [[w.kempe-berlin-1961]]; [[w.catudal-kennedy-and-the-berlin]]; [[w.harrison-driving-the-soviets-up]]; [[w.wilke-der-weg-zur-mauer]]; [[w.prezidium-tsk-kpss-1954]]; [[w.khrushchev-vremya-lyudi-vlast]]; [[w.thompson-kremlinologist]]; [[w.bohlen-witness-to-history-1929]]; [[w.reston-deadline]]. Names: Khrushchev, Gromyko, Menshikov, Thompson, Kohler, Reston.'
