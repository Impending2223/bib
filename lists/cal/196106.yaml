    when: June 7
    date: '1961-06-07'
    thread: opinion
    also: [defense]
    c: 'Gallup, May 17–22: ahead in long-range missiles, the United States 54 percent, Russia 20.'
    n: '[[w.gallup-poll]], III, 1720.'
  - id: cal.1961-06-07.opinion-2
    when: June 7
    date: '1961-06-07'
    thread: opinion
    also: [cuba]
    c: 'Gallup, Apr. 28–May 3: no trade with Cuba while Castro holds power, 63 percent agree, 23 disagree. Aid to the anti-Castro forces, 44 agree, 41 disagree. American forces into Cuba, 24 agree, 65 disagree.'
    n: '[[w.gallup-poll]], III, 1721. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1961-06-07.defense-soviet-forces
    when: June 7
    date: '1961-06-07'
    thread: defense-soviet-forces
    c: NIE 11-8-61, Soviet Capabilities for Long Range Attack; FRUS prints its annex on the ICBM program. Two to four ICBM sites probably begun in 1957–59, probably operational now. Army and Navy intelligence dissent.
    n: '[FRUS 1961–63, VIII, doc. 29](https://history.state.gov/historicaldocuments/frus1961-63v08/d29). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
    tags: [name:dulles-allen-w]
  - id: cal.1961-06-07.program
    when: June 7
    date: '1961-06-07'
    thread: program
    c: 'Youth employment bill to Congress: three years of pilot programs for those 16 to 22, on-the-job training, a Youth Conservation Corps, and public service work where they live. The corps 6,000, the other programs 50,000.'
    n: 'Letter to the President of the Senate and to the Speaker of the House on Youth Employment Opportunities and Training, [1961 Pub. Papers 449](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=507) (June 7, 1961). [[w.sundquist-politics-and-policy]], 133 (the numbers). See [[cal.1961-01.program]]. Names: Kennedy.'
