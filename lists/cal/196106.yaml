    tags: [name:harriman-w-averell, name:kennedy-john-f]
  - id: cal.1961-06-01.berlin-and-vienna
    when: June 1
    date: '1961-06-01'
    place: versailles
    thread: berlin-and-vienna
    c: 'Versailles, the dinner in the Hall of Mirrors. Harriman, placed three seats from Kennedy through Eunice Shriver, on Khrushchev: do not let him rattle you; laugh, don''t fight.'
    n: '[[w.reeves-president-kennedy]], 152–153. Check: the day; Reeves: "That night," after the embassy. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Harriman, Kennedy, Khrushchev.'
    src:
      c: 4fb86f52
      rows:
        - 'w.reeves-president-kennedy 152–153: all'
    tags: [name:harriman-w-averell, name:kennedy-john-f]
  - id: cal.1961-06-01.laos
    when: June 1
    date: '1961-06-01'
    thread: laos
    also: [robert-kennedy]
    c: 'Robert Kennedy, in a memorandum: but for Cuba, "we would have sent troops to Laos," and probably had them destroyed; after Cuba the President found the Communists could send five men for every one of ours, cut off the airports, and that the only way to win was the atomic bomb, a major war with China and Russia.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 702. To check: Robert Kennedy, memorandum dictated June 1, 1961, 3, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 702 n.7). See [[cal.1961-04-29.cuba-bay-of-pigs]]. Names: Robert Kennedy.'
    src:
      c: f0e8a54e
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 702: all'
        - 'via w.schlesinger-robert-kennedy-and-his 702 n.7: all'
    tags: [name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1961-06-01.latin-america-dominican-republic
    when: June 1
    date: '1961-06-01'
    thread: latin-america-dominican-republic
    c: 'Robert Kennedy dictates four pages of notes on the Dominican Republic: "The great problem now is that we don''t know what to do because we don''t (sic) what the situation is and this shouldn''t be true, particularly when we have known that this situation was pending for some period of time."'
    n: '[[w.sen-church-alleged-assassination-plots]], 214–15 (the notes quoted; the report finds no concern in them for the propriety of the American part; a State memorandum for the files of June 1 records the meetings of the days after the killing, with Kennedy, Johnson, Rusk, McNamara and Robert Kennedy). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Notes dictated by Robert F. Kennedy, June 1, 1961; State Department memorandum for the files, June 1, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 215). See [[cal.1961-05-30.latin-america]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f]
