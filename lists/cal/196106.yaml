    also: [china]
    c: 'Zhou Enlai at the joint meeting of the Propaganda Department''s literary and art symposium and the Culture Ministry''s film conference criticizes "left" thinking in arts work: "free the mind, break superstition, dare think, speak and act"; a democratic atmosphere; first change the style of cadres, leading cadres, "beginning with us few"; let others differ; no "putting on hats" and clubs. He treats the dialectic of material and spiritual production, class struggle and united front, whom and how to serve, art''s laws, heritage and creation, leadership and the masses, and asks them to criticize his talk as a "live target."'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 417 (June 19, 1961); [[w.macfarquhar-origins-of-the-cultural]], III, 114–116 (Zhou''s "impromptu remarks," prepared in two days: against judging and labelling by fixed patterns; the 1956 policies on intellectuals stand); [[w.macfarquhar-origins-of-the-cultural]], III, 241 (Zhou''s remarks of June 1961 on his 1959 speech: not everything he said then was right, and he was uneasy that it drew no response); [[w.chen-yun-nianpu-xiuding]], III, 94 (Zhou on Chen Yun: his view is reasonable; he is weak and very tired and needs another setting to rest in, listening to pingtan 评弹, so as to do more for the Party; pingtan teaches too; Zhou prefers the northern quyi, the Suzhou dialect being hard for him, but each takes what he needs; art replaced by politics is no art). Made public: 1997. To check: [[w.selected-works-of-zhou]], 2, 333, 353 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 114 n.130a); Zhou Enlai, speech of June 19, 1961, in [[w.selected-works-of-zhou]], 332 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 241 n.50). Names: Zhou Enlai.'
