  - id: cal.1961-06-12.china-leadership-2
    when: June 12
    date: '1961-06-12'
    thread: china-leadership
    also: [farm]
    c: 'At the Central Work Conference Zhou Enlai explains again the revised "Nine measures on grain": the title to read "The Central Work Conference''s nine measures to reduce the town population and cut town grain sales"; he adds "increase village labor, develop the village economy" to the three lines, and "cut the town population by over 20 million in three years, at least 10 million this year," and "for the next three to five years low standard, vegetables and melons for grain." The conference adopts them; the Center issues them June 16.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 416 (June 12, 1961); [[w.yang-shangkun-riji]], II, 41 (June 12, 1961; Zhou on rural grain and cutting staff at the closing plenary, after Mao and Li Fuchun). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1961-06-12.china-leadership-3
    when: June 12–16
    date: '1961-06-12'
    place: peking
    thread: china-leadership
    also: [vietnam-hanoi, china]
    c: 'Zhou Enlai, June 12–16, receives Phạm Văn Đồng, Premier of the DRV. At the welcome banquet on the 12th: the American government''s and Ngô Đình Diệm clique''s "eight measures" to control and enslave South Vietnam are a plan for a war adventure there; the Chinese government and people cannot be indifferent to the worsening situation. After the talks the two premiers'' joint communiqué of the 15th holds America''s "position of strength" and neo-colonial policy to be the chief threat to peace and source of tension and repeats that disputes be settled by peaceful negotiation.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 416 (June 12, 1961); [[w.zhou-enlai-waijiao-huodong]], 313 (June 12, 1961; 晚上, 人民大会堂; state banquet); [[w.lengxi-shinian-lunzhan-1956-1966]], 453 (Phạm Văn Đồng invited in June); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 526 (June 12–15, 1961; June 12 Liu, with Soong Ching-ling, Dong Biwu, Zhu De and Zhou Enlai, meets the DRV government delegation under Phạm Văn Đồng, premier; Liu: shortcomings and errors in work, joined to two years of calamity, have added to the losses; this makes China careful, and makes cadres and leaders clear-headed, not muddled; the slogan is that cadres must know the laws of socialist economic development); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 197 (June 10–16, 1961; Phạm Văn Đồng leads the DRV government delegation; Mao and Liu receive him and the members; the joint communique signed by the two premiers: the two countries will work unceasingly for peace in Asia and the world; both governments will do their utmost to stop the United States'' wrecking of the Geneva conference; China firmly backs the Vietnamese people''s demand for peaceful reunification, and Vietnam fully backs China''s just stand on liberating Taiwan); [[w.peng-zhen-nianpu-1902]], IV, 133 (June 12, 1961, evening; Peng Zhen at Zhou''s banquet for Phạm Văn Đồng); [[w.guan-vietnamese-communists-relations-with]], 196–197 (the afternoon of the 12th, Liu Shaoqi; talks with Zhou, Li Fuchun, Luo Ruiqing, Luo Guibo, Fang Yi, He Wei; Liu''s reception, Zhou''s banquet, a party of the friendship association and the Ministry of Culture, Peking opera. The joint communiqué before the farewell banquet: "complete identity of views"; China for the DRV against American interference and for Vietnam''s peaceful unification; the South''s struggle against American aggression and Diệm a sacred right). Made public: 1993. The time is the first day''s. To check: NCNA, 12 June 1961, SWB/FE/664/A3/1 (cited by [[w.guan-vietnamese-communists-relations-with]], 196 n.63); NCNA, 16 June 1961, SWB/FE/668/A3/1-3 (cited by [[w.guan-vietnamese-communists-relations-with]], 197 n.65a); Peking Review IV, no. 24, June 16, 1961, 6–8 (cited by [[w.guan-vietnamese-communists-relations-with]], 197 n.65b). Names: Zhou Enlai, Phạm Văn Đồng.'
