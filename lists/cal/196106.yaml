  - id: cal.1961-06-06.china-leadership-12
    when: June 6
    date: '1961-06-06'
    place: peking
    thread: china-leadership
    c: 'Peking 北京. Zhu De 朱德, at the Central Work Conference 中共中央工作会议, on farming and cutting the town population: the conference has found a good way with grain, quotas fixed below with a margin, so that output grows and the peasants have hope; grain to the household, members cooking for themselves, saves grain; the buying of farm and side products too rigid and too narrow, and its prices unreasonable, the year''s fruit crop up but little of it bought; two years of wheat and rice for the cities, which clash in the south, so some coarse grains to be grown; draft animals and tools lost, the forces of production damaged; the market towns'' smiths and masons to be organized fast to help the peasants set up house; the villages to take in the 20 or even 30 million sent down from the towns, a great political task, ownership to be set right and those sent down well settled, or there will be trouble in town and country.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1806–1807. See [[cal.1961-05-21.china-leadership]]. Made public: 2016. Names: Zhu De.'
    tags: [polity:prc, name:zhu-de, vis:only:prc]
  - id: cal.1961-06-06.china-leadership-13
    when: June 6
    date: '1961-06-06'
    place: peking
    thread: china-leadership
    c: 'Peking 北京. Chen Yun 陈云 speaks to the Central Work Conference 中共中央工作会议: after the summer harvest the provinces must buy more, since the Center 中央 must send grain to the Northeast 东北, or people will die in the stricken areas, and against accidents (late ships, floods on the railways, empty stores) the southern provinces to lend grain till autumn; fixed output quotas rouse the peasants, but even overfulfillers will eat less than in past years; steel for farm tools as compensation, made locally at the old handicraft forges, not in batches by the farm-machinery departments; Li Fuchun 李富春 is right that heavy industry must retreat far enough to meet farming''s and the market''s needs, but the Center, the regional bureaus and each province should first set up a group to rank industry''s measures of support.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 92–93. The words: 上午 (92–93). Made public: 2005 ([[w.chen-yun-wenji]], where the nianpu says it is printed). To check: [[w.chen-yun-wenji]], III. Names: Chen Yun, Li Fuchun.'
    tags: [polity:prc, name:chen-yun, name:li-fuchun, vis:only:prc]
