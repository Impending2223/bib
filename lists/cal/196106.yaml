    thread: china-leadership
    also: [farm]
    c: 'Deng Xiaoping 邓小平 speaks at the plenary of the Central Work Conference, Liu Shaoqi 刘少奇 presiding, on grain: shipments in and out now fixed for the provinces, and below; fixed quotas spur the peasants, but each place to plan, drawing on rich brigades, a loan in real need; this year''s trouble, if any, in the cities, graver than deaths in the villages; ten million fewer in the towns, quickly; low rations and "melons and greens for grain" kept; room to spare.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1643–1644 (June 6, 1961); [[w.peng-zhen-nianpu-1902]], IV, 132 (June 6, 1961, morning; Peng Zhen at the plenary on Zhou''s nine measures on grain: grain contracts flexible, lest the Party break faith after autumn; imported grain not to be counted on, foreign exchange spent on it crowding out alloy steel; the farms short of labor not, but of the Sixty Articles carried out; industry overstaffed, one mine designed for 2,000 now 11,000; Deng interjects: hold down staff and the wage bill; the 21 million industrial workers alone cannot give the cut; cutting people will anger heaven and men, but must be done). The words: 上午 (III, 1643). Deng: 城市一旦出了问题，那比农村死人问题更严重 (III, 1644). Made public: 2009 (the nianpu). See [[cal.1961-06-06.china-leadership-5]]. Names: Deng Xiaoping, Liu Shaoqi.'
