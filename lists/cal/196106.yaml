    thread: china-leadership
    also: [laos]
    c: 'The PLA *Bulletin of Activities* no. 22 carries "The Plan and Strategy of the United States, Britain and France with respect to the Laotian Question": the Americans using the talks and the cease-fire to gain time, build up Phoumi Nosavan, and wait to resume the assault on the Pathet Lao and the neutralists.'
    n: '[[w.guan-vietnamese-communists-relations-with]], 194 n.56. Made public: 1966 ([[w.politics-of-the-chinese]]). To check: "The Plan and Strategy of the United States, Britain and France with respect to the Laotian Question," distributed with the PLA Bulletin of Activities no. 22, June 1, 1961 (cited by [[w.guan-vietnamese-communists-relations-with]], 194 n.56b). Names: Phoumi Nosavan.'
