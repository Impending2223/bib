    c: 'Vienna, the embassy, ten minutes after Khrushchev, the blinds drawn. Kennedy to Reston of the *Times*: "Worst thing in my life. He savaged me." "He thinks because of the Bay of Pigs that I''m inexperienced." Then: "I''ll have to increase the defense budget. And we have to confront them. The only place we can do that is in Vietnam. We have to send more people there." By Reston''s account.'
    n: '[[w.reeves-president-kennedy]], 172–73; [[w.dobrynin-in-confidence]], 46 (Kennedy with Reston right after the meeting; Reston''s article: a prolonged crisis inevitable over Germany); [[w.odonnell-johnny-we-hardly-knew]], 337 (O''Donnell: Reston wanted to see Kennedy before the airport; Kennedy: "I''d like to get across to the people at home the seriousness of the situation ... I''ll give Scotty a grim picture. But actually, as De Gaulle says, Khrushchev is bluffing and he''ll never sign that treaty"; Reston''s story called him "shaken" and "angry"; the page has the talk upstairs in his room, not the blinds or the hour); [[w.salinger-with-kennedy]], 182 (Kennedy has Salinger invite Reston to the embassy and gives him "an extremely candid statement of his views"; not the words). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Reston, Khrushchev, Kennedy.'
