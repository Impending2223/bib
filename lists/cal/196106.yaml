  - id: cal.1961-06-01.china-leadership-2
    when: June 1
    date: '1961-06-01'
    thread: china-leadership
    c: 'Mao has four letters on Hunan printed for the work conference''s members to study: his own of Apr. 11, Zhang Pinghua''s of Apr. 14, Wang Renzhong''s of May 10 and Liu Shaoqi''s of May 11; Hunan''s problems, much the same in every province, are of general bearing. Liu''s letter: Tianhua brigade may be led in fact by landlords and rich peasants; the members'' livelihood is far below 1957''s.'
    n: '[[w.jianguo-yilai-mao-zedong]], XVI, 55–56 (June 1, 1961). Made public: 2023. To check: Liu Shaoqi to Mao, May 11, 1961 (cited at [[w.jianguo-yilai-mao-zedong]], XVI, 55 n.1). Names: Mao Zedong, Liu Shaoqi, Zhang Pinghua, Wang Renzhong. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
