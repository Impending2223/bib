  - id: cal.1961-06.china-leadership-6
    when: June, early
    date: 1961-06
    at: before 1961-06-01
    thread: china-leadership
    also: [farm]
    c: 'On the regional leaders'' views on his report of May 31, Zhou Enlai drafts the "Nine measures on grain": cutting the town population led by each Party committee, with full political mobilization; towns only to cut; city numbers verified; no rise in the 1961–62 ration standard; the grain figures for July 1961 to June 1962 fixed after August; promotions and pay changes put off to the second half of the year; central departments to plan cuts in their own enterprises; city conscription; industry and commerce to plan help for farming. On the 6th he explains each at the conference.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 413 (June 1961). Made public: 1997. Names: Zhou Enlai.'
