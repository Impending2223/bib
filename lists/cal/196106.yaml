  - id: cal.1961-06-06.congress
    when: June 6
    date: '1961-06-06'
    thread: congress
    also: [berlin-and-vienna]
    c: 'Back from Vienna, Kennedy with the congressional leaders before the evening''s report. After Gilpatric gives allied policy as nuclear weapons in defense of Berlin, Kennedy: "What we are talking about is seventy million dead Americans." Mansfield to his staff: "He''s shaken," and the leaders with him.'
    n: '[[w.reeves-president-kennedy]], 175–76. To check: Mike Mansfield, oral history, 7, Kennedy Library; Memorandum of conversation, Kennedy and the congressional leadership, June 7, 1961, National Security Files, box 317, Kennedy Library (cited by [[w.reeves-president-kennedy]], 176). Check: Reeves''s note dates the memorandum of the meeting June 7. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Gilpatric, Mansfield, Kennedy.'
    src:
      c: f1ce8052
      rows:
        - 'w.reeves-president-kennedy 175–76: all'
        - 'via w.reeves-president-kennedy 175 n.goddamnit-ros: B'
        - 'via w.reeves-president-kennedy 176 n.hes-shaken.a: C'
        - 'via w.reeves-president-kennedy 176 n.hes-shaken.b: all'
    tags: [name:gilpatric-roswell-l, name:mansfield-mike, name:kennedy-john-f]
