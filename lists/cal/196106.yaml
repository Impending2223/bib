  - id: cal.1961-06-09.cuba
    when: June 9
    date: '1961-06-09'
    thread: cuba
    also: [soviet-union]
    c: 'Alekseyev to Moscow: Blas Roca and Escalante, on their own and hiding it from him, planned to assassinate the leaders of the counterrevolution, Manuel Ray first; warned by the deputy minister of the interior, he has told them that in Moscow''s view "it was probably not the time to take these measures."'
    n: '[[w.fursenko-one-hell-of-a]], 98. To check: Alekseyev to Moscow, June 9, 1961 (cited by [[w.fursenko-one-hell-of-a]], 98 n.92). Check: the day of the plan and of the message.'
