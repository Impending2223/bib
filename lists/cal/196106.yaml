  - id: cal.1961-06-01.latin-america
    when: June 1
    date: '1961-06-01'
    thread: latin-america
    c: After Trujillo's killing, McNamara orders two carriers with escorts and the 4th Marine Expeditionary Brigade to the Caribbean. June 4, Admiral James Russell, Vice Chief of Naval Operations, recommends the cruiser *Northampton* into the harbor of Ciudad Trujillo, the task force in plain view.
    n: '[[w.poole-joint-chiefs-of-staff]], 231. Names: McNamara.'
