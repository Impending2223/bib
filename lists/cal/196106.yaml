entries:
  - id: cal.1961-06-02.opinion
    when: June 2
    date: '1961-06-02'
    thread: opinion
    also: [space]
    c: 'Gallup, May 17–22: men on the moon within five years, 21 percent; in five to ten years, 31; never, 9.'
    n: '[[w.gallup-poll]], III, 1720.'
  - id: cal.1961-06-03.berlin-and-vienna
    when: June 3–4
    date: '1961-06-03'
    thread: berlin-and-vienna
    c: 'Vienna summit. Khrushchev hands over an aide-mémoire: a German peace treaty within six months, and an end to Western rights in Berlin. Kennedy to Reston afterward: the worst thing in his life. Laos the only agreement.'
    n: 'FRUS 1961–63, V, docs. [83](https://history.state.gov/historicaldocuments/frus1961-63v05/d83)–[89](https://history.state.gov/historicaldocuments/frus1961-63v05/d89); XIV, docs. [32](https://history.state.gov/historicaldocuments/frus1961-63v14/d32), [33](https://history.state.gov/historicaldocuments/frus1961-63v14/d33) (the memoranda of conversation). [[w.beschloss-crisis-years]]; [[w.kempe-berlin-1961]]; [[w.catudal-kennedy-and-the-berlin]]; [[w.harrison-driving-the-soviets-up]]; [[w.fursenko-khrushchevs-cold-war]]; [[w.wilke-der-weg-zur-mauer]]; [[w.prezidium-tsk-kpss-1954]]. [[w.khrushchev-vremya-lyudi-vlast]]. [[w.thompson-kremlinologist]]; [[w.bohlen-witness-to-history-1929]]; [[w.reston-deadline]]. Names: Khrushchev, Gromyko, Menshikov, Thompson, Kohler, Reston.'
    tags: [name:khrushchev-nikita-s, name:reston-james, name:kennedy-john-f, name:gromyko-andrei, name:menshikov-mikhail, name:thompson-llewellyn-e, name:kohler-foy-d]
  - id: cal.1961-06-04.opinion
    when: June 4
    date: '1961-06-04'
    thread: opinion
    also: [space]
    c: 'Gallup, May 17–22: ahead in space research, Russia 38 percent, the United States 38. First to the moon, Russia 34, the United States 33.'
    n: '[[w.gallup-poll]], III, 1720.'
  - id: cal.1961-06-05.berlin-and-vienna
    when: June 5
    date: '1961-06-05'
    thread: berlin-and-vienna
    c: London. Macmillan.
    n: 'Joint Statement Following Discussion With Prime Minister Macmillan, [1961 Pub. Papers 441](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=499); [FRUS 1961–63, XIV, doc. 34](https://history.state.gov/historicaldocuments/frus1961-63v14/d34). [[w.macmillan-at-the-end-of]]; [[w.macmillan-diaries]]. Names: Macmillan.'
    tags: [name:kennedy-john-f, name:macmillan-harold]
  - id: cal.1961-06-05.court
    when: June 5
    date: '1961-06-05'
    thread: court
    c: '*Communist Party v. SACB*, [367 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367001/usrep367001.pdf), and *Scales v. United States*, [367 U.S. 203](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367203/usrep367203.pdf). The McCarran registration order and the Smith Act membership clause upheld, both 5–4.'
    n: See [[cal.1961-01-23.court]]. Kennedy had to decide whether to enforce registration.
  - id: cal.1961-06-06.berlin-and-vienna
    when: June 6
    date: '1961-06-06'
    thread: berlin-and-vienna
    c: Report to the nation on Vienna. "A very sober two days."
    n: Radio and Television Report to the American People on Returning from Europe, [1961 Pub. Papers 441](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=499) (June 6, 1961). See [[cal.1961-06-03.berlin-and-vienna]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-06-07.opinion
    when: June 7
    date: '1961-06-07'
    thread: opinion
    also: [defense]
    c: 'Gallup, May 17–22: ahead in long-range missiles, the United States 54 percent, Russia 20.'
    n: '[[w.gallup-poll]], III, 1720.'
  - id: cal.1961-06-07.opinion-2
    when: June 7
    date: '1961-06-07'
    thread: opinion
    also: [cuba]
    c: 'Gallup, Apr. 28–May 3: no trade with Cuba while Castro holds power, 63 percent agree, 23 disagree. Aid to the anti-Castro forces, 44 agree, 41 disagree. American forces into Cuba, 24 agree, 65 disagree.'
    n: '[[w.gallup-poll]], III, 1721. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1961-06-07.defense-soviet-forces
    when: June 7
    date: '1961-06-07'
    thread: defense-soviet-forces
    c: NIE 11-8-61, Soviet Capabilities for Long Range Attack; FRUS prints its annex on the ICBM program. Two to four ICBM sites probably begun in 1957–59, probably operational now. Army and Navy intelligence dissent.
    n: '[FRUS 1961–63, VIII, doc. 29](https://history.state.gov/historicaldocuments/frus1961-63v08/d29). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
    tags: [name:dulles-allen-w]
  - id: cal.1961-06-09.opinion
    when: June 9
    date: '1961-06-09'
    thread: opinion
    also: [medicare]
    c: 'Gallup, May 17–22: a higher Social Security tax to pay for medical insurance for the aged, 67 percent for, 26 against.'
    n: '[[w.gallup-poll]], III, 1721.'
  - id: cal.1961-06-09.africa
    when: June 9
    date: '1961-06-09'
    thread: africa
    c: Security Council on Angola, Resolution 163, 9–0, Britain and France abstaining; the United States for. Portugal to end its repressive measures and work with the General Assembly's subcommittee on Angola, named in Resolution 1603 (Apr. 20; Check the date).
    n: '[S.C. Res. 163](https://undocs.org/S/RES/163(1961)) (June 9, 1961); [G.A. Res. 1603 (XV)](https://undocs.org/A/RES/1603(XV)). See [[cal.1961-03-15.africa]].'
  - id: cal.1961-06-12.right-and-the-military
    when: June 12
    date: '1961-06-12'
    thread: right-and-the-military
    c: Walker admonished; his program found improper. He resigns [[cal.1961-11-02.right-and-the-military]].
    n: '[Cong. Rec., House, June 12, 1961, 10102](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-2-2.pdf#page=68). See [[cal.1961-04-17.right-and-the-military]]. Names: Walker.'
    tags: [name:walker-edwin-a]
  - id: cal.1961-06-13.cuba
    when: June 13
    date: '1961-06-13'
    thread: cuba
    c: The Cuba Study Group reports. Blame shared; the CIA's covert role to be reduced; the Joint Chiefs to advise on such operations.
    n: FRUS 1961–63, X, docs. [230](https://history.state.gov/historicaldocuments/frus1961-63v10/d230), [233](https://history.state.gov/historicaldocuments/frus1961-63v10/d233), [234](https://history.state.gov/historicaldocuments/frus1961-63v10/d234). Memorandum from Taylor to the President (K–J Adm. II.H.3); [[w.operation-zapata]]; [[w.taylor-swords-and-plowshares]].
  - id: cal.1961-06-13.confirmations
    when: June 13
    date: '1961-06-13'
    thread: confirmations
    c: Howard Morgan confirmed to the Federal Power Commission, [57–27](https://voteview.com/rollcall/RS0870076).
    n: '[107 Cong. Rec., Senate, June 13, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-3-2.pdf). See [[cal.1961-03-07.confirmations]]. Names: Morgan.'
    tags: [name:morgan-howard]
  - id: cal.1961-06-13.mayors-minneapolis
    when: June 13
    date: '1961-06-13'
    thread: mayors
    also: [elections-1961]
    c: Minneapolis. Naftalin (DFL), a political scientist and Freeman's commissioner of administration, over Mayor Peterson (R), 52.0 percent to 48.0.
    n: '[Wikipedia, "Arthur Naftalin"](https://en.wikipedia.org/wiki/Arthur_Naftalin); [Wikipedia, "P. Kenneth Peterson"](https://en.wikipedia.org/wiki/P._Kenneth_Peterson) (Check: the city''s official canvass). [[w.peirce-great-plains-states-of]]. Names: Freeman, Naftalin, Peterson.'
    tags: [state:mn, city:minneapolis, name:naftalin-arthur, name:peterson-p-kenneth, name:freeman-orville-l]
  - id: cal.1961-06-13.japan-and-korea
    when: June 13
    date: '1961-06-13'
    thread: korea
    c: 'National Security Council on Korea, the task force''s report. The junta to be dealt with "on a friendly and cooperative basis"; aid continued, more of it only for reforms; Berger, the new ambassador, to tell its leaders so. McConaughy, Assistant Secretary for the Far East: the quarrel with Japan the chief hindrance to Korea''s growth.'
    n: 'FRUS 1961–63, XXII, docs. [228](https://history.state.gov/historicaldocuments/frus1961-63v22/d228), [229](https://history.state.gov/historicaldocuments/frus1961-63v22/d229), [230](https://history.state.gov/historicaldocuments/frus1961-63v22/d230) (NSC Action No. 2430). See [[cal.1961-05-16.japan-and-korea]]. Names: Berger, McConaughy.'
    tags: [name:berger-samuel-d, name:kennedy-john-f, name:mcconaughy-walter-p-jr]
  - id: cal.1961-06-14.opinion
    when: June 14
    date: '1961-06-14'
    thread: opinion
    also: [press-and-broadcasting]
    c: 'Gallup, May 17–22: greater curbs on what newspapers print, 31 percent approve, 55 disapprove. On television and radio programs, 49 approve, 39 disapprove; violence the thing most would control.'
    n: '[[w.gallup-poll]], III, 1722.'
  - id: cal.1961-06-15.berlin-and-vienna
    when: June 15
    date: '1961-06-15'
    thread: berlin-and-vienna
    c: Khrushchev repeats the deadline on Soviet television. Tower sworn in.
    n: '[Cong. Rec., Senate, June 15, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-5-2.pdf#page=29). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Khrushchev, Tower.'
    tags: [name:khrushchev-nikita-s, name:tower-john-g]
  - id: cal.1961-06-15.state-and-city-finance-nc
    when: June 15
    date: '1961-06-15'
    thread: state-and-city-finance
    c: 'North Carolina. The General Assembly ratifies Sanford''s revenue bill for his Quality Education Program: exemptions from the 3 percent retail sales tax removed, food''s among them; a surtax of 2 percent on liquor.'
    n: '[N.C. Sess. Laws 1961, ch. 826, p. 1053](https://archive.org/details/sessionlawsresol1961nort/page/n1106) (S.B. 78, ratified June 15, 1961). [[w.covington-terry-sanford]]; [[w.drescher-triumph-of-good-will]]. Names: Sanford.'
    tags: [state:nc, name:sanford-terry]
  - id: cal.1961-06-18.opinion
    when: June 18
    date: '1961-06-18'
    thread: opinion
    also: [freedom-rides, desegregation-public-places]
    c: 'Gallup, May 28–June 2: Kennedy right to send marshals to Montgomery, 70 percent; wrong, 13. In the South, 50 right, 29 wrong.'
    n: '[[w.gallup-poll]], III, 1723.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-06-19.court
    when: June 19
    date: '1961-06-19'
    thread: court
    c: '*Mapp v. Ohio*, [367 U.S. 643](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367643/usrep367643.pdf); *Torcaso v. Watkins*, [367 U.S. 488](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367488/usrep367488.pdf); *Poe v. Ullman*, [367 U.S. 497](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367497/usrep367497.pdf). The last day of the Term.'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-06-19.welfare-ny
    when: June 19
    date: '1961-06-19'
    thread: welfare
    also: [states-and-cities]
    c: 'Newburgh, N.Y. The City Council, four ayes, adopts City Manager Mitchell''s thirteen points on relief, in force July 15: vouchers for cash; able-bodied men on relief to work 40 hours a week for the city; relief denied to anyone who refuses a job or quits one, and to a mother who has another child out of wedlock; newcomers without an offer of work held to a week; aid, but for the aged, blind and disabled, limited to three months a year. June 22, State officials: the code breaks the State''s rules. Goldwater meets Mitchell in July.'
    n: '[The council''s minutes, June 19, 1961](https://en.wikisource.org/wiki/Thirteen_Points) (Wikisource). [[w.ritz-despised-poor]]; [[w.mittelstadt-from-welfare-to-workfare]]; [[w.neubeck-welfare-racism]]; [[w.tani-states-of-dependency]]; [[w.perlstein-before-the-storm]]. Names: Mitchell, Goldwater.'
    tags: [state:ny, city:newburgh, name:mitchell-joseph-mcdowell, name:goldwater-barry-m]
  - id: cal.1961-06-20.transition-and-staff
    when: June 20–22
    date: '1961-06-20'
    thread: transition-and-staff
    also: [japan]
    c: 'Ikeda Hayato in Washington. The joint statement: the partnership; a cabinet-level Joint Committee on Trade and Economic Affairs; committees on cultural and on scientific cooperation; the Ryukyus and the Bonins.'
    n: 'Toasts of the President and Prime Minister Ikeda of Japan, [1961 Pub. Papers 468](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=526) (June 21, 1961); Joint Statement Following Discussions With Prime Minister Ikeda of Japan, [1961 Pub. Papers 470](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=528) (June 22, 1961). [[w.reischauer-my-life-between-japan]]. FRUS 1961–63, XXII, docs. [330](https://history.state.gov/historicaldocuments/frus1961-63v22/d330)–[338](https://history.state.gov/historicaldocuments/frus1961-63v22/d338) (the memoranda of conversation). Names: Ikeda.'
    tags: [name:kennedy-john-f, name:ikeda-hayato]
  - id: cal.1961-06-21.opinion
    when: June 21
    date: '1961-06-21'
    thread: opinion
    also: [freedom-rides, desegregation-public-places]
    c: 'Gallup, May 28–June 2: the Supreme Court''s ruling against segregation on trains, buses, and in waiting rooms, 66 percent approve, 28 disapprove; in the South, 26 approve. 63 percent have heard of the freedom rides; of them, 24 approve of the riders, 64 disapprove.'
    n: '[[w.gallup-poll]], III, 1723.'
  - id: cal.1961-06-22.europe-and-the-alliance-jupiters
    when: June 22
    date: '1961-06-22'
    thread: europe-and-the-alliance-jupiters
    also: [defense]
    c: 'McGhee to Bundy: the Jupiters not to be cancelled; after Khrushchev at Vienna, cancellation "might seem a sign of weakness."'
    n: 'FRUS 1961–63, XVI, docs. [365](https://history.state.gov/historicaldocuments/frus1961-63v16/d365) (June 13), [366](https://history.state.gov/historicaldocuments/frus1961-63v16/d366). See [[cal.1961-04-06.europe-and-the-alliance]]. Names: McGhee, Bundy, Khrushchev.'
    tags: [name:mcghee-george-c, name:bundy-mcgeorge, name:khrushchev-nikita-s]
  - id: cal.1961-06-23.opinion
    when: June 23
    date: '1961-06-23'
    thread: opinion
    also: [desegregation-schools, court]
    c: 'Gallup, May 28–June 2: the Supreme Court''s school desegregation decision, 62 percent approve, 33 disapprove. In the South, 24 approve, 69 disapprove.'
    n: '[[w.gallup-poll]], III, 1723.'
  - id: cal.1961-06-25.opinion
    when: June 25
    date: '1961-06-25'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, May 28–June 2: race relations in the South in the coming year, better 29 percent, worse 53. In the South, worse 65.'
    n: '[[w.gallup-poll]], III, 1723.'
  - id: cal.1961-06-25.states-and-cities-us
    when: June 25–28
    date: '1961-06-25'
    thread: states-and-cities
    also: [school-aid]
    c: 'Governors'' Conference at Honolulu. Johnson, June 27: "Testing Our Will." June 28: for federal grants to the States for classrooms, loans for college buildings, and adult education, 35–12, two-thirds needed; an amendment against aid for teachers'' salaries lost, 23–24. Support of the President in foreign affairs, by a unanimous standing vote.'
    n: '[*Proceedings of the Governors'' Conference, 1961*, 89, 111–120, 156](https://www.nga.org/wp-content/uploads/2026/03/1961_Annual_Meeting-compressed-1.pdf#page=128). See [[cal.1961-02-20.school-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1961-06-25.middle-east
    when: June 25
    date: '1961-06-25'
    thread: middle-east-kuwait
    c: Kuwait. Britain and the Ruler end the agreement of 1899 by an exchange of letters, June 19; Kuwait independent. June 25, Qassim claims it as part of Iraq.
    n: 'FRUS 1961–63, XVII, doc. [66](https://history.state.gov/historicaldocuments/frus1961-63v17/d66) (June 26). [[w.alani-operation-vantage]]; [[w.joyce-kuwait-1945-1996]]; [[w.ashton-kennedy-macmillan-and-the]]; [[w.petersen-decline-of-the-anglo]]. Names: Qassim, Abdullah al-Salim al-Sabah.'
    tags: [name:qassim-abdul-karim, name:abdullah-al-salim-al-sabah]
  - id: cal.1961-06-26.transition-and-staff
    when: June 26
    date: '1961-06-26'
    thread: transition-and-staff
    c: Taylor named Military Representative of the President, from July 1. A general between Kennedy and the Joint Chiefs.
    n: '[FRUS 1961–63, I, doc. 75](https://history.state.gov/historicaldocuments/frus1961-63v01/d75). [[w.taylor-swords-and-plowshares]]; [[w.mcmaster-dereliction-of-duty-1997]]. Names: Taylor.'
    tags: [name:taylor-maxwell, name:kennedy-john-f]
  - id: cal.1961-06-26.economy-debt-limit
    when: June 26
    date: '1961-06-26'
    thread: economy-debt-limit
    c: House passes H.R. 7677, the debt limit $13 billion over the permanent for fiscal 1962, [231–148](https://voteview.com/rollcall/RH0870048).
    n: '[107 Cong. Rec., House, June 26, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt9/pdf/GPO-CRECB-1961-pt9-1-1.pdf). See [[cal.1960-06-08.economy-debt-limit]].'
  - id: cal.1961-06-28.cuba
    when: June 28
    date: '1961-06-28'
    thread: cuba
    c: NSAMs 55 and 57 apply the Study Group's lessons. Acheson's Berlin report, the hard line, reaches the President about this time.
    n: '[NSAM No. 55](https://history.state.gov/historicaldocuments/frus1961-63v08/d32) & [No. 57](https://history.state.gov/historicaldocuments/frus1961-63v08/d34) (K–J Adm. II.H.2). [FRUS 1961–63, XIV, doc. 49](https://history.state.gov/historicaldocuments/frus1961-63v14/d49), Acheson''s report. [[w.kempe-berlin-1961]]. Names: Acheson.'
    tags: [name:acheson-dean-g, name:kennedy-john-f]
  - id: cal.1961-06.civil-rights-the-executive
    when: June
    date: 1961-06
    thread: civil-rights-the-executive
    c: W. Harold Cox, Eastland's college roommate, appointed to the Southern District of Mississippi; the first Kennedy judge in the Deep South.
    n: '[Cong. Rec., Senate, June 27, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt9/pdf/GPO-CRECB-1961-pt9-2-1.pdf#page=32). [[w.navasky-kennedy-justice]]. See [[cal.1961-05-19.civil-rights-the-executive]]. Names: Cox, Eastland.'
    tags: [name:cox-w-harold, name:eastland-james-o, name:kennedy-john-f]
  - id: cal.1961-06.vietnam
    when: June–July
    date: 1961-06
    thread: vietnam
    c: Eugene Staley's economic mission in Saigon. Its program, approved in August, underwrites a larger army.
    n: 'FRUS 1961–63, I, docs. [72](https://history.state.gov/historicaldocuments/frus1961-63v01/d72), [93](https://history.state.gov/historicaldocuments/frus1961-63v01/d93), [114](https://history.state.gov/historicaldocuments/frus1961-63v01/d114), [118](https://history.state.gov/historicaldocuments/frus1961-63v01/d118). [[w.miller-misalliance]], 226–27; [[w.gibbons-u-s-government-and]], II, 51–52. See [[cal.1961-01-28.vietnam]]. Names: Staley.'
    tags: [name:staley-eugene, place:saigon]
  - id: cal.1961-06-28.opinion
    when: June 28
    date: '1961-06-28'
    thread: opinion
    also: [freedom-rides, desegregation-public-places]
    c: 'Gallup, May 28–June 2: integration gradually, 61 percent; by every means in the near future, 23; never, 7. Sit-ins, freedom buses, and other demonstrations will hurt the Negro''s chances, 57; help, 27.'
    n: '[[w.gallup-poll]], III, 1724.'
  - id: cal.1961-06-29.africa
    when: June 29
    date: '1961-06-29'
    thread: africa
    c: 'Kennedy to Nkrumah: all major issues in the American share of financing the Volta dam and its aluminum smelter resolved; the documents in preparation; signature contingent on Ghana''s concluding its negotiations with the World Bank.'
    n: 'FRUS 1961–63, XXI, doc. [227](https://history.state.gov/historicaldocuments/frus1961-63v21/d227). [[w.noer-new-frontier-and-african]]; [[w.mahoney-jfk]]; [[w.muehlenbeck-betting-on-the-africans]]; [[w.thompson-ghanas-foreign-policy-1957]]; [[w.schlesinger-thousand-days-1965]]. Made public: FRUS 1961–63, XXI (1995). See [[cal.1961-03-08.africa]]. Names: Nkrumah.'
    tags: [name:kennedy-john-f, name:nkrumah-kwame]
  - id: cal.1961-06-30.program
    when: June 30
    date: '1961-06-30'
    thread: cities-and-housing
    also: [welfare]
    c: Housing Act of 1961, [75 Stat. 149](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg149.pdf), and Social Security Amendments of 1961, [75 Stat. 131](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg131.pdf), signed. Moderate-income housing, urban renewal, open space; earlier retirement for men at sixty-two. LeMay becomes Air Force Chief of Staff.
    n: 'Statutes (K–J Cong. II.J.2). [[w.gelfand-nation-of-cities]]; [[w.pritchett-robert-clifton-weaver-and]]. Names: Weaver, Sparkman, LeMay.'
    tags: [name:lemay-curtis-e, name:kennedy-john-f, name:weaver-robert-c, name:sparkman-john]
  - id: cal.1961-06-30.economy
    when: June 30
    date: '1961-06-30'
    thread: economy-debt-limit
    c: The debt limit raised temporarily to $298 billion for the new fiscal year, [75 Stat. 148](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg148-2.pdf).
    n: Statute (K–J Cong. II.J.2). CQ Almanac 1961 (K–J Cong. II.L). See [[cal.1961-06-26.economy-debt-limit]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-06-30.state-and-city-finance-us
    when: June 30
    date: '1961-06-30'
    thread: state-and-city-finance
    c: Fiscal 1961 closes in forty-six States. The fifty State governments' taxes for the year $19.1 billion, $104.60 a head; federal aid $6.4 billion; long-term debt $19.5 billion (Census). By Census's columns, first revenue from a general sales tax in Kentucky, an individual income tax in West Virginia.
