th]], 194 (Laos: Khrushchev not much interested, no Soviet wish for responsibilities so far away; both to press their clients to work with the Commission; Khrushchev to do his utmost for a truly neutral government. Vietnam not discussed); [[w.chang-friends-and-enemies]], 231–32 (Khrushchev firm for China''s U.N. seat and Taiwan; Kennedy''s proverb of the long journey''s first step; Khrushchev: Kennedy knows the Chinese well, so does he; Kennedy: the Soviets may get to know them "even better"; the day not given). [[w.schlesinger-thousand-days-1965]], 358–74. [[w.reeves-president-kennedy]], 156–72 (the talks; the aides-mémoire; Reston). [[w.fursenko-one-hell-of-a]], 129–31 (the talks, Berlin and the treaty by December; Laos). Check: Dobrynin dates the summit July 3–4 (44–45). Check: Schulimson (87) has Kennedy and Khrushchev on Laos at Vienna June 2 and 3. The time is the first day''s. To check: [[w.beschloss-crisis-years]]; [[w.kempe-berlin-1961]]; [[w.catudal-kennedy-and-the-berlin]]; [[w.harrison-driving-the-soviets-up]]; [[w.wilke-der-weg-zur-mauer]]; [[w.khrushchev-vremya-lyudi-vlast]]; [[w.thompson-kremlinologist]]; [[w.bohlen-witness-to-history-1929]]; [[w.reston-deadline]]; [[w.documents-on-international-affairs]], 277–80 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 122 n.10); [[w.foreign-relations-of-the]], XXIV, 225–236 (memoranda of the Vienna conversations, June 3–4, 1961) (cited by [[w.guan-vietnamese-communists-relations-with]], 194 n.58a); [[w.hilsman-to-move-a-nation]], 136 (cited by [[w.guan-vietnamese-communists-relations-with]], 194 n.58c). Names: Khrushchev, Gromyko, Menshikov, Thompson, Kohler, Reston.'
