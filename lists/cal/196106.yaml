    c: Vienna, after the last session. Kennedy, finding the press reports too optimistic, tells Salinger to stay behind and counter the euphoria among American reporters; Salinger backgrounds the by-liners as they file, and leaves with them for London in the early hours of June 5. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 182. See [[cal.1961-06-04.press-and-broadcasting]]. Names: Kennedy, Salinger.'
