  - id: cal.1961-06-06.berlin-and-vienna-2
    when: June 6
    date: '1961-06-06'
    thread: berlin-and-vienna
    also: [defense]
    c: 'The Joint Chiefs answer Gilpatric: two airborne battle groups and 224 aircraft to the training areas in Germany in two to three weeks; an airborne division, 11,555 men, in nine days on a crash basis. Their preference: one of the 27 National Guard divisions in summer training, its service extended 30 to 60 days, with a declaration of national emergency and more reserves called.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 151. To check: P. H. Johnstone, "Military Policy Making during the Berlin Crisis of 1958-62," IDA Report R-138, Mar. 1968, IDA (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 151 n.35). See [[cal.1961-05-29.berlin-and-vienna-2]]. Names: Gilpatric.'
    src:
      c: 20be1476
      rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 151: all'
        - 'via x.1968-03.p-h-johnstone-military-policy-making-during: all'
    tags: [name:gilpatric-roswell-l]
