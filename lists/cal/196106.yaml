    n: '[[w.anthony-war-in-northern-laos]], 54. To check: US COIN Ops in Laos, 1955–1962, p. D-34 (cited by [[w.anthony-war-in-northern-laos]], 54 n.92). See [[cal.1961-05-30.laos]]. Names: Vang Pao.'
