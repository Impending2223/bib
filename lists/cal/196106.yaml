    c: Peking 北京. The enlarged meeting of the Military Commission 中央军委扩大会议 opens (to July 14); Ye Jianying 叶剑英 attends. Its vice-chairmen Lin Biao 林彪, He Long 贺龙 and Nie Rongzhen 聂荣臻 and its standing members Liu Bocheng 刘伯承, Luo Ronghuan 罗荣桓 and Xu Xiangqian 徐向前 preside in turn. On meeting a sudden emergency and on building the army; it draws up and approves the militia work regulations, the regulations on company management and education 《连队管理教育工作条例》 and the decision on stabilizing the cadre ranks 《稳定干部队伍的决定》. In the first half of July it reviews and revises the draft operational plan of Ye's group.
