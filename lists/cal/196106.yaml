  - id: cal.1961-06-01.laos-2
    when: June 1
    date: '1961-06-01'
    place: paris
    thread: laos
    also: [berlin-and-vienna]
    c: 'Paris, the American embassy, Kennedy''s second day. Harriman, waiting in the doorway, takes his elbow: does he want a settlement on Laos or not? Kennedy: yes, "Get us out of there any way you can."'
    n: '[[w.reeves-president-kennedy]], 152. To check: [[w.halberstam-best-and-the-brightest]], 94–95 (cited by [[w.reeves-president-kennedy]], 152). Names: Harriman, Kennedy.'
