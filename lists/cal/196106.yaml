    thread: china-leadership
    c: 'Chen Yun 陈云, by letter to Li Fuchun 李富春: cotton will not grow for five years, and people will be angry at a few feet of cloth coupons a year (towels and socks included); he proposes a "clothing small group" 穿衣问题小组 under a vice-chairman of the Planning Commission 国家计委 to study coke-oven by-products, North Korea''s 北朝鲜 vinylon process, a kapron 卡普隆 works of 5,000 tons a year in two years (two pairs of socks a townsman) and more viscose fiber.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 93–94. Made public: 2005 ([[w.chen-yun-wenji]], where the nianpu says it is printed). To check: [[w.chen-yun-wenji]], III. Names: Chen Yun, Li Fuchun.'
