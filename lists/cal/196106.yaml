  - id: cal.1961-06-04.opinion
    when: June 4
    date: '1961-06-04'
    thread: opinion
    also: [space]
    c: 'Gallup, May 17–22: ahead in space research, Russia 38 percent, the United States 38. First to the moon, Russia 34, the United States 33.'
    n: '[[w.gallup-poll]], III, 1720.'
  - id: cal.1961-06-04.press-and-broadcasting
    when: June 4
    date: '1961-06-04'
    thread: press-and-broadcasting
    also: [berlin-and-vienna, vietnam]
    c: 'Vienna, the embassy, ten minutes after Khrushchev, the blinds drawn. Kennedy to Reston of the *Times*: "Worst thing in my life. He savaged me." "He thinks because of the Bay of Pigs that I''m inexperienced." Then: "I''ll have to increase the defense budget. And we have to confront them. The only place we can do that is in Vietnam. We have to send more people there." By Reston''s account.'
    n: '[[w.reeves-president-kennedy]], 172–73; [[w.dobrynin-in-confidence]], 46 (Kennedy with Reston right after the meeting; Reston''s article: a prolonged crisis inevitable over Germany). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Reston, Khrushchev, Kennedy.'
    src:
      c: 77aab674
      rows:
        - 'w.reeves-president-kennedy 172–73: all'
        - 'via w.reeves-president-kennedy 172 n.how-was-it: all'
        - 'w.dobrynin-in-confidence 46: A'
    tags: [name:reston-james, name:khrushchev-nikita-s, name:kennedy-john-f]
  - id: cal.1961-06-04.berlin-and-vienna
    when: June 4
    date: '1961-06-04'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: 'Vienna. Chancellor Kreisky, from seeing Kennedy off, with Khrushchev: "The President was very gloomy at the airport." Khrushchev: "the President still doesn''t quite understand the times in which we live . . . the realignment of forces."'
    n: '[[w.fursenko-khrushchevs-cold-war]], 364. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Kreisky, Khrushchev, Kennedy.'
    src:
      c: 038fbe23
      rows:
        - 'w.fursenko-khrushchevs-cold-war 364: all'
    tags: [name:kreisky-bruno, name:khrushchev-nikita-s, name:kennedy-john-f]
