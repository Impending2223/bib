    place: geneva
    thread: china-leadership
    also: [laos]
    c: 'Geneva 日内瓦, the conference on Laos. Chen Yi 陈毅: the cease-fire violations the American delegate charges are clashes the Phoumi–Boun Oum clique has provoked with American backing; the United States complicates Laos and blocks discussion of substance; the Soviet proposals to be the base.'
    n: '[[w.chen-yi-nianpu]], 875. The words: 下午 (875). Names: Chen Yi, Phoumi Nosavan, Boun Oum.'
