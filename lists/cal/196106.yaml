    when: June 7
    date: '1961-06-07'
    thread: laos
    c: Padong falls. A Pathet Lao ground and artillery assault drives the Hmong from their base camp; Vang Pao sets up some ten miles southwest.
    n: '[[w.schulimson-joint-chiefs-of-staff]], 88. See [[cal.1961-05-30.laos-2]].'
