  - id: cal.1961-06-12.china-leadership
    when: June 12
    date: '1961-06-12'
    place: peking
    thread: china-leadership
    c: 'The Huairen Tang. Mao closes the work conference: the Zhengzhou meetings hurried, he did not yet understand socialism; after Lushan the resolution on Peng, Huang, Zhang and Zhou should not have gone below the counties: good men, truth-tellers made "right opportunists," even "counterrevolutionaries"; his six points of 1959 "a fart"; the "five big drives" of 1960 the "communist wind" again; Beidaihe of 1960 abroad, the Twelve Articles the turn.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, June 12, 1961; [[w.macfarquhar-origins-of-the-cultural]], III, 63 (Mao''s closing speech; his later claim of a self-criticism); [[w.macfarquhar-origins-of-the-cultural]], III, 235 (Mao''s view, "that summer," that the campaign against right opportunism had spread too widely, with reversals of verdicts proposed); [[w.yang-shangkun-riji]], II, 41 (June 12, 1961; the plenary, 11 a.m. to 2 p.m.; Mao: sum up experience, educate cadres, learn Marxism-Leninism from three years'' work, sum up eleven years of building; it may take another eleven); [[w.deng-xiaoping-nianpu-1904]], III, 1645 (June 12, 1961; Deng at the plenary; Mao on summing up experience and educating cadres; city work this year; Lushan in August on rectification in the cities and industry); [[w.mao-zedong-zhuan]], V, ch. 68 n.19 (June 12, morning: Mao closes the conference, reviewing the years since Zhengzhou; the first Zhengzhou meeting copied Stalin, the second hurried; the Beidaihe talks of 1960 mostly on foreign affairs, the twelve articles of November the turn; he asks all to read Stalin''s *Economic Problems of Socialism in the USSR* again). [[w.yang-jisheng-mubei]], II, 918 n.147 (after Lushan the mistake was to pass the resolution on Peng, Huang, Zhang and Zhou below the county; it should have stopped at the county, with the Zhengzhou minutes and the Shanghai eighteen questions still carried out below and the left still opposed; fighting the right made a false picture; good people who spoke the truth were made right opportunists, even counterrevolutionaries); [[w.peng-zhen-nianpu-1902]], IV, 133 (June 12, 1961; Peng Zhen at the plenary; Mao on summing up experience and educating cadres); [[w.friedman-shadow-cold-war]], 62 (Mao makes some self-criticism at a Central Work Conference in Peking in June 1961, not circulated to the lower levels); [[w.chen-yun-nianpu-xiuding]], III, 93 (morning: Chen Yun at the plenary; when Li Fuchun says the plan must first meet the needs of farming and the market, Mao interjects: "Comrade Chen Yun said before that the market comes first; many opposed it then, and I did not speak; now are we not back on that track?"). Made public: 2013. Check: the book places Mao''s view only "that summer"; its source is Wang Bangzuo ([[w.bangzuo-zhongguo-gongchan-dang-tongyi]], 530–31). Check: Yang Shangkun''s diary has the closing plenary from 11 a.m. to 2 p.m., Li Fuchun on adjusting the industrial targets, Zhou Enlai on rural grain and cutting staff and Li Xiannian on oil crops and foreign trade speaking after Mao ([[w.yang-shangkun-riji]], II, 41); a time field. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 41) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.mao-zedong-sixiang-wan-1969]], 406 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.132a); [[w.gailong-dangdai-zhongguo-zhengzhi-dashidian]], 631 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.132b); [[w.lieberthal-research-guide-to-central-1989]], 118 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.132c); [[w.mao-zedong-sixiang-wan]], xia, 332–34 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.133); [[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]], 223 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.134); [[w.bangzuo-zhongguo-gongchan-dang-tongyi]], 530–31 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 235 n.10); Mao Zedong 毛泽东, speech at the Central Work Conference 中央工作会议, Peking, June 12, 1961 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.19); Kenneth Lieberthal, “The Great Leap Forward and the Split in the Yan’an leadership, 1958–1965,” in The Politics of China, ed. Roderick Macfarquhar, 112 (cited by [[w.friedman-shadow-cold-war]], 62 n.5). Names: Mao Zedong, Peng Dehuai, Huang Kecheng, Zhang Wentian, Zhou Xiaozhou.'
