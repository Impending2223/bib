    n: 'FRUS 1961–63, X, docs. [230](https://history.state.gov/historicaldocuments/frus1961-63v10/d230), [233](https://history.state.gov/historicaldocuments/frus1961-63v10/d233), [234](https://history.state.gov/historicaldocuments/frus1961-63v10/d234). Memorandum from Taylor to the President (K–J Adm. II.H.3). [[w.poole-joint-chiefs-of-staff]], 117–18 (the report; the Chiefs'' share); [[w.bissell-reflections-of-a-cold]], 192–93 (the "proximate cause," shortage of ammunition); [[w.thomas-robert-kennedy]], 125 (the report: "There can be no long-term living with Castro"); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 186–88; [[w.taylor-swords-and-plowshares]], 186, 190–92 (the report, June 13, a single copy; its conclusions: a failure of government, the operation too large to be covert, to have gone to Defense; the Chiefs to answer for the cold war as for war); [[w.reeves-president-kennedy]], 180–81 (the report received June 13; its conclusion on the organization of the Executive); [[w.schlesinger-robert-kennedy-and-his]], 448 (the report''s conclusion: the Eisenhower administration should have seen by November 1960 that the American hand could not be kept secret and made the project an overt operation under Defense, or abandoned it; Taylor: the cancelled air strike not decisive; not the day, the shared blame, the CIA''s role or the Chiefs'' advising); [[w.sen-church-alleged-assassination-plots]], 121, 135 (the "Taylor Report," issued June 13, 1961, makes no mention of the assassination plot; its conclusion that "there can be no long-term living with Castro as a neighbor" and its recommendation that the Cuban situation be "reappraised"; not B–D). [[w.jones-bay-of-pigs]], 146–48 (the findings; the recommendations). To check: [[w.operation-zapata]].'
