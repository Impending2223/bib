  - id: cal.1961-06-03.berlin-and-vienna-4
    when: June 3
    date: '1961-06-03'
    place: vienna
    thread: berlin-and-vienna
    also: [press-and-broadcasting]
    c: 'Vienna, the morning of Salinger''s arrival. Kharlamov, Khrushchev''s spokesman, and Salinger agree through interpreters on handling the joint communiqués. Kharlamov has met Mrs. Jarvis of NBC on her plan for a debate on American television; Salinger wants it shown in the Soviet Union too. Kharlamov will speak to Adzhubei in Moscow: "I think it can be arranged." By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 176–77. Names: Kharlamov, Khrushchev, Salinger, Adzhubei.'
    tags: [name:salinger-pierre, name:kharlamov-mikhail-a, name:khrushchev-nikita-s, name:adzhubei-aleksei]
  - id: cal.1961-06-03.berlin-and-vienna-5
    when: June 3
    date: '1961-06-03'
    place: vienna
    thread: berlin-and-vienna
    also: [press-and-broadcasting]
    c: 'Vienna. After the first day''s talks, which break up at 6:45 p.m., Salinger and Kharlamov reduce the communiqué to two paragraphs: "frank, courteous, and wide-ranging." At the joint briefing at the Hofburg, to more than 1,200 reporters, Salinger reads it; Kharlamov has "nothing to add," so the next day''s meeting may be as "fruitful." Chalmers Roberts asks if Salinger accepts that word: "I will stand with the statement I made at the outset." By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 179–80. Names: Salinger, Kharlamov.'
    tags: [name:salinger-pierre, name:kharlamov-mikhail-a]
