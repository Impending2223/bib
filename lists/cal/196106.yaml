    c: The Party group 黨組 of the Jilin 吉林 provincial health department reports on preventing and curing several chief diseases 《關於防治當前幾種主要疾病的報告》. From its work group's inspection in the Jilin 吉林, Tonghua 通化, Siping 四平 and Baicheng 白城 prefectures and the work reports of some others, edema in the villages is still grave and in some places growing; the heavy cases are about 2 percent of the sick in ordinary areas and over 6 percent in the heavy ones, and deaths continue. Over 20,000 in the province have uterine prolapse, and amenorrhea runs at 0.5 to 3 percent of young and middle-aged rural women.
