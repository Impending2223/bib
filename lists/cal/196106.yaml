    date: '1961-06-03'
    place: peking
    thread: china-leadership
    c: 'Peking 北京. Chen Yun 陈云 speaks to the East China and Northeast groups 华东、东北组 of the Central Work Conference 中共中央工作会议: the peasants'' zeal is up and goods will grow, but the state has nothing to trade them; steel, bamboo and coal for small goods the peasants need, and the timber saved from capital construction sold to them for tools and houses; first the villages, then the towns; high-priced sweets to go on; townspeople to the villages; then 100 million dollars of rubber, black sheet and other materials imported for goods, until coupons cover only a few things; fewer compulsory purchase quotas, and barter for the peasants'' surplus.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 92. Made public: 2005 ([[w.chen-yun-wenji]], where the nianpu says it is printed). To check: [[w.chen-yun-wenji]], III. Names: Chen Yun.'
