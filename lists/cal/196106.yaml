  - id: cal.1961-06-05.court
    when: June 5
    date: '1961-06-05'
    thread: court
    c: '*Communist Party v. SACB*, [367 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367001/usrep367001.pdf), and *Scales v. United States*, [367 U.S. 203](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367203/usrep367203.pdf). The McCarran registration order and the Smith Act membership clause upheld, both 5–4.'
    n: See [[cal.1961-01-23.court]]. Kennedy had to decide whether to enforce registration.
  - id: cal.1961-06-05.jobs-and-wages
    when: June 5
    date: '1961-06-05'
    thread: jobs-and-wages
    c: 'Logan, president of the American Vocational Association, before Clark''s subcommittee with the Association''s leaders: thirty-four amendments to the administration''s training bill; the question "who can do the job of training most efficiently and effectively." Twenty of them adopted in the negotiations after.'
    n: '[[w.sundquist-politics-and-policy]], 89. To check: *Training of the Unemployed: Hearings*, 179–82 (cited by [[w.sundquist-politics-and-policy]], 89 n.68). See [[cal.1961-05-29.jobs-and-wages]]. Names: Clark.'
    src:
      c: b44c69ce
      rows:
        - 'w.sundquist-politics-and-policy 89: all'
        - 'via w.sundquist-politics-and-policy 89 n.68: A-B'
    tags: [name:clark-joseph-s]
  - id: cal.1961-06-06.berlin-and-vienna
    when: June 6
    date: '1961-06-06'
    thread: berlin-and-vienna
    c: Report to the nation on Vienna. "A very sober two days."
    n: Radio and Television Report to the American People on Returning from Europe, [1961 Pub. Papers 441](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=499) (June 6, 1961). [[w.sorensen-kennedy]], 550–51 (the speech written overnight on the plane). See [[cal.1961-06-03.berlin-and-vienna]].
