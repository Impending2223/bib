    also: [soviet-union]
    c: 'Hanoi. A Soviet military mission under General Antonov, chief of the general staff, studies how to strengthen the DRV''s forces: a hundred new tanks for the Vinh region, an airfield there, an underground arms depot near Thanh Hóa; Soviet tanks and MiGs by night in parts by a new railway at Lào Cai through China, reassembled by Soviet specialists in jungle plants.'
