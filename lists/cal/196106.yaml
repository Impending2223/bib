        - 'via w.fursenko-one-hell-of-a 98 n.92: all'
  - id: cal.1961-06-10.berlin-and-vienna
    when: June 10
    date: '1961-06-10'
    thread: berlin-and-vienna
    c: 'Moscow releases the texts of the aides-mémoire handed Kennedy at Vienna: a peace treaty with Germany at once, the occupation rights ended by it, "a deadline period not exceeding six months." Rusk, on the flight home from London, had told Kennedy their release would mean the Soviets ready for a crisis over Berlin.'
    n: '[[w.reeves-president-kennedy]], 178–79; [[w.fursenko-khrushchevs-cold-war]], 365 (the aide-mémoire published by TASS). [[w.rusk-as-i-saw-it-1990]], 221. Check: Fursenko and Naftali have TASS publish the aide-mémoire June 9 (365). To check: *New York Times*, June 12, 1961 (cited by [[w.reeves-president-kennedy]], 178). Names: Rusk, Kennedy.'
    src:
      c: fb7d6343
      rows:
        - 'w.reeves-president-kennedy 178–79: all'
        - 'via w.reeves-president-kennedy 178 n.on-june-10: all'
