  - id: cal.1961-06-27.soviet-union-leadership
    when: June 27
    date: '1961-06-27'
    place: moscow
    thread: soviet-union-leadership
    also: [vietnam-hanoi, china]
    c: The Kremlin. Khrushchev receives Phạm Văn Đồng, premier of the DRV; Gromyko and Andropov sit in, and Lê Thanh Nghị with Phạm. By the Soviet record Khrushchev tells him of the Albanian party ("a gangster Party"), of China's communes, small furnaces and "paper tiger", the Tibet revolt and the Indian border, and that Mao "is in a hurry"; he offers the draft CPSU program for comment. The talk breaks off near lunch.
    n: '"[Record of Conversation between N.S. Khrushchev and Prime Minister Pham Van Dong of the Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/300877)" (June 27, 1961), RGANI, f. 52, op. 1, d. 555, ll. 94–110, contributed by Sergey Radchenko, trans. Gary Goldberg, Wilson Center Digital Archive. Secret copy no. 1; recorded by A. I. Glukhov of the Foreign Ministry''s translation bureau; a handwritten line says Khrushchev did not review the record. The record''s last lines, added by hand: Khrushchev, looking at the clock, says lunch is near and the time set for Phạm''s visit to Brezhnev is used up; the talk is interrupted. [[w.guan-vietnamese-communists-relations-with]], 197 (officially, cooperation and international questions; the same day Đồng calls on Brezhnev, a luncheon in his honor). To check: TASS in English, 3 July 1961, SWB/SU/682/A3/1 (cited by [[w.guan-vietnamese-communists-relations-with]], 197 n.66). Names: Khrushchev, Phạm Văn Đồng, Gromyko, Andropov, Mao Zedong. Check: the year the Archive posted the document; its page gives none.'
