    c: 'Peking 北京. Zhu De 朱德 meets Parifti 帕里夫蒂, the Albanian Ambassador. He says: yours is a heroic country, small in land and people, enemies on every side, yet it holds out and builds, which shows the unity of your Party and people and your strength; our Party has led China''s people in revolution and building for forty years; we have faults in our building, but we tell them openly to the masses and with their help correct them, and so go forward the better.'
