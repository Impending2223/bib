  - id: cal.1965-08-03.vietnam-2
    when: Aug. 3
    date: '1965-08-03'
    thread: vietnam
    c: 'Lodge, ambassador-designate, to Johnson, through Bundy, with Lansdale''s memorandum to him: "Personally, I don''t see how the Communists can be defeated without these positive steps"; the war cannot be won "short of genocide unless our side puts the war on a political footing." Bundy to Johnson: "Lansdale appears quite ready to take over MACV, and yet he''s not all wrong"; for Lansdale''s going.'
    n: '[FRUS 1964–68, III, doc. 103](https://history.state.gov/historicaldocuments/frus1964-68v03/d103) (Lodge''s memorandum). [[w.preston-war-council]], 211–12. To check: Lansdale to Lodge, Aug. 3, 1965, and Bundy to Johnson, Aug. 3, 1965, NSF, Memos to the President, Bundy, box 4, LBJ Library (cited by [[w.preston-war-council]], 212 n.7). Names: Lodge, Johnson, Bundy, Lansdale.'
    src:
      c: 71e612d2
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d103: A'
        - 'w.preston-war-council 211–12: all'
