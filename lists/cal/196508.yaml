  - id: cal.1965-08-15.india-and-china
    when: Aug. 15
    date: '1965-08-15'
    thread: india-and-china-kashmir
    c: Kashmir. India's army crosses the cease-fire line and takes heights above the Srinagar–Leh road near Kargil; the Haji Pir pass by Aug. 28.
    n: 'Check: the record. See [[cal.1965-08-05.india-and-china]].'
  - id: cal.1965-08-15.states-and-cities
    when: Aug. 15
    date: '1965-08-15'
    thread: states-and-cities
    c: 'Johnson on Los Angeles: "no greater wrong, in our democracy, than violent, willful disregard of law"; and "the unjust conditions from which disorder largely flows."'
    n: 'Statement by the President Following the Restoration of Order in Los Angeles, [1965 Pub. Papers 881](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=355) (Aug. 15, 1965). See [[cal.1965-08-11.states-and-cities]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:ca]
  - id: cal.1965-08-15.vietnam-congress
    when: Aug. 15
    date: '1965-08-15'
    thread: vietnam-congress
    c: 'Fulbright asks McGeorge Bundy to an informal coffee with the Foreign Relations Committee. Bundy declines on Johnson''s instructions: the President does not want "to get into the habit of sending Presidential aides to the Hill"; the committee might come to Bundy''s office or home for a drink. Not taken up.'
    n: '[[w.gibbons-u-s-government-and]], IV, 38 n.119. To check: Marcy to Fulbright (National Archives, RG 46, Marcy Chron File). Names: Fulbright, McGeorge Bundy, Marcy, Johnson.'
    tags: [name:fulbright-j-william, name:bundy-mcgeorge, name:marcy-carl, name:johnson-lyndon-b]
  - id: cal.1965-08-17.mississippi-ms
    when: Aug. 17
    date: '1965-08-17'
    thread: mississippi
    also: [state-constitutions, voting-rights]
    c: 'Mississippi''s voters approve the amendments of the June special session, 130,832 to 49,330, 72.6 percent: the interpretation test of 1954, the "good moral character" requirement, and the publication of applicants'' names repealed. Paul Johnson proposed them; the House refused twice before passing them. The poll tax for State elections stands. Check the date.'
    n: '"Mississippi: A Vote for Reason," [*Time*, Aug. 27, 1965](https://content.time.com/time/subscriber/article/0,33009,828317,00.html). [Freedom Democratic Party leaflet on the referendum](https://www.crmvet.org/docs/650817_mfdp_referendum.pdf). [[w.dittmer-local-people]], 344, 346. To check: [[w.lawson-black-ballots]]; [[w.davidson-quiet-revolution-in-the]]. See [[cal.1960-11-08.mississippi-ms]]; [[cal.1965-08-06.voting-rights]]. Names: Paul Johnson.'
    tags: [state:ms, name:johnson-paul-b-jr]
  - id: cal.1965-08-17.state-constitutions-mo
    when: Aug. 17
    date: '1965-08-17'
    thread: state-constitutions
    also: [legislatures]
    c: 'Missouri, special election. Adopted: No. 1, a governor may be elected twice, 204,987 to 75,968, 73.0 percent; No. 2, cities may sell industrial plants built with revenue bonds, 176,942 to 94,882, 65.1 percent. Refused: No. 3, a House of 168 apportioned by law after each census, a Senate of 34 districted by a commission, 112,211 to 160,568, 41.1 percent.'
    n: '[*Official Manual, State of Missouri, 1965–1966*, 1296–1297](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/38202). No. 1, H.J.R. 3, [*Laws of Missouri*, 1965, 676](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/57106): Mo. Const. art. IV, § 17 repealed and enacted anew, "No person shall be elected governor more than twice, and no person who has held the office of governor, or acted as governor, for more than two years of a term to which some other person was elected to the office of governor shall be elected to the office of governor more than once"; effective Sept. 16, 1965, [*Laws of Missouri*, 1965, pt. III, 815](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/56755). The bar it replaced, § 17 (1945): "The governor and state treasurer shall not be eligible for election as their own successors," [*Official Manual*, 1945–1946, 159](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/23064). See [[cal.1964-12-30.legislatures-mo]].'
    tags: [state:mo]
  - id: cal.1965-08-17.steel
    when: Aug. 17
    date: '1965-08-17'
    thread: steel
    c: 'Abel of the Steelworkers at the White House: "I made commitments to the members who elected me." Johnson likens him to Russell against the civil rights bill.'
    n: '[[w.dallek-flawed-giant]], 304. To check: [[w.califano-triumph-and-tragedy-of]]. See [[cal.1963-04-11.steel]]. Names: Abel, Johnson, Russell.'
    tags: [name:abel-i-w, name:johnson-lyndon-b, name:russell-richard-b]
  - id: cal.1965-08-17.vietnam
    when: Aug. 17
    date: '1965-08-17'
    thread: vietnam
    c: 'Eisenhower, at a news conference at Gettysburg: the Communists must be stopped in Vietnam, but his letter to Diệm made no commitment of a military kind.'
    n: '*New York Times*, Aug. 18, 1965. [[w.gibbons-u-s-government-and]], IV, 35. Check: Gibbons has the letter of "October 1955." Names: Eisenhower, Ngô Đình Diệm.'
    tags: [name:eisenhower-dwight-d, name:ngo-dinh-diem]
  - id: cal.1965-08-18.vietnam
    when: Aug. 18–24
    date: '1965-08-18'
    thread: vietnam-operations
    c: 'Operation Starlite, the Vạn Tường peninsula south of Chu Lai. Walt''s Marines, by sea and by helicopter, against the 1st Viet Cong Regiment, found by a deserter''s word: the first major attack by American troops alone. The Marines count 614 enemy dead; 45 Marines killed. Check the figures.'
    n: '[FRUS 1964–68, III, doc. 125](https://history.state.gov/historicaldocuments/frus1964-68v03/d125) (Sharp, Aug. 23). [[w.vietnam-victory-in-vietnam]], 157–58 (the operation, from Aug. 18, on the 1st Regiment at Vạn Tường); [[w.drea-mcnamara-clifford-and-the-2011]], 98, 115, 571 n.42 (the operation; the first big American ground operation; more than 600 of the enemy and 45 Marines killed). To check: [[w.shulimson-u-s-marines-in]]; [[w.lehrack-first-battle]]; [[w.andrew-first-fight]]. See [[cal.1965-07-28.vietnam]]. Names: Walt. Check: *Victory in Vietnam* gives 900 Americans killed or wounded, 13 aircraft shot down and 22 tanks and armored vehicles destroyed, half the 1st Regiment away collecting rice (158).'
    src:
      c: 8bcec1af
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d125: all'
        - 'w.vietnam-victory-in-vietnam 157–58: A-B'
        - 'w.drea-mcnamara-clifford-and-the-2011 98: A'
        - 'w.drea-mcnamara-clifford-and-the-2011 115: A-B'
        - 'w.drea-mcnamara-clifford-and-the-2011 571: C-D'
    tags: [name:walt-lewis-w, place:van-tuong]
  - id: cal.1965-08-18.desegregation-schools-ma
    when: Aug. 18
    date: '1965-08-18'
    thread: desegregation-schools
    also: [states-and-cities]
    c: 'Massachusetts. Volpe signs the Racial Imbalance Act: a school more than half nonwhite is imbalanced; the State Board of Education may withhold State aid from a district that does not submit and carry out a plan. Carter''s vigil ends, its 114th day.'
    n: '[St. 1965, c. 641, pp. 414–16](https://archives.lib.state.ma.us/bitstream/handle/2452/15229/1965acts0641.pdf). To check: [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]; [[w.delmont-why-busing-failed]]. See [[cal.1965-04-22.king-boston]]. Names: Volpe, Carter.'
    tags: [state:ma, city:boston, name:volpe-john-a, name:carter-vernon-e]
  - id: cal.1965-08-18.amendments
    when: Aug. 18
    date: '1965-08-18'
    thread: amendments
    also: [congress]
    c: 'House Judiciary Committee and its Subcommittee No. 5, Celler''s, open hearings on a four-year term for Representatives: nineteen joint resolutions, H.J. Res. 394 among them. To Mar. 1, 1966, the President''s text added.'
    n: 'Daily Digest, [111 Cong. Rec. D482](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=480) (Aug. 18, 1965). *Congressional Tenure of Office: Hearings before the House Committee on the Judiciary and Subcommittee No. 5*, 89th Cong. (1965–66) ([govinfo](https://www.govinfo.gov/app/details/CHRG-89hhrg60990)). [Congressional Research Service, *Proposals to Change the House Term of Office to Four Years*](https://www.everycrsreport.com/reports/RS21574.html) (2003). To check: [[w.kyvig-explicit-and-authentic-acts]]. Names: Celler.'
    tags: [name:celler-emanuel]
  - id: cal.1965-08-18.vietnam-2
    when: Aug. 18
    date: '1965-08-18'
    thread: vietnam
    c: 'Johnson, through Moyers at 9:50 p.m., to McGeorge Bundy: by morning, everything said in the SEATO debates and by Eisenhower in office that "builds our case," "the kind of brief Abe Fortas would prepare on Gideon"; Hughes of State out of bed to do the research; Goodpaster to helicopter to Gettysburg with it.'
    n: '[[w.gibbons-u-s-government-and]], IV, 36. To check: Moyers to McGeorge Bundy, Aug. 18, 1965 (LBJ Library, NSF Memos to the President—McGeorge Bundy). See [[cal.1965-08-17.vietnam]]. Names: Johnson, Moyers, McGeorge Bundy, Hughes, Goodpaster, Eisenhower, Fortas.'
    tags: [name:johnson-lyndon-b, name:moyers-bill, name:bundy-mcgeorge, name:hughes-thomas-l, name:goodpaster-andrew-j, name:eisenhower-dwight-d, name:fortas-abe]
  - id: cal.1965-08-19.poverty
    when: Aug. 19
    date: '1965-08-19'
    thread: poverty
    c: 'Senate passes the Economic Opportunity Amendments, H.R. 8283, [61–29](https://voteview.com/rollcall/RS0890199): $1.65 billion for the year. Amendments to keep the governors'' veto over community action, given by the 1964 act, fail, Aug. 18: [43–43](https://voteview.com/rollcall/RS0890192), [42–43](https://voteview.com/rollcall/RS0890193). The House passed its bill July 22, [245–158](https://voteview.com/rollcall/RH0890095).'
    n: '[111 Cong. Rec., Senate, Aug. 18, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-7-1.pdf); [Aug. 19, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-1-2.pdf); [111 Cong. Rec., House, July 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-4-2.pdf). See [[cal.1964-08-20.poverty]].'
  - id: cal.1965-08-19.japan-and-korea
    when: Aug. 19–21
    date: '1965-08-19'
    thread: japan
    also: [vietnam]
    c: 'Satō on Okinawa, the first Prime Minister there since the war: until Okinawa returns, the postwar period not over for Japan. Crowds for reversion the first night. Three weeks before, July 29, B-52s at Kadena flew a strike in South Vietnam from Okinawa; Satō''s concern conveyed.'
    n: 'FRUS 1964–68, XXIX, pt. 2, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d56), [59](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d59). To check: [[w.sarantakes-keystone]]; [[w.havens-fire-across-the-sea]]; [[w.sato-eisaku-nikki]]. See [[cal.1962-03-05.japan-and-korea]]; [[cal.1965-01-12.japan-and-korea]]. Names: Satō.'
    tags: [name:sato-eisaku]
  - id: cal.1965-08-19.states-and-cities
    when: Aug. 19
    date: '1965-08-19'
    thread: states-and-cities
    also: [king]
    c: 'Los Angeles. King and Rustin with Yorty and Chief Parker, nearly three hours: King asks a civilian review board for complaints against the police; Parker, no racial prejudice in Los Angeles, and no visit to the jailed rioters. King: Parker should go.'
    n: '[[w.garrow-bearing-the-cross]], 439–40. See [[cal.1965-08-11.states-and-cities]]. Names: King, Rustin, Yorty, Parker.'
    tags: [name:king-martin-luther-jr, name:rustin-bayard, name:yorty-sam, name:parker-william-h, state:ca, city:los-angeles]
  - id: cal.1965-08-19.vietnam
    when: Aug. 19
    date: '1965-08-19'
    thread: vietnam
    c: 'Goodpaster at Gettysburg, unannounced. Eisenhower: no question of his support; "continuity of purpose and policy, together with evolution of means and action." To the press after: circumstances changed since 1954; "there is only one thing a good American can do, and that is to support the President."'
    n: '*New York Times*, Aug. 20, 1965. [[w.gibbons-u-s-government-and]], IV, 36–37. To check: Goodpaster to McGeorge Bundy (LBJ Library, NSF Name File, President Eisenhower). See [[cal.1965-08-17.vietnam]]. Names: Goodpaster, Eisenhower.'
    tags: [name:goodpaster-andrew-j, name:eisenhower-dwight-d]
  - id: cal.1965-08-19.vietnam-support
    when: Aug. 19
    date: '1965-08-19'
    thread: vietnam-support
    c: 'Johnson lunches with Rusk and the senior officers of State: public support "generally satisfactory at present," more doubtful if the war goes on another year; the Department to put the case in public forums and to deal with the *New York Times* and "the ''Kennedy columnists''"; advance consultation with the congressional leaders and committees.'
    n: '[FRUS 1964–68, III, doc. 123](https://history.state.gov/historicaldocuments/frus1964-68v03/d123) (William Bundy''s notes). [[w.gibbons-u-s-government-and]], IV, 29. Made public: FRUS 1964–68, III (1996). Names: Johnson, Rusk, William Bundy.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:bundy-william]
  - id: cal.1965-08-20.alabama
    when: Aug. 20
    date: '1965-08-20'
    thread: alabama
    also: [voting-rights]
    c: Hayneville, Lowndes County. Coleman, a special deputy, kills Jonathan Daniels, an Episcopal seminarian, with a shotgun at a store door and wounds Father Morrisroe, a Catholic priest; both just out of jail with others arrested picketing at Fort Deposit Aug. 14. Johnson's telegrams to Daniels's mother and to Morrisroe, Aug. 23.
    n: 'Telegram to Mrs. Philip Daniels on the Death of Her Son Jonathan, a Theological Student, [1965 Pub. Papers 909](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=383) (Aug. 23, 1965); Telegram to the Reverend Richard Morrisroe Expressing Hope for His Recovery, [1965 Pub. Papers 912](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=386) (Aug. 23, 1965). To check: [[w.eagles-outside-agitator]]; [[w.jeffries-bloody-lowndes]]. See [[cal.1965-05-07.alabama]]. Names: Thomas Coleman, Daniels, Morrisroe, Johnson.'
    tags: [name:coleman-thomas-l, name:daniels-jonathan-m, name:morrisroe-richard-f, name:johnson-lyndon-b]
  - id: cal.1965-08-20.king
    when: Aug. 20
    date: '1965-08-20'
    thread: king
    also: [states-and-cities]
    c: 'King, back from Watts, and Johnson on the telephone: the riots'' cause economic, jobs the need. By King''s account Johnson explains his position on Vietnam, and pledges to speed Los Angeles''s antipoverty program.'
    n: '[Johnson and King, 5:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-martin-luther-king-lee-white-and-office), Conversation WH6508-07-8578 (Miller Center). [[w.garrow-bearing-the-cross]], 440. See [[cal.1965-08-11.states-and-cities]]. Names: King, Johnson.'
    tags: [name:king-martin-luther-jr, name:johnson-lyndon-b]
  - id: cal.1965-08-20.vietnam-support
    when: Aug. 20
    date: '1965-08-20'
    thread: vietnam-support
    c: The White House issues *Why Vietnam*, the statements on the American role since Eisenhower's of 1954; nothing of Truman's commitment of 1950. Thomson of the NSC staff, who drafted it, lost his fight for a question mark in the title.
    n: '[[w.gibbons-u-s-government-and]], IV, 30. To check: Thomson''s account: James C. Thomson, Jr., "How Could Vietnam Happen?," *Atlantic*, Apr. 1968, 50. Names: Thomson, Eisenhower, Truman.'
    tags: [name:thomson-james-c-jr, name:eisenhower-dwight-d, name:truman-harry-s]
  - id: cal.1965-08-21.defense
    when: Aug. 21
    date: '1965-08-21'
    thread: defense
    also: [congress]
    c: 'Johnson vetoes the military construction authorization, H.R. 8439: section 611 would bar closing or cutting any base until 120 days after a report to the Armed Services Committees, reports only from January to April. The Attorney General calls it repugnant to the Constitution.'
    n: 'Veto of the Military Authorization Bill, [1965 Pub. Papers 907](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=381) (Aug. 21, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 25, 1965). To check: [[w.shapley-promise-and-power]]. Names: Katzenbach.'
    tags: [name:johnson-lyndon-b, name:katzenbach-nicholas]
  - id: cal.1965-08-21.space
    when: Aug. 21
    date: '1965-08-21'
    thread: space
    c: 'Gemini 5 launched: Cooper and Conrad. A fuel cell''s trouble the first day; the rendezvous practice with a pod given up.'
    n: 'NASA, ["Gemini V"](https://www.nasa.gov/mission/gemini-v/). See [[cal.1965-03-23.space]]; [[cal.1965-06-03.space]]. Names: L. Gordon Cooper, Conrad.'
    tags: [name:cooper-l-gordon-jr, name:conrad-charles-jr]
  - id: cal.1965-08-22.opinion
    when: Aug. 22
    date: '1965-08-22'
    thread: opinion
    c: 'Gallup, July 16–21: would vote for a well-qualified man of one''s party for President who was a Jew, 80 percent; a Catholic, 87; a Negro, 59 (no, 34).'
    n: '[[w.gallup-poll]], III, 1958.'
  - id: cal.1965-08-23.vietnam
    when: Aug. 23
    date: '1965-08-23'
    thread: vietnam-force-levels
    c: 'The Joint Chiefs to McNamara, JCSM-643-65: the Phase I deployments worked out at Honolulu, Aug. 3–6, 34 battalions and 210,000 Americans for South Vietnam, 41,000 elsewhere in the Pacific and Southeast Asia.'
    n: 'FRUS 1964–68, III, doc. [132](https://history.state.gov/historicaldocuments/frus1964-68v03/d132), n. 2 (the editors'' account of the memorandum). [[w.drea-mcnamara-clifford-and-the-2011]], 47 (the 210,000, after the Honolulu conference). To check: [[w.cosmas-joint-chiefs-of-staff-2012]]; [[w.cosmas-united-states-army-in]]; JCSM-643-65, as excerpted in "US Deployments and Force Levels, RVN," Aug. 26, 1965, SecDef Subject Decimal files, Acc 70A-1265 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 47 n.89). See [[cal.1965-07-28.vietnam]]. Names: McNamara.'
    src:
      c: 7737e16b
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d132: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 47: A'
        - 'via w.drea-mcnamara-clifford-and-the-2011 47 n.89b: A'
    tags: [name:mcnamara-robert-s]
  - id: cal.1965-08-24.peace-corps
    when: Aug. 24
    date: '1965-08-24'
    thread: peace-corps
    c: 'Peace Corps Act extended, signed in the Rose Garden before volunteers and trainees, [79 Stat. 549](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg549.pdf): $115 million again, for fiscal 1966, $500,000 of it for research. Johnson had asked $125.2 million, Feb. 25. On Vietnam and the troops sent: this is "another kind of authority that will send Americans abroad."'
    n: 'Statute (K–J Cong. II.J.2). Remarks at the Signing of the Bill Extending the Peace Corps Act, [1965 Pub. Papers 912](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=386) (Aug. 24, 1965); Letter to the President of the Senate and to the Speaker of the House on the Peace Corps, [1965 Pub. Papers 219](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=295) (Feb. 25, 1965). See [[cal.1964-03-17.peace-corps]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-24.middle-east-yemen
    when: Aug. 24
    date: '1965-08-24'
    thread: middle-east-yemen
    c: 'Jidda. Faisal and Nasser agree on Yemen: a cease-fire; Saudi aid to the royalists stopped; a conference of republicans and royalists at Haradh from Nov. 23; the UAR''s forces out within ten months of that date; a plebiscite by Nov. 23, 1966.'
    n: '[FRUS 1964–68, XXI, doc. 379](https://history.state.gov/historicaldocuments/frus1964-68v21/d379). See [[cal.1965-08-11.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Nasser.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:nasser-gamal-abdel]
  - id: cal.1965-08-24.vietnam-congress
    when: Aug. 24
    date: '1965-08-24'
    thread: vietnam-congress
    also: [economy]
    c: 'House. Laird''s motion to recommit the Labor and HEW supplemental appropriation fails, [139–263](https://voteview.com/rollcall/RH0890123): the war''s needs upon us; the domestic spending cut first, the war''s cost for fiscal 1966 told to Congress. Most Republicans and some Southern Democrats for it.'
    n: '[111 Cong. Rec., House, Aug. 24, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-4-2.pdf), 21549–71 (the tally, 139–263, 21571; Voteview''s file counts 138–264). [[w.gibbons-u-s-government-and]], IV, 37. Names: Laird.'
    tags: [name:laird-melvin-r]
  - id: cal.1965-08-25.space
    when: Aug. 25
    date: '1965-08-25'
    thread: space
    also: [defense, voting-rights]
    c: 'News conference. The Defense Department to build a Manned Orbiting Laboratory, $1.5 billion: Douglas Aircraft to build the laboratory, a Titan III-C to launch it, a Gemini capsule to bring its two-man crews back; the first manned flight in 1968. 27,385 listed by the voting examiners in thirteen counties.'
    n: The President's News Conference, [1965 Pub. Papers 917](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=391) (Aug. 25, 1965). See [[cal.1965-08-21.space]]; [[cal.1965-08-07.voting-rights]].
    tags: [name:johnson-lyndon-b]
    aliases: [cal.1965-08-25.voting-rights]
  - id: cal.1965-08-25.economy
    when: Aug. 25
    date: '1965-08-25'
    thread: economy
    also: [transition-and-staff]
    c: 'Breakfast with the Cabinet and agency heads. Planning-programming-budgeting, the system McNamara brought to Defense, ordered throughout the Government: a planning staff under each head; goals, alternatives, and costs over several years; the 1968 budget in the new form. Schultze of the Budget Bureau to direct it.'
    n: 'Statement by the President to Cabinet Members and Agency Heads on the New Government-Wide Planning and Budgeting System, [1965 Pub. Papers 916](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=390) (Aug. 25, 1965); The President''s News Conference, [1965 Pub. Papers 917](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=391) (Aug. 25, 1965). To check: [[w.enthoven-how-much-is-enough]]; [[w.shapley-promise-and-power]]. Names: McNamara, Schultze.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:schultze-charles-l]
  - id: cal.1965-08-25.immigration
    when: Aug. 25
    date: '1965-08-25'
    thread: immigration
    c: 'House passes Celler''s immigration bill, H.R. 2580, [318–95](https://voteview.com/rollcall/RH0890125): the national-origins quotas ended; 170,000 a year from outside the Western Hemisphere, by preference for kin and skill. A ceiling of 115,000 on the Western Hemisphere from July 1, 1968, refused, [189–218](https://voteview.com/rollcall/RH0890124). Johnson''s letter to McCormack the same day.'
    n: '[111 Cong. Rec., House, Aug. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-5-2.pdf). Letter to the Speaker Urging House Action on the Immigration Bill, [1965 Pub. Papers 927](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=401) (Aug. 25, 1965). See [[cal.1965-01-13.immigration]]. Names: Celler, McCormack, Johnson.'
    tags: [name:celler-emanuel, name:mccormack-john-w, name:johnson-lyndon-b]
  - id: cal.1965-08-25.opinion
    when: Aug. 25
    date: '1965-08-25'
    thread: opinion
    also: [voting-rights]
    c: 'Gallup, July 16–21: persons of 18, 19 and 20 permitted to vote: yes 57 percent, no 39.'
    n: '[[w.gallup-poll]], III, 1958.'
  - id: cal.1965-08-25.vietnam
    when: Aug. 25
    date: '1965-08-25'
    thread: vietnam
    also: [vietnam-congress, republican-party-congress]
    c: 'House Republicans'' white paper, "Vietnam: Some Neglected Aspects of the Historical Record": the crisis since 1960, under the Democrats; Laos, the reversal on Diệm, the danger concealed, the campaign of 1964. McGeorge Bundy to Johnson: McNamara, Ball, William Bundy and Moyers think it "a pretty feeble effort," not worth a reply at the top; Dirksen has disavowed it.'
    n: '[111 Cong. Rec., House, Aug. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-5-2.pdf), 21838–44. [[w.gibbons-u-s-government-and]], IV, 37–38. To check: McGeorge Bundy to Johnson, Aug. 25, 1965 (LBJ Library, NSF Memos to the President—McGeorge Bundy). Names: McGeorge Bundy, Johnson, McNamara, Ball, William Bundy, Moyers, Dirksen.'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:mcnamara-robert-s, name:ball-george-w, name:bundy-william, name:moyers-bill, name:dirksen-everett]
  - id: cal.1965-08-25.vietnam-congress
    when: Aug. 25
    date: '1965-08-25'
    thread: vietnam-congress
    also: [defense]
    c: 'The Senate passes the defense appropriation for fiscal 1966, H.R. 9221, with the $1.7 billion for Southeast Asia, [89–0](https://voteview.com/rollcall/RS0890204). Morse votes for it: the troops there "must have every possible bit of protection." Gruening, who voted against the war''s money in May, for it too; he had talked with Johnson, at his own request, Aug. 19.'
    n: '[111 Cong. Rec., Senate, Aug. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-5-1.pdf), 21732. [[w.gibbons-u-s-government-and]], IV, 33, 38. See [[cal.1965-08-04.vietnam-congress]]. Names: Morse, Gruening, Johnson.'
    tags: [name:morse-wayne, name:gruening-ernest, name:johnson-lyndon-b]
  - id: cal.1965-08-26.states-and-cities
    when: Aug. 26
    date: '1965-08-26'
    thread: states-and-cities
    c: 'Johnson sends Ramsey Clark, Deputy Attorney General, with a federal team to Los Angeles, to work out with Brown and Yorty a program for the riot area: Watts has "the largest number of school dropouts," "the lowest median family income." Brown''s commission on the riots, McCone chairman, Christopher vice chairman, named Aug. 19. Check the date.'
    n: 'Statement by the President Upon Announcing a Program of Assistance to Los Angeles, [1965 Pub. Papers 933](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=407) (Aug. 26, 1965). See [[cal.1965-08-11.states-and-cities]]. Names: Johnson, Ramsey Clark, McCone, Brown, Yorty, Christopher.'
    tags: [name:johnson-lyndon-b, name:clark-ramsey, name:brown-edmund-g, name:yorty-sam, name:mccone-john-a, name:christopher-warren, state:ca]
  - id: cal.1965-08-26.jobs-and-wages
    when: Aug. 26
    date: '1965-08-26'
    thread: jobs-and-wages
    c: 'Public Works and Economic Development Act signed, [79 Stat. 552](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg552.pdf): grants and loans for public works and development facilities in areas of persistent unemployment and low income; districts of several counties; regional commissions. An Economic Development Administration in Commerce, Foley to head it, in place of the Area Redevelopment Administration. The House passed the bill Aug. 12, [246–138](https://voteview.com/rollcall/RH0890117).'
    n: 'Remarks at the Signing of the Public Works and Economic Development Act, [1965 Pub. Papers 930](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=404) (Aug. 26, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 25, 1965). [111 Cong. Rec., House, Aug. 12, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-3-2.pdf). To check: [[w.eller-uneven-ground]]. See [[cal.1961-05-01.program]]. Names: Foley.'
    tags: [name:johnson-lyndon-b, name:foley-eugene-p]
  - id: cal.1965-08-26.school-aid
    when: Aug. 26
    date: '1965-08-26'
    thread: school-aid
    c: 'House passes the Higher Education Act, H.R. 9567, [368–22](https://voteview.com/rollcall/RH0890126): grants for needy undergraduates, insured student loans, aid to college libraries and to developing colleges, community service programs.'
    n: '[111 Cong. Rec., House, Aug. 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-6-1.pdf). Statement by the President Following House Passage of the Higher Education Bill, [1965 Pub. Papers 936](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=410) (Aug. 26, 1965). Higher Education Act of 1965 (K–J Cong. II.J.2). To check: [[w.graham-uncertain-triumph]]. See [[cal.1965-01-12.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-27.robert-kennedy
    when: Aug. 27
    date: '1965-08-27'
    thread: robert-kennedy
    also: [latin-america]
    c: 'Johnson to Mann: his own Latin American plans to be announced quickly, "before Bobby is on every front page."'
    n: '[FRUS 1964–68, XXXI, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v31/d31). Made public: FRUS 1964–68, XXXI (2004). See [[cal.1965-05-06.robert-kennedy]]. Names: Johnson, Mann, Robert Kennedy.'
    tags: [name:johnson-lyndon-b, name:mann-thomas-c, name:kennedy-robert-f]
  - id: cal.1965-08-27.mississippi
    when: Aug. 27
    date: '1965-08-27'
    thread: mississippi
    c: 'Natchez. A bomb in his car outside the Armstrong Tire and Rubber plant gravely injures George Metcalf, president of the Natchez NAACP. That night Charles Evers to a mass meeting: "We''re armed, every last one of us."'
    n: '[[w.dittmer-local-people]], 353–55 (the quotation, 354). Check: the spelling, Metcalf or Metcalfe. Names: Charles Evers, Metcalf.'
    tags: [state:ms, name:evers-charles, name:metcalf-george]
  - id: cal.1965-08-27.vietnam
    when: Aug. 27
    date: '1965-08-27'
    thread: vietnam
    also: [defense]
    c: 'The Joint Chiefs to McNamara, JCSM-652-65, "Concept for Vietnam": the war "the single most critical international problem facing the United States"; intensified air and naval pressure on the North, its war-supporting power progressively destroyed and its routes cut; search and destroy in the South from secure bases; a buildup in Thailand. Never approved by the civilians.'
    n: '[FRUS 1964–68, III, doc. 130](https://history.state.gov/historicaldocuments/frus1964-68v03/d130). [[w.gibbons-u-s-government-and]], IV, 45–48, 50 (Wheeler''s later regret that he did not press for its approval). Made public: FRUS 1964–68, III (1996). Names: McNamara, Wheeler.'
    tags: [name:mcnamara-robert-s, name:wheeler-earle]
  - id: cal.1965-08-29.transition-and-staff
    when: Aug. 29
    date: '1965-08-29'
    thread: transition-and-staff
    also: [europe-and-the-alliance]
    c: News conference at the LBJ Ranch. Gronouski, Postmaster General, to be Ambassador to Poland, for "building bridges" to Eastern Europe. O'Brien, the President's assistant for congressional relations, to be Postmaster General, and to keep that work.
    n: 'The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 943](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=417) (Aug. 29, 1965). To check: [[w.obrien-no-final-victories]]. Names: Gronouski, O''Brien.'
    tags: [name:johnson-lyndon-b, name:gronouski-john-a, name:obrien-lawrence-f]
  - id: cal.1965-08-29.opinion
    when: Aug. 29
    date: '1965-08-29'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 5–10: the move to ask the UN to work out its own formula for peace in Vietnam: approve 74 percent, disapprove 13; Democrats 77, Republicans 71. How the war will end: most often, a compromise like Korea.'
    n: '[[w.gallup-poll]], III, 1958–59.'
  - id: cal.1965-08-29.space
    when: Aug. 29
    date: '1965-08-29'
    thread: space
    c: 'Gemini 5 down in the Atlantic: nearly eight days, 120 orbits; the endurance record passes to the United States. Johnson telephones Cooper and Conrad.'
    n: 'Remarks by Telephone to Astronauts Cooper and Conrad Following Completion of the Gemini 5 Mission, [1965 Pub. Papers 942](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=416) (Aug. 29, 1965); The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 943](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=417) (Aug. 29, 1965). See [[cal.1965-08-21.space]]. Names: Johnson, L. Gordon Cooper, Conrad.'
    tags: [name:johnson-lyndon-b, name:cooper-l-gordon-jr, name:conrad-charles-jr]
  - id: cal.1965-08-30.students
    when: Aug. 30
    date: '1965-08-30'
    thread: students
    also: [defense]
    c: 'Signed: knowingly to destroy or mutilate a draft card made a crime under the Universal Military Training and Service Act, [79 Stat. 586](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg586-2.pdf), up to five years and $10,000. The House passed it Aug. 10, [393–1](https://voteview.com/rollcall/RH0890114).'
    n: '[111 Cong. Rec., House, Aug. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-1-2.pdf). *United States v. O''Brien* (K–J Adm. II.H.1). To check: [[w.flynn-draft-1940-1973]]; [[w.baskir-chance-and-circumstance]]. See [[cal.1965-05-21.students]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-30.steel
    when: Aug. 30
    date: '1965-08-30'
    thread: steel
    also: [labor-disputes]
    c: 'Steel. With the Steelworkers'' contract to run out Sept. 1 (Check), Johnson brings Abel of the union and Cooper of United States Steel to the White House with Wirtz and Connor: a shutdown put off eight days, the bargaining moved to Washington. On television that evening. Aug. 26, he had telephoned both.'
    n: 'Televised Statement by the President Announcing Postponement of a Shutdown in the Steel Industry, [1965 Pub. Papers 952](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=426) (Aug. 30, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 26, 1965). [[w.dallek-flawed-giant]], 305. To check: [[w.sheahan-wage-price-guideposts]]; [[w.califano-triumph-and-tragedy-of]]. See [[cal.1963-04-11.steel]]. Names: Johnson, Abel, R. Conrad Cooper, Wirtz, Connor.'
    tags: [name:johnson-lyndon-b, name:abel-i-w, name:cooper-r-conrad, name:wirtz-w-willard, name:connor-john-t]
  - id: cal.1965-08-30.goldwater
    when: Aug. 30
    date: '1965-08-30'
    thread: goldwater
    c: 'Johnson calls Goldwater, 2:58 p.m.: asks after his health; invites him to the White House for a drink and a military briefing. The steel talks, the pay bills, Aspinall and the Central Arizona Project.'
    n: '[Johnson, Goldwater, Moyers, Roberts, and the operator, 2:58 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-barry-goldwater-bill-moyers-and-office), Conversation WH6508-13-8674 (Miller Center). To check: [[w.goldberg-barry-goldwater]]. See [[cal.1964-08-04.goldwater]]. Names: Johnson, Goldwater, Aspinall.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m, name:aspinall-wayne-n]
  - id: cal.1965-08-31.latin-america
    when: Aug. 31
    date: '1965-08-31'
    thread: latin-america-dominican-republic
    c: 'Santo Domingo. The Act of Dominican Reconciliation signed: Caamaño for the Constitutionalists, García-Godoy for the provisional government, Bunker and the OAS committee; Imbert, out Aug. 30, accepts it. García-Godoy provisional president; a general amnesty; arms collected; the Inter-American force''s withdrawal to be negotiated. García-Godoy sworn Sept. 3.'
    n: 'FRUS 1964–68, XXXII, docs. [127](https://history.state.gov/historicaldocuments/frus1964-68v32/d127), [128](https://history.state.gov/historicaldocuments/frus1964-68v32/d128). See [[cal.1965-04-28.latin-america]]; [[cal.1965-06-15.latin-america]]. Names: Caamaño-Deno, García-Godoy, Imbert-Barrera, Bunker.'
    tags: [name:caamano-deno-francisco, name:garcia-godoy-hector, name:imbert-barrera-antonio, name:bunker-ellsworth]
  - id: cal.1965-08-31.india-and-china
    when: Aug. 31
    date: '1965-08-31'
    thread: india-and-china-kashmir
    c: 'Komer to Johnson: the Pakistanis may send regulars into Kashmir.'
    n: '[FRUS 1964–68, XXV, doc. 176](https://history.state.gov/historicaldocuments/frus1964-68v25/d176). The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 943](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=417) (Aug. 29, 1965). See [[cal.1965-08-05.india-and-china]]. Names: Komer, Johnson.'
    tags: [name:komer-robert-w, name:johnson-lyndon-b]
