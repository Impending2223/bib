  - id: cal.1965-08-02.state-and-city-finance-us
    when: Aug. 2
    date: '1965-08-02'
    thread: state-and-city-finance
    also: [amendments]
    c: 'Johnson to *Newsweek*, its issue of Aug. 2, on revenue sharing: "What do they call it—the Heller plan?" "George Meany told me he''d never go for it." His task force of 1964 had recommended the plan; the proposal set aside after the recommendation reached the press, Dec. 1964 (Check). In July a Ripon Society–Republican Governors'' Association study for it. Illinois and Ohio apply to Congress this year for a convention on tax sharing.'
    n: '*Newsweek*, Aug. 2, 1965 (Check), quoted in *Ripon Forum*, [Sept. 1965, 1](https://riponsociety.org/wp-content/uploads/2023/12/1965-09_Vol-1_No-6.pdf). Applications: [111 Cong. Rec. 14,144](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-8-1.pdf#page=48), [25,237](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-3-1.pdf#page=2) (1965), as the [Article V Library](http://article5library.org/analyze.php?topic=Revenue+sharing&res=1&gen=0&ylimit=0) lists them. To check: [[w.heller-new-dimensions-of-political]]; [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1965-07-27.state-and-city-finance-us]]. Names: Johnson, Heller, Meany.'
    tags: [name:johnson-lyndon-b, name:heller-walter-w, name:meany-george, state:il, state:oh]
