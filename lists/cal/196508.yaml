  - id: cal.1965-08-01.desegregation-schools
    when: Aug. 1–2
    date: '1965-08-01'
    thread: desegregation-schools
    also: [mayors]
    c: 'Chicago, Bridgeport. The march to Daley''s home, Aug. 1, until 3 a.m. Aug. 2, his neighbors near rioting; Daley: the marchers are "trying to create tensions." The police arrest sixty-five of the marchers; Superintendent Orlando Wilson defends them. Raby wires the Attorney General for federal marshals.'
    n: '[[w.anderson-confronting-the-color-line]], 161–62; [[w.ralph-northern-protest]], 37 (Gregory leading; thousands of whites; the marchers arrested). Check: Ralph dates the hecklers'' attack the night of Aug. 2 (37). To check: Chicago Sun-Times, 4 August 1965 (cited by [[w.anderson-confronting-the-color-line]], 162 n.32). See [[cal.1965-07-29.desegregation-schools]]. Names: Daley, Raby.'
