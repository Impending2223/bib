  - id: cal.1965-08-03.vietnam-support
    when: Aug. 3–4
    date: '1965-08-03'
    thread: vietnam-support
    c: 'White House dinner on the government''s "information problem" on the war, Cater in the chair, McGeorge Bundy, Cooper, Califano, Marks, Chancellor, Greenfield and Morris Leibman, of Chicago, among those there; Leibman''s paper on a "10 to 20 year period of ''twilight war.''" Aug. 4, a luncheon: how to get the private sector to carry some of the burden; Cooper: the American Friends of Vietnam, the government''s hand "fairly hidden," helped to money. A Public Affairs Policy Committee for Vietnam follows, McGeorge Bundy chairman, meeting weekly.'
    n: '[FRUS 1964–68, III, doc. 105](https://history.state.gov/historicaldocuments/frus1964-68v03/d105) (Chase''s memorandum for the record of the dinner of Aug. 3). [[w.gibbons-u-s-government-and]], IV, 30–32; [[w.herring-lbj-and-vietnam]], 126, 130, 132 (the dinner, Bundy on the public''s patience; the American Friends of Vietnam, helped to private money; the committee, Bundy chairman, weekly); [[w.gibbons-u-s-government-and]], III, 266 n.124 (Cooper at the meeting of Aug. 4 on the "information problem"); [[w.wells-war-within]], 35. To check: Chase to Johnson, Aug. 4, 1965; Memorandum for the Record, "August 4 Luncheon Meeting on the Information Problem" (LBJ Library, NSF Country File, Vietnam; cited by [[w.herring-lbj-and-vietnam]], 132 n.51); agenda for the Tuesday lunch, Aug. 17, 1965, NSF Memos to the President, McGeorge Bundy, box 19, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 132 n.51); Leibman, memorandum on the information problem, attached to Cater to the participants, July 28, 1965 (cited by [[w.gibbons-u-s-government-and]], IV, 31 n.96); Folder "Public Affairs Policy Committee", NSF Country File, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 32 n.99). Names: Cater, McGeorge Bundy, Cooper, Califano, Marks, Chancellor, Greenfield.'
