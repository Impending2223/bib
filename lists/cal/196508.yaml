  - id: cal.1965-08-03.voting-rights
    when: Aug. 3–4
    date: '1965-08-03'
    thread: voting-rights
    c: House adopts the conference report on the voting rights bill, S. 1564, [328–74](https://voteview.com/rollcall/RH0890107); recommittal lost, [118–284](https://voteview.com/rollcall/RH0890106). Senate, Aug. 4, [79–18](https://voteview.com/rollcall/RS0890178). The House's ban on the poll tax dropped for a finding that it abridges the right to vote and a direction to the Attorney General to sue.
    n: '[111 Cong. Rec., House, Aug. 3, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-5-2.pdf); [111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf). [[w.branch-at-canaans-edge]], 275 (the House''s vote; the Senate''s passage); [[w.mann-walls-of-jericho]], 475; [[w.kotz-judgment-days]], 331 (328–74; the Senate 79–18 the next day, Smathers for); [[w.zelizer-fierce-urgency-of-now]], 219 (328–74; the Senate 79–18). See [[cal.1965-07-09.voting-rights]].'
