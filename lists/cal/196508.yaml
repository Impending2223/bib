  - id: cal.1965-08-03.vietnam
    when: Aug. 3
    date: '1965-08-03'
    thread: vietnam
    c: 'Gettysburg. Goodpaster briefs Eisenhower, an hour and a half, on the deployments, the plan for the troops'' use and the bombing. Eisenhower: no "driblets"; "swamp the enemy with overwhelming force." No figures announced: the buildup "sufficient to win."'
