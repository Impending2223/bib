  - id: cal.1965-08-01.vietnam
    when: Aug. 1
    date: '1965-08-01'
    thread: vietnam-hanoi
    also: [china]
    c: The Chinese antiaircraft artillery's 61st and 63rd Divisions enter North Vietnam from Yunnan and Guangxi, asked for by Hanoi July 24, for Yên Bái and the Kép area, to defend the two railways to China. By Chinese figures, sixteen divisions, over 150,000 men, served there by rotation to March 1969.
    n: '[[w.jian-maos-china-and-the]], 225–26 (by the Chinese military histories). Made public: the Chinese military histories Chen cites, Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), and Li Ke and Hao Shengzhang (1989), by his notes (357–58); in English, [[w.jian-chinas-involvement-in-the]]. Check: the Chinese figures. To check: Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), 1:550–53, and Li Ke and Hao Shengzhang (1989), 423 (cited by [[w.jian-maos-china-and-the]], 225 n.89, 226 n.91); Qu Aiguo, "Chinese Supporters in the Operations to Assist Vietnam and Resist America" (1989), 43, and Wang Dinglie, *Dangdai zhongguo kongjun* (1989), ch. 17 (cited by [[w.jian-maos-china-and-the]], 226 n.91, for the totals); the Vietnamese General Staff to the Chinese, July 24, 1965, and the reply, July 25, as the Chinese military histories give them (cited by [[w.jian-maos-china-and-the]], 225 n.89).'
    src:
      c: 7021e112
      rows:
