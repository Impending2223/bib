# Cal. LXIX August 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXIX
entries:
  - id: cal.1965-08-01.state-and-city-finance-ny
    when: Aug. 1
    date: '1965-08-01'
    thread: state-and-city-finance
    c: New York's first general State sales tax, 2 percent, in force, enacted in the spring at Rockefeller's request. Check the rate, the dates and the votes.
    n: 'Check: *Laws of New York*, 1965. [[w.connery-rockefeller-of-new-york]]; [[w.underwood-governor-rockefeller-in-new]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1965-08-02.state-and-city-finance-us
    when: Aug. 2
    date: '1965-08-02'
    thread: state-and-city-finance
    also: [amendments]
    c: 'Johnson to *Newsweek*, its issue of Aug. 2, on revenue sharing: "What do they call it—the Heller plan?" "George Meany told me he''d never go for it." His task force of 1964 had recommended the plan; the proposal set aside after the recommendation reached the press, Dec. 1964 (Check). In July a Ripon Society–Republican Governors'' Association study for it. Illinois and Ohio apply to Congress this year for a convention on tax sharing.'
    n: '*Newsweek*, Aug. 2, 1965 (Check), quoted in *Ripon Forum*, [Sept. 1965, 1](https://riponsociety.org/wp-content/uploads/2023/12/1965-09_Vol-1_No-6.pdf). Applications: [111 Cong. Rec. 14,144](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-8-1.pdf#page=48), [25,237](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-3-1.pdf#page=2) (1965), as the [Article V Library](http://article5library.org/analyze.php?topic=Revenue+sharing&res=1&gen=0&ylimit=0) lists them. [[w.heller-new-dimensions-of-political]]; [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1965-07-27.state-and-city-finance-us]]. Names: Johnson, Heller, Meany.'
    tags: [name:johnson-lyndon-b, name:heller-walter-w, name:meany-george, state:il, state:oh]
  - id: cal.1965-08-03.voting-rights
    when: Aug. 3–4
    date: '1965-08-03'
    thread: voting-rights
    c: House adopts the conference report on the voting rights bill, S. 1564, [328–74](https://voteview.com/rollcall/RH0890107); recommittal lost, [118–284](https://voteview.com/rollcall/RH0890106). Senate, Aug. 4, [79–18](https://voteview.com/rollcall/RS0890178). The House's ban on the poll tax dropped for a finding that it abridges the right to vote and a direction to the Attorney General to sue.
    n: '[111 Cong. Rec., House, Aug. 3, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-5-2.pdf); [111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf). See [[cal.1965-07-09.voting-rights]].'
  - id: cal.1965-08-03.desegregation-schools-philadelphia
    when: Aug. 3
    date: '1965-08-03'
    thread: desegregation-schools
    also: [king]
    c: 'Philadelphia. King at the wall of Girard College: "a kind of Berlin wall."'
    n: '[*New York Times*, Aug. 4, 1965](https://timesmachine.nytimes.com/timesmachine/1965/08/04/issue.html). See [[cal.1965-05-01.desegregation-schools-philadelphia]]. Names: King, Moore.'
    tags: [state:pa, city:philadelphia, name:king-martin-luther-jr, name:moore-cecil-b]
  - id: cal.1965-08-04.court
    when: Aug. 4
    date: '1965-08-04'
    thread: court
    also: [congress, states-and-cities, amendments, legislatures]
    c: Dirksen's amendment to let one house of a State legislature be apportioned on factors other than population, if the voters approve, fails in the Senate, [57–39](https://voteview.com/rollcall/RS0890177), seven short of two-thirds. Offered as a substitute for S.J. Res. 66, a resolution for National American Legion Baseball Week; the substitute taken, [59–39](https://voteview.com/rollcall/RS0890176); Javits's, [12–85](https://voteview.com/rollcall/RS0890175).
    n: '[111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf). S.J. Res. 2, 89th Cong. (Opp. II.H.2). [[w.dixon-democratic-representation]]. See [[cal.1964-09-10.court]]. Names: Dirksen, Javits.'
    tags: [name:dirksen-everett, name:javits-jacob-k]
  - id: cal.1965-08-05.vietnam
    when: Aug. 5
    date: '1965-08-05'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Cẩm Nê, south of Đà Nẵng, Aug. 3: Marines burn the hamlet''s huts, some with cigarette lighters, before a CBS camera. Safer''s film on the CBS evening news, Aug. 5. The Marines and the Pentagon dispute his account; Johnson complains to Stanton, CBS''s president. Check.'
    n: '[FRUS 1964–68, III, doc. 117](https://history.state.gov/historicaldocuments/frus1964-68v03/d117) (Aug. 10, the film discussed at the State Department). [[w.hammond-public-affairs]]; [[w.hallin-uncensored-war-the-media]]; [[w.arlen-living-room-war]]; [[w.shulimson-u-s-marines-in]]. See [[cal.1965-07-28.vietnam]]. Names: Safer, Stanton, Johnson.'
    tags: [name:safer-morley, name:stanton-frank, name:johnson-lyndon-b, place:cam-ne]
  - id: cal.1965-08-05.india-and-china
    when: Aug. 5
    date: '1965-08-05'
    thread: india-and-china-kashmir
    c: Kashmir. Armed men from Pakistan, Operation Gibraltar, cross the cease-fire line into the valley to raise a rising; none follows.
    n: '[FRUS 1964–68, XXV, doc. 160](https://history.state.gov/historicaldocuments/frus1964-68v25/d160) (editorial note). [[w.kux-united-states-and-pakistan]]. See [[cal.1965-06-30.india-and-china]].'
  - id: cal.1965-08-06.voting-rights
    when: Aug. 6
    date: '1965-08-06'
    thread: voting-rights
    c: Voting Rights Act signed in the President's Room off the Senate chamber, after Johnson's address in the Rotunda at noon, [79 Stat. 437](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg437.pdf). Literacy tests and like devices suspended where under half the voting-age population was registered on Nov. 1, 1964, or voted that November; federal examiners to list voters there; new voting rules there to be cleared by the Attorney General or the District Court in Washington. "The vote is the most powerful instrument ever devised by man for breaking down injustice."
    n: 'Remarks in the Capitol Rotunda at the Signing of the Voting Rights Act, [1965 Pub. Papers 840](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=314) (Aug. 6, 1965). Statute (K–J Cong. II.J.2). [President''s Daily Diary, Aug. 6, 1965](https://catalog.archives.gov/id/192457), image 2 (LBJ Library; National Archives Catalog). See [[cal.1965-03-07.voting-rights]]; [[cal.1965-03-15.voting-rights]]; [[cal.1965-08-03.voting-rights]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, bill:voting-rights-1965]
  - id: cal.1965-08-06.opinion
    when: Aug. 6
    date: '1965-08-06'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, July 16–21: the Johnson Administration pushing integration too fast, 40 percent; not fast enough, 13; about right, 38. Southern whites 69 too fast; whites outside the South 36. Republicans 46 too fast; Democrats 35; independents 43.'
    n: '[[w.gallup-poll]], III, 1955–56. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-07.voting-rights
    when: Aug. 7
    date: '1965-08-07'
    thread: voting-rights
    also: [civil-rights-the-executive]
    c: 'The act at work. The coverage published: Alabama, Alaska, Georgia, Louisiana, Mississippi, South Carolina, Virginia, 26 counties of North Carolina, one of Arizona. Suit against Mississippi''s poll tax (Check the date).'
    n: '[30 Fed. Reg. 9897](https://www.govinfo.gov/app/details/FR-1965-08-07) (Aug. 7, 1965). Remarks in the Capitol Rotunda at the Signing of the Voting Rights Act, [1965 Pub. Papers 840](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=314) (Aug. 6, 1965). [[w.landsberg-enforcing-civil-rights]]. See [[cal.1965-08-06.voting-rights]].'
  - id: cal.1965-08-09.voting-rights
    when: Aug. 9
    date: '1965-08-09'
    thread: voting-rights
    also: [civil-rights-the-executive]
    c: 'Katzenbach certifies nine counties for examiners: Dallas, Hale, Lowndes, Marengo in Alabama; East Carroll, East Feliciana, Plaquemines in Louisiana; Leflore and Madison in Mississippi.'
    n: '[30 Fed. Reg. 9970–71](https://www.govinfo.gov/app/details/FR-1965-08-10) (Aug. 10, 1965). See [[cal.1965-08-07.voting-rights]]. Names: Katzenbach.'
    tags: [name:katzenbach-nicholas]
  - id: cal.1965-08-10.cities-and-housing
    when: Aug. 10
    date: '1965-08-10'
    thread: cities-and-housing
    c: 'Housing and Urban Development Act of 1965 signed, [79 Stat. 451](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg451.pdf). Rent supplements: the Government to pay the owner of private nonprofit or limited-dividend housing what the rent exceeds a quarter of a low-income tenant''s income; payments up to $30 million a year at first, rising to $150 million a year from July 1968. FHA insurance, urban renewal, public and college housing extended. The Senate had kept rent supplements July 15, [40–47](https://voteview.com/rollcall/RS0890159) on striking them, and passed the bill, [54–30](https://voteview.com/rollcall/RS0890162); conference report, House, July 27, [251–168](https://voteview.com/rollcall/RH0890098). Aug. 11, the Senate passes the bill for a Department of Housing and Urban Development, [57–33](https://voteview.com/rollcall/RS0890179).'
    n: 'Remarks at the Signing of the Housing and Urban Development Act, [1965 Pub. Papers 861](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=335) (Aug. 10, 1965). [111 Cong. Rec., Senate, July 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-7-1.pdf); [111 Cong. Rec., House, July 27, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-7-2.pdf); [111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf). [[w.pritchett-robert-clifton-weaver-and]]. See [[cal.1965-06-16.cities-and-housing]]; [[cal.1965-06-30.cities-and-housing]]. Names: Weaver.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c]
  - id: cal.1965-08-10.legislatures-nd
    when: Aug. 10
    date: '1965-08-10'
    thread: legislatures
    c: North Dakota. The federal court holds House Bill 566, the 1965 Assembly's apportionment, invalid, and devises its own, on the "Smith plan" prepared for the Legislative Research Committee.
    n: '*Paulson v. Meier*, [246 F. Supp. 36](https://static.case.law/f-supp/246/case-pdfs/0036-01.pdf) (D.N.D. 1965). See [[cal.1964-07-27.legislatures-nd]].'
    tags: [state:nd]
  - id: cal.1965-08-10.india-and-china
    when: Aug. 10
    date: '1965-08-10'
    thread: india-and-china-kashmir
    c: 'NSAM 337: alternatives to the intelligence facilities in Pakistan to be readied.'
    n: '[FRUS 1964–68, XXV, doc. 168](https://history.state.gov/historicaldocuments/frus1964-68v25/d168). See [[cal.1965-08-05.india-and-china]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge]
  - id: cal.1965-08-10.voting-rights
    when: Aug. 10
    date: '1965-08-10'
    thread: voting-rights
    also: [civil-rights-the-executive]
    c: Federal examiners at work; suits against the poll tax in Texas, Alabama, Virginia. Check the dates of the suits.
    n: 'Check: the record. See [[cal.1965-08-07.voting-rights]].'
  - id: cal.1965-08-11.states-and-cities
    when: Aug. 11–16
    date: '1965-08-11'
    thread: states-and-cities
    c: Watts, Los Angeles. A highway patrolman arrests Marquette Frye for drunken driving at 116th Street and Avalon, Aug. 11; a crowd gathers; six days of rioting, looting, and burning. Brown in Greece; Lieutenant Governor Anderson sends the Guard, on the streets Aug. 13, nearly 14,000 by the end; a curfew over the district. 34 dead, more than 1,000 hurt, some 4,000 arrested. Check the figures.
    n: 'Governor''s Commission on the Los Angeles Riots, [*Violence in the City—An End or a Beginning?*](https://archive.org/details/ViolenceInCity) (1965). [[w.cohen-burn-baby-burn]]; [[w.conot-rivers-of-blood-years]]; [[w.horne-fire-this-time]]; [[w.flamm-law-and-order]]; [[w.branch-at-canaans-edge]]. See [[cal.1964-07-18.states-and-cities]]. Names: Frye, Glenn Anderson, Brown.'
    tags: [name:frye-marquette, name:brown-edmund-g, name:anderson-glenn-m, state:ca]
  - id: cal.1965-08-11.middle-east
    when: Aug. 11
    date: '1965-08-11'
    thread: middle-east-yemen
    c: Yemen. Faisal, through Sultan, asks for an American fighter squadron, a destroyer visit hastened and more near the Yemen border.
    n: '[FRUS 1964–68, XXI, doc. 377](https://history.state.gov/historicaldocuments/frus1964-68v21/d377) (Aug. 15). [[w.ferris-nassers-gamble]]; [[w.orkaby-beyond-the-arab-cold]]. See [[cal.1962-09-26.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Sultan ibn Abd al-Aziz Al Saud.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:sultan-ibn-abd-al-aziz-al-saud]
  - id: cal.1965-08-13.japan-and-korea
    when: Aug. 13
    date: '1965-08-13'
    thread: japan-and-korea-korean-troops
    also: [vietnam]
    c: Korea's National Assembly authorizes a combat division for Vietnam, 101–1, 2 abstaining, the opposition absent. Johnson's message of thanks to Park.
    n: 'Message to the President of Korea on Learning of Plans To Dispatch Korean Troops to South Viet-Nam, [1965 Pub. Papers 879](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=353) (Aug. 13, 1965). FRUS 1964–68, XXIX, pt. 1, docs. [53](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d53), [56](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d56), [57](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d57), [58](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d58). See [[cal.1965-05-17.japan-and-korea]]. Names: Johnson, Park.'
    tags: [name:johnson-lyndon-b, name:park-chung-hee]
  - id: cal.1965-08-13.middle-east-yemen
    when: Aug. 13
    date: '1965-08-13'
    thread: middle-east-yemen
    c: 'Komer to Johnson on Faisal''s request: the destroyer visit, no air unit.'
    n: '[FRUS 1964–68, XXI, doc. 376](https://history.state.gov/historicaldocuments/frus1964-68v21/d376). See [[cal.1965-08-11.middle-east]]. Names: Komer, Johnson.'
    tags: [name:komer-robert-w, name:johnson-lyndon-b]
  - id: cal.1965-08-14.japan-and-korea
    when: Aug. 14
    date: '1965-08-14'
    thread: japan-and-korea-normalization
    also: [japan]
    c: Korea's National Assembly approves the treaty with Japan, the opposition absent. Johnson's statement, Aug. 15. Check the date.
    n: 'Statement by the President on the Ratification by Korea of the Basic Relations Treaty With Japan, [1965 Pub. Papers 882](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=356) (Aug. 15, 1965). FRUS 1964–68, XXIX, pt. 1, docs. [365](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d365), [366](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d366). The White House, Dec. 18, gives Aug. 13. See [[cal.1965-06-22.japan-and-korea]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-15.india-and-china
    when: Aug. 15
    date: '1965-08-15'
    thread: india-and-china-kashmir
    c: Kashmir. India's army crosses the cease-fire line and takes heights above the Srinagar–Leh road near Kargil; the Haji Pir pass by Aug. 28.
    n: 'Check: the record. See [[cal.1965-08-05.india-and-china]].'
  - id: cal.1965-08-15.states-and-cities
    when: Aug. 15
    date: '1965-08-15'
    thread: states-and-cities
    c: 'Johnson on Los Angeles: "no greater wrong, in our democracy, than violent, willful disregard of law"; and "the unjust conditions from which disorder largely flows."'
    n: 'Statement by the President Following the Restoration of Order in Los Angeles, [1965 Pub. Papers 881](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=355) (Aug. 15, 1965). See [[cal.1965-08-11.states-and-cities]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:ca]
  - id: cal.1965-08-17.mississippi-ms
    when: Aug. 17
    date: '1965-08-17'
    thread: mississippi
    also: [state-constitutions, voting-rights]
    c: 'Mississippi''s voters approve the amendments of the June special session, 130,832 to 49,330: the interpretation test of 1954, the "good moral character" requirement, and the publication of applicants'' names repealed. Paul Johnson proposed them; the House refused twice before passing them. The poll tax for State elections stands. Check the date.'
    n: '"Mississippi: A Vote for Reason," [*Time*, Aug. 27, 1965](https://content.time.com/time/subscriber/article/0,33009,828317,00.html). [Freedom Democratic Party leaflet on the referendum](https://www.crmvet.org/docs/650817_mfdp_referendum.pdf). [[w.lawson-black-ballots]]; [[w.dittmer-local-people]], 344, 346; [[w.davidson-quiet-revolution-in-the]]. See [[cal.1960-11-08.mississippi-ms]]; [[cal.1965-08-06.voting-rights]]. Names: Paul Johnson.'
    tags: [state:ms, name:johnson-paul-b-jr]
  - id: cal.1965-08-17.state-constitutions-mo
    when: Aug. 17
    date: '1965-08-17'
    thread: state-constitutions
    also: [legislatures]
    c: 'Missouri, special election. Adopted: No. 1, a governor may be elected twice, 204,987 to 75,968; No. 2, cities may sell industrial plants built with revenue bonds, 176,942 to 94,882. Refused: No. 3, a House of 168 apportioned by law after each census, a Senate of 34 districted by a commission, 112,211 to 160,568.'
    n: '[*Official Manual, State of Missouri, 1965–1966*, 1296–1297](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/38202). See [[cal.1964-12-30.legislatures-mo]].'
    tags: [state:mo]
  - id: cal.1965-08-18.vietnam
    when: Aug. 18–24
    date: '1965-08-18'
    thread: vietnam-operations
    c: 'Operation Starlite, the Vạn Tường peninsula south of Chu Lai. Walt''s Marines, by sea and by helicopter, against the 1st Viet Cong Regiment, found by a deserter''s word: the first major attack by American troops alone. The Marines count 614 enemy dead; 45 Marines killed. Check the figures.'
    n: '[FRUS 1964–68, III, doc. 125](https://history.state.gov/historicaldocuments/frus1964-68v03/d125) (Sharp, Aug. 23). [[w.shulimson-u-s-marines-in]]; [[w.lehrack-first-battle]]; [[w.andrew-first-fight]]; [[w.vietnam-victory-in-vietnam]], 157–58; [[w.drea-mcnamara-clifford-and-the-2011]], 98, 115. See [[cal.1965-07-28.vietnam]]. Names: Walt. Check: *Victory in Vietnam* gives 900 Americans killed or wounded, 13 aircraft shot down and 22 tanks and armored vehicles destroyed, half the 1st Regiment away collecting rice (158).'
    tags: [name:walt-lewis-w, place:van-tuong]
  - id: cal.1965-08-18.desegregation-schools-ma
    when: Aug. 18
    date: '1965-08-18'
    thread: desegregation-schools
    also: [states-and-cities]
    c: 'Massachusetts. Volpe signs the Racial Imbalance Act: a school more than half nonwhite is imbalanced; the State Board of Education may withhold State aid from a district that does not submit and carry out a plan. Carter''s vigil ends, its 114th day.'
    n: '[St. 1965, c. 641, pp. 414–16](https://archives.lib.state.ma.us/bitstream/handle/2452/15229/1965acts0641.pdf). [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]; [[w.delmont-why-busing-failed]]. See [[cal.1965-04-22.king-boston]]. Names: Volpe, Carter.'
    tags: [state:ma, city:boston, name:volpe-john-a, name:carter-vernon-e]
  - id: cal.1965-08-18.amendments
    when: Aug. 18
    date: '1965-08-18'
    thread: amendments
    also: [congress]
    c: 'House Judiciary Committee and its Subcommittee No. 5, Celler''s, open hearings on a four-year term for Representatives: nineteen joint resolutions, H.J. Res. 394 among them. To Mar. 1, 1966, the President''s text added.'
    n: 'Daily Digest, [111 Cong. Rec. D482](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=480) (Aug. 18, 1965). *Congressional Tenure of Office: Hearings before the House Committee on the Judiciary and Subcommittee No. 5*, 89th Cong. (1965–66) ([govinfo](https://www.govinfo.gov/app/details/CHRG-89hhrg60990)). [Congressional Research Service, *Proposals to Change the House Term of Office to Four Years*](https://www.everycrsreport.com/reports/RS21574.html) (2003). [[w.kyvig-explicit-and-authentic-acts]]. Names: Celler.'
    tags: [name:celler-emanuel]
  - id: cal.1965-08-19.poverty
    when: Aug. 19
    date: '1965-08-19'
    thread: poverty
    c: 'Senate passes the Economic Opportunity Amendments, H.R. 8283, [61–29](https://voteview.com/rollcall/RS0890199): $1.65 billion for the year. Amendments to keep the governors'' veto over community action, given by the 1964 act, fail, Aug. 18: [43–43](https://voteview.com/rollcall/RS0890192), [42–43](https://voteview.com/rollcall/RS0890193). The House passed its bill July 22, [245–158](https://voteview.com/rollcall/RH0890095).'
    n: '[111 Cong. Rec., Senate, Aug. 18, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-7-1.pdf); [Aug. 19, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-1-2.pdf); [111 Cong. Rec., House, July 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-4-2.pdf). See [[cal.1964-08-20.poverty]].'
  - id: cal.1965-08-19.japan-and-korea
    when: Aug. 19–21
    date: '1965-08-19'
    thread: japan
    also: [vietnam]
    c: 'Satō on Okinawa, the first Prime Minister there since the war: until Okinawa returns, the postwar period not over for Japan. Crowds for reversion the first night. Three weeks before, July 29, B-52s at Kadena flew a strike in South Vietnam from Okinawa; Satō''s concern conveyed.'
    n: 'FRUS 1964–68, XXIX, pt. 2, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d56), [59](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d59). [[w.sarantakes-keystone]]; [[w.havens-fire-across-the-sea]]; [[w.sato-eisaku-nikki]]. See [[cal.1962-03-05.japan-and-korea]]; [[cal.1965-01-12.japan-and-korea]]. Names: Satō.'
    tags: [name:sato-eisaku]
  - id: cal.1965-08-20.alabama
    when: Aug. 20
    date: '1965-08-20'
    thread: alabama
    also: [voting-rights]
    c: Hayneville, Lowndes County. Coleman, a special deputy, kills Jonathan Daniels, an Episcopal seminarian, with a shotgun at a store door and wounds Father Morrisroe, a Catholic priest; both just out of jail with others arrested picketing at Fort Deposit Aug. 14. Johnson's telegrams to Daniels's mother and to Morrisroe, Aug. 23.
    n: 'Telegram to Mrs. Philip Daniels on the Death of Her Son Jonathan, a Theological Student, [1965 Pub. Papers 909](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=383) (Aug. 23, 1965); Telegram to the Reverend Richard Morrisroe Expressing Hope for His Recovery, [1965 Pub. Papers 912](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=386) (Aug. 23, 1965). [[w.eagles-outside-agitator]]; [[w.jeffries-bloody-lowndes]]. See [[cal.1965-05-07.alabama]]. Names: Thomas Coleman, Daniels, Morrisroe, Johnson.'
    tags: [name:coleman-thomas-l, name:daniels-jonathan-m, name:morrisroe-richard-f, name:johnson-lyndon-b]
  - id: cal.1965-08-21.defense
    when: Aug. 21
    date: '1965-08-21'
    thread: defense
    also: [congress]
    c: 'Johnson vetoes the military construction authorization, H.R. 8439: section 611 would bar closing or cutting any base until 120 days after a report to the Armed Services Committees, reports only from January to April. The Attorney General calls it repugnant to the Constitution.'
    n: 'Veto of the Military Authorization Bill, [1965 Pub. Papers 907](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=381) (Aug. 21, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 25, 1965). [[w.shapley-promise-and-power]]. Names: Katzenbach.'
    tags: [name:johnson-lyndon-b, name:katzenbach-nicholas]
  - id: cal.1965-08-21.space
    when: Aug. 21
    date: '1965-08-21'
    thread: space
    c: 'Gemini 5 launched: Cooper and Conrad. A fuel cell''s trouble the first day; the rendezvous practice with a pod given up.'
    n: 'NASA, ["Gemini V"](https://www.nasa.gov/mission/gemini-v/). See [[cal.1965-03-23.space]]; [[cal.1965-06-03.space]]. Names: L. Gordon Cooper, Conrad.'
    tags: [name:cooper-l-gordon-jr, name:conrad-charles-jr]
  - id: cal.1965-08-22.opinion
    when: Aug. 22
    date: '1965-08-22'
    thread: opinion
    c: 'Gallup, July 16–21: would vote for a well-qualified man of one''s party for President who was a Jew, 80 percent; a Catholic, 87; a Negro, 59 (no, 34).'
    n: '[[w.gallup-poll]], III, 1958.'
  - id: cal.1965-08-24.peace-corps
    when: Aug. 24
    date: '1965-08-24'
    thread: peace-corps
    c: 'Peace Corps Act extended, signed in the Rose Garden before volunteers and trainees, [79 Stat. 549](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg549.pdf): $115 million again, for fiscal 1966, $500,000 of it for research. Johnson had asked $125.2 million, Feb. 25. On Vietnam and the troops sent: this is "another kind of authority that will send Americans abroad."'
    n: 'Statute (K–J Cong. II.J.2). Remarks at the Signing of the Bill Extending the Peace Corps Act, [1965 Pub. Papers 912](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=386) (Aug. 24, 1965); Letter to the President of the Senate and to the Speaker of the House on the Peace Corps, [1965 Pub. Papers 219](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=295) (Feb. 25, 1965). See [[cal.1964-03-17.peace-corps]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-24.middle-east-yemen
    when: Aug. 24
    date: '1965-08-24'
    thread: middle-east-yemen
    c: 'Jidda. Faisal and Nasser agree on Yemen: a cease-fire; Saudi aid to the royalists stopped; a conference of republicans and royalists at Haradh from Nov. 23; the UAR''s forces out within ten months of that date; a plebiscite by Nov. 23, 1966.'
    n: '[FRUS 1964–68, XXI, doc. 379](https://history.state.gov/historicaldocuments/frus1964-68v21/d379). See [[cal.1965-08-11.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Nasser.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:nasser-gamal-abdel]
  - id: cal.1965-08-25.space
    when: Aug. 25
    date: '1965-08-25'
    thread: space
    also: [defense]
    c: 'News conference. The Defense Department to build a Manned Orbiting Laboratory, $1.5 billion: Douglas Aircraft to build the laboratory, a Titan III-C to launch it, a Gemini capsule to bring its two-man crews back; the first manned flight in 1968.'
    n: The President's News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 25, 1965). See [[cal.1965-08-21.space]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-25.economy
    when: Aug. 25
    date: '1965-08-25'
    thread: economy
    also: [transition-and-staff]
    c: 'Breakfast with the Cabinet and agency heads. Planning-programming-budgeting, the system McNamara brought to Defense, ordered throughout the Government: a planning staff under each head; goals, alternatives, and costs over several years; the 1968 budget in the new form. Schultze of the Budget Bureau to direct it.'
    n: 'Statement by the President to Cabinet Members and Agency Heads on the New Government-Wide Planning and Budgeting System, [1965 Pub. Papers 916](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=390) (Aug. 25, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 25, 1965). [[w.enthoven-how-much-is-enough]]; [[w.shapley-promise-and-power]]. Names: McNamara, Schultze.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:schultze-charles-l]
  - id: cal.1965-08-25.immigration
    when: Aug. 25
    date: '1965-08-25'
    thread: immigration
    c: 'House passes Celler''s immigration bill, H.R. 2580, [318–95](https://voteview.com/rollcall/RH0890125): the national-origins quotas ended; 170,000 a year from outside the Western Hemisphere, by preference for kin and skill. A ceiling of 115,000 on the Western Hemisphere from July 1, 1968, refused, [189–218](https://voteview.com/rollcall/RH0890124). Johnson''s letter to McCormack the same day.'
    n: '[111 Cong. Rec., House, Aug. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-5-2.pdf). Letter to the Speaker Urging House Action on the Immigration Bill, [1965 Pub. Papers 927](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=401) (Aug. 25, 1965). See [[cal.1965-01-13.immigration]]. Names: Celler, McCormack, Johnson.'
    tags: [name:celler-emanuel, name:mccormack-john-w, name:johnson-lyndon-b]
  - id: cal.1965-08-25.opinion
    when: Aug. 25
    date: '1965-08-25'
    thread: opinion
    also: [voting-rights]
    c: 'Gallup, July 16–21: persons of 18, 19 and 20 permitted to vote: yes 57 percent, no 39.'
    n: '[[w.gallup-poll]], III, 1958.'
  - id: cal.1965-08-25.voting-rights
    when: Aug. 25
    date: '1965-08-25'
    thread: voting-rights
    c: 'News conference: 27,385 listed by the examiners in thirteen counties.'
    n: 'The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 25, 1965). See [[cal.1965-08-07.voting-rights]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-26.states-and-cities
    when: Aug. 26
    date: '1965-08-26'
    thread: states-and-cities
    c: 'Johnson sends Ramsey Clark, Deputy Attorney General, with a federal team to Los Angeles, to work out with Brown and Yorty a program for the riot area: Watts has "the largest number of school dropouts," "the lowest median family income." Brown''s commission on the riots, McCone chairman, Christopher vice chairman, named Aug. 19. Check the date.'
    n: 'Statement by the President Upon Announcing a Program of Assistance to Los Angeles, [1965 Pub. Papers 933](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=407) (Aug. 26, 1965). See [[cal.1965-08-11.states-and-cities]]. Names: Johnson, Ramsey Clark, McCone, Brown, Yorty, Christopher.'
    tags: [name:johnson-lyndon-b, name:clark-ramsey, name:brown-edmund-g, name:yorty-sam, name:mccone-john-a, name:christopher-warren, state:ca]
  - id: cal.1965-08-26.jobs-and-wages
    when: Aug. 26
    date: '1965-08-26'
    thread: jobs-and-wages
    c: 'Public Works and Economic Development Act signed, [79 Stat. 552](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg552.pdf): grants and loans for public works and development facilities in areas of persistent unemployment and low income; districts of several counties; regional commissions. An Economic Development Administration in Commerce, Foley to head it, in place of the Area Redevelopment Administration. The House passed the bill Aug. 12, [246–138](https://voteview.com/rollcall/RH0890117).'
    n: 'Remarks at the Signing of the Public Works and Economic Development Act, [1965 Pub. Papers 930](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=404) (Aug. 26, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 25, 1965). [111 Cong. Rec., House, Aug. 12, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-3-2.pdf). [[w.eller-uneven-ground]]. See [[cal.1961-05-01.program]]. Names: Foley.'
    tags: [name:johnson-lyndon-b, name:foley-eugene-p]
  - id: cal.1965-08-26.school-aid
    when: Aug. 26
    date: '1965-08-26'
    thread: school-aid
    c: 'House passes the Higher Education Act, H.R. 9567, [368–22](https://voteview.com/rollcall/RH0890126): grants for needy undergraduates, insured student loans, aid to college libraries and to developing colleges, community service programs.'
    n: '[111 Cong. Rec., House, Aug. 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-6-1.pdf). Statement by the President Following House Passage of the Higher Education Bill, [1965 Pub. Papers 936](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=410) (Aug. 26, 1965). Higher Education Act of 1965 (K–J Cong. II.J.2). [[w.graham-uncertain-triumph]]. See [[cal.1965-01-12.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-27.robert-kennedy
    when: Aug. 27
    date: '1965-08-27'
    thread: robert-kennedy
    also: [latin-america]
    c: 'Johnson to Mann: his own Latin American plans to be announced quickly, "before Bobby is on every front page."'
    n: '[FRUS 1964–68, XXXI, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v31/d31). Made public: FRUS 1964–68, XXXI (2004). See [[cal.1965-05-06.robert-kennedy]]. Names: Johnson, Mann, Robert Kennedy.'
    tags: [name:johnson-lyndon-b, name:mann-thomas-c, name:kennedy-robert-f]
  - id: cal.1965-08-27.mississippi
    when: Aug. 27
    date: '1965-08-27'
    thread: mississippi
    c: 'Natchez. A bomb in his car outside the Armstrong Tire and Rubber plant gravely injures George Metcalf, president of the Natchez NAACP. That night Charles Evers to a mass meeting: "We''re armed, every last one of us."'
    n: '[[w.dittmer-local-people]], 353–55 (the quotation, 354). Check: the spelling, Metcalf or Metcalfe. Names: Charles Evers, Metcalf.'
    tags: [state:ms, name:evers-charles, name:metcalf-george]
  - id: cal.1965-08-29.transition-and-staff
    when: Aug. 29
    date: '1965-08-29'
    thread: transition-and-staff
    also: [europe-and-the-alliance]
    c: News conference at the LBJ Ranch. Gronouski, Postmaster General, to be Ambassador to Poland, for "building bridges" to Eastern Europe. O'Brien, the President's assistant for congressional relations, to be Postmaster General, and to keep that work.
    n: 'The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 943](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=417) (Aug. 29, 1965). [[w.obrien-no-final-victories]]. Names: Gronouski, O''Brien.'
    tags: [name:johnson-lyndon-b, name:gronouski-john-a, name:obrien-lawrence-f]
  - id: cal.1965-08-29.opinion
    when: Aug. 29
    date: '1965-08-29'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 5–10: the move to ask the UN to work out its own formula for peace in Vietnam: approve 74 percent, disapprove 13; Democrats 77, Republicans 71. How the war will end: most often, a compromise like Korea.'
    n: '[[w.gallup-poll]], III, 1958–59.'
  - id: cal.1965-08-29.space
    when: Aug. 29
    date: '1965-08-29'
    thread: space
    c: 'Gemini 5 down in the Atlantic: nearly eight days, 120 orbits; the endurance record passes to the United States. Johnson telephones Cooper and Conrad.'
    n: 'Remarks by Telephone to Astronauts Cooper and Conrad Following Completion of the Gemini 5 Mission, [1965 Pub. Papers 942](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=416) (Aug. 29, 1965); The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 943](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=417) (Aug. 29, 1965). See [[cal.1965-08-21.space]]. Names: Johnson, L. Gordon Cooper, Conrad.'
    tags: [name:johnson-lyndon-b, name:cooper-l-gordon-jr, name:conrad-charles-jr]
  - id: cal.1965-08-30.students
    when: Aug. 30
    date: '1965-08-30'
    thread: students
    also: [defense]
    c: 'Signed: knowingly to destroy or mutilate a draft card made a crime under the Universal Military Training and Service Act, [79 Stat. 586](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg586-2.pdf), up to five years and $10,000. The House passed it Aug. 10, [393–1](https://voteview.com/rollcall/RH0890114).'
    n: '[111 Cong. Rec., House, Aug. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-1-2.pdf). [[w.flynn-draft-1940-1973]]. *United States v. O''Brien* (K–J Adm. II.H.1). [[w.baskir-chance-and-circumstance]]. See [[cal.1965-05-21.students]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-30.steel
    when: Aug. 30
    date: '1965-08-30'
    thread: steel
    also: [labor-disputes]
    c: 'Steel. With the Steelworkers'' contract to run out Sept. 1 (Check), Johnson brings Abel of the union and Cooper of United States Steel to the White House with Wirtz and Connor: a shutdown put off eight days, the bargaining moved to Washington. On television that evening. Aug. 26, he had telephoned both.'
    n: 'Televised Statement by the President Announcing Postponement of a Shutdown in the Steel Industry, [1965 Pub. Papers 952](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=426) (Aug. 30, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 26, 1965). [[w.sheahan-wage-price-guideposts]]; [[w.califano-triumph-and-tragedy-of]]. See [[cal.1963-04-11.steel]]. Names: Johnson, Abel, R. Conrad Cooper, Wirtz, Connor.'
    tags: [name:johnson-lyndon-b, name:abel-i-w, name:cooper-r-conrad, name:wirtz-w-willard, name:connor-john-t]
  - id: cal.1965-08-30.goldwater
    when: Aug. 30
    date: '1965-08-30'
    thread: goldwater
    c: 'Johnson calls Goldwater, 2:58 p.m.: asks after his health; invites him to the White House for a drink and a military briefing. The steel talks, the pay bills, Aspinall and the Central Arizona Project.'
    n: '[Johnson, Goldwater, Moyers, Roberts, and the operator, 2:58 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-barry-goldwater-bill-moyers-and-office), Conversation WH6508-13-8674 (Miller Center). [[w.goldberg-barry-goldwater]]. See [[cal.1964-08-04.goldwater]]. Names: Johnson, Goldwater, Aspinall.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m, name:aspinall-wayne-n]
  - id: cal.1965-08-31.latin-america
    when: Aug. 31
    date: '1965-08-31'
    thread: latin-america-dominican-republic
    c: 'Santo Domingo. The Act of Dominican Reconciliation signed: Caamaño for the Constitutionalists, García-Godoy for the provisional government, Bunker and the OAS committee; Imbert, out Aug. 30, accepts it. García-Godoy provisional president; a general amnesty; arms collected; the Inter-American force''s withdrawal to be negotiated. García-Godoy sworn Sept. 3.'
    n: 'FRUS 1964–68, XXXII, docs. [127](https://history.state.gov/historicaldocuments/frus1964-68v32/d127), [128](https://history.state.gov/historicaldocuments/frus1964-68v32/d128). See [[cal.1965-04-28.latin-america]]; [[cal.1965-06-15.latin-america]]. Names: Caamaño-Deno, García-Godoy, Imbert-Barrera, Bunker.'
    tags: [name:caamano-deno-francisco, name:garcia-godoy-hector, name:imbert-barrera-antonio, name:bunker-ellsworth]
  - id: cal.1965-08-31.india-and-china
    when: Aug. 31
    date: '1965-08-31'
    thread: india-and-china-kashmir
    c: 'Komer to Johnson: the Pakistanis may send regulars into Kashmir.'
    n: '[FRUS 1964–68, XXV, doc. 176](https://history.state.gov/historicaldocuments/frus1964-68v25/d176). The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 943](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=417) (Aug. 29, 1965). See [[cal.1965-08-05.india-and-china]]. Names: Komer, Johnson.'
    tags: [name:komer-robert-w, name:johnson-lyndon-b]
