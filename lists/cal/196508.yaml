    also: [congress, states-and-cities, amendments, legislatures]
    c: Dirksen's amendment to let one house of a State legislature be apportioned on factors other than population, if the voters approve, fails in the Senate, [57–39](https://voteview.com/rollcall/RS0890177), seven short of two-thirds. Offered as a substitute for S.J. Res. 66, a resolution for National American Legion Baseball Week; the substitute taken, [59–39](https://voteview.com/rollcall/RS0890176); Javits's, [12–85](https://voteview.com/rollcall/RS0890175).
    n: '[111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf). S.J. Res. 2, 89th Cong. (Opp. II.H.2). To check: [[w.dixon-democratic-representation]]. See [[cal.1964-09-10.court]]. Names: Dirksen, Javits.'
    tags: [name:dirksen-everett, name:javits-jacob-k]
  - id: cal.1965-08-04.vietnam-congress
    when: Aug. 4
    date: '1965-08-04'
    thread: vietnam-congress
    also: [defense]
    c: 'McNamara and Wheeler before Stennis''s defense subcommittee of Senate Appropriations, in executive session, on the $1.7 billion asked in early August for the war to the end of 1965: South Vietnam the test of the "war of national liberation"; "We have no desire to widen the war." The bombing only "very small" in difference from the Joint Chiefs'' program; Wheeler: "primarily one of tempo." Robertson and Ellender against more involvement; Symington, win or get out. Aug. 5, the House subcommittee, unprinted.'
    n: 'Daily Digest, [111 Cong. Rec. D439](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=437). [[w.gibbons-u-s-government-and]], IV, 33–34. To check: Senate Comm. on Appropriations, *Department of Defense Appropriations for 1966: Hearings*, 89th Cong., 1st Sess., 731 ff. (1965). Names: McNamara, Wheeler, Stennis, Robertson, Ellender, Symington.'
    src:
