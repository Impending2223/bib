# Cal. LXIX August 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXIX
entries:
  - id: cal.1965-08-01.state-and-city-finance-ny
    when: Aug. 1
    date: '1965-08-01'
    thread: state-and-city-finance
    c: New York's first general State sales tax, 2 percent, in force, enacted in the spring at Rockefeller's request. Check the rate, the dates and the votes.
    n: 'Check: *Laws of New York*, 1965. To check: [[w.connery-rockefeller-of-new-york]]; [[w.underwood-governor-rockefeller-in-new]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1965-08-01.vietnam
    when: Aug. 1
    date: '1965-08-01'
    thread: vietnam
    also: [china]
    c: The Chinese antiaircraft artillery's 61st and 63rd Divisions enter North Vietnam from Yunnan and Guangxi, asked for by Hanoi July 24, for Yên Bái and the Kép area, to defend the two railways to China. By Chinese figures, sixteen divisions, over 150,000 men, served there by rotation to March 1969.
    n: '[[w.jian-maos-china-and-the]], 225–26 (by the Chinese military histories). Made public: the Chinese military histories Chen cites, Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), and Li Ke and Hao Shengzhang (1989), by his notes (357–58); in English, [[w.jian-chinas-involvement-in-the]]. Check: the Chinese figures.'
    tags: [place:yen-bai, place:kep]
  - id: cal.1965-08-01.vietnam-congress
    when: Aug. 1
    date: '1965-08-01'
    thread: vietnam-congress
    c: 'Russell on *Face the Nation*: the "greatest mistake" overemphasis on the military, too little on the civilian side; in a free election the South Vietnamese "highly likely" to choose Hồ Chí Minh; the domino theory "not necessarily true"; defeat a worse blow to prestige than to strategy.'
    n: '[[w.gibbons-u-s-government-and]], IV, 22–23. To check: Transcript, *Face the Nation*, Aug. 1, 1965 (CBS). Names: Russell, Hồ Chí Minh.'
    tags: [name:russell-richard-b, name:ho-chi-minh]
  - id: cal.1965-08-02.state-and-city-finance-us
    when: Aug. 2
    date: '1965-08-02'
    thread: state-and-city-finance
    also: [amendments]
    c: 'Johnson to *Newsweek*, its issue of Aug. 2, on revenue sharing: "What do they call it—the Heller plan?" "George Meany told me he''d never go for it." His task force of 1964 had recommended the plan; the proposal set aside after the recommendation reached the press, Dec. 1964 (Check). In July a Ripon Society–Republican Governors'' Association study for it. Illinois and Ohio apply to Congress this year for a convention on tax sharing.'
    n: '*Newsweek*, Aug. 2, 1965 (Check), quoted in *Ripon Forum*, [Sept. 1965, 1](https://riponsociety.org/wp-content/uploads/2023/12/1965-09_Vol-1_No-6.pdf). Applications: [111 Cong. Rec. 14,144](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-8-1.pdf#page=48), [25,237](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-3-1.pdf#page=2) (1965), as the [Article V Library](http://article5library.org/analyze.php?topic=Revenue+sharing&res=1&gen=0&ylimit=0) lists them. To check: [[w.heller-new-dimensions-of-political]]; [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1965-07-27.state-and-city-finance-us]]. Names: Johnson, Heller, Meany.'
    tags: [name:johnson-lyndon-b, name:heller-walter-w, name:meany-george, state:il, state:oh]
  - id: cal.1965-08-03.voting-rights
    when: Aug. 3–4
    date: '1965-08-03'
    thread: voting-rights
    c: House adopts the conference report on the voting rights bill, S. 1564, [328–74](https://voteview.com/rollcall/RH0890107); recommittal lost, [118–284](https://voteview.com/rollcall/RH0890106). Senate, Aug. 4, [79–18](https://voteview.com/rollcall/RS0890178). The House's ban on the poll tax dropped for a finding that it abridges the right to vote and a direction to the Attorney General to sue.
    n: '[111 Cong. Rec., House, Aug. 3, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-5-2.pdf); [111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf). See [[cal.1965-07-09.voting-rights]].'
  - id: cal.1965-08-03.desegregation-schools-philadelphia
    when: Aug. 3
    date: '1965-08-03'
    thread: desegregation-schools
    also: [king]
    c: 'Philadelphia. King at the wall of Girard College: "a kind of Berlin wall."'
    n: '[*New York Times*, Aug. 4, 1965](https://timesmachine.nytimes.com/timesmachine/1965/08/04/issue.html). See [[cal.1965-05-01.desegregation-schools-philadelphia]]. Names: King, Moore.'
    tags: [state:pa, city:philadelphia, name:king-martin-luther-jr, name:moore-cecil-b]
  - id: cal.1965-08-03.vietnam-support
    when: Aug. 3–4
    date: '1965-08-03'
    thread: vietnam-support
    c: 'White House dinner on the government''s "information problem" on the war, Cater in the chair, McGeorge Bundy, Cooper, Califano, Marks, Chancellor, Greenfield and Morris Leibman, of Chicago, among those there; Leibman''s paper on a "10 to 20 year period of ''twilight war.''" Aug. 4, a luncheon: how to get the private sector to carry some of the burden; Cooper: the American Friends of Vietnam, the government''s hand "fairly hidden," helped to money. A Public Affairs Policy Committee for Vietnam follows, McGeorge Bundy chairman, meeting weekly.'
    n: '[FRUS 1964–68, III, doc. 105](https://history.state.gov/historicaldocuments/frus1964-68v03/d105) (Chase''s memorandum for the record of the dinner of Aug. 3). [[w.gibbons-u-s-government-and]], IV, 30–32. To check: Chase to Johnson, Aug. 4, 1965; Memorandum for the Record, "August 4 Luncheon Meeting on the Information Problem" (LBJ Library, NSF Country File, Vietnam). Names: Cater, McGeorge Bundy, Cooper, Califano, Marks, Chancellor, Greenfield.'
    src:
      c: 2e327ecc
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d105: A'
        - 'w.gibbons-u-s-government-and IV, 30–32: all'
    tags: [name:cater-s-douglass, name:bundy-mcgeorge, name:cooper-chester-l, name:califano-joseph-a-jr, name:marks-leonard-h, name:chancellor-john, name:greenfield-james-l]
  - id: cal.1965-08-04.court
    when: Aug. 4
    date: '1965-08-04'
    thread: court
    also: [congress, states-and-cities, amendments, legislatures]
    c: Dirksen's amendment to let one house of a State legislature be apportioned on factors other than population, if the voters approve, fails in the Senate, [57–39](https://voteview.com/rollcall/RS0890177), seven short of two-thirds. Offered as a substitute for S.J. Res. 66, a resolution for National American Legion Baseball Week; the substitute taken, [59–39](https://voteview.com/rollcall/RS0890176); Javits's, [12–85](https://voteview.com/rollcall/RS0890175).
    n: '[111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf). S.J. Res. 2, 89th Cong. (Opp. II.H.2). To check: [[w.dixon-democratic-representation]]. See [[cal.1964-09-10.court]]. Names: Dirksen, Javits.'
    tags: [name:dirksen-everett, name:javits-jacob-k]
  - id: cal.1965-08-04.vietnam-congress
    when: Aug. 4
    date: '1965-08-04'
    thread: vietnam-congress
    also: [defense]
    c: 'McNamara and Wheeler before Stennis''s defense subcommittee of Senate Appropriations, in executive session, on the $1.7 billion asked in early August for the war to the end of 1965: South Vietnam the test of the "war of national liberation"; "We have no desire to widen the war." The bombing only "very small" in difference from the Joint Chiefs'' program; Wheeler: "primarily one of tempo." Robertson and Ellender against more involvement; Symington, win or get out. Aug. 5, the House subcommittee, unprinted.'
    n: 'Daily Digest, [111 Cong. Rec. D439](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=437). [[w.gibbons-u-s-government-and]], IV, 33–34. To check: Senate Comm. on Appropriations, *Department of Defense Appropriations for 1966: Hearings*, 89th Cong., 1st Sess., 731 ff. (1965). Names: McNamara, Wheeler, Stennis, Robertson, Ellender, Symington.'
    tags: [name:mcnamara-robert-s, name:wheeler-earle, name:stennis-john-c, name:robertson-absalom-w, name:ellender-allen-j, name:symington-william-s]
  - id: cal.1965-08-05.vietnam
    when: Aug. 5
    date: '1965-08-05'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Cẩm Nê, south of Đà Nẵng, Aug. 3: Marines burn the hamlet''s huts, some with cigarette lighters, before a CBS camera. Safer''s film on the CBS evening news, Aug. 5. The Marines and the Pentagon dispute his account; Johnson complains to Stanton, CBS''s president. Check.'
    n: '[FRUS 1964–68, III, doc. 117](https://history.state.gov/historicaldocuments/frus1964-68v03/d117) (Aug. 10, the film discussed at the State Department). To check: [[w.hammond-public-affairs]]; [[w.hallin-uncensored-war-the-media]]; [[w.arlen-living-room-war]]; [[w.shulimson-u-s-marines-in]]. See [[cal.1965-07-28.vietnam]]. Names: Safer, Stanton, Johnson.'
    tags: [name:safer-morley, name:stanton-frank, name:johnson-lyndon-b, place:cam-ne]
  - id: cal.1965-08-05.india-and-china
    when: Aug. 5
    date: '1965-08-05'
    thread: india-and-china-kashmir
    c: Kashmir. Armed men from Pakistan, Operation Gibraltar, cross the cease-fire line into the valley to raise a rising; none follows.
    n: '[FRUS 1964–68, XXV, doc. 160](https://history.state.gov/historicaldocuments/frus1964-68v25/d160) (editorial note). To check: [[w.kux-united-states-and-pakistan]]. See [[cal.1965-06-30.india-and-china]].'
  - id: cal.1965-08-05.economy
    when: Aug. 5
    date: '1965-08-05'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Sterling. Johnson to Eugene Black, 10:07 a.m.: the British "laughing at us," sure the United States will not let the pound go. Martin to Johnson, 11:47 p.m.: the Governor of the Bank of England "absolutely disgusted" with Wilson''s government. Bator, called in the same night: a devaluation would be inconvenient for the United States, not a calamity.'
    n: '[Johnson and Eugene Black, 10:07 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-eugene-black-office-conversation-and-telephone), Conversation WH6508-01-8509; [Johnson and Martin, 11:47 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-mcc-martin-and-office-conversation), Conversation WH6508-02-8510 (Miller Center). [[w.schwartz-lyndon-johnson-and-europe]], 80–81. See [[cal.1965-06-28.economy]]. Names: Black, Martin, Wilson, Bator, Johnson. Check: Bator''s notes of the meeting are dated Aug. 6 (Schwartz, 273 n. 144); the Daily Diary has Johnson with Fowler, Ball, Deming, Ackley, McGeorge Bundy and Bator Aug. 6, 11:10–11:35 a.m. ([FRUS 1964–68, VIII, doc. 66](https://history.state.gov/historicaldocuments/frus1964-68v08/d66) n. 5).'
    tags: [name:johnson-lyndon-b, name:black-eugene-r, name:martin-william-mcchesney-jr, name:wilson-harold, name:bator-francis-m]
  - id: cal.1965-08-05.civil-rights-the-executive
    when: Aug. 5
    date: '1965-08-05'
    thread: civil-rights-the-executive
    also: [king]
    c: 'King, Abernathy and Fauntroy with Johnson and Lee White: Johnson on a White House Conference on Civil Rights in 1966. King: segregation growing in the North; school aid cut off from systems segregated in fact; housing and job training; slum ownership made unprofitable. Johnson asks a report.'
    n: '[[w.garrow-bearing-the-cross]], 436. To check: White to Johnson, Aug. 5, 1965, Diary Backup (LBJ Library), as Garrow cites it (696 n.7). Names: King, Abernathy, Johnson, White.'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david, name:johnson-lyndon-b, name:white-lee-c]
  - id: cal.1965-08-05.vietnam-congress
    when: Aug. 5
    date: '1965-08-05'
    thread: vietnam-congress
    c: 'The NSC. McNamara on the Armed Services committees: "broad support, but this support is thin. There is a feeling of uneasiness and frustration"; Republicans "overstating" the war''s cost to the economy. Rusk: good support in House Foreign Affairs.'
    n: '[FRUS 1964–68, III, doc. 110](https://history.state.gov/historicaldocuments/frus1964-68v03/d110). [[w.gibbons-u-s-government-and]], IV, 34. Made public: FRUS 1964–68, III (1996). Names: McNamara, Rusk, Johnson.'
    tags: [name:mcnamara-robert-s, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1965-08-06.voting-rights
    when: Aug. 6
    date: '1965-08-06'
    thread: voting-rights
    c: Voting Rights Act signed in the President's Room off the Senate chamber, after Johnson's address in the Rotunda at noon, [79 Stat. 437](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg437.pdf). Literacy tests and like devices suspended where under half the voting-age population was registered on Nov. 1, 1964, or voted that November; federal examiners to list voters there; new voting rules there to be cleared by the Attorney General or the District Court in Washington. "The vote is the most powerful instrument ever devised by man for breaking down injustice."
    n: 'Remarks in the Capitol Rotunda at the Signing of the Voting Rights Act, [1965 Pub. Papers 840](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=314) (Aug. 6, 1965). Statute (K–J Cong. II.J.2). [President''s Daily Diary, Aug. 6, 1965](https://catalog.archives.gov/id/192457), image 2 (LBJ Library; National Archives Catalog). [[w.garrow-bearing-the-cross]], 436. See [[cal.1965-03-07.voting-rights]]; [[cal.1965-03-15.voting-rights]]; [[cal.1965-08-03.voting-rights]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, bill:voting-rights-1965]
  - id: cal.1965-08-06.opinion
    when: Aug. 6
    date: '1965-08-06'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, July 16–21: the Johnson Administration pushing integration too fast, 40 percent; not fast enough, 13; about right, 38. Southern whites 69 too fast; whites outside the South 36. Republicans 46 too fast; Democrats 35; independents 43.'
    n: '[[w.gallup-poll]], III, 1955–56. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-09.war-opposition
    when: Aug. 6–9
    date: '1965-08-06'
    thread: war-opposition
    also: [vietnam]
    c: 'Washington. The Assembly of Unrepresented People, Muste, Dellinger and Lynd among its leaders, some 1,000. Aug. 6, a delegation with Cooper at the White House. Aug. 9, marching on the Capitol, they refuse to stop at the police lines: 350 arrested. A National Coordinating Committee to End the War in Vietnam formed, 23 organizations.'
    n: '[[w.gibbons-u-s-government-and]], IV, 27. To check: [[w.debenedetti-american-ordeal]]; [[w.powers-war-at-home]]. Names: Muste, Dellinger, Lynd, Cooper.'
    tags: [name:muste-a-j, name:dellinger-david, name:lynd-staughton, name:cooper-chester-l, city:washington]
  - id: cal.1965-08-07.voting-rights
    when: Aug. 7
    date: '1965-08-07'
    thread: voting-rights
    also: [civil-rights-the-executive]
    c: 'The act at work. The coverage published: Alabama, Alaska, Georgia, Louisiana, Mississippi, South Carolina, Virginia, 26 counties of North Carolina, one of Arizona. Suit against Mississippi''s poll tax (Check the date).'
    n: '[30 Fed. Reg. 9897](https://www.govinfo.gov/app/details/FR-1965-08-07) (Aug. 7, 1965). Remarks in the Capitol Rotunda at the Signing of the Voting Rights Act, [1965 Pub. Papers 840](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=314) (Aug. 6, 1965). To check: [[w.landsberg-enforcing-civil-rights]]. See [[cal.1965-08-06.voting-rights]].'
  - id: cal.1965-08-09.voting-rights
    when: Aug. 9
    date: '1965-08-09'
    thread: voting-rights
    also: [civil-rights-the-executive]
    c: 'Katzenbach certifies nine counties for examiners: Dallas, Hale, Lowndes, Marengo in Alabama; East Carroll, East Feliciana, Plaquemines in Louisiana; Leflore and Madison in Mississippi.'
    n: '[30 Fed. Reg. 9970–71](https://www.govinfo.gov/app/details/FR-1965-08-10) (Aug. 10, 1965). See [[cal.1965-08-07.voting-rights]]. Names: Katzenbach.'
    tags: [name:katzenbach-nicholas]
  - id: cal.1965-08-09.vietnam-congress
    when: Aug. 9–11
    date: '1965-08-09'
    thread: vietnam-congress
    c: 'Off-the-record White House briefings on the war for all the Members, 74 Senators and 336 Representatives: Johnson, then Taylor, Rusk and McNamara; Harriman on his talks in Moscow, Goldberg on U Thant, Black on the Mekong.'
    n: '[[w.gibbons-u-s-government-and]], IV, 34 (from the Daily Diary). Check: the days; Morse''s speech of Aug. 10 has one the day before. To check: Partial transcripts of the briefings of Aug. 10 and 11 (LBJ Library, Transcripts of Vietnam Briefings). Names: Johnson, Taylor, Rusk, McNamara, Harriman, Goldberg, Black.'
    tags: [name:johnson-lyndon-b, name:taylor-maxwell, name:rusk-dean, name:mcnamara-robert-s, name:harriman-w-averell, name:goldberg-arthur-j, name:black-eugene-r]
  - id: cal.1965-08-10.cities-and-housing
    when: Aug. 10
    date: '1965-08-10'
    thread: cities-and-housing
    c: 'Housing and Urban Development Act of 1965 signed, [79 Stat. 451](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg451.pdf). Rent supplements: the Government to pay the owner of private nonprofit or limited-dividend housing what the rent exceeds a quarter of a low-income tenant''s income; payments up to $30 million a year at first, rising to $150 million a year from July 1968. FHA insurance, urban renewal, public and college housing extended. The Senate had kept rent supplements July 15, [40–47](https://voteview.com/rollcall/RS0890159) on striking them, and passed the bill, [54–30](https://voteview.com/rollcall/RS0890162); conference report, House, July 27, [251–168](https://voteview.com/rollcall/RH0890098). Aug. 11, the Senate passes the bill for a Department of Housing and Urban Development, [57–33](https://voteview.com/rollcall/RS0890179).'
    n: 'Remarks at the Signing of the Housing and Urban Development Act, [1965 Pub. Papers 861](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=335) (Aug. 10, 1965). [111 Cong. Rec., Senate, July 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-7-1.pdf); [111 Cong. Rec., House, July 27, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-7-2.pdf); [111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf). To check: [[w.pritchett-robert-clifton-weaver-and]]. See [[cal.1965-06-16.cities-and-housing]]; [[cal.1965-06-30.cities-and-housing]]. Names: Weaver.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c]
  - id: cal.1965-08-10.legislatures-nd
    when: Aug. 10
    date: '1965-08-10'
    thread: legislatures
    c: North Dakota. The federal court holds House Bill 566, the 1965 Assembly's apportionment, invalid, and devises its own, on the "Smith plan" prepared for the Legislative Research Committee.
    n: '*Paulson v. Meier*, [246 F. Supp. 36](https://static.case.law/f-supp/246/case-pdfs/0036-01.pdf) (D.N.D. 1965). See [[cal.1964-07-27.legislatures-nd]].'
    tags: [state:nd]
  - id: cal.1965-08-10.india-and-china
    when: Aug. 10
    date: '1965-08-10'
    thread: india-and-china-kashmir
    c: 'NSAM 337: alternatives to the intelligence facilities in Pakistan to be readied.'
    n: '[FRUS 1964–68, XXV, doc. 168](https://history.state.gov/historicaldocuments/frus1964-68v25/d168). See [[cal.1965-08-05.india-and-china]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge]
  - id: cal.1965-08-10.voting-rights
    when: Aug. 10
    date: '1965-08-10'
    thread: voting-rights
    also: [civil-rights-the-executive]
    c: Federal examiners at work; suits against the poll tax in Texas, Alabama, Virginia. Check the dates of the suits.
    n: 'Check: the record. See [[cal.1965-08-07.voting-rights]].'
  - id: cal.1965-08-10.vietnam-congress
    when: Aug. 10
    date: '1965-08-10'
    thread: vietnam-congress
    c: 'Morse in the Senate, the day after a White House briefing: "an Alice-in-Wonderland exhibition"; the guerrilla war lost and turned into a conventional war under "the same men who failed." McGeorge Bundy sends Johnson a summary the next day.'
    n: '[111 Cong. Rec., Senate, Aug. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-1-1.pdf), 19840. [[w.gibbons-u-s-government-and]], IV, 34–35. See [[cal.1965-08-09.vietnam-congress]]. Names: Morse, McGeorge Bundy, Johnson.'
    tags: [name:morse-wayne, name:bundy-mcgeorge, name:johnson-lyndon-b]
  - id: cal.1965-08-10.war-opposition
    when: Aug. 10
    date: '1965-08-10'
    thread: war-opposition
    also: [vietnam-congress, students]
    c: 'The House passes the bill making it a crime to destroy or mutilate a draft card, up to five years and $10,000, the day after the arrests at the Capitol: 393–1, Henry P. Smith of New York against. Bray: "a filthy, sleazy beatnik gang."'
    n: '[111 Cong. Rec., House, Aug. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-1-2.pdf), 19871–72. [[w.gibbons-u-s-government-and]], IV, 28. Signed: [[cal.1965-08-30.students]]. Names: Bray, Henry P. Smith.'
    tags: [name:bray-william-g, name:smith-henry-p-iii]
  - id: cal.1965-08-11.states-and-cities
    when: Aug. 11–16
    date: '1965-08-11'
    thread: states-and-cities
    c: Watts, Los Angeles. A highway patrolman arrests Marquette Frye for drunken driving at 116th Street and Avalon, Aug. 11; a crowd gathers; six days of rioting, looting, and burning. Brown in Greece; Lieutenant Governor Anderson sends the Guard, on the streets Aug. 13, nearly 14,000 by the end; a curfew over the district. 34 dead, more than 1,000 hurt, some 4,000 arrested. Check the figures.
    n: 'Governor''s Commission on the Los Angeles Riots, [*Violence in the City—An End or a Beginning?*](https://archive.org/details/ViolenceInCity) (1965). To check: [[w.cohen-burn-baby-burn]]; [[w.conot-rivers-of-blood-years]]; [[w.horne-fire-this-time]]; [[w.flamm-law-and-order]]; [[w.branch-at-canaans-edge]]. See [[cal.1964-07-18.states-and-cities]]. Names: Frye, Glenn Anderson, Brown.'
    tags: [name:frye-marquette, name:brown-edmund-g, name:anderson-glenn-m, state:ca]
  - id: cal.1965-08-11.middle-east
    when: Aug. 11
    date: '1965-08-11'
    thread: middle-east-yemen
    c: Yemen. Faisal, through Sultan, asks for an American fighter squadron, a destroyer visit hastened and more near the Yemen border.
    n: '[FRUS 1964–68, XXI, doc. 377](https://history.state.gov/historicaldocuments/frus1964-68v21/d377) (Aug. 15). To check: [[w.ferris-nassers-gamble]]; [[w.orkaby-beyond-the-arab-cold]]. See [[cal.1962-09-26.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Sultan ibn Abd al-Aziz Al Saud.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:sultan-ibn-abd-al-aziz-al-saud]
  - id: cal.1965-08-11.court
    when: Aug. 11
    date: '1965-08-11'
    thread: court
    c: Fortas confirmed by the Senate, without a roll call.
    n: '[111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf). See [[cal.1965-07-28.vietnam]]. Names: Fortas. Check: the Judiciary Committee''s hearing, Aug. 5, as the entry of July 28 had it; no source read for the day.'
