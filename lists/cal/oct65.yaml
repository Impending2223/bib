# Cal. oct65
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: oct65
entries:
  - id: cal.1965-10-01.india-and-china
    when: Oct. 1
    date: '1965-10-01'
    thread: india-and-china
    c: 'Djakarta. The "September 30th Movement," under Lt. Col. Untung of the palace guard, kills six generals before dawn, Yani, the army commander, among them; Nasution escapes. Suharto, commanding the army''s strategic reserve, retakes the capital by evening. The army blames the Communist party (PKI). Oct. 5, Ambassador Green: no overt involvement, but let Nasution and Suharto know "covertly" of a "desire to be of assistance." By Oct. 20 the embassy reports some thousand PKI cadres arrested in the Djakarta area, several hundred executed.'
    n: 'FRUS 1964–68, XXVI, docs. [142](https://history.state.gov/historicaldocuments/frus1964-68v26/d142), [147](https://history.state.gov/historicaldocuments/frus1964-68v26/d147), [158](https://history.state.gov/historicaldocuments/frus1964-68v26/d158). Jones, *Conflict and Confrontation in South East Asia, 1961–1965* (Viet. II.F.17). Bradley R. Simpson, *Economists with Guns: Authoritarian Development and U.S.–Indonesian Relations, 1960–1968* (2008); Geoffrey B. Robinson, *The Killing Season: A History of the Indonesian Massacres, 1965–66* (2018).'
    tags: [name:suharto, name:nasution-abdul-haris, name:green-marshall]
  - id: cal.1965-10-02.conservation
    when: Oct. 2
    date: '1965-10-02'
    thread: conservation
    c: 'Water Quality Act signed in the East Room, [79 Stat. 903](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg903.pdf): a Federal Water Pollution Control Administration in HEW; the States to adopt quality criteria for interstate waters by June 30, 1967, or the Secretary sets standards; sewage-plant grants from $100 million a year to $150 million for 1966 and 1967. Johnson: the Potomac open for swimming by 1975. The Senate passed it Jan. 28, [68–8](https://voteview.com/rollcall/RS0890005); the House Apr. 28, [396–0](https://voteview.com/rollcall/RH0890041); the conference report through the House Sept. 21, [381–0](https://voteview.com/rollcall/RH0890161).'
    n: '[Remarks at the Signing of the Water Quality Act of 1965](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-water-quality-act-1965) (Oct. 2, 1965). Milazzo, *Unlikely Environmentalists* (K–J Cong. II.B). See [[cal.1964-09-03.conservation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-02.specials
    when: Oct. 2
    date: '1965-10-02'
    thread: specials
    c: Louisiana 7th, special. Edwards (D), a State senator, holds T. Ashton Thompson's seat, unopposed; Thompson killed in a car crash July 1.
    n: 'Votes: CQ Guide 6th (2010) 1276 (unopposed). Wikipedia gives Edwards 53.8, Gary Tyler (D) 46.2, perhaps the Democratic primary: check. Check: La. Secretary of State, *General Election Returns*. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1965-10-02-h-LA-7, name:edwards-edwin-w, name:thompson-theo-a]
  - id: cal.1965-10-03.immigration
    when: Oct. 3
    date: '1965-10-03'
    thread: immigration
    c: 'Immigration and Nationality Act Amendments signed on Liberty Island, [79 Stat. 911](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg911.pdf). The national-origins quotas end June 30, 1968: then 170,000 a year from the Eastern Hemisphere, no country over 20,000, by preference for kin of citizens and residents and for skills; 120,000 from the Western Hemisphere. Johnson: "not a revolutionary bill"; it corrects "a cruel and enduring wrong."'
    n: 'Statute (K–J Cong. II.J.2). [Remarks at the Signing of the Immigration Bill, Liberty Island, New York](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-immigration-bill-liberty-island-new-york) (Oct. 3, 1965). See [[cal.1965-01-13.immigration]]; [[cal.1965-09-22.immigration]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-03.cuba
    when: Oct. 3
    date: '1965-10-03'
    thread: cuba
    also: [immigration]
    c: 'Castro, Sept. 28: Cubans who wish may go to the United States; exiles may fetch their relatives by boat at Camarioca after Oct. 10. Johnson at Liberty Island: "those who seek refuge here in America will find it"; an "orderly entry" to be arranged, Cuba''s agreement sought through the Swiss, $12.6 million asked of Congress. Small boats arrive from Oct. 7, over 700 people by Oct. 18. Oct. 13, Cuba answers the American note: ready to begin.'
    n: '[Remarks at the Signing of the Immigration Bill, Liberty Island, New York](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-immigration-bill-liberty-island-new-york) (Oct. 3, 1965). [FRUS 1964–68, XXXII, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v32/d308). María Cristina García, *Havana USA: Cuban Exiles and Cuban Americans in South Florida, 1959–1994* (1996). Schoultz, *That Infernal Little Cuban Republic*; LeoGrande & Kornbluh, *Back Channel to Cuba* (K–J Adm. II.D). See [[cal.1964-02-02.cuba]]. Names: Castro (K–J Adm. III.J).'
    tags: [name:castro-fidel, name:johnson-lyndon-b]
  - id: cal.1965-10-04.vietnam
    when: Oct. 4
    date: '1965-10-04'
    thread: vietnam
    c: 'Paul VI in New York for the day, the first Pope in the United States. He and Johnson meet at the Waldorf Towers, some 46 minutes (Check). At the United Nations: "never again war, never again war!" Mass at Yankee Stadium.'
    n: 'Paul VI, [Address to the United Nations](https://www.vatican.va/content/paul-vi/en/speeches/1965/documents/hf_p-vi_spe_19651004_united-nations.html) (Oct. 4, 1965). Peter Hebblethwaite, *Paul VI: The First Modern Pope* (1993).'
    tags: [name:paul-vi, name:johnson-lyndon-b]
  - id: cal.1965-10-06.health
    when: Oct. 6
    date: '1965-10-06'
    thread: health
    c: 'Heart Disease, Cancer, and Stroke Amendments signed in the East Room, [79 Stat. 926](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg926.pdf): grants for regional medical programs joining medical schools, research institutions, and hospitals; $340 million over three years.'
    n: '[Remarks at the Signing of the Heart Disease, Cancer, and Stroke Amendments of 1965](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-heart-disease-cancer-and-stroke-amendments-1965) (Oct. 6, 1965). Blumenthal & Morone, *The Heart of Power* (K–J Adm. II.B). See [[cal.1964-12-09.health]]; [[cal.1965-01-07.medicare]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-08.succession
    when: Oct. 8
    date: '1965-10-08'
    thread: succession
    c: 'Johnson''s gall bladder removed at Bethesda Naval Hospital, with a stone from the ureter (Check). Oct. 5 he had announced the operation and made public his understanding with Humphrey, on the terms Eisenhower and Kennedy had made with their Vice Presidents: in an inability Humphrey to serve as Acting President, Johnson to decide when it ended. Oct. 20, at the hospital, he shows reporters the scar. Back at the White House Oct. 21.'
    n: '[Statement by the President Announcing That He Would Undergo Surgery](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-that-he-would-undergo-surgery); [Statement of Procedures for Use in the Event of Presidential Inability](https://www.presidency.ucsb.edu/documents/statement-procedures-for-use-the-event-presidential-inability) (Oct. 5, 1965). [Remarks to Fellow Patients in the Naval Hospital, Bethesda, Maryland](https://www.presidency.ucsb.edu/documents/remarks-fellow-patients-the-naval-hospital-bethesda-maryland) (Oct. 21, 1965). Robert E. Gilbert, *The Mortal Presidency: Illness and Anguish in the White House* (1992). Dallek, *Flawed Giant* (K–J Adm. II.A). See [[cal.1964-09-28.succession]]; [[cal.1965-07-06.succession]]. Names: Humphrey (K–J Adm. III.D); Eisenhower (Opp. III.E); Kennedy (Viet. III.A).'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:eisenhower-dwight-d, name:kennedy-john-f]
  - id: cal.1965-10-09.poverty
    when: Oct. 9
    date: '1965-10-09'
    thread: poverty
    c: 'Economic Opportunity Amendments signed, [79 Stat. 973](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg973.pdf): the war on poverty''s second year. A governor''s disapproval of a community action plan may be overridden by the director. The House had sent back the first conference report, Sept. 15, [209–180](https://voteview.com/rollcall/RH0890153), on Ayres''s motion to keep the governors'' veto; the second through the Senate Sept. 24, [46–22](https://voteview.com/rollcall/RS0890241).'
    n: '[111 Cong. Rec., House, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-2.pdf); [111 Cong. Rec., Senate, Sept. 24, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-1-2.pdf). Davies, *From Opportunity to Entitlement*; Moynihan, *Maximum Feasible Misunderstanding* (K–J Adm. II.B). See [[cal.1965-08-19.poverty]].'
    tags: [name:ayres-william-h]
  - id: cal.1965-10-11.jobs-and-wages
    when: Oct. 11
    date: '1965-10-11'
    thread: jobs-and-wages
    also: [congress]
    c: 'Repeal of 14(b), the right-to-work clause, in the Senate. Mansfield moved Oct. 1 to take up H.R. 77, passed by the House July 28; Dirksen and his allies hold the floor. Oct. 11, cloture refused, [45–47](https://voteview.com/rollcall/RS0890248), two-thirds needed. The Senate turns to other business; H.R. 77 waits for the second session.'
    n: 'Repeal of section 14(b) (K–J Cong. II.J.2). [111 Cong. Rec., Senate, Oct. 1, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-6-2.pdf); [111 Cong. Rec., Senate, Oct. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-3-2.pdf). Hulsey, *Everett Dirksen and His Presidents*; MacNeil, *Dirksen* (Opp. II.D). Wawro & Schickler, *Filibuster* (K–J Cong. II.A). See [[cal.1965-07-28.jobs-and-wages]]. Names: Mansfield (K–J Cong. III.A); Dirksen (Opp. III.A).'
    tags: [name:mansfield-mike, name:dirksen-everett]
  - id: cal.1965-10-14.cities-and-housing
    when: Oct. 14–21
    date: '1965-10-14'
    thread: cities-and-housing
    c: 'Rent supplements. The House strikes their money from the supplemental appropriation, [185–162](https://voteview.com/rollcall/RH0890194). Oct. 20, the Senate keeps $12 million in contract authority, a motion to strike it lost, [37–45](https://voteview.com/rollcall/RS0890253). The conferees drop it "without prejudice"; the House agrees to their report Oct. 21, [250–84](https://voteview.com/rollcall/RH0890199). Signed Oct. 31, [79 Stat. 1133](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1133.pdf), without it.'
    n: '[111 Cong. Rec., House, Oct. 14, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-6-1.pdf); [111 Cong. Rec., Senate, Oct. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-10-1.pdf); [111 Cong. Rec., House, Oct. 21, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-1-1.pdf). Gelfand, *A Nation of Cities* (K–J Cong. II.B). See [[cal.1965-08-10.cities-and-housing]].'
  - id: cal.1965-10-15.students
    when: Oct. 15–18
    date: '1965-10-15'
    thread: students
    also: [vietnam]
    c: 'International Days of Protest against the war, planned by Berkeley''s Vietnam Day Committee and the National Coordinating Committee to End the War in Vietnam (Check): marches, rallies, teach-ins in many cities. Oct. 15, at the Whitehall Street induction center in New York, David Miller, 24, a Catholic Worker, burns his draft card, the first to do so under the law of Aug. 30; the FBI arrests him Oct. 18. The Berkeley march on the Oakland Army Terminal turned back by police at the Oakland line, Oct. 15 and again Oct. 16 (Check). Oct. 17, Katzenbach: a Justice Department inquiry into Communist influence in the antidraft movement; Moyers, Oct. 18: Johnson endorses it.'
    n: '*United States v. O''Brien* (Viet. II.I.1). See [[cal.1965-08-30.students]]. DeBenedetti, *An American Ordeal*; Zaroulis & Sullivan, *Who Spoke Up?*; Wells, *The War Within*; Foley, *Confronting the War Machine* (Viet. II.G.1). Rorabaugh, *Berkeley at War* (K–J Cong. II.F). Names: Miller (K–J Cong. III.K); Katzenbach (K–J Adm. III.I); Moyers (K–J Adm. III.C).'
    tags: [name:miller-david-j, name:katzenbach-nicholas, name:moyers-bill, name:johnson-lyndon-b]
  - id: cal.1965-10-19.vietnam
    when: Oct. 19–27
    date: '1965-10-19'
    thread: vietnam
    c: 'Plei Me. North Vietnamese regiments attack the Special Forces camp south of Pleiku the night of Oct. 19: twelve Americans of the 5th Special Forces Group and some 400 Montagnard irregulars. Reinforcements by helicopter; an ARVN armored column, ambushed Oct. 23, reaches the camp Oct. 25, the 1st Cavalry Division''s artillery in support. Oct. 26, Westmoreland sends the 1st Cavalry after the withdrawing regiments (Check).'
    n: 'Carland, *Combat Operations: Stemming the Tide* (Viet. II.I.3). Vinh-Loc, *Why Pleime*; Coleman, *Pleiku: The Dawn of Helicopter Warfare in Vietnam*; Saliba, *Death in the Highlands* (Viet. II.C.4). See [[cal.1965-07-28.vietnam]]. Names: Westmoreland (Viet. III.D).'
    tags: [name:westmoreland-william]
  - id: cal.1965-10-19.alabama
    when: Oct. 19–20
    date: '1965-10-19'
    thread: alabama
    also: [congress]
    c: 'The House Un-American Activities Committee on the Klan, Willis presiding. Shelton, Imperial Wizard of the United Klans of America, before it under subpoena Oct. 19 and 20, refuses to produce the Klan''s records. Convicted of contempt of Congress: a year and $1,000.'
    n: '*Shelton v. United States*, [404 F.2d 1292](https://law.resource.org/pub/us/case/reporter/F2/404/404.F2d.1292.20587_1.html) (D.C. Cir. 1968). Goodman, *The Committee* (K–J Cong. II.A). May, *The Informant* (K–J Cong. II.F). Names: Shelton (K–J Cong. III.K).'
    tags: [name:shelton-robert-m, name:willis-edwin-e]
  - id: cal.1965-10-20.conservation
    when: Oct. 20
    date: '1965-10-20'
    thread: conservation
    also: [health]
    c: 'Motor Vehicle Air Pollution Control Act and Solid Waste Disposal Act signed in Johnson''s room at Bethesda, [79 Stat. 992](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg992-2.pdf): federal exhaust standards for new cars from the 1968 models, imports included; research and grants on solid waste. The House passed it Sept. 24, [294–4](https://voteview.com/rollcall/RH0890169).'
    n: '[Remarks in the Hospital at the Signing of the Clean Air Act Amendments and Solid Waste Disposal Bill](https://www.presidency.ucsb.edu/documents/remarks-the-hospital-the-signing-the-clean-air-act-amendments-and-solid-waste-disposal) (Oct. 20, 1965). Krier & Ursin, *Pollution and Policy*; Dewey, *Don''t Breathe the Air* (K–J Cong. II.B). See [[cal.1965-10-02.conservation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-20.school-aid
    when: Oct. 20
    date: '1965-10-20'
    thread: school-aid
    c: 'Higher Education bill through Congress. The House agrees to the conference report, [313–63](https://voteview.com/rollcall/RH0890197), a motion to recommit against the Teacher Corps lost, [152–226](https://voteview.com/rollcall/RH0890196); the Senate the same day. The Senate had passed it Sept. 2, [79–3](https://voteview.com/rollcall/RS0890215). Scholarships for needy students, insured loans, aid to libraries and developing colleges, a National Teacher Corps.'
    n: 'Higher Education Act of 1965 (K–J Cong. II.J.2). [Statement by the President Following Passage by the Senate of the Higher Education Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-passage-the-senate-the-higher-education-bill) (Sept. 2, 1965). [111 Cong. Rec., House, Oct. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-10-2.pdf); [111 Cong. Rec., Senate, Oct. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-10-1.pdf). Graham, *The Uncertain Triumph* (K–J Adm. II.B). See [[cal.1965-01-12.school-aid]]; [[cal.1965-08-26.school-aid]].'
  - id: cal.1965-10-20.foreign-aid
    when: Oct. 20
    date: '1965-10-20'
    thread: foreign-aid
    c: 'Foreign aid appropriation for fiscal 1966 signed, [79 Stat. 1002](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1002.pdf): 7 percent under the request, the smallest cut since the Marshall Plan, Johnson says. The House passed it Sept. 8, [239–143](https://voteview.com/rollcall/RH0890136); the Senate Sept. 23, [59–22](https://voteview.com/rollcall/RS0890240). The conference report: House, Oct. 1, [204–127](https://voteview.com/rollcall/RH0890183); Senate, Oct. 5, [40–23](https://voteview.com/rollcall/RS0890245).'
    n: '[Statement by the President Upon Signing the Foreign Assistance and Related Agencies Appropriation Act](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-assistance-and-related-agencies) (Oct. 20, 1965). See [[cal.1965-09-06.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-21.trade
    when: Oct. 21
    date: '1965-10-21'
    thread: trade
    c: 'Automotive Products Trade Act signed, [79 Stat. 1016](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1016.pdf): authority to free Canadian cars and original parts of duty under the January agreement; adjustment assistance for American firms and workers it hurts. Proclamation 3682 removes the duties in sixty days, retroactive to Jan. 18; a board of the Secretaries of the Treasury, Commerce, and Labor for the assistance. The House passed it Aug. 31, [280–113](https://voteview.com/rollcall/RH0890129); the Senate Sept. 30, [54–18](https://voteview.com/rollcall/RS0890244).'
    n: '[Statement by the President Following the Signing of Bill Implementing U.S.-Canadian Agreement on Automotive Products](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-signing-bill-implementing-us-canadian-agreement); [Statement by the President on Issuing Proclamation and Executive Order Relating to the U.S.-Canadian Agreement on Automotive Products](https://www.presidency.ucsb.edu/documents/statement-the-president-issuing-proclamation-and-executive-order-relating-the-us-canadian) (Oct. 22, 1965). [Proclamation 3682](https://www.presidency.ucsb.edu/documents/proclamation-3682-implementing-agreement-concerning-automotive-products-between-the-united) (Oct. 21, 1965), 30 Fed. Reg. 13683. Zeiler, *American Trade and Power in the 1960s* (K–J Adm. II.B). See [[cal.1965-01-16.trade]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-22.conservation
    when: Oct. 22
    date: '1965-10-22'
    thread: conservation
    c: 'Highway Beautification Act signed in the East Room, [79 Stat. 1028](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1028.pdf): billboards within 660 feet of Interstate and primary highways, and junkyards within 1,000 feet, to be controlled from Jan. 1, 1968, or a State loses 10 percent of its federal highway money; landscaping and scenic roads. The Senate passed it Sept. 16, [63–14](https://voteview.com/rollcall/RS0890231); the House Oct. 7, [245–138](https://voteview.com/rollcall/RH0890189), recommittal refused, [153–230](https://voteview.com/rollcall/RH0890188); the Senate took the House''s text Oct. 13.'
    n: '[Remarks at the Signing of the Highway Beautification Act of 1965](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-highway-beautification-act-1965) (Oct. 22, 1965). [111 Cong. Rec., Senate, Oct. 13, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-5-1.pdf). Lewis L. Gould, *Lady Bird Johnson and the Environment* (1988). Lady Bird Johnson, *A White House Diary* (K–J Adm. II.G.3). See [[cal.1965-10-02.conservation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-22.alabama
    when: Oct. 22
    date: '1965-10-22'
    thread: alabama
    c: 'Hayneville. An all-white jury acquits Wilkins at his second trial for the murder of Viola Liuzzo, after an hour and 45 minutes.'
    n: 'May, *The Informant* (K–J Cong. II.F). See [[cal.1965-03-25.alabama]]; [[cal.1965-05-07.alabama]]. Names: Wilkins, Liuzzo (K–J Cong. III.K).'
    tags: [name:wilkins-collie-leroy-jr, name:liuzzo-viola]
  - id: cal.1965-10-23.congress
    when: Oct. 23
    date: '1965-10-23'
    thread: congress
    c: 'The 89th Congress''s first session adjourns sine die after midnight, the Senate at 12:51 a.m., the House at 12:52. Johnson''s letter, read by Mansfield: the session "will be recorded as the greatest session of Congress in the history of our Nation." Oct. 7 he had given the members a salute at the State Department.'
    n: '[111 Cong. Rec., Senate, Oct. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-2-1.pdf); [111 Cong. Rec., House, Oct. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-2-2.pdf). [Remarks at the President''s Salute to Congress](https://www.presidency.ucsb.edu/documents/remarks-the-presidents-salute-congress) (Oct. 7, 1965). Zelizer, *The Fierce Urgency of Now*; Mackenzie & Weisbrot, *The Liberal Hour* (K–J Cong. II.B). See [[cal.1965-01-04.congress]]. Names: Mansfield (K–J Cong. III.A).'
    tags: [name:johnson-lyndon-b, name:mansfield-mike]
