# Cal. XCVI November 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XCVI
entries:
  - id: cal.1967-11-01.vietnam
    when: Nov. 1–2
    date: '1967-11-01'
    thread: vietnam
    c: 'McNamara''s "draft" memorandum to Johnson, a fifteen-month program, shown neither to Rusk, Rostow nor Wheeler: the present course will not bring success by the end of 1968 "in the eyes of the American public." He recommends: announce a stabilization, no more American forces and no wider operations against the North; plan a halt in the bombing; operations in the South reviewed to cut American casualties and give the South Vietnamese more of the war. Nov. 1–2, the senior advisers at State and the White House: Acheson, Ball, McGeorge Bundy, Clifford, Dillon, Fortas, Lodge, Murphy, Taylor, Bradley among them. Johnson''s five questions, Nov. 2. No one for getting out; Acheson and Bundy: no negotiations to be expected, the bombing to be played down; Ball for shifting it to the DMZ.'
    n: 'FRUS 1964–68, V, docs. [375](https://history.state.gov/historicaldocuments/frus1964-68v05/d375), [377](https://history.state.gov/historicaldocuments/frus1964-68v05/d377). [[w.mcnamara-in-retrospect]], 311–314; [[w.isaacson-wise-men]]; [[w.shapley-promise-and-power]]; [[w.barrett-uncertain-warriors]]; [[w.schandler-unmaking-of-a-president]]; [[w.gibbons-u-s-government-and-1995]]; [[w.berman-lyndon-johnsons-war]]. Made public: FRUS 1964–68, V (2002). Names: McNamara, Rusk, Rostow, Wheeler, Acheson, Ball, Bundy, Clifford, Dillon, Fortas, Lodge, Murphy, Taylor, Bradley, Johnson.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b, name:rusk-dean, name:rostow-walt-w, name:wheeler-earle, name:acheson-dean-g, name:ball-george-w, name:bundy-mcgeorge, name:clifford-clark, name:dillon-c-douglas, name:fortas-abe, name:lodge-henry-cabot, name:murphy-robert-d, name:taylor-maxwell, name:bradley-omar-n]
  - id: cal.1967-11-02.mayors-memphis
    when: Nov. 2
    date: '1967-11-02'
    thread: mayors
    also: [elections-1967]
    c: 'Memphis, under the charter of 1966: Loeb, mayor 1960–63, elected mayor over Mayor Ingram in the runoff, Ingram with most of the Negro vote. First round, Oct. 5, seven candidates; State Representative A. W. Willis Jr., the first Negro to run, fourth. Three Negroes elected to the council of thirteen (Check).'
    n: '[Wikipedia, "Henry Loeb"](https://en.wikipedia.org/wiki/Henry_Loeb); NAACP, [*Analysis of Run-Off Election, November 2, 1967*](https://radar.auctr.edu/islandora/object/auc.076%3A1958). Check: the Shelby County Election Commission''s returns, and the date of the first round. [[w.honey-going-down-jericho-road]]. See [[cal.1966-11-08.states-and-cities-memphis]]. Names: Loeb, Ingram, Willis.'
    tags: [state:tn, city:memphis, name:loeb-henry, name:ingram-william-b, name:willis-a-w-jr]
  - id: cal.1967-11-03.vietnam
    when: Nov. 3–23
    date: '1967-11-03'
    thread: vietnam
    c: 'Đắk Tô, in the Central Highlands near the Laotian and Cambodian borders: the 4th Infantry Division and the 173d Airborne Brigade, with South Vietnamese units, against four North Vietnamese regiments. Hill 875 taken Nov. 23, Thanksgiving. Check the dates and the forces.'
    n: '[[w.murphy-dak-to]]; [[w.cosmas-joint-chiefs-of-staff]]; [[w.westmoreland-soldier-reports]]; [[w.spector-after-tet]].'
  - id: cal.1967-11-03.cities-and-housing
    when: Nov. 3
    date: '1967-11-03'
    thread: cities-and-housing
    c: 'Independent Offices and HUD Appropriation Act signed: more than $600 million under the January budget, $500 million of it from HUD. Model cities cut $350 million; rent supplements from $40 million to $10 million; the neighborhood centers out; mass transit down $55 million. Johnson: of the House Republicans, 93 percent voted to recommit and kill the rent supplements, 80 percent to recommit and delete the model cities funds.'
    n: '[Statement by the President Upon Signing the Independent Offices and Department of Housing and Urban Development Appropriation Act, 1968](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-independent-offices-and-department-housing-and) (Nov. 3, 1967). [[w.haar-between-the-idea-and]]; [[w.zelizer-fierce-urgency-of-now]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-04.governors-la
    when: Nov. 4
    date: '1967-11-04'
    thread: governors
    also: [elections-1967, legislatures]
    c: 'Louisiana''s Democratic primary. McKeithen, the first governor the constitution lets succeed himself (the amendment of 1966), renominated, 836,304, 80.6 percent, over U.S. Representative Rarick, 179,846, 17.3; three others. No Republican files; the general election, Feb. 6, 1968, uncontested. Morial, a New Orleans lawyer, wins a House seat from Uptown in the primaries of 1967, the first Negro in the legislature since Reconstruction (Check: the round).'
    n: 'Votes: [Wikipedia, "1968 Louisiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Louisiana_gubernatorial_election), from the Secretary of State''s *Primary Election Returns*, 1967; [Wikipedia, "Dutch Morial"](https://en.wikipedia.org/wiki/Dutch_Morial). Check: the Secretary of State''s returns. [[w.peirce-deep-south-states-of]]; [[w.fairclough-race-and-democracy]]. See [[cal.1966-11-08.state-constitutions-la]]. Names: McKeithen, Rarick, Morial.'
    tags: [state:la, city:new-orleans, name:mckeithen-john-j, name:rarick-john-r, name:morial-ernest-n]
  - id: cal.1967-11-07.press-and-broadcasting
    when: Nov. 7
    date: '1967-11-07'
    thread: press-and-broadcasting
    c: 'Public Broadcasting Act signed, [81 Stat. 365](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg365.pdf): the Corporation for Public Broadcasting, a private nonprofit corporation, its fifteen directors appointed by the President with the Senate''s consent; $9 million authorized for it; grants for educational broadcast facilities, $10.5 million for fiscal 1968, $12.5 million for 1969, $15 million for 1970; a study of instructional television. The Carnegie Commission on Educational Television had proposed a corporation in January.'
    n: '[Remarks Upon Signing the Public Broadcasting Act of 1967](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-public-broadcasting-act-1967) (Nov. 7, 1967). [[w.television-public-television]]; [[w.engelman-public-radio-and-television]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-07.mayors-cleveland
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: Cleveland. Stokes (D) elected mayor over Seth Taft (R), 129,318 to 127,467, 50.4 percent. He and Hatcher at Gary the first Negroes elected mayor of cities over 100,000.
    n: 'Votes: [Wikipedia, "1967 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1967_Cleveland_mayoral_election), from Our Campaigns. Check: the Cuyahoga County Board of Elections. See [[cal.1967-10-03.mayors-cleveland]]. Names: Stokes, Taft, Hatcher.'
    tags: [state:oh, city:cleveland, name:stokes-carl-b, name:taft-seth-c, name:hatcher-richard-g]
  - id: cal.1967-11-07.mayors-gary
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967, voting-rights]
    c: Gary. Hatcher (D) elected mayor over Joseph Radigan (R), 39,940 to 37,729, 51.4 percent, the Lake County Democratic organization, Krupa its chairman, for Radigan. Nov. 6, the federal court at Hammond enjoins the organization's officials in Gary from interfering with the election, on suits of the Justice Department and Hatcher (Check). The National Guard stands by.
    n: '*Observer* (Notre Dame), [Nov. 9, 1967](https://archives.nd.edu/Observer/1967-11-09_v02_022.pdf), 1. Votes: [Wikipedia, "1967 Gary, Indiana, mayoral election"](https://en.wikipedia.org/wiki/1967_Gary,_Indiana,_mayoral_election), from Our Campaigns. Check: the Lake County canvass; the suits'' titles. See [[cal.1967-05-02.mayors-gary]]. Names: Hatcher, Radigan, Krupa.'
    tags: [state:in, city:gary, name:hatcher-richard-g, name:radigan-joseph-b, name:krupa-john-g]
  - id: cal.1967-11-07.mayors-boston
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: Boston. White elected mayor over Hicks, 102,706 to 90,154, 53.3 percent. Sworn Jan. 1.
    n: '[Boston, *Annual Report of the Election Department*, 1967 (City Document No. 10), 107](https://archive.org/details/annualreportofbo1967bost/page/n116/mode/1up). See [[cal.1967-09-26.mayors-boston]]. Names: White, Hicks.'
    tags: [state:ma, city:boston, name:white-kevin-h, name:hicks-louise-d]
  - id: cal.1967-11-07.mayors-philadelphia
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: Philadelphia. Tate (D) re-elected over Specter (R), 353,326 to 342,398, 49.0 percent; Cecil Moore (Political Freedom Rights) 9,031, 1.3; two others.
    n: 'Votes: [Wikipedia, "1967 Philadelphia mayoral election"](https://en.wikipedia.org/wiki/1967_Philadelphia_mayoral_election), from the city''s list of mayors. [*New York Times*, Nov. 8, 1967](https://www.nytimes.com/1967/11/08/archives/fate-beats-specter-in-philadelphia-mayors-race.html). Check: the County Board of Elections'' returns. See [[cal.1967-05-16.mayors-philadelphia]]. Names: Tate, Specter, Moore.'
    tags: [state:pa, city:philadelphia, name:tate-james-h-j, name:specter-arlen, name:moore-cecil-b]
  - id: cal.1967-11-07.mayors-indianapolis
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: Indianapolis. Richard Lugar (R), once of the school board, elected mayor over Mayor Barton (D), 72,278 to 63,284, 53.3 percent. Republicans take the city council, 6 to 3.
    n: 'Votes: [Wikipedia, "1967 Indianapolis mayoral election"](https://en.wikipedia.org/wiki/1967_Indianapolis_mayoral_election). Check: the Marion County canvass. [[w.encyclopedia-of-indianapolis]]. See [[cal.1963-11-05.mayors-indianapolis]]. Names: Lugar, Barton.'
    tags: [state:in, city:indianapolis, name:lugar-richard-g, name:barton-john-j]
  - id: cal.1967-11-07.state-constitutions-ny
    when: Nov. 7
    date: '1967-11-07'
    thread: state-constitutions
    also: [elections-1967, transportation]
    c: New York's voters reject the convention's constitution, 1,327,999 to 3,487,513, 27.6 percent for. They approve Rockefeller's transportation bond issue, $2.5 billion (Check the vote).
    n: '[New York State Constitutional Convention Clearinghouse, results of the referendums to ratify](https://newyork.concon.info/?p=315). Check: the *Legislative Manual*, 1968; [*New York Times*, Dec. 12, 1967, 37](https://www.nytimes.com/1967/12/12/archives/new-charter-lost-by-2million-votes.html), the official canvass. See [[cal.1967-04-04.state-constitutions-ny]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1967-11-07.legislatures-nj
    when: Nov. 7
    date: '1967-11-07'
    thread: legislatures
    also: [elections-1967]
    c: 'New Jersey''s legislative elections, the first under the districts of the 1966 convention, a Senate of forty: Republicans 31 seats, Democrats 9; in the outgoing Senate Democrats 18, Republicans 8. Republicans take the Assembly too (Check the count). Hughes, a Democrat, faces Republican majorities in both houses.'
    n: '[*Results of the General Election Held November 7, 1967*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1967-general-election.pdf) (Secretary of State); [Wikipedia, "1967 New Jersey Senate election"](https://en.wikipedia.org/wiki/1967_New_Jersey_Senate_election). [[w.salmore-new-jersey-politics-and]]. See [[cal.1966-11-08.state-constitutions-nj]]; [[cal.1965-11-02.governors-nj]]. Names: Hughes.'
    tags: [state:nj, name:hughes-richard-j]
  - id: cal.1967-11-07.governors
    when: Nov. 7
    date: '1967-11-07'
    thread: governors
    also: [elections-1967]
    c: 'Two governors elected. Kentucky: Nunn (R) over Ward (D), 51.2 percent, the State''s first Republican governor since 1943; a Republican gain. Mississippi: John Bell Williams (D) over Phillips (R), 70.3 percent. Governorships after the election: Republicans 26, Democrats 24.'
    n: '[Kentucky, Secretary of State, "1967 General Election Results"](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf); [Wikipedia, "1967 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1967_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). Check: Mississippi''s official returns. [[w.sabato-goodbye-to-good-time]]. Names: Nunn, Ward, Williams, Phillips.'
    tags: [governors:1967-11-07, state:ky, state:ms, name:nunn-louie-b, name:ward-henry, name:williams-john-b, name:phillips-rubel]
  - id: cal.1967-11-07.mississippi-ms
    when: Nov. 7
    date: '1967-11-07'
    thread: mississippi
    also: [governors, legislatures, elections-1967, voting-rights]
    c: 'Mississippi. Williams (D) elected governor over Rubel Phillips (R), 315,318 to 133,379, 70.3 percent; the Freedom Democrats had endorsed Phillips. The legislature elected in the districts the federal court drew. In Holmes County, Robert Clark, a teacher, on the Freedom Democrats'' slate, elected to the House: the first Negro in the legislature since the 1890s. He takes his seat Jan. 2, 1968.'
    n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election); [Wikipedia, "Robert G. Clark Jr."](https://en.wikipedia.org/wiki/Robert_G._Clark_Jr.); [SNCC Digital Gateway, "November 1967"](https://snccdigital.org/?p=166). Check: MDAH Series 0107; *Mississippi Official and Statistical Register, 1968–1972*. [[w.campbell-robert-g-clarks-journey]]; [[w.parker-black-votes-count]]; [[w.dittmer-local-people]]. See [[cal.1967-08-29.mississippi-ms]]; [[cal.1966-07-22.mississippi-ms]]. Names: Williams, Phillips, Clark.'
    tags: [state:ms, name:williams-john-b, name:phillips-rubel, name:clark-robert-g-jr]
  - id: cal.1967-11-07.governors-ky
    when: Nov. 7
    date: '1967-11-07'
    thread: governors
    also: [elections-1967]
    c: Kentucky. Nunn (R) elected governor over Ward (D), 454,123 to 425,674, 51.2 percent; a third candidate 7,149. The first Republican governor elected since 1943. Chandler had endorsed Nunn. The Democrats keep the lieutenant governorship and the General Assembly.
    n: '[Ky. *Statement of the Official Vote*, general election, Nov. 7, 1967](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=6). [[w.harrison-new-history-of-kentucky]], 413–14. See [[cal.1967-05-23.governors-ky]]. Names: Nunn, Ward, Chandler.'
    tags: [state:ky, name:nunn-louie-b, name:ward-henry, name:chandler-a-b]
  - id: cal.1967-11-07.legislatures-va
    when: Nov. 7
    date: '1967-11-07'
    thread: legislatures
    also: [elections-1967, voting-rights]
    c: Virginia, the General Assembly. William Ferguson Reid, a Richmond surgeon, a founder of the Richmond Crusade for Voters, elected to the House of Delegates, the first Negro in the Assembly since 1891; a segregationist delegate unseated. Takes his seat in January.
    n: '[Wikipedia, "William Ferguson Reid"](https://en.wikipedia.org/wiki/William_Ferguson_Reid), from the State Board of Elections'' *Statement of the Vote*, Nov. 7, 1967. Check: [the State''s historical database](https://historical.elections.virginia.gov/) for his district and vote. [[w.atkinson-dynamic-dominion]]; [[w.heinemann-harry-byrd-of-virginia]]. Names: Reid.'
    tags: [state:va, city:richmond, name:reid-william-ferguson]
  - id: cal.1967-11-07.mayors-san-francisco
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: San Francisco. Alioto elected mayor, 110,405, 44.2 percent, over Dobbs, 94,504, 37.8, and Jack Morrison of the Board of Supervisors, 40,438, 16.2; fifteen others. Alioto entered after McAteer, the leading candidate, died in May; Shelley withdrew.
    n: 'Votes: [Wikipedia, "1967 San Francisco mayoral election"](https://en.wikipedia.org/wiki/1967_San_Francisco_mayoral_election), from Our Campaigns; Check: the Registrar of Voters'' statement of the vote, and the dates of McAteer''s death and Shelley''s withdrawal. [[w.hartman-city-for-sale]]; [[w.peirce-pacific-states-of-america]]. See [[cal.1963-11-05.mayors-san-francisco]]. Names: Alioto, Dobbs, Morrison, McAteer, Shelley.'
    tags: [state:ca, city:san-francisco, name:alioto-joseph-l, name:dobbs-harold, name:morrison-jack, name:mcateer-j-eugene, name:shelley-john-f]
  - id: cal.1967-11-07.state-constitutions-san-francisco
    when: Nov. 7
    date: '1967-11-07'
    thread: state-constitutions
    also: [war-opposition]
    c: San Francisco's voters reject Proposition P, a declaration of policy for a cease-fire and the withdrawal of American troops from Vietnam, put on the ballot by the State Supreme Court's order (Check the figures).
    n: 'Check: *Farley v. Healey*, 67 Cal. 2d 325 (1967); the Registrar of Voters'' statement of the vote. [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]. See [[cal.1967-10-16.war-opposition]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1967-11-07.mayors-san-diego
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: San Diego. Curran re-elected mayor over Hitch, 96,597 to 47,230, 67.2 percent.
    n: 'Votes: [City Clerk, *Election History: Mayor*](https://www.sandiego.gov/sites/default/files/legacy/city-clerk/pdf/mayorresults.pdf). See [[cal.1967-09-19.mayors-san-diego]]. Names: Curran, Hitch.'
    tags: [state:ca, city:san-diego, name:curran-frank, name:hitch-allen]
  - id: cal.1967-11-08.women
    when: Nov. 8
    date: '1967-11-08'
    thread: women
    also: [defense]
    c: 'Signed, [81 Stat. 374](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg374.pdf): the limits on the careers of women officers in the armed forces removed; the ceiling of 2 percent on women''s strength lifted; women eligible for permanent promotion to general and flag rank (Check the terms). Oveta Culp Hobby, the first director of the Women''s Army Auxiliary Corps, at the signing.'
    n: '[Remarks Upon Signing Bill Providing Equal Opportunity in Promotions for Women in the Armed Forces](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-providing-equal-opportunity-promotions-for-women-the-armed) (Nov. 8, 1967). [[w.harrison-on-account-of-sex]]. Names: Hobby, Johnson.'
    tags: [name:johnson-lyndon-b, name:hobby-oveta-culp]
  - id: cal.1967-11-08.foreign-aid
    when: Nov. 8–14
    date: '1967-11-08'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1967. The House adopts the conference report, [205–188](https://voteview.com/rollcall/RH0900202), after refusing to recommit it, [196–200](https://voteview.com/rollcall/RH0900201), with instructions to insist on amendments against countries trading with North Vietnam. Signed Nov. 14, [81 Stat. 445](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg445.pdf). Johnson: the authorization nearly $400 million under his request, already the lowest; the cuts "reduce the margin of hope to the danger point."'
    n: '[Statement by the President Upon Signing the Foreign Assistance Act of 1967](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-assistance-act-1967) (Nov. 15, 1967). [[w.zelizer-fierce-urgency-of-now]]; [[w.brands-wages-of-globalism]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-09.space
    when: Nov. 9
    date: '1967-11-09'
    thread: space
    c: 'Apollo 4, unmanned: the first Saturn V launched from Cape Kennedy, all three stages; the command module recovered in the Pacific. Johnson: the flight has shown "we can launch and bring back safely to earth the spaceship that will take men to the moon."'
    n: '[Statement by the President on the Successful Launching of the First Saturn V Rocket](https://www.presidency.ucsb.edu/documents/statement-the-president-the-successful-launching-the-first-saturn-v-rocket) (Nov. 9, 1967). [[w.bilstein-stages-to-saturn]]; [[w.lambright-powering-apollo]]. See [[cal.1967-01-27.space-2]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-09.states-and-cities-nyc
    when: Nov. 9
    date: '1967-11-09'
    thread: states-and-cities
    c: 'New York City. Lindsay''s Advisory Panel on Decentralization, Bundy its chairman, reports, *Reconnection for Learning*: the schools to be divided into thirty to sixty community districts, each with a board chosen largely by parents, with power over budget, staff and curriculum. Check the day.'
    n: '[[w.schools-reconnection-for-learning|full]]. [Wikipedia, "Bundy Report"](https://en.wikipedia.org/wiki/Bundy_Report). See [[cal.1967-07.states-and-cities-nyc]]. Names: Lindsay, Bundy.'
    tags: [state:ny, city:nyc, name:lindsay-john-v, name:bundy-mcgeorge]
  - id: cal.1967-11-10.governors-tx
    when: Nov. 10
    date: '1967-11-10'
    thread: governors
    also: [elections-1968]
    c: 'Texas. Connally: he does not "intend to be a candidate for reelection," after eight years of public service; no fourth term. The race for 1968 opens.'
    n: '[*The Battalion* (Texas A&M), Nov. 10, 1967, 1](https://newspaper.library.tamu.edu/lccn/sn86088544/1967-11-10/ed-1/seq-1.pdf). Check: the day of the announcement. [[w.reston-lone-star]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1966-05-07.governors-tx]]. Names: Connally.'
    tags: [state:tx, name:connally-john]
  - id: cal.1967-11-11.war-opposition
    when: Nov. 11
    date: '1967-11-11'
    thread: war-opposition
    also: [vietnam]
    c: Phnom Penh. The NLF releases three American prisoners, Army sergeants, to Hayden; they return to the United States with him (Check the date and the route).
    n: '[[w.hershberger-traveling-to-vietnam]]; [[w.wells-war-within]]. Names: Hayden.'
    tags: [name:hayden-tom]
  - id: cal.1967-11-11.state-constitutions-tx
    when: Nov. 11
    date: '1967-11-11'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Texas adopts six amendments: the Veterans'' Land Fund''s bonds raised to $400 million, 58.7 percent; a Texas Park Development Fund and its bonds, 54.7; counties to pay medical expenses of officers hurt on duty, 65.4; counties to put their taxes in one general fund, 50.3; and two others.'
    n: 'Texas Legislative Council, [*Amendments to the Texas Constitution Since 1876*](https://tlc.texas.gov/docs/amendments/Constamend1876.pdf) (2026), art. 3, §§ 49-b, 49-e, 52e; art. 8, § 9; art. 9, § 13; art. 16, § 33. Check: the Secretary of State''s canvass. [[w.reston-lone-star]]. See [[cal.1966-11-08.state-constitutions-tx]].'
    tags: [state:tx]
  - id: cal.1967-11-13.vietnam
    when: Nov. 13–22
    date: '1967-11-13'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Bunker, Westmoreland and Komer in Washington. Nov. 15, Bunker to the President, Rusk, McNamara, Wheeler and Helms: to Congress''s committees he reported "steady progress on the political, military, and economic front." Nov. 17, news conference: "constructive dissent" is not "storm trooper bullying"; whether he will run, "I will cross that bridge when I get to it." Nov. 19, Bunker and Westmoreland on *Meet the Press*. Nov. 21, Westmoreland at the National Press Club: "We have reached an important point when the end begins to come into view"; a phasing down of the American effort conceivable "within two years or less" (Check the words). The same morning, the President with them and his advisers: more allied troops, and the troops approved, as fast as possible.'
    n: 'FRUS 1964–68, V, docs. [400](https://history.state.gov/historicaldocuments/frus1964-68v05/d400), [409](https://history.state.gov/historicaldocuments/frus1964-68v05/d409). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1199) (Nov. 17, 1967). [[w.westmoreland-soldier-reports]]; [[w.sorley-westmoreland]]; [[w.schaffer-ellsworth-bunker]]; [[w.hammond-public-affairs]]; [[w.oberdorfer-tet]]; [[w.schmitz-tet-offensive]]. See [[cal.1967-11-01.vietnam]]. Names: Bunker, Westmoreland, Komer, Rusk, McNamara, Wheeler, Helms, Johnson.'
    tags: [name:bunker-ellsworth, name:westmoreland-william, name:komer-robert-w, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:helms-richard, name:johnson-lyndon-b]
  - id: cal.1967-11-14.japan-and-korea
    when: Nov. 14–15
    date: '1967-11-14'
    thread: japan-and-korea
    c: 'Satō at the White House. Joint statement, Nov. 15: consultations at once on the early return of the Bonin Islands to Japan, the American bases there kept under the security treaty. The Ryukyus: Satō asks that the two governments agree "within a few years" on a date for their reversion; Johnson "fully understands" the desire. A subcommittee on the two countries'' balance of payments.'
    n: '[Joint Statement Following Discussions With Prime Minister Sato of Japan](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-prime-minister-sato-japan-0) (Nov. 15, 1967). FRUS 1964–68, XXIX, pt. 2, docs. [102](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d102), [105](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d105). [[w.sarantakes-keystone]]; [[w.schaller-altered-states]]. Names: Satō, Johnson.'
    tags: [name:sato-eisaku, name:johnson-lyndon-b]
  - id: cal.1967-11-15.europe-and-the-alliance
    when: Nov. 15–Dec. 5
    date: '1967-11-15'
    thread: europe-and-the-alliance
    c: 'Cyprus. Nov. 15, Grivas''s National Guard attacks the Turkish Cypriot villages of Ayios Theodoros and Kophinou; fighting stops on orders from Athens. Turkey readies an invasion and demands the Greek troops on the island withdrawn and Grivas out. Nov. 22, Vance sent as Johnson''s emissary: Ankara, Athens, Nicosia. Brosio and Rolz-Bennett for NATO and the UN. Nov. 29, the NSC: Rusk, Vance "has warded off war between Turkey and Greece"; Greece and Turkey accept a statement, Makarios to be persuaded. Dec. 3–4, agreement: Greek forces beyond the 1960 treaty''s numbers withdrawn, Turkey''s mobilization undone (Check the terms). Dec. 5, Johnson''s statement: "peace has emerged the victor."'
    n: 'FRUS 1964–68, XVI, docs. [308](https://history.state.gov/historicaldocuments/frus1964-68v16/d308), [318](https://history.state.gov/historicaldocuments/frus1964-68v16/d318), [332](https://history.state.gov/historicaldocuments/frus1964-68v16/d332), [342](https://history.state.gov/historicaldocuments/frus1964-68v16/d342). [Statement by the President on the Preservation of Peace in Cyprus](https://www.presidency.ucsb.edu/documents/statement-the-president-the-preservation-peace-cyprus) (Dec. 5, 1967). [[w.nicolet-united-states-policy-towards]]; [[w.miller-united-states-and-the]]. See [[cal.1964-01-25.europe-and-the-alliance]]. Names: Grivas, Vance, Brosio, Rolz-Bennett, Rusk, Makarios, Johnson.'
    tags: [name:grivas-george, name:vance-cyrus, name:brosio-manlio-g, name:rolz-bennett-jose, name:rusk-dean, name:makarios-iii, name:johnson-lyndon-b]
  - id: cal.1967-11-15.poverty
    when: Nov. 15–Dec. 23
    date: '1967-11-15'
    thread: poverty
    c: 'Economic Opportunity Amendments. The House: no funds or personnel for an unlawful civil disturbance, [332–79](https://voteview.com/rollcall/RH0900205); recommitted with instructions to cut $920 million, [221–190](https://voteview.com/rollcall/RH0900206); passed, [283–129](https://voteview.com/rollcall/RH0900207). Green''s amendment: the community action agency designated by the State or local government; its board a third public officials, at least a third chosen to represent the poor, the rest from the community''s groups. Conference report through the House Dec. 11, [247–149](https://voteview.com/rollcall/RH0900232). Signed Dec. 23, [81 Stat. 672](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg672.pdf): $1.98 billion authorized for fiscal 1968, $2.18 billion for 1969. The supplemental appropriation: the Senate refuses to cut $192 million from the poverty programs, [30–46](https://voteview.com/rollcall/RS0900310), Dec. 14.'
    n: 'Statute (K–J Cong. II.J.2). [[w.zelizer-fierce-urgency-of-now]]; [[w.matusow-unraveling-of-america]]; [[w.davies-from-opportunity-to-entitlement]]. Names: Green.'
    tags: [name:green-edith, name:johnson-lyndon-b]
  - id: cal.1967-11-17.students-philadelphia
    when: Nov. 17
    date: '1967-11-17'
    thread: students
    also: [states-and-cities]
    c: Philadelphia. Some 3,500 Negro high school students walk out to the Board of Education for courses in Negro history, more Negro teachers and the right to wear African dress. Rizzo, police commissioner since May, sends in the police; students and others beaten and arrested. Check the figures.
    n: '[Chalkbeat, Sept. 25, 2002](https://chalkbeat.org/philadelphia/2002/9/25/22185400/1967-african-american-students-strike-survive-police-riot-to-force-change); [WHYY](https://whyy.org/segments/honoring-50th-anniversary-pivotal-student-protest-philadelphia). Check: *Philadelphia Inquirer*, Nov. 18, 1967. [[w.countryman-up-south]]. Names: Rizzo.'
    tags: [state:pa, city:philadelphia, name:rizzo-frank-l]
  - id: cal.1967-11-18.economy
    when: Nov. 18–26
    date: '1967-11-18'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Sterling devalued, from $2.80 to $2.40, 14.3 percent; Bank rate to 8 percent; credits for Britain, an IMF standby among them. Johnson''s statement: the United States "will continue to meet its international monetary responsibilities"; gold bought and sold at $35 an ounce. Nov. 18, Johnson with Fowler, Martin and the congressional leaders: the dollar''s defense, and the need for the tax increase. Nov. 19, the Reserve Banks'' discount rate from 4 to 4½ percent (Check the dates). Gold pool losses. Nov. 26, Frankfurt: the gold pool''s central banks to keep the price at $35.'
    n: '[Statement by the President on the Devaluation of the British Pound](https://www.presidency.ucsb.edu/documents/statement-the-president-the-devaluation-the-british-pound) (Nov. 18, 1967). FRUS 1964–68, VIII, docs. [150](https://history.state.gov/historicaldocuments/frus1964-68v08/d150), [154](https://history.state.gov/historicaldocuments/frus1964-68v08/d154), [156](https://history.state.gov/historicaldocuments/frus1964-68v08/d156); XII, doc. [279](https://history.state.gov/historicaldocuments/frus1964-68v12/d279). [[w.cairncross-sterling-in-decline]]; [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]; [[w.wilson-labour-government-1964-1970]]. See [[cal.1966-07-29.europe-and-the-alliance]]. Names: Fowler, Martin, Johnson.'
    tags: [name:johnson-lyndon-b, name:fowler-henry-h, name:martin-william-mcchesney-jr]
  - id: cal.1967-11-18.elections-1968
    when: Nov. 18
    date: '1967-11-18'
    thread: elections-1968
    c: Detroit, the Veterans Memorial Building. Romney announces for the Republican nomination; to campaign first in New Hampshire.
    n: '[[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.mollenhoff-george-romney]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1966-12-09.elections-1968-us]]. Names: Romney.'
    tags: [name:romney-george-w, state:mi, city:detroit]
  - id: cal.1967-11-20.consumers
    when: Nov. 20
    date: '1967-11-20'
    thread: consumers
    c: 'Signed, [81 Stat. 466](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg466-3.pdf): the National Commission on Product Safety, seven members, to study the hazards of household products and report in two years (Check). The House had passed it, [205–102](https://voteview.com/rollcall/RH0900193), Nov. 6. Johnson: 125,000 Americans hurt each year by faulty heating devices.'
    n: '[Remarks Upon Signing Bill Establishing the National Commission on Product Safety](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-establishing-the-national-commission-product-safety) (Nov. 20, 1967). [[w.nadel-politics-of-consumer-protection]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-20.health-ca
    when: Nov. 20
    date: '1967-11-20'
    thread: health
    also: [welfare]
    c: '*Morris v. Williams*, 67 Cal. 2d 733: the Supreme Court of California holds unlawful the Health and Welfare Agency''s regulations cutting Medi-Cal''s services: physicians'' services restricted while the medically indigent stayed in the program; services cut out without showing that proportionate cuts could not be made. A class action brought by California Rural Legal Assistance.'
    n: '[Opinion](https://scocal.stanford.edu/opinion/morris-v-williams-32900) (SCOCAL). [[w.stevens-welfare-medicine-in-america]]; [[w.engel-poor-peoples-medicine]]; [[w.cannon-governor-reagan]]. See [[cal.1966-12.health-us]]. Check: the date of the regulations (Aug. 1967) and the sum restored.'
    tags: [state:ca]
  - id: cal.1967-11-21.conservation
    when: Nov. 21
    date: '1967-11-21'
    thread: conservation
    c: 'Air Quality Act signed, [81 Stat. 485](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg485.pdf): HEW to designate air quality control regions and issue criteria and control techniques; the States to set standards for their regions and plans to meet them, HEW to act where they do not; federal standards for new cars'' emissions, the States barred from their own but California. Muskie''s bill. Johnson: "at least 130 million tons of poison into the air each year."'
    n: '[Remarks Upon Signing the Air Quality Act of 1967](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-air-quality-act-1967) (Nov. 21, 1967). Statute (K–J Cong. II.J.2). [[w.davies-politics-of-pollution]]; [[w.jones-clean-air]]; [[w.dewey-dont-breathe-the-air]]. Names: Muskie, Johnson.'
    tags: [name:muskie-edmund-s, name:johnson-lyndon-b]
  - id: cal.1967-11-21.vietnam
    when: Nov. 21–Dec. 2
    date: '1967-11-21'
    thread: vietnam
    c: 'Packers. Harriman abroad, on the Romanian channel: the Shah of Iran, Nov. 24; Bucharest, Nov. 28–29, Maurer, back from Hanoi in October; Tito; Ayub. To Johnson, Dec. 2: all said the Russians would increase their aid to Hanoi to offset any American escalation.'
    n: 'FRUS 1964–68, V, docs. [411](https://history.state.gov/historicaldocuments/frus1964-68v05/d411), [425](https://history.state.gov/historicaldocuments/frus1964-68v05/d425). [[w.herring-secret-diplomacy-of-the]]. Names: Harriman, Pahlavi, Maurer, Tito, Ayub, Johnson.'
    tags: [name:harriman-w-averell, name:maurer-ion-gheorghe, name:tito-josip-broz, name:ayub-khan-mohammad, name:pahlavi-mohammed-reza, name:johnson-lyndon-b]
  - id: cal.1967-11-22.middle-east
    when: Nov. 22
    date: '1967-11-22'
    thread: middle-east
    also: [soviet-union]
    c: 'Kosygin to Johnson, Nov. 19: the American representatives to act on the withdrawal of Israeli troops. Johnson, the same day: support the British draft, which both sides could find tolerable. Nov. 22, the Security Council adopts the British draft unanimously, Resolution 242: "the inadmissibility of the acquisition of territory by war"; withdrawal of Israeli forces "from territories occupied in the recent conflict"; an end to belligerency, every State''s right to live "within secure and recognized boundaries"; freedom of navigation; a just settlement of the refugee problem; a Special Representative. Nov. 23, U Thant names Jarring.'
    n: 'Security Council Resolution [242 (1967)](https://undocs.org/S/RES/242(1967)). FRUS 1964–68, XIX, docs. [534](https://history.state.gov/historicaldocuments/frus1964-68v19/d534), [535](https://history.state.gov/historicaldocuments/frus1964-68v19/d535), [541](https://history.state.gov/historicaldocuments/frus1964-68v19/d541), [542](https://history.state.gov/historicaldocuments/frus1964-68v19/d542). [[w.quandt-peace-process]]; [[w.spiegel-other-arab-israeli-conflict]]. See [[cal.1967-06-05.middle-east]]. Names: Kosygin, U Thant, Jarring, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b, name:u-thant, name:jarring-gunnar-v, name:goldberg-arthur-j]
  - id: cal.1967-11-22.welfare
    when: Nov. 22–Dec. 15
    date: '1967-11-22'
    thread: welfare
    also: [health]
    c: 'Social Security Amendments. The Senate passes its bill, [78–6](https://voteview.com/rollcall/RS0900275). Johnson: benefits up more than 20 percent on average, the minimum from $44 to $70. The conference: 13 percent, the minimum $55. The House''s limits on aid to dependent children kept: federal matching frozen at the proportion of children in each State on the rolls by reason of a parent''s absence, Jan. 1968; adults and older children referred to work or training, the work incentive program. The House adopts the report, [390–3](https://voteview.com/rollcall/RH0900239), Dec. 13; the Senate, [62–14](https://voteview.com/rollcall/RS0900312), Dec. 15, after Robert Kennedy and Harris oppose the freeze. Check the terms.'
    n: '[Statement by the President Following Senate Approval of the Bill To Increase Social Security Benefits](https://www.presidency.ucsb.edu/documents/statement-the-president-following-senate-approval-the-bill-increase-social-security) (Nov. 22, 1967). [[w.steiner-state-of-welfare]]. See [[cal.1967-08-17.welfare]]. Names: Robert Kennedy, Harris, Johnson.'
    tags: [name:johnson-lyndon-b, name:kennedy-robert-f, name:harris-fred-r]
  - id: cal.1967-11-27.european-community
    when: Nov. 27–Dec. 19
    date: '1967-11-27'
    thread: european-community
    also: [europe-and-the-alliance]
    c: 'De Gaulle''s press conference, Nov. 27: Britain, after the devaluation, not ready to enter the Common Market; its entry would break the Community. Dec. 19, the Six''s Council of Ministers in Brussels: France will not agree to opening negotiations; Britain''s application stays on the agenda (Check).'
    n: '[[w.parr-britains-policy-towards-the]]; [[w.schwartz-lyndon-johnson-and-europe]]. Names: de Gaulle.'
    tags: [name:de-gaulle-charles]
  - id: cal.1967-11-27.trade
    when: Nov. 27–Dec. 16
    date: '1967-11-27'
    thread: trade
    c: 'The Kennedy Round. Johnson sends Congress the agreement signed at Geneva June 30, as the Trade Expansion Act requires: concessions on $7½ to $8 billion of American exports, cuts on about as much of its imports. Dec. 16, Proclamation 3822: the first of five annual cuts in duties, Jan. 1, 1968.'
    n: '[Special Message to the Congress Transmitting Multilateral Trade Agreement Concluding the Kennedy Round of Trade Negotiations](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-multilateral-trade-agreement-concluding-the) (Nov. 27, 1967); [Remarks Upon Signing the Kennedy Round Trade Negotiations Proclamation](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-kennedy-round-trade-negotiations-proclamation) (Dec. 16, 1967); [Proclamation 3822](https://www.presidency.ucsb.edu/documents/proclamation-3822-carry-out-geneva-1967-protocol-the-general-agreement-tariffs-and-trade). [[w.preeg-traders-and-diplomats]]; [[w.zeiler-american-trade-and-power]]. See [[cal.1964-05-04.trade]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-29.defense
    when: Nov. 29
    date: '1967-11-29'
    thread: defense
    also: [foreign-aid]
    c: 'McNamara to be president of the World Bank, Woods''s successor, Woods and Fowler recommending him. Johnson''s statement: he will stay at Defense until the President and he agree on a time.'
    n: '[Statement by the President on the Nomination of Secretary McNamara as President of the International Bank for Reconstruction and Development](https://www.presidency.ucsb.edu/documents/statement-the-president-the-nomination-secretary-mcnamara-president-the-international-bank) (Nov. 29, 1967). [[w.shapley-promise-and-power]]; [[w.mcnamara-in-retrospect]], 311–314; [[w.dallek-flawed-giant]]. See [[cal.1967-11-01.vietnam]]. Names: McNamara, Woods, Fowler, Johnson.'
    tags: [name:mcnamara-robert-s, name:woods-george-d, name:fowler-henry-h, name:johnson-lyndon-b]
  - id: cal.1967-11-29.economy
    when: Nov. 29–Dec. 19
    date: '1967-11-29'
    thread: economy
    also: [congress]
    c: 'The surcharge after the devaluation. Ways and Means hears Fowler and Martin again (Check the dates); Mills and Byrnes: no tax increase without cuts in spending. The continuing resolution: the House adopts the cut, [368–26](https://voteview.com/rollcall/RH0900234), Dec. 11; the Senate, [74–0](https://voteview.com/rollcall/RS0900308), Dec. 12. Signed Dec. 18, [81 Stat. 662](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg662-2.pdf): each civilian agency''s obligations cut by a percent of payroll and 10 percent of other controllable obligations; Defense 10 percent of non-Vietnam programs. Johnson: $4.3 billion in all, $2.5 billion more than Congress''s own cuts. No tax bill in the session.'
    n: '[Statement by the President After Signing Joint Resolution Providing for Continuing Appropriations, Fiscal Year 1968](https://www.presidency.ucsb.edu/documents/statement-the-president-after-signing-joint-resolution-providing-for-continuing) (Dec. 19, 1967). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1200) (Dec. 4, 1967). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]. See [[cal.1967-01-10.economy]]. Names: Fowler, Martin, Mills, Byrnes, Johnson.'
    tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr, name:mills-wilbur-d, name:byrnes-john-w, name:johnson-lyndon-b]
  - id: cal.1967-11-30.elections-1968
    when: Nov. 30
    date: '1967-11-30'
    thread: elections-1968
    also: [vietnam]
    c: 'Washington. McCarthy announces he will enter Democratic primaries against Johnson: Wisconsin, Oregon, California and Nebraska; Massachusetts and New Hampshire undecided (Check the States). "The Administration seems to have set no limit to the price which it is willing to pay for a military victory"; the challenge may "alleviate at least in some degree this sense of political helplessness." Dec. 2, Chicago, the Conference of Concerned Democrats: his first speech as a candidate; Lowenstein before him.'
    n: '[[w.mccarthy-year-of-the-people]]; [[w.eisele-almost-to-the-presidency]]; [[w.herzog-mccarthy-for-president]]; [[w.larner-nobody-knows]]; [[w.sandbrook-eugene-mccarthy]]; [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]. Names: McCarthy, Lowenstein, Johnson.'
    tags: [name:mccarthy-eugene-j, name:lowenstein-allard, name:johnson-lyndon-b]
  - id: cal.1967-11-30.vietnam
    when: Nov. 30–Dec. 5
    date: '1967-11-30'
    thread: vietnam
    also: [congress]
    c: 'The Senate adopts Mansfield''s resolution, S. Res. 180, [82–0](https://voteview.com/rollcall/RS0900290): the sense of the Senate that the President take the American resolution of Jan. 31, 1966, to the Security Council again. Rusk and Goldberg to Johnson: move before Jan. 1, when the Council''s membership changes. Dec. 5, Johnson: the British may ask a bombing halt with nothing in return. No decision.'
    n: 'FRUS 1964–68, V, docs. [421](https://history.state.gov/historicaldocuments/frus1964-68v05/d421), [428](https://history.state.gov/historicaldocuments/frus1964-68v05/d428). [[w.gibbons-u-s-government-and-1995]]; [[w.oberdorfer-senator-mansfield-2003]]. See [[cal.1966-01-31.vietnam]]. Names: Mansfield, Rusk, Goldberg, Johnson.'
    tags: [name:mansfield-mike, name:rusk-dean, name:goldberg-arthur-j, name:johnson-lyndon-b]
  - id: cal.1967-11.mayors-baltimore
    when: Nov.
    date: 1967-11
    thread: mayors
    also: [elections-1967]
    c: 'Baltimore. Thomas D''Alesandro III, president of the City Council, son of the mayor of 1947–59, elected mayor over Arthur W. Sherwood (R), 138,938 to 28,528, 83.0 percent, carrying every precinct. McKeldin (R) not running. Democratic primary: D''Alesandro 91,965, 75.0; Angelos, once a councilman, 30,641. Sworn Dec. 5.'
    n: 'Votes: [Wikipedia, "1967 Baltimore mayoral election"](https://en.wikipedia.org/wiki/1967_Baltimore_mayoral_election), from Our Campaigns. Check: the dates of the primary and the election (Wikipedia gives Nov. 2), and the Board of Supervisors of Elections'' returns. [[w.durr-behind-the-backlash]]. Names: D''Alesandro, Angelos, McKeldin.'
    tags: [state:md, city:baltimore, name:dalesandro-thomas-iii, name:angelos-peter-g, name:mckeldin-theodore-r]
