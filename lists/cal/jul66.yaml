# Cal. LXXX July 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXX
entries:
  - id: cal.1966-07-01.medicare
    when: July 1
    date: '1966-07-01'
    thread: medicare
    also: [health, civil-rights-the-executive]
    c: 'Medicare in effect: hospital insurance for those 65 and over, and the voluntary plan for doctors'' bills. A hospital paid only if certified by HEW as complying with Title VI of the Civil Rights Act. Johnson''s telegram of thanks to the American Hospital Association, read by Moyers at San Antonio.'
    n: '[Telegram to the Director, American Hospital Association, on Preparations for Medicare](https://www.presidency.ucsb.edu/documents/telegram-the-director-american-hospital-association-preparations-for-medicare) (July 1, 1966). [[w.smith-health-care-divided]]. See [[cal.1965-07-30.medicare]]. Names: Moyers (K–J Adm. III.C).'
    tags: [name:johnson-lyndon-b, name:moyers-bill]
  - id: cal.1966-07-01.europe-and-the-alliance
    when: July 1
    date: '1966-07-01'
    thread: europe-and-the-alliance
    c: 'French forces leave NATO''s integrated commands. The French forces in Germany stay, their terms unsettled: July 19, de Leusse for France in the Council refuses the Fourteen''s paper of assumptions on them; by July 29 the mission to NATO reports the talks deadlocked.'
    n: 'FRUS 1964–68, XIII, docs. [184](https://history.state.gov/historicaldocuments/frus1964-68v13/d184), [187](https://history.state.gov/historicaldocuments/frus1964-68v13/d187), [190](https://history.state.gov/historicaldocuments/frus1964-68v13/d190). See [[cal.1966-03-07.europe-and-the-alliance]].'
  - id: cal.1966-07-01.civil-rights-organizations
    when: July 1–6
    date: '1966-07-01'
    thread: civil-rights-organizations
    also: [black-nationalism]
    c: 'CORE''s convention, Baltimore, July 1–4: "black power" taken up; self-defense held no contradiction of nonviolence. The NAACP''s, Los Angeles, from July 5: Wilkins against the slogan. July 6, Humphrey to the NAACP: racism to be rejected whether it comes "from a throat that is white or one that is black" (Check the words). Johnson, July 5, at the Ranch: "We are not interested in black power and we are not interested in white power. But we are interested in American democratic power, with a small ''d.''"'
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-8) (July 5, 1966). [[w.meier-core]]; [[w.wilkins-standing-fast]]; [[w.joseph-waiting-til-the-midnight]]. See [[cal.1966-06-06.mississippi]]. Names: Wilkins (K–J Cong. III.H); Humphrey (K–J Adm. III.D).'
    tags: [name:wilkins-roy, name:humphrey-hubert-h, name:johnson-lyndon-b]
  - id: cal.1966-07-02.defense
    when: July 2
    date: '1966-07-02'
    thread: defense
    also: [vietnam]
    c: 'Executive order: a National Advisory Commission on Selective Service, twenty members, Burke Marshall chairman; McCone, Shoup, and Reedy among them. Classification, deferments, exemptions, the local boards, and "other systems of national service" to be studied; the report by about Jan. 1, 1967.'
    n: '[Executive Order 11289—National Advisory Commission on Selective Service](https://www.presidency.ucsb.edu/documents/executive-order-11289-national-advisory-commission-selective-service) (July 2, 1966); [Statement by the President Upon Establishing a Commission To Study the Draft and Other Systems of National Service](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-establishing-commission-study-the-draft-and-other-systems) (July 2, 1966). [[w.flynn-draft-1940-1973]]; [[w.baskir-chance-and-circumstance]]. Names: Marshall, McCone (K–J Adm. III.I); Reedy (K–J Adm. III.C).'
    tags: [name:johnson-lyndon-b, name:marshall-burke, name:mccone-john-a, name:shoup-david-m, name:reedy-george-e]
  - id: cal.1966-07-04.press-and-broadcasting
    when: July 4
    date: '1966-07-04'
    thread: press-and-broadcasting
    c: 'Freedom of Information Act signed, [80 Stat. 250](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg250.pdf), the statement released at San Antonio. The agencies'' records open to any person on request, nine classes exempt; a refusal reviewable in the district courts; in force July 4, 1967. Moss''s bill in the House, Long''s in the Senate; the House passed S. 1160 June 20, [306–0](https://voteview.com/rollcall/RH0890277). Johnson: the bill "in no way impairs the President''s power under our Constitution to provide for confidentiality when the national interest so requires."'
    n: '[Statement by the President Upon Signing the "Freedom of Information Act."](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-freedom-information-act) (July 4, 1966). Statute (K–J Cong. II.J.2). [[w.schudson-rise-of-the-right]]. Names: Moss (K–J Cong. III.D).'
    tags: [name:johnson-lyndon-b, name:moss-john-e, name:long-edward-v]
  - id: cal.1966-07-06.vietnam
    when: July 6–20
    date: '1966-07-06'
    thread: vietnam
    c: 'Hanoi parades captured American airmen through its streets, July 6, some fifty (Check); trials as war criminals spoken of. July 15, Senators critical of the war, eighteen or nineteen (Check), appeal to Hanoi against reprisals on the prisoners. July 20, Johnson''s news conference: the men "are not war criminals and should not be treated as such"; the United States ready for a conference under the International Committee of the Red Cross on applying the Geneva Conventions of 1949 in Vietnam. Aug. 9, the committee''s president speaks of Hanoi''s "moderation" in postponing the trials.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1169) (July 20, 1966). FRUS 1964–68, IV, docs. [182](https://history.state.gov/historicaldocuments/frus1964-68v04/d182), [199](https://history.state.gov/historicaldocuments/frus1964-68v04/d199), [207](https://history.state.gov/historicaldocuments/frus1964-68v04/d207). [[w.rochester-honor-bound]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-07-08.jobs-and-wages
    when: July 8–31
    date: '1966-07-08'
    thread: jobs-and-wages
    also: [economy]
    c: 'The International Association of Machinists strikes Eastern, National, Northwest, Trans World, and United, July 8, on the terms of the emergency board (Morse, Ginsburg, Neustadt) reported June 7, which the carriers had accepted. July 29, 9:52 p.m., Johnson on television with Siemiller, the union''s president, and the airlines'' negotiator: an agreement "essentially within the general framework" of the board, some 72 cents an hour over three years; "this settlement ... will not be inflationary." July 31, the members reject it.'
    n: '[Statement by the President on the Breakdown of Negotiations in the Airlines Strike](https://www.presidency.ucsb.edu/documents/statement-the-president-the-breakdown-negotiations-the-airlines-strike) (July 7, 1966); [Remarks on Announcing an Agreement in the Airline Strike](https://www.presidency.ucsb.edu/documents/remarks-announcing-agreement-the-airline-strike) (July 29, 1966). [[w.sheahan-wage-price-guideposts]]; [[w.exhortation-and-controls]]. Names: Morse (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:morse-wayne, name:neustadt-richard-e]
  - id: cal.1966-07-10.open-housing
    when: July 10–11
    date: '1966-07-10'
    thread: open-housing
    also: [king, states-and-cities]
    c: 'Chicago. "Freedom Sunday": King at Soldier Field, some 35,000 by UPI''s count (Check), then a march to City Hall, where he tapes the Chicago Freedom Movement''s demands to the door: listings and mortgages without regard to race; a citizens'' board for complaints against the police; low-cost housing scattered over the city; and more. July 11, King and Raby with Daley at City Hall; no agreement.'
    n: '[[w.ralph-northern-protest]]; [[w.anderson-confronting-the-color-line]]; [[w.chicago-1966]]; [[w.chicago-freedom-movement]]; [[w.garrow-bearing-the-cross]]; [[w.fairclough-to-redeem-the-soul]]; [[w.branch-at-canaans-edge]]; [[w.cohen-american-pharaoh]]. Names: King (K–J Cong. III.H); Daley (K–J Cong. III.F).'
    tags: [name:king-martin-luther-jr, name:daley-richard-j]
  - id: cal.1966-07-12.open-housing
    when: July 12–15
    date: '1966-07-12'
    thread: open-housing
    also: [states-and-cities]
    c: 'Rioting on Chicago''s West Side, July 12–15, begun when police shut off a fire hydrant opened against the heat (Check the occasion). Two dead by stray bullets, a girl of fourteen among them; more than 30 hurt; hundreds arrested. Kerner sends the National Guard at Daley''s request; on the streets July 15. July 20, Johnson, asked of "black power" and the disturbances in Chicago and Cleveland: "I am very concerned about the conditions that exist in many of the large cities"; equality to be had "under the law."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1169) (July 20, 1966). See [[cal.1966-07-10.open-housing]]. Names: Kerner, Daley (K–J Cong. III.F).'
    tags: [name:kerner-otto, name:daley-richard-j, name:johnson-lyndon-b]
  - id: cal.1966-07-12.india-and-china
    when: July 12
    date: '1966-07-12'
    thread: india-and-china
    c: 'Johnson to the American Alumni Council, from the White House theater, his flight to White Sulphur Springs, W. Va., grounded by weather. Four "essentials" for peace in Asia, the fourth "reconciliation between nations that now call themselves enemies." "A peaceful mainland China is central to a peaceful Asia"; no lasting peace "as long as the 700 million people of mainland China are isolated by their rulers from the outside world." A passport cleared that day for an American businessman to go to China.'
    n: '[Remarks to the American Alumni Council: United States Asian Policy](https://www.presidency.ucsb.edu/documents/remarks-the-american-alumni-council-united-states-asian-policy) (July 12, 1966). [[w.goh-constructing-the-u-s]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-07-12.elections-1966
    when: July 12
    date: '1966-07-12'
    thread: elections-1966
    c: 'Virginia''s Democratic primaries. Spong, a State senator, defeats Robertson, a Senator since 1946, 216,885 to 216,274. Harry F. Byrd Jr., appointed to his father''s seat, holds it for the two years left against Boothe, 221,221 to 212,996. Howard W. Smith, chairman of Rules, loses the Eighth District to Rawlings. July 20, Johnson: "I don''t attach any particular significance to the defeat of a Member of the House or the Senate."'
    n: 'Votes: CQ Guide 6th (2010) 1546–47. [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1169) (July 20, 1966). [[w.wilkinson-harry-byrd-and-the]]; [[w.heinemann-harry-byrd-of-virginia]]; [[w.dierenfield-keeper-of-the-rules]]. Names: Smith (K–J Cong. III.D).'
    tags: [name:spong-william-b-jr, name:robertson-absalom-w, name:byrd-harry-f-jr, name:smith-howard-w, name:johnson-lyndon-b]
  - id: cal.1966-07-14.defense
    when: July 14
    date: '1966-07-14'
    thread: defense
    c: 'Senate. S. Res. 283, reported by Foreign Relations: a Committee on Intelligence Operations to watch the CIA, its members drawn from Foreign Relations, Armed Services, and Appropriations (Check). Russell''s point of order, that it go first to Armed Services, sustained, [61–28](https://voteview.com/rollcall/RS0890353).'
    n: '[[w.smist-congress-oversees-the-united]]; [[w.woods-fulbright]]; [[w.fite-richard-b-russell-jr]]. Names: Russell (K–J Cong. III.B).'
    tags: [name:russell-richard-b]
  - id: cal.1966-07-18.states-and-cities
    when: July 18–23
    date: '1966-07-18'
    thread: states-and-cities
    c: 'Cleveland. Rioting in Hough, July 18–23, begun at a bar at East 79th Street and Hough Avenue. Four dead, some 50 hurt, 275 arrested. Rhodes sends the National Guard at Locher''s request, some 1,700 men in the city by July 20.'
    n: '[[w.stradling-where-the-river-burned]]; [[w.moore-carl-b-stokes-and]]. See [[cal.1965-08-11.states-and-cities]]. Names: Rhodes (Opp. III.H).'
    tags: [name:rhodes-james-a]
  - id: cal.1966-07-18.space
    when: July 18–21
    date: '1966-07-18'
    thread: space
    c: 'Gemini 10: Young and Collins. Docked with their Agena target, they fire its engine and climb to some 475 miles, higher than any men before; then meet the Agena left by Gemini 8, and Collins goes out to it. Down in the Atlantic July 21.'
    n: '[[w.hacker-on-the-shoulders-of]]; [[w.collins-carrying-the-fire]]. See [[cal.1965-12-15.space]]. Names: Young (K–J Cong. III.K).'
    tags: [name:young-john-w, name:collins-michael]
  - id: cal.1966-07-19.economy
    when: July 19
    date: '1966-07-19'
    thread: economy
    c: 'News conference, after meetings with the bipartisan leaders, July 18, and the appropriations chairmen, July 19. Congress''s add-ons to the budget may reach $5 to $6 billion, near $120 billion without a Vietnam supplemental. Three courses for an economy "heating up": wage and price controls, which "few, if any, recommend"; cuts in nondefense spending; or a deficit or a tax bill. The deficit for fiscal 1966, $2.3 billion.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1168) (July 19, 1966). [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]; [[w.collins-more]]; [[w.okun-political-economy-of-prosperity]]; [[w.president-and-the-council]]. See [[cal.1965-12-05.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-07-22.vietnam
    when: July 22–30
    date: '1966-07-22'
    thread: vietnam
    c: 'The demilitarized zone. North Vietnam''s 324th Division found south of the 17th parallel, come through the zone; July 21, Saigon protests to the ICC. July 22, air strikes in the zone on both sides of the line, and artillery into its southern half, authorized "only against clearly defined military activity"; July 30, ground operations south of the line when in contact. The Marines'' Operation Hastings below the zone (Check its dates).'
    n: '[FRUS 1964–68, IV, doc. 184](https://history.state.gov/historicaldocuments/frus1964-68v04/d184). [[w.shulimson-u-s-marines-in-1982]].'
  - id: cal.1966-07-26.elections-1966
    when: July 26–Aug. 9
    date: '1966-07-26'
    thread: elections-1966
    c: 'Arkansas, governor; Faubus not running. Democratic primary, July 26: Jim Johnson first, Holt second. Runoff, Aug. 9: Johnson 210,543, Holt 195,442. Rockefeller the Republican nominee, over 96 percent in his primary.'
    n: 'Votes: Wikipedia, from Our Campaigns (Check: Ark. Secretary of State). [[w.urwin-agenda-for-reform]]. Names: Faubus (K–J Cong. III.F); Rockefeller (Opp. III.H).'
    tags: [name:faubus-orval-e, name:rockefeller-winthrop]
  - id: cal.1966-07-29.europe-and-the-alliance
    when: July 29
    date: '1966-07-29'
    thread: europe-and-the-alliance
    also: [economy]
    c: 'Sterling. Heavy losses in July, $200 million on July 15 alone. July 20, Wilson to the Commons: a six-month freeze on wages and prices, some £500 million in cuts, overseas spending among them; no devaluation. July 29, Wilson at the White House. Johnson''s toast: "a man of mettle." Their talks on the pound and on liquidity; American help, if any, to be multilateral.'
    n: '[Toasts of the President and Prime Minister Wilson of Great Britain](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-prime-minister-wilson-great-britain-0) (July 29, 1966). FRUS 1964–68, XII, docs. [262](https://history.state.gov/historicaldocuments/frus1964-68v12/d262), [264](https://history.state.gov/historicaldocuments/frus1964-68v12/d264), [265](https://history.state.gov/historicaldocuments/frus1964-68v12/d265); VIII, doc. [102](https://history.state.gov/historicaldocuments/frus1964-68v08/d102). [[w.wilson-labour-government-1964-1970]]; [[w.kunz-butter-and-guns]]; [[w.schwartz-lyndon-johnson-and-europe]]. Names: Wilson (K–J Adm. III.J).'
    tags: [name:wilson-harold, name:johnson-lyndon-b]
