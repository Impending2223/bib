  - id: cal.1965-09-29.program
    when: Sept. 29
    date: '1965-09-29'
    thread: program
    c: 'National Foundation on the Arts and the Humanities Act signed in the Rose Garden, [79 Stat. 845](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg845.pdf): a National Endowment for the Arts and one for the Humanities, $10 million a year for three years between them, and money to match gifts. The House passed it Sept. 15, a motion to recommit lost, [128–251](https://voteview.com/rollcall/RH0890154); the Senate took the House''s text Sept. 16.'
    n: 'Remarks at the Signing of the Arts and Humanities Bill, [1965 Pub. Papers 1022](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=496) (Sept. 29, 1965). [111 Cong. Rec., House, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-2.pdf); [111 Cong. Rec., Senate, Sept. 16, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-3-2.pdf). To check: [[w.binkiewicz-federalizing-the-muse]]. See [[cal.1965-01-04.program]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-29.opinion
    when: Sept. 29
    date: '1965-09-29'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Aug. 27–Sept. 1: the $1.25 minimum wage: increase 55 percent, leave as is 39. Of those for an increase, about $1.50, 53; $1.75, 21; $2.00, 11. Manual workers 69 for an increase, farmers 32.'
    n: '[[w.gallup-poll]], III, 1963.'
  - id: cal.1965-09-29.vietnam
    when: Sept. 29
    date: '1965-09-29'
    thread: vietnam-force-levels
    c: 'Lunch: Johnson with Ball, McNamara, McGeorge Bundy, Raborn, Moyers and Califano. McNamara asks interim authority for 195,000, the last 15,000 about Nov. 15; the 35,000 more support troops, not combat. Johnson: "no choice but to approve the increase." Approved, to 195,000. Announced from Saigon as the troops arrive. Also tear gas and rice for South Vietnam; the Rolling Thunder program approved.'
    n: 'FRUS 1964–68, III, doc. [155](https://history.state.gov/historicaldocuments/frus1964-68v03/d155) (Califano''s memorandum for the record). [[w.drea-mcnamara-clifford-and-the-2011]], 47, 115 (the 195,000, the quotation). Made public: FRUS 1964–68, III (1996). See [[cal.1965-08-23.vietnam]]. Names: Ball, McNamara, McGeorge Bundy, Raborn, Moyers, Califano, Johnson.'
    src:
      c: 551ba0f1
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d155: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 47: B, D-F'
        - 'w.drea-mcnamara-clifford-and-the-2011 115: E'
        - 'via w.drea-mcnamara-clifford-and-the-2011 47 n.90c: B, D-F'
        - 'via w.drea-mcnamara-clifford-and-the-2011 115 n.7f: E'
