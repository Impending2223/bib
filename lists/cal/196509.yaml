        - 'w.mcnamara-in-retrospect ch. 8 at nn.9–10: A'
    tags: [name:mcnamara-robert-s, name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1965-09-01.vietnam-2
    when: Sept. 1
    date: '1965-09-01'
    thread: vietnam
    c: 'Paris. Gullion''s fourth and last meeting with Mai Văn Bộ: a stiff line, after Phạm Văn Đồng''s declaration in *Le Monde*; American troops to leave before elections; the bombing to be stopped "immediately, totally, and definitively," no conditions to be its price.'
    n: '[FRUS 1964–68, III, doc. 133](https://history.state.gov/historicaldocuments/frus1964-68v03/d133) (Gullion''s telegram). [[w.herring-lbj-and-vietnam]], 99 (Bộ''s retreat from his earlier positions, the bombing to end "unconditionally, immediately, totally, and definitively"; Gullion home). Check: Herring dates the meeting Sept. 3; FRUS''s editors give four meetings, Aug. 6–Sept. 1 (doc. 112). See [[cal.1965-08-06.vietnam]]. Names: Gullion, Mai Văn Bộ, Phạm Văn Đồng.'
    src:
      c: 2b210d5a
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d133: all'
        - 'w.herring-lbj-and-vietnam 99: A, C'
    tags: [name:gullion-edmund-a, name:mai-van-bo, name:pham-van-dong]
  - id: cal.1965-09-01.vietnam-3
    when: Sept. 1
    date: '1965-09-01'
    thread: vietnam
    c: 'MACV''s "Concept of Operations in the Republic of Vietnam": the aim to end the war by convincing the Viet Cong and Hanoi "that military victory is impossible," forcing an agreement. Three phases: the enemy''s offensive stopped by Dec. 31, 1965; the offensive resumed and pacification begun, to June 30, 1966; the remaining units and bases destroyed, to July 1 or Dec. 31, 1967. The war to keep "primarily a Vietnamese character."'
    n: '[[w.gibbons-u-s-government-and]], IV, 44–45; [[w.mcnamara-in-retrospect]], ch. 8 at n.5. [[w.macv-command-history-1965]], 28, 43 (the concept, three phases). To check: Ltr, MACV, MACV Concept of Operations in RVN, Aug. 30, 1965 (cited by [[w.macv-command-history-1965]], 43 n.91); MACV, "Concept of Operations in the Republic of Vietnam," Sept. 1, 1965, National Archives, Westmoreland-CBS Papers (cited by [[w.gibbons-u-s-government-and]], IV, 44 n.5). See [[cal.1965-08-27.vietnam]]. Names: Westmoreland. Check: the History dates the concept Sept. 1 (28) and "late August" (43), its notes Aug. 30 and Sept. 3.'
    src:
      c: c27cfed3
      rows:
        - 'w.gibbons-u-s-government-and IV, 44–45: all'
        - 'via w.gibbons-u-s-government-and IV, 44 n.5a: all'
        - 'w.macv-command-history-1965 28, 43: A-D'
        - 'via w.macv-command-history-1965 43 n.91: A-D'
        - 'w.mcnamara-in-retrospect ch. 8 at n.5: A'
        - 'via x.1965-09-01.macv-concept-of-operations-in-the: A'
    tags: [name:westmoreland-william]
  - id: cal.1965-09-01.steel
    when: Sept. 1
    date: '1965-09-01'
    thread: steel
    c: 'Clifford to Califano: the companies would raise their offer for selective price increases where Japan does not compete. Wirtz: the union thinks they would if the administration would "wink"; Dillon, close to Blough, the same. Johnson: "No price increase. None. Zero." Clifford and Connor to "turn him upside down and shake him."'
    n: '[[w.califano-triumph-and-tragedy-of]], 92. Check: the day, "On Wednesday." Names: Clifford, Califano, Wirtz, Dillon, Blough, Johnson, Connor.'
    src:
      c: c290d064
      rows:
        - 'w.califano-triumph-and-tragedy-of 92: all'
        - 'via w.califano-triumph-and-tragedy-of 92 n.21: all'
    tags: [name:clifford-clark, name:califano-joseph-a-jr, name:wirtz-w-willard, name:dillon-c-douglas, name:blough-roger-m, name:johnson-lyndon-b, name:connor-john-t]
  - id: cal.1965-09-02.students
    when: Sept. 2
    date: '1965-09-02'
    thread: students
    also: [war-opposition]
    c: 'The National Student Association''s congress, the student governments of some 300 colleges: a resolution, adopted "overwhelmingly," to stop the bombing of the North and other offensive action and to negotiate, the Viet Cong represented. The American Friends of Vietnam, monitored from the NSC staff, had worked to blunt it.'
    n: '[[w.gibbons-u-s-government-and]], IV, 29. To check: *New York Times*, Sept. 3, 1965 (cited by [[w.gibbons-u-s-government-and]], IV, 29 n.88); Cooper, Thomson and Ropa to McGeorge Bundy, Sept. 7, 1965, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 29 n.88). Check: the congress''s place and the vote.'
    src:
      c: e8a9708c
      rows:
        - 'w.gibbons-u-s-government-and IV, 29: all'
        - 'via w.gibbons-u-s-government-and IV, 29 n.88a: A'
        - 'via w.gibbons-u-s-government-and IV, 29 n.88b: B'
  - id: cal.1965-09-02.vietnam
    when: Sept. 2
    date: '1965-09-02'
    thread: vietnam
    also: [europe-and-the-alliance, press-and-broadcasting]
    c: 'Stewart, visiting Washington, to London: Geyelin of the *Wall Street Journal* reports Bundy''s word that the American military position in South Vietnam "was still too weak to allow negotiations in any real sense of the term."'
    n: '[[w.preston-war-council]], 217. To check: Stewart (Washington) to London, Sept. 2, 1965, FO 371/180544, Public Record Office (cited by [[w.preston-war-council]], 217 n.22). Names: Bundy. Check: the day of Bundy''s talk with Geyelin.'
    src:
      c: 25109a7a
      rows:
        - 'w.preston-war-council 217: all'
        - 'via w.preston-war-council 217 n.22c: all'
    tags: [name:bundy-mcgeorge]
  - id: cal.1965-09-02.vietnam-2
    when: Sept. 2
    date: '1965-09-02'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Bundy to Johnson, before his NBC interview: "we certainly mean to stay there as long as we are needed to prevent a take-over by force or terror under any cloak"; the Communists "certainly do not seem to be ready for negotiation"; "we are ready for negotiations the moment that others are." With it, Lodge''s letter of Aug. 31: stress "warding off the aggression," not "diplomatic settlements which we probably are not going to be able to get."'
    n: '[[w.preston-war-council]], 217–18. To check: Bundy to Johnson, Sept. 2, 1965 (two), NSF, Memos to the President, Bundy, box 4, and Country File, Vietnam, box 22; Lodge to Johnson, Aug. 31, 1965, NSF, Country File, Vietnam, box 22, LBJ Library (cited by [[w.preston-war-council]], 218 n.23). Names: Bundy, Johnson, Lodge.'
    src:
      c: 37c5527b
      rows:
        - 'w.preston-war-council 217–18: all'
        - 'via w.preston-war-council 218 n.23b: all'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:lodge-henry-cabot]
  - id: cal.1965-09-02.steel
    when: Sept. 2
    date: '1965-09-02'
    thread: steel
    c: 'Johnson to the negotiators again: an agreement so he can go to the Ranch and Lady Bird for Labor Day; a sound settlement and they are all invited to the inauguration of January 1969. About midnight he sets Connor and Wirtz, who cannot agree on the costs of the benefits, to negotiate with each other, Califano mediating: "If you two can''t agree, how the hell can we expect Abel and Cooper to agree?"'
    n: '[[w.califano-triumph-and-tragedy-of]], 92–93. To check: Califano to Johnson, Sept. 2, 1965, 10:35 a.m., with "Points for Visit to Steel Negotiators," Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 92 n.22). Names: Johnson, Connor, Wirtz, Califano, Abel, Cooper.'
    src:
      c: 4e24af0a
      rows:
        - 'w.califano-triumph-and-tragedy-of 92–93: all'
        - 'via w.califano-triumph-and-tragedy-of 92 n.22: A'
        - 'via w.califano-triumph-and-tragedy-of 93 n.23: B'
    tags: [name:johnson-lyndon-b, name:connor-john-t, name:wirtz-w-willard, name:califano-joseph-a-jr, name:abel-i-w, name:cooper-r-conrad]
