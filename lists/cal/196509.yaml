    when: Sept. 7
    date: '1965-09-07'
    thread: republican-party
    also: [conservative-movement]
    c: 'The Los Angeles County Young Republicans resolve that Kuchel is "a Republican in name only": he should change parties, and they will oppose him at every election, whatever his label.'
    n: '[[w.kabaservice-rule-and-ruin]], 164. To check: Los Angeles County Young Republicans, resolution, Sept. 7, 1965, Ronald Reagan Gubernatorial Papers, Reagan Library, C32 (cited by [[w.kabaservice-rule-and-ruin]], 164 n.16). Names: Kuchel.'
    src:
