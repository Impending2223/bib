        - 'via w.garrow-bearing-the-cross 446 n.16a: all'
        - 'via w.garrow-bearing-the-cross 446 n.16b: all'
        - 'via w.garrow-bearing-the-cross 446 n.16c: A-D'
    tags: [name:king-martin-luther-jr, name:levison-stanley-d, name:young-andrew-j-jr, name:johnson-lyndon-b, name:dodd-thomas-j]
  - id: cal.1965-09-12.republican-party
    when: Sept. 12
    date: '1965-09-12'
    thread: republican-party
    also: [vietnam]
    c: '*Meet the Press*, NBC. Nixon, back from four days in Saigon: Johnson''s talk of negotiation "has the effect of prolonging the war"; the objective "a free and independent South Vietnam with no reward and no appeasement of aggressors"; more air and sea power against the North.'
    n: '[[w.nixon-rn]], 271. See [[cal.1965-01-26.vietnam]]. Names: Nixon, Johnson. Check: the day; Nixon puts the program after his return from Saigon in September, and the Library of Congress''s inventory of the program has him on Sept. 12 and Nov. 21.'
    src:
      c: 631da6ac
      rows:
        - 'w.nixon-rn 271: all'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b]
  - id: cal.1965-09-13.vietnam
    when: Sept. 13
    date: '1965-09-13'
    thread: vietnam
    also: [defense]
    c: 'Johnson''s luncheon, 1:16 to 2:20 p.m., with Rusk, McNamara, McGeorge Bundy, Raborn, Ball, Moyers and Califano. McNamara: the Chiefs'' program of Sept. 2, the SAM sites, the airfields with IL-28s, targets near Hanoi, Haiphong and China, a "significant escalation," premature; Rusk agrees. Two bridges toward China, one day each; Johnson approves.'
    n: '[FRUS 1964–68, III, doc. 140](https://history.state.gov/historicaldocuments/frus1964-68v03/d140) (Califano''s notes). [[w.gibbons-u-s-government-and]], IV, 73. Made public: FRUS 1964–68, III (1996). Names: Johnson, Rusk, McNamara, McGeorge Bundy, Raborn, Ball, Moyers, Califano.'
