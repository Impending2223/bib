    when: Sept. 2
    date: '1965-09-02'
    thread: robert-kennedy
    also: [press-and-broadcasting]
    c: 'Hoover to Tolson, Belmont and others: "Bob Kennedy has been able to plant stories with the New York Times and the Saturday Evening Post where he has contacts."'
    n: '[[w.shesol-mutual-contempt]], 314. To check: Hoover to Tolson, Belmont et al., Sept. 2, 1965, FBI File 77-51387-1792 (cited by [[w.shesol-mutual-contempt]], 314). Names: Hoover, Tolson, Robert Kennedy.'
