  - id: cal.1965-09-03.states-and-cities
    when: Sept. 3
    date: '1965-09-03'
    thread: states-and-cities
    also: [congress]
    c: 'Home rule for the District. A discharge petition to bring the District charter bill, H.R. 4644, out of McMillan''s District Committee reaches 218 names, a majority of the House. Johnson on television: "we near victory in the final battle of the American Revolution." The Senate had passed its bill, S. 1118, July 22, [63–29](https://voteview.com/rollcall/RS0890172).'
    n: 'Televised Statement by the President Concerning the Signing of the D.C. Home Rule Petition by a Majority of House Members, [1965 Pub. Papers 966](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=440) (Sept. 3, 1965); Letter to the Chairman, House Committee on the District of Columbia, [1965 Pub. Papers 971](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=445) (Sept. 4, 1965). [[w.califano-triumph-and-tragedy-of]], 229 (favors for signers; "a birthday present"; Shipley''s secretary to the Usher''s Office at 7:45 a.m.: the last signature). To check: [[w.jaffe-dream-city]]; [[w.asch-chocolate-city]]. Names: McMillan, Johnson.'
    tags: [name:johnson-lyndon-b, name:mcmillan-john-l, state:dc, city:washington]
  - id: cal.1965-09-03.china
    when: Sept. 3
    date: '1965-09-03'
    thread: china
    also: [vietnam]
    c: '*Peking Review* prints Lin Biao''s "Long Live the Victory of People''s War": the world''s cities, the industrial nations, to be surrounded by its countryside, the developing countries, through local revolutions. By the Chinese accounts, written by Luo Ruiqing''s group in the General Staff, Kang Sheng''s team adding to it, and approved by the leadership; Lin had no hand in it.'
    n: '[[w.zhai-china-and-the-vietnam]], 145–46 (the article and its writers; Washington''s reading); [[w.mcnamara-in-retrospect]], ch. 8 (Lin Biao''s words of Sept. 2; read in Washington, McNamara among them, as "bellicose and aggressive," the basis of the domino theory). Washington''s knowledge: [FRUS 1964–68, XXXIII, doc. 367](https://history.state.gov/historicaldocuments/frus1964-68v33/d367) (Chase to McGeorge Bundy, Sept. 13: at State''s strategy session for the General Assembly, Goldberg would "hit it hard"). Check: McNamara dates Lin Biao''s words Sept. 2, 1965 (ch. 8). To check: the article, *Peking Review*, Sept. 3, 1965, 9–30 (cited by [[w.zhai-china-and-the-vietnam]], 145 n.74). Names: Lin Biao. Check: the day the article first appeared; Zhai''s bibliography (285) gives the *Peking Review* of Sept. 3.'
    src:
      c: 50fbd436
      rows:
        - 'w.zhai-china-and-the-vietnam 145–46: all'
        - 'via w.zhai-china-and-the-vietnam 145 n.74: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v33/d367: A'
        - 'w.mcnamara-in-retrospect ch. 8: A'
    tags: [name:lin-biao]
  - id: cal.1965-09-04.alabama
    when: Sept. 4
    date: '1965-09-04'
    thread: alabama
    also: [voting-rights]
    c: 'Jack Minnis, SNCC''s research director, to the Alabama staff, at Carmichael''s asking: under the Alabama Code a new party may be organized county by county; one whose nominee for county office polls 20 percent at the general election "would become a political party, in Lowndes County." Every participant to have proof of registration.'
    n: '[[w.branch-at-canaans-edge]], 315–17. To check: Minnis to SNCC staff in Alabama, Sept. 4, 1965, SNCC Papers, King Library and Archives (cited by [[w.branch-at-canaans-edge]], 316); [[w.carson-in-struggle]], 165 (cited by [[w.branch-at-canaans-edge]], 315). See [[cal.1965-03-28.voting-rights-selma]]. Names: Carmichael.'
    src:
      c: d58011c4
      rows:
        - 'w.branch-at-canaans-edge 315–17: all'
        - 'via w.branch-at-canaans-edge 316 n.heres-what-ive: all'
    tags: [name:carmichael-stokely, ok:result-form]
  - id: cal.1965-09-06.foreign-aid
    when: Sept. 6
    date: '1965-09-06'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1965 signed, [79 Stat. 653](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg653.pdf): economic and military aid for fiscal 1966, one year''s authority. The conferees and their chairmen, Fulbright and Morgan, ask a review of the program; Johnson promises studies this fall.'
    n: 'Statement by the President Upon Signing the Foreign Assistance Act, [1965 Pub. Papers 978](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=452) (Sept. 6, 1965). To check: [[w.ruttan-united-states-development-assistance]]. See [[cal.1964-10-07.foreign-aid]]. Names: Fulbright, Morgan, Johnson.'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:morgan-thomas-e]
