    date: '1965-09-30'
    thread: governors
    also: [alabama, state-constitutions, state-legislatures]
    c: 'Wallace''s special session on succession: an amendment to let the governor serve a second term in a row. House Bill 1 passes the House, 74 to 23 (Check the date).'
    n: '[*Journal of the House*, Third Special Session, 1965, 51](https://archive.org/details/alabama-house-journal-1965-special-b/page/n562). Steve Flowers, ["The 1965 special succession session"](https://www.alreporter.com/2020/05/13/opinion-the-1965-special-succession-session/), *Alabama Political Reporter*, May 13, 2020. The bar: Ala. Const. § 116 (1901), "no one of said officers shall be eligible as his own successor": [[w.thorpe-federal-and-state-constitutions]], [I, 197](https://archive.org/details/federalstatecons01thor/page/197/mode/1up) (the bar). To check: [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.frady-wallace]]. Names: Wallace.'
    tags: [state:al, name:wallace-george-c]
  - id: cal.1965-09-30.transportation
    when: Sept. 30
    date: '1965-09-30'
    thread: transportation
    c: 'High-Speed Ground Transportation Act signed, [79 Stat. 893](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg893.pdf): research and development by the Secretary of Commerce, $20 million for fiscal 1966 and $35 million in each of the next two. Johnson thanks Pell, "who harassed me week after week." The House passed it Sept. 2, [318–23](https://voteview.com/rollcall/RH0890131).'
    n: 'Statute (K–J Cong. II.J.2). Remarks at the Signing of the High-Speed Ground Transportation Act, [1965 Pub. Papers 1024](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=498) (Sept. 30, 1965). See [[cal.1965-03-04.transportation]]. Names: Johnson, Pell.'
    tags: [name:johnson-lyndon-b, name:pell-claiborne-d]
