  - id: cal.1965-09-02.students
    when: Sept. 2
    date: '1965-09-02'
    thread: students
    also: [war-opposition]
    c: 'The National Student Association''s congress, the student governments of some 300 colleges: a resolution, adopted "overwhelmingly," to stop the bombing of the North and other offensive action and to negotiate, the Viet Cong represented. The American Friends of Vietnam, monitored from the NSC staff, had worked to blunt it.'
    n: '[[w.gibbons-u-s-government-and]], IV, 29. To check: [*New York Times*, Sept. 3, 1965](https://timesmachine.nytimes.com/timesmachine/1965/09/03/issue.html) (cited by [[w.gibbons-u-s-government-and]], IV, 29 n.88); Cooper, Thomson and Ropa to McGeorge Bundy, Sept. 7, 1965, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 29 n.88). Check: the congress''s place and the vote.'
