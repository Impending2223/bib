        - 'via w.gibbons-u-s-government-and IV, 72 n.79: all'
        - 'w.macv-command-history-1965 252: all'
    tags: [name:westmoreland-william]
  - id: cal.1965-09-07.vietnam-operations
    when: Sept. 7–11
    date: '1965-09-07'
    thread: vietnam-operations
    c: 'Piranha, a four-day operation on the Batangan peninsula, 20 miles south of Chu Lai, on Starlite''s plan: one Marine battalion by helicopter, one from the sea. 198 of the enemy killed, 265 suspects held; one Marine killed, eight wounded.'
    n: '[[w.macv-command-history-1965]], 163, 481.'
    src:
      c: 037fc79e
      rows:
