  - id: cal.1965-09-07.vietnam
    when: Sept. 7
    date: '1965-09-07'
    thread: vietnam
    c: 'MACV Directive 525-3, on keeping down noncombatant casualties: "unnecessary force" in the areas the Viet Cong hold "will embitter the population, drive them into the arms of the VC." Strikes before ground attacks in populated areas, reconnaissance by fire into hamlets and ill-chosen harassing fire "counterproductive in the long run."'
    n: '[[w.gibbons-u-s-government-and]], IV, 71–72; [[w.macv-command-history-1965]], 252. To check: MACV Directive 525-3, Sept. 7, 1965, CMH, Westmoreland Papers, History File (cited by [[w.gibbons-u-s-government-and]], IV, 72 n.79). See [[cal.1965-08-18.vietnam-3]]. Names: Westmoreland.'
    src:
