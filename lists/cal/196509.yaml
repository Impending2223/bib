    when: Sept. 1
    date: '1965-09-01'
    thread: india-and-china-kashmir
    c: India and Pakistan at war. Pakistani armor across the Kashmir cease-fire line at Chhamb.
    n: 'New Delhi 446, Sept. 1: [FRUS 1964–68, XXV, doc. 177](https://history.state.gov/historicaldocuments/frus1964-68v25/d177). To check: [[w.mcmahon-cold-war-on-the]]; [[w.kux-india-and-the-united]]; [[w.brands-wages-of-globalism]]; [[w.bowles-promises-to-keep]]. See [[cal.1965-08-05.india-and-china]].'
  - id: cal.1965-09-01.legislatures-ca
    when: Sept. 1
    date: '1965-09-01'
    thread: legislatures
    c: '*Silver v. Brown*, [63 Cal. 2d 270](https://static.case.law/cal-2d/63/case-pdfs/0270-01.pdf): the California Supreme Court, without dissent, finds both houses malapportioned (the Assembly''s largest district 306,191, its smallest 72,105), the federal court''s deadline of July 1 having passed with the Senate unreapportioned. The Legislature to act by Dec. 9; else the court''s own plans. No district more than 15 percent from the ideal; a majority of each house from districts of at least 48 percent of the people.'
    n: '*Silver v. Brown*, [63 Cal. 2d 270](https://static.case.law/cal-2d/63/case-pdfs/0270-01.pdf) (1965); *Jordan v. Silver*, [381 U.S. 415](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381415/usrep381415.pdf) (1965) (the federal court''s judgment affirmed, June 1). To check: [[w.dixon-democratic-representation]]; [[w.baker-reapportionment-revolution]]; [[w.ansolabehere-end-of-inequality-2008]]; [[w.boyarsky-big-daddy]]. See [[cal.1964-06-15.court]]; [[cal.1962-11-06.legislatures-ca]].'
    tags: [state:ca]
  - id: cal.1965-09-01.vietnam
    when: Sept. 1
    date: '1965-09-01'
    thread: vietnam-force-levels
    c: 'McNamara to Johnson: Westmoreland''s request, the Joint Chiefs concurring, for six more combat battalions, 34 in all, and 85,000 more men beyond the 125,000 announced July 28. No announcement; the forces announced as they arrive.'
    n: 'FRUS 1964–68, III, doc. [132](https://history.state.gov/historicaldocuments/frus1964-68v03/d132). [[w.drea-mcnamara-clifford-and-the-2011]], 47 (the request). Made public: FRUS 1964–68, III (1996). See [[cal.1965-08-23.vietnam]]. Names: McNamara, Westmoreland, Johnson.'
    src:
      c: f1099965
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d132: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 47: A'
        - 'via w.drea-mcnamara-clifford-and-the-2011 47 n.89d: A'
    tags: [name:mcnamara-robert-s, name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1965-09-01.vietnam-2
    when: Sept. 1
    date: '1965-09-01'
    thread: vietnam
    c: 'Paris. Gullion''s fourth and last meeting with Mai Văn Bộ: a stiff line, after Phạm Văn Đồng''s declaration in *Le Monde*; American troops to leave before elections; the bombing to be stopped "immediately, totally, and definitively," no conditions to be its price.'
    n: '[FRUS 1964–68, III, doc. 133](https://history.state.gov/historicaldocuments/frus1964-68v03/d133) (Gullion''s telegram). [[w.herring-lbj-and-vietnam]], 99 (Bộ''s retreat from his earlier positions, the bombing to end "unconditionally, immediately, totally, and definitively"; Gullion home). Check: Herring dates the meeting Sept. 3; FRUS''s editors give four meetings, Aug. 6–Sept. 1 (doc. 112). See [[cal.1965-08-06.vietnam]]. Names: Gullion, Mai Văn Bộ, Phạm Văn Đồng.'
    src:
      c: 2b210d5a
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d133: all'
        - 'w.herring-lbj-and-vietnam 99: A, C'
    tags: [name:gullion-edmund-a, name:mai-van-bo, name:pham-van-dong]
  - id: cal.1965-09-03.latin-america
    when: Sept. 3–4
    date: '1965-09-03'
    thread: latin-america-dominican-republic
    c: 'Santo Domingo. García-Godoy sworn in as provisional president, Sept. 3. The same morning, his memorandum of understanding with the embassy: the provisional government "will be anti-Communist." Sept. 4, American recognition, after consulting the OAS; some $20 million in aid to be arranged.'
    n: 'Statement by the President on the Agreement To Form a New Government in the Dominican Republic, [1965 Pub. Papers 959](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=433) (Sept. 1, 1965); Statement by the President Announcing U.S. Recognition of the New Dominican Government, [1965 Pub. Papers 970](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=444) (Sept. 4, 1965). [FRUS 1964–68, XXXII, doc. 130](https://history.state.gov/historicaldocuments/frus1964-68v32/d130). See [[cal.1965-04-28.latin-america]]; [[cal.1965-08-31.latin-america]]. Names: García-Godoy.'
    tags: [name:garcia-godoy-hector, name:johnson-lyndon-b]
  - id: cal.1965-09-03.steel
    when: Sept. 3
    date: '1965-09-03'
    thread: steel
    also: [labor-disputes]
    c: 'Steel. Johnson on television from the White House, Abel and Cooper and their negotiators beside him: "essential agreement," after a week''s bargaining in Washington. Agreed Sept. 6: a 35-month contract, wages up 10 to 19 cents an hour the first year and 6 to 12 cents the third, pensions raised. No strike.'
    n: 'Televised Statement by the President Announcing Settlement of the Steel Dispute, [1965 Pub. Papers 968](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=442) (Sept. 3, 1965). Bureau of Labor Statistics, [*Wage Chronology: United States Steel Corporation and United Steelworkers of America (AFL-CIO), March 1937–April 1974*](https://fraser.stlouisfed.org/files/docs/publications/bls/bls_1814_1974.pdf), Bulletin 1814 (1974), 10. See [[cal.1965-08-30.steel]]. Names: Johnson, Abel, R. Conrad Cooper.'
    tags: [name:johnson-lyndon-b, name:abel-i-w, name:cooper-r-conrad]
  - id: cal.1965-09-03.states-and-cities
    when: Sept. 3
    date: '1965-09-03'
    thread: states-and-cities
    also: [congress]
    c: 'Home rule for the District. A discharge petition to bring the District charter bill, H.R. 4644, out of McMillan''s District Committee reaches 218 names, a majority of the House. Johnson on television: "we near victory in the final battle of the American Revolution." The Senate had passed its bill, S. 1118, July 22, [63–29](https://voteview.com/rollcall/RS0890172).'
    n: 'Televised Statement by the President Concerning the Signing of the D.C. Home Rule Petition by a Majority of House Members, [1965 Pub. Papers 966](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=440) (Sept. 3, 1965); Letter to the Chairman, House Committee on the District of Columbia, [1965 Pub. Papers 971](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=445) (Sept. 4, 1965). To check: [[w.jaffe-dream-city]]; [[w.asch-chocolate-city]]. Names: McMillan, Johnson.'
    tags: [name:johnson-lyndon-b, name:mcmillan-john-l, state:dc, city:washington]
  - id: cal.1965-09-03.china
    when: Sept. 3
    date: '1965-09-03'
    thread: china
    also: [vietnam]
    c: '*Peking Review* prints Lin Biao''s "Long Live the Victory of People''s War": the world''s cities, the industrial nations, to be surrounded by its countryside, the developing countries, through local revolutions. By the Chinese accounts, written by Luo Ruiqing''s group in the General Staff, Kang Sheng''s team adding to it, and approved by the leadership; Lin had no hand in it.'
    n: '[[w.zhai-china-and-the-vietnam]], 145–46 (the article and its writers; Washington''s reading). Washington''s knowledge: [FRUS 1964–68, XXXIII, doc. 367](https://history.state.gov/historicaldocuments/frus1964-68v33/d367) (Chase to McGeorge Bundy, Sept. 13: at State''s strategy session for the General Assembly, Goldberg would "hit it hard"). To check: the article, *Peking Review*, Sept. 3, 1965, 9–30 (cited by [[w.zhai-china-and-the-vietnam]], 145 n.74); [[w.mcnamara-in-retrospect]], 215 (cited by [[w.zhai-china-and-the-vietnam]], 146 n.81, for Washington''s reading). Names: Lin Biao. Check: the day the article first appeared; Zhai''s bibliography (285) gives the *Peking Review* of Sept. 3.'
    src:
      c: 50fbd436
      rows:
        - 'w.zhai-china-and-the-vietnam 145–46: all'
        - 'via w.zhai-china-and-the-vietnam 145 n.74: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v33/d367: A'
    tags: [name:lin-biao]
  - id: cal.1965-09-06.foreign-aid
    when: Sept. 6
    date: '1965-09-06'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1965 signed, [79 Stat. 653](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg653.pdf): economic and military aid for fiscal 1966, one year''s authority. The conferees and their chairmen, Fulbright and Morgan, ask a review of the program; Johnson promises studies this fall.'
    n: 'Statement by the President Upon Signing the Foreign Assistance Act, [1965 Pub. Papers 978](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=452) (Sept. 6, 1965). To check: [[w.ruttan-united-states-development-assistance]]. See [[cal.1964-10-07.foreign-aid]]. Names: Fulbright, Morgan, Johnson.'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:morgan-thomas-e]
  - id: cal.1965-09-06.india-and-china
    when: Sept. 6
    date: '1965-09-06'
    thread: india-and-china-kashmir
    c: The Indian army over the Pakistan border toward Lahore.
    n: '[FRUS 1964–68, XXV, doc. 187](https://history.state.gov/historicaldocuments/frus1964-68v25/d187). See [[cal.1965-09-01.india-and-china]].'
  - id: cal.1965-09-07.state-constitutions-tx
    when: Sept. 7
    date: '1965-09-07'
    thread: state-constitutions
    also: [legislatures]
    c: Texas refuses an amendment to enlarge the Senate from 31 to 39, apportion it by population and drop the limit of one Senator a county, 85,951 to 136,461, 38.6 percent.
    n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Sept. 7, 1965](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1965-09-07). See [[cal.1965-01-11.legislatures-tx]].'
    tags: [state:tx]
  - id: cal.1965-09-08.jobs-and-wages-ca
    when: Sept. 8
    date: '1965-09-08'
    thread: jobs-and-wages-farm-workers
    c: Delano, Cal. Filipino grape pickers of the AFL-CIO's Agricultural Workers Organizing Committee strike the table-grape growers.
    n: 'Check: the record. To check: [[w.pawel-crusades-of-cesar-chavez]]; [[w.bardacke-trampling-out-the-vintage]].'
    tags: [state:ca]
  - id: cal.1965-09-08.transportation
    when: Sept. 8
    date: '1965-09-08'
    thread: transportation
    also: [cities-and-housing]
    c: 'National Capital Transportation Act signed, [79 Stat. 663](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg663.pdf): rail rapid transit for Washington, mostly within the District, on the Agency''s plan of January 1965, not over $431 million, to be extended to Maryland and Virginia under a compact Maryland has approved.'
    n: Statute (K–J Cong. II.J.2). Letter to the President of the Senate and to the Speaker of the House on a Rapid Transit Program for the Nation's Capital, [1965 Pub. Papers 178](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=254) (Feb. 10, 1965); Remarks at the Signing of the National Capital Transportation Act, [1965 Pub. Papers 981](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=455) (Sept. 8, 1965). See [[cal.1963-05-27.transportation]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-08.india-and-china
    when: Sept. 8
    date: '1965-09-08'
    thread: india-and-china-kashmir
    c: 'Mahon tells the House, for the administration, that military aid shipments to India and Pakistan are suspended and no new economic aid committed. China''s note to India the same day; McNamara to Johnson: plans are needed if China moves.'
    n: '[111 Cong. Rec., House, Sept. 8, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt17/pdf/GPO-CRECB-1965-pt17-6-2.pdf), 23141 (Mahon). FRUS 1964–68, XXV, docs. [190](https://history.state.gov/historicaldocuments/frus1964-68v25/d190) (Komer, Sept. 7), [193](https://history.state.gov/historicaldocuments/frus1964-68v25/d193) (editorial note). See [[cal.1965-09-01.india-and-china]]. Names: Mahon, McNamara, Johnson.'
    tags: [name:mahon-george-h, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1965-09-09.cities-and-housing
    when: Sept. 9
    date: '1965-09-09'
    thread: cities-and-housing
    c: 'Department of Housing and Urban Development Act signed in the Rose Garden, [79 Stat. 667](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg667.pdf): the eleventh executive department. The Housing and Home Finance Agency, the FHA, the Public Housing Administration, and the Federal National Mortgage Association go into it; in force in sixty days. No Secretary named.'
    n: 'Remarks at the Signing of Bill Establishing a Department of Housing and Urban Development, [1965 Pub. Papers 985](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=459) (Sept. 9, 1965). Opinion: [42 Op. Att''y Gen. 311](https://archive.org/details/op-atty-gen/042/page/n335/mode/1up) (1965), Katzenbach to the President, Nov. 23: documents the department''s personnel signed from Nov. 9, before a Secretary was appointed, bind the United States. To check: [[w.gelfand-nation-of-cities]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.pritchett-robert-clifton-weaver-and]]. See [[cal.1962-02-21.program]]; [[cal.1965-06-16.cities-and-housing]]; [[cal.1965-08-10.cities-and-housing]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-09.european-community
    when: Sept. 9
    date: '1965-09-09'
    thread: european-community
    c: 'De Gaulle''s press conference: against the Commission and majority voting.'
    n: 'Check: the record. See [[cal.1965-06-30.european-community]]. Names: de Gaulle.'
    tags: [name:de-gaulle-charles]
  - id: cal.1965-09-09.vietnam-support
    when: Sept. 9
    date: '1965-09-09'
    thread: vietnam-support
    c: 'The Committee for an Effective and Durable Peace in Asia announced, Arthur Dean chairman, 48 members, Acheson, Black, Gilpatric and McCloy among them, Conant, Dillon and Powell too: the President "has acted rightly." Organized at the White House''s initiative.'
    n: '*New York Times*, Sept. 9, 1965. [[w.gibbons-u-s-government-and]], IV, 30. To check: "Arthur Dean Committee" folder (LBJ Library, NSF Country File, Vietnam, Box 195). Names: Dean, Acheson, Black, Gilpatric, McCloy, Conant, Dillon, Powell.'
    tags: [name:dean-arthur-h, name:acheson-dean-g, name:black-eugene-r, name:gilpatric-roswell-l, name:mccloy-john-j, name:conant-james-b, name:dillon-c-douglas, name:powell-lewis-f-jr]
  - id: cal.1965-09-09.economy
    when: Sept. 9
    date: '1965-09-09'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Sterling. Ball and Fowler with Wilson in London, Rusk''s instructions of Sept. 7 that the support assumes no unilateral British withdrawal: Wilson to consult during the Defence Review; for staying east of Suez, against being corralled into Europe; the integration of sterling and the dollar a long-term aim. By the British record.'
    n: '[[w.schwartz-lyndon-johnson-and-europe]], 82. To check: Rusk to Ball, cable, Sept. 7, 1965, Bator Papers, LBJ Library; notes of meeting, Sept. 9, 1965, PREM 13/674, Public Record Office (cited by [[w.schwartz-lyndon-johnson-and-europe]], 82 nn.147–49). See [[cal.1965-08-05.economy]]. Names: Ball, Fowler, Wilson, Rusk.'
    src:
      c: 0f315a29
      rows:
        - 'w.schwartz-lyndon-johnson-and-europe 82: all'
        - 'via w.schwartz-lyndon-johnson-and-europe 82 n.147: B'
        - 'via w.schwartz-lyndon-johnson-and-europe 82 n.148: all'
        - 'via w.schwartz-lyndon-johnson-and-europe 82 n.149: all'
    tags: [name:ball-george-w, name:fowler-henry-h, name:wilson-harold, name:rusk-dean]
  - id: cal.1965-09-10.economy
    when: Sept. 10
    date: '1965-09-10'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Sterling. London, late Sept. 9: the Bank of England and the Chancellor of the Exchequer complete a multilateral package of $900 million to $1 billion, from ten countries and the Bank for International Settlements; the United States about $400 million, the Federal Reserve and the Exchange Stabilization Fund. The Bank of France withdraws. The Federal Reserve Bank of New York buys sterling from the morning of Sept. 10.'
    n: '[FRUS 1964–68, XII, doc. 249](https://history.state.gov/historicaldocuments/frus1964-68v12/d249) (Barr to Johnson, Sept. 10). [[w.schwartz-lyndon-johnson-and-europe]], 81 (the package). [[w.gavin-gold-dollars-and-power]], 132 (the package, by Martin and the Bank of England). See [[cal.1965-08-05.economy]]. Check: Schwartz, 81, gives $925 million in all. Check: Gavin, 132, gives a $2.5 billion package, the "Cromer-Martin plan."'
    src:
      c: cabc3bf0
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d249: all'
        - 'w.schwartz-lyndon-johnson-and-europe 81: B-C'
        - 'w.gavin-gold-dollars-and-power 132: B'
    tags: [name:barr-joseph-w]
  - id: cal.1965-09-10.war-opposition
    when: Sept. 10
    date: '1965-09-10'
    thread: war-opposition
    also: [king]
    c: 'New York. King with Goldberg at the UN, over an hour, at the President''s instance: King for a halt to the bombing of the North and talks with the Viet Cong, and for China''s admission to the UN.'
    n: '[[w.garrow-bearing-the-cross]], 443–45. To check: Chicago Daily News, Sept. 10, 1965, 3; New York Times, Sept. 11, 1965, 9; New York Herald Tribune, Sept. 11, 1965, 4; Washington Post, Sept. 11, 1965, A7; King, press conference, Sept. 10, 1965, King Papers, King Center; Marvin Watson to Johnson, Sept. 14, 1965, King Name File, Johnson Library (cited by [[w.garrow-bearing-the-cross]], 445 n.16). Names: King, Goldberg.'
    src:
      c: 6b8c9618
      rows:
        - 'w.garrow-bearing-the-cross 444–45: all'
        - 'via w.garrow-bearing-the-cross 445 n.16a: all'
        - 'via w.garrow-bearing-the-cross 445 n.16b: B'
        - 'via w.garrow-bearing-the-cross 445 n.16c: B'
    tags: [name:king-martin-luther-jr, name:goldberg-arthur-j, state:ny, city:nyc]
  - id: cal.1965-09-11.vietnam
    when: Sept. 11
    date: '1965-09-11'
    thread: vietnam
    also: [defense]
    c: 'McNamara to Wheeler on the Chiefs'' concept: recommendations for future operations "should be submitted for individual consideration as they are developed." McNaughton, Sept. 8, had advised against approving it as a whole: blockade, mining, the Thai buildup "clearly controversial." The same day Rusk, McNamara, McGeorge Bundy and Ball meet on the war; Rusk asks whether 200,000 men are needed.'
    n: '[FRUS 1964–68, III, doc. 136](https://history.state.gov/historicaldocuments/frus1964-68v03/d136) (McNaughton). McNamara to the Chairman of the Joint Chiefs, "Concept for Vietnam," Sept. 11, 1965 (National Archives, RG 330); McGeorge Bundy to Johnson, Sept. 12, on the meeting (LBJ Library, NSF Memos to the President) (Check: neither read). [[w.gibbons-u-s-government-and]], IV, 47–48, 72–73. See [[cal.1965-08-27.vietnam]]. Names: McNamara, Wheeler, McNaughton, Rusk, McGeorge Bundy, Ball.'
    tags: [name:mcnamara-robert-s, name:wheeler-earle, name:mcnaughton-john-t, name:rusk-dean, name:bundy-mcgeorge, name:ball-george-w]
  - id: cal.1965-09-12.opinion
    when: Sept. 12
    date: '1965-09-12'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 27–Sept. 1, South only: Johnson 44 percent, Nixon 47. The Johnson Administration pushing integration too fast: Southern whites 69, whites outside the South 36.'
    n: '[[w.gallup-poll]], III, 1961. The integration figures are those printed for July 16–21 ([[cal.1965-08-06.opinion]]). Check. Names: Johnson, Nixon.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1965-09-12.war-opposition
    when: Sept. 12
    date: '1965-09-12'
    thread: war-opposition
    also: [king]
    c: 'King on a conference call with Levison, Wachtel, Clarence Jones, Cleveland Robinson and Andrew Young, after Dodd''s attack of Sept. 11: Johnson put Dodd up to it; he lacks the strength to fight this and civil rights both. He drops the letters to the war''s leaders and steps back from the peace issue, for now; his advisors agree. The FBI''s taps overhear.'
    n: '[[w.garrow-bearing-the-cross]], 445–46. To check: FBI files 100-111180-9-695A (New York) and 100-442529-1446, Sept. 12, 1965; FBI file 100-106670-NR, Sept. 13, 1965 (cited by [[w.garrow-bearing-the-cross]], 446 n.16). Check: the day. See [[cal.1965-09-10.war-opposition]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King, Levison, Young, Johnson, Dodd.'
    src:
      c: fa52cd11
      rows:
