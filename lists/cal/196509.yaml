    c: 'Fulbright in the Senate on the Dominican intervention, from his committee''s hearings: policy "characterized initially by overtimidity and subsequently by overreaction," and throughout "by a lack of candor"; the decision that the revolt "should not be allowed to succeed" rested on "exaggerated estimates of Communist influence." Sept. 20, the House, on Selden''s H. Res. 560, [312–52](https://voteview.com/rollcall/RH0890160): an American state may meet Communist subversion in the hemisphere "so far as resort to armed force." Saving lives "more a pretext than a reason for the massive U.S. intervention"; the response "to intervene forcibly and illegally against a revolution." His letter to Johnson, sent ahead: he takes exception to "the faulty advice that was given to you."'
