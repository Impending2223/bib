  - id: cal.1965-09-02.conservation
    when: Sept. 2
    date: '1965-09-02'
    thread: conservation
    c: 'Udall to Johnson, a month before the water bill is signed: "Our Great Society goals will be achieved by new laws, by appropriations, by reorganization, and by crusading leadership"; water and air pollution "a reorganization to put the various programs under a single Cabinet officer," Interior; HEW''s education on the reservations perhaps in trade.'
    n: '[[w.bernstein-guns-or-butter]], 285. To check: Udall to Johnson, Sept. 2, 1965, EX HE 8-1 File, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 285 n.6). See [[cal.1965-01-28.conservation]]. Names: Udall, Johnson.'
