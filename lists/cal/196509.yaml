    thread: states-and-cities
    also: [congress]
    c: 'Home rule for the District. A discharge petition to bring the District charter bill, H.R. 4644, out of McMillan''s District Committee reaches 218 names, a majority of the House. Johnson on television: "we near victory in the final battle of the American Revolution." The Senate had passed its bill, S. 1118, July 22, [63–29](https://voteview.com/rollcall/RS0890172).'
    n: 'Televised Statement by the President Concerning the Signing of the D.C. Home Rule Petition by a Majority of House Members, [1965 Pub. Papers 966](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=440) (Sept. 3, 1965); Letter to the Chairman, House Committee on the District of Columbia, [1965 Pub. Papers 971](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=445) (Sept. 4, 1965). [[w.califano-triumph-and-tragedy-of]], 229 (favors for signers; "a birthday present"; Shipley''s secretary to the Usher''s Office at 7:45 a.m.: the last signature); [[w.bernstein-guns-or-butter]], 313 (169 Northern Democrats, 23 Southern, 26 Republicans; the Senate''s vote July 22). To check: [[w.jaffe-dream-city]]; [[w.asch-chocolate-city]]. Names: McMillan, Johnson.'
