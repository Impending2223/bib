    n: 'FRUS 1961–63, III, docs. [261](https://history.state.gov/historicaldocuments/frus1961-63v03/d261), [262](https://history.state.gov/historicaldocuments/frus1961-63v03/d262). [[w.hammer-death-in-november]]; [[w.miller-misalliance]]; [[w.moyar-triumph-forsaken]]; [[w.ahern-cia-and-the-house-2000]]; [[w.demery-finding-the-dragon-lady]]; [[w.blair-lodge-in-vietnam]]; [[w.gibbons-u-s-government-and]], II, 148. See [[cal.1963-05-08.vietnam]]. Names: Ngô Đình Nhu, Lodge.'
