    n: '[Conversation With the Prime Minister of Nigeria by Means of the Syncom Communications Satellite](https://www.presidency.ucsb.edu/documents/conversation-with-the-prime-minister-nigeria-means-the-syncom-communications-satellite) (Aug. 23, 1963). See [[cal.1962-07-10.space]]. Names: Balewa.'
