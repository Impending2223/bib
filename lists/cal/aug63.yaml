  - id: cal.1963-08-05.testing
    when: Aug. 5
    date: '1963-08-05'
    thread: testing
    c: 'Treaty, [14 U.S.T. 1313](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-14-2/lltreaties-14-2.pdf#page=57), [480 U.N.T.S. 43](https://treaties.un.org/doc/Publication/UNTS/Volume%20480/volume-480-I-6964-English.pdf), signed in Moscow by Rusk, Gromyko, and Home: no tests in the atmosphere, in outer space, or under water. U Thant and a Senate delegation present.'
    n: 'Treaty (K–J Cong. II.J.2). [FRUS 1961–63, V, doc. 344](https://history.state.gov/historicaldocuments/frus1961-63v05/d344); [FRUS 1961–63, VII, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v07/d359). See [[cal.1963-06-10.testing]]. Names: Rusk (K–J Adm. III.E); Gromyko, U Thant (K–J Adm. III.J).'
    tags: [name:rusk-dean, name:gromyko-andrei, name:home-earl-of, name:u-thant]
  - id: cal.1963-08-06.school-aid
    when: Aug. 6–14
    date: '1963-08-06'
    thread: school-aid
    c: House passes the vocational education bill, [378–21](https://voteview.com/rollcall/RH0880055) (Aug. 6), and the college facilities bill, grants and loans of $1.195 billion over three years, [287–113](https://voteview.com/rollcall/RH0880060) (Aug. 14).
    n: '[109 Cong. Rec., House, Aug. 6, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt11/pdf/GPO-CRECB-1963-pt11-2-2.pdf); [109 Cong. Rec., House, Aug. 14, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt11/pdf/GPO-CRECB-1963-pt11-8-2.pdf). See [[cal.1963-01-29.school-aid]].'
  - id: cal.1963-08-07.opinion
    when: Aug. 7
    date: '1963-08-07'
    thread: opinion
    also: [railroads]
    c: 'Gallup, July 18–23: 71 percent have heard of the railroad dispute. Of them, 40 side with the railroads, 28 with the unions. Few would have the government dictate terms.'
    n: '*The Gallup Poll*, III, 1832 (K–J Cong. II.E).'
  - id: cal.1963-08-08.testing
    when: Aug. 8–27
    date: '1963-08-08'
    thread: testing
    c: Treaty sent to the Senate. Foreign Relations hearings, Aug. 12–27, members of Armed Services and the Joint Committee on Atomic Energy sitting with it. Rusk first. The Joint Chiefs for the treaty, with safeguards; Teller against.
    n: '[Special Message to the Senate on the Nuclear Test Ban Treaty](https://www.presidency.ucsb.edu/documents/special-message-the-senate-the-nuclear-test-ban-treaty) (Aug. 8, 1963). *Nuclear Test Ban Treaty: Hearings Before the S. Comm. on Foreign Relations* (K–J Cong. II.J.3). [FRUS 1961–63, VII, doc. 364](https://history.state.gov/historicaldocuments/frus1961-63v07/d364) (Gilpatric to Russell, Aug. 23, on the safeguards). Johnson, *Congress and the Cold War*; Terchek, *The Making of the Test Ban Treaty* (K–J Cong. II.D). See [[cal.1963-06-10.testing]]. Names: Rusk (K–J Adm. III.E).'
    tags: [name:kennedy-john-f, name:rusk-dean, name:teller-edward]
  - id: cal.1963-08-09.opinion
    when: Aug. 9
    date: '1963-08-09'
    thread: opinion
    also: [railroads]
    c: 'Gallup, July 18–23: a law against unions requiring more workers than a job needs, 52 percent for, 25 against; union members 48 for.'
    n: '*The Gallup Poll*, III, 1832 (K–J Cong. II.E).'
  - id: cal.1963-08-11.opinion
    when: Aug. 11
    date: '1963-08-11'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, July 18–23: the Kennedy administration pushing integration too fast, 48 percent; not fast enough, 11. Whites 54 too fast (Southern whites 73), nonwhites 3.'
    n: '*The Gallup Poll*, III, 1832 (K–J Cong. II.E).'
  - id: cal.1963-08-14.opinion-5
    when: Aug. 14
    date: '1963-08-14'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, July 18–23: Republicans'' choice for 1964: Goldwater 39, Rockefeller 22, Romney 21, Stassen 5, Scranton 4; others, no preference 9. Independents: Goldwater 37, Rockefeller 25.'
    n: '*The Gallup Poll*, III, 1833 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller, Romney, Scranton (Opp. III.H); Stassen (Opp. III.E).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w, name:stassen-harold-e, name:scranton-william-w]
  - id: cal.1963-08-16.opinion
    when: Aug. 16
    date: '1963-08-16'
    thread: opinion
    c: 'Gallup, July 18–23: Negroes here treated the same as whites, 56 percent; not very well, 21; badly, 3. Better than a year ago, 21; no different, 59.'
    n: '*The Gallup Poll*, III, 1833 (K–J Cong. II.E).'
  - id: cal.1963-08-18.opinion-5
    when: Aug. 18
    date: '1963-08-18'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, July 18–23, the South: Goldwater 54, Kennedy 38; Romney 47, Kennedy 40; Kennedy 44, Rockefeller 39. Undecided, others 8, 13, 17.'
    n: '*The Gallup Poll*, III, 1833–34 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Romney, Rockefeller (Opp. III.H).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m, name:romney-george-w, name:rockefeller-nelson]
  - id: cal.1963-08-21.vietnam
    when: Aug. 21
    date: '1963-08-21'
    thread: vietnam
    c: Night of Aug. 20–21. Special Forces under Nhu and combat police raid the pagodas of Saigon, Hue, and other cities; monks and nuns arrested by the hundreds. Martial law. Lodge arrives in Saigon, Aug. 22.
    n: 'FRUS 1961–63, III, docs. [261](https://history.state.gov/historicaldocuments/frus1961-63v03/d261), [262](https://history.state.gov/historicaldocuments/frus1961-63v03/d262). Hammer, *A Death in November* (Viet. II.B.12). Miller, *Misalliance*; Moyar, *Triumph Forsaken* (Viet. II.B.7). Ahern, *CIA and the House of Ngo* (Viet. II.I.3). Demery, *Finding the Dragon Lady* (Viet. II.H.3). Blair, *Lodge in Vietnam* (Viet. II.H.1). See [[cal.1963-05-08.vietnam]]. Names: Ngo Dinh Nhu (Viet. III.G); Lodge (Viet. III.C).'
    tags: [name:ngo-dinh-nhu, name:lodge-henry-cabot]
  - id: cal.1963-08-21.economy
    when: Aug. 21
    date: '1963-08-21'
    thread: economy
    c: 'Letter to Mills on the tax bill before his committee: spending held to "strict criteria of national need"; the fiscal 1965 deficit below 1964''s $9.2 billion; the debt to grow more slowly than GNP.'
    n: '[Letter to the Chairman, House Ways and Means Committee, on Tax Reduction](https://www.presidency.ucsb.edu/documents/letter-the-chairman-house-ways-and-means-committee-tax-reduction) (Aug. 21, 1963). Zelizer, *Taxing America* (K–J Cong. II.B). See [[cal.1963-01-24.economy]]. Names: Mills (K–J Cong. III.D).'
    tags: [name:kennedy-john-f, name:mills-wilbur-d]
  - id: cal.1963-08-21.trade
    when: Aug. 21
    date: '1963-08-21'
    thread: trade
    c: Proclamation 3548. The Tariff Schedules of the United States in force Aug. 31, under the Tariff Classification Act of 1962.
    n: '[Proclamation 3548—Proclamation to Make Effective the Tariff Schedules of the United States](https://www.presidency.ucsb.edu/documents/proclamation-3548-proclamation-make-effective-the-tariff-schedules-the-united-states) (Aug. 21, 1963). Zeiler, *American Trade and Power in the 1960s* (K–J Adm. II.B). See [[cal.1962-10-11.trade]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-08-21.opinion-5
    when: Aug. 21
    date: '1963-08-21'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, July 18–23, the East: Kennedy 70, Goldwater 26; Kennedy 73, Rockefeller 23; Kennedy 67, Romney 24. Undecided, others 4, 4, 9.'
    n: '*The Gallup Poll*, III, 1834 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller, Romney (Opp. III.H).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1963-08-23.foreign-aid
    when: Aug. 23
    date: '1963-08-23'
    thread: foreign-aid
    c: 'House cuts the aid authorization by almost $600 million, then passes it, [224–186](https://voteview.com/rollcall/RH0880062); Republicans 52–120. Kennedy: "unprecedented, unwarranted, and unwise." At Hyannis Port, Aug. 30, he asks the Senate to restore it.'
    n: '[109 Cong. Rec., House, Aug. 23, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-3-1.pdf). [Statement by the President on the Cut in the Mutual Security Authorization Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-the-cut-the-mutual-security-authorization-bill) (Aug. 23, 1963). [The President''s Special News Conference at Hyannis Port on the Mutual Security Program](https://www.presidency.ucsb.edu/documents/the-presidents-special-news-conference-hyannis-port-the-mutual-security-program) (Aug. 30, 1963). See [[cal.1963-04-02.foreign-aid]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-08-24.vietnam
    when: Aug. 24
    date: '1963-08-24'
    thread: vietnam
    c: Saturday. Cable 243 to Lodge, drafted by Hilsman with Harriman and Forrestal, cleared by Ball; Kennedy approves by telephone from Hyannis Port. Rusk, McNamara, McCone away. Diem to be rid of Nhu; if he refuses, "we must face the possibility that Diem himself cannot be preserved." The generals to be promised support in any interim.
    n: '[FRUS 1961–63, III, doc. 281](https://history.state.gov/historicaldocuments/frus1961-63v03/d281); [doc. 280](https://history.state.gov/historicaldocuments/frus1961-63v03/d280) (Forrestal to the President). Hilsman, *To Move a Nation*; Taylor, *Swords and Plowshares*; Ball, *The Past Has Another Pattern*; Abramson, *Spanning the Century* (K–J Adm. II.G.4). Jones, *Death of a Generation*; Winters, *The Year of the Hare*; Kaiser, *American Tragedy* (Viet. II.B.8). Hammer, *A Death in November* (Viet. II.B.12). Miller, *Misalliance*; Moyar, *Triumph Forsaken*; Kahin, *Intervention* (Viet. II.B.7). Ahern, *CIA and the House of Ngo* (Viet. II.I.3). Bird, *The Color of Truth*; Blair, *Lodge in Vietnam* (Viet. II.H.1). *The Pentagon Papers* (K–J Adm. II.H.3). See [[cal.1963-05-08.vietnam]]. Names: Hilsman, Harriman, Forrestal, Ball, Rusk, McNamara, McCone (Viet. III.A); Lodge (Viet. III.C); Ngo Dinh Diem, Ngo Dinh Nhu (Viet. III.G).'
    tags: [name:hilsman-roger, name:harriman-w-averell, name:forrestal-michael-v, name:ball-george-w, name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:mccone-john-a, name:lodge-henry-cabot, name:ngo-dinh-diem, name:ngo-dinh-nhu]
  - id: cal.1963-08-25.opinion-5
    when: Aug. 25
    date: '1963-08-25'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, July 18–23: Kennedy 59, Goldwater 35; Kennedy 61, Rockefeller 30; Kennedy 57, Romney 34. Undecided, others 6, 9, 9.'
    n: '*The Gallup Poll*, III, 1835–36 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller, Romney (Opp. III.H).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1963-08-26.vietnam
    when: Aug. 26–31
    date: '1963-08-26'
    thread: vietnam
    c: 'White House meetings each day on the cable. Kennedy to Lodge, Aug. 29: "When we go, we must go to win, but it will be better to change our minds than fail." Aug. 31: Lodge reports neither "the will nor the organization among the Generals." The plot lapses.'
    n: 'FRUS 1961–63, IV, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v04/d1), [15](https://history.state.gov/historicaldocuments/frus1961-63v04/d15), [18](https://history.state.gov/historicaldocuments/frus1961-63v04/d18), [34](https://history.state.gov/historicaldocuments/frus1961-63v04/d34). Kennedy, Oval Office recordings on Vietnam (Viet. II.J). Blair, *Lodge in Vietnam* (Viet. II.H.1). See [[cal.1963-08-24.vietnam]]. Names: Lodge (Viet. III.C).'
    tags: [name:kennedy-john-f, name:lodge-henry-cabot]
  - id: cal.1963-08-27.railroads
    when: Aug. 27–28
    date: '1963-08-27'
    thread: railroads
    c: Senate passes S.J. Res. 102, [90–2](https://voteview.com/rollcall/RS0880116), Morse and Tower against; the House, 286–66, standing, Aug. 28. Signed that day, [77 Stat. 132](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg132.pdf), before the strike set for 12:01 a.m. Aug. 29. The firemen and crew-consist issues to a board of seven, two named by each side and three neutral; no strike or lockout meanwhile.
    n: '[109 Cong. Rec. Senate, Aug. 27, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-5-1.pdf); [109 Cong. Rec. House, Aug. 28, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-6-2.pdf). [Statement by the President Upon Signing Bill To Avert the Nationwide Railroad Shutdown](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-avert-the-nationwide-railroad-shutdown) (Aug. 28, 1963). Kaufman, *The Railroad Labor Dispute*; Comment, *Ad Hoc Compulsory Arbitration Statutes* (K–J Adm. II.B). See [[cal.1963-07-09.railroads]]. Names: Morse (K–J Cong. III.B); Tower (K–J Cong. III.E).'
    tags: [name:morse-wayne, name:tower-john-g, name:kennedy-john-f]
  - id: cal.1963-08-27.opinion
    when: Aug. 27
    date: '1963-08-27'
    thread: opinion
    also: [march-on-washington, desegregation-public-places]
    c: 'Gallup, Aug. 15–20: 69 percent have heard of the planned March on Washington. Of them, 22 favorable, 63 unfavorable.'
    n: '*The Gallup Poll*, III, 1836 (K–J Cong. II.E).'
  - id: cal.1963-08-28.march-on-washington
    when: Aug. 28
    date: '1963-08-28'
    thread: march-on-washington
    also: [civil-rights-bill, king]
    c: 'March on Washington for Jobs and Freedom. Some 200,000 to 250,000, from the Washington Monument to the Lincoln Memorial. Randolph presides; Rustin the organizer. Lewis''s text cut that morning. King last: "I have a dream." The leaders at the White House after.'
    n: '[Statement by the President on the March on Washington for Jobs and Freedom](https://www.presidency.ucsb.edu/documents/statement-the-president-the-march-washington-for-jobs-and-freedom) (Aug. 28, 1963). March on Washington (Aug. 28, 1963) (K–J Cong. II.K). D''Emilio, *Lost Prophet*; Anderson, *A. Philip Randolph*; Lewis, *Walking with the Wind* (K–J Cong. II.I.4). Branch, *Parting the Waters* (K–J Adm. II.C). Garrow, *Bearing the Cross*; Gentile, *March on Washington: August 28, 1963*; Hansen, *The Dream*; Euchner, *Nobody Turn Me Around*; Jones & Connelly, *Behind the Dream*; Jones, *The March on Washington: Jobs, Freedom, and the Forgotten History of Civil Rights* (K–J Cong. II.F). Rosenberg & Karabell, *Kennedy, Johnson, and the Quest for Justice*, "The Bill and the March" (K–J Adm. II.J). See [[cal.1963-06-11.civil-rights-bill]]. Names: Randolph, Rustin, Lewis, King (K–J Cong. III.H).'
    tags: [name:randolph-a-philip, name:rustin-bayard, name:lewis-john, name:king-martin-luther-jr, name:kennedy-john-f]
  - id: cal.1963-08-29.testing
    when: Aug. 29
    date: '1963-08-29'
    thread: testing
    c: Fulbright's Foreign Relations Committee approves the treaty, 16–1; its report, Sept. 3. Stennis's Preparedness subcommittee, without jurisdiction, reports against it, Sept. 3 by FRUS. Check the date.
    n: '[FRUS 1961–63, VII, doc. 366](https://history.state.gov/historicaldocuments/frus1961-63v07/d366). *Military Aspects and Implications of Nuclear Test Ban Proposals and Related Matters: Hearings Before the Preparedness Investigating Subcomm. of the S. Comm. on Armed Services* (K–J Cong. II.J.3). See [[cal.1963-06-10.testing]]. Names: Fulbright, Stennis (K–J Cong. III.B).'
    tags: [name:fulbright-j-william, name:stennis-john-c]
  - id: cal.1963-08-30.testing
    when: Aug. 30
    date: '1963-08-30'
    thread: testing
    c: The hot line in operation. Teletype, Washington to Moscow by way of London, Copenhagen, Stockholm, and Helsinki, under the memorandum signed at Geneva June 20.
    n: Memorandum of Understanding Regarding the Establishment of a Direct Communications Link, June 20, 1963, [14 U.S.T. 825](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-14-1/lltreaties-14-1.pdf#page=837), [472 U.N.T.S. 163](https://treaties.un.org/doc/Publication/UNTS/Volume%20472/volume-472-I-6839-English.pdf). See [[cal.1963-06-10.testing]].
  - id: cal.1963-08-30.opinion
    when: Aug. 30
    date: '1963-08-30'
    thread: opinion
    also: [court]
    c: 'Gallup, June 21–26: the Supreme Court''s ruling against required Bible reading and the Lord''s Prayer in public schools, 24 percent approve, 70 disapprove. July 18–23: the Court rated excellent 10, good 33, fair 26, poor 15.'
    n: '*The Gallup Poll*, III, 1836 (K–J Cong. II.E).'
