    c: St. Louis. CORE pickets and sits in at the Jefferson Bank and Trust Company, at least 150, for Negro clerical hiring. The bank gets a restraining order; nineteen held in contempt and jailed, Alderman William Clay 270 days and a $1,000 fine. CORE ends the demonstrations in March 1964.
    n: '*Curtis v. Tozer*, [374 S.W.2d 557](https://static.case.law/sw2d/374/case-pdfs/0557-01.pdf) (Mo. Ct. App. 1964). St. Louis Public Radio, ["Jefferson Bank Movement Turns 50"](https://www.stlpr.org/government-politics-issues/2013-08-30/jefferson-bank-movement-turns-50-protesters-from-far-and-near-recall-segregated-st-louis) (Aug. 30, 2013) (Check: the court''s order and the sentences). [[w.lang-grassroots-at-the-gateway]]. Names: Clay.'
