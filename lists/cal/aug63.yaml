  - id: cal.1963-08-27.railroads
    when: Aug. 27–28
    date: '1963-08-27'
    thread: railroads
    c: Senate passes S.J. Res. 102, [90–2](https://voteview.com/rollcall/RS0880116), Morse and Tower against; the House, 286–66, standing, Aug. 28. Signed that day, [77 Stat. 132](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg132.pdf), before the strike set for 12:01 a.m. Aug. 29. The firemen and crew-consist issues to a board of seven, two named by each side and three neutral; no strike or lockout meanwhile.
    n: '[109 Cong. Rec. Senate, Aug. 27, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-5-1.pdf); [109 Cong. Rec. House, Aug. 28, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-6-2.pdf). [Statement by the President Upon Signing Bill To Avert the Nationwide Railroad Shutdown](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-avert-the-nationwide-railroad-shutdown) (Aug. 28, 1963). [[w.kaufman-railroad-labor-dispute]]; [[w.comment-ad-hoc-compulsory-arbitration]]. See [[cal.1963-07-09.railroads]]. Names: Morse, Tower.'
    tags: [name:morse-wayne, name:tower-john-g, name:kennedy-john-f]
