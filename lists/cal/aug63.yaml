  - id: cal.1963-08-24.vietnam
    when: Aug. 24
    date: '1963-08-24'
    thread: vietnam
    c: Saturday. Cable 243 to Lodge, drafted by Hilsman with Harriman and Forrestal, cleared by Ball; Kennedy approves by telephone from Hyannis Port. Rusk, McNamara, McCone away. Diệm to be rid of Nhu; if he refuses, "we must face the possibility that Diem himself cannot be preserved." The generals to be promised support in any interim.
    n: '[FRUS 1961–63, III, doc. 281](https://history.state.gov/historicaldocuments/frus1961-63v03/d281); [doc. 280](https://history.state.gov/historicaldocuments/frus1961-63v03/d280) (Forrestal to the President). [[w.hilsman-to-move-a-nation]]; [[w.taylor-swords-and-plowshares]]; [[w.ball-past-has-another-pattern]]; [[w.abramson-spanning-the-century]]; [[w.jones-death-of-a-generation]]; [[w.winters-year-of-the-hare]]; [[w.kaiser-american-tragedy]]; [[w.hammer-death-in-november]]; [[w.miller-misalliance]]; [[w.moyar-triumph-forsaken]]; [[w.kahin-intervention]]; [[w.ahern-cia-and-the-house-2000]]; [[w.bird-color-of-truth]]; [[w.blair-lodge-in-vietnam]]; [[w.pentagon-papers]]; [[w.gibbons-u-s-government-and]], II, 148–151. See [[cal.1963-05-08.vietnam]]. Names: Hilsman, Harriman, Forrestal, Ball, Rusk, McNamara, McCone, Lodge, Ngô Đình Diệm, Ngô Đình Nhu.'
    tags: [name:hilsman-roger, name:harriman-w-averell, name:forrestal-michael-v, name:ball-george-w, name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:mccone-john-a, name:lodge-henry-cabot, name:ngo-dinh-diem, name:ngo-dinh-nhu]
