  - id: cal.1960-05-03.program
    when: May 3
    date: '1960-05-03'
    thread: program
    c: Special message on the legislative program, two months left in the session. Mutual security; wheat; sugar, with authority to adjust quotas; the 4¼ percent ceiling on bonds lifted; a gasoline tax for the highways; immigration; school construction by debt service; medical care for the aged without compulsion; a moderate rise in the minimum wage; a balanced budget.
    n: 'Special Message to the Congress on the Legislative Program, [1960–61 Pub. Papers 385](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=437) (May 3, 1960). To check: [[w.morgan-eisenhower-versus-the-spenders]]; [[w.pach-presidency-of-dwight-d]]. Names: Eisenhower.'
    src:
      c: bb6c493f
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=437: all'
    tags: [name:eisenhower-dwight-d]
    short: the legislative program message
    time_range:
