    c: 'Libertyville, Ill., the morning. Stevenson to Schlesinger: Blair has pressed him for a year to come out for Kennedy; to do so now "would look as if I were jumping on the bandwagon" or "angling for a job." Before the convention he might help "in terms calculated to preserve as much party harmony as possible." The draft pressure mounts, eleven telegrams that morning; to callers: "If you do anything about this, you must do it on your own."'
