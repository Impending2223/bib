  - id: cal.1960-05-03.vietnam
    when: May 3
    date: '1960-05-03'
    time: 1960-05-03T10:00Z
    thread: vietnam
    c: 'Durbrow to State: Saigon, Nhu most likely behind it, backed a Thai plan for a raid by a hundred "Free Khmers" into Cambodia and flew them French arms. Persuasion having failed, he asks leave to tell Diệm the extra equipment discussed with Thuần will not be sent until Saigon settles with Cambodia; the MAAG chief and the USOM director concur.'
    n: '[FRUS 1958–60, I, doc. 150](https://history.state.gov/historicaldocuments/frus1958-60v01/d150) (Durbrow, telegram 3095). [[w.moyar-triumph-forsaken]], 106 (the raid; Durbrow''s proposal to deny the equipment; Lansdale''s rejoinder, May 4). To check: Wood, memorandum of conversation, May 5, 1960, RG 59, C0092, reel 1, National Archives (cited by [[w.moyar-triumph-forsaken]], 106 n.52); [FRUS 1958–60, I, doc. 153](https://history.state.gov/historicaldocuments/frus1958-60v01/d153) (Lansdale''s notes on the telegram, May 4; cited by [[w.moyar-triumph-forsaken]], 106 n.53). See [[cal.1960-04-26.vietnam]]. Names: Durbrow, Nhu, Diệm, Nguyễn Đình Thuần.'
    src:
      c: da10c492
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v01/d150: all'
