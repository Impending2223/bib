  - id: cal.1960-05-04.medicare
    when: May 4
    date: '1960-05-04'
    thread: medicare
    c: 'Flemming''s plan, "medicare": for those over sixty-five with incomes under $2,500 ($3,800 a couple), a fee of $24 a year; after the first $250 of costs ($400 a couple), 80 percent of 180 days in hospital, nursing homes and most other costs. Run by the States; federal and State governments $600 million each, the federal share from general revenues.'
    n: '[[w.sundquist-politics-and-policy]], 304. See [[cal.1960-03-31.medicare]]. Names: Flemming.'
