    also: [soviet-union]
    c: 'Hangzhou, the Nanping pool. Mao''s meeting: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Ke Qingshi, Lu Dingyi, Chen Boda, Kang Sheng, Wang Jiaxiang, Yang Shangkun, Jiang Hua. After the summit''s break: imperialism unchanged; Khrushchev "twelve changes in an hour," pushed by America; the fight with the CPSU by articles, "pointing at the mulberry to curse the locust," and no break. The enlarged Politburo at Shanghai June 8 (the three-year plan, the world), the Eighth Congress''s third session in late June.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, May 22, 1960; [[w.zhou-enlai-nianpu-1949]], II, 320–21, May 22, 1960 (Zhou at the enlarged Standing Committee meeting); [[w.lengxi-shinian-lunzhan-1956-1966]], 270 (the Standing Committee at Hangzhou; Liu from Wuhan, Zhou and Deng from Peking with Kim, Chen Yun attending; Wu not there; on the summit''s collapse and Khrushchev); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 486 (May 21–22, 1960; Liu attends the Politburo Standing Committee''s meeting at Hangzhou, chiefly on the international situation and Sino-Soviet relations); [[w.yang-shangkun-riji]], I, 511 (May 22, 1960; 5 to 10 p.m., at Mao''s swimming pool: the situation; the Party and government delegation to the Soviet Union; an enlarged Politburo on June 8; the Eighth Congress''s third session on June 25 (never held, by the editors'' note)). Made public: 1996. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Ke Qingshi, Lu Dingyi, Chen Boda, Kang Sheng, Wang Jiaxiang, Yang Shangkun, Jiang Hua, Khrushchev.'
