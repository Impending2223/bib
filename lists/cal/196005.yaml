    c: 'Paris. Eisenhower, arriving, with de Gaulle and Macmillan, 2:30 and 6 p.m., on Khrushchev''s demand: no apology, even at the cost of the visit to Moscow. A two-year interim agreement on Berlin a new ultimatum, not acceptable. Disarmament to be pressed; de Gaulle open to limits on the means of delivery.'
