    c: 'Hanoi.{1} Zhou Enlai, in private meetings, urges the North''s leaders to keep the status quo in the South, avoid escalation, and finish collectivizing agriculture and build light industry: the North first a rear base.{2}'
    n: '[[w.asselin-hanois-road-to-the]], 79; [[w.zhou-enlai-nianpu-1949]], II, 316, May 11, 1960 (the talks of May 11–13); [[w.jian-zhou-enlai]], 493 (Hanoi, May 1960: not against the Southern Revolution, but a "flexible approach combining political and military struggles"; not to abandon political action); [[w.guan-vietnamese-communists-relations-with]], 146 (the talks of May 11, 12 and 13, most likely the meeting of May 1960 of the official Vietnamese account of 1980: the Chinese hold military and political struggle equally important, no seizing power at once, the struggle protracted; the North to help the South politically and in policy, foster self-reliance, and, when success is sure, supply arms secretly; in general no direct help); [[w.guan-vietnamese-communists-relations-with]], 147–148 (by a Chinese source, the leaders meet in mid-May first in Hanoi, then in Peking: Zhou to Phạm Văn Đồng, the South must be liberated; Zhou and Deng, political and military struggle together, the political first in the cities, the military in the countryside; Đồng agrees. Perhaps the point in 1960 of Hoàng Văn Hoan''s account: the Chinese, fully briefed, own they were less well informed, now see the Vietnamese right on armed struggle in the South and will fully support it). To check: [[w.zhai-china-and-the-vietnam]], 82–83 (cited by [[w.asselin-hanois-road-to-the]], 79 n.41); Summary of Premier Zhou''s meetings with Phạm Văn Đồng during his visit to Vietnam, May 11, 1960 (cited by [[w.jian-zhou-enlai]], 493 n.6a); Zhou Enlai''s second conversation with Hồ Chí Minh, Lê Duẩn and others, May 12, 1960 (cited by [[w.jian-zhou-enlai]], 493 n.6b); [[w.zhou-enlai-waijiao-huodong]], 279–280 (cited by [[w.jian-zhou-enlai]], 493 n.6c); [[w.war-experiences-recapitulation-committee]], 44–45 (cited by [[w.guan-vietnamese-communists-relations-with]], 146 n.56); [[w.ming-zhong-yue-guanxi-yanbian]], 67 (cited by [[w.guan-vietnamese-communists-relations-with]], 148 n.62); Hoàng Văn Hoan, "Distortion of Facts about the Militant Friendship between Vietnam and China Is Impermissible," Beijing Review no. 49, Dec. 7, 1979, 15 (cited by [[w.guan-vietnamese-communists-relations-with]], 148 n.63). Names: Zhou Enlai. Check: the days.'
