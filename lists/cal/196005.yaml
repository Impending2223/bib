  - id: cal.1960-05-01.soviet-union
    when: May 1–3
    date: '1960-05-01'
    thread: soviet-union-u2
    c: 'Powers''s U-2, out of Peshawar for Bodø, Norway, shot down near Sverdlovsk, 1,200 miles inside the Soviet Union. Powers parachutes; taken alive. May 3: NASA''s cover story, a weather plane down near Lake Van, Turkey.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 147](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147) (editorial note: Goodpaster''s memorandum of Apr. 25, one more flight allowed, before May 1; the statements of May 3–9); the NASA statement, [[w.department-of-state-bulletin]], [May 23, 1960, 817](https://archive.org/details/departmentofstat4260unit/page/817/mode/1up). [[w.eisenhower-white-house-years]], 543–559; [[w.watson-into-the-missile-age]], 720 (from Peshawar, down "deep inside the Soviet Union"; NASA''s statement of May 3); [[w.fursenko-khrushchevs-cold-war]], 263–66 (near Sverdlovsk; Powers down by parachute at Povarnia, about 11 a.m.; a second S-75 salvo brings down a pursuing MiG-19, its pilot killed). Made public: Khrushchev to the Supreme Soviet, May 5 (the plane) and May 7 (the pilot alive). [[w.bissell-reflections-of-a-cold]], 126–29 (from Peshawar for Bodø; shot down; Powers out alive; by Bissell''s account). To check: [[w.beschloss-mayday]]; [[w.wise-u-2-affair]]; [[w.powers-operation-overflight]]; [[w.pedlow-cia-and-the-u]]; [[w.ambrose-eisenhower]]; [[w.divine-eisenhower-and-the-cold]]; [[w.hitchcock-age-of-eisenhower]]; [[w.kistiakowsky-scientist-at-the-white]]; [[w.bohlen-witness-to-history-1929]]; [[w.macmillan-pointing-the-way-1959]]; [[w.taubman-khrushchev]]. Names: Powers.'
    src:
      c: d9dc6ede
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147: all'
        - 'https://archive.org/details/departmentofstat4260unit/page/817/mode/1up: D'
        - 'w.eisenhower-white-house-years 543–559: all'
        - 'w.watson-into-the-missile-age 720: A-D'
        - 'via w.watson-into-the-missile-age 720 n.166: D'
        - 'w.bissell-reflections-of-a-cold 126–29: A-C'
        - 'via w.bissell-reflections-of-a-cold 126 n.37a: A'
        - 'w.fursenko-khrushchevs-cold-war 263–66: A-C'
        - 'via w.fursenko-khrushchevs-cold-war 263 n.1: C'
    tags: [name:powers-francis-gary, name:eisenhower-dwight-d, name:goodpaster-andrew-j, name:bissell-richard-m-jr]
    short: the U-2 and the Paris summit
  - id: cal.1960-05-01.soviet-union-u2
    when: May 1
    date: '1960-05-01'
    thread: soviet-union-u2
    follows:
      - cal.1960-05-01.soviet-union
    c: 'At Bodø, Beerli waits five hours past Powers''s time, then flies to Oslo, the code call unmade. In Washington the project''s duty officer calls King, Bissell''s assistant: "Bill Bailey didn''t come home." Bissell, visiting Rostow, flies back to the project office. By Bissell''s account, after King''s.'
    n: '[[w.bissell-reflections-of-a-cold]], 126–28; [[w.fursenko-khrushchevs-cold-war]], 266–67 ("Bill Bailey didn''t come home"; Eisenhower told at Camp David that afternoon). After the shootdown: [[w.bissell-reflections-of-a-cold]], 126–28. To check: Robert King, interview by Jonathan E. Lewis, May 27, 1992 (cited by [[w.bissell-reflections-of-a-cold]], 128 n.42). See [[cal.1960-05-01.soviet-union]]. Names: Bissell, Rostow.'
    src:
      c: f2531472
      rows:
        - 'w.bissell-reflections-of-a-cold 126–28: all'
        - 'via w.bissell-reflections-of-a-cold 128 n.42a: B-C'
        - 'w.fursenko-khrushchevs-cold-war 266–67: A'
    tags: [name:beerli-stanley-w, name:bissell-richard-m-jr, name:rostow-walt-w]
  - id: cal.1960-05-01.elections-1960
    when: May 1
    date: '1960-05-01'
    thread: elections-1960-rockefeller
    also: [republican-party]
    c: Nixon lets the press know that Rockefeller is his choice for Vice President. Rockefeller turns it down in public.
    n: '[[w.white-making-of-the-president]], 181; [[w.smith-on-his-own-terms]], 336–37 (May 1, off the record to Washington reporters; three days later in public, "tremendous support"; Rockefeller: "Did he say what place?"). See [[cal.1960-01-09.elections-1960]]. Names: Nixon, Rockefeller. Check: the day, against the papers of May 2.'
    src:
