    c: 'Hangzhou, the Nanping pool, evening.{1} Mao receives Kim Il Sung;{2} Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng, Chen Boda, Wang Jiaxiang and others present.{3} Korea and Albania with China; the seventeen parties'' meeting at Rome and the Warsaw meeting revisionist and aimed at China;{4} Kim: Khrushchev told him in 1955 not to oppose America.{5} The U-2 forced Khrushchev to Paris to expose, not to meet. Twenty years of peace good; but two hands; atomic bombs for all.{6}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, May 21, 1960; [[w.zhou-enlai-nianpu-1949]], II, 320, May 21, 1960 (Zhou with Mao at the reception of Kim Il Sung); [[w.lengxi-shinian-lunzhan-1956-1966]], 269–270 (Mao receives Kim Il Sung at Hangzhou on the 21st, who came to exchange views after the summit''s collapse; the first exchange of the two parties'' views on the CPSU after the 20th Congress); [[w.yang-shangkun-riji]], I, 510 (May 21, 1960; Mao''s party at Hangzhou at 6:15 p.m., straight to the swimming place; Kim Il Sung, Liu, Zhou, Deng there; talks from about 7 to midnight); [[w.deng-xiaoping-nianpu-1904]], III, 1551 (May 21, 1960; evening; Deng, with Liu Shaoqi, Zhou and others, at Mao''s talks with Kim on the world after the summit''s failure); [[w.mao-zedong-zhuan]], V, ch. 66 n.32 (May 21 at the Nanping pool 南屏游泳池, Hangzhou: Mao and Kim Il Sung after the summit''s collapse; Mao on Khrushchev''s remarks of Oct. 3 and the U-2 downed May 1, the President''s admission of May 2 leaving him no way back). [[w.yang-jisheng-mubei]], II, 1150 (in the second half of May Mao in talk with Kim Il Sung says outright that the Chinese party does not approve of peaceful coexistence and peaceful transition, charges the Soviet and East European parties with dropping the class view, names Khrushchev, criticizes the "spirit of Camp David" and says accounts will be settled later; the book does not say where, and gives no day); [[w.yang-jisheng-tiandi-fanfu]], I, 95–96 (Mao tells Kim Il Sung the Chinese party is against peaceful coexistence and peaceful transition). Made public: 1997. To check: Record of Mao Zedong''s 毛泽东 talk with Kim Il Sung 金日成, May 21, 1960 (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.32). Names: Mao Zedong, Kim Il Sung, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Ke Qingshi, Lu Dingyi, Chen Boda, Kang Sheng, Wang Jiaxiang, Yang Shangkun, Jiang Hua, Khrushchev.'
