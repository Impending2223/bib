    c: 'Hangzhou, the Nanping pool.{1} Mao''s meeting: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Ke Qingshi, Lu Dingyi, Chen Boda, Kang Sheng, Wang Jiaxiang, Yang Shangkun, Jiang Hua.{2} After the summit''s break: imperialism unchanged; Khrushchev "twelve changes in an hour," pushed by America;{3} the fight with the CPSU by articles, "pointing at the mulberry to curse the locust," and no break.{4} The enlarged Politburo at Shanghai June 8 (the three-year plan, the world), the Eighth Congress''s third session in late June.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, May 22, 1960; [[w.zhou-enlai-nianpu-1949]], II, 320–21, May 22, 1960 (Zhou at the enlarged Standing Committee meeting); [[w.lengxi-shinian-lunzhan-1956-1966]], 270 (the Standing Committee at Hangzhou; Liu from Wuhan, Zhou and Deng from Peking with Kim, Chen Yun attending; Wu not there; on the summit''s collapse and Khrushchev); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 486 (May 21–22, 1960; Liu attends the Politburo Standing Committee''s meeting at Hangzhou, chiefly on the international situation and Sino-Soviet relations); [[w.yang-shangkun-riji]], I, 511 (May 22, 1960; 5 to 10 p.m., at Mao''s swimming pool: the situation; the Party and government delegation to the Soviet Union; an enlarged Politburo on June 8; the Eighth Congress''s third session on June 25 (never held, by the editors'' note)); [[w.deng-xiaoping-nianpu-1904]], III, 1551 (May 22, 1960; afternoon into the evening; Deng at Mao''s meeting at Hangzhou: the world after the summit''s failure, the proposed talks of the two parties, Khrushchev. Mao: imperialism''s nature unchanged; the struggle with the CPSU in articles, no break yet; Khrushchev "has two hands." Decided: an enlarged Politburo at Shanghai in early June; the Eighth Congress''s third session in late June (footnote 1: it was never held); the fourth volume of the *Selected Works*); [[w.mao-zedong-zhuan]], V, ch. 65 n.28 (the Hangzhou meeting of May 22: Mao on the fourth volume of his Selected Works, "tit for tat, every inch of ground" in the civil war years). [[w.mao-zedong-zhuan]], V, ch. 66 n.33 (May 22, afternoon at Hangzhou: Mao holds the enlarged meeting of the Standing Committee on the situation after the summit, Sino-Soviet relations and Khrushchev; imperialism''s nature unchanged, war possible in time; the record of his speech is dated May 25 in the notes). Made public: 1996. Check: the *Mao zedong zhuan* puts the meeting May 22, afternoon, in its text, and dates the record of Mao''s speech May 25, 1960 (V, ch. 66 n.33). To check: Mao Zedong 毛泽东, speech at the Hangzhou meeting 杭州会议, May 22, 1960 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 65 n.28); Mao Zedong 毛泽东, speech at the enlarged meeting of the Politburo Standing Committee 中共中央政治局常委扩大会议, May 25, 1960 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.33). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Ke Qingshi, Lu Dingyi, Chen Boda, Kang Sheng, Wang Jiaxiang, Yang Shangkun, Jiang Hua, Khrushchev.'
