  - id: cal.1960-05-14.elections-1960-nomination
    when: May 14
    date: '1960-05-14'
    place: maryland
    thread: elections-1960-nomination
    c: 'Kennedy, by telephone from a lunch on the road in Maryland, to Schlesinger: Stevenson, if still a candidate, "can get somewhere only over my dead body," so he might as well help Kennedy. Kennedy needs 80 to 100 votes, which Stevenson could give him in California and Pennsylvania and help with in Colorado and Minnesota: "He is the essential ingredient in my combination." From West Virginia: "it''s absolutely fatal to have southern support. I want to be nominated by the liberals."'
    n: '[[w.schlesinger-journals]], 66–67. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Stevenson.'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:stevenson-adlai-e, state:md]
