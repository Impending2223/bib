    c: 'Rockefeller''s statement on the summit''s collapse, the first of those on "national issues of serious moment" he promised in December: "The people need to know what went wrong, where we are, and where we are going." The illusions and the procedures that led to the summit in question; the "purpose and prudence" of the American handling of the flight too. Neither "fatal debacle" nor "shining victory."'
