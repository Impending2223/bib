    c: 'The National Security Council, after the summit. Dulles, on probable Soviet policy, based largely on Khrushchev''s speech in Berlin: somewhat reassuring. The members agree that the United States should not take the initiative to reopen discussions with the Soviet Union, but should keep to the test ban negotiations and the Ten Nation Conference. Herter: visible actions to raise military readiness might help. Gates agrees, though the defense posture had not been predicated on significant Soviet concessions at the summit.'
