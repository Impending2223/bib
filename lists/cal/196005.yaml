  - id: cal.1960-05-15.soviet-union
    when: May 15–17
    date: '1960-05-15'
    place: paris
    thread: soviet-union-u2
    c: 'Paris. Khrushchev to de Gaulle and Macmillan, May 15: no summit unless the United States condemns the flights, ends them, and punishes those responsible. That night, on Gates''s order, a test alert of American forces worldwide. May 16, the Élysée: Khrushchev reads his demands and withdraws Eisenhower''s invitation to the Soviet Union; Eisenhower: the flights suspended, not to be resumed. May 17: Khrushchev absent; the conference does not meet.'
    n: 'Statement by the President Concerning the Position Taken by Chairman Khrushchev, [1960–61 Pub. Papers 427](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=479) (May 16, 1960); Joint Statement With President de Gaulle and Prime Minister Macmillan, [1960–61 Pub. Papers 429](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=481) (May 17, 1960). FRUS 1958–60, IX, docs. [163](https://history.state.gov/historicaldocuments/frus1958-60v09/d163), [168](https://history.state.gov/historicaldocuments/frus1958-60v09/d168) (the meeting of May 16), [178](https://history.state.gov/historicaldocuments/frus1958-60v09/d178); X, pt. 1, [doc. 153](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d153) (NSC, May 24: the "military test alert"). [[w.fursenko-khrushchevs-cold-war]], 283–84 (May 15: the six-page declaration to de Gaulle; de Gaulle: all nations spy; then Macmillan); [[w.fursenko-khrushchevs-cold-war]], 284–85 (May 16: forty-five minutes from his text; the flights not to resume; Open Skies by UN aircraft); [[w.fursenko-khrushchevs-cold-war]], 287–88 (May 17: no reply to the invitation for 3 p.m.); [[w.dobrynin-in-confidence]], 41 (May 16: Khrushchev first; the flights "would not be renewed"; by Dobrynin''s account, the delegation''s counselor); [[w.dobrynin-in-confidence]], 42–43 (May 17: the Soviets absent, not told whether the meeting was the opening; Hagerty: the conference closed; the Soviet statement in reply); [[w.white-making-of-the-president]], 117 (Eisenhower flies to Paris for a summit that "immediately collapsed"; afterwards Khrushchev denounces him as a "hypocrite" and a "liar"; not the days or the demands); [[w.watson-into-the-missile-age]], 722 (Paris, May 15: Khrushchev, meeting de Gaulle, "demanded that Eisenhower denounce the U-2 flights as a provocation, promise not to continue them, and punish those responsible"; Macmillan not named. That evening Gates, with Herter''s concurrence and the president''s approval, "a limited alert of U.S. forces," a test of long-distance military communications; not "worldwide"); [[w.watson-into-the-missile-age]], 723 (May 16, the four leaders met: Khrushchev "withdrew his invitation for the president to visit the Soviet Union"; Eisenhower "pointed out that he had already ordered the overflights stopped"; not the Élysée, the reading of the demands or "not to be resumed"); [[w.watson-into-the-missile-age]], 723 (May 17: the three Western leaders "convened," but Khrushchev "declined to join them until he received an apology," which "effectively ended the meeting"); [[w.watson-into-the-missile-age]], 722–23 (the evening of May 15: Gates, concluding the meeting about to collapse, "deemed it prudent to declare a limited alert" of U.S. forces, with Herter''s concurrence and the President''s approval; the JCS relayed the order; some commands recalled off-duty personnel and the alert became public; not the hour). See [[cal.1960-05-01.soviet-union]]. Names: Khrushchev, de Gaulle, Macmillan, Eisenhower, Gates.'
