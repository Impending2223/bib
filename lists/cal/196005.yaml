    when: May 28
    date: '1960-05-28'
    thread: governors
    also: [elections-1960]
    c: 'North Carolina, Democratic primary for governor: Sanford, a former State senator, over Lake, a law professor, for keeping the schools segregated, 269,463 to 181,692, 41.3 percent; Seawell 101,148, 15.5 percent; Larkins 100,757, 15.4 percent. A runoff.'
    n: 'Votes: [N.C. *Manual*, 1961, p. 242](https://archive.org/details/northcarolinaman1961nort/page/n255). To check: [[w.drescher-triumph-of-good-will]]; [[w.covington-terry-sanford]]; [[w.black-southern-governors-and-civil]]. Names: Sanford, Lake, Seawell, Larkins.'
    tags: [state:nc, name:sanford-terry, name:lake-i-beverly, name:seawell-malcolm-b, name:larkins-john-d-jr]
