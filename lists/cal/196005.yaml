list: cal
section: VI
entries:
  - id: cal.1960-05-01.soviet-union
    when: May 1–3
    date: '1960-05-01'
    thread: soviet-union-u2
    c: 'Powers''s U-2, out of Peshawar for Bodø, Norway, shot down near Sverdlovsk, 1,200 miles inside the Soviet Union. Powers parachutes; taken alive. May 3: NASA''s cover story, a weather plane down near Lake Van, Turkey.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 147](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147) (editorial note: Goodpaster''s memorandum of Apr. 25, one more flight allowed, before May 1; the statements of May 3–9); the NASA statement, [[w.department-of-state-bulletin]], [May 23, 1960, 817](https://archive.org/details/departmentofstat4260unit/page/817/mode/1up). [[w.eisenhower-white-house-years]], 543–559; [[w.watson-into-the-missile-age]], 720. Made public: Khrushchev to the Supreme Soviet, May 5 (the plane) and May 7 (the pilot alive). To check: [[w.beschloss-mayday]]; [[w.wise-u-2-affair]]; [[w.powers-operation-overflight]]; [[w.pedlow-cia-and-the-u]]; [[w.bissell-reflections-of-a-cold]]; [[w.ambrose-eisenhower]]; [[w.divine-eisenhower-and-the-cold]]; [[w.hitchcock-age-of-eisenhower]]; [[w.kistiakowsky-scientist-at-the-white]]; [[w.bohlen-witness-to-history-1929]]; [[w.macmillan-pointing-the-way-1959]]; [[w.taubman-khrushchev]]; [[w.fursenko-khrushchevs-cold-war]]. Names: Powers.'
    tags: [name:powers-francis-gary, name:eisenhower-dwight-d, name:goodpaster-andrew-j, name:bissell-richard-m-jr]
  - id: cal.1960-05-02.crime-and-hijacking-ca
    when: May 2
    date: '1960-05-02'
    thread: crime-and-hijacking-chessman
    also: [states-and-cities]
    c: Chessman executed in the gas chamber at San Quentin, his appeals refused.
    n: 'See [[cal.1960-02-19.crime-and-hijacking-ca]]. Names: Chessman.'
    tags: [state:ca, name:chessman-caryl]
  - id: cal.1960-05-03.elections-1960
    when: May 3
    date: '1960-05-03'
    thread: elections-1960
    c: 'Primaries in the District of Columbia, Indiana and Ohio. Republican: unpledged delegates in the District; Nixon in Indiana and Ohio. Democratic: Humphrey in the District; Kennedy in Indiana; DiSalle in Ohio.'
    n: 'CQ Guide 6th (2010) 404. See [[cal.1960-03-08.elections-1960]]. Names: Humphrey, Kennedy, Nixon, DiSalle.'
    tags: [primary:1960-05-03, name:humphrey-hubert-h, name:kennedy-john-f, name:nixon-richard-m, name:disalle-michael-v]
  - id: cal.1960-05-03.program
    when: May 3
    date: '1960-05-03'
    thread: program
    c: Special message on the legislative program, two months left in the session. Mutual security; wheat; sugar, with authority to adjust quotas; the 4¼ percent ceiling on bonds lifted; a gasoline tax for the highways; immigration; school construction by debt service; medical care for the aged without compulsion; a moderate rise in the minimum wage; a balanced budget.
    n: 'Special Message to the Congress on the Legislative Program, [1960–61 Pub. Papers 385](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=437) (May 3, 1960). To check: [[w.morgan-eisenhower-versus-the-spenders]]; [[w.sundquist-politics-and-policy]]; [[w.pach-presidency-of-dwight-d]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-05-03.alabama-al
    when: May 3
    date: '1960-05-03'
    thread: alabama
    also: [elections-1960, electoral-college]
    c: 'Alabama''s Democratic primary for presidential electors, eleven places, the electors to go on the November ballot as the party''s: a slate of unpledged electors against a slate loyal to the national ticket. One place filled outright, by an unpledged elector, 166,119 votes; the next, unpledged, 153,865; the first of the loyalists third, 150,550. Runoff for the other ten places May 31.'
    n: '[*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), 637](https://archive.org/details/alabama-official-statistical-register-1963/page/n636). To check: [[w.bartley-southern-politics-and-the]]; [[w.white-making-of-the-president]]. See [[cal.1960-11-08.elections-1960]].'
    tags: [state:al, ok:result-form]
  - id: cal.1960-05-03.governors-fl
    when: May 3
    date: '1960-05-03'
    thread: governors
    also: [elections-1960]
    c: Florida's Democratic primary for governor. Bryant, a former State representative, over Carlton, a State senator, 193,507 to 186,228, 20.7 percent; Burns, mayor of Jacksonville, 166,352, 17.8 percent; seven others. Runoff between Bryant and Carlton.
    n: '[Fla. Secretary of State, *Tabulation of Official Vote, Florida Primary Elections*, May 3 and May 24, 1960, 5](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1960/page/n4); the figures as [Wikipedia](https://en.wikipedia.org/wiki/1960_Florida_gubernatorial_election) gives them. To check: [[w.colburn-floridas-gubernatorial-politics-in]]; [[w.bartley-southern-elections]]; [[w.black-southern-governors-and-civil]]. Names: Bryant, W. Haydon Burns, Carlton.'
    tags: [name:bryant-farris, name:carlton-doyle-e-jr, name:burns-w-haydon, state:fl]
  - id: cal.1960-05-03.european-community
    when: May 3
    date: '1960-05-03'
    thread: european-community
    c: 'The Stockholm Convention in force: the European Free Trade Association of Britain, Sweden, Norway, Denmark, Austria, Switzerland and Portugal.'
    n: 'To check: [[w.camps-britain-and-the-european]]; [[w.milward-uk-and-the-european]]. See [[cal.1960-01-12.european-community]].'
  - id: cal.1960-05-05.soviet-union
    when: May 5–7
    date: '1960-05-05'
    thread: soviet-union-u2
    c: 'Khrushchev to the Supreme Soviet: an American spy plane shot down deep inside the country. NASA and State keep to the weather plane. May 7: Khrushchev says the pilot is alive, shows the film, names Peshawar and Bodø. State concedes an intelligence flight, "probably," with "no authorization" from Washington.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 147](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147); the statements of May 5 and 7, [[w.department-of-state-bulletin]], [May 23, 1960, 817–819](https://archive.org/details/departmentofstat4260unit/page/817/mode/1up); Khrushchev''s speeches, *Current Digest of the Soviet Press*, June 1 and June 8, 1960. [[w.watson-into-the-missile-age]], 720–721. See [[cal.1960-05-01.soviet-union]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1960-05-05.vietnam-congress
    when: May 5
    date: '1960-05-05'
    thread: vietnam-congress
    c: 'Mansfield writes Williams and Herter: a UPI despatch of the day has the MAAG doubled for the worsening security in Vietnam; why, and who decided. Fulbright writes them too.'
    n: '[FRUS 1958–60, I, doc. 154](https://history.state.gov/historicaldocuments/frus1958-60v01/d154) (editorial note: Mansfield''s letters). [[w.gibbons-u-s-government-and]], I, 338–39 (Mansfield''s and Fulbright''s letters, National Archives, RG 46). Made public: Mansfield''s letter, [[w.def-u-s-viet-rels]], Book 10, 1276–78 (1971). See [[cal.1960-03-17.vietnam]]; [[cal.1960-02-26.vietnam-congress]]. Names: Mansfield, Williams, Herter, Fulbright.'
    tags: [name:mansfield-mike, name:williams-samuel-t, name:herter-christian-a, name:fulbright-j-william]
  - id: cal.1960-05-06.voting-rights
    when: May 6
    date: '1960-05-06'
    thread: voting-rights
    c: Civil Rights Act of 1960 signed, [74 Stat. 86](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg86.pdf). Federal referees to register Negro voters where a court finds a pattern of discrimination; voting records kept two years; obstructing a court order by force a crime; the FBI to investigate bombings of schools and churches.
    n: 'Statement by the President Upon Signing the Civil Rights Act of 1960, [1960–61 Pub. Papers 398](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=450) (May 6, 1960). See [[cal.1960-02-15.voting-rights]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-05-07.governors-tx
    when: May 7
    date: '1960-05-07'
    thread: governors
    also: [elections-1960]
    c: Texas Democratic primary. Governor Daniel renominated for a third term over Jack Cox, a former State representative, 908,992 to 619,834, 59.5 percent.
    n: '[Wikipedia, "1960 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1960_Texas_gubernatorial_election), from the *Texas Almanac*; Check: the State Democratic Executive Committee''s canvass (Texas State Library and Archives). To check: [[w.knaggs-two-party-texas]]; [[w.davidson-race-and-class-in]]; [[w.cunningham-cowboy-conservatism]]. Names: Daniel, Cox.'
    tags: [state:tx, name:daniel-price, name:cox-jack]
  - id: cal.1960-05-09.soviet-union
    when: May 9–11
    date: '1960-05-09'
    thread: soviet-union-u2
    c: 'Herter''s statement: the President''s directives, since the start of his administration, authorize gathering such information; specific missions not subject to his authorization. Herter and Dulles brief congressional leaders. May 11, the news conference: Eisenhower takes the program as his. Espionage "a distasteful but vital necessity."'
    n: '[FRUS 1958–60, X, pt. 1, doc. 149](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d149) (NSC, May 9). The President''s News Conference, [1960–61 Pub. Papers 403](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=455) (May 11, 1960). See [[cal.1960-05-01.soviet-union]]. Names: Herter, Eisenhower, Dulles.'
    tags: [name:herter-christian-a, name:dulles-allen-w, name:eisenhower-dwight-d]
  - id: cal.1960-05-10.elections-1960
    when: May 10
    date: '1960-05-10'
    thread: elections-1960
    c: 'Primaries in Nebraska and West Virginia. Republican: Nixon in Nebraska; unpledged delegates in West Virginia. Democratic: Kennedy in Nebraska and West Virginia.'
    n: 'Neb. *Official Report of the Board of State Canvassers*, Primary Election, May 10, 1960, pp. [3](https://govdocs.nebraska.gov/epubs/S1200/S001-1960prim_gen.pdf#page=4), [24](https://govdocs.nebraska.gov/epubs/S1200/S001-1960prim_gen.pdf#page=25); W. Va. *Blue Book*, 1960, pp. [723](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1960.pdf#page=732), [747](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1960.pdf#page=756). CQ Guide 6th (2010) 404–405. See [[cal.1960-03-08.elections-1960]]. Names: Kennedy, Nixon.'
    tags: [primary:1960-05-10, name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1960-05-10.elections-1960-2
    when: May 10
    date: '1960-05-10'
    thread: elections-1960
    c: Humphrey, beaten by Kennedy in West Virginia, withdraws that night, at Charleston.
    n: 'To check: [[w.white-making-of-the-president]]; [[w.fleming-kennedy-vs-humphrey-west]]; [[w.humphrey-education-of-a-public-1976]]; [[w.solberg-hubert-humphrey]]; [[w.obrien-no-final-victories]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.rorabaugh-real-making-of-the]]. Names: Humphrey, Kennedy.'
    tags: [name:humphrey-hubert-h, name:kennedy-john-f]
  - id: cal.1960-05-10.sit-ins
    when: May 10
    date: '1960-05-10'
    thread: sit-ins
    c: Nashville. Six downtown stores serve Negroes at their lunch counters, by agreement with the merchants. Three months of sit-ins; the bombing of Looby's house, Apr. 19, and the march on City Hall.
    n: 'See [[cal.1960-02-01.sit-ins]]. Names: Looby.'
    tags: [name:looby-z-alexander]
  - id: cal.1960-05-10.governors-nm
    when: May 10
    date: '1960-05-10'
    thread: governors
    also: [elections-1960]
    c: 'New Mexico''s primary, for governor. Democratic: Governor Burroughs over Bursey, 66,541 to 48,841, 53.8 percent. Republican: Mechem, governor 1951–55 and 1957–59, over Robinson, 29,486 to 9,331, 76.0 percent.'
    n: 'Votes: [Wikipedia, "1960 New Mexico gubernatorial election"](https://en.wikipedia.org/wiki/1960_New_Mexico_gubernatorial_election); Check: N.M. Secretary of State, *New Mexico Election Returns, 1911–1969*. To check: [[w.peirce-mountain-states-of-america]]. Names: Burroughs, Mechem, Bursey, Paul Robinson.'
    tags: [state:nm, name:burroughs-john, name:bursey-joseph-a, name:mechem-edwin-l, name:robinson-paul-w]
  - id: cal.1960-05-10.governors-wv
    when: May 10
    date: '1960-05-10'
    thread: governors
    also: [elections-1960]
    c: 'West Virginia primaries for governor. Democratic: Barron, the attorney general, over Hulett Smith, 187,501 to 140,079, 51.0 percent; a third 39,907, 10.9 percent. Republican: Harold E. Neely over Revercomb, a former U.S. Senator, 102,618 to 83,028, 55.3 percent. Kennedy carries the presidential primary the same day.'
    n: '*West Virginia Blue Book*, 1960, [p. 732](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1960.pdf#page=741) (Barron 187,501, Smith 140,079, Orel J. Skeen 39,907), [p. 750](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1960.pdf#page=759) (Neely 102,618, Revercomb 83,028). To check: [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Barron, Smith, Neely, Revercomb, Kennedy.'
    tags: [state:wv, name:barron-w-w, name:smith-hulett-c, name:neely-harold-e, name:revercomb-chapman, name:kennedy-john-f]
  - id: cal.1960-05-10.governors-ne
    when: May 10
    date: '1960-05-10'
    thread: governors
    also: [elections-1960]
    c: 'Nebraska, governor; the governor running for the Senate. Democratic primary: Morrison over Conrad, 51,335 to 44,486, 48.0 percent; three others 11,167, 10.4 percent. Republican: Cooper over Abel, 61,286 to 39,109, 37.7 percent; Carpenter 25,659, 15.8 percent; four others 36,342, 22.4 percent.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1960*](https://govdocs.nebraska.gov/epubs/S1200/S001-1960prim_gen.pdf); Democratic figures from [Wikipedia, "1960 Nebraska gubernatorial election"](https://en.wikipedia.org/wiki/1960_Nebraska_gubernatorial_election). Republican votes: the same article''s table, from the Board''s report. To check: [[w.peirce-great-plains-states-of]]. Names: Frank Morrison, Robert Conrad, John R. Cooper, Hazel Abel, Carpenter.'
    tags: [state:ne, name:morrison-frank-b, name:conrad-robert-b, name:cooper-john-r-sr, name:abel-hazel, name:carpenter-terry]
  - id: cal.1960-05-12.students
    when: May 12–14
    date: '1960-05-12'
    thread: students
    c: 'Un-American Activities subcommittee hearings at San Francisco City Hall, Willis presiding. Students, most from Berkeley, protest. May 13: police turn fire hoses on them in the rotunda and drag them down the marble stairs; dozens arrested. A larger crowd outside the next day.'
    n: '*The Northern California District of the Communist Party: Structure—Objectives—Leadership*, Hearings before the House Committee on Un-American Activities, 86th Cong., 2d Sess., pts. [1](https://archive.org/details/northerncaliforn1192unit), [2](https://archive.org/details/northerncaliforn2199unit), [3](https://archive.org/details/northerncaliforn3208unit) (1960). Arrests: 64 or 68, by different accounts. Check. The committee''s film of the day, *Operation Abolition* (1960). To check: [[w.goodman-committee]]; [[w.rorabaugh-berkeley-at-war]]; [[w.berkeley-in-the-sixties]]. Names: Willis.'
    tags: [name:willis-edwin-e, state:ca]
  - id: cal.1960-05-12.european-community
    when: May 12
    date: '1960-05-12'
    thread: european-community
    c: 'The Council of the Six speeds the Common Market: internal duties to fall faster; the first move toward the common external tariff, the tariff lowered, brought forward to the end of 1960.'
    n: 'FRUS 1958–60, VII, pt. 1, docs. [116](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d116) (consultations on the farm policy, May 2), [119](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d119) (the Mission at the Communities, July 27: the Council''s press release, May 13). See [[cal.1960-05-03.european-community]].'
  - id: cal.1960-05-13.jobs-and-wages
    when: May 13
    date: '1960-05-13'
    thread: jobs-and-wages
    c: 'Area redevelopment veto, the second: S. 722, Douglas''s bill, $251 million in loans and grants for depressed areas, passed by the House May 4, [202–184](https://voteview.com/rollcall/RH0860123), and taken by the Senate May 6, [45–32](https://voteview.com/rollcall/RS0860313). Eisenhower: aid where the trouble is temporary; machinery financed; a new agency.'
    n: 'Veto of the Area Redevelopment Bill, [1960–61 Pub. Papers 417](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=469) (May 13, 1960); Letter to Governor Underwood of West Virginia, [1960–61 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=521) (released June 12, 1960). To check: [[w.levitan-federal-aid-to-depressed]]; [[w.sundquist-politics-and-policy]]; [[w.douglas-in-the-fullness-of]]; [[w.morgan-eisenhower-versus-the-spenders]]. Names: Douglas, Eisenhower.'
    tags: [name:douglas-paul-h, name:eisenhower-dwight-d]
  - id: cal.1960-05-14.foreign-aid
    when: May 14
    date: '1960-05-14'
    thread: foreign-aid
    c: Mutual Security Act of 1960 signed, [74 Stat. 134](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg134.pdf). The authorization nearly all the President asked.
    n: 'Statement by the President Upon Signing the Mutual Security Act of 1960, [1960–61 Pub. Papers 421](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=473) (released May 16, 1960). To check: [[w.kaufman-trade-and-aid]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-05-15.soviet-union
    when: May 15–17
    date: '1960-05-15'
    thread: soviet-union-u2
    c: 'Paris. Khrushchev to de Gaulle and Macmillan, May 15: no summit unless the United States condemns the flights, ends them, and punishes those responsible. That night, on Gates''s order, a test alert of American forces worldwide. May 16, the Élysée: Khrushchev reads his demands and withdraws Eisenhower''s invitation to the Soviet Union; Eisenhower: the flights suspended, not to be resumed. May 17: Khrushchev absent; the conference does not meet.'
    n: 'Statement by the President Concerning the Position Taken by Chairman Khrushchev, [1960–61 Pub. Papers 427](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=479) (May 16, 1960); Joint Statement With President de Gaulle and Prime Minister Macmillan, [1960–61 Pub. Papers 429](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=481) (May 17, 1960). FRUS 1958–60, IX, docs. [163](https://history.state.gov/historicaldocuments/frus1958-60v09/d163), [168](https://history.state.gov/historicaldocuments/frus1958-60v09/d168) (the meeting of May 16), [178](https://history.state.gov/historicaldocuments/frus1958-60v09/d178); X, pt. 1, [doc. 153](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d153) (NSC, May 24: the "military test alert"). See [[cal.1960-05-01.soviet-union]]. Names: Khrushchev, de Gaulle, Macmillan, Eisenhower, Gates.'
    tags: [name:khrushchev-nikita-s, name:de-gaulle-charles, name:macmillan-harold, name:gates-thomas-s-jr, name:eisenhower-dwight-d]
  - id: cal.1960-05-17.elections-1960
    when: May 17
    date: '1960-05-17'
    thread: elections-1960
    c: 'Maryland primary. Republican: no primary. Democratic: Kennedy over Morse, 201,769 to 49,420, 70.3 percent.'
    n: '*Maryland Manual*, 1961–62, [p. 410](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000169/html/am169--410.html). CQ Guide 6th (2010) 405. See [[cal.1960-03-08.elections-1960]]. Names: Kennedy, Morse.'
    tags: [primary:1960-05-17, name:kennedy-john-f, name:morse-wayne]
  - id: cal.1960-05-17.cuba
    when: May 17
    date: '1960-05-17'
    thread: cuba-bay-of-pigs
    c: 'Radio Swan ready to broadcast, from Swan Island: the CIA''s station, medium and short wave, under commercial cover.'
    n: '[FRUS 1961–63, X, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 4 (the Taylor Board''s Memorandum No. 1, June 13, 1961); X–XII, microfiche supp., doc. [232](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d232) (the briefing papers of Nov. 18, 1960). Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). See [[cal.1960-03-17.cuba]].'
  - id: cal.1960-05-19.japan-and-korea
    when: May 19–20
    date: '1960-05-19'
    thread: japan-and-korea-treaty
    c: Tokyo. The Socialists hold the Speaker in his office six hours; police called in. After midnight Kishi's Liberal Democrats extend the session and pass the treaty in the lower house, the opposition absent. The demonstrations against Kishi grow.
    n: '[FRUS 1958–60, XVIII, doc. 155](https://history.state.gov/historicaldocuments/frus1958-60v18/d155) (MacArthur, May 20). See [[cal.1960-01-19.japan-and-korea]]. Names: Kishi.'
    tags: [name:kishi-nobusuke]
  - id: cal.1960-05-20.elections-1960
    when: May 20
    date: '1960-05-20'
    thread: elections-1960
    c: 'Oregon primary. Republican: Nixon over Rockefeller (write-in), 211,276 to 9,307, 93.1 percent. Democratic: Kennedy over Morse, 146,332 to 91,715, 51.0 percent.'
    n: 'Or. *Official Abstract of Votes*, Primary Nominating Election, May 20, 1960, pp. [14](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411021/File/document#page=17), [15](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411021/File/document#page=18). CQ Guide 6th (2010) 405. See [[cal.1960-03-08.elections-1960]]. Names: Kennedy, Rockefeller, Nixon, Morse.'
    tags: [primary:1960-05-20, name:kennedy-john-f, name:rockefeller-nelson, name:nixon-richard-m, name:morse-wayne]
  - id: cal.1960-05-20.soviet-union-u2
    when: May 20
    date: '1960-05-20'
    thread: soviet-union-u2
    also: [berlin-and-vienna]
    c: 'Khrushchev in East Berlin: the German treaty put off until a new summit.'
    n: 'FRUS 1958–60, IX, doc. [192](https://history.state.gov/historicaldocuments/frus1958-60v09/d192). See [[cal.1960-05-01.soviet-union]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1960-05-20.vietnam-congress
    when: May 20
    date: '1960-05-20'
    thread: vietnam-congress
    c: 'Williams to Mansfield: the MAAG not doubled. The 350 men of TERM, since 1956 a cover for logistical advisers, go into a MAAG of 685, which the ICC approved Apr. 19; the change "ends subterfuge." The MAAG to "work itself out of a job," some 15 percent fewer in mid-1961, 20 percent a year after. Herter''s reply, May 10, much the same.'
    n: 'FRUS 1958–60, I, docs. [154](https://history.state.gov/historicaldocuments/frus1958-60v01/d154) (the interim reply by wire; Herter''s), [166](https://history.state.gov/historicaldocuments/frus1958-60v01/d166) (the letter). Made public: [[w.def-u-s-viet-rels]], Book 10, 1279–80 (1971). [[w.gibbons-u-s-government-and]], I, 338–39. See [[cal.1960-05-05.vietnam-congress]]. Names: Williams, Mansfield, Herter.'
    tags: [name:williams-samuel-t, name:mansfield-mike, name:herter-christian-a]
  - id: cal.1960-05-23.soviet-union
    when: May 23–26
    date: '1960-05-23'
    thread: soviet-union-u2
    c: Security Council on the Soviet complaint against the flights, Gromyko for the Soviet Union. Lodge shows the carved Great Seal taken from the ambassador's residence in Moscow, a listening device inside. May 26, the Soviet resolution rejected, 7–2, Ceylon and Tunisia abstaining.
    n: 'U.N. Security Council, *Official Records*, 15th year, [857th](https://documents.un.org/doc/undoc/gen/n60/227/61/pdf/n6022761.pdf)–[860th](https://documents.un.org/doc/undoc/gen/n60/228/81/pdf/n6022881.pdf) meetings. See [[cal.1960-05-01.soviet-union]]. Names: Gromyko, Lodge.'
    tags: [name:gromyko-andrei, name:lodge-henry-cabot]
  - id: cal.1960-05-24.elections-1960
    when: May 24
    date: '1960-05-24'
    thread: elections-1960
    c: 'Florida primary. Republican: Nixon, unopposed. Democratic: Smathers, unopposed.'
    n: 'Fla. *Tabulation of Official Vote, Florida Primary Elections*, 1960, pp. [15](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1960/page/n14), [18](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1960/page/n17). CQ Guide 6th (2010) 405. See [[cal.1960-03-08.elections-1960]]. Names: Smathers, Nixon.'
    tags: [primary:1960-05-24, name:smathers-george-a, name:nixon-richard-m]
  - id: cal.1960-05-24.jobs-and-wages
    when: May 24
    date: '1960-05-24'
    thread: jobs-and-wages
    c: The Senate fails to override the area redevelopment veto, [45–39](https://voteview.com/rollcall/RS0860318).
    n: S. 722, 86th Cong. See [[cal.1960-05-13.jobs-and-wages]].
  - id: cal.1960-05-24.governors-fl
    when: May 24
    date: '1960-05-24'
    thread: governors
    also: [elections-1960]
    c: 'Florida''s Democratic runoff for governor: Bryant over Carlton, 512,757 to 416,052, 55.2 percent.'
    n: '[Fla. *Tabulation of Official Vote, Florida Primary Elections*, 1960, 13](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1960/page/n12). Votes: [Wikipedia, "1960 Florida gubernatorial election"](https://en.wikipedia.org/wiki/1960_Florida_gubernatorial_election). See [[cal.1960-05-03.governors-fl]]. Names: Bryant, Carlton.'
    tags: [name:bryant-farris, name:carlton-doyle-e-jr, state:fl]
  - id: cal.1960-05-25.soviet-union
    when: May 25
    date: '1960-05-25'
    thread: soviet-union-u2
    c: Eisenhower's report on Paris, radio and television. The flights stopped the week before the summit, not to be resumed. Aerial surveillance by the United Nations proposed, American planes offered.
    n: 'Radio and Television Report to the American People on the Events in Paris, [1960–61 Pub. Papers 437](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=489) (May 25, 1960). [FRUS 1958–60, IX, doc. 194](https://history.state.gov/historicaldocuments/frus1958-60v09/d194) (Cabinet, May 26). See [[cal.1960-05-01.soviet-union]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-05-26.school-aid
    when: May 26
    date: '1960-05-26'
    thread: school-aid
    c: 'House passes the school construction bill, H.R. 10128, [206–189](https://voteview.com/rollcall/RH0860140): grants, $325 million a year for four years. Powell''s amendment, aid only to schools open to all races, adopted, [218–181](https://voteview.com/rollcall/RH0860136).'
    n: 'See [[cal.1960-02-04.school-aid]]. Names: Powell.'
    tags: [name:powell-adam-clayton-jr]
  - id: cal.1960-05-27.soviet-union
    when: May 27–June 2
    date: '1960-05-27'
    thread: soviet-union-u2
    c: 'Foreign Relations Committee, in executive session, on the U-2 and the summit, Fulbright presiding: Herter, Dulles, Dryden of NASA, Dillon, Bohlen, Gates.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 155](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d155). *Events Incident to the Summit Conference: Hearings Before the Committee on Foreign Relations*, 86th Cong. (1960), the testimony the executive thought dangerous left out; the report, S. Rep. No. 1761, 86th Cong. (1960). Made public: the full hearings, Dulles''s testimony of May 31 among them, *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XII (1982), 279–359. See [[cal.1960-05-01.soviet-union]]. Names: Fulbright, Herter, Gates, Dulles, Dryden, Dillon, Bohlen.'
    tags: [name:fulbright-j-william, name:herter-christian-a, name:dulles-allen-w, name:dryden-hugh-l, name:dillon-c-douglas, name:bohlen-charles-e, name:gates-thomas-s-jr]
  - id: cal.1960-05-27.europe-and-the-alliance
    when: May 27
    date: '1960-05-27'
    thread: europe-and-the-alliance-turkey
    also: [middle-east]
    c: Turkey. The army takes Ankara and Istanbul before dawn; the President, Menderes and his ministers arrested. A Committee of National Unity under Gen. Gursel; a cabinet of fifteen civilians and three officers.
    n: 'FRUS 1958–60, X, pt. 2, doc. [365](https://history.state.gov/historicaldocuments/frus1958-60v10p2/d365). To check: [[w.weiker-turkish-revolution-1960-1961]]; [[w.harris-troubled-alliance]]; [[w.ahmad-turkish-experiment-in-democracy]]; [[w.zurcher-turkey]]. Names: Menderes, Gursel.'
    tags: [name:menderes-adnan, name:gursel-cemal]
  - id: cal.1960-05-27.elections-1960
    when: May 27–31
    date: '1960-05-27'
    thread: elections-1960
    c: 'Johnson''s western tour, six States in five days from the Friday before Memorial Day: Des Moines, Loveless aboard the plane; Idaho Falls, to Lieutenant Governor Drevlow, "You''re damn right I am" a candidate; Spokane, Coeur d''Alene, Pierre. On the U-2: Khrushchev, not the President, should apologize. Montana dropped from the schedule.'
    n: '[[w.caro-passage-of-power]], 87–92 (the Friday "on the eve of a long Memorial Day weekend," 88). Check the dates and the stops. Names: Johnson, Loveless, Herseth, Khrushchev.'
    tags: [name:johnson-lyndon-b, name:loveless-herschel-c, name:herseth-ralph, name:khrushchev-nikita-s]
  - id: cal.1960-05-28.king
    when: May 28
    date: '1960-05-28'
    thread: king
    also: [alabama]
    c: Montgomery. An all-white jury acquits King of perjury on his Alabama income tax returns.
    n: '[Verdict, *State of Alabama v. Martin Luther King, Jr.*](https://okra.stanford.edu/link/document600528-004) (Montgomery County Circuit Court, May 28, 1960); King, [Statement on Verdict by Jury of Montgomery County](https://okra.stanford.edu/link/document600528-002) (film) (King Papers Project); the statement, from NBC''s film, printed as "Statement on Perjury Acquittal," [[w.papers-of-martin-luther]], 462 ([King Institute](https://kinginstitute.stanford.edu/king-papers/documents/statement-perjury-acquittal)). [[w.garrow-bearing-the-cross]], 136–37. To check: [[w.branch-parting-the-waters]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr]
