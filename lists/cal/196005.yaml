    when: May 31
    date: '1960-05-31'
    thread: europe-and-the-alliance-turkey
    also: [middle-east]
    c: 'The CIA to the NSC on the Turkish coup: young officers, planned for months; "no blood bath."'
    n: FRUS 1958–60, X, pt. 2, doc. [366](https://history.state.gov/historicaldocuments/frus1958-60v10p2/d366) (editorial note). See [[cal.1960-05-27.europe-and-the-alliance]].
  - id: cal.1960-05-31.alabama-al
    when: May 31
    date: '1960-05-31'
    thread: alabama
    also: [elections-1960, electoral-college]
    c: Alabama's Democratic runoff for presidential electors. Six unpledged electors nominated in all, and five loyal to the national ticket. All eleven on the November ballot as the Democratic electors; the six vote for Byrd in December, the five for Kennedy.
    n: '[*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), 647](https://archive.org/details/alabama-official-statistical-register-1963/page/n646). See [[cal.1960-05-03.alabama-al]]; [[cal.1960-12-19.elections-1960]]. Names: Byrd, Kennedy.'
