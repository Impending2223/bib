    c: 'Vnukovo. Khrushchev with Malinovsky, Gromyko and the Presidium''s members seeing them off; on the Il-18 he throws away his script: an apology from the United States the price of his part in the summit, else the delegation leaves without its proposals. The new speech written at the embassy in Paris, cabled to Moscow for approval. The demands: retraction, punishment of those "directly guilty," a pledge to end the flights; else no invitation to Eisenhower.'
