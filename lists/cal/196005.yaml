  - id: cal.1960-05-22.elections-1960-nomination
    when: May 22
    date: '1960-05-22'
    thread: elections-1960-nomination
    c: 'Kennedy, by telephone late Sunday afternoon, to Schlesinger, on his talk with Stevenson at Libertyville the day before: pleasant, but Stevenson will do nothing for the moment. Kennedy''s fear: Johnson told Stevenson on Monday that, if he stayed aloof, he would be Johnson''s second choice. Kennedy told Stevenson "Lyndon was a chronic liar; that he has been making all sorts of assurances to me for years and has lived up to none of them." Party harmony, no problem: "Everyone will come around the day after the convention; and anyone who doesn''t come around will be left out and won''t matter."'
    n: '[[w.schlesinger-journals]], 67–68. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Stevenson, Johnson.'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:stevenson-adlai-e, name:johnson-lyndon-b]
