    c: 'Paris. Khrushchev to de Gaulle and Macmillan, May 15: no summit unless the United States condemns the flights, ends them, and punishes those responsible. That night, on Gates''s order, a test alert of American forces worldwide. May 16, the Élysée: Khrushchev reads his demands and withdraws Eisenhower''s invitation to the Soviet Union; Eisenhower: the flights suspended, not to be resumed. May 17: Khrushchev absent; the conference does not meet.'
    n: 'Statement by the President Concerning the Position Taken by Chairman Khrushchev, [1960–61 Pub. Papers 427](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=479) (May 16, 1960); Joint Statement With President de Gaulle and Prime Minister Macmillan, [1960–61 Pub. Papers 429](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=481) (May 17, 1960). FRUS 1958–60, IX, docs. [163](https://history.state.gov/historicaldocuments/frus1958-60v09/d163), [168](https://history.state.gov/historicaldocuments/frus1958-60v09/d168) (the meeting of May 16), [178](https://history.state.gov/historicaldocuments/frus1958-60v09/d178); X, pt. 1, [doc. 153](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d153) (NSC, May 24: the "military test alert"). [[w.fursenko-khrushchevs-cold-war]], 283–84 (May 15: the six-page declaration to de Gaulle; de Gaulle: all nations spy; then Macmillan); [[w.fursenko-khrushchevs-cold-war]], 284–85 (May 16: forty-five minutes from his text; the flights not to resume; Open Skies by UN aircraft); [[w.fursenko-khrushchevs-cold-war]], 287–88 (May 17: no reply to the invitation for 3 p.m.); [[w.dobrynin-in-confidence]], 41 (May 16: Khrushchev first; the flights "would not be renewed"; by Dobrynin''s account, the delegation''s counselor); [[w.dobrynin-in-confidence]], 42–43 (May 17: the Soviets absent, not told whether the meeting was the opening; Hagerty: the conference closed; the Soviet statement in reply). See [[cal.1960-05-01.soviet-union]]. Names: Khrushchev, de Gaulle, Macmillan, Eisenhower, Gates.'
