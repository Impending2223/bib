        - 'w.smith-on-his-own-terms 336–37: ?'
    tags: [name:nixon-richard-m, name:rockefeller-nelson]
  - id: cal.1960-05-01.soviet-union-u2-2
    when: May 1
    date: '1960-05-01'
    time: 1960-05-01T02:00Z
    thread: soviet-union-u2
    c: 'Moscow. Malinovsky telephones Khrushchev at 5:00 a.m.: a foreign plane crossing from Afghanistan less than half an hour before; civil air traffic halted over most of the country for the pursuit. To his son: "They flew over again." On Lenin''s Tomb, at the parade, word from Marshal Biryuzov, in combat dress, that the pilot is taken. Shelepin of the KGB and Rudenko, the Procurator General, to question him at the Lubyanka.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 265–66. To check: Sergei Khrushchev, *Nikita Khrushchev and the Creation of a Superpower* (2000), 368–80 (cited by [[w.fursenko-khrushchevs-cold-war]], 265–66 nn.6–10). See [[cal.1960-05-01.soviet-union]]. Names: Malinovsky, Khrushchev, Shelepin.'
    src:
      c: f40db002
      rows:
        - 'w.fursenko-khrushchevs-cold-war 265–66: all'
    tags: [name:malinovsky-rodion-yakovlevich, name:khrushchev-nikita-s, name:shelepin-alexandr-n, name:powers-francis-gary]
