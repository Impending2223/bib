    n: '[[w.fursenko-khrushchevs-cold-war]], 268–69 (the questioning of May 3, by the Soviet record). To check: [[w.powers-operation-overflight]] (cited by [[w.fursenko-khrushchevs-cold-war]], 268 nn.15, 19–20). See [[cal.1960-05-01.soviet-union]]. Names: Shelepin, Powers.'
