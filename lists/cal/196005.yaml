    c: 'Deng Xiaoping 邓小平 presides at the Secretariat 书记处. Decided: modern revisionism and semi-revisionism to be criticized openly still; Li Fuchun''s 李富春 supplementary plan for the Second Five-Year Plan''s last three years agreed in the main. Deng: Mao asks rest with work and a slower pace, chiefly in water works; mind the layout; artificial fiber on a large scale, cotton limited; machinery exports, a machine-exporting country by the third plan; the plan already large, tightness the danger, not low targets.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1548 (May 12, 1960); [[w.peng-zhen-nianpu-1902]], IV, 26 (May 12 and 13, 1960; the 185th meeting; Peng Zhen there; open criticism of modern revisionism and semi-revisionism to go on; Li Fuchun''s main points of the 1960–62 plan agreed in the main; Peng: organs and plans grown ever larger go against "more, faster, better, more economically"; a section on location in the plan, the big works (Baotou, Shanghai steel) to have their frames). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Li Fuchun, Mao Zedong.'
