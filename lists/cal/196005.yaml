    when: May 2–3
    date: '1960-05-02'
    place: chengdu
    thread: china-leadership
    also: [china]
    c: 'Chengdu. Liu Shaoqi hears Sichuan Party committee secretaries Chen Gang, Liao Zhigao and others on their work. On timber: cut and plant together, plant more than is cut. On leaders and the masses: cadres are to take part in production and share the workers'' lives; leaders trust the masses and the masses the leaders; "worry before the world worries" (先天下之忧而忧).'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 485 (May 2–3, 1960). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
