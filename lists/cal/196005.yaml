entries:
  - id: cal.1960-05-01.soviet-union
    when: May 1–3
    date: '1960-05-01'
    time: 1960-05-01T06:00Z
    time_approx: true
    place: sverdlovsk
    thread: soviet-union-u2
    c: 'Powers''s U-2, out of Peshawar for Bodø, Norway, shot down near Sverdlovsk, 1,200 miles inside the Soviet Union.{1} Powers parachutes;{2} taken alive.{3} May 3: NASA''s cover story, a weather plane down near Lake Van, Turkey.{4} About 11 a.m. local time villagers at Povarnia, near Sverdlovsk, hear an explosion and see a parachute; they reach Powers, and he is detained. A second salvo of missiles hits a pursuing MiG-19, its pilot killed.{5}'
    n: '[FRUS 1958–60, X, pt. 1, doc. 147](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147) (editorial note: Goodpaster''s memorandum of Apr. 25, one more flight allowed, before May 1; the statements of May 3–9); the NASA statement, [[w.department-of-state-bulletin]], [May 23, 1960, 817](https://archive.org/details/departmentofstat4260unit/page/817/mode/1up). [[w.eisenhower-white-house-years]], 543–559; [[w.watson-into-the-missile-age]], 720 (from Peshawar, down "deep inside the Soviet Union"; NASA''s statement of May 3); [[w.fursenko-khrushchevs-cold-war]], 263–66 (near Sverdlovsk; Powers down by parachute at Povarnia, about 11 a.m.; a second S-75 salvo brings down a pursuing MiG-19, its pilot killed); [[w.white-making-of-the-president]], 115–16 (Powers takes off from Peshawar for Norway; shot down near Sverdlovsk that afternoon, parachuting; "the first acknowledged American spy ever seized"; not Bodø, the distance or NASA); [[w.guan-vietnamese-communists-relations-with]], 146 (the U-2 shot down May 1, near Sverdlovsk); [[w.chang-friends-and-enemies]], 215 (the plane shot down two weeks after "Long Live Leninism!" and its pilot captured; Khrushchev releases the news); [[w.fursenko-khrushchevs-cold-war]], 263–64, 266. Made public: Khrushchev to the Supreme Soviet, May 5 (the plane) and May 7 (the pilot alive). [[w.bissell-reflections-of-a-cold]], 126–29 (from Peshawar for Bodø; shot down; Powers out alive; by Bissell''s account). Check: White has it afternoon at Sverdlovsk ([[w.white-making-of-the-president]], 115). To check: [[w.beschloss-mayday]]; [[w.wise-u-2-affair]]; [[w.powers-operation-overflight]]; [[w.pedlow-cia-and-the-u]]; [[w.ambrose-eisenhower]]; [[w.divine-eisenhower-and-the-cold]]; [[w.hitchcock-age-of-eisenhower]]; [[w.kistiakowsky-scientist-at-the-white]]; [[w.bohlen-witness-to-history-1929]]; [[w.macmillan-pointing-the-way-1959]]; [[w.taubman-khrushchev]]; [[w.ulam-expansion-and-coexistence]], 633–35; [[w.lafeber-america-russia-and-the]], 213–15; the *New York Times*, May 26, 1960, 1, 7 (Salisbury) (cited by [[w.chang-friends-and-enemies]], 215 n.24). Names: Powers.'
    src:
      c: faaefd59
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147: 1, 2, 3, 4'
        - 'https://archive.org/details/departmentofstat4260unit/page/817/mode/1up: 4'
        - 'w.eisenhower-white-house-years 543–559: 1, 2, 3, 4'
        - 'w.watson-into-the-missile-age 720: 1, 2, 3, 4'
        - 'via w.watson-into-the-missile-age 720 n.166: 4'
        - 'w.bissell-reflections-of-a-cold 126–29: 1, 2, 3'
        - 'via w.bissell-reflections-of-a-cold 126 n.37a: 1'
        - 'w.fursenko-khrushchevs-cold-war 263–66: 1, 2, 3'
        - 'via w.fursenko-khrushchevs-cold-war 263 n.1: 3'
        - 'w.white-making-of-the-president 115–16: 2, 3'
        - 'w.guan-vietnamese-communists-relations-with 146: ?'
        - 'w.chang-friends-and-enemies 215: ?'
        - 'w.fursenko-khrushchevs-cold-war 263–64, 266: 5'
    tags: [name:powers-francis-gary, name:eisenhower-dwight-d, name:goodpaster-andrew-j, name:bissell-richard-m-jr, ok:note-substance]
    short: the U-2 and the Paris summit
    time_zone: Asia/Yekaterinburg
  - id: cal.1960-05-01.soviet-union-u2
    when: May 1
    date: '1960-05-01'
    thread: soviet-union-u2
    follows:
      - cal.1960-05-01.soviet-union
    c: 'At Bodø, Beerli waits five hours past Powers''s time, then flies to Oslo, the code call unmade.{1} In Washington the project''s duty officer calls King, Bissell''s assistant: "Bill Bailey didn''t come home." Bissell, visiting Rostow, flies back to the project office.{2} By Bissell''s account, after King''s.{3}'
    n: '[[w.bissell-reflections-of-a-cold]], 126–28; [[w.fursenko-khrushchevs-cold-war]], 266–67 ("Bill Bailey didn''t come home"; Eisenhower told at Camp David that afternoon). After the shootdown: [[w.bissell-reflections-of-a-cold]], 126–28. To check: Robert King, interview by Jonathan E. Lewis, May 27, 1992 (cited by [[w.bissell-reflections-of-a-cold]], 128 n.42). See [[cal.1960-05-01.soviet-union]]. Names: Bissell, Rostow.'
    src:
      c: f2531472
      rows:
        - 'w.bissell-reflections-of-a-cold 126–28: 1, 2, 3'
        - 'via w.bissell-reflections-of-a-cold 128 n.42a: 2'
        - 'w.fursenko-khrushchevs-cold-war 266–67: 1'
    tags: [name:beerli-stanley-w, name:bissell-richard-m-jr, name:rostow-walt-w]
