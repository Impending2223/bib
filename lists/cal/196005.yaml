    c: 'Atlanta, near Emory University Hospital, at night. DeKalb County police stop King, driving the writer Lillian Smith back to the hospital after dinner: the borrowed car''s plates expired; only an Alabama license, Georgia''s ninety days for new residents past. A citation; they go on.'
    n: '[[w.garrow-bearing-the-cross]], 135–36. To check: Atlanta Journal, Oct. 24, 1960 (cited by [[w.garrow-bearing-the-cross]], 136 n.7); Coretta King, interview by Charlotte Mayerson, XIII, 38 (cited by [[w.garrow-bearing-the-cross]], 136 n.7); [[w.lewis-king]], 121 (cited by [[w.garrow-bearing-the-cross]], 136 n.7). The probation for it revoked: [[cal.1960-10-25.king]]. Names: Martin Luther King.'
