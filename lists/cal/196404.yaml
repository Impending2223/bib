  - id: cal.1964-04-03.soviet-union
    when: Apr. 3
    date: '1964-04-03'
    thread: soviet-union
    also: [china-leadership]
    c: Moscow.{1} The CPSU publishes together Suslov's report to its February plenum, some 80,000 characters in eight parts, the plenum's resolution of Feb. 15, and a *Pravda* editorial.{2} The report charges the Chinese leaders with petty-bourgeois, nationalist and neo-Trotskyist tendencies and with splitting, takes up the test-ban treaty, the Caribbean crisis, the Indian border and the Sino-Soviet trade, and asks a conference of the parties to fix "ways and means" of unity; the resolution calls for a public, decisive rebuff to the Chinese stand and says the CPSU will not leave the line of its Twentieth and Twenty-second Congresses; the editorial gives over 200 anti-Soviet articles in the *Renmin ribao* since Nov. 1963, and Feb. 12 for the letter to the parties.{3}
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 740, 754–764 (the three texts published at Moscow Apr. 3; the report''s eight parts in Wu''s list; the resolution of Feb. 15; the editorial); [[w.yang-shangkun-riji]], II, 365 (Apr. 3, 1964; *Pravda* prints the editorial, the February plenum''s resolution and Suslov''s report "today," Apr. 3); [[w.deng-xiaoping-nianpu-1904]], III, 1806 n.1 (Apr. 3, 1964; the editors'' note names the three documents the CPSU published that day: the February plenum''s resolution, Suslov''s report, the *Pravda* editorial); [[w.mao-zedong-zhuan]], V, ch. 71 (Apr. 3 the CPSU publishes the resolution of its February plenum and Suslov''s report, with a Pravda editorial; the plenum''s call for a resolute ideological rebuff (n.38)). [[w.chang-friends-and-enemies]], 259 (a leading Soviet official in April 1964: Peking would pit the yellow and black races "against the whites," "no different from Nazism"). To check: *Pravda*, Apr. 3, 1964 (the three texts); the three documents of the CPSU published Apr. 3, 1964 (the resolution of the February plenum; Suslov''s report to it; the *Pravda* editorial), as named in [[w.deng-xiaoping-nianpu-1904]], III, 1806 n.1; *Renmin ribao* 《人民日报》, Apr. 27, 1964 (the resolution of the CPSU Central Committee''s February plenum, in digest) (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.38); [[w.gittings-survey-of-the-sino]], 212–17; U.S., *China and U.S. Far East Policy, 1945–1966*, 137 (cited by [[w.chang-friends-and-enemies]], 259 n.14). See [[cal.1964-02-12.soviet-union]], [[cal.1964-02-10.soviet-union-leadership]]. Names: Suslov.'
