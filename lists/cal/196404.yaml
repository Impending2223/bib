    also: [china-four-cleanups]
    c: 'Xi''an 西安. Peng Zhen 彭真 inspects (to Apr. 16); the Xi''an committee 中共西安市委 tells of too many meetings and side tasks hurting the "five antis," the masses weary, and in learning from Daqing and the PLA haste, too little sleep, "high-yield days," "Saturday battles," commandism; to the Shaanxi committee''s heads: two attitudes to the three years'' leap, denial or "one divides into two"; some do no solid work but loud show, formalism, long, empty meetings, impossible forms, overtime, spending the masses'' zeal; the central ministries to go to the front, needless meetings, papers and forms dropped, no boasting in the press, overtime stopped, visits cut, no "touring" inspections; the masses'' zeal not doused but cherished.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 327–328. Made public: 2012. See [[cal.1964-04-07.china-leadership-2]]. Names: Peng Zhen.'
