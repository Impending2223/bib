    c: 'Zhou, with Zhu De, Li Fuchun, Li Xiannian and others, hears the leading group of the national agricultural planning conference. On its summary outline: "leaders, masses, experts in three-way union", who are "the masses"? State it plainly. Experience is good to present, but conditions differ and one place''s cannot go everywhere untested. On Dazhai: give some matter, not only spirit; how it was done, how the "eight-word charter" was applied, what the state gave; both legs. Each place is to find its own model. Planners want long plans large, capital construction large and annual plans small, against Mao''s "long-term plans with margin, annual plans pushed to exceed". Sums up the outline''s 500 million mu of farmland: low base, small potential, high demands, large investment. Planning work not yet complete or mature; to study further.'
