    also: [soviet-union, china-mao-foreign]
    c: 'Mao, Changsha, Rong Yuan: calls Deng Xiaoping, Kang Sheng, Wang Renzhong, Zhang Pinghua and Wu Lengxi on the telegram for Khrushchev''s 70th birthday;{1} it is to be printable in the Soviet Union, a united-and-struggling move, saying that in any emergency the two parties will unite. The CPSU''s publication of the February plenum documents looks strong and is empty;{2} the Beijing reply is to be rewritten before sending; the 9th and 10th commentaries to be hurried.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 13 and 14, 1964 (Apr. 13). [[w.lengxi-shinian-lunzhan-1956-1966]], 745–747 (Mao''s meeting at Changsha the afternoon of Apr. 12, as soon as lunch was over, with Deng Xiaoping, Kang Sheng and Wu Lengxi, Wang Renzhong and Zhang Pinghua present; the telegram to be printable in the Soviet Union, a "united-and-struggling" move: "dear comrade", and that in any trouble, "to be felt, not said", the two parties would stand together; Khrushchev not the most rightist of the Soviet leaders; the plenum documents "strong in form, base in content", to be printed in the central papers in full; the reply held for rewriting, and then the whole exchange of letters to be published; the ninth and tenth commentaries to be pressed; Mao''s further views on a Soviet-called conference and on preparing a draft programme to meet theirs); [[w.deng-xiaoping-nianpu-1904]], III, 1809 (Apr. 13, 1964; after lunch, 午饭后; Deng at Mao''s forum at Changsha on the draft telegram for Khrushchev''s seventieth birthday and other matters; Mao also asks Deng to tell Zhou Enlai that in the Sino-Soviet trade negotiations imports from the Soviet Union are to be cut and a surplus held to); [[w.mao-zedong-zhuan]], V, ch. 71 (Apr. 13, afternoon, at Changsha, Mao meets Deng, Kang Sheng and Wu Lengxi on four points (Wu''s account): the telegram for Khrushchev''s birthday; the CPSU plenum papers to be printed; the reply postponed and rewritten; the ninth and tenth commentaries pressed). Made public: 1999. To check: [[w.lengxi-shinian-lunzhan-1956-1966]], 745–747 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.39). Names: Mao Zedong, Deng Xiaoping, Kang Sheng, Khrushchev, Wang Renzhong, Zhang Pinghua, Wu Lengxi.'
