  - id: cal.1964-04-01.vietnam-34a
    when: Apr. 1
    date: '1964-04-01'
    thread: vietnam-34a
    c: 'Felt: the "lack of adequate intelligence is a prime factor in the failure of maritime operations"; with North Vietnam alerted, "the odds against pulling off operations under present conditions are high." With 30,000 Viet Cong in the South, the enemy knows of the base at Đà Nẵng; agents perhaps among the boat crews.'
