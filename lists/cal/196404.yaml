    c: 'House Judiciary Committee, Celler''s, opens hearings on the school prayer amendments, before the full committee. Becker for an amendment "designed to guarantee permanently the right to pray and read Holy Scripture in the public schools of our Nation." His discharge petition for H.J. Res. 9 gets 167 of the 218 names it needs. The text agreed on, H.J. Res. 693: nothing in the Constitution to forbid prayers or Scripture in any public school or place, participation voluntary. Eighteen days of hearings, into June. No resolution reported.'
