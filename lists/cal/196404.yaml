    also: [china-foreign, china-propaganda]
    c: 'Liu Shaoqi receives the Korean cultural delegation headed by Kang Ku-yong (康久永), Vice-Chairman of the Committee for Cultural Relations with Foreign Countries.{1} On creative work in literature and art he says: an era of revolutionary development should have good works; the literature and art of the New Democratic period already had socialist elements; with ten-odd years since the victory, socialist transformation basically done and the economic base complete, the New Democratic literature and art alone is not enough; a step further is needed, to socialist literature and art, which needs creation. China has not solved its problems here well, nor in education: what to do with primary, middle and university schools, where it too has many faults; these need solving and it is time to solve them.{2}'
