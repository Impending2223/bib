    c: 'Zhou receives Matsumura Kenzō and other Japanese guests.{1} Independence without alliance with the bloc makes a satellite; independence does not shut out cooperation with truly friendly states;{2} China treats friends more warmly and an enemy in kind, but never hostile first. Matsumura need not fear China''s spirit of independence will start a world war with the U.S. Complains Ikeda''s government has said Taiwan''s status is undetermined; told this is not its meaning and a remedy is coming: "we shall see". China favors improving relations by accumulation, working toward diplomatic ties.{3}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 636 (Apr. 18, 1964); [[w.zhou-enlai-waijiao-huodong]], 403 (Apr. 18, 1964; 下午, 人民大会堂福建厅); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 330 (Apr. 12–May 5, 1964; Zhou and Chen Yi receive Matsumura Kenzō and his party; on the policy of independence and self-reliance Zhou says that if one does not firmly carry it out one becomes a satellite and the lackey of imperialism, a dependent state; independence does not exclude cooperation, for no country today can shut itself up and stand alone; true independence does not exclude international cooperation, that is, cooperation among truly friendly countries; China opposes the use of war and nuclear weapons by a few to deceive the world''s peoples and bully the weak; the book dates this to the visit, not to a day). Names: Zhou Enlai, Matsumura Kenzō.'
