    when: Apr. 4
    date: '1964-04-04'
    thread: civil-rights-bill
    c: 'Saturday. A quorum call forty minutes after the Senate meets: forty-one present, twenty-five absent of them Northern Democrats. Mansfield: "a travesty on the legislative process"; the Senate in recess to Monday, [27–14](https://voteview.com/rollcall/RS0880290). Humphrey gives the press the absentees'' names.'
    n: '[110 Cong. Rec. 6862–63](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt5/pdf/GPO-CRECB-1964-pt5-13-1.pdf#page=2) (Apr. 4, 1964). [[w.mann-walls-of-jericho]], 407–8. To check: New York Times, Apr. 5, 1964 (cited by [[w.mann-walls-of-jericho]], 408). See [[cal.1964-03-30.civil-rights-bill]]. Names: Mansfield, Humphrey.'
