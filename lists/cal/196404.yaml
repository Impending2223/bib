    when: Apr. 20
    date: '1964-04-20'
    thread: desegregation-schools
    also: [civil-rights-organizations]
    c: 'Cleveland. A boycott of the schools: some 60,000 Negro pupils out (Check the date and figure). Locher stands with the school board.'
    n: '[Encyclopedia of Cleveland History, "Mayoral Administration of Ralph S. Locher"](https://case.edu/ech/articles/m/mayoral-administration-ralph-s-locher). See [[cal.1964-04-07.desegregation-schools-cleveland]]. Names: Locher.'
    tags: [state:oh, city:cleveland, name:locher-ralph-s]
  - id: cal.1964-04-21.elections-1964
    when: Apr. 21
    date: '1964-04-21'
    thread: elections-1964
    c: 'New Jersey primary. Republican: Lodge (write-in) 41.7 percent, Goldwater (write-in) 28.0. Democratic: Johnson (write-in) 82.3 percent, Wallace (write-in) 8.3.'
    n: '[N.J. Secretary of State, *Results of the Primary Election Held April 21st, 1964*, "Choice for President"](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1964-primary-election.pdf#page=2). CQ Guide 6th (2010) 406. See [[cal.1964-03-10.elections-1964]]. Names: Wallace, Lodge, Goldwater, Johnson.'
    tags: [primary:1964-04-21, name:wallace-george-c, name:lodge-henry-cabot, name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-04-22.railroads
    when: Apr. 22
    date: '1964-04-22'
    thread: railroads
    c: 'Johnson announces the settlement on television: "4 1/2 years of conflict" ended. Agreement in principle, subject to ratification: the 100-mile unit of a day''s work kept; yard wages raised; paid holidays; allowances for crews laid over away from home. Wirtz presided.'
    n: 'Radio and Television Statement Announcing the Settlement of the Railroad Dispute, [1963–64 Pub. Papers 517](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=601) (Apr. 22, 1964). See [[cal.1964-04-09.railroads]]. Names: Johnson, Wirtz.'
    tags: [name:johnson-lyndon-b, name:wirtz-w-willard]
  - id: cal.1964-04-22.civil-rights-organizations-nyc
    when: Apr. 22
    date: '1964-04-22'
    thread: civil-rights-organizations
    also: [states-and-cities]
    c: Queens. The New York World's Fair opens; Johnson speaks at the opening, hecklers in the crowd (Check). Brooklyn CORE's "stall-in" on the highways to the fair, disowned by CORE's national office, stops few cars; Farmer and other demonstrators arrested at the pavilions (Check).
    n: 'Remarks at the Opening of the New York World''s Fair, [1963–64 Pub. Papers 515](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=599) (Apr. 22, 1964). To check: [[w.purnell-fighting-jim-crow-in]]; [[w.biondi-to-stand-and-fight]]. Names: Johnson, Farmer.'
    tags: [state:ny, city:nyc, name:johnson-lyndon-b, name:farmer-james]
  - id: cal.1964-04-22.amendments
    when: Apr. 22
    date: '1964-04-22'
    thread: amendments
    also: [court, congress]
    c: 'House Judiciary Committee, Celler''s, opens hearings on the school prayer amendments, before the full committee. Becker for an amendment "designed to guarantee permanently the right to pray and read Holy Scripture in the public schools of our Nation." His discharge petition for H.J. Res. 9 gets 167 of the 218 names it needs. The text agreed on, H.J. Res. 693: nothing in the Constitution to forbid prayers or Scripture in any public school or place, participation voluntary. Eighteen days of hearings, into June. No resolution reported.'
    n: 'Becker''s statement, inserted by Wydler, [110 Cong. Rec. 9414](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt7/pdf/GPO-CRECB-1964-pt7-7-3.pdf) (1964); Becker and Celler''s letter, the hearings to be before the full committee, [3656](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-9-1.pdf). *School Prayers: Hearings before the House Committee on the Judiciary*, 88th Cong., 3 vols. (1964) (Check a digitized copy). [Congressional Research Service, *School Prayer: The Congressional Response, 1962–1998*](https://www.everycrsreport.com/reports/96-846.html) (1998). To check: [[w.dierenfield-battle-over-school-prayer]]. See [[cal.1962-08-02.amendments]]; [[cal.1963-06-17.court]]. Names: Celler, Becker.'
    tags: [name:celler-emanuel, name:becker-frank-j]
  - id: cal.1964-04-24.poverty
    when: Apr. 24
    date: '1964-04-24'
    thread: poverty
    c: 'Johnson in the depressed areas: South Bend, Studebaker''s plant closed; Pittsburgh; Paintsville and Inez, Ky.; Huntington, W. Va., with the Appalachian governors. Apr. 28, the Appalachian bill to Congress, with the regional commission''s report: 2,350 miles of development highways, $920 million; water projects; timber, mineral and land programs.'
    n: 'Remarks at the Lulu V. Cline School, South Bend, Indiana, [1963–64 Pub. Papers 532](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=616); Remarks at the Johnson County Courthouse, Paintsville, Kentucky, [1963–64 Pub. Papers 543](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=627); Remarks at the Airport, Huntington, West Virginia, Upon Departing for Washington, [1963–64 Pub. Papers 545](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=629) (Apr. 24, 1964); The President''s News Conference, [1963–64 Pub. Papers 547](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=631) (Apr. 25, 1964); Letter to the President of the Senate and to the Speaker of the House Transmitting the Bill for the Appalachian Region, [1963–64 Pub. Papers 586](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=670) (Apr. 28, 1964). To check: [[w.caudill-night-comes-to-the]]; [[w.eller-uneven-ground]]; [[w.commission-appalachia]]. See [[cal.1964-03-16.poverty]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-04-24.legislatures-ks
    when: Apr. 24
    date: '1964-04-24'
    thread: legislatures
    c: Kansas. A three-judge federal court holds the congressional districting of 1961 unconstitutional, but stays its decree until after the 1964 elections.
    n: '*Meeks v. Anderson*, [229 F. Supp. 271](https://static.case.law/f-supp/229/case-pdfs/0271-01.pdf) (D. Kan. 1964). See [[cal.1964-02-17.court]].'
    tags: [state:ks]
  - id: cal.1964-04-24.africa
    when: Apr. 24
    date: '1964-04-24'
    thread: africa
    also: [space]
    c: 'NSAM 295, on South Africa: its carrying out of the Odendaal report in South West Africa to be delayed, if possible until the World Court decides; existing policy on military sales continued, submarines deferred; the lending agencies to suspend loans and guarantees, quietly; NASA and Defense to plan stand-by sites should the tracking stations in South Africa have to be given up on six months'' notice.'
    n: 'FRUS 1964–68, XXIV, doc. [586](https://history.state.gov/historicaldocuments/frus1964-68v24/d586) (NSAM 295). Made public: FRUS 1964–68, XXIV (1999). To check: [[w.noer-cold-war-and-black]]; [[w.irwin-gordian-knot]]. See [[cal.1963-12-04.africa]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-04-26.civil-rights-organizations
    when: Apr. 26
    date: '1964-04-26'
    thread: civil-rights-organizations
    also: [mississippi]
    c: Jackson. A COFO meeting founds the Mississippi Freedom Democratic Party, open to all, and elects a temporary State Executive Committee. Its precinct and county meetings to follow the regular party's rules; its delegates to contest the regulars' seats at Atlantic City.
    n: 'SNCC Digital Gateway, [Mississippi Freedom Democratic Party (MFDP) founded](https://snccdigital.org/events/mfdp-founded/) (K–J Cong. II.L). King Institute, [Mississippi Freedom Democratic Party (MFDP)](https://kinginstitute.stanford.edu/mississippi-freedom-democratic-party-mfdp). [[w.dittmer-local-people]], 236–37. To check: [[w.payne-ive-got-the-light]]; [[w.mcadam-freedom-summer]]; [[w.carson-in-struggle]]; [[w.mills-this-little-light-of]]. See [[cal.1962-02.civil-rights-organizations]].'
