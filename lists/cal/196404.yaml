    n: '[[w.white-suite-3505]], 338–39; [[w.novak-agony-of-the-g]], 392–93 (the night of Apr. 4, the Hilton Inn by the airport, in secret, after Knowland''s day of twenty-four appearances in San Diego in March; three or four a day, friendly audiences, television, few press conferences; Knowland threatens to quit). Names: Goldwater, Knowland.'
