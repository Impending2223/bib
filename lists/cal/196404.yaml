  - id: cal.1964-04-08.cuba
    when: Apr. 8
    date: '1964-04-08'
    thread: cuba
    c: 'McCone''s memorandum, the day after Johnson decided to stop CIA-controlled sabotage operations: "the real issue to be considered at the meeting and by the President was a question of whether we wished to implement the policy (outlined in certain memoranda) or abandon the basic objective of bringing about the liquidation of the Castro Communist entourage and the elimination of Communist presence in Cuba and thus rely on future events of an undisclosed nature which might accomplish this objective." The "future events": "extreme economic distress caused by a sharp drop in sugar prices" and "other external factors."'
