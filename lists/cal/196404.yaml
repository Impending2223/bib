    c: 'Zhou, at the joint session of the 117th meeting of the NPC Standing Committee and the 144th plenary meeting of the State Council, adds to his report on the fourteen-country trip, answering questions from the earlier discussion, and speaks on events of the past month.{1} On the Sino-Soviet border: China''s principles in the talks are that the treaties after the Opium War are unequal, imposed by tsarist Russia; that China still accepts them as the base for talks with needed adjustments; that a new boundary treaty replace the old. The Soviet side does not agree; little progress.{2}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 637–38 (Apr. 25, 1964); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 333 (Apr. 25, 1964; Zhou''s report to the joint meeting of the NPC Standing Committee and the State Council on his visit to 14 countries: ten African countries (the UAR, Algeria, Morocco, Tunisia, Ghana, Mali, Guinea, the Sudan, Ethiopia and Somalia) and Albania, Dec. 13, 1963–Feb. 5, 1964, and Burma, Pakistan and Ceylon, Feb. 14–Mar. 1, 72 days and 108,000 kilometers in all; a complete success); [[w.zhu-de-nianpu-xinbian]], III, 1907 (Apr. 25, 1964; Zhu De 朱德 presides over the joint meeting of the 117th meeting of the Second NPC Standing Committee 第二届全国人大常委会第一百一十七次会议 and the 144th plenary meeting of the State Council 国务院全体会议第一百四十四次会议, which hears Zhou Enlai 周恩来 on his visits to fourteen countries). Made public: 1997. Names: Zhou Enlai.'
