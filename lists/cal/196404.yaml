    c: 'Peking 北京, 3:30 to 6 p.m.{1} The Secretariat 书记处: Bo Yibo 薄一波 reports on the political departments of the industry and communications system 工交系统的政治部;{2} Yang Shangkun 杨尚昆 there.{3}'
