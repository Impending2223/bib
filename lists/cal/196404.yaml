    c: The Foreign Ministry issues a statement on the present situation in Laos. The military coup the U.S. and the pro-U.S. Lao clique launched at Vientiane is an open and serious breach of the Geneva agreements, which China cannot look on at. Any wrecking of the Lao government of national union under the coup group's coercion is illegal. China fully supports the statement of Prince Souphanouvong of Apr. 19 and the just demands in the Vietnamese Foreign Ministry's statement of Apr. 20. Prince Souvanna Phouma's freedom must at once be restored and the coup leaders severely punished; the leaders of the three Lao sides should at once resume talks and decide effective guarantees so that the government of national union can act normally and carry out its political program.
