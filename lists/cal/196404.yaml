    c: 'Mao, Changsha: approves the first, longer draft of the telegram for Khrushchev''s 70th birthday, adds the last line, and meets with Deng Xiaoping, Kang Sheng, Tao Zhu, Wang Renzhong, Zhang Pinghua and Wu Lengxi at 5 p.m.{1}'
