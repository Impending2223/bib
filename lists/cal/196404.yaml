  - id: cal.1964-04-01.civil-rights-organizations
    when: Apr. 1
    date: '1964-04-01'
    thread: civil-rights-organizations
    also: [civil-rights-bill]
    c: 'The Leadership Conference, some eighty leaders, a day''s meeting: a daily prayer service at the Lutheran Church of the Reformation; B''nai B''rith Women''s wire day, Apr. 6; student rallies at the Sylvan Theater, Apr. 27 to May 2. Rauh: "a bill now which is beyond our wildest dreams."'
    n: '[[w.whalen-longest-debate]], 157; [[w.risen-bill-of-the-century]], 193–94 (the meeting, the daily prayer service at the Lutheran Church of the Reformation, B''nai B''rith Women''s write-ins, the gallery watchers; Humphrey''s remarks; Risen''s day the one the Senate took up the bill, Mar. 31 by his 192). Check: Risen, 193–94, has the Leadership Conference''s all-day meeting at the Statler Hilton, some eighty leaders from seventy-four organizations, "on the same day the Senate took up the bill," by his 192 the day before Apr. 1 (Mar. 31), the day of Mrs. Peabody''s arrest; Humphrey at it: "the fight can go on for ten years." His note 11 is the Conference''s Memo 32, Apr. 6. To check: Leadership Conference memo no. 32, Apr. 6, 1964, Library of Congress (cited by [[w.whalen-longest-debate]], 261). Names: Rauh.'
    src:
      c: 98c3ae40
      rows:
        - 'w.whalen-longest-debate 157: all'
        - 'via x.1964-04-06.lccr-memo-no-32: all'
        - 'w.risen-bill-of-the-century 193–94: ?'
    tags: [name:rauh-joseph-l-jr]
