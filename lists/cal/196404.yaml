    n: '[[w.ball-past-has-another-pattern]], 429. Check: Ball has Rusk away; FRUS''s teleconference with Rio of Apr. 1, 1500Z, has the Secretary present ([FRUS 1964–68, XXXI, doc. 201](https://history.state.gov/historicaldocuments/frus1964-68v31/d201)); the telegram not found. See [[cal.1964-03-31.latin-america]]. Names: Ball, Gordon.'
