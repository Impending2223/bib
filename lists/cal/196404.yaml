    n: 'Remarks following the Signing of a Joint Declaration With Panama, [1963–64 Pub. Papers 436](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=520) (Apr. 3, 1964); The President''s News Conference, [1963–64 Pub. Papers 404](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=488) (Mar. 21, 1964) (the impasse). FRUS 1964–68, XXXI, docs. [409](https://history.state.gov/historicaldocuments/frus1964-68v31/d409), [410](https://history.state.gov/historicaldocuments/frus1964-68v31/d410). [[w.johnson-vantage-point]], 184 (Chiari''s agreement). See [[cal.1964-01-09.latin-america]]. Names: Johnson, Bunker, Chiari, Moreno, Anderson.'
