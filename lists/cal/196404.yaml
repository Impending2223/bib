# Cal. LIII April 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LIII
entries:
  - id: cal.1964-04-01.transportation
    when: Apr. 1
    date: '1964-04-01'
    thread: transportation
    c: 'Executive Order 11149: a President''s Advisory Committee on Supersonic Transport, McNamara chairman, with the Secretaries of the Treasury and Commerce and the heads of NASA and the Federal Aviation Agency, to attend above all to the program''s finances. Its report, May 21.'
    n: '[Exec. Order No. 11,149](https://www.presidency.ucsb.edu/documents/executive-order-11149-establishing-the-presidents-advisory-committee-supersonic-transport) (Apr. 1, 1964); Statement by the President in Response to a Report on the Supersonic Transport Program, [1963–64 Pub. Papers 702](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=786) (May 21, 1964); Statement by the President on the Supersonic Transport Program, [1963–64 Pub. Papers 1635](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=875) (Dec. 3, 1964). See [[cal.1963-06-05.transportation]]. Names: McNamara.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1964-04-03.latin-america
    when: Apr. 3
    date: '1964-04-03'
    thread: latin-america-panama
    c: 'Panama. Bunker and Moreno sign a joint declaration at the OAS: relations restored; special ambassadors, in Johnson''s words, to seek "the prompt elimination of the causes of conflict" "without limitations or preconditions of any kind." Robert B. Anderson named for the United States. Johnson telephones Chiari.'
    n: 'Remarks following the Signing of a Joint Declaration With Panama, [1963–64 Pub. Papers 436](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=520) (Apr. 3, 1964); The President''s News Conference, [1963–64 Pub. Papers 404](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=488) (Mar. 21, 1964) (the impasse). FRUS 1964–68, XXXI, docs. [409](https://history.state.gov/historicaldocuments/frus1964-68v31/d409), [410](https://history.state.gov/historicaldocuments/frus1964-68v31/d410). See [[cal.1964-01-09.latin-america]]. Names: Johnson, Bunker, Chiari, Moreno, Anderson.'
    tags: [name:johnson-lyndon-b, name:bunker-ellsworth, name:moreno-miguel-j-jr, name:anderson-robert-b, name:chiari-roberto-f]
  - id: cal.1964-04-03.black-nationalism
    when: Apr. 3
    date: '1964-04-03'
    thread: black-nationalism
    also: [voting-rights, civil-rights-bill]
    c: '"The Ballot or the Bullet," Malcolm X at Cory Methodist Church, Cleveland, under CORE''s auspices: register and vote as a bloc; take the case to the United Nations as one of human rights; the ballot or the bullet. Check: the church.'
    n: '[The Ballot or the Bullet (Cleveland, Apr. 3, 1964)](https://blackpast.org/african-american-history/1964-malcolm-x-ballot-or-bullet/). See [[cal.1963-12-01.black-nationalism]]. Names: Malcolm X.'
    tags: [name:malcolm-x]
  - id: cal.1964-04-03.africa-wheelus
    when: Apr. 3
    date: '1964-04-03'
    thread: africa-wheelus
    also: [middle-east]
    c: 'Harriman to Johnson, after Libya: the tenancy of Wheelus can be protracted several years.'
    n: '[FRUS 1964–68, XXIV, doc. 50](https://history.state.gov/historicaldocuments/frus1964-68v24/d50). See [[cal.1964-02-22.africa]]. Names: Harriman, Johnson.'
    tags: [name:harriman-w-averell, name:johnson-lyndon-b]
  - id: cal.1964-04-05.opinion
    when: Apr. 5
    date: '1964-04-05'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Mar. 13–17: Republicans'' choice for 1964: Lodge 42, Nixon 26, Goldwater 14, Rockefeller 6, Scranton 4, Romney 4; others, no preference 4. Independents: Lodge 41, Nixon 20, Goldwater 10, Rockefeller 9.'
    n: '[[w.gallup-poll]], III, 1873–74. Names: Nixon, Goldwater, Lodge, Rockefeller, Romney, Scranton.'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1964-04-06.mississippi
    when: Apr. 6
    date: '1964-04-06'
    thread: mississippi
    also: [court]
    c: '*United States v. Barnett*, [376 U.S. 681](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376681/usrep376681.pdf). Barnett and Paul Johnson, charged with criminal contempt of the Fifth Circuit''s orders for Meredith''s admission, Sept. 1962, have no right to a jury, 5–4. Clark for the Court; a note: some members think punishment without a jury limited to that for petty offenses. Black, Douglas, Goldberg and Warren dissent.'
    n: '*United States v. Barnett* (K–J Adm. II.H.1). To check: [[w.doyle-american-insurrection]]. See [[cal.1962-09-20.mississippi]]. Names: Barnett, Johnson, Meredith.'
    tags: [name:barnett-ross-r, name:johnson-paul-b-jr, name:meredith-james-h]
  - id: cal.1964-04-06.middle-east-yemen
    when: Apr. 6
    date: '1964-04-06'
    thread: middle-east-yemen
    c: Stevenson to the Security Council, against the British strike at Harib.
    n: 'Stevenson''s statement: [[w.current-documents-1964]], 713–714. [FRUS 1964–68, XXI, doc. 326](https://history.state.gov/historicaldocuments/frus1964-68v21/d326), n. 3. See [[cal.1964-03-28.middle-east]]. Names: Stevenson.'
    tags: [name:stevenson-adlai-e]
  - id: cal.1964-04-07.elections-1964
    when: Apr. 7
    date: '1964-04-07'
    thread: elections-1964
    c: 'Wisconsin primary. Republican: Byrnes 99.7 percent, unpledged delegates 0.3. Democratic: Reynolds 66.2 percent, Wallace 33.8.'
    n: 'CQ Guide 6th (2010) 406. To check: [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. See [[cal.1964-03-10.elections-1964]]. Names: Wallace, John Reynolds, Byrnes.'
    tags: [primary:1964-04-07, name:wallace-george-c, name:byrnes-john-w, name:reynolds-john-w-jr]
  - id: cal.1964-04-07.desegregation-schools-cleveland
    when: Apr. 7
    date: '1964-04-07'
    thread: desegregation-schools
    also: [civil-rights-organizations]
    c: Cleveland. The Reverend Bruce Klunder, of the United Freedom Movement and CORE, crushed by a backing bulldozer at the site of a new school on Lakeview Road, Glenville, protested as built to keep Negro pupils apart.
    n: '[Wikipedia, "Bruce W. Klunder"](https://en.wikipedia.org/wiki/Bruce_W._Klunder). To check: [[w.frazier-harambee-city]]; [[w.moore-carl-b-stokes-and]]. See [[cal.1964-01-30.desegregation-schools-cleveland]]. Names: Klunder.'
    tags: [state:oh, city:cleveland, name:klunder-bruce-w]
  - id: cal.1964-04-07.mayors-milwaukee
    when: Apr. 7
    date: '1964-04-07'
    thread: mayors
    also: [elections-1964]
    c: Milwaukee re-elects Maier mayor, a second term.
    n: '[Wikipedia, "Henry Maier"](https://en.wikipedia.org/wiki/Henry_Maier) (Check: the opponent and the vote, from the city''s canvass). See [[cal.1960-04-05.mayors-milwaukee]]. Names: Maier.'
    tags: [state:wi, city:milwaukee, name:maier-henry-w]
  - id: cal.1964-04-07.state-constitutions-kansas-city
    when: Apr. 7
    date: '1964-04-07'
    thread: state-constitutions
    also: [desegregation-public-places]
    c: 'Kansas City, Mo., at a referendum, keeps its public accommodations ordinance, No. 29153, Councilman Watkins''s, passed Sept. 13, 1963: no discrimination by race in any public business. Carried by about 1,700 votes.'
    n: 'Pendergast KC, ["Theron B. and Bruce Watkins"](https://pendergastkc.org/articles/theron-b-and-bruce-watkins) (gives Apr. 8); [Wikipedia, "Bruce R. Watkins"](https://en.wikipedia.org/wiki/Bruce_R._Watkins) (gives Apr. 18) (Check: the day and the vote, from the Board of Election Commissioners). To check: [[w.peirce-great-plains-states-of]]. Names: Watkins.'
    tags: [state:mo, city:kansas-city, name:watkins-bruce-r]
  - id: cal.1964-04-08.farm
    when: Apr. 8
    date: '1964-04-08'
    thread: farm
    c: 'House passes the food stamp bill, [229–189](https://voteview.com/rollcall/RH0880149): a permanent program where the States ask for it. Hoeven''s motion to make the States pay half rejected, [195–223](https://voteview.com/rollcall/RH0880148). That evening the House takes the Senate''s wheat-cotton bill, [211–203](https://voteview.com/rollcall/RH0880150); the Senate had passed it Mar. 6, [53–35](https://voteview.com/rollcall/RS0880287).'
    n: '[110 Cong. Rec., House, Apr. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt6/pdf/GPO-CRECB-1964-pt6-2-2.pdf); [110 Cong. Rec., Senate, Mar. 6, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-3-1.pdf). Statement by the President following House Action on the Wheat-Cotton and Food Stamp Bills, [1963–64 Pub. Papers 446](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=530) (Apr. 9, 1964). To check: [[w.cochrane-american-farm-policy-1948]]; [[w.hansen-gaining-access]]; [[w.congress-and-the-nation]]. See [[cal.1963-05-20.program]]. Names: Hoeven.'
    tags: [name:hoeven-charles-b]
  - id: cal.1964-04-09.railroads
    when: Apr. 9
    date: '1964-04-09'
    thread: railroads
    c: Rail work rules. The carriers' new rules due at 12:01 a.m. Apr. 10; the five operating brotherhoods' strike called against the Illinois Central. Johnson asks both sides to hold off twenty days; after four hours at the White House with him and Wirtz they agree to fifteen. Talks in the Cabinet Room from Apr. 10.
    n: 'Statement by the President on the Eve of a National Railroad Strike, [1963–64 Pub. Papers 451](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=535) (Apr. 9, 1964); Radio and Television Statement Announcing a Moratorium in the Railroad Labor Dispute, [1963–64 Pub. Papers 451](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=535) (Apr. 9, 1964); Remarks at the Opening of Final Negotiations in the Railroad Dispute, [1963–64 Pub. Papers 452](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=536) (Apr. 10, 1964). To check: [[w.kaufman-railroad-labor-dispute]]; [[w.cullen-national-emergency-strikes]]. See [[cal.1963-08-27.railroads]]. Names: Johnson, Wirtz.'
    tags: [name:johnson-lyndon-b, name:wirtz-w-willard]
  - id: cal.1964-04-09.middle-east-yemen
    when: Apr. 9
    date: '1964-04-09'
    thread: middle-east-yemen
    c: 'Resolution 188, 9–0: reprisals condemned, the Harib attack deplored; the United States and Britain abstaining, on Johnson''s decision against Stevenson''s advice.'
    n: '[Resolution 188 (1964)](https://undocs.org/S/RES/188(1964)). FRUS 1964–68, XXI, docs. [326](https://history.state.gov/historicaldocuments/frus1964-68v21/d326), [327](https://history.state.gov/historicaldocuments/frus1964-68v21/d327) (Johnson and Rusk by telephone). Made public: FRUS 1964–68, XXI (2000). See [[cal.1964-03-28.middle-east]]. Names: Johnson, Stevenson.'
    tags: [name:johnson-lyndon-b, name:stevenson-adlai-e]
  - id: cal.1964-04-10.opinion
    when: Apr. 10
    date: '1964-04-10'
    thread: opinion
    also: [elections-1964-polls, baker]
    c: 'Gallup, special survey of 1,935 Republican county chairmen, the strongest argument against the Democrats: a weak foreign policy, prestige, foreign aid, Cuba, Vietnam, Panama, 1,302; too much spending, 491; the federal government too powerful, 409; the Baker scandal and corruption, 289; integration too fast, 172; personal criticism of Johnson, 104; farm policy, 94.'
    n: '[[w.gallup-poll]], III, 1874. Names: Robert Baker, Johnson.'
    tags: [name:baker-robert-g, name:johnson-lyndon-b]
  - id: cal.1964-04-10.europe-and-the-alliance
    when: Apr. 10
    date: '1964-04-10'
    thread: europe-and-the-alliance
    c: 'The MLF at the White House: Ball, Finletter, Bundy and others. Johnson directs that the Europeans be told it is the best way to proceed, without forcing it on them; Congress''s committees to be briefed; agreement, if possible, by the end of the year.'
    n: '[FRUS 1964–68, XIII, doc. 16](https://history.state.gov/historicaldocuments/frus1964-68v13/d16). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 413. To check: [[w.steinbruner-cybernetic-theory-of-decision]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.priest-kennedy-johnson-and-nato]]. See [[cal.1963-12-28.europe-and-the-alliance]]. Names: Ball, Finletter, Bundy, Johnson.'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:finletter-thomas-k, name:bundy-mcgeorge]
  - id: cal.1964-04-11.farm
    when: Apr. 11
    date: '1964-04-11'
    thread: farm
    c: 'Agricultural Act of 1964, the wheat-cotton bill, signed, [78 Stat. 173](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg173-2.pdf). Cotton: payments to bring the domestic mills'' price down to the export price, ending two-price cotton. Wheat: a voluntary certificate program for 1964 and 1965, after the growers'' rejection of controls in May 1963.'
    n: 'Remarks Upon Signing the Wheat-Cotton Bill, [1963–64 Pub. Papers 454](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=538) (Apr. 11, 1964). See [[cal.1964-04-08.farm]]. Names: Johnson, Freeman.'
    tags: [name:johnson-lyndon-b, name:freeman-orville-l]
  - id: cal.1964-04-11.states-and-cities-san-francisco
    when: Apr. 11
    date: '1964-04-11'
    thread: states-and-cities
    also: [jobs-and-wages]
    c: 'San Francisco, Auto Row: 226 arrested in the sit-ins.'
    n: Jo Freeman, ["Freedom Now! to Free Speech"](https://www.foundsf.org/index.php?title=Freedom_Now!_to_Free_Speech:_How_the_1963-64_Bay_Area_Civil_Rights_Demonstrations_Paved_the_Way_to_Campus_Protest) (FoundSF). See [[cal.1964-03-14.states-and-cities-san-francisco]].
    tags: [state:ca, city:san-francisco]
  - id: cal.1964-04-12.opinion
    when: Apr. 12
    date: '1964-04-12'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Mar. 27–Apr. 1, Democrats'' choice for Vice President: Robert Kennedy 47, Stevenson 18, Humphrey 10, Shriver 7, Brown 3, Fulbright 3, Wagner 2; others, no preference 7. Kennedy in the East 55; in the South 38.'
    n: '[[w.gallup-poll]], III, 1874–75. Names: Robert Kennedy, Stevenson, Humphrey, Shriver, Brown, Wagner, Fulbright.'
    tags: [name:kennedy-robert-f, name:stevenson-adlai-e, name:humphrey-hubert-h, name:shriver-r-sargent, name:brown-edmund-g, name:fulbright-j-william, name:wagner-robert-f-jr]
  - id: cal.1964-04-12.black-nationalism
    when: Apr. 12
    date: '1964-04-12'
    thread: black-nationalism
    also: [voting-rights]
    c: '"The Ballot or the Bullet" again, Malcolm X at Detroit. He leaves for Mecca and Africa, Apr. 13–May 21.'
    n: '[The Ballot or the Bullet (Detroit, Apr. 12, 1964)](https://americanradioworks.publicradio.org/features/blackspeech/mx.html). See [[cal.1964-04-03.black-nationalism]]. Names: Malcolm X.'
    tags: [name:malcolm-x]
  - id: cal.1964-04-12.middle-east-yemen
    when: Apr. 12
    date: '1964-04-12'
    thread: middle-east-yemen
    c: 'Johnson to Douglas-Home: the abstention on Harib approved reluctantly; "it would be hard for me to make the same decision again."'
    n: '[FRUS 1964–68, XXI, doc. 330](https://history.state.gov/historicaldocuments/frus1964-68v21/d330). Made public: FRUS 1964–68, XXI (2000). See [[cal.1964-03-28.middle-east]]. Names: Johnson, Douglas-Home.'
    tags: [name:johnson-lyndon-b, name:douglas-home-alec]
  - id: cal.1964-04-13.robert-kennedy
    when: Apr. 13
    date: '1964-04-13'
    thread: robert-kennedy
    c: Robert Kennedy recorded by John Bartlow Martin for the Kennedy Library's oral history.
    n: 'JFKOH-RFK-02 to -04, Kennedy Library (Check: which session). Made public: [[w.robert-kennedy-in-his]]. See [[cal.1964-02-29.robert-kennedy]]. Names: Robert Kennedy, Martin.'
    tags: [name:kennedy-robert-f, name:martin-john-bartlow]
  - id: cal.1964-04-14.elections-1964
    when: Apr. 14
    date: '1964-04-14'
    thread: elections-1964
    also: [goldwater]
    c: 'Illinois primary. Republican: Goldwater 62.0 percent, Smith 25.3. Democratic: Johnson (write-in) 91.6 percent, Wallace (write-in) 4.2.'
    n: '[*Official Vote of the State of Illinois Cast at the General Election, November 3, 1964 ... General Primary, April 14, 1964*, 161](https://archive.org/details/officialvoteof1964illi/page/n166). CQ Guide 6th (2010) 406. See [[cal.1964-03-10.elections-1964]]. Names: Goldwater, Wallace, Johnson, Smith.'
    tags: [primary:1964-04-14, name:wallace-george-c, name:johnson-lyndon-b, name:smith-margaret-chase, name:goldwater-barry-m]
  - id: cal.1964-04-14.governors-il
    when: Apr. 14
    date: '1964-04-14'
    thread: governors
    also: [elections-1964]
    c: Illinois, Republican primary for governor. Percy, president of Bell & Howell, 626,111, 60.3 percent; William J. Scott, State treasurer, 388,903, 37.4. Kerner renominated unopposed.
    n: 'Votes: [Ill. *Official Vote*, 1964, p. 171](https://archive.org/details/officialvoteof1964illi/page/n176). To check: [[w.barnhart-kerner]]; [[w.peirce-megastates-of-america]]. See [[cal.1964-04-14.elections-1964]]. Names: Percy, Scott, Kerner.'
    tags: [state:il, name:percy-charles-h, name:scott-william-j, name:kerner-otto]
  - id: cal.1964-04-14.middle-east
    when: Apr. 14–15
    date: '1964-04-14'
    thread: middle-east
    c: 'Hussein at the White House. To Rusk: will the United States sell Jordan arms, paid for by the new Arab command''s funds? The Soviets offer MiG-21s at two-thirds the price. Joint statement, Apr. 15.'
    n: 'Remarks of Welcome at the White House to Hussein I, King of Jordan, [1963–64 Pub. Papers 461](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=545); Toasts of the President and King Hussein I, [1963–64 Pub. Papers 462](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=546) (Apr. 14, 1964); Joint Statement following Discussions With the King of Jordan, [1963–64 Pub. Papers 466](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=550) (Apr. 15, 1964). FRUS 1964–68, XVIII, docs. [39](https://history.state.gov/historicaldocuments/frus1964-68v18/d39), [40](https://history.state.gov/historicaldocuments/frus1964-68v18/d40), [41](https://history.state.gov/historicaldocuments/frus1964-68v18/d41). To check: [[w.little-puppet-in-search-of]]; [[w.shlaim-lion-of-jordan]]. See [[cal.1964-01-13.middle-east]]. Names: Hussein ibn Talal, Rusk.'
    tags: [name:hussein-ibn-talal, name:johnson-lyndon-b, name:rusk-dean]
  - id: cal.1964-04-17.mississippi
    when: Apr. 17
    date: '1964-04-17'
    thread: mississippi
    c: Jackson. The second all-white jury in Beckwith's trial for Evers's murder cannot agree; mistrial. Beckwith out on bond. Convicted at a third trial, Feb. 5, 1994.
    n: '*Beckwith v. State*, [707 So. 2d 547](https://static.case.law/so2d/707/case-pdfs/0547-01.pdf) (Miss. 1997). To check: [[w.vollers-ghosts-of-mississippi]]; [[w.nossiter-of-long-memory]]. See [[cal.1963-06-12.mississippi]]. Names: Beckwith, Evers.'
    tags: [name:beckwith-byron-de-la, name:evers-medgar]
  - id: cal.1964-04-17.states-and-cities-san-francisco
    when: Apr. 17
    date: '1964-04-17'
    thread: states-and-cities
    also: [jobs-and-wages]
    c: San Francisco, Auto Row. The Lincoln-Mercury dealer settles; the dealers and the demonstrators give pledges on hiring to Shelley's interim committee on human relations (Check the day).
    n: 'Jo Freeman, ["Freedom Now! to Free Speech"](https://www.foundsf.org/index.php?title=Freedom_Now!_to_Free_Speech:_How_the_1963-64_Bay_Area_Civil_Rights_Demonstrations_Paved_the_Way_to_Campus_Protest) (FoundSF). See [[cal.1964-03-14.states-and-cities-san-francisco]]. Names: Shelley.'
    tags: [state:ca, city:san-francisco, name:shelley-john-f]
  - id: cal.1964-04-18.defense
    when: Apr. 18
    date: '1964-04-18'
    thread: defense
    c: Press conference. A study of the draft and military manpower ordered, on McNamara's plan; among the alternatives, meeting the services' needs "on an entirely voluntary basis in the next decade."
    n: 'The President''s News Conference, [1963–64 Pub. Papers 485](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=569) (Apr. 18, 1964). To check: [[w.flynn-draft-1940-1973]]. Names: Johnson, McNamara.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1964-04-18.elections-1964-state-conventions
    when: Apr. 18
    date: '1964-04-18'
    thread: elections-1964-state-conventions
    c: Arizona's Republican State convention pledges its 16 delegates to Goldwater.
    n: '"State GOP Delegates for Barry," [*Arizona Republic*, Apr. 19, 1964](https://www.newspapers.com/image/116783570). The figures: [Wikipedia, "1964 Republican Party presidential primaries"](https://en.wikipedia.org/wiki/1964_Republican_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1964-02-29.elections-1964-state-conventions]]. Names: Goldwater. Check: the paper (newspapers.com, by subscription; not read here).'
    tags: [state:az, name:goldwater-barry-m]
  - id: cal.1964-04-19.laos
    when: Apr. 19
    date: '1964-04-19'
    thread: laos
    c: Laos. Before dawn, Generals Kouprasith and Siho seize Vientiane and hold Souvanna and the neutralists, the day after the three factions' summit fails. Washington backs the Government of National Union; Unger back from Saigon, William Bundy to Vientiane. Apr. 22, the embassy authorized to stop military supplies to the coup's forces. Souvanna kept in office; Check the date.
    n: 'FRUS 1964–68, XXVIII, docs. [22](https://history.state.gov/historicaldocuments/frus1964-68v28/d22), [29](https://history.state.gov/historicaldocuments/frus1964-68v28/d29), [36](https://history.state.gov/historicaldocuments/frus1964-68v28/d36). [[w.marolda-united-states-navy-and]], 375; [[w.anthony-war-in-northern-laos]], 99. To check: [[w.dommen-conflict-in-laos]]; [[w.stevenson-end-of-nowhere]]. See [[cal.1963-04-20.laos]]. Names: Kouprasith, Siho Lamphouthacoul, Souvanna Phouma, Unger, William Bundy.'
    tags: [name:kouprasith-abhay, name:siho-lamphouthacoul, name:souvanna-phouma, name:unger-leonard, name:bundy-william, place:vientiane]
  - id: cal.1964-04-20.testing
    when: Apr. 20
    date: '1964-04-20'
    thread: testing
    c: 'Johnson to the Associated Press in New York: a further cut in enriched uranium over four years; with the earlier cuts, plutonium production down 20 percent, enriched uranium 40. Khrushchev the same hour: two plutonium reactors not to be built, U-235 production cut. Douglas-Home consulted.'
    n: 'Remarks on Foreign Affairs at the Associated Press Luncheon in New York City, [1963–64 Pub. Papers 493](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=577) (Apr. 20, 1964); White House Statement following a Review of Implementation of the Limited Test Ban Treaty Safeguards, [1963–64 Pub. Papers 502](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=586) (Apr. 20, 1964). [[w.poole-joint-chiefs-of-staff]], 88. To check: [[w.seaborg-stemming-the-tide]]. See [[cal.1963-10-07.testing]]; [[cal.1964-01-08.program]]. Names: Johnson, Khrushchev, Douglas-Home.'
    tags: [name:johnson-lyndon-b, name:khrushchev-nikita-s, name:douglas-home-alec]
