    c: 'The Senators'' opening game, Johnson throwing out the first ball, Senators of both parties with him. Between the third and fourth innings, about 2:20 p.m., the public address: "All U.S. Senators are requested to return to the chamber."{1} A quorum call; Russell stays in his seat.{2} The Leadership Conference''s four limousines carry them the mile in some eight minutes; the quorum made just after 2:30. Humphrey: "We have returned!"{3}'
    n: '[[w.zelizer-fierce-urgency-of-now]], 110–11; [[w.whalen-longest-debate]], 162 (seventeen Senators at the game; the call at the end of the third inning); [[w.mann-walls-of-jericho]], 408 (Humphrey, Mansfield, Dirksen and Russell at the game; the call barely three innings in, Gartner to telephone the stadium, the message Humphrey''s; Russell "never moved"); [[w.risen-bill-of-the-century]], 201–02 (Apr. 13, opening day at D.C. Stadium, Johnson with Dirksen, Mansfield, Humphrey, Russell and thirteen others; Dirksen had told Humphrey no quorum calls that day; a dozen senators leave for limousines, back in eight minutes; a handful of Southerners, Russell among them, stay); [[w.purdum-idea-whose-time-has-2014]], 258–59 (the quorum call at 2:20 p.m. that Holland raised, the announcer at D.C. Stadium alerting the crowd; fifteen pro-civil-rights Senators hurrying back; Russell, a baseball fan, staying in his seat; not Johnson''s first pitch, the limousines nor Humphrey''s words). Check: Risen, 201–02, has Holland suggest the absence of a quorum around 2:30 p.m. and the stadium''s announcement "a few minutes later," in the third inning; the entry has the announcement about 2:20 p.m. and the quorum made just after 2:30. To check: Tom Wicker, "Johnson, in Debut, Lasts Nine Innings of Baseball and Two of Politics," [*New York Times*, Apr. 14, 1964](https://timesmachine.nytimes.com/timesmachine/1964/04/14/issue.html); John H. Averill, "Senators Rush from Ball Game," *Los Angeles Times*, Apr. 14, 1964; Maire McNair, "The Real Senators Lost Game First," *Washington Post*, Apr. 15, 1964 (cited by [[w.zelizer-fierce-urgency-of-now]], 110–11 nn.53–55). See [[cal.1964-03-30.civil-rights-bill]]. Names: Johnson, Russell, Humphrey.'
    src:
