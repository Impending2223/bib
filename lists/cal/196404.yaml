  - id: cal.1964-04-23.china-leadership-7
    when: Apr. 23
    date: '1964-04-23'
    thread: china-economy
    also: [china-agriculture]
    c: 'Zhu De 朱德 reports to the Center 中共中央 and Mao Zedong 毛泽东 on his tour. The rural scene: in country and town alike, political and economic conditions better than in earlier years, but farming, cash crops and the many lines not yet fully restored; the old disaster areas need great effort and time, the peasants'' living still very low. Water conservancy: build more middle-sized and small reservoirs in the hills upstream, holding the water there, and pump water by machine along the rivers on a large scale; hill land can then be terraced and power made in steps, at small cost and great return. Farming: on the base of grain, push cash crops and the many lines hard; places that have always lived by them lose, state and collective, if they are not restored; only so can farming give industry more raw materials and the home market and foreign trade more goods, the teams more income and accumulation, industry a market, town and country, home and abroad, a better exchange.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1906–1907. Made public: 2016. Names: Zhu De, Mao Zedong.'
    tags: [polity:prc, ok:fields-place, name:zhu-de, name:mao-zedong, vis:only:prc]
