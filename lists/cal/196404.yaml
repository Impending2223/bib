  - id: cal.1964-04.mississippi-ms
    when: Apr.
    date: 1964-04
    thread: mississippi
    also: [crime-and-hijacking, civil-rights-organizations, desegregation-schools]
    c: 'Against Freedom Summer: by Apr. 30, Paul Johnson signs five bills: cities may restrict the movement of groups and set curfews (H.B. 64); picketing of public buildings and streets barred (H.B. 546); city courts'' penalties raised (S.B. 1517); cities to pool police (S.B. 1526); printing or circulating a call to boycott, up to $500 and six months (S.B. 1545). He asks more power for the Highway Patrol. The same session, State tuition grants for pupils at private schools, $185 a year (Check).'
    n: 'SNCC, ["Mississippi Readies Laws for Freedom Summer"](https://www.crmvet.org/docs/pr/640430_sncc_pr_fslaws.pdf), news release, Apr. 30, 1964. Check: Miss. Laws 1964. [[w.dittmer-local-people]], 224, 228–29. Freedom Summer: [[cal.1964-06-14.mississippi]]. To check: [[w.watson-freedom-summer]]; [[w.bolton-hardest-deal-of-all]] (the tuition grants). Names: Paul Johnson.'
    tags: [state:ms, name:johnson-paul-b-jr]
