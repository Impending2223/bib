    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1964-04-01.latin-america
    when: Apr. 1
    date: '1964-04-01'
    thread: latin-america
    c: Early morning, Brazil's revolt under way. Ball, by his account Acting Secretary, on Gordon's pleas from Brasília and after checking with the Latin Americanists, authorizes a telegram that in effect endorses the coup, at 3 a.m., without waking the President.
    n: '[[w.ball-past-has-another-pattern]], 429. Check: Ball has Rusk away; FRUS''s teleconference with Rio of Apr. 1, 1500Z, has the Secretary present ([FRUS 1964–68, XXXI, doc. 201](https://history.state.gov/historicaldocuments/frus1964-68v31/d201)); the telegram not found. See [[cal.1964-03-31.latin-america]]. Names: Ball, Gordon.'
    src:
      c: f64e872f
      rows:
        - 'w.ball-past-has-another-pattern 429: all'
    tags: [name:ball-george-w, name:gordon-lincoln]
  - id: cal.1964-04-01.latin-america-2
    when: Apr. 1
    date: '1964-04-01'
    thread: latin-america
    c: 'Johnson to Ball, the next morning, by Ball''s account: "Don''t ever do that again"; whatever the hour, he wants to know what is being done. Thereafter Ball wakes him a time or two a month.'
    n: '[[w.ball-past-has-another-pattern]], 429–30. See [[cal.1964-04-01.latin-america]]. Names: Johnson, Ball.'
