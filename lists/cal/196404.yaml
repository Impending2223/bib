  - id: cal.1964-04-03.latin-america
    when: Apr. 3
    date: '1964-04-03'
    thread: latin-america-panama
    c: 'Panama. Bunker and Moreno sign a joint declaration at the OAS: relations restored; special ambassadors, in Johnson''s words, to seek "the prompt elimination of the causes of conflict" "without limitations or preconditions of any kind." Robert B. Anderson named for the United States. Johnson telephones Chiari.'
    n: 'Remarks following the Signing of a Joint Declaration With Panama, [1963–64 Pub. Papers 436](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=520) (Apr. 3, 1964); The President''s News Conference, [1963–64 Pub. Papers 404](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=488) (Mar. 21, 1964) (the impasse). FRUS 1964–68, XXXI, docs. [409](https://history.state.gov/historicaldocuments/frus1964-68v31/d409), [410](https://history.state.gov/historicaldocuments/frus1964-68v31/d410). [[w.johnson-vantage-point]], 184 (Chiari''s agreement). See [[cal.1964-01-09.latin-america]]. Names: Johnson, Bunker, Chiari, Moreno, Anderson.'
    src:
      c: f2bff78b
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=520: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=488: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v31/d409: all'
