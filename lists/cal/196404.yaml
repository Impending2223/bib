  - id: cal.1964-04-02.desegregation-public-places
    when: Apr. 2
    date: '1964-04-02'
    thread: desegregation-public-places
    c: 'Jacksonville. Judge Bryan Simpson hears Kunstler and Pratt''s petition to remove the St. Augustine demonstrators'' cases to federal court: "Somebody goes and sticks their head in a noose and then complains that the rope burns their neck." He remands some three hundred cases to the county judge; by his order of Apr. 3, no trial before May.'
    n: '[[w.branch-pillar-of-fire]], 282–83. To check: Transcript of Findings by Judge Bryan Simpson, April 2, 1964, Bryan Simpson papers, p. 35, UF (cited by [[w.branch-pillar-of-fire]], 283); Order of April 3, 1964, in David Robinson et al. v. State of Florida, Bryan Simpson Papers, p. 46, UF (cited by [[w.branch-pillar-of-fire]], 283). See [[cal.1964-03-31.desegregation-public-places-fl]].'
