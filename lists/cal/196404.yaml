    c: 'Mao revises and approves the Central Committee''s letter to the CPSU Central Committee in reply to its letter of Mar. 7 (Kang Sheng and Wu Lengxi''s draft of Apr. 29): sends it to the Standing Committee.{1} The CPSU has lost its way on the date of a meeting; most parties fear a splitting meeting.{2} Mao adds four paragraphs: what talks and a meeting could do but quarrel;{3} China is against a split; two-party talks should be put off to next May; no party may call a world conference against the rule of consultation.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964. [[w.lengxi-shinian-lunzhan-1956-1966]], 770–771 (Mao, back in Peking "on the eve of May Day", at a meeting at his home Apr. 30 on the revision: the CPSU''s baton no longer works; the Italian, Polish, Swedish and Norwegian parties do not want a meeting, fewer than ten are for it; the conference to be opposed outright, no 17-party committee and no conference without Soviet–Chinese talks and agreement; the preparation to be put at four or five years or more, not two or three; a passage added asking what talks and a conference could be but a quarrel or a split, "do you want to split today?"); [[w.jianguo-yilai-mao-zedong]], XVII, 244–247 (Apr. 30, 1964; the note to Kang Sheng and Wu Lengxi, "and tell the Standing Committee", on their letter of Apr. 29 sending the drafts to the CPSU and the Romanian party; Mao''s marginal note that the letters print best May 8 or 9; printed from *Renmin ribao*, May 9, 1964, with his manuscript and revised copy); [[w.mao-zedong-zhuan]], V, ch. 71 (Apr. 30 Mao revises the reply to the CPSU letter of Mar. 7, adding the points on stopping the polemic and on the conference (n.41); his note to Kang Sheng and Wu Lengxi: the CPSU''s rules are in disorder, most parties fear a splitting meeting (n.42)). Made public: 1999. Check: Wu (770) has Mao, back in Peking "on the eve of May Day", hold a meeting at his home on Apr. 30 on the revision of the reply, and add two passages to it, not four. To check: the letter of May 7, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Apr. 30, 1964); the CPSU letter of Mar. 7; Kang Sheng and Wu Lengxi to Mao Zedong, letter of Apr. 29, 1964 sending the draft replies to the CPSU and Romanian Central Committees (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 246 n.1); Mao Zedong 毛泽东, revision of the draft reply of the Central Committee to the CPSU Central Committee''s letter of Mar. 7 (manuscript 手稿), Apr. 30, 1964 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 