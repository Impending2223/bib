    c: 'Johnson in the depressed areas: South Bend, Studebaker''s plant closed; Pittsburgh;{1} Paintsville and Inez, Ky.;{2} Huntington, W. Va., with the Appalachian governors.{3} Apr. 28, the Appalachian bill to Congress, with the regional commission''s report: 2,350 miles of development highways, $920 million;{4} water projects; timber, mineral and land programs.{5}'
    n: 'Remarks at the Lulu V. Cline School, South Bend, Indiana, [1963–64 Pub. Papers 532](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=616); Remarks at the Johnson County Courthouse, Paintsville, Kentucky, [1963–64 Pub. Papers 543](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=627); Remarks at the Airport, Huntington, West Virginia, Upon Departing for Washington, [1963–64 Pub. Papers 545](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=629) (Apr. 24, 1964); The President''s News Conference, [1963–64 Pub. Papers 547](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=631) (Apr. 25, 1964); Letter to the President of the Senate and to the Speaker of the House Transmitting the Bill for the Appalachian Region, [1963–64 Pub. Papers 586](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=670) (Apr. 28, 1964). [[w.branch-pillar-of-fire]], 290–91; [[w.sundquist-politics-and-policy]], 103 (Huntington, the governors; the commission''s report, April, and the bill three weeks later); [[w.zelizer-fierce-urgency-of-now]], 115–16 (Pittsburgh: the bill "if it takes all summer"); [[w.bernstein-guns-or-butter]], 106 (the tour of Appalachia in one day; Tom Fletcher, an unemployed sawmill worker in eastern Kentucky, father of eight); [[w.johnson-white-house-diary]], 117–23 (the day from Chicago, 5:30 a.m.: South Bend, the Cline School, some 15,000, Studebaker''s 8,700 out of work since Christmas Eve, Johnson''s speech from the athletic field; Bunker Hill Air Force Base; Pittsburgh, the League of Women Voters'' convention, Wirtz having brought Johnson along, and the motorcade, a quarter of a million by the police; Inez, Ky., Tom Fletcher''s porch; Paintsville, the courthouse speech; Huntington, nearly two hours with Welsh, Breathitt, Barron and Scranton''s representative on the Appalachian plan, about $3 billion over five years, then the televised speech; with Wirtz, Hodges, Franklin Roosevelt Jr. and Celebrezze; all day, "We are going to have a Civil Rights Bill if it takes all summer"; not the bill of Apr. 28). Check: Bernstein, 106, has "a whirlwind tour of five states in Appalachia in one day," repeated "soon afterward.". To check: [[w.caudill-night-comes-to-the]]; [[w.eller-uneven-ground]]; [[w.commission-appalachia]]. See [[cal.1964-03-16.poverty]]. Names: Johnson.'
