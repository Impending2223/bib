    n: '[[w.mann-walls-of-jericho]], 286–87. Check: the day; Mann gives "with one week to go." To check: *Time*, Nov. 7, 1960; *Newsweek*, Oct. 24, 1960 (cited by [[w.mann-walls-of-jericho]], 286). See [[cal.1960-10-10.elections-1960]]. Names: Johnson, Nixon.'
