  - id: cal.1960-11-01.elections-1960-kennedy-2
    when: Nov. 1
    date: '1960-11-01'
    thread: elections-1960-kennedy
    c: 'Los Angeles, the Elks Auditorium. Kennedy with Sen. Engle, Rep. Roosevelt, Hawkins and Unruh: "I stand today as the standard bearer of the Democratic Party, in direct line and succession to Woodrow Wilson and Franklin Roosevelt and Harry Truman." Nixon called the $1.25 minimum wage "extreme."'
    n: 'Remarks of Senator John F. Kennedy, Elks Auditorium, Los Angeles, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-elks-auditorium-los-angeles-ca) (Nov. 1, 1960). [[w.communications-freedom-of-communications-part]], 844–46. Names: Kennedy, Engle, Nixon, Truman, Roosevelt, Hawkins, Unruh.'
    tags: [name:kennedy-john-f, name:engle-clair, name:nixon-richard-m, name:truman-harry-s, name:roosevelt-james, name:hawkins-augustus-f, name:unruh-jesse-m, state:ca, city:los-angeles]
  - id: cal.1960-11-01.elections-1960-kennedy-3
    when: Nov. 1
    date: '1960-11-01'
    thread: elections-1960-kennedy
    also: [labor]
    c: 'Los Angeles, the garment section. Kennedy with Rep. Roosevelt and Attorney General Mosk: "can anyone in this square tell me one piece of progressive legislation sponsored by Mr. Nixon or the Republican Party?" Seven more days; "Viva, let''s go, let''s move ahead."'
    n: 'Excerpts of Remarks by Senator John F. Kennedy, Clothing Workers'' Rally, Garment Section, Los Angeles, CA - (Advance Release Text), [APP](https://www.presidency.ucsb.edu/documents/excerpts-remarks-senator-john-f-kennedy-clothing-workers-rally-garment-section-los-0) (Nov. 1, 1960). [[w.communications-freedom-of-communications-part]], 846–47. Names: Kennedy, Nixon, Roosevelt, Mosk.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:roosevelt-james, name:mosk-stanley, state:ca, city:los-angeles]
  - id: cal.1960-11-01.elections-1960-kennedy-4
    when: Nov. 1
    date: '1960-11-01'
    thread: elections-1960-kennedy
    c: 'Redondo Beach, Calif., the South Bay Shopping Center. Kennedy with Mayor Richards, Gov. Brown and Rep. King: "A week from today" the election. Nixon argues prestige "has never been higher"; Kennedy ends with Lincoln''s letter, "a place and a part."'
    n: 'Remarks of Senator John F. Kennedy, South Bay Shopping Center, Redondo Beach, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-south-bay-shopping-center-redondo-beach-ca) (Nov. 1, 1960). [[w.communications-freedom-of-communications-part]], 847–49. Names: Kennedy, Nixon, Brown, King.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:brown-edmund-g, name:king-cecil-r, state:ca]
  - id: cal.1960-11-01.elections-1960-kennedy-5
    when: Nov. 1
    date: '1960-11-01'
    thread: elections-1960-kennedy
    c: 'Long Beach, Calif., the Douglas plant. Kennedy asks help "in retiring the Republicans and sending them out of Washington"; Nixon takes a ride through New York with Rockefeller, Lodge and Eisenhower: "if he won''t come and meet me in a fifth debate, how is he going to stand up to Mr. Khrushchev?" Congress passed $370 million for the B-70.'
    n: 'Remarks of Senator John F. Kennedy, Douglas Plant, Long Beach, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-douglas-plant-long-beach-ca) (Nov. 1, 1960). [[w.communications-freedom-of-communications-part]], 849–50. Names: Kennedy, Nixon, Rockefeller, Lodge, Eisenhower, Khrushchev.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:rockefeller-nelson, name:lodge-henry-cabot, name:eisenhower-dwight-d, name:khrushchev-nikita-s, state:ca]
  - id: cal.1960-11-01.elections-1960-kennedy-6
    when: Nov. 1
    date: '1960-11-01'
    thread: elections-1960-kennedy
    c: 'Los Angeles, the East Los Angeles College Stadium, evening. Stevenson introduces him; Gov. Brown and Sen. Engle present. Kennedy: "I have traveled in every State in the Union in the last 2 years"; Truman''s sign "The buck stops here"; for four years the reins "will be in his hands."'
    n: 'Speech of Senator John F. Kennedy, East Los Angeles College Stadium, Los Angeles, CA, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-east-los-angeles-college-stadium-los-angeles-ca) (Nov. 1, 1960). [[w.communications-freedom-of-communications-part]], 850–53. Names: Kennedy, Stevenson, Engle, Truman, Brown.'
    tags: [name:kennedy-john-f, name:stevenson-adlai-e, name:engle-clair, name:truman-harry-s, name:brown-edmund-g, state:ca, city:los-angeles]
