    c: 'Eisenhower, after seeing Pawley, asks his advisers whether the Cuba program is "sufficiently imaginative and bold," and wants no emergency handed to his successor.{1} Dulles: some 500 exiles in training in Guatemala;{2} the new paramilitary concept.{3} Eisenhower wants the project expedited.{4}'
