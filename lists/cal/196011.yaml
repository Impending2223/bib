  - id: cal.1960-11.transition-and-staff-cabinet-5
    when: Nov., end
    date: 1960-11
    thread: transition-and-staff-cabinet
    c: 'Georgetown, breakfast, by Bowles''s account. Kennedy to Bowles: "If you were Secretary of State, what kind of an organization would you set up?" Bowles: "I think I''d start by asking Dean Rusk to become Undersecretary." Kennedy asks if Rusk is not the president of the Rockefeller Foundation. Rusk not on the list for Secretary until then.'
    n: '[[w.wofford-of-kennedys-and-kings]], 83 (Bowles''s account; the breakfast four days before the Rockefeller trustees'' meeting at Williamsburg). Check: the day; Wofford puts the breakfast after the end-of-November talk with Stevenson, four days before Williamsburg, [[cal.1960-12-04.transition-and-staff-cabinet]]. Names: Kennedy, Bowles, Rusk.'
    tags: [name:kennedy-john-f, name:bowles-chester, name:rusk-dean, city:washington]
  - id: cal.1960-11.transition-and-staff-cabinet-4
    when: Nov., end
    date: 1960-11
    thread: transition-and-staff-cabinet
    c: 'Kennedy asks Stevenson to be Ambassador to the United Nations, with Cabinet status: with the slim Democratic majority in Congress he needs a Secretary of State "not so controversial." Stevenson will not accept without knowing who will be Secretary of State; alarmed by word that Kennedy is thinking of Bundy. Kennedy, irritated, "was about to tell him that he couldn''t have even that," by Robert Kennedy''s later account.'
    n: '[[w.wofford-of-kennedys-and-kings]], 82–83 (Robert Kennedy''s later account of Kennedy''s irritation; Wofford''s own word on Stevenson''s opposition to Bundy). Check: the day; Wofford has "the end of November". See [[cal.1960-11.transition-and-staff-cabinet-3]]. Names: Kennedy, Stevenson, Bundy, Robert Kennedy.'
    tags: [name:kennedy-john-f, name:stevenson-adlai-e, name:bundy-mcgeorge, name:kennedy-robert-f]
  - id: cal.1960-11.cuba
    when: Nov., early
    date: 1960-11
    thread: cuba
    c: Miami. Hughes, by telephone, asks Maheu to come back to the West Coast. Maheu, by his testimony of 1975, "definitely told him that the project was on behalf of the United States Government, that it included plans to dispose of Mr. Castro in connection with a pending invasion."
    n: '[[w.sen-church-alleged-assassination-plots]], 75 n.2 (Maheu, testimony, July 29, 1975, 22–23: "shortly before the election in November 1960"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-10-31.crime-and-hijacking-maheu]]. Names: Hughes, Maheu, Castro. Check: the day.'
    tags: [name:hughes-howard-r-jr, name:maheu-robert-a, name:castro-fidel]
