    c: 'Mao 毛泽东, on the Center''s notice forbidding feasts and gifts and stopping new guesthouses, sent him by Zhou Enlai 周恩来 Oct. 23: ''Back to Fuchun to handle.'' He sets its date of issue at Nov. 3. The notice: no gifts from any body to any unit or person; new products'' samples only to the ministry in charge; no welcomes or send-offs for leaders on tour, no banquets; meetings cut; no new guesthouses or other non-productive building for seven years.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 387–388 (Nov. 3, 1960; Mao''s comment, printed from the manuscript; note 1, the notice and its date). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Central Committee, notice "Forbidding feasts and gifts and stopping the building of new guesthouses", dated Nov. 3, 1960 (drafted by Xi Zhongxun, Qi Yanming and others; sent by Zhou Enlai Oct. 23) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 387 n.1). See [[cal.1960-10-23.china-leadership-5]]. Names: Mao Zedong, Zhou Enlai, Li Fuchun. Check: the day the Center issued it; Zhou''s chronology says Nov. 3.'
