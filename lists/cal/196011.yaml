    thread: china-leadership
    c: 'Mao drafts the Center''s directive on the "five winds," with Wang Renzhong''s reports on Mianyang county: in a few months the "communist wind," exaggeration, coercion, cadres'' privilege and blind orders on production to be stopped, the "communist wind" first.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 15, 1960. [[w.macfarquhar-origins-of-the-cultural]], III, 12 (the "five styles" directive); [[w.jianguo-yilai-mao-zedong]], XV, 401–405 (Nov. 15, 1960; the directive, dated by the Center Nov. 15, from Mao''s manuscript: Wang Renzhong''s report, Mianyang 沔阳 county''s summary and the Tonghaikou commune report sent for reference; the ''five winds'' to be corrected within months, the ''communist wind'' first; the Center to call the secretaries in early or mid-December; and Mao''s note of the same day: to Zhou, Zhu De, Li Fuchun, Tan Zhenlin, Li Xiannian and Chen Boda, then Li Fuchun to handle; too long to telegraph, to be printed and sent at once, not to Tibet or Xinjiang); [[w.mao-zedong-zhuan]], V, ch. 66 n.62 (Nov. 15, Mao drafts for the Center the directive to the bureaus and committees with Wang Renzhong''s papers on Hubei and Mianyang: the five winds, the communist wind first, to be put right in a few months). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 66), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.zhongguo-baike-nianjian-1981]], 563 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.10); Wang Renzhong, second secretary of the Central-South Bureau and first secretary of the Hubei Party committee, report of Nov. 12, 1960 to Tao Zhu and Mao Zedong, "On correcting the ''five winds''" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 402 n.1); Mianyang County Party Committee, "Summary of the first stage of carrying out policy", Nov. 3, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 403 n.2); Ma Jie 马杰, first secretary of the Mianyang County Party Committee, report of Nov. 9, 1960, "The changes in Tonghaikou commune after carrying out the policy" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 404 n.3). Names: Mao Zedong, Wang Renzhong.'
