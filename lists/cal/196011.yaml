  - id: cal.1960-11-30.soviet-union
    when: Nov. 30
    date: '1960-11-30'
    time: 1960-11-30T08:00Z
    place: moscow
    thread: soviet-union
    also: [china-leadership, comecon]
    c: 'Moscow, the Lenin Hills conference hall, 11 a.m. to 2 p.m. Liu Shaoqi, Deng Xiaoping and Peng Zhen meet Khrushchev, Suslov and Kozlov.{1} Khrushchev agrees to the Peng–Kozlov understanding, the Twentieth Congress wording still to be settled. Peng: some parties differ on the wording against the personality cult; Khrushchev: keep both formulas. Liu: China agreed with the Twentieth Congress''s criticism of Stalin''s errors, not with wholesale rejection of Stalin or with the lack of consultation; China''s own Eighth Congress and a resolution of 1948 stand against the cult; since parties object the wording is to change. Khrushchev agrees in principle and attacks Albania at length; Liu: the CPSU a large party should have a large party''s breadth, not strike Albania; he does not answer. Khrushchev agrees to end the argument, to return to the good relations of 1957, and that the two delegations settle the Twentieth and cult wording at once for signing tomorrow. Liu asks him to say less and keep out of the first line of the quarrel; "much talk, many slips"; disputes to be settled between the two parties first, then taken to international meetings; Khrushchev agrees, not owning that he talks too much. Liu''s state visit after the conference reconfirmed; Khrushchev: warm welcome, to show unity and to show the Americans. Liu: unity whatever the differences; differences by consultation within, no open polemic, named or unnamed. Two points fixed: Khrushchev to hold back; consultation to unanimity at international meetings, parties'' and mass organizations''. Deng and Suslov at the talks agree that neither side will polemicize in print, named or unnamed, differences to go to the two parties'' negotiators. Mikoyan comes in at the end for a photograph, seven in all, Deng with a stick; printed on *Renmin ribao*''s front page Dec. 8.{2} Liu''s state visit is settled at five days to a week, with Yang Shangkun, Li Jingquan, Lu Dingyi, Liu Ningyi and Liu Xiao, subject to the Center.{3}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 415–418, 428 ("from 11 in the morning until 2 in the afternoon"; the press agreement "on the morning of the 30th" (428); the photograph, 418); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 496 (Nov. 30, 1960; Liu, with Deng Xiaoping and others, meets Khrushchev and the Presidium member and Secretary Kozlov and Suslov); [[w.yang-shangkun-riji]], I, 634 (Nov. 30, 1960; 11 a.m. to 2 p.m.; Khrushchev, Kozlov, Suslov; Liu on unity, on Albania; the two parties to end the polemic and go back to before 1957; Liu''s state visit settled in principle, Li Jingquan, Lu Dingyi, Yang, Liu Ningyi and Liu Xiao with him); [[w.deng-xiaoping-nianpu-1904]], III, 1602 (Nov. 30, 1960; morning; Deng, with Liu and Peng Zhen, with Khrushchev, Suslov and Kozlov; both for unity, the dispute ended, relations back to the level before 1957); [[w.peng-zhen-nianpu-1902]], IV, 81–82 (Nov. 30, 1960, morning; Peng Zhen, with Liu Shaoqi and Deng Xiaoping, talks with Khrushchev, Kozlov and Suslov; both wish the quarrel ended and relations as before 1957; Liu: Sino-Soviet unity and the twelve countries'' unity most important; Liu''s state visit settled at five days to a week, with Yang Shangkun, Li Jingquan, Lu Dingyi, Liu Ningyi and Liu Xiao, subject to the Center); [[w.peng-zhen-nianpu-1902]], IV, 82. Made public: 1996. See [[cal.1960-11-29.soviet-union-3]]. Names: Liu Shaoqi, Deng Xiaoping, Peng Zhen, Khrushchev, Suslov, Kozlov, Mikoyan, Yang Shangkun, Li Jingquan, Lu Dingyi, Liu Ningyi, Liu Xiao. Check: the account is the Chinese delegation''s.'
