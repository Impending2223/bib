    c: 'Mao 毛泽东, on the Center''s notice forbidding feasts and gifts and stopping new guesthouses, sent him by Zhou Enlai 周恩来 Oct. 23: ''Back to Fuchun to handle.'' He sets its date of issue at Nov. 3. The notice: no gifts from any body to any unit or person; new products'' samples only to the ministry in charge; no welcomes or send-offs for leaders on tour, no banquets; meetings cut; no new guesthouses or other non-productive building for seven years.'
