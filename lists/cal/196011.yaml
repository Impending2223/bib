  - id: cal.1960-11-02.elections-1960-3
    when: Nov. 2–3
    date: '1960-11-02'
    thread: elections-1960
    c: 'New York, Nixon''s suite at the Waldorf, from eleven at night to after two, by Nixon''s account. On religion in the last days: Mitchell, William Miller of the Republican Congressional Campaign Committee and Flanigan of the Volunteers for Nixon-Lodge have urged a speech against "reverse bigotry"; Flemming has drafted one. All in the room for a speech; Nixon against, and the subject closed.'
    n: '[[w.nixon-six-crises]], 364–68. Names: Nixon, Mitchell, Miller, Flanigan, Flemming.'
    src:
      c: c467c1fd
      rows:
        - 'w.nixon-six-crises 364–68: all'
    tags: [name:nixon-richard-m, name:mitchell-james-p, name:miller-william-e, name:flanigan-peter-m, name:flemming-arthur-s]
  - id: cal.1960-11-03.elections-1960
    when: Nov. 3
    date: '1960-11-03'
    thread: elections-1960
    also: [south-carolina]
    c: 'Columbia, the steps of the State House. Byrnes introduces Nixon: "We must vote for the man and not for the label." The *State*''s count, 35,000, three times Kennedy''s crowd of October. Nixon: the Democratic platform forgets "individual rights and local and State responsibility"; in his statement on arrival, Kennedy''s retraining of textile workers would close the mills.'
    n: 'Remarks of the Vice President at State House, Columbia, SC, [APP](https://www.presidency.ucsb.edu/documents/remarks-the-vice-president-state-house-columbia-sc) (Nov. 3, 1960). [[w.gifford-center-cannot-hold]], 162–63. [[w.nixon-six-crises]], 369 (Columbia, the State House steps; Byrnes''s introduction). To check: James F. Byrnes''s introduction of Nixon, Nov. 3, 1960, at the State House, Columbia, S.C., William D. Workman Jr. Papers, South Caroliniana Library (cited by [[w.gifford-center-cannot-hold]], 162 n.70); Columbia State, Nov. 4, 1960, 1 (cited by [[w.gifford-center-cannot-hold]], 162 n.72); The Speeches of Vice President Richard M. Nixon, Presidential Campaign of 1960 (1961), 973–78, U.S. Government Printing Office, printed (cited by [[w.gifford-center-cannot-hold]], 163 n.73); Statement of the Vice President upon arrival in South Carolina, Nov. 3, 1960, William D. Workman Jr. Papers, South Caroliniana Library (cited by [[w.gifford-center-cannot-hold]], 163 n.74). See [[cal.1960-09-23.elections-1960]]. Names: Byrnes, Nixon, Kennedy. Check: Nixon gives a crowd of 30,000 (*Six Crises*, 369).'
