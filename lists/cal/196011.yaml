    c: 'The Center''s reply to Liu Shaoqi 刘少奇, Deng Xiaoping and Peng Zhen in Moscow, Zhou''s draft of 10 p.m., read by Mao Zedong 毛泽东: no signature without changes of principle, even if China alone, or China and Albania, refuse; the cost perhaps blockade and a local war in the Far East. Zhou rewrites, after the Politburo''s meeting, the answer drafted by Li Fuchun 李富春 and Chen Boda 陈伯达 and sends it to Mao to approve.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 16, 1960 (under Nov. 16: 周恩来于十七日晚十时，为中共中央起草的给刘少奇、邓小平、彭真的电报，经毛泽东审阅后发出; the terms: no signature without changes of principle, even if 只有我一个党或中阿两个党不签字; the cost, 东西经济封锁和远东局部战争). [[w.zhou-enlai-nianpu-1949]], II, 370 (Nov. 17, 1960: 会后改写由李富春、陈伯达起草的给出席莫斯科会议的中共代表团的复电,并送毛泽东批发; no hour). To check: [[w.peng-zhen-nianpu-1902]], IV, 75 (Nov. 17, 1960). Made public: 1997. It follows the Politburo''s meeting (会后). See [[cal.1960-11-17.china-leadership]]. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Mao Zedong, Li Fuchun, Chen Boda.'
    tags: [polity:prc, name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:mao-zedong, name:li-fuchun, name:chen-boda, vis:only:prc]
