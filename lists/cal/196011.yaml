    c: 'The party group of the Academy of Sciences 中國科學院黨組 writes the Center and Mao Zedong 毛澤東 with its proposal to make grain substitutes on a large scale 關於大辦糧食代用品的建議. After the Center''s instruction to support agriculture, it has worked in recent months on substitutes, and offers those it takes to be nourishing, harmless, plentiful in material and simple to make: acorn flour, maize-root and wheat-root flour, leaf protein, "artificial meat essence" (a yeast), chlorella, scenedesmus and a sea alga. It counts over 8 billion jin of acorns a year, of which a fifth made into flour would give 600 to 700 million jin, and several billion jin of flour from a fifth of the maize and wheat roots.'
