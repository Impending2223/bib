    when: Nov. 29
    date: '1960-11-29'
    thread: china-famine
    c: 'Li Xiannian 李先念, on Chen Yun''s 陈云 view, writes to Mao Zedong 毛泽东, Zhou Enlai 周恩来 and others and the Center: to get through next spring''s hunger and steady the grain situation, 1.2 billion jin of grain, or more, to be imported.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 57. See [[cal.1960-11.china-leadership-29]]. Made public: 2013 ([[w.zedong-mao-zedong-nianpu]], IV, under Dec. 12, 1960, as the calendar cites it for Mao''s comment on the letter). Names: Li Xiannian, Chen Yun, Mao Zedong, Zhou Enlai.'
