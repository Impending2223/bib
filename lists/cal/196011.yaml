  - id: cal.1960-11-05.elections-1960
    when: Nov. 5
    date: '1960-11-05'
    thread: elections-1960
    c: 'Claude Robinson''s final estimate for Nixon: 51 percent or more in States with 176 electoral votes, 50 percent in seven with 78, 49 percent or less in the rest, with 283.'
    n: '[[w.kallina-kennedy-v-nixon]], 175. To check: Claude Robinson to Nixon, Hall, Finch, Nov. 10, 1960, "Variations between Our Vote Estimates and the Election," Nixon Library (cited by [[w.kallina-kennedy-v-nixon]], 175 n.48). See [[cal.1960-10-21.elections-1960-2]]. Names: Nixon. Check: Kallina found the estimate only in Robinson''s memorandum of Nov. 10 (250 n.48).'
    src:
