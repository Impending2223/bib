'Donnell a Special Assistant. Neustadt''s memoranda of Sept. 15 and Oct. 30 on organizing the transition: [[w.preparing-to-be-president]]. [[w.schlesinger-thousand-days-1965]], 124–25, 127 (Clifford''s memorandum; Clifford named; Hoover and Dulles; Sorensen and Salinger). To check: [[w.brauer-presidential-transitions]]; [[w.parmet-jfk]]; [[w.grose-gentleman-spy]]; [[w.gage-g-man]]. Names: Kennedy, Salinger, Sorensen, O''Donnell, Dulles, Hoover, Clifford, Persons, Eisenhower. Check: Clifford, 330–32, has his assignment, Sorensen''s and the keeping of Dulles and Hoover settled in Kennedy''s call "just before noon" on Thursday, Nov. 10.'
