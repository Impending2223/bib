  - id: cal.1960-11-02.congo-lumumba
    when: Nov. 2
    date: '1960-11-02'
    thread: congo-lumumba
    c: 'Headquarters to Léopoldville: QJ/WIN is to go to the Congo on a mission that "might involve a large element of personal risk." "In view of the extreme sensitivity of the objective" he is not told what is wanted, only to "spot, assess, and recommend some dependable, quick-witted persons for our use." The cable is to be "reduced to cryptic necessary notes and destroyed after the first reading."'
    n: '[[w.sen-church-alleged-assassination-plots]], 43 (the cable; the report calls QJ/WIN "a foreign citizen with a criminal background, recruited in Europe"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to Leopoldville, Nov. 2, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 43). See [[cal.1960-10-29.congo-lumumba]].'
  - id: cal.1960-11-02.elections-1960-kennedy
    when: Nov. 2
    date: '1960-11-02'
    thread: elections-1960-kennedy
    c: 'San Diego, the airport. Kennedy with Sen. Engle, Gov. Brown and the State''s Senator Fisher: California "is key"; unemployment in San Diego "to double in the last 12 months"; "final 5 or 6 days."'
    n: 'Remarks of Senator John F. Kennedy, Airport, San Diego, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-airport-san-diego-ca) (Nov. 2, 1960). [[w.communications-freedom-of-communications-part]], 857–58. Names: Kennedy, Engle, Brown.'
    tags: [name:kennedy-john-f, name:engle-clair, name:brown-edmund-g, state:ca, city:san-diego]
  - id: cal.1960-11-02.elections-1960-kennedy-2
    when: Nov. 2
    date: '1960-11-02'
    thread: elections-1960-kennedy
    c: 'San Diego, Horton Plaza. Kennedy with Gov. Brown and Sen. Engle: Nixon''s call three weeks ago for a housing program, though he "voted against the Housing Act of 1949"; Republicans 98 percent against medical care for the aged this summer, 90 percent against social security in the thirties.'
    n: 'Remarks of Senator John F. Kennedy, Horton Plaza, San Diego, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-horton-plaza-san-diego-ca) (Nov. 2, 1960). [[w.communications-freedom-of-communications-part]], 858–60. Names: Kennedy, Engle, Nixon, Brown.'
    tags: [name:kennedy-john-f, name:engle-clair, name:nixon-richard-m, name:brown-edmund-g, state:ca, city:san-diego]
