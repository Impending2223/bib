  - id: cal.1960-11-08.elections-1960-count-14
    when: Nov. 8
    date: '1960-11-08'
    thread: elections-1960-count
    c: 'Hyannis Port, Robert Kennedy''s house, the night. Kennedy draws O''Donnell aside and asks if he had expected to carry Ohio without trouble; O''Donnell had thought it as safe as Massachusetts. Kennedy: "That''s what I thought, too. Now a lot of guys around here are telling me that they knew we were in trouble in Ohio. If they felt that way, how come they never mentioned it until an hour ago?"'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 252 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell.'
