    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow.{1} Khrushchev speaks a second time, an hour and twenty minutes.{2} He backs those who attacked China;{3} the meeting is at "a very high level," most speeches a contribution;{4} only China and Albania hold to their own views on a string of questions.{5} He takes up the era, war and peace, coexistence, peaceful transition, national liberation, and Stalin, defending himself and agreeing with some Chinese points: imperialist aggression to be stopped by socialism and the peoples'' revolution, not that he fears war; two possibilities of transition, as the Twentieth Congress and the 1957 declaration said; condemning Stalin''s cult necessary, no time to consult the parties, and the CPSU has since passed a full resolution. He attacks China and Albania for factional activity and, unnamed, the cult of personality: some take themselves for saints and cannot be talked to. He ends: look ahead, argument has a limit, he can yield but not on principle, he does not fear struggle and wants unity. No one asks the floor; the chair rises.{6}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 392–394 ("on Nov. 23"; "1 hour 20 minutes"); [[w.yang-shangkun-riji]], I, 624–625 (Nov. 23, 1960; from 10 a.m.; organized applause and standing; the Chinese sit; not standing also Korea, Albania, India, Indonesia, Japan, Burma, Thailand, Malaya, New Zealand; Hoxha and Shehu there); [[w.deng-xiaoping-nianpu-1904]], III, 1599 (Nov. 23, 1960; the twelfth plenary; Khrushchev''s second speech, lower in tone, still naming the Chinese party: in a hard place, not to refuse to own its errors for pride); [[w.peng-zhen-nianpu-1902]], IV, 78 (Nov. 23, 1960, morning; Peng Zhen at the twelfth plenary; Khrushchev, his tone lowered, calls Deng''s speech "不知分寸," a slander on the CPSU, presses for the Twentieth Congress and "against group factional activity" in the statement, says many Chinese views wrong, hints at Mao; one hour forty minutes; organized applause, all rising; the Chinese sit, as do Korea, Albania, India, Indonesia, Japan, Burma, Thailand, "Manila" (so the page) and New Zealand; the Chinese ask to speak, Khrushchev proposes the next day, Deng agrees). Made public: 1999. See [[cal.1960-11-22.soviet-union]]. Names: Khrushchev. Check: the account is the Chinese delegation''s.'
    src:
