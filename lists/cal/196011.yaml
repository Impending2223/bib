    when: Nov. 9
    date: '1960-11-09'
    thread: elections-1960-count
    c: Hyannis, shortly before noon. Hagerty thanks Salinger again for holding back the Eisenhower wire; another will follow Nixon's concession. Klein has told him Nixon will concede at the Ambassador Hotel at 1 p.m. Eastern. By Salinger's account.
