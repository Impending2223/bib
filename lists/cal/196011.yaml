      rows:
        - 'w.kallina-kennedy-v-nixon 130: all'
        - 'via w.kallina-kennedy-v-nixon 130 n.35a: all'
    tags: [name:hoover-j-edgar, name:nixon-richard-m, name:ball-george-w, name:alphand-herve]
