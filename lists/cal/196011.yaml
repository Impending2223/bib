  - id: cal.1960-11-27.soviet-union
    when: Nov. 27
    date: '1960-11-27'
    place: moscow
    thread: soviet-union
    also: [vietnam-hanoi, china-leadership]
    c: 'Moscow. Hồ Chí Minh leads the petition group to the Chinese delegation. The Indonesian, Korean and Australian delegates are firm; the Japanese, fair; the Indian wants agreement; the Vietnamese press hardest for a compromise. The Chinese tell them what Mikoyan and Kozlov were told: the conference in effect an anti-China one; no signature unless the nails go and no resolution against China or by majority; the group to press the CPSU, and to bring Asian, African, Latin American and European parties to press it. China is driven to the wall; if it signs it can answer to neither its Central Committee nor the Chinese people nor the movement nor history; it has compromised much, some of the CPSU''s wording is in the statement, some points give both sides'' views; on the last six questions it has no room. Hồ asks China to think again and yield where it can; he will work on other parties. The group leaves impressed that China can give no more.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 402–403 ("the next day, the 27th"); [[w.yang-shangkun-riji]], I, 630–631 (Nov. 27, 1960; 3 p.m., at the Chinese Embassy, Liu, Deng, Peng Zhen, Li Jingquan, Lu Dingyi, Yang and the Ambassador receiving Hồ, Lê Duẩn, Ghosh, Sharkey, Kim Chang-man, Kim Il, Lukman and Hakamada, three hours, then dinner; they hope Khrushchev and Liu will meet); [[w.deng-xiaoping-nianpu-1904]], III, 1601 (Nov. 27, 1960; afternoon, the embassy; Deng, with Liu and others, receives members of the Vietnamese, Indian, Australian, Korean, Indonesian and Japanese delegations). Made public: 1999. See [[cal.1960-11-26.soviet-union-2]]. Names: Hồ Chí Minh.'
    src:
      c: 4ac7af4b
      rows:
