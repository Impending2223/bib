  - id: cal.1960-11-30.congo-lumumba
    when: Nov. 30
    date: '1960-11-30'
    thread: congo-lumumba
    c: 'The chief of the Africa Division to Devlin: "Concur QJ/WIN go Stanleyville ∗ ∗ ∗. We are prepared consider direct action by QJ/WIN but would like your reading on security factors. How close would this place [United States] to the action?"'
    n: '[[w.sen-church-alleged-assassination-plots]], 44 (the cable, which "could have been interpreted as an assassination order"; the report finds "no clear evidence" that QJ/WIN was in any assassination plan). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Chief of Africa Division to Station Officer, Nov. 30, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 44). See [[cal.1960-11-29.congo-lumumba]], [[cal.1960-11.congo-lumumba]]. Names: Devlin.'
    tags: [name:devlin-lawrence-r]
  - id: cal.1960-11.elections-1960-kennedy-3
    when: Nov.
    date: 1960-11
    thread: elections-1960-kennedy
    c: 'The last week, after Los Angeles on Tuesday and the San Francisco Bay area on Wednesday. Kennedy to O''Donnell, to have the weekend''s schedule changed: "I''ll be wasting my time in New York. I''ve got New York and I''ve got Connecticut. But I haven''t got California. Give me those two days in California and I''ll win there." O''Donnell: too late, the Friday night parade of the Democratic ward clubs in Chicago cannot be broken, and New York and Connecticut are fixed. Kennedy: "You and your damned schedule. If we lose California, it will be your thick-headed fault."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 245–46 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell. Check: the day (the book has it after the Wednesday in San Francisco, in the last week).'
    tags: [name:kennedy-john-f, name:odonnell-kenneth-p, state:ca]
