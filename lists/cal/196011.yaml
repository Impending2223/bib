    c: 'New York, the Biltmore, Saturday, after a day of rain in Manhattan, the Bronx and Queens. Kennedy, stripped to his shorts without dry clothes, is seen by the crowd in the corridor; Johnson goes in and comes out "pale and shaken": "That boy is very mad." Kennedy to O''Donnell: tell DeSapio the parade is off, "I''m not going to have seven thousand policemen tying up the entire city of New York in the pouring rain to have one stupid politician riding down the street." If DeSapio does not cancel it, O''Donnell is to call the police commissioner. DeSapio: "You can''t do it." The parade is canceled.'
