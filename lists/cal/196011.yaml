  - id: cal.1960-11-03.elections-1960-kennedy-2
    when: Nov. 3
    date: '1960-11-03'
    thread: elections-1960-kennedy
    c: 'Phoenix, the Westward Ho Hotel, a Democratic breakfast. Kennedy with Udall and Harless for Congress, Lee Ackerman for governor: Goldwater sent a wire to Nelson Rockefeller; votes "are not going to be counted until Tuesday"; "Kennedy Carries Arizona" for the Arizona Republic.'
    n: 'Remarks of Senator John F. Kennedy, Westward Ho Hotel Democratic Breakfast, Phoenix, AZ, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-westward-ho-hotel-democratic-breakfast-phoenix-az) (Nov. 3, 1960). [[w.communications-freedom-of-communications-part]], 867–68. Names: Kennedy, Goldwater, Rockefeller, Udall.'
