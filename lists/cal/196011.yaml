  - id: cal.1960-11-15.china-leadership-2
    when: Nov. 15
    date: '1960-11-15'
    thread: china-twelve-articles
    also: [china-mao]
    c: 'Mao drafts the Center''s directive on the "five winds," with Wang Renzhong''s reports on Mianyang county: in a few months the "communist wind," exaggeration, coercion, cadres'' privilege and blind orders on production to be stopped, the "communist wind" first.{1} Mao''s note of the same day to Zhou, Zhu De, Li Fuchun, Tan Zhenlin, Li Xiannian and Chen Boda: Li Fuchun to handle; too long to send but printed, the faster the better; not to Tibet or Xinjiang. The Center is to call the secretaries in early or mid-December; with the directive go Wang Renzhong''s report, Mianyang county''s summary and the Tonghaikou commune''s report.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 15, 1960. [[w.macfarquhar-origins-of-the-cultural]], III, 12 (the "five styles" directive); [[w.jianguo-yilai-mao-zedong]], XV, 401–405 (Nov. 15, 1960; the directive, dated by the Center Nov. 15, from Mao''s manuscript: Wang Renzhong''s report, Mianyang 沔阳 county''s summary and the Tonghaikou commune report sent for reference; the ''five winds'' to be corrected within months, the ''communist wind'' first; the Center to call the secretaries in early or mid-December; and Mao''s note of the same day: to Zhou, Zhu De, Li Fuchun, Tan Zhenlin, Li Xiannian and Chen Boda, then Li Fuchun to handle; too long to telegraph, to be printed and sent at once, not to Tibet or Xinjiang); [[w.mao-zedong-zhuan]], V, ch. 66 n.62 (Nov. 15, Mao drafts for the Center the directive to the bureaus and committees with Wang Renzhong''s papers on Hubei and Mianyang: the five winds, the communist wind first, to be put right in a few months). [[w.yang-jisheng-mubei]], II, 806 n.58 (Mao drafts the directive Nov. 15, sending Wang Renzhong''s report, the Mianyang county summary and the Tonghaikou commune''s report on its new state; the five winds to be put right within months, the "communist wind" first; the provinces to be called to report in early or mid-December); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 693–694 (the directive as issued, Nov. 15, 1960, in full; drafted by Mao for the Center, its first title "The Center''s instruction of Nov. 15, 1960 to the provincial, municipal and regional committees: on thoroughly correcting the five winds", n.1; the three reports not printed, n.2; printed from the Center''s document); [[w.jianguo-yilai-mao-zedong]], XV, 401–402. Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 693–694). Check: Made public: [[w.zhongguo-baike-nianjian-1981]], 563 (1981), named here, may report the directive earlier than 1996. To check: [[w.zhongguo-baike-nianjian-1981]], 563 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.10); Wang Renzhong, second secretary of the Central-South Bureau and first secretary of the Hubei Party committee, report of Nov. 12, 1960 to Tao Zhu and Mao Zedong, "On correcting the ''five winds''" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 402 n.1); Mianyang County Party Committee, "Summary of the first stage of carrying out policy", Nov. 3, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 403 n.2); Ma Jie 马杰, first secretary of the Mianyang County Party Committee, report of Nov. 9, 1960, "The changes in Tonghaikou commune after carrying out the policy" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 404 n.3). Names: Mao Zedong, Wang Renzhong, Zhou Enlai, Zhu De, Li Fuchun, Tan Zhenlin, Li Xiannian, Chen Boda.'
