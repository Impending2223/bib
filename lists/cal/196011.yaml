    place: moscow
    thread: soviet-union
    also: [china-leadership]
    follows:
      - cal.1960-11-10.soviet-union
    c: Moscow. After a fifteen-minute recess Khrushchev speaks, over two hours, eleven points, none naming China.{1} The era is not only that of imperialism and proletarian revolution; imperialism's nature has not stayed unchanged. Socialist states to divide labor; building alone does not succeed, going it alone is nationalism. The Soviets have made a few mistakes, some roughness, with socialist states. Local wars may come, war is not inevitable. Peaceful coexistence is the general line of socialist foreign policy; disarmament the way. New states may develop non-capitalistically. Peaceful transition is more likely; parliaments may become the people's. Against nationalism, Yugoslavia's chief mark being national communism. Not only revisionism but dogmatism and sectarianism may be the chief danger, above all "left" adventurism; against factional activity, in parties and in the movement. No more "head" of the camp, the CPSU cannot be one; the parties to "check their watches" with one another.{2}
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 378–380 (after Suslov''s report and a recess of fifteen minutes; "over two hours"); [[w.yang-shangkun-riji]], I, 593–594 (Nov. 10, 1960; Khrushchev read for two and a half hours; at the end, applause, Novotný first on his feet; the whole Chinese delegation and staff sit still, a "silent protest"); [[w.peng-zhen-nianpu-1902]], IV, 73 (Nov. 10, 1960; Khrushchev explains the draft statement part by part; "led by the Soviet Union" wrong, yet all to "set their watches" by it (the page''s note: his words at the Hungarian party''s seventh congress, Dec. 3, 1959); the majority to be respected, national traits not overstressed; the hall applauds, the whole Chinese delegation and staff sit still). Made public: 1999. See [[cal.1960-11-10.soviet-union]]. Names: Khrushchev. Check: the account is the Chinese delegation''s; the eleven points are Wu''s summary.'
    src:
      c: 1e2f4a4f
      rows:
