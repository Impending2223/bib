    c: 'Moscow. In the evening Kozlov telephones Peng Zhen: the Presidium has met, Khrushchev presiding, and in the main approves the noon oral agreement, but asks for formal talks of the two delegations. He proposes 10 a.m. tomorrow, the Lenin Hills conference hall, three a side: Khrushchev, Suslov and Kozlov. Peng, after consulting the delegation, answers: Liu, Deng and Peng for China, the hour 11. The Soviets agree.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 414–415 ("toward evening" of the 29th); [[w.yang-shangkun-riji]], I, 633 (Nov. 29, 1960; Khrushchev''s call: Liu and whomever he brings, 10 a.m. the next day, in Khrushchev''s office). Made public: 1999. See [[cal.1960-11-29.soviet-union-2]]. Names: Kozlov, Peng Zhen, Khrushchev, Suslov, Liu Shaoqi, Deng Xiaoping.'
