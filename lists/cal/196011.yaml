  - id: cal.1960-11-01.railroads
    when: Nov. 1
    date: '1960-11-01'
    thread: railroads
    c: 'The carriers and the five operating brotherhoods agree to put the work-rules dispute, firemen on diesels among it, to a presidential commission: fifteen members, for the railroads, the unions and the public. Eisenhower creates it by executive order.'
    n: '[Exec. Order No. 10,891](https://www.presidency.ucsb.edu/documents/executive-order-10891-establishing-commission-inquire-into-controversy-between-certain), [25 Fed. Reg. 10525](https://www.govinfo.gov/app/details/FR-1960-11-03). Statement by the President Concerning the Agreement Reached in the Railway Industry, [1960–61 Pub. Papers 822](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=874). To check: [[w.commission-report]] (the commission''s findings); [[w.horowitz-manpower-utilization-in-the]]; [[w.kaufman-railroad-labor-dispute]]; [[w.cottrell-technological-change-and-labor]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-11-01.cuba
    when: Nov. 1
    date: '1960-11-01'
    thread: cuba
    c: Eisenhower on Guantanamo. The base held under agreements with Cuba that only both parties can change; the United States will not agree to change them, and will take whatever steps are appropriate to defend it.
    n: 'Statement by the President Regarding the U.S. Naval Base at Guantanamo, Cuba, [1960–61 Pub. Papers 822](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=874). To check: [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-11-01.king
    when: Nov. 1
    date: '1960-11-01'
    thread: king
    also: [elections-1960]
    c: 'King, a statement: his role in the South''s new order demands that he stay nonpartisan, "But for fear of being considered an ingrate, I want to make it palpably clear that I am deeply grateful to Senator Kennedy for the genuine concern he expressed in my arrest."'
    n: '[[w.branch-parting-the-waters]], 369. To check: King, Statement, Nov. 1, 1960, Martin Luther King, Jr., Papers, box 1, folder 11b, Boston University; King Speech Collection, box 2, King Library and Archives (cited by [[w.branch-parting-the-waters]], 369 n.4). See [[cal.1960-10-25.king]]. Names: Martin Luther King, Kennedy.'
    src:
      c: a272f415
      rows:
        - 'w.branch-parting-the-waters 369: all'
        - 'via w.branch-parting-the-waters 369 n.4: all'
    tags: [name:king-martin-luther-jr, name:kennedy-john-f]
  - id: cal.1960-11-02.peace-corps
    when: Nov. 2
    date: '1960-11-02'
    thread: peace-corps
    also: [elections-1960]
    c: Kennedy at the Cow Palace, San Francisco, proposes "a peace corps of talented young men and women," three years abroad, "as an alternative or as a supplement to peacetime selective service."
    n: '[Speech of Senator John F. Kennedy, Cow Palace, San Francisco, CA](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-cow-palace-san-francisco-ca). See [[cal.1960-10-14.peace-corps]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
