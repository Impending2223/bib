    n: 'FRUS 1958–60, I, docs. [218](https://history.state.gov/historicaldocuments/frus1958-60v01/d218), [228](https://history.state.gov/historicaldocuments/frus1958-60v01/d228), [232](https://history.state.gov/historicaldocuments/frus1958-60v01/d232) (Durbrow), [235](https://history.state.gov/historicaldocuments/frus1958-60v01/d235) (Mendenhall''s letter); [219](https://history.state.gov/historicaldocuments/frus1958-60v01/d219) (Durbrow, Nov. 11, 5 p.m.: loyal armor and troops on the way, his hope the two sides get together); [227](https://history.state.gov/historicaldocuments/frus1958-60v01/d227) (McGarr, Nov. 12: Diệm''s broadcast offering a provisional government); [233](https://history.state.gov/historicaldocuments/frus1958-60v01/d233) (McGarr, Nov. 13: the rebels'' capitulation, about 2 p.m. Nov. 12); [257](https://history.state.gov/historicaldocuments/frus1958-60v01/d257) (Durbrow, Dec. 4: both sides urged to negotiate); [238](https://history.state.gov/historicaldocuments/frus1958-60v01/d238) (Lansdale, Nov. 15: Durbrow urged Diệm "to give in to rebel demands to avoid bloodshed"). [[w.miller-misalliance]], 202–04, 207–13 (202–04: the coup and its end; 212–13: Durbrow); [[w.watson-into-the-missile-age]], 648 (the attempt, the night of Nov. 11–12, put down with loyal troops); [[w.marolda-united-states-navy-and]], 142 (the attack on the palace, Nov. 11; the talks; the loyal divisions; the surrender the next morning); [[w.schulimson-joint-chiefs-of-staff]], 26–27; [[w.gibbons-u-s-government-and]], I, 342 (the attempt; Durbrow pressing Diệm to meet the rebels and avoid bloodshed); [[w.moyar-triumph-forsaken]], 108–13 (the attack, the negotiations, the loyal troops, the leaders'' flight to Cambodia; 110, 112–13: Durbrow''s calls to Thuần and Diệm for a settlement); [[w.schulimson-joint-chiefs-of-staff]], 26 (Thi''s three battalions of paratroopers and two companies of marines, the early hours of Nov. 11); [[w.mann-grand-delusion]], 219 (mid-November: junior officers storm the palace; Diệm promises political reforms and free elections; troops loyal to him intervene and the coup is put down; not the day, the paratroops or Thi, the surrender of Nov. 12 or Cambodia); [[w.lich-su-khang-chien-chong-my]], II, 385; [[w.lich-su-khang-chien-chong-my]], III, 316 n.1 (the night of Nov. 10–11, paratroop battalions under Col. Nguyễn Chánh Thi, commander of the Saigon paratroop brigade, take some command posts and surround the Palace; the morning of Nov. 12 Khiêm, commanding IV Corps, called by Diệm in secret, brings troops back and ends the revolt; Thi flees to Cambodia). Check: McGarr (FRUS 1958–60, I, doc. 233) has the coup leaders flown out at 2 p.m. Nov. 12 on a C-47, "rumored for Phnom Penh" as its destination. To check: [[w.catton-diems-final-failure]]; [[w.jacobs-cold-war-mandarin]]; [[w.anderson-trapped-by-success]]; Lieut. Lương Đình Chi''s report on the signals command''s action against the rebels, Nov. 1960, folder 6531, PTTĐNCH, TTLT2 (cited by [[w.miller-misalliance]], 204 n.55); NA Saigon, Joint Weekly Analysis, 47 of 10 Nov 1960 (cited by [[w.marolda-united-states-navy-and]], 142 n.20a); USAF, "Journal of Mutual Security," Dec 1960, Office of Air Force History, p. 149 (cited by [[w.marolda-united-states-navy-and]], 142 n.20b). Names: Nguyễn Chánh Thi, Diệm, Durbrow.'
