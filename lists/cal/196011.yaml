    c: 'Shanghai 上海. Chen Yun 陈云, by letter to Zhou Enlai 周恩来 on Jiangsu''s 江苏 harvest and rations, proposes three aids to its farming: 200,000 cubic meters of timber outside the plan, with about 1,200 tons of tung oil and about 1,000 tons of hemp, to mend boats, windmills and carts; 1,000 tractors, worth 100 to 200 million jin of grain in the Xuzhou–Huai 徐淮 area alone; 12,000 kilowatts of generators next year for Zhenjiang 镇江 prefecture.'
