  - id: cal.1960-11-01.elections-1960-2
    when: Nov. 1
    date: '1960-11-01'
    thread: elections-1960
    c: 'David Lawrence''s syndicated column, on a Gallup forecast of a possible 50 percent shift of the Catholic vote from Eisenhower in 1956 to Kennedy: such a shift "could mean not only a landslide for Kennedy but possibly one of the largest popular vote totals ever given to a presidential candidate in American history."'
    n: '[[w.nixon-six-crises]], 359 (the column quoted). To check: David Lawrence''s column, Nov. 1, 1960 (cited by [[w.nixon-six-crises]], 359). Names: Eisenhower, Kennedy, Lawrence.'
    src:
      c: ead43c3c
      rows:
        - 'w.nixon-six-crises 359: all'
        - 'via w.nixon-six-crises 359 n.text-g: all'
    tags: [name:eisenhower-dwight-d, name:kennedy-john-f, ok:result-form, name:lawrence-david]
  - id: cal.1960-11-01.elections-1960
    when: Nov. 1
    date: '1960-11-01'
    place: los-angeles
    thread: elections-1960-kennedy
    also: [medicare]
    c: 'Kennedy at the University of Southern California: "Ninety percent of the Republicans voted against the social security in the mid thirties and 95 percent in 1960 voted against the medical care for the aged tied to social security."'
    n: 'Remarks of Senator John F. Kennedy, First-Time Voters Convocation, University of Southern California, Los Angeles, CA - Question and Answer Period, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-first-time-voters-convocation-university-southern) (Nov. 1, 1960). [[w.sundquist-politics-and-policy]], 307; [[w.communications-freedom-of-communications-part]], 840–44 (the First-Time Voters Convocation, University of Southern California, remarks 840–42 and the question period 842–44; 844: "Ninety percent of the Republicans voted against the social security in the mid-thirties and 95 percent in 1960 voted against the medical care for the aged tied to social security"). To check: *The Speeches of Senator John F. Kennedy, Presidential Campaign of 1960*, S. Rept. 994, 87th Cong., 1st sess. (1961), pt. 1, 844 (cited by [[w.sundquist-politics-and-policy]], 307 n.58). See [[cal.1960-08-23.medicare]]. Names: Kennedy.'
