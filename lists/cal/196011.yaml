  - id: cal.1960-11-28.china-leadership-3
    when: Nov. 28
    date: '1960-11-28'
    thread: china-leadership
    also: [economy]
    c: 'At the Secretariat, on this year''s coal and iron shipping, Zhou Enlai: strict science comes from constant correction through practice; talk so that people dare speak; the line is carried out by persons; production and living go together; labor not spared the past year or two; a few percent of cadres have Kuomintang ways; leave room in coal, steel and cement, do more and say less, local papers to say seven when it is ten; anti-revisionism a ten-year matter, so keep a hand back.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 372 (Nov. 28, 1960). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1960-11-28.soviet-union
    when: Nov. 28
    date: '1960-11-28'
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow. In the drafting committee the Soviet delegate agrees to cut "national communism," one of the six points; the rest to stay, above all the stand against factional activity and the affirming of the Twentieth Congress. The Chinese delegate counters: the statement must say plainly the principle of consultation to unanimity, not majority rule, raised in discussing the statement, not the Hungarian draft. Argued again, without result.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 403–404 ("the 28th"); [[w.yang-shangkun-riji]], I, 631 (Nov. 28, 1960; "national communism" struck; the disputed points left hanging; Suslov to report them to the heads of delegations, the committee to meet when called); [[w.deng-xiaoping-nianpu-1904]], III, 1601 (Nov. 28, 1960; the drafting committee''s third meeting strikes "national communism" from the draft). Made public: 1999. See [[cal.1960-11-25.soviet-union]].'
    src:
      c: ec118561
      rows:
