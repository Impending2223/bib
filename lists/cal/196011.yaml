    c: 'Moscow, midnight.{1} Hồ Chí Minh telephones the Chinese delegation and asks Liu Shaoqi to come to him, to talk it over.{2} Liu, asleep, rises and calls Deng Xiaoping and Peng Zhen. The call is odd: Hồ has always come to them. Liu declines, telling Hồ China''s stand was given yesterday; let him go to Khrushchev, pass it on, and make Khrushchev choose between a break and none.{3} Hồ then says he is asking Khrushchev too, that all may talk. Liu, with Deng and Peng, declines again: if Khrushchev wants a settlement, let him come;{4} no third party between. The Chinese take it that Hồ is again a go-between with Khrushchev''s consent.{5}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 405–407 ("at 12 at night" of the 28th); [[w.yang-shangkun-riji]], I, 631 (Nov. 28, 1960; under the morning, 上午: Hồ means to have Liu Shaoqi come to his lodging to meet Khrushchev; Liu refuses, the thing sudden and unarranged); [[w.guan-vietnamese-communists-relations-with]], 168 (by Whiting, Hồ Chí Minh persuades Liu Shaoqi to meet Khrushchev privately, toward an agreed statement; no day). Made public: 1999. To check: [[w.whiting-sino-soviet-split-in]], 518 (cited by [[w.guan-vietnamese-communists-relations-with]], 168 n.61). See [[cal.1960-11-28.china-leadership-6]]. Names: Hồ Chí Minh, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Khrushchev. Check: the hour is the night of the 28th, so the first minutes of the 29th; Hồ, at Peking, puts it on the 29th (441).'
    src:
