    tags: [polity:prc, name:ho-chi-minh, name:khrushchev-nikita-s, vis:only:prc+ussr+drv]
  - id: cal.1960-11-26.soviet-union-2
    when: Nov. 26
    date: '1960-11-26'
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow, the Chinese delegation''s quarters. Khrushchev sends Mikoyan and Kozlov; Deng Xiaoping and Peng Zhen talk with them. Their points: the Twentieth Congress must go in; the wording against factional activity may be considered, a slight give; whether there is an internal resolution on the Hungarian proposal depends on China''s attitude; if the conference ends well the Sino-Soviet differences end, look ahead, make unity; and the Chinese delegation is asked to tour the USSR after the conference, Liu''s visit as head of state widened to the whole party and government delegation. Deng: the conference is in substance an anti-China conference the CPSU set going, to China''s deep regret and wrath; the CPSU still holds its wrong line, and China urges it not to go to the end but to look further and put the large matter first; only with all the nails out of the draft, no resolution against China and no majority-rule resolution will China sign. Mikoyan and Kozlov cannot accept, will report to the Presidium.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 401–402 ("the 26th"; Wu''s bracketed asides, that the wording point was "a slight loosening" and that the Hungarian point was a threat, are his); [[w.yang-shangkun-riji]], I, 628–630 (Nov. 26, 1960; 4 to 7 p.m., at Liu''s lodging; the invitation to a state visit renewed; Liu: the meeting run in the spirit of the Nov. 5 letter; with "national communism," the factional passage, the Twentieth and Twenty-first Congresses and an internal resolution the Chinese will not sign); [[w.deng-xiaoping-nianpu-1904]], III, 1601 (Nov. 26, 1960; afternoon, at Liu Shaoqi''s lodging; Deng, with Liu and Peng Zhen, with Mikoyan and Kozlov; Liu: if the statement must contain "national communism", the Twentieth Congress and factional activity, with an internal resolution censuring the Chinese, the delegation cannot sign). Made public: 1999. See [[cal.1960-11-26.soviet-union]]. Names: Mikoyan, Kozlov, Deng Xiaoping, Peng Zhen, Liu Shaoqi. Check: the account is the Chinese delegation''s.'
    src:
      c: fb1ace3e
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 401–402: all'
        - 'w.yang-shangkun-riji I, 628–630: B, D, E, F'
        - 'w.deng-xiaoping-nianpu-1904 III, 1601: ?'
    tags: [polity:prc, name:mikoyan-anastas, name:kozlov-frol-r, name:deng-xiaoping, name:peng-zhen, name:liu-shaoqi, vis:only:prc+ussr]
