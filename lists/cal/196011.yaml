    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 373–374 ("that afternoon", after the parade; dated Nov. 5 at 377, 380 and 446); [[w.yang-shangkun-riji]], I, 589–590 (Nov. 7, 1960; Andropov gives it to Liu Xiao after the march; over 100 pages, 91 in Chinese, some 80,000 characters; the delegation reads twenty pages at Liu Shaoqi''s at 2 p.m. before the reception); [[w.deng-xiaoping-nianpu-1904]], III, 1593 (Nov. 7, 1960; the CPSU''s answer of Nov. 5 to the Chinese Reply of Sept. 10, handed by Andropov to Liu Xiao that morning; Deng at Liu''s delegation meeting that afternoon to read it). Made public: 1999. See [[cal.1960-11-07.soviet-union]]. Names: Andropov, Suslov, Deng Xiaoping, Mao Zedong, Liu Shaoqi. Check: the account is the Chinese delegation''s; Wu says the letter was "distributed" to the parties before the conference (374), and has Liu say it was issued on Nov. 5 (446).'
