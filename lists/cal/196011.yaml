  - id: cal.1960-11-01.china-leadership-6
    when: Nov. 1
    date: '1960-11-01'
    thread: china-leadership
    c: 'The Henan 河南 committee''s examination of the Xinyang 信陽 incident: by its October count 549,171 dead the winter and spring before, 6.54 percent of the prefecture''s 8.4 million; 520 of 4,473 brigades have lost over 20 percent, some over 50; Guangshan 光山 has lost 97,154, 19.87 percent, with 5,639 households gone. The prefecture''s grain crop was reckoned at 6.4 billion jin when it was 2 billion-odd, the province''s procurement set at 960 million and raised over 20 percent by prefecture, counties and communes; by mid-October 1959 3,751 mess halls had stopped cooking.'
    n: '[[w.yang-jisheng-mubei]], I, 38, 61. Made public: 2008. To check: Henan Provincial Committee, "Examination of the Xinyang incident," Nov. 1, 1960 (cited by [[w.yang-jisheng-mubei]], I, 38 n.9 as "Inspection of the Xinyang incident," 61 n.34 as "Review"). Check: the book gives the title two ways, and may mean one paper; the first sentence''s figures are at I, 61, the second''s at I, 38.'
    src:
      c: f489b45c
      rows:
        - 'w.yang-jisheng-mubei I, 61: A-C'
        - 'w.yang-jisheng-mubei I, 38: D-E'
        - 'via w.yang-jisheng-mubei I, 61 n.34: A-C'
        - 'via w.yang-jisheng-mubei I, 38 n.9: D-E'
    tags: [polity:prc, vis:only:prc]
  - id: cal.1960-11-01.china-leadership-7
    when: Nov. 1
    date: '1960-11-01'
    thread: china-leadership
    c: 'The Henan 河南 committee asks the Center for instructions: Lu Xianwen 路憲文, first secretary of the Xinyang 信陽 prefectural committee, to be expelled from the Party, Ma Longshan 馬龍山, first secretary of Guangshan 光山 county, sentenced to death, and several questions of policy settled in dealing with the deaths. It reckons the prefecture''s cadres at brigade level and above at 50,000, not fewer than half of them guilty of breaches of law and discipline: beatings, arrests and detentions common, and most communes and brigades with jails and labor-reform teams.'
    n: '[[w.yang-jisheng-mubei]], I, 50. Made public: 2008. To check: Henan Provincial Committee, "Request for instructions on expelling Lu Xianwen, first secretary of the Xinyang prefectural committee, from the Party, sentencing Ma Longshan, first secretary of Guangshan county, to death, and several questions of policy in dealing with the deaths in Xinyang," Nov. 1, 1960 (cited by [[w.yang-jisheng-mubei]], I, 50 n.25).'
    src:
      c: af28ca9c
      rows:
        - 'w.yang-jisheng-mubei I, 50: all'
        - 'via w.yang-jisheng-mubei I, 50 n.25: all'
