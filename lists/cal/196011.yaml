entries:
  - id: cal.1960-11-01.railroads
    when: Nov. 1
    date: '1960-11-01'
    thread: railroads
    c: 'The carriers and the five operating brotherhoods agree to put the work-rules dispute, firemen on diesels among it, to a presidential commission: fifteen members, for the railroads, the unions and the public. Eisenhower creates it by executive order.'
    n: '[Exec. Order No. 10,891](https://www.presidency.ucsb.edu/documents/executive-order-10891-establishing-commission-inquire-into-controversy-between-certain), [25 Fed. Reg. 10525](https://www.govinfo.gov/app/details/FR-1960-11-03). Statement by the President Concerning the Agreement Reached in the Railway Industry, [1960–61 Pub. Papers 822](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=874). [[w.commission-report]], the commission''s findings. To check: [[w.horowitz-manpower-utilization-in-the]]; [[w.kaufman-railroad-labor-dispute]]; [[w.cottrell-technological-change-and-labor]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-11-01.cuba
    when: Nov. 1
    date: '1960-11-01'
    thread: cuba
    c: Eisenhower on Guantanamo. The base held under agreements with Cuba that only both parties can change; the United States will not agree to change them, and will take whatever steps are appropriate to defend it.
    n: 'Statement by the President Regarding the U.S. Naval Base at Guantanamo, Cuba, [1960–61 Pub. Papers 822](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=874). To check: [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-11-02.peace-corps
    when: Nov. 2
    date: '1960-11-02'
    thread: peace-corps
    also: [elections-1960]
    c: Kennedy at the Cow Palace, San Francisco, proposes "a peace corps of talented young men and women," three years abroad, "as an alternative or as a supplement to peacetime selective service."
    n: '[Speech of Senator John F. Kennedy, Cow Palace, San Francisco, CA](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-cow-palace-san-francisco-ca). See [[cal.1960-10-14.peace-corps]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1960-11-02.elections-1960
    when: Nov. 2
    date: '1960-11-02'
    thread: elections-1960
    also: [cuba]
    c: 'Hoover reports to Nixon on Ball''s talk with the French Ambassador, Alphand, Oct. 31, as the FBI recorded it: Ball expects an invasion of Cuba from Central America that week, and "a terrible atmosphere for the election."'
    n: '[[w.kallina-kennedy-v-nixon]], 130. To check: J. Edgar Hoover to Nixon, Nov. 2, 1960, Nixon Library (cited by [[w.kallina-kennedy-v-nixon]], 130 n.35). Names: Hoover, Nixon, Ball, Alphand. Check: the day, from Kallina''s note (242 n.35); his text gives early November.'
    src:
      c: 5380e1ee
      rows:
        - 'w.kallina-kennedy-v-nixon 130: all'
        - 'via w.kallina-kennedy-v-nixon 130 n.35a: all'
    tags: [name:hoover-j-edgar, name:nixon-richard-m, name:ball-george-w, name:alphand-herve]
  - id: cal.1960-11-04.desegregation-schools-la
    when: Nov. 4
    date: '1960-11-04'
    thread: desegregation-schools
    c: 'Louisiana''s legislature meets in extraordinary session, called by Davis ten days before New Orleans''s schools are to desegregate. It enacts 25 measures, the first after the session''s appropriation an interposition act: Louisiana will not recognize *Brown* or the court''s orders.'
    n: '*Bush v. Orleans Parish School Board*, [188 F. Supp. 916](https://static.case.law/f-supp/188/case-pdfs/0916-01.pdf) (E.D. La. 1960), App. A–B. To check: [[w.inger-politics-and-reality-in]]; [[w.baker-second-battle-of-new]]; [[w.fairclough-race-and-democracy]]. See [[cal.1960-08-27.desegregation-schools-la]]. Names: Jimmie Davis.'
    tags: [name:davis-jimmie-h, state:la, city:new-orleans]
  - id: cal.1960-11-04.cuba
    when: Nov. 4
    date: '1960-11-04'
    thread: cuba-bay-of-pigs
    c: 'CIA headquarters to the project officer in Guatemala: the guerrilla teams in training cut to 60 men, the rest trained as an amphibious and airborne assault force. From then on, training for the landing only.'
    n: '[FRUS 1961–63, X, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 7 (Taylor''s Memorandum No. 1, June 13, 1961; the cable, its Annex 4). Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.watson-into-the-missile-age]], 766 (the change to a landing). To check: [[w.gleijeses-ships-in-the-night]]. See [[cal.1960-03-17.cuba]].'
    src:
      c: 5eab8756
      rows:
