    when: Nov. 7
    date: '1960-11-07'
    thread: elections-1960
    c: Election eve. Nixon's four-hour telethon on ABC, from Detroit. A quarter hour with Dewey; a last half hour on all three networks, Eisenhower, Nixon and Lodge.
    n: 'Remarks of Vice President Richard M. Nixon, National Telethon, ABC Network, Southfield, MI, [APP](https://www.presidency.ucsb.edu/documents/remarks-vice-president-richard-m-nixon-national-telethon-abc-network-southfield-mi) (Nov. 7, 1960); Radio and Television Remarks on Election Eve, [1960–61 Pub. Papers 852](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=904) (Nov. 7, 1960). [[w.kallina-kennedy-v-nixon]], 165; [[w.nixon-rn]], 221–22 (the one telethon, the day before the election; the telecast with Eisenhower and Lodge). To check: Washington Post, Nov. 8, 1960 (cited by [[w.kallina-kennedy-v-nixon]], 165 n.22). Names: Nixon, Dewey, Eisenhower, Lodge. Check: whether the President''s remarks are his part of the half hour with Nixon and Lodge.'
