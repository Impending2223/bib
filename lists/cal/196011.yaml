    n: 'Statement by the President Regarding the U.S. Naval Base at Guantanamo, Cuba, [1960–61 Pub. Papers 822](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=874). To check: [[w.rabe-eisenhower-and-latin-america]]. Names: Eisenhower.'
