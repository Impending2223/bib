  - id: cal.1960-11-03.china-leadership
    when: Nov. 3
    date: '1960-11-03'
    thread: china-twelve-articles
    c: 'The Center''s Emergency Directive Letter on the communes'' present policies (the "Twelve Articles"), revised by Mao and sent by telegram that afternoon: three-level ownership on the production brigade "unchanged at least seven years," to 1967;{1} pay by work "at least twenty years"; household pigs encouraged; grain to "pass the test" by 1967; every cadre to study it in classes three winters running.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 3, 1960. [[w.zhou-enlai-nianpu-1949]], II, 365–66, Nov. 3, 1960 (the urgent directive letter drafted under Zhou Enlai at the Center''s commission, Mao changing it on Nov. 3 and returning it to Zhou for a last word). [[w.macfarquhar-origins-of-the-cultural]], III, 12 (the Twelve-Article directive); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 496 (Nov. 3, 1960; the letter issued in the Center''s name; Liu''s October revisions of Articles 2 and 4); [[w.jianguo-yilai-mao-zedong]], XV, 383–386 (Nov. 3, 1960; Mao''s note to Zhou Enlai, early Nov. 3 (''3rd, early''), on Zhou''s draft of Oct. 31: revisions made, some of them important; Zhou to talk them over with Li Fuchun, Tan Zhenlin, Liao Luyan, Chen Zhengren and Chen Boda and settle them; to go by telegram, the faster the better; his revisions (three-level ownership unchanged at least seven years, to 1967; pay by work at least twenty years; grain to pass the test, 1961–67; classes three winters running) and the changed wording on household pigs (''should be encouraged''); he set the issue date Nov. 3 and the Center issued it that day (386 n.3); printed from the manuscript and Mao''s revised copy; the volume gives no hour for the telegram); [[w.yang-jisheng-mubei]], II, 817 (the Center''s urgent directive letter on the communes'' present policy, the "Twelve Articles," drawn up under Zhou Enlai and sent down Nov. 3; the book lists its twelve points); [[w.mao-zedong-zhuan]], V, ch. 66 nn.60, 61 (Nov. 3: Mao revises the draft of the urgent letter received the evening of Nov. 2, returns it to Zhou Enlai with a letter that morning; "at least five years" becomes seven, to 1967 ("unchanged before the last year of the third five-year plan"); sent after Zhou''s meeting that afternoon; twelve policies). [[w.dikotter-maos-great-famine]], 118 n.11 (the emergency directive of Nov. 3, 1960: villagers to keep private plots and side occupations, to rest eight hours a day, local markets to be restored; the book dates the end of mass starvation from it); [[w.jian-zhou-enlai]], 457 (Nov. 3, with Mao''s approval: against "Communist egalitarianism"; small private plots and household food); [[w.zhu-de-nianpu-xinbian]], III, 1786 (Nov. 3, 1960; the Center''s Emergency Directive Letter on the communes'' present policies 《关于农村人民公社当前政策问题的紧急指示信》, the "Twelve Articles": three-level ownership with the brigade as the base, unchanged for at least seven years; the "one equalization, two transfers" 一平二调 to be wholly corrected; small private plots and household sidelines allowed; labor saved for the front line of farming; grain arranged and mess halls run well; rectification of the communes); [[w.chen-yun-nianpu-xiuding]], III, 52 (the "Urgent directive letter": three-level ownership with the team as base the communes'' fundamental system now; "equalize and transfer" opposed; private plots and small side-lines; to each by his work; labor saved for farming; grain arranged and the mess halls run well; rural fairs restored); [[w.peng-dehuai-nianpu]], 760 (Nov. 3, 1960: the Center''s urgent directive letter on the rural people''s communes'' present policies 《关于农村人民公社当前政策问题的紧急指示信》, the "Twelve Articles" 十二条: three-level ownership on the production team as basic accounting unit unchanged at least seven years from 1961; the "equalization and transfer" since the communes to be repaid within 1960, by the spring plowing of 1961 at latest; small private plots and household sidelines allowed; rural markets restored); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 660–676 (the letter in full, Nov. 3, 1960, to the bureaus and the provincial, prefectural, county, commune, brigade and team committees and branches; printed from the Center''s document). Made public: 1996. To check: the Emergency Directive Letter (Twelve Articles), Nov. 3, 1960; [[w.renqiong-song-renqiong-huiyilu]], 136–72 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.9a); [[w.zhongguo-baike-nianjian-1981]], 563 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.9b); [[w.zhongguo-gongchan-dang-jianshi]], 357–58 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.9c); [[w.dixin-wo-guo-shehuizhuyi-jingji]], 153 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.9d); Zhou Enlai, the Center''s draft "Urgent directive letter on current policy questions in the rural people''s communes", sent to Mao for review Oct. 31, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 385 n.1); Central Committee, "Urgent directive letter on current policy questions in the rural people''s communes" (the Twelve Articles), Nov. 3, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 386 n.3); Mao Zedong 毛泽东, letter to Zhou Enlai 周恩来 returning the draft of the Center''s urgent directive letter on current policy in the people''s communes (manuscript 手稿), Nov. 3, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.60); Mao Zedong 毛泽东, revisions to the draft of the Center''s urgent directive letter on current policy in the people''s communes 《关于农村人民公社当前政策问题的紧急指示信》 (manuscript 手稿), Nov. 3, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.61). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Tan Zhenlin, Liao Luyan, Chen Zhengren, Chen Boda.'
