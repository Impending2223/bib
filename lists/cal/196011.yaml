    also: [soviet-union]
    c: 'The Center to Liu Shaoqi, Deng Xiaoping and Peng Zhen, 11:30 p.m. (Zhou Enlai''s draft, approved by Mao and the enlarged Politburo; Mao''s meeting with the regional secretaries, 10:15): the peoples and parties fear a split;{1} seek compromise and sign; if need be, the 1957 Declaration''s sentence on the Twentieth Congress;{2} a statement either way.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 28, 1960. [[w.zhou-enlai-nianpu-1949]], II, 372–73, Nov. 28, 1960 (Zhou''s revision of the instruction on signing, and his sixth point). [[w.zhou-enlai-nianpu-1949]], II, 373, Nov. 28, 1960 (Zhou presiding that evening at the Politburo, which adopts the Center''s reply to Liu, Deng and Peng; then at Mao''s meeting with the regional secretaries on the reply to Liu''s telegram). [[w.lengxi-shinian-lunzhan-1956-1966]], 407–409 (the Center''s answer, which reached the delegation after dinner of the 28th: the neutral parties waver, most not ready to break with Khrushchev, all progressive forces want the conference to succeed, so seek agreement now, no longer the edge of a break; four cases: all nails out and no internal resolution, sign; the nails kept and an internal resolution, refuse; the nails out and a resolution against China or by majority, sign and issue a statement against it; factional activity and national communism out, the Twentieth Congress kept, a resolution, the likeliest, sign after changing the Twentieth''s wording, with a statement; in any case the delegation to issue its own statement; an Appeal like 1957''s); [[w.deng-xiaoping-nianpu-1904]], III, 1600 (Nov. 28, 1960; the Center answers the delegation''s cables of the 24th and 25th, weighing the cases that may arise and the course for each); [[w.mao-zedong-zhuan]], V, ch. 66 n.53 (Nov. 28: the Center''s cable on signing: treat them to the utmost, strengthen the left, win the middle, expose the right; give way on the Twentieth Congress, never on group and faction or a secret decision; aim at an agreed statement). Made public: 1997. To check: Central Committee 中共中央, telegram to Liu Shaoqi and the delegation at Moscow on the question of signing, Nov. 28, 1960 (the book summarizes it; the Hungarian delegation''s proposal for an internal majority decision, n.53) (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.53). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Ke Qingshi, Zeng Xisheng, Tao Zhu.'
