  - id: cal.1960-11-08.specials
    when: Nov. 8
    date: '1960-11-08'
    thread: specials
    c: Pennsylvania 18th, special. Whalley (R) holds the late Douglas Elliott's seat over Meyers (D), 86,527 to 53,324, 61.9 percent; the same day, the full term.
    n: '[*Pa. Manual*, 1961–62, p. 714](https://babel.hathitrust.org/cgi/pt?id=uiug.30112053623135&seq=722). CQ Guide 6th (2010) 1265 prints Meyers 52,324 and 62.3 percent. The Clerk prints the regular race only. See [[cal.1960-03-08.specials]]. Names: Whalley, Elliott.'
    tags: [special:1960-11-08-h-PA-18, name:whalley-john-i, name:elliott-douglas-h]
  - id: cal.1960-11-08.governors
    when: Nov. 8
    date: '1960-11-08'
    thread: governors
    also: [elections-1960]
    c: 'Twenty-seven governors elected: Democrats 15, Republicans 12. Each party took six or seven States from the other. Kerner (D) over Governor Stratton in Illinois; Volpe (R) in Massachusetts; Sanford (D) in North Carolina; Andersen (R) over Freeman in Minnesota. Governorships after the election: Democrats 34, Republicans 16.'
    n: '[Wikipedia, "1960 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1960_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). To check: [[w.sabato-goodbye-to-good-time]]. See [[cal.1960-11-08.elections-1960]]. Names: Kerner, Stratton, Sanford, Andersen, Volpe, Freeman.'
    tags: [governors:1960-11-08, name:kerner-otto, name:volpe-john-a, name:sanford-terry, name:freeman-orville-l, name:stratton-william-g, name:andersen-elmer-l]
  - id: cal.1960-11-08.mississippi-ms
    when: Nov. 8
    date: '1960-11-08'
    thread: mississippi
    also: [elections-1960, voting-rights, state-constitutions, electoral-college]
    c: 'Mississippi. The unpledged Democratic electors over the Democratic electors pledged to Kennedy, 116,248 to 108,362, 39.0 percent; Nixon 73,561, 24.7 percent. The eight unpledged electors to vote for Byrd. The same day, Section 241-A ratified: an applicant for registration to be of "good moral character."'
    n: '[*Statistics of the Presidential and Congressional Election of November 8, 1960*](https://clerk.house.gov/member_info/electionInfo/1960election.pdf) (Clerk of the House, 1961), 25. Section 241-A: *United States v. Mississippi*, [380 U.S. 128](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380128/usrep380128.pdf) (1965), n.7. Check: the amendment''s vote and date (the Secretary of State''s proclamation, Nov. 23). To check: [[w.crespino-in-search-of-another]]; [[w.lawson-black-ballots]]; [[w.white-making-of-the-president]]. See [[cal.1960-11-08.elections-1960]]; [[cal.1960-12-19.elections-1960]]. Names: Kennedy, Nixon, Byrd.'
    tags: [state:ms, name:kennedy-john-f, name:nixon-richard-m, name:byrd-harry-f]
  - id: cal.1960-11-08.governors-il
    when: Nov. 8
    date: '1960-11-08'
    thread: governors
    also: [elections-1960]
    c: Illinois. Kerner (D) over Stratton (R), 2,594,731 to 2,070,479, 55.5 percent; Kennedy carries the State, 2,377,846 to 2,368,988, 50.0 percent, an 8,858-vote margin. Cook County. Ward (D) over State's Attorney Adamowski (R).
    n: 'Votes: [Ill. *Official Vote*, 1960, p. 16](https://archive.org/details/officialvote1960illi/page/n17); the State''s Attorney''s race is the county''s, not in the volume. The presidential vote: the Clerk''s *Statistics*, 1960 (Elections, 1960). To check: [[w.barnhart-kerner]]; [[w.kenney-political-passage]]; [[w.kallina-courthouse-over-white-house]]; [[w.peirce-megastates-of-america]]. See [[cal.1960-04-12.governors-il]]; [[cal.1960-11-08.elections-1960]]. Names: Kerner, Stratton, Adamowski, Kennedy, Ward.'
    tags: [state:il, city:chicago, name:kerner-otto, name:stratton-william-g, name:kennedy-john-f, name:ward-daniel-p, name:adamowski-benjamin-s]
  - id: cal.1960-11-08.state-constitutions-mi
    when: Nov. 8
    date: '1960-11-08'
    thread: state-constitutions
    c: 'Michigan. Proposal 3, an amendment changing the way a constitutional convention is called, adopted, 1,312,215 to 959,527, 57.8 percent: the question to go to the voters in April 1961, a majority of those voting on it to carry it. Also adopted, Proposal 2, raising the sales tax limit, 1,250,264 to 1,230,001, 50.4 percent.'
    n: 'Votes: [Wikipedia, "List of Michigan ballot proposals"](https://en.wikipedia.org/wiki/List_of_Michigan_ballot_proposals), from the *Michigan Manual* (Check the terms and the figures). To check: [[w.sturm-constitution-making-in-michigan]].'
    tags: [state:mi]
  - id: cal.1960-11-08.state-constitutions-tx
    when: Nov. 8
    date: '1960-11-08'
    thread: state-constitutions
    c: Texas adopts four amendments. Legislators' pay up to $4,800 a year and $12 a day for the first 120 days of a session, regular sessions limited to 140 days, 763,531 to 604,087, 55.8 percent. The Legislature to regulate lenders and interest, 10 percent the ceiling where it sets none, 1,088,993 to 369,132, 74.7 percent. A hospital district; Veterans' Land Board bonds at up to 3.5 percent.
    n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 8, 1960](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1960-11-08). To check: [[w.may-texas-state-constitution]].'
    tags: [state:tx]
  - id: cal.1960-11-08.state-constitutions-ok
    when: Nov. 8
    date: '1960-11-08'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: Oklahoma. By referendum petition, the voters reject the act for withholding of State income tax from wages, 246,157 to 450,015, 35.4 percent. An amendment letting the Legislature call itself into special session refused, 320,915 to 382,952, 45.6 percent.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 24](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=24). See [[cal.1960-09-20.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1960-11-08.governors-nm
    when: Nov. 8
    date: '1960-11-08'
    thread: governors
    also: [elections-1960]
    c: New Mexico. Mechem (R) governor over Burroughs (D), 153,765 to 151,777, 50.3 percent, a 1,988-vote margin; Bolack (R) lieutenant governor, a 279-vote margin, as Kennedy carries the State.
    n: 'Votes: [Wikipedia, "1960 New Mexico gubernatorial election"](https://en.wikipedia.org/wiki/1960_New_Mexico_gubernatorial_election); [Wikipedia, "Tom Bolack"](https://en.wikipedia.org/wiki/Tom_Bolack); Check: N.M., *Canvass of Returns of General Election Held November 8, 1960*. Check: Bolack''s count and percentage. To check: [[w.peirce-mountain-states-of-america]]. See [[cal.1960-05-10.governors-nm]]; [[cal.1960-11-08.elections-1960]]. Names: Mechem, Burroughs, Bolack, Kennedy.'
    tags: [state:nm, name:mechem-edwin-l, name:burroughs-john, name:bolack-tom, name:kennedy-john-f]
  - id: cal.1960-11-08.state-constitutions-md
    when: Nov. 8
    date: '1960-11-08'
    thread: state-constitutions
    also: [cities-and-housing]
    c: 'Maryland. Fifteen amendments, all ratified: counties and towns other than Baltimore may be empowered to clear slum areas by urban renewal, 327,178 to 100,527, 76.5 percent; a Municipal Court for Baltimore City; succession to the governorship; bills vetoed after the session no longer returned to the next; land in farming assessed as farmland. The Potomac River Compact approved at referendum, 244,510 to 204,837, 54.4 percent.'
    n: '*Maryland Manual*, 1963–64, [pp. 484–91](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--484.html). To check: [[w.callcott-maryland-and-america-1940]].'
    tags: [state:md]
  - id: cal.1960-11-08.state-constitutions-ca
    when: Nov. 8
    date: '1960-11-08'
    thread: state-constitutions
    also: [state-and-city-finance, conservation, elections-1960]
    c: 'California. Proposition 1, the Water Resources Development Bond Act of 1959 (Burns–Porter), carries, 3,008,328 to 2,834,384, 51.5 percent: $1.75 billion in bonds for the State Water Project, Feather River water to the San Joaquin Valley and Southern California.'
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 8, 1960, p. 23](https://archive.org/details/stateofcaliforn195262cali/page/n348). Measure: [UC Law SF, California Ballot Propositions, 1960](https://repository.uclawsf.edu/ca_ballot_props/606/). To check: [[w.hundley-great-thirst]]; [[w.rarick-california-rising]]. Names: Burns, Porter.'
    tags: [state:ca, name:burns-hugh-m, name:porter-carley-v]
  - id: cal.1960-11-08.legislatures-ca
    when: Nov. 8
    date: '1960-11-08'
