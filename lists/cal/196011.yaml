    c: 'Moscow. Liu Shaoqi calls on Khrushchev on the second day. Khrushchev: neither can do without the other, quarrels are unavoidable, a few hairs pulled out, but they will stay united. Then at Albania: the USSR loses nothing in losing it, China gains little by it; and at Stalin. He says he does not agree with the Hundred Flowers, the Great Leap and the communes and hopes China will not force them on him. Liu: so large a country should have more breadth toward so small a one, and Albania is not in the wrong; the Chinese experiments are in trial, too early to call a success or a failure; China means to force nothing on anyone; the Soviet criticism in public was unwise.'
