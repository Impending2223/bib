    c: At the iron and steel plant of Jinan 济南, set up in 1958, too few toilets, workers relieving themselves on the factory floor; lice and scabies; scuffles, windows broken, doors smashed in; the strongest take the best beds; women teased, humiliated and abused by local cadres, none daring to sleep or go out alone.
