    n: 'Address in Cleveland at a Rally in the Public Square, [1960–61 Pub. Papers 836](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=888), 837–38; Address in Pittsburgh at a Dinner Sponsored by the Allegheny County Republican Executive Committee, [1960–61 Pub. Papers 846](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=898), 848–49 (Nov. 4, 1960). [[w.nixon-six-crises]], 368–69 (the day; the words). Check: Nixon puts "on-the-job training" at a Cleveland luncheon (369); the Papers, at the Public Square. See [[cal.1960-10-16.elections-1960]]. Names: Eisenhower, Nixon.'
