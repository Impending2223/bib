  - id: cal.1960-11-10.china-leadership-4
    when: Nov. 10
    date: '1960-11-10'
    thread: china-leadership
    c: 'Lin Biao 林彪, by letter to Mao 毛泽东, Zhou Enlai 周恩来, Li Fuchun 李富春 and Tan Zhenlin 谭震林, sends the General Political Department''s 总政治部 proposal that the garrisons be ordered to report local conditions to the local Party committees, and opposes it: well meant, but it would spoil relations between the garrisons and the committees, harm the Party''s unified leadership and set the army meddling in the Party''s work from outside; army cadres know local work no better and are swayed by families and well-to-do middle peasants; senior officers would press the local cadres; a nationwide clash of army and localities possible. Where a committee gives the army the task, it may report; else not, and only to the army''s political departments.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 406–407 (Nov. 10, 1960; note 1, Lin''s letter as the volume gives it). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Lin Biao, letter of Nov. 10, 1960 to Mao Zedong, Zhou Enlai, Li Fuchun and Tan Zhenlin disagreeing with the General Political Department''s proposal to order the garrisons to report local conditions to the local Party committees (cited by [[w.jianguo-yilai-mao-zedong]], XV, 406 n.1a); General Political Department of the PLA, proposal to order the garrisons to report local conditions to the local Party committees (sent by Lin Biao, Nov. 10, 1960) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 406 n.1b). Names: Lin Biao, Mao Zedong, Zhou Enlai, Li Fuchun, Tan Zhenlin. Check: whether the first edition''s notes (vol. 9, 1996) give it. Check: whether the letter is printed in full anywhere; the volume gives its substance only.'
