        - 'w.wofford-of-kennedys-and-kings 249: 1'
        - 'w.communications-freedom-of-communications-part 862–66: 1'
        - 'w.goodwin-remembering-america 123: 2'
    tags: [name:kennedy-john-f, name:eisenhower-dwight-d, name:rockefeller-nelson, name:lodge-henry-cabot, name:nixon-richard-m, state:ca, ok:fields-time]
