  - id: cal.1960-11-01.elections-1960-2
    when: Nov. 1
    date: '1960-11-01'
    thread: elections-1960
    c: 'David Lawrence''s syndicated column, on a Gallup forecast of a possible 50 percent shift of the Catholic vote from Eisenhower in 1956 to Kennedy: such a shift "could mean not only a landslide for Kennedy but possibly one of the largest popular vote totals ever given to a presidential candidate in American history."'
    n: '[[w.nixon-six-crises]], 359 (the column quoted). To check: David Lawrence''s column, Nov. 1, 1960 (cited by [[w.nixon-six-crises]], 359). Names: Eisenhower, Kennedy, Lawrence.'
    src:
