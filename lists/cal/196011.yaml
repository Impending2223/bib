  - id: cal.1960-11-21.soviet-union
    when: Nov. 21
    date: '1960-11-21'
    place: moscow
    thread: soviet-union
    also: [china-leadership, comecon]
    c: 'Moscow. The conference resumes after the recess of the 20th.{1} The Hungarian delegation tables a draft resolution on relations among parties, to be adopted at the conference, kept internal: six points, chief that international meetings decide by majority, and that two parties unable to settle a difference ask a third to arbitrate, and failing that put it to the international meeting by majority vote. A charter in effect.{2} Eight parties speak: Bolivia, Burma, Costa Rica, Malaya, India, Thailand, Ecuador, Algeria. Ba Thein Tin, Burma''s general secretary, disagrees wholly with the CPSU: the "three noes" are possible only after socialism wins the world; when the Twentieth Congress put forward peaceful transition, the party''s revisionists called for giving up armed struggle, and leaders defected and guerrillas deserted; "group factions" must not go into the resolution, and "national communism" must go. Peng Zhen attends.{3} Monje of Bolivia argues against China: the Twentieth and Twenty-first Congresses cannot be struck; the minority should follow the majority. Ghosh of India, though he blames China on the border, still holds that the passage on factional activity should be struck.{4}'
