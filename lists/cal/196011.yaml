    date: '1960-11-09'
    thread: elections-1960-count
    c: 'Election night, shortly after midnight. Hagerty telephones Salinger: Nixon will concede, and a congratulatory telegram from Eisenhower is on its way. Half an hour later he calls back: Nixon has changed his mind; forget the telegram. Salinger will say nothing of a message from the President until he hears again. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 47. Names: Hagerty, Salinger, Nixon, Eisenhower.'
