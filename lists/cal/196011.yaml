    c: 'Kennedy''s election eve. Manchester, N.H., with his three sisters: "I believe that there is a publisher who has less regard for the truth than William Loeb but I can''t think of his name." A nationwide question-and-answer program from Manchester, his sisters asking. The Boston Garden. At 11 p.m., a telecast from Faneuil Hall, his wife from Hyannis Port and Johnson from Austin on it.'
