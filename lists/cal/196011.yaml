  - id: cal.1960-11-26.soviet-union
    when: Nov. 26
    date: '1960-11-26'
    place: moscow
    thread: soviet-union
    also: [vietnam-hanoi, china-leadership]
    c: 'Moscow. Hồ Chí Minh leads a petition group to Khrushchev: delegates of a Northern European party, a Latin American party and several Asian parties, to urge the CPSU to give way. Khrushchev is hard, with no room to bargain. The Twentieth Congress must go in; he had held for both the Twentieth and the Twenty-first and now says only the Twentieth. Against factional activity must go in, or an internal resolution. Against the personality cult must go in, since the 1957 Declaration has it. He attacks the paper tiger, the Hundred Flowers, the Great Leap and the communes. The group is much concerned and still wants China and the CPSU to consult and agree.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 400–401 (the 26th; the Vietnamese told the Chinese that evening). Made public: 1999. See [[cal.1960-11-25.china-leadership]]. Names: Hồ Chí Minh, Khrushchev. Check: the account is the Vietnamese delegation''s, as told that evening to the Chinese.'
    src:
      c: a7d04d38
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 400–401: all'
    tags: [polity:prc, name:ho-chi-minh, name:khrushchev-nikita-s, vis:only:prc+ussr+drv]
  - id: cal.1960-11-26.soviet-union-2
    when: Nov. 26
    date: '1960-11-26'
    time: 1960-11-26T13:00Z
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow, the Chinese delegation''s quarters.{1} Khrushchev sends Mikoyan and Kozlov;{2} Deng Xiaoping and Peng Zhen talk with them.{3} Their points: the Twentieth Congress must go in; the wording against factional activity may be considered, a slight give; whether there is an internal resolution on the Hungarian proposal depends on China''s attitude;{4} if the conference ends well the Sino-Soviet differences end, look ahead, make unity; and the Chinese delegation is asked to tour the USSR after the conference, Liu''s visit as head of state widened to the whole party and government delegation. Deng: the conference is in substance an anti-China conference the CPSU set going, to China''s deep regret and wrath; the CPSU still holds its wrong line, and China urges it not to go to the end but to look further and put the large matter first; only with all the nails out of the draft, no resolution against China and no majority-rule resolution will China sign. Mikoyan and Kozlov cannot accept, will report to the Presidium.{5} Liu Shaoqi and Yang Shangkun are there. Liu: the visit depends on the meeting''s result; since the Nov. 5 letter the meeting runs on a wrong line and has come to the edge. The talk runs three hours.{6}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 401–402 ("the 26th"; Wu''s bracketed asides, that the wording point was "a slight loosening" and that the Hungarian point was a threat, are his); [[w.yang-shangkun-riji]], I, 628–630 (Nov. 26, 1960; 4 to 7 p.m., at Liu''s lodging; the invitation to a state visit renewed; Liu: the meeting run in the spirit of the Nov. 5 letter; with "national communism," the factional passage, the Twentieth and Twenty-first Congresses and an internal resolution the Chinese will not sign); [[w.deng-xiaoping-nianpu-1904]], III, 1601 (Nov. 26, 1960; afternoon, at Liu Shaoqi''s lodging; Deng, with Liu and Peng Zhen, with Mikoyan and Kozlov; Liu: if the statement must contain "national communism", the Twentieth Congress and factional activity, with an internal resolution censuring the Chinese, the delegation cannot sign); [[w.peng-zhen-nianpu-1902]], IV, 79–80 (Nov. 26, 1960, 4 p.m., at Liu Shaoqi''s lodging; Peng Zhen, with Liu, Deng Xiaoping and Yang Shangkun, talks with Mikoyan and Kozlov; the invitation to visit after the meeting stands; Liu: the visit depends on the result; the letter of Nov. 5 handed round, the siege inside and outside the meeting, a wrong line now at the edge; with "national communism," "group factional activity," the two Congresses and an internal resolution condemning China, no signature; the Soviets: "national communism" may go or be rewritten, "factional activity" rewritten or an internal decision, but leaving out the Twentieth Congress would mean its condemnation; three hours); [[w.peng-zhen-nianpu-1902]], IV, 79–80. Made public: 1999. See [[cal.1960-11-26.soviet-union]]. Names: Mikoyan, Kozlov, Deng Xiaoping, Peng Zhen, Liu Shaoqi, Yang Shangkun. Check: the account is the Chinese delegation''s.'
    src:
      c: a707a852
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 401–402: 1, 2, 3, 4, 5'
        - 'w.yang-shangkun-riji I, 628–630: 2, 4'
        - 'w.deng-xiaoping-nianpu-1904 III, 1601: ?'
        - 'w.peng-zhen-nianpu-1902 IV, 79–80: 6'
    tags: [polity:prc, name:mikoyan-anastas, name:kozlov-frol-r, name:deng-xiaoping, name:peng-zhen, name:liu-shaoqi, vis:only:prc+ussr, name:yang-shangkun]
    variants:
      - unit: '3'
