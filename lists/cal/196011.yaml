  - id: cal.1960-11-02.elections-1960-kennedy-5
    when: Nov. 2
    date: '1960-11-02'
    thread: elections-1960-kennedy
    c: 'California, the night of Eisenhower''s ride through New York with Rockefeller, Lodge and Nixon. Kennedy: "While we meet tonight ... the rescue squad has been completing its operation in the city of New York. ... We have all seen these circus elephants complete with tusks, ivory on their head and thick skins, who move around the circus ring and grab the tail of the elephant ahead of them. ... Dick Nixon grabbed that tail in 1952 and 1956, but this year he faces the American people alone. ... President Eisenhower is not running. Mr. Nixon is."'
    n: '[[w.goodwin-remembering-america]], 123 (Goodwin''s account; the place in California not given; the rejoinder repeated "at nearly every campaign stop"). See [[cal.1960-11-02.elections-1960-2]]. Names: Kennedy, Eisenhower, Rockefeller, Lodge, Nixon. Check: the day; "tonight," the day of the ride in New York.'
    tags: [name:kennedy-john-f, name:eisenhower-dwight-d, name:rockefeller-nelson, name:lodge-henry-cabot, name:nixon-richard-m, state:ca]
