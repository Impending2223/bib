    c: 'Investigators report on a famed dumpling shop in Shenyang: it trades food for goods from more than thirty construction units; the Municipal Aquatic Products Company hands it its whole supply of shrimps, meant for the suburbs, for dumplings; its cadres shop in the best department stores with dumpling coupons; the traffic police and the fire brigade are bought off, and coal delivery, water, toilet cleaning and hygiene inspections paid in dumplings.'
