  - id: cal.1960-11-06.elections-1960
    when: Nov. 6
    date: '1960-11-06'
    thread: elections-1960
    c: Nixon proposes that Eisenhower, Hoover and Truman go to Eastern Europe in 1961 and the Communist bloc's leaders be invited here. Eisenhower, Hagerty and Ann Whitman find it contrived; Eisenhower will not make the trip.
    n: '[[w.kallina-kennedy-v-nixon]], 172. To check: A Statement by Senator John F. Kennedy on Proposal Advanced by Mr. Nixon in Nationally Televised TV Show, [APP](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-proposal-advanced-mr-nixon-nationally-televised-tv-show) (Nov. 7, 1960); [[w.ambrose-nixon]], 601–02. Names: Nixon, Eisenhower, Truman, Hagerty, Whitman.'
    src:
      c: 72d05e37
      rows:
        - 'w.kallina-kennedy-v-nixon 172: all'
    tags: [name:nixon-richard-m, name:eisenhower-dwight-d, name:truman-harry-s, name:hagerty-james-c, name:whitman-ann-c]
