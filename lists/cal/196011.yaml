    c: 'Moscow. In the afternoon, after the parade, Andropov, head of the Central Committee''s liaison department, brings the Chinese delegation the CPSU''s letter in answer to the Reply (the letter dated Nov. 5). He says the letter is one thing, the conference another.{1} Suslov had told Deng after the celebrations that the answer was coming and had some pepper. The letter defends the CPSU and denies it said what the Reply says; attacks China, Mao and Liu; charges China with setting parties against one another, in the cases of Albania, Poland, Hungary, and the Australian and American parties; and presses hardest on Albania.{2} The letter runs over 80,000 characters, 91 pages in Chinese. Andropov gives it to Liu Xiao and hopes it is not tied to the meeting: "the meeting is the meeting, the answer is the answer." Liu Shaoqi has the delegation read it.{3}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 373–374 ("that afternoon", after the parade; dated Nov. 5 at 377, 380 and 446); [[w.yang-shangkun-riji]], I, 589–590 (Nov. 7, 1960; Andropov gives it to Liu Xiao after the march; over 100 pages, 91 in Chinese, some 80,000 characters; the delegation reads twenty pages at Liu Shaoqi''s at 2 p.m. before the reception); [[w.deng-xiaoping-nianpu-1904]], III, 1593 (Nov. 7, 1960; the CPSU''s answer of Nov. 5 to the Chinese Reply of Sept. 10, handed by Andropov to Liu Xiao that morning; Deng at Liu''s delegation meeting that afternoon to read it); [[w.peng-zhen-nianpu-1902]], IV, 70–71 (Nov. 7, 1960; the CPSU''s answer of Nov. 5 to the Reply of Sept. 10, over 80,000 characters, 91 pages in Chinese, handed by Andropov to Liu Xiao after the parade; Andropov: let it not be tied to the meeting (the 81 parties'', so the page''s note), "the meeting is the meeting, the answer is the answer"; that afternoon Liu Shaoqi has the delegation read it); [[w.peng-zhen-nianpu-1902]], IV, 70–71. Made public: 1999. Check: Peng Zhen nianpu (IV, 71) has Andropov give the letter to Liu Xiao after the morning ceremony ended, the delegation reading it in the afternoon; Deng nianpu (III, 1593) has it handed that morning. See [[cal.1960-11-07.soviet-union]]. Names: Andropov, Suslov, Deng Xiaoping, Mao Zedong, Liu Shaoqi, Liu Xiao. Check: the account is the Chinese delegation''s; Wu says the letter was "distributed" to the parties before the conference (374), and has Liu say it was issued on Nov. 5 (446).'
    src:
