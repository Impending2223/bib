  - id: cal.1960-11-15.economy
    when: Nov. 15
    date: '1960-11-15'
    place: augusta-ga
    thread: economy
    c: 'Augusta, Ga. Eisenhower with Anderson, Gates and others; Goodpaster reads the draft directive on the balance of payments, and it is revised. Gates: 500,000 dependents abroad; Anderson: a goal of 200,000, a cut of 60 percent. Gates fears the services'' fuss and Kennedy''s use of the issue; Eisenhower: morale will be all right with proper leadership. State''s embassies to be cut too. Anderson to ask Adenauer $650 million a year; the directive out Wednesday.{1} Present also: Lennartson, von Klemperer of the Treasury, Gen. George Brown, Hagerty and Col. John Eisenhower, who writes the memorandum. Eisenhower opens on the State and Defense memorandum for continued military aid to Italy, Belgium and the Netherlands; Anderson would make them pay. He wants the lower ranks favored in the cut of dependents; the regular services are "enlisted for service and not for personal gain."{2}'
    n: '[FRUS 1958–60, IV, doc. 58](https://history.state.gov/historicaldocuments/frus1958-60v04/d58) (John S. D. Eisenhower, memorandum of conference with the President; present Anderson, Gates, Lennartson, von Klemperer, Gen. George Brown, Hagerty, Goodpaster, John Eisenhower). Made public: FRUS 1958–60, IV (1992). [[w.watson-into-the-missile-age]], 749 (the meeting of Nov. 15: the directive drafted by Goodpaster approved; the reduction of the estimated 500,000 military dependents; Gates on retention and enlistment, 60 percent; Eisenhower on service and "not personal gain"; not Augusta, State, Adenauer or the date of release). To check: Memo of conf with Pres (J. S. D. Eisenhower), Nov. 15, 1960, Staff Notes Nov 60, Box 54, DDED ser, PP (AWF), DDEL (cited by [[w.watson-into-the-missile-age]], 749 n.89). See [[cal.1960-11-09.economy]]; [[cal.1960-11-13.economy]]. Names: Eisenhower, Anderson, Gates, Goodpaster, Kennedy, Adenauer, Hagerty, George Brown, John Eisenhower.'
    src:
      c: 9c7c664f
      rows:
        - 'w.watson-into-the-missile-age 749: ?'
        - 'https://history.state.gov/historicaldocuments/frus1958-60v04/d58: 1, 2'
    tags: [name:eisenhower-dwight-d, name:anderson-robert-b, name:gates-thomas-s-jr, name:goodpaster-andrew-j, name:kennedy-john-f, name:adenauer-konrad, state:ga, name:hagerty-james-c, name:brown-george-s, name:eisenhower-john-s-d]
  - id: cal.1960-11-15.transition-and-staff-cabinet
    when: Nov. 15
    date: '1960-11-15'
    place: palm-beach
    thread: transition-and-staff-cabinet
    c: 'Palm Beach, Tuesday. Ribicoff golfs with Kennedy, talks with him two hours, and is offered the Attorney Generalship. Ribicoff declines: the Attorney General would be mainly involved in civil rights, and an Irish Catholic President with a Jewish Attorney General enforcing school desegregation would hardly "set well in the Protestant South." He goes instead to Health, Education and Welfare.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 258–59 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Ribicoff, Kennedy, Robert Kennedy.'
    tags: [name:ribicoff-abraham, name:kennedy-john-f, name:kennedy-robert-f, state:ct]
  - id: cal.1960-11-15.china-leadership
    when: Nov. 15
    date: '1960-11-15'
    thread: china-mao
    c: 'Mao to Zhou Enlai, on the report of ten thousand central cadres sent down: amid the "fine situation," a time to speak at length of the bad third of the country: bad men in power, beatings and deaths, grain down, hunger, the democratic revolution unfinished, feudal forces at work.{1} Mao adds that those who go need the will not to fear hardship, else they must not go; two-thirds of the country is fine, a third bad, to be turned round within five months for a great harvest in 1961.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 15, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 398–400 (Nov. 15, 1960; Mao''s comment to Zhou Enlai, the morning of Nov. 15 (十五日晨), on the report of Nov. 10 of the Center''s five-man group: 10,176 cadres of the central organs to be sent down, 7.33 percent, for three years as a rule; those who go must have the will not to fear hardship, else they must not go; Zhou to decide; printed from the manuscript); [[w.macfarquhar-origins-of-the-cultural]], III, 403 (in November 1960 Mao lays the poor conditions of a third of the countryside to bad elements); [[w.yang-jisheng-mubei]], II, 834–835 (Nov. 10, the five-man group''s report on drawing ten thousand cadres from the central organs; Nov. 15, Mao''s comment on it, and his note on the same report to Zhou: for a time speak at length of the bad third of the country; bad men in power, beating and killing, grain down, hunger, the democratic revolution not complete, feudal forces); [[w.mao-zedong-zhuan]], V, ch. 66 n.62 (Nov. 15, Mao''s letter to Zhou Enlai on the ten thousand cadres, with the notes on the report: one third of the country bad, to be told; five months to turn it; the harvest of 1961). [[w.yang-jisheng-mubei]], II, 1138 n.59 (Mao''s comment of Nov. 15, 1960 on the report on sending ten thousand cadres down: for a stretch to speak at length of the bad third of the places, with bad men in power, beatings and deaths, grain down, hunger, the democratic revolution not finished and feudal forces rampant); [[w.yang-jisheng-tiandi-fanfu]], I, 82 ("a time to speak much of the bad situation in a third of the places: bad men in power, beatings and deaths, grain down, hunger, the democratic revolution not finished, the feudal forces at work"); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 695–701 (Mao''s comment in full, Nov. 15, 1960, under the title "In five months turn round the situation of a third of the country and win a great harvest in 1961" 一定要在五个月内把三分之一地区的形势都转变过来争取一九六一年的农业大丰收, with the five-man group''s report of Nov. 10: 10,176 cadres to go down, 7.33 percent of the central organs'' 138,000-odd; printed from the Center''s document); [[w.jianguo-yilai-mao-zedong]], XV, 398–399. Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 695–701). Check: Mao''s second comment on the report, under ''speak at length of the situation'' (XV, 398–399): the fine situation in two-thirds of the country, a bad one in a third; within five months the whole to be turned around, for a great harvest in 1961; it is not in `c`. Check: Li Jian''s account, as Yang Jisheng gives it, has Mao write the comment "in the investigation report" on Nov. 15 (I, 74); Yang''s own text puts it on the Nov. 10 report on sending down the central cadres (II, 834), which [[w.jianguo-yilai-mao-zedong]], XV, 398–400, also gives. Check: Made public: [[w.jin-1949-1989-niande-zhongguo]], 534–6 (1989), named here, may print Mao''s comment earlier than 1996. To check: [[w.jin-1949-1989-niande-zhongguo]], 534–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 403 n.26); Mao Zedong 毛泽东, letter to Zhou Enlai 周恩来 and notes on the report on sending 10,000 cadres of the central organs down (manuscript 手稿), Nov. 15, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.62); [[w.zedong-jianguo-yilai-mao-zedong]], IX, 349 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 82 n.104). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Xiao Hua.'
