    tags: [polity:prc, vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia, name:peng-zhen, name:kang-sheng, name:hu-qiaomu, name:liu-ningyi]
