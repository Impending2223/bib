    also: [china-leadership, comecon]
    c: 'Moscow.{1} Liu Shaoqi calls on Khrushchev on the second day.{2} Khrushchev: neither can do without the other, quarrels are unavoidable, a few hairs pulled out, but they will stay united. Then at Albania: the USSR loses nothing in losing it, China gains little by it; and at Stalin. He says he does not agree with the Hundred Flowers, the Great Leap and the communes and hopes China will not force them on him. Liu: so large a country should have more breadth toward so small a one, and Albania is not in the wrong; the Chinese experiments are in trial, too early to call a success or a failure; China means to force nothing on anyone; the Soviet criticism in public was unwise.{3}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 372 ("the second day" after arrival); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 496 (Nov. 6, 1960; Liu calls on Khrushchev, then on Brezhnev); [[w.yang-shangkun-riji]], I, 587 (Nov. 6, 1960; noon to 2 p.m., in Khrushchev''s office in the Kremlin, Khrushchev doing most of the talking: "we have lost Albania, a small loss; you have gained Albania, not much gained"); [[w.deng-xiaoping-nianpu-1904]], III, 1593 (Nov. 6, 1960; noon; Deng with Liu calls on Khrushchev in the Kremlin, and at the Presidium''s lunch for the delegation); [[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 6, 1960; the whole delegation calls on Khrushchev in the Kremlin and attends the Presidium''s banquet). Made public: 1996. See [[cal.1960-11-05.soviet-union]]. Names: Liu Shaoqi, Khrushchev. Check: the day; Wu says only the second day after Liu reached Moscow (Nov. 5, p. 446).'
