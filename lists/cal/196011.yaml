  - id: cal.1960-11-25.china-leadership
    when: Nov. 25
    date: '1960-11-25'
    place: moscow
    thread: china-leadership
    also: [soviet-union, vietnam-hanoi]
    c: 'Moscow, the Chinese embassy, afternoon to night. The delegation weighs the last stage. Holding firm through the second round, it judges, has shaken the delegations: the left heartened, the center, among them the capitalist countries'' parties and some ruling ones, alarmed at a split of two great parties, Khrushchev''s followers afraid to bear a break. Hồ Chí Minh tells the Chinese he will lead a delegation to both parties to urge a compromise. Decisions: keep the resolve not to fear a break; all the "nails" and the unnamed attacks out, or no signature; none for a majority-rule resolution even if the nails go. Signing is form; the draft otherwise an anti-Chinese text, for history to judge. A break would mean the CPSU''s anti-China course, Soviet and East European aid cut, party ties cut, a diplomatic blockade and state relations ended, isolation in international bodies, separate courses on imperialism, national liberation and the workers'' movement: none enough to bend China. Six open questions: father-and-son or equal parties; majority rule or consultation to agreement; what factional activity is and who does it; what national communism is and who; whether the Twentieth and Twenty-first Congresses are affirmed; the cult of personality. The delegation cables Peking deep at night for what it may yield and when sign or not.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 397–400 ("the afternoon to the evening of the 25th"; the cable "deep at night" of the 25th). Made public: 1999. See [[cal.1960-11-25.soviet-union]]. Names: Hồ Chí Minh.'
    src:
      c: c019af1e
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 397–400: all'
    tags: [polity:prc, name:ho-chi-minh, vis:only:prc]
    time_range:
