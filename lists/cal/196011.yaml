  - id: cal.1960-11-09.economy
    when: Nov. 9
    date: '1960-11-09'
    thread: economy
    c: 'Eisenhower with Anderson, Dillon, Gates, Stans, Martin and others, on the gold. Anderson: the stock $18,116 million, $218 million to go out Thursday, "almost a gold panic." Steps to take alone: fewer dependents abroad, fewer troops, no foreign goods at the exchanges, aid loans tied to American goods. Gates: the military not to be singled out; Eisenhower: no intention of it. Anderson to head a group.'
    n: '[FRUS 1958–60, IV, doc. 57](https://history.state.gov/historicaldocuments/frus1958-60v04/d57) (Goodpaster, memorandum of conference with the President, drafted Nov. 14; present Anderson, Dillon, Baird, Gates, Douglas, Lemnitzer, Stans, Martin, Paarlberg, Persons, Kendall, Goodpaster). Made public: FRUS 1958–60, IV (1992). [[w.watson-into-the-missile-age]], 749 (the meeting at the White House on the balance of payments; the talk of overseas dependents; Gates''s assurance from the president that the military would not be turned into "second class citizens"; not the gold, Anderson''s other steps or the group). To check: Memo of conf with Pres (Goodpaster), Nov. 9, 1960, Staff Notes Nov 60, Box 54, DDED ser, PP (AWF), DDEL (cited by [[w.watson-into-the-missile-age]], 749 n.88). Names: Eisenhower, Anderson, Dillon, Gates, Stans, Martin.'
    tags: [name:eisenhower-dwight-d, name:anderson-robert-b, name:dillon-c-douglas, name:gates-thomas-s-jr, name:stans-maurice-h, name:martin-william-mcchesney-jr]
