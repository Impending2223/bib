    c: 'The Yinian Tang, 5:50 p.m.{1} Zhou Enlai reports to Mao the analysis of the delegation''s request on signing the Moscow statement (Chen Yi, Li Fuchun, He Long, Li Xiannian, Tan Zhenlin, Chen Boda, Bo Yibo, Luo Ruiqing, Wu Xiuquan, Zhou Yang): five cases;{2} the likeliest, no secret resolution but the Twentieth Congress in the statement.{3} The regional bureaus'' secretaries called to Peking for an enlarged Politburo.{4}'
