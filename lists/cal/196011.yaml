    when: Nov. 2
    date: '1960-11-02'
    thread: elections-1960
    also: [cuba]
    c: 'Hoover reports to Nixon on Ball''s talk with the French Ambassador, Alphand, Oct. 31, as the FBI recorded it: Ball expects an invasion of Cuba from Central America that week, and "a terrible atmosphere for the election."'
