    c: 'Moscow, the Chinese delegation''s quarters, the afternoon before the conference. Suslov, Kozlov and Mikoyan call;{1} Deng Xiaoping and Peng Zhen receive them.{2} Khrushchev''s speech tomorrow, they say, will stress unity, friendly in tone, leave out the Sino-Soviet quarrel, keep to the draft statement and Soviet home matters; the CPSU does not want an argument at the conference, will look ahead, regards its letter as settled and unconnected with the meeting, and wants better relations with Albania. Mikoyan: after the conference the Soviets will take up trade, aid and experts with China;{3} the oil stop, of which the Presidium did not know, will be lifted soon; experts can stay if China stops giving them papers against the CPSU''s Central Committee. Deng: China came for unity and for agreement on Marxist-Leninist ground; the letter of Nov. 5 poisoned the air and the CPSU began it, so China must answer at the conference. China will stay friendly with no Soviet aid and no experts, and build on its own strength.{4} Ponomarev and Andropov come too, at 5 p.m., to Liu Shaoqi''s lodging; Liu, Deng and Peng answer in turn, the quarrel is theirs.{5} Mikoyan: the 1,300 lorries and part of the oil, refused by the departments, are to be settled; experts can be sent again, 38 still in China.{6}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 376–377 ("that afternoon", the day before the opening); [[w.yang-shangkun-riji]], I, 592 (Nov. 9, 1960; 5 p.m., at Liu Shaoqi''s lodging, the whole delegation present; Suslov, Kozlov, Mikoyan, Ponomarev and Andropov; Mikoyan: the 1,300 lorries and the oil refused by the departments, to be settled; experts can be sent again, 38 still in China; Liu, Deng and Peng: the letter of Nov. 5 has changed the case, an answer at the meeting seems unavoidable; three hours, by the diary''s count); [[w.deng-xiaoping-nianpu-1904]], III, 1595 (Nov. 9, 1960; afternoon, at Liu Shaoqi''s, the whole delegation; to Suslov and Kozlov, come to urge unity and no dispute at the meeting, Deng: the answer of Nov. 5, over a hundred pages in Russian, wrecks unity; the argument is yours; we must answer at the meeting); [[w.mao-zedong-zhuan]], V, ch. 66 n.52 (Nov. 9, Suslov and the others call on the Chinese delegation: Khrushchev''s speech to stress unity; the disagreements may be taken up later (Yang Shangkun''s diary, 583-586)). [[w.peng-zhen-nianpu-1902]], IV, 72 (Nov. 9, 1960, 5 p.m., at Liu Shaoqi''s lodging; Suslov, Kozlov, Mikoyan, Ponomarev and Andropov: sent by their Central Committee to say the meeting is to remove differences; Khrushchev''s speech constructive, without polemic, not touching the Reply; the differences to be discussed later; Mikoyan: aid will go on, experts may be sent again, trade requests refused by "the departments" can be settled; Liu Shaoqi, Deng Xiaoping and Peng Zhen in turn: they came to speak for unity, the hundred-page answer has destroyed it, the talk of unity untrue; an answer at the meeting unavoidable, the quarrel theirs); [[w.peng-zhen-nianpu-1902]], IV, 72; [[w.yang-shangkun-riji]], I, 592. Made public: 1999. See [[cal.1960-11-07.soviet-union-2]]. Names: Suslov, Kozlov, Mikoyan, Deng Xiaoping, Peng Zhen, Ponomarev, Andropov, Liu Shaoqi. Check: the account is the Chinese delegation''s.'
