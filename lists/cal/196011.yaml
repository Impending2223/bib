    n: '*Bush v. Orleans Parish School Board*, [188 F. Supp. 916](https://static.case.law/f-supp/188/case-pdfs/0916-01.pdf) (E.D. La. 1960); [364 U.S. 500](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364500/usrep364500.pdf) (1960). See [[cal.1960-11-14.desegregation-schools]]. Names: Wright.'
    tags: [name:wright-j-skelly]
  - id: cal.1960-11-30.elections-1960
    when: Nov. 30
    date: '1960-11-30'
    thread: elections-1960
    c: 'Eisenhower telephones the Attorney General, "very much disturbed" by the charges of fraud: the government to use whatever rights and responsibilities it has; the election "a closed issue," but "we owed it to the people of the United States." The Attorney General less moved, by Ann Whitman''s account. With Nixon unwilling, the President drops it.'
    n: '[[w.kallina-kennedy-v-nixon]], 185. To check: Ann Whitman''s diary, Nov. 30, 1960, Eisenhower Library (cited by [[w.kallina-kennedy-v-nixon]], 185 n.22); [[w.ambrose-eisenhower]], 604. Names: Eisenhower, Whitman, Nixon. Check: the day, from Kallina''s note (252 n.22).'
