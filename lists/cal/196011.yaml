    c: 'Hyannis Port, just after three in the morning.{1} Kennedy and his staff watch Nixon''s appearance on television.{2} Salinger urges him to the Armory to match it;{3} Kennedy: "Why should he concede? I wouldn''t."{4} He will say nothing until Nixon speaks again, and goes to bed near four.{5}'
    n: '[[w.white-making-of-the-president]], 24–25, 345; [[w.schlesinger-robert-kennedy-and-his]], 219 (at 3:15 a.m. Robert Kennedy tells his brother to go to bed and sleep well, they had won; no word from Nixon; Pennsylvania and Michigan looking fairly definite; not the Armory, Salinger or the words on conceding); [[w.odonnell-johnny-we-hardly-knew]], 252–53 (a few minutes after three, Kennedy watches Nixon on television; Salinger has been urging him to appear before the reporters and cameras at the armory; Kennedy: "You want me to put on a performance like that at this hour of the night? Not me. I''m going to bed"; not the hour he went to bed or his waiting for Nixon to speak again); [[w.salinger-with-kennedy]], 47–48 (at Ambassador Kennedy''s home Kennedy and his staff watch Nixon on television; Kennedy turns off the set, cuts off the talk against Nixon, and walks home to bed; not the Armory or the hour); [[w.obrien-no-final-victories]], 96 (Nixon on television around 3 a.m., refusing to concede; to someone''s "Why don''t you give up?" Kennedy: "Why should he? ... I wouldn''t, in his place"; Lodge on television, "Cabot looks like he''s having a hard time staying awake"; Kennedy leaves about four, saying he is going to bed; not Salinger or the Armory). Watching Nixon''s appearance: [[w.white-making-of-the-president]], 24–25. See [[cal.1960-11-09.elections-1960]]. Names: Kennedy, Salinger, Nixon.'
