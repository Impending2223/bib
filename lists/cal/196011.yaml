  - id: cal.1960-11-22.soviet-union
    when: Nov. 22
    date: '1960-11-22'
    place: moscow
    thread: soviet-union
    also: [china-leadership, china-foreign]
    c: 'Moscow 莫斯科, the Kremlin 克里姆林宫.{1} The first round of speeches ends with the morning session.{2} From Nov. 10 to 22, the 13th and 20th recess days, 77 parties spoke, by Wu''s count: 51, Khrushchev among them, wholly on Khrushchev''s side; 15 between; 11, China''s among them, mostly against his views. The chair announces that Khrushchev will speak tomorrow.{3} Morning: Hakamada Satomi of Japan, the Dominican Republic, Ceylon, Sharkey of Australia, Nicaragua, Haiti.{4} Hakamada: what is not agreed stays out of the paper, differences are not to be carried abroad or into the mass organizations, no standing committee yet.{5} In the afternoon the Réunion, Peruvian and Martinique delegates speak; the chair closes the general debate and the Chinese at once ask to speak a second time.{6} Peng Zhen attends the eleventh plenary all day.{7} Yang Shangkun 杨尚昆 puts the Chinese delegation down for the second speech.{8}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 388, 390 ("the morning of the 22nd"; the count at 388); [[w.yang-shangkun-riji]], I, 622–623 (Nov. 22, 1960; Hakamada (Japan), the Dominican, the Ceylonese, Sharkey, the Nicaraguan, the Haitian; afternoon the Réunion, Peruvian and Martinique delegates; the general debate closed; at 623 Yang, as the debate closes, puts the Chinese delegation down for a second speech); [[w.peng-zhen-nianpu-1902]], IV, 77 (Nov. 22, 1960, all day; Peng Zhen at the eleventh plenary; Japan, the Dominican Republic, Ceylon, Australia, Nicaragua, Haiti, Peru; Hakamada Satomi of Japan: what is not agreed to stay out of the paper, differences not to be carried abroad or into the mass organizations, no standing committee yet; when the speeches end in the afternoon the chair closes the general debate, Khrushchev to speak the next morning; the Chinese at once ask to speak a second time). Made public: 1999; the diary, 2001 ([[w.shangkun-yang-shangkun-riji-2]]). See [[cal.1960-11-21.soviet-union]]. Names: Khrushchev, Hakamada, Sharkey, Peng Zhen, Yang Shangkun. Check: the Yang Shangkun diary and the Peng Zhen chronology have speakers into the afternoon, the general debate closed then ([[w.yang-shangkun-riji]], I, 622–623; [[w.peng-zhen-nianpu-1902]], IV, 77). Check: the count is the Chinese delegation''s (388: 51 parties, the CPSU among them; "the 50" that followed Khrushchev).'
    src:
      c: cefed4b8
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 388, 390: 1, 2, 3'
        - 'w.yang-shangkun-riji I, 622–623: 1, 2, 4, 6, 8'
        - 'w.peng-zhen-nianpu-1902 IV, 77: 5, 7'
