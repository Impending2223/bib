  - id: cal.1960-11-04.immigration
    when: Nov. 4
    date: '1960-11-04'
    thread: immigration
    also: [elections-1960]
    c: 'McCaffrey sends Nixon''s statement on immigration, made in Philadelphia, to the Nixon-Lodge Committee of northern California for the Chinese papers: the laws "should and must be liberalized"; more immigrants a year, the quotas pooled, a newer census their base, relatives of citizens, and "greater recognition to immigrants from the newly-emerging nations." Eisenhower asked for amendment; Congress, "controlled by Mr. Kennedy and his followers," did nothing.'
    n: '[[w.gifford-center-cannot-hold]], 191. To check: McCaffrey to Robert G. Alderman, telegram, Nov. 4, 1960, Series 320, Box 37, "ANNL," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 191 n.68). See [[cal.1960-03-17.immigration]]. Names: Nixon, Eisenhower, Kennedy. Check: the day of the statement in Philadelphia. Check: Gifford, 227 n.67: the statement cites the 1920 census as the quotas'' base, which the act of 1924 set at 1890''s.'
    src:
      c: 4961953b
      rows:
