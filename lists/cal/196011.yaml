  - id: cal.1960-11-02.peace-corps
    when: Nov. 2
    date: '1960-11-02'
    place: san-francisco
    thread: peace-corps
    also: [elections-1960, elections-1960-kennedy]
    follows:
      - cal.1960-11-02.elections-1960-2
      - cal.1960-11-02.elections-1960-kennedy-4
    c: 'Kennedy at the Cow Palace, San Francisco, proposes "a peace corps of talented young men and women," three years abroad, "as an alternative or as a supplement to peacetime selective service."{1} The night of Eisenhower''s ride through New York with Rockefeller, Lodge and Nixon, he says: "While we meet tonight ... the rescue squad has been completing its operation in the city of New York. ... We have all seen these circus elephants complete with tusks, ivory in their head and thick skins, who move around the circus ring and grab the tail of the elephant ahead of them. ... Dick Nixon grabbed that tail in 1952 and 1956, but this year he faces the American people alone. ... President Eisenhower is not running. Mr. Nixon is."{2}'
    n: '[Speech of Senator John F. Kennedy, Cow Palace, San Francisco, CA](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-cow-palace-san-francisco-ca). [[w.wofford-of-kennedys-and-kings]], 249 (the Cow Palace, six days before the election; the Michigan students'' response cited; the petitions at Toledo after); [[w.communications-freedom-of-communications-part]], 862–66 (the speech at the Cow Palace; 865: "a peace corps of talented young men and women, willing and able to serve their country in this fashion for 3 years as an alternative or as a supplement to peacetime selective service"); [[w.goodwin-remembering-america]], 123 (Goodwin''s account of the rejoinder; the rejoinder repeated "at nearly every campaign stop"). The text at APP, of Nov. 2, holds both passages and reads "ivory in their head" (Goodwin, 123: "on"). See [[cal.1960-10-14.peace-corps]], [[cal.1960-11-02.elections-1960-2]]. Names: Kennedy, Eisenhower, Rockefeller, Lodge, Nixon.'
    src:
      c: 6be427d3
      rows:
