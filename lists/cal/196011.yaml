    c: Xinyang 信陽. Li Xiannian 李先念, Xu Zirong 徐子榮 and Wang Congwu 王從吾 from the Center, Tao Zhu 陶鑄 and Wang Renzhong 王任重 from the Central-South Bureau, come with Wu Zhipu 吳芝圃. Zhang Shufan 張樹藩 receives them at the infantry school. Over tea Wu says the province knew nothing; Zhang asks whether he truly knew nothing, who approved the months of struggle against him; Tao stops him, saying the criticism of him was wrong and he will be cleared. Li Xiannian weeps at the number of dead.
