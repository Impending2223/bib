    c: Kennedy at Los Angeles reads the Republicans' votes against school construction and denounces the Vice President's "tie-breaking vote killing a Democratic bill giving the states money to increase teachers' salaries."
    n: 'Speech of Senator John F. Kennedy, Beverly Hilton Hotel, Los Angeles, CA, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-beverly-hilton-hotel-los-angeles-ca) (Nov. 2, 1960). [[w.sundquist-politics-and-policy]], 187; [[w.graham-uncertain-triumph]], 9 (the speech at Los Angeles; its pledge: "in 1961, a Democratic Congress—under the leadership of a Democratic President—will enact a bill to raise teachers'' salaries as well as fund school construction"); [[w.communications-freedom-of-communications-part]], 853–57 (the speech at the Beverly Hilton Hotel, Los Angeles, Nov. 2: 855, Nixon "cast the deciding vote in the Senate" against aid for teachers'' salaries; the House Republicans'' votes on school construction, 1957, 1958 and 1960; the words "tie-breaking vote killing a Democratic bill giving the states money to increase teachers'' salaries" and the pledge quoted in the note are not in the report''s text). Check: the report''s text of the Beverly Hilton speech (853–57) has Nixon "cast the deciding vote in the Senate" against aid for teachers'' salaries (855), not the quoted "tie-breaking vote killing a Democratic bill giving the states money to increase teachers'' salaries.". To check: *The Speeches of Senator John F. Kennedy, Presidential Campaign of 1960*, S. Rept. 994, 87th Cong., 1st sess; *The Speeches of Senator John F. Kennedy*, S. Rept. 994, 87th Cong., 1st sess., pt. 1 (1961), 1235 (cited by [[w.graham-uncertain-triumph]], 9 n.22). (1961), pt. 1, 1235 (cited by [[w.sundquist-politics-and-policy]], 187 n.107). Names: Kennedy, Nixon.'
