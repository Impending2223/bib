    c: 'The Wuwei 無為 county committee 縣委 reports on carrying out the Center''s twelve-article emergency directive letter 貫徹中央12條緊急指示信的情況: a few cadres arbitrarily punish the people, tying up, hanging and beating them, withholding meals, making them kneel, freeze or sit in the sun; some keep private jails and small labor-reform teams. It lists cases, among them communes Xinhe 新河, Tanggou 湯溝, Yaogou 姚溝 and Hongqi 紅旗.'
