  - id: cal.1960-11-25.china-leadership-8
    when: Nov. 25
    date: '1960-11-25'
    thread: china-famine
    also: [china-economy]
    c: 'Zhejiang 浙江. Chen Yun 陈云, hearing the heads of the Zhejiang committee 中共浙江省委: to bar peasants from the towns by fiat goes against economic law; keep them by more grain, more side-lines, higher grain purchase prices and a narrower gap between town and country; in Japan 日本 most village families have a member working in town, and home industries work for big industry; farming cannot arm itself from its own savings, and the time has come for industry to support it; the drought of Hebei 冀, Shandong 鲁, Henan 豫 and northern Jiangsu 苏北 and Anhui 皖北 calls for water dispatched like an electric grid and the south''s water brought north; the planners, after the Soviet tradition, see only industry and transport; trade and finance to work by economic law, backed by administrative power; the home market neglected; the Center 中央 and the provinces to share by contract and proportion (a province with 1.8 million tons of steel capacity to deliver 1.6 million and keep 200,000); a leadership that hears no contrary view is in danger, and outside the first secretary and the organization chief no one dares tell the truth about cadres.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 56–57. Made public: 2005 ([[w.chen-yun-wenji]], where the nianpu says it is printed). To check: [[w.chen-yun-wenji]], III. Names: Chen Yun.'
    tags: [polity:prc, name:chen-yun, vis:only:prc]
  - id: cal.1960-11-25.china-leadership-9
    when: Nov. 25
    date: '1960-11-25'
    thread: china-twelve-articles
    c: 'Peng Dehuai 彭德怀 writes "Notes on reading the Center''s urgent directive" 《读中共中央紧急指示的笔记》: basically good, the return of private plots and houses and the end of the "communist wind" heartening; but it keeps the public mess halls 公共食堂, born of "eating without paying," which waste the cadres'' strength, and while they stand the peasants'' zeal will not revive; it says nothing of the imbalances, boasting and coercion since 1958, and is only the start of correcting the errors. A Communist, he should put this to the Center; but after the Lushan 庐山 meeting and the Eighth Plenum 八届八中全会 it would do no good and might be misread: better to read on, and ask to be sent down to the villages to labor and investigate.'
    n: '[[w.peng-dehuai-nianpu]], 761–762. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai, ok:fields-place]
  - id: cal.1960-11-25.china-leadership-10
    when: Nov. 25
    date: '1960-11-25'
    thread: china-twelve-articles
    c: 'The Gansu committee 甘肃省委 to the Center 中共中央 and the Northwest Bureau 西北局, its fourth report on carrying out the Emergency Directive Letter 《关于贯彻中央紧急指示信的第四次报告》: its three-level cadre conference dug at the roots of the "communist wind" that kept returning; the committee''s own errors examined, as in July and early October.'
    n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 730–741 (printed with the Center''s comment of Nov. 28, 1960; printed from the Center''s document). Made public: 1996. See [[cal.1960-11-20.china-leadership-2]].'
    tags: [polity:prc, vis:only:prc]
