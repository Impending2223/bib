    c: 'Moscow, a room beside the hall (the committee suspended an hour for coffee). Peng Zhen asks Kozlov out. Is it your design to break the conference? If so, say it openly and China will issue a statement. Kozlov, "No, no, we want it to go well." Peng proposes a gentleman''s agreement: (1) no internal resolution, neither anti-Chinese nor by majority; (2) neither national communism nor factional activity attacked in the statement; (3) the principle of consultation to agreement written in; (4) the Twentieth Congress may go in, the wording amended. Kozlov agrees to all four and asks the Chinese wording of the Twentieth. Peng: they agree "before Lenin''s portrait"; each to report to his Central Committee. Kozlov can speak for the CPSU Central Committee but must report to the Presidium for approval. Both telephone their delegations; the committee and the Appeal subcommittee adjourn.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 411–413 (the same day, after the hour''s recess); [[w.deng-xiaoping-nianpu-1904]], III, 1601 (Nov. 29, 1960; at the drafting committee''s fourth meeting, in a break, the Soviet side offers: the Twentieth Congress kept, in the 1957 Declaration''s words or others agreed, the Twenty-first dropped; the unnamed charge of factions cut; the cult of personality perhaps left out; consultation to agreement perhaps written in; no secret internal resolution. The Chinese side agrees in the main; a meeting of Khrushchev and Liu Shaoqi to be fixed); [[w.peng-zhen-nianpu-1902]], IV, 81 (Nov. 29, 1960; Peng Zhen takes Kozlov to another room: if you want a break, say so openly and we will condemn you; on Kozlov''s denial, a gentlemen''s agreement: no internal resolution, nothing aimed at China ("national communism," "factional activity"), the principle of agreement by consultation written in, the Twentieth Congress in amended words; Kozlov: the Twentieth Congress in, in the 1957 words or others agreed, the Twenty-first may go, "factional activity" struck, the cult of the individual perhaps, consultation in, no internal resolution; Peng: agreed "before Lenin''s portrait," each to report; the committee and the thirteen not to meet till the two settle in writing, Khrushchev and Liu to meet; about an hour; the committee adjourns; back at the Embassy at 7 p.m.). Made public: 1999. See [[cal.1960-11-29.soviet-union]]. Names: Peng Zhen, Kozlov. Check: the account is Peng Zhen''s side''s, from the delegation.'
