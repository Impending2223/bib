    c: 'Zhou Enlai calls the vice-premiers, Nov. 15 and 16, on the 1961 national economy plan. On the 16th: the leap''s speed must be joined to proportional development or objective law will punish; eight matters: the ten relations (industry and farming, light and heavy industry, coast and interior, economic and defense building, state, collective and individual, center and locality, nationalities, right and wrong, enemy and us, international); clear ownership, the "communist wind" blowing in towns too; labor and its time; room left and gaps narrowed, doing more and saying less; one chessboard; regulation of the system; method of planning; sound siting.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 369 (Nov. 15, 1960). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1960-11-15.china-leadership-4
