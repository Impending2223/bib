    date: '1960-11-03'
    thread: elections-1960-kennedy
    c: 'Oklahoma City, the Municipal Auditorium. Kennedy with Rep. Jarman, Gov. Edmondson and Sen. Kerr: "I don''t believe all those stories that Oklahoma is going Republican"; Nixon in New York passed a theater showing "The King and I."'
    n: 'Speech of Senator John F. Kennedy, Municipal Auditorium, Oklahoma City, OK, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-municipal-auditorium-oklahoma-city-ok) (Nov. 3, 1960). [[w.communications-freedom-of-communications-part]], 883–87. Names: Kennedy, Edmondson, Kerr, Nixon, Jarman.'
