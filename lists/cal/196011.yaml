    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 410–411 ("on Nov. 29"); [[w.yang-shangkun-riji]], I, 632–633 (Nov. 29, 1960; from noon; Poland on the Twentieth Congress, the Cubans on factions, a small committee disputed; in the break the Soviets offer: the Twentieth in, the Twenty-first out, factions out, the cult to be weighed, consultation and unanimity in, no secret resolution; the thirteen-party small committee to wait; as Yao Zhen and Hu Sheng report it at the embassy at 5 p.m.); [[w.peng-zhen-nianpu-1902]], IV, 80–81 (Nov. 29, 1960; Peng Zhen, with Kang Sheng and Hu Qiaomu, at the fourth sitting; the Pole: keep the two Congresses; the Cuban: rewrite "group factionalism"; no result; Suslov proposes a small committee of thirteen; China''s request for one or two more parties refused, Peng: from Asia only the Chinese party, we refuse to take part; the air tense). Made public: 1999. See [[cal.1960-11-28.soviet-union]]. Names: Peng Zhen, Liu Shaoqi, Deng Xiaoping.'
