  - id: cal.1960-11-29.soviet-union
    when: Nov. 29
    date: '1960-11-29'
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: Moscow. The drafting committee. The Polish delegate proposes to drop the Twenty-first Congress from the statement and to keep the Twentieth's wording; Soviet followers one after another press the Chinese to accept it without giving reasons. Then a subcommittee for the Appeal is proposed; the Soviet delegate hands in a list; the Chinese ask one or two more parties on it; refused outright. Peng Zhen, leading the Chinese delegation (Liu never sat in the committee, Deng seldom), protests that only the Chinese Party sits for Asia and says China will not take part.
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 410–411 ("on Nov. 29"); [[w.yang-shangkun-riji]], I, 632–633 (Nov. 29, 1960; from noon; Poland on the Twentieth Congress, the Cubans on factions, a small committee disputed; in the break the Soviets offer: the Twentieth in, the Twenty-first out, factions out, the cult to be weighed, consultation and unanimity in, no secret resolution; the thirteen-party small committee to wait; as Yao Zhen and Hu Sheng report it at the embassy at 5 p.m.). Made public: 1999. See [[cal.1960-11-28.soviet-union]]. Names: Peng Zhen, Liu Shaoqi, Deng Xiaoping.'
    src:
      c: fcd698c7
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 410–411: all'
        - 'w.yang-shangkun-riji I, 632–633: A, B, C'
    tags: [polity:prc, name:peng-zhen, name:liu-shaoqi, name:deng-xiaoping, vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia]
  - id: cal.1960-11-29.soviet-union-2
    when: Nov. 29
    date: '1960-11-29'
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    follows:
      - cal.1960-11-29.soviet-union
    c: 'Moscow, a room beside the hall (the committee suspended an hour for coffee). Peng Zhen asks Kozlov out. Is it your design to break the conference? If so, say it openly and China will issue a statement. Kozlov, "No, no, we want it to go well." Peng proposes a gentleman''s agreement: (1) no internal resolution, neither anti-Chinese nor by majority; (2) neither national communism nor factional activity attacked in the statement; (3) the principle of consultation to agreement written in; (4) the Twentieth Congress may go in, the wording amended. Kozlov agrees to all four and asks the Chinese wording of the Twentieth. Peng: they agree "before Lenin''s portrait"; each to report to his Central Committee. Kozlov can speak for the CPSU Central Committee but must report to the Presidium for approval. Both telephone their delegations; the committee and the Appeal subcommittee adjourn.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 411–413 (the same day, after the hour''s recess); [[w.deng-xiaoping-nianpu-1904]], III, 1601 (Nov. 29, 1960; at the drafting committee''s fourth meeting, in a break, the Soviet side offers: the Twentieth Congress kept, in the 1957 Declaration''s words or others agreed, the Twenty-first dropped; the unnamed charge of factions cut; the cult of personality perhaps left out; consultation to agreement perhaps written in; no secret internal resolution. The Chinese side agrees in the main; a meeting of Khrushchev and Liu Shaoqi to be fixed). Made public: 1999. See [[cal.1960-11-29.soviet-union]]. Names: Peng Zhen, Kozlov. Check: the account is Peng Zhen''s side''s, from the delegation.'
    src:
      c: 9a361f33
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 411–413: all'
        - 'w.deng-xiaoping-nianpu-1904 III, 1601: ?'
    tags: [polity:prc, name:peng-zhen, name:kozlov-frol-r, vis:only:prc+ussr]
  - id: cal.1960-11-29.soviet-union-3
