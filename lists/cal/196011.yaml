  - id: cal.1960-11-28.china-leadership-6
    when: Nov. 28
    date: '1960-11-28'
    place: moscow
    thread: china-moscow-1960
    also: [soviet-union]
    follows:
      - cal.1960-11-28.china-leadership
      - cal.1960-11-28.china-leadership-5
    c: 'Moscow, the Chinese embassy, after dinner.{1} The Center''s answer to the request of the 25th comes, Peking having studied it two days; the delegation reads it page by page as it is decoded. That night it decides four things: (1) to prepare wordings on the Twentieth Congress, four, from tight to a copy of the 1957 Declaration''s; (2) to prepare the statements it will make in the three cases: no signature, signature with protest against an internal resolution, and keeping the Twentieth with an internal resolution; (3) in the first case, Liu Shaoqi to speak after signing, for unity, for the fight against imperialist aggression and war policy, for world peace; (4) to propose to the CPSU Sino-Soviet talks on the 29th, and till then to watch quietly in the drafting committee.{2}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 407, 409–410 ("soon after dinner" of the 28th); [[w.yang-shangkun-riji]], I, 631 (Nov. 28, 1960; the Center''s cable on signing that evening: give way on the Twentieth Congress if need be, never on factional groups or an internal resolution); [[w.peng-zhen-nianpu-1902]], IV, 80 (Nov. 28, 1960, evening; the Center''s answer to the delegation: do all that kindness and duty ask, consolidate the left, win the middle, expose the right; ground may be given on the Twentieth Congress, never on "group factionalism" or an internal resolution). Made public: 1999. See [[cal.1960-11-28.china-leadership-5]]. See [[cal.1960-11-28.china-leadership]]. Names: Liu Shaoqi.'
    src:
      c: c5d865df
      rows:
