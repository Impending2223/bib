  - id: cal.1960-11-24.soviet-union
    when: Nov. 24
    date: '1960-11-24'
    time: 1960-11-24T07:00Z
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow, morning.{1} Deng Xiaoping, for the Chinese delegation, speaks a second time, fifty minutes.{2} He restates China''s views on the era, war and peace, coexistence, peaceful transition and support of national liberation against the CPSU''s.{3} In particular: Khrushchev''s line is in substance to bow to imperialism and the world bourgeoisie, from not making revolution to opposing others'' revolution; and he answers Khrushchev''s attack on Mao, on "the east wind prevails over the west wind," "paper tigers" and "I am not imperialism''s chief of staff," as metaphysics, abuse without right or wrong. Hoxha having gone, he rebukes the French and Polish delegates for injustice to Albania. He declares China wholly opposes the Hungarian draft, will not join its discussion and will fight it to the end: the CPSU''s method is Bucharest''s, father party, majority over minority, great-power chauvinism. The Comintern was dissolved seventeen years ago and the Cominform is no more; when did the brother parties agree to an international body, or to majority rule? The hall is silent.{4} From 10 a.m., the whole Soviet Presidium listening.{5} Peng Zhen attends the thirteenth plenary.{6} Deng puts two questions: who keeps or breaks the Moscow Declaration, and whose stand serves unity.{7}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 395–396 ("the morning of Nov. 24", fifty minutes); [[w.yang-shangkun-riji]], I, 625 (Nov. 24, 1960; from 10 a.m., the whole Soviet Presidium listening); [[w.deng-xiaoping-nianpu-1904]], III, 1599–1600 (Nov. 24, 1960; morning; Deng''s second speech, at the thirteenth plenary: Khrushchev''s speech of the day before backs all the attacks; two questions, who keeps or breaks the Moscow Declaration, whose stand serves unity; the draft''s factions and "national communism" a legal basis for the campaign against China; nothing of equal consultation; the two congresses imposed; without these a paper all can agree); [[w.peng-zhen-nianpu-1902]], IV, 78 (Nov. 24, 1960, morning; Peng Zhen at the thirteenth plenary; Deng''s second speech, about forty minutes, on two questions: who kept to the Moscow Declaration, and whose stand guards unity; the whole Soviet Presidium present; in the break the Soviets rally speakers; after it Ghosh of India and the Burmese, Thai, Malayan, Nicaraguan, New Zealand, Irish and Canadian delegates ask to end the debate; Khrushchev: let all speak; twenty-five speakers, morning to afternoon); [[w.peng-zhen-nianpu-1902]], IV, 79 (Nov. 24, 1960; Lukman of Indonesia: majority against minority not right, it means an international center; "against group activity" means a center giving orders; the danger is not differences but improper ways of settling them; what is not agreed left out for later; the hall shaken; Liu Shaoqi and Deng Xiaoping absent in the afternoon); [[w.yang-shangkun-riji]], I, 625; [[w.peng-zhen-nianpu-1902]], IV, 78; [[w.deng-xiaoping-nianpu-1904]], III, 1599–1600. Made public: 1999. Check: the Peng Zhen chronology and the Yang Shangkun diary give about forty minutes ([[w.peng-zhen-nianpu-1902]], IV, 78; [[w.yang-shangkun-riji]], I, 625). See [[cal.1960-11-23.soviet-union]]. Names: Deng Xiaoping, Khrushchev, Mao Zedong, Peng Zhen. Check: the account is Wu''s summary of the speech.'
