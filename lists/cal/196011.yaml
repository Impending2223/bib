    c: 'Mao 毛泽东 to Zhou Enlai 周恩来, at five o''clock, on the United Front Work Department''s internal *Lingxun* 零讯 of Nov. 25: read pp. 4–6; sending capitalists down to the villages has made them very tense; better perhaps to send them to city enterprises; Zhou to decide; Tong Shaosheng''s 童少生 views worth weighing; the item on Henan''s 河南 non-Party figures worth a look. The pieces: Peking''s 北京 bourgeois alarmed at being settled in the villages; Tong, vice-governor of Sichuan 四川, on ways to send down the private-side staff; Henan non-Party figures welcome the Emergency Letter.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 425–426 (Nov. 29, 1960; Mao''s comment of Nov. 29, ''five o''clock'' (五时), a.m. or p.m. not said; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: United Front Work Department, *Lingxun* (internal), Nov. 25, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 425 n.1a); "Peking''s bourgeois elements generally tense and alarmed at being cut and sent down to settle in the villages", *Lingxun*, Nov. 25, 1960, pp. 4–5 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 425 n.1b); "Tong Shaosheng''s proposals on sending down the private-side staff", *Lingxun*, Nov. 25, 1960, p. 6 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 426 n.1c); "Some of Henan''s non-Party figures on the Center''s Emergency Directive Letter", *Lingxun*, Nov. 25, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 426 n.3). Names: Mao Zedong, Zhou Enlai, Tong Shaosheng.'
