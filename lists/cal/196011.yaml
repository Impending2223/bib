    when: Nov. 8
    date: '1960-11-08'
    thread: elections-1960-count
    c: 'Hyannis Port, Robert Kennedy''s house, the night, as the farm states go Republican. Kennedy to O''Donnell: "If that''s what they want, I ought to give it to them--I ought to keep Benson in as Secretary of Agriculture for another four years."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 252 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Benson, O''Donnell.'
