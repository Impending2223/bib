        - 'w.deng-xiaoping-nianpu-1904 III, 1601: ?'
        - 'w.peng-zhen-nianpu-1902 IV, 80: ?'
    tags: [polity:prc, vis:only:prc+ussr+albania+bulgaria+czechoslovakia+gdr+hungary+poland+romania+dprk+drv+mongolia]
