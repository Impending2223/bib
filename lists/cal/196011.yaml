  - id: cal.1960-11-29.china-leadership-12
    when: Nov. 29
    date: '1960-11-29'
    thread: china-famine
    c: 'Zhejiang 浙江. Chen Yun 陈云, hearing the heads of the Zhejiang committee 中共浙江省委: to squeeze people from the towns to the villages takes the firewood from under the pot, the first year with town rations, the second self-supporting; the mass movement joined with technical measures; along the Jiaozhou–Jinan railway 胶济路 in Shandong 山东, forty thousand wells with five-horsepower pumps would water ten million mu and give a billion jin more grain; a rubber-tired handcart is worth four or five laborers, a million wheels need only 2,400 tons of rubber, and 10,000 tons for handcarts would hardly hurt industry; boasting has cost dearly in politics: in Xinyang 信阳, Henan 河南, when someone wrote to the Center 中央 the prefectural committee forbade the truth and checked the writer''s hand, the public security serving to deceive those above and crush those below.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 57. Made public: 2005 ([[w.chen-yun-wenji]], where the nianpu says it is printed). To check: [[w.chen-yun-wenji]], III. Names: Chen Yun.'
    tags: [polity:prc, ok:fields-place, name:chen-yun, vis:only:prc]
