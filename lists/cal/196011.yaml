    c: 'Hyannis Port, just after three in the morning. Kennedy and his staff watch Nixon''s appearance on television. Salinger urges him to the Armory to match it; Kennedy: "Why should he concede? I wouldn''t." He will say nothing until Nixon speaks again, and goes to bed near four.'
