    c: 'Zhou Enlai, in a talk with Kofi Badu, of Ghana''s *Times*, and other writers on world affairs, rebuts slanders on China: China stands for peaceful coexistence, builds in earnest and does not need war, and its system does not permit pushing revolution by war;{1} revolution cannot be exported, each people choosing its own system; China opposes imperialist aggression and will strike back if attacked.{2}'
