    when: Nov. 3
    date: '1960-11-03'
    thread: vietnam-hanoi
    c: 'The Secretariat, Hanoi: directive no. 04-CT/TW on the grain question, after the failed winter-spring crop of 1959–60, the Politburo''s assessment and measures, passed on at a Secretariat conference, and the Council of Government''s resolution: political education of cadres, members and every class; policy in rice purchase, the tax and debt collection; the Party''s grain work carried out in full.'
