  - id: cal.1960-11-14.soviet-union-2
    when: Nov. 14
    date: '1960-11-14'
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    follows:
      - cal.1960-11-14.soviet-union
    c: 'Moscow, St. George''s Hall, afternoon, the hall full, the whole CPSU Presidium there.{1} Deng Xiaoping speaks for China, a dozen matters, much that of the Reply of Sept. 10.{2} The differences were first raised by the CPSU; it brought them into an international meeting and sprang the surprise attack on China at Bucharest; carried an ideological quarrel into relations of states, tore up every agreement and contract and withdrew every Soviet expert; and first made the differences known to the world. Khrushchev''s "division of labor" and "equal consultation" are false: he wants all to follow his baton and strikes at those who do not. On Poland in 1956 the Soviets prepared to move troops; China opposed it and helped bring the two parties to terms; on Hungary, China, with Liu at Moscow, urged the Soviets not to leave the Hungarian people, and they, after refusing, sent troops back the next day. Both times China helped the Soviets, and Khrushchev bears it a grudge: he says China lectured him, and gnashes at Zhou Enlai''s lessons in Moscow in January 1957. China cannot "check watches" with him. Khrushchev loves the enemy: he lauded Eisenhower around Camp David, and in September 1955 told Adenauer China''s numbers meant a "yellow peril." More could be said, not today. By Mao''s order before the delegation left, not all the shot is fired: the Korean War, the joint fleet, the long-wave station, Soviet air forces in China are held back.{3} Peng Zhen is at the plenary.{4} Kim Il of the Korean party speaks first, forty minutes. Deng reads from the text, a twenty-minute break after the third part; the Soviet Presidium''s faces darken. The session breaks up at 3:30 p.m.{5}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 381–384 ("the afternoon of the 14th"; "silent" hall); [[w.yang-shangkun-riji]], I, 600 (Nov. 14, 1960; after Kim Il, four hours from the text, a twenty-minute break after the third part; the hall still; the Soviet Presidium and Secretariat all there, their faces darkening; the session closed at 3:30 p.m.); [[w.deng-xiaoping-nianpu-1904]], III, 1596–1597 (Nov. 14, 1960; Deng''s first speech, at the fourth plenary, four hours, the hall silent: the world, war and peace, revolution, revisionism and dogmatism, the differences, unity and aid; the attacks on Mao''s views answered; comradely criticism not against unity; consultation to agreement the basic rule; no party to impose, play father, meddle or split; the differences from the Soviets'' breach of equality and consultation; their essence the 1957 Declaration; still partial); [[w.peng-zhen-nianpu-1902]], IV, 74 (Nov. 14, 1960; Peng Zhen at the fourth plenary; after the Korean party, Deng speaks four hours in five parts: the differences started by the CPSU, the surprise attack, ideology carried into state relations, the experts withdrawn, agreements torn up, the quarrel made public first; Khrushchev''s praise of Eisenhower, the "yellow peril" to Adenauer; "division of labor" and "equal consultation" untrue, "setting watches" his baton; the hall silent, tense); [[w.peng-zhen-nianpu-1902]], IV, 74; [[w.yang-shangkun-riji]], I, 600. Made public: 1999. Check: the session''s hour and Kim Il''s length: Yang (I, 600) has it open at 10 a.m., Kim Il forty minutes, Deng four hours, the day ending at 3:30 p.m.; Wu (381) has Deng speak in the afternoon after Kim Il''s whole morning; Peng Zhen nianpu (IV, 74) puts the plenary in the morning. See [[cal.1960-11-10.soviet-union]]. Names: Deng Xiaoping, Khrushchev, Zhou Enlai, Liu Shaoqi, Mao Zedong, Peng Zhen. Check: the account is Wu''s summary of the speech.'
