  - id: cal.1960-11-04.desegregation-schools-la
    when: Nov. 4
    date: '1960-11-04'
    thread: desegregation-schools
    c: 'Louisiana''s legislature meets in extraordinary session, called by Davis ten days before New Orleans''s schools are to desegregate. It enacts 25 measures, the first after the session''s appropriation an interposition act: Louisiana will not recognize *Brown* or the court''s orders.'
    n: '*Bush v. Orleans Parish School Board*, [188 F. Supp. 916](https://static.case.law/f-supp/188/case-pdfs/0916-01.pdf) (E.D. La. 1960), App. A–B. To check: [[w.inger-politics-and-reality-in]]; [[w.baker-second-battle-of-new]]; [[w.fairclough-race-and-democracy]]. See [[cal.1960-08-27.desegregation-schools-la]]. Names: Jimmie Davis.'
    tags: [name:davis-jimmie-h, state:la, city:new-orleans]
