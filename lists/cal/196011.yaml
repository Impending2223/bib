    c: 'Moscow.{1} The Chinese delegation, reading the Soviet letter as the storm coming, has it translated a page at a time and resolves to raise the tone of its speech and to answer the charge against Liu: Liu has said Mao made Marxism–Leninism Chinese, and the letter, without naming him, calls that nationalism. Four matters to stress: where the quarrel comes from; that it is Marxism against revisionism and opportunism; that the state of relations is the CPSU''s doing though China wants unity; that parties are equal, independent, to agree by consultation, not father and son. The tone that of the wronged, come for unity and attacked on the eve. The writers revise through the night, each a part, Hu Qiaomu going over the whole, to revise again after Khrushchev speaks.{2}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 374–375 (the letter read the same day; the revising "that night"); [[w.yang-shangkun-riji]], I, 590 (Nov. 7, 1960; at the embassy after the reception: the speech prepared to be revised, whether Liu or Deng speaks to be weighed; reported to the Center); [[w.deng-xiaoping-nianpu-1904]], III, 1593 (Nov. 7, 1960; the Chinese Embassy, after the reception; Liu''s speech to be revised, whether Liu or Deng should give it to be weighed; cabled to the Center); [[w.peng-zhen-nianpu-1902]], IV, 71 (Nov. 7, 1960, evening, at the Embassy; the answer attacks several of Mao''s theses; the delegation holds it must be answered openly at the meeting; whether Liu Shaoqi or Deng Xiaoping should answer, and the revision of the prepared speech, referred to the Center by cable). Made public: 1999. See [[cal.1960-11-07.soviet-union-2]]. Names: Liu Shaoqi, Mao Zedong, Hu Qiaomu.'
