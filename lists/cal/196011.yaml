  - id: cal.1960-11-25.soviet-union
    when: Nov. 25
    date: '1960-11-25'
    time: 1960-11-25T07:00Z
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow. The drafting committee of twenty-six parties resumes after the plenary.{1} The first day''s argument is as sharp as before. The CPSU yields nothing and will not change a word of the draft.{2} Peng Zhen leads Kang Sheng, Hu Qiaomu and Liu Ningyi for China, from 10 a.m.; 24 pages discussed.{3} "The Soviet Union at the head": the Chinese call it right; most agree to leave it out, and the Chinese do not insist.{4} All day on whether the Twentieth Congress goes into the paper; no agreement.{5}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 396–397 ("from the 25th"); [[w.yang-shangkun-riji]], I, 627 (Nov. 25, 1960; from 10 a.m., Peng Zhen, Kang Sheng, Hu Qiaomu and Liu Ningyi for China; 24 pages; "the Soviet Union at the head" left out by most once the Chinese statement called it right, not pressed by China; the Twentieth Congress now the crux); [[w.peng-zhen-nianpu-1902]], IV, 79 (Nov. 25, 1960, morning; Peng Zhen leads Kang Sheng, Hu Qiaomu and Liu Ningyi at the drafting committee''s first sitting; all day on whether the Twentieth Congress goes into the paper, no agreement); [[w.yang-shangkun-riji]], I, 627; [[w.peng-zhen-nianpu-1902]], IV, 79. Made public: 1999. See [[cal.1960-11-24.soviet-union-2]]. Names: Peng Zhen, Kang Sheng, Hu Qiaomu, Liu Ningyi.'
