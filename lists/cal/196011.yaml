  - id: cal.1960-11-28.china-leadership-2
    when: Nov. 28
    date: '1960-11-28'
    thread: china-twelve-articles
    also: [china-mao]
    c: 'Mao drafts the Center''s comment on Gansu''s fourth report on the Emergency Letter, in the third person: Mao read it twice;{1} he shares the fate of all who will correct errors;{2} he too erred: the Beidaihe resolution''s three or four years for the passage to ownership by the whole people unreal;{3} now seven years at least, twenty for pay by work; never again "levelling and transfers."{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 28, 1960. [[w.macfarquhar-origins-of-the-cultural]], III, 12 (the Gansu report and Mao''s note on his error of 1958); [[w.jianguo-yilai-mao-zedong]], XV, 415–418 (Nov. 28, 1960; the comment, dated by the Center Nov. 28, from Mao''s manuscript: Gansu''s report of Nov. 25 worth study once or twice by the prefectures and counties; Mao read it twice and would read it again; the error of the Beidaihe resolution''s passage, his own, timing the change of ownership in three or four years or five or six; at least seven years now, at least twenty for pay by work; the report silent on livelihood and on sorting counties, communes and teams in three classes; his note: to Zhou, Li Fuchun, Tan Zhenlin and Chen Boda, then by telegram, the original back to him); [[w.yang-jisheng-mubei]], II, 818 (the Center''s comment on the Gansu committee''s report of Nov. 25, which Mao wrote himself; quoted: Mao read the report twice and would read it again; he too erred; the Beidaihe resolution''s timing; seven years at least, twenty at least; never levelling and transfers); [[w.mao-zedong-zhuan]], V, ch. 66 n.64 (Nov. 28: Mao''s comment forwarding Gansu''s report of Nov. 25: his own error in the Beidaihe decision of 1958 on the passage to ownership by the whole people; "seven years at least"; manuscript in *Wenji* 8). [[w.yang-jisheng-mubei]], II, 731 (in forwarding the Gansu committee''s report on Nov. 28 Mao says he too has made mistakes and will correct them); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 729–741 (the comment as issued, Nov. 28, 1960, in full, with the Gansu 甘肃 committee''s report of Nov. 25; drafted by Mao for the Center, n.1; printed from the Center''s document). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 729–741). Printed for internal circulation: [[w.nongye-jitihua-zhongyao-wenjian]] (1981). To check: [[w.nongye-jitihua-zhongyao-wenjian]], xia, 407 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.11); Resolution on establishing people''s communes in the countryside, Beidaihe enlarged Politburo meeting, Aug. 1958, the passage on the time of the passage to ownership by the whole people (cited by [[w.jianguo-yilai-mao-zedong]], XV, 418 n.2); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Gansu Provincial Committee''s fourth report of Nov. 25, 1960 on carrying out the urgent letter, Nov. 28, 1960; in [[w.mao-zedong-wenji]], VIII, 222–223 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.64). Names: Mao Zedong.'
