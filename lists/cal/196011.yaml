  - id: cal.1960-11.china-leadership-20
    when: Nov., by the 25th
    date: 1960-11
    at: before 1960-11-25
    place: xuanwei
    thread: china-famine
    c: Xuanwei 宣威 county, Yunnan 雲南. Three more "regiments" of the planned rising, over 2,000 men in six communes, Baoshan 寶山 and Shuanghe 雙河 among them, and among the laborers of the Railway Corps 鐵道兵 5th Division's 24th Regiment, are rounded up on its eve. By Nov. 25 all its chief leaders are caught but Xu Rujun 徐汝俊, who is killed. Of the 39 rebel cadres of battalion rank and above, 54 percent are landlords, rich peasants, counterrevolutionaries and bad elements.
    n: '[[w.yang-jisheng-mubei]], I, 519, 520 (the investigation report on the Xuanwei counterrevolutionary riot, Nov. 30, 1960, as the book quotes it). Made public: 2008. To check: Investigation report on the Xuanwei counterrevolutionary riot 《關於宣威反革命暴亂案件的調查報告》, Nov. 30, 1960 (named by [[w.yang-jisheng-mubei]], I, 519; no note). Check: the report puts the rising itself on Dec. 24 (I, 519), after its own date.'
