    c: 'Mao to Zhou Enlai, on the report of ten thousand central cadres sent down: amid the "fine situation," a time to speak at length of the bad third of the country: bad men in power, beatings and deaths, grain down, hunger, the democratic revolution unfinished, feudal forces at work.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 15, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 398–400 (Nov. 15, 1960; Mao''s comment to Zhou Enlai, the morning of Nov. 15 (十五日晨), on the report of Nov. 10 of the Center''s five-man group: 10,176 cadres of the central organs to be sent down, 7.33 percent, for three years as a rule; those who go must have the will not to fear hardship, else they must not go; Zhou to decide; printed from the manuscript); [[w.macfarquhar-origins-of-the-cultural]], III, 403 (in November 1960 Mao lays the poor conditions of a third of the countryside to bad elements); [[w.yang-jisheng-mubei]], II, 834–835 (Nov. 10, the five-man group''s report on drawing ten thousand cadres from the central organs; Nov. 15, Mao''s comment on it, and his note on the same report to Zhou: for a time speak at length of the bad third of the country; bad men in power, beating and killing, grain down, hunger, the democratic revolution not complete, feudal forces); [[w.mao-zedong-zhuan]], V, ch. 66 n.62 (Nov. 15, Mao''s letter to Zhou Enlai on the ten thousand cadres, with the notes on the report: one third of the country bad, to be told; five months to turn it; the harvest of 1961). Made public: 2013. Check: Mao''s second comment on the report, under ''speak at length of the situation'' (XV, 398–399): the fine situation in two-thirds of the country, a bad one in a third; within five months the whole to be turned around, for a great harvest in 1961; it is not in `c`. Check: Li Jian''s account, as Yang Jisheng gives it, has Mao write the comment "in the investigation report" on Nov. 15 (I, 74); Yang''s own text puts it on the Nov. 10 report on sending down the central cadres (II, 834), which [[w.jianguo-yilai-mao-zedong]], XV, 398–400, also gives. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 66), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: Central Committee five-man group on cutting staff and placing labor, report of Nov. 10, 1960, "On the central organs'' drawing of ten thousand cadres to be sent down to the basic levels" (10,176 settled by Nov. 9, 7.33 percent of the central organs'' cadres) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 399 n.1); [[w.jin-1949-1989-niande-zhongguo]], 534–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 403 n.26); Mao Zedong 毛泽东, letter to Zhou Enlai 周恩来 and notes on the report on sending 10,000 cadres of the central organs down (manuscript 手稿), Nov. 15, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.62). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Xiao Hua.'
