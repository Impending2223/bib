    c: 'The Secretariat, Hanoi: circular no. 10-TT/TW on the Law on Marriage and the Family: wife-beating, concubinage, forced and child marriage fewer, but violations many, in the Catholic areas the ban on divorce and on marriage with non-Catholics; a deep campaign in the Party and among the people in January 1961, a central board for it, Xuân Thủy at its head, Nguyễn Thị Thập his deputy, Chân Phương its standing member.'
