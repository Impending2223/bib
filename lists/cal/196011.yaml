    c: 'Moscow, the Polish delegation''s quarters, evening. After the Sino-Soviet talks Liu Shaoqi calls on Gomułka, who led the Polish delegation when Liu led China''s at Moscow in 1956.{1} The conference has ended in agreement, the quarrel is over, he says; China and the USSR to strengthen unity, China and Poland likewise. Two criticisms: in 1956 China helped Poland''s accord with the CPSU, and at this conference the Polish delegation did nothing for Sino-Soviet unity, or nothing good, Gomułka''s own speech being ill-tempered and attacking the Chinese Party and even Mao; and it was unjust to Albania, which Poland, that was bullied, should have spoken for, but instead had its delegates call Hoxha rough names. Gomułka defends himself, then says all that is past, unity now; and that China''s support of Poland will never be forgotten.{2}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 426–428 ("that evening" of Nov. 30); [[w.yang-shangkun-riji]], I, 635 (Nov. 30, 1960; 8 to 10 p.m.; Yang and Li Jingquan with Liu; Gomułka, Cyrankiewicz, Ochab, Kliszko; some argument, the Poles attacking Albania). Made public: 1999. See [[cal.1960-11-30.soviet-union]]. Names: Liu Shaoqi, Gomułka, Mao Zedong. Check: the account is Liu''s side''s, as Wu gives it.'
    src:
      c: 9c9eff7f
      rows:
