  - id: cal.1960-11-08.elections-1960
    when: Nov. 8
    date: '1960-11-08'
    thread: elections-1960
    also: [electoral-college]
    c: Kennedy and Johnson over Nixon and Lodge, 34,227,096 to 34,108,546, 49.7 percent of the popular vote, a 118,550-vote margin, Alabama's Democratic slate counted with Kennedy. Closest States Hawaii, Illinois, Missouri, California, New Mexico, New Jersey; Mississippi to its unpledged electors. Republicans gain 21 House seats and 2 in the Senate; Johnson re-elected to the Senate from Texas the same day. Nixon concedes Nov. 9.
    n: 'Returns: [Clerk of the House, *Statistics of the Presidential and Congressional Election of 1960*](https://clerk.house.gov/member_info/electionInfo/1960election.pdf). Telegrams of Congratulations to the President- and Vice President-Elect, [1960–61 Pub. Papers 857](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=909); [Remarks in Hyannis, Massachusetts Accepting Election as the 35th President of the United States](https://www.presidency.ucsb.edu/documents/remarks-hyannis-massachusetts-accepting-election-the-35th-president-the-united-states) (Nov. 9), Nixon''s telegram quoted. The national figures: the Clerk''s State figures, added (Elections, 1960). [[w.kallina-kennedy-v-nixon]], 180–81, 192–93 (Nixon''s concession; Alabama''s vote). To check: [[w.white-making-of-the-president]]; [[w.rorabaugh-real-making-of-the]]; [[w.donaldson-first-modern-campaign]]; [[w.pietrusza-1960]]; [[w.matthews-kennedy-and-nixon]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.converse-stability-and-change-in]]; [[w.pool-candidates-issues-and-strategies]]; [[w.nixon-six-crises]]; [[w.gellman-president-and-the-apprentice]]; The Reminiscences of Robert Finch, June 19, 1967, Columbia University Oral History Collection; The Reminiscences of J. Clifford Folger, Jan. 25, 1968, Columbia University Oral History Collection (cited by [[w.kallina-kennedy-v-nixon]], 180 n.9); Congressional Quarterly Weekly Report, Feb. 17, 1961, 285–88 (cited by [[w.kallina-kennedy-v-nixon]], 193 n.38). Names: Kennedy, Johnson, Lodge, Nixon.'
