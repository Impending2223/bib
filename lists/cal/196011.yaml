  - id: cal.1960-11-09.soviet-union-2
    when: Nov. 9
    date: '1960-11-09'
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow, the Chinese delegation''s quarters, the afternoon before the conference. Suslov, Kozlov and Mikoyan call; Deng Xiaoping and Peng Zhen receive them. Khrushchev''s speech tomorrow, they say, will stress unity, friendly in tone, leave out the Sino-Soviet quarrel, keep to the draft statement and Soviet home matters; the CPSU does not want an argument at the conference, will look ahead, regards its letter as settled and unconnected with the meeting, and wants better relations with Albania. Mikoyan: after the conference the Soviets will take up trade, aid and experts with China; the oil stop, of which the Presidium did not know, will be lifted soon; experts can stay if China stops giving them papers against the CPSU''s Central Committee. Deng: China came for unity and for agreement on Marxist-Leninist ground; the letter of Nov. 5 poisoned the air and the CPSU began it, so China must answer at the conference. China will stay friendly with no Soviet aid and no experts, and build on its own strength.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 376–377 ("that afternoon", the day before the opening); [[w.yang-shangkun-riji]], I, 592 (Nov. 9, 1960; 5 p.m., at Liu Shaoqi''s lodging, the whole delegation present; Suslov, Kozlov, Mikoyan, Ponomarev and Andropov; Mikoyan: the 1,300 lorries and the oil refused by the departments, to be settled; experts can be sent again, 38 still in China; Liu, Deng and Peng: the letter of Nov. 5 has changed the case, an answer at the meeting seems unavoidable; three hours, by the diary''s count); [[w.deng-xiaoping-nianpu-1904]], III, 1595 (Nov. 9, 1960; afternoon, at Liu Shaoqi''s, the whole delegation; to Suslov and Kozlov, come to urge unity and no dispute at the meeting, Deng: the answer of Nov. 5, over a hundred pages in Russian, wrecks unity; the argument is yours; we must answer at the meeting); [[w.mao-zedong-zhuan]], V, ch. 66 n.52 (Nov. 9, Suslov and the others call on the Chinese delegation: Khrushchev''s speech to stress unity; the disagreements may be taken up later (Yang Shangkun''s diary, 583-586)). Made public: 1999. See [[cal.1960-11-07.soviet-union-2]]. Names: Suslov, Kozlov, Mikoyan, Deng Xiaoping, Peng Zhen. Check: the account is the Chinese delegation''s.'
