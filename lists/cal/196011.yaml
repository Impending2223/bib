    c: 'Eisenhower, after seeing Pawley, asks his advisers whether the Cuba program is "sufficiently imaginative and bold," and wants no emergency handed to his successor. Dulles: some 500 exiles in training in Guatemala; the new paramilitary concept. Eisenhower wants the project expedited.'
