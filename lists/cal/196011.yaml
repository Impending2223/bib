    c: Peking, then Moscow.{1} Liu Shaoqi leaves in the morning for Moscow by Tu-104, with Deng Xiaoping, Yang Shangkun, Hu Qiaomu, Lu Dingyi, Wu Lengxi and Qiao Guanhua.{2} At Moscow Khrushchev and Brezhnev, then Chairman of the Presidium of the Supreme Soviet, meet him.{3} Brezhnev's welcome is cool. Liu's reply is applauded four times, longest at the 860 million people of the two countries. To his hosts he says the delegation has come to make the conference a success and to strengthen Sino-Soviet unity, and, if it goes well, he will make a state visit. The delegation lodges in three villas on the Lenin Hills, Liu, Deng and Peng Zhen each in one; the staff go to the Chinese embassy.{4} Off at 10:15 a.m., seen off by Zhou Enlai, Zhu De, Lin Biao, Luo Ronghuan, Chen Yi, Li Fuchun, Liu Bocheng and Tan Zhenlin;{5} Kang Sheng in the party.{6} At the airport too Suslov, Gromyko and Andropov.{7}
