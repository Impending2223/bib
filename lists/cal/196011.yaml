    n: 'Clifford''s memorandum, Nov. 9 (JFK Library, Clifford Papers; Check). [[w.branch-parting-the-waters]], 379 (Dulles and Hoover kept, announced the morning after a family dinner of Nov. 9); [[w.clifford-counsel-to-the-president-2]], 326–27, 330–32 (the memorandum, thirty-one pages, sent to Hyannis Port Nov. 9; Kennedy''s call of Nov. 10: Clifford for the White House, Sorensen counsel, Dulles and Hoover kept, announced together); [[w.sorensen-kennedy]], 229–30; [[w.white-making-of-the-president]], 349 n.2 (Hoover and Dulles announced the next day); [[w.wofford-of-kennedys-and-kings]], 67 (Dulles to stay at the CIA and Hoover for his thirty-seventh year at the FBI, in "his first press statement as President-elect"; not the day or the other appointments); [[w.schlesinger-robert-kennedy-and-his]], 254 (Kennedy announced "immediately after the election" that he would keep Hoover on, along with Dulles of the CIA; not the day, the place or the other appointments); [[w.sorensen-counselor]], 198–99 (a day or two after the election, Kennedy begins the first staff meeting at Hyannis Port by saying he wants Sorensen for the post of principal adviser on domestic policy, and announces it that afternoon to the press: "He will begin work immediately to assist me in preparing for a new administration, having worked with me on policy matters during the past eight years"; Clifford''s and Neustadt''s reports; not the other posts or the day); [[w.salinger-with-kennedy]], 51 (Kennedy to Salinger, on the walk to the staff meeting at his father''s house the next morning: "I want you to stay on as my Press Secretary"; Hatcher his second; Clifford waiting at Ambassador Kennedy''s with copies of a thick handbook for the transition; not the other appointments). Check: which appointments Nov. 9, which Nov. 10; Schlesinger has Clifford''s memorandum delivered and Clifford named the day after the election, Hoover and Dulles kept in the next morning''s papers after a dinner of Nov. 9, and O''Donnell a Special Assistant. Neustadt''s memoranda of Sept. 15 and Oct. 30 on organizing the transition: [[w.preparing-to-be-president]]. [[w.schlesinger-thousand-days-1965]], 124–25, 127 (Clifford''s memorandum; Clifford named; Hoover and Dulles; Sorensen and Salinger). To check: [[w.brauer-presidential-transitions]]; [[w.parmet-jfk]]; [[w.grose-gentleman-spy]]; [[w.gage-g-man]]. Names: Kennedy, Salinger, Sorensen, O''Donnell, Dulles, Hoover, Clifford, Persons, Eisenhower. Check: Clifford, 330–32, has his assignment, Sorensen''s and the keeping of Dulles and Hoover settled in Kennedy''s call "just before noon" on Thursday, Nov. 10.'
