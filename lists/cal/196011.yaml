    c: 'Columbia, the steps of the State House. Byrnes introduces Nixon: "We must vote for the man and not for the label." The *State*''s count, 35,000, three times Kennedy''s crowd of October. Nixon: the Democratic platform forgets "individual rights and local and State responsibility"; in his statement on arrival, Kennedy''s retraining of textile workers would close the mills.'
