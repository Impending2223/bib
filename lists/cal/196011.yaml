    c: 'Moscow, the Chinese embassy. After the session the delegation weighs what Khrushchev will say on the 23rd. Two possibilities: he abuses China again and presses the Hungarian draft; or, seeing China firm, he lowers his tone and coaxes China into signing. Most think the second. It decides to lower the tone of Deng''s second speech, not to answer other parties'' anti-Chinese views, to take up the disputed matters of the statement draft and what Khrushchev said and the letter of Nov. 5 left unanswered, and on the Hungarian draft to be firm in matter, mild in voice, as the wronged. The writers, who had raised the tone, work it down again.'
