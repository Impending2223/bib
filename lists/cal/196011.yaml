    c: 'Moscow.{1} The same afternoon Deng Xiaoping and Peng Zhen for China, Suslov and Kozlov for the CPSU, each with a few aides, settle the wording on the Twentieth Congress and on the personality cult. On the Twentieth the Chinese fall back to their fourth wording, the 1957 Declaration''s; the Soviets accept. On the cult the wording is mostly the 1957 Declaration''s, with a phrase added: some brother parties have made gains against it. Suslov would drop the consultation-to-unanimity principle from the statement, agreement being reached; the Chinese hold out and it is written in plainly. Deng and Suslov also agree that *Renmin ribao* and *Pravda* each print the other''s editorial on the statement the day it is published.{2}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 418–419, 428 ("that afternoon"; the editorials, 428); [[w.yang-shangkun-riji]], I, 634 (Nov. 30, 1960; the wording of the disputed passages, at 3 p.m.; the closing session the next morning); [[w.peng-zhen-nianpu-1902]], IV, 82 (Nov. 30, 1960, 3 p.m.; Peng Zhen at the drafting committee, which settles the disputed paragraphs at last); [[w.friedman-shadow-cold-war]], 57 (with Mao''s authorization from Peking for a tactical retreat if certain demands are met, Peng Zhen and Kozlov find common ground at the last minute). Made public: 1999. To check: [[w.luthi-sino-soviet-split]], 182–91 (cited by [[w.friedman-shadow-cold-war]], 57 n.126). See [[cal.1960-11-30.soviet-union]]. Names: Deng Xiaoping, Peng Zhen, Suslov, Kozlov.'
    src:
