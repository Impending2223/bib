  - id: cal.1960-11-02.elections-1960-3
    when: Nov. 2–3
    date: '1960-11-02'
    thread: elections-1960-nixon
    c: 'New York, Nixon''s suite at the Waldorf, from eleven at night to after two, by Nixon''s account. On religion in the last days: Mitchell, William Miller of the Republican Congressional Campaign Committee and Flanigan of the Volunteers for Nixon-Lodge have urged a speech against "reverse bigotry"; Flemming has drafted one. All in the room for a speech; Nixon against, and the subject closed.'
    n: '[[w.nixon-six-crises]], 364–68. Names: Nixon, Mitchell, Miller, Flanigan, Flemming.'
    src:
