    thread: economy
    also: [europe-and-the-alliance, foreign-aid]
    c: 'Eisenhower with Anderson, Dillon, Stans and Persons, 9 a.m., on the mutual security budget for fiscal 1962. Eisenhower: Germany "living in the best of two worlds"; "one move we can make is to redeploy troops." Anderson: begin the process; $490 million of gold lost in November, "beginning to resemble a run on gold." Dillon: perhaps half the forces in Germany out within a few years, from 1962. Stans: redeployment to be taken up at the NATO meeting in December.'
