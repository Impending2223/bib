    c: 'Moscow, the Chinese embassy. The delegation, meeting in the afternoon, takes the Soviet agreement to cut "national communism" as a first step back: they cannot hold out, they fear the blame for a break, other parties press them. Both sides have played on the edge of a break; China to stay with Khrushchev and see who outlasts. Peking has not answered the request of the 25th; the delegation has cabled it the three days'' events.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 404–405 ("in the afternoon of the 28th"). Made public: 1999. See [[cal.1960-11-28.soviet-union]]. Names: Khrushchev.'
