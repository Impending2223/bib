  - id: cal.1960-11-15.economy
    when: Nov. 15
    date: '1960-11-15'
    thread: economy
    c: 'Augusta, Ga. Eisenhower with Anderson, Gates and others; Goodpaster reads the draft directive on the balance of payments, and it is revised. Gates: 500,000 dependents abroad; Anderson: a goal of 200,000, a cut of 60 percent. Gates fears the services'' fuss and Kennedy''s use of the issue; Eisenhower: morale will be all right with proper leadership. State''s embassies to be cut too. Anderson to ask Adenauer $650 million a year; the directive out Wednesday.'
    n: '[FRUS 1958–60, IV, doc. 58](https://history.state.gov/historicaldocuments/frus1958-60v04/d58) (John S. D. Eisenhower, memorandum of conference with the President; present Anderson, Gates, Lennartson, von Klemperer, Gen. George Brown, Hagerty, Goodpaster, John Eisenhower). Made public: FRUS 1958–60, IV (1992). [[w.watson-into-the-missile-age]], 749 (the meeting of Nov. 15: the directive drafted by Goodpaster approved; the reduction of the estimated 500,000 military dependents; Gates on retention and enlistment, 60 percent; Eisenhower on service and "not personal gain"; not Augusta, State, Adenauer or the date of release). To check: Memo of conf with Pres (J. S. D. Eisenhower), Nov. 15, 1960, Staff Notes Nov 60, Box 54, DDED ser, PP (AWF), DDEL (cited by [[w.watson-into-the-missile-age]], 749 n.89). See [[cal.1960-11-09.economy]]; [[cal.1960-11-13.economy]]. Names: Eisenhower, Anderson, Gates, Goodpaster, Kennedy, Adenauer.'
    tags: [name:eisenhower-dwight-d, name:anderson-robert-b, name:gates-thomas-s-jr, name:goodpaster-andrew-j, name:kennedy-john-f, name:adenauer-konrad, state:ga]
