    c: 'Phoenix, the airport, 3 a.m. Kennedy: "I hate to think of the Vice President waking up tomorrow morning, looking for those pictures of that rescue operation in New York, and seeing this picture instead at 3 in the morning in Arizona." Arizona is among the first of Nixon''s sure States. Of Goldwater: "If they can just get Barry out of that Confederate uniform."'
    n: 'Remarks of Senator John F. Kennedy, Airport, Phoenix, AZ, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-airport-phoenix-az) (Nov. 3, 1960). [[w.communications-freedom-of-communications-part]], 866. Names: Kennedy, Nixon, Goldwater.'
