    c: Moscow. The delegation, meeting on its second speech, decides to answer all the slanders and gross errors in the speeches, naming only Khrushchev; the rest are his views again. It will speak after Khrushchev's second speech, as Deng's first will have drawn one, as at Bucharest; Deng to speak again, Liu keeping his reserve, the deputy against Khrushchev, a way of slighting him.
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 388–389 (after the contacts of the 16th–18th, the day not given). Made public: 1999. See [[cal.1960-11-16.china-leadership-5]]. Names: Deng Xiaoping, Khrushchev, Liu Shaoqi. Check: the day; Wu gives none, only that it came before the 21st.'
