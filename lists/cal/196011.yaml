    also: [china-leadership]
    c: 'Moscow, the Kremlin, St. George''s Hall. The conference of 81 communist and workers'' parties opens in the afternoon (to Dec. 1).{1} Suslov reports for the drafting committee: he gives the Soviet side''s views and little of the others'', above all the Chinese;{2} revives points already agreed and since withdrawn; speaks of the four disputed "nails" as if they could pass as drafted; says there were differences without saying what.{3}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 377–378 ("in the afternoon" of the 10th; the closing plenary, 424); [[w.yang-shangkun-riji]], I, 593 (Nov. 10, 1960; from 3 p.m., St. George''s Hall, the whole Soviet Presidium; Khrushchev presiding: chairmen by turns in Russian alphabetical order from both ends, a secretariat of one from each of thirty parties, no time limit, two sittings a day; Suslov''s report an hour); [[w.deng-xiaoping-nianpu-1904]], III, 1596 (Nov. 10, 1960; 3 p.m.; the first plenary; Khrushchev speaks for the CPSU, explaining the draft section by section, calling for unity while aiming at China, against factions, against too much stress on national traits, for "checking watches"; the draft affirms the Twentieth and Twenty-first Congresses and, unnamed, charges China with factions and national communism; when the hall rises to applaud, the whole Chinese delegation and staff sit still in silent protest); [[w.peng-zhen-nianpu-1902]], IV, 73 (Nov. 10, 1960, afternoon; the Chinese delegation at the first plenary in St. George''s Hall, Khrushchev presiding and welcoming; a secretariat of one from each of thirty parties); [[w.guan-vietnamese-communists-relations-with]], 167 (Nov. 10–Dec. 1; by Penkovsky, nine-tenths of the time on the Soviet-Chinese differences). Made public: 1999. To check: [[w.penkovsky-penkovsky-papers]], 242 (so cited, Fontana, 1967) (cited by [[w.guan-vietnamese-communists-relations-with]], 167 n.58a); [[w.whiting-sino-soviet-split-in]], 518–519 (cited by [[w.guan-vietnamese-communists-relations-with]], 167 n.58b); [[w.floyd-mao-against-khrushchev]], 286–295 (cited by [[w.guan-vietnamese-communists-relations-with]], 168 n.59). See [[cal.1960-11.soviet-union]]. Names: Suslov. Check: the account is the Chinese delegation''s; the days to Dec. 1 from p. 424.'
