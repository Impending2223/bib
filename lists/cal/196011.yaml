    thread: elections-1960-kennedy
    c: San Jose, Calif. Kennedy speaks briefly.
    n: '[[w.communications-freedom-of-communications-part]], 860. The report prints no text: a note, "Senator Kennedy also spoke briefly at San Jose, Calif., but his remarks are unavailable." Names: Kennedy.'
    tags: [name:kennedy-john-f, state:ca]
  - id: cal.1960-11-02.elections-1960-kennedy-4
    when: Nov. 2
    date: '1960-11-02'
    thread: elections-1960-kennedy
    c: 'Oakland, Calif., Defremery Park. Kennedy with Gov. Brown, Cohelan and George P. Miller: Nixon is coming "on Saturday," after South Carolina on Thursday; 90 percent of Republicans against the 25-cent minimum wage in the thirties, 90 percent against $1.25 in 1960.'
    n: 'Remarks of Senator John F. Kennedy, Defremery Park, Oakland, CA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-defremery-park-oakland-ca) (Nov. 2, 1960). [[w.communications-freedom-of-communications-part]], 860–62. Names: Kennedy, Nixon, Brown, Cohelan, Miller.'
