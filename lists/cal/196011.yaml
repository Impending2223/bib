    also: [soviet-union]
    c: 'Moscow, the Chinese embassy. The delegation meets the nights of Nov. 14 and 15 on the first round. Its reading: the CPSU holds to pressing China by a majority, as at Bucharest; many delegates abuse China without reason, some from parties China helped; the middle parties dislike it and fear a break; the left pleased by Deng''s naming, afraid of the consequence. It resolves (1) to tell the drafting committee, through each delegation''s liaison man, that China will sign no statement that, unnamed, charges the Chinese Party: the "nails" must come out; (2) to be ready for a break and to fight on that footing; Liu: with the back to the river, a fight to the end. It cables Peking late on the 15th for leave.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 385–387 ("the night of the 14th" and "the night of the 15th"; the cable "on the night of the 15th"); [[w.yang-shangkun-riji]], I, 603–604 (Nov. 15, 1960; the delegation agrees not to sign unless the points it held in the drafting committee are struck, and to issue a statement; the cable to the Center drafted; Deng and Peng Zhen see the New Zealanders); [[w.deng-xiaoping-nianpu-1904]], III, 1597 (Nov. 15, 1960; that evening the delegation cables the Center on the meeting and asks the line on signing the draft; on the 17th the Center agrees: say in good time it will never be signed without changes of principle; the delegation tells several parties). Made public: 1999. See [[cal.1960-11-14.soviet-union-2]]. Names: Liu Shaoqi.'
