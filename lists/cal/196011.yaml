    c: 'Hyannis Armory, after Klein''s reading of Nixon''s concession. Kennedy, his wife at his side before the television lights, commits all his energies to "the long-range interests of the United States and the cause of freedom around the world . . . So now my wife and I prepare for a new administration and a new baby." To Merriman Smith of UPI: "If you''re here, Smitty, I guess I''ve really been elected." By Salinger''s account.'
