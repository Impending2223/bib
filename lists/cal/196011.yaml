    c: 'Waterbury, Conn., three in the morning. Two hours up the Naugatuck valley from the airport, fire engines and flares at the crossroads; some 30,000 on the green before the Roger Smith Hotel. Kennedy from its balcony: "My name is Kennedy and I have come to ask for your support"; Ribicoff the first public official to back him; Lincoln''s letter, "if He has a place and a part for me, I believe that we are ready."'
