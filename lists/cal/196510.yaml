    c: 'Johnson''s gall bladder removed at Bethesda Naval Hospital, with a stone from the ureter (Check).{1} Oct. 5 he had announced the operation and made public his understanding with Humphrey, on the terms Eisenhower and Kennedy had made with their Vice Presidents: in an inability Humphrey to serve as Acting President, Johnson to decide when it ended.{2} Oct. 20, at the hospital, he shows reporters the scar.{3} Back at the White House Oct. 21.{4}'
    n: 'Statement by the President Announcing That He Would Undergo Surgery, [1965 Pub. Papers 1043](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=517); Statement of Procedures for Use in the Event of Presidential Inability, [1965 Pub. Papers 1044](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=518) (Oct. 5, 1965). Remarks to Fellow Patients in the Naval Hospital, Bethesda, Maryland, [1965 Pub. Papers 1069](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=543) (Oct. 21, 1965). [[w.dallek-flawed-giant]], 522 (the operation, the scar); [[w.johnson-white-house-diary]], 324 (Oct. 5, 5:30: Moyers "would announce briefly" at 6 that Johnson had had a gall bladder attack on Labor Day night and would enter Bethesda Thursday night, operated on Friday morning; not the Humphrey understanding). [[w.solberg-hubert-humphrey]], 283 (Johnson to Humphrey of the operation; the officer with the code at Humphrey''s side; foreign visitors received for Johnson). To check: [[w.gilbert-mortal-presidency]]. See [[cal.1964-09-28.succession]]; [[cal.1965-07-06.succession]]. Names: Johnson, Humphrey, Eisenhower, Kennedy. Check: Dallek gives a kidney stone (522).'
