    c: 'Rolling Thunder by late October: of the 240 targets on the Joint Chiefs'' list for the North, 126 struck; of the 114 left, 75 in the sanctuaries. Over 740 bridges attacked, at least 145 destroyed or impassable; 6,752 sorties against fixed targets, 11,149 on armed reconnaissance.'
    n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 379–80. Of the fixed-target sorties over a third on barracks, about a sixth on ammunition depots; four airfields, two naval bases, thirteen radar sites, four SAM sites struck; armed reconnaissance destroyed 328 vessels, 423 vehicles, 181 railway cars and engines (Cosmas, 380). To check: CM-940-65 to the Secretary of Defense, Oct. 30, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 380 n.66). See [[cal.1965-03-02.vietnam]].'
