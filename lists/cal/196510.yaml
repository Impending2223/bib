    also: [china]
    c: 'Mao, Yinian Tang: with the bureau first secretaries again, on war preparation. Talk of war every day and the enemy does not come? that would make us King You lighting the beacons; but he did call it;{1} better a big and small third front. About three and a half years'' time, Yu Qiuli says five; a small steel works in each province.{2} If the Center turns revisionist, rebel: small third fronts make that easier.{3} Prepare for U.S. and revisionist attacks, and for revisionism and fascism inside, landlord restoration.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 10, 1965. [[w.macfarquhar-origins-of-the-cultural]], III, 445 (Mao to the regional leaders: if revisionism appears in the Center, rebel); [[w.mao-zedong-zhuan]], VI, ch. 74 (Oct. 10, at the Yinian Tang, Mao to the bureaus'' first secretaries: "if the Center produces revisionism, rebel" (n.11)). [[w.yang-jisheng-tiandi-fanfu]], II, 1067 (Mao: if revisionism appears in the Center, rebel; if a Khrushchev appears, the small third line is good for rebelling); [[w.peng-zhen-nianpu-1902]], IV, 443 (Oct. 10, 1965; Peng Zhen at Mao''s meeting with the regional bureaus'' first secretaries; Mao: the small third front very important; if revisionism appears at the Center, rebel; if a Khrushchev appears, the small third front makes rebellion easier); [[w.teiwes-tragedy-of-lin-biao]], 208–209 (Mao to regional leaders at the work conference of Sept. 18–Oct. 12: if revisionism appears in the Center, rebel; no blind faith in the Center; its orders not to be carried out if not on the correct line); [[w.teiwes-tragedy-of-lin-biao]], 29 (Mao''s warning in October of revisionism in the Central Committee, which some Chinese scholars think moved Lin to act). Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]). To check: [[w.history-of-the-chinese]], 318 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 445 n.94a); [[w.jin-1949-1989-niande-zhongguo]], 611–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 445 n.94b); [[w.nianyi-da-dongluande-niandai]], 113 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 445 n.94c); Michael Schoenhals, communication to the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 445 n.94d); Mao Zedong 毛泽东, talk with the first secretaries of the regional bureaus 大区第一书记, Oct. 10, 1965 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.11); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 260 (cited by [[w.teiwes-tragedy-of-lin-biao]], 209 n.103); [[w.qibin-zh