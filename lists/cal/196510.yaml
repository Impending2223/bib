    c: 'The hunter-killer experiment: Powers, in a specially equipped A-4E from the *Oriskany*, leads two flights of F-105s from Takhli to SAM sites near the Kep highway bridge, which Navy jets destroy. Three sites struck; some thirteen SAMs fired; radar and control vans believed destroyed in two or three. Powers downed and missing. Not repeated, for want of the A-4Es.'
