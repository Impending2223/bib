  - id: cal.1965-10-01.india-and-china
    when: Oct. 1
    date: '1965-10-01'
    place: jakarta
    thread: indonesia
    c: 'Djakarta. The "September 30th Movement," under Lt. Col. Untung of the palace guard, kills six generals before dawn, Yani, the army commander, among them; Nasution escapes. Suharto, commanding the army''s strategic reserve, retakes the capital by evening. The army blames the Communist party (PKI). Oct. 5, Ambassador Green: no overt involvement, but let Nasution and Suharto know "covertly" of a "desire to be of assistance." By Oct. 20 the embassy reports some thousand PKI cadres arrested in the Djakarta area, several hundred executed.'
    n: 'FRUS 1964–68, XXVI, docs. [142](https://history.state.gov/historicaldocuments/frus1964-68v26/d142), [147](https://history.state.gov/historicaldocuments/frus1964-68v26/d147), [158](https://history.state.gov/historicaldocuments/frus1964-68v26/d158). [[w.yang-shangkun-riji]], II, 675 (Oct. 1, 1965; the diary, Oct. 1: a coup in Indonesia "yesterday", the details not yet clear; Oct. 3, still unclear); [[w.friedman-shadow-cold-war]], 144 (the night of Sept. 30–Oct. 1, 1965: the outcome an anticommunist military government under Suharto, the PKI destroyed, Sukarno''s resignation and the break with the PRC). To check: [[w.jones-conflict-and-confrontation-in]]; [[w.simpson-economists-with-guns]]; [[w.robinson-killing-season]]. Names: Untung, Suharto, Nasution, Green.'
    tags: [name:suharto, name:nasution-abdul-haris, name:green-marshall, name:untung]
    short: the September 30th Movement, Suharto's army
    time_range:
      - 1965-09-30T17:00Z
      - 1965-09-30T23:00Z
    time_band: predawn
    time_zone: Asia/Jakarta
  - id: cal.1965-10-01.states-and-cities-jacksonville
