    n: 'FRUS 1964–68, XXIV, doc. [121](https://history.state.gov/historicaldocuments/frus1964-68v24/d121) (editorial note). To check: [[w.miller-history-of-modern-morocco]]. Names: Ben Barka.'
    tags: [name:ben-barka-mehdi]
