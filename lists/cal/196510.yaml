    c: Mao presides over the second plenary session of the Central Work Conference;{1} Yu Qiuli, Li Xiannian, Peng Zhen, Zhu De, Zhou Enlai speak on the Third Plan, grain and trade, the Party, studying Mao's thought, the world situation;{2} Mao interjects often. He backs provincial steel works of about 50,000 tons;{3} no more rail; the Yidu mine to be opened;{4} a Center gone revisionist, local officials not to follow, else "rebel";{5} the Party's fine young members; "we old men hold the helm, and you may be at ease."{6}
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 12, 1965. [[w.yang-shangkun-riji]], II, 678 (Oct. 12, 1965; the closing plenary, 10 a.m. to 2 p.m., Mao in the chair; speakers Yu Qiuli, Li Xiannian, Peng Zhen, Zhu De, Zhou; the conference formally ended; the words: 上午10时到下午2时，工作会议开大会，主席主持); [[w.deng-xiaoping-nianpu-1904]], III, 1877 (Oct. 12, 1965; morning, 上午; Deng at the plenary of the Central Work Conference Mao presides over, at which Yu Qiuli, Li Xiannian, Peng Zhen, Zhu De and Zhou Enlai speak on the Third Plan, grain and trade, Party questions, the study of Mao Zedong Thought and the international situation; the conference ends the same day); [[w.mao-zedong-zhuan]], VI, ch. 74 (Oct. 12, at the Henan Hall of the Great Hall, Mao presides in Liu''s absence at Sihanouk''s reception; Yu Qiuli, Li Xiannian, Peng Zhen, Zhu De and Zhou speak on planning, finance and trade, the Party, Mao Zedong Thought, the world; Mao interjects: provincial steel works of some 50,000 tons; a Center gone revisionist, rebel (n.12, n.13)). [[w.peng-zhen-nianpu-1902]], IV, 443–444 (Oct. 12, 1965, morning; Peng Zhen on Party building: Mao long faulted the Party for not running itself, run since the four clean-ups; under the dictatorship of the proletariat the Party must be run; whether revisionism comes depends on the Party; promote new forces; the grass-roots organization taken up some years late, a Party group in every team; Yu Qiuli on the Third Plan, Li Xiannian on grain, finance and trade, Zhu De on studying Mao Zedong Thought, Zhou Enlai on the world; the conference ends that day); [[w.jian-zhou-enlai]], 528 (two weeks after the coup Zhou and the leadership confirm that the right has taken control of Indonesia, "although massacres of ICP members and supporters had not begun"; the note cites Zhou''s speech at the work conference of Oct. 12); [[w.zhu-de-nianpu-xinbian]], III, 1939 (Oct. 12, 1965; Zhu De 朱德 speaks at the conference on building the Party''s theory and training successors: study Marxism-Leninism, reading Marx, Engels, Lenin and Stalin as well as Chairman Mao; keep learning into old age; train the successors well, the Communist Youth League 共青团 and the Young Pioneers 少先队 above all, with socialist education). Made public: 2013. Check: Made public: the day stands, by the 2017 edition''s front matter, in the diary''s first edition ([[w.shangkun-yang-shangkun-riji-2]], 2001), not seen; reprinted [[w.yang-shangkun-riji]], II, 678; earlier than the year the note gives. To check: Mao Zedong 毛泽东, interjections at the Central Work Conference 中央工作会议, Oct. 12, 1965 (record 插话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.12); Wang Renzhong 王任重, record of Mao''s interjections at the Central Work Conference 中央工作会议, Oct. 12, 1965 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.13); Zhou speech at a central work conference, October 12, 1965, 855-8-3112-2, Hebei Provincial Archive (cited by [[w.jian-zhou-enlai]], 528 n.39). Names: Mao Zedong, Li Xiannian, Peng Zhen, Zhu De, Zhou Enlai, Yu Qiuli.'
