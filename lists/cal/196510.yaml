  - id: cal.1965-10-12.china-leadership-4
    when: Oct. 12
    date: '1965-10-12'
    place: harbin
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi hears the Heilongjiang provincial committee report at Harbin. On sideline production: it is to be got going, for if not it hurts farm production a great deal; the province has half a year of slack farm time, can produce more and earn more, though basic farmland construction too must go on. On the high cost of farm production: besides setting right the relations of state, collective and individual, the thing is to rouse the masses; in Hebei a tractor station charged 1.70 yuan an mu, and after the "four clean-ups" three levels of management became two, cadres took part in labor, thrift in production was encouraged, the masses'' zeal was roused and the charge fell by half. On forestry and the masses'' sideline work: where contradictions arise, look after the masses'' interest so far as it does not hurt the state''s, so that the masses in turn look after the state''s; the two-benefit policy, good for masses, the collective and the state, is to be followed; where there are masses, rely on them to guard, plant and nurture the forest, but the question of relations is to be settled, the forest ownership; scattered small-patch secondary forests can be given to the commune or production team, large ones not, but the masses'' needs are to be met.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 626–627 (Oct. 12, 1965). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
