    c: 'Water Quality Act signed in the East Room, [79 Stat. 903](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg903.pdf): a Federal Water Pollution Control Administration in HEW;{1} the States to adopt quality criteria for interstate waters by June 30, 1967, or the Secretary sets standards; sewage-plant grants from $100 million a year to $150 million for 1966 and 1967.{2} Johnson: the Potomac open for swimming by 1975.{3} The Senate passed it Jan. 28, [68–8](https://voteview.com/rollcall/RS0890005);{4} the House Apr. 28, [396–0](https://voteview.com/rollcall/RH0890041);{5} the conference report through the House Sept. 21, [381–0](https://voteview.com/rollcall/RH0890161).{6}'
    n: 'Remarks at the Signing of the Water Quality Act of 1965, [1965 Pub. Papers 1034](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=508) (Oct. 2, 1965). [[w.sundquist-politics-and-policy]], 364–65 (the act''s standards and grants; Johnson''s words); [[w.bernstein-guns-or-butter]], 284 (Washington''s Potomac "clean and sweet and pure"; the conference nearly five months). Check: Bernstein, 284, gives the House''s vote on the conference report as 379 to 0. To check: [[w.milazzo-unlikely-environmentalists]]. See [[cal.1964-09-03.conservation]]. Names: Johnson.'
