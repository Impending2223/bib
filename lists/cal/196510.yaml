  - id: cal.1965-10-13.soviet-union-leadership
    when: Oct. 13
    date: '1965-10-13'
    place: moscow
    thread: soviet-union-leadership
    also: [vietnam]
    c: 'Moscow. The first talk with Phạm Văn Đồng''s party-government delegation of the DRV (in Moscow Oct. 12–18; talks Oct. 13–15 and 18): for the Soviet side Brezhnev, Mazurov, Andropov, Kuznetsov, Zakharov, Skachkov and the ambassador Shcherbakov. Brezhnev opens on the Chinese position. The DRV asks air defense strengthened, lost arms made good, instructors, arms for the South, aluminum, machine tools, 2,000 trucks, small power plants, a long-term credit of 150 million rubles. Phạm Văn Đồng: the Americans mean to stay in the South; contacts not refused; the Chinese for talks in principle, the conditions not ripe; no unity of action while the CPSU and the Chinese party differ.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 99–104 (№ 18, Brezhnev''s notes, "Переговоры с Фам Ван Донгом" (talks with Phạm Văn Đồng), Oct. 13), 127 nn.92–100 (the editors: the delegation Oct. 12–18, talks Oct. 13–15 and 18 by the Presidium''s decision of Sept. 28; the talks with Lê Thanh Nghị in July; U Thant''s letter; Nasser''s five conditions of Sept. 9). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 77–78 (the secretaries'' record, Oct. 13–18: Brezhnev negotiates with a North Vietnamese delegation in the Kremlin: Oct. 13, 3 to 8:40 p.m.; Oct. 14, 10 to 1 and 5 to 8; Oct. 15, 10 to 1; after his trip to Prague, Oct. 18, 10 to 12:30). Made public: 2016. To check: the Soviet and Vietnamese records of the talks; the identity of the DRV chief of staff named in the notes. Names: Phạm Văn Đồng, Brezhnev, Mazurov, Andropov, Skachkov, Shcherbakov.'
