# Cal. LXXI October 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXI
entries:
  - id: cal.1965-10-01.india-and-china
    when: Oct. 1
    date: '1965-10-01'
    thread: indonesia
    c: 'Djakarta. The "September 30th Movement," under Lt. Col. Untung of the palace guard, kills six generals before dawn, Yani, the army commander, among them; Nasution escapes. Suharto, commanding the army''s strategic reserve, retakes the capital by evening. The army blames the Communist party (PKI). Oct. 5, Ambassador Green: no overt involvement, but let Nasution and Suharto know "covertly" of a "desire to be of assistance." By Oct. 20 the embassy reports some thousand PKI cadres arrested in the Djakarta area, several hundred executed.'
    n: 'FRUS 1964–68, XXVI, docs. [142](https://history.state.gov/historicaldocuments/frus1964-68v26/d142), [147](https://history.state.gov/historicaldocuments/frus1964-68v26/d147), [158](https://history.state.gov/historicaldocuments/frus1964-68v26/d158). To check: [[w.jones-conflict-and-confrontation-in]]; [[w.simpson-economists-with-guns]]; [[w.robinson-killing-season]]. Names: Untung, Suharto, Nasution, Green.'
    tags: [name:suharto, name:nasution-abdul-haris, name:green-marshall, name:untung]
  - id: cal.1965-10-01.states-and-cities-jacksonville
    when: Oct. 1
    date: '1965-10-01'
    thread: states-and-cities
    c: Jacksonville. The Local Government Study Commission of Duval County, created by the 1965 legislature, established, to propose a government for the city and county by May 1, 1967. The county's fifteen public high schools had lost their accreditation in 1964.
    n: '[Wikipedia, "Jacksonville Consolidation"](https://en.wikipedia.org/wiki/Jacksonville_Consolidation). Check: the act, Laws of Fla. 1965. To check: [[w.bartley-keeping-the-faith]].'
    tags: [state:fl, city:jacksonville]
  - id: cal.1965-10-01.desegregation-schools-chicago
    when: Oct. 1–6
    date: '1965-10-01'
    thread: desegregation-schools
    also: [school-aid, civil-rights-the-executive]
    c: Chicago. Keppel, after the Office of Education's inquiry into the Coordinating Council's complaint against the schools under Title VI, defers some $30 million of Chicago's first grants under the Elementary and Secondary Education Act, Oct. 1. Released within the week, the Board of Education having agreed with HEW on corrective action. Civil rights leaders credit Daley's call to Johnson. Dirksen asks an inquiry.
    n: '*Harvard Crimson*, [Oct. 8, 1965](https://www.thecrimson.com/article/1965/10/8/keppels-release-of-chicago-funds-stirs/) (Check the day of the release). Dirksen''s papers: Keppel to Ray Page, Illinois Superintendent of Public Instruction, Sept. 20, 1965; Page to Keppel, Oct. 2 ([Dirksen Congressional Center](https://omekas-congress.lib.wvu.edu/catalog/EMD_Working_Papers-f358-1965_10_02)). [[w.garrow-bearing-the-cross]], 448. To check: [[w.anderson-confronting-the-color-line]]; [[w.cohen-american-pharaoh]]; [[w.danns-something-better-for-our]]. See [[cal.1963-10-22.desegregation-schools-chicago]]; [[cal.1965-04-11.school-aid]]. Names: Keppel, Daley, Johnson, Dirksen.'
    tags: [state:il, city:chicago, name:keppel-francis, name:daley-richard-j, name:johnson-lyndon-b, name:dirksen-everett]
  - id: cal.1965-10-02.conservation
    when: Oct. 2
    date: '1965-10-02'
    thread: conservation
    c: 'Water Quality Act signed in the East Room, [79 Stat. 903](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg903.pdf): a Federal Water Pollution Control Administration in HEW; the States to adopt quality criteria for interstate waters by June 30, 1967, or the Secretary sets standards; sewage-plant grants from $100 million a year to $150 million for 1966 and 1967. Johnson: the Potomac open for swimming by 1975. The Senate passed it Jan. 28, [68–8](https://voteview.com/rollcall/RS0890005); the House Apr. 28, [396–0](https://voteview.com/rollcall/RH0890041); the conference report through the House Sept. 21, [381–0](https://voteview.com/rollcall/RH0890161).'
    n: 'Remarks at the Signing of the Water Quality Act of 1965, [1965 Pub. Papers 1034](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=508) (Oct. 2, 1965). To check: [[w.milazzo-unlikely-environmentalists]]. See [[cal.1964-09-03.conservation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-02.specials
    when: Oct. 2
    date: '1965-10-02'
    thread: specials
    c: Louisiana 7th, special. Edwards (D), a State senator, holds T. Ashton Thompson's seat, unopposed; Thompson killed in a car crash July 1.
    n: 'Votes: CQ Guide 6th (2010) 1276 (unopposed). Wikipedia gives Edwards 53.8, Gary Tyler (D) 46.2, perhaps the Democratic primary: check. Check: La. Secretary of State, *General Election Returns*. See [[cal.1961-04-04.states-and-cities]]. Names: Edwards, Thompson.'
    tags: [special:1965-10-02-h-LA-7, name:edwards-edwin-w, name:thompson-theo-a]
  - id: cal.1965-10-02.alabama-al
    when: Oct. 2
    date: '1965-10-02'
    thread: alabama
    also: [legislatures, court, voting-rights]
    c: '*Sims v. Baggett*. The three-judge court on the legislature''s plans of Sept. 24: the Senate act upheld; the House act void under the Fourteenth and Fifteenth Amendments, its combinations of counties drawn against the Negro voter; *Gomillion* cited. The United States a party.'
    n: '*Sims v. Baggett*, [247 F. Supp. 96](https://static.case.law/f-supp/247/case-pdfs/0096-01.pdf) (M.D. Ala. 1965) (Act No. 47, Act No. 48, Second Special Session, 1965). To check: [[w.cortner-apportionment-cases]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]; [[cal.1960-11-14.court]].'
    tags: [state:al]
  - id: cal.1965-10-02.mississippi
    when: Oct. 2–3
    date: '1965-10-02'
    thread: mississippi
    c: Natchez. More than 300 march against a State court's injunction, 150 more the next day; all arrested for parading without a permit, those over twelve sent to Parchman, some 200 miles away, the men held naked through two cold nights.
    n: '[[w.dittmer-local-people]], 358. See [[cal.1965-08-27.mississippi]].'
    tags: [state:ms]
  - id: cal.1965-10-03.immigration
    when: Oct. 3
    date: '1965-10-03'
    thread: immigration
    c: 'Immigration and Nationality Act Amendments signed on Liberty Island, N.Y., [79 Stat. 911](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg911.pdf). The national-origins quotas end June 30, 1968: then 170,000 a year from the Eastern Hemisphere, no country over 20,000, by preference for kin of citizens and residents and for skills; 120,000 from the Western Hemisphere. Johnson: "not a revolutionary bill"; it corrects "a cruel and enduring wrong."'
    n: 'Statute (K–J Cong. II.J.2). Remarks at the Signing of the Immigration Bill, Liberty Island, New York, [1965 Pub. Papers 1037](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=511) (Oct. 3, 1965). See [[cal.1965-01-13.immigration]]; [[cal.1965-09-22.immigration]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, bill:immigration-1965]
  - id: cal.1965-10-03.cuba
    when: Oct. 3
    date: '1965-10-03'
    thread: cuba
    also: [immigration]
    c: 'Castro, Sept. 28: Cubans who wish may go to the United States; exiles may fetch their relatives by boat at Camarioca after Oct. 10. Johnson at Liberty Island, N.Y.: "those who seek refuge here in America will find it"; an "orderly entry" to be arranged, Cuba''s agreement sought through the Swiss, $12.6 million asked of Congress. Small boats arrive from Oct. 7, over 700 people by Oct. 18. Oct. 13, Cuba answers the American note: ready to begin.'
    n: 'Remarks at the Signing of the Immigration Bill, Liberty Island, New York, [1965 Pub. Papers 1037](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=511) (Oct. 3, 1965). [FRUS 1964–68, XXXII, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v32/d308). To check: [[w.garcia-havana-usa]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.leogrande-back-channel-to-cuba]]. See [[cal.1964-02-02.cuba]]. Names: Castro, Johnson.'
    tags: [name:castro-fidel, name:johnson-lyndon-b]
  - id: cal.1965-10-04.vietnam
    when: Oct. 4
    date: '1965-10-04'
    thread: vietnam
    c: 'Paul VI in New York for the day, the first Pope in the United States. He and Johnson meet at the Waldorf Towers, some 46 minutes. At the United Nations: "never again war, never again war!" Mass at Yankee Stadium.'
    n: '[FRUS 1964–68, XII, doc. 303](https://history.state.gov/historicaldocuments/frus1964-68v12/d303). Paul VI, [Address to the United Nations](https://www.vatican.va/content/paul-vi/en/speeches/1965/documents/hf_p-vi_spe_19651004_united-nations.html) (Oct. 4, 1965). [President''s Daily Diary, Oct. 4, 1965](https://catalog.archives.gov/id/192458), images 1, 4 (LBJ Library; National Archives Catalog). To check: [[w.hebblethwaite-paul-vi]]. Names: Paul VI, Johnson.'
    tags: [name:paul-vi, name:johnson-lyndon-b]
  - id: cal.1965-10-05.africa
    when: Oct. 5
    date: '1965-10-05'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'Rhodesia. Smith in London for talks with Wilson (Check the dates). Johnson to Wilson: the United States, too, would take "a very poor view" of a unilateral declaration of independence and oppose it vigorously; ready to tell Smith so directly, before the decisive meeting.'
    n: 'FRUS 1964–68, XXIV, docs. [474](https://history.state.gov/historicaldocuments/frus1964-68v24/d474), [476](https://history.state.gov/historicaldocuments/frus1964-68v24/d476), [477](https://history.state.gov/historicaldocuments/frus1964-68v24/d477). Made public: FRUS 1964–68, XXIV (1999). To check: [[w.deroche-black-white-and-chrome]]; [[w.watts-rhodesias-unilateral-declaration-of]]; [[w.horne-from-the-barrel-of]]; [[w.noer-cold-war-and-black]]. Names: Smith, Wilson.'
    tags: [name:johnson-lyndon-b, name:wilson-harold, name:smith-ian-douglas]
  - id: cal.1965-10-06.health
    when: Oct. 6
    date: '1965-10-06'
    thread: health
    c: 'Heart Disease, Cancer, and Stroke Amendments signed in the East Room, [79 Stat. 926](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg926.pdf): grants for regional medical programs joining medical schools, research institutions, and hospitals; $340 million over three years.'
    n: 'Remarks at the Signing of the Heart Disease, Cancer, and Stroke Amendments of 1965, [1965 Pub. Papers 1044](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=518) (Oct. 6, 1965). To check: [[w.blumenthal-heart-of-power]]. See [[cal.1964-12-09.health]]; [[cal.1965-01-07.medicare]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-07.defense-soviet-forces
    when: Oct. 7
    date: '1965-10-07'
    thread: defense-soviet-forces
    c: NIE 11-8-65, Soviet Capabilities for Strategic Attack. 224 operational ICBM launchers, mostly soft and concentrated; to about double in two years, in dispersed single silos. 500–1,000 in 1975; Air Force intelligence, at least 1,000. About 735 medium and intermediate launchers.
    n: '[FRUS 1964–68, X, doc. 97](https://history.state.gov/historicaldocuments/frus1964-68v10/d97). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
    tags: [name:raborn-william-f-jr]
  - id: cal.1965-10-08.succession
    when: Oct. 8
    date: '1965-10-08'
    thread: succession
    c: 'Johnson''s gall bladder removed at Bethesda Naval Hospital, with a stone from the ureter (Check). Oct. 5 he had announced the operation and made public his understanding with Humphrey, on the terms Eisenhower and Kennedy had made with their Vice Presidents: in an inability Humphrey to serve as Acting President, Johnson to decide when it ended. Oct. 20, at the hospital, he shows reporters the scar. Back at the White House Oct. 21.'
    n: 'Statement by the President Announcing That He Would Undergo Surgery, [1965 Pub. Papers 1043](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=517); Statement of Procedures for Use in the Event of Presidential Inability, [1965 Pub. Papers 1044](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=518) (Oct. 5, 1965). Remarks to Fellow Patients in the Naval Hospital, Bethesda, Maryland, [1965 Pub. Papers 1069](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=543) (Oct. 21, 1965). [[w.dallek-flawed-giant]], 522 (the operation, the scar). To check: [[w.gilbert-mortal-presidency]]. See [[cal.1964-09-28.succession]]; [[cal.1965-07-06.succession]]. Names: Johnson, Humphrey, Eisenhower, Kennedy. Check: Dallek gives a kidney stone (522).'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:eisenhower-dwight-d, name:kennedy-john-f]
  - id: cal.1965-10-08.opinion
    when: Oct. 8
    date: '1965-10-08'
    thread: opinion
    also: [welfare, poverty]
    c: 'Gallup, Sept. 16–21: a guaranteed minimum annual income for every family in place of relief and welfare: favor 19 percent, oppose 67.'
    n: '[[w.gallup-poll]], III, 1965.'
  - id: cal.1965-10-09.poverty
    when: Oct. 9
    date: '1965-10-09'
    thread: poverty
    c: 'Economic Opportunity Amendments signed, [79 Stat. 973](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg973.pdf): the war on poverty''s second year. A governor''s disapproval of a community action plan may be overridden by the director. The House had sent back the first conference report, Sept. 15, [209–180](https://voteview.com/rollcall/RH0890153), on Ayres''s motion to keep the governors'' veto; the second through the Senate Sept. 24, [46–22](https://voteview.com/rollcall/RS0890241).'
    n: '[111 Cong. Rec., House, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-2.pdf); [111 Cong. Rec., Senate, Sept. 24, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-1-2.pdf). To check: [[w.davies-from-opportunity-to-entitlement]]; [[w.moynihan-maximum-feasible-misunderstanding]]. See [[cal.1965-08-19.poverty]]. Names: Ayres.'
    tags: [name:ayres-william-h]
  - id: cal.1965-10-10.opinion
    when: Oct. 10
    date: '1965-10-10'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Sept. 16–21: a worker in a unionized plant required to join the union: should 44 percent, should not 47. South 34 should, 54 not; East 52 and 39; college-educated 22 and 71.'
    n: '[[w.gallup-poll]], III, 1965–66.'
  - id: cal.1965-10-10.europe-and-the-alliance
    when: Oct. 10
    date: '1965-10-10'
    thread: europe-and-the-alliance
    also: [middle-east]
    c: 'Turkey. Elections: Demirel''s Justice Party 52.9 percent, 240 seats in the Grand National Assembly; Demirel to form the government. Cyprus before the General Assembly in December.'
    n: 'FRUS 1964–68, XVI, docs. [210](https://history.state.gov/historicaldocuments/frus1964-68v16/d210), [211](https://history.state.gov/historicaldocuments/frus1964-68v16/d211). To check: [[w.ahmad-turkish-experiment-in-democracy]]; [[w.zurcher-turkey]]. See [[cal.1961-10-15.europe-and-the-alliance]]. Names: Demirel.'
    tags: [name:demirel-suleyman]
  - id: cal.1965-10-11.jobs-and-wages
    when: Oct. 11
    date: '1965-10-11'
    thread: jobs-and-wages
    also: [congress]
    c: Repeal of 14(b), the right-to-work clause, in the Senate. Mansfield moved Oct. 1 to take up H.R. 77, passed by the House July 28; Dirksen and his allies hold the floor. Oct. 11, cloture refused, [45–47](https://voteview.com/rollcall/RS0890248), two-thirds needed. The Senate turns to other business; H.R. 77 waits for the second session.
    n: 'Repeal of section 14(b) (K–J Cong. II.J.2). [111 Cong. Rec., Senate, Oct. 1, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-6-2.pdf); [111 Cong. Rec., Senate, Oct. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-3-2.pdf). To check: [[w.hulsey-everett-dirksen-and-his]]; [[w.macneil-dirksen]]; [[w.wawro-filibuster]]. See [[cal.1965-07-28.jobs-and-wages]]. Names: Mansfield, Dirksen.'
    tags: [name:mansfield-mike, name:dirksen-everett]
  - id: cal.1965-10-11.legislatures-md
    when: Oct. 11–21
    date: '1965-10-11'
    thread: legislatures
    c: 'Maryland. Special session on reapportioning the General Assembly, under court order to reapportion the Senate. Two acts: a Senate of 53, each county at least one Senator (ch. 3); should the courts reject it, one of 43, some counties joined in districts (ch. 2).'
    n: '*Maryland Manual*, 1965–66, [the special session of Oct. 11, 1965](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000172/html/am172--260.html). To check: [[w.cortner-apportionment-cases]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]; [[cal.1962-05-24.legislatures-md]].'
    tags: [state:md]
  - id: cal.1965-10-13.opinion
    when: Oct. 13
    date: '1965-10-13'
    thread: opinion
    c: 'Gallup, Sept. 16–21: the most important problem: civil rights 27 percent; Vietnam 19; threat of general war 17; prestige abroad 7; world communism 6; cost of living 5; poverty 3.'
    n: '[[w.gallup-poll]], III, 1966.'
  - id: cal.1965-10-13.vietnam-congress
    when: Oct. 13
    date: '1965-10-13'
    thread: vietnam-congress
    c: 'Rusk before the Foreign Relations Committee in executive session, on the world situation: in Vietnam "for another few weeks and months to find out where, when and how" the break toward peace will come; contacts with Hanoi, but no sign it will stop.'
    n: '[[w.gibbons-u-s-government-and]], IV, 92 (the stenographic text has "few"; the printed "two"). Made public: the Historical Series, 1990. To check: Senate Comm. on Foreign Relations, *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XVII: 1965, 1220 (1990). Names: Rusk.'
    tags: [name:rusk-dean]
  - id: cal.1965-10-14.cities-and-housing
    when: Oct. 14
    date: '1965-10-14'
    thread: cities-and-housing
    c: Rent supplements. The House strikes their money from the supplemental appropriation, [185–162](https://voteview.com/rollcall/RH0890194).
    n: '[111 Cong. Rec., House, Oct. 14, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-6-1.pdf). To check: [[w.gelfand-nation-of-cities]]. See [[cal.1965-08-10.cities-and-housing]].'
  - id: cal.1965-10-15.students
    when: Oct. 15–16
    date: '1965-10-15'
    thread: students
    also: [vietnam]
    c: 'International Days of Protest against the war, planned by Berkeley''s Vietnam Day Committee and the National Coordinating Committee to End the War in Vietnam (Check): marches, rallies, teach-ins in many cities. Oct. 15, at the Whitehall Street induction center in New York, David Miller, 24, a Catholic Worker, burns his draft card, the first to do so under the law of Aug. 30. The Berkeley march on the Oakland Army Terminal turned back by police at the Oakland line, Oct. 15 and again Oct. 16 (Check).'
    n: '[[w.gibbons-u-s-government-and]], IV, 89 (the days of protest and their sponsors), 28 n.86 (Miller). To check: [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]; [[w.wells-war-within]]; [[w.foley-confronting-the-war-machine]]; [[w.rorabaugh-berkeley-at-war]]. See [[cal.1965-08-30.students]]. Names: Miller.'
    tags: [name:miller-david-j]
  - id: cal.1965-10-17.students
    when: Oct. 17
    date: '1965-10-17'
    thread: students
    also: [vietnam]
    c: 'Katzenbach: a Justice Department inquiry into Communist influence in the antidraft movement.'
    n: '[[w.gibbons-u-s-government-and]], IV, 90 (the inquiry). Check: the record; Gibbons has the Justice Department''s announcement Oct. 18. See [[cal.1965-10-15.students]]. Names: Katzenbach.'
    tags: [name:katzenbach-nicholas]
  - id: cal.1965-10-18.desegregation-schools-milwaukee
    when: Oct. 18
    date: '1965-10-18'
    thread: desegregation-schools
    c: Milwaukee. The second boycott of the schools by the Integration Committee, of several days; thousands of children at its freedom schools. Groppi, of St. Boniface parish, among its organizers.
    n: 'Milwaukee United School Integration Committee, ["Facts About the Freedom Schools and the Pending School Boycott, Oct. 18–22, 1965"](https://collections.lib.uwm.edu/digital/collection/march/id/428) (MUSIC Records, Box 1, Folder 3). [*March on Milwaukee*](https://uwm.edu/marchonmilwaukee/wp-json/wp/v2/cpt-keyterms/173) (Check: the days; the Milwaukee Neighborhood News Service timeline gives Oct. 18–22). [Wikipedia, "James Groppi"](https://en.wikipedia.org/wiki/James_Groppi). See [[cal.1964-05-18.desegregation-schools-milwaukee]]. Names: Groppi.'
    tags: [state:wi, city:milwaukee, name:groppi-james]
  - id: cal.1965-10-18.students
    when: Oct. 18
    date: '1965-10-18'
    thread: students
    also: [vietnam]
    c: 'The FBI arrests David Miller for burning his draft card. Moyers: Johnson endorses Katzenbach''s inquiry.'
    n: '*United States v. Miller*, [367 F.2d 72](https://static.case.law/f2d/367/case-pdfs/0072-01.pdf), 74 (2d Cir. 1966). *United States v. O''Brien* (Viet. II.I.1). See [[cal.1965-10-15.students]]. Names: Miller, Moyers, Johnson, Katzenbach.'
    tags: [name:miller-david-j, name:moyers-bill, name:johnson-lyndon-b, name:katzenbach-nicholas]
  - id: cal.1965-10-19.vietnam
    when: Oct. 19
    date: '1965-10-19'
    thread: vietnam-operations
    c: 'Plei Me. North Vietnamese regiments attack the Special Forces camp south of Pleiku at night: twelve Americans of the 5th Special Forces Group and some 400 Montagnard irregulars. Reinforcements by helicopter.'
    n: '[Project CHECO, *The Siege at Plei Me* (Hq. PACAF, Feb. 24, 1966)](https://archive.org/details/DTIC_ADA487855), 1–2 (DTIC ADA487855; the attack from 1900, Oct. 19, the full assault at 2300; four CIDG companies and a 12-man Special Forces team). [[w.vietnam-victory-in-vietnam]], 158–59 (the 33d Regiment''s siege to draw a relief column into the 320th''s ambush, and the Americans after it); [[w.schlight-united-states-air-force]], 99–103. To check: [[w.carland-united-states-army-in]]; [[w.vinh-loc-why-pleime]]; [[w.coleman-pleiku]]; [[w.saliba-death-in-the-highlands]]. See [[cal.1965-07-28.vietnam]].'
    tags: [place:plei-me]
  - id: cal.1965-10-19.alabama
    when: Oct. 19–20
    date: '1965-10-19'
    thread: alabama
    also: [congress]
    c: 'The House Un-American Activities Committee on the Klan, Willis presiding. Shelton, Imperial Wizard of the United Klans of America, before it under subpoena Oct. 19 and 20, refuses to produce the Klan''s records. Convicted of contempt of Congress: a year and $1,000.'
    n: '*Shelton v. United States*, [404 F.2d 1292](https://static.case.law/f2d/404/case-pdfs/1292-01.pdf) (D.C. Cir. 1968). To check: [[w.goodman-committee]]; [[w.may-informant]]. Names: Willis, Shelton.'
    tags: [name:shelton-robert-m, name:willis-edwin-e]
  - id: cal.1965-10-20.conservation
    when: Oct. 20
    date: '1965-10-20'
    thread: conservation
    also: [health]
    c: 'Motor Vehicle Air Pollution Control Act and Solid Waste Disposal Act signed in Johnson''s room at Bethesda, [79 Stat. 992](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg992-2.pdf): federal exhaust standards for new cars from the 1968 models, imports included; research and grants on solid waste. The House passed it Sept. 24, [294–4](https://voteview.com/rollcall/RH0890169).'
    n: 'Remarks in the Hospital at the Signing of the Clean Air Act Amendments and Solid Waste Disposal Bill, [1965 Pub. Papers 1066](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=540) (Oct. 20, 1965). To check: [[w.krier-pollution-and-policy]]; [[w.dewey-dont-breathe-the-air]]. See [[cal.1965-10-02.conservation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-20.school-aid
    when: Oct. 20
    date: '1965-10-20'
    thread: school-aid
    c: Higher Education bill through Congress. The House agrees to the conference report, [313–63](https://voteview.com/rollcall/RH0890197), a motion to recommit against the Teacher Corps lost, [152–226](https://voteview.com/rollcall/RH0890196); the Senate the same day. The Senate had passed it Sept. 2, [79–3](https://voteview.com/rollcall/RS0890215). Scholarships for needy students, insured loans, aid to libraries and developing colleges, a National Teacher Corps.
    n: 'Higher Education Act of 1965 (K–J Cong. II.J.2). Statement by the President Following Passage by the Senate of the Higher Education Bill, [1965 Pub. Papers 965](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=439) (Sept. 2, 1965). [111 Cong. Rec., House, Oct. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-10-2.pdf); [111 Cong. Rec., Senate, Oct. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-10-1.pdf). To check: [[w.graham-uncertain-triumph]]. See [[cal.1965-01-12.school-aid]]; [[cal.1965-08-26.school-aid]].'
  - id: cal.1965-10-20.foreign-aid
    when: Oct. 20
    date: '1965-10-20'
    thread: foreign-aid
    c: 'Foreign aid appropriation for fiscal 1966 signed, [79 Stat. 1002](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1002.pdf): 7 percent under the request, the smallest cut since the Marshall Plan, Johnson says. The House passed it Sept. 8, [239–143](https://voteview.com/rollcall/RH0890136); the Senate Sept. 23, [59–22](https://voteview.com/rollcall/RS0890240). The conference report: House, Oct. 1, [204–127](https://voteview.com/rollcall/RH0890183); Senate, Oct. 5, [40–23](https://voteview.com/rollcall/RS0890245).'
    n: 'Statement by the President Upon Signing the Foreign Assistance and Related Agencies Appropriation Act, [1965 Pub. Papers 1068](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=542) (Oct. 20, 1965). See [[cal.1965-09-06.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-20.state-constitutions-ct
    when: Oct. 20
    date: '1965-10-20'
    thread: state-constitutions
    c: Connecticut's convention adopts a new constitution unanimously, with a second proposal on taking property for public use.
    n: '[Conn. *Register and Manual*, 1966, pp. 46–48](https://archive.org/details/register66conn/page/n49). See [[cal.1965-07-01.state-constitutions-ct]].'
    tags: [state:ct]
  - id: cal.1965-10-20.cities-and-housing
    when: Oct. 20
    date: '1965-10-20'
    thread: cities-and-housing
    c: Rent supplements. The Senate keeps $12 million in contract authority, a motion to strike it lost, [37–45](https://voteview.com/rollcall/RS0890253).
    n: '[111 Cong. Rec., Senate, Oct. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-10-1.pdf). See [[cal.1965-10-14.cities-and-housing]].'
  - id: cal.1965-10-21.trade
    when: Oct. 21
    date: '1965-10-21'
    thread: trade
    c: 'Automotive Products Trade Act signed, [79 Stat. 1016](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1016.pdf): authority to free Canadian cars and original parts of duty under the January agreement; adjustment assistance for American firms and workers it hurts. Proclamation 3682 removes the duties in sixty days, retroactive to Jan. 18; a board of the Secretaries of the Treasury, Commerce, and Labor for the assistance. The House passed it Aug. 31, [280–113](https://voteview.com/rollcall/RH0890129); the Senate Sept. 30, [54–18](https://voteview.com/rollcall/RS0890244).'
    n: 'Statement by the President Following the Signing of Bill Implementing U.S.-Canadian Agreement on Automotive Products, [1965 Pub. Papers 1071](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=545); Statement by the President on Issuing Proclamation and Executive Order Relating to the U.S.-Canadian Agreement on Automotive Products, [1965 Pub. Papers 1072](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=546) (Oct. 22, 1965). [Proclamation 3682](https://www.presidency.ucsb.edu/documents/proclamation-3682-implementing-agreement-concerning-automotive-products-between-the-united) (Oct. 21, 1965), [30 Fed. Reg. 13683](https://www.govinfo.gov/app/details/FR-1965-10-28). To check: [[w.zeiler-american-trade-and-power]]. See [[cal.1965-01-16.trade]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-21.legislatures-ca
    when: Oct. 21
    date: '1965-10-21'
    thread: legislatures
    c: California. In special session from Sept. 17, the Legislature passes its reapportionment of both houses by population. Los Angeles County's one senator becomes fourteen (Check). The "federal plan" Senate ended.
    n: Cal. Stats. 1965, 2d Ex. Sess., ch. 3, as *Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/case-pdfs/0841-01.pdf) (1966), gives the dates. See [[cal.1965-09-01.legislatures-ca]].
    tags: [state:ca, city:los-angeles]
  - id: cal.1965-10-21.cities-and-housing
    when: Oct. 21
    date: '1965-10-21'
    thread: cities-and-housing
    c: Rent supplements. The conferees drop them "without prejudice"; the House agrees to their report, [250–84](https://voteview.com/rollcall/RH0890199).
    n: '[111 Cong. Rec., House, Oct. 21, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-1-1.pdf). See [[cal.1965-10-14.cities-and-housing]].'
  - id: cal.1965-10-21.defense-soviet-forces
    when: Oct. 21
    date: '1965-10-21'
    thread: defense-soviet-forces
    c: NIE 11-14-65, Capabilities of Soviet General Purpose Forces. About 108 line divisions ready for a war's first operations, 31 cadre divisions. The Soviets and their Warsaw Pact allies, 45 divisions and about 2,900 combat aircraft ready against NATO's Central Region.
    n: '[FRUS 1964–68, X, doc. 98](https://history.state.gov/historicaldocuments/frus1964-68v10/d98). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
    tags: [name:raborn-william-f-jr]
  - id: cal.1965-10-22.conservation
    when: Oct. 22
    date: '1965-10-22'
    thread: conservation
    c: 'Highway Beautification Act signed in the East Room, [79 Stat. 1028](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1028.pdf): billboards within 660 feet of Interstate and primary highways, and junkyards within 1,000 feet, to be controlled from Jan. 1, 1968, or a State loses 10 percent of its federal highway money; landscaping and scenic roads. The Senate passed it Sept. 16, [63–14](https://voteview.com/rollcall/RS0890231); the House Oct. 7, [245–138](https://voteview.com/rollcall/RH0890189), recommittal refused, [153–230](https://voteview.com/rollcall/RH0890188); the Senate took the House''s text Oct. 13.'
    n: 'Remarks at the Signing of the Highway Beautification Act of 1965, [1965 Pub. Papers 1072](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=546) (Oct. 22, 1965). [111 Cong. Rec., Senate, Oct. 13, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-5-1.pdf). Opinion: [42 Op. Att''y Gen. 331](https://archive.org/details/op-atty-gen/042/page/n355/mode/1up) (1966), Clark, Acting Attorney General, to the Secretary of Commerce, Nov. 16, 1966: a State must pay for the billboards removed, police power or not, to escape the 10 percent cut; the condition constitutional. To check: [[w.gould-lady-bird-johnson-and]]; [[w.johnson-white-house-diary]]. See [[cal.1965-10-02.conservation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-22.alabama
    when: Oct. 22
    date: '1965-10-22'
    thread: alabama
    c: Hayneville. An all-white jury acquits Wilkins at his second trial for the murder of Viola Liuzzo, after an hour and 45 minutes.
    n: 'To check: [[w.may-informant]]. See [[cal.1965-03-25.alabama]]; [[cal.1965-05-07.alabama]]. Names: Wilkins, Liuzzo.'
    tags: [name:wilkins-collie-leroy-jr, name:liuzzo-viola]
  - id: cal.1965-10-22.opinion
    when: Oct. 22
    date: '1965-10-22'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Sept. 16–21: the Johnson Administration''s handling of Vietnam: approve 58 percent, disapprove 22.'
    n: '[[w.gallup-poll]], III, 1967. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-10-22.alabama-al
    when: Oct. 22
    date: '1965-10-22'
    thread: governors
    also: [alabama, state-constitutions, state-legislatures]
    c: 'Alabama''s Senate, after a filibuster, Wallace short of the 21 votes for cloture: the succession bill lost on the fourteenth day, 18 to 14, short of the required majority.'
    n: '[*Journal of the Senate*, Third Special Session, 1965, 107](https://archive.org/details/alabama-senate-journal-1965-special-b/page/n480). See [[cal.1965-09-30.alabama-al]]. Lurleen Wallace announces: [[cal.1966-02-24.elections-1966]]. Names: Wallace.'
    tags: [state:al, name:wallace-george-c]
  - id: cal.1965-10-22.vietnam-congress
    when: Oct. 22
    date: '1965-10-22'
    thread: vietnam-congress
    c: 'Fulbright in the Senate, on his criticism of the President: a consensus "a miscarriage of democratic procedures insofar as it represents the concealment of differences."'
    n: '[111 Cong. Rec., Senate, Oct. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-2-1.pdf), 28372 ff. [[w.gibbons-u-s-government-and]], IV, 41 n.128. See [[cal.1965-09-15.latin-america]]. Names: Fulbright.'
    tags: [name:fulbright-j-william]
  - id: cal.1965-10-23.congress
    when: Oct. 23
    date: '1965-10-23'
    thread: congress
    c: 'The 89th Congress''s first session adjourns sine die after midnight, the Senate at 12:51 a.m., the House at 12:52. Johnson''s letter, read by Mansfield: the session "will be recorded as the greatest session of Congress in the history of our Nation." Oct. 7 he had given the members a salute at the State Department.'
    n: '[111 Cong. Rec., Senate, Oct. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-2-1.pdf); [111 Cong. Rec., House, Oct. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-2-2.pdf). Remarks at the President''s Salute to Congress, [1965 Pub. Papers 1057](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=531) (Oct. 7, 1965). To check: [[w.zelizer-fierce-urgency-of-now]]; [[w.mackenzie-liberal-hour]]. See [[cal.1965-01-04.congress]]. Names: Johnson, Mansfield.'
    tags: [name:johnson-lyndon-b, name:mansfield-mike, appropriations:89-1]
  - id: cal.1965-10-23.vietnam
    when: Oct. 23–25
    date: '1965-10-23'
    thread: vietnam-operations
    c: Plei Me. An ARVN armored column, ambushed Oct. 23, reaches the camp Oct. 25, the 1st Cavalry Division's artillery in support.
    n: '[Project CHECO, *The Siege at Plei Me*](https://archive.org/details/DTIC_ADA487855), 5–6 (the ambush at 1815, Oct. 23; the column into the camp Oct. 25). See [[cal.1965-10-19.vietnam]].'
    tags: [place:plei-me]
  - id: cal.1965-10-25.legislatures-nv
    when: Oct. 25–Nov. 13
    date: '1965-10-25'
    thread: legislatures
    also: [states-and-cities]
    c: 'Nevada''s legislature in special session, called by Sawyer at the order of the federal district court in *Dungan v. Sawyer*, [250 F. Supp. 480](https://static.case.law/f-supp/250/case-pdfs/0480-01.pdf), brought by Assemblywoman Dungan of Clark County: the Senate, one member for each of the 17 counties, and the Assembly found invidiously discriminatory; fewer than 8 percent of the people elected a majority of the Senate. The 1965 regular session had passed only a resolution asking Congress for an amendment letting one house be apportioned on other factors. Plan adopted: 20 senators from 13 districts, Clark County 8; 40 assemblymen from 16 districts, Clark County 16.'
    n: '[Nev. *Political History of Nevada* (12th ed., 2016), 400](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=406)–401; the plan, 415–417. To check: [[w.dixon-democratic-representation]]; [[w.elliott-history-of-nevada]]. See [[cal.1964-06-15.court]]. Names: Sawyer, Dungan.'
    tags: [state:nv, city:las-vegas, name:sawyer-grant, name:dungan-flora]
  - id: cal.1965-10-25.middle-east
    when: Oct. 25
    date: '1965-10-25'
    thread: middle-east
    c: 'Saudi air defense. The British Minister of Aviation to McNamara: a joint offer of British Lightning fighters and American Hawk missiles, British radar, American communications.'
    n: 'Jenkins to McNamara, Oct. 25: [FRUS 1964–68, XXI, doc. 255](https://history.state.gov/historicaldocuments/frus1964-68v21/d255), n. 2. To check: [[w.hart-saudi-arabia-and-the]]; [[w.petersen-decline-of-the-anglo]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1965-10-26.vietnam
    when: Oct. 26
    date: '1965-10-26'
    thread: vietnam-operations
    c: Westmoreland sends the 1st Cavalry after the regiments withdrawing from Plei Me (Check).
    n: '[FRUS 1964–68, III, doc. 208](https://history.state.gov/historicaldocuments/frus1964-68v03/d208) (Bundy to Johnson, Nov. 27). See [[cal.1965-10-19.vietnam]]. Names: Westmoreland.'
    tags: [name:westmoreland-william, place:plei-me]
