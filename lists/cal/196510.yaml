  - id: cal.1965-10-01.india-and-china
    when: Oct. 1
    date: '1965-10-01'
    thread: indonesia
    c: 'Djakarta. The "September 30th Movement," under Lt. Col. Untung of the palace guard, kills six generals before dawn, Yani, the army commander, among them; Nasution escapes. Suharto, commanding the army''s strategic reserve, retakes the capital by evening. The army blames the Communist party (PKI). Oct. 5, Ambassador Green: no overt involvement, but let Nasution and Suharto know "covertly" of a "desire to be of assistance." By Oct. 20 the embassy reports some thousand PKI cadres arrested in the Djakarta area, several hundred executed.'
    n: 'FRUS 1964–68, XXVI, docs. [142](https://history.state.gov/historicaldocuments/frus1964-68v26/d142), [147](https://history.state.gov/historicaldocuments/frus1964-68v26/d147), [158](https://history.state.gov/historicaldocuments/frus1964-68v26/d158). To check: [[w.jones-conflict-and-confrontation-in]]; [[w.simpson-economists-with-guns]]; [[w.robinson-killing-season]]. Names: Untung, Suharto, Nasution, Green.'
    tags: [name:suharto, name:nasution-abdul-haris, name:green-marshall, name:untung]
    short: the September 30th Movement, Suharto's army
    time_range:
      - 1965-09-30T17:00Z
      - 1965-09-30T23:00Z
    time_band: predawn
    time_zone: Asia/Jakarta
  - id: cal.1965-10-01.states-and-cities-jacksonville
    when: Oct. 1
    date: '1965-10-01'
    thread: states-and-cities
    c: Jacksonville. The Local Government Study Commission of Duval County, created by the 1965 legislature, established, to propose a government for the city and county by May 1, 1967. The county's fifteen public high schools had lost their accreditation in 1964.
    n: '[Wikipedia, "Jacksonville Consolidation"](https://en.wikipedia.org/wiki/Jacksonville_Consolidation). Check: the act, Laws of Fla. 1965. To check: [[w.bartley-keeping-the-faith]].'
    tags: [state:fl, city:jacksonville]
  - id: cal.1965-10-01.desegregation-schools-chicago
    when: Oct. 1–6
    date: '1965-10-01'
    thread: desegregation-schools
    also: [school-aid, civil-rights-the-executive]
    c: Chicago. Keppel, after the Office of Education's inquiry into the Coordinating Council's complaint against the schools under Title VI, defers some $30 million of Chicago's first grants under the Elementary and Secondary Education Act, Oct. 1. Released within the week, the Board of Education having agreed with HEW on corrective action. Civil rights leaders credit Daley's call to Johnson. Dirksen asks an inquiry.
    n: '*Harvard Crimson*, [Oct. 8, 1965](https://www.thecrimson.com/article/1965/10/8/keppels-release-of-chicago-funds-stirs/) (Check the day of the release). Dirksen''s papers: Keppel to Ray Page, Illinois Superintendent of Public Instruction, Sept. 20, 1965; Page to Keppel, Oct. 2 ([Dirksen Congressional Center](https://omekas-congress.lib.wvu.edu/catalog/EMD_Working_Papers-f358-1965_10_02)). [[w.garrow-bearing-the-cross]], 448 (the deferral and its lifting); [[w.branch-at-canaans-edge]], 333–35 (the deferral and its lifting); [[w.bernstein-guns-or-butter]], 395 (Keppel''s letter, Gardner approving, delivered to Page with a copy to Willis); [[w.ralph-northern-protest]], 182 (more than $30 million suspended; Daley to Johnson in New York; restored within the week); [[w.anderson-confronting-the-color-line]], 178–81 (Keppel to Page, Sept. 30, "probable noncompliance"; the funds restored within the week; Raby: "naked political power"); [[w.cohen-american-pharaoh]], 335, 350–52. Check: Anderson, too, dates Keppel''s letter Sept. 30 and puts Chicago''s funds under the act at $32 million (178–79). Check: Cohen and Taylor give $32 million as what Chicago stood to lose (335); Keppel''s letters of Oct. 1, to Willis and to the State''s superintendent, find the system in "probable non-compliance" (350). To check: [[w.danns-something-better-for-our]]; King to Johnson, Oct. 2, 1965, King Name File, Johnson Library; *Chicago Daily News*, Oct. 6 at 1 and Oct. 7, 1965, at 1; *Chicago Tribune*, Oct. 8, 1965, at 14 (cited by [[w.garrow-bearing-the-cross]], 448 n.19); Keppel to Willis and Keppel to Page, Sept. 30, 1965, Cyrus Adams Papers, box 13, Chicago History Museum (cited by [[w.branch-at-canaans-edge]], 334); [[w.orfield-reconstruction-of-southern-education]], 180–82 (cited by [[w.anderson-confronting-the-color-line]], 179 n.25); *Chicago Sun-Times*, 3 October 1965; *Chicago Daily News*, 2 October 1965 (cited by [[w.anderson-confronting-the-color-line]], 180 n.29); *Chicago Daily News*, 2 October 1965; Orfield, Reconstruction, p. 193 (cited by [[w.anderson-confronting-the-color-line]], 180 n.30). See [[cal.1963-10-22.desegregation-schools-chicago]]; [[cal.1965-04-11.school-aid]]. Check: Branch dates Keppel''s letters Sept. 30 and gives $31 million (333–34). Names: Keppel, Daley, Johnson, Dirksen.'
