    thread: desegregation-schools
    also: [school-aid, civil-rights-the-executive]
    c: Chicago. Keppel, after the Office of Education's inquiry into the Coordinating Council's complaint against the schools under Title VI, defers some $30 million of Chicago's first grants under the Elementary and Secondary Education Act, Oct. 1. Released within the week, the Board of Education having agreed with HEW on corrective action. Civil rights leaders credit Daley's call to Johnson. Dirksen asks an inquiry.
    n: '*Harvard Crimson*, [Oct. 8, 1965](https://www.thecrimson.com/article/1965/10/8/keppels-release-of-chicago-funds-stirs/) (Check the day of the release). Dirksen''s papers: Keppel to Ray Page, Illinois Superintendent of Public Instruction, Sept. 20, 1965; Page to Keppel, Oct. 2 ([Dirksen Congressional Center](https://omekas-congress.lib.wvu.edu/catalog/EMD_Working_Papers-f358-1965_10_02)). [[w.garrow-bearing-the-cross]], 448 (the deferral and its lifting); [[w.branch-at-canaans-edge]], 333–35 (the deferral and its lifting); [[w.bernstein-guns-or-butter]], 395 (Keppel''s letter, Gardner approving, delivered to Page with a copy to Willis). To check: [[w.anderson-confronting-the-color-line]]; [[w.cohen-american-pharaoh]]; [[w.danns-something-better-for-our]]; King to Johnson, Oct. 2, 1965, King Name File, Johnson Library; Chicago Daily News, Oct. 6, 1965, 1; Oct. 7, 1965, 1; Chicago Tribune, Oct. 8, 1965, 14 (cited by [[w.garrow-bearing-the-cross]], 448 n.19); Keppel to Willis and Keppel to Page, Sept. 30, 1965, Cyrus Adams Papers, box 13, Chicago History Museum (cited by [[w.branch-at-canaans-edge]], 334). See [[cal.1963-10-22.desegregation-schools-chicago]]; [[cal.1965-04-11.school-aid]]. Check: Branch dates Keppel''s letters Sept. 30 and gives $31 million (333–34). Names: Keppel, Daley, Johnson, Dirksen.'
