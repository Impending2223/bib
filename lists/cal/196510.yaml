    c: 'Immigration and Nationality Act Amendments signed on Liberty Island, N.Y., [79 Stat. 911](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg911.pdf).{1} The national-origins quotas end June 30, 1968: then 170,000 a year from the Eastern Hemisphere, no country over 20,000, by preference for kin of citizens and residents and for skills; 120,000 from the Western Hemisphere.{2} Johnson: "not a revolutionary bill";{3} it corrects "a cruel and enduring wrong." To Cuba, after Castro''s offer: "those who seek refuge here in America will find it";{4} an "orderly entry" to be arranged, Cuba''s agreement sought through the Swiss, $12.6 million asked of Congress.{5}'
    n: 'Statute (K–J Cong. II.J.2). Remarks at the Signing of the Immigration Bill, Liberty Island, New York, [1965 Pub. Papers 1037](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=511) (Oct. 3, 1965). [FRUS 1964–68, XXXII, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v32/d308) (Cuba). [[w.branch-at-canaans-edge]], 337–38 (the signing on Liberty Island); [[w.bernstein-guns-or-butter]], 258–59 ("those who do come will come because of what they are"; the provisions); [[w.johnson-white-house-diary]], 321–22 (the signing on the island, the Statue of Liberty and the skyline behind him; Anna Moffo sang "America"; Congressmen received the pens; not the Stat.); [[w.albert-little-giant-1990]], 293 (Johnson signs the bill before the Statue of Liberty; the national-origins quotas ended; not the day, the statute, the numbers or the words); [[w.obrien-no-final-victories]], 184 (the President signs the immigration bill at the Statue of Liberty, flying to Liberty Island by helicopter; "the summer of 1965" on the page). See [[cal.1965-01-13.immigration]]; [[cal.1965-09-22.immigration]]; [[cal.1965-09-28.cuba]]. Names: Johnson, Castro.'
