    tags: [state:ca, name:brown-edmund-g]
  - id: cal.1965-10-28.middle-east
    when: Oct. 28
    date: '1965-10-28'
    thread: middle-east
    c: 'McNamara: Sultan has already chosen an F-104G package for Saudi air defense, if finance and missiles can be arranged.'
    n: '[FRUS 1964–68, XXI, doc. 255](https://history.state.gov/historicaldocuments/frus1964-68v21/d255) (Oct. 29). Made public: FRUS 1964–68, XXI (2000). See [[cal.1965-10-25.middle-east]]. Names: McNamara, Sultan ibn Abd al-Aziz Al Saud.'
    tags: [name:mcnamara-robert-s, name:sultan-ibn-abd-al-aziz-al-saud]
