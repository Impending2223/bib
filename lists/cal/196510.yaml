    n: '[[w.zhou-enlai-waijiao-huodong]], 480 (Oct. 1, 1965; 10 a.m., Tiananmen gate tower, Beijing); [[w.yang-shangkun-riji]], II, 675 (Oct. 1, 1965; Yang at Tiananmen for National Day, 10 a.m. to noon; Zhou not named; the words: 10时到12时在天安门参加国庆); [[w.deng-xiaoping-nianpu-1904]], III, 1877 (Oct. 1, 1965; Deng attends the rally in Tiananmen Square for the sixteenth anniversary of the People''s Republic, and reviews the parade); [[w.peng-zhen-nianpu-1902]], IV, 441 (Oct. 1, 1965, morning; Tiananmen Square; Peng Zhen speaks at the rally: a deep cultural revolution under way, culture, education, health and science serving socialism and the workers, peasants and soldiers, many intellectuals going to the hills and villages; the Third Five-Year Plan from 1966; the general line held high); [[w.chen-yi-nianpu]], 1126 (Oct. 1, 1965, morning; Chen Yi on the Tiananmen gate tower at the rally and reviews the parade); [[w.liu-jixian-ye-jianying-nianpu]], II, 932 (Oct. 1, 1965; Ye Jianying 叶剑英 at the rally for the sixteenth anniversary of the People''s Republic); [[w.zhu-de-nianpu-xinbian]], III, 1940 (Oct. 1, 1965; Zhu De 朱德, with Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Soong Ching Ling 宋庆龄, Dong Biwu 董必武, Zhou Enlai 周恩来, Deng Xiaoping 邓小平 and others, at the rally of 500,000 of the capital in Tiananmen Square 天安门广场 for the sixteenth anniversary, reviewing the parade from the Tiananmen tower). Names: Zhou Enlai, Norodom Sihanouk.'
