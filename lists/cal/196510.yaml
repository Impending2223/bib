    c: 'Deng Xiaoping 邓小平 reads Tan Zhenlin''s 谭震林 letter on preparations for the exhibition of Dazhai-type agricultural models. Comment: agreed to copy several sets and show them in different places, not to have people come to Peking 北京 to see them. Tan''s letter: shown only in Peking the exhibition is limited by region, so copies of the pictures are proposed for six great regions. The exhibition opens Nov. 1 at the National Agricultural Exhibition Hall in Peking.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1879 (Oct. 1965). The words: 10月下旬 (III, 1879). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Tan Zhenlin.'
