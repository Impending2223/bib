  - id: cal.1965-10-01.vietnam-air-war
    when: Oct. 1
    date: '1965-10-01'
    thread: vietnam-air-war
    c: 'Rolling Thunder 34 and 35 (Oct. 1–14) open the North''s northeast quadrant, much of the rail line from Hanoi to Ping Hsiang, China: the Long Het, Xom Phuong and Vu Chua bridges and the Long Het ammunition depot; one coordinated attack a bridge in seven days; 1,200 armed reconnaissance sorties a fortnight, half to the Navy. Programs 37 and 38 (Oct. 15–28): the Bac Can, Choi Moi, Thai Nguyen and Lang Luang bridges. From 38 and 39 (Oct. 29–Nov. 11), locks and dams exempt.'
    n: '[[w.staaveren-gradual-failure]], 183, 199. See [[cal.1965-08-20.vietnam-air-war]].'
    src:
      c: aa003d8a
      rows:
        - 'w.staaveren-gradual-failure 183, 199: all'
