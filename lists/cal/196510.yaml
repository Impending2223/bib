    place: saigon
    thread: vietnam-diplomacy
    c: 'Lodge to Johnson and Rusk, Saigon 1377, "If Hanoi decides to negotiate": Thiệu, Oct. 13, and Kỳ, Oct. 19, find South Vietnam "absolutely unready" for political warfare with the Communists, and Lodge agrees.{1} A "satisfactory outcome," the Mission Council''s of Oct. 19: the Delta and the coastal strip pacified, the cities and provincial capitals held, the roads open; the Viet Cong disarmed, North Vietnam''s infiltration and direction stopped, the hard core gone north.{2}'
    n: '[FRUS 1964–68, III, doc. 176](https://history.state.gov/historicaldocuments/frus1964-68v03/d176). [[w.gibbons-u-s-government-and]], IV, 59 n.42 (the satisfactory outcome); [[w.drea-mcnamara-clifford-and-the-2011]], 117 (Lodge''s cable on the extreme weakness of the Saigon government). Made public: FRUS 1964–68, III (1996). Names: Lodge, Johnson, Rusk, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
    src:
