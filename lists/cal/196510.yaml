    c: 'Cuba answers the American note of Oct. 6, through the Swiss: ready to begin at once, 12,000 a month against the 3,000 asked; men of 15 to 26 kept back; Cuba to draw the lists, subject to an American veto; no Red Cross. Boats from Florida since Oct. 7, over 700 refugees in by Oct. 18.'
