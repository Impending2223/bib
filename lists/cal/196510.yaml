    thread: china-leadership
    also: [africa, soviet-union]
    c: 'Zhou writes the heads of Asian and African states and governments: China has steadily and actively supported the second Asian-African conference and worked for it;{1} finding that if held it would face a split, it agreed to postponement.{2} In the complex present, for Asian-African unity, the gains and losses of meeting now must be weighed with care; China, after repeated consideration, holds that rather than force a meeting against consensus and split Asia and Africa, it is better not to meet for the time, which helps Asian and African peoples keep the Bandung spirit. If a meeting is forced on time China will be obliged not to attend a meeting that leads to a split.{3}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 759–60 (Oct. 22, 1965); [[w.zhou-enlai-waijiao-huodong]], 483 (Oct. 22, 1965; the letter explaining China''s position on postponing the second conference); [[w.zhonghua-renmin-gongheguo-waijiao]], 64 (Oct. 22, 1965; Zhou''s letter to the heads of Afro-Asian governments: China''s stand on postponing the second conference, jointly proposed with Cambodia); [[w.jian-zhou-enlai]], 529 ("in late October": "rather than forcefully pursuing the conference in violation of the principle of consensus, it is better to temporarily table it"). Made public: 1993. To check: Zhou''s letter to leaders of Asian and African countries, October 22, 1965, 107-00934-02, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 529 n.43). Names: Zhou Enlai.'
