    c: 'International Days of Protest against the war, planned by Berkeley''s Vietnam Day Committee and the National Coordinating Committee to End the War in Vietnam (Check): marches, rallies, teach-ins in many cities.{1} Oct. 15, at the Whitehall Street induction center in New York, David Miller, 24, a Catholic Worker, burns his draft card, the first to do so under the law of Aug. 30.{2} The Berkeley march on the Oakland Army Terminal turned back by police at the Oakland line, Oct. 15 and again Oct. 16 (Check).{3}'
    n: '[[w.gibbons-u-s-government-and]], IV, 28, 89 (the days of protest and their sponsors, 89; Miller, 28 n.86); [[w.branch-at-canaans-edge]], 356–57 (Miller''s draft card); [[w.bernstein-guns-or-butter]], 382 (nearly 100,000 in 80 cities; a young man burns his card in Manhattan; counter-demonstrations); [[w.wells-war-within]], 51, 57 (the Days proposed by Rubin at the Assembly of Unrepresented People, the NCC formed there; some 100,000 in several dozen cities, 25,000 in New York; Miller''s card in New York; 15,000 from the Berkeley teach-in turned back at the Oakland line; not Oct. 16); [[w.zaroulis-who-spoke-up]], 51, 55–56 (the Vietnam Day Committee''s and the National Coordinating Committee''s days; Berkeley, as many as 10,000, turned back Friday evening and Saturday afternoon; Miller at Whitehall Street); [[w.debenedetti-american-ordeal]], 121–22, 125 (the dates set by the Vietnam Day Committee, the National Coordinating Committee their executive agency; nearly 100,000 in eighty cities; Miller at Whitehall Street, Oct. 15; more than 14,000 turned back at Oakland''s line by 400 police in two days); [[w.lich-su-khang-chien-chong-my]], V, 305 (Oct. 15 and 16, 1965: over 100,000 in 60 cities; a night march of over 10,000 at Berkeley toward the Oakland Army Base; David Miller burns his draft card at the Whitehall Street induction center). Check: Zaroulis and Sullivan, 56, give Miller as twenty-two; New York, 20,000 to 25,000 down Fifth Avenue, Oct. 16; some 100,000 in fifty cities. Check: DeBenedetti, 125, gives Miller''s age as 22. To check: [[w.foley-confronting-the-war-machine]]; [[w.rorabaugh-berkeley-at-war]]. See [[cal.1965-08-30.students]]. Names: Miller.'
