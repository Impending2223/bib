    c: 'Ohio''s fair housing act in force: the Civil Rights Commission''s jurisdiction extended to housing, owner-occupied one- and two-family houses excepted. State Representative Carl Stokes of Cleveland among its movers.'
    n: 'Ohio Rev. Code ch. 4112 (as amended, eff. Oct. 30, 1965), cited in *Hunter v. Erickson*, [393 U.S. 385](https://tile.loc.gov/storage-services/service/ll/usrep/usrep393/usrep393385/usrep393385.pdf) (1969) (Check: the act''s passage and signing). To check: [[w.moore-carl-b-stokes-and]]. See [[cal.1964-11-03.open-housing-akron]]. Names: Stokes.'
