# Cal. LXXVII April 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXVII
entries:
  - id: cal.1966-04-02.vietnam
    when: Apr. 2–14
    date: '1966-04-02'
    thread: vietnam
    c: 'The Struggle Movement. Apr. 2, at the White House: keep Kỳ if possible, a fallback ready; Lodge to press Trí Quang. Apr. 3, Kỳ calls Đà Nẵng held by Communists (Check the day). Apr. 4, Washington to Saigon: no American forces in Đà Nẵng or Huế or against dissident troops. Apr. 5, three battalions of Vietnamese marines flown to the Đà Nẵng air base; Kỳ, satisfied the city is not in Communist hands, back to Saigon. Apr. 6, the government accepts a constitutional convention within six months. Apr. 12–14, a National Political Congress at Saigon; Apr. 14, Thiệu decrees elections for a constituent assembly in three to five months (Check).'
    n: 'FRUS 1964–68, IV, docs. [108](https://history.state.gov/historicaldocuments/frus1964-68v04/d108), [109](https://history.state.gov/historicaldocuments/frus1964-68v04/d109), [110](https://history.state.gov/historicaldocuments/frus1964-68v04/d110), [112](https://history.state.gov/historicaldocuments/frus1964-68v04/d112), [113](https://history.state.gov/historicaldocuments/frus1964-68v04/d113), [116](https://history.state.gov/historicaldocuments/frus1964-68v04/d116), [123](https://history.state.gov/historicaldocuments/frus1964-68v04/d123). Made public (the meetings of Apr. 2 and 4): FRUS 1964–68, IV (1998). See [[cal.1966-03-10.vietnam]]. Names: Kỳ, Trí Quang (Viet. III.G); Lodge (Viet. III.C).'
    tags: [name:nguyen-cao-ky, name:thich-tri-quang, name:lodge-henry-cabot, name:nguyen-van-thieu, name:johnson-lyndon-b]
  - id: cal.1966-04-06.civil-rights-the-executive
    when: Apr. 6–20
    date: '1966-04-06'
    thread: civil-rights-the-executive
    c: 'Reorganization Plan 1 of 1966, sent Feb. 10: the Community Relations Service from Commerce to Justice. The Senate refuses to disapprove it, [32–42](https://voteview.com/rollcall/RS0890288), Apr. 6; the House, [163–220](https://voteview.com/rollcall/RH0890240), Apr. 20. The plan stands.'
    n: '[Special Message to the Congress Transmitting Reorganization Plan 1 of 1966 Relating to the Community Relations Service](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-reorganization-plan-1-1966-relating-the) (Feb. 10, 1966). [[w.levine-resolving-racial-conflict]]; [[w.graham-civil-rights-era]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-08.medicare
    when: Apr. 8
    date: '1966-04-08'
    thread: medicare
    c: 'At San Antonio, Johnson signs the bill extending enrollment in Medicare''s insurance for doctors'' bills from Mar. 31 to May 31, [80 Stat. 99](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg99.pdf). Almost 17 million enrolled, he says; some 1.3 million over 65 not yet.'
    n: '[Letter to the President of the Senate and to the Speaker of the House Requesting Extension of the Medicare Enrollment Deadline](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-requesting-extension-the) (Mar. 31, 1966); [Remarks in San Antonio at the Signing of the Medicare Extension Bill](https://www.presidency.ucsb.edu/documents/remarks-san-antonio-the-signing-the-medicare-extension-bill) (Apr. 8, 1966). [[w.smith-health-care-divided]]; [[w.blumenthal-heart-of-power]]. See [[cal.1965-07-30.medicare]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-12.europe-and-the-alliance
    when: Apr. 12–22
    date: '1966-04-12'
    thread: europe-and-the-alliance
    c: 'The American aide-mémoire to France, shown to the other fourteen Apr. 7: France acts alone without asking the review Article 12 allows; with French forces in Germany out of Allied Command Europe July 1, the 1960 agreement on atomic weapons for their use lapses. Apr. 22, Couve de Murville''s reply to Bohlen: the dates stand. Apr. 22, NSAM 345: recommendations for a larger part for the major allies in nuclear planning, a permanent body of restricted membership within NATO among the possibilities.'
    n: 'FRUS 1964–68, XIII, docs. [154](https://history.state.gov/historicaldocuments/frus1964-68v13/d154), [158](https://history.state.gov/historicaldocuments/frus1964-68v13/d158), [159](https://history.state.gov/historicaldocuments/frus1964-68v13/d159). *American Foreign Policy: Current Documents, 1966*, pp. 328–330, 336. See [[cal.1966-03-07.europe-and-the-alliance]].'
    tags: [name:couve-de-murville-maurice, name:bohlen-charles-e, name:johnson-lyndon-b]
  - id: cal.1966-04-12.vietnam
    when: Apr. 12
    date: '1966-04-12'
    thread: vietnam
    c: 'B-52s from Guam bomb North Vietnam for the first time: the Mụ Giạ Pass, on the road into Laos (Check the number of aircraft).'
    n: '[[w.clodfelter-limits-of-air-power]]; [[w.thompson-to-hanoi-and-back]]. See [[cal.1966-03-01.vietnam]].'
  - id: cal.1966-04-13.transportation
    when: Apr. 13
    date: '1966-04-13'
    thread: transportation
    c: 'Uniform Time Act signed, [80 Stat. 107](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg107.pdf): from Apr. 1, 1967, daylight saving time in every zone from the last Sunday in April to the last Sunday in October, unless a State by law keeps standard time throughout; places keeping daylight time in 1966 to use those dates. The Interstate Commerce Commission to enforce it and fix the zones. The House passed it Mar. 16, [292–93](https://voteview.com/rollcall/RH0890223); the conference report Mar. 30, [282–91](https://voteview.com/rollcall/RH0890229).'
    n: '[[w.downing-spring-forward]]; [[w.prerau-seize-the-daylight]].'
  - id: cal.1966-04-18.court
    when: Apr. 18
    date: '1966-04-18'
    thread: court
    c: '*Elfbrandt v. Russell*, [384 U.S. 11](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384011/usrep384011.pdf): Arizona''s loyalty oath for public employees, with perjury for knowing membership in the Communist Party, void; membership without the specific intent to further its unlawful aims may not be punished. Douglas for the Court, 5–4; White, Clark, Harlan, Stewart dissent.'
    n: '[[w.powe-warren-court-and-american]]. See [[cal.1965-11-15.court]]. Names: Douglas, White, Clark, Harlan, Stewart (K–J Cong. III.G).'
    tags: [name:douglas-william-o, name:white-byron-r, name:clark-tom-c, name:harlan-john-marshall, name:stewart-potter]
  - id: cal.1966-04-20.court
    when: Apr. 20
    date: '1966-04-20'
    thread: court
    c: 'Dirksen''s apportionment amendment, the second time: S.J. Res. 103, one house of a State legislature to be apportioned on population, geography, and political subdivisions. The Senate, [55–38](https://voteview.com/rollcall/RS0890289), seven short of two-thirds.'
    n: '[112 Cong. Rec., Senate, Apr. 20, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt7/pdf/GPO-CRECB-1966-pt7-2-2.pdf). The amendment (Opp. II.H.2). [[w.macneil-dirksen]]; [[w.hulsey-everett-dirksen-and-his]]; [[w.dixon-democratic-representation]]. See [[cal.1965-08-04.court]]. Names: Dirksen (Opp. III.A).'
    tags: [name:dirksen-everett]
  - id: cal.1966-04-21.vietnam
    when: Apr. 21
    date: '1966-04-21'
    thread: vietnam
    c: 'Fulbright at the Johns Hopkins School of Advanced International Studies, the first of three Christian A. Herter lectures: the "arrogance of power," great nations taking power for virtue; the United States showing the signs. The others Apr. 27 and 28 (Check). Published as *The Arrogance of Power*.'
    n: '[[w.fulbright-arrogance-of-power]]. See [[cal.1966-02-04.vietnam]]. Names: Fulbright (Viet. III.E).'
    tags: [name:fulbright-j-william]
  - id: cal.1966-04-24.vietnam
    when: Apr. 24
    date: '1966-04-24'
    thread: vietnam
    c: 'Rusk to Johnson, with the report of Ball''s working group on the basic choices: A, go on as now; B, go on, perhaps sending American troops more slowly and encouraging Saigon''s contacts with the Viet Cong; C, cut losses, on the premise of a collapse in Saigon. Rusk and McNamara against C; Rusk for A, and for probing the Viet Cong for divisions.'
    n: 'FRUS 1964–68, IV, doc. [126](https://history.state.gov/historicaldocuments/frus1964-68v04/d126). Made public: FRUS 1964–68, IV (1998). [[w.dileo-george-ball-vietnam-and]]; [[w.bill-george-ball]]; [[w.barrett-uncertain-warriors]]. See [[cal.1966-04-02.vietnam]]. Names: Rusk, McNamara (Viet. III.A); Ball (K–J Adm. III.E).'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:johnson-lyndon-b]
  - id: cal.1966-04-27.civil-rights-the-executive
    when: Apr. 27
    date: '1966-04-27'
    thread: civil-rights-the-executive
    also: [jobs-and-wages]
    c: 'The House passes the Equal Employment Opportunity Act of 1966, H.R. 10065, [300–93](https://voteview.com/rollcall/RH0890243): enforcement power for the Equal Employment Opportunity Commission, cease-and-desist orders, and wider coverage (Check).'
    n: '[[w.graham-civil-rights-era]]. See [[cal.1965-09-24.civil-rights-the-executive]].'
  - id: cal.1966-04-28.open-housing
    when: Apr. 28
    date: '1966-04-28'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: 'Message on civil rights. The first federal law against discrimination in the sale and rental of housing, by owners, brokers, and lenders. Federal crimes for violence against those exercising their rights: voting, schooling, housing, work, jury service, travel. Juries in federal and State courts chosen without discrimination. The Attorney General to sue against segregated schools and public facilities without waiting for a complaint. Enforcement power for the Equal Employment Opportunity Commission. 100 more FBI agents.'
    n: '[Special Message to the Congress Proposing Further Legislation To Strengthen Civil Rights](https://www.presidency.ucsb.edu/documents/special-message-the-congress-proposing-further-legislation-strengthen-civil-rights) (Apr. 28, 1966). [[w.graham-civil-rights-era]]; [[w.kotz-judgment-days]]; [[w.bonastia-knocking-on-the-door]]; [[w.mackenzie-liberal-hour]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.dallek-flawed-giant]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
