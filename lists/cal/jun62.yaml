# Cal. XX June 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XX
entries:
  - id: cal.1962-06-05.elections-1962
    when: June 5
    date: '1962-06-05'
    thread: elections-1962
    c: California primary. Nixon beats Joseph Shell, the conservative, for the Republican nomination for governor; Brown unopposed.
    n: 'Rarick, *California Rising* (K–J Cong. II.H). Nixon, *Six Crises* (Opp. II.G.3), published in March. Names: Nixon (Opp. III.E); Brown (K–J Cong. III.F).'
  - id: cal.1962-06-06.defense
    when: June 6
    date: '1962-06-06'
    thread: defense
    c: 'West Point commencement: guerrilla war "a whole new kind of strategy," and an army trained for it.'
    n: Remarks at West Point to the Graduating Class of the U.S. Military Academy (June 6, 1962). Check the title.
  - id: cal.1962-06-11.economy
    when: June 11
    date: '1962-06-11'
    thread: economy
    c: 'Yale commencement: the myths of the budget, the debt, and business confidence.'
    n: Recording (K–J Adm. II.I).
  - id: cal.1962-06-16.defense
    when: June 16
    date: '1962-06-16'
    thread: defense
    c: McNamara at Ann Arbor. In a nuclear war, strike the enemy's forces and spare the cities. The French and the British hear an attack on their own deterrents.
    n: Kaplan; Ball (K–J Adm. II.D).
  - id: cal.1962-06-21.program
    when: June 21
    date: '1962-06-21'
    thread: program
    c: The House defeats the administration's farm bill, with its mandatory controls on wheat and feed grains, 215–205. Check the vote.
    n: 'See [[cal.1961-03-22.program]]. Names: Freeman (K–J Adm. III.G).'
  - id: cal.1962-06-23.laos
    when: June 23
    date: '1962-06-23'
    thread: laos
    c: Souvanna Phouma's coalition government formed, with Souphanouvong and Phoumi.
    n: 'See [[cal.1961-03-23.laos]]. Names: Souvanna Phouma, Souphanouvong, Phoumi Nosavan (Viet. III.I).'
  - id: cal.1962-06-25.court
    when: June 25
    date: '1962-06-25'
    thread: court
    c: '*Engel v. Vitale*, 370 U.S. 421. The Regents'' prayer struck from New York''s schools, 6–1, Stewart dissenting. The loudest outcry in Congress since *Brown*.'
    n: (K–J Cong. II.J.1; Opp. II.H.1). Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1961-01-23.court]].
  - id: cal.1962-06-25.mississippi
    when: June 25
    date: '1962-06-25'
    thread: mississippi
    c: The Fifth Circuit, Judge Wisdom writing, finds Meredith was refused because of his race and orders him admitted. Judge Cameron's stays follow.
    n: '*Meredith v. Fair* (K–J Adm. II.H.1). Doyle, *An American Insurrection* (K–J Adm. II.C). Names: Wisdom, Cameron (K–J Cong. III.G).'
  - id: cal.1962-06-28.trade
    when: June 28
    date: '1962-06-28'
    thread: trade
    c: The House passes the trade bill, 298–125. Check the vote.
    n: 'See [[cal.1962-01-25.trade]]. Names: Mills (K–J Cong. III.D).'
  - id: cal.1962-06-29.latin-america
    when: June 29–July 1
    date: '1962-06-29'
    thread: latin-america
    c: Kennedy in Mexico City. A million people on the streets; López Mateos's welcome.
    n: FRUS vol. 12. Check.
