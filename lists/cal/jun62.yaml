  - id: cal.1962-06-19.legislatures-ok
    when: June 19–Aug. 3
    date: '1962-06-19'
    thread: legislatures
    c: 'Oklahoma City. A three-judge court declares Oklahoma''s legislative apportionment laws, and the constitution''s provisions under which they stand, void for future elections; the November 1962 election excepted. Aug. 3: standards for the Legislature, meeting in January, to reapportion by; failing that, the court to do it.'
    n: '*Moss v. Burkhart*, [207 F. Supp. 885](https://static.case.law/f-supp/207/html/0885-01.html) (W.D. Okla. 1962) (the opinion, the decree of June 19 and the order of Aug. 3). [[w.dixon-democratic-representation]]; [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1962-03-26.court]]; [[cal.1960-09-20.state-constitutions-ok]].'
    tags: [state:ok]
