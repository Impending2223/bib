# Cal. IV March 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: IV
entries:
  - id: cal.1960-03.economy
    when: Mar.
    date: 1960-03
    thread: economy
    c: Arthur F. Burns warns Nixon of a dip before the election, its low in October, unless credit is eased and defense spending raised soon. Nixon takes it to the cabinet. No action.
    n: 'Made public: Nixon, *Six Crises* (1962). [[w.nixon-six-crises]]; [[w.morgan-eisenhower-versus-the-spenders]]; [[w.stein-fiscal-revolution-in-america]]; [[w.white-making-of-the-president]]. Names: Burns, Nixon.'
    tags: [name:burns-arthur-f, name:nixon-richard-m]
  - id: cal.1960-03.elections-1960
    when: Mar.
    date: 1960-03
    thread: elections-1960
    c: The Wisconsin campaign. Kennedy and Humphrey across the State to Apr. 5; Kennedy's family and staff in every district, Humphrey by bus. Drew and Leacock film both.
    n: '[[w.primary]]. [[w.white-making-of-the-president]]; [[w.humphrey-education-of-a-public-1976]]; [[w.solberg-hubert-humphrey]]; [[w.odonnell-johnny-we-hardly-knew]]; [[w.sorensen-kennedy]]; [[w.dallek-unfinished-life]]; [[w.kallina-kennedy-v-nixon]]; [[w.pietrusza-1960]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.rorabaugh-real-making-of-the]]. Names: Kennedy, Humphrey, Drew, Leacock.'
    tags: [name:kennedy-john-f, name:humphrey-hubert-h, name:drew-robert, name:leacock-richard]
  - id: cal.1960-03-02.latin-america-trip
    when: Mar. 2–3
    date: '1960-03-02'
    thread: latin-america-trip
    c: 'Uruguay: in Montevideo, police tear gas against students on the route, Mar. 2; the address to the Congress. The Declaration of Montevideo, Mar. 3. Home by Puerto Rico, Mar. 7.'
    n: '[Address Before a Joint Session of the National Congress of Uruguay](https://www.presidency.ucsb.edu/documents/address-before-joint-session-the-national-congress-uruguay) (Mar. 2, 1960); [The Declaration of Montevideo](https://www.presidency.ucsb.edu/documents/the-declaration-montevideo-joint-declaration-the-president-and-the-national-council) (Mar. 3). Check: Montevideo. See [[cal.1960-02-23.latin-america]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-03-02.crime-and-hijacking-chessman
    when: Mar. 2
    date: '1960-03-02'
    thread: crime-and-hijacking-chessman
    also: [states-and-cities]
    c: The California Legislature in special session, on Brown's proclamation. His message asks it to abolish the death penalty.
    n: '[*Journal of the Senate*, 1960 Second Extraordinary Session, 2–6](https://archive.org/details/jour1960cali/page/n833) (the proclamation and message). See [[cal.1960-02-19.crime-and-hijacking-ca]]. Names: Brown.'
    tags: [state:ca, name:brown-edmund-g]
  - id: cal.1960-03-04.cuba
    when: Mar. 4–5
    date: '1960-03-04'
    thread: cuba
    c: 'The French freighter *La Coubre*, unloading Belgian munitions in Havana harbor, explodes; a second blast among the rescuers. At least 75 dead. Castro at the funeral, Mar. 5: the United States to blame; "Patria o muerte."'
    n: 'Check the count of the dead. [[w.paterson-contesting-castro]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.rabe-eisenhower-and-latin-america]]. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1960-03-07.court
    when: Mar. 7
    date: '1960-03-07'
    thread: court
    c: '*Talley v. California*, [362 U.S. 60](https://tile.loc.gov/storage-services/service/ll/usrep/usrep362/usrep362060/usrep362060.pdf). Los Angeles''s ban on handbills not naming their authors void on its face, 6–3.'
    n: 'The Court''s 1960 decisions: [[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]].'
  - id: cal.1960-03-07.vietnam
    when: Mar. 7
    date: '1960-03-07'
    thread: vietnam
    c: 'Durbrow sends the Country Team''s report: internal security again the Saigon government''s first problem. Viet Cong ambushes and killings rising since September; the attack near Tây Ninh, Jan. 26; apathy and discontent in the countryside.'
    n: 'FRUS 1958–60, I, doc. [112](https://history.state.gov/historicaldocuments/frus1958-60v01/d112). Made public: [[w.def-u-s-viet-rels]], Book 10 (1971). [[w.spector-united-states-army-in]]; [[w.jacobs-cold-war-mandarin]]; [[w.catton-diems-final-failure]]; [[w.miller-misalliance]]; [[w.chapman-cauldron-of-resistance]]. Names: Durbrow.'
    tags: [name:durbrow-elbridge]
  - id: cal.1960-03-08.cuba
    when: Mar. 8
    date: '1960-03-08'
    thread: cuba
    c: 'The Embassy''s Country Team at Havana: no satisfactory relations while Castro rules. The NSC Planning Board the same day.'
    n: 'FRUS 1958–60, VI, docs. [470](https://history.state.gov/historicaldocuments/frus1958-60v06/d470), [471](https://history.state.gov/historicaldocuments/frus1958-60v06/d471) (Braddock), [472](https://history.state.gov/historicaldocuments/frus1958-60v06/d472) (the Planning Board). See [[cal.1960-03-04.cuba]]. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1960-03-08.latin-america
    when: Mar. 8
    date: '1960-03-08'
    thread: latin-america-trip
    c: Eisenhower reports on the South American trip, on radio and television.
    n: '[Radio and Television Report to the American People on the South American Trip](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-south-american-trip) (Mar. 8, 1960). See [[cal.1960-02-23.latin-america]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-03-08.voting-rights
    when: Mar. 8–10
    date: '1960-03-08'
    thread: voting-rights
    c: 'Johnson ends the Senate''s round-the-clock sessions, Mar. 8. Mar. 10: cloture on the Douglas–Javits motion refused, [42–53](https://voteview.com/rollcall/RS0860249). Case''s amendment, letting the Attorney General sue to protect any civil right, tabled, [55–38](https://voteview.com/rollcall/RS0860250). The House takes up its bill, H.R. 8601, under an open rule, [314–93](https://voteview.com/rollcall/RH0860098).'
    n: 'See [[cal.1960-02-15.voting-rights]]. Names: Johnson, Douglas, Javits, Francis Case.'
    tags: [name:johnson-lyndon-b, name:douglas-paul-h, name:javits-jacob-k, name:case-francis-h]
  - id: cal.1960-03-08.elections-1960
    when: Mar. 8
    date: '1960-03-08'
    thread: elections-1960
    c: 'New Hampshire primary. Republican: Nixon 89.3 percent, others 4.0. Democratic: Kennedy 85.2 percent, others 14.8.'
    n: 'N.H. *Manual for the General Court*, no. 37 (1961), pp. [284](https://archive.org/details/manualforgeneral37newh/page/n313), [382](https://archive.org/details/manualforgeneral37newh/page/n413). CQ Guide 6th (2010) 404. [[w.white-making-of-the-president]]. Names: Kennedy, Nixon.'
    tags: [primary:1960-03-08, name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1960-03-08.specials
    when: Mar. 8
    date: '1960-03-08'
    thread: specials
    c: New York 23d, special, in the Bronx. Jacob H. Gilbert (D) holds the seat, 82.4 percent.
    n: 'Shares: Wikipedia. Bibliography: [[cal.1961-04-04.states-and-cities]]. Names: Gilbert.'
    tags: [ok:thread-first, special:1960-03-08-h-NY-23, name:gilbert-jacob-h]
  - id: cal.1960-03-09.sit-ins
    when: Mar. 9
    date: '1960-03-09'
    thread: sit-ins
    c: Atlanta's college students publish "An Appeal for Human Rights" in the city's papers.
    n: Committee on Appeal for Human Rights, ["An Appeal for Human Rights"](https://www.crmvet.org/docs/aa4hr.htm) (Mar. 9, 1960). See [[cal.1960-02-01.sit-ins]].
  - id: cal.1960-03-10.crime-and-hijacking-chessman
    when: Mar. 10
    date: '1960-03-10'
    thread: crime-and-hijacking-chessman
    also: [states-and-cities]
    c: The State Senate's Judiciary Committee holds the abolition bill, 8–7 (Check the date and the vote). The special session adjourns.
    n: '[*Journal of the Senate*, 1960 Second Extraordinary Session, 15–17](https://archive.org/details/jour1960cali/page/n846) (adjournment). See [[cal.1960-02-19.crime-and-hijacking-ca]].'
    tags: [state:ca]
  - id: cal.1960-03-10.middle-east
    when: Mar. 10
    date: '1960-03-10'
    thread: middle-east
    c: 'Ben Gurion in Washington, Mar. 9–13; with Eisenhower, Mar. 10. He asks for anti-aircraft missiles and early-warning equipment. Eisenhower: the United States stays out of the region''s arms race; France, Britain and West Germany can better supply Israel.'
    n: 'FRUS 1958–60, XIII, docs. [131](https://history.state.gov/historicaldocuments/frus1958-60v13/d131), [132](https://history.state.gov/historicaldocuments/frus1958-60v13/d132), [137](https://history.state.gov/historicaldocuments/frus1958-60v13/d137). [[w.alteras-eisenhower-and-israel]]; [[w.ben-zvi-decade-of-transition]]; [[w.little-american-orientalism]]; [[w.hahn-caught-in-the-middle]]. Names: Ben Gurion, Eisenhower.'
    tags: [name:ben-gurion-david, name:eisenhower-dwight-d]
  - id: cal.1960-03-15.berlin-and-vienna
    when: Mar. 15
    date: '1960-03-15'
    thread: berlin-and-vienna
    c: Adenauer at the White House, with Brentano, before the summit. Joint statement. West Berliners' freedom and self-determination to underlie any agreement on the city; reunification in peace and freedom.
    n: '[Joint Statement Following Discussions With Chancellor Adenauer](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-chancellor-adenauer-1) (Mar. 15, 1960). FRUS 1958–60, IX, docs. [90](https://history.state.gov/historicaldocuments/frus1958-60v09/d90), [91](https://history.state.gov/historicaldocuments/frus1958-60v09/d91), [92](https://history.state.gov/historicaldocuments/frus1958-60v09/d92), [93](https://history.state.gov/historicaldocuments/frus1958-60v09/d93). [[w.trachtenberg-constructed-peace]]; [[w.harrison-driving-the-soviets-up]]; [[w.adenauer-erinnerungen-1959-1963]]; [[w.eisenhower-white-house-years]]. Names: Adenauer, Brentano, Eisenhower.'
    tags: [name:adenauer-konrad, name:brentano-heinrich-von, name:eisenhower-dwight-d]
  - id: cal.1960-03-15.testing
    when: Mar. 15
    date: '1960-03-15'
    thread: testing
    c: 'Ten-Nation Disarmament Committee opens at Geneva: five NATO, five Warsaw Pact. Eaton for the United States.'
    n: '[Letter to Frederick M. Eaton](https://www.presidency.ucsb.edu/documents/letter-frederick-m-eaton-us-representative-the-ten-nation-disarmament-conference-geneva) (Mar. 12, 1960). [[w.divine-blowing-on-the-wind]]; [[w.jacobson-diplomats-scientists-and-politicians]]; [[w.kistiakowsky-scientist-at-the-white]]; [[w.hitchcock-age-of-eisenhower]]. Names: Eaton.'
    tags: [name:eaton-frederick-m]
  - id: cal.1960-03-15.japan-and-korea
    when: Mar. 15
    date: '1960-03-15'
    thread: japan-and-korea-rhee
    c: South Korea's presidential election. Rhee re-elected, the opposition's candidate, Cho Pyong-ok, having died in February; Yi Ki-pung Vice President over Chang Myon, by a count the Embassy and the CIA report coerced and fraudulent. The Democrats withdraw that day. At Masan, police fire on demonstrators.
    n: 'FRUS 1958–60, XVIII, docs. [289](https://history.state.gov/historicaldocuments/frus1958-60v18/d289), [290](https://history.state.gov/historicaldocuments/frus1958-60v18/d290), [292](https://history.state.gov/historicaldocuments/frus1958-60v18/d292), [293](https://history.state.gov/historicaldocuments/frus1958-60v18/d293) (Dulles to the NSC, Mar. 17). [[w.kim-fall-of-syngman-rhee]]; [[w.brazinsky-nation-building-in-south]]. Names: Rhee, Cho Pyong-ok, Yi Ki-pung, Chang.'
    tags: [name:rhee-syngman, name:cho-pyong-ok, name:yi-ki-pung, name:chang-myon]
  - id: cal.1960-03-15.sit-ins
    when: Mar. 15
    date: '1960-03-15'
    thread: sit-ins
    c: 'Atlanta''s students sit in at public cafeterias; arrests. Orangeburg, S.C.: students of Claflin and South Carolina State march from the campuses; fire hoses and tear gas; nearly four hundred arrested, many held in an open stockade.'
    n: Check the count of arrests. See [[cal.1960-03-09.sit-ins]].
  - id: cal.1960-03-15.legislatures
    when: Mar. 15
    date: '1960-03-15'
    thread: legislatures
    c: 'Proclamation 3337, the Eighteenth Decennial Census: the count to begin Apr. 1. Every person over eighteen bound by law to answer, under penalty; the answers not to be used for taxation, investigation or regulation. The census to apportion the House.'
    n: '[Proclamation 3337—Eighteenth Decennial Census](https://www.presidency.ucsb.edu/documents/proclamation-3337-eighteenth-decennial-census) (Mar. 15, 1960). [[w.anderson-american-census]]; [[w.balinski-fair-representation]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-03-16.sit-ins
    when: Mar. 16
    date: '1960-03-16'
    thread: sit-ins
    c: 'Eisenhower, asked of the lunch-counter demonstrations: "deeply sympathetic with the efforts of any group to enjoy the rights . . . of equality"; violence deplored. Whether Negroes have a right to be served at a counter: "not lawyer enough or wise enough" to say.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-217) (Mar. 16, 1960). [[w.burk-eisenhower-administration-and-black]]; [[w.nichols-matter-of-justice]]. See [[cal.1960-02-01.sit-ins]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-03-17.cuba
    when: Mar. 17
    date: '1960-03-17'
    thread: cuba
    c: Eisenhower approves "A Program of Covert Action Against the Castro Regime," from the 5412 Committee. An exile opposition; radio from Swan Island; a network inside Cuba; a paramilitary force trained outside, eight months to form. No more than two or three Americans in touch with the groups. Nixon, Herter, Dulles, Bissell present. Bonsal to return to Havana.
    n: 'FRUS 1958–60, VI, docs. [481](https://history.state.gov/historicaldocuments/frus1958-60v06/d481) (the paper), [483](https://history.state.gov/historicaldocuments/frus1958-60v06/d483) (the NSC), [484](https://history.state.gov/historicaldocuments/frus1958-60v06/d484) (Bonsal), [486](https://history.state.gov/historicaldocuments/frus1958-60v06/d486) (the meeting, 2:30 p.m.); [474](https://history.state.gov/historicaldocuments/frus1958-60v06/d474) (the NSC, Mar. 10). Made public: in part, *Declassified Documents*, 1985 (FRUS''s source notes); in full, FRUS 1958–60, VI (1991). [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]]; [[w.bissell-reflections-of-a-cold]]; [[w.bohning-castro-obsession]]; [[w.operation-zapata]]; [[w.rasenberger-brilliant-disaster]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.ambrose-eisenhower]]. Names: Eisenhower, Nixon, Herter, Bonsal, Dulles, Bissell, Castro.'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m, name:herter-christian-a, name:dulles-allen-w, name:bissell-richard-m-jr, name:bonsal-philip-w, name:castro-fidel]
  - id: cal.1960-03-17.vietnam
    when: Mar. 17
    date: '1960-03-17'
    thread: vietnam
    c: State and Defense to Saigon. The MAAG to grow from 342 toward 685 by the year's end; the ICC told.
    n: 'FRUS 1958–60, I, docs. [118](https://history.state.gov/historicaldocuments/frus1958-60v01/d118), [126](https://history.state.gov/historicaldocuments/frus1958-60v01/d126) (Defense, Mar. 29: the increase from Apr. 15). See [[cal.1960-03-07.vietnam]].'
  - id: cal.1960-03-17.immigration
    when: Mar. 17
    date: '1960-03-17'
    thread: immigration
    c: Special message on immigration. Double the 154,000 quota immigrants a year; base the quotas on the 1960 census, not 1920's, and the increase on actual immigration since 1924; lift the Asia-Pacific ceiling; parole for refugees.
    n: '[Special Message to the Congress on Immigration](https://www.presidency.ucsb.edu/documents/special-message-the-congress-immigration) (Mar. 17, 1960). [[w.tichenor-dividing-lines]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-03-19.testing
    when: Mar. 19
    date: '1960-03-19'
    thread: testing
    c: 'At the three-power test conference, Geneva: Tsarapkin offers a treaty banning all tests but those underground below seismic magnitude 4.75, those to be suspended by moratorium during joint research.'
    n: 'FRUS 1958–60, III, doc. [247](https://history.state.gov/historicaldocuments/frus1958-60v03/d247) (Eisenhower on the reply, Mar. 23); [microfiche supp., doc. 547](https://history.state.gov/historicaldocuments/frus1958-60v03mSupp/d547) (the principals on the reply, Mar. 22). See [[cal.1960-02-11.testing]]. Names: Tsarapkin.'
    tags: [name:tsarapkin-semen-k, name:eisenhower-dwight-d]
  - id: cal.1960-03-20.sit-ins-fl
    when: Mar. 20
    date: '1960-03-20'
    thread: sit-ins
    also: [desegregation-public-places]
    c: 'Collins, governor of Florida, on statewide radio and television, after sit-ins at Tallahassee and elsewhere: a merchant may lawfully refuse Negroes his lunch counter, but serving them in the rest of the store and refusing them there is morally wrong (Check the date and wording).'
    n: '[[w.wagy-governor-leroy-collins-of]]; [[w.colburn-floridas-gubernatorial-politics-in]]. Names: Collins.'
    tags: [name:collins-leroy, state:fl]
  - id: cal.1960-03-21.africa
    when: Mar. 21–22
    date: '1960-03-21'
    thread: africa
    c: 'Sharpeville, South Africa: police fire on a crowd protesting the pass laws; 69 killed. Lincoln White for the State Department, Mar. 22: the United States deplores the violence and hopes the Africans may obtain redress for legitimate grievances by peaceful means.'
    n: '[[w.lodge-sharpeville]]; [[w.borstelmann-cold-war-and-the]]; [[w.dudziak-cold-war-civil-rights]]. Names: Lincoln White.'
    tags: [name:white-lincoln-p]
  - id: cal.1960-03-21.court
    when: Mar. 21
    date: '1960-03-21'
    thread: court
    c: '*Thompson v. City of Louisville*, [362 U.S. 199](https://tile.loc.gov/storage-services/service/ll/usrep/usrep362/usrep362199/usrep362199.pdf). Convictions for loitering and disorderly conduct on no evidence deny due process. Unanimous.'
    n: See [[cal.1960-03-07.court]].
  - id: cal.1960-03-24.voting-rights
    when: Mar. 23–24
    date: '1960-03-23'
    thread: voting-rights
    c: House adopts the McCulloch–Celler amendment, court-appointed voting referees, the administration's plan, [295–124](https://voteview.com/rollcall/RH0860100), Mar. 23; passes H.R. 8601, [311–109](https://voteview.com/rollcall/RH0860102), Mar. 24. The Senate sends it to Judiciary with orders to report by Mar. 29, [86–5](https://voteview.com/rollcall/RS0860261); Eastland's motion without a time limit refused, [19–72](https://voteview.com/rollcall/RS0860260).
    n: 'See [[cal.1960-02-15.voting-rights]]. Names: McCulloch, Celler, Eastland.'
    tags: [name:mcculloch-william-m, name:celler-emanuel, name:eastland-james-o]
  - id: cal.1960-03-24.africa
    when: Mar. 24
    date: '1960-03-24'
    thread: africa
    c: 'Herter to Pretoria on the statement: no change in basic policy.'
    n: 'FRUS 1958–60, XIV, doc. [345](https://history.state.gov/historicaldocuments/frus1958-60v14/d345) (the Ambassador''s reply, Mar. 25). See [[cal.1960-03-21.africa]]. Names: Herter.'
    tags: [name:herter-christian-a]
  - id: cal.1960-03-24.elections-1960
    when: Mar. 24
    date: '1960-03-24'
    thread: elections-1960
    c: Symington announces for the Democratic nomination. He enters no primaries.
    n: 'Check the date. See [[cal.1960-03-08.elections-1960]]. Names: Symington.'
    tags: [name:symington-william-s]
  - id: cal.1960-03-26.desegregation-public-places-las-vegas
    when: Mar. 26
    date: '1960-03-26'
    thread: desegregation-public-places
    also: [states-and-cities]
    c: Las Vegas. With a march on the Strip threatened against the casinos' exclusion of Negroes, Governor Sawyer brings hotel owners, city and State officials and Negro leaders together at the closed Moulin Rouge; McMillan, president of the local NAACP, for the Negroes; Greenspun of the *Las Vegas Sun* mediating. The Strip's hotels and casinos agree to serve Negroes.
    n: '[Wikipedia, "Moulin Rouge Hotel"](https://en.wikipedia.org/wiki/Moulin_Rouge_Hotel); Check: the *Las Vegas Sun* and *Las Vegas Review-Journal*, Mar. 27, 1960. [[w.moehring-resort-city-in-the]]; [[w.sawyer-hang-tough-grant-sawyer]]; [[w.elliott-history-of-nevada]]. Names: Sawyer, Greenspun, McMillan.'
    tags: [state:nv, city:las-vegas, name:sawyer-grant, name:mcmillan-james-b, name:greenspun-hank]
  - id: cal.1960-03-28.testing
    when: Mar. 28–30
    date: '1960-03-28'
    thread: testing
    also: [europe-and-the-alliance]
    c: 'Macmillan at Camp David. Joint declaration, Mar. 29: once a treaty is signed and a joint research program arranged, a voluntary moratorium of agreed duration on tests below magnitude 4.75, by each power''s unilateral declaration. Eisenhower, Mar. 30: his successor free to judge for himself.'
    n: '[Joint Declaration by the President and Prime Minister Macmillan on Nuclear Weapons Tests](https://www.presidency.ucsb.edu/documents/joint-declaration-the-president-and-prime-minister-macmillan-nuclear-weapons-tests) (Mar. 29, 1960); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-232) (Mar. 30, 1960). FRUS 1958–60, III, doc. [251](https://history.state.gov/historicaldocuments/frus1958-60v03/d251); microfiche supp., docs. [552](https://history.state.gov/historicaldocuments/frus1958-60v03mSupp/d552), [555](https://history.state.gov/historicaldocuments/frus1958-60v03mSupp/d555). [[w.macmillan-pointing-the-way-1959]]. See [[cal.1960-03-19.testing]]. Names: Macmillan, Eisenhower.'
    tags: [name:macmillan-harold, name:eisenhower-dwight-d]
  - id: cal.1960-03-28.court
    when: Mar. 28
    date: '1960-03-28'
    thread: court
    c: '*Abel v. United States*, [362 U.S. 217](https://tile.loc.gov/storage-services/service/ll/usrep/usrep362/usrep362217/usrep362217.pdf). Rudolf Abel''s espionage conviction affirmed, 5–4; the search after his arrest on a deportation warrant upheld.'
    n: '[[w.donovan-strangers-on-a-bridge]]. See [[cal.1960-03-07.court]]. Names: Abel.'
    tags: [name:abel-rudolf]
  - id: cal.1960-03-29.king
    when: Mar. 29
    date: '1960-03-29'
    thread: king
    also: [press-and-broadcasting]
    c: '*New York Times*, a full page: "Heed Their Rising Voices," from the Committee to Defend Martin Luther King and the Struggle for Freedom in the South. The students'' protests, Montgomery''s police, King''s arrests. Some details wrong.'
    n: '*New York Times*, Mar. 29, 1960, p. 25. The suit: *New York Times Co. v. Sullivan*, [376 U.S. 254](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376254/usrep376254.pdf) (1964). [[w.lewis-make-no-law]]; [[w.branch-parting-the-waters]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1960-03-30.africa
    when: Mar. 30
    date: '1960-03-30'
    thread: africa
