    when: Feb. 6
    date: '1961-02-06'
    thread: defense
    c: 'McNamara tells reporters on background there is no missile gap. The story runs; the White House says no conclusion has been reached. Same day: the balance-of-payments message on gold.'
    n: 'The President''s News Conference, [1961 Pub. Papers 66](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=124) (Feb. 8, 1961: the story; the press secretary''s denial; no study concluded). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 299–300 (the missile gap); [[w.poole-joint-chiefs-of-staff]], 36 (the briefing); [[w.mcnamara-in-retrospect]], ch. 1 (the backgrounder, early afternoon, Sylvester''s ground rules: "if there was a gap, it was in our favor," after days with Gilpatric over the air force''s photographs; the *Evening Star* that afternoon, the *Times*'' front page the next morning). Special Message to the Congress on Gold and the Balance of Payments Deficit, [1961 Pub. Papers 57](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=115) (Feb. 6, 1961). [[w.reeves-president-kennedy]], 58–59 (the backgrounder; the story; Salinger''s denial). [[w.sorensen-kennedy]], 407 (the balance-of-payments message). To check: [[w.ball-politics-and-force-levels]]; [[w.kaplan-wizards-of-armageddon]]; [[w.shapley-promise-and-power]]; "Chronology of Two-Year Dispute on ''Missile Gap,''" *New York Times*, Feb. 9, 1961 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 299 nn.12–13); House Armed Services Committee, *Military Posture Briefings*, 87th Cong., 1st sess., 646–47 (cited by [[w.poole-joint-chiefs-of-staff]], 36 n.4); *New York Times*, Feb. 6, 1961 (cited by [[w.reeves-president-kennedy]], 58). Names: McNamara.'
