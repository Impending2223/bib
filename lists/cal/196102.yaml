    tags: [name:wheeler-earle, name:gray-david-w, name:lemnitzer-lyman-l]
  - id: cal.1961-02-01.economy
    when: Feb. 1
    date: '1961-02-01'
    thread: economy
    also: [defense, europe-and-the-alliance]
    c: On Gilpatric's recommendation Kennedy rescinds Eisenhower's directive of Nov. 16, 1960, curtailing dependents abroad; a smaller reduction in their place. Gilpatric also proposes less spending by military and civilian personnel and on contract services, and host countries sharing the costs of joint training facilities.
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 450. See [[cal.1960-11-16.economy]]. Names: Gilpatric, Kennedy, Eisenhower.'
