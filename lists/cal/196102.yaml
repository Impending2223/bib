# Cal. XV February 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XV
entries:
  - id: cal.1961-02-01.opinion
    when: Feb. 1
    date: '1961-02-01'
    thread: opinion
    also: [peace-corps]
    c: 'Gallup, Jan. 12–17: a program sending young men abroad at government expense to give technical help, 71 percent for, 18 against. 66 percent would want a qualified son to go.'
    n: '[[w.gallup-poll]], III, 1704.'
  - id: cal.1961-02-01.civil-rights-organizations
    when: Feb. 1
    date: '1961-02-01'
    thread: civil-rights-organizations
    c: Farmer takes office as national director of CORE, from the NAACP's staff.
    n: '[[w.carson-in-struggle]]; [[w.zinn-sncc]]; [[w.garrow-bearing-the-cross]]; [[w.fairclough-to-redeem-the-soul]]; [[w.payne-ive-got-the-light]]; [[w.dittmer-local-people]], 91; [[w.farmer-lay-bare-the-heart]]; [[w.wilkins-standing-fast]]; [[w.dickerson-militant-mediator]]; [[w.lewis-walking-with-the-wind]]; [[w.forman-making-of-black-revolutionaries]]; [[w.ransby-ella-baker-and-the]]; [[w.demilio-lost-prophet]]; [[w.anderson-philip-randolph]]; [[w.branch-parting-the-waters]]; [[w.branch-pillar-of-fire]]; [[w.branch-at-canaans-edge]]; [[w.meier-core]]; [[w.weiss-whitney-m-young-jr]]; [[w.greenberg-crusaders-in-the-courts]]; [[w.hogan-many-minds-one-heart]]. Film: [[w.eyes-on-the-prize]]. SNCC Digital Gateway (K–J Cong. II.L). Names: Farmer.'
    tags: [name:farmer-james]
  - id: cal.1961-02-02.program
    when: Feb. 2
    date: '1961-02-02'
    thread: jobs-and-wages
    also: [welfare]
    c: Special message on economic recovery and growth. Temporary unemployment benefits, aid to children of the unemployed, minimum wage, area redevelopment, housing, Social Security. No tax cut yet.
    n: 'Special Message to the Congress: Program for Economic Recovery and Growth, [1961 Pub. Papers 41](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=99) (Feb. 2, 1961). [[w.sundquist-politics-and-policy]]; [[w.heller-new-dimensions-of-political]]; [[w.stein-fiscal-revolution-in-america]]; [[w.bernstein-promises-kept]]. CQ Almanac 1961 (K–J Cong. II.L). Names: Heller, Tobin, Gordon.'
    tags: [name:kennedy-john-f, name:heller-walter-w, name:tobin-james, name:gordon-kermit]
    short: Recovery message
    to:
      - welfare
      - cities-and-housing
  - id: cal.1961-02-03.immigration
    when: Feb. 3
    date: '1961-02-03'
    thread: immigration
    also: [cuba]
    c: 'Kennedy on Ribicoff''s report on the Cuban refugees: 66,000 Cubans in the country, at least 32,000 around Miami. Federal money for relief, resettlement elsewhere, jobs, health, schools, the unaccompanied children and surplus food; about $4 million to June 30.'
    n: 'Statement by the President Following a Conference With Secretary Ribicoff on Cuban Refugee Problems, [1961 Pub. Papers 54](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=112) (Feb. 3, 1961). See [[cal.1961-01-27.immigration]]. Names: Kennedy, Ribicoff.'
    tags: [name:kennedy-john-f, name:ribicoff-abraham]
  - id: cal.1961-02-03.cuba
    when: Feb. 3
    date: '1961-02-03'
    thread: cuba-bay-of-pigs
    c: 'The Joint Chiefs to McNamara, JCSM-57-61, on the CIA''s plan for a landing at Trinidad: "a fair chance of ultimate success." Surprise, the air and the logistics critical; the force''s worth judged at second and third hand.'
    n: '[FRUS 1961–63, X, doc. 35](https://history.state.gov/historicaldocuments/frus1961-63v10/d35); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 17. Made public: in part, *Operation Zapata* (1981); FRUS 1961–63, X (1997). See [[cal.1961-01-28.cuba]]. Names: McNamara, Lemnitzer.'
    tags: [name:mcnamara-robert-s, name:lemnitzer-lyman-l]
  - id: cal.1961-02-06.defense
    when: Feb. 6
    date: '1961-02-06'
    thread: defense
    c: 'McNamara tells reporters on background there is no missile gap. The story runs; the White House says no conclusion has been reached. Same day: the balance-of-payments message on gold.'
    n: '[[w.ball-politics-and-force-levels]]; [[w.kaplan-wizards-of-armageddon]]; [[w.shapley-promise-and-power]]; [[w.gavin-gold-dollars-and-power]]; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 299–300; [[w.poole-joint-chiefs-of-staff]], 36. Special Message to the Congress on Gold and the Balance of Payments Deficit, [1961 Pub. Papers 57](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=115) (Feb. 6, 1961). Names: McNamara.'
    tags: [name:mcnamara-robert-s, name:kennedy-john-f]
  - id: cal.1961-02-08.cuba
    when: Feb. 8
    date: '1961-02-08'
    thread: cuba-bay-of-pigs
    c: 'Bissell to Kennedy: the plan for launching the troops from Guatemala; the Chiefs give it a fair chance; no later than Mar. 31. Rusk and Berle: no decision needed now, the United States cast as aggressor. Kennedy asks for alternatives to an invasion. Authorized only: a junta of exile leaders, with a Revolutionary Council behind it.'
    n: '[FRUS 1961–63, X, doc. 40](https://history.state.gov/historicaldocuments/frus1961-63v10/d40) (Bundy); doc. [39](https://history.state.gov/historicaldocuments/frus1961-63v10/d39) (Bundy to Kennedy). Made public: FRUS 1961–63, X (1997). See [[cal.1961-01-28.cuba]]. Names: Bissell, Kennedy, Rusk, Berle.'
    tags: [name:bissell-richard-m-jr, name:kennedy-john-f, name:rusk-dean, name:berle-adolf-a, name:bundy-mcgeorge]
  - id: cal.1961-02-09.medicare
    when: Feb. 9
    date: '1961-02-09'
    thread: medicare
    c: 'Health message: hospital insurance for the aged through Social Security. King–Anderson bill introduced soon after. Dead for the session.'
    n: 'Special Message to the Congress on Health and Hospital Care, [1961 Pub. Papers 77](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=135) (Feb. 9, 1961). [[w.marmor-politics-of-medicare]]; [[w.harris-sacred-trust]]; [[w.berkowitz-mr-social-security]]; [[w.anderson-outsider-in-the-senate]]; [[w.blumenthal-heart-of-power]]. King–Anderson bill: H.R. 4222 and S. 909, 87th Cong., introduced Feb. 13. Gallup, May 17–22, 1961: 67 percent for raising the Social Security tax to pay for medical insurance for the aged (*The Gallup Poll*, III, 1721, K–J Cong. II.E). The release: [[cal.1961-06-09.opinion]]. Names: Cohen, Anderson, Mills, King.'
    tags: [name:king-cecil-r, name:anderson-clinton-p, name:kennedy-john-f, name:cohen-wilbur-j, name:mills-wilbur-d]
  - id: cal.1961-02-09.civil-rights-the-executive
    when: Feb. 9
    date: '1961-02-09'
    thread: civil-rights-the-executive
    c: Senate confirms Robert C. Weaver as Housing and Home Finance administrator over southern objection.
    n: '[107 Cong. Rec., Senate, Feb. 9, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-6-1.pdf). [[w.pritchett-robert-clifton-weaver-and]]. Names: Weaver.'
    tags: [name:weaver-robert-c]
  - id: cal.1961-02-10.opinion
    when: Feb. 10–15
    date: '1961-02-10'
    thread: opinion
    c: 'Gallup''s first reading: 72 percent approve, 6 disapprove, 22 no opinion.'
    n: '[[w.gallup-poll]], III, 1707 (released Mar. 1, 1961). American Presidency Project approval tables (K–J Adm. II.K). Roper Center iPoll for question wording and field dates (K–J Cong. II.L). [[w.mueller-presidential-popularity-from-truman]]; [[w.kernell-explaining-presidential-popularity]]; [[w.brody-assessing-the-president]]. Kennedy''s own polling: [[w.jacobs-issues-candidate-image-and]]; [[w.jacobs-rise-of-presidential-polling]]. Names: Gallup, Harris.'
    tags: [name:kennedy-john-f, name:gallup-george-h, name:harris-louis]
  - id: cal.1961-02-10.opinion-2
    when: Feb. 10
    date: '1961-02-10'
    thread: opinion
    also: [defense]
    c: 'Gallup, Jan. 12–17: which country ahead in long-range missiles. The United States 49 percent, Russia 30.'
    n: '[[w.gallup-poll]], III, 1705.'
  - id: cal.1961-02-11.soviet-union
    when: Feb. 11–13
    date: '1961-02-11'
    thread: soviet-union
    c: 'Cabinet Room, on the thinking of the Soviet leadership: Kennedy, Johnson and Rusk with Thompson, home for consultation, Harriman, Bohlen and Kennan. Khrushchev strong at home, agriculture his weakness; he wants a quiet time abroad and progress on disarmament; Berlin not brought to a boil unless talks break down. Feb. 13, Thompson before the Foreign Relations Committee in executive session.'
    n: 'FRUS 1961–63, V, docs. [26](https://history.state.gov/historicaldocuments/frus1961-63v05/d26) (Bundy''s notes), [27](https://history.state.gov/historicaldocuments/frus1961-63v05/d27). [[w.bohlen-witness-to-history-1929]]. See [[cal.1961-01-20.soviet-union]]. Names: Johnson, Rusk, Thompson, Harriman, Bohlen, Kennan, Khrushchev.'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f, name:johnson-lyndon-b, name:rusk-dean, name:thompson-llewellyn-e, name:harriman-w-averell, name:bohlen-charles-e, name:kennan-george-f]
  - id: cal.1961-02-11.cuba
    when: Feb. 11
    date: '1961-02-11'
    thread: cuba-bay-of-pigs
    c: 'Schlesinger to Kennedy: the case for "a drastic decision" holds only looking at Cuba alone. However disguised, it will be ascribed to the United States; the new administration''s first dramatic initiative abroad.'
    n: '[FRUS 1961–63, X, doc. 43](https://history.state.gov/historicaldocuments/frus1961-63v10/d43). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]]. See [[cal.1961-01-28.cuba]]. Names: Schlesinger, Kennedy. Check: an earlier release.'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f]
  - id: cal.1961-02-12.opinion
    when: Feb. 12
    date: '1961-02-12'
    thread: opinion
    also: [desegregation-schools, desegregation-public-places]
    c: 'Gallup, Jan. 12–17, in the South: will whites and Negroes one day share the same schools, restaurants, and public accommodations? 76 percent yes, 19 no.'
    n: '[[w.gallup-poll]], III, 1705.'
  - id: cal.1961-02-13.congo
    when: Feb. 13
    date: '1961-02-13'
    thread: congo
    c: 'Katanga announces Lumumba''s death. Feb. 15: demonstrators break up the Security Council during Stevenson''s first speech there.'
    n: '[[w.kalb-congo-cables]]. [FRUS vol. 20](https://history.state.gov/historicaldocuments/frus1961-63v20). S. Rep. No. 94-465 (K–J Adm. II.H.3) on the CIA''s earlier plot. [[w.witte-de-moord-op-lumumba]]; translated as *The Assassination of Lumumba* (2001); it led to the Belgian parliamentary inquiry of 2000–01. [[w.martin-adlai-stevenson-and-the]]. Names: Lumumba, Stevenson.'
    tags: [name:stevenson-adlai-e, name:lumumba-patrice]
  - id: cal.1961-02-14.state-and-city-finance-wv
    when: Feb. 14
    date: '1961-02-14'
    thread: state-and-city-finance
    c: 'West Virginia''s personal income tax. Barron signs S. 106, passed Feb. 10: a tax of 6 percent of the taxpayer''s federal income tax, on the federal definitions of income, from the year 1961. The same session: an added one-cent consumers sales tax, to Aug. 31 (S. 3).'
    n: '*West Virginia Blue Book*, 1961, [p. 247](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1961.pdf#page=257); 1964, [p. 928](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=938) (W. Va. Code ch. 11, art. 21; "a conformity statute"). [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Barron.'
    tags: [state:wv, name:barron-w-w]
  - id: cal.1961-02-18.transition-and-staff
    when: Feb. 18
    date: '1961-02-18'
    thread: transition-and-staff
    c: Executive order abolishes Eisenhower's Operations Coordinating Board. National security policy moves into Bundy's small staff.
    n: '[Exec. Order No. 10,920](https://www.presidency.ucsb.edu/documents/executive-order-10920-revoking-executive-order-no-10700-february-25-1957-amended), [26 Fed. Reg. 1463](https://www.govinfo.gov/app/details/FR-1961-02-21) (Feb. 18, 1961). [[w.preston-war-council]]; [[w.bird-color-of-truth]]. [FRUS vol. 25](https://history.state.gov/historicaldocuments/frus1961-63v25). Names: Bundy, Rostow, Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:bundy-mcgeorge, name:kennedy-john-f, name:rostow-walt-w]
  - id: cal.1961-02-18.cuba
    when: Feb. 18
    date: '1961-02-18'
    thread: cuba-bay-of-pigs
    c: 'The White House. Bundy passes Kennedy the case for the landing, Bissell''s, and the case against, Mann''s. Rusk: better to wait and build OAS support; Berle: not by Mar. 31. Kennedy asks whether a speech, or the Soviet jets and rockets in Cuba, could prepare the ground.'
    n: 'FRUS 1961–63, X, docs. [47](https://history.state.gov/historicaldocuments/frus1961-63v10/d47) (Bundy), [48](https://history.state.gov/historicaldocuments/frus1961-63v10/d48) (Gray''s notes, misdated Feb. 17); [45](https://history.state.gov/historicaldocuments/frus1961-63v10/d45) (Mann, Feb. 15). Made public: FRUS 1961–63, X (1997). See [[cal.1961-01-28.cuba]]. Names: McGeorge Bundy, Kennedy, Bissell, Mann, Rusk, Berle.'
    tags: [name:bundy-mcgeorge, name:kennedy-john-f, name:bissell-richard-m-jr, name:mann-thomas-c, name:rusk-dean, name:berle-adolf-a]
  - id: cal.1961-02-20.school-aid
    when: Feb. 20
    date: '1961-02-20'
    thread: school-aid
    c: 'Education message: grants for school construction and teachers'' salaries, public schools only. Cardinal Spellman and the bishops demand loans for parochial schools.'
    n: 'Special Message to the Congress on Education, [1961 Pub. Papers 107](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=165) (Feb. 20, 1961). [[w.mcandrews-broken-ground]]; [[w.graham-uncertain-triumph]]; [[w.munger-national-politics-and-federal]]. Names: Powell, Delaney, Ribicoff, Spellman.'
    tags: [name:kennedy-john-f, name:spellman-francis, name:powell-adam-clayton-jr, name:delaney-james-j, name:ribicoff-abraham]
  - id: cal.1961-02-20.court
    when: Feb. 20
    date: '1961-02-20'
    thread: court
    c: '*Monroe v. Pape*, [365 U.S. 167](https://tile.loc.gov/storage-services/service/ll/usrep/usrep365/usrep365167/usrep365167.pdf). Section 1983 reaches police who break state law.'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-02-20.economy
    when: Feb. 20
    date: '1961-02-20'
    thread: economy
    c: 'The Federal Reserve announces it will buy longer-term Treasury securities. The end of "bills only" in practice: Operation Twist, short rates held up for the dollar, long rates pressed down for investment.'
    n: 'Federal Open Market Committee, minutes, [Feb. 7](https://www.federalreserve.gov/monetarypolicy/files/fomchistmin19610207.pdf) and [Mar. 7, 1961](https://www.federalreserve.gov/monetarypolicy/files/fomchistmin19610307.pdf). [[w.garbade-after-the-accord]], ch. 19; [[w.swanson-lets-twist-again]]; [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]] (K–J Adm. II.B). Martin''s papers on FRASER (K–J Adm. II.J). Names: Martin, Roosa.'
    tags: [name:martin-william-mcchesney-jr, name:roosa-robert-v]
  - id: cal.1961-02.economy
    when: Feb.
    date: 1961-02
    thread: economy
    c: The recession's trough, as the National Bureau later dated it. Unemployment 6.9 percent in the revised series; the monthly figures printed at the time differ by a few tenths. Consumer prices rose about 1 percent over the whole of 1961. The discount rate stays at 3 percent all year.
    n: NBER business-cycle chronology. FRED for the revised series; *Employment and Earnings* and the *Federal Reserve Bulletin* on FRASER for the contemporary ones (K–J Adm. II.J).
  - id: cal.1961-02.states-and-cities-nyc
    when: Feb.
    date: 1961-02
    thread: states-and-cities
    also: [elections-1961]
    c: New York. Early in the month Wagner calls on DeSapio to step down as leader of the county's Democrats.
    n: 'Check: *New York Times*, Feb. 1961, for the day. See [[cal.1961-01.states-and-cities-nyc]]. Names: Wagner, DeSapio.'
    tags: [state:ny, city:nyc, name:wagner-robert-f-jr, name:desapio-carmine]
  - id: cal.1961-02-21.africa
    when: Feb. 21
    date: '1961-02-21'
    thread: africa
    c: 'Yost gives Mohamed V Kennedy''s letter on Morocco''s acceptance of Soviet jet fighters; the King: nothing to touch the American bases. The ambassador to offer F-86s if Soviet technicians are kept out.'
    n: 'FRUS 1961–63, XXI, docs. [108](https://history.state.gov/historicaldocuments/frus1961-63v21/d108) (Rusk, Feb. 17), [110](https://history.state.gov/historicaldocuments/frus1961-63v21/d110) (Rusk, Feb. 24). [[w.muehlenbeck-betting-on-the-africans]]; [[w.miller-history-of-modern-morocco]]. Made public: FRUS 1961–63, XXI (1995). Names: Mohamed V, Yost.'
    tags: [name:yost-charles-w, name:mohamed-v, name:kennedy-john-f]
  - id: cal.1961-02-22.berlin-and-vienna
    when: Feb. 22
    date: '1961-02-22'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: 'Kennedy to Khrushchev, by letter, drafted at the White House the day before with Rusk, Thompson, Harriman, Bohlen, Kohler and Bundy: more use of diplomatic channels, "not in the sense of negotiations"; a meeting "before too long" for "an informal exchange of views." Thompson to discuss it. Mar. 9, outside Novosibirsk, Thompson gives Khrushchev the letter: early May, Vienna or Stockholm. Khrushchev inclined to agree; Vienna preferred.'
    n: 'FRUS 1961–63, VI, doc. [7](https://history.state.gov/historicaldocuments/frus1961-63v06/d7); V, docs. [41](https://history.state.gov/historicaldocuments/frus1961-63v05/d41), [42](https://history.state.gov/historicaldocuments/frus1961-63v05/d42) (Thompson, Mar. 10). [[w.beschloss-crisis-years]]; [[w.fursenko-khrushchevs-cold-war]]; [[w.thompson-kremlinologist]]. Made public: in part, [[w.claflin-jfk-wants-to-know]], 50–51 (FRUS''s note, which cites it as *The President Wants To Know*); in full, FRUS 1961–63, VI (1996). Names: Khrushchev, Rusk, Thompson, Harriman, Bohlen, Kohler, Bundy.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s, name:rusk-dean, name:thompson-llewellyn-e, name:harriman-w-averell, name:bohlen-charles-e, name:kohler-foy-d, name:bundy-mcgeorge]
  - id: cal.1961-02-23.conservation
    when: Feb. 23
    date: '1961-02-23'
    thread: conservation
    c: Special message on natural resources. A wilderness bill on the lines of S. 174; seashores at Cape Cod, Padre Island and Point Reyes; for water pollution, more for sewage plants, stronger federal enforcement, a unit in the Public Health Service, air pollution too; saline water research doubled; a survey for new parks, forests and seashores. Water use, 300 billion gallons a day, to double by 1980.
    n: Special Message to the Congress on Natural Resources, [1961 Pub. Papers 114](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=172) (Feb. 23, 1961). [[w.smith-john-kennedy-stewart-udall]]; [[w.smith-stewart-l-udall]]; [[w.udall-quiet-crisis]]; [[w.milazzo-unlikely-environmentalists]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-02-25.vietnam
    when: Feb. 25
    date: '1961-02-25'
    thread: vietnam
    c: 'The Politburo, sessions of Jan. 31 and Feb. 25, on the military tasks of 1961–65: peace in the North the first task; in the South armed struggle raised to equal weight with the political, ten to fifteen main-force regiments to be built; the Central Military Party Committee to direct the war there. Hồ Chí Minh to the closing session.'
    n: '[[w.vietnam-victory-in-vietnam]], 74–77, 455 nn.2, 5–7. Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). Names: Hồ Chí Minh.'
    tags: [name:ho-chi-minh]
  - id: cal.1961-02-26.africa
    when: Feb. 26
    date: '1961-02-26'
    thread: africa
    c: Mohamed V dies; Hassan II King of Morocco.
    n: 'FRUS 1961–63, XXI, doc. [111](https://history.state.gov/historicaldocuments/frus1961-63v21/d111). See [[cal.1961-02-21.africa]]. Names: Mohamed V, Hassan II.'
    tags: [name:mohamed-v, name:hassan-ii]
  - id: cal.1961-02-26.opinion
    when: Feb. 26
    date: '1961-02-26'
    thread: opinion
    also: [transition-and-staff]
    c: 'Gallup, Feb. 10–15, on "ask what you can do for your country": 63 percent can think of something they could do, 37 cannot.'
    n: '[[w.gallup-poll]], III, 1707.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-02-28.open-housing-pa
    when: Feb. 28
    date: '1961-02-28'
    thread: open-housing
    c: 'Pennsylvania. Lawrence signs amendments to the Fair Employment Practice Act of 1955: discrimination forbidden in the sale, lease and financing of housing and in places of public accommodation. In force Sept. 1 (Check).'
    n: 'Act of Feb. 28, 1961, P.L. 47 ([Pennsylvania Human Relations Commission, "Policy and Law"](https://www.pa.gov/agencies/phrc/legal-resources/policy-and-law.html)). [[w.sugrue-sweet-land-of-liberty]]; [[w.countryman-up-south]]. Names: Lawrence.'
    tags: [state:pa, name:lawrence-david-l]
