    c: 'Rock Hill, S.C., the anniversary of Greensboro. Ten students arrested at McCrory''s lunch counter; nine take thirty days on the road gang rather than the $100 fine. SNCC, meeting in Atlanta, sends four more to join them in jail: Nash, Ruby Doris Smith, Sherrod and Charles Jones.'
    n: '[[w.branch-parting-the-waters]], 391–93. To check: [[w.meier-core]]; [[w.carson-in-struggle]]; Minutes of SNCC meetings, Feb. 3-5, 1961, Student Nonviolent Coordinating Committee Papers, box 7, King Library and Archives (cited by [[w.branch-parting-the-waters]], 392 n.1); Minutes of SNCC meetings of Feb. 3-5, 1961, A/SN7 (cited by [[w.branch-parting-the-waters]], 392 n.3); [[w.meier-core]], 118–19; [[w.carson-in-struggle]], 32–33 (cited by [[w.branch-parting-the-waters]], 391 n.4). See [[cal.1960-02-01.sit-ins]]. Names: Nash.'
