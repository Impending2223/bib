    when: Feb. 3
    date: '1961-02-03'
    thread: cuba-bay-of-pigs
    c: 'The Joint Chiefs to McNamara, JCSM-57-61, on the CIA''s plan for a landing at Trinidad: "a fair chance of ultimate success." Surprise, the air and the logistics critical; the force''s worth judged at second and third hand.'
    n: '[FRUS 1961–63, X, doc. 35](https://history.state.gov/historicaldocuments/frus1961-63v10/d35); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 17. Made public: in part, *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 49–50; [[w.bissell-reflections-of-a-cold]], 164–65 (the memorandum quoted). See [[cal.1961-01-28.cuba]]. Names: McNamara, Lemnitzer.'
