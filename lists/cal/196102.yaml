  - id: cal.1961-02-23.conservation
    when: Feb. 23
    date: '1961-02-23'
    thread: conservation
    c: Special message on natural resources. A wilderness bill on the lines of S. 174; seashores at Cape Cod, Padre Island and Point Reyes; for water pollution, more for sewage plants, stronger federal enforcement, a unit in the Public Health Service, air pollution too; saline water research doubled; a survey for new parks, forests and seashores. Water use, 300 billion gallons a day, to double by 1980.
    n: 'Special Message to the Congress on Natural Resources, [1961 Pub. Papers 114](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=172) (Feb. 23, 1961). To check: [[w.smith-john-kennedy-stewart-udall]]; [[w.smith-stewart-l-udall]]; [[w.udall-quiet-crisis]]; [[w.milazzo-unlikely-environmentalists]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-02-25.vietnam
    when: Feb. 25
    date: '1961-02-25'
    thread: vietnam
    c: 'The Politburo, sessions of Jan. 31 and Feb. 25, on the military tasks of 1961–65: peace in the North the first task; in the South armed struggle raised to equal weight with the political, ten to fifteen main-force regiments to be built; the Central Military Party Committee to direct the war there. Hồ Chí Minh to the closing session.'
    n: '[[w.vietnam-victory-in-vietnam]], 74–77, 455 nn.2, 5–7; [[w.asselin-hanois-road-to-the]], 92–94 (the session of January; Lê Duẩn''s letter to the South, Feb. 7). To check: the Politburo''s resolution of Feb. 25, 1961 (cited by [[w.vietnam-victory-in-vietnam]], 74 n.2); Hồ Chí Minh''s speech to the session of Feb. 25, 1961 (cited by [[w.vietnam-victory-in-vietnam]], 77 n.7); the Politburo''s instruction of Jan. 24, 1961, *Văn kiện Đảng toàn tập*, 22:153–55 (cited by [[w.asselin-hanois-road-to-the]], 92 n.1). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). Names: Hồ Chí Minh. Check: Asselin, 93, reads the January directive as preparation for war, the political struggle still first; his is the Politburo''s instruction of Jan. 24 (92 n.1).'
