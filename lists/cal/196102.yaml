    when: Feb. 3
    date: '1961-02-03'
    thread: transition-and-staff-nsc
    c: 'Bundy to Rusk: the President wants to keep track of the directives he gives; a series of National Security Action Memoranda begins. "Departments and agencies will always be acting just as fast as they can."'
    n: '[FRUS 1961–63, VIII, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v08/d9). [[w.preston-war-council]], 40–41 (the series). Names: Bundy, Rusk. Check: Preston, 41, puts the words in Bundy to Dulles, Mar. 10, 1961 (n.10, NSF, Bundy Chron., Kennedy Library); FRUS prints them in the letter to Rusk.'
