  - id: cal.1961-02-08.defense
    when: Feb. 8
    date: '1961-02-08'
    thread: defense
    also: [desegregation-schools]
    c: 'News conference, the third. The missile gap: the studies not complete, "it would be premature to reach a judgment as to whether there is a gap or not a gap." New Orleans: "all students should be given the opportunity to attend public schools regardless of their race"; what to do there "a matter which we are carefully considering."'
    n: 'The President''s News Conference of February 8, 1961, [1961 Pub. Papers 66](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=124). [[w.reeves-president-kennedy]], 59, 61. To check: Kennedy to Bundy, Feb. 8, 1961, President''s Office Files, box 62, Kennedy Library (cited by [[w.reeves-president-kennedy]], 59). See [[cal.1961-02-06.defense]]. Names: Kennedy.'
