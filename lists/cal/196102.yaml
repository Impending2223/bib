  - id: cal.1961-02-21.africa
    when: Feb. 21
    date: '1961-02-21'
    thread: africa
    c: 'Yost gives Mohamed V Kennedy''s letter on Morocco''s acceptance of Soviet jet fighters; the King: nothing to touch the American bases. The ambassador to offer F-86s if Soviet technicians are kept out.'
    n: 'FRUS 1961–63, XXI, docs. [108](https://history.state.gov/historicaldocuments/frus1961-63v21/d108) (Rusk, Feb. 17), [110](https://history.state.gov/historicaldocuments/frus1961-63v21/d110) (Rusk, Feb. 24). Made public: FRUS 1961–63, XXI (1995). To check: [[w.muehlenbeck-betting-on-the-africans]]; [[w.miller-history-of-modern-morocco]]. Names: Mohamed V, Yost.'
