  - id: cal.1961-02-04.defense
    when: Feb. 4–5
    date: '1961-02-04'
    thread: defense
    c: 'McNamara at SAC''s headquarters, Omaha: alarmed by the rigidity of the Single Integrated Operational Plan and the civilians'' slight control of the strategic forces; the danger of missiles fired by accident or without the White House''s sanction.'
