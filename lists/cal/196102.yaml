  - id: cal.1961-02-01.robert-kennedy
    when: Feb. 1
    date: '1961-02-01'
    thread: robert-kennedy
    c: 'The FBI''s memoranda on the Attorney General''s attempt, Jan. 31, to use the Justice Department gym, under the Bureau''s control: he wants the sunlamp and a massage; told the masseur is only for agents injured. Rosen to Parsons; Mohr to Malone; Mohr to Edwards. Hoover''s notation on one, repeating his warnings against "horseplay": "No one knows when and where the A.G. will appear."'
