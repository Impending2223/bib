    when: Feb. 3
    date: '1961-02-03'
    thread: immigration
    also: [cuba]
    c: 'Kennedy on Ribicoff''s report on the Cuban refugees: 66,000 Cubans in the country, at least 32,000 around Miami. Federal money for relief, resettlement elsewhere, jobs, health, schools, the unaccompanied children and surplus food; about $4 million to June 30.'
    n: 'Statement by the President Following a Conference With Secretary Ribicoff on Cuban Refugee Problems, [1961 Pub. Papers 54](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=112) (Feb. 3, 1961). See [[cal.1961-01-27.immigration]]. Names: Kennedy, Ribicoff.'
