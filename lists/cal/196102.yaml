        - 'via x.1984.rusk-interviews-with-richard-rusk: A-D'
        - 'w.poole-joint-chiefs-of-staff 257: A, C'
    tags: [name:rusk-dean, name:kennedy-john-f, name:ileo-joseph, name:lumumba-patrice]
  - id: cal.1961-02-01.cuba
    when: Feb. 1
    date: '1961-02-01'
    thread: cuba
    also: [defense]
    c: 'Wheeler, Director of the Joint Staff, reports the military evaluation of Trinidad to Lemnitzer without Gray''s figure for "fair chance": "thirty in favor and seventy against." The Chiefs'' suggestion: an independent evaluation of the force''s combat effectiveness and of the logistics plans by a team of officers.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 177; [[w.poole-joint-chiefs-of-staff]], 109–10 (the working group of J-2 to J-5 and the services formed Feb. 1; Gray''s "thirty in favor and seventy against"). See [[cal.1961-02-03.cuba]]. Names: Wheeler, Gray, Lemnitzer.'
