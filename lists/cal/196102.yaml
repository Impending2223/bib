    when: Feb. 2
    date: '1961-02-02'
    thread: jobs-and-wages
    also: [welfare]
    c: Special message on economic recovery and growth. Temporary unemployment benefits, aid to children of the unemployed, minimum wage, area redevelopment, housing, Social Security. No tax cut yet.
    n: 'Special Message to the Congress: Program for Economic Recovery and Growth, [1961 Pub. Papers 41](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=99) (Feb. 2, 1961). CQ Almanac 1961 (K–J Cong. II.L). [[w.stein-fiscal-revolution-in-america]], 386, 391 (spending first; no tax cut); [[w.sundquist-politics-and-policy]], 35, 126 (the message; aid to children of the unemployed, 126). [[w.sorensen-kennedy]], 397. To check: [[w.heller-new-dimensions-of-political]]; [[w.bernstein-promises-kept]]. Names: Heller, Tobin, Gordon.'
