  - id: cal.1961-02-01.defense
    when: Feb. 1
    date: '1961-02-01'
    thread: defense
    also: [transition-and-staff-nsc]
    c: 'The National Security Council''s first meeting under Kennedy, its 475th. He directs McNamara to examine means of placing more emphasis on counterguerrilla forces. McNamara: five Polaris submarines sooner, fifty more transports, the fiscal 1962 military budget reappraised by Mar. 1.'
    n: 'Record of Actions, [FRUS 1961–63, VIII, doc. 8](https://history.state.gov/historicaldocuments/frus1961-63v08/d8) (Feb. 1, 1961). [[w.schlesinger-robert-kennedy-and-his]], 461 (the direction); [[w.futrell-united-states-air-force]], 63 (Kennedy directs McNamara to expand the counterinsurgency forces); [[w.poole-joint-chiefs-of-staff]], 23 (Kennedy asks McNamara to examine ways of emphasizing counterguerrilla capabilities). To check: Special Group (Counterinsurgency), "Memorandum for the Record ... from January 18, 1962, to November 21, 1963," May 13, 1964, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 461 n.59). Names: Kennedy, McNamara.'
