  - id: cal.1961-02-06.economy-gold
    when: Feb. 6
    date: '1961-02-06'
    thread: economy-gold
    c: Special message on gold and the balance of payments deficit. The basic deficit about $1.5 billion in 1960, the over-all $3.8 billion; the gold reserve $17.5 billion. "The United States official dollar price of gold can and will be maintained at $35 an ounce"; no exchange controls; the drawing rights in the Fund to be used "if and when appropriate"; the Treasury to study how the Fund may be strengthened.
