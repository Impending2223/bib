  - id: cal.1961-02-02.testing
    when: Feb. 2
    date: '1961-02-02'
    thread: testing
    c: 'McCloy circulates a position for the reconvened Geneva test ban conference: an atmospheric ban with a three-year moratorium on underground tests below 4.75 on the Richter scale; seventeen control posts on each side''s soil; twenty on-site inspections a year, ten as a fallback.'
    n: '[[w.poole-joint-chiefs-of-staff]], 93. Names: McCloy.'
    src:
      c: 967771bf
      rows:
        - 'w.poole-joint-chiefs-of-staff 93: all'
