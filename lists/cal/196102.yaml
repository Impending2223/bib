  - id: cal.1961-02-07.cuba
    when: Feb. 7
    date: '1961-02-07'
    thread: cuba-bay-of-pigs
    c: 'Mann''s office, 10 a.m. to 1 p.m., Berle in the chair, with Bissell, Barnes, King, Gray, Goodwin and others. A blockade set aside. No Americans to land; a few contract fliers in the strike. Gray: the force could hold six days and reach the mountains. Mann: once it lands the United States is committed, "would have to underwrite the success of the venture."'
    n: '[FRUS 1961–63, X, doc. 38](https://history.state.gov/historicaldocuments/frus1961-63v10/d38). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 52 (the contract pilots; Mann). See [[cal.1961-01-28.cuba]]. Names: Mann, Berle, Bissell, Barnes, David Gray, Goodwin.'
    src:
      c: f606c851
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d38: all'
        - 'w.jones-bay-of-pigs 52: C-F'
        - 'via w.jones-bay-of-pigs 52 n.18a: C-F'
    tags: [name:mann-thomas-c, name:berle-adolf-a, name:bissell-richard-m-jr, name:barnes-c-tracy, name:king-j-c, name:gray-david-w, name:goodwin-richard-n]
  - id: cal.1961-02-08.cuba
    when: Feb. 8
    date: '1961-02-08'
    thread: cuba-bay-of-pigs
    c: 'Bissell to Kennedy: the plan for launching the troops from Guatemala; the Chiefs give it a fair chance; no later than Mar. 31. Rusk and Berle: no decision needed now, the United States cast as aggressor. Kennedy asks for alternatives to an invasion. Authorized only: a junta of exile leaders, with a Revolutionary Council behind it.'
    n: '[FRUS 1961–63, X, doc. 40](https://history.state.gov/historicaldocuments/frus1961-63v10/d40) (Bundy); doc. [39](https://history.state.gov/historicaldocuments/frus1961-63v10/d39) (Bundy to Kennedy). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 50–52 (Bissell''s case and the fair chance; the President''s want of other courses; the Council); [[w.bissell-reflections-of-a-cold]], 165–66 (Kennedy to Bundy, Feb. 6; Bundy, Feb. 8; the meeting). To check: Bissell, oral history, 4, 6, Kennedy Library; Bundy, memorandum of a meeting with the President, Feb. 9, 1961, National Security Files, box 35A, Kennedy Library (cited by [[w.jones-bay-of-pigs]], 51 n.14). See [[cal.1961-01-28.cuba]]. Names: Bissell, Kennedy, Rusk, Berle.'
