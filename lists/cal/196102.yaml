  - id: cal.1961-02-22.berlin-and-vienna
    when: Feb. 22
    date: '1961-02-22'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: 'Kennedy to Khrushchev, by letter, drafted at the White House the day before with Rusk, Thompson, Harriman, Bohlen, Kohler and Bundy: more use of diplomatic channels, "not in the sense of negotiations"; a meeting "before too long" for "an informal exchange of views." Thompson to discuss it. Mar. 9, outside Novosibirsk, Thompson gives Khrushchev the letter: early May, Vienna or Stockholm. Khrushchev inclined to agree; Vienna preferred.'
    n: 'FRUS 1961–63, VI, doc. [7](https://history.state.gov/historicaldocuments/frus1961-63v06/d7); V, docs. [41](https://history.state.gov/historicaldocuments/frus1961-63v05/d41), [42](https://history.state.gov/historicaldocuments/frus1961-63v05/d42) (Thompson, Mar. 10). [[w.reeves-president-kennedy]], 67–68 (the letter; Thompson to deliver it). Made public: in part, [[w.claflin-jfk-wants-to-know]], 50–51 (FRUS''s note, which cites it as *The President Wants To Know*); in full, FRUS 1961–63, VI (1996). To check: [[w.beschloss-crisis-years]]; [[w.fursenko-khrushchevs-cold-war]]; [[w.thompson-kremlinologist]]. Names: Khrushchev, Rusk, Thompson, Harriman, Bohlen, Kohler, Bundy.'
