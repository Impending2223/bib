  - id: cal.1961-02-01.defense
    when: Feb. 1
    date: '1961-02-01'
    thread: defense
    also: [transition-and-staff-nsc]
    c: 'The National Security Council''s first meeting under Kennedy, its 475th. He directs McNamara to examine means of placing more emphasis on counterguerrilla forces. McNamara: five Polaris submarines sooner, fifty more transports, the fiscal 1962 military budget reappraised by Mar. 1.'
    n: 'Record of Actions, [FRUS 1961–63, VIII, doc. 8](https://history.state.gov/historicaldocuments/frus1961-63v08/d8) (Feb. 1, 1961). [[w.schlesinger-robert-kennedy-and-his]], 461 (the direction). To check: Special Group (Counterinsurgency), "Memorandum for the Record ... from January 18, 1962, to November 21, 1963," May 13, 1964, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 461 n.59). Names: Kennedy, McNamara.'
    src:
      c: 48f0d2ba
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v08/d8: all'
        - 'w.schlesinger-robert-kennedy-and-his 461: A, B'
        - 'via w.schlesinger-robert-kennedy-and-his 461 n.59: B'
    tags: [name:kennedy-john-f, name:mcnamara-robert-s]
  - id: cal.1961-02-02.program
    when: Feb. 2
    date: '1961-02-02'
    thread: jobs-and-wages
    also: [welfare]
    c: Special message on economic recovery and growth. Temporary unemployment benefits, aid to children of the unemployed, minimum wage, area redevelopment, housing, Social Security. No tax cut yet.
    n: 'Special Message to the Congress: Program for Economic Recovery and Growth, [1961 Pub. Papers 41](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=99) (Feb. 2, 1961). CQ Almanac 1961 (K–J Cong. II.L). [[w.stein-fiscal-revolution-in-america]], 386, 391 (spending first; no tax cut). To check: [[w.sundquist-politics-and-policy]]; [[w.heller-new-dimensions-of-political]]; [[w.bernstein-promises-kept]]. Names: Heller, Tobin, Gordon.'
    src:
      c: 00a05913
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=99: all'
        - 'w.stein-fiscal-revolution-in-america 386: A'
        - 'w.stein-fiscal-revolution-in-america 391: A-C'
    tags: [name:kennedy-john-f, name:heller-walter-w, name:tobin-james, name:gordon-kermit]
    short: Recovery message
    to:
      - welfare
      - cities-and-housing
  - id: cal.1961-02-03.immigration
    when: Feb. 3
    date: '1961-02-03'
    thread: immigration
    also: [cuba]
    c: 'Kennedy on Ribicoff''s report on the Cuban refugees: 66,000 Cubans in the country, at least 32,000 around Miami. Federal money for relief, resettlement elsewhere, jobs, health, schools, the unaccompanied children and surplus food; about $4 million to June 30.'
    n: 'Statement by the President Following a Conference With Secretary Ribicoff on Cuban Refugee Problems, [1961 Pub. Papers 54](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=112) (Feb. 3, 1961). See [[cal.1961-01-27.immigration]]. Names: Kennedy, Ribicoff.'
    tags: [name:kennedy-john-f, name:ribicoff-abraham]
  - id: cal.1961-02-03.cuba
    when: Feb. 3
    date: '1961-02-03'
    thread: cuba-bay-of-pigs
    c: 'The Joint Chiefs to McNamara, JCSM-57-61, on the CIA''s plan for a landing at Trinidad: "a fair chance of ultimate success." Surprise, the air and the logistics critical; the force''s worth judged at second and third hand.'
    n: '[FRUS 1961–63, X, doc. 35](https://history.state.gov/historicaldocuments/frus1961-63v10/d35); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 17. Made public: in part, *Operation Zapata* (1981); FRUS 1961–63, X (1997). See [[cal.1961-01-28.cuba]]. Names: McNamara, Lemnitzer.'
    tags: [name:mcnamara-robert-s, name:lemnitzer-lyman-l]
  - id: cal.1961-02-06.defense
    when: Feb. 6
    date: '1961-02-06'
    thread: defense
    c: 'McNamara tells reporters on background there is no missile gap. The story runs; the White House says no conclusion has been reached. Same day: the balance-of-payments message on gold.'
    n: 'The President''s News Conference, [1961 Pub. Papers 66](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=124) (Feb. 8, 1961: the story; the press secretary''s denial; no study concluded). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 299–300 (the missile gap); [[w.poole-joint-chiefs-of-staff]], 36 (the briefing). Special Message to the Congress on Gold and the Balance of Payments Deficit, [1961 Pub. Papers 57](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=115) (Feb. 6, 1961). [[w.reeves-president-kennedy]], 58–59 (the backgrounder; the story; Salinger''s denial). To check: [[w.ball-politics-and-force-levels]]; [[w.kaplan-wizards-of-armageddon]]; [[w.shapley-promise-and-power]]; "Chronology of Two-Year Dispute on ''Missile Gap,''" *New York Times*, Feb. 9, 1961 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 299 nn.12–13); House Armed Services Committee, *Military Posture Briefings*, 87th Cong., 1st sess., 646–47 (cited by [[w.poole-joint-chiefs-of-staff]], 36 n.4); *New York Times*, Feb. 6, 1961 (cited by [[w.reeves-president-kennedy]], 58). Names: McNamara.'
    src:
      c: 03d50a3e
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=124: B-C'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 299–300: A-C'
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=115: D'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 299 n.12: A-B'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 299 n.13a: C'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 299 n.13b: C'
        - 'w.poole-joint-chiefs-of-staff 36: A'
        - 'via w.poole-joint-chiefs-of-staff 36 n.4a: A'
        - 'w.reeves-president-kennedy 58–59: A-C'
        - 'via w.reeves-president-kennedy 58 n.kennedy-defense-study: A-B'
        - 'via w.reeves-president-kennedy 58 n.what-the-hell-is-this: A'
    tags: [name:mcnamara-robert-s, name:kennedy-john-f]
  - id: cal.1961-02-08.cuba
    when: Feb. 8
    date: '1961-02-08'
    thread: cuba-bay-of-pigs
    c: 'Bissell to Kennedy: the plan for launching the troops from Guatemala; the Chiefs give it a fair chance; no later than Mar. 31. Rusk and Berle: no decision needed now, the United States cast as aggressor. Kennedy asks for alternatives to an invasion. Authorized only: a junta of exile leaders, with a Revolutionary Council behind it.'
    n: '[FRUS 1961–63, X, doc. 40](https://history.state.gov/historicaldocuments/frus1961-63v10/d40) (Bundy); doc. [39](https://history.state.gov/historicaldocuments/frus1961-63v10/d39) (Bundy to Kennedy). Made public: FRUS 1961–63, X (1997). See [[cal.1961-01-28.cuba]]. Names: Bissell, Kennedy, Rusk, Berle.'
    tags: [name:bissell-richard-m-jr, name:kennedy-john-f, name:rusk-dean, name:berle-adolf-a, name:bundy-mcgeorge]
  - id: cal.1961-02-09.medicare
    when: Feb. 9
    date: '1961-02-09'
    thread: medicare
    c: 'Health message: hospital insurance for the aged through Social Security. King–Anderson bill introduced soon after. Dead for the session.'
    n: 'Special Message to the Congress on Health and Hospital Care, [1961 Pub. Papers 77](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=135) (Feb. 9, 1961). King–Anderson bill: H.R. 4222 and S. 909, 87th Cong., introduced Feb. 13. Gallup, May 17–22, 1961: 67 percent for raising the Social Security tax to pay for medical insurance for the aged (*The Gallup Poll*, III, 1721, K–J Cong. II.E). The release: [[cal.1961-06-09.opinion]]. To check: [[w.marmor-politics-of-medicare]]; [[w.harris-sacred-trust]]; [[w.berkowitz-mr-social-security]]; [[w.anderson-outsider-in-the-senate]]; [[w.blumenthal-heart-of-power]]. Names: Cohen, Anderson, Mills, King.'
    tags: [name:king-cecil-r, name:anderson-clinton-p, name:kennedy-john-f, name:cohen-wilbur-j, name:mills-wilbur-d]
  - id: cal.1961-02-09.civil-rights-the-executive
    when: Feb. 9
    date: '1961-02-09'
    thread: civil-rights-the-executive
    c: Senate confirms Robert C. Weaver as Housing and Home Finance administrator over southern objection.
    n: '[107 Cong. Rec., Senate, Feb. 9, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-6-1.pdf). To check: [[w.pritchett-robert-clifton-weaver-and]]. Names: Weaver.'
    tags: [name:weaver-robert-c]
  - id: cal.1961-02-10.opinion
    when: Feb. 10–15
    date: '1961-02-10'
    thread: opinion
    c: 'Gallup''s first reading: 72 percent approve, 6 disapprove, 22 no opinion.'
    n: '[[w.gallup-poll]], III, 1707 (released Mar. 1, 1961). American Presidency Project approval tables (K–J Adm. II.K). Roper Center iPoll for question wording and field dates (K–J Cong. II.L). Kennedy''s own polling: [[w.jacobs-issues-candidate-image-and]]. To check: [[w.mueller-presidential-popularity-from-truman]]; [[w.kernell-explaining-presidential-popularity]]; [[w.brody-assessing-the-president]]; [[w.jacobs-rise-of-presidential-polling]]. Names: Gallup, Harris.'
    tags: [name:kennedy-john-f, name:gallup-george-h, name:harris-louis]
  - id: cal.1961-02-10.opinion-2
    when: Feb. 10
    date: '1961-02-10'
    thread: opinion
    also: [defense]
    c: 'Gallup, Jan. 12–17: which country ahead in long-range missiles. The United States 49 percent, Russia 30.'
    n: '[[w.gallup-poll]], III, 1705.'
  - id: cal.1961-02-10.democratic-party
    when: Feb. 10
    date: '1961-02-10'
    thread: democratic-party
    also: [civil-rights-the-executive]
    c: 'The officers of Americans for Democratic Action with Kennedy. Robert Nathan for some $50 billion of deficit spending against the recession; Kennedy: no possibility of "the kind of all-out economic operation that you want." Rauh on civil rights; Kennedy: "Your criticism on civil rights is quite wrong," and names the Negroes in the administration and the voting suits being prepared at Justice. By Rauh''s account.'
    n: '[[w.reeves-president-kennedy]], 63–64. To check: Robert Nathan, oral history, 22–23, Kennedy Library; Joseph Rauh, oral history, 99–104, Kennedy Library (cited by [[w.reeves-president-kennedy]], 63). Names: Rauh, Kennedy.'
    src:
      c: a33171ab
      rows:
        - 'w.reeves-president-kennedy 63–64: all'
        - 'via w.reeves-president-kennedy 63 n.on-februarv-10.a: all'
        - 'via w.reeves-president-kennedy 63 n.on-februarv-10.b: A-C'
        - 'via w.reeves-president-kennedy 63 n.on-februarv-10.c: all'
    tags: [name:rauh-joseph-l-jr, name:kennedy-john-f]
  - id: cal.1961-02-11.soviet-union
    when: Feb. 11–13
    date: '1961-02-11'
    thread: soviet-union
    c: 'Cabinet Room, on the thinking of the Soviet leadership: Kennedy, Johnson and Rusk with Thompson, home for consultation, Harriman, Bohlen and Kennan. Khrushchev strong at home, agriculture his weakness; he wants a quiet time abroad and progress on disarmament; Berlin not brought to a boil unless talks break down. Feb. 13, Thompson before the Foreign Relations Committee in executive session.'
    n: 'FRUS 1961–63, V, docs. [26](https://history.state.gov/historicaldocuments/frus1961-63v05/d26) (Bundy''s notes), [27](https://history.state.gov/historicaldocuments/frus1961-63v05/d27). To check: [[w.bohlen-witness-to-history-1929]]. See [[cal.1961-01-20.soviet-union]]. Names: Johnson, Rusk, Thompson, Harriman, Bohlen, Kennan, Khrushchev.'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f, name:johnson-lyndon-b, name:rusk-dean, name:thompson-llewellyn-e, name:harriman-w-averell, name:bohlen-charles-e, name:kennan-george-f]
  - id: cal.1961-02-11.cuba
    when: Feb. 11
    date: '1961-02-11'
    thread: cuba-bay-of-pigs
    c: 'Schlesinger to Kennedy: the case for "a drastic decision" holds only looking at Cuba alone. However disguised, it will be ascribed to the United States; the new administration''s first dramatic initiative abroad.'
    n: '[FRUS 1961–63, X, doc. 43](https://history.state.gov/historicaldocuments/frus1961-63v10/d43). [[w.schlesinger-thousand-days-1965]], 240 (sent the day before he left for Buenos Aires). Made public, in part: [[w.schlesinger-thousand-days-1965]], 240 (1965); in full, FRUS 1961–63, X (1997). See [[cal.1961-01-28.cuba]]. Names: Schlesinger, Kennedy.'
    src:
      c: 27fcc717
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d43: all'
        - 'w.schlesinger-thousand-days-1965 240: A, C'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f]
  - id: cal.1961-02-12.opinion
    when: Feb. 12
    date: '1961-02-12'
    thread: opinion
    also: [desegregation-schools, desegregation-public-places]
    c: 'Gallup, Jan. 12–17, in the South: will whites and Negroes one day share the same schools, restaurants, and public accommodations? 76 percent yes, 19 no.'
    n: '[[w.gallup-poll]], III, 1705.'
  - id: cal.1961-02-13.congo
    when: Feb. 13
    date: '1961-02-13'
    thread: congo
    c: 'Katanga announces Lumumba''s death. Feb. 15: demonstrators break up the Security Council during Stevenson''s first speech there.'
    n: '[FRUS vol. 20](https://history.state.gov/historicaldocuments/frus1961-63v20). S. Rep. No. 94-465 (K–J Adm. II.H.3) on the CIA''s earlier plot. [[w.witte-de-moord-op-lumumba]]; translated as *The Assassination of Lumumba* (2001); it led to the Belgian parliamentary inquiry of 2000–01. To check: [[w.kalb-congo-cables]]; [[w.martin-adlai-stevenson-and-the]]. Names: Lumumba, Stevenson.'
    tags: [name:stevenson-adlai-e, name:lumumba-patrice]
  - id: cal.1961-02-13.vietnam
    when: Feb. 13
    date: '1961-02-13'
    thread: vietnam
    c: 'Durbrow, with McGarr and Gen. Isaac D. White, gives Diệm an abridged Counterinsurgency Plan under a covering letter, an hour and forty-five minutes, Thuần present. Diệm and Thuần: how to pay the piaster costs of 20,000 more men.'
    n: '[FRUS 1961–63, I, doc. 11](https://history.state.gov/historicaldocuments/frus1961-63v01/d11) (Durbrow, Feb. 13). [[w.miller-misalliance]], 224 (the plan presented in February; the 20,000; the reforms; Diệm''s wariness). See [[cal.1961-01-28.vietnam]]. Names: Durbrow, McGarr, Diệm, Nguyễn Đình Thuần.'
    src:
      c: c0093ab9
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d11: all'
        - 'w.miller-misalliance 224: A'
        - 'via w.miller-misalliance 224 n.24b: all'
    tags: [name:durbrow-elbridge, name:mcgarr-lionel-c, name:ngo-dinh-diem, name:nguyen-dinh-thuan, place:saigon]
  - id: cal.1961-02-14.state-and-city-finance-wv
    when: Feb. 14
    date: '1961-02-14'
    thread: state-and-city-finance
    c: 'West Virginia''s personal income tax. Barron signs S. 106, passed Feb. 10: a tax of 6 percent of the taxpayer''s federal income tax, on the federal definitions of income, from the year 1961. The same session: an added one-cent consumers sales tax, to Aug. 31 (S. 3).'
    n: '*West Virginia Blue Book*, 1961, [p. 247](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1961.pdf#page=257); 1964, [p. 928](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=938) (W. Va. Code ch. 11, art. 21; "a conformity statute"). To check: [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Barron.'
    tags: [state:wv, name:barron-w-w]
  - id: cal.1961-02-16.latin-america
    when: Feb. 16
    date: '1961-02-16'
    thread: latin-america
    c: 'Berle''s Latin American Task Force, Mann with him. Berle: "to develop policies and programs which would channel the revolution now going on in Latin America in the proper direction and to prevent it from being taken over by the Sino-Soviet bloc"; a moral equivalent of the Marshall Plan. Agreed: a ten-year development program; new machinery; an end to the bar on aid to government-owned enterprises; a major address by the President soon.'
    n: '[[w.schlesinger-thousand-days-1965]], 202, by Schlesinger''s account. Made public: [[w.schlesinger-thousand-days-1965]] (1965). The Alliance proposed: [[cal.1961-03-13.latin-america]]. Names: Berle, Mann.'
    src:
      c: 251c8fdf
      rows:
        - 'w.schlesinger-thousand-days-1965 202: all'
    tags: [name:berle-adolf-a, name:mann-thomas-c]
  - id: cal.1961-02-17.economy
    when: Feb. 17
    date: '1961-02-17'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Brentano with Kennedy and Rusk, 11:30 a.m.: Berlin, Poland, the balance of payments. The points drafted for the President, Feb. 16: a short-term reserve problem and a long-term basic deficit, the deficit "only because the U.S. is carrying such heavy burdens of defense for the whole free world"; Bonn''s proposals touch only the first. The draft aide-mémoire: a sustained accumulation of reserves by any one country "disruptive to the international community."'
    n: '[FRUS 1961–63, XIV, doc. 5](https://history.state.gov/historicaldocuments/frus1961-63v14/d5) (the meeting; its pages on the balance of payments not printed). [[w.gavin-gold-dollars-and-power]], 65–66 (the points; the aide-mémoire). To check: Rusk to Kennedy, "German Balance of Payments Proposals and Your Meeting with German Foreign Minister von Brentano on February 17"; "Points which the President may wish to emphasize," Feb. 16, 1961; "Draft Aide Memoire for Brentano," Feb. 16, 1961, President''s Office Files, Kennedy Library (cited by [[w.gavin-gold-dollars-and-power]], 65–66 nn.20–22). Names: Brentano, Kennedy, Rusk.'
    src:
      c: 6ff3ee03
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d5: A'
        - 'w.gavin-gold-dollars-and-power 65–66: B-D'
        - 'via w.gavin-gold-dollars-and-power 65 n.20: B-C'
        - 'via w.gavin-gold-dollars-and-power 65 n.21: B-C'
        - 'via w.gavin-gold-dollars-and-power 66 n.22: D'
    tags: [name:brentano-heinrich-von, name:kennedy-john-f, name:rusk-dean]
  - id: cal.1961-02-18.transition-and-staff
    when: Feb. 18
    date: '1961-02-18'
    thread: transition-and-staff
    c: Executive order abolishes Eisenhower's Operations Coordinating Board. National security policy moves into Bundy's small staff.
    n: '[Exec. Order No. 10,920](https://www.presidency.ucsb.edu/documents/executive-order-10920-revoking-executive-order-no-10700-february-25-1957-amended), [26 Fed. Reg. 1463](https://www.govinfo.gov/app/details/FR-1961-02-21) (Feb. 18, 1961). [FRUS vol. 25](https://history.state.gov/historicaldocuments/frus1961-63v25). To check: [[w.preston-war-council]]; [[w.bird-color-of-truth]]. Names: Bundy, Rostow, Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:bundy-mcgeorge, name:kennedy-john-f, name:rostow-walt-w]
  - id: cal.1961-02-18.cuba
    when: Feb. 18
    date: '1961-02-18'
    thread: cuba-bay-of-pigs
    c: 'The White House. Bundy passes Kennedy the case for the landing, Bissell''s, and the case against, Mann''s. Rusk: better to wait and build OAS support; Berle: not by Mar. 31. Kennedy asks whether a speech, or the Soviet jets and rockets in Cuba, could prepare the ground.'
    n: 'FRUS 1961–63, X, docs. [47](https://history.state.gov/historicaldocuments/frus1961-63v10/d47) (Bundy), [48](https://history.state.gov/historicaldocuments/frus1961-63v10/d48) (Gray''s notes, misdated Feb. 17); [45](https://history.state.gov/historicaldocuments/frus1961-63v10/d45) (Mann, Feb. 15). Made public: FRUS 1961–63, X (1997). See [[cal.1961-01-28.cuba]]. Names: McGeorge Bundy, Kennedy, Bissell, Mann, Rusk, Berle.'
    tags: [name:bundy-mcgeorge, name:kennedy-john-f, name:bissell-richard-m-jr, name:mann-thomas-c, name:rusk-dean, name:berle-adolf-a]
  - id: cal.1961-02-20.school-aid
    when: Feb. 20
    date: '1961-02-20'
    thread: school-aid
    c: 'Education message: grants for school construction and teachers'' salaries, public schools only. Cardinal Spellman and the bishops demand loans for parochial schools.'
    n: 'Special Message to the Congress on Education, [1961 Pub. Papers 107](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=165) (Feb. 20, 1961). To check: [[w.mcandrews-broken-ground]]; [[w.graham-uncertain-triumph]]; [[w.munger-national-politics-and-federal]]. Names: Powell, Delaney, Ribicoff, Spellman.'
    tags: [name:kennedy-john-f, name:spellman-francis, name:powell-adam-clayton-jr, name:delaney-james-j, name:ribicoff-abraham]
  - id: cal.1961-02-20.court
    when: Feb. 20
    date: '1961-02-20'
    thread: court
    c: '*Monroe v. Pape*, [365 U.S. 167](https://tile.loc.gov/storage-services/service/ll/usrep/usrep365/usrep365167/usrep365167.pdf). Section 1983 reaches police who break state law.'
