  - id: cal.1961-02-01.opinion
    when: Feb. 1
    date: '1961-02-01'
    thread: opinion
    also: [peace-corps]
    c: 'Gallup, Jan. 12–17: a program sending young men abroad at government expense to give technical help, 71 percent for, 18 against. 66 percent would want a qualified son to go.'
    n: '[[w.gallup-poll]], III, 1704.'
  - id: cal.1961-02-01.civil-rights-organizations
    when: Feb. 1
    date: '1961-02-01'
    thread: civil-rights-organizations
    c: Farmer takes office as national director of CORE, from the NAACP's staff.
    n: '[[w.dittmer-local-people]], 91 (Farmer CORE''s national director in May 1961; not his taking office). Film: [[w.eyes-on-the-prize]]. SNCC Digital Gateway (K–J Cong. II.L). [[w.garrow-bearing-the-cross]], 154 (from the NAACP''s staff). To check: [[w.carson-in-struggle]]; [[w.zinn-sncc]]; [[w.fairclough-to-redeem-the-soul]]; [[w.payne-ive-got-the-light]]; [[w.farmer-lay-bare-the-heart]]; [[w.wilkins-standing-fast]]; [[w.dickerson-militant-mediator]]; [[w.lewis-walking-with-the-wind]]; [[w.forman-making-of-black-revolutionaries]]; [[w.ransby-ella-baker-and-the]]; [[w.demilio-lost-prophet]]; [[w.anderson-philip-randolph]]; [[w.branch-parting-the-waters]]; [[w.branch-pillar-of-fire]]; [[w.branch-at-canaans-edge]]; [[w.meier-core]]; [[w.weiss-whitney-m-young-jr]]; [[w.greenberg-crusaders-in-the-courts]]; [[w.hogan-many-minds-one-heart]]. Names: Farmer.'
