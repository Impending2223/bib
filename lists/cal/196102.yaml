  - id: cal.1961-02-07.king
    when: Feb. 7
    date: '1961-02-07'
    thread: king
    also: [intelligence]
    c: 'The FBI''s first notice of King. *The Nation*''s issue of Feb. 4 prints his "Equality Now": "If, for instance, the law-enforcement personnel in the FBI were integrated, many persons who now defy federal law might come under restraints." M. A. Jones to DeLoach: not to "call his hand," as he "obviously would only welcome any controversy or resulting publicity."'
    n: '[[w.branch-parting-the-waters]], 403–04. Made public: Check. To check: [[w.garrow-fbi-and-martin-luther]]; King, "Equality Now," The Nation, Feb. 4, 1961, 91 (cited by [[w.branch-parting-the-waters]], 404 n.1); M. A. Jones to DeLoach, Feb. 7, 1961 (cited in Garrow, The FBI and Martin Luther King, Jr., 24) (cited by [[w.branch-parting-the-waters]], 404 n.2). Names: Martin Luther King, DeLoach.'
