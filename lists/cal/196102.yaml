    c: 'The White House, 2:45 to 3:45 p.m., on Laos: Kennedy, Rusk, McNamara, Lemnitzer, Allen Dulles, Nitze, Rostow, Bissell, Bohlen, Parsons. Lemnitzer on Phoumi''s offensive, begun Feb. 6, to retake the Plaine des Jarres. C-130s authorized to carry supplies as far as Udon, Thailand; nine more training teams, 72 men, authorized. Kennedy against a SEATO force in Thailand for now. Bissell, later, of a meeting early in February: the Chiefs'' plan had the Plaine des Jarres seized by parachute troops about the tenth day; he found the briefing "almost surreal."'
