  - id: cal.1961-02-01.vietnam
    when: Feb. 1
    date: '1961-02-01'
    thread: vietnam
    c: 'Komer to Kennedy: "While the first priority must be to meet the impending crisis—using Diem as our chosen instrument—we cannot neglect the longer term viability of South Vietnam"; prompt action on Diệm''s requests for his army, which "probably require circumvention of the Geneva Accords."'
    n: '[[w.mann-grand-delusion]], 228. [[w.preston-war-council]], 79. To check: Komer to Kennedy, Feb. 1, 1961, NSF, Vietnam, Kennedy Papers (cited by [[w.mann-grand-delusion]], 228 n.11). See [[cal.1961-01-28.vietnam]]. Names: Komer, Kennedy, Ngô Đình Diệm.'
