  - id: cal.1961-02-08.civil-rights-the-executive
    when: Feb. 8
    date: '1961-02-08'
    thread: civil-rights-the-executive
    c: 'Hesburgh of the Civil Rights Commission with Kennedy: no Negroes in the Alabama National Guard. Kennedy: "I may have to send the Alabama National Guard to Berlin tomorrow and I don''t want to have to do it in the middle of a revolution at home." Hesburgh asks for a White House liaison to the Commission; Kennedy names Wofford, "a special assistant who''s working on that full time."'
    n: '[[w.reeves-president-kennedy]], 59–60. [[w.branch-parting-the-waters]], 398 (the request for a liaison; Kennedy names Wofford). To check: Theodore Hesburgh, oral history, Kennedy Library (cited by [[w.reeves-president-kennedy]], 59); Harris Wofford, oral history, 103, Kennedy Library (cited by [[w.reeves-president-kennedy]], 60). Check: the day; Reeves has the appointment delayed the morning of the news conference. Names: Hesburgh, Wofford, Kennedy. Check: Branch, 398, dates the meeting Feb. 7, Hannah with Hesburgh, Kennedy asking both to stay on the Commission.'
    src:
