    when: Feb. 1
    date: '1961-02-01'
    thread: defense
    c: 'The Deputy Assistant Secretary for International Security Affairs tells the Joint Chiefs to assume two concurrent aggressions, by not more than five lightly armed divisions each, in Laos and the Congo. The J-5: 45,000 more men in fiscal 1961 and 74,000 in 1962. White: strength "more than adequate," but for airlift.'
    n: '[[w.poole-joint-chiefs-of-staff]], 62. Names: White.'
