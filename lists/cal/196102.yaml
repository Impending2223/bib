    when: Feb. 4
    date: '1961-02-04'
    thread: defense
    also: [europe-and-the-alliance]
    c: 'Rusk to McNamara: "raising the threshold" for nuclear response "the greatest importance"; the general war deterrent "effective, invulnerable, and reliable"; "a mobile, substantial, and flexible capability for operations short of general war is essential," forward in the western Pacific; in Europe, conventional strength to enforce a pause for negotiation.'
    n: 'Rusk to McNamara, [FRUS 1961–63, VIII: National Security Policy, doc. 10](https://history.state.gov/historicaldocuments/frus1961-63v08/d10) (Feb. 4, 1961). [[w.poole-joint-chiefs-of-staff]], 17–18, 188. Names: Rusk, McNamara.'
