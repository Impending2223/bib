    c: 'Mann''s office, 10 a.m. to 1 p.m., Berle in the chair, with Bissell, Barnes, King, Gray, Goodwin and others. A blockade set aside. No Americans to land; a few contract fliers in the strike. Gray: the force could hold six days and reach the mountains. Mann: once it lands the United States is committed, "would have to underwrite the success of the venture."'
