        - 'w.preston-war-council 79: all'
    tags: [name:komer-robert-w, name:kennedy-john-f, name:ngo-dinh-diem]
  - id: cal.1961-02-01.alabama
    when: Feb. 1
    date: '1961-02-01'
    thread: alabama
    also: [press-and-broadcasting, king]
    c: Montgomery. In Mayor Earl James's libel suit over the advertisement, Judge Walter B. Jones presiding, the jury awards $500,000 against the *New York Times* and the four ministers. The defense's objection to the beards worn for the Civil War centennial by James and five jurors overruled; Bernard Lee removed from the white side of the courtroom.
