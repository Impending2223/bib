  - id: cal.1961-02-01.congo
    when: Feb. 1
    date: '1961-02-01'
    thread: congo
    c: Rusk to Kennedy, "Suggested New United States Policy on the Congo." A new UN mandate to bring the Congo's armed forces under control, by force if need be; a middle-of-the-road government under Ileo, failing that one taking in Lumumba's followers but not Lumumba; a larger UN hand in its administration. Rusk sums it up at the NSC that day; Kennedy approves it after.
    n: '[FRUS 1961–63, XX, doc. 17](https://history.state.gov/historicaldocuments/frus1961-63v20/d17); [doc. 18](https://history.state.gov/historicaldocuments/frus1961-63v20/d18) (the NSC; the approval). [[w.rusk-as-i-saw-it-1990]], 277; [[w.poole-joint-chiefs-of-staff]], 257. Names: Rusk, Kennedy, Ileo, Lumumba.'
    src:
      c: 130df690
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v20/d17: A-D'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v20/d18: E-F'
