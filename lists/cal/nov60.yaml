# Cal. XII November 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XII
entries:
  - id: cal.1960-11-01.railroads
    when: Nov. 1
    date: '1960-11-01'
    thread: railroads
    also: [jobs-and-wages]
    c: 'The carriers and the five operating brotherhoods agree to put the work-rules dispute, firemen on diesels among it, to a presidential commission: fifteen members, for the railroads, the unions and the public. Eisenhower creates it by executive order.'
    n: '[Exec. Order No. 10,891](https://www.presidency.ucsb.edu/documents/executive-order-10891-establishing-commission-inquire-into-controversy-between-certain), [25 Fed. Reg. 10525](https://www.govinfo.gov/app/details/FR-1960-11-03). [Statement by the President Concerning the Agreement Reached in the Railway Industry](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-the-agreement-reached-the-railway-industry). [[w.horowitz-manpower-utilization-in-the]]; [[w.kaufman-railroad-labor-dispute]]; [[w.cottrell-technological-change-and-labor]]; [[w.commission-report]], the commission''s findings.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-11-01.cuba
    when: Nov. 1
    date: '1960-11-01'
    thread: cuba
    c: Eisenhower on Guantanamo. The base held under agreements with Cuba that only both parties can change; the United States will not agree to change them, and will take whatever steps are appropriate to defend it.
    n: '[Statement by the President Regarding the U.S. Naval Base at Guantanamo, Cuba](https://www.presidency.ucsb.edu/documents/statement-the-president-regarding-the-us-naval-base-guantanamo-cuba). [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]].'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-11-02.peace-corps
    when: Nov. 2
    date: '1960-11-02'
    thread: peace-corps
    also: [elections-1960]
    c: Kennedy at the Cow Palace, San Francisco, proposes "a peace corps of talented young men and women," three years abroad, "as an alternative or as a supplement to peacetime selective service."
    n: '[Speech of Senator John F. Kennedy, Cow Palace, San Francisco, CA](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-cow-palace-san-francisco-ca). See [[cal.1960-10-14.peace-corps]].'
    tags: [name:kennedy-john-f]
  - id: cal.1960-11-08.elections-1960
    when: Nov. 8
    date: '1960-11-08'
    thread: elections-1960
    c: Kennedy and Johnson over Nixon and Lodge, 49.7 percent to 49.5 of the popular vote, Alabama's Democratic slate counted with Kennedy. Closest States Hawaii, Illinois, Missouri, California, New Mexico, New Jersey; Mississippi to its unpledged electors. Republicans gain 21 House seats and 2 in the Senate; Johnson re-elected to the Senate from Texas the same day. Nixon concedes Nov. 9.
    n: 'Returns: [Clerk of the House, *Statistics of the Presidential and Congressional Election of 1960*](https://clerk.house.gov/member_info/electionInfo/1960election.pdf). [Telegrams of Congratulations to the President- and Vice President-Elect](https://www.presidency.ucsb.edu/documents/telegrams-congratulations-the-president-and-vice-president-elect); [Remarks in Hyannis, Massachusetts Accepting Election as the 35th President of the United States](https://www.presidency.ucsb.edu/documents/remarks-hyannis-massachusetts-accepting-election-the-35th-president-the-united-states) (Nov. 9), Nixon''s telegram quoted. [[w.white-making-of-the-president]]; [[w.kallina-kennedy-v-nixon]]; [[w.rorabaugh-real-making-of-the]]; [[w.donaldson-first-modern-campaign]]; [[w.pietrusza-1960]]; [[w.matthews-kennedy-and-nixon]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.converse-stability-and-change-in]]; [[w.pool-candidates-issues-and-strategies]]; [[w.nixon-six-crises]]; [[w.gellman-president-and-the-apprentice]]. Names: Johnson (K–J Adm. III.D); Lodge (K–J Adm. III.E); Nixon (Opp. III.E).'
    tags: [election:1960, name:kennedy-john-f, name:johnson-lyndon-b, name:nixon-richard-m, name:lodge-henry-cabot]
  - id: cal.1960-11-08.specials
    when: Nov. 8
    date: '1960-11-08'
    thread: specials
    c: Pennsylvania 18th, special. Whalley (R) holds the late Douglas Elliott's seat, 62.3 to 37.7 over Meyers (D); the same day, the full term.
    n: 'Votes: CQ Guide 6th (2010) 1265. The Clerk prints the regular race only. See [[cal.1960-03-08.specials]]. Names: Elliott (K–J Cong. III.K).'
    tags: [special:1960-11-08-h-PA-18, name:whalley-john-i, name:elliott-douglas-h]
  - id: cal.1960-11-08.governors
    when: Nov. 8
    date: '1960-11-08'
    thread: governors
    also: [elections-1960]
    c: 'Twenty-seven governors elected: Democrats 15, Republicans 12. Each party took six or seven States from the other. Kerner (D) over Governor Stratton in Illinois; Volpe (R) in Massachusetts; Sanford (D) in North Carolina; Andersen (R) over Freeman in Minnesota. Governorships after the election: Democrats 34, Republicans 16.'
    n: '[Wikipedia, "1960 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1960_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.sabato-goodbye-to-good-time]]. See [[cal.1960-11-08.elections-1960]]. Names: Kerner, Sanford (K–J Cong. III.F); Volpe (Opp. III.H); Freeman (K–J Adm. III.G).'
    tags: [governors:1960-11-08, name:kerner-otto, name:volpe-john-a, name:sanford-terry, name:freeman-orville-l]
  - id: cal.1960-11-09.transition-and-staff
    when: Nov. 9–10
    date: '1960-11-09'
    thread: transition-and-staff
    c: 'The President-elect''s first appointments, from Hyannis Port: Allen Dulles kept at the CIA and Hoover at the FBI; Salinger press secretary, Sorensen counsel, O''Donnell appointments secretary. Clifford to deal with the White House for him, Persons for Eisenhower. Clifford''s memorandum on the transition delivered.'
    n: 'Clifford''s memorandum, Nov. 9 (JFK Library, Clifford Papers; Check). Check: which appointments Nov. 9, which Nov. 10. Neustadt''s memoranda of Sept. 15 and Oct. 30 on organizing the transition: [[w.preparing-to-be-president]]. [[w.clifford-counsel-to-the-president-2]]; [[w.brauer-presidential-transitions]]; [[w.sorensen-kennedy]]; [[w.schlesinger-thousand-days-1965]]; [[w.parmet-jfk]]; [[w.grose-gentleman-spy]]; [[w.gage-g-man]]. Names: Salinger, Sorensen, O''Donnell (K–J Adm. III.B); Dulles, Hoover (K–J Adm. III.I); Clifford (Viet. III.A).'
    tags: [name:kennedy-john-f, name:dulles-allen-w, name:hoover-j-edgar, name:salinger-pierre, name:sorensen-theodore-c, name:odonnell-kenneth-p, name:clifford-clark, name:persons-wilton-b, name:eisenhower-dwight-d]
  - id: cal.1960-11-09.soviet-union
    when: Nov. 9–10
    date: '1960-11-09'
    thread: soviet-union
    also: [berlin-and-vienna]
    c: 'Khrushchev congratulates the President-elect: relations to go back to the line of Roosevelt''s time; ready to go on with disarmament and to settle the German question by a peace treaty. Kennedy''s reply, Nov. 10, two sentences of thanks.'
    n: 'FRUS 1961–63, VI, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v06/d1), [2](https://history.state.gov/historicaldocuments/frus1961-63v06/d2). [[w.beschloss-crisis-years]]; [[w.fursenko-khrushchevs-cold-war]]; [[w.taubman-khrushchev]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f]
  - id: cal.1960-11-11.vietnam
    when: Nov. 11–12
    date: '1960-11-11'
    thread: vietnam
    c: Paratroops under Col. Nguyễn Chánh Thi surround the palace in Saigon and demand a new government. Diệm negotiates, promises reform, and brings loyal troops into the city; the rebels give up Nov. 12, their leaders flown to Cambodia. Durbrow presses both sides to settle.
    n: 'FRUS 1958–60, I, docs. [218](https://history.state.gov/historicaldocuments/frus1958-60v01/d218), [228](https://history.state.gov/historicaldocuments/frus1958-60v01/d228), [232](https://history.state.gov/historicaldocuments/frus1958-60v01/d232) (Durbrow), [235](https://history.state.gov/historicaldocuments/frus1958-60v01/d235) (Mendenhall''s letter). [[w.anderson-trapped-by-success]]; [[w.catton-diems-final-failure]]; [[w.miller-misalliance]]; [[w.jacobs-cold-war-mandarin]]. Names: Diệm (K–J Adm. III.J); Durbrow (Viet. III.C).'
    tags: [name:nguyen-chanh-thi, name:ngo-dinh-diem, name:durbrow-elbridge]
  - id: cal.1960-11-14.desegregation-schools
    when: Nov. 14–16
    date: '1960-11-14'
    thread: desegregation-schools
    c: 'New Orleans, under Judge Wright''s order. Four Black first-graders enter two white schools with federal marshals: Ruby Bridges at William Frantz, three at McDonogh No. 19. White parents withdraw their children; crowds of women at Frantz. The legislature, in special session, passes act after act to stop it; Wright enjoins them. Nov. 16, after a Citizens'' Council rally, white youths riot downtown.'
    n: 'The case: *Bush v. Orleans Parish School Board*; the three-judge court''s decision of Aug. 27, [187 F. Supp. 42](https://static.case.law/f-supp/187/html/0042-01.html) (E.D. La. 1960). [[w.fairclough-race-and-democracy]]; [[w.baker-second-battle-of-new]]; [[w.bass-unlikely-heroes]], on Wright; [[w.mcmillen-citizens-council]]; [[w.coles-children-of-crisis]]; [[w.bridges-through-my-eyes]]; [[w.steinbeck-travels-with-charley]], the women at Frantz. Names: Wright (K–J Cong. III.G); Bridges (K–J Cong. III.K).'
    tags: [name:wright-j-skelly, name:bridges-ruby]
  - id: cal.1960-11-14.court
    when: Nov. 14
    date: '1960-11-14'
    thread: court
    also: [voting-rights]
    c: '*Gomillion v. Lightfoot*, [364 U.S. 339](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364339/usrep364339.pdf). Alabama''s act redrawing Tuskegee, Ala., from a square to a figure of 28 sides, alleged to remove all but four or five of its 400 Black voters and no white one: the complaint states a claim under the Fifteenth Amendment, its dismissal reversed. Unanimous; Frankfurter for the Court, Whittaker concurring on equal protection.'
    n: '[[w.taper-gomillion-versus-lightfoot]]; [[w.norrell-reaping-the-whirlwind]]; [[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]]. Cases: K–J Cong. II.J.1. Names: Frankfurter, Whittaker (K–J Cong. III.G).'
    tags: [name:frankfurter-felix, name:whittaker-charles-e]
  - id: cal.1960-11-14.transition-and-staff
    when: Nov. 14
    date: '1960-11-14'
    thread: transition-and-staff
    c: Kennedy flies from Palm Beach to see Nixon at Key Biscayne, Fla.; they talk alone. In Washington, Clifford and Persons meet and set the President's meeting with his successor for Dec. 6.
    n: 'See [[cal.1960-11-09.transition-and-staff]]. [[w.matthews-kennedy-and-nixon]]; [[w.nixon-six-crises]]. Names: Nixon (Opp. III.E); Clifford (Viet. III.A).'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:clifford-clark, name:persons-wilton-b]
  - id: cal.1960-11-15.defense
    when: Nov. 15
    date: '1960-11-15'
    thread: defense
    also: [europe-and-the-alliance]
    c: The *George Washington* leaves Charleston on the first Polaris patrol, sixteen missiles. Macmillan announced Nov. 1 a base for the submarines in the Holy Loch.
    n: '[Statement by the President on the Entrance Into Sea Duty of the Polaris Submarine George Washington](https://www.presidency.ucsb.edu/documents/statement-the-president-the-entrance-into-sea-duty-the-polaris-submarine-george-washington). [[w.sapolsky-polaris-system-development]]; [[w.roman-eisenhower-and-the-missile]]. Names: Macmillan (K–J Adm. III.J).'
    tags: [name:eisenhower-dwight-d, name:macmillan-harold]
  - id: cal.1960-11-16.economy
    when: Nov. 16
    date: '1960-11-16'
    thread: economy
    c: Eisenhower's directive on the balance of payments, issued at Augusta. Fewer dependents abroad, of the services' half million; less buying abroad; aid loans and grants to pay for American goods. The gold stock $18.1 billion, Nov. 9.
    n: '[The President''s News Conference at Augusta, Georgia](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-augusta-georgia). FRUS 1958–60, IV, docs. [57](https://history.state.gov/historicaldocuments/frus1958-60v04/d57) (Anderson on gold, Nov. 9), [58](https://history.state.gov/historicaldocuments/frus1958-60v04/d58), [59](https://history.state.gov/historicaldocuments/frus1958-60v04/d59) (the directive; its text in *American Foreign Policy: Current Documents, 1960*, 786–792). [[w.gavin-gold-dollars-and-power]]; [[w.zimmermann-money-and-security]]; [[w.kunz-butter-and-guns]].'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-11-17.latin-america
    when: Nov. 17
    date: '1960-11-17'
    thread: latin-america
    also: [cuba]
    c: After a rising against Ydígoras, Nov. 13, Guatemala and Nicaragua ask for help. American naval and air units off their Caribbean coasts to stop landings of men or arms from abroad. Withdrawn Dec. 7.
    n: '[Exchange of Messages Between the President and President Ydigoras Fuentes on U.S. Naval Aid to Guatemala](https://www.presidency.ucsb.edu/documents/exchange-messages-between-the-president-and-president-ydigoras-fuentes-u-s-naval-aid) (released Dec. 2), with the White House release of Dec. 7. [[w.rabe-eisenhower-and-latin-america]]; [[w.gleijeses-ships-in-the-night]], on the Cuban exiles'' base in Guatemala.'
    tags: [name:eisenhower-dwight-d, name:ydigoras-fuentes-miguel]
  - id: cal.1960-11-18.cuba
    when: Nov. 18
    date: '1960-11-18'
    thread: cuba
    c: 'Dulles and Bissell brief the President-elect at Palm Beach on the Cuban exiles in training in Guatemala. The plan moving from infiltration and guerrilla war to a landing in force: the Special Group, Nov. 16, on "the changing concept of the operation."'
    n: 'FRUS 1958–60, VI, doc. [612](https://history.state.gov/historicaldocuments/frus1958-60v06/d612). [[w.bissell-reflections-of-a-cold]]; [[w.wyden-bay-of-pigs]]; [[w.rasenberger-brilliant-disaster]]. See [[cal.1960-03-17.cuba]]. Names: Dulles, Bissell (K–J Adm. III.I).'
    tags: [name:kennedy-john-f, name:dulles-allen-w, name:bissell-richard-m-jr]
  - id: cal.1960-11-19.economy
    when: Nov. 19–28
    date: '1960-11-19'
    thread: economy
    also: [europe-and-the-alliance]
    c: Anderson and Dillon in Bonn. They ask Adenauer, Nov. 21–22, to bear part of the $600 million a year in gold that the American forces in Germany cost. Refused; Bonn offers aid to poor countries, early payment of its postwar debt, arms bought in the United States. Eisenhower's statement on their report, Nov. 28.
    n: '[Statement by the President Upon Completion of the Mission of Secretary Anderson and Under Secretary Dillon](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-completion-the-mission-secretary-anderson-and-under-secretary). FRUS 1958–60, IV, doc. [61](https://history.state.gov/historicaldocuments/frus1958-60v04/d61). [[w.zimmermann-money-and-security]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1960-11-16.economy]]. Names: Dillon (K–J Adm. III.H); Adenauer (K–J Adm. III.J).'
    tags: [name:anderson-robert-b, name:dillon-c-douglas, name:adenauer-konrad, name:eisenhower-dwight-d]
  - id: cal.1960-11-20.japan-and-korea
    when: Nov. 20
    date: '1960-11-20'
    thread: japan-and-korea
    c: Japan's general election. Ikeda's Liberal Democrats keep their majority, 296 of 467 seats.
    n: '[Exchange of Messages Between the President and Prime Minister Ikeda on the Election in Japan](https://www.presidency.ucsb.edu/documents/exchange-messages-between-the-president-and-prime-minister-ikeda-the-election-japan) (Nov. 28). See [[cal.1960-01-19.japan-and-korea]]. Names: Ikeda (K–J Adm. III.J).'
    tags: [name:ikeda-hayato]
  - id: cal.1960-11-22.congo
    when: Nov. 22
    date: '1960-11-22'
    thread: congo
    c: The General Assembly seats Kasavubu's delegation, not Lumumba's, 53–24, 19 abstaining; the United States for it.
    n: 'FRUS 1958–60, XIV, doc. [265](https://history.state.gov/historicaldocuments/frus1958-60v14/d265). Sékou Touré''s protest and Eisenhower''s reply, Nov. 25: [Exchange of Messages Between the President and President Toure of Guinea Regarding U.S. Policy Toward the Congo](https://www.presidency.ucsb.edu/documents/exchange-messages-between-the-president-and-president-toure-guinea-regarding-us-policy). See [[cal.1960-06-30.congo]]. Names: Lumumba (K–J Adm. III.J).'
    tags: [name:kasavubu-joseph, name:lumumba-patrice]
  - id: cal.1960-11-25.defense
    when: Nov. 25
    date: '1960-11-25'
    thread: defense
    c: 'Kistiakowsky reports to Eisenhower on the first Single Integrated Operational Plan and its target list: the best to be had, to be put into effect; its method to be reviewed for the next. The Joint Chiefs approve SIOP-62, Dec. 2.'
    n: 'FRUS 1958–60, III, doc. [127](https://history.state.gov/historicaldocuments/frus1958-60v03/d127). Check: the Chiefs'' approval, Dec. 2. Made public: Kistiakowsky''s diary (1976). [[w.kistiakowsky-scientist-at-the-white]]; [[w.rosenberg-origins-of-overkill]]; [[w.kaplan-wizards-of-armageddon]]; [[w.roman-eisenhower-and-the-missile]].'
    tags: [name:kistiakowsky-george-b, name:eisenhower-dwight-d]
  - id: cal.1960-11-27.congo
    when: Nov. 27–Dec. 3
    date: '1960-11-27'
    thread: congo
    c: Lumumba slips out of his residence in Leopoldville, under UN guard, the night of Nov. 27, for Stanleyville. Caught by Mobutu's troops near the Sankuru, Dec. 1; flown back to Leopoldville, beaten before the cameras, held at Thysville from Dec. 3.
    n: 'FRUS 1958–60, XIV, docs. [273](https://history.state.gov/historicaldocuments/frus1958-60v14/d273) (Dulles to the NSC, Dec. 1), [276](https://history.state.gov/historicaldocuments/frus1958-60v14/d276). See [[cal.1960-08-18.congo-2]]. Names: Lumumba (K–J Adm. III.J).'
    tags: [name:lumumba-patrice, name:mobutu-joseph-d]
  - id: cal.1960-11-29.cuba
    when: Nov. 29–Dec. 7
    date: '1960-11-29'
    thread: cuba
    c: 'Eisenhower, after seeing Pawley, asks his advisers whether the Cuba program is "sufficiently imaginative and bold," and wants no emergency handed to his successor. Dulles: some 500 exiles in training in Guatemala. Dec. 7, Eisenhower puts Willauer, under the Secretary of State, in charge of the program, overt and covert.'
    n: 'FRUS 1958–60, VI, docs. [613](https://history.state.gov/historicaldocuments/frus1958-60v06/d613), [618](https://history.state.gov/historicaldocuments/frus1958-60v06/d618). See [[cal.1960-03-17.cuba]]. Names: Dulles (K–J Adm. III.I).'
    tags: [name:eisenhower-dwight-d, name:pawley-william, name:dulles-allen-w, name:willauer-whiting]
  - id: cal.1960-11-30.desegregation-schools
    when: Nov. 30
    date: '1960-11-30'
    thread: desegregation-schools
    c: 'A three-judge court voids Louisiana''s acts against the New Orleans order: "interposition is not a constitutional doctrine." The Supreme Court refuses a stay, Dec. 12, on *Cooper v. Aaron*.'
    n: '*Bush v. Orleans Parish School Board*, [188 F. Supp. 916](https://static.case.law/f-supp/188/html/0916-01.html) (E.D. La. 1960); [364 U.S. 500](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364500/usrep364500.pdf) (1960). See [[cal.1960-11-14.desegregation-schools]]. Names: Wright (K–J Cong. III.G).'
    tags: [name:wright-j-skelly]
