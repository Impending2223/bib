# Cal. XVII March 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVII
entries:
  - id: cal.1962-03-02.testing
    when: Mar. 2
    date: '1962-03-02'
    thread: testing
    c: Television address. Atmospheric tests to resume in late April, absent a treaty with inspection.
    n: '[Radio and Television Address to the American People: "Nuclear Testing and Disarmament"](https://www.presidency.ucsb.edu/documents/radio-and-television-address-the-american-people-nuclear-testing-and-disarmament) (Mar. 2, 1962). See [[cal.1961-09-01.testing]].'
  - id: cal.1962-03-13.cuba
    when: Mar. 13
    date: '1962-03-13'
    thread: cuba
    c: 'The Joint Chiefs send McNamara Operation Northwoods: pretexts for invasion, staged attacks among them. Lemnitzer signs. Not adopted.'
    n: 'Released 1997 by the Assassination Records Review Board (K–J Adm. II.H.3). See [[cal.1961-11-30.cuba]]. Names: Lemnitzer (K–J Adm. III.F).'
  - id: cal.1962-03-14.testing
    when: Mar. 14
    date: '1962-03-14'
    thread: testing
    also: [berlin-and-vienna]
    c: Eighteen-Nation Disarmament Committee opens at Geneva. Rusk and Gromyko on Berlin there.
    n: 'Seaborg, *Kennedy, Khrushchev, and the Test Ban* (K–J Adm. II.D). FRUS vols. [7](https://history.state.gov/historicaldocuments/frus1961-63v07) and [15](https://history.state.gov/historicaldocuments/frus1961-63v15). Names: Rusk (K–J Adm. III.E); Gromyko (K–J Adm. III.J).'
  - id: cal.1962-03-15.program
    when: Mar. 15
    date: '1962-03-15'
    thread: program
    c: 'Manpower Development and Training Act signed. Consumer message: four consumer rights.'
    n: '[Pub. L. No. 87-415, 76 Stat. 23](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg23-2.pdf) (K–J Cong. II.J.2). [Special Message to the Congress on Protecting the Consumer Interest](https://www.presidency.ucsb.edu/documents/special-message-the-congress-protecting-the-consumer-interest) (Mar. 15, 1962). Peterson, *Restless* (K–J Adm. II.G.5). See [[cal.1961-02-02.program]].'
  - id: cal.1962-03-21.defense
    when: Mar. 21
    date: '1962-03-21'
    thread: defense
    c: The RS-70. Vinson's bill would "direct" bomber spending; after a Rose Garden walk with Kennedy, "authorize."
    n: 'Kaplan (K–J Adm. II.D). See [[cal.1961-02-06.defense]]. Names: Vinson (K–J Cong. III.D); LeMay (K–J Adm. III.F).'
  - id: cal.1962-03-22.vietnam
    when: Mar. 22
    date: '1962-03-22'
    thread: vietnam
    c: Operation Sunrise, Binh Duong. The first strategic hamlets; villagers moved.
    n: 'Catton, *Diem''s Final Failure* (Viet. II.E.5). Thompson, *Defeating Communist Insurgency* (Viet. II.F.4). See [[cal.1961-01-28.vietnam]]. Names: Ngo Dinh Nhu (Viet. III.G); Thompson (Viet. III.I).'
  - id: cal.1962-03-22.transition-and-staff
    when: Mar. 22
    date: '1962-03-22'
    thread: transition-and-staff
    c: Hoover lunches with Kennedy. The Bureau knows of Judith Campbell and Giancana. Her calls to the White House end.
    n: 'S. Rep. No. 94-465 (K–J Adm. II.H.3). Gage, *G-Man* (K–J Adm. II.E). Names: Hoover (K–J Adm. III.I).'
  - id: cal.1962-03-26.court
    when: Mar. 26
    date: '1962-03-26'
    thread: court
    c: '*Baker v. Carr*, 369 U.S. 186. Apportionment justiciable. Brennan for six; Frankfurter and Harlan dissent.'
    n: 'Opinions (K–J Cong. II.J.1). Smith, *On Democracy''s Doorstep* (K–J Cong. II.H). See [[cal.1961-04-19.court]]. Names: Brennan, Frankfurter, Harlan (K–J Cong. III.G).'
  - id: cal.1962-03-27.voting-rights
    when: Mar. 27
    date: '1962-03-27'
    thread: voting-rights
    c: Senate passes the poll tax amendment, [77–16](https://voteview.com/rollcall/RS0870226). Holland's resolution, moved by Mansfield in place of a minor bill.
    n: 'U.S. Const. amend. XXIV (K–J Cong. II.J.2). Lawson, *Black Ballots* (K–J Cong. II.C). Branch, *Parting the Waters* (K–J Adm. II.C). Names: Mansfield (K–J Cong. III.A).'
  - id: cal.1962-03-29.latin-america
    when: Mar. 29
    date: '1962-03-29'
    thread: latin-america
    c: Argentina's armed forces depose Frondizi after Peronist gains.
    n: Rabe (K–J Adm. II.D). See [[cal.1961-03-13.latin-america]].
  - id: cal.1962-03-30.court
    when: Mar. 30
    date: '1962-03-30'
    thread: court
    c: Whittaker retires. White named; confirmed Apr. 11.
    n: 'Hutchinson, *The Man Who Once Was Whizzer White* (K–J Cong. II.G). See [[cal.1961-01-23.court]]. Names: White, Whittaker (K–J Cong. III.G).'
  - id: cal.1962-03-31.steel
    when: Mar. 31
    date: '1962-03-31'
    thread: steel
    c: Steelworkers and companies settle early. No wage increase; about ten cents in benefits. Goldberg brokered it.
    n: 'See [[cal.1961-09-06.steel]]. Names: Goldberg (K–J Adm. III.G).'
