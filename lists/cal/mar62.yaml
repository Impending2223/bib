# Cal. XVII March 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVII
entries:
  - id: cal.1962-03-02.testing
    when: Mar. 2
    date: '1962-03-02'
    thread: testing
    c: Television address. The United States will resume atmospheric tests in late April unless the Soviet Union accepts a treaty with inspection.
    n: 'Radio and Television Address to the American People: "Nuclear Testing and Disarmament" (Mar. 2, 1962). See [[cal.1961-09-01.testing]].'
  - id: cal.1962-03-13.cuba
    when: Mar. 13
    date: '1962-03-13'
    thread: cuba
    c: The Joint Chiefs send McNamara Operation Northwoods, pretexts for an invasion, staged attacks among them. Lemnitzer signs it. It goes no further.
    n: 'Released in 1997 by the Assassination Records Review Board (K–J Adm. II.H.3). Names: Lemnitzer (K–J Adm. III.F).'
  - id: cal.1962-03-14.testing
    when: Mar. 14
    date: '1962-03-14'
    thread: testing
    also: [berlin-and-vienna]
    c: The Eighteen-Nation Disarmament Committee opens at Geneva. Rusk and Gromyko meet there on Berlin.
    n: Seaborg, *Kennedy, Khrushchev, and the Test Ban* (K–J Adm. II.D). FRUS vols. 7 and 15.
  - id: cal.1962-03-15.program
    when: Mar. 15
    date: '1962-03-15'
    thread: program
    c: Manpower Development and Training Act signed. The consumer message the same day, four rights of the consumer.
    n: Pub. L. No. 87-415 (K–J Cong. II.J.2). Special Message to the Congress on Protecting the Consumer Interest (Mar. 15, 1962). Peterson, *Restless* (K–J Adm. II.G.5).
  - id: cal.1962-03-21.defense
    when: Mar. 21
    date: '1962-03-21'
    thread: defense
    c: The RS-70. Vinson's committee would "direct" the Air Force to spend more on the bomber than asked. Kennedy walks with Vinson in the Rose Garden; the word becomes "authorize." Check the date.
    n: 'Kaplan (K–J Adm. II.D). Names: Vinson (K–J Cong. III.D); LeMay (K–J Adm. III.F).'
  - id: cal.1962-03-22.vietnam
    when: Mar. 22
    date: '1962-03-22'
    thread: vietnam
    c: Operation Sunrise in Binh Duong, the first strategic hamlets. Villagers moved from their land and paid little.
    n: 'Catton, *Diem''s Final Failure* (Viet. II.B). Thompson, *Defeating Communist Insurgency* (Viet. II.F). Names: Ngo Dinh Nhu (Viet. III.G); Thompson (Viet. III.I).'
  - id: cal.1962-03-22.transition-and-staff
    when: Mar. 22
    date: '1962-03-22'
    thread: transition-and-staff
    c: Hoover lunches with Kennedy. The Bureau knows of Judith Campbell and her friendship with Sam Giancana. The calls between her and the White House stop.
    n: S. Rep. No. 94-465 (K–J Adm. II.H.3). Gage, *G-Man* (K–J Adm. II.E). Check.
  - id: cal.1962-03-26.court
    when: Mar. 26
    date: '1962-03-26'
    thread: court
    c: '*Baker v. Carr*, 369 U.S. 186. Apportionment can be tried in federal court. Brennan for six; Frankfurter and Harlan dissent.'
    n: '(K–J Cong. II.J.1). Smith, *On Democracy''s Doorstep* (K–J Cong. II.H). See [[cal.1961-04-19.court]]. Names: Brennan, Frankfurter, Harlan (K–J Cong. III.G).'
  - id: cal.1962-03-27.voting-rights
    when: Mar. 27
    date: '1962-03-27'
    thread: voting-rights
    c: The Senate passes the poll tax amendment, 77–16, after Holland's long campaign for it. Mansfield used a minor bill as the vehicle to get past the filibuster.
    n: 'U.S. Const. amend. XXIV (K–J Cong. II.J.2). Lawson, *Black Ballots* (K–J Cong. II.C). Branch, *Parting the Waters* (K–J Adm. II.C). Check the vote. Names: Mansfield (K–J Cong. III.A).'
  - id: cal.1962-03-29.latin-america
    when: Mar. 29
    date: '1962-03-29'
    thread: latin-america
    c: Argentina's armed forces depose Frondizi after Peronists win provincial elections.
    n: Rabe (K–J Adm. II.D). Check.
  - id: cal.1962-03-30.court
    when: Mar. 30
    date: '1962-03-30'
    thread: court
    c: Whittaker retires; Byron White named. Confirmed Apr. 11.
    n: 'Hutchinson, *The Man Who Once Was Whizzer White* (K–J Cong. II.G). Names: White (K–J Cong. III.G); Whittaker (K–J Cong. III.G).'
  - id: cal.1962-03-31.steel
    when: Mar. 31
    date: '1962-03-31'
    thread: steel
    c: The steelworkers and the companies settle early, with no wage increase and about ten cents in benefits, inside the guideposts. Goldberg brokered it.
    n: 'See [[cal.1961-09-06.steel]]. Names: Goldberg (K–J Adm. III.G).'
