# Cal. XXVIII March 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXVIII
entries:
  - id: cal.1962-03-01.conservation
    when: Mar. 1
    date: '1962-03-01'
    thread: conservation
    c: Special message on conservation. As the Outdoor Recreation Resources Review Commission had recommended, a Bureau of Outdoor Recreation in Interior and an Outdoor Recreation Advisory Council; a Land Conservation Fund from park fees, boat charges, the motorboat gasoline tax and surplus land sales, with up to $500 million advanced over eight years; the wilderness bill again; Point Reyes, Great Basin, the Ozark rivers, Sagamore Hill, Canyonlands, Sleeping Bear Dunes; the water resources planning bill again.
    n: '[Special Message to the Congress on Conservation](https://www.presidency.ucsb.edu/documents/special-message-the-congress-conservation) (Mar. 1, 1962). [[w.smith-john-kennedy-stewart-udall]]; [[w.smith-stewart-l-udall]]. See [[cal.1961-02-23.conservation]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-03-02.testing
    when: Mar. 2
    date: '1962-03-02'
    thread: testing
    c: Television address. Atmospheric tests to resume in late April, absent a treaty with inspection.
    n: '[Radio and Television Address to the American People: "Nuclear Testing and Disarmament"](https://www.presidency.ucsb.edu/documents/radio-and-television-address-the-american-people-nuclear-testing-and-disarmament) (Mar. 2, 1962). See [[cal.1961-09-01.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-03-03.mayors-new-orleans
    when: Mar. 3
    date: '1962-03-03'
    thread: mayors
    also: [elections-1962]
    c: 'New Orleans, Democratic runoff for mayor: Schiro 94,157, Duplantier 73,057; Schiro 56.3 percent (Check the date).'
    n: '[Wikipedia](https://en.wikipedia.org/wiki/1962_New_Orleans_mayoral_election). See [[cal.1962-01-27.mayors-new-orleans]]. Names: Schiro, Duplantier.'
    tags: [name:duplantier-adrian-g, name:schiro-victor-h, state:la, city:new-orleans]
  - id: cal.1962-03-04.opinion-5
    when: Mar. 4
    date: '1962-03-04'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Feb. 8–13: Republicans'' choice for 1964: Nixon 46, Rockefeller 17, Goldwater 13, Romney 9, Dirksen 5, Milton Eisenhower 4; others, no preference 6. Nixon''s second choices redistributed: Rockefeller 33, Goldwater 20, Romney 14.'
    n: '[[w.gallup-poll]], III, 1757. Names: Nixon, Milton Eisenhower, Rockefeller, Romney, Goldwater, Dirksen.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:goldwater-barry-m, name:romney-george-w, name:dirksen-everett, name:eisenhower-milton-s]
  - id: cal.1962-03-05.japan-and-korea
    when: Mar. 5–19
    date: '1962-03-05'
    thread: japan-and-korea
    c: 'NSAM 133, Mar. 5: the Ryukyu task force''s program. Japan''s aid to the islands, under American control; more Ryukyuan self-government; the ceiling on American aid to go. Mar. 19, Executive Order 11010, and Kennedy: "I recognize the Ryukyus to be a part of the Japanese homeland," to be restored to Japan when "the security interests of the free World" permit.'
    n: 'FRUS 1961–63, XXII, docs. [350](https://history.state.gov/historicaldocuments/frus1961-63v22/d350), [352](https://history.state.gov/historicaldocuments/frus1961-63v22/d352). [Statement by the President Upon Signing Order Relating to the Administration of the Ryukyu Islands](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-order-relating-the-administration-the-ryukyu-islands) (Mar. 19, 1962); [Executive Order 11010](https://www.presidency.ucsb.edu/documents/executive-order-11010-amending-executive-order-no-10713-relating-the-administration-the), [27 Fed. Reg. 2621](https://www.govinfo.gov/app/details/FR-1962-03-21). See [[cal.1961-08-11.japan-and-korea]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1962-03-06.state-constitutions-mo
    when: Mar. 6
    date: '1962-03-06'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Missouri, special election. An amendment adopted, 380,573 to 133,001: the State motor fuel tax shared with counties, cities, towns and villages; no city tax on motor fuel without a two-thirds vote.'
    n: '[*Official Manual, State of Missouri, 1963–1964*, 1248](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/36568). See [[cal.1960-11-08.state-constitutions-mo]].'
    tags: [state:mo]
  - id: cal.1962-03-07.opinion-5
    when: Mar. 7
    date: '1962-03-07'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Feb. 8–13: Independents'' choice for 1964: Rockefeller 28, Goldwater 17, Romney 15, Milton Eisenhower 5, Robert Anderson 4, Dirksen 4; others, no preference 27. Democrats: Rockefeller 36, Goldwater 16.'
    n: '[[w.gallup-poll]], III, 1757. Names: Rockefeller, Romney, Goldwater, Milton Eisenhower, Anderson, Dirksen.'
    tags: [name:rockefeller-nelson, name:goldwater-barry-m, name:romney-george-w, name:eisenhower-milton-s, name:anderson-robert-b, name:dirksen-everett]
  - id: cal.1962-03-07.goldwater
    when: Mar. 7
    date: '1962-03-07'
    thread: goldwater
    c: 'Madison Square Garden, the Young Americans for Freedom''s rally: some 18,000, a full house. Thurmond and Tower honored. Goldwater the last speaker: conservatism "the wave of the future."'
    n: 'Mary Perot Nichols, *Village Voice*, Mar. 15, 1962 ([text](https://www.villagevoice.com/yaf-goes-wild-for-barry-goldwater/)). [[w.andrew-other-side-of-the]]; [[w.schneider-cadres-for-conservatism]]; [[w.perlstein-before-the-storm]]. Names: Goldwater, Thurmond, Tower.'
    tags: [name:goldwater-barry-m, name:thurmond-strom, name:tower-john-g]
  - id: cal.1962-03-07.soviet-union
    when: Mar. 7–20
    date: '1962-03-07'
    thread: soviet-union
    also: [space]
    c: 'Kennedy''s proposals to Khrushchev for joint work in space, after Khrushchev''s message on Glenn''s flight, Feb. 21: a weather satellite system, tracking stations on each other''s territory, mapping the earth''s magnetic field, communications satellites, space medicine. Released Mar. 18. Khrushchev''s reply, Mar. 20: talks. Dryden and Blagonravov meet at New York, Mar. 27–30; at Geneva, June 8, they agree on weather satellites, the magnetic field and the Echo satellite.'
    n: '[Reply to Chairman Khrushchev''s Message on the flight of Colonel Glenn](https://www.presidency.ucsb.edu/documents/reply-chairman-khrushchevs-message-the-flight-colonel-glenn) (Feb. 21, 1962); [Message to Chairman Khrushchev Proposing Joint Action in the Exploration of Outer Space](https://www.presidency.ucsb.edu/documents/message-chairman-khrushchev-proposing-joint-action-the-exploration-outer-space) (Mar. 7, 1962). FRUS 1961–63, VI, docs. [35](https://history.state.gov/historicaldocuments/frus1961-63v06/d35), [41](https://history.state.gov/historicaldocuments/frus1961-63v06/d41), [43](https://history.state.gov/historicaldocuments/frus1961-63v06/d43); V, doc. [202](https://history.state.gov/historicaldocuments/frus1961-63v05/d202). [[w.mcdougall-heavens-and-the-earth]]; [[w.logsdon-john-f-kennedy-and]]; [[w.siddiqi-challenge-to-apollo]]. See [[cal.1962-02-20.space]]. Names: Khrushchev, Blagonravov, Glenn, Dryden.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s, name:glenn-john-h-jr, name:dryden-hugh-l, name:blagonravov-anatoli-a]
  - id: cal.1962-03-08.soviet-union
    when: Mar. 8
    date: '1962-03-08'
    thread: soviet-union
    c: 'Agreement on exchanges in the scientific, technical, educational, cultural and other fields in 1962–63 signed at Washington, [13 U.S.T. 1496](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-13-2/lltreaties-13-2.pdf#page=312), [460 U.N.T.S. 3](https://treaties.un.org/doc/Publication/UNTS/Volume%20460/volume-460-I-6630-English.pdf), in force at once, from Jan. 1. Negotiated from Jan. 31 by Bohlen and Romanovsky: the Americans for more exchanges in education and information, the Soviets in science and industry.'
    n: 'FRUS 1961–63, V, doc. [168](https://history.state.gov/historicaldocuments/frus1961-63v05/d168). [[w.richmond-cultural-exchange-and-the]]. Names: Bohlen, Romanovsky.'
    tags: [name:bohlen-charles-e, name:romanovsky-s-k]
  - id: cal.1962-03-09.opinion-5
    when: Mar. 9
    date: '1962-03-09'
    thread: opinion
    also: [elections-1964-polls, goldwater]
    c: 'Gallup, Feb. 8–13: Goldwater or Rockefeller: Rockefeller 45, Goldwater 44, undecided 11.'
    n: '[[w.gallup-poll]], III, 1758. Names: Goldwater, Rockefeller.'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson]
  - id: cal.1962-03-09.desegregation-public-places-md
    when: Mar. 9
    date: '1962-03-09'
    thread: desegregation-public-places
    c: Maryland. Tawes calls the General Assembly into a one-day special session on opening places of public accommodation to all races, the bill having failed in the regular session, adjourned Mar. 8. It fails again.
    n: '*Maryland Manual*, 1963–64, [pp. 239–40](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--239.html). [[w.callcott-maryland-and-america-1940]]. Names: Tawes.'
    tags: [state:md, name:tawes-j-millard]
  - id: cal.1962-03-13.cuba
    when: Mar. 13
    date: '1962-03-13'
    thread: cuba
    c: 'The Joint Chiefs send McNamara Operation Northwoods: pretexts for invasion, staged attacks among them. Lemnitzer signs. Not adopted.'
    n: '[Lemnitzer to McNamara, "Justification for US Military Intervention in Cuba," Mar. 13, 1962](https://nsarchive2.gwu.edu/news/20010430/northwoods.pdf) (National Security Archive). Released 1997 by the Assassination Records Review Board (K–J Adm. II.H.3). See [[cal.1961-11-30.cuba]]. Names: McNamara, Lemnitzer.'
    tags: [name:mcnamara-robert-s, name:lemnitzer-lyman-l]
  - id: cal.1962-03-14.testing
    when: Mar. 14
    date: '1962-03-14'
    thread: testing
    also: [berlin-and-vienna]
    c: Eighteen-Nation Disarmament Committee opens at Geneva. Rusk and Gromyko on Berlin there.
    n: '[[w.seaborg-kennedy-khrushchev-and-the]]. FRUS vols. [7](https://history.state.gov/historicaldocuments/frus1961-63v07) and [15](https://history.state.gov/historicaldocuments/frus1961-63v15). Names: Rusk, Gromyko.'
    tags: [name:gromyko-andrei, name:rusk-dean]
  - id: cal.1962-03-15.program
    when: Mar. 15
    date: '1962-03-15'
    thread: jobs-and-wages
    c: 'Manpower Development and Training Act signed, [76 Stat. 23](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg23-2.pdf). Consumer message: four consumer rights.'
    n: Statute (K–J Cong. II.J.2). [Special Message to the Congress on Protecting the Consumer Interest](https://www.presidency.ucsb.edu/documents/special-message-the-congress-protecting-the-consumer-interest) (Mar. 15, 1962). [[w.peterson-restless]]. See [[cal.1961-02-02.program]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-03-16.japan-and-korea
    when: Mar. 16–24
    date: '1962-03-16'
    thread: japan-and-korea
    c: Seoul. The junta's Political Purification Law, Mar. 16, bars the old parties' men from politics. Harriman in Seoul, Mar. 16–17. Yun Po-sun resigns the presidency, Mar. 22; Park acting President. Check the dates.
    n: '[FRUS 1961–63, XXII, doc. 252](https://history.state.gov/historicaldocuments/frus1961-63v22/d252). See [[cal.1961-05-16.japan-and-korea]]. Names: Harriman, Yun, Park.'
    tags: [name:harriman-w-averell, name:yun-po-sun, name:park-chung-hee]
  - id: cal.1962-03-18.africa
    when: Mar. 18
    date: '1962-03-18'
    thread: africa
    also: [europe-and-the-alliance]
    c: Évian. France and the Algerian provisional government sign a cease-fire, from Mar. 19, with a referendum on independence to follow. Kennedy's statement.
    n: '[Statement by the President on the French-Algerian Cease-fire Agreement](https://www.presidency.ucsb.edu/documents/statement-the-president-the-french-algerian-cease-fire-agreement) (Mar. 18, 1962). FRUS 1961–63, XXI, docs. [62](https://history.state.gov/historicaldocuments/frus1961-63v21/d62), [63](https://history.state.gov/historicaldocuments/frus1961-63v21/d63). [[w.connelly-diplomatic-revolution]]; [[w.byrne-mecca-of-revolution]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-03-19.european-community
    when: Mar. 19
    date: '1962-03-19'
    thread: european-community
    also: [trade]
    c: 'Proclamations 3454 and 3455: escape-clause duties raised on machine-woven carpets and on sheet glass, put off Mar. 27 to June 17. Belgium the exporter most hurt. Spaak to Ball, Mar. 27: the step taken days after the Dillon Round agreement with the Common Market. June 4, the EEC Council withdraws Dillon Round concessions on American polyethylene, polystyrene, synthetic clothing, varnishes and paints.'
    n: '[Proclamation 3454](https://www.presidency.ucsb.edu/documents/proclamation-3454-modification-trade-agreement-concession-and-adjustment-duty-certain), [Proclamation 3455](https://www.presidency.ucsb.edu/documents/proclamation-3455-modification-trade-agreement-concessions-and-adjustment-duties-cylinder) (Mar. 19, 1962); [Proclamation 3458](https://www.presidency.ucsb.edu/documents/proclamation-3458-delaying-the-effective-dates-proclamation-no-3454-and-proclamation-no) (Mar. 27, 1962). FRUS 1961–63, IX, docs. [245](https://history.state.gov/historicaldocuments/frus1961-63v09/d245), [246](https://history.state.gov/historicaldocuments/frus1961-63v09/d246) (Spaak''s letter), [247](https://history.state.gov/historicaldocuments/frus1961-63v09/d247); XIII, docs. [29](https://history.state.gov/historicaldocuments/frus1961-63v13/d29)–[34](https://history.state.gov/historicaldocuments/frus1961-63v13/d34). [[w.zeiler-american-trade-and-power]]. See [[cal.1962-01-14.european-community]]. Names: Spaak, Ball.'
    tags: [name:kennedy-john-f, name:spaak-paul-henri, name:ball-george-w]
  - id: cal.1962-03-21.defense
    when: Mar. 21
    date: '1962-03-21'
    thread: defense
    c: The RS-70. Vinson's bill would "direct" bomber spending; after a Rose Garden walk with Kennedy, "authorize."
    n: '[108 Cong. Rec., House, Mar. 21, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt4/pdf/GPO-CRECB-1962-pt4-4-2.pdf). [House roll call 132](https://voteview.com/rollcall/RH0870132). [[w.kaplan-wizards-of-armageddon]]. See [[cal.1961-02-06.defense]]. Names: Vinson, LeMay.'
    tags: [name:vinson-carl, name:kennedy-john-f, name:lemay-curtis-e]
  - id: cal.1962-03-22.vietnam
    when: Mar. 22
    date: '1962-03-22'
    thread: vietnam
    c: Operation Sunrise, Bình Dương. The first strategic hamlets; villagers moved.
    n: 'FRUS 1961–63, II, docs. [103](https://history.state.gov/historicaldocuments/frus1961-63v02/d103), [138](https://history.state.gov/historicaldocuments/frus1961-63v02/d138). [[w.catton-diems-final-failure]]; [[w.thompson-defeating-communist-insurgency]]. See [[cal.1961-01-28.vietnam]]. Names: Ngô Đình Nhu, Thompson.'
    tags: [name:ngo-dinh-nhu, name:thompson-robert]
  - id: cal.1962-03-22.transition-and-staff
    when: Mar. 22
    date: '1962-03-22'
    thread: transition-and-staff
    also: [crime-and-hijacking]
    c: Hoover lunches alone with Kennedy, prepared by a memorandum on Campbell, Rosselli and Giancana. No record of what passed. A few hours later, by the White House logs, the last telephone contact between the White House and Campbell. Mar. 23, Hoover asks Edwards whether the CIA objects to prosecution in the wiretap case. It does.
    n: '[S. Rep. No. 94-465, 129–30 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=140) (K–J Adm. II.H.3). [[w.gage-g-man]]. See [[cal.1962-02-27.transition-and-staff]]; [[cal.1962-02-07.crime-and-hijacking]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Hoover, Campbell, Giancana, Edwards, Rosselli.'
    tags: [name:hoover-j-edgar, name:kennedy-john-f, name:campbell-judith, name:giancana-sam, name:rosselli-john, name:edwards-sheffield]
  - id: cal.1962-03-26.court
    when: Mar. 26
    date: '1962-03-26'
    thread: court
    c: '*Baker v. Carr*, [369 U.S. 186](https://tile.loc.gov/storage-services/service/ll/usrep/usrep369/usrep369186/usrep369186.pdf). Apportionment justiciable. Brennan for six; Frankfurter and Harlan dissent.'
    n: Opinions (K–J Cong. II.J.1). [[w.smith-on-democracys-doorstep-2014]]. See [[cal.1961-04-19.court]].
  - id: cal.1962-03-27.voting-rights
    when: Mar. 27
    date: '1962-03-27'
    thread: voting-rights
    c: Senate passes the poll tax amendment, [77–16](https://voteview.com/rollcall/RS0870226). Holland's resolution, moved by Mansfield in place of a minor bill.
    n: 'U.S. Const. amend. XXIV (K–J Cong. II.J.2). [[w.lawson-black-ballots]]; [[w.branch-parting-the-waters]]. Names: Holland, Mansfield.'
    tags: [name:holland-spessard-l, name:mansfield-mike]
  - id: cal.1962-03-28.opinion
    when: Mar. 28
    date: '1962-03-28'
    thread: opinion
    also: [testing]
    c: 'Gallup, Mar. 8–13: the United States to resume testing in the atmosphere, 66 percent; not, 25. Men 73 for, women 61.'
    n: '[[w.gallup-poll]], III, 1759.'
  - id: cal.1962-03-28.crime-and-hijacking
    when: Mar. 28–Apr. 20
    date: '1962-03-28'
    thread: crime-and-hijacking
    also: [cuba]
    c: 'The CIA asks the Justice Department not to prosecute in the Las Vegas wiretap case. Edwards to the FBI''s liaison, Mar. 28 or 29: prosecution "would endanger sensitive sources and methods used in a duly authorized intelligence project and would not be in the national interest." Hoover to Miller, Apr. 10: Edwards holds that prosecuting Maheu would expose "most sensitive information relating to the abortive Cuban invasion." Houston, the CIA''s General Counsel, Apr. 16: Miller sees "no major difficulty in stopping action for prosecution." Apr. 20, Houston asks it formally, "on grounds of security."'
    n: '[S. Rep. No. 94-465, 130–31 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=141) (K–J Adm. II.H.3). See [[cal.1962-02-07.crime-and-hijacking]]; [[cal.1962-03-22.transition-and-staff]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Edwards, Hoover, Miller, Maheu, Houston.'
    tags: [name:edwards-sheffield, name:hoover-j-edgar, name:maheu-robert-a, name:houston-lawrence, name:miller-herbert-j-jr]
  - id: cal.1962-03-29.latin-america
    when: Mar. 29
    date: '1962-03-29'
    thread: latin-america
    c: Argentina's armed forces depose Frondizi after Peronist gains.
    n: 'FRUS 1961–63, XII, docs. [179](https://history.state.gov/historicaldocuments/frus1961-63v12/d179), [180](https://history.state.gov/historicaldocuments/frus1961-63v12/d180). [[w.rabe-most-dangerous-area-in]]. See [[cal.1961-03-13.latin-america]]. Names: Frondizi.'
    tags: [name:frondizi-arturo]
  - id: cal.1962-03-30.court
    when: Mar. 30
    date: '1962-03-30'
    thread: court
    c: Whittaker retires. White named; confirmed Apr. 11.
    n: '[Statement by the President Upon Appointing Byron White to the Supreme Court](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-appointing-byron-white-the-supreme-court) (Mar. 30, 1962). [108 Cong. Rec., Senate, Apr. 11, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt5/pdf/GPO-CRECB-1962-pt5-6-1.pdf). [[w.hutchinson-man-who-once-was]]. See [[cal.1961-01-23.court]]. Names: White, Whittaker.'
    tags: [name:whittaker-charles-e, name:white-byron-r, name:kennedy-john-f]
  - id: cal.1962-03-30.soviet-union
    when: Mar. 30
    date: '1962-03-30'
    thread: soviet-union
    c: 'Dobrynin presents his credentials, fifteen minutes, with Khrushchev''s good wishes. Kennedy: the Vienna agreement on Laos still valid, the cease-fire to be kept; a summit of four or five complicated, an informal meeting like Vienna useful. Menshikov had been recalled in December; Kennedy approved Dobrynin Dec. 27.'
    n: 'FRUS 1961–63, V, docs. [138](https://history.state.gov/historicaldocuments/frus1961-63v05/d138), [174](https://history.state.gov/historicaldocuments/frus1961-63v05/d174). [[w.dobrynin-in-confidence]], 58–59. See [[cal.1961-01-20.soviet-union]]. Names: Dobrynin, Khrushchev, Menshikov.'
    tags: [name:dobrynin-anatoly, name:kennedy-john-f, name:khrushchev-nikita-s, name:menshikov-mikhail]
  - id: cal.1962-03-31.steel
    when: Mar. 31
    date: '1962-03-31'
    thread: steel
    c: Steelworkers and companies settle early. No wage increase; about ten cents in benefits. Goldberg brokered it.
    n: '[Telephone Messages to Labor and Management Leaders following the Steel Settlement](https://www.presidency.ucsb.edu/documents/telephone-messages-labor-and-management-leaders-following-the-steel-settlement) (Mar. 31, 1962). See [[cal.1961-09-06.steel]]. Names: Goldberg.'
    tags: [name:goldberg-arthur-j]
