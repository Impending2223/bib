# Cal. XXII August 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXII
entries:
  - id: cal.1962-08-01.foreign-aid
    when: Aug. 1
    date: '1962-08-01'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1962 signed. Hickenlooper amendment: no aid to a country that expropriates without compensation.'
    n: 'Pub. L. No. 87-565, 76 Stat. 255 (1962). See [[cal.1961-03-22.foreign-aid]]. Names: Hickenlooper (Opp. III.A).'
  - id: cal.1962-08-01.albany
    when: Aug. 1
    date: '1962-08-01'
    thread: albany
    c: Press conference. Albany's refusal to negotiate "wholly inexplicable."
    n: News Conference (Aug. 1, 1962). See [[cal.1961-11-17.albany]].
  - id: cal.1962-08-07.program
    when: Aug. 7
    date: '1962-08-07'
    thread: program
    c: Kelsey receives the President's Award for Distinguished Federal Civilian Service.
    n: See [[cal.1962-07-15.program]].
  - id: cal.1962-08-10.albany
    when: Aug. 10
    date: '1962-08-10'
    thread: albany
    c: 'King leaves Albany. Parks and library closed rather than integrated. King later: the mistake was attacking segregation in general.'
    n: King, *Why We Can't Wait* (K–J Cong. II.I.4). See [[cal.1961-11-17.albany]].
  - id: cal.1962-08-13.economy
    when: Aug. 13
    date: '1962-08-13'
    thread: economy
    c: Television address. No tax cut now; reduction and reform in January.
    n: 'Radio and Television Report to the American People on the State of the National Economy (Aug. 13, 1962). Stein, *The Fiscal Revolution in America* (K–J Adm. II.B). See [[cal.1961-01-05.economy]]. Names: Heller, Dillon (K–J Adm. III.H).'
  - id: cal.1962-08-14.rules
    when: Aug. 14
    date: '1962-08-14'
    thread: rules
    c: Senate invokes cloture on the communications satellite bill, 63–27, against a liberal filibuster. The first since 1927. Signed Aug. 31.
    n: 'Pub. L. No. 87-624 (K–J Cong. II.J.2). Senate cloture table (see [[cal.1961-09-19.rules]]). Names: Kefauver, Morse, Gore (K–J Cong. III.B).'
  - id: cal.1962-08-17.berlin-and-vienna
    when: Aug. 17
    date: '1962-08-17'
    thread: berlin-and-vienna
    c: Peter Fechter, eighteen, shot at the wall. Dies unaided in sight of the West. Riots in West Berlin.
    n: See [[cal.1961-08-13.berlin-and-vienna]].
  - id: cal.1962-08-22.missile-crisis
    when: Aug. 22–23
    date: '1962-08-22'
    thread: missile-crisis
    c: 'McCone warns Kennedy the shipments may include offensive missiles. Aug. 23: NSAM 181, contingency planning.'
    n: 'NSAM No. 181 (Aug. 23, 1962). FRUS vol. 10. Robarge, *John McCone* (K–J Adm. II.G.6). See [[cal.1962-05-24.missile-crisis]]. Names: McCone (K–J Adm. III.I).'
  - id: cal.1962-08-27.voting-rights
    when: Aug. 27
    date: '1962-08-27'
    thread: voting-rights
    c: House passes the poll tax amendment, 294–86. To the states; ratified Jan. 23, 1964.
    n: See [[cal.1962-03-27.voting-rights]].
  - id: cal.1962-08-27.elections-1962
    when: Aug. 27
    date: '1962-08-27'
    thread: elections-1962
    c: Edward Kennedy and McCormack debate in South Boston. "If his name was Edward Moore, with his qualifications . . . your candidacy would be a joke."
    n: 'Clymer, *Edward M. Kennedy* (K–J Cong. II.I.1). See [[cal.1962-05-05.elections-1962]]. Names: Edward M. Kennedy (K–J Cong. III.B); McCormack (K–J Cong. III.C).'
  - id: cal.1962-08-28.court
    when: Aug. 28
    date: '1962-08-28'
    thread: court
    c: Frankfurter retires. Goldberg named, Aug. 29; Wirtz to Labor.
    n: 'Stebenne, *Arthur J. Goldberg* (K–J Adm. II.G.5). See [[cal.1961-01-23.court]]. Names: Goldberg, Wirtz (K–J Adm. III.G); Frankfurter (K–J Cong. III.G).'
  - id: cal.1962-08-29.missile-crisis
    when: Aug. 29
    date: '1962-08-29'
    thread: missile-crisis
    c: A U-2 photographs SAM sites in western Cuba.
    n: See [[cal.1962-05-24.missile-crisis]].
  - id: cal.1962-08-31.missile-crisis
    when: Aug. 31
    date: '1962-08-31'
    thread: missile-crisis
    c: 'Keating on the Senate floor: Soviet troops and rocket bases in Cuba.'
    n: 'See [[cal.1962-05-24.missile-crisis]]. Names: Keating (Opp. III.B).'
