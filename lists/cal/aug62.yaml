# Cal. XXXIII August 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXIII
entries:
  - id: cal.1962-08-01.foreign-aid
    when: Aug. 1
    date: '1962-08-01'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1962 signed, [76 Stat. 255](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg255.pdf). Hickenlooper amendment: no aid to a country that expropriates without compensation.'
    n: 'See [[cal.1961-03-22.foreign-aid]]. Names: Hickenlooper (Opp. III.A).'
    tags: [name:hickenlooper-bourke-b, name:kennedy-john-f]
  - id: cal.1962-08-01.albany
    when: Aug. 1
    date: '1962-08-01'
    thread: georgia
    c: Press conference. Albany's refusal to negotiate "wholly inexplicable."
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-186) (Aug. 1, 1962). See [[cal.1961-11-17.albany]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-01.opinion
    when: Aug. 1
    date: '1962-08-01'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: an income tax cut now, if it means more debt, 19 percent for, 72 against. Of those who call their taxes too high, 31 for, 61 against.'
    n: '[[w.gallup-poll]], III, 1777.'
  - id: cal.1962-08-01.state-constitutions-mi
    when: Aug. 1
    date: '1962-08-01'
    thread: state-constitutions
    c: Michigan's constitutional convention adjourns at Lansing, its constitution and address to the people adopted, after ten months. A four-year term for governor; a civil rights commission; a flat-rate income tax permitted, a graduated one forbidden (Check); Senate seats by population and area. To the voters Apr. 1, 1963.
    n: '[[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]. See [[cal.1961-10-03.states-and-cities]]. Names: Romney (Opp. III.H).'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1962-08-02.governors-tn
    when: Aug. 2
    date: '1962-08-02'
    thread: governors
    also: [elections-1962]
    c: 'Tennessee, Democratic primary for governor: Clement, governor 1953–59, 309,333, 42.5 percent; Olgiati, mayor of Chattanooga, 211,812, 29.1; William Farris, of Memphis, 202,813, 27.9. A plurality nominates.'
    n: 'Votes: Wikipedia, ["1962 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1962_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. [[w.greene-lead-me-on]]. Names: Clement (K–J Cong. III.K); Olgiati (K–J Cong. III.F); Farris (K–J Cong. III.K).'
    tags: [state:tn, name:clement-frank-g, name:olgiati-p-r, name:farris-william-w]
  - id: cal.1962-08-03.opinion
    when: Aug. 3
    date: '1962-08-03'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: the government to act to improve business, 52 percent; not, 45. If it acts, a tax cut for all, 59; spending on public works, 28.'
    n: '[[w.gallup-poll]], III, 1777.'
  - id: cal.1962-08-07.program
    when: Aug. 7
    date: '1962-08-07'
    thread: health
    c: Kelsey receives the President's Award for Distinguished Federal Civilian Service.
    n: '[Remarks Upon Presenting the President''s Awards for Distinguished Federal Civilian Service](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-presidents-awards-for-distinguished-federal-civilian-service) (Aug. 7, 1962). See [[cal.1962-07-15.program]]. Names: Kelsey (K–J Cong. III.K).'
    tags: [name:kelsey-frances-o, name:kennedy-john-f]
  - id: cal.1962-08-07.state-constitutions-mo
    when: Aug. 7
    date: '1962-08-07'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Missouri, with the primary, refuses four amendments: pensions for employees of political subdivisions, 146,566 to 253,617; taxes above the limit for airports and university extension, 123,704 to 261,942; pensions for retired teachers, 179,601 to 210,093; the St. Louis school tax to three times the limit, 127,662 to 237,243.'
    n: '[*Official Manual, State of Missouri, 1963–1964*, 1255–1256](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/36575). See [[cal.1960-11-08.state-constitutions-mo]].'
    tags: [state:mo, city:st-louis]
  - id: cal.1962-08-07.governors-ks
    when: Aug. 7
    date: '1962-08-07'
    thread: governors
    also: [elections-1962]
    c: 'Kansas, governor. Democratic primary: Saffels 59.7 percent, one other 40.3. Republican: Governor Anderson 84.1, one other 15.9.'
    n: 'Votes: [Wikipedia, "1962 Kansas gubernatorial election"](https://en.wikipedia.org/wiki/1962_Kansas_gubernatorial_election) (Check: the *Kansas Election Statistics* of the year). [[w.socolofsky-kansas-governors]]. Names: Anderson (K–J Cong. III.F); Saffels (K–J Cong. III.K).'
    tags: [state:ks, name:saffels-dale-e, name:anderson-john-jr]
  - id: cal.1962-08-10.albany
    when: Aug. 10
    date: '1962-08-10'
    thread: georgia
    also: [desegregation-public-places, king]
    c: 'King leaves Albany. Parks and library closed rather than integrated. King later: the mistake was attacking segregation in general.'
    n: '[[w.king-why-we-cant-wait]]. See [[cal.1961-11-17.albany]]. Names: King (K–J Cong. III.H).'
    tags: [name:king-martin-luther-jr]
  - id: cal.1962-08-13.economy
    when: Aug. 13
    date: '1962-08-13'
    thread: economy
    c: Television address. No tax cut now; reduction and reform in January.
    n: '[Radio and Television Report to the American People on the State of the National Economy](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-state-the-national-economy) (Aug. 13, 1962). [[w.stein-fiscal-revolution-in-america]]. See [[cal.1961-01-05.economy]]. Names: Heller, Dillon (K–J Adm. III.H).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-14.rules
    when: Aug. 14
    date: '1962-08-14'
    thread: rules
    c: Senate invokes cloture on the communications satellite bill, [63–27](https://voteview.com/rollcall/RS0870318), against a liberal filibuster. The first since 1927. Signed Aug. 31, [76 Stat. 419](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg419.pdf).
    n: 'Statute (K–J Cong. II.J.2). Senate cloture table (see [[cal.1961-09-19.rules]]). Names: Kefauver, Morse, Gore (K–J Cong. III.B).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-17.berlin-and-vienna
    when: Aug. 17
    date: '1962-08-17'
    thread: berlin-and-vienna
    c: Peter Fechter, eighteen, shot at the wall. Dies unaided in sight of the West. Riots in West Berlin.
    n: 'FRUS 1961–63, XV, docs. [95](https://history.state.gov/historicaldocuments/frus1961-63v15/d95), [96](https://history.state.gov/historicaldocuments/frus1961-63v15/d96). See [[cal.1961-08-13.berlin-and-vienna]]. Names: Fechter (K–J Adm. III.J).'
    tags: [name:fechter-peter]
  - id: cal.1962-08-22.missile-crisis
    when: Aug. 22–23
    date: '1962-08-22'
    thread: missile-crisis
    c: 'McCone warns Kennedy the shipments may include offensive missiles. Aug. 23: NSAM 181, contingency planning.'
    n: '[NSAM No. 181](https://history.state.gov/historicaldocuments/frus1961-63v10/d386) (Aug. 23, 1962). [FRUS vol. 10](https://history.state.gov/historicaldocuments/frus1961-63v10). [[w.robarge-john-mccone-as-director]]. See [[cal.1962-05-24.missile-crisis]]. Names: McCone (K–J Adm. III.I).'
    tags: [name:mccone-john-a, name:kennedy-john-f]
  - id: cal.1962-08-22.opinion
    when: Aug. 22
    date: '1962-08-22'
    thread: opinion
    also: [medicare]
    c: 'Gallup, July 26–31: 81 percent have heard of Kennedy''s Medicare plan; of them, half know it is paid through Social Security. Medicare through Social Security, 44; voluntary private insurance, 40.'
    n: '[[w.gallup-poll]], III, 1781.'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-27.voting-rights
    when: Aug. 27
    date: '1962-08-27'
    thread: voting-rights
    c: House passes the poll tax amendment, [294–86](https://voteview.com/rollcall/RH0870193). To the states, [76 Stat. 1259](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg1259.pdf); ratified Jan. 23, 1964.
    n: '[108 Cong. Rec., House, Aug. 27, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt13/pdf/GPO-CRECB-1962-pt13-7-1.pdf). See [[cal.1962-03-27.voting-rights]].'
  - id: cal.1962-08-27.elections-1962
    when: Aug. 27
    date: '1962-08-27'
    thread: elections-1962
    c: Edward Kennedy and McCormack debate in South Boston. "If his name was Edward Moore, with his qualifications . . . your candidacy would be a joke."
    n: '[[w.clymer-edward-m-kennedy]]. See [[cal.1962-05-05.elections-1962]]. Names: Edward M. Kennedy (K–J Cong. III.B); McCormack (K–J Cong. III.K).'
    tags: [name:kennedy-edward-m, name:mccormack-edward-j-jr]
  - id: cal.1962-08-28.court
    when: Aug. 28
    date: '1962-08-28'
    thread: court
    c: Frankfurter retires. Goldberg named, Aug. 29; Wirtz to Labor.
    n: '[Letter to Justice Frankfurter Upon His Retirement From the Supreme Court](https://www.presidency.ucsb.edu/documents/letter-justice-frankfurter-upon-his-retirement-from-the-supreme-court) (Aug. 29, 1962); [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-187) (Aug. 29, 1962). [[w.stebenne-arthur-j-goldberg]]. See [[cal.1961-01-23.court]]. Names: Goldberg, Wirtz (K–J Adm. III.G); Frankfurter (K–J Cong. III.G).'
    tags: [name:frankfurter-felix, name:goldberg-arthur-j, name:wirtz-w-willard, name:kennedy-john-f]
  - id: cal.1962-08-29.missile-crisis
    when: Aug. 29
    date: '1962-08-29'
    thread: missile-crisis
    c: A U-2 photographs SAM sites in western Cuba.
    n: '[FRUS 1961–63, X, doc. 395](https://history.state.gov/historicaldocuments/frus1961-63v10/d395). See [[cal.1962-05-24.missile-crisis]].'
  - id: cal.1962-08-31.missile-crisis
    when: Aug. 31
    date: '1962-08-31'
    thread: missile-crisis
    c: 'Keating on the Senate floor: Soviet troops and rocket bases in Cuba.'
    n: '[Cong. Rec., Senate, Aug. 31, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt14/pdf/GPO-CRECB-1962-pt14-1-2.pdf), 18359–60. See [[cal.1962-05-24.missile-crisis]]. Names: Keating (Opp. III.B).'
    tags: [name:keating-kenneth-b]
  - id: cal.1962-08.governors-wy
    when: Aug.
    date: 1962-08
    thread: governors
    also: [elections-1962]
    c: 'Wyoming''s primary, for governor. Democratic: Governor Gage, the secretary of state who succeeded Hickey on his appointment to the Senate, 21,051, 55.5 percent; Jack, the nominee of 1954, 16,875. Republican: Hansen, a Teton County commissioner, 28,494, 57.0; Crowell 16,906, 33.8. Check the day.'
    n: 'Votes: [Wikipedia, "1962 Wyoming gubernatorial election"](https://en.wikipedia.org/wiki/1962_Wyoming_gubernatorial_election); Check: *1963 Wyoming Official Directory and 1962 Election Returns*, 56–58. [[w.larson-history-of-wyoming]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1961-01-03.rules]]. Names: Gage (K–J Cong. III.F); Hickey, Jack, Crowell (K–J Cong. III.K); Hansen (Opp. III.H).'
    tags: [state:wy, name:gage-jack-r, name:jack-william-m, name:hansen-clifford-p, name:crowell-charles-m, name:hickey-john-j]
