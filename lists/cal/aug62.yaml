# Cal. XXII August 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXII
entries:
  - id: cal.1962-08-01.foreign-aid
    when: Aug. 1
    date: '1962-08-01'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1962 signed, [76 Stat. 255](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg255.pdf). Hickenlooper amendment: no aid to a country that expropriates without compensation.'
    n: 'See [[cal.1961-03-22.foreign-aid]]. Names: Hickenlooper (Opp. III.A).'
    tags: [name:hickenlooper-bourke-b, name:kennedy-john-f]
  - id: cal.1962-08-01.albany
    when: Aug. 1
    date: '1962-08-01'
    thread: albany
    c: Press conference. Albany's refusal to negotiate "wholly inexplicable."
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-186) (Aug. 1, 1962). See [[cal.1961-11-17.albany]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-07.program
    when: Aug. 7
    date: '1962-08-07'
    thread: health
    c: Kelsey receives the President's Award for Distinguished Federal Civilian Service.
    n: '[Remarks Upon Presenting the President''s Awards for Distinguished Federal Civilian Service](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-presidents-awards-for-distinguished-federal-civilian-service) (Aug. 7, 1962). See [[cal.1962-07-15.program]].'
    tags: [name:kelsey-frances-o, name:kennedy-john-f]
  - id: cal.1962-08-10.albany
    when: Aug. 10
    date: '1962-08-10'
    thread: albany
    c: 'King leaves Albany. Parks and library closed rather than integrated. King later: the mistake was attacking segregation in general.'
    n: King, *Why We Can't Wait* (K–J Cong. II.I.4). See [[cal.1961-11-17.albany]].
    tags: [name:king-martin-luther-jr]
  - id: cal.1962-08-13.economy
    when: Aug. 13
    date: '1962-08-13'
    thread: economy
    c: Television address. No tax cut now; reduction and reform in January.
    n: '[Radio and Television Report to the American People on the State of the National Economy](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-state-the-national-economy) (Aug. 13, 1962). Stein, *The Fiscal Revolution in America* (K–J Adm. II.B). See [[cal.1961-01-05.economy]]. Names: Heller, Dillon (K–J Adm. III.H).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-14.rules
    when: Aug. 14
    date: '1962-08-14'
    thread: rules
    c: Senate invokes cloture on the communications satellite bill, [63–27](https://voteview.com/rollcall/RS0870318), against a liberal filibuster. The first since 1927. Signed Aug. 31, [76 Stat. 419](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg419.pdf).
    n: 'Statute (K–J Cong. II.J.2). Senate cloture table (see [[cal.1961-09-19.rules]]). Names: Kefauver, Morse, Gore (K–J Cong. III.B).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-17.berlin-and-vienna
    when: Aug. 17
    date: '1962-08-17'
    thread: berlin-and-vienna
    c: Peter Fechter, eighteen, shot at the wall. Dies unaided in sight of the West. Riots in West Berlin.
    n: 'FRUS 1961–63, XV, docs. [95](https://history.state.gov/historicaldocuments/frus1961-63v15/d95), [96](https://history.state.gov/historicaldocuments/frus1961-63v15/d96). See [[cal.1961-08-13.berlin-and-vienna]].'
    tags: [name:fechter-peter]
  - id: cal.1962-08-22.missile-crisis
    when: Aug. 22–23
    date: '1962-08-22'
    thread: missile-crisis
    c: 'McCone warns Kennedy the shipments may include offensive missiles. Aug. 23: NSAM 181, contingency planning.'
    n: '[NSAM No. 181](https://history.state.gov/historicaldocuments/frus1961-63v10/d386) (Aug. 23, 1962). [FRUS vol. 10](https://history.state.gov/historicaldocuments/frus1961-63v10). Robarge, *John McCone* (K–J Adm. II.G.6). See [[cal.1962-05-24.missile-crisis]]. Names: McCone (K–J Adm. III.I).'
    tags: [name:mccone-john-a, name:kennedy-john-f]
  - id: cal.1962-08-27.voting-rights
    when: Aug. 27
    date: '1962-08-27'
    thread: voting-rights
    c: House passes the poll tax amendment, [294–86](https://voteview.com/rollcall/RH0870193). To the states, [76 Stat. 1259](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg1259.pdf); ratified Jan. 23, 1964.
    n: '[108 Cong. Rec., House, Aug. 27, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt13/pdf/GPO-CRECB-1962-pt13-7-1.pdf). See [[cal.1962-03-27.voting-rights]].'
  - id: cal.1962-08-27.elections-1962
    when: Aug. 27
    date: '1962-08-27'
    thread: elections-1962
    c: Edward Kennedy and McCormack debate in South Boston. "If his name was Edward Moore, with his qualifications . . . your candidacy would be a joke."
    n: 'Clymer, *Edward M. Kennedy* (K–J Cong. II.I.1). See [[cal.1962-05-05.elections-1962]]. Names: Edward M. Kennedy (K–J Cong. III.B); McCormack (K–J Cong. III.C).'
    tags: [name:kennedy-edward-m, name:mccormack-edward-j-jr]
  - id: cal.1962-08-28.court
    when: Aug. 28
    date: '1962-08-28'
    thread: court
    c: Frankfurter retires. Goldberg named, Aug. 29; Wirtz to Labor.
    n: '[Letter to Justice Frankfurter Upon His Retirement From the Supreme Court](https://www.presidency.ucsb.edu/documents/letter-justice-frankfurter-upon-his-retirement-from-the-supreme-court) (Aug. 29, 1962); [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-187) (Aug. 29, 1962). Stebenne, *Arthur J. Goldberg* (K–J Adm. II.G.5). See [[cal.1961-01-23.court]]. Names: Goldberg, Wirtz (K–J Adm. III.G); Frankfurter (K–J Cong. III.G).'
    tags: [name:frankfurter-felix, name:goldberg-arthur-j, name:wirtz-w-willard]
  - id: cal.1962-08-29.missile-crisis
    when: Aug. 29
    date: '1962-08-29'
    thread: missile-crisis
    c: A U-2 photographs SAM sites in western Cuba.
    n: '[FRUS 1961–63, X, doc. 395](https://history.state.gov/historicaldocuments/frus1961-63v10/d395). See [[cal.1962-05-24.missile-crisis]].'
  - id: cal.1962-08-31.missile-crisis
    when: Aug. 31
    date: '1962-08-31'
    thread: missile-crisis
    c: 'Keating on the Senate floor: Soviet troops and rocket bases in Cuba.'
    n: '[Cong. Rec., Senate, Aug. 31, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt14/pdf/GPO-CRECB-1962-pt14-1-2.pdf), 18359–60. See [[cal.1962-05-24.missile-crisis]]. Names: Keating (Opp. III.B).'
    tags: [name:keating-kenneth-b]
