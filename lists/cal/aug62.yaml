# Cal. XXXIII August 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXIII
entries:
  - id: cal.1962-08-01.foreign-aid
    when: Aug. 1
    date: '1962-08-01'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1962 signed, [76 Stat. 255](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg255.pdf). Hickenlooper amendment: no aid to a country that expropriates without compensation.'
    n: 'See [[cal.1961-03-22.foreign-aid]]. Names: Hickenlooper.'
    tags: [name:hickenlooper-bourke-b, name:kennedy-john-f]
  - id: cal.1962-08-01.albany
    when: Aug. 1
    date: '1962-08-01'
    thread: georgia-albany
    c: Press conference. Albany's refusal to negotiate "wholly inexplicable."
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-186) (Aug. 1, 1962). See [[cal.1961-11-17.albany]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-01.opinion
    when: Aug. 1
    date: '1962-08-01'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: an income tax cut now, if it means more debt, 19 percent for, 72 against. Of those who call their taxes too high, 31 for, 61 against.'
    n: '[[w.gallup-poll]], III, 1777.'
  - id: cal.1962-08-01.state-constitutions-mi
    when: Aug. 1
    date: '1962-08-01'
    thread: state-constitutions
    c: Michigan's constitutional convention adjourns at Lansing, its constitution and address to the people adopted, after ten months. A four-year term for governor; a civil rights commission; a flat-rate income tax permitted, a graduated one forbidden (Check); Senate seats by population and area. To the voters Apr. 1, 1963.
    n: '[Michigan Constitutional Convention, *Official Record* (1962), 3290–3316](https://archive.org/details/sim_michigan-constitutional-convention-1961-official-record_1962/page/n1507). [[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]. See [[cal.1961-10-03.states-and-cities]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1962-08-02.governors-tn
    when: Aug. 2
    date: '1962-08-02'
    thread: governors
    also: [elections-1962]
    c: 'Tennessee, Democratic primary for governor: Clement, governor 1953–59, 309,333, 42.5 percent; Olgiati, mayor of Chattanooga, 211,812, 29.1; William Farris, of Memphis, 202,813, 27.9. A plurality nominates.'
    n: 'Votes: Wikipedia, ["1962 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1962_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. [[w.greene-lead-me-on]]. Names: Clement, Olgiati, Farris.'
    tags: [state:tn, name:clement-frank-g, name:olgiati-p-r, name:farris-william-w]
  - id: cal.1962-08-02.amendments
    when: Aug. 2
    date: '1962-08-02'
    thread: amendments
    also: [court, congress]
    c: Senate Judiciary Committee, Eastland's, hears witnesses on the amendments to permit prayer in the public schools, one of its two days of hearings after *Engel*. More than fifty such amendments introduced in Congress within three days of the decision, fifty-seven by the session's end. None reported.
    n: '*Prayers in Public Schools and Other Matters: Hearings before the Senate Committee on the Judiciary*, 87th Cong. (1962) (Check the other day and a digitized copy); the transcript of Aug. 2 cited by Robertson, [108 Cong. Rec. 17,593–94](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt13/pdf/GPO-CRECB-1962-pt13-6-1.pdf) (1962). [Congressional Research Service, *School Prayer: The Congressional Response, 1962–1998*](https://www.everycrsreport.com/reports/96-846.html) (1998). [[w.dierenfield-battle-over-school-prayer]]. See [[cal.1962-06-25.court]]. Names: Eastland.'
    tags: [name:eastland-james-o]
  - id: cal.1962-08-03.legislatures-ok
    when: Aug. 3
    date: '1962-08-03'
    thread: legislatures
    c: 'The Oklahoma court''s order: standards for the Legislature, meeting in January, to reapportion by; failing that, the court to do it.'
    n: '*Moss v. Burkhart*, [207 F. Supp. 885](https://static.case.law/f-supp/207/case-pdfs/0885-01.pdf) (W.D. Okla. 1962) (the order of Aug. 3). See [[cal.1962-06-19.legislatures-ok]].'
    tags: [state:ok]
  - id: cal.1962-08-03.opinion
    when: Aug. 3
    date: '1962-08-03'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: the government to act to improve business, 52 percent; not, 45. If it acts, a tax cut for all, 59; spending on public works, 28.'
    n: '[[w.gallup-poll]], III, 1777.'
  - id: cal.1962-08-07.program
    when: Aug. 7
    date: '1962-08-07'
    thread: health
    c: Kelsey receives the President's Award for Distinguished Federal Civilian Service.
    n: '[Remarks Upon Presenting the President''s Awards for Distinguished Federal Civilian Service](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-presidents-awards-for-distinguished-federal-civilian-service) (Aug. 7, 1962). See [[cal.1962-07-15.program]]. Names: Kelsey.'
    tags: [name:kelsey-frances-o, name:kennedy-john-f]
  - id: cal.1962-08-07.state-constitutions-mo
    when: Aug. 7
    date: '1962-08-07'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Missouri, with the primary, refuses four amendments: pensions for employees of political subdivisions, 146,566 to 253,617; taxes above the limit for airports and university extension, 123,704 to 261,942; pensions for retired teachers, 179,601 to 210,093; the St. Louis school tax to three times the limit, 127,662 to 237,243.'
    n: '[*Official Manual, State of Missouri, 1963–1964*, 1255–1256](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/36575). See [[cal.1960-11-08.state-constitutions-mo]].'
    tags: [state:mo, city:st-louis]
  - id: cal.1962-08-07.governors-ks
    when: Aug. 7
    date: '1962-08-07'
    thread: governors
    also: [elections-1962]
    c: 'Kansas, governor. Democratic primary: Saffels 59.7 percent, one other 40.3. Republican: Governor Anderson 84.1, one other 15.9.'
    n: 'Votes: [Wikipedia, "1962 Kansas gubernatorial election"](https://en.wikipedia.org/wiki/1962_Kansas_gubernatorial_election) (Check: the *Kansas Election Statistics* of the year). [[w.socolofsky-kansas-governors]]. Names: Anderson, Saffels.'
    tags: [state:ks, name:saffels-dale-e, name:anderson-john-jr]
  - id: cal.1962-08-10.albany
    when: Aug. 10
    date: '1962-08-10'
    thread: georgia-albany
    also: [desegregation-public-places, king]
    c: 'King leaves Albany. Parks and library closed rather than integrated. King later: the mistake was attacking segregation in general.'
    n: '[[w.king-why-we-cant-wait]]. See [[cal.1961-11-17.albany]]. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1962-08-13.economy
    when: Aug. 13
    date: '1962-08-13'
    thread: economy
    c: Television address. No tax cut now; reduction and reform in January.
    n: '[Radio and Television Report to the American People on the State of the National Economy](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-state-the-national-economy) (Aug. 13, 1962). [[w.stein-fiscal-revolution-in-america]]. See [[cal.1961-01-05.economy]]. Names: Heller, Dillon.'
    tags: [name:kennedy-john-f, name:heller-walter-w, name:dillon-c-douglas]
  - id: cal.1962-08-14.rules
    when: Aug. 14
    date: '1962-08-14'
    thread: rules
    c: Senate invokes cloture on the communications satellite bill, [63–27](https://voteview.com/rollcall/RS0870318), against a liberal filibuster. The first since 1927. Signed Aug. 31, [76 Stat. 419](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg419.pdf).
    n: 'Statute (K–J Cong. II.J.2). Senate cloture table (see [[cal.1961-09-19.rules]]). Names: Kefauver, Morse, Gore.'
    tags: [name:kennedy-john-f, name:kefauver-estes, name:morse-wayne, name:gore-albert-sr]
  - id: cal.1962-08-15.middle-east
    when: Aug. 15–16
    date: '1962-08-15'
    thread: middle-east
    c: The Hawk. Kennedy writes Ben Gurion, Aug. 15, and Nasser, Aug. 16.
    n: 'FRUS 1961–63, XVIII, docs. [21](https://history.state.gov/historicaldocuments/frus1961-63v18/d21), [22](https://history.state.gov/historicaldocuments/frus1961-63v18/d22). [[w.gazit-president-kennedys-policy-toward]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.ben-zvi-decade-of-transition]]; [[w.bass-support-any-friend]]; [[w.ben-zvi-lyndon-b-johnson-and]]. See [[cal.1961-05-30.middle-east]]. Names: Kennedy, Ben Gurion, Nasser.'
    tags: [name:kennedy-john-f, name:ben-gurion-david, name:nasser-gamal-abdel]
  - id: cal.1962-08-16.conservation
    when: Aug. 16–18
    date: '1962-08-16'
    thread: conservation
    c: Fryingpan–Arkansas project signed, [76 Stat. 389](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg389.pdf). Aug. 17, Kennedy at Pueblo and at the dedication of the Oahe Dam on the Missouri at Pierre, S.D.; Aug. 18, at the ground-breaking for the San Luis Dam at Los Banos, Cal., with Brown, and at Fresno, after inspecting the western projects.
    n: 'Statute (K–J Cong. II.J.2). [Remarks Upon Signing Bill Authorizing the Fryingpan-Arkansas Project](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-authorizing-the-fryingpan-arkansas-project) (Aug. 16, 1962); [Remarks in Pueblo, Colorado Following Approval of the Fryingpan-Arkansas Project](https://www.presidency.ucsb.edu/documents/remarks-pueblo-colorado-following-approval-the-fryingpan-arkansas-project); [Remarks at the Dedication of the Oahe Dam, Pierre, South Dakota](https://www.presidency.ucsb.edu/documents/remarks-the-dedication-the-oahe-dam-pierre-south-dakota) (Aug. 17, 1962); [Remarks in Los Banos, California, at the Ground-Breaking Ceremonies for the San Luis Dam](https://www.presidency.ucsb.edu/documents/remarks-los-banos-california-the-ground-breaking-ceremonies-for-the-san-luis-dam); [Remarks at the Air Terminal in Fresno, California, After Inspecting Western Conservation Projects](https://www.presidency.ucsb.edu/documents/remarks-the-air-terminal-fresno-california-after-inspecting-western-conservation-projects) (Aug. 18, 1962). [[w.smith-john-kennedy-stewart-udall]]. See [[cal.1961-02-23.conservation]]. Names: Brown.'
    tags: [name:kennedy-john-f, name:brown-edmund-g]
  - id: cal.1962-08-17.berlin-and-vienna
    when: Aug. 17
    date: '1962-08-17'
    thread: berlin-and-vienna
    c: Peter Fechter, eighteen, shot at the wall. Dies unaided in sight of the West. Riots in West Berlin.
    n: 'FRUS 1961–63, XV, docs. [95](https://history.state.gov/historicaldocuments/frus1961-63v15/d95), [96](https://history.state.gov/historicaldocuments/frus1961-63v15/d96). See [[cal.1961-08-13.berlin-and-vienna]]. Names: Fechter.'
    tags: [name:fechter-peter]
  - id: cal.1962-08-19.middle-east
    when: Aug. 19
    date: '1962-08-19'
    thread: middle-east
    also: [middle-east-johnson-plan]
    c: 'Feldman to Ben Gurion and Meir: the President has decided to make the Hawk available to Israel; Nasser to be told. Feldman asks Israel to let the Johnson Plan for the Palestine refugees go forward.'
    n: 'FRUS 1961–63, XVIII, doc. [24](https://history.state.gov/historicaldocuments/frus1961-63v18/d24). See [[cal.1962-08-15.middle-east]]. Names: Feldman, Ben Gurion, Meir, Nasser.'
    tags: [name:feldman-myer, name:ben-gurion-david, name:meir-golda, name:nasser-gamal-abdel, name:kennedy-john-f]
  - id: cal.1962-08-22.missile-crisis
    when: Aug. 22–23
    date: '1962-08-22'
    thread: missile-crisis
    c: 'McCone warns Kennedy the shipments may include offensive missiles. Aug. 23: NSAM 181, contingency planning.'
    n: '[NSAM No. 181](https://history.state.gov/historicaldocuments/frus1961-63v10/d386) (Aug. 23, 1962). [FRUS vol. 10](https://history.state.gov/historicaldocuments/frus1961-63v10). [[w.robarge-john-mccone-as-director]]. See [[cal.1962-05-24.missile-crisis]]. Names: McCone.'
    tags: [name:mccone-john-a, name:kennedy-john-f]
  - id: cal.1962-08-22.opinion
    when: Aug. 22
    date: '1962-08-22'
    thread: opinion
    also: [medicare]
    c: 'Gallup, July 26–31: 81 percent have heard of Kennedy''s Medicare plan; of them, half know it is paid through Social Security. Medicare through Social Security, 44; voluntary private insurance, 40.'
    n: '[[w.gallup-poll]], III, 1781.'
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-23.middle-east
    when: Aug. 23–26
    date: '1962-08-23'
    thread: middle-east-johnson-trip
    c: 'Johnson abroad: Beirut, Aug. 23; Tehran, Aug. 24–26, the Shah and Alam.'
    n: '[FRUS 1961–63, XVIII, doc. 29](https://history.state.gov/historicaldocuments/frus1961-63v18/d29) (editorial note: Tehran). [[w.dallek-flawed-giant]]. Names: Johnson, Pahlavi, Alam.'
    tags: [name:johnson-lyndon-b, name:pahlavi-mohammed-reza, name:alam-assadollah]
  - id: cal.1962-08-27.middle-east-johnson-trip
    when: Aug. 27
    date: '1962-08-27'
    thread: middle-east-johnson-trip
    also: [europe-and-the-alliance]
    c: 'Johnson in Ankara: Gursel and İnönü; two squadrons of F-104Gs and 225,000 M-1 rifles in the aid plans.'
    n: 'FRUS 1961–63, XVI, doc. [379](https://history.state.gov/historicaldocuments/frus1961-63v16/d379) (Istanbul, Aug. 30). See [[cal.1962-08-23.middle-east]]. Names: Johnson, Gursel, İnönü.'
    tags: [name:johnson-lyndon-b, name:gursel-cemal, name:inonu-ismet]
  - id: cal.1962-08-27.middle-east-johnson-plan
    when: Aug. 27
    date: '1962-08-27'
    thread: middle-east-johnson-plan
    c: Kennedy with Rusk, Bundy and Feldman on the Johnson Plan for the Palestine refugees.
    n: 'FRUS 1961–63, XVIII, doc. [32](https://history.state.gov/historicaldocuments/frus1961-63v18/d32). See [[cal.1962-08-15.middle-east]]. Names: Kennedy, Rusk, Bundy, Feldman.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:bundy-mcgeorge, name:feldman-myer]
  - id: cal.1962-08-27.voting-rights
    when: Aug. 27
    date: '1962-08-27'
    thread: voting-rights
    also: [amendments]
    c: House passes the poll tax amendment, [294–86](https://voteview.com/rollcall/RH0870193) (Voteview counts 295 yeas; Check the Record). To the states, [76 Stat. 1259](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg1259.pdf); ratified Jan. 23, 1964.
    n: '[108 Cong. Rec., House, Aug. 27, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt13/pdf/GPO-CRECB-1962-pt13-7-1.pdf). See [[cal.1962-03-27.voting-rights]].'
  - id: cal.1962-08-27.elections-1962
    when: Aug. 27
    date: '1962-08-27'
    thread: elections-1962
    c: Edward Kennedy and McCormack debate in South Boston. "If his name was Edward Moore, with his qualifications . . . your candidacy would be a joke."
    n: '[[w.clymer-edward-m-kennedy]]. See [[cal.1962-05-05.elections-1962]]. Names: Edward M. Kennedy, McCormack.'
    tags: [name:kennedy-edward-m, name:mccormack-edward-j-jr]
  - id: cal.1962-08-28.court
    when: Aug. 28
    date: '1962-08-28'
    thread: court
    c: Frankfurter retires. Goldberg named, Aug. 29; Wirtz to Labor.
    n: '[Letter to Justice Frankfurter Upon His Retirement From the Supreme Court](https://www.presidency.ucsb.edu/documents/letter-justice-frankfurter-upon-his-retirement-from-the-supreme-court) (Aug. 29, 1962); [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-187) (Aug. 29, 1962). [[w.stebenne-arthur-j-goldberg]]. See [[cal.1961-01-23.court]]. Names: Goldberg, Wirtz, Frankfurter.'
    tags: [name:frankfurter-felix, name:goldberg-arthur-j, name:wirtz-w-willard, name:kennedy-john-f]
  - id: cal.1962-08-29.missile-crisis
    when: Aug. 29
    date: '1962-08-29'
    thread: missile-crisis
    c: A U-2 photographs SAM sites in western Cuba.
    n: '[FRUS 1961–63, X, doc. 395](https://history.state.gov/historicaldocuments/frus1961-63v10/d395). See [[cal.1962-05-24.missile-crisis]].'
  - id: cal.1962-08-29.conservation
    when: Aug. 29
    date: '1962-08-29'
    thread: conservation
    c: 'News conference. Asked about DDT and other pesticides: the Department of Agriculture and the Public Health Service already examining the matter, "particularly, of course, since Miss Carson''s book." *Silent Spring* serialized in *The New Yorker* from June 16; the book out Sept. 27.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-187) (Aug. 29, 1962). [[w.carson-silent-spring]]; [[w.lear-rachel-carson]]. Names: Carson.'
    tags: [name:kennedy-john-f, name:carson-rachel]
