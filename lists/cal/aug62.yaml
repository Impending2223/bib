    when: Aug. 30–31
    date: '1962-08-30'
    thread: middle-east-johnson-trip
    also: [cyprus]
    c: Johnson in Nicosia, Makarios. Then Athens and Rome.
    n: 'FRUS 1961–63, XVI, doc. [263](https://history.state.gov/historicaldocuments/frus1961-63v16/d263) (Labouisse, Sept. 3). See [[cal.1962-08-23.middle-east]]. Names: Johnson, Makarios III.'
    tags: [name:johnson-lyndon-b, name:makarios-iii]
  - id: cal.1962-08-31.missile-crisis
    when: Aug. 31
    date: '1962-08-31'
    thread: missile-crisis
    c: 'Keating on the Senate floor: Soviet troops and rocket bases in Cuba.'
    n: '[Cong. Rec., Senate, Aug. 31, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt14/pdf/GPO-CRECB-1962-pt14-1-2.pdf), 18359–60. See [[cal.1962-05-24.missile-crisis]]. Names: Keating.'
    tags: [name:keating-kenneth-b]
  - id: cal.1962-08.governors-wy
    when: Aug.
    date: 1962-08
    thread: governors
    also: [elections-1962]
    c: 'Wyoming''s primary, for governor. Democratic: Governor Gage, the secretary of state who succeeded Hickey on his appointment to the Senate, 21,051, 55.5 percent; Jack, the nominee of 1954, 16,875. Republican: Hansen, a Teton County commissioner, 28,494, 57.0; Crowell 16,906, 33.8. Check the day.'
    n: 'Votes: [Wikipedia, "1962 Wyoming gubernatorial election"](https://en.wikipedia.org/wiki/1962_Wyoming_gubernatorial_election); Check: *1963 Wyoming Official Directory and 1962 Election Returns*, 56–58. [[w.larson-history-of-wyoming]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1961-01-03.rules]]. Names: Gage, Hickey, Jack, Crowell, Hansen.'
    tags: [state:wy, name:gage-jack-r, name:jack-william-m, name:hansen-clifford-p, name:crowell-charles-m, name:hickey-john-j]
