# Cal. XLVII October 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLVII
entries:
  - id: cal.1963-10-01.civil-rights-the-executive
    when: Oct. 1
    date: '1963-10-01'
    thread: civil-rights-the-executive
    c: Senate extends the Civil Rights Commission one year, [71–15](https://voteview.com/rollcall/RS0880144), as an amendment to a private bill. House agrees Oct. 7, [265–80](https://voteview.com/rollcall/RH0880072). Signed Oct. 17, [77 Stat. 271](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg271-2.pdf).
    n: '[[w.rights-1961-report]]; [[w.rights-civil-rights-63]]; [[w.graham-civil-rights-era]]; [[w.dulles-civil-rights-commission-1957]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-01.desegregation-public-places-cambridge
    when: Oct. 1
    date: '1963-10-01'
    thread: desegregation-public-places
    also: [state-constitutions]
    c: 'Cambridge, Md. The voters reject Charter Amendment No. 15, adopted by the council July 1 under the agreement of July 23 and petitioned to referendum: public accommodations open to all races. Richardson''s Cambridge Nonviolent Action Committee had urged Negroes not to vote. Check the figures.'
    n: '[SNCC, press release, Dec. 22, 1963](https://crmvet.org/docs/pr/631222_sncc_pr_md_protests.pdf). [[w.levy-civil-war-on-race]]. See [[cal.1963-07-23.civil-rights-the-executive]]. Names: Richardson (K–J Cong. III.K).'
    tags: [state:md, city:cambridge-md, name:richardson-gloria]
  - id: cal.1963-10-01.africa
    when: Oct. 1–2
    date: '1963-10-01'
    thread: africa
    c: 'Haile Selassie on a state visit. Kennedy raises Somalia; the Emperor: arms aid to Somalia encourages its irredentism. Aid to Ethiopia discussed Oct. 2.'
    n: '[Remarks of Welcome at Union Station to Haile Selassie, Emperor of Ethiopia](https://www.presidency.ucsb.edu/documents/remarks-welcome-union-station-haile-selassie-emperor-ethiopia) (Oct. 1, 1963); [Joint Statement Following Discussions With the Emperor of Ethiopia](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-emperor-ethiopia) (Oct. 2, 1963). FRUS 1961–63, XXI, docs. [300](https://history.state.gov/historicaldocuments/frus1961-63v21/d300), [301](https://history.state.gov/historicaldocuments/frus1961-63v21/d301), [302](https://history.state.gov/historicaldocuments/frus1961-63v21/d302). [[w.lefebvre-arms-for-the-horn]]. Names: Haile Selassie (K–J Adm. III.J).'
    tags: [name:haile-selassie-i, name:kennedy-john-f]
  - id: cal.1963-10-02.vietnam
    when: Oct. 2
    date: '1963-10-02'
    thread: vietnam
    c: 'McNamara and Taylor report to Kennedy and the NSC. White House statement: the major part of the American military task done by the end of 1965; 1,000 men out by the end of 1963. The political situation "deeply serious."'
    n: '[White House Statement Following the Return of a Special Mission to South Viet-Nam](https://www.presidency.ucsb.edu/documents/white-house-statement-following-the-return-special-mission-south-viet-nam) (Oct. 2, 1963). FRUS 1961–63, IV, docs. [167](https://history.state.gov/historicaldocuments/frus1961-63v04/d167), [169](https://history.state.gov/historicaldocuments/frus1961-63v04/d169). Report of McNamara and Taylor to the President (Viet. II.I.3). [[w.selverstone-its-a-date]]. See [[cal.1963-09-21.vietnam]]. Names: McNamara, Taylor (K–J Adm. III.F).'
    tags: [name:mcnamara-robert-s, name:taylor-maxwell, name:kennedy-john-f]
  - id: cal.1963-10-02.opinion
    when: Oct. 2
    date: '1963-10-02'
    thread: opinion
    c: 'Gallup, Sept. 12–17: the most important problem, racial problems, 52 percent; international problems, 25; unemployment, 5; taxes, 5. The Democrats better able to handle it, 30; the Republicans, 20.'
    n: '[[w.gallup-poll]], III, 1842.'
  - id: cal.1963-10-03.latin-america
    when: Oct. 3
    date: '1963-10-03'
    thread: latin-america
    c: 'Honduras. The army ousts Villeda Morales; López Arellano takes power. Eight days after Bosch''s fall. Oct. 4, relations with both broken, aid and military assistance stopped. Kennedy, Oct. 9: "we are opposed to coups."'
    n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 159](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d159); [FRUS 1961–63, XII, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v12/d359). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-154) (Oct. 9, 1963). [[w.lafeber-inevitable-revolutions]]; [[w.morris-honduras]]; [[w.rabe-most-dangerous-area-in]]; [[w.rabe-killing-zone]]; [[w.martin-kennedy-and-latin-america]]. See [[cal.1962-12-20.latin-america]]; [[cal.1963-09-25.latin-america]]. Names: Villeda Morales, López Arellano, Bosch (K–J Adm. III.J).'
    tags: [name:villeda-morales-jose-ramon, name:lopez-arellano-oswaldo, name:bosch-juan, name:kennedy-john-f]
  - id: cal.1963-10-04.opinion
    when: Oct. 4
    date: '1963-10-04'
    thread: opinion
    c: 'Gallup, Aug. 15–20: would vote for a well-qualified Catholic nominated for President by their party, 84 percent; would not, 13. In the South, 71 and 26.'
    n: '[[w.gallup-poll]], III, 1843.'
  - id: cal.1963-10-04.antisubversion-la
    when: Oct. 4
    date: '1963-10-04'
    thread: antisubversion
    c: New Orleans. State and city police, directed by the staff of the Joint Legislative Committee on Un-American Activities, raid the homes and offices of Dombrowski, executive director of the Southern Conference Educational Fund, and two lawyers; the three arrested under the Subversive Activities and Communist Control Law and the Communist Propaganda Control Law, their files seized. Later in October a State judge quashes the warrants.
    n: '*Dombrowski v. Pfister*, [380 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380479/usrep380479.pdf) (1965); Wisdom, dissenting, in [227 F. Supp. 556](https://static.case.law/f-supp/227/html/0556-01.html) (E.D. La. 1964). [[w.fairclough-race-and-democracy]]. Names: Dombrowski (K–J Cong. III.K).'
    tags: [name:dombrowski-james-a, state:la, city:new-orleans]
  - id: cal.1963-10-06.opinion-5
    when: Oct. 6
    date: '1963-10-06'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Sept. 12–17: Republicans'' choice for 1964: Goldwater 42, Rockefeller 26, Romney 15, Scranton 4; others, no preference 13. Independents: Goldwater 33, Rockefeller 27.'
    n: '[[w.gallup-poll]], III, 1843. Names: Goldwater (Opp. III.B); Nelson Rockefeller, Romney, Scranton (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1963-10-07.baker
    when: Oct. 7
    date: '1963-10-07'
    thread: baker
    c: 'Bobby Baker resigns as secretary to the Senate majority, under charges of trading on his post. Oct. 10, Williams''s resolution, S. Res. 212, agreed to: the Rules Committee to inquire into the business interests of Senate employees and former employees.'
    n: '[109 Cong. Rec., Senate, Oct. 10, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt14/pdf/GPO-CRECB-1963-pt14-7-1.pdf). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). [[w.baker-wheeling-and-dealing]]; [[w.caro-passage-of-power]]; [[w.dallek-flawed-giant]]. Names: Robert Baker (K–J Cong. III.K); Williams (Opp. III.B).'
    tags: [name:baker-robert-g, name:williams-john-j]
  - id: cal.1963-10-07.testing
    when: Oct. 7
    date: '1963-10-07'
    thread: testing
    c: Kennedy signs the ratification of the test ban treaty, [14 U.S.T. 1313](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-14-2/lltreaties-14-2.pdf#page=57), [480 U.N.T.S. 43](https://treaties.un.org/doc/Publication/UNTS/Volume%20480/volume-480-I-6964-English.pdf). In force Oct. 10, on deposit of the instruments in Washington, London, and Moscow.
    n: '[Remarks at the Signing of the Nuclear Test Ban Treaty](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-nuclear-test-ban-treaty) (Oct. 7, 1963). Treaty Banning Nuclear Weapon Tests (K–J Cong. II.J.2). See [[cal.1963-06-10.testing]]; [[cal.1963-09-24.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-08.africa
    when: Oct. 8–Nov. 1
    date: '1963-10-08'
    thread: africa
    c: 'Algeria and Morocco at war over their desert border, from Oct. 8. Hassan asks for American arms, Oct. 20; Komer to Kennedy: stall. Oct. 28, Kennedy approves a $10 million supporting assistance loan to Morocco and ammunition already programmed, and concern at Cuban arms for Algeria. A cease-fire agreed at Bamako, Oct. 30 (Check); Nov. 1, the State Department''s support for it.'
    n: 'FRUS 1961–63, XXI, docs. [6](https://history.state.gov/historicaldocuments/frus1961-63v21/d6), [13](https://history.state.gov/historicaldocuments/frus1961-63v21/d13), [24](https://history.state.gov/historicaldocuments/frus1961-63v21/d24), [28](https://history.state.gov/historicaldocuments/frus1961-63v21/d28). [[w.byrne-mecca-of-revolution]]. Made public: FRUS 1961–63, XXI (1995). See [[cal.1962-10-15.africa]]. Names: Hassan II, Ben Bella (K–J Adm. III.J); Komer (K–J Adm. III.E).'
    tags: [name:hassan-ii, name:ben-bella-ahmed, name:komer-robert-w, name:kennedy-john-f]
  - id: cal.1963-10-09.trade
    when: Oct. 9
    date: '1963-10-09'
    thread: trade
    c: 'Press conference. Private dealers may sell surplus wheat to the Soviet Union and Eastern Europe, for cash or on normal credit, in American ships where available: 4 million tons, about $250 million. The NSC agreed. Report to Congress, Oct. 10: no action required.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-154) (Oct. 9, 1963); [Letter to the President of the Senate and to the Speaker of the House on the Sale of Wheat to the Soviet Union](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-the-sale-wheat-the-soviet-union) (Oct. 10, 1963). [FRUS 1961–63, V, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v05/d359). [[w.beschloss-crisis-years]]. See [[cal.1963-09-16.trade]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:kennedy-john-f, name:freeman-orville-l]
  - id: cal.1963-10-10.king
    when: Oct. 10
    date: '1963-10-10'
    thread: king
    also: [civil-rights-the-executive, robert-kennedy]
    c: Robert Kennedy signs Hoover's request of Oct. 7 for wiretaps on King, at his home "or at any future address," and on SCLC's New York office, citing "possible communist influence in the racial situation." Oct. 21, SCLC's Atlanta office. Installed Oct. 24 in New York, Nov. 8 in Atlanta.
    n: '[S. Rep. No. 94-755, Book III, 115–17 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=129) (K–J Adm. II.H.3). [[w.garrow-fbi-and-martin-luther]]; [[w.branch-parting-the-waters]]; [[w.garrow-bearing-the-cross]]. See [[cal.1963-06-22.civil-rights-bill]]. Made public: Drew Pearson and Jack Anderson''s column, May 1968, before the Oregon primary. Check the date. Names: Robert F. Kennedy (K–J Adm. III.A); Hoover (K–J Adm. III.I); Martin Luther King (K–J Cong. III.H).'
    tags: [name:kennedy-robert-f, name:hoover-j-edgar, name:king-martin-luther-jr]
  - id: cal.1963-10-11.vietnam
    when: Oct. 11
    date: '1963-10-11'
    thread: vietnam
    c: NSAM 263. The report's military recommendations approved Oct. 5; the 1,000 to come out by the end of the year, without formal announcement. Lodge instructed to press Diệm by selective cuts in aid.
    n: '[NSAM No. 263](https://history.state.gov/historicaldocuments/frus1961-63v04/d194) (Oct. 11, 1963) (K–J Adm. II.H.2). FRUS 1961–63, IV, docs. [179](https://history.state.gov/historicaldocuments/frus1961-63v04/d179), [181](https://history.state.gov/historicaldocuments/frus1961-63v04/d181). [[w.newman-jfk-and-vietnam]]; [[w.chomsky-rethinking-camelot]]; [[w.logevall-vietnam-and-the-question]]; [[w.moise-jfk-and-the-myth]]; [[w.blight-vietnam-if-kennedy-had]]; [[w.selverstone-its-a-date]]; [[w.selverstone-kennedy-withdrawal]]. See [[cal.1963-09-21.vietnam]]. Names: McGeorge Bundy (K–J Adm. III.E); Lodge (Viet. III.C); Ngô Đình Diệm (Viet. III.G).'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge, name:lodge-henry-cabot, name:ngo-dinh-diem]
  - id: cal.1963-10-11.program
    when: Oct. 11
    date: '1963-10-11'
    thread: women
    c: 'The Commission on the Status of Women reports, *American Women*. Child care, paid maternity leave, equal opportunity in hiring; the Fifth and Fourteenth Amendments, not an equal rights amendment. Nov. 1, E.O. 11126: a committee of officials and a citizens'' council to carry on.'
    n: '[Remarks at Presentation of the Final Report of the President''s Commission on the Status of Women](https://www.presidency.ucsb.edu/documents/remarks-presentation-the-final-report-the-presidents-commission-the-status-women) (Oct. 11, 1963); [Exec. Order No. 11,126](https://www.presidency.ucsb.edu/documents/executive-order-11126-establishing-committee-and-council-relating-the-status-women) (Nov. 1, 1963). [[w.women-american-women]]; [[w.harrison-on-account-of-sex]]; [[w.zelman-women-work-and-national]]; [[w.cobble-other-womens-movement]]; [[w.peterson-restless]]. See [[cal.1961-12-14.program]]. Names: Peterson (K–J Adm. III.G).'
    tags: [name:peterson-esther, name:kennedy-john-f]
  - id: cal.1963-10-11.opinion
    when: Oct. 11
    date: '1963-10-11'
    thread: opinion
    c: 'Gallup, July 18–23: satisfied with family income, whites 68 percent, nonwhites 38; with housing, 76 and 43; with their work, 90 and 54; with their children''s education, 69 and 42; with their prospects, 67 and 45.'
    n: '[[w.gallup-poll]], III, 1844.'
  - id: cal.1963-10-13.opinion
    when: Oct. 13
    date: '1963-10-13'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Sept. 12–17: the Kennedy administration pushing integration too fast, 50 percent; not fast enough, 11; about right, 27.'
    n: '[[w.gallup-poll]], III, 1844.'
  - id: cal.1963-10-14.defense
    when: Oct. 14
    date: '1963-10-14'
    thread: defense
    c: 'Korth resigns as Secretary of the Navy, effective Nov. 1. His letters in office for the Continental National Bank of Fort Worth, a lender to General Dynamics, the TFX''s builder, before McClellan''s subcommittee. Kennedy, Oct. 31: "no evidence" Korth acted improperly. Nitze sworn Nov. 29.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-156) (Oct. 31, 1963). [[w.art-tfx-decision]]. See [[cal.1963-02-26.defense]]. Names: Korth, Nitze (K–J Adm. III.F); McClellan (K–J Cong. III.B).'
    tags: [name:korth-fred, name:mcclellan-john-l, name:nitze-paul, name:kennedy-john-f]
  - id: cal.1963-10-15.state-and-city-finance-or
    when: Oct. 15
    date: '1963-10-15'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: 'Oregon, special election. Ballot Measure 1, the legislature''s Personal and Corporation Income Tax Bill, referred by petition: yes 103,737, no 362,845. Refused.'
    n: 'Votes: [Or. *Official Abstract of Votes, Special Election, October 15, 1963*](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411024/File/document). [[w.peirce-pacific-states-of-america]].'
    tags: [state:or]
  - id: cal.1963-10-15.japan-and-korea
    when: Oct. 15
    date: '1963-10-15'
    thread: japan-and-korea
    c: Korea's presidential election. Park 4,702,640; Yun Po-sun 4,546,614; three others 1,031,944. The voting orderly. The Assembly elected Nov. 26; Park inaugurated Dec. 17.
    n: 'FRUS 1961–63, XXII, docs. [314](https://history.state.gov/historicaldocuments/frus1961-63v22/d314), [315](https://history.state.gov/historicaldocuments/frus1961-63v22/d315), [316](https://history.state.gov/historicaldocuments/frus1961-63v22/d316). [[w.brazinsky-nation-building-in-south]]; [[w.han-failure-of-democracy-in]]. See [[cal.1963-02-18.japan-and-korea]]. Names: Park, Yun (K–J Adm. III.J).'
    tags: [name:park-chung-hee, name:yun-po-sun]
  - id: cal.1963-10-16.opinion-5
    when: Oct. 16
    date: '1963-10-16'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Sept. 12–17: Kennedy 55, Goldwater 39, undecided, others 6.'
    n: '[[w.gallup-poll]], III, 1844–45. Names: Goldwater (Opp. III.B).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m]
  - id: cal.1963-10-19.legislatures-tx
    when: Oct. 19
    date: '1963-10-19'
    thread: legislatures
    c: A three-judge court voids Texas's congressional districts, from 128 percent above the ideal to 48 below, on the suit of George Bush and others; the 1964 elections to be at large unless the Legislature redistricts. The order deferred for the State to seek a stay.
    n: '*Bush v. Martin*, [224 F. Supp. 499](https://static.case.law/f-supp/224/html/0499-01.html) (S.D. Tex. 1963); *Bush v. Martin*, 251 F. Supp. 484 (S.D. Tex. 1966), recites it. [[w.dixon-democratic-representation]]; [[w.cortner-apportionment-cases]]. Names: Bush (Opp. III.D).'
    tags: [state:tx, name:bush-george-h-w]
  - id: cal.1963-10-22.specials
    when: Oct. 22
    date: '1963-10-22'
    thread: specials
    c: North Dakota 1st, special. Mark Andrews (R) holds Nygaard's seat, 49.1 percent, over Hove (Democratic-NPL), 44.3; a conservative Republican 6.3.
    n: 'Votes: N.D. State Board of Canvassers, *Abstract of Votes*, special election, Oct. 22, 1963 ([sos.nd.gov](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1963-10-22-special.pdf)). See [[cal.1961-04-04.states-and-cities]]. Names: Mark Andrews, Nygaard, Hove (K–J Cong. III.K).'
    tags: [special:1963-10-22-h-ND-1, name:andrews-mark, name:nygaard-hjalmar-c, name:hove-john]
  - id: cal.1963-10-22.desegregation-schools-chicago
    when: Oct. 22
    date: '1963-10-22'
    thread: desegregation-schools
    also: [civil-rights-organizations]
    c: 'Chicago. "Freedom Day": the Coordinating Council of Community Organizations'' boycott of the public schools against Superintendent Willis, his mobile classrooms ("Willis Wagons") at Negro schools, and the schools'' segregation. Nearly half the city''s pupils stay out; some 10,000 march to the Board of Education. Willis had resigned in October over the board''s change to his transfer plan, and returned when the board gave way (Check the dates).'
    n: '[Wikipedia, "Chicago Public Schools boycott"](https://en.wikipedia.org/wiki/Chicago_Public_Schools_boycott) (Check: the Board of Education''s attendance figures). [[w.anderson-confronting-the-color-line]]; [[w.danns-something-better-for-our]]; [[w.ralph-northern-protest]]; [[w.cohen-american-pharaoh]]. Names: Willis (K–J Cong. III.K).'
    tags: [state:il, city:chicago, name:willis-benjamin-c]
  - id: cal.1963-10-23.opinion
    when: Oct. 23
    date: '1963-10-23'
    thread: opinion
    c: 'Gallup, Aug. 15–20: would vote for a well-qualified Jew nominated by their party, 77 percent; for a Negro, 47, against 45 who would not; for a woman, 55, against 41.'
    n: '[[w.gallup-poll]], III, 1846.'
  - id: cal.1963-10-24.program
    when: Oct. 24
    date: '1963-10-24'
    thread: health
    c: 'Maternal and Child Health and Mental Retardation Planning Amendments signed, [77 Stat. 273](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg273.pdf): prenatal and infant care for mothers at risk; grants for State plans against retardation.'
    n: '[Remarks Upon Signing the Maternal and Child Health and Mental Retardation Planning Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-maternal-and-child-health-and-mental-retardation-planning-bill) (Oct. 24, 1963). [[w.shorter-kennedy-family-and-the]]; [[w.blumenthal-heart-of-power]]. See [[cal.1963-02-05.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-24.right-and-the-military
    when: Oct. 24
    date: '1963-10-24'
    thread: right-and-the-military
    c: Stevenson in Dallas for UN Day. Heckled, spat on, struck on the head with a placard. Walker's "U.S. Day" rally the night before.
    n: '[[w.minutaglio-dallas-1963]]; [[w.miller-nut-country]]; [[w.manchester-death-of-a-president]]; [[w.martin-adlai-stevenson-and-the]]. See [[cal.1961-03.right-and-the-military]]. Names: Stevenson (K–J Adm. III.E); Walker (K–J Adm. III.F).'
    tags: [name:stevenson-adlai-e, name:walker-edwin-a]
  - id: cal.1963-10-25.opinion
    when: Oct. 25
    date: '1963-10-25'
    thread: opinion
    also: [trade]
    c: 'Gallup, Oct. 11–16: selling surplus wheat to Russia, 60 percent approve, 31 disapprove; Republicans 51 and 42. More trade with Russia, 55 for, 33 against.'
    n: '[[w.gallup-poll]], III, 1847.'
  - id: cal.1963-10-27.opinion-5
    when: Oct. 27
    date: '1963-10-27'
    thread: opinion
    also: [elections-1964-polls, goldwater]
    c: 'Gallup, Oct. 11–16: Kennedy 55, Goldwater 39, undecided, others 6. South, undecided excluded: Goldwater 55, Kennedy 45.'
    n: '[[w.gallup-poll]], III, 1847. Names: Goldwater (Opp. III.B).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m]
  - id: cal.1963-10-28.cities-and-housing-nyc
    when: Oct. 28
    date: '1963-10-28'
    thread: cities-and-housing
    c: New York. The Pennsylvania Railroad begins to pull down Pennsylvania Station's building above the tracks, for Madison Square Garden and two office towers; trains run on below.
    n: '[Wikipedia, "Pennsylvania Station (1910–1963)"](https://en.wikipedia.org/wiki/Pennsylvania_Station_(1910%E2%80%931963)). [[w.wood-preserving-new-york]].'
    tags: [state:ny, city:nyc]
  - id: cal.1963-10-29.civil-rights-bill
    when: Oct. 29
    date: '1963-10-29'
    thread: civil-rights-bill
    c: 'House Judiciary Committee approves the civil rights bill, 20–12: the Celler–McCulloch substitute, agreed with the Justice Department and Halleck, in place of the subcommittee''s broader bill. Part III dropped; an equal employment commission added. Kennedy: "comprehensive and fair." Check the vote.'
    n: '[Statement by the President Following Action on the Civil Rights Bill by the House Committee on the Judiciary](https://www.presidency.ucsb.edu/documents/statement-the-president-following-action-the-civil-rights-bill-the-house-committee-the) (Oct. 29, 1963). H.R. Rep. No. 88-914 (1963). [[w.whalen-longest-debate]]; [[w.loevy-to-end-all-segregation]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.risen-bill-of-the-century]]; [[w.rosenberg-kennedy-johnson-and-the]], "The Bill Moves Forward"; [[w.scheele-charlie-halleck]]. See [[cal.1963-06-11.civil-rights-bill]]. Names: Celler (K–J Cong. III.D); McCulloch (K–J Cong. III.E); Halleck (K–J Cong. III.C).'
    tags: [name:celler-emanuel, name:mcculloch-william-m, name:halleck-charles-a, name:kennedy-john-f]
  - id: cal.1963-10-29.robert-kennedy
    when: Oct. 29
    date: '1963-10-29'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Meeting with the President on the generals'' plot. Robert Kennedy: Vietnam not Iraq or South America, where a coup is done quickly; to back one is to put the country''s future in the hands of a man little known; Diệm will not quit; the reporting thin. "My view is the minority view."'
    n: '[Kennedy, Johnson, Robert Kennedy and others, 4:25 p.m.](https://prde.upress.virginia.edu/conversations/4022297), JFK Meeting Tape 118_A54.3a-b (PRDE only). [FRUS 1961–63, IV, doc. 234](https://history.state.gov/historicaldocuments/frus1961-63v04/d234). See [[cal.1963-09-06.robert-kennedy]]. Made public: FRUS 1961–63, IV (1991). Names: Robert Kennedy (K–J Adm. III.A); Ngô Đình Diệm (Viet. III.G).'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:ngo-dinh-diem]
  - id: cal.1963-10-30.opinion
    when: Oct. 30
    date: '1963-10-30'
    thread: opinion
    c: 'Gallup, Aug. 15–20: would vote for a well-qualified divorced man nominated by their party, 78 percent; would not, 17. Rockefeller''s remarriage enough to turn them against him, 14.'
    n: '[[w.gallup-poll]], III, 1848. Names: Nelson Rockefeller (Opp. III.H).'
    tags: [name:rockefeller-nelson]
  - id: cal.1963-10-31.program
    when: Oct. 31
    date: '1963-10-31'
    thread: health
    c: Mental Retardation Facilities and Community Mental Health Centers Construction Act signed, [77 Stat. 282](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg282.pdf). Research centers and university clinics for the retarded; $150 million over three years toward community mental health centers. House conference report, Oct. 21, [299–13](https://voteview.com/rollcall/RH0880078).
    n: '[Remarks Upon Signing Bill for the Construction of Mental Retardation Facilities and Community Mental Health Centers](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-for-the-construction-mental-retardation-facilities-and-community) (Oct. 31, 1963). [[w.foley-community-mental-health-legislation]]. See [[cal.1963-02-05.program]]; [[cal.1963-09-10.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10.alabama-al
    when: Oct.
    date: 1963-10
    thread: alabama
    also: [antisubversion]
    c: Alabama's State Sovereignty Commission, seven members, $50,000, its records closed to the public; members named Dec. 21. The same year, the Legislative Commission to Preserve the Peace, to investigate groups acting against the State's sovereignty. Check the acts' dates.
    n: 'Jeremy Gray, "Alabama Sovereignty Commission formed with sweeping powers, no public oversight (Oct. 5, 1963)," al.com, Oct. 5, 2013, from the *Birmingham News*. Check: the acts, *Acts of Alabama*, 1963. [[w.carter-politics-of-rage-1995]]. Names: Wallace (K–J Cong. III.F).'
    tags: [state:al, name:wallace-george-c]
