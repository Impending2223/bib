# Cal. XXXVI October 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXVI
entries:
  - id: cal.1963-10-01.civil-rights-the-executive
    when: Oct. 1
    date: '1963-10-01'
    thread: civil-rights-the-executive
    c: Senate extends the Civil Rights Commission one year, [71–15](https://voteview.com/rollcall/RS0880144), as an amendment to a private bill. House agrees Oct. 7, [265–80](https://voteview.com/rollcall/RH0880072). Signed Oct. 17.
    n: '[Pub. L. No. 88-152, 77 Stat. 271](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg271-2.pdf) (1963). U.S. Commission on Civil Rights, *1961 Report* (K–J Cong. II.J.3). Graham, *The Civil Rights Era* (K–J Adm. II.C).'
  - id: cal.1963-10-02.vietnam
    when: Oct. 2
    date: '1963-10-02'
    thread: vietnam
    c: 'McNamara and Taylor report to Kennedy and the NSC. White House statement: the major part of the American military task done by the end of 1965; 1,000 men out by the end of 1963. The political situation "deeply serious."'
    n: '[White House Statement Following the Return of a Special Mission to South Viet-Nam](https://www.presidency.ucsb.edu/documents/white-house-statement-following-the-return-special-mission-south-viet-nam) (Oct. 2, 1963). FRUS 1961–63, IV, docs. [167](https://history.state.gov/historicaldocuments/frus1961-63v04/d167), [169](https://history.state.gov/historicaldocuments/frus1961-63v04/d169). See [[cal.1963-09-21.vietnam]]. Names: McNamara, Taylor (K–J Adm. III.F).'
    tags: [name:mcnamara-robert-s, name:taylor-maxwell, name:kennedy-john-f]
  - id: cal.1963-10-03.latin-america
    when: Oct. 3
    date: '1963-10-03'
    thread: latin-america
    c: 'Honduras. The army ousts Villeda Morales; López Arellano takes power. Eight days after Bosch''s fall. Oct. 4, relations with both broken, aid and military assistance stopped. Kennedy, Oct. 9: "we are opposed to coups."'
    n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 159](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d159); [FRUS 1961–63, XII, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v12/d359). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-154) (Oct. 9, 1963). Rabe, *The Most Dangerous Area in the World* (K–J Adm. II.D). See [[cal.1962-12-20.latin-america]]. Names: Bosch (K–J Adm. III.J).'
    tags: [name:villeda-morales-jose-ramon, name:lopez-arellano-oswaldo, name:bosch-juan, name:kennedy-john-f]
  - id: cal.1963-10-07.baker
    when: Oct. 7
    date: '1963-10-07'
    thread: baker
    c: 'Bobby Baker resigns as secretary to the Senate majority, under charges of trading on his post. Oct. 10, Williams''s resolution, S. Res. 212, agreed to: the Rules Committee to inquire into the business interests of Senate employees and former employees.'
    n: '[109 Cong. Rec., Senate, Oct. 10, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt14/pdf/GPO-CRECB-1963-pt14-7-1.pdf). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). Caro, *The Passage of Power* (K–J Adm. II.F). Bobby Baker with Larry L. King, *Wheeling and Dealing: Confessions of a Capitol Hill Operator* (1978). Names: Baker (K–J Cong. III.K); Williams (Opp. III.B).'
    tags: [name:baker-robert-g, name:williams-john-j]
  - id: cal.1963-10-07.testing
    when: Oct. 7
    date: '1963-10-07'
    thread: testing
    c: Kennedy signs the ratification of the test ban treaty. In force Oct. 10, on deposit of the instruments in Washington, London, and Moscow.
    n: '[Remarks at the Signing of the Nuclear Test Ban Treaty](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-nuclear-test-ban-treaty) (Oct. 7, 1963). Treaty Banning Nuclear Weapon Tests (K–J Cong. II.J.2). See [[cal.1963-06-10.testing]]; [[cal.1963-09-24.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-09.trade
    when: Oct. 9
    date: '1963-10-09'
    thread: trade
    c: 'Press conference. Private dealers may sell surplus wheat to the Soviet Union and Eastern Europe, for cash or on normal credit, in American ships where available: 4 million tons, about $250 million. The NSC agreed. Report to Congress, Oct. 10: no action required.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-154) (Oct. 9, 1963); [Letter to the President of the Senate and to the Speaker of the House on the Sale of Wheat to the Soviet Union](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-the-sale-wheat-the-soviet-union) (Oct. 10, 1963). [FRUS 1961–63, V, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v05/d359). Beschloss, *The Crisis Years* (K–J Adm. II.D). See [[cal.1963-09-16.trade]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:kennedy-john-f, name:freeman-orville-l]
  - id: cal.1963-10-11.vietnam
    when: Oct. 11
    date: '1963-10-11'
    thread: vietnam
    c: 'NSAM 263. The report''s military recommendations approved Oct. 5; the 1,000 to come out by the end of the year, without formal announcement. Lodge instructed to press Diem by selective cuts in aid.'
    n: '[NSAM No. 263](https://history.state.gov/historicaldocuments/frus1961-63v04/d194) (Oct. 11, 1963) (K–J Adm. II.H.2). FRUS 1961–63, IV, docs. [179](https://history.state.gov/historicaldocuments/frus1961-63v04/d179), [181](https://history.state.gov/historicaldocuments/frus1961-63v04/d181). Newman, *JFK and Vietnam* (Viet. II.B.8). See [[cal.1963-09-21.vietnam]]. Names: Lodge (Viet. III.C); Diem (Viet. III.G).'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge, name:lodge-henry-cabot, name:ngo-dinh-diem]
  - id: cal.1963-10-11.program
    when: Oct. 11
    date: '1963-10-11'
    thread: program
    c: 'The Commission on the Status of Women reports, *American Women*. Child care, paid maternity leave, equal opportunity in hiring; the Fifth and Fourteenth Amendments, not an equal rights amendment. Nov. 1, E.O. 11126: a committee of officials and a citizens'' council to carry on.'
    n: '[Remarks at Presentation of the Final Report of the President''s Commission on the Status of Women](https://www.presidency.ucsb.edu/documents/remarks-presentation-the-final-report-the-presidents-commission-the-status-women) (Oct. 11, 1963); [Exec. Order No. 11,126](https://www.presidency.ucsb.edu/documents/executive-order-11126-establishing-committee-and-council-relating-the-status-women) (Nov. 1, 1963). President''s Commission on the Status of Women, *American Women* (K–J Adm. II.H.3). Harrison, *On Account of Sex* (K–J Adm. II.B). Peterson, *Restless* (K–J Adm. II.G.5). See [[cal.1961-12-14.program]]. Names: Peterson (K–J Adm. III.G).'
    tags: [name:peterson-esther, name:kennedy-john-f]
  - id: cal.1963-10-14.defense
    when: Oct. 14
    date: '1963-10-14'
    thread: defense
    c: 'Korth resigns as Secretary of the Navy, effective Nov. 1. His letters in office for the Continental National Bank of Fort Worth, a lender to General Dynamics, the TFX''s builder, before McClellan''s subcommittee. Kennedy, Oct. 31: "no evidence" Korth acted improperly. Nitze sworn Nov. 29.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-156) (Oct. 31, 1963). Art, *The TFX Decision* (see [[cal.1963-02-26.defense]]). Names: McClellan (K–J Cong. III.B); Nitze (K–J Adm. III.F).'
    tags: [name:korth-fred, name:mcclellan-john-l, name:nitze-paul, name:kennedy-john-f]
  - id: cal.1963-10-22.specials
    when: Oct. 22
    date: '1963-10-22'
    thread: specials
    c: 'North Dakota 1st, special. Mark Andrews (R) holds Nygaard''s seat, 49.1 percent, over Hove (Democratic-NPL), 44.3; a conservative Republican 6.3.'
    n: 'Votes: N.D. State Board of Canvassers, *Abstract of Votes*, special election, Oct. 22, 1963 ([sos.nd.gov](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1963-10-22-special.pdf)). See [[cal.1961-04-04.states-and-cities]]. Names: Hove (K–J Cong. III.K).'
    tags: [special:1963-10-22-h-ND-1, name:andrews-mark, name:nygaard-hjalmar-c, name:hove-john]
  - id: cal.1963-10-24.program
    when: Oct. 24
    date: '1963-10-24'
    thread: program
    c: 'Maternal and Child Health and Mental Retardation Planning Amendments signed: prenatal and infant care for mothers at risk; grants for State plans against retardation.'
    n: '[Pub. L. No. 88-156, 77 Stat. 273](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg273.pdf) (1963). [Remarks Upon Signing the Maternal and Child Health and Mental Retardation Planning Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-maternal-and-child-health-and-mental-retardation-planning-bill) (Oct. 24, 1963). Blumenthal & Morone, *The Heart of Power* (K–J Adm. II.B). See [[cal.1963-02-05.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-24.right-and-the-military
    when: Oct. 24
    date: '1963-10-24'
    thread: right-and-the-military
    c: 'Stevenson in Dallas for UN Day. Heckled, spat on, struck on the head with a placard. Walker''s "U.S. Day" rally the night before.'
    n: 'Manchester, *The Death of a President* (K–J Adm. II.F). Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4). See [[cal.1961-03.right-and-the-military]]. Names: Stevenson (K–J Adm. III.E); Walker (K–J Adm. III.F).'
    tags: [name:stevenson-adlai-e, name:walker-edwin-a]
  - id: cal.1963-10-29.civil-rights-bill
    when: Oct. 29
    date: '1963-10-29'
    thread: civil-rights-bill
    c: 'House Judiciary Committee approves the civil rights bill, 20–12 (check the vote): the Celler–McCulloch substitute, agreed with the Justice Department and Halleck, in place of the subcommittee''s broader bill. Part III dropped; an equal employment commission added. Kennedy: "comprehensive and fair."'
    n: '[Statement by the President Following Action on the Civil Rights Bill by the House Committee on the Judiciary](https://www.presidency.ucsb.edu/documents/statement-the-president-following-action-the-civil-rights-bill-the-house-committee-the) (Oct. 29, 1963). H.R. Rep. No. 88-914 (1963). Whalen, *The Longest Debate*; Purdum, *An Idea Whose Time Has Come*; Risen, *The Bill of the Century* (K–J Cong. II.C). See [[cal.1963-06-11.civil-rights-bill]]. Names: Celler (K–J Cong. III.D); McCulloch (K–J Cong. III.E); Halleck (K–J Cong. III.C).'
    tags: [name:celler-emanuel, name:mcculloch-william-m, name:halleck-charles-a, name:kennedy-john-f]
  - id: cal.1963-10-31.program
    when: Oct. 31
    date: '1963-10-31'
    thread: program
    c: 'Mental Retardation Facilities and Community Mental Health Centers Construction Act signed. Research centers and university clinics for the retarded; $150 million over three years toward community mental health centers. House conference report, Oct. 21, [299–13](https://voteview.com/rollcall/RH0880078).'
    n: '[Pub. L. No. 88-164, 77 Stat. 282](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg282.pdf) (1963). [Remarks Upon Signing Bill for the Construction of Mental Retardation Facilities and Community Mental Health Centers](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-for-the-construction-mental-retardation-facilities-and-community) (Oct. 31, 1963). See [[cal.1963-02-05.program]]; [[cal.1963-09-10.program]].'
    tags: [name:kennedy-john-f]
