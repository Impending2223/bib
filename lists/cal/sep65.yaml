# Cal. LXIV September 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXIV
entries:
  - id: cal.1965-09-01.india-and-china
    when: Sept. 1–8
    date: '1965-09-01'
    thread: india-and-china
    c: 'India and Pakistan at war. Pakistani armor across the Kashmir cease-fire line at Chhamb, Sept. 1; the Indian army over the border toward Lahore, Sept. 6. Sept. 8, Mahon tells the House, for the administration, that military aid shipments to both are suspended and no new economic aid committed. China''s note to India the same day; McNamara to Johnson: plans are needed if China moves.'
    n: 'FRUS 1964–68, XXV, docs. [187](https://history.state.gov/historicaldocuments/frus1964-68v25/d187), [190](https://history.state.gov/historicaldocuments/frus1964-68v25/d190), [193](https://history.state.gov/historicaldocuments/frus1964-68v25/d193). [111 Cong. Rec., House, Sept. 8, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt17/pdf/GPO-CRECB-1965-pt17-6-2.pdf), 23141 (Mahon). Robert J. McMahon, *The Cold War on the Periphery: The United States, India, and Pakistan* (1994); Dennis Kux, *India and the United States: Estranged Democracies, 1941–1991* (1992). Brands, *The Wages of Globalism* (K–J Adm. II.D). Bowles, *Promises to Keep* (K–J Adm. II.G.4). See [[cal.1965-08-05.india-and-china]]. Names: Mahon (K–J Cong. III.D); McNamara (K–J Adm. III.F).'
    tags: [name:mahon-george-h, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1965-09-03.latin-america
    when: Sept. 3–4
    date: '1965-09-03'
    thread: latin-america
    c: 'Santo Domingo. García-Godoy sworn in as provisional president, Sept. 3. The same morning, his memorandum of understanding with the embassy: the provisional government "will be anti-Communist." Sept. 4, American recognition, after consulting the OAS; some $20 million in aid to be arranged.'
    n: '[Statement by the President on the Agreement To Form a New Government in the Dominican Republic](https://www.presidency.ucsb.edu/documents/statement-the-president-the-agreement-form-new-government-the-dominican-republic) (Sept. 1, 1965); [Statement by the President Announcing U.S. Recognition of the New Dominican Government](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-us-recognition-the-new-dominican-government) (Sept. 4, 1965). [FRUS 1964–68, XXXII, doc. 130](https://history.state.gov/historicaldocuments/frus1964-68v32/d130). See [[cal.1965-04-28.latin-america]]; [[cal.1965-08-31.latin-america]].'
    tags: [name:garcia-godoy-hector, name:johnson-lyndon-b]
  - id: cal.1965-09-03.steel
    when: Sept. 3
    date: '1965-09-03'
    thread: steel
    also: [jobs-and-wages]
    c: 'Steel. Johnson on television from the White House, Abel and Cooper and their negotiators beside him: "essential agreement," after a week''s bargaining in Washington. Agreed Sept. 6: a 35-month contract, wages up 10 to 19 cents an hour the first year and 6 to 12 cents the third, pensions raised. No strike.'
    n: '[Televised Statement by the President Announcing Settlement of the Steel Dispute](https://www.presidency.ucsb.edu/documents/televised-statement-the-president-announcing-settlement-the-steel-dispute) (Sept. 3, 1965). Bureau of Labor Statistics, [*Wage Chronology: United States Steel Corporation and United Steelworkers of America (AFL-CIO), March 1937–April 1974*](https://fraser.stlouisfed.org/files/docs/publications/bls/bls_1814_1974.pdf), Bulletin 1814 (1974), 10. See [[cal.1965-08-30.steel]]. Names: Abel, Cooper (K–J Cong. III.K).'
    tags: [name:johnson-lyndon-b, name:abel-i-w, name:cooper-r-conrad]
  - id: cal.1965-09-03.states-and-cities
    when: Sept. 3
    date: '1965-09-03'
    thread: states-and-cities
    also: [congress]
    c: 'Home rule for the District. A discharge petition to bring the District charter bill, H.R. 4644, out of McMillan''s District Committee reaches 218 names, a majority of the House. Johnson on television: "we near victory in the final battle of the American Revolution." The Senate had passed its bill, S. 1118, July 22, [63–29](https://voteview.com/rollcall/RS0890172).'
    n: '[Televised Statement by the President Concerning the Signing of the D.C. Home Rule Petition by a Majority of House Members](https://www.presidency.ucsb.edu/documents/televised-statement-the-president-concerning-the-signing-the-dc-home-rule-petition) (Sept. 3, 1965); [Letter to the Chairman, House Committee on the District of Columbia](https://www.presidency.ucsb.edu/documents/letter-the-chairman-house-committee-the-district-columbia) (Sept. 4, 1965). Harry S. Jaffe & Tom Sherwood, *Dream City: Race, Power, and the Decline of Washington, D.C.* (1994); Chris Myers Asch & George Derek Musgrove, *Chocolate City: A History of Race and Democracy in the Nation''s Capital* (2017).'
    tags: [name:johnson-lyndon-b, name:mcmillan-john-l]
  - id: cal.1965-09-06.foreign-aid
    when: Sept. 6
    date: '1965-09-06'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1965 signed, [79 Stat. 653](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg653.pdf): economic and military aid for fiscal 1966, one year''s authority. The conferees and their chairmen, Fulbright and Morgan, ask a review of the program; Johnson promises studies this fall.'
    n: '[Statement by the President Upon Signing the Foreign Assistance Act](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-assistance-act-1) (Sept. 6, 1965). Ruttan, *United States Development Assistance Policy* (K–J Adm. II.D). See [[cal.1964-10-07.foreign-aid]]. Names: Fulbright (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:morgan-thomas-e]
  - id: cal.1965-09-09.cities-and-housing
    when: Sept. 9
    date: '1965-09-09'
    thread: cities-and-housing
    c: 'Department of Housing and Urban Development Act signed in the Rose Garden, [79 Stat. 667](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg667.pdf): the eleventh executive department. The Housing and Home Finance Agency, the FHA, the Public Housing Administration, and the Federal National Mortgage Association go into it; in force in sixty days. No Secretary named.'
    n: '[Remarks at the Signing of Bill Establishing a Department of Housing and Urban Development](https://www.presidency.ucsb.edu/documents/remarks-the-signing-bill-establishing-department-housing-and-urban-development) (Sept. 9, 1965). Gelfand, *A Nation of Cities*; Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B). Pritchett, *Robert Clifton Weaver and the American City* (K–J Adm. II.G.5). See [[cal.1962-02-21.program]]; [[cal.1965-06-16.cities-and-housing]]; [[cal.1965-08-10.cities-and-housing]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-12.opinion
    when: Sept. 12
    date: '1965-09-12'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Aug. 27–Sept. 1, South only: Johnson 44 percent, Nixon 47. The Johnson Administration pushing integration too fast: Southern whites 69, whites outside the South 36.'
    n: '*The Gallup Poll*, III, 1961 (K–J Cong. II.E). The integration figures are those printed for July 16–21 ([[cal.1965-08-06.opinion]]). Check. Names: Johnson (K–J Adm. III.D); Nixon (Opp. III.E).'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1965-09-15.latin-america
    when: Sept. 15
    date: '1965-09-15'
    thread: latin-america
    c: 'Fulbright in the Senate on the Dominican intervention, from his committee''s hearings: policy "characterized initially by overtimidity and subsequently by overreaction," and throughout "by a lack of candor"; the decision that the revolt "should not be allowed to succeed" rested on "exaggerated estimates of Communist influence." Sept. 20, the House, on Selden''s H. Res. 560, [312–52](https://voteview.com/rollcall/RH0890160): an American state may meet Communist subversion in the hemisphere "so far as resort to armed force."'
    n: '[111 Cong. Rec., Senate, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-1.pdf); [111 Cong. Rec., House, Sept. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-5-1.pdf). Fulbright, *The Arrogance of Power* (K–J Cong. II.D). Woods, *Fulbright: A Biography* (K–J Cong. II.I.1). Lowenthal, *The Dominican Intervention* (K–J Adm. II.D). See [[cal.1965-04-28.latin-america]]; [[cal.1965-09-03.latin-america]]. Names: Fulbright (K–J Cong. III.B).'
    tags: [name:fulbright-j-william, name:selden-armistead-i-jr]
  - id: cal.1965-09-17.mississippi
    when: Sept. 17
    date: '1965-09-17'
    thread: mississippi
    also: [congress]
    c: 'House dismisses the Freedom Democrats'' contests of Mississippi''s five seats, Hamer, Annie Devine, and Victoria Gray the contestants: H. Res. 585, reported by Burleson''s House Administration Committee, the sitting members entitled to their seats, [228–143](https://voteview.com/rollcall/RH0890158).'
    n: '[111 Cong. Rec., House, Sept. 17, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-4-2.pdf). Dittmer, *Local People*; Payne, *I''ve Got the Light of Freedom* (K–J Cong. II.F). See [[cal.1965-01-04.congress]]. Names: Hamer (K–J Cong. III.H).'
    tags: [name:hamer-fannie-lou, name:burleson-omar-t, name:devine-annie, name:gray-victoria-jackson]
  - id: cal.1965-09-17.opinion
    when: Sept. 17
    date: '1965-09-17'
    thread: opinion
    c: 'Gallup, Aug. 27–Sept. 1, whites: advice to Negroes seeking better jobs and respect: more education 44 percent; work harder 19; be law-abiding, earn respect 15; be less aggressive, go slower 14; stop riots and civil rights activities 12.'
    n: '*The Gallup Poll*, III, 1961 (K–J Cong. II.E).'
  - id: cal.1965-09-20.india-and-china
    when: Sept. 20–22
    date: '1965-09-20'
    thread: india-and-china
    c: 'Security Council, Goldberg presiding, Sept. 20: Resolution 211, a cease-fire by Sept. 22. India accepts; Bhutto announces Pakistan''s acceptance at the deadline, the night of Sept. 21–22. In effect at 6 p.m. Sept. 22, Washington time. Johnson''s statement, read by Moyers, commends both, and Thant and Goldberg.'
    n: 'S.C. Res. 211 (Sept. 20, 1965). [Statement by the President on the Cease-Fire Agreements by India and Pakistan](https://www.presidency.ucsb.edu/documents/statement-the-president-the-cease-fire-agreements-india-and-pakistan) (Sept. 22, 1965). FRUS 1964–68, XXV, docs. [213](https://history.state.gov/historicaldocuments/frus1964-68v25/d213), [222](https://history.state.gov/historicaldocuments/frus1964-68v25/d222), [223](https://history.state.gov/historicaldocuments/frus1964-68v25/d223). See [[cal.1965-09-01.india-and-china]]. Names: Goldberg (K–J Adm. III.E); U Thant (K–J Adm. III.J); Moyers (K–J Adm. III.C).'
    tags: [name:goldberg-arthur-j, name:bhutto-zulfikar-ali, name:u-thant, name:moyers-bill, name:johnson-lyndon-b]
  - id: cal.1965-09-22.immigration
    when: Sept. 22–30
    date: '1965-09-22'
    thread: immigration
    c: 'Senate passes the immigration bill, [76–18](https://voteview.com/rollcall/RS0890232), with a ceiling of 120,000 a year on the Western Hemisphere from July 1, 1968, which the House had refused. Sept. 30, the conference report: House, [320–70](https://voteview.com/rollcall/RH0890177); Senate, by voice.'
    n: '[111 Cong. Rec., Senate, Sept. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-7-2.pdf); [111 Cong. Rec., House, Sept. 30, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-5-2.pdf); [111 Cong. Rec., Senate, Sept. 30, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-5-1.pdf). See [[cal.1965-01-13.immigration]]; [[cal.1965-08-25.immigration]].'
  - id: cal.1965-09-22.crime-and-hijacking
    when: Sept. 22
    date: '1965-09-22'
    thread: crime-and-hijacking
    c: 'Law Enforcement Assistance Act signed, [79 Stat. 828](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg828.pdf): the Attorney General to make grants to States, cities, and others for training police and for new methods against crime. The day before, $1.5 million for the President''s crime commission and the District''s.'
    n: '[Statement by the President Following the Signing of Law Enforcement Assistance Bills](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-signing-law-enforcement-assistance-bills) (Sept. 22, 1965); [Remarks to the Members of the President''s Commission on Law Enforcement and Administration of Justice](https://www.presidency.ucsb.edu/documents/remarks-the-members-the-presidents-commission-law-enforcement-and-administration-justice) (Sept. 8, 1965). Flamm, *Law and Order* (K–J Cong. II.F). See [[cal.1965-07-23.crime-and-hijacking]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-22.opinion
    when: Sept. 22
    date: '1965-09-22'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 27–Sept. 1: a candidate for Congress for sending a great many more men to Vietnam: more inclined to vote for him 33 percent, less 38. For trying harder for a compromise peace: more inclined 68, less 14. Republicans and Democrats alike.'
    n: '*The Gallup Poll*, III, 1962 (K–J Cong. II.E).'
  - id: cal.1965-09-24.civil-rights-the-executive
    when: Sept. 24
    date: '1965-09-24'
    thread: civil-rights-the-executive
    c: 'Executive Order 11246, [30 Fed. Reg. 12319](https://www.govinfo.gov/app/details/FR-1965-09-28): equal employment by government contractors to the Secretary of Labor, in the federal service to the Civil Service Commission; the President''s Committee on Equal Employment Opportunity abolished. Order 11247, [30 Fed. Reg. 12327](https://www.govinfo.gov/app/details/FR-1965-09-28): the Attorney General to coordinate enforcement of Title VI. Humphrey''s Council on Equal Opportunity ended, on his recommendation.'
    n: '[Executive Order 11246—Equal Employment Opportunity](https://www.presidency.ucsb.edu/documents/executive-order-11246-equal-employment-opportunity); [Executive Order 11247](https://www.presidency.ucsb.edu/documents/executive-order-11247-providing-for-the-coordination-the-attorney-general-enforcement); [Memorandum on Reassignment of Civil Rights Functions](https://www.presidency.ucsb.edu/documents/memorandum-reassignment-civil-rights-functions) (Sept. 24, 1965). Graham, *The Civil Rights Era*; Sugrue, *Affirmative Action from Below* (K–J Adm. II.C). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Humphrey (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1965-09-24.latin-america
    when: Sept. 24
    date: '1965-09-24'
    thread: latin-america
    c: 'Panama. Johnson, and Robles in Panama at the same hour, announce the areas of agreement: the 1903 treaty to be abrogated; a new treaty to recognize Panama''s sovereignty over the Canal Zone; separate treaties on bases and on a sea-level canal. The American negotiators Robert Anderson and Irwin.'
    n: '[Statement by the President on the Progress of Treaty Negotiations With Panama](https://www.presidency.ucsb.edu/documents/statement-the-president-the-progress-treaty-negotiations-with-panama) (Sept. 24, 1965). FRUS 1964–68, XXXI, docs. [428](https://history.state.gov/historicaldocuments/frus1964-68v31/d428), [429](https://history.state.gov/historicaldocuments/frus1964-68v31/d429). LaFeber, *The Panama Canal*; Jorden, *Panama Odyssey* (K–J Adm. II.D). See [[cal.1964-12-18.latin-america]].'
    tags: [name:johnson-lyndon-b, name:robles-mendez-marco-aurelio, name:anderson-robert-b, name:irwin-john-n-ii]
  - id: cal.1965-09-26.opinion
    when: Sept. 26
    date: '1965-09-26'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Aug. 27–Sept. 1: Republicans'' first choice for 1968: Nixon 28, Romney 15, Lodge 12, Goldwater 9, Scranton 8, Rockefeller 7, Dirksen 5, Taft 3, Lindsay 3, Hatfield 2, Reagan 2, Percy 1. Know something about: Nixon 79, Goldwater 75, Lodge 68, Rockefeller 68, Romney 48, Reagan 46.'
    n: '*The Gallup Poll*, III, 1963 (K–J Cong. II.E). Names: Lodge (K–J Adm. III.E); Dirksen (K–J Cong. III.A); Nixon (Opp. III.E); Goldwater, Hatfield, Percy (Opp. III.B); Lindsay (Opp. III.D); Reagan (Opp. III.F); Romney, Scranton, Rockefeller (Opp. III.H).'
    tags: [name:nixon-richard-m, name:romney-george-w, name:lodge-henry-cabot, name:goldwater-barry-m, name:scranton-william-w, name:rockefeller-nelson, name:dirksen-everett, name:taft-robert-jr, name:lindsay-john-v, name:hatfield-mark-o, name:reagan-ronald, name:percy-charles-h]
  - id: cal.1965-09-27.states-and-cities
    when: Sept. 27–29
    date: '1965-09-27'
    thread: states-and-cities
    also: [congress]
    c: 'The House on District home rule. Sept. 27, the discharge, [213–183](https://voteview.com/rollcall/RH0890170), and the rule, [223–179](https://voteview.com/rollcall/RH0890171). Sept. 29, a motion to strike the enacting clause lost, [179–219](https://voteview.com/rollcall/RH0890173). Multer''s substitute, the Senate''s plan less its fixed federal payment, amended by Sisk''s: a referendum on an elected board to write a charter, the charter to go to the voters and to Congress, [227–174](https://voteview.com/rollcall/RH0890174). Passed, [283–117](https://voteview.com/rollcall/RH0890176). No conference this session. Check.'
    n: '[111 Cong. Rec., House, Sept. 27, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-2-1.pdf); [111 Cong. Rec., House, Sept. 29, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-4-1.pdf). See [[cal.1965-09-03.states-and-cities]].'
    tags: [name:multer-abraham-j, name:sisk-bernice-f]
  - id: cal.1965-09-29.program
    when: Sept. 29
    date: '1965-09-29'
    thread: program
    c: 'National Foundation on the Arts and the Humanities Act signed in the Rose Garden, [79 Stat. 845](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg845.pdf): a National Endowment for the Arts and one for the Humanities, $10 million a year for three years between them, and money to match gifts. The House passed it Sept. 15, a motion to recommit lost, [128–251](https://voteview.com/rollcall/RH0890154); the Senate took the House''s text Sept. 16.'
    n: '[Remarks at the Signing of the Arts and Humanities Bill](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-arts-and-humanities-bill) (Sept. 29, 1965). [111 Cong. Rec., House, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-2.pdf); [111 Cong. Rec., Senate, Sept. 16, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-3-2.pdf). Donna M. Binkiewicz, *Federalizing the Muse: United States Arts Policy and the National Endowment for the Arts, 1965–1980* (2004). See [[cal.1965-01-04.program]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-29.opinion
    when: Sept. 29
    date: '1965-09-29'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Aug. 27–Sept. 1: the $1.25 minimum wage: increase 55 percent, leave as is 39. Of those for an increase, about $1.50, 53; $1.75, 21; $2.00, 11. Manual workers 69 for an increase, farmers 32.'
    n: '*The Gallup Poll*, III, 1963 (K–J Cong. II.E).'
  - id: cal.1965-09-30.alabama
    when: Sept. 30
    date: '1965-09-30'
    thread: alabama
    c: Hayneville. An all-white jury acquits Coleman of manslaughter in the killing of Jonathan Daniels, after 63 minutes. The State's Attorney General, who had wanted a murder charge and had taken over the prosecution, removed from the case by the judge.
    n: 'U.S. Dep''t of Justice, Civil Rights Div., [Notice to Close File No. 144-2-1429](https://www.justice.gov/crt/file/891176/dl) (Apr. 28, 2011). See [[cal.1965-08-20.alabama]]. Names: Coleman, Daniels (K–J Cong. III.K).'
    tags: [name:coleman-thomas-l, name:daniels-jonathan-m]
