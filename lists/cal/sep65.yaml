entries:
  - id: cal.1965-09-01.india-and-china
    when: Sept. 1
    date: '1965-09-01'
    thread: india-and-china-kashmir
    c: India and Pakistan at war. Pakistani armor across the Kashmir cease-fire line at Chhamb.
    n: 'Check: the record. [[w.mcmahon-cold-war-on-the]]; [[w.kux-india-and-the-united]]; [[w.brands-wages-of-globalism]]; [[w.bowles-promises-to-keep]]. See [[cal.1965-08-05.india-and-china]].'
  - id: cal.1965-09-01.legislatures-ca
    when: Sept. 1
    date: '1965-09-01'
    thread: legislatures
    c: '*Silver v. Brown*, 63 Cal. 2d 270: the California Supreme Court, without dissent, finds both houses malapportioned (the Assembly''s largest district 306,191, its smallest 72,105), the federal court''s deadline of July 1 having passed with the Senate unreapportioned. The Legislature to act by Dec. 9; else the court''s own plans. No district more than 15 percent from the ideal; a majority of each house from districts of at least 48 percent of the people.'
    n: '*Silver v. Brown*, [63 Cal. 2d 270](https://static.case.law/cal-2d/63/html/0270-01.html) (1965); *Jordan v. Silver*, [381 U.S. 415](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381415/usrep381415.pdf) (1965) (the federal court''s judgment affirmed, June 1). [[w.dixon-democratic-representation]]; [[w.baker-reapportionment-revolution]]; [[w.ansolabehere-end-of-inequality-2008]]; [[w.boyarsky-big-daddy]]. See [[cal.1964-06-15.court]]; [[cal.1962-11-06.legislatures-ca]].'
    tags: [state:ca]
  - id: cal.1965-09-03.latin-america
    when: Sept. 3–4
    date: '1965-09-03'
    thread: latin-america-dominican-republic
    c: 'Santo Domingo. García-Godoy sworn in as provisional president, Sept. 3. The same morning, his memorandum of understanding with the embassy: the provisional government "will be anti-Communist." Sept. 4, American recognition, after consulting the OAS; some $20 million in aid to be arranged.'
    n: '[Statement by the President on the Agreement To Form a New Government in the Dominican Republic](https://www.presidency.ucsb.edu/documents/statement-the-president-the-agreement-form-new-government-the-dominican-republic) (Sept. 1, 1965); [Statement by the President Announcing U.S. Recognition of the New Dominican Government](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-us-recognition-the-new-dominican-government) (Sept. 4, 1965). [FRUS 1964–68, XXXII, doc. 130](https://history.state.gov/historicaldocuments/frus1964-68v32/d130). See [[cal.1965-04-28.latin-america]]; [[cal.1965-08-31.latin-america]]. Names: García-Godoy.'
    tags: [name:garcia-godoy-hector, name:johnson-lyndon-b]
  - id: cal.1965-09-03.steel
    when: Sept. 3
    date: '1965-09-03'
    thread: steel
    also: [jobs-and-wages]
    c: 'Steel. Johnson on television from the White House, Abel and Cooper and their negotiators beside him: "essential agreement," after a week''s bargaining in Washington. Agreed Sept. 6: a 35-month contract, wages up 10 to 19 cents an hour the first year and 6 to 12 cents the third, pensions raised. No strike.'
    n: '[Televised Statement by the President Announcing Settlement of the Steel Dispute](https://www.presidency.ucsb.edu/documents/televised-statement-the-president-announcing-settlement-the-steel-dispute) (Sept. 3, 1965). Bureau of Labor Statistics, [*Wage Chronology: United States Steel Corporation and United Steelworkers of America (AFL-CIO), March 1937–April 1974*](https://fraser.stlouisfed.org/files/docs/publications/bls/bls_1814_1974.pdf), Bulletin 1814 (1974), 10. See [[cal.1965-08-30.steel]]. Names: Johnson, Abel, R. Conrad Cooper.'
    tags: [name:johnson-lyndon-b, name:abel-i-w, name:cooper-r-conrad]
  - id: cal.1965-09-03.states-and-cities
    when: Sept. 3
    date: '1965-09-03'
    thread: states-and-cities
    also: [congress]
    c: 'Home rule for the District. A discharge petition to bring the District charter bill, H.R. 4644, out of McMillan''s District Committee reaches 218 names, a majority of the House. Johnson on television: "we near victory in the final battle of the American Revolution." The Senate had passed its bill, S. 1118, July 22, [63–29](https://voteview.com/rollcall/RS0890172).'
    n: '[Televised Statement by the President Concerning the Signing of the D.C. Home Rule Petition by a Majority of House Members](https://www.presidency.ucsb.edu/documents/televised-statement-the-president-concerning-the-signing-the-dc-home-rule-petition) (Sept. 3, 1965); [Letter to the Chairman, House Committee on the District of Columbia](https://www.presidency.ucsb.edu/documents/letter-the-chairman-house-committee-the-district-columbia) (Sept. 4, 1965). [[w.jaffe-dream-city]]; [[w.asch-chocolate-city]]. Names: McMillan, Johnson.'
    tags: [name:johnson-lyndon-b, name:mcmillan-john-l, state:dc, city:washington]
  - id: cal.1965-09-06.foreign-aid
    when: Sept. 6
    date: '1965-09-06'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1965 signed, [79 Stat. 653](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg653.pdf): economic and military aid for fiscal 1966, one year''s authority. The conferees and their chairmen, Fulbright and Morgan, ask a review of the program; Johnson promises studies this fall.'
    n: '[Statement by the President Upon Signing the Foreign Assistance Act](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-assistance-act-1) (Sept. 6, 1965). [[w.ruttan-united-states-development-assistance]]. See [[cal.1964-10-07.foreign-aid]]. Names: Fulbright, Morgan, Johnson.'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:morgan-thomas-e]
  - id: cal.1965-09-06.india-and-china
    when: Sept. 6
    date: '1965-09-06'
    thread: india-and-china-kashmir
    c: The Indian army over the Pakistan border toward Lahore.
    n: '[FRUS 1964–68, XXV, doc. 187](https://history.state.gov/historicaldocuments/frus1964-68v25/d187). See [[cal.1965-09-01.india-and-china]].'
  - id: cal.1965-09-07.state-constitutions-tx
    when: Sept. 7
    date: '1965-09-07'
    thread: state-constitutions
    also: [legislatures]
    c: Texas refuses an amendment to enlarge the Senate from 31 to 39, apportion it by population and drop the limit of one Senator a county, 85,951 to 136,461.
    n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Sept. 7, 1965](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1965-09-07). See [[cal.1965-01-11.legislatures-tx]].'
    tags: [state:tx]
  - id: cal.1965-09-08.jobs-and-wages-ca
    when: Sept. 8
    date: '1965-09-08'
    thread: jobs-and-wages
    c: Delano, Cal. Filipino grape pickers of the AFL-CIO's Agricultural Workers Organizing Committee strike the table-grape growers.
    n: 'Check: the record. [[w.pawel-crusades-of-cesar-chavez]]; [[w.bardacke-trampling-out-the-vintage]].'
    tags: [state:ca]
  - id: cal.1965-09-08.transportation
    when: Sept. 8
    date: '1965-09-08'
    thread: transportation
    also: [cities-and-housing]
    c: 'National Capital Transportation Act signed, [79 Stat. 663](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg663.pdf): rail rapid transit for Washington, mostly within the District, on the Agency''s plan of January 1965, not over $431 million, to be extended to Maryland and Virginia under a compact Maryland has approved.'
    n: Statute (K–J Cong. II.J.2). [Letter to the President of the Senate and to the Speaker of the House on a Rapid Transit Program for the Nation's Capital](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-rapid-transit-program-for-the) (Feb. 10, 1965); [Remarks at the Signing of the National Capital Transportation Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-national-capital-transportation-act) (Sept. 8, 1965). See [[cal.1963-05-27.transportation]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-08.india-and-china
    when: Sept. 8
    date: '1965-09-08'
    thread: india-and-china-kashmir
    c: 'Mahon tells the House, for the administration, that military aid shipments to India and Pakistan are suspended and no new economic aid committed. China''s note to India the same day; McNamara to Johnson: plans are needed if China moves.'
    n: '[111 Cong. Rec., House, Sept. 8, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt17/pdf/GPO-CRECB-1965-pt17-6-2.pdf), 23141 (Mahon). FRUS 1964–68, XXV, docs. [190](https://history.state.gov/historicaldocuments/frus1964-68v25/d190) (Komer, Sept. 7), [193](https://history.state.gov/historicaldocuments/frus1964-68v25/d193) (editorial note). See [[cal.1965-09-01.india-and-china]]. Names: Mahon, McNamara, Johnson.'
    tags: [name:mahon-george-h, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1965-09-09.cities-and-housing
    when: Sept. 9
    date: '1965-09-09'
    thread: cities-and-housing
    c: 'Department of Housing and Urban Development Act signed in the Rose Garden, [79 Stat. 667](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg667.pdf): the eleventh executive department. The Housing and Home Finance Agency, the FHA, the Public Housing Administration, and the Federal National Mortgage Association go into it; in force in sixty days. No Secretary named.'
    n: '[Remarks at the Signing of Bill Establishing a Department of Housing and Urban Development](https://www.presidency.ucsb.edu/documents/remarks-the-signing-bill-establishing-department-housing-and-urban-development) (Sept. 9, 1965). [[w.gelfand-nation-of-cities]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.pritchett-robert-clifton-weaver-and]]. See [[cal.1962-02-21.program]]; [[cal.1965-06-16.cities-and-housing]]; [[cal.1965-08-10.cities-and-housing]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-09.european-community
    when: Sept. 9
    date: '1965-09-09'
    thread: european-community
    c: 'De Gaulle''s press conference: against the Commission and majority voting.'
    n: 'Check: the record. See [[cal.1965-06-30.european-community]]. Names: de Gaulle.'
    tags: [name:de-gaulle-charles]
  - id: cal.1965-09-12.opinion
    when: Sept. 12
    date: '1965-09-12'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 27–Sept. 1, South only: Johnson 44 percent, Nixon 47. The Johnson Administration pushing integration too fast: Southern whites 69, whites outside the South 36.'
    n: '[[w.gallup-poll]], III, 1961. The integration figures are those printed for July 16–21 ([[cal.1965-08-06.opinion]]). Check. Names: Johnson, Nixon.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1965-09-14.mayors-nyc
    when: Sept. 14
    date: '1965-09-14'
    thread: mayors
    also: [elections-1965]
    c: New York's Democratic primary for mayor. Beame, the city comptroller, 336,345, 44.8 percent; Screvane, president of the City Council, Wagner's choice, 271,381, 36.2; U.S. Representative Ryan 113,738, 15.2; O'Dwyer 28,675, 3.8. Check the date.
    n: '[Wikipedia, "1965 New York City mayoral election"](https://en.wikipedia.org/wiki/1965_New_York_City_mayoral_election). Check: the Board of Elections'' canvass. [[w.cannato-ungovernable-city]]; [[w.soyer-left-in-the-center]]; [[w.hentoff-political-life]]. See [[cal.1965-06-10.states-and-cities]]. Names: Beame, O''Dwyer, Screvane, Wagner, Ryan.'
    tags: [state:ny, city:nyc, name:beame-abraham-d, name:screvane-paul-r, name:ryan-william-f, name:odwyer-paul, name:wagner-robert-f-jr]
  - id: cal.1965-09-14.state-constitutions-ok
    when: Sept. 14
    date: '1965-09-14'
    thread: state-constitutions
    c: 'Oklahoma, special election: a local school levy of up to 10 mills, voted by each district, adopted, 125,779 to 59,535.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 53](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=53). See [[cal.1964-11-03.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1965-09-15.latin-america
    when: Sept. 15
    date: '1965-09-15'
    thread: latin-america-dominican-republic
    c: 'Fulbright in the Senate on the Dominican intervention, from his committee''s hearings: policy "characterized initially by overtimidity and subsequently by overreaction," and throughout "by a lack of candor"; the decision that the revolt "should not be allowed to succeed" rested on "exaggerated estimates of Communist influence." Sept. 20, the House, on Selden''s H. Res. 560, [312–52](https://voteview.com/rollcall/RH0890160): an American state may meet Communist subversion in the hemisphere "so far as resort to armed force."'
    n: '[111 Cong. Rec., Senate, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-1.pdf); [111 Cong. Rec., House, Sept. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-5-1.pdf). [[w.fulbright-arrogance-of-power]]; [[w.woods-fulbright]]; [[w.lowenthal-dominican-intervention]]. See [[cal.1965-04-28.latin-america]]; [[cal.1965-09-03.latin-america]]. Names: Fulbright, Selden.'
    tags: [name:fulbright-j-william, name:selden-armistead-i-jr]
  - id: cal.1965-09-16.jobs-and-wages-ca
    when: Sept. 16
    date: '1965-09-16'
    thread: jobs-and-wages
    c: Delano. Chavez's National Farm Workers Association votes to join the grape strike.
    n: 'Check: the record. See [[cal.1965-09-08.jobs-and-wages-ca]]. Names: Chavez.'
    tags: [state:ca, name:chavez-cesar]
  - id: cal.1965-09-17.mississippi
    when: Sept. 17
    date: '1965-09-17'
    thread: mississippi
    also: [congress]
    c: 'House dismisses the Freedom Democrats'' contests of Mississippi''s five seats, Hamer, Annie Devine, and Victoria Gray the contestants: H. Res. 585, reported by Burleson''s House Administration Committee, the sitting members entitled to their seats, [228–143](https://voteview.com/rollcall/RH0890158).'
    n: '[111 Cong. Rec., House, Sept. 17, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-4-2.pdf). [[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]. See [[cal.1965-01-04.congress]]. Names: Hamer, Annie Devine, Victoria Gray, Burleson.'
    tags: [name:hamer-fannie-lou, name:burleson-omar-t, name:devine-annie, name:gray-victoria-jackson]
  - id: cal.1965-09-17.opinion
    when: Sept. 17
    date: '1965-09-17'
    thread: opinion
    c: 'Gallup, Aug. 27–Sept. 1, whites: advice to Negroes seeking better jobs and respect: more education 44 percent; work harder 19; be law-abiding, earn respect 15; be less aggressive, go slower 14; stop riots and civil rights activities 12.'
    n: '[[w.gallup-poll]], III, 1961.'
  - id: cal.1965-09-17.conservation-ca
    when: Sept. 17
    date: '1965-09-17'
    thread: conservation
    also: [states-and-cities]
    c: 'The McAteer–Petris Act in force: a San Francisco Bay Conservation and Development Commission to plan for the bay and meanwhile to permit or refuse its filling. Check the dates of passage and signing.'
    n: Cal. Stats. 1965 (Check the chapter). [[w.walker-country-in-the-city]].
    tags: [state:ca, city:san-francisco, city:oakland]
  - id: cal.1965-09-20.india-and-china
    when: Sept. 20–22
    date: '1965-09-20'
    thread: india-and-china-kashmir
    c: 'Security Council, Goldberg presiding, Sept. 20: Resolution 211, a cease-fire by Sept. 22. India accepts; Bhutto announces Pakistan''s acceptance at the deadline, the night of Sept. 21–22. In effect at 6 p.m. Sept. 22, Washington time. Johnson''s statement, read by Moyers, commends both, and Thant and Goldberg.'
    n: '[S.C. Res. 211](https://undocs.org/S/RES/211(1965)) (Sept. 20, 1965). [Statement by the President on the Cease-Fire Agreements by India and Pakistan](https://www.presidency.ucsb.edu/documents/statement-the-president-the-cease-fire-agreements-india-and-pakistan) (Sept. 22, 1965). FRUS 1964–68, XXV, docs. [213](https://history.state.gov/historicaldocuments/frus1964-68v25/d213), [222](https://history.state.gov/historicaldocuments/frus1964-68v25/d222), [223](https://history.state.gov/historicaldocuments/frus1964-68v25/d223). See [[cal.1965-09-01.india-and-china]]. Names: Goldberg, Bhutto, U Thant, Moyers, Johnson.'
    tags: [name:goldberg-arthur-j, name:bhutto-zulfikar-ali, name:u-thant, name:moyers-bill, name:johnson-lyndon-b]
  - id: cal.1965-09-22.immigration
    when: Sept. 22
    date: '1965-09-22'
    thread: immigration
    c: Senate passes the immigration bill, [76–18](https://voteview.com/rollcall/RS0890232), with a ceiling of 120,000 a year on the Western Hemisphere from July 1, 1968, which the House had refused.
    n: '[111 Cong. Rec., Senate, Sept. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-7-2.pdf). See [[cal.1965-01-13.immigration]]; [[cal.1965-08-25.immigration]].'
  - id: cal.1965-09-22.crime-and-hijacking
    when: Sept. 22
    date: '1965-09-22'
    thread: crime-and-hijacking
    c: 'Law Enforcement Assistance Act signed, [79 Stat. 828](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg828.pdf): the Attorney General to make grants to States, cities, and others for training police and for new methods against crime. The day before, $1.5 million for the President''s crime commission and the District''s.'
    n: '[Statement by the President Following the Signing of Law Enforcement Assistance Bills](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-signing-law-enforcement-assistance-bills) (Sept. 22, 1965); [Remarks to the Members of the President''s Commission on Law Enforcement and Administration of Justice](https://www.presidency.ucsb.edu/documents/remarks-the-members-the-presidents-commission-law-enforcement-and-administration-justice) (Sept. 8, 1965). [[w.flamm-law-and-order]]. See [[cal.1965-07-23.crime-and-hijacking]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-22.opinion
    when: Sept. 22
    date: '1965-09-22'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 27–Sept. 1: a candidate for Congress for sending a great many more men to Vietnam: more inclined to vote for him 33 percent, less 38. For trying harder for a compromise peace: more inclined 68, less 14. Republicans and Democrats alike.'
    n: '[[w.gallup-poll]], III, 1962.'
  - id: cal.1965-09-24.civil-rights-the-executive
    when: Sept. 24
    date: '1965-09-24'
    thread: civil-rights-the-executive
    c: 'Executive Order 11246, [30 Fed. Reg. 12319](https://www.govinfo.gov/app/details/FR-1965-09-28): equal employment by government contractors to the Secretary of Labor, in the federal service to the Civil Service Commission; the President''s Committee on Equal Employment Opportunity abolished. Order 11247, [30 Fed. Reg. 12327](https://www.govinfo.gov/app/details/FR-1965-09-28): the Attorney General to coordinate enforcement of Title VI. Humphrey''s Council on Equal Opportunity ended, on his recommendation.'
    n: '[Executive Order 11246—Equal Employment Opportunity](https://www.presidency.ucsb.edu/documents/executive-order-11246-equal-employment-opportunity); [Executive Order 11247](https://www.presidency.ucsb.edu/documents/executive-order-11247-providing-for-the-coordination-the-attorney-general-enforcement); [Memorandum on Reassignment of Civil Rights Functions](https://www.presidency.ucsb.edu/documents/memorandum-reassignment-civil-rights-functions) (Sept. 24, 1965). [[w.graham-civil-rights-era]]; [[w.sugrue-affirmative-action-from-below]]. See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1965-09-24.latin-america
    when: Sept. 24
    date: '1965-09-24'
    thread: latin-america
    c: 'Panama. Johnson, and Robles in Panama at the same hour, announce the areas of agreement: the 1903 treaty to be abrogated; a new treaty to recognize Panama''s sovereignty over the Canal Zone; separate treaties on bases and on a sea-level canal. The American negotiators Robert Anderson and Irwin.'
    n: '[Statement by the President on the Progress of Treaty Negotiations With Panama](https://www.presidency.ucsb.edu/documents/statement-the-president-the-progress-treaty-negotiations-with-panama) (Sept. 24, 1965). FRUS 1964–68, XXXI, docs. [428](https://history.state.gov/historicaldocuments/frus1964-68v31/d428), [429](https://history.state.gov/historicaldocuments/frus1964-68v31/d429). [[w.lafeber-panama-canal]]; [[w.jorden-panama-odyssey]]. See [[cal.1964-12-18.latin-america]]. Names: Johnson, Robles Méndez, Robert Anderson, Irwin.'
    tags: [name:johnson-lyndon-b, name:robles-mendez-marco-aurelio, name:anderson-robert-b, name:irwin-john-n-ii]
  - id: cal.1965-09-26.opinion
    when: Sept. 26
    date: '1965-09-26'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 27–Sept. 1: Republicans'' first choice for 1968: Nixon 28, Romney 15, Lodge 12, Goldwater 9, Scranton 8, Rockefeller 7, Dirksen 5, Taft 3, Lindsay 3, Hatfield 2, Reagan 2, Percy 1. Know something about: Nixon 79, Goldwater 75, Lodge 68, Rockefeller 68, Romney 48, Reagan 46.'
    n: '[[w.gallup-poll]], III, 1963. Names: Lodge, Dirksen, Nixon, Goldwater, Hatfield, Percy, Lindsay, Taft, Reagan, Romney, Scranton, Rockefeller.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:lodge-henry-cabot, name:goldwater-barry-m, name:scranton-william-w, name:rockefeller-nelson, name:dirksen-everett, name:taft-robert-jr, name:lindsay-john-v, name:hatfield-mark-o, name:reagan-ronald, name:percy-charles-h]
  - id: cal.1965-09-27.states-and-cities
    when: Sept. 27–29
    date: '1965-09-27'
    thread: states-and-cities
    also: [congress]
    c: 'The House on District home rule. Sept. 27, the discharge, [213–183](https://voteview.com/rollcall/RH0890170), and the rule, [223–179](https://voteview.com/rollcall/RH0890171). Sept. 29, a motion to strike the enacting clause lost, [179–219](https://voteview.com/rollcall/RH0890173). Multer''s substitute, the Senate''s plan less its fixed federal payment, amended by Sisk''s: a referendum on an elected board to write a charter, the charter to go to the voters and to Congress, [227–174](https://voteview.com/rollcall/RH0890174). Passed, [283–117](https://voteview.com/rollcall/RH0890176). No conference this session. Check.'
    n: '[111 Cong. Rec., House, Sept. 27, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-2-1.pdf); [111 Cong. Rec., House, Sept. 29, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt19/pdf/GPO-CRECB-1965-pt19-4-1.pdf). See [[cal.1965-09-03.states-and-cities]]. Names: Multer, Sisk.'
    tags: [name:multer-abraham-j, name:sisk-bernice-f, state:dc, city:washington]
  - id: cal.1965-09-28.states-and-cities-ma
    when: Sept. 28
    date: '1965-09-28'
    thread: states-and-cities
    c: Massachusetts. Crimmins and three other members of the Governor's Council, Sullivan, Favulli and Stasiun, convicted of conspiracy and soliciting bribes for DiNatale's reappointment; Crimmins of taking one. Crimmins resigns; two and a half years.
    n: '*Commonwealth v. Favulli*, [352 Mass. 95](https://static.case.law/mass/352/case-pdfs/0095-01.pdf) (1967). [Wikipedia, "Joseph Ray Crimmins"](https://en.wikipedia.org/wiki/Joseph_Ray_Crimmins). Check against the court''s record. See [[cal.1964-10-13.states-and-cities-ma]]. Names: Crimmins, Sullivan, Favulli, Stasiun.'
    tags: [state:ma, name:crimmins-joseph-ray, name:sullivan-raymond-f, name:favulli-michael, name:stasiun-ernest-c]
  - id: cal.1965-09-29.program
    when: Sept. 29
    date: '1965-09-29'
    thread: program
    c: 'National Foundation on the Arts and the Humanities Act signed in the Rose Garden, [79 Stat. 845](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg845.pdf): a National Endowment for the Arts and one for the Humanities, $10 million a year for three years between them, and money to match gifts. The House passed it Sept. 15, a motion to recommit lost, [128–251](https://voteview.com/rollcall/RH0890154); the Senate took the House''s text Sept. 16.'
    n: '[Remarks at the Signing of the Arts and Humanities Bill](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-arts-and-humanities-bill) (Sept. 29, 1965). [111 Cong. Rec., House, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-2.pdf); [111 Cong. Rec., Senate, Sept. 16, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-3-2.pdf). [[w.binkiewicz-federalizing-the-muse]]. See [[cal.1965-01-04.program]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-09-29.opinion
    when: Sept. 29
    date: '1965-09-29'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Aug. 27–Sept. 1: the $1.25 minimum wage: increase 55 percent, leave as is 39. Of those for an increase, about $1.50, 53; $1.75, 21; $2.00, 11. Manual workers 69 for an increase, farmers 32.'
    n: '[[w.gallup-poll]], III, 1963.'
  - id: cal.1965-09-30.alabama
    when: Sept. 30
    date: '1965-09-30'
    thread: alabama
    c: Hayneville. An all-white jury acquits Coleman of manslaughter in the killing of Jonathan Daniels, after 63 minutes. The State's Attorney General, who had wanted a murder charge and had taken over the prosecution, removed from the case by the judge.
    n: 'U.S. Dep''t of Justice, Civil Rights Div., [Notice to Close File No. 144-2-1429](https://www.justice.gov/crt/file/891176/dl) (Apr. 28, 2011). See [[cal.1965-08-20.alabama]]. Names: Thomas Coleman, Daniels.'
    tags: [name:coleman-thomas-l, name:daniels-jonathan-m]
  - id: cal.1965-09-30.alabama-al
    when: Sept. 30
    date: '1965-09-30'
    thread: governors
    also: [alabama, state-constitutions, legislatures]
    c: 'Wallace''s special session on succession: an amendment to let the governor serve a second term in a row. House Bill 1 passes the House, 74 to 23 (Check the date).'
    n: '[*Journal of the House*, Third Special Session, 1965, 51](https://archive.org/details/alabama-house-journal-1965-special-b/page/n562). Steve Flowers, ["The 1965 special succession session"](https://www.alreporter.com/2020/05/13/opinion-the-1965-special-succession-session/), *Alabama Political Reporter*, May 13, 2020. [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.frady-wallace]]. Names: Wallace.'
    tags: [state:al, name:wallace-george-c]
  - id: cal.1965-09-30.transportation
    when: Sept. 30
    date: '1965-09-30'
    thread: transportation
    c: 'High-Speed Ground Transportation Act signed, [79 Stat. 893](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg893.pdf): research and development by the Secretary of Commerce, $20 million for fiscal 1966 and $35 million in each of the next two. Johnson thanks Pell, "who harassed me week after week." The House passed it Sept. 2, [318–23](https://voteview.com/rollcall/RH0890131).'
    n: 'Statute (K–J Cong. II.J.2). [Remarks at the Signing of the High-Speed Ground Transportation Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-high-speed-ground-transportation-act) (Sept. 30, 1965). See [[cal.1965-03-04.transportation]]. Names: Johnson, Pell.'
    tags: [name:johnson-lyndon-b, name:pell-claiborne-d]
  - id: cal.1965-09-30.immigration
