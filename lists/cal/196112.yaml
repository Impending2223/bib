  - id: cal.1961-12.oil
    when: Dec.
    date: 1961-12
    thread: oil
    c: 'The world''s crude oil output in 1961, as the Bureau of Mines first counted it: 22.4 million barrels a day. The United States 7.18, the Soviet Union 3.32, Venezuela 2.92, Kuwait 1.64, Saudi Arabia 1.39. Libya''s first year, 0.02. Proved reserves, the Oil and Gas Journal''s year-end count: 310 billion barrels.'
    n: Bureau of Mines, [*Minerals Yearbook 1961*, II, Table 88, pp. 477–478](https://archive.org/details/pub_usgov-minerals-yearbook_1961_2/page/n484) (1962); [*The Oil and Gas Journal*, Dec. 25, 1961, 104–105](https://archive.org/details/sim_oil-gas-journal_1961-12-25_59_52/page/n111). See [[cal.1960-12.oil]].
    tags: [oilworld:1961]
