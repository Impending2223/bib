    n: '[[w.smith-on-his-own-terms]], 364. To check: Hinman to Rockefeller, "Republican MidWestern States Conference," Dec. 4, 1961, Rockefeller Archive Center (cited by [[w.smith-on-his-own-terms]], 364). See [[cal.1961-11-17.elections-1964]]. Names: Hinman, Rockefeller.'
