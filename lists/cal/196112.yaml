    c: 'At the Secretariat on the 1962 plan Zhou Enlai: drop the dream of foreign aid, be self-reliant; the four backbone targets (steel, coal, timber, oil) not to be cut again; others adjusted in balance; the part serves the whole, the present the long run, the Party the Center. Seven points: seize coal and timber first, then non-ferrous metals and fertilizer; quotas; cuts in staff (12 million this year, 8 million next, 3 million workers); production with repair; queueing of capital construction; thrift; variety and quality. He goes on at the Secretariat on the 12th.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 443 (Dec. 11, 1961); [[w.yang-shangkun-riji]], II, 98 (Dec. 11, 1961; the Secretariat, 3:30 to 6:30 p.m., hears the Planning Commission on the 1962 plan, Zhou present); [[w.deng-xiaoping-nianpu-1904]], III, 1675–1676 (Dec. 11, 1961; afternoon; Deng presides, Zhou attends; Cheng Zihua (footnote 1: then executive deputy director of the Planning Commission) on the 1962 plan. Deng: no "back doors" in local capital construction; no tactics between Center and localities, tactics only for enemies; is there zeal under centralization? too many small worlds; finance and banking to the Center alone; the decentralization of banking wholly wrong). Made public: 1997. Names: Zhou Enlai.'
