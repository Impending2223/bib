    date: 1961-12
    thread: defense
    c: 'Hickey, director of the Net Evaluation Subcommittee: controlled response not possible until the late 1960s, and then incompletely. A strike under no warning in 1962 short of carriers by the equivalent of 156 B-52s, the deficit doubling in 1963; enough carriers, and a reserve, by 1964.'
