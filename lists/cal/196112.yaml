    date: '1961-12-13'
    thread: europe-and-the-alliance
    also: [berlin-and-vienna]
    c: 'Paris, the NATO ministers. Rusk and McNamara brief the allies on intelligence and strategy, by Rusk''s report to Kennedy "unprecedented in NATO experience." Couve de Murville, by Rusk''s account, holds out against "negotiations" in the communiqué: "One does not telephone President de Gaulle."'
    n: '[FRUS 1961–63, XIII, doc. 117](https://history.state.gov/historicaldocuments/frus1961-63v13/d117) (Rusk to Kennedy, eyes only, Dec. 15). [[w.rusk-as-i-saw-it-1990]], 226 (the communiqué). Names: Rusk, McNamara, Couve de Murville, de Gaulle.'
