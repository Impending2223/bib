  - id: cal.1961-12-21.china-leadership-3
    when: Dec. 21
    date: '1961-12-21'
    place: peking
    thread: china-seven-thousand
    also: [soviet-union, china-polemic]
    c: 'Peking.{1} At the Central Work Conference before the Seven Thousand Cadres'' conference Deng Xiaoping speaks chiefly on the struggle against revisionism, Zhou Enlai having given the report on the whole international situation. The Twenty-second Congress and Khrushchev''s four "antis," against Stalin, the "anti-party group," Albania and China, are the full exposure of his revisionism. The movement faces a split, first of the socialist camp, and chiefly Sino-Soviet relations. Some parties side with China, still few, most with the CPSU; there is a left inside the CPSU that defends Stalin; other parties are dividing. The Australian and Belgian parties have split, the Indian, French and Italian are dividing. After Khrushchev''s break with Albania (Wu''s note: Dec. 15, the Soviet government announcing the withdrawal of its diplomats and asking Albania''s out), Albania speaks in its own voice and every party must think what to say; "a hundred voices answering one" is gone. China''s influence has grown; Khrushchev''s group''s standing has fallen. Be ready for setback and retreat in the movement, yet the sky will not fall; Marxist-Leninist ranks are tempered by struggle. China must choose to drift with Khrushchev or to hold high the banner against revisionism: the Center has weighed it and holds that the red flag must not fall.{2}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 480–482 ("Dec. 21", the Central Work Conference "before the Seven Thousand"; Wu prints "December 1962" for the conference (480), a slip for 1961: the conference before the Seven Thousand Cadres opened Dec. 20, 1961, [[cal.1961-12-20.china-leadership]]); [[w.yang-shangkun-riji]], II, 101 (Dec. 21, 1961; the Huairen Tang''s great hall, 3 to 6 p.m., over 100 of the bureaus, provinces, cities and central departments; Deng Xiaoping speaks on the conference''s order and arrangements); [[w.deng-xiaoping-nianpu-1904]], III, 1678–1679 (Dec. 21, 1961; Deng chairs the plenary and speaks on the agenda, the world, home affairs, the long plan, the 1962 plan and the Party: good done the base, errors too, the Center first, the provinces second; the Secretariat''s errors, no timely concrete policies, high and shifting targets, the "great drives", too much decentralization; the seven-to-ten-year plan centered on food, clothing and use, one national economic system; resolve, discipline, unified leadership, the whole, truth from facts, the mass line, strict Party life); [[w.peng-zhen-nianpu-1902]], IV, 165 (Dec. 21, 1961; Peng Zhen at the plenary hearing Deng relay Mao''s estimate of the situation, and Deng''s long speech). Made public: 1999. Check: Yang Shangkun''s diary gives Deng''s speech that afternoon as on the conference''s agenda and arrangements ([[w.yang-shangkun-riji]], II, 101). Names: Deng Xiaoping, Zhou Enlai, Khrushchev. Check: the Soviet step against Albania: Wu''s bracketed note has the Soviet diplomats withdrawn Dec. 15 (481); Liu''s speech has relations broken Dec. 3 (483).'
    src:
      c: 8cf3c004
      rows:
