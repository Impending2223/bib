  - id: cal.1961-12-16.latin-america
    when: Dec. 16–17
    date: '1961-12-16'
    thread: latin-america
    c: Kennedy in Caracas and Bogotá.{1} At Caracas more than 4,000 political suspects are jailed for the visit and 20,000 troops face the crowds on the route from the airport; O'Donnell and Powers carry revolvers at his side.{2} At Bogotá at least 500,000.{3}
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). [[w.reeves-president-kennedy]], 267–68; [[w.goodwin-remembering-america]], 214 (Kennedy asks Goodwin by telephone whether to go despite the Secret Service: "I think the trip will be a triumph"; Goodwin drafts all his speeches for Venezuela and Colombia; at the Caracas airport: "Listen, Dick, if this doesn''t work out, you''d better keep on going south"; at Bogotá at least 500,000); [[w.salinger-with-kennedy]], 167–68 (Caracas: Pérez, the Venezuelan security chief, jails more than four thousand political suspects for the visit and lines the route from the airport with twenty thousand troops; O''Donnell and Powers armed at the President''s side; a Navy communications ship offshore; not Bogotá); [[w.salinger-with-kennedy]], 167; [[w.goodwin-remembering-america]], 214. [[w.nixon-six-crises]], 223 n.3 (Caracas: Communists rounded up and their offices shut beforehand; 35,000 troops on the route). See [[cal.1961-03-13.latin-america]]. Names: O''Donnell, Powers.'
