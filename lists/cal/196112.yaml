    c: 'Chicago, the Avenue Motel.{1} White''s group, its second meeting, twenty-eight present;{2} new among them Governor Nutter of Montana, Tad Smith, the Texas chairman, and Fay of the national committee.{3} A budget of $65,000 for the year approved;{4} Roger Milliken finance chairman, to raise the first $30,000.{5} The country in nine regions, a director each;{6} delegates to be sought in every State, from the precinct caucuses of 1962 and 1963 up.{7} Among themselves, "the Clif White group."{8} Rousselot is there.{9} Novak: by the end of 1961 a secret organization for "a conservative," White its chairman, Milbank, Middendorf and J. Stetson Coleman its trustees.{10} White''s map colors the States for Goldwater: 637 of the 655 delegates needed "likely already in the bag."{11}'
