  - id: cal.1961-12-20.middle-east-johnson-plan
    when: Dec. 20
    date: '1961-12-20'
    thread: middle-east-johnson-plan
    c: 'General Assembly Resolution 1725 (XVI), the United States'' draft: the PCC to intensify its efforts under paragraph 11 of Resolution 194 (III); the Arab host governments and Israel urged to cooperate; the refugees'' property in Palestine to be identified and valued by Sept. 1, 1962. Amendments of Afghanistan, Indonesia and Pakistan, to enlarge the PCC to five and have it protect the refugees'' property, fail of two-thirds; the United States votes against them.'
