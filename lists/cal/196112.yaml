  - id: cal.1961-12-16.china-leadership-3
    when: Dec. 16–21
    date: '1961-12-16'
    thread: china-leadership
    also: [economy]
    c: 'Zhou Enlai at the Secretariat on Dec. 16, 18 and 21, hearing Bo Yibo on the national industrial secretaries'' conference: three years of Leap have made the frame of the economy large and unsound, a swollen pig with too little material, so first remove the frame (close, stop, merge, shift); second, clear the confused economic order and build a new one; third, the hundreds of thousands of enterprises'' tangled contradictions to be solved by concentration, unity and one heart, from the whole, or no new order can be built.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 445 (Dec. 16, 1961); [[w.yang-shangkun-riji]], II, 100 (Dec. 18, 1961; the Secretariat, 9 to 12:30, on the industrial conference, Zhou present); [[w.deng-xiaoping-nianpu-1904]], III, 1676–1677 (Dec. 16, 1961; morning; Deng presides, Zhou attends; the work conference''s preparations and the Secretariat''s report on selected central documents since 1958 and "Mao on the general line and the struggle between two roads". Deng: responsibility for the errors, the Center first, the provinces second; Mao''s words right, many measures against them: high and shifting plans, long fronts; the "great drives" by deadline; decentralization''s chaos; local committees resisting the centralization the Seventy Articles ask); [[w.deng-xiaoping-nianpu-1904]], III, 1677–1678 (Dec. 18, 1961; morning; Deng presides, Zhou attends; Bo Yibo on the industrial conference. Deng: the old and sick cut from the towns kept by the enterprises at full pay; the Seventy Articles tried first, not amended; the Seven Thousand Cadres conference early next year (footnote 1: the enlarged work conference, over 7,000 cadres) to unite the Party''s thinking; low targets now hard to accept, departmentalism; the high targets the Center''s fault, chiefly the Secretariat''s; power taken back, Center from localities, provinces from enterprises, enterprises from workshops). Made public: 1997. Names: Zhou Enlai, Bo Yibo.'
