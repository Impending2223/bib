    also: [economy, china-economy]
    c: 'Zhou Enlai''s report to the Central Work Conference on the situation and eight tasks for 1962.{1} Great war can be put off, small wars not avoided; the situation improving, villages before towns; three years'' errors cost much, the results chief; 1962 the key year of adjustment.{2} The eight tasks: drop the frame; cut staff; farm output; timber, coal, steel, ore and transport; clear materials; the market; carry out the policies and regulations; build a new order.{3}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 446–47 (Dec. 28, 1961); [[w.yang-shangkun-riji]], II, 103–104 (Dec. 28, 1961; 10 a.m. to 1 and 4 to 7 p.m.; in truth a summing up of three years and the tasks of the next few; the imbalances analyzed; the eight tasks: put down airs; cut staff resolutely; buy more; make sure of timber, coal, ore and transport; clear materials; secure the market; carry out the policies, systems and regulations; build a new order); [[w.deng-xiaoping-nianpu-1904]], III, 1680 (Dec. 28, 1961; Deng at the plenary hearing Zhou); [[w.peng-zhen-nianpu-1902]], IV, 165 (Dec. 28, 1961; Peng Zhen at the plenary hearing Zhou''s report on the situation and the work of 1962). See [[cal.1961-12-20.china-leadership]]. Made public: 1997. Names: Zhou Enlai.'
