  - id: cal.1961-12-15.china-leadership
    when: Dec. 15
    date: '1961-12-15'
    thread: china-zhou-foreign
    also: [foreign-aid, china-foreign]
    c: 'Zhou Enlai presides at the State Council''s 114th meeting, which adopts, among seven items, the proposal to pardon another group of war criminals of the Chiang Kai-shek group and of Manchukuo. On foreign aid: it must not be faked; what is poor must be said so, China''s experience passed on honestly; no bad goods. At the close, on the Leap''s lessons: some work pressed too hard, the construction front too long; the two years of adjustment the key; stop all works not urgent; concentrate and unify, heed the Center, the State Council and the Economic and Planning Commissions.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 444 (Dec. 15, 1961). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
