    tags: [polity:prc, vis:only:prc]
  - id: cal.1961-12-15.china-leadership-10
    when: Dec. 15
    date: '1961-12-15'
    thread: china-agriculture
    c: 'Peng Dehuai 彭德怀 investigates at the Chenpu brigade 陈蒲大队 of Nangu commune 南谷公社, a backward brigade.{1} Told of the Leap 大跃进, he says the iron smelting cost the nation dearly, toiling the people and wasting wealth, and the masses have lost faith; on the refunds: the nation''s losses are too large to repay easily, the losses of 1958, 1959 and 1960 not repaid if the whole nation went a year without eating.{2}'
    n: '[[w.peng-dehuai-nianpu]], 767. The words: 上午 (767). Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc@2, name:peng-dehuai]
