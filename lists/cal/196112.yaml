  - id: cal.1961-12-10.opinion
    when: Dec. 10
    date: '1961-12-10'
    thread: opinion
    also: [defense]
    c: 'Gallup, Nov. 17–22: would work a day or two to build a community fallout shelter, 62 percent; give a day''s pay, 19; neither, 19. More emphasis on community shelters, 58; on home shelters, 22.'
    n: '[[w.gallup-poll]], III, 1745.'
  - id: cal.1961-12-10.goldwater
    when: Dec. 10
    date: '1961-12-10'
    thread: goldwater
    also: [elections-1964]
    c: Chicago, the Avenue Motel. White's group, its second meeting, twenty-eight present; new among them Governor Nutter of Montana, Tad Smith, the Texas chairman, and Fay of the national committee. A budget of $65,000 for the year approved; Roger Milliken finance chairman, to raise the first $30,000. The country in nine regions, a director each; delegates to be sought in every State, from the precinct caucuses of 1962 and 1963 up. Among themselves, "the Clif White group."
    n: '[[w.white-suite-3505]], 46–51; [[w.white-making-of-the-president-1965]], 92 (the same motel; the governor of Montana there; nine regions; an office for White; $60,000 to raise); [[w.goldberg-barry-goldwater]], 163–64 (Chicago; nine regions, each under a part-time director; each State''s rules for choosing delegates to be learned; a budget of $65,000, approved unanimously; Rousselot there, so Welch informed); [[w.bernstein-guns-or-butter]], 125 (a budget, largely an office and salary for White; nine regions; a strategy for conservative delegates). Check: Theodore White, 92, gives twenty-seven present and $60,000. Check: Goldberg, 163, gives Dec. 12. See [[cal.1961-10-08.goldwater]]. Names: White, Nutter.'
    src:
      c: 0f8dc9b1
      rows:
