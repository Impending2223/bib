    thread: defense
    c: 'JSCP-63, the Joint Strategic Capabilities Plan for July 1, 1962–June 30, 1963, approved. Circulated in January 1962, it sets NSC 5906/1 aside: engagements with Soviet forces "not of such a nature as to constitute sufficient cause" for general war.'
