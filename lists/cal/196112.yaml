    thread: vietnam
    c: 'Honolulu.{1} McNamara''s first conference on Vietnam, nine hours, with Lemnitzer, Felt and men from Washington and Saigon;{2} one a month to follow.{3} "Money is no object";{4} the one restriction "that combat troops will not be introduced."{5} Results to show in thirty days.{6} On Diệm: "we are stuck with him and must make the best of it."{7}'
