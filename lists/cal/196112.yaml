    also: [south-asia]
    c: 'Chen Yi, receiving the Pakistani ambassador, Pir Ali Mohammed Rashdi: China has never meddled in the internal disputes and internal affairs of Asian and African countries. On disputes between Asian–African states, such as India and Pakistan over Kashmir, China has always held that they should be settled by friendly consultation for a fair and reasonable result, and will not change its stand because India today is hostile to China. On the dispute between Afghanistan and Pakistan, China has kept silent on it, to hope the two sister countries reach a fair and reasonable solution by consultation. But where an Asian–African state is in a dispute with imperialism and colonialism, China does not mediate but stands firmly with the anti-imperialist, anti-colonial Asian, African and Latin American countries.'
