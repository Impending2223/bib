  - id: cal.1961-12-19.robert-kennedy
    when: Dec. 19
    date: '1961-12-19'
    thread: robert-kennedy
    also: [right-and-the-military]
    c: 'Walter and Victor Reuther and Joseph Rauh to Robert Kennedy, a memorandum, "The Radical Right in America Today": a right "bounded on the left by Senator Goldwater and on the right by Robert Welch"; the Attorney General''s list of subversive organizations; the FCC to look into free broadcast time given the right; tax exemptions revoked, which "might scare off a substantial part of the big money." Dec. 20, at the IRS, after the President''s press conference of Nov. 29: eighteen organizations listed for audit, the Ideological Organizations Project. May 15, 1962, the Commissioner informs Robert Kennedy.'
    n: '[Reuther Memorandum, 19 December 1961](https://www.jfklibrary.org/asset-viewer/archives/rfkag-063-013#?image_identifier=RFKAG-063-013-p0012), Attorney General''s papers, Kennedy Library. The President''s News Conference, [1961 Pub. Papers 756](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=814) (Nov. 29, 1961). [S. Rep. No. 94-755, Book III, 891–93 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=896) (K–J Adm. II.H.3). Made public: the memorandum, in [[w.janson-far-right]]; the audits, by the staff of the Joint Committee on Internal Revenue Taxation, June 5, 1975, and the Church Committee, Book III (1976). [[w.schlesinger-robert-kennedy-and-his]], 451 (the President''s request to Walter Reuther after his speeches on the West Coast; the memorandum''s leak). To check: [[w.matzko-radio-right]]. Names: Walter Reuther, Victor Reuther, Rauh, Robert Kennedy, Goldwater, Welch.'
    src:
      c: c294b3e0
      rows:
