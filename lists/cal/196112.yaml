  - id: cal.1961-12-02.cuba
    when: Dec. 2
    date: '1961-12-02'
    thread: cuba
    c: Castro declares himself a Marxist-Leninist.
    n: '[FRUS 1961–63, XII, doc. 122](https://history.state.gov/historicaldocuments/frus1961-63v12/d122). See [[cal.1961-04-15.cuba]]. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1961-12-02.oil
    when: Dec. 2
    date: '1961-12-02'
    thread: oil
    c: Kennedy announces a study of petroleum requirements and supplies against security objectives, the import program included, under the Office of Emergency Planning, by mid-1962. Interior's proposals to amend Proclamation 3279 under consideration; allocations meanwhile as before.
    n: 'FRUS 1961–63, IX, doc. [344](https://history.state.gov/historicaldocuments/frus1961-63v09/d344) (White House press release). See [[cal.1960-10-28.oil]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-12-05.alabama-al
    when: Dec. 5
    date: '1961-12-05'
    thread: alabama
    also: [state-constitutions, state-and-city-finance]
    c: 'Constitutional amendment election, forty-five amendments, most of them county taxes and powers to court industry. State bonds: $10,000,000 for prisons refused, 74,718 to 86,687, 46.3 percent; $3,000,000 for the University of Alabama Research Institute at Huntsville adopted, 115,280 to 37,418, 75.5 percent; $2,000,000 for hospitals and health centers adopted, 97,200 to 41,961, 69.8 percent. Emergency interim legislators in case of enemy attack, adopted, 94,887 to 40,101, 70.3 percent. Eminent domain, refused, 68,842 to 69,336, 49.8 percent.'
    n: '[*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), 672–674](https://archive.org/details/alabama-official-statistical-register-1963/page/n671).'
    tags: [state:al, city:huntsville]
  - id: cal.1961-12-05.africa
    when: Dec. 5
    date: '1961-12-05'
    thread: africa
    c: 'The NSC on the Volta dam. Rusk: the United States committed by the letter of June 29. Kennedy: no support to be had in Congress; decide, then explain; how to justify help to Nkrumah, given his course at home and abroad? The decision deferred for a legal report.'
    n: 'FRUS 1961–63, XXI, docs. [239](https://history.state.gov/historicaldocuments/frus1961-63v21/d239) (Bundy, Dec. 1), [240](https://history.state.gov/historicaldocuments/frus1961-63v21/d240), [241](https://history.state.gov/historicaldocuments/frus1961-63v21/d241). Made public: FRUS 1961–63, XXI (1995). [[w.schlesinger-thousand-days-1965]], 572–73. Schlesinger, 573, has the decision to go ahead made in November and the NSC told of it; the record of action, the decision deferred (doc. 241). See [[cal.1961-06-29.africa]]. Names: Rusk, Kennedy, Nkrumah.'
    src:
      c: 32672fce
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v21/d239: all'
        - 'w.schlesinger-thousand-days-1965 573: A'
    tags: [name:kennedy-john-f, name:rusk-dean, name:nkrumah-kwame]
  - id: cal.1961-12-07.states-and-cities-nh
    when: Dec. 7
    date: '1961-12-07'
    thread: states-and-cities
    also: [congress]
    c: Powell names Murphy, 34, his attorney general since Nov. 4 and once his administrative assistant, to Bridges's Senate seat until the election of 1962.
    n: '[Cong. Rec., Senate, Jan. 10, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-1-1.pdf) (Powell''s certificate of appointment). [Wikipedia, "Maurice J. Murphy Jr."](https://en.wikipedia.org/wiki/Maurice_J._Murphy_Jr.). Check Murphy''s age. See [[cal.1961-11-26.states-and-cities-nh]]. Names: Powell, Murphy, Bridges.'
    tags: [state:nh, name:bridges-henry-s, name:powell-wesley, name:murphy-maurice-j-jr]
  - id: cal.1961-12-07.africa
    when: Dec. 7
    date: '1961-12-07'
    thread: africa
    also: [robert-kennedy]
    c: 'Robert Kennedy to the President against the Volta dam: Nkrumah "growing closer and closer to the Soviet Bloc"; friends such as the Ivory Coast, Togo and Upper Volta get one to six million dollars, Ghana this with no strings; the lesson to play the Soviet Union off against the United States; Nkrumah''s opponents jailed without trial.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 560–61. To check: Robert Kennedy to the President, Dec. 7, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 561 n.6). See [[cal.1961-12-05.africa]]. Names: Robert Kennedy, Kennedy, Nkrumah.'
    src:
      c: 99eb0f46
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 560–61: all'
        - 'via w.schlesinger-robert-kennedy-and-his 561 n.6: all'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:nkrumah-kwame]
