  - id: cal.1961-12-21.china-leadership-4
    when: Dec. 21
    date: '1961-12-21'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi interjects while Deng Xiaoping reports on the domestic situation at the Central Work Conference: whose is the responsibility for this period''s faults and errors? First, the Center; second, the provinces and cities; third, below the provinces and cities too. Each has its account to examine; return to Marxism that seeks truth from facts. Not telling the truth, or false boasting, over- or under-reporting by design: as a matter of Party discipline this is to be settled; what is past is past, but if repeated, expulsion from the Party or at least disciplinary punishment.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543–544 (Dec. 21, 1961); [[w.mao-zedong-zhuan]], V, ch. 69 (Dec. 21: Deng Xiaoping at the Central Work Conference on the domestic situation and the Party''s work; the Standing Committee''s seven points to the Party, among them keeping discipline and seeking truth from facts, and the Seven Thousand Cadres conference of Jan. 11, its aim to "build up energy and unify thought"). Made public: 1996. Names: Liu Shaoqi, Deng Xiaoping.'
    tags: [polity:prc, name:liu-shaoqi, name:deng-xiaoping, vis:only:prc]
