  - id: cal.1961-12-16.china-leadership-3
    when: Dec. 16–21
    date: '1961-12-16'
    thread: china-zhou
    also: [economy, china-economy]
    c: 'Zhou Enlai at the Secretariat on Dec. 16, 18 and 21, hearing Bo Yibo on the national industrial secretaries'' conference: three years of Leap have made the frame of the economy large and unsound, a swollen pig with too little material, so first remove the frame (close, stop, merge, shift);{1} second, clear the confused economic order and build a new one; third, the hundreds of thousands of enterprises'' tangled contradictions to be solved by concentration, unity and one heart, from the whole, or no new order can be built.{2} Deng Xiaoping presides on Dec. 16 and 18. Dec. 16: the Secretariat takes up the preparations for the Central Work Conference and its report to Mao and the Politburo Standing Committee, with a selection of Center documents since 1958 and "Mao Zedong on the general line of socialist construction and the struggle between the two lines." Deng: for the errors of recent years the Center is responsible first, the provinces second. Dec. 18: the Seven Thousand Cadres conference is to open early next year to unite the Party''s thinking.{3} Peng Zhen attends the Dec. 16 meeting.{4}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 445 (Dec. 16, 1961); [[w.yang-shangkun-riji]], II, 100 (Dec. 18, 1961; the Secretariat, 9 to 12:30, on the industrial conference, Zhou present); [[w.deng-xiaoping-nianpu-1904]], III, 1676–1677 (Dec. 16, 1961; morning; Deng presides, Zhou attends; the work conference''s preparations and the Secretariat''s report on selected central documents since 1958 and "Mao on the general line and the struggle between two roads". Deng: responsibility for the errors, the Center first, the provinces second; Mao''s words right, many measures against them: high and shifting plans, long fronts; the "great drives" by deadline; decentralization''s chaos; local committees resisting the centralization the Seventy Articles ask); [[w.deng-xiaoping-nianpu-1904]], III, 1677–1678 (Dec. 18, 1961; morning; Deng presides, Zhou attends; Bo Yibo on the industrial conference. Deng: the old and sick cut from the towns kept by the enterprises at full pay; the Seventy Articles tried first, not amended; the Seven Thousand Cadres conference early next year (footnote 1: the enlarged work conference, over 7,000 cadres) to unite the Party''s thinking; low targets now hard to accept, departmentalism; the high targets the Center''s fault, chiefly the Secretariat''s; power taken back, Center from localities, provinces from enterprises, enterprises from workshops); [[w.peng-zhen-nianpu-1902]], IV, 164 (Dec. 16, 1961; Peng Zhen at the Secretariat on preparing the work conference and on the Secretariat''s report to Mao and the Standing Committee on a selection of the Center''s documents since 1958 and "Comrade Mao Zedong on the general line of socialist construction and the struggle between the two lines"); [[w.deng-xiaoping-nianpu-1904]], III, 1676–1678; [[w.peng-zhen-nianpu-1902]], IV, 164. Made public: 1997. Names: Zhou Enlai, Bo Yibo, Peng Zhen.'
