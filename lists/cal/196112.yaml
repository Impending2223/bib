    when: Dec. 15
    date: '1961-12-15'
    place: hanoi
    thread: vietnam-diplomacy
    also: [china-leadership]
    c: 'Hanoi. Ye Jianying''s military goodwill mission arrives: Liu Yalou, Xiao Hua, Yang Chengwu, Huang Yongsheng, Xiao Xiangrong, Vice Adm. Wu Ruilin, Maj. Gen. Lei Yingfu, Sr. Col. Liu Zhongkui. Met by Giáp, Văn Tiến Dũng, Song Hào, Hoàng Văn Thái, Trần Văn Trà, Trần Quý Hai, Phạm Kiệt, Hoàng Văn Tiến and Trần Duy Hưng, Hanoi''s mayor. Evening, the banquets: Giáp and Ye, China and Vietnam "as close as lips and teeth."'
    n: '[[w.guan-vietnamese-communists-relations-with]], 210–211; [[w.liu-jixian-ye-jianying-nianpu]], II, 893 (Dec. 15–31, 1961; Ye Jianying 叶剑英 leads the Chinese military goodwill delegation 中国军事友好代表团 to Hanoi 河内 for the Vietnam People''s Army''s seventeenth anniversary). To check: Peking Review IV, no. 51, Dec. 22, 1961, 16–17 (cited by [[w.guan-vietnamese-communists-relations-with]], 210 n.29a); FO 371/166713, DV 103110/2, 3 January 1962, from Hanoi to Foreign Office: visit of the Chinese military delegation to North Vietnam (cited by [[w.guan-vietnamese-communists-relations-with]], 210 n.29b). Names: Ye Jianying, Huang Yongsheng, Xiao Xiangrong, Võ Nguyên Giáp, Văn Tiến Dũng, Hoàng Văn Thái, Trần Văn Trà, Liu Yalou, Xiao Hua, Yang Chengwu, Song Hào.'
