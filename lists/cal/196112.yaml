  - id: cal.1961-12-20.china-leadership-15
    when: Dec. 20
    date: '1961-12-20'
    thread: china-agriculture
    c: 'Peng Dehuai 彭德怀 puts five investigation reports in order: the all-round increase of the Jinxing brigade 金星大队 of Wushi commune 乌石公社 this year; the Wushi brigade 乌石大队; the craftsmen of the Jinxing, Xinping 新坪 and Wushi brigades; a brigade whose output fell (the Chenpu brigade 陈蒲大队 of Nangu commune 南谷公社); the market trade of Huangjingping 黄荆坪, Huashi district 花石区. The Wushi report: grain up this year, but members have lost faith in the collective and want to farm alone and fix output by household, a view most can be argued out of by the "Sixty Articles" kept, refunds and pay by work; egalitarianism in distribution; life better than last year; the team the best accounting unit. Jinxing: grain up 18.2 percent, 45.7 percent on last year; after procurement 500 jin of paddy a head, a net 45.40 yuan a member, 95 percent with more income. Chenpu: by February 1962, seventy percent of its people out of grain; without measures, more dropsy, flight and "abnormal deaths," and part of the procured grain should be returned. Crafts and markets, restored rightly, enliven the village economy.'
    n: '[[w.peng-dehuai-nianpu]], 768–770. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai, ok:fields-place]
