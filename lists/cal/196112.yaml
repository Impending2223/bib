  - id: cal.1961-12-15.china-leadership-6
    when: Dec. 15
    date: '1961-12-15'
    place: wuxi
    thread: china-mao
    also: [china-agriculture, china-economy]
    c: 'Wuxi 无锡. Mao 毛泽东 hears Jiang Weiqing 江渭清 of Jiangsu 江苏 and Zeng Xisheng 曾希圣 of Anhui 安徽. Jiang: this year''s grain plan for the villages is below last year''s, but with private plots and the odd plots 70 percent of places are better off, 15 percent the same and 15 percent in want; 94 percent of the levy in, cotton over the plan, pigs, fowl, foreign trade and finance well. Hearing good news after a year of bad, Mao stays three days, not one. Mao: look on the bright side; the faults are thousands but can be overcome; no need to be gloomy; "after long lying, time to get up"; the basic accounting unit to go down quickly, which is no retreat; the next year to put all seven fronts, industry, farming, commerce, schools, army, government and Party, on track; contracting output to households 包产到户 is not to be done.'
    n: '[[w.mao-zedong-zhuan]], V, ch. 69 n.4. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). Check: Mubei (I, 334; II, 830, no note) has Mao at Wuxi in Dec. 1961 ask Zeng Xisheng 曾希聖, in the tone of consultation, whether, production recovering, the responsibility fields should be changed back; Zeng: the masses have just tasted the sweetness and might keep them a while; Mao said nothing then. To check: Relayed record of Mao Zedong''s 毛泽东 remarks on hearing Jiang Weiqing 江渭清 and others, Dec. 20, 1961 (传达记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.4); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Check: the day of these remarks, Dec. 14 or 15; the record is dated Dec. 20. See [[cal.1961-12-14.china-leadership-7]]. Names: Mao Zedong, Jiang Weiqing, Zeng Xisheng.'
    src:
      c: 4ee8482a
      rows:
        - 'w.mao-zedong-zhuan V, ch. 69: all'
        - 'via w.mao-zedong-zhuan V, ch.69 n.4: all'
    tags: [polity:prc, name:mao-zedong, vis:only:prc, name:jiang-weiqing, name:zeng-xisheng]
