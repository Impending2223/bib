  - id: cal.1961-12-01.defense
    when: Dec. 1
    date: '1961-12-01'
    thread: defense
    c: 'The Joint Chiefs to McNamara: 16 divisions required "to conduct contingency operations in two areas simultaneously while maintaining an acceptable general war posture." Decker for 16 regulars; Shoup if the Army''s ceiling stays at 960,000; Anderson and LeMay for mobilizing two Guard divisions; Lemnitzer with Decker: calling reservists in each crisis "an unacceptable burden."'
    n: '[[w.poole-joint-chiefs-of-staff]], 67. Names: McNamara, Decker, Shoup, Anderson, LeMay, Lemnitzer.'
