    c: 'Diaoyutai, Building 12, evening. Mao hears the conference''s groups.{1} "The empire settled by unity" (Mencius): China settles its own part only; to every country open, no subversion, whatever its government; the Soviets'' seven or eight ways (tapping, rumor, bribes, interference, subversion, the experts withdrawn, relations cut), none of them China''s. Khrushchev "bullies the weak, fears the strong." China will not split with the Soviets: "you withdraw an ambassador, I do not."{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 26, 1961. [[w.yang-shangkun-riji]], II, 103 (Dec. 26, 1961; at Mao''s at Diaoyutai, 9 to 10:30 p.m., the groups reporting; Yang present). Made public: 2013. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 103) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Names: Mao Zedong, Khrushchev, Chen Boda.'
