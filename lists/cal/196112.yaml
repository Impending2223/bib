    n: '[[w.navasky-kennedy-justice]], 366–67, 370 (the indictment, Dec. 7; trial in May 1962; Keogh two years, eighteen months served); [[w.guthman-we-band-of-brothers]], 151 (the defendants; the trial from May 14, 1962). See [[cal.1961-10-09.crime-and-hijacking]]. Check: the court''s record; Robert Erdman named a co-defendant, tried apart (366).'
