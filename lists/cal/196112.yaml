    c: McComb. Riders from New Orleans at the Greyhound station, forty FBI agents and the police present; three minutes in the waiting room. A white mob of some five hundred beats the reporters. The *New York Times*, Dec. 7, in an editorial, outraged.
    n: '[[w.branch-parting-the-waters]], 559. To check: Time, Dec. 8, 1961, 25; Newsweek, Dec. 11, 1961, 30-31 (cited by [[w.branch-parting-the-waters]], 559 n.6); New York Times, Dec. 7, 1961, 42 (editorial) (cited by [[w.branch-parting-the-waters]], 559 n.7). See [[cal.1961-10-04.mississippi]].'
