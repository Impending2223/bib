    n: 'FRUS 1961–63, XVII, docs. [154](https://history.state.gov/historicaldocuments/frus1961-63v17/d154), [155](https://history.state.gov/historicaldocuments/frus1961-63v17/d155), [156](https://history.state.gov/historicaldocuments/frus1961-63v17/d156) (Dec. 29). Made public: FRUS 1961–63, XVII (1994). See [[cal.1961-06-25.middle-east]]. Names: Jernegan, Nasser.'
