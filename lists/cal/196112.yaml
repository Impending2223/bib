  - id: cal.1961-12-05.africa
    when: Dec. 5
    date: '1961-12-05'
    place: washington
    thread: africa
    c: 'The NSC on the Volta dam.{1} Rusk: the United States committed by the letter of June 29.{2} Kennedy: no support to be had in Congress; decide, then explain; how to justify help to Nkrumah, given his course at home and abroad?{3} Dillon would withhold approval, Nkrumah looking more a Castro than a Nasser; McNamara is for going ahead, the commitment made. Robert Kennedy, who had not spoken, argues that Houphouet-Boigny and other moderate leaders would rather the United States not go ahead, that the money be spread among Africa''s needy countries, and that if it goes ahead it get something in return. Chayes puts the liability at about $25 million until 1965.{5} The decision deferred for a legal report.{4} Robert Kennedy sits along the wall with the staff.{6} Kennedy: Dillon and the Attorney General seem opposed; the Attorney General has not spoken, but he can feel the hot breath of his opinion.{7} Rusk would enlist Macmillan in turning Nkrumah to a reasonable course. McCone reads the intelligence estimates as showing that Nkrumah still means to keep his independence from Soviet domination, and finds business opinion on the project not unfavorable. Kennedy reads out the letter of June 29; Ball reminds him it was made warmer at his own direction.{8}'
    n: 'FRUS 1961–63, XXI, docs. [239](https://history.state.gov/historicaldocuments/frus1961-63v21/d239) (Bundy, Dec. 1), [240](https://history.state.gov/historicaldocuments/frus1961-63v21/d240), [241](https://history.state.gov/historicaldocuments/frus1961-63v21/d241). [[w.ball-past-has-another-pattern]], 186 (Randall''s report; the NSC); [[w.rusk-as-i-saw-it-1990]], 275 (Rusk for keeping the pledge); [[w.schlesinger-robert-kennedy-and-his]], 560 (the NSC faced the Volta decision on Dec. 5, 1961; Robert Kennedy, an NSC regular since the Bay of Pigs, sat along the wall; the President: "The Attorney General has not yet spoken but I can feel the cold wind of his disapproval on the back of my neck"; the President "resolved to go ahead," against the unit''s deferral; not Rusk, Congress or the legal report); [[w.schlesinger-robert-kennedy-and-his]], 560. Made public: FRUS 1961–63, XXI (1995). [[w.schlesinger-thousand-days-1965]], 572–73. Schlesinger, 573, has the decision to go ahead made in November and the NSC told of it; the record of action, the decision deferred (doc. 241). See [[cal.1961-06-29.africa]]. Names: Rusk, Kennedy, Nkrumah, Dillon, McNamara, Robert Kennedy, Houphouet-Boigny, Chayes, McCone, Macmillan, Ball. Check: Ball (186) has the NSC of Nov. 28; FRUS''s record of action is of Dec. 5. Check: Rusk has Robert Kennedy against the dam at the meeting (275); his memorandum: [[cal.1961-12-07.africa]].'
    src:
      c: 20ecc7d6
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v21/d239: 1, 2, 3, 4'
        - 'w.schlesinger-thousand-days-1965 573: 1'
        - 'w.ball-past-has-another-pattern 186: 1'
        - 'w.rusk-as-i-saw-it-1990 275: 1, 2'
        - 'via x.1984.rusk-interviews-with-richard-rusk: 1, 2'
        - 'w.schlesinger-robert-kennedy-and-his 560: 1, 6'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v21/d240: 5, 7, 8'
    tags: [name:kennedy-john-f, name:rusk-dean, name:nkrumah-kwame, name:dillon-c-douglas, name:mcnamara-robert-s, name:kennedy-robert-f, name:houphouet-boigny-felix, name:chayes-abram, name:mccone-john-a, name:macmillan-harold, name:ball-george-w, ok:note-substance]
