  - id: cal.1961-12-16.vietnam
    when: Dec. 16
    date: '1961-12-16'
    thread: vietnam
    c: 'Honolulu. McNamara''s first conference on Vietnam, nine hours, with Lemnitzer, Felt and men from Washington and Saigon; one a month to follow. "Money is no object"; the one restriction "that combat troops will not be introduced." Results to show in thirty days. On Diệm: "we are stuck with him and must make the best of it."'
    n: '[FRUS 1961–63, I, doc. 325](https://history.state.gov/historicaldocuments/frus1961-63v01/d325) (Parker to Lemnitzer, Dec. 18); [doc. 326](https://history.state.gov/historicaldocuments/frus1961-63v01/d326) (Martin to Cottrell, Dec. 18: "last Saturday," nine hours). [[w.selverstone-kennedy-withdrawal]], 48–49 (the conference, monthly; the restriction; thirty days). Made public: FRUS 1961–63, I (1988). See [[cal.1961-11-22.vietnam]]. Names: McNamara, Lemnitzer, Felt, Ngô Đình Diệm.'
    src:
      c: 3bb78fe6
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d325: A, C-E, G'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d326: A-B, F'
