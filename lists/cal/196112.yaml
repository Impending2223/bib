  - id: cal.1961-12-05.alabama-al
    when: Dec. 5
    date: '1961-12-05'
    thread: alabama
    also: [state-constitutions, state-and-city-finance]
    c: 'Constitutional amendment election, forty-five amendments, most of them county taxes and powers to court industry. State bonds: $10,000,000 for prisons refused, 74,718 to 86,687, 46.3 percent; $3,000,000 for the University of Alabama Research Institute at Huntsville adopted, 115,280 to 37,418, 75.5 percent; $2,000,000 for hospitals and health centers adopted, 97,200 to 41,961, 69.8 percent. Emergency interim legislators in case of enemy attack, adopted, 94,887 to 40,101, 70.3 percent. Eminent domain, refused, 68,842 to 69,336, 49.8 percent.'
    n: '[*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), 672–674](https://archive.org/details/alabama-official-statistical-register-1963/page/n671).'
    tags: [state:al, city:huntsville]
  - id: cal.1961-12-05.africa
    when: Dec. 5
    date: '1961-12-05'
    thread: africa
    c: 'The NSC on the Volta dam. Rusk: the United States committed by the letter of June 29. Kennedy: no support to be had in Congress; decide, then explain; how to justify help to Nkrumah, given his course at home and abroad? The decision deferred for a legal report.'
    n: 'FRUS 1961–63, XXI, docs. [239](https://history.state.gov/historicaldocuments/frus1961-63v21/d239) (Bundy, Dec. 1), [240](https://history.state.gov/historicaldocuments/frus1961-63v21/d240), [241](https://history.state.gov/historicaldocuments/frus1961-63v21/d241). [[w.ball-past-has-another-pattern]], 186 (Randall''s report; the NSC); [[w.rusk-as-i-saw-it-1990]], 275 (Rusk for keeping the pledge); [[w.schlesinger-robert-kennedy-and-his]], 560 (the NSC faced the Volta decision on Dec. 5, 1961; Robert Kennedy, an NSC regular since the Bay of Pigs, sat along the wall; the President: "The Attorney General has not yet spoken but I can feel the cold wind of his disapproval on the back of my neck"; the President "resolved to go ahead," against the unit''s deferral; not Rusk, Congress or the legal report). Made public: FRUS 1961–63, XXI (1995). [[w.schlesinger-thousand-days-1965]], 572–73. Schlesinger, 573, has the decision to go ahead made in November and the NSC told of it; the record of action, the decision deferred (doc. 241). See [[cal.1961-06-29.africa]]. Names: Rusk, Kennedy, Nkrumah. Check: Ball (186) has the NSC of Nov. 28; FRUS''s record of action is of Dec. 5. Check: Rusk has Robert Kennedy against the dam at the meeting (275); his memorandum: [[cal.1961-12-07.africa]].'
    src:
      c: 32672fce
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v21/d239: all'
        - 'w.schlesinger-thousand-days-1965 573: A'
        - 'w.ball-past-has-another-pattern 186: A'
        - 'w.rusk-as-i-saw-it-1990 275: A-B'
        - 'via x.1984.rusk-interviews-with-richard-rusk: A-B'
        - 'w.schlesinger-robert-kennedy-and-his 560: A'
    tags: [name:kennedy-john-f, name:rusk-dean, name:nkrumah-kwame]
