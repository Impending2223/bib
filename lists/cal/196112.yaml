  - id: cal.1961-12-06.china-leadership-2
    when: Dec. 6–8
    date: '1961-12-06'
    thread: china-zhou
    also: [economy, china-economy]
    c: 'Zhou Enlai, Dec. 6–8, with the vice-premiers on the 1962 plan and hearing the Planning Commission Party group on its arrangement. Domestic situation good, results great, the adjustment urgent and the difficulties many, so next year it must be done well, with no relaxing; adjust all unbalanced relations, integrated balance; main tasks of next year''s adjustment named.{1} The Planning Commission''s briefing for Zhou, Chen Yun, Deng and Li Fuchun: the economy in a deep depression; food the main problem. Grain in 1961, 147.5 million tons, 2.8 per cent above 1960''s low.{2} Chen Yun: a target of 8 million fewer townspeople; for the 60 million of the big and middle cities, beans, 3 jin a month each for eight months.{3}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 443 (Dec. 6, 1961); [[w.chen-yun-nianpu-xiuding]], III, 116–117 (Dec. 6–11: Chen Yun with Zhou, Deng Xiaoping, Li Fuchun and others hears the Planning Commission on the 1962 plan, and speaks: next year the peasants better off, the towns worse, the state''s goods tighter; the real adjustment next year; 8 million fewer townspeople, a hard task; no raises but for apprentices and graduates; three years of poor nourishment for the 60 million of the big and middle cities: beans the answer, 3 jin a month each for eight months, 1.2 billion jin, half a jin of bean curd a day, to persons, not units; the plan''s stress adjustment, not the Seven-Year Plan (1963–69); steel, timber and coal targets held; 50,000 tons more synthetic ammonia, 200,000 tons more fertilizer, 4 million dan more cotton); [[w.macfarquhar-origins-of-the-cultural]], III, 138; [[w.chen-yun-nianpu-xiuding]], III, 116–117. [[w.macfarquhar-origins-of-the-cultural]], III, 138–140 (the Planning Commission''s briefing of Zhou, Chen Yun, Deng Xiaoping and Li Fuchun: the economy in a deep depression; food the main problem; industrial adjustment put off to the next year; 1961 grain output of 147.5 million tons, only 2.8 per cent above 1960''s low; soybeans, 3 jin a month for eight months). Made public: 1997. To check: [[w.chen-yun-wenji]], III, where the Chen Yun nianpu says Chen Yun''s speech is printed, as 《对一九六二年国民经济计划安排的意见》 ([[w.chen-yun-nianpu-xiuding]], III, 117); [[w.daoxia-zhonghua-renmin-gongheguo-40]], 166 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 138 n.6); [[w.al-zhongguo-gongchan-dang-zhizheng]], 211 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 140 n.9a); [[w.weiyuanhui-mao-zedong-zai-jiangsu]], 80–81 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 140 n.9b). Names: Zhou Enlai, Chen Yun, Deng Xiaoping, Li Fuchun.'
