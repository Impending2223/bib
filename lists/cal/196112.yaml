  - id: cal.1961-12-25.china-leadership-8
    when: Dec. 25
    date: '1961-12-25'
    thread: china-famine
    c: 'The Jilin 吉林 provincial committee forwards the report of the work group of the public security department on lawbreaking at the Siping 四平 reception-and-sending station 《省委批轉公安廳工作組關於四平收容遣送站違法亂紀情況的報告》 (document Jifa [62] no. 3). Of the station''s 31 cadres 19 have beaten or punished the detained, with a dozen and more punishments: fists, kicks, ear-twisting, bamboo and clubs, stripping and pushing outdoors to freeze. Detainees must sit facing in a row and not move; the secretary, the head and the staff beat whom they dislike. 72 people are in a room of 6.6 square meters, men, women, old and young, and may not go out or sun themselves; they relieve themselves in the room, and lice are everywhere. In November 5 died in three days.'
    n: '[[w.yang-jisheng-mubei]], I, 358. Made public: 2008. To check: Jilin Provincial Party Committee, document Jifa [62] no. 3, Dec. 25, 1961, forwarding the Public Security Department work group''s report on illegal conduct at the Siping reception and sending station (cited by [[w.yang-jisheng-mubei]], I, 358 n.46). Check: the date, against the number Jifa [62] no. 3.'
    src:
      c: 0aefeeb6
      rows:
        - 'w.yang-jisheng-mubei I, 358: all'
        - 'via w.yang-jisheng-mubei I, 358 n.46: all'
    tags: [polity:prc, vis:only:prc]
