  - id: cal.1961-12-01.china
    when: Dec. 1
    date: '1961-12-01'
    thread: china
    also: [berlin-and-vienna]
    c: 'Peking. The East German ambassador, Hegen, to the Polish minister counselor: the Chinese wonder why Khrushchev has not shown the courage of 1956. At Suez "the Soviet ultimatum, which was taken seriously, scared the imperialists"; his retreat now will "only induce the adversary to even firmer policies, to greater demands, and to stronger provocations."'
    n: '[[w.fursenko-khrushchevs-cold-war]], 411 ("at the end of 1961"). To check: memorandum of conversation, Hegen with the Polish minister counselor, Dec. 1, 1961, cited in [[w.harrison-driving-the-soviets-up]], 240 (cited by [[w.fursenko-khrushchevs-cold-war]], 411 n.7). Names: Khrushchev.'
    src:
      c: f6de3c07
      rows:
        - 'w.fursenko-khrushchevs-cold-war 411: all'
        - 'via w.fursenko-khrushchevs-cold-war 411 n.7: all'
    tags: [name:khrushchev-nikita-s]
