  - id: cal.1961-12-06.china
    when: Dec. 6
    date: '1961-12-06'
    thread: china
    also: [south-asia]
    c: The Foreign Ministry issues a statement on the Sino-Indian boundary question. It rejects India's charges of Chinese intrusions into Indian territory and of Chinese troops crossing the line to set up "new posts"; it exposes Indian intrusions into Chinese territory and India's stepped-up military deployments on the border, and its turn from refusing negotiations to seeking its claims on China by force. China hopes India will rein in, and with China place friendship, Asian–African unity and world peace first, and settle the boundary. It publishes the eight notes the two governments have exchanged on the boundary since Aug. 1961.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 210 (Dec. 6, 1961).'
