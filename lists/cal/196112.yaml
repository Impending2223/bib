    thread: china-center
    c: At the Changguanlou, a building near the Peking Zoo, the Peking Party committee's task force under Deng Tuo reviews central documents under nine heads; by a Cultural Revolution account it produces a 20,000-word "Extracts from central documents," prefaced by a note dating the directives that caused problems to the two upsurges of the Leap.
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 182–83; [[w.macfarquhar-origins-of-the-cultural]], III, 257 (Deng Tuo''s leading part in compiling the Peking Party''s dossiers on the Leap at the Changguanlou); [[w.yang-jisheng-tiandi-fanfu]], I, 59 (by the Red Guard exposé, Jan. 1961: Peng Zhen has Xiang Ziming 項子明, secretary-general of the Peking committee, organize and Deng Tuo guide some ten men, ten days and more, in going through the Center''s documents since 1958; nearly 20,000 characters, "Extracts from central documents," sent to Peng as top secret; the note: December 1961, not January, at the Secretariat''s behest, for the Seven Thousand Cadres Conference); [[w.dikotter-cultural-revolution]], 11 n.10 (as rumoured: a couple of months before the conference Peng Zhen has Deng Tuo compile a dossier of documents critical of the famine and of Mao''s part in it, with Liu Shaoqi''s and Deng Xiaoping''s knowledge; meetings away from view in a palace in the Peking Zoo). Made public: 1997. Check: the analysis the book cites (III, 257) places the Changguanlou compilation in November. To check: [[w.jingxin-dongpode-gongting-zhenbian]], 1–13 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 183 n.5a); [[w.dangdai-zhongguode-beijing-contemporary]], 1, 155–57 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 183 n.5b); [[w.wang-beijing-shi-wenhua-da]], 215–33, 220 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 183 n.7a); [[w.peng-zei-huairou-diaocha]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 183 n.7b); Survey of China Mainland Press, Supplement 187 (translation of a Red Guard newspaper article), 23–36 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 183 n.7c); Survey of China Mainland Press, No. 4014 (translation of a Red Guard newspaper article), 1–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 183 n.7d); Joint Publications Research Service, No. 42,966, 92–101 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 183 n.7e); [[w.center-for-chinese-research]], IV, 1760–74 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 183 n.7f); 〈大野心家、大陰謀家彭真罪惡史〉, comp. by the Red Flag Corps of the Peking committee''s organs (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 59 n.38a); Liu Zheng 劉政 and Zhang Chunsheng 張春生, 〈從歷史的幾個重大關節看彭真和毛澤東的關係〉, *Lingdaozhe* 《領導者》, 2013, no. 4, 149 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 59 n.38c); Pitman B. Potter, *From Leninist Discipline to Socialist Legalism: Peng Zhen on Law and Political Authority in the PRC* (2003), 18, 85–86 (cited by [[w.dikotter-cultural-revolution]], 11 n.10). Check: the days; they are those of a hostile Cultural Revolution account. Names: Deng Tuo.'
