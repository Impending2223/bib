  - id: cal.1961-12-20.china-leadership
    when: Dec. 20
    date: '1961-12-20'
    place: peking
    thread: china-seven-thousand
    also: [china-economy]
    c: 'Peking.{1} The Central Work Conference of the regional, provincial and central leaders opens (to Jan. 10, 1962), on the situation at home and abroad, the 1962 and long-term plans, commerce, the basic accounting unit and the Party, to prepare the enlarged work conference;{2} Mao: seven fronts for 1962, industry, farming, commerce, schools, army, government, Party.{3} That evening, the Yinian Tang, his meeting of the Standing Committee and the regional first secretaries: first for local power, now for central unity;{4} the detours of these years the center''s first, then the provinces''; the four highs, the "big drives," the supply system, the mess halls the center''s, "wrong," and a precious asset.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 20, 1961 (the entries for Dec. 20, 1961–Jan. 10, 1962 and Dec. 20). [[w.zhou-enlai-nianpu-1949]], II, 446, Dec. 20, 1961 (Zhou and Deng report the conference''s arrangement at the evening meeting). [[w.zhou-enlai-nianpu-1949]], II, 446–47, Dec. 20, 1961–Jan. 10, 1962 (Zhou at the conference). [[w.macfarquhar-origins-of-the-cultural]], III, 137, 144 (the opening; the decision of Dec. 21 for the larger meeting); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543–544 (Dec. 20, 1961–Jan. 10, 1962; Liu attends the Central Work Conference on the international and domestic situation, the 1962 national economic plan and the long-term plan, and the Party''s work, to prepare the enlarged Central Work Conference; late in the meeting Liu chiefly directs the drafting of the report the Central Committee is to give to the enlarged conference); [[w.yang-shangkun-riji]], II, 101 (Dec. 20, 1961; the meeting at Mao''s, 7 to 9 p.m., the Standing Committee and the regional bureaus'' secretaries, on how to run the work conference: the situation first, half-day sessions, work and rest balanced); [[w.deng-xiaoping-nianpu-1904]], III, 1678 (Dec. 20, 1961–Jan. 10, 1962; Deng attends; it prepared the Seven Thousand Cadres conference. Dec. 20, evening, at Mao''s meeting of the Standing Committee and the bureaus'' first secretaries, Deng and Zhou report the agenda and the method); [[w.mao-zedong-zhuan]], V, ch. 69 n.7 (Dec. 20, evening, at the Yinian Tang: the first night of the conference, Mao with the Standing Committee and the first secretaries of the bureaus; Deng Xiaoping and Zhou Enlai on the agenda; Mao: the detours of the past years to be laid first to the Center, then the provinces; the four highs, the great drives, the supply system and the mess halls are the Center''s; he talks of the *Dream of the Red Chamber* with Liu Shaoqi). [[w.peng-zhen-nianpu-1902]], IV, 164 (Dec. 20, 1961–Jan. 10, 1962; Peng Zhen attends; the world, the home situation, the 1962 and long-term plans, commerce, the basic accounting unit, Party work; to prepare the enlarged work conference); [[w.zhu-de-nianpu-xinbian]], III, 1821 (Dec. 20, 1961–Jan. 10, 1962; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 on the situation at home and abroad, the 1962 plan and the long-term plans and Party work, preparing the enlarged work conference); [[w.chen-yun-nianpu-xiuding]], III, 117–118 (Chen Yun attends the work conference, Dec. 20–Jan. 10, on the world and home situation, the plan, commerce and Party building, preparing the enlarged work conference; at its opening Deng Xiaoping relays Mao''s view: the situation on the whole good, the good done in the Great Leap''s three years basic, the faults there, the blame first the Center''s, then the provinces''; at its end the groups discuss the first draft of Liu Shaoqi''s written report). Made public: 1996. Check: MacFarquhar has a brief central work conference on Dec. 21, which decides on the larger meeting. To check: [[w.jin-1949-1989-niande-zhongguo]], 400 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 137 n.4); [[w.tianrong-guanyu-yijiuliuer-nian-qiqian]], 6–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-a); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-c); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-d); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1017, 1019–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-e); Mao Zedong 毛泽东, speech to the Politburo Standing Committee and the regional first secretaries 中共中央政治局常委和中央局第一书记会议, Dec. 20, 1961 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.7). Names: Mao Zedong, Deng Xiaoping, Zhou Enlai.'
