rger meeting. To check: [[w.jin-1949-1989-niande-zhongguo]], 400 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 137 n.4); [[w.tianrong-guanyu-yijiuliuer-nian-qiqian]], 6–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-a); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-c); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-d); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1017, 1019–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-e); Mao Zedong 毛泽东, speech to the Politburo Standing Committee and the regional first secretaries 中共中央政治局常委和中央局第一书记会议, Dec. 20, 1961 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.7). Names: Mao Zedong, Deng Xiaoping, Zhou Enlai.'
