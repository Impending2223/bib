# Cal. LXVI November 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXVI
entries:
  - id: cal.1965-11-02.states-and-cities
    when: Nov. 2
    date: '1965-11-02'
    thread: states-and-cities
    c: 'New York City. Lindsay, Republican and Liberal, elected mayor: 1,149,106 votes; Beame, Democrat, 1,046,699; Buckley, Conservative, 341,226. The first Republican elected mayor since 1941.'
    n: 'Figures: Wikipedia; check against the Board of Elections'' canvass. Cannato, *The Ungovernable City* (Opp. II.C). Buckley, *The Unmaking of a Mayor* (Opp. II.E). See [[cal.1965-06-10.states-and-cities]]. Names: Lindsay (Opp. III.D); Beame (K–J Cong. III.K); Buckley (Opp. III.F).'
    tags: [name:lindsay-john-v, name:beame-abraham-d, name:buckley-william-f-jr]
  - id: cal.1965-11-02.states-and-cities-2
    when: Nov. 2
    date: '1965-11-02'
    thread: states-and-cities
    c: 'Governors. Virginia: Godwin (D), the lieutenant governor, 269,526; Holton (R), 212,207; Story, of a new Conservative party, 75,307. New Jersey: Hughes (D) re-elected over Dumont (R), 1,279,568 to 915,996.'
    n: 'New Jersey: [*Results of the General Election Held November 2, 1965*](https://nj.gov/state/elections/assets/pdf/election-results/1920-1970//1965-general-election.pdf) (Secretary of State). Virginia: Wikipedia, from Hunter''s thesis (1972); Godwin printed there as 296,526, the total requiring 269,526; check against the State Board''s *Statement of the Vote*. Bass & De Vries, *The Transformation of Southern Politics* (K–J Cong. II.H). Kabaservice, *Rule and Ruin* (Opp. II.A). See [[cal.1964-11-03.elections-1964-2]]. Names: Godwin, Dumont (K–J Cong. III.K); Holton (Cong. III.H); Hughes (K–J Cong. III.F).'
    tags: [name:godwin-mills-e-jr, name:holton-linwood, name:hughes-richard-j, name:dumont-wayne-jr]
  - id: cal.1965-11-02.specials
    when: Nov. 2
    date: '1965-11-02'
    thread: specials
    c: Ohio 7th, special. Clarence J. Brown Jr. (R) holds his father's seat, 59.6 to 40.4 over Berry (D); the elder Brown died Aug. 23. Swing 2.8 to R. Sworn Jan. 10, 1966.
    n: 'Votes: CQ Guide 6th (2010) 1276. Check: *Ohio Election Statistics*, 1965–70. [112 Cong. Rec., House, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf) (Brown sworn). See [[cal.1961-04-04.states-and-cities]]. Names: Berry (K–J Cong. III.K).'
    tags: [special:1965-11-02-h-OH-7, name:brown-clarence-j-jr, name:brown-clarence-j, name:berry-james-a]
  - id: cal.1965-11-02.students
    when: Nov. 2
    date: '1965-11-02'
    thread: students
    also: [vietnam]
    c: 'Norman Morrison, a Quaker, 31, burns himself to death at the Pentagon, below McNamara''s office, his year-old daughter with him. Nov. 6, Union Square: five men burn their draft cards. Nov. 9, Roger LaPorte, 22, of the Catholic Worker, sets himself afire before the United Nations; dead the next day.'
    n: 'Wells, *The War Within* (K–J Cong. II.F). DeBenedetti, *An American Ordeal*; Zaroulis & Sullivan, *Who Spoke Up?* (Viet. II.G.1). McNamara, *In Retrospect* (K–J Adm. II.G.4). See [[cal.1965-03-24.students]]; [[cal.1965-08-30.students]]. Names: Morrison, LaPorte (K–J Cong. III.K); McNamara (Viet. III.A).'
    tags: [name:morrison-norman-r, name:laporte-roger-allen, name:mcnamara-robert-s]
  - id: cal.1965-11-03.transition-and-staff
    when: Nov. 3
    date: '1965-11-03'
    thread: transition-and-staff
    c: 'At the post office in Hye, Texas, near the Ranch: O''Brien, the President''s legislative liaison, sworn as Postmaster General; Gronouski, his predecessor, as Ambassador to Poland.'
    n: '[Remarks at the Post Office, Hye, Texas, at the Swearing In of Lawrence F. O''Brien as Postmaster General](https://www.presidency.ucsb.edu/documents/remarks-the-post-office-hye-texas-the-swearing-lawrence-f-obrien-postmaster-general); [Remarks at the LBJ Ranch at the Swearing In of John A. Gronouski as Ambassador to Poland](https://www.presidency.ucsb.edu/documents/remarks-the-lbj-ranch-the-swearing-john-gronouski-ambassador-poland) (Nov. 3, 1965). O''Brien, *No Final Victories* (K–J Adm. II.G.2). See [[cal.1965-08-29.transition-and-staff]]. Names: O''Brien (K–J Adm. III.B); Gronouski (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:obrien-lawrence-f, name:gronouski-john-a]
  - id: cal.1965-11-03.farm
    when: Nov. 3
    date: '1965-11-03'
    thread: farm
    c: 'Food and Agriculture Act signed at the Ranch, [79 Stat. 1187](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1187.pdf): programs for the 1966–69 crops of wheat, feed grains, and cotton, supports with payments to farmers who divert acreage, cotton''s loan near the world price; dairy; a Cropland Adjustment Program. The House passed it Aug. 19, [221–172](https://voteview.com/rollcall/RH0890122); the Senate Sept. 14, [72–22](https://voteview.com/rollcall/RS0890225); the House the conference report Oct. 8, [219–150](https://voteview.com/rollcall/RH0890190). Nov. 4, a National Advisory Commission on Food and Fiber, Executive Order 11256.'
    n: '[Statement by the President Upon Signing the Food and Agriculture Act of 1965](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-food-and-agriculture-act-1965) (Nov. 4, 1965); [Executive Order 11256](https://www.presidency.ucsb.edu/documents/executive-order-11256-establishing-the-presidents-committee-food-and-fiber-and-the-national) (Nov. 4, 1965). See [[cal.1965-02-04.farm]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-11-06.cuba
    when: Nov. 6
    date: '1965-11-06'
    thread: cuba
    also: [immigration]
    c: 'Cuban refugees. Notes exchanged through the Swiss Embassy in Havana set procedures for Cubans to come to the United States. Johnson: "those who seek refuge here will find it." The airlift from Varadero to Miami begins Dec. 1 (Check). Nov. 18, a task force on the program''s burden on Miami.'
    n: '[Statement by the President on the Agreement Covering Movement of Cuban Refugees to the United States](https://www.presidency.ucsb.edu/documents/statement-the-president-the-agreement-covering-movement-cuban-refugees-the-united-states) (Nov. 6, 1965); [Letter Establishing a Task Force on the Impact of the Cuban Refugee Program](https://www.presidency.ucsb.edu/documents/letter-establishing-task-force-the-impact-the-cuban-refugee-program) (Nov. 18, 1965). See [[cal.1965-10-03.immigration]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-11-06.economy
    when: Nov. 6–19
    date: '1965-11-06'
    thread: economy
    c: 'Aluminum and copper. Ellington, Nov. 6, to Alcoa: papers drawn to release 300,000 tons of stockpile aluminum, 100,000 at once. Nov. 10, Alcoa and the others rescind their price rise. Copper up 2 cents, to 38: Johnson, Nov. 18, releases 200,000 tons from the stockpile "for purposes of the common defense"; Nov. 19, Anaconda and the others back to 36 cents.'
    n: '[Memorandum Approving the Release of Copper From the National Stockpile](https://www.presidency.ucsb.edu/documents/memorandum-approving-the-release-copper-from-the-national-stockpile) (Nov. 18, 1965). FRUS 1964–68, IX, docs. [292](https://history.state.gov/historicaldocuments/frus1964-68v09/d292), [296](https://history.state.gov/historicaldocuments/frus1964-68v09/d296), [297](https://history.state.gov/historicaldocuments/frus1964-68v09/d297), [300](https://history.state.gov/historicaldocuments/frus1964-68v09/d300). See [[cal.1965-08-30.steel]]. Names: McNamara (K–J Adm. III.F); Ackley (K–J Adm. III.H).'
    tags: [name:johnson-lyndon-b, name:ellington-buford, name:mcnamara-robert-s, name:ackley-gardner]
  - id: cal.1965-11-08.school-aid
    when: Nov. 8
    date: '1965-11-08'
    thread: school-aid
    c: 'Higher Education Act signed at Southwest Texas State College, San Marcos, his own, [79 Stat. 1219](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1219.pdf): Educational Opportunity Grants to needy undergraduates, up to $1,000 a year; insured student loans; work-study; aid to libraries, community service, and developing colleges; a National Teacher Corps. The Senate passed it Sept. 2, [79–3](https://voteview.com/rollcall/RS0890215); the House kept the Teacher Corps, [152–226](https://voteview.com/rollcall/RH0890196) against recommittal, and adopted the conference report Oct. 20, [313–63](https://voteview.com/rollcall/RH0890197).'
    n: Statute (K–J Cong. II.J.2). [Remarks at Southwest Texas State College Upon Signing the Higher Education Act of 1965](https://www.presidency.ucsb.edu/documents/remarks-southwest-texas-state-college-upon-signing-the-higher-education-act-1965) (Nov. 8, 1965). See [[cal.1965-08-26.school-aid]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-11-09.states-and-cities
    when: Nov. 9
    date: '1965-11-09'
    thread: states-and-cities
    c: 'The Northeast blackout. 5:16 p.m.: a relay on a line from the Sir Adam Beck station, Queenston, Ontario, trips; in minutes the interconnected systems of Ontario, New York, and New England fail. Some 30 million people without power, New York City into the next morning. Johnson orders the Federal Power Commission (Swidler) to investigate. Its report, Dec. 6.'
    n: '[Memorandum Concerning the Power Failure in the Northeastern United States](https://www.presidency.ucsb.edu/documents/memorandum-concerning-the-power-failure-the-northeastern-united-states) (Nov. 9, 1965); [Statement by the President in Response to Federal Power Commission Report on the Northeastern Electric Power Blackout](https://www.presidency.ucsb.edu/documents/statement-the-president-response-federal-power-commission-report-the-northeastern-electric) (Dec. 6, 1965). Federal Power Commission, *Northeast Power Failure, November 9 and 10, 1965: A Report to the President* (1965). Thread: none nearer.'
    tags: [name:johnson-lyndon-b, name:swidler-joseph-c]
  - id: cal.1965-11-10.congress
    when: Nov. 10
    date: '1965-11-10'
    thread: congress
    also: [states-and-cities]
    c: Harry Byrd resigns from the Senate, after nearly 33 years, citing arthritis. Nov. 12, Governor Harrison appoints his son, Harry F. Byrd Jr., a State senator, to the seat. Sworn Jan. 10, 1966.
    n: '[112 Cong. Rec., Senate, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-1.pdf) (the letter of resignation, Nov. 10; the certificate, Nov. 12; the oath). Heinemann, *Harry Byrd of Virginia* (K–J Cong. II.I.1). Names: Byrd (K–J Cong. III.B).'
    tags: [name:byrd-harry-f, name:byrd-harry-f-jr]
  - id: cal.1965-11-11.europe-and-the-alliance
    when: Nov. 11
    date: '1965-11-11'
    thread: europe-and-the-alliance
    c: 'Rhodesia. Smith proclaims independence from Britain. Rusk, after meeting Johnson at the Ranch: no recognition; the consul general recalled. The Security Council, Nov. 12, condemns the declaration, 10–0, France abstaining; Nov. 20, calls for an embargo on oil and arms. Dec. 16–17, Wilson in Washington; Britain embargoes oil, and the United States helps airlift oil to Zambia.'
    n: 'FRUS 1964–68, XXIV, docs. [491](https://history.state.gov/historicaldocuments/frus1964-68v24/d491), [492](https://history.state.gov/historicaldocuments/frus1964-68v24/d492), [506](https://history.state.gov/historicaldocuments/frus1964-68v24/d506), [512](https://history.state.gov/historicaldocuments/frus1964-68v24/d512), [519](https://history.state.gov/historicaldocuments/frus1964-68v24/d519). [S.C. Res. 216](https://undocs.org/S/RES/216(1965)) (Nov. 12, 1965); [S.C. Res. 217](https://undocs.org/S/RES/217(1965)) (Nov. 20, 1965). Check the date of the British oil embargo. Gerald Horne, *From the Barrel of a Gun: The United States and the War against Zimbabwe, 1965–1980* (2001). Schwartz, *Lyndon Johnson and Europe* (K–J Adm. II.D). Wilson, *The Labour Government, 1964–1970* (K–J Adm. II.G.7). See [[cal.1964-12-07.europe-and-the-alliance]]. Names: Rusk (K–J Adm. III.E); Wilson (K–J Adm. III.J).'
    tags: [name:smith-ian-douglas, name:rusk-dean, name:johnson-lyndon-b, name:wilson-harold]
  - id: cal.1965-11-14.vietnam
    when: Nov. 14–18
    date: '1965-11-14'
    thread: vietnam
    c: Ia Drang. Moore's 1st Battalion, 7th Cavalry, of the 1st Cavalry Division (Airmobile), lands by helicopter at LZ X-Ray, under the Chu Pong massif, Nov. 14, and holds three days against North Vietnamese regulars, with B-52s striking the massif from Nov. 15; 79 Americans killed. Nov. 17, the 2d Battalion ambushed marching to LZ Albany; some 155 killed. The first battle between American and North Vietnamese regulars. Check the counts.
    n: 'FRUS 1964–68, III, doc. [212](https://history.state.gov/historicaldocuments/frus1964-68v03/d212). Cash, *Fight at Ia Drang*; Coleman, *Pleiku*; Moore & Galloway, *We Were Soldiers Once . . . and Young*; Pribbenow, *The Fog of War* (Viet. II.C.4). Westmoreland, *A Soldier Reports* (Viet. II.H.2). McNamara, *In Retrospect* (K–J Adm. II.G.4). See [[cal.1965-07-28.vietnam]]. Names: Moore (Viet. III.D).'
    tags: [name:moore-harold-g]
  - id: cal.1965-11-15.court
    when: Nov. 15
    date: '1965-11-15'
    thread: court
    c: '*Albertson v. Subversive Activities Control Board*, [382 U.S. 70](https://tile.loc.gov/storage-services/service/ll/usrep/usrep382/usrep382070/usrep382070.pdf): members of the Communist Party cannot be compelled to register under the Subversive Activities Control Act; registration would incriminate them. Brennan for the Court, 8–0; White not participating.'
    n: 'Opinion (K–J Cong. II.J.1). *Communist Party v. Subversive Activities Control Board* (K–J Cong. II.J.1). Names: Brennan, White (K–J Cong. III.G).'
    tags: [name:brennan-william-j-jr, name:white-byron-r]
  - id: cal.1965-11-16.civil-rights-the-executive
    when: Nov. 16–17
    date: '1965-11-16'
    thread: civil-rights-the-executive
    also: [desegregation-schools]
    c: 'Planning session for the White House Conference "To Fulfill These Rights," the conference itself put off to June 1–2, 1966. Randolph honorary chairman; Abram and Coleman chairmen. Johnson, in the East Room, Nov. 16: 200,000 Negroes newly registered under the Voting Rights Act. Nov. 17, he asks the Civil Rights Commission (Hannah) to study racial isolation in the schools, North and South.'
    n: '[Remarks at a Reception for Participants in a Planning Session for the White House Conference "To Fulfill These Rights"](https://www.presidency.ucsb.edu/documents/remarks-reception-for-participants-planning-session-for-the-white-house-conference-fulfill) (Nov. 16, 1965); [Letter Requesting a Study of Racial Isolation as a Barrier to Quality in Education](https://www.presidency.ucsb.edu/documents/letter-requesting-study-racial-isolation-barrier-quality-education) (Nov. 17, 1965). Graham, *The Civil Rights Era* (K–J Adm. II.C). See [[cal.1965-06-04.civil-rights-the-executive]]. Names: Randolph (K–J Cong. III.H).'
    tags: [name:johnson-lyndon-b, name:randolph-a-philip, name:abram-morris-b, name:coleman-william-t-jr, name:hannah-john-a]
  - id: cal.1965-11-19.opinion
    when: Nov. 19
    date: '1965-11-19'
    thread: opinion
    also: [students, vietnam]
    c: 'Gallup, Oct. 29–Nov. 2: Communists involved in the demonstrations over Vietnam: a lot 58 percent, some 20, minor 8, not at all 4. In the demonstrations over civil rights: a lot 48, some 27.'
    n: '*The Gallup Poll*, III, 1971 (K–J Cong. II.E).'
  - id: cal.1965-11-21.opinion
    when: Nov. 21
    date: '1965-11-21'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Oct. 29–Nov. 2: a candidate for Congress for sending many more men to Vietnam: more inclined 46 percent, less 31. For a compromise peace: more 66, less 20. Should have become involved, 64; not, 21. How the war will end: stalemate like Korea 30; American victory 29; long conflict 10; world war 4.'
    n: '*The Gallup Poll*, III, 1971–72 (K–J Cong. II.E).'
  - id: cal.1965-11-24.opinion
    when: Nov. 24
    date: '1965-11-24'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Oct. 29–Nov. 2: the 1968 convention''s choice between Romney and Nixon. Republicans: Nixon 55, Romney 38. Democrats: Romney 52, Nixon 35. Independents: Romney 43, Nixon 42.'
    n: '*The Gallup Poll*, III, 1972 (K–J Cong. II.E). Names: Nixon (Opp. III.E); Romney (Opp. III.H).'
    tags: [name:romney-george-w, name:nixon-richard-m]
  - id: cal.1965-11-25.congo
    when: Nov. 25
    date: '1965-11-25'
    thread: congo
    c: 'Leopoldville. The army, at 5 a.m., takes over the government: Mobutu President; Kasavubu deposed, and Kimba, his prime minister. The embassy and the CIA station in touch with Mobutu at once. Nov. 26, Washington authorizes informal dealings; formal recognition to wait on the Africans''.'
    n: 'FRUS 1964–68, XXIII, docs. [452](https://history.state.gov/historicaldocuments/frus1964-68v23/d452), [455](https://history.state.gov/historicaldocuments/frus1964-68v23/d455), [456](https://history.state.gov/historicaldocuments/frus1964-68v23/d456). Weissman, *American Foreign Policy in the Congo*; Namikas, *Battleground Africa* (K–J Adm. II.D). Larry Devlin, *Chief of Station, Congo: Fighting the Cold War in a Hot Zone* (2007). See [[cal.1964-11-24.congo]].'
    tags: [name:mobutu-joseph-d, name:kasavubu-joseph, name:godley-g-mcmurtrie-ii, name:devlin-lawrence-r]
  - id: cal.1965-11-27.students
    when: Nov. 27
    date: '1965-11-27'
    thread: students
    also: [vietnam]
    c: 'March on Washington for Peace in Vietnam, called by SANE: pickets around the White House, then a rally at the Washington Monument; some 25,000 or more. Spock and Coretta King among the speakers. Oglesby, president of SDS, "Let Us Shape the Future": the war the work of "corporate liberalism." Check the count and the speakers.'
    n: 'Wells, *The War Within* (K–J Cong. II.F). Sale, *SDS*; Miller, *"Democracy Is in the Streets"* (K–J Cong. II.F). DeBenedetti, *An American Ordeal*; Zaroulis & Sullivan, *Who Spoke Up?* (Viet. II.G.1). See [[cal.1965-11-02.students]]. Names: Spock (Viet. III.E); King, Oglesby (K–J Cong. III.K).'
    tags: [name:spock-benjamin, name:king-coretta-scott, name:oglesby-carl]
  - id: cal.1965-11-28.vietnam
    when: Nov. 28–Dec. 7
    date: '1965-11-28'
    thread: vietnam
    c: 'McNamara and Wheeler in Saigon, Nov. 28–29. McNamara to Johnson, Nov. 30: infiltration up, the enemy standing to fight, as at Ia Drang; US battalions from 34 to 74 by the end of 1966, some 400,000 men, perhaps 200,000 more in 1967; the bombing gradually widened; first a pause of three or four weeks. American dead may reach 1,000 a month; the odds even of a "no-decision" at a higher level in early 1967. Revised, Dec. 7.'
    n: 'FRUS 1964–68, III, docs. [189](https://history.state.gov/historicaldocuments/frus1964-68v03/d189), [198](https://history.state.gov/historicaldocuments/frus1964-68v03/d198), [212](https://history.state.gov/historicaldocuments/frus1964-68v03/d212), [222](https://history.state.gov/historicaldocuments/frus1964-68v03/d222). *The Pentagon Papers* (K–J Adm. II.H.3). McNamara, *In Retrospect* (K–J Adm. II.G.4). Berman, *Lyndon Johnson''s War*; Barrett, *Uncertain Warriors*; Herring, *LBJ and Vietnam* (Viet. II.C.1). See [[cal.1965-07-28.vietnam]]; [[cal.1965-11-14.vietnam]]. Names: McNamara, Wheeler (Viet. III.A); Lodge (Viet. III.C); Westmoreland, Sharp (Viet. III.D).'
    tags: [name:mcnamara-robert-s, name:wheeler-earle, name:lodge-henry-cabot, name:westmoreland-william, name:sharp-u-s-grant, name:johnson-lyndon-b]
  - id: cal.1965-11-28.opinion
    when: Nov. 28
    date: '1965-11-28'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Oct. 29–Nov. 2: Senator Robert Kennedy as capable as his brother was as a Senator: yes 38 percent, no 44. Wants to be President, 74. Will win the nomination: yes 55, no 33. Would like to see him President: yes 40, no 46; Democrats 56, independents 30, Republicans 20.'
    n: '*The Gallup Poll*, III, 1972–73 (K–J Cong. II.E). Names: Robert Kennedy (K–J Adm. III.A).'
    tags: [name:kennedy-robert-f]
