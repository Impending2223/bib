# Cal. LXXII November 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXII
entries:
  - id: cal.1965-11-02.states-and-cities
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965]
    c: 'New York City. Lindsay, Republican and Liberal, elected mayor: 1,149,106 votes; Beame, Democrat, 1,046,699; Buckley, Conservative, 341,226. The first Republican elected mayor since 1941.'
    n: 'Figures: Wikipedia; check against the Board of Elections'' canvass. [[w.cannato-ungovernable-city]]; [[w.buckley-unmaking-of-a-mayor]]. See [[cal.1965-06-10.states-and-cities]]. Names: Lindsay, Beame, Buckley.'
    tags: [name:lindsay-john-v, name:beame-abraham-d, name:buckley-william-f-jr, state:ny, city:nyc]
  - id: cal.1965-11-02.states-and-cities-2
    when: Nov. 2
    date: '1965-11-02'
    thread: elections-1965
    also: [governors]
    c: 'Governors. Virginia: Godwin (D), the lieutenant governor, 269,526; Holton (R), 212,207; Story, of a new Conservative party, 75,307. New Jersey: Hughes (D) re-elected over Dumont (R), 1,279,568 to 915,996.'
    n: 'New Jersey: [*Results of the General Election Held November 2, 1965*](https://nj.gov/state/elections/assets/pdf/election-results/1920-1970//1965-general-election.pdf) (Secretary of State). Virginia: Wikipedia, from Hunter''s thesis (1972); Godwin printed there as 296,526, the total requiring 269,526; check against the State Board''s *Statement of the Vote*. [[w.bass-transformation-of-southern-politics-1976]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-11-03.elections-1964-2]]. Names: Godwin, Story, Dumont, Holton, Hughes.'
    tags: [name:godwin-mills-e-jr, name:holton-linwood, name:hughes-richard-j, name:dumont-wayne-jr, state:va, state:nj, name:story-william-j-jr]
  - id: cal.1965-11-02.specials
    when: Nov. 2
    date: '1965-11-02'
    thread: specials
    c: Ohio 7th, special. Clarence J. Brown Jr. (R) holds his father's seat, 59.6 to 40.4 over Berry (D); the elder Brown died Aug. 23. Swing 2.8 to R. Sworn Jan. 10, 1966.
    n: 'Votes: CQ Guide 6th (2010) 1276. Check: *Ohio Election Statistics*, 1965–70. [112 Cong. Rec., House, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf) (Brown sworn). See [[cal.1961-04-04.states-and-cities]]. Names: Clarence J. Brown, Clarence J. Brown Jr., Berry.'
    tags: [special:1965-11-02-h-OH-7, name:brown-clarence-j-jr, name:brown-clarence-j, name:berry-james-a]
  - id: cal.1965-11-02.students
    when: Nov. 2
    date: '1965-11-02'
    thread: students
    also: [vietnam]
    c: 'Norman Morrison, a Quaker, 31, burns himself to death at the Pentagon, below McNamara''s office, his year-old daughter with him. Nov. 6, Union Square: five men burn their draft cards. Nov. 9, Roger LaPorte, 22, of the Catholic Worker, sets himself afire before the United Nations; dead the next day.'
    n: '[[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]; [[w.mcnamara-in-retrospect]]. See [[cal.1965-03-24.students]]; [[cal.1965-08-30.students]]. Names: Morrison, LaPorte, McNamara.'
    tags: [name:morrison-norman-r, name:laporte-roger-allen, name:mcnamara-robert-s]
  - id: cal.1965-11-02.legislatures-ny
    when: Nov. 2
    date: '1965-11-02'
    thread: legislatures
    also: [elections-1965]
    c: 'New York. The legislature elected again, under the plan of December 1964, for one year, the only legislative election in an odd year since 1937: Republicans 37 of the Senate''s 65, Democrats a majority of the Assembly''s 165 (Check the counts). Brydges (R) the Senate''s leader from Jan. 5; Travia Speaker again.'
    n: '[Wikipedia, "176th New York State Legislature"](https://en.wikipedia.org/wiki/176th_New_York_State_Legislature); ["1965 New York state election"](https://en.wikipedia.org/wiki/1965_New_York_state_election). Check: the *Legislative Manual*, 1966. See [[cal.1965-04-14.legislatures-ny]]. Names: Brydges, Travia.'
    tags: [state:ny, name:brydges-earl-w, name:travia-anthony-j]
  - id: cal.1965-11-02.state-constitutions-ny
    when: Nov. 2
    date: '1965-11-02'
    thread: state-constitutions
    also: [conservation, elections-1965]
    c: New York's voters call a constitutional convention for 1967, and approve a bond issue of $1 billion for sewage treatment, Rockefeller's Pure Waters program. Check the votes.
    n: 'Check: the *Legislative Manual*, 1966. [[w.dullea-charter-revision-in-the]]; [[w.nunez-new-york-state-constitutional]]; [[w.connery-rockefeller-of-new-york]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1965-11-02.mayors-ny
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965]
    c: 'New York''s cities upstate. Buffalo: Sedita (D) elected mayor again. Syracuse: Walsh (R) reelected. Albany, N.Y.: Corning (D) elected to a seventh term. Check the votes.'
    n: '[Wikipedia, "Frank A. Sedita"](https://en.wikipedia.org/wiki/Frank_A._Sedita); ["William F. Walsh"](https://en.wikipedia.org/wiki/William_F._Walsh); ["Erastus Corning 2nd"](https://en.wikipedia.org/wiki/Erastus_Corning_2nd). Check: the county boards of elections'' canvasses. See [[cal.1961-11-07.mayors-ny]]. Names: Sedita, Walsh, Corning.'
    tags: [state:ny, city:buffalo, city:syracuse, city:albany, name:sedita-frank-a, name:walsh-william-f, name:corning-erastus]
  - id: cal.1965-11-02.mayors-detroit
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965]
    c: Detroit. Cavanagh re-elected over Walter Shamie, 295,409 to 144,852, 67.1 percent, by the unofficial count. A second Negro member elected to the Common Council.
    n: '*Pontiac Press*, [Nov. 3, 1965](https://our.oakland.edu/bitstreams/5d588ef0-748d-4bd1-9a0c-712e8b7e7406/download), p. 1 (Check: the city clerk''s canvass). [[w.fine-violence-in-the-model]]. See [[cal.1961-11-07.mayors-detroit]]. Names: Cavanagh, Shamie.'
    tags: [state:mi, city:detroit, name:cavanagh-jerome-p, name:shamie-walter-c]
  - id: cal.1965-11-02.mayors-cleveland
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965]
    c: 'Cleveland. Locher (D) re-elected over Carl Stokes, a Negro State representative running as an independent: Locher 87,858, 36.7 percent; Stokes 87,716, 36.7; Ralph Perk (R), 41,045, 17.2; a fourth 9.5.'
    n: 'Votes: [Wikipedia, "1965 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1965_Cleveland_mayoral_election), from Our Campaigns (Check: the Cuyahoga County Board of Elections; the margin). [[w.moore-carl-b-stokes-and]]; [[w.weinberg-black-victory]]; [[w.stokes-promises-of-power]]; [[w.stradling-where-the-river-burned]]. See [[cal.1963-11-05.mayors-cleveland]]. Names: Locher, Stokes, Perk.'
    tags: [state:oh, city:cleveland, name:locher-ralph-s, name:stokes-carl-b, name:perk-ralph-j]
  - id: cal.1965-11-02.state-constitutions-tx
    when: Nov. 2
    date: '1965-11-02'
    thread: state-constitutions
    also: [welfare, health]
    c: 'Texas votes on ten amendments. Adopted: assistance and medical care for the needy aged, disabled, blind and children, the State to join the federal programs and accept their funds, 347,218 to 148,097; student loans, the Texas Opportunity Plan; retirement of district and appellate judges and a Judicial Qualifications Commission; teacher retirement; building at State colleges. Refused: four-year terms for the governor and other State officers, 225,987 to 277,892, and for State representatives, 141,184 to 343,236; legislators'' pay; the Veterans'' Land Fund; a tax exemption for charity hospitals.'
    n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 2, 1965](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1965-11-02). [[w.david-with-dignity]]; [[w.may-texas-state-constitution]]. See [[cal.1964-11-03.state-constitutions-tx]]; [[cal.1965-07-30.medicare]].'
    tags: [state:tx]
  - id: cal.1965-11-02.governors-nj
    when: Nov. 2
    date: '1965-11-02'
    thread: governors
    also: [elections-1965]
    c: New Jersey. Hughes (D) re-elected over Dumont (R), 1,279,568 to 915,996, 57.4 percent; Dumont had campaigned on Genovese's teach-in remarks. Democrats win both houses of the Legislature (Check).
    n: '[*Results of the General Election Held November 2, 1965*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1965-general-election.pdf) (Secretary of State). [Wikipedia, "1965 New Jersey gubernatorial election"](https://en.wikipedia.org/wiki/1965_New_Jersey_gubernatorial_election). See [[cal.1965-06-01.governors-nj]]; [[cal.1965-04-23.students-nj]]. Names: Hughes, Dumont, Genovese.'
    tags: [state:nj, name:hughes-richard-j, name:dumont-wayne-jr, name:genovese-eugene-d]
  - id: cal.1965-11-02.mayors-pittsburgh
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965]
    c: Pittsburgh. Barr (D) re-elected over the Republican, an attorney, 109,947 to 65,969, 62.5 percent.
    n: '[Wikipedia, "1965 Pittsburgh mayoral election"](https://en.wikipedia.org/wiki/1965_Pittsburgh_mayoral_election); check against the Allegheny County returns. See [[cal.1961-11-07.mayors-pittsburgh]]. Names: Barr.'
    tags: [state:pa, city:pittsburgh, name:barr-joseph-m]
  - id: cal.1965-11-03.transition-and-staff
    when: Nov. 3
    date: '1965-11-03'
    thread: transition-and-staff
    c: 'At the post office in Hye, Tex., near the Ranch: O''Brien, the President''s legislative liaison, sworn as Postmaster General; Gronouski, his predecessor, as Ambassador to Poland.'
    n: '[Remarks at the Post Office, Hye, Texas, at the Swearing In of Lawrence F. O''Brien as Postmaster General](https://www.presidency.ucsb.edu/documents/remarks-the-post-office-hye-texas-the-swearing-lawrence-f-obrien-postmaster-general); [Remarks at the LBJ Ranch at the Swearing In of John A. Gronouski as Ambassador to Poland](https://www.presidency.ucsb.edu/documents/remarks-the-lbj-ranch-the-swearing-john-gronouski-ambassador-poland) (Nov. 3, 1965). [[w.obrien-no-final-victories]]. See [[cal.1965-08-29.transition-and-staff]]. Names: O''Brien, Gronouski.'
    tags: [name:johnson-lyndon-b, name:obrien-lawrence-f, name:gronouski-john-a]
  - id: cal.1965-11-03.farm
    when: Nov. 3
    date: '1965-11-03'
    thread: farm
    c: 'Food and Agriculture Act signed at the Ranch, [79 Stat. 1187](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1187.pdf): programs for the 1966–69 crops of wheat, feed grains, and cotton, supports with payments to farmers who divert acreage, cotton''s loan near the world price; dairy; a Cropland Adjustment Program. The House passed it Aug. 19, [221–172](https://voteview.com/rollcall/RH0890122); the Senate Sept. 14, [72–22](https://voteview.com/rollcall/RS0890225); the House the conference report Oct. 8, [219–150](https://voteview.com/rollcall/RH0890190). Nov. 4, a National Advisory Commission on Food and Fiber, Executive Order 11256.'
    n: '[Statement by the President Upon Signing the Food and Agriculture Act of 1965](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-food-and-agriculture-act-1965) (Nov. 4, 1965); [Executive Order 11256](https://www.presidency.ucsb.edu/documents/executive-order-11256-establishing-the-presidents-committee-food-and-fiber-and-the-national) (Nov. 4, 1965). See [[cal.1965-02-04.farm]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-11-06.cuba
    when: Nov. 6
    date: '1965-11-06'
    thread: cuba
    also: [immigration]
    c: 'Cuban refugees. Notes exchanged through the Swiss Embassy in Havana set procedures for Cubans to come to the United States. Johnson: "those who seek refuge here will find it." The airlift from Varadero to Miami begins Dec. 1 (Check). Nov. 18, a task force on the program''s burden on Miami.'
    n: '[Statement by the President on the Agreement Covering Movement of Cuban Refugees to the United States](https://www.presidency.ucsb.edu/documents/statement-the-president-the-agreement-covering-movement-cuban-refugees-the-united-states) (Nov. 6, 1965); [Letter Establishing a Task Force on the Impact of the Cuban Refugee Program](https://www.presidency.ucsb.edu/documents/letter-establishing-task-force-the-impact-the-cuban-refugee-program) (Nov. 18, 1965). See [[cal.1965-10-03.immigration]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-11-06.economy
    when: Nov. 6–19
    date: '1965-11-06'
    thread: economy
    c: 'Aluminum and copper. Ellington, Nov. 6, to Alcoa: papers drawn to release 300,000 tons of stockpile aluminum, 100,000 at once. Nov. 10, Alcoa and the others rescind their price rise. Copper up 2 cents, to 38: Johnson, Nov. 18, releases 200,000 tons from the stockpile "for purposes of the common defense"; Nov. 19, Anaconda and the others back to 36 cents.'
    n: '[Memorandum Approving the Release of Copper From the National Stockpile](https://www.presidency.ucsb.edu/documents/memorandum-approving-the-release-copper-from-the-national-stockpile) (Nov. 18, 1965). FRUS 1964–68, IX, docs. [292](https://history.state.gov/historicaldocuments/frus1964-68v09/d292), [296](https://history.state.gov/historicaldocuments/frus1964-68v09/d296), [297](https://history.state.gov/historicaldocuments/frus1964-68v09/d297), [300](https://history.state.gov/historicaldocuments/frus1964-68v09/d300). See [[cal.1965-08-30.steel]]. Names: Ellington, Johnson, McNamara, Ackley.'
    tags: [name:johnson-lyndon-b, name:ellington-buford, name:mcnamara-robert-s, name:ackley-gardner]
  - id: cal.1965-11-06.mayors-new-orleans
    when: Nov. 6
    date: '1965-11-06'
    thread: mayors
    also: [elections-1965]
    c: 'New Orleans, Democratic primary for mayor: Schiro 81,973, 50.1 percent; Fitzmorris, a councilman, 78,654, 48.1. No runoff.'
    n: '[Wikipedia](https://en.wikipedia.org/wiki/1965_New_Orleans_mayoral_election). Check: Orleans Parish Democratic Executive Committee, *Mayoralty* (1965). See [[cal.1962-03-03.mayors-new-orleans]]. Names: Schiro, Fitzmorris.'
    tags: [name:schiro-victor-h, name:fitzmorris-james-e-jr, state:la, city:new-orleans]
  - id: cal.1965-11-08.school-aid
    when: Nov. 8
    date: '1965-11-08'
    thread: school-aid
    c: 'Higher Education Act signed at Southwest Texas State College, San Marcos, his own, [79 Stat. 1219](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1219.pdf): Educational Opportunity Grants to needy undergraduates, up to $1,000 a year; insured student loans; work-study; aid to libraries, community service, and developing colleges; a National Teacher Corps. The Senate passed it Sept. 2, [79–3](https://voteview.com/rollcall/RS0890215); the House kept the Teacher Corps, [152–226](https://voteview.com/rollcall/RH0890196) against recommittal, and adopted the conference report Oct. 20, [313–63](https://voteview.com/rollcall/RH0890197).'
    n: Statute (K–J Cong. II.J.2). [Remarks at Southwest Texas State College Upon Signing the Higher Education Act of 1965](https://www.presidency.ucsb.edu/documents/remarks-southwest-texas-state-college-upon-signing-the-higher-education-act-1965) (Nov. 8, 1965). See [[cal.1965-08-26.school-aid]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-11-09.states-and-cities
    when: Nov. 9
    date: '1965-11-09'
    thread: states-and-cities
    c: 'The Northeast blackout. 5:16 p.m.: a relay on a line from the Sir Adam Beck station, Queenston, Ontario, trips; in minutes the interconnected systems of Ontario, New York, and New England fail. Some 30 million people without power, New York City into the next morning. Johnson orders the Federal Power Commission (Swidler) to investigate. Its report, Dec. 6.'
    n: '[Memorandum Concerning the Power Failure in the Northeastern United States](https://www.presidency.ucsb.edu/documents/memorandum-concerning-the-power-failure-the-northeastern-united-states) (Nov. 9, 1965); [Statement by the President in Response to Federal Power Commission Report on the Northeastern Electric Power Blackout](https://www.presidency.ucsb.edu/documents/statement-the-president-response-federal-power-commission-report-the-northeastern-electric) (Dec. 6, 1965). [[w.commission-northeast-power-failure-november]]. Thread: none nearer. Names: Johnson, Swidler.'
    tags: [name:johnson-lyndon-b, name:swidler-joseph-c]
  - id: cal.1965-11-10.congress
    when: Nov. 10
    date: '1965-11-10'
    thread: congress
    also: [states-and-cities]
    c: Harry Byrd resigns from the Senate, after nearly 33 years, citing arthritis. Nov. 12, Governor Harrison appoints his son, Harry F. Byrd Jr., a State senator, to the seat. Sworn Jan. 10, 1966.
    n: '[112 Cong. Rec., Senate, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-1.pdf) (the letter of resignation, Nov. 10; the certificate, Nov. 12; the oath). [[w.heinemann-harry-byrd-of-virginia]]. Names: Harry F. Byrd, Harry F. Byrd Jr., Harrison.'
    tags: [name:byrd-harry-f, name:byrd-harry-f-jr, name:harrison-albertis-s-jr]
  - id: cal.1965-11-10.robert-kennedy
    when: Nov. 10–30
    date: '1965-11-10'
    thread: robert-kennedy
    also: [latin-america]
    c: 'Robert Kennedy in South America, three weeks: Peru, Chile, Argentina, Brazil. Check the end date. Aug. 27, Johnson to Mann: his own Latin American plans to be announced quickly, "before Bobby is on every front page."'
    n: '[FRUS 1964–68, XXXI, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v31/d31) (Aug. 27). [[w.schlesinger-robert-kennedy-and-his]]; [[w.shesol-mutual-contempt]]. See [[cal.1965-05-06.robert-kennedy]]. Made public, the call to Mann: FRUS 1964–68, XXXI (2004). Names: Robert Kennedy, Johnson, Mann.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:mann-thomas-c]
  - id: cal.1965-11-11.europe-and-the-alliance
    when: Nov. 11
    date: '1965-11-11'
    thread: europe-and-the-alliance
    also: [africa]
    c: 'Rhodesia. Smith proclaims independence from Britain. Rusk, after meeting Johnson at the Ranch: no recognition; the consul general recalled. The Security Council, Nov. 12, condemns the declaration, 10–0, France abstaining; Nov. 20, calls for an embargo on oil and arms. Dec. 16–17, Wilson in Washington; Britain embargoes oil, and the United States helps airlift oil to Zambia.'
    n: 'FRUS 1964–68, XXIV, docs. [491](https://history.state.gov/historicaldocuments/frus1964-68v24/d491), [492](https://history.state.gov/historicaldocuments/frus1964-68v24/d492), [506](https://history.state.gov/historicaldocuments/frus1964-68v24/d506), [512](https://history.state.gov/historicaldocuments/frus1964-68v24/d512), [519](https://history.state.gov/historicaldocuments/frus1964-68v24/d519). [S.C. Res. 216](https://undocs.org/S/RES/216(1965)) (Nov. 12, 1965); [S.C. Res. 217](https://undocs.org/S/RES/217(1965)) (Nov. 20, 1965). Check the date of the British oil embargo. [[w.horne-from-the-barrel-of]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.wilson-labour-government-1964-1970]]. See [[cal.1964-12-07.europe-and-the-alliance]]. See [[cal.1965-10-05.africa]]. Names: Smith, Wilson, Rusk, Johnson.'
    tags: [name:smith-ian-douglas, name:rusk-dean, name:johnson-lyndon-b, name:wilson-harold]
  - id: cal.1965-11-14.vietnam
    when: Nov. 14–18
    date: '1965-11-14'
    thread: vietnam
    c: Ia Drang. Moore's 1st Battalion, 7th Cavalry, of the 1st Cavalry Division (Airmobile), lands by helicopter at LZ X-Ray, under the Chu Pong massif, Nov. 14, and holds three days against North Vietnamese regulars, with B-52s striking the massif from Nov. 15; 79 Americans killed. Nov. 17, the 2d Battalion ambushed marching to LZ Albany; some 155 killed. The first battle between American and North Vietnamese regulars. Check the counts.
    n: 'FRUS 1964–68, III, doc. [212](https://history.state.gov/historicaldocuments/frus1964-68v03/d212). [[w.cash-fight-at-ia-drang]]; [[w.coleman-pleiku]]; [[w.moore-we-were-soldiers-once]]; [[w.pribbenow-fog-of-war]]. [[w.westmoreland-soldier-reports]]; [[w.mcnamara-in-retrospect]]. See [[cal.1965-07-28.vietnam]]. Names: Moore.'
    tags: [name:moore-harold-g]
  - id: cal.1965-11-15.court
    when: Nov. 15
    date: '1965-11-15'
    thread: court
    c: '*Albertson v. Subversive Activities Control Board*, [382 U.S. 70](https://tile.loc.gov/storage-services/service/ll/usrep/usrep382/usrep382070/usrep382070.pdf): members of the Communist Party cannot be compelled to register under the Subversive Activities Control Act; registration would incriminate them. Brennan for the Court, 8–0; White not participating.'
    n: Opinion (K–J Cong. II.J.1). *Communist Party v. Subversive Activities Control Board* (K–J Cong. II.J.1).
  - id: cal.1965-11-16.civil-rights-the-executive
    when: Nov. 16–17
    date: '1965-11-16'
    thread: civil-rights-the-executive
    also: [desegregation-schools]
    c: 'Planning session for the White House Conference "To Fulfill These Rights," the conference itself put off to June 1–2, 1966. Randolph honorary chairman; Abram and Coleman chairmen. Johnson, in the East Room, Nov. 16: 200,000 Negroes newly registered under the Voting Rights Act. Nov. 17, he asks the Civil Rights Commission (Hannah) to study racial isolation in the schools, North and South.'
    n: '[Remarks at a Reception for Participants in a Planning Session for the White House Conference "To Fulfill These Rights"](https://www.presidency.ucsb.edu/documents/remarks-reception-for-participants-planning-session-for-the-white-house-conference-fulfill) (Nov. 16, 1965); [Letter Requesting a Study of Racial Isolation as a Barrier to Quality in Education](https://www.presidency.ucsb.edu/documents/letter-requesting-study-racial-isolation-barrier-quality-education) (Nov. 17, 1965). [[w.graham-civil-rights-era]]. See [[cal.1965-06-04.civil-rights-the-executive]]. Names: Randolph, Abram, William Coleman, Johnson, Hannah.'
    tags: [name:johnson-lyndon-b, name:randolph-a-philip, name:abram-morris-b, name:coleman-william-t-jr, name:hannah-john-a]
  - id: cal.1965-11-17.antisubversion-nc
    when: Nov. 17
    date: '1965-11-17'
    thread: antisubversion
    also: [students]
    c: 'North Carolina. The General Assembly, in extra session, amends the Speaker Ban Law: the trustees of each State-supported college and university to adopt and publish the rules for visiting speakers of the three kinds the law names. A commission to study the law had been created June 16.'
    n: '[N.C. Sess. Laws, Extra Sess. 1965, ch. 1](https://archive.org/details/sessionlaws19656667nort) (H.B. 1, ratified Nov. 17, 1965); the commission, [N.C. Sess. Laws 1965, Res. 85](https://archive.org/details/sessionlaws196365nort) (ratified June 16, 1965). See [[cal.1963-06-26.antisubversion-nc]].'
    tags: [state:nc]
  - id: cal.1965-11-19.opinion
    when: Nov. 19
    date: '1965-11-19'
    thread: opinion
    also: [students, vietnam]
    c: 'Gallup, Oct. 29–Nov. 2: Communists involved in the demonstrations over Vietnam: a lot 58 percent, some 20, minor 8, not at all 4. In the demonstrations over civil rights: a lot 48, some 27.'
    n: '[[w.gallup-poll]], III, 1971.'
  - id: cal.1965-11-21.opinion
    when: Nov. 21
    date: '1965-11-21'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Oct. 29–Nov. 2: a candidate for Congress for sending many more men to Vietnam: more inclined 46 percent, less 31. For a compromise peace: more 66, less 20. Should have become involved, 64; not, 21. How the war will end: stalemate like Korea 30; American victory 29; long conflict 10; world war 4.'
    n: '[[w.gallup-poll]], III, 1971–72.'
  - id: cal.1965-11-22.civil-rights-organizations-charlotte
    when: Nov. 22
    date: '1965-11-22'
    thread: civil-rights-organizations
    also: [desegregation-schools]
    c: 'Charlotte. Bombs at the homes of four Negro leaders: Julius Chambers, counsel in the suit against the city''s and county''s schools, its first hearings under way; Kelly Alexander, State president of the NAACP; his brother Fred Alexander, a city councilman; Reginald Hawkins. No one hurt.'
    n: '[[w.douglas-reading-writing-and-race]]. Names: Chambers, Kelly Alexander, Fred Alexander, Hawkins.'
    tags: [state:nc, city:charlotte, name:chambers-julius-l, name:alexander-kelly-m-sr, name:alexander-fred-d, name:hawkins-reginald-a]
  - id: cal.1965-11-24.opinion
    when: Nov. 24
    date: '1965-11-24'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Oct. 29–Nov. 2: the 1968 convention''s choice between Romney and Nixon. Republicans: Nixon 55, Romney 38. Democrats: Romney 52, Nixon 35. Independents: Romney 43, Nixon 42.'
    n: '[[w.gallup-poll]], III, 1972. Names: Nixon, Romney.'
    tags: [name:romney-george-w, name:nixon-richard-m]
  - id: cal.1965-11-24.middle-east
    when: Nov. 24
    date: '1965-11-24'
    thread: middle-east
    c: Abdullah al-Salim al-Sabah, Amir of Kuwait, dies; his brother succeeds. Johnson's telegram to the new Amir, Nov. 26.
    n: '[Telegram to the New Amir of Kuwait on the Death of His Brother, Shaikh Abdullah al-Salim al-Sabah](https://www.presidency.ucsb.edu/documents/telegram-the-new-amir-kuwait-the-death-his-brother-shaikh-abdullah-al-salim-al-sabah) (Nov. 26, 1965). [[w.joyce-kuwait-1945-1996]]. See [[cal.1961-06-25.middle-east]]. Names: Abdullah al-Salim al-Sabah.'
    tags: [name:abdullah-al-salim-al-sabah, name:johnson-lyndon-b]
  - id: cal.1965-11-25.congo
    when: Nov. 25
    date: '1965-11-25'
    thread: congo
    c: 'Leopoldville. The army, at 5 a.m., takes over the government: Mobutu President; Kasavubu deposed, and Kimba, his prime minister. The embassy and the CIA station in touch with Mobutu at once. Nov. 26, Washington authorizes informal dealings; formal recognition to wait on the Africans''.'
    n: 'FRUS 1964–68, XXIII, docs. [452](https://history.state.gov/historicaldocuments/frus1964-68v23/d452), [455](https://history.state.gov/historicaldocuments/frus1964-68v23/d455), [456](https://history.state.gov/historicaldocuments/frus1964-68v23/d456). [[w.weissman-american-foreign-policy-in]]; [[w.namikas-battleground-africa]]; [[w.devlin-chief-of-station-congo]]. See [[cal.1964-11-24.congo]]. Names: Mobutu, Kasavubu, Kimba.'
    tags: [name:mobutu-joseph-d, name:kasavubu-joseph, name:godley-g-mcmurtrie-ii, name:devlin-lawrence-r, name:kimba-evariste]
  - id: cal.1965-11-27.students
    when: Nov. 27
    date: '1965-11-27'
    thread: students
    also: [vietnam]
    c: 'March on Washington for Peace in Vietnam, called by SANE: pickets around the White House, then a rally at the Washington Monument; some 25,000 or more. Spock and Coretta King among the speakers. Oglesby, president of SDS, "Let Us Shape the Future": the war the work of "corporate liberalism." Check the count and the speakers.'
    n: '[[w.wells-war-within]]; [[w.sale-sds]]; [[w.miller-democracy-is-in-the]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. See [[cal.1965-11-02.students]]. Names: Spock, Coretta King, Oglesby.'
    tags: [name:spock-benjamin, name:king-coretta-scott, name:oglesby-carl]
  - id: cal.1965-11-27.europe-and-the-alliance
    when: Nov. 27
    date: '1965-11-27'
    thread: europe-and-the-alliance
    c: 'Paris. The Special Committee of NATO defense ministers, McNamara''s select committee, meets the first time: working groups on data and intelligence, on communications, and on nuclear planning, the United States and Britain in all three.'
    n: '[FRUS 1964–68, XIII, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v13/d113). See [[cal.1965-05-31.europe-and-the-alliance]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1965-11-28.vietnam
    when: Nov. 28–Dec. 7
    date: '1965-11-28'
    thread: vietnam
    c: 'McNamara and Wheeler in Saigon, Nov. 28–29. McNamara to Johnson, Nov. 30: infiltration up, the enemy standing to fight, as at Ia Drang; US battalions from 34 to 74 by the end of 1966, some 400,000 men, perhaps 200,000 more in 1967; the bombing gradually widened; first a pause of three or four weeks. American dead may reach 1,000 a month; the odds even of a "no-decision" at a higher level in early 1967. Revised, Dec. 7.'
    n: 'FRUS 1964–68, III, docs. [189](https://history.state.gov/historicaldocuments/frus1964-68v03/d189), [198](https://history.state.gov/historicaldocuments/frus1964-68v03/d198), [212](https://history.state.gov/historicaldocuments/frus1964-68v03/d212), [222](https://history.state.gov/historicaldocuments/frus1964-68v03/d222). [[w.pentagon-papers]]; [[w.mcnamara-in-retrospect]]; [[w.berman-lyndon-johnsons-war]]; [[w.barrett-uncertain-warriors]]; [[w.herring-lbj-and-vietnam]]. See [[cal.1965-07-28.vietnam]]; [[cal.1965-11-14.vietnam]]. Names: McNamara, Wheeler, Lodge, Westmoreland, Sharp, Johnson.'
    tags: [name:mcnamara-robert-s, name:wheeler-earle, name:lodge-henry-cabot, name:westmoreland-william, name:sharp-u-s-grant, name:johnson-lyndon-b]
  - id: cal.1965-11-28.opinion
    when: Nov. 28
    date: '1965-11-28'
    thread: opinion
    also: [elections-1968, robert-kennedy]
    c: 'Gallup, Oct. 29–Nov. 2: Senator Robert Kennedy as capable as his brother was as a Senator: yes 38 percent, no 44. Wants to be President, 74. Will win the nomination: yes 55, no 33. Would like to see him President: yes 40, no 46; Democrats 56, independents 30, Republicans 20.'
    n: '[[w.gallup-poll]], III, 1972–73. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f]
  - id: cal.1965-11-30.alabama-al
    when: Nov. 30
    date: '1965-11-30'
    thread: alabama
    also: [state-constitutions, voting-rights]
    c: 'Constitutional amendment election, thirty-seven amendments. Section 181, the qualifications of 1951 (good character, embracing the duties of citizenship), repealed: an applicant to read and write any article of the federal Constitution, except for physical disability, the legislature to provide permanent registration; 93,647 to 37,137. $1,900,000 in bonds for an exhibit of Army and NASA rockets at Huntsville, 92,506 to 29,761.'
    n: '[*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), 687](https://archive.org/details/alabama-official-statistical-register-1967/page/n688)–[688](https://archive.org/details/alabama-official-statistical-register-1967/page/n689) (Act No. 239, First Special Session, 1965). [[w.lawson-black-ballots]]; [[w.davidson-quiet-revolution-in-the]]. See [[cal.1963-12-10.alabama-al]]; [[cal.1965-08-06.voting-rights]].'
    tags: [state:al, city:huntsville]
  - id: cal.1965-11-30.legislatures-nc
    when: Nov. 30
    date: '1965-11-30'
    thread: legislatures
    also: [court]
    c: '*Drum v. Seawell*: the three-judge court holds void North Carolina''s apportionment of both houses, the constitution''s Representative for every county with it, and its congressional districts. Elections enjoined, the order stayed for the State to act before the primary of May 28, 1966.'
    n: '*Drum v. Seawell*, [249 F. Supp. 877](https://static.case.law/f-supp/249/html/0877-01.html) (M.D.N.C. 1965). See [[cal.1964-06-15.court]].'
    tags: [state:nc]
  - id: cal.1965-11-30.transportation
    when: Nov. 30
    date: '1965-11-30'
    thread: transportation
    c: Nader's *Unsafe at Any Speed* published (Check the day). Its first chapter, the Corvair.
    n: '[[w.nader-unsafe-at-any-speed]]; [[w.mccarry-citizen-nader]]; [[w.martin-nader]]. See [[cal.1965-07-13.transportation]]. Names: Nader.'
    tags: [name:nader-ralph]
