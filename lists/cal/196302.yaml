  - id: cal.1963-02.china-leadership-2
    when: Feb.
    date: 1963-02
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: Peking. The Standing Committee, Mao back from his months away, formally names the Central Committee's anti-revisionist drafting group, under the Standing Committee. Kang Sheng heads it, Wu Lengxi is deputy; its members include Liao Chengzhi, Wu Xiuquan, Liu Ningyi, Zhang Hanfu and Kong Yuan, with the writers Xu Liqun, Yao Zhen, Qiao Guanhua (deputy head once the two-party talks begin), Wang Li, Fan Ruoyu, Hu Sheng and Xiong Fu; Chen Boda sits with it as he pleases. Drafts go first to a meeting under Deng Xiaoping, with Peng Zhen, Lu Dingyi, Luo Ruiqing and Liang Biye, and then to the Standing Committee.
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 540–541 (the group''s work from Nov. 1962; the writers together at the Diaoyutai from Dec. 1962; named at the Standing Committee after Mao''s return, Feb. 1963; it kept at work until the start of the Cultural Revolution in May 1966, when it broke up; Qiao Mu (Hu Qiaomu) had been wholly on leave since the summer of 1961 by Mao''s order); [[w.deng-xiaoping-nianpu-1904]], III, 1746–1747 (Feb. 1963; the conference decides to set up the Central Anti-Revisionist Documents Drafting Group 中央反修文件起草小组 under the Politburo Standing Committee: head Kang Sheng, deputy head Wu Lengxi, members Liao Chengzhi, Wu Xiuquan, Liu Ningyi, Zhang Hanfu, Kong Yuan and others; Deng presides over the meeting that discusses and revises each draft, which then goes to the Standing Committee). Made public: 1999. Names: Kang Sheng, Qiao Guanhua, Chen Boda, Deng Xiaoping, Peng Zhen, Lu Dingyi, Luo Ruiqing, Mao Zedong. Check: the day: Wu gives Feb. 1963, after Mao''s return to Peking; the session is not dated.'
