  - id: cal.1963-02-06.missile-crisis
    when: Feb. 6
    date: '1963-02-06'
    thread: missile-crisis
    c: 'McNamara on television with the reconnaissance photographs: no offensive weapons left in Cuba. Keating has said otherwise. Feb. 7, press conference: 4,500 Soviet personnel gone, four combat groups of about 6,000 men left. "We cannot prove that there is not a missile in a cave."'
    n: 'The President''s News Conference, [1963 Pub. Papers 148](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=206) (Feb. 7, 1963). [[w.fursenko-one-hell-of-a]], 327; [[w.sorensen-kennedy]], 722 (the televised briefing); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 205, 218 (the briefing of Feb. 6; the President, Feb. 7: "unfinished business," the Soviet forces in Cuba). To check: [[w.coleman-fourteenth-day]]. See [[cal.1963-01-07.missile-crisis]]. Names: McNamara, Keating. Check: Fursenko and Naftali give Feb. 7 for McNamara''s briefing (327).'
    src:
      c: ab659819
      rows:
