  - id: cal.1963-02-01.china-leadership
    when: Feb. 1
    date: '1963-02-01'
    thread: china-leadership
    c: 'Zhou Enlai to the East China conferences of advanced agricultural collectives and of agricultural science and technology, on the ties of economics, politics and thought and of state, collective and individual. Eight demands: collective first, individual after; state before person; ask of self before others; blame self before others; public before private; act for the public first; I for all the people and all for me; I for the world and the world for me. Public before private, even to forgetting self in war; cadres and model workers lead in it.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 530 (Feb. 1, 1963). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
