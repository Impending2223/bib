  - id: cal.1963-02-28.china-leadership
    when: Feb. 28
    date: '1963-02-28'
    place: peking
    thread: china-leadership
    c: 'The Great Hall, afternoon. Mao presides at the Work Conference''s closing, speaks after Deng Xiaoping lists the papers to be adopted. The meeting ran in parallel: Deng, Chen Boda, Kang Sheng and others on the international questions, Mao drawn in; Liu Shaoqi on both. On home affairs: take hold of socialist education, of cadres and of the masses; protect 90 percent of the cadres, "a warm-water bath, not cold, not boiling," and then bind them to the activists among poor and lower-middle peasants.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 28, 1963. [[w.lengxi-shinian-lunzhan-1956-1966]], 537–540 (Wu on Mao''s closing remarks, Feb. 28: true Marxists to unite and educate the cadres and masses who do not understand Marxism, hence socialist education in the villages; 90 percent of the intellectuals approve the anti-revisionist articles (image: 百分之九十); 43 parties abuse China, and their texts are all to be printed; after a few more articles, a pause ("a tightening and a loosening"); Deng Xiaoping, agreeing, conveys the Standing Committee''s decision: stop after the planned articles; the two parties'' talks first, a third conference of the parties perhaps after; five possible states of relations, from a form of unity with differences to a split of everything; four tasks (finish the articles and turn to pamphlets; prepare the talks; strengthen propaganda abroad and the work with the left; guard against revisionism at home)); [[w.yang-shangkun-riji]], II, 257 (Feb. 28, 1963; the closing plenary, 2 to 3 p.m., Mao presiding: his speech, an hour, on class education, the class ranks (poor and lower-middle peasants'' groups or congresses), reliance on the majority, the year''s work; the conference over; Yang there); [[w.mao-zedong-zhuan]], V, ch. 71 (Feb. 28, afternoon, the last day: Mao''s speech; the conference opened Feb. 11 (Mao counts 24 days from the 5th); Deng, Chen Boda, Kang Sheng and others on international questions in parallel; Liu on both; Mao on the replies'' reception at home (nine in ten accept them) and on turning to anti-revisionism at home). [[w.mao-zedong-zhuan]], VI, ch. 72 (Feb. 28, the last day: Mao on socialist education: take hold of it; protect nine in ten cadres, a warm-water bath, then join them to the poor and lower-middle peasants and strike the evil winds and ghosts; a night or five for the movement to beat them down (n.4)). Made public: 1999. To check: Central Work Conference 中央工作会议, record 记录, Feb. 28, 1963 (Mao''s speech) (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.14); Central Work Conference 中央工作会议, record 记录, Feb. 28, 1963 (Mao''s speech) (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.4). See [[cal.1963-02-25.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Chen Boda, Kang Sheng, Liu Shaoqi.'
