    date: '1963-02-01'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, Jan. 11–16: race relations in the South in the coming year, better 44 percent, worse 32. In the South, 36 and 36.'
    n: '[[w.gallup-poll]], III, 1802.'
  - id: cal.1963-02-01.legislatures-fl
    when: Feb. 1
    date: '1963-02-01'
    thread: legislatures
    also: [state-constitutions]
    c: 'Florida''s legislature, in special session, passes S.B. 10-X: 43 senators, 112 representatives, two senators for Dade. The amendment proposed in August, 46 and 135, had been rejected at the polls, Nov. 6. Bryant signs, Feb. 4; the three-judge court upholds the act, Feb. 7.'
    n: '*Sobel v. Adams*, [214 F. Supp. 811](https://static.case.law/f-supp/214/case-pdfs/0811-01.pdf) (S.D. Fla. 1963). See [[cal.1962-07-23.legislatures-fl]]. Names: Bryant.'
    tags: [name:bryant-farris, state:fl, city:miami]
  - id: cal.1963-02-01.vietnam
    when: Feb. 1
    date: '1963-02-01'
    thread: vietnam
    c: 'Meeting on Vietnam, 4:30 p.m., recorded: Kennedy with Rusk, McNamara, Taylor, McCone, Harriman, Gilpatric, the Bundys, Forrestal and Bell; Wheeler back from Saigon. Wheeler: reasonable prospects; neither pull out nor send large forces; the present support to go on.'
    n: '[Meeting on Vietnam, 4:30 p.m.](https://prde.upress.virginia.edu/conversations/8060022), Tape 71.1 (PRDE only). [[w.selverstone-kennedy-withdrawal]], 101–02 (Wheeler''s report and its review with Kennedy). Check: the recording not heard. See [[cal.1963-01-25.vietnam]]. Names: Kennedy, Rusk, McNamara, Taylor, McCone, Harriman, Gilpatric, McGeorge Bundy, William Bundy, Forrestal, Bell, Wheeler.'
    src:
      c: c6706678
      rows:
        - 'https://prde.upress.virginia.edu/conversations/8060022: A'
        - 'w.selverstone-kennedy-withdrawal 101–02: all'
        - 'via w.selverstone-kennedy-withdrawal 102 n.20: all'
    tags: [name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:mccone-john-a, name:harriman-w-averell, name:gilpatric-roswell-l, name:bundy-mcgeorge, name:bundy-william, name:forrestal-michael-v, name:bell-david-e, name:wheeler-earle]
  - id: cal.1963-02-03.opinion
    when: Feb. 3
    date: '1963-02-03'
    thread: opinion
    also: [foreign-aid]
    c: 'Gallup, Jan. 11–16: foreign aid, 58 percent for, 30 against.'
    n: '[[w.gallup-poll]], III, 1802.'
  - id: cal.1963-02-04.vietnam-force-levels
    when: Feb. 4
    date: '1963-02-04'
    thread: vietnam-force-levels
    c: 'Wheeler at a Pentagon press briefing: not to disagree with Felt, but no time limit in a war like this. A plan to lower the American presence: "What we are really shooting for is in about three years we would be in a position to start making some reductions."'
    n: '[[w.selverstone-kennedy-withdrawal]], 106. To check: "Press Briefing by General Earle G. Wheeler," Feb. 4, 1963, box 236, OSD Historical Office (cited by [[w.selverstone-kennedy-withdrawal]], 106 n.37). See [[cal.1963-01-30.vietnam-force-levels]]. Names: Wheeler, Felt.'
    src:
      c: 679bd016
      rows:
        - 'w.selverstone-kennedy-withdrawal 106: all'
        - 'via w.selverstone-kennedy-withdrawal 106 n.37: all'
    tags: [name:wheeler-earle, name:felt-harry-d]
  - id: cal.1963-02-05.program
    when: Feb. 5
    date: '1963-02-05'
    thread: health
    c: 'Message on mental illness and mental retardation. "A bold new approach": community mental health centers, federal grants to build and staff them. About 530,000 in State mental hospitals; custodial patients to be cut by half or more in a decade or two.'
    n: 'Special Message to the Congress on Mental Illness and Mental Retardation, [1963 Pub. Papers 126](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=184); Remarks on Proposed Measures To Combat Mental Illness and Mental Retardation, [1963 Pub. Papers 137](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=195) (Feb. 5, 1963). To check: [[w.grob-from-asylum-to-community]]; [[w.shorter-kennedy-family-and-the]]; [[w.grob-dilemma-of-federal-mental]]; [[w.mcnamara-eunice]]; [[w.foley-community-mental-health-legislation]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-02-05.mississippi-ms
    when: Feb. 5
    date: '1963-02-05'
    thread: mississippi
    also: [legislatures, state-constitutions]
    c: 'Mississippi ratifies the reapportionment amendment of the legislature''s second extraordinary session of 1962, Sections 254 and 255: a House of 122, a Senate of 52. Check: the vote.'
    n: '*Connor v. Johnson*, [256 F. Supp. 962](https://static.case.law/f-supp/256/case-pdfs/0962-01.pdf), 965 (S.D. Miss. 1966) (General Laws of Mississippi, Second Extraordinary Session 1962, ch. 57; proclaimed Feb. 13, 1963). To check: [[w.parker-black-votes-count]]. See [[cal.1962-03-26.court]].'
    tags: [state:ms]
  - id: cal.1963-02-05.european-community
    when: Feb. 5
    date: '1963-02-05'
    thread: european-community
    c: 'Luxembourg. The Court of Justice of the European Communities, Van Gend en Loos, on a reference from the Dutch Tariefcommissie: Article 12 of the EEC Treaty, the bar on new customs duties among the Six, gives individuals rights their national courts must protect. The Community "a new legal order of international law," for which the states have limited their sovereign rights.'
    n: '[Case 26/62, NV Algemene Transport- en Expeditie Onderneming van Gend & Loos v. Nederlandse Administratie der Belastingen, 1963 E.C.R. 1](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:61962CJ0026). To check: [[w.weiler-transformation-of-europe]]; [[w.alter-establishing-the-supremacy-of]].'
  - id: cal.1963-02-05.goldwater
    when: Feb. 5
    date: '1963-02-05'
    thread: goldwater
    also: [elections-1964]
    c: 'White, with Barr, at Goldwater''s office again; Goldwater cuts him short. Barr: "We''re free to draft a candidate if we choose and there isn''t much you or anyone else can do about it."'
    n: '[[w.perlstein-before-the-storm]], 190–91. To check: [[w.white-suite-3505]]. See [[cal.1961-10-08.goldwater]]. Names: White, Goldwater.'
    src:
      c: 1f30cbc1
      rows:
        - 'w.perlstein-before-the-storm 190–91: all'
        - 'via w.perlstein-before-the-storm 190 n.3: all'
    tags: [name:white-f-clifton, name:goldwater-barry-m]
  - id: cal.1963-02-05.europe-and-the-alliance
    when: Feb. 5
    date: '1963-02-05'
    thread: europe-and-the-alliance
    also: [economy]
    c: 'The ExComm on Europe. Acheson: let the Europeans know the American forces will not be touched for eighteen months for "peripheral" reasons, the budget or the balance of payments. Kennedy: the threat of withdrawing the troops "about the only sanction" left.'
    n: '[FRUS 1961–63, XIII, doc. 69](https://history.state.gov/historicaldocuments/frus1961-63v13/d69). [[w.gavin-gold-dollars-and-power]], 95–96. See [[cal.1963-01-25.europe-and-the-alliance]]. Names: Acheson, Kennedy.'
    src:
      c: 5dfab462
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d69: all'
        - 'w.gavin-gold-dollars-and-power 95–96: all'
        - 'via w.gavin-gold-dollars-and-power 96 n.14: all'
    tags: [name:acheson-dean-g, name:kennedy-john-f]
  - id: cal.1963-02-06.missile-crisis
    when: Feb. 6
    date: '1963-02-06'
    thread: missile-crisis
    c: 'McNamara on television with the reconnaissance photographs: no offensive weapons left in Cuba. Keating has said otherwise. Feb. 7, press conference: 4,500 Soviet personnel gone, four combat groups of about 6,000 men left. "We cannot prove that there is not a missile in a cave."'
    n: 'The President''s News Conference, [1963 Pub. Papers 148](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=206) (Feb. 7, 1963). To check: [[w.coleman-fourteenth-day]]. See [[cal.1963-01-07.missile-crisis]]. Names: McNamara, Keating.'
    tags: [name:mcnamara-robert-s, name:keating-kenneth-b, name:kennedy-john-f]
  - id: cal.1963-02-06.economy
    when: Feb. 6
    date: '1963-02-06'
    thread: economy
    c: Ways and Means opens hearings on the tax message, Dillon first. They run to Mar. 27.
    n: 'Daily Digest, [109 Cong. Rec. D31](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=29) (Feb. 6, 1963); [109 Cong. Rec. D110](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=108) (Mar. 28, 1963) (the hearings concluded Mar. 27). *President''s 1963 Tax Message: Hearings Before the H. Comm. on Ways and Means*, 88th Cong. (1963), 7 pts. [[w.zelizer-taxing-america]], 200–01 (the opening, Feb. 6). Zelizer, 201, has the hearings run to Sept. 10, the day Mills introduced the bill. See [[cal.1963-01-24.economy]]. Names: Dillon, Mills.'
    src:
      c: f1b473af
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=29: A'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=108: B'
        - '"*President''s 1963 Tax Message:": ?'
        - 'w.zelizer-taxing-america 200–01: A'
    tags: [name:dillon-c-douglas, name:mills-wilbur-d]
  - id: cal.1963-02-06.middle-east-johnson-plan
    when: Feb. 6
    date: '1963-02-06'
    thread: middle-east-johnson-plan
    c: 'Kennedy thanks Joseph Johnson, Feldman, Komer and Grant present. Johnson: the Johnson Plan dead, its principles valid. The refugees'' will expressed; some repatriation, fewer than one in ten to stay in Israel; acquiescence, not formal agreement; slow movement, both sides at once.'
    n: 'FRUS 1961–63, XVIII, doc. [150](https://history.state.gov/historicaldocuments/frus1961-63v18/d150). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Kennedy, Johnson, Feldman, Komer, Grant.'
    tags: [name:kennedy-john-f, name:johnson-joseph-e, name:feldman-myer, name:komer-robert-w, name:grant-james-p]
  - id: cal.1963-02-07.rules
    when: Feb. 7
    date: '1963-02-07'
    thread: rules
    c: Cloture on the motion to take up the three-fifths rule fails, [54–42](https://voteview.com/rollcall/RS0880003), short of two-thirds. Mansfield moves to adjourn, [64–33](https://voteview.com/rollcall/RS0880004); the motion dies. Rule XXII stands.
    n: '[109 Cong. Rec., Senate, Feb. 7, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt2/pdf/GPO-CRECB-1963-pt2-5-2.pdf). Senate cloture table, 88th Cong. ([senate.gov](https://www.senate.gov/legislative/cloture/88.htm)). See [[cal.1963-01-14.rules]]. Names: Mansfield.'
    tags: [name:mansfield-mike]
  - id: cal.1963-02-08.opinion
    when: Feb. 8
    date: '1963-02-08'
    thread: opinion
    also: [europe-and-the-alliance, european-community]
    c: Gallup's French and Dutch affiliates, after the veto, no field dates given. In France, de Gaulle's policy toward Britain, 40 percent approve, 21 disapprove. In the Netherlands, British entry, 66 for, 3 against; a Common Market with Britain and without France, 52, against 10 for the reverse.
    n: '[[w.gallup-poll]], III, 1803. Names: de Gaulle.'
    tags: [name:de-gaulle-charles]
  - id: cal.1963-02-08.middle-east
    when: Feb. 8
    date: '1963-02-08'
    thread: middle-east
    c: Iraq. Army officers and the Ba'th seize Baghdad; Qassim killed. Abdul Salam Arif President.
    n: '[FRUS 1961–63, XVIII, doc. 154](https://history.state.gov/historicaldocuments/frus1961-63v18/d154) (Rusk to Kennedy, Feb. 9). To check: [[w.batatu-old-social-classes-and]]; [[w.tripp-history-of-iraq]]; [[w.matthews-kennedy-administration-counterinsurgency-and]]; [[w.gibson-sold-out]]. See [[cal.1961-12-11.middle-east]]. Names: Qassim, Arif.'
    tags: [name:qassim-abdul-karim, name:arif-abdul-salam-muhammad]
  - id: cal.1963-02-10.opinion
    when: Feb. 10
    date: '1963-02-10'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Jan. 11–16: federal school aid to public schools only, 44 percent; to Catholic and other private schools as well, 49. Protestants 50 to 42 for public schools only; Catholics 71 for private schools too.'
    n: '[[w.gallup-poll]], III, 1804.'
  - id: cal.1963-02-11.middle-east
    when: Feb. 11
    date: '1963-02-11'
    thread: middle-east
    c: The United States recognizes the new regime in Iraq.
    n: 'Department statement, press release 72, Feb. 11: [[w.department-of-state-bulletin]], [Mar. 4, 1963, 316](https://archive.org/details/departmentofstat481963unit/page/316/mode/1up). See [[cal.1963-02-08.middle-east]].'
  - id: cal.1963-02-12.civil-rights-the-executive
    when: Feb. 12
    date: '1963-02-12'
    thread: civil-rights-the-executive
    also: [mississippi]
    c: 'Lincoln''s Birthday. The Civil Rights Commission presents *Freedom to the Free*, its report on the century since emancipation. At the Lincoln Day reception, Hannah, the Commission''s chairman, tells Kennedy of its coming report on Mississippi. Kennedy: "You''re making my life difficult. I''ve read this law and I know you can do anything you want to, but I would appreciate if you didn''t."'
    n: 'Remarks Upon Receiving Civil Rights Commission Report "Freedom to the Free", [1963 Pub. Papers 159](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=217) (Feb. 12, 1963). [[w.reeves-president-kennedy]], 462–64, 469 (Hannah, 469). To check: [[w.rights-freedom-to-the-free]]; [[w.brauer-john-f-kennedy-and]]; [[w.dulles-civil-rights-commission-1957]]; *New York Times*, Feb. 13, 1963 (cited by [[w.reeves-president-kennedy]], 463); Lee White, oral history, 104–05, Kennedy Library (cited by [[w.reeves-president-kennedy]], 464). See [[cal.1962-11-20.civil-rights-the-executive]]. Names: Hannah, Kennedy.'
    src:
      c: 63c75246
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=217: A, B'
        - 'w.reeves-president-kennedy 462–64: A, B'
        - 'via w.reeves-president-kennedy 463 n.a-freedom-more-fictional: B'
        - 'via w.reeves-president-kennedy 464 n.whats-he-doing-here: A'
        - 'w.reeves-president-kennedy 469: C-D'
        - 'via w.reeves-president-kennedy 469 n.youre-making-my-life-difficult: D'
    tags: [name:kennedy-john-f, name:hannah-john-a]
  - id: cal.1963-02-12.republican-party
    when: Feb. 12
    date: '1963-02-12'
    thread: republican-party
    also: [civil-rights-the-executive, elections-1964]
    c: 'Rockefeller, the Republicans'' Lincoln Day: "The fact is that the President, on recommendation of his brother the Attorney General, named at least four Federal judges in the South who were known at the time of their appointment for their segregationist views. This is a strange way to expedite civil rights action."'
    n: '[[w.reeves-president-kennedy]], 465. To check: *Washington Post*, Feb. 13, 1963 (cited by [[w.reeves-president-kennedy]], 465). Check: the day and the occasion; Reeves''s note cites the *Post* of Feb. 13. Names: Rockefeller, Robert Kennedy, Kennedy.'
    src:
      c: 32f6e87d
      rows:
        - 'w.reeves-president-kennedy 465: all'
        - 'via w.reeves-president-kennedy 465 n.the-fact-is-that-the-president: all'
    tags: [name:rockefeller-nelson, name:kennedy-robert-f]
  - id: cal.1963-02-13.opinion
    when: Feb. 13
    date: '1963-02-13'
    thread: opinion
    also: [school-aid, desegregation-schools]
    c: 'Gallup, Jan. 11–16: federal school aid to all public schools, 72 percent; withheld from schools that fail to integrate, 21.'
    n: '[[w.gallup-poll]], III, 1804.'
  - id: cal.1963-02-13.elections-1964
    when: Feb. 13
    date: '1963-02-13'
    thread: elections-1964
    c: 'A small dinner at the White House, by Theodore White''s notes. Kennedy: "Rockefeller gets away with murder, what''s he doing for Negroes in New York?" White plans another book on 1964. Both take Rockefeller to be the nominee. Kennedy: "He''ll get to hate me. That''s inevitable."'
    n: '[[w.reeves-president-kennedy]], 465. To check: Theodore White, "Notes on Social Gathering with the President," Feb. 13, 1963, Schlesinger Papers, box W-6, Kennedy Library (cited by [[w.reeves-president-kennedy]], 465). See [[cal.1963-02-12.republican-party]]. Names: White, Rockefeller, Kennedy.'
    src:
      c: bc1bd331
      rows:
        - 'w.reeves-president-kennedy 465: all'
        - 'via w.reeves-president-kennedy 465 n.he-likes-you-you-know: all'
    tags: [name:white-theodore-h, name:rockefeller-nelson, name:kennedy-john-f]
  - id: cal.1963-02-14.program
    when: Feb. 14
    date: '1963-02-14'
    thread: jobs-and-wages
    c: Message on the nation's youth. A Youth Conservation Corps, 15,000 to start; half the wages of 40,000 in local public-service jobs; a National Service Corps of volunteers; the delinquency act extended three years. 700,000 young people out of school and out of work.
    n: 'Special Message to the Congress on the Nation''s Youth, [1963 Pub. Papers 164](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=222) (Feb. 14, 1963). To check: [[w.sundquist-politics-and-policy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-02-14.mississippi
    when: Feb. 14
    date: '1963-02-14'
    thread: mississippi
    also: [voting-rights]
    c: 'Judge Harold Cox to J. C. McLaurin, a county registrar: the Attorney General typically precedes voting suits with "a political barrage of propaganda for voter consumption among negroes."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 308. To check: W. H. Cox to J. C. McLaurin, Feb. 14, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 308 n.114). Check: the county. Names: Cox.'
    src:
