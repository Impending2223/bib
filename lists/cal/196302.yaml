  - id: cal.1963-02-15.soviet-union-leadership
    when: Feb. 15
    date: '1963-02-15'
    place: moscow
    thread: soviet-union-leadership
    also: [china]
    c: 'The Presidium on the letter to the Chinese party. Khrushchev: the text not a success; no polemic, only the concern that a split may come; "По каким же вопросам расхождение?" (on what questions, then, do we diverge?); ready to meet at any level. The Secretariat to rework it. The Balzan prize: instructions to Kuzmin, Mazzolini may come to Moscow, and to Alekseyev, to sound Castro, approved with amendments.'
    n: 'Protocol 82, items XXVI and XXIX. [[w.prezidium-tsk-kpss-1954]], I, 698–99 (doc. 283, Malin''s notes, item XXVI only); III, 446–52 (P 82/XXVI, the draft letter and the departments'' note of Feb. 14), 439–46 (P 82/XXIX and the instructions; no record of its discussion, 439 n.д). See [[cal.1963-02-07.soviet-union]]. Made public: 2003. Names: Khrushchev, Kuzmin, Mazzolini, Alekseyev, Castro.'
    tags: [name:khrushchev-nikita-s, name:alekseyev-aleksandr-i, name:castro-fidel, polity:ussr, polity:prc, polity:cuba]
  - id: cal.1963-02-15.china-leadership
    when: Feb. 15
    date: '1963-02-15'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Qinzheng Hall, afternoon. Mao gives a banquet for Prince Norodom Sihanouk, Cambodia''s chief of state; Liu Shaoqi, Peng Zhen and He Long present. Glad that Cambodia has found its footing in Southeast Asia and grows in economy, politics and culture; kingdoms (Nepal, Afghanistan) are friendly with China and some presidencies are not: the matter is substance, not form. He warns Sihanouk to guard against subversion and assassination.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 15, 1963. Made public: 2013. Names: Mao Zedong, Norodom Sihanouk, Liu Shaoqi, Peng Zhen, He Long.'
    tags: [polity:prc, polity:cambodia, name:mao-zedong, name:norodom-sihanouk, name:liu-shaoqi, name:peng-zhen, name:he-long, vis:only:prc+cambodia]
