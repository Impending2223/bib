  - id: cal.1963-02-23.china-leadership-2
    when: Feb. 23
    date: '1963-02-23'
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: After the meeting Mao receives Chervonenko, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng and Wu Xiuquan. Welcomes the letter, a consulting, equal tone; what he dislikes is Khrushchev's call at the East German congress to stop the polemics while himself polemicizing; 43 parties attack China in public; China will reply to the French, then the Italian and American communists, and then stop. Proposes talks, Khrushchev to stop in Peking on his way to or from Cambodia, or a Chinese delegation to Moscow; the 1957 manner (the two parties first agree, then submit to the conference) better than 1960's. "The sky will not fall." He does not now plan to go to Moscow.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 23, 1963 ("同日"). [[w.zhou-enlai-nianpu-1949]], II, 535 (Feb. 23, 1963: Zhou Enlai is with Mao in receiving Chervonenko; Mao: abuse back and forth should have a pause, so he favors a truce, and the first proposal against public polemics was Zhou''s at the CPSU 22nd Congress); [[w.zhou-enlai-waijiao-huodong]], 353 (Feb. 23, 1963; 陪同毛泽东主席接见苏联驻华大使契尔沃年科); [[w.lengxi-shinian-lunzhan-1956-1966]], 543–550 (from 8 p.m. to past 10 p.m., in Mao''s bedroom, Mao in pajamas, Mao doing most of the talking, Liu Shaoqi and Zhou Enlai interjecting, Chervonenko listening and offering no view; six points: the letter, read that day, good in tone and welcome, but words and deeds at odds, Khrushchev having called at the East German congress for a halt while himself attacking; the *Renmin ribao* printing the Soviet pieces since Feb. 20; 43 parties abuse China; China will reply in part and keep the rest in reserve; a pause is welcome, China having proposed it first, through Zhou Enlai, at the Twenty-second Congress; the open polemic no worse than "the sky falling"; talks at Peking, before or after Khrushchev passes through for Cambodia, or a Chinese delegation to Moscow, not Mao to Moscow; the 1957 manner better than the 1960; the formal reply within two weeks); [[w.macfarquhar-origins-of-the-cultural]], III, 350 (the Soviet ambassador gives Mao the CPSU letter on Feb. 23; Mao suggests Khrushchev come to Beijing, on his way to Cambodia); [[w.deng-xiaoping-nianpu-1904]], III, 1748 (Feb. 23, 1963; after the meeting, 会后; Deng with Liu Shaoqi, Zhou Enlai, Kang Sheng and Wu Xiuquan accompanies Mao in receiving Chervonenko); [[w.mao-zedong-zhuan]], V, ch. 71 (that evening, after the Standing Committee: Mao receives Chervonenko with Liu, Zhou, Deng, Kang Sheng and Wu Xiuquan, in his bedroom at Juxiang Shuwu, having a cold; welcomes the letter; asks who attacked first; 43 parties; says the 1957 method better; "the sky will not fall"). Made public: 1993. To check: the CPSU letter of Feb. 21, 1963; the Soviet record of the talk; [[w.floyd-mao-against-khrushchev]], 371–4, 392 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 350 n.9a); Mao Zedong 毛泽东, talk with Chervonenko 契尔沃年科, Peking 北京, Feb. 23, 1963 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.12). See [[cal.1963-02-23.china-leadership]]. Names: Mao Zedong, Chervonenko, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng, Khrushchev, Wu Xiuquan.'
