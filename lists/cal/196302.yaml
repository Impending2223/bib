    thread: china-leadership
    also: [soviet-union, cuba]
    c: 'Mao revises Chen Boda''s Feb. 3 article on Togliatti, retitling it "More on the differences between Comrade Togliatti and us: some great questions of Leninism today," and asking that the introduction recall the Dec. 31 article and say why another. He also recommends to Chen a piece from *Neibu cankao* on Cuba''s view of the Soviet–Cuban differences: "Cuba''s view is right; worth reading." Cuba holds the main contradiction to be between imperialism and the colonial revolutions, not between socialism and capitalism; that conflict is chiefly in the lands now seeking liberation; against imperialism no yielding.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 6, 1963. [[w.lengxi-shinian-lunzhan-1956-1966]], 527–530 (Wu: the *Hongqi* article (nos. 3–4 of 1963), "More on the differences between Comrade Togliatti and us: some great questions of Leninism today" (Mao''s final title), of 110,000 characters in eight parts; Mao took great interest in it, gave many opinions through February and made many important changes himself; it opens with the "third great debate" in the history of Marxism, and argues from the main contradictions of the age, war and peace, state and revolution, and the two-front struggle); [[w.jianguo-yilai-mao-zedong]], XVI, 477, 482–484 (Feb. 6, 1963; items 1–4: the new title and the note on the introduction, on Chen Boda''s first draft of Feb. 3; the note of Feb. 6 "to Chen Boda: Cuba''s view is right, worth a look," on the *Neibu cankao* no. 431 of Jan. 31 item on a *Polityka* (1962 no. 52) Havana report; and "this too is worth a look," on that issue''s report of de Gaulle''s proposal to Khrushchev to "reorganize Europe"; printed from the manuscript; notes 1, 4, 5); [[w.mao-zedong-zhuan]], V, ch. 71 (the first three parts sent to Mao Feb. 3; Mao retitles the article and orders mention of the Dec. 31, 1962 editorial). Made public: 1999. To check: the Polish periodical''s article, as reported in *Neibu cankao*; Neibu cankao no. 431, Jan. 31, 1963, "The Polish party journal on the Cubans'' view of the Soviet–Cuban differences" (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 482 n.1a); Neibu cankao no. 431, Jan. 31, 1963, "British paper reports de Gaulle proposed to Khrushchev a ''general reorganization of Europe''" (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 484 n.5). Names: Mao Zedong, Chen Boda, Togliatti.'
