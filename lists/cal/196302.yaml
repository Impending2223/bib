    when: Feb. 4
    date: '1963-02-04'
    thread: congress
    c: 'Foreign Relations opens hearings on the nondiplomatic agents of foreign principals: Ball and Chayes of State.'
    n: 'Daily Digest, [109 Cong. Rec. D25](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=23). [[w.woods-fulbright]], 309 (the hearings, in full swing by April; both parties and the administration ask Fulbright to relent). To check: Fulbright to Marcy, Jan. 25, 1963, Marcy Papers, box 4 (cited by [[w.woods-fulbright]], 309 n.12). See [[cal.1962-06-27.congress]]. Names: Ball, Chayes.'
