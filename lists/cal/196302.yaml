  - id: cal.1963-02-25.china-leadership
    when: Feb. 25
    date: '1963-02-25'
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: 'The Great Hall, afternoon. Mao at the Work Conference''s plenary, to which Liu Shaoqi reports on the struggle against modern revisionism: its course, the nature of the dispute, the outlook, and China''s line. To Liu''s "the fight touches the fate of revolutions and of mankind," Mao: "and of our country." To "unite and struggle; struggle to unite": Khrushchev does the same, and after a round writes asking for a meeting. And: "some concessions will still be made, as at the Moscow Declaration and Statement."'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 25, 1963. [[w.lengxi-shinian-lunzhan-1956-1966]], 532–537 (Wu''s account of the conference''s discussion of the struggle against revisionism, speakers named only as "everyone" and "leading comrades of the Center": the wave against China has five features (Khrushchev, hurt by the Indian border war and Cuba, turns it on China; it is open but leaves room; his "majority" fails, 20, 30, 40 parties at five congresses, fewer than in 1960; the left parties speak; the split question is raised); the struggle defends Marxism–Leninism and will be long; the line: principle against revisionism, unity against splitting, revolution against surrender, peace against imperialism, "unite and struggle, struggle to unite," no concession on principle or sovereignty, China never to split first; 42 parties now attack China (535)); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 572 (Feb. 25, 1963; Liu reports at the Central Work Conference on the struggle against modern revisionism: the course of its development, the character of the struggle, its prospects and line; after Liu revised it, it was issued Apr. 2 as an internal document); [[w.yang-shangkun-riji]], II, 256 (Feb. 25, 1963; the plenary, 4:30 to 7:30 p.m., Mao presiding: Liu Shaoqi''s report "On the struggle against revisionism," three hours; Yang there); [[w.mao-zedong-zhuan]], V, ch. 71 (Mao presides over the Work Conference as Liu Shaoqi gives his long report on the struggle against modern revisionism and breaks in repeatedly: on the Soviet letter''s changed tone, on a long split being impossible, "and of our country," on not fearing a split, and on socialist education in the villages (n.13)). Made public: 1996. Check: the report: Wu (532–537) gives the conference''s discussion of the struggle against revisionism, in these matters, without naming Liu Shaoqi as speaker; Deng Xiaoping is named as speaking on it at the conference. To check: Liu''s report, "On the struggle against modern revisionism," and Mao''s mid-March notes on Stalin in it; Liu Shaoqi 刘少奇, report on the struggle against modern revisionism, Central Work Conference 中央工作会议, Feb. 25, 1963 (record 报告记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.13). See [[cal.1963-02-23.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Khrushchev.'
