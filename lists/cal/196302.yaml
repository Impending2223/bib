  - id: cal.1963-02-01.legislatures-fl
    when: Feb. 1
    date: '1963-02-01'
    thread: legislatures
    also: [state-constitutions]
    c: 'Florida''s legislature, in special session, passes S.B. 10-X: 43 senators, 112 representatives, two senators for Dade. The amendment proposed in August, 46 and 135, had been rejected at the polls, Nov. 6. Bryant signs, Feb. 4; the three-judge court upholds the act, Feb. 7.'
    n: '*Sobel v. Adams*, [214 F. Supp. 811](https://static.case.law/f-supp/214/case-pdfs/0811-01.pdf) (S.D. Fla. 1963). See [[cal.1962-07-23.legislatures-fl]]. Names: Bryant.'
    tags: [name:bryant-farris, state:fl, city:miami]
  - id: cal.1963-02-01.vietnam
    when: Feb. 1
    date: '1963-02-01'
    thread: vietnam
    c: 'Meeting on Vietnam, 4:30 p.m., recorded: Kennedy with Rusk, McNamara, Taylor, McCone, Harriman, Gilpatric, the Bundys, Forrestal and Bell; Wheeler back from Saigon. Wheeler: reasonable prospects; neither pull out nor send large forces; the present support to go on.'
    n: '[Meeting on Vietnam, 4:30 p.m.](https://prde.upress.virginia.edu/conversations/8060022), Tape 71.1 (PRDE only). [[w.selverstone-kennedy-withdrawal]], 101–02 (Wheeler''s report and its review with Kennedy). Check: the recording not heard. [FRUS 1961–63, III, doc. 27](https://history.state.gov/historicaldocuments/frus1961-63v03/d27) (Forrestal''s questions for the meeting: a new ambassador?). [[w.preston-war-council]], 117. See [[cal.1963-01-25.vietnam]]. Names: Kennedy, Rusk, McNamara, Taylor, McCone, Harriman, Gilpatric, McGeorge Bundy, William Bundy, Forrestal, Bell, Wheeler.'
    src:
      c: c6706678
      rows:
        - 'https://prde.upress.virginia.edu/conversations/8060022: A'
        - 'w.selverstone-kennedy-withdrawal 101–02: all'
        - 'via w.selverstone-kennedy-withdrawal 102 n.20: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d27: A-B'
        - 'w.preston-war-council 117: A-B'
        - 'via w.preston-war-council 117 n.45: A-B'
    tags: [name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:mccone-john-a, name:harriman-w-averell, name:gilpatric-roswell-l, name:bundy-mcgeorge, name:bundy-william, name:forrestal-michael-v, name:bell-david-e, name:wheeler-earle]
  - id: cal.1963-02-01.civil-rights-organizations
    when: Feb. 1
    date: '1963-02-01'
    thread: civil-rights-organizations
    also: [mississippi]
    c: 'SNCC''s first large fund-raiser, Carnegie Hall, Belafonte and the Albany Freedom Singers: the appeal for food for Leflore and Sunflower counties, where the surplus food has been cut off, some 22,000 in Leflore without relief. Days later Dick Gregory pays for a charter plane of seven tons of food.'
    n: '[[w.branch-parting-the-waters]], 713–14. To check: [[w.forman-making-of-black-revolutionaries]], 293 (cited by [[w.branch-parting-the-waters]], 713 n.2); Atlanta Daily World, Feb. 6, 1963, 2 (Gregory); Newsweek, Mar. 1, 1963, 30–31 (cited by [[w.branch-parting-the-waters]], 714 n.1). Check: the day of Gregory''s flight. Names: Gregory.'
    src:
      c: d7861711
      rows:
        - 'w.branch-parting-the-waters 713–14: all'
        - 'via w.branch-parting-the-waters 713 n.2b: B'
    tags: [name:gregory-dick, city:nyc]
