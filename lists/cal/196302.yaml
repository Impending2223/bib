    n: '[[w.perlstein-before-the-storm]], 190–91; [[w.goldberg-barry-goldwater]], 169 (Feb. 5, rejected again). [[w.white-suite-3505]], 120–22. See [[cal.1961-10-08.goldwater]]. Names: White, Goldwater.'
