    n: '[[w.branch-parting-the-waters]], 694–95. To check: FBI wiretap, Levison, Feb. 5, 1963, 2:12 p.m., FBI New York file 100-111180 (cited by [[w.branch-parting-the-waters]], 694 n.5); Baldrige to King, Feb. 5, 1963; King to the Kennedys, Feb. 6, 1963, King Papers, box 14 (cited by [[w.branch-parting-the-waters]], 695 nn.1–2); Shad Polier''s report to the American Jewish Congress, Jan. 15, 1963 (cited by [[w.branch-parting-the-waters]], 694 n.3). See [[cal.1963-02-12.civil-rights-the-executive]]. Names: Martin Luther King, Levison, Baldrige.'
