  - id: cal.1963-02-13.china-leadership
    when: Feb. 13
    date: '1963-02-13'
    thread: china-leadership
    c: 'Zhou Enlai at the Central Committee''s work conference, report on grain and streamlining. In 1962 grain output rose over 20 billion jin, the central point of the better situation; streamlining let sales fall; both to be consolidated. Grain and main farm products in 1963 are bought by the Center''s rules. On streamlining and wages: look to the next five and ten years for placing population and labor; the slogan is to face the countryside, farming, forestry, herding, fisheries; thrift, streamlining, control of the city population and family planning are long-term aims.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 533 (Feb. 13, 1963); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 571 (Feb. 13, 1963; Liu presides at the Central Work Conference session of Feb. 13); [[w.yang-shangkun-riji]], II, 252 (Feb. 13, 1963; the plenary, 5 to 7 p.m.: Zhou''s report on grain and streamlining; Yang there). Made public: 1996. To check: the report. Names: Zhou Enlai.'
