    n: '[FRUS 1961–63, XIII, doc. 69](https://history.state.gov/historicaldocuments/frus1961-63v13/d69). [[w.gavin-gold-dollars-and-power]], 95–96. See [[cal.1963-01-25.europe-and-the-alliance]]. Names: Acheson, Kennedy.'
