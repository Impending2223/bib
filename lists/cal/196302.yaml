  - id: cal.1963-02-01.vietnam
    when: Feb. 1
    date: '1963-02-01'
    time: 1963-02-01T21:30Z
    place: washington
    thread: vietnam
    c: 'Meeting on Vietnam, 4:30 p.m., recorded: Kennedy with Rusk, McNamara, Taylor, McCone, Harriman, Gilpatric, the Bundys, Forrestal and Bell; Wheeler back from Saigon. Wheeler: reasonable prospects; neither pull out nor send large forces; the present support to go on.'
    n: '[Meeting on Vietnam, 4:30 p.m.](https://prde.upress.virginia.edu/conversations/8060022), Tape 71.1 (PRDE only). [[w.selverstone-kennedy-withdrawal]], 101–02 (Wheeler''s report and its review with Kennedy); [[w.taylor-swords-and-plowshares]], 288–89 (Wheeler''s report of January: advisers over 3,000, some 300 aircraft, the Vietnamese forces to 385,000; support at present levels). Check: the recording not heard. [FRUS 1961–63, III, doc. 27](https://history.state.gov/historicaldocuments/frus1961-63v03/d27) (Forrestal''s questions for the meeting: a new ambassador?). [[w.preston-war-council]], 117. See [[cal.1963-01-25.vietnam]]. Names: Kennedy, Rusk, McNamara, Taylor, McCone, Harriman, Gilpatric, McGeorge Bundy, William Bundy, Forrestal, Bell, Wheeler.'
    src:
      c: c6706678
      rows:
        - 'https://prde.upress.virginia.edu/conversations/8060022: A'
        - 'w.selverstone-kennedy-withdrawal 101–02: all'
        - 'via w.selverstone-kennedy-withdrawal 102 n.20: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d27: A-B'
        - 'w.preston-war-council 117: A-B'
        - 'via w.preston-war-council 117 n.45: A-B'
        - 'w.taylor-swords-and-plowshares 288–89: B-C, E'
    tags: [name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:mccone-john-a, name:harriman-w-averell, name:gilpatric-roswell-l, name:bundy-mcgeorge, name:bundy-william, name:forrestal-michael-v, name:bell-david-e, name:wheeler-earle]
