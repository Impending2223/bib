    date: '1963-02-23'
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: 'Juxiang Shuwu, evening. Mao presides at the Standing Committee, on the letter of Feb. 21 from the Soviet Central Committee, brought by Ambassador Chervonenko on Feb. 22: end the public polemics, call an international conference, and first hold bilateral talks to prepare it. Mao: "no time to lose; I will see Chervonenko at once."'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 23, 1963. [[w.lengxi-shinian-lunzhan-1956-1966]], 543 (the Standing Committee in Mao''s bedroom at the Juxiang Shuwu, Mao in pajamas, half sitting against the bed, still recovering from a cold taken on coming back from his two months away; he, Liu Shaoqi, Zhou Enlai and Deng Xiaoping agree that the CPSU''s proposals are what China proposed in Apr. 1962, accepted now as the CPSU''s own, and take them up, though it may be a delaying move; the others leave; Liu and Zhou stay to receive the ambassador with Mao); [[w.deng-xiaoping-nianpu-1904]], III, 1748 (Feb. 23, 1963; evening, 晚; Deng at the Politburo Standing Committee meeting Mao presides over, on the CPSU Central Committee''s letter of Feb. 21 (stop open polemic, hold an international conference, first a Sino-Soviet party meeting to prepare it)); [[w.mao-zedong-zhuan]], V, ch. 71 (evening 晚; the Standing Committee studies the Soviet letter, then Mao sends for Chervonenko; the letter delivered at 8 the evening before; who presided and where not given). Made public: 1999. To check: the CPSU letter of Feb. 21, 1963. Names: Mao Zedong, Chervonenko.'
    src:
      c: d78a3e41
      rows:
