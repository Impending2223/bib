    when: Feb. 4
    date: '1963-02-04'
    thread: defense
    also: [transition-and-staff-nsc]
    c: 'The White House staff meeting, by Legere''s memorandum: Bundy "really no logic whatever to ''nuclear policy''"; the planners who count on winning by killing 100 million Russians to 30 million Americans "are living in total dreamland."'
    n: '[FRUS 1961–63, VIII, doc. 127](https://history.state.gov/historicaldocuments/frus1961-63v08/d127) (editorial note). [[w.preston-war-council]], 56. Names: Bundy.'
