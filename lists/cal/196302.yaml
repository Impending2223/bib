  - id: cal.1963-02-21.china-leadership
    when: Feb. 21
    date: '1963-02-21'
    place: peking
    thread: china-leadership
    also: [cuba]
    c: 'Yinian Tang, afternoon. Mao receives Cuba''s government economic delegation; Liu Shaoqi and Ye Jizhuang present. The Cuban people good friends, the Party good, good leaders. Of trade: more in a few years; both poor, with little industry and unworked minerals. China''s anti-imperialist experience is for reference; Cuba is small and near America and yet won, so the world watches.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 21, 1963. [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 269 (Feb. 8–23, 1963; the Cuban government''s trade delegation under Alberto Mora, Minister of Foreign Trade, visits China; Mao, Liu Shaoqi, Zhou, Chen Yi and Li Xiannian receive it, the days not given; the Chinese and Cuban trade delegations hold talks on 1963 trade). Made public: 2001. Names: Mao Zedong, Liu Shaoqi, Ye Jizhuang.'
    src:
      c: 9b58d3fe
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Feb. 21, 1963: all'
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 269: B'
    tags: [polity:prc, polity:cuba, name:mao-zedong, name:liu-shaoqi, vis:only:prc+cuba]
