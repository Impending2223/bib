    tags: [name:bundy-mcgeorge]
  - id: cal.1963-02-04.vietnam
    when: Feb. 4
    date: '1963-02-04'
    thread: vietnam-saigon
    c: 'Forrestal to Kennedy: the meeting with Wheeler on Friday "a complete waste of your time for which I apologize"; his "rosy euphoria" made it unworkable. A quiet campaign, Harriman''s and his, "to develop gradually a more independent posture for the U.S. in South Vietnam."'
    n: '[FRUS 1961–63, III, doc. 29](https://history.state.gov/historicaldocuments/frus1961-63v03/d29). [[w.preston-war-council]], 117. See [[cal.1963-02-01.vietnam]]. Names: Forrestal, Kennedy, Wheeler, Harriman.'
