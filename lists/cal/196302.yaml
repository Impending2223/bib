# Cal. XXXIX February 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXIX
entries:
  - id: cal.1963-02-01.opinion
    when: Feb. 1
    date: '1963-02-01'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, Jan. 11–16: race relations in the South in the coming year, better 44 percent, worse 32. In the South, 36 and 36.'
    n: '[[w.gallup-poll]], III, 1802.'
  - id: cal.1963-02-01.legislatures-fl
    when: Feb. 1
    date: '1963-02-01'
    thread: legislatures
    also: [state-constitutions]
    c: 'Florida''s legislature, in special session, passes S.B. 10-X: 43 senators, 112 representatives, two senators for Dade. The amendment proposed in August, 46 and 135, had been rejected at the polls, Nov. 6. Bryant signs, Feb. 4; the three-judge court upholds the act, Feb. 7.'
    n: '*Sobel v. Adams*, [214 F. Supp. 811](https://static.case.law/f-supp/214/case-pdfs/0811-01.pdf) (S.D. Fla. 1963). See [[cal.1962-07-23.legislatures-fl]]. Names: Bryant.'
    tags: [name:bryant-farris, state:fl, city:miami]
  - id: cal.1963-02-03.opinion
    when: Feb. 3
    date: '1963-02-03'
    thread: opinion
    also: [foreign-aid]
    c: 'Gallup, Jan. 11–16: foreign aid, 58 percent for, 30 against.'
    n: '[[w.gallup-poll]], III, 1802.'
  - id: cal.1963-02-05.program
    when: Feb. 5
    date: '1963-02-05'
    thread: health
    c: 'Message on mental illness and mental retardation. "A bold new approach": community mental health centers, federal grants to build and staff them. About 530,000 in State mental hospitals; custodial patients to be cut by half or more in a decade or two.'
    n: 'Special Message to the Congress on Mental Illness and Mental Retardation, [1963 Pub. Papers 126](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=184); Remarks on Proposed Measures To Combat Mental Illness and Mental Retardation, [1963 Pub. Papers 137](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=195) (Feb. 5, 1963). To check: [[w.grob-from-asylum-to-community]]; [[w.shorter-kennedy-family-and-the]]; [[w.grob-dilemma-of-federal-mental]]; [[w.mcnamara-eunice]]; [[w.foley-community-mental-health-legislation]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-02-05.mississippi-ms
    when: Feb. 5
    date: '1963-02-05'
    thread: mississippi
    also: [legislatures, state-constitutions]
    c: 'Mississippi ratifies the reapportionment amendment of the legislature''s second extraordinary session of 1962, Sections 254 and 255: a House of 122, a Senate of 52. Check: the vote.'
    n: '*Connor v. Johnson*, [256 F. Supp. 962](https://static.case.law/f-supp/256/case-pdfs/0962-01.pdf), 965 (S.D. Miss. 1966) (General Laws of Mississippi, Second Extraordinary Session 1962, ch. 57; proclaimed Feb. 13, 1963). To check: [[w.parker-black-votes-count]]. See [[cal.1962-03-26.court]].'
    tags: [state:ms]
  - id: cal.1963-02-05.european-community
    when: Feb. 5
    date: '1963-02-05'
    thread: european-community
    c: 'Luxembourg. The Court of Justice of the European Communities, Van Gend en Loos, on a reference from the Dutch Tariefcommissie: Article 12 of the EEC Treaty, the bar on new customs duties among the Six, gives individuals rights their national courts must protect. The Community "a new legal order of international law," for which the states have limited their sovereign rights.'
    n: '[Case 26/62, NV Algemene Transport- en Expeditie Onderneming van Gend & Loos v. Nederlandse Administratie der Belastingen, 1963 E.C.R. 1](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:61962CJ0026). To check: [[w.weiler-transformation-of-europe]]; [[w.alter-establishing-the-supremacy-of]].'
  - id: cal.1963-02-06.missile-crisis
    when: Feb. 6
    date: '1963-02-06'
    thread: missile-crisis
    c: 'McNamara on television with the reconnaissance photographs: no offensive weapons left in Cuba. Keating has said otherwise. Feb. 7, press conference: 4,500 Soviet personnel gone, four combat groups of about 6,000 men left. "We cannot prove that there is not a missile in a cave."'
    n: 'The President''s News Conference, [1963 Pub. Papers 148](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=206) (Feb. 7, 1963). To check: [[w.coleman-fourteenth-day]]. See [[cal.1963-01-07.missile-crisis]]. Names: McNamara, Keating.'
    tags: [name:mcnamara-robert-s, name:keating-kenneth-b, name:kennedy-john-f]
  - id: cal.1963-02-06.economy
    when: Feb. 6
    date: '1963-02-06'
    thread: economy
    c: Ways and Means opens hearings on the tax message, Dillon first. They run to Mar. 27.
    n: 'Daily Digest, [109 Cong. Rec. D31](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=29) (Feb. 6, 1963). *President''s 1963 Tax Message: Hearings Before the H. Comm. on Ways and Means*, 88th Cong. (1963), 7 pts. See [[cal.1963-01-24.economy]]. Names: Dillon, Mills.'
    tags: [name:dillon-c-douglas, name:mills-wilbur-d]
  - id: cal.1963-02-06.middle-east-johnson-plan
    when: Feb. 6
    date: '1963-02-06'
    thread: middle-east-johnson-plan
    c: 'Kennedy thanks Joseph Johnson, Feldman, Komer and Grant present. Johnson: the Johnson Plan dead, its principles valid. The refugees'' will expressed; some repatriation, fewer than one in ten to stay in Israel; acquiescence, not formal agreement; slow movement, both sides at once.'
    n: 'FRUS 1961–63, XVIII, doc. [150](https://history.state.gov/historicaldocuments/frus1961-63v18/d150). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Kennedy, Johnson, Feldman, Komer, Grant.'
    tags: [name:kennedy-john-f, name:johnson-joseph-e, name:feldman-myer, name:komer-robert-w, name:grant-james-p]
  - id: cal.1963-02-07.rules
    when: Feb. 7
    date: '1963-02-07'
    thread: rules
    c: Cloture on the motion to take up the three-fifths rule fails, [54–42](https://voteview.com/rollcall/RS0880003), short of two-thirds. Mansfield moves to adjourn, [64–33](https://voteview.com/rollcall/RS0880004); the motion dies. Rule XXII stands.
    n: '[109 Cong. Rec., Senate, Feb. 7, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt2/pdf/GPO-CRECB-1963-pt2-5-2.pdf). Senate cloture table, 88th Cong. ([senate.gov](https://www.senate.gov/legislative/cloture/88.htm)). See [[cal.1963-01-14.rules]]. Names: Mansfield.'
    tags: [name:mansfield-mike]
  - id: cal.1963-02-08.opinion
    when: Feb. 8
    date: '1963-02-08'
    thread: opinion
    also: [europe-and-the-alliance, european-community]
    c: Gallup's French and Dutch affiliates, after the veto, no field dates given. In France, de Gaulle's policy toward Britain, 40 percent approve, 21 disapprove. In the Netherlands, British entry, 66 for, 3 against; a Common Market with Britain and without France, 52, against 10 for the reverse.
    n: '[[w.gallup-poll]], III, 1803. Names: de Gaulle.'
    tags: [name:de-gaulle-charles]
  - id: cal.1963-02-08.middle-east
    when: Feb. 8
    date: '1963-02-08'
    thread: middle-east
    c: Iraq. Army officers and the Ba'th seize Baghdad; Qassim killed. Abdul Salam Arif President.
    n: '[FRUS 1961–63, XVIII, doc. 154](https://history.state.gov/historicaldocuments/frus1961-63v18/d154) (Rusk to Kennedy, Feb. 9). To check: [[w.batatu-old-social-classes-and]]; [[w.tripp-history-of-iraq]]; [[w.matthews-kennedy-administration-counterinsurgency-and]]; [[w.gibson-sold-out]]. See [[cal.1961-12-11.middle-east]]. Names: Qassim, Arif.'
    tags: [name:qassim-abdul-karim, name:arif-abdul-salam-muhammad]
  - id: cal.1963-02-10.opinion
    when: Feb. 10
    date: '1963-02-10'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Jan. 11–16: federal school aid to public schools only, 44 percent; to Catholic and other private schools as well, 49. Protestants 50 to 42 for public schools only; Catholics 71 for private schools too.'
    n: '[[w.gallup-poll]], III, 1804.'
  - id: cal.1963-02-11.middle-east
    when: Feb. 11
    date: '1963-02-11'
    thread: middle-east
    c: The United States recognizes the new regime in Iraq.
    n: 'Department statement, press release 72, Feb. 11: [[w.department-of-state-bulletin]], [Mar. 4, 1963, 316](https://archive.org/details/departmentofstat481963unit/page/316/mode/1up). See [[cal.1963-02-08.middle-east]].'
  - id: cal.1963-02-12.civil-rights-the-executive
    when: Feb. 12
    date: '1963-02-12'
    thread: civil-rights-the-executive
    c: Lincoln's Birthday. The Civil Rights Commission presents *Freedom to the Free*, its report on the century since emancipation.
    n: 'Remarks Upon Receiving Civil Rights Commission Report "Freedom to the Free", [1963 Pub. Papers 159](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=217) (Feb. 12, 1963). To check: [[w.rights-freedom-to-the-free]]; [[w.brauer-john-f-kennedy-and]]; [[w.dulles-civil-rights-commission-1957]]. See [[cal.1962-11-20.civil-rights-the-executive]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-02-13.opinion
    when: Feb. 13
    date: '1963-02-13'
    thread: opinion
    also: [school-aid, desegregation-schools]
    c: 'Gallup, Jan. 11–16: federal school aid to all public schools, 72 percent; withheld from schools that fail to integrate, 21.'
    n: '[[w.gallup-poll]], III, 1804.'
  - id: cal.1963-02-14.program
    when: Feb. 14
    date: '1963-02-14'
    thread: jobs-and-wages
    c: Message on the nation's youth. A Youth Conservation Corps, 15,000 to start; half the wages of 40,000 in local public-service jobs; a National Service Corps of volunteers; the delinquency act extended three years. 700,000 young people out of school and out of work.
    n: 'Special Message to the Congress on the Nation''s Youth, [1963 Pub. Papers 164](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=222) (Feb. 14, 1963). To check: [[w.sundquist-politics-and-policy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-02-15.opinion-5
    when: Feb. 15
    date: '1963-02-15'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Feb. 7–12: Republicans'' choice for 1964: Rockefeller 49, Goldwater 17, Romney 13, Scranton 8, Hatfield 2; no preference 11. Independents: Rockefeller 50, Romney 15, Goldwater 13.'
    n: '[[w.gallup-poll]], III, 1805. Names: Nelson Rockefeller, Romney, Scranton, Goldwater, Hatfield.'
    tags: [name:rockefeller-nelson, name:goldwater-barry-m, name:romney-george-w, name:scranton-william-w, name:hatfield-mark-o]
  - id: cal.1963-02-18.missile-crisis
    when: Feb. 18
    date: '1963-02-18'
    thread: missile-crisis
    c: 'Soviet aide-mémoire, through Dobrynin: several thousand men to leave Cuba before the middle of March. Made public Feb. 19. Feb. 21, press conference: the withdrawals to be watched over three weeks.'
    n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 617](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d617). The President''s News Conference, [1963 Pub. Papers 201](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=259) (Feb. 21, 1963). See [[cal.1963-01-07.missile-crisis]]. Names: Dobrynin.'
    tags: [name:dobrynin-anatoly, name:kennedy-john-f]
  - id: cal.1963-02-18.japan-and-korea
    when: Feb. 18
    date: '1963-02-18'
    thread: japan-and-korea-civilian-rule
    c: 'Park offers to stay out of the presidential race: the junta''s men spared reprisal, most of the purged politicians cleared, the election put off. Berger, instructed, tells him Washington thinks it the best hope.'
    n: 'FRUS 1961–63, XXII, docs. [289](https://history.state.gov/historicaldocuments/frus1961-63v22/d289), [290](https://history.state.gov/historicaldocuments/frus1961-63v22/d290) (Berger''s instructions, Feb. 14), [291](https://history.state.gov/historicaldocuments/frus1961-63v22/d291), [292](https://history.state.gov/historicaldocuments/frus1961-63v22/d292). To check: [[w.brazinsky-nation-building-in-south]]; [[w.kim-koreas-development-under-park]]. See [[cal.1961-08-12.japan-and-korea]]. Names: Park, Berger.'
    tags: [name:park-chung-hee, name:berger-samuel-d]
  - id: cal.1963-02-18.transportation
    when: Feb. 18
    date: '1963-02-18'
    thread: transportation
    also: [cities-and-housing]
    c: 'Urban Mass Transportation bill sent to Congress: long-range aid to cities for transit, rail or bus, the cities to choose their own balance of highways and transit. Last year''s bill reported in both Houses, never voted on. Language protecting transit workers to follow.'
    n: 'Letter to the President of the Senate and to the Speaker of the House Transmitting a Proposed Urban Mass Transportation Act, [1963 Pub. Papers 183](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=241) (Feb. 18, 1963). To check: [[w.smerk-urban-transportation]]; [[w.gelfand-nation-of-cities]]. See [[cal.1962-01-11.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-02-19.program
    when: Feb. 19
    date: '1963-02-19'
    thread: women
    c: Friedan's *The Feminine Mystique* published.
    n: 'To check: [[w.friedan-feminine-mystique]]; [[w.horowitz-betty-friedan-and-the]]; [[w.coontz-strange-stirring]]; [[w.friedan-life-so-far]]; [[w.shteir-betty-friedan]]; [[w.harrison-on-account-of-sex]]. See [[cal.1961-12-14.program]]. Names: Friedan.'
    tags: [name:friedan-betty]
  - id: cal.1963-02-19.congress
    when: Feb. 19
    date: '1963-02-19'
    thread: congress
    also: [rules]
    c: 'Clark''s first of three speeches on the Senate establishment: a conservative bloc holds the committees.'
    n: '[109 Cong. Rec., Senate, Feb. 19, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt2/pdf/GPO-CRECB-1963-pt2-9-1.pdf). Check: the days of the second and third. To check: [[w.clark-senate-establishment]]; [[w.matthews-u-s-senators-and]]; [[w.white-citadel]]; [[w.foley-new-senate]]; [[w.sinclair-transformation-of-the-u]]. See [[cal.1963-01-09.congress]]. Names: Clark.'
    tags: [name:clark-joseph-s]
  - id: cal.1963-02-20.africa
    when: Feb. 20
    date: '1963-02-20'
    thread: africa
    c: 'NSAM 221: Kennedy approves Rusk''s plan of action for Algeria. France to carry the main burden; he would hear of any need to exceed the $15 million AID level for fiscal 1964; the Peace Corps to answer Ben Bella''s request if it can.'
    n: 'FRUS 1961–63, XXI, docs. [81](https://history.state.gov/historicaldocuments/frus1961-63v21/d81), [83](https://history.state.gov/historicaldocuments/frus1961-63v21/d83). See [[cal.1962-12-14.africa]]. Names: Rusk, Ben Bella.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:ben-bella-ahmed]
  - id: cal.1963-02-21.medicare
    when: Feb. 21
    date: '1963-02-21'
    thread: medicare
    c: 'Message on senior citizens. Hospital insurance through Social Security again: 45 days without a deductible, 90 with up to $90, or 180 with more. The payroll tax up a quarter point; the wage base to $5,200.'
    n: 'Special Message to the Congress on the Needs of the Nation''s Senior Citizens, [1963 Pub. Papers 188](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=246) (Feb. 21, 1963). To check: [[w.marmor-politics-of-medicare]]; [[w.harris-sacred-trust]]; [[w.corning-evolution-of-medicare]]; [[w.david-with-dignity]]; [[w.zelizer-taxing-america]]; [[w.berkowitz-mr-social-security]]. See [[cal.1961-02-09.medicare]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-02-24.vietnam
    when: Feb. 24
    date: '1963-02-24'
    thread: vietnam
    c: 'Mansfield''s report published, with Boggs, Pell, and Smith: the war becoming an American war; a reassessment of American security needs on the mainland asked. A committee print, Feb. 25.'
    n: '[FRUS 1961–63, III, doc. 42](https://history.state.gov/historicaldocuments/frus1961-63v03/d42). [[w.miller-misalliance]], 254; [[w.gibbons-u-s-government-and]], II, 133. To check: [[w.al-vietnam-and-southeast-asia]]; [[w.oberdorfer-senator-mansfield-2003]]; [[w.olson-mansfield-and-vietnam]]. See [[cal.1962-12-26.vietnam]]. Names: Mansfield, Boggs, Pell, Smith.'
    tags: [name:mansfield-mike, name:boggs-james-c, name:pell-claiborne-d, name:smith-benjamin-a-ii]
  - id: cal.1963-02-24.opinion
    when: Feb. 24
    date: '1963-02-24'
    thread: opinion
    also: [missile-crisis, cuba]
    c: 'Gallup, Feb. 7–12: the administration''s handling of Cuba in recent weeks, 56 percent satisfied, 28 dissatisfied. Republicans 36 satisfied, 48 dissatisfied.'
    n: '[[w.gallup-poll]], III, 1806.'
  - id: cal.1963-02-25.court
    when: Feb. 25
    date: '1963-02-25'
    thread: court
    also: [south-carolina]
    c: '*Edwards v. South Carolina*, [372 U.S. 229](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372229/usrep372229.pdf). Breach-of-peace convictions of 187 Black students who marched on the State House grounds at Columbia reversed, 8–1. Stewart for the Court; Clark dissents.'
    n: 'To check: [[w.kalven-negro-and-the-first]]; [[w.powe-warren-court-and-american]]. See [[cal.1961-12-11.court]].'
  - id: cal.1963-02-25.congress
    when: Feb. 25
    date: '1963-02-25'
    thread: congress
    also: [rules]
    c: Clark's amendments to enlarge Finance and Appropriations lose, [17–68](https://voteview.com/rollcall/RS0880005) and [12–70](https://voteview.com/rollcall/RS0880006).
    n: '[109 Cong. Rec., Senate, Feb. 25, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt3/pdf/GPO-CRECB-1963-pt3-2-1.pdf). See [[cal.1963-02-19.congress]]. Names: Clark.'
    tags: [name:clark-joseph-s]
  - id: cal.1963-02-26.defense
    when: Feb. 26
    date: '1963-02-26'
    thread: defense
    c: 'McClellan''s Permanent Subcommittee on Investigations opens hearings on the TFX: General Dynamics chosen, Nov. 24, 1962, over Boeing, the military evaluators'' choice. Jackson asked for the inquiry. Mar. 21, press conference: "Mr. McNamara was right."'
    n: '*TFX Contract Investigation: Hearings Before the Permanent Subcomm. on Investigations of the S. Comm. on Government Operations* (K–J Cong. II.J.3). The President''s News Conference, [1963 Pub. Papers 273](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=331) (Mar. 21, 1963). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 470–471. To check: [[w.art-tfx-decision]]; [[w.coulam-illusions-of-choice]]; [[w.shapley-promise-and-power]]. See [[cal.1961-02-06.defense]]. Names: McClellan, Jackson, McNamara.'
    tags: [name:mcclellan-john-l, name:jackson-henry-m, name:mcnamara-robert-s, name:kennedy-john-f]
  - id: cal.1963-02-27.congress
    when: Feb. 27
    date: '1963-02-27'
    thread: congress
    c: House votes the Un-American Activities Committee $360,000 for 1963, [386–20](https://voteview.com/rollcall/RH0880005).
    n: 'H.R. Res. 249, 88th Cong. [109 Cong. Rec., House, Feb. 27, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt3/pdf/GPO-CRECB-1963-pt3-4-1.pdf). To check: [[w.goodman-committee]]. See [[cal.1963-01-09.congress]].'
  - id: cal.1963-02-27.opinion
    when: Feb. 27
    date: '1963-02-27'
    thread: opinion
    also: [missile-crisis, cuba]
    c: 'Gallup, Feb. 7–12: American forces into Cuba to overthrow Castro, 20 percent agree, 64 disagree. Cuba a serious threat to world peace, 59.'
    n: '[[w.gallup-poll]], III, 1807. Names: Fidel Castro.'
    tags: [name:castro-fidel]
  - id: cal.1963-02-27.japan-and-korea
    when: Feb. 27
    date: '1963-02-27'
    thread: japan-and-korea-civilian-rule
    c: Seoul. The party leaders accept Park's terms. Kim Chong-p'il out of the country since Feb. 25.
    n: '[FRUS 1961–63, XXII, doc. 292](https://history.state.gov/historicaldocuments/frus1961-63v22/d292) (editorial note). See [[cal.1963-02-18.japan-and-korea]]. Names: Park, Kim Chong-p''il.'
    tags: [name:park-chung-hee, name:kim-chong-pil]
  - id: cal.1963-02-28.voting-rights
    when: Feb. 28
    date: '1963-02-28'
    thread: voting-rights
    also: [civil-rights-the-executive]
    c: Civil rights message. Temporary voting referees while suits are pending, where under 15 percent of a race is registered; a sixth-grade education presumed literacy in federal elections; voting suits expedited; the Civil Rights Commission extended at least four years; aid to school districts desegregating.
    n: 'Special Message to the Congress on Civil Rights, [1963 Pub. Papers 221](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=279) (Feb. 28, 1963). To check: [[w.brauer-john-f-kennedy-and]]; [[w.graham-civil-rights-era]]; [[w.stern-calculating-visions]]; [[w.bryant-bystander]]; [[w.lawson-black-ballots]]. See [[cal.1962-05-09.voting-rights]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-02-28.mississippi
    when: Feb. 28
    date: '1963-02-28'
    thread: mississippi
    also: [voting-rights]
    c: Jimmy Travis of SNCC shot on the highway outside Greenwood; Moses beside him unhurt. SNCC and COFO bring their workers to Leflore County.
    n: '[Affidavit of James Travis](https://www.crmvet.org/nars/aff/mbp_jt.htm). [[w.dittmer-local-people]], 143–49. To check: [[w.payne-ive-got-the-light]]; [[w.carson-in-struggle]]; [[w.zinn-sncc]]; [[w.burner-and-gently-he-shall]]. See [[cal.1961-09-25.mississippi]]. Names: Moses, Travis.'
    tags: [name:moses-robert-p, name:travis-james]
