    when: Feb. 15
    date: '1963-02-15'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao revises the introduction of the article on Togliatti (Feb. 15), and on Feb. 16 the introduction and part two, retitling part two "What is the nature of this great debate among the Communists of all countries?"; on Feb. 18 part eight. Added: differences among communists to be settled "by facts and reason," never as a slaveholder treats slaves; unity only on the Moscow Declaration and Statement, on equal consultation and give and take. And of the Soviet party''s refusal to print the Chinese replies: "you are afraid of ghosts"; "a specter, dogmatism, which is truly Marxism–Leninism, haunts the world and threatens you."'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 15, 1963 (the entries for Feb. 15, 16 and 18). [[w.jianguo-yilai-mao-zedong]], XVI, 478–485 (Feb. 15–18, 1963; items 5–13: notes to Chen Boda on the proofs (Feb. 15; 7 a.m. Feb. 16, part two retitled; 7 a.m. the 18th) and the passages he added in Song type; printed from the manuscript and his revised copy; note 1 gives the proofs of Feb. 14, 15, 17 and 18); [[w.mao-zedong-zhuan]], V, ch. 71 (Feb. 14 Chen Boda sends the proofs of Mao''s revised introduction; Mao adds a long passage (n.15); Feb. 17 Chen sends the first draft of part eight, Mao adds a passage, and a day later revises it again, taking the Communist Manifesto''s closing cry as its heading and three slogans as the end (n.16)). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 71). To check: the article as published (the nianpu''s note puts its drafting meetings at Feb. 18–25); Mao Zedong 毛泽东, revision of the draft "More on the differences between Comrade Togliatti and us" 《再论陶里亚蒂同志同我们的分歧》 (introduction; manuscript 手稿), Feb. 1963 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.15); Mao Zedong 毛泽东, revision of the draft "More on the differences between Comrade Togliatti and us" 《再论陶里亚蒂同志同我们的分歧》 (part eight; manuscript 手稿), Feb. 1963 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.16). See [[cal.1963-02-06.china-leadership]]. Names: Mao Zedong, Togliatti.'
    src:
