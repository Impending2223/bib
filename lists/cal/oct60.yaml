# Cal. XI October 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XI
entries:
  - id: cal.1960-10-03.court
    when: Oct. 3–19
    date: '1960-10-03'
    thread: court
    also: [desegregation-public-places, voting-rights]
    c: 'The Court''s October Term 1960 opens. Argued: *Boynton v. Virginia*, Oct. 12, Marshall for a Negro law student arrested in the white restaurant of the Trailways terminal at Richmond; *Gomillion v. Lightfoot*, Oct. 18–19, Fred Gray and Robert L. Carter for Negro voters drawn out of Tuskegee, Ala., by the legislature''s new boundary.'
    n: '*Boynton v. Virginia*, [364 U.S. 454](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364454/usrep364454.pdf); *Gomillion v. Lightfoot*, [364 U.S. 339](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364339/usrep364339.pdf). [[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]]; [[w.greenberg-crusaders-in-the-courts]]; [[w.taper-gomillion-versus-lightfoot]]; [[w.norrell-reaping-the-whirlwind]]. Cases: K–J Cong. II.J.1. Names: Marshall (K–J Cong. III.G); Fred Gray (K–J Cong. III.K); Robert L. Carter (K–J Cong. III.K).'
    tags: [name:marshall-thurgood, name:gray-fred-d, name:carter-robert-l]
  - id: cal.1960-10-07.elections-1960
    when: Oct. 7
    date: '1960-10-07'
    thread: elections-1960
    c: 'Second debate, Washington, at NBC; Frank McGee moderating; questions on any subject. Quemoy and Matsu: Kennedy would draw the line at Formosa and not risk war for islands "not strategically defensible"; Nixon "completely" disagrees.'
    n: '[Presidential Debate in Washington, DC](https://www.presidency.ucsb.edu/documents/presidential-debate-washington-dc) (Oct. 7, 1960). See [[cal.1960-09-26.elections-1960]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E); Frank McGee (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:mcgee-frank]
  - id: cal.1960-10-08.laos
    when: Oct. 8–17
    date: '1960-10-08'
    thread: laos
    c: 'Washington''s course: work with Souvanna Phouma as "the legal facade of legitimate government" while supplying Phoumi at Savannakhet. Parsons, Irwin and Admiral Riley to Laos; with Ambassador Brown they see King Savang Vatthana at Luang Prabang, Oct. 13. Brown and Souvanna, Oct. 17: aid to the south if Phoumi accepts the government''s authority.'
    n: 'FRUS 1958–60, XVI, docs. [421](https://history.state.gov/historicaldocuments/frus1958-60v16/d421), [422](https://history.state.gov/historicaldocuments/frus1958-60v16/d422), [427](https://history.state.gov/historicaldocuments/frus1958-60v16/d427), [429](https://history.state.gov/historicaldocuments/frus1958-60v16/d429), [431](https://history.state.gov/historicaldocuments/frus1958-60v16/d431). See [[cal.1960-08-09.laos]]. Names: Souvanna Phouma, Phoumi Nosavan, Savang Vatthana (Viet. III.I); Parsons, Irwin (Opp. III.E); Riley (K–J Adm. III.F); Brown (K–J Adm. III.E).'
    tags: [name:souvanna-phouma, name:phoumi-nosavan, name:parsons-j-graham, name:irwin-john-n-ii, name:riley-herbert-d, name:brown-winthrop-g, name:savang-vatthana]
  - id: cal.1960-10-10.elections-1960
    when: Oct. 10–13
    date: '1960-10-10'
    thread: elections-1960
    c: Johnson's whistle-stop train, the "LBJ Victory Special," from Culpeper, Va., through the South to New Orleans. Lady Bird Johnson with him.
    n: '[[w.caro-passage-of-power]]; [[w.dallek-lone-star-rising]]; [[w.white-making-of-the-president]]. Check the dates. Names: Johnson (K–J Adm. III.D); Lady Bird Johnson (K–J Adm. III.A).'
    tags: [name:johnson-lyndon-b, name:johnson-lady-bird]
  - id: cal.1960-10-12.soviet-union
    when: Oct. 12–13
    date: '1960-10-12'
    thread: soviet-union
    c: Debate on Khrushchev's item on colonial independence. When the Philippine delegate, Sumulong, speaks of Eastern Europe, Khrushchev bangs a shoe on his desk. He leaves New York Oct. 13.
    n: 'FRUS 1958–60, II, doc. [227](https://history.state.gov/historicaldocuments/frus1958-60v02/d227). See [[cal.1960-09-19.soviet-union]]. Names: Khrushchev (K–J Adm. III.J); Sumulong (K–J Cong. III.K).'
    tags: [name:khrushchev-nikita-s, name:sumulong-lorenzo]
  - id: cal.1960-10-12.elections-1960
    when: Oct. 12
    date: '1960-10-12'
    thread: elections-1960
    also: [civil-rights-the-executive]
    c: Lodge, in East Harlem, promises a Negro in a Nixon cabinet. Nixon says he will appoint the best man, whatever his race.
    n: '[[w.white-making-of-the-president]]; [[w.kallina-kennedy-v-nixon]]; [[w.nichter-last-brahmin]]; [[w.lodge-as-it-was]]. Check the date; no primary record found. Names: Lodge (K–J Adm. III.E); Nixon (Opp. III.E).'
    tags: [name:lodge-henry-cabot, name:nixon-richard-m]
  - id: cal.1960-10-13.elections-1960
    when: Oct. 13
    date: '1960-10-13'
    thread: elections-1960
    c: 'Third debate: Kennedy in New York, Nixon in Los Angeles, on one screen; Bill Shadel of ABC moderating. Quemoy and Matsu again; Nixon resents Kennedy''s "trigger-happy."'
    n: '[Presidential Debate Broadcast from New York and Los Angeles](https://www.presidency.ucsb.edu/documents/presidential-debate-broadcast-from-new-york-and-los-angeles) (Oct. 13, 1960). [Statement by Senator John F. Kennedy on Quemoy-Matsu](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-quemoy-matsu); [Statement by the Vice President on Quemoy and Matsu, Springfield, IL](https://www.presidency.ucsb.edu/documents/statement-the-vice-president-the-united-states-quemoy-and-matsu-springfield-il) (Oct. 15, 1960). See [[cal.1960-09-26.elections-1960]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E); Shadel (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:shadel-bill]
  - id: cal.1960-10-14.peace-corps
    when: Oct. 14
    date: '1960-10-14'
    thread: peace-corps
    also: [elections-1960, students]
    c: Kennedy, at 2 a.m., on the steps of the Michigan Union at Ann Arbor, asks the students how many would give years abroad, as doctors in Ghana, as engineers, in the Foreign Service. Students' petitions follow.
    n: '[Remarks at the University of Michigan](https://www.jfklibrary.org/archives/other-resources/john-f-kennedy-speeches/university-of-michigan-19601014), JFK Library (Check the link). [[w.rice-bold-experiment]]; [[w.hoffman-all-you-need-is]]; [[w.wofford-of-kennedys-and-kings]]. Names: Kennedy (Viet. III.A).'
    tags: [name:kennedy-john-f]
  - id: cal.1960-10-14.vietnam
    when: Oct. 14
    date: '1960-10-14'
    thread: vietnam
    c: 'Durbrow reads Diệm a paper of suggestions, cleared by State Oct. 7: send his brother Nhu and Trần Kim Tuyến abroad; bring opposition men into the cabinet; let the Assembly investigate officials. Diệm: most of it his own ideas, but the Viet Cong make it hard. The same call: MAAG to train the Civil Guard.'
    n: 'FRUS 1958–60, I, docs. [197](https://history.state.gov/historicaldocuments/frus1958-60v01/d197) (Durbrow''s proposal, Sept. 16), [202](https://history.state.gov/historicaldocuments/frus1958-60v01/d202), [203](https://history.state.gov/historicaldocuments/frus1958-60v01/d203), [204](https://history.state.gov/historicaldocuments/frus1958-60v01/d204), [205](https://history.state.gov/historicaldocuments/frus1958-60v01/d205) (the paper). [[w.anderson-trapped-by-success]]; [[w.jacobs-cold-war-mandarin]]; [[w.miller-misalliance]]; [[w.catton-diems-final-failure]]; [[w.spector-united-states-army-in]]. Made public: [[w.def-u-s-viet-rels]], Book 10, 1311–16, 1323–24 (1971). Names: Durbrow (Viet. III.C); Diệm (K–J Adm. III.J); Nhu, Trần Kim Tuyến (Viet. III.G).'
    tags: [name:durbrow-elbridge, name:ngo-dinh-diem, name:ngo-dinh-nhu, name:tran-kim-tuyen]
  - id: cal.1960-10-19.cuba
    when: Oct. 19–24
    date: '1960-10-19'
    thread: cuba
    c: 'Commerce bars all exports to Cuba but food, medicines and medical supplies, under the Export Control Act; Eisenhower approved it Oct. 13 on Dillon''s recommendation. Ambassador Bonsal recalled, not to return. Oct. 24: Cuba nationalizes the remaining American-owned businesses.'
    n: '[25 Fed. Reg. 10006](https://www.govinfo.gov/app/details/FR-1960-10-20) (Oct. 20, 1960). FRUS 1958–60, VI, docs. [590](https://history.state.gov/historicaldocuments/frus1958-60v06/d590), [592](https://history.state.gov/historicaldocuments/frus1958-60v06/d592), [593](https://history.state.gov/historicaldocuments/frus1958-60v06/d593), [596](https://history.state.gov/historicaldocuments/frus1958-60v06/d596) (NSC, Oct. 20). See [[cal.1960-07-06.cuba-2]]. Names: Eisenhower, Bonsal (Opp. III.E); Dillon (K–J Adm. III.H).'
    tags: [name:eisenhower-dwight-d, name:dillon-c-douglas, name:bonsal-philip-w, name:castro-fidel]
  - id: cal.1960-10-19.king
    when: Oct. 19–22
    date: '1960-10-19'
    thread: king
    also: [sit-ins, georgia]
    c: Atlanta's students resume their sit-ins. King arrested with them in the Magnolia Room of Rich's department store, under the State's trespass law; he refuses bail. Mayor Hartsfield arranges a truce; the students are freed. DeKalb County holds King.
    n: '[[w.branch-parting-the-waters]]; [[w.garrow-bearing-the-cross]]; [[w.levingston-kennedy-and-king]]; [[w.wofford-of-kennedys-and-kings]]; [[w.kruse-white-flight]], on the Atlanta sit-ins; [[w.king-daddy-king]]; [[w.bryant-bystander]]; [[w.stern-calculating-visions]]; [[w.brauer-john-f-kennedy-and]]; [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]; [[w.white-making-of-the-president]]. Names: Martin Luther King (K–J Cong. III.H); Hartsfield (K–J Cong. III.F).'
    tags: [name:king-martin-luther-jr, name:hartsfield-william-b]
  - id: cal.1960-10-20.cuba
    when: Oct. 20
    date: '1960-10-20'
    thread: cuba
    also: [elections-1960]
    c: Kennedy's statement on Cuba. The embargo too little and too late. "We must attempt to strengthen the non-Batista democratic anti-Castro forces in exile, and in Cuba itself, who offer eventual hope of overthrowing Castro."
    n: '[Statement on Cuba by Senator John F. Kennedy](https://www.presidency.ucsb.edu/documents/statement-cuba-senator-john-f-kennedy) (Oct. 20, 1960). [[w.goodwin-remembering-america]], who drafted it; [[w.nixon-six-crises]], who took it to know of the program; [[w.kallina-kennedy-v-nixon]]; [[w.rasenberger-brilliant-disaster]]. Names: Kennedy (Viet. III.A); Castro (K–J Adm. III.J).'
    tags: [name:kennedy-john-f, name:castro-fidel]
  - id: cal.1960-10-20.economy
    when: Oct. 20–25
    date: '1960-10-20'
    thread: economy
    also: [elections-1960]
    c: Gold in London to about $40.60 an ounce, Oct. 20, against the Treasury's $35. Anderson and Martin tell the British, Oct. 25, that the Bank of England may sell its own gold to keep the market orderly; the price falls back.
    n: 'FRUS 1958–60, IV, doc. [56](https://history.state.gov/historicaldocuments/frus1958-60v04/d56) (Anderson to Eisenhower, Oct. 25). [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]]; [[w.meltzer-history-of-the-federal]]; [[w.roosa-dollar-and-world-liquidity]]; [[w.triffin-gold-and-the-dollar]]. Names: Anderson (Opp. III.E); Martin (K–J Adm. III.H).'
    tags: [name:anderson-robert-b, name:martin-william-mcchesney-jr, name:eisenhower-dwight-d]
  - id: cal.1960-10-20.cities-and-housing-boston
    when: Oct. 20
    date: '1960-10-20'
    thread: cities-and-housing
    also: [states-and-cities]
    c: Boston. Logue, New Haven's development administrator under Lee since 1954, takes charge of the Boston Redevelopment Authority for Collins. The West End being cleared since 1958; Government Center to follow on Scollay Square.
    n: '[Wikipedia, "Edward J. Logue"](https://en.wikipedia.org/wiki/Edward_J._Logue) (Check the date against the Authority''s minutes). [[w.oconnor-building-a-new-boston]]; [[w.cohen-saving-americas-cities]]; [[w.vrabel-peoples-history-of-the]]; [[w.gans-urban-villagers]]; for New Haven, [[w.talbot-mayors-game]]; [[w.wolfinger-politics-of-progress]]; [[w.rae-city]]. Names: Logue (K–J Cong. III.K); Lee (K–J Cong. III.F); John F. Collins (K–J Cong. III.K).'
    tags: [state:ma, city:boston, name:logue-edward-j, name:lee-richard-c, name:collins-john-f]
  - id: cal.1960-10-21.elections-1960
    when: Oct. 21
    date: '1960-10-21'
    thread: elections-1960
    also: [cuba]
    c: Fourth debate, New York, ABC; Quincy Howe moderating; foreign policy only. Nixon calls Kennedy's proposals on Castro "probably the most dangerously irresponsible recommendations that he's made during the course of this campaign."
    n: '[Presidential Debate in New York](https://www.presidency.ucsb.edu/documents/presidential-debate-new-york) (Oct. 21, 1960). See [[cal.1960-09-26.elections-1960]]; Kennedy''s statement, [[cal.1960-10-20.cuba]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E); Castro (K–J Adm. III.J); Howe (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:howe-quincy, name:castro-fidel]
  - id: cal.1960-10-25.king
    when: Oct. 25–27
    date: '1960-10-25'
    thread: king
    also: [robert-kennedy, elections-1960]
    c: 'Judge Oscar Mitchell of DeKalb County revokes King''s probation on a May traffic charge, Oct. 25: four months at hard labor. Before dawn on the 26th, to the state prison at Reidsville, Ga. Kennedy, urged by Wofford and Shriver, telephones Coretta King; Robert Kennedy telephones Mitchell. King out on bond, Oct. 27. His father declares for Kennedy.'
    n: '[Statement by Senator John F. Kennedy on Telephone Call To Mrs. Martin Luther King](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-telephone-call-mrs-martin-luther-king-impromptu-press) (Oct. 26, 1960). See [[cal.1960-10-19.king]]. Names: Martin Luther King (K–J Cong. III.H); Kennedy (Viet. III.A); Coretta Scott King, Martin Luther King Sr. (K–J Cong. III.K); Robert Kennedy (K–J Adm. III.A); Wofford (K–J Adm. III.B); Shriver (K–J Adm. III.G); Oscar Mitchell (K–J Cong. III.K).'
    tags: [name:king-martin-luther-jr, name:king-coretta-scott, name:kennedy-john-f, name:kennedy-robert-f, name:wofford-harris, name:shriver-r-sargent, name:mitchell-oscar, name:king-martin-luther-sr]
  - id: cal.1960-10-28.elections-1960
    when: Oct. 28
    date: '1960-10-28'
    thread: elections-1960
    c: Eisenhower for Nixon at a dinner of the Nixon for President Committee of Pennsylvania, Philadelphia. The eight years' figures; ten days left.
    n: '[Address in Philadelphia at a Rally of the Nixon for President Committee of Pennsylvania](https://www.presidency.ucsb.edu/documents/address-philadelphia-rally-the-nixon-for-president-committee-pennsylvania) (Oct. 28, 1960). [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]; [[w.ambrose-eisenhower]]. Names: Eisenhower, Nixon (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m]
  - id: cal.1960-10-31.economy
    when: Oct. 31
    date: '1960-10-31'
    thread: economy
    also: [elections-1960]
    c: 'Kennedy on the balance of payments, at Philadelphia: "If elected President I shall not devalue the dollar from the present rate."'
    n: '[Statement by Senator John F. Kennedy on Balance of Payments, Philadelphia, PA](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-balance-payments-philadelphia-pa) (Oct. 31, 1960). See [[cal.1960-10-20.economy]]. Names: Kennedy (Viet. III.A).'
    tags: [name:kennedy-john-f]
