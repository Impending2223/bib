  - id: cal.1968-06-05.robert-kennedy
    when: June 5–6
    date: '1968-06-05'
    thread: robert-kennedy-campaign
    also: [elections-1968, assassination]
    c: 'Los Angeles. June 4, Kennedy wins the California primary, and South Dakota''s. After midnight, leaving the Ambassador Hotel''s ballroom through its pantry, he is shot in the head by Sirhan Sirhan, 24, a Jordanian born in Jerusalem; five others wounded. He dies at Good Samaritan Hospital, 1:44 a.m., June 6. Johnson, before dawn, with Hoover and Rowley: a Secret Service detail for each candidate; the joint resolution authorizing them signed June 6, [82 Stat. 170](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg170-3.pdf). His address, evening of June 5: a commission on violence. June 9 a day of national mourning.'
    n: 'Statement by the President Following the Shooting of Senator Robert F. Kennedy, [1968–69 Pub. Papers 691](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=769); Address to the Nation Following the Attack on Senator Kennedy, [1968–69 Pub. Papers 691](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=769) (June 5, 1968); Statement by the President on the Death of Senator Kennedy, [1968–69 Pub. Papers 693](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=771); [Proclamation 3853](https://www.presidency.ucsb.edu/documents/proclamation-3853-death-robert-f-kennedy) (June 6, 1968). [Johnson and Hoover, 5:34 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-june-5-1968), Conversation WH6806-01-13103; [Johnson and Rowley, 7:38 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-rowley-june-5-1968), Conversation WH6806-01-13107 (Miller Center). [[w.longley-lbjs-1968]], 137–38, 141–44 (Johnson''s night; the Secret Service; the address); [[w.palermo-in-his-own-right]], 248 (the pantry, shot behind the right ear, five others wounded; a .22; death in the early morning of June 6; the Secret Service for the candidates); [[w.cq-weekly-report]], June 7, 1968, 1367–68, 1370, 1377 (shot at 12:20 a.m., Pacific time; a .22); [[w.chester-american-melodrama]], 349, 358 (the shooting after midnight; Mankiewicz''s announcement, the death at 1:44 a.m., June 6); [[w.white-making-of-the-president-1969]], 181–83 (June 4, the victory; past midnight, out through the kitchen); [[w.thomas-robert-kennedy]], 387, 390 (the Ambassador Hotel; the passageway with the kitchen staff; Sirhan fires); [[w.bernstein-guns-or-butter]], 503–05 (at 12:13 a.m.; Sirhan''s eight shots; dead at 1:44 a.m., June 6); [[w.thomas-robert-kennedy]], 391–92 (through the pantry, Sirhan''s shots, the bullet behind the right ear; Barry, Grier and Rafer Johnson take the gun; dead at 1:44 a.m., June 6). Statute (K–J Cong. II.J.2). *People v. Sirhan*, [7 Cal. 3d 710](https://static.case.law/cal-3d/7/case-pdfs/0710-01.pdf) (1972), the appeal. [[w.schlesinger-robert-kennedy-and-his]], 913–14 (the night; the victories). Check: CQ (1367) gives Sirhan born in Jordan, admitted with his family Jan. 12, 1957; the shooting in a corridor behind the ballroom. To check: [[w.witcover-85-days]]; [[w.clarke-last-campaign]]; [[w.kaiser-r-f-k-must]]; [[w.moldea-killing-of-robert-f]]. See [[cal.1968-06-04.elections-1968]]. Names: Kennedy, Sirhan, Hoover, Rowley, Johnson.'
