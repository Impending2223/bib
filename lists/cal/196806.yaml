  - id: cal.1968-06-01.governors-tx
    when: June 1
    date: '1968-06-01'
    thread: governors
    also: [elections-1968]
    c: 'Texas Democratic runoff for governor: Smith over Yarborough, 767,490 to 621,226, 55.3 percent. Smith second in the first primary. Nov. 5, Smith over Eggers (R), 1,662,019 to 1,254,333, 57.0 percent.'
    n: 'Votes: [Wikipedia, "1968 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Texas_gubernatorial_election), from the *Texas Almanac*; the *Observer*''s count, 756,909 to 620,726: [*Texas Observer*, June 7, 1968](https://issues.texasobserver.org/pdf/ustxtxb_obs_1968_06_07_issue.pdf). The November figures: the joint session''s canvass, [*House Journal*, 61st Leg., Reg. Sess. 89 (1969)](https://lrl.texas.gov/scanned/Housejournals/61/H_61_0.pdf#page=93): Smith 1,662,019, Eggers 1,254,333. [[w.cq-weekly-report]], June 7, 1968, 1375 (the winner; its almost complete returns, 756,909 to 620,726, 54.9 percent; spending to May 24, Smith $162,380, Yarborough $53,722). Check: the State Democratic Executive Committee''s canvass. See [[cal.1968-05-04.governors-tx]]. Names: Smith, Yarborough, Eggers.'
    src:
      c: 6c01ce1f
      rows:
        - 'https://lrl.texas.gov/scanned/Housejournals/61/H_61_0.pdf#page=93: C'
        - 'https://en.wikipedia.org/wiki/1968_Texas_gubernatorial_election: all'
        - 'https://issues.texasobserver.org/pdf/ustxtxb_obs_1968_06_07_issue.pdf: all'
        - 'w.cq-weekly-report June 7, 1968, 1375: A'
    tags: [state:tx, name:smith-preston, name:yarborough-don, name:eggers-paul-w]
  - id: cal.1968-06-01.elections-1968-state-conventions
    when: June 1
    date: '1968-06-01'
    thread: elections-1968-state-conventions
    c: Missouri's Democratic State convention names its 60 delegates, uncommitted; the Times reports them for Humphrey.
    n: '"Humphrey Wins Missouri Votes," [*New York Times*, June 2, 1968](https://timesmachine.nytimes.com/timesmachine/1968/06/02/issue.html), 26. How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31,549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (1968) (Oct. 14, 1968): convention; open precinct; the report on a district convention in Missouri held in secret, [31551](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=177). The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. [[w.cq-weekly-report]], June 7, 1968, 1382 (a resolution for Humphrey). Check: CQ (1382) gives a 78-member delegation casting 60 votes, a resolution endorsing Humphrey, the unit rule refused, the delegation to be bound by two-thirds of its members before the convention. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: Humphrey. Check: the Times''s page (TimesMachine, by subscription; not read here).'
    src:
      c: da2dc927
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1968/06/02/issue.html: all'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175: all'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=177: all'
        - 'https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries: all'
        - 'w.cq-weekly-report June 7, 1968, 1382: B'
