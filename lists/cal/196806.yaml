    c: 'Revenue and Expenditure Control Act signed, [82 Stat. 251](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg251.pdf): a 10 percent surcharge on income taxes, from Jan. 1 for corporations and Apr. 1 for others, to June 30, 1969; fiscal 1969 expenditures cut $6 billion from the January budget, new obligational authority $10 billion; recommendations to rescind $8 billion of old; civilian employment limited; the excises on automobiles and telephones kept. Johnson: $20 billion off the deficit; Congress will "shift to the President the responsibility" for the cuts. A memorandum to the agencies. The Treasury''s estimate in the next January''s budget of the revenue gained: $16.0 billion in the first fiscal year, $4.7 billion in the second; 1.74 and 0.45 percent of GDP.'
