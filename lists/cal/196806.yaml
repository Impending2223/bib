  - id: cal.1968-06-01.elections-1968
    when: June 1
    date: '1968-06-01'
    thread: elections-1968
    also: [robert-kennedy-campaign]
    c: 'San Francisco, ABC: McCarthy and Kennedy on television together, an hour, the one debate of the primaries. Vietnam and a place for the NLF in a government at Saigon; the ghettos, McCarthy for housing outside them, Kennedy against moving their people out (Check).'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 910–12 (the debate, its issues; not the network or its length); [[w.palermo-in-his-own-right]], 238–41 (the joint appearance in San Francisco after Oregon; the campaign''s memorandum before it; the issues); [[w.cq-weekly-report]], June 7, 1968, 1370–71 (ABC; an hour; the NLF); [[w.chester-american-melodrama]], 337–49; [[w.white-making-of-the-president-1969]], 179; [[w.bernstein-guns-or-butter]], 503 ("the affair was a wash"); [[w.thomas-robert-kennedy]], 386 (Saturday night, three journalists asking; Lawrence of ABC on the King wiretap, Kennedy''s "obvious set piece"; to McCarthy: "You say you are going to take ten thousand black people and move them into Orange County?"; more arms for Israel). Check: CQ (1371) has Kennedy "all in favor of moving people out of the ghetto," but "a lot of these people are there and we have to do something for them there"; McCarthy for "a distribution of the races.". To check: [[w.witcover-85-days]]. See [[cal.1968-05-28.elections-1968-2]]; [[cal.1968-03-14.robert-kennedy]]. Names: McCarthy, Kennedy.'
