    c: 'The Senate Appropriations subcommittee, then the full committee: an amendment to the Treasury-Post Office bill, H.R. 16489, for Secret Service protection of the major candidates for President and Vice President, the Secretary to consult the four leaders and a fifth they choose; $2 million added, $400,000 for fiscal 1968. Reported, S. Rept. 1165. Monroney: secret hearings before the shooting; Johnson asked for the funds three weeks before.'
