  - id: cal.1968-06-03.vietnam-may-offensive
    when: June 3
    date: '1968-06-03'
    thread: vietnam-may-offensive
    c: Thiệu, after long American urging, unifies the command of all his forces defending the capital under a Military Governor of Saigon and Gia Định. MACV sets up a Capital Military Assistance Command under the deputy commander of II Field Force, over all American units and advisers there.
    n: '[[w.cosmas-joint-chiefs-of-staff]], 209. By late June, 27 American and South Vietnamese maneuver battalions in Gia Định; Saigon''s defense taking, by Abrams''s estimate, over half the allied maneuver battalions (209). Names: Nguyễn Văn Thiệu.'
    src:
      c: fb75f3aa
      rows:
