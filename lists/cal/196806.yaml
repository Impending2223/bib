    c: 'Saigon. A rocket from an American helicopter strikes a South Vietnamese command post: six officials killed, among them the police chief, the port director, a brother-in-law of Kỳ and the commander of the 5th Ranger Group; the mayor wounded.'
    n: '[[w.cq-weekly-report]], June 7, 1968, 1404; [[w.cosmas-joint-chiefs-of-staff]], 209. To check: MFR, DepDir for Opns, NMCC, "Ground Operations SVN, 2 Jun 68," 2 Jun 68, OCJCS File 091 Vietnam Jun 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 209 n.21); Memo, DepDir for Opns, NMCC, to CJCS, "Accidental Delivery of Ordnance," 4 Jun 68, OCJCS File 091 Vietnam Jun 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 209 n.21); COMUSMACV 16447 to JCS and CINCPAC, 080817Z Jun 68, OCJCS File 091 Vietnam Jun 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 209 n.21). Names: Kỳ.'
    src:
