  - id: cal.1964-08.goldwater
    when: Aug.–Oct.
    date: 1964-08
    thread: goldwater
    also: [elections-1964]
    c: 'The CIA and the Goldwater campaign. Hunt, of the Domestic Operations Division, later claimed he had watched it for the White House. The CIA''s own inquiry, Dec. 1973: the campaign''s press releases and travel schedules, advance copies passed to the White House some three hours before release; the idea Barnes''s, not McCone''s or Helms''s. Check.'
    n: 'CIA, [memorandum, "Howard Hunt''s Claim That He Spied on Goldwater in the 1964 Election Campaign," Dec. 20, 1973](https://www.cia.gov/readingroom/docs/JFK%20Case%20HOWARD%20HUNTS%20CLA%5B15658047%5D.pdf); [memorandum for the record, "E. Howard Hunt," Dec. 20, 1973](https://archive.org/download/JFKNovember32017Release/104-10173-10130_text.pdf) (NARA 104-10173-10130); [memorandum of a conversation with Nedzi, Dec. 27, 1973](https://www.cia.gov/readingroom/docs/conversation%20with%20chairma%5B15132634%5D.pdf). Made public: the *Washington Post*, Dec. 20 and 21, 1973; the CIA''s findings, Colby to Nedzi, Dec. 27, 1973. To check: [[w.hunt-undercover]]. Names: E. Howard Hunt, McCone, Helms, Barnes, Goldwater.'
    tags: [name:hunt-e-howard, name:barnes-c-tracy, name:mccone-john-a, name:helms-richard, name:goldwater-barry-m]
