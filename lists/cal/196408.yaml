    when: Aug. 12
    date: '1964-08-12'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, July 23–28: a UN army to deal with Southeast Asia and Vietnam, 58 percent approve, 19 disapprove. The United States handling South Vietnam as well as could be expected, 52; badly, 38.'
    n: '[[w.gallup-poll]], III, 1896–97.'
  - id: cal.1964-08-12.desegregation-schools
    when: Aug. 12
    date: '1964-08-12'
    thread: desegregation-schools
    also: [south-carolina]
    c: South Carolina. The same court orders the like for Orangeburg's schools.
    n: '*Adams v. School District No. 5, Orangeburg County*, [232 F. Supp. 692](https://static.case.law/f-supp/232/case-pdfs/0692-01.pdf) (E.D.S.C. 1964). See [[cal.1964-07-29.desegregation-schools]].'
  - id: cal.1964-08-12.desegregation-schools-la
    when: Aug. 12
    date: '1964-08-12'
    thread: desegregation-schools
    c: St. Helena Parish, La. The schools open, three Negro pupils in a white school.
    n: NAACP Legal Defense Fund, ["Three Negroes Integrate Rural Louisiana School"](https://ldfrecollection.org/archives/archives-search/archives-item/9149cacc-8f91-42ca-b6e8-5364cf033de0/three-negroes-integrate-rural-louisiana-school) (Aug. 21, 1964). Check the count. See [[cal.1964-08-07.desegregation-schools]].
  - id: cal.1964-08-13.transportation
    when: Aug. 13
    date: '1964-08-13'
    thread: transportation
    c: 'Federal-Aid Highway Act signed in the Cabinet Room, [78 Stat. 397](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg396.pdf#page=2): $1 billion a year from the Highway Trust Fund for primary, secondary and urban roads in fiscal 1966 and 1967, half federal; forest, park and public land roads. The House passed it June 3, [296–0](https://voteview.com/rollcall/RH0880167).'
    n: Statute (K–J Cong. II.J.2). Remarks Upon Signing the Highway Bill, [1963–64 Pub. Papers 955](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=195) (Aug. 13, 1964). [[w.lewis-divided-highways]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08-14.congress
    when: Aug. 14
    date: '1964-08-14'
    thread: congress
    c: Government Employees Salary Reform Act signed, [78 Stat. 400](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg400.pdf). Members of Congress to $30,000 from $22,500; Cabinet officers to $35,000; raises for the classified service, judges, and executives. Senate passed it July 2, [58–21](https://voteview.com/rollcall/RS0880438).
    n: 'Remarks Upon Signing the Government Employees Pay Raise Bill, [1963–64 Pub. Papers 962](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=202) (Aug. 14, 1964). See [[cal.1964-01-07.congress]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08-14.opinion
    when: Aug. 14
    date: '1964-08-14'
    thread: opinion
    also: [poverty]
    c: 'Gallup, July 23–28: young men of 16 to 22 out of work required to join a youth conservation corps, 73 percent approve, 21 disapprove. Republicans 63 approve; Democrats 80.'
    n: '[[w.gallup-poll]], III, 1897.'
  - id: cal.1964-08-15.desegregation-schools
    when: Aug. 15
    date: '1964-08-15'
    thread: desegregation-schools
    c: Johnson asks Boggs, then McKeithen, about reports that he threatened federal force at St. Helena Parish.
    n: '[Johnson and Boggs, 2:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hale-boggs-and-office-conversation-august-15), Conversation WH6408-22-4954, 4955 (Miller Center); [Johnson and McKeithen, 3:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-mckeithen-august-15-1964), Conversation WH6408-23-4965, 4966, 4967, 4968 (Miller Center). See [[cal.1964-08-07.desegregation-schools]]. Names: Johnson, Boggs, McKeithen.'
    tags: [name:johnson-lyndon-b, name:boggs-hale, name:mckeithen-john-j]
  - id: cal.1964-08-16.vietnam
    when: Aug. 16
    date: '1964-08-16'
    thread: vietnam-saigon
    c: Saigon. Khánh, under a state of emergency since Aug. 7, made president by the Military Revolutionary Council under a new charter.
    n: 'FRUS 1964–68, I, docs. [305](https://history.state.gov/historicaldocuments/frus1964-68v01/d305), [312](https://history.state.gov/historicaldocuments/frus1964-68v01/d312). [[w.topmiller-lotus-unleashed]]. See [[cal.1964-07-27.vietnam]]. Names: Nguyễn Khánh.'
    tags: [name:nguyen-khanh, place:saigon]
  - id: cal.1964-08-18.elections-1964
    when: Aug. 18
    date: '1964-08-18'
    thread: elections-1964
    c: Senate tables the conference report suspending the equal-time rule for the presidential and vice-presidential candidates, [44–41](https://voteview.com/rollcall/RS0880504). The 1960 suspension not renewed.
    n: '[110 Cong. Rec., Senate, Aug. 18, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt15/pdf/GPO-CRECB-1964-pt15-5-1.pdf). See [[cal.1964-07-15.elections-1964]].'
  - id: cal.1964-08-19.court
    when: Aug. 19
    date: '1964-08-19'
    thread: court
    also: [states-and-cities, legislatures]
    c: House passes Tuck's bill to take the apportionment of State legislatures from the federal courts, [218–175](https://voteview.com/rollcall/RH0880220).
    n: '[110 Cong. Rec., House, Aug. 19, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt15/pdf/GPO-CRECB-1964-pt15-6-1.pdf). [[w.powe-warren-court-and-american]]. See [[cal.1964-06-15.court]]. Names: Tuck.'
    tags: [name:tuck-william-m]
  - id: cal.1964-08-19.opinion
    when: Aug. 19
    date: '1964-08-19'
    thread: opinion
    also: [court]
    c: 'Gallup, July 23–28: the Supreme Court''s ruling that both houses of every State legislature be in proportion to population, 47 percent approve, 30 disapprove. East 56 approve; South 40. Places under 2,500: 35 approve, 42 disapprove.'
    n: '[[w.gallup-poll]], III, 1897–98.'
  - id: cal.1964-08-20.poverty
    when: Aug. 20
    date: '1964-08-20'
    thread: poverty
    c: 'Economic Opportunity Act signed in the Rose Garden, [78 Stat. 508](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg508.pdf). An Office of Economic Opportunity in the Executive Office; $947.5 million the first year: Job Corps, work-training, work-study, community action, rural loans, VISTA. Shriver to direct it. "Opportunity, not an opiate."'
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing the Economic Opportunity Act, [1963–64 Pub. Papers 988](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=228) (Aug. 20, 1964). See [[cal.1964-03-16.poverty]]. Names: Johnson, Shriver.'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent, bill:economic-opportunity-1964]
  - id: cal.1964-08-20.europe-and-the-alliance
    when: Aug. 20
    date: '1964-08-20'
    thread: cyprus
    c: 'Cyprus. Acheson''s second proposal: a fifty-year lease of the Karpas peninsula''s tip in place of a sovereign area.'
    n: '[FRUS 1964–68, XVI, doc. 134](https://history.state.gov/historicaldocuments/frus1964-68v16/d134). See [[cal.1964-07-07.europe-and-the-alliance]]. Names: Acheson.'
    tags: [name:acheson-dean-g]
  - id: cal.1964-08-21.europe-and-the-alliance-cyprus
    when: Aug. 21
    date: '1964-08-21'
    thread: cyprus
    c: Cyprus. Turkey refuses Acheson's second proposal.
    n: '[FRUS 1964–68, XVI, doc. 138](https://history.state.gov/historicaldocuments/frus1964-68v16/d138). See [[cal.1964-07-07.europe-and-the-alliance]]. Names: Acheson.'
    tags: [name:acheson-dean-g]
  - id: cal.1964-08-22.mississippi
    when: Aug. 22
    date: '1964-08-22'
    thread: mississippi
    also: [elections-1964]
    c: 'Atlantic City. The Credentials Committee hears the Mississippi Freedom Democrats'' challenge to the regular delegation; Rauh their counsel. Hamer: beaten in the Winona, Miss., jail, June 1963; "Is this America?" Johnson meets Democratic governors at the White House the same afternoon. Check.'
    n: 'Remarks to a Group of Democratic Governors, [1963–64 Pub. Papers 1003](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=243) (Aug. 22, 1964). [[w.dittmer-local-people]]; [[w.mcadam-freedom-summer]]; [[w.payne-ive-got-the-light]]; [[w.carson-in-struggle]]; [[w.mills-this-little-light-of]]; [[w.branch-pillar-of-fire]]; [[w.kotz-judgment-days]]; [[w.humphrey-education-of-a-public-1976]]; [[w.taking-charge-2001]]. Wisconsin Historical Society: Freedom Summer collections (K–J Cong. II.L). See [[cal.1964-08-04.mississippi]]. Names: Rauh, Hamer, Johnson.'
    tags: [name:rauh-joseph-l-jr, name:hamer-fannie-lou, name:johnson-lyndon-b]
  - id: cal.1964-08-22.elections-1964
    when: Aug. 22–23
    date: '1964-08-22'
    thread: elections-1964
    also: [mississippi]
    c: 'Johnson and Eastland, seven calls, on the Mississippi regulars at Atlantic City: the settlement proposed for seating the Mississippi and Alabama delegations; a pledge to support the nominee; the party''s rules hereafter on Negroes'' part in choosing delegates. Eastland reports his talks with Paul Johnson and the State convention''s near endorsement of Goldwater; the President reads him a statement for the regulars, of their intent to support the nominee. Aug. 23: the governor has told the regulars they may vote as they want, without reprisal.'
    n: '[Johnson and Eastland, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-22-1964), Conversation WH6408-32-5117 (Miller Center); [12:02 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-22-1964-0), Conversation WH6408-33-5121, 5122 (Miller Center); [6:21 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-and-office-secretary-august-22), Conversation WH6408-33-5130 (Miller Center); [7:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-22-1964-2), Conversation WH6408-33-5131 (Miller Center); [Aug. 23, 3:35 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-23-1964), Conversation WH6408-33-5133 (Miller Center); [3:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-23-1964-0), Conversation WH6408-33-5134 (Miller Center); [4:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-23-1964-1), Conversation WH6408-34-5138 (Miller Center). The catalogue gives the governor as "unnamed person (Gov. Paul Johnson?)" in three of them. See [[cal.1964-08-22.mississippi]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Johnson, Eastland, Paul Johnson, Goldwater.'
    tags: [name:johnson-lyndon-b, name:eastland-james-o, name:johnson-paul-b-jr, name:goldwater-barry-m]
  - id: cal.1964-08-23.opinion
    when: Aug. 23
    date: '1964-08-23'
    thread: opinion
    also: [elections-1964-polls, goldwater]
    c: 'Gallup, Aug. 6–11: Johnson 65, Goldwater 29, undecided 6. Republicans: Goldwater 62, Johnson 27. Independents: Johnson 58, Goldwater 35.'
    n: '[[w.gallup-poll]], III, 1898–99. Names: Johnson, Goldwater.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-08-24.elections-1964
    when: Aug. 24
    date: '1964-08-24'
    thread: elections-1964
    c: 'Democratic National Convention opens, Atlantic City, at Convention Hall. The party''s primaries: map and returns below.'
    n: CQ Guide 6th (2010) 406–408. [1964 Democratic Party Platform](https://www.presidency.ucsb.edu/documents/1964-democratic-party-platform) (Aug. 24, 1964). [[w.white-making-of-the-president-1965]]; [[w.national-election-of-1964]]; [[w.dallek-flawed-giant]]; [[w.shesol-mutual-contempt]]; [[w.johnson-vantage-point]]; [[w.johnson-white-house-diary]]; [[w.taking-charge-2001]]; [[w.humphrey-education-of-a-public-1976]]. See [[cal.1964-03-10.elections-1964]].
    tags: [primaries:1964-D]
  - id: cal.1964-08-24.alabama
    when: Aug. 24–25
    date: '1964-08-24'
    thread: alabama
    also: [elections-1964]
    c: 'Atlantic City. Alabama''s delegates, elected pledged to Wallace, seated only on signing a pledge to support the convention''s nominees. Most refuse, Connor, the national committeeman, among them; on the opening night those not seated sit in the delegation''s seats. Aug. 25, Johnson, by telephone with Connally and Georgia''s governor: "Nobody claims they won''t do it except Mississippi and Alabama." Check the counts and the dates.'
    n: '[Johnson, Connally, and Sanders, 4:32 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-sanders-august-25-1964), Conversation WH6408-37-5183, 5184 (Miller Center), quoted in KC Johnson, ["The Atlantic City Convention"](https://allthewaywithlbj.com/the-atlantic-city-convention/). Made public: the recordings, opened by the LBJ Library. Check the year. [[w.white-making-of-the-president-1965]]; [[w.carter-politics-of-rage-1995]]. See [[cal.1964-05-05.alabama]]; [[cal.1964-08-22.mississippi]]. Names: Wallace, Connor, Johnson, Connally.'
    tags: [name:wallace-george-c, name:connor-eugene, name:johnson-lyndon-b, name:connally-john]
  - id: cal.1964-08-24.mississippi
    when: Aug. 24
    date: '1964-08-24'
    thread: mississippi
    also: [elections-1964, voting-rights, electoral-college]
    c: 'Greenville. A three-judge court upholds Mississippi''s unpledged-elector law of 1963 against the suit of Victoria Gray and other Freedom Democrats: a State convention may name a slate pledged to the national nominee and one unpledged, a September primary between them to decide which goes on the November ballot as the party''s. No constitutional right to vote for electors pledged to a national party''s nominee.'
    n: '*Gray v. Mississippi*, [233 F. Supp. 139](https://static.case.law/f-supp/233/case-pdfs/0139-01.pdf) (N.D. Miss. 1964). [[w.dittmer-local-people]]. See [[cal.1964-08-06.mississippi]]. Names: Victoria Gray.'
    tags: [name:gray-victoria-jackson]
  - id: cal.1964-08-25.mississippi
    when: Aug. 25
    date: '1964-08-25'
    thread: mississippi
    also: [elections-1964, civil-rights-organizations]
    c: 'The Credentials Committee''s compromise, Mondale''s subcommittee: the regulars seated if they pledge to support the ticket; Aaron Henry and Ed King of the Freedom Democrats seated at large; no delegation chosen by discrimination in 1968. The Freedom Democrats refuse it; all but three of the regulars go home.'
    n: '[Johnson, Humphrey, and Reuther, 2:31 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-and-walter-reuther-august-25), Conversation WH6408-36-5181 (Miller Center); [Johnson and Eastland, 7:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-25-1964), Conversation WH6408-38-5193, 5194 (Miller Center). See [[cal.1964-08-22.mississippi]]. Names: Mondale, Henry, Edwin King.'
    tags: [name:mondale-walter-f, name:henry-aaron, name:king-edwin, name:humphrey-hubert-h]
  - id: cal.1964-08-25.elections-1964
    when: Aug. 25
    date: '1964-08-25'
    thread: elections-1964
    also: [robert-kennedy]
    c: Robert Kennedy, at Gracie Mansion with Wagner, will seek the Democratic nomination for Senator from New York against Keating.
    n: '[Johnson and Robert Kennedy, Aug. 12, 9:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-august-12-1964), Conversation WH6408-18-4897 (Miller Center). [Statement by Attorney General Robert F. Kennedy](https://www.justice.gov/sites/default/files/ag/legacy/2011/01/20/08-25-1964.pdf) (Aug. 25, 1964). [[w.schlesinger-robert-kennedy-and-his]]; [[w.shesol-mutual-contempt]]. See [[cal.1964-07-30.elections-1964]]. Names: Robert Kennedy, Wagner, Keating.'
    tags: [name:kennedy-robert-f, name:wagner-robert-f-jr, name:keating-kenneth-b]
  - id: cal.1964-08-25.vietnam
    when: Aug. 25
    date: '1964-08-25'
    thread: vietnam-saigon
    c: Saigon. Students and Buddhists in the streets; Khánh's charter revoked.
    n: 'FRUS 1964–68, I, docs. [322](https://history.state.gov/historicaldocuments/frus1964-68v01/d322), [325](https://history.state.gov/historicaldocuments/frus1964-68v01/d325). See [[cal.1964-08-16.vietnam]]. Names: Nguyễn Khánh.'
    tags: [name:nguyen-khanh, name:taylor-maxwell, place:saigon]
  - id: cal.1964-08-26.elections-1964
    when: Aug. 26
    date: '1964-08-26'
    thread: elections-1964
    c: Johnson nominated by acclamation. He flies to Atlantic City and asks for Humphrey, "my trusted colleague"; Humphrey nominated by acclamation. Aug. 25, he had drafted a statement withdrawing. Check.
    n: 'Remarks Before the National Convention Upon Recommending the Nomination of Hubert Humphrey as Vice President, [1963–64 Pub. Papers 1008](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=248); The President''s News Conference Before Departing for Atlantic City for the National Convention, [1963–64 Pub. Papers 1007](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=247) (Aug. 26, 1964). See [[cal.1964-08-24.elections-1964]]. Names: Johnson, Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1964-08-26.opinion
    when: Aug. 26
    date: '1964-08-26'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 6–11: the United States handling South Vietnam as well as could be expected, 71 percent; badly, 16. What next: show we can''t be pushed around, keep troops there, 27; get tougher, 12; avoid all-out war, sit down and talk, 10; military action 9; get out 4.'
    n: '[[w.gallup-poll]], III, 1899.'
  - id: cal.1964-08-27.elections-1964
    when: Aug. 27
    date: '1964-08-27'
    thread: elections-1964
    also: [robert-kennedy]
    c: Robert Kennedy introduces the film on his brother, *A Thousand Days*. A long ovation before he can speak. "When he shall die, take him and cut him out in little stars."
    n: '[Tribute to John F. Kennedy at the DNC](https://www.jfklibrary.org/node/343256) (Aug. 27, 1964). [[w.schlesinger-robert-kennedy-and-his]]; [[w.shesol-mutual-contempt]]. See [[cal.1964-08-24.elections-1964]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1964-08-27.elections-1964-2
    when: Aug. 27
    date: '1964-08-27'
    thread: elections-1964
    also: [program]
    c: 'Johnson''s acceptance, his birthday: "I ask the American people for a mandate—not to preside over a finished program ... a mandate to begin." The Great Society; medical care for the aged; the war on poverty.'
    n: 'Remarks Before the National Convention Upon Accepting the Nomination, [1963–64 Pub. Papers 1009](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=249) (Aug. 27, 1964). See [[cal.1964-08-24.elections-1964]]; [[cal.1964-05-22.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08-27.vietnam
    when: Aug. 27
    date: '1964-08-27'
    thread: vietnam-saigon
    c: Saigon. Khánh, Minh, and Khiêm a triumvirate; Khánh to Dalat to rest, Oánh signing for him.
    n: 'FRUS 1964–68, I, docs. [330](https://history.state.gov/historicaldocuments/frus1964-68v01/d330), [332](https://history.state.gov/historicaldocuments/frus1964-68v01/d332). See [[cal.1964-08-16.vietnam]]. Names: Nguyễn Khánh, Dương Văn Minh, Trần Thiện Khiêm, Nguyễn Xuân Oánh.'
    tags: [name:nguyen-khanh, name:duong-van-minh, name:tran-thien-khiem, name:nguyen-xuan-oanh, place:saigon, place:dalat]
  - id: cal.1964-08-28.states-and-cities-philadelphia
    when: Aug. 28–30
    date: '1964-08-28'
    thread: states-and-cities
    c: Philadelphia. A quarrel over a car stopped at 23rd Street and Columbia Avenue, two policemen, a crowd; a rumor that a pregnant woman has been beaten to death. Three nights of looting and burning along Columbia Avenue in North Philadelphia; the police held back. No dead; 341 hurt, 774 arrested, 225 stores damaged (Check).
    n: '[*New York Times*, Aug. 29, 1964](https://timesmachine.nytimes.com/timesmachine/1964/08/29/issue.html); [Aug. 30](https://timesmachine.nytimes.com/timesmachine/1964/08/30/issue.html); [Aug. 31](https://timesmachine.nytimes.com/timesmachine/1964/08/31/issue.html). [[w.countryman-up-south]]; [[w.flamm-law-and-order]]. See [[cal.1964-08-02.states-and-cities-jersey-city]].'
    tags: [state:pa, city:philadelphia]
  - id: cal.1964-08-30.transportation
    when: Aug. 30
    date: '1964-08-30'
    thread: transportation
    c: 'Act of Aug. 30, [78 Stat. 696](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg696.pdf): passenger cars bought by the federal government to carry the safety devices the Administrator of General Services requires, his standards to be published within a year.'
    n: Statute (K–J Cong. II.J.2). H.R. 1341, 88th Cong. See [[cal.1964-03-23.transportation]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08-31.farm
    when: Aug. 31
    date: '1964-08-31'
    thread: farm
    also: [poverty]
    c: 'Food Stamp Act signed, [78 Stat. 703](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg703.pdf). The pilot program of 1961 made permanent: $75 million for fiscal 1965, $100 million for 1966, $200 million for 1967. The House passed it Apr. 8, [229–189](https://voteview.com/rollcall/RH0880149); the Senate by voice, June 30. Check.'
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing the Food Stamp Act, [1963–64 Pub. Papers 1025](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=265) (Aug. 31, 1964). [[w.cochrane-american-farm-policy-1948]]; [[w.sundquist-politics-and-policy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08.goldwater
    when: Aug.–Oct.
    date: 1964-08
    thread: goldwater
    also: [elections-1964]
    c: 'The CIA and the Goldwater campaign. Hunt, of the Domestic Operations Division, later claimed he had watched it for the White House. The CIA''s own inquiry, Dec. 1973: the campaign''s press releases and travel schedules, advance copies passed to the White House some three hours before release; the idea Barnes''s, not McCone''s or Helms''s. Check.'
    n: 'CIA, [memorandum, "Howard Hunt''s Claim That He Spied on Goldwater in the 1964 Election Campaign," Dec. 20, 1973](https://www.cia.gov/readingroom/docs/JFK%20Case%20HOWARD%20HUNTS%20CLA%5B15658047%5D.pdf); [memorandum for the record, "E. Howard Hunt," Dec. 20, 1973](https://archive.org/download/JFKNovember32017Release/104-10173-10130_text.pdf) (NARA 104-10173-10130); [memorandum of a conversation with Nedzi, Dec. 27, 1973](https://www.cia.gov/readingroom/docs/conversation%20with%20chairma%5B15132634%5D.pdf). [[w.hunt-undercover]]. Made public: the *Washington Post*, Dec. 20 and 21, 1973; the CIA''s findings, Colby to Nedzi, Dec. 27, 1973. Names: E. Howard Hunt, McCone, Helms, Barnes, Goldwater.'
