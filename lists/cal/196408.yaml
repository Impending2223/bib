  - id: cal.1964-08-03.vietnam-tonkin-2
    when: Aug. 3
    date: '1964-08-03'
    time: 1964-08-03T01:00Z
    thread: vietnam-tonkin
    c: 'The *Maddox* and the *Turner Joy* under Herrick head into the gulf, 0900H, ordered to destroy any attacker; the *Ticonderoga*: "maximum effort" to destroy the attacking units. Fire may be kept on boats inside the eleven-mile zone; no pursuit into it. Seventh Fleet asks MACV the next 34A mission''s time: the destroyers to keep clear between the 17th and 18th parallels Aug. 3–4.'
    n: '[[w.marolda-united-states-navy-and]], 421–22. To check: msg, COM7FLT 030553Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 422 n.66). See [[cal.1964-08-02.vietnam]]. Names: Herrick.'
    src:
