    c: 'Morning, the Democratic leaders'' weekly breakfast, McCormack, Albert and Boggs, Humphrey, Hayden and Smathers: Johnson tells them that if the ships are attacked again he thinks the United States must retaliate. The leaders agree, and on a resolution. Mansfield absent.'
