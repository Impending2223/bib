    thread: vietnam-tonkin
    c: 'Rusk, McNamara, and Wheeler before Foreign Relations and Armed Services on the Southeast Asia resolution. McNamara: "Our Navy played absolutely no part in, was not associated with, was not aware of, any South Vietnamese actions, if there were any." Morse: "I am unalterably opposed"; the boats "didn''t act in a vacuum as far as the United States was concerned." Rusk: regular consultations with the committees and the leaders. Long: "the quicker you shoot back, the better off you are." Approved, 31–1, Morse against.'
    n: '[FRUS 1964–68, I, doc. 297](https://history.state.gov/historicaldocuments/frus1964-68v01/d297) (editorial note). [[w.gibbons-u-s-government-and]], II, 310–11, 313 (the joint hearing, an hour and forty minutes; Rusk''s promise of consultation; Morse alone against); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 522–23 (McNamara''s testimony); [[w.mcnamara-in-retrospect]], ch. 5 at n.12 (9 a.m., the Senate Caucus Room; Rusk''s statement; Wheeler, the Chiefs'' endorsement; Morse''s "backstop"; Fulbright: "The promptness and decision...which all of you exhibited on this occasion was commendable"). [[w.mann-grand-delusion]], 359–61; [[w.bernstein-guns-or-butter]], 338 (one hour and forty minutes; 31 to 1); [[w.woods-fulbright]], 354 (McNamara''s denial to Morse, after a Pentagon officer''s tip that morning); [[w.logevall-choosing-war]], 203 (the joint session of the Foreign Relations and Armed Services committees, Aug. 6: McNamara''s answer to Morse, "Our Navy played absolutely no part in, was not associated with, was not aware of, any South Vietnamese actions, if there were any"). [[w.rusk-as-i-saw-it-1990]], 445 (the testimony). To check: McNamara''s testimony before the two committees, Aug. 6, 1964 (excerpts), SecDef files, OSD Hist; the committees'' report, "Promoting the Maintenance of International Peace and Security in Southeast Asia," Aug. 6, 1964, *Executive Sessions*, XVI, 374–82 (cited by [[w.mann-grand-delusion]], 361 n.73); *Executive Sessions*, XVI, 291–94 (cited by [[w.mann-grand-delusion]], 360 n.71). (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 523 n.106); *Southeast Asia Resolution*, Joint Hearing before the Senate Comms. on Foreign Relations and Armed Services, 88th Cong., 2d Sess. (1966) (cited by [[w.gibbons-u-s-government-and]], II, 310 n.96). See [[cal.1964-08-02.vietnam]]. Names: Rusk, McNamara, Wheeler, Morse, Long.'
