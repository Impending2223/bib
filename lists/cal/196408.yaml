  - id: cal.1964-08-22.elections-1964
    when: Aug. 22–23
    date: '1964-08-22'
    time: 1964-08-22T15:00Z
    thread: elections-1964-freedom-democrats
    also: [mississippi, farm]
    c: 'Johnson and Eastland, seven calls, on the Mississippi regulars at Atlantic City: the settlement proposed for seating the Mississippi and Alabama delegations; a pledge to support the nominee; the party''s rules hereafter on Negroes'' part in choosing delegates. Eastland reports his talks with Paul Johnson and the State convention''s near endorsement of Goldwater; the President reads him a statement for the regulars, of their intent to support the nominee. Aug. 23: the governor has told the regulars they may vote as they want, without reprisal. Of the call of Aug. 23, 3:35 p.m., after half a dozen calls: are the regulars "traitors to the party—or are they going to try to be helpful?" He "might cut out your goddamn subsidies and cut out your $6 billion cotton program"; laughing, he might as well "save about $6 billion."'
    n: '[Johnson and Eastland, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-22-1964), Conversation WH6408-32-5117 (Miller Center); [12:02 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-22-1964-0), Conversation WH6408-33-5121, 5122 (Miller Center); [6:21 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-and-office-secretary-august-22), Conversation WH6408-33-5130 (Miller Center); [7:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-22-1964-2), Conversation WH6408-33-5131 (Miller Center); [Aug. 23, 3:35 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-23-1964), Conversation WH6408-33-5133 (Miller Center); [3:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-23-1964-0), Conversation WH6408-33-5134 (Miller Center); [4:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-23-1964-1), Conversation WH6408-34-5138 (Miller Center). The catalogue gives the governor as "unnamed person (Gov. Paul Johnson?)" in three of them. [[w.branch-pillar-of-fire]], 462; [[w.kotz-judgment-days]], 201, 209 (the plan put to Eastland; the governor''s word, Aug. 23; the call of 3:35 p.m.). To check: [Conversation with JAMES EASTLAND and OFFICE SECRETARY, 6:21 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-and-office-secretary-august-22), Conversation WH6408-33-5130 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 462); [Conversation with JAMES EASTLAND, 7:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-22-1964-2), Conversation WH6408-33-5131 (Miller Center) (cited by [[w.branch-pi