  - id: cal.1964-08-01.robert-kennedy
    when: Aug. 1–2
    date: '1964-08-01'
    thread: robert-kennedy
    also: [elections-1964, democratic-party]
    c: 'Hyannis Port, with Harriman, Hackett and Schlesinger. Robert Kennedy on the Senate: a base independent of Johnson; a bloc of New Frontier Senators, Tydings, McGovern, Bayh, Salinger. New York only on a summons from a broad group in the party; Harriman to lead. The question Alex Rose and the Liberals. By Schlesinger''s journal.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 666. To check: Schlesinger, journal, Aug. 2, 1964 (cited by [[w.schlesinger-robert-kennedy-and-his]], 666 n.3). Names: Robert Kennedy, Harriman, Schlesinger, Tydings, McGovern, Bayh, Salinger, Johnson.'
    src:
      c: 4998059c
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 666: all'
        - 'via w.schlesinger-robert-kennedy-and-his 666 n.3: B-C'
    tags: [name:kennedy-robert-f, name:harriman-w-averell, name:schlesinger-arthur-m-jr, name:johnson-lyndon-b, state:ny]
  - id: cal.1964-08-02.vietnam
    when: Aug. 2–3
    date: '1964-08-02'
    thread: vietnam
    c: 'Gulf of Tonkin. The destroyer Maddox, on a DeSoto patrol off North Vietnam, attacked by three torpedo boats in the afternoon, Saigon time; the Maddox and planes from the Ticonderoga hit all three. South Vietnamese raiders under OPLAN 34A had shelled Hòn Mê and Hòn Ngư, July 30–31. Johnson: no reprisal; a protest to Hanoi. Aug. 3, his statement: the patrol doubled, orders to destroy any attacker.'
    n: 'FRUS 1964–68, I, docs. [255](https://history.state.gov/historicaldocuments/frus1964-68v01/d255), [258](https://history.state.gov/historicaldocuments/frus1964-68v01/d258), [265](https://history.state.gov/historicaldocuments/frus1964-68v01/d265); [doc. 260](https://history.state.gov/historicaldocuments/frus1964-68v01/d260) (State''s 328 to Saigon, Aug. 2: the DeSoto patrol). Statement by the President Upon Instructing the Navy To Take Retaliatory Action in the Gulf of Tonkin, [1963–64 Pub. Papers 926](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=166) (Aug. 3, 1964). *The Gulf of Tonkin, the 1964 Incidents* (K–J Cong. II.J.3). [President''s Daily Diary, Aug. 2, 1964](https://catalog.archives.gov/id/192444), image 1; [Aug. 3](https://catalog.archives.gov/id/192445), image 1 (LBJ Library; National Archives Catalog). [[w.gibbons-u-s-government-and]], II, 285–86 (the attack and the reply; Johnson''s choice not to retaliate, by *The Vantage Point*; the patrol augmented, the Turner Joy with the Maddox Aug. 3); [[w.frankum-like-rolling-thunder]], 13–14 (the raids of July 30–31; the attack of Aug. 2, the Maddox and the Ticonderoga''s planes); [[w.vietnam-victory-in-vietnam]], 132 (the attack of Aug. 2, three boats of the 135th Torpedo Boat Group); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 519 (the attack and the reply; the raids of July 30–31; no reprisal; the protest); [[w.cosmas-joint-chiefs-of-staff-2012]], 105–06; [[w.marolda-united-states-navy-and]], 409–10, 414–19, 421 (the raids; the engagement; no reprisal, the warning to Hanoi, the patrol resumed); [[w.asselin-hanois-road-to-the]], 196 (the clash; the raids on the islands, which Hanoi called American); [[w.jian-maos-china-and-the]], 213 (by Lê Duẩn''s account to Mao, Aug. 13, the attack of Aug. 2 the local commander''s decision); [[w.zhai-china-and-the-vietnam]], 132 (the same); [[w.77-conversations-between-chinese]], [72 n.117](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=70) (the same: the editors'' summary of the conversation of Aug. 13); [[w.johnson-vantage-point]], 112–13; [[w.dallek-flawed-giant]], 147–49 (not the protest; Dallek has one boat sunk, another damaged, 147). To check: [[w.goulden-truth-is-the-first]]; [[w.galloway-gulf-of-tonkin-resolution]]; [[w.austin-presidents-war]]; [[w.windchy-tonkin-gulf]]; [[w.moise-tonkin-gulf-and-the-2019]]; [[w.johns-opening-pandoras-box]]; [[w.siff-why-the-senate-slept]]; [[w.hanyok-skunks-bogies-silent-hounds]]; [[w.hanyok-spartans-in-darkness]]; [[w.shultz-secret-war-against-hanoi]]; [[w.conboy-spies-and-commandos]]; [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.vandemark-into-the-quagmire]]; [[w.mcnamara-in-retrospect]]; [[w.taking-charge-2001]]; [[w.jim-in-love-and-war]]; msgs, CPFLT 261859Z Jan 1964 (cited by [[w.marolda-united-states-navy-and]], 410 n.38a, for the raids); COMUSMACV 230715Z Jul (cited by [[w.marolda-united-states-navy-and]], 410 n.38b, for the raids); COMUSMACV 010321Z Aug (cited by [[w.marolda-united-states-navy-and]], 410 n.38c, for the raids); 070231Z (cited by [[w.marolda-united-states-navy-and]], 410 n.38d, for the raids); 070253Z (cited by [[w.marolda-united-states-navy-and]], 410 n.38e, for the raids); Special Operations Division, SACSA, Talking Paper, "Operation Plan 34A Maritime Operations in the Gulf of Tonkin, July/August" (cited by [[w.marolda-united-states-navy-and]], 410 n.38f, for the raids); SACSA, "Description of South Vietnamese Operations on 30/31 July 1964" (cited by [[w.marolda-united-states-navy-and]], 410 n.38g, for the raids); SACSA, Chart of 30/31 July 1964 34A operation (cited by [[w.marolda-united-states-navy-and]], 410 n.38h, for the raids); MACV, Command History, 1964, Ann A, pp. IV-2-IV-4 (cited by [[w.marolda-united-states-navy-and]], 410 n.38i, for the raids); Bucklew, Interview with Mason, pp. 366-79 (cited by [[w.marolda-united-states-navy-and]], 410 n.38j, for the raids); Mulford, Interview (cited by [[w.marolda-united-states-navy-and]], 410 n.38k, for the raids); Maddox, Action Report, ser 003 of 24 Aug 1964, p. 10 (cited by [[w.marolda-united-states-navy-and]], 417 n.52a, for the engagement); Maddox, Deck Log, 1-31 Aug (cited by [[w.marolda-united-states-navy-and]], 417 n.52b, for the engagement); msgs, CTG72.1 020807Z (cited by [[w.marolda-united-states-navy-and]], 417 n.52c, for the engagement); 020808Z (cited by [[w.marolda-united-states-navy-and]], 417 n.52d, for the engagement); 020949Z (cited by [[w.marolda-united-states-navy-and]], 417 n.52e, for the engagement); CTG77.5 021008Z (cited by [[w.marolda-united-states-navy-and]], 417 n.52f, for the engagement); Cavalier 131115Z Jul 1966 (cited by [[w.marolda-united-states-navy-and]], 417 n.52g, for the engagement); SSO MACV 031107Z Mar 1968 (cited by [[w.marolda-united-states-navy-and]], 417 n.52h, for the engagement); Msg, JCS 021725Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 421 n.63a, for the orders); Vietnam Information Group, "Presidential Decisions: The Gulf of Tonkin Attacks of August 1964," Nov. 1, 1968, *Declassified Documents Reference System* (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 519 n.100); CINCPAC Command History 1964, 367–69; NMCC OPSUM 100-64, Aug. 3, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 105 nn.15–16); William P. Bundy, manuscript history of the Vietnam War, chap. 14, pp. 19–22, LBJ Library; McGeorge Bundy to Reedy, Aug. 7, 1964: "A brief chronology of events—Aug. 3–7", NSF: Memos to the President, LBJ Library; Chronology on Vietnam, Nov. 1965, NSF: Bundy File, LBJ Library; Telephone conversations, Ball–McNamara, 9:55, 10:40 a.m.; Ball–Bundy, 10:15, 10:40 a.m., 4:30 p.m., Aug. 3, 1964, George Ball Papers; George W. Ball OH, LBJ Library (cited by [[w.dallek-flawed-giant]], 149); the transcript of Mao''s conversations with Lê Duẩn, Aug. 13, 1964, Chinese Central Archives (cited by [[w.jian-maos-china-and-the]], 213 n.36, for Lê Duẩn''s account); the verbatim record of the International Control Commission''s 668th meeting, Aug. 13, 1964, and Washington to Ottawa, Aug. 8, 1964, RG 25, Library and Archives Canada (cited by [[w.asselin-hanois-road-to-the]], 196 n.151, for the raids). See [[cal.1964-07-27.vietnam]]. Names: Johnson. Check: *Victory in Vietnam* has three boats of the 135th Torpedo Boat Group drive off the Maddox and shoot down one aircraft (132).'
