  - id: cal.1964-08-03.vietnam-congress
    when: Aug. 3
    date: '1964-08-03'
    thread: vietnam-congress
    c: 'Afternoon, the Capitol: Rusk, McNamara and Wheeler brief 25 Senators of Foreign Relations and Armed Services and the leaders, in secret. The attack "entirely unprovoked." Russell, to the press after: South Vietnamese naval operations in the Gulf could have "confused" the North Vietnamese.'
    n: '[[w.gibbons-u-s-government-and]], II, 287; [[w.mcnamara-in-retrospect]], ch. 5 (3 p.m., in closed session; Rusk and McNamara describe the 34A operations, the attack, the decision not to retaliate; the patrols and the raids to go on; no record of the meeting found by McNamara). [[w.mann-grand-delusion]], 348 (the briefing; "entirely unprovoked"); [[w.woods-fulbright]], 350 (the briefing of the two committees; Morse convinced the administration meant war); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 519 (McNamara on the Chiefs'' contingency plans for reprisal strikes against North Vietnam). Check: McNamara names Rusk and himself, not Wheeler, and has the committees told of the 34A operations (ch. 5). To check: [*New York Times*, Aug. 4, 1964](https://timesmachine.nytimes.com/timesmachine/1964/08/04/issue.html); Austin, *The President''s War*, 28 (cited by [[w.gibbons-u-s-government-and]], II, 287 nn.20–21). See [[cal.1964-08-02.vietnam]]. Names: Rusk, McNamara, Wheeler, Russell.'
    src:
