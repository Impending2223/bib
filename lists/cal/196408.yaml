  - id: cal.1964-08-02.states-and-cities-jersey-city
    when: Aug. 2–4
    date: '1964-08-02'
    thread: states-and-cities
    c: 'Jersey City. A woman''s arrest in the Lafayette section, Aug. 2; three nights of rock-throwing, window-breaking and looting. Aug. 3, Whelan meets the neighborhood''s leaders: recreation, Negro policemen and jobs asked. Check the figures of hurt and arrested.'
    n: '[*New York Times*, Aug. 4, 1964](https://timesmachine.nytimes.com/timesmachine/1964/08/04/issue.html); [Aug. 5](https://timesmachine.nytimes.com/timesmachine/1964/08/05/issue.html). To check: [[w.flamm-law-and-order]]; [[w.sugrue-sweet-land-of-liberty]]. See [[cal.1964-07-18.states-and-cities]]. Names: Whelan.'
    tags: [state:nj, city:jersey-city, name:whelan-thomas-j]
  - id: cal.1964-08-03.vietnam
    when: Aug. 3
    date: '1964-08-03'
    thread: vietnam
    also: [vietnam-congress]
    c: 'Morning, Fulbright to Ball by telephone, the day after the attack on the Maddox: "a little suspicious," the incident "probably" asked for.'
    n: '[[w.dallek-flawed-giant]], 148. To check: the Ball-Fulbright telcon, Aug. 3, 1964, George Ball Papers (cited by [[w.dallek-flawed-giant]], 148). See [[cal.1964-08-02.vietnam]]. Names: Fulbright, Ball.'
