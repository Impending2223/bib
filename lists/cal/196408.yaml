  - id: cal.1964-08-01.robert-kennedy-2
    when: Aug. 1
    date: '1964-08-01'
    time: 1964-08-01T21:42Z
    thread: robert-kennedy
    c: 'Johnson to O''Brien by telephone, 5:42 p.m., angry at the wire story that Kennedy received a "barrage of messages" from supporters angered at his exclusion: talk to O''Donnell, or "I''m going to sock him right in the puss."'
    n: '[Johnson and Lawrence O''Brien, 5:42 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-and-office-noise-august-1-1964), Conversation WH6408-02-4619 (Miller Center). [[w.taking-charge]], 493. Names: Johnson, O''Brien, Robert Kennedy, O''Donnell.'
    src:
      c: 6fbb06d9
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-and-office-noise-august-1-1964: A'
