  - id: cal.1964-08-01.south-asia
    when: Aug. 1
    date: '1964-08-01'
    thread: south-asia
    c: 'Wheeler, just Chairman, to Musa: too little time to arrange "an orderly and successful exercise" this year. Aug. 5, Adams receives Musa''s letter dated July 31, asking American officers for detailed planning in Pakistan; on the Chiefs'' instruction, Adams defers all action.'
    n: '[[w.poole-joint-chiefs-of-staff]], 276–77. See [[cal.1964-07.south-asia]]. Names: Wheeler.'
    src:
