    c: 'The congressional leaders at the White House, 6:45 p.m., by Jenkins''s notes. McNamara on the second attack; Rusk: "we are not going to run out of South East Asia." Russell: "I hope you will keep going until they get the last one of them." Hickenlooper: the President to prepare the resolution he thinks proper. Johnson: "I don''t think any resolution is necessary, but I think it is a lot better to have it in the light of what we did in Korea." McCormack: "a united front"; Halleck: "no partisanship among us." Mansfield: "I don''t know how much good it will do"; "a minor third rate state"; "The Communists won''t be faced down." Johnson: "I have told you what I want from you." Fulbright: "I will support it." Aiken: "By the time you send it up there won''t be anything for us to do but support you."'
    n: '[FRUS 1964–68, I, doc. 280](https://history.state.gov/historicaldocuments/frus1964-68v01/d280) (notes by Walter Jenkins; Kuchel, Vinson and Morgan also present). [[w.mann-grand-delusion]], 353–54; [[w.mcnamara-in-retrospect]], ch. 5 at n.10 (Rusk: the attack a serious decision, not accidental; Johnson to submit a resolution; several leaders for it). [[w.rusk-as-i-saw-it-1990]], 444–45 (the meeting); [[w.branch-pillar-of-fire]], 435–36; [[w.bernstein-guns-or-butter]], 337 (approval of the strikes and the resolution, Mansfield excepted); [[w.woods-fulbright]], 350–51 (Mansfield''s paper "expressing general opposition"; Russell; McNamara: "if we tucked our tails"; the Republicans for); [[w.dallek-flawed-giant]], 153 (Johnson on the resolution and Korea; Aiken); [[w.logevall-choosing-war]], 198–99 (the leaders at the White House "in the early evening," no hour: Johnson, "I have told you what I want from you"; Aiken, "By the time you send [the resolution] up here there won''t be anything for us to [do] but support you"). Check: Mann dates the meeting "the evening of August 5." See [[cal.1964-08-04.vietnam]]. Check: Woods (350) has Johnson call the leaders in the morning of the fourth, citing the Summary of Leadership Meeting, Aug. 4, 1964, Meeting Notes File, box 1, LBJ Library. Check: Logevall, 199, has Mansfield: "The Communists won''t be forced down.". To check: Notes taken at leadership meeting on Aug. 4, 1964, Box 1, Meeting Notes File, LBJ Library (cited by [[w.branch-pillar-of-fire]], 435); Notes taken at leadership meeting on Aug. 4, 1964, Box 1, Meeting Notes File, LBJ, LBJ Library (cited by [[w.dallek-flawed-giant]], 153 n.82). Names: McNamara, Rusk, Russell, Hickenlooper, Johnson, McCormack, Halleck, Mansfield, Fulbright, Aiken. Check: Rusk gives about thirty leaders, Johnson reminding them of Taft and Truman in 1950, and the leadership urging a short resolution ([[w.rusk-as-i-saw-it-1990]], 444–45).'
