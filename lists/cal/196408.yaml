    c: 'Peking, on the Gulf of Tonkin. Zhou Enlai and Luo Ruiqing cable Hồ Chí Minh, Phạm Văn Đồng and Văn Tiến Dũng for closer military collaboration. The Central Military Commission puts the Kunming and Guangzhou military regions and the air and naval units of the south on combat readiness. The government''s statement: aggression against the Democratic Republic is aggression against China, which will not fail to come to its aid.'
    n: '[[w.jian-maos-china-and-the]], 212–14 (by the Chinese records); [[w.zhai-china-and-the-vietnam]], 132 (the cable, Aug. 5; the readiness order, not dated). Washington''s knowledge: [FRUS 1964–68, I, doc. 318](https://history.state.gov/historicaldocuments/frus1964-68v01/d318) (Saigon, Aug. 17: MiGs at Phúc Yên). To check: *Beijing Review*, Nov. 30, 1979, 14 (cited by [[w.jian-maos-china-and-the]], 213 n.34, for the cable); the government''s statement, *Renmin ribao*, Aug. 6, 1965 (so cited), and Mao''s approval of it, *Jianguo yilai Mao Zedong wengao*, 11:120 (cited by [[w.jian-maos-china-and-the]], 214 n.42, for the statement); Li Ke and Hao Shengzhang, *Wenhua dageming zhong de renmin jiefang jun* (1989), 408, and Qu Aiguo, "Chinese Supporters in the Operations to Assist Vietnam and Resist America," *Junshi shilin*, no. 6 (1989), 40 (cited by [[w.jian-maos-china-and-the]], 213 n.34, for the cable); the readiness order of Aug. 5, as Wang Dinglie, *Dangdai zhongguo kongjun* (1989), 384, quotes it (cited by [[w.jian-maos-china-and-the]], 213 n.35). Made public: the cable, *Beijing Review*, Nov. 30, 1979, by Chen''s note (354 n.34). See [[cal.1964-08-02.vietnam]]. Names: Zhou Enlai, Hồ Chí Minh, Phạm Văn Đồng. Check: the statement''s day; Chen''s note (355 n.42) gives the *People''s Daily* of Aug. 6, 1965.'
