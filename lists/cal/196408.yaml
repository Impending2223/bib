  - id: cal.1964-08-01.vietnam-34a
    when: Aug. 1
    date: '1964-08-01'
    thread: vietnam-34a
    c: 'Westmoreland asks "ASAP, policy reading on stand off bombardment of DRV coastal targets": unless told otherwise, the boats to shell the Vinh Sơn radar and a post on the Ròn River Aug. 3. Not told otherwise.'
    n: '[[w.marolda-united-states-navy-and]], 409. To check: msg, COMUSMACV 010717Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 409 n.37). Names: Westmoreland.'
