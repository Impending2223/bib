    n: '*Randall v. Sumter School District No. 2*, [232 F. Supp. 786](https://static.case.law/f-supp/232/case-pdfs/0786-01.pdf) (E.D.S.C. 1964). See [[cal.1964-07-29.desegregation-schools]]. Names: Hemphill.'
    tags: [name:hemphill-robert-w]
