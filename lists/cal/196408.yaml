        - 'via x.1964-08-03.msg-com7flt-030553z-aug-1964: all'
    tags: [name:herrick-john-j]
  - id: cal.1964-08-03.vietnam-34a
    when: Aug. 3–4
    date: '1964-08-03'
    time: 1964-08-03T16:00Z
    thread: vietnam-34a
    also: [vietnam-tonkin]
    c: 'The second 34A raid: PTF-1 and PTF-5 shell the radar at Vinh Sơn from midnight, 770 rounds in twenty-five minutes; PTF-6 the security post at the Ròn River''s mouth, chased off by a boat. All back at Đà Nẵng by 0715H Aug. 4. PTF-2 turned back with engine failure.'
    n: '[[w.marolda-united-states-navy-and]], 424. To check: Joint Staff, JCS, "Description of South Vietnamese Operations on 3/4 August 1964" (cited by [[w.marolda-united-states-navy-and]], 424 n.68). See [[cal.1964-07-30.vietnam-34a]].'
    src:
