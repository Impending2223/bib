        - 'via x.1964-08-01.johnson-lawrence-o-brien-telephone-1742: all'
    tags: [name:johnson-lyndon-b, name:obrien-lawrence-f, name:kennedy-robert-f, name:odonnell-kenneth-p]
  - id: cal.1964-08-01.elections-1964-johnson
    when: Aug. 1
    date: '1964-08-01'
    time: 1964-08-01T15:00Z
    thread: elections-1964-johnson
    c: 'Smathers to Johnson by telephone: "Raymond Guest wants to contribute to you but he still wants to be ambassador to Ireland." Fifty thousand, maybe more. Johnson: "He oughta give a hun''red thousand."'
    n: '[[w.perlstein-before-the-storm]], 398–99. To check: [Johnson and Smathers](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-smathers-august-1-1964), Conversation WH6408-01-4604 (Miller Center; not heard) (cited by [[w.perlstein-before-the-storm]], 398 n.4, as LBJT 6408.01/4). Check: the day; Perlstein sets it the morning of the first attack in the Gulf, Aug. 2; the tape is catalogued Aug. 1, 11 a.m. Names: Smathers, Johnson, Guest.'
    src:
      c: 6e287ce3
      rows:
        - 'w.perlstein-before-the-storm 398–99: all'
        - 'via w.perlstein-before-the-storm 398 n.4: all'
    tags: [name:smathers-george-a, name:johnson-lyndon-b, name:guest-raymond-r]
  - id: cal.1964-08-02.vietnam
    when: Aug. 2–3
    date: '1964-08-02'
    thread: vietnam
    c: 'Gulf of Tonkin. The destroyer Maddox, on a DeSoto patrol off North Vietnam, attacked by three torpedo boats in the afternoon, Saigon time; the Maddox and planes from the Ticonderoga hit all three. South Vietnamese raiders under OPLAN 34A had shelled Hòn Mê and Hòn Ngư, July 30–31. Johnson: no reprisal; a protest to Hanoi. Aug. 3, his statement: the patrol doubled, orders to destroy any attacker.'
    n: 'FRUS 1964–68, I, docs. [255](https://history.state.gov/historicaldocuments/frus1964-68v01/d255), [258](https://history.state.gov/historicaldocuments/frus1964-68v01/d258), [265](https://history.state.gov/historicaldocuments/frus1964-68v01/d265); [doc. 260](https://history.state.gov/historicaldocuments/frus1964-68v01/d260) (State''s 328 to Saigon, Aug. 2: the DeSoto patrol). Statement by the President Upon Instructing the Navy To Take Retaliatory Action in the Gulf of Tonkin, [1963–64 Pub. Papers 926](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=166) (Aug. 3, 1964). *The Gulf of Tonkin, the 1964 Incidents* (K–J Cong. II.J.3). [President''s Daily Diary, Aug. 2, 1964](https://catalog.archives.gov/id/192444), image 1; [Aug. 3](https://catalog.archives.gov/id/192445), image 1 (LBJ Library; National Archives Catalog). [[w.gibbons-u-s-government-and]], II, 285–86 (the attack and the reply; Johnson''s choice not to retaliate, by *The Vantage Point*; the patrol augmented, the Turner Joy with the Maddox Aug. 3); [[w.frankum-like-rolling-thunder]], 13–14 (the raids of July 30–31; the attack of Aug. 2, the Maddox and the Ticonderoga''s planes); [[w.vietnam-victory-in-vietnam]], 132 (the attack of Aug. 2, three boats of the 135th Torpedo Boat Group); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 519 (the attack and the reply; the raids of July 30–31; no reprisal; the protest); [[w.cosmas-joint-chiefs-of-staff-2012]], 105–06; [[w.marolda-united-states-navy-and]], 409–10, 414–19, 421 (the raids; the engagement; no reprisal, the warning to Hanoi, the patrol resumed); [[w.asselin-hanois-road-to-the]], 196 (the clash; the raids on the islands, which Hanoi called American); [[w.jian-maos-china-and-the]], 213 (by Lê Duẩn''s account to Mao, Aug. 13, the attack of Aug. 2 the local commander''s decision); [[w.zhai-china-and-the-vietnam]], 132 (the same); [[w.77-conversations-between-chinese]], [72 n.117](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=70) (the same: the editors'' summary of the conversation of Aug. 13); [[w.johnson-vantage-point]], 112–13; [[w.dallek-flawed-giant]], 147–49 (not the protest; Dallek has one boat sunk, another damaged, 147). [[w.logevall-choosing-war]], 196–97 (the attack of Aug. 2 by three patrol boats; the DeSoto patrol; the 34A raids nearby); [[w.moyar-triumph-forsaken]], 310–11; [[w.mcnamara-in-retrospect]], ch. 5 at nn.1–3 (the 34A raid the night of July 30 on two islands; the Maddox attacked at 3:40 p.m., 3:40 a.m. in Washington; the meeting at 11:30 a.m., Vance for Defense: perhaps a local commander''s initiative; no retaliation, a protest, the Turner Joy added to the patrol). [[w.macv-command-history-1964]], 109 (the attack of Aug. 2, the Ticonderoga''s planes); [[w.branch-pillar-of-fire]], 430–33; [[w.bernstein-guns-or-butter]], 335–36 (the first raid July 30, four boats from Đà Nẵng; two torpedoes missed, the third a dud; one machine-gun bullet on the Maddox); [[w.taking-charge]], 493 & n.5. To check: [[w.goulden-truth-is-the-first]]; [[w.galloway-gulf-of-tonkin-resolution]]; [[w.austin-presidents-war]]; [[w.windchy-tonkin-gulf]]; [[w.moise-tonkin-gulf-and-the-2019]]; [[w.johns-opening-pandoras-box]]; [[w.siff-why-the-senate-slept]]; [[w.hanyok-skunks-bogies-silent-hounds]]; [[w.hanyok-spartans-in-darkness]]; [[w.shultz-secret-war-against-hanoi]]; [[w.conboy-spies-and-commandos]]; [[w.kaiser-american-tragedy]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.vandemark-into-the-quagmire]]; [[w.taking-charge-2001]]; [[w.jim-in-love-and-war]]; msgs, CPFLT 261859Z Jan 1964 (cited by [[w.marolda-united-states-navy-and]], 410 n.38a, for the raids); COMUSMACV 230715Z Jul (cited by [[w.marolda-united-states-navy-and]], 410 n.38b, for the raids); COMUSMACV 010321Z Aug (cited by [[w.marolda-united-states-navy-and]], 410 n.38c, for the raids); 070231Z (cited by [[w.marolda-united-states-navy-and]], 410 n.38d, for the raids); 070253Z (cited by [[w.marolda-united-states-navy-and]], 410 n.38e, for the raids); Special Operations Division, SACSA, Talking Paper, "Operation Plan 34A Maritime Operations in the Gulf of Tonkin, July/August" (cited by [[w.marolda-united-states-navy-and]], 410 n.38f, for the raids); SACSA, "Description of South Vietnamese Operations on 30/31 July 1964" (cited by [[w.marolda-united-states-navy-and]], 410 n.38g, for the raids); SACSA, Chart of 30/31 July 1964 34A operation (cited by [[w.marolda-united-states-navy-and]], 410 n.38h, for the raids); MACV, Command History, 1964, Ann A, pp. IV-2-IV-4 (cited by [[w.marolda-united-states-navy-and]], 410 n.38i, for the raids); Bucklew, Interview with Mason, pp. 366–79 (cited by [[w.marolda-united-states-navy-and]], 410 n.38j, for the raids); Mulford, Interview (cited by [[w.marolda-united-states-navy-and]], 410 n.38k, for the raids); Maddox, Action Report, ser 003 of 24 Aug 1964, p. 10 (cited by [[w.marolda-united-states-navy-and]], 417 n.52a, for the engagement); Maddox, Deck Log, 1–31 Aug (cited by [[w.marolda-united-states-navy-and]], 417 n.52b, for the engagement); msgs, CTG72.1 020807Z (cited by [[w.marolda-united-states-navy-and]], 417 n.52c, for the engagement); 020808Z (cited by [[w.marolda-united-states-navy-and]], 417 n.52d, for the engagement); 020949Z (cited by [[w.marolda-united-states-navy-and]], 417 n.52e, for the engagement); CTG77.5 021008Z (cited by [[w.marolda-united-states-navy-and]], 417 n.52f, for the engagement); Cavalier 131115Z Jul 1966 (cited by [[w.marolda-united-states-navy-and]], 417 n.52g, for the engagement); SSO MACV 031107Z Mar 1968 (cited by [[w.marolda-united-states-navy-and]], 417 n.52h, for the engagement); Msg, JCS 021725Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 421 n.63a, for the orders); Vietnam Information Group, "Presidential Decisions: The Gulf of Tonkin Attacks of August 1964," Nov. 1, 1968, *Declassified Documents Reference System* (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 519 n.100); CINCPAC Command History 1964, 367–69; NMCC OPSUM 100-64, Aug. 3, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 105 nn.15–16); William P. Bundy, manuscript history of the Vietnam War, chap. 14, pp. 19–22, LBJ Library; McGeorge Bundy to Reedy, Aug. 7, 1964: "A brief chronology of events—Aug. 3–7", NSF: Memos to the President, LBJ Library; Chronology on Vietnam, Nov. 1965, NSF: Bundy File, LBJ Library; Telephone conversations, Ball–McNamara, 9:55, 10:40 a.m.; Ball–Bundy, 10:15, 10:40 a.m., 4:30 p.m., Aug. 3, 1964, George Ball Papers; George W. Ball OH, LBJ Library (cited by [[w.dallek-flawed-giant]], 149); the transcript of Mao''s conversations with Lê Duẩn, Aug. 13, 1964, Chinese Central Archives (cited by [[w.jian-maos-china-and-the]], 213 n.36, for Lê Duẩn''s account); the verbatim record of the International Control Commission''s 668th meeting, Aug. 13, 1964, and Washington to Ottawa, Aug. 8, 1964, RG 25, Library and Archives Canada (cited by [[w.asselin-hanois-road-to-the]], 196 n.151, for the raids); Võ Nguyên Giáp to McNamara, Dec. 5, 1995, in [[w.mcnamara-argument-without-end]], 167 (cited by [[w.jian-maos-china-and-the]], 212 n.33, for the attack of Aug. 2 a local commander''s order); On the August 2 Gulf of Tonkin incident, see Karnow, Vietnam, pp. 380–84 (cited by [[w.branch-pillar-of-fire]], 430); [[w.johnson-vantage-point]], 112–13 (cited by [[w.branch-pillar-of-fire]], 430); Newsweek, Aug. 17, 1964, p. 19 (cited by [[w.branch-pillar-of-fire]], 431); New York Times, Aug. 4, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]], 433). See [[cal.1964-07-27.vietnam]]. Names: Johnson. Check: *Victory in Vietnam* has three boats of the 135th Torpedo Boat Group drive off the Maddox and shoot down one aircraft (132). Check: Moyar, 310–11, from Hanoi''s histories and Bùi Tín, has Lê Duẩn order the attack and a later message countermand it.'
