    c: 'After Pierce Arrow, more than eighty Air Force fighter, reconnaissance and refueling aircraft redeployed from the Philippines, Okinawa and Japan to South Vietnam and Thailand: F-102s to Đà Nẵng and Tân Sơn Nhứt, F-100s to Đà Nẵng and Takhli, thirty-six B-57s to Biên Hòa (one destroyed, two damaged on Clark''s wet runway), F-105s to Korat, KB-50s. From Aug. 8 to 21, Strike Command''s composite force: F-100s and RF-101s, forty-eight C-130s, fifty-six SAC KC-135s to Guam and Clark.'
