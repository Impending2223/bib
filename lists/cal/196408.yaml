  - id: cal.1964-08-06.vietnam-congress
    when: Aug. 6–7
    date: '1964-08-06'
    thread: vietnam-congress
    c: 'The Senate debates the Southeast Asia resolution. Nelson: does it agree in advance to "as many divisions as deemed necessary"? Fulbright: a grave decision for later, Congress able to end the resolution by concurrent resolution. Morse: a "snow-job" by the Pentagon and State. Gore: doubts "water over the dam"; Aiken "apprehensive," but with the President. Mansfield opens: "in the hope of restraining the dogs of war." McGovern: why would North Vietnam seek a naval fight? Fulbright: the destroyers "entirely unconnected" with any South Vietnamese forays. Brewster: armies in Vietnam or China? Fulbright: the language "would not prevent it." Cooper: advance authority? Fulbright: "I think that is correct." Russell: "Our national honor is at stake." Aug. 7, Nelson''s amendment, the role limited to aid, training and advice: Fulbright will not take it to conference. Morse, near two hours: "a predated declaration of war"; Gruening with him.'
    n: '[110 Cong. Rec. 18,399–471](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-3-2.pdf) (1964) (Aug. 6–7). [[w.gibbons-u-s-government-and]], II, 316–25; [[w.mcnamara-in-retrospect]], ch. 5 at n.13 (Cooper and Fulbright: "That is the way I would interpret it"). [[w.mann-grand-delusion]], 361–66; [[w.woods-fulbright]], 354–55 (Nelson; Gruening, "a predated declaration of war"; McGovern; Fulbright: "very unwise under any circumstances to put a large land army on the Asian Continent"); [[w.logevall-choosing-war]], 203–04 (Morse and Gruening alone raised serious objections; Morse spoke Aug. 5, 6 and 7). Check: Logevall, 204, gives "a predated declaration of war" to Gruening, not Morse; he has Nelson announce an amendment to avoid "a direct military involvement," which Fulbright moved against as unnecessary ("the last thing we want to do is to become involved in a land war in Asia"). See [[cal.1964-08-06.vietnam]]. Names: Nelson, Fulbright, Morse, Gore, Aiken, Mansfield, McGovern, Brewster, Cooper, Russell, Gruening.'
