    date: '1964-08-03'
    thread: goldwater
    also: [elections-1964]
    c: 'A survey of the States for the Goldwater campaign, by memorandum to Burch: disunity. New York: unions that usually back Republicans not for Goldwater, Negro leaders hostile, liberal officeholders against him. Massachusetts: the Lodge, Scranton and Goldwater camps still apart; Miller "should be sent in QUICKLY." Faubus "will NOT endorse Johnson" and backs Goldwater; not to be made public, "this would hurt nationally."'
