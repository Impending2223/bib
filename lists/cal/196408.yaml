  - id: cal.1964-08-01.robert-kennedy
    when: Aug. 1–2
    date: '1964-08-01'
    thread: robert-kennedy
    also: [elections-1964, democratic-party]
    c: 'Hyannis Port, with Harriman, Hackett and Schlesinger. Robert Kennedy on the Senate: a base independent of Johnson; a bloc of New Frontier Senators, Tydings, McGovern, Bayh, Salinger. New York only on a summons from a broad group in the party; Harriman to lead. The question Alex Rose and the Liberals. By Schlesinger''s journal.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 666. To check: Schlesinger, journal, Aug. 2, 1964 (cited by [[w.schlesinger-robert-kennedy-and-his]], 666 n.3). Names: Robert Kennedy, Harriman, Schlesinger, Tydings, McGovern, Bayh, Salinger, Johnson.'
    src:
      c: 4998059c
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 666: all'
        - 'via w.schlesinger-robert-kennedy-and-his 666 n.3: B-C'
    tags: [name:kennedy-robert-f, name:harriman-w-averell, name:schlesinger-arthur-m-jr, name:johnson-lyndon-b, state:ny]
  - id: cal.1964-08-01.transition-and-staff
    when: Aug. 1
    date: '1964-08-01'
    time: 1964-08-01T13:00Z
    thread: transition-and-staff
    c: 'Johnson: McNamara to be his "number one executive vice president in charge of the Cabinet" in his next term.'
    n: '[Johnson and Robert McNamara, 9:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-august-1-1964), Conversation WH6408-01-4601 (Miller Center). [[w.mcnamara-in-retrospect]], ch. 4. [[w.taking-charge]], 492. Check: to whom Johnson said it, and where. Check: [[w.taking-charge]], 492, prints "my executive vice president to help me direct this Cabinet.". Names: Johnson, McNamara.'
    src:
      c: b89a717a
      rows:
        - 'w.mcnamara-in-retrospect ch. 4: all'
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-august-1-1964: A'
        - 'w.taking-charge 492: A'
        - 'via x.1964-08-01.johnson-robert-mcnamara-telephone-0900: A'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1964-08-01.mississippi
    when: Aug. 1
    date: '1964-08-01'
    time: 1964-08-01T19:53Z
    thread: mississippi
    also: [civil-rights-the-executive, poverty]
    c: 'Johnson to Governor Sanders of Georgia by telephone: "they think they know where ... the boys in Mississippi are buried"; of the poverty bill, "This is my blood. This is it." Inspector Sullivan has paid an informant $30,000 for the place, the Burrage farm''s new dam; agents spread rumors in Philadelphia of rewards to Price, Rainey and others to hide him.'
    n: '[[w.branch-pillar-of-fire]], 430, 444. To check: [Conversation with CARL SANDERS, 3:53 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-sanders-august-1-1964), Conversation WH6408-02-4617 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 430); Interview with Joseph Sullivan, Feb. 3, 1991, July 26, 1996 (cited by [[w.branch-pillar-of-fire]], 430); Whitehead, Attack on Terror, pp. 127–28 (cited by [[w.branch-pillar-of-fire]], 430); [[w.cagin-we-are-not-afraid]], 394–96 (cited by [[w.branch-pillar-of-fire]], 430); Report of investigator A. L. Hopkins, Aug. 6, 1964, MSSC (cited by [[w.branch-pillar-of-fire]], 430); Rosen to Belmont, July 31, 1964, FMB-1191 (cited by [[w.branch-pillar-of-fire]], 430); [Conversation with CARL SANDERS, 3:53 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-sanders-august-1-1964), Conversation WH6408-02-4617 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 444). See [[cal.1964-06-23.mississippi]]. Names: Johnson, Sanders, Price, Rainey.'
    src:
      c: 9d30aa86
      rows:
        - 'w.branch-pillar-of-fire 430: all'
        - 'via w.branch-pillar-of-fire 430 n.they-think-they-know: A'
        - 'via w.branch-pillar-of-fire 430 n.blitz-was-designed.a: B'
        - 'via w.branch-pillar-of-fire 430 n.blitz-was-designed.b: B'
        - 'via w.branch-pillar-of-fire 430 n.whirlwind-of-gossip: B'
        - 'via w.branch-pillar-of-fire 430 n.in-a-case-such: B'
        - 'via w.branch-pillar-of-fire 444 n.this-is-my-blood: A'
    tags: [name:johnson-lyndon-b, name:sanders-carl-e, name:price-cecil-r, name:rainey-lawrence-a, state:ms]
  - id: cal.1964-08-01.poverty
    when: Aug. 1
    date: '1964-08-01'
    time: 1964-08-01T23:06Z
    thread: poverty
    also: [labor, elections-1964-freedom-democrats]
    c: 'Johnson to Reuther by telephone, on the poverty bill in the House: "We''ve bled ''em to death and we''ve wrung their arms and twisted ''em and bought ''em and everything else." Of the Mississippi challenge: the Alabama and Mississippi delegations to be seated "near the exits so they can leave voluntarily whenever they want."'
    n: '[[w.branch-pillar-of-fire]], 444 (the poverty bill); [[w.kotz-judgment-days]], 194 (the delegations "near the exits," the call by Kotz''s note, 7:06 p.m.). To check: [Conversation with WALTER REUTHER, 7:06 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-reuther-august-1-1964), Conversation WH6408-03-4624 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 444; by [[w.kotz-judgment-days]], 194 n.18). Names: Johnson, Reuther.'
    src:
      c: 9f3fe355
      rows:
        - 'w.branch-pillar-of-fire 444: A'
        - 'via w.branch-pillar-of-fire 444 n.we-ve-bled-em: A'
        - 'w.kotz-judgment-days 194: B'
        - 'via w.kotz-judgment-days 194 n.18: B'
    tags: [name:johnson-lyndon-b, name:reuther-walter]
  - id: cal.1964-08-01.poverty-2
    when: Aug. 1
    date: '1964-08-01'
    time: 1964-08-01T23:27Z
    thread: poverty
    c: 'Johnson to Mahon by telephone, 7:27 p.m.: "This is a party measure. This is party responsibility. If I lose this, it''s telegraphed around the world that, by gosh, the Republicans roll me and roll me good on the key measure, the only single Johnson measure that was sent up. Everything else was Kennedy."'
    n: '[[w.zelizer-fierce-urgency-of-now]], 135. To check: the recording, [Conversation with George Mahon](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-mahon-august-1-1964), Conversation WH6408-03-4626 (Miller Center) (cited by [[w.zelizer-fierce-urgency-of-now]], 135 n.6). See [[cal.1964-07-29.poverty]]. Names: Johnson, Mahon.'
    src:
      c: 6e3f4162
      rows:
        - 'w.zelizer-fierce-urgency-of-now 135: all'
        - 'via w.zelizer-fierce-urgency-of-now 135 n.6: all'
    tags: [name:johnson-lyndon-b, name:mahon-george-h]
  - id: cal.1964-08-01.king
    when: Aug. 1
    date: '1964-08-01'
    thread: king
    also: [democratic-party]
    c: 'Jenkins to DeLoach by telephone: the President concerned for his safety and his staff''s at the convention; would DeLoach head a team "to keep us advised of any potential threats"? Hoover to DeLoach: "Lyndon is way out of line"; "tell Walter we will give him whatever help he wants." The President''s wish: all the FBI could gather on the Freedom Democrats, their sixty-eight delegates, and SNCC, CORE and the SCLC. By DeLoach''s account.'
    n: '[[w.kotz-judgment-days]], 199. To check: [[w.deloach-hoovers-fbi]], 3–5 (cited by [[w.kotz-judgment-days]], 199 n.33).. Names: Jenkins, DeLoach, Hoover.'
    src:
      c: 2ddbf596
      rows:
        - 'w.kotz-judgment-days 199: all'
    tags: [name:jenkins-walter-w, name:deloach-cartha, name:hoover-j-edgar]
