    c: 'The Pacific concentration after Pierce Arrow: the Amphibious Ready Group with the Special Landing Force from Subic, the evening of Aug. 5, for central South Vietnam; the 9th Marine Expeditionary Brigade loading at Okinawa; the *Kearsarge* group south; the *Pine Island* to Đà Nẵng; an antisubmarine barrier off Taiwan and Luzon; the *Ranger* ordered west. By Aug. 12: the *Ticonderoga*, *Constellation*, *Kearsarge*, *Oklahoma City*, *Topeka*, 25 destroyers, 4 submarines, 10 minesweepers; three Marine battalions in 15 amphibious ships.'
    n: '[[w.marolda-united-states-navy-and]], 452–53. After Pierce Arrow: [[cal.1964-08-05.vietnam]]. To check: msg, CP 070422Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 453 n.32). See [[cal.1964-08-04.vietnam-tonkin]].'
