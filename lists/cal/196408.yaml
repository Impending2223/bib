  - id: cal.1964-08-04.goldwater
    when: Aug. 4
    date: '1964-08-04'
    time: 1964-08-05T02:06Z
    thread: goldwater
    also: [vietnam, elections-1964]
    c: 'Johnson calls Goldwater, 10:06 p.m., before his address on the Tonkin Gulf: reads him the statement; its timing, so as not to endanger the forces. Goldwater for the action. Goldwater, to the press: "We cannot allow the American flag to be shot at anywhere on earth if we are to retain our respect and prestige."'
    n: '[Johnson and Goldwater, 10:06 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-barry-goldwater-and-office-conversation-august), Conversation WH6408-06-4715 (Miller Center). [President''s Daily Diary, Aug. 4, 1964](https://catalog.archives.gov/id/192446), images 7, 9, 10 (LBJ Library; National Archives Catalog). [[w.johnson-vantage-point]], 117 (the call; Goldwater for the action); [[w.gibbons-u-s-government-and]], II, 295 (the call; Goldwater''s statement to the press, "the only thing he can do"); [[w.taking-charge]], 504; [[w.logevall-choosing-war]], 199 (Johnson''s telephone call to Goldwater after the leaders'' meeting and before the address: Goldwater backed the air strikes; not the hour, the reading of the statement or his words to the press). [[w.mann-grand-delusion]], 354 (Goldwater: "I think you''ve taken the right steps"); [[w.goldberg-barry-goldwater]], 215 (Goldwater: "I believe that it is the only thing he can do under the circumstances. We cannot allow the American flag to be shot at anywhere on earth if we are to retain our respect and prestige"; he votes for the resolution); [[w.bernstein-guns-or-butter]], 337. See [[cal.1964-08-04.vietnam]]. Names: Johnson, Goldwater. Check: the Daily Diary gives the call at 10:06 p.m. as Goldwater''s, returning the President''s (image 10).'
