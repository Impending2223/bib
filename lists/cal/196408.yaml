section: LVII
entries:
  - id: cal.1964-08-02.vietnam
    when: Aug. 2–3
    date: '1964-08-02'
    thread: vietnam
    c: 'Gulf of Tonkin. The destroyer Maddox, on a DeSoto patrol off North Vietnam, attacked by three torpedo boats in the afternoon, Saigon time; the Maddox and planes from the Ticonderoga hit all three. South Vietnamese raiders under OPLAN 34A had shelled Hòn Mê and Hòn Ngư, July 30–31. Johnson: no reprisal; a protest to Hanoi. Aug. 3, his statement: the patrol doubled, orders to destroy any attacker.'
    n: 'FRUS 1964–68, I, docs. [255](https://history.state.gov/historicaldocuments/frus1964-68v01/d255), [258](https://history.state.gov/historicaldocuments/frus1964-68v01/d258), [265](https://history.state.gov/historicaldocuments/frus1964-68v01/d265). Statement by the President Upon Instructing the Navy To Take Retaliatory Action in the Gulf of Tonkin, [1963–64 Pub. Papers 926](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=166) (Aug. 3, 1964). *The Gulf of Tonkin, the 1964 Incidents* (K–J Cong. II.J.3). [President''s Daily Diary, Aug. 2, 1964](https://catalog.archives.gov/id/192444), image 1; [Aug. 3](https://catalog.archives.gov/id/192445), image 1 (LBJ Library; National Archives Catalog). [[w.goulden-truth-is-the-first]]; [[w.galloway-gulf-of-tonkin-resolution]]; [[w.austin-presidents-war]]; [[w.windchy-tonkin-gulf]]; [[w.moise-tonkin-gulf-and-the-2019]]; [[w.johns-opening-pandoras-box]]; [[w.siff-why-the-senate-slept]]; [[w.hanyok-skunks-bogies-silent-hounds]]; [[w.hanyok-spartans-in-darkness]]; [[w.shultz-secret-war-against-hanoi]]; [[w.conboy-spies-and-commandos]]; [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.vandemark-into-the-quagmire]]; [[w.mcnamara-in-retrospect]]; [[w.johnson-vantage-point]]; [[w.taking-charge-2001]]; [[w.jim-in-love-and-war]]; [[w.gibbons-u-s-government-and]], II, 285–286; [[w.frankum-like-rolling-thunder]], 13–14. See [[cal.1964-07-27.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, place:gulf-of-tonkin, place:hon-me, place:hon-ngu]
  - id: cal.1964-08-02.states-and-cities-jersey-city
    when: Aug. 2–4
    date: '1964-08-02'
    thread: states-and-cities
    c: 'Jersey City. A woman''s arrest in the Lafayette section, Aug. 2; three nights of rock-throwing, window-breaking and looting. Aug. 3, Whelan meets the neighborhood''s leaders: recreation, Negro policemen and jobs asked. Check the figures of hurt and arrested.'
    n: '[*New York Times*, Aug. 4, 1964](https://timesmachine.nytimes.com/timesmachine/1964/08/04/issue.html); [Aug. 5](https://timesmachine.nytimes.com/timesmachine/1964/08/05/issue.html). [[w.flamm-law-and-order]]; [[w.sugrue-sweet-land-of-liberty]]. See [[cal.1964-07-18.states-and-cities]]. Names: Whelan.'
    tags: [state:nj, city:jersey-city, name:whelan-thomas-j]
  - id: cal.1964-08-04.vietnam
    when: Aug. 4
    date: '1964-08-04'
    thread: vietnam
    c: 'A second attack reported, at night, on the Maddox and the C. Turner Joy. By early afternoon in Washington, Herrick, commanding the patrol: many contacts and torpedoes "doubtful," "freak weather effects," "over-eager sonarmen"; a "complete evaluation" asked. The NSC and the congressional leaders; strikes ordered. Johnson on television, 11:36 p.m.: "limited and fitting"; "We still seek no wider war."'
    n: 'Radio and Television Report to the American People Following Renewed Aggression in the Gulf of Tonkin, [1963–64 Pub. Papers 927](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=167) (Aug. 4, 1964). FRUS 1964–68, I, docs. [272](https://history.state.gov/historicaldocuments/frus1964-68v01/d272), [276](https://history.state.gov/historicaldocuments/frus1964-68v01/d276), [278](https://history.state.gov/historicaldocuments/frus1964-68v01/d278), [280](https://history.state.gov/historicaldocuments/frus1964-68v01/d280), [286](https://history.state.gov/historicaldocuments/frus1964-68v01/d286). [President''s Daily Diary, Aug. 4, 1964](https://catalog.archives.gov/id/192446), images 3, 5, 8, 11 (LBJ Library; National Archives Catalog). [[w.gibbons-u-s-government-and]], II, 287–297. See [[cal.1964-08-02.vietnam]]. Names: Herrick, Johnson.'
    tags: [name:herrick-john-j, name:johnson-lyndon-b, name:mcnamara-robert-s, place:gulf-of-tonkin]
  - id: cal.1964-08-04.mississippi
    when: Aug. 4
    date: '1964-08-04'
    thread: mississippi
    c: FBI agents, on an informant's word, dig the bodies of Chaney, Goodman, and Schwerner out of an earthen dam southwest of Philadelphia. All three shot.
    n: '*United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966). [[w.dittmer-local-people]]; [[w.mcadam-freedom-summer]]; [[w.branch-pillar-of-fire]]. See [[cal.1964-06-21.mississippi]]. Names: Chaney, Goodman, Schwerner.'
    tags: [name:chaney-james-e, name:goodman-andrew, name:schwerner-michael]
  - id: cal.1964-08-04.congress
    when: Aug. 4–5
    date: '1964-08-04'
    thread: congress
    also: [elections-1964]
    c: Engle dead, July 30. Brown appoints Salinger, the Democratic nominee, to the seat. Aug. 5, the Senate swears him in, [59–29](https://voteview.com/rollcall/RS0880477), his residence in California referred to the Rules Committee.
    n: '[110 Cong. Rec., Senate, Aug. 5, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-2-1.pdf). See [[cal.1964-06-02.elections-1964]]. Names: Engle, Brown, Salinger.'
    tags: [name:engle-clair, name:brown-edmund-g, name:salinger-pierre]
  - id: cal.1964-08-04.goldwater
    when: Aug. 4
    date: '1964-08-04'
    thread: goldwater
    also: [vietnam, elections-1964]
    c: 'Johnson calls Goldwater, 10:06 p.m., before his address on the Tonkin Gulf: reads him the statement; its timing, so as not to endanger the forces. Goldwater for the action.'
    n: '[Johnson and Goldwater, 10:06 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-barry-goldwater-and-office-conversation-august), Conversation WH6408-06-4715 (Miller Center). [President''s Daily Diary, Aug. 4, 1964](https://catalog.archives.gov/id/192446), images 7, 9, 10 (LBJ Library; National Archives Catalog). See [[cal.1964-08-04.vietnam]]. Names: Johnson, Goldwater. Check: the Daily Diary gives the call at 10:06 p.m. as Goldwater''s, returning the President''s (image 10).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-08-04.governors-mo
    when: Aug. 4
    date: '1964-08-04'
    thread: governors
    also: [elections-1964]
    c: 'Missouri, governor. Democratic primary: Hearnes, the secretary of state, 51.9 percent, Bush 44.0, three others 4.1. Republican: Shepley 75.7, three others 24.3.'
    n: '[*Official Manual, State of Missouri, 1965–1966*, 1306–1307](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/38212). [[w.peirce-great-plains-states-of]]. Names: Hearnes, Bush, Shepley.'
    tags: [state:mo, name:hearnes-warren-e, name:bush-hilary-a, name:shepley-ethan-a-h]
  - id: cal.1964-08-04.governors-ks
    when: Aug. 4
    date: '1964-08-04'
    thread: governors
    also: [elections-1964]
    c: 'Kansas, governor; Governor Anderson not running. Republican primary: U.S. Representative Avery 30.4 percent, Boyd 26.7, Wunsch 25.4, five others 17.5. Democratic: Wiles 32.4, Doty 23.9, four others 43.7.'
    n: 'Votes: Kan. Secretary of State, *Election Statistics, 1964*, [16–20](https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/59/download#page=16): Avery 85,746, Boyd 75,451, Wunsch 71,601, Ferguson 36,622, Chase 8,397, Myers 1,615, Crozier 1,604, Dohm 1,128; Wiles 50,590, Doty 37,305, Hart 30,973, Henkle 21,304, Coffin 9,140, Stewart 6,783. [[w.socolofsky-kansas-governors]]. Names: John Anderson, Avery, Boyd, Wunsch, Wiles, Doty.'
    tags: [state:ks, name:anderson-john-jr, name:avery-william-h, name:boyd-mcdill, name:wunsch-paul-r, name:wiles-harry-g, name:doty-jules-v]
  - id: cal.1964-08-05.vietnam
    when: Aug. 5
    date: '1964-08-05'
    thread: vietnam
    c: Pierce Arrow. Planes from the Ticonderoga and the Constellation strike the torpedo boat bases and the oil depot at Vinh, 64 sorties. Two planes lost; Alvarez taken, the first American airman held in the North. Johnson at Syracuse; his message asks Congress for a resolution.
    n: 'Special Message to the Congress on U.S. Policy in Southeast Asia, [1963–64 Pub. Papers 930](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=170); Remarks at Syracuse University on the Communist Challenge in Southeast Asia, [1963–64 Pub. Papers 928](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=168) (Aug. 5, 1964). [FRUS 1964–68, I, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v01/d286). [[w.moise-tonkin-gulf-and-the-2019]]; [[w.gibbons-u-s-government-and]], II, 297–298; [[w.frankum-like-rolling-thunder]], 15. See [[cal.1964-08-02.vietnam]]. Names: Alvarez, Johnson.'
    tags: [name:alvarez-everett-jr, name:johnson-lyndon-b, place:vinh]
  - id: cal.1964-08-05.congo
    when: Aug. 5
    date: '1964-08-05'
    thread: congo
    c: Stanleyville falls to the Simba rebels; Consul Hoyt and his staff held. Harriman to Brussels; Spaak will send no Belgian troops (Check the date).
    n: '[FRUS 1964–68, XXIII, doc. 199](https://history.state.gov/historicaldocuments/frus1964-68v23/d199) (Aug. 6). See [[cal.1964-07-10.congo]]. Names: Hoyt, Harriman, Spaak.'
    tags: [name:hoyt-michael-p-e, name:harriman-w-averell, name:spaak-paul-henri]
  - id: cal.1964-08-05.opinion
    when: Aug. 5
    date: '1964-08-05'
    thread: opinion
    also: [right-and-the-military]
    c: 'Gallup, July 23–28: 68 percent have heard of the John Birch Society. Of them, favorable 8, unfavorable 59, no opinion 33.'
    n: '[[w.gallup-poll]], III, 1896.'
  - id: cal.1964-08-06.mississippi
    when: Aug. 6
    date: '1964-08-06'
    thread: mississippi
    also: [civil-rights-organizations, elections-1964]
    c: Jackson, the Masonic Temple. The Freedom Democrats' State convention, nearly 2,500 present; Ella Baker the keynote. A delegation of 68 chosen to contest the regulars' seats at Atlantic City.
    n: 'SNCC Digital Gateway, [MFDP holds state convention](https://snccdigital.org/events/mfdp-holds-state-convention/) (K–J Cong. II.L). [[w.dittmer-local-people]]; [[w.mcadam-freedom-summer]]; [[w.carson-in-struggle]]. See [[cal.1964-04-26.civil-rights-organizations]]. Names: Baker.'
    tags: [name:baker-ella]
  - id: cal.1964-08-06.vietnam
    when: Aug. 6
    date: '1964-08-06'
    thread: vietnam
    c: Rusk, McNamara, and Wheeler before Foreign Relations and Armed Services on the Southeast Asia resolution.
    n: '[FRUS 1964–68, I, doc. 297](https://history.state.gov/historicaldocuments/frus1964-68v01/d297) (editorial note). Check: the hearing''s record. [[w.gibbons-u-s-government-and]], II, 310–313. See [[cal.1964-08-02.vietnam]]. Names: Rusk, McNamara, Wheeler.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle]
  - id: cal.1964-08-07.vietnam
    when: Aug. 7
    date: '1964-08-07'
    thread: vietnam
    c: The Southeast Asia resolution passes, House [416–0](https://voteview.com/rollcall/RH0880197), Senate [88–2](https://voteview.com/rollcall/RS0880481), Morse and Gruening against; Fulbright its manager. "All necessary measures to repel any armed attack against the forces of the United States and to prevent further aggression."
    n: '[110 Cong. Rec., House, Aug. 7, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-2.pdf); [Senate](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-1.pdf). Statement by the President on the Passage of the Joint Resolution on Southeast Asia, [1963–64 Pub. Papers 936](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=176) (Aug. 7, 1964). [[w.woods-fulbright]]; [[w.gruening-many-battles]]; [[w.gibbons-u-s-government-and]], II, 308–309, 316–330. See [[cal.1964-08-02.vietnam]]. Names: Morse, Gruening, Fulbright, Johnson.'
    tags: [name:morse-wayne, name:gruening-ernest, name:fulbright-j-william, name:johnson-lyndon-b]
  - id: cal.1964-08-07.desegregation-schools
    when: Aug. 7
    date: '1964-08-07'
    thread: desegregation-schools
    c: 'St. Helena Parish, La. July 9, the Fifth Circuit, Tuttle writing, had ordered West by mandamus to require a desegregation plan, in a suit begun more than eleven years before: a "really extraordinary case." West orders the plan, with a reply to the court. Aug. 7, Robert Kennedy, then Lee White with Katzenbach''s advice to make a record of efforts to avoid federal force, urge a call: Johnson asks McKeithen''s assurance that the State will keep order and the schools desegregate without federal forces.'
    n: '*Hall v. West*, [335 F.2d 481](https://static.case.law/f2d/335/case-pdfs/0481-01.pdf) (5th Cir. 1964); *Hall v. St. Helena Parish School Board*, [233 F. Supp. 136](https://static.case.law/f-supp/233/case-pdfs/0136-01.pdf) (E.D. La. 1964). [Johnson and Robert Kennedy, 12:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-august-7-1964), Conversation WH6408-10-4793 (Miller Center); [Johnson and Lee White, 1:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-lee-white-august-7-1964), Conversation WH6408-10-4798 (Miller Center); [1:47 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-lee-white-august-7-1964-0), Conversation WH6408-10-4800 (Miller Center); [4:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-lee-white-august-7-1964-1), Conversation WH6408-11-4811 (Miller Center); [Johnson and McKeithen, 4:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-mckeithen-august-7-1964), Conversation WH6408-11-4814 (Miller Center). [[w.fairclough-race-and-democracy]]; [[w.bass-unlikely-heroes]]. See [[cal.1964-07-06.desegregation-schools]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Tuttle, E. Gordon West, Robert Kennedy, White, Katzenbach, Johnson, McKeithen.'
    tags: [name:tuttle-elbert-p, name:west-e-gordon, name:kennedy-robert-f, name:white-lee-c, name:katzenbach-nicholas, name:johnson-lyndon-b, name:mckeithen-john-j]
  - id: cal.1964-08-07.legislatures-ok
    when: Aug. 7
    date: '1964-08-07'
    thread: legislatures
    c: Oklahoma. The three-judge court sets out the Legislature's apportionment under the new amendment; further orders, Aug. 19.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 45](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=45) (note). Check: the orders. See [[cal.1964-06-22.legislatures-ok]]; [[cal.1964-05-26.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1964-08-07.africa
    when: Aug. 7
    date: '1964-08-07'
    thread: africa
    c: 'Lightner to Muntasser: the United States accepts the principle of withdrawal from Wheelus. Dates to be discussed in 1965, after an American study; Libya not to press the matter before then.'
    n: 'FRUS 1964–68, XXIV, docs. [63](https://history.state.gov/historicaldocuments/frus1964-68v24/d63), [64](https://history.state.gov/historicaldocuments/frus1964-68v24/d64). Made public: FRUS 1964–68, XXIV (1999). See [[cal.1964-02-22.africa]]. Names: Lightner, Muntasser.'
    tags: [name:lightner-e-allan-jr, name:muntasser-mahmoud]
  - id: cal.1964-08-08.poverty
    when: Aug. 8
    date: '1964-08-08'
    thread: poverty
    c: House passes the poverty bill, [226–185](https://voteview.com/rollcall/RH0880201). The day before, Smith's motion to strike the enacting clause lost, [197–225](https://voteview.com/rollcall/RH0880198); Landrum's substitute, the Senate's text with a governor's veto, taken, [228–190](https://voteview.com/rollcall/RH0880199). Yarmolinsky kept out of the new office, for North Carolina votes.
    n: '[110 Cong. Rec., House, Aug. 7, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-2.pdf); [Aug. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-5-1.pdf). Statement by the President Following House Action on the Economic Opportunity Bill, [1963–64 Pub. Papers 942](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=182) (Aug. 8, 1964). See [[cal.1964-07-23.poverty]]. Names: Smith, Landrum, Yarmolinsky, Johnson.'
    tags: [name:smith-howard-w, name:landrum-phil-m, name:yarmolinsky-adam, name:johnson-lyndon-b]
  - id: cal.1964-08-08.europe-and-the-alliance
    when: Aug. 8–10
    date: '1964-08-08'
    thread: cyprus
    c: Cyprus. Greek Cypriot forces press the Turkish Cypriots at Kokkina; Turkish jets strike them, Aug. 8 and 9, with napalm on the 9th. Makarios threatens the Turkish Cypriots everywhere on the island. Johnson's appeal to Papandreou, Inonu, and Makarios; the Security Council's call for a cease-fire, Aug. 9, accepted. Acheson mediating at Geneva since July.
    n: 'FRUS 1964–68, XVI, docs. [86](https://history.state.gov/historicaldocuments/frus1964-68v16/d86), [93](https://history.state.gov/historicaldocuments/frus1964-68v16/d93), [109](https://history.state.gov/historicaldocuments/frus1964-68v16/d109), [111](https://history.state.gov/historicaldocuments/frus1964-68v16/d111), [116](https://history.state.gov/historicaldocuments/frus1964-68v16/d116). [[w.nicolet-united-states-policy-towards]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.ball-past-has-another-pattern]]. See [[cal.1964-07-07.europe-and-the-alliance]]. Names: Johnson, Acheson, Ball, Makarios III, Papandreou, İnönü.'
    tags: [name:makarios-iii, name:papandreou-george, name:inonu-ismet, name:johnson-lyndon-b, name:ball-george-w, name:acheson-dean-g]
