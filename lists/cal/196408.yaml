  - id: cal.1964-08-01.civil-rights-organizations
    when: Aug. 1
    date: '1964-08-01'
    thread: civil-rights-organizations
    also: [elections-1964]
    c: Chicago. The Coordinating Council Political Action Committee resolves on Freedom Democratic Clubs, after the Mississippi Freedom Democratic Party; Raby their chairman, an office in the Loop. Their first work, registering a protest vote against Goldwater.
    n: '[[w.anderson-confronting-the-color-line]], 141. To check: Chicago Sun-Times, 2 August 1964; editorial comment in Chicago Tribune, 31 July 1964 (cited by [[w.anderson-confronting-the-color-line]], 141 n.27). Names: Raby, Goldwater.'
    src:
