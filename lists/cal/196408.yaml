  - id: cal.1964-08-03.vietnam-congress
    when: Aug. 3
    date: '1964-08-03'
    thread: vietnam-congress
    c: 'Afternoon, the Capitol: Rusk, McNamara and Wheeler brief 25 Senators of Foreign Relations and Armed Services and the leaders, in secret. The attack "entirely unprovoked." Russell, to the press after: South Vietnamese naval operations in the Gulf could have "confused" the North Vietnamese.'
    n: '[[w.gibbons-u-s-government-and]], II, 287. To check: *New York Times*, Aug. 4, 1964; Austin, *The President''s War*, 28 (cited by [[w.gibbons-u-s-government-and]], II, 287 nn.20–21). See [[cal.1964-08-02.vietnam]]. Names: Rusk, McNamara, Wheeler, Russell.'
    src:
      c: 49133b80
      rows:
        - 'w.gibbons-u-s-government-and II, 287: all'
        - 'via w.gibbons-u-s-government-and II, 287 n.21: B-C'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:russell-richard-b]
  - id: cal.1964-08-04.vietnam
    when: Aug. 4
    date: '1964-08-04'
    thread: vietnam
    c: 'A second attack reported, at night, on the Maddox and the C. Turner Joy. By early afternoon in Washington, Herrick, commanding the patrol: many contacts and torpedoes "doubtful," "freak weather effects," "over-eager sonarmen"; a "complete evaluation" asked. The NSC and the congressional leaders; strikes ordered. Johnson on television, 11:36 p.m.: "limited and fitting"; "We still seek no wider war."'
    n: 'Radio and Television Report to the American People Following Renewed Aggression in the Gulf of Tonkin, [1963–64 Pub. Papers 927](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=167) (Aug. 4, 1964). FRUS 1964–68, I, docs. [272](https://history.state.gov/historicaldocuments/frus1964-68v01/d272), [276](https://history.state.gov/historicaldocuments/frus1964-68v01/d276), [278](https://history.state.gov/historicaldocuments/frus1964-68v01/d278), [280](https://history.state.gov/historicaldocuments/frus1964-68v01/d280), [286](https://history.state.gov/historicaldocuments/frus1964-68v01/d286). [President''s Daily Diary, Aug. 4, 1964](https://catalog.archives.gov/id/192446), images 3, 5, 8, 11 (LBJ Library; National Archives Catalog). [[w.gibbons-u-s-government-and]], II, 289–97 (the day hour by hour: the reports, Herrick''s doubts at 1:27 p.m., the NSC, the leaders, the strikes, the address at 11:37 p.m.); [[w.vietnam-victory-in-vietnam]], 132 (no engagement on Aug. 4; the incident called fabricated); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 521–22 (the reported attack; the Maddox''s doubts; the NSC; the strikes; the address after 11:30 p.m.); [[w.cosmas-joint-chiefs-of-staff-2012]], 106–108 (all but Herrick); [[w.marolda-united-states-navy-and]], 426–34, 440, 443–44, 446 (the night action; the lunch at 1 p.m., Herrick''s doubts; the strikes ordered, Johnson to the congressmen; the address, 11:36 p.m.); [[w.asselin-hanois-road-to-the]], 196–97 (the second attack reported; Hanoi''s denial: no engagement Aug. 4); [[w.johnson-vantage-point]], 114–17. To check: Joint Staff, JCS, Tonkin Gulf Composite Diary (cited by [[w.marolda-united-states-navy-and]], 440 n.7); Msg, CTG72.1 041754Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 440 n.9); Msg, JCS 042119Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 443 n.21); Joint Staff, JCS, Tonkin Gulf Composite Diary (cited by [[w.marolda-united-states-navy-and]], 446 n.26b); McNamara''s telephone conversation with Sharp, Aug. 4, 1964, NSF, LBJ Library (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 522 n.104); Herrick''s message of 1:27 p.m., Aug. 4, 1964, NSF, Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], II, 290 n.34). See [[cal.1964-08-02.vietnam]]. Names: Herrick, Johnson.'
