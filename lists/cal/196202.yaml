    date: '1962-02-26'
    place: nanchang
    thread: china-agriculture
    also: [china-economy]
    c: 'Nanchang 南昌. Zhu De 朱德 hears Liu Junxiu 刘俊秀, a secretary of the Jiangxi committee''s Secretariat 中共江西省委书记处: Jiangxi a good place, hills, water, land, a good climate; "with land there are people, with people wealth"; plant trees; silkworms by collectives and every household both; without growing output, what socialism?; handicrafts restored this year and sent into the hills, at least half-finished goods brought out; the state carrying all handicrafts a great loss; equal shares will never work, exchange of equal values and pay by work instead; commerce to know how to trade; the farms to produce, not to hand over profit, which should go to expanding output, the state buying by contract; the foreign and the new not too much, too fast: farming and handicrafts first, food and clothing first.'
