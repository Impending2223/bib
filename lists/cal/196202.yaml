  - id: cal.1962-02-03.vietnam
    when: Feb. 3
    date: '1962-02-03'
    thread: vietnam
    c: 'Diệm''s decree sets up the Interministerial Committee for Strategic Hamlets: the ministers of the interior, civic action and rural affairs, the deputy minister of defense, army, police and intelligence officers; Nhu presides. The strategic hamlets the government''s first priority since January.'
    n: '[[w.miller-misalliance]], 231–39 (the program''s design; 238: the committee, its members, Nhu in the chair, the priority of January). To check: [[w.catton-diems-final-failure]]; "Translation of Decree Establishing Interministerial Committee for Strategic Hamlets," Feb. 3, 1962, folder 12, box 6, Donnell Collection, Vietnam Archive, Texas Tech University (cited by [[w.miller-misalliance]], 238 n.61). See [[cal.1962-02-02.vietnam]]. Names: Diệm, Nhu.'
