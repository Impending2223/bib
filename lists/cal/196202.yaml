        - 'w.macfarquhar-origins-of-the-cultural III, 287: 3'
        - 'via w.macfarquhar-origins-of-the-cultural III, 287 n.147a: 3'
        - 'via w.macfarquhar-origins-of-the-cultural III, 287 n.147b: 3'
