    c: 'The Great Hall, 4:30 p.m.{1} Plenary, Mao presiding.{2} Zhou Enlai: for the past years'' faults the State Council and its commissions bear much;{3} leap targets set against fact;{4} if proportions are not kept, laws of objective reality punish;{5} the economy still in serious difficulty;{6} farm recovery needs three to five years; 1962 the key year of adjustment.{7} Mao closes the conference: nearly a month, the lines of communication opened, policy settled;{8} a small conference of the first secretaries on Feb. 8.{9} Yang Shangkun, ill, is absent.{10} Peng Zhen attends; the resolution on Liu Shaoqi''s report is adopted.{11} Zhou: grain short by about 10 billion jin in 1962; eight measures, the first to cut offices, town population, staff and grain supply.{12} Zhou: Mao should not take the responsibility, "it is we who have made the mistakes."{13}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 7, 1962. [[w.zhou-enlai-nianpu-1949]], II, 455–56 (Feb. 7, 1962: Zhou Enlai''s closing speech: the State Council and its commissions bear much of the blame; grain short by about 10 billion jin in 1962; eight measures, the first to cut offices, urban population, staff and grain supply); [[w.macfarquhar-origins-of-the-cultural]], III, 175–78 (Zhou Enlai''s speech: the five highs, planning, his own errors, devolution of powers); [[w.macfarquhar-origins-of-the-cultural]], III, 184–86 (Zhou''s figures: grain output, procurement and rural ration; the surplus provinces; grain to the cities; foreign debts); [[w.macfarquhar-origins-of-the-cultural]], III, 134, 144 (Zhou''s closing address: blockade, debts, the aid programme); [[w.yang-shangkun-riji]], II, 121 (Feb. 7, 1962; the enlarged Central Work Conference closes; Yang Shangkun, ill, absent; the delegates to leave from the next day); [[w.deng-xiaoping-nianpu-1904]], III, 1690 (Feb. 7, 1962; afternoon; Deng at the closing plenary; Zhou on the difficulties and their remedies; the resolution on Liu''s report read and passed by applause); [[w.mao-zedong-zhuan]], V, ch. 69 (Feb. 7, Great Hall: the last day, Zhou Enlai on the economy''s difficulties and the way out; the resolution on Liu''s written report adopted; Mao closes the conference). [[w.dikotter-maos-great-famine]], 336 n.4 (Zhou takes the blame himself: the excessive grain procurements, the inflated output figures, the draining of grain from the provinces and the growing food exports, "my mistake"; the errors came when the general line and Mao''s instructions were contravened); [[w.jian-zhou-enlai]], 462 (Zhou''s speech: Mao not to take the responsibility; "it is we who have made the mistakes"; the Party to listen to the helmsman); [[w.yang-jisheng-tiandi-fanfu]], I, 72 (the conference closes Feb. 7); [[w.peng-zhen-nianpu-1902]], IV, 173 (Feb. 7, 1962, afternoon; Peng Zhen at the plenary, Mao presiding, hearing Zhou on the difficulties and how to overcome them; the resolution on Liu Shaoqi''s report adopted, the conference closes); [[w.dikotter-cultural-revolution]], 13 n.18 (Zhou takes on himself the excessive procurements, the inflated figures, the draining of grain from the provinces and the growing food exports: the faults came where the general line and Mao''s instructions were contravened); [[w.yang-shangkun-riji]], II, 121; [[w.peng-zhen-nianpu-1902]], IV, 173; [[w.zhou-enlai-nianpu-1949]], II, 456; [[w.jian-zhou-enlai]], 462. Made public: 1997. To check: the conference''s resolution on Liu Shaoqi''s report (the nianpu, Jan.–Feb. entry: Mao added "and the speeches of several Standing Committee comrades" and "restore democratic centralism"); [[w.qi-qian-ren-dahui]], 79 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 175 n.186); [[w.qi-qian-ren-dahui]], 81 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 176 n.187); [[w.qi-qian-ren-dahui]], 83 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 176 n.189); [[w.qi-qian-ren-dahui]], 83–84 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 177 n.190); [[w.qi-qian-ren-dahui]], 79 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 177 n.193); [[w.griffith-albania-and-the-sino]], 104 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 134 n.81b); [[w.tianrong-guanyu-yijiuliuer-nian-qiqian]], 6–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-a); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-c); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-d); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1017, 1019–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-e); Zhou Enlai, speech of Feb. 7, 1962, Gansu Provincial Archives, 91-18-493, p. 87 (cited by [[w.dikotter-maos-great-famine]], 336 n.4); [[w.zhang-suhua-bi