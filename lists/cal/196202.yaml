    c: 'Robert Kennedy in Germany.{1} West Berlin, from the steps of the City Hall and at the Free University, Feb. 22;{2} Bonn, Feb. 24.{3} Brandt, Clay and Lightner meet him at the airport; a motorcade to the Rathaus; a crowd of perhaps 100,000. His impromptu speech: "They will let their balloons come over—but not their people." At the Free University that evening: "We have not forgotten those in East Germany." Schlesinger talks with Brandt on the Wall.{4}'
