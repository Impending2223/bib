  - id: cal.1962-02-01.south-asia
    when: Feb. 1
    date: '1962-02-01'
    thread: south-asia
    also: [china-leadership]
    c: The Military Affairs Commission begins to lay down rules of engagement on the Indian border. Within 30 km. of the Chinese line of control, no firing, patrols, hunting or action against Tibetan rebels; within 20 km., no target practice, maneuvers or demolition. Indian troops who cross the line to be warned and pushed back, failing that disarmed, then given back their weapons and let go.
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 299–300; [[w.jian-zhou-enlai]], 472 (Feb. 1: the Military Commission''s instruction to the Tibet and Xinjiang commands, drafted with Zhou: plans for "antiencroachment struggles"; no provocation, no fire within thirty kilometers; whether to fight reserved to the Commission). Made public: 1992. To check: [[w.li-zhongguo-9-ci-da]], 101 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 300 n.14a); [[w.zhongyin-bianjie-ziwei-fanji]], 122–7, 141, 143 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 300 n.14b). Check: the day on which the rules were completed; the book says they "began to be laid down" Feb. 1.'
    src:
