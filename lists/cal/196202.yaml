  - id: cal.1962-02-28.china-leadership-3
    when: Feb. 28
    date: '1962-02-28'
    time: 1962-02-28T08:00Z
    thread: china-organization
    c: 'The Secretariat 书记处, 4 p.m.: the setting up and enlarging of the Party''s control commissions at every level. The Organization Department and the Central Control Commission to draft a document and rules.{1} Deng Xiaoping presides. Control commissions are to be mostly full-time; thirty to fifty men from the Center are to go about against suppression of democracy and decentralism; members are one day to be elected by Party congresses, with a code for them. On industry he tells Li Fuchun: less iron and steel, more timber and small tools for the villages; the Seventy Articles on industry, with their responsibility, accounting and cooperation systems, to cut staff on the five fixings.{2} Peng Zhen attends the 316th meeting. It decides that the Planning and Economic Commissions are to support agriculture and carry out the Seventy Articles; Xinhua''s domestic branches are to be led chiefly by the head office, and *Renmin ribao* printed in more copies. Peng: Party committees to take hold of line, policy and plan; production the key to the sharp tensions of town and country, worker and peasant; a Party committee meeting each quarter, as Mao says.{3}'
    n: '[[w.yang-shangkun-riji]], II, 129 (Feb. 28, 1962); [[w.deng-xiaoping-nianpu-1904]], III, 1693 (Feb. 28, 1962; afternoon; Deng presides; control work, industry''s help to agriculture, propaganda. Deng: control commissions mostly full-time, going about to protect the good and fight the bad; thirty to fifty from the Center against suppression of democracy and decentralism; members one day elected by Party congresses, treated as Central Committee members; still chosen by and under the committee at their level, guided from above; removal approved above; a code for them. To Li Fuchun: less iron and steel, more timber to the villages, small tools; the Seventy Articles, responsibility, accounting, cooperation, staff cut on the five fixings); [[w.peng-zhen-nianpu-1902]], IV, 176 (Feb. 28, 1962, afternoon; the 316th meeting; Peng Zhen there; the Central Control Commission and the Organization Department to draft a decision on strengthening the Party''s control work; the Planning and Economic Commissions to see to support of agriculture and the "Seventy Articles on industry"; Xinhua''s domestic branches under the head office; more copies of *Renmin ribao*; Peng: Party committees on line, policy and plan, government work strengthened; production the key to town–country and worker–peasant tensions; a Party committee meeting each quarter, as Chairman Mao says; control work on new problems, the past endless); [[w.deng-xiaoping-nianpu-1904]], III, 1693; [[w.peng-zhen-nianpu-1902]], IV, 176. The words: 下午4时 (II, 129). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). See [[cal.1962-02-27.china-leadership-4]]. Names: Deng Xiaoping, Li Fuchun, Peng Zhen.'
    src:
      c: f80a8f28
      rows:
