    thread: china-seven-thousand
    c: 'The Great Hall, 4:30 p.m.{1} Plenary, Mao presiding.{2} Deng Xiaoping: for the faults and errors the center first answers, and in the center the Secretariat chiefly, being the one that does the work;{3} five virtues of the Party (Mao Zedong Thought, a good center, good cadres, good tradition, a people''s trust).{4} Mao interjects: no secret factions;{5} "inspect work, sum up experience, exchange opinions."{6}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 6, 1962. [[w.macfarquhar-origins-of-the-cultural]], III, 173–75 (Deng Xiaoping''s speech: five goods, democratic centralism, dispersionism, factions, letting off steam); [[w.macfarquhar-origins-of-the-cultural]], III, 144 (Deng Xiaoping''s plenary address); [[w.deng-xiaoping-nianpu-1904]], III, 1688–1690 (Feb. 6, 1962; afternoon; Deng''s speech: the Center first responsible, in it chiefly the Secretariat; the Party''s five strengths; serious faults lately, the good traditions weakened, by too little study of Mao''s thought, targets too high and the "great drives", and inner-Party struggle gone astray; democratic centralism the basic system, members'' rights, supervision within committees, collective leadership; regular work; cadres judged over their whole work, rehabilitation case by case; study. Printed in *Deng Xiaoping wenxuan*, vol. 1, as "Speech at the enlarged Central Work Conference"); [[w.peng-zhen-nianpu-1902]], IV, 172 (Feb. 6, 1962, afternoon; Peng Zhen at the plenary, Mao presiding, hearing Deng on the Secretariat''s responsibility and the Party''s good tradition). Made public: 2013. To check: [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 279–99 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 173 n.176a); [[w.selected-works-of-deng]], 269–86 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 173 n.176b); [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 280–83 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 174 n.177a); [[w.zedong-jianguo-yilai-mao-zedong]], 10, 53 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 174 n.177b); [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 290 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 174 n.182a); [[w.schram-mao-tse-tung-unrehearsed]], 183 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 174 n.182b); [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 295–96 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 175 n.185); [[w.tianro