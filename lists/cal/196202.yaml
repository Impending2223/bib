    when: Feb. 2
    date: '1962-02-02'
    thread: civil-rights-organizations
    also: [voting-rights, king]
    c: 'Atlanta, SCLC''s affiliates. King speaks; Septima Clark and Dorothy Cotton introduced as the citizenship teachers; Lawson''s workshops in nonviolence; Andrew Young for the Field Foundation; Wiley Branton, the Voter Education Project''s director to be, there. O''Dell, director of voter registration, lays out the flow: King''s tours for volunteers, Dorchester for training, the trained workers'' projects to Branton for the Project''s money.'
