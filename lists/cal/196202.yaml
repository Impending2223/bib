    c: 'Zhou Enlai to Peking''s dramatists, before the drama writers'' meeting at Guangzhou: let them "vent" first, to clear the air.{1} Since 1959 the arts have broken old superstitions (reverence for the past, for the foreign) and made new ones (all of today good, all of the past bad, all of China good, all of abroad bad), and writers dare not write.{2} The Party leads but does not take over;{3} politics and art differ;{4} the spirit of the age is not the Party''s resolutions put on the stage; contradictions among the people as well as with the enemy are to be shown.{5}'
