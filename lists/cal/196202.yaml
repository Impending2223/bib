    c: 'Hoover to Robert Kennedy and O''Donnell, the same memorandum: the FBI''s investigation of Rosselli shows him in touch with Judith Campbell, a friend of the President;{1} she keeps up an association with Giancana, "a prominent Chicago underworld figure";{2} the toll calls from her residence include calls to the White House.{3} Evelyn Lincoln, given a copy, believed she would have shown it to the President.{4}'
