    c: 'Shanghai.{1} Mao on Tian Jiaying''s report of Feb. 8: how long the production team, now the communes'' basic accounting unit, is to stay so. Deng Xiaoping would write twenty years;{2} Tian asks: forty, or "at least twenty"? Mao, to Tian, for Deng, Liu Shaoqi and Zhou Enlai: "at least thirty";{3} the Soviet Union, forty-three years on, has not got agriculture through.{4} He writes it into the Central Committee''s draft directive on the communes'' basic accounting unit, issued Feb. 13.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 11, 1962. [[w.macfarquhar-origins-of-the-cultural]], III, 287 (Tian presents Mao with three alternatives on Feb. 8, twenty years, forty years or ''at least twenty''; on Feb. 11 Mao opts for ''at least thirty''); [[w.jianguo-yilai-mao-zedong]], XVI, 242–244 (Feb. 11, 1962; Mao''s note to Tian Jiaying, for Deng Xiaoping, Liu and Zhou, and his change of "forty years" to "at least thirty" in the draft; Deng would write twenty; the directive issued Feb. 13; note 5 counts the Soviet Union''s years as 44 from Oct. 1917); [[w.deng-xiaoping-nianpu-1904]], III, 1690–1691 (Feb. 11, 1962; Mao at Shanghai: "Comrade Tian Jiaying, tell Comrade Xiaoping, Liu and Zhou: better ''at least thirty years''"; the Soviet Union 43 years on and farming not past the pass (footnote 1: from 1917, 44 years)). Made public: 2013. Check: another account has the thirty-year decision taken in February without making clear Deng Xiaoping''s role at the time (III, 287 n.147). To check: the directive of Feb. 13, 1962; [[w.suinian-chinas-socialist-economy]], 296 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 287 n.147a); [[w.yanjiushi-zhonggong-dangshi-zhongda-shijian]], 125 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 287 n.147b). Names: Mao Zedong, Tian Jiaying, Deng Xiaoping, Liu Shaoqi, Zhou Enlai.'
    src:
      c: ab69d43f
      rows:
