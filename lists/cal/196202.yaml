  - id: cal.1962-02-27.china-leadership-2
    when: Feb. 27
    date: '1962-02-27'
    thread: china-foreign
    also: [soviet-union]
    c: Wang Jiaxiang, head of the International Liaison Department, writes to the three men running foreign affairs, Zhou Enlai, Deng Xiaoping and Chen Yi.{1} His deputies, Liu Ningyi and Wu Xiuquan, sign too. He does not write to Mao.{2} He argues for a peaceful international environment so that China can recover at home.{3} World war is not settled as avoidable, nor settled as unavoidable.{4} Aid to revolutionary and nationalist movements should follow "seeking truth from facts", from speeches and declarations to volunteers.{5} China must consider carefully what it spends overseas. Critics later call this the "three reconciliations and one reduction" (san he yi shao).{6}
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 270–71; [[w.deng-xiaoping-nianpu-1904]], III, 1693–1694 (Feb. 28, 1962; Deng sends the letter of Feb. 27 from Wang Jiaxiang, Wu Xiuquan and Liu Ningyi to Zhou, Deng and Chen Yi on China''s foreign line to Liu and Peng Zhen: a peaceful foreign policy, friendship with the socialist countries, peaceful coexistence on the five principles; proposals to adjust the line); [[w.yang-jisheng-mubei]], II, 1126–1127 n.32 (Wang Jiaxiang''s letter of Feb. 1962 to Zhou, Deng and Chen Yi, sent as an internal communication: a mild foreign policy; no open split with the Soviet Union; a milder line to the United States, no Korean-style war; the Sino-Indian deadlock to be broken; support to revolutions to be ''seeking truth from facts'' and within China''s means, armed struggle not the only road); [[w.jian-zhou-enlai]], 463–464 (Wang Jiaxiang to Zhou, Deng and Chen Yi, an "intraparty communication": a statement that China''s policy favors peace; détente; tactics in struggle; no aid beyond China''s means. Zhou no comment; Deng sends it on to Liu and Peng Zhen, who do nothing); [[w.yang-jisheng-tiandi-fanfu]], I, 74–75 (the letter''s five points); [[w.jian-chinese-politics-and-the]], 276 (February 1962: Wang Jiaxiang''s report to the top leadership: world peace the aim abroad, so that China can build at home; tension to be eased, not sharpened); [[w.westad-introduction]], 27 (in the spring of 1962 Wang calls for less tension with the Soviet Union and the United States, to win a long peaceful environment for socialist construction); [[w.friedman-shadow-cold-war]], 92 (during the conference Wang Jiaxiang, with Liu Ningyi and Wu Xiuquan, works out a more moderate foreign policy, which Mao later calls "three reconciliations and one reduction": some reconciliation with the USSR, the United States and India, less ideological foreign aid). Made public: 1988. To check: Wang Jiaxiang, Liu Ningyi and Wu Xiuquan, letter of Feb. 27, 1962, to Zhou Enlai, Deng Xiaoping and Chen Yi, in [[w.li-wang-li-yiyan-wang]], 9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.49); Wang Jiaxiang, Liu Ningyi and Wu Xiuquan, letter of Feb. 27, 1962, to Zhou Enlai, Deng Xiaoping and Chen Yi, in [[w.li-wang-li-yiyan-wang]], 9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.50a); Wang Jiaxiang, Liu Ningyi and Wu Xiuquan, letter of Feb. 27, 1962, to Zhou Enlai, Deng Xiaoping and Chen Yi, in [[w.zhonggong-dangshi-renwuzhuan]], 33, 50 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.50b); [[w.bianjizu-wang-jiaxiang-xuanji-selected]], 444–60 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.50c); Wang Jiaxiang, Liu Ningyi and Wu Xiuquan, letter of Feb. 27, 1962, to Zhou Enlai, Deng Xiaoping and Chen Yi, in [[w.jin-1949-1989-niande-zhongguo]], 500–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.50d); [[w.bianjizu-wang-jiaxiang-xuanji-selected]], 450 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.51a); [[w.macfarquhar-origins-of-the-cultural]], II, 272–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.51b); [[w.bianjizu-wang-jiaxiang-xuanji-selected]], 444–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.52); [[w.bianjizu-wang-jiaxiang-xuanji-selected]], 445 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 270 n.53); Xu et al., *Wang Jiaxiang nianpu*, 486–489 (no fuller reference in the book) (cited by [[w.jian-zhou-enlai]], 464 n.91a); [[w.zehao-wang-jiaxiang-zhuan]], 557–564 (cited by [[w.jian-zhou-enlai]], 464 n.91b); Zhu Liang 朱良, 〈無私無畏追求真理的王稼祥〉, *Yanhuang chunqiu* 《炎黃春秋》, 2006, no. 8 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 75 n.81); [[w.cheng-zhonghua-renmin-gongheguo-shilu]], II, pt. 2, 656–57 (cited by [[w.jian-chinese-politics-and-the]], 276 n.151); [[w.luthi-sino-soviet-split]], 213 (cited by [[w.friedman-shadow-cold-war]], 92 n.152); [[w.niu-jun-1962]], 28–30 (cited by [[w.friedman-shadow-cold-war]], 92 n.153). See [[cal.1962-02.china-leadership-7]]. Names: Zhou Enlai, Deng Xiaoping, Chen Yi, Mao Zedong, Wang Jiaxiang, Liu Ningyi, Wu Xiuquan.'
