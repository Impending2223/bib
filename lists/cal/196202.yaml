  - id: cal.1962-02-08.china-leadership-3
    when: Feb. 8
    date: '1962-02-08'
    place: peking
    thread: china-seven-thousand
    c: 'Chen Yun addresses the Shaanxi provincial group at the Seven Thousand Cadres Conference; a new work conference opens to discuss the third draft of Liu Shaoqi''s report.{1} He tells the Shaanxi delegation: the conference is a great victory, not to be underrated; the blame for the errors of these years lies first with the Center. Party life has been abnormal, men saying "only three parts" to one another; the danger is not wrong words but silence. Over 90 percent of a policy organ''s time should go to inquiry. The Guanzhong plain''s grain was at best 6.9 billion jin, 5.4 billion a year on average, and 3.8 billion last year. Four ways out: more output, imports, fewer townspeople, eating less; imports are limited, 10 billion jin last year.{2}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 144–145; [[w.chen-yun-nianpu-xiuding]], III, 120–122 (Feb. 8, morning: Chen Yun addresses the whole Shaanxi 陕西 delegation: a great victory, not to be underrated; the blame first the Center''s; Party life abnormal these years, men saying "only three parts of what they think"; fear not wrong words but silence; heed contrary views; to know rightly, "exchange, compare, repeat": over 90 percent of the time on inquiry, every plan compared with the present, the past and abroad, then weighed again later; the Guanzhong 关中 plain''s grain at best 6.9 billion jin, 5.4 billion a year, 3.8 billion last year; four ways out: grow more, import, cut the towns, eat less; more cannot be grown soon, imports are limited (10 billion jin last year), cut people the sooner the better, and eat less for three to five years, telling the peasants so); [[w.chen-yun-nianpu-xiuding]], III, 120–122. Made public: 1986 ([[w.chen-yun-wenxuan-1956]], the speech in part, as the *Chen Yun nianpu* says, III, 122); 1997 (the work conference). To check: [[w.tianrong-guanyu-yijiuliuer-nian-qiqian]], 6–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-a); [[w.jin-1949-1989-niande-zhongguo]], 399–413 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-b); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-c); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-d); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1017, 1019–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-e); [[w.chen-yun-wenxuan-1956]] (part, as 《怎样才能使我们的认识更正确些》) and [[w.chen-yun-wenji]], III (part, as 《解决当前困难的几条办法》), where the Chen Yun nianpu says the speech is printed ([[w.chen-yun-nianpu-xiuding]], III, 122). Names: Chen Yun, Liu Shaoqi.'
