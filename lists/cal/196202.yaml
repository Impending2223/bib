  - id: cal.1962-02-26.china-leadership-3
    when: Feb. 26
    date: '1962-02-26'
    place: peking
    thread: china-retreat-1962
    c: 'Chen Yun repeats his Xilou remarks to a meeting of State Council officials, who applaud at length.{1} Li Fuchun also speaks.{2} Chen Yun: grain some 80 billion jin under 1957, over 10 billion jin imported last year and 8 billion this; 100 million mu of land lost net; the plan to be tested, then spread, "steady and sure."{3} Li Xiannian speaks on credit and the market; on Liu Shaoqi''s proposal the Center forwards the three speeches Mar. 18.{4}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 192–94; [[w.mao-zedong-zhuan]], V, ch. 69 (Feb. 26: the State Council meeting of the ministries'' Party group members, Chen Yun speaking on the finances and economy and the way out; Li Xiannian on credit and the market and Li Fuchun on industry; the Center forwards the three speeches Mar. 18). [[w.yang-jisheng-mubei]], II, 1174 (the State Council''s enlarged meeting of Feb. 26, 1962, one of the meetings that framed a set of measures to adjust the economy further); [[w.yang-jisheng-mubei]], II, 1118–1119 n.17 (Chen Yun''s talk of Feb. 26 gathers the grim situation in five points: the great fall in farm output; capital construction beyond the state''s means; too many notes printed, inflation; city notes flowing to the countryside and speculation; falling living standards in the cities); [[w.chen-yun-nianpu-xiuding]], III, 125–128 (Chen Yun''s speech to the enlarged State Council, the ministries'' and commissions'' Party group members attending, 《目前财政经济情况和克服困难的若干办法》: all agree there are difficulties, not on how great or how long, and the difference not to be hidden. Difficulties: grain some 80 billion jin under 1957, 10 billion imported last year and 8 billion this; 100 million mu of land lost net; construction too big even in a normal year; inflation, stocks, gold, silver and foreign exchange drawn and 6–7 billion yuan printed; 3 billion yuan in notes to the villages for goods worth 1 billion; the towns'' living down. In our favor: the peasants'' zeal since the Twelve and Sixty Articles; grain, poultry and pigs rising; the enlarged capacity; the people with us; the leaders'' experience. Ways: the ten-year plan in two stages, recovery about five years from 1960, then growth; fewer staff and townspeople, the sooner the better; against inflation, cash control, materials to light industry, imports, a few high-priced goods (the villages this year), the fight on speculation; 3 jin of beans a month, nylon socks from 4 million dollars of imports, 40–50 million yuan of delicacies for high-priced restaurants; every force to farming, more bonus grain for cotton growers, fertilizer, steel and timber for tools; the Planning and Economic Commissions to put food, clothing, the market and inflation first; test, then spread, "steady and sure"); [[w.chen-yun-nianpu-xiuding]], III, 125–128; [[w.mao-zedong-zhuan]], V, ch. 69. Made public: 1986 ([[w.chen-yun-wenxuan-1956]]). To check: [[w.liqun-xiang-chen-yun-tongzhi]], 5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 192 n.30a); [[w.jin-1949-1989-niande-zhongguo]], 416 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 192 n.30b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1052 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 194 n.34); [[w.chen-yun-wenxuan-1956]], where the Chen Yun nianpu says the speech is collected ([[w.chen-yun-nianpu-xiuding]], III, 128). Names: Chen Yun, Li Fuchun, Li Xiannian.'
