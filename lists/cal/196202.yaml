  - id: cal.1962-02-08.china-leadership-4
    when: Feb. 8
    date: '1962-02-08'
    thread: china-seven-thousand
    also: [china-liu]
    c: 'Liu Shaoqi presides at the enlarged Central Work Conference and speaks.{1} On drafting the written report, decentralism had been criticized as the chief problem and the problems in democratic centralism overlooked; he proposes to change the second part''s "On concentration and unity" into "Strengthen democratic centralism and strengthen concentrated unity," and to add Mao''s words on democratic centralism.{2} In these years the Party has paid for not investigating and for not practicing democracy: not developing democracy, not listening to others, not discussing among the people, not honestly seeking their agreement; a great lesson. An atmosphere in which men can say what they wish is to be formed; so in the Party and still more outside; the Party is never to substitute for the government. The system of people''s congresses is to be used to practice the people''s democracy.{3}'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 548–549 (Feb. 8, 1962); [[w.mao-zedong-zhuan]], V, ch. 69 n.22 (Feb. 8: Liu Shaoqi''s speech, asking that Mao''s words on democratic centralism go into his report; the report had stressed concentration and unity and overlooked democratic centralism; the years of centralizing too much). Made public: 1996. To check: Liu Shaoqi 刘少奇, speech at the Central Work Conference 中央工作会议, Feb. 8, 1962 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.22). Names: Liu Shaoqi, Mao. Check: the enlarged conference closed Feb. 7 ([[cal.1962-02-07.china-leadership]]); the chronology''s name for the meeting of Feb. 8.'
    src:
      c: 7e388a5e
      rows:
        - 'w.shaoqi-liu-shaoqi-nianpu-chronology II, 548–549: ?'
        - 'w.mao-zedong-zhuan V, ch. 69 n.22: 2'
        - 'via w.mao-zedong-zhuan V, ch.69 n.22: 2'
