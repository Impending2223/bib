  - id: cal.1962-02-01.laos
    when: Feb. 1–3
    date: '1962-02-01'
    place: nam-tha
    thread: laos
    c: Nam Tha's airfield mortared, Feb. 1; the five remaining Laotian T-6s withdrawn to Luang Prabang. Feb. 3, the shells reach the town; Phoumi airlifts several hundred paratroopers fresh from training in Thailand, against Boyle's advice. The first rounds had fallen on the outskirts Jan. 25.
    n: '[[w.anthony-war-in-northern-laos]], 64–65; [[w.guan-vietnamese-communists-relations-with]], 217 (the first time; seven infantry battalions and other units of the North Vietnamese 316th, 335th and 330th Brigades into Laos to fight beside the Pathet Lao and neutralists, North Vietnam''s first campaign since 1954 against the enemy''s rear, the first great breach of the cease-fire since Ban Padong). To check: History, CINCPAC, 1962, p. 202 (cited by [[w.anthony-war-in-northern-laos]], 65 n.18a); Andrew J. Boyle, interview by the author, Sept. 18, 1974 (cited by [[w.anthony-war-in-northern-laos]], 65 n.18b). Names: Phoumi Nosavan.'
