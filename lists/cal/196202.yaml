    c: The Gansu 甘肅 provincial committee's general office 省委辦公廳 compiles the opinions on the Center, the responsible comrades of the Center and its departments that provincial-level party cadres of grade 19 and above have voiced in studying the documents of the enlarged Central Work Conference. A Party-school cadre calls it stiff thinking to insist that successes are chief when 500 of 600 million seek their food; another says the Center's guiding ideas are in question, since the trouble is wide and long; one says Mao 毛澤東, like Stalin, may in his late years have erred in subjectivism; a printing-works man feels the Center is held faultless and the lower levels blamed; the head of the light industry office reports that the common people curse Mao.
