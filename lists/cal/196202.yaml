    c: 'Xilou conference: Chen Yun, in a speech to the Standing Committee''s work conference, names five areas of crisis (grain output, capital investment, inflation, cash in the countryside, urban living standards);{1} says 5 million tons of grain were imported last year and 4 million more are needed;{2} proposes a recovery stage of three more years before development, more people out of the cities, control of cash, three jin of soybeans a month for each city resident, nylon socks, 40 to 50 million yuan of delicacies for high-priced restaurants, 200 jin of grain for every 100 jin of ginned cotton, and a turn of planners from industry to agriculture.{3} Chen Yun''s speech is warmly received; Liu tells him, "I firmly support you."{4}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 188–92; [[w.macfarquhar-origins-of-the-cultural]], III, 37 (Chen Yun proposes 40 to 50 million yuan of delicacies for restaurants and guesthouses, and high-priced sales in the villages); [[w.jian-zhou-enlai]], 463 (Chen Yun on the fall in farming, investment, inflation, speculation and urban living; Liu: "I firmly support you"); [[w.chen-yun-nianpu-xiuding]], III, 124–125 (Feb. 21–23, the Xilou 西楼 meeting, the enlarged Standing Committee under Liu Shaoqi on the 1962 budget and the economy: after the Seven Thousand Cadres Conference a deficit of 3 billion found, more with the water squeezed from 1958–61''s revenue; a recovery period needed. Feb. 23, Chen Yun speaks: five signs (farm output much down; construction beyond the state''s means; deficits met by printing money, inflation; serious speculation; the towns'' living standards down) and six measures (the ten-year plan, 1963–72, in a recovery and a growth stage; fewer townspeople; every means against inflation; the towns'' minimum needs met; every force to farming; the planners to turn from industry and transport to farming and inflation). Liu: the conference did not sound the difficulties, men feared to say all black; an extraordinary period, extraordinary measures; he proposes a full State Council meeting for Chen Yun to speak more; Chen Yun agrees and asks that it take in the ministries'' Party groups, he, Li Fuchun and Li Xiannian to relay the meeting); [[w.jian-zhou-enlai]], 463. Made public: 1997. Check: [[w.macfarquhar-origins-of-the-cultural]], III, 37 gives February, with no day, for the proposal. To check: [[w.lardy-chen-yuns-strategy-for]], 185–201 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 188 n.10a); [[w.chen-yun-tongzhi-wengao]], 157–72 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 188 n.10b); [[w.chen-yun-wenxuan-1956]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 188 n.10c); [[w.jin-1949-1989-niande-zhon