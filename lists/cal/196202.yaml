    c: 'Peking 北京. Peng Zhen 彭真, before the drama writing forum at Guangzhou, talks with some playwrights: traditional plays to be put in order by men who know Marxism, the Party''s policy, history and the stage; Ma Lianliang 马连良, over sixty, troubled by plays changed too much; the Yang family generals 杨家将 for patriotism, *Yangmen nüjiang* 《杨门女将》 well revised; *The Empty City* 《空城计》 and *Qunying hui* 《群英会》; love plays such as *The White Snake* 《白蛇传》, nothing obscene; plays for young actors of the Peking and Experimental Peking Opera troupes.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 170–171. Made public: 2012. Names: Peng Zhen, Ma Lianliang.'
