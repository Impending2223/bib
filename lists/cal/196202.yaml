  - id: cal.1962-02-21.china-leadership
    when: Feb. 21
    date: '1962-02-21'
    place: peking
    thread: china-seven-thousand
    also: [china-retreat-1962, china-liu]
    c: 'Peking, the Xilou meeting room.{1} The enlarged Standing Committee, Liu Shaoqi presiding, Feb. 21–23, on the 1962 state budget and the economy ("the Xilou meeting"): bad harvests, short markets, rising prices, a budget deficit of 3 billion yuan.{2} Held to be like an emergency; a period of recovery to be fixed, the whole economy adjusted.{3} Measures proposed. Mao is in the south.{4} Yao Yilin reports on trade, 3 to 7:30 p.m. on the 21st; Yang Shangkun attends.{5} Zhou Enlai and Peng Zhen attend. Chen Yun, the 23rd: farming down, building too heavy, prices high, speculation; Liu: "I firmly support you."{6} Liu: the Seven Thousand Cadres Conference did not lay the difficulties bare; an extraordinary time needs extraordinary means.{7} Chen Yun, Li Fuchun and Li Xiannian are to relay it to the State Council''s Party groups.{8}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 21, 1962 (the entry for Feb. 21–23). [[w.zhou-enlai-nianpu-1949]], II, 460 (Feb. 21–23, 1962: Zhou Enlai attends; the discussion found a deficit of 5 billion yuan in that year''s budget; Chen Yun''s two stages, five years of recovery and then development; Zhou agrees); [[w.macfarquhar-origins-of-the-cultural]], III, 187–88 (Feb. 21–23: the Finance and Trade Office''s report, balanced at 30 billion yuan each side, found to hide a 1962 deficit of 5 to 6 billion; credit and currency figures; Liu orders a new report); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 549 (Feb. 21–23, 1962; Liu presides at the enlarged Politburo Standing Committee meeting at Xilou on the 1962 state budget and the economy; Liu: the work conference did not bring the difficulties fully to light; "if there is a problem, who does not wish to uncover it, afraid to say all is black?"; the present is a period of recovery, unlike the three years after 1949, an abnormal period with the character of an emergency, and not to be met by normal means; Chen Yun speaks on the economic situation and ways to overcome the difficulties, Liu approving, and Liu proposes a State Council meeting at which Chen Yun speaks more fully; Feb. 26 Chen Yun gives his report "Some measures for the present financial and economic situation and for overcoming difficulties" to the Party-group members of the State Council''s departments, with Li Fuchun and Li Xiannian on industry, construction, finance, credit and the market; afterward Liu proposes that the Center forward Chen Yun''s and the others'' reports to the whole country); [[w.yang-shangkun-riji]], II, 126 (Feb. 21, 1962; 3 to 7:30 p.m., at the Xilou 西楼, Liu Shaoqi''s meeting on finance and commerce; Yao Yilin reports on trade; to go on the next day); [[w.deng-xiaoping-nianpu-1904]], III, 1692 (Feb. 21–23, 1962; Deng at the West Building meeting, Liu presiding: the 1962 budget and the economy; the difficulties graver than reckoned at the enlarged work conference; a period of recovery, a broad readjustment; Chen Yun''s speech on the 23rd); [[w.mao-zedong-zhuan]], V, ch. 69 (Feb. 21–23, the Xilou meeting, Liu Shaoqi presiding over the enlarged Standing Committee at the west building 西楼 of Zhongnanhai, the three days, Chen Yun speaking on the 23rd). [[w.yang-jisheng-mubei]], II, 1174 (the Xilou meeting, Feb. 21–23, 1962, Liu Shaoqi presiding in the West Building of Zhongnanhai; Chen Yun''s grave estimate of the economy); [[w.yang-jisheng-mubei]], II, 1118–1119 n.18 (Liu at the Xilou meeting: the Seven Thousand conference was not frank enough on the difficulties; the present is a period of recovery but an abnormal, almost emergency one, to be met by extraordinary means; the book calls the meeting an enlarged Standing Committee, held Feb. 21 in the Xilou meeting room, Zhongnanhai); [[w.jian-zhou-enlai]], 463 (the Xilou Conference, Liu presiding, Chen Yun and Liu the main actors; Liu: the Seven Thousand Cadres Conference did not expose the difficulties; abnormal methods for an abnormal time; Zhou: the financial difficulties very serious, a decade of recovery needed); [[w.yang-jisheng-tiandi-fanfu]], I, 72 (the Xilou meeting room, Zhongnanhai; Liu: at the Seven Thousand conference the difficulties were not laid bare; "pitch dark," what is there to fear; an extraordinary time needs extraordinary means; Liu calls himself "president of an extraordinary time"); [[w.peng-zhen-nianpu-1902]], IV, 175 (Feb. 21–23, 1962; Peng Zhen at Liu Shaoqi''s enlarged Standing Committee in the Xilou (the "Xilou meeting") on the 1962 budget and the economy: farm output down, the market tight, prices up, inflation, a deficit of over 3 billion yuan, worse than thought at the Seven Thousand; an extraordinary time, agriculture first; ten years, first adjustment and recovery, then growth; Chen Yun speaks on the 23rd; Chen Yun, Li Fuchun and Li Xiannian to relay it to the State Council''s Party groups); [[w.dikotter-cultural-revolution]], 16–17 n.8 (after the conference, in Mao''s absence, Liu: lack of modesty and of experience the main reasons for the mess; the market to be put on top of everything; he and others propose contracting the fields to households); [[w.yang-shangkun-riji]], II, 126; [[w.peng-zhen-nianpu-1902]], IV, 175; [[w.zhou-enlai-nianpu-1949]], II, 460 (Zhou); [[w.jian-zhou-enlai]], 463 (Chen Yun''s points; Liu''s words); [[w.yang-jisheng-tiandi-fanfu]], I, 72; [[w.jian-zhou-enlai]], 463. Made public: 1996. Check: Zhou''s nianpu gives the deficit as 5 billion yuan, this entry 3 billion. Check: MacFarquhar gives the deficit found as 5 to 6 billion yuan (Li Xiannian''s estimate 6), this entry 3 billion. To check: [[w.gongheguo-zhuxi-liu-shaoqi]], 50–51 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 187 n.5); [[w.jin-1949-1989-niande-zhongguo]], 414 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 187 n.6a); [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 331 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 187 n.6b); [[w.deng-liqun-guoshi-jiangtan]], II, 456 (cited by [[w.jian-zhou-enlai]], 463 n.88); [[w.zhou-enlai-zhuan-1949]], II, 674 (cited by [[w.jian-zhou-enlai]], 463 n.90); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], II, 1051–1052 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 72 n.72); [[w.zhang-suhua-bianju-qiqian-ren-dahui-shimo]], 285 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 72 n.73); Extracts of the minutes of the Xilou meeting, Oct. 1967, Shanghai Municipal Archives, B104-3-41, pp. 7–9, 13 (cited by [[w.dikotter-cultural-revolution]], 17 n.8). Names: Liu Shaoqi, Yao Yilin, Yang Shangkun, Zhou Enlai, Peng Zhen, Chen Yun, Li Fuchun, Li Xiannian.'
