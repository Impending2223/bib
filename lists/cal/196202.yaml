    c: The Central Committee of the CPSU writes to the Central Committee of the CCP, in answer to the Chinese delegation's speech at the CPSU's Twenty-second Congress, which criticized, without naming the CPSU, the attack on Albania. It charges the CCP with a "special position," a line apart from the other parties', and support of Albania; it asks for better relations and more unity, and that the CCP give up the position and take the "common line."
