        - 'w.schlesinger-robert-kennedy-and-his 712–13: A, E'
        - 'w.gibbons-u-s-government-and II, 110: A, E'
        - 'via w.gibbons-u-s-government-and II, 110 n.90: A, E'
        - 'w.reeves-president-kennedy 284: A, E'
        - 'via w.reeves-president-kennedy 284 n.we-are-going-to-win-in: E'
    gloss:
      title: The record
      text:
        - 'The *Times*, Feb. 19, from Saigon, "Special to The New York Times." Two pieces. A statement it calls formal, "cleared with the State Department in urgent exchanges during the day": "This is a new kind of war, but war it is in a very real sense of the word. It is war fought not by massive divisions but secretly by terror, assassination, ambush and infiltration"; Hanoi "may deny its responsibility, but the guilt is clear," North Vietnam having broken "its signed pledge at Geneva in 1954"; Diệm "brave and patriotic"; "The American people will see Vietnam through these times of trouble." Then "a hurriedly summoned news conference": "We are going to win in Vietnam. We will remain here until we do win." Asked whether the United States was in a "war": "We are involved in a struggle"; the difference "a legal difference ... It is a struggle short of war." Asked by a British correspondent whether Americans approved, "American boys are dying out here": "I think the American people understand and fully support this struggle." On the reforms pressed on Diệm: "You heard my statement. We have full confidence in the President." Nhu heard the statement; "No questions were asked by the South Vietnamese press." A "two-hour stop"; Kennedy did not leave the field.'
        - 'Senator Morse''s question, Feb. 21, the day after Harriman''s testimony in executive session to the Foreign Relations Committee: "Do the Attorney General''s remarks at the Saigon Airport represent the policy of the Administration? Were they cleared by the President or the Department of State in advance?" The Department''s answer, sent to Fulbright Mar. 14, unclassified: a stop "only for purposes of refueling"; the remarks "informal and consisted largely of answers to questions from the press. In these circumstances there was no formal clearance of his statements. However, his remarks reflect the policy of the Administration toward Viet-Nam" (FRUS 1961–63, II, doc. 108, Q. 11). The editors: "about an hour while his plane was refueled."'
        - The *Times* has the statement cleared, the Department no formal clearance; the *Times* two hours, the editors one. The Department's answer speaks of the remarks, not the statement. Not among the Attorney General's speeches the Justice Department keeps, which hold the trip's others (Tokyo, Djakarta, Jogjakarta, Berlin, Bonn); the statement's text here is the *Times*'s. Check the Attorney General's papers, Kennedy Library (the trip's briefing book).
    tags: [name:kennedy-robert-f, name:ngo-dinh-diem, name:ngo-dinh-nhu, name:morse-wayne, place:tan-son-nhut]
