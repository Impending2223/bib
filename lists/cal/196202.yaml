  - id: cal.1962-02-14.indonesia
    when: Feb. 14
    date: '1962-02-14'
    thread: indonesia
    also: [robert-kennedy]
    c: 'Djakarta, an hour and a half with Sukarno, Djuanda and Ambassador Jones present: Robert Kennedy presses for talks with the Dutch on West New Guinea without preconditions; the Dutch ready to discuss anything, the transfer of the administration included. Sukarno to answer Sunday. On Pope, the CIA flier condemned in 1960, Sukarno offers to trade him for pressure on the Dutch; Kennedy refuses: Indonesia may execute him without changing the American position. Kennedy to the President and Rusk: Sukarno will drop the preconditions if the United States pushes.'
    n: 'Jones to Rusk, [FRUS 1961–63, XXIII, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v23/d231); Jones to Rusk, [FRUS 1961–63, XXIII, doc. 233](https://history.state.gov/historicaldocuments/frus1961-63v23/d233); Robert Kennedy to the President and Rusk, [FRUS 1961–63, XXIII, doc. 232](https://history.state.gov/historicaldocuments/frus1961-63v23/d232). [[w.schlesinger-robert-kennedy-and-his]], 569–72. Check: Schlesinger, by Seigenthaler''s and Robert Kennedy''s accounts, sets the hard exchange over Pope at the last meeting, the day before he left. Names: Sukarno, Robert Kennedy, John F. Kennedy, Rusk.'
