# Cal. XXVII January 4–31, 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXVII
entries:
  - id: cal.1963-01-07.missile-crisis
    when: Jan. 7
    date: '1963-01-07'
    thread: missile-crisis
    c: 'Stevenson and Kuznetsov write U Thant jointly: the Security Council need no longer consider the Cuban question. The New York talks end. Jan. 13: Kennedy thanks McCloy for his part.'
    n: '[FRUS 1961–63, XI, doc. 263](https://history.state.gov/historicaldocuments/frus1961-63v11/d263). [Letter to John J. McCloy Concerning His Part in Negotiations on Cuba](https://www.presidency.ucsb.edu/documents/letter-john-j-mccloy-concerning-his-part-negotiations-cuba) (Jan. 13, 1963). Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4). See [[cal.1962-11-20.missile-crisis]]. Names: Stevenson (K–J Adm. III.E); U Thant (K–J Adm. III.J).'
    tags: [name:stevenson-adlai-e, name:u-thant, name:mccloy-john-j, name:kennedy-john-f]
  - id: cal.1963-01-08.cuba
    when: Jan. 8
    date: '1963-01-08'
    thread: cuba
    c: 'NSAM 213. Cuban affairs to a coordinator at State, chairing an interdepartmental committee. Cottrell the coordinator.'
    n: '[FRUS 1961–63, XI, doc. 264](https://history.state.gov/historicaldocuments/frus1961-63v11/d264); Cottrell to the ExComm, Jan. 24, [doc. 272](https://history.state.gov/historicaldocuments/frus1961-63v11/d272). Fursenko & Naftali, *"One Hell of a Gamble"*; Freedman, *Kennedy''s Wars* (K–J Adm. II.D). See [[cal.1961-11-30.cuba]]. Names: Bundy (K–J Adm. III.E).'
    tags: [name:cottrell-sterling-j, name:bundy-mcgeorge, name:kennedy-john-f]
  - id: cal.1963-01-09.congress
    when: Jan. 9
    date: '1963-01-09'
    thread: congress
    c: '88th Congress convenes. Senate 67 D–33 R; House 258 D–176 R, one seat vacant. McCormack Speaker over Halleck, [256–175](https://voteview.com/rollcall/RH0880001). House Republicans make Ford conference chairman over Hoeven, 86–78. Check the tally and the date.'
    n: '[109 Cong. Rec., House, Jan. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-1-2.pdf); [109 Cong. Rec., Senate, Jan. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-1-1.pdf). Nelson, *John William McCormack* (K–J Cong. II.I.2). Peabody, *Leadership in Congress*; Jones, *The Minority Party in Congress* (Opp. II.D). Ford, *A Time to Heal* (Opp. II.G.2). CQ Almanac 1963 (K–J Cong. II.L). See [[cal.1963-01-03.congress]]. Names: McCormack (K–J Cong. III.C); Halleck, Ford (K–J Cong. III.C; Opp. III.C); Hoeven (Opp. III.C).'
    tags: [name:mccormack-john-w, name:halleck-charles-a, name:ford-gerald-r, name:hoeven-charles-b]
  - id: cal.1963-01-09.rules
    when: Jan. 9
    date: '1963-01-09'
    thread: rules
    c: 'House keeps the Rules Committee at fifteen for the new Congress, [235–196](https://voteview.com/rollcall/RH0880003). The previous question first, [249–183](https://voteview.com/rollcall/RH0880002).'
    n: 'H.R. Res. 5, 88th Cong. [109 Cong. Rec., House, Jan. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-1-2.pdf). Robinson, *The House Rules Committee* (K–J Cong. II.A). Dierenfield, *Keeper of the Rules* (K–J Cong. II.I.2). See [[cal.1961-01-31.rules]]. Names: Smith (K–J Cong. III.D); McCormack (K–J Cong. III.C).'
    tags: [name:smith-howard-w, name:mccormack-john-w]
  - id: cal.1963-01-14.program
    when: Jan. 14
    date: '1963-01-14'
    thread: program
    also: [economy]
    c: 'State of the Union. A tax cut of $13.5 billion, $10 billion net of reforms, over three years: individual rates 14 to 65 percent, from 20 to 91; corporate 47, from 52. Youth, a domestic service corps, education, hospital insurance through Social Security, counsel for poor defendants in federal courts, the vote.'
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-3) (Jan. 14, 1963). [109 Cong. Rec., House, Jan. 14, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-1.pdf). Sorensen, *Kennedy* (K–J Adm. II.G.2). Bernstein, *Promises Kept*; Giglio, *The Presidency of John F. Kennedy* (K–J Adm. II.A). Sundquist, *Politics and Policy* (K–J Cong. II.B). See [[cal.1962-01-11.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-01-14.alabama
    when: Jan. 14
    date: '1963-01-14'
    thread: alabama
    c: 'Wallace inaugurated at Montgomery. "Segregation now, segregation tomorrow, segregation forever."'
    n: '[Inaugural address](https://digital.archives.alabama.gov/digital/collection/voices/id/2952), Alabama Department of Archives and History (Jan. 14, 1963); recording (K–J Cong. II.K). Carter, *The Politics of Rage* (K–J Cong. II.H; 1968 II.A). Frady, *Wallace* (K–J Cong. II.I.3). Black, *Southern Governors and Civil Rights* (K–J Cong. II.H). See [[cal.1962-05-29.elections-1962]]. Names: Wallace (K–J Cong. III.F).'
    tags: [name:wallace-george-c]
  - id: cal.1963-01-14.europe-and-the-alliance
    when: Jan. 14
    date: '1963-01-14'
    thread: europe-and-the-alliance
    c: 'De Gaulle''s press conference at the Élysée. Britain not ready for the Common Market. The Polaris offer of Nassau refused: France keeps its own force.'
    n: '[FRUS 1961–63, XIII, doc. 57](https://history.state.gov/historicaldocuments/frus1961-63v13/d57) (Bohlen, Jan. 15). De Gaulle, *Mémoires d''espoir*; Macmillan, *At the End of the Day*; Adenauer, *Erinnerungen 1959–1963* (K–J Adm. II.G.7). Ball, *The Past Has Another Pattern*; Bohlen, *Witness to History* (K–J Adm. II.G.4). Trachtenberg, *A Constructed Peace* (K–J Adm. II.D). Frank Costigliola, *The Failed Design: Kennedy, de Gaulle, and the Struggle for Europe*, 8 Diplomatic History 227 (1984). Erin R. Mahan, *Kennedy, de Gaulle, and Western Europe* (2002). See [[cal.1962-12-18.europe-and-the-alliance]]. Names: de Gaulle, Macmillan (K–J Adm. III.J).'
    tags: [name:de-gaulle-charles, name:macmillan-harold]
  - id: cal.1963-01-14.court
    when: Jan. 14
    date: '1963-01-14'
    thread: court
    c: '*NAACP v. Button*, [371 U.S. 415](https://tile.loc.gov/storage-services/service/ll/usrep/usrep371/usrep371415/usrep371415.pdf). Virginia''s law against the NAACP''s soliciting of suits struck, 6–3: litigation is expression. Brennan for the Court; Harlan, Clark, Stewart dissent.'
    n: 'Opinions (K–J Cong. II.J.1). Stern & Wermiel, *Justice Brennan* (K–J Cong. II.G). See [[cal.1961-01-23.court]]. Names: Brennan, Harlan, Clark, Stewart (K–J Cong. III.G).'
    tags: [name:brennan-william-j-jr, name:harlan-john-marshall, name:clark-tom-c, name:stewart-potter]
  - id: cal.1963-01-14.congo
    when: Jan. 14–21
    date: '1963-01-14'
    thread: congo
    c: 'Tshombe writes U Thant: Katanga''s secession ended. UN forces enter Kolwezi, Jan. 21. Kennedy''s statement the same day.'
    n: '[FRUS 1961–63, XX, doc. 411](https://history.state.gov/historicaldocuments/frus1961-63v20/d411). [Statement by the President on the Restoration of Peace in the Congo](https://www.presidency.ucsb.edu/documents/statement-the-president-the-restoration-peace-the-congo) (Jan. 21, 1963). See [[cal.1962-12-28.congo]]. Names: Tshombe, U Thant (K–J Adm. III.J).'
    tags: [name:tshombe-moise, name:u-thant, name:kennedy-john-f]
  - id: cal.1963-01-14.rules
    when: Jan. 14–31
    date: '1963-01-14'
    thread: rules
    c: 'Anderson moves to take up a three-fifths cloture rule, S. Res. 9; Humphrey and Kuchel would have a majority. The Southerners talk. Jan. 28: Johnson declines to rule that a majority may close debate at a new Congress and puts the question to the Senate; tabled Jan. 31, [53–42](https://voteview.com/rollcall/RS0880001).'
    n: '[109 Cong. Rec., Senate, Jan. 14, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-2.pdf); [Jan. 28](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-13-2.pdf); [Jan. 31](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt2/pdf/GPO-CRECB-1963-pt2-1-1.pdf). [*Amending Senate Rules at the Start of a New Congress, 1953–1975*](https://www.everycrsreport.com/reports/R44395.html), CRS Report R44395 (2016). Finley, *Delaying the Dream* (K–J Cong. II.C). Anderson, *Outsider in the Senate* (K–J Cong. II.I.1). Clark, *The Senate Establishment* (K–J Cong. II.A). Caro, *The Passage of Power* (K–J Adm. II.F). See [[cal.1961-09-19.rules]]. Names: Anderson (K–J Cong. III.B); Humphrey (K–J Cong. III.A); Kuchel (K–J Cong. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:anderson-clinton-p, name:humphrey-hubert-h, name:kuchel-thomas-h, name:johnson-lyndon-b]
  - id: cal.1963-01-17.economy
    when: Jan. 17
    date: '1963-01-17'
    thread: economy
    c: 'Budget for fiscal 1964. Spending $98.8 billion, receipts $86.9 billion, a deficit of $11.9 billion with the tax cut; $8.8 billion estimated for 1963.'
    n: '[Annual Budget Message to the Congress, Fiscal Year 1964](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1964) (Jan. 17, 1963). Morgan, *Deficit Government*; Stein, *The Fiscal Revolution in America* (K–J Adm. II.B). See [[cal.1962-12-14.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-01-22.europe-and-the-alliance
    when: Jan. 22
    date: '1963-01-22'
    thread: europe-and-the-alliance
    c: 'De Gaulle and Adenauer sign the Franco-German treaty at the Élysée. Same day, Kennedy to the NSC: de Gaulle "relies on our power to protect him while he launches his policies based solely on the self-interest of France."'
    n: '[FRUS 1961–63, XIII, doc. 168](https://history.state.gov/historicaldocuments/frus1961-63v13/d168). Adenauer, *Erinnerungen 1959–1963* (K–J Adm. II.G.7). See [[cal.1963-01-14.europe-and-the-alliance]]. Names: de Gaulle, Adenauer (K–J Adm. III.J).'
    tags: [name:de-gaulle-charles, name:adenauer-konrad, name:kennedy-john-f]
  - id: cal.1963-01-22.specials
    when: Jan. 22
    date: '1963-01-22'
    thread: specials
    c: 'California 1st, special. Don Clausen (R) takes the seat of Clem Miller (D), killed in a crash Oct. 7 and reelected in November; 54.2 to 44.6 over Grader (D). Swing 5.6 to R.'
    n: '[109 Cong. Rec., House, Jan. 28, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-13-1.pdf) (Clausen sworn). Votes: Cal. *Statement of Vote*, Nov. 3, 1964, p. 28 ([archive.org](https://archive.org/details/castatem196264cali/page/n177)). See [[cal.1961-04-04.states-and-cities]]. Names: Grader (K–J Cong. III.K).'
    tags: [special:1963-01-22-h-CA-1, name:clausen-donald-h, name:miller-clement-w, name:grader-william-f]
  - id: cal.1963-01-24.economy
    when: Jan. 24
    date: '1963-01-24'
    thread: economy
    c: 'Tax message. Rates cut $13.6 billion over three years, $11 billion for persons and $2.6 billion for corporations; reforms recover $3.4 billion, among them a floor of 5 percent of income under itemized deductions. Individual rates 14 to 65 percent; corporate 47.'
    n: '[Special Message to the Congress on Tax Reduction and Reform](https://www.presidency.ucsb.edu/documents/special-message-the-congress-tax-reduction-and-reform); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-163) (Jan. 24, 1963). Revenue Act of 1964 (K–J Cong. II.J.2). Zelizer, *Taxing America* (K–J Cong. II.B). Manley, *The Politics of Finance* (K–J Cong. II.A). Stein, *The Fiscal Revolution in America*; Heller, *New Dimensions of Political Economy*; *The President and the Council of Economic Advisers* (K–J Adm. II.B). Rowen, *The Free Enterprisers* (K–J Adm. II.B). See [[cal.1962-12-14.economy]]. Names: Dillon, Heller (K–J Adm. III.H); Mills (K–J Cong. III.D).'
    tags: [name:kennedy-john-f, name:dillon-c-douglas, name:heller-walter-w, name:mills-wilbur-d]
  - id: cal.1963-01-24.europe-and-the-alliance
    when: Jan. 24
    date: '1963-01-24'
    thread: europe-and-the-alliance
    c: 'Merchant to prepare and negotiate the American proposals for a multilateral NATO nuclear force, with Finletter at the Council and Gerard Smith. Feb. 21: Kennedy''s instructions to the delegation.'
    n: '[Statement by the President on the Proposed Multilateral NATO Nuclear Force](https://www.presidency.ucsb.edu/documents/statement-the-president-the-proposed-multilateral-nato-nuclear-force) (Jan. 24, 1963). [FRUS 1961–63, XIII, doc. 176](https://history.state.gov/historicaldocuments/frus1961-63v13/d176). John D. Steinbruner, *The Cybernetic Theory of Decision* (1974). See [[cal.1962-12-18.europe-and-the-alliance]]. Names: Smith (Adm. III.D).'
    tags: [name:merchant-livingston-t, name:finletter-thomas-k, name:smith-gerard-c, name:kennedy-john-f]
  - id: cal.1963-01-25.vietnam
    when: Jan. 25
    date: '1963-01-25'
    thread: vietnam
    c: 'Hilsman and Forrestal report: "we are probably winning, but certainly more slowly than we had hoped." No countrywide plan; power in Diem''s family. Wheeler''s team for the Chiefs: victory "a hopeful prospect."'
    n: 'FRUS 1961–63, III, docs. [19](https://history.state.gov/historicaldocuments/frus1961-63v03/d19), [26](https://history.state.gov/historicaldocuments/frus1961-63v03/d26). Hilsman, *To Move a Nation* (K–J Adm. II.G.4). Winters, *The Year of the Hare* (Viet. II.B.8). See [[cal.1963-01-02.vietnam]]. Names: Hilsman, Forrestal, Wheeler (Viet. III.A); Diem (Viet. III.G).'
    tags: [name:hilsman-roger, name:forrestal-michael-v, name:wheeler-earle, name:ngo-dinh-diem]
  - id: cal.1963-01-26.testing
    when: Jan. 26
    date: '1963-01-26'
    thread: testing
    c: 'Nevada underground tests postponed while Foster talks with Fedorenko and Tsarapkin, and the British, in New York and Washington. The number of inspections not settled. The Soviets end the talks Jan. 31 (check the date); testing resumes in February.'
    n: '[Statement by the President on Postponing Underground Testing in Nevada](https://www.presidency.ucsb.edu/documents/statement-the-president-postponing-underground-testing-nevada) (Jan. 26, 1963); [Letter to Chairman Khrushchev on Nuclear Testing](https://www.presidency.ucsb.edu/documents/letter-chairman-khrushchev-nuclear-testing) (Jan. 20). FRUS 1961–63, VII, docs. [256](https://history.state.gov/historicaldocuments/frus1961-63v07/d256), [259](https://history.state.gov/historicaldocuments/frus1961-63v07/d259). Seaborg, *Kennedy, Khrushchev, and the Test Ban* (K–J Adm. II.D). See [[cal.1962-12-19.testing]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:kennedy-john-f, name:foster-william-c, name:fedorenko-nikolai-trofimovich-t, name:tsarapkin-semen-k, name:khrushchev-nikita-s]
  - id: cal.1963-01-28.states-and-cities
    when: Jan. 28
    date: '1963-01-28'
    thread: states-and-cities
    c: 'Harvey Gantt registers at Clemson, the first Black student, on the Fourth Circuit''s order of Jan. 16. No disorder.'
    n: '*Gantt v. Clemson Agricultural College*, [320 F.2d 611](https://static.case.law/f2d/320/html/0611-01.html) (4th Cir. 1963). See [[cal.1961-08-30.states-and-cities]]. Names: Gantt (K–J Cong. III.K).'
    tags: [name:gantt-harvey-b]
  - id: cal.1963-01-29.school-aid
    when: Jan. 29
    date: '1963-01-29'
    thread: school-aid
    c: 'Education message. One omnibus bill, the National Education Improvement Act: college loans, facilities, and fellowships; $1.5 billion over four years for public schools; vocational and adult education, libraries.'
    n: '[Special Message to the Congress on Education](https://www.presidency.ucsb.edu/documents/special-message-the-congress-education) (Jan. 29, 1963). Graham, *The Uncertain Triumph*; McAndrews, *Broken Ground* (K–J Adm. II.B). Munger & Fenno, *National Politics and Federal Aid to Education* (K–J Cong. II.B). See [[cal.1962-02-06.school-aid]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-01-29.europe-and-the-alliance
    when: Jan. 29
    date: '1963-01-29'
    thread: europe-and-the-alliance
    c: 'Britain''s negotiations with the Six broken off at Brussels on France''s insistence. Jan. 31: the ExComm reappraises policy toward Europe.'
    n: '[FRUS 1961–63, XIII, doc. 64](https://history.state.gov/historicaldocuments/frus1961-63v13/d64); Rusk to Schroeder, Jan. 28, [doc. 62](https://history.state.gov/historicaldocuments/frus1961-63v13/d62). Macmillan, *At the End of the Day* (K–J Adm. II.G.7). Zeiler, *American Trade and Power in the 1960s* (K–J Adm. II.B). See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Rusk (K–J Adm. III.E); Macmillan, de Gaulle (K–J Adm. III.J).'
    tags: [name:rusk-dean, name:macmillan-harold, name:de-gaulle-charles, name:kennedy-john-f]
  - id: cal.1963-01-30.europe-and-the-alliance
    when: Jan. 30
    date: '1963-01-30'
    thread: europe-and-the-alliance
    c: 'State''s press release on nuclear arms for Canada: no workable plan proposed; Nassau raises no question about warheads for Canadian forces. An answer to Diefenbaker in the Commons. Feb. 5: his government loses a vote of confidence; Pearson wins, Apr. 8.'
    n: '[FRUS 1961–63, XIII, doc. 444](https://history.state.gov/historicaldocuments/frus1961-63v13/d444); Butterworth, Feb. 3, [doc. 445](https://history.state.gov/historicaldocuments/frus1961-63v13/d445). Ball, *The Past Has Another Pattern* (K–J Adm. II.G.4). See [[cal.1962-12-18.europe-and-the-alliance]].'
    tags: [name:diefenbaker-john-g, name:pearson-lester-b]
