# Cal. XXXVIII January 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXVIII
entries:
  - id: cal.1963-01-02.vietnam
    when: Jan. 2
    date: '1963-01-02'
    thread: vietnam
    c: Ấp Bắc. The ARVN 7th Division, with American helicopters and advisers, fails against a Viet Cong battalion. Five helicopters down; three Americans killed. Vann briefs Halberstam and Sheehan; Harkins calls it a victory. Hilsman and Forrestal in Saigon.
    n: 'FRUS 1961–63, III, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v03/d1), [5](https://history.state.gov/historicaldocuments/frus1961-63v03/d5). [[w.toczek-battle-of-ap-bac]]; [[w.sheehan-bright-shining-lie]]; [[w.halberstam-making-of-a-quagmire]]. See [[cal.1961-01-28.vietnam]]. Names: Vann (Viet. III.C); Harkins (Viet. III.D); Huỳnh Văn Cao (Viet. III.G); Halberstam, Sheehan (Viet. III.F); Hilsman, Forrestal (Viet. III.A).'
    tags: [name:vann-john-paul, name:halberstam-david, name:sheehan-neil, name:harkins-paul-d, name:hilsman-roger, name:forrestal-michael-v]
  - id: cal.1963-01-03.congress
    when: Jan. 3
    date: '1963-01-03'
    thread: congress
    c: 87th Congress ends at noon. 88th convenes Jan. 9.
    n: '[Cong. Rec., Senate, Jan. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-1-1.pdf). See [[cal.1961-01-03.rules]]; [[cal.1961-11-16.congress]].'
    tags: [congress:88]
  - id: cal.1963-01-06.opinion
    when: Jan. 6
    date: '1963-01-06'
    thread: opinion
    also: [missile-crisis]
    c: 'Gallup, Dec. 13–18, 1962: Stevenson''s handling of his job at the UN, 64 percent approve, 11 disapprove.'
    n: '[[w.gallup-poll]], III, 1797. Names: Stevenson (K–J Adm. III.E).'
    tags: [name:stevenson-adlai-e]
  - id: cal.1963-01-07.missile-crisis
    when: Jan. 7
    date: '1963-01-07'
    thread: missile-crisis
    c: 'Stevenson and Kuznetsov write U Thant jointly: the Security Council need no longer consider the Cuban question. The New York talks end. Jan. 13: Kennedy thanks McCloy for his part.'
    n: '[FRUS 1961–63, XI, doc. 263](https://history.state.gov/historicaldocuments/frus1961-63v11/d263). [Letter to John J. McCloy Concerning His Part in Negotiations on Cuba](https://www.presidency.ucsb.edu/documents/letter-john-j-mccloy-concerning-his-part-negotiations-cuba) (Jan. 13, 1963). [[w.garthoff-reflections-on-the-cuban]]; [[w.coleman-fourteenth-day]]; [[w.martin-adlai-stevenson-and-the]]; [[w.bird-chairman]]. See [[cal.1962-11-20.missile-crisis]]. Names: Stevenson (K–J Adm. III.E); U Thant (K–J Adm. III.J).'
    tags: [name:stevenson-adlai-e, name:u-thant, name:mccloy-john-j, name:kennedy-john-f]
  - id: cal.1963-01-08.cuba
    when: Jan. 8
    date: '1963-01-08'
    thread: cuba
    c: NSAM 213. Cuban affairs to a coordinator at State, chairing an interdepartmental committee. Cottrell the coordinator.
    n: '[FRUS 1961–63, XI, doc. 264](https://history.state.gov/historicaldocuments/frus1961-63v11/d264); Cottrell to the ExComm, Jan. 24, [doc. 272](https://history.state.gov/historicaldocuments/frus1961-63v11/d272). [[w.fursenko-one-hell-of-a]]; [[w.freedman-kennedys-wars]]; [[w.bohning-castro-obsession]]; [[w.schoultz-that-infernal-little-cuban]]. See [[cal.1961-11-30.cuba]]. Names: Bundy (K–J Adm. III.E).'
    tags: [name:cottrell-sterling-j, name:bundy-mcgeorge, name:kennedy-john-f]
  - id: cal.1963-01-09.congress
    when: Jan. 9
    date: '1963-01-09'
    thread: congress
    c: 88th Congress convenes. Senate 67 D–33 R; House 258 D–176 R, one seat vacant. McCormack Speaker over Halleck, [256–175](https://voteview.com/rollcall/RH0880001). House Republicans make Ford conference chairman over Hoeven, 86–78. Check the tally and the date.
    n: '[109 Cong. Rec., House, Jan. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-1-2.pdf); [109 Cong. Rec., Senate, Jan. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-1-1.pdf). [[w.nelson-john-william-mccormack]]; [[w.macneil-forge-of-democracy]]; [[w.peabody-leadership-in-congress]]; [[w.jones-minority-party-in-congress]]; [[w.ford-time-to-heal]]; [[w.cannon-time-and-chance]]; [[w.smith-ordinary-man]]; [[w.scheele-charlie-halleck]]. CQ Almanac 1963 (K–J Cong. II.L). See [[cal.1963-01-03.congress]]. Names: McCormack (K–J Cong. III.C); Halleck, Ford (K–J Cong. III.C; Opp. III.C); Hoeven (Opp. III.C).'
    tags: [name:mccormack-john-w, name:halleck-charles-a, name:ford-gerald-r, name:hoeven-charles-b]
  - id: cal.1963-01-09.rules
    when: Jan. 9
    date: '1963-01-09'
    thread: rules
    c: House keeps the Rules Committee at fifteen for the new Congress, [235–196](https://voteview.com/rollcall/RH0880003). The previous question first, [249–183](https://voteview.com/rollcall/RH0880002).
    n: 'H.R. Res. 5, 88th Cong. [109 Cong. Rec., House, Jan. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-1-2.pdf). [[w.robinson-house-rules-committee]]; [[w.macneil-forge-of-democracy]]; [[w.bolling-house-out-of-order]]; [[w.dierenfield-keeper-of-the-rules]]. See [[cal.1961-01-31.rules]]. Names: Smith (K–J Cong. III.D); McCormack (K–J Cong. III.C).'
    tags: [name:smith-howard-w, name:mccormack-john-w]
  - id: cal.1963-01-13.opinion-5
    when: Jan. 13
    date: '1963-01-13'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 13–18: Republicans'' choice for 1964: Rockefeller 46, Goldwater 26, Romney 15, Scranton 5, Hatfield 2; no preference 6. Independents: Rockefeller 42, Goldwater 21. Nixon not on the list.'
    n: '[[w.gallup-poll]], III, 1799. Names: Rockefeller, Romney, Scranton (Opp. III.H); Goldwater, Hatfield (Opp. III.B); Nixon (Opp. III.E).'
    tags: [name:rockefeller-nelson, name:goldwater-barry-m, name:romney-george-w, name:scranton-william-w, name:hatfield-mark-o, name:nixon-richard-m]
  - id: cal.1963-01-14.program
    when: Jan. 14
    date: '1963-01-14'
    thread: program
    also: [economy]
    c: 'State of the Union. A tax cut of $13.5 billion, $10 billion net of reforms, over three years: individual rates 14 to 65 percent, from 20 to 91; corporate 47, from 52. Youth, a domestic service corps, education, hospital insurance through Social Security, counsel for poor defendants in federal courts, the vote.'
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-3) (Jan. 14, 1963). [109 Cong. Rec., House, Jan. 14, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-1.pdf). [[w.sorensen-kennedy]]; [[w.bernstein-promises-kept]]; [[w.giglio-presidency-of-john-f]]; [[w.sundquist-politics-and-policy]]. See [[cal.1962-01-11.program]].'
    tags: [name:kennedy-john-f]
    short: State of the Union
    to:
      - economy: cal.1963-01-24.economy
      - jobs-and-wages
      - school-aid
      - medicare
      - health
      - voting-rights
  - id: cal.1963-01-14.alabama
    when: Jan. 14
    date: '1963-01-14'
    thread: alabama
    c: Wallace inaugurated at Montgomery. "Segregation now, segregation tomorrow, segregation forever."
    n: '[Inaugural address](https://digital.archives.alabama.gov/digital/collection/voices/id/2952), Alabama Department of Archives and History (Jan. 14, 1963); recording (K–J Cong. II.K). [[w.carter-politics-of-rage-1995]]; [[w.frady-wallace]]; [[w.lesher-george-wallace]]; [[w.black-southern-governors-and-civil]]. See [[cal.1962-05-29.elections-1962]]. Names: Wallace (K–J Cong. III.F).'
    tags: [name:wallace-george-c]
  - id: cal.1963-01-14.europe-and-the-alliance
    when: Jan. 14
    date: '1963-01-14'
    thread: europe-and-the-alliance
    c: 'De Gaulle''s press conference at the Élysée. Britain not ready for the Common Market. The Polaris offer of Nassau refused: France keeps its own force.'
    n: '[FRUS 1961–63, XIII, doc. 57](https://history.state.gov/historicaldocuments/frus1961-63v13/d57) (Bohlen, Jan. 15). [[w.gaulle-memoires-despoir]]; [[w.jackson-de-gaulle]]; [[w.macmillan-at-the-end-of]]; [[w.adenauer-erinnerungen-1959-1963]]; [[w.ball-past-has-another-pattern]]; [[w.bohlen-witness-to-history-1929]]; [[w.costigliola-failed-design]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.ludlow-dealing-with-britain]]; [[w.trachtenberg-constructed-peace]]; [[w.bange-eec-crisis-of-1963]]; [[w.mahan-kennedy-de-gaulle-and]]. See [[cal.1962-12-18.europe-and-the-alliance]]. Names: de Gaulle, Macmillan (K–J Adm. III.J).'
    tags: [name:de-gaulle-charles, name:macmillan-harold]
  - id: cal.1963-01-14.court
    when: Jan. 14
    date: '1963-01-14'
    thread: court
    c: '*NAACP v. Button*, [371 U.S. 415](https://tile.loc.gov/storage-services/service/ll/usrep/usrep371/usrep371415/usrep371415.pdf). Virginia''s law against the NAACP''s soliciting of suits struck, 6–3: litigation is expression. Brennan for the Court; Harlan, Clark, Stewart dissent.'
    n: 'Opinions (K–J Cong. II.J.1). [[w.kalven-negro-and-the-first]]; [[w.stern-justice-brennan]]. See [[cal.1961-01-23.court]]. Names: Brennan, Harlan, Clark, Stewart (K–J Cong. III.G).'
    tags: [name:brennan-william-j-jr, name:harlan-john-marshall, name:clark-tom-c, name:stewart-potter]
  - id: cal.1963-01-14.congo
    when: Jan. 14–21
    date: '1963-01-14'
    thread: congo
    c: 'Tshombe writes U Thant: Katanga''s secession ended. UN forces enter Kolwezi, Jan. 21. Kennedy''s statement the same day.'
    n: '[FRUS 1961–63, XX, doc. 411](https://history.state.gov/historicaldocuments/frus1961-63v20/d411). [Statement by the President on the Restoration of Peace in the Congo](https://www.presidency.ucsb.edu/documents/statement-the-president-the-restoration-peace-the-congo) (Jan. 21, 1963). [[w.kalb-congo-cables]]; [[w.weissman-american-foreign-policy-in]]; [[w.mahoney-jfk]]; [[w.namikas-battleground-africa]]. See [[cal.1962-12-28.congo]]. Names: Tshombe, U Thant (K–J Adm. III.J).'
    tags: [name:tshombe-moise, name:u-thant, name:kennedy-john-f]
  - id: cal.1963-01-14.rules
    when: Jan. 14–31
    date: '1963-01-14'
    thread: rules
    c: 'Anderson moves to take up a three-fifths cloture rule, S. Res. 9; Humphrey and Kuchel would have a majority. A Southern filibuster. Jan. 28: Johnson declines to rule that a majority may close debate at a new Congress and puts the question to the Senate; tabled Jan. 31, [53–42](https://voteview.com/rollcall/RS0880001).'
    n: '[109 Cong. Rec., Senate, Jan. 14, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-2.pdf); [Jan. 28](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-13-2.pdf); [Jan. 31](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt2/pdf/GPO-CRECB-1963-pt2-1-1.pdf). [*Amending Senate Rules at the Start of a New Congress, 1953–1975*](https://www.everycrsreport.com/reports/R44395.html), CRS Report R44395 (2016). [[w.finley-delaying-the-dream]]; [[w.mann-walls-of-jericho]]; [[w.anderson-outsider-in-the-senate]]; [[w.humphrey-education-of-a-public-1976]]; [[w.clark-senate-establishment]]; [[w.binder-politics-or-principle]]; [[w.wawro-filibuster]]; [[w.koger-filibustering]]; [[w.caro-passage-of-power]]. See [[cal.1961-09-19.rules]]. Names: Anderson (K–J Cong. III.B); Humphrey (K–J Cong. III.A); Kuchel (K–J Cong. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:anderson-clinton-p, name:humphrey-hubert-h, name:kuchel-thomas-h, name:johnson-lyndon-b]
  - id: cal.1963-01-17.economy
    when: Jan. 17
    date: '1963-01-17'
    thread: economy
    c: Budget for fiscal 1964. Spending $98.8 billion, receipts $86.9 billion, a deficit of $11.9 billion with the tax cut; $8.8 billion estimated for 1963.
    n: '[Annual Budget Message to the Congress, Fiscal Year 1964](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1964) (Jan. 17, 1963). [[w.morgan-deficit-government]]; [[w.stein-fiscal-revolution-in-america]]; [[w.berman-office-of-management-and]]; [[w.wildavsky-politics-of-the-budgetary]]; [[w.fenno-power-of-the-purse]]. See [[cal.1962-12-14.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-01-22.europe-and-the-alliance
    when: Jan. 22
    date: '1963-01-22'
    thread: europe-and-the-alliance
    c: 'De Gaulle and Adenauer sign the Franco-German treaty at the Élysée. Same day, Kennedy to the NSC: de Gaulle "relies on our power to protect him while he launches his policies based solely on the self-interest of France."'
    n: '[FRUS 1961–63, XIII, doc. 168](https://history.state.gov/historicaldocuments/frus1961-63v13/d168). [[w.adenauer-erinnerungen-1959-1963]]; [[w.mayer-adenauer-and-kennedy]]; [[w.bange-eec-crisis-of-1963]]. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: de Gaulle, Adenauer (K–J Adm. III.J).'
    tags: [name:de-gaulle-charles, name:adenauer-konrad, name:kennedy-john-f]
  - id: cal.1963-01-22.specials
    when: Jan. 22
    date: '1963-01-22'
    thread: specials
    c: California 1st, special. Don Clausen (R) takes the seat of Clem Miller (D), killed in a crash Oct. 7 and reelected in November; 54.2 to 44.6 over Grader (D). Swing 5.6 to R.
    n: '[109 Cong. Rec., House, Jan. 28, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-13-1.pdf) (Clausen sworn). Votes: Cal. *Statement of Vote*, Nov. 3, 1964, p. 28 ([archive.org](https://archive.org/details/castatem196264cali/page/n177)). [[w.member-of-the-house]]. See [[cal.1961-04-04.states-and-cities]]. Names: Grader (K–J Cong. III.K).'
    tags: [special:1963-01-22-h-CA-1, name:clausen-donald-h, name:miller-clement-w, name:grader-william-f]
  - id: cal.1963-01-24.economy
    when: Jan. 24
    date: '1963-01-24'
    thread: economy
    c: Tax message. Rates cut $13.6 billion over three years, $11 billion for persons and $2.6 billion for corporations; reforms recover $3.4 billion, among them a floor of 5 percent of income under itemized deductions. Individual rates 14 to 65 percent; corporate 47.
    n: '[Special Message to the Congress on Tax Reduction and Reform](https://www.presidency.ucsb.edu/documents/special-message-the-congress-tax-reduction-and-reform); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-163) (Jan. 24, 1963). Revenue Act of 1964 (K–J Cong. II.J.2). [[w.zelizer-taxing-america]]; [[w.manley-politics-of-finance]]; [[w.stein-fiscal-revolution-in-america]]; [[w.heller-new-dimensions-of-political]]; [[w.flash-economic-advice-and-presidential]]; [[w.president-and-the-council]]; [[w.rowen-free-enterprisers]]; [[w.witte-politics-and-development-of]]; [[w.michelmore-tax-and-spend]]; [[w.bernstein-promises-kept]]; [[w.giglio-presidency-of-john-f]]. See [[cal.1962-12-14.economy]]. Names: Dillon, Heller (K–J Adm. III.H); Mills (K–J Cong. III.D).'
    tags: [name:kennedy-john-f, name:dillon-c-douglas, name:heller-walter-w, name:mills-wilbur-d]
  - id: cal.1963-01-24.europe-and-the-alliance
    when: Jan. 24
    date: '1963-01-24'
    thread: europe-and-the-alliance
    c: 'Merchant to prepare and negotiate the American proposals for a multilateral NATO nuclear force, with Finletter at the Council and Gerard Smith. Feb. 21: Kennedy''s instructions to the delegation.'
    n: '[Statement by the President on the Proposed Multilateral NATO Nuclear Force](https://www.presidency.ucsb.edu/documents/statement-the-president-the-proposed-multilateral-nato-nuclear-force) (Jan. 24, 1963). [FRUS 1961–63, XIII, doc. 176](https://history.state.gov/historicaldocuments/frus1961-63v13/d176). [[w.steinbruner-cybernetic-theory-of-decision]]; [[w.priest-kennedy-johnson-and-nato]]. See [[cal.1962-12-18.europe-and-the-alliance]]. Names: Smith (Adm. III.D).'
    tags: [name:merchant-livingston-t, name:finletter-thomas-k, name:smith-gerard-c, name:kennedy-john-f]
  - id: cal.1963-01-25.vietnam
    when: Jan. 25
    date: '1963-01-25'
    thread: vietnam
    c: 'Hilsman and Forrestal report: "we are probably winning, but certainly more slowly than we had hoped." No countrywide plan; power in Diệm''s family. Wheeler''s team for the Chiefs: victory "a hopeful prospect."'
    n: 'FRUS 1961–63, III, docs. [19](https://history.state.gov/historicaldocuments/frus1961-63v03/d19), [26](https://history.state.gov/historicaldocuments/frus1961-63v03/d26). [[w.hilsman-to-move-a-nation]]; [[w.winters-year-of-the-hare]]; [[w.kaiser-american-tragedy]]; [[w.ford-cia-and-the-vietnam]]. See [[cal.1963-01-02.vietnam]]. Names: Hilsman, Forrestal, Wheeler (Viet. III.A); Diệm (Viet. III.G).'
    tags: [name:hilsman-roger, name:forrestal-michael-v, name:wheeler-earle, name:ngo-dinh-diem]
  - id: cal.1963-01-26.testing
    when: Jan. 26
    date: '1963-01-26'
    thread: testing
    c: Nevada underground tests postponed while Foster talks with Fedorenko and Tsarapkin, and the British, in New York and Washington. The number of inspections not settled; testing resumes in February. The Soviets end the talks Jan. 31. Check the date.
    n: '[Statement by the President on Postponing Underground Testing in Nevada](https://www.presidency.ucsb.edu/documents/statement-the-president-postponing-underground-testing-nevada) (Jan. 26, 1963); [Letter to Chairman Khrushchev on Nuclear Testing](https://www.presidency.ucsb.edu/documents/letter-chairman-khrushchev-nuclear-testing) (Jan. 20). FRUS 1961–63, VII, docs. [256](https://history.state.gov/historicaldocuments/frus1961-63v07/d256), [259](https://history.state.gov/historicaldocuments/frus1961-63v07/d259). [[w.seaborg-kennedy-khrushchev-and-the]]; [[w.jacobson-diplomats-scientists-and-politicians]]. See [[cal.1962-12-19.testing]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:kennedy-john-f, name:foster-william-c, name:fedorenko-nikolai-trofimovich-t, name:tsarapkin-semen-k, name:khrushchev-nikita-s]
  - id: cal.1963-01-27.opinion
    when: Jan. 27
    date: '1963-01-27'
    thread: opinion
    also: [press-and-broadcasting, railroads]
    c: 'Gallup, Jan. 11–16: strikes in newspapers, telephones, radio, and television to be forbidden by law, 40 percent; not, 48. In the railroads, airlines, buses, and shipping, 43 and 46.'
    n: '[[w.gallup-poll]], III, 1801.'
  - id: cal.1963-01-28.states-and-cities
    when: Jan. 28
    date: '1963-01-28'
    thread: states-and-cities
    also: [desegregation-schools, south-carolina]
    c: Harvey Gantt registers at Clemson, the first Black student, on the Fourth Circuit's order of Jan. 16. No disorder.
    n: '*Gantt v. Clemson Agricultural College*, [320 F.2d 611](https://static.case.law/f2d/320/html/0611-01.html) (4th Cir. 1963). [[w.hollings-making-government-work]]. See [[cal.1961-08-30.states-and-cities]]. Names: Gantt (K–J Cong. III.K).'
    tags: [name:gantt-harvey-b]
  - id: cal.1963-01-29.school-aid
    when: Jan. 29
    date: '1963-01-29'
    thread: school-aid
    c: 'Education message. One omnibus bill, the National Education Improvement Act: college loans, facilities, and fellowships; $1.5 billion over four years for public schools; vocational and adult education, libraries.'
    n: '[Special Message to the Congress on Education](https://www.presidency.ucsb.edu/documents/special-message-the-congress-education) (Jan. 29, 1963). [[w.graham-uncertain-triumph]]; [[w.mcandrews-broken-ground]]; [[w.munger-national-politics-and-federal]]; [[w.sundquist-politics-and-policy]]. See [[cal.1962-02-06.school-aid]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-01-29.europe-and-the-alliance
    when: Jan. 29
    date: '1963-01-29'
    thread: europe-and-the-alliance
    c: 'Britain''s negotiations with the Six broken off at Brussels on France''s insistence. Jan. 31: the ExComm reappraises policy toward Europe.'
    n: '[FRUS 1961–63, XIII, doc. 64](https://history.state.gov/historicaldocuments/frus1961-63v13/d64); Rusk to Schroeder, Jan. 28, [doc. 62](https://history.state.gov/historicaldocuments/frus1961-63v13/d62). [[w.macmillan-at-the-end-of]]; [[w.zeiler-american-trade-and-power]]; [[w.ludlow-dealing-with-britain]]; [[w.bange-eec-crisis-of-1963]]. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Rusk (K–J Adm. III.E); Macmillan, de Gaulle (K–J Adm. III.J).'
    tags: [name:rusk-dean, name:macmillan-harold, name:de-gaulle-charles, name:kennedy-john-f]
  - id: cal.1963-01-30.europe-and-the-alliance
    when: Jan. 30
    date: '1963-01-30'
    thread: europe-and-the-alliance
    c: 'State''s press release on nuclear arms for Canada: no workable plan proposed; Nassau raises no question about warheads for Canadian forces. An answer to Diefenbaker in the Commons. Feb. 5: his government loses a vote of confidence; Pearson wins, Apr. 8.'
    n: '[FRUS 1961–63, XIII, doc. 444](https://history.state.gov/historicaldocuments/frus1961-63v13/d444); Butterworth, Feb. 3, [doc. 445](https://history.state.gov/historicaldocuments/frus1961-63v13/d445). [[w.ball-past-has-another-pattern]]; [[w.mcmahon-essence-of-indecision]]; [[w.mckercher-camelot-and-canada]]. See [[cal.1962-12-18.europe-and-the-alliance]].'
    tags: [name:diefenbaker-john-g, name:pearson-lester-b]
