# Cal. LXXXIX March 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXIX
entries:
  - id: cal.1967-03-01.congress
    when: Mar. 1–9
    date: '1967-03-01'
    thread: congress
    also: [states-and-cities]
    c: Powell excluded. The House refuses the previous question on the Select Committee's resolution, Celler its chairman (seat Powell, censure him, have him pay $40,000, take away his seniority), [202–222](https://voteview.com/rollcall/RH0900012). Curtis's amendment, to exclude him from the 90th Congress and declare the seat vacant, [248–176](https://voteview.com/rollcall/RH0900014); the resolution as amended, [307–116](https://voteview.com/rollcall/RH0900015). Powell and thirteen voters of his district sue McCormack and others in the District Court (Check the date). Mar. 9, the House hires counsel to defend the suit, [254–85](https://voteview.com/rollcall/RH0900020) on the previous question.
    n: '[113 Cong. Rec., House, Mar. 1, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-2.pdf). *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 489–493 (1969). See [[cal.1967-01-10.congress]]. Names: Powell, Celler, Curtis, McCormack.'
    tags: [name:powell-adam-clayton-jr, name:celler-emanuel, name:curtis-thomas-b, name:mccormack-john-w, state:ny, city:nyc]
  - id: cal.1967-03-01.vietnam
    when: Mar. 1–Apr. 4
    date: '1967-03-01'
    thread: vietnam
    also: [congress, defense]
    c: 'The war''s supplemental, 1967. Senate, Mar. 1: Clark''s amendment, rewritten by Mansfield''s substitute, [89–2](https://voteview.com/rollcall/RS0900024), adopted [72–19](https://voteview.com/rollcall/RS0900025): Congress''s support for the forces in Vietnam, for the President''s and others'' efforts to end the war by a negotiated settlement, and for the Geneva accords of 1954, with a conference to be convened. The authorization, S. 665, passes [89–2](https://voteview.com/rollcall/RS0900026). House, Mar. 2: a motion to recommit H.R. 4515, to bar its funds from military operations in or over North Vietnam, refused, [18–372](https://voteview.com/rollcall/RH0900017); the conference report, Mar. 8, [364–13](https://voteview.com/rollcall/RH0900018). Signed Mar. 16, [81 Stat. 5](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg5.pdf). The appropriation, some $12 billion: House, Mar. 16, [385–11](https://voteview.com/rollcall/RH0900022); Senate, Mar. 20, [77–3](https://voteview.com/rollcall/RS0900051); signed Apr. 4, [81 Stat. 8](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg8.pdf), Johnson objecting to its provisions restricting the use of funds.'
    n: '[113 Cong. Rec., Senate, Mar. 1, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-1.pdf). FRUS 1964–68, V, doc. [94](https://history.state.gov/historicaldocuments/frus1964-68v05/d94) (Johnson and Mansfield, Mar. 1). [Statement by the President Upon Signing Bill Authorizing Supplemental Appropriations for the Department of Defense](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-authorizing-supplemental-appropriations-for-the) (Mar. 16, 1967); [Statement by the President Stating His Objections to Restrictive Provisions in a Supplemental Appropriations Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-stating-his-objections-restrictive-provisions-supplemental) (Apr. 4, 1967). [[w.gibbons-u-s-government-and-1995]]. See [[cal.1966-03-01.vietnam]]. Names: Joseph Clark, Mansfield, Johnson.'
    tags: [name:clark-joseph-s, name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1967-03-01.assassination
    when: Mar. 1–22
    date: '1967-03-01'
    thread: assassination
    c: 'New Orleans. District Attorney Garrison arrests Clay Shaw, Mar. 1, on a charge of conspiring to murder Kennedy, his witness first questioned by Garrison''s office about Feb. 25. Preliminary hearing before three judges, Mar. 14–17: the witness testifies to a meeting at which Shaw, David Ferrie and Oswald spoke of killing the President; Shaw held for trial. The Orleans Parish grand jury indicts him, Mar. 22 (Check the dates of the hearing and the indictment).'
    n: '*Shaw v. Garrison*, [328 F. Supp. 390](https://static.case.law/f-supp/328/case-pdfs/0390-01.pdf) (E.D. La. 1971). [[w.kirkwood-american-grotesque]]; [[w.epstein-counterplot]]; [[w.lambert-false-witness]]. Names: Garrison, Shaw, Ferrie, Oswald, Kennedy.'
    tags: [name:kennedy-john-f, name:garrison-jim, name:shaw-clay, name:ferrie-david-w, name:oswald-lee-harvey, state:la, city:new-orleans]
  - id: cal.1967-03-01.opinion
    when: Mar. 1
    date: '1967-03-01'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Feb. 16–21: the Republican convention''s choice between Romney and Nixon: Romney 45 percent, Nixon 41, no opinion 14. Business leaders: Romney 57, Nixon 38.'
    n: '[[w.gallup-poll]], III, 2052. Names: Romney, Nixon.'
    tags: [name:romney-george-w, name:nixon-richard-m]
  - id: cal.1967-03-02.robert-kennedy
    when: Mar. 2
    date: '1967-03-02'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Robert Kennedy in the Senate on the war: stop the bombing of the North and say the United States is ready to negotiate within a week; the talks not to run on long without agreement; neither side to enlarge the war in the South; an international presence to replace American troops by degrees; every major political group in the South a part of the settlement. Rusk the same evening: such proposals made before, Hanoi refusing them (Check). Johnson''s news conference, and his letter to Senator Jackson of Mar. 1 on the reasons for the bombing, released the same day.'
    n: 'Kennedy''s speech, [113 Cong. Rec., Senate, Mar. 2, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-6-2.pdf), 5279–5284. [Letter to Senator Jackson Concerning the Bombing of North Vietnam](https://www.presidency.ucsb.edu/documents/letter-senator-jackson-concerning-the-bombing-north-vietnam) (released Mar. 2, 1967); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1187) (Mar. 2, 1967). FRUS 1964–68, V, docs. [95](https://history.state.gov/historicaldocuments/frus1964-68v05/d95), [96](https://history.state.gov/historicaldocuments/frus1964-68v05/d96) (Johnson with Jackson and Russell, Mar. 2), [105](https://history.state.gov/historicaldocuments/frus1964-68v05/d105) (Rostow on McNamara''s view of the proposal, Mar. 10). Made public: the telephone conversations, FRUS 1964–68, V (2002). [[w.schlesinger-robert-kennedy-and-his]]; [[w.shesol-mutual-contempt]]; [[w.thomas-robert-kennedy]]; [[w.gibbons-u-s-government-and-1995]]. See [[cal.1966-02-19.vietnam]]. Names: Robert Kennedy, Rusk, Johnson, Jackson.'
    tags: [name:kennedy-robert-f, name:rusk-dean, name:johnson-lyndon-b, name:jackson-henry-m]
  - id: cal.1967-03-02.soviet-union
    when: Mar. 2
    date: '1967-03-02'
    thread: soviet-union
    also: [defense]
    c: 'News conference: Kosygin''s reply to Johnson''s letter of Jan. 27 confirms the Soviet government''s willingness to discuss means of limiting the arms race in offensive and defensive nuclear missiles; the talks to begin in Moscow with Thompson. The texts not made public.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1187) (Mar. 2, 1967). FRUS 1964–68, XI, doc. [191](https://history.state.gov/historicaldocuments/frus1964-68v11/d191) (the principals on a proposal on strategic offensive and defensive missiles, Mar. 14). [[w.newhouse-cold-dawn]]; [[w.seaborg-stemming-the-tide]]; [[w.halperin-decision-to-deploy-the]]. See [[cal.1966-12-06.defense]]. Names: Kosygin, Thompson, Johnson.'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:thompson-llewellyn-e]
  - id: cal.1967-03-04.consumers
    when: Mar. 4
    date: '1967-03-04'
    thread: consumers
    c: Betty Furness, the actress and television announcer, named Special Assistant for Consumer Affairs, chairman of the President's Committee on Consumer Interests and executive secretary of the Consumer Advisory Council. She succeeds Esther Peterson, who keeps her post as Assistant Secretary of Labor.
    n: '[Statement by the President Announcing the Appointment of Miss Betty Furness as Special Assistant for Consumer Affairs](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-the-appointment-miss-betty-furness-special-assistant) (Mar. 4, 1967). [[w.peterson-restless]]. See [[cal.1964-02-05.program]]. Names: Betty Furness, Peterson, Johnson.'
    tags: [name:furness-betty, name:peterson-esther, name:johnson-lyndon-b]
  - id: cal.1967-03-05.opinion
    when: Mar. 5
    date: '1967-03-05'
    thread: opinion
    also: [elections-1968, robert-kennedy]
    c: 'Gallup, Feb. 16–21: Romney 48 percent, Robert Kennedy 46, undecided 6. Nixon 48, Kennedy 48, undecided 4; South, Nixon 57, Kennedy 37; East, Kennedy 53, Nixon 45.'
    n: '[[w.gallup-poll]], III, 2053. Names: Romney, Kennedy, Nixon.'
    tags: [name:romney-george-w, name:kennedy-robert-f, name:nixon-richard-m]
  - id: cal.1967-03-06.draft
    when: Mar. 6
    date: '1967-03-06'
    thread: draft
    also: [defense]
    c: 'Special message on Selective Service. The induction authority, expiring June 30, to be extended four years; men drafted from 19, the youngest first, reversing the order of the oldest first; undergraduate deferments not to become exemptions, and no new graduate deferments except in medicine and dentistry; uniform national rules for other deferments; a "fair and impartial random" (FAIR) system to set the order of call; the Marshall Commission kept a year more. The Commission''s report, *In Pursuit of Equity: Who Serves When Not All Serve?*, made public beforehand (Check the date): a lottery among men of 19, the student deferment ended (a majority), the local boards consolidated under regional offices. A panel under Mark Clark had reported to the House Armed Services Committee for keeping the student deferment and against a lottery (Check).'
    n: '[Special Message to the Congress on Selective Service](https://www.presidency.ucsb.edu/documents/special-message-the-congress-selective-service) (Mar. 6, 1967). [[w.service-in-pursuit-of-equity]]; [[w.flynn-draft-1940-1973]]; [[w.baskir-chance-and-circumstance]]; [[w.foley-confronting-the-war-machine]]. See [[cal.1966-07-02.defense]]. Names: Burke Marshall, Mark Clark, Johnson.'
    tags: [name:johnson-lyndon-b, name:marshall-burke, name:clark-mark-w]
  - id: cal.1967-03-06.soviet-union
    when: Mar. 6–Apr. 21
    date: '1967-03-06'
    thread: soviet-union
    also: [india-and-china]
    c: 'New Delhi. Svetlana Alliluyeva, Stalin''s daughter, in India since Dec. 20 with the ashes of her Indian companion, walks into the American Embassy, Mar. 6, and asks asylum in the United States. Bowles has a visa issued; she leaves that night for Rome, then Switzerland. Kohler to Dobrynin, Mar. 10: the United States acted on humanitarian grounds and is not encouraging her to come. Dobrynin, Mar. 23: American officials, the Ambassador among them, organized her flight. She arrives in New York, Apr. 21.'
    n: 'FRUS 1964–68, XIV, docs. [205](https://history.state.gov/historicaldocuments/frus1964-68v14/d205), [206](https://history.state.gov/historicaldocuments/frus1964-68v14/d206), [208](https://history.state.gov/historicaldocuments/frus1964-68v14/d208), [210](https://history.state.gov/historicaldocuments/frus1964-68v14/d210). Made public: FRUS 1964–68, XIV (2001). [[w.sullivan-stalins-daughter]]. Names: Alliluyeva, Stalin, Bowles, Kohler, Dobrynin.'
    tags: [name:stalin-joseph, name:alliluyeva-svetlana, name:bowles-chester, name:kohler-foy-d, name:dobrynin-anatoly]
  - id: cal.1967-03-07.congress
    when: Mar. 7
    date: '1967-03-07'
    thread: congress
    c: 'The Senate passes the Legislative Reorganization Act of 1967, S. 355, [75–9](https://voteview.com/rollcall/RS0900043), the Joint Committee''s bill: more professional staff for committees, a legislative assistant for each Senator, review specialists, the guide service. Amendments to change Rule XXII and to require germane debate tabled, Mar. 2, [64–18](https://voteview.com/rollcall/RS0900030) and [68–13](https://voteview.com/rollcall/RS0900028). The House takes no action this Congress (Check).'
    n: '[[w.zelizer-on-capitol-hill]]; [[w.schickler-disjointed-pluralism]]. See [[cal.1965-03-09.congress]].'
  - id: cal.1967-03-08.opinion
    when: Mar. 8
    date: '1967-03-08'
    thread: opinion
    also: [soviet-union, india-and-china]
    c: 'Gallup, Feb. 16–21: the greater threat to world peace: Communist China 71 percent, Russia 20. In a war between the United States and China, Russia on the American side 48, on China''s 37. Dec. 8–13, 1966, attitude toward Russia: highly favorable 2, mildly favorable 15, mildly unfavorable 28, highly unfavorable 48.'
    n: '[[w.gallup-poll]], III, 2053.'
  - id: cal.1967-03-09.economy
    when: Mar. 9–16
    date: '1967-03-09'
    thread: economy
    c: 'Special message: the 7 percent investment credit and accelerated depreciation on buildings, suspended in October to Jan. 1, 1968, to be restored at once; capital spending and orders have fallen. The House passes H.R. 6950, Mar. 16, [386–2](https://voteview.com/rollcall/RH0900023).'
    n: '[Special Message to the Congress Recommending Reinstatement of the Investment Tax Credit and Accelerated Depreciation](https://www.presidency.ucsb.edu/documents/special-message-the-congress-recommending-reinstatement-the-investment-tax-credit-and) (Mar. 9, 1967). See [[cal.1966-09-30.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-12.india-and-china
    when: Mar. 12
    date: '1967-03-12'
    thread: india-and-china
    c: 'Djakarta. The Provisional People''s Consultative Assembly (MPRS) withdraws Sukarno''s mandate by acclamation; Suharto sworn as Acting President at 10:45 p.m. Green, Mar. 15: all effective power formally removed from Sukarno.'
    n: 'FRUS 1964–68, XXVI, docs. [232](https://history.state.gov/historicaldocuments/frus1964-68v26/d232), [233](https://history.state.gov/historicaldocuments/frus1964-68v26/d233). [[w.simpson-economists-with-guns]]. See [[cal.1966-03-11.india-and-china]]. Names: Sukarno, Suharto, Green.'
    tags: [name:sukarno, name:suharto, name:green-marshall]
  - id: cal.1967-03-12.opinion
    when: Mar. 12
    date: '1967-03-12'
    thread: opinion
    also: [vietnam, elections-1968]
    c: 'Gallup, Feb. 16–21: with Vietnam, a better job than Johnson or a worse. Robert Kennedy: better 26 percent, worse 14, no difference 50. Nixon: better 30, worse 18, no difference 41. Romney: better 26, worse 10, no difference 41.'
    n: '[[w.gallup-poll]], III, 2054. Names: Kennedy, Nixon, Romney, Johnson.'
    tags: [name:kennedy-robert-f, name:nixon-richard-m, name:romney-george-w, name:johnson-lyndon-b]
  - id: cal.1967-03-13.latin-america
    when: Mar. 13–22
    date: '1967-03-13'
    thread: latin-america
    also: [foreign-aid]
    c: 'Special message on the meeting of the American Presidents at Punta del Este in April: Congress asked to approve a commitment of up to $1.5 billion more in aid over five years, about $300 million a year, beyond the $1 billion a year given; support for a Latin American common market. The House passes H.J. Res. 428, Mar. 22, [234–117](https://voteview.com/rollcall/RH0900031), after refusing to recommit it, [147–210](https://voteview.com/rollcall/RH0900030). The Senate takes no vote before the meeting (Check).'
    n: '[Special Message to the Congress on the Latin American Summit Meeting](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-latin-american-summit-meeting) (Mar. 13, 1967). FRUS 1964–68, XXXI, doc. [434](https://history.state.gov/historicaldocuments/frus1964-68v31/d434). [[w.levinson-alliance-that-lost-its]]; [[w.taffet-foreign-aid-as-foreign]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-14.poverty
    when: Mar. 14
    date: '1967-03-14'
    thread: poverty
    c: 'Special message, "America''s Unfinished Business, Urban and Rural Poverty." More for the Office of Economic Opportunity, its administration tightened. Seven aims: community action agencies to plan, audit and hire better; public officials a voice in their policy; a larger part for the States, in rural areas especially; more private enterprise; welfare recipients helped to work; new direction for rural programs; the Economic Opportunity Council to coordinate. Programs aiding the poor in the fiscal 1968 budget, $25.6 billion, $3.6 billion over 1967.'
    n: '[Special Message to the Congress: America''s Unfinished Business, Urban and Rural Poverty](https://www.presidency.ucsb.edu/documents/special-message-the-congress-americas-unfinished-business-urban-and-rural-poverty) (Mar. 14, 1967). [[w.davies-from-opportunity-to-entitlement]]; [[w.matusow-unraveling-of-america]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-14.vietnam
    when: Mar. 14–28
    date: '1967-03-14'
    thread: vietnam
    c: 'U Thant''s aide-mémoire, Mar. 14: a general standstill truce; preliminary talks; then a reconvened Geneva conference. The United States accepts, Mar. 18, asking that the arrangements be worked out with both sides; Saigon accepts with proposals of its own. Hanoi''s Foreign Ministry rejects it, Mar. 27: the United Nations has no right to interfere in Vietnam. Thant releases the texts, Mar. 28; Johnson the same day, welcoming the Afghan Prime Minister, accepts the proposal in public. Thant had seen Hà Văn Lâu, Hanoi''s representative, at Rangoon, Mar. 2.'
    n: 'FRUS 1964–68, V, docs. [98](https://history.state.gov/historicaldocuments/frus1964-68v05/d98), [111](https://history.state.gov/historicaldocuments/frus1964-68v05/d111), [112](https://history.state.gov/historicaldocuments/frus1964-68v05/d112), [123](https://history.state.gov/historicaldocuments/frus1964-68v05/d123). [Remarks of Welcome at the White House to Prime Minister Maiwandwal of Afghanistan](https://www.presidency.ucsb.edu/documents/remarks-welcome-the-white-house-prime-minister-maiwandwal-afghanistan) (Mar. 28, 1967). *American Foreign Policy: Current Documents, 1967*, 892–893. [[w.herring-secret-diplomacy-of-the]]; [[w.kraslow-secret-search-for-peace]]; [[w.gibbons-u-s-government-and-1995]]. Names: U Thant, Hà Văn Lâu, Johnson.'
    tags: [name:u-thant, name:ha-van-lau, name:johnson-lyndon-b]
  - id: cal.1967-03-15.vietnam
    when: Mar. 15
    date: '1967-03-15'
    thread: vietnam
    c: 'Nashville, to a joint session of the Tennessee legislature, after the Hermitage: the bombing of military targets in the North, its three purposes, the sanctuary denied, the penalty exacted, infiltration limited or made dearer; not decisive, but a serious problem for Hanoi. Bunker to succeed Lodge in Saigon; Locke, Ambassador to Pakistan, his deputy; Komer to Saigon for pacification.'
    n: '[Address on U.S. Policy in Vietnam Delivered Before a Joint Session of the Tennessee State Legislature](https://www.presidency.ucsb.edu/documents/address-us-policy-vietnam-delivered-before-joint-session-the-tennessee-state-legislature) (Mar. 15, 1967). FRUS 1964–68, V, doc. [97](https://history.state.gov/historicaldocuments/frus1964-68v05/d97) (Johnson to Rusk, Mar. 2: Westmoreland considered for the embassy). [[w.schaffer-ellsworth-bunker]]; [[w.jones-blowtorch]]; [[w.gibbons-u-s-government-and-1995]]. Names: Bunker, Lodge, Locke, Komer, Johnson.'
    tags: [name:johnson-lyndon-b, name:bunker-ellsworth, name:lodge-henry-cabot, name:locke-eugene-m, name:komer-robert-w, state:tn, city:nashville]
  - id: cal.1967-03-15.opinion
    when: Mar. 15
    date: '1967-03-15'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, special survey: no strike to last more than seven days, then a Government-appointed committee to settle it, binding on both: favor 54 percent, oppose 36; business leaders 22 and 70. Unions covering whole industries under the antitrust laws: agree 45, disagree 25; business leaders 88 and 8. Business leaders, new ways to settle industry-wide strikes: yes 83.'
    n: '[[w.gallup-poll]], III, 2054–55.'
  - id: cal.1967-03-16.soviet-union
    when: Mar. 16
    date: '1967-03-16'
    thread: soviet-union
    c: 'The Senate consents to the Consular Convention with the Soviet Union, signed at Moscow June 1, 1964, [19 U.S.T. 5018](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-19-4/lltreaties-19-4.pdf#page=940), [655 U.N.T.S. 214](https://treaties.un.org/doc/Publication/UNTS/Volume%20655/volume-655-I-9383-English.pdf), [66–28](https://voteview.com/rollcall/RS0900050). Reported by Foreign Relations, 15–4, Feb. 28. Refused: an amendment ending criminal immunity for Soviet consular staff, Mar. 9, [26–53](https://voteview.com/rollcall/RS0900044); reservations holding it back until the Soviets met conditions on freedom of the press, Mar. 14, [22–65](https://voteview.com/rollcall/RS0900045), or until the President advised Congress that the war in Vietnam was over or that Soviet aid to North Vietnam was not delaying the withdrawal of American troops, Mar. 15, [25–67](https://voteview.com/rollcall/RS0900046). Johnson ratifies Mar. 31. In force July 13, 1968 (Check).'
    n: '[Statement by the President Following Senate Approval of the Consular Convention With the U.S.S.R.](https://www.presidency.ucsb.edu/documents/statement-the-president-following-senate-approval-the-consular-convention-with-the-ussr) (Mar. 16, 1967). FRUS 1964–68, XIV, doc. [207](https://history.state.gov/historicaldocuments/frus1964-68v14/d207). [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1966-10-07.europe-and-the-alliance]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-18.vietnam
    when: Mar. 18
    date: '1967-03-18'
    thread: vietnam
    also: [defense]
    c: 'Westmoreland to Sharp, MACV 09101, "Force Requirements": the 470,000 of Program Four will not permit operations "of the scope and intensity required to avoid an unreasonably protracted war." Asked: a "minimum essential force" of 2⅓ divisions more, as soon as possible and not later than July 1, 1968; an "optimum force" of 4⅔ divisions, with ten tactical fighter squadrons.'
    n: 'FRUS 1964–68, V, doc. [110](https://history.state.gov/historicaldocuments/frus1964-68v05/d110). Made public: [[w.pentagon-papers]] (1971). [[w.berman-lyndon-johnsons-war]]; [[w.westmoreland-soldier-reports]]; [[w.sorley-westmoreland]]; [[w.gibbons-u-s-government-and-1995]]; [[w.herring-lbj-and-vietnam]]. Names: Westmoreland, Sharp.'
    tags: [name:westmoreland-william, name:sharp-u-s-grant]
  - id: cal.1967-03-18.states-and-cities-us
    when: Mar. 18
    date: '1967-03-18'
    thread: states-and-cities
    c: 'White House Conference with the Governors. Johnson on "a new federalism": grants in aid $15 billion this year, $30 million in 1920, and could quadruple in five years; 400 authorities for grant programs. Authority to the States for "local treatment of local problems"; the governors to advise and consult with the President.'
    n: '[Remarks at a White House Conference With the Governors](https://www.presidency.ucsb.edu/documents/remarks-white-house-conference-with-the-governors); [Remarks at the Governors'' Luncheon](https://www.presidency.ucsb.edu/documents/remarks-the-governors-luncheon); [The President''s Toast at a Dinner for the Governors](https://www.presidency.ucsb.edu/documents/the-presidents-toast-dinner-for-the-governors) (Mar. 18, 1967). [[w.sabato-goodbye-to-good-time]]; [[w.conlan-new-federalism]]; [[w.sparacino-democratic-and-republican-governors]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-19.opinion
    when: Mar. 19
    date: '1967-03-19'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Mar. 9–14: Republicans'' choice for 1968: Nixon 39 percent, Romney 30, Rockefeller 9, Reagan 8, Percy 4, Hatfield 4, Lindsay 2; no preference 4. The best candidate: Nixon 39, Romney 34. Of the two: Nixon 53, Romney 41.'
    n: '[[w.gallup-poll]], III, 2055. Names: Nixon, Romney, Rockefeller, Reagan, Percy, Hatfield, Lindsay.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:rockefeller-nelson, name:reagan-ronald, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v]
  - id: cal.1967-03-20.vietnam
    when: Mar. 20–21
    date: '1967-03-20'
    thread: vietnam
    c: 'Guam. Johnson with Thiệu and Kỳ; Rusk, McNamara, Wheeler, Westmoreland, Lodge, Bunker, Harriman, Sharp, Komer with him. The Constituent Assembly had adopted the constitution, Mar. 18, unanimously; Kỳ: the Directorate agrees. Bunker, Locke and Komer presented as the new team. Joint statement, Mar. 21: a President to be elected under the constitution within four to five months, a legislature shortly after; village and hamlet elections from April; pacification "now beginning to show encouraging results." Johnson back in Washington the night of Mar. 21.'
    n: '[Statement by the President on the New Constitution Adopted by the Constituent Assembly of the Republic of Vietnam](https://www.presidency.ucsb.edu/documents/statement-the-president-the-new-constitution-adopted-the-constituent-assembly-the-republic) (Mar. 20, 1967); [Joint Statement Following the Meeting in Guam With Chairman Thieu and Prime Minister Ky](https://www.presidency.ucsb.edu/documents/joint-statement-following-the-meeting-guam-with-chairman-thieu-and-prime-minister-ky) (Mar. 21, 1967); [The President''s News Conference in Guam Following the Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-guam-following-the-conference) (Mar. 21, 1967). FRUS 1964–68, V, docs. [115](https://history.state.gov/historicaldocuments/frus1964-68v05/d115), [116](https://history.state.gov/historicaldocuments/frus1964-68v05/d116), [119](https://history.state.gov/historicaldocuments/frus1964-68v05/d119). [[w.johnson-vantage-point]]; [[w.schaffer-ellsworth-bunker]]; [[w.jones-blowtorch]]; [[w.gibbons-u-s-government-and-1995]]. See [[cal.1966-09-11.vietnam]]; [[cal.1967-03-15.vietnam]]. Names: Johnson, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Rusk, McNamara, Wheeler, Westmoreland, Lodge, Bunker, Harriman, Sharp, Komer, Locke.'
    tags: [name:johnson-lyndon-b, name:nguyen-van-thieu, name:nguyen-cao-ky, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:westmoreland-william, name:lodge-henry-cabot, name:bunker-ellsworth, name:harriman-w-averell, name:sharp-u-s-grant, name:komer-robert-w, name:locke-eugene-m]
  - id: cal.1967-03-21.vietnam
    when: Mar. 21
    date: '1967-03-21'
    thread: vietnam
    c: 'Radio Hanoi broadcasts Johnson''s letter to Hồ Chí Minh of Feb. 8 and Hồ''s reply of Feb. 15; the White House releases Johnson''s letter the same day. Johnson: direct talks, and an end to the bombing of the North and to the further augmentation of American forces in the South, once infiltration by land and by sea has stopped. Hồ: the unconditional end of the bombing and of all other acts of war against the North first; then talks.'
    n: '[Letter to Ho Chi Minh Proposing Bilateral Discussions on the Vietnam Conflict](https://www.presidency.ucsb.edu/documents/letter-ho-chi-minh-proposing-bilateral-discussions-the-vietnam-conflict) (made public Mar. 21, 1967). Hồ''s reply, 56 *Dep''t St. Bull.* 596 (1967). See [[cal.1967-01-04.vietnam]]. Names: Hồ Chí Minh, Johnson.'
    tags: [name:johnson-lyndon-b, name:ho-chi-minh]
  - id: cal.1967-03-22.states-and-cities-nv
    when: Mar. 22
    date: '1967-03-22'
    thread: states-and-cities
    c: 'Las Vegas. Howard Hughes, in the Desert Inn since Nov. 1966, buys it: $13.2 million (Check). The legislature''s corporate gaming act of 1967, pressed by Laxalt: corporations may hold casino licenses (Check the terms and date).'
    n: 'Check: Nev. Stats. 1967. *Las Vegas Sun*, ["How Vegas went from mob to corporate"](https://lasvegassun.com/news/2008/may/15/how-vegas-went-mob-corporate/), May 15, 2008. [[w.moehring-resort-city-in-the]]; [[w.laxalt-nevadas-paul-laxalt]]; [[w.elliott-history-of-nevada]]. Names: Hughes, Laxalt.'
    tags: [state:nv, city:las-vegas, name:hughes-howard-r-jr, name:laxalt-paul]
  - id: cal.1967-03-22.opinion
    when: Mar. 22
    date: '1967-03-22'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Mar. 9–14: Nixon 48 percent, Johnson 48, undecided 4; independents, Nixon 52, Johnson 42. Romney 52, Johnson 43, undecided 5; independents, Romney 60, Johnson 34. Johnson will run again in 1968: will 72, will not 21.'
    n: '[[w.gallup-poll]], III, 2055–56. Names: Nixon, Johnson, Romney.'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b, name:romney-george-w]
  - id: cal.1967-03-24.trade
    when: Mar. 24
    date: '1967-03-24'
    thread: trade
    c: Roth sworn as Special Representative for Trade Negotiations, Herter's deputy and successor, the Kennedy Round to end by June 30, when the Trade Expansion Act's authority lapses.
    n: '[Statement by the President on the Swearing In of William Roth as Special Representative for Trade Negotiations](https://www.presidency.ucsb.edu/documents/statement-the-president-the-swearing-william-roth-special-representative-for-trade) (Mar. 24, 1967). FRUS 1964–68, VIII, doc. [334](https://history.state.gov/historicaldocuments/frus1964-68v08/d334) (Roth to Johnson, Mar. 13). [[w.preeg-traders-and-diplomats]]; [[w.zeiler-american-trade-and-power]]. See [[cal.1966-12-30.trade]]. Names: Roth, Herter, Johnson.'
    tags: [name:roth-william-m, name:herter-christian-a, name:johnson-lyndon-b]
  - id: cal.1967-03-24.state-constitutions-md
    when: Mar. 24
    date: '1967-03-24'
    thread: state-constitutions
    c: 'Maryland. Agnew signs H.B. 28, the procedures for the constitutional convention: delegates elected without party designation June 13, the convention to open at Annapolis, Md., Sept. 12.'
    n: 'Agnew, [Statement on the Signing of House Bill 28](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--116.html), Mar. 24, 1967, 83 Archives of Maryland 116–17. [Archives of Maryland, "Constitutional Convention, 1967–1968"](https://www.msa.maryland.gov/msa/speccol/sc2600/sc2685/html/conv1967.html). [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-09-13.state-constitutions-md]]. Names: Agnew.'
    tags: [state:md, name:agnew-spiro-t]
  - id: cal.1967-03-25.war-opposition
    when: Mar. 25
    date: '1967-03-25'
    thread: war-opposition
    also: [king]
    c: Chicago. King leads a march against the war down State Street, some 5,000, Spock with him (Check), his first such march; at the Coliseum he speaks against the war.
    n: '[[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]; [[w.fairclough-to-redeem-the-soul]]; [[w.debenedetti-american-ordeal]]. Names: Martin Luther King, Spock.'
    tags: [name:king-martin-luther-jr, name:spock-benjamin, state:il, city:chicago]
  - id: cal.1967-03-26.opinion
    when: Mar. 26
    date: '1967-03-26'
    thread: opinion
    also: [elections-1968, robert-kennedy]
    c: 'Gallup, Mar. 9–14: the Democratic convention''s choice between Robert Kennedy and Johnson: Johnson 45 percent, Kennedy 41, undecided 14. Democrats: Kennedy 48, Johnson 44. Those 21 to 29: Kennedy 56, Johnson 33; 50 and over, Johnson 51, Kennedy 31.'
    n: '[[w.gallup-poll]], III, 2056–57. Names: Kennedy, Johnson.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1967-03-28.specials
    when: Mar. 28
    date: '1967-03-28'
    thread: specials
    c: Rhode Island 2d, special. Tiernan (D), a State senator, holds Fogarty's seat by 303 votes, 48.8 percent to the Republican's 48.5. Fogarty died Jan. 10.
    n: 'Votes: CQ Guide 6th (2010) 1281. Check: *R.I. Manual*, 1969–70. See [[cal.1966-11-08.specials-2]]. Names: Tiernan, Fogarty.'
    tags: [special:1967-03-28-h-RI-2, name:tiernan-robert-o, name:fogarty-john-e]
  - id: cal.1967-03-29.intelligence
    when: Mar. 29
    date: '1967-03-29'
    thread: intelligence
    also: [students]
    c: 'The Katzenbach committee''s report, Katzenbach, Gardner and Helms: "No federal agency shall provide any covert financial assistance or support, direct or indirect, to any of the nation''s educational or private voluntary organizations"; support given to end as quickly as possible without destroying the organizations. Johnson accepts the policy and asks Rusk to head a committee on a public-private mechanism to fund such activities abroad openly.'
    n: '[Statement by the President Concerning the Report on the Relationship Between the CIA and Private Voluntary Organizations](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-the-report-the-relationship-between-the-cia-and-private) (Mar. 29, 1967); the report, 3 *Weekly Comp. Pres. Doc.* 556. FRUS 1964–68, XXXIII, doc. [415](https://history.state.gov/historicaldocuments/frus1964-68v33/d415). [[w.paget-patriotic-betrayal]]. See [[cal.1967-02-13.intelligence]]. Names: Katzenbach, Gardner, Helms, Rusk, Johnson.'
    tags: [name:katzenbach-nicholas, name:gardner-john-w, name:helms-richard, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1967-03-29.opinion
    when: Mar. 29
    date: '1967-03-29'
    thread: opinion
    also: [open-housing]
    c: 'Gallup, Mar. 9–14: knew what "open housing" means, 58 percent. Of them, Congress to pass an open-housing law: pass 35, reject 54. East 44 and 40; Midwest 39 and 49; South 22 and 71; West 30 and 64.'
    n: '[[w.gallup-poll]], III, 2057.'
  - id: cal.1967-03-30.alabama-al
    when: Mar. 30
    date: '1967-03-30'
    thread: alabama
    also: [desegregation-schools, legislatures]
    c: 'Lurleen Wallace, on statewide television, to a joint session of the legislature in special session, on the three-judge court''s order of Mar. 22 to desegregate the State''s schools: an appeal; the legislature to sit as a committee of the whole and hear the educators; if a stay is refused or the appeal fails, "all powers heretofore vested ... in the State Superintendent of Education" to be placed in the governor, or the governor and legislature; the State''s "police power" to be invoked. May 2, to the regular session, no word of taking over the schools.'
    n: '[U.S. Comm''n on Civil Rights, *School Desegregation in the Southern and Border States*, Mar. 1967](https://usccr.gov/files/historical/1967/67-009.pdf), Alabama; [May 1967](https://usccr.gov/files/historical/1967/67-006.pdf), Alabama. *Lee v. Macon County Board of Education*, [267 F. Supp. 458](https://static.case.law/f-supp/267/case-pdfs/0458-01.pdf) (M.D. Ala. 1967). [[w.carter-politics-of-rage-1995]]; [[w.bass-taming-the-storm]]. See [[cal.1967-01-16.alabama-al]]. Names: Lurleen Wallace.'
    tags: [state:al, name:wallace-lurleen-b]
