  - id: cal.1962-04-02.china-leadership-2
    when: Apr. 2–4
    date: '1962-04-02'
    thread: china-leadership
    c: 'Zhou Enlai at the Central Finance and Economic Group''s meeting with the Party-group heads of the finance ministries, Apr. 2–4, on the State Planning Commission group''s report on adjusting the 1962 economy. Serious imbalance in finance, credit and supplies, little grasped; the Commission is to find the facts. Three resolves: strive for fast and good, prepare for slow and less; adjust by a wide margin; act at once once the facts are clear. Added: tie streamlining to pulling down offices; losing factories to farm on the Nanniwan policy; close, merge or shrink enterprises; rank construction, no "sprinkling pepper"; tighten credit and exchange; cut culture, education and research. Apr. 7 and 8 he attends again.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 469 (Apr. 2–4, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 199 (early April: the Finance and Economics Small Group convenes State Council finance personnel). Made public: 1997. Check: MacFarquhar gives only early April. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
