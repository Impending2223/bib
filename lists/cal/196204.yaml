    when: Apr. 8
    date: '1962-04-08'
    thread: cuba
    c: 'Bay of Pigs prisoners sentenced: thirty years, or $62 million. Sixty wounded freed on credit, Apr. 14. Check the release date.'
    n: '[FRUS vol. 10, doc. 321](https://history.state.gov/historicaldocuments/frus1961-63v10/d321). [[w.schlesinger-robert-kennedy-and-his]], 470 (the sentence; the sixty to Miami "exactly one year after they had left Nicaragua"). To check: Alvaro Sanchez, Jr., "Policy Memorandum," May 2, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 470 n.7). See [[cal.1961-04-15.cuba]].'
