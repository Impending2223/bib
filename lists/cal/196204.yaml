  - id: cal.1962-04-12.china-leadership
    when: Apr. 12
    date: '1962-04-12'
    thread: china-leadership
    c: 'Mao on the Central Committee''s directive adopting the Finance and Trade Office''s report on 1961 finance and credit and the way to the policy "balance this year, some currency withdrawn": "Seen; return to the Premier; very good; issue." The directive: the difficulty is greater than the January conference reckoned; before measures the year''s budget stands at a 5 billion yuan deficit; to be wiped out by more output, thrift, cuts in administrative and defense expenditure, and higher prices on some goods.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 12, 1962. [[w.macfarquhar-origins-of-the-cultural]], III, 199 (Mao returns the revised report on the deficit on Apr. 12, calling it very good and allowing distribution); [[w.jianguo-yilai-mao-zedong]], XVI, 271–272 (Apr. 12, 1962; Mao''s note of Apr. 12, "send at once to the Premier": the draft directive with its annex and tables all read, "very good," may be issued at once; the annex and tables kept by him to read again; printed from the manuscript; note 2: the directive draft of Apr. 12 (the difficulties greater than reckoned at the enlarged conference; a deficit of 5 billion yuan before measures; output, thrift, cuts in enterprise, administrative and defense spending, some high-priced goods); the annex, the Finance and Trade Office''s report of Mar. 25 to Mao and the Center, in three parts, with three draft tables). Made public: 2013. Check: Zhou''s nianpu (II, 465) has Zhou transmit the Finance and Trade Office''s report on 1962 farm purchase prices for the Center and the State Council on Mar. 22; whether the same report. Check: the Wengao (XVI, 272 n.2) dates the Finance and Trade Office''s report on 1961 finance and credit Mar. 25, 1962; it names the office''s earlier report to the January conference (Jan. 7) and its report to the Standing Committee and Secretariat, Feb. 21–23. The report on purchase prices of Mar. 22 is another. To check: [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 61 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.54a); [[w.zedong-jianguo-yilai-mao-zedong]], 10, 76–77 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.54b); Central Committee, draft directive forwarding the State Council Finance and Trade Office''s report on 1961 finance and credit and the way to "balance this year, some currency withdrawn," Apr. 12, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 271 n.2a); State Council Finance and Trade Office, report to Mao Zedong and the Central Committee "On the carrying out of finance and credit in 1961 and how in 1962 to realize the Center''s policy ''balance this year, some currency withdrawn''," Mar. 25, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 272 n.2b); Table of adjusted 1962 state budget revenue and expenditure targets (draft), annex to the Finance and Trade Office''s report of Mar. 25, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 272 n.2c); Table of the 1962 credit revenue and expenditure plan (draft), annex to the Finance and Trade Office''s report of Mar. 25, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 272 n.2d); Table of the 1962 cash receipts and payments plan (draft), annex to the Finance and Trade Office''s report of Mar. 25, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 272 n.2e). Names: Mao Zedong, Zhou Enlai.'
