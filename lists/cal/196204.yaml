    when: Apr. 30
    date: '1962-04-30'
    thread: china-leadership
    c: 'Zhou Enlai at the first meeting of the Fourth Committee of the All-China Youth Federation, on streamlining and thrift: factories and schools must close, suspend or merge some, a test of hard times; the cut people must be placed; youth cannot all go on to school. May 1 he phones the presidium: all those cut are to be taken on by the state to the end, with housing, work and a living; anyone seeing otherwise may write to him.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 475 (Apr. 30, 1962). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
