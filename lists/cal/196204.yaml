    place: hanoi
    thread: vietnam-hanoi
    c: 'The Central Committee''s seventh plenum, enlarged, on industry, sitting since Mar. 26, ends. Its resolution: the tasks and course of building industry in the first five-year plan, socialist industrialization the central task of the transition. Hồ Chí Minh: heaven''s time, earth''s advantage and men''s accord, the three favorable conditions; "Có thực mới vực được đạo" (only the fed can follow the Way), so farming "cực kỳ quan trọng" (extremely important); industry and farming the economy''s two legs.'
    n: '*Báo cáo về nhiệm vụ và phương hướng xây dựng phát triển công nghiệp tại Hội nghị lần thứ bảy*; *Nghị quyết Hội nghị lần thứ bảy Ban Chấp hành Trung ương Đảng (khoá III) về nhiệm vụ và phương hướng xây dựng và phát triển công nghiệp*; *Bài nói của Chủ tịch Hồ Chí Minh tại Hội nghị lần thứ bảy*; *Thông cáo Hội nghị lần thứ bảy*. [[w.van-kien-dang-toan]], XXIII, 220–395 (the report on industry, 220–347; the resolution, 348–87; Hồ Chí Minh''s speech, Apr. 16, 388–92; the communiqué, 393–95, the plenum "họp từ ngày 26 tháng 3 đến ngày 16 tháng 4" (sat from Mar. 26 to Apr. 16) by the editors'' heading); [[w.lich-su-khang-chien-chong-my]], III, 72 (the seventh plenum, on industry). Made public: the communiqué at the time; the resolution, published by Aug. 7 (XXIII, 727); the report, 2002. Names: Hồ Chí Minh.'
