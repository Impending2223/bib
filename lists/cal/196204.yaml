    when: Apr. 3–4
    date: '1962-04-03'
    thread: latin-america
    c: Goulart in Washington; addresses Congress.
    n: 'Remarks of Welcome to President Goulart of Brazil at Andrews Air force Base, [1962 Pub. Papers 286](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=346) (Apr. 3, 1962). FRUS 1961–63, XII, docs. [223](https://history.state.gov/historicaldocuments/frus1961-63v12/d223), [224](https://history.state.gov/historicaldocuments/frus1961-63v12/d224). [108 Cong. Rec., House, Apr. 4, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt5/pdf/GPO-CRECB-1962-pt5-2-2.pdf). See [[cal.1961-08-25.latin-america]]. Names: Goulart.'
