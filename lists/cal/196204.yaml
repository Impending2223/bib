    n: '[[w.zhou-enlai-nianpu-1949]], II, 475 (Apr. 30, 1962); [[w.lengxi-shinian-lunzhan-1956-1966]], 494–495 (Wu, on Apr. and May 1962 in the Tacheng and Ili areas of Xinjiang: tens of thousands of people (later counted at about 50,000) gone to the Soviet side, which he ascribes to Soviet subversion; the Chinese government''s strong protest and its demand that the Soviet consulates at Yining and Urumqi stop work and be withdrawn); [[w.yang-shangkun-riji]], II, 155 (Apr. 30, 1962; 1 to 3:30 p.m., Xihuating, Zhou Enlai''s talk with Saifudin, who is to go back to Xinjiang in a day or two; Yang Shangkun attends; note 1: Saifudin); [[w.mao-zedong-zhuan]], V, ch. 70 n.5 (Apr. 30: Zhou Enlai talks with Saifudin on handling the border crossings and sends him in haste to Xinjiang). Made public: 1997. To check: the directive and the rules; Minutes of Zhou Enlai''s 周恩来 talk with Saifudin 赛福鼎, Apr. 30, 1962 (谈话纪要) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.5). See [[cal.1962-04-27.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong, Saifudin.'
