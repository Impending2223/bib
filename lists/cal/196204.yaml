  - id: cal.1962-04-16.china
    when: Apr. 16
    date: '1962-04-16'
    place: peking
    thread: china
    c: Zhou Enlai, at the third session of the Second National People's Congress, sets out China's foreign policy. China steadily follows a policy of peaceful diplomacy. It will unswervingly develop friendly cooperation with the Soviet Union and the other socialist brother countries; on the five principles it will strive for peaceful coexistence with states of different systems; it opposes imperialism's policies of aggression and war; it supports the revolutionary struggles of oppressed peoples and nations against imperialism and colonialism. It holds that international disputes should be settled by negotiation, firmly stands for banning nuclear weapons, and backs the struggle of all peace-loving states and peoples against imperialist arms expansion and for disarmament. China firmly opposes the American occupation of Taiwan and the making of "two Chinas."
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 223 (Apr. 16, 1962). See [[cal.1962-04-16.china-leadership]]. Names: Zhou Enlai.'
