  - id: cal.1962-04-12.steel
    when: Apr. 12
    date: '1962-04-12'
    thread: steel
    also: [robert-kennedy]
    c: 'Before dawn, FBI agents question at their homes in Philadelphia and Wilmington the reporters who had quoted Bethlehem''s president, Martin, against a price rise; the Attorney General had asked what Martin said, the hour was the Bureau''s. Robert Kennedy, in 1964: "nor did I even know who they were interviewing." Agents call on the steel executives and their records are subpoenaed for the grand jury.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 403–04. To check: [[w.guthman-we-band-of-brothers]] (233, cited by [[w.schlesinger-robert-kennedy-and-his]], 403 n.63); Robert Kennedy, interview by John Bartlow Martin, Apr. 13, 1964, I, 35, and III, 5, 7–8, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 404 n.64). See [[cal.1962-04-10.steel]]. Names: Robert Kennedy.'
    src:
      c: a03cca7a
      rows:
