    n: '[FRUS 1961–63, II, doc. 148](https://history.state.gov/historicaldocuments/frus1961-63v02/d148) (Forrestal''s memorandum). [[w.selverstone-kennedy-withdrawal]], 65–66 (the meeting; the de-escalation; the probe of Hanoi; "any favorable moment"). Made public: FRUS 1961–63, II (1990). [[w.preston-war-council]], 105 (Harriman "not in favor a neutral solution in Viet-Nam"). See [[cal.1962-04-04.vietnam]]. Names: Kennedy, Harriman, Galbraith, McNamara, Ngô Đình Diệm.'
    src:
      c: 41a7721a
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v02/d148: all'
