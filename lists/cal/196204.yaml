  - id: cal.1962-04-01.program
    when: Apr. 1
    date: '1962-04-01'
    place: glen-ora
    thread: program
    c: 'Glen Ora, Va., dinner with Kennedy, Schlesinger, his wife and Galbraith, by Schlesinger''s journal. On the Supreme Court: appointing White was one of the hardest decisions, a week''s hesitation; he chose him partly for his work for the nomination and election, Paul Freund having been for him too. He once asked Max Freedman to ask Frankfurter whether he would resign if they could agree on a successor; Frankfurter: "I guess he decided that he was indispensable to the Court." Nixon''s book shows him a "sick" man. With Galbraith on Laos: no intention of ever committing American troops there in force.'
    n: '[[w.schlesinger-journals]], 153–54. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Galbraith, White, Nixon, Frankfurter.'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:galbraith-john-kenneth, name:white-byron-r, name:nixon-richard-m, state:va, name:frankfurter-felix]
  - id: cal.1962-04-01.china-leadership
    when: Apr. 1
    date: '1962-04-01'
    thread: china-leadership
    c: 'Zhou Enlai, hearing Wu Zhipu, governor of Henan, say Henan''s farming needs ten years to regain the 1957 level: Henan''s errors are serious, its farm output is back to about 1949; if the provincial committee corrects its errors in earnest it will not take ten years. The Center is to allot Henan 390 million jin of grain by the end of June, 30 million first, and 20 million yuan in relief, 10 million first.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 468 (Apr. 1, 1962); [[w.dikotter-maos-great-famine]], 142 n.58 (Zhou Enlai: livestock in Henan in better state in 1940, in the war against Japan, than in 1961; the record of his conversation with Li Jingquan in the premier''s office, Apr. 1, 1962); [[w.peng-zhen-nianpu-1902]], IV, 184 (Apr. 1, 1962; the page''s note: Zhou tells Wu Zhipu, first secretary of the Henan committee, the Center will give 390 million jin of grain and 20 million yuan of relief before the end of June). Made public: 1997. Check: whether Zhou Enlai''s conversation with Li Jingquan in the premier''s office, Apr. 1, 1962 ([[w.dikotter-maos-great-famine]], 142 n.58), is this occasion. To check: Conversation between Li Jingquan and Zhou Enlai in the premier''s office, Apr. 1, 1962, Sichuan Provincial Archives, JC1-3198, p. 33 (cited by [[w.dikotter-maos-great-famine]], 142 n.58). Names: Zhou Enlai, Wu Zhipu.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
