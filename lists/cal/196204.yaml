    also: [china]
    c: Liu Shaoqi presides at the enlarged Politburo Standing Committee meeting, which hears the report on streamlining in the Northeast region and the Finance and Economics Small Group's report on the 1962 plan to adjust the national economy. The economy is out of balance on all sides and must be adjusted on all sides; the situation is underestimated now, not overestimated. There is no great situation in the economy; the "great situation" is political, in the Party's unity and the people's unity.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 553 (Apr. 23, 1962); [[w.yang-shangkun-riji]], II, 149–150 (Apr. 23, 1962; the Xilou, 3:30 to 7 p.m.; Ma Mingfang reports on the Northeast, Zhou Enlai on the Finance and Economics Group''s talks on the 1962 adjustment plan; by Yang''s notes, Zhou: the Northeast to strive to cut 2 billion yuan, the Northeast a picture of the whole country; Liu: the urban population must be cut, an orderly retreat); [[w.deng-xiaoping-nianpu-1904]], III, 1701–1702 (Apr. 23, 1962; afternoon; Deng at Liu''s meeting hearing Ma Mingfang (footnote 2: then third secretary of the Northeast Bureau) on streamlining in the Northeast and Zhou on the Finance and Economics Group''s talks on the 1962 readjustment plan); [[w.mao-zedong-zhuan]], V, ch. 69 n.42 (Apr. 23: Liu Shaoqi presides over the enlarged Standing Committee, where Zhou Enlai reports on the Finance Group''s discussion of the 1962 plan; Liu: the economy is out of balance on all sides and must be adjusted on all sides; to retreat in order). Made public: 1996. To check: Cheng Zihua 程子华, relay at the Party group of the State Planning Commission of Liu Shaoqi''s 刘少奇 remarks of Apr. 23, 1962 on the adjusted plan (传达记录), Apr. 25, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.42). Names: Liu Shaoqi.'
