    n: '[[w.perlstein-before-the-storm]], 182. To check: White to Rusher, Mar. 26, 1962 (the Minnesota meeting), William A. Rusher Papers, Library of Congress, box 154/4 (cited by [[w.perlstein-before-the-storm]], 182 n.1a); White to Tope, Mar. 27, 1962, and White to Barr, Apr. 6, 1962, F. Clifton White Papers, Cornell University, box 19 (cited by [[w.perlstein-before-the-storm]], 182 n.1b); [[w.white-suite-3505]]; [[w.rusher-rise-of-the-right]]. See [[cal.1961-10-08.goldwater]]. Names: White.'
