    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:kennedy-robert-f, name:stevenson-adlai-e]
  - id: cal.1962-04-06.opinion
    when: Apr. 6
    date: '1962-04-06'
    thread: opinion
    also: [elections-1962]
    c: 'Gallup, Mar. 15–20, on Edward Kennedy''s candidacy for the Senate: no figures printed. Opinion by party; Democrats and Independents mostly for, the whole on balance favorable.'
    n: '[[w.gallup-poll]], III, 1760. Names: Edward M. Kennedy.'
    tags: [name:kennedy-edward-m]
  - id: cal.1962-04-06.state-and-city-finance-detroit
    when: Apr. 6
    date: '1962-04-06'
    thread: state-and-city-finance
    c: Detroit. Cavanagh proposes a city income tax of 1 percent, on residents and on what nonresidents earn in the city; adopted by the Common Council. Swainson vetoes the legislature's bill against taxing commuters. In force July 1.
    n: '[Wikipedia, "1962 in Michigan"](https://en.wikipedia.org/wiki/1962_in_Michigan) (Check: the ordinance and the veto message). To check: [[w.fine-violence-in-the-model]]. Names: Cavanagh, Swainson.'
    tags: [state:mi, city:detroit, name:cavanagh-jerome-p, name:swainson-john-b]
