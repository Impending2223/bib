  - id: cal.1962-04-30.china-leadership
    when: Apr. 30
    date: '1962-04-30'
    thread: china-leadership
    c: 'The Central Committee issues its directive on the 1962 plan to adjust the economy, as Zhou Enlai revised it. It faults the main cadres of some places and departments for too little resolve, so the adjustment goes slowly. The key: restore farm output fast; the most urgent step, shorten the industrial and construction fronts, close, merge or shrink factories, cut staff and urban population hard.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 474 (Apr. 30, 1962). Made public: 1997. To check: the directive as issued. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
