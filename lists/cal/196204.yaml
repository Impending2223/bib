  - id: cal.1962-04-08.opinion
    when: Apr. 8
    date: '1962-04-08'
    thread: opinion
    also: [trade, european-community]
    c: 'Gallup, Mar. 8–13: more trade with other countries important, 65 percent. 46 have heard of the administration''s trade plan, 13 can describe it. Of those who had heard, lower tariffs 38, higher 15.'
    n: '[[w.gallup-poll]], III, 1761.'
  - id: cal.1962-04-09.european-community
    when: Apr. 9–12
    date: '1962-04-09'
    thread: european-community
    c: 'Hallstein in Washington; with Rusk and Ball, Apr. 9. Joint statement with Kennedy, Apr. 12: "an Atlantic Partnership founded on close cooperation between two equal partners"; the Common Market''s first stage completed; Kennedy on American farm exports; Hallstein for the President''s trade program.'
    n: 'Joint Statement following Discussions With the President of the European Economic Community, [1962 Pub. Papers 325](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=385) (Apr. 12, 1962). [FRUS 1961–63, XIII, doc. 33](https://history.state.gov/historicaldocuments/frus1961-63v13/d33). See [[cal.1961-05-16.european-community]]. Names: Hallstein, Rusk, Ball.'
    tags: [name:hallstein-walter, name:rusk-dean, name:ball-george-w, name:kennedy-john-f]
  - id: cal.1962-04-09.middle-east
    when: Apr. 9
    date: '1962-04-09'
    thread: middle-east
    c: 'Security Council, Resolution 171, on Israel''s raid of Mar. 16–17 on Syrian gun positions above Lake Tiberias: a flagrant violation of its resolution of 1956. Adopted 10–0, France abstaining (Check); the United States for. Kennedy, Apr. 10, to the State Department: why was he not kept informed?'
    n: '[S.C. Res. 171](https://undocs.org/S/RES/171(1962)) (Apr. 9, 1962). FRUS 1961–63, XVII, docs. [216](https://history.state.gov/historicaldocuments/frus1961-63v17/d216), [226](https://history.state.gov/historicaldocuments/frus1961-63v17/d226), [242](https://history.state.gov/historicaldocuments/frus1961-63v17/d242). To check: [[w.shlaim-iron-wall]]; [[w.bass-support-any-friend]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-04-09.king
    when: Apr. 9
    date: '1962-04-09'
    thread: king
    also: [civil-rights-the-executive]
    c: 'King, with Wyatt Walker, Shuttlesworth and others, sees Robert Kennedy and Burke Marshall: SCLC asks protection for Negro voting; they promise to act on specific complaints. In private Marshall warns King against Levison, whose telephone the FBI now taps. An appointment with Johnson the same day (Check).'
    n: '[[w.garrow-bearing-the-cross]], 195, 197. To check: Washington Post, Apr. 9, 1962, B1; Apr. 10, 1962, A13; SCLC press release, Apr. 25, 1962, King Center; SAC New York to Director, Mar. 30, 1962, FBI file 100-106670-33; Afro-American, Apr. 21, 1962, 8; Pittsburgh Courier, Apr. 21, 1962, II-7 (cited by [[w.garrow-bearing-the-cross]], 197 n.24). Check: the meeting with Johnson. Names: King, Shuttlesworth, Robert F. Kennedy, Marshall, Levison, Johnson.'
    src:
