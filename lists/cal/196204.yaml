  - id: cal.1962-04-24.china-leadership
    when: Apr. 24
    date: '1962-04-24'
    thread: china-leadership
    c: Evening. Mao presides at the Standing Committee, which hears Zhou Enlai on the main points of the Central Finance Group's report (drafted by Zhou and Li Xiannian) on discussing the 1962 plan for adjusting the economy.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 24, 1962 ("同日"). [[w.zhou-enlai-nianpu-1949]], II, 473 (Apr. 24, 1962: Zhou Enlai reports with Li Xiannian on the draft Finance Group report; Apr. 25 he revises it); [[w.deng-xiaoping-nianpu-1904]], III, 1702 (Apr. 24, 1962; evening; Deng at the Standing Committee on the Finance and Economics Group''s draft report on the 1962 readjustment plan). Made public: 1997. Names: Mao Zedong, Zhou Enlai, Li Xiannian.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:li-xiannian, vis:only:prc]
  - id: cal.1962-04-24.china-leadership-2
    when: Apr. 24
    date: '1962-04-24'
    thread: china-leadership
    also: [soviet-union]
    c: 'Zhou Enlai recommends to Mao Zedong the paper "An American Farmer''s View of Soviet Agriculture": between 1940 and 1955 the United States invested heavily in farming; the Soviet Union, restoring from war, began heavy farm investment only in 1955 and underrated the capital modern farming needs, the basic cause of its farm backwardness.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 473 (Apr. 24, 1962). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1962-04-24.china-leadership-3
    when: Apr. 24
    date: '1962-04-24'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai approves the *Renmin ribao* editorial board''s report to cut the paper from six pages to four and raise its circulation: the Ministry of Culture to review paper allocation, many local papers can be cut, strength to go to the *Renmin ribao*; if possible he still holds that two or three thousand tons of paper be found for it. Apr. 28 he approves the Ministry of Culture''s proposals on the *Renmin ribao* and *Guangming ribao* and on holding down local papers'' circulation, and draws the Propaganda Department''s notice to the matter.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 473 (Apr. 24, 1962); [[w.deng-xiaoping-nianpu-1904]], III, 1701 (Apr. 24, 1962; Zhou: agreeing with Comrade Xiaoping; the Ministry of Culture to study paper again; the *Renmin ribao* the national readers'' need, two or three thousand tons more if possible). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1962-04-24.china-leadership-4
    when: Apr. 24
    date: '1962-04-24'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi meets members of the Central Committee General Office''s materials investigation groups at Shijiazhuang and Wuxi. The economic situation is complex, the problems many: the economy out of balance, great stocks of goods piled up, capital turning over with difficulty. The cause lies chiefly above, in errors of plan and policy; they should tell the comrades in the plants so and admit the errors, speak by his report to the enlarged work conference, Chen Yun''s talk and the Center''s forwarded financial report; the Center and the municipality alike make their self-criticism, right and wrong distinguished, truth sought from facts. Materials work must grasp both ends, supply and sales, to serve the plants; plants are to produce to the demands of the materials and commercial departments, not blindly; work groups are to make a model of running a plant well.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 553–554 (Apr. 24, 1962). Made public: 1996. Names: Liu Shaoqi, Chen Yun.'
    tags: [polity:prc, name:liu-shaoqi, name:chen-yun, vis:only:prc]
  - id: cal.1962-04-24.china
    when: Apr. 24
    date: '1962-04-24'
    thread: china
    also: [soviet-union]
    c: Zhang Hanfu, Vice-Minister of Foreign Affairs, gives the Soviet ambassador, Chervonenko, an aide-memoire on the flight of people from the Xinjiang border. Some 20,000 people, with livestock and property, have crossed illegally into the Soviet Union; Soviet frontier authorities, against custom, neither stopped them nor told the Chinese side, and gave them reception and settlement. China expresses surprise and asks the Soviet side to take measures to restore the normal condition of the border.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 224 (Apr. 24, 1962). Made public: 2001. Names: Chervonenko. Check: when the aide-memoire was first published.'
    src:
      c: 31f720ab
      rows:
