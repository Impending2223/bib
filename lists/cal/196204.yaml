  - id: cal.1962-04-11.middle-east
    when: Apr. 11–13
    date: '1962-04-11'
    thread: middle-east
    c: 'The Shah and the Empress in Washington, on a state visit, Apr. 10–18. With Kennedy, Apr. 12; with McNamara the same day: the basic force level of Iran''s army 150,000 men, more on the northern border after a joint study, a planning team from the Joint Chiefs. Rusk''s aide-mémoire, Apr. 13. The joint statement: the Third Plan, aid continued, the bilateral agreement of 1959 reaffirmed.'
    n: 'Remarks of Welcome to the Shah and the Empress of Iran at the Washington National Airport, [1962 Pub. Papers 315](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=375); Toasts of the President and the Shah of Iran, [1962 Pub. Papers 323](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=383) (Apr. 11, 1962); Joint Statement following Discussions With the Shah of Iran, [1962 Pub. Papers 327](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=387) (Apr. 13, 1962). FRUS 1961–63, XVII, docs. [243](https://history.state.gov/historicaldocuments/frus1961-63v17/d243), [247](https://history.state.gov/historicaldocuments/frus1961-63v17/d247), [248](https://history.state.gov/historicaldocuments/frus1961-63v17/d248). [[w.poole-joint-chiefs-of-staff]], 246 (the visit; the force level; the planning team). To check: [[w.pahlavi-mission-for-my-country]]; [[w.rubin-paved-with-good-intentions]]; [[w.bill-eagle-and-the-lion]]; [[w.afkhami-life-and-times-of]]; [[w.milani-shah]]; [[w.offiler-us-foreign-policy-and]]. Names: Pahlavi, McNamara, Rusk, Kennedy.'
