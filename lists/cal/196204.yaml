  - id: cal.1962-04-04.vietnam
    when: Apr. 4
    date: '1962-04-04'
    thread: vietnam
    c: 'Galbraith from New Delhi: seek a neutral settlement, through Harriman. Kennedy sends it to McNamara; the Chiefs reject it.'
    n: '[[w.gibbons-u-s-government-and]], II, 119–120. [FRUS vol. 2](https://history.state.gov/historicaldocuments/frus1961-63v02). To check: [[w.galbraith-ambassadors-journal]]. See [[cal.1961-01-28.vietnam]]. Names: Galbraith, Harriman, McNamara.'
    tags: [name:galbraith-john-kenneth, name:harriman-w-averell, name:mcnamara-robert-s, name:kennedy-john-f]
  - id: cal.1962-04-04.conservation
    when: Apr. 4
    date: '1962-04-04'
    thread: conservation
    c: The Land Conservation Fund bill sent to Congress.
    n: 'Letter to the President of the Senate and the Speaker of the House Transmitting Bill To Create a Land Conservation Fund, [1962 Pub. Papers 291](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=351) (Apr. 4, 1962). See [[cal.1962-03-01.conservation]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1962-04-05.transportation
    when: Apr. 5
    date: '1962-04-05'
    thread: transportation
    also: [cities-and-housing]
    c: 'Special message on transportation. Minimum-rate regulation lifted from all carriage of bulk and farm commodities, as now for water carriers; inter-city passenger fares in time under maximum rates only. User charges: 2 cents a gallon on jet fuel and on fuel used on the inland waterways; 5 percent on airline tickets and waybills. Mass transit grants through the HHFA: $500 million over three years, $100 million in fiscal 1963.'
    n: 'Special Message to the Congress on Transportation, [1962 Pub. Papers 292](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=352) (Apr. 5, 1962). To check: [[w.friedlaender-dilemma-of-freight-transport]]; [[w.smerk-urban-transportation]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-04-05.cuba
    when: Apr. 5
    date: '1962-04-05'
    thread: cuba
    also: [robert-kennedy]
    c: 'The President calls Schlesinger at 7 p.m. to ask what the Food-for-Prisoners deal is: approved by the Special Group, Robert Kennedy behind it, the President not told; Stevenson had mentioned it to him that morning. Schlesinger calls Robert Kennedy, who is to bring his brother up to date. By Schlesinger''s journal.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 469–70. To check: Schlesinger, journal, Apr. 5, 1962 (cited by [[w.schlesinger-robert-kennedy-and-his]], 470 n.6). See [[cal.1961-04-15.cuba]]. Names: Kennedy, Schlesinger, Robert Kennedy, Stevenson.'
    src:
