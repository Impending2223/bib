  - id: cal.1962-04-15.middle-east-johnson-plan
    when: Apr. 15–17
    date: '1962-04-15'
    thread: middle-east-johnson-plan
    c: 'Jerusalem. Joseph Johnson''s second round in the Middle East, Apr. 14–May 12. With Meir, Apr. 15 and 17: a poll of the refugees'' preferences; on what terms Israel would repatriate a share of perhaps 20,000 to begin. Meir: first a public assurance that the Arab governments will live in peace; as evidence, six months without propaganda against Israel.'
    n: 'FRUS 1961–63, XVII, doc. [253](https://history.state.gov/historicaldocuments/frus1961-63v17/d253). [A/5337](https://documents.un.org/doc/UNDOC/GEN/NL6/212/01/PDF/NL621201.PDF#page=4), para. 12. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Meir.'
    tags: [name:johnson-joseph-e, name:meir-golda]
  - id: cal.1962-04-16.desegregation-schools-la
    when: Apr. 16
    date: '1962-04-16'
    thread: desegregation-schools
    c: Archbishop Rummel of New Orleans excommunicates Leander Perez, the Plaquemines Parish leader, and two others who organized against his order desegregating the archdiocese's schools for 1962–63.
    n: '[Wikipedia](https://en.wikipedia.org/wiki/Joseph_Rummel). To check: [[w.jeansonne-leander-perez]]; [[w.fairclough-race-and-democracy]]. Names: Rummel, Perez.'
    tags: [name:rummel-joseph-f, name:perez-leander-h, state:la, city:new-orleans]
  - id: cal.1962-04-16.crime-and-hijacking-maheu
    when: Apr. 16
    date: '1962-04-16'
    thread: crime-and-hijacking-maheu
    also: [cuba]
    c: 'Houston, the CIA''s General Counsel: Miller sees "no major difficulty in stopping action for prosecution."'
    n: '[S. Rep. No. 94-465, 130–31 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=141). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1962-03-28.crime-and-hijacking]]. Names: Houston, Miller.'
    tags: [name:houston-lawrence, name:miller-herbert-j-jr]
  - id: cal.1962-04-17.european-community
    when: Apr. 17
    date: '1962-04-17'
    thread: european-community
    c: 'Paris. The Six''s foreign ministers fail to agree on a treaty of political union, the Fouchet plan: Belgium and the Netherlands will not go on without Britain. The French draft of Oct. 19, 1961, loose "confederal" ties in politics and defense; a second, Jan. 18. Apr. 27, State to its missions: the United States takes no side.'
