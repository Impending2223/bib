  - id: cal.1966-09-30.china-leadership
    when: Sept. 30–Oct. 1
    date: '1966-09-30'
    thread: china-red-guards
    also: [china-mao-cr]
    c: 'Mao reads Chen Boda''s and Zhang Chunqiao''s draft of Lin Biao''s National Day speech, which says "bourgeois counter-revolutionary line";{1} Tao Zhu and others think it too heavy and propose "bourgeois anti-revolutionary line."{2} Mao agrees. On Oct. 1 evening Zhang says the phrase in Lin''s speech is ungrammatical and proposes the first wording back. Mao: leave it; "from now say: thoroughly criticize the bourgeois reactionary line."{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, end of Sept. 1966 (the entry "9月底") and Oct. 1, 1966. [[w.macfarquhar-maos-last-revolution]], 135 (Lin Biao''s National Day speech has "bourgeoisie opposing revolution-line"; Zhang Chunqiao tells Mao that evening it is grammatically flawed; at the very last moment Mao decides on "bourgeois reactionary line"); [[w.mao-zedong-zhuan]], VI, ch. 75 n.14 (Wang Li''s account, interview of 1983: Chen Boda and Zhang Chunqiao drafted Lin Biao''s speech with ''bourgeois counterrevolutionary line'', Mao already agreeing to the text; Tao Zhu said ''counterrevolutionary'' was too heavy, and it was changed to ''bourgeois anti-revolutionary line'', which Mao agreed and Lin spoke on Tiananmen; that evening in the Beijing Hall, as they gathered to drive to the fireworks, Zhang Chunqiao told Mao the phrase made no sense grammatically and proposed changing it back; Mao: do not change it back, say from now on ''thoroughly criticize the bourgeois reactionary line''; the *Hongqi* editorial was changed to Mao''s wording; Zhou Enlai was not at his side and did not know, n.14). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75). Check: the book (135) has Lin''s phrase in the speech as "bourgeoisie opposing revolution-line"; the entry has "bourgeois counter-revolutionary line" for the draft. To check: [[w.sanzhong-quanhui-yilai-zhongyao]], I, 502 (cited by [[w.macfarquhar-maos-last-revolution]], 135 n.7); Interview 访问 with Wang Li 王力, July 29, 1983 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.14). Names: Mao Zedong, Chen Boda, Zhang Chunqiao, Lin Biao, Tao Zhu. Check: the nianpu gives only "end of September" for the draft; the speech''s printed phrase, Check *Renmin ribao*, Oct. 2.'
    src:
      c: 8d3693f6
      rows:
        - 'w.macfarquhar-maos-last-revolution 135: ?'
        - 'w.mao-zedong-zhuan VI, ch. 75 n.14: 1, 3'
        - 'via w.mao-zedong-zhuan VI, ch.75 n.14: 1, 3'
    tags: [name:mao-zedong, name:chen-boda, name:zhang-chunqiao, name:lin-biao, name:tao-zhu, polity:prc, vis:only:prc]
  - id: cal.1966-09.china-leadership
    when: Sept., early
    date: 1966-09
