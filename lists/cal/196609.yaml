    c: 'Zhou Enlai reviews the Center''s Notice on Grasping Revolution and Promoting Production: industry, farming, transport and commerce to form command organs; production and research staff to keep their posts; students and Red Guards not to enter factories; no dismissal of leaders by the masses. He sends it and the rural provisions to Mao: after the Jiangsu and Shangrao telegrams, both need a Politburo discussion before they go out.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 59–60 (Sept. 8, 1966, the item after); [[w.mao-zedong-zhuan]], VI, ch. 75 n.23 (Sept. 8 Zhou Enlai presides over the drafting of the two documents, on grasping revolution and promoting production and on the cultural revolution in the villages below the county, and proposes to Mao a Politburo discussion to settle policy, n.23). Made public: 2020. To check: Mao Zedong 毛泽东, comment on Zhou Enlai''s 周恩来 letter asking instructions on the two documents on grasping revolution and the villages below the county (manuscript 手稿), Sept. 14, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.23). Names: Zhou Enlai, Mao Zedong.'
    tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
