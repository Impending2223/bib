    c: East Berlin. Mielke and Trần Quốc Hoàn, with senior staff of both ministries, settle the results of the DRV delegation's visit. Hoàn asks that one more officer be trained in indexing, for the Stasi's procedures on concealment, a few infrared binoculars to watch night landings, a gamma-ray encryption device (he says the Soviets told the DRV that the Americans broke its code), and earlier delivery of VHF sets due in early 1968. Mielke says the binoculars are under test, the gamma-ray devices are Polish-made and the Poles will be asked, an American M 209 machine, about $3,000, will be got, two officers can be trained in punch-card indexing, and what the GDR lacks it will buy in capitalist countries.
    n: '"[Note on a Meeting between Senior Staff of the Ministry for State Security of the DRV and the Ministry for State Security of the GDR](https://digitalarchive.umd.edu/document/120721)" (Oct. 5, 1966), BStU, MfS Abt X 652, 144–152, trans. Sean O''Grady, Wilson Center Digital Archive. Obtained for CWIHP by Martin Grossheim. Berlin, Oct. 5, 1966, two copies; the note gives the meeting as "29.09.1966 from 15.30 until 17.00", and names, for the DRV, Pham-van-man and Nguy-quang-Tin, and, for the GDR, Beater, Scholz and Damm. Hoàn thanks Mielke for a friendship rally of MfS staff held for him, "today" by his words, a few hundred there by Mielke''s. See [[cal.1966-02-01.vietnam-hanoi-2]]. Check: the year the Archive posted the document; its page gives none. Names: Trần Quốc Hoàn.'
