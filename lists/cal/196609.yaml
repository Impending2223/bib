    also: [china-mao-cr]
    c: 'Mao, morning, reads Tao Zhu''s draft of Lin Biao''s speech for that afternoon: "very good; I changed a little." His changes: a small handful of reactionary bourgeois elements and unreformed landlords, rich peasants, counter-revolutionaries, bad elements and rightists, against the proletariat''s dictatorship and plotting to shell its headquarters. On whether Lin alone should speak or Zhou also (Zhou preferred Lin alone; Tao, both): "both may speak"; Zhou''s draft, "agreed."{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 362–365 (Sept. 15, 1966; Mao''s notes on the two drafts Tao sent at 2 a.m. Sept. 15, "both may speak" at 10:30 a.m.; his change to Lin''s text printed from *Renmin ribao*, Sept. 16 (revised copy held); note 1: Zhou''s note to Tao of Sept. 14 (Lin alone should speak) and Tao''s to Mao (both)). Made public: 2013. To check: Lin Biao, draft of his speech to the Red Guard rally of Sept. 15, 1966, sent to Mao by Tao Zhu at two o''clock that morning (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 363 n.1); Zhou Enlai, draft of his speech to the Red Guard rally of Sept. 15, 1966, with his note to Tao Zhu of Sept. 14 (Lin alone to speak) and Tao Zhu''s note (both to speak), sent to Mao by Tao Zhu at two o''clock Sept. 15 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 364 n.1). Names: Mao Zedong, Tao Zhu, Lin Biao, Zhou Enlai.'
