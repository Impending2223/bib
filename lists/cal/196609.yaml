    also: [china-mao-cr, china-army]
    c: 'Peking. The Sichuan Hall 四川廳 of the Great Hall of the People. Lin Biao 林彪 speaks to the enlarged Standing Committee of the Military Commission on He Long 賀龍, at Mao''s direction, He Long himself absent: his errors in purging the Hunan–Hubei base area; since the cultural revolution began, restlessness, many visitors, a "political club," and a pistol worn when he went to see Mao. Lin withdraws unwell; Ye Jianying 葉劍英 takes the chair, and the members criticize He; Chen Yi 陳毅 and Nie Rongzhen 聶榮臻 speak sharply, Liu Bocheng 劉伯承, who rarely speaks, too. Ye ends by forbidding any word outside. Zhou Enlai 周恩來 had held a like small meeting and told Mao it went well.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 164–165; [[w.yang-jisheng-tiandi-fanfu]], I, 424 (by Qiu Huizuo''s memoir, at the Military Commission''s enlarged meeting, speaking of He Long, Lin Biao names Li Jukui 李聚奎 and Rao Zhengxi 饒正錫 as Peng''s and Huang''s men who slipped the net); [[w.teiwes-tragedy-of-lin-biao]], 32, 35 (with Mao''s authority Lin tells the Military Commission''s Standing Committee that by some evidence He Long has been grabbing power in the army and has "problems"; then or later Jiang Qing calls He "a bad man" and "a big butcher"). Made public: 2011. To check: Cheng Guang 程光, *Xinling de duihua* 《心靈的對話》 (Beixing chubanshe 北星出版社, Hong Kong, 2011), 70–71 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.17a); *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 524 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.17b); *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 884 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.17c); *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xin shiji chubanshe 新世紀出版社, Hong Kong, 2011), 524 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 424 n.18b); [[w.yunsheng-maojiawan-jishi]], 33–39 (cited by [[w.teiwes-tragedy-of-lin-biao]], 36 n.70a); [[w.nianyi-da-dongluande-niandai]], 383 (cited by [[w.teiwes-tragedy-of-lin-biao]], 36 n.70b). Names: Lin Biao, He Long, Ye Jianying, Chen Yi, Nie Rongzhen, Liu Bocheng, Zhou Enlai, Mao Zedong. Check: the speech''s text, which Yang (I, 165 n.17) thinks Cheng Guang may have added.'
