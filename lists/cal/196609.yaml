entries:
  - id: cal.1966-09-01.vietnam
    when: Sept. 1
    date: '1966-09-01'
    thread: vietnam
    also: [europe-and-the-alliance]
    c: 'De Gaulle at Phnom Penh, Sihanouk his host. Cambodia, he says, kept its body and its soul by remaining its own master, while "the political and military authority of the United States was seen installed in its turn in South Vietnam" and the war "gained new strength there in the form of national resistance." Lodge, from Saigon: the words mean "that the United States in effect committed an aggression in South Vietnam." Bohlen, from Paris: de Gaulle "ignoring facts in favor of his favorite position."'
    n: 'FRUS 1964–68, XII, doc. [66](https://history.state.gov/historicaldocuments/frus1964-68v12/d66). [[w.current-documents-1966]], 646–648, the speech. [[w.cosmas-joint-chiefs-of-staff-2012]], 531 (the speech; Sihanouk). To check: [[w.journoud-de-gaulle-et-le]]; [[w.jackson-de-gaulle]]; [[w.clymer-troubled-relations]]. Names: de Gaulle, Norodom Sihanouk, Lodge, Bohlen.'
    src:
      c: 43c10fa8
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d66: all'
        - 'w.current-documents-1966 646–648, the speech: all'
        - 'w.cosmas-joint-chiefs-of-staff-2012 531: A'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 531 n.9: A'
    tags: [name:de-gaulle-charles, name:norodom-sihanouk, name:lodge-henry-cabot, name:bohlen-charles-e, place:phnom-penh]
  - id: cal.1966-09-01.states-and-cities-dayton
    when: Sept. 1
    date: '1966-09-01'
    thread: states-and-cities
    c: Dayton. Lester Mitchell, a Negro, shot dead from a passing car while sweeping the walk before his bar on West Fifth Street, early morning. Rioting in west Dayton through the day; Mayor Dave Hall asks Rhodes for the National Guard, in the city by 3 p.m. One dead, about 30 hurt, over 100 arrested.
    n: '[Wikipedia, "1966 Dayton race riot"](https://en.wikipedia.org/wiki/1966_Dayton_race_riot), from the *Dayton Daily News* (Check). See [[cal.1966-07-18.states-and-cities]]. Names: Mitchell, Hall, Rhodes.'
    tags: [state:oh, city:dayton, name:mitchell-lester, name:hall-dave, name:rhodes-james-a]
  - id: cal.1966-09-01.europe-and-the-alliance
    when: Sept. 1
    date: '1966-09-01'
    thread: europe-and-the-alliance
    c: 'Johnson to Russell Long, by telephone, 10:07 a.m., on Mansfield''s resolution: "This thing y''all did yesterday really murdered us on NATO." Two weeks of "a war with the British" to hold their cuts until they could be matched with American ones.'
    n: '[FRUS 1964–68, XV, doc. 165](https://history.state.gov/historicaldocuments/frus1964-68v15/d165). Made public: FRUS 1964–68, XV (1999). [[w.schwartz-lyndon-johnson-and-europe]], 122–23. See [[cal.1966-08-31.europe-and-the-alliance]]. Names: Russell Long, Mansfield, Johnson.'
    tags: [name:johnson-lyndon-b, name:long-russell-b, name:mansfield-mike]
  - id: cal.1966-09-02.alabama-al
    when: Sept. 2
    date: '1966-09-02'
    thread: alabama
    also: [desegregation-schools]
    c: At Wallace's call, the legislature, in special session, declares void every agreement of a local school board with HEW under the desegregation guidelines and forbids new ones. Wallace approves it, Act No. 252 (H. 446), at 1:05 p.m.
    n: '[*Acts of Alabama*, Special Session, 1966, 372–377](https://archive.org/details/alabama-acts-1966/page/n370): "Approved September 2, 1966. Time: 1:05 P.M.," [377](https://archive.org/details/alabama-acts-1966/page/n375). Cited in [*Wallace v. Lee*, Motion to Affirm](https://ldfrecollection.org/archives/archives-search/archives-item/8f325deb-eb93-40a1-bf4f-3e634cbbfcdd/wallace-v-lee-motion-to-affirm) (NAACP Legal Defense Fund). To check: [[w.carter-politics-of-rage-1995]]. See [[cal.1964-07-13.alabama]]. Names: Wallace.'
    tags: [state:al, name:wallace-george-c]
  - id: cal.1966-09-04.open-housing
    when: Sept. 4
    date: '1966-09-04'
    thread: open-housing
    also: [civil-rights-organizations]
    c: Cicero. Robert Lucas of Chicago CORE leads some 250 marchers (Check) into the town, the march King gave up under the summit agreement; SCLC against it. Kerner has called out the National Guard. White crowds throw rocks and bottles; the Guard and the police keep them off; the marchers walk back to Chicago.
    n: 'See [[cal.1966-07-10.open-housing]]. Names: King, Kerner, Lucas.'
    tags: [name:king-martin-luther-jr, name:kerner-otto, name:lucas-robert]
  - id: cal.1966-09-04.opinion
    when: Sept. 4
    date: '1966-09-04'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, special survey of persons drawn from *Who''s Who in America*, 1966: what they would do about Vietnam if President: step up the fighting 27 percent; continue as at present 21; slow down the fighting 35.'
    n: '[[w.gallup-poll]], III, 2025–26.'
  - id: cal.1966-09-05.jobs-and-wages-farm-workers
    when: Sept. 5
    date: '1966-09-05'
    thread: jobs-and-wages-farm-workers
    also: [states-and-cities]
    c: Labor Day. The Texas farm workers' march ends with a rally at the Capitol in Austin.
    n: Richard Bailey, ["Starr County Strike,"](https://www.tshaonline.org/handbook/entries/starr-county-strike) *Handbook of Texas Online*. See [[cal.1966-07-04.jobs-and-wages-tx]].
    tags: [state:tx]
  - id: cal.1966-09-06.georgia
    when: Sept. 6–8
    date: '1966-09-06'
    thread: georgia
    also: [civil-rights-organizations]
    c: Atlanta, Summerhill. A white policeman shoots Harold Prather, a Negro suspect running from arrest; a crowd gathers, SNCC workers among it. Allen, speaking from the top of a police car, is toppled off it; police disperse the crowd with tear gas. Allen blames SNCC. Sept. 8, Carmichael arrested, charged with inciting to riot. Check the details.
    n: 'Carmichael, [Statement](https://www.crmvet.org/docs/660908_sncc_stokely.pdf) (Sept. 8, 1966). *Time*, Sept. 16, 1966, "Atlanta: Stokely''s Spark." [[w.allen-mayor]]. To check: [[w.carson-in-struggle]]; [[w.joseph-stokely]]; [[w.kruse-white-flight]]. Names: Allen, Carmichael, Prather.'
    tags: [name:allen-ivan-jr, name:carmichael-stokely, name:prather-harold]
  - id: cal.1966-09-06.governors-nv
    when: Sept. 6
    date: '1966-09-06'
    thread: governors
    also: [elections-1966]
    c: 'Nevada''s primary. Democratic, for governor: Sawyer, seeking a third term, over Marshall, 40,982 to 13,858, 58.6 percent; Springer 13,270, 19.0 percent. Republican: Lieutenant Governor Laxalt over Screen, 32,768 to 1,834, 94.7 percent.'
    n: 'Votes: [Nev. *Political History of Nevada* (12th ed., 2016), 509](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=515). To check: [[w.laxalt-nevadas-paul-laxalt]]; [[w.sawyer-hang-tough-grant-sawyer]]. Names: Laxalt, Sawyer, Marshall, Springer.'
    tags: [state:nv, name:sawyer-grant, name:marshall-edward-g, name:springer-charles-e, name:laxalt-paul]
  - id: cal.1966-09-06.governors-ia
    when: Sept. 6
    date: '1966-09-06'
    thread: governors
    also: [elections-1966]
    c: 'Iowa, governor. Republican primary: Murray, an Iowa State economist, over Beck, a former State Representative, 87,371 to 85,733, 50.5 percent, a 1,638-vote margin. Governor Hughes unopposed.'
    n: 'Votes: [Wikipedia, "1966 Iowa gubernatorial election"](https://en.wikipedia.org/wiki/1966_Iowa_gubernatorial_election), from the [*Summary of Official Canvass of the Votes Cast in Iowa Primary Election, September 6, 1966*](https://sos.iowa.gov/elections/pdf/results/60s/1966primcanv.pdf) (Check: the scan''s totals). To check: [[w.larew-party-reborn]]. Names: Hughes, Murray, Beck.'
    tags: [state:ia, name:murray-william-g, name:beck-robert-k, name:hughes-harold-e]
  - id: cal.1966-09-07.opinion
    when: Sept. 7
    date: '1966-09-07'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: Communist China to send many troops if the North Vietnamese show signs of giving in: will 38 percent, will not 35.'
    n: '[[w.gallup-poll]], III, 2026.'
  - id: cal.1966-09-07.governors-ny
    when: Sept. 7–8
    date: '1966-09-07'
    thread: governors
    also: [elections-1966]
    c: 'New York''s conventions. Democrats at Buffalo, Sept. 7: O''Connor, president of the City Council, nominated for governor on the first ballot over Samuels; Sept. 8, the delegates name Samuels for lieutenant governor against the leaders'' choice. Conservatives at Saratoga Springs, N.Y.: Adams, a professor, an enrolled Republican. Sept. 8, Republicans at Rochester renominate Rockefeller; the Liberals nominate Franklin D. Roosevelt Jr., 209 votes of 321 delegates present.'
    n: '[*New York Times*, Sept. 8, 1966](https://www.nytimes.com/1966/09/08/archives/2d-spot-at-issue-fourway-contest-for-lieutenant-governor-faces.html); [Sept. 8](https://www.nytimes.com/1966/09/08/archives/professor-named-by-conservatives-adams-to-run-for-governor-vietnam.html); [Sept. 9](https://www.nytimes.com/1966/09/09/archives/rockefeller-renominated-pledges-fight-on-bosses-republicans-pick.html); [Sept. 9](https://www.nytimes.com/1966/09/09/archives/rooseveltnamed-by-liberal-party-candidate-seeks-unity-after-getting.html). To check: [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.connery-rockefeller-of-new-york]]; [[w.mahoney-actions-speak-louder]]. See [[cal.1962-11-06.governors-ny]]. Names: O''Connor, Paul Adams, Samuels, Rockefeller, Roosevelt.'
    tags: [state:ny, name:oconnor-frank-d, name:samuels-howard-j, name:adams-paul-l, name:rockefeller-nelson, name:roosevelt-franklin-d-jr]
  - id: cal.1966-09-08.economy
    when: Sept. 8
    date: '1966-09-08'
    thread: economy-investment-credit
    c: Special message on fiscal policy; a news conference the same day. The 7 percent investment tax credit to be suspended for orders placed from Sept. 1 to Jan. 1, 1968; accelerated depreciation on buildings begun in that time suspended too. About $3 billion, a tenth of the part of the fiscal 1967 budget under his control, to be cut. The Federal Reserve and the large banks asked to help bring interest rates down. Further steps wait on the eight appropriation bills still in Congress and the Vietnam supplemental.
    n: 'Special Message to the Congress on Fiscal Policy, [1966 Pub. Papers 985](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=359) (Sept. 8, 1966); The President''s News Conference, [1966 Pub. Papers 991](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=365) (Sept. 8, 1966). [[w.gibbons-u-s-government-and]], IV, 425–26. To check: [[w.okun-political-economy-of-prosperity]]; [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]; [[w.collins-more]]. See [[cal.1965-12-05.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-09.transportation
    when: Sept. 9
    date: '1966-09-09'
    thread: transportation-auto-safety
    c: 'National Traffic and Motor Vehicle Safety Act, [80 Stat. 718](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg718.pdf), and Highway Safety Act, [80 Stat. 731](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg731.pdf), signed. Federal safety standards for new cars and tires, domestic and imported, from the 1968 models, set first by the Secretary of Commerce; makers to notify buyers of defects; federal research and test centers. Grants to the States for highway safety programs on federal standards. Johnson: over Labor Day weekend 614 dead on the highways, 29 servicemen dead in Vietnam.'
    n: 'Remarks at the Signing of the National Traffic and Motor Vehicle Safety Act and the Highway Safety Act, [1966 Pub. Papers 1002](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=376) (Sept. 9, 1966). To check: [[w.mashaw-struggle-for-auto-safety]]; [[w.nader-unsafe-at-any-speed]]; [[w.eastman-styling-vs-safety]]. See [[cal.1966-03-02.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-09.opinion
    when: Sept. 9
    date: '1966-09-09'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: the United States to begin letting South Vietnam take on more of the fighting: yes 62 percent, no 22. Republicans 60, Democrats 66, independents 57.'
    n: '[[w.gallup-poll]], III, 2026.'
  - id: cal.1966-09-11.vietnam
    when: Sept. 11
    date: '1966-09-11'
    thread: vietnam
    c: 'South Vietnam elects a Constituent Assembly: 117 seats, 532 candidates. Some four-fifths of the 5,288,512 registered vote, by Lodge''s count; the Viet Cong''s attacks that day and the evening before, 19 government dead and 120 wounded. The Assembly to have a constitution ready by March 1967. Lodge to Johnson, Sept. 14: "an immense vote of no confidence in the Viet Cong."'
    n: 'FRUS 1964–68, IV, doc. [229](https://history.state.gov/historicaldocuments/frus1964-68v04/d229). Seats and candidates: [[w.elections-in-asia-and]], II, 334 (Check). [[w.gibbons-u-s-government-and]], IV, 410–13. To check: [[w.carter-inventing-vietnam]]; [[w.karnow-vietnam]]. See [[cal.1966-03-10.vietnam]]. Names: Lodge, Johnson.'
    tags: [name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1966-09-11.opinion
    when: Sept. 11
    date: '1966-09-11'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: the most important problem: Vietnam 56 percent; racial problems 24; inflation 16. The party better able to handle it: Democratic 28, Republican 21, no difference 35.'
    n: '[[w.gallup-poll]], III, 2026.'
  - id: cal.1966-09-12.mississippi
    when: Sept. 12–17
    date: '1966-09-12'
    thread: mississippi
    also: [desegregation-schools]
    c: Grenada. About 250 Negro children, of 450 enrolled under a federal court order in the white schools, go to class; the rest withdrawn under threats to their parents' jobs and homes. A white crowd meets them, chases them through the streets, beats children and reporters with chains, pipes and clubs, through the first week, the local police not stepping in. Federal protection from Sept. 17; 13 of the crowd arrested. Check the figures.
    n: '[[w.dittmer-local-people]], 403–06; [[w.garrow-bearing-the-cross]], 530–31 (the mob, the children; the highway patrolmen). To check: [[w.branch-at-canaans-edge]]. See [[cal.1966-06-06.mississippi]]. Check: Dittmer, 404–06, gives nearly 300 applicants, about 150 entering Sept. 12 and some forty turned away, more than thirty children beaten, Clayton''s injunction that Friday, and thirteen men charged by the FBI, Sept. 17. Check: Garrow, 531, gives 160 Negro children in the white schools.'
  - id: cal.1966-09-13.elections-1966
    when: Sept. 13
    date: '1966-09-13'
    thread: elections-1966
    also: [states-and-cities, governors]
    c: 'Primaries. Maryland: Mahoney, a Baltimore paving contractor, on "Your home is your castle—protect it," wins the Democratic nomination for governor over Sickles, 148,446 to 146,607, 30.2 percent, a 1,839-vote margin; Finan 134,216, 27.3 percent; Agnew the Republican. Massachusetts: Brooke, the attorney general, unopposed for the Republican nomination for the Senate; Peabody over Collins for the Democratic, 320,967 to 265,016, 50.4 percent; Thomas Boylston Adams, against the war, 51,435, 8.1 percent.'
    n: 'Maryland Manual, 1969–70, [p. 626](http://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000174/html/am174--525.html). [Mass. *Election Statistics*, 1966 (P.D. 43)](https://archive.org/details/electionstatisti19651966mass); check the page. The totals: [Wikipedia, "1966 Maryland gubernatorial election"](https://en.wikipedia.org/wiki/1966_Maryland_gubernatorial_election); [Wikipedia, "1966 United States Senate election in Massachusetts"](https://en.wikipedia.org/wiki/1966_United_States_Senate_election_in_Massachusetts). To check: [[w.coffey-spiro-agnew-and-the]]; [[w.witcover-very-strange-bedfellows]]; [[w.brooke-bridging-the-divide]]; [[w.rigueur-loneliness-of-the-black]]. Names: Agnew, Brooke, Peabody, Sickles, John Collins, Mahoney, Finan, Thomas Boylston Adams.'
    tags: [name:agnew-spiro-t, name:brooke-edward-w, name:peabody-endicott, name:collins-john-f, name:sickles-carlton-r, name:mahoney-george-p, state:md, state:ma, name:finan-thomas-b, name:adams-thomas-boylston]
  - id: cal.1966-09-13.states-and-cities-nyc
    when: Sept. 13
    date: '1966-09-13'
    thread: states-and-cities
    c: New York. Percy Sutton, Assemblyman from Harlem, chosen Manhattan's borough president in Motley's place, she having gone to the federal bench, Aug. 30.
    n: '[Wikipedia, "Percy Sutton"](https://en.wikipedia.org/wiki/Percy_Sutton). See [[cal.1965-02-23.states-and-cities-nyc]]. Names: Sutton, Motley.'
    tags: [state:ny, city:nyc, name:sutton-percy-e, name:motley-constance-baker]
  - id: cal.1966-09-13.governors-az
    when: Sept. 13
    date: '1966-09-13'
    thread: governors
    also: [elections-1966]
    c: 'Arizona''s primary, for governor. Democratic: Governor Goddard over Green, 63,180 to 53,921, 44.9 percent; Gilbert 23,637, 16.8 percent. Republican: Jack Williams, once mayor of Phoenix, over Haugh, 37,409 to 25,905, 44.3 percent; Pickrell 21,192, 25.1 percent.'
    n: 'Votes: [Wikipedia, "1966 Arizona gubernatorial election"](https://en.wikipedia.org/wiki/1966_Arizona_gubernatorial_election); Check: [Ariz. *Official Canvass, Primary Election, September 13, 1966*](https://azmemory.azlibrary.gov/nodes/view/102662). To check: [[w.shermer-sunbelt-capitalism]]; [[w.peirce-mountain-states-of-america]]. Names: Goddard, Williams, Green, Haugh, Pickrell.'
    tags: [state:az, city:phoenix, name:goddard-samuel-p-jr, name:green-norman, name:williams-jack, name:haugh-john, name:pickrell-robert]
  - id: cal.1966-09-13.state-constitutions-md
    when: Sept. 13
    date: '1966-09-13'
    thread: state-constitutions
    c: Maryland. With the primaries, the voters call a constitutional convention for 1967, 160,280 to 31,680, 83.5 percent.
    n: '*Maryland Manual*, 1967–68, [p. 539](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--539.html), [288](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--288.html) (ch. 501, Acts of 1966). To check: [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-09-13.elections-1966]].'
    tags: [state:md]
  - id: cal.1966-09-13.governors-wi
    when: Sept. 13
    date: '1966-09-13'
    thread: governors
    also: [elections-1966]
    c: 'Wisconsin, governor. Democratic primary: Lucey over Carley, 128,359 to 95,803, 45.2 percent; Frinzi 44,344, 15.6 percent; one other 15,362, 5.4 percent. Governor Knowles unopposed.'
    n: 'Votes: [Wikipedia, "1966 Wisconsin gubernatorial election"](https://en.wikipedia.org/wiki/1966_Wisconsin_gubernatorial_election), from the *Wisconsin Blue Book 1967* (Check). To check: [[w.peirce-great-lakes-states-of]]. Names: Knowles, Lucey, Carley, Frinzi.'
    tags: [state:wi, name:lucey-patrick, name:carley-david, name:frinzi-dominic-h, name:knowles-warren-p]
  - id: cal.1966-09-13.governors-mn
    when: Sept. 13
    date: '1966-09-13'
    thread: governors
    also: [elections-1966]
    c: 'Minnesota, governor. DFL primary: Governor Rolvaag over Keith, 336,656 to 157,661, 66.3 percent; four others 13,689, 2.7 percent. Republican: LeVander over one other, 276,403 to 5,827, 97.9 percent.'
    n: '[*Report of the State Canvassing Board, Primary Election, September 13, 1966*](https://www.lrl.mn.gov/docs/2023/Other/232069/1966.pdf). Votes: [Wikipedia, "1966 Minnesota gubernatorial election"](https://en.wikipedia.org/wiki/1966_Minnesota_gubernatorial_election), from the Report. See [[cal.1966-06-19.governors-mn]]. Names: LeVander, Rolvaag, Keith.'
    tags: [state:mn, name:rolvaag-karl-f, name:keith-alexander-m, name:levander-harold]
