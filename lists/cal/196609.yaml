    c: Zhou Enlai, at the second symposium of Red Guard delegates of the capital's colleges and middle schools, answers their questions. Break the four olds and oppose the bourgeois power-holders, but not every leader takes the capitalist road; do not call every leader "black gang", a term the Center has dropped. Stopping trains at will is anarchism; it upsets transport, and Peking's grain comes from outside.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60–61 (Sept. 10, 1966, the item after); [[w.yang-jisheng-tiandi-fanfu]], I, 269 (Zhou speaks of Li Wenbo''s resistance to the Red Guards as "a reactionary capitalist attacking the Red Guards"); [[w.pu-weihua-zalan-jiu-shijie]], 214, 214 n.43 (the capital''s Red Guards stopped a train into Peking under the slogan "red five stay, black five get out," questioned every student aboard on his birth and put off those not of the five red kinds; the train stood five hours; Zhou: "not in keeping with Mao Zedong Thought"); [[w.pu-weihua-zalan-jiu-shijie]], 235–236 (Zhou at the capital Red Guards'' symposium of Sept. 10: with the uniform changed, the police are hard to see on dark days and at night, so they will wear white armbands on duty; the Girls'' No. 15 Middle School''s proposal to change the red light to green, put to drivers, dropped by the girls when he gave them the reasons). Made public: 2020. The order: after [[cal.1966-09-10.china-leadership-2]], the printed order alone ([[w.zhou-enlai-nianpu-1949-2020]], III, 60–61). To check: Zhou Enlai 周恩來, speech at the second meeting of the Red Guard representatives of the capital''s colleges and middle schools, Sept. 10, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 269 n.55); 周恩來在首都大中學校紅衛兵代表第二次座談會上的講話 (Sept. 10, 1966), in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 214 n.43). Names: Zhou Enlai.'
