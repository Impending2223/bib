    c: 'Ye Jianying 叶剑英 speaks to the eleventh plenary of the Air Force''s Party committee 空军党委: the Cultural Revolution 文化大革命, the Air Force''s leading group, the study of Mao Zedong Thought 毛泽东思想.{1} By Pu, he criticizes the standing members who wrote letters of complaint and conveys Lin Biao''s view: those in the plenum who "seize on the dead to purge the living" have made an error of an anti-Party nature; no organizational measures for now, they keep their posts, to be watched.{2}'
    n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 944; [[w.pu-weihua-zalan-jiu-shijie]], 122 (undated, after the Military Commission''s standing meeting of July 11 on the Air Force: Ye conveys to the plenum the spirit of the Politburo Standing Committee''s and the Military Commission''s meetings, criticizes the standing members who wrote against Wu Faxian and Yu Lijin, and conveys Lin Biao''s view: those who "seize on the dead to purge the living" have made an error of an anti-Party nature; no organizational measures for now, they keep their posts, to be watched); [[w.pu-weihua-zalan-jiu-shijie]], 122. Made public: 2007. Names: Ye Jianying, Mao Zedong, Lin Biao.'
