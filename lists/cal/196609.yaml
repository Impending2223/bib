    when: Sept. 5
    date: '1966-09-05'
    time: 1966-09-04T18:00Z
    thread: china-mao
    c: 'Mao reads, at 2 a.m., Tao Zhu''s draft *Renmin ribao* editorial "Use Civilized Struggle, Not Violence": "seen; issue."{1} It says the Chairman has told us again and again that the Revolution is to be made by argument, not force. Printed Sept. 5.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 337–338 (Sept. 5, 1966; Mao''s note "Send at once to Tao Zhu: read, issue as is," two o''clock (二时), Sept. 5, on the draft Tao sent Sept. 4, printed from the manuscript; the editorial quotes two sentences of Mao''s (the Revolution one that touches men''s souls; argument, not force), which the Wengao prints from *Renmin ribao* of Sept. 5 and dates August; note 1: Mao had said so at the enlarged Standing Committee meeting of Aug. 29); [[w.mao-zedong-zhuan]], VI, ch. 75 n.4 (the editorial ''Use civilized struggle, not violence'', printed soon after in the *Renmin ribao*, Sept. 5 by the note, begins that Mao has told us again and again that the cultural revolution is a revolution touching men''s souls, to be made by argument, not by force, n.4). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75). To check: Renmin ribao, Sept. 5, 1966, editorial "Use argument, not force," quoting two sentences of Mao (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 337 n.1a); Draft of the Renmin ribao editorial "Use argument, not force," sent to Mao by Tao Zhu Sept. 4, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 337 n.1b); *Renmin ribao* 《人民日报》, Sept. 5, 1966 (the editorial "Use civilized struggle, not violence" 《用文斗，不用武斗》) (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.4). Names: Mao Zedong, Tao Zhu.'
