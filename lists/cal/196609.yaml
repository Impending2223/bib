    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 312; [[w.pu-weihua-zalan-jiu-shijie]], 224–225 (forty-eight bodies of forty-eight colleges, over 11,000; Zhou Taian 周太安 of People''s University, son of the Navy''s deputy commander Zhou Xihan 周希汉, acting commander; very few minority bodies in it, Beihang''s Red Flag among them, the majority bodies overwhelming, called by the rebels the "royalist headquarters"; Jiang Qing, Xie Fuzhi, Yang Chengwu, Liu Zhijian and Wang Dongxing at its founding meeting, Jiang and Liu speaking; Yang Chengwu and Liu Zhijian its advisers). Made public: 2016. See [[cal.1966-08-27.china-leadership-6]].'
