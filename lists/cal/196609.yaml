    when: Sept. 1
    date: '1966-09-01'
    thread: china-red-guards
    also: [china-mao-cr]
    c: 'Mao on the draft notice on specific problems in the Cultural Revolution: "This paper is not to be issued."{1}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 31, 1966); [[w.macfarquhar-maos-last-revolution]], 119 (Mao vetoes Zhou''s directive to the country, down to county and regimental levels, listing the establishments to be protected); [[w.jianguo-yilai-mao-zedong]], XVIII, 341 (Sept. 1, 1966; Mao''s note "Back to the Premier. This paper is not to be issued," on the draft Center and State Council notice Zhou sent Aug. 30 (key and secret departments and units to be protected; saboteurs dealt with by law; important archives sealed; to county and regiment level, not published); printed from the manuscript). Made public: 2006. Check: the book (119) describes it as a nationwide directive naming many establishments; the entry has the draft notice on specific problems, reviewed by Zhou Aug. 31. To check: [[w.zhou-enlai-nianpu-1949]], III, 50, 52, 54, 57, 70, 91 (cited by [[w.macfarquhar-maos-last-revolution]], 119 n.13); Central Committee and State Council, draft notice on some specific problems in the Cultural Revolution, sent to Mao by Zhou Enlai Aug. 30, 1966 (not issued) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 341 n.1). See [[cal.1966-08-31.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
