  - id: cal.1966-09-25.china-leadership-5
    when: Sept. 25
    date: '1966-09-25'
    place: peking
    thread: china-red-guards
    c: 'Ye Jianying 葉劍英 receives delegates of teachers and students of thirteen Peking art academies, and speaks. Of Lin Biao 林彪: Mao has chosen his first successor; Lin has rich experience of revolutionary struggle, is a great statesman and strategist, and will, in health better than any of ours, follow Mao for twenty or thirty years. Of the Red Guards: they have set up an "immortal merit"; Peking had over ten thousand "black households," and the Red Guards'' sweep, whatever the law, solved an old hard problem; it may break a little policy, but the greater gain is to clear away bad men and "the rubbish of our society."'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 226, 264; [[w.pu-weihua-zalan-jiu-shijie]], 251–252, 251 n.102 (Sept. 25: Ye Jianying, with Qi Benyu and Xie Tangzhong, receiving delegates of teachers and students of art academies and troupes: the Red Guards'' "immortal merit"; Peking''s ten thousand "black households" no one had entered in sixteen years; a convent primary school foreigners ran for years; "the little generals ... whatever the law ... swept it all away"; it may break a little policy, but the greater gain is to sweep away bad men). The words: 1966年9月25日 (I, 264 n.49). Circulated in China: Ye Jianying, speech on receiving delegates of 13 Peking art academies, Sept. 25, 1966, in Lianhe bianzhizu 聯合編制組, *Shouzhang jianghua xuanbian* 《首長講話選編》 (Mar. 1968), 169 (a Red Guard compilation; cited by [[w.yang-jisheng-tiandi-fanfu]], I, 264 n.49). To check: Ye Jianying, speech on receiving delegates of 13 Peking art academies, Sept. 25, 1966, in Lianhe bianzhizu 聯合編制組, *Shouzhang jianghua xuanbian* 《首長講話選編》 (Mar. 1968), 169 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 264 n.49). Names: Ye Jianying, Lin Biao.'
    src:
      c: 65c6c0d4
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 226, 264: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 226 n.24: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 264 n.49: all'
        - 'w.pu-weihua-zalan-jiu-shijie 251–252, 251 n.102: ?'
    tags: [polity:prc, name:ye-jianying, name:lin-biao]
