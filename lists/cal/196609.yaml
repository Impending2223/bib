  - id: cal.1966-09-23.china-leadership-7
    when: Sept. 23
    date: '1966-09-23'
    thread: china-red-guards
    also: [china-army, china-organization]
    c: 'Ye Jianying 叶剑英 presides at the Military Commission''s 军委 fifty-seventh standing meeting: it hears Liu Zhijian 刘志坚 on the army''s Cultural Revolution 文化大革命 and settles the handling of cadres'' and soldiers'' kin struggled against or raided, and the placing of local and foreign students in the military schools. Ye, closing: the regions to turn now to keeping the troops in order; after revolutionized thought, revolutionized organization; the capital''s demobilized men asking for a Red Guard headquarters 红卫兵总部 to be answered patiently.'
    n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 945. Made public: 2007. Names: Ye Jianying, Liu Zhijian.'
    tags: [polity:prc, ok:fields-place, name:ye-jianying, vis:only:prc, name:liu-zhijian]
