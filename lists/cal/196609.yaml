  - id: cal.1966-09-01.china-leadership-6
    when: Sept. 1
    date: '1966-09-01'
    thread: china-zhou
    c: 'Zhou Enlai tells Hospital 301 to be ready to receive Zhang Zhizhong, Zhang Shizhao, Cheng Qian, Fu Zuoyi, Cai Tingkai, Li Zongren and Shao Lizi: old and ill, the government is to protect them.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52 (Aug. 30, 1966; "九月一日"); [[w.pu-weihua-zalan-jiu-shijie]], 234 (later, Hospital 301 told to be ready to take in Zhang Zhizhong, Zhang Shizhao, Cheng Qian, Fu Zuoyi and other senior democratic personages, old and ill, whom the government is to protect). Made public: 2020. See [[cal.1966-08-30.china-leadership]]. Names: Zhou Enlai, Zhang Zhizhong, Zhang Shizhao, Cheng Qian, Fu Zuoyi, Cai Tingkai, Li Zongren, Shao Lizi.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc, name:cai-tingkai, name:cheng-qian, name:fu-zuoyi, name:li-zongren, name:shao-lizi, name:zhang-shizhao, name:zhang-zhizhong]
  - id: cal.1966-09-01.china-leadership-7
    when: Sept. 1
    date: '1966-09-01'
    thread: china-red-guards
    also: [china-zhou-cr]
    c: 'Zhou Enlai at the symposium of Red Guard delegates of the capital''s colleges and middle schools. Organize first, then unite, with a general meeting, a delegates'' congress and a leading body. Do not disturb production or work units; factories and power stations cannot stop. Do not overthrow ordinary bourgeois persons or raid houses. Respect Soong Ching Ling: wall posters at her house are improper.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 54–55 (Sept. 1, 1966); [[w.dikotter-cultural-revolution]], 222 n.4 (Zhou to a delegation of Red Guards: "we have to carry out revolution, but we also have to produce, otherwise what will we eat?"). Made public: 2020. To check: Zhou Enlai and Wang Renzhong, "Zhou Enlai Wang Renzhong dui Beijing shi hongweibing daibiao de jianghua," Sept. 1, 1966, Cultural Revolution Database (cited by [[w.dikotter-cultural-revolution]], 222 n.4b). Names: Zhou Enlai, Soong Ching Ling.'
    src:
