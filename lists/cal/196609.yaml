    c: Cicero.{1} Robert Lucas of Chicago CORE leads some 250 marchers (Check) into the town, the march King gave up under the summit agreement;{2} SCLC against it.{3} Kerner has called out the National Guard.{4} White crowds throw rocks and bottles; the Guard and the police keep them off;{5} the marchers walk back to Chicago.{6}
