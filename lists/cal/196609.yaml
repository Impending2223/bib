  - id: cal.1966-09-01.economy-investment-credit
    when: Sept. 1
    date: '1966-09-01'
    place: nyc
    thread: economy-investment-credit
    c: 'A New York Times story with details of a proposed tax measure, including removal of the 7 percent tax credit for plant expansion. Mrs. Johnson: the details "were known to only two or three people. How did they get in the paper?"'
    n: '[[w.johnson-white-house-diary]], 417 (Lady Bird Johnson''s account). See [[cal.1966-08-30.economy-investment-credit]]. To check: the *Times* of Sept. 1, 1966. Names: Lady Bird Johnson.'
    tags: [name:johnson-lady-bird]
  - id: cal.1966-09-01.economy-investment-credit-2
    when: Sept. 1
    date: '1966-09-01'
    time: 1966-09-02T03:00Z
    time_approx: true
    place: washington
    thread: economy-investment-credit
    follows:
      - cal.1966-09-01.economy-investment-credit
    c: 'The White House, near 11 p.m. Johnson in his office with about a half-dozen men, Carl Albert, "looking very weary," and Califano among them. Albert: he "didn''t see how Lyndon could do it." Mrs. Johnson gets Albert, Califano and Johnson to sit down to supper just before midnight.'
    n: '[[w.johnson-white-house-diary]], 418 (Lady Bird Johnson''s account). The others are not named. Made public: 1970. Names: Johnson, Albert, Califano.'
    tags: [name:johnson-lyndon-b, name:albert-carl, name:califano-joseph-a-jr]
  - id: cal.1966-09-01.china-leadership
    when: Sept. 1
    date: '1966-09-01'
    thread: china-mao-foreign
    also: [vietnam-hanoi, china-liu, china-zhou-foreign, china-foreign]
    c: 'Mao, Liu Shaoqi, Zhu De and Zhou Enlai cable Hồ Chí Minh, Trường Chinh and Phạm Văn Đồng on the DRV''s 21st anniversary: the U.S. aggressors are in the fire of the people''s war, hoping to save themselves by widening the war and the "peace talks" trick; the Chinese people are ready to strike the American aggressors with the Vietnamese anywhere, at any time, to the final victory.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 1, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 339–340 (Sept. 1, 1966; printed from *Renmin ribao*, Sept. 2, 1966). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Hồ Chí Minh, Trường Chinh, Phạm Văn Đồng.'
    src:
      c: 60840b0e
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Sept. 1, 1966: 1'
        - 'w.jianguo-yilai-mao-zedong XVIII, 339–340: 1'
    tags: [name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:zhou-enlai, name:ho-chi-minh, name:truong-chinh, name:pham-van-dong, polity:prc, polity:drv]
  - id: cal.1966-09-01.china-leadership-2
    when: Sept. 1
    date: '1966-09-01'
    time: 1966-09-01T04:00Z
    thread: china-mao-foreign
    also: [china-foreign]
    c: 'Mao, at the pool at noon, hears Zhou Enlai on Xinjiang and Qingdao. On Sept. 4 he approves three papers Zhou sends: the Center''s telegram putting Tan Qilong in charge of settling the Qingdao workers'' and students'' dispute;{1} two telegrams to the Xinjiang committee and the Northwest Bureau: protect Saifudin, Wang Enmao shielded him in no way; in Yili, Tacheng and Altay the Revolution to go in the "four bigs" only in a way that denies the Soviets an opening.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 1, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 54 (Sept. 1, 1966; Zhou at Mao''s, reporting on Xinjiang and Qingdao); [[w.jianguo-yilai-mao-zedong]], XVIII, 346–347 (Sept. 4, 1966; Mao''s note "Issue as is," Sept. 4, on the two telegrams Zhou sent that day (Saifudin 赛福鼎 to be protected under the nationality policy, Wang Enmao 王恩茂 having carried out the Center''s decision; in Yili, Tacheng and Altay, no direct "dismissal of officials" by the masses, outside students to be persuaded to leave); issued as Center documents that day; printed from a copy). Made public: 2013. To check: Central Committee, two telegrams to the Xinjiang Uighur Autonomous Region committee and the Northwest Bureau, Sept. 4, 1966 (on protecting Saifudin; on the Cultural Revolution in the Yili, Tacheng and Altay border areas) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 346 n.1). Names: Mao Zedong, Zhou Enlai, Tan Qilong, Saifudin, Wang Enmao.'
    src:
      c: 64d8195e
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Sept. 1, 1966: 1, 2'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 54: ?'
        - 'w.jianguo-yilai-mao-zedong XVIII, 346–347: 2'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 346 n.1: 1, 2'
    tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc, name:saifudin, name:tan-qilong, name:wang-enmao]
    time_zone: Asia/Shanghai
  - id: cal.1966-09-01.china-leadership-3
    when: Sept. 1
    date: '1966-09-01'
    thread: china-mao
    also: [china-army]
    c: 'Mao reads the General Political Department''s report of Aug. 31: the Revolution in the army''s organs above army level, planned for two or three months from September, is put off in the large military regions and the garrisons of the large cities, since several provinces'' leaderships are paralyzed and the army must stand ready. "Do as proposed."{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 1, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 342–343 (Sept. 1, 1966; Mao''s note "Do as proposed," the afternoon of Sept. 1, on the General Political Department''s report of Aug. 31, which Lin Biao sent that day; printed from the manuscript). Made public: 2013. To check: General Political Department, report of Aug. 31, 1966 on postponing the Cultural Revolution in the army''s organs above army level (sent to Mao by Lin Biao Sept. 1) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 342 n.1). Names: Mao Zedong.'
    src:
      c: ce50fd7b
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Sept. 1, 1966: 1'
        - 'w.jianguo-yilai-mao-zedong XVIII, 342–343: 1'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 342 n.1: 1'
    tags: [name:mao-zedong, polity:prc, vis:only:prc]
