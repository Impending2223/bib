  - id: cal.1966-09-07.governors-ny
    when: Sept. 7–8
    date: '1966-09-07'
    thread: governors
    also: [elections-1966]
    c: 'New York''s conventions. Democrats at Buffalo, Sept. 7: O''Connor, president of the City Council, nominated for governor on the first ballot over Samuels; Sept. 8, the delegates name Samuels for lieutenant governor against the leaders'' choice. Conservatives at Saratoga Springs, N.Y.: Adams, a professor, an enrolled Republican. Sept. 8, Republicans at Rochester renominate Rockefeller; the Liberals nominate Franklin D. Roosevelt Jr., 209 votes of 321 delegates present.'
    n: '[*New York Times*, Sept. 8, 1966](https://www.nytimes.com/1966/09/08/archives/2d-spot-at-issue-fourway-contest-for-lieutenant-governor-faces.html); [Sept. 8](https://www.nytimes.com/1966/09/08/archives/professor-named-by-conservatives-adams-to-run-for-governor-vietnam.html); [Sept. 9](https://www.nytimes.com/1966/09/09/archives/rockefeller-renominated-pledges-fight-on-bosses-republicans-pick.html); [Sept. 9](https://www.nytimes.com/1966/09/09/archives/rooseveltnamed-by-liberal-party-candidate-seeks-unity-after-getting.html). [[w.smith-on-his-own-terms]], 487–89 (Rockefeller renominated at Rochester; O''Connor, the City Council''s president, the Democrats'' convention "stacked against" Roosevelt; Adams, a Rochester academic, the Conservatives'' nominee; Roosevelt the Liberals''). To check: [[w.persico-imperial-rockefeller]]; [[w.connery-rockefeller-of-new-york]]; [[w.mahoney-actions-speak-louder]]. See [[cal.1962-11-06.governors-ny]]. Names: O''Connor, Paul Adams, Samuels, Rockefeller, Roosevelt.'
