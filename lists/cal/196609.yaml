    when: Sept.
    date: 1966-09
    thread: china-foreign
    c: 'At a meeting of all the staff of the Foreign Affairs Office, Chen Yi 陈毅 asks sharply where those who would "negate everything" put Chairman Mao''s leadership and line; to "overthrow everything," every Party committee above the county, leaves no great, glorious and correct Party: some want to wreck the Party; beware the plot.'
    n: '[[w.chen-yi-nianpu]], 1166. Made public: 1995. Names: Chen Yi, Mao Zedong.'
