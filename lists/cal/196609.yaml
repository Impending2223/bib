    n: 'Remarks at the Battle Creek Sanitarium, Battle Creek, Michigan, [1966 Pub. Papers 961](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=335) (Sept. 5, 1966) (the hour in its note, local time: 2:35 p.m.). [[w.johnson-white-house-diary]], 419–20 (Lady Bird Johnson''s account). Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:mi, city:battle-creek]
    time_zone: America/Detroit
  - id: cal.1966-09-05.vietnam-support
    when: Sept. 5
    date: '1966-09-05'
    time: 1966-09-05T16:40Z
    place: detroit
    thread: vietnam-support
    c: 'Detroit, Cobo Hall, Labor Day, some five thousand. Governor Romney meets Johnson at the airport. A heckler: "Let''s settle the war in Vietnam!" Johnson, off his text: "If anyone will show me the time schedule when aggression and infiltration and ''might makes right'' will be halted, then I, as President of this country, will lay on the table the schedule for the withdrawal of all of our forces from Vietnam." The hall rises. No parade; "almost no blue shirts."'
    n: 'Remarks at an AFL-CIO Rally in Detroit, [1966 Pub. Papers 954](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=328) (Sept. 5, 1966) (the hour in its note, local time: 11:40 a.m.). [[w.johnson-white-house-diary]], 418–19 (Lady Bird Johnson''s account). Names: Johnson, Romney.'
    tags: [name:johnson-lyndon-b, name:romney-george-w, state:mi, city:detroit]
    time_zone: America/Detroit
  - id: cal.1966-09-05.china-leadership
    when: Sept. 5
    date: '1966-09-05'
    thread: china-mao
    c: 'Mao, at the pool, to He Long: gives him the accusation written by Wu Faxian and others at Lin Biao''s instigation. Do not be afraid; "I''ll be your royalist." His old three marks of He: loyal to the Party and people, hard on the enemy, close to the masses.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1966. [[w.teiwes-tragedy-of-lin-biao]], 32, 35 (the official account: Mao expresses continued confidence in He Long in mid-September and suggests he see Lin; Teiwes and Sun put Mao''s request to Lin to warn about He before it). Made public: 2013. To check: [[w.gao-wenhua-dageming-shinian-shi]], 209–221 (cited by [[w.teiwes-tragedy-of-lin-biao]], 32 n.63a); [[w.zhonggong-dangshi-renwuzhuan]], II, 249–260 (cited by [[w.teiwes-tragedy-of-lin-biao]], 32 n.63b). Names: Mao Zedong, He Long, Wu Faxian, Lin Biao.'
    tags: [name:mao-zedong, name:he-long, name:wu-faxian, name:lin-biao, polity:prc, vis:only:prc]
  - id: cal.1966-09-05.china-leadership-2
    when: Sept. 5
    date: '1966-09-05'
    thread: china-mao
    c: 'Mao at the pool to Lin Biao, Zhou Enlai, Wang Renzhong and others: no more life meetings on Liu Shaoqi; the tone rises each time, to "anti-Party, anti-socialist," and that puts him with Peng, Luo, Lu and Yang. History: Chen Duxiu in 1927 only "rightist," expelled only for splitting; Qu Qiubai putschist, a line error; Li Lisan; the Fourth Plenum, Luo Zhanglong''s Center; Wang Ming''s four years; Li Lisan and Wang Ming re-elected at the Seventh Congress; Zhang Guotao''s Center, yet with good men in it (Xu Xiangqian, Li Xiannian).'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 57 (Sept. 5, 1966; Zhou twice at Mao''s that day). Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Wang Renzhong, Liu Shaoqi, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun, Chen Duxiu, Qu Qiubai, Li Lisan, Wang Ming, Zhang Guotao, Xu Xiangqian, Li Xiannian.'
    tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:liu-shaoqi, name:peng-zhen, name:luo-ruiqing, name:lu-dingyi, name:xu-xiangqian, name:li-xiannian, polity:prc, vis:only:prc, name:chen-duxiu, name:li-lisan, name:qu-qiubai, name:wang-ming, name:wang-renzhong, name:yang-shangkun, name:zhang-guotao]
