  - id: cal.1966-09-10.china-leadership
    when: Sept. 10–15
    date: '1966-09-10'
    thread: china-mao
    c: 'Mao five times reads Tao Zhu''s draft Center notice on the display of portraits and the slogans for National Day. Sept. 10: cuts the hundred slogans, "too many, scholasticism," to thirty at most; Sept. 12: thirty; Sept. 14: twenty-three, a lesson, he writes: think, decide nothing in haste, ask more comrades on great matters; Sept. 15 and 16: "agreed."{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 10, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 356–358 (Sept. 10–16, 1966; Mao''s five notes on Tao Zhu''s drafts: Sept. 10 (60 slogans and 40 cries, "scholasticism," a dozen or so each, thirty at most); Sept. 12, on the second draft of Sept. 11 (thirty): whether the Cultural Revolution Group has discussed it; the afternoon of Sept. 14, on the third (twenty-three cries): Lin Biao to read it, then Tao to do so, and the lesson, to Tao, Zhou and Wang Renzhong; "agreed," on the fourth (2 a.m. Sept. 15) and fifth (Sept. 16); the notice settled at twenty-five, issued to county and regiment level Sept. 17). Made public: 2013. To check: Central Committee, notice on the display and carrying of portraits and the slogans for National Day 1966 (twenty-five slogans), issued Sept. 17, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 358 n.1). Names: Mao Zedong, Tao Zhu.'
    src:
      c: acbffbfb
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Sept. 10, 1966: 1'
        - 'w.jianguo-yilai-mao-zedong XVIII, 356–358: 1'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 358 n.1: 1'
    tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
