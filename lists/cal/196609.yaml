  - id: cal.1966-09-08.economy
    when: Sept. 8
    date: '1966-09-08'
    thread: economy-investment-credit
    c: Special message on fiscal policy;{1} a news conference the same day.{2} The 7 percent investment tax credit to be suspended for orders placed from Sept. 1 to Jan. 1, 1968;{3} accelerated depreciation on buildings begun in that time suspended too. About $3 billion, a tenth of the part of the fiscal 1967 budget under his control, to be cut. The Federal Reserve and the large banks asked to help bring interest rates down. Further steps wait on the eight appropriation bills still in Congress and the Vietnam supplemental.{4}
    n: 'Special Message to the Congress on Fiscal Policy, [1966 Pub. Papers 985](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=359) (Sept. 8, 1966); The President''s News Conference, [1966 Pub. Papers 991](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=365) (Sept. 8, 1966). [[w.gibbons-u-s-government-and]], IV, 425–26 (the message; the credit); [[w.dallek-flawed-giant]], 310 (Sept. 8: "additional steps we consider necessary to assure the continuing health and strength of the economy"; cuts in federal spending on structures and equipment, none to "make the poor carry the burden of fighting inflation"; no surcharge on income taxes; not the form of the message, the credit or the sums). To check: [[w.okun-political-economy-of-prosperity]]; [[w.helsing-johnsons-war-johnsons-great]]; [[w.collins-more]]. See [[cal.1965-12-05.economy]].'
