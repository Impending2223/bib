    c: 'Zhou Enlai convenes the Center''s liaison meeting, which adopts the Center''s Provisions on the Cultural Revolution in the Villages below the County: it goes with the Four Cleanups; no linking up by students and Red Guards below the county; the autumn harvest first; cadres removed only by the higher committee, not by the masses. It also discusses Mao''s instruction of Sept. 7 on Qingdao.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58–59 (Sept. 8, 1966). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
