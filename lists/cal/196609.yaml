    date: '1966-09-23'
    place: peking
    thread: china-red-guards
    also: [china-propaganda]
    c: Peking 北京, the Peking Geological Institute 北京地质学院. The Peking Geological Institute's East Is Red 地质东方红 rebels within the school, seals the institute's cultural revolution office and seizes the broadcasting station; a serious battle with the workers' Red Guard team and the "struggle-criticize-reform corps" that back the office; several hundred hurt.
