    date: 1966-09
    at: before 1966-09-21
    thread: china-red-guards
    c: 'At the State Council''s summing-up meeting, reporting on the movement in the foreign affairs system, Chen Yi 陈毅 gives his understanding of the Cultural Revolution: like earlier movements, to clear up thinking and reform unsound systems for a rich country and a strong army; in the foreign affairs system he pressed criticism and self-criticism, posters against the leaders, himself first, to help them "wash and come downstairs"; the Party groups'' members, himself among them, made self-criticisms; not one leading cadre overthrown, all can pass.'
