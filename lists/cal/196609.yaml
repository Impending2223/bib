  - id: cal.1966-09-27.states-and-cities-san-francisco
    when: Sept. 27–Oct. 2
    date: '1966-09-27'
    thread: states-and-cities
    c: 'San Francisco. A policeman shoots Matthew Johnson, 16, running from a stolen car at Hunters Point, Sept. 27; rioting at Hunters Point and in the Fillmore. Shelley asks for the Guard, 11:39 p.m.; Brown sends 2,000; a curfew. Sept. 28, police fire into the Bayview Community Center. Emergency ended Oct. 2. The police report: 457 arrested, 160 hurt.'
    n: 'San Francisco Police Department, *128 Hours* (1966) (Check the title), as [Wikipedia, "Hunters Point social uprising (1966)"](https://en.wikipedia.org/wiki/Hunters_Point_social_uprising_%281966%29) gives it. To check: [[w.crowe-prophets-of-rage]]. See [[cal.1965-08-11.states-and-cities]]. Names: Shelley, Brown, Matthew Johnson.'
    tags: [state:ca, city:san-francisco, name:johnson-matthew, name:shelley-john-f, name:brown-edmund-g]
  - id: cal.1966-09-28.opinion
    when: Sept. 28
    date: '1966-09-28'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, Sept. 8–13: the Johnson Administration pushing integration too fast, 52 percent; about right, 29; not fast enough, 10. Southern whites 76 too fast; whites outside the South 52. Non-whites: too fast 5, about right 51, not fast enough 32. Republicans 61 too fast; independents 61; Democrats 44.'
    n: '[[w.gallup-poll]], III, 2030–31. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-28.africa
    when: Sept. 28
    date: '1966-09-28'
    thread: africa
    c: Senghor, President of Senegal, at the White House.
    n: 'Remarks of Welcome in the East Room to President Senghor of Senegal, [1966 Pub. Papers 1082](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=456); Toasts of the President and President Senghor of Senegal, [1966 Pub. Papers 1083](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=457) (Sept. 28, 1966). To check: [[w.lyons-keeping-africa-off-the]]. Names: Senghor.'
    tags: [name:senghor-leopold-sedar, name:johnson-lyndon-b]
  - id: cal.1966-09-28.elections-1966
    when: Sept. 28
    date: '1966-09-28'
    thread: elections-1966
    also: [georgia]
    c: 'Georgia, the Democratic runoff for governor: Maddox 443,055, Arnall 373,004.'
    n: '[Ga. *Official and Statistical Register*, 1965–66, p. 1779](https://dlg.galileo.usg.edu/data/dlg/sreg/pdfs/dlg_sreg_1965.pdf#page=1782). See [[cal.1966-09-14.elections-1966]]. Names: Maddox, Arnall.'
    tags: [name:maddox-lester, name:arnall-ellis]
  - id: cal.1966-09-29.poverty
    when: Sept. 29
    date: '1966-09-29'
    thread: poverty
    c: 'Economic Opportunity Amendments, H.R. 15111, in the House: a motion to strike the enacting clause lost, [156–208](https://voteview.com/rollcall/RH0890348); recommittal with Quie''s substitute refused, [162–203](https://voteview.com/rollcall/RH0890350); passed, [210–156](https://voteview.com/rollcall/RH0890351).'
    n: '[112 Cong. Rec., House, Sept. 29, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt18/pdf/GPO-CRECB-1966-pt18-4-2.pdf). To check: [[w.davies-from-opportunity-to-entitlement]]; [[w.gillette-launching-the-war-on]]. See [[cal.1965-10-09.poverty]]. Names: Quie.'
    tags: [name:quie-albert-h]
  - id: cal.1966-09-30.economy
    when: Sept. 30
    date: '1966-09-30'
    thread: economy-investment-credit
    c: The suspension of the investment credit and of accelerated depreciation on buildings, H.R. 17607, through the House, [221–118](https://voteview.com/rollcall/RH0890353).
    n: '[112 Cong. Rec., House, Sept. 30, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt18/pdf/GPO-CRECB-1966-pt18-5-1.pdf). See [[cal.1966-09-08.economy]].'
  - id: cal.1966-09-30.opinion
    when: Sept. 30
    date: '1966-09-30'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Sept. 8–13: the United States made a mistake sending troops to fight in Vietnam: yes 35 percent, no 49. Of those disapproving of Johnson''s handling of the war, 61 yes; of those approving, 16.'
    n: '[[w.gallup-poll]], III, 2031–32. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09.desegregation-schools-nyc
    when: Sept.
    date: 1966-09
    thread: desegregation-schools
    c: 'New York. Intermediate School 201, in East Harlem, new and windowless, its pupils Negro and Puerto Rican: parents and community groups demand it be integrated or given a Negro principal and the community''s control; its opening put off. Check the dates.'
    n: 'To check: [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]. See [[cal.1964-02-03.desegregation-schools]].'
