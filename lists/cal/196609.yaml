    c: 'Kang Sheng, by letter of Sept. 16, to Mao: he long doubted Liu Shaoqi''s decision that An Ziwen, Bo Yibo and others "surrender" and leave prison (in 1936 sixty-one Party members, with the Center''s approval, came out of prison).{1} Mao, mid-September: "Seen."{2}'
