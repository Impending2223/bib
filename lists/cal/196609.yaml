    c: 'Mao approves, "issue at once, no discussion," the Center''s rules (Zhou Enlai''s and Tao Zhu''s, discussed Sept. 8) for the Cultural Revolution below the county: it goes with the Four Cleanups;{1} Peking and out-of-town students and Red Guards not to link up below the county unless the provincial or prefectural committee arranges; the Four Cleanups may pause for the autumn harvest;{2} the "four olds" in the villages to be broken in the slack season. Five articles.{3}'
