  - id: cal.1966-09-01.vietnam-2
    when: Sept. 1
    date: '1966-09-01'
    thread: vietnam
    also: [soviet-union]
    c: 'The Negotiations Committee: a senior member of the Soviet UN delegation has suggested private talks on Vietnam; no further escalation of the bombing before Johnson meets Gromyko and before Manila. Harriman recalls Kosygin''s word of July 1965: Hanoi did not exclude a settlement "even one bypassing the Chinese."'
    n: '[[w.gibbons-u-s-government-and]], IV, 442–43. To check: Memorandum of Meeting Sept. 1, 1966 in Governor Harriman''s Office, Department of State, Lot File 70 D 207 (cited by [[w.gibbons-u-s-government-and]], IV, 442 n.9). Names: Harriman, Gromyko, Kosygin, Johnson.'
    src:
      c: 1bf0106d
      rows:
        - 'w.gibbons-u-s-government-and IV, 442–43: all'
        - 'via w.gibbons-u-s-government-and IV, 442 n.9: all'
    tags: [name:harriman-w-averell, name:gromyko-andrei, name:kosygin-aleksei, name:johnson-lyndon-b]
