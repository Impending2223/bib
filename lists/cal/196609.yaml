  - id: cal.1966-09-24.china-leadership
    when: Sept. 24
    date: '1966-09-24'
    thread: china-red-guards
    also: [china-mao-cr]
    c: 'Mao approves Zhou Enlai''s telegram, agreed at the Standing Committee liaison meeting that day, to the East China Bureau, the Shanghai committee and the Peking Red Guards'' Southern Column and the Peking schools'' Red Guards in Shanghai: the Sixteen Points'' rule of argument, not force, must be kept; the forced parade of capitalists in Shanghai on Sept. 25 and the mass meeting planned must stop; the Peking Red Guards finish and come home for National Day. Sent the same day.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 24, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 67 (Sept. 24, 1966; Zhou chairs the Center''s liaison meeting, which settles the telegram on the Peking Red Guards plan to parade a hundred or two hundred capitalists in Shanghai; sent that night with Mao''s consent). Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1966-09-24.china-leadership-2
    when: Sept. 24
    date: '1966-09-24'
    thread: china-red-guards
    also: [china-zhou-cr, china-army]
    c: 'Zhou Enlai reviews the General Political Department''s and General Staff''s report proposing that villages, mines, enterprises, institutions, offices and mass bodies form no Red Guards, and the Center''s note forwarding it: Red Guards are spreading to villages and enterprises, some in the militia carry arms and have used force; on Xu Xiangqian''s proposal none in villages and enterprises, and the militia to hold its posts and bring in the harvest.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 24, 1966). Made public: 2020. See [[cal.1966-09-17.china-leadership]]. Names: Zhou Enlai, Xu Xiangqian.'
    tags: [name:zhou-enlai, name:xu-xiangqian, polity:prc, vis:only:prc]
  - id: cal.1966-09-24.china-leadership-3
    when: Sept. 24
    date: '1966-09-24'
    thread: china-red-guards
    c: 'The Hunan committee 湖南省委 calls a meeting of the secretaries of the prefectures, autonomous prefectures and cities and the heads of the provincial departments. Zhang Pinghua 張平化 says the situation has changed and it is time to strike back, and formally sets the province to catching "black ghosts" 抓黑鬼. Wang Yanchun 王延春 says: "so this is how the cultural revolution is done."'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 291–292. Made public: 2016. To check: Yang Daqing 楊大慶, 〈張平化的9.24報告與抓「黑鬼」運動〉 (year not given) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 291 n.8). Names: Zhang Pinghua, Wang Yanchun.'
    src:
      c: 883641f3
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 291–292: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 291 n.8: all'
    tags: [polity:prc, vis:only:prc, ok:fields-place, name:wang-yanchun, name:zhang-pinghua]
  - id: cal.1966-09-24.china-leadership-4
    when: Sept. 24
    date: '1966-09-24'
    place: peking
    thread: china-red-guards
    also: [china-propaganda]
    c: 'Tsinghua University 清華大學, Peking.{1} Kuai Dafu 蒯大富 and others found the Tsinghua University Jinggangshan Corps 清華大學井岡山兵團, only a few dozen members, those branded counter-revolutionaries with him.{2} Its aim: to criticize the work group''s bourgeois reactionary line, to criticize the "Tsinghua University Red Guards," and to clear the "Kuai-type persons." Kuai had it from Zhang Chunqiao 張春橋 that he should have an organization of his own; Zhu Chengzhao and Han Aijing 韓愛晶 said the same. He wants the founding declaration broadcast on the campus station, and He Pengfei refuses.{3}'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 311; [[w.pu-weihua-zalan-jiu-shijie]], 223 (the Tsinghua University Jinggangshan Red Guards under Kuai Dafu founded Sept. 23; on the 24th they open the attack to seize the school''s broadcasting station). Made public: 2011. To check: Xu Aijing 許愛晶, *Qinghua Kuai Dafu* 《清華蒯大富》 (Zhongguo wenge lishi chubanshe, Hong Kong, 2011), 138 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 311 n.6). Names: Zhang Chunqiao, Kuai Dafu, Han Aijing.'
    src:
      c: 9dd8e54c
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 311: 1, 2, 3'
        - 'via w.yang-jisheng-tiandi-fanfu I, 311 n.6: 1, 2, 3'
        - 'w.pu-weihua-zalan-jiu-shijie 223: ?'
    tags: [polity:prc, name:zhang-chunqiao, name:han-aijing, name:kuai-dafu]
    variants:
      - unit: '2'
        witness: w.pu-weihua-zalan-jiu-shijie
        reads: founded Sept. 23
        at: '223'
