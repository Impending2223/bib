  - id: cal.1966-09-04.opinion
    when: Sept. 4
    date: '1966-09-04'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, special survey of persons drawn from *Who''s Who in America*, 1966: what they would do about Vietnam if President: step up the fighting 27 percent; continue as at present 21; slow down the fighting 35.'
    n: '[[w.gallup-poll]], III, 2025–26.'
  - id: cal.1966-09-05.jobs-and-wages-farm-workers
    when: Sept. 5
    date: '1966-09-05'
    thread: jobs-and-wages-farm-workers
    also: [states-and-cities]
    c: Labor Day. The Texas farm workers' march ends with a rally at the Capitol in Austin.
    n: Richard Bailey, ["Starr County Strike,"](https://www.tshaonline.org/handbook/entries/starr-county-strike) *Handbook of Texas Online*. See [[cal.1966-07-04.jobs-and-wages-tx]].
    tags: [state:tx]
  - id: cal.1966-09-06.georgia
    when: Sept. 6–8
    date: '1966-09-06'
    thread: civil-disorders
    also: [civil-rights-organizations, georgia]
    c: Atlanta, Summerhill. A white policeman shoots Harold Prather, a Negro suspect running from arrest; a crowd gathers, SNCC workers among it. Allen, speaking from the top of a police car, is toppled off it; police disperse the crowd with tear gas. Allen blames SNCC. Sept. 8, Carmichael arrested, charged with inciting to riot. Check the details.
    n: 'Carmichael, [Statement](https://www.crmvet.org/docs/660908_sncc_stokely.pdf) (Sept. 8, 1966). *Time*, Sept. 16, 1966, "Atlanta: Stokely''s Spark." [[w.allen-mayor]]. [[w.branch-at-canaans-edge]], 525–26 (a thousand officers; sixteen hospitalized, seventy-five jailed; Carmichael''s summons over WAOK; Bill Ware and Robert Walton of SNCC arrested first; the Constitution''s Patterson: "SNCC was in charge"). To check: [[w.carson-in-struggle]]; [[w.joseph-stokely]]; [[w.kruse-white-flight]]; "Atlanta Negroes Riot After Police Wound a Suspect," NYT, Sept. 7, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 525); Jet, Sept. 22, 1966, pp. 8-11 (cited by [[w.branch-at-canaans-edge]], 525); Pomerantz, *Where Peachtree Meets Sweet Auburn* (1997), 344–50 (cited by [[w.branch-at-canaans-edge]], 525); [[w.allen-mayor]], 181 ff (cited by [[w.branch-at-canaans-edge]], 525); Pomerantz, *Where Peachtree Meets Sweet Auburn* (1997), 348 (cited by [[w.branch-at-canaans-edge]], 525); Bayor, *Race and the Shaping of Twentieth-Century Atlanta* (1996), 139–40 (cited by [[w.branch-at-canaans-edge]], 525); Anne Braden, "Slums Cause Outbreak," SP, Oct. 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 526); Sellers, *The River of No Return* (1973), 174–77 (cited by [[w.branch-at-canaans-edge]], 526); New York Times, Sept. 8, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 526); Cited in Sellers, River, p. 177 (cited by [[w.branch-at-canaans-edge]], 526); New York Times, Sept. 7, 1966, p. 38 (cited by [[w.branch-at-canaans-edge]], 526); "Carmichael Held in Riot Aftermath," NYT, Sept. 9, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 526); "Carmichael Denies in Court That He Began Atlanta Riot," NYT, Oct. 2, 1966, p. 82 (cited by [[w.branch-at-canaans-edge]], 526). Names: Allen, Carmichael, Prather.'
