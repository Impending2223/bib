    thread: china-red-guards
    also: [china-mao-cr, china-propaganda]
    c: 'Mao reads Wang Xiaoyu''s report of Sept. 4 to the Cultural Revolution Group (Qingdao: the Laoshan county four-cleanups team tells workers and peasants to educate the students): wrong;{1} Qingdao, Changsha, Xi''an alike set workers against students.{2} To Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Li Fuchun, Wang Renzhong and Jiang Qing: the Center should issue an instruction against it and a *Renmin ribao* editorial urge workers and peasants not to meddle; Peking has not set workers and peasants on students.{3} The editorial "Grasp Revolution, Promote Production" appears that day.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 7, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 348–350 (Sept. 7, 1966; Mao''s note of Sept. 7 on the report of Sept. 4 by Wang Xiaoyu 王效禹, vice-mayor of Qingdao and deputy head of its Laoshan county Four Cleanups work team; printed from a Center document (manuscript held); in Peking only People''s University brought in 600 peasants, to protect Guo Yingqiu 郭影秋; Tan Qilong''s 谭启龙 and the vice-mayor''s views right; note 4: the editorial "Workers, peasants and revolutionary students, unite under the banner of Mao Zedong Thought," *Renmin ribao*, Sept. 11); [[w.yang-jisheng-tiandi-fanfu]], I, 295 (Sept. 7 Mao''s comment on the report on the situation in Changsha, Qingdao, Xi''an and other places: "the situation in Qingdao, Xi''an and Changsha is alike, workers and peasants are organized against the students, and going on so will not settle the problem; it seems fit for the Center to issue an instruction forbidding the localities to do so, and then to write an editorial urging workers and peasants not to meddle in the student movement"); [[w.yang-jisheng-tiandi-fanfu]], I, 461 (Mao in a comment approves Wang Xiaoyu). Made public: 2013. To check: Wang Xiaoyu, report to the Cultural Revolution Group of Sept. 4, 1966 on the Laoshan county Four Cleanups work team setting workers and peasants against students (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 348 n.1); Renmin ribao, Sept. 11, 1966, editorial "Workers, peasants and revolutionary students, unite under the banner of Mao Zedong Thought" (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 349 n.4); Mao Zedong 毛澤東, comment on the report on the situation in Changsha, Qingdao, Xi''an and other places, [[w.jianguo-yilai-mao-zedong]], XII, 124 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 295 n.16). Names: Mao Zedong, Wang Xiaoyu, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Li Fuchun, Wang Renzhong, Jiang Qing.'
