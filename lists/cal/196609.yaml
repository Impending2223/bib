    when: Sept. 6
    date: '1966-09-06'
    thread: georgia
    also: [civil-rights-organizations, draft]
    c: 'Atlanta, City Hall. Carmichael and SNCC''s steering committee, refusing Allen''s hand, ask the release of twelve SNCC workers arrested three weeks before at the induction center picket, one charged with insurrection. Allen: a federal matter; register to vote.'
    n: '[[w.branch-at-canaans-edge]], 524–25. To check: Pomerantz, *Where Peachtree Meets Sweet Auburn* (1997), 345—46 (cited by [[w.branch-at-canaans-edge]], 524); SNCC Atlanta Project, "Atlanta''s Black Paper," Aug. 25, 1966, Reel 37, SNCC. O14 Notes (cited by [[w.branch-at-canaans-edge]], 524). Names: Carmichael, Allen.'
