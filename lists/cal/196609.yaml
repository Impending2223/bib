  - id: cal.1966-09-24.china-leadership-6
    when: Sept. 24
    date: '1966-09-24'
    thread: china-red-guards
    also: [china-economy]
    c: 'The Center 中共中央 forwards the report of the State Council''s Finance and Trade Office 国务院财贸办公室 and the State Economic Commission 国家经济委员会 on some policy questions of finance, trade and handicrafts, approving demands the Red Guards made in the four olds 破四旧: joint state-private enterprises to become state enterprises; the capitalists'' fixed interest abolished altogether; cooperative shops to become state shops by conditions and steps; lipstick, rouge, perfume and other dear cosmetics no longer sold at home.{1} The report is Li Xiannian''s; Zhou Enlai''s liaison meeting discussed it on Sept. 16.{2}'
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 253, 253 n.105; [[w.zhou-enlai-nianpu-1949-2020]], III, 63–64 (under Sept. 16, 1966; the Center sends the report out Sept. 23). Made public: 2008; 2020 (the Zhou nianpu). Printed for internal circulation: [[w.wenhua-dageming-yanjiu-ziliao]], I, 126–127 (1988). To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 126–127 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 253 n.105). See [[cal.1966-09-16.china-leadership-2]]. Names: Zhou Enlai, Li Xiannian. Check: the day; [[w.zhou-enlai-nianpu-1949-2020]], III, 63–64 has the Center send the report out Sept. 23.'
    src:
      c: 67e8cd73
      rows:
        - 'w.pu-weihua-zalan-jiu-shijie 253: 1'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 63–64: 2'
