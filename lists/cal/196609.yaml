    c: 'Mao reads Liu Shaoqi''s draft outline of self-criticism for the meeting of work-group leaders in Peking: "basically well written, very serious, the second half better";{1} to be circulated as a draft to the Politburo, Secretariat, work-group leaders, Peking committee and Cultural Revolution Group for opinion, then revised before reporting, "which may steady it."{2} Liu speaks on it Oct. 23, at the work conference.{3}'
