    c: 'Guiyang 貴陽. Some 3,000 students from the capital''s southbound group and Guiyang schools go to the provincial committee''s building and ask the first secretary Jia Qiyun 賈啟允 to see them; he hides at the military district. The provincial public security department turns out over 100 "organ Red Guards" to guard the building; the provincial cultural revolution group, in the name of propagating the Sixteen Articles, mobilizes 120,000 cadres, workers and residents who, from Sept. 5 to 8, day and night, divide, besiege and struggle against the students in turn: the "Sept. 5 incident."'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 290. Made public: 2016. To check: Peng Zhenxin 彭振新, *Guizhou wenge dashi ji* 《貴州文革大事集》, 5th supplemented draft (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 290 n.6).'
