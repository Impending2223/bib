    also: [elections-1966]
    c: Massachusetts primary. McCormack, once attorney general, Democratic nominee for governor over O'Donnell, Kennedy's appointments secretary, 343,381 to 279,541, 55.1 percent. Volpe unopposed.
    n: '[Mass. *Election Statistics*, 1966 (P.D. 43), p. 131](https://archive.org/details/electionstatisti19651966mass/page/n204). See [[cal.1966-09-13.elections-1966]]. Names: Edward McCormack, O''Donnell, Volpe.'
    tags: [state:ma, name:mccormack-edward-j-jr, name:odonnell-kenneth-p, name:volpe-john-a]
  - id: cal.1966-09-13.governors-nh
    when: Sept. 13
    date: '1966-09-13'
    thread: governors
    also: [elections-1966]
    c: New Hampshire's Republican primary for governor. Gregg over Barry, 33,946 to 20,791, 44.9 percent; Taft 14,845, 19.6 percent; three others. King re-elected over Gregg in November, 125,882 to 107,259, 53.9 percent.
    n: '[N.H. *Manual for the General Court*, no. 40 (1967), p. 294](https://archive.org/details/manualforgeneral40newh/page/n335). [Wikipedia, "1966 New Hampshire gubernatorial election"](https://en.wikipedia.org/wiki/1966_New_Hampshire_gubernatorial_election). See [[cal.1964-09-08.governors-nh]]. Names: Gregg, Barry, Taft, King.'
    tags: [state:nh, name:gregg-hugh, name:barry-james-j, name:taft-alexander-m, name:king-john-w]
  - id: cal.1966-09-13.governors-vt
    when: Sept. 13
    date: '1966-09-13'
    thread: governors
    also: [elections-1966]
    c: Vermont's Republican primary for governor. Snelling over Hayes, 22,069 to 15,286, 59.0 percent. Hoff re-elected in November over Snelling, 78,669 to 57,577, 57.7 percent.
    n: '[Vt. Secretary of State, "Primary Election Results, 1966"](https://web.archive.org/web/20160304111616/https://www.sec.state.vt.us/media/62956/p1966.pdf); [Wikipedia, "1966 Vermont gubernatorial election"](https://en.wikipedia.org/wiki/1966_Vermont_gubernatorial_election). See [[cal.1964-09-08.governors-vt]]. Names: Snelling, Hayes, Hoff.'
    tags: [state:vt, name:snelling-richard-a, name:hayes-thomas-l, name:hoff-philip-h]
  - id: cal.1966-09-14.elections-1966
    when: Sept. 14
    date: '1966-09-14'
    thread: elections-1966
    also: [georgia]
    c: Georgia's Democratic primary for governor. Arnall, governor 1943–47, first, over Maddox, who closed his Atlanta restaurant rather than serve Negroes, 231,480 to 185,672, 29.4 percent; Carter, a State senator, third, 164,562, 20.9 percent; Gray 152,973, 19.4 percent; two others. Callaway, a U.S. Representative, the Republican nominee.
    n: '[Ga. *Official and Statistical Register*, 1965–66, p. 1738](https://dlg.galileo.usg.edu/data/dlg/sreg/pdfs/dlg_sreg_1965.pdf#page=1741). The others'' counts: [Wikipedia, "1966 Georgia gubernatorial election"](https://en.wikipedia.org/wiki/1966_Georgia_gubernatorial_election), from the Register. To check: [[w.short-everything-is-pickrick]]; [[w.kruse-white-flight]]; [[w.carter-why-not-the-best]]. Names: Maddox, Carter, Callaway, Arnall.'
    tags: [name:maddox-lester, name:carter-jimmy, name:callaway-howard-h, name:arnall-ellis]
  - id: cal.1966-09-14.open-housing
    when: Sept. 14
    date: '1966-09-14'
    thread: open-housing
    also: [congress]
    c: The civil rights bill, H.R. 14765, passed by the House Aug. 9, in the Senate. Cloture on Hart's motion to take it up refused, [54–42](https://voteview.com/rollcall/RS0890447), ten short of two-thirds. Dirksen opposed to its open-housing title.
    n: '[112 Cong. Rec., Senate, Sept. 14, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-2-2.pdf). See [[cal.1966-04-28.open-housing]]. Names: Hart, Dirksen.'
    tags: [name:hart-philip-a, name:dirksen-everett]
  - id: cal.1966-09-14.opinion
    when: Sept. 14
    date: '1966-09-14'
    thread: opinion
    also: [crime-and-hijacking]
    c: 'Gallup, Aug. 18–23: a police permit required to buy a gun: favor 68 percent, oppose 29; gun owners 56 and 41. The use of guns by those under 18: forbid it 27; restrict it 55; continue as at present 15. Gun owners: 17, 59, 22.'
    n: '[[w.gallup-poll]], III, 2027.'
  - id: cal.1966-09-14.vietnam-operations
    when: Sept. 14
    date: '1966-09-14'
    thread: vietnam-operations
    c: 'Attleboro begins: battalion probes around Tây Ninh by the 196th Light Infantry Brigade, new to the country, searching for caches west of the Saigon River.'
    n: '[[w.macgarrigle-united-states-army-in]], 31–59; [[w.rogers-cedar-falls-junction-city]], 11; [[w.vietnam-victory-in-vietnam]], 195–96, 465 n.28. Check: *Victory in Vietnam* dates Attleboro from a helicopter landing, Nov. 4, to the Americans'' withdrawal, Nov. 26: 22,000 Americans; 600 put out of action by one battalion of the 16th Regiment (196, 465 n.28).'
    tags: [place:tay-ninh]
  - id: cal.1966-09-15.vietnam
    when: Sept. 15
    date: '1966-09-15'
    thread: vietnam
    c: 'McNamara, without waiting for the Joint Chiefs'' answer, names Starbird director of Joint Task Force 728: an infiltration interdiction system across South Vietnam and Laos "as a matter of highest priority," in operation by Sept. 15, 1967. CINCPAC had called a barrier impracticable, Sept. 13; the Chiefs, Sept. 17, approve with reservations.'
    n: 'FRUS 1964–68, IV, doc. [233](https://history.state.gov/historicaldocuments/frus1964-68v04/d233). [[w.gibbons-u-s-government-and]], IV, 454–56. Made public: [[w.pentagon-papers]], IV, 113–23 (1971). Names: McNamara, Starbird.'
    tags: [name:mcnamara-robert-s, name:starbird-alfred-d]
  - id: cal.1966-09-16.opinion
    when: Sept. 16
    date: '1966-09-16'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: how the war will end: an American victory 21 percent; a stalemate or negotiations 27, Korea named by 13; a long drawn-out conflict 9; a Communist victory 4; a third world war 4; no opinion 26.'
    n: '[[w.gallup-poll]], III, 2027.'
  - id: cal.1966-09-19.foreign-aid
    when: Sept. 19
    date: '1966-09-19'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1966 signed, [80 Stat. 795](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg795-3.pdf): development lending and the Alliance for Progress authorized through fiscal 1969 (Check), the rest for a year. Johnson objects to "new restrictions on the administration of this program." The conference report through the House Sept. 1, [217–127](https://voteview.com/rollcall/RH0890323); the Senate Sept. 7, [33–25](https://voteview.com/rollcall/RS0890445).'
    n: 'Statement by the President Upon Signing the Foreign Assistance Act of 1966, [1966 Pub. Papers 1037](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=411) (Sept. 19, 1966). To check: [[w.ruttan-united-states-development-assistance]]; [[w.taffet-foreign-aid-as-foreign]]. See [[cal.1965-10-20.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-19.open-housing
    when: Sept. 19
    date: '1966-09-19'
    thread: open-housing
    also: [congress]
    c: Cloture on the civil rights bill refused again, [52–41](https://voteview.com/rollcall/RS0890448). Mansfield sets the bill aside; it dies with the session.
    n: '[112 Cong. Rec., Senate, Sept. 19, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-5-2.pdf). See [[cal.1966-09-14.open-housing]]. Names: Mansfield.'
    tags: [name:mansfield-mike]
  - id: cal.1966-09-19.vietnam-congress
    when: Sept. 19
    date: '1966-09-19'
    thread: vietnam-congress
    c: 'Helms, at Johnson''s direction, briefs Fulbright, Mansfield and Russell on the CIA''s study "The Will to Persist." By Helms''s report: no one''s view changed; Fulbright holds the war a civil war internationalized by the United States, and asks whether the briefing is meant to stop his and Mansfield''s criticism; Russell would have come to the same conclusions.'
    n: '[[w.gibbons-u-s-government-and]], IV, 418–19. To check: Helms to Rostow, "Senatorial Briefing," Sept. 20, 1966 (LBJ Library, NSF Agency File, CIA). Names: Helms, Johnson, Fulbright, Mansfield, Russell.'
    tags: [name:helms-richard, name:johnson-lyndon-b, name:fulbright-j-william, name:mansfield-mike, name:russell-richard-b]
  - id: cal.1966-09-20.vietnam-congress
    when: Sept. 20
    date: '1966-09-20'
    thread: vietnam-congress
    c: 'Foreign Relations in executive session on Thailand, William Bundy the witness: the constitutional and legal ground of what the United States does there, and the secrecy. Symington: explain it to the public; Bundy: the Thais object. Marcy''s memorandum beforehand: Fulbright wants "a constitutional discussion of what is happening to Senate authority."'
    n: 'Daily Digest, [112 Cong. Rec. D509](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=507). [[w.gibbons-u-s-government-and]], IV, 419–20. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 979 (1993); Marcy to Bader, Aug. 29, 1966 (National Archives, RG 46, Marcy Chron File). Names: William Bundy, Symington, Marcy, Fulbright.'
    tags: [name:bundy-william, name:symington-william-s, name:marcy-carl, name:fulbright-j-william]
  - id: cal.1966-09-20.elections-1966
    when: Sept. 20
    date: '1966-09-20'
    thread: elections-1966
    also: [vietnam]
    c: 'The House Republican Conference brings up to date its paper of 1965 on the war: a stalemate; peace "not in sight"; a five-year war would cost 125,000 American casualties. Boggs and Mahon: a partisan issue made of the war. Laird: no clear objectives; Ford: "deception and confusion."'
    n: '[112 Cong. Rec. 23225–28](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-6-2.pdf#page=19) (Boggs, Mahon, Laird), [23309–18](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-6-2.pdf#page=103) (the paper, "The United States and the War in Vietnam," and Ford''s statement) (Sept. 20, 1966). [[w.gibbons-u-s-government-and]], IV, 422–23. Names: Boggs, Mahon, Laird, Ford.'
    tags: [name:boggs-hale, name:mahon-george-h, name:laird-melvin-r, name:ford-gerald-r]
  - id: cal.1966-09-21.economy
    when: Sept. 21
    date: '1966-09-21'
    thread: economy
    also: [cities-and-housing]
    c: 'Interest Rate Control Act signed, [80 Stat. 823](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg823.pdf): ceilings on rates paid on deposits and share accounts, set by the Federal Reserve, the FDIC and the Home Loan Bank Board, more flexibly, by the size of the deposit (Check); reserves on member banks'' time deposits up to 10 percent; the Reserve banks may deal in agency issues. The House passed it Sept. 8, [271–68](https://voteview.com/rollcall/RH0890329).'
    n: 'Remarks at the Signing of the Interest Rate Control Bill, [1966 Pub. Papers 1044](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=418) (Sept. 21, 1966). [112 Cong. Rec., House, Sept. 8, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt16/pdf/GPO-CRECB-1966-pt16-8-1.pdf). To check: [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.kettl-leadership-at-the-fed]]. See [[cal.1966-09-08.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-21.court
    when: Sept. 21
    date: '1966-09-21'
    thread: court
    also: [congress, amendments]
    c: Dirksen's amendment to permit voluntary prayer in the public schools fails in the Senate, [49–37](https://voteview.com/rollcall/RS0890451), nine short of two-thirds. Offered as a substitute for S.J. Res. 144, a resolution for a National UNICEF Day; the substitute taken, [51–36](https://voteview.com/rollcall/RS0890450); Bayh's, a resolution that Congress favored prayer in the schools, refused, [33–52](https://voteview.com/rollcall/RS0890449).
    n: '[112 Cong. Rec., Senate, Sept. 21, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-7-2.pdf). See [[cal.1966-03-22.amendments]]; [[cal.1966-08-01.amendments]]. Names: Dirksen, Bayh.'
    tags: [name:dirksen-everett, name:bayh-birch]
  - id: cal.1966-09-21.transition-and-staff
    when: Sept. 21
    date: '1966-09-21'
    thread: transition-and-staff
    c: News conference. Ball, Under Secretary of State, has resigned, by letter of Sept. 17; Katzenbach to leave the Attorney Generalship for his place. Confirmed Sept. 30; sworn Oct. 3. Ramsey Clark, the Deputy, Acting Attorney General from Oct. 3. Ball leaves Sept. 30; Johnson's farewell for him at the White House, Oct. 6.
    n: 'The President''s News Conference, [1966 Pub. Papers 1045](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=419) (Sept. 21, 1966); Remarks at the Swearing In of Nicholas deB. Katzenbach as Under Secretary of State, [1966 Pub. Papers 1113](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=487) (Oct. 3, 1966); Remarks at a Farewell Ceremony Honoring Former Under Secretary of State George W. Ball, [1966 Pub. Papers 1124](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=498) (Oct. 6, 1966). To check: [[w.ball-past-has-another-pattern]]; [[w.katzenbach-some-of-it-was]]. Names: Ball, Katzenbach, Clark, Johnson.'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:katzenbach-nicholas, name:clark-ramsey]
  - id: cal.1966-09-21.opinion
    when: Sept. 21
    date: '1966-09-21'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Sept. 8–13: Johnson''s handling of Vietnam: approve 43 percent, disapprove 40. Democrats 53 approve, 30 disapprove; independents 36 and 45; Republicans 34 and 52.'
    n: '[[w.gallup-poll]], III, 2027–29. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-22.vietnam
    when: Sept. 22
    date: '1966-09-22'
    thread: vietnam
    c: 'Goldberg to the General Assembly at the opening of its 21st session: the United States "prepared to order a cessation of all bombing of North Viet-Nam the moment we are assured, privately or otherwise, that this step will be answered promptly by a corresponding and appropriate de-escalation on the other side." Rostow, sending Johnson the draft Sept. 21: the passages on Vietnam did "not go beyond existing policy."'
    n: 'FRUS 1964–68, IV, doc. [244](https://history.state.gov/historicaldocuments/frus1964-68v04/d244). [[w.department-of-state-bulletin]], [Oct. 10, 1966, 518–525](https://archive.org/details/departmentofstat5566unit/page/518/mode/1up). [[w.cosmas-joint-chiefs-of-staff-2012]], 531 (the speech); [[w.gibbons-u-s-government-and]], IV, 401–02. To check: [[w.stebenne-arthur-j-goldberg]]; [[w.herring-lbj-and-vietnam]]. See [[cal.1966-01-03.vietnam]]. Names: Goldberg, Rostow, Johnson.'
    src:
      c: 97ff23c8
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d244: all'
        - 'w.department-of-state-bulletin [Oct. 10, 1966, 518–525]: ?'
        - 'w.gibbons-u-s-government-and IV, 401–02: all'
        - 'w.cosmas-joint-chiefs-of-staff-2012 531: A'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 531 n.11a: A'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 531 n.11b: A'
    tags: [name:goldberg-arthur-j, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1966-09-23.jobs-and-wages
    when: Sept. 23
    date: '1966-09-23'
    thread: jobs-and-wages
    c: 'Fair Labor Standards Amendments signed in the Cabinet Room, [80 Stat. 830](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg830.pdf): the minimum wage from $1.25 an hour to $1.40 Feb. 1, 1967, and $1.60 a year later; about 8 million more workers covered, farm workers for the first time, from $1 an hour, farm workers to $1.30 by 1969, the others to $1.60 by 1971. The House agreed to the conference report Sept. 7, [260–89](https://voteview.com/rollcall/RH0890327), recommittal refused, [163–183](https://voteview.com/rollcall/RH0890326); the Senate Sept. 14, [55–38](https://voteview.com/rollcall/RS0890446).'
    n: 'Remarks at the Signing of the Fair Labor Standards Amendments of 1966, [1966 Pub. Papers 1060](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=434) (Sept. 23, 1966). [112 Cong. Rec., House, Sept. 7, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt16/pdf/GPO-CRECB-1966-pt16-7-2.pdf); [112 Cong. Rec., Senate, Sept. 14, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-2-2.pdf). To check: [[w.nordlund-quest-for-a-living]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-23.opinion
    when: Sept. 23
    date: '1966-09-23'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, special survey of persons drawn from *Who''s Who in America*, 1966: Republicans four in ten of them; of the public about one in four. The Republicans'' choice for 1968: Romney 40 percent, Nixon 29, Goldwater 6, Scranton 3. The independents'': Romney 40, Nixon 14, Goldwater 4, Scranton 3, Lindsay 3, Javits 2. Would run for the Senate if asked, expenses paid: yes 24.'
    n: '[[w.gallup-poll]], III, 2029–30. Names: Romney, Scranton, Nixon, Goldwater, Javits, Lindsay.'
    tags: [name:romney-george-w, name:nixon-richard-m, name:goldwater-barry-m, name:scranton-william-w, name:lindsay-john-v, name:javits-jacob-k]
  - id: cal.1966-09-25.opinion
    when: Sept. 25
    date: '1966-09-25'
    thread: opinion
    also: [vietnam, europe-and-the-alliance]
    c: 'Gallup, Aug. 18–23, and like surveys in Britain and Canada: the United States should begin to withdraw its troops, carry on at its present level of fighting, or increase its attacks on North Vietnam. United States: 18, 18, 55 percent. Britain: 42, 17, 16. Canada: 31, 18, 27.'
    n: '[[w.gallup-poll]], III, 2030.'
  - id: cal.1966-09-26.europe-and-the-alliance
    when: Sept. 26–27
    date: '1966-09-26'
    thread: europe-and-the-alliance
    c: 'Erhard in Washington. Joint statement, Sept. 27: the Federal Republic to "make every effort fully to meet the current offset agreement," but unable in future fully to offset the cost of American forces in Germany by buying American arms; the threat, the forces needed, and the burden to be reexamined in talks of the United States, Germany and Britain. Reunification "one of the most significant goals of American foreign policy." Oct. 11, McCloy named the American in the talks, to open at Bonn Oct. 20.'
    n: 'Toasts of the President and Chancellor Erhard of Germany, [1966 Pub. Papers 1064](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=438) (Sept. 26, 1966); Joint Statement Following Discussions With Chancellor Erhard of Germany, [1966 Pub. Papers 1077](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=451) (Sept. 27, 1966); Statement by the President on the Forthcoming Conversations Between Washington, London, and Bonn, [1966 Pub. Papers 1139](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=513) (Oct. 11, 1966). FRUS 1964–68, XV, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v15/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v15/d176), [177](https://history.state.gov/historicaldocuments/frus1964-68v15/d177), [178](https://history.state.gov/historicaldocuments/frus1964-68v15/d178), [179](https://history.state.gov/historicaldocuments/frus1964-68v15/d179), [180](https://history.state.gov/historicaldocuments/frus1964-68v15/d180); XIII, doc. [207](https://history.state.gov/historicaldocuments/frus1964-68v13/d207). [[w.drea-mcnamara-clifford-and-the-2011]], 409 (the meeting; the tripartite review); [[w.poole-joint-chiefs-of-staff-2012]], 101 (the meeting; the offset; the reappraisal); [[w.schwartz-lyndon-johnson-and-europe]], 127–32, 143 (the talks; the joint statement; McCloy). To check: [[w.zimmermann-money-and-security]]; [[w.gavin-gold-dollars-and-power]]; [[w.bird-chairman]]. See [[cal.1965-12-20.europe-and-the-alliance]]. Names: Erhard, McCloy.'
