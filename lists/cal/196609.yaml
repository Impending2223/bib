    c: Grenada.{1} About 250 Negro children, of 450 enrolled under a federal court order in the white schools, go to class;{2} the rest withdrawn under threats to their parents' jobs and homes.{3} A white crowd meets them, chases them through the streets, beats children and reporters with chains, pipes and clubs, through the first week, the local police not stepping in.{4} Federal protection from Sept. 17; 13 of the crowd arrested.{5} Check the figures.{6}
