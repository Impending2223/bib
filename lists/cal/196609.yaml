    c: 'Tiananmen. Mao receives a million Red Guards and revolutionary teachers and students from all over the country (the third reception), Lin Biao and Zhou Enlai speaking. He is photographed with some 300 student delegates and alone with Jiao Shouyun, daughter of Jiao Yulu; receives Ted Hill, chairman of the Communist Party of Australia (Marxist-Leninist), and his wife; tells Chen Yun, whom he meets, "I have not overthrown you; rest and work later."{1} Kang Sheng takes over from Jiang Qing as master of ceremonies; the rally lasts four hours.{2} Zhou: workers, commune members, technicians and cadres to keep their posts; students and Red Guards not to link up in factories, enterprises, offices below the county or the communes; factories and villages not to stop work to make revolution.{3} Chen Yi is with Mao.{4} Ye Jianying is with Mao.{5} Zhu De attends.{6} Deng Xiaoping attends.{7}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 15, 1966; Zhou''s speech: farm and industrial output; workers, commune members, technicians and cadres to keep their posts; Red Guards not to link up in factories and below the county); [[w.macfarquhar-maos-last-revolution]], 108–109 (the rally lasts four hours; Kang Sheng takes over as master of ceremonies from Jiang Qing; Mao regains enough strength to be present); [[w.deng-xiaoping-nianpu-1904]], III, 1931 (Sept. 15, 1966; 下午; Deng takes part in Mao Zedong''s 毛泽东 reception, in Tiananmen Square 天安门广场, of a million Red Guards 红卫兵 and teachers and students of colleges and middle schools from all over the country); [[w.mao-zedong-zhuan]], VI, ch. 75 (Sept. 15, in the afternoon, Mao, just over an illness, goes to Tiananmen Square and receives more than a million teachers, students and Red Guards from all over the country, the third reception). [[w.jian-zhou-enlai]], 552 (the third review, a million; Zhou beside Mao: production in industry and farming to be kept up; "Red Guards and revolutionary students should not make liaison efforts at factories and enterprises"; "Factories and rural areas should not make revolution by suspending production"); [[w.chen-yi-nianpu]], 1165 (Sept. 15, 1966; Chen Yi with Zhou and others accompanies Mao at the third reception, a million Red Guards, teachers and students); [[w.liu-jixian-ye-jianying-nianpu]], II, 944 (Sept. 15, 1966; Ye Jianying 叶剑英 with Mao at the third reception, in Tiananmen Square 天安门广场); [[w.chen-yun-nianpu-xiuding]], III, 157 (Chen Yun at the third reception; Mao asks after his health: "In the Cultural Revolution I have not struck you down; rest and get well, and work later"); [[w.zhu-de-nianpu-xinbian]], III, 1957 (Sept. 15, 1966; Zhu De 朱德 at Mao Zedong''s 毛泽东 third reception in Tiananmen Square 天安门广场 of a million Red Guards 红卫兵, teachers and students from all over the country); [[w.pu-weihua-zalan-jiu-shijie]], 251, 251 n.101 (Sept. 15, Lin Biao at the third reception, in Tiananmen Square: "Red Guard fighters ... your revolutionary actions have shaken the whole society ... you have done right and done well"; the speech read and approved by Mao beforehand); [[w.macfarquhar-maos-last-revolution]], 108; [[w.zhou-enlai-nianpu-1949-2020]], III, 63; [[w.chen-yi-nianpu]], 1165; [[w.liu-jixian-ye-jianying-nianpu]], II, 944; [[w.zhu-de-nianpu-xinbian]], III, 1957; [[w.deng-xiaoping-nianpu-1904]], III, 1931. To check: Xinhua''s report of the review (Sept. 16); [[w.pipan-liu-deng-luxian]], 59–60 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.31); [[w.hui-hongweibing-mi-lu]], 393 (cited by [[w.macfarquhar-maos-last-revolution]], 110 n.40); [[w.renmin-ribao]], Sept. 16, 1966, 1 (cited by [[w.jian-zhou-enlai]], 552 n.40). Names: Mao Zedong, Lin Biao, Zhou Enlai, Jiao Shouyun, Ted Hill, Chen Yun, Jiao Yulu, Kang Sheng, Jiang Qing, Chen Yi, Ye Jianying, Zhu De, Deng Xiaoping. Check: the talk with Chen Yun is from the nianpu alone.'
