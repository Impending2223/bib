    c: 'The Mansion, the family dining room, noon. Johnson, Mrs. Johnson, Valenti and his wife. Valenti raises 1968. Johnson: "I won''t be around then. If I could figure some way to get out of this job I would do it now. They would say I was playing politics if I resigned and gave the job to Humphrey." "My own party has turned against me, and the Republicans have chimed in." "As it is now I have even lost the Congress." "We probably need a fresh face." Valenti believes he has committed himself not to run. By Valenti''s account.'
