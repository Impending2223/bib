    c: 'Mao reads Zhou Enlai''s Sept. 5 provisional rules on approving the appointment and removal of Party and government cadres, drawn by the Standing Committee liaison meeting: bureau secretaries and provincial and ministerial heads, fixed by the Standing Committee or proposed by the liaison meeting for Mao and Lin Biao;{1} bureau-level cadres by Tao Zhu; the heads of large regions, services and headquarters to Mao and the Center.{2} "Print for the Politburo, Secretariat, Group and Peking committee; discuss soon."{3}'
