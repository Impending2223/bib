    tags: [name:zhou-enlai, name:tao-zhu, polity:prc]
  - id: cal.1966-09-07.china-leadership-3
    when: Sept. 7
    date: '1966-09-07'
    place: peking
    thread: china-red-guards
    also: [china-zhou-cr, china-propaganda]
    follows:
      - cal.1966-09-07.china-leadership-2
    c: 'Zhou Enlai, at the meeting of out-of-town students in Peking and at the debate meeting of the Academy of Sciences, refers to the editorial and asks that it be studied. At the Academy: besides the Cultural Revolution, the production struggle and scientific experiment go on; the Academy''s advanced research and many key experiments cannot be left aside as now; as for his own responsibility, he cannot watch it continue; the most urgent and needed work must not suffer in the Cultural Revolution.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58 (Sept. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1966-09-07.china-leadership-4
    when: Sept. 7
    date: '1966-09-07'
    thread: china-red-guards
    also: [china-zhou-cr]
    c: 'Zhou Enlai, told that 340,000 out-of-town students are in Peking and still rising, beyond the reception offices strength, writes Jiang Qing and the Cultural Revolution Group, copy to Mao, Lin Biao, the Standing Committee and Secretariat: the Center should notify the provinces of the rise and its practical difficulties, and a central leader should urge the students in Peking to go home early.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58 (Sept. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Mao Zedong, Lin Biao.'
    tags: [name:zhou-enlai, name:jiang-qing, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
  - id: cal.1966-09-07.china
    when: Sept. 7
    date: '1966-09-07'
    thread: china
    c: Wang Kuo-ch'uan, China's ambassador to Poland, after the 131st U.S.–China ambassadorial meeting, issues a statement publishing his main speech at the meeting, because the U.S. government has again broken the agreement of the two sides by disclosing, one-sidedly, what is said at the talks. He stresses that for 17 years the U.S. has pursued hostility and aggression against China, with ever bolder military provocation and war threats, and now draws its military ring tighter, treating the Chinese people as its chief enemy; its talk of "easing" relations is worthless. The Chinese people will liberate Taiwan and, with the world's peoples, smash any U.S. plot of aggression. He restates China's resolve to back the Vietnamese struggle.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 125–126 (Sept. 7, 1966). Names: Wang Kuo-ch''uan.'
    src:
      c: 38d94bb1
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 125–126: all'
    tags: [polity:prc, polity:us, name:wang-kuo-chuan]
  - id: cal.1966-09-07.china-leadership-5
    when: Sept. 7
    date: '1966-09-07'
    thread: china-red-guards
    c: The Center issues Zhongfa [1966] 459, listing the regions and counties along China's borders where the method of having the masses directly "dismiss officials from office" is not to be employed. From Shenzhen in the south to Erlian in the north, from Jilong on the border with Nepal to Yanji on the border with North Korea, security is to come before "revolutionary disorder."
    n: '[[w.macfarquhar-maos-last-revolution]], 93. Made public: [[w.macfarquhar-maos-last-revolution]], 93 (2006). Circulated in China: [[w.hongri-zhao-tianshan]], 1 (a compilation of central documents and leaders'' speeches, 1968; cited by [[w.macfarquhar-maos-last-revolution]], 93 n.32). To check: [[w.hongri-zhao-tianshan]], 1 (cited by [[w.macfarquhar-maos-last-revolution]], 93 n.32).'
    src:
