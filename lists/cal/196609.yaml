  - id: cal.1966-09-02.alabama-al
    when: Sept. 2
    date: '1966-09-02'
    thread: alabama
    also: [desegregation-schools]
    c: At Wallace's call, the legislature, in special session, declares void every agreement of a local school board with HEW under the desegregation guidelines and forbids new ones. Wallace approves it, Act No. 252 (H. 446), at 1:05 p.m.
    n: '[*Acts of Alabama*, Special Session, 1966, 372–377](https://archive.org/details/alabama-acts-1966/page/n370): "Approved September 2, 1966. Time: 1:05 P.M.," [377](https://archive.org/details/alabama-acts-1966/page/n375). Cited in [*Wallace v. Lee*, Motion to Affirm](https://ldfrecollection.org/archives/archives-search/archives-item/8f325deb-eb93-40a1-bf4f-3e634cbbfcdd/wallace-v-lee-motion-to-affirm) (NAACP Legal Defense Fund). To check: [[w.carter-politics-of-rage-1995]]. See [[cal.1964-07-13.alabama]]. Names: Wallace.'
    tags: [state:al, name:wallace-george-c]
  - id: cal.1966-09-02.vietnam
    when: Sept. 2
    date: '1966-09-02'
    thread: vietnam
    c: 'Komer to McNamara on his chart and the CIA''s studies: "the southern VC are becoming the ''weak sisters'' in the enemy lineup"; if so, pacification "may not prove as slow and painful a task as many predict," and the civil programs, Chieu Hoi, refugees, police, cadres, should be stepped up.'
    n: '[[w.gibbons-u-s-government-and]], IV, 410. To check: Komer to McNamara, Sept. 2, 1966, Warnke Papers, McNaughton Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 410 n.82). See [[cal.1966-08-25.vietnam-2]]. Names: Komer, McNamara.'
    src:
      c: 8fb9d4d4
      rows:
        - 'w.gibbons-u-s-government-and IV, 410: all'
        - 'via w.gibbons-u-s-government-and IV, 410 n.82: all'
    tags: [name:komer-robert-w, name:mcnamara-robert-s]
  - id: cal.1966-09-02.economy-investment-credit
    when: Sept. 2
    date: '1966-09-02'
    thread: economy-investment-credit
    c: 'At Johnson''s request, his advisers sign a joint memorandum: suspend the investment credit, cut current spending, and cover any new money for the war by future taxes. Johnson agrees.'
    n: '[[w.gibbons-u-s-government-and]], IV, 426; [[w.califano-triumph-and-tragedy-of]], 148 (the Friday before Labor Day, in Califano''s office: Ackley, Katzenbach, Schultze, O''Brien, Ginsburg, Fowler, McNamara initial it); [[w.bernstein-guns-or-butter]], 366–67 (Fowler, McNamara, Katzenbach, O''Brien, Schultze, Ackley, Ginsburg and Califano agree). See [[cal.1966-08-29.economy-investment-credit]]. Names: Johnson.'
    src:
