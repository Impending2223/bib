  - id: cal.1966-09-05.china-leadership-4
    when: Sept. 5
    date: '1966-09-05'
    thread: china-red-guards
    c: The Center and State Council issue a notice on bringing revolutionary students of colleges and middle schools outside Peking, with teachers' and staff representatives, to Peking to see the Cultural Revolution.{1} The Red Guards' "great linking up" quickens.{2}
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1966. [[w.macfarquhar-maos-last-revolution]], 110 (by early September the State Council has informed all relevant authorities that Red Guards on exchanges of revolutionary experience are to have free travel, board and lodging); [[w.mao-zedong-zhuan]], VI, ch. 75 (Sept. 5 the Center and the State Council issue the notice on bringing representatives of the revolutionary students, teachers and staff of colleges and middle schools outside Peking to Peking to see the cultural revolution; rail travel for the students free, board and lodging arranged by the local governments at State expense; the great linking up grows). [[w.yang-jisheng-tiandi-fanfu]], I, 243 (the Center''s notice of Sept. 5 on the great linking-up: all travel by train free, and the living allowances of those who link up charged to the state''s finances 由國家財政中開支; the linking-up begins with Peking Red Guards going out to "stir the fire" and then outside students coming to Peking to "seek the scriptures," see Mao and petition); [[w.dikotter-cultural-revolution]], 101 n.3 (on Sept. 5 the State Council announces travel, board and lodging free for all Red Guards); [[w.liu-jixian-ye-jianying-nianpu]], II, 944 (Sept. 5, 1966; the Center''s and the State Council''s notice on bringing students and teachers to Peking 北京 to see the movement); [[w.pu-weihua-zalan-jiu-shijie]], 258, 258 n.117 (the notice 〈关于组织外地高等学校革命学生、中等学校革命学生代表和革命教职工代表来北京参观文化大革命运动的通知〉: all college students from elsewhere, but for the sick, those already come and others unable, may come; one staff delegate to fifty college students; one student delegate to ten middle-school students and one staff delegate to a hundred; the train free; living and travel costs from the state, food and lodging in Peking by the city). To check: Zhang Huican 張輝燦 and Mu An 慕安, 〈毛澤東八次接見紅衛兵內情〉, *Yanhuang chunqiu* 《炎黃春秋》 2006 no. 4 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 243 n.5).'
