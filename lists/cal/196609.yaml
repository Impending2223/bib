  - id: cal.1966-09-26.europe-and-the-alliance
    when: Sept. 26–27
    date: '1966-09-26'
    place: washington
    thread: europe-and-the-alliance
    c: 'Erhard in Washington.{1} Joint statement, Sept. 27: the Federal Republic to "make every effort fully to meet the current offset agreement," but unable in future fully to offset the cost of American forces in Germany by buying American arms;{2} the threat, the forces needed, and the burden to be reexamined in talks of the United States, Germany and Britain.{3} Reunification "one of the most significant goals of American foreign policy."{4} Oct. 11, McCloy named the American in the talks, to open at Bonn Oct. 20.{5}'
    n: 'Toasts of the President and Chancellor Erhard of Germany, [1966 Pub. Papers 1064](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=438) (Sept. 26, 1966); Joint Statement Following Discussions With Chancellor Erhard of Germany, [1966 Pub. Papers 1077](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=451) (Sept. 27, 1966); Statement by the President on the Forthcoming Conversations Between Washington, London, and Bonn, [1966 Pub. Papers 1139](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=513) (Oct. 11, 1966). FRUS 1964–68, XV, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v15/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v15/d176), [177](https://history.state.gov/historicaldocuments/frus1964-68v15/d177), [178](https://history.state.gov/historicaldocuments/frus1964-68v15/d178), [179](https://history.state.gov/historicaldocuments/frus1964-68v15/d179), [180](https://history.state.gov/historicaldocuments/frus1964-68v15/d180); XIII, doc. [207](https://history.state.gov/historicaldocuments/frus1964-68v13/d207). [[w.drea-mcnamara-clifford-and-the-2011]], 409 (the meeting; the tripartite review); [[w.poole-joint-chiefs-of-staff-2012]], 101 (the meeting; the offset; the reappraisal); [[w.schwartz-lyndon-johnson-and-europe]], 127–32, 143 (the talks; the joint statement; McCloy). [[w.gavin-gold-dollars-and-power]], 149–51, 153 (the meeting and the offset no longer tied to the forces at 149–51, McCloy at 153). To check: [[w.zimmermann-money-and-security]]; [[w.bird-chairman]]. See [[cal.1965-12-20.europe-and-the-alliance]]. Names: Erhard, McCloy.'
    src:
      c: 94b31fb5
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=438: 1, 2, 3, 4, 5'
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=451: 1, 2, 3, 4, 5'
