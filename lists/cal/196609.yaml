    c: The Capital Colleges' Red Guard Revolutionary Rebel General Headquarters 首都大專院校紅衛兵革命造反派總司令部, the Third Headquarters 三司, is founded in Peking under Zhu Chengzhao 朱成昭 of the Peking Geological Institute.{1} A rebel body whose members are largely students hit by the bourgeois reactionary line;{2} the Tsinghua Mao Zedong Thought Red Guards 清華毛澤東思想紅衛兵 join it.{3} Nineteen bodies of seventeen schools, about 4,000 members. Liu Zhijian, Zhou Rongxin and Qi Benyu are at the founding meeting, Liu speaking; Yang Chengwu and Liu Zhijian are its advisers.{4}
