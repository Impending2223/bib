  - id: cal.1966-09-01.vietnam
    when: Sept. 1
    date: '1966-09-01'
    place: phnom-penh
    thread: vietnam-diplomacy
    also: [europe-and-the-alliance]
    c: 'De Gaulle at Phnom Penh, Sihanouk his host.{1} Cambodia, he says, kept its body and its soul by remaining its own master, while "the political and military authority of the United States was seen installed in its turn in South Vietnam" and the war "gained new strength there in the form of national resistance." Lodge, from Saigon: the words mean "that the United States in effect committed an aggression in South Vietnam." Bohlen, from Paris: de Gaulle "ignoring facts in favor of his favorite position."{2}'
    n: 'FRUS 1964–68, XII, doc. [66](https://history.state.gov/historicaldocuments/frus1964-68v12/d66). [[w.current-documents-1966]], 646–648, the speech; [[w.schwartz-lyndon-johnson-and-europe]], 141 (de Gaulle''s speech at Phnom Penh, September 1966, n.3 dating it Sept. 1: American policy "more and more threatening for the peace of the world"; not the entry''s quotations or the replies). [[w.cosmas-joint-chiefs-of-staff-2012]], 531 (the speech; Sihanouk). To check: [[w.journoud-de-gaulle-et-le]]; [[w.jackson-de-gaulle]]; [[w.clymer-troubled-relations]]. Names: de Gaulle, Norodom Sihanouk, Lodge, Bohlen.'
    src:
      c: 43c10fa8
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d66: 1, 2'
        - 'w.current-documents-1966 646–648, the speech: 1, 2'
        - 'w.cosmas-joint-chiefs-of-staff-2012 531: 1'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 531 n.9: 1'
        - 'w.schwartz-lyndon-johnson-and-europe 141: ?'
    tags: [name:de-gaulle-charles, name:norodom-sihanouk, name:lodge-henry-cabot, name:bohlen-charles-e, place:phnom-penh]
  - id: cal.1966-09-01.states-and-cities-dayton
    when: Sept. 1
    date: '1966-09-01'
    place: dayton
    thread: civil-disorders
    also: [states-and-cities]
    c: Dayton. Lester Mitchell, a Negro, shot dead from a passing car while sweeping the walk before his bar on West Fifth Street, early morning. Rioting in west Dayton through the day;{1} Mayor Dave Hall asks Rhodes for the National Guard, in the city by 3 p.m. One dead, about 30 hurt, over 100 arrested.{2}
    n: '[Wikipedia, "1966 Dayton race riot"](https://en.wikipedia.org/wiki/1966_Dayton_race_riot), from the *Dayton Daily News* (Check). [[w.zelizer-fierce-urgency-of-now]], 241 (Mitchell killed; violence in Dayton). Check: Zelizer, 241, has Mitchell, thirty-nine, killed outside his house by three white men in a pickup truck. See [[cal.1966-07-18.states-and-cities]]. Names: Mitchell, Hall, Rhodes.'
    src:
      c: f16c512c
      rows:
        - 'https://en.wikipedia.org/wiki/1966_Dayton_race_riot: 1, 2'
        - 'w.zelizer-fierce-urgency-of-now 241: 1'
    tags: [state:oh, city:dayton, name:mitchell-lester, name:hall-dave, name:rhodes-james-a]
    time_range:
      - 1966-09-01T04:00Z
      - 1966-09-01T14:00Z
    time_zone: America/New_York
  - id: cal.1966-09-01.europe-and-the-alliance
    when: Sept. 1
    date: '1966-09-01'
    time: 1966-09-01T14:07Z
    thread: europe-and-the-alliance
    c: 'Johnson to Russell Long, by telephone, 10:07 a.m., on Mansfield''s resolution: "This thing y''all did yesterday really murdered us on NATO."{1} Two weeks of "a war with the British" to hold their cuts until they could be matched with American ones.{2}'
    n: '[FRUS 1964–68, XV, doc. 165](https://history.state.gov/historicaldocuments/frus1964-68v15/d165). [[w.gavin-gold-dollars-and-power]], 149. Made public: FRUS 1964–68, XV (1999). [[w.schwartz-lyndon-johnson-and-europe]], 122–23. See [[cal.1966-08-31.europe-and-the-alliance]]. Names: Russell Long, Mansfield, Johnson.'
    src:
      c: a427faaa
      rows:
