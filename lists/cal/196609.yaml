    c: 'The *Renmin ribao* prints the editorial "Grasp Revolution, Promote Production", drafted by Tao Zhu on Zhou Enlai''s instruction: revolution and production both; production units and offices to strengthen leadership; workers, commune members, technicians and others to hold their posts; students not to go to the villages and factories to interfere.'
