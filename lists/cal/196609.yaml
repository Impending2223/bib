        - 'via x.1966-09-06.new-york-times-sept-6-1966: B'
    tags: [name:rockefeller-nelson, state:ny, city:nyc, ok:result-form]
  - id: cal.1966-09-04.open-housing
    when: Sept. 4
    date: '1966-09-04'
    thread: open-housing
    also: [civil-rights-organizations]
    c: Cicero. Robert Lucas of Chicago CORE leads some 250 marchers (Check) into the town, the march King gave up under the summit agreement; SCLC against it. Kerner has called out the National Guard. White crowds throw rocks and bottles; the Guard and the police keep them off; the marchers walk back to Chicago.
    n: '[[w.branch-at-canaans-edge]], 524 (250, fifty of them white; two thousand Guardsmen and five hundred deputies; three thousand residents; King''s call to Lucas that morning). To check: New York Times, Sept. 5, 1966, p. 8 (cited by [[w.branch-at-canaans-edge]], 524); Travis, *An Autobiography of Black Chicago* (1981), 252–54 (cited by [[w.branch-at-canaans-edge]], 524); Garrow, Bearing, pees (cited by [[w.branch-at-canaans-edge]], 524); Blackstone Productions, Inc., Eyes on the Prize I, America at the Racial Crossroads—1965 to 1985, Vol. 2, "Two Societies (1965—68)." (cited by [[w.branch-at-canaans-edge]], 524); New York Times, Sept. 5, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 524); Southern Courier, Oct. 1-2, 1966, p. 3 (cited by [[w.branch-at-canaans-edge]], 524); comments of Glory Bryant in Eyes on the Prize II (cited by [[w.branch-at-canaans-edge]], 524). See [[cal.1966-07-10.open-housing]]. Names: King, Kerner, Lucas.'
    src:
      c: b6c19b8b
      rows:
