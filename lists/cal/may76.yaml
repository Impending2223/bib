    date: '1976-05-25'
    thread: elections-1976
    c: 'Primaries in Arkansas, Idaho, Kentucky, Nevada, Oregon and Tennessee. Republican: Reagan in Arkansas, Idaho and Nevada; Ford in Kentucky, Oregon and Tennessee. Democratic: Carter in Arkansas, Kentucky and Tennessee; Church in Idaho and Oregon; Brown in Nevada.'
    n: 'Ky. State Board of Elections, [1976 primary and general: President](https://elect.ky.gov/SiteCollectionDocuments/Election%20Results/1973-1979/76-79/76res_president2.txt); [*Political History of Nevada* (12th ed. 2016), 520](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=526); Or., [*Official Abstract of Votes, Primary Election 1976*, 1–2](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411043/File/document). CQ Guide 6th (2010) 419–420. See [[cal.1976-02-24.elections-1976]]. Names: Church, Ford, Carter, Reagan.'
