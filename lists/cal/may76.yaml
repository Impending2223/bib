  - id: cal.1976-05-11.elections-1976
    when: May 11
    date: '1976-05-11'
    thread: elections-1976
    c: 'Primaries in Nebraska and West Virginia. Republican: Reagan in Nebraska; Ford in West Virginia. Democratic: Church in Nebraska; Byrd in West Virginia.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1976*, 4, 7](https://govdocs.nebraska.gov/epubs/S1200/S001-1976prim_gen.pdf#page=4); [*West Virginia Blue Book, 1976*, 586, 635](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1976.pdf#page=594). CQ Guide 6th (2010) 419. See [[cal.1976-02-24.elections-1976]]. Names: Church, Ford, Byrd, Reagan.'
    tags: [primary:1976-05-11, name:church-frank, name:ford-gerald-r, name:byrd-robert-c, name:reagan-ronald]
  - id: cal.1976-05-18.elections-1976
    when: May 18
    date: '1976-05-18'
    thread: elections-1976
    c: 'Primaries in Maryland and Michigan. Republican: Ford in Maryland and Michigan. Democratic: Brown in Maryland; Carter in Michigan.'
    n: 'CQ Guide 6th (2010) 419. See [[cal.1976-02-24.elections-1976]]. Names: Ford, Carter.'
    tags: [primary:1976-05-18, name:brown-edmund-g, name:ford-gerald-r, name:carter-jimmy]
  - id: cal.1976-05-25.elections-1976
