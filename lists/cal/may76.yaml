    c: 'Primaries in the District of Columbia, Georgia and Indiana. Republican: Reagan in Georgia and Indiana. Democratic: Carter in the District, Georgia and Indiana.'
    n: '[*Election Report of Indiana, 1976*, 1–2](https://indianamemory.contentdm.oclc.org/digital/collection/p16066coll37/id/1773). CQ Guide 6th (2010) 418–419. See [[cal.1976-02-24.elections-1976]]. Names: Carter, Reagan.'
