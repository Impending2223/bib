  - id: cal.thread.democratic-party
    s: Democratic Party
    c: 'The Democratic Party: its national committee and chairmen, its caucuses, conferences and leaders in Congress, its State parties, factions and allied groups, and the word of its members and figures on policy and politics. Wisconsin''s delegates reallotted; the Advisory Council on the Paris summit; the liberals for Kennedy; Thurmond on the platform; Johnson''s bid to keep the Senate conference''s chair, the caucus''s vote; Americans for Democratic Action with Kennedy; Corbin at the national committee; the meetings with the party''s members on the midterms; the birthday gala; Humphrey''s poll on a tax cut; Edward Kennedy endorsed at Springfield.'
