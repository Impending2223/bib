  - id: cal.thread.cuba
    s: Cuba
    c: Cuba short of the missile crisis, and after. Mikoyan in Havana; the covert program; the refineries seized and the sugar quota cut; the nationalizations; the Declaration of San José; the export embargo; the break; the Bay of Pigs and the Taylor inquiry; Mongoose; Punta del Este; the trade embargo; Northwoods; the prisoners' ransom; the Orange Bowl.
    c2: Cuba short of the missile crisis, and after. NSAM 213; the exile raids on Soviet ships; the sabotage program; Attwood and Lechuga; Cubela; Guantanamo's water; the OAS sanctions; *Zemel v. Rusk*; Camarioca and the refugee airlift.
    c3: Cuba short of the missile crisis, and after. The Cuban Adjustment Act; Guevara killed in Bolivia.
  - id: cal.thread.cuba-bay-of-pigs
    s: Bay of Pigs
    c: The invasion of Cuba by the CIA's exile brigade, from Eisenhower's covert program to the collapse on the beach and after. The program of Mar. 17, 1960; Retalhuleu; the President-elect briefed; the Chiefs on Trinidad; Trinidad to Zapata; Schlesinger's and Fulbright's dissents; "no intervention"; the strike of Apr. 15, the second cancelled; the landing; Khrushchev's message; the beachhead lost; Nixon with Kennedy.
    parent: cuba
  - id: cal.thread.missile-crisis
    s: Cuban Missile Crisis
    c: The Soviet missiles in Cuba, from the decision to the aftermath. The Presidium's plan; McCone's warning; Keating's charges; the Cuba resolution; the U-2's find; the ExComm; the address and the quarantine; the letters; Black Saturday; the withdrawal; the IL-28s; the Stevenson story.
    c2: The Soviet missiles in Cuba, from the decision to the aftermath. The joint letter to U Thant; Keating's caves; McNamara's photographs; the Soviet troops.
  - id: cal.thread.cyprus
    s: Cyprus
    c: 'Cyprus: the republic, its two communities, the guarantor powers. Independence; NSAM 71; NSAM 98; Makarios at the White House; NSAM 169; Johnson at Nicosia.'
    c2: 'Cyprus: the republic, its two communities, the guarantor powers. NSAM 266; Makarios''s thirteen amendments; the Nicosia fighting; the guarantors'' appeal; Cyprus to the Security Council; the London conference broken down; Ball''s mission; the UN force; Johnson to Inonu; Inonu and Papandreou at the White House; Acheson''s plans at Geneva; the Turkish strikes at Kokkina; the plans refused.'
    c3: 'Cyprus: the republic, its two communities, the guarantor powers. Demirel to Rusk at Ankara; the National Guard at Ayios Theodoros and Kophinou; Vance''s mission; the withdrawals agreed; Johnson''s statement.'
