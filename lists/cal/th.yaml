    s: Civil rights bill
    c: The civil rights bill from Kennedy's address to the Act and its first year. The Senators' pledge of 1960.
    c2: The civil rights bill from Kennedy's address to the Act and its first year. The May meetings; June 11; the message of June 19; the Senate hearings; Judiciary's bill, Oct. 29; Johnson's joint session; the discharge petition; Smith's hearings; "sex" in Title VII; the House, 290–130; the filibuster; the Dirksen–Mansfield substitute; cloture, 71–29; the Senate, 73–27; the Act, July 2; Title II tested; Title VI's regulations; *Heart of Atlanta*.
    c3: The civil rights bill from Kennedy's address to the Act and its first year. The Motorola order reversed in Illinois.
  - id: cal.thread.civil-rights-organizations
    s: Civil rights organizations
    c: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. *Bates*; SNCC founded at Raleigh; Farmer to CORE; Highlander; the Taconic meeting; Greenberg and Young; the Albany Movement; COFO revived; the Voter Education Project.'
    c2: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Lewis SNCC''s chairman; the Council for United Civil Rights Leadership; the leaders at the White House; the Freedom Vote; Freedom Day at Hattiesburg; Klunder killed at Cleveland; the Freedom Democratic Party; the moratorium; the compromise refused; Waveland; CORE at Durham; the Charlotte bombings; McKissick; SNCC against the war.'
    c3: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Dahmer killed; Carmichael SNCC''s chairman; the White House conference; Meredith shot; CORE and "black power"; Wilkins against it; SNCC votes the whites out; the NAACP on Riverside; Brown for Carmichael; the four leaders on the riots; SCLC at Atlanta; Howard''s administration building held.'
  - id: cal.thread.civil-rights-the-executive
    s: 'Civil rights: the executive'
    c: What the President and the Attorney General did for civil rights by appointment, order and direction, and what the candidates promised. Nixon's letter to Jackie Robinson; the Senators' pledge; Lodge's promise; Weaver; the equal employment committee; the new judgeships, Cox and Marshall; the Emancipation centennial; the housing order.
    c2: What the President and the Attorney General did for civil rights by appointment, order and direction, and what the candidates promised. The Commission's century report; Baldwin; Johnson at Gettysburg; the apprenticeship order; the order on federally aided construction; Cambridge; McNamara's directive; Penn's killing and the Danielsville acquittal; the Council on Equal Opportunity; the Klan arrests; Howard University; Executive Order 11246.
    c3: What the President and the Attorney General did for civil rights by appointment, order and direction, and what the candidates promised. Weaver to the Cabinet; the Community Relations Service to Justice; Brimmer to the Board; the equal employment bill; the White House Conference "To Fulfill These Rights" and its report; Gallup on integration's pace; "The Forgotten American"; the Jury Selection and Service Act.
  - id: cal.thread.confirmations
    s: Confirmations
    c: Nominations the Senate divided on by roll call. Meriwether; Holmes; the Power Commission; Robinson; McCone; McCloskey; Marshall to the Second Circuit.
    c2: Nominations the Senate divided on by roll call. The satellite incorporators; Collins to the Community Relations Service; Coleman to the Fifth Circuit; Morrissey's nomination recommitted.
    c3: Nominations the Senate divided on by roll call. Marshall to the Court; Warren's retirement; Fortas for Chief Justice and Thornberry; the hearings; cloture refused; Fortas withdrawn.
  - id: cal.thread.congo
    s: Congo
    c: 'The Congo from independence: its civil wars, and the UN''s war in Katanga. Independence; Katanga''s secession and the UN force; Lumumba in Washington; the plot against him; his dismissal, Mobutu, his capture; his death; Rumpunch; Hammarskjöld''s death; U Thant; Kitona; Elisabethville.'
    c2: 'The Congo from independence: its civil wars, and the UN''s war in Katanga. The end of secession; the pilots in Kivu; the UN''s departure; Tshombe prime minister; Stanleyville to the Simbas; the NSC for Tshombe''s mercenaries; Dragon Rouge; the Cairo embassy attacked; Mobutu''s coup.'
    c3: 'The Congo from independence: its civil wars, and the UN''s war in Katanga. The mercenaries'' mutiny; the C-130s and the Senators'' protests; the Republican Senators'' letter; the CIA-paid pilots.'
