    c2: Unemployment, depressed areas, and wages. Youth employment; area redevelopment's 1963 defeat; the 1964 Manpower Report; the Appalachian bill in the Senate; the longshoremen; the Appalachian act; the area-development message; the public works act; 14(b) refused cloture; New York's transit strike.
  - id: cal.thread.robert-kennedy
