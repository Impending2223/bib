  - id: cal.thread.missile-crisis
    s: Cuban Missile Crisis
    c: The Soviet missiles in Cuba, from the decision to the aftermath. The Presidium's plan; the summer warnings; the U-2's find; the ExComm; the quarantine; the letters; the withdrawal; the IL-28s; the Stevenson story.
    c2: The Soviet missiles in Cuba, from the decision to the aftermath. The joint letter to U Thant; McNamara's photographs; the Soviet troops.
  - id: cal.thread.cyprus
    s: Cyprus
    c: 'Cyprus: the republic, its two communities, the guarantor powers. Independence; NSAM 71; NSAM 98; Makarios at the White House; NSAM 169; Johnson at Nicosia.'
    c2: 'Cyprus: the republic, its two communities, the guarantor powers. NSAM 266; Makarios''s thirteen amendments; the Nicosia fighting; the guarantors'' appeal; Cyprus to the Security Council; the London conference broken down; Ball''s mission; the UN force; Johnson to Inonu; Inonu and Papandreou at the White House; Acheson''s plans at Geneva; the Turkish strikes at Kokkina; the plans refused.'
    c3: 'Cyprus: the republic, its two communities, the guarantor powers. Demirel to Rusk at Ankara; the National Guard at Ayios Theodoros and Kophinou; Vance''s mission; the withdrawals agreed; Johnson''s statement.'
