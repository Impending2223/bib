  - id: cal.thread.africa
    s: Africa
    c: Africa apart from the Congo. Sharpeville and the Security Council; the colonial declaration; Williams's "Africa for the Africans"; Angola at the UN; Mohamed V dies; Nkrumah and the Volta dam; Bizerte; the Moroccan bases; Évian, Algeria independent; Ben Bella at the White House and in Havana; the General Assembly's sanctions on South Africa.
    c2: Africa apart from the Congo. Olympio killed; NSAM 221 on Algeria; the Addis Ababa conference; Portugal's territories at the Security Council; the arms embargo on South Africa; the Algerian–Moroccan war; the Moroccan bases handed over; Zanzibar; Wheelus; Rivonia; Ben Bella deposed; Rhodesia's declaration.
    c3: Africa apart from the Congo. Nigeria's coups; Nkrumah overthrown; the *Joanna V*; Robert Kennedy in South Africa; South West Africa at the Court and the UN; the Korry report; the *Tiger* talks and the mandatory sanctions; Rhodesia's sanctions by executive order; Biafra's secession; Humphrey's tour; the appeal on Nigeria; the Addis Ababa talks.
