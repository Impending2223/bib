  - id: cal.thread.voting-rights
    s: Voting rights
    c: Voting rights in Congress and the field. Wilkins put off by Nixon; the referee plan, the filibuster, cloture refused, the Civil Rights Act of 1960; *Raines*; *Gomillion*; Robert Kennedy for registration over demonstrations; the Voter Education Project ratified and begun; McComb and Walthall County; the poll tax amendment through Congress; the literacy-test filibuster; Fannie Lou Hamer at Ruleville.
    c2: Voting rights in Congress and the field. Greenwood; the referees asked; the Freedom Vote; Hattiesburg's Freedom Day; the Twenty-fourth Amendment ratified; Selma in the summer of 1964; King's Nobel, and his visit to Johnson; Selma, Marion, Bloody Sunday; "The American Promise"; *Louisiana v. United States*; the march to Montgomery; the bill through the Senate and the House; the Voting Rights Act; its first examiners; Mississippi's and Alabama's tests repealed.
    c3: Voting rights in Congress and the field. The Texas poll tax void and replaced; *South Carolina v. Katzenbach*; *Harper*; the Alabama primary; *Katzenbach v. Morgan*; the poll tax repealed in Texas and Nevada, the vote at eighteen refused in Michigan; the Sunflower election; Hatcher at Gary; Mississippi's election; Reid in Virginia; the vote at eighteen heard and asked; the Loyal Democrats seated at Chicago.
  - id: cal.thread.voting-rights-selma
    s: Selma
    parent: voting-rights
  - id: cal.thread.welfare
    s: Welfare
    c: Public assistance and Social Security. Kerr–Mills; Flemming's Louisiana ruling; aid to children of the unemployed; Newburgh's thirteen points and the court's order; the Social Security Amendments of 1961; the Public Welfare Amendments of 1962; Texas's ceiling on aid raised.
    c2: Public assistance and Social Security. Texas's ceiling raised again; the House's Social Security bill of 1964; Medicare through Ways and Means and both Houses; the Howard University address; the Older Americans Act; the Social Security Amendments of 1965 at Independence; Gallup on a guaranteed income; Texas joins the federal programs.
    c3: Public assistance and Social Security. Medi-Cal; Medicaid's first States, New York's law; the Child Nutrition Act; the older Americans message; the Social Security Amendments of 1967, through the House, the Senate and conference, signed at the Ranch; *Morris v. Williams*; *King v. Smith*; Gallup on a guaranteed income.
  - id: cal.thread.women
    s: Women
    c: The status of women in law and policy. The equal rights amendment in the Senate; the President's Commission; the Attorney General's opinion on appointments by sex, and the directive.
    c2: The status of women in law and policy. *The Feminine Mystique*; the Equal Pay Act; *American Women*; "sex" in Title VII; the equal rights amendment reported.
    c3: The status of women in law and policy. New York's divorce law; Colorado's and California's abortion laws; "sex" in the equal opportunity order; the women officers' act; the Jeannette Rankin Brigade; the Women Doers' Luncheon; the Miss America pageant picketed.
