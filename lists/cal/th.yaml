  - id: cal.thread.antisubversion
    s: Antisubversion
    c: The States' committees, laws and oaths against subversion, and the Subversive Activities Control Board. Mississippi's Sovereignty Commission and the Citizens' Council; the Burns committee's report; Proposition 24 refused.
    c2: The States' committees, laws and oaths against subversion, and the Subversive Activities Control Board. North Carolina's Speaker Ban; Alabama's Sovereignty Commission; the raid on the SCEF at New Orleans; the Johns Committee's report and end; *Baggett v. Bullitt*; the Speaker Ban amended.
    c3: The States' committees, laws and oaths against subversion, and the Subversive Activities Control Board. *Keyishian*; the Board kept, registration dropped; California's disclaimer oath struck; *Schneider v. Smith*; the Ichord subcommittee on the Chicago convention.
  - id: cal.thread.testing
    s: Arms control and testing
    c: Arms control and nuclear testing. The threshold proposal; France's first test; the Ten-Nation Committee; the moratorium declaration; the Antarctic Treaty; the Soviet resumption; American tests underground; ACDA; the fifty megatons; atmospheric tests resumed; Geneva; Starfish Prime; Khrushchev's inspection offer.
    c2: Arms control and nuclear testing. The inspection talks; American University; the hot line; Moscow; the treaty and the Senate's consent; the Geneva proposals; the cut in fissionable material; China's test; the Gilpatric committee on proliferation.
    c3: Arms control and nuclear testing. China's third test; nonproliferation with Gromyko; China's hydrogen bomb; the nonproliferation drafts at Geneva; Boxcar; the treaty commended, signed, sent to the Senate; Kosygin on strategic arms; MIRV tested; France's hydrogen bomb; the Senate's delay.
