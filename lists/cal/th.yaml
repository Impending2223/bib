  - id: cal.thread.school-aid
    s: School aid
    c: The administration's first major defeat, and the college bill lost in 1962.
  - id: cal.thread.space
    s: Space
    c: Gagarin to Houston; Glenn, Rice, Mariner.
  - id: cal.thread.states-and-cities
