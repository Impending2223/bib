    c2: 'Health policy other than Medicare: drugs, mental health, the health professions. The mental health and retardation message and acts; maternal and child health; health professions; *Smoking and Health*; the DeBakey commission; the cigarette labeling act; heart disease, cancer, and stroke.'
  - id: cal.thread.immigration
    s: Immigration
