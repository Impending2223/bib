    s: Districting and apportionment
    c: 'The apportionment of seats and the drawing of districts, for Congress and the State legislatures: the census, the courts, the legislatures, the voters. The 1960 census and the House reapportioned; reapportionment refused at the polls in California and Oklahoma; New York''s congressional districts; *Gomillion v. Lightfoot*; *Baker v. Carr*; special sessions in Tennessee, Alabama, Georgia and Maryland; the courts in Michigan, Oklahoma, Florida and Virginia; the commission''s report.'
    c2: 'The apportionment of seats and the drawing of districts, for Congress and the State legislatures: the census, the courts, the legislatures, the voters. Florida''s special session; Kerner''s veto and Illinois''s at-large House; the court''s plan for Oklahoma; Iowa''s Shaff plan refused; *Wesberry v. Sanders*, and the House districts struck in Texas, Kansas, Missouri and Arkansas; *Reynolds v. Sims* and its companions; Tuck''s bill and the Dirksen–Mansfield rider; the courts redraw the legislatures from Vermont to Nebraska; New York''s plans; Connecticut''s convention and constitution; Dirksen''s amendment; *Sims v. Baggett*; California''s reapportionment.'
    c3: 'The apportionment of seats and the drawing of districts, for Congress and the State legislatures: the census, the courts, the legislatures, the voters. *Swann*; New York''s court-drawn districts; *Burns v. Richardson*; Dirksen''s amendment again; *Connor v. Johnson*; Oklahoma''s congressional districts refused; New Jersey''s apportionment article; Florida''s third plan struck; Pennsylvania''s convention; *Avery v. Midland County*; thirty-two applications for an apportionment convention.'
