  - id: cal.thread.conservation
    s: Conservation
    c: Public lands, wilderness, and pollution. The water-pollution veto; California's water bonds; the natural resources message; Cape Cod; the wilderness bill through the Senate; the Delaware compact; the conservation message and the Bureau of Outdoor Recreation; the White House conference; the western dams; *Silent Spring*; Point Reyes and Padre Island.
