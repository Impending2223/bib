  - id: cal.thread.assassination
    s: Assassination
    c: Kennedy killed at Dallas, and the inquiry. The Texas trip planned; Dealey Plaza; Oswald shot by Ruby; the funeral; the Warren Commission named; its first meeting; Marina Oswald, the first witness; Ruby convicted; the Report; the hearings published.
    c3: Kennedy killed at Dallas, and the inquiry. The Manchester suit and its settlement; Ruby's death; Garrison's inquiry at New Orleans, Ferrie's death, Shaw's arrest and indictment; Robert Kennedy shot at Los Angeles; the Violence Commission.
