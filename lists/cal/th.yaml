# Cal. I Threads
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: I
entries:
  - id: cal.thread.alabama
    s: Alabama
    c: 'Alabama under Wallace, 1963: Birmingham and the schools. Wallace''s inaugural; the Birmingham campaign, April–May; the schoolhouse door; the schools in September; the Sixteenth Street church.'
  - id: cal.thread.albany
    s: Albany
    c: SNCC and King against segregation in Albany, Georgia, Nov. 1961–Aug. 1962. The station test; the Albany Movement; King jailed, December and July; Elliott's injunction; King leaves.
  - id: cal.thread.assassination
    s: Assassination
    c: Kennedy killed at Dallas, and the inquiry. Nov. 22; Oswald killed; the funeral; the Warren Commission.
  - id: cal.thread.berlin-and-vienna
    s: Berlin and Vienna
    c: 'The second Berlin crisis, from the Vienna ultimatum to the wall and after. Vienna; the July buildup; Aug. 13; Clay in Berlin; Checkpoint Charlie; Powers for Abel; Fechter; Kennedy in Berlin.'
  - id: cal.thread.baker
    s: Bobby Baker
    c: 'The Senate majority''s secretary and the Rules Committee''s inquiry. Resignation, Oct. 7; Reynolds before the committee''s staff.'
  - id: cal.thread.cities-and-housing
    s: Cities and housing
    c: 'Housing, the cities, and urban transit. The Housing Act of 1961; the Urban Affairs department refused, by Rules and by the House; Weaver; mass transit.'
  - id: cal.thread.civil-rights-bill
    s: Civil rights bill
    c: 'The civil rights bill from Kennedy''s address to the discharge petition. June 11; the message of June 19; the leaders at the White House; the Senate hearings; Judiciary''s bill, Oct. 29; Johnson''s joint session; the petition.'
  - id: cal.thread.civil-rights-the-executive
    s: 'Civil rights: the executive'
    c: 'What the President did for civil rights by appointment and order. Weaver; the equal employment committee; the new judgeships, Cox and Marshall; the housing order; the Commission''s century report; Baldwin; the apprenticeship order; Cambridge; the Gesell committee and McNamara''s directive.'
  - id: cal.thread.confirmations
    s: Confirmations
    c: 'Nominations the Senate divided on by roll call. Meriwether; Holmes; the Power Commission; Robinson; McCone; McCloskey; Marshall to the Second Circuit; the satellite incorporators.'
  - id: cal.thread.congo
    s: Congo
    c: The Congo's civil war and the UN's war in Katanga. Lumumba's death; Rumpunch; Hammarskjöld's death; U Thant; Kitona; Elisabethville and the end of secession.
  - id: cal.thread.congress
    s: Congress
    c: 'Congress as an institution: its leaders and sessions. Rayburn''s death; McCormack Speaker; the 87th''s end, Jan. 3, 1963; the 88th''s opening; Clark''s Senate establishment; the first session''s end, Dec. 30, 1963.'
  - id: cal.thread.conservation
    s: Conservation
    c: 'Public lands, wilderness, and pollution. The wilderness bill; the conservation tour; the Clean Air Act.'
  - id: cal.thread.court
    s: Court
    c: 'The Supreme Court''s October 1960, 1961 and 1962 Terms, and its new Justices. *Mapp*; *Baker v. Carr*, argued, reargued, decided; *Engel v. Vitale*; White and Goldberg for Whittaker and Frankfurter; *Gideon*; *Gray v. Sanders*; the sit-in cases; *Schempp*.'
  - id: cal.thread.crime-and-hijacking
    s: Crime and hijacking
    c: Robert Kennedy's crime bills and the first hijackings to Cuba. Three hijackings, May–Aug. 1961; aircraft piracy a federal crime; the Wire and Travel Acts.
  - id: cal.thread.cuba
    s: Cuba
    c: 'Cuba short of the missile crisis, and after. The Bay of Pigs and its inquiry; Mongoose; Punta del Este; the embargo; Northwoods; the prisoners'' ransom; the Orange Bowl; NSAM 213; the exile raids; the sabotage program; Attwood and Lechuga.'
  - id: cal.thread.defense
    s: Defense
    c: 'Strategy and the defense budget under McNamara. No missile gap; the March budget; the Berlin increase; civil defense to the Pentagon; Gilpatric at Hot Springs; the RS-70; counterforce at Ann Arbor; the TFX hearings; the draft extended; *Thresher*; Anderson and Korth out.'
  - id: cal.thread.economy
    s: Economy
    c: 'The recession of 1960–61, the recovery, and the tax cut. The task force; the trough; the Fed''s long rates; the gap; the debt limit; the 1962 Report; the May slide; depreciation; the investment credit; the Economic Club; the tax message; the House''s 271–155; the interest equalization tax; Johnson''s budget.'
  - id: cal.thread.elections-1962
    s: Elections of 1962
    c: The primaries and midterms of 1962. Connally and Wallace; Nixon in California; Edward Kennedy against McCormack; Nov. 6; Nixon's last press conference.
  - id: cal.thread.elections-1964
    s: Elections of 1964
    c: The race for the 1964 nominations in its first year. Rockefeller; the Goldwater draft; Goldwater announces.
  - id: cal.thread.europe-and-the-alliance
    s: Europe and the alliance
    c: 'Britain, Europe, and the alliance''s nuclear arms. Bermuda; the Declaration of Interdependence; Skybolt cancelled; Nassau; de Gaulle''s veto; the Élysée treaty; the MLF; Kennedy in Europe; Erhard at the Ranch.'
  - id: cal.thread.farm
    s: Farm
    c: 'Price supports and production controls. The emergency feed grain program; the farm bill''s defeat and the 1962 act; the wheat referendum; the Feed Grain Act of 1963.'
  - id: cal.thread.foreign-aid
    s: Foreign aid
    c: 'The aid program remade, and cut. The March message; AID created, long-term borrowing denied; the 1962 act and the Hickenlooper amendment; the Clay report; the 1963 cuts; the Christmas Eve vote.'
  - id: cal.thread.freedom-rides
    s: Freedom Rides
    c: CORE's rides to test *Boynton*, May 1961, and the ICC order that came of them. Anniston; Montgomery; Jackson and Parchman; the petition; the order, in force Nov. 1.
  - id: cal.thread.health
    s: Health
    c: 'Health policy other than Medicare: drugs, mental health, the health professions. Thalidomide and Kelsey; the Drug Amendments; the mental health and retardation message and acts; maternal and child health; health professions.'
  - id: cal.thread.immigration
    s: Immigration
    c: 'The national-origins quotas and their repeal. The 1963 message.'
  - id: cal.thread.india-and-china
    s: India and China
    c: India's wars, and American arms for India. Goa; the Chinese attack of October 1962; Nehru's request; Harriman's mission.
  - id: cal.thread.jobs-and-wages
    s: Jobs and wages
    c: 'Unemployment, depressed areas, and wages. The recovery message; the minimum wage; area redevelopment and its 1963 defeat; manpower training; public works acceleration; youth employment; federal employees'' unions.'
  - id: cal.thread.laos
    s: Laos
    c: 'The Laos crisis, from Eisenhower''s warning to the Geneva accords and after. The March maps; the cease-fire; the conference; Nam Tha; troops to Thailand; the coalition; the neutrality declaration; the Plain of Jars, April 1963; Harriman in Moscow.'
  - id: cal.thread.latin-america
    s: Latin America
    c: 'The Alliance for Progress and the hemisphere''s governments. The Alliance proposed; Trujillo killed, his family out; Punta del Este, 1961 and 1962; Goulart; coups in Argentina and Peru; Kennedy in Caracas, Bogotá, Mexico City; Bosch elected; San José; Chamizal; Bosch ousted; the Honduran coup.'
  - id: cal.thread.march-on-washington
    s: March on Washington
    c: The March on Washington for Jobs and Freedom, Aug. 28, 1963.
  - id: cal.thread.medicare
    s: Medicare
    c: 'Hospital insurance for the aged through Social Security. The 1961 bill; the 1962 message; the Garden rally; the Senate''s 52–48; the 1963 message.'
  - id: cal.thread.missile-crisis
    s: Missile crisis
    c: 'The Soviet missiles in Cuba, from the decision to the aftermath. The Presidium''s plan; the summer warnings; the U-2''s find; the ExComm; the quarantine; the letters; the withdrawal; the IL-28s; the Stevenson story; the joint letter to U Thant; McNamara''s photographs; the Soviet troops.'
  - id: cal.thread.mississippi
    s: Mississippi
    c: 'The movement in Mississippi, Meredith''s admission, and Evers. McComb; Herbert Lee; the Fifth Circuit''s order; Barnett''s refusals; the calls; Oxford; Greenwood; the Commission''s report; Jackson; Evers killed.'
  - id: cal.thread.opinion
    s: Opinion
    c: 'The public''s view, by Gallup. Approval from the first reading through the missile crisis; the Bay of Pigs high; the Freedom Riders; the low of September 1963.'
  - id: cal.thread.peace-corps
    s: Peace Corps
    c: The Peace Corps, from order to statute. The executive order; Ghana; the act; the Ibadan postcard.
  - id: cal.thread.press-and-broadcasting
    s: Press and broadcasting
    c: 'The President and the press, and broadcasting''s regulators. The live press conference; the publishers'' speech; Minow''s wasteland; the White House tour; the *Herald Tribune* cancelled; Sylvester''s right to lie; the newspaper strike and its end; "After Two Years."'
  - id: cal.thread.program
    s: Program
    c: 'The President''s program as a whole: the State of the Union messages and the agenda they set; what falls under no field''s thread. Fulbright–Hays.'
  - id: cal.thread.railroads
    s: Railroad work rules
    c: 'The railroad work-rules dispute: firemen on diesels. The Presidential Railroad Commission; the strike deadlines; arbitration by statute.'
  - id: cal.thread.right-and-the-military
    s: Right and the military
    c: 'The radical right and the officers who spoke for it. The Birch Society; Walker relieved, admonished, resigned; Fulbright''s memorandum; the crusades; the Seattle and Los Angeles speeches; the muzzling hearings; Walker at Oxford; Stevenson in Dallas.'
  - id: cal.thread.rules
    s: Rules
    c: 'Majority rule in each chamber. The Rules Committee enlarged, then kept at fifteen; Rule XXII kept; Rayburn''s absence; cloture refused on the literacy test, invoked on the satellite bill; the three-fifths rule refused, 1963.'
  - id: cal.thread.school-aid
    s: School aid
    c: 'Federal aid to education, from the first great defeat to the acts of 1963. The 1961 message; the Rules Committee''s 8–7; Calendar Wednesday refused; the college bill recommitted; the omnibus bill; the college facilities and vocational acts.'
  - id: cal.thread.space
    s: Space
    c: 'The space race and the moon program. Gagarin; the Space Council; Shepard; the moon message; Grissom, Titov, Glenn, Carpenter, Schirra; Houston; Telstar; Rice Stadium; the moon first; Mariner 2; Cooper; the joint expedition offered; Cape Kennedy.'
  - id: cal.thread.specials
    s: Special elections
    c: 'The special elections that filled seats in the 87th and 88th Congresses. Johnson''s Senate seat to Tower; twelve House seats, three to widows; six House seats in 1963.'
  - id: cal.thread.states-and-cities
    s: States and cities
    c: 'State and city politics. The Twenty-Third Amendment; Tower; Yorty; Atlanta''s schools; Wagner against Tammany; Michigan''s convention and Romney; the elections of 1961; Gantt at Clemson; the elections of 1963.'
  - id: cal.thread.steel
    s: Steel
    c: 'Steel prices and the guideposts. The letter of September 1961; the early settlement; the April price rise and its rescission; the selective increases of 1963.'
  - id: cal.thread.succession
    s: Succession
    c: 'Johnson''s first weeks. The oath; the joint session; the Kennedy program; the budget.'
  - id: cal.thread.testing
    s: Testing
    c: 'Nuclear testing and arms control. The Soviet resumption; American tests underground; ACDA; the fifty megatons; atmospheric tests resumed; Geneva; Starfish Prime; Khrushchev''s inspection offer; American University; the hot line; Moscow; the treaty and the Senate''s consent.'
  - id: cal.thread.trade
    s: Trade
    c: 'Trade, from the Trade Expansion Act to the wheat sale. The House and Senate votes; Herter named; the new tariff schedules; Canada''s wheat sale; the American sale and Mundt''s bill.'
  - id: cal.thread.transition-and-staff
    s: Transition and staff
    c: 'The administration''s people and organization. The cabinet; the NSC remade; the back injury; Taylor at the White House; McCone for Dulles; the Thanksgiving reshuffle; Joseph Kennedy''s stroke; Hoover''s lunch; Taylor to the Joint Chiefs; Gronouski for Day.'
  - id: cal.thread.vietnam
    s: Vietnam
    c: 'The deepening commitment in Vietnam. The counterinsurgency plan; Johnson''s trip; NSAM 52; Staley; Taylor–Rostow; NSAM 111; helicopters and the first dead; MACV; strategic hamlets; Galbraith''s dissent; McNamara''s visits; Mansfield''s report; Ap Bac; the Buddhist crisis; Lodge; cable 243; McNamara–Taylor; the coup; NSAM 273.'
  - id: cal.thread.voting-rights
    s: Voting rights
    c: 'Voting rights in Congress and the field. The poll tax amendment and its ratification; the Voter Education Project; the literacy-test filibuster; the referees asked.'
  - id: cal.thread.welfare
    s: Welfare
    c: 'Public assistance and Social Security. Aid to children of the unemployed; the Social Security Amendments of 1961; the Public Welfare Amendments of 1962.'
  - id: cal.thread.women
    s: Women
    c: 'The status of women in law and policy. The President''s Commission; *The Feminine Mystique*; the Equal Pay Act; *American Women*.'
