  - id: cal.thread.antisubversion
    s: Antisubversion
    c: 'The committees, laws, oaths and prosecutions against subversion: the States'' committees and acts, the Subversive Activities Control Board, the Bureau''s lists. Mississippi''s Sovereignty Commission and the Citizens'' Council; the Burns committee''s report; Robert Kennedy on prosecuting the Communist Party; King on the Bureau''s emergency list; its investigation of King and the SCLC; Proposition 24 refused.'
    c2: 'The committees, laws, oaths and prosecutions against subversion: the States'' committees and acts, the Subversive Activities Control Board, the Bureau''s lists. Alabama''s Commission to Preserve the Peace; North Carolina''s Speaker Ban; Alabama''s Sovereignty Commission; the raid on the SCEF at New Orleans; the Johns Committee''s report and end; *Baggett v. Bullitt*; the Speaker Ban amended.'
    c3: 'The committees, laws, oaths and prosecutions against subversion: the States'' committees and acts, the Subversive Activities Control Board, the Bureau''s lists. *Keyishian*; Robert Kennedy against the Board; the Board kept, registration dropped; California''s disclaimer oath struck; *Schneider v. Smith*; the Ichord subcommittee on the Chicago convention.'
  - id: cal.thread.testing
    s: Arms control and testing
    c: Arms control and nuclear testing. The threshold proposal; France's first test; the Ten-Nation Committee; the Antarctic Treaty; the Soviet resumption; American tests underground; ACDA; the fifty megatons; atmospheric tests resumed; the Eighteen-Nation Committee; Starfish Prime; Khrushchev's inspection offer.
    c2: Arms control and nuclear testing. Cousins's report from Khrushchev; NSAM 239; American University; the hot line; Moscow; the treaty, the hearings, the Senate's consent; the Geneva proposals; the cut in fissionable material; China's test; the Gilpatric committee on proliferation; NSAM 335.
    c3: Arms control and nuclear testing. China's third test; nonproliferation with Gromyko; China's hydrogen bomb; the nonproliferation drafts at Geneva; Boxcar; the treaty commended, signed, sent to the Senate; Kosygin on strategic arms; MIRV tested; the talks put off by Czechoslovakia; France's hydrogen bomb; the Senate's delay; Johnson to Nixon on the talks.
