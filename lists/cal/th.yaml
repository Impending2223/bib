    s: Program
    c: 'The recession bills: unemployment, feed grains, minimum wage, area redevelopment, housing, Social Security. Then manpower training, welfare, urban affairs, the farm bill, public works, the drug amendments.'
  - id: cal.thread.right-and-the-military
    s: Right and the military
    c: The Birch Society, Walker, Fulbright's memorandum, the crusades, the muzzling hearings.
  - id: cal.thread.rules
    s: Rules
