    c2: Hospital insurance for the aged through Social Security. The 1963 message; the 1964 message; the House bill without it; the Senate's Gore amendment; the conference deadlocked; the 1965 message; Mills's bill; the House; the Senate; Medicare and Medicaid signed at Independence, July 30, 1965.
