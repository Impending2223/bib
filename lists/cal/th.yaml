    c2: India's wars, American arms for India, and South Asia and Indonesia. Nehru's death; the Rann of Kutch; the Indo-Pakistani war and the cease-fire; Indonesia's coup; Ayub Khan in Washington; Tashkent.
  - id: cal.thread.japan-and-korea
    s: Japan and Korea
    c: The alliances with Japan and South Korea. The security treaty signed; Rhee's fall; the Diet's vote and the riots; Hagerty mobbed and the visit cancelled; the Senate's consent; Kishi out, Ikeda in; Chang Myon's government.
  - id: cal.thread.jobs-and-wages
