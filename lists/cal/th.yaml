  - id: cal.thread.students
    s: Students
    c: College and university students in politics. The HUAC hearings at San Francisco; the peace pickets at the White House; Port Huron.
    c2: College and university students in politics. Tougaloo's sit-in; Freedom Summer's volunteers; Berkeley, the police car and Sproul Hall; the teach-ins; SDS's march; Vietnam Day; the draft-card law; the Days of Protest; Morrison; SANE's march; SNCC against the war.
  - id: cal.thread.succession
    s: Succession
    c: Johnson's first weeks, and the succession amended. The oath; the joint session; the Kennedy program; the budget; the disability amendment in the Senate; the disability message; the Twenty-fifth Amendment through Congress; Johnson's surgery.
  - id: cal.thread.testing
    s: Testing
    c: Nuclear testing and arms control. The threshold proposal; France's first test; the Ten-Nation Committee; the moratorium declaration; the Antarctic Treaty; the Soviet resumption; American tests underground; ACDA; the fifty megatons; atmospheric tests resumed; Geneva; Starfish Prime; Khrushchev's inspection offer.
    c2: Nuclear testing and arms control. American University; the hot line; Moscow; the treaty and the Senate's consent; the Geneva proposals; the cut in fissionable material; China's test; the Gilpatric committee on proliferation.
  - id: cal.thread.trade
    s: Trade
    c: Trade, from the Trade Expansion Act to the wheat sale. The OECD convention; the House and Senate votes; Herter named.
    c2: Trade, from the Trade Expansion Act to the wheat sale. The new tariff schedules; Canada's wheat sale; the American sale and Mundt's bill; the longshoremen's boycott; the Kennedy Round opens; the automotive agreement.
  - id: cal.thread.transition-and-staff
    s: Transition and staff
    c: The administration's people and organization. The first appointments; Key Biscayne; the cabinet named; the NSC remade; the back injury; Taylor at the White House; McCone for Dulles; the Thanksgiving reshuffle; Joseph Kennedy's stroke; Hoover's lunch; Taylor to the Joint Chiefs.
    c2: The administration's people and organization. Gronouski for Day; Sorensen leaves; Shriver; Hoover kept past seventy; Robert Kennedy resigns; Heller and Hodges go; the inauguration, Jan. 20, 1965; Katzenbach; Fowler for Dillon; Raborn for McCone; Stevenson's death; O'Brien and Gronouski.
  - id: cal.thread.vietnam
    s: Vietnam
    c: The deepening commitment in Vietnam. Tây Ninh; the Caravelle petition; the Party's Third Congress; Durbrow's démarche; the paratroop coup; the National Liberation Front; the counterinsurgency plan; Johnson's trip; NSAM 52; Staley; Taylor–Rostow; NSAM 111; helicopters and the first dead; MACV; strategic hamlets; Galbraith's dissent; McNamara's visits; Mansfield's report; Ấp Bắc.
    c2: The deepening commitment in Vietnam. Mansfield's report published; the Buddhist crisis; Lodge; cable 243; McNamara–Taylor; the coup; NSAM 273; Khánh's coup; NSAM 280; McNamara–Taylor and NSAM 288; Honolulu; Seaborn; Taylor for Lodge; the Gulf of Tonkin, Aug. 2 and 4; Pierce Arrow; the resolution; Vũng Tàu; NSAM 314; Akron; the High National Council; Biên Hòa; Bundy's working group; the December decisions; the Brink Hotel; Bundy's report; Pleiku and Flaming Dart; Rolling Thunder; Đà Nẵng; NSAM 328; Johns Hopkins; the 173d; the May pause; Westmoreland's request; the B-52s; July 28; Starlite; Ia Drang; the pause and the peace offensive.
  - id: cal.thread.voting-rights
    s: Voting rights
    c: Voting rights in Congress and the field. The referee plan, the filibuster, cloture refused, the Civil Rights Act of 1960; *Raines*; *Gomillion*; the poll tax amendment through Congress; the Voter Education Project; the literacy-test filibuster.
    c2: Voting rights in Congress and the field. The referees asked; the Twenty-fourth Amendment ratified; King's Nobel; Selma, Marion, Bloody Sunday; "The American Promise"; the bill through the Senate and the House; the Voting Rights Act, Aug. 6, 1965; its first examiners.
  - id: cal.thread.welfare
    s: Welfare
    c: Public assistance and Social Security. Kerr–Mills; aid to children of the unemployed; the Social Security Amendments of 1961; the Public Welfare Amendments of 1962.
    c2: Public assistance and Social Security. The Social Security bills of 1964 and 1965; the Older Americans Act.
  - id: cal.thread.women
    s: Women
    c: The status of women in law and policy. The President's Commission.
    c2: The status of women in law and policy. *The Feminine Mystique*; the Equal Pay Act; *American Women*; "sex" in Title VII.
