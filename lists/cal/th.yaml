# Cal. I Threads
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: I
entries:
  - id: cal.thread.alabama
    s: Alabama
    c: 'Alabama under Wallace, 1963: Birmingham and the schools. Wallace''s inaugural; the Birmingham campaign, April–May; the schoolhouse door; the schools in September; the Sixteenth Street church; Judge Johnson''s order and the march to Montgomery; Liuzzo; the Hayneville trials, Daniels''s killing.'
  - id: cal.thread.albany
    s: Albany
    c: SNCC and King against segregation in Albany, Georgia, Nov. 1961–Aug. 1962. The station test; the Albany Movement; King jailed, December and July; Elliott's injunction; King leaves.
  - id: cal.thread.assassination
    s: Assassination
    c: Kennedy killed at Dallas, and the inquiry. Nov. 22; Oswald killed; the funeral; the Warren Commission; the first witness; Ruby convicted; the Report; the hearings published.
  - id: cal.thread.baker
    s: Bobby Baker
    c: The Senate majority's secretary and the Rules Committee's inquiry. Resignation, Oct. 7; Reynolds before the committee's staff; Johnson's statement; the Williams resolution tabled; the Select Committee on Standards and Conduct; the inquiry reopened.
  - id: cal.thread.berlin-and-vienna
    s: Berlin and Vienna
    c: The second Berlin crisis, from the Vienna ultimatum to the wall and after. Vienna; the July buildup; Aug. 13; Clay in Berlin; Checkpoint Charlie; Powers for Abel; Fechter; Kennedy in Berlin.
  - id: cal.thread.black-nationalism
    s: Black nationalism
    c: 'Malcolm X and the Nation of Islam. The "chickens" remark and the suspension; the break; "The Ballot or the Bullet"; the Organization of Afro-American Unity; the assassination.'
  - id: cal.thread.cities-and-housing
    s: Cities and housing
    c: Housing, the cities, and urban transit. The Housing Act of 1961; the Urban Affairs department refused, by Rules and by the House; Weaver; mass transit; the 1964 message; the Urban Mass Transportation Act; the Housing Act of 1964; Proposition 14; the 1965 message; HUD through the House; the Housing and Urban Development Act of 1965; the Department created; rent supplements.
  - id: cal.thread.civil-rights-bill
    s: Civil rights bill
    c: The civil rights bill from Kennedy's address to the Act and its first year. June 11; the message of June 19; the leaders at the White House; the Senate hearings; Judiciary's bill, Oct. 29; Johnson's joint session; the petition; Smith's hearings; the House, 290–130; the Senate takes it up; the filibuster; the Dirksen–Mansfield substitute; cloture, 71–29; the Senate, 73–27; the Act, July 2; Title II tested; the Community Relations Service; Title VI's regulations.
  - id: cal.thread.civil-rights-organizations
    s: Civil rights organizations
    c: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Farmer to CORE; Highlander; Greenberg and Young; the Albany Movement; COFO revived; the Voter Education Project; Lewis SNCC''s chairman; the Council for United Civil Rights Leadership; the leaders at the White House; the Freedom Democratic Party; the moratorium; the compromise refused; Waveland; CORE at Durham; McKissick; SNCC against the war.'
  - id: cal.thread.civil-rights-the-executive
    s: 'Civil rights: the executive'
    c: What the President did for civil rights by appointment and order. Weaver; the equal employment committee; the new judgeships, Cox and Marshall; the housing order; the Commission's century report; Baldwin; the apprenticeship order; Cambridge; the Gesell committee and McNamara's directive; Hoover on King; the Council on Equal Opportunity; the Klan arrests; Howard University; Executive Order 11246; "To Fulfill These Rights".
  - id: cal.thread.confirmations
    s: Confirmations
    c: Nominations the Senate divided on by roll call. Meriwether; Holmes; the Power Commission; Robinson; McCone; McCloskey; Marshall to the Second Circuit; the satellite incorporators.
  - id: cal.thread.congo
    s: Congo
    c: The Congo's civil war and the UN's war in Katanga. Lumumba's death; Rumpunch; Hammarskjöld's death; U Thant; Kitona; Elisabethville and the end of secession; the UN's departure; Tshombe prime minister; Stanleyville taken; Dragon Rouge.
  - id: cal.thread.congress
    s: Congress
    c: 'Congress as an institution: its leaders and sessions. Rayburn''s death; McCormack Speaker; the 87th''s end, Jan. 3, 1963; the 88th''s opening; Clark''s Senate establishment; the first session''s end, Dec. 30, 1963; the pay bill defeated, then passed; Edward Kennedy''s crash; Engle''s death; the 88th''s end, Oct. 3, 1964; the caucus; the 89th''s opening; Ford for Halleck; Watson leaves; the Joint Committee on the Organization of the Congress; the first session''s end, Oct. 23, 1965; Byrd resigns; the second session, Jan. 10, 1966.'
  - id: cal.thread.conservation
    s: Conservation
    c: 'Public lands, wilderness, and pollution. The wilderness bill; the conservation tour; the Clean Air Act; the Wilderness Act and the Land and Water Conservation Fund; natural beauty: the message, the conference; the Water Quality Act; the air pollution and solid waste acts; the Highway Beautification Act.'
  - id: cal.thread.court
    s: Court
    c: The Supreme Court's October 1960 to October 1965 Terms, its new Justices, and Congress's answers. *Mapp*; *Baker v. Carr*, argued, reargued, decided; *Engel v. Vitale*; White and Goldberg for Whittaker and Frankfurter; *Gideon*; *Gray v. Sanders*; the sit-in cases; *Schempp*; *Wesberry*; *New York Times v. Sullivan*; *Griffin*; *Reynolds v. Sims*; *Bell*, *Escobedo*; the Tuck bill and the Dirksen rider; *Heart of Atlanta*; *Louisiana v. United States*; *Zemel*; *Lamont*; *Griswold*; Goldberg to the UN, Fortas for him; Dirksen's apportionment amendment; *Albertson*.
  - id: cal.thread.crime-and-hijacking
    s: Crime and hijacking
    c: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. Three hijackings, May–Aug. 1961; aircraft piracy a federal crime; the Wire and Travel Acts; Hoffa convicted; the 1965 crime message; the Crime Commission; the Law Enforcement Assistance Act.
  - id: cal.thread.cuba
    s: Cuba
    c: Cuba short of the missile crisis, and after. The Bay of Pigs and its inquiry; Mongoose; Punta del Este; the embargo; Northwoods; the prisoners' ransom; the Orange Bowl; NSAM 213; the exile raids; the sabotage program; Attwood and Lechuga; Guantanamo's water; Camarioca and the refugee airlift.
  - id: cal.thread.defense
    s: Defense
    c: Strategy and the defense budget under McNamara. No missile gap; the March budget; the Berlin increase; civil defense to the Pentagon; Gilpatric at Hot Springs; the RS-70; counterforce at Ann Arbor; the TFX hearings; the draft extended; *Thresher*; Anderson and Korth out; the A-11; the draft study.
  - id: cal.thread.desegregation-public-places
    s: 'Desegregation: public places'
    c: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. Burton; the Freedom Rides and the ICC order; Albany; Garner; Birmingham; the sit-in cases; Watson; Jackson; the public accommodations title. Gallup on the Freedom Riders and on integration.
  - id: cal.thread.desegregation-schools
    s: 'Desegregation: schools'
    c: Schools and universities opened under federal court orders, each event in its own thread. Georgia; Atlanta; Meredith at Oxford; Gantt at Clemson; Goss; the schoolhouse door; Alabama's schools in September; Prince Edward's Free Schools. Gallup on school integration; the New York boycott.
  - id: cal.thread.economy
    s: Economy
    c: The recession of 1960–61, the recovery, and the tax cut. The task force; the trough; the Fed's long rates; the gap; the debt limit; the 1962 Report; the May slide; depreciation; the investment credit; the Economic Club; the tax message; the House's 271–155; the discount rate to 3½; the interest equalization tax; Johnson's budget; the 1964 Report and budget; the Revenue Act of 1964; the interest equalization tax; the discount rate to 4; the 1965 budget and Report; the gold cover; the excise tax cut; Martin at Columbia; the coinage act; the Fed's December rise.
  - id: cal.thread.elections-1960
    s: Elections of 1960
    c: 'The 1960 nominations: the primaries, Mar. 8 to June 7 (CQ''s returns), and the conventions, Los Angeles, July 11, and Chicago, July 25. The rest of the year not yet written.'
  - id: cal.thread.elections-1962
    s: Elections of 1962
    c: The primaries and midterms of 1962. Connally and Wallace; Nixon in California; Edward Kennedy against McCormack; Nov. 6; Nixon's last press conference.
  - id: cal.thread.elections-1964
    s: Elections of 1964
    c: The elections of 1964, from the race for the nominations to the result. Rockefeller; the Goldwater draft; Goldwater announces; Gallup's trial heats; the primaries, Mar. 10 to June 2 (CQ's returns); San Francisco, July 13, and Atlantic City, Aug. 24; Smith announces; Scranton enters; his letter; the platform fight; Goldwater nominated; the Johnson–Goldwater meeting; the Cabinet ruled out; Hershey; Johnson and Humphrey nominated; Robert Kennedy for the Senate; the Daisy ad; Thurmond a Republican; the Lady Bird Special; Jenkins; "A Time for Choosing"; Nov. 3; the concession; Burch for Bliss.
  - id: cal.thread.elections-1968
    s: Elections of 1968
    c: 'The 1968 nominations: the primaries, Mar. 12 to June 11 (CQ''s returns), and the conventions, Miami Beach, Aug. 5, and Chicago, Aug. 26. The rest of the year not yet written.'
  - id: cal.thread.elections-1972
    s: Elections of 1972
    c: 'The 1972 nominations: the primaries, Mar. 7 to June 6 (CQ''s returns), and the conventions, both at Miami Beach, July 10 and Aug. 21. The rest of the year not yet written.'
  - id: cal.thread.elections-1976
    s: Elections of 1976
    c: 'The 1976 nominations: the primaries, Feb. 24 to June 8 (CQ''s returns), and the conventions, New York, July 12, and Kansas City, Aug. 16. The rest of the year not yet written.'
  - id: cal.thread.europe-and-the-alliance
    s: Europe and the alliance
    c: Britain, Europe, and the alliance's nuclear arms. Bermuda; the Declaration of Interdependence; Skybolt cancelled; Nassau; de Gaulle's veto; the Élysée treaty; the MLF; Kennedy in Europe; Erhard at the Ranch; Cyprus, from the London conference to the Turkish strikes; France recognizes Peking; Wilson's victory; the sterling crisis; Wilson's visit; Churchill's funeral; Rhodesia; Erhard in Washington.
  - id: cal.thread.farm
    s: Farm
    c: Price supports and production controls. The emergency feed grain program; the farm bill's defeat and the 1962 act; the wheat referendum; the Feed Grain Act of 1963; the Agricultural Act of 1964; the Food Stamp Act; the Food and Agriculture Act of 1965.
  - id: cal.thread.foreign-aid
    s: Foreign aid
    c: The aid program remade, and cut. The March message; AID created, long-term borrowing denied; the 1962 act and the Hickenlooper amendment; the Clay report; the 1963 cuts; the Christmas Eve vote; the 1964 message; the IDA bill; the Foreign Assistance Act of 1964; Food for Peace extended; the UAR ban; the Foreign Assistance Act of 1965.
  - id: cal.thread.freedom-rides
    s: Freedom Rides
    c: CORE's rides to test *Boynton*, May 1961, and the ICC order that came of them. Anniston; Montgomery; Jackson and Parchman; the petition; the order, in force Nov. 1.
  - id: cal.thread.health
    s: Health
    c: 'Health policy other than Medicare: drugs, mental health, the health professions. Thalidomide and Kelsey; the Drug Amendments; the mental health and retardation message and acts; maternal and child health; health professions; *Smoking and Health*; the DeBakey commission; the cigarette labeling act; heart disease, cancer, and stroke.'
  - id: cal.thread.immigration
    s: Immigration
    c: The national-origins quotas and their repeal. The 1963 message; the 1965 message; the House, the Senate, and the act signed at Liberty Island, Oct. 3, 1965.
  - id: cal.thread.india-and-china
    s: India and China
    c: India's wars, American arms for India, and South Asia and Indonesia. Goa; the Chinese attack of October 1962; Nehru's request; Harriman's mission; Nehru's death; the Rann of Kutch; the Indo-Pakistani war and the cease-fire; Indonesia's coup; Ayub Khan in Washington; Tashkent.
  - id: cal.thread.jobs-and-wages
    s: Jobs and wages
    c: Unemployment, depressed areas, and wages. The recovery message; the minimum wage; area redevelopment and its 1963 defeat; manpower training; public works acceleration; youth employment; federal employees' unions; the 1964 Manpower Report; the Appalachian bill in the Senate; the Appalachian act; the longshoremen; the area-development message; 14(b) refused cloture; the public works act; New York's transit strike.
  - id: cal.thread.king
    s: King
    c: 'Martin Luther King, Jr. The President, the Attorney General, the Bureau. Montgomery''s church besieged; Albany; Birmingham and the jail; the leaders at the White House; the March; the wiretaps; *Sullivan*; Hoover''s "most notorious liar"; the Nobel Prize; Selma and the march to Montgomery.'
  - id: cal.thread.laos
    s: Laos
    c: The Laos crisis, from Eisenhower's warning to the Geneva accords and after. The March maps; the cease-fire; the conference; Nam Tha; troops to Thailand; the coalition; the neutrality declaration; the Plain of Jars, April 1963; Harriman in Moscow; the April coup; the Plain of Jars and the reconnaissance flights; the planes shot down.
  - id: cal.thread.latin-america
    s: Latin America
    c: 'The Alliance for Progress and the hemisphere''s governments. The Alliance proposed; Trujillo killed, his family out; Punta del Este, 1961 and 1962; Goulart; coups in Argentina and Peru; Kennedy in Caracas, Bogotá, Mexico City; Bosch elected; San José; Chamizal; Bosch ousted; the Honduran coup; Panama''s riots and the break, the joint declaration, the canal studies; Fulbright''s "Old Myths"; Brazil''s coup; the OAS sanctions on Cuba; Frei; the Chamizal; the Dominican Republic: the revolt, the Marines, the OAS force, Bundy''s mission, the provisional government; Fulbright''s speech; Panama.'
  - id: cal.thread.march-on-washington
    s: March on Washington
    c: The March on Washington for Jobs and Freedom, Aug. 28, 1963.
  - id: cal.thread.medicare
    s: Medicare
    c: Hospital insurance for the aged through Social Security. The 1961 bill; the 1962 message; the Garden rally; the Senate's 52–48; the 1963 message; the 1964 message; the House bill without it; the Senate's Gore amendment; the conference deadlocked; the 1965 message; Mills's bill; the House; the Senate; Medicare and Medicaid signed at Independence, July 30, 1965.
  - id: cal.thread.missile-crisis
    s: Missile crisis
    c: The Soviet missiles in Cuba, from the decision to the aftermath. The Presidium's plan; the summer warnings; the U-2's find; the ExComm; the quarantine; the letters; the withdrawal; the IL-28s; the Stevenson story; the joint letter to U Thant; McNamara's photographs; the Soviet troops.
  - id: cal.thread.mississippi
    s: Mississippi
    c: The movement in Mississippi, Meredith's admission, Evers, and Freedom Summer. McComb; Herbert Lee; the Fifth Circuit's order; Barnett's refusals; the calls; Oxford; Greenwood; the Commission's report; Jackson; Evers killed; Beckwith's second trial; Freedom Summer; Chaney, Goodman, Schwerner; Hoover at Jackson; the bodies found; the Freedom Democrats at Atlantic City; the arrests; the House dismisses the Freedom Democrats' contests.
  - id: cal.thread.opinion
    s: Opinion
    c: The public's view, by Gallup's releases. Approval (each month's table gives every reading); the race for 1964, Nixon, Rockefeller, Goldwater; integration and the Freedom Riders; the most important problem; Cuba, Berlin, testing, the Court; prejudice in politics.
  - id: cal.thread.peace-corps
    s: Peace Corps
    c: The Peace Corps, from order to statute. The executive order; Ghana; the act; the Ibadan postcard.
  - id: cal.thread.poverty
    s: War on poverty
    c: 'The war on poverty, from the State of the Union of Jan. 8, 1964: Shriver''s task force; the poverty message; the Economic Opportunity Act; the Office of Economic Opportunity; the 1965 letter; Head Start; the Economic Opportunity Amendments.'
  - id: cal.thread.press-and-broadcasting
    s: Press and broadcasting
    c: The President and the press, and broadcasting's regulators. The live press conference; the publishers' speech; Minow's wasteland; the White House tour; the *Herald Tribune* cancelled; Sylvester's right to lie; the newspaper strike and its end; "After Two Years."
  - id: cal.thread.program
    s: Program
    c: 'The President''s program as a whole: the State of the Union messages and the agenda they set; what falls under no field''s thread. Fulbright–Hays; the State of the Union, 1964; the consumer message; the Great Society, Ann Arbor; the State of the Union, 1965; the arts and humanities foundation.'
  - id: cal.thread.railroads
    s: Railroad work rules
    c: 'The railroad work-rules dispute: firemen on diesels. The Presidential Railroad Commission; the strike deadlines; arbitration by statute; the moratorium; the settlement, Apr. 22, 1964.'
  - id: cal.thread.right-and-the-military
    s: Right and the military
    c: The radical right and the officers who spoke for it. The Birch Society; Walker relieved, admonished, resigned; Fulbright's memorandum; the crusades; the Seattle and Los Angeles speeches; the muzzling hearings; Walker at Oxford; Stevenson in Dallas.
  - id: cal.thread.rules
    s: Rules
    c: Majority rule in each chamber. The Rules Committee enlarged, then kept at fifteen; Rule XXII kept; Rayburn's absence; cloture refused on the literacy test, invoked on the satellite bill; the three-fifths rule refused, 1963; Pastore's germaneness rule.
  - id: cal.thread.school-aid
    s: School aid
    c: Federal aid to education, from the first great defeat to the acts of 1963 and 1965. The 1961 message; the Rules Committee's 8–7; Calendar Wednesday refused; the college bill recommitted; the omnibus bill; the college facilities and vocational acts; the Library Services and Construction Act; the NDEA amendments; the 1965 message; the Elementary and Secondary Education Act; the Higher Education Act.
  - id: cal.thread.soviet-union
    s: Soviet Union
    c: 'The Soviet Union apart from Berlin, Cuba and testing: Khrushchev''s last year; his removal, Oct. 1964; Brezhnev and Kosygin.'
  - id: cal.thread.space
    s: Space
    c: The space race and the moon program. Gagarin; the Space Council; Shepard; the moon message; Grissom, Titov, Glenn, Carpenter, Schirra; Houston; Telstar; Rice Stadium; the moon first; Mariner 2; Cooper; the joint expedition offered; Cape Kennedy; Saturn I; Ranger 7; Gemini 3 to 7; the Manned Orbiting Laboratory.
  - id: cal.thread.specials
    s: Special elections
    c: The special elections that filled seats in the 87th, 88th and 89th Congresses. Johnson's Senate seat to Tower; twelve House seats, three to widows; six House seats in 1963; three House seats in the spring of 1964, three with the November election; four House seats in 1965, Watson's among them.
  - id: cal.thread.states-and-cities
    s: States and cities
    c: State and city politics. The Twenty-Third Amendment; Tower; Yorty; Atlanta's schools; Wagner against Tammany; Michigan's convention and Romney; the elections of 1961; Gantt at Clemson; the elections of 1963; the Alaska earthquake; Harlem and Rochester; Hoover's riot report; Berkeley; District home rule; Watts; Lindsay elected; the Northeast blackout; Reagan announces.
  - id: cal.thread.steel
    s: Steel
    c: Steel prices and the guideposts. The letter of September 1961; the early settlement; the April price rise and its rescission; the selective increases of 1963; the 1965 settlement; Bethlehem's price rise.
  - id: cal.thread.students
    s: Students
    c: 'College and university students in politics. The peace pickets at the White House; Port Huron; Tougaloo''s sit-in; Freedom Summer''s volunteers; Berkeley, the police car and Sproul Hall; the teach-ins; SDS''s march; Vietnam Day; the draft-card law; the Days of Protest; Morrison; SANE''s march; SNCC against the war.'
  - id: cal.thread.succession
    s: Succession
    c: Johnson's first weeks, and the succession amended. The oath; the joint session; the Kennedy program; the budget; the disability amendment in the Senate; the disability message; the Twenty-fifth Amendment through Congress; Johnson's surgery.
  - id: cal.thread.testing
    s: Testing
    c: Nuclear testing and arms control. The Soviet resumption; American tests underground; ACDA; the fifty megatons; atmospheric tests resumed; Geneva; Starfish Prime; Khrushchev's inspection offer; American University; the hot line; Moscow; the treaty and the Senate's consent; the Geneva proposals; the cut in fissionable material; China's test.
  - id: cal.thread.trade
    s: Trade
    c: Trade, from the Trade Expansion Act to the wheat sale. The House and Senate votes; Herter named; the new tariff schedules; Canada's wheat sale; the American sale and Mundt's bill; the longshoremen's boycott; the Kennedy Round opens; the automotive agreement.
  - id: cal.thread.transition-and-staff
    s: Transition and staff
    c: The administration's people and organization. The cabinet; the NSC remade; the back injury; Taylor at the White House; McCone for Dulles; the Thanksgiving reshuffle; Joseph Kennedy's stroke; Hoover's lunch; Taylor to the Joint Chiefs; Gronouski for Day; Sorensen leaves; Shriver; Hoover kept past seventy; Robert Kennedy resigns; Heller and Hodges go; the inauguration, Jan. 20, 1965; Katzenbach; Fowler for Dillon; Raborn for McCone; Stevenson's death; O'Brien and Gronouski.
  - id: cal.thread.vietnam
    s: Vietnam
    c: The deepening commitment in Vietnam. The counterinsurgency plan; Johnson's trip; NSAM 52; Staley; Taylor–Rostow; NSAM 111; helicopters and the first dead; MACV; strategic hamlets; Galbraith's dissent; McNamara's visits; Mansfield's report; Ấp Bắc; the Buddhist crisis; Lodge; cable 243; McNamara–Taylor; the coup; NSAM 273; Khánh's coup; NSAM 280; McNamara–Taylor and NSAM 288; Honolulu; Seaborn; Taylor for Lodge; the Gulf of Tonkin, Aug. 2 and 4; Pierce Arrow; the resolution; Vũng Tàu; NSAM 314; Akron; the High National Council; Biên Hòa; Bundy's working group; the December decisions; the Brink Hotel; Bundy's report; Pleiku and Flaming Dart; Rolling Thunder; Đà Nẵng; NSAM 328; Johns Hopkins; the 173d; the May pause; Westmoreland's request; the B-52s; July 28; Starlite; Ia Drang; the pause and the peace offensive.
  - id: cal.thread.voting-rights
    s: Voting rights
    c: Voting rights in Congress and the field. The poll tax amendment and its ratification; the Voter Education Project; the literacy-test filibuster; the referees asked; the Twenty-fourth Amendment ratified; King's Nobel; Selma; Selma, Marion, Bloody Sunday; "The American Promise"; the bill through the Senate and the House; the Voting Rights Act, Aug. 6, 1965; its first examiners.
  - id: cal.thread.welfare
    s: Welfare
    c: Public assistance and Social Security. Aid to children of the unemployed; the Social Security Amendments of 1961; the Public Welfare Amendments of 1962; the Older Americans Act.
  - id: cal.thread.women
    s: Women
    c: The status of women in law and policy. The President's Commission; *The Feminine Mystique*; the Equal Pay Act; *American Women*; "sex" in Title VII.
