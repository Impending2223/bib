# Cal. I Threads
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: I
entries:
  - id: cal.thread.africa
    s: Africa
    c: Africa apart from the Congo. Sharpeville and the Security Council; the colonial declaration; Williams's "Africa for the Africans"; Angola at the UN; Mohamed V dies; Nkrumah and the Volta dam; Bizerte; the Moroccan bases; Algeria independent, Ben Bella at the White House and in Havana; the General Assembly's sanctions on South Africa.
    c2: Africa apart from the Congo. Olympio killed; NSAM 221 on Algeria; Hassan and the Moroccan bases; the Organization of African Unity; Portugal's territories at the Security Council; the arms embargo on South Africa; the Algerian–Moroccan war; the bases handed over; Zanzibar; the crowd at the Accra embassy; Wheelus; Rivonia; Ben Bella deposed; Rhodesia's declaration; Ben Barka.
    c3: Africa apart from the Congo. Nigeria's coups; Nkrumah overthrown; Rhodesia, the *Joanna V*, the *Tiger* talks; Johnson's speech on Africa; Robert Kennedy in South Africa; South West Africa at the Court and the UN; the Korry report; Rhodesia's sanctions by executive order; Biafra's secession; Humphrey's tour; the appeal on Nigeria; the Addis Ababa talks; relief for the war's victims.
  - id: cal.thread.alabama
    s: Alabama
    c: 'Alabama, 1960–65: the students, the Freedom Rides, Wallace, Birmingham, the schools, Selma. The Montgomery students; King acquitted; Meriwether confirmed; Anniston and the Birmingham terminal; Montgomery, the marshals, the church besieged; the riders on to Jackson; Wallace nominated.'
    c2: 'Alabama, 1963–65: Wallace, Birmingham, the schools, Selma. Wallace''s inaugural; Boutwell over Connor; the Birmingham campaign, April–May; the schoolhouse door; the schools in September; the Sixteenth Street church; Tuskegee High closed; the unpledged electors; the second primary, Elliott ninth; *Lee v. Macon*; Atlantic City and the pledge; five Republican seats; Bloody Sunday; Judge Johnson''s order and the march to Montgomery; Liuzzo; the Hayneville trials; the Klansmen convicted at Montgomery.'
    c3: 'Alabama, 1966–68: the Wallaces, the schools, the courts. Lurleen Wallace nominated, elected and sworn; the act against the guidelines; her answer to the statewide school order; *Walker v. City of Birmingham*, King''s five days in jail; *Lee v. Washington*; Lurleen Wallace''s death, Brewer governor; *King v. Smith*.'
  - id: cal.thread.antisubversion
    s: Antisubversion
    c: The States' committees, laws and oaths against subversion, and the Subversive Activities Control Board. Mississippi's Sovereignty Commission and the Citizens' Council; the Burns committee's report; Proposition 24 refused.
    c2: The States' committees, laws and oaths against subversion, and the Subversive Activities Control Board. North Carolina's Speaker Ban; Alabama's Sovereignty Commission; the raid on the SCEF at New Orleans; the Johns Committee's report and end; *Baggett v. Bullitt*; the Speaker Ban amended.
    c3: The States' committees, laws and oaths against subversion, and the Subversive Activities Control Board. *Keyishian*; the Board kept, registration dropped; California's disclaimer oath struck; *Schneider v. Smith*; the Ichord subcommittee on the Chicago convention.
  - id: cal.thread.assassination
    s: Assassination
    c: Kennedy killed at Dallas, and the inquiry. Dealey Plaza; Oswald killed; the funeral; the Warren Commission; its first meeting; the first witness; Ruby convicted; the Report; the hearings published.
    c3: Kennedy killed at Dallas, and the inquiry. The Manchester suit and its settlement; Ruby's death; Garrison's inquiry at New Orleans, Ferrie's death, Shaw's arrest; Robert Kennedy shot at Los Angeles; the Violence Commission.
  - id: cal.thread.baker
    s: Bobby Baker
    c: The Senate majority's secretary and the Rules Committee's inquiry. The resignation; Reynolds before the committee's staff; Johnson's statement; the Williams resolution tabled; the Select Committee on Standards and Conduct; the inquiry reopened.
    c3: The Senate majority's secretary and the Rules Committee's inquiry. Baker convicted.
  - id: cal.thread.berlin-and-vienna
    s: Berlin and Vienna
    c: The second Berlin crisis, from Khrushchev's demands to the wall and after. Adenauer at the White House; the East German permits; Vienna; the July buildup; Aug. 13; Clay in Berlin; Checkpoint Charlie; Powers for Abel; Fechter.
    c2: The second Berlin crisis, from the Vienna ultimatum to the wall and after. Kennedy in Berlin; Erhard and Schröder in Washington.
    c3: The second Berlin crisis, from the Vienna ultimatum to the wall and after. East Germany's passports and visas for West Germans.
  - id: cal.thread.black-nationalism
    s: Black nationalism
    c: Malcolm X and the Nation of Islam, and Black Power. "Message to the Grass Roots"; the "chickens" remark and the suspension; the break; "The Ballot or the Bullet"; the Organization of Afro-American Unity; the assassination.
    c3: Malcolm X and the Nation of Islam, and Black Power. CORE's "black power"; the Black Panther Party; Ali refuses induction; the Panthers at Sacramento; the Black Power conference at Newark; the Mulford Act; the FBI's counterintelligence program; Newton's arrest; the program widened; Glenville; Newton convicted; Smith and Carlos at Mexico City.
  - id: cal.thread.cities-and-housing
    s: Cities and housing
    c: Housing, the cities, and urban transit. The Housing Act of 1961; the Urban Affairs department refused, by Rules and by the House; Weaver.
    c2: Housing, the cities, and urban transit. The mass transit bill; Washington's rapid transit plan; Pennsylvania Station pulled down; the Urban Mass Transportation Act; the Housing Act of 1964; Proposition 14; the message on the cities; New York's Landmarks Law; the Housing and Urban Development Act of 1965; the National Capital Transportation Act; the Department created; rent supplements struck.
    c3: Housing, the cities, and urban transit. Weaver to HUD; demonstration cities, the message and the act; rent supplements funded; the Douglas commission; the rat bill refused a rule; the District's reorganization; model cities and rent supplements cut in the appropriation; "The Crisis of the Cities"; New York's Urban Development Corporation; mass transit to Transportation; the Housing and Urban Development Act of 1968.
  - id: cal.thread.civil-disorders
    s: Civil disorders
    c: Riots in the cities, and the inquiries and bills that followed. Nashville; Tampa, Cincinnati, Atlanta, Buffalo; Newark and Plainfield; Cramer's anti-riot bill through the House; Detroit, the Guard and the paratroopers; H. Rap Brown at Cambridge; the address of July 27 and the Kerner Commission; Milwaukee; the Senate's inquiry; the Miami chief's patrols.
  - id: cal.thread.civil-rights-bill
    s: Civil rights bill
    c: The civil rights bill from Kennedy's address to the Act and its first year. The Senators' pledge of 1960.
    c2: The civil rights bill from Kennedy's address to the Act and its first year. June 11; the message of June 19; the leaders at the White House; the Senate hearings; Judiciary's bill, Oct. 29; Johnson's joint session; the petition; Smith's hearings; "sex" in Title VII; the House, 290–130; the Senate takes it up; the filibuster; the Dirksen–Mansfield substitute; cloture, 71–29; the Senate, 73–27; the Act, July 2; Title II tested; the Community Relations Service; Title VI's regulations; *Heart of Atlanta*.
    c3: The civil rights bill from Kennedy's address to the Act and its first year. The Motorola order reversed in Illinois.
  - id: cal.thread.civil-rights-organizations
    s: Civil rights organizations
    c: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. *Bates*; SNCC founded at Raleigh; Farmer to CORE; Highlander; Greenberg and Young; the Albany Movement; COFO revived; the Voter Education Project.'
    c2: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Lewis SNCC''s chairman; the Council for United Civil Rights Leadership; the leaders at the White House; the Freedom Vote; Freedom Day at Hattiesburg; the Freedom Democratic Party; the moratorium; the compromise refused; Waveland; CORE at Durham; McKissick; SNCC against the war.'
    c3: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Dahmer killed; Carmichael SNCC''s chairman; the White House conference; Meredith shot; CORE and "black power"; SNCC votes the whites out; Brown for Carmichael; the Black Power conference; the four leaders on the riots; SCLC at Atlanta; Howard''s administration building held.'
  - id: cal.thread.civil-rights-the-executive
    s: 'Civil rights: the executive'
    c: What the President did for civil rights by appointment and order. The Senators' pledge and the stroke of a pen; Lodge's promise; Weaver; the equal employment committee; the new judgeships, Cox and Marshall; the housing order.
    c2: What the President did for civil rights by appointment and order. The Commission's century report; Baldwin; the apprenticeship order; the order on federally aided construction; Cambridge; the Gesell committee and McNamara's directive; the Commission extended; the wiretaps on King; Penn's killing; Hoover on King; Title VI's regulations; the Council on Equal Opportunity; the Klan arrests; Howard University; Marshall Solicitor General; Executive Order 11246; Chicago's school funds deferred; "To Fulfill These Rights" planned.
    c3: What the President did for civil rights by appointment and order. Weaver to the Cabinet; the Community Relations Service to Justice; Brimmer to the Board; the equal employment bill; the message of 1966; the White House Conference "To Fulfill These Rights" and its report; Title VI and the hospitals; the message of 1968; the Jury Selection and Service Act; "The Forgotten American".
  - id: cal.thread.confirmations
    s: Confirmations
    c: Nominations the Senate divided on by roll call. Meriwether; Holmes; the Power Commission; Robinson; McCone; McCloskey; Marshall to the Second Circuit.
    c2: Nominations the Senate divided on by roll call. The satellite incorporators; Collins to the Community Relations Service; Coleman to the Fifth Circuit.
    c3: Nominations the Senate divided on by roll call. Marshall to the Court; Warren's retirement; Fortas for Chief Justice and Thornberry; the hearings; cloture refused; Fortas withdrawn.
  - id: cal.thread.congo
    s: Congo
    c: The Congo's civil war and the UN's war in Katanga. Independence; Katanga's secession and the UN force; Lumumba in Washington; the plot against him; his dismissal, Mobutu, his capture; his death; Rumpunch; Hammarskjöld's death; U Thant; Kitona; Elisabethville.
    c2: The Congo's civil war and the UN's war in Katanga. The end of secession; the pilots in Kivu; the UN's departure; Tshombe prime minister; Stanleyville taken; Dragon Rouge; the Cairo embassy attacked; Mobutu's coup.
    c3: The Congo's civil war and the UN's war in Katanga. The mercenaries' mutiny and the C-130s.
  - id: cal.thread.congress
    s: Congress
    c: 'Congress as an institution: its leaders and sessions. The 86th''s second session and its August return; Kennedy''s seat resigned; Rayburn''s death; McCormack Speaker; the second session''s end, Oct. 13, 1962.'
    c2: 'Congress as an institution: its leaders and sessions. The 87th''s end; the 88th''s opening; Clark''s Senate establishment; the germaneness rule; the pay bill defeated, then passed; Edward Kennedy''s crash; Engle''s death, Salinger seated; the 88th''s end; the Freedom Democrats'' contests; the 89th''s opening; Ford for Halleck; Watson leaves; the Joint Committee on the Organization of the Congress; District home rule; 14(b) in the Senate; the contests dismissed; the first session''s end; Byrd resigns.'
    c3: 'Congress as an institution: its leaders and sessions. The second session; 14(b) again; the Foreign Relations hearings; the war''s supplemental; the campaign fund; the session''s end; Powell and the Hays report; the 90th''s opening; Powell excluded, re-elected; the reorganization bill through the Senate; the House''s ethics committee; Dodd censured; the Election Reform Act; Fulbright''s national commitments resolution; the first session''s end; the second session; the Senate''s code of conduct; the surcharge, the Revenue and Expenditure Control Act; Goodell for Robert Kennedy; the 91st''s opening; Rule XXII.'
  - id: cal.thread.conservation
    s: Conservation
    c: Public lands, wilderness, and pollution. The water-pollution veto; the natural resources message; Cape Cod; the wilderness bill through the Senate; the Delaware compact; the conservation message and the Bureau of Outdoor Recreation; the White House conference; the western dams; *Silent Spring*; Point Reyes and Padre Island.
    c2: Public lands, wilderness, and pollution. The wilderness bill; the conservation tour; the Clean Air Act; the Wilderness Act and the Land and Water Conservation Fund; natural beauty, the message and the conference; the McAteer–Petris Act; the Water Quality Act; the air pollution and solid waste acts; the Highway Beautification Act; New York's Pure Waters bonds.
    c3: Public lands, wilderness, and pollution. The natural heritage message; the seven parks bills; the Clean Water Restoration Act; Indiana Dunes; the 1967 message; Oregon's Beach Bill; the Air Quality Act; "To Renew a Nation"; Prudhoe Bay; the Land and Water Conservation Fund raised; the Central Arizona Project; Redwood, the wild and scenic rivers, the trails, North Cascades; the last proclamations.
  - id: cal.thread.amendments
    s: Constitutional amendments
    c: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The Twenty-third Amendment through Congress, Hawaii first, Arkansas refusing, ratified and put into law; the equal rights amendment recommitted; Kefauver's hearings; the poll tax amendment through both Houses, Illinois first, Mississippi refusing; *Engel* and the prayer amendments; the Council of State Governments' three amendments.
    c2: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The telegram to the governors and the poll tax amendment ratified, the Twenty-fourth; the Court of the Union in Gallup; the women's commission, no equal rights amendment; the applications for a convention, 1963–65; Bayh's amendment on disability and the Vice Presidency, from the hearings through both Houses to the States; the Becker amendment's hearings; the apportionment amendments, Dirksen's refused in the Senate; the equal rights amendment reported; the four-year House term.
    c3: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The four-year House term asked and heard; the electoral college reform asked again; the prayer amendment introduced; Dirksen's apportionment amendment refused again; the Twenty-fifth Amendment ratified and certified; the prayer amendment heard and refused; the District's representation asked, heard, reported; Ervin's convention bill, heard; the States' applications for a convention, by year; the vote at eighteen heard and asked; Gallup's questions.
  - id: cal.thread.consumers
    s: Consumer protection
    c: 'Consumer protection: credit, meat, fabrics, products. The message of Feb. 16, 1967; Betty Furness; truth in lending through the Senate; meat inspection and the Wholesome Meat Act; the Product Safety Commission; the Flammable Fabrics amendments.'
  - id: cal.thread.court
    s: Court
    c: The Supreme Court's October 1959 to October 1965 Terms, its new Justices, and Congress's answers. *Raines*; *Elkins*; *Gomillion*; *Boynton*; *Mapp*; *Baker v. Carr*, argued, reargued, decided; *Engel v. Vitale*; White and Goldberg for Whittaker and Frankfurter.
    c2: The Supreme Court's October 1962 to October 1965 Terms, its new Justices, and Congress's answers. *Button*; *Gideon*; *Gray v. Sanders*; the sit-in cases; *Schempp*; *Wesberry*; *New York Times v. Sullivan*; *Griffin*; *Reynolds v. Sims*; the Tuck bill and the Dirksen rider; *Heart of Atlanta*; *Griswold*; Marshall Solicitor General; Fortas for Goldberg; Dirksen's apportionment amendment; *Albertson*.
    c3: The Supreme Court's October 1965 to October 1968 Terms, its new Justices, and Congress's answers. *South Carolina v. Katzenbach*; *Harper*; *Miranda*; *Katzenbach v. Morgan*; *Bond v. Floyd*; *Keyishian*; *Gault*; *Reitman v. Mulkey*; *Loving*; *Walker*; Marshall for Tom Clark; *Katz*; Dirksen's convention; *Green*; *Terry*; *Jones v. Mayer*; Warren's retirement; Fortas for Chief Justice, cloture refused; *Williams v. Rhodes*.
  - id: cal.thread.crime-and-hijacking
    s: Crime and hijacking
    c: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. Three hijackings, May–Aug. 1961; aircraft piracy a federal crime; the Wire and Travel Acts.
    c2: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. McClellan's hearings, Valachi; Hoffa convicted; Mississippi's laws against Freedom Summer; the death penalty ended in Oregon, Iowa, West Virginia and New York; the 1965 crime message; the Crime Commission; the Law Enforcement Assistance Act.
    c3: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. The 1966 message; *Miranda*; the Bail Reform Act; New York's civilian review board, named and voted down; Austin and the gun bill; the narcotic addict act; the District crime bill vetoed; Kirk's "war on crime"; the 1967 message; the Commission's report; executions in California and Colorado; the Mulford Act; the Safe Streets bill through the House; *Katz*; the District crime act; "To Insure the Public Safety"; the Violence Commission; the Omnibus Crime Control and Safe Streets Act; *Terry*; the Gun Control Act.
  - id: cal.thread.cuba
    s: Cuba
    c: Cuba short of the missile crisis, and after. Mikoyan in Havana; the covert program; the sugar quota and the nationalizations; the embargo; the break; the Bay of Pigs and its inquiry; Mongoose; Punta del Este; Northwoods; the prisoners' ransom; the Orange Bowl.
    c2: Cuba short of the missile crisis, and after. NSAM 213; Gallup on the handling of Cuba; the exile raids; the sabotage program; Attwood and Lechuga; Guantanamo's water; the OAS sanctions; *Zemel v. Rusk*; Camarioca and the refugee airlift.
    c3: Cuba short of the missile crisis, and after. The Cuban Adjustment Act; Guevara killed in Bolivia.
  - id: cal.thread.defense
    s: Defense
    c: Strategy and the defense budget. The missile gap in the hearings; Polaris at sea; the SIOP; the farewell address; McNamara's no missile gap; the March budget; the Berlin increase; civil defense to the Pentagon; Gilpatric at Hot Springs; the RS-70; counterforce at Ann Arbor.
    c2: Strategy and the defense budget. The TFX hearings; the draft extended; the RS-70 added; *Thresher*; Anderson and Korth out; the A-11; the draft study; the $700 million for Vietnam; the base-closing veto; the Manned Orbiting Laboratory; the draft-card act.
    c3: Strategy and the defense budget. Palomares; the supplemental; the deferment test; McNamara at Montreal; the Marshall commission; the reserves amendment; the ABM; Kosygin's reply on talks; the Military Selective Service Act; the *Liberty*; the Stennis hearings; the "Chinese-oriented" ABM; the women officers' act; McNamara to the World Bank; Thule; Clifford for McNamara; the 205,000; Westmoreland Chief of Staff, Abrams for him; the Sentinel votes; MIRV tested.
  - id: cal.thread.desegregation-public-places
    s: 'Desegregation: public places'
    c: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. *Boynton*; Burton; the Freedom Rides and the ICC order; Albany; Garner. Gallup on the Freedom Riders and on integration.
    c2: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. Maryland's public accommodations act; Birmingham; Greensboro; the sit-in cases; *Watson*; Jackson; the public accommodations title; Cambridge's referendum; Frankfort; St. Augustine; *Bell v. Maryland*; Title II tested; Maryland's act upheld at referendum; *Heart of Atlanta*; Missouri's and Kentucky's acts. Gallup on integration.
    c3: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. *Evans v. Newton*; *Brown v. Louisiana*; the Eagles picketed at Milwaukee; Maryland's open housing act.
  - id: cal.thread.desegregation-schools
    s: 'Desegregation: schools'
    c: Schools and universities opened under federal court orders, each event in its own thread. New Orleans; Georgia; Atlanta; Meredith at Oxford. Gallup on school integration.
    c2: Schools and universities opened under federal court orders, each event in its own thread. Gantt at Clemson; *Goss*; the schoolhouse door; Boston's Stay Out for Freedom; Alabama's schools in September; Prince Edward's Free Schools; the Chicago, New York, Cleveland and Milwaukee boycotts; *Griffin*; *Lee v. Macon*; the Racial Imbalance Act; Chicago's grants deferred; the Charlotte bombings. Gallup on school integration.
    c3: Schools and universities opened under federal court orders, each event in its own thread. The Seattle boycott; Boston's State aid withheld; Intermediate School 201; Alabama's act against the guidelines; Grenada; the guidelines in the House; Alabama's statewide order; the Racial Imbalance Act upheld; the track system struck in Washington; the East Los Angeles walkouts; *Green*; the busing provisos; the separate-schools clauses dropped in Oklahoma and Florida. Gallup on school integration.
  - id: cal.thread.draft
    s: Draft
    c: Selective Service. The message and the Marshall Commission's lottery; Muhammad Ali's refusal and conviction; the Military Selective Service Act; Stop the Draft Week; Hershey's letter to the boards and his statement with Ramsey Clark; the Boston indictments.
  - id: cal.thread.economy
    s: Economy
    c: Fiscal and monetary policy, the dollar and gold. The peak; the London gold price; the balance-of-payments directive; the task force; the trough; the Fed's long rates; the gap; the debt limit; the 1962 Report; the May slide; depreciation; the investment credit; the Economic Club.
    c2: Fiscal and monetary policy, the dollar and gold. The tax message; the debt limit; the discount rate to 3½; the interest equalization tax; the House's 271–155; the Revenue Act of 1964; the Interest Equalization Tax Act; Wilson's surcharge; Ackley for Heller; the discount rate to 4; the gold cover; Fowler for Dillon; the excise tax cut; Martin at Columbia; the coinage act; aluminum and copper; the Fed's December rise.
    c3: Fiscal and monetary policy, the dollar and gold. The Tax Adjustment Act; Brimmer; the Fed's squeeze; the investment credit suspended; the interest rate act; the cutback; the surcharge proposed; the investment credit restored; the debt limit; the August message; special drawing rights; the surcharge set aside by Ways and Means; sterling devalued; the balance-of-payments program; the note cover ended; the gold market closed; the Revenue and Expenditure Control Act; the franc and the mark; the surplus.
  - id: cal.thread.elections-1960
    s: Elections of 1960
    c: The 1960 election, from the announcements to the count. The primaries, Mar. 8 to June 7 (CQ's returns); Wisconsin and West Virginia; Los Angeles and Chicago; the Treaty of Fifth Avenue; Houston; the four debates; King's arrest; Nov. 8; Hawaii's recount; the electors; the count, Jan. 6.
  - id: cal.thread.elections-1961
    s: Elections of 1961
    c: 'The off-year elections of 1961. Governors: Hughes in New Jersey, Harrison in Virginia. Mayors: Yorty over Poulson; Wagner against Tammany, then re-elected; Allen over Maddox in Atlanta; Cavanagh over Miriani in Detroit; Cowger in Louisville.'
  - id: cal.thread.elections-1962
    s: Elections of 1962
    c: The primaries and midterms of 1962. Connally and Wallace; Nixon in California; Edward Kennedy against McCormack; Nov. 6; Nixon's last press conference.
    c2: The primaries and midterms of 1962. Minnesota's recount, Rolvaag declared elected.
  - id: cal.thread.elections-1963
    s: Elections of 1963
    c: 'The off-year elections of 1963. Mayors: Boutwell over Connor in Birmingham; Daley over Adamowski; McKeldin in Baltimore; Tate, Shelley, Collins. Governors: Breathitt in Kentucky; Paul Johnson in Mississippi, beside the Freedom Vote; McKeithen in Louisiana.'
  - id: cal.thread.elections-1964
    s: Elections of 1964
    c: The elections of 1964, from the race for the nominations to the result. The Goldwater draft, its Chicago meetings.
    c2: The elections of 1964, from the race for the nominations to the result. Rockefeller; the Goldwater draft; Goldwater announces; the primaries, Mar. 10 to June 2 (CQ's returns); San Francisco, July 13, and Atlantic City, Aug. 24; Smith announces; Scranton enters; his letter; the platform fight; Goldwater nominated; the Johnson–Goldwater meeting; the Cabinet ruled out; Hershey; Johnson and Humphrey nominated; Robert Kennedy for the Senate; the Daisy ad; Thurmond a Republican; the Lady Bird Special; Jenkins; "A Time for Choosing"; Nov. 3; the concession; Burch for Bliss.
  - id: cal.thread.elections-1964-polls
    s: 'Elections of 1964: polls'
    c: Gallup on 1964, the Republicans' choice and Kennedy against each. Nixon first; Rockefeller over Goldwater; Kennedy 65, Nixon 35; Rockefeller ahead, Nov. 1962.
    c2: Gallup on 1964, the Republicans' choice and the President against each. Goldwater past Rockefeller, May 1963; Johnson after Nov. 22; Lodge after New Hampshire; Robert Kennedy for Vice President; the county chairmen; Scranton over Goldwater among Republicans; Johnson 65, Goldwater 29, August; the final poll, 64–29.
  - id: cal.thread.elections-1965
    s: Elections of 1965
    c: The off-year elections of 1965. Lindsay over Beame and Buckley in New York; Hughes re-elected and Godwin elected governors; Yorty, Cavanagh and Barr re-elected; Locher over Stokes; Cervantes in St. Louis; Bond to the Georgia House.
  - id: cal.thread.elections-1966
    s: Elections of 1966
    c: The primaries and midterms of 1966. Lurleen Wallace; Reagan; the Virginia, Tennessee and Michigan primaries; Maddox; Brooke; Nov. 8; the Georgia governorship to the legislature, Maddox chosen; Reagan sworn.
  - id: cal.thread.elections-1967
    s: Elections of 1967
    c: 'The off-year elections of 1967. Mayors: Daley''s fourth term; Hatcher at Gary, Stokes at Cleveland; Tate over Specter; White over Hicks; Alioto, Lugar, D''Alesandro, Loeb. Governors: McKeithen renominated; Nunn in Kentucky; Williams in Mississippi. New Jersey''s Senate Republican; Reid to Virginia''s House of Delegates; New York''s constitution refused.'
  - id: cal.thread.elections-1968
    s: Elections of 1968
    c: The 1968 election, from the race for the nominations to the count. Gallup's first trial heats and the Republicans' choice, Nixon first; Romney against Humphrey and Johnson; Robert Kennedy and Humphrey as candidates.
    c3: The 1968 election, from the race for the nominations to the count. Gallup's trial heats and the parties' choices; Nixon's preparations; Romney's "brainwashing" and his announcement; McCarthy against Johnson; Nixon and Wallace announce; Romney withdraws; New Hampshire; the Mar. 31 address; Humphrey and Rockefeller announce; the primaries (CQ's returns); Kennedy shot at Los Angeles; Chennault and Bùi Diễm; Miami Beach, Nixon and Agnew; Chicago, the streets and the Vietnam plank, Humphrey and Muskie; LeMay; Salt Lake City; the bombing halt; Nixon elected; the governors and the legislatures; the electoral votes counted.
  - id: cal.thread.elections-1968-polls
    s: 'Elections of 1968: polls'
    c: 'Gallup on 1968: the parties'' choices and the trial heats. Nixon first among Republicans, Lodge and Goldwater behind; Romney even with Humphrey, behind Johnson.'
    c3: 'Gallup on 1968: the parties'' choices and the trial heats. Robert Kennedy over Nixon; the county chairmen; Romney ahead of Johnson, then behind after the brainwashing; Nixon first among Republicans; Robert Kennedy and Johnson among Democrats; Wallace as an independent; McCarthy, Kennedy and Humphrey after Mar. 31; Nixon, Humphrey and Wallace through the fall; the final poll.'
  - id: cal.thread.elections-1972
    s: Elections of 1972
    c: 'The 1972 nominations: the primaries, Mar. 7 to June 6 (CQ''s returns), and the conventions, both at Miami Beach, July 10 and Aug. 21. The rest of the year not yet written.'
  - id: cal.thread.elections-1976
    s: Elections of 1976
    c: 'The 1976 nominations: the primaries, Feb. 24 to June 8 (CQ''s returns), and the conventions, New York, July 12, and Kansas City, Aug. 16. The rest of the year not yet written.'
  - id: cal.thread.electoral-college
    s: Electoral college
    c: 'The electoral college: its electors, pledged, unpledged and faithless, the count in Congress, and the proposals to change it. Alabama''s and Mississippi''s unpledged electors; electors for the District through Congress and ratified; Byrd''s fifteen votes; Hawaii''s recount and its three certificates; the count; Kefauver''s hearings; Irwin before them; the District''s electors put into law.'
    c2: 'The electoral college: its electors, pledged, unpledged and faithless, the count in Congress, and the proposals to change it. Alabama''s unpledged electors again, no Johnson electors on its ballot; Mississippi''s unpledged-elector law upheld; the District''s first vote for President; the count with the Vice Presidency vacant; Johnson''s amendment, each State''s votes to those who carry it; Nebraska''s and Oklahoma''s applications.'
    c3: 'The electoral college: its electors, pledged, unpledged and faithless, the count in Congress, and the proposals to change it. The administration''s plan asked again and heard; Delaware''s suit against the unit rule, refused; Bayh''s direct election; the Bar Association''s commission for it; the hearings of 1967; Gallup''s polls; the electors of 1968, Bailey''s vote, the count and the objection.'
  - id: cal.thread.europe-and-the-alliance
