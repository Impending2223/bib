  - id: cal.thread.amendments
    s: Constitutional amendments
    c: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The Twenty-third Amendment through Congress, Hawaii first; the equal rights amendment recommitted; Arkansas refusing; the Twenty-third ratified; Kefauver's hearings; the Kennedy–Johnson agreement on inability; the District's electors put into law; the poll tax amendment through both Houses, Illinois first, Mississippi refusing; *Engel* and the prayer amendments; the Council of State Governments' three amendments.
    c2: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The telegram to the governors and the poll tax amendment ratified, the Twenty-fourth; the Court of the Union in Gallup; the women's commission, no equal rights amendment; Bayh's amendment on inability and the Vice Presidency, from the hearings through both Houses to the States; the Becker amendment's hearings; the apportionment amendments, Dirksen's refused in the Senate; the equal rights amendment reported; the four-year House term heard; the applications for a convention, 1963–65.
    c3: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The four-year House term asked and heard; the electoral college reform asked again and heard; the prayer amendment introduced; Dirksen's apportionment amendment refused again; the prayer amendment heard and refused; the Twenty-fifth Amendment ratified and certified; the District's representation asked, heard, reported; Ervin's convention bill heard; the applications for an apportionment convention, thirty-two of thirty-four; the vote at eighteen heard and asked; Gallup's questions.
  - id: cal.thread.consumers
    s: Consumer protection
    c: 'Consumer protection: credit, food, products, securities. The message of Feb. 16, 1967; Betty Furness; truth in lending through the Senate; the Product Safety Commission; the Flammable Fabrics amendments; the Wholesome Meat Act; the message of Feb. 6, 1968; the Consumer Credit Protection Act; the Williams Act; pipeline safety, poultry, radiation.'
  - id: cal.thread.crime-and-hijacking
    s: Crime and hijacking
    c: 'Crime and the law against it: organized crime and Hoffa, the hijackings to Cuba, the death penalty, the police and the courts, the crime and gun laws. Chessman''s reprieve and execution; Robert Kennedy''s organized-crime bills; three hijackings, May–Aug. 1961; aircraft piracy a federal crime; the Wire and Travel Acts; Delaware''s death penalty restored; the Test Fleet trial.'
    c2: 'Crime and the law against it: organized crime and Hoffa, the hijackings to Cuba, the death penalty, the police and the courts, the crime and gun laws. Hoffa indicted for jury tampering; McClellan''s hearings, Valachi; Hoffa convicted at Chattanooga; Mississippi''s laws against Freedom Summer; the death penalty ended in Oregon, Iowa, West Virginia and New York; the 1965 crime message; the Crime Commission; the Law Enforcement Assistance Act.'
    c3: 'Crime and the law against it: organized crime and Hoffa, the hijackings to Cuba, the death penalty, the police and the courts, the crime and gun laws. The 1966 message; *Miranda*; the Bail Reform Act; New York''s civilian review board, named and voted down; Austin; the District crime bill vetoed; the Commission''s report; executions at San Quentin and Cañon City; the Mulford Act; *Katz*; "To Insure the Public Safety"; the Safe Streets Act; *Terry*; the Gun Control Act.'
