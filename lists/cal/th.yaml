# Cal. I Threads
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: I
entries:
  - id: cal.thread.africa
    s: Africa
    c: Africa apart from the Congo. Sharpeville and the Security Council; the colonial declaration; Williams's "Africa for the Africans"; Angola at the UN; Mohamed V dies; Nkrumah and the Volta dam; Bizerte; the Moroccan bases; Algeria independent, Ben Bella at the White House and in Havana; the General Assembly's sanctions on South Africa.
    c2: Africa apart from the Congo. The Organization of African Unity; the arms embargo on South Africa; the Algerian–Moroccan war; the Moroccan bases handed over; Zanzibar; Wheelus; Nkrumah overthrown; Rhodesia, the *Joanna V*, the *Tiger* talks; Ben Barka; Nigeria's coups; Johnson's speech on Africa; Robert Kennedy in South Africa; South West Africa at the Court and the UN. Rhodesia's sanctions by executive order; Biafra's secession; Humphrey's tour.
  - id: cal.thread.alabama
    s: Alabama
    c: 'Alabama, 1960–65: the students, the Freedom Rides, Wallace, Birmingham, the schools, Selma. The Montgomery students; King acquitted; Meriwether confirmed; Anniston and the Birmingham terminal; Montgomery, the marshals, the church besieged; the riders on to Jackson; Wallace nominated.'
    c2: 'Alabama, 1961–67: the Freedom Rides, Wallace, Birmingham, the schools, Selma. Wallace''s inaugural; the Birmingham campaign, April–May; the schoolhouse door; the schools in September; the Sixteenth Street church; Tuskegee High closed; the unpledged electors; the second primary, Elliott ninth; Hare''s injunction at Selma; *Lee v. Macon*; Atlantic City and the pledge; five Republican seats; Judge Johnson''s order and the march to Montgomery; Liuzzo; the Hayneville trials. Lurleen Wallace nominated and sworn; her answer to the statewide school order; *Walker v. City of Birmingham*, King''s five days in jail.'
  - id: cal.thread.antisubversion
    s: Antisubversion
    c: The States' committees, laws and oaths against subversion, and the Subversive Activities Control Board. Mississippi's Sovereignty Commission and the Citizens' Council; the Burns committee's report; Proposition 24 refused.
    c2: The States' committees, laws and oaths against subversion, and the Subversive Activities Control Board. North Carolina's Speaker Ban; Alabama's Sovereignty Commission; the raid on the SCEF at New Orleans; the Johns Committee's report and end; *Baggett v. Bullitt*; the Speaker Ban amended. *Keyishian*; the Board kept, registration dropped; California's disclaimer oath struck.
  - id: cal.thread.assassination
    s: Assassination
    c: Kennedy killed at Dallas, and the inquiry. Nov. 22; Oswald killed; the funeral; the Warren Commission; the first witness; Ruby convicted; the Report; the hearings published; the Manchester suit and its settlement; Ruby's death; Garrison's inquiry at New Orleans, Ferrie's death, Shaw's arrest.
  - id: cal.thread.baker
    s: Bobby Baker
    c: The Senate majority's secretary and the Rules Committee's inquiry. Resignation, Oct. 7; Reynolds before the committee's staff; Johnson's statement; the Williams resolution tabled; the Select Committee on Standards and Conduct; the inquiry reopened; Baker convicted.
  - id: cal.thread.berlin-and-vienna
    s: Berlin and Vienna
    c: The second Berlin crisis, from Khrushchev's demands to the wall and after. Adenauer at the White House; the East German permits; Vienna; the July buildup; Aug. 13; Clay in Berlin; Checkpoint Charlie; Powers for Abel; Fechter.
    c2: The second Berlin crisis, from the Vienna ultimatum to the wall and after. Kennedy in Berlin.
  - id: cal.thread.black-nationalism
    s: Black nationalism
    c: Malcolm X and the Nation of Islam, and Black Power. The "chickens" remark and the suspension; the break; "The Ballot or the Bullet"; the Organization of Afro-American Unity; the assassination; CORE's "black power"; the Black Panther Party; the Panthers at Sacramento; the Black Power conference at Newark; the FBI's counterintelligence program; Newton's arrest.
  - id: cal.thread.cities-and-housing
    s: Cities and housing
    c: Housing, the cities, and urban transit. The Housing Act of 1961; the Urban Affairs department refused, by Rules and by the House; Weaver.
    c2: Housing, the cities, and urban transit. Mass transit; the Urban Mass Transportation Act; the Housing Act of 1964; Proposition 14; the Housing and Urban Development Act of 1965; the Department created; rent supplements. Weaver to HUD; demonstration cities, the message and the act; rent supplements funded. The Douglas commission; the rat bill refused a rule; model cities and rent supplements cut in the appropriation.
  - id: cal.thread.civil-disorders
    s: Civil disorders
    c: Riots in the cities, and the inquiries and bills that followed. Nashville; Tampa, Cincinnati, Atlanta, Buffalo; Newark and Plainfield; Cramer's anti-riot bill through the House; Detroit, the Guard and the paratroopers; H. Rap Brown at Cambridge; the address of July 27 and the Kerner Commission; Milwaukee; the Senate's inquiry; the Miami chief's patrols.
  - id: cal.thread.civil-rights-bill
    s: Civil rights bill
    c: The civil rights bill from Kennedy's address to the Act and its first year. The Senators' pledge of 1960.
    c2: The civil rights bill from Kennedy's address to the Act and its first year. June 11; the message of June 19; the leaders at the White House; the Senate hearings; Judiciary's bill, Oct. 29; Johnson's joint session; the petition; Smith's hearings; the House, 290–130; the Senate takes it up; the filibuster; the Dirksen–Mansfield substitute; cloture, 71–29; the Senate, 73–27; the Act, July 2; Title II tested; the Community Relations Service; Title VI's regulations.
  - id: cal.thread.civil-rights-organizations
    s: Civil rights organizations
    c: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. *Bates*; SNCC founded at Raleigh; Farmer to CORE; Highlander; Greenberg and Young; the Albany Movement; COFO revived; the Voter Education Project.'
    c2: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Lewis SNCC''s chairman; the Council for United Civil Rights Leadership; the leaders at the White House; the Freedom Democratic Party; the moratorium; the compromise refused; Waveland; CORE at Durham; McKissick; SNCC against the war. Dahmer killed; Carmichael SNCC''s chairman; the White House conference; CORE and "black power"; SNCC votes the whites out. Brown for Carmichael; the Black Power conference; the four leaders on the riots; SCLC at Atlanta.'
  - id: cal.thread.civil-rights-the-executive
    s: 'Civil rights: the executive'
    c: What the President did for civil rights by appointment and order. The Senators' pledge and the stroke of a pen; Lodge's promise; Weaver; the equal employment committee; the new judgeships, Cox and Marshall; the housing order.
    c2: What the President did for civil rights by appointment and order. The Commission's century report; Baldwin; the apprenticeship order; Cambridge; the Gesell committee and McNamara's directive; Hoover on King; the Council on Equal Opportunity; the Klan arrests; Howard University; Executive Order 11246; "To Fulfill These Rights". The Community Relations Service to Justice; the equal employment bill; "To Fulfill These Rights" and its report.
  - id: cal.thread.confirmations
    s: Confirmations
    c: Nominations the Senate divided on by roll call. Meriwether; Holmes; the Power Commission; Robinson; McCone; McCloskey; Marshall to the Second Circuit.
    c2: Nominations the Senate divided on by roll call. The satellite incorporators; Coleman to the Fifth Circuit; Marshall to the Court.
  - id: cal.thread.congo
    s: Congo
    c: The Congo's civil war and the UN's war in Katanga. Independence; Katanga's secession and the UN force; Lumumba in Washington; the plot against him; his dismissal, Mobutu, his capture; his death; Rumpunch; Hammarskjöld's death; U Thant; Kitona; Elisabethville.
    c2: The Congo's civil war and the UN's war in Katanga. The end of secession; the UN's departure; Tshombe prime minister; Stanleyville taken; Dragon Rouge; Mobutu's coup; the mercenaries' mutiny and the C-130s.
  - id: cal.thread.congress
    s: Congress
    c: 'Congress as an institution: its leaders and sessions. The 86th''s second session and its August return; Kennedy''s seat resigned; Rayburn''s death; McCormack Speaker; the second session''s end, Oct. 13, 1962.'
    c2: 'Congress as an institution: its leaders and sessions. The 87th''s end; the 88th''s opening; Clark''s Senate establishment; the pay bill defeated, then passed; Edward Kennedy''s crash; Engle''s death; the 89th''s opening; Ford for Halleck; Watson leaves; the Joint Committee on the Organization of the Congress; Byrd resigns; the war''s supplemental; the campaign fund; Powell and the Hays report. The 90th''s opening; Powell excluded, re-elected; the reorganization bill through the Senate; the House''s ethics committee; Dodd censured; the election reform bill; the first session, Jan. 10–Dec. 15; the second, from Jan. 15, 1968.'
  - id: cal.thread.conservation
    s: Conservation
    c: Public lands, wilderness, and pollution. The water-pollution veto; the natural resources message; Cape Cod; the wilderness bill through the Senate; the Delaware compact; the conservation message and the Bureau of Outdoor Recreation; the White House conference; the western dams; *Silent Spring*; Point Reyes and Padre Island.
    c2: Public lands, wilderness, and pollution. The wilderness bill; the conservation tour; the Clean Air Act; the Wilderness Act and the Land and Water Conservation Fund; natural beauty, the message and the conference; the Water Quality Act; the air pollution and solid waste acts; the Highway Beautification Act. The natural heritage message; the preservation and endangered species acts; the Clean Water Restoration Act; Indiana Dunes. The 1967 message; the Air Quality Act; Oregon's Beach Bill.
  - id: cal.thread.consumers
    s: Consumer protection
    c: 'Consumer protection: credit, meat, fabrics, products. The message of Feb. 16, 1967; Betty Furness; truth in lending through the Senate; meat inspection and the Wholesome Meat Act; the Product Safety Commission; the Flammable Fabrics amendments.'
  - id: cal.thread.court
    s: Court
    c: The Supreme Court's October 1959 to October 1965 Terms, its new Justices, and Congress's answers. *Raines*; *Elkins*; *Gomillion*; *Boynton*; *Mapp*; *Baker v. Carr*, argued, reargued, decided; *Engel v. Vitale*; White and Goldberg for Whittaker and Frankfurter.
    c2: The Supreme Court's October 1960 to October 1967 Terms, its new Justices, and Congress's answers. *Gideon*; *Gray v. Sanders*; the sit-in cases; *Schempp*; *Wesberry*; *New York Times v. Sullivan*; *Reynolds v. Sims*; *Escobedo*; the Tuck bill and the Dirksen rider; *Heart of Atlanta*; *Griswold*; Fortas for Goldberg; Dirksen's apportionment amendment; *Albertson*. *South Carolina v. Katzenbach*; *Harper*; *Miranda*; *Katzenbach v. Morgan*; *Bond v. Floyd*. *Keyishian*; *Gault*; *Reitman v. Mulkey*; *Loving*; *Walker*; *Curtis v. Butts*; Marshall for Tom Clark; *Katz*; Dirksen's convention.
  - id: cal.thread.crime-and-hijacking
    s: Crime and hijacking
    c: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. Three hijackings, May–Aug. 1961; aircraft piracy a federal crime; the Wire and Travel Acts.
    c2: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. Hoffa convicted; the 1965 crime message; the Crime Commission; the Law Enforcement Assistance Act. The Bail Reform Act; Austin and the gun bill; the narcotic addict act; the District crime bill vetoed. The 1967 message; the Commission's report; the Safe Streets bill through the House; the District crime act; Kirk's "war on crime"; the Mulford Act; executions in California and Colorado.
  - id: cal.thread.cuba
    s: Cuba
    c: Cuba short of the missile crisis, and after. Mikoyan in Havana; the covert program; the sugar quota and the nationalizations; the embargo; the break; the Bay of Pigs and its inquiry; Mongoose; Punta del Este; Northwoods; the prisoners' ransom; the Orange Bowl.
    c2: Cuba short of the missile crisis, and after. NSAM 213; the exile raids; the sabotage program; Attwood and Lechuga; Guantanamo's water; Camarioca and the refugee airlift. The Cuban Adjustment Act. Guevara killed in Bolivia.
  - id: cal.thread.defense
    s: Defense
    c: Strategy and the defense budget. The missile gap in the hearings; Polaris at sea; the SIOP; the farewell address; McNamara's no missile gap; the March budget; the Berlin increase; civil defense to the Pentagon; Gilpatric at Hot Springs; the RS-70; counterforce at Ann Arbor.
    c2: Strategy and the defense budget under McNamara. The TFX hearings; the draft extended; *Thresher*; Anderson and Korth out; the A-11; the draft study; the base-closing veto. Palomares; the supplemental; the deferment test; McNamara at Montreal; the Marshall commission; the reserves amendment; the ABM. Kosygin's reply on talks; the "Chinese-oriented" ABM; the Military Selective Service Act; the women officers' act; McNamara to the World Bank.
  - id: cal.thread.desegregation-public-places
    s: 'Desegregation: public places'
    c: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. *Boynton*; Burton; the Freedom Rides and the ICC order; Albany; Garner. Gallup on the Freedom Riders and on integration.
    c2: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. Birmingham; the sit-in cases; Watson; Jackson; the public accommodations title; Heart of Atlanta. Gallup on integration. *Evans v. Newton*; *Brown v. Louisiana*. Maryland's public accommodations law extended.
  - id: cal.thread.desegregation-schools
    s: 'Desegregation: schools'
    c: Schools and universities opened under federal court orders, each event in its own thread. New Orleans; Georgia; Atlanta; Meredith at Oxford. Gallup on school integration.
    c2: Schools and universities opened under federal court orders, each event in its own thread. Gantt at Clemson; Goss; the schoolhouse door; Alabama's schools in September; Prince Edward's Free Schools; the New York boycott. Gallup on school integration. Grenada; the guidelines in the House. Alabama's statewide order; Boston's Racial Imbalance Act upheld; the track system struck in Washington.
  - id: cal.thread.draft
    s: Draft
    c: Selective Service. The message and the Marshall Commission's lottery; Muhammad Ali's refusal and conviction; the Military Selective Service Act; Stop the Draft Week; Hershey's letter to the boards and his statement with Ramsey Clark; the Boston indictments.
  - id: cal.thread.economy
    s: Economy
    c: The recession of 1960–61, the recovery, and the tax cut. The peak; the London gold price; the balance-of-payments directive; the task force; the trough; the Fed's long rates; the gap; the debt limit; the 1962 Report; the May slide; depreciation; the investment credit; the Economic Club.
    c2: The recession of 1960–61, the recovery, and the tax cut. The tax message; the House's 271–155; the interest equalization tax; the Revenue Act of 1964; the discount rate to 3½, then 4; the gold cover; the excise tax cut; Martin at Columbia; the coinage act; the Fed's December rise. The Tax Adjustment Act; Brimmer; the Fed's squeeze; the investment credit suspended; the interest rate act; the cutback. The surcharge proposed, then set aside by Ways and Means; the investment credit restored; the debt limit; the August message; special drawing rights; sterling devalued; the balance-of-payments program of Jan. 1, 1968.
  - id: cal.thread.elections-1960
    s: Elections of 1960
    c: The 1960 election, from the announcements to the count. The primaries, Mar. 8 to June 7 (CQ's returns); Wisconsin and West Virginia; Los Angeles and Chicago; the Treaty of Fifth Avenue; Houston; the four debates; King's arrest; Nov. 8; Hawaii's recount; the electors; the count, Jan. 6.
  - id: cal.thread.elections-1961
    s: Elections of 1961
    c: 'The off-year elections of 1961. Governors: Hughes in New Jersey, Harrison in Virginia. Mayors: Yorty over Poulson; Wagner against Tammany, then re-elected; Allen over Maddox in Atlanta; Cavanagh over Miriani in Detroit; Cowger in Louisville.'
  - id: cal.thread.elections-1962
    s: Elections of 1962
    c: The primaries and midterms of 1962. Connally and Wallace; Nixon in California; Edward Kennedy against McCormack; Nov. 6; Nixon's last press conference.
    c2: The primaries and midterms of 1962. Minnesota's recount, Rolvaag declared elected.
  - id: cal.thread.elections-1963
    s: Elections of 1963
    c: 'The off-year elections of 1963. Mayors: Boutwell over Connor in Birmingham; Daley over Adamowski; McKeldin in Baltimore; Tate, Shelley, Collins. Governors: Breathitt in Kentucky; Paul Johnson in Mississippi, beside the Freedom Vote; McKeithen in Louisiana.'
  - id: cal.thread.elections-1964
    s: Elections of 1964
    c: The elections of 1964, from the race for the nominations to the result. The Goldwater draft, its Chicago meetings.
    c2: The elections of 1964, from the race for the nominations to the result. Rockefeller; the Goldwater draft; Goldwater announces; the primaries, Mar. 10 to June 2 (CQ's returns); San Francisco, July 13, and Atlantic City, Aug. 24; Smith announces; Scranton enters; his letter; the platform fight; Goldwater nominated; the Johnson–Goldwater meeting; the Cabinet ruled out; Hershey; Johnson and Humphrey nominated; Robert Kennedy for the Senate; the Daisy ad; Thurmond a Republican; the Lady Bird Special; Jenkins; "A Time for Choosing"; Nov. 3; the concession; Burch for Bliss.
  - id: cal.thread.elections-1964-polls
    s: 'Elections of 1964: polls'
    c: Gallup on 1964, the Republicans' choice and Kennedy against each. Nixon first; Rockefeller over Goldwater; Kennedy 65, Nixon 35; Rockefeller ahead, Nov. 1962.
    c2: Gallup on 1964, the Republicans' choice and the President against each. Goldwater past Rockefeller, May 1963; Johnson after Nov. 22; Lodge after New Hampshire; Robert Kennedy for Vice President; the county chairmen; Scranton over Goldwater among Republicans; Johnson 65, Goldwater 29, August; the final poll, 64–29.
  - id: cal.thread.elections-1965
    s: Elections of 1965
    c: The off-year elections of 1965. Lindsay over Beame and Buckley in New York; Hughes re-elected and Godwin elected governors; Yorty, Cavanagh and Barr re-elected; Locher over Stokes; Cervantes in St. Louis; Bond to the Georgia House.
  - id: cal.thread.elections-1966
    s: Elections of 1966
    c: The primaries and midterms of 1966. Lurleen Wallace; Reagan; the Virginia, Tennessee and Michigan primaries; Maddox; Brooke; Nov. 8; the Georgia governorship to the legislature, Maddox chosen; Reagan sworn.
  - id: cal.thread.elections-1967
    s: Elections of 1967
    c: 'The off-year elections of 1967. Mayors: Daley''s fourth term; Hatcher at Gary, Stokes at Cleveland; Tate over Specter; White over Hicks; Alioto, Lugar, D''Alesandro, Loeb. Governors: McKeithen renominated; Nunn in Kentucky; Williams in Mississippi. New Jersey''s Senate Republican; Reid to Virginia''s House of Delegates; New York''s constitution refused.'
  - id: cal.thread.elections-1968
    s: Elections of 1968
    c: 'The 1968 nominations: Gallup''s trial heats and the parties'' choices from 1966; Nixon''s preparations; Romney''s "brainwashing" and his announcement; McCarthy against Johnson; the primaries, Mar. 12 to June 11 (CQ''s returns), and the conventions, Miami Beach, Aug. 5, and Chicago, Aug. 26. The rest of the year not yet written.'
  - id: cal.thread.elections-1972
    s: Elections of 1972
    c: 'The 1972 nominations: the primaries, Mar. 7 to June 6 (CQ''s returns), and the conventions, both at Miami Beach, July 10 and Aug. 21. The rest of the year not yet written.'
  - id: cal.thread.elections-1976
    s: Elections of 1976
    c: 'The 1976 nominations: the primaries, Feb. 24 to June 8 (CQ''s returns), and the conventions, New York, July 12, and Kansas City, Aug. 16. The rest of the year not yet written.'
  - id: cal.thread.europe-and-the-alliance
    s: Europe and the alliance
    c: Britain, Germany, France, Turkey, and the alliance's nuclear arms. Macmillan at Camp David; de Gaulle's visit; Herter's NATO force; the Turkish coup; Cyprus independent; the Acheson directive; the Ottawa pledge; the Jupiters kept; Menderes hanged; Bermuda; Athens; Makarios at the White House; the Declaration of Interdependence; the Jupiters to go; Skybolt cancelled; Nassau.
    c2: Britain, Germany, France, Turkey, and the alliance's nuclear arms. De Gaulle's veto; the Élysée treaty and the Bundestag's preamble; the MLF; Kennedy in Europe; Erhard at the Ranch; Cyprus, from the Nicosia fighting through the Turkish strikes and Acheson's plan; France recognizes Peking; Wilson's victory; the sterling crisis; Churchill's funeral; McNamara's select committee; Rhodesia. Palomares; France out of NATO's commands; Erhard's offset; "peaceful engagement"; NATO to Brussels; Kiesinger; the Nuclear Planning Group and Harmel's study. Adenauer's funeral; the colonels in Athens; the trilateral talks and the redeployment; Kiesinger at the White House; Cyprus again, Vance's mission; sterling devalued; the Harmel report; Constantine's countercoup.
  - id: cal.thread.european-community
    s: European Community
    c: The Six and the Seven, and Britain's first application. The OEEC remade; the EFTA in force and the Six speeded; Macmillan applies; Heath at Paris; Hallstein at the White House; the farm policy; carpets and glass; the Fouchet plan fails; the Grand Design; Brighton.
    c2: The Six and the Seven, and Britain's applications. The veto; Monnet; *Van Gend en Loos*; the Bundestag's preamble; the chicken war; *Costa v. ENEL*; the surcharge; the grain price; the Merger Treaty; the empty chair and the Luxembourg compromise; Wilson's new approach. The Kennedy Round concluded; de Gaulle's second veto.
  - id: cal.thread.farm
    s: Farm
    c: Price supports and production controls. Eisenhower's wheat message; the emergency feed grain program; the farm bill's defeat and the 1962 act.
    c2: Price supports and production controls. The wheat referendum; the Feed Grain Act of 1963; the Agricultural Act of 1964; the Food Stamp Act; the Food and Agriculture Act of 1965. Food for Freedom; grain for India; the Food for Peace Act of 1966. Food for India again; food stamps extended; the Wholesome Meat Act.
  - id: cal.thread.foreign-aid
    s: Foreign aid
    c: The aid program remade, and cut. The Mutual Security Act of 1960; the March message; AID created, long-term borrowing denied; the 1962 act and the Hickenlooper amendment.
    c2: The aid program remade, and cut. The Clay report; the 1963 cuts; the Christmas Eve vote; the IDA bill; the Foreign Assistance Acts of 1964 and 1965; Food for Peace extended; the UAR ban. The Asian Development Bank; the Foreign Assistance Act of 1966. The 1967 message; the Punta del Este pledge; food for India; the Foreign Assistance Act of 1967; the appropriation recommitted, then passed.
  - id: cal.thread.freedom-rides
    s: Freedom Rides
    c: CORE's rides to test *Boynton*, May 1961, and the ICC order that came of them. Anniston; Montgomery; Jackson and Parchman; the petition; the order, in force Nov. 1.
    c2: CORE's rides to test *Boynton*, May 1961, and the ICC order that came of them. *Pierson v. Ray*, the Jackson clergymen's suit.
  - id: cal.thread.georgia
    s: Georgia
    c: 'Georgia, 1960–66: the university, Albany, the county unit, Penn''s murder. King at Rich''s and Reidsville; Holmes and Hunter admitted at Athens; Robert Kennedy''s Law Day there; Atlanta''s high schools; the station test at Albany; the Albany Movement; King jailed, December and July; Elliott''s injunction; King leaves Albany.'
    c2: 'Georgia, 1961–67: the university, Albany, the county unit, Penn''s murder. *Gray v. Sanders*; *Wesberry v. Sanders*; the Georgia House malapportioned; Maddox''s Pickrick; Lemuel Penn killed; the Danielsville acquittal; Johnson at Macon and Augusta; Callaway the State''s first Republican Representative since Reconstruction; Bootle dismisses the indictment; Bond refused his seat. Summerhill; Maddox nominated; *Bond v. Floyd*; the governorship to the legislature. Bond sworn; Maddox chosen; *Whitus v. Georgia*; Dixie Hills.'
    aliases: [cal.thread.albany]
  - id: cal.thread.goldwater
    s: Goldwater
    c: Barry M. Goldwater. The Republican right, Chicago, Atlanta and the Garden; the draft, its Chicago meetings of 1961 and 1962.
    c2: Barry M. Goldwater. The draft, to the National Draft Goldwater Committee; Kennedy, Johnson, and the campaign of 1964; the primaries, San Francisco, the defeat; the party after it.
  - id: cal.thread.governors
    s: Governors
    c: The races for governor, primaries and generals, and the governors' acts beside them. Davis over Morrison; Sanford over Lake; Kerner, Volpe, Andersen; Wallace's primary and runoff; Connally over Don Yarborough; Brown over Nixon; Romney, Scranton, Rhodes; Bellmon, Oklahoma's first Republican; Hoff and King in New England; Minnesota to a recount.
    c2: The races for governor, primaries and generals. Rolvaag declared elected; Paul Johnson, Breathitt, McKeithen; Peabody beaten in his primary, Volpe back; Kerner over Percy; Evans; Burns and High; Lurleen Wallace; Reagan over Brown; Winthrop Rockefeller and Kirk; Agnew over Mahoney; Maddox, Callaway and the legislature. Reagan's inaugural; McKeithen renominated; Nunn in Kentucky, Williams in Mississippi; Connally not to run.
  - id: cal.thread.health
    s: Health
    c: 'Health policy other than Medicare: drugs, mental health, the health professions. Thalidomide and Kelsey; the Drug Amendments.'
    c2: 'Health policy other than Medicare: drugs, mental health, the health professions. The mental health and retardation message and acts; maternal and child health; health professions; *Smoking and Health*; the DeBakey commission; the cigarette labeling act; heart disease, cancer, and stroke. Medicare in effect; the health planning and allied health acts. Colorado''s and California''s abortion laws; California''s mental health act; Medi-Cal''s cuts struck.'
  - id: cal.thread.immigration
    s: Immigration
    c: The national-origins quotas and their repeal. The 1960 message; the refugee resolution; the Cuban refugee program; the 1961 amendments; the braceros extended; the Hong Kong parole; the refugee assistance act; the waiting lists cleared.
    c2: The national-origins quotas and their repeal. The 1963 message; the 1965 message; the House, the Senate, and the act signed at Liberty Island, Oct. 3, 1965. The Cuban Adjustment Act.
  - id: cal.thread.india-and-china
    s: India and China
    c: India's wars, American arms for India, and South Asia and Indonesia. Goa; the Chinese attack of October 1962; Nehru's request; Harriman's mission.
    c2: India's wars, American arms for India, and South Asia and Indonesia. Nehru's death; the Rann of Kutch; the Indo-Pakistani war and the cease-fire; Indonesia's coup; Ayub Khan in Washington; Tashkent. Indira Gandhi; Suharto's takeover; the China hearings; the rupee devalued; the Cultural Revolution; the short tether; China's seat at the UN. Food for India; Sukarno's mandate withdrawn; China's hydrogen bomb.
  - id: cal.thread.intelligence
    s: Intelligence
    c: The CIA at home. Its money for the National Student Association made public; the Katzenbach committee's rule against covert support of private bodies.
  - id: cal.thread.japan-and-korea
    s: Japan and Korea
    c: The alliances with Japan and South Korea. The security treaty signed; Rhee's fall; the Diet's vote and the riots; Hagerty mobbed and the visit cancelled; the Senate's consent; Kishi out, Ikeda in; Chang Myon's government; Reischauer to Tokyo; Park's coup; Ikeda in Washington; the Ryukyus task force; Hakone; Park in Washington; the Ryukyus order.
    c2: The alliances with Japan and South Korea. Park's return to civilian rule and his election; the equalization tax and Japan; Reischauer stabbed; martial law in Seoul; Satō; Korean troops for Vietnam; the Japan–Korea treaty; Satō on Okinawa; the status of forces agreement; Johnson at Seoul. Satō at the White House, the Bonins and the Ryukyus.
  - id: cal.thread.jobs-and-wages
    s: Jobs and wages
    c: Unemployment, depressed areas, and wages. The area redevelopment veto; the minimum wage held over; the recovery message; the minimum wage; area redevelopment; federal employees' unions; manpower training; public works acceleration.
    c2: Unemployment, depressed areas, and wages. Youth employment; area redevelopment's 1963 defeat; the 1964 Manpower Report; the Appalachian act; the area-development message; the public works act; 14(b) refused cloture; New York's transit strike. 14(b) refused again; the airline strike; the Fair Labor Standards Amendments of 1966. New York's Taylor Law; the shopcraft strike and the Special Board; the Appalachian amendments; the Age Discrimination in Employment Act.
  - id: cal.thread.robert-kennedy
    s: Robert Kennedy
    c: 'Robert F. Kennedy, Attorney General: named; the Cuba Study Group and Mongoose; the back channel through Bolshakov; the Freedom Rides, Oxford; organized crime and Hoffa; the missile crisis.'
    c2: 'Robert F. Kennedy, Attorney General: Birmingham; organized crime and Hoffa; the King wiretaps. Johnson: the vice presidency refused him; Senator from New York. On the NLF; in South Africa; the Manchester suit. The Paris signal; against the bombing; the hunger hearings at Jackson.'
  - id: cal.thread.king
    s: King
    c: Martin Luther King, Jr. The President, the Attorney General, the Bureau. The perjury trial; Rich's and Reidsville; Montgomery's church besieged; Albany.
