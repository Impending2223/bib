  - id: cal.thread.baker
    s: Bobby Baker
    c: The Senate majority's secretary and the Rules Committee's inquiry. The resignation; Reynolds before the committee's staff; Johnson's statement; the Williams resolution tabled; the Select Committee on Standards and Conduct; the inquiry reopened.
    c3: The Senate majority's secretary and the Rules Committee's inquiry. Baker convicted.
  - id: cal.thread.berlin-and-vienna
    s: Berlin and Vienna
    c: The second Berlin crisis, from Khrushchev's demands to the wall and after, and the Vienna summit. Adenauer at the White House; the East German permits; Acheson's review; Bolshakov; Vienna and the aide-mémoire; the July 25 address and the call-up; Aug. 13; Johnson and Clay in Berlin; the negotiating program; Checkpoint Charlie; Powers for Abel; Fechter.
    c2: The second Berlin crisis, from Khrushchev's demands to the wall and after, and the Vienna summit. Kennedy in Berlin; Erhard and Schröder in Washington.
    c3: The second Berlin crisis, from Khrushchev's demands to the wall and after, and the Vienna summit. East Germany's passports and visas for West Germans; Rusk to Kuznetsov; Johnson to Kiesinger.
  - id: cal.thread.black-nationalism
    s: Black nationalism
    c: Malcolm X and the Nation of Islam, and Black Power. "Message to the Grass Roots"; the "chickens" remark and the suspension; the break, the Muslim Mosque; "The Ballot or the Bullet"; the Organization of Afro-American Unity; the assassination.
    c3: Malcolm X and the Nation of Islam, and Black Power. CORE's "black power"; the Black Panther Party founded; Ali refuses induction; the Panthers at Sacramento; the Black Power conference at Newark; the Mulford Act; the FBI's counterintelligence program, widened; Newton's arrest, trial and conviction; Glenville; Smith and Carlos at Mexico City.
  - id: cal.thread.china
    s: China
    c: 'Communist China: its bomb, its seat at the UN, its quarrel with Moscow, its part in Vietnam, the ambassadorial talks at Warsaw. The Soviet experts recalled; Peking kept out of the UN another year; the refugees at Hong Kong paroled; the attack on India, the cease-fire.'
    c2: 'Communist China: its bomb, its seat at the UN, its quarrel with Moscow, its part in Vietnam, the ambassadorial talks at Warsaw. Liu Shaoqi at Hanoi; the test ban refused; France recognizes Peking; Zhou Enlai''s cable on the Gulf of Tonkin; China''s first atomic test; Zhou Enlai in Moscow; Kosygin with Mao; the Warsaw talks on the war; Chen Yi''s four points through London; the engineers and the antiaircraft divisions into North Vietnam; Lin Biao''s "people''s war"; Gallup on its admission.'
    c3: 'Communist China: its bomb, its seat at the UN, its quarrel with Moscow, its part in Vietnam, the ambassadorial talks at Warsaw. Gallup on its admission; the China hearings, Humphrey on containment without isolation; "reconciliation" at the Alumni Council; China''s third test; the Cultural Revolution, the Sixteen Points, the Red Guards; the seat refused; Gallup on the threat to peace; Nixon with Ceaușescu and Chiang; the hydrogen bomb; the "Chinese-oriented" ABM; Nixon''s "Asia After Viet Nam"; Rusk''s "billion Chinese"; Chen Yi to Lê Đức Thọ; the Warsaw talks put off.'
