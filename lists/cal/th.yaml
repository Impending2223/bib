    c: The Soviet decision, the warnings, the thirteen days, the IL-28s.
  - id: cal.thread.mississippi
    s: Mississippi
    c: SNCC's voter registration in McComb; Herbert Lee; Meredith and Oxford.
  - id: cal.thread.opinion
    s: Opinion
    c: Gallup's approval readings, and the public on Cuba, the Freedom Riders, Medicare.
  - id: cal.thread.peace-corps
    s: Peace Corps
    c: Order, volunteers, statute, the postcard.
  - id: cal.thread.press-and-broadcasting
    s: Press and broadcasting
    c: The live press conference; the publishers; Minow; the White House tour; managed news.
