  - id: cal.thread.amendments
    s: Constitutional amendments
    c: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The Twenty-third Amendment through Congress, Hawaii first, Arkansas refusing, ratified and put into law; the equal rights amendment recommitted; Kefauver's hearings; the poll tax amendment through both Houses, Illinois first, Mississippi refusing; *Engel* and the prayer amendments; the Council of State Governments' three amendments.
    c2: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The telegram to the governors and the poll tax amendment ratified, the Twenty-fourth; the Court of the Union in Gallup; the women's commission, no equal rights amendment; the applications for a convention, 1963–65; Bayh's amendment on disability and the Vice Presidency, from the hearings through both Houses to the States; the Becker amendment's hearings; the apportionment amendments, Dirksen's refused in the Senate; the equal rights amendment reported; the four-year House term.
    c3: Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The four-year House term asked and heard; the electoral college reform asked again; the prayer amendment introduced; Dirksen's apportionment amendment refused again; the Twenty-fifth Amendment ratified and certified; the prayer amendment heard and refused; the District's representation asked, heard, reported; Ervin's convention bill, heard; the States' applications for a convention, by year; the vote at eighteen heard and asked; Gallup's questions.
  - id: cal.thread.consumers
    s: Consumer protection
    c: 'Consumer protection: credit, meat, fabrics, products. The message of Feb. 16, 1967; Betty Furness; truth in lending through the Senate; meat inspection and the Wholesome Meat Act; the Product Safety Commission; the Flammable Fabrics amendments.'
  - id: cal.thread.crime-and-hijacking
    s: Crime and hijacking
    c: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. Three hijackings, May–Aug. 1961; aircraft piracy a federal crime; the Wire and Travel Acts.
    c2: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. McClellan's hearings, Valachi; Hoffa convicted; Mississippi's laws against Freedom Summer; the death penalty ended in Oregon, Iowa, West Virginia and New York; the 1965 crime message; the Crime Commission; the Law Enforcement Assistance Act.
    c3: Robert Kennedy's crime bills, the first hijackings to Cuba, and Johnson's crime program. The 1966 message; *Miranda*; the Bail Reform Act; New York's civilian review board, named and voted down; Austin and the gun bill; the narcotic addict act; the District crime bill vetoed; Kirk's "war on crime"; the 1967 message; the Commission's report; executions in California and Colorado; the Mulford Act; the Safe Streets bill through the House; *Katz*; the District crime act; "To Insure the Public Safety"; the Violence Commission; the Omnibus Crime Control and Safe Streets Act; *Terry*; the Gun Control Act.
