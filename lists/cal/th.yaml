    c2: The movement in Mississippi, Meredith's admission, Evers, and Freedom Summer. Greenwood; the Commission's report; Jackson; Evers killed; Louis Allen killed; Beckwith's second trial; Barnett spared a jury; Freedom Summer; Chaney, Goodman, Schwerner; Hoover at Jackson; the bodies found; the Freedom Democrats at Atlantic City; the McComb women at the White House; the arrests; the House dismisses the Freedom Democrats' contests.
  - id: cal.thread.opinion
