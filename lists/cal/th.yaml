  - id: cal.thread.congress
    s: Congress
    c: 'Congress as an institution: its leaders and sessions. The 86th''s second session; Hennings''s corrupt practices bill through the Senate; the recess for the conventions and the August return; Kennedy''s seat resigned, Smith appointed; Mansfield majority leader; the leaders'' weekly breakfasts; Rayburn''s death; McCormack Speaker; the second session''s end, Oct. 13, 1962.'
    c2: 'Congress as an institution: its leaders and sessions. The 88th''s opening; Clark on the Senate establishment; the pay bill defeated, then passed; Edward Kennedy''s crash; Salinger for Engle; the 88th''s end; the Freedom Democrats'' contests; Mondale for Humphrey; the 89th''s opening, Ford for Halleck; Watson leaves; the Joint Committee on the Organization of the Congress; the contests dismissed; the first session''s end; Byrd resigns.'
    c3: 'Congress as an institution: its leaders and sessions. The second session; 14(b) again; the Fulbright hearings; Griffin for Patrick McNamara; Long''s campaign fund; the 90th''s opening; Powell excluded; the reorganization bill through the Senate; the House''s ethics committee; Dodd censured; the Election Reform Act; the first session''s end; the Senate''s code of conduct; the surcharge; Goodell for Robert Kennedy; the 91st''s opening, Edward Kennedy whip; Rule XXII.'
