    thread: opinion
    also: [cuba]
    c: 'Gallup, May 2–7: the administration''s handling of Cuba in recent weeks, 45 percent satisfied, 35 dissatisfied. Republicans 27 and 54.'
    n: '[[w.gallup-poll]], III, 1819.'
  - id: cal.1963-05-26.opinion-5
    when: May 26
    date: '1963-05-26'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, May 8–13: Republicans'' choice for 1964: Goldwater 35, Rockefeller 30, Romney 22; others, no preference 13. Independents: Goldwater 33, Rockefeller 28. Goldwater''s first lead.'
    n: '[[w.gallup-poll]], III, 1819. Names: Goldwater (Opp. III.B); Rockefeller, Romney (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1963-05-27.court
    when: May 27
    date: '1963-05-27'
    thread: court
    also: [desegregation-public-places]
    c: '*Watson v. City of Memphis*, [373 U.S. 526](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373526/usrep373526.pdf). The city''s parks to be desegregated now; "deliberate speed" no warrant for indefinite delay. Goldberg for a unanimous Court.'
    n: 'Powe (see [[cal.1963-05-20.court]]). Names: Goldberg (K–J Cong. III.G).'
    tags: [name:goldberg-arthur-j]
  - id: cal.1963-05-27.opinion-5
    when: May 27
    date: '1963-05-27'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, May 8–13: Kennedy 60, Goldwater 36, undecided 4; Kennedy 60, Romney 35, undecided 5.'
    n: '[[w.gallup-poll]], III, 1820. Names: Goldwater (Opp. III.B); Romney (Opp. III.H).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m, name:romney-george-w]
  - id: cal.1963-05-28.mississippi
    when: May 28
    date: '1963-05-28'
    thread: mississippi
    also: [desegregation-public-places, students]
    c: Jackson. Tougaloo students sit in at Woolworth's lunch counter; a crowd beats them for three hours, police outside. The Jackson movement, Evers and the NAACP at its head, begins its marches.
    n: '[[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]; [[w.moody-coming-of-age-in]]; [[w.salter-jackson-mississippi]]; [[w.obrien-we-shall-not-be]]. See [[cal.1962-10-01.mississippi]]. Names: Evers (K–J Cong. III.H).'
    tags: [name:evers-medgar]
