# Cal. XXXI May 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXI
entries:
  - id: cal.1963-05-02.alabama
    when: May 2–7
    date: '1963-05-02'
    thread: alabama
    c: 'Birmingham. The children''s march: hundreds of schoolchildren arrested, May 2. May 3: Connor turns fire hoses and police dogs on them in Kelly Ingram Park. By May 7 the jails full; Wallace sends state troopers.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-164) (May 8, 1963). McWhorter, *Carry Me Home* (K–J Cong. II.F). Branch, *Parting the Waters* (K–J Adm. II.C). See [[cal.1963-04-03.alabama]]. Names: Connor (K–J Cong. III.K); Wallace (K–J Cong. III.F).'
    tags: [name:connor-eugene, name:wallace-george-c]
  - id: cal.1963-05-04.elections-1964
    when: May 4
    date: '1963-05-04'
    thread: elections-1964
    c: Rockefeller, divorced in 1962, marries Margaretta Fitler Murphy, divorced a month before.
    n: 'Smith, *On His Own Terms*; Persico, *The Imperial Rockefeller* (Opp. II.C). Novak, *The Agony of the G.O.P. 1964* (Opp. II.A). See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller (Opp. III.H); Margaretta Rockefeller (K–J Cong. III.K).'
    tags: [name:rockefeller-nelson, name:rockefeller-margaretta-fitler]
  - id: cal.1963-05-06.testing
    when: May 6
    date: '1963-05-06'
    thread: testing
    c: 'NSAM 239: the Geneva talks stalled; ACDA to look for steps short of general disarmament, with the test ban still sought.'
    n: '[FRUS 1961–63, VII, doc. 284](https://history.state.gov/historicaldocuments/frus1961-63v07/d284). See [[cal.1963-04-24.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-08.vietnam
    when: May 8
    date: '1963-05-08'
    thread: vietnam
    c: 'Hue, the Buddha''s birthday. Buddhist flags banned; a crowd at the radio station for Tri Quang''s address, refused. Troops and armored cars fire; eight killed by the consul''s first count. The government blames the Viet Cong.'
    n: 'FRUS 1961–63, III, docs. [112](https://history.state.gov/historicaldocuments/frus1961-63v03/d112), [117](https://history.state.gov/historicaldocuments/frus1961-63v03/d117), [118](https://history.state.gov/historicaldocuments/frus1961-63v03/d118). Hammer, *A Death in November* (Viet. II.B.12). Schecter, *The New Face of Buddha*; Luu, *The Buddhist Crises in Vietnam*; Vũ Văn Mẫu, *Sáu Tháng Pháp Nạn 1963* (Viet. II.B.11). Winters, *The Year of the Hare*; Jones, *Death of a Generation* (Viet. II.B.8). Halberstam, *The Making of a Quagmire*; Browne, *The New Face of War*; Higgins, *Our Vietnam Nightmare* (Viet. I.C). Anne E. Blair, *Lodge in Vietnam: A Patriot Abroad* (1995). Names: Thich Tri Quang (Viet. III.G).'
    tags: [name:thich-tri-quang, name:helble-john-j]
  - id: cal.1963-05-08.testing
    when: May 8
    date: '1963-05-08'
    thread: testing
    c: 'Khrushchev''s reply to the Kennedy–Macmillan letter: the seismic "black boxes" enough, inspection a cover for spying, seven or eight "unserious." But Moscow "happy to receive" the American and British representatives.'
    n: '[FRUS 1961–63, VII, doc. 285](https://history.state.gov/historicaldocuments/frus1961-63v07/d285). See [[cal.1963-04-24.testing]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1963-05-10.alabama
    when: May 10
    date: '1963-05-10'
    thread: alabama
    c: 'Shuttlesworth and King announce the Birmingham settlement, Marshall mediating: lunch counters, rest rooms, fitting rooms, and fountains desegregated within ninety days; Negroes hired as clerks; the jailed released. Connor and the old commission reject it.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-164) (May 8, 1963). Navasky, *Kennedy Justice* (K–J Adm. II.C). See [[cal.1963-04-03.alabama]]. Names: Shuttlesworth, King (K–J Cong. III.H); Marshall (K–J Adm. III.I); Connor (K–J Cong. III.K).'
    tags: [name:shuttlesworth-fred, name:king-martin-luther-jr, name:marshall-burke, name:connor-eugene]
  - id: cal.1963-05-11.alabama
    when: May 11–13
    date: '1963-05-11'
    thread: alabama
    c: 'Bombs at the house of King''s brother and at the Gaston Motel, the night of the 11th. Rioting till morning. May 12, on television: troops trained in riot control to bases near Birmingham; the Alabama Guard readied for federal service. May 13: telegram to Wallace, 10 U.S.C. § 333.'
    n: '[Radio and Television Remarks Following Renewal of Racial Strife in Birmingham](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-following-renewal-racial-strife-birmingham) (May 12, 1963). [Telegram to Governor Wallace of Alabama](https://www.presidency.ucsb.edu/documents/telegram-governor-wallace-alabama) (May 13, 1963). *Alabama v. United States*, [373 U.S. 545](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373545/usrep373545.pdf) (1963) (Wallace''s suit against the troops refused, May 27). See [[cal.1963-04-03.alabama]]. Names: Wallace (K–J Cong. III.F); McNamara (K–J Adm. III.F); Marshall (K–J Adm. III.I).'
    tags: [name:kennedy-john-f, name:wallace-george-c, name:mcnamara-robert-s, name:marshall-burke]
  - id: cal.1963-05-14.railroads
    when: May 14
    date: '1963-05-14'
    thread: railroads
    c: Emergency Board No. 154 reports. A nationwide strike threatened within thirty days; the parties urged to accept.
    n: '[Statement by the President Upon Receiving Emergency Board Report on the Railway Labor Dispute](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-receiving-emergency-board-report-the-railway-labor-dispute) (May 14, 1963). See [[cal.1963-04-03.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-15.space
    when: May 15–16
    date: '1963-05-15'
    thread: space
    c: Cooper's *Faith 7*, twenty-two orbits, thirty-four hours. The automatic controls fail; he flies the reentry by hand. The last Mercury flight.
    n: '[Radio and Television Remarks Following the Flight of Astronaut L. Gordon Cooper](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-following-the-flight-astronaut-l-gordon-cooper) (May 16, 1963). See [[cal.1961-04-12.space]]. Names: Cooper (K–J Cong. III.K).'
    tags: [name:cooper-l-gordon-jr, name:kennedy-john-f]
  - id: cal.1963-05-15.economy
    when: May 15
    date: '1963-05-15'
    thread: economy
    c: House raises the temporary debt limit to $307 billion through June, $309 billion through Aug. 31, [213–204](https://voteview.com/rollcall/RH0880028). Senate, [60–24](https://voteview.com/rollcall/RS0880070), May 28; signed May 29.
    n: '[Pub. L. No. 88-30, 77 Stat. 50](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg50.pdf) (1963). See [[cal.1961-06-30.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-20.court
    when: May 20
    date: '1963-05-20'
    thread: court
    c: 'The sit-in cases. *Peterson v. City of Greenville*, [373 U.S. 244](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373244/usrep373244.pdf): trespass convictions reversed where a city ordinance required segregation. Warren for the Court; Harlan concurs in part. *Lombard v. Louisiana*, [373 U.S. 267](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373267/usrep373267.pdf): the same where officials had declared sit-ins unlawful.'
    n: 'Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1961-12-11.court]]. Names: Warren, Harlan (K–J Cong. III.G).'
    tags: [name:warren-earl, name:harlan-john-marshall]
  - id: cal.1963-05-20.program
    when: May 20–21
    date: '1963-05-20'
    thread: program
    c: Feed Grain Act signed. Senate had passed it [45–35](https://voteview.com/rollcall/RS0880060), May 16. May 21, wheat referendum. Growers reject the certificate plan, two-thirds being needed. Check the vote.
    n: '[Pub. L. No. 88-26, 77 Stat. 44](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg44.pdf) (1963). [Remarks Upon Signing the Feed Grain Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-feed-grain-bill) (May 20, 1963). [Statement by the President on the Results of the Wheat Referendum](https://www.presidency.ucsb.edu/documents/statement-the-president-the-results-the-wheat-referendum) (May 22, 1963). See [[cal.1962-09-27.program]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-24.civil-rights-the-executive
    when: May 24
    date: '1963-05-24'
    thread: civil-rights-the-executive
    c: Robert Kennedy meets James Baldwin and a dozen others Baldwin brought, at the Kennedy apartment in New York. Three hours.
    n: 'Branch, *Parting the Waters* (K–J Adm. II.C). Guthman, *We Band of Brothers* (K–J Adm. II.G.6). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Robert F. Kennedy (K–J Adm. III.A); Baldwin (K–J Cong. III.K).'
    tags: [name:kennedy-robert-f, name:baldwin-james]
  - id: cal.1963-05-27.court
    when: May 27
    date: '1963-05-27'
    thread: court
    c: '*Watson v. City of Memphis*, [373 U.S. 526](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373526/usrep373526.pdf). The city''s parks to be desegregated now; "deliberate speed" no warrant for indefinite delay. Goldberg for a unanimous Court.'
    n: 'Powe (see [[cal.1963-05-20.court]]). Names: Goldberg (K–J Cong. III.G).'
    tags: [name:goldberg-arthur-j]
  - id: cal.1963-05-28.mississippi
    when: May 28
    date: '1963-05-28'
    thread: mississippi
    c: 'Jackson. Tougaloo students sit in at Woolworth''s lunch counter; a crowd beats them for three hours, police outside. The Jackson movement, Evers and the NAACP at its head, begins its marches.'
    n: 'Dittmer, *Local People*; Payne, *I''ve Got the Light of Freedom* (K–J Cong. II.F). Anne Moody, *Coming of Age in Mississippi* (1968). John R. Salter Jr., *Jackson, Mississippi: An American Chronicle of Struggle and Schism* (1979). See [[cal.1962-10-01.mississippi]]. Names: Evers (K–J Cong. III.H).'
    tags: [name:evers-medgar]
  - id: cal.1963-05-30.civil-rights-the-executive
    when: May 30
    date: '1963-05-30'
    thread: civil-rights-the-executive
    c: 'Johnson at Gettysburg, Memorial Day: "The Negro today asks justice." Emancipation a proclamation, not a fact, until it is.'
    n: '[Lyndon B. Johnson, Remarks at Gettysburg on Civil Rights](https://millercenter.org/the-presidency/presidential-speeches/may-30-1963-remarks-gettysburg-civil-rights) (May 30, 1963). Kotz, *Judgment Days* (K–J Adm. II.C). Caro, *The Passage of Power* (K–J Adm. II.A). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
