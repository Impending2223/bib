  - id: cal.1963-05-02.alabama
    when: May 2–7
    date: '1963-05-02'
    thread: alabama
    c: 'Birmingham. The children''s march: hundreds of schoolchildren arrested, May 2. May 3: Connor turns fire hoses and police dogs on them in Kelly Ingram Park. By May 7 the jails full; Wallace sends state troopers.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-164) (May 8, 1963). [[w.mcwhorter-carry-me-home]]; [[w.eskew-but-for-birmingham]]; [[w.branch-parting-the-waters]]. See [[cal.1963-04-03.alabama]]. Names: Connor (K–J Cong. III.K); Wallace (K–J Cong. III.F).'
    tags: [name:connor-eugene, name:wallace-george-c]
  - id: cal.1963-05-04.elections-1964
    when: May 4
    date: '1963-05-04'
    thread: elections-1964
    c: Rockefeller, divorced in 1962, marries Margaretta Fitler Murphy, divorced a month before.
    n: '[[w.kramer-i-never-wanted-to]]; [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.novak-agony-of-the-g]]; [[w.white-making-of-the-president-1965]]. See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller (Opp. III.H); Margaretta Rockefeller (K–J Cong. III.K).'
    tags: [name:rockefeller-nelson, name:rockefeller-margaretta-fitler]
  - id: cal.1963-05-06.testing
    when: May 6
    date: '1963-05-06'
    thread: testing
    c: 'NSAM 239: the Geneva talks stalled; ACDA to look for steps short of general disarmament, with the test ban still sought.'
    n: '[FRUS 1961–63, VII, doc. 284](https://history.state.gov/historicaldocuments/frus1961-63v07/d284). See [[cal.1963-04-24.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-08.vietnam
    when: May 8
    date: '1963-05-08'
    thread: vietnam
    c: Huế, the Buddha's birthday. Buddhist flags banned; a crowd at the radio station for Trí Quang's address, refused. Troops and armored cars fire; eight killed by the consul's first count. The government blames the Viet Cong.
    n: 'FRUS 1961–63, III, docs. [112](https://history.state.gov/historicaldocuments/frus1961-63v03/d112), [117](https://history.state.gov/historicaldocuments/frus1961-63v03/d117), [118](https://history.state.gov/historicaldocuments/frus1961-63v03/d118). [Report of the United Nations Fact-Finding Mission to South Viet-Nam](https://digitallibrary.un.org/record/729703), U.N. Doc. A/5630 (Dec. 7, 1963) (Viet. II.I.3). [[w.schecter-new-face-of-buddha]]; [[w.luu-buddhist-crises-in-vietnam]]; [[w.mau-sau-thang-phap-nan]]; [[w.moyar-political-monks]]; [[w.mcallister-only-religions-count-in]]; [[w.miller-religious-revival-and-the]]; [[w.hammer-death-in-november]]; [[w.jacobs-cold-war-mandarin]]; [[w.moyar-triumph-forsaken]]; [[w.miller-misalliance]]; [[w.winters-year-of-the-hare]]; [[w.jones-death-of-a-generation]]; [[w.shaw-lost-mandate-of-heaven-2015]]; [[w.cung-phong-trao-phat-giao]]; [[w.luan-ben-giong-lich-su]]; [[w.gheddo-cross-and-the-bo]]; [[w.tue-cong-cuoc-tranh-dau]]; [[w.minh-vietnamese-engaged-buddhism]]; [[w.ford-cold-war-monks]]; [[w.hanh-vietnam]]; [[w.halberstam-making-of-a-quagmire]]; [[w.browne-new-face-of-war]]; [[w.higgins-our-vietnam-nightmare-1965]]; [[w.prochnau-once-upon-a-distant]]; [[w.blair-lodge-in-vietnam]]. Names: Thích Trí Quang (Viet. III.G).'
    tags: [name:thich-tri-quang, name:helble-john-j]
  - id: cal.1963-05-08.testing
    when: May 8
    date: '1963-05-08'
    thread: testing
    c: 'Khrushchev''s reply to the Kennedy–Macmillan letter: the seismic "black boxes" enough, inspection a cover for spying, seven or eight "unserious." But Moscow "happy to receive" the American and British representatives.'
    n: '[FRUS 1961–63, VII, doc. 285](https://history.state.gov/historicaldocuments/frus1961-63v07/d285). See [[cal.1963-04-24.testing]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1963-05-10.alabama
    when: May 10
    date: '1963-05-10'
    thread: alabama
    also: [desegregation-public-places, king]
    c: 'Shuttlesworth and King announce the Birmingham settlement, Marshall mediating: lunch counters, rest rooms, fitting rooms, and fountains desegregated within ninety days; Negroes hired as clerks; the jailed released. Connor and the old commission reject it.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-164) (May 8, 1963). [[w.navasky-kennedy-justice]]; [[w.eskew-but-for-birmingham]]; [[w.young-easy-burden]]. See [[cal.1963-04-03.alabama]]. Names: Shuttlesworth, King (K–J Cong. III.H); Marshall (K–J Adm. III.I); Connor (K–J Cong. III.K).'
    tags: [name:shuttlesworth-fred, name:king-martin-luther-jr, name:marshall-burke, name:connor-eugene]
  - id: cal.1963-05-11.alabama
    when: May 11–13
    date: '1963-05-11'
    thread: alabama
    also: [robert-kennedy]
    c: 'Bombs at the house of King''s brother and at the Gaston Motel, the night of the 11th. Rioting till morning. May 12, on television: troops trained in riot control to bases near Birmingham; the Alabama Guard readied for federal service. May 13: telegram to Wallace, 10 U.S.C. § 333.'
    n: '[Kennedy, Robert Kennedy, Katzenbach, Marshall, McNamara and others, May 12](https://prde.upress.virginia.edu/conversations/4006291), JFK Meeting Tape 86.2 (PRDE only). [Radio and Television Remarks Following Renewal of Racial Strife in Birmingham](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-following-renewal-racial-strife-birmingham) (May 12, 1963). [Telegram to Governor Wallace of Alabama](https://www.presidency.ucsb.edu/documents/telegram-governor-wallace-alabama) (May 13, 1963). *Alabama v. United States*, [373 U.S. 545](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373545/usrep373545.pdf) (1963) (Wallace''s suit against the troops refused, May 27). [[w.rosenberg-kennedy-johnson-and-the]], "Protest in Birmingham". See [[cal.1963-04-03.alabama]]. Names: Wallace (K–J Cong. III.F); McNamara (K–J Adm. III.F); Marshall (K–J Adm. III.I).'
    tags: [name:kennedy-john-f, name:wallace-george-c, name:mcnamara-robert-s, name:marshall-burke, name:kennedy-robert-f, name:katzenbach-nicholas]
  - id: cal.1963-05-14.railroads
    when: May 14
    date: '1963-05-14'
    thread: railroads
    c: Emergency Board No. 154 reports. A nationwide strike threatened within thirty days; the parties urged to accept.
    n: '[Report to the President by Emergency Board No. 154](https://nmb.gov/NMB_Application/wp-content/uploads/2025/05/PEB-154-Report.pdf) (May 13, 1963). [Statement by the President Upon Receiving Emergency Board Report on the Railway Labor Dispute](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-receiving-emergency-board-report-the-railway-labor-dispute) (May 14, 1963). See [[cal.1963-04-03.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-15.space
    when: May 15–16
    date: '1963-05-15'
    thread: space
    c: Cooper's *Faith 7*, twenty-two orbits, thirty-four hours. The automatic controls fail; he flies the reentry by hand. The last Mercury flight.
    n: '[Radio and Television Remarks Following the Flight of Astronaut L. Gordon Cooper](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-following-the-flight-astronaut-l-gordon-cooper) (May 16, 1963). [[w.swenson-this-new-ocean]]; [[w.cooper-leap-of-faith]]; [[w.wolfe-right-stuff]]. See [[cal.1961-04-12.space]]. Names: Cooper (K–J Cong. III.K).'
    tags: [name:cooper-l-gordon-jr, name:kennedy-john-f]
  - id: cal.1963-05-15.economy
    when: May 15
    date: '1963-05-15'
    thread: economy
    c: House raises the temporary debt limit to $307 billion through June, $309 billion through Aug. 31, [213–204](https://voteview.com/rollcall/RH0880028). Senate, [60–24](https://voteview.com/rollcall/RS0880070), May 28; signed May 29, [77 Stat. 50](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg50.pdf).
    n: '[[w.morgan-deficit-government]]. See [[cal.1961-06-30.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-20.court
    when: May 20
    date: '1963-05-20'
    thread: court
    also: [desegregation-public-places]
    c: 'The sit-in cases. *Peterson v. City of Greenville*, [373 U.S. 244](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373244/usrep373244.pdf): trespass convictions reversed where a city ordinance required segregation. Warren for the Court; Harlan concurs in part. *Lombard v. Louisiana*, [373 U.S. 267](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373267/usrep373267.pdf): the same where officials had declared sit-ins unlawful.'
    n: '[[w.schmidt-sit-ins]]; [[w.kalven-negro-and-the-first]]; [[w.powe-warren-court-and-american]]. See [[cal.1961-12-11.court]]. Names: Warren, Harlan (K–J Cong. III.G).'
    tags: [name:warren-earl, name:harlan-john-marshall]
  - id: cal.1963-05-20.program
    when: May 20–21
    date: '1963-05-20'
    thread: farm
    c: Feed Grain Act signed, [77 Stat. 44](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg44.pdf). Senate had passed it [45–35](https://voteview.com/rollcall/RS0880060), May 16. May 21, wheat referendum. Growers reject the certificate plan, two-thirds being needed. Check the vote.
    n: '[Remarks Upon Signing the Feed Grain Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-feed-grain-bill) (May 20, 1963). [Statement by the President on the Results of the Wheat Referendum](https://www.presidency.ucsb.edu/documents/statement-the-president-the-results-the-wheat-referendum) (May 22, 1963). [[w.hadwiger-pressures-and-protests]]. See [[cal.1963-04-25.program]]; [[cal.1962-09-27.program]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-24.civil-rights-the-executive
    when: May 24
    date: '1963-05-24'
    thread: civil-rights-the-executive
    also: [robert-kennedy]
    c: Robert Kennedy meets James Baldwin and a dozen others Baldwin brought, at the Kennedy apartment in New York. Three hours.
    n: '[[w.branch-parting-the-waters]]; [[w.guthman-we-band-of-brothers]]; [[w.schlesinger-robert-kennedy-and-his]]; [[w.baldwin-fire-next-time]]. See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Robert F. Kennedy (K–J Adm. III.A); Baldwin (K–J Cong. III.K).'
    tags: [name:kennedy-robert-f, name:baldwin-james]
