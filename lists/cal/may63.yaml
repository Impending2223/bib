# Cal. XXXVI May 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXVI
entries:
  - id: cal.1963-05-01.opinion
    when: May 1
    date: '1963-05-01'
    thread: opinion
    also: [cuba]
    c: 'Gallup, Apr. 4–9: the administration''s handling of Cuba in recent weeks, 49 percent satisfied, 29 dissatisfied.'
    n: '*The Gallup Poll*, III, 1816 (K–J Cong. II.E).'
  - id: cal.1963-05-02.alabama
    when: May 2–7
    date: '1963-05-02'
    thread: alabama
    c: 'Birmingham. The children''s march: hundreds of schoolchildren arrested, May 2. May 3: Connor turns fire hoses and police dogs on them in Kelly Ingram Park. By May 7 the jails full; Wallace sends state troopers.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-164) (May 8, 1963). McWhorter, *Carry Me Home*; Eskew, *But for Birmingham* (K–J Cong. II.F). Branch, *Parting the Waters* (K–J Adm. II.C). See [[cal.1963-04-03.alabama]]. Names: Connor (K–J Cong. III.K); Wallace (K–J Cong. III.F).'
    tags: [name:connor-eugene, name:wallace-george-c]
  - id: cal.1963-05-04.elections-1964
    when: May 4
    date: '1963-05-04'
    thread: elections-1964
    c: Rockefeller, divorced in 1962, marries Margaretta Fitler Murphy, divorced a month before.
    n: 'Kramer & Roberts, *"I Never Wanted to Be Vice-President of Anything!"*; Persico, *The Imperial Rockefeller*; Smith, *On His Own Terms* (Opp. II.C). Novak, *The Agony of the G.O.P. 1964* (Opp. II.A). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller (Opp. III.H); Margaretta Rockefeller (K–J Cong. III.K).'
    tags: [name:rockefeller-nelson, name:rockefeller-margaretta-fitler]
  - id: cal.1963-05-06.testing
    when: May 6
    date: '1963-05-06'
    thread: testing
    c: 'NSAM 239: the Geneva talks stalled; ACDA to look for steps short of general disarmament, with the test ban still sought.'
    n: '[FRUS 1961–63, VII, doc. 284](https://history.state.gov/historicaldocuments/frus1961-63v07/d284). See [[cal.1963-04-24.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-08.vietnam
    when: May 8
    date: '1963-05-08'
    thread: vietnam
    c: Huế, the Buddha's birthday. Buddhist flags banned; a crowd at the radio station for Trí Quang's address, refused. Troops and armored cars fire; eight killed by the consul's first count. The government blames the Viet Cong.
    n: 'FRUS 1961–63, III, docs. [112](https://history.state.gov/historicaldocuments/frus1961-63v03/d112), [117](https://history.state.gov/historicaldocuments/frus1961-63v03/d117), [118](https://history.state.gov/historicaldocuments/frus1961-63v03/d118). [Report of the United Nations Fact-Finding Mission to South Viet-Nam](https://digitallibrary.un.org/record/729703), U.N. Doc. A/5630 (Dec. 7, 1963) (Viet. II.I.3). Schecter, *The New Face of Buddha*; Luu, *The Buddhist Crises in Vietnam*; Vũ Văn Mẫu, *Sáu Tháng Pháp Nạn 1963*; Moyar, *Political Monks*; McAllister, *Only Religions Count in Vietnam*; Miller, *Religious Revival and the Politics of Nation Building* (Viet. II.B.11). Hammer, *A Death in November* (Viet. II.B.12). Jacobs, *Cold War Mandarin*; Moyar, *Triumph Forsaken*; Miller, *Misalliance* (Viet. II.B.7). Winters, *The Year of the Hare*; Jones, *Death of a Generation* (Viet. II.B.8). Shaw, *The Lost Mandate of Heaven*; Lê Cung, *Phong trào Phật giáo miền Nam Việt Nam năm 1963*; Cao Văn Luận, *Bên giòng lịch sử* (Viet. II.E.5). Gheddo, *The Cross and the Bo Tree*; Quốc Tuệ, *Công Cuộc Tranh-Đấu của Phật-Giáo Việt-Nam*; Pham Van Minh, *Vietnamese Engaged Buddhism*; Ford, *Cold War Monks* (Viet. II.A.2). Thich Nhat Hanh, *Vietnam: Lotus in a Sea of Fire* (Viet. II.H.3). Halberstam, *The Making of a Quagmire*; Browne, *The New Face of War*; Higgins, *Our Vietnam Nightmare* (Viet. I.C). Prochnau, *Once Upon a Distant War* (Viet. II.G.4). Blair, *Lodge in Vietnam* (Viet. II.H.1). Names: Thích Trí Quang (Viet. III.G).'
    tags: [name:thich-tri-quang, name:helble-john-j]
  - id: cal.1963-05-08.testing
    when: May 8
    date: '1963-05-08'
    thread: testing
    c: 'Khrushchev''s reply to the Kennedy–Macmillan letter: the seismic "black boxes" enough, inspection a cover for spying, seven or eight "unserious." But Moscow "happy to receive" the American and British representatives.'
    n: '[FRUS 1961–63, VII, doc. 285](https://history.state.gov/historicaldocuments/frus1961-63v07/d285). See [[cal.1963-04-24.testing]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1963-05-10.alabama
    when: May 10
    date: '1963-05-10'
    thread: alabama
    also: [desegregation-public-places, king]
    c: 'Shuttlesworth and King announce the Birmingham settlement, Marshall mediating: lunch counters, rest rooms, fitting rooms, and fountains desegregated within ninety days; Negroes hired as clerks; the jailed released. Connor and the old commission reject it.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-164) (May 8, 1963). Navasky, *Kennedy Justice* (K–J Adm. II.C). Eskew, *But for Birmingham* (K–J Cong. II.F). Young, *An Easy Burden* (K–J Cong. II.I.4). See [[cal.1963-04-03.alabama]]. Names: Shuttlesworth, King (K–J Cong. III.H); Marshall (K–J Adm. III.I); Connor (K–J Cong. III.K).'
    tags: [name:shuttlesworth-fred, name:king-martin-luther-jr, name:marshall-burke, name:connor-eugene]
  - id: cal.1963-05-11.alabama
    when: May 11–13
    date: '1963-05-11'
    thread: alabama
    also: [robert-kennedy]
    c: 'Bombs at the house of King''s brother and at the Gaston Motel, the night of the 11th. Rioting till morning. May 12, on television: troops trained in riot control to bases near Birmingham; the Alabama Guard readied for federal service. May 13: telegram to Wallace, 10 U.S.C. § 333.'
    n: '[Kennedy, Robert Kennedy, Katzenbach, Marshall, McNamara and others, May 12](https://prde.upress.virginia.edu/conversations/4006291), JFK Meeting Tape 86.2 (PRDE). [Radio and Television Remarks Following Renewal of Racial Strife in Birmingham](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-following-renewal-racial-strife-birmingham) (May 12, 1963). [Telegram to Governor Wallace of Alabama](https://www.presidency.ucsb.edu/documents/telegram-governor-wallace-alabama) (May 13, 1963). *Alabama v. United States*, [373 U.S. 545](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373545/usrep373545.pdf) (1963) (Wallace''s suit against the troops refused, May 27). Rosenberg & Karabell, *Kennedy, Johnson, and the Quest for Justice*, "Protest in Birmingham" (K–J Adm. II.J). See [[cal.1963-04-03.alabama]]. Names: Wallace (K–J Cong. III.F); McNamara (K–J Adm. III.F); Marshall (K–J Adm. III.I).'
    tags: [name:kennedy-john-f, name:wallace-george-c, name:mcnamara-robert-s, name:marshall-burke, name:kennedy-robert-f, name:katzenbach-nicholas]
  - id: cal.1963-05-14.railroads
    when: May 14
    date: '1963-05-14'
    thread: railroads
    c: Emergency Board No. 154 reports. A nationwide strike threatened within thirty days; the parties urged to accept.
    n: '[Report to the President by Emergency Board No. 154](https://nmb.gov/NMB_Application/wp-content/uploads/2025/05/PEB-154-Report.pdf) (May 13, 1963). [Statement by the President Upon Receiving Emergency Board Report on the Railway Labor Dispute](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-receiving-emergency-board-report-the-railway-labor-dispute) (May 14, 1963). See [[cal.1963-04-03.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-15.space
    when: May 15–16
    date: '1963-05-15'
    thread: space
    c: Cooper's *Faith 7*, twenty-two orbits, thirty-four hours. The automatic controls fail; he flies the reentry by hand. The last Mercury flight.
    n: '[Radio and Television Remarks Following the Flight of Astronaut L. Gordon Cooper](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-following-the-flight-astronaut-l-gordon-cooper) (May 16, 1963). Swenson, Grimwood & Alexander, *This New Ocean*; Cooper, *Leap of Faith* (K–J Adm. II.B). Wolfe, *The Right Stuff* (K–J Adm. I.C). See [[cal.1961-04-12.space]]. Names: Cooper (K–J Cong. III.K).'
    tags: [name:cooper-l-gordon-jr, name:kennedy-john-f]
  - id: cal.1963-05-15.economy
    when: May 15
    date: '1963-05-15'
    thread: economy
    c: House raises the temporary debt limit to $307 billion through June, $309 billion through Aug. 31, [213–204](https://voteview.com/rollcall/RH0880028). Senate, [60–24](https://voteview.com/rollcall/RS0880070), May 28; signed May 29, [77 Stat. 50](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg50.pdf).
    n: Morgan, *Deficit Government* (K–J Adm. II.B). See [[cal.1961-06-30.economy]].
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-20.court
    when: May 20
    date: '1963-05-20'
    thread: court
    also: [desegregation-public-places]
    c: 'The sit-in cases. *Peterson v. City of Greenville*, [373 U.S. 244](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373244/usrep373244.pdf): trespass convictions reversed where a city ordinance required segregation. Warren for the Court; Harlan concurs in part. *Lombard v. Louisiana*, [373 U.S. 267](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373267/usrep373267.pdf): the same where officials had declared sit-ins unlawful.'
    n: 'Schmidt, *The Sit-Ins*; Kalven, *The Negro and the First Amendment*; Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1961-12-11.court]]. Names: Warren, Harlan (K–J Cong. III.G).'
    tags: [name:warren-earl, name:harlan-john-marshall]
  - id: cal.1963-05-20.program
    when: May 20–21
    date: '1963-05-20'
    thread: farm
    c: Feed Grain Act signed, [77 Stat. 44](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg44.pdf). Senate had passed it [45–35](https://voteview.com/rollcall/RS0880060), May 16. May 21, wheat referendum. Growers reject the certificate plan, two-thirds being needed. Check the vote.
    n: '[Remarks Upon Signing the Feed Grain Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-feed-grain-bill) (May 20, 1963). [Statement by the President on the Results of the Wheat Referendum](https://www.presidency.ucsb.edu/documents/statement-the-president-the-results-the-wheat-referendum) (May 22, 1963). Hadwiger & Talbot, *Pressures and Protests* (K–J Cong. II.B). See [[cal.1963-04-25.program]]; [[cal.1962-09-27.program]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-24.civil-rights-the-executive
    when: May 24
    date: '1963-05-24'
    thread: civil-rights-the-executive
    also: [robert-kennedy]
    c: Robert Kennedy meets James Baldwin and a dozen others Baldwin brought, at the Kennedy apartment in New York. Three hours.
    n: 'Branch, *Parting the Waters* (K–J Adm. II.C). Guthman, *We Band of Brothers* (K–J Adm. II.G.6). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Baldwin, *The Fire Next Time* (K–J Cong. I.C). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Robert F. Kennedy (K–J Adm. III.A); Baldwin (K–J Cong. III.K).'
    tags: [name:kennedy-robert-f, name:baldwin-james]
  - id: cal.1963-05-24.opinion
    when: May 24
    date: '1963-05-24'
    thread: opinion
    also: [cuba]
    c: 'Gallup, May 2–7: the administration''s handling of Cuba in recent weeks, 45 percent satisfied, 35 dissatisfied. Republicans 27 and 54.'
    n: '*The Gallup Poll*, III, 1819 (K–J Cong. II.E).'
  - id: cal.1963-05-26.opinion-5
    when: May 26
    date: '1963-05-26'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, May 8–13: Republicans'' choice for 1964: Goldwater 35, Rockefeller 30, Romney 22; others, no preference 13. Independents: Goldwater 33, Rockefeller 28. Goldwater''s first lead.'
    n: '*The Gallup Poll*, III, 1819 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller, Romney (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1963-05-27.court
    when: May 27
    date: '1963-05-27'
    thread: court
    also: [desegregation-public-places]
    c: '*Watson v. City of Memphis*, [373 U.S. 526](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373526/usrep373526.pdf). The city''s parks to be desegregated now; "deliberate speed" no warrant for indefinite delay. Goldberg for a unanimous Court.'
    n: 'Powe (see [[cal.1963-05-20.court]]). Names: Goldberg (K–J Cong. III.G).'
    tags: [name:goldberg-arthur-j]
  - id: cal.1963-05-27.opinion-5
    when: May 27
    date: '1963-05-27'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, May 8–13: Kennedy 60, Goldwater 36, undecided 4; Kennedy 60, Romney 35, undecided 5.'
    n: '*The Gallup Poll*, III, 1820 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Romney (Opp. III.H).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m, name:romney-george-w]
  - id: cal.1963-05-28.mississippi
    when: May 28
    date: '1963-05-28'
    thread: mississippi
    also: [desegregation-public-places, students]
    c: Jackson. Tougaloo students sit in at Woolworth's lunch counter; a crowd beats them for three hours, police outside. The Jackson movement, Evers and the NAACP at its head, begins its marches.
    n: 'Dittmer, *Local People*; Payne, *I''ve Got the Light of Freedom*; Moody, *Coming of Age in Mississippi*; Salter, *Jackson, Mississippi*; O''Brien, *We Shall Not Be Moved* (K–J Cong. II.F). See [[cal.1962-10-01.mississippi]]. Names: Evers (K–J Cong. III.H).'
    tags: [name:evers-medgar]
  - id: cal.1963-05-28.opinion-5
    when: May 28
    date: '1963-05-28'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, May 8–13: Kennedy 63, Rockefeller 32, undecided 5.'
    n: '*The Gallup Poll*, III, 1820 (K–J Cong. II.E). Names: Rockefeller (Opp. III.H).'
    tags: [name:kennedy-john-f, name:rockefeller-nelson]
  - id: cal.1963-05-30.civil-rights-the-executive
    when: May 30
    date: '1963-05-30'
    thread: civil-rights-the-executive
    c: 'Johnson at Gettysburg, Memorial Day: "The Negro today asks justice." Emancipation a proclamation, not a fact, until it is.'
    n: '[Lyndon B. Johnson, Remarks at Gettysburg on Civil Rights](https://millercenter.org/the-presidency/presidential-speeches/may-30-1963-remarks-gettysburg-civil-rights) (May 30, 1963). Stern, *Calculating Visions*; Kotz, *Judgment Days* (K–J Adm. II.C). Caro, *The Passage of Power* (K–J Adm. II.A). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
