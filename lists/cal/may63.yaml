  - id: cal.1963-05-30.civil-rights-the-executive
    when: May 30
    date: '1963-05-30'
    thread: civil-rights-the-executive
    c: 'Johnson at Gettysburg, Memorial Day: "The Negro today asks justice." Emancipation a proclamation, not a fact, until it is.'
    n: '[Lyndon B. Johnson, Remarks at Gettysburg on Civil Rights](https://millercenter.org/the-presidency/presidential-speeches/may-30-1963-remarks-gettysburg-civil-rights) (May 30, 1963). [[w.stern-calculating-visions]]; [[w.kotz-judgment-days]]; [[w.caro-passage-of-power]]. See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
