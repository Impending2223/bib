  - id: cal.1968-07-01.economy
    when: July 1
    date: '1968-07-01'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Johnson on the sterling balances, 6 p.m., with Fowler, Deming, Martin, Robertson, Eugene Rostow, Okun and Fried: more than $10 billion of them, the holders turning them in; a British guarantee of their value, and a $2 billion credit from the industrial countries as a "safety net," the American share up to $700 million.'
    n: '[FRUS 1964–68, VIII, doc. 200](https://history.state.gov/historicaldocuments/frus1964-68v08/d200). [[w.gavin-gold-dollars-and-power]], 183. See [[cal.1967-11-18.economy]]. Names: Johnson, Fowler, Deming, Martin, Robertson, Eugene Rostow, Okun, Fried.'
