    date: '1968-07-19'
    thread: elections-1968
    also: [labor]
    c: 'The Wall Street Journal, Landauer: the Seafarers'' political committee gave $100,000 to committees for Johnson and Humphrey, $5,000 a committee, days after Rusk refused to extradite Banks to Canada. Humphrey''s office, McCloskey and the union deny any connection.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1992. Names: Rusk, McCloskey, Humphrey, Johnson.'
    tags: [name:rusk-dean, name:mccloskey-robert-j, name:humphrey-hubert-h, name:johnson-lyndon-b]
