    n: 'Statement by the President Upon Appointing the Committee on Population and Family Planning, [1968–69 Pub. Papers 817](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=127) (July 16, 1968). To check: [[w.critchlow-intended-consequences]]. Names: Cohen, Rockefeller, Johnson.'
    tags: [name:johnson-lyndon-b, name:cohen-wilbur-j, name:rockefeller-john-d]
  - id: cal.1968-07-16.labor
    when: July 16
    date: '1968-07-16'
    thread: labor
    c: 'The House Education and Labor Committee reports the Occupational Safety and Health Act, H.R. 17748, a substitute: the Secretary of Labor''s power to set standards limited. All its Republicans but Bell and Reid sign minority views.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1967, 1974. Names: Bell, Reid.'
    tags: [name:bell-alphonzo, name:reid-ogden-r]
  - id: cal.1968-07-16.king-poor-peoples
    when: July 16
    date: '1968-07-16'
    thread: king-poor-peoples
    c: 'Abernathy, at a news conference in Washington: a "Poor People''s Embassy," a lobby for the poor of all races and regions. He praises Rockefeller, no endorsement before the conventions.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1975, 1988. Names: Abernathy, Rockefeller.'
    tags: [name:abernathy-ralph-david, name:rockefeller-nelson]
  - id: cal.1968-07-16.elections-1968
    when: July 16
    date: '1968-07-16'
    thread: elections-1968
    c: 'Reagan at a news conference: differences with Wallace "kind of hard to pin down"; Wallace dwelling on law and order and patriotism. July 17, he sets out for Texas, Arkansas, Virginia and Maryland.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1989. Names: Reagan, Wallace.'
    tags: [name:reagan-ronald, name:wallace-george-c]
  - id: cal.1968-07-16.elections-1968-2
    when: July 16–22
    date: '1968-07-16'
    thread: elections-1968
    c: Nixon in Philadelphia, July 16; Baltimore, July 17; Los Angeles, July 18–22; then Laguna Beach, Calif., no appearances before the convention. He will not bargain with Wallace.
    n: '[[w.cq-weekly-report]], July 26, 1968, 1991, 1998. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1968-07-17.foreign-aid
    when: July 17
    date: '1968-07-17'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1968, H.R. 15263. Johnson: the lowest request in history, already cut $600 million, about 20 percent, by the Foreign Affairs Committee.'
    n: 'Statement by the President on the Foreign Aid Bill, [1968–69 Pub. Papers 818](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=128) (July 17, 1968); Recorded Remarks in Support of the Foreign Aid Bill, [1968–69 Pub. Papers 819](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=129) (July 17, 1968). See [[cal.1967-11-08.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-17.school-aid
    when: July 17
    date: '1968-07-17'
    thread: school-aid
    also: [poverty]
    c: 'The Senate passes the vocational education bill, H.R. 18366 with S. 3770''s text, 88–0: $2,707,152,000 through fiscal 1972. Dominick''s and Murphy''s amendment moving Head Start from the Office of Economic Opportunity to the Office of Education, 60–29; Clark against, with the administration. Ellender''s $50 million a year more for school lunches for needy children, 57–31, in place of Javits''s; the amendment as changed, 85–0.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1941–42. Names: Dominick, Murphy, Clark, Ellender, Javits.'
    tags: [name:dominick-peter-h, name:murphy-george, name:clark-joseph-s, name:ellender-allen-j, name:javits-jacob-k]
  - id: cal.1968-07-17.congress
    when: July 17
    date: '1968-07-17'
    thread: congress
    c: 'Legislative Branch appropriation for fiscal 1969, H.R. 18038, cleared: $298,678,396, $17,194,137 under the request. The conference report adopted by the House July 16, the Senate July 17; $400,000 for the inauguration of 1969.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1953–55. Names: Gross.'
    tags: [name:gross-h-r]
  - id: cal.1968-07-17.congress-2
    when: July 17
    date: '1968-07-17'
    thread: congress
    c: 'Passports good for five years, S. 1418, cleared: the Senate takes the House''s amendment, a fee of $12. The House had passed it July 15, 324–71, Hays managing. UPI, July 17: diplomatic passports for members of Congress abroad on official business, the price of a vote on the bill.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1955–57. Names: Hays.'
    tags: [name:hays-wayne-l]
  - id: cal.1968-07-17.consumers
    when: July 17
    date: '1968-07-17'
    thread: consumers
    c: 'Cleared: S.J. Res. 160, a study of institutional investors by the Securities and Exchange Commission, $875,000, due Sept. 1, 1969; and S. 1299, the Federal Reserve Board''s power over margin requirements extended to the over-the-counter market. The Senate takes the House''s amendments to each by voice vote.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1958–59.'
  - id: cal.1968-07-17.consumers-2
    when: July 17
    date: '1968-07-17'
    thread: consumers
    c: 'The Senate Commerce Committee reports the Consumer Sales Protection Act, S. 1599: a door-to-door sale of $60 or more may be canceled.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1965. Names: Magnuson. Check: the sum and the days allowed.'
    tags: [name:magnuson-warren-g]
  - id: cal.1968-07-17.testing-npt
    when: July 17
    date: '1968-07-17'
    thread: testing-npt
    c: 'The Senate Foreign Relations Committee ends its hearings on the nonproliferation treaty. Teller: leave "purely defensive" nuclear systems, antimissile defenses for Japan, India and Pakistan, free of the treaty. Findley, of the House Republican task force on the alliance: the treaty unamended will "seriously" weaken the Atlantic alliance.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1968. Names: Teller, Findley, Fulbright.'
    tags: [name:teller-edward, name:findley-paul, name:fulbright-j-william]
  - id: cal.1968-07-17.opinion
    when: July 17
    date: '1968-07-17'
    thread: opinion
    also: [elections-1968-polls]
    c: 'James Farmer releases a "black voters preference poll," 1,198 persons in six cities, by the Howard Sanders agency: Rockefeller 41 percent, Humphrey 38; Rockefeller 45, McCarthy 35; Humphrey 66, Nixon 4; McCarthy 57, Nixon 4.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1988. Names: Farmer, Rockefeller, Humphrey, McCarthy, Nixon.'
    tags: [name:farmer-james, name:rockefeller-nelson, name:humphrey-hubert-h, name:mccarthy-eugene-j, name:nixon-richard-m]
  - id: cal.1968-07-17.elections-1968
    when: July 17
    date: '1968-07-17'
    thread: elections-1968
    c: 'Rockefeller: his four-stage peace plan "very enthusiastic"ly received by the American delegation in Paris, a "friend" calling it "very helpful." July 18, McCloskey: Harriman, he understands, has had no contact with Rockefeller.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1988. Names: Rockefeller, McCloskey, Harriman.'
    tags: [name:rockefeller-nelson, name:mccloskey-robert-j, name:harriman-w-averell]
  - id: cal.1968-07-17.elections-1968-2
    when: July 17
    date: '1968-07-17'
    thread: elections-1968
    c: 'Gabrielson, Republican national chairman once, for Goldwater in 1964, endorses Rockefeller: "the best chance of winning."'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1989. Names: Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1968-07-17.elections-1968-3
    when: July 17–21
    date: '1968-07-17'
    thread: elections-1968
    c: 'McCarthy''s Southern tour: Richmond, Va., July 17; Atlanta and Raleigh, N.C., July 18; Covington and Louisville, Ky., July 19–20; Nashville, July 21. At Atlanta, Humphrey''s approach "more progressive" than the administration''s; at Louisville, their differences narrowed.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1991. Names: McCarthy, Humphrey.'
    tags: [name:mccarthy-eugene-j, name:humphrey-hubert-h]
  - id: cal.1968-07-17.elections-1968-4
    when: July 17
    date: '1968-07-17'
    thread: elections-1968
    also: [elections-1968-chicago]
    c: 'McCarthy: "highly inequitable and very dangerous" to deny his delegates 11 or 12 seats on each convention committee, enough for a minority report. Murphy, his press secretary, resigns. The New York Secretary of State: McCarthy''s backers spent nearly $1 million in the June 18 primary for 61 delegates, the Coalition for a Democratic Alternative $677,013; United Democrats for Humphrey, $141,583.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1991, 1996. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j, state:ny]
  - id: cal.1968-07-17.elections-1968-chicago
    when: July 17
    date: '1968-07-17'
    thread: elections-1968-chicago
    c: 'Alabama. Vance, the Democratic State chairman, challenges the seating of McCarthy and more than 300 delegates from 23 States, on loyalty: McCarthy will not say he would back Humphrey. The same standard asked as for Wallace''s men in his delegation.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1996. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j, state:al]
  - id: cal.1968-07-17.electoral-college
    when: July 17
    date: '1968-07-17'
    thread: electoral-college
    c: 'Virginia. A three-judge federal court dismisses, unanimously, the suit brought Mar. 21 by voters of the State''s ten districts against the unit rule for presidential electors; a district system asked. J. Harvie Williams of the American Good Government Society its organizer. Judge Albert V. Bryan, for the court: the unit rule "exceptionable in many aspects" but nothing in it "offensive to the Constitution."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2111. To check: the opinion (F. Supp.).'
    tags: [state:va]
  - id: cal.1968-07-17.elections-1968-chicago-2
    when: July 17
    date: '1968-07-17'
    thread: elections-1968-chicago
    c: 'Dunn to Daley, a letter: Demcon, the Guard''s plan short of a call-up. A battalion, 800, and a company, 300, on training duty Aug. 24–25; a battalion each evening Aug. 26–29 at Boyce and Fuller Parks, near the Amphitheatre. Dunn, to the police superintendent: "I would rather have them ... readily available on duty."'
    n: '[[w.rights-in-conflict-convention-week]], 112–13. See [[cal.1968-01.elections-1968-chicago]]. Names: Daley.'
    tags: [name:daley-richard-j, state:il, city:chicago]
