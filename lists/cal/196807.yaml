    date: '1968-07-20'
    thread: elections-1968
    c: 'Reagan at Little Rock, asked about White''s talks to Southern delegations: "the first I''d heard of it." At Charlottesville, Va.: no announcement of his candidacy before Miami Beach.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1989. Names: Reagan, White.'
    tags: [name:reagan-ronald, name:white-f-clifton]
  - id: cal.1968-07-20.elections-1968-3
    when: July 20
    date: '1968-07-20'
    thread: elections-1968
    c: 'Humphrey''s position paper on the inner cities: public investment in minority enterprise. Of Nixon''s "black capitalism" at little or no government cost: "doubletalk," "kiting political checks."'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1990. Names: Humphrey, Nixon.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1968-07-20.elections-1968-4
