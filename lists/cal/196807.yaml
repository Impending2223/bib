    tags: [name:ervin-sam-j-jr, name:thornberry-william-h, name:eastland-james-o, name:fortas-abe]
  - id: cal.1968-07-20.elections-1968
    when: July 20
    date: '1968-07-20'
    thread: elections-1968
    c: Cleveland. Some 1,500 Negro leaders urge the Republicans to nominate Rockefeller; Farmer there. The same day, Rockefeller resigns from the Knickerbocker Club over its admissions.
    n: '[[w.cq-weekly-report]], July 26, 1968, 1988. Names: Rockefeller, Farmer.'
