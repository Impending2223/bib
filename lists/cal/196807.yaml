    n: 'Statement by the President on the Need for Restraint by Business and Labor in the Interest of Economic Stability, [1968–69 Pub. Papers 832](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=142) (July 23, 1968); Remarks Before the National Governors'' Conference in Cincinnati, [1968–69 Pub. Papers 833](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=143) (July 23, 1968). To check: [[w.okun-political-economy-of-prosperity]]. See [[cal.1968-06-20.economy]]. Names: Johnson.'
