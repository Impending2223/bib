    date: '1968-07-30'
    thread: governors
    also: [elections-1968]
    c: 'Arkansas''s Democratic primary for governor, to face Rockefeller: Marion Crank, once Speaker of the House, over Virginia Johnson, wife of Jim Johnson, the nominee of 1966, 106,092 to 86,038, 25.6 percent; Ted Boswell 85,629, 20.6 percent; Bruce Bennett, once attorney general, 65,095, 15.7 percent; two others. Runoff between Crank and Johnson. The same day, Fulbright renominated for the Senate over Jim Johnson, 220,684 to 132,038, 52.9 percent.'
    n: 'Ark. [*Historical Report of the Secretary of State* (2008)](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf), [629](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=642) (governor), [593](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=606) (Senate). Bennett''s count: [Wikipedia, "1968 Arkansas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Arkansas_gubernatorial_election). To check: [[w.urwin-agenda-for-reform]]; [[w.johnson-arkansas-in-modern-america]]. See [[cal.1966-07-26.elections-1966]]. Names: Rockefeller, Crank, Virginia Johnson, James Johnson, Boswell, Bennett, Fulbright.'
