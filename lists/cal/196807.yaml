    date: '1968-07-21'
    thread: economy
    c: 'The Federal Reserve''s study group, Mitchell chairman, three years on the discount window: a "basic borrowing privilege," the discount rate, now 5½ percent, changed as often as weekly.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1976. Names: Mitchell.'
    tags: [name:mitchell-george-w]
  - id: cal.1968-07-21.opinion-2
    when: July 21
    date: '1968-07-21'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Harris, released July 21: Humphrey 37 percent, Nixon 35, Wallace 17, undecided 11; Rockefeller 37, Humphrey 34, Wallace 19; McCarthy 42, Nixon 34, Wallace 16; McCarthy 38, Rockefeller 32, Wallace 20.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1994. To check: the Harris Survey as the papers printed it, July 21, 1968. Names: Humphrey, Nixon, Wallace, Rockefeller, McCarthy.'
