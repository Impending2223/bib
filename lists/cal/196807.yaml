  - id: cal.1968-07-03.state-and-city-finance-tx
    when: July 3
    date: '1968-07-03'
    thread: state-and-city-finance
    c: 'Texas. The special session ends: the appropriation and some $159 million in taxes for it, the State sales tax and the motor vehicle sales tax up a cent, the franchise tax up 50 cents a thousand, from Oct. 1. Connally''s broader sales tax, with rebates to the cities, refused.'
    n: 'Acts 1968, 60th Leg., 1st C.S., ch. 2 (H.B. 2), [Tex. Gen. Laws](https://lrl.texas.gov/scanned/sessionLaws/60-1/HB_2_CH_2.pdf) (the sales and the motor vehicle sales tax at 3 percent, the franchise tax $2.75 a thousand, from Oct. 1): passed the House June 20, 91–56, the Senate as amended June 27, the House concurring July 2, 85–59; approved July 17. [*Bastrop Advertiser*, July 11, 1968, 2](https://texashistory.unt.edu/ark:/67531/metapth238161/m1/2); [60th Leg., 1st C.S., H.B. 2, Texas Senate Papers](https://texashistory.unt.edu/ark:/67531/metapth595271/). See [[cal.1968-06-04.state-and-city-finance-tx]]. Names: Connally.'
    src:
      c: 5ecb8314
      rows:
        - 'https://lrl.texas.gov/scanned/sessionLaws/60-1/HB_2_CH_2.pdf: B'
        - 'https://texashistory.unt.edu/ark:/67531/metapth238161/m1/2: all'
        - 'https://texashistory.unt.edu/ark:/67531/metapth595271/: all'
    tags: [state:tx, name:connally-john]
  - id: cal.1968-07-03.elections-1968
    when: July 3–4
    date: '1968-07-03'
    thread: elections-1968
    c: 'Minneapolis, the evening of July 3: hecklers keep Wallace from speaking. Johnson, July 4: "Americans of every viewpoint must be deeply concerned over the intolerance which prevented presidential candidate George Wallace from speaking."'
    n: 'Statement by the President on the Disruption by Hecklers of a Speech by George Wallace in Minneapolis, [1968–69 Pub. Papers 778](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=88) (July 4, 1968). To check: [[w.carter-politics-of-rage-1995]]; [[w.chester-american-melodrama]]. Names: Wallace, Johnson.'
    tags: [name:wallace-george-c, name:johnson-lyndon-b, state:mn, city:minneapolis]
  - id: cal.1968-07-03.opinion
    when: July 3
    date: '1968-07-03'
    thread: opinion
    also: [civil-disorders]
    c: 'Gallup, June 13–18: some call this country a "sick society": agree 36 percent, disagree 58. Whites 35 and 60; Negroes 48 and 43. Wallace''s supporters 42 and 51; Nixon''s 36 and 61; Humphrey''s 32 and 61.'
    n: '[[w.gallup-poll]], III, 2138–39. Names: Wallace, Nixon, Humphrey.'
    tags: [name:wallace-george-c, name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-07-03.civil-rights-organizations
    when: July 3–7
    date: '1968-07-03'
    thread: civil-rights-organizations
    c: Columbus, Ohio. CORE's 26th convention; recessed July 7 with no new constitution and no successor to McKissick. Dissidents led by Carson of Brooklyn walk out. Resolutions for a black nation of the twelve Southeastern States, and a homeland in South West Africa and South Africa, tabled.
    n: '[[w.cq-weekly-report]], July 26, 1968, 1975. Names: McKissick.'
    tags: [name:mckissick-floyd-b]
  - id: cal.1968-07-05.war-opposition
    when: July 5
    date: '1968-07-05'
    thread: war-opposition
    c: 'Flag desecration act signed, [82 Stat. 291](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg291-2.pdf): up to a year in prison and a $1,000 fine for whoever "knowingly casts contempt" on a flag of the United States by publicly mutilating, defacing, defiling, burning or trampling it. Introduced after the burning of flags in Central Park, Apr. 15, 1967.'
    n: 'Statute (K–J Cong. II.J.2). To check: [[w.goldstein-saving-old-glory]]. See [[cal.1967-04-15.war-opposition]].'
