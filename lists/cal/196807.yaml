    date: '1968-07-21'
    thread: elections-1968
    c: 'Wallace on Face the Nation: he means to win outright, every Southern border State "all the way up to the Free State of Maryland"; no conditions under which he would withdraw; the electoral college meets first. July 23, Des Moines: the House compact "just so foolish."'
