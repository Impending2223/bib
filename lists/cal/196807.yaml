    n: 'Remarks Upon Signing the Juvenile Delinquency Prevention and Control Act of 1968, [1968–69 Pub. Papers 855](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=165) (July 31, 1968). Statute (K–J Cong. II.J.2). See [[cal.1967-02-18.crime-and-hijacking]]. Names: Johnson.'
