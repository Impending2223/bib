    date: '1968-07-19'
    thread: elections-1968-miami
    also: [republican-party]
    c: 'Ike Williams, of the Concerned Negro Republicans of Florida: a challenge to Florida''s all-white delegation, and pickets at the convention. The Ripon Society: three Negroes among the South''s 310 delegates.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1993.'
    tags: [state:fl]
  - id: cal.1968-07-20.conservation
    when: July 20
    date: '1968-07-20'
    thread: conservation
    c: 'The Senate passes the public works and Atomic Energy Commission appropriation, H.R. 17903, 67–3: $4,727,622,500. Cooper''s cut of $3,750,000 for the Tennessee Valley Authority''s land buying refused, 28–43.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 2011. Names: Cooper.'
    tags: [name:cooper-john-sherman]
