    c: 'News conference. Opening: Bethlehem''s increase in steel prices "unreasonable," and it "should not be permitted to stand"; some $600 million a year to consumers. The $91 million for impacted school aid that Congress added over the budget reserved; the House and Senate have added $110 million more to the Labor-HEW bill. On infiltration: "30,000 or more North Vietnamese soldiers entered South Vietnam in July," and more expected in August; from an unclassified report, truck sightings in the week of July 15–21 947, against a weekly average of 717 in April; a cable from the commanders that the enemy is preparing "a massive attack." Asked whether the Senate''s treatment of Fortas discourages him: "I don''t know that I can improve the situation by any comments that I would make. I certainly don''t want to inflame it any." How he chose Fortas and Thornberry; while the clearances were being sought, Republican Senators had said no appointment should be made in an election year.'
