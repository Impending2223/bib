    date: '1968-07-21'
    thread: elections-1968
    c: 'McCarthy proposes three debates with Humphrey, sooner, on foreign, domestic and economic policy and the presidency; Blair Clark''s statement. On Metromedia: a Vietnam plank of a new government negotiated in Saigon, "a coalition with the National Liberation Front."'
