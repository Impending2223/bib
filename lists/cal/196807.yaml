  - id: cal.1968-07-01.testing
    when: July 1
    date: '1968-07-01'
    time: 1968-07-01T15:45Z
    thread: testing-npt
    also: [testing-missile-talks, soviet-union]
    c: 'Treaty on the Non-Proliferation of Nuclear Weapons signed at Washington, London and Moscow, [21 U.S.T. 483](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-21-1/lltreaties-21-1.pdf#page=491), [729 U.N.T.S. 161](https://treaties.un.org/doc/Publication/UNTS/Volume%20729/volume-729-I-10485-English.pdf). In the East Room, Rusk for the United States; fifty-six states sign at Washington. The nonnuclear states not to make or receive nuclear weapons; safeguards of the IAEA; the nuclear powers to negotiate on ending the arms race. Johnson announces agreement with the Soviet Union "to enter in the nearest future into discussions on the limitation and the reduction of both offensive strategic nuclear weapons delivery systems and systems of defense against ballistic missiles." After the signing, Rusk to Dobrynin: Johnson thinking of another meeting with Kosygin.'
    n: 'Remarks at the Signing of the Nuclear Nonproliferation Treaty, [1968–69 Pub. Papers 763](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=73) (July 1, 1968). FRUS 1964–68, XIV, doc. [278](https://history.state.gov/historicaldocuments/frus1964-68v14/d278); XI, doc. [250](https://history.state.gov/historicaldocuments/frus1964-68v11/d250) (editorial note). [[w.drea-mcnamara-clifford-and-the-2011]], 331, 338 (the signing in the three capitals, the treaty''s bar; the talks announced); [[w.poole-joint-chiefs-of-staff-2012]], 80 (the signing; the articles); [[w.dobrynin-in-confidence]], 153, 182 (the signing, the announcement; Rusk''s word of a meeting). [[w.rusk-as-i-saw-it-1990]], 344. Check: Dobrynin: signed at Washington by Rusk, the Soviet and British ambassadors and those of fifty more countries (153); Rusk''s word of a meeting July 2 (182). To check: [[w.seaborg-stemming-the-tide]]; [[w.brands-rethinking-nonproliferation]]; [[w.maddock-nuclear-apartheid]]; [[w.newhouse-cold-dawn]]. See [[cal.1968-06-12.testing]]; [[cal.1968-06-21.testing]]. Names: Rusk, Dobrynin, Kosygin, Johnson.'
