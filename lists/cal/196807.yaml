  - id: cal.1968-07-01.vietnam-air-war
    when: July 1–7
    date: '1968-07-01'
    thread: vietnam-air-war
    c: 'Thor, in the Cap Mũi Lay sector: 1,787 tactical air sorties, 210 by B-52s, 41,693 rounds from seven ships and the artillery; nearly 2,000 enemy gun positions and structures destroyed, by the best estimates; three aircraft lost. Artillery forward, ships within five kilometers of the shore unfired upon.'
    n: '[[w.macv-command-history-1968]], 408–09. To check: CG PROVCORPSV to CG III MAF, 141358Z Jul 68, "Preliminary Report--Operation THOR" (cited by [[w.macv-command-history-1968]], 408 n.145). See [[cal.1968-06-21.vietnam-air-war]].'
