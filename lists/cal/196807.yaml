    when: July 9
    date: '1968-07-09'
    thread: elections-1968
    c: Boggs, chairman of the platform committee, asks the White House for direction; Johnson agrees to see him.
    n: '[[w.dallek-flawed-giant]], 574. To check: Jones to Johnson, July 9, 1968, WHCF: EX/PL1, LBJ Library (cited by [[w.dallek-flawed-giant]], 574). See [[cal.1968-04-27.elections-1968]]. Names: Boggs, Johnson.'
