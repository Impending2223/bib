    c: 'Johnson to Rusk by telephone, on the Paris cable: Clifford "kind of expressing the viewpoint that''s contained in the cable"; "we''re not going to stop the bombing until they agree to stop some." At lunch, Johnson asks Taylor for a report on "this new wave of demands to stop the bombing."'
    n: 'FRUS 1964–68, VI, docs. [314](https://history.state.gov/historicaldocuments/frus1964-68v06/d314), [316](https://history.state.gov/historicaldocuments/frus1964-68v06/d316). [Johnson and Rusk, 9:57 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dean-rusk-july-30-1968), Conversation WH6807-02-13219 (Miller Center). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-07-29.vietnam]]. Names: Johnson, Rusk, Clifford, Taylor.'
