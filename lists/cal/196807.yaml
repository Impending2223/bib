# Cal. CV July 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CV
entries:
  - id: cal.1968-07-01.testing
    when: July 1
    date: '1968-07-01'
    thread: testing-npt
    also: [testing-missile-talks, soviet-union]
    c: 'Treaty on the Non-Proliferation of Nuclear Weapons signed at Washington, London and Moscow, [21 U.S.T. 483](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-21-1/lltreaties-21-1.pdf#page=491), [729 U.N.T.S. 161](https://treaties.un.org/doc/Publication/UNTS/Volume%20729/volume-729-I-10485-English.pdf). In the East Room, Rusk for the United States; fifty-six states sign at Washington. The nonnuclear states not to make or receive nuclear weapons; safeguards of the IAEA; the nuclear powers to negotiate on ending the arms race. Johnson announces agreement with the Soviet Union "to enter in the nearest future into discussions on the limitation and the reduction of both offensive strategic nuclear weapons delivery systems and systems of defense against ballistic missiles." After the signing, Rusk to Dobrynin: Johnson thinking of another meeting with Kosygin.'
    n: 'Remarks at the Signing of the Nuclear Nonproliferation Treaty, [1968–69 Pub. Papers 763](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=73) (July 1, 1968). FRUS 1964–68, XIV, doc. [278](https://history.state.gov/historicaldocuments/frus1964-68v14/d278). [[w.seaborg-stemming-the-tide]]; [[w.brands-rethinking-nonproliferation]]; [[w.maddock-nuclear-apartheid]]; [[w.newhouse-cold-dawn]]. See [[cal.1968-06-12.testing]]; [[cal.1968-06-21.testing]]. Names: Rusk, Dobrynin, Kosygin, Johnson.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:dobrynin-anatoly, name:kosygin-aleksei]
  - id: cal.1968-07-01.immigration
    when: July 1
    date: '1968-07-01'
    thread: immigration
    c: 'The national origins quota system ends, under the Immigration Act of 1965: 170,000 visas a year outside the Western Hemisphere, by preference, no more than 20,000 to a country; for the first time a ceiling on the Western Hemisphere, 120,000. Johnson to the American Committee on Italian Migration: "No longer will only three nations supply 70 percent of America''s immigrants."'
    n: 'Remarks to the American Committee on Italian Migration on the Occasion of the Termination of the National Origins Quota System, [1968–69 Pub. Papers 768](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=78) (July 1, 1968). See [[cal.1965-10-03.immigration]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-01.transportation
    when: July 1
    date: '1968-07-01'
    thread: transportation
    also: [cities-and-housing]
    c: Reorganization Plan No. 2 of 1968 in effect, sent Feb. 26 and not disapproved by Congress. The Urban Mass Transportation Administration in the Department of Transportation; the mass transit programs moved from HUD. HUD keeps the planning grants for the cities' transit.
    n: 'Statement by the President on the Reorganization of Urban Mass Transportation Functions, [1968–69 Pub. Papers 767](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=77) (July 1, 1968). Check: the plan''s terms, in the Federal Register. [[w.smerk-urban-transportation]]. See [[cal.1966-10-15.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-01.european-community
    when: July 1
    date: '1968-07-01'
    thread: european-community
    also: [trade]
    c: 'The European Economic Community''s customs union complete, eighteen months ahead of the Treaty of Rome''s schedule: the last duties on trade among the Six removed; the common external tariff in force. Johnson''s message to Rey.'
    n: 'Message to Jean Rey, President of the Commission of the European Communities, on the Occasion of the Completion of the European Customs Union, [1968–69 Pub. Papers 763](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=73) (July 1, 1968). See [[cal.1967-11-27.european-community]]. Names: Rey, Johnson.'
    tags: [name:johnson-lyndon-b, name:rey-jean]
  - id: cal.1968-07-02.defense
    when: July 2
    date: '1968-07-02'
    thread: defense
    c: 'Gen. Harold K. Johnson retires as Army Chief of Staff; the Distinguished Service Medal at the White House.'
    n: 'Remarks Upon Presenting the Distinguished Service Medal to Gen. Harold K. Johnson, Retiring Chief of Staff, USA, [1968–69 Pub. Papers 769](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=79) (July 2, 1968). [[w.sorley-honorable-warrior]]. Names: Harold K. Johnson, Lyndon Johnson.'
    tags: [name:johnson-lyndon-b, name:johnson-harold-k]

  - id: cal.1968-07-03.vietnam-abrams
    when: July 3
    date: '1968-07-03'
    thread: vietnam-abrams
    also: [defense]
    c: 'Westmoreland Army Chief of Staff; Abrams, in acting command since Westmoreland left Saigon June 11, commander in Vietnam.'
    n: 'Remarks at the Presentation of the Distinguished Service Medal to General Westmoreland, [1968–69 Pub. Papers 806](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=116) (July 12, 1968). [[w.sorley-westmoreland]]; [[w.sorley-thunderbolt]]; [[w.sorley-better-war]]. See [[cal.1968-03-22.vietnam]]. Names: Westmoreland, Abrams.'
    tags: [name:westmoreland-william, name:abrams-creighton]

  - id: cal.1968-07-03.state-and-city-finance-tx
    when: July 3
    date: '1968-07-03'
    thread: state-and-city-finance
    c: 'Texas. The special session ends: the appropriation and some $159 million in taxes for it, the State sales tax and the motor vehicle sales tax up a cent, the franchise tax up 50 cents a thousand, from Oct. 1. Connally''s broader sales tax, with rebates to the cities, refused.'
    n: '[*Bastrop Advertiser*, July 11, 1968, 2](https://texashistory.unt.edu/ark:/67531/metapth238161/m1/2); [60th Leg., 1st C.S., H.B. 2, Texas Senate Papers](https://texashistory.unt.edu/ark:/67531/metapth595271/). Check: the General and Special Laws, 60th Leg., 1st C.S., the rates, and the days of passage. See [[cal.1968-06-04.state-and-city-finance-tx]]. Names: Connally.'
    tags: [state:tx, name:connally-john]

  - id: cal.1968-07-03.elections-1968
    when: July 3–4
    date: '1968-07-03'
    thread: elections-1968
    c: 'Minneapolis, the evening of July 3: hecklers keep Wallace from speaking. Johnson, July 4: "Americans of every viewpoint must be deeply concerned over the intolerance which prevented presidential candidate George Wallace from speaking."'
    n: 'Statement by the President on the Disruption by Hecklers of a Speech by George Wallace in Minneapolis, [1968–69 Pub. Papers 778](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=88) (July 4, 1968). [[w.carter-politics-of-rage-1995]]; [[w.chester-american-melodrama]]. Names: Wallace, Johnson.'
    tags: [name:wallace-george-c, name:johnson-lyndon-b, state:mn, city:minneapolis]
  - id: cal.1968-07-03.opinion
    when: July 3
    date: '1968-07-03'
    thread: opinion
    also: [civil-disorders]
    c: 'Gallup, June 13–18: some call this country a "sick society": agree 36 percent, disagree 58. Whites 35 and 60; Negroes 48 and 43. Wallace''s supporters 42 and 51; Nixon''s 36 and 61; Humphrey''s 32 and 61.'
    n: '[[w.gallup-poll]], III, 2138–39. Names: Wallace, Nixon, Humphrey.'
    tags: [name:wallace-george-c, name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-07-05.war-opposition
    when: July 5
    date: '1968-07-05'
    thread: war-opposition
    c: 'Flag desecration act signed, [82 Stat. 291](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg291-2.pdf): up to a year in prison and a $1,000 fine for whoever "knowingly casts contempt" on a flag of the United States by publicly mutilating, defacing, defiling, burning or trampling it. Introduced after the burning of flags in Central Park, Apr. 15, 1967.'
    n: Statute (K–J Cong. II.J.2). [[w.goldstein-saving-old-glory]]. See [[cal.1967-04-15.war-opposition]].
  - id: cal.1968-07-05.latin-america
    when: July 5
    date: '1968-07-05'
    thread: latin-america
    c: 'Barrientos Ortuño of Bolivia at the LBJ Ranch.'
    n: 'The President''s Toast at a Luncheon at the LBJ Ranch Honoring President Barrientos of Bolivia, [1968–69 Pub. Papers 779](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=89) (July 5, 1968). See [[cal.1967-04-11.latin-america]]. Names: Barrientos Ortuño, Johnson.'
    tags: [name:johnson-lyndon-b, name:barrientos-ortuno-rene]

  - id: cal.1968-07-06.latin-america
    when: July 6–8
    date: '1968-07-06'
    thread: latin-america
    also: [foreign-aid]
    c: 'San Salvador: Johnson with the Presidents of El Salvador, Costa Rica, Honduras, Nicaragua and Guatemala at the headquarters of the Organization of Central American States. Joint Declaration, July 6: the Central American Common Market and the integration program of Punta del Este; United States support for a Central American Fund for Economic Integration and the Central American Bank (Check the amounts). July 8, stops at Managua, San José, Guatemala City and San Pedro Sula.'
    n: 'Joint Declaration of the Presidents Following Their Meeting in San Salvador, [1968–69 Pub. Papers 785](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=95) (July 6, 1968); Remarks at the Working Session of the Presidents of the Central American Republics in San Salvador, [1968–69 Pub. Papers 782](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=92) (July 6, 1968). [[w.taffet-foreign-aid-as-foreign]]; [[w.lafeber-inevitable-revolutions]]. See [[cal.1967-04-11.latin-america]]. Names: Sánchez Hernández, Trejos Fernández, López Arellano, Somoza Debayle, Méndez Montenegro, Johnson.'
    tags: [name:johnson-lyndon-b, name:sanchez-hernandez-fidel, name:trejos-fernandez-jose-joaquin, name:lopez-arellano-oswaldo, name:somoza-debayle-anastasio, name:mendez-montenegro-julio-cesar]

  - id: cal.1968-07-07.opinion
    when: July 7
    date: '1968-07-07'
    thread: opinion
    also: [elections-1968-polls, congress]
    c: 'Gallup, June 13–18, the party one would like to see win this congressional district, the undecided left out: Democratic 58 percent, Republican 42. South 70 and 30; outside the South 55 and 45.'
    n: '[[w.gallup-poll]], III, 2139.'
  - id: cal.1968-07-09.testing
    when: July 9
    date: '1968-07-09'
    thread: testing-npt
    c: 'The nonproliferation treaty sent to the Senate: "the most important international agreement limiting nuclear arms since the nuclear age began." Ninety-five members of the United Nations had voted to commend it; signed at Washington by the United States, Britain, the Soviet Union and fifty-three others.'
    n: 'Special Message to the Senate Urging Consent to the Ratification of the Nuclear Nonproliferation Treaty, [1968–69 Pub. Papers 801](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=111) (July 9, 1968). See [[cal.1968-07-01.testing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-10.cities-and-housing
    when: July 10–11
    date: '1968-07-10'
    thread: cities-and-housing
    c: 'The House passes the Housing and Urban Development bill, H.R. 17989, [295–114](https://voteview.com/rollcall/RH0900374), after limiting the incomes of those the low-income housing may serve, [270–137](https://voteview.com/rollcall/RH0900372), and recommitting it with instructions to strike the upgrading of public housing management and the interim assistance to blighted areas, [217–193](https://voteview.com/rollcall/RH0900373). Johnson, July 11: low- and middle-income housing at ten times any earlier rate; the beginning of 6 million federally subsidized units.'
    n: 'Statement by the President Following House Action on the Housing and Urban Development Act of 1968, [1968–69 Pub. Papers 805](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=115) (July 11, 1968). [[w.haar-between-the-idea-and]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1968-05-28.cities-and-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-07-11.court
    when: July 11
    date: '1968-07-11'
    thread: court-fortas
    also: [confirmations]
    c: 'The Senate Judiciary Committee, Eastland chairman, opens its hearings on the nominations of Fortas as Chief Justice and Thornberry to his seat. Griffin, leading the Republicans against confirming a "lame duck" President''s nominees, among the first witnesses (Check).'
    n: 'Check: *Nominations of Abe Fortas and Homer Thornberry: Hearings Before the Senate Committee on the Judiciary*, 90th Cong., 2d Sess. (1968), not found online. [U.S. Senate Historical Office, "Filibuster Derails Supreme Court Appointment"](https://www.senate.gov/about/powers-procedures/nominations/filibuster-derails-supreme-court-appointment.htm). See [[cal.1968-06-26.court]]. Names: Eastland, Fortas, Thornberry, Griffin, Johnson.'
    tags: [name:eastland-james-o, name:fortas-abe, name:thornberry-william-h, name:griffin-robert-p, name:johnson-lyndon-b]

  - id: cal.1968-07-11.africa
    when: July 11
    date: '1968-07-11'
    thread: africa
    c: 'Johnson''s appeal on Nigeria: the civilians of the Eastern Region "threatened not just by violence but by starvation"; the United States ready to support the International Committee of the Red Cross with more funds, supplies and equipment; relief "frustrated by disputes on how to get supplies through the lines." "Mass starvation that can be prevented must be prevented."'
    n: 'Statement by the President Appealing for the Prevention of Mass Starvation in Nigeria, [1968–69 Pub. Papers 805](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=115) (July 11, 1968). [[w.thompson-american-policy-and-african]]; [[w.stremlau-international-politics-of-the]]. See [[cal.1967-05-30.africa]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-11.opinion
    when: July 11
    date: '1968-07-11'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 26–July 1, with Wallace as a third party''s candidate: Humphrey 40 percent, Nixon 35, Wallace 16, undecided 9. South: Humphrey 33, Wallace 32, Nixon 29. Non-whites: Humphrey 83, Nixon 7. Humphrey 36, Rockefeller 36, Wallace 21; South, Wallace 39, Humphrey 33, Rockefeller 21.'
    n: '[[w.gallup-poll]], III, 2139–43. Names: Humphrey, Nixon, Wallace, Rockefeller.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:rockefeller-nelson]
  - id: cal.1968-07-12.elections-1968
    when: July 12
    date: '1968-07-12'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'New York. Anna Chennault brings Bùi Diễm, South Vietnam''s ambassador, to Nixon; Mitchell present (Check the place). Nixon: Chennault his channel to the South Vietnamese government. The meeting kept secret.'
    n: 'Made public: [[w.chennault-education-of-anna]]; [[w.diem-in-the-jaws-of]]. [[w.hersh-price-of-power]]; [[w.forslund-anna-chennault]]; [[w.hughes-chasing-shadows]]; [[w.farrell-richard-nixon]]; [[w.lafeber-deadly-bet]]; [[w.powers-man-who-kept-the]]; [[w.clifford-counsel-to-the-president-2]]; [[w.berman-no-peace-no-honor]]; [[w.bundy-tangled-web]]; [[w.kimball-nixons-vietnam-war]]; [[w.dallek-flawed-giant]]. Names: Chennault, Bùi Diễm, Nixon, Mitchell.'
    tags: [name:chennault-anna, name:bui-diem, name:nixon-richard-m, name:mitchell-john-n, state:ny, city:nyc]
  - id: cal.1968-07-12.opinion
    when: July 12
    date: '1968-07-12'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 26–July 1, with Wallace as a third party''s candidate: McCarthy 39 percent, Nixon 36, Wallace 18, undecided 7. Those 21 to 29: McCarthy 47, Nixon 35. South: Nixon 33, Wallace 32, McCarthy 27. McCarthy 37, Rockefeller 35, Wallace 20; South, Wallace 38, McCarthy 28, Rockefeller 24.'
    n: '[[w.gallup-poll]], III, 2143–47. Names: McCarthy, Nixon, Wallace, Rockefeller.'
    tags: [name:mccarthy-eugene-j, name:nixon-richard-m, name:wallace-george-c, name:rockefeller-nelson]
  - id: cal.1968-07-15.black-nationalism-oakland
    when: July 15
    date: '1968-07-15'
    thread: black-nationalism
    also: [crime-and-hijacking]
    c: Oakland, the Alameda County courthouse. Newton's trial opens for the death of Officer John Frey, Oct. 28, 1967; Charles Garry for the defense. Panthers and "Free Huey" demonstrators outside (Check the date). The verdict in September.
    n: '[[w.bloom-black-against-empire]]; [[w.newton-revolutionary-suicide]]; [[w.seale-seize-the-time]]. See [[cal.1967-10-28.black-nationalism-oakland]]. Names: Newton.'
    tags: [name:newton-huey-p, state:ca, city:oakland]
  - id: cal.1968-07-15.conservation
    when: July 15
    date: '1968-07-15'
    thread: conservation
    c: 'Signed, [82 Stat. 354](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg354-2.pdf): the Land and Water Conservation Fund raised to $200 million a year for five years, revenues under the Outer Continental Shelf Lands Act to make up what other receipts lack. The same day the House passes the Redwood National Park bill, S. 2515, [389–15](https://voteview.com/rollcall/RH0900382), and the national trails bill, H.R. 4865, [378–18](https://voteview.com/rollcall/RH0900386).'
    n: 'Remarks Upon Signing Bill To Enlarge the Land and Water Conservation Fund, [1968–69 Pub. Papers 808](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=118) (July 15, 1968). Statute (K–J Cong. II.J.2). See [[cal.1964-09-03.conservation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-15.soviet-union
    when: July 15
    date: '1968-07-15'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: 'Czechoslovakia. The Warsaw letter of the Soviet, Polish, East German, Hungarian and Bulgarian parties to the Czechoslovak party: the danger of counterrevolution.'
    n: 'FRUS 1964–68, XVII, docs. [65](https://history.state.gov/historicaldocuments/frus1964-68v17/d65), [67](https://history.state.gov/historicaldocuments/frus1964-68v17/d67). Made public: FRUS 1964–68, XVII (1996). [[w.williams-prague-spring-and-its]]; [[w.dawisha-kremlin-and-the-prague]]; [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1968-03-22.soviet-union]].'

  - id: cal.1968-07-16.court-fortas
    when: July 16–20
    date: '1968-07-16'
    thread: court-fortas
    also: [confirmations]
    c: 'Fortas before the Judiciary Committee four days, the first sitting Justice named Chief Justice to appear, July 16–19: questions on his advice to Johnson while on the Court, the Court''s decisions on crime and obscenity. Thurmond on *Mallory v. United States*.'
    n: 'Daily Digest, [114 Cong. Rec. D353](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=351), [114 Cong. Rec. D357](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=355), [114 Cong. Rec. D361](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=359), [114 Cong. Rec. D365](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=363). Check: the hearings (above). See [[cal.1968-07-11.court]]. Names: Fortas, Johnson, Thurmond.'
    tags: [name:fortas-abe, name:johnson-lyndon-b, name:thurmond-strom]

  - id: cal.1968-07-16.health
    when: July 16
    date: '1968-07-16'
    thread: health
    also: [foreign-aid]
    c: 'A Committee on Population and Family Planning, eighteen members, Cohen and John D. Rockefeller 3d its cochairmen: the federal role in research on fertility control and contraceptives; access for all families to information and services "to plan the number and spacing of their children"; help to the developing countries; the cost of a five-year program.'
    n: 'Statement by the President Upon Appointing the Committee on Population and Family Planning, [1968–69 Pub. Papers 817](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=127) (July 16, 1968). [[w.critchlow-intended-consequences]]. Names: Cohen, Rockefeller, Johnson.'
    tags: [name:johnson-lyndon-b, name:cohen-wilbur-j, name:rockefeller-john-d]
  - id: cal.1968-07-17.foreign-aid
    when: July 17
    date: '1968-07-17'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1968, H.R. 15263. Johnson: the lowest request in history, already cut $600 million, about 20 percent, by the Foreign Affairs Committee.'
    n: 'Statement by the President on the Foreign Aid Bill, [1968–69 Pub. Papers 818](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=128) (July 17, 1968); Recorded Remarks in Support of the Foreign Aid Bill, [1968–69 Pub. Papers 819](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=129) (July 17, 1968). See [[cal.1967-11-08.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-07-18.vietnam
    when: July 18
    date: '1968-07-18'
    thread: vietnam
    c: 'Clifford, back from Saigon (July 13–18), to Johnson: large attacks expected in I Corps and around Saigon, probably in late August.'
    n: 'FRUS 1964–68, VI, docs. [302](https://history.state.gov/historicaldocuments/frus1964-68v06/d302), [303](https://history.state.gov/historicaldocuments/frus1964-68v06/d303). [[w.clifford-counsel-to-the-president-2]], 550–553. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-13.vietnam]]. Names: Clifford, Johnson.'
    tags: [name:clifford-clark, name:johnson-lyndon-b, place:saigon]

  - id: cal.1968-07-18.foreign-aid
    when: July 18
    date: '1968-07-18'
    thread: foreign-aid
    c: 'The House recommits the foreign aid bill with instructions to cut some $165 million more, [268–150](https://voteview.com/rollcall/RH0900390), and passes it, [228–184](https://voteview.com/rollcall/RH0900391).'
    n: 'See [[cal.1968-07-17.foreign-aid]].'

  - id: cal.1968-07-18.elections-1968
    when: July 18
    date: '1968-07-18'
    thread: elections-1968
    c: Walter Reed Army Hospital. Eisenhower, a patient since his heart attack of April, endorses Nixon (Check the day).
    n: '[[w.frank-ike-and-dick]]; [[w.ambrose-nixon]]; [[w.eisenhower-going-home-to-glory]]. See [[cal.1967-10.elections-1968]]. Names: Eisenhower, Nixon.'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m]
  - id: cal.1968-07-18.opinion
    when: July 18
    date: '1968-07-18'
    thread: opinion
    also: [court]
    c: 'Gallup, June 26–July 1: the Supreme Court rated excellent 8 percent, good 28, fair 32, poor 21. South: excellent 5, good 18, fair 35, poor 31. College-educated: 14, 34, 27 and 21. Those 50 and over: poor 29.'
    n: '[[w.gallup-poll]], III, 2147–48.'
  - id: cal.1968-07-19.vietnam
    when: July 19–20
    date: '1968-07-19'
    thread: vietnam
    c: 'Honolulu. Johnson and Nguyễn Văn Thiệu, a meeting in place of the state visit Thiệu put off. Joint statement, July 20: South Vietnam''s forces 765,000 in June, more than 800,000 by the year''s end; M-16s for all its forces in 1969; South Vietnam "a full participant playing a leading role" in talks on a settlement; the United States will not support the imposition of "a ''coalition government,''" or any other, on the South. No response from Hanoi to the limitation of the bombing.'
    n: 'Joint Statement Following Discussions With President Thieu of South Vietnam at the Honolulu Conference, [1968–69 Pub. Papers 823](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=133) (July 20, 1968); Statement to the Press at the Close of the Honolulu Conference, [1968–69 Pub. Papers 828](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=138) (July 20, 1968). FRUS 1964–68, VI, doc. [304](https://history.state.gov/historicaldocuments/frus1964-68v06/d304). [[w.johnson-vantage-point]]; [[w.diem-in-the-jaws-of]]; [[w.berman-lyndon-johnsons-war]]. See [[cal.1968-07-18.vietnam]]. Names: Johnson, Nguyễn Văn Thiệu.'
    tags: [name:johnson-lyndon-b, name:nguyen-van-thieu, state:hi, city:honolulu]

  - id: cal.1968-07-19.poverty
    when: July 19
    date: '1968-07-19'
    thread: poverty
    also: [crime-and-hijacking]
    c: 'The Senate cites Jeff Fort, leader of the Blackstone Rangers, for contempt, [80–0](https://voteview.com/rollcall/RS0900500), S. Res. 379: he had walked out of the hearing of McClellan''s Permanent Subcommittee on Investigations on the Office of Economic Opportunity''s grant to The Woodlawn Organization, for job training run with the Rangers and the Disciples (Check the grant and the date of the walkout).'
    n: '[[w.moore-almighty-black-p-stone]]. See [[cal.1967-11-15.poverty]]. Names: Fort, McClellan.'
    tags: [name:fort-jeff, name:mcclellan-john-l, state:il, city:chicago]
  - id: cal.1968-07-19.farm
    when: July 19–20
    date: '1968-07-19'
    thread: farm
    c: 'The farm programs of the Food and Agriculture Act of 1965. The Senate passes S. 3590, a four-year extension, [58–18](https://voteview.com/rollcall/RS0900507), July 20, after refusing a one-year extension, [33–45](https://voteview.com/rollcall/RS0900501), and a three-year, [40–40](https://voteview.com/rollcall/RS0900503), July 19, and a limit of $25,000 a year on the payments to one recipient, [25–47](https://voteview.com/rollcall/RS0900504).'
    n: '[[w.cochrane-american-farm-policy-1948]]; [[w.hansen-gaining-access]]. See [[cal.1967-09-27.farm]].'

  - id: cal.1968-07-21.states-and-cities-us
    when: July 21–24
    date: '1968-07-21'
    thread: states-and-cities
    also: [civil-rights-the-executive]
    c: Cincinnati. The National Governors' Conference, its 60th meeting. July 23, Johnson to the governors. July 24, Romney's "Declaration of Conscience," against racism, human rights and property rights "interlinked," adopted by a show of hands, 21–5, the governors of Alabama and Georgia speaking against. Ellington elected chairman.
    n: '*Proceedings of the National Governors'' Conference, 1968*, [89–92](https://www.nga.org/wp-content/uploads/2021/03/1968NGAAnnualMeeting.pdf#page=104), 105. Remarks Before the National Governors'' Conference in Cincinnati, [1968–69 Pub. Papers 833](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=143) (July 23, 1968). [[w.sparacino-democratic-and-republican-governors]]. See [[cal.1968-02-28.states-and-cities-us]]. Names: Johnson, Romney, Maddox, Ellington.'
    tags: [name:johnson-lyndon-b, name:romney-george-w, name:maddox-lester, name:ellington-buford]
  - id: cal.1968-07-21.opinion
    when: July 21
    date: '1968-07-21'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 13–18, McCarthy''s supporters, with Rockefeller, Humphrey and Wallace (the American Independent party''s) the candidates: Humphrey 62 percent, Rockefeller 33, Wallace 2. June 26–July 1, Rockefeller''s supporters, with Nixon, McCarthy and Wallace: Nixon 59, McCarthy 34, Wallace 3.'
    n: '[[w.gallup-poll]], III, 2149. Names: McCarthy, Rockefeller, Humphrey, Wallace, Nixon.'
    tags: [name:mccarthy-eugene-j, name:rockefeller-nelson, name:humphrey-hubert-h, name:wallace-george-c, name:nixon-richard-m]
  - id: cal.1968-07-22.soviet-union-czechoslovakia
    when: July 22
    date: '1968-07-22'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: 'Rusk to Dobrynin: no truth in the Soviet press''s charges of an American hand in Czechoslovakia; the United States has kept out.'
    n: 'FRUS 1964–68, XVII, doc. [70](https://history.state.gov/historicaldocuments/frus1964-68v17/d70). Made public: FRUS 1964–68, XVII (1996). See [[cal.1968-07-15.soviet-union]]. Names: Rusk, Dobrynin.'
    tags: [name:rusk-dean, name:dobrynin-anatoly]

  - id: cal.1968-07-23.civil-disorders
    when: July 23–27
    date: '1968-07-23'
    thread: civil-disorders
    also: [black-nationalism]
    c: 'Cleveland, Glenville, the night of July 23–24: gunfire for some four hours between the police and Ahmed Evans''s Black Nationalists of New Libya. Three policemen killed, three of the gunmen, a bystander; at least fifteen wounded. Stokes keeps white policemen out of the area, Negro leaders and Negro police to patrol it; looting and burning go on; the National Guard and the rest of the police sent in (Check the days). Over July 27.'
    n: '[[w.masotti-shoot-out-in-cleveland]]; [[w.stokes-promises-of-power]]. Check: the counts, in Masotti and Corsi. See [[cal.1966-07-18.states-and-cities]]. Names: Evans, Stokes.'
    tags: [name:evans-fred, name:stokes-carl-b, state:oh, city:cleveland]
  - id: cal.1968-07-23.economy
    when: July 23
    date: '1968-07-23'
    thread: economy
    also: [jobs-and-wages]
    c: 'At Austin. Johnson underlines the Cabinet Committee on Price Stability''s call for restraint in wages and prices: the tax bill "cannot do the entire job by itself"; more than 250 large contracts expire, August through December, among them steel, aerospace, longshoring, coal, airlines and railroads. That night, Cincinnati, the National Governors'' Conference: more than fifty major bills before Congress.'
    n: 'Statement by the President on the Need for Restraint by Business and Labor in the Interest of Economic Stability, [1968–69 Pub. Papers 832](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=142) (July 23, 1968); Remarks Before the National Governors'' Conference in Cincinnati, [1968–69 Pub. Papers 833](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=143) (July 23, 1968). [[w.okun-political-economy-of-prosperity]]. See [[cal.1968-06-20.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-23.court-fortas
    when: July 23
    date: '1968-07-23'
    thread: court-fortas
    c: 'The Judiciary Committee''s hearings on Fortas and Thornberry recess (Check).'
    n: 'Daily Digest, [114 Cong. Rec. D372](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=370) (Warren Christopher; an executive meeting the next day). See [[cal.1968-07-11.court]]. Names: Fortas, Thornberry.'
    tags: [name:fortas-abe, name:thornberry-william-h]

  - id: cal.1968-07-24.crime-and-hijacking
    when: July 24
    date: '1968-07-24'
    thread: crime-and-hijacking
    c: 'The House passes the gun bill, H.R. 17735, [305–118](https://voteview.com/rollcall/RH0900398): the mail-order and interstate sale of rifles, shotguns and their ammunition stopped, with the sale to minors. No registration or licensing of owners, which Johnson asked in June. Rifle, shotgun and .22 rimfire ammunition taken out of the bill, [218–205](https://voteview.com/rollcall/RH0900395); exemptions for competition and military training, [225–198](https://voteview.com/rollcall/RH0900397); Poff''s penalties for using a gun in a federal felony, [412–11](https://voteview.com/rollcall/RH0900396). Check: the ammunition amendment''s fate in conference.'
    n: '[[w.zimring-firearms-and-federal-law]]; [[w.spitzer-politics-of-gun-control]]; [[w.winkler-gunfight]]. See [[cal.1968-06-06.crime-and-hijacking]]. Names: Poff, Johnson.'
    tags: [name:poff-richard-h, name:johnson-lyndon-b]
  - id: cal.1968-07-24.soviet-union-czechoslovakia
    when: July 24
    date: '1968-07-24'
    thread: soviet-union-czechoslovakia
    c: 'Czechoslovakia. Rostow at lunch: the Soviets will not move militarily.'
    n: 'FRUS 1964–68, XVII, doc. [72](https://history.state.gov/historicaldocuments/frus1964-68v17/d72). Made public: FRUS 1964–68, XVII (1996). See [[cal.1968-07-15.soviet-union]]. Names: Rostow.'
    tags: [name:rostow-walt-w]

  - id: cal.1968-07-24.opinion
    when: July 24
    date: '1968-07-24'
    thread: opinion
    also: [middle-east]
    c: 'Gallup, June 26–July 1: the main cause of trouble between Israelis and Arabs: ancient enmity 22 percent, territorial rights 16; no opinion 41. In a full-scale war there in the next year or two, the United States to stay out 61; to support Israel 10. In such a war, supply arms and material to Israel: should 24, should not 59; to the Arabs, 3 and 79. Send troops to help Israel: 9 and 77. Another full-scale war likely within five years: is 62, is not 13.'
    n: '[[w.gallup-poll]], III, 2149–50.'
  - id: cal.1968-07-25.students
    when: July 25
    date: '1968-07-25'
    thread: students
    also: [school-aid]
    c: The House passes the Higher Education Amendments, H.R. 15067, [389–15](https://voteview.com/rollcall/RH0900400), after an amendment denying its aid to students convicted of crimes in campus disorders, [260–146](https://voteview.com/rollcall/RH0900399). The Senate had passed its bill, S. 3769, [83–0](https://voteview.com/rollcall/RS0900488), July 15.
    n: '[[w.graham-uncertain-triumph]]. Check: the amendment''s terms. See [[cal.1967-10-18.students]].'
  - id: cal.1968-07-25.testing
    when: July 25
    date: '1968-07-25'
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'Kosygin to Johnson: talks on "the curbing of the strategic armaments race" could begin at Geneva in a month to a month and a half.'
    n: 'FRUS 1964–68, XI, doc. [261](https://history.state.gov/historicaldocuments/frus1964-68v11/d261). Made public: FRUS 1964–68, XI (1997). [[w.newhouse-cold-dawn]]; [[w.smith-doubletalk]]; [[w.seaborg-stemming-the-tide]]. See [[cal.1968-06-21.testing]]. Names: Kosygin, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b]

  - id: cal.1968-07-26.cities-and-housing
    when: July 26
    date: '1968-07-26'
    thread: cities-and-housing
    c: 'The conference report on the Senate''s housing bill, S. 3497, through the House, [228–135](https://voteview.com/rollcall/RH0900405).'
    n: 'See [[cal.1968-07-10.cities-and-housing]].'

  - id: cal.1968-07-26.elections-1968
    when: July 26
    date: '1968-07-26'
    thread: elections-1968
    also: [vietnam]
    c: 'The candidates briefed. Rusk briefs Wallace at the State Department and the White House, Johnson joining him, 12:45 to 1:05 p.m. Nixon with Johnson in the Cabinet Room, 6 to 7:35 p.m., Rusk and Rostow joining: the talks with the Soviets on offensive and defensive weapons; Paris; the bombing.'
    n: 'FRUS 1964–68, VI, doc. [310](https://history.state.gov/historicaldocuments/frus1964-68v06/d310). Made public: the notes, FRUS 1964–68, VI (2002). [[w.lafeber-deadly-bet]]; [[w.nixon-rn]]. Names: Rusk, Wallace, Nixon, Rostow, Johnson.'
    tags: [name:rusk-dean, name:wallace-george-c, name:nixon-richard-m, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1968-07-26.elections-1968-2
    when: July 26
    date: '1968-07-26'
    thread: elections-1968
    also: [robert-kennedy]
    c: Edward Kennedy will not be a candidate for Vice President (Check the day).
    n: '[[w.clymer-edward-m-kennedy]]. See [[cal.1968-06-05.robert-kennedy]]. Names: Edward Kennedy.'
    tags: [name:kennedy-edward-m]
  - id: cal.1968-07-28.opinion
    when: July 28
    date: '1968-07-28'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, July 18–23: Republicans'' choice for 1968: Nixon 60 percent, Rockefeller 23, Reagan 7, Lindsay 4, Percy 2, Hatfield 1, Stassen 1. Independents: Nixon 38, Rockefeller 35, Reagan 10, Lindsay 8.'
    n: '[[w.gallup-poll]], III, 2150. Names: Nixon, Rockefeller, Reagan, Lindsay, Percy, Hatfield, Stassen.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:reagan-ronald, name:lindsay-john-v, name:percy-charles-h, name:hatfield-mark-o, name:stassen-harold-e]
  - id: cal.1968-07-29.vietnam
    when: July 29
    date: '1968-07-29'
    thread: vietnam-paris
    also: [elections-1968]
    c: 'Harriman and Vance from Paris: stop all the bombing of the North now; Hanoi''s answer to the "Phase 1-Phase 2" proposal, if any, will be slow and ambiguous. Rusk, after seeing Johnson and Clifford: "stay firmly on our present course"; Hanoi, Moscow and others mounting a campaign to force a halt with nothing in return.'
    n: 'FRUS 1964–68, VI, docs. [312](https://history.state.gov/historicaldocuments/frus1964-68v06/d312), [313](https://history.state.gov/historicaldocuments/frus1964-68v06/d313). Made public: FRUS 1964–68, VI (2002). [[w.herring-secret-diplomacy-of-the]]; [[w.abramson-spanning-the-century]]; [[w.clifford-counsel-to-the-president-2]]. See [[cal.1968-05-13.vietnam]]. Names: Harriman, Vance, Rusk, Clifford, Johnson.'
    tags: [name:harriman-w-averell, name:vance-cyrus, name:rusk-dean, name:clifford-clark, name:johnson-lyndon-b]

  - id: cal.1968-07-29.soviet-union-czechoslovakia
    when: July 29–Aug. 1
    date: '1968-07-29'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: 'Čierna nad Tisou: the Soviet and Czechoslovak Presidiums. Washington, July 29, Clifford to Johnson, on a meeting with Kosygin: "I don''t believe I''d go near Kosygin during the time that Czechoslovakia is still hot."'
    n: 'FRUS 1964–68, XVII, doc. [75](https://history.state.gov/historicaldocuments/frus1964-68v17/d75). Made public: FRUS 1964–68, XVII (1996). See [[cal.1968-07-15.soviet-union]]. Names: Clifford, Johnson, Kosygin.'
    tags: [name:clifford-clark, name:johnson-lyndon-b, name:kosygin-aleksei]

  - id: cal.1968-07-29.africa
    when: July 29
    date: '1968-07-29'
    thread: africa
    c: 'Rhodesia. Executive Order 11419, under the United Nations Participation Act, carrying out Security Council Resolution 253 of May 29: no imports from Southern Rhodesia, no exports to it, no carriage in American ships or aircraft, no transfers of funds, beyond the sanctions of January 1967.'
    n: '[Executive Order 11419—Relating to Trade and Other Transactions Involving Southern Rhodesia](https://www.presidency.ucsb.edu/documents/executive-order-11419-relating-trade-and-other-transactions-involving-southern-rhodesia) (July 29, 1968). [[w.horne-from-the-barrel-of]]; [[w.watts-rhodesias-unilateral-declaration-of]]. See [[cal.1967-01-05.africa]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-29.foreign-aid
    when: July 29
    date: '1968-07-29'
    thread: foreign-aid
    also: [farm]
    c: 'Food for Freedom extended two years, [82 Stat. 450](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg450.pdf): amended to help the balance of payments, to give more for family planning and education, to let local currencies pay for public works. Johnson: self-help, required since 1966, the condition of food aid.'
    n: 'Remarks Upon Signing Bill Extending the Food for Freedom Program, [1968–69 Pub. Papers 847](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=157) (July 29, 1968). Statute (K–J Cong. II.J.2). See [[cal.1966-11-11.foreign-aid]]. Names: Freeman, Johnson.'
    tags: [name:johnson-lyndon-b, name:freeman-orville-l]
  - id: cal.1968-07-29.consumers
    when: July 29
    date: '1968-07-29'
    thread: consumers
    also: [economy]
    c: 'Three securities bills signed. The Williams Act, [82 Stat. 454](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg454.pdf): disclosure in tender offers for a company''s shares. Margin credit on stocks sold over the counter, under the Federal Reserve''s rules, [82 Stat. 452](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg452.pdf). A study of institutional investors by the SEC, [82 Stat. 453](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg453.pdf). Johnson: the mutual fund bill, asked Feb. 16, 1967, still before Congress.'
    n: 'Remarks Upon Signing Bills for the Protection of Investors in Securities, [1968–69 Pub. Papers 848](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=158) (July 29, 1968). Statute (K–J Cong. II.J.2). [[w.seligman-transformation-of-wall-street]]. Names: Cohen, Johnson.'
    tags: [name:johnson-lyndon-b, name:cohen-manuel-f]
  - id: cal.1968-07-30.foreign-aid
    when: July 30–31
    date: '1968-07-30'
    thread: foreign-aid
    also: [japan-and-korea-pueblo]
    c: 'The Senate passes the foreign aid bill, [46–28](https://voteview.com/rollcall/RS0900536), July 31, after providing, July 30, that the ban on aid to Communist countries may not be waived until the *Pueblo*''s crew is released, [43–29](https://voteview.com/rollcall/RS0900528).'
    n: 'See [[cal.1968-07-17.foreign-aid]].'

  - id: cal.1968-07-30.testing-missile-talks
    when: July 30
    date: '1968-07-30'
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'Johnson to Kosygin: Geneva and the interval acceptable; talks at the level of heads of government, foreign ministers or special delegations; an announcement, if possible, before the conference of nonnuclear states opens in late August.'
    n: 'FRUS 1964–68, XI, doc. [263](https://history.state.gov/historicaldocuments/frus1964-68v11/d263). Made public: FRUS 1964–68, XI (1997). See [[cal.1968-07-25.testing]]. Names: Kosygin, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b]

  - id: cal.1968-07-30.vietnam-paris
    when: July 30
    date: '1968-07-30'
    thread: vietnam-paris
    c: 'Johnson to Rusk by telephone, on the Paris cable: Clifford "kind of expressing the viewpoint that''s contained in the cable"; "we''re not going to stop the bombing until they agree to stop some." At lunch, Johnson asks Taylor for a report on "this new wave of demands to stop the bombing."'
    n: 'FRUS 1964–68, VI, docs. [314](https://history.state.gov/historicaldocuments/frus1964-68v06/d314), [316](https://history.state.gov/historicaldocuments/frus1964-68v06/d316). [Johnson and Rusk, 9:57 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dean-rusk-july-30-1968), Conversation WH6807-02-13219 (Miller Center). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-07-29.vietnam]]. Names: Johnson, Rusk, Clifford, Taylor.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:clifford-clark, name:taylor-maxwell]

  - id: cal.1968-07-30.governors-ar
    when: July 30
    date: '1968-07-30'
    thread: governors
    also: [elections-1968]
    c: 'Arkansas''s Democratic primary for governor, to face Rockefeller: Marion Crank, once Speaker of the House, 106,092, 25.6 percent; Virginia Johnson, wife of Jim Johnson, the nominee of 1966, 86,038, 20.7; Ted Boswell 85,629, 20.6; Bruce Bennett, once attorney general, 15.7; two others. Runoff between Crank and Johnson. The same day, Fulbright renominated for the Senate, 220,684, 52.9 percent, over Jim Johnson, 132,038.'
    n: 'Ark. [*Historical Report of the Secretary of State* (2008)](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf), [629](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=642) (governor), [593](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=606) (Senate). [[w.urwin-agenda-for-reform]]; [[w.johnson-arkansas-in-modern-america]]. See [[cal.1966-07-26.elections-1966]]. Names: Rockefeller, Crank, Virginia Johnson, James Johnson, Boswell, Bennett, Fulbright.'
    tags: [state:ar, name:rockefeller-winthrop, name:crank-marion-h, name:johnson-virginia, name:johnson-james-d, name:boswell-ted, name:bennett-bruce, name:fulbright-j-william]
  - id: cal.1968-07-31.crime-and-hijacking
    when: July 31
    date: '1968-07-31'
    thread: crime-and-hijacking
    also: [poverty]
    c: 'Juvenile Delinquency Prevention and Control Act signed, [82 Stat. 462](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg462.pdf): grants through HEW to the States and cities for programs of prevention, rehabilitation and training. Johnson: "Criminals are made and not born." The Senate had refused block grants to the States, [34–38](https://voteview.com/rollcall/RS0900485), July 8.'
    n: 'Remarks Upon Signing the Juvenile Delinquency Prevention and Control Act of 1968, [1968–69 Pub. Papers 855](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=165) (July 31, 1968). Statute (K–J Cong. II.J.2). See [[cal.1967-02-18.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-31.farm
    when: July 31
    date: '1968-07-31'
    thread: farm
    c: 'The House recommits its farm bill, H.R. 17126, with instructions for a limit of $20,000 on the payments to one recipient, [230–160](https://voteview.com/rollcall/RH0900411), and passes it, [213–176](https://voteview.com/rollcall/RH0900412).'
    n: 'See [[cal.1968-07-19.farm]].'

  - id: cal.1968-07-31.steel
    when: July 31–Aug. 1
    date: '1968-07-31'
    thread: steel
    also: [economy]
    c: 'The steel contract settled July 30. July 31, Bethlehem raises prices on its mill products nearly 5 percent across the board; Republic follows. Johnson, opening his news conference: the increase "unreasonable" and "should not be permitted to stand"; $600 million a year to consumers. Aug. 1, to the Speaker and the Majority Leader: the largest increase in steel since 1958, in the end more than $1.1 billion in higher prices. U.S. Steel''s selective increases later in August, about 2.5 percent; Bethlehem and the others come down to them (Check).'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 856](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=166) (July 31, 1968); Letter to the Speaker of the House and to the Majority Leader of the Senate on the Steel Price Increases, [1968–69 Pub. Papers 867](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=177) (Aug. 1, 1968). [[w.tiffany-decline-of-american-steel]]; [[w.hoerr-and-the-wolf-finally]]. See [[cal.1966-08-04.steel]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07.states-and-cities-nyc
    when: July
    date: 1968-07
    thread: states-and-cities
    c: New York City. Lindsay names Galamison, of the school boycott of 1964, to the Board of Education, enlarged by the legislature's act of the session (the Marchi law), which put off a plan of decentralization for a year (Check the act and its terms).
