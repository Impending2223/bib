    c: 'The House passes the gun bill, H.R. 17735, [305–118](https://voteview.com/rollcall/RH0900398): the mail-order and interstate sale of rifles, shotguns and their ammunition stopped, with the sale to minors. No registration or licensing of owners, which Johnson asked in June. Rifle, shotgun and .22 rimfire ammunition taken out of the bill, [218–205](https://voteview.com/rollcall/RH0900395); exemptions for competition and military training, [225–198](https://voteview.com/rollcall/RH0900397); Poff''s penalties for using a gun in a federal felony, [412–11](https://voteview.com/rollcall/RH0900396). Check: the ammunition amendment''s fate in conference.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1939–40, 2014 (the votes; no registration or licensing). Check: [[w.cq-weekly-report]], July 26, 1968, 1939, has the bill as passed stop the interstate shipment of handgun ammunition, rifle, shotgun and .22 rimfire ammunition exempted by MacGregor''s amendment; the Sikes amendment lets the National Board for the Promotion of Rifle Practice furnish arms and ammunition to clubs of the National Rifle Association. To check: [[w.zimring-firearms-and-federal-law]]; [[w.spitzer-politics-of-gun-control]]; [[w.winkler-gunfight]]. See [[cal.1968-06-06.crime-and-hijacking]]. Names: Poff, Johnson.'
