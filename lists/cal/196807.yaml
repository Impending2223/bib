        - 'https://archive.org/details/shootoutinclevel00masorich/page/68/mode/1up: C'
        - 'https://archive.org/details/shootoutinclevel00masorich/page/76/mode/1up: C'
    tags: [name:evans-fred, name:stokes-carl-b, state:oh, city:cleveland]
  - id: cal.1968-07-23.economy
