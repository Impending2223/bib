  - id: cal.1968-07-09.elections-1968-2
    when: July 9
    date: '1968-07-09'
    thread: elections-1968
    c: 'Rockefeller''s telegram to Nixon, made public: a debate, and a poll commissioned by both to test their strength in the States of large electoral votes, its results for the delegates.'
    n: '[[w.nixon-rn]], 306. Names: Rockefeller, Nixon.'
