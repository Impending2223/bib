    date: '1968-07-06'
    thread: latin-america
    also: [foreign-aid]
    c: 'San Salvador: Johnson with the Presidents of El Salvador, Costa Rica, Honduras, Nicaragua and Guatemala at the headquarters of the Organization of Central American States. Joint Declaration, July 6: the Central American Common Market and the integration program of Punta del Este; United States support for a Central American Fund for Economic Integration and the Central American Bank (Check the amounts). July 8, stops at Managua, San José, Guatemala City and San Pedro Sula.'
    n: 'Joint Declaration of the Presidents Following Their Meeting in San Salvador, [1968–69 Pub. Papers 785](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=95) (July 6, 1968); Remarks at the Working Session of the Presidents of the Central American Republics in San Salvador, [1968–69 Pub. Papers 782](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=92) (July 6, 1968). To check: [[w.taffet-foreign-aid-as-foreign]]; [[w.lafeber-inevitable-revolutions]]. See [[cal.1967-04-11.latin-america]]. Names: Sánchez Hernández, Trejos Fernández, López Arellano, Somoza Debayle, Méndez Montenegro, Johnson.'
    tags: [name:johnson-lyndon-b, name:sanchez-hernandez-fidel, name:trejos-fernandez-jose-joaquin, name:lopez-arellano-oswaldo, name:somoza-debayle-anastasio, name:mendez-montenegro-julio-cesar]
