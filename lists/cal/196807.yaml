    c: 'The House passes the gun bill, H.R. 17735, [305–118](https://voteview.com/rollcall/RH0900398): the mail-order and interstate sale of rifles, shotguns and handgun ammunition stopped, with the sale to minors. No registration or licensing of owners, which Johnson asked in June. The Committee of the Whole''s amendments kept on separate votes: MacGregor''s, ammunition to mean only that for pistols, revolvers and destructive devices, not shotgun shells, rifle ammunition or .22 rimfire, [218–205](https://voteview.com/rollcall/RH0900395); Latta''s, a hunter or marksman whose rifle or shotgun is lost, stolen or broken in another State may buy another there, by voice vote; Poff''s, one to ten years for using or unlawfully carrying a gun in a federal felony, five to twenty-five for a second, no probation, suspended or concurrent sentence, [412–11](https://voteview.com/rollcall/RH0900396); Sikes''s, the Secretary of the Army''s shipments of arms and ammunition to those he may supply, and their carriage in military training and competitions, exempt, [225–198](https://voteview.com/rollcall/RH0900397).'
    n: '[114 Cong. Rec. 23,093–96](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt18/pdf/GPO-CRECB-1968-pt18-1-2.pdf#page=28) (1968) (July 24, 1968) (the amendments'' texts, the separate votes and passage: MacGregor''s, 23093–94; Latta''s, 23094; Poff''s, 23094–95; Sikes''s and passage, 23095–96; the list of yeas on passage headed "YEAS—350," the count 305, 23095). Conference report, H. Rept. 90–1956, the managers'' statement, [114 Cong. Rec. 30,576–77](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt23/pdf/GPO-CRECB-1968-pt23-5-2.pdf#page=21) (1968) (Oct. 10, 1968) (the House bill''s ammunition, age and nonresident provisions, Latta''s, Poff''s and Sikes''s; in conference the Senate''s definition, "all ammunition and components of ammunition for all firearms," adopted, Latta''s and Sikes''s kept, Poff''s without the bar on probation and suspension for a first offense or on concurrent sentences). [[w.cq-weekly-report]], July 26, 1968, 1939–40, 2014 (the bill''s provisions and the votes; no registration or licensing); [[w.cq-weekly-report]], Aug. 2, 1968, 2047 (passed, the mail-order and interstate sale of rifles and shotguns stopped). CQ (1939) gives the Sikes amendment as letting the National Board for the Promotion of Rifle Practice furnish arms and ammunition to clubs of the National Rifle Association. To check: [[w.zimring-firearms-and-federal-law]]; [[w.spitzer-politics-of-gun-control]]; [[w.winkler-gunfight]]. See [[cal.1968-06-06.crime-and-hijacking]]. Names: Poff, Johnson, MacGregor, Latta, Sikes.'
