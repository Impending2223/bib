  - id: cal.1968-07-23.civil-disorders
    when: July 23–27
    date: '1968-07-23'
    thread: civil-disorders
    also: [black-nationalism]
    c: 'Cleveland, Glenville, the night of July 23–24: gunfire for some four hours between the police and Ahmed Evans''s Black Nationalists of New Libya. Three policemen killed, three of the gunmen, a bystander; at least fifteen wounded. Stokes keeps white policemen out of the area, Negro leaders and Negro police to patrol it; looting and burning go on; the National Guard and the rest of the police sent in (Check the days). Over July 27.'
    n: '[[w.masotti-shoot-out-in-cleveland]], [56–57](https://archive.org/details/shootoutinclevel00masorich/page/56/mode/1up) (the casualties of July 23, by the Mayor''s office''s chronology of Aug. 9: 3 police, 3 suspects and 1 civilian killed, 15 wounded); [68–69](https://archive.org/details/shootoutinclevel00masorich/page/68/mode/1up) (the cordon, July 24: the Guard and the police on its perimeter, Negro police within); [76](https://archive.org/details/shootoutinclevel00masorich/page/76/mode/1up) (400 Guardsmen into the area, July 25) (the report to the National Commission on the Causes and Prevention of Violence). To check: [[w.stokes-promises-of-power]]. See [[cal.1966-07-18.states-and-cities]]. Names: Evans, Stokes.'
    src:
