    when: July 19
    date: '1968-07-19'
    thread: elections-1968
    c: 'Rockefeller''s position paper on organized crime: a National Council on Organized Crime, a delegate a State; a national school for officers; customs and narcotics forces; sanctions on lax opium countries. July 20, on the balance of payments, a "high national priority."'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1988. Names: Rockefeller.'
