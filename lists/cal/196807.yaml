    when: July 28
    date: '1968-07-28'
    thread: civil-disorders-kerner
    c: 'Three studies made for the Kerner Commission, released, not endorsed by it. In six cities that rioted in 1967, 18 percent of the Negroes of the riot areas took part, most of them employed adults: the "riffraff theory" wrong. 35 percent approve, or partly, of Carmichael''s "stand." A third say a job denied them for race. Ginsburg, its executive director: "the most authoritative presentation of data that is available so far."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2120. Names: Carmichael, Ginsburg.'
