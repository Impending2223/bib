  - id: cal.1968-07-02.defense
    when: July 2
    date: '1968-07-02'
    thread: defense
    c: Gen. Harold K. Johnson retires as Army Chief of Staff; the Distinguished Service Medal at the White House.
    n: 'Remarks Upon Presenting the Distinguished Service Medal to Gen. Harold K. Johnson, Retiring Chief of Staff, USA, [1968–69 Pub. Papers 769](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=79) (July 2, 1968). To check: [[w.sorley-honorable-warrior]]. Names: Harold K. Johnson, Lyndon Johnson.'
    tags: [name:johnson-lyndon-b, name:johnson-harold-k]
  - id: cal.1968-07-02.elections-1968-state-conventions
    when: July 2
    date: '1968-07-02'
    thread: elections-1968-state-conventions
    also: [mississippi]
    c: Mississippi's regular Democratic State convention names its 24 delegates, uncommitted. The Loyalists name a delegation of their own, to challenge the regulars at Chicago.
    n: '"State Demos Facing Threat of Challenge," [*Sun Herald*, July 3, 1968](https://www.newspapers.com/image/742479304) (Biloxi). How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): convention; open precinct. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026, and its note. See [[cal.1968-05-16.elections-1968-state-conventions]]. Check: the paper (newspapers.com, by subscription; not read here). Check the Loyalists'' convention''s date.'
    tags: [state:ms]
  - id: cal.1968-07-03.vietnam-abrams
    when: July 3
    date: '1968-07-03'
    thread: vietnam-abrams
    also: [defense]
    c: Westmoreland Army Chief of Staff; Abrams, in acting command since Westmoreland left Saigon June 11, commander in Vietnam.
    n: 'Remarks at the Presentation of the Distinguished Service Medal to General Westmoreland, [1968–69 Pub. Papers 806](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=116) (July 12, 1968). [[w.cosmas-joint-chiefs-of-staff]], 204; [[w.drea-mcnamara-clifford-and-the-2011]], 194 (Westmoreland Chief of Staff from July 3; Abrams''s command from June 11). To check: [[w.sorley-westmoreland]]; [[w.sorley-thunderbolt]]; [[w.sorley-better-war]]. See [[cal.1968-03-22.transition-and-staff]]. Check: Cosmas, 204, has Abrams acting commander from May 29, Westmoreland giving up the command June 11. Names: Westmoreland, Abrams.'
    src:
      c: 2ac1632f
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=116: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 194: A-B'
        - 'w.cosmas-joint-chiefs-of-staff 204: A-B'
        - 'via w.cosmas-joint-chiefs-of-staff 204 n.3a: A-B'
    tags: [name:westmoreland-william, name:abrams-creighton]
  - id: cal.1968-07-03.state-and-city-finance-tx
    when: July 3
    date: '1968-07-03'
    thread: state-and-city-finance
    c: 'Texas. The special session ends: the appropriation and some $159 million in taxes for it, the State sales tax and the motor vehicle sales tax up a cent, the franchise tax up 50 cents a thousand, from Oct. 1. Connally''s broader sales tax, with rebates to the cities, refused.'
    n: 'Acts 1968, 60th Leg., 1st C.S., ch. 2 (H.B. 2), [Tex. Gen. Laws](https://lrl.texas.gov/scanned/sessionLaws/60-1/HB_2_CH_2.pdf) (the sales and the motor vehicle sales tax at 3 percent, the franchise tax $2.75 a thousand, from Oct. 1): passed the House June 20, 91–56, the Senate as amended June 27, the House concurring July 2, 85–59; approved July 17. [*Bastrop Advertiser*, July 11, 1968, 2](https://texashistory.unt.edu/ark:/67531/metapth238161/m1/2); [60th Leg., 1st C.S., H.B. 2, Texas Senate Papers](https://texashistory.unt.edu/ark:/67531/metapth595271/). See [[cal.1968-06-04.state-and-city-finance-tx]]. Names: Connally.'
    src:
      c: 5ecb8314
      rows:
        - 'https://lrl.texas.gov/scanned/sessionLaws/60-1/HB_2_CH_2.pdf: B'
        - 'https://texashistory.unt.edu/ark:/67531/metapth238161/m1/2: all'
        - 'https://texashistory.unt.edu/ark:/67531/metapth595271/: all'
    tags: [state:tx, name:connally-john]
  - id: cal.1968-07-03.elections-1968
    when: July 3–4
    date: '1968-07-03'
    thread: elections-1968
    c: 'Minneapolis, the evening of July 3: hecklers keep Wallace from speaking. Johnson, July 4: "Americans of every viewpoint must be deeply concerned over the intolerance which prevented presidential candidate George Wallace from speaking."'
    n: 'Statement by the President on the Disruption by Hecklers of a Speech by George Wallace in Minneapolis, [1968–69 Pub. Papers 778](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=88) (July 4, 1968). To check: [[w.carter-politics-of-rage-1995]]; [[w.chester-american-melodrama]]. Names: Wallace, Johnson.'
    tags: [name:wallace-george-c, name:johnson-lyndon-b, state:mn, city:minneapolis]
  - id: cal.1968-07-03.opinion
    when: July 3
    date: '1968-07-03'
    thread: opinion
    also: [civil-disorders]
    c: 'Gallup, June 13–18: some call this country a "sick society": agree 36 percent, disagree 58. Whites 35 and 60; Negroes 48 and 43. Wallace''s supporters 42 and 51; Nixon''s 36 and 61; Humphrey''s 32 and 61.'
    n: '[[w.gallup-poll]], III, 2138–39. Names: Wallace, Nixon, Humphrey.'
    tags: [name:wallace-george-c, name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-07-05.war-opposition
    when: July 5
    date: '1968-07-05'
    thread: war-opposition
    c: 'Flag desecration act signed, [82 Stat. 291](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg291-2.pdf): up to a year in prison and a $1,000 fine for whoever "knowingly casts contempt" on a flag of the United States by publicly mutilating, defacing, defiling, burning or trampling it. Introduced after the burning of flags in Central Park, Apr. 15, 1967.'
    n: 'Statute (K–J Cong. II.J.2). To check: [[w.goldstein-saving-old-glory]]. See [[cal.1967-04-15.war-opposition]].'
  - id: cal.1968-07-05.latin-america
    when: July 5
    date: '1968-07-05'
    thread: latin-america
    c: Barrientos Ortuño of Bolivia at the LBJ Ranch.
    n: 'The President''s Toast at a Luncheon at the LBJ Ranch Honoring President Barrientos of Bolivia, [1968–69 Pub. Papers 779](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=89) (July 5, 1968). See [[cal.1967-04-11.latin-america]]. Names: Barrientos Ortuño, Johnson.'
    tags: [name:johnson-lyndon-b, name:barrientos-ortuno-rene]
  - id: cal.1968-07-05.vietnam-khe-sanh
    when: July 5
    date: '1968-07-05'
    thread: vietnam-khe-sanh
    c: The Khe Sanh Combat Base officially closed, 8 p.m.; the 1st Marines' last vehicles to Ca Lu by convoy the next day.
    n: '[[w.shulimson-u-s-marines-in-1997]], 326; [[w.drea-mcnamara-clifford-and-the-2011]], 196 (the closing, July 5). See [[cal.1968-01-21.vietnam]].'
    src:
      c: 15f226b4
      rows:
        - 'w.shulimson-u-s-marines-in-1997 326: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 196: A'
    tags: [place:khe-sanh]
  - id: cal.1968-07-06.latin-america
    when: July 6–8
    date: '1968-07-06'
    thread: latin-america
    also: [foreign-aid]
    c: 'San Salvador: Johnson with the Presidents of El Salvador, Costa Rica, Honduras, Nicaragua and Guatemala at the headquarters of the Organization of Central American States. Joint Declaration, July 6: the Central American Common Market and the integration program of Punta del Este; United States support for a Central American Fund for Economic Integration and the Central American Bank (Check the amounts). July 8, stops at Managua, San José, Guatemala City and San Pedro Sula.'
    n: 'Joint Declaration of the Presidents Following Their Meeting in San Salvador, [1968–69 Pub. Papers 785](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=95) (July 6, 1968); Remarks at the Working Session of the Presidents of the Central American Republics in San Salvador, [1968–69 Pub. Papers 782](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=92) (July 6, 1968). To check: [[w.taffet-foreign-aid-as-foreign]]; [[w.lafeber-inevitable-revolutions]]. See [[cal.1967-04-11.latin-america]]. Names: Sánchez Hernández, Trejos Fernández, López Arellano, Somoza Debayle, Méndez Montenegro, Johnson.'
    tags: [name:johnson-lyndon-b, name:sanchez-hernandez-fidel, name:trejos-fernandez-jose-joaquin, name:lopez-arellano-oswaldo, name:somoza-debayle-anastasio, name:mendez-montenegro-julio-cesar]
  - id: cal.1968-07-07.opinion
    when: July 7
    date: '1968-07-07'
    thread: opinion
    also: [elections-1968-polls, congress]
    c: 'Gallup, June 13–18, the party one would like to see win this congressional district, the undecided left out: Democratic 58 percent, Republican 42. South 70 and 30; outside the South 55 and 45.'
    n: '[[w.gallup-poll]], III, 2139.'
  - id: cal.1968-07-08.testing-missile-talks
    when: July 8
    date: '1968-07-08'
    thread: testing-missile-talks
    c: 'The Executive Committee of the Committee of Principals, 5 p.m., on the position for the missile talks. Rusk: without control the arms race spirals to new plateaus of expense, no more security. Clifford: the first sessions general, no concrete proposals or concessions, verification the chief problem. A working group under Fisher of ACDA to develop positions; Defense to draft an opening statement; no word to the press.'
    n: 'FRUS 1964–68, XI, doc. [252](https://history.state.gov/historicaldocuments/frus1964-68v11/d252). [[w.drea-mcnamara-clifford-and-the-2011]], 338–39 (the meeting, Rusk, Clifford, the working group). Made public: FRUS 1964–68, XI (1997). To check: [[w.seaborg-stemming-the-tide]]; [[w.newhouse-cold-dawn]]. See [[cal.1968-06-21.testing]]. Names: Rusk, Clifford, Fisher.'
    src:
      c: 4cc210a5
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v11/d252: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 338: A-B'
        - 'w.drea-mcnamara-clifford-and-the-2011 339: A-D'
        - 'via w.drea-mcnamara-clifford-and-the-2011 339 n.70: A-D'
    tags: [name:rusk-dean, name:clifford-clark, name:fisher-adrian-s]
  - id: cal.1968-07-09.testing
    when: July 9
    date: '1968-07-09'
    thread: testing-npt
    c: 'The nonproliferation treaty sent to the Senate: "the most important international agreement limiting nuclear arms since the nuclear age began." Ninety-five members of the United Nations had voted to commend it; signed at Washington by the United States, Britain, the Soviet Union and fifty-three others.'
    n: 'Special Message to the Senate Urging Consent to the Ratification of the Nuclear Nonproliferation Treaty, [1968–69 Pub. Papers 801](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=111) (July 9, 1968). See [[cal.1968-07-01.testing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
