    c: 'Hyannis Port. The Kennedy retinue, three generations, Sorensen, Salinger, McNamara, Burke Marshall, Seigenthaler, Dutton, Walinsky among them, on a "living memorial" to Robert Kennedy. After, Sorensen, David Burke and Seigenthaler on Edward Kennedy''s future: a speech taking him out of national politics in 1968, for a halt in the bombing, and for urgent programs in the ghettos.'
    n: '[[w.chester-american-melodrama]], 565–66. Names: Sorensen, Salinger, McNamara, Burke Marshall, Seigenthaler, Dutton, Walinsky, Edward Kennedy, Robert Kennedy.'
