    when: July 21
    date: '1968-07-21'
    thread: elections-1968
    c: 'Baltimore. Reagan met by Agnew and Nunn; he would not take the vice presidential nomination. Nunn invites him to Kentucky''s delegation the next day: 22 of its 24 for Nixon, Reagan their second choice.'
