      c: 15928f63
      rows:
        - 'w.nixon-rn 306: all'
    tags: [name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1968-07-10.cities-and-housing
    when: July 10–11
    date: '1968-07-10'
    thread: cities-and-housing
    c: 'The House passes the Housing and Urban Development bill, H.R. 17989, [295–114](https://voteview.com/rollcall/RH0900374), after limiting the incomes of those the low-income housing may serve, [270–137](https://voteview.com/rollcall/RH0900372), and recommitting it with instructions to strike the upgrading of public housing management and the interim assistance to blighted areas, [217–193](https://voteview.com/rollcall/RH0900373). Johnson, July 11: low- and middle-income housing at ten times any earlier rate; the beginning of 6 million federally subsidized units.'
    n: 'Statement by the President Following House Action on the Housing and Urban Development Act of 1968, [1968–69 Pub. Papers 805](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=115) (July 11, 1968). To check: [[w.haar-between-the-idea-and]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1968-05-28.cities-and-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-11.court
    when: July 11
    date: '1968-07-11'
    thread: court-fortas
    also: [confirmations]
    c: The Senate Judiciary Committee, Eastland chairman, opens its hearings on the nominations of Fortas as Chief Justice and Thornberry to his seat. Griffin, leading the Republicans against confirming a "lame duck" President's nominees, among the first witnesses (Check).
    n: 'Check: *Nominations of Abe Fortas and Homer Thornberry: Hearings Before the Senate Committee on the Judiciary*, 90th Cong., 2d Sess. (1968), not found online. [U.S. Senate Historical Office, "Filibuster Derails Supreme Court Appointment"](https://www.senate.gov/about/powers-procedures/nominations/filibuster-derails-supreme-court-appointment.htm). See [[cal.1968-06-26.court]]. Names: Eastland, Fortas, Thornberry, Griffin, Johnson.'
    tags: [name:eastland-james-o, name:fortas-abe, name:thornberry-william-h, name:griffin-robert-p, name:johnson-lyndon-b]
  - id: cal.1968-07-11.africa
    when: July 11
    date: '1968-07-11'
    thread: africa
    c: 'Johnson''s appeal on Nigeria: the civilians of the Eastern Region "threatened not just by violence but by starvation"; the United States ready to support the International Committee of the Red Cross with more funds, supplies and equipment; relief "frustrated by disputes on how to get supplies through the lines." "Mass starvation that can be prevented must be prevented."'
    n: 'Statement by the President Appealing for the Prevention of Mass Starvation in Nigeria, [1968–69 Pub. Papers 805](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=115) (July 11, 1968). To check: [[w.thompson-american-policy-and-african]]; [[w.stremlau-international-politics-of-the]]. See [[cal.1967-05-30.africa]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-11.opinion
    when: July 11
    date: '1968-07-11'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 26–July 1, with Wallace as a third party''s candidate: Humphrey 40 percent, Nixon 35, Wallace 16, undecided 9. South: Humphrey 33, Wallace 32, Nixon 29. Non-whites: Humphrey 83, Nixon 7. Humphrey 36, Rockefeller 36, Wallace 21; South, Wallace 39, Humphrey 33, Rockefeller 21.'
    n: '[[w.gallup-poll]], III, 2139–43. Names: Humphrey, Nixon, Wallace, Rockefeller.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:rockefeller-nelson]
  - id: cal.1968-07-12.elections-1968
    when: July 12
    date: '1968-07-12'
    thread: elections-1968-chennault
