    date: '1968-07-24'
    thread: opinion
    also: [middle-east]
    c: 'Gallup, June 26–July 1: the main cause of trouble between Israelis and Arabs: ancient enmity 22 percent, territorial rights 16; no opinion 41. In a full-scale war there in the next year or two, the United States to stay out 61; to support Israel 10. In such a war, supply arms and material to Israel: should 24, should not 59; to the Arabs, 3 and 79. Send troops to help Israel: 9 and 77. Another full-scale war likely within five years: is 62, is not 13.'
    n: '[[w.gallup-poll]], III, 2149–50.'
  - id: cal.1968-07-24.elections-1968
    when: July 24
    date: '1968-07-24'
    thread: elections-1968
    c: 'Lunch, 1:30 p.m.: Johnson with Rusk, Clifford, Taylor, Helms, Wheeler and Rostow. "I want to sit down with Mr. Nixon to see what kind of world he really wants. When he gets the nomination he may be more responsible. He says he is for our position in Vietnam." Then the Democratic platform on Vietnam.'
    n: '[FRUS 1964–68, VI, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v06/d308). [[w.dallek-flawed-giant]], 571 (the meeting; Johnson on Nixon, in other words). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-07-09.elections-1968]]. Names: Johnson, Nixon, Rusk, Clifford, Taylor, Helms, Wheeler, Rostow.'
