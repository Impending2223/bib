  - id: cal.1968-07-18.opinion
    when: July 18
    date: '1968-07-18'
    thread: opinion
    also: [court]
    c: 'Gallup, June 26–July 1: the Supreme Court rated excellent 8 percent, good 28, fair 32, poor 21. South: excellent 5, good 18, fair 35, poor 31. College-educated: 14, 34, 27 and 21. Those 50 and over: poor 29.'
    n: '[[w.gallup-poll]], III, 2147–48.'
  - id: cal.1968-07-18.cities-and-housing
    when: July 18
    date: '1968-07-18'
    thread: cities-and-housing
    also: [space]
    c: 'The Senate passes the independent offices and HUD appropriation, H.R. 17023, 74–0: $15,505,214,000 in new budget authority; $1 billion for model cities and $65 million in rent supplement contracts, the full requests. Allott''s cut of $250 million from model cities refused, 21–54; Williams''s $300 million from NASA''s research, 34–52; Stephen Young''s cut in civil defense, 27–54. The $100,000 for the Commission on Executive, Legislative and Judicial Salaries kept, 46–41, Harry Byrd Jr. against.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1944–46, 2009. Names: Allott, Williams, Stephen Young, Harry F. Byrd Jr., Magnuson.'
    tags: [name:allott-gordon-l, name:williams-john-j, name:young-stephen-m, name:byrd-harry-f-jr, name:magnuson-warren-g]
  - id: cal.1968-07-18.crime-and-hijacking
    when: July 18
    date: '1968-07-18'
    thread: crime-and-hijacking
    c: 'Juvenile Delinquency Prevention and Control Act, H.R. 12120, cleared: three years, $150 million, grants to the States.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1960.'
  - id: cal.1968-07-18.defense
    when: July 18
    date: '1968-07-18'
    thread: defense
    c: 'The House Appropriations Committee, Mahon chairman, reports the defense appropriation for fiscal 1969, H.R. 18785: $72,239,700,000, $4,834,300,000 under the request of $77,074,000,000; nothing cut from Southeast Asia''s programs; the cuts under the Revenue and Expenditure Control Act.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1963–65. Names: Mahon.'
    tags: [name:mahon-george-h]
  - id: cal.1968-07-18.cities-and-housing-2
    when: July 18
    date: '1968-07-18'
    thread: cities-and-housing
    c: 'The National Commission on Urban Problems releases Hauser''s and Hodge''s projection: from 1960 to 1985 the central cities lose 2.4 million whites and gain 10 million nonwhites; the suburbs gain 53.9 million whites. Douglas, at a news conference, for himself: federal water, sewer and highway grants conditional on nonwhites in the suburbs.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1976. Names: Douglas.'
    tags: [name:douglas-paul-h]
  - id: cal.1968-07-18.press-and-broadcasting
    when: July 18
    date: '1968-07-18'
    thread: press-and-broadcasting
    c: The FCC freezes applications for new AM stations, for a review of its policy; some 400 pending to be processed. AM stations 3,871 at the freeze of 1962, about 4,300 now.
    n: '[[w.cq-weekly-report]], July 26, 1968, 1977.'
  - id: cal.1968-07-18.elections-1968-2
    when: July 18
    date: '1968-07-18'
    thread: elections-1968
    c: 'Humphrey''s position paper on farming: a citizens'' committee to watch for the farmers in the agencies; more lending by the Farmers Home Administration. He indicates he would like Edward Kennedy as his running mate.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1990. Names: Humphrey, Kennedy.'
    tags: [name:humphrey-hubert-h, name:kennedy-edward-m]
  - id: cal.1968-07-18.elections-1968-3
    when: July 18
    date: '1968-07-18'
    thread: elections-1968
    c: McCarthy drops about 75 of his almost 225 campaign workers, for a deficit put at $500,000.
    n: '[[w.cq-weekly-report]], July 26, 1968, 1991. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j]
  - id: cal.1968-07-18.elections-1968-chicago
    when: July 18
    date: '1968-07-18'
    thread: elections-1968-chicago
    c: 'Stephen Mitchell, McCarthy''s convention strategist: the unit rule the main target; 14 States use it. Louis Martin, the same day: 139 Negro delegates and 89 alternates elected to Chicago.'
    n: '[[w.cq-weekly-report]], July 26, 1968, 1996–97. Names: Mitchell.'
    tags: [name:mitchell-stephen-a]
  - id: cal.1968-07-19.vietnam
    when: July 19–20
    date: '1968-07-19'
    thread: vietnam
    c: 'Honolulu. Johnson and Nguyễn Văn Thiệu, a meeting in place of the state visit Thiệu put off. Joint statement, July 20: South Vietnam''s forces 765,000 in June, more than 800,000 by the year''s end; M-16s for all its forces in 1969; South Vietnam "a full participant playing a leading role" in talks on a settlement; the United States will not support the imposition of "a ''coalition government,''" or any other, on the South. No response from Hanoi to the limitation of the bombing.'
    n: 'Joint Statement Following Discussions With President Thieu of South Vietnam at the Honolulu Conference, [1968–69 Pub. Papers 823](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=133) (July 20, 1968); Statement to the Press at the Close of the Honolulu Conference, [1968–69 Pub. Papers 828](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=138) (July 20, 1968). FRUS 1964–68, VI, doc. [304](https://history.state.gov/historicaldocuments/frus1964-68v06/d304). [[w.cosmas-joint-chiefs-of-staff]], 191, 214 (Honolulu); [[w.johnson-vantage-point]], 510–12 (the meeting); [[w.cq-weekly-report]], July 26, 1968, 1977, 2007 (the meeting; the statement to the press; CQ''s transcript prints 675,000, the Papers 765,000). To check: [[w.diem-in-the-jaws-of]]; [[w.berman-lyndon-johnsons-war]]. See [[cal.1968-07-18.vietnam]]. Names: Johnson, Nguyễn Văn Thiệu.'
