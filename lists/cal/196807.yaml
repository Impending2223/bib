    n: '[114 Cong. Rec. 22646](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt17/pdf/GPO-CRECB-1968-pt17-5-2.pdf#page=49) (July 22, 1968). [[w.longley-lbjs-1968]], 51 (Reid). Check: the count of members and where the special order ends; Longley cites Reid at 18098, her remarks of June 20 ("150 days later"). See [[cal.1968-01-23.japan-and-korea]]. Names: Scherle, Ford, Rivers, Bob Wilson, Reid.'
    src:
      c: d6005880
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt17/pdf/GPO-CRECB-1968-pt17-5-2.pdf#page=49: all'
