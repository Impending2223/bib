  - id: cal.1968-07-01.immigration
    when: July 1
    date: '1968-07-01'
    thread: immigration
    c: 'The national origins quota system ends, under the Immigration Act of 1965: 170,000 visas a year outside the Western Hemisphere, by preference, no more than 20,000 to a country; for the first time a ceiling on the Western Hemisphere, 120,000. Johnson to the American Committee on Italian Migration: "No longer will only three nations supply 70 percent of America''s immigrants."'
    n: 'Remarks to the American Committee on Italian Migration on the Occasion of the Termination of the National Origins Quota System, [1968–69 Pub. Papers 768](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=78) (July 1, 1968). See [[cal.1965-10-03.immigration]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-01.transportation
    when: July 1
    date: '1968-07-01'
    thread: transportation
    also: [cities-and-housing]
    c: Reorganization Plan No. 2 of 1968 in effect, sent Feb. 26 and not disapproved by Congress. The Urban Mass Transportation Administration in the Department of Transportation; the mass transit programs moved from HUD. HUD keeps the planning grants for the cities' transit.
    n: 'Statement by the President on the Reorganization of Urban Mass Transportation Functions, [1968–69 Pub. Papers 767](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=77) (July 1, 1968). Check: the plan''s terms, in the Federal Register. To check: [[w.smerk-urban-transportation]]. See [[cal.1966-10-15.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-01.european-community
    when: July 1
    date: '1968-07-01'
    thread: european-community
    also: [trade]
    c: 'The European Economic Community''s customs union complete, eighteen months ahead of the Treaty of Rome''s schedule: the last duties on trade among the Six removed; the common external tariff in force. Johnson''s message to Rey.'
    n: 'Message to Jean Rey, President of the Commission of the European Communities, on the Occasion of the Completion of the European Customs Union, [1968–69 Pub. Papers 763](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=73) (July 1, 1968). See [[cal.1967-11-27.european-community]]. Names: Rey, Johnson.'
    tags: [name:johnson-lyndon-b, name:rey-jean]
