entries:
  - id: cal.1966-05-03.elections-1966
    when: May 3
    date: '1966-05-03'
    thread: elections-1966
    also: [voting-rights]
    c: 'Alabama''s Democratic primary, the first since the Voting Rights Act. Lurleen Wallace, standing for her husband, barred from a second term, wins outright: 480,841 of 888,658, 54.1 percent; Attorney General Richmond Flowers 172,386; Carl Elliott, Patterson and Folsom behind. In Dallas County, Ala., Sheriff Clark loses the nomination to Wilson Baker, public safety director of Selma, Ala. (Check). In Lowndes County, Ala., the Lowndes County Freedom Organization, its emblem a black panther, holds its own nominating meeting (Check).'
    n: 'Votes: Wikipedia, "1966 Alabama gubernatorial election"; Check: Ala. *Official and Statistical Register*, 1967. [[w.carter-politics-of-rage-1995]]; [[w.jeffries-bloody-lowndes]]. Names: George Wallace, Patterson (K–J Cong. III.F); Clark (K–J Cong. III.K).'
    tags: [name:wallace-george-c, name:elliott-carl-a, name:patterson-john, name:clark-james-g-jr]
  - id: cal.1966-05-07.space
    when: May 7
    date: '1966-05-07'
    thread: space
    c: 'Johnson, from the Ranch, asks for a treaty on the moon and other celestial bodies: free for exploration and use by all; no claim of sovereignty; no weapons of mass destruction stationed there, no weapons tests or maneuvers; astronauts to help one another. Goldberg to seek discussions at the UN. June 18, asked of the Soviet Union''s interest: "We have made our proposal. We are very hopeful that our proposal and theirs can be carefully considered."'
    n: '[Statement by the President on the Need for a Treaty Governing Exploration of Celestial Bodies](https://www.presidency.ucsb.edu/documents/statement-the-president-the-need-for-treaty-governing-exploration-celestial-bodies) (May 7, 1966); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1167) (June 18, 1966). [[w.mcdougall-heavens-and-the-earth]]. Names: Goldberg (K–J Adm. III.E).'
    tags: [name:johnson-lyndon-b, name:goldberg-arthur-j]
  - id: cal.1966-05-11.vietnam
    when: May 11–17
    date: '1966-05-11'
    thread: vietnam
    c: 'Johnson on the war''s critics. At the Woodrow Wilson School, Princeton, N.J., May 11: "The exercise of power in this century has meant for all of us in the United States not arrogance but agony." At a Democratic dinner in Chicago, May 17: "There will be some ''Nervous Nellies'' and some who will become frustrated and bothered and break ranks under the strain."'
    n: '[Remarks at the Woodrow Wilson School for Public and International Affairs, Princeton University](https://www.presidency.ucsb.edu/documents/remarks-the-woodrow-wilson-school-for-public-and-international-affairs-princeton) (May 11, 1966); [Remarks at a Democratic Party Dinner in Chicago](https://www.presidency.ucsb.edu/documents/remarks-democratic-party-dinner-chicago) (May 17, 1966). See [[cal.1966-02-04.vietnam]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-05-13.cities-and-housing
    when: May 13
    date: '1966-05-13'
    thread: cities-and-housing
    also: [school-aid]
    c: 'Second Supplemental Appropriation Act signed, [80 Stat. 141](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg141.pdf): the first money for rent supplements, contracts up to $12 million a year, only where a city has a workable program or its officials approve; $9.5 million for the Teacher Corps, each local program to have its State''s approval. June 18, Weaver sets aside over $600,000 for the first projects, over 1,000 units.'
    n: '[Remarks on Signing Supplemental Appropriations Bills Providing Funds for the National Teacher Corps and the Rent Supplement Program](https://www.presidency.ucsb.edu/documents/remarks-signing-supplemental-appropriations-bills-providing-funds-for-the-national-teacher) (May 13, 1966); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1167) (June 18, 1966). See [[cal.1965-10-14.cities-and-housing]]; [[cal.1965-11-08.school-aid]]. Names: Weaver (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c]
  - id: cal.1966-05-14.students
    when: May 14
    date: '1966-05-14'
    thread: students
    also: [defense]
    c: 'The Selective Service College Qualification Test, first of three sittings (May 21, June 3): local boards to weigh its score and class standing in deferring students. At the University of Chicago students hold the administration building, May 11–16 (Check), against the university''s giving class rank to the boards.'
    n: '[[w.flynn-draft-1940-1973]]; [[w.baskir-chance-and-circumstance]]; [[w.sale-sds]].'
    tags: [name:hershey-lewis-b]
  - id: cal.1966-05-15.vietnam
    when: May 15–23
    date: '1966-05-15'
    thread: vietnam
    c: 'Đà Nẵng. Kỳ moves without telling the embassy: marine and airborne battalions under Cao Văn Viên, flown from Saigon, take the city hall, the radio station and the I Corps headquarters at dawn, May 15; the Struggle forces fall back into the pagodas. Đính replaced at I Corps by Huỳnh Văn Cao, May 16. At Huế, May 17, an American door gunner kills an ARVN lieutenant firing on Cao''s helicopter. May 21, fighting at the pagodas, government planes overhead, Walt''s marines between; by May 23 the city is the government''s (Check). Rusk to Porter, May 15: "insane bickering." Moyers to Rusk, May 21: the President "deeply disturbed." Johnson, May 21: "We are watching the situation in Vietnam very closely."'
    n: 'FRUS 1964–68, IV, docs. [138](https://history.state.gov/historicaldocuments/frus1964-68v04/d138), [143](https://history.state.gov/historicaldocuments/frus1964-68v04/d143), [144](https://history.state.gov/historicaldocuments/frus1964-68v04/d144), [145](https://history.state.gov/historicaldocuments/frus1964-68v04/d145). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1165) (May 21, 1966). Made public, the telegrams and the call: FRUS 1964–68, IV (1998). See [[cal.1966-03-10.vietnam]]; [[cal.1966-04-02.vietnam]]. Names: Kỳ, Huỳnh Văn Cao (Viet. III.G); Walt (Viet. III.D); Rusk (Viet. III.A); Moyers (K–J Adm. III.C).'
    tags: [name:nguyen-cao-ky, name:cao-van-vien, name:ton-that-dinh, name:huynh-van-cao, name:walt-lewis-w, name:rusk-dean, name:porter-william-j, name:moyers-bill, name:johnson-lyndon-b]
  - id: cal.1966-05-16.civil-rights-organizations
    when: May 16
    date: '1966-05-16'
    thread: civil-rights-organizations
    c: 'SNCC''s staff, meeting at Kingston Springs, Tenn., re-elects Lewis chairman, then, after Worth Long challenges the vote, elects Carmichael in his place. Ruby Doris Smith Robinson succeeds Forman as executive secretary. Check the dates.'
    n: '[[w.carson-in-struggle]]; [[w.joseph-stokely]]; [[w.carmichael-ready-for-revolution]]; [[w.lewis-walking-with-the-wind]]. See [[cal.1966-01-06.students]]. Names: Lewis, Carmichael, Forman (K–J Cong. III.H).'
    tags: [name:lewis-john, name:carmichael-stokely, name:forman-james]
  - id: cal.1966-05-17.testing
    when: May 17
    date: '1966-05-17'
    thread: testing
    c: 'China''s third nuclear test, May 9, a device with thermonuclear material (Check). May 17, the Senate adopts Pastore''s resolution, S. Res. 179, [84–0](https://voteview.com/rollcall/RS0890300): the President''s efforts toward agreements against the spread of nuclear weapons commended and supported.'
    n: '[[w.seaborg-stemming-the-tide]]; [[w.brands-rethinking-nonproliferation]]. See [[cal.1964-10-16.testing]]; [[cal.1965-01-21.testing]].'
    tags: [name:pastore-john-o]
  - id: cal.1966-05-18.defense
    when: May 18
    date: '1966-05-18'
    thread: defense
    c: 'McNamara to the American Society of Newspaper Editors at Montreal: in the modernizing nations "security is development"; past a point a nation buys no more security with more arms; the United States no mandate to police the world. Proposes that every young American give two years to the country, in the services or in other work (Check the wording).'
    n: '[[w.mcnamara-essence-of-security]]; [[w.shapley-promise-and-power]]. Names: McNamara (K–J Adm. III.F).'
    tags: [name:mcnamara-robert-s]
  - id: cal.1966-05-26.vietnam
    when: May 26–June 1
    date: '1966-05-26'
    thread: vietnam
    c: 'Huế. After the funeral of the lieutenant killed May 17, a crowd burns the USIS library, May 26. Self-immolations, a nun at Huế on May 29 the first (Check), others in the days after. June 1, students sack and burn the American consulate (Check the date). Lodge, May 30: a "cynical campaign of hunger strikes, letters in blood and suicide."'
    n: 'FRUS 1964–68, IV, docs. [146](https://history.state.gov/historicaldocuments/frus1964-68v04/d146), [150](https://history.state.gov/historicaldocuments/frus1964-68v04/d150). See [[cal.1966-03-10.vietnam]]; [[cal.1966-05-15.vietnam]]. Names: Lodge (Viet. III.C).'
    tags: [name:lodge-henry-cabot]
  - id: cal.1966-05-26.jobs-and-wages
    when: May 26
    date: '1966-05-26'
    thread: jobs-and-wages
    c: 'House passes the Fair Labor Standards Amendments, H.R. 13712, [303–93](https://voteview.com/rollcall/RH0890261): the minimum wage to rise by steps to $1.60 an hour; coverage extended to millions more, farm workers among them (Check). An amendment to narrow the coverage of retail enterprises by their sales lost, [195–200](https://voteview.com/rollcall/RH0890258).'
    n: '[[w.nordlund-quest-for-a-living]].'
