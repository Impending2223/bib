# Cal. XLIV July 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLIV
entries:
  - id: cal.1963-07-01.civil-rights-bill
    when: July 1–29
    date: '1963-07-01'
    thread: civil-rights-bill
    also: [desegregation-public-places, robert-kennedy]
    c: 'Magnuson''s Commerce Committee hears S. 1732, the public accommodations title. Robert Kennedy opens, July 1–2. Against: Barnett, July 12; Wallace, July 15. For: Allen of Atlanta, the one Southern mayor, July 26.'
    n: '*Civil Rights—Public Accommodations: Hearings on S. 1732 Before the S. Comm. on Commerce*, 88th Cong., [pt. 1](https://www.govinfo.gov/app/details/CHRG-88shrg21544p1), [pt. 2](https://www.govinfo.gov/app/details/CHRG-88shrg21544p2) (1963). [[w.whalen-longest-debate]]; [[w.risen-bill-of-the-century]]. See [[cal.1963-06-11.civil-rights-bill]]. Names: Robert F. Kennedy (K–J Adm. III.A); Magnuson (K–J Cong. III.B); Barnett, Wallace, Allen (K–J Cong. III.F).'
    tags: [name:kennedy-robert-f, name:magnuson-warren-g, name:barnett-ross-r, name:wallace-george-c, name:allen-ivan-jr]
  - id: cal.1963-07-01.legislatures-il
    when: July 1
    date: '1963-07-01'
    thread: legislatures
    c: Illinois. Kerner vetoes the Republican legislature's map of the House's districts, "unfair." Under the amendment of 1954, a commission of five from each party to draw the map, appointed Aug. 14; it deadlocks. Failing a map, the House to be elected at large.
    n: '[Wikipedia, "1964 Illinois House of Representatives election"](https://en.wikipedia.org/wiki/1964_Illinois_House_of_Representatives_election), from the *Illinois Blue Book* and the press (Check: the veto message, *Journal of the House*, 1963). [[w.mcdowell-orange-ballot-election]]; [[w.barnhart-kerner]]; [[w.politics-of-reapportionment]]. Names: Kerner (K–J Cong. III.F).'
    tags: [state:il, name:kerner-otto]
  - id: cal.1963-07-04.elections-1964
    when: July 4
    date: '1963-07-04'
    thread: elections-1964
    also: [goldwater]
    c: Draft Goldwater rally, National Guard Armory, Washington. Police count over 7,000. Tower the speaker; O'Donnell and White on the platform. Goldwater in Arizona.
    n: '[[w.white-suite-3505]]; [[w.perlstein-before-the-storm]]; [[w.novak-agony-of-the-g]]. See [[cal.1963-04-08.elections-1964]]. Names: Goldwater (Opp. III.B); Tower (K–J Cong. III.E); O''Donnell, White (Opp. III.F).'
    tags: [name:goldwater-barry-m, name:tower-john-g, name:odonnell-peter, name:white-f-clifton]
  - id: cal.1963-07-09.railroads
    when: July 9–10
    date: '1963-07-09'
    thread: railroads
    c: 'The carriers'' new work rules due at midnight July 10; the brotherhoods to strike. Kennedy asks both to put the dispute to Justice Goldberg for binding decision; the unions refuse. Rules and strike put off to July 29. A subcommittee of the Labor-Management Advisory Committee to report by July 22: Wirtz chairman, Hodges, Meany.'
    n: '[Statement by the President Urging Railroad Management and Union Leaders To Arbitrate Their Dispute](https://www.presidency.ucsb.edu/documents/statement-the-president-urging-railroad-management-and-union-leaders-arbitrate-their) (July 9, 1963). [Radio and Television Statement Following Action To Postpone the Nationwide Railroad Strike](https://www.presidency.ucsb.edu/documents/radio-and-television-statement-following-action-postpone-the-nationwide-railroad-strike) (July 10, 1963). CQ Almanac 1963 (K–J Cong. II.L). See [[cal.1963-04-03.railroads]]. Names: Goldberg (K–J Cong. III.G); Wirtz, Hodges (K–J Adm. III.G); Meany (K–J Cong. III.I).'
    tags: [name:kennedy-john-f, name:goldberg-arthur-j, name:wirtz-w-willard, name:hodges-luther-h, name:meany-george]
  - id: cal.1963-07-10.opinion
    when: July 10
    date: '1963-07-10'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, June 21–26: a law giving Negroes the right to be served in hotels, restaurants, theaters, and the like, 49 percent for, 42 against. Whites outside the South 55 for; Southern whites 12 for, 82 against.'
    n: '[[w.gallup-poll]], III, 1827.'
  - id: cal.1963-07-11.desegregation-schools-okc
    when: July 11
    date: '1963-07-11'
    thread: desegregation-schools
    c: Oklahoma City. Judge Bohanon finds Robert Dowell's transfer to Northeast High School refused because of his race. The school board to stop its minority-to-majority transfers and to file within ninety days a plan to integrate pupils and teachers.
    n: '*Dowell v. School Board of Oklahoma City Public Schools*, [219 F. Supp. 427](https://static.case.law/f-supp/219/html/0427-01.html) (W.D. Okla. 1963). [[w.morgan-oklahoma-politics-and-policies]]. Names: Bohanon (K–J Cong. III.K).'
    tags: [state:ok, city:oklahoma-city, name:bohanon-luther]
  - id: cal.1963-07-14.elections-1964
    when: July 14
    date: '1963-07-14'
    thread: elections-1964
    c: 'Rockefeller''s statement against the "radical right": the Young Republicans'' convention at San Francisco in June won by "tactics of totalitarianism"; the party would "destroy itself" on the strategy "seriously proposed" for 1964. Check the wording.'
    n: '[[w.smith-on-his-own-terms]]; [[w.kabaservice-rule-and-ruin]]; [[w.novak-agony-of-the-g]]. See [[cal.1963-04-08.elections-1964]]. Names: Nelson Rockefeller (Opp. III.H).'
    tags: [name:rockefeller-nelson]
  - id: cal.1963-07-14.opinion
    when: July 14
    date: '1963-07-14'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, June 21–26: the Kennedy administration pushing integration too fast, 41 percent; not fast enough, 14; about right, 31. Southern whites, 77 too fast.'
    n: '[[w.gallup-poll]], III, 1828.'
  - id: cal.1963-07-15.testing
    when: July 15–25
    date: '1963-07-15'
    thread: testing
    c: 'Moscow talks: Harriman, Hailsham, Gromyko. Khrushchev at the first session withdraws his offer of inspections and tables a ban in three environments, with a non-aggression pact. Treaty initialed July 25, 7:15 p.m. Moscow time. Underground tests left out; the pact left for later.'
    n: 'FRUS 1961–63, VII, docs. [319](https://history.state.gov/historicaldocuments/frus1961-63v07/d319) (Harriman''s instructions), [325](https://history.state.gov/historicaldocuments/frus1961-63v07/d325), [353](https://history.state.gov/historicaldocuments/frus1961-63v07/d353). [Joint Statement by the Heads of Delegations to the Moscow Nuclear Test Ban Meeting](https://www.presidency.ucsb.edu/documents/joint-statement-the-heads-delegations-the-moscow-nuclear-test-ban-meeting) (July 25, 1963). [[w.seaborg-kennedy-khrushchev-and-the]]; [[w.oliver-kennedy-macmillan-and-the]]; [[w.abramson-spanning-the-century]]. See [[cal.1963-06-10.testing]]. Names: Harriman (K–J Adm. III.E); Hailsham, Khrushchev, Gromyko (K–J Adm. III.J).'
    tags: [name:harriman-w-averell, name:hailsham-quinton-m-h, name:gromyko-andrei, name:khrushchev-nikita-s]
  - id: cal.1963-07-15.africa
    when: July 15–16
    date: '1963-07-15'
    thread: africa
    also: [peace-corps]
    c: 'Nyerere, President of Tanganyika, at the White House: the Addis Ababa conference, and an East African federation. The Peace Corps to send 80 teachers to Tanganyika in November.'
    n: '[Remarks of Welcome at the White House to President Nyerere of Tanganyika](https://www.presidency.ucsb.edu/documents/remarks-welcome-the-white-house-president-nyerere-tanganyika) (July 15, 1963); [Joint Statement Following Discussions With President Nverere of Tanganyika](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-nverere-tanganyika) (July 16, 1963). [[w.muehlenbeck-betting-on-the-africans]]. See [[cal.1963-05-22.africa]]. Names: Nyerere (K–J Adm. III.J).'
    tags: [name:nyerere-julius-k, name:kennedy-john-f]
  - id: cal.1963-07-16.economy
    when: July 16–17
    date: '1963-07-16'
    thread: economy
    c: The Board (Martin) approves the discount rate from 3 to 3½ percent at seven Reserve Banks, New York among them, effective July 17; the other five by July 26. The Regulation Q ceiling on time deposits of 90 days to a year raised to 4 percent, from 2½ and 3½. The first change in the rate since 1960; the stated aim, to check short-term capital outflows.
    n: '[Board press release](https://fraser.stlouisfed.org/title/9237/item/697242) (July 16, 1963). [*Federal Reserve Bulletin*, Sept. 1963](https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/september-1963-21345), pp. 1264–65. [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.coombs-arena-of-international-finance]]. See [[cal.1961-02-20.economy]]. Names: Martin (K–J Adm. III.H).'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1963-07-17.civil-rights-bill
    when: July 17
    date: '1963-07-17'
    thread: civil-rights-bill
    c: News conference. The March on Washington "a peaceful assembly calling for a redress of grievances," not "a march on the Capital." Warns against demonstrations "which could lead to bloodshed." Wants the tax and civil rights bills both this year.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-166) (July 17, 1963). See [[cal.1963-06-11.civil-rights-bill]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-17.opinion
    when: July 17
    date: '1963-07-17'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, June 21–26: mass demonstrations by Negroes will hurt their cause, 60 percent; help it, 27. Race relations in the next six months, worse 63, better 21.'
    n: '[[w.gallup-poll]], III, 1828.'
  - id: cal.1963-07-17.legislatures-ok
    when: July 17
    date: '1963-07-17'
    thread: legislatures
    c: The three-judge court reapportions the Oklahoma Legislature itself, by "Model C" of the University of Oklahoma's Bureau of Government Research, for elections through 1972 unless the Legislature so elected acts. The Legislature's 1963 act and resolution held no remedy.
    n: '*Moss v. Burkhart*, [220 F. Supp. 149](https://static.case.law/f-supp/220/html/0149-01.html) (W.D. Okla. 1963). See [[cal.1962-06-19.legislatures-ok]].'
    tags: [state:ok]
  - id: cal.1963-07-17.state-constitutions-nd
    when: July 17
    date: '1963-07-17'
    thread: state-constitutions
    also: [state-and-city-finance, cities-and-housing]
    c: North Dakota, special election on five laws referred to the people; all disapproved. A graduated income tax, 19,021 to 108,575; an adjusted income tax, 19,219 to 108,057; withholding of income taxes, 25,673 to 101,100; a tax levy for further urban renewal projects, 23,399 to 98,553; limits on school district levies, 24,859 to 98,328.
    n: '[*Statement of the Findings of the State Board of Canvassers, Special Election Held July 17, 1963*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1963-07-17-special.pdf). [[w.peirce-great-plains-states-of]].'
    tags: [state:nd]
  - id: cal.1963-07-18.economy
    when: July 18
    date: '1963-07-18'
    thread: economy
    c: Balance of payments message. An interest equalization tax on Americans' purchases of foreign securities, 2.75 to 15 percent, from that day through 1965. A $500 million IMF standby. Federal spending abroad to fall about $1 billion by 1965. The Fed has raised the discount rate from 3 to 3½ percent.
    n: '[Special Message to the Congress on Balance of Payments](https://www.presidency.ucsb.edu/documents/special-message-the-congress-balance-payments) (July 18, 1963). [[w.gavin-gold-dollars-and-power]]; [[w.roosa-dollar-and-world-liquidity]]; [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]; [[w.meltzer-history-of-the-federal]]; [[w.eichengreen-globalizing-capital]]; [[w.kunz-butter-and-guns]]. See [[cal.1961-01-05.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-18.latin-america
    when: July 18
    date: '1963-07-18'
    thread: latin-america
    c: Chamizal settled with Mexico, the 1911 arbitral award given effect. Convention, [15 U.S.T. 21](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-15-1/lltreaties-15-1.pdf#page=29), [505 U.N.T.S. 185](https://treaties.un.org/doc/Publication/UNTS/Volume%20505/volume-505-I-7374-English.pdf), signed in Mexico City, Aug. 29.
    n: '[Statement by the President on the Solution of the Chamizal Border Dispute With Mexico](https://www.presidency.ucsb.edu/documents/statement-the-president-the-solution-the-chamizal-border-dispute-with-mexico) (July 18, 1963). Convention for the Solution of the Problem of the Chamizal (K–J Cong. II.J.2). [[w.liss-century-of-disagreement]]; [[w.lamborn-statecraft-domestic-politics-and]]. See [[cal.1962-06-29.latin-america]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-18.poverty-nc
    when: July 18
    date: '1963-07-18'
    thread: poverty
    c: 'The North Carolina Fund incorporated by Sanford and others: a private nonprofit corporation, for five years, for experiments against poverty in education, health, job training, housing and community development, and for racial equality. The Ford Foundation commits $7 million.'
    n: '[[w.korstad-to-right-these-wrongs]], 82; [[w.covington-terry-sanford]]. Names: Sanford (K–J Cong. III.F).'
    tags: [state:nc, name:sanford-terry]
  - id: cal.1963-07-19.opinion
    when: July 19
    date: '1963-07-19'
    thread: opinion
    also: [desegregation-schools, desegregation-public-places]
    c: 'Gallup, June 21–26, in the South: whites and Negroes will one day share schools, restaurants, and public accommodations, 83 percent; within five years, 49. Peacefully, 21; with some strife, 42; with a great deal, 30.'
    n: '[[w.gallup-poll]], III, 1829.'
  - id: cal.1963-07-21.opinion
    when: July 21
    date: '1963-07-21'
    thread: opinion
    c: 'Gallup, June 21–26: Negroes here have as good a chance as whites at any job they are qualified for, 43 percent; not as good, 48.'
    n: '[[w.gallup-poll]], III, 1829.'
  - id: cal.1963-07-21.states-and-cities-us
    when: July 21–24
    date: '1963-07-21'
    thread: states-and-cities
    also: [civil-rights-bill]
    c: 'Governors'' Conference at Miami Beach. July 22: Hatfield''s appeal against a five-minute limit on the civil rights discussion and a bar on motions, lost 14–34, Rockefeller seconding. The Executive Committee''s rule of unanimity for resolutions replaced, on Sawyer''s motion, by none: the Resolutions Committee abolished, 33–16; Hatfield''s two-thirds rule with closure falls with it. July 23, civil rights discussed without a vote.'
    n: '[*Proceedings of the Governors'' Conference, 1963*, 11–28](https://www.nga.org/wp-content/uploads/2026/03/1963_Annual_Meeting-compressed.pdf#page=30). See [[cal.1962-07-03.states-and-cities-us]]. Names: Hatfield (Opp. III.B); Nelson Rockefeller (Opp. III.H); Sawyer (K–J Cong. III.F).'
    tags: [name:hatfield-mark-o, name:rockefeller-nelson, name:sawyer-grant]
  - id: cal.1963-07-22.railroads
    when: July 22
    date: '1963-07-22'
    thread: railroads
    c: Message on the dispute. Disputed rules to the ICC for two years; no strike or lockout over them. Not compulsory arbitration, he says. Commerce committees hold hearings, July 23–Aug. 2; the deadline moved to Aug. 29.
    n: '[Special Message to the Congress on the Railroad Rules Dispute](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-railroad-rules-dispute) (July 22, 1963). *Railroad Work Rules Dispute: Hearings on S.J. Res. 102 Before the S. Comm. on Commerce*, 88th Cong. (1963); *Railroad Work Rules Dispute: Hearings on H.J. Res. 565 Before the H. Comm. on Interstate and Foreign Commerce*, 88th Cong. (1963). See [[cal.1963-07-09.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-23.program
    when: July 23
    date: '1963-07-23'
    thread: immigration
    c: Immigration message. National-origins quotas cut a fifth a year, gone in five. Visas by skill and family, first come first served. The Asia-Pacific triangle repealed.
    n: '[Letter to the President of the Senate and to the Speaker of the House on Revision of the Immigration Laws](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-revision-the-immigration-laws) (July 23, 1963). [[w.yang-one-mighty-and-irresistible]]; [[w.reimers-still-the-golden-door]]; [[w.tichenor-dividing-lines]]; [[w.ngai-impossible-subjects]]; [[w.zolberg-nation-by-design]]. Immigration and Nationality Act Amendments (K–J Cong. II.J.2).'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-23.civil-rights-the-executive
    when: July 23
    date: '1963-07-23'
    thread: civil-rights-the-executive
    also: [states-and-cities, robert-kennedy]
    c: 'Cambridge, Md., under the Guard since June. At Justice, Robert Kennedy brings Gloria Richardson and the city''s and State''s officers to an agreement: schools and accommodations desegregated, public housing, a human relations commission; demonstrations to stop. The city then puts accommodations to a referendum.'
    n: '[[w.levy-civil-war-on-race]]; [[w.fitzgerald-struggle-is-eternal]]; [[w.brauer-john-f-kennedy-and]]. Names: Robert F. Kennedy (K–J Adm. III.A); Richardson (K–J Cong. III.K).'
    tags: [name:kennedy-robert-f, name:richardson-gloria, state:md, city:cambridge-md]
  - id: cal.1963-07-23.alabama-birmingham
    when: July 23
    date: '1963-07-23'
    thread: alabama
    also: [desegregation-public-places, mayors]
    c: Birmingham's council repeals the city's segregation ordinances, unanimously (Check).
    n: 'Encyclopedia of Alabama, ["Birmingham Campaign of 1963"](https://encyclopediaofalabama.org/article/birmingham-campaign-of-1963/). Check: the council''s minutes. [[w.eskew-but-for-birmingham]]; [[w.thornton-dividing-lines]]. See [[cal.1963-05-23.alabama-birmingham]].'
    tags: [state:al, city:birmingham]
  - id: cal.1963-07-24.opinion-5
    when: July 24
    date: '1963-07-24'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, June 21–26: Kennedy 60, Goldwater 34, undecided 6; Kennedy 63, Rockefeller 30, undecided 7; Kennedy 59, Romney 33, undecided 8.'
    n: '[[w.gallup-poll]], III, 1829–30. Names: Goldwater (Opp. III.B); Nelson Rockefeller, Romney (Opp. III.H).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1963-07-26.testing
    when: July 26
    date: '1963-07-26'
    thread: testing
    c: Address on the treaty. "Yesterday a shaft of light cut into the darkness." "A journey of a thousand miles must begin with a single step."
    n: '[Radio and Television Address to the American People on the Nuclear Test Ban Treaty](https://www.presidency.ucsb.edu/documents/radio-and-television-address-the-american-people-the-nuclear-test-ban-treaty) (July 26, 1963). See [[cal.1963-06-10.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-26.civil-rights-the-executive
    when: July 26
    date: '1963-07-26'
    thread: civil-rights-the-executive
    also: [defense]
    c: 'McNamara''s directive on the Gesell Committee''s report: commanders to oppose discrimination against their men off base. With the service secretary''s approval, places may be put off limits.'
    n: 'Dep''t of Defense Directive 5120.36 (July 26, 1963). [[w.macgregor-integration-of-the-armed]], ch. 22. Names: McNamara (K–J Adm. III.F); Gesell (Wg. III.E).'
    tags: [name:mcnamara-robert-s, name:gesell-gerhard-a]
  - id: cal.1963-07-26.transition-and-staff
    when: July 26
    date: '1963-07-26'
    thread: transition-and-staff
    c: Day resigns as Postmaster General, effective Aug. 9.
    n: '[Letter Accepting Resignation of Postmaster General J. Edward Day](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-postmaster-general-j-edward-day) (July 26, 1963). [[w.day-my-appointed-round]]. See [[cal.1961-01-20.transition-and-staff]]. Names: Day (K–J Adm. III.G).'
    tags: [name:day-j-edward, name:kennedy-john-f]
  - id: cal.1963-07-26.opinion
    when: July 26
    date: '1963-07-26'
    thread: opinion
    also: [court]
    c: 'Gallup, May 23–28: 14 percent have heard of the proposed Court of the Union, the fifty State chief justices with power to overturn the Supreme Court. Of them, 29 for, 55 against; in the South, 45 for, 32 against.'
    n: '[[w.gallup-poll]], III, 1830.'
  - id: cal.1963-07-28.opinion-5
    when: July 28
    date: '1963-07-28'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, June 21–26: Republicans'' choice for 1964: Goldwater 39, Rockefeller 27, Romney 14; others, no preference 20.'
    n: '[[w.gallup-poll]], III, 1830–31. Names: Goldwater (Opp. III.B); Nelson Rockefeller, Romney (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1963-07-30.defense
    when: July 30
    date: '1963-07-30'
    thread: defense
    c: Anderson leaves as Chief of Naval Operations after one two-year term, for Lisbon as ambassador. McDonald succeeds him, Aug. 1.
    n: '[Remarks Upon Presenting the Distinguished Service Medal to Adm. George W. Anderson, Jr](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-distinguished-service-medal-adm-george-w-anderson-jr) (July 30, 1963). See [[cal.1961-02-06.defense]]. Names: George Anderson, McDonald (K–J Adm. III.F).'
    tags: [name:anderson-george-w-jr, name:mcdonald-david-l, name:kennedy-john-f]
  - id: cal.1963-07-30.specials
    when: July 30
    date: '1963-07-30'
    thread: specials
    c: Pennsylvania 15th, special. Fred B. Rooney (D) holds the seat of Francis E. Walter (D), who died May 31; 53.5 to 46.5 over Bartlett (R). Swing 4.0 to R.
    n: 'Votes: CQ Guide 6th (2010) 1271. Check: *Pa. Manual*, 1963–64. See [[cal.1961-04-04.states-and-cities]]. Names: Rooney, Bartlett (K–J Cong. III.K); Walter (K–J Cong. III.D).'
    tags: [special:1963-07-30-h-PA-15, name:rooney-frederick-b, name:walter-francis-e, name:bartlett-robert-g]
  - id: cal.1963-07-30.legislatures-ca
    when: July 30–31
    date: '1963-07-30'
    thread: legislatures
    also: [state-and-city-finance]
    c: California. Unruh keeps the Assembly's Republicans locked in the chamber overnight until they vote on the budget. Check the bill and the hours.
    n: '[[w.boyarsky-big-daddy]]; [[w.cannon-ronnie-and-jesse]]. See [[cal.1961-09.legislatures-ca]]. Names: Unruh (Cong. III.I).'
    tags: [state:ca, name:unruh-jesse-m]
  - id: cal.1963-07-31.opinion-5
    when: July 31
    date: '1963-07-31'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, July 18–23: Independents'' choice for 1964: Goldwater 31, Rockefeller 27, Romney 15, Stassen 6, Scranton 5; none 6, don''t know 10.'
    n: '[[w.gallup-poll]], III, 1831. Names: Goldwater (Opp. III.B); Nelson Rockefeller, Romney, Scranton (Opp. III.H); Stassen (Opp. III.E).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w, name:stassen-harold-e, name:scranton-william-w]
  - id: cal.1963-07-31.africa
    when: July 31
