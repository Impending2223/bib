# Cal. XXXIII July 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXIII
entries:
  - id: cal.1963-07-01.civil-rights-bill
    when: July 1–29
    date: '1963-07-01'
    thread: civil-rights-bill
    also: [desegregation-public-places]
    c: 'Magnuson''s Commerce Committee hears S. 1732, the public accommodations title. Robert Kennedy opens, July 1–2. Against: Barnett, July 12; Wallace, July 15. For: Allen of Atlanta, the one Southern mayor, July 26.'
    n: '*Civil Rights—Public Accommodations: Hearings on S. 1732 Before the S. Comm. on Commerce*, 88th Cong., [pt. 1](https://www.govinfo.gov/app/details/CHRG-88shrg21544p1), [pt. 2](https://www.govinfo.gov/app/details/CHRG-88shrg21544p2) (1963). Whalen, *The Longest Debate*; Risen, *The Bill of the Century* (K–J Cong. II.C). See [[cal.1963-06-11.civil-rights-bill]]. Names: Robert F. Kennedy (K–J Adm. III.A); Magnuson (K–J Cong. III.B); Barnett, Wallace, Allen (K–J Cong. III.F).'
    tags: [name:kennedy-robert-f, name:magnuson-warren-g, name:barnett-ross-r, name:wallace-george-c, name:allen-ivan-jr]
  - id: cal.1963-07-04.elections-1964
    when: July 4
    date: '1963-07-04'
    thread: elections-1964
    c: Draft Goldwater rally, National Guard Armory, Washington. Police count over 7,000. Tower the speaker; O'Donnell and White on the platform. Goldwater in Arizona.
    n: 'White, *Suite 3505*; Perlstein, *Before the Storm* (Opp. II.B). Novak, *The Agony of the G.O.P. 1964* (Opp. II.A). See [[cal.1963-04-08.elections-1964]]. Names: Goldwater (Opp. III.B); Tower (K–J Cong. III.E); O''Donnell, White (Opp. III.F).'
    tags: [name:goldwater-barry-m, name:tower-john-g, name:odonnell-peter, name:white-f-clifton]
  - id: cal.1963-07-09.railroads
    when: July 9–10
    date: '1963-07-09'
    thread: railroads
    c: 'The carriers'' new work rules due at midnight July 10; the brotherhoods to strike. Kennedy asks both to put the dispute to Justice Goldberg for binding decision; the unions refuse. Rules and strike put off to July 29. A subcommittee of the Labor-Management Advisory Committee to report by July 22: Wirtz chairman, Hodges, Meany.'
    n: '[Statement by the President Urging Railroad Management and Union Leaders To Arbitrate Their Dispute](https://www.presidency.ucsb.edu/documents/statement-the-president-urging-railroad-management-and-union-leaders-arbitrate-their) (July 9, 1963). [Radio and Television Statement Following Action To Postpone the Nationwide Railroad Strike](https://www.presidency.ucsb.edu/documents/radio-and-television-statement-following-action-postpone-the-nationwide-railroad-strike) (July 10, 1963). CQ Almanac 1963 (K–J Cong. II.L). See [[cal.1963-04-03.railroads]]. Names: Goldberg (K–J Cong. III.G); Wirtz, Hodges (K–J Adm. III.G); Meany (K–J Cong. III.I).'
    tags: [name:kennedy-john-f, name:goldberg-arthur-j, name:wirtz-w-willard, name:hodges-luther-h, name:meany-george]
  - id: cal.1963-07-10.opinion
    when: July 10
    date: '1963-07-10'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, June 21–26: a law giving Negroes the right to be served in hotels, restaurants, theaters, and the like, 49 percent for, 42 against. Whites outside the South 55 for; Southern whites 12 for, 82 against.'
    n: '*The Gallup Poll*, III, 1827 (K–J Cong. II.E).'
  - id: cal.1963-07-14.elections-1964
    when: July 14
    date: '1963-07-14'
    thread: elections-1964
    c: 'Rockefeller''s statement against the "radical right": the Young Republicans'' convention at San Francisco in June won by "tactics of totalitarianism"; the party would "destroy itself" on the strategy "seriously proposed" for 1964. Check the wording.'
    n: 'Smith, *On His Own Terms* (Opp. II.C). Kabaservice, *Rule and Ruin*; Novak, *The Agony of the G.O.P. 1964* (Opp. II.A). See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller (Opp. III.H).'
    tags: [name:rockefeller-nelson]
  - id: cal.1963-07-14.opinion
    when: July 14
    date: '1963-07-14'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, June 21–26: the Kennedy administration pushing integration too fast, 41 percent; not fast enough, 14; about right, 31. Southern whites, 77 too fast.'
    n: '*The Gallup Poll*, III, 1828 (K–J Cong. II.E).'
  - id: cal.1963-07-15.testing
    when: July 15–25
    date: '1963-07-15'
    thread: testing
    c: 'Moscow talks: Harriman, Hailsham, Gromyko. Khrushchev at the first session withdraws his offer of inspections and tables a ban in three environments, with a non-aggression pact. Treaty initialed July 25, 7:15 p.m. Moscow time. Underground tests left out; the pact left for later.'
    n: 'FRUS 1961–63, VII, docs. [319](https://history.state.gov/historicaldocuments/frus1961-63v07/d319) (Harriman''s instructions), [325](https://history.state.gov/historicaldocuments/frus1961-63v07/d325), [353](https://history.state.gov/historicaldocuments/frus1961-63v07/d353). [Joint Statement by the Heads of Delegations to the Moscow Nuclear Test Ban Meeting](https://www.presidency.ucsb.edu/documents/joint-statement-the-heads-delegations-the-moscow-nuclear-test-ban-meeting) (July 25, 1963). Seaborg, *Kennedy, Khrushchev, and the Test Ban*; Oliver, *Kennedy, Macmillan and the Nuclear Test-Ban Debate* (K–J Adm. II.D). Abramson, *Spanning the Century* (K–J Adm. II.G.4). See [[cal.1963-06-10.testing]]. Names: Harriman (K–J Adm. III.E); Khrushchev, Gromyko (K–J Adm. III.J).'
    tags: [name:harriman-w-averell, name:hailsham-quinton-m-h, name:gromyko-andrei, name:khrushchev-nikita-s]
  - id: cal.1963-07-17.civil-rights-bill
    when: July 17
    date: '1963-07-17'
    thread: civil-rights-bill
    c: News conference. The March on Washington "a peaceful assembly calling for a redress of grievances," not "a march on the Capital." Warns against demonstrations "which could lead to bloodshed." Wants the tax and civil rights bills both this year.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-166) (July 17, 1963). See [[cal.1963-06-11.civil-rights-bill]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-17.opinion
    when: July 17
    date: '1963-07-17'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, June 21–26: mass demonstrations by Negroes will hurt their cause, 60 percent; help it, 27. Race relations in the next six months, worse 63, better 21.'
    n: '*The Gallup Poll*, III, 1828 (K–J Cong. II.E).'
  - id: cal.1963-07-18.economy
    when: July 18
    date: '1963-07-18'
    thread: economy
    c: Balance of payments message. An interest equalization tax on Americans' purchases of foreign securities, 2.75 to 15 percent, from that day through 1965. A $500 million IMF standby. Federal spending abroad to fall about $1 billion by 1965. The Fed has raised the discount rate from 3 to 3½ percent.
    n: '[Special Message to the Congress on Balance of Payments](https://www.presidency.ucsb.edu/documents/special-message-the-congress-balance-payments) (July 18, 1963). Gavin, *Gold, Dollars, and Power*; Roosa, *The Dollar and World Liquidity*; Solomon, *The International Monetary System, 1945–1976*; Coombs, *The Arena of International Finance*; Meltzer, *A History of the Federal Reserve*; Eichengreen, *Globalizing Capital*; Kunz, *Butter and Guns* (K–J Adm. II.B). See [[cal.1961-01-05.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-18.latin-america
    when: July 18
    date: '1963-07-18'
    thread: latin-america
    c: Chamizal settled with Mexico, the 1911 arbitral award given effect. Convention, [15 U.S.T. 21](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-15-1/lltreaties-15-1.pdf#page=29), [505 U.N.T.S. 185](https://treaties.un.org/doc/Publication/UNTS/Volume%20505/volume-505-I-7374-English.pdf), signed in Mexico City, Aug. 29.
    n: '[Statement by the President on the Solution of the Chamizal Border Dispute With Mexico](https://www.presidency.ucsb.edu/documents/statement-the-president-the-solution-the-chamizal-border-dispute-with-mexico) (July 18, 1963). Convention for the Solution of the Problem of the Chamizal (K–J Cong. II.J.2). Liss, *A Century of Disagreement*; Lamborn & Mumme, *Statecraft, Domestic Politics, and Foreign Policy Making* (K–J Adm. II.D). See [[cal.1962-06-29.latin-america]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-19.opinion
    when: July 19
    date: '1963-07-19'
    thread: opinion
    also: [desegregation-schools, desegregation-public-places]
    c: 'Gallup, June 21–26, in the South: whites and Negroes will one day share schools, restaurants, and public accommodations, 83 percent; within five years, 49. Peacefully, 21; with some strife, 42; with a great deal, 30.'
    n: '*The Gallup Poll*, III, 1829 (K–J Cong. II.E).'
  - id: cal.1963-07-21.opinion
    when: July 21
    date: '1963-07-21'
    thread: opinion
    c: 'Gallup, June 21–26: Negroes here have as good a chance as whites at any job they are qualified for, 43 percent; not as good, 48.'
    n: '*The Gallup Poll*, III, 1829 (K–J Cong. II.E).'
  - id: cal.1963-07-22.railroads
    when: July 22
    date: '1963-07-22'
    thread: railroads
    c: Message on the dispute. Disputed rules to the ICC for two years; no strike or lockout over them. Not compulsory arbitration, he says. Commerce committees hold hearings, July 23–Aug. 2; the deadline moved to Aug. 29.
    n: '[Special Message to the Congress on the Railroad Rules Dispute](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-railroad-rules-dispute) (July 22, 1963). *Railroad Work Rules Dispute: Hearings on S.J. Res. 102 Before the S. Comm. on Commerce*, 88th Cong. (1963); *Railroad Work Rules Dispute: Hearings on H.J. Res. 565 Before the H. Comm. on Interstate and Foreign Commerce*, 88th Cong. (1963). See [[cal.1963-07-09.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-23.program
    when: July 23
    date: '1963-07-23'
    thread: immigration
    c: Immigration message. National-origins quotas cut a fifth a year, gone in five. Visas by skill and family, first come first served. The Asia-Pacific triangle repealed.
    n: '[Letter to the President of the Senate and to the Speaker of the House on Revision of the Immigration Laws](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-revision-the-immigration-laws) (July 23, 1963). Yang, *One Mighty and Irresistible Tide*; Reimers, *Still the Golden Door*; Tichenor, *Dividing Lines*; Ngai, *Impossible Subjects*; Zolberg, *A Nation by Design* (K–J Cong. II.B). Immigration and Nationality Act Amendments (K–J Cong. II.J.2).'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-23.civil-rights-the-executive
    when: July 23
    date: '1963-07-23'
    thread: civil-rights-the-executive
    also: [states-and-cities]
    c: 'Cambridge, Maryland, under the Guard since June. At Justice, Robert Kennedy brings Gloria Richardson and the city''s and State''s officers to an agreement: schools and accommodations desegregated, public housing, a human relations commission; demonstrations to stop. The city then puts accommodations to a referendum.'
    n: 'Levy, *Civil War on Race Street* (K–J Cong. II.F). Fitzgerald, *The Struggle Is Eternal* (K–J Cong. II.I.4). Brauer, *John F. Kennedy and the Second Reconstruction* (K–J Adm. II.C). Names: Robert F. Kennedy (K–J Adm. III.A); Richardson (K–J Cong. III.K).'
    tags: [name:kennedy-robert-f, name:richardson-gloria]
  - id: cal.1963-07-24.opinion-5
    when: July 24
    date: '1963-07-24'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, June 21–26: Kennedy 60, Goldwater 34, undecided 6; Kennedy 63, Rockefeller 30, undecided 7; Kennedy 59, Romney 33, undecided 8.'
    n: '*The Gallup Poll*, III, 1829–30 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller, Romney (Opp. III.H).'
    tags: [name:kennedy-john-f, name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1963-07-26.testing
    when: July 26
    date: '1963-07-26'
    thread: testing
    c: Address on the treaty. "Yesterday a shaft of light cut into the darkness." "A journey of a thousand miles must begin with a single step."
    n: '[Radio and Television Address to the American People on the Nuclear Test Ban Treaty](https://www.presidency.ucsb.edu/documents/radio-and-television-address-the-american-people-the-nuclear-test-ban-treaty) (July 26, 1963). See [[cal.1963-06-10.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-26.civil-rights-the-executive
    when: July 26
    date: '1963-07-26'
    thread: civil-rights-the-executive
    also: [defense]
    c: 'McNamara''s directive on the Gesell Committee''s report: commanders to oppose discrimination against their men off base. With the service secretary''s approval, places may be put off limits.'
    n: 'Dep''t of Defense Directive 5120.36 (July 26, 1963). MacGregor, *Integration of the Armed Forces*, ch. 22 (K–J Adm. II.C). Names: McNamara (K–J Adm. III.F); Gesell (Wg. III.E).'
    tags: [name:mcnamara-robert-s, name:gesell-gerhard-a]
  - id: cal.1963-07-26.transition-and-staff
    when: July 26
    date: '1963-07-26'
    thread: transition-and-staff
    c: Day resigns as Postmaster General, effective Aug. 9.
    n: '[Letter Accepting Resignation of Postmaster General J. Edward Day](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-postmaster-general-j-edward-day) (July 26, 1963). Day, *My Appointed Round* (K–J Adm. II.G.5). See [[cal.1961-01-20.transition-and-staff]]. Names: Day (K–J Adm. III.G).'
    tags: [name:day-j-edward, name:kennedy-john-f]
  - id: cal.1963-07-26.opinion
    when: July 26
    date: '1963-07-26'
    thread: opinion
    also: [court]
    c: 'Gallup, May 23–28: 14 percent have heard of the proposed Court of the Union, the fifty State chief justices with power to overturn the Supreme Court. Of them, 29 for, 55 against; in the South, 45 for, 32 against.'
    n: '*The Gallup Poll*, III, 1830 (K–J Cong. II.E).'
  - id: cal.1963-07-28.opinion-5
    when: July 28
    date: '1963-07-28'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, June 21–26: Republicans'' choice for 1964: Goldwater 39, Rockefeller 27, Romney 14; others, no preference 20.'
    n: '*The Gallup Poll*, III, 1830–31 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller, Romney (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1963-07-30.defense
    when: July 30
    date: '1963-07-30'
    thread: defense
    c: Anderson leaves as Chief of Naval Operations after one two-year term, for Lisbon as ambassador. McDonald succeeds him, Aug. 1.
    n: '[Remarks Upon Presenting the Distinguished Service Medal to Adm. George W. Anderson, Jr](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-distinguished-service-medal-adm-george-w-anderson-jr) (July 30, 1963). See [[cal.1961-02-06.defense]]. Names: Anderson (K–J Adm. III.F).'
    tags: [name:anderson-george-w-jr, name:mcdonald-david-l, name:kennedy-john-f]
  - id: cal.1963-07-30.specials
    when: July 30
    date: '1963-07-30'
    thread: specials
    c: Pennsylvania 15th, special. Fred B. Rooney (D) holds the seat of Francis E. Walter (D), who died May 31; 53.5 to 46.5 over Bartlett (R). Swing 4.0 to R.
    n: 'Votes: CQ Guide 6th (2010) 1271. Check: *Pa. Manual*, 1963–64. See [[cal.1961-04-04.states-and-cities]]. Names: Bartlett (K–J Cong. III.K).'
    tags: [special:1963-07-30-h-PA-15, name:rooney-frederick-b, name:walter-francis-e, name:bartlett-robert-g]
  - id: cal.1963-07-31.opinion-5
    when: July 31
    date: '1963-07-31'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, July 18–23: Independents'' choice for 1964: Goldwater 31, Rockefeller 27, Romney 15, Stassen 6, Scranton 5; none 6, don''t know 10.'
    n: '*The Gallup Poll*, III, 1831 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller, Romney, Scranton (Opp. III.H); Stassen (Opp. III.E).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w, name:stassen-harold-e, name:scranton-william-w]
