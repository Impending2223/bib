  - id: cal.1972-05-02.elections-1972
    when: May 2
    date: '1972-05-02'
    thread: elections-1972
    c: 'Primaries in the District of Columbia, Indiana and Ohio. Republican: Nixon in Indiana and Ohio. Democratic: Fauntroy in the District; Humphrey in Indiana and Ohio.'
    n: '[*Election Report of Indiana, 1972*, 3–4](https://indianamemory.contentdm.oclc.org/digital/collection/p16066coll37/id/1249). CQ Guide 6th (2010) 413. See [[cal.1972-03-07.elections-1972]]. Names: Humphrey, Nixon.'
    tags: [primary:1972-05-02, name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1972-05-04.elections-1972
    when: May 4
    date: '1972-05-04'
    thread: elections-1972
    c: 'Tennessee primary. Republican: Nixon over Ashbrook, 109,696 to 2,419, 95.8 percent. Democratic: Wallace over Humphrey, 335,858 to 78,350, 68.2 percent.'
    n: 'CQ Guide 6th (2010) 413. See [[cal.1972-03-07.elections-1972]]. Names: Wallace, Humphrey, Ashbrook, Nixon.'
    tags: [primary:1972-05-04, name:wallace-george-c, name:humphrey-hubert-h, name:ashbrook-john-m, name:nixon-richard-m]
  - id: cal.1972-05-06.elections-1972
    when: May 6
    date: '1972-05-06'
    thread: elections-1972
    c: 'North Carolina primary. Republican: Nixon over McCloskey, 159,167 to 8,732, 94.8 percent. Democratic: Wallace over Sanford, 413,518 to 306,014, 50.3 percent.'
    n: '[*North Carolina Manual, 1973*, 328–329](https://archive.org/details/northcarolinama1973nort/page/n344). CQ Guide 6th (2010) 414. See [[cal.1972-03-07.elections-1972]]. Names: Wallace, Sanford, McCloskey, Nixon.'
    tags: [primary:1972-05-06, name:wallace-george-c, name:mccloskey-paul-n-jr, name:nixon-richard-m, name:sanford-terry]
  - id: cal.1972-05-09.elections-1972
    when: May 9
    date: '1972-05-09'
    thread: elections-1972
    c: 'Primaries in Nebraska and West Virginia. Republican: Nixon in Nebraska; unpledged delegates in West Virginia. Democratic: McGovern in Nebraska; Humphrey in West Virginia.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1972*, 3, 30](https://govdocs.nebraska.gov/epubs/S1200/S001-1972prim_gen.pdf#page=4); [*West Virginia Blue Book, 1972*, 533, 574](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1972.pdf#page=541). CQ Guide 6th (2010) 414. See [[cal.1972-03-07.elections-1972]]. Names: McGovern, Humphrey, Nixon.'
    tags: [primary:1972-05-09, name:mcgovern-george, name:humphrey-hubert-h, name:nixon-richard-m]
