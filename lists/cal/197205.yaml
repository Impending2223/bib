    when: May 16
    date: '1972-05-16'
    thread: elections-1972
    c: 'Primaries in Maryland and Michigan. Republican: Nixon in Maryland and Michigan. Democratic: Wallace in Maryland and Michigan.'
    n: '[*Maryland Manual, 1973–74*, 692–693](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000176/html/am176--592.html). CQ Guide 6th (2010) 414. See [[cal.1972-03-07.elections-1972]]. Names: Wallace, Nixon.'
    tags: [primary:1972-05-16, name:wallace-george-c, name:nixon-richard-m]
