section: CXI
entries:
  - id: cal.1969-01-01.governors-ia
    when: Jan. 1
    date: '1969-01-01'
    thread: governors
    c: 'Iowa. Hughes, elected to the Senate, resigns as governor; Fulton, the lieutenant governor, governor for sixteen days.'
    n: '[Wikipedia, "Harold Hughes"](https://en.wikipedia.org/wiki/Harold_Hughes); [Wikipedia, "Robert D. Fulton"](https://en.wikipedia.org/wiki/Robert_D._Fulton). Check: the *Iowa Official Register*, 1969–70. See [[cal.1968-09-03.governors-ia]]. Names: Hughes, Fulton.'
    tags: [state:ia, name:hughes-harold-e, name:fulton-robert-d]

  - id: cal.1969-01-03.congress
    when: Jan. 3
    date: '1969-01-03'
    thread: congress
    also: [rules]
    c: 'The 91st Congress convenes. Senate 57 D–43 R; House 243 D–192 R. Jan. 2, the House Democratic caucus: McCormack over Udall for Speaker, 178–58. McCormack Speaker over Ford, [241–187](https://voteview.com/rollcall/RH0910001). Powell, re-elected in November: the previous question on seating him without conditions refused, [176–248](https://voteview.com/rollcall/RH0910002); a special committee refused, [131–291](https://voteview.com/rollcall/RH0910004); H. Res. 2 adopted, [254–158](https://voteview.com/rollcall/RH0910006): sworn, fined $25,000, $1,150 a month taken from his salary until it is paid, his seniority from the oath.'
    n: '[115 Cong. Rec., House, Jan. 3, 1969](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-2.pdf); [115 Cong. Rec., Senate, Jan. 3, 1969](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-1.pdf). [[w.nelson-john-william-mccormack]]; [[w.udall-too-funny-to-be]]; [[w.hamilton-adam-clayton-powell-jr]]; [[w.haygood-king-of-the-cats]]. See [[cal.1967-01-10.rules]]; [[cal.1967-04-11.specials]]. Names: McCormack, Udall, Ford, Powell.'
    tags: [congress:91, name:mccormack-john-w, name:udall-morris-k, name:ford-gerald-r, name:powell-adam-clayton-jr]
  - id: cal.1969-01-03.congress-2
    when: Jan. 3
    date: '1969-01-03'
    thread: congress
    c: 'The Senate Democrats: Edward Kennedy majority whip over Russell Long, 31–26; Mansfield re-elected leader. The Republicans: Dirksen leader; Scott whip over Hruska (Check the count).'
    n: '[[w.clymer-edward-m-kennedy]]. See [[cal.1969-01-03.congress]]. Names: Kennedy, Long, Mansfield, Dirksen, Scott, Hruska.'
    tags: [name:kennedy-edward-m, name:long-russell-b, name:mansfield-mike, name:dirksen-everett, name:scott-hugh-d-jr, name:hruska-roman-l]
  - id: cal.1969-01-05.vietnam
    when: Jan. 5
    date: '1969-01-05'
    thread: vietnam-paris
    also: [transition-and-staff]
    c: Nixon names Lodge to succeed Harriman at the head of the delegation to Paris, Walsh his deputy (Check the day).
    n: '[[w.blair-lodge-in-vietnam]]; [[w.kimball-nixons-vietnam-war]]. See [[cal.1968-05-13.vietnam]]. Names: Nixon, Lodge, Harriman, Walsh.'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:harriman-w-averell, name:walsh-lawrence-e]
  - id: cal.1969-01-06.elections-1968
    when: Jan. 6
    date: '1969-01-06'
    thread: elections-1968
    also: [electoral-college]
    c: 'Electoral votes counted in joint session, Humphrey presiding. North Carolina: Bailey of Rocky Mount, N.C., on the Nixon slate, voted Dec. 16 for Wallace and LeMay. Muskie and O''Hara object in writing; the houses apart. The House rejects the objection, [170–228](https://voteview.com/rollcall/RH0910007); the Senate, [33–58](https://voteview.com/rollcall/RS0910001). Nixon 301, Humphrey 191, Wallace 46; for Vice President, Agnew 301, Muskie 191, LeMay 46. Nixon and Agnew declared elected.'
    n: '[115 Cong. Rec. 145–172](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-2-1.pdf) (House); [115 Cong. Rec., Senate, Jan. 6, 1969](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-2-2.pdf). [[w.longley-politics-of-electoral-college]]; [[w.peirce-peoples-president]]. See [[cal.1968-11-05.elections-1968]]. Names: Humphrey, Bailey, Wallace, LeMay, Muskie, O''Hara, Nixon, Agnew.'
    tags: [name:humphrey-hubert-h, name:bailey-lloyd-w, name:wallace-george-c, name:lemay-curtis-e, name:muskie-edmund-s, name:ohara-james-g, name:nixon-richard-m, name:agnew-spiro-t, state:nc]
  - id: cal.1969-01-06.students-san-francisco
    when: Jan. 6
    date: '1969-01-06'
    thread: students-sf-state
    also: [labor-disputes]
    c: 'San Francisco State. The American Federation of Teachers'' local strikes, sanctioned by the San Francisco Labor Council: grievance procedures, amnesty for the strikers, the students'' demands settled, the trustees'' ten rules rescinded. Hayakawa: "a militant minority of the faculty has hitchhiked onto the militant, violence-ridden student strike for a vicious power grab."'
    n: '[[w.orrick-shut-it-down]], 62–63. See [[cal.1968-11-06.students]]. Names: Hayakawa.'
    tags: [state:ca, city:san-francisco, name:hayakawa-s-i]
  - id: cal.1969-01-06.vietnam-paris
    when: Jan. 6
    date: '1969-01-06'
    thread: vietnam-paris
    c: 'Clifford to his staff: nine table shapes, each divided in two, put to Hanoi for Saigon and refused; Hanoi offers an unmarked round table.'
    n: 'FRUS 1964–68, VII, doc. [274](https://history.state.gov/historicaldocuments/frus1964-68v07/d274). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-12-03.vietnam]]. Names: Clifford.'
    tags: [name:clifford-clark]

  - id: cal.1969-01-07.governors-md
    when: Jan. 7
    date: '1969-01-07'
    thread: governors
    also: [transition-and-staff]
    c: 'Annapolis, Md. Agnew resigns as governor. The General Assembly, in joint session, elects Marvin Mandel, Speaker of the House of Delegates since 1964, governor for the rest of the term: Maryland''s first Jewish governor.'
    n: '[Wikipedia, "Marvin Mandel"](https://en.wikipedia.org/wiki/Marvin_Mandel). Check: the vote of the joint session, from the *Journal of Proceedings*, and the hour of Agnew''s resignation. [[w.callcott-maryland-and-america-1940]]; [[w.witcover-white-knight]]. Names: Agnew, Mandel.'
    tags: [state:md, name:agnew-spiro-t, name:mandel-marvin]
  - id: cal.1969-01-07.vietnam-paris
    when: Jan. 7
    date: '1969-01-07'
    thread: vietnam-paris
    c: 'The Tuesday lunch: Rusk, no progress; Clifford, Hanoi''s offer one the parties can accept.'
    n: 'FRUS 1964–68, VII, doc. [275](https://history.state.gov/historicaldocuments/frus1964-68v07/d275). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-12-03.vietnam]]. Names: Rusk, Clifford, Johnson.'
    tags: [name:rusk-dean, name:clifford-clark, name:johnson-lyndon-b]

  - id: cal.1969-01-07.transition-and-staff-nsc
    when: Jan. 7
    date: '1969-01-07'
    thread: transition-and-staff-nsc
    c: 'Kissinger to Nixon: the State Department has begun to object to the NSC procedures Nixon approved in Florida.'
    n: 'FRUS 1969–76, II, doc. [3](https://history.state.gov/historicaldocuments/frus1969-76v02/d3). See [[cal.1968-12-27.transition-and-staff]]. Names: Kissinger, Nixon.'
    tags: [name:kissinger-henry-a, name:nixon-richard-m]

  - id: cal.1969-01-09.testing
    when: Jan. 9
    date: '1969-01-09'
    thread: testing
    c: 'Johnson, through the acting press secretary: "increasingly concerned" at the delay in ratifying the nonproliferation treaty, before the Senate since July. Jan. 14, the State of the Union: delay "not going to be helpful to the cause of peace."'
    n: '[Statement by the Acting Press Secretary Expressing the President''s Concern for Early Ratification of the Nuclear Nonproliferation Treaty](https://www.presidency.ucsb.edu/documents/statement-the-acting-press-secretary-expressing-the-presidents-concern-for-early) (Jan. 9, 1969). [[w.seaborg-stemming-the-tide]]. See [[cal.1966-10-10.soviet-union]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1969-01-09.transition-and-staff-nsc
    when: Jan. 9
    date: '1969-01-09'
    thread: transition-and-staff-nsc
    c: 'Laird to Kissinger: objections to the new NSC system. Richardson proposes changes for State (Check the day).'
    n: 'FRUS 1969–76, II, doc. [6](https://history.state.gov/historicaldocuments/frus1969-76v02/d6). See [[cal.1968-12-27.transition-and-staff]]. Names: Laird, Kissinger, Richardson.'
    tags: [name:laird-melvin-r, name:kissinger-henry-a, name:richardson-elliot-l]

  - id: cal.1969-01-13.transition-and-staff-nsc
    when: Jan. 13
    date: '1969-01-13'
    thread: transition-and-staff-nsc
    c: 'Nixon to Kissinger, on the NSC system, after Richardson''s paper: "my firm and definite decision."'
    n: 'FRUS 1969–76, II, doc. [8](https://history.state.gov/historicaldocuments/frus1969-76v02/d8). See [[cal.1968-12-27.transition-and-staff]]. Names: Nixon, Kissinger, Richardson.'
    tags: [name:nixon-richard-m, name:kissinger-henry-a, name:richardson-elliot-l]

  - id: cal.1969-01-14.program
    when: Jan. 14
    date: '1969-01-14'
    thread: program
    c: 'State of the Union, to a joint session, "for the sixth and the last time." Asked: social security up at least 13 percent, the minimum from $55 to $80 a month; medical care for expectant mothers and infants; the poverty program reorganized, not crippled; the Voting Rights Act''s main provisions extended five years; the full $300 million for the Safe Streets grants; licensing and registration of firearms; the postal system reorganized on the Kappel report; Members pay $42,500, not the commission''s $50,000; the draft by random selection. A surplus of $2.4 billion in fiscal 1969, $3.4 billion in 1970, the surtax extended, Nixon agreeing. The nonproliferation treaty ratified; the missile talks resumed. "At least it will be said that we tried."'
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-30) (Jan. 14, 1969). [[w.zelizer-fierce-urgency-of-now]]; [[w.dallek-flawed-giant]]; [[w.califano-triumph-and-tragedy-of]]; [[w.johnson-vantage-point]]. See [[cal.1968-01-17.program]]. Names: Johnson, Kappel, Nixon.'
    tags: [name:johnson-lyndon-b, name:kappel-frederick-r, name:nixon-richard-m]
    short: State of the Union
    to:
      - economy
      - vietnam-paris
      - congress
      - cities-and-housing
  - id: cal.1969-01-15.economy
    when: Jan. 15–16
    date: '1969-01-15'
    thread: economy
    c: 'Budget for fiscal 1970: outlays $195.3 billion, receipts $198.7 billion with the income tax surcharge and the excise rates extended; surplus $3.4 billion, after $2.4 billion in 1969 and a deficit of $25.2 billion in 1968. Jan. 16, the Economic Report: GNP up $71 billion in 1968 to $861 billion, 5 percent in real terms; unemployment 3.3 percent; "In some ways, 1968 was too big a year."'
    n: '[Annual Budget Message to the Congress, Fiscal Year 1970](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1970) (Jan. 15, 1969); [Annual Message to the Congress: The Economic Report of the President](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-economic-report-the-president-12) (Jan. 16, 1969). [[w.bernstein-guns-or-butter]]; [[w.morgan-deficit-government]]. See [[cal.1968-12-19.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1969-01-15.vietnam
    when: Jan. 15
    date: '1969-01-15'
    thread: vietnam-paris
    c: 'Paris. Vance and Hà Văn Lâu agree on procedures, Saigon concurring: the Soviet proposal, a round table, no nameplates or flags, two rectangular tables for secretaries.'
    n: 'FRUS 1964–68, VII, doc. [282](https://history.state.gov/historicaldocuments/frus1964-68v07/d282). [[w.herring-secret-diplomacy-of-the]]; [[w.asselin-bitter-peace]]; [[w.nguyen-hanois-war]]; [[w.kimball-nixons-vietnam-war]]. See [[cal.1968-12-03.vietnam]]. Names: Vance, Hà Văn Lâu.'
    tags: [name:vance-cyrus, name:ha-van-lau]

  - id: cal.1969-01-16.rules
    when: Jan. 16
    date: '1969-01-16'
    thread: rules
    also: [congress]
    c: 'Senate, Rule XXII. Cloture on Hart''s motion to take up S. Res. 11, cloture by three-fifths: [51–47](https://voteview.com/rollcall/RS0910004), short of two-thirds. Humphrey rules it carried, a majority enough to close debate on a change in the rules at a Congress''s opening; the Senate reverses him, [45–53](https://voteview.com/rollcall/RS0910005).'
    n: '[115 Cong. Rec. 994–95](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-10-1.pdf#page=21) (Senate, Jan. 16, 1969). [[w.binder-politics-or-principle]]; [[w.koger-filibustering]]. See [[cal.1967-01-18.rules]]. Names: Hart, Humphrey.'
    tags: [name:hart-philip-a, name:humphrey-hubert-h]
  - id: cal.1969-01-16.governors-ia
    when: Jan. 16
    date: '1969-01-16'
    thread: governors
    c: 'Iowa. Ray (R), elected Nov. 5 over Franzenburg (D), 54.1 percent, sworn in as governor.'
    n: 'General: [*Canvass of the Vote, General Election, November 5, 1968*](https://sos.iowa.gov/elections/pdf/results/60s/1968gencanv.pdf). See [[cal.1969-01-01.governors-ia]]. Names: Ray, Franzenburg.'
    tags: [state:ia, name:ray-robert-d, name:franzenburg-paul]

  - id: cal.1969-01-16.vietnam-paris
    when: Jan. 16
    date: '1969-01-16'
    thread: vietnam-paris
    c: 'Paris. The order of speaking, on Lâu''s offer: Saigon or the United States first, then reversed and rotated. Johnson: the third crisis of the negotiations solved, after the site and the bombing''s terms.'
    n: '[Statement by the President on the Peace Talks in Paris](https://www.presidency.ucsb.edu/documents/statement-the-president-the-peace-talks-paris) (Jan. 16, 1969); [The President''s News Conference at the National Press Club](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-national-press-club) (Jan. 17, 1969). FRUS 1964–68, VII, doc. [284](https://history.state.gov/historicaldocuments/frus1964-68v07/d284). See [[cal.1969-01-15.vietnam]]. Names: Hà Văn Lâu, Johnson.'
    tags: [name:ha-van-lau, name:johnson-lyndon-b]

  - id: cal.1969-01-17.congress
    when: Jan. 17
    date: '1969-01-17'
    thread: congress
    c: 'Message on salaries, under the Federal Salary Act of 1967: the Kappel Commission''s scale for the top officials, Chief Justice $62,500, the Associate Justices and the Cabinet $60,000; for Members of Congress $42,500, not the commission''s $50,000, on the leaders advice. In effect unless Congress disapproves (Check the terms).'
    n: '[Special Message to the Congress Recommending Salary Reforms for Top Officials in the Executive, Legislative, and Judicial Branches](https://www.presidency.ucsb.edu/documents/special-message-the-congress-recommending-salary-reforms-for-top-officials-the-executive) (Jan. 17, 1969). See [[cal.1964-08-14.congress]]. Names: Kappel, Johnson.'
    tags: [name:kappel-frederick-r, name:johnson-lyndon-b]
  - id: cal.1969-01-17.cities-and-housing
    when: Jan. 17–18
    date: '1969-01-17'
    thread: cities-and-housing
    c: 'Jan. 17, the first annual report on the national housing goals: 26 million units built or rehabilitated in ten years, 6 million for low- and moderate-income families. Jan. 18, the report of the Presidents Committee on Urban Housing, Kaiser its chairman, *A Decent Home*: its National Housing Partnership already enacted in the Housing Act of 1968.'
    n: '[Message to the Congress Transmitting First Annual Report on National Housing Goals](https://www.presidency.ucsb.edu/documents/message-the-congress-transmitting-first-annual-report-national-housing-goals) (Jan. 17, 1969); [Statement by the President Upon Receiving Report of the President''s Committee on Urban Housing](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-receiving-report-the-presidents-committee-urban-housing) (Jan. 18, 1969). [[w.housing-decent-home|full]]. See [[cal.1967-01-12.cities-and-housing]]. Names: Kaiser, Johnson.'
    tags: [name:kaiser-edgar-f, name:johnson-lyndon-b]
  - id: cal.1969-01-17.economy
    when: Jan. 17
    date: '1969-01-17'
    thread: economy
    c: 'Barr to the Joint Economic Committee: 155 taxpayers with incomes over $200,000, 21 of them over $1 million, paid no federal income tax in 1967; a "taxpayers'' revolt" ahead (Check the figures and the words).'
    n: 'Check: *The 1969 Economic Report of the President: Hearings Before the Joint Economic Committee*, 91st Cong., 1st Sess., pt. 1. See [[cal.1968-12-31.economy]]. Names: Barr.'
    tags: [name:barr-joseph-w]

  - id: cal.1969-01-18.vietnam-paris
    when: Jan. 18
    date: '1969-01-18'
    thread: vietnam-paris
    c: 'Paris. The first procedural meeting, at the Majestic: Nguyễn Xuân Phong for Saigon, Vance, Nguyễn Thị Bình for the NLF, Lâu. The first plenary session set for Jan. 25, Lodge for the United States.'
    n: 'FRUS 1964–68, VII, doc. [286](https://history.state.gov/historicaldocuments/frus1964-68v07/d286). See [[cal.1969-01-15.vietnam]]. Names: Nguyễn Xuân Phong, Vance, Nguyễn Thị Bình, Hà Văn Lâu, Lodge.'
    tags: [name:nguyen-xuan-phong, name:vance-cyrus, name:nguyen-thi-binh, name:ha-van-lau, name:lodge-henry-cabot]

  - id: cal.1969-01-20.conservation
    when: Jan. 20
    date: '1969-01-20'
    thread: conservation
    c: 'Johnson''s last proclamations: Marble Canyon National Monument, Arizona, established; Arches and Capitol Reef in Utah and Katmai in Alaska enlarged. Udall''s further proposals, over 7 million acres, the Sonoran Desert and Alaska among them, sent to Congress''s Interior committees instead: their taking "would strain the Antiquities Act far beyond its intent."'
    n: '[Statement by the President Upon Signing Five Proclamations Adding Lands to the National Park System](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-five-proclamations-adding-lands-the-national-park) (Jan. 20, 1969); [Proclamation 3889—Establishing Marble Canyon National Monument, Arizona](https://www.presidency.ucsb.edu/documents/proclamation-3889-establishing-marble-canyon-national-monument-arizona) (Jan. 20, 1969); [Proclamation 3887—Enlarging the Arches National Monument, Utah](https://www.presidency.ucsb.edu/documents/proclamation-3887-enlarging-the-arches-national-monument-utah) (Jan. 20, 1969); [Proclamation 3888—Enlarging the Capitol Reef National Monument, Utah](https://www.presidency.ucsb.edu/documents/proclamation-3888-enlarging-the-capitol-reef-national-monument-utah) (Jan. 20, 1969); [Proclamation 3890—Enlarging the Katmai National Monument, Alaska](https://www.presidency.ucsb.edu/documents/proclamation-3890-enlarging-the-katmai-national-monument-alaska) (Jan. 20, 1969). [[w.smith-stewart-l-udall]]; [[w.gould-lady-bird-johnson-and]]. Names: Johnson, Udall.'
    tags: [name:johnson-lyndon-b, name:udall-stewart-l, state:az, state:ut, state:ak]
  - id: cal.1969-01-20.court
    when: Jan. 20
    date: '1969-01-20'
    thread: court
    also: [open-housing]
    c: '*Hunter v. Erickson*, [393 U.S. 385](https://tile.loc.gov/storage-services/service/ll/usrep/usrep393/usrep393385/usrep393385.pdf): Akron''s charter amendment of 1964, no fair housing ordinance to take effect without the voters approval, a denial of equal protection. White for the Court, 8–1: it "places special burdens on racial minorities within the governmental process." Black dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]. See [[cal.1964-11-03.open-housing-akron]]. Names: White.'
    tags: [name:white-byron-r, state:oh, city:akron]
  - id: cal.1969-01-20.transition-and-staff
    when: Jan. 20
    date: '1969-01-20'
    thread: transition-and-staff
    c: 'Inauguration. Warren gives Nixon the oath at the Capitol''s east front. The Inaugural Address: "The greatest honor history can bestow is the title of peacemaker"; "an era of negotiation"; "we cannot learn from one another until we stop shouting at one another." The Senate confirms the Cabinet but Hickel (Check). Johnson to Texas.'
    n: '[Inaugural Address](https://www.presidency.ucsb.edu/documents/inaugural-address-1) (Jan. 20, 1969); [Oath of Office Administered by Chief Justice Earl Warren](https://www.presidency.ucsb.edu/documents/oath-office-administered-chief-justice-earl-warren) (Jan. 20, 1969). [[w.reeves-president-nixon]]; [[w.small-presidency-of-richard-nixon]]; [[w.safire-before-the-fall]]; [[w.christian-president-steps-down]]; [[w.johnson-vantage-point]]. See [[cal.1968-12-11.transition-and-staff]]. Names: Warren, Nixon, Hickel, Johnson.'
    tags: [executive:1969-01-20, name:warren-earl, name:nixon-richard-m, name:hickel-walter-j, name:johnson-lyndon-b, name:agnew-spiro-t]
  - id: cal.1969-01-20.transition-and-staff-nsc
    when: Jan. 20
    date: '1969-01-20'
    thread: transition-and-staff-nsc
    c: 'NSDM 1 and 2: the new NSC system in force.'
    n: 'FRUS 1969–76, II, docs. [10](https://history.state.gov/historicaldocuments/frus1969-76v02/d10), [11](https://history.state.gov/historicaldocuments/frus1969-76v02/d11). See [[cal.1968-12-27.transition-and-staff]]. Names: Nixon.'
    tags: [name:nixon-richard-m]

  - id: cal.1969-01.state-constitutions-va
    when: Jan.
    date: 1969-01
    thread: state-constitutions
    c: 'Virginia. The Commission on Constitutional Revision, appointed by Godwin in 1968, Albertis Harrison, governor 1962–66, its chairman, presents its report and a revised constitution to Godwin at Williamsburg, Va.: the ban on State debt eased; the schools a duty of the State, under standards of quality. To the General Assembly in special session, 1969.'
    n: '[University of Virginia Law Library, papers of A. E. Dick Howard, the Commission''s executive director](https://archives.law.virginia.edu/resources/register-papers-e-dick-howard-virginia-commission-constitutional-revision). Check: the report''s date, *The Constitution of Virginia: Report of the Commission on Constitutional Revision* (Jan. 1969), and its proposals. [[w.howard-commentaries-on-the-constitution]]. See [[cal.1968-11-05.state-and-city-finance-va]]. Names: Godwin, Harrison.'
    tags: [state:va, name:godwin-mills-e-jr, name:harrison-albertis-s-jr]
