list: cal
section: CXI
entries:
  - id: cal.1969-01-01.governors-ia
    when: Jan. 1–16
    date: '1969-01-01'
    thread: governors
    c: Iowa. Hughes, elected to the Senate, resigns as governor, Jan. 1; Fulton, the lieutenant governor, governor for sixteen days. Ray (R), elected Nov. 5 over Franzenburg (D), 54.1 percent, sworn Jan. 16.
    n: '[Wikipedia, "Harold Hughes"](https://en.wikipedia.org/wiki/Harold_Hughes); [Wikipedia, "Robert D. Fulton"](https://en.wikipedia.org/wiki/Robert_D._Fulton); general: [*Canvass of the Vote, General Election, November 5, 1968*](https://sos.iowa.gov/elections/pdf/results/60s/1968gencanv.pdf). Check: the *Iowa Official Register*, 1969–70. See [[cal.1968-09-03.governors-ia]]. Names: Hughes, Fulton, Ray, Franzenburg.'
    tags: [state:ia, name:hughes-harold-e, name:fulton-robert-d, name:ray-robert-d, name:franzenburg-paul]
  - id: cal.1969-01-03.congress
    when: Jan. 3
    date: '1969-01-03'
    thread: congress
    also: [rules]
    c: 'The 91st Congress convenes. Senate 57 D–43 R; House 243 D–192 R. Jan. 2, the House Democratic caucus: McCormack over Udall for Speaker, 178–58. McCormack Speaker over Ford, [241–187](https://voteview.com/rollcall/RH0910001). Powell, re-elected in November: the previous question on seating him without conditions refused, [176–248](https://voteview.com/rollcall/RH0910002); a special committee refused, [131–291](https://voteview.com/rollcall/RH0910004); H. Res. 2 adopted, [254–158](https://voteview.com/rollcall/RH0910006): sworn, fined $25,000, $1,150 a month taken from his salary until it is paid, his seniority from the oath.'
    n: '[115 Cong. Rec., House, Jan. 3, 1969](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-2.pdf); [115 Cong. Rec., Senate, Jan. 3, 1969](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-1.pdf). [[w.nelson-john-william-mccormack]]; [[w.udall-too-funny-to-be]]; [[w.hamilton-adam-clayton-powell-jr]]; [[w.haygood-king-of-the-cats]]. See [[cal.1967-01-10.rules]]; [[cal.1967-04-11.specials]]. Names: McCormack, Udall, Ford, Powell.'
    tags: [congress:91, name:mccormack-john-w, name:udall-morris-k, name:ford-gerald-r, name:powell-adam-clayton-jr]
  - id: cal.1969-01-03.congress-2
    when: Jan. 3
    date: '1969-01-03'
    thread: congress
    c: 'The Senate Democrats: Edward Kennedy majority whip over Russell Long, 31–26; Mansfield re-elected leader. The Republicans: Dirksen leader; Scott whip over Hruska (Check the count).'
    n: '[[w.clymer-edward-m-kennedy]]. See [[cal.1969-01-03.congress]]. Names: Kennedy, Long, Mansfield, Dirksen, Scott, Hruska.'
    tags: [name:kennedy-edward-m, name:long-russell-b, name:mansfield-mike, name:dirksen-everett, name:scott-hugh-d-jr, name:hruska-roman-l]
  - id: cal.1969-01-05.vietnam
    when: Jan. 5
    date: '1969-01-05'
    thread: vietnam
    also: [transition-and-staff]
    c: Nixon names Lodge to succeed Harriman at the head of the delegation to Paris, Walsh his deputy (Check the day).
    n: '[[w.blair-lodge-in-vietnam]]; [[w.kimball-nixons-vietnam-war]]. See [[cal.1968-05-13.vietnam]]. Names: Nixon, Lodge, Harriman, Walsh.'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:harriman-w-averell, name:walsh-lawrence-e]
  - id: cal.1969-01-06.elections-1968
    when: Jan. 6
    date: '1969-01-06'
    thread: elections-1968
    c: 'Electoral votes counted in joint session, Humphrey presiding. North Carolina: Bailey of Rocky Mount, N.C., on the Nixon slate, voted Dec. 16 for Wallace and LeMay. Muskie and OHara object in writing; the houses apart. The House rejects the objection, [170–228]({VV("H",7)}); the Senate, [33–58]({VV("S",1)}). Nixon 301, Humphrey 191, Wallace 46; for Vice President, Agnew 301, Muskie 191, LeMay 46. Nixon and Agnew declared elected.'
    n: '[115 Cong. Rec. 145–172](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-2-1.pdf) (House); [115 Cong. Rec., Senate, Jan. 6, 1969](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-2-2.pdf). [[w.longley-politics-of-electoral-college]]; [[w.peirce-peoples-president]]. See [[cal.1968-11-05.elections-1968]]. Names: Humphrey, Bailey, Wallace, LeMay, Muskie, OHara, Nixon, Agnew.'
    tags: [name:humphrey-hubert-h, name:bailey-lloyd-w, name:wallace-george-c, name:lemay-curtis-e, name:muskie-edmund-s, name:ohara-james-g, name:nixon-richard-m, name:agnew-spiro-t, state:nc]
  - id: cal.1969-01-09.testing
    when: Jan. 9
    date: '1969-01-09'
    thread: testing
    c: 'Johnson, through the acting press secretary: "increasingly concerned" at the delay in ratifying the nonproliferation treaty, before the Senate since July. Jan. 14, the State of the Union: delay "not going to be helpful to the cause of peace."'
    n: '[Statement by the Acting Press Secretary Expressing the President''s Concern for Early Ratification of the Nuclear Nonproliferation Treaty](https://www.presidency.ucsb.edu/documents/statement-the-acting-press-secretary-expressing-the-presidents-concern-for-early) (Jan. 9, 1969). [[w.seaborg-stemming-the-tide]]. See [[cal.1966-10-10.soviet-union]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1969-01-14.program
    when: Jan. 14
    date: '1969-01-14'
    thread: program
    c: 'State of the Union, to a joint session, "for the sixth and the last time." Asked: social security up at least 13 percent, the minimum from $55 to $80 a month; medical care for expectant mothers and infants; the poverty program reorganized, not crippled; the Voting Rights Acts main provisions extended five years; the full $300 million for the Safe Streets grants; licensing and registration of firearms; the postal system reorganized on the Kappel report; Members pay $42,500, not the commissions $50,000; the draft by random selection. A surplus of $2.4 billion in fiscal 1969, $3.4 billion in 1970, the surtax extended, Nixon agreeing. The nonproliferation treaty ratified; the missile talks resumed. "At least it will be said that we tried."'
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-30) (Jan. 14, 1969). [[w.zelizer-fierce-urgency-of-now]]; [[w.dallek-flawed-giant]]; [[w.califano-triumph-and-tragedy-of]]; [[w.johnson-vantage-point]]. See [[cal.1968-01-17.program]]. Names: Johnson, Kappel, Nixon.'
    tags: [name:johnson-lyndon-b, name:kappel-frederick-r, name:nixon-richard-m]
    short: State of the Union
    to:
      - economy
      - vietnam
      - congress
      - cities-and-housing
  - id: cal.1969-01-15.economy
    when: Jan. 15–16
    date: '1969-01-15'
    thread: economy
    c: 'Budget for fiscal 1970: outlays $195.3 billion, receipts $198.7 billion with the income tax surcharge and the excise rates extended; surplus $3.4 billion, after $2.4 billion in 1969 and a deficit of $25.2 billion in 1968. Jan. 16, the Economic Report: GNP up $71 billion in 1968 to $861 billion, 5 percent in real terms; unemployment 3.3 percent; "In some ways, 1968 was too big a year."'
    n: '[Annual Budget Message to the Congress, Fiscal Year 1970](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1970) (Jan. 15, 1969); [Annual Message to the Congress: The Economic Report of the President](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-economic-report-the-president-12) (Jan. 16, 1969). [[w.bernstein-guns-or-butter]]; [[w.morgan-deficit-government]]. See [[cal.1968-12-19.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1969-01-15.vietnam
    when: Jan. 15–25
    date: '1969-01-15'
    thread: vietnam
    c: 'Paris. Jan. 15, Vance and Hà Văn Lâu agree on procedures, Saigon concurring: the Soviet proposal, a round table, no nameplates or flags, two rectangular tables for secretaries. The order of speaking: on Lâus offer, Jan. 16, Saigon or the United States first, then reversed and rotated. Jan. 16, Johnson: the third crisis of the negotiations solved, after the site and the bombings terms. Jan. 18, the first procedural meeting, at the Majestic: Nguyễn Xuân Phong for Saigon, Vance, Nguyễn Thị Bình for the NLF, Lâu. Jan. 25, the first plenary session, Lodge for the United States.'
    n: '[Statement by the President on the Peace Talks in Paris](https://www.presidency.ucsb.edu/documents/statement-the-president-the-peace-talks-paris) (Jan. 16, 1969); [The President''s News Conference at the National Press Club](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-national-press-club) (Jan. 17, 1969). FRUS 1964–68, VII, docs. [282](https://history.state.gov/historicaldocuments/frus1964-68v07/d282), [284](https://history.state.gov/historicaldocuments/frus1964-68v07/d284), [286](https://history.state.gov/historicaldocuments/frus1964-68v07/d286). [[w.herring-secret-diplomacy-of-the]]; [[w.asselin-bitter-peace]]; [[w.nguyen-hanois-war]]; [[w.kimball-nixons-vietnam-war]]. See [[cal.1968-05-13.vietnam]]. Names: Vance, Hà Văn Lâu, Johnson, Nguyễn Xuân Phong, Nguyễn Thị Bình, Lodge.'
    tags: [name:vance-cyrus, name:ha-van-lau, name:johnson-lyndon-b, name:nguyen-xuan-phong, name:nguyen-thi-binh, name:lodge-henry-cabot]
  - id: cal.1969-01-16.rules
    when: Jan. 16
    date: '1969-01-16'
    thread: rules
    also: [congress]
    c: 'Senate, Rule XXII. Cloture on Harts motion to take up S. Res. 11, cloture by three-fifths: [51–47]({VV("S",4)}), short of two-thirds. Humphrey rules it carried, a majority enough to close debate on a change in the rules at a Congresss opening; the Senate reverses him, [45–53]({VV("S",5)}).'
    n: '[[w.binder-politics-or-principle]]; [[w.koger-filibustering]]. See [[cal.1967-01-18.rules]]. Names: Hart, Humphrey.'
    tags: [name:hart-philip-a, name:humphrey-hubert-h]
  - id: cal.1969-01-17.congress
    when: Jan. 17
    date: '1969-01-17'
    thread: congress
    c: 'Message on salaries, under the Federal Salary Act of 1967: the Kappel Commissions scale for the top officials, Chief Justice $62,500, the Associate Justices and the Cabinet $60,000; for Members of Congress $42,500, not the commissions $50,000, on the leaders advice. In effect unless Congress disapproves (Check the terms).'
    n: '[Special Message to the Congress Recommending Salary Reforms for Top Officials in the Executive, Legislative, and Judicial Branches](https://www.presidency.ucsb.edu/documents/special-message-the-congress-recommending-salary-reforms-for-top-officials-the-executive) (Jan. 17, 1969). See [[cal.1964-08-14.congress]]. Names: Kappel, Johnson.'
    tags: [name:kappel-frederick-r, name:johnson-lyndon-b]
  - id: cal.1969-01-17.cities-and-housing
    when: Jan. 17–18
    date: '1969-01-17'
    thread: cities-and-housing
    c: 'Jan. 17, the first annual report on the national housing goals: 26 million units built or rehabilitated in ten years, 6 million for low- and moderate-income families. Jan. 18, the report of the Presidents Committee on Urban Housing, Kaiser its chairman, *A Decent Home*: its National Housing Partnership already enacted in the Housing Act of 1968.'
    n: '[Message to the Congress Transmitting First Annual Report on National Housing Goals](https://www.presidency.ucsb.edu/documents/message-the-congress-transmitting-first-annual-report-national-housing-goals) (Jan. 17, 1969); [Statement by the President Upon Receiving Report of the President''s Committee on Urban Housing](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-receiving-report-the-presidents-committee-urban-housing) (Jan. 18, 1969). [[w.housing-decent-home|full]]. See [[cal.1967-01-12.cities-and-housing]]. Names: Kaiser, Johnson.'
    tags: [name:kaiser-edgar-f, name:johnson-lyndon-b]
  - id: cal.1969-01-20.conservation
    when: Jan. 20
    date: '1969-01-20'
    thread: conservation
    c: 'Johnsons last proclamations: Marble Canyon National Monument, Arizona, established; Arches and Capitol Reef in Utah and Katmai in Alaska enlarged. Udalls further proposals, over 7 million acres, the Sonoran Desert and Alaska among them, sent to Congresss Interior committees instead: their taking "would strain the Antiquities Act far beyond its intent."'
    n: '[Statement by the President Upon Signing Five Proclamations Adding Lands to the National Park System](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-five-proclamations-adding-lands-the-national-park) (Jan. 20, 1969); [Proclamation 3889—Establishing Marble Canyon National Monument, Arizona](https://www.presidency.ucsb.edu/documents/proclamation-3889-establishing-marble-canyon-national-monument-arizona) (Jan. 20, 1969); [Proclamation 3887—Enlarging the Arches National Monument, Utah](https://www.presidency.ucsb.edu/documents/proclamation-3887-enlarging-the-arches-national-monument-utah) (Jan. 20, 1969); [Proclamation 3888—Enlarging the Capitol Reef National Monument, Utah](https://www.presidency.ucsb.edu/documents/proclamation-3888-enlarging-the-capitol-reef-national-monument-utah) (Jan. 20, 1969); [Proclamation 3890—Enlarging the Katmai National Monument, Alaska](https://www.presidency.ucsb.edu/documents/proclamation-3890-enlarging-the-katmai-national-monument-alaska) (Jan. 20, 1969). [[w.smith-stewart-l-udall]]; [[w.gould-lady-bird-johnson-and]]. Names: Johnson, Udall.'
    tags: [name:johnson-lyndon-b, name:udall-stewart-l, state:az, state:ut, state:ak]
  - id: cal.1969-01-20.court
    when: Jan. 20
    date: '1969-01-20'
    thread: court
    also: [open-housing]
    c: '*Hunter v. Erickson*, [393 U.S. 385](https://tile.loc.gov/storage-services/service/ll/usrep/usrep393/usrep393385/usrep393385.pdf): Akrons charter amendment of 1964, no fair housing ordinance to take effect without the voters approval, a denial of equal protection. White for the Court, 8–1: it "places special burdens on racial minorities within the governmental process." Black dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]. See [[cal.1964-11-03.open-housing-akron]]. Names: White.'
    tags: [name:white-byron-r, state:oh, city:akron]
  - id: cal.1969-01-20.transition-and-staff
    when: Jan. 20
    date: '1969-01-20'
    thread: transition-and-staff
    c: 'Inauguration. Warren gives Nixon the oath at the Capitols east front. The Inaugural Address: "The greatest honor history can bestow is the title of peacemaker"; "an era of negotiation"; "we cannot learn from one another until we stop shouting at one another." The Senate confirms the Cabinet but Hickel (Check). Johnson to Texas.'
    n: '[Inaugural Address](https://www.presidency.ucsb.edu/documents/inaugural-address-1) (Jan. 20, 1969); [Oath of Office Administered by Chief Justice Earl Warren](https://www.presidency.ucsb.edu/documents/oath-office-administered-chief-justice-earl-warren) (Jan. 20, 1969). [[w.reeves-president-nixon]]; [[w.small-presidency-of-richard-nixon]]; [[w.safire-before-the-fall]]; [[w.christian-president-steps-down]]; [[w.johnson-vantage-point]]. See [[cal.1968-12-11.transition-and-staff]]. Names: Warren, Nixon, Hickel, Johnson.'
    tags: [executive:1969-01-20, name:warren-earl, name:nixon-richard-m, name:hickel-walter-j, name:johnson-lyndon-b, name:agnew-spiro-t]
