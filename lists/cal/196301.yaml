  - id: cal.1963-01-08.china
    when: Jan. 8
    date: '1963-01-08'
    thread: china
    also: [south-asia]
    c: China and Ceylon issue a joint communique on Prime Minister Bandaranaike's visit. Ceylon holds that China's unilateral cease-fire and withdrawal show its sincerity in seeking a peaceful settlement of the Sino-Indian boundary dispute. China thanks Ceylon for its efforts and welcomes the cooperative attitude of the six states. The two prime ministers agree that, in the interest of Afro-Asian unity and world peace, direct talks between China and India should not be delayed. The Colombo conference's proposals offer a preliminary basis, and this does not prejudice any reservation either side may discuss and settle through negotiation.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 263–264 (Jan. 8, 1963). Names: Bandaranaike.'
    src:
      c: 7e180219
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 263–264: all'
    tags: [polity:prc, polity:ceylon, polity:india, name:bandaranaike-srimavo]
  - id: cal.1963-01-08.china-2
    when: Jan. 8
    date: '1963-01-08'
    thread: china
    also: [south-asia, indonesia]
    c: China and Indonesia issue a joint communique on Subandrio's visit. Indonesia values the unilateral cease-fire and withdrawal China has taken since the armed conflict on the Sino-Indian boundary, which show China's sincerity in seeking a peaceful settlement. China values the Colombo conference's effort to bring the two sides back to the negotiating table. Both agree that, for Asian–African unity, a settlement must be sought urgently and without delay in the spirit of Bandung. Indonesia again supports the Chinese people's struggle to recover Taiwan and thanks China for its support of Indonesia's struggle over West Irian.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 265 (Jan. 8, 1963). Names: Subandrio.'
    src:
      c: 3865d47f
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 265: all'
    tags: [polity:prc, polity:indonesia, polity:india, name:subandrio]
