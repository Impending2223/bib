    when: '1963'
    date: '1963'
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Quảng Ngãi. Battalion 95 of Regiment 2, with a sapper unit, attacks the Long Lếch strongpoint, west of Gia Vụt, and destroys an infantry company and an artillery platoon of the Saigon army, by the history's count.
    n: '[[w.lich-su-khang-chien-chong-my]], III, 249. Check: the day; the history puts it at the time of the liberation of Phổ An and Phổ Quang, which it dates elsewhere to Apr. 28, and after the coup of November.'
    tags: [polity:drv, ok:fields-place]
