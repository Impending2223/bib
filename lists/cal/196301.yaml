  - id: cal.1963-01-14.program
    when: Jan. 14
    date: '1963-01-14'
    thread: program
    also: [economy]
    c: 'State of the Union. A tax cut of $13.5 billion, $10 billion net of reforms, over three years: individual rates 14 to 65 percent, from 20 to 91; corporate 47, from 52. Youth, a domestic service corps, education, hospital insurance through Social Security, counsel for poor defendants in federal courts, the vote.'
    n: 'Annual Message to the Congress on the State of the Union, [1963 Pub. Papers 11](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=69) (Jan. 14, 1963). [109 Cong. Rec., House, Jan. 14, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-1.pdf). To check: [[w.sorensen-kennedy]]; [[w.bernstein-promises-kept]]; [[w.giglio-presidency-of-john-f]]; [[w.sundquist-politics-and-policy]]. See [[cal.1962-01-11.program]].'
