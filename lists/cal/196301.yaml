    at: before 1963-01
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Military Region 4. In early 1963, on the region''s direction, the armed forces of Nghệ An, Hà Tĩnh and Quảng Bình open a drive to "build the reserve force": better militia, self-defense and local troops, and the registering and training of reservists. At Vĩnh Linh, on the line with the South, the Party committee and the Region command order vigilance and readiness without answering provocation.'
    n: '[[w.lich-su-khang-chien-chong-my]], III, 116. Check: the day.'
    tags: [polity:drv, ok:fields-place]
  - id: cal.1963.vietnam-hanoi-10
