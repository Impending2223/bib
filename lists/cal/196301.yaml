        - 'via w.branch-parting-the-waters 688 n.2: D'
    tags: [name:kennedy-john-f, name:wicker-tom, name:castro-fidel, name:guevara-ernesto]
  - id: cal.1963-01-01.voting-rights
    when: Jan. 1
    date: '1963-01-01'
    thread: voting-rights
    also: [mississippi, robert-kennedy]
    c: 'Moses, Sam Block, Hollis Watkins and other SNCC workers sue Robert Kennedy and Hoover in Washington, with King''s endorsement and the Gandhi Society''s support: an injunction to enforce six criminal sections against intimidating voters. The suit "does not reflect any antipathy toward the defendants"; their powers "immeasurably greater than they possibly realize." The Department has it thrown out.'
    n: '[[w.branch-parting-the-waters]], 712–13. To check: the complaint, as printed in the hearings of House Judiciary Subcommittee No. 5, May 28, 1963, 1278–81 (cited by [[w.branch-parting-the-waters]], 712 n.4); the plaintiffs'' statement, Jan. 1, 1963, SCLC Papers, box 35 (cited by [[w.branch-parting-the-waters]], 713 n.1). Check: the day of dismissal. Names: Moses, Robert Kennedy, Hoover, Martin Luther King.'
    src:
      c: 40c202ac
      rows:
        - 'w.branch-parting-the-waters 712–13: all'
        - 'via w.branch-parting-the-waters 712 n.4: A'
        - 'via w.branch-parting-the-waters 713 n.1: B'
