  - id: cal.1963-01-10.alabama-birmingham
    when: Jan. 10–11
    date: '1963-01-10'
    thread: alabama-birmingham
    also: [king, civil-rights-organizations]
    c: 'Dorchester, near Savannah, Ga. King''s secret planning retreat for Birmingham, SCLC''s board left out: King, Walker, Shuttlesworth, Lowery, Abernathy, Andrew Young, Dorothy Cotton, Clarence Jones, O''Dell, Levison and Lawson. Walker''s Project C, in four stages: sit-ins and nightly mass meetings; a boycott of downtown; mass marches to fill the jails; outsiders called in. A thousand in jail at once, five or six days each; code names, King "JFK." O''Dell: $25,000 net in the last quarter of 1962, mailings of 200,000; no postponement for a fund-raising tour. King: "some of the people sitting here today will not come back alive from this campaign." Jones''s call to Levison to arrange it alerts the FBI.'
    n: '[[w.branch-parting-the-waters]], 688–92; [[w.kotz-judgment-days]], 55 (Project C; King "JFK," Abernathy "Dean Rusk," Shuttlesworth "Mac," Walker "RFK"); [[w.kotz-judgment-days]], 78 (Levison with King at a secret SCLC meeting outside Savannah, against the President''s advice that King break with him; no date given). To check: [[w.garrow-fbi-and-martin-luther]], 57–59; [[w.schlesinger-robert-kennedy-and-his]], 352–53; interviews: James Lawson, Nov. 14, 1983; Wyatt Walker, Aug. 20, 1984; Clarence Jones, Nov. 25, 1983; Jack O''Dell, July 1, 1986 (cited by [[w.branch-parting-the-waters]], 688 n.4). Names: Martin Luther King, Shuttlesworth, Abernathy, Andrew Young, O''Dell, Levison, Lawson.'
