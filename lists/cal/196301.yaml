    date: '1963-01-10'
    place: washington
    thread: program
    c: 'The White House, dinner with Joseph and Susan Mary Alsop, Lee Radziwill and Schlesinger and his wife, by Schlesinger''s journal. Kennedy on his talk the night before with Malraux: the talk of European nuclear deterrents and a multilateral force rested on the expectation of a Soviet attack on Europe, "than which nothing is less likely." "What matters ... is the strength of the currency. It is this, and not its nuclear weapons, which makes France a factor." People should be thinking of the Far East and a Chinese nuclear capability.'
    n: '[[w.schlesinger-journals]], 185–86. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Alsop, Schlesinger, Malraux.'
