  - id: cal.1963-01-02.vietnam
    when: Jan. 2
    date: '1963-01-02'
    thread: vietnam
    c: Ấp Bắc. The ARVN 7th Division, with American helicopters and advisers, fails against a Viet Cong battalion. Five helicopters down; three Americans killed. Vann briefs Halberstam and Sheehan; Harkins calls it a victory. Hilsman and Forrestal in Saigon.
    n: 'FRUS 1961–63, III, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v03/d1), [5](https://history.state.gov/historicaldocuments/frus1961-63v03/d5). [[w.miller-misalliance]], 250–52 (the battle: two battalions against some 1,500, fourteen helicopters destroyed or damaged; Vann''s charges to the reporters); [[w.gibbons-u-s-government-and]], II, 135; [[w.vietnam-victory-in-vietnam]], 118–20, 460 n.50 (the battle; the 7th Division''s sweep under American advisers beaten off); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 281–82 (the battle; Vann and the press); [[w.schulimson-joint-chiefs-of-staff]], 277–280 (the battle; Vann and the reporters); [[w.nguyen-hanois-war]], 62 (the battle; Hanoi''s reading of it); [[w.asselin-hanois-road-to-the]], 151–52 (the same). To check: [[w.toczek-battle-of-ap-bac]]; [[w.sheehan-bright-shining-lie]]; [[w.halberstam-making-of-a-quagmire]]; CINCPAC''s message of Jan. 8, 1963, OSD Hist., and the *Washington Post*, Jan. 4, 1963 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 282 n.82). See [[cal.1961-01-28.vietnam]]. Names: Vann, Harkins, Huỳnh Văn Cao, Halberstam, Sheehan, Hilsman, Forrestal. Check: *Victory in Vietnam* counts the attackers'' losses at 450, nine Americans among them, with sixteen aircraft shot down or badly damaged and three M-113s and a boat destroyed; the defenders two companies and a district platoon, the sweep eight battalions (119–20, 460 n.50).'
    src:
      c: 6576473d
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d1: all'
        - 'w.gibbons-u-s-government-and II, 135: all'
