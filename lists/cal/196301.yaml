    date: '1963'
    at: before 1963-09
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Military Region 4. By the end of 1963 the region completes its three basic lines of defense: the demarcation line, the coast and the Vietnam–Laos border.'
    n: '[[w.lich-su-khang-chien-chong-my]], III, 116. Check: the day.'
