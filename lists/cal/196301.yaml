  - id: cal.1963-01-02.vietnam
    when: Jan. 2
    date: '1963-01-02'
    place: ap-bac
    thread: vietnam
    c: Ấp Bắc. The ARVN 7th Division, with American helicopters and advisers, fails against a Viet Cong battalion. Five helicopters down; three Americans killed. Vann briefs Halberstam and Sheehan; Harkins calls it a victory. Hilsman and Forrestal in Saigon.
    n: 'FRUS 1961–63, III, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v03/d1), [5](https://history.state.gov/historicaldocuments/frus1961-63v03/d5). [[w.miller-misalliance]], 250–52 (the battle: two battalions against some 1,500, fourteen helicopters destroyed or damaged; Vann''s charges to the reporters); [[w.gibbons-u-s-government-and]], II, 135 (the battle during Hilsman''s and Forrestal''s trip, a "stunning defeat" by Hilsman''s account); [[w.vietnam-victory-in-vietnam]], 118–20, 460 n.50 (the battle; the 7th Division''s sweep under American advisers beaten off); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 281–82 (the battle; Vann and the press); [[w.schulimson-joint-chiefs-of-staff]], 277–280 (the battle; Vann and the reporters); [[w.nguyen-hanois-war]], 62 (the battle; Hanoi''s reading of it); [[w.asselin-hanois-road-to-the]], 151–52 (the same); [[w.moyar-triumph-forsaken]], 186–96 (186: some three to four hundred men of the 261st and 514th Battalions; 194: eighty government soldiers and three American advisers killed; 195: the five helicopters; 194–96: Vann''s account to the reporters); [[w.futrell-united-states-air-force]], 156–58; [[w.schulimson-joint-chiefs-of-staff]], 277 (the 7th Division''s operation against a suspected transmitter near Ấp Bắc); [[w.selverstone-kennedy-withdrawal]], 98 (Jan. 2: 1,200 ARVN troops and their advisers against about 340 guerrillas; over sixty ARVN and three Americans dead; downed U.S. helicopters; MACV deems it a success); [[w.lich-su-khang-chien-chong-my]], III, 215–36 (a company each of the 261st, Region 8''s main-force battalion, and the 514th, Mỹ Tho''s, with the village guerrillas; withdrawn at 10 p.m., the night of Jan. 2). [[w.reeves-president-kennedy]], 445–47. Check: Branch, 688, puts the loss of "eight of fifteen U.S. helicopters" on New Year''s Day ([*New York Times*, Jan. 2, 1963](https://timesmachine.nytimes.com/timesmachine/1963/01/02/issue.html)). To check: [[w.toczek-battle-of-ap-bac]]; [[w.sheehan-bright-shining-lie]]; [[w.halberstam-making-of-a-quagmire]]; CINCPAC''s message of Jan. 8, 1963, OSD Hist., and the *Washington Post*, Jan. 4, 1963 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 282 n.82); Vann, after action report, Jan. 9, 1963, LOC, Sheehan Papers, box 38 (cited by [[w.moyar-triumph-forsaken]], 194 n.22); *Washington Post*, Jan. 4 and 7, 1963 (cited by [[w.moyar-triumph-forsaken]], 195 n.26); [*New York Times*, Jan. 11, 1963](https://timesmachine.nytimes.com/timesmachine/1963/01/11/issue.html) (cited by [[w.moyar-triumph-forsaken]], 195 n.27); *New York Times*, Western ed., Jan. 7, 1963 (cited by [[w.moyar-triumph-forsaken]], 195 n.28); Joint Chiefs to Kennedy, "Resume of the 2 Jan 1963 GVN Ground/Heliborne Action," Jan. 3, 1963, Declassified Documents Reference System (1985), 909 (cited by [[w.reeves-president-kennedy]], 445); [*New York Times*, Jan. 3, 1963](https://timesmachine.nytimes.com/timesmachine/1963/01/03/issue.html); Marine Corps Emergency Action Center, "Summary of Items of Significant Interest," Jan. 2, 1963, Cuba papers, National Security Archive; John Paul Vann, interview, *U.S. News & World Report*, Sept. 16, 1963 (cited by [[w.reeves-president-kennedy]], 446). See [[cal.1961-01-28.vietnam]]. Names: Vann, Harkins, Huỳnh Văn Cao, Halberstam, Sheehan, Hilsman, Forrestal. Check: *Victory in Vietnam* counts the attackers'' losses at 450, nine Americans among them, with sixteen aircraft shot down or badly damaged and three M-113s and a boat destroyed; the defenders two companies and a district platoon, the sweep eight battalions (119–20, 460 n.50). Check: Moyar, 194–96, puts the Viet Cong''s dead above a hundred, by its estimate, and holds Vann''s account to the reporters misleading.'
