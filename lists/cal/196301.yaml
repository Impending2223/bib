    c: The Central Committee 中共中央 organizes an anti-revisionist leading group 中央反修領導小組, headed by the general secretary Deng Xiaoping 鄧小平, with Kang Sheng 康生, Wu Lengxi 吳冷西, Yao Zhen 姚臻, Xiong Fu 熊復, Wang Li 王力, Fan Ruoyu 范若愚 and Wu Jiang 吳江, to write the anti-revisionist articles. Lodged at the Diaoyutai 釣魚台 state guesthouse, it writes from Sept. 1963 to Mar. 1964 the nine articles that criticize "Khrushchev's revisionism" by name, the "nine commentaries."
    n: '[[w.yang-jisheng-mubei]], II, 1151. Made public: 2008. To check: the Central Committee''s anti-revisionist leading group, its members and term (named by [[w.yang-jisheng-mubei]], II, 1151; no note). The writing: [[cal.1963-07.china-leadership]]. Names: Deng Xiaoping, Kang Sheng. Check: the month, which the book does not give ("1963 ... the year of anti-revisionism"); and the members: [[w.lengxi-shinian-lunzhan-1956-1966]], 637–639, names Wu Lengxi, Qiao Guanhua, Yao Zhen, Fan Ruoyu and Wang Li as the drafting leaders, with Xiong Fu and Hu Sheng ill, and no Kang Sheng or Wu Jiang ([[cal.1963-07.china-leadership]]). The book prints Yao Zhen''s name 姚臻.'
