    tags: [polity:prc, polity:ghana, polity:india, name:zhou-enlai, name:chen-yi, vis:only:prc+ghana]
  - id: cal.1963-01-17.china-leadership-3
    when: Jan. 17
    date: '1963-01-17'
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: 'Peking. Liu Shaoqi calls the Politburo on the delegation''s cable from East Berlin: Khrushchev has named the CCP for the first time and asked for an end to open polemic, and the other speakers follow. It decides to change the delegation''s greeting, take the high line, speak for true unity against false and expose the trick of "stop the polemic." The delegation to speak whatever happens, with the text translated and printed beforehand and every Chinese in Berlin handing it round after.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 521–522 (Jan. 17, Liu Shaoqi''s Politburo; the delegation to expect interference, even interruption, and to have its text translated, typed and handed out from several places by the embassy, delegation, Xinhua and the students); [[w.yang-shangkun-riji]], II, 244 (Jan. 17, 1963; at Liu Shaoqi''s, 4:30 to 5:45 p.m., the document discussed that morning; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1742–1743 (Jan. 17, 1963; morning, 上午; Deng at the Politburo meeting Liu Shaoqi presides over, on the problems at the SED''s Sixth Congress; the meeting decides to revise the Chinese delegation''s address); [[w.mao-zedong-zhuan]], V, ch. 71 (Khrushchev names the Chinese party in public at the SED congress, Jan. 15–21; Liu in Peking decides that the delegation speak, stressing opposition to false unity, and that the writers draft a fourth reply; no day for Liu''s decision). Made public: 1999. Check: whether the Politburo meeting is the one at Liu Shaoqi''s of 4:30 to 5:45 p.m. in Yang Shangkun''s diary ([[w.yang-shangkun-riji]], II, 244), on the passage drafted that morning. Check: the nianpu puts the Politburo meeting in the morning (上午), Yang Shangkun''s diary at Liu Shaoqi''s from 4:30 to 5:45 p.m. ([[w.deng-xiaoping-nianpu-1904]], III, 1742–1743). Names: Liu Shaoqi, Khrushchev.'
