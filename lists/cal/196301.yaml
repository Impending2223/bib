  - id: cal.1963-01-01.china-leadership-2
    when: Jan. 1
    date: '1963-01-01'
    thread: china-leadership
    also: [south-asia]
    c: 'Zhou Enlai returns Bandaranaike''s call and talks with her. On China''s surroundings: China hopes Japanese militarism will not revive and Japan will be free of American control and friendly with Afro-Asia; it hopes for Sino-Indian friendship, Afro-Asian unity and peace in Asia; Afro-Asia should unite and sit down together, without imperialist meddling. He hopes that after her talks at Delhi with Ali Sabri of the UAR and Ghana''s Attorney General she will ask them on to China.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 523 (Jan. 1, 1963); [[w.zhou-enlai-waijiao-huodong]], 348 (Jan. 1, 1963; 下午, 前往宾馆回访并会谈); [[w.chen-yi-nianpu]], 949 (Jan. 1, 1963, afternoon; Chen Yi with Zhou on the return call at the guesthouse and in the talks). Footnote: Ali Sabri, then executive chairman of the UAR ministers'' conference. Made public: 1993. Names: Zhou Enlai, Srimavo Bandaranaike.'
    src:
      c: eace1d07
      rows:
