  - id: cal.1963-01-14.legislatures-wa
    when: Jan. 14
    date: '1963-01-14'
    thread: legislatures
    also: [states-and-cities, state-legislatures]
    c: Washington's House at the session's opening. Dissident Democrats and the Republicans elect Day speaker on the third ballot over O'Brien, speaker since 1955. *Thigpen v. Meyers*, [211 F. Supp. 826](https://static.case.law/f-supp/211/case-pdfs/0826-01.pdf) (W.D. Wash., Dec. 1962), had found the legislative districts invidiously discriminatory and left the session to redistrict. The regular session and a special session of 23 days pass no plan; in May the district court holds the districts void.
    n: '[Wash. Legislature, Oral History Program, "Redistricting: 1963"](https://app.leg.wa.gov/oralhistory/redistricting2/1960s/1963/); the number of Democrats, six there, eight in [Wikipedia, "Margaret Hurley (Washington politician)"](https://en.wikipedia.org/wiki/Margaret_Hurley_(Washington_politician)): Check. To check: [[w.dixon-democratic-representation]]. See [[cal.1962-11-06.state-constitutions-wa]]. Names: Day, O''Brien.'
