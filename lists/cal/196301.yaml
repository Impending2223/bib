    also: [south-asia]
    c: 'Zhou Enlai drafts the Chinese government''s memorandum to Ceylon''s Prime Minister: after talks China is ready to accept the six states'' proposals as a preliminary basis for a meeting of officials, on two understandings. A: its frontier forces withdraw 20 kilometers along the whole border, and the rule that India keep its present posts applies to the whole border, not the west only. B: withdrawing beyond the line of actual control of Nov. 7, 1959, they will leave places such as Chedong and Longju, Wuje and the 43 western posts empty of Chinese troops, and China will set up no civil checkposts there if India''s troops and civil staff stay out. Jan. 7 he writes a supplementary letter.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 6, 1963); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 263 (Dec. 31, 1962–Jan. 9, 1963; in the talks with Bandaranaike and Subandrio, Zhou says China in principle accepts the Colombo conference''s proposals as a preliminary basis for a meeting of officials to discuss a stable cease-fire and disengagement and to promote talks on the boundary, but with two explanations: the rule that the Indian army keep its present military positions is to apply to the whole boundary, not the west only; and where the Chinese frontier troops withdraw beyond the Nov. 7, 1959 line of actual control, China is willing to set up no civil checkposts, the Indian personnel no longer entering the eastern Chedong area and the Longju, Wuje and western posts; the talks'' days are not given). Made public: 1997. To check: the memorandum and the letter of Jan. 7. Names: Zhou Enlai, Srimavo Bandaranaike.'
