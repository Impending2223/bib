  - id: cal.1963-01-18.congress
    when: Jan. 18
    date: '1963-01-18'
    place: washington
    thread: congress
    also: [democratic-party]
    c: 'Mansfield''s committee of six Senate Democrats on the session''s schedule, at lunch: Monroney elected chairman; a schedule of recesses proposed. By unanimous vote it recommends that debate for four hours after the morning hour be germane to the pending business, and that committees may sit during sessions by majority vote.'
    n: '[[w.ritchie-minutes-of-the-senate]], 616–17 (Monroney''s report to the Senate Democratic Conference, Feb. 7, 1963, attached to its minutes). Names: Mansfield, Monroney.'
    tags: [name:mansfield-mike, name:monroney-almer-s]
  - id: cal.1963-01-18.congress-2
    when: Jan. 18
    date: '1963-01-18'
    time: 1963-01-18T20:10Z
    place: washington
    thread: congress
    also: [republican-party-congress]
    c: 'The Democrats'' committee on the schedule with the Republicans'', Mansfield''s office, from 3:10 p.m.; Monroney chosen chairman, Dirksen, Cotton and Cooper for the minority. Recesses agreed: Lincoln''s Birthday, Feb. 11–14; Easter, Apr. 11–19; Memorial Day; July 4. The summer recess put off until the House leaders are consulted. Dirksen "strongly opposed" the germaneness rule, Cotton too; Cotton and Cooper against committees sitting during sessions; the consensus approves neither.'
    n: '[[w.ritchie-minutes-of-the-senate]], 616–18 (Monroney''s report and Baker''s version of it, attached to the minutes of the Senate Democratic Conference, Feb. 7, 1963). See [[cal.1963-01-18.congress]]. Names: Mansfield, Monroney, Dirksen, Cotton, Cooper.'
    tags: [name:mansfield-mike, name:monroney-almer-s, name:dirksen-everett, name:cotton-norris-h, name:cooper-john-sherman]
  - id: cal.1963-01-18.soviet-union
    when: Jan. 18
    date: '1963-01-18'
    place: east-berlin
    thread: soviet-union
    also: [china-leadership]
    c: 'East Berlin. Wu Xiuquan speaks for the CCP at the SED''s Sixth Congress, the hosts having set it some days after Ulbricht''s and Khrushchev''s speeches and let only first secretaries and the Chinese and Czechoslovak heads speak. He answers Khrushchev''s call without naming him: to listen to the words of those who offer conciliation and watch their deeds; against false unity and a real split; regret again that a party''s congress is used to attack another party. The chair rings the bell and the hall shouts, whistles and bangs; the delegation stops and goes on, to the end.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 520–522 (set down for the 18th; the congress closed Jan. 21; Wu: the head said off the text that such conduct showed their "civilization," which the interpreter also voiced aloud; the text circulated by all Chinese in Berlin); [[w.macfarquhar-origins-of-the-cultural]], III, 321–23 (only delegations led by the first secretary may speak; Walter Ulbricht lists the CCP ninth, below Mongolia; Khrushchev, leading the Soviet delegation, justifies Soviet conduct in the missile crisis, derides the Chinese without naming them for their polemics and proposes that public debates cease and the Albanians return to the family; on Jan. 18, with Khrushchev pointedly absent, Wu reads the Chinese greeting, expressing ''extreme regret'' that the host party used its congress to attack a fraternal party, the East Germans ring a bell and drown him out; Wu tells them: ''you''ve let us see your "civilization"''; the delegation takes no further part except the final session, refusing to stand or applaud). Check: the book places the speeches of Ulbricht and Khrushchev before Wu''s of Jan. 18, as this entry does. To check: [[w.xiuquan-huiyi-yu-huainian]], 360 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 321 n.131a); [[w.dallin-diversity-in-international-communism]], 746, 762 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 321 n.131b). Names: Ulbricht, Khrushchev.'
