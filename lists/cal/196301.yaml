  - id: cal.1963-01-08.republican-party-congress
    when: Jan. 8
    date: '1963-01-08'
    place: washington
    thread: republican-party-congress
    c: 'Senate Republican conference organizes the 88th Congress, thirty-two present, 2:35 to 3:55 p.m.: Saltonstall chairman, Young secretary, Hickenlooper Policy Committee chairman, Dirksen floor leader, Kuchel whip, each by unanimous ballot; Mechem, Dominick and Simpson introduced. Aiken named the Republican candidate for president pro tempore. A resolution praising Goldwater, retiring as campaign committee chairman, unanimous. Dirksen on the session: fiscal bills, the U.N., Cuba, the Common Market, missiles; Tuesday–Thursday sessions from 9:30 considered.'
    n: '[[w.wolff-minutes-of-the-senate]], 943–48 (the elections, 944–45; Goldwater''s resolution, 945–46; Dirksen''s report, 946–47). Names: Saltonstall, Young, Hickenlooper, Dirksen, Kuchel, Mechem, Dominick, Simpson, Aiken, Goldwater.'
    tags: [name:saltonstall-leverett, name:young-milton-r, name:hickenlooper-bourke-b, name:dirksen-everett, name:kuchel-thomas-h, name:mechem-edwin-l, name:dominick-peter-h, name:simpson-milward-l, name:aiken-george-d, name:goldwater-barry-m]
    time_range:
      - 1963-01-08T19:35Z
      - 1963-01-08T20:55Z
    time_zone: America/New_York
  - id: cal.1963-01-08.china-leadership
    when: Jan. 8
    date: '1963-01-08'
    place: hangzhou
    thread: china-leadership
    also: [soviet-union]
    c: 'Evening, Hangzhou. Mao asks Zhou Enlai to draft for the Central Committee a notice on the 1963 plan (farms, markets, finance, staff cuts), for the regional first secretaries on Feb. 5. On Jan. 9 Zhou telephones Yang Shangkun for Liu Shaoqi, Deng Xiaoping and Peng Zhen Mao''s three points: the anti-revisionist articles not to appear until Khrushchev has spoken at the East German party''s congress, then to be answered together with his Supreme Soviet speech; more writers to join the Chinese delegation to that congress; a small meeting of the regional secretaries from Feb. 5, one with provincial secretaries from Feb. 10.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 8, 1963 (and Jan. 9). [[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 15, 1963: Zhou Enlai, at Mao''s request, drafts the Central Committee notice on the 1963 plan and the like; the nianpu gives a conference in mid-February, not a meeting of the regional secretaries from Feb. 5); [[w.deng-xiaoping-nianpu-1904]], III, 1741–1742 (Jan. 9, 1963; Deng reads the record of Zhou Enlai''s call of the 8th from Hangzhou, in which Zhou gives Mao''s three instructions: the anti-revisionist article held until Khrushchev has spoken at the SED congress and then answered with his Supreme Soviet speech; more ''writers'' (秀才) for the delegation; Ke Qingshi''s plan of a small meeting on Feb. 5 with the bureau secretaries and a work conference on Feb. 10 with the provincial secretaries). Made public: 1997. Check: Yang Shangkun''s diary records a call from Zhou Enlai at Hangzhou on Jan. 8 ([[w.yang-shangkun-riji]], II, 241–242), none on Jan. 9; whether the call of unit C is that one. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Khrushchev, Yang Shangkun.'
    tags: [polity:prc, polity:gdr, polity:ussr, name:mao-zedong, name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:peng-zhen, name:khrushchev-nikita-s, vis:only:prc]
    variants:
      - unit: C
        witness: w.deng-xiaoping-nianpu-1904
        reads: the call is Zhou's of the 8th (the record, 八日...打来电话的记录稿, read by Deng on the 9th), not a call of the 9th
        at: III, 1741
