  - id: cal.1963-01-04.civil-rights-the-executive
    when: Jan. 4
    date: '1963-01-04'
    place: washington
    thread: civil-rights-the-executive
    c: 'Washington, the National Archives, the opening of an exhibition for the centennial of the Emancipation Proclamation. Robert Kennedy gives the speech, derived from one Schlesinger wrote for the President to give by television from Palm Beach on Jan. 1, which the President dropped: a segregated city a poor place from which to make an emancipation speech. Rauh, passing Schlesinger a note: "Poor Lyndon.... Lyndon must know he is through. Bobby is going to be the next President." By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 185. Names: Robert Kennedy, Schlesinger, Kennedy, Rauh, Johnson.'
