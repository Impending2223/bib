    date: '1963-01-21'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi, reading the Northeast Forestry General Bureau''s second report on using timber rationally and saving it, writes to Bo Yibo, Gu Mu, Li Fuchun, Tan Zhenlin and others: it is well worth a look; consider and discuss it. Timber supply is to be run by a timber company, raw timber carried to the cities and the company to process it to finished goods, semi-finished goods or sawn timber by quality and size for the users; the offcuts to be gathered and used (ice-cream sticks, toothpicks, swabs, fiberboard, pulp); except in special cases no raw timber to users.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 569 (Jan. 21, 1963). Made public: 1996. To check: the report of the Northeast Forestry General Bureau''s forest-products industry bureau and Liu''s comment (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 569). Names: Liu Shaoqi, Bo Yibo, Li Fuchun, Tan Zhenlin.'
