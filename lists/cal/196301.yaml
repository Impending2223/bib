    n: '[[w.zhou-enlai-nianpu-1949]], II, 523 (Jan. 1, 1963); [[w.chen-yi-nianpu]], 949 (Jan. 1, 1963, midday; Chen Yi at the CPPCC''s banquet for its members, NPC deputies, party heads and State Council officials and counsellors over seventy); [[w.peng-zhen-nianpu-1902]], IV, 237 (Jan. 1, 1963, at noon; Peng Zhen at the national CPPCC''s banquet for its members in Peking aged seventy and over, Zhou Enlai presiding). Names: Zhou Enlai.'
