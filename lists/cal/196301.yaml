  - id: cal.1963-01-01.cuba
    when: Jan. 1
    date: '1963-01-01'
    thread: cuba
    c: 'Kennedy at the Orange Bowl game, Miami. To Tom Wicker of the *New York Times*, a New Year''s interview: the United States would set no preconditions for Cuba''s next government. Castro, in Havana: Kennedy''s Orange Bowl pledge the words of a "vulgar pirate chief"; "for the first time in history, imperialism paid an indemnification of war." Guevara on economic discipline.'
    n: '[[w.branch-parting-the-waters]], 687–88. To check: *Washington Star*, Jan. 2, 1963, at 1; *New York Times*, Jan. 2, 1963, at 2 (cited by [[w.branch-parting-the-waters]], 687 n.3, 688 nn.1–2). Check: the days of the interview and Castro''s speech. See [[cal.1962-12-29.cuba]]. Names: Kennedy, Wicker, Castro, Guevara.'
    src:
      c: 60485de7
      rows:
        - 'w.branch-parting-the-waters 687–88: all'
