  - id: cal.1960-09-29.soviet-union
    when: Sept. 29–Oct. 5
    date: '1960-09-29'
    thread: soviet-union
    c: 'Nkrumah, Nehru, Nasser, Sukarno and Tito ask Eisenhower and Khrushchev to meet. Sept. 29: Khrushchev shouts down Macmillan''s speech. Eisenhower declines, Oct. 2: nothing the Soviet government has said or done promises a meeting. Oct. 5: the Assembly strikes the two leaders'' titles from the five''s resolution; Nehru withdraws it.'
    n: 'FRUS 1958–60, II, docs. [197](https://history.state.gov/historicaldocuments/frus1958-60v02/d197) (the letter), [198](https://history.state.gov/historicaldocuments/frus1958-60v02/d198), [202](https://history.state.gov/historicaldocuments/frus1958-60v02/d202), [203](https://history.state.gov/historicaldocuments/frus1958-60v02/d203), [215](https://history.state.gov/historicaldocuments/frus1958-60v02/d215). [Letter in Reply to a Proposal for a Meeting of the President and Chairman Khrushchev](https://www.presidency.ucsb.edu/documents/letter-reply-proposal-for-meeting-the-president-and-chairman-khrushchev) (Oct. 2, 1960). [[w.macmillan-pointing-the-way-1959]], 275–79. See [[cal.1960-09-19.soviet-union]]. Names: Nkrumah, Nehru, Nasser, Sukarno, Tito, Khrushchev, Macmillan (K–J Adm. III.J); Eisenhower (Opp. III.E).'
    tags: [name:nkrumah-kwame, name:nehru-jawaharlal, name:nasser-gamal-abdel, name:sukarno, name:tito-josip-broz, name:eisenhower-dwight-d, name:khrushchev-nikita-s, name:macmillan-harold]
