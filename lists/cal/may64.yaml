    also: [legislatures]
    c: 'Oklahoma, with the runoff, adopts an apportionment amendment, 277,097 to 221,325: forty-eight senators, one each from the nineteen most populous counties and twenty-nine two-county districts; Representatives by a ratio formula; a reapportionment commission, under the State Supreme Court''s review, if the Legislature fails.'
