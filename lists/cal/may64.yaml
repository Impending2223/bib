  - id: cal.1964-05-02.governors-tx
    when: May 2
    date: '1964-05-02'
    thread: governors
    also: [elections-1964]
    c: 'Texas primaries. Democratic, for governor: Connally 69.1 percent, Don Yarborough 28.9. For Senator: U.S. Senator Yarborough 57.4, Gordon McLendon, a radio broadcaster, 42.6. Republican, for Senator: George Bush 44.1, Jack Cox 31.9; runoff.'
    n: '[Wikipedia, "1964 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1964_Texas_gubernatorial_election) and [Wikipedia, "1964 United States Senate election in Texas"](https://en.wikipedia.org/wiki/1964_United_States_Senate_election_in_Texas), from the *Texas Almanac* and Our Campaigns; Check: the parties'' canvasses. [[w.cox-ralph-w-yarborough-the]]; [[w.reston-lone-star]]; [[w.knaggs-two-party-texas]]; [[w.krochmal-blue-texas]]. See [[cal.1964-05-02.elections-1964]]. Names: Connally, Don Yarborough, Cox, Ralph Yarborough, McLendon, Bush.'
    tags: [state:tx, name:connally-john, name:yarborough-don, name:yarborough-ralph, name:mclendon-gordon, name:bush-george-h-w, name:cox-jack]
  - id: cal.1964-05-04.trade
    when: May 4
    date: '1964-05-04'
    thread: trade
    also: [european-community]
    c: The Kennedy Round opens at Geneva, the GATT's Trade Negotiations Committee meeting at ministerial level in the Palais des Nations. A linear cut of 50 percent in industrial tariffs the working hypothesis, exceptions to a bare minimum; agriculture's rules still to come. Herter for the United States, his instructions approved by Johnson Apr. 30. Check the terms.
    n: '[FRUS 1964–68, VIII, doc. 236](https://history.state.gov/historicaldocuments/frus1964-68v08/d236) (Herter to Johnson, Apr. 29). [[w.preeg-traders-and-diplomats]]; [[w.evans-kennedy-round-in-american]]. See [[cal.1962-10-11.trade]]. Names: Herter, Johnson.'
    tags: [name:herter-christian-a, name:johnson-lyndon-b]
  - id: cal.1964-05-05.elections-1964
    when: May 5
    date: '1964-05-05'
    thread: elections-1964
    c: 'Primaries in the District of Columbia, Indiana and Ohio. Republican: Goldwater in Indiana; Rhodes in Ohio. Democratic: unpledged delegates in the District; Welsh in Indiana; Porter in Ohio.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Goldwater, Rhodes, Welsh, Albert Porter.'
    tags: [primary:1964-05-05, name:rhodes-james-a, name:goldwater-barry-m, name:welsh-matthew-e, name:porter-albert-s]
  - id: cal.1964-05-05.alabama
    when: May 5
    date: '1964-05-05'
    thread: alabama
    also: [elections-1964]
    c: 'Alabama''s Democratic primary. Ten unpledged electors nominated over a slate pledged to the national ticket: Place No. 1, Lieutenant Governor Allen 516,612, the pledged candidate 84,721. Representatives by the nine old districts, for eight seats: Carl Elliott over Bevill in the 7th; Amelia Boynton of Selma, 4,753 to Roberts''s 47,360 in the 4th. Connor elected national committeeman, 282,703 of 525,395.'
    n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [489](https://archive.org/details/alabama-official-statistical-register-1967/page/n490) (Representatives), [499](https://archive.org/details/alabama-official-statistical-register-1967/page/n500)–[501](https://archive.org/details/alabama-official-statistical-register-1967/page/n502) (national committeeman, electors). [[w.cosman-five-states-for-goldwater]]; [[w.bartley-southern-politics-and-the]]; [[w.carter-politics-of-rage-1995]]. Names: Boynton, Connor, James Allen, Elliott, Bevill, Roberts.'
    tags: [name:allen-james-b, name:elliott-carl-a, name:bevill-tom, name:boynton-amelia-platts, name:roberts-kenneth-a, name:connor-eugene]
  - id: cal.1964-05-05.governors-fl
    when: May 5
    date: '1964-05-05'
    thread: governors
    also: [elections-1964]
    c: Florida's Democratic primary for governor. Burns, mayor of Jacksonville, 27.5 percent; High, mayor of Miami, 18.2; Kelly, a State senator, 18.1; three others. Runoff between Burns and High. High for the civil rights bill's public accommodations title.
    n: 'Fla. *Tabulation of Official Vote, Florida Primary Elections*, 1964 ([archive.org](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1964)); the figures as [Wikipedia](https://en.wikipedia.org/wiki/1964_Florida_gubernatorial_election) gives them, from *The Florida Handbook, 1965–1966*, 365 (Check). [[w.colburn-floridas-gubernatorial-politics-in]]; [[w.bartley-southern-elections]]. Names: W. Haydon Burns, High, Scott Kelly.'
    tags: [name:burns-w-haydon, name:high-robert-king, name:kelly-scott, state:fl, city:jacksonville, city:miami]
  - id: cal.1964-05-05.elections-1964-ok
    when: May 5
    date: '1964-05-05'
    thread: elections-1964
    also: [specials]
    c: 'Oklahoma primaries for the rest of Kerr''s term. Democratic: U.S. Senator Edmondson 36.4 percent, State Senator Fred Harris 32.2, Raymond Gary 28.8; runoff. Republican: Bud Wilkinson, lately the University of Oklahoma''s football coach, 79.2.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 41–42](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=41). [[w.harris-potomac-fever]]; [[w.peirce-great-plains-states-of]]. See [[cal.1963-01-06.states-and-cities-ok]]. Names: Edmondson, Gary, Harris, Wilkinson.'
    tags: [state:ok, name:edmondson-james-h, name:harris-fred-r, name:gary-raymond, name:wilkinson-charles-b]
  - id: cal.1964-05-05.state-constitutions-ok
    when: May 5
    date: '1964-05-05'
    thread: state-constitutions
    also: [jobs-and-wages, voting-rights]
    c: Oklahoma, with the primary. A right-to-work amendment by initiative, no union membership or dues a condition of employment, refused, 352,267 to 376,555. Residence to vote cut to six months in the State, two in the county, twenty days in the precinct, adopted, 401,998 to 240,299. Legislators' pay by law refused, 183,382 to 443,971.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 43](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=43). [[w.morgan-oklahoma-politics-and-policies]]; [[w.peirce-great-plains-states-of]]. See [[cal.1963-12-03.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1964-05-06.civil-rights-bill
    when: May 6
    date: '1964-05-06'
    thread: civil-rights-bill
    c: Senate, on jury trials in criminal contempt cases under the civil rights bill. Morton's amendment, a jury in every such case, fails on a tie, [45–45](https://voteview.com/rollcall/RS0880291); reconsidered, it fails again, [45–46](https://voteview.com/rollcall/RS0880294). Cooper's narrower amendment refused, [19–74](https://voteview.com/rollcall/RS0880295).
    n: '[110 Cong. Rec., Senate, May 6, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-3-1.pdf). [[w.whalen-longest-debate]]; [[w.mann-walls-of-jericho]]. See [[cal.1964-02-10.civil-rights-bill]]. Names: Morton, Cooper.'
    tags: [name:morton-thruston-b, name:cooper-john-sherman]
  - id: cal.1964-05-07.poverty
    when: May 7–8
    date: '1964-05-07'
    thread: poverty
    c: 'Poverty tour. Cumberland, Md.; Athens, Ohio, at Ohio University: "we will build the Great Society"; Knoxville; Rocky Mount, N.C., from a tenant farmer''s house. May 8, Gainesville, Ga., and the Georgia legislature at Atlanta: "no one of us is fully free until all of us are fully free."'
    n: '[Remarks at Fort Hill High School Stadium, Cumberland, Maryland](https://www.presidency.ucsb.edu/documents/remarks-fort-hill-high-school-stadium-cumberland-maryland); [Remarks in Athens at Ohio University](https://www.presidency.ucsb.edu/documents/remarks-athens-ohio-university); [Remarks at the Coliseum, Knoxville, Tennessee](https://www.presidency.ucsb.edu/documents/remarks-the-coliseum-knoxville-tennessee); [Remarks in the City Hall, Rocky Mount, North Carolina](https://www.presidency.ucsb.edu/documents/remarks-the-city-hall-rocky-mount-north-carolina) (May 7, 1964); [Remarks in Franklin D. Roosevelt Square, Gainesville, Georgia](https://www.presidency.ucsb.edu/documents/remarks-franklin-d-roosevelt-square-gainesville-georgia); [Remarks in Atlanta at a Breakfast of the Georgia Legislature](https://www.presidency.ucsb.edu/documents/remarks-atlanta-breakfast-the-georgia-legislature) (May 8, 1964). See [[cal.1964-03-16.poverty]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-08.transition-and-staff
    when: May 8
    date: '1964-05-08'
    thread: transition-and-staff
    c: E.O. 11154 exempts Hoover, 70 on Jan. 1, 1965, from compulsory retirement "for an indefinite period of time." Signed for his fortieth anniversary as Director, in the Rose Garden.
    n: '[Exec. Order No. 11,154](https://www.presidency.ucsb.edu/documents/executive-order-11154-exemption-j-edgar-hoover-from-compulsory-retirement-for-age), [29 Fed. Reg. 6233](https://www.govinfo.gov/app/details/FR-1964-05-12) (1964). [Remarks Honoring J. Edgar Hoover on His 40th Anniversary as Director, Federal Bureau of Investigation](https://www.presidency.ucsb.edu/documents/remarks-honoring-j-edgar-hoover-his-40th-anniversary-director-federal-bureau-investigation) (May 8, 1964). [[w.gage-g-man]]; [[w.weiner-enemies]]. Names: Hoover, Johnson.'
    tags: [name:hoover-j-edgar, name:johnson-lyndon-b]
  - id: cal.1964-05-11.desegregation-public-places-cambridge
    when: May 11
    date: '1964-05-11'
    thread: desegregation-public-places
    also: [elections-1964]
    c: Cambridge, Md. Wallace, campaigning for the May 19 primary, speaks to a white audience at the Rescue Fire Company's arena, invited by the Dorchester Business and Citizens Association. Some 300 Negro demonstrators march; the Guard disperses them with tear gas; Richardson arrested. Check.
    n: '[SNCC Digital Gateway, "Demonstrators Tear Gassed at George Wallace Protest in Cambridge"](https://snccdigital.org/events/demonstrators-tear-gassed-george-wallace-protest-cambridge/). [[w.levy-civil-war-on-race]]; [[w.carter-politics-of-rage-1995]]. See [[cal.1963-10-01.desegregation-public-places-cambridge]]. Names: Wallace, Richardson.'
    tags: [state:md, city:cambridge-md, name:wallace-george-c, name:richardson-gloria]
  - id: cal.1964-05-12.elections-1964
    when: May 12
    date: '1964-05-12'
    thread: elections-1964
    c: 'Primaries in Nebraska and West Virginia. Republican: Goldwater in Nebraska; Rockefeller in West Virginia. Democratic: Johnson (write-in) in Nebraska; unpledged delegates in West Virginia.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Johnson, Goldwater, Rockefeller.'
    tags: [primary:1964-05-12, name:johnson-lyndon-b, name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1964-05-12.governors-wv
    when: May 12
    date: '1964-05-12'
    thread: governors
    also: [elections-1964]
    c: 'West Virginia primaries for governor. Democratic: Hulett Smith, the former State chairman, 53.3 percent over three others, the nearest 24.5; the Speaker of the House of Delegates 13.7. Republican: Underwood, governor 1957–61, 89.7.'
    n: '*West Virginia Blue Book*, 1964, [p. 467](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=477) (Smith 186,273, Bonn Brown 85,527, Julius W. Singleton 47,845, Harold G. Cutright 30,119), [p. 493](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=503) (Underwood 152,573, Harry H. Cupp 11,325, Freda P. Cavendish 6,114). [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Smith, Underwood.'
    tags: [state:wv, name:smith-hulett-c, name:underwood-cecil-h]
  - id: cal.1964-05-12.governors-ne
    when: May 12
    date: '1964-05-12'
    thread: governors
    also: [elections-1964]
    c: 'Nebraska, governor. Democratic primary: Governor Morrison 88.8 percent, two others. Republican: Lieutenant Governor Burney 58.8, Romans 31.5, three others.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1964*](https://govdocs.nebraska.gov/epubs/S1200/S001-1964prim_gen.pdf); [Wikipedia, "1964 Nebraska gubernatorial election"](https://en.wikipedia.org/wiki/1964_Nebraska_gubernatorial_election). [[w.peirce-great-plains-states-of]]. Names: Frank Morrison, Burney, Romans.'
    tags: [state:ne, name:morrison-frank-b, name:burney-dwight-w, name:romans-jack]
  - id: cal.1964-05-13.foreign-aid
    when: May 13
    date: '1964-05-13'
    thread: foreign-aid
    c: 'House passes the IDA bill, S. 2214: $312 million over three years, the American share of new resources for the International Development Association. Recommittal refused, [132–247](https://voteview.com/rollcall/RH0880159). The House had recommitted its own bill Feb. 26, [208–189](https://voteview.com/rollcall/RH0880132). Signed May 26, [78 Stat. 200](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg200.pdf).'
    n: '[Statement by the President following House Action on the International Development Association Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-action-the-international-development-association) (May 13, 1964); [Remarks Upon Signing the International Development Association Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-international-development-association-bill) (May 26, 1964). [110 Cong. Rec., House, May 13, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-8-1.pdf). [[w.johnson-congress-and-the-cold]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-13.opinion
    when: May 13
    date: '1964-05-13'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Apr. 24–29: the Democratic convention''s choice between Johnson and Wallace: Johnson 84, Wallace 9, undecided 7. Southern Democrats: Johnson 74, Wallace 21. Democrats outside the South: Johnson 94, Wallace 3.'
    n: '[[w.gallup-poll]], III, 1879–80. Names: Johnson, Wallace.'
    tags: [name:johnson-lyndon-b, name:wallace-george-c]
  - id: cal.1964-05-14.baker
    when: May 14
    date: '1964-05-14'
    thread: baker
    c: Senate tables Williams's S. Res. 330, [42–33](https://voteview.com/rollcall/RS0880297), on Mansfield's motion. It would have had the Rules Committee inquire into Senators as well as employees, campaign funds given or received included.
    n: '[110 Cong. Rec., Senate, May 14, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-9-1.pdf). See [[cal.1963-10-07.baker]]. Names: Williams, Mansfield.'
    tags: [name:williams-john-j, name:mansfield-mike]
  - id: cal.1964-05-15.elections-1964
    when: May 15
    date: '1964-05-15'
    thread: elections-1964
    c: 'Oregon primary. Republican: Rockefeller 33.0 percent, Lodge 27.7. Democratic: Johnson 99.5 percent, Wallace (write-in) 0.5.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Wallace, Lodge, Johnson, Rockefeller.'
    tags: [primary:1964-05-15, name:wallace-george-c, name:lodge-henry-cabot, name:johnson-lyndon-b, name:rockefeller-nelson]
  - id: cal.1964-05-16.peace-corps
    when: May 16
    date: '1964-05-16'
    thread: peace-corps
    c: Johnson to a group of volunteers at the White House, Shriver with them. Twenty-three nations want Peace Corps of their own; Shriver back from helping West Germany with its own; Japan to have volunteers in Asia by 1965.
    n: '[Remarks to a Group of Peace Corps Volunteers](https://www.presidency.ucsb.edu/documents/remarks-group-peace-corps-volunteers-0) (May 16, 1964). See [[cal.1963-06-24.peace-corps]]. Names: Johnson, Shriver.'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent]
  - id: cal.1964-05-17.laos
    when: May 17–19
    date: '1964-05-17'
    thread: laos
    c: Laos. Communist attacks on Kong Le's neutralists on the Plain of Jars; their position there "untenable," the Watch Committee reports, May 17. State asks for Souvanna's request of American jet reconnaissance over the Plain. The flights begin May 19 (Yankee Team). Check the date.
    n: 'FRUS 1964–68, XXVIII, docs. [49](https://history.state.gov/historicaldocuments/frus1964-68v28/d49), [50](https://history.state.gov/historicaldocuments/frus1964-68v28/d50). [[w.stevenson-end-of-nowhere]]; [[w.castle-at-war-in-the]]; [[w.conboy-shadow-war]]; [[w.jacobs-universe-unraveling]]; [[w.ahern-undercover-armies]]. See [[cal.1963-04-26.laos]]. Names: Kong Le, Souvanna Phouma.'
    tags: [name:kong-le, name:souvanna-phouma]
  - id: cal.1964-05-18.vietnam
    when: May 18
    date: '1964-05-18'
    thread: vietnam
    also: [foreign-aid]
    c: 'Special message: $125 million more for Vietnam, $70 million economic and $55 million military, over the $3.4 billion asked for foreign aid. "Increased Communist terror requires it." After McNamara and Taylor in Saigon, May 12–13.'
    n: '[Special Message to the Congress Transmitting Request for Additional Funds for Viet-Nam](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-request-for-additional-funds-for-viet-nam) (May 18, 1964). FRUS 1964–68, I, docs. [151](https://history.state.gov/historicaldocuments/frus1964-68v01/d151), [154](https://history.state.gov/historicaldocuments/frus1964-68v01/d154). [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]. See [[cal.1963-12-21.vietnam]]. Names: Johnson, McNamara, Taylor.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:taylor-maxwell]
  - id: cal.1964-05-18.desegregation-schools-milwaukee
    when: May 18
    date: '1964-05-18'
    thread: desegregation-schools
    c: Milwaukee. The Milwaukee United School Integration Committee, Barbee its chairman, keeps about 11,000 Negro children out of the public schools for a day; about 8,500 at its freedom schools. The school board had refused to call its schools segregated.
    n: 'Figures: University of Wisconsin–Milwaukee, [*March on Milwaukee*](https://uwm.edu/marchonmilwaukee/wp-json/wp/v2/cpt-keyterms/173), from the Barbee papers. [Wikipedia, "Lloyd Barbee"](https://en.wikipedia.org/wiki/Lloyd_Barbee). [[w.jones-selma-of-the-north]]; [[w.dougherty-more-than-one-struggle]]. Names: Barbee.'
    tags: [state:wi, city:milwaukee, name:barbee-lloyd]
  - id: cal.1964-05-19.elections-1964
    when: May 19
    date: '1964-05-19'
    thread: elections-1964
    c: 'Maryland primary. Republican: unpledged delegates 58.2 percent, others 41.8. Democratic: Brewster 53.1 percent, Wallace 42.7.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Brewster, Wallace.'
    tags: [primary:1964-05-19, name:brewster-daniel-b, name:wallace-george-c]
  - id: cal.1964-05-20.opinion
    when: May 20
    date: '1964-05-20'
    thread: opinion
    c: 'Gallup, Apr. 24–29: the most important problem: racial 41 percent; international, Russia, the threat of war, 41; unemployment 9; cost of living 5. The party better able to handle it: Democratic 40, Republican 16, no difference 44.'
    n: '[[w.gallup-poll]], III, 1881.'
  - id: cal.1964-05-22.program
    when: May 22
    date: '1964-05-22'
    thread: program
    c: 'Commencement at the University of Michigan, Ann Arbor. "The Great Society rests on abundance and liberty for all." Three places to begin it: the cities, the countryside, the classrooms. Working groups to prepare White House conferences on each.'
    n: '[Remarks at the University of Michigan](https://www.presidency.ucsb.edu/documents/remarks-the-university-michigan) (May 22, 1964). Recording (K–J Adm. II.I). [[w.goodwin-remembering-america]]; [[w.dallek-flawed-giant]]; [[w.matusow-unraveling-of-america]]; [[w.bernstein-guns-or-butter]]; [[w.davies-from-opportunity-to-entitlement]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.mackenzie-liberal-hour]]. See [[cal.1964-01-08.program]]; [[cal.1964-05-07.poverty]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-24.vietnam
    when: May 24–25
    date: '1964-05-24'
    thread: vietnam
    also: [laos]
    c: 'NSC Executive Committee on Southeast Asia. Strikes on the North weighed: Rusk would begin lightly; McCone, "go in hard"; Taylor, the chiefs would rather wait for the fall. A congressional resolution drafted at State. May 25, Bundy''s draft for Johnson: "selected and carefully graduated military force against North Vietnam," after warning and preparation.'
    n: 'FRUS 1964–68, I, docs. [169](https://history.state.gov/historicaldocuments/frus1964-68v01/d169), [172](https://history.state.gov/historicaldocuments/frus1964-68v01/d172), [173](https://history.state.gov/historicaldocuments/frus1964-68v01/d173). [[w.pentagon-papers]]; [[w.gibbons-u-s-government-and]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.moise-tonkin-gulf-and-the-2019]]; [[w.kaiser-american-tragedy]]. Names: Rusk, McGeorge Bundy, McCone, Taylor, Johnson.'
    tags: [name:rusk-dean, name:mccone-john-a, name:taylor-maxwell, name:bundy-mcgeorge, name:johnson-lyndon-b]
  - id: cal.1964-05-24.opinion
    when: May 24
    date: '1964-05-24'
    thread: opinion
    also: [civil-rights-bill]
    c: 'Gallup, Apr. 24–29: Johnson''s handling of civil rights, 57 percent approve, 21 disapprove. Southern whites 36 approve, 39 disapprove; whites outside the South 59 and 17. Republicans 51 approve.'
    n: '[[w.gallup-poll]], III, 1881–82. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-24.goldwater
    when: May 24
    date: '1964-05-24'
    thread: goldwater
    also: [elections-1964, vietnam]
    c: 'ABC''s *Issues and Answers*, recorded. Goldwater on the Viet Cong''s supply lines: "defoliation of the forests by low-yield atomic weapons" could be done; he did not think it would be. Later: a suggestion of "competent military people," not his own. Check the wording.'
    n: '[[w.mann-daisy-petals-and-mushroom]]; [[w.perlstein-before-the-storm]]; [[w.goldberg-barry-goldwater]]. See [[cal.1964-01-03.elections-1964]]. Names: Goldwater.'
    tags: [name:goldwater-barry-m]
  - id: cal.1964-05-25.court
    when: May 25
    date: '1964-05-25'
    thread: court
    also: [desegregation-schools]
    c: '*Griffin v. County School Board of Prince Edward County*, [377 U.S. 218](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377218/usrep377218.pdf). The county''s schools, closed since 1959 rather than desegregated, with tuition grants for white children in private schools: a denial of equal protection. "There has been entirely too much deliberation and not enough speed." The district court may order the supervisors to levy taxes and reopen them. Black for the Court; Clark and Harlan dissent on that power.'
    n: 'Opinion, [377 U.S. 218](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377218/usrep377218.pdf). [[w.smith-they-closed-their-schools]]; [[w.sullivan-bound-for-freedom]]; [[w.powe-warren-court-and-american]]. See [[cal.1963-09-16.desegregation-schools]]. Names: Black.'
    tags: [name:black-hugo-l]
