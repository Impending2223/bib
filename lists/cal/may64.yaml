    date: '1964-05-27'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 24–29: 37 percent have given attention to South Vietnam. Of them, the United States handling it as well as could be expected, 42; badly, 46. What next, of all asked: tougher, not military, 5; military action 4; fight or get out 4; get out 4; present policy 3.'
    n: '[[w.gallup-poll]], III, 1882.'
