entries:
  - id: cal.1964-05-02.elections-1964
    when: May 2
    date: '1964-05-02'
    thread: elections-1964
    c: 'Texas primary. Republican: Goldwater 74.7 percent, Lodge (write-in) 8.8.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Lodge (K–J Adm. III.E).'
    tags: [primary:1964-05-02, name:lodge-henry-cabot, name:goldwater-barry-m]
  - id: cal.1964-05-04.trade
    when: May 4
    date: '1964-05-04'
    thread: trade
    c: The Kennedy Round opens at Geneva, the GATT's Trade Negotiations Committee meeting at ministerial level in the Palais des Nations. A linear cut of 50 percent in industrial tariffs the working hypothesis, exceptions to a bare minimum; agriculture's rules still to come. Herter for the United States, his instructions approved by Johnson Apr. 30. Check the terms.
    n: '[FRUS 1964–68, VIII, doc. 236](https://history.state.gov/historicaldocuments/frus1964-68v08/d236) (Herter to Johnson, Apr. 29). Preeg, *Traders and Diplomats*; Evans, *The Kennedy Round in American Trade Policy* (K–J Adm. II.B). See [[cal.1962-10-11.trade]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:herter-christian-a, name:johnson-lyndon-b]
  - id: cal.1964-05-05.elections-1964
    when: May 5
    date: '1964-05-05'
    thread: elections-1964
    c: 'Primaries in the District of Columbia, Indiana and Ohio. Republican: Goldwater in Indiana; Rhodes in Ohio. Democratic: unpledged delegates in the District; Welsh in Indiana; Porter in Ohio.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Rhodes (Opp. III.H).'
    tags: [primary:1964-05-05, name:rhodes-james-a, name:goldwater-barry-m]
  - id: cal.1964-05-05.alabama
    when: May 5
    date: '1964-05-05'
    thread: alabama
    also: [elections-1964]
    c: 'Alabama''s Democratic primary. Ten unpledged electors nominated over a slate pledged to the national ticket: Place No. 1, Lieutenant Governor Allen 516,612, the pledged candidate 84,721. Representatives by the nine old districts, for eight seats: Carl Elliott over Bevill in the 7th; Amelia Boynton of Selma, 4,753 to Roberts''s 47,360 in the 4th. Connor elected national committeeman, 282,703 of 525,395.'
    n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [489](https://archive.org/details/alabama-official-statistical-register-1967/page/n490) (Representatives), [499](https://archive.org/details/alabama-official-statistical-register-1967/page/n500)–[501](https://archive.org/details/alabama-official-statistical-register-1967/page/n502) (national committeeman, electors). Cosman, *Five States for Goldwater* (Opp. II.E). Bartley & Graham, *Southern Politics and the Second Reconstruction* (Opp. II.F). Carter, *The Politics of Rage* (K–J Cong. II.H). Names: Boynton, Connor (K–J Cong. III.K).'
    tags: [name:allen-james-b, name:elliott-carl-a, name:bevill-tom, name:boynton-amelia-platts, name:roberts-kenneth-a, name:connor-eugene]
  - id: cal.1964-05-06.civil-rights-bill
    when: May 6
    date: '1964-05-06'
    thread: civil-rights-bill
    c: Senate, on jury trials in criminal contempt cases under the civil rights bill. Morton's amendment, a jury in every such case, fails on a tie, [45–45](https://voteview.com/rollcall/RS0880291); reconsidered, it fails again, [45–46](https://voteview.com/rollcall/RS0880294). Cooper's narrower amendment refused, [19–74](https://voteview.com/rollcall/RS0880295).
    n: '[110 Cong. Rec., Senate, May 6, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-3-1.pdf). Whalen, *The Longest Debate*; Mann, *The Walls of Jericho* (K–J Cong. II.C). See [[cal.1964-02-10.civil-rights-bill]]. Names: Morton, Cooper (Opp. III.B).'
    tags: [name:morton-thruston-b, name:cooper-john-sherman]
  - id: cal.1964-05-07.poverty
    when: May 7–8
    date: '1964-05-07'
    thread: poverty
    c: 'Poverty tour. Cumberland, Md.; Athens, at Ohio University: "we will build the Great Society"; Knoxville; Rocky Mount, N.C., from a tenant farmer''s house. May 8, Gainesville, Ga., and the Georgia legislature at Atlanta: "no one of us is fully free until all of us are fully free."'
    n: '[Remarks at Fort Hill High School Stadium, Cumberland, Maryland](https://www.presidency.ucsb.edu/documents/remarks-fort-hill-high-school-stadium-cumberland-maryland); [Remarks in Athens at Ohio University](https://www.presidency.ucsb.edu/documents/remarks-athens-ohio-university); [Remarks at the Coliseum, Knoxville, Tennessee](https://www.presidency.ucsb.edu/documents/remarks-the-coliseum-knoxville-tennessee); [Remarks in the City Hall, Rocky Mount, North Carolina](https://www.presidency.ucsb.edu/documents/remarks-the-city-hall-rocky-mount-north-carolina) (May 7, 1964); [Remarks in Franklin D. Roosevelt Square, Gainesville, Georgia](https://www.presidency.ucsb.edu/documents/remarks-franklin-d-roosevelt-square-gainesville-georgia); [Remarks in Atlanta at a Breakfast of the Georgia Legislature](https://www.presidency.ucsb.edu/documents/remarks-atlanta-breakfast-the-georgia-legislature) (May 8, 1964). See [[cal.1964-03-16.poverty]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-08.transition-and-staff
    when: May 8
    date: '1964-05-08'
    thread: transition-and-staff
    c: E.O. 11154 exempts Hoover, 70 on Jan. 1, 1965, from compulsory retirement "for an indefinite period of time." Signed for his fortieth anniversary as Director, in the Rose Garden.
    n: '[Exec. Order No. 11,154](https://www.presidency.ucsb.edu/documents/executive-order-11154-exemption-j-edgar-hoover-from-compulsory-retirement-for-age), [29 Fed. Reg. 6233](https://www.govinfo.gov/app/details/FR-1964-05-12) (1964). [Remarks Honoring J. Edgar Hoover on His 40th Anniversary as Director, Federal Bureau of Investigation](https://www.presidency.ucsb.edu/documents/remarks-honoring-j-edgar-hoover-his-40th-anniversary-director-federal-bureau-investigation) (May 8, 1964). Gage, *G-Man*; Weiner, *Enemies* (K–J Adm. II.E). Names: Hoover (K–J Adm. III.I); Johnson (K–J Adm. III.D).'
    tags: [name:hoover-j-edgar, name:johnson-lyndon-b]
  - id: cal.1964-05-12.elections-1964
    when: May 12
    date: '1964-05-12'
    thread: elections-1964
    c: 'Primaries in Nebraska and West Virginia. Republican: Goldwater in Nebraska; Rockefeller in West Virginia. Democratic: Johnson (write-in) in Nebraska; unpledged delegates in West Virginia.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Johnson (K–J Adm. III.D); Rockefeller (1968 list III.M).'
    tags: [primary:1964-05-12, name:johnson-lyndon-b, name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1964-05-13.foreign-aid
    when: May 13
    date: '1964-05-13'
    thread: foreign-aid
    c: 'House passes the IDA bill, S. 2214: $312 million over three years, the American share of new resources for the International Development Association. Recommittal refused, [132–247](https://voteview.com/rollcall/RH0880159). The House had recommitted its own bill Feb. 26, [208–189](https://voteview.com/rollcall/RH0880132). Signed May 26, [78 Stat. 200](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg200.pdf).'
    n: '[Statement by the President following House Action on the International Development Association Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-action-the-international-development-association) (May 13, 1964); [Remarks Upon Signing the International Development Association Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-international-development-association-bill) (May 26, 1964). [110 Cong. Rec., House, May 13, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-8-1.pdf). Johnson, *Congress and the Cold War* (K–J Cong. II.D). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-13.opinion
    when: May 13
    date: '1964-05-13'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Apr. 24–29: the Democratic convention''s choice between Johnson and Wallace: Johnson 84, Wallace 9, undecided 7. Southern Democrats: Johnson 74, Wallace 21. Democrats outside the South: Johnson 94, Wallace 3.'
    n: '*The Gallup Poll*, III, 1879–80 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Wallace (K–J Cong. III.F).'
    tags: [name:johnson-lyndon-b, name:wallace-george-c]
  - id: cal.1964-05-14.baker
    when: May 14
    date: '1964-05-14'
    thread: baker
    c: Senate tables Williams's S. Res. 330, [42–33](https://voteview.com/rollcall/RS0880297), on Mansfield's motion. It would have had the Rules Committee inquire into Senators as well as employees, campaign funds given or received included.
    n: '[110 Cong. Rec., Senate, May 14, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-9-1.pdf). See [[cal.1963-10-07.baker]]. Names: Williams (Opp. III.B); Mansfield (K–J Cong. III.A).'
    tags: [name:williams-john-j, name:mansfield-mike]
  - id: cal.1964-05-15.elections-1964
    when: May 15
    date: '1964-05-15'
    thread: elections-1964
    c: 'Oregon primary. Republican: Rockefeller 33.0 percent, Lodge 27.7. Democratic: Johnson 99.5 percent, Wallace (write-in) 0.5.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Wallace (K–J Cong. III.F); Lodge (K–J Adm. III.E); Johnson (K–J Adm. III.D); Rockefeller (1968 list III.M).'
    tags: [primary:1964-05-15, name:wallace-george-c, name:lodge-henry-cabot, name:johnson-lyndon-b, name:rockefeller-nelson]
  - id: cal.1964-05-17.laos
    when: May 17–19
    date: '1964-05-17'
    thread: laos
    c: Laos. Communist attacks on Kong Le's neutralists on the Plain of Jars; their position there "untenable," the Watch Committee reports, May 17. State asks for Souvanna's request of American jet reconnaissance over the Plain. The flights begin May 19 (Yankee Team). Check the date.
    n: 'FRUS 1964–68, XXVIII, docs. [49](https://history.state.gov/historicaldocuments/frus1964-68v28/d49), [50](https://history.state.gov/historicaldocuments/frus1964-68v28/d50). Stevenson, *The End of Nowhere*; Castle, *At War in the Shadow of Vietnam*; Conboy, *Shadow War*; Jacobs, *The Universe Unraveling* (Viet. II.E.4). Ahern, *Undercover Armies* (Viet. II.F.10). See [[cal.1963-04-26.laos]]. Names: Kong Le, Souvanna Phouma (Viet. III.I).'
    tags: [name:kong-le, name:souvanna-phouma]
  - id: cal.1964-05-18.vietnam
    when: May 18
    date: '1964-05-18'
    thread: vietnam
    also: [foreign-aid]
    c: 'Special message: $125 million more for Vietnam, $70 million economic and $55 million military, over the $3.4 billion asked for foreign aid. "Increased Communist terror requires it." After McNamara and Taylor in Saigon, May 12–13.'
    n: '[Special Message to the Congress Transmitting Request for Additional Funds for Viet-Nam](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-request-for-additional-funds-for-viet-nam) (May 18, 1964). FRUS 1964–68, I, docs. [151](https://history.state.gov/historicaldocuments/frus1964-68v01/d151), [154](https://history.state.gov/historicaldocuments/frus1964-68v01/d154). Kaiser, *American Tragedy* (Viet. II.B.8). Logevall, *Choosing War* (K–J Adm. II.D). See [[cal.1963-12-21.vietnam]]. Names: Johnson (K–J Adm. III.D); McNamara, Taylor (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:taylor-maxwell]
  - id: cal.1964-05-19.elections-1964
    when: May 19
    date: '1964-05-19'
    thread: elections-1964
    c: 'Maryland primary. Republican: unpledged delegates 58.2 percent, others 41.8. Democratic: Brewster 53.1 percent, Wallace 42.7.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Wallace (K–J Cong. III.F).'
    tags: [primary:1964-05-19, name:brewster-daniel-b, name:wallace-george-c]
  - id: cal.1964-05-20.opinion
    when: May 20
    date: '1964-05-20'
    thread: opinion
    c: 'Gallup, Apr. 24–29: the most important problem: racial 41 percent; international, Russia, the threat of war, 41; unemployment 9; cost of living 5. The party better able to handle it: Democratic 40, Republican 16, no difference 44.'
    n: '*The Gallup Poll*, III, 1881 (K–J Cong. II.E).'
  - id: cal.1964-05-22.program
    when: May 22
    date: '1964-05-22'
    thread: program
    c: 'Commencement at the University of Michigan, Ann Arbor. "The Great Society rests on abundance and liberty for all." Three places to begin it: the cities, the countryside, the classrooms. Working groups to prepare White House conferences on each.'
    n: '[Remarks at the University of Michigan](https://www.presidency.ucsb.edu/documents/remarks-the-university-michigan) (May 22, 1964). Recording (K–J Adm. II.I). Goodwin, *Remembering America* (K–J Adm. II.G.2). Dallek, *Flawed Giant*; Matusow, *The Unraveling of America*; Bernstein, *Guns or Butter* (K–J Adm. II.A). Davies, *From Opportunity to Entitlement* (K–J Adm. II.B). Zelizer, *The Fierce Urgency of Now*; Mackenzie & Weisbrot, *The Liberal Hour* (K–J Cong. II.B). See [[cal.1964-01-08.program]]; [[cal.1964-05-07.poverty]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-24.vietnam
    when: May 24–25
    date: '1964-05-24'
    thread: vietnam
    also: [laos]
    c: 'NSC Executive Committee on Southeast Asia. Strikes on the North weighed: Rusk would begin lightly; McCone, "go in hard"; Taylor, the chiefs would rather wait for the fall. A congressional resolution drafted at State. May 25, Bundy''s draft for Johnson: "selected and carefully graduated military force against North Vietnam," after warning and preparation.'
    n: 'FRUS 1964–68, I, docs. [169](https://history.state.gov/historicaldocuments/frus1964-68v01/d169), [172](https://history.state.gov/historicaldocuments/frus1964-68v01/d172), [173](https://history.state.gov/historicaldocuments/frus1964-68v01/d173). *The Pentagon Papers* (K–J Adm. II.H.3). Gibbons, *The U.S. Government and the Vietnam War*; Logevall, *Choosing War*; McMaster, *Dereliction of Duty* (K–J Adm. II.D). Preston, *The War Council*; Goldstein, *Lessons in Disaster*; VanDeMark, *Into the Quagmire* (Viet. II.C.3). Moïse, *Tonkin Gulf and the Escalation of the Vietnam War* (Viet. II.C.2). Kaiser, *American Tragedy* (Viet. II.B.8). Names: Rusk, Bundy (K–J Adm. III.E); McCone (K–J Adm. III.I); Taylor (K–J Adm. III.F); Johnson (K–J Adm. III.D).'
    tags: [name:rusk-dean, name:mccone-john-a, name:taylor-maxwell, name:bundy-mcgeorge, name:johnson-lyndon-b]
  - id: cal.1964-05-24.opinion
    when: May 24
    date: '1964-05-24'
    thread: opinion
    also: [civil-rights-bill]
    c: 'Gallup, Apr. 24–29: Johnson''s handling of civil rights, 57 percent approve, 21 disapprove. Southern whites 36 approve, 39 disapprove; whites outside the South 59 and 17. Republicans 51 approve.'
    n: '*The Gallup Poll*, III, 1881–82 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-24.goldwater
    when: May 24
    date: '1964-05-24'
    thread: goldwater
    also: [elections-1964, vietnam]
    c: 'ABC''s *Issues and Answers*, recorded. Goldwater on the Viet Cong''s supply lines: "defoliation of the forests by low-yield atomic weapons" could be done; he did not think it would be. Later: a suggestion of "competent military people," not his own. Check the wording.'
    n: 'Mann, *Daisy Petals and Mushroom Clouds* (K–J Cong. II.E). Perlstein, *Before the Storm*; Goldberg, *Barry Goldwater* (Opp. II.B). See [[cal.1964-01-03.elections-1964]]. Names: Goldwater (Opp. III.B).'
    tags: [name:goldwater-barry-m]
  - id: cal.1964-05-25.court
    when: May 25
    date: '1964-05-25'
    thread: court
    also: [desegregation-schools]
    c: '*Griffin v. County School Board of Prince Edward County*, [377 U.S. 218](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377218/usrep377218.pdf). The county''s schools, closed since 1959 rather than desegregated, with tuition grants for white children in private schools: a denial of equal protection. "There has been entirely too much deliberation and not enough speed." The district court may order the supervisors to levy taxes and reopen them. Black for the Court; Clark and Harlan dissent on that power.'
    n: 'Opinion, [377 U.S. 218](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377218/usrep377218.pdf). Smith, *They Closed Their Schools*; Sullivan, *Bound for Freedom* (K–J Cong. II.H). Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1963-09-16.desegregation-schools]]. Names: Black, Clark, Harlan (K–J Cong. III.G).'
    tags: [name:black-hugo-l, name:clark-tom-c, name:harlan-john-marshall]
  - id: cal.1964-05-26.elections-1964
    when: May 26
    date: '1964-05-26'
    thread: elections-1964
    c: 'Florida primary. Republican: unpledged delegates 57.8 percent, Goldwater 42.2. Democratic: Johnson, unopposed.'
    n: 'CQ Guide 6th (2010) 407. See [[cal.1964-03-10.elections-1964]]. Names: Johnson (K–J Adm. III.D).'
    tags: [primary:1964-05-26, name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-05-26.civil-rights-bill
    when: May 26
    date: '1964-05-26'
    thread: civil-rights-bill
    c: Mansfield and Dirksen offer a clean bill as a substitute for H.R. 7152, worked out in Dirksen's office with Humphrey, Kuchel and Katzenbach. The Attorney General to sue on public accommodations and employment only against a "pattern or practice"; State and local agencies to act first where States have laws of their own. Check.
    n: '[110 Cong. Rec., Senate, May 26, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt9/pdf/GPO-CRECB-1964-pt9-6-1.pdf). [Civil Rights Act of 1964: Chronology](https://www.senate.gov/legislative/landmark-legislation/civil-rights-act-of-1964/civil-rights-chronology.htm) (Senate Historical Office). MacNeil, *Dirksen*; Hulsey, *Everett Dirksen and His Presidents* (Opp. II.D). Humphrey, *The Education of a Public Man* (K–J Cong. II.I.1). See [[cal.1964-02-10.civil-rights-bill]]. Names: Mansfield, Dirksen, Humphrey, Kuchel (K–J Cong. III.A); Katzenbach (K–J Adm. III.I).'
    tags: [name:mansfield-mike, name:dirksen-everett, name:humphrey-hubert-h, name:kuchel-thomas-h, name:katzenbach-nicholas]
  - id: cal.1964-05-27.india-and-china
    when: May 27
    date: '1964-05-27'
    thread: india-and-china
    c: Nehru dies at New Delhi. Rusk at the funeral; talks there with Kosygin. June 2, the Congress Party chooses Shastri; sworn June 9.
    n: '[Letter to the President of India on the Death of Prime Minister Nehru](https://www.presidency.ucsb.edu/documents/letter-the-president-india-the-death-prime-minister-nehru) (May 27, 1964); [Message to the New Prime Minister of India](https://www.presidency.ucsb.edu/documents/message-the-new-prime-minister-india) (June 2, 1964). [FRUS 1964–68, XIV, doc. 33](https://history.state.gov/historicaldocuments/frus1964-68v14/d33) (Rusk and Kosygin). Bowles, *Promises to Keep* (K–J Adm. II.G.4). See [[cal.1962-11-19.india-and-china]]. Names: Nehru, Kosygin (K–J Adm. III.J); Rusk (K–J Adm. III.E).'
    tags: [name:nehru-jawaharlal, name:rusk-dean, name:kosygin-aleksei, name:shastri-lal-bahadur, name:johnson-lyndon-b]
  - id: cal.1964-05-27.opinion
    when: May 27
    date: '1964-05-27'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 24–29: 37 percent have given attention to South Vietnam. Of them, the United States handling it as well as could be expected, 42; badly, 46. What next, of all asked: tougher, not military, 5; military action 4; fight or get out 4; get out 4; present policy 3.'
    n: '*The Gallup Poll*, III, 1882 (K–J Cong. II.E).'
  - id: cal.1964-05-31.opinion
    when: May 31
    date: '1964-05-31'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Apr. 24–29: Democrats'' choice for Vice President: Robert Kennedy 41, Stevenson 26, Humphrey 11, Brown 5, Shriver 3, Fulbright 3, Wagner 2; no preference 7. Without Kennedy: Stevenson 42, Humphrey 15, Shriver 10, Brown 7, Fulbright 5, Wagner 5.'
    n: '*The Gallup Poll*, III, 1883 (K–J Cong. II.E). Names: Kennedy (K–J Adm. III.A); Stevenson (K–J Adm. III.E); Humphrey (K–J Cong. III.A); Brown, Wagner (K–J Cong. III.F); Shriver (K–J Adm. III.G); Fulbright (K–J Cong. III.B).'
    tags: [name:kennedy-robert-f, name:stevenson-adlai-e, name:humphrey-hubert-h, name:brown-edmund-g, name:shriver-r-sargent, name:fulbright-j-william, name:wagner-robert-f-jr]
