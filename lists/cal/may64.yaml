  - id: cal.1964-05-26.civil-rights-bill
    when: May 26
    date: '1964-05-26'
    thread: civil-rights-bill
    c: Mansfield and Dirksen offer a clean bill as a substitute for H.R. 7152, worked out in Dirksen's office with Humphrey, Kuchel and Katzenbach. The Attorney General to sue on public accommodations and employment only against a "pattern or practice"; State and local agencies to act first where States have laws of their own. Check.
    n: '[110 Cong. Rec., Senate, May 26, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt9/pdf/GPO-CRECB-1964-pt9-6-1.pdf). [Civil Rights Act of 1964: Chronology](https://www.senate.gov/legislative/landmark-legislation/civil-rights-act-of-1964/civil-rights-chronology.htm) (Senate Historical Office). [[w.macneil-dirksen]]; [[w.hulsey-everett-dirksen-and-his]]; [[w.humphrey-education-of-a-public-1976]]. See [[cal.1964-02-10.civil-rights-bill]]. Names: Mansfield, Dirksen, Humphrey, Kuchel, Katzenbach.'
