  - id: cal.1962-08-31.china-leadership-5
    when: Aug. 31
    date: '1962-08-31'
    thread: china-leadership
    c: 'Deng Xiaoping 邓小平 sends Mao Zedong 毛泽东 and Liu Shaoqi 刘少奇 the revised draft decision on the control organs of Aug. 30, sent by Lu Dingyi 陆定一: discussed by the Secretariat with the regional first secretaries, with the list for the Control Commission''s by-election; print for the groups? some find the commissions'' duties set too high and against the Party constitution. On Lu''s letter: no control commissions at regional-bureau and prefectural level, standing groups sent from above if needed; "Party organizations" struck from the clause on state organs.'
