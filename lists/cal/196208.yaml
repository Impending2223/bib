    when: Aug. 12
    date: '1962-08-12'
    thread: china-leadership
    c: 'Mao has the Rural Work Department''s paper of Aug. 24, 1961, "How the Sixty Articles are being carried out," first circulated at the 1961 Lushan conference, circulated to this one, with a note: the department was then right, but Deng Zihui wavered a year later, seeing the situation as nearly all dark and pressing household contracting. He welcomes Deng''s self-criticism of Aug. 11, finding it still short.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 12, 1962 ("同日"). [[w.jianguo-yilai-mao-zedong]], XVI, 343–346 (Aug. 12, 1962; Mao''s note, dated Aug. 12; printed from the manuscript; the department was then right (the ten measures of part two, with the right handling of go-it-alone; the ten points on the situation of part one); after ten months, August 1961 to the end of May 1962, Deng wavered; tied to his reluctance on cooperatives before the summer 1955 meeting and his "four great freedoms"; Deng''s statement at the core group Aug. 11 welcome but not enough; notes 4–5 list the twenty points; note 6: the Center General Office''s notice of Mar. 9, 1981 rehabilitating Deng Zihui); [[w.mao-zedong-zhuan]], V, ch. 70 (Aug. 12: Mao finds the Rural Work Department''s paper of Aug. 24, 1961, on how the sixty articles were carried out, which he praised then). [[w.yang-jisheng-mubei]], II, 1129 n.36 (Mao''s comment of Aug. 12 on a document, sharply criticizing Deng Zihui: he has wavered, his view of the situation nearly all dark, and he vigorously promotes household contracting; this goes with his holding back from cooperatives before 1955, ordering the cutting of some hundreds of thousands and having no regard for them, and before that urging the "four great freedoms"; he has not linked it to his own bourgeois-democratic standpoint of 1950–55); [[w.yang-jisheng-tiandi-fanfu]], I, 77 (Mao: Deng Zihui wavered, saw the situation as nearly all dark, pressed contracting to households; the Rural Work Department later abolished, Deng given the empty post of deputy head of the Planning Commission). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 70). See [[cal.1962-08-11.china-leadership]]. Names: Mao Zedong, Deng Zihui. Check: the nianpu itself calls the note''s criticism of Deng Zihui mistaken ("错误地批评").'
