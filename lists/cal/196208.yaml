    when: Aug. 7
    date: '1962-08-07'
    thread: health
    c: Kelsey receives the President's Award for Distinguished Federal Civilian Service.
    n: 'Remarks Upon Presenting the President''s Awards for Distinguished Federal Civilian Service, [1962 Pub. Papers 604](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=664) (Aug. 7, 1962). See [[cal.1962-07-15.program]]. Names: Kelsey.'
