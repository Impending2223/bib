# Cal. XXXIII August 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXIII
entries:
  - id: cal.1962-08-01.foreign-aid
    when: Aug. 1
    date: '1962-08-01'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1962 signed, [76 Stat. 255](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg255.pdf). Hickenlooper amendment: no aid to a country that expropriates without compensation.'
    n: 'See [[cal.1961-03-22.foreign-aid]]. Names: Hickenlooper.'
    tags: [name:hickenlooper-bourke-b, name:kennedy-john-f]
  - id: cal.1962-08-01.albany
    when: Aug. 1
    date: '1962-08-01'
    thread: georgia-albany
    c: Press conference. Albany's refusal to negotiate "wholly inexplicable."
    n: News Conference, [1962 Pub. Papers 590](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=650) (Aug. 1, 1962). [[w.garrow-bearing-the-cross]], 212–13. See [[cal.1961-11-17.albany]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-08-01.opinion
    when: Aug. 1
    date: '1962-08-01'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: an income tax cut now, if it means more debt, 19 percent for, 72 against. Of those who call their taxes too high, 31 for, 61 against.'
    n: '[[w.gallup-poll]], III, 1777.'
  - id: cal.1962-08-01.state-constitutions-mi
    when: Aug. 1
    date: '1962-08-01'
    thread: state-constitutions
    c: Michigan's constitutional convention adjourns at Lansing, its constitution and address to the people adopted, after ten months. A four-year term for governor; a civil rights commission; a flat-rate income tax permitted, a graduated one forbidden (Check); Senate seats by population and area. To the voters Apr. 1, 1963.
    n: '[Michigan Constitutional Convention, *Official Record* (1962), 3290–3316](https://archive.org/details/sim_michigan-constitutional-convention-1961-official-record_1962/page/n1507). To check: [[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]. See [[cal.1961-10-03.states-and-cities]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1962-08-02.governors-tn
    when: Aug. 2
    date: '1962-08-02'
    thread: governors
    also: [elections-1962]
    c: 'Tennessee, Democratic primary for governor: Clement, governor 1953–59, over Olgiati, mayor of Chattanooga, 309,333 to 211,812, 42.5 percent; William Farris, of Memphis, 202,813, 27.9 percent. A plurality nominates.'
    n: 'Votes: Wikipedia, ["1962 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1962_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. To check: [[w.greene-lead-me-on]]. Names: Clement, Olgiati, Farris.'
    tags: [state:tn, name:clement-frank-g, name:olgiati-p-r, name:farris-william-w]
  - id: cal.1962-08-02.amendments
    when: Aug. 2
    date: '1962-08-02'
    thread: amendments
    also: [court, congress]
    c: Senate Judiciary Committee, Eastland's, hears witnesses on the amendments to permit prayer in the public schools, one of its two days of hearings after *Engel*. More than fifty such amendments introduced in Congress within three days of the decision, fifty-seven by the session's end. None reported.
    n: '*Prayers in Public Schools and Other Matters: Hearings before the Senate Committee on the Judiciary*, 87th Cong. (1962) (Check the other day and a digitized copy); the transcript of Aug. 2 cited by Robertson, [108 Cong. Rec. 17,593–94](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt13/pdf/GPO-CRECB-1962-pt13-6-1.pdf) (1962). [Congressional Research Service, *School Prayer: The Congressional Response, 1962–1998*](https://www.everycrsreport.com/reports/96-846.html) (1998). To check: [[w.dierenfield-battle-over-school-prayer]]. See [[cal.1962-06-25.court]]. Names: Eastland.'
    tags: [name:eastland-james-o]
  - id: cal.1962-08-02.georgia-albany
    when: Aug. 2
    date: '1962-08-02'
    thread: georgia-albany
    c: 'Washington, at night. Wulf of the ACLU, Haley of CORE, Wilkins and two others of the NAACP, Kunstler and Fauntroy for SCLC with Robert Kennedy and Burke Marshall on Albany: they ask the Department to join the movement''s two suits against the city. Kennedy and Marshall: the aim, face-to-face talks in Albany; King''s leaving part of any agreement.'
    n: '[[w.garrow-bearing-the-cross]], 213. See [[cal.1961-11-17.albany]]. Names: Wilkins, Robert F. Kennedy, Marshall, King.'
    tags: [name:wilkins-roy, name:kennedy-robert-f, name:marshall-burke, name:king-martin-luther-jr]
  - id: cal.1962-08-03.legislatures-ok
    when: Aug. 3
    date: '1962-08-03'
    thread: legislatures
    c: 'The Oklahoma court''s order: standards for the Legislature, meeting in January, to reapportion by; failing that, the court to do it.'
    n: '*Moss v. Burkhart*, [207 F. Supp. 885](https://static.case.law/f-supp/207/case-pdfs/0885-01.pdf) (W.D. Okla. 1962) (the order of Aug. 3). See [[cal.1962-06-19.legislatures-ok]].'
    tags: [state:ok]
  - id: cal.1962-08-03.opinion
    when: Aug. 3
    date: '1962-08-03'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: the government to act to improve business, 52 percent; not, 45. If it acts, a tax cut for all, 59; spending on public works, 28.'
    n: '[[w.gallup-poll]], III, 1777.'
  - id: cal.1962-08-06.economy
    when: Aug. 6
    date: '1962-08-06'
    thread: economy
    c: 'Kennedy and Mills on a tax cut, recorded. Mills against a quick, temporary cut: business and labor each want a different one; "Even if we made up our minds that we wanted a tax cut, we can''t win." Reform of oil depletion: "never happen."'
    n: '[Meeting with Wilbur Mills on the Tax Cut Proposal, 6:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-wilbur-mills-tax-cut-proposal), Tape 7 (Miller Center). [[w.zelizer-taxing-america]], 191, 195. See [[cal.1962-05-28.economy]]. Names: Kennedy, Mills.'
    tags: [name:kennedy-john-f, name:mills-wilbur-d]
  - id: cal.1962-08-07.program
    when: Aug. 7
    date: '1962-08-07'
    thread: health
    c: Kelsey receives the President's Award for Distinguished Federal Civilian Service.
    n: 'Remarks Upon Presenting the President''s Awards for Distinguished Federal Civilian Service, [1962 Pub. Papers 604](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=664) (Aug. 7, 1962). See [[cal.1962-07-15.program]]. Names: Kelsey.'
    tags: [name:kelsey-frances-o, name:kennedy-john-f]
  - id: cal.1962-08-07.state-constitutions-mo
    when: Aug. 7
    date: '1962-08-07'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Missouri, with the primary, refuses four amendments: pensions for employees of political subdivisions, 146,566 to 253,617, 36.6 percent; taxes above the limit for airports and university extension, 123,704 to 261,942, 32.1 percent; pensions for retired teachers, 179,601 to 210,093, 46.1 percent; the St. Louis school tax to three times the limit, 127,662 to 237,243, 35.0 percent.'
    n: '[*Official Manual, State of Missouri, 1963–1964*, 1255–1256](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/36575). See [[cal.1960-11-08.state-constitutions-mo]].'
    tags: [state:mo, city:st-louis]
  - id: cal.1962-08-07.governors-ks
    when: Aug. 7
    date: '1962-08-07'
    thread: governors
    also: [elections-1962]
    c: 'Kansas, governor. Democratic primary: Saffels over one other, 69,728 to 47,055, 59.7 percent. Republican: Governor Anderson over one other, 164,888 to 31,221, 84.1 percent.'
    n: 'Votes: Kan. Secretary of State, [*Election Statistics, 1962*, 21–22](https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/58/download#page=20): Saffels 69,728, Hart 47,055; Anderson 164,888, Crouch 31,221. To check: [[w.socolofsky-kansas-governors]]. Names: Anderson, Saffels.'
    tags: [state:ks, name:saffels-dale-e, name:anderson-john-jr]
  - id: cal.1962-08-07.middle-east-johnson-plan
    when: Aug. 7
    date: '1962-08-07'
    thread: middle-east-johnson-plan
    c: 'The Johnson Plan, Joseph E. Johnson''s for the PCC, drafted with State from July 17; Rusk sends it to Kennedy. Each refugee to state in confidence a preference: repatriation to Israel as a law-abiding resident, or compensation and resettlement in the Arab countries or elsewhere. Governments to decide whom they admit. UN compensation only to those resettled; $250 a head to every refugee on taking either course. Expected: one repatriated for nine resettled. The first year up to $100 million: Israel $40 million, the United States $30 million, others $30 million; some $1.2 billion over five to ten years for 1,100,000 refugees.'
    n: 'FRUS 1961–63, XVIII, doc. [15](https://history.state.gov/historicaldocuments/frus1961-63v18/d15) (the plan and its explanation printed there). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Rusk, Kennedy.'
    tags: [name:johnson-joseph-e, name:rusk-dean, name:kennedy-john-f]
  - id: cal.1962-08-08.georgia-albany
    when: Aug. 8
    date: '1962-08-08'
    thread: georgia-albany
    c: 'The Justice Department files a brief as friend of the court before Elliott, against the city''s injunction and for the movement''s two suits: Albany''s ordinances require segregation, and the city has closed "all avenues of demonstrative protest." King the last witness that afternoon.'
    n: '[[w.garrow-bearing-the-cross]], 214. Check: the brief. See [[cal.1961-11-17.albany]]. Names: Elliott, King.'
    tags: [name:elliott-j-robert, name:king-martin-luther-jr, state:ga, city:albany]
  - id: cal.1962-08-10.albany
    when: Aug. 10
    date: '1962-08-10'
    thread: georgia-albany
    also: [desegregation-public-places, king]
    c: 'King leaves Albany. Parks and library closed rather than integrated. King later: the mistake was attacking segregation in general.'
    n: '[[w.garrow-bearing-the-cross]], 214–15. To check: [[w.king-why-we-cant-wait]]. See [[cal.1961-11-17.albany]]. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1962-08-13.economy
    when: Aug. 13
    date: '1962-08-13'
    thread: economy
    c: Television address. No tax cut now; reduction and reform in January.
    n: 'Radio and Television Report to the American People on the State of the National Economy, [1962 Pub. Papers 611](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=671) (Aug. 13, 1962). [[w.stein-fiscal-revolution-in-america]], 424–25, 428; [[w.zelizer-taxing-america]], 196 (no cut now). See [[cal.1961-01-05.economy]]. Names: Heller, Dillon.'
    tags: [name:kennedy-john-f, name:heller-walter-w, name:dillon-c-douglas]
  - id: cal.1962-08-14.rules
    when: Aug. 14
    date: '1962-08-14'
    thread: rules
    c: Senate invokes cloture on the communications satellite bill, [63–27](https://voteview.com/rollcall/RS0870318), against a liberal filibuster. The first since 1927. Signed Aug. 31, [76 Stat. 419](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg419.pdf).
    n: 'Statute (K–J Cong. II.J.2). Senate cloture table (see [[cal.1961-09-19.rules]]). Names: Kefauver, Morse, Gore.'
    tags: [name:kennedy-john-f, name:kefauver-estes, name:morse-wayne, name:gore-albert-sr]
  - id: cal.1962-08-14.middle-east-johnson-plan
    when: Aug. 14
    date: '1962-08-14'
    thread: middle-east-johnson-plan
    c: 'White House, 4:45–5:35 p.m. Kennedy, Rusk, Feldman and Joseph Johnson on the Johnson Plan. Johnson: compensation for all, just over $1 billion; "free preference," not "free choice"; a trial run in fact. Kennedy: Israel cannot accept free choice of return; "We should start with the Israelis." The Hawk on the same agenda.'
    n: 'FRUS 1961–63, XVIII, doc. [19](https://history.state.gov/historicaldocuments/frus1961-63v18/d19) (notes of the conference). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Kennedy, Rusk, Feldman, Johnson.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:feldman-myer, name:johnson-joseph-e]
  - id: cal.1962-08-14.governors-ak
    when: Aug. 14
    date: '1962-08-14'
    thread: governors
    also: [elections-1962]
    c: 'Alaska''s primary. Democratic, for governor: Governor Egan over Byer, 13,698 to 5,275, 62.3 percent of the party''s vote; two others 3,021, 13.7 percent. Republican: Stepovich over Pollock, 6,415 to 5,247, 38.1 percent; three others 5,170, 30.7 percent.'
    n: 'Votes: [Alaska, *Official Returns, Primary Election (August 14, 1962)*, 6](https://www.elections.alaska.gov/Core/Archive/62PRIM/62prim.pdf#page=7) (statewide totals; persons voting 41,140). To check: [[w.naske-alaska]]. Names: Egan. Check: whether Stepovich is Mike Stepovich, governor of the Territory, and Pollock Howard W. Pollock.'
    tags: [state:ak, name:egan-william-a]
  - id: cal.1962-08-14.republican-party
    when: Aug. 14
    date: '1962-08-14'
    thread: republican-party
    also: [goldwater]
    c: Washington State's Republicans resolve that Goldwater is the party's only genuine spokesman.
    n: '[[w.perlstein-before-the-storm]], 183. To check: the press release of Aug. 14, 1962, William A. Rusher Papers, Library of Congress (cited by [[w.perlstein-before-the-storm]], 183 n.3). Check: the date, the release''s. Names: Goldwater.'
    src:
      c: de09750d
      rows:
        - 'w.perlstein-before-the-storm 183: all'
        - 'via w.perlstein-before-the-storm 183 n.3: all'
    tags: [name:goldwater-barry-m, state:wa]
  - id: cal.1962-08-15.middle-east
    when: Aug. 15–16
    date: '1962-08-15'
    thread: middle-east
    c: The Hawk. Kennedy writes Ben Gurion, Aug. 15, and Nasser, Aug. 16.
    n: 'FRUS 1961–63, XVIII, docs. [21](https://history.state.gov/historicaldocuments/frus1961-63v18/d21), [22](https://history.state.gov/historicaldocuments/frus1961-63v18/d22). To check: [[w.gazit-president-kennedys-policy-toward]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.ben-zvi-decade-of-transition]]; [[w.bass-support-any-friend]]; [[w.ben-zvi-lyndon-b-johnson-and]]. See [[cal.1961-05-30.middle-east]]. Names: Kennedy, Ben Gurion, Nasser.'
    tags: [name:kennedy-john-f, name:ben-gurion-david, name:nasser-gamal-abdel]
  - id: cal.1962-08-16.conservation
    when: Aug. 16–18
    date: '1962-08-16'
    thread: conservation
    c: Fryingpan–Arkansas project signed, [76 Stat. 389](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg389.pdf). Aug. 17, Kennedy at Pueblo and at the dedication of the Oahe Dam on the Missouri at Pierre, S.D.; Aug. 18, at the ground-breaking for the San Luis Dam at Los Banos, Cal., with Brown, and at Fresno, after inspecting the western projects.
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing Bill Authorizing the Fryingpan-Arkansas Project, [1962 Pub. Papers 620](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=680) (Aug. 16, 1962); Remarks in Pueblo, Colorado Following Approval of the Fryingpan-Arkansas Project, [1962 Pub. Papers 625](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=685); Remarks at the Dedication of the Oahe Dam, Pierre, South Dakota, [1962 Pub. Papers 621](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=681) (Aug. 17, 1962); Remarks in Los Banos, California, at the Ground-Breaking Ceremonies for the San Luis Dam, [1962 Pub. Papers 627](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=687); Remarks at the Air Terminal in Fresno, California, After Inspecting Western Conservation Projects, [1962 Pub. Papers 630](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=690) (Aug. 18, 1962). To check: [[w.smith-john-kennedy-stewart-udall]]. See [[cal.1961-02-23.conservation]]. Names: Brown.'
    tags: [name:kennedy-john-f, name:brown-edmund-g]
  - id: cal.1962-08-17.berlin-and-vienna
    when: Aug. 17
    date: '1962-08-17'
    thread: berlin-and-vienna
    c: Peter Fechter, eighteen, shot at the wall. Dies unaided in sight of the West. Riots in West Berlin.
    n: 'FRUS 1961–63, XV, docs. [95](https://history.state.gov/historicaldocuments/frus1961-63v15/d95), [96](https://history.state.gov/historicaldocuments/frus1961-63v15/d96). See [[cal.1961-08-13.berlin-and-vienna]]. Names: Fechter.'
    tags: [name:fechter-peter]
  - id: cal.1962-08-19.middle-east
    when: Aug. 19
    date: '1962-08-19'
    thread: middle-east
    also: [middle-east-johnson-plan]
    c: 'Feldman to Ben Gurion and Meir: the President has decided to make the Hawk available to Israel; Nasser to be told. Feldman asks Israel to let Joseph Johnson''s plan for the Palestine refugees go forward.'
    n: 'FRUS 1961–63, XVIII, doc. [24](https://history.state.gov/historicaldocuments/frus1961-63v18/d24). See [[cal.1962-08-15.middle-east]]. Names: Feldman, Ben Gurion, Meir, Nasser, Joseph Johnson.'
    tags: [name:feldman-myer, name:ben-gurion-david, name:meir-golda, name:nasser-gamal-abdel, name:kennedy-john-f, name:johnson-joseph-e]
  - id: cal.1962-08-22.missile-crisis
    when: Aug. 22–23
    date: '1962-08-22'
    thread: missile-crisis
    c: 'McCone warns Kennedy the shipments may include offensive missiles. Aug. 23: NSAM 181, contingency planning.'
    n: '[NSAM No. 181](https://history.state.gov/historicaldocuments/frus1961-63v10/d386) (Aug. 23, 1962). [FRUS vol. 10](https://history.state.gov/historicaldocuments/frus1961-63v10). To check: [[w.robarge-john-mccone-as-director]]. See [[cal.1962-05-24.missile-crisis]]. Names: McCone.'
    tags: [name:mccone-john-a, name:kennedy-john-f]
  - id: cal.1962-08-22.opinion
    when: Aug. 22
    date: '1962-08-22'
    thread: opinion
    also: [medicare]
    c: 'Gallup, July 26–31: 81 percent have heard of Kennedy''s Medicare plan; of them, half know it is paid through Social Security. Medicare through Social Security, 44; voluntary private insurance, 40.'
    n: '[[w.gallup-poll]], III, 1781.'
    tags: [name:kennedy-john-f]
