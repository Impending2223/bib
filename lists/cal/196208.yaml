    when: Aug. 3
    date: '1962-08-03'
    thread: press-and-broadcasting
    also: [king, georgia-albany]
    c: '*Time*: King "has failed to convince Albany''s Negroes"; "too much success has drained him of the captivating fervor that made him famous." An anonymous Negro: King "doesn''t even speak for the Baptist ministry, let alone 20 million Negroes."'
    n: '[[w.branch-parting-the-waters]], 625. To check: Time, Aug. 3, 1962, 12–13 (cited by [[w.branch-parting-the-waters]], 625 n.5). Names: Martin Luther King.'
