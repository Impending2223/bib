    thread: cuba
    c: 'McCone''s morning briefing, by Harvey''s account. Harvey: the question of assassination inappropriate "in this form and at that forum." McCone agrees; he had, the afternoon or evening before, personally called the one who made the proposal; "if I got myself involved in something like this, I might end up getting myself excommunicated." Harvey says nothing of the operation through Rosselli.'
