  - id: cal.1962-08-01.albany
    when: Aug. 1
    date: '1962-08-01'
    thread: georgia-albany
    also: [economy]
    c: 'Press conference. Albany''s refusal to negotiate "wholly inexplicable." Gallup''s 72 percent against a tax cut that adds to the debt: "we are going to wait until we get the July figures."'
    n: 'News Conference, [1962 Pub. Papers 590](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=650) (Aug. 1, 1962). [[w.garrow-bearing-the-cross]], 212–13; [[w.branch-parting-the-waters]], 624. [[w.reeves-president-kennedy]], 331 (the tax cut). To check: New York Times, Aug. 2, 1962, 1; Atlanta Constitution, Aug. 2, 1962, 1; Albany Herald, Aug. 2, 1962, 1 (cited by [[w.garrow-bearing-the-cross]], 212 n.39). See [[cal.1961-11-17.albany]]. Names: Kennedy.'
