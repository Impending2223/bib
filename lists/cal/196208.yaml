  - id: cal.1962-08-15.china-leadership
    when: Aug. 15
    date: '1962-08-15'
    place: beidaihe
    thread: china-leadership
    c: 'Beidaihe. Mao at the core group, Li Fuchun, Tan Zhenlin and Kang Sheng speaking. The estimate of the situation, by March, May and August, has come back to the January conference''s; recovery perhaps two years more, this year and next, with the tail in 1964; "low standard, vegetables-and-substitutes" no more; blind command ended, high procurement mended. The year: work conference in August, plenum in September, another work conference in November for next year''s plan.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 15, 1962. [[w.macfarquhar-origins-of-the-cultural]], III, 276 (in remarks of Aug. 9, 15 and 20 Mao berates colleagues who "energetically trumpet individual operation and darkness" and "eagerly discuss shortcomings and errors": "We have been discussing difficulties and darkness for two years now; it''s become illegal to discuss brightness"); [[w.yang-shangkun-riji]], II, 204 (Aug. 15, 1962; the core group, afternoon; the Central Committee''s plenum set for Sept. 1, in Peking, its members to report Aug. 25 and read the papers first; Mao not named); [[w.deng-xiaoping-nianpu-1904]], III, 1722 (Aug. 13, 15 and 17, 1962; Deng at Mao''s core group, the 15th); [[w.mao-zedong-zhuan]], V, ch. 70 n.47 (Aug. 15: the core group hears Li Fuchun, Tan Zhenlin and Kang Sheng; Mao: in industry and agriculture the base is to raise output; recovery needs two years more, this year and next, with the tail in 1964; no more blind command, high procurement corrected). [[w.yang-jisheng-mubei]], II, 1128–1129 n.35 (Aug. 15: some have no drive left; they drive the go-it-alone drive, the dark drive, the drive to talk of faults; with talk of the bright side, the successes and the collective economy they would have none). Made public: 2013. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 204) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 70), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1074 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 276 n.88a); [[w.zedong-ziliao-xuanbian-selection-of]], 271 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 276 n.88b); Record of the core group 中心小组会议记录, Central Work Conference, Aug. 15, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.47). See [[cal.1962-08-11.china-leadership]]. Names: Mao Zedong, Li Fuchun, Tan Zhenlin, Kang Sheng.'
