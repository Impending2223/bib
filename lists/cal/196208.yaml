    c: 'The Central work group 中央工作組 (the United Front Work Department''s group 統戰部小組) issues no. 12 of its Situation Bulletin 《情況簡報》, "Household contracting in Xinglong district, Jiangbei county, Sichuan" 《四川省江北縣興隆區包產到戶的情況》. Household contracting and other going it alone are general and grave: in the district''s 591 production teams last year''s sweet potatoes were contracted almost wholly, this spring''s small crop about 60 percent. The reasons it gives the peasants include that contracting raises zeal, that who works well eats more, that losses are one''s own and so watched, and that collective farming brings hunger and contracting does not. Of the district''s 328 brigade cadres 40 percent, and of its 454 team heads 51 percent, have been struggled against or punished since 1958.'
