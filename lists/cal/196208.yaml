    c: The Special Group (Augmented), Rusk in the chair, McNamara present. Against the stepped-up Course B Plus, for McCone's "CIA variant." By McCone's chronology, he expects Soviet medium-range missiles in Cuba. The killing of Cuba's leaders raised and kept out of the record, by Harvey's memorandum of Aug. 14 and McCone's of 1967.
