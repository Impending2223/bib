  - id: cal.1962-08-01.opinion
    when: Aug. 1
    date: '1962-08-01'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: an income tax cut now, if it means more debt, 19 percent for, 72 against. Of those who call their taxes too high, 31 for, 61 against.'
    n: '[[w.gallup-poll]], III, 1777.'
  - id: cal.1962-08-01.state-constitutions-mi
    when: Aug. 1
    date: '1962-08-01'
    thread: state-constitutions
    c: Michigan's constitutional convention adjourns at Lansing, its constitution and address to the people adopted, after ten months. A four-year term for governor; a civil rights commission; a flat-rate income tax permitted, a graduated one forbidden (Check); Senate seats by population and area. To the voters Apr. 1, 1963.
    n: '[Michigan Constitutional Convention, *Official Record* (1962), 3290–3316](https://archive.org/details/sim_michigan-constitutional-convention-1961-official-record_1962/page/n1507). To check: [[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]. See [[cal.1961-10-03.states-and-cities]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1962-08-02.governors-tn
    when: Aug. 2
    date: '1962-08-02'
    thread: governors
    also: [elections-1962]
    c: 'Tennessee, Democratic primary for governor: Clement, governor 1953–59, over Olgiati, mayor of Chattanooga, 309,333 to 211,812, 42.5 percent; William Farris, of Memphis, 202,813, 27.9 percent. A plurality nominates.'
    n: 'Votes: Wikipedia, ["1962 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1962_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. To check: [[w.greene-lead-me-on]]. Names: Clement, Olgiati, Farris.'
    tags: [state:tn, name:clement-frank-g, name:olgiati-p-r, name:farris-william-w]
  - id: cal.1962-08-02.amendments
    when: Aug. 2
    date: '1962-08-02'
    thread: amendments
    also: [court, congress]
    c: Senate Judiciary Committee, Eastland's, hears witnesses on the amendments to permit prayer in the public schools, one of its two days of hearings after *Engel*. More than fifty such amendments introduced in Congress within three days of the decision, fifty-seven by the session's end. None reported.
    n: '*Prayers in Public Schools and Other Matters: Hearings before the Senate Committee on the Judiciary*, 87th Cong. (1962) (Check the other day and a digitized copy); the transcript of Aug. 2 cited by Robertson, [108 Cong. Rec. 17,593–94](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt13/pdf/GPO-CRECB-1962-pt13-6-1.pdf) (1962). [Congressional Research Service, *School Prayer: The Congressional Response, 1962–1998*](https://www.everycrsreport.com/reports/96-846.html) (1998). To check: [[w.dierenfield-battle-over-school-prayer]]. See [[cal.1962-06-25.court]]. Names: Eastland.'
    tags: [name:eastland-james-o]
