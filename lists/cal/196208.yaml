  - id: cal.1962-08-04.georgia-albany
    when: Aug. 4
    date: '1962-08-04'
    thread: georgia-albany
    c: 'Saturday. Nine women and four men march from Shiloh to City Hall; after half an hour''s vigil Pritchett tells them they are "sung out and prayed out" and takes them to jail at dusk. King in jail: no work details, the movement''s women bring food and pajamas.'
    n: '[[w.branch-parting-the-waters]], 625–26. To check: S. A. Roos, memorandum, Aug. 4, 1962, Albany city records (cited by [[w.branch-parting-the-waters]], 626 n.2); King''s diary, Jet, Aug. 23, 1962, 20 (cited by [[w.branch-parting-the-waters]], 626 n.3). See [[cal.1962-07-27.albany]]. Names: Martin Luther King.'
