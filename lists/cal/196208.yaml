      c: e39c0834
      rows:
        - 'w.branch-parting-the-waters 625–26: all'
        - 'via w.branch-parting-the-waters 626 n.2: A'
    tags: [name:king-martin-luther-jr, state:ga, city:albany-ga]
  - id: cal.1962-08-06.economy
    when: Aug. 6
    date: '1962-08-06'
    thread: economy
    c: 'Kennedy and Mills on a tax cut, recorded. Mills against a quick, temporary cut: business and labor each want a different one; "Even if we made up our minds that we wanted a tax cut, we can''t win." Reform of oil depletion: "never happen."'
    n: '[Meeting with Wilbur Mills on the Tax Cut Proposal, 6:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-wilbur-mills-tax-cut-proposal), Tape 7 (Miller Center). [[w.zelizer-taxing-america]], 191, 195. [[w.reeves-president-kennedy]], 333–34 (the recorded talk). See [[cal.1962-05-28.economy]]. Names: Kennedy, Mills.'
