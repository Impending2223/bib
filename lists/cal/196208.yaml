    n: 'Letter to Justice Frankfurter Upon His Retirement From the Supreme Court, [1962 Pub. Papers 656](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=716) (Aug. 29, 1962); News Conference, [1962 Pub. Papers 648](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=708) (Aug. 29, 1962). To check: [[w.stebenne-arthur-j-goldberg]]. See [[cal.1961-01-23.court]]. Names: Goldberg, Wirtz, Frankfurter.'
