  - id: cal.1962-08-08.georgia-albany
    when: Aug. 8
    date: '1962-08-08'
    thread: georgia-albany
    c: 'The Justice Department files a brief as friend of the court before Elliott, against the city''s injunction and for the movement''s two suits: Albany''s ordinances require segregation, and the city has closed "all avenues of demonstrative protest." King the last witness that afternoon.'
    n: '[[w.garrow-bearing-the-cross]], 214; [[w.branch-parting-the-waters]], 627–28. Check: Branch, 627–28, has Jerry Heilbron file the brief: the city does not come "with clean hands"; no federal ban on "demonstrations seeking to introduce constitutional rights into Albany." The Times: "U.S. Intervenes on Negroes'' Side"; King hails its "legal and moral support" (New York Times, Aug. 9, 1962, 9). To check: "Brief for the United States . . .," Aug. 8, 1962, ACLU Papers, box 35, Mudd Library, Princeton; trial transcript, vol. 4, 1138-71 (King''s testimony, Aug. 8, 1962), Albany''s suit against the movement, M.D. Ga., trial record, Middle District of Georgia; New York Times, Aug. 9, 1962, 1; Atlanta Constitution, Aug. 9, 1962, 1; Albany Herald, Aug. 8 and 9, 1962, 1 (cited by [[w.garrow-bearing-the-cross]], 214 n.41). Check: the brief. See [[cal.1961-11-17.albany]]. Names: Elliott, King.'
