  - id: cal.1962-08.china-leadership-9
    when: Aug., at the Beidaihe conference
    date: 1962-08
    at: before 1962-08-06
    place: beidaihe
    thread: china-leadership
    c: 'Beidaihe, the leaders'' summer conference. Mao takes the offensive: his colleagues have "capitulated to the bourgeoisie" with the adjustments of the past year and a half. He condemns Wang Jiaxiang, who had called in the spring for less tension with the Soviet Union and the United States.'
    n: '[[w.westad-introduction]], 27; [[w.jian-chinese-politics-and-the]], 276 (Mao calls Wang''s ideas conciliation toward the imperialists, revisionists and reactionaries, with less support for those fighting them, "three reconciliations and one reduction"; no day or place). Made public: 1993 ([[w.teiwes-politics-and-purges-in]], 375, cited by [[w.westad-introduction]], 27 n.98). To check: [[w.teiwes-politics-and-purges-in]], 375 (cited by [[w.westad-introduction]], 27 n.98); Zhang Baijia, Looking at Sino-American Relations during the Cold War from the Chinese Perspective, paper, Hong Kong, Jan. 1996, 15 (cited by [[w.westad-introduction]], 27 n.98); [[w.jin-1949-1989-niande-zhongguo]], 576–77, 579 (cited by [[w.jian-chinese-politics-and-the]], 276 n.152; the note prints the title *Quzhe qianjin de suiyue*). Names: Mao Zedong. Check: the day: Westad gives the summer conference at Beidaihe; the calendar has the Central Work Conference there Aug. 6–24, 1962.'
    src:
      c: '54222274'
      rows:
        - 'w.westad-introduction 27: all'
        - 'w.jian-chinese-politics-and-the 276: ?'
        - 'via x.1996-01.zhang-baijia-looking-at-sino-american-relations: all'
    tags: [polity:prc, vis:only:prc, name:mao-zedong]
  - id: cal.1962-08-31.china-leadership-6
    when: Aug. 31
    date: '1962-08-31'
    place: moscow
    thread: china-leadership
    also: [soviet-union, africa]
    c: 'The Chinese Embassy at Moscow, top-secret report to the Foreign Ministry on Soviet policy in Asia, Africa and Latin America since the congress: a hardening, tactical not fundamental; the Soviets now allow armed struggle is sometimes needed, disarmament for the nuclear powers first, arms still for those fighting for independence; the "corrections" change nothing, the Soviets still woo bourgeois ruling groups, divide the revolutionary forces and work against China''s influence, exploiting its "temporary economic difficulties."'
    n: '[[w.friedman-shadow-cold-war]], 91–92, 98. Made public: 2015. To check: PRC embassy Moscow to MFA, top secret report on Soviet policy in Asia, Africa, Latin America after 22nd Congress, August 31, 1962, CFMA doc. 109-03215-01, 15–21 (cited by [[w.friedman-shadow-cold-war]], 92 n.148); PRC embassy Moscow to MFA, top secret report on Soviet policy in Asia, Africa, Latin America after 22nd Congress, August 31, 1962, CFMA doc. 109-03215-01, 18 (cited by [[w.friedman-shadow-cold-war]], 92 n.149); PRC embassy Moscow to MFA, top secret report on Soviet activity in Asia, Africa, and Latin America after Twenty-Second Congress, August 31, 1962, CFMA doc. 109-03215-01, 20 (cited by [[w.friedman-shadow-cold-war]], 98 n.192).'
    src:
