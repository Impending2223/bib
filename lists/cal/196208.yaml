  - id: cal.1962-08-17.china-leadership
    when: Aug. 17
    date: '1962-08-17'
    thread: china-leadership
    c: 'Zhou Enlai at the conference''s center group. Class struggle is long and complex; going it alone and responsibility fields are to be seen in essence and analyzed. For a time the difficulties were told too much, which hurt the Party; some old workers asked to stay at the plant and refused severance pay. Two attitudes: overcome the difficulties or despair. By July the cities had cut 8.9 million with no great trouble, a first in the Party''s history; the city and village population concepts are confused; money has been drawn back and inflation is past.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 493 (Aug. 17, 1962); [[w.yang-shangkun-riji]], II, 204 (Aug. 17, 1962; 2 to 5 p.m.; Zhou Enlai not named); [[w.mao-zedong-zhuan]], V, ch. 70 n.48 (Aug. 17, the core group, Mao present, the conference turning to commerce, prices and grain; Li Xiannian and Zhou Enlai speak; Mao: a lifetime of war and he forgot the class struggle, now not bloody as then; Li: purchases less, imports 5.4 million tons last year, 4.7 this; free-market prices halved, grain''s to a quarter; Mao: supply and demand; have Tan Zhenlin speak of the situation and Li of the difficulties, an occupational disease). Continues 494. [[w.jian-zhou-enlai]], 469 (Aug. 17, after missing the first days for diplomacy in Peking: Mao''s issues "very sharp, very important, and very timely"; class struggle long; a trying time but not complete darkness; the ministries'' work since early 1962 to be recognized); [[w.peng-zhen-nianpu-1902]], IV, 212 (Aug. 17, 1962, afternoon; Peng Zhen at the core group, Mao presiding, hearing the groups; Li Xiannian asks whether grain, cotton and oil may enter the free market; Mao: better let it, since the free market exists and trades, let it come into the open and move grain). Made public: 1997. To check: Record of the core group 中心小组会议记录, Central Work Conference, Aug. 17, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.48); Zhou''s speech at the Beidaihe Conference, August 17, 1962 (cited by [[w.jian-zhou-enlai]], 469 n.21a); [[w.zhou-enlai-zhuan-1949]], 691 (cited by [[w.jian-zhou-enlai]], 469 n.21b). Names: Zhou Enlai.'
