    c: 'Recorder''s court, Judge Durden. C. B. King, bandaged: the charges a cover for segregation. The city attorney: Albany no longer enforces segregation laws against federal rulings. King, Abernathy, Anderson and Slater King guilty, each $200 and sixty days, suspended so long as they break no law; the segregation ordinances, Durden says, overruled by the Supreme Court. Kelley: "I think the Attorney General''s intervention ... has given Dr. King plenty of reason to leave."'
    n: '[[w.branch-parting-the-waters]], 628–29. To check: [*New York Times*, Aug. 11, 1962](https://timesmachine.nytimes.com/timesmachine/1962/08/11/issue.html), at 1 (cited by [[w.branch-parting-the-waters]], 628 n.3). See [[cal.1962-07-27.albany]]. Names: Martin Luther King, Abernathy, Anderson.'
