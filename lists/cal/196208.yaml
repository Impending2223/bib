    n: '[FRUS 1961–63, XVIII, doc. 29](https://history.state.gov/historicaldocuments/frus1961-63v18/d29) (editorial note: Tehran). Names: Johnson, Pahlavi, Alam.'
    tags: [name:johnson-lyndon-b, name:pahlavi-mohammed-reza, name:alam-assadollah]
