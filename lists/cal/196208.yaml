  - id: cal.1962-08-13.china-leadership-7
    when: Aug. 13
    date: '1962-08-13'
    place: beidaihe
    thread: china-leadership
    c: 'Beidaihe 北戴河. The core group 中心小组, Mao 毛泽东 present; Luo Ruiqing 罗瑞卿 and Peng Zhen 彭真 speak. Mao asks whether China will be free of revisionism: the son may not bring it, the grandson will, and the grandson''s grandson will bring Marxism-Leninism back, as dialectics has it. Luo quotes Qian Rangneng''s letter that farm output cannot recover without household contracting; Mao: Jiangxi did not follow it and did well, Shandong was ruined and recovers fast, Henan has risen, ten Peking counties will reach 1957 this year. Luo: senior army officers dislike the dark accounts; Mao: the soldiers see light, the local cadres dark, as Zhou Xing of Shandong did. Deng Zihui makes his self-criticism again; Mao: it contradicts his league of poor peasants.'
    n: '[[w.mao-zedong-zhuan]], V, ch. 70 n.46. [[w.peng-zhen-nianpu-1902]], IV, 211–212 (Aug. 13, 1962, afternoon; the core group, Mao presiding, on his speech of Aug. 6; Peng Zhen: farming better than the year before; construction cut from over 1,000 projects to over 600; streamlining of the great cities and central enterprises nearly done; currency withdrawn; now to turn to output; in the cities output, living and political work; prices of eighteen goods held, workers under 12 yuan a month subsidized; power devolved too far after 1958, some now to be left to localities and enterprises (construction, shares of output, provincial grain, wage totals, stocks); the cities to support the villages, industry agriculture; an independent, complete industrial system step by step, gaps filled; streamlining finished; idle townspeople given work; coal and timber still short). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Record of the core group 中心小组会议记录, Central Work Conference, Aug. 13, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.46); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1962-08-11.china-leadership]]. Names: Mao Zedong, Luo Ruiqing, Peng Zhen.'
    src:
