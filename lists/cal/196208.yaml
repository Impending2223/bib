    when: Aug. 6
    date: '1962-08-06'
    thread: robert-kennedy
    also: [antisubversion]
    c: 'Robert Kennedy at the Seattle World''s Fair, a press conference. Asked of a study charging Hoover with "sententious poppycock" on the Communist Party: the party is small because Hoover has controlled it so well. "I hope he will serve the country for many, many years to come."'
    n: '[[w.branch-parting-the-waters]], 627. To check: Seattle Times, Aug. 7, 1962, 1; Newsweek, Aug. 20, 1962, 29 (cited by [[w.branch-parting-the-waters]], 627 n.2). Check: the day; after Mass at Gilroy, Calif., Aug. 5. Names: Robert Kennedy, Hoover.'
    src:
