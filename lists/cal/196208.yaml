  - id: cal.1962-08-06.vietnam
    when: Aug. 6
    date: '1962-08-06'
    thread: vietnam
    c: 'Forrestal to Kaysen: "I sense ... that we have been pussy-footing with Diem for too long. It seems easier to talk about crop destruction than about means of pressuring Diem to do what we think must be done"; "I don''t think we have much time to decide whether to stay with SVN on our terms or get out."'
    n: '[[w.preston-war-council]], 110. To check: Forrestal to Kaysen, Aug. 6, 1962, NSF, Country File, Vietnam, box 196A, Kennedy Library (cited by [[w.preston-war-council]], 110 n.26). Names: Forrestal, Kaysen, Ngô Đình Diệm.'
