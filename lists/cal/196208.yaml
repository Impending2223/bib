    c: Canton, Baiyun airport. Zhou Enlai talks with Phạm Văn Đồng. Per the Chinese record, in the waiting room at 7:30 a.m., Phạm says he will report to the Politburo on the two matters Zhou raised the day before, that South Vietnam's revolution must rely on itself, and that the Lao forces at Nam Tha, short of food, are near disbanding and need China's help, and Zhou asks for a list. Zhou says the Soviet Union should resume its air transport to Laos, if need be at Souvanna Phouma's request, or China and the DRV should take it on by agreement with Laos, and Phạm says he will write Sihanouk in support of his proposal.
