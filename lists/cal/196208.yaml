  - id: cal.1962-08-01.opinion
    when: Aug. 1
    date: '1962-08-01'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: an income tax cut now, if it means more debt, 19 percent for, 72 against. Of those who call their taxes too high, 31 for, 61 against.'
    n: '[[w.gallup-poll]], III, 1777.'
  - id: cal.1962-08-01.state-constitutions-mi
    when: Aug. 1
    date: '1962-08-01'
    thread: state-constitutions
    c: Michigan's constitutional convention adjourns at Lansing, its constitution and address to the people adopted, after ten months. A four-year term for governor; a civil rights commission; a flat-rate income tax permitted, a graduated one forbidden (Check); Senate seats by population and area. To the voters Apr. 1, 1963.
    n: '[Michigan Constitutional Convention, *Official Record* (1962), 3290–3316](https://archive.org/details/sim_michigan-constitutional-convention-1961-official-record_1962/page/n1507). To check: [[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]. See [[cal.1961-10-03.states-and-cities]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1962-08-01.berlin-and-vienna
    when: Aug. 1
    date: '1962-08-01'
    thread: berlin-and-vienna
    also: [intelligence]
    c: 'A Special National Intelligence Estimate, "Soviet Intentions with Respect to Berlin": "the Soviets are probably convinced that no important change in the Western position can be obtained without greatly increased pressures"; harassment in the air corridors expected, nothing more, as they "almost certainly recognize that the balance of military power has undergone no change."'
    n: '[[w.fursenko-khrushchevs-cold-war]], 449. To check: SNIE, "Soviet Intentions with Respect to Berlin," Aug. 1, 1962, NSF, box 100, LBJ Library (cited by [[w.fursenko-khrushchevs-cold-war]], 449 n.36).'
    src:
      c: 867c0c0e
      rows:
        - 'w.fursenko-khrushchevs-cold-war 449: all'
  - id: cal.1962-08-02.governors-tn
    when: Aug. 2
    date: '1962-08-02'
    thread: governors
    also: [elections-1962]
    c: 'Tennessee, Democratic primary for governor: Clement, governor 1953–59, over Olgiati, mayor of Chattanooga, 309,333 to 211,812, 42.5 percent; William Farris, of Memphis, 202,813, 27.9 percent. A plurality nominates.'
    n: 'Votes: Wikipedia, ["1962 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1962_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. To check: [[w.greene-lead-me-on]]. Names: Clement, Olgiati, Farris.'
    tags: [state:tn, name:clement-frank-g, name:olgiati-p-r, name:farris-william-w]
  - id: cal.1962-08-02.amendments
    when: Aug. 2
    date: '1962-08-02'
    thread: amendments
    also: [court, congress]
    c: Senate Judiciary Committee, Eastland's, hears witnesses on the amendments to permit prayer in the public schools, one of its two days of hearings after *Engel*. More than fifty such amendments introduced in Congress within three days of the decision, fifty-seven by the session's end. None reported.
    n: '*Prayers in Public Schools and Other Matters: Hearings before the Senate Committee on the Judiciary*, 87th Cong. (1962) (Check the other day and a digitized copy); the transcript of Aug. 2 cited by Robertson, [108 Cong. Rec. 17,593–94](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt13/pdf/GPO-CRECB-1962-pt13-6-1.pdf) (1962). [Congressional Research Service, *School Prayer: The Congressional Response, 1962–1998*](https://www.everycrsreport.com/reports/96-846.html) (1998). To check: [[w.dierenfield-battle-over-school-prayer]]. See [[cal.1962-06-25.court]]. Names: Eastland.'
    tags: [name:eastland-james-o]
  - id: cal.1962-08-02.georgia-albany
    when: Aug. 2
    date: '1962-08-02'
    thread: georgia-albany
    c: 'Washington, at night. Wulf of the ACLU, Haley of CORE, Wilkins and two others of the NAACP, Kunstler and Fauntroy for SCLC with Robert Kennedy and Burke Marshall on Albany: they ask the Department to join the movement''s two suits against the city. Kennedy and Marshall: the aim, face-to-face talks in Albany; King''s leaving part of any agreement.'
    n: '[[w.garrow-bearing-the-cross]], 213; [[w.branch-parting-the-waters]], 625. Check: Branch, 625, has Marshall tell Robert Kennedy beforehand that Albany''s demonstrations were "not Roy''s style"; Clarence Mitchell asks the Department to act, arrest somebody, file a suit, protect a march; Kennedy: "You know as well as I do, Clarence, that we have done what we can do under existing law. ... We could do a great deal more if our hands weren''t tied" (Kunstler, *Deep in My Heart*, 118–19; Doar to Robert Kennedy, Aug. 7, 1962). To check: Melvin Wulf to Robert Kennedy, "Suggestions on Albany . . .," Aug. 2, 1962, ACLU Papers, box 35, Mudd Library, Princeton; Melvin Wulf to Robert Kennedy, Aug. 3, 1962, ACLU Papers, box 35, Mudd Library, Princeton (cited by [[w.garrow-bearing-the-cross]], 213 n.40). See [[cal.1961-11-17.albany]]. Names: Wilkins, Robert F. Kennedy, Marshall, King.'
    src:
      c: f6e1358a
      rows:
        - 'w.garrow-bearing-the-cross 213: all'
        - 'via w.garrow-bearing-the-cross 213 n.40a: B'
        - 'via w.garrow-bearing-the-cross 213 n.40b: all'
        - 'w.branch-parting-the-waters 625: B'
        - 'via w.branch-parting-the-waters 625 n.3b: B'
    tags: [name:wilkins-roy, name:kennedy-robert-f, name:marshall-burke, name:king-martin-luther-jr]
  - id: cal.1962-08-02.georgia-albany-2
    when: Aug. 2
    date: '1962-08-02'
    thread: georgia-albany
    c: 'Anderson and Slater King to Mayor Kelley, by telegram, 3:41 p.m., on the President''s words: "We earnestly desire reconciliation in the Albany community, not victory." Kelley will not talk with "lawbreakers"; the President''s statement "incredible."'
    n: '[[w.branch-parting-the-waters]], 624. To check: Anderson and Slater King to Kelley, Aug. 2, 1962, Albany city records (cited by [[w.branch-parting-the-waters]], 624 n.3). Check: the day of Kelley''s answer. See [[cal.1962-08-01.albany]]. Names: Anderson.'
    src:
      c: 859b37a3
      rows:
        - 'w.branch-parting-the-waters 624: all'
        - 'via w.branch-parting-the-waters 624 n.3: A'
    tags: [name:anderson-william-g, state:ga, city:albany-ga]
  - id: cal.1962-08-02.georgia-albany-3
    when: Aug. 2
    date: '1962-08-02'
    thread: georgia-albany
    also: [civil-rights-the-executive]
    c: 'Russell in the Senate on the President''s words: the highest "stamp of approval" to the Negro lawbreakers; it will "encourage the importation of many other professionals and notoriety seekers"; the motive, votes for Edward Kennedy in Massachusetts. Talmadge: King leads "a violent, calculated campaign to damage the United States in foreign affairs and to set race against race"; the troubles would end if "outside agitators" left.'
    n: '[[w.branch-parting-the-waters]], 624–25. To check: Albany Herald, Aug. 3, 1962, 1; New York Times, Aug. 4, 1962, 11 (cited by [[w.branch-parting-the-waters]], 624 n.4); the Congressional Record. Check: the day of each. See [[cal.1962-08-01.albany]]. Names: Russell, Talmadge, Martin Luther King.'
    src:
      c: 6632b403
      rows:
        - 'w.branch-parting-the-waters 624–25: all'
        - 'via w.branch-parting-the-waters 624 n.4a: B'
        - 'via w.branch-parting-the-waters 624 n.4b: B'
    tags: [name:russell-richard-b, name:talmadge-herman-e, name:king-martin-luther-jr, name:kennedy-john-f]
  - id: cal.1962-08-03.legislatures-ok
    when: Aug. 3
    date: '1962-08-03'
    thread: legislatures
    c: 'The Oklahoma court''s order: standards for the Legislature, meeting in January, to reapportion by; failing that, the court to do it.'
    n: '*Moss v. Burkhart*, [207 F. Supp. 885](https://static.case.law/f-supp/207/case-pdfs/0885-01.pdf) (W.D. Okla. 1962) (the order of Aug. 3). See [[cal.1962-06-19.legislatures-ok]].'
    tags: [state:ok]
  - id: cal.1962-08-03.opinion
    when: Aug. 3
    date: '1962-08-03'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: the government to act to improve business, 52 percent; not, 45. If it acts, a tax cut for all, 59; spending on public works, 28.'
    n: '[[w.gallup-poll]], III, 1777.'
