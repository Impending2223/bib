    also: [china]
    c: Beidaihe. Liu Shaoqi asks in the central group how the conference is to be conveyed. The conference discussed class and class struggle; to speak of them touches very many matters and in conveying it the education of cadres must be linked, to good effect; but in practice it is a complicated question, and linking everything to class struggle, as with private plots, the responsibility system and contracting output to households, can cause a reaction. Class analysis cannot easily be applied to all; the question needs study, and the scope of conveyance should be fixed. Mao agrees with Liu's view.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559 (Aug. 20, 1962); [[w.yang-shangkun-riji]], II, 205 (Aug. 20, 1962; the core group, 3 to 6 p.m.; the regions report their views on commerce); [[w.deng-xiaoping-nianpu-1904]], III, 1722 (Aug. 20, 1962; afternoon; Deng at Mao''s core group: on private plots, hills and plains to be cleared with care for forests and soil); [[w.mao-zedong-zhuan]], V, ch. 70 n.50 (Aug. 20, the last core-group meeting: Liu Shaoqi on how to convey the conference, wide or narrow; Mao: the questions must be made clear without hurting people, and by reasoning; he agrees). [[w.yang-jisheng-mubei]], II, 1129 n.35 (Aug. 20: two years and more of talk of difficulty and darkness; to speak of the bright is no longer lawful; Mao''s words at the core group); [[w.peng-zhen-nianpu-1902]], IV, 212–213 (Aug. 20, 1962, afternoon; Peng Zhen at the last core group, Mao presiding, hearing the groups on finance and trade). Made public: 1996. To check: Record of the core group 中心小组会议记录, Central Work Conference, Aug. 20, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.50). Names: Liu Shaoqi, Mao Zedong.'
