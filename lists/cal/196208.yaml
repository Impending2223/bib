    c: The Grain Ministry's general office 糧食部辦公廳 issues Grain Work Bulletin no. 28 《糧食工作簡報》第28期. In many places the grain offered in the rural markets has risen while the grain sold has fallen. Lushan 魯山 county in Henan 河南 sees over 2,000 jin offered a day, Changge 長葛 over 5,000, Ye 葉 county and Shangqiu 商丘 over 10,000; at Shuangliu 雙流 town, Wenjiang 溫江 county, Sichuan 四川, 3,000 to 5,000 jin a market day, 70 to 80 percent sold. Hebei's 河北 grain work forum finds 80 percent of the sellers members, 10 percent teams and 10 percent dealers; of the buyers, 50 percent grain-short households and disaster victims, 15 percent townspeople outside farming, 20 percent buying raw to sell cooked, 10 percent dealers.
    n: '[[w.yang-jisheng-mubei]], I, 618. Made public: 2008. To check: Grain Ministry General Office 糧食部辦公廳, Liangshi gongzuo jianbao 《糧食工作簡報》 no. 28, Aug. 20, 1962 (named in the text of [[w.yang-jisheng-mubei]], I, 618; no note).'
