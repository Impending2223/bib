    c: The Central work group 中央工作組 (the United Front Work Department's group) reports its investigation of the cadres' over-eating and over-taking in the brigades and teams of Tuqiao 土橋 commune, Dazu 大足 county, Sichuan 四川 《四川省大足縣土橋公社大隊和生產隊幹部多吃多佔問題的調查》. Cadres of the commune ate and took more in some degree, 67.9 percent of them. In Xiaohe 小河 brigade a branch secretary named Jiang gave 20 tables of dinners for his father's birthday in 1961 and ate over 100 jin of collective grain, was dismissed, and after his return in 1962 ran a cadres' mess that ate over 800 jin of the brigade's reserve grain and over 400 jin of the state's supply to the members; in Nianpan 碾盤 brigade 53 cadres ate and took 1,661 jin more in Jan.–Aug. 1962.
