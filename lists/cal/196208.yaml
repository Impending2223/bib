  - id: cal.1962-08-01.latin-america-peru
    when: Aug. 1
    date: '1962-08-01'
    thread: latin-america-peru
    c: 'Kennedy to Schlesinger, by Schlesinger''s account, on Peru: the statement against the coup not regretted ("Certainly not"); but neither the Latin American governments, preparing to recognize the junta, nor the Peruvians, by the failed general strike, have given the support hoped for. His concern: prestige staked on reversing what cannot be reversed. The problem now: to show the condemnation has moved the junta to changes enough to resume relations.'
    n: '[[w.schlesinger-thousand-days-1965]], 787. See [[cal.1962-07-18.latin-america]]. Names: Kennedy, Schlesinger.'
    src:
      c: 28b42c78
      rows:
        - 'w.schlesinger-thousand-days-1965 787: all'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr]
  - id: cal.1962-08-01.china-leadership
    when: Aug. 1
    date: '1962-08-01'
    thread: china-leadership
    c: Early August. Mao revises the Central Committee's Aug. 1 draft "provisions on the correct treatment of go-it-alone." He adds that members holding other views may state and keep them; that the breakup of some production teams cannot be avoided, now or for decades and centuries to come; that the struggle of the two roads in the villages may last "decades or hundreds of years."
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 1, 1962 (the entry for "8月初"). [[w.jianguo-yilai-mao-zedong]], XVI, 329–330 (Aug. 1962; Mao''s revisions, in Song type, of the Center''s draft of Aug. 1 "Provisions on the correct treatment of go-it-alone" (关于正确对待单干问题的规定); printed from his revised copy; the volume dates them August; he also wrote that over 90 percent of the communes'' collective economy was on a healthy road, a "go-it-alone wind" in under 10 percent of the country). Made public: 2013. See [[cal.1962-07-31.china-leadership]]. Names: Mao Zedong.'
    src:
      c: cdbf8ce7
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Aug. 1, 1962: ?'
        - 'w.jianguo-yilai-mao-zedong XVI, 329–330: B-E'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
