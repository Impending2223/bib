  - id: cal.1962-08-05.china-leadership
    when: Aug. 5
    date: '1962-08-05'
    place: beidaihe
    thread: china-leadership
    c: 'Beidaihe. Mao on the conference''s "core group": approves Deng Xiaoping''s list of 22: Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Deng, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Chen Yi, Chen Boda, Luo Ruiqing, Xie Fuzhi, Gu Mu, Lu Dingyi, Yang Shangkun, Ke Qingshi, Li Jingquan, Tao Zhu, Song Renqiong, Li Xuefeng, Liu Lantao. "Do as proposed." At noon he had told Deng Zihui, Chen Boda, Ke Qingshi, Tao Zhu and others: he had been round the country and every province said last year better than the year before; it is not all dark nor all light as in 1958; "I am a centrist"; a few percent to a dozen percent of go-it-alone may be allowed, the already-divided not to be forced back.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 1962. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559 (July 25–Aug. 24, 1962; Liu attends the Central Work Conference at Beidaihe; planned chiefly for agriculture, grain, commerce and the state''s support of agriculture, with groups on the draft documents for more than ten days; Aug. 6 Mao speaks to the plenary on "classes, the situation and contradictions," and six times after in the central group, criticizing the "wind of going it alone," the "wind of reversing verdicts" and the "dark wind"); [[w.macfarquhar-origins-of-the-cultural]], III, 274 (Mao agrees at once, at the opening on Aug. 6, to Liu Shaoqi''s proposal for a core group of twenty-two senior leaders to discuss six sensitive issues); [[w.deng-xiaoping-nianpu-1904]], III, 1720 (Aug. 4, 1962; the list Deng reviewed and sent to Mao); [[w.mao-zedong-zhuan]], V, ch. 70 n.40 (Aug. 5: Mao with Ke Qingshi, Li Baohua, Tao Zhu and Wang Renzhong, Deng Zihui, Chen Boda, Chen Zhengren, Liao Luyan and Wang Guanlan present; the Southwest said the day before that within half a year of household contracting classes divide sharply; are there classes? he thinks so; he is not as gloomy as some, nor as bright as in 1958, "I am the middle"; three dictatorships, the proletariat''s, the bourgeoisie''s or the petty bourgeoisie''s: which road? Peng Dehuai wants rehabilitation, the 1959 campaign against rightism not to be blown away). [[w.yang-jisheng-mubei]], II, 1128–1130 n.35–37 (Aug. 5: some comrades judge the situation too dark; with household contracting and going it alone, in six months the countryside''s class divisions show badly, with sales and purchases of land, usury, second wives; and on Peng: the anti-Right struggle of 1959 mostly wrongly done, but not to be blown away at one stroke, his demand for reversal refused). Made public: 1996. Check: the book has Mao say 23, miscounting or omitting a name, and counts the 22 as five Standing Committee members, four secretaries, six regional first secretaries and others (III, 274 n.80); it places his agreement at the Aug. 6 opening. To check: [[w.schram-new-texts-by-mao]], 152 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 274 n.80a); [[w.zedong-ziliao-xuanbian-selection-of]], 269 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 274 n.80b); Record of Mao Zedong''s 毛泽东 talk with the heads of East China and Central-South China 华东和中南地区负责人, Aug. 5, 1962 (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.40). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Chen Yi, Chen Boda, Luo Ruiqing, Xie Fuzhi, Lu Dingyi, Ke Qingshi, Li Jingquan, Tao Zhu, Gu Mu, Yang Shangkun, Song Renqiong, Li Xuefeng, Liu Lantao, Deng Zihui.'
