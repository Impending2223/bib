  - id: cal.1962-08-11.china-leadership
    when: Aug. 11
    date: '1962-08-11'
    place: beidaihe
    thread: china-leadership
    c: 'Beidaihe. Mao at the core group. Hearing that the groups have taken up questions of principle: good. A letter from a Shaanxi commune holds that household contracting shows autumn in a leaf: "I say it can show winter; and winter ends in spring." Not all darkness: the novels of exposure, such as *Guanchang xianxing ji*, Lu Xun called "reproach novels" and no one likes them. Liu Shaoqi, Deng Xiaoping, Chen Yi and Deng Zihui speak; Deng Zihui''s self-criticism. Mao: the January conference''s estimate of the situation was right; those who say eight years to recover should not say so many.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 11, 1962. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559 (Aug. 11, 1962; Liu, in the central group, makes a self-criticism on the assessment of the situation at the May conference and admits that he overestimated the difficulties); [[w.macfarquhar-origins-of-the-cultural]], III, 282, 284 (Liu, defensive, admits that one of his two errors at the May work conference was to state as a foregone conclusion that the 1962 summer harvest would be smaller than the previous year''s; the other, putting private farming at 20 percent of the total); [[w.jianguo-yilai-mao-zedong]], XVI, 343 (Aug. 11, 1962; Mao''s note of Aug. 12: Deng Zihui''s statement at the core group meeting of Aug. 11, that in the last few days he had come to see his go-it-alone views as wrong); [[w.yang-shangkun-riji]], II, 203 (Aug. 11, 1962; the core group, afternoon; the groups to go on meeting the next day; Mao not named); [[w.deng-xiaoping-nianpu-1904]], III, 1721 (Aug. 11, 1962; afternoon; Deng speaks at Mao''s core group: educating cadres a great matter, leading cores too, some cores with problems); [[w.mao-zedong-zhuan]], V, ch. 70 n.45 (Aug. 11: Liu Shaoqi, Deng Xiaoping, Chen Yi and Deng Zihui speak; Mao on the Shaanxi commune letter that household contracting is "autumn from a leaf"; Mao: the January conference''s estimate was right; those who say eight years for recovery should not name so many; Deng Zihui''s self-criticism, harshly met, and the old account of the 200,000 co-ops; Mao adds a contradiction, copying from abroad against self-reliance). [[w.yang-jisheng-mubei]], II, 1128–1129 n.35 (Aug. 11: those who do not back the general line and the red banners paint the situation black); [[w.peng-zhen-nianpu-1902]], IV, 210 (Aug. 11, 1962, afternoon; Peng Zhen at the core group, Mao presiding, hearing the groups and on other questions). Made public: 1996. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1074–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 282 n.124); Record of the core group 中心小组会议记录, Central Work Conference, Aug. 11, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.45). See [[cal.1962-08-09.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Chen Yi, Deng Zihui.'
