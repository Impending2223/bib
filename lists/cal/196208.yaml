  - id: cal.1962-08-27.middle-east-johnson-plan
    when: Aug. 27
    date: '1962-08-27'
    thread: middle-east-johnson-plan
    c: Kennedy with Rusk, Barbour, Talbot, Bundy, Strong and Feldman on the Johnson Plan, 5–6:06 p.m. No record of it found. That night Rusk asks a PCC meeting for Aug. 31, to receive the plan; France and Turkey to be won over.
    n: 'FRUS 1961–63, XVIII, doc. [32](https://history.state.gov/historicaldocuments/frus1961-63v18/d32) and n. 2. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Kennedy, Rusk, Barbour, Talbot, Bundy, Strong, Feldman, Johnson.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:bundy-mcgeorge, name:feldman-myer, name:barbour-walworth, name:talbot-phillips, name:strong-robert-c, name:johnson-joseph-e]
