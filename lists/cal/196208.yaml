    c: A U-2 photographs SAM sites in western Cuba.
    n: '[FRUS 1961–63, X, doc. 395](https://history.state.gov/historicaldocuments/frus1961-63v10/d395). See [[cal.1962-05-24.missile-crisis]].'
  - id: cal.1962-08-29.conservation
    when: Aug. 29
    date: '1962-08-29'
    thread: conservation
    c: 'News conference. Asked about DDT and other pesticides: the Department of Agriculture and the Public Health Service already examining the matter, "particularly, of course, since Miss Carson''s book." *Silent Spring* serialized in *The New Yorker* from June 16; the book out Sept. 27.'
    n: 'The President''s News Conference, [1962 Pub. Papers 648](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=708) (Aug. 29, 1962). To check: [[w.carson-silent-spring]]; [[w.lear-rachel-carson]]. Names: Carson.'
    tags: [name:kennedy-john-f, name:carson-rachel]
  - id: cal.1962-08-30.middle-east-johnson-trip
    when: Aug. 30–31
    date: '1962-08-30'
    thread: middle-east-johnson-trip
    also: [cyprus]
    c: Johnson in Nicosia, Makarios. Then Athens and Rome.
    n: 'FRUS 1961–63, XVI, doc. [263](https://history.state.gov/historicaldocuments/frus1961-63v16/d263) (Labouisse, Sept. 3). See [[cal.1962-08-23.middle-east]]. Names: Johnson, Makarios III.'
