  - id: cal.1962-08-01.china-leadership-4
    when: Aug. 1
    date: '1962-08-01'
    thread: china-leadership
    also: [china]
    c: '*Hongqi* and *Renmin ribao* reprint Liu Shaoqi''s important work of 1939 at Yan''an, *Lun Gongchandangyuan de xiuyang* (How to be a good Communist). In September the People''s Publishing House brings it out as a separate book, with important additions and revisions: the chapters on "theoretical study and ideological training are one" strengthen the theoretical argument, add the Party''s important strategic and tactical thought, and stress that a Communist, after taking power, must work harder on ideological training.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559 (Aug. 1, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 262 (the revision printed in *Renmin ribao* on July 1, 1962, the Party''s anniversary, in most of that day''s edition; the new section on the 1930s; over 18 million pamphlet copies in four years); [[w.dikotter-cultural-revolution]], 17 n.11 (a revised version of Liu''s essay of 1939, serialized in the *Renmin ribao*, published Aug. 1). Check: the date: the book has the revised text in *Renmin ribao* of July 1, 1962, the Party''s anniversary (III, 262 n.8), the Liu chronology *Hongqi* and *Renmin ribao* of Aug. 1; one printing, by the book''s account of it. To check: *Hongqi* and *Renmin ribao*, Aug. 1, 1962, the reprint of *Lun Gongchandangyuan de xiuyang*; the People''s Publishing House edition of Sept. 1962 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 559); Renmin Ribao, July 1, 1962: Liu Shaoqi, ''Lun gongchan dangyuande xiuyang'' (revised), most of the day''s edition ([[w.renmin-ribao]]) (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 262 n.8a); [[w.xiaoming-zhonggong-dangjian-shi-1949]], 157 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 262 n.8b); Informant S, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 262 n.9a). Names: Liu Shaoqi.'
    src:
