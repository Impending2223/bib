    c: 'Zhou Enlai, on Mao''s three questions at the Beidaihe conference: sharp, important and timely; class struggle is long, and classes run through every period. Peasants: the question is mainly going it alone, which they mostly did in the past, but few now argue for it; contracting output to households must be told apart, it is not all going it alone, and some of it has done well. The countryside: difficulties were at first estimated a little high, and are not pitch dark.'
