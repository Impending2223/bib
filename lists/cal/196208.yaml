    date: '1962-08-03'
    thread: king
    also: [antisubversion, georgia-albany]
    c: 'The FBI''s wiretap, 5:03 p.m. Levison, back from South America, on the Wilkins meeting: "very possible" that "the NAACP and the Administration would like to see Martin King kill himself. And the tactic, of course, is to let him languish in jail." King must make plain "this is not the time for the federal government to be weak."'
    n: '[[w.branch-parting-the-waters]], 625. To check: Levison intercept, Aug. 3, 1962, 5:03 p.m., FBI New York file 100-111180, subfile 5 (cited by [[w.branch-parting-the-waters]], 625 n.4). See [[cal.1962-08-02.georgia-albany]]. Names: Levison, Martin Luther King.'
