    when: Aug. 2
    date: '1962-08-02'
    thread: georgia-albany
    c: 'Washington, at night. Wulf of the ACLU, Haley of CORE, Wilkins and two others of the NAACP, Kunstler and Fauntroy for SCLC with Robert Kennedy and Burke Marshall on Albany: they ask the Department to join the movement''s two suits against the city. Kennedy and Marshall: the aim, face-to-face talks in Albany; King''s leaving part of any agreement.'
    n: '[[w.garrow-bearing-the-cross]], 213. To check: Melvin Wulf to Robert Kennedy, "Suggestions on Albany . . .," Aug. 2, 1962, ACLU Papers, box 35, Mudd Library, Princeton; Melvin Wulf to Robert Kennedy, Aug. 3, 1962, ACLU Papers, box 35, Mudd Library, Princeton (cited by [[w.garrow-bearing-the-cross]], 213 n.40). See [[cal.1961-11-17.albany]]. Names: Wilkins, Robert F. Kennedy, Marshall, King.'
