  - id: cal.1962-08-14.cuba
    when: Aug. 14
    date: '1962-08-14'
    thread: cuba
    c: 'Harvey to Helms, with Lansdale''s memorandum, "including liquidation of leaders" excised: "The question of assassination, particularly of Fidel Castro, was brought up by Secretary McNamara at the meeting of the Special Group (Augmented) in Secretary Rusk''s office on 10 August. It was the obvious consensus at that meeting, in answer to a comment by Mr. Ed Murrow, that this is not a subject which has been made a matter of official record." He has told Lansdale''s office "the inadmissability and stupidity of putting this type of comment in writing in such a document," and that the CIA "would write no document pertaining to this and would participate in no open meeting discussing it."'
    n: '[[w.sen-church-alleged-assassination-plots]], 162 (Memo, Harvey to Helms, Aug. 14, 1962). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Harvey to Helms, Aug. 14, 1962 (cited by [[w.sen-church-alleged-assassination-plots]], 162). See [[cal.1962-08-10.cuba]]; [[cal.1962-08-13.cuba]]. Names: Harvey, Helms, Castro, McNamara, Rusk, Murrow, Lansdale.'
