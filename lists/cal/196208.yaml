  - id: cal.1962-08-30.missile-crisis
    when: Aug. 30
    date: '1962-08-30'
    thread: missile-crisis
    c: 'Schlei, Office of Legal Counsel, to Robert Kennedy: should the Soviet Union put missile bases in Cuba, international law would allow the United States extreme measures, force among them, to end the threat; the OAS and the UN first if time allows; no more force than needed.'
    n: '[1 Op. O.L.C. Supp. 251](https://www.justice.gov/olc/file/477221/dl#page=267) (Aug. 30, 1962), with a cover memorandum and an appendix of historical materials. Made public: Norbert A. Schlei, Anticipatory Self-Defense, 6 Green Bag 2d 195 (2003), without the cover memorandum and the appendix; in full, 1 Op. O.L.C. Supp. (2013) (the editor''s note). See [[cal.1962-05-24.missile-crisis]]. Names: Schlei, Robert Kennedy.'
    tags: [name:schlei-norbert-a, name:kennedy-robert-f]
  - id: cal.1962-08-31.missile-crisis
    when: Aug. 31
    date: '1962-08-31'
    thread: missile-crisis
    c: 'Keating on the Senate floor: Soviet troops and rocket bases in Cuba.'
    n: '[Cong. Rec., Senate, Aug. 31, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt14/pdf/GPO-CRECB-1962-pt14-1-2.pdf), 18359–60. See [[cal.1962-05-24.missile-crisis]]. Names: Keating.'
    tags: [name:keating-kenneth-b]
  - id: cal.1962-08.governors-wy
    when: Aug.
    date: 1962-08
    thread: governors
    also: [elections-1962]
    c: 'Wyoming''s primary, for governor. Democratic: Governor Gage, the secretary of state who succeeded Hickey on his appointment to the Senate, over Jack, the nominee of 1954, 21,051 to 16,875, 55.5 percent. Republican: Hansen, a Teton County commissioner, over Crowell, 28,494 to 16,906, 57.0 percent. Check the day.'
    n: 'Votes: [Wikipedia, "1962 Wyoming gubernatorial election"](https://en.wikipedia.org/wiki/1962_Wyoming_gubernatorial_election); Check: *1963 Wyoming Official Directory and 1962 Election Returns*, 56–58. To check: [[w.larson-history-of-wyoming]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1961-01-03.rules]]. Names: Gage, Hickey, Jack, Crowell, Hansen.'
    tags: [state:wy, name:gage-jack-r, name:jack-william-m, name:hansen-clifford-p, name:crowell-charles-m, name:hickey-john-j]
  - id: cal.1962-08-31.middle-east-johnson-plan
    when: Aug. 31
    date: '1962-08-31'
    thread: middle-east-johnson-plan
    c: New York. Joseph Johnson presents his plan to the PCC. Final approval deferred, by arrangement; he is authorized to put it to the host governments and Israel, without publicity and without negotiating its details.
    n: 'FRUS 1961–63, XVIII, doc. [34](https://history.state.gov/historicaldocuments/frus1961-63v18/d34). Made public: Milton Freudenheim, *Chicago Daily News* and *Washington Post*, Oct. 2, 1962 (FRUS 1961–63, XVIII, doc. [67](https://history.state.gov/historicaldocuments/frus1961-63v18/d67), n. 2). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
    tags: [name:johnson-joseph-e]
  - id: cal.1962-08.mississippi
    when: Aug.
    date: 1962-08
    thread: mississippi
    also: [voting-rights]
    c: Ruleville, Sunflower County. Late in the month Fannie Lou Hamer, one of eighteen who go to the Indianola courthouse to register, is one of two let take the test; that night the planter she has worked for eighteen years, B. D. Marlowe, puts her off his plantation.
    n: '[[w.dittmer-local-people]], 136–38. Check: the day; Dittmer, 137: the week after McLaurin''s first trip to the courthouse, late in August. To check: [[w.mills-this-little-light-of]]; Fannie Lou Hamer, interviewed by Neil McMillen, 1972, 1–8, Mississippi Oral History Program (cited by [[w.dittmer-local-people]], 137 n.48). Names: Hamer.'
    src:
      c: 8c4aca38
      rows:
        - 'w.dittmer-local-people 136–38: all'
        - 'via w.dittmer-local-people 137 n.48: B-C'
    tags: [state:ms, name:hamer-fannie-lou]
