  - id: cal.1962-08-09.china-leadership
    when: Aug. 9
    date: '1962-08-09'
    place: beidaihe
    thread: china-leadership
    c: 'Beidaihe. Mao at the core group: the groups'' discussion of concrete things only, heavy and dull; "the need now is to take the question to principle." Two kinds of men, those who see only darkness and those who see mostly dark with a little light; if all is dark, socialism has failed and all must go it alone; in a year or so go-it-alone makes class division, with branch secretaries taking more, keeping concubines, lending at interest, buying land, and the poor ruined, among them the households of soldiers'' kin and the "five guaranteed."'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 9, 1962. [[w.macfarquhar-origins-of-the-cultural]], III, 276–80 (Mao''s first of six speeches to the central group: whether the CCP could fall ("The KMT lasted twenty-three years; we still have a few years"); the Soviet Union revisionist, the capitalist class able to be reborn; Deng Zihui, Wang Jiaxiang, Kang Sheng, Wu Lengxi and Hu Sheng to be co-opted into the group; forty percent of peasant households on baochan daohu; the Planning Commission, Economic Commission and the State Council offices for finance and trade and for agriculture are ''independent kingdoms''; he spares military and foreign affairs; Zhou and Chen Yi questioned on bourgeois intellectuals); [[w.yang-shangkun-riji]], II, 202–203 (Aug. 9, 1962; the core group 中心小组, 11 a.m. to 2 p.m. and 3:30 to 6 p.m.; the groups report; Mao not named); [[w.deng-xiaoping-nianpu-1904]], III, 1721 (Aug. 9, 1962; Deng at Mao''s core group hearing the regional bureaus); [[w.mao-zedong-zhuan]], V, ch. 70 n.43 (Aug. 9, the core group''s first meeting, of twelve days and eight meetings: Xie Fuzhi on contradictions, Luo Ruiqing on the army''s view of go-it-alone, Chen Boda on the history of cooperation, Kang Sheng on Soviet collectivization; Mao, the groups not grasping the principle; Li Jingquan: two years of go-it-alone and the division is plain; Mao: one year and a bit). [[w.yang-jisheng-mubei]], I, 555–556 n.45 (the day after Mao received Hu Kaiming''s report: at the core group of the Beidaihe conference he speaks of go-it-alone and the poor, names Hu Kaiming of Hebei, a vice-governor, and says Hu had pressed on him for two years with the "all dark" view and he may press back); [[w.yang-jisheng-mubei]], II, 1128–1129 n.35–36 (Aug. 9: ''You press me; you have talked of the dark for years''; and on where go-it-alone comes from: the Party holds many petty bourgeois, rich-peasant sons, men gone bad, concubines, branch secretaries treating the masses as slaves); [[w.peng-zhen-nianpu-1902]], IV, 210 (Aug. 9, 1962; Peng Zhen at the core group, Mao presiding, hearing the regional bureaus on the groups'' discussion). Made public: 2013. Check: the book calls Aug. 9 the day of the first of six speeches to the central group, opening ''Today I will only talk about whether or not the CCP could fall''; this entry''s text records other parts of the day''s remarks. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 202–203) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 70), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.jiaoyanshi-zhonggong-dangshi-zhuanti-jiangyi]], 149 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 277 n.92); Mao Zedong, speech of Aug. 9, 1962, to the central small group at Beidaihe, in [[w.zedong-ziliao-xuanbian-selection-of]], 270 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 277 n.93); Mao Zedong, speech of Aug. 9, 1962, to the central small group at Beidaihe, in [[w.zedong-ziliao-xuanbian-selection-of]], 270–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 277 n.95a); Mao Zedong, speech of Aug. 9, 1962, to the central small group at Beidaihe, in [[w.zedong-ziliao-xuanbian-selection-of]], 270 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 277 n.96); Mao Zedong, speech of Aug. 9, 1962, to the central small group at Beidaihe, in [[w.zedong-ziliao-xuanbian-selection-of]], 270, 271, 272 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 277 n.97a); Mao Zedong, speech of Aug. 9, 1962, to the central small group at Beidaihe, in [[w.zedong-ziliao-xuanbian-selection-of]], 270 (cited by [[w.macfarquhar-origins-of-the-cultural]], III,