    c: 'Missouri, with the primary, refuses four amendments: pensions for employees of political subdivisions, 146,566 to 253,617, 36.6 percent; taxes above the limit for airports and university extension, 123,704 to 261,942, 32.1 percent; pensions for retired teachers, 179,601 to 210,093, 46.1 percent; the St. Louis school tax to three times the limit, 127,662 to 237,243, 35.0 percent.'
