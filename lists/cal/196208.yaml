  - id: cal.1962-08-10.cuba-2
    when: Aug. 10
    date: '1962-08-10'
    thread: cuba
    c: 'McCone telephones McNamara, Elder listening on a speaker: "the subject you just brought up, I think it is highly improper. I do not think it should be discussed. It is not an action that should ever be condoned. It is not proper for US to discuss, and I intend to have it expunged from the record." McNamara, by Elder, "more or less accepted what Mr. McCone said without comment or rejoinder."'
    n: '[[w.sen-church-alleged-assassination-plots]], 105, 165–66 and 166 n.1 (Elder, testimony, Aug. 13, 1975, 23–24; Harvey, testimony, June 25, 1975, 71; McCone, memorandum of Apr. 14, 1967: "Immediately after the meeting, I called on Secretary McNamara personally"; McCone, testimony, June 6, 1975, 39; McNamara, testimony, July 11, 1975, 7–8: "I agreed with Mr. McCone that no such planning should be undertaken"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1962-08-10.cuba]]. Names: McCone, McNamara. Check: the day: by Harvey''s account the afternoon or evening of Aug. 10; by McCone''s memorandum of 1967, in person, immediately after the meeting; by his testimony, after Lansdale''s memorandum of Aug. 13; McNamara, "several days later."'
    tags: [name:mccone-john-a, name:mcnamara-robert-s]
