    when: Aug. 3
    date: '1962-08-03'
    thread: opinion
    also: [economy]
    c: 'Gallup, June 28–July 3: the government to act to improve business, 52 percent; not, 45. If it acts, a tax cut for all, 59; spending on public works, 28.'
