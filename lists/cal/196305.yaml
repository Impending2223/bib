  - id: cal.1963-05-08.vietnam
    when: May 8
    date: '1963-05-08'
    thread: vietnam
    c: Huế, the Buddha's birthday. Buddhist flags banned; a crowd at the radio station for Trí Quang's address, refused. Troops and armored cars fire; eight killed by the consul's first count. The government blames the Viet Cong.
    n: 'FRUS 1961–63, III, docs. [112](https://history.state.gov/historicaldocuments/frus1961-63v03/d112), [117](https://history.state.gov/historicaldocuments/frus1961-63v03/d117), [118](https://history.state.gov/historicaldocuments/frus1961-63v03/d118); doc. [116](https://history.state.gov/historicaldocuments/frus1961-63v03/d116) (Helble, May 10: the order on the flags; the Civil Guard''s unit fired; the government''s line). [Report of the United Nations Fact-Finding Mission to South Viet-Nam](https://digitallibrary.un.org/record/729703), U.N. Doc. A/5630 (Dec. 7, 1963) (Viet. II.I.3). [[w.miller-misalliance]], 260–68 (260–61: the crowd, the tape refused, the armored car, the explosion and the shots, the government''s line; 266–67: the ban of May 6, the flags torn down May 7, Trí Quang''s remarks); [[w.schulimson-joint-chiefs-of-staff]], 304–305 (not the count); [[w.futrell-united-states-air-force]], 185 (the flag rule; the troops sent to break up the rally); [[w.moyar-triumph-forsaken]], 212–13 (the order enforced after the Catholic celebrations; the crowd at Từ Đàm and the radio station; the tape refused; hoses, blanks, then the deaths; the government''s line). To check: [[w.schecter-new-face-of-buddha]]; [[w.luu-buddhist-crises-in-vietnam]]; [[w.mau-sau-thang-phap-nan]]; [[w.moyar-political-monks]]; [[w.mcallister-only-religions-count-in]]; [[w.miller-religious-revival-and-the]]; [[w.hammer-death-in-november]]; [[w.jacobs-cold-war-mandarin]]; [[w.winters-year-of-the-hare]]; [[w.jones-death-of-a-generation]]; [[w.shaw-lost-mandate-of-heaven-2015]]; [[w.cung-phong-trao-phat-giao]]; [[w.luan-ben-giong-lich-su]]; [[w.gheddo-cross-and-the-bo]]; [[w.tue-cong-cuoc-tranh-dau]]; Diệm''s telegram no. 9195, May 6, 1963, the ban, printed in Lê Cung, *Phong Trào Phật Giáo Miền Nam Việt Nam 1963* (2005), 355 (cited by [[w.miller-misalliance]], 266 n.66); the Huế police chief''s telegram no. 249-VP/M, May 10, 1963, quoted in Lê Cung, 150 (cited by [[w.miller-misalliance]], 267 n.69); [[w.minh-vietnamese-engaged-buddhism]]; [[w.ford-cold-war-monks]]; [[w.hanh-vietnam]]; [[w.halberstam-making-of-a-quagmire]]; [[w.browne-new-face-of-war]]; [[w.higgins-our-vietnam-nightmare-1965]]; [[w.prochnau-once-upon-a-distant]]; [[w.blair-lodge-in-vietnam]]; Hearings before a Subcommittee of the Committee on Appropriations, House of Representatives, Foreign Operations Appropriations for 1964, 88th Cong, 1st sess (Washington, 1963), pt 3, pp 264-65 (cited by [[w.futrell-united-states-air-force]], 185 n.2); Diệm''s order to the province chiefs and mayors, quoted in Lê Cung, Phong Trào Phật Giáo Miền Nam Việt Nam, Năm 1963 (1999), 298 (cited by [[w.moyar-triumph-forsaken]], 212 n.36). Names: Thích Trí Quang, Helble. Check: Miller, 261, gives nine dead, seven at the scene and two within hours, and an explosion with the gunfire. Check: Futrell, 185, places the rally in Saigon and has an explosion kill several when the Civil Guard moved to break it up; the consul''s reports are from Huế (doc. 112). Check: Moyar, 213, gives nine dead and fourteen wounded, from troops'' fire, an agitator''s explosives, or both, "in a sequence that cannot be inferred from the existing evidence."'
