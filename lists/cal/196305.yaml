    c: 'Sunday, the truce day, King in Atlanta. New Pilgrim Church, the afternoon mass meeting, two thousand; police arrest Guy and Candie Carawan on the steps. Bevel: "We''re tired of this mess! ... Let''s not march. Let''s just walk." Billups leads the congregation five blocks toward the city jail; at the barricade, Connor in the hoses, they kneel. Billups: "Turn on your water! Turn loose your dogs! We will stand here ''til we die!" The firemen do not turn on the hoses. Walker to two captains: a prayer in the Negro park across the street; granted.'
