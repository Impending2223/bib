  - id: cal.1963-05-31.king
    when: May 31
    date: '1963-05-31'
    thread: king
    also: [civil-rights-the-executive]
    c: 'The FBI reports to Robert Kennedy King''s talk with Levison, overheard on the Bureau''s tap on Levison: ask to see the President; if refused, Birmingham''s tactics in other cities. At Kennedy''s request the account goes to the President within hours. King had wired May 30 for a conference with both. June 1, Lee White: no meeting for at least a week.'
    n: '[[w.garrow-bearing-the-cross]], 264–65. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Robert F. Kennedy, King, Levison, Kennedy, White.'
