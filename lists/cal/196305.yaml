  - id: cal.1963-05-03.alabama-birmingham-3
    when: May 3
    date: '1963-05-03'
    thread: alabama-birmingham
    c: 'Mayor Boutwell: "irresponsible and unthinking agitators" have made "tools" of children; "The respectable people of Birmingham, white or colored, did not create this danger. ... We are innocent victims." Judge Talbot Ellis of the juvenile court: those who "misled these kids" "ought to be put under the jail."'
