    c: 'Morning. Shuttlesworth, out of the hospital in its tags, against King''s one-day moratorium: "While the water is hot, scald him on both sides"; at the Drews'' house, before Burke Marshall, he threatens to lead the children back into the streets; "You''re Mister Big, but you''re going to be Mister S-H-I-T!" King: "We''ve got to have unity, Burke." After a talk alone with King, Shuttlesworth announces the truce: "We do believe that honest efforts to negotiate in good faith are under way." 178 reporters in town, by Walker''s count.'
