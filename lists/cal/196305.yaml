  - id: cal.1963-05-07.vietnam-force-levels
    when: May 7
    date: '1963-05-07'
    thread: vietnam-force-levels
    c: 'The Oval Office, 4:32 p.m., recorded. McNamara to Kennedy on Honolulu: "for domestic political purposes" and for the effect in South Vietnam, a thousand men home by the end of the year; the plan asked for, no decision yet. Kennedy: not if the war is not in good shape. McNamara: two or three victories would make it "just exactly the shot in the arm we ought to have." McNamara: $75 to $100 million out of the military assistance programs for 1965–67, "so we don''t build up another Korea."'
    n: '[John F. Kennedy and Robert S. McNamara, 4:32 p.m.](https://prde.upress.virginia.edu/conversations/4006537), JFK Meeting Tape 85.4 (PRDE only). [[w.selverstone-kennedy-withdrawal]], 124–25, 131 (the exchange, from the Miller Center''s draft transcript). Check: the recording not heard; the words Selverstone''s transcript''s. See [[cal.1963-05-06.vietnam-force-levels]]. Names: McNamara, Kennedy.'
    src:
      c: c6de6561
      rows:
