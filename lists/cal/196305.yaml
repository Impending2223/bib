  - id: cal.1963-05-08.testing
    when: May 8
    date: '1963-05-08'
    thread: testing
    c: 'Khrushchev''s reply to the Kennedy–Macmillan letter: the seismic "black boxes" enough, inspection a cover for spying, seven or eight "unserious." But Moscow "happy to receive" the American and British representatives.'
    n: '[FRUS 1961–63, VII, doc. 285](https://history.state.gov/historicaldocuments/frus1961-63v07/d285). See [[cal.1963-04-24.testing]]. Names: Khrushchev, Macmillan.'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f, name:macmillan-harold]
  - id: cal.1963-05-08.middle-east
    when: May 8
    date: '1963-05-08'
    thread: middle-east
    c: 'Kennedy, at his press conference, on the arms balance and the security of Israel and Jordan: the United States supports the security of Israel and of its neighbors; seeks to limit the arms race; opposes the use or threat of force; will act through the UN or on its own to prevent or stop aggression.'
    n: The President's News Conference, [1963 Pub. Papers 372](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=430) (May 8, 1963). FRUS 1961–63, XVIII, doc. [238](https://history.state.gov/historicaldocuments/frus1961-63v18/d238). See [[cal.1963-04-27.middle-east]].
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-09.mississippi
    when: May 9
    date: '1963-05-09'
    thread: mississippi
    also: [voting-rights]
    c: Holmes County. Night riders firebomb the house of Hartman Turnbow, one of fourteen Negroes who tried to register at Lexington, Apr. 9; he drives them off with his rifle. Moses, photographing the damage the next morning, arrested; he, Turnbow and three SNCC workers charged with arson.
    n: '[[w.dittmer-local-people]], 191–93. Check: the night; Dittmer, 192: "one month to the day" after Turnbow tried to register. Doar''s federal suit for the defendants, and the charges dropped six months later: Dittmer, 193. To check: *Holmes County Herald*, Apr. 11, 1963 (cited by [[w.dittmer-local-people]], 192 n.48). Names: Moses, Turnbow.'
    src:
      c: 08be860e
      rows:
        - 'w.dittmer-local-people 191–93: all'
        - 'via w.dittmer-local-people 192 n.48: B'
    tags: [state:ms, name:moses-robert-p, name:turnbow-hartman]
  - id: cal.1963-05-09.alabama-birmingham
    when: May 9
    date: '1963-05-09'
    thread: alabama-birmingham
    c: 'Bail for the jailed, Birmingham''s whites refusing it: Marshall and Robert Kennedy turn to Reuther and Rauh. Four unions promise $40,000 each; Rauh wires a guarantee of $160,000 to Erskine Smith. The truce agreement written that night.'
    n: '[[w.garrow-bearing-the-cross]], 258. See [[cal.1963-04-03.alabama]]. Names: Marshall, Robert F. Kennedy, Reuther, Rauh.'
    tags: [name:marshall-burke, name:kennedy-robert-f, name:reuther-walter, name:rauh-joseph-l-jr, state:al, city:birmingham]
  - id: cal.1963-05-10.alabama
    when: May 10
    date: '1963-05-10'
    thread: alabama-birmingham
    also: [desegregation-public-places, king]
    c: 'Shuttlesworth and King announce the Birmingham settlement, Marshall mediating: lunch counters, rest rooms, fitting rooms, and fountains desegregated within ninety days; Negroes hired as clerks; the jailed released. Connor and the old commission reject it.'
    n: 'The President''s News Conference, [1963 Pub. Papers 372](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=430) (May 8, 1963). [[w.garrow-bearing-the-cross]], 258–59. To check: [[w.navasky-kennedy-justice]]; [[w.eskew-but-for-birmingham]]; [[w.young-easy-burden]]. See [[cal.1963-04-03.alabama]]. Names: Shuttlesworth, Martin Luther King, Marshall, Connor.'
    tags: [name:shuttlesworth-fred, name:king-martin-luther-jr, name:marshall-burke, name:connor-eugene]
  - id: cal.1963-05-10.states-and-cities-ma
    when: May 10
    date: '1963-05-10'
    thread: states-and-cities
    c: 'Massachusetts. Crimmins, of the Governor''s Council, with the chairman of the State Housing Board and the head of its urban renewal program, indicted for conspiracy and bribes on State housing contracts: the first indictments from the Crime Commission''s inquiries.'
    n: '[Wikipedia, "Joseph Ray Crimmins"](https://en.wikipedia.org/wiki/Joseph_Ray_Crimmins). Check against the *Boston Globe* and the Commission''s reports. To check: [[w.hogarty-massachusetts-politics-and-public]]; [[w.peirce-megastates-of-america]]. Names: Crimmins.'
    tags: [state:ma, name:crimmins-joseph-ray]
  - id: cal.1963-05-11.alabama
    when: May 11–13
    date: '1963-05-11'
    thread: alabama-birmingham
    also: [robert-kennedy]
    c: 'Bombs at the house of King''s brother and at the Gaston Motel, the night of the 11th. Rioting till morning. May 12, on television: troops trained in riot control to bases near Birmingham; the Alabama Guard readied for federal service. May 13: telegram to Wallace, 10 U.S.C. § 333.'
    n: '[Kennedy, Robert Kennedy, Katzenbach, Marshall, McNamara and others, May 12](https://prde.upress.virginia.edu/conversations/4006291), JFK Meeting Tape 86.2 (PRDE only). Radio and Television Remarks Following Renewal of Racial Strife in Birmingham, [1963 Pub. Papers 397](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=455) (May 12, 1963). Telegram to Governor Wallace of Alabama, [1963 Pub. Papers 398](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=456) (May 13, 1963). *Alabama v. United States*, [373 U.S. 545](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373545/usrep373545.pdf) (1963) (Wallace''s suit against the troops refused, May 27). [[w.rosenberg-kennedy-johnson-and-the]], "Protest in Birmingham". [[w.garrow-bearing-the-cross]], 259–61. See [[cal.1963-04-03.alabama]]. Names: Wallace, Robert F. Kennedy, McNamara, Katzenbach, Marshall, Martin Luther King.'
    tags: [name:kennedy-john-f, name:wallace-george-c, name:mcnamara-robert-s, name:marshall-burke, name:kennedy-robert-f, name:katzenbach-nicholas, name:king-martin-luther-jr]
  - id: cal.1963-05-12.vietnam
    when: May 12
    date: '1963-05-12'
    thread: vietnam
    c: 'Front page of the *Washington Post*: Nhu would like half of the 12,000 to 13,000 American military in South Vietnam to leave.'
    n: 'FRUS 1961–63, III, docs. [122](https://history.state.gov/historicaldocuments/frus1961-63v03/d122) (Rusk to Nolting, May 13: protest to Diệm), [88](https://history.state.gov/historicaldocuments/frus1961-63v03/d88) (Nhu in private, Apr. 12: 500 to 4,000 fewer Americans). [[w.miller-misalliance]], 253, 258 (253: more than 12,000 American military; 258: the interview, "at least 50 percent" of the advisers "not absolutely necessary"). To check: Warren Unna, "Viet-Nam Wants 50% of GIs Out," *Washington Post*, May 12, 1963 (cited by [[w.miller-misalliance]], 258 n.41). See [[cal.1961-01-28.vietnam]]. Names: Nhu.'
    src:
      c: d4b22883
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d122: all'
        - 'w.miller-misalliance 253, 258: A'
        - 'via w.miller-misalliance 258 n.41: A'
    tags: [name:ngo-dinh-nhu]
  - id: cal.1963-05-12.china
    when: May 12
    date: '1963-05-12'
    thread: china
    also: [vietnam]
    c: 'Hanoi. Liu Shaoqi, President of China, on a visit, against a negotiated settlement: the Vietnamese "cannot sleep and eat at ease for a single day so long as the Southern part is not liberated." Xuân Thủy Foreign Minister days before, in Ưng Văn Khiêm''s place.'
    n: 'Washington''s reading: [FRUS 1961–63, V, doc. 324](https://history.state.gov/historicaldocuments/frus1961-63v05/d324) (Ball to Paris, May 21), n.2 (Hong Kong''s summary of the speech, May 14). [[w.asselin-hanois-road-to-the]], 153–54 (all but the day). Names: Liu, Xuân Thủy.'
    tags: [name:liu-shao-chi, name:xuan-thuy, place:hanoi]
  - id: cal.1963-05-14.railroads
    when: May 14
    date: '1963-05-14'
    thread: railroads
    c: Emergency Board No. 154 reports. A nationwide strike threatened within thirty days; the parties urged to accept.
    n: '[Report to the President by Emergency Board No. 154](https://nmb.gov/NMB_Application/wp-content/uploads/2025/05/PEB-154-Report.pdf) (May 13, 1963). Statement by the President Upon Receiving Emergency Board Report on the Railway Labor Dispute, [1963 Pub. Papers 399](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=457) (May 14, 1963). See [[cal.1963-04-03.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-14.desegregation-public-places-louisville
    when: May 14
    date: '1963-05-14'
    thread: desegregation-public-places
    c: 'Louisville''s Board of Aldermen passes an ordinance forbidding discrimination by race in places of public accommodation, with Cowger''s support (Check: the date and the vote).'
    n: '[Louisville, Ordinance No. 66, Series 1963](https://ivanallen.iac.gatech.edu/mayoral-records/traditional/items/show/7522) (copy in the Ivan Allen Jr. Mayoral Records, Box 17, Folder 15). Check: the ordinance, Louisville Board of Aldermen, 1963. To check: [[w.kmeyer-civil-rights-in-the]]; [[w.harrison-new-history-of-kentucky]]. See [[cal.1961-11-07.mayors-louisville]]. Names: Cowger.'
    tags: [state:ky, city:louisville, name:cowger-william-o]
  - id: cal.1963-05-14.alabama-birmingham
    when: May 14
    date: '1963-05-14'
    thread: alabama-birmingham
    c: 'Twenty Alabama editors at the Justice Department. Robert Kennedy: King''s moderation and nonviolence his greatest virtues; "If King loses, worse leaders are going to take his place"; the South''s officials to allow protests. To newsmen after, on background: the troops held ready for fear of Lingo''s troopers, not of the Negroes.'
    n: '[[w.garrow-bearing-the-cross]], 262. See [[cal.1963-04-03.alabama]]. Names: Robert F. Kennedy, King, Lingo.'
    tags: [name:kennedy-robert-f, name:king-martin-luther-jr, name:lingo-albert-j]
  - id: cal.1963-05-15.space
    when: May 15–16
    date: '1963-05-15'
    thread: space
    c: Cooper's *Faith 7*, twenty-two orbits, thirty-four hours. The automatic controls fail; he flies the reentry by hand. The last Mercury flight.
    n: 'Radio and Television Remarks Following the Flight of Astronaut L. Gordon Cooper, [1963 Pub. Papers 405](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=463) (May 16, 1963). To check: [[w.swenson-this-new-ocean]]; [[w.cooper-leap-of-faith]]; [[w.wolfe-right-stuff]]. See [[cal.1961-04-12.space]]. Names: L. Gordon Cooper.'
    tags: [name:cooper-l-gordon-jr, name:kennedy-john-f]
  - id: cal.1963-05-15.economy
    when: May 15
    date: '1963-05-15'
    thread: economy-debt-limit
    c: 'House passes H.R. 6009: the temporary debt limit $307 billion through June, $309 billion through Aug. 31. Byrnes''s motion to recommit, to keep $305 billion, refused, [195–222](https://voteview.com/rollcall/RH0880027); passed, [213–204](https://voteview.com/rollcall/RH0880028).'
    n: '[109 Cong. Rec., House, May 15, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt7/pdf/GPO-CRECB-1963-pt7-2-1.pdf). To check: [[w.morgan-deficit-government]]. See [[cal.1960-06-08.economy-debt-limit]]. Names: Byrnes.'
    tags: [name:byrnes-john-w]
  - id: cal.1963-05-16.europe-and-the-alliance
    when: May 16
    date: '1963-05-16'
    thread: europe-and-the-alliance
    also: [european-community]
    c: 'Bonn. The Bundestag ratifies the Franco-German treaty with a preamble: close partnership between Europe and the United States; common defense in NATO and the integration of its forces; the European Communities to take in Britain; lower trade barriers through the GATT.'
    n: 'Act of June 15, 1963, BGBl. 1963 II, 705 (Check). [FRUS 1961–63, XIII, doc. 76](https://history.state.gov/historicaldocuments/frus1961-63v13/d76) (McGhee and Adenauer, May 20). To check: [[w.mayer-adenauer-and-kennedy]]; [[w.bange-eec-crisis-of-1963]]; [[w.granieri-ambivalent-alliance]]. See [[cal.1963-01-22.europe-and-the-alliance]].'
  - id: cal.1963-05-17.vietnam
    when: May 17
    date: '1963-05-17'
    thread: vietnam
    c: 'Diệm''s government and the embassy announce agreement on counterinsurgency funds for 1963, the strategic hamlets first: up to 2.3 billion piastres from the government, some $55 million in American commodities. The present level of advisers still needed; to lighten as security improves.'
    n: 'The joint communiqué, [FRUS 1961–63, III, doc. 127](https://history.state.gov/historicaldocuments/frus1961-63v03/d127) (editorial note); [[w.current-documents-1963]], 854–55; doc. [119](https://history.state.gov/historicaldocuments/frus1961-63v03/d119) (Nolting to Thuần, May 10: up to 2.3 billion piastres from the government). [[w.miller-misalliance]], 254–55, 259–60 (the dispute over the fund; the joint statement of May 17). See [[cal.1961-01-28.vietnam]]. Names: Diệm.'
    src:
      c: c8438a53
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d127: all'
        - 'w.current-documents-1963 854–55: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d119: A'
        - 'w.miller-misalliance 254–55, 259–60: A'
        - 'via w.miller-misalliance 259 n.47: A'
    tags: [name:ngo-dinh-diem, place:saigon]
  - id: cal.1963-05-18.middle-east
    when: May 18
    date: '1963-05-18'
    thread: middle-east-dimona
