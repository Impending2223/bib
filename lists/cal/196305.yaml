    c: 'The White House, recorded. Robert Kennedy on Birmingham: "the Negro leadership didn''t know what they were demonstrating about. They didn''t know whether they were demonstrating to get rid of Bull Connor or whether they were demonstrating about the stores ... none of the white community knew what they were demonstrating about"; King''s stand on the prisoners "doesn''t really make a lot of sense." The government''s own segregated work force: the businessmen asked, "Why should we hire Negroes? You don''t hire Negroes." Macy''s figures: of 405 Treasury employees in Nashville, four Negroes, all clerks; of 249 at Agriculture, two; of 114 at Labor and Commerce, none. Better to act early than "just wait until they flare up."'
