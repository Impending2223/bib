    also: [alabama-birmingham, press-and-broadcasting]
    c: 'Kennedy, at his press conference, on the arms balance and the security of Israel and Jordan: the United States supports the security of Israel and of its neighbors; seeks to limit the arms race; opposes the use or threat of force; will act through the UN or on its own to prevent or stop aggression. On Birmingham, his opening statement: no violation of federal law found, "our efforts have been focused on getting both sides together"; Marshall on the scene. And: "an important moral issue involved of equality for all of our citizens"; "The time to give it to them is before the disasters come and not afterwards." Asked whether a fireside chat on civil rights would help: "If I thought it would I would give one." His speech to Mississippi the night of Oxford "did not seem to do much good, but this doesn''t mean we should not keep on trying."'
    n: 'The President''s News Conference, [1963 Pub. Papers 372](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=430) (May 8, 1963), at 378 (the fireside chat). FRUS 1961–63, XVIII, doc. [238](https://history.state.gov/historicaldocuments/frus1961-63v18/d238) (Israel and Jordan; Birmingham). [[w.sundquist-politics-and-policy]], 259–60 (Birmingham); [[w.mann-walls-of-jericho]], 351 (on Birmingham); [[w.branch-parting-the-waters]], 783 (on Birmingham); [[w.sorensen-kennedy]], 329 (the fireside chat). Check: Branch, 783–84: the conference half an hour after Shuttlesworth''s announcement, the first dominated by race; the opening, "I am gratified to note the progress in the efforts by white and Negro citizens to end an ugly situation in Birmingham" (the Papers, 372). See [[cal.1963-04-27.middle-east]]. Names: Kennedy, Marshall.'
