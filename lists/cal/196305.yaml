  - id: cal.1963-05-07.civil-rights-the-executive-2
    when: May 7
    date: '1963-05-07'
    thread: civil-rights-the-executive
    also: [alabama-birmingham]
    c: 'Through the afternoon Burke Marshall gives Robert Kennedy the names of executives for members of the Cabinet or the President to lobby; the President makes several calls: no way out but settlement. At the White House he meets Sorensen, Katzenbach, Lee White, Doar, Bernhard and Louis Martin on Birmingham. His press office: he is "closely monitoring events" and "continues to hope the situation can be resolved by the people of Birmingham themselves." Hatcher, on Hanson''s telegram: "We are not sitting idly by. We just can''t say anything."'
