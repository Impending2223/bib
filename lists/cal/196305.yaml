    c: 'Birmingham. The Senior Citizens Committee, some eighty, called by Smyer: Sheriff Bailey, the police at the breaking point; Marshall, for a negotiated peace. They authorize the merchants'' negotiators, two or three dissenting. That night Smyer, Vann and two merchants with Pitts, Shores and Andrew Young, Marshall present: the stores desegregated, jobs upgraded, a biracial committee; the release of the jailed unsettled.'
