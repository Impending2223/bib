    c: 'Saturday. Walker''s surprise at city hall, five blocks from the church: a banner, "Love God and Thy Neighbor"; Connor jails all twenty-five, then a woman and a girl who kneel to pray, and orders all "strolling Negroes" near city hall arrested or dispersed. He seals off two churches; some 150 arrested. Rocks from the crowd in Kelly Ingram Park; the monitor guns. Bevel, with a police lieutenant''s bullhorn, clears the corner: "If you''re not going to demonstrate in a nonviolent way, then leave!" He suspends the marches for Sunday.'
