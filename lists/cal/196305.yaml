    c: 'New York. Clarence Jones, sent by Belafonte, meets Rockefeller''s assistant Hugh Morrow at Rockefeller Plaza; in a vault of Chase Manhattan a vice president hands Jones a briefcase of cash for the Birmingham bonds against his promissory note. Jones recalls $100,000, Morrow $25,000. Secret on both sides: Rockefeller, just remarried, not to be charged with buying the Negro vote; King, to keep his ties with the Kennedys.'
    n: '[[w.branch-parting-the-waters]], 789; [[w.smith-on-his-own-terms]], 395 (the vault of the Chase Manhattan, a briefcase of Rockefeller cash, called a loan, for the bail of the children jailed after May 2; an unsigned receipt later in Jones''s mail: the "loan" repaid). To check: interviews: Clarence Jones, Nov. 25, 1983, Hugh Morrow, Dec. 20, 1984 (cited by [[w.branch-parting-the-waters]], 789 n.3). Check: the day (the banks closed for the weekend); Branch: perhaps two contributions that spring (789 n.3). Rockefeller''s drop of thirteen points in the Gallup poll within a week of his marriage: *Chicago Sun-Times*, May 26, 1963, at 5 (cited by [[w.branch-parting-the-waters]], 789 n.5). See [[cal.1963-05-09.alabama-birmingham]]. Names: Rockefeller, Martin Luther King.'
