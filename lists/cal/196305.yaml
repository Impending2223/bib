    tags: [name:moore-william-l, name:zellner-bob, name:forman-james, name:nash-diane, state:al, name:sitton-claude]
  - id: cal.1963-05-01.alabama-birmingham
    when: May 1
    date: '1963-05-01'
    thread: alabama-birmingham
    also: [king]
    c: 'King with Walker, Shuttlesworth, Bevel and others, in private: the minimum age of the jail volunteers drifts down. Bevel''s formula: any child old enough to join a church may march to jail, over the parents'' objections; "Against your Mama, you have a right to make this witness." To Porter and others who object to the high school children, King: something dramatic, the press losing interest.'
    n: '[[w.branch-parting-the-waters]], 754–55. To check: [[w.garrow-bearing-the-cross]], 247 (cited by [[w.branch-parting-the-waters]], 754 n.2); interviews: James Bevel, May 16–17, 1985 (cited by [[w.branch-parting-the-waters]], 755 n.1). Check: the day. See [[cal.1963-04-30.alabama-birmingham-2]]. Names: Martin Luther King, Shuttlesworth.'
