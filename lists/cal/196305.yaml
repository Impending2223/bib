    c: 'The night''s mass meeting, nearly two thousand. Shuttlesworth: "The whole world is watching Birmingham tonight." King: 958 children signed up for jail that day, some 600 in custody; "If they think today is the end of this, they will be badly mistaken." Farmer, in for the Moore walk: "We are prepared and ready to unite behind you." Dick Gregory to join Sunday. Bevel: "every Negro is gonna be in jail by Sunday night"; back "in Mississippi chopping cotton" by Tuesday.'
    n: '[[w.branch-parting-the-waters]], 757–58. After the day''s march: [[w.branch-parting-the-waters]], 756–58. To check: Birmingham police notes on mass meeting, May 2, 1963, Bull Connor Papers (cited by [[w.branch-parting-the-waters]], 757 n.1, 758 n.1). See [[cal.1963-05-02.alabama]]. Names: Shuttlesworth, Martin Luther King, Farmer, Gregory.'
