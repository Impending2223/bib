  - id: cal.1963-05-01.alabama
    when: May 1
    date: '1963-05-01'
    thread: alabama
    also: [civil-rights-organizations]
    c: Two marches take up William Moore's walk. Ten chosen by CORE and SNCC, Zellner, Bill Hansen, Jesse Harris and Sam Shirah among them, Forman observing, from Chattanooga toward Jackson; Diane Nash Bevel, Paul Brooks and six others from where Moore fell toward Birmingham. Alabama troopers arrest all eighteen, and Forman. Sitton and Foster Hailey of the *New York Times* follow them.
    n: '[[w.branch-parting-the-waters]], 754. To check: [[w.meier-core]], 215; [[w.forman-making-of-black-revolutionaries]], 308; [*New York Times*, May 2, 1963](https://timesmachine.nytimes.com/timesmachine/1963/05/02/issue.html), at 18; Watters, *Down to Now*, 243ff. (cited by [[w.branch-parting-the-waters]], 754 n.1). See [[cal.1963-04-23.alabama]]. Names: William Moore, Zellner, Forman, Nash, Sitton.'
    src:
