  - id: cal.1963-05-03.king
    when: May 3
    date: '1963-05-03'
    time: 1963-05-03T19:57Z
    thread: king
    also: [alabama-birmingham]
    c: 'King, from Birmingham, calls Clarence Jones in New York. At 3:57 p.m., by the FBI''s wiretap log, Jones asks Levison to draft telegrams to the President and Robert Kennedy "within the hour." Levison''s draft, which King cannot use: "Will you permit this recrudescence of violence in Birmingham to threaten our lives and deny us our rights?"'
    n: '[[w.branch-parting-the-waters]], 761. To check: FBI intercepts of Levison''s telephone, 3:57 and 4:45 p.m., May 3, 1963, FLNY-7-410a (cited by [[w.branch-parting-the-waters]], 761 n.2). See [[cal.1963-05-03.alabama-birmingham]]. Names: Martin Luther King, Levison, Kennedy, Robert Kennedy.'
    src:
