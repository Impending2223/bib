    also: [cuba]
    c: 'Gallup, Apr. 4–9: the administration''s handling of Cuba in recent weeks, 49 percent satisfied, 29 dissatisfied.'
    n: '[[w.gallup-poll]], III, 1816.'
  - id: cal.1963-05-01.poverty
    when: May 1
    date: '1963-05-01'
    thread: poverty
    c: 'Heller to Kennedy, from Lampman''s figures: the economy lifting fewer out of poverty; the poor about as many as in 1957; one-fifth of the nation below $3,000 a family or $1,500 alone.'
    n: '[[w.schlesinger-thousand-days-1965]], 1011. Names: Heller, Kennedy. Check: the memorandum (Kennedy Library).'
    src:
      c: ca6b1388
      rows:
        - 'w.schlesinger-thousand-days-1965 1011: all'
    tags: [name:heller-walter-w, name:kennedy-john-f]
  - id: cal.1963-05-02.alabama
    when: May 2
    date: '1963-05-02'
    thread: alabama-birmingham
    c: 'Birmingham. The children''s march: hundreds of schoolchildren arrested.'
    n: 'The President''s News Conference, [1963 Pub. Papers 372](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=430) (May 8, 1963). [[w.garrow-bearing-the-cross]], 247–49. To check: [[w.mcwhorter-carry-me-home]]; [[w.eskew-but-for-birmingham]]; [[w.branch-parting-the-waters]]. See [[cal.1963-04-03.alabama]].'
  - id: cal.1963-05-03.alabama-birmingham
    when: May 3
    date: '1963-05-03'
    thread: alabama-birmingham
    c: Birmingham. Connor turns fire hoses and police dogs on the marching children in Kelly Ingram Park.
    n: 'Check: the record. [[w.garrow-bearing-the-cross]], 249–50. See [[cal.1963-05-02.alabama]]. Names: Connor.'
    tags: [name:connor-eugene]
  - id: cal.1963-05-04.elections-1964
    when: May 4
    date: '1963-05-04'
    thread: elections-1964
    c: Rockefeller, divorced in 1962, marries Margaretta Fitler Murphy, divorced a month before.
    n: 'To check: [[w.kramer-i-never-wanted-to]]; [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.novak-agony-of-the-g]]; [[w.white-making-of-the-president-1965]]. See [[cal.1963-04-08.elections-1964]]. Names: Nelson Rockefeller, Margaretta Rockefeller.'
    tags: [name:rockefeller-nelson, name:rockefeller-margaretta-fitler]
  - id: cal.1963-05-04.alabama-birmingham
    when: May 4
    date: '1963-05-04'
    thread: alabama-birmingham
    c: 'Kennedy, to a delegation at the White House: the pictures from Birmingham make him "sick"; he has no power to intervene, but Burke Marshall and Joseph Dolan are on their way to mediate. In Birmingham Marshall meets Smyer, David Vann, Erskine Smith and the merchants: a larger group to see him Sunday.'
    n: '[[w.garrow-bearing-the-cross]], 250. See [[cal.1963-04-03.alabama]]. Names: Kennedy, Marshall, Dolan.'
    tags: [name:kennedy-john-f, name:marshall-burke, name:dolan-joseph-f, state:al, city:birmingham]
  - id: cal.1963-05-06.testing
    when: May 6
    date: '1963-05-06'
    thread: testing
    c: 'NSAM 239: the Geneva talks stalled; ACDA to look for steps short of general disarmament, with the test ban still sought.'
    n: '[FRUS 1961–63, VII, doc. 284](https://history.state.gov/historicaldocuments/frus1961-63v07/d284). See [[cal.1963-04-24.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-05-07.mayors-baltimore
    when: May 7
    date: '1963-05-07'
    thread: mayors
    also: [elections-1963]
    c: Baltimore. McKeldin (R) elected mayor over Goodman (D), 108,427 to 103,761, 51.1 percent.
    n: '[Wikipedia, "1963 Baltimore mayoral election"](https://en.wikipedia.org/wiki/1963_Baltimore_mayoral_election); check against the Board of Supervisors of Elections. See [[cal.1963-03-05.mayors-baltimore]]. Names: McKeldin, Goodman.'
    tags: [state:md, city:baltimore, name:mckeldin-theodore-r, name:goodman-philip-h]
  - id: cal.1963-05-07.alabama-birmingham
    when: May 7
    date: '1963-05-07'
    thread: alabama-birmingham
    c: Birmingham. The jails full; Wallace sends state troopers.
    n: 'Check: the record. [[w.garrow-bearing-the-cross]], 253–55 (the jails full). See [[cal.1963-05-02.alabama]]. Names: Wallace.'
    tags: [name:wallace-george-c]
  - id: cal.1963-05-07.civil-rights-the-executive
    when: May 7
    date: '1963-05-07'
    thread: civil-rights-the-executive
    also: [alabama-birmingham]
    c: 'Birmingham. The Senior Citizens Committee, some eighty, called by Smyer: Sheriff Bailey, the police at the breaking point; Marshall, for a negotiated peace. They authorize the merchants'' negotiators, two or three dissenting. That night Smyer, Vann and two merchants with Pitts, Shores and Andrew Young, Marshall present: the stores desegregated, jobs upgraded, a biracial committee; the release of the jailed unsettled.'
    n: '[[w.garrow-bearing-the-cross]], 253–55. See [[cal.1963-04-03.alabama]]. Names: Marshall, Shores, Young.'
    tags: [name:marshall-burke, name:shores-arthur-d, name:young-andrew-j-jr, state:al, city:birmingham]
  - id: cal.1963-05-08.vietnam
    when: May 8
    date: '1963-05-08'
    thread: vietnam
    c: Huế, the Buddha's birthday. Buddhist flags banned; a crowd at the radio station for Trí Quang's address, refused. Troops and armored cars fire; eight killed by the consul's first count. The government blames the Viet Cong.
    n: 'FRUS 1961–63, III, docs. [112](https://history.state.gov/historicaldocuments/frus1961-63v03/d112), [117](https://history.state.gov/historicaldocuments/frus1961-63v03/d117), [118](https://history.state.gov/historicaldocuments/frus1961-63v03/d118); doc. [116](https://history.state.gov/historicaldocuments/frus1961-63v03/d116) (Helble, May 10: the order on the flags; the Civil Guard''s unit fired; the government''s line). [Report of the United Nations Fact-Finding Mission to South Viet-Nam](https://digitallibrary.un.org/record/729703), U.N. Doc. A/5630 (Dec. 7, 1963) (Viet. II.I.3). [[w.miller-misalliance]], 260–68 (260–61: the crowd, the tape refused, the armored car, the explosion and the shots, the government''s line; 266–67: the ban of May 6, the flags torn down May 7, Trí Quang''s remarks); [[w.schulimson-joint-chiefs-of-staff]], 304–305 (not the count); [[w.futrell-united-states-air-force]], 185 (the flag rule; the troops sent to break up the rally). To check: [[w.schecter-new-face-of-buddha]]; [[w.luu-buddhist-crises-in-vietnam]]; [[w.mau-sau-thang-phap-nan]]; [[w.moyar-political-monks]]; [[w.mcallister-only-religions-count-in]]; [[w.miller-religious-revival-and-the]]; [[w.hammer-death-in-november]]; [[w.jacobs-cold-war-mandarin]]; [[w.moyar-triumph-forsaken]]; [[w.winters-year-of-the-hare]]; [[w.jones-death-of-a-generation]]; [[w.shaw-lost-mandate-of-heaven-2015]]; [[w.cung-phong-trao-phat-giao]]; [[w.luan-ben-giong-lich-su]]; [[w.gheddo-cross-and-the-bo]]; [[w.tue-cong-cuoc-tranh-dau]]; Diệm''s telegram no. 9195, May 6, 1963, the ban, printed in Lê Cung, *Phong Trào Phật Giáo Miền Nam Việt Nam 1963* (2005), 355 (cited by [[w.miller-misalliance]], 266 n.66); the Huế police chief''s telegram no. 249-VP/M, May 10, 1963, quoted in Lê Cung, 150 (cited by [[w.miller-misalliance]], 267 n.69); [[w.minh-vietnamese-engaged-buddhism]]; [[w.ford-cold-war-monks]]; [[w.hanh-vietnam]]; [[w.halberstam-making-of-a-quagmire]]; [[w.browne-new-face-of-war]]; [[w.higgins-our-vietnam-nightmare-1965]]; [[w.prochnau-once-upon-a-distant]]; [[w.blair-lodge-in-vietnam]]; Hearings before a Subcommittee of the Committee on Appropriations, House of Representatives, Foreign Operations Appropriations for 1964, 88th Cong, 1st sess (Washington, 1963), pt 3, pp 264-65 (cited by [[w.futrell-united-states-air-force]], 185 n.2). Names: Thích Trí Quang, Helble. Check: Miller, 261, gives nine dead, seven at the scene and two within hours, and an explosion with the gunfire. Check: Futrell, 185, places the rally in Saigon and has an explosion kill several when the Civil Guard moved to break it up; the consul''s reports are from Huế (doc. 112).'
    src:
      c: 77596d8d
      rows:
