  - id: cal.1963-05-04.alabama-birmingham
    when: May 4
    date: '1963-05-04'
    thread: alabama-birmingham
    c: 'Kennedy, to a delegation at the White House: the pictures from Birmingham make him "sick"; he has no power to intervene, but Burke Marshall and Joseph Dolan are on their way to mediate. In Birmingham Marshall meets Smyer, David Vann, Erskine Smith and the merchants: a larger group to see him Sunday.'
