  - id: cal.1963-05-02.right-and-the-military
    when: May 2
    date: '1963-05-02'
    thread: right-and-the-military
    also: [republican-party-congress]
    c: 'Senate. Kuchel (R), "The Fright Peddlers": of the thousands of letters a day to his office, a hundred or two hundred "fright mail"; Chinese Communist troops said to be poised on the Mexican border; Georgia''s Exercise Water Moccasin a prelude, the letters say, to United Nations rule.'
    n: 'The Senate sat from noon to 3:34 p.m.: [Daily Digest, D177](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=175). [109 Cong. Rec. 7636–40](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt6/pdf/GPO-CRECB-1963-pt6-6-1.pdf) (1963). [[w.perlstein-before-the-storm]], 210 (the rumors). Check: Perlstein dates the speech May 10, a day the Senate did not sit; Keating, in the Senate May 9, speaks of it as given "last week" (109 Cong. Rec. 8247). To check: Kuchel, "The Plot to Destroy America," *New York Times Magazine*, July 21, 1963 (cited by [[w.perlstein-before-the-storm]], 210 n.1). Names: Kuchel.'
    src:
