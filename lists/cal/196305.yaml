enty to the hospital; at the White House Sunday, Robert Kennedy: "sticking bayonets in people"; Marshall to King from the Oval Office: "if there are no other incidents he thinks he can control his people"; three thousand troops moved in Operation Oak Tree; the statement at 8:48 p.m., "The Birmingham agreement was and is a fair and just accord.". To check: [[w.rosenberg-kennedy-johnson-and-the]] ("Protest in Birmingham"); Watkins to Moore, May 15, 1963 (on May 10); Whitehouse to Moore, May 13, 1963 (on May 11), Eugene "Bull" Connor Papers, Birmingham Public Library Archives; *Birmingham News*, May 12, 1963, at 1; [*New York Times*, May 12, 1963](https://timesmachine.nytimes.com/timesmachine/1963/05/12/issue.html), at 1; SAC Birmingham to Director, "Unsubs, Bombing of Gaston Motel . . .," May 24, 1963, FBI file 157-881-NR (cited by [[w.garrow-bearing-the-cross]], 260 n.33); [Jack Rosenthal], "Some Sketchy Notes on Birmingham," May 12, 1963, Victor Navasky Papers, Kennedy Library; *New York Times*, [May 13 at 1, 24, 25](https://timesmachine.nytimes.com/timesmachine/1963/05/13/issue.html) and [May 14, 1963, at 1, 26, 27](https://timesmachine.nytimes.com/timesmachine/1963/05/14/issue.html); Donald R. Coppock, "Birmingham Detail," May 29, 1963, Civil Rights Division FOIA (DOJ microfilm, reel 120) (cited by [[w.garrow-bearing-the-cross]], 261 n.34). See [[cal.1963-04-03.alabama]]. Names: Wallace, Robert F. Kennedy, McNamara, Katzenbach, Marshall, Martin Luther King.'
