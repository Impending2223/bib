  - id: cal.1963-11-23.poverty-2
    when: Nov. 23
    date: '1963-11-23'
    time: 1963-11-24T00:41Z
    thread: poverty
    also: [economy]
    c: 'Heller to Johnson, 7:41 p.m.: early in November he had asked the departments for ideas against poverty, and three days before his death Kennedy approved his planning a program. Did Johnson want one? "Go ahead. Give it the highest priority. Push ahead full tilt," by Johnson''s account. As Heller left, Johnson: "I''m no budget slasher. ... If you looked at my record, you would know that I am a Roosevelt New Dealer. As a matter of fact, ... John F. Kennedy was a little too conservative to suit my taste," by Heller''s notes.'
    n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 3 (LBJ Library; National Archives Catalog) (the time). [[w.johnson-vantage-point]], 69–71; [[w.dallek-flawed-giant]], 60 (Johnson''s words, in Dallek''s form: "That''s my kind of program"); [[w.caro-passage-of-power]], 539–40 (Heller''s account: "we should push ahead full tilt"); [[w.sundquist-politics-and-policy]], 137 (Johnson to Heller: "That''s my kind of program. ... Move full speed ahead," by Heller''s account); [[w.kotz-judgment-days]], 27 (that evening, the Executive Office Building; Johnson: "That''s my kind of program. ... We should push ahead full tilt"); [[w.bernstein-guns-or-butter]], 31 (Johnson as Heller left, by Heller''s notes); [[w.bernstein-guns-or-butter]], 94–95 ("my kind of undertaking. I''m interested. I''m sympathetic. Go ahead. Give it the highest priority. Push ahead full tilt."). Johnson gives 7:40 p.m. (69). [[w.branch-pillar-of-fire]], 174–75. Names: Heller, Johnson, Kennedy.'
