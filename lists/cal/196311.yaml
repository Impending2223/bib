  - id: cal.1963-11-01.vietnam-saigon
    when: Nov. 1
    date: '1963-11-01'
    time: 1963-11-01T02:00Z
    thread: vietnam-saigon
    c: 'Gia Long Palace, the morning: Diệm with Felt and Lodge, then with Lodge alone, fifteen minutes. The bonzes, he says, have told the UN commission they were "intoxicated" by Americans; the names to go to the embassy. The universities to reopen "little by little" when the commission has gone. Lodge to ask Colby and Nolting about Nhu. "Tell President Kennedy that I take all his suggestions very seriously and wish to carry them out but it is a question of timing."'
    n: '[FRUS 1961–63, IV, doc. 262](https://history.state.gov/historicaldocuments/frus1961-63v04/d262) (Lodge, 3 p.m.; received in Washington after the coup had begun); doc. [261](https://history.state.gov/historicaldocuments/frus1961-63v04/d261) (Felt''s call). [[w.miller-misalliance]], 317 (the meeting; the appeal to Kennedy; Lodge: "If the U.S. wants to make a package deal, I would think we were in position to do it"); [[w.moyar-triumph-forsaken]], 265–66; [[w.mcnamara-in-retrospect]], ch. 3 at n.46 (Embtel 841; Lodge: "Tell us what you want and we''ll do it"). See [[cal.1963-10-27.vietnam]]. Names: Diệm, Felt, Lodge, Colby, Nolting, Kennedy.'
