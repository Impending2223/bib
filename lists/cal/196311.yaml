  - id: cal.1963-11-01.civil-rights-bill
    when: Nov. 1
    date: '1963-11-01'
    thread: civil-rights-bill
    also: [king]
    c: 'Russell''s letter asking the Attorney General about King and Communism unanswered since July. The President rejects four drafts of Robert Kennedy''s reply, Hoover refusing the FBI''s name to any that clears King; Katzenbach and Evans call on Russell instead. Russell: he knows King is no Communist and will make no speech on it. "You and I are a mile apart on civil rights, but I''ll tell you I''m a hundred miles away from George Wallace."'
    n: '[[w.branch-pillar-of-fire]], 159–62. To check: Belmont to Tolson, Nov. 1, 1963, 100-3-116-517, FK-NR (cited by [[w.branch-pillar-of-fire]], 159); Evans to Belmont, Nov. 1, 1963, 100-3-116-518, FK-NR (cited by [[w.branch-pillar-of-fire]], 159); Katzenbach Oral History, Oct. 8, 1969, JFK (cited by [[w.branch-pillar-of-fire]], 161). Names: Russell, Kennedy, Robert Kennedy, Hoover, Katzenbach, Evans, Wallace.'
    src:
