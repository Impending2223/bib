    c: 'The Freedom Vote. COFO''s mock election for governor, open to Negroes kept off the rolls: Aaron Henry for governor, Ed King for lieutenant governor; some 80,000 ballots (Check). White students from Yale and Stanford among the workers.'
    n: 'COFO, [Freedom Vote, sample ballot](https://www.crmvet.org/docs/631103_cofo_ballot.pdf) (Nov. 3, 1963). [[w.dittmer-local-people]], 199–206 (202–05: the ticket, the Yale and Stanford students, the ballots of Nov. 2–4, more than 83,000). To check: [[w.payne-ive-got-the-light]]; [[w.burner-and-gently-he-shall]]; Ronnie Dugger, "History in Mississippi, 1963," *Texas Observer*, Nov. 15, 1963, 3 (cited by [[w.dittmer-local-people]], 203 n.20); *Mississippi Free Press*, Nov. 16, 1963 (cited by [[w.dittmer-local-people]], 205 n.26). See [[cal.1963-03-27.mississippi]]. Check: Dittmer, 205, gives more than 83,000. Names: Henry, Ed King.'
