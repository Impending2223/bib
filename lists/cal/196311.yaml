section: XLVIII
entries:
  - id: cal.1963-11-01.vietnam
    when: Nov. 1–2
    date: '1963-11-01'
    thread: vietnam
    c: Coup in Saigon. The generals under Dương Văn Minh and Trần Văn Đôn take the city; Conein at their headquarters. Diệm telephones Lodge, 4:30 p.m.; Lodge fears for his safety. Diệm and Nhu leave the palace, are taken at a Cholon church the next morning, and are killed in an armored car.
    n: 'FRUS 1961–63, IV, docs. [234](https://history.state.gov/historicaldocuments/frus1961-63v04/d234), [249](https://history.state.gov/historicaldocuments/frus1961-63v04/d249), [259](https://history.state.gov/historicaldocuments/frus1961-63v04/d259), [273](https://history.state.gov/historicaldocuments/frus1961-63v04/d273). Kennedy, Oval Office recordings on Vietnam (Viet. II.J). [S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf) (1975). [[w.miller-misalliance]], 315–24; [[w.gibbons-u-s-government-and]], II, 199–202; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 290; [[w.schulimson-joint-chiefs-of-staff]], 393; [[w.marolda-united-states-navy-and]], 273; [[w.futrell-united-states-air-force]], 191; [[w.staaveren-u-s-air-force]], 20; [[w.asselin-hanois-road-to-the]], 160 (Diệm and Nhu killed; Minh at the head). To check: [[w.ahern-cia-and-the-house-2000]]; [[w.hammer-death-in-november]]; [[w.prados-jfk-and-the-diem]]; [[w.winters-year-of-the-hare]]; [[w.jones-death-of-a-generation]]; [[w.kaiser-american-tragedy]]; [[w.kahin-intervention]]; [[w.jacobs-cold-war-mandarin]]; [[w.moyar-triumph-forsaken]]; [[w.thanh-nhung-ngay-cuoi-cung]]; [[w.dinh-20-nam-binh-nghiep]]; [[w.shaw-lost-mandate-of-heaven-2015]]; [[w.ahern-cia-and-the-generals]]; [[w.don-our-endless-war]]; [[w.don-viet-nam-nhan-chung]]; [[w.mau-viet-nam]]; [[w.tho-nhat-ky-do-tho]]; [[w.dung-lam-the-nao-de]]; [[w.blair-lodge-in-vietnam]]; [[w.nichter-last-brahmin]]; [[w.nolting-from-trust-to-tragedy]]; [[w.colby-lost-victory]]; [[w.gnoinska-poland-and-vietnam-1963]]; [[w.maneli-war-of-the-vanquished]]; [[w.pentagon-papers]] (K–J Adm. II.H.3). See [[cal.1963-05-08.vietnam]]. Names: Dương Văn Minh, Trần Văn Đôn, Ngô Đình Diệm, Ngô Đình Nhu, Conein, Lodge.'
    tags: [name:duong-van-minh, name:tran-van-don, name:conein-lucien, name:ngo-dinh-diem, name:lodge-henry-cabot, name:ngo-dinh-nhu, place:saigon, place:cholon]
  - id: cal.1963-11-01.opinion-5
    when: Nov. 1
    date: '1963-11-01'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Oct. 11–16: Republicans'' choice for 1964: Goldwater 45, Rockefeller 23, Romney 16, Scranton 5; others, no preference 11. Independents: Goldwater 34, Rockefeller 25.'
    n: '[[w.gallup-poll]], III, 1848. Names: Goldwater, Nelson Rockefeller, Romney, Scranton.'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1963-11-02.mississippi-ms
    when: Nov. 2–4
    date: '1963-11-02'
    thread: mississippi
    also: [voting-rights, civil-rights-organizations, elections-1963]
    c: 'The Freedom Vote. COFO''s mock election for governor, open to Negroes kept off the rolls: Aaron Henry for governor, Ed King for lieutenant governor; some 80,000 ballots (Check). White students from Yale and Stanford among the workers.'
    n: 'COFO, [Freedom Vote, sample ballot](https://www.crmvet.org/docs/631103_cofo_ballot.pdf) (Nov. 3, 1963). [[w.dittmer-local-people]], 199–206. To check: [[w.payne-ive-got-the-light]]; [[w.burner-and-gently-he-shall]]. See [[cal.1963-03-27.mississippi]]. Check: Dittmer, 205, gives more than 83,000. Names: Henry, Ed King.'
    tags: [state:ms, name:henry-aaron, name:king-edwin]
  - id: cal.1963-11-03.opinion-5
    when: Nov. 3
    date: '1963-11-03'
    thread: opinion
    also: [elections-1964-polls, goldwater]
    c: 'Gallup, Oct. 11–16: Republicans, Goldwater or Nixon: Nixon 52, Goldwater 48, the 8 undecided excluded. Independents: Goldwater 51, Nixon 49.'
    n: '[[w.gallup-poll]], III, 1848. Names: Goldwater, Nixon.'
    tags: [name:goldwater-barry-m, name:nixon-richard-m]
  - id: cal.1963-11-04.economy
    when: Nov. 4
    date: '1963-11-04'
    thread: economy
    c: 'Henry Ford II and Stuart T. Saunders, cochairmen of the Business Committee for Tax Reduction in 1963, before Senate Finance on H.R. 8363: the cut enacted this year, effective Jan. 1, 1964. Byrd: what harm in waiting for the January budget and its cuts in spending?'
    n: 'Daily Digest, [109 Cong. Rec. D532](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=530) (Nov. 4, 1963). [[w.stein-fiscal-revolution-in-america]], 451–52. See [[cal.1963-04-25.economy]]. Names: Henry Ford II, Byrd.'
    tags: [name:ford-henry-ii, name:byrd-harry-f]
  - id: cal.1963-11-05.states-and-cities
    when: Nov. 5
    date: '1963-11-05'
    thread: elections-1963
    also: [governors, mayors]
    c: 'Off-year elections. Kentucky: Breathitt (D) governor over Nunn, 449,551 to 436,496, 50.7 percent. Mississippi: Paul Johnson (D) over Phillips, 225,456 to 138,515, 61.9 percent, the first Republican nominee for governor since 1947. Philadelphia: Tate (D) elected mayor over the Republican, 401,714 to 333,446, 54.3 percent; Kennedy spoke for him Oct. 30. San Francisco: U.S. Representative Shelley (D) mayor. Boston: Collins re-elected.'
    n: 'Kentucky: [Ky. *Statement of the Official Vote*, general election, Nov. 5, 1963, sheet 7](https://elect.ky.gov/results/1973-1979/Documents/1963.pdf). Remarks in Philadelphia at a Dinner Sponsored by the Democratic County Executive Committee, [1963 Pub. Papers 820](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=878) (Oct. 30, 1963). Mississippi and Philadelphia: [Wikipedia, "1963 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1963_Mississippi_gubernatorial_election); [Wikipedia, "1963 Philadelphia municipal election"](https://en.wikipedia.org/wiki/1963_Philadelphia_municipal_election). To check: [[w.bass-transformation-of-southern-politics-1976]]; [[w.pearce-divide-and-dissent]]. Names: Paul Johnson, Shelley, Phillips, Breathitt, Nunn, Tate, John Collins.'
    tags: [name:breathitt-edward-t, name:nunn-louie-b, name:johnson-paul-b-jr, name:phillips-rubel, name:tate-james-h-j, name:shelley-john-f, name:collins-john-f, name:kennedy-john-f, state:ky, state:ms, state:pa, state:ca, state:ma, city:philadelphia, city:san-francisco, city:boston]
  - id: cal.1963-11-05.specials
    when: Nov. 5
    date: '1963-11-05'
    thread: specials
    c: Pennsylvania 23rd, special. Albert Johnson (R) holds Gavin's seat over Hagerty (D), 64,137 to 45,677, 58.4 percent. Swing 0.7 to D.
    n: 'Votes: CQ Guide 6th (2010) 1271. See [[cal.1961-04-04.states-and-cities]]. Names: Albert Johnson, Gavin, Hagerty.'
    tags: [special:1963-11-05-h-PA-23, name:johnson-albert-w, name:gavin-leon-h, name:hagerty-william-t]
  - id: cal.1963-11-05.mississippi-ms
    when: Nov. 5
    date: '1963-11-05'
    thread: mississippi
    also: [governors, elections-1963]
    c: Mississippi. Paul Johnson (D) elected governor over Rubel Phillips (R), 225,456 to 138,515, 61.9 percent. The first Republican nominee for governor since 1947.
    n: '[Wikipedia, "1963 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1963_Mississippi_gubernatorial_election). Check: *Mississippi Official and Statistical Register, 1964–1968*. To check: [[w.crespino-in-search-of-another]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]. See [[cal.1963-08-27.mississippi-ms]]; [[cal.1963-11-05.states-and-cities]]. Names: Paul Johnson, Phillips.'
    tags: [state:ms, name:johnson-paul-b-jr, name:phillips-rubel]
  - id: cal.1963-11-05.mayors-cleveland
    when: Nov. 5
    date: '1963-11-05'
    thread: mayors
    also: [elections-1963]
    c: Cleveland. Locher re-elected without opposition, 154,257 votes.
    n: 'Votes: [Wikipedia, "1963 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1963_Cleveland_mayoral_election), from the *Cleveland Press* and *Plain Dealer*, Nov. 6, 1963 (Check). See [[cal.1962-10-02.mayors-cleveland]]. Names: Locher.'
    tags: [state:oh, city:cleveland, name:locher-ralph-s]
  - id: cal.1963-11-05.mayors-indianapolis
    when: Nov. 5
    date: '1963-11-05'
    thread: mayors
    also: [elections-1963]
    c: Indianapolis. John J. Barton (D) mayor over Clarence Drayer (R), 68,316 to 63,091, 48.1 percent; an independent 10,709, 7.5 percent. Gary. A. Martin Katz (D) elected mayor (Check).
    n: 'Votes: [Wikipedia, "1963 Indianapolis mayoral election"](https://en.wikipedia.org/wiki/1963_Indianapolis_mayoral_election), from [[w.encyclopedia-of-indianapolis]] (Check). Names: Barton, Drayer, Katz.'
    tags: [state:in, city:indianapolis, city:gary, name:barton-john-j, name:drayer-clarence, name:katz-a-martin]
  - id: cal.1963-11-05.mayors-philadelphia
    when: Nov. 5
    date: '1963-11-05'
    thread: mayors
    also: [elections-1963]
    c: Philadelphia. Tate (D) elected mayor over McDermott (R), 401,714 to 333,446, 54.3 percent. Republicans take the two Northeast council seats.
    n: '[Wikipedia, "1963 Philadelphia municipal election"](https://en.wikipedia.org/wiki/1963_Philadelphia_municipal_election), from the *Bulletin Almanac 1964*, 29–31. To check: [[w.mckenna-negro-vote-in-philadelphia]]. See [[cal.1963-05-21.mayors-philadelphia]]; [[cal.1963-11-05.states-and-cities]]. Names: Tate, McDermott.'
    tags: [state:pa, city:philadelphia, name:tate-james-h-j, name:mcdermott-james-t]
  - id: cal.1963-11-05.mayors-san-diego
    when: Nov. 5
    date: '1963-11-05'
    thread: mayors
    also: [elections-1963]
    c: San Diego. Curran elected mayor over Goodrich, 96,898 to 55,520, 63.6 percent.
    n: 'Votes: [Wikipedia, "1963 San Diego mayoral election"](https://en.wikipedia.org/wiki/1963_San_Diego_mayoral_election); Check: the City Clerk''s canvass. See [[cal.1963-09-17.mayors-san-diego]]. Names: Curran, Goodrich.'
    tags: [state:ca, city:san-diego, name:curran-frank, name:goodrich-murray-d]
  - id: cal.1963-11-05.mayors-san-francisco
    when: Nov. 5
    date: '1963-11-05'
    thread: mayors
    also: [elections-1963]
    c: San Francisco. Shelley, U.S. Representative since 1949, elected mayor over Supervisor Dobbs, 120,560 to 92,627, 50.1 percent; a third 27,581, 11.5 percent. Christopher, mayor since 1956, not running. Nov. 3, pickets arrested at Mel's Drive-In on Geary Boulevard, a chain Dobbs co-owns, over its hiring of Negroes.
    n: 'Votes: [Wikipedia, "1963 San Francisco mayoral election"](https://en.wikipedia.org/wiki/1963_San_Francisco_mayoral_election), from Our Campaigns; Check: the Registrar of Voters'' canvass. Mel''s: R. J. Moore, ["Mel''s Drive-In Protest 1963"](https://www.foundsf.org/index.php?title=Mel%E2%80%99s_Drive-In_Protest_1963) (FoundSF). To check: [[w.hartman-city-for-sale]]; [[w.crowe-prophets-of-rage]]. See [[cal.1963-11-05.states-and-cities]]. Names: Shelley, Harold Dobbs, Christopher.'
    tags: [state:ca, city:san-francisco, name:shelley-john-f, name:dobbs-harold, name:christopher-george]
  - id: cal.1963-11-05.mayors-boston
    when: Nov. 5
    date: '1963-11-05'
    thread: mayors
    also: [elections-1963]
    c: Boston. Collins re-elected over Piemonte, 108,624 to 73,067, 59.8 percent.
    n: '[Boston, *Annual Report of the Election Department*, 1963, p. 114](https://archive.org/details/annualreportofbo1963bost/page/n129). See [[cal.1963-09-24.mayors-boston]]; [[cal.1963-11-05.states-and-cities]]. Names: John Collins, Piemonte.'
    tags: [state:ma, city:boston, name:collins-john-f, name:piemonte-gabriel]
  - id: cal.1963-11-07.elections-1964
    when: Nov. 7
    date: '1963-11-07'
    thread: elections-1964
    c: Rockefeller announces for the Republican nomination, at Albany, N.Y.
    n: '[[w.perlstein-before-the-storm]], 262 (the date). To check: [[w.kramer-i-never-wanted-to]]; [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.white-making-of-the-president-1965]]. See [[cal.1963-04-08.elections-1964]]. Names: Nelson Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1963-11-07.middle-east
    when: Nov. 7
    date: '1963-11-07'
    thread: middle-east
    also: [foreign-aid]
    c: 'Senate, on the foreign aid bill, adopts Gruening''s amendment, aimed at the UAR: no aid to a country the President finds engaged in or preparing for aggression against the United States or any country it aids, [65–13](https://voteview.com/rollcall/RS0880172). Fulbright''s, giving the President more discretion, refused, [32–46](https://voteview.com/rollcall/RS0880171).'
    n: '[109 Cong. Rec., Senate, Nov. 7, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt16/pdf/GPO-CRECB-1963-pt16-5-1.pdf). The act: [[cal.1963-12-16.foreign-aid]]. To check: [[w.gruening-many-battles]]; [[w.burns-economic-aid-and-american]]. Names: Gruening, Fulbright.'
    tags: [name:gruening-ernest, name:fulbright-j-william]
  - id: cal.1963-11-07.economy-debt-limit
    when: Nov. 7
    date: '1963-11-07'
    thread: economy-debt-limit
    c: 'House passes H.R. 8969: the $309 billion debt limit to June 30, 1964, and $6 billion more from Dec. 1 to June 29. Closed rule, [212–149](https://voteview.com/rollcall/RH0880087); Byrnes''s motion to recommit, for a smaller increase, refused, [172–197](https://voteview.com/rollcall/RH0880088); passed, [187–179](https://voteview.com/rollcall/RH0880089).'
    n: '[109 Cong. Rec., House, Nov. 7, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt16/pdf/GPO-CRECB-1963-pt16-5-2.pdf). See [[cal.1963-05-15.economy]]. Names: Byrnes.'
    tags: [name:byrnes-john-w]
  - id: cal.1963-11-09.state-constitutions-tx
    when: Nov. 9
    date: '1963-11-09'
    thread: state-constitutions
    also: [voting-rights, welfare]
    c: 'Texas votes on four amendments. The poll tax amendment, to repeal payment as a condition of voting and provide for registration of voters, refused, 243,120 to 316,775, 43.4 percent. Aid to the needy aged, disabled, blind and children, up to $60 million a year, adopted, 330,922 to 192,050, 63.3 percent. Refused: $150 million more for the Veterans'' Land Fund, 250,556 to 258,433, 49.2 percent; a Jefferson County retirement fund.'
    n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 9, 1963](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1963-11-09). To check: [[w.may-texas-state-constitution]]; [[w.lawson-black-ballots]]; [[w.davidson-race-and-class-in]]. See [[cal.1962-11-06.state-constitutions-tx]]; [[cal.1962-08-27.voting-rights]].'
    tags: [state:tx]
  - id: cal.1963-11-10.black-nationalism-detroit
    when: Nov. 10
    date: '1963-11-10'
    thread: black-nationalism
    c: 'Detroit. Malcolm X, "Message to the Grass Roots," at the Northern Negro Grass Roots Leadership Conference, King Solomon Baptist Church, organized by Cleage and others: "Revolution is based on land"; the March on Washington taken over: "It became a picnic, a circus."'
    n: 'To check: [[w.malcolm-x-speaks]]; [[w.marable-malcolm-x]]; [[w.dillard-faith-in-the-city]]. See [[cal.1963-08-28.march-on-washington]]. Names: Malcolm X, Cleage.'
    tags: [state:mi, city:detroit, name:malcolm-x, name:cleage-albert-b-jr]
  - id: cal.1963-11-11.poverty
    when: Nov. 11
    date: '1963-11-11'
    thread: poverty
    c: 'Kennedy to Heller on the year''s program: "First we''ll have your tax cut; then we''ll have my expenditures program."'
    n: '[[w.schlesinger-thousand-days-1965]], 1012. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1963-05-01.poverty]]. Names: Kennedy, Heller.'
    tags: [name:kennedy-john-f, name:heller-walter-w]
  - id: cal.1963-11-12.elections-1964
    when: Nov. 12
    date: '1963-11-12'
    thread: elections-1964
    c: 'The first strategy meeting for 1964: Robert Kennedy, O''Brien, O''Donnell, Sorensen, John Bailey and Richard Maguire of the National Committee, Stephen Smith, Scammon. The South and its delegates, the suburbs, the campaign''s organization. Johnson absent; his renomination assumed.'
    n: '[[w.schlesinger-thousand-days-1965]], 1018. Made public: [[w.schlesinger-thousand-days-1965]] (1965). Names: Robert Kennedy, O''Brien, O''Donnell, Sorensen, Stephen Smith, Scammon, Johnson.'
    tags: [name:kennedy-robert-f, name:obrien-lawrence-f, name:odonnell-kenneth-p, name:sorensen-theodore-c, name:smith-stephen-e, name:scammon-richard-m, name:johnson-lyndon-b]
  - id: cal.1963-11-13.opinion
    when: Nov. 13
    date: '1963-11-13'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Oct. 11–16: each State to decide for itself about integration, 43 percent; not, 48. The South, 64 for State choice; Goldwater''s supporters 63, Kennedy''s 31.'
    n: '[[w.gallup-poll]], III, 1851. Names: Goldwater.'
    tags: [name:goldwater-barry-m, name:kennedy-john-f]
  - id: cal.1963-11-13.mayors-jersey-city
    when: Nov. 13
    date: '1963-11-13'
    thread: mayors
    c: Jersey City. Gangemi, mayor since 1961, out of office, found never to have been naturalized; Whelan mayor. Check how Whelan was chosen.
    n: '[Wikipedia, "Thomas J. Whelan (mayor)"](https://en.wikipedia.org/wiki/Thomas_J._Whelan_%28mayor%29); [Wikipedia, "Thomas Gangemi"](https://en.wikipedia.org/wiki/Thomas_Gangemi); [*New York Times*, Nov. 14, 1963](https://timesmachine.nytimes.com/timesmachine/1963/11/14/issue.html). To check: [[w.peirce-mid-atlantic-states-of]]. Names: Gangemi, Whelan.'
    tags: [state:nj, city:jersey-city, name:gangemi-thomas, name:whelan-thomas-j]
  - id: cal.1963-11-14.state-and-city-finance-mi
    when: Nov. 14
    date: '1963-11-14'
    thread: state-and-city-finance
    c: 'Michigan. Romney''s fiscal program fails; the special session adjourns. Romney: "the people of Michigan lost today." Check the votes and the date.'
    n: 'Check: the *Journal of the House* and *Journal of the Senate*. See [[cal.1963-09-11.state-and-city-finance-mi]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1963-11-15.foreign-aid
    when: Nov. 15
    date: '1963-11-15'
    thread: foreign-aid
    c: Senate passes the foreign aid authorization, [63–17](https://voteview.com/rollcall/RS0880190), after the Mansfield–Dirksen cut of $460 million, [89–0](https://voteview.com/rollcall/RS0880168). Mundt withdraws his amendment against credit for grain sales to Communist countries, for a bill of his own.
    n: '[109 Cong. Rec., Senate, Nov. 15, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt16/pdf/GPO-CRECB-1963-pt16-10-1.pdf). To check: [[w.johnson-congress-and-the-cold]]. See [[cal.1963-04-02.foreign-aid]]; [[cal.1963-08-23.foreign-aid]]; [[cal.1963-10-09.trade]]. Names: Mansfield, Dirksen, Mundt.'
    tags: [name:mansfield-mike, name:dirksen-everett, name:mundt-karl-e]
  - id: cal.1963-11-15.opinion
    when: Nov. 15
    date: '1963-11-15'
    thread: opinion
    c: 'Gallup, Oct. 11–16: would vote for a qualified woman nominated for President by their party, 55 percent; would not, 41. Men 58 yes, women 51.'
    n: '[[w.gallup-poll]], III, 1852.'
  - id: cal.1963-11-18.middle-east
    when: Nov. 18
    date: '1963-11-18'
    thread: middle-east
    c: Iraq. Arif, with the army, ousts the Ba'th's civilian leaders, after its National Guard's revolt of Nov. 13. The National Council of the Revolutionary Command gives him extraordinary powers.
    n: 'FRUS 1961–63, XVIII, doc. [363](https://history.state.gov/historicaldocuments/frus1961-63v18/d363). To check: [[w.batatu-old-social-classes-and]]; [[w.tripp-history-of-iraq]]. See [[cal.1963-02-08.middle-east]]. Names: Arif.'
    tags: [name:arif-abdul-salam-muhammad]
  - id: cal.1963-11-19.poverty
    when: Nov. 19
    date: '1963-11-19'
    thread: poverty
    c: 'Kennedy to Heller on the poverty program: the middle class may feel threatened, something to be done for the suburbs; the Council to go full speed ahead for 1964.'
    n: '[[w.schlesinger-thousand-days-1965]], 1012. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1963-05-01.poverty]]. Names: Kennedy, Heller.'
    tags: [name:kennedy-john-f, name:heller-walter-w]
  - id: cal.1963-11-20.vietnam
    when: Nov. 20
    date: '1963-11-20'
    thread: vietnam
    c: Honolulu. Rusk, McNamara, Bundy, and Taylor with Lodge and Harkins. Lodge hopeful of the generals; aid to resume.
    n: '[FRUS 1961–63, IV, doc. 321](https://history.state.gov/historicaldocuments/frus1961-63v04/d321). [[w.gibbons-u-s-government-and]], II, 209–210; [[w.cosmas-joint-chiefs-of-staff-2012]], 6; [[w.marolda-united-states-navy-and]], 335. To check: [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]; [[w.pentagon-papers]]. See [[cal.1963-11-01.vietnam]]. Names: Rusk, McGeorge Bundy, McNamara, Taylor, Lodge, Harkins.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:taylor-maxwell, name:lodge-henry-cabot, name:harkins-paul-d]
  - id: cal.1963-11-20.opinion
    when: Nov. 20
    date: '1963-11-20'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Oct. 11–16: the Kennedy administration pushing integration too fast, 46 percent; not fast enough, 12; about right, 31. Southern whites 73 too fast; Republicans 58.'
    n: '[[w.gallup-poll]], III, 1852. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-11-20.transportation
    when: Nov. 20
    date: '1963-11-20'
    thread: transportation
    c: Senate keeps the $60 million for the supersonic transport in the independent offices appropriation, refusing to strike it, [6–72](https://voteview.com/rollcall/RS0880192).
    n: H.R. 8747, 88th Cong. See [[cal.1963-06-05.transportation]].
  - id: cal.1963-11-20.king
    when: Nov. 20
    date: '1963-11-20'
    thread: king
    c: New York, an airport hotel. King, Levison and Clarence Jones on the book's editing. FBI agents, told of the meeting by the taps, photograph them coming out, to show the Kennedys.
    n: '[[w.garrow-bearing-the-cross]], 306–07. See [[cal.1963-10-10.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King, Levison.'
    tags: [name:king-martin-luther-jr, name:levison-stanley-d, state:ny, city:nyc]
  - id: cal.1963-11-21.economy-debt-limit
    when: Nov. 21
    date: '1963-11-21'
    thread: economy-debt-limit
    c: Senate passes H.R. 8969, [50–26](https://voteview.com/rollcall/RS0880200). Williams's amendment, $4.4 billion more in place of $6 billion, rejected, [35–44](https://voteview.com/rollcall/RS0880199).
    n: '[109 Cong. Rec., Senate, Nov. 21, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt17/pdf/GPO-CRECB-1963-pt17-4-1.pdf). See [[cal.1963-11-07.economy-debt-limit]]. Names: Williams.'
    tags: [name:williams-john-j]
  - id: cal.1963-11-22.assassination
    when: Nov. 22
    date: '1963-11-22'
    thread: assassination
    c: Dallas. Kennedy shot in Dealey Plaza at 12:30 p.m., riding with his wife and Governor Connally, who is wounded. Dead at Parkland Hospital, 1 p.m. Oswald, an employee of the Texas School Book Depository, kills Officer Tippit and is taken in the Texas Theatre.
    n: 'Remarks Prepared for Delivery at the Trade Mart in Dallas, [1963 Pub. Papers 890](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=948) (Nov. 22, 1963). [[w.report-of-the-presidents-1964]]; [S. Rep. No. 94-755, Book V](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-v.pdf) (1976); H.R. Rep. No. 95-1828. [[w.schlesinger-robert-kennedy-and-his]], 607–10, on Robert Kennedy''s day. National Archives: JFK Assassination Records Collection (K–J Adm. II.K). To check: [[w.white-for-president-kennedy]]; [[w.manchester-death-of-a-president]]; [[w.bugliosi-reclaiming-history]]; [[w.shenon-cruel-and-shocking-act]]; [[w.odonnell-johnny-we-hardly-knew]]; [[w.minutaglio-dallas-1963]]; [[w.miller-nut-country]]; [[w.board-final-report]] (K–J Adm. II.H.3). Names: Jacqueline Kennedy, Connally, Lee Harvey Oswald, Tippit.'
    tags: [name:kennedy-john-f, name:kennedy-jacqueline, name:connally-john, name:oswald-lee-harvey, name:tippit-j-d, city:dallas, state:tx]
  - id: cal.1963-11-22.succession
    when: Nov. 22
    date: '1963-11-22'
    thread: succession
    c: 'Johnson sworn in aboard Air Force One at Love Field, 2:38 p.m., by Judge Sarah Hughes, Mrs. Kennedy beside him. At Andrews, Md.: "I will do my best. That is all I can do."'
    n: 'Remarks Upon Arrival at Andrews Air Force Base, [1963–64 Pub. Papers 1](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=85) (Nov. 22, 1963). [President''s Daily Diary, Nov. 22, 1963](https://catalog.archives.gov/id/192430), images 7, 9 (LBJ Library; National Archives Catalog). [[w.johnson-vantage-point]], 14–17 (the oath, Hughes, Mrs. Kennedy beside him; the words at Andrews); [[w.dallek-flawed-giant]], 49–50 (the oath aboard Air Force One, Mrs. Kennedy beside him). To check: [[w.shesol-mutual-contempt]]; [[w.manchester-death-of-a-president]]; [[w.holland-kennedy-assassination-tapes]]; [[w.gillon-kennedy-assassination-24-hours]]; [[w.caro-passage-of-power]]; [[w.johnson-white-house-diary]]; [[w.valenti-very-human-president]]; [[w.taking-charge-2001]]; [[w.presidential-recordings-2005]]. Names: Johnson, Jacqueline Kennedy, Hughes. Check: the Daily Diary gives the oath at 2:40 p.m. (image 9); so does Johnson, "approximately 2:40 p.m. Central Standard Time" (15).'
    tags: [executive:1963-11-22, name:johnson-lyndon-b, name:kennedy-jacqueline, name:hughes-sarah-t]
  - id: cal.1963-11-22.baker
    when: Nov. 22
    date: '1963-11-22'
    thread: baker
    c: 'Don Reynolds, a Maryland insurance agent, before the Rules Committee''s staff in closed session: a stereo set for Johnson, and advertising bought on Johnson''s Austin television station, after he sold Johnson life insurance. Interrupted by the news from Dallas. Check.'
    n: 'To check: [[w.caro-passage-of-power]]. See [[cal.1963-10-07.baker]]. Names: Reynolds, Johnson.'
    tags: [name:reynolds-don-b, name:johnson-lyndon-b]
  - id: cal.1963-11-22.goldwater
    when: Nov. 22–25
    date: '1963-11-22'
    thread: goldwater
    also: [elections-1964]
    c: 'Goldwater in Muncie, Ind., with his wife, at her mother''s funeral. He and Kennedy had talked of campaigning together in 1964: "Standing up to state our points, our issues, and then debating each other." In December, he later wrote, he meant to refuse to be a candidate. Check the dates.'
    n: '[[w.perlstein-before-the-storm]], 248 (Muncie), 253–54 (the debates). To check: [[w.goldwater-with-no-apologies]]; [[w.edwards-goldwater]]; [[w.goldberg-barry-goldwater]]; [[w.white-making-of-the-president-1965]]. Names: Goldwater. Check: Perlstein, 253, has Goldwater tell Kitchel within days of the assassination to spread word that he would not run.'
    tags: [name:goldwater-barry-m, name:kennedy-john-f]
  - id: cal.1963-11-23.succession
    when: Nov. 23
    date: '1963-11-23'
    thread: succession
    c: 'Johnson''s first intelligence briefing, from McCone, in Bundy''s office in the White House basement: nothing to decide at once; South Vietnam the one concern, by Johnson''s account.'
    n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 1 (LBJ Library; National Archives Catalog) (the briefing). [[w.johnson-vantage-point]], 22. Names: Johnson, McCone, McGeorge Bundy.'
    tags: [name:johnson-lyndon-b, name:mccone-john-a, name:bundy-mcgeorge]
  - id: cal.1963-11-23.succession-2
    when: Nov. 23
    date: '1963-11-23'
    thread: succession
    c: 'Eisenhower down from Gettysburg: the better part of an hour with Johnson in the Executive Office Building; then, in the outer office, his advice written out in longhand and dictated to Alice Boyce, by Johnson''s account.'
    n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 1 (LBJ Library; National Archives Catalog) (11:50 a.m., to the Executive Office Building with Johnson; 12:35 p.m., waiting there, "more discussion," his memorandum dictated after). [[w.johnson-vantage-point]], 31. Names: Eisenhower, Johnson.'
    tags: [name:eisenhower-dwight-d, name:johnson-lyndon-b]
  - id: cal.1963-11-23.poverty-2
    when: Nov. 23
    date: '1963-11-23'
    thread: poverty
    c: 'Heller to Johnson, 7:41 p.m.: early in November he had asked the departments for ideas against poverty, and three days before his death Kennedy approved his planning a program. Did Johnson want one? "Go ahead. Give it the highest priority. Push ahead full tilt," by Johnson''s account.'
    n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 3 (LBJ Library; National Archives Catalog) (the time). [[w.johnson-vantage-point]], 69–71; [[w.dallek-flawed-giant]], 60 (Johnson''s words, in Dallek''s form: "That''s my kind of program"). Names: Heller, Johnson, Kennedy. Check: Johnson gives 7:40 p.m. (69).'
    tags: [name:heller-walter-w, name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1963-11-23.transition-and-staff
    when: Nov. 23
    date: '1963-11-23'
    thread: transition-and-staff
    c: 'The Cabinet Room, 2:30 p.m.: Johnson''s first Cabinet meeting. "I want you all to stay on. I need you."'
    n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 2 (LBJ Library; National Archives Catalog) (the meeting). [[w.dallek-flawed-giant]], 56 (the words). See [[cal.1963-11-22.succession]]. Names: Johnson. Check: Dallek''s text puts the meeting on Nov. 25 (56); his note (56 n.7) and the Daily Diary on Nov. 23.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-11-24.assassination
    when: Nov. 24
    date: '1963-11-24'
    thread: assassination
    c: Ruby, a Dallas nightclub owner, shoots Oswald in the basement of police headquarters, 11:21 a.m., before live television; Oswald dead at Parkland, 1:07 p.m. Kennedy lies in state in the Capitol Rotunda.
    n: '[*Report of the President''s Commission on the Assassination of President Kennedy*, ch. V](https://www.archives.gov/research/jfk/warren-commission-report/chapter-5.html) (1964). See [[cal.1963-11-22.assassination]]. Names: Ruby, Lee Harvey Oswald.'
    tags: [name:ruby-jack, name:oswald-lee-harvey, name:kennedy-john-f]
  - id: cal.1963-11-24.vietnam
    when: Nov. 24
    date: '1963-11-24'
    thread: vietnam
    also: [succession]
    c: Johnson's first meeting on Vietnam, with Lodge, Rusk, McNamara, Ball, Bundy, and McCone. Lodge hopeful; McCone less so. Johnson "not at all sure" the coup was right; Lodge in charge, no more division.
    n: '[FRUS 1961–63, IV, doc. 330](https://history.state.gov/historicaldocuments/frus1961-63v04/d330). [President''s Daily Diary, Nov. 24, 1963](https://catalog.archives.gov/id/192432), images 2, 3 (LBJ Library; National Archives Catalog). [[w.gibbons-u-s-government-and]], II, 209; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 498; [[w.johnson-vantage-point]], 43–44; [[w.dallek-flawed-giant]], 99–100. To check: [[w.vandemark-into-the-quagmire]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]. See [[cal.1963-11-01.vietnam]]. Names: Johnson, Lodge, Rusk, Ball, McGeorge Bundy, McNamara, McCone.'
    tags: [name:johnson-lyndon-b, name:lodge-henry-cabot, name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:bundy-mcgeorge, name:mccone-john-a]
  - id: cal.1963-11-25.assassination
    when: Nov. 25
    date: '1963-11-25'
    thread: assassination
    c: Funeral. Requiem mass at St. Matthew's; burial at Arlington. De Gaulle, Erhard, Haile Selassie, and Mikoyan among the mourners. A national day of mourning by proclamation. Johnson receives the governors.
    n: '[Proclamation 3561—National Day of Mourning for President Kennedy](https://www.presidency.ucsb.edu/documents/proclamation-3561-national-day-mourning-for-president-kennedy) (Nov. 23, 1963); Remarks to State Governors After President Kennedy''s Funeral, [1963–64 Pub. Papers 4](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=88) (Nov. 25, 1963). [President''s Daily Diary, Nov. 25, 1963](https://catalog.archives.gov/id/192433), images 2, 3 (LBJ Library; National Archives Catalog). To check: [[w.zelizer-covering-the-body]]. See [[cal.1963-11-22.assassination]]. Names: de Gaulle, Erhard, Haile Selassie I, Mikoyan, Johnson.'
    tags: [name:kennedy-john-f, name:de-gaulle-charles, name:erhard-ludwig, name:haile-selassie-i, name:mikoyan-anastas, name:johnson-lyndon-b]
  - id: cal.1963-11-25.japan-and-korea
    when: Nov. 25
    date: '1963-11-25'
    thread: japan
    also: [succession, korea]
    c: 'After the funeral Johnson receives Park and Ikeda at the State Department. To Park: pleasure at the return to civilian rule. With Ikeda: his party''s victory, Nov. 21; the Joint Committee''s meeting in Tokyo, set for Nov. 25–27, put off to January, the cabinet members flying to it having turned back over the Pacific, Nov. 22.'
    n: 'FRUS 1961–63, XXII, docs. [318](https://history.state.gov/historicaldocuments/frus1961-63v22/d318), [385](https://history.state.gov/historicaldocuments/frus1961-63v22/d385). [President''s Daily Diary, Nov. 25, 1963](https://catalog.archives.gov/id/192433), image 3 (LBJ Library; National Archives Catalog). See [[cal.1963-11-25.assassination]]; [[cal.1962-12-03.japan-and-korea]]. Names: Johnson, Park, Ikeda.'
    tags: [name:johnson-lyndon-b, name:park-chung-hee, name:ikeda-hayato]
  - id: cal.1963-11-25.succession
    when: Nov. 25
    date: '1963-11-25'
    thread: succession
    c: 'Johnson to some forty governors, 8:30 p.m., in his office in the Executive Office Building, late from de Gaulle: the States the federal government''s partners; the tax cut and the civil rights bill; "I need your heart and your hand."'
    n: 'Remarks to State Governors After President Kennedy''s Funeral, [1963–64 Pub. Papers 4](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=88) (Nov. 25, 1963). [[w.johnson-vantage-point]], 28–29 (forty governors; the tax cut and the civil rights bill). Names: Johnson, de Gaulle. Check: Johnson calls the talk off the record, its full text never released, and quotes words of it the Public Papers'' text lacks (28).'
    tags: [name:johnson-lyndon-b, name:de-gaulle-charles]
  - id: cal.1963-11-25.europe-and-the-alliance-france
    when: Nov. 25
    date: '1963-11-25'
    thread: europe-and-the-alliance-france
    c: 'De Gaulle with Johnson after the funeral: the two countries'' differences exaggerated; France knows it can count on the United States if attacked. Johnson had just read a report of de Gaulle telling an allied ambassador the contrary, by his account. Another meeting set for early in the new year.'
    n: 'Remarks to State Governors After President Kennedy''s Funeral, [1963–64 Pub. Papers 4](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=88) (Nov. 25, 1963) (the talk; another meeting set). [[w.johnson-vantage-point]], 23–24. Names: de Gaulle, Johnson.'
    tags: [name:de-gaulle-charles, name:johnson-lyndon-b]
  - id: cal.1963-11-25.economy
    when: Nov. 25
    date: '1963-11-25'
    thread: economy
    c: 'Evening. Johnson with his economic advisers, Heller and Dillon among them: the tax cut accepted, the 1965 budget held under $100 billion. "We won''t have the votes to get it to the floor unless we tell them the budget will be about $100 billion." Byrd of the Finance Committee to be won so.'
    n: '[President''s Daily Diary, Nov. 25, 1963](https://catalog.archives.gov/id/192433), image 3 (LBJ Library; National Archives Catalog) (the day''s schedule: Dillon, Kermit Gordon and Heller, 8:45 p.m.). [[w.dallek-flawed-giant]], 60, 72 (from the notes of the meeting, Heller Papers, JFK Library, and Ackley''s, LBJ Library). See [[cal.1963-01-24.economy]]. Names: Johnson, Heller, Dillon, Harry F. Byrd.'
    tags: [name:johnson-lyndon-b, name:heller-walter-w, name:dillon-c-douglas, name:byrd-harry-f]
  - id: cal.1963-11-26.vietnam
    when: Nov. 26
    date: '1963-11-26'
    thread: vietnam
    also: [succession]
    c: NSAM 273. The withdrawal objectives of Oct. 2 stand. The new government to be helped; no public criticism of one agency by another. Plans asked for stepped-up action against the North and for operations up to 50 kilometers into Laos.
    n: '[NSAM No. 273](https://history.state.gov/historicaldocuments/frus1961-63v04/d331) (Nov. 26, 1963) (K–J Adm. II.H.2). [[w.gibbons-u-s-government-and]], II, 209–210; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 499; [[w.cosmas-joint-chiefs-of-staff-2012]], 6–7; [[w.dallek-flawed-giant]], 101. To check: [[w.newman-jfk-and-vietnam]]; [[w.moise-jfk-and-the-myth]]; [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]. See [[cal.1963-11-01.vietnam]]. Names: Johnson, McGeorge Bundy.'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge]
  - id: cal.1963-11-26.trade
    when: Nov. 26
    date: '1963-11-26'
    thread: trade
    also: [succession]
    c: Senate tables Mundt's bill to bar government guarantees of credit for sales to Communist countries, [57–35](https://voteview.com/rollcall/RS0880203). Johnson's first test in the Senate. Check.
    n: '[109 Cong. Rec., Senate, Nov. 26, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt17/pdf/GPO-CRECB-1963-pt17-7-1.pdf). To check: [[w.caro-passage-of-power]]. See [[cal.1963-10-09.trade]]. Names: Mundt, Johnson.'
    tags: [name:mundt-karl-e, name:johnson-lyndon-b]
  - id: cal.1963-11-26.economy-debt-limit
    when: Nov. 26
    date: '1963-11-26'
    thread: economy-debt-limit
    c: 'The debt limit to $315 billion signed, [77 Stat. 342](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg342.pdf): $315 billion from Dec. 1 to June 29, 1964, $309 billion June 30.'
    n: Statute (K–J Cong. II.J.2). See [[cal.1963-11-07.economy-debt-limit]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-11-26.soviet-union
    when: Nov. 26
    date: '1963-11-26'
    thread: soviet-union
    c: 'Mikoyan with Johnson, 11:35 a.m., Harriman, Thompson and McGeorge Bundy present. A letter for Khrushchev: "I have been in full accord with the policies of President Kennedy." Castro''s subversion in Latin America; no American plan to invade Cuba.'
    n: 'FRUS 1961–63, V, docs. [380](https://history.state.gov/historicaldocuments/frus1961-63v05/d380), [381](https://history.state.gov/historicaldocuments/frus1961-63v05/d381); XI, doc. [380](https://history.state.gov/historicaldocuments/frus1961-63v11/d380). [[w.johnson-vantage-point]], 24–25. Made public: the letter, [[w.johnson-vantage-point]], 25. Names: Mikoyan, Johnson, Harriman, Thompson, McGeorge Bundy, Khrushchev, Kennedy, Castro.'
    tags: [name:mikoyan-anastas, name:johnson-lyndon-b, name:harriman-w-averell, name:thompson-llewellyn-e, name:bundy-mcgeorge, name:khrushchev-nikita-s, name:kennedy-john-f, name:castro-fidel]
  - id: cal.1963-11-26.latin-america
    when: Nov. 26
    date: '1963-11-26'
    thread: latin-america
    c: 'Johnson to the Latin American representatives at the White House, Mrs. Kennedy present at her wish: the Alliance for Progress reaffirmed, "all the energies of my Government" pledged to it.'
    n: 'Remarks on the Alliance for Progress to Representatives of the Countries of Latin America, [1963–64 Pub. Papers 6](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=90) (Nov. 26, 1963). [[w.johnson-vantage-point]], 22 (Mrs. Kennedy). Names: Johnson, Jacqueline Kennedy.'
    tags: [name:johnson-lyndon-b, name:kennedy-jacqueline]
  - id: cal.1963-11-27.succession
    when: Nov. 27
    date: '1963-11-27'
    thread: succession
    also: [civil-rights-bill, economy]
    c: 'Address to a joint session: "let us continue." The civil rights bill first, then the tax bill.'
    n: 'Address Before a Joint Session of the Congress, [1963–64 Pub. Papers 8](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=92) (Nov. 27, 1963). Recording (K–J Adm. II.I). [President''s Daily Diary, Nov. 27, 1963](https://catalog.archives.gov/id/192435), image 1 (LBJ Library; National Archives Catalog). [[w.stein-fiscal-revolution-in-america]], 452 (the tax bill); [[w.dallek-flawed-giant]], 56, 60. To check: [[w.caro-passage-of-power]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1963-11-22.succession]]; [[cal.1963-06-11.civil-rights-bill]]; [[cal.1963-01-24.economy]].'
    tags: [name:johnson-lyndon-b]
    short: Address to the joint session
    to:
      - civil-rights-bill
      - economy
  - id: cal.1963-11-29.assassination
    when: Nov. 29
    date: '1963-11-29'
    thread: assassination
    c: 'E.O. 11130: a commission to report on the assassination. Warren chairman; Senators Russell and Cooper, Representatives Boggs and Ford, Dulles, McCloy. Dec. 13, a joint resolution, [77 Stat. 362](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg362.pdf), gives it subpoena power.'
    n: '[Exec. Order No. 11,130](https://www.presidency.ucsb.edu/documents/executive-order-11130-appointing-commission-report-upon-the-assassination-president-john-f) (K–J Adm. II.H.2); White House Statement on the Appointment of a Special Commission To Investigate the Assassination of President Kennedy, [1963–64 Pub. Papers 13](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=97) (Nov. 29, 1963); [President''s Daily Diary, Nov. 29, 1963](https://catalog.archives.gov/id/192437), images 1, 2, 3 (LBJ Library; National Archives Catalog). [[w.report-of-the-presidents-1964]]; [S. Rep. No. 94-755, Book V](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-v.pdf) (1976) (K–J Adm. II.H.3). [[w.dallek-flawed-giant]], 51. To check: [[w.epstein-inquest]]; [[w.holland-kennedy-assassination-tapes]]; [[w.mcknight-breach-of-trust]]; [[w.willens-history-will-prove-us]]; [[w.shenon-cruel-and-shocking-act]]. See [[cal.1963-11-22.assassination]]. Names: Warren, Russell, Cooper, Boggs, Ford, Dulles, McCloy.'
    tags: [name:johnson-lyndon-b, name:warren-earl, name:russell-richard-b, name:cooper-john-sherman, name:boggs-hale, name:ford-gerald-r, name:dulles-allen-w, name:mccloy-john-j]
  - id: cal.1963-11-29.space
    when: Nov. 29
    date: '1963-11-29'
    thread: space
    c: E.O. 11129 names the launch facilities at Cape Canaveral, Fla., the John F. Kennedy Space Center. The cape itself renamed Cape Kennedy, Fla., announced Nov. 28.
    n: '[Executive Order 11129—Designating Facilities in Florida as the John F. Kennedy Space Center](https://www.presidency.ucsb.edu/documents/executive-order-11129-designating-facilities-florida-the-john-f-kennedy-space-center) (Nov. 29, 1963); The President''s Thanksgiving Day Address to the Nation, [1963–64 Pub. Papers 11](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=95) (Nov. 28, 1963). To check: [[w.benson-moonport]]. See [[cal.1961-04-12.space]].'
    tags: [name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1963-11-30.europe-and-the-alliance-cyprus
    when: Nov. 30
    date: '1963-11-30'
    thread: cyprus
    c: Cyprus. Makarios hands Kutchuk thirteen amendments to the constitution, "Suggested Measures for Facilitating the Smooth Functioning of the State"; Kutchuk's first reaction "very bad."
    n: '[FRUS 1961–63, XVI, doc. 297](https://history.state.gov/historicaldocuments/frus1961-63v16/d297). See [[cal.1963-10-17.europe-and-the-alliance]]. Names: Makarios III, Kutchuk.'
    tags: [name:makarios-iii, name:kutchuk-fazil]
  - id: cal.1963-11.mayors-houston
    when: Nov.
    date: 1963-11
    thread: mayors
    also: [elections-1963]
    c: Houston. Mayor Cutrer third in the election for mayor, after a rise in water rates; Louie Welch, a former councilman, and a candidate endorsed by the city's liberal coalition to a runoff. Welch wins it; mayor from January 1964. Check the dates and figures.
