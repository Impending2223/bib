    c: 'The budget for fiscal 1965 begun with Johnson the morning after the burial: sessions of one to four hours a day for a month. Rover, the nuclear rocket, cut back. Enriched uranium cut 25 percent; three of Hanford''s nine plutonium reactors, one of Savannah River''s five, closed: "I''m not going to make atom bombs into a WPA project." The MURA accelerator, $170 million, refused; two more secretaries for Heller denied. The total $97.9 billion, about $2 billion off the first figures, most from Defense and the AEC.'
