entries:
  - id: cal.1963-11-01.vietnam
    when: Nov. 1–2
    date: '1963-11-01'
    thread: vietnam
    c: Coup in Saigon. The generals under Dương Văn Minh and Trần Văn Đôn take the city; Conein at their headquarters. Diệm telephones Lodge, 4:30 p.m.; Lodge fears for his safety. Diệm and Nhu leave the palace, are taken at a Cholon church the next morning, and are killed in an armored car.
    n: 'FRUS 1961–63, IV, docs. [234](https://history.state.gov/historicaldocuments/frus1961-63v04/d234), [249](https://history.state.gov/historicaldocuments/frus1961-63v04/d249), [259](https://history.state.gov/historicaldocuments/frus1961-63v04/d259), [273](https://history.state.gov/historicaldocuments/frus1961-63v04/d273). Kennedy, Oval Office recordings on Vietnam (Viet. II.J). [S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf) (1975). [[w.miller-misalliance]], 315–24 (319–24: the coup, the call at 4:30, the flight to Cholon, the church, the armored car; not Conein, nor the killing); [[w.gibbons-u-s-government-and]], II, 200–02; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 290 (the coup; the brothers dead Nov. 2); [[w.schulimson-joint-chiefs-of-staff]], 393 (the coup; the deaths); [[w.marolda-united-states-navy-and]], 273 (the coup, Nov. 1); [[w.futrell-united-states-air-force]], 191 (the coup; Diệm and Nhu''s flight, surrender and killing); [[w.staaveren-u-s-air-force]], 20 (the junta under Minh; Diệm and Nhu killed); [[w.asselin-hanois-road-to-the]], 160 (Diệm and Nhu killed; Minh at the head); [[w.moyar-triumph-forsaken]], 265–73 (267: the coup from 1:45 p.m., Conein at the Joint General Staff; 269: the call at 4:30 and Lodge''s record of it; 270–72: the tunnel, Cholon, the church; 272–73: the killing in the carrier). [[w.reeves-president-kennedy]], 643–49 (the coup; the call; the deaths). To check: [[w.ahern-cia-and-the-house-2000]]; [[w.hammer-death-in-november]]; [[w.prados-jfk-and-the-diem]]; [[w.winters-year-of-the-hare]]; [[w.jones-death-of-a-generation]]; [[w.kaiser-american-tragedy]]; [[w.kahin-intervention]]; [[w.jacobs-cold-war-mandarin]]; [[w.thanh-nhung-ngay-cuoi-cung]]; [[w.dinh-20-nam-binh-nghiep]]; [[w.shaw-lost-mandate-of-heaven-2015]]; [[w.ahern-cia-and-the-generals]]; [[w.don-our-endless-war]]; [[w.don-viet-nam-nhan-chung]]; [[w.mau-viet-nam]]; [[w.tho-nhat-ky-do-tho]]; [[w.dung-lam-the-nao-de]]; [[w.blair-lodge-in-vietnam]]; [[w.nichter-last-brahmin]]; [[w.nolting-from-trust-to-tragedy]]; [[w.colby-lost-victory]]; [[w.gnoinska-poland-and-vietnam-1963]]; [[w.maneli-war-of-the-vanquished]]; [[w.pentagon-papers]] (K–J Adm. II.H.3); Martin and Clever, III, 106-07, 109-10 (cited by [[w.futrell-united-states-air-force]], 191 n.30a); hist, 13th AF, Jul-Dec 63, I, 75 (cited by [[w.futrell-united-states-air-force]], 191 n.30b); msg, PACAF to 5th AF, Aug 27, 1963 (cited by [[w.futrell-united-states-air-force]], 191 n.30c); msg, JCS to CINCPAC, Oct 29, 1963 (cited by [[w.futrell-united-states-air-force]], 191 n.30d); Harkins interview, 31–32 (cited by [[w.schulimson-joint-chiefs-of-staff]], 393 n.164); "Account of the Vietnamese Generals'' Coup of 1–2 November 1963," n.d., box 47, Church Committee Records, RG 46, NARA (cited by [[w.miller-misalliance]], 320 n.2); CIA, OCI No. 3238/63, "Progress of the Coup d''Etat in Saigon," Nov. 1, 1963, POF, Kennedy Library (cited by [[w.gibbons-u-s-government-and]], II, 200 n.176); Senate Comm. on Foreign Relations, *U.S. Involvement in the Overthrow of Diem, 1963*, Staff Study, 92d Cong., 2d Sess. (1972) (cited by [[w.gibbons-u-s-government-and]], II, 201 n.182); CIA Saigon to State, Nov. 1, 1963, NA II, RG 59, Central Files, 1963, box 4048 (cited by [[w.moyar-triumph-forsaken]], 267 n.93); Conein and Richardson, "History of the Vietnamese Generals'' Coup," NA II, RG 46, Church Committee Records, box 47 (cited by [[w.moyar-triumph-forsaken]], 267 n.93); Frederick W. Flott, interview with the author (cited by [[w.moyar-triumph-forsaken]], 269 n.101); Frederick W. Flott, oral history interview I, LBJL (cited by [[w.moyar-triumph-forsaken]], 269 n.101); New York Daily News, Nov. 5, 1963 (cited by [[w.moyar-triumph-forsaken]], 272 n.111); hearing before the Senate Select Committee to Study Governmental Operations with Respect to Intelligence Activities, June 20, 1975, NA II, RG 46, Church Committee Records on the JFK Assassination, box 47 (cited by [[w.moyar-triumph-forsaken]], 272 n.112). See [[cal.1963-05-08.vietnam]]. Names: Dương Văn Minh, Trần Văn Đôn, Ngô Đình Diệm, Ngô Đình Nhu, Conein, Lodge. Check: by Flott''s account, as Moyar, 269, gives it, Lodge offered Diệm a plane to the Philippines; Lodge''s record of the call (doc. 259) has no such offer. Check: Moyar, 271–72, by Dunn''s account, has Diệm call Lodge again from the church the next morning, Lodge offering asylum but no transport. Check: Moyar, 272, has Dương Văn Minh signal the killing.'
