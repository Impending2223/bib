    c: 'Hickory Hill. Hoover tells Robert Kennedy the President has been shot; about half an hour later, from Dallas, he is dead. Johnson calls: by Robert Kennedy''s account, he speaks of a possible worldwide plot and asks whether he should be sworn in at once. Kennedy asks Katzenbach and calls back: anyone can swear him in. Evening, Andrews and Bethesda.'
