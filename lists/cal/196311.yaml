  - id: cal.1963-11-04.vietnam
    when: Nov. 4
    date: '1963-11-04'
    thread: vietnam
    c: 'Kennedy dictates a memoir of the coup, recorded. By Moyar''s transcription: the cable of Aug. 24 "badly drafted," it "should never have been sent on a Saturday," and he should not have consented "without a roundtable conference at which McNamara and Taylor could have presented their views."'
    n: '[John F. Kennedy, Caroline B. Kennedy, John F. Kennedy Jr., and Evelyn M. Lincoln](https://prde.upress.virginia.edu/conversations/4003066), JFK Dictabelt 52.1 (PRDE only; not heard). [[w.moyar-triumph-forsaken]], 240, 461 n.37. To check: Dictation, Nov. 4, 1963, Tape M, JFKL, POF, Presidential Recordings (cited by [[w.moyar-triumph-forsaken]], 240 n.37). See [[cal.1963-08-24.vietnam]]. Names: Kennedy, McNamara, Taylor. Made public: Check.'
