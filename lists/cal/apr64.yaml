# Cal. XLVII April 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLVII
entries:
  - id: cal.1964-04-03.latin-america
    when: Apr. 3
    date: '1964-04-03'
    thread: latin-america
    c: 'Panama. Bunker and Moreno sign a joint declaration at the OAS: relations restored; special ambassadors, in Johnson''s words, to seek "the prompt elimination of the causes of conflict" "without limitations or preconditions of any kind." Robert B. Anderson named for the United States. Johnson telephones Chiari.'
    n: '[Remarks following the Signing of a Joint Declaration With Panama](https://www.presidency.ucsb.edu/documents/remarks-following-the-signing-joint-declaration-with-panama) (Apr. 3, 1964); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1051) (Mar. 21, 1964) (the impasse). FRUS 1964–68, XXXI, docs. [409](https://history.state.gov/historicaldocuments/frus1964-68v31/d409), [410](https://history.state.gov/historicaldocuments/frus1964-68v31/d410). See [[cal.1964-01-09.latin-america]]. Names: Bunker (Viet. III.C).'
    tags: [name:johnson-lyndon-b, name:bunker-ellsworth, name:moreno-miguel-j-jr, name:anderson-robert-b, name:chiari-roberto-f]
  - id: cal.1964-04-03.black-nationalism
    when: Apr. 3–12
    date: '1964-04-03'
    thread: black-nationalism
    also: [voting-rights, civil-rights-bill]
    c: '"The Ballot or the Bullet," Malcolm X at Cory Methodist Church, Cleveland, under CORE''s auspices: register and vote as a bloc; take the case to the United Nations as one of human rights; the ballot or the bullet. Again at Detroit, Apr. 12. Mecca and Africa, Apr. 13–May 21. Check: the church.'
    n: '[The Ballot or the Bullet (Cleveland, Apr. 3, 1964)](https://blackpast.org/african-american-history/1964-malcolm-x-ballot-or-bullet/); [The Ballot or the Bullet (Detroit, Apr. 12, 1964)](https://americanradioworks.publicradio.org/features/blackspeech/mx.html). See [[cal.1963-12-01.black-nationalism]]. Names: Malcolm X (K–J Cong. III.H).'
    tags: [name:malcolm-x]
  - id: cal.1964-04-05.opinion
    when: Apr. 5
    date: '1964-04-05'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Mar. 13–17: Republicans'' choice for 1964: Lodge 42, Nixon 26, Goldwater 14, Rockefeller 6, Scranton 4, Romney 4; others, no preference 4. Independents: Lodge 41, Nixon 20, Goldwater 10, Rockefeller 9.'
    n: '*The Gallup Poll*, III, 1873–74 (K–J Cong. II.E). Names: Nixon (Opp. III.E); Goldwater (Opp. III.B); Lodge (K–J Adm. III.E); Rockefeller, Romney, Scranton (Opp. III.H).'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1964-04-07.elections-1964
    when: Apr. 7
    date: '1964-04-07'
    thread: elections-1964
    c: 'Wisconsin primary. Republican: Byrnes 99.7 percent, unpledged delegates 0.3. Democratic: Reynolds 66.2 percent, Wallace 33.8.'
    n: 'CQ Guide 6th (2010) 406. Carter, *The Politics of Rage* (K–J Cong. II.H). Lesher, *George Wallace* (K–J Cong. II.I.3). See [[cal.1964-03-10.elections-1964]]. Names: Wallace (K–J Cong. III.F); Byrnes (Opp. III.C).'
    tags: [primary:1964-04-07, name:wallace-george-c, name:byrnes-john-w]
  - id: cal.1964-04-08.farm
    when: Apr. 8
    date: '1964-04-08'
    thread: farm
    c: 'House passes the food stamp bill, [229–189](https://voteview.com/rollcall/RH0880149): a permanent program where the States ask for it. Hoeven''s motion to make the States pay half rejected, [195–223](https://voteview.com/rollcall/RH0880148). That evening the House takes the Senate''s wheat-cotton bill, [211–203](https://voteview.com/rollcall/RH0880150); the Senate had passed it Mar. 6, [53–35](https://voteview.com/rollcall/RS0880287).'
    n: '[110 Cong. Rec., House, Apr. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt6/pdf/GPO-CRECB-1964-pt6-2-2.pdf); [110 Cong. Rec., Senate, Mar. 6, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-3-1.pdf). [Statement by the President following House Action on the Wheat-Cotton and Food Stamp Bills](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-action-the-wheat-cotton-and-food-stamp-bills) (Apr. 9, 1964). Cochrane & Ryan, *American Farm Policy, 1948–1973* (K–J Adm. II.B). Hansen, *Gaining Access* (K–J Cong. II.B). *Congress and the Nation*, vol. 1 (K–J Cong. II.L). See [[cal.1963-05-20.program]]. Names: Hoeven (Opp. III.C).'
    tags: [name:hoeven-charles-b]
  - id: cal.1964-04-09.railroads
    when: Apr. 9
    date: '1964-04-09'
    thread: railroads
    c: Rail work rules. The carriers' new rules due at 12:01 a.m. Apr. 10; the five operating brotherhoods' strike called against the Illinois Central. Johnson asks both sides to hold off twenty days; after four hours at the White House with him and Wirtz they agree to fifteen. Talks in the Cabinet Room from Apr. 10.
    n: '[Statement by the President on the Eve of a National Railroad Strike](https://www.presidency.ucsb.edu/documents/statement-the-president-the-eve-national-railroad-strike) (Apr. 9, 1964); [Radio and Television Statement Announcing a Moratorium in the Railroad Labor Dispute](https://www.presidency.ucsb.edu/documents/radio-and-television-statement-announcing-moratorium-the-railroad-labor-dispute) (Apr. 9, 1964); [Remarks at the Opening of Final Negotiations in the Railroad Dispute](https://www.presidency.ucsb.edu/documents/remarks-the-opening-final-negotiations-the-railroad-dispute) (Apr. 10, 1964). Kaufman, *The Railroad Labor Dispute*; Cullen, *National Emergency Strikes* (K–J Adm. II.B). See [[cal.1963-08-27.railroads]]. Names: Wirtz (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:wirtz-w-willard]
  - id: cal.1964-04-10.opinion
    when: Apr. 10
    date: '1964-04-10'
    thread: opinion
    also: [elections-1964, baker]
    c: 'Gallup, special survey of 1,935 Republican county chairmen, the strongest argument against the Democrats: a weak foreign policy, prestige, foreign aid, Cuba, Vietnam, Panama, 1,302; too much spending, 491; the federal government too powerful, 409; the Baker scandal and corruption, 289; integration too fast, 172; personal criticism of Johnson, 104; farm policy, 94.'
    n: '*The Gallup Poll*, III, 1874 (K–J Cong. II.E). Names: Baker (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
    tags: [name:baker-robert-g, name:johnson-lyndon-b]
  - id: cal.1964-04-11.farm
    when: Apr. 11
    date: '1964-04-11'
    thread: farm
    c: 'Agricultural Act of 1964, the wheat-cotton bill, signed, [78 Stat. 173](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg173-2.pdf). Cotton: payments to bring the domestic mills'' price down to the export price, ending two-price cotton. Wheat: a voluntary certificate program for 1964 and 1965, after the growers'' rejection of controls in May 1963.'
    n: '[Remarks Upon Signing the Wheat-Cotton Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-wheat-cotton-bill) (Apr. 11, 1964). See [[cal.1964-04-08.farm]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:freeman-orville-l]
  - id: cal.1964-04-12.opinion
    when: Apr. 12
    date: '1964-04-12'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Mar. 27–Apr. 1, Democrats'' choice for Vice President: Robert Kennedy 47, Stevenson 18, Humphrey 10, Shriver 7, Brown 3, Fulbright 3, Wagner 2; others, no preference 7. Kennedy in the East 55; in the South 38.'
    n: '*The Gallup Poll*, III, 1874–75 (K–J Cong. II.E). Names: Kennedy (K–J Adm. III.A); Stevenson (K–J Adm. III.E); Humphrey (K–J Cong. III.A); Shriver (K–J Adm. III.G); Brown, Wagner (K–J Cong. III.F); Fulbright (K–J Cong. III.B).'
    tags: [name:kennedy-robert-f, name:stevenson-adlai-e, name:humphrey-hubert-h, name:shriver-r-sargent, name:brown-edmund-g, name:fulbright-j-william, name:wagner-robert-f-jr]
  - id: cal.1964-04-14.elections-1964
    when: Apr. 14
    date: '1964-04-14'
    thread: elections-1964
    c: 'Illinois primary. Republican: Goldwater 62.0 percent, Smith 25.3. Democratic: Johnson (write-in) 91.6 percent, Wallace (write-in) 4.2.'
    n: 'CQ Guide 6th (2010) 406. See [[cal.1964-03-10.elections-1964]]. Names: Goldwater (Opp. III.B); Wallace (K–J Cong. III.F); Johnson (K–J Adm. III.D); Smith (Opp. III.A).'
    tags: [primary:1964-04-14, name:wallace-george-c, name:johnson-lyndon-b, name:smith-margaret-chase]
  - id: cal.1964-04-17.mississippi
    when: Apr. 17
    date: '1964-04-17'
    thread: mississippi
    c: Jackson. The second all-white jury in Beckwith's trial for Evers's murder cannot agree; mistrial. Beckwith out on bond. Convicted at a third trial, Feb. 5, 1994.
    n: '*Beckwith v. State*, [707 So. 2d 547](https://static.case.law/so2d/707/html/0547-01.html) (Miss. 1997). Vollers, *Ghosts of Mississippi*; Nossiter, *Of Long Memory* (K–J Cong. II.F). See [[cal.1963-06-12.mississippi]]. Names: Beckwith (K–J Cong. III.K); Evers (K–J Cong. III.H).'
    tags: [name:beckwith-byron-de-la, name:evers-medgar]
  - id: cal.1964-04-18.defense
    when: Apr. 18
    date: '1964-04-18'
    thread: defense
    c: Press conference. A study of the draft and military manpower ordered, on McNamara's plan; among the alternatives, meeting the services' needs "on an entirely voluntary basis in the next decade."
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1050) (Apr. 18, 1964). Flynn, *The Draft, 1940–1973* (K–J Adm. II.D). Names: McNamara (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1964-04-19.laos
    when: Apr. 19
    date: '1964-04-19'
    thread: laos
    c: Laos. Before dawn, Generals Kouprasith and Siho seize Vientiane and hold Souvanna and the neutralists, the day after the three factions' summit fails. Washington backs the Government of National Union; Unger back from Saigon, William Bundy to Vientiane. Apr. 22, the embassy authorized to stop military supplies to the coup's forces. Souvanna kept in office; Check the date.
    n: 'FRUS 1964–68, XXVIII, docs. [22](https://history.state.gov/historicaldocuments/frus1964-68v28/d22), [29](https://history.state.gov/historicaldocuments/frus1964-68v28/d29), [36](https://history.state.gov/historicaldocuments/frus1964-68v28/d36). Dommen, *Conflict in Laos*; Stevenson, *The End of Nowhere* (Viet. II.E.4). See [[cal.1963-04-20.laos]]. Names: Souvanna Phouma (Viet. III.I); Bundy (K–J Adm. III.E).'
    tags: [name:kouprasith-abhay, name:siho-lamphouthacoul, name:souvanna-phouma, name:unger-leonard, name:bundy-william]
  - id: cal.1964-04-20.testing
    when: Apr. 20
    date: '1964-04-20'
    thread: testing
    c: 'Johnson to the Associated Press in New York: a further cut in enriched uranium over four years; with the earlier cuts, plutonium production down 20 percent, enriched uranium 40. Khrushchev the same hour: two plutonium reactors not to be built, U-235 production cut. Douglas-Home consulted.'
    n: '[Remarks on Foreign Affairs at the Associated Press Luncheon in New York City](https://www.presidency.ucsb.edu/documents/remarks-foreign-affairs-the-associated-press-luncheon-new-york-city) (Apr. 20, 1964); [White House Statement following a Review of Implementation of the Limited Test Ban Treaty Safeguards](https://www.presidency.ucsb.edu/documents/white-house-statement-following-review-implementation-the-limited-test-ban-treaty) (Apr. 20, 1964). Glenn T. Seaborg with Benjamin S. Loeb, *Stemming the Tide: Arms Control in the Johnson Years* (1987). See [[cal.1963-10-07.testing]]; [[cal.1964-01-08.program]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:khrushchev-nikita-s, name:douglas-home-alec]
  - id: cal.1964-04-21.elections-1964
    when: Apr. 21
    date: '1964-04-21'
    thread: elections-1964
    c: 'New Jersey primary. Republican: Lodge (write-in) 41.7 percent, Goldwater (write-in) 28.0. Democratic: Johnson (write-in) 82.3 percent, Wallace (write-in) 8.3.'
    n: 'CQ Guide 6th (2010) 406. See [[cal.1964-03-10.elections-1964]]. Names: Wallace (K–J Cong. III.F); Lodge (K–J Adm. III.E); Goldwater (Opp. III.B); Johnson (K–J Adm. III.D).'
    tags: [primary:1964-04-21, name:wallace-george-c, name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1964-04-22.railroads
    when: Apr. 22
    date: '1964-04-22'
    thread: railroads
    c: 'Johnson announces the settlement on television: "4 1/2 years of conflict" ended. Agreement in principle, subject to ratification: the 100-mile unit of a day''s work kept; yard wages raised; paid holidays; allowances for crews laid over away from home. Wirtz presided.'
    n: '[Radio and Television Statement Announcing the Settlement of the Railroad Dispute](https://www.presidency.ucsb.edu/documents/radio-and-television-statement-announcing-the-settlement-the-railroad-dispute) (Apr. 22, 1964). See [[cal.1964-04-09.railroads]]. Names: Wirtz (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:wirtz-w-willard]
  - id: cal.1964-04-24.poverty
    when: Apr. 24
    date: '1964-04-24'
    thread: poverty
    c: 'Johnson in the depressed areas: South Bend, Studebaker''s plant closed; Pittsburgh; Paintsville and Inez, eastern Kentucky; Huntington, West Virginia, with the Appalachian governors. Apr. 28, the Appalachian bill to Congress, with the regional commission''s report: 2,350 miles of development highways, $920 million; water projects; timber, mineral and land programs.'
    n: '[Remarks at the Lulu V. Cline School, South Bend, Indiana](https://www.presidency.ucsb.edu/documents/remarks-the-lulu-v-cline-school-south-bend-indiana); [Remarks at the Johnson County Courthouse, Paintsville, Kentucky](https://www.presidency.ucsb.edu/documents/remarks-the-johnson-county-courthouse-paintsville-kentucky); [Remarks at the Airport, Huntington, West Virginia, Upon Departing for Washington](https://www.presidency.ucsb.edu/documents/remarks-the-airport-huntington-west-virginia-upon-departing-for-washington) (Apr. 24, 1964); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1042) (Apr. 25, 1964); [Letter to the President of the Senate and to the Speaker of the House Transmitting the Bill for the Appalachian Region](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-transmitting-the-bill-for-the) (Apr. 28, 1964). Caudill, *Night Comes to the Cumberlands* (K–J Cong. II.F). Eller, *Uneven Ground* (K–J Adm. II.B). President''s Appalachian Regional Commission, *Appalachia* (1964). See [[cal.1964-03-16.poverty]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-04-28.elections-1964
    when: Apr. 28
    date: '1964-04-28'
    thread: elections-1964
    c: 'Primaries in Massachusetts and Pennsylvania. Republican: Lodge (write-in) in Massachusetts; Scranton (write-in) in Pennsylvania. Democratic: Johnson (write-in) in Massachusetts and Pennsylvania.'
    n: 'CQ Guide 6th (2010) 406. See [[cal.1964-03-10.elections-1964]]. Names: Lodge (K–J Adm. III.E); Johnson (K–J Adm. III.D); Scranton (Opp. III.H).'
    tags: [primary:1964-04-28, name:lodge-henry-cabot, name:johnson-lyndon-b, name:scranton-william-w]
  - id: cal.1964-04-28.specials
    when: Apr. 28
    date: '1964-04-28'
    thread: specials
    c: Pennsylvania 5th, special. William J. Green III (D), 25, holds his father's seat, 58.6 to 41.4 over the Republican; Green died Dec. 21. Swing 2.7 to D.
    n: 'Votes: CQ Guide 6th (2010) 1275. Check: *Pa. Manual*, 1965–66. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1964-04-28-h-PA-5, name:green-william-j, name:green-william-j-jr]
