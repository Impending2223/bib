# Cal. LIII April 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LIII
entries:
  - id: cal.1964-04-01.transportation
    when: Apr. 1
    date: '1964-04-01'
    thread: transportation
    c: 'Executive Order 11149: a President''s Advisory Committee on Supersonic Transport, McNamara chairman, with the Secretaries of the Treasury and Commerce and the heads of NASA and the Federal Aviation Agency, to attend above all to the program''s finances. Its report, May 21.'
    n: '[Exec. Order No. 11,149](https://www.presidency.ucsb.edu/documents/executive-order-11149-establishing-the-presidents-advisory-committee-supersonic-transport) (Apr. 1, 1964); [Statement by the President in Response to a Report on the Supersonic Transport Program](https://www.presidency.ucsb.edu/documents/statement-the-president-response-report-the-supersonic-transport-program) (May 21, 1964); [Statement by the President on the Supersonic Transport Program](https://www.presidency.ucsb.edu/documents/statement-the-president-the-supersonic-transport-program) (Dec. 3, 1964). See [[cal.1963-06-05.transportation]]. Names: McNamara (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1964-04-03.latin-america
    when: Apr. 3
    date: '1964-04-03'
    thread: latin-america
    c: 'Panama. Bunker and Moreno sign a joint declaration at the OAS: relations restored; special ambassadors, in Johnson''s words, to seek "the prompt elimination of the causes of conflict" "without limitations or preconditions of any kind." Robert B. Anderson named for the United States. Johnson telephones Chiari.'
    n: '[Remarks following the Signing of a Joint Declaration With Panama](https://www.presidency.ucsb.edu/documents/remarks-following-the-signing-joint-declaration-with-panama) (Apr. 3, 1964); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1051) (Mar. 21, 1964) (the impasse). FRUS 1964–68, XXXI, docs. [409](https://history.state.gov/historicaldocuments/frus1964-68v31/d409), [410](https://history.state.gov/historicaldocuments/frus1964-68v31/d410). See [[cal.1964-01-09.latin-america]]. Names: Johnson (K–J Adm. III.D); Bunker (Viet. III.C); Chiari, Moreno (K–J Adm. III.J); Anderson (Opp. III.E).'
    tags: [name:johnson-lyndon-b, name:bunker-ellsworth, name:moreno-miguel-j-jr, name:anderson-robert-b, name:chiari-roberto-f]
  - id: cal.1964-04-03.black-nationalism
    when: Apr. 3–12
    date: '1964-04-03'
    thread: black-nationalism
    also: [voting-rights, civil-rights-bill]
    c: '"The Ballot or the Bullet," Malcolm X at Cory Methodist Church, Cleveland, under CORE''s auspices: register and vote as a bloc; take the case to the United Nations as one of human rights; the ballot or the bullet. Again at Detroit, Apr. 12. Mecca and Africa, Apr. 13–May 21. Check: the church.'
    n: '[The Ballot or the Bullet (Cleveland, Apr. 3, 1964)](https://blackpast.org/african-american-history/1964-malcolm-x-ballot-or-bullet/); [The Ballot or the Bullet (Detroit, Apr. 12, 1964)](https://americanradioworks.publicradio.org/features/blackspeech/mx.html). See [[cal.1963-12-01.black-nationalism]]. Names: Malcolm X (K–J Cong. III.H).'
    tags: [name:malcolm-x]
  - id: cal.1964-04-05.opinion
    when: Apr. 5
    date: '1964-04-05'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Mar. 13–17: Republicans'' choice for 1964: Lodge 42, Nixon 26, Goldwater 14, Rockefeller 6, Scranton 4, Romney 4; others, no preference 4. Independents: Lodge 41, Nixon 20, Goldwater 10, Rockefeller 9.'
    n: '[[w.gallup-poll]], III, 1873–74. Names: Nixon (Opp. III.E); Goldwater (Opp. III.B); Lodge (K–J Adm. III.E); Rockefeller, Romney, Scranton (Opp. III.H).'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1964-04-06.mississippi
    when: Apr. 6
    date: '1964-04-06'
    thread: mississippi
    also: [court]
    c: '*United States v. Barnett*, [376 U.S. 681](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376681/usrep376681.pdf). Barnett and Paul Johnson, charged with criminal contempt of the Fifth Circuit''s orders for Meredith''s admission, Sept. 1962, have no right to a jury, 5–4. Clark for the Court; a note: some members think punishment without a jury limited to that for petty offenses. Black, Douglas, Goldberg and Warren dissent.'
    n: '*United States v. Barnett* (K–J Adm. II.H.1). [[w.doyle-american-insurrection]]. See [[cal.1962-09-20.mississippi]]. Names: Barnett, Johnson (K–J Cong. III.F); Meredith (K–J Cong. III.H); Clark, Black, Douglas, Goldberg, Warren (K–J Cong. III.G).'
    tags: [name:barnett-ross-r, name:johnson-paul-b-jr, name:meredith-james-h, name:clark-tom-c, name:black-hugo-l, name:douglas-william-o, name:goldberg-arthur-j, name:warren-earl]
  - id: cal.1964-04-07.elections-1964
    when: Apr. 7
    date: '1964-04-07'
    thread: elections-1964
    c: 'Wisconsin primary. Republican: Byrnes 99.7 percent, unpledged delegates 0.3. Democratic: Reynolds 66.2 percent, Wallace 33.8.'
    n: 'CQ Guide 6th (2010) 406. [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. See [[cal.1964-03-10.elections-1964]]. Names: Wallace, John Reynolds (K–J Cong. III.F); Byrnes (Opp. III.C).'
    tags: [primary:1964-04-07, name:wallace-george-c, name:byrnes-john-w, name:reynolds-john-w-jr]
  - id: cal.1964-04-07.desegregation-schools-cleveland
    when: Apr. 7–20
    date: '1964-04-07'
    thread: desegregation-schools
    also: [civil-rights-organizations]
    c: 'Cleveland. The Reverend Bruce Klunder, of the United Freedom Movement and CORE, crushed by a backing bulldozer at the site of a new school on Lakeview Road, Glenville, protested as built to keep Negro pupils apart. A boycott of the schools, Apr. 20: some 60,000 Negro pupils out (Check the date and figure). Locher stands with the school board.'
    n: '[Wikipedia, "Bruce W. Klunder"](https://en.wikipedia.org/wiki/Bruce_W._Klunder); [Encyclopedia of Cleveland History, "Mayoral Administration of Ralph S. Locher"](https://case.edu/ech/articles/m/mayoral-administration-ralph-s-locher). [[w.frazier-harambee-city]]; [[w.moore-carl-b-stokes-and]]. See [[cal.1964-01-30.desegregation-schools-cleveland]]. Names: Klunder (K–J Cong. III.K); Locher (K–J Cong. III.K).'
    tags: [state:oh, city:cleveland, name:klunder-bruce-w, name:locher-ralph-s]
  - id: cal.1964-04-07.mayors-milwaukee
    when: Apr. 7
    date: '1964-04-07'
    thread: mayors
    also: [elections-1964]
    c: Milwaukee re-elects Maier mayor, a second term.
    n: '[Wikipedia, "Henry Maier"](https://en.wikipedia.org/wiki/Henry_Maier) (Check: the opponent and the vote, from the city''s canvass). See [[cal.1960-04-05.mayors-milwaukee]]. Names: Maier (K–J Cong. III.F).'
    tags: [state:wi, city:milwaukee, name:maier-henry-w]
  - id: cal.1964-04-07.state-constitutions-kansas-city
    when: Apr. 7
    date: '1964-04-07'
    thread: state-constitutions
    also: [desegregation-public-places]
    c: 'Kansas City, Mo., at a referendum, keeps its public accommodations ordinance, No. 29153, Councilman Watkins''s, passed Sept. 13, 1963: no discrimination by race in any public business. Carried by about 1,700 votes.'
    n: 'Pendergast KC, ["Theron B. and Bruce Watkins"](https://pendergastkc.org/articles/theron-b-and-bruce-watkins) (gives Apr. 8); [Wikipedia, "Bruce R. Watkins"](https://en.wikipedia.org/wiki/Bruce_R._Watkins) (gives Apr. 18) (Check: the day and the vote, from the Board of Election Commissioners). [[w.peirce-great-plains-states-of]]. Names: Watkins (K–J Cong. III.K).'
    tags: [state:mo, city:kansas-city, name:watkins-bruce-r]
  - id: cal.1964-04-08.farm
    when: Apr. 8
    date: '1964-04-08'
    thread: farm
    c: 'House passes the food stamp bill, [229–189](https://voteview.com/rollcall/RH0880149): a permanent program where the States ask for it. Hoeven''s motion to make the States pay half rejected, [195–223](https://voteview.com/rollcall/RH0880148). That evening the House takes the Senate''s wheat-cotton bill, [211–203](https://voteview.com/rollcall/RH0880150); the Senate had passed it Mar. 6, [53–35](https://voteview.com/rollcall/RS0880287).'
    n: '[110 Cong. Rec., House, Apr. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt6/pdf/GPO-CRECB-1964-pt6-2-2.pdf); [110 Cong. Rec., Senate, Mar. 6, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-3-1.pdf). [Statement by the President following House Action on the Wheat-Cotton and Food Stamp Bills](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-action-the-wheat-cotton-and-food-stamp-bills) (Apr. 9, 1964). [[w.cochrane-american-farm-policy-1948]]; [[w.hansen-gaining-access]]; [[w.congress-and-the-nation]]. See [[cal.1963-05-20.program]]. Names: Hoeven (Opp. III.C).'
    tags: [name:hoeven-charles-b]
  - id: cal.1964-04-09.railroads
    when: Apr. 9
    date: '1964-04-09'
    thread: railroads
    c: Rail work rules. The carriers' new rules due at 12:01 a.m. Apr. 10; the five operating brotherhoods' strike called against the Illinois Central. Johnson asks both sides to hold off twenty days; after four hours at the White House with him and Wirtz they agree to fifteen. Talks in the Cabinet Room from Apr. 10.
    n: '[Statement by the President on the Eve of a National Railroad Strike](https://www.presidency.ucsb.edu/documents/statement-the-president-the-eve-national-railroad-strike) (Apr. 9, 1964); [Radio and Television Statement Announcing a Moratorium in the Railroad Labor Dispute](https://www.presidency.ucsb.edu/documents/radio-and-television-statement-announcing-moratorium-the-railroad-labor-dispute) (Apr. 9, 1964); [Remarks at the Opening of Final Negotiations in the Railroad Dispute](https://www.presidency.ucsb.edu/documents/remarks-the-opening-final-negotiations-the-railroad-dispute) (Apr. 10, 1964). [[w.kaufman-railroad-labor-dispute]]; [[w.cullen-national-emergency-strikes]]. See [[cal.1963-08-27.railroads]]. Names: Johnson (K–J Adm. III.D); Wirtz (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:wirtz-w-willard]
  - id: cal.1964-04-10.opinion
    when: Apr. 10
    date: '1964-04-10'
    thread: opinion
    also: [elections-1964-polls, baker]
    c: 'Gallup, special survey of 1,935 Republican county chairmen, the strongest argument against the Democrats: a weak foreign policy, prestige, foreign aid, Cuba, Vietnam, Panama, 1,302; too much spending, 491; the federal government too powerful, 409; the Baker scandal and corruption, 289; integration too fast, 172; personal criticism of Johnson, 104; farm policy, 94.'
    n: '[[w.gallup-poll]], III, 1874. Names: Robert Baker (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
    tags: [name:baker-robert-g, name:johnson-lyndon-b]
  - id: cal.1964-04-11.farm
    when: Apr. 11
    date: '1964-04-11'
    thread: farm
    c: 'Agricultural Act of 1964, the wheat-cotton bill, signed, [78 Stat. 173](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg173-2.pdf). Cotton: payments to bring the domestic mills'' price down to the export price, ending two-price cotton. Wheat: a voluntary certificate program for 1964 and 1965, after the growers'' rejection of controls in May 1963.'
    n: '[Remarks Upon Signing the Wheat-Cotton Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-wheat-cotton-bill) (Apr. 11, 1964). See [[cal.1964-04-08.farm]]. Names: Johnson (K–J Adm. III.D); Freeman (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:freeman-orville-l]
  - id: cal.1964-04-12.opinion
    when: Apr. 12
    date: '1964-04-12'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Mar. 27–Apr. 1, Democrats'' choice for Vice President: Robert Kennedy 47, Stevenson 18, Humphrey 10, Shriver 7, Brown 3, Fulbright 3, Wagner 2; others, no preference 7. Kennedy in the East 55; in the South 38.'
    n: '[[w.gallup-poll]], III, 1874–75. Names: Robert Kennedy (K–J Adm. III.A); Stevenson (K–J Adm. III.E); Humphrey (K–J Cong. III.A); Shriver (K–J Adm. III.G); Brown, Wagner (K–J Cong. III.F); Fulbright (K–J Cong. III.B).'
    tags: [name:kennedy-robert-f, name:stevenson-adlai-e, name:humphrey-hubert-h, name:shriver-r-sargent, name:brown-edmund-g, name:fulbright-j-william, name:wagner-robert-f-jr]
  - id: cal.1964-04-14.elections-1964
    when: Apr. 14
    date: '1964-04-14'
    thread: elections-1964
    also: [goldwater]
    c: 'Illinois primary. Republican: Goldwater 62.0 percent, Smith 25.3. Democratic: Johnson (write-in) 91.6 percent, Wallace (write-in) 4.2.'
    n: 'CQ Guide 6th (2010) 406. See [[cal.1964-03-10.elections-1964]]. Names: Goldwater (Opp. III.B); Wallace (K–J Cong. III.F); Johnson (K–J Adm. III.D); Smith (Opp. III.A).'
    tags: [primary:1964-04-14, name:wallace-george-c, name:johnson-lyndon-b, name:smith-margaret-chase, name:goldwater-barry-m]
  - id: cal.1964-04-14.governors-il
    when: Apr. 14
    date: '1964-04-14'
    thread: governors
    also: [elections-1964]
    c: Illinois, Republican primary for governor. Percy, president of Bell & Howell, 626,111, 60.3 percent; William J. Scott, State treasurer, 388,903, 37.4. Kerner renominated unopposed.
    n: 'Votes: [Ill. *Official Vote*, 1964, p. 171](https://archive.org/details/officialvoteof1964illi/page/n176). [[w.barnhart-kerner]]; [[w.peirce-megastates-of-america]]. See [[cal.1964-04-14.elections-1964]]. Names: Percy (Opp. III.B); Scott, Kerner (K–J Cong. III.F).'
    tags: [state:il, name:percy-charles-h, name:scott-william-j, name:kerner-otto]
  - id: cal.1964-04-17.mississippi
    when: Apr. 17
    date: '1964-04-17'
    thread: mississippi
    c: Jackson. The second all-white jury in Beckwith's trial for Evers's murder cannot agree; mistrial. Beckwith out on bond. Convicted at a third trial, Feb. 5, 1994.
    n: '*Beckwith v. State*, [707 So. 2d 547](https://static.case.law/so2d/707/html/0547-01.html) (Miss. 1997). [[w.vollers-ghosts-of-mississippi]]; [[w.nossiter-of-long-memory]]. See [[cal.1963-06-12.mississippi]]. Names: Beckwith (K–J Cong. III.K); Evers (K–J Cong. III.H).'
    tags: [name:beckwith-byron-de-la, name:evers-medgar]
  - id: cal.1964-04-18.defense
    when: Apr. 18
    date: '1964-04-18'
    thread: defense
    c: Press conference. A study of the draft and military manpower ordered, on McNamara's plan; among the alternatives, meeting the services' needs "on an entirely voluntary basis in the next decade."
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1050) (Apr. 18, 1964). [[w.flynn-draft-1940-1973]]. Names: Johnson (K–J Adm. III.D); McNamara (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1964-04-19.laos
    when: Apr. 19
    date: '1964-04-19'
    thread: laos
    c: Laos. Before dawn, Generals Kouprasith and Siho seize Vientiane and hold Souvanna and the neutralists, the day after the three factions' summit fails. Washington backs the Government of National Union; Unger back from Saigon, William Bundy to Vientiane. Apr. 22, the embassy authorized to stop military supplies to the coup's forces. Souvanna kept in office; Check the date.
    n: 'FRUS 1964–68, XXVIII, docs. [22](https://history.state.gov/historicaldocuments/frus1964-68v28/d22), [29](https://history.state.gov/historicaldocuments/frus1964-68v28/d29), [36](https://history.state.gov/historicaldocuments/frus1964-68v28/d36). [[w.dommen-conflict-in-laos]]; [[w.stevenson-end-of-nowhere]]. See [[cal.1963-04-20.laos]]. Names: Kouprasith, Siho Lamphouthacoul, Souvanna Phouma (Viet. III.I); Unger, William Bundy (K–J Adm. III.E).'
    tags: [name:kouprasith-abhay, name:siho-lamphouthacoul, name:souvanna-phouma, name:unger-leonard, name:bundy-william]
  - id: cal.1964-04-20.testing
    when: Apr. 20
    date: '1964-04-20'
    thread: testing
    c: 'Johnson to the Associated Press in New York: a further cut in enriched uranium over four years; with the earlier cuts, plutonium production down 20 percent, enriched uranium 40. Khrushchev the same hour: two plutonium reactors not to be built, U-235 production cut. Douglas-Home consulted.'
    n: '[Remarks on Foreign Affairs at the Associated Press Luncheon in New York City](https://www.presidency.ucsb.edu/documents/remarks-foreign-affairs-the-associated-press-luncheon-new-york-city) (Apr. 20, 1964); [White House Statement following a Review of Implementation of the Limited Test Ban Treaty Safeguards](https://www.presidency.ucsb.edu/documents/white-house-statement-following-review-implementation-the-limited-test-ban-treaty) (Apr. 20, 1964). [[w.seaborg-stemming-the-tide]]. See [[cal.1963-10-07.testing]]; [[cal.1964-01-08.program]]. Names: Johnson (K–J Adm. III.D); Khrushchev, Douglas-Home (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:khrushchev-nikita-s, name:douglas-home-alec]
  - id: cal.1964-04-21.elections-1964
    when: Apr. 21
    date: '1964-04-21'
    thread: elections-1964
    c: 'New Jersey primary. Republican: Lodge (write-in) 41.7 percent, Goldwater (write-in) 28.0. Democratic: Johnson (write-in) 82.3 percent, Wallace (write-in) 8.3.'
    n: 'CQ Guide 6th (2010) 406. See [[cal.1964-03-10.elections-1964]]. Names: Wallace (K–J Cong. III.F); Lodge (K–J Adm. III.E); Goldwater (Opp. III.B); Johnson (K–J Adm. III.D).'
    tags: [primary:1964-04-21, name:wallace-george-c, name:lodge-henry-cabot, name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-04-22.railroads
    when: Apr. 22
    date: '1964-04-22'
    thread: railroads
    c: 'Johnson announces the settlement on television: "4 1/2 years of conflict" ended. Agreement in principle, subject to ratification: the 100-mile unit of a day''s work kept; yard wages raised; paid holidays; allowances for crews laid over away from home. Wirtz presided.'
    n: '[Radio and Television Statement Announcing the Settlement of the Railroad Dispute](https://www.presidency.ucsb.edu/documents/radio-and-television-statement-announcing-the-settlement-the-railroad-dispute) (Apr. 22, 1964). See [[cal.1964-04-09.railroads]]. Names: Johnson (K–J Adm. III.D); Wirtz (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:wirtz-w-willard]
  - id: cal.1964-04-22.civil-rights-organizations-nyc
    when: Apr. 22
    date: '1964-04-22'
    thread: civil-rights-organizations
    also: [states-and-cities]
    c: Queens. The New York World's Fair opens; Johnson speaks at the opening, hecklers in the crowd (Check). Brooklyn CORE's "stall-in" on the highways to the fair, disowned by CORE's national office, stops few cars; Farmer and other demonstrators arrested at the pavilions (Check).
    n: '[Remarks at the Opening of the New York World''s Fair](https://www.presidency.ucsb.edu/documents/remarks-the-opening-the-new-york-worlds-fair) (Apr. 22, 1964). [[w.purnell-fighting-jim-crow-in]]; [[w.biondi-to-stand-and-fight]]. Names: Johnson (K–J Adm. III.D); Farmer (K–J Cong. III.H).'
    tags: [state:ny, city:nyc, name:johnson-lyndon-b, name:farmer-james]
  - id: cal.1964-04-24.poverty
    when: Apr. 24
    date: '1964-04-24'
    thread: poverty
    c: 'Johnson in the depressed areas: South Bend, Studebaker''s plant closed; Pittsburgh; Paintsville and Inez, Ky.; Huntington, W. Va., with the Appalachian governors. Apr. 28, the Appalachian bill to Congress, with the regional commission''s report: 2,350 miles of development highways, $920 million; water projects; timber, mineral and land programs.'
    n: '[Remarks at the Lulu V. Cline School, South Bend, Indiana](https://www.presidency.ucsb.edu/documents/remarks-the-lulu-v-cline-school-south-bend-indiana); [Remarks at the Johnson County Courthouse, Paintsville, Kentucky](https://www.presidency.ucsb.edu/documents/remarks-the-johnson-county-courthouse-paintsville-kentucky); [Remarks at the Airport, Huntington, West Virginia, Upon Departing for Washington](https://www.presidency.ucsb.edu/documents/remarks-the-airport-huntington-west-virginia-upon-departing-for-washington) (Apr. 24, 1964); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1042) (Apr. 25, 1964); [Letter to the President of the Senate and to the Speaker of the House Transmitting the Bill for the Appalachian Region](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-transmitting-the-bill-for-the) (Apr. 28, 1964). [[w.caudill-night-comes-to-the]]; [[w.eller-uneven-ground]]; [[w.commission-appalachia]]. See [[cal.1964-03-16.poverty]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-04-24.legislatures-ks
    when: Apr. 24
    date: '1964-04-24'
    thread: legislatures
    c: Kansas. A three-judge federal court holds the congressional districting of 1961 unconstitutional, but stays its decree until after the 1964 elections.
    n: '*Meeks v. Anderson*, [229 F. Supp. 271](https://static.case.law/f-supp/229/html/0271-01.html) (D. Kan. 1964). See [[cal.1964-02-17.court]].'
    tags: [state:ks]
  - id: cal.1964-04-24.africa
    when: Apr. 24
    date: '1964-04-24'
    thread: africa
    also: [space]
    c: 'NSAM 295, on South Africa: its carrying out of the Odendaal report in South West Africa to be delayed, if possible until the World Court decides; existing policy on military sales continued, submarines deferred; the lending agencies to suspend loans and guarantees, quietly; NASA and Defense to plan stand-by sites should the tracking stations in South Africa have to be given up on six months'' notice.'
    n: 'FRUS 1964–68, XXIV, doc. [586](https://history.state.gov/historicaldocuments/frus1964-68v24/d586) (NSAM 295). [[w.noer-cold-war-and-black]]; [[w.irwin-gordian-knot]]. Made public: FRUS 1964–68, XXIV (1999). See [[cal.1963-12-04.africa]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-04-26.civil-rights-organizations
    when: Apr. 26
    date: '1964-04-26'
    thread: civil-rights-organizations
    also: [mississippi]
    c: Jackson. A COFO meeting founds the Mississippi Freedom Democratic Party, open to all, and elects a temporary State Executive Committee. Its precinct and county meetings to follow the regular party's rules; its delegates to contest the regulars' seats at Atlantic City.
    n: SNCC Digital Gateway, [Mississippi Freedom Democratic Party (MFDP) founded](https://snccdigital.org/events/mfdp-founded/) (K–J Cong. II.L). King Institute, [Mississippi Freedom Democratic Party (MFDP)](https://kinginstitute.stanford.edu/mississippi-freedom-democratic-party-mfdp). [[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]; [[w.mcadam-freedom-summer]]; [[w.carson-in-struggle]]; [[w.mills-this-little-light-of]]. See [[cal.1962-02.civil-rights-organizations]].
  - id: cal.1964-04-26.africa
    when: Apr. 26
    date: '1964-04-26'
