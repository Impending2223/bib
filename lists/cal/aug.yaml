# Cal. X August 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: X
entries:
  - id: cal.1961-08.mississippi
    when: Aug.
    date: 1961-08
    thread: mississippi
    c: Bob Moses opens SNCC's voter registration school in McComb; registration attempts in Amite and Walthall Counties. Moses beaten at Liberty.
    n: 'Dittmer, *Local People*; Payne, *I''ve Got the Light of Freedom*; Carson, *In Struggle* (K–J Cong. II.F). Burner, *And Gently He Shall Lead Them* (K–J Cong. II.I.4). Branch, *Parting the Waters* (K–J Adm. II.C). SNCC Digital Gateway (K–J Cong. II.L). Names: Moses, Hayden (K–J Cong. III.H).'
    tags: [name:moses-robert-p]
  - id: cal.1961-08-01.berlin-and-vienna
    when: Aug. 1
    date: '1961-08-01'
    thread: berlin-and-vienna
    c: Congress authorizes the call-up of up to 250,000 reservists for a year, [75 Stat. 242](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg242-3.pdf).
    n: 'CQ Almanac 1961.'
  - id: cal.1961-08-02.right-and-the-military
    when: Aug. 2
    date: '1961-08-02'
    thread: right-and-the-military
    c: Fulbright's memorandum to McNamara on military officers propagandizing for the radical right, written in June, is placed in the record. Thurmond demands an inquiry.
    n: '[Cong. Rec., Senate, Aug. 2, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-3-2.pdf). *Military Cold War Education and Speech Review Policies* (K–J Cong. II.J.3), which came of it. Woods, *Fulbright*; Crespino, *Strom Thurmond''s America* (Opp. II.F).'
    tags: [name:fulbright-j-william, name:mcnamara-robert-s, name:thurmond-strom]
  - id: cal.1961-08-03.crime-and-hijacking
    when: Aug. 3
    date: '1961-08-03'
    thread: crime-and-hijacking
    c: A Continental Air Lines 707 seized at El Paso; Kennedy follows from the White House; the FBI and Border Patrol shoot out the tires.
    n: '[Telegrams of Commendation Following the Capture of High-Jackers of a Jet Airliner in El Paso, Texas](https://www.presidency.ucsb.edu/documents/telegrams-commendation-following-the-capture-high-jackers-jet-airliner-el-paso-texas) (Aug. 4, 1961). [FRUS 1961–63, X, doc. 252](https://history.state.gov/historicaldocuments/frus1961-63v10/d252). See [[cal.1961-05-01.crime-and-hijacking]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-08-05.latin-america
    when: Aug. 5–17
    date: '1961-08-05'
    thread: latin-america
    c: Punta del Este. Dillon pledges $20 billion over ten years; the Charter signed Aug. 17. Che Guevara present. Goodwin and Guevara talk that night.
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). Goodwin, *Remembering America* (K–J Adm. II.G.2). Taffet (see [[cal.1961-03-13.latin-america]]). Names: Dillon (K–J Adm. III.H); Goodwin (K–J Adm. III.B).'
    tags: [name:goodwin-richard-n, name:dillon-c-douglas, name:guevara-ernesto]
  - id: cal.1961-08-06.space
    when: Aug. 6
    date: '1961-08-06'
    thread: space
    c: Titov orbits for a day.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-205) (Aug. 10, 1961). See [[cal.1961-04-12.space]].'
    tags: [name:titov-gherman]
  - id: cal.1961-08-09.confirmations
    when: Aug. 9
    date: '1961-08-09'
    thread: confirmations
    c: Lawrence J. O'Connor Jr. confirmed to the Federal Power Commission, [83–12](https://voteview.com/rollcall/RS0870127).
    n: '[107 Cong. Rec., Senate, Aug. 9, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-8-1.pdf). See [[cal.1961-06-13.confirmations]].'
    tags: ['name:oconnor-lawrence-j-jr']
  - id: cal.1961-08-13.berlin-and-vienna
    when: Aug. 13
    date: '1961-08-13'
    thread: berlin-and-vienna
    c: East Germany seals the sector border overnight. Kennedy at Hyannis Port. The response is a protest.
    n: 'FRUS 1961–63, XIV, docs. [104](https://history.state.gov/historicaldocuments/frus1961-63v14/d104), [105](https://history.state.gov/historicaldocuments/frus1961-63v14/d105). See [[cal.1961-06-03.berlin-and-vienna]]. Harrison; Wilke; Kempe (K–J Adm. II.D). Brandt, *Begegnungen und Einsichten* (K–J Adm. II.G.7). Names: Brandt (K–J Adm. III.J).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-08-16.berlin-and-vienna
    when: Aug. 16
    date: '1961-08-16'
    thread: berlin-and-vienna
    c: Brandt's letter to Kennedy; three hundred thousand at the city hall rally.
    n: '[FRUS 1961–63, XIV, doc. 117](https://history.state.gov/historicaldocuments/frus1961-63v14/d117). See [[cal.1961-08-13.berlin-and-vienna]].'
    tags: [name:brandt-willy, name:kennedy-john-f]
  - id: cal.1961-08-19.berlin-and-vienna
    when: Aug. 19–20
    date: '1961-08-19'
    thread: berlin-and-vienna
    c: Johnson and Clay in Berlin. A battle group of the 18th Infantry drives up the autobahn and is received by Johnson.
    n: 'FRUS 1961–63, XIV, docs. [120](https://history.state.gov/historicaldocuments/frus1961-63v14/d120), [121](https://history.state.gov/historicaldocuments/frus1961-63v14/d121). [Remarks Following the Vice President''s Report on the Berlin Situation](https://www.presidency.ucsb.edu/documents/remarks-following-the-vice-presidents-report-the-berlin-situation) (Aug. 21, 1961). Caro, *Passage of Power* (K–J Adm. II.A). Kempe (K–J Adm. II.D). Jean Edward Smith, *Lucius D. Clay: An American Life* (1990).'
    tags: [name:johnson-lyndon-b, name:clay-lucius-d]
  - id: cal.1961-08-24.confirmations
    when: Aug. 24
    date: '1961-08-24'
    thread: confirmations
    also: [defense]
    c: Maj. Gene Hal Williams to brigadier general, Army National Guard of the United States. Seven of Armed Services against, Smith of Maine and Thurmond among them. Smith's motion to recommit fails, [37–46](https://voteview.com/rollcall/RS0870157); confirmed, [45–37](https://voteview.com/rollcall/RS0870158). Check who he was.
    n: '[107 Cong. Rec., Senate, Aug. 24, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt13/pdf/GPO-CRECB-1961-pt13-1-2.pdf); [Executive Calendar, Aug. 14, 1961](https://www.senate.gov/legislative/LIS/executive_calendar/1961/08_14_1961.pdf). See [[cal.1961-03-07.confirmations]]. Names: Smith (Opp. III.A); Thurmond (K–J Cong. III.B).'
    tags: [name:smith-margaret-chase, name:thurmond-strom]
  - id: cal.1961-08-25.latin-america
    when: Aug. 25
    date: '1961-08-25'
    thread: latin-america
    c: Quadros resigns in Brazil. Goulart succeeds under a parliamentary compromise.
    n: 'Thomas E. Skidmore, *Politics in Brazil, 1930–1964: An Experiment in Democracy* (1967). Phyllis R. Parker, *Brazil and the Quiet Intervention, 1964* (1979). [FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12).'
    tags: [name:quadros-janio, name:goulart-joao]
  - id: cal.1961-08-28.congo
    when: Aug. 28
    date: '1961-08-28'
    thread: congo
    c: UN forces' Operation Rumpunch against Katanga's mercenaries.
    n: 'FRUS 1961–63, XX, docs. [100](https://history.state.gov/historicaldocuments/frus1961-63v20/d100), [101](https://history.state.gov/historicaldocuments/frus1961-63v20/d101). See [[cal.1961-02-13.congo]].'
  - id: cal.1961-08-30.states-and-cities
    when: Aug. 30
    date: '1961-08-30'
    thread: states-and-cities
    also: [testing]
    c: Atlanta desegregates four high schools with nine Black students, peacefully. Kennedy praises the city at that day's press conference.
    n: 'Kruse, *White Flight* (K–J Cong. II.H). [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-209) (Aug. 30, 1961). Names: Hartsfield (K–J Cong. III.F).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-08-30.school-aid
    when: Aug. 30
    date: '1961-08-30'
    thread: school-aid
    c: The scaled-down school bill called up under Calendar Wednesday. The House refuses to consider it, [170–242](https://voteview.com/rollcall/RH0870084). Dead for the Congress.
    n: See [[cal.1961-02-20.school-aid]].
  - id: cal.1961-08-30.peace-corps
    when: Aug. 30
    date: '1961-08-30'
    thread: peace-corps
    c: The first volunteers arrive in Ghana.
    n: '[Remarks to a Group of Peace Corps Volunteers Before Their Departure for Tanganyika and Ghana](https://www.presidency.ucsb.edu/documents/remarks-group-peace-corps-volunteers-before-their-departure-for-tanganyika-and-ghana) (Aug. 28, 1961). See [[cal.1961-03-01.peace-corps]].'
  - id: cal.1961-08-30.berlin-and-vienna
    when: Aug. 30
    date: '1961-08-30'
    thread: berlin-and-vienna
    c: Clay named the President's personal representative in Berlin. The Soviet Union announces it will resume nuclear testing.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-209) (Aug. 30, 1961). [White House Statement on Soviet Resumption of Nuclear Weapons Tests](https://www.presidency.ucsb.edu/documents/white-house-statement-soviet-resumption-nuclear-weapons-tests). [FRUS 1961–63, VII, doc. 58](https://history.state.gov/historicaldocuments/frus1961-63v07/d58). The first test: [[cal.1961-09-01.testing]]. See [[cal.1961-08-19.berlin-and-vienna]].'
    tags: [name:kennedy-john-f, name:clay-lucius-d]
  - id: cal.1961-08-31.rules
    when: Aug. 31
    date: '1961-08-31'
    thread: rules
    c: Rayburn leaves Washington for Bonham, ill. He does not return. McCormack presides. Check the date.
    n: Hardeman & Bacon, *Rayburn* (K–J Cong. II.I.2).
    tags: [name:rayburn-sam, name:mccormack-john-w]
  - id: cal.1961-08.opinion
    when: Aug.
    date: 1961-08
    thread: opinion
    c: 'Approval about three-quarters through the Berlin summer: 75 percent (July 27–Aug. 2), 76 (Aug. 24–29).'
    n: See [[cal.1961-02-10.opinion]].
    tags: [name:kennedy-john-f]
