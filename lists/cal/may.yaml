# Cal. VII May 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: VII
entries:
  - id: cal.1961-05-01.program
    when: May 1
    date: '1961-05-01'
    thread: program
    c: Area Redevelopment Act signed. Douglas's bill, twice vetoed by Eisenhower.
    n: 'Pub. L. No. 87-27 (K–J Cong. II.J.2). Levitan, *Federal Aid to Depressed Areas* (K–J Cong. II.B). Douglas, *In the Fullness of Time* (K–J Cong. II.I.1). Names: Douglas (K–J Cong. III.B).'
  - id: cal.1961-05-01.crime-and-hijacking
    when: May 1
    date: '1961-05-01'
    thread: crime-and-hijacking
    c: First U.S. airliner hijacked to Cuba, a National Airlines flight bound for Key West.
    n: No book of its own. CQ Almanac 1961 for the statute ([[cal.1961-09-05.crime-and-hijacking]]).
  - id: cal.1961-05-01.court
    when: May 1
    date: '1961-05-01'
    thread: court
    c: '*Baker v. Carr* restored to the calendar for reargument.'
    n: See [[cal.1961-04-19.court]]. Reargued [[cal.1961-10-09.court]].
  - id: cal.1961-05-03.laos
    when: May 3
    date: '1961-05-03'
    thread: laos
    c: Cease-fire in Laos.
    n: See [[cal.1961-03-23.laos]].
  - id: cal.1961-05-04.freedom-rides
    when: May 4
    date: '1961-05-04'
    thread: freedom-rides
    c: Thirteen CORE riders leave Washington on two buses to test *Boynton v. Virginia* (1960).
    n: 'Arsenault, *Freedom Riders*; Branch, *Parting the Waters*; Navasky, *Kennedy Justice* (K–J Adm. II.C, II.E). Farmer, *Lay Bare the Heart*; Lewis, *Walking with the Wind* (K–J Cong. II.I.4). *Robert Kennedy in His Own Words* (K–J Adm. II.G.1). Wofford, *Of Kennedys and Kings* (K–J Adm. II.G.2). Guthman, *We Band of Brothers* (K–J Adm. II.G.6). Film: *Freedom Riders* (K–J Cong. I.B). Names: Farmer, Lewis, Nash (K–J Cong. III.H); Seigenthaler, Marshall, White (K–J Adm. III.I).'
  - id: cal.1961-05-05.space
    when: May 5
    date: '1961-05-05'
    thread: space
    also: [program]
    c: 'Shepard''s suborbital flight. Same day: minimum wage amendments signed, $1.25 by 1963, coverage for about 3.6 million more workers.'
    n: Pub. L. No. 87-30 (K–J Cong. II.J.2). See [[cal.1961-03-24.program]].
  - id: cal.1961-05-09.press-and-broadcasting
    when: May 9
    date: '1961-05-09'
    thread: press-and-broadcasting
    c: Minow tells the broadcasters their schedules are "a vast wasteland."
    n: 'Minow, *Equal Time* (K–J Adm. II.G.5). Watson, *Expanding Vista* (see [[cal.1961-01-25.press-and-broadcasting]]). Recording (K–J Adm. II.I). Names: Minow (K–J Adm. III.G); Collins (K–J Cong. III.F), the broadcasters'' new president.'
  - id: cal.1961-05-09.berlin-and-vienna
    when: May 9
    date: '1961-05-09'
    thread: berlin-and-vienna
    c: Robert Kennedy's first meeting with Georgi Bolshakov. The back channel to Khrushchev opens.
    n: 'Fursenko & Naftali, *"One Hell of a Gamble"* (K–J Adm. II.D). Names: Bolshakov (K–J Adm. III.J).'
  - id: cal.1961-05-09.vietnam
    when: May 9–15
    date: '1961-05-09'
    thread: vietnam
    c: Johnson's trip to Saigon, Manila, Taipei, Bangkok, New Delhi, Karachi. In Saigon he calls Diem the Churchill of Asia. His report of May 23 urges a decision to stand.
    n: Letter from Johnson to Kennedy (K–J Adm. II.H.3), FRUS vol. 1. Caro, *Passage of Power*; Dallek, *Flawed Giant* (K–J Adm. II.A).
  - id: cal.1961-05-11.vietnam
    when: May 11
    date: '1961-05-11'
    thread: vietnam
    c: 'NSAM 52 adopts the Gilpatric task force program: more advisers, Special Forces, a study of combat troops. Nolting presents credentials in Saigon.'
    n: 'NSAM No. 52 (K–J Adm. II.H.2). FRUS vol. 1. Novosejt; Logevall, *Choosing War* (K–J Adm. II.D). Names: Gilpatric, Lansdale (K–J Adm. III.F); Nolting (K–J Adm. III.E).'
  - id: cal.1961-05-14.freedom-rides
    when: May 14
    date: '1961-05-14'
    thread: freedom-rides
    c: Mother's Day. The Greyhound bus burned outside Anniston; the Trailways riders beaten at the Birmingham terminal while the police stayed away. The FBI knew in advance through its informer.
    n: McWhorter, *Carry Me Home*; May, *The Informant* (K–J Cong. II.F). O'Reilly, *"Racial Matters"* (K–J Adm. II.E). See [[cal.1961-05-04.freedom-rides]].
  - id: cal.1961-05-16.laos
    when: May 16
    date: '1961-05-16'
    thread: laos
    c: The Geneva conference on Laos opens. Harriman leads the delegation.
    n: See [[cal.1961-03-23.laos]]. Abramson, *Spanning the Century* (K–J Adm. II.G.4).
  - id: cal.1961-05-16.transition-and-staff
    when: May 16
    date: '1961-05-16'
    thread: transition-and-staff
    c: Ottawa. Kennedy injures his back at a tree planting; the pain and its treatment follow him to Vienna.
    n: Dallek, *An Unfinished Life* (K–J Adm. II.A).
  - id: cal.1961-05-19.civil-rights-the-executive
    when: May 19
    date: '1961-05-19'
    thread: civil-rights-the-executive
    c: 'Omnibus judgeship act signed: seventy-three new federal judgeships for Kennedy to fill, many in the South.'
    n: 'Pub. L. No. 87-36, 75 Stat. 80 (1961). Navasky, *Kennedy Justice* (K–J Adm. II.E), on the southern appointments. Bass, *Unlikely Heroes* (K–J Cong. II.H). Sheldon Goldman, *Picking Federal Judges: Lower Court Selection from Roosevelt Through Reagan* (1997). Names: Eastland (K–J Cong. III.B).'
  - id: cal.1961-05-20.freedom-rides
    when: May 20
    date: '1961-05-20'
    thread: freedom-rides
    c: Montgomery. The Nashville riders beaten at the Greyhound station; Seigenthaler clubbed unconscious. Byron White flies in with federal marshals.
    n: 'See [[cal.1961-05-04.freedom-rides]]. Names: Patterson (K–J Cong. III.F).'
  - id: cal.1961-05-21.freedom-rides
    when: May 21
    date: '1961-05-21'
    thread: freedom-rides
    c: Mob besieges King, Abernathy, and the riders in the First Baptist Church; marshals hold it until Patterson sends the Guard. Martial law.
    n: See [[cal.1961-05-04.freedom-rides]].
  - id: cal.1961-05-24.freedom-rides
    when: May 24
    date: '1961-05-24'
    thread: freedom-rides
    c: Riders go on to Jackson under Guard escort and are arrested on arrival; many to Parchman. Robert Kennedy calls for a cooling-off period.
    n: See [[cal.1961-05-04.freedom-rides]]. Dittmer, *Local People* (K–J Cong. II.F).
  - id: cal.1961-05-25.space
    when: May 25
    date: '1961-05-25'
    thread: space
    also: [school-aid]
    c: 'Special message on urgent national needs, before a joint session: a man on the moon before the decade is out; also civil defense, Special Forces, foreign aid, the information agency. Same day the Senate passes school aid, [49–34](https://voteview.com/rollcall/RS0870054).'
    n: Special Message to the Congress on Urgent National Needs (May 25, 1961). See [[cal.1961-04-12.space]]. Recording (K–J Adm. II.I). See [[cal.1961-02-20.school-aid]].
  - id: cal.1961-05-27.states-and-cities
    when: May 27
    date: '1961-05-27'
    thread: states-and-cities
    c: Tower beats Blakley in the runoff by about ten thousand votes. The first Republican senator elected from the former Confederacy since Reconstruction.
    n: 'See [[cal.1961-04-04.states-and-cities]]. Names: Tower (Opp. III.B); Blakley (K–J Cong. III.B).'
  - id: cal.1961-05-28.opinion
    when: May 28–June 2
    date: '1961-05-28'
    thread: opinion
    c: 'Gallup on the Freedom Riders: of those who knew who they were, 61 percent disapprove. 57 percent think sit-ins and freedom buses hurt the chances of integration.'
    n: Roper Center iPoll (K–J Cong. II.L); the Civil Rights Movement Archive's compilation of 1960s polls, [crmvet.org](https://www.crmvet.org/docs/60s_crm_public-opinion.pdf). Branch, *Parting the Waters* (K–J Adm. II.C), gives 63 percent. See [[cal.1961-05-04.freedom-rides]] and [[cal.1961-02-10.opinion]].
  - id: cal.1961-05-29.court
    when: May 29
    date: '1961-05-29'
    thread: court
    c: '*McGowan v. Maryland*, [366 U.S. 420](https://tile.loc.gov/storage-services/service/ll/usrep/usrep366/usrep366420/usrep366420.pdf). Sunday laws upheld.'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-05-29.freedom-rides
    when: May 29
    date: '1961-05-29'
    thread: freedom-rides
    c: Robert Kennedy petitions the Interstate Commerce Commission to forbid segregation in interstate bus terminals.
    n: See [[cal.1961-05-04.freedom-rides]]; [[cal.1961-09-22.freedom-rides]].
  - id: cal.1961-05-30.latin-america
    when: May 30
    date: '1961-05-30'
    thread: latin-america
    c: Trujillo killed outside Ciudad Trujillo by conspirators the CIA had supplied with weapons.
    n: 'S. Rep. No. 94-465 (K–J Adm. II.H.3). Bernard Diederich, *Trujillo: The Death of the Goat* (1978). Rabe (K–J Adm. II.D). FRUS vol. 12. Fiction: Mario Vargas Llosa, *La fiesta del Chivo* (2000), translated as *The Feast of the Goat* (2001). Names: Trujillo (K–J Adm. III.J).'
  - id: cal.1961-05-31.states-and-cities
    when: May 31
    date: '1961-05-31'
    thread: states-and-cities
    c: Sam Yorty unseats Mayor Norris Poulson in Los Angeles.
    n: 'John C. Bollens & Grant B. Geyer, *Yorty: Politics of a Constant Candidate* (1973). Check. Names: Yorty (K–J Cong. III.F).'
  - id: cal.1961-05-31.berlin-and-vienna
    when: May 31–June 2
    date: '1961-05-31'
    thread: berlin-and-vienna
    c: Paris. De Gaulle advises firmness on Berlin. "I am the man who accompanied Jacqueline Kennedy to Paris."
    n: De Gaulle, *Mémoires d'espoir* (K–J Adm. II.G.7). FRUS vol. 14.
  - id: cal.1961-05.economy
    when: May
    date: 1961-05
    thread: economy
    c: Unemployment 7.1 percent, the high of the year in the revised series; reported at the time as 6.9. Output and payrolls are recovering; the rate lags.
    n: '*Federal Reserve Bulletin* (June 1961), *The Labor Market in Mid-1961*, on FRASER (K–J Adm. II.K). See Feb.'
