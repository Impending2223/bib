    n: '[Remarks of Welcome to President Bourguiba of Tunisia at the Washington National Airport](https://www.presidency.ucsb.edu/documents/remarks-welcome-president-bourguiba-tunisia-the-washington-national-airport) (May 3, 1961); [Joint Statement Following Discussions With President Bourguiba](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-bourguiba) (May 5, 1961). FRUS 1961–63, XXI, docs. [162](https://history.state.gov/historicaldocuments/frus1961-63v21/d162), [163](https://history.state.gov/historicaldocuments/frus1961-63v21/d163) (Presidential Determination No. 61-26). [[w.muehlenbeck-betting-on-the-africans]]. Names: Bourguiba.'
