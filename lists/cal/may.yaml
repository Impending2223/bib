  - id: cal.1961-05-04.middle-east
    when: May 4–5
    date: '1961-05-04'
    thread: middle-east
    c: 'Tehran. A teachers'' strike; 50,000 demonstrators clash with the army and the police, May 4. May 5, the Prime Minister and his cabinet resign; the Shah then names Amini, once ambassador in Washington. Amini''s terms: his own cabinet, the Majlis dissolved, a court for corruption. The NSC, the same day: a task force on Iran under Talbot, its report by May 15. Kennedy, by Rusk''s note: "the potentially dangerous situation in Iran."'
    n: '[FRUS 1961–63, XVII, doc. 41](https://history.state.gov/historicaldocuments/frus1961-63v17/d41) (editorial note: NSC Action No. 2420; the task force). [[w.rubin-paved-with-good-intentions]]; [[w.bill-eagle-and-the-lion]]; [[w.gasiorowski-u-s-foreign-policy]]; [[w.little-american-orientalism]]; [[w.offiler-us-foreign-policy-and]]. See [[cal.1960-08-25.middle-east]]. Names: Pahlavi, Amini, Talbot, Rusk, Kennedy.'
    tags: [name:pahlavi-mohammed-reza, name:amini-ali, name:talbot-phillips, name:rusk-dean, name:kennedy-john-f]
  - id: cal.1961-05-05.space
    when: May 5
    date: '1961-05-05'
    thread: space
    also: [jobs-and-wages]
    c: 'Shepard''s suborbital flight. Same day: minimum wage amendments signed, [75 Stat. 65](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg65.pdf), $1.25 by 1963, coverage for about 3.6 million more workers.'
    n: 'Statute (K–J Cong. II.J.2). See [[cal.1961-03-24.program]]. Names: Shepard.'
    tags: [name:kennedy-john-f, name:shepard-alan-b-jr]
  - id: cal.1961-05-05.opinion
    when: May 5
    date: '1961-05-05'
    thread: opinion
    also: [cuba]
    c: 'Gallup, Apr. 28–May 3: Kennedy''s handling of Cuba, 61 percent approve, 15 disapprove. 44 percent follow the news from Cuba a great deal.'
    n: '[[w.gallup-poll]], III, 1717.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-05-06.robert-kennedy
    when: May 6
    date: '1961-05-06'
    thread: robert-kennedy
    also: [desegregation-schools, georgia]
    c: 'Robert Kennedy at the University of Georgia Law School''s Law Day exercises, Athens, Ga. On Prince Edward County, Va., which had closed its schools: "if the orders of the court are circumvented, the Department of Justice will act. We will not stand by or be aloof. We will move." "I happen to believe that the 1954 decision was right."'
    n: '[Address at the Law Day Exercises of the University of Georgia Law School](https://www.justice.gov/ag/rfkspeeches/1961/05-06-1961.pdf) (May 6, 1961). [[w.robert-kennedy-in-his]]; [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]; [[w.navasky-kennedy-justice]]; [[w.guthman-we-band-of-brothers]]; [[w.shesol-mutual-contempt]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f]
  - id: cal.1961-05-08.confirmations
    when: May 8
    date: '1961-05-08'
    thread: confirmations
    c: Julius C. Holmes confirmed ambassador to Iran, [63–17](https://voteview.com/rollcall/RS0870034).
    n: '[107 Cong. Rec., Senate, May 8, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt6/pdf/GPO-CRECB-1961-pt6-5-1.pdf). See [[cal.1961-03-07.confirmations]]. Names: Holmes.'
    tags: [name:holmes-julius-c]
  - id: cal.1961-05-08.middle-east
    when: May 8
    date: '1961-05-08'
    thread: middle-east
    c: The Iran task force first meets, Talbot chairing, Holmes its deputy.
    n: 'FRUS 1961–63, XVII, doc. [41](https://history.state.gov/historicaldocuments/frus1961-63v17/d41) (editorial note). See [[cal.1961-05-04.middle-east]]. Names: Talbot, Holmes.'
    tags: [name:talbot-phillips, name:holmes-julius-c]
  - id: cal.1961-05-09.press-and-broadcasting
    when: May 9
    date: '1961-05-09'
    thread: press-and-broadcasting
    c: Minow tells the broadcasters their schedules are "a vast wasteland."
    n: '[Cong. Rec., Senate, May 11, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt6/pdf/GPO-CRECB-1961-pt6-8-1.pdf#page=33). [[w.equal-time]]; [[w.watson-expanding-vista]]. Recording (K–J Adm. II.I). Names: Minow, Collins.'
    tags: [name:minow-newton-n, name:collins-leroy]
  - id: cal.1961-05-09.berlin-and-vienna
    when: May 9
    date: '1961-05-09'
    thread: berlin-and-vienna
    also: [robert-kennedy, soviet-union]
    c: Robert Kennedy's first meeting with Georgi Bolshakov. The back channel to Khrushchev opens.
    n: '[[w.fursenko-one-hell-of-a]]. Names: Robert Kennedy, Bolshakov, Khrushchev.'
    tags: [name:kennedy-robert-f, name:bolshakov-georgi, name:khrushchev-nikita-s]
  - id: cal.1961-05-09.vietnam
    when: May 9–13
    date: '1961-05-09'
    thread: vietnam-johnson-asia
    c: 'Johnson leaves on a trip to Asia, May 9. Saigon, May 11–13: he calls Diệm the Churchill of Asia.'
    n: 'Check: the record of the Saigon talks. [[w.caro-passage-of-power]]; [[w.dallek-flawed-giant]]. Names: Johnson, Diệm.'
    tags: [name:johnson-lyndon-b, name:ngo-dinh-diem]
  - id: cal.1961-05-10.opinion
    when: May 10
    date: '1961-05-10'
    thread: opinion
    also: [cuba]
    c: 'Gallup, Apr. 28–May 3: would Castro win a free election? 14 percent yes, 71 no. Cuba policy to be decided with the Latin American countries through the UN, 70 percent agree.'
    n: '[[w.gallup-poll]], III, 1717. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1961-05-11.vietnam
    when: May 11
    date: '1961-05-11'
    thread: vietnam
    c: 'NSAM 52 adopts the Gilpatric task force program: more advisers, Special Forces, a study of combat troops. Nolting presents credentials in Saigon.'
    n: '[NSAM No. 52](https://history.state.gov/historicaldocuments/frus1961-63v01/d52) (K–J Adm. II.H.2). [FRUS vol. 1](https://history.state.gov/historicaldocuments/frus1961-63v01). [[w.novosejt-i-made-mistakes-robert]]; [[w.logevall-choosing-war]]. Names: Gilpatric, Lansdale, Nolting.'
    tags: [name:gilpatric-roswell-l, name:nolting-frederick-e-jr, name:kennedy-john-f, name:lansdale-edward-g]
  - id: cal.1961-05-11.middle-east
    when: May 11
    date: '1961-05-11'
    thread: middle-east
    c: 'Kennedy to Nasser, Chehab, Hussein, Qassim, the King of Saudi Arabia and the Imam of Yemen: the United States will help resolve the Palestine refugee problem on the principle of repatriation or compensation, and the Jordan waters; its position "anchored in the firm bedrock" of the General Assembly''s recommendations. Nasser''s reply, Aug. 22.'
    n: 'FRUS 1961–63, XVII, docs. [47](https://history.state.gov/historicaldocuments/frus1961-63v17/d47) (to Nasser), [103](https://history.state.gov/historicaldocuments/frus1961-63v17/d103) (the reply). [[w.heikal-cairo-documents]]; [[w.badeau-middle-east-remembered]]; [[w.gazit-president-kennedys-policy-toward]]; [[w.little-new-frontier-on-the]]; [[w.bass-support-any-friend]]. Names: Nasser, Chehab, Hussein ibn Talal, Qassim.'
    tags: [name:kennedy-john-f, name:nasser-gamal-abdel, name:chehab-fuad, name:hussein-ibn-talal, name:qassim-abdul-karim]
  - id: cal.1961-05-14.freedom-rides
    when: May 14
    date: '1961-05-14'
    thread: freedom-rides
    also: [alabama]
    c: Mother's Day. The Greyhound bus burned outside Anniston; the Trailways riders beaten at the Birmingham terminal while the police stayed away. The FBI knew in advance through its informer.
    n: '*United States v. U.S. Klans, Knights of Ku Klux Klan, Inc.*, [194 F. Supp. 897](https://static.case.law/f-supp/194/html/0897-01.html), 900 (M.D. Ala. 1961). [[w.mcwhorter-carry-me-home]]; [[w.may-informant]]; [[w.oreilly-racial-matters-the-fbis]]. See [[cal.1961-05-04.freedom-rides]].'
  - id: cal.1961-05-14.vietnam-johnson-asia
    when: May 14–20
    date: '1961-05-14'
    thread: vietnam-johnson-asia
    also: [india-and-china]
    c: Johnson in Manila, Taipei, Bangkok, New Delhi and Karachi. Check the days.
    n: 'FRUS 1961–63, XIX, docs. [20](https://history.state.gov/historicaldocuments/frus1961-63v19/d20) (New Delhi, May 18), [22](https://history.state.gov/historicaldocuments/frus1961-63v19/d22) (Karachi, May 20). See [[cal.1961-05-09.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1961-05-16.laos
    when: May 16
    date: '1961-05-16'
    thread: laos
    c: The Geneva conference on Laos opens. Rusk heads the delegation; Harriman after Rusk goes home.
    n: 'FRUS 1961–63, XXIV, docs. [87](https://history.state.gov/historicaldocuments/frus1961-63v24/d87), [91](https://history.state.gov/historicaldocuments/frus1961-63v24/d91). See [[cal.1961-03-23.laos]]. [[w.abramson-spanning-the-century]]. Names: Rusk, Harriman.'
    tags: [name:rusk-dean, name:harriman-w-averell]
  - id: cal.1961-05-16.transition-and-staff
    when: May 16
    date: '1961-05-16'
    thread: transition-and-staff
    c: Ottawa. Kennedy injures his back at a tree planting; the pain and its treatment follow him to Vienna.
    n: '[Remarks Upon Arrival at the Royal Canadian Air Force Uplands Airport in Ottawa](https://www.presidency.ucsb.edu/documents/remarks-upon-arrival-the-royal-canadian-air-force-uplands-airport-ottawa). [[w.dallek-unfinished-life]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-05-16.specials
    when: May 16
    date: '1961-05-16'
    thread: specials
    c: Pennsylvania 16th, special. Kunkel (R) holds Mumma's seat, 65.6 percent. Swing 3.1 to R.
    n: '[*Pa. Manual*, 1961–62, p. 714](https://babel.hathitrust.org/cgi/pt?id=uiug.30112053623135&seq=722). Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]]. Names: Kunkel.'
    tags: [special:1961-05-16-h-PA-16, name:kunkel-john-c, name:mumma-walter-m]
  - id: cal.1961-05-16.specials-2
    when: May 16
    date: '1961-05-16'
    thread: specials
    c: Tennessee 1st, special. Louise Goff Reece (R) to her husband's seat, 62.9 percent. Swing 9.9 to D.
    n: 'Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]]. Names: Reece.'
    tags: [special:1961-05-16-h-TN-1, name:reece-brazilla-c, name:reece-louise-goff]
  - id: cal.1961-05-16.japan-and-korea
    when: May 16–18
    date: '1961-05-16'
    thread: japan-and-korea
    c: Seoul. Army units and marines under Maj. Gen. Park Chung Hee take the capital before dawn; a Military Revolutionary Committee, the Army's chief of staff its chairman, Park his deputy. Magruder, the U.N. commander, and Green, the chargé, declare for Chang Myon's government, unauthorized; Magruder refuses American troops against the coup. Chang Myon in hiding; Washington waits. May 18, his cabinet resigns; Yun Po-sun stays President.
    n: 'FRUS 1961–63, XXII, docs. [213](https://history.state.gov/historicaldocuments/frus1961-63v22/d213), [215](https://history.state.gov/historicaldocuments/frus1961-63v22/d215), [216](https://history.state.gov/historicaldocuments/frus1961-63v22/d216), [217](https://history.state.gov/historicaldocuments/frus1961-63v22/d217), [218](https://history.state.gov/historicaldocuments/frus1961-63v22/d218), [219](https://history.state.gov/historicaldocuments/frus1961-63v22/d219), [220](https://history.state.gov/historicaldocuments/frus1961-63v22/d220). [[w.brazinsky-nation-building-in-south]]; [[w.han-failure-of-democracy-in]]; [[w.henderson-korea]]; [[w.macdonald-u-s-korean-relations]]; [[w.park-chung-hee-era]]; [[w.lee-troubled-peace]]. See [[cal.1960-08-12.japan-and-korea]]. Names: Park, Chang Myon, Yun, Magruder, Green.'
    tags: [name:park-chung-hee, name:magruder-carter-b, name:green-marshall, name:chang-myon, name:yun-po-sun]
  - id: cal.1961-05-16.european-community
    when: May 16
    date: '1961-05-16'
    thread: european-community
    c: 'Hallstein, President of the EEC Commission, at the White House. Joint statement: the Community and integration "as envisaged by the Treaty of Rome" supported; a common agricultural policy endorsed, to take account of the United States and other exporters; the tariff negotiations at Geneva to ease other countries'' adjustment to the Community.'
    n: '[Joint Statement Following Meeting With Dr. Walter Hallstein, President of the European Economic Community](https://www.presidency.ucsb.edu/documents/joint-statement-following-meeting-with-dr-walter-hallstein-president-the-european-economic) (May 16, 1961). [[w.zeiler-american-trade-and-power]]; [[w.winand-eisenhower-kennedy-and-the]]. See [[cal.1961-04-05.european-community]]. Names: Hallstein.'
    tags: [name:hallstein-walter, name:kennedy-john-f]
  - id: cal.1961-05-17.europe-and-the-alliance
    when: May 17
    date: '1961-05-17'
    thread: europe-and-the-alliance
    c: Ottawa, to the Canadian Parliament. Five Polaris submarines, "and subsequently still more," to be committed to the NATO command; beyond them, "a NATO sea-borne force, which would be truly multi-lateral in ownership and control," if the allies want it, once NATO's non-nuclear goals are met.
    n: '[Address Before the Canadian Parliament in Ottawa](https://www.presidency.ucsb.edu/documents/address-before-the-canadian-parliament-ottawa) (May 17, 1961). [[w.steinbruner-cybernetic-theory-of-decision]]; [[w.trachtenberg-constructed-peace]]. See [[cal.1960-12-16.europe-and-the-alliance]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-05-19.civil-rights-the-executive
    when: May 19
    date: '1961-05-19'
    thread: civil-rights-the-executive
    c: 'Omnibus judgeship act signed, [75 Stat. 80](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg80.pdf): seventy-three new federal judgeships for Kennedy to fill, many in the South.'
    n: '[[w.navasky-kennedy-justice]], on the southern appointments; [[w.bass-unlikely-heroes]]; [[w.goldman-picking-federal-judges]]. Names: Eastland.'
    tags: [name:kennedy-john-f, name:eastland-james-o]
  - id: cal.1961-05-19.middle-east
    when: May 19
    date: '1961-05-19'
    thread: middle-east
    c: 'The NSC, Kennedy presiding, on the Iran task force''s report: "a major effort to back the new Government"; Amini encouraged "positively but discreetly," without arousing the Shah''s opposition; no military coup favored. A cash grant of $15 million at once, $5 million more if needed. Approved May 24.'
    n: 'FRUS 1961–63, XVII, docs. [51](https://history.state.gov/historicaldocuments/frus1961-63v17/d51) (Record of Action No. 2427), [90](https://history.state.gov/historicaldocuments/frus1961-63v17/d90). See [[cal.1961-05-04.middle-east]]. Names: Amini, Pahlavi, Kennedy.'
    tags: [name:kennedy-john-f, name:amini-ali, name:pahlavi-mohammed-reza]
  - id: cal.1961-05-20.freedom-rides
    when: May 20
    date: '1961-05-20'
    thread: freedom-rides
    also: [alabama]
    c: Montgomery. The Nashville riders beaten at the Greyhound station; Seigenthaler clubbed unconscious. Byron White flies in with federal marshals.
    n: '[Statement by the President Concerning Interference With the "Freedom Riders" in Alabama](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-interference-with-the-freedom-riders-alabama). See [[cal.1961-05-04.freedom-rides]]. Names: Seigenthaler, White, Patterson.'
    tags: [name:seigenthaler-john, name:white-byron-r, name:patterson-john]
  - id: cal.1961-05-21.freedom-rides
    when: May 21
    date: '1961-05-21'
    thread: freedom-rides
    also: [king, alabama]
    c: Mob besieges King, Abernathy, and the riders in the First Baptist Church; marshals hold it until Patterson sends the Guard. Martial law.
    n: 'King, [Address at Freedom Riders Rally at First Baptist Church](https://okra.stanford.edu/link/document610521-000) (King Papers Project), printed in [[w.papers-of-martin-luther-vii]], 227 ([King Institute](https://kinginstitute.stanford.edu/king-papers/documents/address-freedom-riders-rally-first-baptist-church-0)); his words to the church that night, from a tape, printed as "Statement Delivered at Freedom Riders Rally at First Baptist Church," [[w.papers-of-martin-luther-vii]], 231 ([King Institute](https://kinginstitute.stanford.edu/king-papers/documents/statement-delivered-freedom-riders-rally-first-baptist-church)). [Announcement of martial law in Montgomery](https://okra.stanford.edu/link/document610521-002) (King Papers Project). See [[cal.1961-05-04.freedom-rides]]. Names: King, Abernathy, Patterson.'
    tags: [name:king-martin-luther-jr, name:patterson-john, name:abernathy-ralph-david]
  - id: cal.1961-05-22.robert-kennedy
    when: May 22
    date: '1961-05-22'
    thread: robert-kennedy
    also: [cuba, crime-and-hijacking]
    c: 'Hoover to Robert Kennedy on the wiretap found in a Las Vegas hotel room Oct. 31, 1960, placed for Maheu. Maheu to the FBI, Apr. 18: the tap was part of a project "on behalf of the CIA relative to anti-Castro activities." Edwards, the CIA''s Director of Security, May 3: the Agency had used Giancana, through Maheu, against Castro; of the methods he knew nothing, it being "dirty business." Kennedy, in the margin: "Courtney I hope this will be followed up vigorously."'
    n: '[S. Rep. No. 94-465, 125–28 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=136); the tap, [77](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=88) (K–J Adm. II.H.3). The Bureau''s files already held Hoover''s memorandum of Oct. 18, 1960: Giancana had told friends Castro would be "done away with" in November (126). [[w.thomas-very-best-men]]; [[w.powers-man-who-kept-the]]; [[w.thomas-robert-kennedy]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Robert Kennedy, Hoover, Edwards, Giancana, Maheu, Castro.'
    tags: [name:kennedy-robert-f, name:hoover-j-edgar, name:giancana-sam, name:edwards-sheffield, name:maheu-robert-a, name:evans-courtney-a, name:castro-fidel]
  - id: cal.1961-05-23.electoral-college
    when: May 23–25
    date: '1961-05-23'
    thread: electoral-college
    also: [amendments, congress]
    c: 'Senate Judiciary''s Subcommittee on Constitutional Amendments, Kefauver''s, opens hearings on seventeen joint resolutions on federal elections: the nomination and election of the President and Vice President, electoral college reform among them; the voting age, residence and the poll tax; repeal of the Twenty-second Amendment. The sponsors first, May 23–25. Thurmond, June 8, for the district plan, S.J. Res. 12; more hearings June 20–22.'
    n: 'Kefauver''s notice, [107 Cong. Rec. 7770](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt6/pdf/GPO-CRECB-1961-pt6-8-1.pdf) (1961); Thurmond''s testimony, [10,812](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-8-1.pdf). *Nomination and Election of President and Vice President and Qualifications for Voting: Hearings before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 87th Cong. (1961) (Check the title and a digitized copy). [[w.peirce-peoples-president]]; [[w.longley-politics-of-electoral-college]]. See [[cal.1961-01-06.elections-1960]]. Names: Kefauver, Thurmond.'
    tags: [name:kefauver-estes, name:thurmond-strom]
  - id: cal.1961-05-23.vietnam-johnson-asia
    when: May 23
    date: '1961-05-23'
    thread: vietnam-johnson-asia
    c: Johnson's report to Kennedy on the trip urges a decision to stand in Southeast Asia.
    n: 'Letter from Johnson to Kennedy (K–J Adm. II.H.3), FRUS 1961–63, I, docs. [59](https://history.state.gov/historicaldocuments/frus1961-63v01/d59), [60](https://history.state.gov/historicaldocuments/frus1961-63v01/d60). See [[cal.1961-05-09.vietnam]]. Names: Johnson, Kennedy.'
    tags: [name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1961-05-24.freedom-rides
    when: May 24
    date: '1961-05-24'
    thread: freedom-rides
    also: [robert-kennedy, alabama, mississippi]
    c: Riders go on to Jackson under Guard escort and are arrested on arrival; many to Parchman, Miss. Robert Kennedy calls for a cooling-off period.
    n: 'See [[cal.1961-05-04.freedom-rides]]. [[w.dittmer-local-people]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f]
  - id: cal.1961-05-25.space
    when: May 25
    date: '1961-05-25'
    thread: space
    also: [school-aid]
    c: 'Special message on urgent national needs, before a joint session: a man on the moon before the decade is out; also civil defense, Special Forces, foreign aid, the information agency. Same day the Senate passes school aid, [49–34](https://voteview.com/rollcall/RS0870054).'
    n: '[Special Message to the Congress on Urgent National Needs](https://www.presidency.ucsb.edu/documents/special-message-the-congress-urgent-national-needs) (May 25, 1961). See [[cal.1961-04-12.space]]. Recording (K–J Adm. II.I). See [[cal.1961-02-20.school-aid]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-05-27.states-and-cities
    when: May 27
    date: '1961-05-27'
    thread: states-and-cities
    also: [specials]
    c: Tower beats Blakley in the runoff by about ten thousand votes. The first Republican senator elected from the former Confederacy since Reconstruction. Swing 9.1 to R from Johnson's 1960 race.
    n: 'See [[cal.1961-04-04.states-and-cities]]. Names: Tower, Blakley, Johnson.'
    tags: [special:1961-05-27-s-TX-2, name:tower-john-g, name:blakley-william-a, name:johnson-lyndon-b, state:tx]
  - id: cal.1961-05-28.opinion
    when: May 28–June 2
    date: '1961-05-28'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup in the field on the Freedom Riders, released June 21 and 28. Of the 63 percent who had heard of the rides, 64 disapprove, 24 approve. Sit-ins: 57 percent think they hurt, 27 help.'
    n: '[[w.gallup-poll]], III, 1723–24. Roper Center iPoll (K–J Cong. II.L); the Civil Rights Movement Archive''s compilation of 1960s polls, [crmvet.org](https://www.crmvet.org/docs/60s_crm_public-opinion.pdf). See [[cal.1961-05-04.freedom-rides]] and [[cal.1961-02-10.opinion]].'
  - id: cal.1961-05-29.court
    when: May 29
    date: '1961-05-29'
    thread: court
    c: '*McGowan v. Maryland*, [366 U.S. 420](https://tile.loc.gov/storage-services/service/ll/usrep/usrep366/usrep366420/usrep366420.pdf). Sunday laws upheld.'
    n: See [[cal.1961-01-23.court]].
    tags: [state:md]
  - id: cal.1961-05-29.freedom-rides
    when: May 29
    date: '1961-05-29'
    thread: freedom-rides
    also: [robert-kennedy]
    c: Robert Kennedy petitions the Interstate Commerce Commission to forbid segregation in interstate bus terminals.
    n: '[Interstate Commerce Commission, No. MC-C-3358, Notice of Proposed Rule Making, 26 Fed. Reg. 5530](https://www.govinfo.gov/content/pkg/FR-1961-06-21/pdf/FR-1961-06-21.pdf#page=44) (June 21, 1961). The order: [[cal.1961-09-22.freedom-rides]]. See [[cal.1961-05-04.freedom-rides]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f]
  - id: cal.1961-05-30.latin-america
    when: May 30
    date: '1961-05-30'
    thread: latin-america
    c: Trujillo killed outside Ciudad Trujillo by conspirators the CIA had supplied with weapons.
    n: 'S. Rep. No. 94-465 (K–J Adm. II.H.3). [[w.diederich-trujillo]]. [[w.rabe-most-dangerous-area-in]]. [FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). Fiction: [[w.llosa-la-fiesta-del-chivo]], translated as *The Feast of the Goat* (2001). Names: Trujillo.'
    tags: [name:trujillo-rafael]
  - id: cal.1961-05-30.middle-east
    when: May 30
    date: '1961-05-30'
    thread: middle-east-dimona
    c: 'Kennedy and Ben Gurion at the Waldorf-Astoria, New York, 4:45–6 p.m. Dimona: two American scientists have seen it; Kennedy asks that its peaceful purpose be made plain to others, "a woman should not only be virtuous but also have the appearance of virtue." Ben Gurion asks for the Hawk; Kennedy reluctant to bring missiles into the region.'
    n: 'FRUS 1961–63, XVII, doc. [57](https://history.state.gov/historicaldocuments/frus1961-63v17/d57). [[w.gazit-president-kennedys-policy-toward]]; [[w.ben-zvi-decade-of-transition]]; [[w.cohen-israel-and-the-bomb]]; [[w.bass-support-any-friend]]. See [[cal.1960-12-08.middle-east]]. Names: Ben Gurion.'
    tags: [name:kennedy-john-f, name:ben-gurion-david]
  - id: cal.1961-05-31.states-and-cities
    when: May 31
    date: '1961-05-31'
    thread: mayors
    also: [elections-1961]
    c: Los Angeles runoff. Sam Yorty unseats Mayor Norris Poulson, 275,249 to 259,760, 51.5 percent.
    n: 'Votes: [Wikipedia, "1961 Los Angeles mayoral election"](https://en.wikipedia.org/wiki/1961_Los_Angeles_mayoral_election); Check: the City Clerk''s canvass. [[w.bollens-yorty]]. See [[cal.1961-04-04.mayors-los-angeles]]. Names: Yorty, Poulson.'
    tags: [name:yorty-sam, name:poulson-norris, state:ca, city:los-angeles]
  - id: cal.1961-05-31.berlin-and-vienna
    when: May 31–June 2
    date: '1961-05-31'
    thread: berlin-and-vienna
    c: Paris. De Gaulle advises firmness on Berlin. "I am the man who accompanied Jacqueline Kennedy to Paris."
    n: '[[w.gaulle-memoires-despoir]]. FRUS 1961–63, XIV, docs. [30](https://history.state.gov/historicaldocuments/frus1961-63v14/d30), [31](https://history.state.gov/historicaldocuments/frus1961-63v14/d31). Names: de Gaulle, Jacqueline Kennedy.'
    tags: [name:kennedy-jacqueline, name:de-gaulle-charles, name:kennedy-john-f]
  - id: cal.1961-05.economy
    when: May
    date: 1961-05
    thread: economy
    c: Unemployment 7.1 percent, the high of the year in the revised series; reported at the time as 6.9. Output and payrolls are recovering; the rate lags.
    n: '[Employment and Earnings, June 1961, Monthly Report on the Labor Force: May 1961](https://fraser.stlouisfed.org/files/docs/publications/employment/1960s/empl_061961.pdf#page=3). [[w.federal-reserve-bulletin]], *The Labor Market in Mid-1961*, on FRASER (K–J Adm. II.J). See [[cal.1961-02.economy]].'
  - id: cal.1961-05-31.opinion
    when: May 31
    date: '1961-05-31'
    thread: opinion
    also: [space]
    c: 'Gallup, May 17–22: $40 billion, about $225 a person, to send a man to the moon. 33 percent for, 58 against.'
    n: '[[w.gallup-poll]], III, 1720.'
  - id: cal.1961-05.antisubversion-ca
    when: May
    date: 1961-05
    thread: antisubversion
    also: [students]
    c: 'California. The Senate''s Fact-Finding Subcommittee on Un-American Activities, Burns chairman, its eleventh report, to the Legislature: the Communist Party "has steadily been gaining strength"; the student riots at the HUAC hearings in San Francisco, May 1960; SLATE and the student groups at Berkeley; the University of California. Check the month: the report cites events to Apr. 26.'
    n: '[*Un-American Activities in California, 1961: Report of the Senate Fact-Finding Subcommittee on Un-American Activities*](https://archive.org/details/1961ReportOfCaliforniaSenateFactfindingSubcommitteeOnUnAmericanActivities) (1961). [[w.heale-mccarthys-americans]]; [[w.rorabaugh-berkeley-at-war]]. See [[cal.1960-05-12.students]]. Names: Burns.'
    tags: [state:ca, city:berkeley, city:san-francisco, name:burns-hugh-m]
  - id: cal.1961-05.mayors-omaha
    when: May
    date: 1961-05
    thread: mayors
    also: [elections-1961]
    c: Omaha elects Dworak (D), a city councilman, mayor, by 342 votes over an Omaha attorney; the mayor not running.
    n: '[Wikipedia, "James Dworak"](https://en.wikipedia.org/wiki/James_Dworak); [Wikipedia, "List of mayors of Omaha, Nebraska"](https://en.wikipedia.org/wiki/List_of_mayors_of_Omaha,_Nebraska) (Check: the day and the vote, from the Douglas County Election Commissioner). [[w.peirce-great-plains-states-of]]. Names: Dworak.'
    tags: [state:ne, city:omaha, name:dworak-james-j]
