    c: Thirteen CORE riders leave Washington on two buses to test *Boynton v. Virginia* (1960).
    n: '*Boynton v. Virginia*, [364 U.S. 454](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364454/usrep364454.pdf) (1960). [[w.arsenault-freedom-riders]]; [[w.branch-parting-the-waters]]; [[w.navasky-kennedy-justice]]; [[w.farmer-lay-bare-the-heart]]; [[w.lewis-walking-with-the-wind]]; [[w.robert-kennedy-in-his]]; [[w.wofford-of-kennedys-and-kings]]; [[w.guthman-we-band-of-brothers]]. Film: [[w.freedom-riders]]. Names: Farmer, Lewis, Nash, Seigenthaler, Marshall, White.'
