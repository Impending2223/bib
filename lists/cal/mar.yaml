# Cal. XVI March 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVI
entries:
  - id: cal.1961-03.right-and-the-military
    when: Mar.
    date: 1961-03
    thread: right-and-the-military
    c: 'The John Birch Society reaches the national press: the *Los Angeles Times* series and the newsmagazines. Check the dates.'
    n: '[[w.dallek-birchers]]; [[w.mulloy-world-of-the-john]]; [[w.schoenwald-time-for-choosing]]; [[w.hendershot-whats-fair-on-the]], for the broadcasters.'
  - id: cal.1961-03-01.peace-corps
    when: Mar. 1
    date: '1961-03-01'
    thread: peace-corps
    c: Executive order creates the Peace Corps on a trial basis. Shriver named director.
    n: '[Exec. Order No. 10,924](https://www.presidency.ucsb.edu/documents/executive-order-10924-establishment-and-administration-the-peace-corps-the-department), [26 Fed. Reg. 1789](https://www.govinfo.gov/app/details/FR-1961-03-02) (K–J Adm. II.H.2). [[w.hoffman-all-you-need-is]]; [[w.stossel-sarge]]; [[w.wofford-of-kennedys-and-kings]]; [[w.rice-bold-experiment]]. Names: Shriver, Wofford (K–J Adm. III.B, III.G).'
    tags: [name:shriver-r-sargent, name:kennedy-john-f]
  - id: cal.1961-03-04.economy
    when: Mar. 4–6
    date: '1961-03-04'
    thread: economy
    c: 'Bonn revalues the mark 4.75 percent: announced Saturday the 4th, effective Monday, 4.00 marks to the dollar instead of 4.20. The Netherlands follows. The central banks'' Basel arrangements to support sterling follow within the month.'
    n: '[FRUS 1961–63, XIV, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v14/d9) (Mar. 10, 1961). [[w.bundesbank-monatsbericht]] (März 1961); [[w.emminger-d-mark-dollar-wahrungskrisen]]; [[w.doru-kiki-to-1961]]; [[w.gavin-gold-dollars-and-power]]; [[w.coombs-arena-of-international-finance]] (K–J Adm. II.B). Federal Reserve Board, H.13 releases on FRASER (K–J Adm. II.J). Names: Adenauer (K–J Adm. III.J).'
  - id: cal.1961-03-06.civil-rights-the-executive
    when: Mar. 6
    date: '1961-03-06'
    thread: civil-rights-the-executive
    c: Executive order creates the President's Committee on Equal Employment Opportunity. Johnson chairs it. Contractors to take "affirmative action."
    n: '[Exec. Order No. 10,925](https://www.presidency.ucsb.edu/documents/executive-order-10925-establishing-the-presidents-committee-equal-employment-opportunity), [26 Fed. Reg. 1977](https://www.govinfo.gov/app/details/FR-1961-03-08) (K–J Adm. II.H.2). [[w.graham-civil-rights-era]]; [[w.brauer-john-f-kennedy-and]]; [[w.caro-passage-of-power]], on Johnson and Robert Kennedy in the committee.'
    tags: [name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1961-03-06.economy
    when: Mar. 6
    date: '1961-03-06'
    thread: economy
    c: 'Heller before the Joint Economic Committee: a gap between actual and potential output, and 4 percent unemployment as the goal. Next day Martin tells the committee much of the unemployment is structural. Patman presses Martin by letter, Mar. 30.'
    n: '[[w.heller-american-economy-in-1961]], [on FRASER](https://fraser.stlouisfed.org/title/9814/item/717990) (K–J Adm. II.K). Hearings and the committee''s report (K–J Cong. II.J.3). Okun, *Potential GNP* (K–J Adm. II.B), for the arithmetic. Names: Heller, Martin (K–J Adm. III.H); Patman (K–J Cong. III.D).'
    tags: [name:heller-walter-w, name:martin-william-mcchesney-jr, name:patman-wright]
  - id: cal.1961-03-07.confirmations
    when: Mar. 7–8
    date: '1961-03-07'
    thread: confirmations
    also: [alabama]
    c: Meriwether, Alabama's finance director and Patterson's former campaign manager, to the Export-Import Bank's board. Banking and Currency approves, 5–4, after questions on segregation and the Klan. Javits's motion to recommit fails, [18–66](https://voteview.com/rollcall/RS0870002); confirmed Mar. 8, [67–18](https://voteview.com/rollcall/RS0870003).
    n: '[107 Cong. Rec., Senate, Mar. 7, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt3/pdf/GPO-CRECB-1961-pt3-7-1.pdf); [107 Cong. Rec., Senate, Mar. 8, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt3/pdf/GPO-CRECB-1961-pt3-8-1.pdf); [Executive Calendar, Mar. 8, 1961](https://www.senate.gov/legislative/LIS/executive_calendar/1961/03_08_1961.pdf). The Senate''s roll calls on nominations: Voteview; *Journal of the Executive Proceedings of the Senate*. [[w.mackenzie-politics-of-presidential-appointments]]. Names: Javits (K–J Cong. III.E); Patterson (K–J Cong. III.F).'
    tags: [name:meriwether-charles-m, name:javits-jacob-k, name:patterson-john]
  - id: cal.1961-03-12.opinion
    when: Mar. 12
    date: '1961-03-12'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Feb. 10–15: raising the $1.00 minimum wage, 76 percent for, 18 against. Republicans 63 for.'
    n: '[[w.gallup-poll]], III, 1709.'
  - id: cal.1961-03-13.latin-america
    when: Mar. 13
    date: '1961-03-13'
    thread: latin-america
    c: The Alliance for Progress proposed to the Latin American diplomatic corps at the White House.
    n: '[Address at a White House Reception for Members of Congress and for the Diplomatic Corps of the Latin American Republics](https://www.presidency.ucsb.edu/documents/address-white-house-reception-for-members-congress-and-for-the-diplomatic-corps-the-latin) (Mar. 13, 1961). Levinson & de Onís; [[w.rabe-most-dangerous-area-in]]; [[w.latham-modernization-as-ideology]] (K–J Adm. II.D). [[w.goodwin-remembering-america]]; [[w.taffet-foreign-aid-as-foreign]]. [FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). Names: Goodwin, Dungan (K–J Adm. III.B).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-17.economy
    when: Mar. 17
    date: '1961-03-17'
    thread: economy
    c: 'Heller to the President: even if the whole program passes, output at year''s end will be some $40 billion below potential and unemployment no lower. He asks for a larger second stage. The April review is the next decision.'
    n: Memorandum from Heller to the President (Mar. 17, 1961) (K–J Adm. II.H.3).
    tags: [name:heller-walter-w, name:kennedy-john-f]
  - id: cal.1961-03-22.foreign-aid
    when: Mar. 22
    date: '1961-03-22'
    thread: foreign-aid
    c: Foreign aid message. One new agency in place of ICA and the loan fund; five-year development lending by borrowing from the Treasury.
    n: '[Special Message to the Congress on Foreign Aid](https://www.presidency.ucsb.edu/documents/special-message-the-congress-foreign-aid-1) (Mar. 22, 1961). [[w.latham-modernization-as-ideology]]. Names: Bell (K–J Adm. III.H); Fulbright, Rooney (K–J Cong. III.B, III.D).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-22.program
    when: Mar. 22
    date: '1961-03-22'
    thread: farm
    c: Emergency feed grain program signed, [75 Stat. 6](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg6-2.pdf).
    n: '[[w.cochrane-american-farm-policy-1948]]; [[w.hadwiger-pressures-and-protests]]; [[w.hansen-gaining-access]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-23.laos
    when: Mar. 23
    date: '1961-03-23'
    thread: laos
    c: Televised press conference with maps of the Pathet Lao advance. Seventh Fleet and Marines moved; SEATO consulted.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-200) (Mar. 23, 1961). [[w.rust-so-much-to-lose]]; [[w.freedman-kennedys-wars]]; [[w.hilsman-to-move-a-nation]]. [FRUS vol. 24](https://history.state.gov/historicaldocuments/frus1961-63v24). Names: Harriman (K–J Adm. III.E).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-24.program
    when: Mar. 24
    date: '1961-03-24'
    thread: jobs-and-wages
    c: 'House adopts the weaker Ayres–Kitchin minimum wage substitute, [216–203](https://voteview.com/rollcall/RH0870014), then passes the bill, [341–78](https://voteview.com/rollcall/RH0870016). The administration''s first floor defeat; restored in conference. Same day: temporary extended unemployment compensation signed.'
    n: 'CQ Almanac 1961. [75 Stat. 8](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg8.pdf) (1961). See [[cal.1961-02-02.program]]. Names: Goldberg (K–J Adm. III.G); Powell (K–J Cong. III.D).'
    tags: [name:ayres-william-h, name:kitchin-alvin-p, name:kennedy-john-f]
  - id: cal.1961-03-24.economy
    when: Mar. 24
    date: '1961-03-24'
    thread: economy
    c: 'Special message on budget and fiscal policy: the recession and the new requests turn Eisenhower''s projected surplus into a deficit.'
    n: '[Special Message to the Congress on Budget and Fiscal Policy](https://www.presidency.ucsb.edu/documents/special-message-the-congress-budget-and-fiscal-policy) (Mar. 24, 1961). [[w.stein-fiscal-revolution-in-america]]; [[w.morgan-deficit-government]].'
    tags: [name:eisenhower-dwight-d, name:kennedy-john-f]
  - id: cal.1961-03-28.defense
    when: Mar. 28
    date: '1961-03-28'
    thread: defense
    c: Defense budget message. More Polaris and Minuteman, faster; conventional and counterinsurgency forces enlarged; the B-70 cut back.
    n: '[Special Message to the Congress on the Defense Budget](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-defense-budget) (Mar. 28, 1961). [[w.ball-politics-and-force-levels]]; [[w.kaplan-wizards-of-armageddon]]. Names: McNamara, Hitch, Enthoven (K–J Adm. III.F); Vinson (K–J Cong. III.D).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-29.states-and-cities
    when: Mar. 29
    date: '1961-03-29'
    thread: states-and-cities
    c: Twenty-third Amendment ratified. Three electoral votes for the District.
    n: '[Statement by the President Following Ratification of the 23d Amendment to the Constitution](https://www.presidency.ucsb.edu/documents/statement-the-president-following-ratification-the-23d-amendment-the-constitution). [Certification of amendment, 26 Fed. Reg. 2808](https://www.govinfo.gov/content/pkg/FR-1961-04-04/pdf/FR-1961-04-04.pdf#page=42) (1961). [S.J. Res. 39, 74 Stat. 1057](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg1057.pdf) (1960). U.S. Const. amend. XXIII (K–J Cong. II.J.2). See [[cal.1960-02-02.states-and-cities]].'
  - id: cal.1961-03-29.opinion
    when: Mar. 29
    date: '1961-03-29'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Mar. 10–15: federal school aid to public schools only, 57 percent; to Catholic and other private schools as well, 36. Catholics 66 for private schools too.'
    n: '[[w.gallup-poll]], III, 1712.'
  - id: cal.1961-03-31.opinion
    when: Mar. 31
    date: '1961-03-31'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Mar. 10–15: long-term, low-interest loans to Catholic schools for buildings. 42 percent approve, 46 disapprove; Catholics 76 approve, Protestants 34.'
    n: '[[w.gallup-poll]], III, 1712.'
