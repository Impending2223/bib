  - id: cal.1960-02-01.soviet-union
    when: Feb. 1
    date: '1960-02-01'
    thread: soviet-union
    also: [testing]
    c: 'The Presidium. Khrushchev proposes offering to destroy the strategic delivery systems: "Now let''s call for cuts in an area where they think we are ahead." The dismantling of NATO, SEATO and CENTO "our most sacred dream." The press against his speech: "the journalists write about what the government thinks." Endorsed; Brezhnev for saving it for de Gaulle in March, Gromyko for waiting; no day set.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 255–56; [[w.prezidium-tsk-kpss-1954]], I, 422–35 (Protocol 262 and the stenogram). Check: the stenogram (I, 435) has Khrushchev: "Now they themselves think we are stronger, and we propose this"; the words in c are Fursenko and Naftali''s. To check: the stenogram, Feb. 1, 1960, [[w.prezidium-tsk-kpss-1954]], I (cited by [[w.fursenko-khrushchevs-cold-war]], 255 nn.46–47). See [[cal.1960-01-14.soviet-union]]. Names: Khrushchev, Brezhnev, Gromyko, de Gaulle.'
    src:
      c: bc0f037b
      rows:
        - 'w.fursenko-khrushchevs-cold-war 255–56: all'
