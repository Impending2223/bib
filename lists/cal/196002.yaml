  - id: cal.1960-02-02.states-and-cities
    when: Feb. 2
    date: '1960-02-02'
    thread: states-and-cities
    also: [voting-rights, amendments, electoral-college]
    c: 'Senate passes S.J. Res. 39, [70–18](https://voteview.com/rollcall/RS0860222): governors to fill House vacancies by temporary appointment; with Holland''s amendment barring the poll tax in federal elections, [72–16](https://voteview.com/rollcall/RS0860219), and Keating''s giving the District of Columbia electors for President, [63–25](https://voteview.com/rollcall/RS0860221).'
    n: 'S.J. Res. 39, 86th Cong., as finally passed: [74 Stat. 1057](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg1057.pdf). The Senate met at noon, the session''s standing hour, and adjourned at 6:08 p.m.: Daily Digest, [106 Cong. Rec. D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=1), [D42](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=40) (1960). To check: [[w.kyvig-explicit-and-authentic-acts]]; [[w.lawson-black-ballots]]. Names: Holland, Keating.'
    tags: [name:holland-spessard-l, name:keating-kenneth-b]
    time_range:
      - 1960-02-02T17:00Z
      - 1960-02-02T23:08Z
    time_zone: America/New_York
  - id: cal.1960-02-02.voting-rights
    when: Feb. 2
    date: '1960-02-02'
    thread: voting-rights
