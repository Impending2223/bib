# Cal. III February 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: III
entries:
  - id: cal.1960-02-01.sit-ins
    when: Feb. 1
    date: '1960-02-01'
    thread: sit-ins
    also: [civil-rights-organizations]
    c: Four freshmen of North Carolina A&T sit at the Woolworth's lunch counter in Greensboro and are not served. They return each day with more; Kress's too.
    n: 'To check: [[w.chafe-civilities-and-civil-rights]]; [[w.schmidt-sit-ins]]; [[w.morris-origins-of-the-civil]]; [[w.halberstam-children]]; [[w.carson-in-struggle]]; [[w.branch-parting-the-waters]]; [[w.lewis-walking-with-the-wind]]; [[w.meier-core]]; [[w.anderson-movement-and-the-sixties]].'
  - id: cal.1960-02-02.states-and-cities
    when: Feb. 2
    date: '1960-02-02'
    thread: states-and-cities
    also: [voting-rights, amendments, electoral-college]
    c: 'Senate passes S.J. Res. 39, [70–18](https://voteview.com/rollcall/RS0860222): governors to fill House vacancies by temporary appointment; with Holland''s amendment barring the poll tax in federal elections, [72–16](https://voteview.com/rollcall/RS0860219), and Keating''s giving the District of Columbia electors for President, [63–25](https://voteview.com/rollcall/RS0860221).'
    n: 'S.J. Res. 39, 86th Cong., as finally passed: [74 Stat. 1057](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg1057.pdf). To check: [[w.kyvig-explicit-and-authentic-acts]]; [[w.lawson-black-ballots]]. Names: Holland, Keating.'
    tags: [name:holland-spessard-l, name:keating-kenneth-b]
  - id: cal.1960-02-03.state-and-city-finance-ky
    when: Feb. 3
    date: '1960-02-03'
    thread: state-and-city-finance
    c: Kentucky. The Senate passes HB 75, the sales tax, 28–8.
    n: 'Ky. *Senate Journal*, 1960, [205](https://archive.org/details/jsencoky1960/page/205/mode/1up); enrolled and signed by the presiding officers Feb. 4, and ordered delivered to the Governor: [213](https://archive.org/details/jsencoky1960/page/213/mode/1up); Ky. *House Journal*, 1960, [241](https://archive.org/details/jhouseky1960v1/page/241/mode/1up). See [[cal.1960-01-29.state-and-city-finance-ky]].'
    tags: [state:ky]
  - id: cal.1960-02-04.school-aid
    when: Feb. 4
    date: '1960-02-04'
    thread: school-aid
    c: 'Senate passes S. 8, school construction grants, [51–34](https://voteview.com/rollcall/RS0860230). Feb. 3: an amendment for construction or teachers'' salaries fails [44–44](https://voteview.com/rollcall/RS0860225); Nixon''s vote breaks the tie on Dirksen''s motion to table reconsideration, [44–44](https://voteview.com/rollcall/RS0860226). Feb. 4: Clark''s amendment, construction or salaries for two years, carried, [54–35](https://voteview.com/rollcall/RS0860227); Morse''s loans to private schools beaten, [37–49](https://voteview.com/rollcall/RS0860228).'
    n: 'S. 8, 86th Cong. To check: [[w.munger-national-politics-and-federal]]; [[w.sundquist-politics-and-policy]]; [[w.graham-uncertain-triumph]]. Names: Nixon, Dirksen, Clark, Morse.'
    tags: [name:nixon-richard-m, name:dirksen-everett, name:clark-joseph-s, name:morse-wayne]
  - id: cal.1960-02-04.elections-1960
    when: Feb. 4
    date: '1960-02-04'
    thread: elections-1960
    c: Kennedy to enter the West Virginia primary against Humphrey.
    n: '[West Virginia Primary Announcement](https://www.jfklibrary.org/node/13481) (Feb. 4, 1960), JFK Library. To check: [[w.fleming-kennedy-vs-humphrey-west]]. See [[cal.1960-01-14.elections-1960]]. Names: Kennedy, Humphrey.'
    tags: [name:kennedy-john-f, name:humphrey-hubert-h]
  - id: cal.1960-02-04.cuba
    when: Feb. 4
    date: '1960-02-04'
    thread: cuba
    also: [soviet-union]
    c: Mikoyan in Havana, to open the Soviet exhibition.
    n: '[[w.watson-into-the-missile-age]], 763. To check: [[w.fursenko-one-hell-of-a]]; [[w.paterson-contesting-castro]]; [[w.fursenko-khrushchevs-cold-war]]. Names: Mikoyan.'
    tags: [name:mikoyan-anastas]
  - id: cal.1960-02-05.voting-rights
    when: Feb. 5
    date: '1960-02-05'
    thread: voting-rights
    c: 'Rogers to the Senate Rules Committee for the administration''s voting referees: federal courts, finding a pattern of discrimination, to appoint referees to register qualified Negroes for federal and state elections. Against the Civil Rights Commission''s registrars named by the President.'
    n: '[Testimony of Attorney General William P. Rogers before the Senate Rules and Administration Committee](https://www.justice.gov/sites/default/files/ag/legacy/2011/09/12/02-05-1960.pdf) (Feb. 5, 1960). Eisenhower on the plan: News Conference, [1960–61 Pub. Papers 125](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=177) (Jan. 26, 1960). To check: [[w.berman-bill-becomes-a-law]]; [[w.caro-master-of-the-senate]]; [[w.mann-walls-of-jericho]]; [[w.finley-delaying-the-dream]]; [[w.burk-eisenhower-administration-and-black]]; [[w.nichols-matter-of-justice]]; [[w.lawson-black-ballots]]; [[w.graham-civil-rights-era]]; [[w.wawro-filibuster]]; [[w.dallek-lone-star-rising]]. Names: Rogers.'
    tags: [name:rogers-william-p]
  - id: cal.1960-02-07.program
    when: Feb. 7
    date: '1960-02-07'
    thread: program
    c: 'The President''s Commission on National Goals named, under the American Assembly, Wriston chairman: goals for the next decade. Privately financed. Its report, *Goals for Americans*, in November.'
    n: 'Memorandum Concerning the Commission on National Goals, [1960–61 Pub. Papers 159](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=211); Letter to Dr. Henry Wriston, [1960–61 Pub. Papers 158](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=210) (released Feb. 7, 1960). Check: the American Assembly and the private funds. To check: [[w.goals-goals-for-americans]]. See [[cal.1960-01-07.program]]. Names: Eisenhower, Wriston.'
    tags: [name:eisenhower-dwight-d, name:wriston-henry-m]
  - id: cal.1960-02-08.sit-ins
    when: Feb. 8–13
    date: '1960-02-08'
    thread: sit-ins
    c: 'The sit-ins spread: Durham, Winston-Salem, Charlotte, Raleigh; Hampton; Rock Hill, S.C.; Nashville.'
    n: 'Check: the dates of the cities. See [[cal.1960-02-01.sit-ins]].'
  - id: cal.1960-02-09.farm
    when: Feb. 9
    date: '1960-02-09'
    thread: farm
    c: Farm message. $3.5 billion tied up in wheat. Wheat allotments and quotas to end with the 1961 crop, supports to follow market prices; the Conservation Reserve to 60 million acres. Any sound plan of Congress's own to be approved.
    n: 'Special Message to the Congress on Agriculture, [1960–61 Pub. Papers 162](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=214) (Feb. 9, 1960). To check: [[w.benson-cross-fire]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:benson-ezra-taft]
  - id: cal.1960-02-09.defense-soviet-forces
    when: Feb. 9
    date: '1960-02-09'
    thread: defense-soviet-forces
    c: NIE 11-8-59, Soviet Capabilities for Strategic Attack Through Mid-1964, concurred in by the Intelligence Board. 140–200 ICBMs on launcher by mid-1961; 250–350 by mid-1962; 350–450 by mid-1963. 135 heavy and 1,100 medium bombers in mid-1960. Air Force intelligence dissents, higher from mid-1962.
    n: '[FRUS 1958–60, III, doc. 88](https://history.state.gov/historicaldocuments/frus1958-60v03/d88). [[w.watson-into-the-missile-age]], 351. To check: [[w.bottome-missile-gap]]; [[w.freedman-us-intelligence-and-the]]; [[w.prados-soviet-estimate]]; [[w.roman-eisenhower-and-the-missile]]; [[w.steury-intentions-and-capabilities]]; [[w.preble-john-f-kennedy-and]]. See [[cal.1960-01-26.defense]]. Made public: FRUS 1958–60, III (1996). Check: an earlier release by the CIA.'
    tags: [name:dulles-allen-w]
  - id: cal.1960-02-11.testing
    when: Feb. 11
    date: '1960-02-11'
    thread: testing
    c: At Geneva the United States proposes a ban on tests in the atmosphere, the oceans, the parts of space that can be policed, and underground above a threshold, 4.75 on the seismic scale; smaller underground tests left to joint research. Eisenhower reads it at his press conference.
    n: 'News Conference, [1960–61 Pub. Papers 166](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=218) (Feb. 11, 1960). FRUS 1958–60, III, docs. [242](https://history.state.gov/historicaldocuments/frus1958-60v03/d242), [243](https://history.state.gov/historicaldocuments/frus1958-60v03/d243) (Feb. 2–3, the threshold and the British). Check: the threshold figure. To check: [[w.divine-blowing-on-the-wind]]; [[w.jacobson-diplomats-scientists-and-politicians]]; [[w.kistiakowsky-scientist-at-the-white]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-02-13.testing
    when: Feb. 13
    date: '1960-02-13'
    thread: testing
    also: [europe-and-the-alliance]
    c: France's first atomic test, at Reggane in the Algerian Sahara. About 70 kilotons. De Gaulle's message, "Hurrah for France!"
    n: '[FRUS 1958–60, III, microfiche supp., doc. 530](https://history.state.gov/historicaldocuments/frus1958-60v03mSupp/d530); News Conference, [1960–61 Pub. Papers 189](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=241) (Feb. 17, 1960); Herter at the National Press Club, Feb. 18, [[w.department-of-state-bulletin]], [Mar. 7, 1960, 361](https://archive.org/details/sim_department-of-state-bulletin_1960-03-07_42_1080/page/361/mode/1up). Check: the yield and the message''s words. [[w.watson-into-the-missile-age]], 577, 718. To check: [[w.kohl-french-nuclear-diplomacy]]. Names: de Gaulle.'
    tags: [name:de-gaulle-charles, name:herter-christian-a]
  - id: cal.1960-02-13.cuba
    when: Feb. 13
    date: '1960-02-13'
    thread: cuba
    also: [soviet-union]
    c: 'Soviet–Cuban trade agreement, Mikoyan in Havana: $100 million in credits; five million tons of sugar.'
    n: 'FRUS 1958–60, VI, doc. [456](https://history.state.gov/historicaldocuments/frus1958-60v06/d456). Check: the sugar''s term in years, and the agreement''s text. See [[cal.1960-02-04.cuba]]. Names: Mikoyan.'
    tags: [name:mikoyan-anastas]
  - id: cal.1960-02-15.voting-rights
    when: Feb. 15–16
    date: '1960-02-15'
    thread: voting-rights
    c: 'Johnson calls up a House bill leasing an Army post to the school district of Stella, Mo., and invites civil rights amendments; Dirksen offers the administration''s. The Southern Democrats begin talking. Feb. 16: Russell''s motion to postpone beaten, [28–61](https://voteview.com/rollcall/RS0860231); Morse''s to discharge the Judiciary Committee, [4–68](https://voteview.com/rollcall/RS0860232).'
    n: 'Check: the bill''s number (H.R. 8315). See [[cal.1960-02-05.voting-rights]]. Names: Johnson, Dirksen, Russell, Morse.'
    tags: [name:johnson-lyndon-b, name:dirksen-everett, name:russell-richard-b, name:morse-wayne]
  - id: cal.1960-02-16.foreign-aid
    when: Feb. 16–18
    date: '1960-02-16'
    thread: foreign-aid
    c: 'Mutual security message: $4.175 billion, of it $2 billion for military aid, in the defense budget. Feb. 18: the International Development Association''s articles sent up, membership asked.'
    n: 'Special Message to the Congress on the Mutual Security Program, [1960–61 Pub. Papers 177](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=229) (Feb. 16, 1960); Special Message to the Congress Recommending U.S. Participation in the International Development Association, [1960–61 Pub. Papers 199](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=251) (Feb. 18, 1960). The association proposed by S. Res. 264, 85th Cong. (1958), Monroney''s. To check: [[w.kaufman-trade-and-aid]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:monroney-almer-s]
  - id: cal.1960-02-16.alabama-al
    when: Feb. 16
    date: '1960-02-16'
    thread: alabama
    also: [state-constitutions, state-and-city-finance]
    c: Constitutional amendment election, nineteen amendments, most of them county taxes and fees. Amendment No. 1, $3,000,000 in State bonds for a mental hospital at the University of Alabama Medical Center, on the liquor and beer taxes, adopted, 131,916 to 18,021, 88.0 percent. Six county amendments refused.
    n: '[*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), 613–628](https://archive.org/details/alabama-official-statistical-register-1963/page/n612). To check: [[w.peirce-deep-south-states-of]].'
    tags: [state:al]
  - id: cal.1960-02-17.king
    when: Feb. 17
    date: '1960-02-17'
    thread: king
    c: An Alabama grand jury in Montgomery indicts King for perjury on his Alabama income tax returns for 1956 and 1958. Arrested in Atlanta, his new home; out on bond.
    n: '[[w.lewis-make-no-law]], on the advertisement for his defense. [[w.garrow-bearing-the-cross]], 129–30. To check: [[w.branch-parting-the-waters]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1960-02-17.cuba
    when: Feb. 17
    date: '1960-02-17'
    thread: cuba
    c: 'Gray brings Eisenhower a proposal before the 5412 group for an action in Cuba. Eisenhower: why so narrow; find assets for a program across the board, "even possibly things that might be drastic." Nothing to be done until the group has reviewed it and he has approved.'
    n: '[FRUS 1958–60, VI, doc. 454](https://history.state.gov/historicaldocuments/frus1958-60v06/d454) (Gray''s memorandum, Feb. 19). Made public: *Foreign Relations of the United States, 1958–1960*, vol. VI (1991). The program: [[cal.1960-03-17.cuba]]. To check: [[w.bissell-reflections-of-a-cold]]; [[w.paterson-contesting-castro]]; [[w.bohning-castro-obsession]]. Names: Eisenhower, Gray.'
    tags: [name:eisenhower-dwight-d, name:gray-gordon]
  - id: cal.1960-02-17.georgia-ga
    when: Feb. 17
    date: '1960-02-17'
    thread: georgia
    also: [desegregation-schools]
    c: 'The General Assembly Committee on Schools, created by the legislature this month, holds its first meeting at the Capitol: nineteen members, John A. Sibley, an Atlanta businessman, chairman. The choice it puts: the State''s laws, which cut off funds to a desegregated school and close it, or local option. Ten hearings in March, one in each congressional district; some 1,800 witnesses, most for the laws.'
    n: '*Atlanta Constitution*, Feb. 18, 1960 ([archive.org](https://archive.org/details/per_atlanta-constitution_1960-02-18_92_208)). Check: the resolution, Ga. Laws 1960. To check: [[w.roche-restructured-resistance]]; [[w.obrien-politics-of-race-and]]; [[w.bartley-creation-of-modern-georgia]]; [[w.kruse-white-flight]]. Names: Sibley.'
    tags: [name:sibley-john-a, state:ga]
  - id: cal.1960-02-18.cuba
    when: Feb. 18
    date: '1960-02-18'
    thread: cuba
    also: [soviet-union]
    c: 'Dulles to the NSC: the Soviet Union has taken up Castro.'
    n: '[FRUS 1958–60, VI, doc. 456](https://history.state.gov/historicaldocuments/frus1958-60v06/d456). See [[cal.1960-02-04.cuba]]. Names: Dulles, Castro.'
    tags: [name:dulles-allen-w, name:castro-fidel]
  - id: cal.1960-02-19.crime-and-hijacking-ca
    when: Feb. 19
    date: '1960-02-19'
    thread: crime-and-hijacking-chessman
    also: [states-and-cities]
    c: Brown gives Chessman, under sentence of death since 1948, a sixty-day reprieve hours before his execution at San Quentin, Cal. He will ask the Legislature, in special session, to abolish the death penalty.
    n: 'To check: [[w.hamm-rebel-and-a-cause]]; [[w.brown-public-justice-private-mercy]]; [[w.rarick-california-rising]]; [[w.banner-death-penalty]]; [[w.mandery-wild-justice]]. Names: Brown, Chessman.'
    tags: [state:ca, name:brown-edmund-g, name:chessman-caryl]
  - id: cal.1960-02-22.conservation
    when: Feb. 22
    date: '1960-02-22'
    thread: conservation
    c: Eisenhower vetoes Blatnik's bill raising grants for sewage plants from $50 million to $90 million a year. Water pollution "a uniquely local blight."
    n: 'Veto of Bill To Amend the Federal Water Pollution Control Act, [1960–61 Pub. Papers 208](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=260) (Feb. 22, 1960). H.R. 3610, 86th Cong. To check: [[w.milazzo-unlikely-environmentalists]]. Names: Eisenhower, Blatnik.'
    tags: [name:eisenhower-dwight-d, name:blatnik-john-a]
  - id: cal.1960-02-23.latin-america
    when: Feb. 23–26
    date: '1960-02-23'
    thread: latin-america-trip
    c: 'Eisenhower in South America: Brazil, Argentina, Chile, Uruguay. Brazil: the declaration with Kubitschek at Brasília, Feb. 23; the address to the Congress at Rio, Feb. 24; São Paulo, Feb. 25.'
    n: 'Radio and Television Address to the American People on the Eve of South American Trip, [1960–61 Pub. Papers 202](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=254) (Feb. 21, 1960); Joint Statement of the President and President Kubitschek of Brazil, [1960–61 Pub. Papers 212](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=264) (Feb. 23); Address Before a Joint Session of the Congress of Brazil, [1960–61 Pub. Papers 216](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=268) (Feb. 24). FRUS 1958–60, V, docs. [282](https://history.state.gov/historicaldocuments/frus1958-60v05/d282)–[287](https://history.state.gov/historicaldocuments/frus1958-60v05/d287). To check: [[w.rabe-eisenhower-and-latin-america]]; [[w.eisenhower-wine-is-bitter]]; [[w.eisenhower-white-house-years]]; [[w.mcpherson-yankee-no]]. Names: Eisenhower, Kubitschek.'
    tags: [name:eisenhower-dwight-d, name:kubitschek-juscelino]
  - id: cal.1960-02-23.court
    when: Feb. 23
    date: '1960-02-23'
    thread: court
    also: [civil-rights-organizations]
    c: '*Bates v. City of Little Rock*, [361 U.S. 516](https://tile.loc.gov/storage-services/service/ll/usrep/usrep361/usrep361516/usrep361516.pdf). Arkansas cities may not demand the NAACP''s membership lists under a license tax: freedom of association protected against the States. Convictions reversed, without dissent.'
    n: 'Check: without dissent. The Court''s 1960 decisions: [[w.schwartz-super-chief]]. To check: [[w.powe-warren-court-and-american]]; [[w.greenberg-crusaders-in-the-courts]].'
  - id: cal.1960-02-25.sit-ins
    when: Feb. 25
    date: '1960-02-25'
    thread: sit-ins
    also: [alabama]
    c: Alabama State College students sit at the snack bar of the Montgomery County courthouse. Patterson calls on the State Board of Education to expel the leaders.
    n: '*Dixon v. Alabama State Board of Education*, [294 F.2d 150](https://static.case.law/f2d/294/case-pdfs/0150-01.pdf), 152–54 (5th Cir. 1961). Check: the number of students and the date of Patterson''s demand. To check: [[w.branch-parting-the-waters]]. See [[cal.1960-02-01.sit-ins]]. Names: Patterson.'
    tags: [name:patterson-john]
  - id: cal.1960-02-25.conservation
    when: Feb. 25
    date: '1960-02-25'
    thread: conservation
    c: The House fails to override the veto of Blatnik's bill, [249–157](https://voteview.com/rollcall/RH0860092).
    n: 'H.R. 3610, 86th Cong. See [[cal.1960-02-22.conservation]]. Names: Blatnik.'
    tags: [name:blatnik-john-a]
  - id: cal.1960-02-26.latin-america-trip
    when: Feb. 26–29
    date: '1960-02-26'
    thread: latin-america-trip
    c: 'Argentina: the address to the Congress at Buenos Aires, Feb. 26; Mar del Plata; the Declaration of San Carlos de Bariloche with Frondizi, Feb. 28.'
    n: 'Address Before a Joint Session of the National Congress of Argentina, [1960–61 Pub. Papers 232](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=284) (Feb. 26, 1960); The Declaration of San Carlos de Bariloche, [1960–61 Pub. Papers 245](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=297) (Feb. 28). FRUS 1958–60, V, docs. [205](https://history.state.gov/historicaldocuments/frus1958-60v05/d205)–[214](https://history.state.gov/historicaldocuments/frus1958-60v05/d214). See [[cal.1960-02-23.latin-america]]. Names: Frondizi.'
    tags: [name:eisenhower-dwight-d, name:frondizi-arturo]
  - id: cal.1960-02-27.sit-ins
    when: Feb. 27
    date: '1960-02-27'
    thread: sit-ins
    c: Nashville. White youths beat sit-in students at the downtown counters; police arrest 81 of the students, none of the attackers. Lewis and Nash among them.
    n: 'Check: the count, and Nash. To check: [[w.halberstam-children]]; [[w.lewis-walking-with-the-wind]]. See [[cal.1960-02-01.sit-ins]]. Names: Lewis, Nash.'
    tags: [name:lewis-john, name:nash-diane]
  - id: cal.1960-02-29.latin-america-trip
    when: Feb. 29–Mar. 1
    date: '1960-02-29'
    thread: latin-america-trip
    c: 'Chile: Alessandri in Santiago, Feb. 29; the joint statement and the address to the Congress, Mar. 1.'
    n: 'Joint Statement Following Discussions With President Alessandri of Chile, [1960–61 Pub. Papers 263](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=315); Address Before a Joint Session of the National Congress of Chile, [1960–61 Pub. Papers 256](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=308) (Mar. 1, 1960). See [[cal.1960-02-23.latin-america]]. Names: Alessandri Rodriguez.'
    tags: [name:eisenhower-dwight-d, name:alessandri-rodriguez-jorge]
  - id: cal.1960-02-29.voting-rights
    when: Feb. 29
    date: '1960-02-29'
    thread: voting-rights
    c: Round-the-clock sessions begin; Johnson's motion to adjourn at 5 p.m. on Feb. 29 beaten Feb. 26, [10–67](https://voteview.com/rollcall/RS0860235). The Southern Democrats speak in relays.
    n: 'See [[cal.1960-02-15.voting-rights]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1960-02-29.court
    when: Feb. 29
    date: '1960-02-29'
    thread: court
    also: [voting-rights]
    c: '*United States v. Raines*, [362 U.S. 17](https://tile.loc.gov/storage-services/service/ll/usrep/usrep362/usrep362017/usrep362017.pdf): the Attorney General''s suits under the Civil Rights Act of 1957 upheld against Terrell County, Ga., registrars. *United States v. Thomas*, [362 U.S. 58](https://tile.loc.gov/storage-services/service/ll/usrep/usrep362/usrep362058/usrep362058.pdf): Negroes purged from the rolls of Washington Parish, La., restored.'
    n: See [[cal.1960-02-23.court]].
