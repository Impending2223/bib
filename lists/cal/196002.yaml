    n: '[[w.mann-walls-of-jericho]], 250. To check: Siegel to Johnson, Feb. 2, 1960, Papers of the Democratic Leader, box 374, LBJ Library (cited by [[w.mann-walls-of-jericho]], 250). Names: Russell, Johnson.'
