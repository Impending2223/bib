    date: '1960-02-04'
    thread: school-aid
    c: 'Senate passes S. 8, school construction grants, [51–34](https://voteview.com/rollcall/RS0860230). Feb. 3: an amendment for construction or teachers'' salaries fails [44–44](https://voteview.com/rollcall/RS0860225); Nixon''s vote breaks the tie on Dirksen''s motion to table reconsideration, [44–44](https://voteview.com/rollcall/RS0860226). Feb. 4: Clark''s amendment, construction or salaries for two years, carried, [54–35](https://voteview.com/rollcall/RS0860227); Morse''s loans to private schools beaten, [37–49](https://voteview.com/rollcall/RS0860228).'
    n: 'S. 8, 86th Congress. [[w.sundquist-politics-and-policy]], 184–85, 189 n.115 (the votes of Feb. 3 and 4, Nixon''s against the amendment; Morse''s loans, 189 n.115); [[w.graham-uncertain-triumph]], 6, 17 (S. 8 passed, 51 to 34, 17; Nixon''s vote breaking the tie, 6). Check: Graham, 6, dates the tie vote Feb. 2; Voteview, Feb. 3. To check: [[w.munger-national-politics-and-federal]]. Names: Nixon, Dirksen, Clark, Morse.'
