    c: 'Lunch in the Mansion, four hours, with three reporters, of the *New York Times*, the *Herald Tribune* and the *Washington Post*: Johnson acts out his meeting with Robert Kennedy of July 29. At their next meeting Kennedy charges a breach of confidence; Johnson denies talking to the reporters.'
    n: '[[w.dallek-flawed-giant]], 142; [[w.young-two-suns-of-the]], 127 (the reporters; Kennedy''s anger; Johnson''s denial); [[w.schlesinger-robert-kennedy-and-his]], 662 (the three reporters; the mimicry; Kennedy''s protest and Johnson''s denial, by Kennedy''s memorandum). To check: Robert Kennedy, memorandum dictated Aug. 4–6, 1964, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 662 n.84). See [[cal.1964-07-29.robert-kennedy]]. Names: Johnson, Robert Kennedy.'
