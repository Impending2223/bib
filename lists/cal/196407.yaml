  - id: cal.1964-07-11.civil-rights-the-executive
    when: July 11
    date: '1964-07-11'
    thread: civil-rights-the-executive
    also: [states-and-cities, georgia]
    c: 'Madison County, in the early morning. Lemuel Penn, 48, a lieutenant colonel of the Army Reserve and assistant superintendent of the District of Columbia''s schools, driving home from training at Fort Benning with two other Negro reserve officers, shot dead from a passing car on the Broad River bridge near Colbert. 12:27 p.m., Sanders to Johnson: the State''s inquiry; a federal one perhaps needed. The FBI takes the case. Sanders: "ashamed."'
    n: '[Johnson and Sanders, 12:27 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-sanders-july-11-1964), Conversation WH6407-07-4216 (Miller Center). *New Georgia Encyclopedia*, ["Lemuel Penn Murder"](https://www.georgiaencyclopedia.org/articles/history-archaeology/lemuel-penn-murder/). *United States v. Guest*, [383 U.S. 745](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383745/usrep383745.pdf) (1966) (K–J Adm. II.H.1). Made public: the recording, opened by the LBJ Library. Check the year. To check: [[w.shipp-murder-at-broad-river]]. Names: Penn, Sanders, Johnson.'
    tags: [name:penn-lemuel-a, name:sanders-carl-e, name:johnson-lyndon-b]
