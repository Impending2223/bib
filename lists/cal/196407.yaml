    date: '1964-07-11'
    thread: elections-1964
    also: [press-and-broadcasting]
    c: 'CBS, the evening news. Schorr from Munich: Goldwater, nominated, to go to Germany, to the right wing there. Goldwater: Schorr should not be allowed to broadcast.'
