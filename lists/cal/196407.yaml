    when: July 10
    date: '1964-07-10'
    thread: mississippi
    c: Hoover in Jackson to reopen the FBI's field office there, closed since 1946. He calls on Governor Paul Johnson.
    n: 'News Conference, [1963–64 Pub. Papers 851](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=91) (July 10, 1964). [[w.dittmer-local-people]], 250–51 (the office opened July 10; Hoover with the governor). To check: [[w.mcadam-freedom-summer]]; [[w.branch-pillar-of-fire]]; Hoover to Walter Jenkins, July 13, 1964, LBJ Library; *New York Times*, July 11, 1964 (cited by [[w.dittmer-local-people]], 251 n.17); Paul B. Johnson, oral history interview, LBJ Library, 30–31 (cited by [[w.dittmer-local-people]], 251 n.18). See [[cal.1964-06-21.mississippi]]. Names: Hoover, Paul Johnson. Check: the office closed since 1946.'
