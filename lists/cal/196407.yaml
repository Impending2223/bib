  - id: cal.1964-07.elections-1964
    when: July
    date: 1964-07
    thread: elections-1964
    also: [robert-kennedy, democratic-party]
    c: 'Hickory Hill, at night. Robert Kennedy to Edward Kennedy, O''Donnell, O''Brien, Dutton and Stephen Smith: with Goldwater the nominee, he will forget the Vice Presidency, leave the Cabinet and run for the Senate in New York. Edward Kennedy and Smith for moving at once; O''Donnell for waiting, to keep the pressure on Johnson to take Humphrey. Kennedy agrees to wait. By O''Donnell''s account.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 658. To check: [[w.odonnell-johnny-we-hardly-knew]], 396–97 (cited by [[w.schlesinger-robert-kennedy-and-his]], 658 n.71). Check: the day (after July 15, before July 29). Names: Robert Kennedy, Edward Kennedy, O''Donnell, O''Brien, Dutton, Stephen Smith, Goldwater, Johnson, Humphrey.'
    src:
      c: 6c545fb6
      rows:
