# Cal. LVI July 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LVI
entries:
  - id: cal.1964-07-01.opinion
    when: July 1
    date: '1964-07-01'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, June 11–16: Johnson 77, Goldwater 18; Johnson 70, Nixon 27; Johnson 69, Scranton 26. Undecided 5, 3, 5.'
    n: '[[w.gallup-poll]], III, 1890–91. Names: Johnson, Goldwater, Nixon, Scranton.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m, name:nixon-richard-m, name:scranton-william-w]
  - id: cal.1964-07-02.civil-rights-bill
    when: July 2
    date: '1964-07-02'
    thread: civil-rights-bill
    c: 'House accepts the Senate''s bill, [289–126](https://voteview.com/rollcall/RH0880182). Civil Rights Act signed that evening in the East Room, [78 Stat. 241](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg241.pdf), on television: "Let us close the springs of racial poison." Collins to be named director of the Community Relations Service.'
    n: 'Statute (K–J Cong. II.J.2). [110 Cong. Rec., House, July 2, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-4-2.pdf). Radio and Television Remarks Upon Signing the Civil Rights Bill, [1963–64 Pub. Papers 842](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=82) (July 2, 1964). [President''s Daily Diary, July 2, 1964](https://catalog.archives.gov/id/192443), images 4, 7, 8 (LBJ Library; National Archives Catalog). To check: [[w.kotz-judgment-days]]. See [[cal.1964-02-10.civil-rights-bill]]; [[cal.1964-06-10.civil-rights-bill]]. Names: Johnson, Collins.'
    tags: [name:johnson-lyndon-b, name:collins-leroy, bill:civil-rights-1964]
  - id: cal.1964-07-02.robert-kennedy
    when: July 2
    date: '1964-07-02'
    thread: robert-kennedy
    c: 'Robert Kennedy and Johnson by telephone: Kennedy misquoted in *Newsweek*; Johnson on the press''s efforts to divide them.'
    n: '[Johnson and Robert Kennedy, 11:19 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-2-1964), Tape WH6407.01, Citation #4117 (Miller Center). [President''s Daily Diary, July 2, 1964](https://catalog.archives.gov/id/192443), image 1 (LBJ Library; National Archives Catalog). See [[cal.1964-06-26.robert-kennedy]]. Names: Robert Kennedy, Johnson.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1964-07-03.civil-rights-bill
    when: July 3
    date: '1964-07-03'
    thread: civil-rights-bill
    also: [desegregation-public-places, georgia]
    c: Title II tested in Atlanta. Maddox, pistol in hand, turns three Negro divinity students away from his Pickrick restaurant. July 22, a three-judge court, Tuttle presiding, upholds the title against the Heart of Atlanta Motel's suit and enjoins the motel and, on the students' suit, Maddox.
    n: '*Heart of Atlanta Motel, Inc. v. United States*, [231 F. Supp. 393](https://static.case.law/f-supp/231/case-pdfs/0393-01.pdf) (N.D. Ga. 1964); *Willis v. Pickrick Restaurant*, [231 F. Supp. 396](https://static.case.law/f-supp/231/case-pdfs/0396-01.pdf) (N.D. Ga. 1964). *Heart of Atlanta Motel, Inc. v. United States* (K–J Cong. II.J.1). To check: [[w.landsberg-enforcing-civil-rights]]; [[w.graham-civil-rights-era]]. See [[cal.1964-07-02.civil-rights-bill]]. Names: Maddox, Tuttle.'
    tags: [name:maddox-lester, name:tuttle-elbert-p]
  - id: cal.1964-07-04.alabama
    when: July 4
    date: '1964-07-04'
    thread: voting-rights-selma
    also: [alabama, desegregation-public-places]
    c: Selma tests the Civil Rights Act. Four students arrested at the Thirsty Boy drive-in, Sheriff Clark using a cattle prod; Black teenagers made to leave the Wilby Theatre, which Clark closes.
    n: '*United States v. Clark*, [249 F. Supp. 720](https://static.case.law/f-supp/249/case-pdfs/0720-01.pdf) (S.D. Ala. 1965) (the findings). To check: [[w.garrow-protest-at-selma]]; [[w.carson-in-struggle]]; [[w.lewis-walking-with-the-wind]]. See [[cal.1964-03-19.voting-rights]]; [[cal.1964-07-03.civil-rights-bill]]. Names: James Clark.'
    tags: [name:clark-james-g-jr]
  - id: cal.1964-07-04.middle-east
    when: July 4
    date: '1964-07-04'
    thread: middle-east
    c: 'Tehran. Holmes and the Minister of Court sign the memorandum of understanding on arms: $200 million in credit, $50 million in cash, for the modernization of Iran''s forces. The Shah: the most to be spent on present revenues; free to ask for more if revenues rise.'
    n: '[FRUS 1964–68, XXII, doc. 49](https://history.state.gov/historicaldocuments/frus1964-68v22/d49). To check: [[w.mcglinchey-us-arms-policies-towards]]. See [[cal.1964-06-05.middle-east]]. Names: Holmes, Pahlavi.'
    tags: [name:holmes-julius-c, name:pahlavi-mohammed-reza]
  - id: cal.1964-07-05.voting-rights-selma
    when: July 5
    date: '1964-07-05'
    thread: voting-rights-selma
    also: [alabama]
    c: Selma. Sheriff Clark's possemen club and gas the crowd leaving a mass meeting.
    n: '*United States v. Clark*, [249 F. Supp. 720](https://static.case.law/f-supp/249/case-pdfs/0720-01.pdf) (S.D. Ala. 1965) (the findings). See [[cal.1964-07-04.alabama]]. Names: James Clark.'
    tags: [name:clark-james-g-jr]
  - id: cal.1964-07-06.desegregation-schools
    when: July 6
    date: '1964-07-06'
    thread: desegregation-schools
    also: [mississippi]
    c: Jackson. Mize, in the city's school case, finds that differences between Negro and white pupils justify separate schools; bound by the Fifth Circuit's Savannah opinion, he makes his injunction permanent, the first grade open to all this fall, his order "contrary to the facts and the law," and asks that *Brown* be reconsidered. The first-named plaintiff, Darrell Kenyatta Evers, Medgar Evers's son. Biloxi and Leake County, Miss., under like orders. Biloxi's first grades open so Aug. 31, the first public schools desegregated in Mississippi; Leake County and Jackson that week. Check the dates.
    n: '*Evers v. Jackson Municipal Separate School District*, [232 F. Supp. 241](https://static.case.law/f-supp/232/case-pdfs/0241-01.pdf) (S.D. Miss. 1964); *Evers v. Jackson Municipal Separate School District*, [328 F.2d 408](https://static.case.law/f2d/328/case-pdfs/0408-01.pdf) (5th Cir. 1964), with the Biloxi and Leake County cases. [[w.dittmer-local-people]], 228, 256–57. To check: [[w.bass-unlikely-heroes]]. See [[cal.1964-06-18.desegregation-schools]]. Names: Mize, Evers.'
    tags: [name:mize-sidney-c, name:evers-medgar]
  - id: cal.1964-07-06.voting-rights-selma
    when: July 6
    date: '1964-07-06'
    thread: voting-rights-selma
    also: [alabama]
    c: Selma. 53 arrested at the courthouse, where pickets urged registration.
    n: '*United States v. Clark*, [249 F. Supp. 720](https://static.case.law/f-supp/249/case-pdfs/0720-01.pdf) (S.D. Ala. 1965) (the findings). See [[cal.1964-07-04.alabama]].'
  - id: cal.1964-07-06.mississippi
    when: July 6
    date: '1964-07-06'
    thread: mississippi
    c: McComb. Representative Don Edwards, whose son is a summer volunteer, spends the night at the Freedom House opened the day before; to the Justice Department official who urges him to leave, that if the Department fears violence it should protect the workers.
    n: '[[w.dittmer-local-people]], 267. The bombing of the house two nights later: Dittmer, 267. See [[cal.1964-06-14.mississippi]]. Names: Edwards.'
    tags: [state:ms, name:edwards-william-d]
  - id: cal.1964-07-06.vietnam
    when: July 6
    date: '1964-07-06'
    thread: vietnam
    c: Hanoi puts its navy on a war footing, against the American destroyers' patrols in the Gulf of Tonkin. By the end of July all its armed forces on alert.
    n: '[[w.asselin-hanois-road-to-the]], 189–90 (the day from the Defense Ministry''s *Lịch sử quân sự Việt Nam*, vol. 11, 172: 189 n.115).'
    tags: [place:hanoi]
  - id: cal.1964-07-07.europe-and-the-alliance
    when: July 7
    date: '1964-07-07'
    thread: cyprus
    c: 'Cyprus. The NSC. Ball: a "time bomb" that could go off in the next six weeks; 4,000 Greek troops sent to the island. Acheson at Geneva, mediating apart with Greeks and Turks.'
    n: '[FRUS 1964–68, XVI, doc. 82](https://history.state.gov/historicaldocuments/frus1964-68v16/d82). To check: [[w.ball-past-has-another-pattern]]; [[w.brinkley-dean-acheson]]; [[w.nicolet-united-states-policy-towards]]; [[w.miller-united-states-and-the]]. See [[cal.1963-12-21.europe-and-the-alliance]]. Names: Ball, Acheson.'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:acheson-dean-g]
  - id: cal.1964-07-09.cities-and-housing
    when: July 9
    date: '1964-07-09'
    thread: cities-and-housing
    also: [transportation]
    c: Urban Mass Transportation Act signed, [78 Stat. 302](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg302-2.pdf). $375 million over three years in grants for transit equipment and facilities, two-thirds federal where the area has a plan. The House passed it June 25, [212–189](https://voteview.com/rollcall/RH0880178); the Senate agreed June 30, [47–36](https://voteview.com/rollcall/RS0880427).
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing the Urban Mass Transportation Act, [1963–64 Pub. Papers 849](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=89) (July 9, 1964). To check: [[w.smerk-urban-transportation]]; [[w.gelfand-nation-of-cities]]; [[w.sundquist-politics-and-policy]]. See [[cal.1963-04-04.program]]. Names: Johnson, Sparkman.'
    tags: [name:johnson-lyndon-b, name:sparkman-john, name:rains-albert-m, name:williams-harrison-a-jr, name:widnall-william-b]
  - id: cal.1964-07-09.civil-rights-bill
    when: July 9
    date: '1964-07-09'
    thread: civil-rights-bill
    also: [confirmations]
    c: Commerce Committee, on Collins's nomination to the Community Relations Service. Thurmond, at the door to keep late Senators from making a quorum, wrestles Yarborough to the floor; Magnuson parts them. The committee reports the nomination, 16–1.
    n: 'Senate Historical Office, ["Pinned"](https://www.senate.gov/artandhistory/history/minute/pinned.htm). To check: [[w.wagy-governor-leroy-collins-of]]; [[w.crespino-strom-thurmonds-america]]. See [[cal.1964-07-02.civil-rights-bill]]. Names: Thurmond, Yarborough, Magnuson, Collins.'
    tags: [name:thurmond-strom, name:yarborough-ralph, name:magnuson-warren-g, name:collins-leroy]
  - id: cal.1964-07-09.voting-rights-selma
    when: July 9
    date: '1964-07-09'
    thread: voting-rights-selma
    also: [alabama]
    c: Selma. Circuit Judge Hare enjoins gatherings of three or more in public, naming some 47 persons and 15 organizations, the Klan among them.
    n: '*United States v. Clark*, [249 F. Supp. 720](https://static.case.law/f-supp/249/case-pdfs/0720-01.pdf) (S.D. Ala. 1965) (the findings). See [[cal.1964-07-04.alabama]]. Names: Hare.'
    tags: [name:hare-james-a]
  - id: cal.1964-07-10.congo
    when: July 10
    date: '1964-07-10'
    thread: congo
    c: 'Tshombe, back from exile in Spain, prime minister of the Congo: Kasavubu names him to form a transitional government; the cabinet announced July 10. Adoula out; the last UN troops gone June 30. Rebels in Kwilu and the east. Check the dates.'
    n: 'FRUS 1964–68, XXIII, docs. [188](https://history.state.gov/historicaldocuments/frus1964-68v23/d188), [189](https://history.state.gov/historicaldocuments/frus1964-68v23/d189). To check: [[w.weissman-american-foreign-policy-in]]; [[w.namikas-battleground-africa]]; [[w.gleijeses-conflicting-missions]]. See [[cal.1963-01-14.congo]]. Names: Tshombe, Kasavubu, Adoula.'
    tags: [name:tshombe-moise, name:kasavubu-joseph, name:adoula-cyrille]
  - id: cal.1964-07-10.mississippi
    when: July 10
    date: '1964-07-10'
    thread: mississippi
    c: Hoover in Jackson to reopen the FBI's field office there, closed since 1946. He calls on Governor Paul Johnson.
    n: 'News Conference, [1963–64 Pub. Papers 851](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=91) (July 10, 1964). [[w.dittmer-local-people]], 250–51. To check: [[w.mcadam-freedom-summer]]; [[w.branch-pillar-of-fire]]. See [[cal.1964-06-21.mississippi]]. Names: Hoover, Paul Johnson.'
    tags: [name:hoover-j-edgar, name:johnson-paul-b-jr]
  - id: cal.1964-07-11.civil-rights-the-executive
    when: July 11
    date: '1964-07-11'
    thread: civil-rights-the-executive
    also: [states-and-cities, georgia]
    c: 'Madison County, in the early morning. Lemuel Penn, 48, a lieutenant colonel of the Army Reserve and assistant superintendent of the District of Columbia''s schools, driving home from training at Fort Benning with two other Negro reserve officers, shot dead from a passing car on the Broad River bridge near Colbert. 12:27 p.m., Sanders to Johnson: the State''s inquiry; a federal one perhaps needed. The FBI takes the case. Sanders: "ashamed."'
    n: '[Johnson and Sanders, 12:27 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-sanders-july-11-1964), Conversation WH6407-07-4216 (Miller Center). *New Georgia Encyclopedia*, ["Lemuel Penn Murder"](https://www.georgiaencyclopedia.org/articles/history-archaeology/lemuel-penn-murder/). *United States v. Guest*, [383 U.S. 745](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383745/usrep383745.pdf) (1966) (K–J Adm. II.H.1). Made public: the recording, opened by the LBJ Library. Check the year. To check: [[w.shipp-murder-at-broad-river]]. Names: Penn, Sanders, Johnson.'
    tags: [name:penn-lemuel-a, name:sanders-carl-e, name:johnson-lyndon-b]
  - id: cal.1964-07-12.elections-1964
    when: July 12
    date: '1964-07-12'
    thread: elections-1964
    also: [goldwater]
    c: 'Scranton''s letter to Goldwater, the day before the convention: "Goldwaterism" has come to stand for "a whole crazy-quilt collection of absurd and dangerous positions." Goldwater sends it to every delegate.'
    n: '[[w.perlstein-before-the-storm]], 377–78. To check: [[w.white-making-of-the-president-1965]]; [[w.wolf-william-warren-scranton]]. See [[cal.1964-06-02.elections-1964]]. Names: Scranton, Goldwater.'
    tags: [name:scranton-william-w, name:goldwater-barry-m]
  - id: cal.1964-07-12.mississippi
    when: July 12
    date: '1964-07-12'
    thread: mississippi
    c: 'Near Tallulah, La., a fisherman finds the lower half of a man''s body in a backwater of the Mississippi; another the next day: Henry Dee and Charles Moore, a student at Alcorn, neither in the movement, abducted by Klansmen May 2, beaten to death in the Homochitto National Forest and sunk in the river.'
    n: '[[w.dittmer-local-people]], 251. The arrest of two white men by the FBI, four months later, and the State''s refusal to prosecute: Dittmer, 251. See [[cal.1964-06-21.mississippi]]. Names: Dee, Moore.'
    tags: [state:ms, state:la, name:dee-henry, name:moore-charles]
  - id: cal.1964-07-12.goldwater
    when: July 12
    date: '1964-07-12'
    thread: goldwater
    also: [elections-1964]
    c: 'San Francisco, the Mark Hopkins. Martin, sent by Wallace the day before, puts Wallace''s offer to Goldwater: Wallace for Vice President on the Republican ticket. Goldwater does not consider it.'
    n: '[[w.perlstein-before-the-storm]], 376–77. To check: [[w.carter-politics-of-rage-1995]]. See [[cal.1964-07-13.elections-1964]]. Names: Martin, Wallace, Goldwater.'
    tags: [name:martin-james-d, name:wallace-george-c, name:goldwater-barry-m]
  - id: cal.1964-07-13.elections-1964
    when: July 13
    date: '1964-07-13'
    thread: elections-1964
    c: 'Republican National Convention opens, the Cow Palace, outside San Francisco. The party''s primaries: map and returns below.'
    n: 'CQ Guide 6th (2010) 406–408. [Republican Party Platform of 1964](https://www.presidency.ucsb.edu/documents/republican-party-platform-1964) (July 13, 1964). [[w.perlstein-before-the-storm]], 379–80. To check: [[w.making-of-the-president]]; [[w.rovere-goldwater-caper]]; [[w.white-making-of-the-president-1965]]; [[w.novak-agony-of-the-g]]; [[w.kabaservice-rule-and-ruin]]; [[w.shadegg-what-happened-to-goldwater]]; [[w.white-suite-3505]]; [[w.kessel-goldwater-coalition]]; [[w.middendorf-glorious-disaster]]; [[w.smith-on-his-own-terms]]; [[w.wolf-william-warren-scranton]]; [[w.goldwater-with-no-apologies]]. See [[cal.1964-03-10.elections-1964]].'
    tags: [primaries:1964-R]
  - id: cal.1964-07-13.opinion
    when: July 13
    date: '1964-07-13'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, June 25–30: Johnson 77, Goldwater 20, undecided 3; the South, Johnson 63, Goldwater 32. With Wallace the candidate of a third party: Johnson 75, Goldwater 16, Wallace 5; the South, Johnson 56, Goldwater 20, Wallace 18.'
    n: '[[w.gallup-poll]], III, 1893. Names: Johnson, Goldwater, Wallace.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m, name:wallace-george-c]
  - id: cal.1964-07-13.alabama
    when: July 13
    date: '1964-07-13'
    thread: alabama-schools
    also: [desegregation-schools]
    c: '*Lee v. Macon County Board of Education*. A three-judge court, Judge Johnson sitting, enjoins Wallace as president of the State Board of Education, the board and the State superintendent from interfering with any school board in Alabama desegregating under a federal court''s order. No tuition grants for any school limited by race. No statewide order "at this time"; State money for segregated schools to stop within a reasonable time. Macon County to extend its plan for September; Macon Academy made a defendant.'
    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/case-pdfs/0743-01.pdf) (M.D. Ala. 1964). Opinion (K–J Cong. II.J.1). To check: [[w.bass-taming-the-storm]]; [[w.bass-unlikely-heroes]]. See [[cal.1964-02-03.alabama]]. Names: Wallace, Frank Johnson.'
    tags: [name:wallace-george-c, name:johnson-frank-m-jr]
  - id: cal.1964-07-14.elections-1964
    when: July 14
    date: '1964-07-14'
    thread: elections-1964
    also: [right-and-the-military]
    c: 'The platform fight. Scranton''s amendments rejected: civil rights, 897–409 (Check); extremism, naming the Birch Society; civilian control of nuclear weapons. Rockefeller, speaking for the extremism amendment, booed and shouted down from the floor and galleries. Eisenhower, the same day, against "sensation-seeking columnists and commentators."'
    n: '[Republican Party Platform of 1964](https://www.presidency.ucsb.edu/documents/republican-party-platform-1964) (July 13, 1964). [[w.perlstein-before-the-storm]], 381–84 (the platform fight, the vote, Rockefeller). See [[cal.1964-07-13.elections-1964]]. Names: Scranton, Rockefeller, Eisenhower.'
    tags: [name:scranton-william-w, name:rockefeller-nelson, name:eisenhower-dwight-d]
  - id: cal.1964-07-14.opinion
    when: July 14
    date: '1964-07-14'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, June 25–30: Republicans'' choice for 1964: Goldwater 22, Nixon 22, Lodge 21, Scranton 20, Rockefeller 6; undecided, others 9. Independents: Lodge 22, Goldwater 19, Scranton 16, Nixon 15, Rockefeller 11.'
    n: '[[w.gallup-poll]], III, 1894. Names: Goldwater, Nixon, Lodge, Scranton, Rockefeller.'
    tags: [name:goldwater-barry-m, name:nixon-richard-m, name:lodge-henry-cabot, name:scranton-william-w, name:rockefeller-nelson]
  - id: cal.1964-07-14.europe-and-the-alliance-cyprus
    when: July 14–15
    date: '1964-07-14'
    thread: cyprus
    c: 'Cyprus. Acheson''s plan, at Geneva: union with Greece, rights for the Turkish minority under international supervision, a Turkish sovereign base area on the island.'
    n: '[FRUS 1964–68, XVI, doc. 86](https://history.state.gov/historicaldocuments/frus1964-68v16/d86). See [[cal.1964-07-07.europe-and-the-alliance]]. Names: Acheson.'
    tags: [name:acheson-dean-g]
  - id: cal.1964-07-15.elections-1964
    when: July 15–16
    date: '1964-07-15'
    thread: elections-1964
    also: [goldwater]
    c: 'Goldwater nominated on the first ballot: 883 of 1,308; Scranton 214, Rockefeller 114, Romney 41, Margaret Chase Smith 27, Judd 22. July 16, Miller for Vice President. The acceptance: "extremism in the defense of liberty is no vice," "moderation in the pursuit of justice is no virtue."'
    n: '[Address Accepting the Presidential Nomination at the Republican National Convention in San Francisco](https://www.presidency.ucsb.edu/documents/address-accepting-the-presidential-nomination-the-republican-national-convention-san) (July 16, 1964). [[w.perlstein-before-the-storm]], 387–91 (the nomination, Miller, the acceptance). To check: [[w.hess-in-a-cause-that]]. See [[cal.1964-07-13.elections-1964]]. Names: Goldwater, Scranton, Rockefeller, Romney, Smith, Judd, Miller.'
    tags: [name:goldwater-barry-m, name:scranton-william-w, name:rockefeller-nelson, name:romney-george-w, name:smith-margaret-chase, name:judd-walter-h, name:miller-william-e]
  - id: cal.1964-07-15.european-community
    when: July 15
    date: '1964-07-15'
    thread: european-community
    c: 'Luxembourg. The Court of Justice, Costa v. ENEL, on a reference from a Milan magistrate over a bill of 1,925 lire from Italy''s nationalized electricity: the EEC Treaty "has created its own legal system," part of the member states'' own; law from the Treaty cannot be overridden by later national law.'
    n: '[Case 6/64, Costa v. E.N.E.L., 1964 E.C.R. 585](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:61964CJ0006). See [[cal.1963-02-05.european-community]].'
  - id: cal.1964-07-17.legislatures-ne
    when: July 17
    date: '1964-07-17'
    thread: legislatures
    c: Nebraska. A three-judge federal court holds the apportionment of the unicameral, with its factor for area, unconstitutional; the 1965 legislature to reapportion it, between 30 and 50 members, before the 1966 elections.
    n: '*League of Nebraska Municipalities v. Marsh*, [232 F. Supp. 411](https://static.case.law/f-supp/232/case-pdfs/0411-01.pdf) (D. Neb. 1964); [209 F. Supp. 189](https://static.case.law/f-supp/209/case-pdfs/0189-01.pdf) (D. Neb. 1962). To check: [[w.dixon-democratic-representation]]. See [[cal.1962-11-06.state-constitutions-ne]]; [[cal.1964-06-15.court]].'
    tags: [state:ne]
  - id: cal.1964-07-18.states-and-cities
    when: July 18–22
    date: '1964-07-18'
    thread: states-and-cities
    c: Harlem. Lieutenant Gilligan, off duty, had shot James Powell, fifteen, July 16. After a CORE rally, crowds at the 28th Precinct; four nights of rioting in Harlem and, from July 20, Bedford-Stuyvesant. One dead.
    n: 'Statement by the President on the Riots in New York City, [1963–64 Pub. Papers 876](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=116) (July 21, 1964). To check: [[w.flamm-law-and-order]]. See [[cal.1963-11-05.states-and-cities]]. Names: Gilligan, Powell.'
    tags: [name:gilligan-thomas, name:powell-james]
  - id: cal.1964-07-19.elections-1964
    when: July 19
    date: '1964-07-19'
    thread: elections-1964
    also: [alabama]
    c: Wallace, on CBS's *Face the Nation*, withdraws as a candidate for President, four days after Goldwater's nomination. Check.
    n: 'To check: [[w.carter-politics-of-rage-1995]]. See [[cal.1964-03-06.elections-1964]]; [[cal.1964-07-15.elections-1964]]. The program, CBS, July 19, 1964, Wallace the guest: [[w.face-the-nation-1954]]. Names: Wallace, Goldwater.'
    tags: [name:wallace-george-c, name:goldwater-barry-m]
  - id: cal.1964-07-20.civil-rights-bill
    when: July 20
    date: '1964-07-20'
    thread: civil-rights-bill
    also: [confirmations]
    c: Senate confirms LeRoy Collins, former governor of Florida, as director of the Community Relations Service under Title X, [53–8](https://voteview.com/rollcall/RS0880441).
    n: '[110 Cong. Rec., Senate, July 20, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-9-2.pdf). To check: [[w.wagy-governor-leroy-collins-of]]. See [[cal.1964-07-02.civil-rights-bill]]. Names: Collins.'
    tags: [name:collins-leroy]
  - id: cal.1964-07-21.robert-kennedy
    when: July 21
    date: '1964-07-21'
    thread: robert-kennedy
    also: [states-and-cities, mississippi]
    c: 'Johnson and Robert Kennedy, five calls. Noon: protection for King, to speak in Greenwood, Miss.; Hoover and the Justice Department; the Harlem riots and an FBI inquiry, Johnson reading his statement. 1 p.m.: whether Hoover himself should go to New York; Kennedy doubts it, New York more like the Georgia killing than Mississippi. Evening: two lawyers of the Lawyers'' Committee for Civil Rights missing in Mississippi, seen at 8:25, found by 9:31; Goldwater''s request to see Johnson.'
    n: '[Johnson and Robert Kennedy, 12:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-21-1964), Conversation WH6407-11-4288 (Miller Center); [1:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-21-1964-0), Conversation WH6407-11-4294 (Miller Center); [8:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-22-1964), Conversation WH6407-12-4299 (Miller Center); [8:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-22-1964-0), Conversation WH6407-12-4300 (Miller Center); [9:31 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-22-1964-1), Conversation WH6407-12-4303 (Miller Center). Statement by the President on the Riots in New York City, [1963–64 Pub. Papers 876](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=116) (July 21, 1964). To check: [[w.taking-charge-2001]]; [[w.shesol-mutual-contempt]]. See [[cal.1964-07-18.states-and-cities]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Johnson, Robert Kennedy, Martin Luther King, Hoover, Goldwater.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:king-martin-luther-jr, name:hoover-j-edgar, name:goldwater-barry-m]
  - id: cal.1964-07-21.europe-and-the-alliance-cyprus
    when: July 21
    date: '1964-07-21'
    thread: cyprus
    c: 'Cyprus. Papandreou''s answer to Acheson: Kastellorizo as a base, no Turkish sovereign area on Cyprus.'
    n: '[FRUS 1964–68, XVI, doc. 89](https://history.state.gov/historicaldocuments/frus1964-68v16/d89). See [[cal.1964-07-07.europe-and-the-alliance]]. Names: Papandreou, Acheson.'
    tags: [name:papandreou-george, name:acheson-dean-g]
  - id: cal.1964-07-21.states-and-cities
    when: July 21
    date: '1964-07-21'
    thread: states-and-cities
    c: 'Johnson on the riots in New York: "no compromise" on law and order; the FBI to investigate.'
    n: 'Statement by the President on the Riots in New York City, [1963–64 Pub. Papers 876](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=116) (July 21, 1964). See [[cal.1964-07-18.states-and-cities]]. Names: Johnson, Hoover.'
    tags: [name:johnson-lyndon-b, name:hoover-j-edgar]
  - id: cal.1964-07-22.amendments
    when: July 22
    date: '1964-07-22'
    thread: amendments
    also: [court, legislatures, congress]
    c: House Judiciary's Subcommittee No. 5, Celler's, opens hearings on amendments to let one house of a State legislature be apportioned on a basis other than population, after *Reynolds v. Sims*. Eight days, to Aug. 13; resumed Apr. 7, 1965.
    n: 'Celler, [111 Cong. Rec. 3905](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-9-1.pdf) (1965). To check: [[w.dixon-democratic-representation]]; [[w.bonfield-dirksen-amendment-and-the]]. See [[cal.1964-06-15.court]]. Names: Celler.'
    tags: [name:celler-emanuel]
  - id: cal.1964-07-23.poverty
    when: July 23
    date: '1964-07-23'
    thread: poverty
    c: Senate passes the Economic Opportunity bill, [61–34](https://voteview.com/rollcall/RS0880452). Prouty's amendment for a governor's approval of community action, carried [45–44](https://voteview.com/rollcall/RS0880443), is reconsidered and lost, [45–46](https://voteview.com/rollcall/RS0880446); Smathers's, a governor's veto of contracts with private agencies, taken, [80–7](https://voteview.com/rollcall/RS0880447).
    n: '[110 Cong. Rec., Senate, July 23, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-2-1.pdf). See [[cal.1964-03-16.poverty]]. Names: Prouty, Smathers.'
    tags: [name:prouty-winston-l, name:smathers-george-a]
  - id: cal.1964-07-24.baker
    when: July 24
    date: '1964-07-24'
    thread: baker
    also: [congress]
    c: 'Senate sets up a Select Committee on Standards and Conduct, six members, three of each party: Cooper''s substitute, [50–33](https://voteview.com/rollcall/RS0880456); the resolution, [61–19](https://voteview.com/rollcall/RS0880457). July 27, disclosure of Senators'' finances refused, [25–62](https://voteview.com/rollcall/RS0880458).'
    n: '[110 Cong. Rec., Senate, July 24, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-3-1.pdf); [July 27, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-4-2.pdf). See [[cal.1963-10-07.baker]]. Names: Cooper.'
    tags: [name:cooper-john-sherman]
  - id: cal.1964-07-24.elections-1964
    when: July 24
    date: '1964-07-24'
    thread: elections-1964
    also: [civil-rights-bill, goldwater]
    c: 'Goldwater meets Johnson at the White House, 5:25 p.m., at his own request, some sixteen minutes: neither to inflame racial feeling in the campaign. Johnson at his press conference earlier that day: no issue can be "eliminated from the campaign in a free society." Check.'
    n: '[Johnson, Goldwater, Reedy, and Valenti, 5:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-barry-goldwater-july-24-1964), Conversation WH6407-24-4468, 4469 (Miller Center). The President''s News Conference, [1963–64 Pub. Papers 887](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=127) (July 24, 1964). [[w.perlstein-before-the-storm]], 396–97; [[w.johns-vietnams-second-front]], 71 (the statement; Goldwater''s memoirs on Vietnam). See [[cal.1964-07-15.elections-1964]]. Names: Goldwater, Johnson. Check: Johns, 71, has Goldwater''s memoirs say Johnson agreed to keep Vietnam, too, out of the campaign.'
    tags: [name:goldwater-barry-m, name:johnson-lyndon-b]
  - id: cal.1964-07-24.states-and-cities
    when: July 24–26
    date: '1964-07-24'
    thread: states-and-cities
    c: Rochester. An arrest at a block party on Joseph Avenue; three nights of rioting. Rockefeller calls out the National Guard, July 25. Five dead, four of them in a helicopter crash.
    n: 'To check: [[w.flamm-law-and-order]]. See [[cal.1964-07-18.states-and-cities]]. Names: Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1964-07-26.latin-america
    when: July 26
    date: '1964-07-26'
    thread: latin-america
    also: [cuba]
    c: 'OAS foreign ministers, Washington, on Venezuela''s complaint of Cuban arms: subversion is aggression. Members to break relations with Cuba and stop trade, food and medicine excepted, and shipping; 15–4, Bolivia, Chile, Mexico, and Uruguay against. Mexico alone keeps relations.'
    n: '[FRUS 1964–68, XXXII, doc. 279](https://history.state.gov/historicaldocuments/frus1964-68v32/d279); [FRUS 1964–68, XXXI, doc. 23](https://history.state.gov/historicaldocuments/frus1964-68v31/d23). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 227. To check: [[w.rabe-killing-zone]]. See [[cal.1962-01-22.latin-america]].'
    tags: [name:rusk-dean]
  - id: cal.1964-07-27.vietnam
    when: July 27
    date: '1964-07-27'
    thread: vietnam-force-levels
    c: More advisers. Taylor, July 17, recommends some 4,200 more military men, to nearly 22,000; the increase announced in Saigon. Khánh's campaign "to the North," from July 19, unanswered by Washington. Check.
    n: 'FRUS 1964–68, I, docs. [236](https://history.state.gov/historicaldocuments/frus1964-68v01/d236), [242](https://history.state.gov/historicaldocuments/frus1964-68v01/d242), [249](https://history.state.gov/historicaldocuments/frus1964-68v01/d249). [[w.gibbons-u-s-government-and]], II, 282. To check: [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]. See [[cal.1963-11-26.vietnam]]. Names: Taylor, Nguyễn Khánh.'
    tags: [name:taylor-maxwell, name:nguyen-khanh, place:saigon]
  - id: cal.1964-07-27.robert-kennedy
    when: July 27
    date: '1964-07-27'
    thread: robert-kennedy
    also: [states-and-cities]
    c: After Harlem and Rochester, Robert Kennedy by telephone proposes that Johnson and federal officials meet the mayors of cities with troubled young people, on schooling and the poverty program. Johnson agrees, and asks to see him the next day.
    n: '[Johnson and Robert Kennedy, 5:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-27-1964), Conversation WH6407-15-4349 (Miller Center). See [[cal.1964-07-21.robert-kennedy]]; [[cal.1964-07-24.states-and-cities]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy, Johnson.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1964-07-27.legislatures-nd
    when: July 27
    date: '1964-07-27'
    thread: legislatures
    c: 'North Dakota. A three-judge federal court holds the apportionment amendment of 1960 and the apportionment statute unconstitutional; the 1965 Legislative Assembly, de facto, to reapportion. One judge dissents: the court should apportion now.'
    n: '*Paulson v. Meier*, [232 F. Supp. 183](https://static.case.law/f-supp/232/case-pdfs/0183-01.pdf) (D.N.D. 1964). To check: [[w.dixon-democratic-representation]]. See [[cal.1960-06-28.state-constitutions-nd]]; [[cal.1964-06-15.court]].'
    tags: [state:nd]
  - id: cal.1964-07-28.governors-ar
    when: July 28
    date: '1964-07-28'
    thread: governors
    also: [elections-1964]
    c: 'Arkansas, Democratic primary for governor: Faubus, for a sixth term, 239,890, 65.7 percent; three others. Winthrop Rockefeller unopposed for the Republican nomination.'
    n: 'Votes: [Ark. *Historical Report of the Secretary of State* (2018), p. 412](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=421). To check: [[w.reed-faubus]]; [[w.ward-arkansas-rockefeller]]. Names: Faubus, Winthrop Rockefeller.'
    tags: [state:ar, name:faubus-orval-e, name:rockefeller-winthrop]
  - id: cal.1964-07-28.japan-and-korea-normalization
    when: July 28
    date: '1964-07-28'
    thread: japan-and-korea-normalization
    also: [japan]
    c: Seoul. Martial law lifted. Kim Chong-p'il has given up the party's chairmanship and gone abroad (Check the date).
    n: 'Check: the record. See [[cal.1964-06-03.japan-and-korea]]. Names: Kim Chong-p''il.'
    tags: [name:kim-chong-pil]
  - id: cal.1964-07-29.medicare
    when: July 29
    date: '1964-07-29'
    thread: medicare
    also: [welfare]
    c: House passes the Social Security amendments under a closed rule, [388–8](https://voteview.com/rollcall/RH0880190). Benefits up 5 percent; no hospital insurance, Mills's Ways and Means having left it out.
    n: '[110 Cong. Rec., House, July 29, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-6-1.pdf). To check: [[w.zelizer-taxing-america]]. See [[cal.1963-02-21.medicare]]. Names: Mills.'
    tags: [name:mills-wilbur-d]
  - id: cal.1964-07-29.civil-rights-organizations
    when: July 29
    date: '1964-07-29'
    thread: civil-rights-organizations
    also: [elections-1964]
    c: New York, the NAACP's offices. After Harlem, Wilkins, King, Young and Randolph ask their members to suspend mass demonstrations until after the election, Nov. 3. Farmer and Lewis do not sign; CORE and SNCC go on. Check the date and the signers.
    n: '[Photograph](https://explorepahistory.com/displayimage.php%3FimgId=1-2-F01.html), NAACP headquarters, July 30, 1964. *Student Voice*, Aug. 5, 1964: "SNCC and CORE Reject Protest Moratorium at New York Strategy Meeting." [[w.branch-pillar-of-fire]]. To check: [[w.garrow-bearing-the-cross]]; [[w.carson-in-struggle]]; [[w.wilkins-standing-fast]]; [[w.demilio-lost-prophet]]; [[w.meier-core]]. See [[cal.1964-07-18.states-and-cities]]. Names: Wilkins, Martin Luther King, Young, Randolph, Farmer, Lewis.'
    tags: [name:wilkins-roy, name:king-martin-luther-jr, name:young-whitney-m-jr, name:randolph-a-philip, name:farmer-james, name:lewis-john]
  - id: cal.1964-07-29.desegregation-schools
    when: July 29
    date: '1964-07-29'
    thread: desegregation-schools
    also: [south-carolina]
    c: South Carolina. On the Government's suit of July 2, Hemphill enjoins Sumter County School District No. 2 from turning away the some 970 children of Shaw Air Force Base, its schools built with $910,465 of federal aid on its assurance they would be open to them; the district had told the base, May 11, it would take them no longer.
    n: '*United States v. Sumter County School District No. 2*, [232 F. Supp. 945](https://static.case.law/f-supp/232/case-pdfs/0945-01.pdf) (E.D.S.C. 1964). To check: [[w.landsberg-enforcing-civil-rights]]. See [[cal.1964-06-18.desegregation-schools]]. Names: Hemphill.'
    tags: [name:hemphill-robert-w]
  - id: cal.1964-07-29.robert-kennedy
    when: July 29
    date: '1964-07-29'
    thread: robert-kennedy
    also: [elections-1964]
    c: The Oval Office, 1 p.m. Johnson, from a memorandum of Clifford's, tells Robert Kennedy he will not be the candidate for Vice President; offers help toward the Presidency later, another post, the running of the campaign. Kennedy declines the posts. Forty-five minutes.
    n: 'Kennedy''s dictated account, RFK Papers (JFK Library), printed in [[w.schlesinger-robert-kennedy-and-his]], 659–61. The statement: [[cal.1964-07-30.elections-1964]]. See [[cal.1964-03-10.elections-1964]]. Made public: Kennedy''s account, 1978 (Check). Names: Johnson, Robert Kennedy, Clifford.'
    tags: [name:johnson-lyndon-b, name:kennedy-robert-f, name:clifford-clark]
  - id: cal.1964-07-30.elections-1964
    when: July 30
    date: '1964-07-30'
    thread: elections-1964
    also: [robert-kennedy]
    c: 'Statement on the vice presidency: "inadvisable" to recommend "any member of the Cabinet or any of those who meet regularly with the Cabinet." Rusk, McNamara, Robert Kennedy, Freeman, Stevenson, Shriver told.'
    n: 'Statement by the President Relating to the Selection of a Vice Presidential Candidate, [1963–64 Pub. Papers 919](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=159) (July 30, 1964). [[w.schlesinger-robert-kennedy-and-his]], 657–62. To check: [[w.shesol-mutual-contempt]]; [[w.dallek-flawed-giant]]; [[w.taking-charge-2001]]. See [[cal.1964-03-10.elections-1964]]. Names: Johnson, Robert Kennedy, Rusk, Stevenson, McNamara, Freeman, Shriver.'
    tags: [name:johnson-lyndon-b, name:kennedy-robert-f, name:rusk-dean, name:mcnamara-robert-s, name:freeman-orville-l, name:stevenson-adlai-e, name:shriver-r-sargent]
  - id: cal.1964-07-30.conservation
    when: July 30
    date: '1964-07-30'
    thread: conservation
    c: House passes the wilderness bill, [374–1](https://voteview.com/rollcall/RH0880192).
    n: '[110 Cong. Rec., House, July 30, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-7-2.pdf). Wilderness Act (K–J Cong. II.J.2). See [[cal.1963-04-09.program]].'
  - id: cal.1964-07-31.space
    when: July 31
    date: '1964-07-31'
    thread: space
    c: Ranger 7 sends back 4,308 pictures of the moon before it strikes in the Sea of Clouds. The first success of the Ranger series, after six failures. Check the count.
    n: 'Statement by the President Upon the Successful Flight of Ranger VII, [1963–64 Pub. Papers 921](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=161) (July 31, 1964). To check: [[w.mcdougall-heavens-and-the-earth]]. See [[cal.1961-05-25.space]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-07-31.desegregation-schools
    when: July 31
    date: '1964-07-31'
    thread: desegregation-schools
    also: [alabama]
    c: 'Judge Johnson orders Montgomery County''s schools desegregated from September: the 1st, 10th, 11th and 12th grades, under the Placement Law after public notice; a plan for the whole system by Jan. 15, 1965 (*Carr*). Aug. 5, Bullock County: the Placement Law applied without discrimination from September, a plan by the same date (*Harris*).'
    n: '*Carr v. Montgomery County Board of Education*, [232 F. Supp. 705](https://static.case.law/f-supp/232/case-pdfs/0705-01.pdf) (M.D. Ala. 1964); *Harris v. Bullock County Board of Education*, [232 F. Supp. 959](https://static.case.law/f-supp/232/case-pdfs/0959-01.pdf) (M.D. Ala. 1964). To check: [[w.bass-taming-the-storm]]. See [[cal.1964-06-18.desegregation-schools]]; [[cal.1964-07-13.alabama]]. Names: Johnson.'
    tags: [name:johnson-frank-m-jr]
  - id: cal.1964-07.legislatures-vt
    when: July
    date: 1964-07
    thread: legislatures
    c: Vermont. A three-judge federal court orders both houses reapportioned by population by July 1965; the elections of 1964 to go ahead. The House, one member for each of 246 towns and cities since 1777, reapportions itself in 1965, to 150 seats; the rule of a senator for each county dropped.
    n: '*Buckley v. Hoff*, [234 F. Supp. 191](https://static.case.law/f-supp/234/case-pdfs/0191-01.pdf) (D. Vt. July 10, 1964). Check the dates. [Mark Bushnell, "Then Again," *VTDigger*, Jan. 12, 2020](https://vtdigger.org/2020/01/12/then-again-until-1965-the-smallest-town-had-as-much-clout-as-the-biggest-city-in-the-vermont-house/). To check: [[w.hand-star-that-set]]. See [[cal.1964-06-15.court]]. Names: Hoff.'
    tags: [state:vt, name:hoff-philip-h]
