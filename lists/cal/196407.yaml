    thread: vietnam-congress
    also: [republican-party-congress]
    c: 'Mansfield in the Senate on the House Republicans'' statement, "a tirade": "What amazes me is that they have come out of the sheaths so early." Cooper: against American command of the Vietnamese troops, but the statement opens the debate Mansfield asked for. Javits: "we must stick it out in Vietnam"; not to extend the war to the North.'
    n: '[110 Cong. Rec. 15,666 (1964)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-3-2.pdf) (1964); [110 Cong. Rec. 15,672–73 (1964)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-3-2.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 279. [[w.mann-grand-delusion]], 340–41 (Mansfield; Javits). See [[cal.1964-06-29.republican-party-congress]]. Names: Mansfield, Cooper, Javits. Check: Mann sets the reply after the statement of June 29, without a date.'
