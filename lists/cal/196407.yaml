    c: 'St. Augustine, Trinity Church. Bishop Hamilton West, of the Episcopal Diocese of Florida, to the vestry: rebukes the locked doors against "certain persons"; rejects the vestry''s 9–1 vote asking the rector, Charles Seymour, to resign. Vestryman Tebeault, owner of the local paper, resigns from the Episcopal Church; two vestrymen follow.'
