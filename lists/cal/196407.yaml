  - id: cal.1964-07-01.mississippi
    when: July 1
    date: '1964-07-01'
    thread: mississippi
    c: Katzenbach, Deputy Attorney General, to Johnson, through Lee White, on federal men in Mississippi. Agents may investigate and prosecute federal crimes; marshals would aggravate it; troops under 10 U.S.C. 332 and 333 only on a breakdown of the State's law enforcement, of which there is not yet evidence enough. More FBI agents the course.
    n: '[1 Op. O.L.C. Supp. 493](https://www.justice.gov/olc/file/477221/dl#page=509) (July 1, 1964), memorandum for the President, with Katzenbach''s cover memorandum to White of the same date (the editor''s note). Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1964-06-21.mississippi]]. Names: Katzenbach, Johnson, White.'
    tags: [name:katzenbach-nicholas, name:johnson-lyndon-b, name:white-lee-c]
  - id: cal.1964-07-01.vietnam-congress
    when: July 1
    date: '1964-07-01'
    thread: vietnam-congress
    also: [republican-party-congress]
    c: 'Mansfield in the Senate on the House Republicans'' statement, "a tirade": "What amazes me is that they have come out of the sheaths so early." Cooper: against American command of the Vietnamese troops, but the statement opens the debate Mansfield asked for. Javits: "we must stick it out in Vietnam"; not to extend the war to the North.'
    n: '[110 Cong. Rec. 15,666](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-3-2.pdf) (1964); [110 Cong. Rec. 15,672–73](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-3-2.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 279. See [[cal.1964-06-29.republican-party-congress]]. Names: Mansfield, Cooper, Javits.'
    src:
      c: 6acdf1ff
      rows:
