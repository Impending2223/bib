    n: 'Statute (K–J Cong. II.J.2). [110 Cong. Rec. (1964)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-4-2.pdf). Radio and Television Remarks Upon Signing the Civil Rights Bill, [1963–64 Pub. Papers 842](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=82) (July 2, 1964). [President''s Daily Diary, July 2, 1964](https://catalog.archives.gov/id/192443), images 4, 7, 8 (LBJ Library; National Archives Catalog). [[w.mann-walls-of-jericho]], 428 (the House''s vote); [[w.kotz-judgment-days]], 153–54; [[w.branch-pillar-of-fire]], 387–88; [[w.zelizer-fierce-urgency-of-now]], 128–29 (the signing, 7 p.m., East Room); [[w.bernstein-guns-or-butter]], 78–79 (the signing that evening in the East Room); [[w.thomas-robert-kennedy]], 295 (Robert Kennedy at the signing, Roy Reuther urging a pen for him). Check: Branch has Albert''s call to the Cabinet meeting at 2:05 p.m., "we are past the danger point" (387, citing the Daily Diary), and seventy-two pens (388). Check: Bernstein, 78, gives the House''s vote 289 to 124. To check: [[w.whalen-longest-debate]], 225, 227 (cited by [[w.branch-pillar-of-fire]], 387, 388); President''s Daily Diary, July 2, 1964 (cited by [[w.branch-pillar-of-fire]], 387); PPP, July 2, 1964, pp. 842-44 (cited by [[w.branch-pillar-of-fire]], 388). See [[cal.1964-02-10.civil-rights-bill]]; [[cal.1964-06-10.civil-rights-bill]]. Names: Johnson, Collins. Check: the page.'
