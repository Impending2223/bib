    thread: elections-1964
    also: [goldwater]
    c: 'Scranton''s letter to Goldwater, the day before the convention: "Goldwaterism" has come to stand for "a whole crazy-quilt collection of absurd and dangerous positions." Goldwater sends it to every delegate.'
    n: '[[w.perlstein-before-the-storm]], 377–78; [[w.young-two-suns-of-the]], 102 (the letter; copies to the delegates). To check: Time, July 24, 1964 (Scranton''s letter and Goldwater''s response) (cited by [[w.perlstein-before-the-storm]], 377 n.1); [[w.white-making-of-the-president-1965]]; [[w.wolf-william-warren-scranton]]. See [[cal.1964-06-02.elections-1964]]. Names: Scranton, Goldwater.'
