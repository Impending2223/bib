    also: [elections-1964]
    c: 'Gallup, June 11–16: Johnson 77, Goldwater 18; Johnson 70, Nixon 27; Johnson 69, Scranton 26. Undecided 5, 3, 5.'
    n: '*The Gallup Poll*, III, 1890–91 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B); Nixon (Opp. III.E); Scranton (Opp. III.H).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m, name:nixon-richard-m, name:scranton-william-w]
  - id: cal.1964-07-02.civil-rights-bill
    when: July 2
    date: '1964-07-02'
    thread: civil-rights-bill
    c: 'House accepts the Senate''s bill, [289–126](https://voteview.com/rollcall/RH0880182). Civil Rights Act signed that evening in the East Room, [78 Stat. 241](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg241.pdf), on television: "Let us close the springs of racial poison." Collins to be named director of the Community Relations Service.'
    n: 'Statute (K–J Cong. II.J.2). [110 Cong. Rec., House, July 2, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-4-2.pdf). [Radio and Television Remarks Upon Signing the Civil Rights Bill](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-upon-signing-the-civil-rights-bill) (July 2, 1964). Kotz, *Judgment Days* (K–J Adm. II.C). See [[cal.1964-02-10.civil-rights-bill]]; [[cal.1964-06-10.civil-rights-bill]]. Names: Collins (K–J Cong. III.F).'
    tags: [name:johnson-lyndon-b, name:collins-leroy]
  - id: cal.1964-07-03.civil-rights-bill
    when: July 3
    date: '1964-07-03'
    thread: civil-rights-bill
    also: [desegregation-public-places]
    c: Title II tested in Atlanta. Maddox, pistol in hand, turns three Negro divinity students away from his Pickrick restaurant. July 22, a three-judge court, Tuttle presiding, upholds the title against the Heart of Atlanta Motel's suit and enjoins the motel and, on the students' suit, Maddox.
    n: '*Heart of Atlanta Motel, Inc. v. United States*, [231 F. Supp. 393](https://static.case.law/f-supp/231/html/0393-01.html) (N.D. Ga. 1964); *Willis v. Pickrick Restaurant*, [231 F. Supp. 396](https://static.case.law/f-supp/231/html/0396-01.html) (N.D. Ga. 1964). *Heart of Atlanta Motel, Inc. v. United States* (K–J Cong. II.J.1). Landsberg, *Enforcing Civil Rights*; Graham, *The Civil Rights Era* (K–J Adm. II.C). See [[cal.1964-07-02.civil-rights-bill]]. Names: Maddox (K–J Cong. III.F); Tuttle (K–J Cong. III.G).'
    tags: [name:maddox-lester, name:tuttle-elbert-p]
  - id: cal.1964-07-04.alabama
    when: July 4–9
    date: '1964-07-04'
    thread: alabama
    also: [voting-rights, desegregation-public-places]
    c: Selma tests the Civil Rights Act. July 4, four students arrested at the Thirsty Boy drive-in, Sheriff Clark using a cattle prod; Black teenagers made to leave the Wilby Theatre, which Clark closes. July 5, his possemen club and gas the crowd leaving a mass meeting. July 6, 53 arrested at the courthouse, where pickets urged registration. July 9, Circuit Judge Hare enjoins gatherings of three or more in public, naming some 47 persons and 15 organizations, the Klan among them. Sept. 2, the United States sues Clark, Hare, the circuit solicitor, the probate judge and the city (*United States v. Clark*); heard in December by a three-judge court.
    n: '*United States v. Clark*, [249 F. Supp. 720](https://static.case.law/f-supp/249/html/0720-01.html) (S.D. Ala. 1965) (the findings); [the case](https://clearinghouse.net/case/14753/), Civil Rights Litigation Clearinghouse (filed Sept. 2, 1964). Garrow, *Protest at Selma* (K–J Cong. II.C). Carson, *In Struggle* (K–J Cong. II.F). Lewis, *Walking with the Wind* (K–J Cong. II.I.4). See [[cal.1964-03-19.voting-rights]]; [[cal.1964-07-03.civil-rights-bill]]. Names: Clark, Hare (K–J Cong. III.K).'
    tags: [name:clark-james-g-jr, name:hare-james-a]
  - id: cal.1964-07-06.desegregation-schools
    when: July 6
    date: '1964-07-06'
    thread: desegregation-schools
    also: [mississippi]
    c: Jackson. Mize, in the city's school case, finds that differences between Negro and white pupils justify separate schools; bound by the Fifth Circuit's Savannah opinion, he makes his injunction permanent, the first grade open to all this fall, his order "contrary to the facts and the law," and asks that *Brown* be reconsidered. The first-named plaintiff, Darrell Kenyatta Evers, Medgar Evers's son. Biloxi and Leake County under like orders. Biloxi's first grades open so Aug. 31, the first public schools desegregated in Mississippi; Leake County and Jackson that week. Check the dates.
    n: '*Evers v. Jackson Municipal Separate School District*, [232 F. Supp. 241](https://static.case.law/f-supp/232/html/0241-01.html) (S.D. Miss. 1964); *Evers v. Jackson Municipal Separate School District*, [328 F.2d 408](https://static.case.law/f2d/328/html/0408-01.html) (5th Cir. 1964), with the Biloxi and Leake County cases. Dittmer, *Local People* (K–J Cong. II.F). Bass, *Unlikely Heroes* (K–J Cong. II.H). See [[cal.1964-06-18.desegregation-schools]]. Names: Mize (K–J Cong. III.K); Evers (K–J Cong. III.H).'
    tags: [name:mize-sidney-c, name:evers-medgar]
  - id: cal.1964-07-09.cities-and-housing
    when: July 9
    date: '1964-07-09'
    thread: cities-and-housing
    c: Urban Mass Transportation Act signed, [78 Stat. 302](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg302-2.pdf). $375 million over three years in grants for transit equipment and facilities, two-thirds federal where the area has a plan. The House passed it June 25, [212–189](https://voteview.com/rollcall/RH0880178); the Senate agreed June 30, [47–36](https://voteview.com/rollcall/RS0880427).
    n: 'Statute (K–J Cong. II.J.2). [Remarks Upon Signing the Urban Mass Transportation Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-urban-mass-transportation-act) (July 9, 1964). Smerk, *Urban Transportation*; Gelfand, *A Nation of Cities*; Sundquist, *Politics and Policy* (K–J Cong. II.B). See [[cal.1963-04-04.program]]. Names: Sparkman (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:sparkman-john, name:rains-albert-m, name:williams-harrison-a-jr, name:widnall-william-b]
  - id: cal.1964-07-09.civil-rights-bill
    when: July 9
    date: '1964-07-09'
    thread: civil-rights-bill
    also: [confirmations]
    c: Commerce Committee, on Collins's nomination to the Community Relations Service. Thurmond, at the door to keep late Senators from making a quorum, wrestles Yarborough to the floor; Magnuson parts them. The committee reports the nomination, 16–1.
    n: 'Senate Historical Office, ["Pinned"](https://www.senate.gov/artandhistory/history/minute/pinned.htm). Wagy, *Governor LeRoy Collins of Florida* (K–J Cong. II.I.3). Crespino, *Strom Thurmond''s America* (Opp. II.F). See [[cal.1964-07-02.civil-rights-bill]]. Names: Thurmond, Yarborough, Magnuson (K–J Cong. III.B); Collins (K–J Cong. III.F).'
    tags: [name:thurmond-strom, name:yarborough-ralph, name:magnuson-warren-g, name:collins-leroy]
  - id: cal.1964-07-10.congo
    when: July 10
    date: '1964-07-10'
    thread: congo
    c: 'Tshombe, back from exile in Spain, prime minister of the Congo: Kasavubu names him to form a transitional government; the cabinet announced July 10. Adoula out; the last UN troops gone June 30. Rebels in Kwilu and the east. Check the dates.'
    n: 'FRUS 1964–68, XXIII, docs. [188](https://history.state.gov/historicaldocuments/frus1964-68v23/d188), [189](https://history.state.gov/historicaldocuments/frus1964-68v23/d189). Weissman, *American Foreign Policy in the Congo*; Namikas, *Battleground Africa*; Gleijeses, *Conflicting Missions* (K–J Adm. II.D). See [[cal.1963-01-14.congo]]. Names: Tshombe (K–J Adm. III.J).'
    tags: [name:tshombe-moise, name:kasavubu-joseph, name:adoula-cyrille]
  - id: cal.1964-07-10.mississippi
    when: July 10
    date: '1964-07-10'
    thread: mississippi
    c: Hoover in Jackson to reopen the FBI's field office there, closed since 1946. He calls on Governor Paul Johnson.
    n: 'Dittmer, *Local People*; McAdam, *Freedom Summer* (K–J Cong. II.F). Branch, *Pillar of Fire* (K–J Adm. II.C). See [[cal.1964-06-21.mississippi]]. Names: Hoover (K–J Adm. III.I); Paul Johnson (K–J Cong. III.F).'
    tags: [name:hoover-j-edgar, name:johnson-paul-b-jr]
  - id: cal.1964-07-11.civil-rights-the-executive
    when: July 11
    date: '1964-07-11'
    thread: civil-rights-the-executive
    also: [states-and-cities]
    c: 'Madison County, Georgia, in the early morning. Lemuel Penn, 48, a lieutenant colonel of the Army Reserve and assistant superintendent of the District of Columbia''s schools, driving home from training at Fort Benning with two other Negro reserve officers, shot dead from a passing car on the Broad River bridge near Colbert. 12:27 p.m., Sanders to Johnson: the State''s inquiry; a federal one perhaps needed. The FBI takes the case. Sanders: "ashamed."'
    n: '[Johnson and Sanders, 12:27 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-sanders-july-11-1964), Conversation WH6407-07-4216 (Miller Center). *New Georgia Encyclopedia*, ["Lemuel Penn Murder"](https://www.georgiaencyclopedia.org/articles/history-archaeology/lemuel-penn-murder/). Shipp, *Murder at Broad River Bridge* (K–J Cong. II.H). *United States v. Guest*, [383 U.S. 745](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383745/usrep383745.pdf) (1966) (K–J Adm. II.H.1). Made public: the recording, opened by the LBJ Library. Check the year. Names: Penn, Sanders (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
    tags: [name:penn-lemuel-a, name:sanders-carl-e, name:johnson-lyndon-b]
  - id: cal.1964-07-12.elections-1964
    when: July 12
    date: '1964-07-12'
    thread: elections-1964
    also: [goldwater]
    c: 'Scranton''s letter to Goldwater, the day before the convention: "Goldwaterism" has come to stand for "a whole crazy-quilt collection of absurd and dangerous positions." Goldwater sends it to every delegate.'
    n: 'White, *The Making of the President 1964* (Opp. II.E). Wolf, *William Warren Scranton* (Opp. II.C). Perlstein, *Before the Storm* (Opp. II.B). See [[cal.1964-06-02.elections-1964]]. Names: Scranton (Opp. III.H); Goldwater (Opp. III.B).'
    tags: [name:scranton-william-w, name:goldwater-barry-m]
  - id: cal.1964-07-13.elections-1964
    when: July 13
    date: '1964-07-13'
    thread: elections-1964
    c: 'Republican National Convention opens, the Cow Palace, outside San Francisco. The party''s primaries: map and returns below.'
    n: CQ Guide 6th (2010) 406–408. [Republican Party Platform of 1964](https://www.presidency.ucsb.edu/documents/republican-party-platform-1964) (July 13, 1964). *The Making of the President 1964* (Opp. I.B). Rovere, *The Goldwater Caper* (Opp. I.C). White, *The Making of the President 1964* (Opp. II.E). Novak, *The Agony of the G.O.P. 1964*; Kabaservice, *Rule and Ruin* (Opp. II.A). Shadegg, *What Happened to Goldwater?*; White, *Suite 3505*; Kessel, *The Goldwater Coalition*; Perlstein, *Before the Storm*; Middendorf, *A Glorious Disaster* (Opp. II.B). Smith, *On His Own Terms*; Wolf, *William Warren Scranton* (Opp. II.C). Goldwater, *With No Apologies* (Opp. II.G.1). See [[cal.1964-03-10.elections-1964]].
    tags: [primaries:1964-R]
  - id: cal.1964-07-13.opinion
    when: July 13
    date: '1964-07-13'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, June 25–30: Johnson 77, Goldwater 20, undecided 3; the South, Johnson 63, Goldwater 32. With Wallace the candidate of a third party: Johnson 75, Goldwater 16, Wallace 5; the South, Johnson 56, Goldwater 20, Wallace 18.'
    n: '*The Gallup Poll*, III, 1893 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B); Wallace (K–J Cong. III.F).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m, name:wallace-george-c]
  - id: cal.1964-07-13.alabama
    when: July 13
    date: '1964-07-13'
    thread: alabama
    also: [desegregation-schools]
    c: '*Lee v. Macon County Board of Education*. A three-judge court, Judge Johnson sitting, enjoins Wallace as president of the State Board of Education, the board and the State superintendent from interfering with any school board in Alabama desegregating under a federal court''s order. No tuition grants for any school limited by race. No statewide order "at this time"; State money for segregated schools to stop within a reasonable time. Macon County to extend its plan for September; Macon Academy made a defendant.'
    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/html/0743-01.html) (M.D. Ala. 1964). Opinion (K–J Cong. II.J.1). Bass, *Taming the Storm* (K–J Cong. II.G). Bass, *Unlikely Heroes* (K–J Cong. II.H). See [[cal.1964-02-03.alabama]]. Names: Johnson (K–J Cong. III.G); Wallace (K–J Cong. III.F).'
    tags: [name:johnson-frank-m-jr, name:wallace-george-c]
  - id: cal.1964-07-14.elections-1964
    when: July 14
    date: '1964-07-14'
    thread: elections-1964
    also: [right-and-the-military]
    c: 'The platform fight. Scranton''s amendments rejected: civil rights, 897–409 (Check); extremism, naming the Birch Society; civilian control of nuclear weapons. Rockefeller, speaking for the extremism amendment, booed and shouted down from the floor and galleries. Eisenhower, the same day, against "sensation-seeking columnists and commentators."'
    n: '[Republican Party Platform of 1964](https://www.presidency.ucsb.edu/documents/republican-party-platform-1964) (July 13, 1964). See [[cal.1964-07-13.elections-1964]]. Names: Scranton, Rockefeller (Opp. III.H); Eisenhower (Opp. III.E).'
    tags: [name:scranton-william-w, name:rockefeller-nelson, name:eisenhower-dwight-d]
  - id: cal.1964-07-14.opinion
    when: July 14
    date: '1964-07-14'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, June 25–30: Republicans'' choice for 1964: Goldwater 22, Nixon 22, Lodge 21, Scranton 20, Rockefeller 6; undecided, others 9. Independents: Lodge 22, Goldwater 19, Scranton 16, Nixon 15, Rockefeller 11.'
    n: '*The Gallup Poll*, III, 1894 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Nixon (Opp. III.E); Lodge (K–J Adm. III.E); Scranton, Rockefeller (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:nixon-richard-m, name:lodge-henry-cabot, name:scranton-william-w, name:rockefeller-nelson]
  - id: cal.1964-07-15.elections-1964
    when: July 15–16
    date: '1964-07-15'
    thread: elections-1964
    also: [goldwater]
    c: 'Goldwater nominated on the first ballot: 883 of 1,308; Scranton 214, Rockefeller 114, Romney 41, Margaret Chase Smith 27, Judd 22. July 16, Miller for Vice President. The acceptance: "extremism in the defense of liberty is no vice," "moderation in the pursuit of justice is no virtue."'
    n: '[Address Accepting the Presidential Nomination at the Republican National Convention in San Francisco](https://www.presidency.ucsb.edu/documents/address-accepting-the-presidential-nomination-the-republican-national-convention-san) (July 16, 1964). Hess, *In a Cause That Will Triumph* (Opp. II.B). See [[cal.1964-07-13.elections-1964]]. Names: Goldwater (Opp. III.B); Scranton, Rockefeller, Romney (Opp. III.H); Smith (Opp. III.A); Miller (Opp. III.E).'
    tags: [name:goldwater-barry-m, name:scranton-william-w, name:rockefeller-nelson, name:romney-george-w, name:smith-margaret-chase, name:judd-walter-h, name:miller-william-e]
  - id: cal.1964-07-18.states-and-cities
    when: July 18–22
    date: '1964-07-18'
    thread: states-and-cities
    c: 'Harlem. Lieutenant Gilligan, off duty, had shot James Powell, fifteen, July 16. After a CORE rally, crowds at the 28th Precinct; four nights of rioting in Harlem and, from July 20, Bedford-Stuyvesant. One dead. July 21, Johnson: "no compromise" on law and order; the FBI to investigate.'
    n: '[Statement by the President on the Riots in New York City](https://www.presidency.ucsb.edu/documents/statement-the-president-the-riots-new-york-city) (July 21, 1964). Flamm, *Law and Order* (K–J Cong. II.F). See [[cal.1963-11-05.states-and-cities]]. Names: Gilligan, Powell (K–J Cong. III.K); Hoover (K–J Adm. III.I).'
    tags: [name:gilligan-thomas, name:powell-james, name:johnson-lyndon-b, name:hoover-j-edgar]
  - id: cal.1964-07-19.elections-1964
    when: July 19
    date: '1964-07-19'
    thread: elections-1964
    also: [alabama]
    c: Wallace, on CBS's *Face the Nation*, withdraws as a candidate for President, four days after Goldwater's nomination. Check.
    n: 'Carter, *The Politics of Rage* (K–J Cong. II.H). See [[cal.1964-03-06.elections-1964]]; [[cal.1964-07-15.elections-1964]]. The program, CBS, July 19, 1964, Wallace the guest: *Face the Nation, 1954–1970: Index* (1972). Names: Wallace (K–J Cong. III.F); Goldwater (Opp. III.B).'
    tags: [name:wallace-george-c, name:goldwater-barry-m]
  - id: cal.1964-07-20.civil-rights-bill
    when: July 20
    date: '1964-07-20'
    thread: civil-rights-bill
    also: [confirmations]
    c: Senate confirms LeRoy Collins, former governor of Florida, as director of the Community Relations Service under Title X, [53–8](https://voteview.com/rollcall/RS0880441).
    n: '[110 Cong. Rec., Senate, July 20, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-9-2.pdf). Wagy, *Governor LeRoy Collins of Florida* (K–J Cong. II.I.3). See [[cal.1964-07-02.civil-rights-bill]]. Names: Collins (K–J Cong. III.F).'
    tags: [name:collins-leroy]
  - id: cal.1964-07-21.robert-kennedy
    when: July 21
    date: '1964-07-21'
    thread: robert-kennedy
    also: [states-and-cities, mississippi]
    c: 'Johnson and Robert Kennedy, five calls. Noon: protection for King, to speak in Greenwood, Mississippi; Hoover and the Justice Department; the Harlem riots and an FBI inquiry, Johnson reading his statement. 1 p.m.: whether Hoover himself should go to New York; Kennedy doubts it, New York more like the Georgia killing than Mississippi. Evening: two lawyers of the Lawyers'' Committee for Civil Rights missing in Mississippi, seen at 8:25, found by 9:31; Goldwater''s request to see Johnson.'
    n: '[Johnson and Robert Kennedy, 12:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-21-1964), Conversation WH6407-11-4288 (Miller Center); [1:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-21-1964-0), Conversation WH6407-11-4294 (Miller Center); [8:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-22-1964), Conversation WH6407-12-4299 (Miller Center); [8:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-22-1964-0), Conversation WH6407-12-4300 (Miller Center); [9:31 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-22-1964-1), Conversation WH6407-12-4303 (Miller Center). [Statement by the President on the Riots in New York City](https://www.presidency.ucsb.edu/documents/statement-the-president-the-riots-new-york-city) (July 21, 1964). *Taking Charge* (K–J Adm. II.J). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1964-07-18.states-and-cities]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Johnson (K–J Adm. III.D); Robert Kennedy (K–J Adm. III.A); King (K–J Cong. III.H); Hoover (K–J Adm. III.I); Goldwater (Opp. III.B).'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:king-martin-luther-jr, name:hoover-j-edgar, name:goldwater-barry-m]
  - id: cal.1964-07-23.poverty
    when: July 23
    date: '1964-07-23'
    thread: poverty
    c: Senate passes the Economic Opportunity bill, [61–34](https://voteview.com/rollcall/RS0880452). Prouty's amendment for a governor's approval of community action, carried [45–44](https://voteview.com/rollcall/RS0880443), is reconsidered and lost, [45–46](https://voteview.com/rollcall/RS0880446); Smathers's, a governor's veto of contracts with private agencies, taken, [80–7](https://voteview.com/rollcall/RS0880447).
    n: '[110 Cong. Rec., Senate, July 23, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-2-1.pdf). See [[cal.1964-03-16.poverty]]. Names: Smathers (K–J Cong. III.A).'
    tags: [name:prouty-winston-l, name:smathers-george-a]
  - id: cal.1964-07-24.baker
    when: July 24
    date: '1964-07-24'
    thread: baker
    also: [congress]
    c: 'Senate sets up a Select Committee on Standards and Conduct, six members, three of each party: Cooper''s substitute, [50–33](https://voteview.com/rollcall/RS0880456); the resolution, [61–19](https://voteview.com/rollcall/RS0880457). July 27, disclosure of Senators'' finances refused, [25–62](https://voteview.com/rollcall/RS0880458).'
    n: '[110 Cong. Rec., Senate, July 24, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-3-1.pdf); [July 27, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-4-2.pdf). See [[cal.1963-10-07.baker]]. Names: Cooper (Opp. III.B).'
    tags: [name:cooper-john-sherman]
  - id: cal.1964-07-24.elections-1964
    when: July 24
    date: '1964-07-24'
    thread: elections-1964
    also: [civil-rights-bill, goldwater]
    c: 'Goldwater meets Johnson at the White House, 5:25 p.m., at his own request, some sixteen minutes: neither to inflame racial feeling in the campaign. Johnson at his press conference earlier that day: no issue can be "eliminated from the campaign in a free society." Check.'
    n: '[Johnson, Goldwater, Reedy, and Valenti, 5:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-barry-goldwater-july-24-1964), Conversation WH6407-24-4468, 4469 (Miller Center). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1053) (July 24, 1964). See [[cal.1964-07-15.elections-1964]]. Names: Goldwater (Opp. III.B).'
    tags: [name:goldwater-barry-m, name:johnson-lyndon-b]
  - id: cal.1964-07-24.states-and-cities
    when: July 24–26
    date: '1964-07-24'
    thread: states-and-cities
    c: Rochester. An arrest at a block party on Joseph Avenue; three nights of rioting. Rockefeller calls out the National Guard, July 25. Five dead, four of them in a helicopter crash.
    n: 'Flamm, *Law and Order* (K–J Cong. II.F). See [[cal.1964-07-18.states-and-cities]]. Names: Rockefeller (Opp. III.H).'
    tags: [name:rockefeller-nelson]
  - id: cal.1964-07-26.latin-america
    when: July 26
    date: '1964-07-26'
    thread: latin-america
    also: [cuba]
    c: 'OAS foreign ministers, Washington, on Venezuela''s complaint of Cuban arms: subversion is aggression. Members to break relations with Cuba and stop trade, food and medicine excepted, and shipping; 15–4, Bolivia, Chile, Mexico, and Uruguay against. Mexico alone keeps relations.'
    n: '[FRUS 1964–68, XXXII, doc. 279](https://history.state.gov/historicaldocuments/frus1964-68v32/d279); [FRUS 1964–68, XXXI, doc. 23](https://history.state.gov/historicaldocuments/frus1964-68v31/d23). Rabe, *The Killing Zone* (K–J Adm. II.D). See [[cal.1962-01-22.latin-america]].'
    tags: [name:rusk-dean]
  - id: cal.1964-07-27.vietnam
    when: July 27
    date: '1964-07-27'
    thread: vietnam
    c: More advisers. Taylor, July 17, recommends some 4,200 more military men, to nearly 22,000; the increase announced in Saigon. Khánh's campaign "to the North," from July 19, unanswered by Washington. Check.
    n: 'FRUS 1964–68, I, docs. [236](https://history.state.gov/historicaldocuments/frus1964-68v01/d236), [242](https://history.state.gov/historicaldocuments/frus1964-68v01/d242), [249](https://history.state.gov/historicaldocuments/frus1964-68v01/d249). Kaiser, *American Tragedy* (Viet. II.B.8). Logevall, *Choosing War* (K–J Adm. II.D). See [[cal.1963-11-26.vietnam]]. Names: Taylor (K–J Adm. III.F); Khánh (Viet. III.G).'
    tags: [name:taylor-maxwell, name:nguyen-khanh]
  - id: cal.1964-07-27.robert-kennedy
    when: July 27
    date: '1964-07-27'
    thread: robert-kennedy
    also: [states-and-cities]
    c: After Harlem and Rochester, Robert Kennedy by telephone proposes that Johnson and federal officials meet the mayors of cities with troubled young people, on schooling and the poverty program. Johnson agrees, and asks to see him the next day.
    n: '[Johnson and Robert Kennedy, 5:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-27-1964), Conversation WH6407-15-4349 (Miller Center). See [[cal.1964-07-21.robert-kennedy]]; [[cal.1964-07-24.states-and-cities]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1964-07-29.medicare
    when: July 29
    date: '1964-07-29'
    thread: medicare
    also: [welfare]
    c: House passes the Social Security amendments under a closed rule, [388–8](https://voteview.com/rollcall/RH0880190). Benefits up 5 percent; no hospital insurance, Mills's Ways and Means having left it out.
    n: '[110 Cong. Rec., House, July 29, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-6-1.pdf). Zelizer, *Taxing America* (K–J Cong. II.B). See [[cal.1963-02-21.medicare]]. Names: Mills (K–J Cong. III.D).'
    tags: [name:mills-wilbur-d]
  - id: cal.1964-07-29.civil-rights-organizations
    when: July 29
    date: '1964-07-29'
    thread: civil-rights-organizations
    also: [elections-1964]
    c: New York, the NAACP's offices. After Harlem, Wilkins, King, Young and Randolph ask their members to suspend mass demonstrations until after the election, Nov. 3. Farmer and Lewis do not sign; CORE and SNCC go on. Check the date and the signers.
    n: '[Photograph](https://explorepahistory.com/displayimage.php%3FimgId=1-2-F01.html), NAACP headquarters, July 30, 1964. *Student Voice*, Aug. 5, 1964: "SNCC and CORE Reject Protest Moratorium at New York Strategy Meeting." Branch, *Pillar of Fire* (K–J Adm. II.C). Garrow, *Bearing the Cross*; Carson, *In Struggle* (K–J Cong. II.F). Wilkins, *Standing Fast*; D''Emilio, *Lost Prophet* (K–J Cong. II.I.4). August Meier & Elliott Rudwick, *CORE: A Study in the Civil Rights Movement, 1942–1968* (Oxford University Press, 1973). See [[cal.1964-07-18.states-and-cities]]. Names: Wilkins, King, Young, Randolph, Farmer, Lewis (K–J Cong. III.H).'
    tags: [name:wilkins-roy, name:king-martin-luther-jr, name:young-whitney-m-jr, name:randolph-a-philip, name:farmer-james, name:lewis-john]
  - id: cal.1964-07-29.desegregation-schools
    when: July 29–Aug. 12
    date: '1964-07-29'
    thread: desegregation-schools
    c: South Carolina. On the Government's suit of July 2, Hemphill enjoins Sumter County School District No. 2 from turning away the some 970 children of Shaw Air Force Base, its schools built with $910,465 of federal aid on its assurance they would be open to them; the district had told the base, May 11, it would take them no longer. Aug. 8, on the suit of thirteen Negro children, Hemphill orders the district's schools open to them this fall and to all by choice from 1965–66. Aug. 12, the same court orders the like for Orangeburg.
    n: '*United States v. Sumter County School District No. 2*, [232 F. Supp. 945](https://static.case.law/f-supp/232/html/0945-01.html) (E.D.S.C. 1964); *Randall v. Sumter School District No. 2*, [232 F. Supp. 786](https://static.case.law/f-supp/232/html/0786-01.html) (E.D.S.C. 1964); *Adams v. School District No. 5, Orangeburg County*, [232 F. Supp. 692](https://static.case.law/f-supp/232/html/0692-01.html) (E.D.S.C. 1964). Landsberg, *Enforcing Civil Rights* (K–J Adm. II.C). See [[cal.1964-06-18.desegregation-schools]].'
    tags: [name:hemphill-robert-w]
  - id: cal.1964-07-30.elections-1964
    when: July 30
    date: '1964-07-30'
    thread: elections-1964
    also: [robert-kennedy]
    c: 'Statement on the vice presidency: "inadvisable" to recommend "any member of the Cabinet or any of those who meet regularly with the Cabinet." Rusk, McNamara, Robert Kennedy, Freeman, Stevenson, Shriver told.'
    n: '[Statement by the President Relating to the Selection of a Vice Presidential Candidate](https://www.presidency.ucsb.edu/documents/statement-the-president-relating-the-selection-vice-presidential-candidate) (July 30, 1964). Shesol, *Mutual Contempt*; Dallek, *Flawed Giant* (K–J Adm. II.A). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). *Taking Charge* (K–J Adm. II.J). See [[cal.1964-03-10.elections-1964]]. Names: Robert Kennedy (K–J Adm. III.A); Rusk, Stevenson (K–J Adm. III.E); McNamara (K–J Adm. III.F); Freeman, Shriver (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:kennedy-robert-f, name:rusk-dean, name:mcnamara-robert-s, name:freeman-orville-l, name:stevenson-adlai-e, name:shriver-r-sargent]
  - id: cal.1964-07-30.conservation
    when: July 30
    date: '1964-07-30'
    thread: conservation
    c: House passes the wilderness bill, [374–1](https://voteview.com/rollcall/RH0880192).
    n: '[110 Cong. Rec., House, July 30, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt13/pdf/GPO-CRECB-1964-pt13-7-2.pdf). Wilderness Act (K–J Cong. II.J.2). See [[cal.1963-04-09.program]].'
  - id: cal.1964-07-31.space
    when: July 31
    date: '1964-07-31'
    thread: space
    c: Ranger 7 sends back 4,308 pictures of the moon before it strikes in the Sea of Clouds. The first success of the Ranger series, after six failures. Check the count.
    n: '[Statement by the President Upon the Successful Flight of Ranger VII](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-the-successful-flight-ranger-vii) (July 31, 1964). McDougall, *...the Heavens and the Earth* (K–J Adm. II.B). See [[cal.1961-05-25.space]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-07-31.desegregation-schools
    when: July 31
    date: '1964-07-31'
    thread: desegregation-schools
    also: [alabama]
    c: 'Judge Johnson orders Montgomery County''s schools desegregated from September: the 1st, 10th, 11th and 12th grades, under the Placement Law after public notice; a plan for the whole system by Jan. 15, 1965 (*Carr*). Aug. 5, Bullock County: the Placement Law applied without discrimination from September, a plan by the same date (*Harris*).'
    n: '*Carr v. Montgomery County Board of Education*, [232 F. Supp. 705](https://static.case.law/f-supp/232/html/0705-01.html) (M.D. Ala. 1964); *Harris v. Bullock County Board of Education*, [232 F. Supp. 959](https://static.case.law/f-supp/232/html/0959-01.html) (M.D. Ala. 1964). Bass, *Taming the Storm* (K–J Cong. II.G). See [[cal.1964-06-18.desegregation-schools]]; [[cal.1964-07-13.alabama]]. Names: Johnson (K–J Cong. III.G).'
    tags: [name:johnson-frank-m-jr]
