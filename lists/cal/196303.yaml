    tags: [name:bowles-chester, name:kennedy-john-f]
  - id: cal.1963-03-08.middle-east
    when: Mar. 8
    date: '1963-03-08'
    thread: middle-east
    c: Syria. Officers of the Ba'th and their allies take power at Damascus.
    n: '[FRUS 1961–63, XVIII, doc. 185](https://history.state.gov/historicaldocuments/frus1961-63v18/d185) (Rusk to Kennedy, Mar. 10). To check: [[w.rabinovich-syria-under-the-bath]]; [[w.seale-asad-of-syria]]. See [[cal.1961-09-28.middle-east]].'
  - id: cal.1963-03-10.opinion
    when: Mar. 10
    date: '1963-03-10'
    thread: opinion
    also: [europe-and-the-alliance]
    c: 'Gallup, Feb. 7–12: France a dependable ally, 32 percent; not, 35; no opinion, 33. The college-educated, 36 and 47.'
