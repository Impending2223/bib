entries:
  - id: cal.1963-03-01.middle-east
    when: Mar. 1
    date: '1963-03-01'
    thread: middle-east-yemen
    c: 'Yemen. Kennedy''s letter to Faisal, carried by Bunker, the President''s emissary: an eight-point plan for disengagement, Saudi aid to the royalists suspended and the UAR''s troops withdrawn; an American air unit for Saudi Arabia once observers certify the suspension.'
    n: 'FRUS 1961–63, XVIII, docs. [172](https://history.state.gov/historicaldocuments/frus1961-63v18/d172), [176](https://history.state.gov/historicaldocuments/frus1961-63v18/d176) (editorial note). Made public: FRUS 1961–63, XVIII (1995). To check: [[w.badeau-middle-east-remembered]]; [[w.schaffer-ellsworth-bunker]]. See [[cal.1962-09-26.middle-east]]. Names: Bunker, Faisal ibn Abd al-Aziz Al Saud, Kennedy.'
    tags: [name:bunker-ellsworth, name:faisal-ibn-abd-al-aziz-al-saud, name:kennedy-john-f]
  - id: cal.1963-03-04.railroads
    when: Mar. 4
    date: '1963-03-04'
    thread: railroads
    c: '*Locomotive Engineers v. Baltimore & Ohio Railroad*, [372 U.S. 284](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372284/usrep372284.pdf), per curiam: the Railway Labor Act''s procedures exhausted, the carriers may put their new work rules in force. Firemen on diesel freight and yard engines the chief issue since 1959.'
    n: '[[w.commission-report]]; Statement by the President Upon Receiving Report of the Presidential Railroad Commission, [1962 Pub. Papers 173](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=233) (Feb. 28, 1962). CQ Almanac 1963. To check: [[w.horowitz-manpower-utilization-in-the]]; [[w.dunlop-manpower-in-operating-classifications]]; [[w.kaufman-railroad-labor-dispute]]; [[w.cullen-national-emergency-strikes]]; [[w.comment-ad-hoc-compulsory-arbitration]]; [[w.cottrell-technological-change-and-labor]]; [[w.fisher-effect-of-the-removal]]; [[w.congress-and-the-nation]] (K–J Cong. II.L).'
  - id: cal.1963-03-04.middle-east-yemen
    when: Mar. 4
    date: '1963-03-04'
    thread: middle-east-yemen
    c: Badeau gives Nasser Kennedy's warning on the UAR's air attacks on Saudi Arabia.
    n: '[FRUS 1961–63, XVIII, doc. 175](https://history.state.gov/historicaldocuments/frus1961-63v18/d175) (the instruction, Mar. 2). Check: the record of the meeting. See [[cal.1963-03-01.middle-east]]. Names: Badeau, Nasser, Kennedy.'
    tags: [name:badeau-john-s, name:nasser-gamal-abdel, name:kennedy-john-f]
  - id: cal.1963-03-05.alabama-birmingham
    when: Mar. 5
    date: '1963-03-05'
    thread: alabama-birmingham
    also: [mayors, elections-1963]
    c: 'Birmingham elects a mayor and nine councilmen. For mayor: Boutwell, former lieutenant governor, first; Connor second; Tom King third. Runoff Apr. 2 between Boutwell and Connor. Mar. 1, the State Supreme Court had upheld the November vote.'
    n: '*Reid v. City of Birmingham*, [274 Ala. 629](https://static.case.law/ala/274/case-pdfs/0629-01.pdf), 150 So. 2d 735 (1963). Check: the returns. To check: [[w.eskew-but-for-birmingham]]; [[w.thornton-dividing-lines]]; [[w.mcwhorter-carry-me-home]]. See [[cal.1962-11-06.alabama-birmingham]]. Names: Boutwell, Connor, Tom King.'
    tags: [state:al, city:birmingham, name:boutwell-albert, name:connor-eugene, name:king-tom]
  - id: cal.1963-03-05.mayors-baltimore
    when: Mar. 5
    date: '1963-03-05'
    thread: mayors
    also: [elections-1963]
    c: 'Baltimore primaries for mayor. Democratic: Goodman, mayor since December, over the nearest of eight others, 70,961 to 38,705, 49.5 percent. Republican: McKeldin, mayor 1943–47 and governor 1951–59, over two others, 16,694 to 5,753, 74.4 percent.'
    n: '[Wikipedia, "1963 Baltimore mayoral election"](https://en.wikipedia.org/wiki/1963_Baltimore_mayoral_election), from Our Campaigns; check against the Board of Supervisors of Elections. To check: [[w.durr-behind-the-backlash]]; [[w.callcott-maryland-and-america-1940]]. Names: Goodman, McKeldin.'
    tags: [state:md, city:baltimore, name:goodman-philip-h, name:mckeldin-theodore-r]
  - id: cal.1963-03-05.transportation
    when: Mar. 5
    date: '1963-03-05'
    thread: transportation
    c: 'Transportation bill sent to Congress, on the lines of the 1962 message: minimum-rate regulation lifted from all carriage of bulk and farm commodities, as it already is for much of it by water and truck; the antitrust laws against destructive competition.'
    n: 'Letter to the President of the Senate and to the Speaker of the House on Transportation Policy, [1963 Pub. Papers 234](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=292) (Mar. 5, 1963). To check: [[w.friedlaender-dilemma-of-freight-transport]]. See [[cal.1962-04-05.transportation]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-06.economy
    when: Mar. 6
    date: '1963-03-06'
    thread: economy
    c: News conference. A $13½ billion cut without the reforms? "No, that isn't what I said." The program sent up, reduction and reform together, the best combination; the bill Congress enacts will hold "important elements of the reforms."
    n: The President's News Conference of March 6, 1963, [1963 Pub. Papers 236](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=294), item 2. [[w.stein-fiscal-revolution-in-america]], 438–39. See [[cal.1963-01-24.economy]].
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-07.vietnam
    when: Mar. 7
    date: '1963-03-07'
    thread: vietnam
    c: 'Bowles to Kennedy, "Recommendations for a Fresh Approach to the Vietnam Impasse": Vietnam may prove "as troublesome as Cuba" to the administration at home and abroad; a clear statement of objectives to "neutralize present and potential domestic critics."'
    n: '[FRUS 1961–63, III, doc. 52](https://history.state.gov/historicaldocuments/frus1961-63v03/d52). [[w.johns-vietnams-second-front]], 30–31. See [[cal.1963-02-24.vietnam]]. Names: Bowles, Kennedy.'
