  - id: cal.1963-03-01.middle-east
    when: Mar. 1
    date: '1963-03-01'
    thread: middle-east-yemen
    c: 'Yemen. Kennedy''s letter to Faisal, carried by Bunker, the President''s emissary: an eight-point plan for disengagement, Saudi aid to the royalists suspended and the UAR''s troops withdrawn; an American air unit for Saudi Arabia once observers certify the suspension.'
    n: 'FRUS 1961–63, XVIII, docs. [172](https://history.state.gov/historicaldocuments/frus1961-63v18/d172), [176](https://history.state.gov/historicaldocuments/frus1961-63v18/d176) (editorial note). Made public: FRUS 1961–63, XVIII (1995). To check: [[w.badeau-middle-east-remembered]]; [[w.schaffer-ellsworth-bunker]]. See [[cal.1962-09-26.middle-east]]. Names: Bunker, Faisal ibn Abd al-Aziz Al Saud, Kennedy.'
    tags: [name:bunker-ellsworth, name:faisal-ibn-abd-al-aziz-al-saud, name:kennedy-john-f]
    short: Bunker and the Yemen disengagement
  - id: cal.1963-03-01.voting-rights
    when: Mar. 1
    date: '1963-03-01'
    thread: voting-rights
    also: [mississippi]
    c: 'Branton to the President by telegram, on the shooting of Travis: "This can no longer be tolerated. We are accordingly today announcing a concentrated, saturation campaign to register every qualified Negro in LeFlore County." Appeals to Robert Kennedy and to Hannah.'
    n: '[[w.branch-parting-the-waters]], 718. To check: New York Times, Mar. 2, 1963, 4 (cited by [[w.branch-parting-the-waters]], 718 n.1). Check: the day. See [[cal.1963-02-28.mississippi]]. Names: Kennedy, Robert Kennedy, Hannah.'
    src:
      c: 4c0af483
      rows:
        - 'w.branch-parting-the-waters 718: all'
        - 'via w.branch-parting-the-waters 718 n.1: all'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:hannah-john-a, state:ms]
  - id: cal.1963-03-01.transition-and-staff
    when: Mar. 1
    date: '1963-03-01'
    thread: transition-and-staff
    c: 'The Senate Labor and Public Welfare Committee hears nominees: Howard G. Gamser, a member of the National Mediation Board; Francis Keppel, Commissioner of Education; Daniel Patrick Moynihan, an Assistant Secretary of Labor; George C. Trevorrow, a member of the Federal Coal Mine Safety Board of Review.'
    n: '*Nominations: Hearing Before the S. Comm. on Labor and Public Welfare*, 88th Cong. (1963) ([online](https://www.govinfo.gov/app/details/CHRG-88shrg96179)), 2 (Moynihan), 4 (Keppel), 6 (Gamser), 10 (Trevorrow). Names: Gamser, Keppel, Moynihan.'
    tags: [name:gamser-howard-g, name:keppel-francis, name:moynihan-daniel-patrick]
  - id: cal.1963-03-02.civil-rights-bill
    when: Mar. 2
    date: '1963-03-02'
    thread: civil-rights-bill
    also: [republican-party-congress]
    c: 'The Republicans of the House Judiciary Committee welcome the President''s proposals but are "disappointed" with "timid and almost reluctant proposals": no civil suits by the Attorney General, almost nothing on employment. McCulloch: the only civil rights bills passed came under a Republican President; most of Kennedy''s proposals in the Republicans'' bill of a month before.'
    n: '[[w.zelizer-fierce-urgency-of-now]], 41–42. To check: Rodney Crowther, "GOP Assails Rights Views," *Baltimore Sun*, Mar. 3, 1963 (cited by [[w.zelizer-fierce-urgency-of-now]], 42 n.36). Check: the day ("two days later"). See [[cal.1963-02-28.voting-rights]]. Names: McCulloch, Kennedy.'
    src:
      c: eaa96b80
      rows:
        - 'w.zelizer-fierce-urgency-of-now 41–42: all'
        - 'via w.zelizer-fierce-urgency-of-now 42 n.36: all'
    tags: [name:mcculloch-william-m, name:kennedy-john-f]
  - id: cal.1963-03-03.king
    when: Mar. 3
    date: '1963-03-03'
    thread: king
    c: 'King at Ebenezer: "I''m sick and tired of seeing Negro preachers riding around in big cars and living in big houses and not concerned about the problems of the people who made it possible for them to get these things." "The church that overlooks this is a dangerously irrelevant church."'
    n: '[[w.branch-parting-the-waters]], 695–96. To check: King''s sermon, Mar. 3, 1963, King Speeches, box 4 (cited by [[w.branch-parting-the-waters]], 695 n.7). Names: Martin Luther King.'
    src:
      c: dd44adf6
      rows:
        - 'w.branch-parting-the-waters 695–96: all'
        - 'via w.branch-parting-the-waters 695 n.7: all'
    tags: [name:king-martin-luther-jr, city:atlanta]
  - id: cal.1963-03-04.railroads
    when: Mar. 4
    date: '1963-03-04'
    thread: railroads
    c: '*Locomotive Engineers v. Baltimore & Ohio Railroad*, [372 U.S. 284](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372284/usrep372284.pdf), per curiam: the Railway Labor Act''s procedures exhausted, the carriers may put their new work rules in force. Firemen on diesel freight and yard engines the chief issue since 1959.'
    n: 'Statement by the President Upon Receiving Report of the Presidential Railroad Commission, [1962 Pub. Papers 173](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=233) (Feb. 28, 1962). CQ Almanac 1963. To check: [[w.commission-report]]; [[w.horowitz-manpower-utilization-in-the]]; [[w.dunlop-manpower-in-operating-classifications]]; [[w.kaufman-railroad-labor-dispute]]; [[w.cullen-national-emergency-strikes]]; [[w.comment-ad-hoc-compulsory-arbitration]]; [[w.cottrell-technological-change-and-labor]]; [[w.fisher-effect-of-the-removal]]; [[w.congress-and-the-nation]] (K–J Cong. II.L).'
    short: '*Locomotive Engineers v. B&O*'
