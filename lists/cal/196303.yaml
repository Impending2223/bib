  - id: cal.1963-03-07.civil-rights-the-executive
    when: Mar. 7
    date: '1963-03-07'
    thread: civil-rights-the-executive
    c: 'Kennedy to Katzenbach, recorded, on his Southern judges, after the news conference: "Is it real bad?" Katzenbach: "Not too good," of one; "They''re all Eastland''s." Kennedy asks a memorandum, "so I''ll be able to talk about it in case it comes up again."'
    n: '[John F. Kennedy and Nicholas Katzenbach](https://prde.upress.virginia.edu/conversations/4001466), JFK Dictabelt 11A.5 (PRDE only). [[w.reeves-president-kennedy]], 466; [[w.branch-parting-the-waters]], 700. Check: the recording not heard; the words Reeves''s, from the Library''s transcript. Check: Branch, 700, has the President''s answer at the news conference of Mar. 6: his four judges had done "a remarkable job in fulfilling their oaths of office" (New York Times, Mar. 7, 1963, 1, 4); Katzenbach: Cox "has not been good"; "I don''t think we have anything to be embarrassed about on that" (Dictabelt, Mar. 7, 1963, item 11A5). See [[cal.1963-03-06.economy]]. Names: Katzenbach, Eastland, Kennedy.'
