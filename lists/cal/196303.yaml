  - id: cal.1963-03-22.defense-soviet-forces
    when: Mar. 22
    date: '1963-03-22'
    thread: defense-soviet-forces
    c: NIE 11-4-63, Soviet Military Capabilities and Policies, 1962–1967. 80–85 operational ICBM launchers at the end of 1962, a few in hardened silos; 250–325 by mid-1964, 75–100 of them silos. Antimissile defenses perhaps the largest new Soviet program.
    n: '[FRUS 1961–63, VIII, doc. 130](https://history.state.gov/historicaldocuments/frus1961-63v08/d130). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
