  - id: cal.1963-03-11.defense
    when: Mar. 11
    date: '1963-03-11'
    thread: defense
    c: House extends the draft four years, to July 1, 1967, [388–3](https://voteview.com/rollcall/RH0880006). Signed Mar. 28, [77 Stat. 4](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg4.pdf).
    n: 'To check: [[w.flynn-draft-1940-1973]]. See [[cal.1961-02-06.defense]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-11.middle-east-yemen
    when: Mar. 11
    date: '1963-03-11'
    thread: middle-east-yemen
    c: 'Bunker reports to Kennedy: Faisal agrees to the plan in principle, with six conditions.'
    n: 'FRUS 1961–63, XVIII, docs. [187](https://history.state.gov/historicaldocuments/frus1961-63v18/d187), [189](https://history.state.gov/historicaldocuments/frus1961-63v18/d189), [202](https://history.state.gov/historicaldocuments/frus1961-63v18/d202) (Mar. 28). Check: the day of Faisal''s answer (docs. [180](https://history.state.gov/historicaldocuments/frus1961-63v18/d180), [181](https://history.state.gov/historicaldocuments/frus1961-63v18/d181), Dhahran, Mar. 7). See [[cal.1963-03-01.middle-east]]. Names: Bunker, Kennedy, Faisal ibn Abd al-Aziz Al Saud.'
    tags: [name:bunker-ellsworth, name:faisal-ibn-abd-al-aziz-al-saud, name:kennedy-john-f]
  - id: cal.1963-03-11.civil-rights-the-executive
    when: Mar. 11
    date: '1963-03-11'
    thread: civil-rights-the-executive
    c: 'St. Augustine, Fla., the quadricentennial''s opening: Johnson at the Fairchild Stratos plant, a memorial''s dedication and the banquet. He had come at Smathers''s asking, the local NAACP protesting segregated events; Reedy''s terms: Negroes invited to every event and seated at the banquet. Johnson to Mrs. Fullerwood, of the NAACP, Mar. 7: no event of his "will be segregated."'
    n: '[[w.caro-passage-of-power]], 251–53. To check: [[w.branch-pillar-of-fire]], 35–39; Roberts to Johnson, Mar. 1, 1963; Johnson to Fullerwood, Mar. 7, 1963, David Colburn Papers, University of Florida; Reedy''s report to Johnson on St. Augustine (cited by [[w.caro-passage-of-power]], 253). Names: Johnson, Smathers, Reedy.'
    src:
      c: 8b572b23
      rows:
        - 'w.caro-passage-of-power 251–53: all'
        - 'via w.caro-passage-of-power 253 n.peek-was-able: B'
        - 'via w.caro-passage-of-power 253 n.no-event: C'
        - 'via w.caro-passage-of-power 253 n.this-was-probably: A'
        - 'via w.caro-passage-of-power 252 n.he-didnt-want: A-B'
    tags: [name:johnson-lyndon-b, name:smathers-george-a, name:reedy-george-e]
  - id: cal.1963-03-11.middle-east
    when: Mar. 12
    date: '1963-03-12'
    thread: middle-east
    c: The United States recognizes the new regime in Syria.
    n: 'Department statement, press release 125, Mar. 12: [[w.department-of-state-bulletin]], [Apr. 1, 1963, 476](https://archive.org/details/departmentofstat4863unit/page/476/mode/1up). See [[cal.1963-03-08.middle-east]].'
  - id: cal.1963-03-12.state-and-city-finance-in
    when: Mar. 12
    date: '1963-03-12'
    thread: state-and-city-finance
    c: 'Indiana. Welsh calls the General Assembly into special session on his "2-2-2" plan: the State''s first sales tax, 2 percent; income taxes of 2 percent on persons and on corporations. Passed in the House; the Senate ties, and Lieutenant Governor Ristine (R) votes for it.'
    n: '[Wikipedia, "Matthew E. Welsh"](https://en.wikipedia.org/wiki/Matthew_E._Welsh) (Check: the acts, *Laws of Indiana*, special session 1963, and the Senate''s vote and date). To check: [[w.welsh-view-from-the-state]]; [[w.peirce-great-lakes-states-of]]. Names: Welsh, Ristine.'
    tags: [state:in, name:welsh-matthew-e, name:ristine-richard-o]
  - id: cal.1963-03-13.defense
    when: Mar. 13
    date: '1963-03-13'
    thread: defense
    c: House adds $363.7 million for the RS-70 to the President's request, Vinson's committee amendment, [226–179](https://voteview.com/rollcall/RH0880008). The procurement and research bill passes, [374–33](https://voteview.com/rollcall/RH0880010).
    n: 'H.R. 2440, 88th Cong. [109 Cong. Rec., House, Mar. 13, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt3/pdf/GPO-CRECB-1963-pt3-13-1.pdf). See [[cal.1962-03-21.defense]]. Names: Vinson.'
    tags: [name:vinson-carl]
