    when: Mar. 14
    date: '1963-03-14'
    thread: transition-and-staff
    also: [robert-kennedy]
    c: 'Robert Kennedy to the President: the best minds in the government should be used on the major problems, not only in crises; "You talk to McNamara but mostly on Defense matters, you talk to Dillon but primarily on financial questions."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 597–98. To check: Robert Kennedy to the President, Mar. 14, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 598 n.58). Names: Robert Kennedy, Kennedy, McNamara, Dillon.'
