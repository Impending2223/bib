  - id: cal.1963-03-05.alabama-birmingham
    when: Mar. 5
    date: '1963-03-05'
    thread: alabama-birmingham
    also: [mayors, elections-1963]
    c: 'Birmingham elects a mayor and nine councilmen. For mayor: Boutwell, former lieutenant governor, first; Connor second; Tom King third. Runoff Apr. 2 between Boutwell and Connor. Mar. 1, the State Supreme Court had upheld the November vote.'
    n: '*Reid v. City of Birmingham*, [274 Ala. 629](https://static.case.law/ala/274/case-pdfs/0629-01.pdf), 150 So. 2d 735 (1963). [[w.branch-parting-the-waters]], 703. Check: the returns. To check: [[w.eskew-but-for-birmingham]]; [[w.thornton-dividing-lines]]; [[w.mcwhorter-carry-me-home]]. See [[cal.1962-11-06.alabama-birmingham]]. Names: Boutwell, Connor, Tom King.'
