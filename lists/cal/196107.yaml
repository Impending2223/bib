    when: July
    date: 1961-07
    thread: transition-and-staff
    c: 'The President with Bowles, lunch, the White House pool and the family quarters: he may have been wrong not to make Bowles Secretary of State; the department has not given the new policies wanted; would Bowles go to Chile? Bowles wants no embassy; they will meet again the next week. By Bowles''s account.'
