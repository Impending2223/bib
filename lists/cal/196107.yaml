    when: July, early
    date: 1961-07
    thread: transition-and-staff
    c: 'Rusk to Bowles, instead of an answer to Bowles''s memorandum of late June on new directions: "Why don''t you free yourself from the department and take on the job of roving ambassador?" The idea, Rusk says, the President''s. By Bowles''s account.'
