    thread: berlin-and-vienna
    also: [testing]
    c: 'McCloy, the disarmament adviser, with Khrushchev at his dacha on the Black Sea. By McCloy''s cable, eyes only, July 29: Khrushchev cordial the first day, "Really mad on Thursday after digesting President''s speech": he will sign the peace treaty "no matter what"; occupation rights cease, access cut off; "war bound to be thermonuclear and though you and we may survive all your European allies will be completely destroyed." Then offers to negotiate.'
