    c: 'Zhou Enlai receives Prince Souphanouvong, chairman of the Lao Patriotic Front, back through Peking from Zurich, on the three princes'' Zurich talks: imperialism always makes trouble, and when at a disadvantage may concede and reach agreements to get breath and keep strength; decisions to rest chiefly on the Lao side''s struggle practice; good experience is to be spread and bad dropped; experience of success alone means failure some day.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 421 (July 3, 1961); [[w.zhou-enlai-waijiao-huodong]], 315 (July 3, 1961; 晚9时30分, 钓鱼台宾馆2号楼). Made public: 1993. Names: Zhou Enlai, Souphanouvong.'
