    n: '[[w.preston-war-council]], 69–70. To check: Kissinger to Bundy, July 7, 1961; Bundy to Kennedy, July 7, 1961; Kaysen to Bundy, July 3 and July 7, 1961, NSF, Country File, Germany, box 81A, Kennedy Library (cited by [[w.preston-war-council]], 70 n.43). Names: Kissinger, Bundy, Kennedy.'
