    thread: berlin-and-vienna
    c: 'The NSC on Berlin, the Cabinet Room, after four; the Steering Group first, in the President''s study. McNamara: no declaration of national emergency before Sept. 1 at the earliest, a limited call-up of reserves by authority of Congress; no fixed date for the larger call-up. Acheson, for an early decision, accepts the flexible timetable. Kennedy: unwise to add $3.5 billion without asking for taxes, though the recovery may suffer. The decisions to stress a "capability," not a present decision to deploy.'
    n: '[FRUS 1961–63, XIV, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v14/d77) (Bundy''s minutes). [[w.reeves-president-kennedy]], 195–96 (the NSC; no national emergency); [[w.preston-war-council]], 67 (Bundy''s advice before the meetings: serious military preparations); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 153 (the declaration of national emergency "allowed to die a quiet death"; Acheson agreeing to McNamara''s flexible timetable); [[w.poole-joint-chiefs-of-staff]], 147 (the NSC, "next day" after July 18: Acheson for a declaration of national emergency and a reserve call-up by September; McNamara''s flexible timetable, six Army and two Marine divisions in an active reserve, six divisions deployable to Europe by Jan. 1, 1962, without a national emergency or mobilizing major ground units; not the hour, the Steering Group, Acheson''s assent, Kennedy on taxes or the decisions). [[w.sorensen-kennedy]], 590. See [[cal.1961-07-13.berlin-and-vienna]]. Names: McNamara, Acheson, Kennedy.'
    src:
