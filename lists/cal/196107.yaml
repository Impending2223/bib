  - id: cal.1961-07-24.berlin-and-vienna
    when: July 24
    date: '1961-07-24'
    thread: berlin-and-vienna
    also: [economy, robert-kennedy]
    c: 'The day before the Berlin address, the President decides against asking a tax increase, word having come that Congress might cut foreign aid if he did. Five days of "great battle" before it, by Robert Kennedy''s notes dictated Aug. 1: he for the increase, with all the cabinet but perhaps Dillon, and Murrow; Sorensen, Heller and the Council of Economic Advisers against. The next weekend: "Why don''t you admit that you were wrong about it?"'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 428. [[w.reeves-president-kennedy]], 197–98 (the tax dropped; Heller''s and Samuelson''s case; "You were wrong"). To check: Robert Kennedy, dictated Aug. 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 428 n.49); Dutton to Kennedy, July 19, 1961, President''s Office Files, box 63, Kennedy Library; Minutes of the NSC meeting, July 20, 1961, National Security Files, box 313, Kennedy Library; Dillon to Sorensen, July 21, 1961, Sorensen Papers, box 40, Kennedy Library; Council of Economic Advisers to Sorensen, July 18, 1961, National Security Files, box 81, Kennedy Library (cited by [[w.reeves-president-kennedy]], 197); Council of Economic Advisers, oral history, Kennedy Library; Samuelson to Kennedy, "Economics of a Berlin Tax Rate Increase," July 23, 1961, Berlin papers, National Security Archive (cited by [[w.reeves-president-kennedy]], 198). The address: [[cal.1961-07-25.berlin-and-vienna]]. Names: Kennedy, Robert Kennedy, Dillon, Murrow, Sorensen, Heller. Check: the day ("The day before the speech"). Check: Reeves gives the economists'' case as the reason, not foreign aid (197–98).'
