  - id: cal.1961-07-04.china-leadership
    when: July 4
    date: '1961-07-04'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai receives Zhang Xueming and Zhu Luotiao, recalling his first contact with Zhang Xueliang in April 1936: Hanqing a frank man ready to criticize himself, who gave 30,000 fabi to the army; on secret contacts between the Communists and the Kuomintang at Taiwan, China''s greatest credit with Taiwan is keeping the secret and doing what it has promised, while Taiwan''s news often leaks to the Americans.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 421 (July 4, 1961). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, polity:roc, name:zhou-enlai, vis:only:prc]
