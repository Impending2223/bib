    also: [defense]
    c: 'Lemnitzer to McNamara: 559,000 more men, half of them Army, would not change the strategy of the United States or NATO, still anchored to a nuclear response; partial mobilization might show the West''s determination and set back a Soviet timetable.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 155; [[w.poole-joint-chiefs-of-staff]], 145–46 & n.28 (the JCS proposals to McNamara of July 12: the division-size probe, the corps-size thrust, a program built around a 559,000-man expansion; NATO''s "main reliance" on nuclear weapons; partial mobilization "would not generate enough conventional forces" for non-nuclear combat "on a broad scale"; the Joint Chiefs, not Lemnitzer alone; Poole cites JCSM-461-61, Kaplan JCSM-476-61, perhaps another paper of the day; not the Army''s half or the Soviet timetable). Check: the paper. [[w.poole-joint-chiefs-of-staff]], 146 n.28, cites JCSM-461-61 to SecDef, July 12, 1961 (JCS 1907/321); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 155 n.54 (and n.16), JCSM-476-61, Lemnitzer for SecDef, July 12; FRUS 1961–63, XIV, doc. [67](https://history.state.gov/historicaldocuments/frus1961-63v14/d67) n.3, a JCSM-467-61, "Partial Mobilization," July 12. Whether one paper or several the pages do not settle; JCSM-471-61 is dated July 13 (FRUS 1961–63, XXI, doc. [118](https://history.state.gov/historicaldocuments/frus1961-63v21/d118)), so a 476 of July 12 is out of sequence. To check: JCSM-476-61, Lemnitzer for SecDef, July 12, 1961, fldr 092 Germany (Berlin) Jul 61, box 51, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 155 n.54). See [[cal.1961-07-06.berlin-and-vienna-2]]. Names: Lemnitzer, McNamara.'
