  - id: cal.1961-07-01.china-leadership
    when: July 1
    date: '1961-07-01'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai with the delegates to the literary and art symposium and the feature film conference tours Fragrant Hills to mark the Party''s birthday; on the climb, with Zhao Dan on the novel *Daji and her father* turned into film: novel and film each have their strengths, the film better worked; Zhao keeps that the novel is better; Zhou says he may keep his view and Zhou his.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 420 (July 1, 1961). Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1961-07-02.opinion
    when: July 2
    date: '1961-07-02'
    thread: opinion
    also: [space]
    c: 'Gallup, May 28–June 2: of the programs Kennedy asked sacrifices for, would pay higher taxes for retraining the unemployed, 67 percent; the armed forces, 28; civil defense, 28; the information agency, 26; space research, 21; economic aid, 21; military aid, 9.'
    n: '[[w.gallup-poll]], III, 1724.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-07-02.middle-east-kuwait
    when: July 2–7
    date: '1961-07-02'
    time: 1961-07-02T15:30Z
    place: nyc
    thread: middle-east-kuwait
    c: 'Security Council on Kuwait. July 7: the British draft, for Kuwait''s independence, 7–1–3, vetoed by the Soviet Union; the UAR''s, for British withdrawal, 3–0–8. The United States for the first, abstaining on the second.'
    n: 'FRUS 1961–63, XVII, doc. [80](https://history.state.gov/historicaldocuments/frus1961-63v17/d80) (editorial note: the votes). The meeting: [S/PV.957](https://undocs.org/S/PV.957) (the hour, 11:30 a.m.). See [[cal.1961-06-25.middle-east]]. The time is the first day''s.'
  - id: cal.1961-07-02.china-leadership
    when: July 2
    date: '1961-07-02'
    thread: china-leadership
    also: [economy]
    c: 'Zhou Enlai reports to delegates of seven conferences (the metallurgical mine heads'' meeting among them) on the international and domestic situation, summing up past years'' lessons and tasks: first repair and complete sets, then make; stress economic accounting and effect, fewer losses, more accumulation, obey command.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 421 (July 2, 1961). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
