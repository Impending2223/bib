    when: July 4
    date: '1961-07-04'
    place: peking
    thread: china-leadership
    also: [vietnam-hanoi]
    c: 'Zhou Enlai receives the DRV''s water resources and electric power ministry''s delegation: controlling water is not easy; two thousand years of Chinese experience to be studied; survey, design and study time be long, from large to small; turn water harm to benefit with an active line but no haste; survey first, then design, then construction preparation, and not too much at once; resources reckoned jointly, not each department only its own; fighting nature means defeat before victory, "a hundred battles, a hundred victories" is illogical.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 421 (July 4, 1961); [[w.zhou-enlai-waijiao-huodong]], 315 (July 4, 1961; 晚上, 中南海西花厅). Made public: 1993. Names: Zhou Enlai.'
