  - id: cal.1961-07-25.berlin-and-vienna
    when: July 25
    date: '1961-07-25'
    thread: berlin-and-vienna
    also: [defense, economy]
    c: 'Report to the nation on Berlin. $3.25 billion more for defense; reserves to be called; draft calls tripled; fallout shelters. No new taxes: a temporary increase, which Kennedy had favored, dropped after Heller and Samuelson argued it would choke the recovery. No direct challenge to the Soviet zone.'
    n: 'Radio and Television Report to the American People on the Berlin Crisis, [1961 Pub. Papers 533](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=591) (July 25, 1961). [[w.schlesinger-thousand-days-1965]], 391–92 (the requests). The taxes: NSC minutes, July 19, 1961, [FRUS 1961–63, XIV, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v14/d77); [[w.stein-fiscal-revolution-in-america]], 391, 403 (the tax increase considered and dropped on the economists'' advice). The Republican leaders on Berlin and the budget: Joint Senate–House Republican Leadership minutes, July 27, 1961 (Dirksen Congressional Center; Opp. II.J). To check: [[w.sorensen-kennedy]]; [[w.heller-new-dimensions-of-political]], 32. See [[cal.1961-06-03.berlin-and-vienna]]. Recording (K–J Adm. II.I). Names: Kennedy, Heller, Samuelson, Nitze, Acheson. Check: who argued against the tax increase.'
