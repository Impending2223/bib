    when: July
    date: 1961-07
    thread: states-and-cities
    c: 'McCook, Neb., a dinner for the centenary of George Norris''s birth. Sorensen, the President''s special counsel, on Nebraska''s schools: budgets cut, federal aid opposed, teachers underpaid, the young leaving; the State left "a place to come from or a place to die." Nebraska Republicans demand that the Democrats apologize.'
    n: '[[w.peirce-great-plains-states-of]], 198–99. Check: the day; a text of the speech. Names: Sorensen.'
