    when: July, mid-month
    date: 1961-07
    thread: africa
    c: 'Kennedy accepts the Portugal task force''s proposals: a special envoy to Salazar for rapid change in Angola, Mozambique and Portuguese Guinea, quietly. Defense''s statement in the report: Lajes "the single most valuable facility" a foreign power lets the United States use. Williams of State for pressing Lisbon.'
