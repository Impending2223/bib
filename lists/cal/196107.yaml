  - id: cal.1961-07-25.china-leadership-3
    when: July 25
    date: '1961-07-25'
    place: yichun
    thread: china-leadership
    also: [china]
    c: 'Yichun. Liu Shaoqi inspects the Yichun timber processing plant, and at a meeting of the city''s forestry cadres says: use the forest resources fully, meet the needs of the state and every side as far as can be, and tie resources to needs; that is the work, from the Ministry of Forestry down to the forest farm. Wages and prices are to be adjusted together: buying prices high for small logs (for the labor) and cheap for big (labor saved); selling prices by grade, dearer for big logs; wages to follow buying prices. Good rules are to be restored; felling and regeneration are to be joined, artificial regeneration by contract to the farms, work sections, groups and families.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 533 (July 25, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
