    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 529–530 (July 14, 1961). The chronology marks it as a second item of the day (△). Footnote 1 (530) says Deng Xiaoping had forwarded the report to the Fujian committee and the East China Bureau before this, and Liu''s comment was not issued. Made public: 1996. To check: Zhang Dingcheng''s report on his investigation in the Minxi region, Fujian, and Deng Xiaoping''s forwarding of it to the Fujian committee and the East China Bureau (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 530 n.1a). Names: Liu Shaoqi, Deng Xiaoping.'
