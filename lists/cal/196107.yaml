  - id: cal.1961-07-13.electoral-college
    when: July 13
    date: '1961-07-13'
    thread: electoral-college
    also: [elections-1960, congress]
    c: Henry D. Irwin of Bartlesville, Okla., the Republican elector who voted for Byrd and Goldwater, before Kefauver's subcommittee. After the election he had worked for a "coalition plan," the Nixon–Lodge electors to vote for Byrd and Goldwater, with, he thought, the tacit support of the Republican National Committee and most Republican electors. Neither Byrd nor Goldwater had helped him. "I just did my patriotic duty to my country."
    n: 'Kefauver, [107 Cong. Rec. 13,366](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-6-1.pdf) (1961), with the *Louisville Courier-Journal*, July 17, and the *Washington Post*, July 19, 1961. See [[cal.1961-05-23.electoral-college]]; [[cal.1960-12-19.elections-1960]]. Names: Irwin, Kefauver, Byrd, Goldwater, Nixon, Lodge.'
    tags: [name:irwin-henry-d, name:kefauver-estes, name:byrd-harry-f, name:goldwater-barry-m, name:nixon-richard-m, name:lodge-henry-cabot]
