  - id: cal.1961-07-19.berlin-and-vienna
    when: July 19
    date: '1961-07-19'
    thread: berlin-and-vienna
    c: 'The NSC on Berlin, the Cabinet Room, after four; the Steering Group first, in the President''s study. McNamara: no declaration of national emergency before Sept. 1 at the earliest, a limited call-up of reserves by authority of Congress; no fixed date for the larger call-up. Acheson, for an early decision, accepts the flexible timetable. Kennedy: unwise to add $3.5 billion without asking for taxes, though the recovery may suffer. The decisions to stress a "capability," not a present decision to deploy.'
    n: '[FRUS 1961–63, XIV, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v14/d77) (Bundy''s minutes). [[w.reeves-president-kennedy]], 195–96 (the NSC; no national emergency). To check: Bundy to Kennedy, July 19, 1961, [FRUS 1961–63, XIV, doc. 76](https://history.state.gov/historicaldocuments/frus1961-63v14/d76) (cited by [[w.reeves-president-kennedy]], 195); Agenda, Record of Actions and Draft Record of Action, NSC meeting, July 19, 1961, National Security Files, box 313, Kennedy Library (cited by [[w.reeves-president-kennedy]], 196). See [[cal.1961-07-13.berlin-and-vienna]]. Names: McNamara, Acheson, Kennedy.'
    src:
      c: 4384210c
      rows:
