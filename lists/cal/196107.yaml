    date: '1961-07-03'
    place: geneva
    thread: china-leadership
    also: [laos]
    c: 'Geneva. Chen Yi, at the plenary meeting of the enlarged conference on Laos, proposes ending the general debate and passing to real negotiation in the spirit of "seeking common ground while keeping differences": first agree on a clear international agreement to respect Laos''s independence and neutrality, then discuss supervision effectively under better conditions. The Soviet, Polish and Vietnamese delegations back the Chinese delegation''s proposal.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 199 (July 3, 1961). See [[cal.1961-06-12.china-leadership-6]]. Names: Chen Yi.'
