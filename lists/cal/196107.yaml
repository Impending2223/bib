    c: At the Politburo, which takes up the "Fourteen points on the present work of natural science research organs (draft)" drawn up under Nie Rongzhen, Zhou Enlai says it may go to the finance, culture and education systems too; tell the cadres that if the Party serves scientists well, scientists serve socialism well. The Center issues it July 19.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 422 (July 6, 1961); [[w.macfarquhar-origins-of-the-cultural]], III, 98–99 (the Politburo hears Nie Rongzhen and Zhang Jingfu on the Fourteen Articles on Science: Liu, Zhou, Deng, Kang Sheng, Peng Zhen and Li Fuchun speak; Mao absent); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 528 (July 6, 1961; Liu presides at the Politburo meeting, which discusses and in the main passes Nie Rongzhen''s request report on several policy questions in current natural-science work and the National Science Commission Party group''s and Academy of Sciences Party group''s "Fourteen opinions on the present work of natural-science research bodies (draft)"; Liu in his summing up: a good document; the problem is that the work is biased and must be admitted; the Party''s leadership position in science is good, but there is a bias of blind command; "when there is a bias, correct it"; the Center issues both July 19); [[w.yang-shangkun-riji]], II, 48 (July 6, 1961; the Politburo, 3 to 7 p.m., on Nie Rongzhen''s report on science); [[w.deng-xiaoping-nianpu-1904]], III, 1647 (July 6, 1961; afternoon; Deng at Liu''s Politburo on Nie Rongzhen''s report and the Fourteen Articles on science. Deng: a good paper, to be tried and amended into "a constitution for scientific work"; the Party to make a lively, easy climate that yields results; leaders to befriend intellectuals, serve the scientists honestly). Made public: 1996. To check: [[w.rongzhen-inside-the-red-star]], 715–17 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 98 n.54); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 986 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 99 n.60). Names: Zhou Enlai, Nie Rongzhen.'
