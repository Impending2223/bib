list: cal
section: XX
entries:
  - id: cal.1961-07-01.middle-east-kuwait
    when: July 1
    date: '1961-07-01'
    thread: middle-east-kuwait
    c: British forces land in Kuwait, at the Ruler's request.
    n: 'FRUS 1961–63, XVII, doc. [75](https://history.state.gov/historicaldocuments/frus1961-63v17/d75) (Rusk, June 30). See [[cal.1961-06-25.middle-east]]. Names: Abdullah al-Salim al-Sabah.'
    tags: [name:abdullah-al-salim-al-sabah]
  - id: cal.1961-07-02.opinion
    when: July 2
    date: '1961-07-02'
    thread: opinion
    also: [space]
    c: 'Gallup, May 28–June 2: of the programs Kennedy asked sacrifices for, would pay higher taxes for retraining the unemployed, 67 percent; the armed forces, 28; civil defense, 28; the information agency, 26; space research, 21; economic aid, 21; military aid, 9.'
    n: '[[w.gallup-poll]], III, 1724.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-07-02.middle-east-kuwait
    when: July 2–7
    date: '1961-07-02'
    thread: middle-east-kuwait
    c: 'Security Council on Kuwait. July 7: the British draft, for Kuwait''s independence, 7–1–3, vetoed by the Soviet Union; the UAR''s, for British withdrawal, 3–0–8. The United States for the first, abstaining on the second.'
    n: 'FRUS 1961–63, XVII, doc. [80](https://history.state.gov/historicaldocuments/frus1961-63v17/d80) (editorial note: the votes). See [[cal.1961-06-25.middle-east]].'
  - id: cal.1961-07-05.opinion
    when: July 5
    date: '1961-07-05'
    thread: opinion
    also: [defense]
    c: 'Gallup, May 4–9: local civil defense handled well, 22 percent; poorly, 19; little or no knowledge of it, 59.'
    n: '[[w.gallup-poll]], III, 1724.'
  - id: cal.1961-07-05.berlin-and-vienna
    when: July 5
    date: '1961-07-05'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: 'Kornienko of the Soviet Embassy to Schlesinger on Berlin: "you don''t believe that we are sincere" about keeping West Berlin as it is; if the Soviet guarantees will not do, "why don''t you propose your own guarantees?"'
    n: '[[w.schlesinger-thousand-days-1965]], 385. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Kornienko, Schlesinger.'
    tags: [name:kornienko-georgi-m, name:schlesinger-arthur-m-jr]
  - id: cal.1961-07-07.opinion
    when: July 7
    date: '1961-07-07'
    thread: opinion
    also: [cuba]
    c: 'Gallup, June 23–28: tractors for the prisoners of the Cuban invasion, 20 percent for, 67 against.'
    n: '[[w.gallup-poll]], III, 1725.'
  - id: cal.1961-07-07.berlin-and-vienna
    when: July 7
    date: '1961-07-07'
    thread: berlin-and-vienna
    c: 'Schlesinger to Kennedy: Acheson''s paper avoids the political issues. Kennedy agrees and asks for an unsigned paper for Hyannis Port; Schlesinger, Chayes and Kissinger write it that afternoon: the political aim, the range of harassments short of blockade, what nuclear war would mean, the allies, the UN.'
    n: '[FRUS 1961–63, XIV, doc. 57](https://history.state.gov/historicaldocuments/frus1961-63v14/d57). [[w.schlesinger-thousand-days-1965]], 385–88 (the unsigned paper). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Schlesinger, Kennedy, Acheson, Chayes, Kissinger.'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f, name:acheson-dean-g, name:chayes-abram, name:kissinger-henry-a]
  - id: cal.1961-07-08.berlin-and-vienna
    when: July 8
    date: '1961-07-08'
    thread: berlin-and-vienna
    c: 'Hyannis Port. Kennedy with Rusk, McNamara and Taylor on Berlin. Within ten days: from Rusk a political prospectus; from McNamara a defense plan not resting mainly on nuclear weapons at the outset; from Kohler''s task force a check list of actions. By Schlesinger''s account Acheson asked for a political program too.'
    n: '[FRUS 1961–63, XIV, doc. 63](https://history.state.gov/historicaldocuments/frus1961-63v14/d63) (Taylor''s list of the actions agreed, July 12). [[w.schlesinger-thousand-days-1965]], 388–89. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Kennedy, Rusk, McNamara, Taylor, Kohler, Schlesinger, Acheson.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:kohler-foy-d, name:schlesinger-arthur-m-jr, name:acheson-dean-g]
  - id: cal.1961-07-11.governors-va
    when: July 11
    date: '1961-07-11'
    thread: governors
    also: [elections-1961]
    c: 'Virginia, Democratic primary for governor: Harrison, the attorney general, the Byrd organization''s candidate, over Stephens, the lieutenant governor, running against the organization, 199,519 to 152,639, 56.7 percent.'
    n: 'Votes: Wikipedia, ["1961 Virginia gubernatorial election"](https://en.wikipedia.org/wiki/1961_Virginia_gubernatorial_election), from Our Campaigns. [State Board of Elections, *Statement of the Vote*, Democratic Primary, July 11, 1961](https://va2.elstats2.civera.com/eng/files/serve/1111#page=3) (the Department of Elections'' historical database). To check: [[w.wilkinson-harry-byrd-and-the]]; [[w.heinemann-harry-byrd-of-virginia]]; [[w.ely-crisis-of-conservative-virginia]]. Names: Harrison, Stephens, Byrd.'
    tags: [state:va, name:harrison-albertis-s-jr, name:stephens-a-e-s, name:byrd-harry-f]
  - id: cal.1961-07-12.opinion
    when: July 12
    date: '1961-07-12'
    thread: opinion
    also: [testing]
    c: 'Gallup, June 23–28: the United States to resume nuclear tests now, 55 percent; not, 26.'
    n: '[[w.gallup-poll]], III, 1726.'
  - id: cal.1961-07-13.electoral-college
    when: July 13
    date: '1961-07-13'
    thread: electoral-college
    also: [elections-1960, congress]
    c: Henry D. Irwin of Bartlesville, Okla., the Republican elector who voted for Byrd and Goldwater, before Kefauver's subcommittee. After the election he had worked for a "coalition plan," the Nixon–Lodge electors to vote for Byrd and Goldwater, with, he thought, the tacit support of the Republican National Committee and most Republican electors. Neither Byrd nor Goldwater had helped him. "I just did my patriotic duty to my country."
    n: 'Kefauver, [107 Cong. Rec. 13,366](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-6-1.pdf) (1961), with the *Louisville Courier-Journal*, July 17, and the *Washington Post*, July 19, 1961. See [[cal.1961-05-23.electoral-college]]; [[cal.1960-12-19.elections-1960]]. Names: Irwin, Kefauver, Byrd, Goldwater, Nixon, Lodge.'
    tags: [name:irwin-henry-d, name:kefauver-estes, name:byrd-harry-f, name:goldwater-barry-m, name:nixon-richard-m, name:lodge-henry-cabot]
  - id: cal.1961-07-13.berlin-and-vienna
    when: July 13
    date: '1961-07-13'
    thread: berlin-and-vienna
    c: 'The NSC on Berlin. Rusk, from Acheson''s paper: no good position now to negotiate; a declaration of national emergency would have "a dangerous sound of mobilization." Acheson for decisive action, the Vice President agreeing. No decision.'
    n: 'FRUS 1961–63, XIV, docs. [66](https://history.state.gov/historicaldocuments/frus1961-63v14/d66) (Bundy), [67](https://history.state.gov/historicaldocuments/frus1961-63v14/d67). [[w.schlesinger-thousand-days-1965]], 389–90. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Rusk, Acheson, Johnson.'
    tags: [name:rusk-dean, name:acheson-dean-g, name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1961-07-17.mayors-new-orleans
    when: July 17
    date: '1961-07-17'
    thread: mayors
    c: New Orleans. Morrison, mayor since 1946, resigns to be Ambassador to the Organization of American States, confirmed July 14. The council names Schiro, a councilman at large, mayor.
    n: 'Morrison: [POCOM](https://history.state.gov/departmenthistory/people/morrison-delesseps-story); CR, Senate, July 5 and 14, 1961. To check: [[w.haas-delesseps-s-morrison-and]]. Names: Morrison, Schiro.'
    tags: [name:morrison-delesseps-s, name:schiro-victor-h, state:la, city:new-orleans]
  - id: cal.1961-07-17.transition-and-staff
    when: July 17
    date: '1961-07-17'
    thread: transition-and-staff
    c: 'The *New York Times*, front page: Kennedy to ask for Bowles''s resignation today. Kennedy, flying back from the Cape: a management problem become "a symbolic question." Sees Rusk, then Bowles. Bowles stays.'
    n: '[[w.schlesinger-thousand-days-1965]], 437–42. See [[cal.1961-01-20.transition-and-staff]]. Names: Bowles, Kennedy, Rusk.'
    tags: [name:bowles-chester, name:kennedy-john-f, name:rusk-dean]
  - id: cal.1961-07-18.school-aid
    when: July 18
    date: '1961-07-18'
    thread: school-aid
    c: House Rules Committee votes 8–7 to hold the school bills. Delaney, a Catholic Democrat, joins the conservatives over parochial aid. The enlarged committee fails its first test.
    n: 'News Conference, [1961 Pub. Papers 513](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=571) (July 19, 1961). To check: [[w.mcandrews-broken-ground]]. See [[cal.1961-02-20.school-aid]]. Names: Delaney, Smith.'
    tags: [name:delaney-james-j, name:smith-howard-w]
  - id: cal.1961-07-19.africa
    when: July 19–22
    date: '1961-07-19'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'Bizerte. Tunisia blockades the French naval base; French paratroops land, and the town is fought over. The United States and Britain urge a cease-fire on France and Tunisia. Security Council, July 22, Resolution 164, 10–0, France not voting: an immediate cease-fire, the forces back to their former positions.'
    n: '[S.C. Res. 164](https://undocs.org/S/RES/164(1961)) (July 22, 1961). FRUS 1961–63, XXI, docs. [165](https://history.state.gov/historicaldocuments/frus1961-63v21/d165), [166](https://history.state.gov/historicaldocuments/frus1961-63v21/d166), [167](https://history.state.gov/historicaldocuments/frus1961-63v21/d167). To check: [[w.muehlenbeck-betting-on-the-africans]].'
  - id: cal.1961-07-19.transition-and-staff
    when: July 19
    date: '1961-07-19'
    thread: transition-and-staff
    c: 'Press conference: he has never asked for Bowles''s resignation, nor has Bowles offered it; "I have a high regard for Mr. Bowles."'
    n: 'The President''s News Conference, [1961 Pub. Papers 513](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=571), 518–19 (July 19, 1961). [[w.schlesinger-thousand-days-1965]], 442. See [[cal.1961-07-17.transition-and-staff]]. Names: Kennedy, Bowles.'
    tags: [name:kennedy-john-f, name:bowles-chester]
  - id: cal.1961-07-20.defense
    when: July 20
    date: '1961-07-20'
    thread: defense
    also: [conservation]
    c: Civil defense moved from the Office of Civil and Defense Mobilization to the Pentagon. Water pollution amendments signed, [75 Stat. 204](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg204.pdf).
    n: '[Exec. Order No. 10,952](https://www.presidency.ucsb.edu/documents/executive-order-10952-assigning-civil-defense-responsibilities-the-secretary-defense-and), [26 Fed. Reg. 6577](https://www.govinfo.gov/app/details/FR-1961-07-22). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 30. To check: [[w.milazzo-unlikely-environmentalists]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-07-20.testing
    when: July 20
    date: '1961-07-20'
    thread: testing
    c: Bundy, Sorensen and Schlesinger with Kennedy on Murrow's and Schlesinger's proposals for the test ban. The Geneva talks to go on, Dean back to them, the neutral states canvassed. Kennedy not convinced resumed testing would gain more than it cost.
    n: '[[w.schlesinger-thousand-days-1965]], 455–56. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-09-01.testing]]. Names: Bundy, Sorensen, Schlesinger, Kennedy, Murrow, Dean.'
    tags: [name:bundy-mcgeorge, name:sorensen-theodore-c, name:schlesinger-arthur-m-jr, name:kennedy-john-f, name:murrow-edward-r, name:dean-arthur-h]
  - id: cal.1961-07-21.space
    when: July 21
    date: '1961-07-21'
    thread: space
    c: Grissom's suborbital flight.
    n: 'Remarks Upon Signing Bill Providing for an Expanded Space Program, [1961 Pub. Papers 525](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=583). See [[cal.1961-04-12.space]]. Names: Grissom.'
    tags: [name:grissom-virgil-i]
  - id: cal.1961-07-24.crime-and-hijacking
    when: July 24
    date: '1961-07-24'
    thread: crime-and-hijacking
    c: An Eastern Air Lines flight hijacked to Havana.
    n: '[FRUS 1961–63, X, doc. 252](https://history.state.gov/historicaldocuments/frus1961-63v10/d252). See [[cal.1961-05-01.crime-and-hijacking]].'
  - id: cal.1961-07-25.berlin-and-vienna
    when: July 25
    date: '1961-07-25'
    thread: berlin-and-vienna
    also: [defense]
    c: Report to the nation on Berlin. $3.25 billion more for defense; reserves to be called; draft calls tripled; fallout shelters. No direct challenge to the Soviet zone.
    n: 'Radio and Television Report to the American People on the Berlin Crisis, [1961 Pub. Papers 533](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=591) (July 25, 1961). [[w.schlesinger-thousand-days-1965]], 391–92. See [[cal.1961-06-03.berlin-and-vienna]]. Recording (K–J Adm. II.I). Names: Nitze, Acheson.'
    tags: [name:kennedy-john-f, name:nitze-paul, name:acheson-dean-g]
  - id: cal.1961-07-25.economy
    when: July 25
    date: '1961-07-25'
    thread: economy
    c: The Berlin requests come without new taxes. A temporary tax increase to pay for them, which Kennedy had favored, was dropped after Heller and Samuelson argued it would choke the recovery. Check who argued against it.
    n: 'NSC minutes, July 19, 1961, [FRUS 1961–63, XIV, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v14/d77). Radio and Television Report to the American People on the Berlin Crisis, [1961 Pub. Papers 533](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=591) (July 25, 1961). The Republican leaders on Berlin and the budget: Joint Senate–House Republican Leadership minutes, July 27, 1961 (Dirksen Congressional Center; Opp. II.J). [[w.stein-fiscal-revolution-in-america]], 391, 403 (the tax increase considered and dropped on the economists'' advice). To check: [[w.sorensen-kennedy]]; [[w.heller-new-dimensions-of-political]], 32. See [[cal.1961-07-25.berlin-and-vienna]] (Berlin and Vienna). Names: Heller, Samuelson.'
    tags: [name:kennedy-john-f, name:heller-walter-w, name:samuelson-paul-a]
  - id: cal.1961-07-27.confirmations
    when: July 27
    date: '1961-07-27'
    thread: confirmations
    also: [civil-rights-the-executive]
    c: Spottswood W. Robinson III, dean of Howard's law school, confirmed to the Civil Rights Commission, [73–17](https://voteview.com/rollcall/RS0870104).
    n: '[107 Cong. Rec., Senate, July 27, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-8-1.pdf). See [[cal.1961-03-07.confirmations]]. Names: Robinson.'
    tags: [name:robinson-spottswood-w-iii]
  - id: cal.1961-07-30.berlin-and-vienna
    when: July 30
    date: '1961-07-30'
    thread: berlin-and-vienna
    c: 'Fulbright on television: the East Germans have the right to close their border, and he does not know why they have not.'
    n: '[Cong. Rec., Senate, Aug. 1, 1961, 14222–14225](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-2-1.pdf#page=28) (the program''s transcript). To check: [[w.woods-fulbright]]; [[w.kempe-berlin-1961]]. Names: Fulbright.'
    tags: [name:fulbright-j-william]
  - id: cal.1961-07-30.opinion
    when: July 30
    date: '1961-07-30'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, June 23–28: of the 76 percent who had followed the Berlin dispute, 82 percent would keep American forces in Berlin at the risk of war, 7 would not. July 13–18: if East Germany closes the roads and air access, fight the way in, 71; not, 15.'
    n: '[[w.gallup-poll]], III, 1729.'
  - id: cal.1961-07-31.opinion
    when: July 31
    date: '1961-07-31'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, July 13–18: if Russia insists on controlling Berlin, war, 60 percent; no war, 31. Chances Russia gives in by year''s end very good, 36.'
    n: '[[w.gallup-poll]], III, 1729.'
  - id: cal.1961-07-31.european-community
    when: July 31
    date: '1961-07-31'
    thread: european-community
    c: 'Macmillan to the Commons: Britain to apply under Article 237 of the Rome Treaty, to learn whether the special interests of Britain, the Commonwealth and the EFTA can be met.'
    n: 'HC Deb, [July 31, 1961](https://api.parliament.uk/historic-hansard/commons/1961/jul/31/european-economic-community-government), vol. 645, cc. 928–42. FRUS 1961–63, XIII, doc. [14](https://history.state.gov/historicaldocuments/frus1961-63v13/d14) (Macmillan to Kennedy, July 28). To check: [[w.camps-britain-and-the-european]]; [[w.macmillan-at-the-end-of]]; [[w.zeiler-american-trade-and-power]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.ludlow-dealing-with-britain]]; [[w.young-this-blessed-plot]]; [[w.milward-uk-and-the-european]]. See [[cal.1961-04-05.european-community]]. Names: Macmillan.'
    tags: [name:macmillan-harold, name:kennedy-john-f]
