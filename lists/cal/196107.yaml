  - id: cal.1961-07-07.opinion
    when: July 7
    date: '1961-07-07'
    thread: opinion
    also: [cuba]
    c: 'Gallup, June 23–28: tractors for the prisoners of the Cuban invasion, 20 percent for, 67 against.'
    n: '[[w.gallup-poll]], III, 1725.'
  - id: cal.1961-07-07.berlin-and-vienna
    when: July 7
    date: '1961-07-07'
    thread: berlin-and-vienna
    c: 'Schlesinger to Kennedy: Acheson''s paper avoids the political issues. Kennedy agrees and asks for an unsigned paper for Hyannis Port; Schlesinger, Chayes and Kissinger write it that afternoon: the political aim, the range of harassments short of blockade, what nuclear war would mean, the allies, the UN.'
    n: '[FRUS 1961–63, XIV, doc. 57](https://history.state.gov/historicaldocuments/frus1961-63v14/d57). [[w.schlesinger-thousand-days-1965]], 385–88. [[w.reeves-president-kennedy]], 191–92. To check: Abram Chayes, oral history, 245–50, Kennedy Library; Chayes, Kissinger and Schlesinger to Kennedy, July 7, 1961, quoted in Schlesinger, *A Thousand Days*, 387–88 (cited by [[w.reeves-president-kennedy]], 192). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Schlesinger, Kennedy, Acheson, Chayes, Kissinger.'
    src:
      c: 329f2b34
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d57: all'
        - 'w.schlesinger-thousand-days-1965 386–88: all'
        - 'w.reeves-president-kennedy 191–92: all'
        - 'via w.reeves-president-kennedy 192 n.the-three-men-from-harvard.a: C'
        - 'via w.reeves-president-kennedy 192 n.the-three-men-from-harvard.b: C'
        - 'via w.reeves-president-kennedy 192 n.the-paper-indicates-no-relationship: C'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f, name:acheson-dean-g, name:chayes-abram, name:kissinger-henry-a]
  - id: cal.1961-07-07.robert-kennedy
    when: July 7
    date: '1961-07-07'
    thread: robert-kennedy
    also: [crime-and-hijacking]
    c: 'Courtney Evans to Belmont, of a talk with Robert Kennedy on organized crime: the Attorney General told the FBI was using microphones in such cases, and "pleased we had been using microphone surveillances, where these objections do not apply, wherever possible in organized crime matters." Evans, in 1975: he had been "purposely vague," and had not described the kinds of surveillance or how the devices were installed.'
    n: '[S. Rep. No. 94-755, Book III, 368 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=378) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 275–76 (the memorandum; Evans''s testimony; and a meeting on organized crime that July at which, by Silberling''s and Blakey''s accounts of 1966, Kennedy asked for more "technical equipment"). To check: Blakey to Robert Kennedy, Dec. 14, 1966, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 275 n.60); Evans to Robert Kennedy, Feb. 17, 1966 (quoted in Toledano, *J. Edgar Hoover*, 318–19) (cited by [[w.schlesinger-robert-kennedy-and-his]], 275 n.63). Made public: S. Rep. No. 94-755, Book III (1976). Names: Evans, Belmont, Robert Kennedy. Check: Schlesinger''s note gives the report''s page as 468; the passage is at 368 (and 113–14).'
    src:
      c: 2ddf03d4
      rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=378: all'
        - 'w.schlesinger-robert-kennedy-and-his 275–76: all'
        - 'via w.schlesinger-robert-kennedy-and-his 275 n.61: A'
        - 'via w.schlesinger-robert-kennedy-and-his 275 n.62: B'
        - 'via w.schlesinger-robert-kennedy-and-his 275 n.60: A'
        - 'via w.schlesinger-robert-kennedy-and-his 275 n.63: B'
    tags: [name:evans-courtney-a, name:belmont-alan-h, name:kennedy-robert-f]
  - id: cal.1961-07-08.berlin-and-vienna
    when: July 8
    date: '1961-07-08'
    thread: berlin-and-vienna
    c: 'Hyannis Port. Kennedy with Rusk, McNamara and Taylor on Berlin. Within ten days: from Rusk a political prospectus; from McNamara a defense plan not resting mainly on nuclear weapons at the outset; from Kohler''s task force a check list of actions. By Schlesinger''s account Acheson asked for a political program too.'
    n: '[FRUS 1961–63, XIV, doc. 63](https://history.state.gov/historicaldocuments/frus1961-63v14/d63) (Taylor''s list of the actions agreed, July 12). [[w.schlesinger-thousand-days-1965]], 388–89. [[w.reeves-president-kennedy]], 192–93 (the meeting at Hyannis Port). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Kennedy, Rusk, McNamara, Taylor, Kohler, Schlesinger, Acheson.'
    src:
      c: 8ac45faf
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d63: all'
