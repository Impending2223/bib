    thread: goldwater
    also: [conservative-movement, elections-1964]
    c: 'Washington, the House restaurant. Rusher, publisher of *National Review*, with Ashbrook (R-Ohio): the party''s leadership empty, the old Young Republican faction perhaps its third or fourth largest. In his office Ashbrook shows him his files of contacts from his years as national chairman of the Young Republicans: "These people still know me." By White''s account.'
    n: '[[w.white-suite-3505]], 31–32; [[w.kabaservice-rule-and-ruin]], 52 (Rusher and Ashbrook after the Young Republicans'' convention; the alumni to take the party). Names: Rusher, Ashbrook.'
