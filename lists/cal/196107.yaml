  - id: cal.1961-07-18.school-aid
    when: July 18
    date: '1961-07-18'
    thread: school-aid
    c: House Rules Committee votes 8–7 to hold the school bills. Delaney, a Catholic Democrat, joins the conservatives over parochial aid. The enlarged committee fails its first test.
    n: 'News Conference, [1961 Pub. Papers 513](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=571) (July 19, 1961). To check: [[w.mcandrews-broken-ground]]. See [[cal.1961-02-20.school-aid]]. Names: Delaney, Smith.'
