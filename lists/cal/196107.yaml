  - id: cal.1961-07-31.china-leadership
    when: July 31
    date: '1961-07-31'
    place: harbin
    thread: china-leadership
    also: [china]
    c: 'Harbin. Liu Shaoqi receives the responsible cadres of the Northeast and Inner Mongolia forestry work conference and the Heilongjiang committee''s secretariat members. Planting and regeneration are to be valued; many leaders attend only to cutting. Regeneration is mainly artificial, with artificial promotion of natural regeneration. On felling, Japanese, old China''s and Chinese Republic''s methods were bad: cutting only the thick logs; the aim now is to get timber and also to help young trees grow; clear-felling harms young trees too much and selective cutting may serve the forest better.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 534 (July 31, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
