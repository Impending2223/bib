  - id: cal.1961-07-17.china-leadership-4
    when: July 17
    date: '1961-07-17'
    place: shenyang
    thread: china-leadership
    also: [china]
    c: Shenyang. Liu Shaoqi hears the Northeast Bureau's officials on their work. Some now have doubts, grievances and complaints and ask to speak; let them, and do not stop them for a doubt. The three red banners may be doubted a few years, but difficulties are not to be used to make trouble; make an effort and unite to get past them. The people's communes have advantages; what was lost was the advanced cooperatives' set of ways, egalitarianism, supply, mess halls; with the advanced cooperatives kept the communes could have more. If the advantages are not seen, it is hard to persuade the peasants; when the economy recovers in three or five years the communes will show more, and then the argument will be with facts. Forestry needs long-range planning, or the resource is ruined, and cutting methods need study.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 530–531 (July 17, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
