    c: The Foreign Ministry's statement exposes the U.S. "pause in the bombing" as a fraud. The U.S. said it would suspend bombing of Vietnam from May 12, and in less than a week announced that it would resume; a bombing fraud is a war fraud, and a "pause" is a war fraud also; neither settles the Vietnam question. Any new U.S. military adventure will not reach its end, only meet a stronger counterblow.
