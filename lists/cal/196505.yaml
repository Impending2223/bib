  - id: cal.1965-05-31.vietnam
    when: May 31
    date: '1965-05-31'
    place: peking
    thread: vietnam-diplomacy
    also: [china]
    c: 'Peking.{1} Chen Yi calls in the British chargé d''affaires and asks that London pass four points to Washington: China will not provoke war with the United States;{2} what China says counts; China is prepared; if the United States bombs China, that means war, with no limits.{3} China supports Vietnam unconditionally, but will take direct part only if the war reaches Chinese territory.{4} The same message, Chen Yi says, Zhou Enlai gave Ayub Khan, whose visit to Washington was put off.{5}'
    n: '[FRUS 1964–68, II, doc. 321](https://history.state.gov/historicaldocuments/frus1964-68v02/d321) (editorial note). [[w.jian-maos-china-and-the]], 217–18 (by Hopson''s telegram to the Foreign Office, No. 720); [[w.zhai-china-and-the-vietnam]], 138 (by FRUS''s editorial note; Zhou''s message to Ayub); [[w.77-conversations-between-chinese]], 77–81 (Zhou Enlai with Ayub Khan, doc. 6, headed Karachi, Apr. 2, 1965: three points, not four); [[w.jian-zhou-enlai]], 523–524 (May 31: Chen Yi summons Hopson, the British chargé: Zhou had asked Ayub Khan to carry a message on Vietnam, likely not delivered; Peking would "be grateful" if London passed the three points while "pressuring the Americans to withdraw from South Vietnam"); [[w.khoo-collateral-damage]], 31 (Chen Yi to the British chargé, Donald Charles Hopson, May 31: the four points, war "without limits" if China is bombed; Ayub Khan''s visit to Washington canceled); [[w.chen-yi-nianpu]], 1100 (May 31, 1965, morning; Britain''s new chargé d''affaires, Hopson 霍普森, calls on Chen Yi (拜会); the nianpu gives no matter). Check: the transcript (77 Conversations, doc. 6, 77) is headed Karachi, Apr. 2, 1965, and gives three points; Chen cites it at 79–85, the Wilson Center''s copy prints it at 76–81. Check: [[w.jian-zhou-enlai]], 524 n.21a, dates the Chinese record of Chen Yi''s conversation with Hopson May 30, 1965; its text and Hopson''s telegrams, May 31. To check: [[w.hershberg-reading-and-warning-the]]; [[w.hershberg-informing-the-enemy]]; Peking (Hopson) to the Foreign Office, No. 720, May 31, 1965, FO 371/180996, Public Record Office (cited by [[w.jian-maos-china-and-the]], 217 n.58); the transcript of Zhou Enlai''s conversation with Ayub Khan, Apr. 2, 1965, in [[w.77-conversations-between-chinese]], 79–85 (cited by [[w.jian-maos-china-and-the]], 217 n.55, for Zhou''s message); Vice Premier Chen Yi''s conversation with British chargé d''affaires Hopson, May 30, 1965, 110-01254-03 (printed "11001254-03"), Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 524 n.21a); Chinese Foreign Ministry''s circular about Vice Premier Chen Yi''s conversation with British chargé d''affaires Hopson, June 20, 1965, 110-01254-01, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 524 n.21b); Peking (Mr. Hopson) to FO, No. 721, Priority/Confidential, May 31, 1965, FO 371/180996 (cited by [[w.jian-zhou-enlai]], 524 n.21c). Names: Chen Yi, Zhou Enlai, Ayub Khan. Check: FRUS has Zhou and Ayub meet in Peking, Apr. 2 (II, doc. 321), or in Ayub''s March visit there (XXX, doc. 88 n. 4); Chen, 217, at Karachi, Apr. 2; Zhai, 138, "during his visit to Pakistan on April 2."'
