  - id: cal.1965-05-29.vietnam-operations
    when: May 29–30
    date: '1965-05-29'
    place: ba-gia
    thread: vietnam-operations
    c: 'Ba Gia, west of Quảng Ngãi city.{1} A Viet Cong force, probably a regiment, attacks a South Vietnamese company clearing a road and ambushes the two companies sent after it;{2} May 30, three more battalions committed and beaten.{3} South Vietnamese losses: 107 killed, 123 wounded, 367 missing, 384 weapons.{4}'
    n: '[FRUS 1964–68, II, doc. 322](https://history.state.gov/historicaldocuments/frus1964-68v02/d322) (Taylor to Johnson, June 1). [[w.def-u-s-viet-rels-iv-c-5]], 33, 82; [[w.carland-united-states-army-in]], 45; [[w.vietnam-victory-in-vietnam]], 144–45, 461–62 nn.31–32 (the campaign; the relief task force of May 30 destroyed); [[w.schlight-united-states-air-force]], 46 (the battle, May 29–30); [[w.westmoreland-soldier-reports]], 136 (later in May; a Viet Cong regiment virtually destroys an ARVN battalion in an ambush and mauls a second); [[w.bernstein-guns-or-butter]], 347 (two South Vietnamese battalions destroyed near Quảng Ngãi); [[w.drea-mcnamara-clifford-and-the-2011]], 33 (the battle, May 29 to June 4); [[w.lich-su-khang-chien-chong-my]], III, 423–27 (Region 5''s Ba Gia campaign, Chu Huy Mân commanding, from the night of May 28; a Saigon First Battalion destroyed May 29 at Phước Lộc; May 30 the Third Marine Battalion mostly destroyed, the Second of the 51st mauled); [[w.lich-su-khang-chien-chong-my]], III, 422–29 (the Ba Gia campaign of Regiment 1, Military Region 5, Chu Huy Mân commanding: May 29, the regiment''s sappers and a Sơn Tịnh platoon hit the Self-Defense at Phước Lộc; two companies of the 1st Battalion, 51st Regiment, with two American advisers, coming down from Gò Cao, are surrounded by Battalion 90 at 9:50 a.m. and finished at 10:45, Capt. Nguyễn Văn Ngọc taken; May 30, the task force Nguyễn Chánh Thi formed the afternoon before, the 3d Marine Battalion, Ranger Battalions 37 and 39 and the 2d Battalion of the 51st, sets out from Sơn Tịnh at 9:30 a.m. with 20 GMC trucks and 12 M113s and is fought at Chóp Nón, hill 47, Mả Tổ and Phước Lộc; the night of May 30–31 Battalion 60 takes hill 47 and Mả Tổ and the Marines in them, Battalion 45 Chóp Nón at 3:30 a.m.). [[w.macv-command-history-1965]], 221–22 (the ambushes of May 29–30; the losses). To check: COMUSMACV MILREP, 070742Z Jun 65 (cited by [[w.macv-command-history-1965]], 222 n.257). Check: *Victory in Vietnam* opens the campaign the evening of May 25 at a Popular Forces post, a battalion of the 51st Regiment destroyed coming to its relief; the relief task force of May 30 destroyed on the road to Ba Gia; the campaign 51 days, 2,054 of the enemy put out of action (144–45, 462 n.32). Check: Schlight, 46, has a platoon caught on the road May 29 and the rest of its battalion destroyed coming to its relief; the three battalions sent May 30 hold Ba Gia, the enemy breaking off June 4.'
