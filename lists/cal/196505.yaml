  - id: cal.1965-05-01.latin-america-dominican-republic
    when: May 1–2
    date: '1965-05-01'
    thread: latin-america-dominican-republic
    c: 'Palmer asks four more airborne battalions and a third of Marines. 6:40 p.m., Wheeler asks for three plans to confine the rebels to the south and east of the city; Masterson, 2:14 a.m. May 2: Plan A, 18 battalions and seven days, Plan B 15 and 24 hours, Plan C 12 over three to five days. 1:03 p.m. May 2 the Chiefs choose B, a corridor at dawn May 3, and approve another Marine battalion and the five uncommitted battalions of the 82nd.'
    n: '[[w.poole-joint-chiefs-of-staff-2012]], 141–42. See [[cal.1965-04-29.latin-america-dominican-republic-2]]. Names: Palmer, Wheeler.'
    src:
      c: bb1e8c0c
      rows:
        - 'w.poole-joint-chiefs-of-staff-2012 141–42: all'
    tags: [name:palmer-bruce-jr, name:wheeler-earle]
  - id: cal.1965-05-01.latin-america-dominican-republic-2
    when: May 1
    date: '1965-05-01'
    thread: latin-america-dominican-republic
    c: Santo Domingo. The Marines set up the international security zone, some three square miles in the southwest of the city, the embassy and the Embajador within it. The paratroopers, from San Isidro, move west about 10 a.m., take the Duarte Bridge over the Ozama, and hold a bridgehead on the west bank. Firefights; Caamaño protests. Moorer becomes CINCLANT.
    n: '[FRUS 1964–68, XXXII: Dominican Republic; Cuba; Haiti; Guyana, doc. 99](https://history.state.gov/historicaldocuments/frus1964-68v32/d99) (the zone set up May 1). [[w.drea-mcnamara-clifford-and-the-2011]], 298, 301–03. Check: McNamara''s memorandum has 400 Army troops landing late May 1 and 1,600 early May 2 securing San Isidro, the Duarte Bridge and part of the east bank. Palmer to the NMCC, 4:45 a.m.: no "offensive action" that might void the cease-fire (Drea, 301). To check: "Military Operations in the Dominican Republic—An Overview," about July 12, 1965, 5, SecDef Subject Decimal files, Acc 70A-1266 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 298 n.29); Santo Domingo''s 1217, May 1, 1965; the Palmer interview by Gittinger, May 28, 1982, LBJ Library (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 301 n.40). See [[cal.1965-04-30.latin-america-dominican-republic-2]]. Names: Caamaño, Moorer.'
    src:
      c: ac9af658
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d99: B'
        - 'w.drea-mcnamara-clifford-and-the-2011 298, 301–03: all'
        - 'via x.1965-05-26.mcnamara-to-president-dominican-withdrawal: B'
        - 'via x.1965-07-12.military-operations-dominican-overview: B-C'
        - 'via x.1982-05-28.palmer-interview-gittinger: C-E'
    tags: [name:caamano-deno-francisco, name:moorer-thomas, name:palmer-bruce-jr]
