    c: 'Zhou talks with Nguyễn Văn Hiếu and Nguyễn Thị Bình of the National Liberation Front of South Vietnam in the Great Hall of the People.{1} Zhou tells them the four sentences he asked Ayub Khan to give the U.S.: China will never start a war with the U.S.; it will go to Vietnam if Vietnam is in need, as in Korea; it is ready, the border provinces and the whole country; if the U.S. carries the war into China it has no limits, an air war from the U.S., a ground war from China.{2}'
    n: '[[w.zhou-enlai-waijiao-huodong]], 455 (May 16, 1965; Great Hall of the People; the time not given; the book names them 阮文孝 and 阮氏萍 and gives no content); [[w.77-conversations-between-chinese]], [83–84](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=81) (doc. 8; Beijing, the Great Hall of the People, May 16, 1965, no hour: Zhou on his talks with Ayub Khan before Ayub''s trip to the U.S., the four sentences, peaceful coexistence on the five principles, Taiwan and Vietnam; 83 n.126, Nguyễn Văn Hiếu and Nguyễn Thị Bình). Made public: 1993. Names: Zhou Enlai, Nguyễn Văn Hiếu, Nguyễn Thị Bình, Ayub Khan.'
