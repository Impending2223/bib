  - id: cal.1965-05-02.latin-america
    when: May 2
    date: '1965-05-02'
    thread: latin-america-dominican-republic
    c: Report to the nation on the Dominican Republic, after meeting the congressional leaders. The revolt "taken over" by "a band of Communist conspirators." "The American nations cannot, must not, and will not permit the establishment of another Communist government in the Western Hemisphere." Two battalions, 2,000 men, ordered that morning; 4,500 more that evening.
    n: Radio and Television Report to the American People on the Situation in the Dominican Republic, [1965 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=545) (May 2, 1965); Statement by the President Upon Sending Additional Forces to the Dominican Republic, [1965 Pub. Papers 466](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=542) (May 1, 1965). FRUS 1964–68, XXXII, docs. [51](https://history.state.gov/historicaldocuments/frus1964-68v32/d51), [52](https://history.state.gov/historicaldocuments/frus1964-68v32/d52). See [[cal.1965-04-28.latin-america]].
    tags: [name:johnson-lyndon-b]
