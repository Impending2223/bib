    c: 'House passes the $700 million for Vietnam, [408–7](https://voteview.com/rollcall/RH0890047), after an hour''s debate.{1} McCormack: failure could lead to "appeasement"; Albert: "the road of appeasement is the road to war." Ford: the House''s Republicans unanimously behind the "policy of firmness." Laird and Cederberg against the teach-ins; Laird to go to the White House''s leadership meetings only with an agenda. Edith Green against: "a vote for that delusion."{2}'
    n: '[111 Cong. Rec. 9518–41](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-6-2.pdf) (1965) (the debate). [[w.gibbons-u-s-government-and]], III, 243–245; [[w.barrett-uncertain-warriors]], 48–51 (the request for $700 million, put in mid-May by Barrett; the House''s vote, 418 to 7); [[w.zaroulis-who-spoke-up]], 42 (the House 408–7, within forty-eight hours; the day not given). The House sat from noon to 5:48 p.m.: [Daily Digest, D209](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=207). Check: Barrett, 48, 51, puts the debates in mid-May and gives the House''s vote as 418 to 7. See [[cal.1965-05-04.vietnam]]. Names: McCormack, Albert, Ford, Laird, Cederberg, Edith Green.'
