    when: May 5
    date: '1965-05-05'
    thread: vietnam-congress
    c: 'McGeorge Bundy at breakfast with Clark. To Johnson: Clark "furious" at the supplemental but likely to vote for it; a man "of plenty of convictions, but not quite enough courage to give them full expression."'
    n: '[[w.gibbons-u-s-government-and]], III, 240–41 n.70. To check: McGeorge Bundy to Johnson, May 5, 1965, NSF, NSC History, Deployment of Forces, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 240 n.70). Names: McGeorge Bundy, Clark, Johnson.'
