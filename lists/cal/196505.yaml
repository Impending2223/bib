  - id: cal.1965-05-16.china-leadership
    when: May 16
    date: '1965-05-16'
    place: changsha
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Mao, Changsha, receives Hồ Chí Minh, on leave in China;{1} Tao Zhu present.{2} The U.S. cannot defeat Vietnam, it fears it, Vietnam will beat it.{3} Hồ asks China to build six roads from its border to the rear areas and the front; Mao: "At President Hồ''s order. We will undertake it."{4} Hồ: after the French war the party in the hills went down to the plains and a pacifist mood arose; Mao: China made the same mistake, only now begun to correct.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 16, 1965; [[w.macfarquhar-origins-of-the-cultural]], III, 371, 373 (Hồ Chí Minh at Changsha, in the book "early spring", staying over a month, visited by Mao; Hồ asks help with road building north of Hanoi). [[w.77-conversations-between-chinese]], [84–85](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=82) (doc. 9; Changsha, May 16, 1965, no hour: Hồ asks China to build six roads from the border south through the rear, to be joined to the front, 30,000 Vietnamese now at it to go South if China helps, and to help the Lao build roads from Samneua to Xiengkhoang and Lower Laos; Mao: a good policy, roads to Thailand too, "we accept your order"; Tao Zhu had phoned Zhou, who said China could; 84 n.127; 85 n.128, Tao Zhu to Hồ at Hanoi, Apr. 13, [[cal.1965-04-13.china-leadership-5]]). Made public: 1998. Check: Nguyen Vu Tung''s essay (77 Conversations, 49 n.63) dates the talk May 17, 1965; the record (doc. 9) is headed Changsha, May 16, as is Tønnesson''s essay (34). Check: the book has Hồ come secretly to Changsha in the early spring and stay over a month, Mao visiting him (III, 371; 373 n.166); the chronologies give Mao''s talk May 16. To check: [[w.jian-xin-zhongguo-liu-ci]], 202 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 371 n.153a); [[w.xinli-xunshi-dajiang-nanbeide-mao]], 447–50 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 373 n.166). Names: Mao Zedong, Hồ Chí Minh, Tao Zhu.'
