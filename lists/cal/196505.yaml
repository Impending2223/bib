# Cal. LXVI May 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXVI
entries:
  - id: cal.1965-05-01.desegregation-schools-philadelphia
    when: May 1
    date: '1965-05-01'
    thread: desegregation-schools
    also: [civil-rights-organizations]
    c: Philadelphia. Moore and the NAACP begin to picket the wall of Girard College, open by Stephen Girard's will to "poor white male orphans" alone.
    n: 'Check: the record. [[w.countryman-up-south]]; [[w.branch-at-canaans-edge]]. Names: Moore.'
    tags: [state:pa, city:philadelphia, name:moore-cecil-b]
  - id: cal.1965-05-02.latin-america
    when: May 2
    date: '1965-05-02'
    thread: latin-america-dominican-republic
    c: Report to the nation on the Dominican Republic, after meeting the congressional leaders. The revolt "taken over" by "a band of Communist conspirators." "The American nations cannot, must not, and will not permit the establishment of another Communist government in the Western Hemisphere." Two battalions, 2,000 men, ordered that morning; 4,500 more that evening.
    n: 'Radio and Television Report to the American People on the Situation in the Dominican Republic, [1965 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=545) (May 2, 1965); Statement by the President Upon Sending Additional Forces to the Dominican Republic, [1965 Pub. Papers 466](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=542) (May 1, 1965). FRUS 1964–68, XXXII, docs. [51](https://history.state.gov/historicaldocuments/frus1964-68v32/d51), [52](https://history.state.gov/historicaldocuments/frus1964-68v32/d52). See [[cal.1965-04-28.latin-america]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-03.court
    when: May 3
    date: '1965-05-03'
    thread: court
    also: [cuba]
    c: '*Zemel v. Rusk*, [381 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381001/usrep381001.pdf): the Secretary of State may refuse to validate passports for travel to Cuba under the Passport Act of 1926. Warren for the Court, 6–3; Black, Douglas, and Goldberg dissenting.'
    n: '[[w.powe-warren-court-and-american]]. See [[cal.1964-12-14.court]].'
  - id: cal.1965-05-04.vietnam
    when: May 4
    date: '1965-05-04'
    thread: vietnam
    also: [defense]
    c: '$700 million for Vietnam asked: "This is not a routine appropriation." An "overwhelming vote" asked as "proof of national unity."'
    n: 'Special Message to the Congress Requesting Additional Appropriations for Military Needs in Viet-Nam, [1965 Pub. Papers 494](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=570) (May 4, 1965); Remarks to Committee Members on the Need for Additional Appropriations for Military Purposes in Viet-Nam and the Dominican Republic, [1965 Pub. Papers 484](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=560) (May 4, 1965). [[w.gibbons-u-s-government-and]], III, 241–243; [[w.mann-grand-delusion]]. See [[cal.1965-03-08.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-05.vietnam
    when: May 5–7
    date: '1965-05-05'
    thread: vietnam
    c: The 173d Airborne Brigade, from Okinawa, the first Army ground combat unit in Vietnam, flown in to Biên Hòa. May 7, Marines land at Chu Lai to build an airfield. Check the dates.
    n: FRUS 1964–68, II, docs. [280](https://history.state.gov/historicaldocuments/frus1964-68v02/d280) (the deployments ordered, Apr. 30), [284](https://history.state.gov/historicaldocuments/frus1964-68v02/d284), [290](https://history.state.gov/historicaldocuments/frus1964-68v02/d290). [[w.carland-united-states-army-in]]. See [[cal.1965-03-08.vietnam]].
    tags: [place:bien-hoa-air-base, place:chu-lai]
  - id: cal.1965-05-05.vietnam-2
    when: May 5
    date: '1965-05-05'
    thread: vietnam
    also: [defense]
    c: House passes the $700 million for Vietnam, [408–7](https://voteview.com/rollcall/RH0890047).
    n: '[111 Cong. Rec., House, May 5, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-6-2.pdf). [[w.gibbons-u-s-government-and]], III, 243–245. See [[cal.1965-05-04.vietnam]].'
  - id: cal.1965-05-06.latin-america
    when: May 6
    date: '1965-05-06'
    thread: latin-america-dominican-republic
    c: 'OAS foreign ministers, after midnight, vote the inter-American force the United States asked: 14–5, Chile, Ecuador, Mexico, Peru, and Uruguay against, Venezuela abstaining. Two-thirds needed. The Act of Santo Domingo, the cease-fire, signed May 5. May 7, Imbert''s Government of National Reconstruction formed against Caamaño''s "Constitutional Government."'
    n: '[FRUS 1964–68, XXXII, doc. 58](https://history.state.gov/historicaldocuments/frus1964-68v32/d58) (its note prints 15–5; a CIA situation report, 14–5: check), [doc. 59](https://history.state.gov/historicaldocuments/frus1964-68v32/d59). See [[cal.1965-04-28.latin-america]]. Names: Imbert-Barrera, Caamaño-Deno.'
    tags: [name:imbert-barrera-antonio, name:caamano-deno-francisco]
  - id: cal.1965-05-06.robert-kennedy
    when: May 6
    date: '1965-05-06'
    thread: robert-kennedy
    also: [vietnam, latin-america]
    c: 'Robert Kennedy votes for the $700 million for Vietnam, on the understanding Stennis gave the day before: "It is not a blank check." Three courses open in Vietnam. On the Dominican Republic the same day: the object "not to drive the genuine democrats in the Dominican revolution into association with the Communists."'
    n: '[111 Cong. Rec. 9760–62 (1965)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-7-2.pdf#page=33). [[w.schlesinger-robert-kennedy-and-his]]; [[w.shesol-mutual-contempt]]. See [[cal.1965-05-04.vietnam]]; [[cal.1965-04-28.latin-america]]. Names: Robert Kennedy, Stennis.'
    tags: [name:kennedy-robert-f, name:stennis-john-c]
  - id: cal.1965-05-06.vietnam
    when: May 6
    date: '1965-05-06'
    thread: vietnam
    also: [defense]
    c: Senate passes the $700 million for Vietnam, [88–3](https://voteview.com/rollcall/RS0890050), Gruening, Morse, and Nelson against.
    n: '[111 Cong. Rec., Senate, May 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-7-2.pdf) (the Record: 88–3; Voteview counts Gruening, announced, a yea). [[w.gibbons-u-s-government-and]], III, 245–249. See [[cal.1965-05-04.vietnam]]. Names: Gruening, Morse, Nelson.'
    tags: [name:gruening-ernest, name:morse-wayne, name:nelson-gaylord-a]
  - id: cal.1965-05-07.alabama
    when: May 7
    date: '1965-05-07'
    thread: alabama
    also: [voting-rights]
    c: 'Hayneville, Lowndes County. Wilkins, Klansman, tried for the murder of Viola Liuzzo; the FBI''s informer in the car testifies that he fired the shots. Mistrial: the jury 10–2 to convict. Check the date and the split.'
    n: '[[w.may-informant]]. See [[cal.1965-03-07.voting-rights]]. Names: Wilkins, Liuzzo.'
    tags: [name:wilkins-collie-leroy-jr, name:liuzzo-viola]
  - id: cal.1965-05-07.opinion
    when: May 7
    date: '1965-05-07'
    thread: opinion
    also: [students]
    c: 'Gallup, special survey of students at 97 four-year colleges: continue the draft, or depend on volunteers. Men: continue 61 percent, volunteers 37. Women: 76 and 20.'
    n: '[[w.gallup-poll]], III, 1938–39.'
  - id: cal.1965-05-07.vietnam
    when: May 7
    date: '1965-05-07'
    thread: vietnam
    also: [defense]
    c: 'The $700 million signed, [79 Stat. 109](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg109-2.pdf): "We will not be defeated. We will not grow tired."'
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing Resolution Appropriating Funds for Military Requirements in Viet-Nam, [1965 Pub. Papers 505](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=581) (May 7, 1965). [[w.gibbons-u-s-government-and]], III, 249. See [[cal.1965-05-04.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-08.transition-and-staff
    when: May 8
    date: '1965-05-08'
    thread: transition-and-staff
    c: 'Executive Order 11222, standards of ethical conduct for the executive branch: officials appointed by the President and reporting to him to file statements of their financial interests; gifts, entertainment, and favors limited.'
    n: '[Exec. Order No. 11,222](https://www.presidency.ucsb.edu/documents/executive-order-11222-prescribing-standards-ethical-conduct-for-government-officers-and), [30 Fed. Reg. 6469](https://www.govinfo.gov/app/details/FR-1965-05-11); Statement by the President Upon Issuing Order Prescribing Standards of Ethical Conduct for Government Officers and Employees, [1965 Pub. Papers 514](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=590) (May 9, 1965). See [[cal.1965-01-20.transition-and-staff]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-09.opinion
    when: May 9
    date: '1965-05-09'
    thread: opinion
    c: 'Gallup, Apr. 2–7: the domestic problems the Government should attend to most, three chosen from ten: public education 45 percent; crime 41; killer diseases 37; unemployment 35; poor areas 32; racial discrimination 29; housing and slums 21; highway safety 18; pollution of air and water 17; beautifying America 3.'
    n: '[[w.gallup-poll]], III, 1939.'
  - id: cal.1965-05-11.voting-rights
    when: May 11
    date: '1965-05-11'
    thread: voting-rights
    c: 'Senate, on the Mansfield–Dirksen substitute for the voting rights bill: Edward Kennedy''s amendment to ban the poll tax in State and local elections refused, [45–49](https://voteview.com/rollcall/RS0890052). May 19, a declaration that the tax abridges the right to vote, the Attorney General to sue, taken, [69–20](https://voteview.com/rollcall/RS0890060).'
    n: '[111 Cong. Rec., Senate, May 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt8/pdf/GPO-CRECB-1965-pt8-1-1.pdf); [May 19, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt8/pdf/GPO-CRECB-1965-pt8-7-2.pdf). See [[cal.1965-03-15.voting-rights]]. Names: Kennedy, Mansfield, Dirksen.'
    tags: [name:kennedy-edward-m, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1965-05-12.vietnam
    when: May 12
    date: '1965-05-12'
    thread: vietnam-mayflower
    c: 'The first bombing pause (MAYFLOWER): no attacks on the North from noon, Washington time. Rusk had told Dobrynin, May 11.'
    n: 'FRUS 1964–68, II, docs. [293](https://history.state.gov/historicaldocuments/frus1964-68v02/d293), [294](https://history.state.gov/historicaldocuments/frus1964-68v02/d294) (May 11). [[w.herring-secret-diplomacy-of-the]]; [[w.thies-when-governments-collide]]; [[w.search-for-peace-in]]; [[w.logevall-choosing-war]]; [[w.gibbons-u-s-government-and]], III, 253–256. See [[cal.1965-03-02.vietnam]]. Names: Johnson, Rusk, Dobrynin.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:dobrynin-anatoly]
  - id: cal.1965-05-12.opinion
    when: May 12
    date: '1965-05-12'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, Apr. 2–7: the Johnson Administration pushing integration too fast, 45 percent; not fast enough, 14; about right, 32. Southern whites 70 too fast; whites outside the South 41.'
    n: '[[w.gallup-poll]], III, 1939. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-12.legislatures-ne
    when: May 12
    date: '1965-05-12'
    thread: legislatures
    c: Nebraska. The federal court, one judge dissenting, holds L.B. 628, the legislature's plan of 50 districts signed by Morrison Mar. 29, unconstitutional; another plan this session, or all members elected at large in 1966. L.B. 925 follows, in effect Aug. 18.
    n: '*League of Nebraska Municipalities v. Marsh*, [242 F. Supp. 357](https://static.case.law/f-supp/242/case-pdfs/0357-01.pdf) (D. Neb. 1965); [253 F. Supp. 27](https://static.case.law/f-supp/253/case-pdfs/0027-01.pdf) (D. Neb. 1966). See [[cal.1964-07-17.legislatures-ne]]. Names: Morrison.'
    tags: [state:ne, name:morrison-frank-b]
  - id: cal.1965-05-13.vietnam-mayflower
    when: May 13
    date: '1965-05-13'
    thread: vietnam-mayflower
    c: Moscow. The North Vietnamese ambassador will not receive Kohler; the message left with an embassy employee. Gromyko calls the American message to Dobrynin "insulting" (Check the date). Johnson to the editorial cartoonists, on Vietnam.
    n: '[FRUS 1964–68, II, doc. 298](https://history.state.gov/historicaldocuments/frus1964-68v02/d298). Address to Members of the Association of American Editorial Cartoonists: The Challenge of Human Need in Viet-Nam, [1965 Pub. Papers 522](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=598) (May 13, 1965). [[w.gibbons-u-s-government-and]], III, 255–256. See [[cal.1965-05-12.vietnam]]. Names: Kohler, Gromyko, Dobrynin, Johnson.'
    tags: [name:kohler-foy-d, name:gromyko-andrei, name:dobrynin-anatoly, name:johnson-lyndon-b]
  - id: cal.1965-05-15.students
    when: May 15
    date: '1965-05-15'
    thread: students
    also: [vietnam]
    c: The National Teach-In on Vietnam, Sheraton-Park Hotel, Washington, by the Inter-University Committee for Debate on Foreign Policy; carried by telephone to some 100 campuses. Bundy, to have spoken for the administration, sent to the Dominican Republic; his statement read. Check the count.
    n: '[[w.menashe-teach-ins]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]; [[w.bird-color-of-truth]]; [[w.gibbons-u-s-government-and]], III, 270–272. See [[cal.1964-12-02.states-and-cities]]. Names: Bundy.'
    tags: [name:bundy-mcgeorge]
  - id: cal.1965-05-15.latin-america
    when: May 15
    date: '1965-05-15'
    thread: latin-america-dominican-republic
    c: 'Bundy''s mission. Bundy, Vance, and Fortas see Bosch in Puerto Rico: a government under Antonio Guzmán, Bosch''s agriculture minister, "Constitution sí, communism no."'
    n: '[FRUS 1964–68, XXXII, doc. 72](https://history.state.gov/historicaldocuments/frus1964-68v32/d72). Further Statement by the President on the OAS Mission to the Dominican Republic, [1965 Pub. Papers 538](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=614) (May 15, 1965). [[w.bird-color-of-truth]]; [[w.murphy-fortas]]. See [[cal.1965-04-28.latin-america]]. Names: Bundy, Vance, Fortas, Bosch, Guzmán-Fernández.'
    tags: [name:bundy-mcgeorge, name:vance-cyrus, name:fortas-abe, name:bosch-juan, name:guzman-fernandez-silvestre-antonio]
  - id: cal.1965-05-16.opinion
    when: May 16
    date: '1965-05-16'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 23–28: what to do next in Vietnam: withdraw 13 percent; negotiate 12; continue 13; step up 8; go all out 15; others, no opinion 39. Handling South Vietnam as well as could be expected, 52; badly, 27. Should have become involved, 52; not, 26. The bombing of North Vietnam: stop 21, continue 59.'
    n: '[[w.gallup-poll]], III, 1939–40.'
  - id: cal.1965-05-16.latin-america
    when: May 16
    date: '1965-05-16'
    thread: latin-america-dominican-republic
    c: Bundy and Vance in Santo Domingo; Mann and Vaughn with Imbert's generals.
    n: '[FRUS 1964–68, XXXII, doc. 74](https://history.state.gov/historicaldocuments/frus1964-68v32/d74). See [[cal.1965-05-15.latin-america]]. Names: Bundy, Vance, Mann, Vaughn, Imbert-Barrera.'
    tags: [name:bundy-mcgeorge, name:vance-cyrus, name:mann-thomas-c, name:vaughn-jack-h, name:imbert-barrera-antonio]
  - id: cal.1965-05-17.economy
    when: May 17
    date: '1965-05-17'
    thread: economy
    c: 'Excise tax message: $3.5 billion off in two equal stages, July 1, 1965, and Jan. 1, 1966, $464 million more by 1969. To go: the retail taxes on furs, jewelry, luggage, toilet articles; the telephone tax, by 1969. The automobile tax from 10 percent to 7. User charges on highways and waterways up. Announced May 15.'
    n: 'Special Message to the Congress Recommending Reduction of Excise Taxes and Increases in User Charges, [1965 Pub. Papers 540](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=616) (May 17, 1965); Remarks Upon Announcing Plans To Recommend a Reduction in Excise Taxes, [1965 Pub. Papers 536](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=612) (May 15, 1965). [[w.zelizer-taxing-america]]; [[w.stein-fiscal-revolution-in-america]]; [[w.okun-political-economy-of-prosperity]]. See [[cal.1964-11-23.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-17.japan-and-korea
    when: May 17–18
    date: '1965-05-17'
    thread: korea
    also: [vietnam]
    c: 'Park''s state visit. The joint statement: American forces to stay in Korea; $150 million in development loans; thanks for Korea''s help in Vietnam. Johnson speaks of a Korean division for Vietnam.'
    n: 'Remarks of Welcome at the White House to the President of Korea, [1965 Pub. Papers 538](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=614); Toasts of the President and President Chung Hee Park of Korea, [1965 Pub. Papers 548](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=624) (May 17, 1965); Joint Statement Following Discussions With the President of Korea, [1965 Pub. Papers 550](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=626) (May 18, 1965). FRUS 1964–68, XXIX, pt. 1, docs. [44](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d44), [46](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d46), [47](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d47), [48](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d48), [49](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d49), [50](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d50), [51](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d51), [52](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d52), [53](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d53). [[w.brazinsky-nation-building-in-south]]; [[w.lee-troubled-peace]]; [[w.park-chung-hee-era]]. See [[cal.1964-12-19.japan-and-korea]]. Names: Park, Johnson.'
    tags: [name:park-chung-hee, name:johnson-lyndon-b]
  - id: cal.1965-05-18.jobs-and-wages
    when: May 18
    date: '1965-05-18'
    thread: jobs-and-wages
    c: 'Labor message. Repeal of Section 14(b) of the Taft–Hartley Act, which lets States ban the union shop. Minimum wage and overtime coverage for 4½ million more workers; double time for excessive overtime. A permanent federal program of extended unemployment benefits. No new minimum rate: the question "when and by how much."'
    n: 'Special Message to the Congress on Labor, [1965 Pub. Papers 553](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=629) (May 18, 1965). Repeal of section 14(b) (K–J Cong. II.J.2). [[w.boyle-uaw-and-the-heyday]]. See [[cal.1965-01-04.program]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-18.poverty
    when: May 18
    date: '1965-05-18'
    thread: poverty
    c: 'Head Start. In the Rose Garden with Shriver: some 2,000 child development centers to open this summer, for perhaps half a million children; preschool, medical and dental care.'
    n: 'Remarks on Project Head Start, [1965 Pub. Papers 556](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=632) (May 18, 1965); The President''s Statement to the Cabinet on Project Head Start, [1965 Pub. Papers 689](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=163) (June 19, 1965). [[w.gillette-launching-the-war-on]]; [[w.stossel-sarge]]. See [[cal.1964-12-12.poverty]]. Names: Shriver.'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent]
  - id: cal.1965-05-18.vietnam
    when: May 18
    date: '1965-05-18'
    thread: vietnam-mayflower
    c: Rolling Thunder resumes; the pause ended.
    n: 'FRUS 1964–68, II, docs. [304](https://history.state.gov/historicaldocuments/frus1964-68v02/d304) (the decision, May 16), [305](https://history.state.gov/historicaldocuments/frus1964-68v02/d305). [[w.gibbons-u-s-government-and]], III, 256–258. See [[cal.1965-05-12.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-21.students
    when: May 21–22
    date: '1965-05-21'
    thread: students
    also: [vietnam]
    c: 'Vietnam Day, Berkeley: some 35 hours of speeches against the war on the campus. The Vietnam Day Committee formed. Check the crowd.'
    n: '[[w.rorabaugh-berkeley-at-war]]; [[w.wells-war-within]]. See [[cal.1965-05-15.students]].'
  - id: cal.1965-05-21.latin-america
    when: May 21
    date: '1965-05-21'
    thread: latin-america-dominican-republic
    c: Santo Domingo. Imbert's offensive has taken the rebels' northern zone; a truce from this day. Check.
    n: '[FRUS 1964–68, XXXII, doc. 89](https://history.state.gov/historicaldocuments/frus1964-68v32/d89) (May 22). See [[cal.1965-05-15.latin-america]]. Names: Imbert-Barrera.'
    tags: [name:imbert-barrera-antonio]
  - id: cal.1965-05-23.opinion
    when: May 23
    date: '1965-05-23'
    thread: opinion
    also: [desegregation-schools]
    c: 'Gallup, Apr. 23–28: white parents who would object to a school where a few of the children are colored: outside the South 7 percent, South 37; where half are, 28 and 68; where more than half are, 52 and 78.'
    n: '[[w.gallup-poll]], III, 1940–41.'
  - id: cal.1965-05-24.court
    when: May 24
    date: '1965-05-24'
    thread: court
    c: '*Lamont v. Postmaster General*, [381 U.S. 301](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381301/usrep381301.pdf): the 1962 act holding foreign "communist political propaganda" in the mails until the addressee asks for it void under the First Amendment. Douglas for the Court, 8–0; White not sitting.'
    n: '[[w.powe-warren-court-and-american]]. See [[cal.1964-12-14.court]].'
  - id: cal.1965-05-24.conservation
    when: May 24–26
    date: '1965-05-24'
    thread: conservation
    c: 'White House Conference on Natural Beauty, Laurance Rockefeller chairman. May 26, four highway beauty bills sent up: billboards and junkyards within 1,000 feet of Interstate and primary highways controlled, as a condition of federal highway aid; landscaping; scenic roads.'
    n: 'Remarks to the Delegates to the White House Conference on Natural Beauty, [1965 Pub. Papers 576](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=652) (May 25, 1965); Letter to the President of the Senate and to the Speaker of the House Transmitting Bills To Improve Highway Beauty, [1965 Pub. Papers 582](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=658) (May 26, 1965). [[w.gould-lady-bird-johnson-and]]; [[w.johnson-white-house-diary]]; [[w.smith-stewart-l-udall]]. See [[cal.1964-09-03.conservation]]. Names: Laurance Rockefeller.'
    tags: [name:johnson-lyndon-b, name:rockefeller-laurance-s]
  - id: cal.1965-05-24.legislatures-mn
    when: May 24
    date: '1965-05-24'
    thread: legislatures
    c: 'Minnesota. Rolvaag vetoes the legislature''s reapportionment, Senate File 102, the day it adjourns. Legislators sue: a reapportionment needs no governor.'
    n: 'Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993). Check: the veto message. See [[cal.1964-12-04.legislatures-mn]]. Names: Rolvaag.'
    tags: [state:mn, name:rolvaag-karl-f]
  - id: cal.1965-05-25.foreign-aid
    when: May 25
    date: '1965-05-25'
    thread: foreign-aid
    c: House passes the foreign aid authorization, H.R. 7750, [249–148](https://voteview.com/rollcall/RH0890056); recommittal refused, [178–219](https://voteview.com/rollcall/RH0890055). The Senate passes it June 14, [68–20](https://voteview.com/rollcall/RS0890109), with $89 million more for Southeast Asia, asked June 1 and added June 7, [42–26](https://voteview.com/rollcall/RS0890087).
    n: '[111 Cong. Rec., House, May 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt9/pdf/GPO-CRECB-1965-pt9-1-2.pdf); [111 Cong. Rec., Senate, June 14, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-4-2.pdf). Special Message to the Congress on the Need for Additional Foreign Aid Funds for Southeast Asia, [1965 Pub. Papers 607](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=81) (June 1, 1965). [[w.ruttan-united-states-development-assistance]]. See [[cal.1964-10-07.foreign-aid]].'
  - id: cal.1965-05-25.voting-rights
    when: May 25–26
    date: '1965-05-25'
    thread: voting-rights
    c: Senate invokes cloture on the voting rights bill, [70–30](https://voteview.com/rollcall/RS0890067). May 26, the Mansfield–Dirksen substitute adopted, [78–18](https://voteview.com/rollcall/RS0890077); the bill passed, [77–19](https://voteview.com/rollcall/RS0890078).
    n: '[111 Cong. Rec., Senate, May 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt9/pdf/GPO-CRECB-1965-pt9-1-1.pdf); [May 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt9/pdf/GPO-CRECB-1965-pt9-2-2.pdf). Statement by the President Following Passage by the Senate of the Voting Rights Bill, [1965 Pub. Papers 581](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=657) (May 26, 1965). Voting Rights Act of 1965 (K–J Cong. II.J.2). See [[cal.1965-05-11.voting-rights]]. Names: Mansfield, Dirksen.'
    tags: [name:mansfield-mike, name:dirksen-everett, name:johnson-lyndon-b]
  - id: cal.1965-05.mayors-omaha
    when: May
    date: 1965-05
    thread: mayors
    also: [elections-1965]
    c: 'Omaha elects Sorensen (R) mayor over Mayor Dworak, indicted during the campaign for bribery: taped asking a developer for $25,000 for not vetoing a rezoning. Dworak acquitted the next spring.'
    n: '[Wikipedia, "James Dworak"](https://en.wikipedia.org/wiki/James_Dworak) (Check: the day, the vote, and the indictment''s date). See [[cal.1961-05.mayors-omaha]]. Names: Sorensen, Dworak.'
    tags: [state:ne, city:omaha, name:sorensen-a-v, name:dworak-james-j]
  - id: cal.1965-05-26.latin-america
    when: May 26
    date: '1965-05-26'
    thread: latin-america-dominican-republic
    c: Bundy home from Santo Domingo; no agreement on Guzmán.
    n: 'FRUS 1964–68, XXXII, docs. [95](https://history.state.gov/historicaldocuments/frus1964-68v32/d95), [97](https://history.state.gov/historicaldocuments/frus1964-68v32/d97). See [[cal.1965-05-15.latin-america]]. Names: Bundy, Guzmán-Fernández.'
    tags: [name:bundy-mcgeorge, name:guzman-fernandez-silvestre-antonio]
  - id: cal.1965-05-31.europe-and-the-alliance
    when: May 31–June 1
    date: '1965-05-31'
    thread: europe-and-the-alliance
    c: Paris, the NATO defense ministers. McNamara proposes a select committee of four or five defense ministers on the allies' part in nuclear planning and consultation.
    n: 'FRUS 1964–68, XIII, docs. [87](https://history.state.gov/historicaldocuments/frus1964-68v13/d87) (guidance, June 2), [94](https://history.state.gov/historicaldocuments/frus1964-68v13/d94) (McNamara and the Dutch ambassador, July 6). [[w.haftendorn-nato-and-the-nuclear]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.priest-kennedy-johnson-and-nato]]. See [[cal.1964-12-07.europe-and-the-alliance]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
