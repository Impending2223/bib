  - id: cal.1965-05-06.latin-america
    when: May 6
    date: '1965-05-06'
    thread: latin-america-dominican-republic
    c: 'OAS foreign ministers, after midnight, vote the inter-American force the United States asked: 14–5, Chile, Ecuador, Mexico, Peru, and Uruguay against, Venezuela abstaining. Two-thirds needed. The Act of Santo Domingo, the cease-fire, signed May 5. May 7, Imbert''s Government of National Reconstruction formed against Caamaño''s "Constitutional Government."'
    n: '[FRUS 1964–68, XXXII, doc. 58](https://history.state.gov/historicaldocuments/frus1964-68v32/d58) (its note prints 15–5; a CIA situation report, 14–5: check), [doc. 59](https://history.state.gov/historicaldocuments/frus1964-68v32/d59). See [[cal.1965-04-28.latin-america]]. Names: Imbert-Barrera, Caamaño-Deno.'
