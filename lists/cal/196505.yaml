    thread: china-leadership
    also: [china]
    c: Deng Xiaoping 邓小平, after the enlarged Politburo 政治局 meeting at which Luo Ruiqing 罗瑞卿 reports on the Military Commission's operations conference, with Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Zhu De 朱德 and others receives all who attended the conference and speaks. Our senior generals should care about strategy, which is the whole country's question; military strength cannot be divorced from national construction; peace or war is in fact the relation of economic construction to army building; military expenditure must rise greatly with atomic bombs and missiles and the growth of the special arms; the money now should go first to what cannot be done quickly, chiefly fortifications; cadres are to be trained, the military school policy changed so that outstanding soldiers become junior officers after rotation; the money is to go to the third front and arsenals, to atomic bombs and missiles, and to military stockpiles.
