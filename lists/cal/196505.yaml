  - id: cal.1965-05-03.latin-america-dominican-republic
    when: May 3
    date: '1965-05-03'
    time: 1965-05-03T05:01Z
    time_approx: true
    thread: latin-america-dominican-republic
    c: Shortly after midnight May 2–3 three airborne battalions close the cordon through Santo Domingo, without loss, in little over an hour, confining 80 percent of the rebel forces to the city's southeastern corner. With the new units in, May 3–4, twelve maneuver battalions and about 21,000 men ashore.
    n: '[[w.poole-joint-chiefs-of-staff-2012]], 142; [[w.drea-mcnamara-clifford-and-the-2011]], 305 (Palmer''s operation at one minute after midnight; 2,000 more airborne troops and 1,200 Marines arrived that afternoon, 8,000 more on the way). May 6 the Joint Chiefs add F-104s to the F-100s at Ramey, against Cuba''s MiGs (142). See [[cal.1965-05-01.latin-america-dominican-republic]].'
    src:
