  - id: cal.1965-05-06.vietnam
    when: May 6
    date: '1965-05-06'
    thread: vietnam-supplemental
    also: [defense]
    c: 'Senate passes the $700 million for Vietnam, [88–3](https://voteview.com/rollcall/RS0890050), Gruening, Morse, and Nelson against. Morse on the "reservationists": "Whom do they think they are kidding?" Dirksen in reply: "No word of mine will ever impair their morale." Nelson: "White men cannot impose peace in Asia—even by overwhelming force"; "you need my vote less than I need my conscience." Stennis: less than "an overwhelming vote" would be "notice to the world that the United States is backing up." Mansfield: "there is not one member of this body who does not desire to uphold the president."'
    n: '[111 Cong. Rec., Senate, May 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-7-2.pdf) (the Record: 88–3; Voteview counts Gruening, announced, a yea), 9759 (Nelson), 9763 (Morse), 9766 (Dirksen). [[w.gibbons-u-s-government-and]], III, 245–249. [[w.mann-grand-delusion]], 434–37. See [[cal.1965-05-04.vietnam]]. Names: Gruening, Morse, Nelson, Dirksen, Stennis, Mansfield.'
