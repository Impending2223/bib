    c: 'Peking. Chen Yi calls in the British chargé d''affaires and asks that London pass four points to Washington: China will not provoke war with the United States; what China says counts; China is prepared; if the United States bombs China, that means war, with no limits. China supports Vietnam unconditionally, but will take direct part only if the war reaches Chinese territory. The same message, Chen Yi says, Zhou Enlai gave Ayub Khan, whose visit to Washington was put off.'
