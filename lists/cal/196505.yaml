    c: 'Peking 北京. Peng Zhen 彭真 with Li Chuli 李楚离, Qiao Mingfu 乔明甫, Gu Mu 谷牧, Liu Yumin 刘裕民, Lai Jifa 赖际发, Liu Xiufeng 刘秀峰, Li Yunchang 李运昌, Xu Zirong 徐子荣 and others: the Party''s life to be livelier, no fear of speaking, not every meeting recorded; criticism of great things, not private details, as in the Li Lisan 李立三 and Wang Ming years, a way brought by the Moscow branch; Yan''an''s rules, cure the sickness to save the patient, unity–criticism–unity; criticism strict, handling lenient; the "Twenty-three Articles": strict, positive and warm to cadres; after the "four clean-ups" Mao''s 毛泽东 lively political situation; cadres wronged by the teams to get an apology; cadres judged by virtue and ability, the large things not details.'
