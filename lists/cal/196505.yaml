  - id: cal.1965-05-07.opinion
    when: May 7
    date: '1965-05-07'
    thread: opinion
    also: [students]
    c: 'Gallup, special survey of students at 97 four-year colleges: continue the draft, or depend on volunteers. Men: continue 61 percent, volunteers 37. Women: 76 and 20.'
    n: '[[w.gallup-poll]], III, 1938–39.'
