  - id: cal.1965-05-05.vietnam
    when: May 5–7
    date: '1965-05-05'
    thread: vietnam
    c: The 173d Airborne Brigade, from Okinawa, the first Army ground combat unit in Vietnam, flown in to Biên Hòa. May 7, Marines land at Chu Lai to build an airfield. Check the dates.
    n: 'FRUS 1964–68, II, docs. [280](https://history.state.gov/historicaldocuments/frus1964-68v02/d280) (the deployments ordered, Apr. 30), [284](https://history.state.gov/historicaldocuments/frus1964-68v02/d284), [290](https://history.state.gov/historicaldocuments/frus1964-68v02/d290). To check: [[w.carland-united-states-army-in]]. See [[cal.1965-03-08.vietnam]].'
    tags: [place:bien-hoa-air-base, place:chu-lai]
  - id: cal.1965-05-05.vietnam-2
    when: May 5
    date: '1965-05-05'
    thread: vietnam
    also: [defense]
    c: 'House passes the $700 million for Vietnam, [408–7](https://voteview.com/rollcall/RH0890047), after an hour''s debate. McCormack: failure could lead to "appeasement"; Albert: "the road of appeasement is the road to war." Ford: the House''s Republicans unanimously behind the "policy of firmness." Laird and Cederberg against the teach-ins; Laird to go to the White House''s leadership meetings only with an agenda. Edith Green against: "a vote for that delusion."'
    n: '[111 Cong. Rec., House, May 5, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-6-2.pdf), 9518–41 (the debate). [[w.gibbons-u-s-government-and]], III, 243–245. See [[cal.1965-05-04.vietnam]]. Names: McCormack, Albert, Ford, Laird, Cederberg, Edith Green.'
    src:
      c: cb12eff1
      rows:
