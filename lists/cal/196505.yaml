  - id: cal.1965-05-31.vietnam
    when: May 31
    date: '1965-05-31'
    thread: vietnam
    also: [china]
    c: 'Peking. Chen Yi calls in the British chargé d''affaires and asks that London pass four points to Washington: China will not provoke war with the United States; what China says counts; China is prepared; if the United States bombs China, that means war, with no limits. China supports Vietnam unconditionally, but will take direct part only if the war reaches Chinese territory. The same message, Chen Yi says, Zhou Enlai gave Ayub Khan, whose visit to Washington was put off.'
    n: '[FRUS 1964–68, II, doc. 321](https://history.state.gov/historicaldocuments/frus1964-68v02/d321) (editorial note). [[w.jian-maos-china-and-the]], 217–18 (by Hopson''s telegram to the Foreign Office, No. 720); [[w.zhai-china-and-the-vietnam]], 138 (by FRUS''s editorial note; Zhou''s message to Ayub). To check: [[w.77-conversations-between-chinese]]; [[w.hershberg-reading-and-warning-the]]; [[w.hershberg-informing-the-enemy]]; Peking (Hopson) to the Foreign Office, No. 720, May 31, 1965, FO 371/180996, Public Record Office (cited by [[w.jian-maos-china-and-the]], 217 n.58); the transcript of Zhou Enlai''s conversation with Ayub Khan, Apr. 2, 1965, in [[w.77-conversations-between-chinese]], 79–85 (cited by [[w.jian-maos-china-and-the]], 217 n.55, for Zhou''s message). Names: Chen Yi, Zhou Enlai, Ayub Khan. Check: FRUS has Zhou and Ayub meet in Peking, Apr. 2 (II, doc. 321), or in Ayub''s March visit there (XXX, doc. 88 n. 4); Chen, 217, at Karachi, Apr. 2; Zhai, 138, "during his visit to Pakistan on April 2."'
