    when: May 6
    date: '1965-05-06'
    thread: robert-kennedy
    also: [vietnam, latin-america]
    c: 'Robert Kennedy votes for the $700 million for Vietnam, on the understanding Stennis gave the day before: "It is not a blank check." Three courses open in Vietnam. On the Dominican Republic the same day: the object "not to drive the genuine democrats in the Dominican revolution into association with the Communists."'
    n: '[111 Cong. Rec. 9760–62 (1965)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-7-2.pdf#page=33). [[w.schlesinger-robert-kennedy-and-his]], 691, 729–30 (the Dominican Republic, 691; the vote, no "blank check", and the three courses, 729–30); [[w.palermo-in-his-own-right]], 11–13 (the speech, the third course, the Dominican Republic and the quotation; not the vote or Stennis). To check: [[w.shesol-mutual-contempt]]. See [[cal.1965-05-04.vietnam]]; [[cal.1965-04-28.latin-america]]. Names: Robert Kennedy, Stennis.'
    src:
