  - id: cal.1965-05-11.china-leadership
    when: May 11
    date: '1965-05-11'
    thread: china-leadership
    c: 'Zhou, at the Politburo on adjusting the 1965 capital construction plan and budget, again proposes the "four guarantees": war preparation, aid abroad, the third front, key projects; rank by urgency: first cut what is not urgent, second what is not ready, third what is non-productive, fourth break old molds in design, a revolution with large savings. Holding capital investment to 17 billion is to rank by output and imported goods and equipment, leaving margin. While he is away Deng may approve its control directly.{1} Liu Shaoqi presides; Zhu De and Peng Zhen attend.{2} Adopted, the reports on adjusting the 1965 capital construction plan and the 1965 budget, and the decision to set up political departments in industry and transport.{3} Liu: over 1,260 projects now, near the peak''s 1,700; none to be started freely, some to be put off.{4} Zhu De: the supply and marketing cooperatives to buy in the villages; Liu, Zhou, Deng, Li Fuchun and Li Xiannian agree.{5}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 729–30 (May 11, 1965); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 618–619 (May 11, 1965; Liu presides at the Politburo meeting, which in the main passes the State Capital Construction Commission Party group''s reports on adjusting the 1965 capital-construction plan and on adjusting the 1965 budget to war preparation, and adopts the decision setting up political organs in the industrial and communications system; Liu: over 1,260 projects now, near the peak''s 1,700; no project to be started without the Center''s approval); [[w.deng-xiaoping-nianpu-1904]], III, 1861 (May 11, 1965; afternoon, 下午; Deng at the Politburo meeting, which in the main adopts the State Capital Construction Commission''s reports on adjusting the 1965 capital construction plan and the 1965 state budget to the situation of war preparation, and the Central Committee''s ''Decision on setting up political-work organs in the industrial and communications system''; Deng says the outstanding problem of the Third Plan is strategic reserves, grain, cloth and oil, to be considered as a whole; private income may be spent as people like, flowered clothes, more meat, better goods, a perm; Zhou: control of capital-construction investment, when he is away, may be sought directly from Deng); [[w.peng-zhen-nianpu-1902]], IV, 417 (May 11, 1965, afternoon; Peng Zhen at the Politburo, Liu Shaoqi presiding, which adopts the Capital Construction Commission''s report on adjusting the 1965 plan, the Finance Ministry Party group''s draft report adjusting the 1965 budget for war preparation, and the decision to set up political organs in industry and communications); [[w.jian-zhou-enlai]], 526 (Zhou tells a Politburo meeting: war preparation and the third front guaranteed, but agriculture and food not to be neglected; "some control should be exerted" on construction, war preparation and foreign aid, "unlimited expansion should not be allowed"; "the situation of 1958 and 1959" not to be repeated; the day not given, the note citing the Zhou chronology, 729–730, and Duan Yun''s relay of May 15); [[w.zhu-de-nianpu-xinbian]], III, 1933 (May 11, 1965, afternoon; Zhu De 朱德 at the Politburo meeting 中共中央政治局会议 on the report on adjusting the 1965 budget); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 618 (Liu); [[w.peng-zhen-nianpu-1902]], IV, 417; [[w.zhu-de-nianpu-xinbian]], III, 1933 (Zhu De); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 618; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 618–19; [[w.zhu-de-nianpu-xinbian]], III, 1933. Made public: 1996. Check: [[w.jian-zhou-enlai]], 526, has Zhou tell a Politburo meeting that "some control should be exerted" on construction, war preparation and foreign aid, no day given. To check: Comrade Duan Yun conveys the spirit of a Politburo meeting, May 15, 1965, 91-009-0576, Gansu Provincial Archive (cited by [[w.jian-zhou-enlai]], 526 n.29a). Names: Zhou Enlai, Deng Xiaoping, Liu Shaoqi, Zhu De, Peng Zhen, Li Fuchun, Li Xiannian.'
