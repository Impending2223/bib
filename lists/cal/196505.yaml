    place: washington
    thread: vietnam-congress
    also: [vietnam-supplemental]
    c: 'Appropriations and Armed Services, jointly, report the $700 million unanimously in the morning;{1} the Senate debates it from the afternoon.{2} Allott: "we are there and that we must win."{3} Javits for it, but no substitute for a new resolution: "I want to be consulted again."{4} Robert Byrd against signals "confused" by "pacifistic demonstrations."{5} Clark: "What is the difference between voting for a $700 million appropriation and voting for a declaration of war?" Church: Stennis, managing, "I do not think we are signing a blank check"; Church for it, "no blank-check endorsement of decisions to be made in the future."{6}'
