    c: 'Senate passes the $700 million for Vietnam, [88–3](https://voteview.com/rollcall/RS0890050), Gruening, Morse, and Nelson against. Morse on the "reservationists": "Whom do they think they are kidding?" Dirksen in reply: "No word of mine will ever impair their morale." Nelson: "White men cannot impose peace in Asia—even by overwhelming force"; "you need my vote less than I need my conscience."'
    n: '[111 Cong. Rec., Senate, May 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-7-2.pdf) (the Record: 88–3; Voteview counts Gruening, announced, a yea), 9759 (Nelson), 9763 (Morse), 9766 (Dirksen). [[w.gibbons-u-s-government-and]], III, 245–249. See [[cal.1965-05-04.vietnam]]. Names: Gruening, Morse, Nelson, Dirksen.'
