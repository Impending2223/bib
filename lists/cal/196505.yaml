    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing Resolution Appropriating Funds for Military Requirements in Viet-Nam, [1965 Pub. Papers 505](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=581) (May 7, 1965). [[w.gibbons-u-s-government-and]], III, 249; [[w.drea-mcnamara-clifford-and-the-2011]], 90 (the $700 million voted May 7). See [[cal.1965-05-04.vietnam]]. Names: Johnson.'
