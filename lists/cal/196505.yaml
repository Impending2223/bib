    when: May 5
    date: '1965-05-05'
    thread: china-leadership
    c: 'Zhu De 朱德 reports to the Center 中共中央 on his inspection of Guangdong 广东, Sichuan 四川 and Yunnan 云南. On the Panzhihua iron and steel works 攀枝花钢铁厂 in Sichuan: the thirty-five sets of heavy equipment it needs, 150,000 tons, not yet assured; its building must be guaranteed and not delayed; supply it all at home on time if possible, else import part; build the Southwest rear base as fast as can be, and the Northwest rear base to match. On the Yunnan frontier: in the south large tracts of reclaimable land, subtropical, a fine climate but few people; take Xinjiang''s 新疆 way, sending production corps to develop them, help the minority peoples and guard the frontier.'
