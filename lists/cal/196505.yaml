  - id: cal.1965-05-30.china
    when: May 30
    date: '1965-05-30'
    place: pyongyang
    thread: china
    also: [vietnam, japan-and-korea-far-east]
    c: The Hungarian ambassador to the DPRK, József Kovács, reports what the Romanian and East German ambassadors told Moskovsky of China's ambassador Hao Deqing's talk with them (a Soviet request for a base at Kunming; a surprise attack on a wide front, from Indochina to Korea; an agreement with the DPRK to open operations along the demarcation line at Panmunjom), and what the Cuban ambassador tells him of a Chinese plan. He hears from the Polish ambassador that the Koreans are massing troops near the line. He thinks the Chinese account may be disinformation.
    n: '"[Hungarian Embassy in the DPRK, Report, 30 May 1965. Subject: On China''s war plans.](https://digitalarchive.umd.edu/document/121766)" (May 30, 1965), Hungarian National Archives (MOL), XIX-J-1-j China, 1965, 71. doboz, IV-40, 003661/RT/1965, trans. Balázs Szalontai, Wilson Center Digital Archive. It follows the ambassador''s ciphered telegrams of Apr. 24 and 26; the addressee is not given on the translation, nor a dateline: the place is the embassy''s seat (the Archive''s heading, "Hungarian Embassy in the DPRK"; its summary, "the Hungarian Ambassador to Pyongyang"). See [[cal.1965-05-12.japan-and-korea-far-east]]. Check: the year the Archive posted the document; its page gives none. Names: Hao Deqing.'
    src:
      c: fd227f3e
      rows:
        - 'https://digitalarchive.umd.edu/document/121766: all'
    tags: [polity:hungary, polity:prc, polity:dprk, vis:only:hungary, ok:fields-place, name:hao-deqing]
