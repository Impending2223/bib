    thread: alabama
    also: [voting-rights]
    c: 'Hayneville, Lowndes County. Wilkins, Klansman, tried for the murder of Viola Liuzzo; the FBI''s informer in the car testifies that he fired the shots. Mistrial: the jury 10–2 to convict. Check the date and the split.'
    n: 'To check: [[w.may-informant]]. See [[cal.1965-03-07.voting-rights]]. Names: Wilkins, Liuzzo.'
