  - id: cal.1965-05-28.china-leadership
    when: May 28–29
    date: '1965-05-28'
    time: 1965-05-28T08:20Z
    place: canton
    thread: china-leadership
    also: [indonesia, vietnam, vietnam-hanoi, africa]
    c: 'Zhou and Chen Yi fly to Guangzhou to welcome Subandrio, first deputy premier and foreign minister of Indonesia;{1} three talks through the morning of May 29.{2} On Vietnam: the U.S. rushes in unprepared for war; all its estimates wrong; its "gradual escalation" means one step at a time, the thing most forbidden in war; Taylor and Johnson are extreme pragmatists with no long strategy.{3} On the second Asian-African conference: ten years ago all despised the conference, now all want in; difficult but of high market value; a great struggle ahead, in Asia and Africa and outside the U.N. In the second talk, at the Baiyunshan Hotel: 14 million South Vietnamese dare fight 200,000 Americans, so China, fifty times as many, would fight at least 10 million.{4} Asked about bombing, Zhou repeats the four sentences of Bogor: China starts no war with the U.S.; its word counts, as ten years of talks on Taiwan and Korea show; the whole country is mobilizing; bombing China is war on China, and war has no limit, no air war without a land war.{5}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 732–33 (May 28–29, 1965); [[w.zhou-enlai-waijiao-huodong]], 456 (May 28, 1965; afternoon, by special plane from Peking with Chen Yi to Guangzhou; 6:20 p.m., Baiyunshan Hotel (白云山宾馆), the first talks with Subandrio, with Chen Yi; 10 p.m. to 3:20 a.m., Baiyunshan Hotel, the second talks, Zhou on the Americans'' lack of preparation, "gradual escalation" and Taylor and Johnson as pragmatists); [[w.zhou-enlai-waijiao-huodong]], 457 (May 29, 1965; 9 a.m., Baiyunshan Hotel, the third talks with Subandrio; on the second Asian–African conference (the book''s words: all despised the first, now all want in; difficult but of high market value; a great struggle inside and outside the U.N.)); [[w.zhonghua-renmin-gongheguo-waijiao]], 30 (May 28–29, 1965; Subandrio''s visit, May 28–29; Zhou and Chen Yi''s talks with him); [[w.zhonghua-renmin-gongheguo-waijiao]], 30 (May 28–29, 1965; Zhou''s four points on Vietnam and his remarks on the second Afro-Asian Conference); [[w.77-conversations-between-chinese]], [85–86](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=83) (doc. 11; Guangzhou, May 28, 1965, no hour: Zhou to Subandrio, the U.S. rushing in unprepared, its ''gradual escalation'', Taylor and Johnson as ''extreme pragmatists''; 14 million South Vietnamese facing 200,000 Americans, China fifty times as many; the four-sentence statement of Maowu (Bogor) repeated; 85 n.130, 86 n.131). [[w.khoo-collateral-damage]], 31 n.159 (the four points repeated to Subandrio at Guangzhou, May 28; in the note); [[w.chen-yi-nianpu]], 1099 (May 28, 1965, 4:20 p.m., Chen Yi at the Baiyun 白云 airport, Guangzhou 广州, to welcome Subandrio; the talks with Zhou in the afternoon and again in the evening). Made public: 1993. To check: [[w.zhou-enlai-waijiao-huodong]], 446–450 (cited by [[w.khoo-collateral-damage]], 31 n.159a); [[w.77-conversations-between-chinese]], 88 (cited by [[w.khoo-collateral-damage]], 31 n.159b). The time is the first day''s. Names: Zhou Enlai, Chen Yi, Subandrio.'
    src:
      c: b456a058
