    also: [vietnam-operations]
    c: 'Quảng Ngãi. The night of May 28 the forces of the Ba Gia campaign (western Sơn Tịnh) move to their hiding places: Regiment 1 of Military Region 5 (Battalions 40, 60, 90, with a support battalion), the independent Battalion 45, under Lê Hữu Trữ and Nguyễn Đình Trọng, in the main direction; Battalion 83 and two district companies, militia and guerrillas in the second, Battalion 83 pressed against the Nghĩa Hành district seat. Chu Huy Mân, commander and commissar of the Region, is the campaign''s commander. Against them at Ba Gia the Saigon 1st Battalion, 51st Regiment, with Ranger Battalions 37 and 39 and the 2d Battalion of the 51st nearby.'
    n: '[[w.lich-su-khang-chien-chong-my]], III, 422–23. Made public: 2013. Names: Chu Huy Mân, Lê Hữu Trữ, Nguyễn Đình Trọng. The battle: [[cal.1965-05-29.vietnam-operations]].'
