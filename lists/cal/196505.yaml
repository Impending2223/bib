  - id: cal.1965-05-01.latin-america-dominican-republic-4
    when: May 1
    date: '1965-05-01'
    time: 1965-05-01T22:40Z
    place: washington
    thread: latin-america-dominican-republic
    c: 'Wheeler, 6:40 p.m., asks CINCLANT, Masterson and Palmer to assess three perimeters to confine the rebels to the south and east of Santo Domingo: A, a close-in perimeter sealing off the south; B, a corridor from the Duarte Bridge to the Marines'' eastern position; C, a longer perimeter farther north.'
    n: '[[w.poole-joint-chiefs-of-staff-2012]], 141 ("At 1840 on 1 May"). Check: Poole''s clock for the hours ("1840", "0214", "1303") is not stated; Washington''s is assumed. See [[cal.1965-05-01.latin-america-dominican-republic]]. Names: Wheeler, Palmer.'
    tags: [name:wheeler-earle, name:palmer-bruce-jr]
    time_zone: America/New_York
  - id: cal.1965-05-02.latin-america
    when: May 2
    date: '1965-05-02'
    time: 1965-05-03T02:00Z
    place: washington
    thread: latin-america-dominican-republic
    c: Report to the nation on the Dominican Republic, after meeting the congressional leaders. The revolt "taken over" by "a band of Communist conspirators."{1} "The American nations cannot, must not, and will not permit the establishment of another Communist government in the Western Hemisphere." Two battalions, 2,000 men, ordered that morning; 4,500 more that evening.{2}
    n: 'Radio and Television Report to the American People on the Situation in the Dominican Republic, [1965 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=545) (May 2, 1965); Statement by the President Upon Sending Additional Forces to the Dominican Republic, [1965 Pub. Papers 466](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=542) (May 1, 1965). [FRUS 1964–68, XXXII, doc. 51](https://history.state.gov/historicaldocuments/frus1964-68v32/d51); [doc. 52](https://history.state.gov/historicaldocuments/frus1964-68v32/d52). [[w.dallek-flawed-giant]], 265 (the report to the nation, a few hours after the congressional briefing; the revolt "taken over and really seized and placed into the hands of a band of Communist conspirators"; not the troops ordered); [[w.johnson-white-house-diary]], 265 (Mrs. Johnson, at the Ranch, watched a twenty-minute news clip of "his TV report to the nation on the Dominican Republic": to save lives, to prevent a Communist takeover; not the words). See [[cal.1965-04-28.latin-america]]. Check: Rusk has himself urge, before Johnson''s speech of Apr. 28, a case resting on free institutions; Johnson chose to stress the Communist threat, which Rusk doubted had taken over the rising; Johnson to Bennett on "headless bodies" ([[w.rusk-as-i-saw-it-1990]], 373–74).'
    src:
      c: 7f65874d
      rows:
