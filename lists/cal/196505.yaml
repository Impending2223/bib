    when: May 6
    date: '1965-05-06'
    thread: legislatures
    c: Washington. The Senate passes H.B. 714 (the House, May 5), redrawing the congressional districts and referring them to the people at the general election of November 1966. Filed with the Secretary of State May 7.
    n: 'Wash. Laws 1965, Ex. Sess., ch. 152, [2252](https://leg.wa.gov/media/svdj12jt/1965pam2.pdf#page=618); § 10 (the referral) and the passage and filing, [2257](https://leg.wa.gov/media/svdj12jt/1965pam2.pdf#page=623). Check: that ch. 152 is Referendum Bill 16 ([[cal.1966-11-08.legislatures-wa]]). To check: [[w.dixon-democratic-representation]].'
    tags: [state:wa]
