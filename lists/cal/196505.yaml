  - id: cal.1965-05-05.vietnam-congress-2
    when: May 5
    date: '1965-05-05'
    thread: vietnam-congress
    also: [vietnam-supplemental]
    c: 'Appropriations and Armed Services, jointly, report the $700 million unanimously in the morning; the Senate debates it from the afternoon. Allott: "we are there and that we must win." Javits for it, but no substitute for a new resolution: "I want to be consulted again." Byrd against signals "confused" by "pacifistic demonstrations." Clark: "What is the difference between voting for a $700 million appropriation and voting for a declaration of war?" Church: Stennis, managing, "I do not think we are signing a blank check"; Church for it, "no blank-check endorsement of decisions to be made in the future."'
    n: '[111 Cong. Rec. 9492–507](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-6-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 245–46. [[w.mann-grand-delusion]], 434. See [[cal.1965-05-04.vietnam]]. Names: Allott, Javits, Robert Byrd, Clark, Church, Stennis.'
