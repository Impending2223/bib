    when: May 2
    date: '1965-05-02'
    thread: vietnam-congress
    c: 'Sunday evening, Johnson with the leaders of both parties and both houses before his request for money: by a press report, upset at "the Capitol Hill sniping," glaring through most of his monologue at Fulbright, who had called for a pause in the bombing.'
    n: '[[w.gibbons-u-s-government-and]], III, 242. To check: *Washington Post*, May 3, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 242 n.75). See [[cal.1965-05-04.vietnam]]. Names: Johnson, Fulbright.'
