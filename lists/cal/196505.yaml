    c: 'Hunan 湖南 Office for Statistics, going back over the commune and county records: grain procured in the province 2.39 million tonnes in 1956 (23.1 per cent of the crop), 2.74 in 1957 (24.2), 3.50 in 1958 (28.5), 3.89 in 1959 (35.1), 2.50 in 1960 (31.2), 2.21 in 1961 (27.6), of crops of 10.36, 11.32, 12.25, 11.09, 8.02 and 8 million tonnes.'
