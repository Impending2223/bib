  - id: cal.1965-05-02.vietnam-congress
    when: May 2
    date: '1965-05-02'
    thread: vietnam-congress
    c: 'Sunday evening, Johnson with the leaders of both parties and both houses before his request for money: by a press report, upset at "the Capitol Hill sniping," glaring through most of his monologue at Fulbright, who had called for a pause in the bombing.{1}'
    n: '[[w.gibbons-u-s-government-and]], III, 242; [[w.dallek-flawed-giant]], 265–66, 269 (the congressional briefing of May 2 on the Dominican Republic: Fulbright asks "Is Bosch a Communist?"; Johnson: "I can''t live in the Hemisphere" if he sends Marines, "if I don''t, I can''t live at home"; to the leaders, "in the midst of the Dominican crisis": "Congress ought to show the world that it really backs up his policies"; not the hour or the press report of Fulbright). [[w.mann-grand-delusion]], 433 (the meeting; the request). To check: *Washington Post*, May 3, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 242 n.75). See [[cal.1965-05-04.vietnam]]. Names: Johnson, Fulbright.'
