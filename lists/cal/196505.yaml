    c: 'Vance puts the field commanders'' courses of action to the President''s advisers; Wheeler for the second, a corridor linking the Marines and the paratroops. Johnson approves late in the day, the advance not before midnight, McNamara against a Sunday operation. The Chiefs'' order: "any time after midnight 2/3 May."'
