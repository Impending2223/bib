    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai receives Zhejiang rebel delegates and tells those who broke into the provincial military district to leave at once. Not all in power take the capitalist road. Five points on seizing power: from below; rebels at the core, uniting the majority; each unit''s own rebels first; the Cultural Revolution''s leadership seized, production supervised; from the top down. Jiang Hua, an old Jinggangshan comrade, is to be protected.'
