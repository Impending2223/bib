  - id: cal.1967-01-02.china-leadership
    when: Jan. 2
    date: '1967-01-02'
    thread: china-leadership
    c: Mao decides to send Zhang Chunqiao and Yao Wenyuan to Shanghai as investigators of the Cultural Revolution Group, to report to the Center on the Revolution there. They arrive Jan. 4.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 2, 1967. [[w.macfarquhar-maos-last-revolution]], 164 (Zhang and Yao arrive Jan. 4 on a PLA air force plane, as the Group''s representatives and senior local cadres, in army overcoats). Made public: 2013. To check: [[w.jingxian-shinian-yimeng]], 25 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.49a); [[w.pixian-chen-pixian-huiyilu]], 45, 79 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.49b). Names: Mao Zedong, Zhang Chunqiao, Yao Wenyuan.'
