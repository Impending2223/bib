    when: '1967'
    date: '1967'
    thread: china-leadership
    c: By Zhou Enlai's record, to keep rail transport open and push the railways to a quick great alliance and three-in-one, in the year he received cadres and masses of the railway system nearly a hundred times; the alliance and three-in-one of the country's eighteen railway bureaus, fifty-two sub-bureaus and some main stations and sections were all won through his attention.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (1967, the last items); [[w.macfarquhar-maos-last-revolution]], 268 (Zhou receives railway officials and workers more than 100 times in 1967 and is given chief credit for the three-way alliances of the eighteen bureaus, fifty-two sub-bureaus and some main stations). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 210, cited by [[w.macfarquhar-maos-last-revolution]], 268 n.58). To check: [[w.zhou-enlai-nianpu-1949]], III, 210 (cited by [[w.macfarquhar-maos-last-revolution]], 268 n.58). Names: Zhou Enlai.'
