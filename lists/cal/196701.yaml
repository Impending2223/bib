  - id: cal.1967-01-11.china-leadership
    when: Jan. 11
    date: '1967-01-11'
    thread: china-leadership
    c: 'Mao reads Zhou Enlai''s drafts of the message to Shanghai''s rebel bodies (from the Center, State Council, Military Commission and Cultural Revolution Group) and a *Renmin ribao*–*Hongqi* editorial against economism, and Chen Boda''s and Jiang Qing''s drafts of Jan. 9 on economism, on stopping the corruption of mass bodies, and on broadcasting stations: all five very good; Lin Biao to preside that afternoon or the next day over a Politburo meeting, with the Group and others, to pass and issue them.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 11, 1967. [[w.macfarquhar-maos-last-revolution]], 165–166 (Zhou presides over the drafting of the telegram congratulating the Shanghai rebels; Mao adds the Group''s name to the signatories at the last moment, without consulting Zhou); [[w.jianguo-yilai-mao-zedong]], XVIII, 422–423 (Jan. 11, 1967; Mao''s two notes, 2 a.m. Jan. 11, to Zhou Enlai, Chen Boda and Jiang Qing, on the two drafts they sent and three more Chen and Jiang sent Jan. 9 (the Center''s notices against economism, against corrupting mass organizations with money and goods, and putting contested radio stations under army control); printed from the manuscript). Made public: 2013. Check: the entry has the message drafted in the names of the Center, the State Council, the Military Commission and the Group already; the book (166, from Wang Li) has Mao adding the Group at the last moment. To check: [[w.li-insiders-account-of-the]], 35–36 (cited by [[w.macfarquhar-maos-last-revolution]], 166 n.59); Central Committee, notice against economism (draft of Jan. 9, dated Jan. 11, issued Jan. 13, 1967) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 423 n.2a); Central Committee and State Council, notice on stopping the corruption of mass organizations (dated Jan. 11, issued Jan. 13, 1967) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 423 n.2b); Central Committee, notice on radio stations (contested stations under army control) (dated Jan. 11, issued Jan. 13, 1967) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 423 n.2c). Names: Mao Zedong, Zhou Enlai, Chen Boda, Jiang Qing, Lin Biao.'
    src:
      c: db26982a
      rows:
