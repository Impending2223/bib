      - 1966-12-31T22:00Z
    time_band: predawn
    time_zone: Asia/Shanghai
  - id: cal.1967-01-01.china-leadership-11
    when: Jan. 1
    date: '1967-01-01'
    place: shanghai
    thread: china-leadership
    c: 'At a meeting Cao Diqiu 曹荻秋, vice-secretary of the Shanghai committee and mayor, relays the view of the first secretary Chen Pixian 陳丕顯: "loosen up on economic questions, don''t resist." Five points are discussed: all workers retrenched and sent down since 1958 to return to their plants; jobless youth to be placed; street industry to take the "state-owned" label and have its labor insurance and welfare raised; wages in the five outer-county classes to be raised toward the eight-class standard; long-term temporary and outside-contract workers to become permanent.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 380. Made public: 2016. To check: Shanghai Revolutionary Committee''s liaison HQ against economism, 〈無產階級文化大革命中上海反對經濟主義大事記 1966年11月–1967年3月15日〉 (discussion draft, Mar. 17, 1967), in the "Wenge bowuguan" 文革博物館 321 *Shanghai de "jingjizhuyi feng"* 《上海的「經濟主義風」》 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 380 n.24); Shanghai Labor and Wage Committee Red Rebel Team 上海市勞動工資委員會紅色造反隊, 〈反革命修正主義分子陳丕顯、曹荻秋是大颳反革命經濟主義妖風的罪魁禍首〉, June 27, 1967 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 380 n.23).'
    src:
      c: f68564f3
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 380: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 380 n.24: all'
    tags: [polity:prc, vis:only:prc, ok:fields-time]
