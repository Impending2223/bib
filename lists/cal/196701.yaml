  - id: cal.1967-01-02.china-leadership-2
    when: Jan. 2
    date: '1967-01-02'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai, before dawn, calls delegates in Peking of over twenty railway units and tells them the railways must never be paralyzed, not for a moment: a break hurts production, the Cultural Revolution, the Third Five-Year Plan and the people''s livelihood. The national railway rebel liaison station should form a liaison committee quickly to keep the lines open.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 2, 1967). Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc]
  - id: cal.1967-01-02.china-leadership-3
    when: Jan. 2
    date: '1967-01-02'
    thread: china-leadership
    c: Zhou Enlai chairs the Center's liaison meeting on East China and on the military training of college and middle-school students; Jiang Qing, Zhang Chunqiao, Wang Li and Yao Wenyuan also attend. From now the main members of the Cultural Revolution Group take part in the Center's liaison meetings.
