  - id: cal.1967-01-22.china-leadership-4
    when: Jan. 22
    date: '1967-01-22'
    thread: china-leadership
    c: 'Zhang Linzhi, minister of coal, is hounded to death by rebels. Zhou Enlai, on hearing, says in grief: "A minister dead and no one knows how; how can I answer to the Party Center?" He has the Public Security Ministry report the autopsy and in later talks with mass delegates often speaks of Zhang''s death: cadres may not be struggled thus, and old cadres are not to be seen with hostility, for they are the Party''s and states treasure.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 22, 1967, the item after); [[w.macfarquhar-maos-last-revolution]], 184 n.4 (Zhang Linzhi dies under interrogation, after questioning under torture fifty times; aged fifty-eight). Made public: 1991. To check: [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 281 (cited by [[w.macfarquhar-maos-last-revolution]], 184 n.4a). Names: Zhou Enlai, Zhang Linzhi.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
