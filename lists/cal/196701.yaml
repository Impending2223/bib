        - 'w.macfarquhar-maos-last-revolution 164: all'
    tags: [polity:prc]
  - id: cal.1967-01-01.china-leadership-9
    when: Jan. 1
    date: '1967-01-01'
    time: 1966-12-31T21:00Z
    time_approx: true
    place: shanghai
    thread: china-leadership
    also: [china]
    c: About 5 a.m. Chen Pixian calls the leaders of Shanghai's major mass organizations to an urgent meeting; Wang Hongwen represents the Workers' General Headquarters and Xu Jingxian the Shanghai Party Committee Agencies Revolutionary Rebel Liaison Post. The meeting orders the Kunshan petitioners to withdraw and drafts an open letter to the people of Shanghai.
    n: '[[w.macfarquhar-maos-last-revolution]], 164; [[w.yang-jisheng-tiandi-fanfu]], I, 348–349 (Chen Pixian, in uniform as first political commissar of the Shanghai Garrison, tells the committee meeting that Zhou has just rung; from Dec. 30 for 26 hours 26 passenger trains were stopped, over 50,000 passengers could not board and over 50,000 stranded on the way, 38 freight trains stopped and 22 halted, tens of thousands of tons of goods piled up, and Shanghai has only a week''s grain; Xu Jingxian, standing opposite, blames Chen as the real commander behind Cao Diqiu, reads Zhang Chunqiao''s telephone record, and proposes a joint statement drafted by Central Conservatory and Jiaotong University students and agreed by Chen). Time: "at about five in the morning" (164). Made public: 2005. Printed for internal circulation: [[w.shanghai-wenhua-dageming-shihua]] (1992, a typeset manuscript). To check: [[w.pixian-chen-pixian-huiyilu]], 119–120 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.45); [[w.shanghai-wenhua-dageming-shihua]], I, 226–227 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.47); Xu Jingxian 徐景賢, *Shinian yi meng* 《十年一夢》 (Shidai guoji chuban youxian gongsi 時代國際出版有限公司), 22, 22–23 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 348 n.39). See [[cal.1967-01-01.china-leadership-2]]. Check: the book''s "about five in the morning" against Zhou''s call a little past three (163).'
    src:
      c: ad2b863c
      rows:
        - 'w.macfarquhar-maos-last-revolution 164: all'
        - 'w.yang-jisheng-tiandi-fanfu I, 348–349: ?'
    tags: [polity:prc, vis:only:prc]
    time_zone: Asia/Shanghai
