    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 347–348. The words: 1月1日凌晨 (I, 347). Made public: 1967. To check: Xu Jingxian 徐景賢, *Shinian yi meng* 《十年一夢》 (Shidai guoji chuban youxian gongsi 時代國際出版有限公司), 21 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 348 n.38). Names: Zhang Chunqiao, Zhou Enlai.'
