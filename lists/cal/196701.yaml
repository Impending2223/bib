    date: 1967-01
    at: after 1967-01-11
    thread: china-leadership
    c: 'Xu Xiangqian 徐向前, at his first meeting as head of the All-Army Cultural Revolution Group 全軍文革小組, gives three principles: do not fear disorder; criticize Liu''s and Deng''s bourgeois reactionary line thoroughly; old cadres not to fear the masses; he calls for learning from the local rebels and calls Xiao Hua 蕭華 a coward. Chen Yi 陳毅: "you had the same illness as we; now you are cured"; Nie Rongzhen 聶榮臻: "I am ill, but I do not fear death."'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 423. Made public: 2011. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xin shiji chubanshe 新世紀出版社, Hong Kong, 2011), 496 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 423 n.15). See [[cal.1967-01-11.china-leadership-3]]. Names: Xu Xiangqian, Chen Yi, Nie Rongzhen.'
