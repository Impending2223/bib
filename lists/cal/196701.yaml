# Cal. LXXXVII January 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXVII
entries:
  - id: cal.1967-01-01.opinion
    when: Jan. 1
    date: '1967-01-01'
    thread: opinion
    also: [state-and-city-finance]
    c: 'Gallup, Dec. 8–13, 1966: a share of the federal income tax returned to the States and localities to spend as they see fit: favor 70 percent, oppose 18. The biggest threat to the country in the future: big government 49, big labor 21, big business 14. Spends the taxpayer''s dollar more wisely: the State government 49, the Federal Government 18, neither 17.'
    n: '[[w.gallup-poll]], III, 2043.'
  - id: cal.1967-01-02.states-and-cities
    when: Jan. 2
    date: '1967-01-02'
    thread: states-and-cities
    also: [elections-1966]
    c: Sacramento. Reagan sworn as governor of California in the Capitol just after midnight, Finch as lieutenant governor (Check the hour).
    n: 'To check: [[w.cannon-governor-reagan]]; [[w.dallek-right-moment]]. See [[cal.1966-11-08.elections-1966]]. Names: Reagan, Finch.'
    tags: [name:reagan-ronald, name:finch-robert-h]
  - id: cal.1967-01-03.congress
    when: Jan. 3
    date: '1967-01-03'
    thread: congress-powell
    c: 'Powell. The Special Subcommittee on Contracts of the House Administration Committee, Hays its chairman, reports on the Education and Labor Committee''s spending: Powell and some of the committee''s staff deceived the House on travel; strong evidence of salary paid his wife unlawfully, at his direction (Check the date). No action in the 89th Congress, which ends at noon.'
    n: 'H.R. Rep. No. 2349, 89th Cong., 2d Sess., 6–7 (1966), as given in *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 489–90 (1969) (K–J Cong. II.J.1). To check: [[w.hamilton-adam-clayton-powell-jr]]; [[w.powell-adam-by-adam]]. See [[cal.1966-01-10.congress]]. Names: Powell, Hays.'
    tags: [name:powell-adam-clayton-jr, name:hays-wayne-l]
  - id: cal.1967-01-03.assassination
    when: Jan. 3
    date: '1967-01-03'
    thread: assassination
    c: Ruby dies at Parkland Hospital, Dallas, of a pulmonary embolism; cancer found in December. The Texas Court of Criminal Appeals had reversed his conviction Oct. 5, 1966, and ordered a new trial outside Dallas.
    n: '*Rubenstein v. State*, [407 S.W.2d 793](https://static.case.law/sw2d/407/case-pdfs/0793-01.pdf) (Tex. Crim. App. 1966). To check: [[w.wills-jack-ruby]]; [[w.kaplan-trial-of-jack-ruby]]. See [[cal.1964-03-14.assassination]]. Names: Ruby.'
    tags: [name:ruby-jack]
  - id: cal.1967-01-04.defense
    when: Jan. 4
    date: '1967-01-04'
    thread: defense-abm
    c: 'ABM. Johnson with McNamara, Vance, the Joint Chiefs, Humphrey and the past and present science advisers, Killian, Kistiakowsky, Wiesner, York and Hornig. McNamara: nothing; a "thin" system against Chinese missiles, accidental launches and for the Minuteman; or a defense of the cities against a heavy Soviet attack. Wheeler for the Chiefs: Nike-X for 25 cities. Killian, Kistiakowsky, Wiesner and Hornig against a defense of the cities; Killian and Hornig would take the thin system if it must come.'
    n: 'FRUS 1964–68, X, docs. [166](https://history.state.gov/historicaldocuments/frus1964-68v10/d166), [167](https://history.state.gov/historicaldocuments/frus1964-68v10/d167). [[w.drea-mcnamara-clifford-and-the-2011]], 363–364. To check: [[w.seaborg-stemming-the-tide]]. See [[cal.1966-12-06.defense]]. Made public: FRUS 1964–68, X (2002). Names: McNamara, Vance, Wheeler, Humphrey, Killian, Kistiakowsky, Wiesner, York, Hornig, Johnson.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:vance-cyrus, name:wheeler-earle, name:humphrey-hubert-h, name:killian-james-r-jr, name:kistiakowsky-george-b, name:wiesner-jerome-b, name:york-herbert-f, name:hornig-donald-f]
  - id: cal.1967-01-04.vietnam
    when: Jan. 4
    date: '1967-01-04'
    thread: vietnam-sunflower
    also: [soviet-union]
    c: 'Rusk to Dobrynin, two and a half hours: a revision of the fourteen points; what would Moscow do if the bombing stopped.'
    n: 'FRUS 1964–68, V, doc. [7](https://history.state.gov/historicaldocuments/frus1964-68v05/d7). Made public: [[w.herring-secret-diplomacy-of-the]] (1983); FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV. To check: [[w.kraslow-secret-search-for-peace]]; [[w.cooper-lost-crusade]]; [[w.herring-lbj-and-vietnam]]. See [[cal.1966-12-23.vietnam]]. Names: Rusk, Dobrynin.'
    tags: [name:rusk-dean, name:dobrynin-anatoly]
  - id: cal.1967-01-04.opinion
    when: Jan. 4
    date: '1967-01-04'
    thread: opinion
    c: 'Gallup, Dec. 8–13, 1966: the man most admired, in order of mention: Johnson, Eisenhower, Robert Kennedy, Billy Graham, Pope Paul VI, U Thant, Dirksen, Romney, Nixon, Reagan.'
    n: '[[w.gallup-poll]], III, 2043. Names: Johnson, Eisenhower, Kennedy, Graham, Paul VI, U Thant, Dirksen, Romney, Nixon, Reagan.'
    tags: [name:johnson-lyndon-b, name:eisenhower-dwight-d, name:kennedy-robert-f, name:graham-billy, name:paul-vi, name:u-thant, name:dirksen-everett, name:romney-george-w, name:nixon-richard-m, name:reagan-ronald]
  - id: cal.1967-01-05.africa
    when: Jan. 5
    date: '1967-01-05'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'Rhodesia. Executive Order 11322, under the United Nations Participation Act, carrying out Resolution 232: imports of Rhodesia''s asbestos, iron ore, chrome, pig iron, sugar, tobacco, copper, meat, hides and leather exported after Dec. 16 forbidden; and the supply to it of arms, aircraft, motor vehicles and oil. Enforcement to State, Commerce and the Treasury. Feb. 27, reported to Congress.'
    n: '[Executive Order 11322—Relating to Trade and Other Transactions Involving Southern Rhodesia](https://www.presidency.ucsb.edu/documents/executive-order-11322-relating-trade-and-other-transactions-involving-southern-rhodesia) (Jan. 5, 1967); Letter to the President of the Senate and to the Speaker of the House on Executive Order 11322, [1967 Pub. Papers 242](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=310) (Feb. 27, 1967). To check: [[w.deroche-black-white-and-chrome]]. See [[cal.1966-12-02.europe-and-the-alliance]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-01-05.governors-ca
    when: Jan. 5
    date: '1967-01-05'
    thread: governors
    also: [state-and-city-finance]
    c: Sacramento. Reagan's inaugural address on the Capitol steps. The year's budget $4.6 billion, "an all-time high among the 50 states," with an estimated deficit of $63 million; next year's could reach three-quarters of a billion. "We are going to squeeze and cut and trim until we reduce the cost of government." Property tax relief promised. The "Creative Society."
    n: '[First Inaugural Address as Governor of California](https://www.presidency.ucsb.edu/documents/first-inaugural-address-governor-california) (Jan. 5, 1967); also [Reagan Library](https://www.reaganlibrary.gov/archives/speech/january-5-1967-inaugural-address-public-ceremony). To check: [[w.cannon-governor-reagan]]; [[w.dallek-right-moment]]; [[w.groot-selling-ronald-reagan]]. See [[cal.1967-01-02.states-and-cities]]. Names: Reagan.'
    tags: [state:ca, name:reagan-ronald]
  - id: cal.1967-01-07.elections-1968
    when: Jan. 7
    date: '1967-01-07'
    thread: elections-1968
    c: 'New York. Nixon with his advisers, in private: a campaign for the nomination to be prepared; he to stay out of public politics for some months (Check the terms).'
    n: 'To check: [[w.witcover-resurrection-of-richard-nixon]]; [[w.nixon-rn]]; [[w.ambrose-nixon]]; [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]. See [[cal.1966-11-08.elections-1966]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1967-01-08.vietnam
    when: Jan. 8
    date: '1967-01-08'
    thread: vietnam-operations
    c: 'Cedar Falls begins: some 30,000 American and South Vietnamese troops in the Iron Triangle, northwest of Saigon; the 1st and 25th Divisions, the 173rd Airborne and 196th Infantry Brigades, the 11th Armored Cavalry. Tunnels and stores destroyed. Bến Súc, some 3,500 people, moved out and razed; about 6,000 civilians taken from the area; the area made a free-fire zone.'
    n: '[[w.vietnam-victory-in-vietnam]], 196–97. Check: *Victory in Vietnam* gives more than 3,000 American and South Vietnamese casualties (196). To check: [[w.rogers-cedar-falls-junction-city]]; [[w.schell-village-of-ben-suc]].'
    tags: [place:iron-triangle, place:ben-suc]
  - id: cal.1967-01-09.press-and-broadcasting
    when: Jan. 9
    date: '1967-01-09'
    thread: press-and-broadcasting
    also: [court]
    c: '*Time, Inc. v. Hill*, [385 U.S. 374](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385374/usrep385374.pdf): reversed. New York''s privacy statute may not give damages for a false report of a matter of public interest without proof that the publisher knew it false or wrote in reckless disregard of the truth; the jury not so instructed. Brennan for the Court; Black, with Douglas, concurring; Harlan in part; Fortas, with Warren and Clark, dissenting. Nixon had argued for the Hills.'
    n: 'See [[cal.1966-10-18.court]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1967-01-09.court
    when: Jan. 9
    date: '1967-01-09'
    thread: court
    also: [legislatures]
    c: '*Swann v. Adams*, [385 U.S. 440](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385440/usrep385440.pdf): Florida''s third apportionment struck. Senate districts from 15.09 percent over the average to 10.56 under; House, 18.28 over to 15.27 under. The State gave no acceptable reason for the variances. White for the Court; Harlan, with Stewart, dissenting.'
    n: 'To check: [[w.dixon-democratic-representation]]. See [[cal.1966-02-25.legislatures-fl]].'
    tags: [state:fl]
  - id: cal.1967-01-10.georgia-ga
    when: Jan. 9–10
    date: '1967-01-09'
    thread: georgia
    also: [governors, elections-1966, state-legislatures]
    c: 'Atlanta. Jan. 9, the House convenes; Bond sworn in, a year after it refused him his seat. Jan. 10, the General Assembly in joint session chooses the governor from the two highest: Maddox 182, Callaway 66. Bond among those not voting. Maddox sworn the same evening.'
    n: '[*Georgia''s Official Register, 1967–1968*, 25](https://dlg.galileo.usg.edu/data/dlg/sreg/pdfs/dlg_sreg_1967.pdf#page=27) ("Governor, Jan. 10, 1967-date"). The vote: [Wikipedia, "1966 Georgia gubernatorial election"](https://en.wikipedia.org/wiki/1966_Georgia_gubernatorial_election), from the *Atlanta Constitution*, Jan. 11, 1967; Check: the *Journal of the House*, 1967. To check: [[w.short-everything-is-pickrick]]; [[w.bartley-from-thurmond-to-wallace]]; [[w.neary-julian-bond]]. See [[cal.1966-12-12.georgia]]; [[cal.1966-12-05.georgia]]. Names: Maddox, Callaway, Bond.'
    tags: [state:ga, city:atlanta, name:maddox-lester, name:callaway-howard-h, name:bond-julian]
  - id: cal.1967-01-10.rules
    when: Jan. 10
    date: '1967-01-10'
    thread: rules
    also: [congress]
    c: '90th Congress convenes. Senate 64 D–36 R; House 248 D–187 R, Powell among the Democrats. McCormack Speaker over Ford, [245–186](https://voteview.com/rollcall/RH0900001). The rules of the 89th Congress taken over without the 21-day rule: the previous question, [196–225](https://voteview.com/rollcall/RH0900004); the amendment dropping it, [234–185](https://voteview.com/rollcall/RH0900005).'
    n: 'H. Res. 7, 90th Cong. [113 Cong. Rec., House, Jan. 10, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt1/pdf/GPO-CRECB-1967-pt1-1-2.pdf); [113 Cong. Rec., Senate, Jan. 10, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt1/pdf/GPO-CRECB-1967-pt1-1-1.pdf). To check: [[w.zelizer-on-capitol-hill]]; [[w.congress-and-the-nation-1969]]. See [[cal.1965-01-04.congress]]. Names: McCormack, Ford, Powell.'
    tags: [congress:90, name:mccormack-john-w, name:ford-gerald-r, name:powell-adam-clayton-jr, committees:90]
  - id: cal.1967-01-10.congress
    when: Jan. 10
    date: '1967-01-10'
    thread: congress-powell
    c: 'Powell. Jan. 9, the Democratic members-elect in caucus remove him as chairman of Education and Labor. Jan. 10, asked to stand aside at the oath. The previous question on Udall''s resolution to swear him refused, [126–304](https://voteview.com/rollcall/RH0900002); the resolution as amended adopted, [363–65](https://voteview.com/rollcall/RH0900003): a select committee to inquire into his right to the seat; until the House acts on its report, Powell not to be sworn, his pay and allowances to continue.'
    n: 'H. Res. 1, 90th Cong. [113 Cong. Rec., House, Jan. 10, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt1/pdf/GPO-CRECB-1967-pt1-1-2.pdf), 26–27; H.R. Rep. No. 27, 90th Cong., 1st Sess., 1–2 (1967), as given in *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 489–90 (1969) (K–J Cong. II.J.1). To check: [[w.hamilton-adam-clayton-powell-jr]]; [[w.haygood-king-of-the-cats]]; [[w.powell-adam-by-adam]]; [[w.congress-and-the-nation-1969]]. See [[cal.1967-01-03.congress]]. Names: Powell, Udall.'
    tags: [name:powell-adam-clayton-jr, name:udall-morris-k]
  - id: cal.1967-01-10.program
    when: Jan. 10
    date: '1967-01-10'
    thread: program
    also: [vietnam]
    c: 'State of the Union, to a joint session, 9:33 p.m. "A time of testing." Asked: social security up 20 percent on the average, the minimum from $44 to $70; age discrimination in employment barred; Head Start for children of three; clean air by "regional airsheds"; fair housing; jury discrimination ended; the draft reformed; wiretapping outlawed but for national security; truth in lending; election reform; a Safe Streets and Crime Control Act, firearms controlled; an East-West trade bill and the consular convention. A 6 percent surcharge on income taxes. Deficit $9.7 billion in fiscal 1967, $8.1 billion in 1968. The Soviets'' antimissile defense near Moscow. Vietnam: "We face more cost, more loss, and more agony"; "We will stand firm."'
    n: 'Annual Message to the Congress on the State of the Union, [1967 Pub. Papers 2](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=70) (Jan. 10, 1967). FRUS 1964–68, V, doc. [11](https://history.state.gov/historicaldocuments/frus1964-68v05/d11). [[w.dallek-flawed-giant]], 449–50. To check: [[w.zelizer-fierce-urgency-of-now]]; [[w.bernstein-guns-or-butter]]; [[w.califano-triumph-and-tragedy-of]]. See [[cal.1966-01-12.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - economy
      - welfare
      - conservation
      - crime-and-hijacking
      - open-housing
      - consumers
      - draft
  - id: cal.1967-01-10.economy
    when: Jan. 10
    date: '1967-01-10'
    thread: economy-surcharge
    also: [vietnam]
    c: 'The surcharge proposed in the State of the Union: 6 percent on individual and corporate income taxes, from July 1, for two years or as long as the war''s unusual costs last; some $4.5 billion in the first year. Tax rates still $20 billion a year below those of 1964, by Johnson''s figure.'
    n: 'Annual Message to the Congress on the State of the Union, [1967 Pub. Papers 2](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=70) (Jan. 10, 1967). [[w.zelizer-taxing-america]], 257–58 (the proposal). To check: [[w.bernstein-guns-or-butter]]; [[w.okun-political-economy-of-prosperity]]; [[w.collins-more]]; [[w.president-and-the-council]]. See [[cal.1966-12-31.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-01-10.vietnam-sunflower
    when: Jan. 10
    date: '1967-01-10'
    thread: vietnam-sunflower
    c: 'Moscow. Guthrie, the embassy''s deputy chief, gives Lê Trang of the North Vietnamese embassy a message for Hanoi: the United States puts "the highest priority" on "a mutually agreeable, completely secure arrangement for exchanging communications" on a settlement.'
    n: 'FRUS 1964–68, V, docs. [8](https://history.state.gov/historicaldocuments/frus1964-68v05/d8), [10](https://history.state.gov/historicaldocuments/frus1964-68v05/d10). See [[cal.1967-01-04.vietnam]]. Names: Guthrie, Lê Trang.'
    tags: [name:guthrie-john-c, name:le-trang]
  - id: cal.1967-01-11.opinion
    when: Jan. 11
    date: '1967-01-11'
    thread: opinion
    also: [assassination]
    c: 'Gallup, Dec. 8–13, 1966: one man responsible for the assassination of Kennedy, 36 percent; others involved, or uncertain, 64. Another investigation: should be 32, should not 63.'
    n: '[[w.gallup-poll]], III, 2044. Names: John F. Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1967-01-11.electoral-college
    when: Jan. 11
    date: '1967-01-11'
    thread: electoral-college
    also: [amendments, congress]
    c: 'Bayh introduces S.J. Res. 2, direct election of the President and Vice President, with eleven cosponsors; eighteen by the session''s end. Smathers the same day, S.J. Res. 3: a national primary, and each State''s electoral vote divided in proportion to its popular vote.'
    n: '[113 Cong. Rec. 193](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt1/pdf/GPO-CRECB-1967-pt1-2-2.pdf#page=15) (1967); History of Bills, 1967, [S.J. Res. 2](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt28/pdf/GPO-CRECB-1967-pt28-2.pdf#page=79); *Election of the President* hearings, [267](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=275). To check: [[w.peirce-peoples-president]]; [[w.longley-politics-of-electoral-college]]; [[w.kyvig-explicit-and-authentic-acts]]. See [[cal.1966-03-08.electoral-college]]. Names: Bayh, Smathers.'
    tags: [name:bayh-birch, name:smathers-george-a]
  - id: cal.1967-01-12.vietnam
    when: Jan. 12
    date: '1967-01-12'
    thread: vietnam
    also: [war-opposition]
    c: 'Ashmore and Baggs, of the Center for the Study of Democratic Institutions, in Hanoi, Jan. 6–14, after a briefing at State. Jan. 12, with Hồ Chí Minh: private talks could begin once the bombing stopped; no reciprocal step before it. Their report to William Bundy, Jan. 18.'
    n: 'FRUS 1964–68, V, doc. [20](https://history.state.gov/historicaldocuments/frus1964-68v05/d20). Made public: [[w.ashmore-mission-to-hanoi]] (1968). See [[cal.1967-01-04.vietnam]]. Names: Ashmore, Baggs, Hồ Chí Minh, William Bundy.'
    tags: [name:ashmore-harry, name:baggs-william, name:ho-chi-minh, name:bundy-william, place:hanoi]
  - id: cal.1967-01-12.cities-and-housing
    when: Jan. 12
    date: '1967-01-12'
    thread: cities-and-housing
    c: 'A National Commission on Urban Problems, Douglas its chairman, defeated for the Senate in November: a review of zoning, housing and building codes, taxation and development standards, with HUD; and ways to increase the supply of low-cost housing. Authorized by the Housing and Urban Development Act of 1965 and the Demonstration Cities Act.'
    n: 'Statement by the President Upon Announcing the Appointment of a Commission on Codes, Zoning, Taxation and Development Standards, [1967 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=82) (Jan. 12, 1967). To check: [[w.douglas-in-the-fullness-of]]. See [[cal.1966-11-03.cities-and-housing]]. Names: Douglas.'
    tags: [name:douglas-paul-h, name:johnson-lyndon-b]
  - id: cal.1967-01-13.laos
    when: Jan. 13
    date: '1967-01-13'
    thread: laos
    also: [vietnam]
    c: 'Popeye. Kohler to Rusk: Defense asks approval to seed clouds over the infiltration routes of North Vietnam and southern Laos and prolong the rains, unannounced. The test, October 1966 in the Se Kong valley, without the Lao government''s knowledge, Sullivan concurring: 82 percent of the clouds seeded gave rain. Rusk approves "on a strictly experimental basis," in five areas (Check the day).'
    n: '[FRUS 1964–68, XXVIII, doc. 274](https://history.state.gov/historicaldocuments/frus1964-68v28/d274), and n. 3 (Kohler to Unger, Feb. 7). [[w.frankum-like-rolling-thunder]], 120: the test Sept. 29–Oct. 28, 1966, 56 cases, 85 percent. Names: Kohler, Rusk, Sullivan.'
    tags: [name:kohler-foy-d, name:rusk-dean, name:sullivan-william-h]
  - id: cal.1967-01-15.opinion
    when: Jan. 15
    date: '1967-01-15'
    thread: opinion
    also: [welfare]
    c: 'Gallup, Dec. 8–13, 1966: birth control pills free to all women of child-bearing age on relief: yes 62 percent, no 28. Protestants 63 yes; Catholics 56.'
    n: '[[w.gallup-poll]], III, 2044.'
  - id: cal.1967-01-16.assassination
    when: Jan. 16
    date: '1967-01-16'
    thread: assassination
    also: [robert-kennedy]
    c: 'Jacqueline Kennedy''s suit settled: passages of *The Death of a President* she objected to cut or changed by Manchester and Harper & Row (Check the terms). *Look*''s serial begins with its issue of Jan. 24 (Check).'
    n: 'See [[cal.1966-12-16.assassination]]. Names: Jacqueline Kennedy, Manchester.'
    tags: [name:kennedy-jacqueline, name:manchester-william]
  - id: cal.1967-01-16.court
    when: Jan. 16
    date: '1967-01-16'
    thread: court
    also: [crime-and-hijacking]
    c: 'The privilege against self-incrimination and the loss of a job. *Garrity v. New Jersey*, [385 U.S. 493](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385493/usrep385493.pdf): statements of policemen questioned on the fixing of traffic tickets under threat of removal from office are coerced and may not be used against them. Douglas for the Court; Harlan, with Clark and Stewart, and White dissenting. *Spevack v. Klein*, [385 U.S. 511](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385511/usrep385511.pdf): a lawyer may not be disbarred for asserting the privilege; *Cohen v. Hurley* (1961) overruled. Douglas for four, Fortas concurring; the same four dissenting.'
    n: 'To check: [[w.powe-warren-court-and-american]]; [[w.schwartz-super-chief]].'
    tags: [state:nj, state:ny]
  - id: cal.1967-01-16.transition-and-staff
    when: Jan. 16–18
    date: '1967-01-16'
    thread: transition-and-staff
    also: [transportation]
    c: Cabinet. Jan. 16, Boyd sworn in the East Room as the first Secretary of Transportation. Jan. 18, Connor's resignation as Secretary of Commerce accepted, from Jan. 31; Trowbridge, Assistant Secretary, to act.
    n: 'Remarks at the Swearing In of Alan S. Boyd as Secretary of the New Department of Transportation, [1967 Pub. Papers 15](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=83) (Jan. 16, 1967); Letter Accepting Resignation of John T. Connor as Secretary of Commerce, [1967 Pub. Papers 28](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=96) (Jan. 18, 1967). To check: [[w.davis-department-of-transportation]]. See [[cal.1966-11-06.transportation]]. Names: Boyd, Connor, Trowbridge.'
    tags: [name:johnson-lyndon-b, name:boyd-alan-s, name:connor-john-t, name:trowbridge-alexander-b]
  - id: cal.1967-01-16.alabama-al
    when: Jan. 16
    date: '1967-01-16'
    thread: alabama
    also: [governors, desegregation-schools]
    c: 'Montgomery. Lurleen Wallace sworn as governor. She ran "for the purpose of permitting my husband to take our fight to the final court of appeal"; her election "notice to all the world that the strength and determination of a free people to defend the principles of self-government will not be suppressed by force--force from China, from Russia, from Cuba, or from Washington, D.C." Jan. 10, George Wallace''s last address to the legislature: "federal judicial blackguards."'
    n: '[U.S. Comm''n on Civil Rights, *School Desegregation in the Southern and Border States*, Jan. 1967](https://usccr.gov/files/historical/1967/67-007.pdf), Alabama. To check: [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. See [[cal.1966-11-08.alabama-al]]. Names: Lurleen Wallace, George Wallace.'
    tags: [state:al, name:wallace-lurleen-b, name:wallace-george-c]
  - id: cal.1967-01-17.students-ca
    when: Jan. 17
    date: '1967-01-17'
    thread: students
    also: [state-and-city-finance]
    c: Reagan on the University of California's budget and tuition. Economies of "roughly 10 percent" in every department, savings over $200 million; new revenues still needed. Tuition proposed, with loans and scholarships. The university's freeze on applications "unwarranted."
    n: '[Statement of Governor Ronald Reagan on Tuition](https://www.reaganlibrary.gov/archives/speech/january-17-1967-statement-governor-ronald-reagan-tuition) (Reagan Library). To check: [[w.kerr-gold-and-the-blue-2003]]; [[w.rosenfeld-subversives]]; [[w.cannon-governor-reagan]]. See [[cal.1967-01-05.governors-ca]]. Names: Reagan.'
    tags: [state:ca, name:reagan-ronald]
  - id: cal.1967-01-18.rules
    when: Jan. 18
    date: '1967-01-18'
    thread: rules
    c: 'Senate, Rule XXII. McGovern moves to close debate on taking up S. Res. 6, three-fifths for cloture, by a majority, under Article I, section 5. Dirksen''s point of order against it: tabling refused, [37–61](https://voteview.com/rollcall/RS0900001); sustained, [59–37](https://voteview.com/rollcall/RS0900002).'
    n: '[113 Cong. Rec., Senate, Jan. 18, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt1/pdf/GPO-CRECB-1967-pt1-6-2.pdf). To check: [[w.binder-politics-or-principle]]; [[w.zelizer-on-capitol-hill]]. See [[cal.1963-02-07.rules]]. Names: McGovern, Dirksen.'
    tags: [name:mcgovern-george, name:dirksen-everett]
  - id: cal.1967-01-18.opinion
    when: Jan. 18
    date: '1967-01-18'
    thread: opinion
    also: [economy]
    c: 'Gallup, Dec. 8–13, 1966, and its affiliates in eight other nations: 1967 a year of prosperity or of economic difficulty. United States: prosperity 43 percent, difficulty 45. Norway 50 and 22; Switzerland 47 and 33; France 29 and 40; Sweden 23 and 57; Germany 16 and 66; Great Britain 15 and 65; Greece 14 and 46; the Netherlands 11 and 79.'
    n: '[[w.gallup-poll]], III, 2045.'
  - id: cal.1967-01-20.students
    when: Jan. 20
    date: '1967-01-20'
    thread: students
    c: Berkeley. The Regents of the University of California dismiss Kerr as president, 14–8, at Reagan's first meeting as a Regent.
    n: 'To check: [[w.kerr-gold-and-the-blue-2003]]; [[w.rorabaugh-berkeley-at-war]]; [[w.cannon-governor-reagan]]; [[w.dallek-right-moment]]. See [[cal.1964-10-01.students]]. Names: Kerr, Reagan.'
    tags: [name:kerr-clark, name:reagan-ronald, state:ca]
  - id: cal.1967-01-20.soviet-union
    when: Jan. 20
    date: '1967-01-20'
    thread: soviet-union-consular
    c: The consular convention, signed at Moscow June 1, 1964, before the Senate. State releases Hoover's letter of Sept. 16 to Rusk on the convention. Johnson asks Ramsey Clark to get Hoover to say he is not against it.
    n: 'FRUS 1964–68, XIV, doc. [192](https://history.state.gov/historicaldocuments/frus1964-68v14/d192); [Johnson and Ramsey Clark, 7 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ramsey-clark-january-21-1967-0), Conversation WH6701-07-11383 (Miller Center) (Check the day: FRUS Jan. 20, the Miller Center Jan. 21). To check: [[w.dobrynin-in-confidence]]. See [[cal.1966-10-07.europe-and-the-alliance]]. Made public: the call to Clark, FRUS 1964–68, XIV (2001). Names: Hoover, Rusk, Ramsey Clark, Johnson.'
    tags: [name:johnson-lyndon-b, name:hoover-j-edgar, name:rusk-dean, name:clark-ramsey]
  - id: cal.1967-01-21.defense-abm
    when: Jan. 21
    date: '1967-01-21'
    thread: defense-abm
    also: [soviet-union]
    c: 'Johnson to Kosygin, by Thompson, back in Moscow as ambassador: talks to "curb the strategic arms race"; perhaps a meeting of "our highest authorities" in Geneva.'
    n: 'FRUS 1964–68, XI, doc. [178](https://history.state.gov/historicaldocuments/frus1964-68v11/d178). Made public: FRUS 1964–68, XI (1997). See [[cal.1967-01-04.defense]]. Names: Kosygin, Thompson, Johnson.'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:thompson-llewellyn-e]
  - id: cal.1967-01-22.opinion
    when: Jan. 22
    date: '1967-01-22'
    thread: opinion
    also: [poverty]
    c: 'Gallup, Dec. 8–13, 1966, and its affiliates in seven other nations: the least a family of four needs each week to get along in this community, the median. Sweden $102; United States $101; Switzerland $60; Great Britain $58.50; West Germany $47. The American family''s food, median, non-farm: $30 a week. Standard of living going up: United States 60 percent, down 10.'
    n: '[[w.gallup-poll]], III, 2045–46.'
  - id: cal.1967-01-23.welfare
    when: Jan. 23
    date: '1967-01-23'
    thread: welfare
    also: [health]
    c: 'Message on older Americans: social security up 20 percent on the average, at least 15 percent for each beneficiary; the minimum from $44 to $70, $100 after 25 years of coverage; $4.1 billion in the first year. The earnings exemption from $1,500 to $1,680 a year; the wage base to $7,800 in 1968, $10,800 by 1974. Medicare for the 1.5 million disabled under 65 on social security and railroad retirement. States to pay welfare up to their own standards of subsistence. Discrimination in employment by age outlawed.'
    n: 'Special Message to the Congress Proposing Programs for Older Americans, [1967 Pub. Papers 32](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=100) (Jan. 23, 1967). To check: [[w.derthick-policymaking-for-social-security]]; [[w.berkowitz-mr-social-security]]. See [[cal.1967-01-10.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-01-23.antisubversion
    when: Jan. 23
    date: '1967-01-23'
    thread: antisubversion
    also: [court, students]
    c: '*Keyishian v. Board of Regents*, [385 U.S. 589](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385589/usrep385589.pdf): New York''s teacher loyalty laws, the Feinberg Law among them, void for vagueness; membership in the Communist Party, without the specific intent to further its unlawful aims, no ground for dismissal. The premise of *Adler v. Board of Education* (1952) rejected. Faculty of the State University at Buffalo had refused the certificate. Brennan for the Court; Clark, with Harlan, Stewart and White, dissenting.'
    n: 'To check: [[w.heins-priests-of-our-democracy]]; [[w.powe-warren-court-and-american]].'
    tags: [state:ny]
  - id: cal.1967-01-23.georgia
    when: Jan. 23
    date: '1967-01-23'
    thread: georgia
    also: [court]
    c: '*Whitus v. Georgia*, [385 U.S. 545](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385545/usrep385545.pdf): murder convictions of two Negroes in Mitchell County reversed. The jury commissioners drew the revised list from the old one, condemned, and from tax digests that marked Negroes "(c)"; 3 of the 33 grand jurors called and 7 of the 90 for the petit jury Negroes, in a county where 42 percent of the men over 21 are. Clark for a unanimous Court.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1967-01-23.soviet-union-consular
    when: Jan. 23
    date: '1967-01-23'
    thread: soviet-union-consular
    c: 'Foreign Relations opens hearings on the consular convention. Hoover to Mundt: the FBI expresses no opinion, but more consulates would make its work harder.'
    n: 'FRUS 1964–68, XIV, doc. [194](https://history.state.gov/historicaldocuments/frus1964-68v14/d194). See [[cal.1967-01-20.soviet-union]]. Names: Hoover, Mundt.'
    tags: [name:hoover-j-edgar, name:mundt-karl-e]
  - id: cal.1967-01-24.economy
    when: Jan. 24
    date: '1967-01-24'
    thread: economy
    also: [vietnam]
    c: 'Budget for fiscal 1968: administrative expenditures $135.0 billion, revenues $126.9 billion, deficit $8.1 billion; on the national income accounts, $169.2 billion and a deficit of $2.1 billion. Defense $75.5 billion, 56 percent; Southeast Asia $19.9 billion this year, $22.4 billion next. A supplemental of $12.3 billion asked for the war this fiscal year. The surcharge from July 1, the lowest brackets exempt.'
    n: 'Annual Budget Message to the Congress, Fiscal Year 1968, [1967 Pub. Papers 39](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=107) (Jan. 24, 1967); Letter to the Speaker of the House Requesting Supplemental Appropriations in Support of Military Operations in Southeast Asia, [1967 Pub. Papers 61](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=129) (Jan. 24, 1967). FRUS 1964–68, V, doc. [26](https://history.state.gov/historicaldocuments/frus1964-68v05/d26). See [[cal.1967-01-10.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, budget:1968]
  - id: cal.1967-01-24.defense-abm
    when: Jan. 24
    date: '1967-01-24'
    thread: defense-abm
    c: 'The budget on the ABM: Nike-X developed, not deployed; talks with the Soviets; about $375 million for production if they fail.'
    n: 'Annual Budget Message to the Congress, Fiscal Year 1968, [1967 Pub. Papers 39](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=107) (Jan. 24, 1967). See [[cal.1967-01-04.defense]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-01-24.rules
    when: Jan. 24
    date: '1967-01-24'
    thread: rules
    c: 'Senate. Cloture on the motion to take up S. Res. 6, three-fifths for cloture, [53–46](https://voteview.com/rollcall/RS0900003): short of two-thirds.'
    n: '[113 Cong. Rec., Senate, Jan. 24, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt1/pdf/GPO-CRECB-1967-pt1-9-1.pdf). See [[cal.1967-01-18.rules]].'
  - id: cal.1967-01-26.economy
    when: Jan. 26
    date: '1967-01-26'
    thread: economy
    c: 'The Economic Report: consumer prices up 2.9 percent in 1966; unemployment under 4 percent.'
    n: 'Annual Message to the Congress: The Economic Report of the President, [1967 Pub. Papers 72](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=140) (Jan. 26, 1967). See [[cal.1967-01-10.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-01-26.vietnam-operations
    when: Jan. 26
    date: '1967-01-26'
    thread: vietnam-operations
    c: 'Cedar Falls ends at midnight, after nineteen days. Counted: nearly 750 of the enemy dead, 280 prisoners, 540 ralliers, 512 suspects detained, 5,987 refugees moved; 3,700 tons of rice taken. American losses 72 killed, 337 wounded; South Vietnamese 11 killed, 8 wounded.'
    n: '[[w.rogers-cedar-falls-junction-city]], 59, 74–75; [[w.thayer-systems-analysis-view]], vol. 4, 132. See [[cal.1967-01-08.vietnam]].'
    tags: [place:iron-triangle]
  - id: cal.1967-01-27.space
    when: Jan. 27
    date: '1967-01-27'
    thread: space
    also: [soviet-union, testing]
    c: 'Outer Space Treaty signed at Washington, London and Moscow, [18 U.S.T. 2410](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-18-3/lltreaties-18-3.pdf#page=94), [610 U.N.T.S. 205](https://treaties.un.org/doc/Publication/UNTS/Volume%20610/volume-610-I-8843-English.pdf). No nuclear weapons or other weapons of mass destruction in orbit, on the moon or other celestial bodies; no claims of sovereignty there; installations on celestial bodies open to the others. In the East Room, 5:15 p.m., Rusk, Dobrynin and Dean, the British ambassador; Goldberg. In Moscow, Kosygin to Thompson after the ceremony: the Americans "constantly escalating" in Vietnam.'
    n: 'Remarks at the Signing of the Treaty on Outer Space, [1967 Pub. Papers 91](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=159) (Jan. 27, 1967); Special Message to the Senate on Transmitting the Treaty on Outer Space, [1967 Pub. Papers 147](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=215) (Feb. 7, 1967). FRUS 1964–68, XIV, doc. [196](https://history.state.gov/historicaldocuments/frus1964-68v14/d196). To check: [[w.mcdougall-heavens-and-the-earth]]; [[w.seaborg-stemming-the-tide]]. See [[cal.1966-12-08.space]]. Names: Rusk, Dobrynin, Patrick Dean, Goldberg, Kosygin, Thompson, Johnson.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:dobrynin-anatoly, name:dean-patrick, name:goldberg-arthur-j, name:kosygin-aleksei, name:thompson-llewellyn-e]
  - id: cal.1967-01-27.space-2
    when: Jan. 27
    date: '1967-01-27'
    thread: space
    c: 'Cape Kennedy, Launch Complex 34, 6:31 p.m.: fire in the Apollo command module, on the pad in a test, its cabin pure oxygen. Grissom, White and Chaffee killed. Webb asks Johnson to leave the inquiry to NASA; Seamans names a review board under Floyd L. Thompson of the Langley Research Center.'
    n: 'Statement by the President on the Death of Astronauts Virgil I. Grissom, Edward H. White 2d, and Roger B. Chaffee, [1967 Pub. Papers 92](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=160) (Jan. 27, 1967). To check: [[w.brooks-chariots-for-apollo]]; [[w.murray-apollo]]; [[w.mcdougall-heavens-and-the-earth]]. Names: Grissom, White, Chaffee, Webb, Johnson, Seamans, Floyd Thompson.'
    tags: [name:johnson-lyndon-b, name:grissom-virgil-i, name:white-edward-h-ii, name:chaffee-roger-b, name:webb-james-e, name:seamans-robert-c-jr, name:thompson-floyd-l]
  - id: cal.1967-01-27.vietnam
    when: Jan. 27
    date: '1967-01-27'
    thread: vietnam-sunflower
    c: 'Moscow. Lê Trang gives Guthrie an aide-mémoire: Hanoi will "exchange views" only when the United States ends "immediately and unconditionally the bombing and all other acts of war."'
    n: 'FRUS 1964–68, V, doc. [29](https://history.state.gov/historicaldocuments/frus1964-68v05/d29). See [[cal.1967-01-04.vietnam]]. Names: Lê Trang, Guthrie.'
    tags: [name:le-trang, name:guthrie-john-c]
  - id: cal.1967-01-28.vietnam
    when: Jan. 28
    date: '1967-01-28'
    thread: vietnam
    c: 'Nguyễn Duy Trinh, Foreign Minister, to Burchett: talks "could" follow an unconditional end of the bombing.'
    n: '[[w.nguyen-hanois-war]], 90. Check: the interview''s text and where it was printed. See [[cal.1967-01-04.vietnam]]; [[cal.1967-01.vietnam]]. Names: Nguyễn Duy Trinh, Burchett.'
    tags: [name:nguyen-duy-trinh, name:burchett-wilfred]
  - id: cal.1967-01-28.railroads
    when: Jan. 28
    date: '1967-01-28'
    thread: railroads
    c: 'Railroad shopcraft dispute. Executive Order 11324: an emergency board under the Railway Labor Act on the disputes of the carriers of the National Railway Labor Conference with the six shopcraft unions, the machinists, boilermakers, sheet metal workers, electrical workers, carmen and firemen and oilers; its report in 30 days, no change in conditions for 30 days after.'
    n: '[Executive Order 11324—Creating an Emergency Board to Investigate Disputes Between the Carriers Represented by the National Railway Labor Conference and Certain of Their Employees](https://www.presidency.ucsb.edu/documents/executive-order-11324-creating-emergency-board-investigate-disputes-between-the-carriers) (Jan. 28, 1967). To check: [[w.cullen-national-emergency-strikes]]; [[w.congress-and-the-nation-1969]]; [[w.califano-triumph-and-tragedy-of]]. See [[cal.1964-04-22.railroads]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-01-29.baker
    when: Jan. 29
    date: '1967-01-29'
    thread: baker
    c: 'Baker convicted in federal court in Washington on seven of nine counts: income tax evasion, larceny and interstate transportation of money obtained by fraud from savings and loan executives, and conspiracy to defraud the government. His defense: money taken to Senator Kerr, dead since 1963. Trial from Jan. 9. Check the day of the verdict.'
    n: '*Baker v. United States*, [401 F.2d 958](https://static.case.law/f2d/401/case-pdfs/0958-01.pdf) (D.C. Cir. 1968). To check: [[w.baker-wheeling-and-dealing]]. See [[cal.1964-09-10.baker]]. Names: Baker, Kerr.'
    tags: [name:baker-robert-g, name:kerr-robert-s]
  - id: cal.1967-01-29.opinion
    when: Jan. 29
    date: '1967-01-29'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Jan. 7–12: Democrats'' choice for 1968: Robert Kennedy 43 percent, Johnson 34, Humphrey 8, McNamara 7; no preference 8. Of the two, Kennedy 48, Johnson 39. Democrats 21 to 29, Kennedy 67, Johnson 26; 50 and over, Johnson 48, Kennedy 36.'
    n: '[[w.gallup-poll]], III, 2046–47. Names: Kennedy, Johnson, Humphrey, McNamara.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:humphrey-hubert-h, name:mcnamara-robert-s]
  - id: cal.1967-01-30.conservation
    when: Jan. 30
    date: '1967-01-30'
    thread: conservation
    c: 'Message on the natural heritage. An Air Quality Act: the Secretary of HEW to set nationwide emission levels for major industrial sources; Regional Air Quality Commissions for interstate "airsheds"; grants for State inspection of automobiles'' exhaust; research up 50 percent.'
    n: 'Special Message to the Congress: Protecting Our Natural Heritage, [1967 Pub. Papers 93](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=161) (Jan. 30, 1967). To check: [[w.jones-clean-air]]; [[w.dewey-dont-breathe-the-air]]. See [[cal.1967-01-10.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-01.crime-and-hijacking-fl
    when: Jan.
    date: 1967-01
    thread: crime-and-hijacking
    also: [states-and-cities]
    c: 'Florida. Kirk, sworn Jan. 3, the first Republican governor since Reconstruction, opens a "war on crime," hiring the Wackenhut Corporation, a private detective agency: a contract of $500,000 (Check). The ties cut in April (Check).'
    n: '[Wikipedia, "Wackenhut"](https://en.wikipedia.org/wiki/Wackenhut). Check: the contract and the legislature''s inquiry. To check: [[w.kallina-claude-kirk-and-the]]; [[w.colburn-floridas-gubernatorial-politics-in]]. See [[cal.1966-11-08.governors-fl]]. Names: Kirk.'
    tags: [state:fl, name:kirk-claude-r-jr]
  - id: cal.1967-01-31.opinion
    when: Jan. 31
    date: '1967-01-31'
    thread: opinion
    also: [assassination]
    c: 'Gallup, Jan. 7–12: the controversy between Jacqueline Kennedy and the author and publishers of *The Death of a President*: has hurt her image 44 percent, has helped 15, no opinion 41.'
    n: '[[w.gallup-poll]], III, 2047–48. Names: Jacqueline Kennedy, Manchester.'
    tags: [name:kennedy-jacqueline, name:manchester-william]
  - id: cal.1967-01.vietnam
    when: Jan.
    date: 1967-01
    thread: vietnam
    c: 'The Thirteenth Plenum. Resolution 13: the diplomatic struggle advanced beside the military; a "spontaneous uprising in order to win a decisive victory in the shortest possible time."'
    n: '[[w.nguyen-hanois-war]], 90. See [[cal.1965-12-27.vietnam-2]].'
