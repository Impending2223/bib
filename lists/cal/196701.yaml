  - id: cal.1967-01-08.vietnam
    when: Jan. 8
    date: '1967-01-08'
    place: iron-triangle
    thread: vietnam-operations
    c: 'Cedar Falls begins: some 30,000 American and South Vietnamese troops in the Iron Triangle, northwest of Saigon; the 1st and 25th Divisions, the 173rd Airborne and 196th Infantry Brigades, the 11th Armored Cavalry. Tunnels and stores destroyed. Bến Súc, some 3,500 people, moved out and razed; about 6,000 civilians taken from the area; the area made a free-fire zone.'
    n: '[[w.vietnam-victory-in-vietnam]], 196–97 (the operation, Jan. 8; over 30,000 troops); [[w.branch-at-canaans-edge]], 570 (B-52s, bulldozers and defoliants; four villages burned, forty square miles flattened; ten thousand people to camps; American casualties 1,194 for the week); [[w.cosmas-joint-chiefs-of-staff]], 32–33 (B-52 strikes from Jan. 4; after four days twenty-three battalions under II Field Force, the 1st and 25th Divisions and the 11th Armored Cavalry; the civilians removed and resettled); [[w.westmoreland-soldier-reports]], 205 (a corps-size sweep of the Iron Triangle in January, the 1st and 25th Divisions, the 173d Airborne Brigade and the 11th Armored Cavalry; the tunnels, command posts, mess halls, munitions factories and quarters destroyed; more than 500,000 documents taken, maps of Saigon with the American headquarters and billets marked among them); [[w.mann-grand-delusion]], 520 (Cedar Falls: thirty thousand American troops against a Viet Cong stronghold north of Saigon, the largest search-and-destroy operation yet, Jan. 9; not the units, the tunnels, Bến Súc or the civilians); [[w.lich-su-khang-chien-chong-my]], IV, 254–57 (Cedar Falls, the history''s account; see [[cal.1967-01-08.vietnam-hanoi]]). Check: *Victory in Vietnam* gives more than 3,000 American and South Vietnamese casualties (196). [[w.gibbons-u-s-government-and]], IV, 541–42 (the operation in the Iron Triangle; the tunnels and stores; Bến Súc razed, not its count; 5,987 evacuated; the free-fire zone; not the units). Check: Branch gives ten thousand inhabitants to be moved. Check: Mann, 520, has Cedar Falls launched Jan. 9, by thirty thousand American troops; the entry has Jan. 8, and some 30,000 American and South Vietnamese. To check: [[w.rogers-cedar-falls-junction-city]]; [[w.schell-village-of-ben-suc]]; "Allies Press Attack," [*New York Times*, Jan. 13, 1967](https://timesmachine.nytimes.com/timesmachine/1967/01/13/issue.html), at 6 (cited by [[w.branch-at-canaans-edge]], 570); Schell, *The Village ofBen Suc* (1967), passim (cited by [[w.branch-at-canaans-edge]], 570); [[w.karnow-vietnam]], 454, 477–78 (cited by [[w.branch-at-canaans-edge]], 570); [[w.appy-patriots]], 202–9 (cited by [[w.branch-at-canaans-edge]], 570); [*New York Times*, Jan. 20, 1967](https://timesmachine.nytimes.com/timesmachine/1967/01/20/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 570). Check: Gibbons has the operation launched Jan. 9 (IV, 541).'
