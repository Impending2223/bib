  - id: cal.1967-01-11.china-leadership-2
    when: Jan. 11
    date: '1967-01-11'
    place: peking
    thread: china-leadership
    c: 'Peking, Great Hall, Hebei Hall. A Politburo meeting, Zhou Enlai presiding. On the many posters against He Long: Mao has said only that He is to call on people and hear their criticism, not be named in public, nor seized by Red Guards. Xu Xiangqian, Ye Jianying and Zhu De urge the army''s stability. It names Xu head of the All-Army Cultural Revolution Group, Jiang Qing adviser, Xiao Hua and Yang Chengwu among deputies; it passes the message to Shanghai and the Center''s notice against economism (a handful on the capitalist road are inciting wage and welfare demands to turn the struggle aside) and three more papers.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 11, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 11, 1967; Zhou at the Politburo meeting: on the big-character posters on He Long, Mao says the Politburo and Standing Committee are not to name him in public but have him call to hear criticism; the Red Guards not to seize him; the meeting passes five papers, the Notice against economism and the congratulation to Shanghai''s rebel bodies among them); [[w.deng-xiaoping-nianpu-1904]], III, 1936 (Jan. 11, 1967; the Politburo meeting decides to cancel the right of Liu Shaoqi, Deng Xiaoping, Tao Zhu, Chen Yun and He Long to attend Politburo meetings; after that Deng is sometimes notified to read in Zhongnanhai the big-character posters put up by the ''rebels''); [[w.mao-zedong-zhuan]], VI, ch. 76 n.15 (Jan. 11 at the Politburo meeting, with Mao attending, Xu Xiangqian, Ye Jianying and Zhu De speak in turn, anxious over the state of the army, and urge that its stability be kept absolutely: the army not like a school, factory or village, ''big democracy'' would bring disorder and paralysis; the more disorder in the localities, the steadier the army must be, n.15). Made public: 2013. Check: Zhou''s chronology says Lin Biao presided, at Mao''s proposal; this entry has Zhou presiding. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 76), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Record of the Politburo meeting 中共中央政治局会议记录, Jan. 11, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.15). Names: Zhou Enlai, Mao Zedong, He Long, Xu Xiangqian, Ye Jianying, Zhu De, Jiang Qing.'
