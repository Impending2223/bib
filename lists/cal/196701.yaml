  - id: cal.1967-01-17.vietnam-congress
    when: Jan. 17
    date: '1967-01-17'
    place: washington
    thread: vietnam-congress
    also: [vietnam-sunflower]
    c: 'Before a White House dinner, Johnson, dressing in his bedroom, with Mansfield and Dirksen, Rostow and Watson present: "perhaps the most important communication" since he became President, a reply from Hanoi through a representative in a certain capital, under pledge of secrecy. He asks that the Foreign Relations Committee''s public hearings on Vietnam wait "two or three weeks." Dirksen and Mansfield: tell Fulbright and Hickenlooper himself. He reads them a draft resolution on Vietnam; Mansfield: "This is the worst thing you could do"; Dirksen agrees.'
    n: 'FRUS 1964–68, V, doc. [19](https://history.state.gov/historicaldocuments/frus1964-68v05/d19) (Rostow''s notes). [[w.gibbons-u-s-government-and]], IV, 505–06 (by Watson''s notes: 7:30 p.m.; Johnson "wishes we were not there but we are there"); [[w.gibbons-u-s-government-and]], IV, 464 ("doing better now than we have ever done in Vietnam if we just dont blow it"); [[w.barrett-uncertain-warriors]], 67 (early 1967; n.18 (221) gives "Meeting with the President in His Bedroom," Jan. 17, 1967, Rostow and Watson present: Johnson with Mansfield and Dirksen, showing a cable on possible peace feelers from North Vietnam: "They want secrecy ... I cannot tell Fulbright what is in this cable"); [[w.dallek-flawed-giant]], 445 (Johnson urges Mansfield and Dirksen to keep the Senate doves from undermining the prospects for talks: "We now have a feeler back that seems reliable"; South Vietnamese morale better; no day; not B to F); [[w.johnson-white-house-diary]], 474 (Johnson came in before the dinner "bringing Mike Mansfield and Senator Dirksen with whom he had been conferring"; not the Hanoi reply or the resolution). Made public: FRUS 1964–68, V (2002). Check: Rostow has the talk begin about 7:45 p.m. To check: Watson''s notes, President''s Appointment File, Diary Backup, Jan. 17, 1967, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 505 n.75). See [[cal.1967-01-10.vietnam-sunflower]]. Names: Johnson, Mansfield, Dirksen, Rostow, Watson, Fulbright, Hickenlooper.'
