  - id: cal.1967-01-08.china-leadership
    when: Jan. 8
    date: '1967-01-08'
    thread: china-leadership
    c: 'Mao calls Chen Boda, Kang Sheng, Jiang Qing, Wang Li, Guan Feng, Qi Benyu and others, on the seizure of the Shanghai *Wenhui bao* (Jan. 4) and *Jiefang ribao* (Jan. 5) by their rebels: the direction is good, a seizure of power by the left; "this is a national question; we back their rebellion"; one class overthrowing another. Revolution needs opinion first: reprint the Red Guard papers widely; "our papers are dead"; use left, middle and right and keep in touch with all.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 8, 1967. [[w.macfarquhar-maos-last-revolution]], 157, 161 (Mao on Jan. 8: "You don''t necessarily need ministries to make revolution"; at the beginning of January he predicts that Beijing, Shanghai, Tianjin and the large cities of the Northeast will be the major places of the class struggle); [[w.jianguo-yilai-mao-zedong]], XVIII, 419 (Jan. 8, 1967; the Wengao prints his words (a great revolution, one class overthrowing another; a great push to the movement in East China and every province) from the *Renmin ribao* editorial of Jan. 19, 1967, "Let Mao Zedong Thought occupy the newspaper front"); [[w.mao-zedong-zhuan]], VI, ch. 76 n.5 (Jan. 8 Mao on the takeover of the two Shanghai papers, n.5: ''this is a great revolution, one class overthrowing another'', whose effect on all East China and the provinces and cities will be very great; if the Shanghai revolutionary forces unite the whole country has hope; ''do not believe that without a butcher Zhang we must eat hairy pig''; ''to make a revolution one must first make opinion''; the Propaganda, Culture and Education ministries could not manage it, nor could we, ''once the Red Guards rose it was managed''; ''the seizure by the two papers is a national question, we support their rebellion''; ''grasp revolution, promote production, do not leave your posts to make revolution''; the main points printed in the editors'' note of the *Renmin ribao*, Jan. 9, to the Shanghai groups'' address to the people). [[w.yang-jisheng-tiandi-fanfu]], I, 349 (Mao calls Chen Boda, Kang Sheng, Jiang Qing, Wang Li 王力, Guan Feng 關鋒, Qi Benyu 戚本禹, Tang Pingzhu 唐平鑄 and Hu Chi 胡癡: on the two Shanghai papers, "a seizure of power by the left, the direction is good; the *Wenhui bao* rebelled on the 4th, the *Jiefang ribao* on the 6th; these are national questions, and we must back their rebellion; this is one class overthrowing another, a great revolution; the two papers will affect East China and the whole country; if the revolutionary forces in Shanghai rise, the whole country has hope"; and the Message to All Shanghai Citizens is a rare good article, on Shanghai and a national matter); [[w.yang-jisheng-tiandi-fanfu]], I, 353 (Mao, to the Group''s members: "do not believe that without Butcher Zhang we shall eat unshaved pork; if there are no rightists we shall turn the world over just the same" (Yan and Wang)). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). Check: the book gives the ministries remark as of Jan. 8 (157) and the prediction as "at the beginning of January 1967" (161), both from Mao Zedong sixiang wan sui, p. 282; whether one talk. Check: the book (164 n.47) dates the seizure of the Liberation Daily Jan. 6, with no issue that day; the entry has Jan. 5. To check: [[w.mao-zedong-sixiang-wan-n-d]], 282 (cited by [[w.macfarquhar-maos-last-revolution]], 157 n.14, 161 n.30a); Mao Zedong 毛泽东, talk (record 谈话记录), Jan. 8, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.5); Mao Zedong''s talk to the Cultural Revolution Group on the seizure of the *Wenhui bao* and *Jiefang ribao*, Jan. 8, 1967, in Song Yongyi 宋永毅 et al., *Zhongguo wenhua dageming wenku* 《中國文化大革命文庫》 (2006) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 349 n.42); Yan Changgui 閻長貴 and Wang Guangyu 王廣宇, *Wenshi qiuxin ji* 《問史求信集》 (Hongqi chubanshe 紅旗出版社, 2009), 95 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 353 n.48). Names: Mao Zedong, Chen Boda, Kang Sheng, Jiang Qing, Wang Li, Guan Feng, Qi Benyu.'
