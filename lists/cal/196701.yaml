    c: 'Peking, the Jingxi Hotel 京西賓館. The Military Commission''s Standing Committee meets again; the generals, knowing Mao backs Xiao Hua 蕭華, attack the Cultural Revolution Group. Huang Yongsheng 黃永勝, commander of the Canton Military Region: the Group, and Jiang Qing 江青 above all, should listen more to Chairman Mao. Jiang asks where Xiao hid the night before; Ye Jianying 葉劍英 rises: "if there is a crime of harboring, I bear it," warns that whoever throws the army into confusion will come to no good, and bangs the table, injuring his right hand: the "uproar at the Jingxi Hotel" 大鬧京西賓館.'
