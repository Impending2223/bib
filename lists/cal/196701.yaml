    c: 'Mao reads Lin Biao''s draft "Military Commission Order" of Jan. 25. Lin''s note: Xu Xiangqian said yesterday afternoon that many senior army cadres are seized at will, their homes searched, punished in disguise, offices half or wholly paralyzed; Nie Rongzhen, Ye Jianying and Yang Chengwu came after; they agreed in the Group''s meeting with Zhou and Chen Yi on seven articles. Mao: the seven very good, to be issued, with one more on cadres'' children.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 26, 1967. [[w.jianguo-yilai-mao-zedong]], XVIII, 440–444 (Jan. 26, 1967; Mao''s note of Jan. 26 on Lin''s report of Jan. 25, printed from the Central Archives'' typeset copy; his postscript also: on storming leading organs, past storming by counter-revolutionaries to be pursued, by the left not; from now the right''s to be resisted, the left''s welcomed; the paper to be discussed and revised before issue; those come to Peking to stay a week). Made public: 2013. To check: Lin Biao, report to Mao Zedong of Jan. 25, 1967 sending the draft Military Commission Order (seven articles, drawn up with Xu Xiangqian, Nie Rongzhen, Ye Jianying and Yang Chengwu, the Cultural Revolution Group and Zhou Enlai) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 441 n.1a). Names: Mao Zedong, Lin Biao, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Yang Chengwu, Zhou Enlai, Chen Yi.'
