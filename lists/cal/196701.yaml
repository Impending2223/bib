    tags: [province:pleiku]
  - id: cal.1967-01-01.elections-1968-nixon
    when: Jan. 1
    date: '1967-01-01'
    thread: elections-1968-nixon
    c: Nixon's law firm merges with Caldwell, Trimble & Mitchell, municipal bond lawyers. Nixon and John Mitchell; within a few months, by Nixon's account, he turns to Mitchell for counsel on politics.
    n: '[[w.nixon-rn]], 279. Names: Nixon, Mitchell.'
    src:
