  - id: cal.1967-01-28.china-leadership
    when: Jan. 28
    date: '1967-01-28'
    thread: china-leadership
    c: 'Mao, at the pool, calls Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying and others to revise the draft Military Commission Order. He then reads the revised text: "eight articles, very good, issue." He rewrites article five: for "the right''s storming to be resisted, the left''s to be welcomed" put "from now no storming at all." The eight: back the true proletarian left, hit the right, dictatorship over proven counter-revolutionaries; all stay at their posts; only argument inside the army, no arrest, search or seal without orders; and others.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 28, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 28, 1967; Zhou at Mao''s in the afternoon, then with Xu Xiangqian, Nie Rongzhen and Ye Jianying revising the "eight articles", striking the sentence "resist Right attack from now, welcome Left attack"; the Military Commission issues the eight orders the same day: firm support for the true proletarian revolutionaries, posts held, the two kinds of contradiction kept apart, no free arrest or house-search, no storming of military leading organs, no linking up, army-level organs to take the Cultural Revolution by stages); [[w.macfarquhar-maos-last-revolution]], 176–177 (Lin Biao''s draft of Jan. 25; Mao asks for changes and Zhou''s views; issued Jan. 28 with Mao''s endorsement; its first paragraph ends nonintervention); [[w.jianguo-yilai-mao-zedong]], XVIII, 440–444 (Jan. 28, 1967; Mao''s note "Eight articles, very good, issue," Jan. 28, printed from a Center document, and his article five, printed from the manuscript; issued that day, the "eight articles of the Military Commission"; note 2: the meeting the afternoon of Jan. 28, its place not given); [[w.mao-zedong-zhuan]], VI, ch. 76 n.23 (Mao gives the draft great weight and comments and revises it several times, Jan. 26 and 28, n.23: adds an article on the care of cadres'' children; rewrites the fifth article: for storming of military leading organs, if counter-revolutionaries stormed in the past it is to be investigated, if the left, it need not, ''from now on no storming at all''; issued Jan. 28 as the Military Commission''s Order, the ''eight articles'' of the Commission). [[w.yang-jisheng-tiandi-fanfu]], I, 394 (to steady the army after the masses it held down stormed it, the Military Commission issues its "eight orders" on Jan. 28: "resolutely oppose the right; take dictatorial measures against counter-revolutionary organizations and counter-revolutionaries on firm evidence"; the orders become the armies'' warrant for putting down the rebels); [[w.yang-jisheng-tiandi-fanfu]], I, 426 (Lin Biao takes Xu Xiangqian to Mao; Mao agrees to the seven articles and adds an eighth, "strengthen the education of children"; he writes "the eight articles as fixed, very good, issue"; Lin: "Chairman, with your signature, long live, long live!"; the order: "resolute dictatorial measures against counter-revolutionary organizations and counter-revolutionaries on firm evidence"; the army''s readiness and secrecy systems not to be stormed nor linked up with). Made public: 2013. Check: the book (176) has Mao calling for changes after Jan. 25; the entry has Mao rewriting article five on Jan. 28. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 76), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.lin-biao-1959-nian]], 171–187 (cited by [[w.macfarquhar-maos-last-revolution]], 176 n.35a); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 190–206 (cited by [[w.macfarquhar-maos-last-revolution]], 176 n.35b); Military Commission order of eight points, Jan. 28, 1967, in [[w.wenhua-dageming-yanjiu-ziliao]], I, 262 (cited by [[w.macfarquhar-maos-last-revolution]], 176 n.36); [[w.1966-1967-ccp-documents-of-the]], 258–259, 262 (cited by [[w.macfarquhar-maos-last-revolution]], 177 n.41a); [[w.domes-internal-politics-of-china]], 200–205 (cited by [[w.macfarquhar-maos-last-revolution]], 177 n.41b); The Military Commission Order of Jan. 28, 1967 (the eight articles) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 441 n.1b); Mao Zedong 毛泽东, comments on and revisions of the draft Military Commission order 《中央军委命令》 (manuscript 手稿), Jan. 26 and 28, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.23); *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd ed., 2011), 648 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 426 n.23). Names: Mao Zedong, Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
