    c: 'Zhou Enlai receives delegates of army academies, arts troupes, hospitals and military factories and explains the "eight orders": the army differs from civilian places and cannot take leave to make revolution as schools do; like factories and transport the army''s work cannot stop; the Cultural Revolution only in spare time; military organs and war-preparation systems not to be stormed; the army must keep firmly steady.'
