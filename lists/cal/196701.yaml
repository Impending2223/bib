  - id: cal.1967-01-22.china-leadership-6
    when: Jan. 22
    date: '1967-01-22'
    thread: china-leadership
    c: 'The Military Commission''s enlarged meeting, on Mao Zedong 毛澤東''s comment of the day before, passes the "Decision that the PLA firmly supports the revolutionary left" (Zhongfa [67] 27): the old orders against involvement void; troops to go when the true left asks; counter-revolutionaries against the left to be suppressed; no shelter for capitalist roaders; the whole army to be taught the two lines.'
