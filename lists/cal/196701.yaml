    c: 'Outer Space Treaty signed at Washington, London and Moscow, [18 U.S.T. 2410](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-18-3/lltreaties-18-3.pdf#page=94), [610 U.N.T.S. 205](https://treaties.un.org/doc/Publication/UNTS/Volume%20610/volume-610-I-8843-English.pdf). No nuclear weapons or other weapons of mass destruction in orbit, on the moon or other celestial bodies; no claims of sovereignty there; installations on celestial bodies open to the others. In the East Room, 5:15 p.m., Rusk, Dobrynin and Dean, the British ambassador; Goldberg. In Moscow, Kosygin to Thompson after the ceremony: the Americans "constantly escalating" in Vietnam.'
