    date: '1967-01-25'
    place: peking
    thread: china-leadership
    c: Zhou Enlai speaks at the Peking science and technology circles meeting "to smash the bourgeois reactionary lines new counter-attack". Seizing power must be serious, not left to drift, and anarchy is not allowed; see two sides of cadres who erred; "doubt everything, overthrow everything" is anarchism, not Mao Zedong Thought; revolutionary character must join scientific character; that one has made revolution is no license to do as one pleases.
