    c: Zhou Enlai confers with Tao Zhu on what the Politburo meeting is to settle. Meanwhile Chen Boda, Kang Sheng and Jiang Qing receive the "Corps to Canton to seize Wang Renzhong" of the Central-South Bureau and charge that Tao Zhu is "a faithful executor of the Liu–Deng bourgeois reactionary line", "China's biggest royalist" and "the backstage boss of the Central-South Bureau". Slogans "Down with Tao Zhu" and "Drag out Tao Zhu" appear everywhere.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967); [[w.macfarquhar-maos-last-revolution]], 187 (Chen Boda and Jiang Qing denounce Tao Zhu to the Central-South Red Guards as China''s biggest protector of the royalists; "Down with Tao Zhu" posters at once everywhere). Made public: 1991. Check: the book (187 n.26) has Kang Sheng present but no record of his denouncing Tao Zhu; the entry has him charge Tao with Chen Boda and Jiang Qing. By Wang Li''s account Jiang Qing organized the meeting (187 n.26). To check: [[w.li-xianchang-lishi]], 148 (cited by [[w.macfarquhar-maos-last-revolution]], 187 n.26a); [[w.chen-boda-zuihou-koushu]], 324–325 (cited by [[w.macfarquhar-maos-last-revolution]], 187 n.26b); [[w.zhou-enlai-nianpu-1949]], III, 107 (cited by [[w.macfarquhar-maos-last-revolution]], 187 n.27a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 283 (cited by [[w.macfarquhar-maos-last-revolution]], 187 n.27b). Names: Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Jiang Qing, Wang Renzhong.'
    tags: [name:zhou-enlai, name:tao-zhu, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
