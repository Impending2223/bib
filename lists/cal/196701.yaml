  - id: cal.1967-01-01.china-leadership
    when: Jan. 1
    date: '1967-01-01'
    thread: china-leadership
    c: 'The *Renmin ribao* and *Hongqi* New Year editorial, "Carry the Great Proletarian Cultural Revolution Through to the End": 1967 will be the year of all-round class struggle, a general attack by the proletariat and the revolutionary masses on the Party''s handful on the capitalist road and the "ghosts and monsters" in society. *Hongqi* prints Yao Wenyuan''s "On the Counter-Revolutionary Double-Dealer Zhou Yang," with a passage of Mao''s in bold type.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 1, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967; the *Renmin ribao*–*Hongqi* New Year editorial, "Carry the Great Proletarian Cultural Revolution Through to the End", reviewed by Mao: 1967 is to be the year of a general attack on the power-holders on the capitalist road); [[w.macfarquhar-maos-last-revolution]], 155 (the editorial drafted by Guan Feng and finalized by Mao; it predicts 1967 "a year of nationwide all-round class struggle"); [[w.mao-zedong-zhuan]], VI, ch. 76 nn.1, 2 (the joint editorial of the *Renmin ribao* and the *Hongqi*, the first joint editorial of the Center''s two chief organs, ''Carry the great proletarian cultural revolution through to the end'': 1967 the year of all-round class struggle, of a general attack by the proletariat and other revolutionary masses on the handful in the Party on the capitalist road and the ox-demons in society, of deeper criticism of the bourgeois reactionary line, of decisive victory for fight-criticize-reform; the new situation: workers and peasants have risen and founded their own revolutionary organizations; the cultural movements of modern China began with students and developed to workers'' and peasants'' movements, ''an objective law'', nn.1, 2). To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 176 (cited by [[w.macfarquhar-maos-last-revolution]], 155 n.2a); [[w.wenhua-dageming-yanjiu-ziliao]], I, 196–203 (cited by [[w.macfarquhar-maos-last-revolution]], 155 n.2b); Peking Review, no. 1 (Jan. 1, 1967), 8–15, "Carry the Great Proletarian Cultural Revolution Through to the End" (cited by [[w.macfarquhar-maos-last-revolution]], 155 n.2c); *Renmin ribao* 《人民日报》, Jan. 1, 1967 (the joint editorial of the *Renmin ribao* and the *Hongqi* 《红旗》, "Carry the great proletarian cultural revolution through to the end" 《把无产阶级文化大革命进行到底》) (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.1). Names: Yao Wenyuan, Zhou Yang, Mao Zedong.'
    src:
      c: a34e76c4
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Jan. 1, 1967: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 104: ?'
        - 'w.macfarquhar-maos-last-revolution 155: ?'
        - 'w.mao-zedong-zhuan VI, ch. 76 nn.1, 2: A'
        - 'via w.mao-zedong-zhuan VI, ch.76 n.1: A'
    tags: [name:yao-wenyuan, name:mao-zedong, polity:prc]
  - id: cal.1967-01-01.china-leadership-2
    when: Jan. 1
    date: '1967-01-01'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai telephones Chen Pixian in Shanghai before dawn: the Center has decided he is to come out and work; Shanghai must not fall into disorder, and the north–south railway must not be cut.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967); [[w.macfarquhar-maos-last-revolution]], 163–164 (a little past 3 a.m.; Chen Pixian recovering from surgery, Cao Diqiu in the front line; the nearly 20,000 Scarlet Guards at Kunshan, 26 passenger and 38 freight trains held up; act "in consultation with the organizations of the masses"); [[w.yang-jisheng-tiandi-fanfu]], I, 347 (at midnight of Dec. 31 Zhou telephones Chen Pixian 陳丕顯: end his convalescence, go to the front line, first arrest Wang Yuxi 王玉璽 and restore the Shanghai–Nanjing line as soon as possible; Chen has Wang detained as Zhou asks). Made public: 2020. To check: [[w.pixian-chen-pixian-huiyilu]], 116–119 (cited by [[w.macfarquhar-maos-last-revolution]], 163 n.43a); [[w.shanghai-wenhua-dageming-shihua]], I, 224–225 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.44a); [[w.zhou-enlai-nianpu-1949]], III, 106 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.44b); *Xu Jingxian de zuihou huiyi* 《徐景賢的最后回憶》 (Xingke''er chubanshe 星克爾出版(香港)有限公司, 2013), 104 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 347 n.37). Names: Zhou Enlai, Chen Pixian.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1967-01-01.china-leadership-3
    when: Jan. 1
    date: '1967-01-01'
    thread: china-leadership
    c: 'Zhou Enlai, on Beijing Iron and Steel Institute students hunger strike demanding Lü Dong be dismissed, tells Li Fuchun: persuade the students to stop; the dismissal cannot be forced on the Center; Lü Dong''s case is for the Center to examine and settle.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Lü Dong.'
    tags: [name:zhou-enlai, name:li-fuchun, polity:prc, vis:only:prc]
  - id: cal.1967-01-01.china-leadership-4
    when: Jan. 1
    date: '1967-01-01'
    place: peking
    thread: china-leadership
    also: [china]
    c: Rebels inside Zhongnanhai paste big slogans, "Down with China's Khrushchev, Liu Shaoqi," on the wall of the courtyard where Liu Shaoqi lives.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 653 (Jan. 1, 1967); [[w.macfarquhar-maos-last-revolution]], 147 (a handful of "rebels" employed in the leadership telephone exchange, calling themselves the "67.1.1 Combat Team," enter the courtyard where Liu lives and "decorate" it with huge slogans, among them "Down with China''s Khrushchev Liu Shaoqi!", one character of Liu''s name distorted and tilted to look like the character for "dog"). Made public: 1996. To check: [[w.lanxun-tie-shen-weishi-yi]], 16–18 (cited by [[w.macfarquhar-maos-last-revolution]], 147 n.51). Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
