    n: '[[w.macfarquhar-maos-last-revolution]], 163. Time: "at 1:00 a.m." (163). Made public: 1987. To check: [[w.shijin-jiangjun-juanjin-xuanwo]], 1–4, 12–14 (cited by [[w.macfarquhar-maos-last-revolution]], 163 n.42).'
