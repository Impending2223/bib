  - id: cal.1967-01-10.china-leadership-2
    when: Jan. 10
    date: '1967-01-10'
    thread: china-leadership
    c: 'Zhou Enlai receives the Railways Ministry liaison station and Peking''s train crews: revolution at home is the way to promote production, and going elsewhere only wrecks it. Over 10,000 left Daqing for Peking, and many wells have stopped; "losing production to run after revolution" is false revolution. The railways are to be mobilized from top to bottom to keep transport going; Lü Zhengcao is not to be dragged about but tested in work.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 10, 1967). Made public: 2020. Names: Zhou Enlai, Lü Zhengcao.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1967-01-10.china-leadership-3
    when: Jan. 10
    date: '1967-01-10'
    thread: china-leadership
    c: 'Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, meets delegates of the Peking "Third Headquarters", the Peking Aeronautics Institute "Red Flag" and other mass organizations: "because of rebelling they do no work; what rebellion is that? I cannot find the man running the railways and must have Li Xiannian grasp it, or do it myself." Since the end of last year he has meant to bring the railway systems delegates into one general liaison station, and it has not been done; Lü Zhengcao is to do it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Li Xiannian, Lü Zhengcao.'
    tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, name:li-xiannian, polity:prc, vis:only:prc]
