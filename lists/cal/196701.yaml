    c: 'Zhou Enlai, on the attack of rebels on troops the Heilongjiang Military District sent to Yichun to take over public security, posts and forestry, writes the General Staff: two regiments are to go, with Red Guards to do propaganda; reactionary ringleaders, once exposed or isolated, are to be arrested; if they fire on arrest or hit the PLA, fire back where necessary; ordinarily fire into the air, warn and order arms handed in.'
