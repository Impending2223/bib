# Cal. LXXXVII January 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXVII
entries:
  - id: cal.1967-01-01.opinion
    when: Jan. 1
    date: '1967-01-01'
    thread: opinion
    also: [state-and-city-finance]
    c: 'Gallup, Dec. 8–13, 1966: a share of the federal income tax returned to the States and localities to spend as they see fit: favor 70 percent, oppose 18. The biggest threat to the country in the future: big government 49, big labor 21, big business 14. Spends the taxpayer''s dollar more wisely: the State government 49, the Federal Government 18, neither 17.'
    n: '[[w.gallup-poll]], III, 2043.'
  - id: cal.1967-01-01.goldwater
    when: Jan. 1
    date: '1967-01-01'
    thread: goldwater
    also: [vietnam-air-war]
    c: 'Goldwater: "Why the hell we don''t hit Haiphong, I don''t know. So long as your enemy continues to get supplies, he will fight. . . . Hanoi gets the bulk of its supplies from Russia through the port of Haiphong. Therefore we ought to put it out of business."'
    n: '[[w.goldberg-barry-goldwater]], 244; the *Arizona Republic*, Jan. 1, 1967, by the note (244 n.19). Check: the day of the words. See [[cal.1965-11-15.goldwater]]. Names: Goldwater.'
    src:
      c: fe91c053
      rows:
        - 'w.goldberg-barry-goldwater 244: all'
        - 'via w.goldberg-barry-goldwater 244 n.19: all'
    tags: [name:goldwater-barry-m]
  - id: cal.1967-01-01.vietnam-operations
    when: Jan. 1
    date: '1967-01-01'
    thread: vietnam-operations
    c: The 4th Infantry Division begins Sam Houston, border surveillance and search and destroy in western Pleiku. The 1st and 10th North Vietnamese Divisions, some 9,300, in Cambodia near the Pleiku–Kontum border.
    n: '[[w.macv-command-history-1967]], 375.'
    src:
      c: 009bc780
      rows:
        - 'w.macv-command-history-1967 375: all'
    tags: [province:pleiku]
  - id: cal.1967-01-02.states-and-cities
    when: Jan. 2
    date: '1967-01-02'
    thread: states-and-cities
    also: [elections-1966]
    c: Sacramento. Reagan sworn as governor of California in the Capitol just after midnight, Finch as lieutenant governor (Check the hour).
    n: 'Reagan, "First Inaugural Address as Governor of California: Midnight Ceremony," [APP](https://www.presidency.ucsb.edu/documents/first-inaugural-address-governor-california-midnight-ceremony) (Jan. 2, 1967; its title and date, for the ceremony at midnight; the text not read). To check: [[w.cannon-governor-reagan]]; [[w.dallek-right-moment]]. See [[cal.1966-11-08.elections-1966]]. Names: Reagan, Finch.'
    src:
      c: 841b7808
      rows:
        - 'https://www.presidency.ucsb.edu/documents/first-inaugural-address-governor-california-midnight-ceremony: A-B'
    tags: [name:reagan-ronald, name:finch-robert-h]
    short: Reagan sworn
  - id: cal.1967-01-02.vietnam
    when: Jan. 2
    date: '1967-01-02'
    thread: vietnam
    also: [vietnam-order-of-battle]
    c: 'Westmoreland''s year-end assessment of the enemy situation and strategy, to Sharp and Wheeler, MACJ00 00160: the enemy''s strength up some 42,000 in 1966, a "proportional counter-buildup" to the growth of the American and allied forces; its sources conscription in the South and infiltration through the DMZ, "but principally through Laos and the Cambodian extension"; infiltration about 8,400 men a month, recruiting about 3,500. The enemy''s strength 300,575.'
    n: '[FRUS 1964–68, V, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v05/d2). [[w.berman-lyndon-johnsons-war]], 22. Names: Westmoreland, Sharp, Wheeler.'
    src:
      c: 80afcef0
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d2: A-C'
        - 'w.berman-lyndon-johnsons-war 22: all'
        - 'via x.1967-01-02.westmoreland-year-end-assessment-macj00-00160: all'
    tags: [name:westmoreland-william, name:sharp-u-s-grant, name:wheeler-earle]
  - id: cal.1967-01-02.vietnam-air-war
    when: Jan. 2–7
    date: '1967-01-02'
    thread: vietnam-air-war
    c: 'Honolulu. Sharp''s working conference on the air war outside South Vietnam: Hanoi to be convinced a long war is intolerable; the war goods the enemy needs in the South to be destroyed at storage and distribution points in the North.'
    n: '[[w.macv-command-history-1967]], 425 (the week of Jan. 2). Names: Sharp. Check: the place.'
    src:
      c: ebc50777
      rows:
        - 'w.macv-command-history-1967 425: all'
    tags: [name:sharp-u-s-grant]
  - id: cal.1967-01-02.vietnam-air-war-2
    when: Jan. 2
    date: '1967-01-02'
    thread: vietnam-air-war
    c: Air Force F-4C Phantoms down seven MiG-21s, the biggest air battle of the war; MiG kills 34 in all. The New Year's stand-down ends at 7 a.m., 111 violations recorded, 24 significant.
    n: '[[w.macv-command-history-1967]], 1255.'
    src:
      c: 1169d585
      rows:
        - 'w.macv-command-history-1967 1255: all'
  - id: cal.1967-01-03.congress
    when: Jan. 3
    date: '1967-01-03'
    thread: congress-powell
    c: 'Powell. The Special Subcommittee on Contracts of the House Administration Committee, Hays its chairman, reports on the Education and Labor Committee''s spending: Powell and some of the committee''s staff deceived the House on travel; strong evidence of salary paid his wife unlawfully, at his direction (Check the date). No action in the 89th Congress, which ends at noon.'
    n: 'H.R. Rep. No. 2349, 89th Cong., 2d Sess., 6–7 (1966), as given in *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 489–90 (1969) (K–J Cong. II.J.1). To check: [[w.hamilton-adam-clayton-powell-jr]]; [[w.powell-adam-by-adam]]. See [[cal.1966-01-10.congress]]. Names: Powell, Hays.'
    tags: [name:powell-adam-clayton-jr, name:hays-wayne-l]
  - id: cal.1967-01-03.assassination
    when: Jan. 3
    date: '1967-01-03'
    thread: assassination
    c: Ruby dies at Parkland Hospital, Dallas, of a pulmonary embolism; cancer found in December. The Texas Court of Criminal Appeals had reversed his conviction Oct. 5, 1966, and ordered a new trial outside Dallas.
    n: '*Rubenstein v. State*, [407 S.W.2d 793](https://static.case.law/sw2d/407/case-pdfs/0793-01.pdf) (Tex. Crim. App. 1966). To check: [[w.wills-jack-ruby]]; [[w.kaplan-trial-of-jack-ruby]]. See [[cal.1964-03-14.assassination]]. Names: Ruby.'
    tags: [name:ruby-jack]
  - id: cal.1967-01-03.conservative-movement
    when: Jan. 3
    date: '1967-01-03'
    thread: conservative-movement
    also: [elections-1968]
    c: 'Rusher to *National Review*''s editors, by memorandum, on Romney: qualities "which make him an unlikely Liberal hero in the long run: an idiosyncratic stubbornness, a noisy religiosity, and a businessman''s contempt for politics and politicians."'
    n: '[[w.kabaservice-rule-and-ruin]], 209. To check: William A. Rusher to the editors of *National Review*, Jan. 3, 1967, William F. Buckley Jr. Papers, Yale University, I-43 (cited by [[w.kabaservice-rule-and-ruin]], 209 n.70). Names: Rusher, Romney.'
    src:
      c: 1bf9dc01
      rows:
        - 'w.kabaservice-rule-and-ruin 209: all'
        - 'via w.kabaservice-rule-and-ruin 209 n.70: all'
    tags: [name:rusher-william-a, name:romney-george-w]
  - id: cal.1967-01-03.vietnam-order-of-battle
    when: Jan. 3
    date: '1967-01-03'
    thread: vietnam-order-of-battle
    c: 'Rostow to Johnson: "I do not for one minute believe the infiltration rate is 8400 per month"; a MACV "balancing figure" for "an inflated order of battle," MACV "excessively conservative" as insurance and against pressure to put more forces into pacification.'
    n: '[[w.berman-lyndon-johnsons-war]], 22. To check: Rostow to Johnson, Jan. 3, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 22). See [[cal.1967-01-02.vietnam]]. Names: Rostow, Johnson.'
    src:
      c: cc150804
      rows:
        - 'w.berman-lyndon-johnsons-war 22: all'
        - 'via x.1967-01-03.rostow-to-johnson-infiltration-rate: all'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1967-01-03.vietnam-2
    when: Jan. 3
    date: '1967-01-03'
    thread: vietnam
    c: 'Sharp to Westmoreland and Wheeler on MACV''s operational concept for 1967: adequate to the threat, but not "too great a measure of our effort to anti-infiltration"; a barrier "virtually impossible" with the ground forces at hand or planned; air and naval interdiction to go on and, if possible, grow. "We must be prepared to accept heavier casualties in our initial operations."'
    n: '[[w.berman-lyndon-johnsons-war]], 22–23. To check: Sharp to Westmoreland and Wheeler, "Operational concept for Vietnam," Jan. 3, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 23 n.14). See [[cal.1967-01-02.vietnam]]. Names: Sharp, Westmoreland, Wheeler.'
    src:
      c: 288005f1
      rows:
        - 'w.berman-lyndon-johnsons-war 22–23: all'
        - 'via x.1967-01-03.sharp-to-westmoreland-and-wheeler-operational-concept: all'
    tags: [name:sharp-u-s-grant, name:westmoreland-william, name:wheeler-earle]
  - id: cal.1967-01-03.japan-and-korea-korean-troops
    when: Jan. 3
    date: '1967-01-03'
    thread: japan-and-korea-korean-troops
    also: [vietnam-operations]
    c: The Korean Capital Division begins Maeng Ho 8, extending its area south along Highways 1 and 6B between Qui Nhơn and Sông Cầu; the 95th North Vietnamese Regiment avoids contact. By February's end 202 of the enemy killed, two Koreans.
    n: '[[w.macv-command-history-1967]], 379.'
    src:
      c: 6c50cb4b
      rows:
        - 'w.macv-command-history-1967 379: all'
    tags: [place:qui-nhon, province:binh-dinh, province:phu-yen]
  - id: cal.1967-01-03.vietnam
    when: Jan. 3
    date: '1967-01-03'
    thread: vietnam
    c: Westmoreland and the chief of the Joint General Staff agree on American advisers to the army's inspector general and its subordinate commands, MACV's inspector general the senior adviser.
    n: '[[w.macv-command-history-1967]], 244. Names: Westmoreland.'
    src:
      c: bacdbb1a
      rows:
        - 'w.macv-command-history-1967 244: all'
    tags: [name:westmoreland-william]
  - id: cal.1967-01-03.robert-kennedy
    when: Jan. 3
    date: '1967-01-03'
    thread: robert-kennedy
    also: [press-and-broadcasting]
    c: 'Mankiewicz to Robert Kennedy, on the invitation to give the Gridiron Club''s speech: "Ted Sorensen says it is a gamble — it can be a great coup or very dismal. ... Considering the news of the past month or so, I would gamble."'
    n: '[[w.shesol-mutual-contempt]], 396. To check: Mankiewicz to Robert Kennedy, Jan. 3, 1967, Mankiewicz Papers, box 42, JFK Library (cited by [[w.shesol-mutual-contempt]], 396). Names: Mankiewicz, Robert Kennedy, Sorensen.'
    src:
      c: '28612275'
      rows:
        - 'w.shesol-mutual-contempt 396: all'
        - 'via x.1967-01-03.mankiewicz-to-rfk-gridiron: all'
    tags: [name:mankiewicz-frank, name:kennedy-robert-f, name:sorensen-theodore-c]
  - id: cal.1967-01-03.conservation
    when: Jan. 3
    date: '1967-01-03'
    thread: conservation
    c: 'Udall to Schultze of the Budget Bureau: the Land and Water Conservation Fund''s shortfall for the next decade may be $2.5 billion, the Golden Eagle Passport bringing $3.8 million in 1967 of $50 million hoped for, land prices up 10 percent a year.'
    n: '[[w.bernstein-guns-or-butter]], 273. To check: Udall to Schultze, Jan. 3, 1967, Legislative Background, Land and Water Conservation Fund, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 273 n.3). Check: the year of the Golden Eagle''s figure. See [[cal.1964-09-03.conservation]]. Names: Udall, Schultze.'
    src:
      c: 403f74b4
      rows:
        - 'w.bernstein-guns-or-butter 273: all'
        - 'via x.1967-01-03.udall-to-schultze: A'
    tags: [name:udall-stewart-l, name:schultze-charles-l]
  - id: cal.1967-01-04.defense
    when: Jan. 4
    date: '1967-01-04'
    thread: defense-abm
    c: 'ABM. Johnson with McNamara, Vance, the Joint Chiefs, Humphrey and the past and present science advisers, Killian, Kistiakowsky, Wiesner, York and Hornig. McNamara: nothing; a "thin" system against Chinese missiles, accidental launches and for the Minuteman; or a defense of the cities against a heavy Soviet attack. Wheeler for the Chiefs: Nike-X for 25 cities. Killian, Kistiakowsky, Wiesner and Hornig against a defense of the cities; Killian and Hornig would take the thin system if it must come.'
    n: 'FRUS 1964–68, X, docs. [166](https://history.state.gov/historicaldocuments/frus1964-68v10/d166), [167](https://history.state.gov/historicaldocuments/frus1964-68v10/d167). [[w.drea-mcnamara-clifford-and-the-2011]], 363–364 (the meeting; Wheeler for a defense of 25 cities; the scientists against it). To check: [[w.seaborg-stemming-the-tide]]; memorandum for the record, Assistant Commandant of the Marine Corps, meeting of the Joint Chiefs with the President on Jan. 4, 1967, Jan. 10, 1967, Greene Papers, Marine Corps History Center (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 363 n.63). See [[cal.1966-12-06.defense]]. Made public: FRUS 1964–68, X (2002). Names: McNamara, Vance, Wheeler, Humphrey, Killian, Kistiakowsky, Wiesner, York, Hornig, Johnson. Check: Drea has all five scientists against a heavy deployment, four against any, Hornig alone for the thin system (363); FRUS''s record has Killian take the thin system "if politics required the first step" and Hornig a limited system if it helped negotiations (doc. 166).'
    src:
      c: 20e1a2b2
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v10/d166: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 363: A-B, F-G'
        - 'via w.drea-mcnamara-clifford-and-the-2011 363 n.63b: A-B, F-G'
        - 'via w.drea-mcnamara-clifford-and-the-2011 363 n.63c: A-B, F-G'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:vance-cyrus, name:wheeler-earle, name:humphrey-hubert-h, name:killian-james-r-jr, name:kistiakowsky-george-b, name:wiesner-jerome-b, name:york-herbert-f, name:hornig-donald-f]
  - id: cal.1967-01-04.vietnam
    when: Jan. 4
    date: '1967-01-04'
    thread: vietnam-sunflower
    also: [soviet-union]
    c: 'Rusk to Dobrynin, two and a half hours: a revision of the fourteen points; what would Moscow do if the bombing stopped.'
    n: 'FRUS 1964–68, V, doc. [7](https://history.state.gov/historicaldocuments/frus1964-68v05/d7). Made public: [[w.herring-secret-diplomacy-of-the]] (1983); FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 504–21 (the Moscow channel, Jan. 10–Feb. 15; not this talk); [[w.herring-lbj-and-vietnam]], 107–11 (Sunflower: the Moscow channel, the letter to Hồ, Wilson and Kosygin; not this talk). To check: [[w.kraslow-secret-search-for-peace]]; [[w.cooper-lost-crusade]]. See [[cal.1966-12-23.vietnam]]. Names: Rusk, Dobrynin.'
    src:
      c: 3b17a1b1
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d7: all'
    tags: [name:rusk-dean, name:dobrynin-anatoly]
  - id: cal.1967-01-04.opinion
    when: Jan. 4
    date: '1967-01-04'
    thread: opinion
    c: 'Gallup, Dec. 8–13, 1966: the man most admired, in order of mention: Johnson, Eisenhower, Robert Kennedy, Billy Graham, Pope Paul VI, U Thant, Dirksen, Romney, Nixon, Reagan.'
    n: '[[w.gallup-poll]], III, 2043. Names: Johnson, Eisenhower, Kennedy, Graham, Paul VI, U Thant, Dirksen, Romney, Nixon, Reagan.'
    tags: [name:johnson-lyndon-b, name:eisenhower-dwight-d, name:kennedy-robert-f, name:graham-billy, name:paul-vi, name:u-thant, name:dirksen-everett, name:romney-george-w, name:nixon-richard-m, name:reagan-ronald]
  - id: cal.1967-01-04.vietnam-prisoners
    when: Jan. 4
    date: '1967-01-04'
    thread: vietnam-prisoners
    c: The Viet Cong release two American civilians and a Filipino; Washington directs three Viet Cong prisoners taken by Americans released in return, arranged with Saigon by the embassy and MACV.
    n: '[[w.macv-command-history-1967]], 984.'
    src:
      c: 3a28076d
      rows:
        - 'w.macv-command-history-1967 984: all'
  - id: cal.1967-01-05.africa
    when: Jan. 5
    date: '1967-01-05'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'Rhodesia. Executive Order 11322, under the United Nations Participation Act, carrying out Resolution 232: imports of Rhodesia''s asbestos, iron ore, chrome, pig iron, sugar, tobacco, copper, meat, hides and leather exported after Dec. 16 forbidden; and the supply to it of arms, aircraft, motor vehicles and oil. Enforcement to State, Commerce and the Treasury. Feb. 27, reported to Congress.'
    n: '[Executive Order 11322—Relating to Trade and Other Transactions Involving Southern Rhodesia](https://www.presidency.ucsb.edu/documents/executive-order-11322-relating-trade-and-other-transactions-involving-southern-rhodesia) (Jan. 5, 1967); Letter to the President of the Senate and to the Speaker of the House on Executive Order 11322, [1967 Pub. Papers 242](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=310) (Feb. 27, 1967). To check: [[w.deroche-black-white-and-chrome]]. See [[cal.1966-12-02.europe-and-the-alliance]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-01-05.governors-ca
    when: Jan. 5
    date: '1967-01-05'
    thread: governors
    also: [state-and-city-finance]
    c: Sacramento. Reagan's inaugural address on the Capitol steps. The year's budget $4.6 billion, "an all-time high among the 50 states," with an estimated deficit of $63 million; next year's could reach three-quarters of a billion. "We are going to squeeze and cut and trim until we reduce the cost of government." Property tax relief promised. The "Creative Society."
    n: '[First Inaugural Address as Governor of California](https://www.presidency.ucsb.edu/documents/first-inaugural-address-governor-california) (Jan. 5, 1967); also [Reagan Library](https://www.reaganlibrary.gov/archives/speech/january-5-1967-inaugural-address-public-ceremony). To check: [[w.cannon-governor-reagan]]; [[w.dallek-right-moment]]; [[w.groot-selling-ronald-reagan]]. See [[cal.1967-01-02.states-and-cities]]. Names: Reagan.'
    tags: [state:ca, name:reagan-ronald]
    short: Reagan's inaugural
  - id: cal.1967-01-05.vietnam-saigon
    when: Jan. 5
    date: '1967-01-05'
    thread: vietnam-saigon
    c: 'After Westmoreland''s counsel, South Vietnam''s Ministry of Defense issues "Military Support of Revolutionary Development": army units in support of it under the division commander or the sector chief, a tactical area of responsibility for each.'
    n: '[[w.macv-command-history-1967]], 578. Names: Westmoreland.'
    src:
      c: 52e790af
      rows:
        - 'w.macv-command-history-1967 578: all'
    tags: [name:westmoreland-william]
  - id: cal.1967-01-06.vietnam-congress
    when: Jan. 6
    date: '1967-01-06'
    thread: vietnam-congress
    c: 'Johnson with Mansfield on what Hanoi may have signaled through Salisbury. Mansfield''s memorandum the same day: Hanoi is saying it will not say "Uncle"; it will talk, but not until the American withdrawal is assured; "what do you Americans expect to result from negotiations?" Talks unlikely at the present level of fighting.'
    n: '[[w.gibbons-u-s-government-and]], IV, 503 n.71. [[w.mann-grand-delusion]], 519. To check: Mansfield to Johnson, memorandum, Jan. 6, 1967, NSF Name File, Mansfield, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 503 n.71); Mansfield to Johnson, Jan. 6, 1967, XXII, 103, Mansfield Papers (cited by [[w.mann-grand-delusion]], 519 n.3). See [[cal.1966-12-25.vietnam]]. Names: Johnson, Mansfield, Salisbury.'
    src:
      c: 6d9382bd
      rows:
        - 'w.gibbons-u-s-government-and IV, 503: all'
        - 'via w.gibbons-u-s-government-and IV, 503 n.71a: B-E'
        - 'w.mann-grand-delusion 519: A-B, E'
        - 'via w.mann-grand-delusion 519 n.3: B, E'
    tags: [name:johnson-lyndon-b, name:mansfield-mike, name:salisbury-harrison-e]
  - id: cal.1967-01-06.intelligence
    when: Jan. 6
    date: '1967-01-06'
    thread: intelligence
    c: 'Hoover to Tolson and DeLoach: "requests are still being made by Bureau officials for the use of ''black bag'' techniques"; any surreptitious entry "will not meet with my approval in the future."'
    n: '[[w.branch-at-canaans-edge]], 565. To check: Hoover to Tolson and DeLoach, Jan. 6, 1967, Section 36, FHOC (cited by [[w.branch-at-canaans-edge]], 565). See [[cal.1966-07-19.intelligence]]. Names: Hoover, Tolson, DeLoach.'
