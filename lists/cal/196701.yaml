    date: '1967-01-24'
    thread: economy
    also: [vietnam, defense-abm]
    c: 'Budget for fiscal 1968: administrative expenditures $135.0 billion, revenues $126.9 billion, deficit $8.1 billion; on the national income accounts, $169.2 billion and a deficit of $2.1 billion. Defense $75.5 billion, 56 percent; Southeast Asia $19.9 billion this year, $22.4 billion next. A supplemental of $12.3 billion asked for the war this fiscal year. The surcharge from July 1, the lowest brackets exempt. The ABM: Nike-X developed, not deployed; talks with the Soviets; about $375 million for production if they fail.'
    n: 'Annual Budget Message to the Congress, Fiscal Year 1968, [1967 Pub. Papers 39](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=107) (Jan. 24, 1967); Letter to the Speaker of the House Requesting Supplemental Appropriations in Support of Military Operations in Southeast Asia, [1967 Pub. Papers 61](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=129) (Jan. 24, 1967) (the supplemental). FRUS 1964–68, V, doc. [26](https://history.state.gov/historicaldocuments/frus1964-68v05/d26) (the supplemental). See [[cal.1967-01-10.economy]]; [[cal.1967-01-04.defense]]. Names: Johnson.'
