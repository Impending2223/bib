  - id: cal.1967-01-22.china-leadership
    when: Jan. 22
    date: '1967-01-22'
    place: peking
    thread: china-leadership
    c: 'Noon, Great Hall. Mao receives the senior generals at the enlarged meeting of the Military Commission''s liaison group: back the rebels, though few; declare yourselves. The "not intervening" line was false. Do the right masses'' work, save many cadres. He disapproves the "jet plane" treatment, hours of denunciation, of Liao Hansheng, Liu Zhijian and Su Zhenhua; do not go too far; no forced confessions; random arrests, of provincial secretaries and army cadres, will not do; everyone errs, "I too." Zhang Tixue and Jiang Weiqing, after errors, should be given time to mend.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 22, 1967. [[w.mao-zedong-zhuan]], VI, ch. 76 n.19 (Jan. 22 Mao''s talk with the senior officers at the enlarged meeting of the Military Commission''s liaison group, n.19: many resentful of the rebels'' storming of army organs; Xu Shiyou: why should old cadres of decades be dunce-capped; Li Tianhuan: we cannot work now; Mao: support the rebels, though few; our basic line, the side of the revolutionary left, ''not intervening was false''; against ''jet plane'' treatment, hours long, of Liao Hansheng, Liu Zhijian and Su Zhenhua, ''not civilized''; do not go too far, it loses hearts; ''who does not err, I err too''; give Zhang Tixue and Jiang Weiqing time to mend; as at Yan''an, ''punish the past to guard the future, cure the sick to save the patient''; we cannot pour cold water on the masses but must persuade). [[w.yang-jisheng-tiandi-fanfu]], I, 388 (to calm the army, Mao receives the generals: the army to stand with the left, but he hears them out on their persecution and backs the marshals'' view of steadying the army). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: Mao Zedong 毛泽东, talk with the senior officers of the enlarged meeting of the Military Commission''s liaison group 军委碰头会扩大会议 (record 谈话记录), Jan. 22, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.19); [[w.wenqian-wannian-zhou-enlai]], 26th printing (2004), 194–197 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 388 n.5a); *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2008), 651–654 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 388 n.5b). Names: Mao Zedong, Liao Hansheng, Liu Zhijian, Su Zhenhua, Zhang Tixue, Jiang Weiqing.'
