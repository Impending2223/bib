  - id: cal.1967-01-16.china-leadership
    when: Jan. 16
    date: '1967-01-16'
    thread: china-leadership
    c: 'Mao presides over an enlarged Standing Committee meeting. Some of our cadres have changed in a dozen years. The left''s seizures of power are good, the right''s not. The left grows quickly: Shanghai''s left workers were a thousand and more in early Nov., a million by early Jan.; let the masses choose new cadres, factory heads and secretaries. Takeover means looking after politics and watching, not business; the army takes radio stations only where the left is not in strength. Not the army alone wins the land now; workers and peasants do, the army helps.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 16, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967; Zhou at the Center''s liaison meeting where Mao says it is good that Left masses rise to seize power: take over, run affairs only, not the work); [[w.macfarquhar-maos-last-revolution]], 166 (Mao formally approves the seizure of power from the Shanghai Party Committee and the municipal people''s government); [[w.mao-zedong-zhuan]], VI, ch. 76 n.9 (Jan. 16 Mao at the enlarged Standing Committee meeting, n.9: some of our cadres have turned in a dozen years; the left''s seizing power is good, the right''s not; the left grows fast, Shanghai''s left workers early last Nov. a thousand and more, a million early this Jan., with the students the main force; ''before, the army won the realm, now workers and peasants win it themselves, the army helps''; let the masses elect new cadres, factory heads and secretaries, ''takeover, only politics, not the work, the same men do it and we supervise'', which the book says was mostly not done). Made public: 2013. Check: the book (166) dates Mao''s formal approval of the Shanghai seizure Jan. 16, citing Wang Nianyi (1988), 178; whether it was given at this meeting; if so, Made public: 1988. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 76), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.nianyi-da-dongluande-niandai]], 178 (cited by [[w.macfarquhar-maos-last-revolution]], 166 n.61); Mao Zedong 毛泽东, speech at the enlarged meeting of the Politburo Standing Committee 中共中央政治局常委扩大会议 (record 讲话记录), Jan. 16, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.9). Names: Mao Zedong.'
