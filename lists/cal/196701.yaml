  - id: cal.1967.china-leadership-121
    when: 1967, fall
    date: '1967'
    at: before 1967-09-23
    thread: china-leadership
    also: [china]
    c: 'At Mao''s and Zhou Enlai''s orders the Central Case Examination Group is split in two: a First Office, tied to the General Office under Wang Dongxing, for the early cases (Peng Zhen, An Ziwen, Liu Ren, Zhou Yang); a Second Office, tied to the Military Commission and headed by Yang Chengwu, for a dozen or so cases of senior officers, He Long''s among them.'
