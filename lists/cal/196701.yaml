  - id: cal.1967-01-01.china-leadership-8
    when: Jan. 1
    date: '1967-01-01'
    place: kunshan
    thread: china-leadership
    also: [china]
    c: Close to 20,000 Scarlet Guards are in Kunshan county, Jiangsu, a few miles outside Shanghai, on their way to Peking to petition the central authorities. They hold up twenty-six passenger and thirty-eight freight trains and disrupt traffic on the north–south trunk line.
    n: '[[w.macfarquhar-maos-last-revolution]], 163–164. To check: [[w.shanghai-wenhua-dageming-shihua]], I, 224–225 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.44a); [[w.zhou-enlai-nianpu-1949]], III, 106 (cited by [[w.macfarquhar-maos-last-revolution]], 164 n.44b). See [[cal.1967-01-01.china-leadership-2]].'
    src:
      c: b6d561a0
      rows:
