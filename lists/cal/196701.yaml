    tags: [name:hoover-j-edgar, name:tolson-clyde-a, name:deloach-cartha]
  - id: cal.1967-01-06.vietnam-air-war
    when: Jan. 6
    date: '1967-01-06'
    thread: vietnam-air-war
    c: 'Sharp to Westmoreland: more B-52s to deploy to Guam Jan. 10–20; from the 725 sorties authorized for January, the B-52 rate to rise to 800 a month in February and stay there. The Joint Chiefs: bombs enough on Guam for the year''s requirement, and 250 sorties more.'
    n: '[[w.macv-command-history-1967]], 404 (the 800 a month set as early as June 16, 1966). To check: CINCPAC to COMUSMACV, 061925Z Jan 67, "ARC LIGHT"; JCS to CINCPAC, 172007Z Jan 67; SAC to CINCPAC, 162200Z Jan 67, "Use of ARC LIGHT Forces" (cited by [[w.macv-command-history-1967]], 404 n.112). Names: Sharp, Westmoreland.'
    src:
      c: 1a8268f2
      rows:
        - 'w.macv-command-history-1967 404: all'
        - 'via w.macv-command-history-1967 404 n.112: all'
    tags: [name:sharp-u-s-grant, name:westmoreland-william]
  - id: cal.1967-01-06.vietnam-saigon
    when: Jan. 6
    date: '1967-01-06'
    thread: vietnam-saigon
    c: Saigon orders a Popular Forces pay increase from Jan. 1, basic pay from 1,820 piasters to 2,200 in the lowlands and 2,400 in the highlands.
    n: '[[w.macv-command-history-1967]], 215.'
    src:
      c: 26ab7c79
      rows:
        - 'w.macv-command-history-1967 215: all'
  - id: cal.1967-01-06.vietnam-operations
    when: Jan. 6
    date: '1967-01-06'
    thread: vietnam-operations
    c: The first American assault in the Mekong Delta, the Seventh Fleet's Special Landing Force ashore in Kiến Hòa in Deckhouse V. Thailand announces that more than 1,000 volunteers will soon go to Vietnam.
    n: '[[w.macv-command-history-1967]], 1256. See [[cal.1967-01.vietnam-operations]].'
    src:
      c: '22407171'
      rows:
        - 'w.macv-command-history-1967 1256: all'
    tags: [province:kien-hoa]
  - id: cal.1967-01-07.elections-1968
    when: Jan. 7–8
    date: '1967-01-07'
