  - id: cal.1967-01-10.program
    when: Jan. 10
    date: '1967-01-10'
    thread: program
    also: [vietnam]
    c: 'State of the Union, to a joint session, 9:33 p.m. "A time of testing." Asked: social security up 20 percent on the average, the minimum from $44 to $70; age discrimination in employment barred; Head Start for children of three; clean air by "regional airsheds"; fair housing; jury discrimination ended; the draft reformed; wiretapping outlawed but for national security; truth in lending; election reform; a Safe Streets and Crime Control Act, firearms controlled; an East-West trade bill and the consular convention. A 6 percent surcharge on income taxes. Deficit $9.7 billion in fiscal 1967, $8.1 billion in 1968. The Soviets'' antimissile defense near Moscow. Vietnam: "We face more cost, more loss, and more agony"; "We will stand firm."'
    n: 'Annual Message to the Congress on the State of the Union, [1967 Pub. Papers 2](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=70) (Jan. 10, 1967). FRUS 1964–68, V, doc. [11](https://history.state.gov/historicaldocuments/frus1964-68v05/d11) (editorial note: the surcharge; Vietnam). [[w.dallek-flawed-giant]], 449–50 (the address on Vietnam); [[w.califano-triumph-and-tragedy-of]], 182–83 (the date chosen for Dirksen''s birthday and the television schedule; no applause for the surcharge; Robert Kennedy''s arms folded at the wiretapping passage; "We face more cost, more loss, and more agony"); [[w.zelizer-fierce-urgency-of-now]], 271 (the 6 percent surcharge to be asked: "slightly more than one-fourth of that tax cut"); [[w.berman-lyndon-johnsons-war]], 26–27 (Westmoreland''s view that the enemy could no longer succeed on the battlefield; "more cost, more loss, and more agony"; the surcharge, 6 percent); [[w.bernstein-guns-or-butter]], 367 (the surcharge, "to last for 2 years or for so long as the unusual expenditures associated with our efforts in Vietnam continue"); [[w.thomas-robert-kennedy]], 330 (all wiretapping and bugging to be banned but to protect national security; in the chamber Kennedy does not applaud, arms crossed). See [[cal.1966-01-12.program]]. Names: Johnson.'
