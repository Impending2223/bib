  - id: cal.1967-01.vietnam-hanoi
    when: Jan.
    date: 1967-01
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'Lê Duẩn''s letter to the Saigon–Gia Định Zone Committee: at a given stage the revolutionary war, military and political, will grow into a general offensive and general uprising to beat the enemy''s military and political force in all the areas he holds, the main direction the cities, and take power whole for the people. In the war''s last stage, hard military and political blows in the cities, against one of the enemy''s props, will decide the defeat of the American policy of aggression.'
    n: '[[w.lich-su-khang-chien-chong-my]], V, 32–33 (quoting Lê Duẩn, [[w.duan-thu-vao-nam]], 163–64). Made public: 1985 ([[w.duan-thu-vao-nam]]). To check: [[w.duan-thu-vao-nam]], 163–64 (cited by [[w.lich-su-khang-chien-chong-my]], V, 32 n.1, 33 n.1). Names: Lê Duẩn. Check: the day; the history gives the month. The letter is the history''s source for the idea of the 1968 plan.'
    tags: [polity:drv, vis:only:drv, name:le-duan, ok:fields-place]
  - id: cal.1967.china-leadership-124
    when: '1967'
    date: '1967'
    thread: china-leadership
    c: 'After the United Action Committee''s arrests some of its members go to Tianjin 天津. Zhou Enlai 周恩來 sends a reporter of the Cultural Revolution Group''s station to Xie Xuegong 解學恭, head of the preparatory group of the Tianjin revolutionary committee 天津革委會籌備組, with an eleven-character instruction given by word of mouth only: "watch the United Action''s movements and take measures."'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 285. Made public: 2016. To check: Zhang Chunting 張春亭, 〈我擔任「中央文革記者站」記者的難忘往事〉, in *Feimingdi: Zhongyang wenge jizhezhan jizhe jianwen lu* 《飛鳴鏑——中央文革記者站記者見聞錄》 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 285 n.82). Names: Zhou Enlai.'
    src:
      c: ded7afb9
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 285: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 285 n.82: all'
    tags: [polity:prc, vis:only:prc, name:zhou-enlai, ok:fields-place, ok:fields-at]
  - id: cal.1967-01-31.china-leadership-9
    when: Jan. 31
    date: '1967-01-31'
    place: peking
    thread: china-leadership
    c: 'The *Renmin ribao* 人民日報, Peking, early reprints the *Hongqi* 紅旗 editorial for Feb. 3, "On the Proletarian Revolutionaries'' Struggle to Seize Power" 〈論無產階級革命派的奪權鬥爭〉, which Mao revised in person: the old state machine cannot be taken over ready-made but "must be smashed completely," and new forms of the dictatorship of the proletariat created.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 357. Made public: 1998 (Mao''s revision). To check: *Jianguo yilai Mao Zedong wengao* 《建國以來毛澤東文稿》, vol. 12 (Zhongyang wenxian chubanshe, 1998), 210 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 357 n.54). See [[cal.1967-01-30.china-leadership-2]]. Names: Mao Zedong.'
    src:
      c: 94c7cdca
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 357: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 357 n.54: all'
    tags: [polity:prc, name:mao-zedong]
  - id: cal.1967-01.vietnam-hanoi-2
    when: Jan.
    date: 1967-01
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Cần Đước. In a fight against a sweep a district unit loses a squad, all its weapons and its dead. The history says doubt and reluctance to fight the Americans spread among the belt's forces; the units argue the fight over and conclude that, with the two lines far apart and the fight slow, the Americans massed fire; the answer is to fight close and fast. Battalion 2 of Long An takes up the method.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 328. Check: the day; the page runs on to Battalion 2''s success, with no day.'
    tags: [polity:drv, polity:us]
  - id: cal.1967-01.vietnam-hanoi-3
    when: Jan.–Feb.
    date: 1967-01
    place: ninh-thuan
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Ninh Thuận. In January and February the province's forces raid Ninh Chữ port and Thành Sơn airfield and hurt an American military police company at Phan Rang.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 318. Check: the days; the history gives the two months.'
    tags: [polity:drv, polity:us]
  - id: cal.1967-01-31.vietnam-diplomacy
    when: Jan. 31
    date: '1967-01-31'
    time: 1967-01-31T10:00Z
    thread: vietnam-diplomacy
    c: 'Ceaușescu receives Davis, the U.S. ambassador, who asked to see him after the talk on the train. Davis: the U.S. is in Vietnam under a treaty obligation, seeks talks without conditions and does not wish to stay. Ceaușescu: the bombing of the DRV is the bar to talks, the Front must be recognized, and Romania wants better relations with the U.S. but ''platonic love'' does not last.'
    n: '"[Transcript of the Discussions on the Occasion of the Reception by Comrade Nicolae Ceausescu of United States Ambassador in Bucharest, Richard H. Davis](https://digitalarchive.umd.edu/document/122593)" (Feb. 1, 1967), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 2/1967, f. 1–20, trans. Larry L. Watts, Wilson Center Digital Archive. The discussions began at 1200 hours, January 31; the Archive''s heading is Feb. 1, 1967. See [[cal.1967-01-22.vietnam-diplomacy]]. Names: Ceaușescu. Check: the place; the transcript names none. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:us, name:ceausescu-nicolae, vis:only:romania+us]
    time_zone: Europe/Bucharest
