    c: 'Cedar Falls begins: some 30,000 American and South Vietnamese troops in the Iron Triangle, northwest of Saigon; the 1st and 25th Divisions, the 173rd Airborne and 196th Infantry Brigades, the 11th Armored Cavalry. Tunnels and stores destroyed. Bến Súc, some 3,500 people, moved out and razed; about 6,000 civilians taken from the area; the area made a free-fire zone.'
    n: '[[w.vietnam-victory-in-vietnam]], 196–97 (the operation, Jan. 8; over 30,000 troops); [[w.branch-at-canaans-edge]], 570 (B-52s, bulldozers and defoliants; four villages burned, forty square miles flattened; ten thousand people to camps; American casualties 1,194 for the week). Check: *Victory in Vietnam* gives more than 3,000 American and South Vietnamese casualties (196). [[w.gibbons-u-s-government-and]], IV, 541–42 (the operation in the Iron Triangle; the tunnels and stores; Bến Súc razed, not its count; 5,987 evacuated; the free-fire zone; not the units). Check: Branch gives ten thousand inhabitants to be moved. To check: [[w.rogers-cedar-falls-junction-city]]; [[w.schell-village-of-ben-suc]]; "Allies Press Attack," NYT, Jan. 13, 1967, p. 6 (cited by [[w.branch-at-canaans-edge]], 570); Schell, *The Village ofBen Suc* (1967), passim (cited by [[w.branch-at-canaans-edge]], 570); [[w.karnow-vietnam]], 454, 477–78 (cited by [[w.branch-at-canaans-edge]], 570); [[w.appy-patriots]], 202–9 (cited by [[w.branch-at-canaans-edge]], 570); New York Times, Jan. 20, 1967, p. 1 (cited by [[w.branch-at-canaans-edge]], 570). Check: Gibbons has the operation launched Jan. 9 (IV, 541).'
