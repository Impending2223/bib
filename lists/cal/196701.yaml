    c: 'State to Moscow, 7:30 p.m., telegram 120335, drafted by William Bundy, held for an execute order: Guthrie to tell the North Vietnamese chargé that a "completely secure arrangement" means talks disclosed to no other government or party but by mutual agreement; and to give seven possible subjects of talks, among them the reduction or cessation of hostilities, the withdrawal of forces from outside South Vietnam, reunification, and free political participation in the South.'
    n: '[FRUS 1964–68, V, doc. 18](https://history.state.gov/historicaldocuments/frus1964-68v05/d18). [[w.gibbons-u-s-government-and]], IV, 504–05; [[w.mann-grand-delusion]], 522 (State''s answer to Hanoi''s two questions, undated: a list of possible subjects, "reduction or cessation of hostilities" and "recognition of the independence and territorial integrity of North and South Vietnam, or all of Vietnam if the people should choose reunification" among them; not the day, the hour, the telegram, William Bundy, the meaning of "completely secure" or the seven subjects). Made public: FRUS 1964–68, V (2002). Order: the answer to Moscow 3066, the day''s report (doc. 18, its reference). To check: [[w.herring-secret-diplomacy-of-the]], 417 (cited by [[w.gibbons-u-s-government-and]], IV, 505 n.74). See [[cal.1967-01-10.vietnam-sunflower]]. Names: William Bundy, Guthrie.'
