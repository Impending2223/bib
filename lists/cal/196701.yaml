    place: peking
    thread: china-leadership
    c: Zhou Enlai tells the meeting of mass delegates from other places in Peking that in takeovers there must be a great alliance, against dispersion, each one for himself and anarchism; seizing power is no self-seeking scramble of individuals or small groups; some units, the army and war-preparation offices among them, cannot take the form of mass seizure.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 22, 1967); [[w.yang-jisheng-tiandi-fanfu]], I, 351 (at the wired-broadcast meeting of out-of-town masses in Peking, 800,000 in all, main hall the Great Hall of the People, Zhou says Mao decided in person to broadcast the Message and the Urgent Notice, announcing a new stage of the cultural revolution, whose chief fighting task is for the proletarian revolutionaries to unite and seize from the handful of capitalist-roaders in the Party the Party, government and financial power; only the seizure by the revolutionary masses can destroy the bourgeois reactionary line and beat back its new counterattack and put down economism). To check: Zhou Enlai''s speech of Jan. 22, 1967, printed by the Central Committee General Office''s secretariat, Jan. 24, 1967, and the Tsinghua "Suoyaofeng" combat group''s shorthand copy (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 351 n.44) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 351 n.44). Names: Zhou Enlai.'
