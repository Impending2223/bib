  - id: cal.1967-01-12.china-leadership
    when: Jan. 12
    date: '1967-01-12'
    thread: china-leadership
    c: 'Mao reads three drafts of the Cultural Revolution Group: a Center notice that the point of struggle is not to be turned on the army; a Center and State Council set of rules on public-security work in the Cultural Revolution; a Military Commission notice that the army may not be an air-raid shelter. "Agreed. To Zhou: important, so the Politburo should pass them." The first says that no person or body may storm the PLA''s organs; the second gives six rules, among them lawful punishment of counter-revolutionaries.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 12, 1967. [[w.jianguo-yilai-mao-zedong]], XVIII, 424–426 (Jan. 12, 1967; Mao''s notes "Agreed" and, to Zhou Enlai, 5 p.m. Jan. 12, on the report of Chen Boda and Jiang Qing to Lin Biao; printed from the manuscripts; note 1: the army notice issued Jan. 14, the public-security rules Jan. 13, the Military Commission notice dated Jan. 7; note 3: the Politburo passed the three Jan. 13); [[w.mao-zedong-zhuan]], VI, ch. 76 n.17 (Jan. 12 Mao approves the Center''s Notice that the spearhead of the struggle must not be pointed at the army; it provides that from now no person or body may storm the organs of the PLA, and that the local radio stations, prisons, depots, ports and bridges may rightly be guarded by the army, no one to incite the masses to surround, storm, occupy or wreck them; issued Jan. 14, n.17). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: Central Committee, Notice that the spearhead of the struggle must not be pointed at the army 《中共中央关于不得把斗争锋芒指向军队的通知》, Jan. 14, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.17). Names: Mao Zedong, Zhou Enlai.'
    src:
