  - id: cal.1967-01-10.china-leadership
    when: Jan. 10
    date: '1967-01-10'
    thread: china-leadership
    c: 'Mao reads two Xinhua pieces from Jiang Qing (on the Shanghai rebels'' attack on the bourgeois reactionary line, and the Shanghai Workers'' General Headquarters'' urgent notice to the two papers, Jan. 9, which freezes funds and bars higher wages and calls the Shanghai committee''s economism its new form): to Chen Boda and the Group: both very good; within two or three days to draft, for the Center, the State Council and the Military Commission, a cable congratulating Shanghai''s rebel bodies, calling their line and acts right and the whole country to learn from Shanghai, and to pass it at a larger meeting.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 10, 1967. [[w.macfarquhar-maos-last-revolution]], 165 (after reading the Jan. 9 notice, Mao tells the Group members that the Shanghai rebels'' policies and actions are correct and that the whole country should learn from Shanghai''s experience); [[w.jianguo-yilai-mao-zedong]], XVIII, 420–421 (Jan. 10, 1967; Mao''s letter to Chen Boda and the Group, 5 a.m. Jan. 10, printed from the manuscript; the postscript: the document against economism not to be issued, the Shanghai notice good enough, but an explanatory article needed; the two Xinhua pieces printed in *Renmin ribao* Jan. 12); [[w.mao-zedong-zhuan]], VI, ch. 76 n.6 (Jan. 10 Jiang Qing sends Mao two Xinhua dispatches, the Shanghai rebels'' ''general attack on the bourgeois reactionary line'' and the Urgent Notice of the Workers'' General Headquarters and others in the *Wenhui bao* and *Jiefang ribao*; the first gives four signs of the very good situation at Shanghai; Mao the same day passes both to Chen Boda and the Cultural Revolution Group: both very good; in two or three days draft for the Center, the State Council and the Military Commission a telegram of congratulation to the Shanghai rebel bodies, saying their line and acts are right and calling on the Party, government, army and people to learn from Shanghai''s experience, n.6). [[w.yang-jisheng-tiandi-fanfu]], I, 350 (Mao instructs the Cultural Revolution Group to draft for the Center, the State Council and the Military Commission a telegram of congratulation to Shanghai''s revolutionary rebel bodies, saying that their policy and action are correct and calling on the whole country''s Party, government, army and people to learn from Shanghai''s experience and act as one). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: Urgent Notice of the Shanghai Workers'' General Headquarters and thirty-one other rebel organizations, Jan. 9, 1967, in [[w.quarterly-chronicle-and-documentation]], 203–204 (cited by [[w.macfarquhar-maos-last-revolution]], 165 n.57); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 186–187 (cited by [[w.macfarquhar-maos-last-revolution]], 165 n.58a); Xinhua, two dispatches on the Shanghai rebels'' general attack on the bourgeois reactionary line and the Shanghai Workers'' General Headquarters'' urgent notice, sent to Mao by Jiang Qing Jan. 10, 1967 (printed in Renmin ribao, Jan. 12) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 421 n.2); Mao Zedong 毛泽东, comment on the two Xinhua dispatches on the Shanghai rebels 《上海革命造反派向资产阶级反动路线发起总攻击》 and the Urgent Notice of the Shanghai Workers'' Revolutionary Rebel General Headquarters in the *Wenhui bao* and *Jiefang ribao* (manuscript 手稿), Jan. 10, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.6); Xi Xuan 席宣 and Jin Chunming 金春明, *"Wenhua dageming" jianshi* 《「文化大革命」簡史》, enlarged ed. (2011), 122 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 350 n.43). Names: Mao Zedong, Jiang Qing.'
