  - id: cal.1967-01-04.china-leadership
    when: Jan. 4
    date: '1967-01-04'
    thread: china-leadership
    c: 'Mao, at the pool, calls Zhou Enlai and others and asks him about Jiang Qing''s charge that Tao Zhu "suppressed the masses." Zhou reports Tao''s reception on Dec. 30, 1966 of the "Group to Seize Wang Renzhong in Guangzhou" and says it was no suppression. Mao: do not bring Wang Renzhong to Peking; let him make his self-criticism at Wuhan.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 4, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967; Zhou at Mao''s: asked about Jiang Qing''s charge that Tao "suppressed the masses", he reports how Tao received the Canton corps on Dec. 30, 1966: not suppression); [[w.macfarquhar-maos-last-revolution]], 187 ("Later the same day": Zhou Enlai, asked by Mao, denies that Tao Zhu suppressed the masses who came to drag out Wang Renzhong; Tao may have a problem of attitude). Made public: 1990. To check: [[w.zhou-enlai-nianpu-1949]], III, 110 (cited by [[w.macfarquhar-maos-last-revolution]], 187 n.29a); [[w.biji-tao-zhu]], 580–582 (cited by [[w.macfarquhar-maos-last-revolution]], 187 n.29b). Names: Mao Zedong, Zhou Enlai, Jiang Qing, Tao Zhu, Wang Renzhong.'
    tags: [name:mao-zedong, name:zhou-enlai, name:jiang-qing, name:tao-zhu, polity:prc, vis:only:prc]
  - id: cal.1967-01-04.china-leadership-2
