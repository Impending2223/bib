    c: Zhou Enlai, before dawn, told that rebels are storming the gates of Zhongnanhai to seize Liu Shaoqi, Deng Xiaoping, Tao Zhu and other Center leaders, calls them to the Great Hall of the People and urges them not to. The Party Center does not agree; those they want to seize, Tan Zhenlin, Chen Yi, Li Fuchun, Li Xiannian, Yu Qiuli, are on the first line of Party and government, by Mao's side doing real work, and the day's great matters need them.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107–108 (Jan. 8, 1967); [[w.macfarquhar-maos-last-revolution]], 184–185 (Zhou Enlai tells the Zhongnanhai rebels the Center will not let them drag out Tan Zhenlin, Chen Yi, Li Fuchun and Li Xiannian); [[w.macfarquhar-maos-last-revolution]], 187 (by Jan. 8 the Zhongnanhai rebels demand the right to seize Tao Zhu with Liu Shaoqi and Deng Xiaoping). Made public: 1990. To check: [[w.zhou-enlai-nianpu-1949]], III, 110 (cited by [[w.macfarquhar-maos-last-revolution]], 185 n.7); [[w.biji-tao-zhu]], 580–582 (cited by [[w.macfarquhar-maos-last-revolution]], 187 n.29b). Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Tao Zhu, Tan Zhenlin, Chen Yi, Li Fuchun, Li Xiannian, Yu Qiuli.'
