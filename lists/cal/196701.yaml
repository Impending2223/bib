  - id: cal.1967-01-21.china-leadership
    when: Jan. 21
    date: '1967-01-21'
    thread: china-leadership
    c: 'Mao reads the Nanjing Military Region committee''s telegram to the Military Commission on the Peking Third Headquarters'' Anhui liaison station and others calling a mass meeting in Hefei and asking the Anhui military district for troops to guard it: to Lin Biao, the army to back the left masses, and do so whenever a true revolutionary body asks; "not intervening" is false, it has long intervened; a new order to be issued and the earlier ones voided.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 21, 1967. [[w.macfarquhar-maos-last-revolution]], 175 (the Hefei report through the Anhui Military District, Nanjing Military Region, Military Commission and Lin Biao; Mao''s handwritten note to Lin: the military to support "the broad masses of the left"); [[w.jianguo-yilai-mao-zedong]], XVIII, 433–434 (Jan. 21, 1967; Mao''s note to Lin Biao, Jan. 21, and postscript, printed from the manuscript; the Anhui district was asked for 300 to 500 men to guard a rally of 150,000 to 200,000 at Hefei, Jan. 22–23; note 2: the new order is the decision of Jan. 23); [[w.mao-zedong-zhuan]], VI, ch. 76 n.18 (Jan. 21 the Nanjing Military Region committee sends an urgent request: the Capital Third Headquarters'' Anhui liaison station and others will hold a meeting of 150,000 to 200,000 at Hefei on the 22nd and 23rd to denounce the main leaders of the Anhui committee, and ask the provincial military district for 300 to 500 troops to guard order, ''if not sent, that is not supporting the cultural revolution''; Mao that day: troops should be sent to support the broad left masses; whenever real revolutionaries ask the army''s support it should be so; ''not intervening'' is false, they have long intervened; the order should be reissued and the old order voided, n.18). [[w.yang-jisheng-tiandi-fanfu]], I, 431 (the Anhui rebels, seizing the power of Li Baohua, call a rally of 10,000 and ask the army to guard it; on the Nanjing Military Region''s request Mao writes on Jan. 21: "Comrade Lin Biao, the PLA should support the broad masses of the left ... the so-called non-involvement is false; it has long been involved; a new order should be issued, the earlier ones void"); [[w.yang-jisheng-tiandi-fanfu]], I, 431 (Mao: "Comrade Lin Biao, the PLA should support the broad masses of the left ... ''non-involvement'' is false; it has long been involved"). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: [[w.nianyi-da-dongluande-niandai]], 194 (cited by [[w.macfarquhar-maos-last-revolution]], 175 n.30a); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 197–199 (cited by [[w.macfarquhar-maos-last-revolution]], 175 n.30b); [[w.wuchanjieji-wenhua-dageming-wenjian-1967]], 93–94 (cited by [[w.macfarquhar-maos-last-revolution]], 175 n.31); Nanjing Military Region Party committee, telegram to Lin Biao and the Military Commission of Jan. 21, 1967 asking whether to send troops to support the rebels in Anhui (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 433 n.1); Mao Zedong 毛泽东, comment on the urgent request of the Party committee of the Nanjing Military Region 南京军区党委 (manuscript 手稿), Jan. 21, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.18). Names: Mao Zedong, Lin Biao.'
