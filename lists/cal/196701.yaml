    c: 'Mao reads Liu Shaoqi''s letter of Jan. 5: Red Guards at the Peking Institute of Civil Engineering want him to make a public self-criticism. Mao to the Premier: deal with it; better he not speak; work on the students. Next morning Zhou receives the students'' delegates and stops them forcing Liu to the institute.'
