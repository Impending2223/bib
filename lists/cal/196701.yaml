  - id: cal.1967-01-17.china-leadership
    when: Jan. 17
    date: '1967-01-17'
    place: peking
    thread: china-leadership
    c: 'Great Hall, room 118. Mao receives the delegation of a foreign Communist party. There is a party within our party, harmony on the surface, fierce struggle beneath; he doubted some of those "serving the people"; without the Cultural Revolution nothing could be done. Shanghai''s workers took over factories, offices and schools; Lenin: train cadres in the revolution. Left and right both use his banner as "defenders." Of titles, "great commander, helmsman, teacher, leader," "I want none." On choosing Central Committee members for the Ninth Congress: Liu and Deng, he thinks, should be elected.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 17, 1967. [[w.deng-xiaoping-nianpu-1904]], III, 1936 (Jan. 17, 1967; Mao, in talk with foreign guests: will Liu and Deng be elected to the Central Committee at the next Party Congress? My view is still that they should be); [[w.mao-zedong-zhuan]], VI, ch. 76 n.10 (Mao''s talk, Jan. 17, with the head of a foreign party, n.10: ''in our party there is a party, you did not know before; on the surface one family, in fact bitter struggle''; ''without this cultural revolution we had no means; in Peking nobody obeyed me, the *Renmin ribao* did not''; ''the radio stations and the conservatives are strong, so power must be seized''; he doubts whether some were serving the people or the bourgeoisie; Shanghai''s workers have risen, they took over factories, offices and schools; Lenin: train cadres in the revolution, ''revolution brings out cadres''; place and the party not given). [[w.mao-zedong-zhuan]], VI, ch. 77 nn.41, 44 (Jan. 17, four days after Mao''s meeting with Liu in the text, nn.41 and 44 give the record of his talk with a foreign party''s delegation: of Wang Ming 王明, he is still a Central Committee member and will probably not be elected at the next congress; Liu and Deng, he thinks, should be; the struggle with Liu began in the summer of 1964 and the Twenty-three Articles of 1965 were its result; place, hour and the delegation not given). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: Mao Zedong 毛泽东, talk with the head of a foreign party (record 谈话记录), Jan. 17, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.10). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping. Check: the party and its delegation; the nianpu does not name them.'
