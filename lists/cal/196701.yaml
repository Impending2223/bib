  - id: cal.1967-01-25.china-leadership
    when: Jan. 25
    date: '1967-01-25'
    thread: china-leadership
    c: 'Zhou Enlai receives the finance-and-trade rebels: seize only the leadership of the Cultural Revolution and supervise business; do not cast aside all with "head" in their titles; keep some for work to go smoothly; seizing ministers at will without notice is not what is urged. Mu Xin is not to be set down as a counter-revolutionary revisionist; no material shows Ye Jizhuang tied to the "black gang".'
