  - id: cal.1967-01-23.china-leadership
    when: Jan. 23
    date: '1967-01-23'
    thread: china-leadership
    c: 'Mao reads the draft decision of the Center, State Council, Military Commission and Cultural Revolution Group that the PLA firmly supports the revolutionary left (Wang Li''s), sent by Zhou Enlai and others: "issue." It says the PLA must stand on the proletarian revolutionaries'' side; the earlier instructions not to intervene are void. Issued that day.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 23, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 21, 23, 1967; Mao to Lin Biao that troops must back the broad Left masses, the earlier "no involvement" being false; the Center, State Council, Military Commission and Cultural Revolution Group issue on the 23rd the decision that the PLA firmly support the revolutionary Left); [[w.macfarquhar-maos-last-revolution]], 175 (two days after Mao''s note the Center issues Zhongfa [1967] 27: when genuine proletarian Leftists ask the army for help, it should send troops to support them actively); [[w.jianguo-yilai-mao-zedong]], XVIII, 435 (Jan. 23, 1967; Mao''s note "Issue as is" on the decision Zhou and others sent Jan. 21; five points; printed from the manuscript; the drafter not named); [[w.mao-zedong-zhuan]], VI, ch. 76 n.20 (Jan. 23 the Center, State Council, Military Commission and Cultural Revolution Group issue, Mao having marked it ''issue as it stands'', the Decision that the PLA firmly supports the revolutionary left masses; Mao later: ''then Party and government were failing, only the army could come forward and carry the task'', n.20). [[w.yang-jisheng-tiandi-fanfu]], I, 431–432 (Lin Biao acts at once, and the next day the Military Commission''s enlarged meeting adopts the "Decision on the PLA resolutely supporting the revolutionary left masses," Zhongfa [67] 27 中發〔67〕27號: the orders on non-involvement void; troops to go to the true left when it asks; counter-revolutionaries against the left suppressed; no shelter for capitalist-roaders; the army educated in Mao''s line; relayed to every soldier); [[w.yang-jisheng-tiandi-fanfu]], II, 1145; [[w.yang-jisheng-tiandi-fanfu]], I, 432 (its five points). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 76), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Zhongfa [1967] 27, the Center''s decision that the army should actively support genuine proletarian Leftists who ask it for help, Jan. 23, 1967, in [[w.schoenhals-chinas-cultural-revolution-1966]], 52–53 (cited by [[w.macfarquhar-maos-last-revolution]], 175 n.32). Names: Mao Zedong, Zhou Enlai, Wang Li.'
