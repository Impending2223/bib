    place: peking
    thread: china-leadership
    c: In the first half of the year, as State Council ministers were seized for struggle, Zhou Enlai, Li Fuchun and Li Xiannian in turn took them to live in Zhongnanhai for protection, for days, weeks, or a year or more. Over forty were sheltered, among them Yu Qiuli, Gu Mu, Wang Zhen, Liao Chengzhi, Fang Yi, Yao Yilin, Zhou Rongxin, Lü Dong, Liu Lanbo, Qian Xinzhong and Zhang Jingwu.
