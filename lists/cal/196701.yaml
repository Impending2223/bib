    c: 'The Military Commission reorganizes the All-Army Cultural Revolution Group, to work under the Commission and the Center Cultural Revolution Group: head Xu Xiangqian; adviser Jiang Qing; deputies Xiao Hua, Yang Chengwu, Wang Xinting, Xu Liqing, Guan Feng, Xie Tangzhong, Li Manchun.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 11, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 11, 1967; the Military Commission''s notice reorganizing the All-Army Cultural Revolution Group: Xu Xiangqian head, Jiang Qing adviser, Xiao Hua, Yang Chengwu and others deputies); [[w.macfarquhar-maos-last-revolution]], 183 (the PLA Cultural Revolution Group is completely reorganized on Jan. 11, under the nominal leadership of Xu Xiangqian but dominated by its "adviser" Jiang Qing, who installs Guan Feng as a deputy head); [[w.yang-jisheng-tiandi-fanfu]], I, 422 (after Liu Zhijian''s fall Lin Biao announces at a meeting: Xu Xiangqian head of the All-Army Group, Jiang Qing adviser, the Air Force commissar Yu Lijin 余立金 and the Navy''s deputy commissar Wang Hongkun 王宏坤 among the deputies). Made public: 2013. Check: the deputies: Yang (I, 422) names Yu Lijin and Wang Hongkun among them. To check: [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 284 (cited by [[w.macfarquhar-maos-last-revolution]], 183 n.77a). Names: Xu Xiangqian, Jiang Qing, Xiao Hua, Yang Chengwu, Wang Xinting, Xu Liqing, Guan Feng, Xie Tangzhong, Li Manchun.'
