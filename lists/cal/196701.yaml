    also: [vietnam-congress, vietnam-air-war]
    c: 'Russell''s Armed Services Committee and his Defense appropriations subcommittee, jointly, in executive session on the supplemental, $12.3 billion. McNamara: the bombing has not "significantly reduced, nor any bombing that I could contemplate in the future would significantly reduce," the flow of men and materiel South; a "penalty" on the North. Wheeler: it limits what Hanoi can deploy. Cannon: why the sorties, then?'
    n: 'Daily Digest, [113 Cong. Rec. D14](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=12), [D17](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=15), [D19](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=17) (the sessions). [[w.gibbons-u-s-government-and]], IV, 586–87. To check: Senate Comms. on Armed Services and Appropriations, *Supplemental Military Procurement and Construction Authorizations for Fiscal Year 1967: Hearings*, 90th Cong., 1st Sess. (1967), 13, 57, 69–70. Check: the day of the exchange. Names: Russell, McNamara, Wheeler, Cannon.'
