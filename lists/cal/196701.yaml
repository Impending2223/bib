  - id: cal.1967-01-09.vietnam-congress-2
    when: Jan. 9
    date: '1967-01-09'
    thread: vietnam-congress-mansfield
    c: 'At Mansfield''s suggestion ("Let Mansfield do it," Johnson writes), Johnson with twenty-three Democratic Senators, chairmen and the Policy Committee, Humphrey present. Mansfield: unusual criticism of the President personally. Fulbright: find a way to "get out"; Rusk''s position that Hanoi must surrender. Magnuson: "get on with it. People want action." Muskie: withdrawal and escalation both unacceptable. Russell and Hill: "go in and win, or get out." Symington "not as optimistic"; Jordan calls the involvement "bad"; Bible: the war the main factor in Nevada''s elections.'
    n: '[[w.gibbons-u-s-government-and]], IV, 547–49; [[w.barrett-uncertain-warriors]], 102 (a January meeting, no day: Fulbright, Johnson''s first priority "must be the liquidation of the war — that the war poisons everything else"); [[w.obrien-no-final-victories]], 213–14 (Jan. 9, 1967, the President with the Senate Democratic leaders on the war, from Manatos''s notes: Fulbright, find a way to "get out"; Russell, "go in and win, or get out," Hill endorsing him; Smathers, Symington, Magnuson, Inouye, Randolph in other words; O''Brien: the strongest face-to-face criticism the President had yet heard; not the number present or Mansfield''s suggestion). To check: notes of the meeting, President''s Appointment File, Jan. 9, 1967, and Manatos''s notes, Ex FG 400, LBJ Library; Humphrey, memorandum for the files, Jan. 10, 1967, Minnesota Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 547 n.69); Manatos to Johnson, with Johnson''s notation, President''s Appointment File, Jan. 9, 1967, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 548 n.70). Names: Mansfield, Johnson, Humphrey, Fulbright, Rusk, Magnuson, Muskie, Russell, Hill, Symington, Jordan, Bible.'
