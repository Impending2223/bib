  - id: cal.1969-12-10.vietnam-hanoi
    when: Dec. 10
    date: '1969-12-10'
    place: my-thien
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Cái Bè, Mỹ Tho. The Saigon 9th and 7th Divisions, four Ranger battalions and 20 heavy guns sweep west of Route 20 to Mỹ Thiện to break the base. Region 8, the province and district forces and the people fight on; at Hội Cư the province guard company hurts a company, at Hậu Mỹ Nam Battalion 216A another. After 15 days the sweep is called off.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 145.'
    tags: [polity:drv]
  - id: cal.1969-12-11.china-leadership
    when: Dec. 11
    date: '1969-12-11'
    place: warsaw
    thread: china-leadership
    also: [china]
    c: Warsaw. Lei Yang, Chinese chargé, receives Stoessel in the Chinese embassy; Stoessel reads a prepared text proposing formal talks of the two governments' representatives between Jan. 12 and 16, 1970, or soon after, on agenda, subjects and any proposals.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Dec. 1969 (from the Foreign Ministry''s report, sent by Zhou Enlai Dec. 12). [[w.zhou-enlai-nianpu-1949-2020]], III, 331 (Dec. 12, 1969; the Foreign Ministry''s papers on the meeting); [[w.yang-jisheng-tiandi-fanfu]], II, 1103. Made public: 2013. To check: [[w.zhou-enlai-nianpu-1949]], III, 338 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 1103 n.32c). See [[cal.1968-11-25.china]]. Names: Lei Yang, Stoessel. Check: the American record of Dec. 11.'
    src:
      c: 0eede59e
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, mid-Dec. 1969: ?'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 331: A, B'
        - 'w.yang-jisheng-tiandi-fanfu II, 1103: all'
    tags: [polity:prc, polity:us, name:lei-yang, name:stoessel-walter-j-jr, vis:only:prc+us@C]
  - id: cal.1969-12-11.china-leadership-2
    when: Dec. 11
    date: '1969-12-11'
    thread: china-leadership
    also: [soviet-union, india-and-china-cultural-revolution, defense]
    c: Zhou Enlai presides over the Politburo meeting on the Sino-Soviet boundary talks, in recess because the Soviet delegates went home, and on war preparation, next year's production plan, Third Front construction and Inner Mongolia and Sichuan. Next day he reports the meeting to Mao in writing.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 331 (Dec. 11, 1969). Made public: 2020. See [[cal.1969-12.china-leadership-3]]. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-12-11.china-leadership-3
    when: Dec. 11–23
    date: '1969-12-11'
    thread: china-leadership
    also: [soviet-union]
    c: 'The Military Commission''s Office Group 军委办事组 holds the all-army war preparation conference (Quanjun zhanbei gongzuo huiyi 全军战备工作会议): the year''s war preparation summed up; since Zhenbao 珍宝岛 and Mao''s 毛泽东 call "be ready to fight", the army in the "three norths" has turned its thinking toward fighting; seven tasks for 1970, against surprise attack, strategic reconnaissance and third-line building among them.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 484–485 n.1 (Dec. 11–23, 1969; the Office Group''s summary of Dec. 31 gives the days, not the acts of any one day). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Military Commission Office Group, "Summary of the all-army war preparation conference", Dec. 31, 1969 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 484 n.1). Names: Mao Zedong. Check: the span, thirteen days, past the brief''s week; the note gives neither the opening''s nor the closing''s acts, and Zhou Enlai''s speech of Dec. 20 is the one day the calendar holds. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
    src:
      c: 1bbf8fd7
      rows:
        - 'via w.jianguo-yilai-mao-zedong XIX, 484 n.1: all'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-12-12.china-leadership
    when: Dec. 12
    date: '1969-12-12'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai sends Mao the Foreign Ministry''s three telegrams from China''s representative in Warsaw on the meeting with the American ambassador: "please read; I propose to put it aside a while and see the reactions before deciding how to answer." Mao: do so.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 331 (Dec. 12, 1969). Made public: 2020. See [[cal.1969-12-11.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-12-12.china-leadership-2
    when: Dec. 12
    date: '1969-12-12'
    time: 1969-12-12T12:15Z
    place: peking
    thread: china-leadership
    also: [south-asia, china]
    c: 'Zhou Enlai receives Pakistan''s ambassador, Kaiser: world affairs are tangled; on the world scale the United States and the Soviet Union both contend and collude, bidding for hegemony; the superpowers arm and prepare for war and at the same time negotiate, first the American-Soviet nuclear talks at Helsinki; the Sino-Soviet boundary talks have drawn the world''s eyes; and Sino-American relations too are changing, the American ambassador in Warsaw having sounded China out, talking with a Chinese interpreter at a fashion show at the Yugoslav embassy. China''s position on relations with the United States is the five principles of peaceful coexistence and the withdrawal of all American armed forces from Taiwan and the Taiwan Strait; he thanks President Yahya Khan for stating China''s position clearly.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 331–332 (Dec. 12, 1969); [[w.zhou-enlai-waijiao-huodong]], 546 (Dec. 12, 1969; 8:15 p.m., Fujian Hall, Great Hall of the People; the book has Zhou saying also that Nixon''s "age of negotiation" is not apt, that it is rather a time of arming for war and negotiating, that the Warsaw channel, broken off on Jan. 8 nearly two years before, had not been cancelled, and that Nixon should use it directly through his ambassador without roundabout tricks); [[w.zhonghua-renmin-gongheguo-waijiao]], 231 (Dec. 12, 1969; Zhou to Pakistan''s ambassador, Kaiser: world affairs tangled; the U.S. and USSR contend and collude; arms and talks; the Soviet–American nuclear talks at Helsinki; the Sino-Soviet boundary talks; the U.S. ambassador''s sounding at Warsaw). Made public: 1993. Names: Zhou Enlai.'
    src:
      c: 91dfc323
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 331–332: ?'
        - 'w.zhou-enlai-waijiao-huodong 546: A-E'
        - 'w.zhonghua-renmin-gongheguo-waijiao 231: A'
    tags: [polity:prc, polity:pakistan, name:zhou-enlai, vis:only:prc+pakistan]
    time_zone: Asia/Shanghai
