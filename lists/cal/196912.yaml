  - id: cal.1969-12-03.china
    when: Dec. 3
    date: '1969-12-03'
    place: warsaw
    thread: china
    c: Warsaw, a fashion show. Walter Stoessel, the American ambassador, approaches the Chinese embassy's men, the second secretary Li Juqing 李舉卿 and the interpreter Jing Zhicheng 景志成, who avoid him; he catches Jing and tells him President Nixon wants "major concrete talks" with China's leaders.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 1103. Made public: 2003. To check: [[w.xianzhi-mao-zedong-zhuan-1949]], 1619 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 1103 n.32a). Names: Stoessel, Nixon.'
    src:
      c: f2692d34
      rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 1103: all'
    tags: [polity:prc, name:stoessel-walter-j-jr, name:nixon-richard-m, polity:us, vis:only:prc+us]
  - id: cal.1969-12-04.china-leadership
    when: Dec. 4
    date: '1969-12-04'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai receives the members of the study class run by the Center to settle Sichuan''s problem and tells the Dukou delegates: put the whole first and the Third Front first, put politics in command and go all out to see that Dukou produces iron and the Chengdu-Kunming line is wholly open before July 1, 1970.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 330 (Dec. 4, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-12-04.china-leadership-2
    when: Dec. 4
    date: '1969-12-04'
    time: 1969-12-04T15:15Z
    place: peking
    thread: china-leadership
    also: [africa, china]
    c: 'Zhou Enlai receives Tanzania''s departing ambassador, Salim: he is not well today, his heart not good, so says little; he asks to be remembered to the President and is glad to know he returned home safe and sound. Nyerere is a rare leader in East Africa and had best travel abroad little; he says so as an old friend.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 330 (Dec. 4, 1969); [[w.zhou-enlai-waijiao-huodong]], 546 (Dec. 4, 1969; 11:15 p.m., Great Hall of the People; the book has Zhou asking Vice Minister Ji (姬) to talk more with the ambassador). Made public: 1993. Names: Zhou Enlai, Nyerere.'
    src:
      c: ae72a8bf
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 330: ?'
        - 'w.zhou-enlai-waijiao-huodong 546: A-D'
    tags: [polity:prc, polity:tanzania, name:zhou-enlai, name:nyerere-julius-k, vis:only:prc+tanzania]
    time_zone: Asia/Shanghai
  - id: cal.1969-12-05.soviet-union-leadership
    when: Dec. 5
    date: '1969-12-05'
    place: moscow
    thread: soviet-union-leadership
    c: 'Moscow. Brezhnev with Ceaușescu. His notes of Ceaușescu: the irritants in the relations of the parties and the countries to be removed, on both sides; no agreement for 1970 on coke; military equipment, aircraft among it, not delivered in 1969, and cooperation between aircraft plants; an agreement for 1971–75 and a meeting of the two governments'' delegations; the Romanian party''s fight with the right.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 433–34 (№№ 97–98, Brezhnev''s notes of Ceaușescu''s statement and "О положении в партии" (on the situation in the party), Dec. 5), 452 nn.270–275 (the editors: Ceaușescu on relations of the RCP and CPSU, coke, the shortfall in the 1965–70 supply agreement, military cooperation, the 1971–75 agreement). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 376 (the secretaries'' record, Dec. 5: Brezhnev, with Kosygin, Podgorny and Katushev, receives Ceaușescu''s delegation in the new hall of the Central Committee, 11 to 11:45, and sees it off). Made public: 2016. To check: the Romanian record. Names: Ceaușescu, Brezhnev.'
    src:
      c: db0e8dee
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 376: ?'
    tags: [polity:ussr, polity:romania, name:brezhnev-leonid, name:ceausescu-nicolae, vis:only:ussr+romania]
  - id: cal.1969-12-05.china-leadership
    when: Dec. 5
    date: '1969-12-05'
    thread: china-leadership
    also: [defense, india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the report that secret materials at a plant in the defense research system have been stolen again and again, writes Huang Yongsheng and Wang Bingzhang: "the case being so serious, may the move be stopped for now, this cleaning of ranks and the case done within the year, then the war-preparation move made?"'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 330 (Dec. 5, 1969). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
    tags: [polity:prc, name:zhou-enlai, name:huang-yongsheng, vis:only:prc]
  - id: cal.1969-12-06.china-leadership
    when: Dec. 6
    date: '1969-12-06'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the Hunan revolutionary committee''s fourth plenum''s taking some of Mao''s talks on his Hunan tour as meeting documents, tells Wang Liangen: draft a notice again forbidding strictly the private compiling and printing of Mao''s and Lin Biao''s talks and inspection-tour talks and of the speeches and talks of other Central comrades, and informal rumors, copies, papers and books about them; if the provinces'' committees, military regions, regional Party committees or like bodies break it again, discipline will be applied, and below the military districts they are to examine and punish. On Dec. 25 he reports to Mao and Lin with Chen Boda and Kang Sheng that such private compiling, printing and passing round of the talks and picture books is much and loose and will not stop unless warned several times and recalled and destroyed, and sends the Center''s notice draft passed by the Politburo with two annexes. Mao: do it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 330–331 (Dec. 6, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Chen Boda, Kang Sheng.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, name:chen-boda, name:kang-sheng, vis:only:prc]
  - id: cal.1969-12-06.vietnam-hanoi
    when: Dec. 6
    date: '1969-12-06'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Secretariat''s circular no. 244-TT/TW on Dec. 19, Dec. 20 and Dec. 22: the People''s Army''s 25th anniversary to be marked solemnly. Aims: to call on all to carry out Hồ Chí Minh''s Testament and to fight on against the Americans, to press the recruiting drive, strengthen defense and care for wounded soldiers and the families of the dead. An "army and people''s unity" drive in the provinces; a joint rally in each place, Hanoi and Haiphong each holding two.'
    n: '*Thông tri của Ban Bí thư số 244-TT/TW, ngày 6-12-1969, Về việc tổ chức ba ngày kỷ niệm trong tháng 12 năm nay (19-12, 20-12 và 22-12)*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 357–59. Made public: 2004. Names: Hồ Chí Minh.'
    tags: [polity:drv, polity:us, name:ho-chi-minh, vis:only:drv]
  - id: cal.1969-12-09.soviet-union-leadership
    when: Dec. 9
