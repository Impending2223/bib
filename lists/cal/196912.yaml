  - id: cal.1969-12.vietnam-hanoi-2
    when: Dec., winter
    date: 1969-12
    at: before 1969-12-21
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: The Miền command, at the start of the winter, decides to withdraw the main force of eastern Nam Bộ to the border for refit, leaving a few units, among them the 320th Regiment, to scatter and build guerrilla warfare among the hamlets.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 141. Made public: 2013. Check: the day; the history gives the winter of 1969.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-12.vietnam-hanoi-3
    when: Dec., winter
    date: 1969-12
    at: before 1969-12-21
    place: ben-tre
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Bến Tre, Kiến Phong, An Giang. Battalions 516 and 560 destroy two companies at Mỏ Cày and hurt a Civil Guard company at Minh Đức; local forces kill 48 pacification officials at Phước Hiệp and Định Thủy and 88 rural-development cadres at Thạnh Phú; Bến Tre's commandos set mines and grenades in the town, 147 killed, by the history's count. In Kiến Phong a battalion at Rạch Bà Lương stops a sweep; at Canal Ba a platoon under Tư Văn of 20 men holds off three attacks.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 145–47. Check: the days and the figures; the history gives the winter phase ("đợt hoạt động đông 1969," opened in late October, VI, 137; the December day is the season''s rule, not the page''s).'
    tags: [polity:drv]
  - id: cal.1969-12.vietnam-hanoi-4
    when: Dec., winter
    date: 1969-12
    at: before 1969-12-21
    place: song-luy
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Region 6 and Tuyên Đức. Region 6's sappers raid the rear base of the Saigon 44th Regiment, 23d Division, at Sông Lũy, Bình Thuận. At Đức Trọng and on Route 21 the main force and local forces hurt many Civil Guard companies, take some posts and help the people break strategic hamlets along Routes 20 and 21.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 149. Check: the days; the history gives the winter phase ("đợt hoạt động đông 1969," opened in late October, VI, 137; the December day is the season''s rule, not the page''s).'
    tags: [polity:drv]
  - id: cal.1969-12.vietnam-hanoi-5
    when: Dec., winter
    date: 1969-12
    at: before 1969-12-21
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Bà Rịa. Against the Australian brigade''s half-buried bunkers and fences, the province Party committee orders "Three holds": the Party holds the people, the people the land, the armed forces the enemy. Attacks from outside fail; scouts and sappers then slip in and build agents and secret guerrillas. One night Battalion 445 and Company 25 of Long Đất destroy 12 bunkers, by the history''s count. By early 1970 the bunker tactic is beaten.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 142–43 and n. 1. Check: the days; the history gives the winter phase ("đợt hoạt động đông 1969," opened in late October, VI, 137; the December day is the season''s rule, not the page''s) and the early 1970 result; the place: the history''s Bà Rịa is the Front''s province, with its party committee and the Australian brigade.'
    tags: [polity:drv, ok:fields-place]
