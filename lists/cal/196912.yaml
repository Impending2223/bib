    when: Dec. 2
    date: '1969-12-02'
    thread: china-leadership
    also: [china, south-asia]
    c: 'Zhou Enlai receives Pakistan''s ambassador, Kaiser, and asks him to tell President Yahya Khan: if Nixon wants contact with China, he may use official channels.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 19, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 327 (Dec. 2, 1969; note 3). Made public: 2013. See [[cal.1969-11-19.china-leadership]]. Names: Zhou Enlai, Kaiser, Yahya Khan, Nixon.'
