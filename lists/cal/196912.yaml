    when: Dec. 25
    date: '1969-12-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: approves the Center''s notice forwarding Hunan''s revolutionary committee''s self-criticism for circulating Mao''s instructions without leave: contrary to the Center''s notices, the printing, copying and spread of the talks, inspection tours and instructions of Mao and Lin Biao, of Center members'' speeches, and of their biographies, poems, pictures and photographs is forbidden.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 25, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 331 (Dec. 6 and 25, 1969; the notice and its first annex); [[w.jianguo-yilai-mao-zedong]], XIX, 482–483 (Dec. 25, 1969; Mao''s "Do as proposed" on the draft notice sent by Zhou Enlai and others Dec. 25; the notice also has such records, texts and pictures recalled and destroyed, offenders punished, and printing works and paper strictly controlled; issued the same day; the book gives no place). Made public: 2013. To check: Zhou Enlai and others, report of Dec. 25, 1969 sending the Center''s draft notice forwarding the Hunan revolutionary committee''s self-criticism (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 482 n.1a). Names: Mao Zedong, Lin Biao.'
