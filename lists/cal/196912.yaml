entries:
  - id: cal.1969-12-01.soviet-union-leadership
    when: Dec. 1–2
    date: '1969-12-01'
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    c: Moscow. Ulbricht and the East German delegation arrive Dec. 1, 5 p.m., at Sheremetyevo; Brezhnev negotiates with them in the new hall of the Central Committee, Dec. 2, 10 to 1.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 375 (Dec. 1–2). Names: Brezhnev, Ulbricht.'
    tags: [name:brezhnev-leonid, name:ulbricht-walter, polity:ussr, polity:gdr, polity:romania, polity:czechoslovakia, polity:poland]
  - id: cal.1969-12-02.china-leadership
    when: Dec. 2
    date: '1969-12-02'
    thread: china-leadership
    also: [china, south-asia]
    c: 'Zhou Enlai receives Pakistan''s ambassador, Kaiser, and asks him to tell President Yahya Khan: if Nixon wants contact with China, he may use official channels.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 19, 1969. Made public: 2013. See [[cal.1969-11-19.china-leadership]]. Names: Zhou Enlai, Kaiser, Yahya Khan, Nixon.'
    tags: [polity:prc, polity:pakistan, name:zhou-enlai, name:nixon-richard-m, vis:only:prc+pakistan]
  - id: cal.1969-12-03.soviet-union-leadership
    when: Dec. 3–4
    date: '1969-12-03'
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    c: Moscow. The leaders of the socialist countries. Brezhnev, at the head of the Soviet party-government delegation, negotiates with the delegations of the GDR, Hungary, Bulgaria, Czechoslovakia, Romania and Poland, met by him Dec. 2 (Ceaușescu, Zhivkov, Husák and Gomułka at Sheremetyevo, Kádár at the Kiev station), at the reception house, Dec. 3, 10 to 1 and 4 to 6, and Dec. 4, 10 to 1; the dinner in the Kremlin Dec. 4, 4 to 6.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 375–76 (Dec. 2–4). Names: Brezhnev, Ceaușescu. Check: The record gives no business.'
    tags: [name:brezhnev-leonid, name:ceausescu-nicolae, polity:ussr, polity:gdr, polity:romania, polity:czechoslovakia, polity:poland, polity:hungary, polity:bulgaria, name:husak-gustav, name:gomu-ka-w-adys-aw, name:zhivkov-todor, name:kadar-janos]
  - id: cal.1969-12-05.soviet-union-leadership
    when: Dec. 5
    date: '1969-12-05'
    thread: soviet-union-leadership
    c: 'Moscow. Brezhnev with Ceaușescu. His notes of Ceaușescu: the irritants in the relations of the parties and the countries to be removed, on both sides; no agreement for 1970 on coke; military equipment, aircraft among it, not delivered in 1969, and cooperation between aircraft plants; an agreement for 1971–75 and a meeting of the two governments'' delegations; the Romanian party''s fight with the right.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 433–34 (№№ 97–98, Brezhnev''s notes of Ceaușescu''s statement and "О положении в партии" (on the situation in the party), Dec. 5), 452 nn.270–275 (the editors: Ceaușescu on relations of the RCP and CPSU, coke, the shortfall in the 1965–70 supply agreement, military cooperation, the 1971–75 agreement). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 376 (the secretaries'' record, Dec. 5: Brezhnev, with Kosygin, Podgorny and Katushev, receives Ceaușescu''s delegation in the new hall of the Central Committee, 11 to 11:45, and sees it off). Made public: 2016. To check: the Romanian record. Names: Ceaușescu, Brezhnev.'
    src:
      c: db0e8dee
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 376: ?'
    tags: [polity:ussr, polity:romania, name:brezhnev-leonid, name:ceausescu-nicolae, vis:only:ussr+romania]
  - id: cal.1969-12-09.soviet-union-leadership
    when: Dec. 9
    date: '1969-12-09'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev negotiates with the Korean delegation led by Pak Song-chol, 4 to 8 p.m., Kosygin and Katushev on the Soviet side.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 376 (Dec. 9). Names: Brezhnev, Pak Song-chol, Kosygin, Katushev.'
    tags: [name:brezhnev-leonid, name:kosygin-aleksei, name:katushev-konstantin-f, polity:ussr, polity:dprk]
  - id: cal.1969-12-10.soviet-union-leadership
    when: Dec. 10
    date: '1969-12-10'
    thread: soviet-union-leadership
    also: [middle-east]
    c: Moscow. Brezhnev, with Kosygin and Podgorny, negotiates with the party-government delegation of the United Arab Republic led by Sadat, 10 to 2, in the Kremlin.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 376 (Dec. 10). Names: Brezhnev, Kosygin, Podgorny, Sadat.'
    tags: [name:brezhnev-leonid, name:kosygin-aleksei, name:podgorny-nikolai-v, polity:ussr, polity:uar, name:sadat-anwar]
  - id: cal.1969-12-11.china-leadership
    when: Dec. 11
    date: '1969-12-11'
    thread: china-leadership
    also: [china]
    c: Warsaw. Lei Yang, Chinese chargé, receives Stoessel in the Chinese embassy; Stoessel reads a prepared text proposing formal talks of the two governments' representatives between Jan. 12 and 16, 1970, or soon after, on agenda, subjects and any proposals.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Dec. 1969 (from the Foreign Ministry''s report, sent by Zhou Enlai Dec. 12). Made public: 2013. See [[cal.1968-11-25.china]]. Names: Lei Yang, Stoessel. Check: the American record of Dec. 11.'
    tags: [polity:prc, polity:us, name:lei-yang, name:stoessel-walter-j-jr, vis:only:prc+us@C]
  - id: cal.1969-12-15.soviet-union-leadership
    when: Dec. 15
    date: '1969-12-15'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev presides over the Central Committee's plenum in the Sverdlov Hall, 10 to 4:30.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 378 (Dec. 15); [[w.schattenberg-brezhnev]], 227–28, 247 (Brezhnev''s speech, kept secret: the first general attack on Kosygin and Gosplan, the 1970 plan ill thought out, ministries named by the figures they miss; drink; prepared by his staff under Bovin, not discussed in the Politburo; 227 nn.229–38, 247 n.32). To check: RGANI, f. 2, op. 3, d. 168 (Protocol no. 12, Dec. 15, 1969), l. 30, 36, 40–44, 58 (cited by [[w.schattenberg-brezhnev]], 227–28 nn.231–35, 247 n.32). Names: Brezhnev. Check: The record gives neither agenda nor business.'
    src:
      c: b674673e
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 378: ?'
        - 'w.schattenberg-brezhnev 227–28, 247: B'
    tags: [name:brezhnev-leonid, polity:ussr]
  - id: cal.1969-12-17.soviet-union-leadership
    when: Dec. 17
    date: '1969-12-17'
    thread: soviet-union-leadership
    c: 'The Politburo on an article for Stalin''s ninetieth birthday, Dec. 21. Opinions diverge: some want no mention of him, some celebrate him, some a balanced picture, some him as a mass murderer. Brezhnev, who had been for no article, decides after hearing the oblast secretaries and the others that one be published: no one denies his revolutionary merits, no one his grave errors.'
    n: '[[w.schattenberg-brezhnev]], 247 (n.31, 34). To check: L. Mlechin, *Brezhnev*, 303, 307; Shelest, *Da ne sudimy budete*, 444 (cited by [[w.schattenberg-brezhnev]], 247 nn.31, 34). Made public: 2021 at the latest. Names: Brezhnev, Stalin, Shelest. Check: the day: the work gives Dec. 17; its n.34 notes Shelest has Dec. 19; the Politburo''s earlier commission to the Central Committee for the article, undated.'
    tags: [name:brezhnev-leonid, polity:ussr, vis:only:ussr]
  - id: cal.1969-12-18.china-leadership
    when: Dec. 18
    date: '1969-12-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'The Center, with Mao''s approval, instructs on strengthening work in Tibet''s Ali district: its Party, government and army work entrusted to Xinjiang''s revolutionary committee and military district, though still part of Tibet; to build the planned power station; improve transport and supplies; train local cadres.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 18, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-12-19.china-leadership
    when: Dec. 19
    date: '1969-12-19'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: Mao, Lin Biao and Zhou Enlai telegraph Nguyễn Hữu Thọ, president of the NLF's presidium, on its ninth anniversary, praising the southern Vietnamese people's long, hard struggle, which has put the US in isolation and difficulty.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 19, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai, Nguyễn Hữu Thọ.'
    tags: [polity:prc, polity:nlf, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:nguyen-huu-tho]
  - id: cal.1969-12-25.soviet-union-leadership
    when: Dec. 25
    date: '1969-12-25'
    thread: soviet-union-leadership
    also: [europe-and-the-alliance-federal-republic]
    c: 'Lednëv, a "journalist" sent by the KGB, brings Bahr a copy of Brandt''s letter of Nov. 19 to Kosygin, opening a confidential channel: the Soviet side is open to a confidential exchange of opinions, whose occurrence and content will never be made public. Bahr takes him at first for Kosygin''s man; later he learns Lednëv means Brezhnev and the KGB.'
    n: '[[w.schattenberg-brezhnev]], 288–89 (n.220–24). To check: Bahr''s note, Dec. 24, 1969, *Akten zur Auswärtigen Politik der Bundesrepublik Deutschland 1969*, II, 1465; Brandt to Kosygin, Nov. 19, 1969, ibid., 1313; E. Bahr, *Zu meiner Zeit*, 293 (cited by [[w.schattenberg-brezhnev]], 288 nn.221–23). Made public: 2021 at the latest. Names: Bahr, Brandt, Kosygin, Brezhnev, Andropov. Check: the day: Christmas Day in the text, Bahr''s own record dated Dec. 24; the place, not given for this meeting (the later ones at Dahlem, West Berlin, 289).'
    tags: [name:brandt-willy, name:kosygin-aleksei, name:brezhnev-leonid, name:andropov-yuriy-vladimirovich, polity:ussr, polity:frg, vis:only:ussr+frg]
  - id: cal.1969-12-25.china-leadership
    when: Dec. 25
    date: '1969-12-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: approves the Center''s notice forwarding Hunan''s revolutionary committee''s self-criticism for circulating Mao''s instructions without leave: contrary to the Center''s notices, the printing, copying and spread of the talks, inspection tours and instructions of Mao and Lin Biao, of Center members'' speeches, and of their biographies, poems, pictures and photographs is forbidden.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 25, 1969. Made public: 2013. Names: Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-12-25.china-leadership-2
    when: Dec. 25
    date: '1969-12-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves the Center''s covering note for the Sichuan revolutionary committee and Chengdu district''s report of Dec. 24 on Sichuan: self-criticism for factionalism, the "against restoration" campaign, ten remedies. Zhang Guohua is made head of the core group, Liang Xingchu and Li Dazhang deputies. Issued Dec. 27.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 25, 1969. See [[cal.1969-12-25.china-leadership]]. Made public: 2013. Names: Mao Zedong, Zhang Guohua, Liang Xingchu, Li Dazhang.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-12-29.china-leadership
    when: Dec. 29
    date: '1969-12-29'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves Zhou Enlai''s draft Center decision of Dec. 29 putting Inner Mongolia under full military control by sectors, the Peking Military Region to set up a forward command post: the Baotou, Bayannur, Xilin Gol, Ulanqab, Hohhot and Yekezhao areas to the 63rd, 65th, 69th and 27th Armies.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 29, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-12-30.soviet-union-leadership
    when: Dec. 30
    date: '1969-12-30'
    thread: soviet-union-leadership
    also: [vietnam]
    c: Moscow. Brezhnev receives Lê Duẩn, 3 to 7 p.m., in the Central Committee.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 381 (Dec. 30). Names: Brezhnev, Lê Duẩn.'
    tags: [name:brezhnev-leonid, name:le-duan, polity:ussr, polity:drv]
  - id: cal.1969-12.china-leadership
    when: Dec., early
    date: 1969-12
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: Qiao Guanhua''s draft reply to Kuznetsov''s letter of Nov. 19, which proposed fixing the boundary''s course at once: the urgent matter is to carry out the four interim measures of Sept. 11 and the later addition, and first agree on the status quo and avoiding armed clashes, so that the question be settled peacefully free of threat. Mao: as proposed.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, early Dec. 1969. Made public: 2013. Names: Mao Zedong, Qiao Guanhua, Kuznetsov.'
    tags: [polity:prc, polity:ussr, name:mao-zedong, name:qiao-guanhua, name:kuznetsov-vasily-v, vis:only:prc+ussr]
  - id: cal.1969-12.china-leadership-2
    when: Dec., early
    date: 1969-12
    thread: china-leadership
    also: [china]
    c: 'Mao, Peking: Zhou Enlai''s report of Dec. 4 on freeing two Americans, Baldwin and Conrad, held since Feb. 16 for sailing a yacht into Chinese waters off Zhuhai. Oct. 27 the American consul general in Hong Kong, Martin, had written to Guangdong''s Liu Xingyuan about them; the Foreign Ministry''s Nov. 7 report took it for a probe of China''s reaction and proposed freeing them in early December with a message to the American ambassador in Warsaw. After the Politburo members in Peking considered it, Zhou proposes to agree. Mao: agreed.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, early Dec. 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Baldwin, Conrad, Martin (consul general), Liu Xingyuan. Check: Zhou''s report is cut off in the chronology after "to agree"; the American record.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-12.china-leadership-3
    when: Dec., middle
    date: 1969-12
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: Zhou Enlai''s report on the recess of the boundary talks because the Soviet chief of delegation asked to go home for a meeting: China will issue a short item after they leave, and refused to issue it jointly. Mao: as proposed. Dec. 15 *Renmin ribao* prints that Kuznetsov has gone home and the talks are in recess.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Dec. 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kuznetsov.'
    tags: [polity:prc, polity:ussr, name:mao-zedong, name:zhou-enlai, name:kuznetsov-vasily-v, vis:only:prc+ussr]
