    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves the Center''s covering note for the Sichuan revolutionary committee and Chengdu district''s report of Dec. 24 on Sichuan: self-criticism for factionalism, the "against restoration" campaign, ten remedies. Zhang Guohua is made head of the core group, Liang Xingchu and Li Dazhang deputies. Issued Dec. 27.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 25, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 334 (Dec. 25, 1969; the Center''s instruction, the core group and the rebels'' removal); [[w.macfarquhar-maos-last-revolution]], 294–295 (before the end of 1969 Liu Jieting and Zhang Xiting, charged by the PLA in the southwest with "resisting the center," are thrown off the Sichuan Revolutionary Committee and lose their Central Committee places). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 334 (Dec. 25, 1969), has the Center issuing its instruction on Sichuan Dec. 25, the core group at fifteen members with Zhang Guohua leader and Liang Xingchu and Li Dazhang deputies, and Liu Jieting and Zhang Xiting, rebel leaders, removed as vice-chairmen of the revolutionary committee. To check: [[w.zhou-enlai-nianpu-1949]], III, 331, 341 (cited by [[w.macfarquhar-maos-last-revolution]], 295 n.56a); [[w.dangdai-sichuan-dashi-jiyao]], 283 (cited by [[w.macfarquhar-maos-last-revolution]], 295 n.56b). See [[cal.1969-12-25.china-leadership]]. Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 331, 341, cited by [[w.macfarquhar-maos-last-revolution]], 295 n.56a). Names: Mao Zedong, Zhang Guohua, Liang Xingchu, Li Dazhang.'
