    c: 'Mao approves Zhou Enlai''s draft Center decision of Dec. 29 putting Inner Mongolia under full military control by sectors, the Peking Military Region to set up a forward command post: the Baotou, Bayannur, Xilin Gol, Ulanqab, Hohhot and Yekezhao areas to the 63rd, 65th, 69th and 27th Armies.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 29, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 332 (Dec. 16 and 29, 1969; the decision as issued); [[w.macfarquhar-maos-last-revolution]], 258 (the committee''s chairman, a Han lieutenant general, and first vice chairman, a Mongol major general, removed; a martial-law task force under Zheng Weishan, commander of the Peking Military Region, takes control for a time); [[w.yang-jisheng-tiandi-fanfu]], II, 626 (the Peking Military Region to carry it out; the forward command of Zheng Weishan, commander, Du Wenda, deputy commander, Huang Zhentang and Zhang Zhengguang, deputy political commissars). Made public: 2013. Check: [[w.macfarquhar-maos-last-revolution]], 258, gives the removals and the martial-law task force as of 1969 without a day. To check: [[w.woody-cultural-revolution-in-inner]], i–vi, 30–35 (cited by [[w.macfarquhar-maos-last-revolution]], 258 n.22); Alatengdelihai 阿拉滕德力海, *Neimenggu wasu zainan shilu* 《內蒙古挖肅災難實錄》 (self-printed), 316 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 626 n.104). Names: Mao Zedong, Zhou Enlai.'
