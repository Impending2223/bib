  - id: cal.1969-12-29.china-leadership-2
    when: Dec. 29
    date: '1969-12-29'
    thread: china-leadership
    also: [china, soviet-union]
    c: 'Zhou Enlai to Mao, on revising the Foreign Ministry''s reply to the Chinese embassies in France and Switzerland: the Foreign Ministry took an attitude of refusing everything, not quite fitting; the reply is now changed to take a line of only receiving and only listening, no answer for now, and answering only when contact favors China. On the Sino-American ambassadorial talks at Warsaw he proposes to answer early in January: "fixed for Feb. 20 to resume the talks". Mao: agreed. The nianpu''s note: the Ministry''s first draft would have refused if the American side asked to see China''s ambassador or chargé, and received only ordinary staff, two Chinese present, to listen without speaking and pass on but give no date for a reply.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 334 (Dec. 29, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
