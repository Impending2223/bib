    c: Zhou Enlai receives the heads of the Central Hong Kong and Macao Work Committee and tells them Hong Kong needs more study, Xinhua also to study Hong Kong's economic, political and cultural conditions, since Hong Kong reflects the world economy's movements; the committee and the Bank of China are to study international economic trends, commerce, banking and transport.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 332 (Dec. 14, 1969). Made public: 2020. Names: Zhou Enlai.'
