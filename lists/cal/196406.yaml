    also: [states-and-cities, alabama, legislatures]
    c: '*Reynolds v. Sims*, [377 U.S. 533](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377533/usrep377533.pdf). Alabama''s legislature, last apportioned on the 1900 census; the district court''s judgment affirmed. Both houses of a State legislature to be apportioned by population, districts "as nearly of equal population as is practicable." "Legislators represent people, not trees or acres." Warren for the Court; Harlan dissents. The same day, the apportionments of New York, Maryland, Virginia, Delaware and Colorado struck down; Colorado''s, approved by its voters in 1962, over Stewart''s and Clark''s dissents.'
    n: '*WMCA, Inc. v. Lomenzo*, [377 U.S. 633](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377633/usrep377633.pdf); *Maryland Committee for Fair Representation v. Tawes*, [377 U.S. 656](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377656/usrep377656.pdf); *Davis v. Mann*, [377 U.S. 678](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377678/usrep377678.pdf); *Roman v. Sincock*, [377 U.S. 695](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377695/usrep377695.pdf); *Lucas v. Forty-Fourth General Assembly*, [377 U.S. 713](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377713/usrep377713.pdf). Opinions (Opp. II.H.1; K–J Cong. II.J.1). [[w.navasky-kennedy-justice]], 320–21 (the decision; Lewis''s note to Cox at the bench, "It feels awful"); [[w.peirce-mountain-states-of-america]], 63 (Colorado''s plan struck, 6–3); [[w.schlesinger-robert-kennedy-and-his]], 400 (in June 1964 Warren, "speaking for a nearly unanimous Court," ruled that both houses of a State legislature must be apportioned on population; not the case, the day, Alabama or the quotations). To check: [[w.cortner-apportionment-cases]]; [[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]]; [[w.smith-on-democracys-doorstep-2014]]; [[w.dixon-democratic-representation]]; [[w.cox-elbridge-gerrys-salamander]]. See [[cal.1962-03-26.court]]. Names: Warren.'
