    when: June 2
    date: '1964-06-02'
    thread: china-leadership
    also: [china]
    c: Liu Shaoqi presides at a meeting of the Politburo Standing Committee, the Secretariat and the regional bureaus' first secretaries on the socialist-education movement in town and country. He says peaceful evolution has already evolved into some people in the high organs, and provincial and municipal committees have them; in some places cadres with "four unclean" faults handle the work teams by "feeding, resisting, dragging and muddling," and ways must be found to throw them off; until the masses are fully roused, the 95 percent of cadres cannot be united and the grassroots relied on.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 592 (June 2, 1964); [[w.macfarquhar-origins-of-the-cultural]], III, 403–4 (at the work conference Liu says basic-level cadres try to derail the movement by calling the four clean-ups anti-Party, such disruption to be counted counter-revolutionary and punished by expulsion; and that the roots of corruption lie higher up, in "peaceful evolution," to be dug out even in the Central Committee); [[w.yang-shangkun-riji]], II, 381 (June 2, 1964; the group leaders of the conference 小组长会议, Liu presiding, on socialist education, 3:30 to 6:30 p.m.; Yang there; the bodies attending as the diary names them); [[w.deng-xiaoping-nianpu-1904]], III, 1814 (June 2, 1964; Deng at the meeting of the Politburo Standing Committee, the Secretariat and the first secretaries of the regional bureaus, on the socialist education movement in town and country; says the countryside''s movement is to be carried through, relying on poor and lower-middle peasants, with regular work, in periods and batches; the cities have the ''five-antis'', the ''four clean-ups'', the classing of classes and the setting in order of the trade unions, street bodies and trade organizations; classes have changed much and a standard for classing is wanted, which the Chinese do not yet have; the cities'' movement is to start in publicly owned enterprises, universities, big hospitals and big shops). Made public: 1996. Check: whether these remarks of Liu''s are of this meeting of June 2 or another session of the work conference; the book gives no day (III, 403–4). To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1116 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 403 n.29); [[w.jin-1949-1989-niande-zhongguo]], 536–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 404 n.30). Names: Liu Shaoqi. Check: the date against Mao''s undated remarks to a Politburo Standing Committee meeting of June 1964, [[cal.1964-06.china-leadership]].'
