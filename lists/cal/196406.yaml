        - 'w.branch-pillar-of-fire 326: A'
        - 'via w.branch-pillar-of-fire 326 n.unshirted-hell: A'
        - 'w.kotz-judgment-days 147: C-G'
        - 'via w.kotz-judgment-days 147 n.111: C-G'
    tags: [name:smathers-george-a, name:johnson-lyndon-b, name:king-martin-luther-jr, state:fl]
    aliases: [cal.1964-06-01.desegregation-public-places]
