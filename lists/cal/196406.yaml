    thread: vietnam
    c: About 8:30 p.m. Johnson telephones Rusk at his office; Rusk brings a wire from Lodge, who wants to resign as Ambassador to Vietnam and come home. Johnson has already asked Bundy, McNamara and Rusk whom they would recommend should Lodge resign; the men they suggest, their willingness to go "in most instances" checked.
