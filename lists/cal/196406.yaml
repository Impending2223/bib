  - id: cal.1964-06-14.vietnam-2
    when: June 14
    date: '1964-06-14'
    thread: vietnam
    c: 'The bedroom, early, breakfast with Valenti. Johnson will not name Robert Kennedy to Saigon: "I would be accusing myself for the rest of my life if something happened to him out there. ... I can''t trust the security there." He asks Valenti to choose among Maxwell Taylor, Ball and Gilpatric. Valenti: Gilpatric, for his administration and accurate reports; Ball is needed in Washington; Taylor would inspire the most confidence. By Valenti''s account.'
    n: '[[w.valenti-very-human-president]], 141–42 (Valenti''s account; "the next morning" after June 13). Check: the day. See [[cal.1964-06-13.vietnam]]. Names: Johnson, Valenti, Robert Kennedy, Taylor, Ball, Gilpatric.'
    tags: [name:johnson-lyndon-b, name:valenti-jack, name:kennedy-robert-f, name:taylor-maxwell, name:ball-george-w, name:gilpatric-roswell-l]
  - id: cal.1964-06-14.vietnam-3
    when: June 14
    date: '1964-06-14'
    time: 1964-06-14T16:00Z
    place: washington
    thread: vietnam
    c: The Mansion, the family dining room, noon. Johnson, Clifford and Valenti. Johnson asks Clifford his choice for Saigon, then lays out Taylor, Ball and Gilpatric with Valenti's points of the morning, stressing Taylor and the confidence he would inspire. Clifford agrees. Johnson mentions that Kennedy has volunteered; Clifford says nothing to that. By Valenti's account.
    n: '[[w.valenti-very-human-president]], 142–43 (Valenti''s account). See [[cal.1964-06-14.vietnam]]. Names: Johnson, Clifford, Valenti, Taylor, Ball, Gilpatric, Robert Kennedy.'
