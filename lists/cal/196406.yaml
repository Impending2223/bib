    c: 'Peking 北京. Peng Zhen 彭真 speaks to the work conference''s East China group: Mao''s 毛泽东 three lines, local forces and arsenals, and successors strategic plans for a century; Khrushchev calls himself a Marxist-Leninist but stands for the high-paid stratum, kulaks and capitalists; the highest interest of the great majority the test of truth; Communists to unite with those who opposed them; democratic style of special weight for a ruling party, now one who offends a branch secretary may lose his rice bowl, men watch the first secretary''s face; high democracy, high centralism; Mao says the Party is no "Mao clan temple"; self-criticism above all for first secretaries, governors, commanders and commissars.'
