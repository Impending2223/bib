    c: 'Cloture on the civil rights bill, [71–29](https://voteview.com/rollcall/RS0880302), the first on a civil rights bill since Rule XXII''s adoption in 1917: Republicans 27–6, Democrats 44–23. Robert Byrd had spoken through the night, 14 hours 13 minutes. Dirksen: "Stronger than all the armies is an idea whose time has come." June 9, Morton''s jury trial amendment, every title but voting, adopted, [51–48](https://voteview.com/rollcall/RS0880298).'
