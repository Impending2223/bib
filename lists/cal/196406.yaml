  - id: cal.1964-06-05.europe-and-the-alliance
    when: June 5
    date: '1964-06-05'
    thread: cyprus
    c: 'Cyprus. Johnson to Inonu, Turkey preparing to intervene on the island: no action without consultation; "Adhesion to NATO, in its very essence, means that NATO countries will not wage war on each other"; American arms not to be used. Inonu puts off the intervention at the American request.'
    n: 'FRUS 1964–68, XVI, docs. [54](https://history.state.gov/historicaldocuments/frus1964-68v16/d54), [55](https://history.state.gov/historicaldocuments/frus1964-68v16/d55). To check: [[w.ball-past-has-another-pattern]]; [[w.nicolet-united-states-policy-towards]]. See [[cal.1963-12-21.europe-and-the-alliance]]. Names: Johnson, İnönü.'
    tags: [name:johnson-lyndon-b, name:inonu-ismet]
  - id: cal.1964-06-05.middle-east
    when: June 5–8
    date: '1964-06-05'
    thread: middle-east
    c: 'The Shah in Washington, an informal visit: the exhibit "7000 Years of Iranian Art." With Johnson, June 5: Arab designs on Khuzistan, Iran''s defenses, Bandar Abbas as a base, OPEC "an instrument of Arab imperialism." Johnson and Rusk ask Jersey Standard''s and California Standard''s men at lunch to treat Iran fairly. Johnson''s toast: "a reformist 20th century monarch." June 6, Defense offers C-130s and tanks.'
    n: 'Toasts of the President and the Shah of Iran, [1963–64 Pub. Papers 748](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=832) (June 5, 1964). FRUS 1964–68, XXII, docs. [31](https://history.state.gov/historicaldocuments/frus1964-68v22/d31), [34](https://history.state.gov/historicaldocuments/frus1964-68v22/d34), [36](https://history.state.gov/historicaldocuments/frus1964-68v22/d36), [37](https://history.state.gov/historicaldocuments/frus1964-68v22/d37), [38](https://history.state.gov/historicaldocuments/frus1964-68v22/d38). To check: [[w.bill-eagle-and-the-lion]]; [[w.afkhami-life-and-times-of]]; [[w.milani-shah]]; [[w.offiler-us-foreign-policy-and]]. See [[cal.1962-04-11.middle-east]]. Names: Johnson, Pahlavi, Rusk.'
    tags: [name:johnson-lyndon-b, name:pahlavi-mohammed-reza, name:rusk-dean]
