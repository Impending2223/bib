    c: 'The White House, 6:30 p.m. Johnson, O''Brien and Valenti with Mahon, Albert and Rooney on passing the foreign aid bill without Otto Passman "butchering it up." Johnson: "Either Otto Passman is going to run the foreign policy of this country, or I am." The bill is a billion dollars under Kennedy''s last request and exactly what Congress appropriated last year: "This is a bare-bones bill ... with no fat on it." He sees the Latin American ambassadors the next day. The members agree to talk to Passman and find the votes. By Valenti''s account.'
    n: '[[w.valenti-very-human-president]], 143–44 (Valenti''s account). Names: Johnson, O''Brien, Valenti, Mahon, Albert, Rooney, Passman.'
    tags: [name:johnson-lyndon-b, name:obrien-lawrence-f, name:valenti-jack, name:mahon-george-h, name:albert-carl, name:rooney-john-j, name:passman-otto-e]
  - id: cal.1964-06-17.program
