    thread: elections-1964
    also: [goldwater]
    c: 'Primaries in California and South Dakota. Republican: Goldwater in California; unpledged delegates in South Dakota. Democratic: unpledged delegates in California and South Dakota.'
    n: '[Cal. Secretary of State, *Statement of Vote, Consolidated Primary Election, June 2, 1964*, 4–7](https://archive.org/details/castatem196264cali/page/n123); [S.D. Secretary of State, *Official Election Returns for South Dakota, Primary Election, June 2, 1964*, "Presidential Delegates and Alternates"](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1964P.pdf#page=4). CQ Guide 6th (2010) 407–408. [[w.young-two-suns-of-the]], 91 (Goldwater by 68,000, 51.6 percent). See [[cal.1964-03-10.elections-1964]]. Names: Goldwater.'
