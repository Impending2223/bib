    c: 'The bedroom, before 8 a.m. Johnson to Valenti: he decided the night before and "just dictated" a statement that he will not be a candidate this year; he had first thought to resign, but that would be unfair without a Vice President to take his place. Out of the race he could go on with the program without the charge of "politics." Disappointed in the Republican leaders, who that week accused him of election-year politics with Southeast Asia; "sick at heart" that the Congress has no sense of urgency and works only Tuesday to Thursday. "There aren''t enough Bob McNamaras and Dean Rusks." Valenti objects; neither speaks of it again. By Valenti''s account.'
