  - id: cal.1964-06-13.china
    when: June 13
    date: '1964-06-13'
    thread: china
    also: [laos]
    c: The Chinese government issues a statement strongly protesting the bombing of the Chinese economic and cultural mission's quarters in Laos by U.S. aircraft. It calls it a further breach of the Geneva agreement, a widening of the armed interference in Laos, and a plain provocation against the Chinese people. The Lao situation, it says, has gone grave; the two co-chairmen of the Geneva conference have a duty at once to stop the U.S. from widening its war in Laos and to convene the 14-nation conference as soon as possible.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 343–344 (June 13, 1964).'
