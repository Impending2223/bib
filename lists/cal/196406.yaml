    n: '[Cal. Secretary of State, *Statement of Vote, Consolidated Primary Election, June 2, 1964*, 4–7](https://archive.org/details/castatem196264cali/page/n123); [S.D. Secretary of State, *Official Election Returns for South Dakota, Primary Election, June 2, 1964*, "Presidential Delegates and Alternates"](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1964P.pdf#page=4). CQ Guide 6th (2010) 407–408. [[w.young-two-suns-of-the]], 91 (Goldwater by 68,000, 51.6 percent); [[w.white-suite-3505]], 348–51 (California, Goldwater 1,089,133, Rockefeller 1,030,180; South Dakota''s 14); [[w.white-making-of-the-president-1965]], 128 (Goldwater 1,120,403, Rockefeller 1,052,053, 51.6 percent; some 50,000 poll counters of the three networks; Harris for CBS calls it at 7:20; Rockefeller by 106,000 in the Bay Area, Goldwater by 207,000 in Los Angeles and Orange counties); [[w.goldberg-barry-goldwater]], 194 (a margin of 58,231, 51.4 percent of more than two million; Rockefeller the north by over 100,000, Goldwater Orange and Los Angeles Counties; eighty-six delegates; Rockefeller: "like do you have to take the country into war over Vietnam"; Eisenhower to a friend, "We have lost a major battle"; Goldwater''s statement, "a choice, not an echo"); [[w.smith-on-his-own-terms]], 447 (Goldwater 1,089,133, 51.3 percent; Rockefeller 1,030,180, 48.7 percent; the networks call it before the polls close in the north; Rockefeller: "I listened to the wrong people"); [[w.bernstein-guns-or-butter]], 129 (Goldwater 1,120,403, 52 percent, Rockefeller 1,052,053; 207,000 ahead in Los Angeles and Orange counties); [[w.novak-agony-of-the-g]], 414–15 (Goldwater 1,089,133, 51.3 percent, Rockefeller 1,030,180; CBS''s call twenty-two minutes after the southern polls closed; Los Angeles County by 158,000, Orange by 49,000, San Diego by 16,000; 59,000 in all). [[w.kabaservice-rule-and-ruin]], 95 (Goldwater by 59,000 votes of more than two million; Rockefeller carries every county but Los Angeles, Orange and San Diego). See [[cal.1964-03-10.elections-1964]]. Names: Goldwater.'
