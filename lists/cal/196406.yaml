    c: 'The White House. Dinner for John and Elaine Steinbeck. Johnson''s troubles, by Mrs. Johnson''s account: the Turks on the point of invading Cyprus; the coal industry wants Venezuelan oil imports stopped. Steinbeck on Russia: the Russians'' dislike of the Chinese, shown by Khrushchev''s daughter Rada; "blindness" not to have relations with a quarter of the people of the earth, Red China; invite young Russian writers who object to their government. Steinbeck has written a piece on Johnson that the Democratic Committee will likely distribute at the Convention; Mrs. Johnson asks for more such help. The Johnsons walk the Steinbecks across Pennsylvania Avenue.'
