    thread: vietnam
    also: [transition-and-staff, mississippi]
    c: 'Lodge resigns as Ambassador to South Vietnam, for "entirely personal reasons." Taylor to succeed him, U. Alexis Johnson as his deputy; Wheeler for Taylor as Chairman of the Joint Chiefs. Westmoreland had taken over the command in Saigon from Harkins, June 20. At the news conference, of the three missing in Mississippi: the FBI "making every effort to locate them"; "Several weeks ago I had asked them to anticipate the problems that would come from this, and to send extra FBI personnel into the area."'
