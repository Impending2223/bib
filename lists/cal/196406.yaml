    c: 'Paris. Ball with Couve de Murville in the morning, then with de Gaulle at the Élysée, Bohlen there, with Johnson''s letter. Ball: if the insurgency is not put down in a reasonable time, increasing military pressure on Hanoi; China now like the Soviet Union of 1917. De Gaulle: "I do not believe that you can win in this situation"; the more the United States conducts the war, the more the Vietnamese turn against it; to the French Southeast Asia "a ''rotten'' territory in which to fight," and France will not go to war in Asia, as an ally or otherwise; a vast diplomatic operation, France, India, China and Japan in it.'
