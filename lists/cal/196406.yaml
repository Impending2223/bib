    c: 'Mao Zedong, receiving all the members of the delegation of Chilean press workers, says: China wants peace, and we favor whoever speaks of peace. We do not favor war. But we must support the peoples of all countries in their wars against imperialism. This side of our policy is announced publicly and will not be given up.'
