  - id: cal.1964-06-08.china-leadership
    when: June 8
    date: '1964-06-08'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Mao presides over an enlarged Politburo Standing Committee meeting at the Central Work Conference, and speaks; the first time he meets the conference in 20-odd days. Liu Shaoqi on two education systems; on the French party giving up arms; on whether China may turn revisionist. Mao: it already has, as at the Baiyin works and at Xiaozhan commune near Tianjin, which Chen Boda investigated; a third of the power is in enemy hands. The "two into one" is revisionism, class conciliation; the Selected Works, second edition, a fifth volume: "nothing to put in it." Each province to have grenade, explosive and arms plants; cadres in three lines against sudden death.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 8, 1964; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 593 (June 8, 1964; Liu attends the small meeting Mao presides over at the Central Work Conference, of some Politburo members and the bureaus'' first secretaries; Mao says a third of the country''s power is not in our hands but in the enemy''s, and takes up Liu''s proposal of two labor systems and two education systems); [[w.macfarquhar-origins-of-the-cultural]], III, 395 (Mao: "one divides into two" is dialectics, "two combine into one" revisionism and class reconciliation); [[w.macfarquhar-origins-of-the-cultural]], III, 403 (Mao tells the work conference that about a third of power is not in the Party''s hands); [[w.jianguo-yilai-mao-zedong]], XVII, 261–262 (June 8, 1964; an extract of Mao''s speech at the enlarged Politburo Standing Committee, printed from *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967): learn by oneself; Xiao Chunü 萧楚女, who never went to school, taught at the Peasant Movement Institute; university lectures to be printed and given out, both sides of the material; his "Strategic problems of China''s revolutionary war" was the Red Army College''s lectures); [[w.deng-xiaoping-nianpu-1904]], III, 1815 (June 8, 1964; Deng attends the enlarged Politburo Standing Committee meeting Mao presides over); [[w.mao-zedong-zhuan]], VI, ch. 73 (June 8, at the conference in Peking, the first time Mao speaks to the conference after 20-odd days: against revisionism: some already, Baiyin works and the Xiaozhan commune Chen Boda surveyed, a third of power not in our hands (n.2); successors; each region and province to make arms and build militia and local forces; cadres in first, second and third lines; at the enlarged Standing Committee, "one divides into two" is dialectics, "two combine into one" revisionism and class conciliation (n.51)). [[w.jian-zhou-enlai]], 490 (June 8, Mao: a third of the power in the country not in our hands; Zhou echoes him: revisionists control many grassroots units); [[w.yang-jisheng-tiandi-fanfu]], II, 1066–1067 (Mao at the Central Work Conference: while imperialism exists there is danger of war; conventional arms, not the atom bomb, decide; build the third-line industrial base, some arms industry in the first and second lines, every province its own; Yang gives June 6, after Bo Yibo, and notes the nianpu''s June 8); [[w.yang-jisheng-tiandi-fanfu]], I, 98 (Mao: "one divides into two" is dialectics; "two combine into one" perhaps revisionism, class reconciliation); [[w.peng-zhen-nianpu-1902]], IV, 336 (June 8, 1964; Peng Zhen at Mao''s enlarged Standing Committee, some Politburo members and the regional bureaus'' first secretaries there; on preventing revisionism Mao, Peng Zhen and Zhou Enlai breaking in, many places below held by the enemy; Mao: "我看我们这个国家有三分之一的权力不在我们手里"); [[w.dikotter-cultural-revolution]], 22 n.25 (Liu: could revisionism appear in China? Mao: it has already appeared, Baiyin; a third of the power not in our hands; Liu: the problems at the top; the Funing peasants'' saying; Mao: if a revisionist centre appears, we will have to stop it); [[w.pu-weihua-zalan-jiu-shijie]], 53 n.73 (Mao at the Central Work Conference: "one divides into two" is dialectics; "two combine into one", I''m afraid, is revisionism, class conciliation); [[w.pu-weihua-zalan-jiu-shijie]], 83 n.8 (Mao at the Central Work Conference: pass it down to the counties; what to do if a Khrushchev appears, if China has a revisionist Center; the provincial committees to resist a revisionist Center; with such a Center "a province can rebel, can be independent"); [[w.zhu-de-nianpu-xinbian]], III, 1910 (June 8, 1964; Zhu De 朱德 at the small meeting Mao Zedong 毛泽东 presides over, of some members of the Politburo 中共中央政治局 and the first secretaries of the regional bureaus 中央局; Mao says a third of the country''s power is not in our hands but the enemy''s). Made public: 1996. Check: the Wengao prints this talk from *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967), which Mao checked before it came out ([[w.jianguo-yilai-mao-zedong]], XVII, 261 n.1); if that printing was open, it was made public in 1967, not 1996. To check: [[w.jin-1949-1989-niande-zhongguo]], 565 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 395 n.89); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1116 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 403 n.27b); Mao Zedong 毛泽东, speech at the Central Work Conference 中央工作会议, June 8, 1964 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.2); Mao Zedong 毛泽东, speech at the enlarged Politburo Standing Committee 中共中央政治局常委扩大会议, June 8, 1964 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.51); Song Renqiong 宋任穷, report on a village party branch''s training of successors, May 13, 1964 (printed for the Central Work Conference May 18) (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.1); Luo Pinghan 羅平漢, *"Wenge" qianye de Zhongguo* 《「文革」前夜的中國》 (Renmin chubanshe, 2007), 257 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 98 n.144); Yang Shengqun 楊勝群 and Tian Songnian 田松年, 〈「文革」前意識形態領域的大批判運動真相〉, in [[w.zhongguo-gongchandang-zhongda-shishi]], IV, 1886 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 53 n.73). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Peng Zhen, Kang Sheng, Tao Zhu, Li Xuefeng, Chen Boda.'
