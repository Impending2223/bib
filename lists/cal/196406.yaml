  - id: cal.1964-06-14.elections-1964-johnson
    when: June 14
    date: '1964-06-14'
    thread: elections-1964-johnson
    c: 'Afternoon. Another talk with Mrs. Johnson: Johnson faces the next five months wishing "there were some honorable way out of it," by her account; Vietnam, Laos and Cyprus, and the turmoil if the civil rights bill passes, worse if it fails. She: "caught on this pinpoint in history, what exit is there?"'
