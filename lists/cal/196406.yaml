    c: 'Zhou receives the Argentine parliamentary delegation under Ferreyra. On Western capital, technology and experts: China took the Soviet lesson, stresses self-reliance for an independent socialist economy; welcomes foreign experts who truly want to help, and where they are withdrawn does the work itself; industry, adjusted, has grown, many products and projects date from after 1960. On the United States: China opposes its aggression, its holding of Taiwan and the Seventh Fleet, yet negotiates; eight years of Warsaw talks without result; the U.S. wants China to legalize its seizure of Taiwan and make it a separate unit, for which it would recognize Peking and restore its U.N. seat; absolutely impossible, unjust.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 652–53 (June 30, 1964); [[w.zhou-enlai-waijiao-huodong]], 412 (June 30, 1964; 上午11时, 人民大会堂福建厅); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 347 (June 30, 1964; Zhou receives all the members of the Argentine parliamentary delegation led by Dr. Ferreyra (费雷拉) and his deputy Mechetti Martínez (梅切蒂·马丁内斯); Zhou says on Sino-American relations that the two ambassadors have talked eight years at Warsaw with no result: the first, China asks the U.S. to agree, on the five principles, to a principled agreement on peaceful coexistence, which it always refuses; the second, the U.S. will not withdraw its armed forces from Taiwan and the Taiwan Strait before concrete talks, wanting China to recognize its illegal seizure of Taiwan and the making of Taiwan an independent unit, which would be unjust; and if China agreed, the U.S. could at once recognize and restore its lawful place in the United Nations, which is quite impossible). Names: Zhou Enlai, Ferreyra.'
