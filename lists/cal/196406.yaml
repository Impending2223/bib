  - id: cal.1964-06-01.court
    when: June 1
    date: '1964-06-01'
    thread: court
    also: [alabama, civil-rights-organizations]
    c: '*NAACP v. Alabama ex rel. Flowers*, [377 U.S. 288](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377288/usrep377288.pdf). The NAACP, barred from Alabama by a State court''s order of June 1, 1956, before the Court a fourth time. The judgment ousting it reversed; the Alabama Supreme Court to have the injunction vacated and the Association let qualify to do business. Harlan for the Court.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.powe-warren-court-and-american]]; [[w.wilkins-standing-fast]].'
  - id: cal.1964-06-01.antisubversion-wa
    when: June 1
    date: '1964-06-01'
    thread: antisubversion
    also: [court, students]
    c: '*Baggett v. Bullitt*, [377 U.S. 360](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377360/usrep377360.pdf): Washington''s oaths, the teachers'' of 1931 and the State employees'' of 1955 under its Subversive Activities Act, void for vagueness; brought by faculty, staff and students of the University of Washington. White for the Court, 7–2; Clark and Harlan dissent.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
    tags: [state:wa]
  - id: cal.1964-06-01.middle-east
    when: June 1–2
    date: '1964-06-01'
    thread: middle-east
    c: 'Eshkol at the White House. Johnson: the United States is and will remain interested in Israel''s security. Tanks: Johnson to speak to Erhard. Joint statement, June 2.'
    n: 'Remarks of Welcome at the White House to Prime Minister Eshkol of Israel, [1963–64 Pub. Papers 731](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=815); Toasts of the President and Prime Minister Eshkol, [1963–64 Pub. Papers 732](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=816) (June 1, 1964); Joint Statement Following Discussions With the Prime Minister of Israel, [1963–64 Pub. Papers 740](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=824) (June 2, 1964). FRUS 1964–68, XVIII, docs. [65](https://history.state.gov/historicaldocuments/frus1964-68v18/d65), [67](https://history.state.gov/historicaldocuments/frus1964-68v18/d67). To check: [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-lyndon-b-johnson-and]]. Names: Eshkol, Erhard.'
    tags: [name:eshkol-levi, name:johnson-lyndon-b, name:erhard-ludwig]
  - id: cal.1964-06-01.vietnam-congress
    when: June 1
    date: '1964-06-01'
    thread: vietnam-congress
    c: '2:48 p.m., Smathers to Johnson by telephone: no one he talks to in Congress thinks "we ought to fight a war in that area of the world"; committing more "has got everybody really worried."'
    n: '[Johnson and Smathers, 2:48 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-smathers-june-1-1964), Tape WH6406.01, Citations #3602–3604 (Miller Center; not heard here: millercenter.org fails TLS verification from this environment). [[w.dallek-flawed-giant]], 145. Names: Smathers, Johnson.'
