licans 27 for, 6 against, Goldwater among them; not Byrd''s speech); [[w.johnson-white-house-diary]], 165–66 (June 11: "Yesterday the Senate had cleared the way for a vote on the Civil Rights Bill, by invoking cloture, with about four votes to spare"; not the count, Byrd or Dirksen); [[w.albert-little-giant-1990]], 286 (the Senate votes cloture, 71 to 29, four above two-thirds, after a three-month southern filibuster; not the day or the party divisions); [[w.risen-bill-of-the-century]], 224–25, 227–29 (Morton''s amendment, jury trials for all criminal contempt but under Title I, adopted Tuesday 51 to 48, 224–25; cloture, 71 to 29, 44 Democrats and 27 Republicans for, 23 and 6 against, the first on a civil rights measure; Byrd''s fourteen hours thirteen minutes; Dirksen, up at 5 a.m. at Broad Run, his speech, cut off by Metcalf; Engle wheeled in, his finger to his eye, Kuchel''s request; all 100 senators present; 534 hours 1 minute 51 seconds of debate in seventy-five days; O''Brien: "like the home team winning the Super Bowl"); [[w.purdum-idea-whose-time-has-2014]], 297–303 (Morton''s amendment adopted the day before, 51–48, jury trials in criminal contempt but for Title I (297–98); Byrd''s speech, fourteen hours and thirteen minutes; Dirksen: "Stronger than all the armies is an idea whose time has come"; Engle''s vote; Williams''s the sixty-seventh; 71–29; not the party counts nor 1917 (the notes: 110 Cong. Rec. 13308–19)). The Senate sat from 10 a.m. (its order of June 8) to 5:15 p.m.: [Daily Digest, D263](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=261), [D267](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=265). Check: Solberg dates it June 9 (226). Humphrey''s count that morning: [[cal.1964-06-10.civil-rights-bill-6]]. To check: [[w.finley-delaying-the-dream]]; [[w.macneil-dirksen]]. See [[cal.1964-02-10.civil-rights-bill]]. Names: Byrd, Dirksen, Morton. Check: the page.'
