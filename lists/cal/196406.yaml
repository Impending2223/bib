  - id: cal.1964-06-13.vietnam-3
    when: June 13
    date: '1964-06-13'
    thread: vietnam
    c: Valenti and Bundy by telephone, later that day. Robert Kennedy has written Johnson that he will go to Vietnam as ambassador if wanted; Johnson has asked Rusk, McNamara, Bundy and Kennedy for three names, and each has put his own first. Kennedy has also named Terry Sanford, whom McNamara does not favor. Bundy's choice is Ball; Valenti thinks Ball too valuable in Washington. They talk of a congressional resolution on Vietnam; Valenti does not think the time right; Bundy has working papers for him to take to Johnson.
