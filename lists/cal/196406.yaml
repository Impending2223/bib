  - id: cal.1964-06-01.vietnam-congress
    when: June 1
    date: '1964-06-01'
    time: 1964-06-01T18:48Z
    thread: vietnam-congress
    also: [desegregation-public-places]
    c: '2:48 p.m., Smathers to Johnson by telephone: no one he talks to in Congress thinks "we ought to fight a war in that area of the world"; committing more "has got everybody really worried." On St. Augustine, Johnson: "They''re giving me unshirted hell on [St. Augustine]. ... He''s demanding we go in." Smathers: the shots into King''s house "a damn plant"; St. Augustine "a typically rural place"; no marshals or troops. Johnson then asks Governor Bryant for assurances of order.'
    n: '[Johnson and Smathers, 2:48 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-smathers-june-1-1964), Tape WH6406.01, Citations #3602–3604 (Miller Center; not heard here: millercenter.org fails TLS verification from this environment). [[w.dallek-flawed-giant]], 145; [[w.branch-pillar-of-fire]], 326; [[w.kotz-judgment-days]], 147 (St. Augustine; Bryant). To check: Tape WH6406.01, PNO 3–4 (cited by [[w.kotz-judgment-days]], 147 n.111). See [[cal.1964-05-29.desegregation-public-places]]. Names: Smathers, Johnson, Martin Luther King.'
    src:
