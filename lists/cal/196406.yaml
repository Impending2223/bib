  - id: cal.1964-06-11.china-leadership
    when: June 11
    date: '1964-06-11'
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao presides over a plenary session of the Central Work Conference, Hall of the People, Room 118, afternoon; Liu Shaoqi reports on the struggle against modern revisionism. Liu: if the Soviet Union went revisionist in 40 years and Lenin''s party was transformed, will China''s? Mao: it will if no attention is paid; and may anyhow; it would be a matter of months, years, decades, then a turn back. Prepare now for the day. Mass movements against it, the five-antis and four-cleans; theory and the arts. Do not arrest, expel or kill at random. "The sky may darken."'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 11, 1964; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 593 (June 11, 1964; Liu reports at the Central Work Conference on the struggle against modern revisionism: the development of the international situation since the conference of last September, the present line of that struggle and how to guard against revisionism and the restoration of capitalism at home; mass movements, "four clean-ups" and "five-antis," are to be launched regularly across the country to prevent revisionism); [[w.yang-shangkun-riji]], II, 383 (June 11, 1964; 4:10 to 7 p.m.; Yang there; the room not named); [[w.deng-xiaoping-nianpu-1904]], III, 1815–1816 (June 11, 1964; afternoon, 下午; Deng at the plenary of the Central Work Conference Mao presides over, which hears Liu Shaoqi''s report on the struggle against modern revisionism); [[w.mao-zedong-zhuan]], VI, ch. 73 (June 11 Liu reports on the struggle against modern revisionism at the Central Work Conference; Mao''s short speech after it: much cannot be foreseen; the sky may darken, but with faith (n.3)). [[w.jian-zhou-enlai]], 490 (Liu on fighting revisionism; could China turn revisionist? Mao: "It is possible"); [[w.peng-zhen-nianpu-1902]], IV, 337 (June 11, 1964, afternoon; Peng Zhen at the work conference''s plenary, Mao presiding, hearing Liu Shaoqi''s report on the struggle against revisionism); [[w.zhu-de-nianpu-xinbian]], III, 1910 (June 11, 1964; Zhu De 朱德 at the plenary session, which hears Liu Shaoqi 刘少奇 on the struggle against modern revisionism; the report: mass movements, "four clean-ups" 四清 and "five-antis" 五反, to be waged regularly across the country, so as to prevent revisionism). Made public: 1996. To check: Central Work Conference 中央工作会议, record 记录, June 11, 1964 (Liu Shaoqi''s report; Mao''s remarks) (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.3). Names: Mao Zedong, Liu Shaoqi.'
