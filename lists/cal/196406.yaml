    c: 'After the meeting on foreign aid, Johnson to Valenti: "I keep hitting hard because I know this honeymoon won''t last. Every day I lose a little more political capital." The critics and snipers will move in, and "We have to get all we can, now, before the roof comes down." By Valenti''s account.'
