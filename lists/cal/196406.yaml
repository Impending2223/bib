  - id: cal.1964-06-02.alabama
    when: June 2
    date: '1964-06-02'
    thread: alabama
    also: [elections-1964]
    c: 'Alabama''s second primary. The nine Democratic nominees for Representative on one statewide ballot, the eight highest to be the party''s nominees: Carl Elliott ninth, 316,775, 5,098 votes short. Connor nominated president of the Public Service Commission, 225,676 to 204,418, 52.5 percent. Aug. 19, the legislature, in special session, draws eight districts for November (Act No. 21).'
    n: '[*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), 524](https://archive.org/details/alabama-official-statistical-register-1967/page/n525)–[526](https://archive.org/details/alabama-official-statistical-register-1967/page/n527), [530](https://archive.org/details/alabama-official-statistical-register-1967/page/n531) (the nominees), [260](https://archive.org/details/alabama-official-statistical-register-1967/page/n261) (Act No. 21). Encyclopedia of Alabama, ["Carl Elliott"](https://encyclopediaofalabama.org/article/carl-elliott/). See [[cal.1964-05-05.alabama]]. Names: Elliott, Connor.'
    tags: [name:elliott-carl-a, name:connor-eugene]
  - id: cal.1964-06-02.governors-mt
    when: June 2
    date: '1964-06-02'
    thread: governors
    also: [elections-1964]
    c: 'Montana''s primary. Democratic, for governor: Renne, once president of Montana State College, over Kuchera, 71,967 to 56,710, 55.9 percent. Republican: Governor Babcock unopposed.'
    n: 'Votes: [Wikipedia, "1964 Montana gubernatorial election"](https://en.wikipedia.org/wiki/1964_Montana_gubernatorial_election); Check: [Mont. *Report of the Official Canvass of the Vote Cast at the Primary Election, June 2, 1964*](https://archive.org/details/primaryofficial1964montrich). To check: [[w.malone-montana]]. Names: Tim Babcock, Renne, Kuchera.'
    tags: [state:mt, name:renne-roland-r, name:kuchera-mike, name:babcock-tim-m]
  - id: cal.1964-06-02.elections-1964-ca
    when: June 2
    date: '1964-06-02'
    thread: elections-1964
    also: [states-and-cities]
    c: 'California''s Senate primaries. Democratic: Salinger, the President''s press secretary, over Cranston, State Controller, endorsed by the California Democratic Council, 1,177,517 to 1,037,748, 44.3 percent; Engle, who withdrew Apr. 28, 119,967. Republican: Murphy over Leland Kaiser, 1,121,591 to 689,323, 54.1 percent of the three.'
    n: 'Votes: [Cal. *Statement of Vote*, June 2, 1964, p. 8](https://archive.org/details/castatem196264cali/page/n127). Check: Engle''s percentage. To check: [[w.hill-dancing-bear]]; [[w.schuparra-triumph-of-the-right]]. See [[cal.1964-06-02.elections-1964]]. Names: Salinger, Engle, Cranston, Kaiser, Murphy.'
    tags: [state:ca, name:salinger-pierre, name:cranston-alan, name:engle-clair, name:murphy-george, name:kaiser-leland]
  - id: cal.1964-06-02.governors-sd
    when: June 2
    date: '1964-06-02'
    thread: governors
    also: [elections-1964]
    c: 'South Dakota, governor; Governor Gubbrud not running. Republican primary: Boe over Sigurd Anderson, governor 1951–55, 50,335 to 43,809, 53.5 percent. Democratic: Lindley over Tice, 27,071 to 14,051, 65.8 percent.'
    n: '[*Official Election Returns by Counties, Primary Election, June 2, 1964*](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1964P.pdf); figures from [Wikipedia, "1964 South Dakota gubernatorial election"](https://en.wikipedia.org/wiki/1964_South_Dakota_gubernatorial_election) (Check: the scan). To check: [[w.peirce-great-plains-states-of]]. Names: Gubbrud, Boe, Sigurd Anderson, Lindley, Tice.'
    tags: [state:sd, name:gubbrud-archie, name:boe-nils-a, name:anderson-sigurd, name:lindley-john-f, name:tice-merton-b]
  - id: cal.1964-06-03.japan-and-korea
    when: June 3
    date: '1964-06-03'
    thread: japan-and-korea-normalization
    also: [japan]
    c: 'Seoul. Students in the streets against the settlement with Japan since Mar. 24; June 3, rioting. Park declares martial law in the capital; the U.N. commander, asked, releases two divisions. Berger: martial law no answer; Korean leaders want Kim Chong-p''il out.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [6](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d6) (Mar. 25), [11](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d11), [13](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d13), [14](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d14), [15](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d15), [16](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d16), [339](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d339). To check: [[w.lee-troubled-peace]]; [[w.cha-alignment-despite-antagonism]]; [[w.park-chung-hee-era]]. See [[cal.1962-10-29.japan-and-korea]]. Names: Park, Berger, Kim Chong-p''il.'
    tags: [name:park-chung-hee, name:berger-samuel-d, name:kim-chong-pil]
  - id: cal.1964-06-03.elections-1964
    when: June 3
    date: '1964-06-03'
    thread: elections-1964
    c: 'Rockefeller''s staff on the California loss: the position "in essence the same as it was after New Hampshire—a holding operation." His delegates to go to the candidate likeliest to block Goldwater; his bid a favorite son''s, "generally against the Goldwater candidacy."'
    n: '[[w.young-two-suns-of-the]], 92. See [[cal.1964-06-02.elections-1964]]. Names: Rockefeller, Goldwater.'
    src:
      c: 4460e36a
      rows:
        - 'w.young-two-suns-of-the 92: all'
    tags: [name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1964-06-04.elections-1964
    when: June 4
    date: '1964-06-04'
    thread: elections-1964
    also: [civil-rights-organizations]
    c: 'Rockefeller''s campaign leaders meet again. Jackie Robinson: Negroes "will work as hard as possible to defeat Goldwater." He is asked to wait until he has spoken with Rockefeller.'
    n: '[[w.young-two-suns-of-the]], 92–93. See [[cal.1964-06-02.elections-1964]]. Names: Robinson, Goldwater, Rockefeller.'
