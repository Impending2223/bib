  - id: cal.1968-08-01.elections-1968-chicago
    when: Aug. 1
    date: '1968-08-01'
    thread: elections-1968-chicago
    c: 'The White House, noon. Mayor Daley lunches with Johnson, with Mrs. Johnson and Lynda sitting in. Daley "was giving Lyndon a sales talk about coming to Chicago": the Democrats want to give him a rousing welcome. Johnson gives "little encouragement," stopping "just short of a positive ''No''." Mrs. Johnson says she will do whatever he wants and has "no enthusiasm for going." On the war, Mrs. Johnson sees, Daley "simply wants out"; Johnson cites Korea and tells of the candidates making "unofficial offers" while he bargains for peace, with his story of selling Daley a house for $20,000 and Mrs. Johnson and Lynda Bird following him to the door at $18,000 and $16,000: "What would you do?"'
    n: '[[w.johnson-white-house-diary]], 697–98 (Lady Bird Johnson''s account). Daley''s attitude is Mrs. Johnson''s reading ("the Mayor''s attitude spoke eloquently of the growing concern"). They had been listening to a tape from Charles Robb in Vietnam. Names: Daley, Johnson, Lady Bird Johnson.'
    tags: [name:daley-richard-j, name:johnson-lyndon-b, name:johnson-lady-bird, city:chicago]
