        - 'via w.cosmas-joint-chiefs-of-staff 217 n.48: A-B'
    tags: [place:tay-ninh]
  - id: cal.1968-08-18.elections-1968-chicago
    when: Aug. 18
    date: '1968-08-18'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago, Lincoln Park. The first demonstrators arrive, the Yippies'' headquarters at the park''s south end. The Mobilization''s marshals'' training opens, Rennie Davis and Hayden there: nonviolence, the police, the demonstrators'' rights. The beach patrol begins clearing the park each night at the 11 p.m. curfew.'
    n: '[[w.rights-in-conflict-convention-week]], 3, 129–30, 138. Police undercover men watch; police intelligence asked to keep the park under surveillance (130, 108). See [[cal.1967-12-18.war-opposition]]. Names: Davis, Hayden.'
    tags: [name:davis-rennie, name:hayden-tom, state:il, city:chicago]
  - id: cal.1968-08-18.war-opposition
    when: Aug. 18
    date: '1968-08-18'
    thread: war-opposition
    also: [elections-1968-chicago]
    c: 'Chicago. The Mobilization''s leaders meet, most of those from out of town in for the week: no permits expected.'
    n: '[[w.rights-in-conflict-convention-week]], 65. See [[cal.1967-12-18.war-opposition]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-19.vietnam-paris
    when: Aug. 19
    date: '1968-08-19'
    thread: vietnam-paris
    c: 'Detroit. Johnson to the Veterans of Foreign Wars: "This administration does not intend to move further until it has good reason to believe that the other side intends seriously to join us in deescalating the war."'
