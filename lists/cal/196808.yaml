277, Reagan 182; Morton''s hard count 666; Reagan with Mississippi''s delegates in his trailer); [[w.bernstein-guns-or-butter]], 507–08 (Thurmond won over; Nixon 692, Rockefeller 277, Reagan 182); [[w.smith-on-his-own-terms]], 537 (Thurmond, with Tower, in the restive delegations, Florida above all under its unit rule; Callaway: "Strom would take delegates on board one of those delightful boats docked off Miami ... He''d make his pitch one-on-one"); [[w.goldberg-barry-goldwater]], 252 (Nixon personally calls on Goldwater, Tower and Thurmond to calm the conservatives; Reagan held to scattered gains among the Southern delegations). Order: the ballot after the nominations of the fourth session and Rockefeller''s last press conference. To check: [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.nelson-resilient-america]]. See [[cal.1968-08-05.elections-1968]]. Names: Thurmond, Nixon, Rockefeller, Reagan, Rhodes, Romney, Case.'
