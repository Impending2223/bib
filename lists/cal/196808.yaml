    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance, testing-missile-talks]
    c: 'Czechoslovakia invaded the night of Aug. 20–21 by the forces of the Soviet Union, Poland, Hungary and Bulgaria, some 250,000 men; East Germany''s held back. Dubček and others taken to Moscow. Dobrynin to Johnson in the Cabinet Room, 8:15 p.m.: Moscow''s message that the Czechoslovak government asked for help. The National Security Council, 10:15 p.m.: the visit to the Soviet Union not to be announced. Johnson to Nixon, 11:22 p.m. Aug. 21, broadcast: "The Soviet Union and its allies have invaded a defenseless country to stamp out a resurgence of ordinary human freedom"; Ball to the Security Council.'
    n: 'Statement by the President Calling on the Warsaw Pact Allies To Withdraw From Czechoslovakia, [1968–69 Pub. Papers 905](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=215) (Aug. 21, 1968). FRUS 1964–68, XVII, docs. [80](https://history.state.gov/historicaldocuments/frus1964-68v17/d80), [81](https://history.state.gov/historicaldocuments/frus1964-68v17/d81), [82](https://history.state.gov/historicaldocuments/frus1964-68v17/d82); XIV, doc. [289](https://history.state.gov/historicaldocuments/frus1964-68v14/d289). [Johnson and Nixon, 11:22 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-august-21-1968), Conversation WH6808-01-13310 (Miller Center). [[w.longley-lbjs-1968]], 188–93 (Dobrynin, 8 p.m.; the Council at 10:15; Johnson to Nixon). Made public: FRUS 1964–68, XVII (1996). [[w.drea-mcnamara-clifford-and-the-2011]], 497–498 (the invasion; Dobrynin with Johnson; the NSC; no visit announced); [[w.poole-joint-chiefs-of-staff-2012]], 88 (the invasion); [[w.schwartz-lyndon-johnson-and-europe]], 216–18 (the invasion; Dobrynin with Johnson); [[w.johnson-vantage-point]], 487–89 (Dobrynin''s message; the call to Nixon). To check: [[w.valenta-soviet-intervention-in-czechoslovakia]]; [[w.dawisha-kremlin-and-the-prague]]; [[w.williams-prague-spring-and-its]]; [[w.dobrynin-in-confidence]]; [[w.zubok-failed-empire]]; [[w.garthoff-detente-and-confrontation]]. See [[cal.1968-07-15.soviet-union]]. Names: Dubček, Dobrynin, Nixon, Ball, Johnson. Check: Drea has East German contingents among the invaders (497).'
