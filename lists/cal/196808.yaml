    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: Chicago, Lincoln Park, Tuesday night. The clergy's vigil, a wooden cross, the barricade put up again; police mass at 11:30 p.m. After midnight tear gas at the cross, then a sanitation truck's gas sprayer; the crowd driven into Clark Street and Old Town; police smash the windows of cars parked there.
    n: '[[w.rights-in-conflict-convention-week]], 191–204. See [[cal.1968-08-22.elections-1968]].'
