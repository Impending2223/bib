    when: Aug. 10
    date: '1968-08-10'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago. Rennie Davis with Stahl: the talks dragging; he asks to meet Daley. Stahl: Daley does not decide park or parade permits; the Park District and the Department of Streets do.'
    n: '[[w.rights-in-conflict-convention-week]], 64. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis, Daley.'
    tags: [name:davis-rennie, name:daley-richard-j, state:il, city:chicago]
  - id: cal.1968-08-11.opinion
    when: Aug. 11
    date: '1968-08-11'
    thread: opinion
    also: [vietnam, elections-1968-polls]
    c: 'Gallup, July 18–23: a candidate who said more of the fighting should be turned over to the South Vietnamese, and some American troops withdrawn as of Jan. 1: would vote for him 66 percent, against 18. Republicans 65 for; Democrats 66; independents 67. McCarthy''s supporters 70; Humphrey''s 68; Nixon''s 66.'
    n: '[[w.gallup-poll]], III, 2153. Names: McCarthy, Humphrey, Nixon.'
    tags: [name:mccarthy-eugene-j, name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1968-08-11.mississippi
    when: Aug. 11
    date: '1968-08-11'
    thread: mississippi
    also: [elections-1968]
    c: 'Jackson, the Masonic Temple. The Loyal Democrats'' State convention, Aaron Henry in the chair: the Young Democrats, the State NAACP, the Freedom Democrats, the Negro teachers'' association, the Prince Hall Masons, the AFL-CIO. An at-large slate agreed beforehand; Charles Evers, nominated from the floor, elected national committeeman over Robert Clark.'
    n: '[[w.dittmer-local-people]], 420–22. See [[cal.1968-07-02.elections-1968-state-conventions]]. Names: Henry, Charles Evers, Clark.'
    src:
      c: 4d22e2c9
      rows:
        - 'w.dittmer-local-people 420–22: all'
    tags: [state:ms, city:jackson, name:henry-aaron, name:evers-charles, name:clark-robert-g-jr]
  - id: cal.1968-08-12.consumers
    when: Aug. 12
    date: '1968-08-12'
    thread: consumers
    c: 'Natural Gas Pipeline Safety Act signed, [82 Stat. 720](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg720.pdf): the Secretary of Transportation to set safety standards for the pipeline transportation of gas, the States to enforce them on intrastate lines by agreement. Johnson: 800,000 miles of pipeline; a failure about every five days; seventeen killed at Natchitoches, La., in 1965. The House had passed it, [351–14](https://voteview.com/rollcall/RH0900369), July 2.'
    n: 'Statement by the President Upon Signing the Natural Gas Pipeline Safety Act of 1968, [1968–69 Pub. Papers 882](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=192) (Aug. 13, 1968). Statute (K–J Cong. II.J.2). See [[cal.1967-11-20.consumers]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-12.elections-1968
    when: Aug. 12
    date: '1968-08-12'
    thread: elections-1968
    also: [elections-1968-chicago]
    c: 'McCarthy, at a press conference: his supporters to stay away from Chicago in convention week, against "unintended violence"; rallies in their own communities instead. Telegrams to his headquarters.'
    n: '[[w.rights-in-conflict-convention-week]], 54 (reported in touch with Daley on threats of disruption and plots against his life). Names: McCarthy.'
    tags: [name:mccarthy-eugene-j]
  - id: cal.1968-08-12.elections-1968-chicago
    when: Aug. 12
    date: '1968-08-12'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago. The Mobilization''s Administrative Committee with Stahl, Baugher and a city lawyer: no decision. Would they march without a permit? The heads of the police, the streets and the Park District absent.'
    n: '[[w.rights-in-conflict-convention-week]], 64–65. See [[cal.1968-03-26.elections-1968-chicago]].'
    tags: [state:il, city:chicago]
