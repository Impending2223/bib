    c: 'The Credentials Committee, 96 members, closed: Mrs. Rohm''s appeal 32–31 in her favor; Orvas Beerman, its chairman, votes for Gross, and it fails, 32–32. Barrington D. Parker, for the Negroes of Florida and Louisiana: their complaints too late, not filed with the Contests Committee.'
