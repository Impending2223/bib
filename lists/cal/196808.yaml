  - id: cal.1968-08-01.cities-and-housing
    when: Aug. 1
    date: '1968-08-01'
    time: 1968-08-01T15:34Z
    thread: cities-and-housing
    c: 'Housing and Urban Development Act signed, [82 Stat. 476](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg476.pdf), on the lawn of HUD''s new building: a goal of 26 million homes in ten years, 6 million of them for low- and moderate-income families; interest subsidies for home ownership (section 235) and rental housing (section 236); a National Housing Partnership of private investors; new communities; urban renewal and public housing extended. Johnson: "the Magna Carta to liberate our cities." Check: the goal''s figures, in the act''s Title XVI.'
    n: 'Remarks Upon Signing the Housing and Urban Development Act of 1968, [1968–69 Pub. Papers 865](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=175) (Aug. 1, 1968). Statute (K–J Cong. II.J.2). [[w.dallek-flawed-giant]], 552 (Aug. 1, Johnson hails the HUD Act of 1968 as "the Magna Carta to liberate our cities"; not the signing, the place or the act''s contents). See [[cal.1968-07-10.cities-and-housing]]. Names: Weaver, Sparkman, Patman, Johnson.'
    src:
      c: 5cd81c47
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=175: all'
        - 'https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg476.pdf: A'
        - 'w.dallek-flawed-giant 552: F'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:sparkman-john, name:patman-wright]
  - id: cal.1968-08-01.immigration
    when: Aug. 1
