    c: Chicago, Lincoln Park, Sunday night. Police at the fieldhouse, taunted and stoned, charge the crowd. The final warning read through the park; most leave about 11 p.m. A march down Michigan Avenue stopped at the river bridge. At least a thousand regroup in the park; after midnight some 450 police in skirmish lines, the Task Forces men with tear gas, drive them into Clark Street and Old Town, clubbing demonstrators, onlookers and newsmen.
