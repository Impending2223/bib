    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: 'Chicago, Grant Park, across from the Hilton. Marchers from Lincoln Park and the Coliseum; some 3,000 facing the police at 12:21 a.m. At 1:35 a.m. the deputy superintendent: they may stay the night if peaceful, east of Michigan Avenue. About 3 a.m. 600 of the Guard relieve the police, for the first time in the week.'
    n: '[[w.rights-in-conflict-convention-week]], 206–14 (the 700 police at the Hilton on twelve-hour shifts since Saturday, on duty 15 hours). See [[cal.1968-08-22.elections-1968]].'
