    c: 'Miami Beach. Thurmond and the Southern delegations hold for Nixon (Check). Nixon nominated on the first ballot, early Aug. 8: 692 votes, 667 needed; Rockefeller 277, Reagan 182, Rhodes 55, Romney 50. After the roll, the delegations change: Nixon 1,238, Rockefeller 93, Reagan 2. New York''s and Kentucky''s motions to make it unanimous not recognized. The rules suspended by voice vote, on California''s motion, for Reagan to speak; he moves that the convention "declare itself as unanimously and united behind the candidate Richard Nixon." The chair thanks him. No vote put. In the roll, Bergen County''s delegates break from New Jersey''s favorite son, Case, for Nixon: by Auspitz''s account, of the Ripon members in Rockefeller''s delegate count, the turn.'
