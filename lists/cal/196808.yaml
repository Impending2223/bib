  - id: cal.1968-08-24.elections-1968
    when: Aug. 24
    date: '1968-08-24'
    thread: elections-1968
    c: 'Boggs called from Chicago to the White House, on the Czech crisis by the announcement. Westmoreland reads him Abrams''s cable of Aug. 23: a halt would bring "a several-fold increase in U.S. and allied casualties in I Corps." He takes it back to the platform committee.'
    n: 'Abrams to Rostow, Aug. 23, 1968, MAC 11409, [FRUS 1964–68, VI: Vietnam, January–August 1968, doc. 337](https://history.state.gov/historicaldocuments/frus1964-68v06/d337) (the cable; its words, which put the quotation right). [[w.dallek-flawed-giant]], 575. [[w.longley-lbjs-1968]], 214 (Boggs, with Randolph, briefed by Westmoreland). To check: "Summary of General Abrams'' View," Aug. 23, 1968, NSF: Country: Vietnam, LBJ Library; Jones''s memorandum, Aug. 24, 1968, WHCF: EX/PL1, LBJ Library; Bromley Smith''s "Situation Report on Vietnam Plank," NSF: Country: Vietnam, LBJ Library (cited by [[w.dallek-flawed-giant]], 575). See [[cal.1968-07-09.elections-1968]]. Names: Boggs, Westmoreland, Abrams, Johnson.'
    src:
      c: a4b0c4dd
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d337: B'
        - 'w.dallek-flawed-giant 575: all'
        - 'via w.dallek-flawed-giant 575 n.70a: B'
        - 'via w.dallek-flawed-giant 575 n.71a: A, C'
        - 'via w.dallek-flawed-giant 575 n.71b: C'
        - 'w.longley-lbjs-1968 214: A-C'
    tags: [name:boggs-hale, name:westmoreland-william, name:abrams-creighton, name:johnson-lyndon-b]
  - id: cal.1968-08-24.elections-1968-chicago
    when: Aug. 24
    date: '1968-08-24'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: 'Chicago, Lincoln Park. The police command post opens. More than 2,000 in the park by 5 p.m. Ginsberg, Hoffman, Rubin, Sanders and Krassner write statements: they will leave when told. About 11 p.m. some 60 police clear the park; about 200 pushed into Clark Street and down Wells; 11 arrested.'
    n: '[[w.rights-in-conflict-convention-week]], 134–39. See [[cal.1968-08-22.elections-1968]]. Names: Hoffman, Rubin.'
    tags: [name:hoffman-abbie, name:rubin-jerry, state:il, city:chicago]
  - id: cal.1968-08-25.opinion
    when: Aug. 25
    date: '1968-08-25'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 7–12: the party more likely to keep the United States out of World War III: Republican 41 percent, Democratic 23, no difference 19.'
    n: '[[w.gallup-poll]], III, 2156–57.'
  - id: cal.1968-08-25.elections-1968-chicago
    when: Aug. 25
    date: '1968-08-25'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: Chicago, Lincoln Park, Sunday night. Police at the fieldhouse, taunted and stoned, charge the crowd. The final warning read through the park; most leave about 11 p.m. A march down Michigan Avenue stopped at the river bridge. At least a thousand regroup in the park; after midnight some 450 police in skirmish lines, the Task Forces men with tear gas, drive them into Clark Street and Old Town, clubbing demonstrators, onlookers and newsmen.
    n: '[[w.rights-in-conflict-convention-week]], 146–58. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-25.elections-1968-chicago-2
    when: Aug. 25
    date: '1968-08-25'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: Chicago. From Lincoln Park at about 1:30 p.m., a march to the delegates' hotels, the Sherman House first, past the Palmer House, with the police, peaceful; into Grant Park about 3 p.m. Back in Lincoln Park, 3,000 to 5,000 for the music; the Yippies' truck stopped at 5:18 p.m.
    n: '[[w.rights-in-conflict-convention-week]], 140–43. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-26.soviet-union-czechoslovakia
    when: Aug. 26
    date: '1968-08-26'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: Moscow. Svoboda and Husák, then Dubček and the others, in talks from Aug. 23, sign the Moscow protocol; the troops stay (Check the day).
    n: 'See [[cal.1968-08-20.soviet-union]]. Names: Svoboda, Husák, Dubček.'
    tags: [name:svoboda-ludvik, name:husak-gustav, name:dubcek-alexander]
  - id: cal.1968-08-26.elections-1968
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    c: 'Democratic National Convention opens, Chicago, at the International Amphitheatre. The party''s primaries: map and returns below.'
    n: CQ Guide 6th (2010) 409–411. See [[cal.1968-03-12.elections-1968]].
    tags: [primaries:1968-D]
  - id: cal.1968-08-26.elections-1968-2
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    also: [voting-rights, mississippi, georgia]
    c: 'Chicago. Credentials, the committee under Hughes of New Jersey: Mississippi''s regular delegation unseated, the Loyal Democrats, Aaron Henry among them, seated; Georgia''s seats divided between Maddox''s regulars and Bond''s challengers; the Texas regulars under Connally and the Alabama regulars, with a loyalty pledge, seated (Check the votes).'
    n: '[Johnson, Murphy and Jones, 8:04 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-charles-murphy-and-jim-jones-august-26-1968), Conversation WH6808-01-13313 (Miller Center). FRUS 1964–68, VI, doc. [339](https://history.state.gov/historicaldocuments/frus1964-68v06/d339). Check: the convention''s *Official Proceedings*. [[w.dittmer-local-people]], 420–22 (Mississippi''s regulars unseated, the Loyalists seated). To check: [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]. See [[cal.1968-08-26.elections-1968]]. Names: Hughes, Henry, Maddox, Bond, Connally, Johnson.'
    src:
      c: 1dd346e4
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-charles-murphy-and-jim-jones-august-26-1968: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d339: all'
        - 'w.dittmer-local-people 420–22: A-B'
    tags: [name:hughes-richard-j, name:henry-aaron, name:maddox-lester, name:bond-julian, name:connally-john, name:murphy-charles-s, name:johnson-lyndon-b, state:ms, state:ga, state:tx, state:al]
  - id: cal.1968-08-26.elections-1968-chicago
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    also: [vietnam-paris]
    c: 'Chicago, the convention''s first day. Watson, sent by Johnson, to Humphrey: the plank on Vietnam Humphrey''s people worked out "doesn''t meet with the President''s approval"; "You must stay the course on Vietnam if you expect to be nominated." Humphrey to Johnson by telephone: Rusk and Rostow approved it. Johnson: "this plank just undercuts our whole policy." By Humphrey''s and Watson''s accounts.'
    n: '[[w.longley-lbjs-1968]], 212–13. To check: [[w.humphrey-education-of-a-public-1976]], 292; [[w.watson-chief-of-staff]], 296–99; [[w.witcover-year-the-dream-died]], 315; [Johnson and Watson, 10:39 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-marvin-watson-machine-noise-and-office), Conversation WH6808-02-13320 (Miller Center). See [[cal.1968-07-09.elections-1968]]. Names: Watson, Humphrey, Rusk, Rostow, Johnson.'
    src:
      c: 67731fc3
      rows:
        - 'w.longley-lbjs-1968 212–13: all'
    tags: [name:watson-w-marvin, name:humphrey-hubert-h, name:rusk-dean, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1968-08-26.elections-1968-chicago-2
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago, Lincoln Park, 11 a.m. The Yippies'' press conference: a telegram to U Thant, law and order broken down in Chicago, an "impartial observer" asked. The North Side Cooperative Ministry, in the afternoon: Chicago a "police state"; churches to lodge the protesters.'
    n: '[[w.rights-in-conflict-convention-week]], 159–60. See [[cal.1968-08-22.elections-1968]]. Names: Thant.'
    tags: [name:u-thant, state:il, city:chicago]
  - id: cal.1968-08-26.elections-1968-chicago-3
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago, Lincoln Park, 2:25 p.m. Hayden and Wolfe Lowenthal arrested: obstructing police, resisting arrest, disorderly conduct. Some 400 to 500, Rennie Davis leading, march to police headquarters, then to Grant Park. Hayden out on $1,000 bond that evening.'
    n: '[[w.rights-in-conflict-convention-week]], 160, 167 (the ABC crew filming the arrest struck, its lens smashed). See [[cal.1968-08-22.elections-1968]]. Names: Hayden, Davis.'
    tags: [name:hayden-tom, name:davis-rennie, state:il, city:chicago]
  - id: cal.1968-08-26.elections-1968-chicago-4
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: Chicago, Grant Park, about 5 p.m. Marchers climb the Logan statue, across from the Hilton, and drape it with Viet Cong and red flags; the police pull them down, a boy's arm broken; five officers report injuries. Some 1,000 in the crowd by 5:35.
    n: '[[w.rights-in-conflict-convention-week]], 163–66. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-26.elections-1968-chicago-5
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    also: [defense]
    c: 'Some 6,000 Army troops, trained for riot control, airlifted from Fort Hood, Tex., Fort Sill, Okla., and Fort Carson, Colo., to Glenview Naval Air Station, Ill., and Great Lakes Naval Training Station, Ill., with rifles, flame throwers and bazookas: Task Force III, the federal force if needed.'
    n: '[[w.rights-in-conflict-convention-week]], 3, 116. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il]
  - id: cal.1968-08-26.elections-1968-chicago-6
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: Chicago, Lincoln Park, Monday night. From 9 p.m. marches into Old Town; at 10:45 some 45 clergymen at Clark Street. A barricade of picnic tables and trash baskets, about 1,000 behind it. At 12:27 a.m. the Task Force's tear gas; by 12:38 the park empty. Clubbing in the streets of Old Town to 2 a.m., newsmen and residents among the struck.
    n: '[[w.rights-in-conflict-convention-week]], 167–83 (medics treated 24 that night; 15 police treated; Stokes of Cleveland among the crowd, calming it, 181). See [[cal.1968-08-22.elections-1968]].'
    tags: [name:stokes-carl-b, state:il, city:chicago]
  - id: cal.1968-08-26.press-and-broadcasting
    when: Aug. 26
    date: '1968-08-26'
    thread: press-and-broadcasting
    also: [elections-1968-chicago]
    c: Chicago. Newsmen beaten by the police on the North Side Monday night; that afternoon a TV reporter warned by two detectives, "the word is out to get newsmen."
    n: '[[w.rights-in-conflict-convention-week]], 308–17. Of 300 newsmen in the parks and streets in the week, 63 attacked by police; in 13 cases their equipment damaged (8). See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-27.elections-1968-chicago
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    c: 'Chicago. The unit rule abolished, and the rules committee''s minority report adopted: every Democrat a "full and timely opportunity" to take part in choosing the delegates of 1972 (Check the votes).'
    n: 'Check: the convention''s *Official Proceedings*. To check: [[w.shafer-quiet-revolution]]. See [[cal.1968-08-26.elections-1968]].'
  - id: cal.1968-08-27.elections-1968-ak
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968
    also: [war-opposition]
    c: 'Alaska''s primary, every party on one ballot. Democratic, for the Senate: Gravel, once Speaker of the State House, over Gruening, Senator since statehood, 17,971 to 16,015, 52.9 percent. Republican: Rasmuson, an Anchorage banker, over Stevens, 10,320 to 9,111, 53.1 percent.'
    n: 'Votes: [Alaska, *Official Returns by Election Precincts, Primary Election, August 27, 1968*, 7](https://www.elections.alaska.gov/Core/Archive/68PRIM/68prim.pdf#page=6) (statewide totals; persons voting 54,589), and [Wikipedia, "1968 United States Senate election in Alaska"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Alaska), alike. To check: [[w.gruening-many-battles]]; [[w.gravel-political-odyssey]]; [[w.naske-alaska]]. See [[cal.1966-11-08.governors-ak]]. Names: Gravel, Gruening, Rasmuson, Stevens.'
    tags: [state:ak, name:gravel-mike, name:gruening-ernest, name:rasmuson-elmer-e, name:stevens-ted-f]
  - id: cal.1968-08-27.state-constitutions-ok
    when: Aug. 27 and Sept. 17
    date: '1968-08-27'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Oklahoma, with the primary, Aug. 27, adopts six amendments: intangible personal property no longer taxed, 329,848 to 92,710, 78.1 percent; appropriations held to the Board of Equalization''s estimate of revenues; a Board of Legislative Compensation to fix the legislators'' pay, 201,107 to 177,672, 53.1 percent. Two refused, a new Pardon and Parole Board among them, 182,742 to 197,219, 48.1 percent. With the runoff, Sept. 17: the initiative''s new judicial article rejected, 115,771 to 172,711, 40.1 percent; six-member juries for misdemeanors, 170,854 to 97,736, 63.6 percent, and four others adopted.'
    n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-5 to C-12](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=6) (State Questions 441–462; the Board prints State Question 461''s vote as 460''s, Check). To check: [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1967-07-11.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1968-08-27.elections-1968-chicago-2
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    c: 'Johnson''s sixtieth birthday, at the Ranch. Dirksen, by telephone, 11:15 a.m.: "Are you any closer to going out there to that convention?" Johnson: "I haven''t made any plans to go and rather doubt that I will." Calls to Daley, Criswell and others in the afternoon; at 4:40 to Humphrey: he will not come to Chicago. Christian tells the press. Connally had found the Southern governors against a draft, by his account.'
    n: 'FRUS 1964–68, VI, doc. [341](https://history.state.gov/historicaldocuments/frus1964-68v06/d341) (the call to Dirksen). [Johnson and Dirksen, 11:15 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-office-noise-and-office), Conversation WH6808-03-13323; [Johnson and Daley, 4:08 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-august-27-1968), Conversation WH6808-03-13327; [Johnson, Criswell and Jones, 4:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-criswell-and-jim-jones-august-27-1968), Conversation WH6808-03-13328; [Johnson, Humphrey and Jones, 4:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-jim-jones-telephone-operators), Conversation WH6808-03-13329 (Miller Center). [[w.longley-lbjs-1968]], 219–21 (the day; Longley gives 4:45 for the call to Humphrey). To check: [[w.connally-in-historys-shadow]], 203. See [[cal.1968-08-26.elections-1968]]. Names: Dirksen, Daley, Criswell, Humphrey, Christian, Connally, Johnson.'
    src:
      c: ca7c4a4e
      rows:
