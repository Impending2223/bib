    c: 'Oklahoma, with the primary, Aug. 27, adopts six amendments: intangible personal property no longer taxed, 329,848 to 92,710, 78.1 percent; appropriations held to the Board of Equalization''s estimate of revenues; a Board of Legislative Compensation to fix the legislators'' pay, 201,107 to 177,672, 53.1 percent. Two refused, a new Pardon and Parole Board among them, 182,742 to 197,219, 48.1 percent. With the runoff, Sept. 17: the initiative''s new judicial article rejected, 115,771 to 172,711, 40.1 percent; six-member juries for misdemeanors, 170,854 to 97,736, 63.6 percent, and four others adopted.'
    n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-5 to C-12](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=6) (State Questions 441–462; the Board prints State Question 461''s vote as 460''s, Check). To check: [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1967-07-11.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1968-08-27.elections-1968-chicago-2
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    c: 'Johnson''s sixtieth birthday, at the Ranch. Dirksen, by telephone, 11:15 a.m.: "Are you any closer to going out there to that convention?" Johnson: "I haven''t made any plans to go and rather doubt that I will." Calls to Daley, Criswell and others in the afternoon; at 4:40 to Humphrey: he will not come to Chicago. Christian tells the press. Connally had found the Southern governors against a draft, by his account.'
