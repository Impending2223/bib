  - id: cal.1968-08-01.transportation-2
    when: Aug. 1
    date: '1968-08-01'
    thread: transportation
    c: 'House Government Operations'' Subcommittee on Government Activities, Brooks, on air traffic congestion. Thomas, the FAA''s acting administrator: the worst in the "Golden Triangle," New York, Washington and Chicago. Crooker, the CAB: the Board might divert flights. Kenneth T. Lyons, for the controllers'' union: five near-misses a day at National Airport. Brooks: the government will act if the industry does not.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2117. Names: Brooks, Thomas, Crooker.'
    tags: [name:brooks-jack-b, name:thomas-david-d, name:crooker-john-h-jr]
