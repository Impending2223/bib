  - id: cal.1968-08-08.elections-1968-chicago-2
    when: Aug. 8
    date: '1968-08-08'
    thread: elections-1968-chicago
    c: 'Fort Sheridan, Ill. The Fifth Army''s conference on convention week: the Army, III Corps from Fort Hood, the Secret Service, the Chicago police, the Illinois and Indiana Guard. The Secret Service''s intelligence summary; it wants more weight on the hotels and the Loop. That afternoon the plans laid before Daley.'
    n: '[[w.rights-in-conflict-convention-week]], 113–14. See [[cal.1968-01.elections-1968-chicago]]. Names: Daley.'
    tags: [name:daley-richard-j, state:il]
  - id: cal.1968-08-09.court-fortas
    when: Aug. 9
    date: '1968-08-09'
    thread: court-fortas
    c: 'Eastland, in San Antonio, with Johnson at the Ranch, by Johnson''s account: "He would not give one inch." Fortas would not be confirmed as Chief Justice, so there would be no vacancy for Thornberry. Johnson concludes the votes are not there.'
    n: '[[w.longley-lbjs-1968]], 178. To check: [[w.johnson-vantage-point]], 547. See [[cal.1968-06-26.court]]. Names: Eastland, Fortas, Thornberry, Johnson.'
