    also: [elections-1968-chicago]
    c: 'Chicago, the Amphitheatre floor. Rather of CBS, on the air, asking why a Georgia delegate is being removed, is punched in the stomach by a security man, an employee of the sergeant-at-arms. Cronkite: "a bunch of thugs here."'
