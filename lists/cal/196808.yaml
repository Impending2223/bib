    c: 'H.R. 15387 signed: assault on a postal employee a federal crime; the postal field service exempt from the surcharge act''s cut in employment.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2116. [[w.cq-weekly-report]], Aug. 16, 1968, 2192 (signed Aug. 2; Watson''s cuts in service canceled). Check: the statute''s cite (Public Law 90-449). Names: Johnson.'
    tags: [name:johnson-lyndon-b]
