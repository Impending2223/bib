  - id: cal.1968-08-09.elections-1968-johnson
    when: Aug. 9
    date: '1968-08-09'
    thread: elections-1968-johnson
    c: 'LBJ Ranch. Senator Eastland, driven about by Mrs. Johnson with two Mississippi friends, D. A. Biglane and W. O. Schurden: "You know your husband is going to be nominated, don''t you?" She: "No, sir, not at all. There is not going to be any movement of that sort ... And if he were, he wouldn''t accept." Eastland "somehow, taken aback—a little disbelieving." Mrs. Johnson thinks he would rather see Johnson nominated than anyone now considered. His two friends, "ardent LBJ supporters," say Johnson is "the only man for the Democratic Party."'
    n: '[[w.johnson-white-house-diary]], 701–02 (Lady Bird Johnson''s account). Her judgments of Eastland''s preference and of his friends are her own. See [[cal.1968-08-09.court-fortas]]. Made public: 1970. Names: Eastland, Lady Bird Johnson, Johnson.'
    tags: [name:eastland-james-o, name:johnson-lady-bird, name:johnson-lyndon-b, state:tx, state:ms]
  - id: cal.1968-08-09.cities-and-housing-2
    when: Aug. 9
    date: '1968-08-09'
    thread: cities-and-housing
    c: 'LBJ Ranch. Secretary Weaver, Joseph Califano and Edgar Kaiser, with his son and an assistant, fly in on the "Washington shuttle" for a meeting with Johnson. Mrs. Johnson learns later of "an effort to get started some inexpensive housing": Johnson has challenged Kaiser and about ten builders to produce a prototype of small houses to sell for five thousand dollars or less, to be built in Austin before he leaves office.'
    n: '[[w.johnson-white-house-diary]], 701–02 (Lady Bird Johnson''s account). She was not at the meeting; she learned of it later. The $5,000 figure and the builders are her account. Names: Weaver, Califano, Kaiser, Johnson, Lady Bird Johnson.'
    tags: [name:weaver-robert-c, name:califano-joseph-a-jr, name:kaiser-edgar-f, name:johnson-lyndon-b, name:johnson-lady-bird, state:tx, city:austin]
