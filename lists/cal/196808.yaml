  - id: cal.1968-08-21.soviet-union-czechoslovakia-2
    when: Aug. 21
    date: '1968-08-21'
    thread: soviet-union-czechoslovakia
    c: 'Evening, the Security Council in emergency session. Malik against inscribing the item: the forces sent "at the request" of the Prague government. Ball: the invasion "an affront to all civilized sensibilities," Malik''s case "a feeble and futile effort at self-justification." Malik, short of the votes, would withdraw his objection; Ball forces the vote, Araujo Castro of Brazil presiding. The Council has messages from Hájek and from the National Assembly''s Presidium against "the illegal occupation."'
    n: '[[w.ball-past-has-another-pattern]], 440–41. Check: the vote and the record not read. See [[cal.1968-08-20.soviet-union]]. Names: Malik, Ball, Hájek.'
    src:
      c: 33904f8f
      rows:
        - 'w.ball-past-has-another-pattern 440–41: all'
    tags: [name:malik-yakov-aleksandrovich, name:ball-george-w, name:hajek-jiri]
  - id: cal.1968-08-22.soviet-union
