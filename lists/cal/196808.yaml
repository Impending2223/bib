    time: 1968-08-08T06:15Z
    thread: elections-1968-miami
    also: [republican-party]
    c: 'Miami Beach, from 2:15 a.m., the night after the nomination. Nixon''s meetings on a running mate: twenty-four in his penthouse, "I have brought no names to Miami"; at 2:45 a.m., twenty-two, Thurmond, Dent, Goldwater, Nunn, Brock, Fannin, John Rhodes, James Rhodes, Jack Miller, Brownell, Finch, Billy Graham, Rumsfeld; Thurmond for Reagan, then Baker, Volpe and Agnew acceptable; James Rhodes: "With Reagan on the ticket, we''d lose Ohio." At 9 a.m., the Jackie of Hearts Room: Bliss, Dirksen, Ford, Murphy, Bob Wilson, Rogers Morton, Tower, O''Donnell; Wilson and Ford for Lindsay, Tower for Reagan. Then Mitchell, Haldeman, Ellsworth, Morton, Tower and Finch: "you three ... or Ted Agnew." Tower, at Nixon''s asking, to Thurmond: Volpe or Agnew? Morton calls Agnew; at 12:40 p.m. Nixon names him.'
    n: '[[w.chester-american-melodrama]], 484–90 (the meetings and the names Nixon''s staff released; 485 also gives Sears''s account that Nixon had chosen Agnew ten days before: [[cal.1968-07.elections-1968-nixon]]); [[w.white-making-of-the-president-1969]], 250–53 (the staff of twenty-four; the leaders; the Jackie-of-Hearts Room at nine; Finch chosen and refusing; Agnew at 12:30); [[w.nixon-rn]], 312–13 (Finch asked and refusing; Morton asked, and for Agnew; Morton to telephone him). See [[cal.1968-08-08.elections-1968-miami]]. Names: Nixon, Thurmond, Dent, Goldwater, Nunn, Brock, Fannin, John J. Rhodes, James A. Rhodes, Jack Miller, Brownell, Finch, Graham, Rumsfeld, Baker, Volpe, Agnew, Bliss, Dirksen, Ford, Murphy, Bob Wilson, Rogers Morton, Tower, Peter O''Donnell, Lindsay, Reagan, Mitchell, Haldeman, Ellsworth, Sears.'
