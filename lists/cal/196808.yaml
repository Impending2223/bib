        - 'w.nixon-rn 316: A, B, E'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:agnew-spiro-t, name:rusk-dean, name:helms-richard, name:vance-cyrus]
  - id: cal.1968-08-10.elections-1968-2
    when: Aug. 10
    date: '1968-08-10'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'McGovern announces his candidacy for the Democratic nomination, for Robert Kennedy''s delegates and against the war (Check the day). His statement: "The loss of American youth and the slaughter of the Vietnamese should stop now"; "We seek no wider war" the pledge of 1964; "25,000 young American lives and $100 billion later."'
    n: '[[w.mann-grand-delusion]], 609–10. To check: [[w.mcgovern-grassroots]]; [[w.knock-rise-of-a-prairie]]; McGovern, announcement, Aug. 10, 1968, Speeches, Box 37, McGovern Papers (cited by [[w.mann-grand-delusion]], 610 n.4). See [[cal.1968-06-05.robert-kennedy]]. Names: McGovern, Robert Kennedy.'
