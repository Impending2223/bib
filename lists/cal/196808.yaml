    also: [vietnam]
    c: 'Miami Beach. The Republican platform, Dirksen''s committee''s report, adopted by voice vote: on Vietnam, "a progressive de-Americanization of the war, both military and civilian," and a negotiated peace.'
    n: '[Republican Party Platform of 1968](https://www.presidency.ucsb.edu/documents/republican-party-platform-1968) (Aug. 5, 1968). [*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the third session, Aug. 6, [239](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/239/mode/1up). [[w.cq-weekly-report]], Aug. 9, 1968, 2095, 2097, 2140 (adopted by voice vote, without debate; Dirksen''s committee). Check: CQ''s chronology has the platform adopted at 12:22 a.m., Aug. 7, the third session having run past midnight (2140); its summary, Aug. 6 (2095, 2097); its analysis, Aug. 7 (2099); its text, "adopted ... on Aug. 6" (2126). See [[cal.1968-08-05.elections-1968]]. Names: Dirksen.'
