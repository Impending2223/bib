    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago. The Park District''s permit for the Mobilization''s rally at the Grant Park bandshell, Aug. 28, 1 to 4 p.m., delivered in the evening: no literature to be handed out; $100,000 to $300,000 of liability insurance. The policy never obtained.'
    n: '[[w.rights-in-conflict-convention-week]], 68, 217. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
