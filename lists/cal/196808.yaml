entries:
  - id: cal.1968-08-01.cities-and-housing
    when: Aug. 1
    date: '1968-08-01'
    thread: cities-and-housing
    c: 'Housing and Urban Development Act signed, [82 Stat. 476](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg476.pdf), on the lawn of HUD''s new building: a goal of 26 million homes in ten years, 6 million of them for low- and moderate-income families; interest subsidies for home ownership (section 235) and rental housing (section 236); a National Housing Partnership of private investors; new communities; urban renewal and public housing extended. Johnson: "the Magna Carta to liberate our cities." Check: the goal''s figures, in the act''s Title XVI.'
    n: 'Remarks Upon Signing the Housing and Urban Development Act of 1968, [1968–69 Pub. Papers 865](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=175) (Aug. 1, 1968). Statute (K–J Cong. II.J.2). See [[cal.1968-07-10.cities-and-housing]]. Names: Weaver, Sparkman, Patman, Johnson.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:sparkman-john, name:patman-wright]
  - id: cal.1968-08-01.immigration
    when: Aug. 1
    date: '1968-08-01'
    thread: immigration
    c: 'The Protocol Relating to the Status of Refugees, endorsed by the General Assembly in December 1966, sent to the Senate for accession: refugees not to be expelled or returned to a country where they would face persecution.'
    n: 'Special Message to the Senate Transmitting the Protocol Relating to the Status of Refugees, [1968–69 Pub. Papers 868](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=178) (Aug. 1, 1968). See [[cal.1968-07-01.immigration]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-03.soviet-union-czechoslovakia
    when: Aug. 3
    date: '1968-08-03'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: 'Bratislava: the six parties'' declaration. Beam from Prague, Aug. 4: Dubček "staring down the Soviet threat of force."'
    n: 'FRUS 1964–68, XVII, doc. [77](https://history.state.gov/historicaldocuments/frus1964-68v17/d77). Made public: FRUS 1964–68, XVII (1996). See [[cal.1968-07-15.soviet-union]]. Names: Beam, Dubček.'
    tags: [name:beam-jacob-d, name:dubcek-alexander]

  - id: cal.1968-08-04.opinion
    when: Aug. 4
    date: '1968-08-04'
    thread: opinion
    also: [vietnam, crime-and-hijacking, civil-rights-the-executive]
    c: 'Gallup, June 26–July 1: the most important problem facing the country: the Vietnam war 52 percent; crime and lawlessness (riots, looting, juvenile delinquency included) 29; race relations 13; the high cost of living and taxes 9; poverty 3. The party better able to handle it: Republican 31, Democratic 27, no difference or no opinion 42.'
    n: '[[w.gallup-poll]], III, 2151.'
  - id: cal.1968-08-05.elections-1968
    when: Aug. 5
    date: '1968-08-05'
    thread: elections-1968-miami
    c: 'Republican National Convention opens, Miami Beach, at Convention Hall. 1,333 delegates. The party''s primaries, and the delegations: maps and tables below.'
    n: '[*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the Call, [11–19](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/11/mode/1up). CQ Guide 6th (2010) 409–411. See [[cal.1968-03-12.elections-1968]].'
    gloss:
      title: The Call
      text:
        - 'The Republican National Committee''s Call, Sept. 9, 1967, "in compliance with the rules adopted by the Republican National Convention of 1964" (*Proceedings*, [11](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/11/mode/1up)). Delegates at large: "Four Delegates at Large from each State"; "Two additional Delegates at Large for each Representative at Large in Congress from each State"; "Nine Delegates at Large for the District of Columbia"; "Six additional Delegates at Large from each State casting its electoral vote, or a majority thereof, for the Republican nominee for President in the 1964 Presidential election," or, where it did not, which "at that election or at a subsequent election held prior to the 1968 Republican National Convention elected a Republican United States Senator or a Republican Governor"; "Five Delegates at Large for Puerto Rico and three Delegates at Large for the Virgin Islands" (11).'
        - 'District delegates: "One District Delegate from each Congressional District casting two thousand (2,000) votes or more for the Republican nominee for President, or for any elector pledged to vote for the Republican nominee for President in the 1964 Presidential election, or for the Republican nominee for Congress in the last preceding Congressional election"; "One additional District Delegate for each Congressional District casting ten thousand (10,000) votes or more" ([11–12](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/11/mode/1up)). "One Alternate Delegate to each Delegate to the National Convention" ([12](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/12/mode/1up)).'
        - 'How chosen: "By primary election in accordance with the applicable laws of such States as required by law"; "By Congressional District or State Conventions, as the case may be, to be called by the Congressional District or State Committees"; "By the Republican State Committee or Governing Committee in any State in which the law of such State specifically authorizes the election of Delegates or Alternates in such manner" ([12–13](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/12/mode/1up)). All "not later than thirty (30) days before the date of the meeting of said National Convention, unless otherwise provided by the laws of the State in which the election occurs" ([13](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/13/mode/1up)). "No Delegates shall be deemed eligible to participate in any convention to elect Delegates to the said National Convention, who were elected prior to the date of the issuance of this Call" ([14](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/14/mode/1up)).'
        - 'The apportionment, "in accordance with the rules adopted by the Republican National Convention at San Francisco, California, on July 13, 1964, and the resolution this day adopted by the Republican National Committee": 1,333 delegates ([17–19](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/17/mode/1up)). Two from each district in every State. Four at large, the six not given, in Connecticut, Indiana, Missouri, New Hampshire, North Carolina, North Dakota, Utah, Virginia and West Virginia; ten in the other States with no Representative at large; twelve in Alaska, Delaware, Nevada, Vermont and Wyoming, fourteen in Hawaii and New Mexico.'
        - 'The rules the convention adopted, Rule 18(a): "No Delegate or Alternate shall be bound by any attempt of any State or Congressional District, the District of Columbia, Puerto Rico, the Virgin Islands, or Guam, to impose the unit rule" ([174](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/174/mode/1up)).'
    tags: [primaries:1968-R, conventions:1968-R]
  - id: cal.1968-08-05.elections-1968-2
    when: Aug. 5
    date: '1968-08-05'
    thread: elections-1968-miami
    c: 'Miami Beach. Reagan declares himself a candidate, the California delegation behind him.'
    n: '[[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.mailer-miami-and-the-siege-1968]]; [[w.cannon-governor-reagan]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1968-08-05.elections-1968]]. Names: Reagan.'
    tags: [name:reagan-ronald, state:fl]

  - id: cal.1968-08-05.africa
    when: Aug. 5
    date: '1968-08-05'
    thread: africa
    c: 'Addis Ababa. Nigeria''s federal government and Biafra open talks under the Organization of African Unity''s Consultative Committee, Haile Selassie its chairman. Johnson to him: relief supplies "already nearby," the Red Cross ready; "the political aspects of the problem obviously must be settled by the parties." Aug. 15, Johnson to Gowon, on the relief flights; Gowon had already refused the Red Cross''s proposal of an airstrip.'
    n: 'Message to Haile Selassie, Chairman of the Consultative Committee on Nigeria of the Organization of African Unity, [1968–69 Pub. Papers 875](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=185) (Aug. 5, 1968). FRUS 1964–68, XXIV, docs. [398](https://history.state.gov/historicaldocuments/frus1964-68v24/d398), [399](https://history.state.gov/historicaldocuments/frus1964-68v24/d399). See [[cal.1968-07-11.africa]]. Names: Haile Selassie, Gowon, Johnson.'
    tags: [name:johnson-lyndon-b, name:haile-selassie-i, name:gowon-yakubu]
  - id: cal.1968-08-06.elections-1968-miami
    when: Aug. 6
    date: '1968-08-06'
    thread: elections-1968-miami
    also: [vietnam]
    c: 'Miami Beach. The Republican platform, Dirksen''s committee''s report, adopted by voice vote: on Vietnam, "a progressive de-Americanization of the war, both military and civilian," and a negotiated peace.'
    n: '[Republican Party Platform of 1968](https://www.presidency.ucsb.edu/documents/republican-party-platform-1968) (Aug. 5, 1968). [*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the third session, Aug. 6, [239](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/239/mode/1up). See [[cal.1968-08-05.elections-1968]]. Names: Dirksen.'
    tags: [state:fl, name:dirksen-everett]

  - id: cal.1968-08-06.governors-ks
    when: Aug. 6
    date: '1968-08-06'
    thread: governors
    also: [elections-1968]
    c: 'Kansas, Republican primary for governor: Harman, a businessman, 133,454, 48.9 percent; Crutcher, the lieutenant governor, 128,635, 47.1; one other 4.0. Governor Docking, seeking a second two-year term, unopposed. Docking re-elected in November over Harman, 51.9 percent.'
    n: 'Votes: [Wikipedia, "1968 Kansas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Kansas_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: *State of Kansas Election Statistics, 1968* (not online). [[w.socolofsky-kansas-governors]]; [[w.peirce-great-plains-states-of]]. See [[cal.1966-11-08.governors-ks]]. Names: Harman, Crutcher, Docking.'
    tags: [state:ks, name:harman-rick, name:crutcher-john-w, name:docking-robert]
  - id: cal.1968-08-07.elections-1968
    when: Aug. 7–8
    date: '1968-08-07'
    thread: elections-1968-miami
    c: 'Miami Beach. Thurmond and the Southern delegations hold for Nixon (Check). Nixon nominated on the first ballot, early Aug. 8: 692 votes, 667 needed; Rockefeller 277, Reagan 182, Rhodes 55, Romney 50. After the roll, the delegations change: Nixon 1,238. On Reagan''s motion, made unanimous by voice vote.'
    n: '[*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the fourth session, Aug. 7, the roll call [368–379](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/368/mode/1up), the changes and the final tabulation [379–389](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/379/mode/1up). [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.nelson-resilient-america]]. See [[cal.1968-08-05.elections-1968]]. Names: Thurmond, Nixon, Rockefeller, Reagan, Rhodes, Romney.'
    tags: [name:thurmond-strom, name:nixon-richard-m, name:rockefeller-nelson, name:reagan-ronald, name:rhodes-james-a, name:romney-george-w, state:fl, rollcall:1968-R-pres1]

  - id: cal.1968-08-07.civil-disorders
    when: Aug. 7–9
    date: '1968-08-07'
    thread: civil-disorders
    also: [elections-1968-miami]
    c: Miami, Liberty City, during the Republican convention. A rally at the Vote Power League's building, Aug. 7, ends in stoning and burning; Aug. 8, after Kirk and the county's leaders fail to come back to meet the neighborhood's spokesmen, looting and fire-bombing. The police kill three Negroes (Check). The National Guard, a curfew; over by Aug. 9. Kirk and Abernathy had come from Miami Beach.
    n: '[[w.dunn-black-miami-in-the]]. Check: the Miami Study Team''s report to the National Commission on the Causes and Prevention of Violence (1969). See [[cal.1967-12-26.crime-and-hijacking-miami]]. Names: Kirk, Abernathy.'
    tags: [name:kirk-claude-r-jr, name:abernathy-ralph-david, state:fl, city:miami]
  - id: cal.1968-08-07.opinion
    when: Aug. 7
    date: '1968-08-07'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, July 18–23, Democrats, the convention''s choice between Humphrey and McCarthy: Humphrey 53 percent, McCarthy 39, undecided 8. Those 21 to 29: McCarthy 58, Humphrey 34. Non-whites: Humphrey 73, McCarthy 22. West: McCarthy 50, Humphrey 44. Those who approve of Johnson''s policies: Humphrey 68, McCarthy 26; who disapprove: McCarthy 57, Humphrey 32. Independents: McCarthy 53, Humphrey 32.'
    n: '[[w.gallup-poll]], III, 2151–53. Names: Humphrey, McCarthy, Johnson.'
    tags: [name:humphrey-hubert-h, name:mccarthy-eugene-j, name:johnson-lyndon-b]
  - id: cal.1968-08-08.elections-1968-miami
    when: Aug. 8
    date: '1968-08-08'
    thread: elections-1968-miami
    c: 'Miami Beach. Nixon names Agnew; Agnew nominated, 1,119, over Romney, put up by delegates against him, 186. Nixon''s acceptance: the voice of "the forgotten Americans—the non-shouters; the non-demonstrators." Johnson by telephone: a briefing at the ranch.'
    n: '[Address Accepting the Presidential Nomination at the Republican National Convention in Miami Beach, Florida](https://www.presidency.ucsb.edu/documents/address-accepting-the-presidential-nomination-the-republican-national-convention-miami) (Aug. 8, 1968). [Johnson and Nixon, 4:09 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-august-8-1968), Conversation WH6808-01-13304 (Miller Center). [*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the fifth session, the roll call [420–431](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/420/mode/1up). [[w.witcover-white-knight]]; [[w.coffey-spiro-agnew-and-the]]. See [[cal.1968-08-07.elections-1968]]. Names: Nixon, Agnew, Romney, Johnson.'
    tags: [name:nixon-richard-m, name:agnew-spiro-t, name:romney-george-w, name:johnson-lyndon-b, state:fl, rollcall:1968-R-vp]

  - id: cal.1968-08-10.elections-1968
    when: Aug. 10
    date: '1968-08-10'
    thread: elections-1968
    also: [vietnam]
    c: 'The LBJ Ranch, 12:25 p.m. Johnson briefs Nixon and Agnew, with Rusk, Helms and Vance, back from Paris. Helms: Czechoslovakia "eased, not over"; Vietnam "at the tensest point." Lunch after.'
    n: 'FRUS 1964–68, VI, doc. [327](https://history.state.gov/historicaldocuments/frus1964-68v06/d327); XVII, doc. [78](https://history.state.gov/historicaldocuments/frus1964-68v17/d78). Made public: the notes, FRUS 1964–68, XVII (1996) and VI (2002). See [[cal.1968-07-26.elections-1968]]. Names: Nixon, Agnew, Rusk, Helms, Vance, Johnson.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:agnew-spiro-t, name:rusk-dean, name:helms-richard, name:vance-cyrus]
  - id: cal.1968-08-10.elections-1968-2
    when: Aug. 10
    date: '1968-08-10'
    thread: elections-1968
    also: [robert-kennedy]
    c: McGovern announces his candidacy for the Democratic nomination, for Robert Kennedy's delegates and against the war (Check the day).
    n: '[[w.mcgovern-grassroots]]; [[w.knock-rise-of-a-prairie]]. See [[cal.1968-06-05.robert-kennedy]]. Names: McGovern, Robert Kennedy.'
    tags: [name:mcgovern-george, name:kennedy-robert-f]
  - id: cal.1968-08-11.opinion
    when: Aug. 11
    date: '1968-08-11'
    thread: opinion
    also: [vietnam, elections-1968-polls]
    c: 'Gallup, July 18–23: a candidate who said more of the fighting should be turned over to the South Vietnamese, and some American troops withdrawn as of Jan. 1: would vote for him 66 percent, against 18. Republicans 65 for; Democrats 66; independents 67. McCarthy''s supporters 70; Humphrey''s 68; Nixon''s 66.'
    n: '[[w.gallup-poll]], III, 2153. Names: McCarthy, Humphrey, Nixon.'
    tags: [name:mccarthy-eugene-j, name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1968-08-12.consumers
    when: Aug. 12
    date: '1968-08-12'
    thread: consumers
    c: 'Natural Gas Pipeline Safety Act signed, [82 Stat. 720](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg720.pdf): the Secretary of Transportation to set safety standards for the pipeline transportation of gas, the States to enforce them on intrastate lines by agreement. Johnson: 800,000 miles of pipeline; a failure about every five days; seventeen killed at Natchitoches, La., in 1965. The House had passed it, [351–14](https://voteview.com/rollcall/RH0900369), July 2.'
    n: 'Statement by the President Upon Signing the Natural Gas Pipeline Safety Act of 1968, [1968–69 Pub. Papers 882](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=192) (Aug. 13, 1968). Statute (K–J Cong. II.J.2). See [[cal.1967-11-20.consumers]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-13.governors-ar
    when: Aug. 13
    date: '1968-08-13'
    thread: governors
    also: [elections-1968]
    c: 'Arkansas''s Democratic runoff for governor: Crank 215,087, 63.3 percent; Virginia Johnson 124,880.'
    n: 'Ark. [*Historical Report of the Secretary of State* (2008)](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf), [629](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=642). Check: the date. See [[cal.1968-07-30.governors-ar]]. Names: Crank, Virginia Johnson.'
    tags: [state:ar, name:crank-marion-h, name:johnson-virginia]
  - id: cal.1968-08-15.economy
    when: Aug. 15
    date: '1968-08-15'
    thread: economy
    c: 'The Federal Reserve cuts the discount rate from 5½ percent to 5¼. Johnson: confirms the fall in interest rates since the Revenue and Expenditure Control Act; funds for more homebuilding.'
    n: 'Statement by the President on the Reduction in the Discount Rate by the Board of Governors of the Federal Reserve System, [1968–69 Pub. Papers 891](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=201) (Aug. 15, 1968). [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]. See [[cal.1968-06-20.economy]]. Names: Martin, Johnson.'
    tags: [name:johnson-lyndon-b, name:martin-william-mcchesney-jr]
  - id: cal.1968-08-16.defense
    when: Aug. 16
    date: '1968-08-16'
    thread: defense
    also: [testing]
    c: 'Multiple independently targetable reentry vehicles flight-tested for the first time: the Minuteman III from Cape Kennedy, the Poseidon from a pad there (Check the details). The same day the Committee of Principals'' proposal for the strategic arms talks goes to Johnson, agreed unanimously.'
    n: 'FRUS 1964–68, XI, doc. [273](https://history.state.gov/historicaldocuments/frus1964-68v11/d273). Check: the Defense Department''s announcement. [[w.greenwood-making-the-mirv]]; [[w.newhouse-cold-dawn]]. See [[cal.1967-09-18.defense]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-16.health
    when: Aug. 16
    date: '1968-08-16'
    thread: health
    c: 'Health Manpower Act signed, [82 Stat. 773](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg773.pdf): the programs of aid to the schools of medicine, dentistry and nursing and their students extended and enlarged. A National Eye Institute in the National Institutes of Health, [82 Stat. 771](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg771.pdf). The House had passed the manpower bill, [350–0](https://voteview.com/rollcall/RH0900414), Aug. 1.'
    n: 'Statement by the President Upon Signing the Health Manpower Act of 1968, [1968–69 Pub. Papers 892](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=202) (Aug. 17, 1968); Statement by the President Upon Signing Bill Establishing the National Eye Institute, [1968–69 Pub. Papers 891](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=201) (Aug. 17, 1968). Statute (K–J Cong. II.J.2). See [[cal.1963-09-24.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-18.vietnam
    when: Aug. 18
    date: '1968-08-18'
    thread: vietnam-paris
    also: [elections-1968]
    c: 'Johnson by telephone from the ranch to Nixon and then Humphrey: Hanoi waiting on the conventions. To Humphrey, after Humphrey''s *Face the Nation*: "We''d be glad to stop it again if they''d just tell us they won''t kill extra men because we do stop it."'
    n: '[Johnson and Nixon, 5:01 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-august-18-1968), Conversation WH6808-01-13306; [Johnson and Humphrey, 5:23 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-august-18-1968), Conversation WH6808-01-13307 (Miller Center). FRUS 1964–68, VI, doc. [330](https://history.state.gov/historicaldocuments/frus1964-68v06/d330). [[w.johns-price-of-loyalty]]; [[w.solberg-hubert-humphrey]]. See [[cal.1968-07-29.vietnam]]. Names: Nixon, Humphrey, Johnson.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:humphrey-hubert-h]

  - id: cal.1968-08-18.consumers
    when: Aug. 18
    date: '1968-08-18'
    thread: consumers
    also: [farm]
    c: 'Wholesome Poultry Products Act signed, [82 Stat. 791](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg791.pdf): poultry sold within a State to be inspected to federal standards, by the State or, where it fails, by the Department of Agriculture, as under the Wholesome Meat Act. Johnson: 1.6 billion pounds, 13 percent of the supply, little or not inspected. The Senate had passed it, [73–0](https://voteview.com/rollcall/RS0900523), July 29.'
    n: 'Statement by the President Upon Signing the Wholesome Poultry Products Act, [1968–69 Pub. Papers 895](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=205) (Aug. 19, 1968). Statute (K–J Cong. II.J.2). See [[cal.1967-12-15.consumers]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-18.opinion
    when: Aug. 18
    date: '1968-08-18'
    thread: opinion
    also: [economy, jobs-and-wages]
    c: 'Gallup, July 18–23: the biggest threat to the country in the future: big government 46 percent, big labor 26, big business 12. Republicans 48, 32 and 9; Democrats 41, 23 and 14; independents 54, 23 and 10. Negroes and those with family incomes under $3,000 divided between big business and big labor.'
    n: '[[w.gallup-poll]], III, 2154.'
  - id: cal.1968-08-19.vietnam-paris
    when: Aug. 19
    date: '1968-08-19'
    thread: vietnam-paris
    c: 'Detroit. Johnson to the Veterans of Foreign Wars: "This administration does not intend to move further until it has good reason to believe that the other side intends seriously to join us in deescalating the war."'
    n: 'Remarks in Detroit at the Annual Convention of the Veterans of Foreign Wars, [1968–69 Pub. Papers 896](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=206) (Aug. 19, 1968). See [[cal.1968-07-29.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:mi, city:detroit]

  - id: cal.1968-08-19.testing
    when: Aug. 19
    date: '1968-08-19'
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'Dobrynin to Rusk, a handwritten note: Moscow "positive" on Johnson''s wish to meet the Soviet leaders in the Soviet Union, in the first ten days of October; Leningrad acceptable; an announcement soon.'
    n: 'FRUS 1964–68, XIV, docs. [285](https://history.state.gov/historicaldocuments/frus1964-68v14/d285), [286](https://history.state.gov/historicaldocuments/frus1964-68v14/d286). Made public: FRUS 1964–68, XIV (2001). See [[cal.1968-07-25.testing]]. Names: Dobrynin, Rusk, Johnson.'
    tags: [name:dobrynin-anatoly, name:rusk-dean, name:johnson-lyndon-b]

  - id: cal.1968-08-20.testing-missile-talks
    when: Aug. 20
    date: '1968-08-20'
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'Kosygin to Johnson: special delegations to begin the talks on strategic arms at Geneva Sept. 30; an announcement Aug. 22. The joint announcement of the visit set for the morning of Aug. 21.'
    n: 'FRUS 1964–68, XIV, docs. [287](https://history.state.gov/historicaldocuments/frus1964-68v14/d287), [288](https://history.state.gov/historicaldocuments/frus1964-68v14/d288). Made public: FRUS 1964–68, XIV (2001). See [[cal.1968-07-25.testing]]. Names: Kosygin, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b]

  - id: cal.1968-08-20.soviet-union
    when: Aug. 20–21
    date: '1968-08-20'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance, testing-missile-talks]
    c: 'Czechoslovakia invaded the night of Aug. 20–21 by the forces of the Soviet Union, Poland, Hungary and Bulgaria, some 250,000 men; East Germany''s held back. Dubček and others taken to Moscow. Dobrynin to Johnson in the Cabinet Room, 8:15 p.m.: Moscow''s message that the Czechoslovak government asked for help. The National Security Council, 10:15 p.m.: the visit to the Soviet Union not to be announced. Johnson to Nixon, 11:22 p.m. Aug. 21, broadcast: "The Soviet Union and its allies have invaded a defenseless country to stamp out a resurgence of ordinary human freedom"; Ball to the Security Council.'
    n: 'Statement by the President Calling on the Warsaw Pact Allies To Withdraw From Czechoslovakia, [1968–69 Pub. Papers 905](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=215) (Aug. 21, 1968). FRUS 1964–68, XVII, docs. [80](https://history.state.gov/historicaldocuments/frus1964-68v17/d80), [81](https://history.state.gov/historicaldocuments/frus1964-68v17/d81), [82](https://history.state.gov/historicaldocuments/frus1964-68v17/d82); XIV, doc. [289](https://history.state.gov/historicaldocuments/frus1964-68v14/d289). [Johnson and Nixon, 11:22 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-august-21-1968), Conversation WH6808-01-13310 (Miller Center). Made public: FRUS 1964–68, XVII (1996). [[w.valenta-soviet-intervention-in-czechoslovakia]]; [[w.dawisha-kremlin-and-the-prague]]; [[w.williams-prague-spring-and-its]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.dobrynin-in-confidence]]; [[w.zubok-failed-empire]]; [[w.johnson-vantage-point]]; [[w.garthoff-detente-and-confrontation]]. See [[cal.1968-07-15.soviet-union]]. Names: Dubček, Dobrynin, Nixon, Ball, Johnson.'
    tags: [name:dubcek-alexander, name:dobrynin-anatoly, name:johnson-lyndon-b, name:nixon-richard-m, name:ball-george-w]
  - id: cal.1968-08-21.elections-1968
    when: Aug. 21
    date: '1968-08-21'
    thread: elections-1968
    also: [vietnam, war-opposition]
    c: 'Worcester, Mass. Edward Kennedy, his first speech since his brother''s death: an end to the bombing of the North without conditions; the withdrawal of American and North Vietnamese forces from the South to be negotiated (Check the place and the terms).'
    n: '[[w.clymer-edward-m-kennedy]]. See [[cal.1968-07-26.elections-1968-2]]. Names: Edward Kennedy.'
    tags: [name:kennedy-edward-m, state:ma]
  - id: cal.1968-08-21.opinion
    when: Aug. 21
    date: '1968-08-21'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 7–12, with Wallace as a third party''s candidate: Nixon 45 percent, Humphrey 29, Wallace 18, undecided 8. South: Wallace 36, Nixon 33, Humphrey 24. McCarthy in Humphrey''s place: Nixon 42, McCarthy 37, Wallace 16; South, Wallace 36, Nixon 34, McCarthy 25.'
    n: '[[w.gallup-poll]], III, 2154–56. Names: Humphrey, Nixon, Wallace, McCarthy.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:mccarthy-eugene-j]
  - id: cal.1968-08-22.soviet-union
    when: Aug. 22
    date: '1968-08-22'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: 'The Security Council''s resolution condemning the invasion of Czechoslovakia vetoed by the Soviet Union: ten for, the Soviet Union and Hungary against, Algeria, India and Pakistan abstaining. The Cabinet meets.'
    n: 'FRUS 1964–68, XVII, doc. [84](https://history.state.gov/historicaldocuments/frus1964-68v17/d84). Check: the Security Council''s records, the draft resolution and the vote. See [[cal.1968-08-20.soviet-union]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-08-22.elections-1968
    when: Aug. 22
    date: '1968-08-22'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: 'Chicago, the streets. The Mobilization''s march permits refused; some 12,000 police on twelve-hour shifts, about 6,000 of the Illinois National Guard, some 6,000 Army troops (Check). Police shoot a youth of 17 in Old Town.'
    n: '[[w.rights-in-conflict]]; [[w.farber-chicago-68]]; [[w.kusch-battleground-chicago]]; [[w.schultz-no-one-was-killed]]; [[w.mailer-miami-and-the-siege-1968]]; [[w.royko-boss]]; [[w.cohen-american-pharaoh]]; [[w.hayden-reunion]]; [[w.gitlin-sixties]]; [[w.conspiracy-trial]]. See [[cal.1968-08-26.elections-1968]]. Names: Daley.'
    tags: [name:daley-richard-j, name:hayden-tom, name:davis-rennie, name:dellinger-david, name:hoffman-abbie, name:rubin-jerry, state:il, city:chicago]

  - id: cal.1968-08-23.soviet-union-czechoslovakia
    when: Aug. 23
    date: '1968-08-23'
    thread: soviet-union-czechoslovakia
    c: 'The congressional leaders briefed on Czechoslovakia, the Cabinet Room. Helms: the Romanians afraid that a move on Czechoslovakia would bring one on Romania.'
    n: 'FRUS 1964–68, XVII, docs. [85](https://history.state.gov/historicaldocuments/frus1964-68v17/d85), [87](https://history.state.gov/historicaldocuments/frus1964-68v17/d87). Made public: FRUS 1964–68, XVII (1996). See [[cal.1968-08-20.soviet-union]]. Names: Helms, Johnson.'
    tags: [name:helms-richard, name:johnson-lyndon-b]

  - id: cal.1968-08-23.transportation
    when: Aug. 23
    date: '1968-08-23'
    thread: transportation
    also: [conservation, states-and-cities]
    c: 'Federal-Aid Highway Act signed, [82 Stat. 815](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg815.pdf): the interstate program through 1974, 1,500 miles added; relocation aid for families displaced. Johnson, Aug. 24: it weakens highway beautification and the protection of parks; "by far the most objectionable feature," the order to build all the interstate routes in the District of Columbia, four projects begun within thirty days. He would have vetoed it but for the Secretary of Transportation''s authority. The House had refused to recommit the conference report to strike the beautification funds, [165–169](https://voteview.com/rollcall/RH0900406), July 26.'
    n: 'Statement by the President Upon Signing the Federal-Aid Highway Act of 1968, [1968–69 Pub. Papers 908](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=218) (Aug. 24, 1968). Statute (K–J Cong. II.J.2). See [[cal.1966-10-15.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, city:washington]
  - id: cal.1968-08-24.specials
    when: Aug. 24
    date: '1968-08-24'
    thread: specials
    c: 'Texas 3d, special. Collins (R), who ran against Pool in 1966, takes the seat of Pool (D), who died July 14: 60.0 percent; Elizabeth Pool (D), his widow, 40.0. A Republican gain.'
    n: 'Votes: [Wikipedia, "1968 United States House of Representatives elections"](https://en.wikipedia.org/wiki/1968_United_States_House_of_Representatives_elections). Check: the Texas Secretary of State''s returns. [[w.davidson-race-and-class-in]]. See [[cal.1968-03-12.specials]]. Names: Collins, Joe Pool, Elizabeth Pool.'
    tags: [special:1968-08-24-h-TX-3, name:collins-james-m, name:pool-joe-r, name:pool-elizabeth, state:tx, city:dallas]
  - id: cal.1968-08-24.testing
    when: Aug. 24
    date: '1968-08-24'
    thread: testing
    c: 'Fangataufa, French Polynesia: France explodes its first thermonuclear device, Canopus, under a balloon, some 2.6 megatons (Check the yield). France the fifth nation to test one; not a party to the nonproliferation treaty.'
    n: '[[w.kohl-french-nuclear-diplomacy]]. See [[cal.1967-06-17.testing]].'
  - id: cal.1968-08-25.opinion
    when: Aug. 25
    date: '1968-08-25'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 7–12: the party more likely to keep the United States out of World War III: Republican 41 percent, Democratic 23, no difference 19.'
    n: '[[w.gallup-poll]], III, 2156–57.'
  - id: cal.1968-08-25.elections-1968-chicago
    when: Aug. 25–27
    date: '1968-08-25'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: 'Chicago. Each night the police clear Lincoln Park after the 11 p.m. curfew, with clubs and tear gas.'
    n: 'See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]

  - id: cal.1968-08-26.soviet-union-czechoslovakia
    when: Aug. 26
    date: '1968-08-26'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: 'Moscow. Svoboda and Husák, then Dubček and the others, in talks from Aug. 23, sign the Moscow protocol; the troops stay (Check the day).'
    n: 'See [[cal.1968-08-20.soviet-union]]. Names: Svoboda, Husák, Dubček.'
    tags: [name:svoboda-ludvik, name:husak-gustav, name:dubcek-alexander]

  - id: cal.1968-08-26.elections-1968
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    c: 'Democratic National Convention opens, Chicago, at the International Amphitheatre. The party''s primaries: map and returns below.'
    n: CQ Guide 6th (2010) 409–411. See [[cal.1968-03-12.elections-1968]].
    tags: [primaries:1968-D]
  - id: cal.1968-08-26.elections-1968-2
    when: Aug. 26
    date: '1968-08-26'
    thread: elections-1968-chicago
    also: [voting-rights, mississippi, georgia]
    c: 'Chicago. Credentials, the committee under Hughes of New Jersey: Mississippi''s regular delegation unseated, the Loyal Democrats, Aaron Henry among them, seated; Georgia''s seats divided between Maddox''s regulars and Bond''s challengers; the Texas regulars under Connally and the Alabama regulars, with a loyalty pledge, seated (Check the votes).'
    n: '[Johnson, Murphy and Jones, 8:04 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-charles-murphy-and-jim-jones-august-26-1968), Conversation WH6808-01-13313 (Miller Center). FRUS 1964–68, VI, doc. [339](https://history.state.gov/historicaldocuments/frus1964-68v06/d339). Check: the convention''s *Official Proceedings*. [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.dittmer-local-people]]. See [[cal.1968-08-26.elections-1968]]. Names: Hughes, Henry, Maddox, Bond, Connally, Johnson.'
    tags: [name:hughes-richard-j, name:henry-aaron, name:maddox-lester, name:bond-julian, name:connally-john, name:murphy-charles-s, name:johnson-lyndon-b, state:ms, state:ga, state:tx, state:al]

  - id: cal.1968-08-27.elections-1968-chicago
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    c: 'Chicago. The unit rule abolished, and the rules committee''s minority report adopted: every Democrat a "full and timely opportunity" to take part in choosing the delegates of 1972 (Check the votes).'
    n: 'Check: the convention''s *Official Proceedings*. [[w.shafer-quiet-revolution]]. See [[cal.1968-08-26.elections-1968]].'

  - id: cal.1968-08-27.elections-1968-ak
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968
    also: [war-opposition]
    c: 'Alaska''s primary, every party on one ballot. Democratic, for the Senate: Gravel, once Speaker of the State House, 17,971, 52.9 percent, over Gruening, Senator since statehood, 16,015, 47.1. Republican: Rasmuson, an Anchorage banker, 10,320, 53.1; Stevens 9,111, 46.9.'
    n: 'Votes: [Wikipedia, "1968 United States Senate election in Alaska"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Alaska), from Our Campaigns; Check: [Alaska, *Official Returns by Election Precincts, Primary Election, August 27, 1968*](https://www.elections.alaska.gov/Core/Archive/68PRIM/68prim.pdf) (refused from here: the site''s certificate). [[w.gruening-many-battles]]; [[w.gravel-political-odyssey]]; [[w.naske-alaska]]. See [[cal.1966-11-08.governors-ak]]. Names: Gravel, Gruening, Rasmuson, Stevens.'
    tags: [state:ak, name:gravel-mike, name:gruening-ernest, name:rasmuson-elmer-e, name:stevens-ted-f]
  - id: cal.1968-08-27.state-constitutions-ok
    when: Aug. 27 and Sept. 17
    date: '1968-08-27'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Oklahoma, with the primary, Aug. 27, adopts six amendments: intangible personal property no longer taxed, 329,848 to 92,710; appropriations held to the Board of Equalization''s estimate of revenues; a Board of Legislative Compensation to fix the legislators'' pay, 201,107 to 177,672. Two refused, a new Pardon and Parole Board among them, 182,742 to 197,219. With the runoff, Sept. 17: the initiative''s new judicial article rejected, 115,771 to 172,711; six-member juries for misdemeanors, 170,854 to 97,736, and four others adopted.'
    n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-5 to C-12](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=6) (State Questions 441–462; the Board prints State Question 461''s vote as 460''s, Check). [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1967-07-11.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1968-08-28.elections-1968
    when: Aug. 28
    date: '1968-08-28'
    thread: elections-1968-chicago
    also: [vietnam]
    c: 'Chicago. The platform''s plank on Vietnam: stop all bombing of the North "when this action would not endanger the lives of our troops in the field," taking "into account the response from Hanoi." The minority plank, McCarthy''s and McGovern''s, for an unconditional halt, defeated, 1,567¾ to 1,041¼ (Check). Johnson''s message read: his name not to be considered. Ribicoff, nominating McGovern: "Gestapo tactics on the streets of Chicago." Humphrey nominated on the first ballot after midnight: 1,759¼; McCarthy 601, McGovern 146½, Channing Phillips of the District 67½, Moore of North Carolina 17½, Edward Kennedy 12¾.'
    n: '[1968 Democratic Party Platform](https://www.presidency.ucsb.edu/documents/1968-democratic-party-platform) (Aug. 26, 1968); Message to the Democratic National Convention Prior to the Nomination of a Presidential Candidate, [1968–69 Pub. Papers 917](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=227) (Aug. 28, 1968); The President''s News Conference Held on His 60th Birthday at Austin, Texas, [1968–69 Pub. Papers 914](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=224) (Aug. 27, 1968). [Johnson and Daley, 4:08 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-august-27-1968), Aug. 27, Conversation WH6808-03-13327 (Miller Center). Votes: [Wikipedia, "1968 Democratic National Convention"](https://en.wikipedia.org/wiki/1968_Democratic_National_Convention). Check: the *Official Proceedings*. [[w.solberg-hubert-humphrey]]; [[w.humphrey-education-of-a-public-1976]]; [[w.eisele-almost-to-the-presidency]]; [[w.mccarthy-year-of-the-people]]; [[w.johns-price-of-loyalty]]; [[w.witcover-year-the-dream-died]]; [[w.gould-1968]]; [[w.lafeber-deadly-bet]]. See [[cal.1968-08-26.elections-1968-2]]. Names: McCarthy, McGovern, Ribicoff, Humphrey, Phillips, Moore, Edward Kennedy, Daley, Johnson.'
    tags: [name:mccarthy-eugene-j, name:mcgovern-george, name:ribicoff-abraham, name:humphrey-hubert-h, name:phillips-channing-e, name:moore-dan-k, name:kennedy-edward-m, name:daley-richard-j, name:johnson-lyndon-b]
  - id: cal.1968-08-28.elections-1968-chicago
    when: Aug. 28
    date: '1968-08-28'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: 'Chicago. From Grant Park, the march stopped; at Michigan Avenue and Balbo, in front of the Conrad Hilton, the police club demonstrators, onlookers and reporters, on television: "The whole world is watching." Some 668 arrests in the week (Check).'
    n: 'See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]

  - id: cal.1968-08-28.latin-america
    when: Aug. 28
    date: '1968-08-28'
    thread: latin-america
    c: 'Guatemala City, Avenida Reforma, about 3 p.m.: Ambassador Mein killed, his car forced to the curb, shot as he ran; the Rebel Armed Forces (FAR) claim it. The first American ambassador killed in office.'
    n: 'FRUS 1964–68, XXXI, doc. [114](https://history.state.gov/historicaldocuments/frus1964-68v31/d114). [[w.rabe-killing-zone]]. See [[cal.1967-04-11.latin-america]]. Names: Mein.'
    tags: [name:mein-john-g]
  - id: cal.1968-08-28.opinion
    when: Aug. 28
    date: '1968-08-28'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 7–12: registered to vote where they live: yes 75 percent, no 25. Not registered: those 21 to 29, 49; 30 to 49, 24; 50 and over, 16; Republicans 16, Democrats 24, independents 33. Negroes, nearly four in ten not registered.'
    n: '[[w.gallup-poll]], III, 2157.'
  - id: cal.1968-08-29.elections-1968
    when: Aug. 29
    date: '1968-08-29'
    thread: elections-1968-chicago
    c: 'Chicago. Muskie nominated for Vice President, Humphrey''s choice, 1,942½; Bond, nominated, too young to serve, 48½. Humphrey''s acceptance: "neither mob violence nor police brutality have any place in America." Johnson by telephone to Humphrey through the day; to Muskie and Daley in the evening.'
    n: '[Address Accepting the Presidential Nomination at the Democratic National Convention in Chicago](https://www.presidency.ucsb.edu/documents/address-accepting-the-presidential-nomination-the-democratic-national-convention-chicago-2) (Aug. 29, 1968). [Johnson and Humphrey, 10:41 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-august-29-1968), Conversation WH6808-04-13330; [Johnson and Muskie, 7:19 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-edmund-muskie-and-lady-bird-johnson-august-29), Conversation WH6808-05-13343; [Johnson and Daley, 7:31 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-august-29-1968), Conversation WH6808-05-13344 (Miller Center). Votes: [Wikipedia, "1968 Democratic National Convention"](https://en.wikipedia.org/wiki/1968_Democratic_National_Convention). [[w.lippman-muskie]]; [[w.muskie-journeys]]. See [[cal.1968-08-28.elections-1968]]. Names: Muskie, Humphrey, Bond, Daley, Johnson.'
    tags: [name:muskie-edmund-s, name:humphrey-hubert-h, name:bond-julian, name:daley-richard-j, name:johnson-lyndon-b]
  - id: cal.1968-08-30.soviet-union-czechoslovakia
    when: Aug. 30
    date: '1968-08-30'
    thread: soviet-union-czechoslovakia
    c: 'San Antonio, Johnson, on reports of pressure on Romania: "let no one unleash the dogs of war."'
    n: 'Remarks in San Antonio at the Annual Convention of Milk Producers, Inc, [1968–69 Pub. Papers 917](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=227) (Aug. 30, 1968). See [[cal.1968-08-20.soviet-union]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-08-30.trade
    when: Aug. 30
    date: '1968-08-30'
    thread: trade
    c: Executive Order 11425. Roth, the Special Representative for Trade Negotiations, to make a long-range study of foreign trade policy after the Kennedy Round and recommend legislation, with the views of members of Congress and the Public Advisory Committee on Trade Policy.
    n: '[Executive Order 11425—Study of United States Foreign Trade Policy](https://www.presidency.ucsb.edu/documents/executive-order-11425-study-united-states-foreign-trade-policy) (Aug. 30, 1968). [[w.zeiler-american-trade-and-power]]. See [[cal.1967-11-27.trade]]. Names: Roth, Johnson.'
    tags: [name:johnson-lyndon-b, name:roth-william-m]
