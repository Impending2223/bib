    thread: immigration
    c: 'The Protocol Relating to the Status of Refugees, endorsed by the General Assembly in December 1966, sent to the Senate for accession: refugees not to be expelled or returned to a country where they would face persecution.'
    n: 'Special Message to the Senate Transmitting the Protocol Relating to the Status of Refugees, [1968–69 Pub. Papers 868](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=178) (Aug. 1, 1968). [[w.cq-weekly-report]], Aug. 16, 1968, 2220 (the message''s text). See [[cal.1968-07-01.immigration]]. Names: Johnson.'
