    when: Aug. 14
    date: '1968-08-14'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Rennie Davis to Daley, a telegram: an emergency meeting of city officials on the permits.'
    n: '[[w.rights-in-conflict-convention-week]], 65. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis, Daley.'
    tags: [name:davis-rennie, name:daley-richard-j, state:il, city:chicago]
  - id: cal.1968-08-15.economy
    when: Aug. 15
    date: '1968-08-15'
    thread: economy
    c: 'The Federal Reserve cuts the discount rate from 5½ percent to 5¼. Johnson: confirms the fall in interest rates since the Revenue and Expenditure Control Act; funds for more homebuilding.'
    n: 'Statement by the President on the Reduction in the Discount Rate by the Board of Governors of the Federal Reserve System, [1968–69 Pub. Papers 891](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=201) (Aug. 15, 1968). To check: [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]. See [[cal.1968-06-20.economy]]. Names: Martin, Johnson.'
    tags: [name:johnson-lyndon-b, name:martin-william-mcchesney-jr]
  - id: cal.1968-08-16.defense
    when: Aug. 16
    date: '1968-08-16'
    thread: defense
    also: [testing]
    c: 'Multiple independently targetable reentry vehicles flight-tested for the first time: the Minuteman III from Cape Kennedy, the Poseidon from a pad there (Check the details). The same day the Committee of Principals'' proposal for the strategic arms talks goes to Johnson, agreed unanimously.'
    n: 'FRUS 1964–68, XI, doc. [273](https://history.state.gov/historicaldocuments/frus1964-68v11/d273). Check: the Defense Department''s announcement. To check: [[w.greenwood-making-the-mirv]]; [[w.newhouse-cold-dawn]]. See [[cal.1967-09-18.defense]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-16.health
    when: Aug. 16
    date: '1968-08-16'
    thread: health
    c: 'Health Manpower Act signed, [82 Stat. 773](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg773.pdf): the programs of aid to the schools of medicine, dentistry and nursing and their students extended and enlarged. A National Eye Institute in the National Institutes of Health, [82 Stat. 771](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg771.pdf). The House had passed the manpower bill, [350–0](https://voteview.com/rollcall/RH0900414), Aug. 1.'
    n: 'Statement by the President Upon Signing the Health Manpower Act of 1968, [1968–69 Pub. Papers 892](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=202) (Aug. 17, 1968); Statement by the President Upon Signing Bill Establishing the National Eye Institute, [1968–69 Pub. Papers 891](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=201) (Aug. 17, 1968). Statute (K–J Cong. II.J.2). See [[cal.1963-09-24.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-16.elections-1968-chicago
    when: Aug. 16
    date: '1968-08-16'
    thread: elections-1968-chicago
    also: [democratic-party, war-opposition]
    c: 'The Mobilization''s spokesmen, the Yippies with them, confront Bailey at a press conference: he will speak to Daley, but the decisions are the city''s, not the party''s.'
    n: '[[w.rights-in-conflict-convention-week]], 65. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Daley.'
    tags: [name:daley-richard-j, state:il, city:chicago]
  - id: cal.1968-08-16.elections-1968-chicago-2
    when: Aug. 16
    date: '1968-08-16'
    thread: elections-1968-chicago
    also: [defense]
    c: 'Washington. Dunn, called by the Defense Department, with the Under Secretary of the Army for civil disturbances, the Army''s director of civil disturbance planning and the Secret Service: questioned on Demcon. Federal troops not to be used until the Guard is called. No decision while he is there.'
    n: '[[w.rights-in-conflict-convention-week]], 114. See [[cal.1968-01.elections-1968-chicago]].'
    tags: [state:dc, city:washington]
  - id: cal.1968-08-17.elections-1968-chicago
    when: Aug. 17
    date: '1968-08-17'
    thread: elections-1968-chicago
    c: 'Springfield, Ill., noon. Shapiro to Dunn and his advisers: the Illinois National Guard to be called to state active duty for convention week; the decision secret until Aug. 20.'
    n: '[[w.rights-in-conflict-convention-week]], 114–15. See [[cal.1968-01.elections-1968-chicago]]. Names: Shapiro.'
    tags: [name:shapiro-samuel-h, state:il]
  - id: cal.1968-08-17.elections-1968-chicago-2
    when: Aug. 17
    date: '1968-08-17'
    thread: elections-1968-chicago
    also: [black-nationalism]
    c: Chicago. Black Panthers arrested near a church where McCarthy is speaking; weapons and ammunition in their car.
    n: '[[w.rights-in-conflict-convention-week]], 56. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j, state:il, city:chicago]
  - id: cal.1968-08-18.vietnam
    when: Aug. 18
    date: '1968-08-18'
    thread: vietnam-paris
    also: [elections-1968]
    c: 'Johnson by telephone from the ranch to Nixon and then Humphrey: Hanoi waiting on the conventions. To Humphrey, after Humphrey''s *Face the Nation*: "We''d be glad to stop it again if they''d just tell us they won''t kill extra men because we do stop it."'
    n: '[Johnson and Nixon, 5:01 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-august-18-1968), Conversation WH6808-01-13306; [Johnson and Humphrey, 5:23 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-august-18-1968), Conversation WH6808-01-13307 (Miller Center). FRUS 1964–68, VI, doc. [330](https://history.state.gov/historicaldocuments/frus1964-68v06/d330). To check: [[w.johns-price-of-loyalty]]; [[w.solberg-hubert-humphrey]]. See [[cal.1968-07-29.vietnam]]. Names: Nixon, Humphrey, Johnson.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-08-18.consumers
    when: Aug. 18
    date: '1968-08-18'
    thread: consumers
    also: [farm]
    c: 'Wholesome Poultry Products Act signed, [82 Stat. 791](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg791.pdf): poultry sold within a State to be inspected to federal standards, by the State or, where it fails, by the Department of Agriculture, as under the Wholesome Meat Act. Johnson: 1.6 billion pounds, 13 percent of the supply, little or not inspected. The Senate had passed it, [73–0](https://voteview.com/rollcall/RS0900523), July 29.'
    n: 'Statement by the President Upon Signing the Wholesome Poultry Products Act, [1968–69 Pub. Papers 895](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=205) (Aug. 19, 1968). Statute (K–J Cong. II.J.2). See [[cal.1967-12-15.consumers]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-18.opinion
    when: Aug. 18
    date: '1968-08-18'
    thread: opinion
    also: [economy, jobs-and-wages]
    c: 'Gallup, July 18–23: the biggest threat to the country in the future: big government 46 percent, big labor 26, big business 12. Republicans 48, 32 and 9; Democrats 41, 23 and 14; independents 54, 23 and 10. Negroes and those with family incomes under $3,000 divided between big business and big labor.'
    n: '[[w.gallup-poll]], III, 2154.'
  - id: cal.1968-08-18.vietnam-operations
    when: Aug. 18
    date: '1968-08-18'
    thread: vietnam-operations
    c: 'The third offensive. In Tây Ninh Province, from the night of Aug. 17–18: Tây Ninh City attacked; sappers into the relay station on Núi Bà Đen; the 5th Division''s regiments on the roads to Dầu Tiếng. In II Corps, a Special Forces camp in Kon Tum attacked the same morning.'
    n: '[[w.villard-united-states-army-in]], 646–649, 658; [[w.vietnam-victory-in-vietnam]], 230–31 (Aug. 17–Sept. 30, after a Politburo meeting in August); [[w.cosmas-joint-chiefs-of-staff]], 216–17, 230 (the night of Aug. 17–18; Tây Ninh).'
