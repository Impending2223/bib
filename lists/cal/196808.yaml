    c: Miami, Liberty City, during the Republican convention. A rally at the Vote Power League's building, Aug. 7, ends in stoning and burning; Aug. 8, after Kirk and the county's leaders fail to come back to meet the neighborhood's spokesmen, looting and fire-bombing. The police kill three Negroes (Check). The National Guard, a curfew; over by Aug. 9. Kirk and Abernathy had come from Miami Beach.
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2140–41 (the violence of Aug. 7 and 8; three killed, by reports). Check: the Miami Study Team''s report to the National Commission on the Causes and Prevention of Violence (1969). Check: CQ has the violence of Aug. 7 begin after white newsmen were put out of a meeting of the Vote Power League; Aug. 7, 10:44 p.m., NBC: 70 policemen with shotguns sent in; Aug. 8, "three persons were killed," by reports, no word of the police ([[w.cq-weekly-report]], Aug. 9, 1968, 2140–41). To check: [[w.dunn-black-miami-in-the]]. See [[cal.1967-12-26.crime-and-hijacking-miami]]. Names: Kirk, Abernathy.'
    src:
