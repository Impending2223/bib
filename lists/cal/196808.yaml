    when: Aug. 10
    date: '1968-08-10'
    thread: elections-1968
    also: [vietnam]
    c: 'The LBJ Ranch, 12:25 p.m. Johnson briefs Nixon and Agnew, with Rusk, Helms and Vance, back from Paris. Helms: Czechoslovakia "eased, not over"; Vietnam "at the tensest point." Lunch after.'
    n: 'FRUS 1964–68, VI, doc. [327](https://history.state.gov/historicaldocuments/frus1964-68v06/d327); XVII, doc. [78](https://history.state.gov/historicaldocuments/frus1964-68v17/d78). [[w.nixon-rn]], 316 (the briefing at the ranch; lunch). Made public: the notes, FRUS 1964–68, XVII (1996) and VI (2002). See [[cal.1968-07-26.elections-1968]]. Names: Nixon, Agnew, Rusk, Helms, Vance, Johnson.'
