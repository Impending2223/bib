    c: 'Johnson''s sixtieth birthday, at the Ranch. Dirksen, by telephone, 11:15 a.m.: "Are you any closer to going out there to that convention?" Johnson: "I haven''t made any plans to go and rather doubt that I will." Calls to Daley, Criswell and others in the afternoon; at 4:40 to Humphrey: he will not come to Chicago. Christian tells the press. Connally had found the Southern governors against a draft, by his account.'
