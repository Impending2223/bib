  - id: cal.1968-08-05.africa
    when: Aug. 5
    date: '1968-08-05'
    thread: africa
    c: 'Addis Ababa. Nigeria''s federal government and Biafra open talks under the Organization of African Unity''s Consultative Committee, Haile Selassie its chairman. Johnson to him: relief supplies "already nearby," the Red Cross ready; "the political aspects of the problem obviously must be settled by the parties." Aug. 15, Johnson to Gowon, on the relief flights; Gowon had already refused the Red Cross''s proposal of an airstrip.'
    n: 'Message to Haile Selassie, Chairman of the Consultative Committee on Nigeria of the Organization of African Unity, [1968–69 Pub. Papers 875](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=185) (Aug. 5, 1968). FRUS 1964–68, XXIV, docs. [398](https://history.state.gov/historicaldocuments/frus1964-68v24/d398), [399](https://history.state.gov/historicaldocuments/frus1964-68v24/d399). [[w.cq-weekly-report]], Aug. 16, 1968, 2219 (the message''s text). Check: CQ lists a message to Haile Selassie on the food shortage in Nigeria, Aug. 3, besides this one; the Papers print none of that day ([[w.cq-weekly-report]], Aug. 30, 1968, 2343). See [[cal.1968-07-11.africa]]. Names: Haile Selassie, Gowon, Johnson.'
    tags: [name:johnson-lyndon-b, name:haile-selassie-i, name:gowon-yakubu]
