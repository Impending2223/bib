    c: 'Rockefeller, with his family at the Americana, 2:15 a.m.: Nixon''s nomination "a spectacular success"; he has called to congratulate him, and will campaign for him.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2096, 2141. Names: Rockefeller, Nixon.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1968-08-08.elections-1968-miami-4
    when: Aug. 8
    date: '1968-08-08'
    thread: elections-1968-miami
    c: 'Agnew''s news conference: "rather shocked" to be chosen; neither liberal nor conservative; picked for his knowledge of the cities and local government. The first Marylander on a national ticket.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2097, 2141. Names: Agnew.'
    tags: [name:agnew-spiro-t, state:md]
  - id: cal.1968-08-08.elections-1968-miami-5
    when: Aug. 8
    date: '1968-08-08'
    thread: elections-1968-miami
    c: 'Republicans on Agnew: Tower, "a creditable ticket"; Percy, "a distinguished Governor"; Buena Chaney, Indiana''s chairman, "completely took me by surprise."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2097. Names: Tower, Percy, Agnew.'
    tags: [name:tower-john-g, name:percy-charles-h, name:agnew-spiro-t]
  - id: cal.1968-08-08.elections-1968-miami-6
    when: Aug. 8
    date: '1968-08-08'
    thread: elections-1968-miami
    c: 'Romney''s press conference, 4:30 p.m.: he persuaded Michigan''s delegation not to lead a floor fight against Agnew.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2141. Names: Romney, Agnew.'
    tags: [name:romney-george-w, name:agnew-spiro-t]
  - id: cal.1968-08-08.elections-1968-miami-7
    when: Aug. 8
    date: '1968-08-08'
    thread: elections-1968-miami
    c: 'Rockefeller''s aides: Nixon did not consult him on a running mate; "a snub."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2141. Names: Rockefeller, Nixon.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1968-08-08.elections-1968-miami-8
    when: Aug. 8
    date: '1968-08-08'
    thread: elections-1968-miami
    c: Lindsay refuses to let his name be put in nomination for Vice President; he seconds Agnew.
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2097. Names: Lindsay, Agnew.'
    tags: [name:lindsay-john-v, name:agnew-spiro-t]
  - id: cal.1968-08-08.elections-1968-miami-9
    when: Aug. 8
    date: '1968-08-08'
    thread: elections-1968-miami
    c: 'Agnew to the convention, thirteen minutes: Nixon''s reasons "not directed at me," but "to provide the strongest ticket in November."'
