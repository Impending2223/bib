    c: 'Kansas, Republican primary for governor: Harman, a businessman, over Crutcher, the lieutenant governor, 133,454 to 128,635, 48.9 percent, a 4,819-vote margin; one other 10,879, 4.0 percent. Governor Docking, seeking a second two-year term, unopposed. Docking re-elected in November over Harman, 447,269 to 410,673, 51.9 percent.'
    n: 'Votes: Kan. Secretary of State, [*Election Statistics, 1968*, 18–19](https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/61/download#page=17): Harman 133,454, Crutcher 128,635, Van Skiver 10,879; Docking 134,722, unopposed; [83–84](https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/61/download#page=82): Docking 447,269, Harman 410,673, Uncapher (Prohibition) 4,528. [Wikipedia, "1968 Kansas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Kansas_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. To check: [[w.socolofsky-kansas-governors]]; [[w.peirce-great-plains-states-of]]. See [[cal.1966-11-08.governors-ks]]. Names: Harman, Crutcher, Docking.'
    src:
      c: '20353665'
      rows:
        - 'https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/61/download#page=17: A-C'
        - 'https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/61/download#page=82: D'
        - 'https://en.wikipedia.org/wiki/1968_Kansas_gubernatorial_election: all'
    tags: [state:ks, name:harman-rick, name:crutcher-john-w, name:docking-robert]
