  - id: cal.1968-08-27.elections-1968-chicago-3
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition, soviet-union-czechoslovakia]
    c: Chicago. Two marches to the Polish Consulate against Poland's part in the invasion of Czechoslovakia, the second about 75 from Lincoln Park; no incidents.
    n: '[[w.rights-in-conflict-convention-week]], 183–84. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-27.elections-1968-chicago-4
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago, the Church of the Three Crosses. Some 50 Lincoln Park clergymen and residents form the Lincoln Park Emergency Citizens Committee: police to lift the ban on sleeping in the park. The clergy to hold a prayer vigil in the park from 11 p.m., against the curfew. At 4 p.m. a delegation sees the 18th District''s commander.'
    n: '[[w.rights-in-conflict-convention-week]], 184–85. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-27.press-and-broadcasting
    when: Aug. 27
    date: '1968-08-27'
    thread: press-and-broadcasting
    also: [elections-1968-chicago]
    c: 'Chicago, police headquarters, 3:30 p.m. Conlisk with the city''s editors and the networks'' and magazines'' men on the beatings of newsmen: individual deviations to be investigated; names and photographs given him.'
    n: '[[w.rights-in-conflict-convention-week]], 317–20. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-27.elections-1968-chicago-5
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition, black-nationalism]
    c: 'Chicago, Lincoln Park, about 7 p.m. Seale of the Black Panthers and Rubin to some 1,500: revolution. Seale: "get your shotguns."'
    n: '[[w.rights-in-conflict-convention-week]], 186–88. See [[cal.1968-08-22.elections-1968]]. Names: Seale, Rubin.'
    tags: [name:seale-bobby, name:rubin-jerry, state:il, city:chicago]
  - id: cal.1968-08-27.elections-1968-chicago-6
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition, labor-disputes]
    c: Chicago. From Lincoln Park, a march to the CTA bus barn at Clark and Schubert for the striking Negro bus drivers; at 9 p.m. the police let it circle the barn, not enter.
    n: '[[w.rights-in-conflict-convention-week]], 186, 189–90. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-27.elections-1968-chicago-7
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago, the Coliseum. The "un-birthday party" for Johnson, some 3,000: Gregory, Ginsberg, Genet, Burroughs, Southern against the police and Daley. Dellinger: probably a march to the Amphitheatre Wednesday, after the rally in Grant Park.'
    n: '[[w.rights-in-conflict-convention-week]], 206–08. See [[cal.1968-08-22.elections-1968]]. Names: Gregory, Dellinger, Johnson, Daley.'
    tags: [name:gregory-dick, name:dellinger-david, name:johnson-lyndon-b, name:daley-richard-j, state:il, city:chicago]
  - id: cal.1968-08-27.press-and-broadcasting-2
    when: Aug. 27
    date: '1968-08-27'
    thread: press-and-broadcasting
    also: [elections-1968-chicago]
    c: 'Chicago, the Amphitheatre floor. Rather of CBS, on the air, asking why a Georgia delegate is being removed, is punched in the stomach by a security man, an employee of the sergeant-at-arms. Cronkite: "a bunch of thugs here."'
    n: '[[w.rights-in-conflict-convention-week]], 321. See [[cal.1968-08-22.elections-1968]]. Names: Cronkite.'
    tags: [name:cronkite-walter, state:il, city:chicago]
  - id: cal.1968-08-27.elections-1968-chicago-8
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: Chicago, Lincoln Park, Tuesday night. The clergy's vigil, a wooden cross, the barricade put up again; police mass at 11:30 p.m. After midnight tear gas at the cross, then a sanitation truck's gas sprayer; the crowd driven into Clark Street and Old Town; police smash the windows of cars parked there.
    n: '[[w.rights-in-conflict-convention-week]], 191–204. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-27.elections-1968-chicago-9
    when: Aug. 27
    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago. The Park District''s permit for the Mobilization''s rally at the Grant Park bandshell, Aug. 28, 1 to 4 p.m., delivered in the evening: no literature to be handed out; $100,000 to $300,000 of liability insurance. The policy never obtained.'
    n: '[[w.rights-in-conflict-convention-week]], 68, 217. See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-27.elections-1968-chicago-10
    when: Aug. 27–28
    date: '1968-08-27'
    thread: elections-1968-chicago
    also: [war-opposition, civil-disorders]
    c: 'Chicago, Grant Park, across from the Hilton. Marchers from Lincoln Park and the Coliseum; some 3,000 facing the police at 12:21 a.m. At 1:35 a.m. the deputy superintendent: they may stay the night if peaceful, east of Michigan Avenue. About 3 a.m. 600 of the Guard relieve the police, for the first time in the week.'
    n: '[[w.rights-in-conflict-convention-week]], 206–14 (the 700 police at the Hilton on twelve-hour shifts since Saturday, on duty 15 hours). See [[cal.1968-08-22.elections-1968]].'
    tags: [state:il, city:chicago]
  - id: cal.1968-08-28.elections-1968
    when: Aug. 28
    date: '1968-08-28'
    thread: elections-1968-chicago
    also: [vietnam]
    c: 'Chicago. The platform''s plank on Vietnam: stop all bombing of the North "when this action would not endanger the lives of our troops in the field," taking "into account the response from Hanoi." The minority plank, McCarthy''s and McGovern''s, for an unconditional halt, defeated, 1,567¾ to 1,041¼ (Check). Johnson''s message read: his name not to be considered. Ribicoff, nominating McGovern: "Gestapo tactics on the streets of Chicago." Humphrey nominated on the first ballot after midnight: 1,759¼; McCarthy 601, McGovern 146½, Channing Phillips of the District 67½, Moore of North Carolina 17½, Edward Kennedy 12¾.'
