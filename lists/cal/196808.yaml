    c: 'Michigan''s primaries for the House, the incumbents renominated. 3rd District: Thomas L. Keenan over Richard L. McAnaw, 3,866 to 2,412, 61.6 percent. 7th: William R. Blue over Edwin L. Knopf, 8,245 to 3,886, 68.0 percent. 11th: Clevenger over Jack B. English, 20,260 to 7,052, 74.2 percent. 13th: Diggs over David Boston, 13,432 to 3,057, 81.5 percent. 16th: Dingell over Zigmund John Niparko, 20,284 to 3,554, 85.1 percent. 19th: Gary R. Frink over Ron Mardiros, 4,772 to 2,390, 66.6 percent. 2nd: Vivian, once its Representative, over two others, about two to one.'
