# Cal. CVI August 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CVI
entries:
  - id: cal.1968-08-01.cities-and-housing
    when: Aug. 1
    date: '1968-08-01'
    thread: cities-and-housing
    c: 'Housing and Urban Development Act signed, [82 Stat. 476](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg476.pdf), on the lawn of HUD''s new building: a goal of 26 million homes in ten years, 6 million of them for low- and moderate-income families; interest subsidies for home ownership (section 235) and rental housing (section 236); a National Housing Partnership of private investors; new communities; urban renewal and public housing extended. Johnson: "the Magna Carta to liberate our cities." Check: the goal''s figures, in the act''s Title XVI.'
    n: 'Remarks Upon Signing the Housing and Urban Development Act of 1968, [1968–69 Pub. Papers 865](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=175) (Aug. 1, 1968). Statute (K–J Cong. II.J.2). See [[cal.1968-07-10.cities-and-housing]]. Names: Weaver, Sparkman, Patman, Johnson.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:sparkman-john, name:patman-wright]
  - id: cal.1968-08-01.immigration
    when: Aug. 1
    date: '1968-08-01'
    thread: immigration
    c: 'The Protocol Relating to the Status of Refugees, endorsed by the General Assembly in December 1966, sent to the Senate for accession: refugees not to be expelled or returned to a country where they would face persecution.'
    n: 'Special Message to the Senate Transmitting the Protocol Relating to the Status of Refugees, [1968–69 Pub. Papers 868](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=178) (Aug. 1, 1968). See [[cal.1968-07-01.immigration]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-01.elections-1968-miami
    when: Aug. 1
    date: '1968-08-01'
    thread: elections-1968-miami
    also: [vietnam]
    c: 'Miami Beach. The Platform Committee''s last open session, Dirksen presiding. Romney: North and South Vietnam, Laos and Cambodia neutralized under guarantee; the NLF''s members in South Vietnam''s politics. Samuel C. Jackson: a unit of the National Committee to make the delegations "fully representative of the black population of each state." Jack McDonald, Young Republicans: a youth plank, the vote at 18, a volunteer army. Executive session from the afternoon; Dirksen: its suite searched for eavesdropping devices.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Dirksen, Romney, Jackson.'
    tags: [name:dirksen-everett, name:romney-george-w, name:jackson-samuel-c, state:fl]
  - id: cal.1968-08-01.elections-1968-miami-2
    when: Aug. 1
    date: '1968-08-01'
    thread: elections-1968-miami
    also: [vietnam]
    c: 'Nixon''s statement on Vietnam for the Platform Committee, released by Klein, 9:37 a.m., his first major statement on the war since the Paris talks began: "a new strategy," on "the economic, political, diplomatic and psychological fronts," not further escalation; small units, the Viet Cong''s infrastructure, police, intelligence, local forces; "more effectively with fewer men and at less cost."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Nixon, Klein.'
    tags: [name:nixon-richard-m, name:klein-herbert-g]
  - id: cal.1968-08-01.elections-1968-miami-3
    when: Aug. 1
    date: '1968-08-01'
    thread: elections-1968-miami
    also: [cities-and-housing]
    c: 'Nixon''s statement on the cities, released by Klein, 2:46 p.m.: federal tax and credit incentives for private enterprise to rebuild the inner cities; jobs; aid to Negro enterprises; "more black ownership, more black control over the destinies of black people."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Nixon, Klein.'
    tags: [name:nixon-richard-m, name:klein-herbert-g]
  - id: cal.1968-08-01.opinion
    when: Aug. 1
    date: '1968-08-01'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Harris, July 25–29, in the morning papers, released early (UPI): Humphrey 41 percent, Nixon 36, Wallace 16; Rockefeller 40, Humphrey 34, Wallace 20; McCarthy 43, Nixon 35, Wallace 15; Rockefeller 40, McCarthy 34, Wallace 19.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102, 2107. Check: CQ''s Scoreboard heads it July 29, its release date by CQ''s note (2107); the chronology, released Aug. 1 (2102). Names: Humphrey, Nixon, Wallace, Rockefeller, McCarthy.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:rockefeller-nelson, name:mccarthy-eugene-j]
  - id: cal.1968-08-01.opinion-2
    when: Aug. 1
    date: '1968-08-01'
    thread: opinion
    also: [elections-1968-polls]
    c: 'New York. Gallup and Harris, a joint statement: no disparity in their polls. Rockefeller "has now moved to an open lead over both possible Democratic candidates"; Nixon against Humphrey and Wallace, close. From Harris, July 13–16; Gallup, July 20–23; Crossley, for Rockefeller, July 21–26; Harris, July 25–29.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Gallup, Harris, Rockefeller, Nixon, Humphrey, Wallace.'
    tags: [name:gallup-george-h, name:harris-louis, name:rockefeller-nelson, name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c, city:nyc]
  - id: cal.1968-08-01.transportation
    when: Aug. 1
    date: '1968-08-01'
    thread: transportation
    c: 'Cleared: the Transportation Department''s appropriation for fiscal 1969, H.R. 18188, $1,634,266,000 in new authority, $297,766,000 under the request. 2,629 new posts in the FAA, 2,399 for air traffic control, exempt from the surcharge act''s cut in employment. Nothing for the SST in fiscal 1969; $30 million rescinded. Both houses take the conference report by voice vote.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2112, 2114.'
  - id: cal.1968-08-01.transportation-2
    when: Aug. 1
    date: '1968-08-01'
    thread: transportation
    c: 'House Government Operations'' Subcommittee on Government Activities, Brooks, on air traffic congestion. Thomas, the FAA''s acting administrator: the worst in the "Golden Triangle," New York, Washington and Chicago. Crooker, the CAB: the Board might divert flights. Kenneth T. Lyons, for the controllers'' union: five near-misses a day at National Airport. Brooks: the government will act if the industry does not.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2117. Names: Brooks, Thomas, Crooker.'
    tags: [name:brooks-jack-b, name:thomas-david-d, name:crooker-john-h-jr]
  - id: cal.1968-08-01.economy-surcharge
    when: Aug. 1
    date: '1968-08-01'
    thread: economy-surcharge
    c: 'The House adopts the conference report on H.R. 15387, 345–24: assault on a postal employee a federal crime; the postal field service exempt from the surcharge act''s cut in employment. Watson had said 83,238 jobs would go; his letter, read by Dulski: the cuts in service canceled "upon enactment." Ford for relief government-wide. The Senate adopted it July 30.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2116. Names: Watson, Dulski, Ford.'
    tags: [name:watson-w-marvin, name:dulski-thaddeus-j, name:ford-gerald-r]
  - id: cal.1968-08-01.elections-1968-2
    when: Aug. 1
    date: '1968-08-01'
    thread: elections-1968
    also: [elections-1968-chicago]
    c: 'McCarthy, interviewed in the *New York Post*: a "50-50 chance" at the convention, "because the big states are pretty loose"; worried at violent demonstrations in Chicago, better "without demonstrations."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2108. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j]
  - id: cal.1968-08-01.elections-1968-3
    when: Aug. 1
    date: '1968-08-01'
    thread: elections-1968
    also: [vietnam-saigon]
    c: 'Humphrey: by "every group" he meant the NLF; Communists may run for office there as here; no "imposing a Communist group in a government." Dzu''s sentence "a definite step backward"; the first in the administration to speak on it.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106. Names: Humphrey, Trương Đình Dzu.'
    tags: [name:humphrey-hubert-h, name:truong-dinh-dzu]
  - id: cal.1968-08-01.congress
    when: Aug. 1
    date: '1968-08-01'
    thread: congress
    also: [elections-1968]
    c: The House authorizes a Special Committee to Investigate Campaign Expenditures, H. Res. 1239.
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2118.'
  - id: cal.1968-08-01.steel
    when: Aug. 1
    date: '1968-08-01'
    thread: steel
    c: The Defense Department orders its buyers to avoid the producers whose increases the administration finds objectionable; some $600 million a year in steel.
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2119.'
  - id: cal.1968-08-01.elections-1968-4
    when: Aug. 1
    date: '1968-08-01'
    thread: elections-1968
    c: 'Tennessee''s primaries for the House. 5th District: Fulton over R. H. Crowder, 33,316 to 13,852, 70.6 percent; Republican, George Kelley over Hamilton Gayden Jr., 3,323 to 1,610, 67.4 percent. 6th: Anderson over John Bragg, 45,352 to 32,379, 58.3 percent; Republican, Ronnie Page over Frank W. Kennedy, 2,514 to 1,329, 65.4 percent. 7th: Blanton over Jack Woodall, 33,994 to 13,641, 71.4 percent.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2108. Check: the counts, unofficial, the 6th and 7th in part (CQ: the 6th''s Democrats, 40 of 407 precincts; the 7th''s, 237 of 411); the State''s canvass. Names: Fulton, Anderson, Blanton.'
    tags: [name:fulton-richard-h, name:anderson-william-r, name:blanton-leonard-r, state:tn]
  - id: cal.1968-08-02.economy-surcharge
    when: Aug. 2
    date: '1968-08-02'
    thread: economy-surcharge
    c: 'H.R. 15387 signed: assault on a postal employee a federal crime; the postal field service exempt from the surcharge act''s cut in employment.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2116. Check: the statute''s cite (Public Law 90-449). Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-02.congress
    when: Aug. 2
    date: '1968-08-02'
    thread: congress
    also: [elections-1968]
    c: 'McCormack names the Special Committee to Investigate Campaign Expenditures: O''Neill, chairman; Neal Smith, John W. Davis, Devine, Kyl.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2118. Names: McCormack, O''Neill, Smith, Davis, Devine, Kyl.'
    tags: [name:mccormack-john-w, name:oneill-thomas-p-jr, name:smith-neal-e, name:davis-john-w, name:devine-samuel-l, name:kyl-john-h]
  - id: cal.1968-08-02.elections-1968-miami
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968-miami
    c: 'Mitchell, Nixon''s campaign manager, at a press conference: "a real Nixon surge" in New York, California, Pennsylvania, Illinois, Ohio, Michigan, New Jersey, Missouri, Wisconsin, Kentucky and Oklahoma.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Mitchell, Nixon.'
    tags: [name:mitchell-john-n, name:nixon-richard-m]
  - id: cal.1968-08-02.elections-1968-miami-2
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968-miami
    c: 'Leslie Slote, Rockefeller''s press secretary: Rockefeller''s strength on the first ballot, 370 votes.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1968-08-02.elections-1968-miami-3
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968-miami
    c: 'The Republican State chairmen meet by region, closed. The Northeast''s, a resolution: Rockefeller the "best candidate to unite our country," the most "helpful" to the party''s candidates in their States.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102–03. Names: Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1968-08-02.elections-1968-miami-4
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968-miami
    c: 'Morton, Nixon''s floor manager: a win on the first ballot, but "prepared...to win on any ballot." Poff his parliamentarian. On the floor besides: MacGregor, Devine, Glenn Davis, Brock, Rumsfeld, Nelsen; Fong; Nunn and Hickel; Callaway; Emil Lockwood of Michigan''s Senate; Stewart Lamprey, president of New Hampshire''s; Linwood Holton.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2103. Names: Morton, Nixon, Poff, MacGregor, Devine, Davis, Brock, Rumsfeld, Nelsen, Fong, Nunn, Hickel, Callaway, Holton.'
    tags: [name:morton-rogers-c-b, name:nixon-richard-m, name:poff-richard-h, name:macgregor-clark, name:devine-samuel-l, name:davis-glenn-r, name:brock-bill, name:rumsfeld-donald, name:nelsen-ancher, name:fong-hiram-l, name:nunn-louie-b, name:hickel-walter-j, name:callaway-howard-h, name:holton-linwood]
  - id: cal.1968-08-02.elections-1968-miami-5
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968-miami
    also: [civil-rights-organizations]
    c: 'Miami. Negro Republicans of Florida and Louisiana sue in the federal district court to keep the States'' all-white delegations from being seated; I. W. William and Von D. Mizell, of the Concerned Negro Republicans of Florida, among them. Defendants: the State chairmen, William Murfin and Charles deGravelles; Bliss; Brooke and Ford, the convention''s chairmen. Murfin "purposely, willfully and consciously" kept Negroes off his slate for the primary; the Contests Committee refused a hearing.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2103. Names: Bliss, Brooke, Ford.'
    tags: [name:bliss-ray-c, name:brooke-edward-w, name:ford-gerald-r, state:fl, state:la]
  - id: cal.1968-08-02.draft
    when: Aug. 2
    date: '1968-08-02'
    thread: draft
    also: [elections-1968]
    c: 'Humphrey: as President he would replace Hershey, who had said Wallace "would be the best candidate" for his office to work with. "The Humphrey Administration will make the needed change." McCarthy has said the same.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106. Names: Humphrey, Hershey, Wallace, McCarthy.'
    tags: [name:humphrey-hubert-h, name:hershey-lewis-b, name:wallace-george-c, name:mccarthy-eugene-j]
  - id: cal.1968-08-02.conservation
    when: Aug. 2
    date: '1968-08-02'
    thread: conservation
    also: [elections-1968]
    c: 'Humphrey, dedicating a retention basin in Michigan: governments to be "active trustees to the environment," science brought to bear, the States and cities to work together.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106. Names: Humphrey.'
    tags: [name:humphrey-hubert-h, state:mi]
  - id: cal.1968-08-02.africa
    when: Aug. 2
    date: '1968-08-02'
    thread: africa
    also: [elections-1968]
    c: 'Humphrey, a statement: an end to the Nigerian war; the nations not to "stand by and permit the children and helpless adults of Biafra to die"; the United States to offer the Red Cross food and supplies again.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106. Names: Humphrey.'
    tags: [name:humphrey-hubert-h]
  - id: cal.1968-08-02.africa-2
    when: Aug. 2
    date: '1968-08-02'
    thread: africa
    also: [elections-1968]
    c: 'McCarthy, a statement: the administration to ask the United Nations for "a mandatory relief airlift of mercy to Biafra," or give planes and supplies to UNICEF; Britain to be urged to stop arms to Nigeria; a division of Nigeria by self-determination until the two agree.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106–07. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j]
  - id: cal.1968-08-02.elections-1968
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968
    c: 'Illinois. The All-Illinois Committee for Humphrey, 166 members: Minow chairman, Adlai E. Stevenson III vice chairman, Douglas honorary chairman; several of them delegates to Chicago.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106. Names: Humphrey, Minow, Adlai E. Stevenson III, Douglas.'
    tags: [name:humphrey-hubert-h, name:minow-newton-n, name:stevenson-adlai-e-iii, name:douglas-paul-h, state:il]
  - id: cal.1968-08-02.elections-1968-2
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968
    c: McCarthy to a retreat near Castine, Me., for a few days' rest.
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2108. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j, state:me]
  - id: cal.1968-08-02.alabama
    when: Aug. 2
    date: '1968-08-02'
    thread: alabama
    c: 'Richmond Flowers, once attorney general, Wallace''s opponent, indicted by a federal grand jury, four counts of extortion: his office used in a conspiracy over stock transactions.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2108. Names: Flowers, Wallace.'
    tags: [name:flowers-richmond-m, name:wallace-george-c, state:al]
  - id: cal.1968-08-02.congress-2
    when: Aug. 2
    date: '1968-08-02'
    thread: congress
    c: Congress recesses to noon, Sept. 4, H. Con. Res. 805, over the two conventions. The Senate in session 130 days, the House 114.
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2142.'
  - id: cal.1968-08-02.court-fortas
    when: Aug. 2
    date: '1968-08-02'
    thread: court-fortas
    c: 'Before the recess, the Senate suspends by unanimous consent paragraph 6 of Rule 38: nominations pending over a recess of more than 30 days, Fortas''s and Thornberry''s among them, need not be sent again.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2142. Names: Fortas, Thornberry.'
    tags: [name:fortas-abe, name:thornberry-william-h]
  - id: cal.1968-08-02.elections-1968-chicago
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968-chicago
    also: [war-opposition]
    c: 'Chicago, the Palmer House. Stahl at breakfast with Rennie Davis and his negotiators: Davis outlines the Mobilization''s plans; Stahl takes notes, will keep in touch.'
    n: '[[w.rights-in-conflict-convention-week]], 62–63 (after a TV interview in which Davis asked the Justice Department to investigate the police, Stahl had refused to meet). See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis.'
    tags: [name:davis-rennie, state:il, city:chicago]
  - id: cal.1968-08-02.elections-1968-chicago-2
    when: Aug. 2
    date: '1968-08-02'
    thread: elections-1968-chicago
    c: 'Dunn with Governor Shapiro: Demcon approved in substance; how they will communicate if the Guard is called.'
    n: '[[w.rights-in-conflict-convention-week]], 113. See [[cal.1968-01.elections-1968-chicago]]. Names: Shapiro.'
    tags: [name:shapiro-samuel-h, state:il]
  - id: cal.1968-08-03.soviet-union-czechoslovakia
    when: Aug. 3
    date: '1968-08-03'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: 'Bratislava: the six parties'' declaration. Beam from Prague, Aug. 4: Dubček "staring down the Soviet threat of force."'
    n: 'FRUS 1964–68, XVII, doc. [77](https://history.state.gov/historicaldocuments/frus1964-68v17/d77). Made public: FRUS 1964–68, XVII (1996). See [[cal.1968-07-15.soviet-union]]. Names: Beam, Dubček.'
    tags: [name:beam-jacob-d, name:dubcek-alexander]
  - id: cal.1968-08-03.steel
    when: Aug. 3
    date: '1968-08-03'
    thread: steel
    c: Johnson extends the Pentagon's order to every agency, buyers of some $700 million a year in steel.
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2119. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-08-03.elections-1968-miami-2
    when: Aug. 3
    date: '1968-08-03'
    thread: elections-1968-miami
    c: 'Robert R. Douglass, Rockefeller''s campaign manager: Nixon "stopped" from a first-ballot nomination.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2103. Names: Rockefeller, Nixon.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1968-08-03.elections-1968-miami-3
    when: Aug. 3
    date: '1968-08-03'
    thread: elections-1968-miami
    c: 'Rockefeller to Miami Beach from New York; a rally at the 72nd Street beach, 3:45 p.m.: Nixon about 550 delegates going into the first ballot.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2103. Names: Rockefeller, Nixon.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m, state:fl]
  - id: cal.1968-08-03.elections-1968-miami-4
    when: Aug. 3
    date: '1968-08-03'
    thread: elections-1968-miami
    also: [space]
    c: 'Rockefeller''s position paper on science: a "new and coherent" national science policy; manned flights put off for unmanned; no "racing the Russians"; a Council of Scientific Advisers in the White House.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2103. Names: Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1968-08-03.opinion
    when: Aug. 3
    date: '1968-08-03'
    thread: opinion
    also: [elections-1968-polls]
    c: 'New York. Burns W. Roper against Gallup and Harris''s statement of Aug. 1: "overly generous" of Gallup to put Rockefeller ahead without Gallup''s data for it; Rockefeller, Nixon, Humphrey and McCarthy "roughly equal, though shifting."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2103. Names: Gallup, Harris, Rockefeller, Nixon, Humphrey, McCarthy.'
    tags: [name:gallup-george-h, name:harris-louis, name:rockefeller-nelson, name:nixon-richard-m, name:humphrey-hubert-h, name:mccarthy-eugene-j, city:nyc]
  - id: cal.1968-08-04.opinion
    when: Aug. 4
    date: '1968-08-04'
    thread: opinion
    also: [vietnam, crime-and-hijacking, civil-rights-the-executive]
    c: 'Gallup, June 26–July 1: the most important problem facing the country: the Vietnam war 52 percent; crime and lawlessness (riots, looting, juvenile delinquency included) 29; race relations 13; the high cost of living and taxes 9; poverty 3. The party better able to handle it: Republican 31, Democratic 27, no difference or no opinion 42.'
    n: '[[w.gallup-poll]], III, 2151; [[w.cq-weekly-report]], Aug. 9, 1968, 2119. Check: CQ dates the results Aug. 3, from a poll "taken in mid-July"; in May, 42 percent (2119).'
    src:
      c: efc25552
      rows:
        - 'w.gallup-poll III, 2151: all'
        - 'w.cq-weekly-report Aug. 9, 1968, 2119: A'
  - id: cal.1968-08-04.vietnam-paris
    when: Aug. 4
    date: '1968-08-04'
    thread: vietnam-paris
    c: 'Clifford alone with Johnson: stop the bombing; three and a half years of trying to win militarily, "[It] cannot be done"; press Saigon to talk. Johnson: "I don''t agree with a word that you have said."'
    n: 'Elsey''s notes of Clifford''s account to his staff, Aug. 5, 1968, [FRUS 1964–68, VI: Vietnam, January–August 1968, doc. 324](https://history.state.gov/historicaldocuments/frus1964-68v06/d324) (Clifford alone with Johnson, Sunday afternoon, at the Ranch: the bombing to stop; Johnson "didn''t agree with anything CMC had said"). [[w.dallek-flawed-giant]], 568 (the meeting; Clifford''s case). To check: [[w.clifford-counsel-to-the-president-2]]; Clifford''s "Talks with LBJ," Aug. 4, 1968, Clifford Papers, LBJ Library (cited by [[w.dallek-flawed-giant]], 568). See [[cal.1968-07-29.vietnam]]. Names: Clifford, Johnson. Check: FRUS''s note (doc. 324 n.3): no meeting of the two in the Daily Diary.'
    src:
