    date: '1968-08-05'
    thread: elections-1968-miami
    c: 'The second session. Eisenhower, by telephone from Walter Reed, where he is recovering from a heart attack: an address of ten minutes, 8:34 p.m. Murphy presents six freshman Senators: Baker, Brooke, Hansen, Hatfield, Griffin, Percy.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2105. Names: Eisenhower, Murphy, Baker, Brooke, Hansen, Hatfield, Griffin, Percy.'
