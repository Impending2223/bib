  - id: cal.1968-08-09.elections-1968-8
    when: Aug. 9
    date: '1968-08-09'
    thread: elections-1968
    c: 'LBJ Ranch. Muriel Humphrey, to Mrs. Johnson, on her plans for the campaign: she will travel mostly with the Vice President; when she goes alone, in each town a lunch or reception with Democratic women and talks on child health, retarded children especially, and a press meeting, not a "press conference." The Vice President and Mrs. Johnson discuss "with happy frankness" their opinions of Senators McGovern and McCarthy. The Humphreys leave about 3.'
