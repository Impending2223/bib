    c: 'Morning, the White House. Johnson, Rusk and Ball on the invasion. Johnson to Ball: "George, the matter''s now in your hands; do what you have to do." Rusk: "put on your hawk''s beak, go into the Security Council, and give the Russians hell." By Ball''s account.'
    n: '[[w.ball-past-has-another-pattern]], 440. See [[cal.1968-08-20.soviet-union]]. Names: Johnson, Rusk, Ball.'
