    date: '1968-08-05'
    thread: elections-1968-miami
    also: [civil-rights-the-executive]
    c: 'Brooke, the temporary chairman, to the convention: white separatism in the suburbs and black in the slums both rejected; "an integrated society of magnificent pluralism." The Democrats raise the hopes of the disadvantaged "only to dash them."'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2105. Names: Brooke.'
    tags: [name:brooke-edward-w]
  - id: cal.1968-08-05.elections-1968-miami-12
    when: Aug. 5
    date: '1968-08-05'
    thread: elections-1968-miami
    c: 'Evans''s keynote, Lindsay introducing him: a war "we have not won in Saigon, cannot negotiate in Paris and will not explain to the American people"; nearly 150,000 casualties, more than 20,000 dead; "the disintegration of the old order." Adjourned 11:27 p.m.'
    n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2105, 2135. Names: Evans, Lindsay.'
    tags: [name:evans-daniel-j, name:lindsay-john-v]
