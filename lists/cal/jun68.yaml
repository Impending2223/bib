section: CIV
entries:
  - id: cal.1968-06-01.elections-1968
    when: June 1
    date: '1968-06-01'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'San Francisco, ABC: McCarthy and Kennedy on television together, an hour, the one debate of the primaries. Vietnam and a place for the NLF in a government at Saigon; the ghettos, McCarthy for housing outside them, Kennedy against moving their people out (Check).'
    n: '[[w.chester-american-melodrama]]; [[w.witcover-85-days]]. See [[cal.1968-05-28.elections-1968-2]]; [[cal.1968-03-14.robert-kennedy]]. Names: McCarthy, Kennedy.'
    tags: [name:mccarthy-eugene-j, name:kennedy-robert-f, state:ca, city:san-francisco]
  - id: cal.1968-06-03.court
    when: June 3
    date: '1968-06-03'
    thread: court
    also: [crime-and-hijacking]
    c: '*Witherspoon v. Illinois*, [391 U.S. 510](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391510/usrep391510.pdf): a sentence of death cannot be carried out where the jury was chosen by excluding all who voiced general objections to the death penalty or scruples against it. Stewart for the Court, 6–3; Black, with Harlan and White, dissenting; White dissenting too.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.banner-death-penalty]]; [[w.powe-warren-court-and-american]]. See [[cal.1968-05-20.court]].'
    tags: [name:stewart-potter, name:black-hugo-l, name:harlan-john-marshall, name:white-byron-r, state:il]
  - id: cal.1968-06-04.elections-1968
    when: June 4
    date: '1968-06-04'
    thread: elections-1968
    c: 'Primaries in California, New Jersey and South Dakota. Republican: Reagan in California; Nixon (write-in) in New Jersey; Nixon in South Dakota. Democratic: Kennedy in California and South Dakota; McCarthy (write-in) in New Jersey.'
    n: 'Cal., [*Statement of Vote, Consolidated Primary Election, June 4, 1968*, 4–9](https://archive.org/details/californiastate196668cali/page/n152); N.J., [*Results of the Primary Election Held June 4, 1968*, 2](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1968-primary-election.pdf#page=2); [*Official Election Returns for South Dakota, Primary Election, June 4, 1968*](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1968P.pdf#page=4). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Nixon, Kennedy, Reagan.'
    tags: [primary:1968-06-04, name:mccarthy-eugene-j, name:nixon-richard-m, name:kennedy-robert-f, name:reagan-ronald]
  - id: cal.1968-06-05.robert-kennedy
    when: June 5–6
    date: '1968-06-05'
    thread: robert-kennedy
    also: [elections-1968, assassination]
    c: 'Los Angeles. June 4, Kennedy wins the California primary, and South Dakota''s. After midnight, leaving the Ambassador Hotel''s ballroom through its pantry, he is shot in the head by Sirhan Sirhan, 24, a Jordanian born in Jerusalem; five others wounded. He dies at Good Samaritan Hospital, 1:44 a.m., June 6. Johnson, before dawn, with Hoover and Rowley: a Secret Service detail for each candidate; the joint resolution authorizing them signed June 6, [82 Stat. 170](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg170-3.pdf). His address, evening of June 5: a commission on violence. June 9 a day of national mourning.'
    n: '[Statement by the President Following the Shooting of Senator Robert F. Kennedy](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-shooting-senator-robert-f-kennedy); [Address to the Nation Following the Attack on Senator Kennedy](https://www.presidency.ucsb.edu/documents/address-the-nation-following-the-attack-senator-kennedy) (June 5, 1968); [Statement by the President on the Death of Senator Kennedy](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-senator-kennedy); [Proclamation 3853](https://www.presidency.ucsb.edu/documents/proclamation-3853-death-robert-f-kennedy) (June 6, 1968). [Johnson and Hoover, 5:34 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-june-5-1968), Conversation WH6806-01-13103; [Johnson and Rowley, 7:38 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-rowley-june-5-1968), Conversation WH6806-01-13107 (Miller Center). Statute (K–J Cong. II.J.2). *People v. Sirhan*, [7 Cal. 3d 710](https://static.case.law/cal-3d/7/html/0710-01.html) (1972), the appeal. [[w.thomas-robert-kennedy]]; [[w.schlesinger-robert-kennedy-and-his]]; [[w.witcover-85-days]]; [[w.clarke-last-campaign]]; [[w.kaiser-r-f-k-must]]; [[w.moldea-killing-of-robert-f]]; [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]. See [[cal.1968-06-04.elections-1968]]. Names: Kennedy, Sirhan, Hoover, Rowley, Johnson.'
    tags: [name:kennedy-robert-f, name:sirhan-sirhan-bishara, name:hoover-j-edgar, name:rowley-james-j, name:johnson-lyndon-b, state:ca, city:los-angeles]
  - id: cal.1968-06-05.vietnam
    when: June 5–11
    date: '1968-06-05'
    thread: vietnam
    also: [soviet-union]
    c: 'Kosygin to Johnson, June 5, unasked: he and "my colleagues" believe, "and we have grounds for this," that a full cessation of the bombing "could promote a breakthrough." Rostow: "it could be a breakthrough." The advisers on it June 9, after the funeral. Johnson''s reply, June 11, given Dobrynin by Rusk: ready to stop the bombing "as a further step toward peace," but Hanoi must decide not to take advantage of it; would Moscow say "privately and with precision" that there would be no adverse military consequences? Saigon under "the most vicious and indiscriminate attacks."'
    n: 'FRUS 1964–68, VI, docs. [262](https://history.state.gov/historicaldocuments/frus1964-68v06/d262), [265](https://history.state.gov/historicaldocuments/frus1964-68v06/d265), [269](https://history.state.gov/historicaldocuments/frus1964-68v06/d269). [[w.gaiduk-soviet-union-and-the]]. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-13.vietnam]]. Names: Kosygin, Rostow, Dobrynin, Rusk, Johnson.'
    tags: [name:kosygin-aleksei, name:rostow-walt-w, name:dobrynin-anatoly, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-06-06.crime-and-hijacking
    when: June 6–24
    date: '1968-06-06'
    thread: crime-and-hijacking
    c: 'Gun control. Johnson to Humphrey and McCormack, June 6: "the hour has come" for a law "governing the full range of lethal weapons"; the interstate mail-order sale of rifles and shotguns to be stopped. June 10, the House Judiciary Committee deadlocks and the bill fails; June 11, Johnson: "a bitter disappointment." June 18, Dodd''s subcommittee reports it; June 20, the House committee approves it. June 20, to the governors. June 24, message: a national registration of every firearm, and federal licensing of their possessors where State laws fall short.'
    n: '[Letter to the President of the Senate and to the Speaker of the House Urging Passage of an Effective Gun Control Law](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-urging-passage-effective-gun) (June 6, 1968); [Statement by the President on the Tie Vote on a Gun Control Bill in the House Judiciary Committee](https://www.presidency.ucsb.edu/documents/statement-the-president-the-tie-vote-gun-control-bill-the-house-judiciary-committee) (June 11, 1968); [Statement by the President Following House Committee Approval of the Gun Control Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-committee-approval-the-gun-control-bill) (June 20, 1968); [Special Message to the Congress: "The People''s Right to Protection"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-peoples-right-protection) (June 24, 1968). [[w.zimring-firearms-and-federal-law]]; [[w.spitzer-politics-of-gun-control]]; [[w.winkler-gunfight]]; [[w.flamm-law-and-order]]. See [[cal.1968-05-09.crime-and-hijacking]]. Names: Humphrey, McCormack, Dodd, Johnson.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:mccormack-john-w, name:dodd-thomas-j]
  - id: cal.1968-06-08.robert-kennedy
    when: June 8
    date: '1968-06-08'
    thread: robert-kennedy
    c: 'New York, St. Patrick''s Cathedral: the requiem Mass; Edward Kennedy speaks for the family. The funeral train to Washington, crowds along the line. Burial at Arlington at night, near his brother''s grave. Johnson at the Mass and the burial (Check).'
    n: 'See [[cal.1968-06-05.robert-kennedy]]. Names: Edward Kennedy, Robert Kennedy, Johnson.'
    tags: [name:kennedy-edward-m, name:kennedy-robert-f, name:johnson-lyndon-b, state:ny, city:nyc]
  - id: cal.1968-06-08.king
    when: June 8
    date: '1968-06-08'
    thread: king
    c: 'London Airport. Scotland Yard arrests Ray, traveling on a Canadian passport as Ramon George Sneyd, on his way to Brussels. Ramsey Clark announces it in Washington the same morning, during the Kennedy funeral. Held in London on charges of carrying a forged passport and a pistol (Check); extradition sought.'
    n: '[[w.posner-killing-the-dream]]; [[w.sides-hellhound-on-his-trail]]. See [[cal.1968-04-04.king]]. Names: Ray, Clark.'
    tags: [name:ray-james-earl, name:clark-ramsey]
  - id: cal.1968-06-10.civil-disorders
    when: June 10
    date: '1968-06-10'
    thread: civil-disorders
    also: [assassination, crime-and-hijacking]
    c: 'Executive Order 11412: the National Commission on the Causes and Prevention of Violence, Milton Eisenhower its chairman. Johnson''s questions: what in American society causes "disrespect for the law"; whether "permissiveness toward extreme behavior" has encouraged violence; whether its seeds are nurtured through "the public''s airwaves."'
    n: '[Executive Order 11412](https://www.presidency.ucsb.edu/documents/executive-order-11412-establishing-national-commission-the-causes-and-prevention-violence); [Remarks and Statement Upon Signing Order Establishing the National Commission on the Causes and Prevention of Violence](https://www.presidency.ucsb.edu/documents/remarks-and-statement-upon-signing-order-establishing-the-national-commission-the-causes) (June 10, 1968). [[w.national-commission-to-establish-justice|full]]; [[w.flamm-law-and-order]]. See [[cal.1968-06-05.robert-kennedy]]; [[cal.1967-07-27.civil-disorders]]. Names: Milton Eisenhower, Johnson.'
    tags: [name:eisenhower-milton-s, name:johnson-lyndon-b]
  - id: cal.1968-06-10.crime-and-hijacking
    when: June 10
    date: '1968-06-10'
    thread: crime-and-hijacking
    also: [court]
    c: '*Terry v. Ohio*, [392 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392001/usrep392001.pdf): a Cleveland detective''s stop and pat-down of men he took to be casing a store, without probable cause to arrest, is no unreasonable search where he reasonably concludes "that criminal activity may be afoot and that the persons with whom he is dealing may be armed and presently dangerous." Warren for the Court, 8–1; Harlan and White concurring; Douglas dissenting. *Sibron v. New York*, [392 U.S. 40](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392040/usrep392040.pdf), the same day.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.barrett-deciding-the-stop-and]]; [[w.powe-warren-court-and-american]]. See [[cal.1967-12-18.court]]. Names: Warren.'
    tags: [name:warren-earl, name:harlan-john-marshall, name:white-byron-r, name:douglas-william-o, state:oh, city:cleveland]
  - id: cal.1968-06-10.school-aid
    when: June 10
    date: '1968-06-10'
    thread: school-aid
    also: [court]
    c: '*Flast v. Cohen*, [392 U.S. 83](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392083/usrep392083.pdf): a federal taxpayer has standing to challenge spending under the Elementary and Secondary Education Act for parochial schools as an establishment of religion; *Frothingham* distinguished. Warren for the Court, 8–1; Harlan dissenting. *Board of Education v. Allen*, [392 U.S. 236](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392236/usrep392236.pdf): New York''s loan of textbooks to pupils of church schools upheld; White for the Court, 6–3; Black, Douglas and Fortas dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]. See [[cal.1968-01-02.school-aid]].'
    tags: [name:warren-earl, name:harlan-john-marshall, name:white-byron-r, name:black-hugo-l, name:douglas-william-o, name:fortas-abe, state:ny]
  - id: cal.1968-06-11.elections-1968
    when: June 11
    date: '1968-06-11'
    thread: elections-1968
    c: 'Illinois primary. Republican: Nixon (write-in) 78.1 percent, Rockefeller (write-in) 9.7. Democratic: McCarthy (write-in) 38.6 percent, Kennedy (write-in) 33.7.'
    n: '[*State of Illinois Official Vote Cast at the Primary Election, June 11, 1968*, 3, 8–11](https://archive.org/details/stateofillinoiso1968illi/page/n7). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: Kennedy, McCarthy, Rockefeller, Nixon.'
    tags: [primary:1968-06-11, name:kennedy-edward-m, name:mccarthy-eugene-j, name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1968-06-11.berlin-and-vienna
    when: June 11–17
    date: '1968-06-11'
    thread: berlin-and-vienna
    also: [europe-and-the-alliance, soviet-union]
    c: 'East Germany requires passports and visas of West Germans traveling to West Berlin and through its territory, raises the autobahn fee, and puts a tax on freight carried by West German trucks. The Berlin Task Force meets. Rusk to Kuznetsov at New York, June 14: the measures without consultation affect the four-power agreements. Johnson to Kiesinger, June 17, the Day of German Unity: Berlin "once again threatened"; support "as firm as ever."'
    n: '[Message to Chancellor Kiesinger on the Situation in Berlin](https://www.presidency.ucsb.edu/documents/message-chancellor-kiesinger-the-situation-berlin) (June 17, 1968). FRUS 1964–68, XV, docs. [268](https://history.state.gov/historicaldocuments/frus1964-68v15/d268), [270](https://history.state.gov/historicaldocuments/frus1964-68v15/d270). [[w.schwartz-lyndon-johnson-and-europe]]. Names: Rusk, Kuznetsov, Kiesinger, Johnson.'
    tags: [name:rusk-dean, name:kuznetsov-vasily-v, name:kiesinger-kurt-georg, name:johnson-lyndon-b, city:berlin]
  - id: cal.1968-06-12.testing
    when: June 12
    date: '1968-06-12'
    thread: testing
    also: [soviet-union]
    c: 'The General Assembly commends the treaty on the nonproliferation of nuclear weapons to the governments of the world, 95–4, 21 abstaining, Resolution 2373 (XXII). Johnson at the Assembly the same afternoon: the treaty "the most important international agreement in the field of disarmament since the nuclear age began."'
    n: '[Remarks Before the U.N. General Assembly Following Its Endorsement of the Nuclear Nonproliferation Treaty](https://www.presidency.ucsb.edu/documents/remarks-before-the-un-general-assembly-following-its-endorsement-the-nuclear) (June 12, 1968). [[w.seaborg-stemming-the-tide]]; [[w.maddock-nuclear-apartheid]]. See [[cal.1967-08-24.testing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, city:nyc]
  - id: cal.1968-06-13.soviet-union
    when: June 13
    date: '1968-06-13'
    thread: soviet-union
    c: 'The White House. The Consular Convention with the Soviet Union, [19 U.S.T. 5018](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-19-4/lltreaties-19-4.pdf#page=940), [655 U.N.T.S. 214](https://treaties.un.org/doc/Publication/UNTS/Volume%20655/volume-655-I-9383-English.pdf), proclaimed, Dobrynin and Rusk present. Johnson: "the first bilateral treaty between the Soviet Union and the United States." In force July 13.'
    n: '[Remarks at the Ratification Ceremony for the Consular Convention Between the United States and the Soviet Union](https://www.presidency.ucsb.edu/documents/remarks-the-ratification-ceremony-for-the-consular-convention-between-the-united-states) (June 13, 1968). See [[cal.1967-03-16.soviet-union]]. Names: Dobrynin, Rusk, Johnson.'
    tags: [name:dobrynin-anatoly, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-06-14.war-opposition
    when: June 14
    date: '1968-06-14'
    thread: war-opposition
    also: [draft]
    c: 'Boston. The jury in the federal court finds Spock, Coffin, Goodman and Ferber guilty of conspiracy to counsel evasion of the draft; Raskin acquitted.'
    n: '*United States v. Spock*, [416 F.2d 165](https://static.case.law/f2d/416/html/0165-01.html) (1st Cir. 1969), the appeal. See [[cal.1968-01-05.war-opposition]]. Names: Spock, Coffin, Goodman, Ferber, Raskin.'
    tags: [name:spock-benjamin, name:coffin-william-sloane-jr, name:goodman-mitchell, name:ferber-michael, name:raskin-marcus, state:ma, city:boston]
  - id: cal.1968-06-17.open-housing
    when: June 17
    date: '1968-06-17'
    thread: open-housing
    also: [court]
    c: '*Jones v. Alfred H. Mayer Co.*, [392 U.S. 409](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392409/usrep392409.pdf): the Civil Rights Act of 1866, 42 U.S.C. § 1982, bars all racial discrimination, private as well as public, in the sale or rental of property, and is valid under the Thirteenth Amendment. A Negro couple refused a house in a St. Louis County subdivision. Stewart for the Court, 7–2; Douglas concurring; Harlan, with White, dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]. See [[cal.1968-04-10.open-housing]]. '
    tags: [name:stewart-potter, name:douglas-william-o, name:harlan-john-marshall, name:white-byron-r, state:mo]
  - id: cal.1968-06-17.welfare
    when: June 17
    date: '1968-06-17'
    thread: welfare
    also: [court, alabama]
    c: '*King v. Smith*, [392 U.S. 309](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392309/usrep392309.pdf): Alabama''s "substitute father" regulation, denying aid to dependent children whose mother cohabits with an able-bodied man, invalid under the Social Security Act. Warren for the Court; no dissent.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.davis-brutal-need]]; [[w.melnick-between-the-lines]]. See [[cal.1968-01-02.welfare]].'
    tags: [name:warren-earl, state:al]
  - id: cal.1968-06-19.crime-and-hijacking
    when: June 19
    date: '1968-06-19'
    thread: crime-and-hijacking
    also: [court]
    c: 'Omnibus Crime Control and Safe Streets Act signed, [82 Stat. 197](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg197.pdf). The House took the Senate''s bill whole, June 6, [369–17](https://voteview.com/rollcall/RH0900339), a conference refused the day before, [60–318](https://voteview.com/rollcall/RH0900335). Title I, the Law Enforcement Assistance Administration and block grants to the States; Title II, on confessions and eyewitnesses in the federal courts; Title III, wiretapping and eavesdropping on court order, and without one in emergencies and for national security; Title IV, handguns. Johnson: more good than bad; Title III "unwise and potentially dangerous," to be repealed.'
    n: '[Statement by the President Upon Signing the Omnibus Crime Control and Safe Streets Act of 1968](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-omnibus-crime-control-and-safe-streets-act-1968) (June 19, 1968). Statute (K–J Cong. II.J.2). See [[cal.1968-05-09.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-06-19.economy
    when: June 19
    date: '1968-06-19'
    thread: economy
    also: [trade]
    c: 'Special Drawing Rights Act signed, [82 Stat. 188](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg188.pdf): American participation in the facility based on special drawing rights in the International Monetary Fund, the Fund''s Articles amended. The House had passed it May 10, [237–15](https://voteview.com/rollcall/RH0900317). Fowler and Martin at the signing. Johnson: nations "able to create international reserves by deliberate and joint decision."'
    n: '[Remarks Upon Signing the Special Drawing Rights Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-special-drawing-rights-act) (June 19, 1968). Statute (K–J Cong. II.J.2). [[w.solomon-international-monetary-system-1945]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1967-08-26.economy]]. Names: Fowler, Martin, Johnson.'
    tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr, name:johnson-lyndon-b]
  - id: cal.1968-06-19.king
    when: June 19–24
    date: '1968-06-19'
    thread: king
    also: [poverty]
    c: 'Solidarity Day, at the Lincoln Memorial: some 50,000 for the Poor People''s Campaign (Check). The permit for Resurrection City runs out June 23. June 24, the police clear the camp; Abernathy and some 200 arrested on the Capitol grounds; disorder in the city that night, a curfew (Check the numbers).'
    n: 'See [[cal.1968-05-12.king]]. Names: Abernathy.'
    tags: [name:abernathy-ralph-david, city:washington]
  - id: cal.1968-06-20.economy
    when: June 20–28
    date: '1968-06-20'
    thread: economy
    also: [congress]
    c: 'Revenue and Expenditure Control Act. The House adopts the conference report, [268–150](https://voteview.com/rollcall/RH0900357), June 20; the Senate, [64–16](https://voteview.com/rollcall/RS0900468), June 21. Signed June 28, [82 Stat. 251](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg251.pdf): a 10 percent surcharge on income taxes, from Jan. 1 for corporations and Apr. 1 for others, to June 30, 1969; fiscal 1969 expenditures cut $6 billion from the January budget, new obligational authority $10 billion; recommendations to rescind $8 billion of old; civilian employment limited; the excises on automobiles and telephones kept. Johnson: $20 billion off the deficit; Congress will "shift to the President the responsibility" for the cuts. A memorandum to the agencies, June 28.'
    n: '[Letter to the Speaker of the House Urging Passage of the Tax Bill](https://www.presidency.ucsb.edu/documents/letter-the-speaker-the-house-urging-passage-the-tax-bill) (June 20, 1968); [Statement by the President Upon Signing the Tax Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-tax-bill); [Memorandum on the Need for Reduced Spending by Federal Agencies Following Enactment of the Tax Bill](https://www.presidency.ucsb.edu/documents/memorandum-the-need-for-reduced-spending-federal-agencies-following-enactment-the-tax-bill) (June 28, 1968). Statute (K–J Cong. II.J.2). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]; [[w.okun-political-economy-of-prosperity]]; [[w.president-and-the-council]]. See [[cal.1968-05-05.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-06-21.testing
    when: June 21–27
    date: '1968-06-21'
    thread: testing
    also: [defense, soviet-union]
    c: 'Strategic arms. Kosygin to Johnson, received June 21, answering his letters of Jan. 22 and May 2: the Soviet Union attaches great importance to restraint, offensive and defensive systems to be considered together; "before long" a more concrete exchange of views, "if of course the general world situation does not hinder this." Johnson replies June 22. June 27, Gromyko to the Supreme Soviet: ready to exchange views on the limitation of offensive and defensive strategic weapons (Check).'
    n: 'FRUS 1964–68, XI, docs. [237](https://history.state.gov/historicaldocuments/frus1964-68v11/d237), [247](https://history.state.gov/historicaldocuments/frus1964-68v11/d247), [248](https://history.state.gov/historicaldocuments/frus1964-68v11/d248), [249](https://history.state.gov/historicaldocuments/frus1964-68v11/d249). [[w.newhouse-cold-dawn]]; [[w.seaborg-stemming-the-tide]]. Made public: FRUS 1964–68, XI (1997). Names: Kosygin, Gromyko, Johnson.'
    tags: [name:kosygin-aleksei, name:gromyko-andrei, name:johnson-lyndon-b]
  - id: cal.1968-06-24.defense
    when: June 24–25
    date: '1968-06-24'
    thread: defense
    c: 'The Senate, the military construction authorization for fiscal 1969, H.R. 16703. No funds for an antiballistic missile system before July 1, 1969, refused, [34–52](https://voteview.com/rollcall/RS0900469), Cooper''s and Hart''s amendment (Check); the $227.3 million for the Sentinel struck, refused, [12–72](https://voteview.com/rollcall/RS0900470). Passed June 25, [78–3](https://voteview.com/rollcall/RS0900477).'
    n: '[[w.yanarella-missile-defense-controversy]]; [[w.halperin-decision-to-deploy-the]]. See [[cal.1967-09-18.defense]]. Names: Cooper, Hart.'
    tags: [name:cooper-john-sherman, name:hart-philip-a]
  - id: cal.1968-06-24.transition-and-staff
    when: June 24
    date: '1968-06-24'
    thread: transition-and-staff
    c: 'George Ball sworn Representative to the United Nations, Goldberg''s successor. Johnson: one of those "gifted amateurs."'
    n: '[Remarks at the Swearing In of George Ball as U.S. Representative to the United Nations](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-george-ball-us-representative-the-united-nations) (June 24, 1968). [[w.ball-past-has-another-pattern]]; [[w.bill-george-ball]]; [[w.dileo-george-ball-vietnam-and]]. Names: Ball, Goldberg, Johnson.'
    tags: [name:ball-george-w, name:goldberg-arthur-j, name:johnson-lyndon-b]
  - id: cal.1968-06-25.vietnam
    when: June 25–27
    date: '1968-06-25'
    thread: vietnam
    c: 'Paris. Vance meets Hà Văn Lâu privately at a house in Vitry-sur-Seine, near the North Vietnamese delegation''s headquarters, two hours, Habib with him; the place Hanoi''s choice (Check the night). Lunch at the White House, June 25: the cable to Vance following up Zorin''s talk with Shriver. Lê Đức Thọ leaves Paris for Hanoi, by Moscow, the next day.'
    n: 'FRUS 1964–68, VI, docs. [282](https://history.state.gov/historicaldocuments/frus1964-68v06/d282), [283](https://history.state.gov/historicaldocuments/frus1964-68v06/d283), [285](https://history.state.gov/historicaldocuments/frus1964-68v06/d285). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-13.vietnam]]. Names: Vance, Hà Văn Lâu, Habib, Zorin, Shriver, Lê Đức Thọ.'
    tags: [name:vance-cyrus, name:ha-van-lau, name:habib-philip-c, name:zorin-valerian, name:shriver-r-sargent, name:le-duc-tho]
  - id: cal.1968-06-26.court
    when: June 26
    date: '1968-06-26'
    thread: court
    also: [confirmations]
    c: 'Warren''s letters of June 13: he will retire as Chief Justice "effective at your pleasure," because of age alone. Johnson accepts, June 26, the retirement to take effect when a successor is qualified, and names Fortas Chief Justice and Thornberry, of the Fifth Circuit, once Representative from Austin, to Fortas''s seat. Johnson and Fortas by telephone, June 21. Griffin and other Republican Senators oppose confirming nominees of a President not standing again (Check the day and the number).'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1210) (June 26, 1968). [Johnson and Fortas, 3:48 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-abe-fortas-june-21-1968), Conversation WH6806-02-13127 (Miller Center). [[w.kalman-abe-fortas]]; [[w.murphy-fortas]]; [[w.shogan-question-of-judgment]]; [[w.kalman-long-reach-of-the-2017]]; [[w.newton-justice-for-all]]; [[w.schwartz-super-chief]]; [[w.dallek-flawed-giant]]. See [[cal.1967-06-13.court]]. Names: Warren, Fortas, Thornberry, Griffin, Johnson.'
    tags: [name:warren-earl, name:fortas-abe, name:thornberry-william-h, name:griffin-robert-p, name:johnson-lyndon-b]
  - id: cal.1968-06-26.japan-and-korea
    when: June 26
    date: '1968-06-26'
    thread: japan-and-korea
    c: 'The Bonin and Volcano Islands, Iwo Jima among them, returned to Japanese administration, under the agreement signed at Tokyo Apr. 5 (Check its U.S.T. and U.N.T.S. cites). Johnson to the islanders.'
    n: '[Message to the Bonin Islanders on the Return of the Islands to Japanese Administration](https://www.presidency.ucsb.edu/documents/message-the-bonin-islanders-the-return-the-islands-japanese-administration) (June 26, 1968). See [[cal.1967-11-14.japan-and-korea]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-06-27.vietnam
    when: June 27
    date: '1968-06-27'
    thread: vietnam
    c: 'The command announces that the Marines will leave Khe Sanh and the base be dismantled, its forces to more mobile operations. Abrams in command in Westmoreland''s place (he takes over formally July 3; Westmoreland to be Army Chief of Staff). Check the day of the announcement.'
    n: '[[w.sorley-thunderbolt]]. See [[cal.1968-01-21.vietnam]]. Names: Abrams, Westmoreland.'
    tags: [name:abrams-creighton, name:westmoreland-william]
  - id: cal.1968-06-27.voting-rights
    when: June 27
    date: '1968-06-27'
    thread: voting-rights
    c: 'Message: a constitutional amendment, the vote at eighteen. "The right of any citizen of the United States to vote shall not be denied or abridged by the United States or by any State on account of age if a citizen is eighteen years of age or older." Georgia votes at eighteen since 1943, Kentucky since 1955.'
    n: '[Special Message to the Congress: "To Vote at Eighteen--Democracy Fulfilled and Enriched"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-vote-eighteen-democracy-fulfilled-and-enriched) (June 27, 1968). [[w.cultice-youths-battle-for-the]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
