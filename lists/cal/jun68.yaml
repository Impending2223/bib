entries:
  - id: cal.1968-06-01.elections-1968
    when: June 1
    date: '1968-06-01'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'San Francisco, ABC: McCarthy and Kennedy on television together, an hour, the one debate of the primaries. Vietnam and a place for the NLF in a government at Saigon; the ghettos, McCarthy for housing outside them, Kennedy against moving their people out (Check).'
    n: '[[w.chester-american-melodrama]]; [[w.witcover-85-days]]. See [[cal.1968-05-28.elections-1968-2]]; [[cal.1968-03-14.robert-kennedy]]. Names: McCarthy, Kennedy.'
    tags: [name:mccarthy-eugene-j, name:kennedy-robert-f, state:ca, city:san-francisco]
  - id: cal.1968-06-01.governors-tx
    when: June 1
    date: '1968-06-01'
    thread: governors
    also: [elections-1968]
    c: 'Texas Democratic runoff for governor: Smith 767,490, 55.3 percent; Yarborough 621,226. Smith second in the first primary. Nov. 5, Smith over Eggers (R), 57.0 percent.'
    n: 'Votes: [Wikipedia, "1968 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Texas_gubernatorial_election), from the *Texas Almanac*; the *Observer*''s count, 756,909 to 620,726: [*Texas Observer*, June 7, 1968](https://issues.texasobserver.org/pdf/ustxtxb_obs_1968_06_07_issue.pdf). Check: the State Democratic Executive Committee''s canvass. See [[cal.1968-05-04.governors-tx]]. Names: Smith, Yarborough, Eggers.'
    tags: [state:tx, name:smith-preston, name:yarborough-don, name:eggers-paul-w]
  - id: cal.1968-06-02.opinion
    when: June 2
    date: '1968-06-02'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, special survey, Democratic county chairmen, the convention''s choice among three: Humphrey 70 percent, Robert Kennedy 16, McCarthy 6, undecided 8; adjusted to the regions'' delegates, 67, 19, 6. South, Humphrey 521 chairmen, McCarthy 46, Kennedy 39. Of two: Kennedy 41, McCarthy 38. Johnson would not accept a draft from a deadlocked convention, 49 to 39. The likely Republican nominee: Nixon 78, Rockefeller 15.'
    n: '[[w.gallup-poll]], III, 2128–29. Names: Humphrey, Kennedy, McCarthy, Johnson, Nixon, Rockefeller.'
    tags: [name:humphrey-hubert-h, name:kennedy-robert-f, name:mccarthy-eugene-j, name:johnson-lyndon-b, name:nixon-richard-m, name:rockefeller-nelson]
  - id: cal.1968-06-03.court
    when: June 3
    date: '1968-06-03'
    thread: court
    also: [crime-and-hijacking]
    c: '*Witherspoon v. Illinois*, [391 U.S. 510](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391510/usrep391510.pdf): a sentence of death cannot be carried out where the jury was chosen by excluding all who voiced general objections to the death penalty or scruples against it. Stewart for the Court, 6–3; Black, with Harlan and White, dissenting; White dissenting too.'
    n: Opinion (K–J Cong. II.J.1). [[w.banner-death-penalty]]; [[w.powe-warren-court-and-american]]. See [[cal.1968-05-20.court]].
    tags: [name:stewart-potter, name:black-hugo-l, name:harlan-john-marshall, name:white-byron-r, state:il]
  - id: cal.1968-06-04.elections-1968
    when: June 4
    date: '1968-06-04'
    thread: elections-1968
    c: 'Primaries in California, New Jersey and South Dakota. Republican: Reagan in California; Nixon (write-in) in New Jersey; Nixon in South Dakota. Democratic: Kennedy in California and South Dakota; McCarthy (write-in) in New Jersey.'
    n: 'Cal., [*Statement of Vote, Consolidated Primary Election, June 4, 1968*, 4–9](https://archive.org/details/californiastate196668cali/page/n152); N.J., [*Results of the Primary Election Held June 4, 1968*, 2](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1968-primary-election.pdf#page=2); [*Official Election Returns for South Dakota, Primary Election, June 4, 1968*](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1968P.pdf#page=4). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Nixon, Kennedy, Reagan.'
    tags: [primary:1968-06-04, name:mccarthy-eugene-j, name:nixon-richard-m, name:kennedy-robert-f, name:reagan-ronald]
  - id: cal.1968-06-04.governors-mt
    when: June 4
    date: '1968-06-04'
    thread: governors
    also: [elections-1968]
    c: 'Montana''s primaries for governor. Democratic: Forrest Anderson, the attorney general, 39,057, 38.4 percent; Mahoney, a State senator, 35,562, 34.9; four others. Republican: Governor Babcock 50,369, 55.1 percent; Lieutenant Governor James 36,664, 40.1; two others.'
    n: '[*Report of the Official Canvass of the Vote Cast at the Primary Election in the State of Montana, June 4, 1968*](https://archive.org/details/primaryofficial1968montrich/page/n1); the shares, [Wikipedia, "1968 Montana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Montana_gubernatorial_election). [[w.malone-montana]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1964-06-02.governors-mt]]. Names: Anderson, Mahoney, Babcock, James.'
    tags: [state:mt, name:anderson-forrest-h, name:mahoney-eugene-h, name:babcock-tim-m, name:james-ted]
  - id: cal.1968-06-04.elections-1968-ca
    when: June 4
    date: '1968-06-04'
    thread: elections-1968
    c: 'California''s primaries for the Senate. Republican: Rafferty, Superintendent of Public Instruction, 1,112,947, 50.0 percent; Kuchel, the minority whip, seeking a fourth term, 1,043,315, 46.9; three others. Democratic: Cranston, State controller 1959–67, 1,681,825, 59.0 percent; Beilenson, a State senator, 22.6; three others.'
    n: 'Cal., [*Statement of Vote, Consolidated Primary Election, June 4, 1968*](https://archive.org/details/californiastate196668cali/page/n152); the figures as [Wikipedia, "1968 United States Senate election in California"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_California), gives them, from Our Campaigns (Check against the Statement, its page). [[w.kabaservice-rule-and-ruin]]; [[w.peirce-megastates-of-america]]. See [[cal.1968-06-04.elections-1968]]. Names: Rafferty, Kuchel, Cranston, Beilenson.'
    tags: [state:ca, name:rafferty-max, name:kuchel-thomas-h, name:cranston-alan, name:beilenson-anthony-c]
  - id: cal.1968-06-04.state-and-city-finance-tx
    when: June 4
    date: '1968-06-04'
    thread: state-and-city-finance
    c: 'Texas. The legislature in special session, on Connally''s call: a $2.6 billion appropriation for fiscal 1969, and taxes for it.'
    n: '[*Texas Observer*, June 21, 1968](https://www.texasobserver.org/explore/ustxtxb_obs_1968_06_21_50_00005-00000_000pdf5535/). Check: the *House Journal*, 60th Leg., 1st C.S. [[w.reston-lone-star]]; [[w.cunningham-cowboy-conservatism]]. Names: Connally.'
    tags: [state:tx, name:connally-john]

  - id: cal.1968-06-05.robert-kennedy
    when: June 5–6
    date: '1968-06-05'
    thread: robert-kennedy
    also: [elections-1968, assassination]
    c: 'Los Angeles. June 4, Kennedy wins the California primary, and South Dakota''s. After midnight, leaving the Ambassador Hotel''s ballroom through its pantry, he is shot in the head by Sirhan Sirhan, 24, a Jordanian born in Jerusalem; five others wounded. He dies at Good Samaritan Hospital, 1:44 a.m., June 6. Johnson, before dawn, with Hoover and Rowley: a Secret Service detail for each candidate; the joint resolution authorizing them signed June 6, [82 Stat. 170](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg170-3.pdf). His address, evening of June 5: a commission on violence. June 9 a day of national mourning.'
    n: '[Statement by the President Following the Shooting of Senator Robert F. Kennedy](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-shooting-senator-robert-f-kennedy); [Address to the Nation Following the Attack on Senator Kennedy](https://www.presidency.ucsb.edu/documents/address-the-nation-following-the-attack-senator-kennedy) (June 5, 1968); [Statement by the President on the Death of Senator Kennedy](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-senator-kennedy); [Proclamation 3853](https://www.presidency.ucsb.edu/documents/proclamation-3853-death-robert-f-kennedy) (June 6, 1968). [Johnson and Hoover, 5:34 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-june-5-1968), Conversation WH6806-01-13103; [Johnson and Rowley, 7:38 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-rowley-june-5-1968), Conversation WH6806-01-13107 (Miller Center). Statute (K–J Cong. II.J.2). *People v. Sirhan*, [7 Cal. 3d 710](https://static.case.law/cal-3d/7/case-pdfs/0710-01.pdf) (1972), the appeal. [[w.thomas-robert-kennedy]]; [[w.schlesinger-robert-kennedy-and-his]]; [[w.witcover-85-days]]; [[w.clarke-last-campaign]]; [[w.kaiser-r-f-k-must]]; [[w.moldea-killing-of-robert-f]]; [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]. See [[cal.1968-06-04.elections-1968]]. Names: Kennedy, Sirhan, Hoover, Rowley, Johnson.'
    tags: [name:kennedy-robert-f, name:sirhan-sirhan-bishara, name:hoover-j-edgar, name:rowley-james-j, name:johnson-lyndon-b, state:ca, city:los-angeles]
  - id: cal.1968-06-05.vietnam
    when: June 5
    date: '1968-06-05'
    thread: vietnam-paris
    also: [soviet-union]
    c: 'Kosygin to Johnson, unasked: he and "my colleagues" believe, "and we have grounds for this," that a full cessation of the bombing "could promote a breakthrough." Rostow: "it could be a breakthrough."'
    n: 'FRUS 1964–68, VI, doc. [262](https://history.state.gov/historicaldocuments/frus1964-68v06/d262). [[w.gaiduk-soviet-union-and-the]]. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-13.vietnam]]. Names: Kosygin, Rostow, Johnson.'
    tags: [name:kosygin-aleksei, name:rostow-walt-w, name:johnson-lyndon-b]

  - id: cal.1968-06-05.opinion
    when: June 5
    date: '1968-06-05'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, May 23–28: a law to limit the money spent for or by a candidate in his campaign for public office: favor 68 percent, oppose 24. Republicans 72 and 23; Democrats 65 and 25.'
    n: '[[w.gallup-poll]], III, 2129.'
  - id: cal.1968-06-06.europe-and-the-alliance-france
    when: June 6
    date: '1968-06-06'
    thread: europe-and-the-alliance-france
    also: [economy]
    c: 'Fowler to Johnson: the franc''s crisis a threat to the monetary system and an opportunity.'
    n: 'FRUS 1964–68, VIII, doc. [199](https://history.state.gov/historicaldocuments/frus1964-68v08/d199). See [[cal.1968-05-22.europe-and-the-alliance]]. Names: Fowler, Johnson.'
    tags: [name:fowler-henry-h, name:johnson-lyndon-b]

  - id: cal.1968-06-06.crime-and-hijacking
    when: June 6
    date: '1968-06-06'
    thread: crime-and-hijacking-guns
    c: 'Gun control. Johnson to Humphrey and McCormack: "the hour has come" for a law "governing the full range of lethal weapons"; the interstate mail-order sale of rifles and shotguns to be stopped.'
    n: '[Letter to the President of the Senate and to the Speaker of the House Urging Passage of an Effective Gun Control Law](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-urging-passage-effective-gun) (June 6, 1968). [[w.zimring-firearms-and-federal-law]]; [[w.spitzer-politics-of-gun-control]]; [[w.winkler-gunfight]]; [[w.flamm-law-and-order]]. See [[cal.1968-05-16.crime-and-hijacking-safe-streets]]. Names: Humphrey, McCormack, Johnson.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:mccormack-john-w]

  - id: cal.1968-06-06.crime-and-hijacking-safe-streets
    when: June 6
    date: '1968-06-06'
    thread: crime-and-hijacking-safe-streets
    c: 'The House takes the Senate''s crime bill whole, [369–17](https://voteview.com/rollcall/RH0900339). A conference had been refused the day before, [60–318](https://voteview.com/rollcall/RH0900335).'
    n: 'See [[cal.1968-05-09.crime-and-hijacking]].'

  - id: cal.1968-06-08.robert-kennedy
    when: June 8
    date: '1968-06-08'
    thread: robert-kennedy
    c: 'New York, St. Patrick''s Cathedral: the requiem Mass; Edward Kennedy speaks for the family. The funeral train to Washington, crowds along the line. Burial at Arlington at night, near his brother''s grave. Johnson at the Mass and the burial (Check).'
    n: 'See [[cal.1968-06-05.robert-kennedy]]. Names: Edward Kennedy, Robert Kennedy, Johnson.'
    tags: [name:kennedy-edward-m, name:kennedy-robert-f, name:johnson-lyndon-b, state:ny, city:nyc]
  - id: cal.1968-06-08.king
    when: June 8
    date: '1968-06-08'
    thread: king
    c: London Airport. Scotland Yard arrests Ray, traveling on a Canadian passport as Ramon George Sneyd, on his way to Brussels. Ramsey Clark announces it in Washington the same morning, during the Kennedy funeral. Held in London on charges of carrying a forged passport and a pistol (Check); extradition sought.
    n: '[[w.posner-killing-the-dream]]; [[w.sides-hellhound-on-his-trail]]. See [[cal.1968-04-04.king]]. Names: Ray, Clark, Robert Kennedy.'
    tags: [name:ray-james-earl, name:clark-ramsey, name:kennedy-robert-f]
  - id: cal.1968-06-09.opinion
    when: June 9
    date: '1968-06-09'
    thread: opinion
    also: [crime-and-hijacking, robert-kennedy]
    c: 'Gallup, special survey: the causes of violent behavior in this nation, those blamed chiefly: a complex society; waiting too long to tackle racial, ethnic and religious prejudice; poor discipline in the home; youth''s lack of respect for authority; a disregard for God and religion. The steps to prevent it, as listed: stricter gun laws; stricter law enforcement; greater security for candidates; violence off television; better parental control; ethics taught; better jobs and education. No figures printed.'
    n: '[[w.gallup-poll]], III, 2130. See [[cal.1968-06-05.robert-kennedy]].'
  - id: cal.1968-06-10.crime-and-hijacking-guns
    when: June 10–11
    date: '1968-06-10'
    thread: crime-and-hijacking-guns
    c: 'The House Judiciary Committee deadlocks and the gun bill fails. Johnson, June 11: "a bitter disappointment."'
    n: '[Statement by the President on the Tie Vote on a Gun Control Bill in the House Judiciary Committee](https://www.presidency.ucsb.edu/documents/statement-the-president-the-tie-vote-gun-control-bill-the-house-judiciary-committee) (June 11, 1968). See [[cal.1968-06-06.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-06-10.civil-disorders
    when: June 10
    date: '1968-06-10'
    thread: civil-disorders
    also: [assassination, crime-and-hijacking]
    c: 'Executive Order 11412: the National Commission on the Causes and Prevention of Violence, Milton Eisenhower its chairman. Johnson''s questions: what in American society causes "disrespect for the law"; whether "permissiveness toward extreme behavior" has encouraged violence; whether its seeds are nurtured through "the public''s airwaves."'
    n: '[Executive Order 11412](https://www.presidency.ucsb.edu/documents/executive-order-11412-establishing-national-commission-the-causes-and-prevention-violence); [Remarks and Statement Upon Signing Order Establishing the National Commission on the Causes and Prevention of Violence](https://www.presidency.ucsb.edu/documents/remarks-and-statement-upon-signing-order-establishing-the-national-commission-the-causes) (June 10, 1968). [[w.national-commission-to-establish-justice|full]]; [[w.flamm-law-and-order]]. See [[cal.1968-06-05.robert-kennedy]]; [[cal.1967-07-27.civil-disorders]]. Names: Milton Eisenhower, Johnson.'
    tags: [name:eisenhower-milton-s, name:johnson-lyndon-b]
  - id: cal.1968-06-10.crime-and-hijacking
    when: June 10
    date: '1968-06-10'
    thread: crime-and-hijacking
    also: [court]
    c: '*Terry v. Ohio*, [392 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392001/usrep392001.pdf): a Cleveland detective''s stop and pat-down of men he took to be casing a store, without probable cause to arrest, is no unreasonable search where he reasonably concludes "that criminal activity may be afoot and that the persons with whom he is dealing may be armed and presently dangerous." Warren for the Court, 8–1; Harlan and White concurring; Douglas dissenting. *Sibron v. New York*, [392 U.S. 40](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392040/usrep392040.pdf), the same day.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.barrett-deciding-the-stop-and]]; [[w.powe-warren-court-and-american]]. See [[cal.1967-12-18.court]]. Names: Warren.'
    tags: [name:warren-earl, name:harlan-john-marshall, name:white-byron-r, name:douglas-william-o, state:oh, city:cleveland]
  - id: cal.1968-06-10.school-aid
    when: June 10
    date: '1968-06-10'
    thread: school-aid
    also: [court]
    c: '*Flast v. Cohen*, [392 U.S. 83](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392083/usrep392083.pdf): a federal taxpayer has standing to challenge spending under the Elementary and Secondary Education Act for parochial schools as an establishment of religion; *Frothingham* distinguished. Warren for the Court, 8–1; Harlan dissenting. *Board of Education v. Allen*, [392 U.S. 236](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392236/usrep392236.pdf): New York''s loan of textbooks to pupils of church schools upheld; White for the Court, 6–3; Black, Douglas and Fortas dissenting.'
    n: Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]. See [[cal.1968-01-02.school-aid]].
    tags: [name:warren-earl, name:harlan-john-marshall, name:white-byron-r, name:black-hugo-l, name:douglas-william-o, name:fortas-abe, state:ny]
  - id: cal.1968-06-11.vietnam-paris
    when: June 11
    date: '1968-06-11'
    thread: vietnam-paris
    also: [soviet-union]
    c: 'Johnson''s reply to Kosygin, given Dobrynin by Rusk, the advisers having met on it June 9, after the funeral: ready to stop the bombing "as a further step toward peace," but Hanoi must decide not to take advantage of it; would Moscow say "privately and with precision" that there would be no adverse military consequences? Saigon under "the most vicious and indiscriminate attacks."'
    n: 'FRUS 1964–68, VI, docs. [265](https://history.state.gov/historicaldocuments/frus1964-68v06/d265), [269](https://history.state.gov/historicaldocuments/frus1964-68v06/d269). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-06-05.vietnam]]. Names: Kosygin, Dobrynin, Rusk, Johnson.'
    tags: [name:kosygin-aleksei, name:dobrynin-anatoly, name:rusk-dean, name:johnson-lyndon-b]

  - id: cal.1968-06-11.elections-1968
    when: June 11
    date: '1968-06-11'
    thread: elections-1968
    c: 'Illinois primary. Republican: Nixon (write-in) 78.1 percent, Rockefeller (write-in) 9.7. Democratic: McCarthy (write-in) 38.6 percent, Kennedy (write-in) 33.7.'
    n: '[*State of Illinois Official Vote Cast at the Primary Election, June 11, 1968*, 3, 8–11](https://archive.org/details/stateofillinoiso1968illi/page/n7). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: Kennedy, McCarthy, Rockefeller, Nixon.'
    tags: [primary:1968-06-11, name:kennedy-edward-m, name:mccarthy-eugene-j, name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1968-06-11.berlin-and-vienna
    when: June 11
    date: '1968-06-11'
    thread: berlin-and-vienna
    also: [europe-and-the-alliance, soviet-union]
    c: 'East Germany requires passports and visas of West Germans traveling to West Berlin and through its territory, raises the autobahn fee, and puts a tax on freight carried by West German trucks. The Berlin Task Force meets (Check the day).'
    n: 'FRUS 1964–68, XV, doc. [268](https://history.state.gov/historicaldocuments/frus1964-68v15/d268). [[w.schwartz-lyndon-johnson-and-europe]].'
    tags: [city:berlin]

  - id: cal.1968-06-11.governors-il
    when: June 11
    date: '1968-06-11'
    thread: governors
    also: [elections-1968]
    c: 'Illinois, primaries for governor. Republican: Ogilvie, president of the Cook County Board, once its sheriff, 335,727, 47.5 percent; Altorfer, the nominee for lieutenant governor in 1964, 288,904, 40.9; Stratton, governor 1953–61, 7.1; one other 4.5. Governor Shapiro unopposed.'
    n: '[*Official Vote of the State of Illinois Cast at the General Election, November 5, 1968 ... General Primary, June 11, 1968*](https://www.elections.il.gov/DocDisplay.aspx?doc=Downloads/ElectionOperations/VoteTotals/Archived/1968/1968%20GE%20and%20PE.PDF#page=90), PDF p. 90. [[w.peirce-great-lakes-states-of]]; [[w.kenney-political-passage]]. See [[cal.1968-05-21.governors-il]]. Names: Ogilvie, Altorfer, Stratton, Shapiro.'
    tags: [state:il, name:ogilvie-richard-b, name:altorfer-john-henry, name:stratton-william-g, name:shapiro-samuel-h]
  - id: cal.1968-06-11.open-housing-mi
    when: June 11
    date: '1968-06-11'
    thread: open-housing
    also: [states-and-cities]
    c: 'Michigan. Romney signs the State''s open housing act, passed by the legislature at his request: discrimination by race, color, creed or national origin barred in all housing publicly offered for sale or rent, owner-occupied duplexes and boarding houses and short rentals excepted; the Civil Rights Commission to enforce it; in force ninety days after the session ends.'
    n: '*Pontiac Press*, [June 11, 1968](https://our.oakland.edu/bitstreams/3a5514ee-97b3-4d37-810d-27076786add9/download), 1 (UPI). Check: 1968 PA 112, its votes. [[w.fine-expanding-the-frontiers-of]]. See [[cal.1967-10.open-housing-mi]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1968-06-12.testing
    when: June 12
    date: '1968-06-12'
    thread: testing-npt
    also: [soviet-union]
    c: 'The General Assembly commends the treaty on the nonproliferation of nuclear weapons to the governments of the world, 95–4, 21 abstaining, Resolution 2373 (XXII). Johnson at the Assembly the same afternoon: the treaty "the most important international agreement in the field of disarmament since the nuclear age began."'
    n: '[Remarks Before the U.N. General Assembly Following Its Endorsement of the Nuclear Nonproliferation Treaty](https://www.presidency.ucsb.edu/documents/remarks-before-the-un-general-assembly-following-its-endorsement-the-nuclear) (June 12, 1968). [[w.seaborg-stemming-the-tide]]; [[w.maddock-nuclear-apartheid]]. See [[cal.1967-08-24.testing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, city:nyc]
  - id: cal.1968-06-12.opinion
    when: June 12
    date: '1968-06-12'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, May 23–28, with Wallace as a third party''s candidate: Humphrey 42 percent, Nixon 36, Wallace 14, undecided 8. South: Humphrey 36, Nixon 29, Wallace 29. Independents: Nixon 39, Humphrey 26, Wallace 26. Humphrey 39, Rockefeller 36, Wallace 17; Republicans, Rockefeller 60, Humphrey 14, Wallace 17.'
    n: '[[w.gallup-poll]], III, 2130–33. Names: Humphrey, Nixon, Wallace, Rockefeller.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:rockefeller-nelson]
  - id: cal.1968-06-13.soviet-union
    when: June 13
    date: '1968-06-13'
    thread: soviet-union-consular
    c: 'The White House. The Consular Convention with the Soviet Union, [19 U.S.T. 5018](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-19-4/lltreaties-19-4.pdf#page=940), [655 U.N.T.S. 214](https://treaties.un.org/doc/Publication/UNTS/Volume%20655/volume-655-I-9383-English.pdf), proclaimed, Dobrynin and Rusk present. Johnson: "the first bilateral treaty between the Soviet Union and the United States." In force July 13.'
    n: '[Remarks at the Ratification Ceremony for the Consular Convention Between the United States and the Soviet Union](https://www.presidency.ucsb.edu/documents/remarks-the-ratification-ceremony-for-the-consular-convention-between-the-united-states) (June 13, 1968). See [[cal.1967-03-16.soviet-union]]. Names: Dobrynin, Rusk, Johnson.'
    tags: [name:dobrynin-anatoly, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-06-14.war-opposition
    when: June 14
    date: '1968-06-14'
    thread: war-opposition
    also: [draft]
    c: Boston. The jury in the federal court finds Spock, Coffin, Goodman and Ferber guilty of conspiracy to counsel evasion of the draft; Raskin acquitted.
    n: '*United States v. Spock*, [416 F.2d 165](https://static.case.law/f2d/416/case-pdfs/0165-01.pdf) (1st Cir. 1969), the appeal. See [[cal.1968-01-05.war-opposition]]. Names: Spock, Coffin, Goodman, Ferber, Raskin.'
    tags: [name:spock-benjamin, name:coffin-william-sloane-jr, name:goodman-mitchell, name:ferber-michael, name:raskin-marcus, state:ma, city:boston]
  - id: cal.1968-06-14.berlin-and-vienna
    when: June 14
    date: '1968-06-14'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: 'New York. Rusk to Kuznetsov: East Germany''s measures, taken without consultation, affect the four-power agreements on Berlin.'
    n: 'FRUS 1964–68, XV, doc. [270](https://history.state.gov/historicaldocuments/frus1964-68v15/d270). See [[cal.1968-06-11.berlin-and-vienna]]. Names: Rusk, Kuznetsov.'
    tags: [name:rusk-dean, name:kuznetsov-vasily-v, city:berlin]

  - id: cal.1968-06-17.berlin-and-vienna
    when: June 17
    date: '1968-06-17'
    thread: berlin-and-vienna
    also: [europe-and-the-alliance]
    c: 'Johnson to Kiesinger, the Day of German Unity: Berlin "once again threatened"; support "as firm as ever."'
    n: '[Message to Chancellor Kiesinger on the Situation in Berlin](https://www.presidency.ucsb.edu/documents/message-chancellor-kiesinger-the-situation-berlin) (June 17, 1968). See [[cal.1968-06-11.berlin-and-vienna]]. Names: Kiesinger, Johnson.'
    tags: [name:kiesinger-kurt-georg, name:johnson-lyndon-b, city:berlin]

  - id: cal.1968-06-17.open-housing
    when: June 17
    date: '1968-06-17'
    thread: open-housing
    also: [court]
    c: '*Jones v. Alfred H. Mayer Co.*, [392 U.S. 409](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392409/usrep392409.pdf): the Civil Rights Act of 1866, 42 U.S.C. § 1982, bars all racial discrimination, private as well as public, in the sale or rental of property, and is valid under the Thirteenth Amendment. A Negro couple refused a house in a St. Louis County subdivision. Stewart for the Court, 7–2; Douglas concurring; Harlan, with White, dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]. See [[cal.1968-04-10.open-housing]]. '
    tags: [name:stewart-potter, name:douglas-william-o, name:harlan-john-marshall, name:white-byron-r, state:mo]
  - id: cal.1968-06-17.welfare
    when: June 17
    date: '1968-06-17'
    thread: welfare
    also: [court, alabama]
    c: '*King v. Smith*, [392 U.S. 309](https://tile.loc.gov/storage-services/service/ll/usrep/usrep392/usrep392309/usrep392309.pdf): Alabama''s "substitute father" regulation, denying aid to dependent children whose mother cohabits with an able-bodied man, invalid under the Social Security Act. Warren for the Court; no dissent.'
    n: Opinion (K–J Cong. II.J.1). [[w.davis-brutal-need]]; [[w.melnick-between-the-lines]]. See [[cal.1968-01-02.welfare]].
    tags: [name:warren-earl, state:al]
  - id: cal.1968-06-18.governors-in
    when: June 18
    date: '1968-06-18'
    thread: governors
    also: [elections-1968]
    c: 'Indiana''s Republican convention names Whitcomb, the secretary of state, for governor: 1,260 votes, 56.9 percent; Bowen, Speaker of the House, 527; Butz, once Assistant Secretary of Agriculture, 429. Branigin may not succeed himself.'
    n: 'Votes: [Wikipedia, "1968 Indiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Indiana_gubernatorial_election), from *America Votes 8* (Check: the conventions'' proceedings; Indiana''s *Election Report* prints the general only). [[w.peirce-great-lakes-states-of]]. See [[cal.1964-06-09.governors-in]]. Names: Whitcomb, Bowen, Butz, Branigin.'
    tags: [state:in, name:whitcomb-edgar-d, name:bowen-otis-r, name:butz-earl-l, name:branigin-roger-d]

  - id: cal.1968-06-18.crime-and-hijacking-guns
    when: June 18
    date: '1968-06-18'
    thread: crime-and-hijacking-guns
    c: 'Dodd''s subcommittee reports the gun bill.'
    n: 'See [[cal.1968-06-06.crime-and-hijacking]]. Names: Dodd.'
    tags: [name:dodd-thomas-j]

  - id: cal.1968-06-18.opinion
    when: June 18
    date: '1968-06-18'
    thread: opinion
    also: [poverty, welfare]
    c: 'Gallup, May 23–28: every family of four guaranteed an income of at least $3,200 a year, the Government making up the difference: favor 36 percent, oppose 58. Whites 33 and 60; non-whites 66 and 30. Enough work guaranteed to each family with an employable wage earner to earn about $60 a week, $3,200 a year: favor 78, oppose 18.'
    n: '[[w.gallup-poll]], III, 2133.'
  - id: cal.1968-06-19.crime-and-hijacking
    when: June 19
    date: '1968-06-19'
    thread: crime-and-hijacking-safe-streets
    also: [court]
    c: 'Omnibus Crime Control and Safe Streets Act signed, [82 Stat. 197](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg197.pdf). Title I, the Law Enforcement Assistance Administration and block grants to the States; Title II, on confessions and eyewitnesses in the federal courts; Title III, wiretapping and eavesdropping on court order, and without one in emergencies and for national security; Title IV, handguns. Johnson: more good than bad; Title III "unwise and potentially dangerous," to be repealed.'
    n: '[Statement by the President Upon Signing the Omnibus Crime Control and Safe Streets Act of 1968](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-omnibus-crime-control-and-safe-streets-act-1968) (June 19, 1968). Statute (K–J Cong. II.J.2). See [[cal.1968-05-09.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-06-19.economy
    when: June 19
    date: '1968-06-19'
    thread: economy
    also: [trade]
    c: 'Special Drawing Rights Act signed, [82 Stat. 188](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg188.pdf): American participation in the facility based on special drawing rights in the International Monetary Fund, the Fund''s Articles amended. The House had passed it May 10, [237–15](https://voteview.com/rollcall/RH0900317). Fowler and Martin at the signing. Johnson: nations "able to create international reserves by deliberate and joint decision."'
    n: '[Remarks Upon Signing the Special Drawing Rights Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-special-drawing-rights-act) (June 19, 1968). Statute (K–J Cong. II.J.2). [[w.solomon-international-monetary-system-1945]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1967-08-26.economy]]. Names: Fowler, Martin, Johnson.'
    tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr, name:johnson-lyndon-b]
  - id: cal.1968-06-19.king
    when: June 19
    date: '1968-06-19'
    thread: king-poor-peoples
    also: [poverty]
    c: 'Solidarity Day, at the Lincoln Memorial: some 50,000 for the Poor People''s Campaign (Check).'
    n: 'See [[cal.1968-05-12.king]].'
    tags: [city:washington]

  - id: cal.1968-06-19.opinion
    when: June 19
    date: '1968-06-19'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, special survey, in the South, with Nixon, Humphrey and Wallace: for Wallace, the Deep South (five States) 47 percent, the rest of the South (eight States) 23, the South 29. Democratic county chairmen of the Deep South, their estimates of Wallace''s vote in their own States: Alabama 74, Mississippi 64, Louisiana 54, Georgia 46, South Carolina 37. States Wallace will carry, on the chairmen''s average: seven (the Deep South''s), five (the rest of the South''s), four (outside the South).'
    n: '[[w.gallup-poll]], III, 2134. Names: Wallace, Nixon, Humphrey.'
    tags: [name:wallace-george-c, name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-06-20.economy
    when: June 20
    date: '1968-06-20'
    thread: economy-surcharge
    also: [congress]
    c: 'Revenue and Expenditure Control Act. Johnson to the Speaker: pass it. The House adopts the conference report, [268–150](https://voteview.com/rollcall/RH0900357).'
    n: '[Letter to the Speaker of the House Urging Passage of the Tax Bill](https://www.presidency.ucsb.edu/documents/letter-the-speaker-the-house-urging-passage-the-tax-bill) (June 20, 1968). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]; [[w.okun-political-economy-of-prosperity]]; [[w.president-and-the-council]]. See [[cal.1968-05-05.economy]]. Names: McCormack, Johnson.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w]

  - id: cal.1968-06-20.crime-and-hijacking-guns
    when: June 20
    date: '1968-06-20'
    thread: crime-and-hijacking-guns
    c: 'The House Judiciary Committee approves the gun bill. Johnson: a statement; to the governors.'
    n: '[Statement by the President Following House Committee Approval of the Gun Control Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-committee-approval-the-gun-control-bill) (June 20, 1968). See [[cal.1968-06-06.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-06-21.testing
    when: June 21
    date: '1968-06-21'
    thread: testing-missile-talks
    also: [defense, soviet-union]
    c: 'Strategic arms. Kosygin to Johnson, delivered by Dobrynin, answering his letters of Jan. 22 and May 2: the Soviet Union attaches great importance to restraint, offensive and defensive systems to be considered together; "before long" a more concrete exchange of views, "if of course the general world situation does not hinder this."'
    n: 'FRUS 1964–68, XI, docs. [237](https://history.state.gov/historicaldocuments/frus1964-68v11/d237), [247](https://history.state.gov/historicaldocuments/frus1964-68v11/d247). [[w.newhouse-cold-dawn]]; [[w.seaborg-stemming-the-tide]]. Made public: FRUS 1964–68, XI (1997). Names: Kosygin, Dobrynin, Johnson.'
    tags: [name:kosygin-aleksei, name:dobrynin-anatoly, name:johnson-lyndon-b]

  - id: cal.1968-06-21.economy-surcharge
    when: June 21
    date: '1968-06-21'
    thread: economy-surcharge
    also: [congress]
    c: 'The Senate adopts the conference report on the Revenue and Expenditure Control Act, [64–16](https://voteview.com/rollcall/RS0900468).'
    n: 'See [[cal.1968-06-20.economy]].'

  - id: cal.1968-06-21.governors-in
    when: June 21
    date: '1968-06-21'
    thread: governors
    also: [elections-1968]
    c: 'Indiana''s Democratic convention names Rock, the lieutenant governor, for governor: 953 votes; Bodine, once Speaker, 951.'
    n: 'Votes: [Wikipedia, "1968 Indiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Indiana_gubernatorial_election) (Check: the convention''s proceedings). See [[cal.1968-06-18.governors-in]]. Names: Rock, Bodine.'
    tags: [state:in, name:rock-robert-l, name:bodine-richard-c]

  - id: cal.1968-06-22.testing-missile-talks
    when: June 22
    date: '1968-06-22'
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'Johnson to Kosygin: the nonproliferation treaty opens for signature July 1; a joint announcement that day of the strategic arms talks would be "particularly fitting."'
    n: 'FRUS 1964–68, XI, doc. [248](https://history.state.gov/historicaldocuments/frus1964-68v11/d248). Made public: FRUS 1964–68, XI (1997). See [[cal.1968-06-21.testing]]. Names: Kosygin, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b]

  - id: cal.1968-06-23.opinion
    when: June 23
    date: '1968-06-23'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 13–18, with Wallace as a third party''s candidate: Humphrey 42 percent, Nixon 37, Wallace 14. Rockefeller 39, Humphrey 38, Wallace 17. McCarthy 41, Nixon 39, Wallace 14. McCarthy 39, Rockefeller 38, Wallace 16.'
    n: '[[w.gallup-poll]], III, 2134–35. Names: Humphrey, Nixon, Wallace, Rockefeller, McCarthy.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:rockefeller-nelson, name:mccarthy-eugene-j]
  - id: cal.1968-06-24.crime-and-hijacking-guns
    when: June 24
    date: '1968-06-24'
    thread: crime-and-hijacking-guns
    c: 'Message, "The People''s Right to Protection": a national registration of every firearm, and federal licensing of their possessors where State laws fall short.'
    n: '[Special Message to the Congress: "The People''s Right to Protection"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-peoples-right-protection) (June 24, 1968). See [[cal.1968-06-06.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-06-24.king-poor-peoples
    when: June 24
    date: '1968-06-24'
    thread: king-poor-peoples
    also: [poverty]
    c: 'Washington. The permit for Resurrection City having run out June 23, the police clear the camp; Abernathy and some 200 arrested on the Capitol grounds; disorder in the city that night, a curfew (Check the numbers).'
    n: 'See [[cal.1968-05-12.king]]. Names: Abernathy.'
    tags: [name:abernathy-ralph-david, city:washington]

  - id: cal.1968-06-24.defense
    when: June 24–25
    date: '1968-06-24'
    thread: defense
    c: The Senate, the military construction authorization for fiscal 1969, H.R. 16703. No funds for an antiballistic missile system before July 1, 1969, refused, [34–52](https://voteview.com/rollcall/RS0900469), Cooper's and Hart's amendment (Check); the $227.3 million for the Sentinel struck, refused, [12–72](https://voteview.com/rollcall/RS0900470). Passed June 25, [78–3](https://voteview.com/rollcall/RS0900477).
    n: '[[w.yanarella-missile-defense-controversy]]; [[w.halperin-decision-to-deploy-the]]. See [[cal.1967-09-18.defense]]. Names: Cooper, Hart.'
    tags: [name:cooper-john-sherman, name:hart-philip-a]
  - id: cal.1968-06-24.transition-and-staff
    when: June 24
    date: '1968-06-24'
    thread: transition-and-staff
    c: 'George Ball sworn Representative to the United Nations, Goldberg''s successor. Johnson: one of those "gifted amateurs."'
    n: '[Remarks at the Swearing In of George Ball as U.S. Representative to the United Nations](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-george-ball-us-representative-the-united-nations) (June 24, 1968). [[w.ball-past-has-another-pattern]]; [[w.bill-george-ball]]; [[w.dileo-george-ball-vietnam-and]]. Names: Ball, Goldberg, Johnson.'
    tags: [name:ball-george-w, name:goldberg-arthur-j, name:johnson-lyndon-b]
  - id: cal.1968-06-24.state-constitutions-fl
    when: June 24–July 3
    date: '1968-06-24'
    thread: state-constitutions
    c: 'Florida. The legislature, in special session, proposes a revised constitution in three joint resolutions: the basic document (H.J.R. 1-2X), suffrage and elections (Art. VI), local government (Art. VIII); the judiciary, Art. V, left as it is. To the voters Nov. 5.'
    n: '[Wikipedia, "Constitution of Florida"](https://en.wikipedia.org/wiki/Constitution_of_Florida). Check: the *Journal of the House of Representatives*, Extraordinary Session, 1968, and the votes. [[w.dalemberte-florida-state-constitution]]; [[w.colburn-floridas-gubernatorial-politics-in]].'
    tags: [state:fl]
  - id: cal.1968-06-25.vietnam
    when: June 25–26
    date: '1968-06-25'
    thread: vietnam-paris
    c: 'Paris. Vance meets Hà Văn Lâu privately at a house in Vitry-sur-Seine, near the North Vietnamese delegation''s headquarters, two hours, Habib with him; the place Hanoi''s choice (Check the night). Lunch at the White House, June 25: the cable to Vance following up Zorin''s talk with Shriver. Lê Đức Thọ leaves Paris for Hanoi, by Moscow, the next day.'
    n: 'FRUS 1964–68, VI, docs. [282](https://history.state.gov/historicaldocuments/frus1964-68v06/d282), [283](https://history.state.gov/historicaldocuments/frus1964-68v06/d283), [285](https://history.state.gov/historicaldocuments/frus1964-68v06/d285). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-13.vietnam]]. Names: Vance, Hà Văn Lâu, Habib, Zorin, Shriver, Lê Đức Thọ.'
    tags: [name:vance-cyrus, name:ha-van-lau, name:habib-philip-c, name:zorin-valerian, name:shriver-r-sargent, name:le-duc-tho]
  - id: cal.1968-06-26.court
    when: June 26
    date: '1968-06-26'
    thread: court
    also: [confirmations]
    c: 'Warren''s letters of June 13: he will retire as Chief Justice "effective at your pleasure," because of age alone. Johnson accepts, June 26, the retirement to take effect when a successor is qualified, and names Fortas Chief Justice and Thornberry, of the Fifth Circuit, once Representative from Austin, to Fortas''s seat. Johnson and Fortas by telephone, June 21. Griffin and other Republican Senators oppose confirming nominees of a President not standing again (Check the day and the number).'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1210) (June 26, 1968). [Johnson and Fortas, 3:48 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-abe-fortas-june-21-1968), Conversation WH6806-02-13127 (Miller Center). [[w.kalman-abe-fortas]]; [[w.murphy-fortas]]; [[w.shogan-question-of-judgment]]; [[w.kalman-long-reach-of-the-2017]]; [[w.newton-justice-for-all]]; [[w.schwartz-super-chief]]; [[w.dallek-flawed-giant]]. See [[cal.1967-06-13.court]]. Names: Warren, Fortas, Thornberry, Griffin, Johnson.'
    tags: [name:warren-earl, name:fortas-abe, name:thornberry-william-h, name:griffin-robert-p, name:johnson-lyndon-b]
  - id: cal.1968-06-26.japan-and-korea
    when: June 26
    date: '1968-06-26'
    thread: japan-and-korea
    c: The Bonin and Volcano Islands, Iwo Jima among them, returned to Japanese administration, under the agreement signed at Tokyo Apr. 5 (Check its U.S.T. and U.N.T.S. cites). Johnson to the islanders.
    n: '[Message to the Bonin Islanders on the Return of the Islands to Japanese Administration](https://www.presidency.ucsb.edu/documents/message-the-bonin-islanders-the-return-the-islands-japanese-administration) (June 26, 1968). See [[cal.1967-11-14.japan-and-korea]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-06-26.opinion
    when: June 26
    date: '1968-06-26'
    thread: opinion
    also: [vietnam, elections-1968-polls]
    c: 'Gallup, June 13–18: the better man to deal with the Vietnam war: Nixon 41 percent, Humphrey 41; independents 47 and 35. The United States and its allies losing ground 25, standing still 47, making progress 18. The bombing of the North stopped, and if after one or two months Hanoi has not begun to remove its soldiers from the South, a decision whether to bomb all of the North, the cities included: favor 54, oppose 33.'
    n: '[[w.gallup-poll]], III, 2135–36. Names: Nixon, Humphrey.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-06-27.vietnam
    when: June 27
    date: '1968-06-27'
    thread: vietnam-khe-sanh
    c: 'The command announces that the Marines will leave Khe Sanh and the base be dismantled, its forces to more mobile operations. Check the day of the announcement.'
    n: '[[w.sorley-thunderbolt]]. See [[cal.1968-01-21.vietnam]].'
    tags: [name:abrams-creighton]

  - id: cal.1968-06-27.testing-missile-talks
    when: June 27
    date: '1968-06-27'
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'Kosygin to Johnson: ready to publish on July 1 a statement that the two governments have agreed to enter "in the nearest future" into talks on offensive strategic weapons and on defense against ballistic missiles. Gromyko to the Supreme Soviet: ready to exchange views on their limitation (Check).'
    n: 'FRUS 1964–68, XI, doc. [249](https://history.state.gov/historicaldocuments/frus1964-68v11/d249). Made public: FRUS 1964–68, XI (1997). See [[cal.1968-06-21.testing]]. Names: Kosygin, Gromyko, Johnson.'
    tags: [name:kosygin-aleksei, name:gromyko-andrei, name:johnson-lyndon-b]

  - id: cal.1968-06-27.voting-rights
    when: June 27
    date: '1968-06-27'
    thread: voting-rights
    also: [amendments]
    c: 'Message: a constitutional amendment, the vote at eighteen. "The right of any citizen of the United States to vote shall not be denied or abridged by the United States or by any State on account of age if a citizen is eighteen years of age or older." Georgia votes at eighteen since 1943, Kentucky since 1955.'
    n: '[Special Message to the Congress: "To Vote at Eighteen--Democracy Fulfilled and Enriched"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-vote-eighteen-democracy-fulfilled-and-enriched) (June 27, 1968). See [[cal.1968-05-14.amendments]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-06-28.economy-surcharge
    when: June 28
    date: '1968-06-28'
    thread: economy-surcharge
    c: 'Revenue and Expenditure Control Act signed, [82 Stat. 251](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg251.pdf): a 10 percent surcharge on income taxes, from Jan. 1 for corporations and Apr. 1 for others, to June 30, 1969; fiscal 1969 expenditures cut $6 billion from the January budget, new obligational authority $10 billion; recommendations to rescind $8 billion of old; civilian employment limited; the excises on automobiles and telephones kept. Johnson: $20 billion off the deficit; Congress will "shift to the President the responsibility" for the cuts. A memorandum to the agencies.'
    n: '[Statement by the President Upon Signing the Tax Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-tax-bill); [Memorandum on the Need for Reduced Spending by Federal Agencies Following Enactment of the Tax Bill](https://www.presidency.ucsb.edu/documents/memorandum-the-need-for-reduced-spending-federal-agencies-following-enactment-the-tax-bill) (June 28, 1968). Statute (K–J Cong. II.J.2). See [[cal.1968-06-20.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-06-30.opinion
    when: June 30
    date: '1968-06-30'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 13–18: consider themselves Republicans 27 percent, Democrats 46, independents 27. Southern whites 18, 50 and 32. Non-whites 7, 75 and 18. Union members 9, 59 and 32. Those 21 to 29: 22, 38 and 40.'
    n: '[[w.gallup-poll]], III, 2136–38.'
  - id: cal.1968-06-30.europe-and-the-alliance-france
    when: June 30
    date: '1968-06-30'
