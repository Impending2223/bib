entries:
  - id: cal.1965-12-03.alabama
    when: Dec. 3
    date: '1965-12-03'
    thread: alabama
    also: [civil-rights-the-executive]
    c: 'Montgomery. A federal jury, all white, convicts Wilkins and two other Klansmen from the car from which Viola Liuzzo was shot of conspiracy against the rights of citizens, 18 U.S.C. § 241; each sentenced to ten years, the maximum. Judge Johnson presiding (Check). Wilkins twice tried for murder in Lowndes County without conviction.'
    n: '*Wilkins v. United States*, [376 F.2d 552](https://static.case.law/f2d/376/html/0552-01.html) (5th Cir. 1967) (affirmed). May, *The Informant* (K–J Cong. II.F). See [[cal.1965-03-25.alabama]]; [[cal.1965-05-07.alabama]]. Names: Wilkins, Liuzzo (K–J Cong. III.K); Johnson (K–J Cong. III.G).'
    tags: [name:wilkins-collie-leroy-jr, name:liuzzo-viola, name:johnson-frank-m-jr]
  - id: cal.1965-12-05.economy
    when: Dec. 5–6
    date: '1965-12-05'
    thread: economy
    c: 'The Federal Reserve announces, Sunday, Dec. 5: the discount rate at New York and Chicago from 4 to 4½ percent, effective Dec. 6; the ceiling on time deposits of 30 days or more to 5½ percent. The Board acted Friday, Dec. 3, 4–3, Robertson, Mitchell, and Maisel dissenting. Johnson, from Austin, the same day: the Board "an independent agency"; he regrets an action taken "before January when we will have before us the full facts on next year''s budget, Viet-Nam costs." Dec. 6, the Quadriad at the Ranch, Martin with Fowler and Ackley. The other ten Reserve Banks follow, Dec. 8–13; the banks'' prime rate to 5 percent from Dec. 6. Dec. 13, the Board before the Joint Economic Committee.'
    n: '[Board press release](https://fraser.stlouisfed.org/title/9237/item/697401) (Dec. 5, 1965). [*Federal Reserve Bulletin*, Dec. 1965](https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/december-1965-21372), pp. 1667–68, 1751; Jan. 1966, p. 53. [Statement by the President on the Raising of the Discount Rate by the Federal Reserve Board](https://www.presidency.ucsb.edu/documents/statement-the-president-the-raising-the-discount-rate-the-federal-reserve-board) (Dec. 5, 1965); [The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-5) (Dec. 6, 1965). Kettl, *Leadership at the Fed*; Bremner, *Chairman of the Fed*; Meltzer, *A History of the Federal Reserve* (K–J Adm. II.B). Helsing, *Johnson''s War/Johnson''s Great Society* (Viet. II.F.18). See [[cal.1964-11-23.economy]]. Names: Martin, Fowler, Ackley (K–J Adm. III.H).'
    tags: [name:martin-william-mcchesney-jr, name:robertson-j-l, name:mitchell-george-w, name:maisel-sherman-j, name:johnson-lyndon-b, name:fowler-henry-h, name:ackley-gardner]
  - id: cal.1965-12-14.india-and-china
    when: Dec. 14–17
    date: '1965-12-14'
    thread: india-and-china
    c: 'Ayub Khan in Washington, Dec. 14–15. Joint statement: the United States regards "the preservation of the independence and integrity of Pakistan" as "vital to world peace"; both for the Security Council''s resolutions of Sept. 20, Sept. 27, and Nov. 5. Dec. 17, NSAM 339: Freeman to organize the shipping and delivery of grain against "near famine conditions" in India.'
    n: '[Remarks of Welcome to President Ayub Khan of Pakistan on the South Lawn at the White House](https://www.presidency.ucsb.edu/documents/remarks-welcome-president-ayub-khan-pakistan-the-south-lawn-the-white-house) (Dec. 14, 1965); [Joint Statement Following Discussions With the President of Pakistan](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-president-pakistan-0) (Dec. 15, 1965). FRUS 1964–68, XXV, docs. [263](https://history.state.gov/historicaldocuments/frus1964-68v25/d263), [265](https://history.state.gov/historicaldocuments/frus1964-68v25/d265), [267](https://history.state.gov/historicaldocuments/frus1964-68v25/d267); [NSAM No. 339](https://history.state.gov/historicaldocuments/frus1964-68v25/d268) (Dec. 17, 1965). See [[cal.1965-08-05.india-and-china]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:ayub-khan-mohammad, name:johnson-lyndon-b, name:freeman-orville-l]
  - id: cal.1965-12-15.space
    when: Dec. 15
    date: '1965-12-15'
    thread: space
    c: 'Gemini 6: Schirra and Stafford, launched after an abort on the pad Dec. 12, meet Gemini 7 in orbit and fly in company some five hours, the first rendezvous of two manned spacecraft. Gemini 6 down Dec. 16. Gemini 7, Borman and Lovell, up since Dec. 4, down Dec. 18 after 14 days, the longest flight yet.'
    n: '[Statement by the President on the Flight of Gemini 7](https://www.presidency.ucsb.edu/documents/statement-the-president-the-flight-gemini-7) (Dec. 4, 1965); [Statement by the President on the Delayed Takeoff of Gemini 6](https://www.presidency.ucsb.edu/documents/statement-the-president-the-delayed-takeoff-gemini-6) (Dec. 12, 1965); [Telegram to the Administrator, NASA, Following the Meeting in Space of Gemini 6 and Gemini 7](https://www.presidency.ucsb.edu/documents/telegram-the-administrator-nasa-following-the-meeting-space-gemini-6-and-gemini-7) (Dec. 15, 1965); [Letters to the Gemini 6 and Gemini 7 Astronauts After the Successful Completion of Their Mission](https://www.presidency.ucsb.edu/documents/letters-the-gemini-6-and-gemini-7-astronauts-after-the-successful-completion-their-mission) (Dec. 18, 1965). Barton C. Hacker & James M. Grimwood, *On the Shoulders of Titans: A History of Project Gemini* (1977). McDougall, *...the Heavens and the Earth* (K–J Adm. II.B). See [[cal.1965-03-23.space]]; [[cal.1965-08-21.space]]. Names: Schirra (K–J Adm. III.F); Stafford (K–J Cong. III.K); Webb (K–J Adm. III.G).'
    tags: [name:schirra-walter-m-jr, name:stafford-thomas-p, name:borman-frank, name:lovell-james-a-jr, name:webb-james-e, name:johnson-lyndon-b]
  - id: cal.1965-12-15.specials
    when: Dec. 15
    date: '1965-12-15'
    thread: specials
    c: 'California 26th, special. Rees (D), a State senator, takes the seat James Roosevelt left Sept. 30 for the UN Economic and Social Council. First round, Nov. 23: Rees 21,481 of 60,884, Horwin (D) 19,612, Marshall (R) 16,088. Runoff: Rees 40,430, Marshall 27,579, 59.4 percent. Swing 10.9 to R. Sworn Jan. 10, 1966.'
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 8, 1966, p. 5](https://archive.org/details/californiastate196668cali/page/n50). [112 Cong. Rec., House, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf) (Rees sworn). Roosevelt''s resignation: BD 1835. See [[cal.1961-04-04.states-and-cities]]. Names: Marshall (K–J Cong. III.K).'
    tags: [special:1965-12-15-h-CA-26, name:rees-thomas-m, name:roosevelt-james, name:marshall-edward-m]
  - id: cal.1965-12-20.europe-and-the-alliance
    when: Dec. 20–21
    date: '1965-12-20'
    thread: europe-and-the-alliance
    c: 'Erhard in Washington, with Schroeder and von Hassel. Joint statement, Dec. 21: the Federal Republic and other partners without nuclear weapons to have "an appropriate part in nuclear defense"; Germany wants no national control; alliance arrangements "would not constitute proliferation." The offset, German purchases of American arms against American military spending in Germany, to be "fully executed and continued." German support in Vietnam.'
    n: '[Toasts of the President and Chancellor Ludwig Erhard of Germany](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-chancellor-ludwig-erhard-germany) (Dec. 20, 1965); [Joint Statement Following Discussions With Chancellor Erhard](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-chancellor-erhard-1) (Dec. 21, 1965). FRUS 1964–68, XV, docs. [138](https://history.state.gov/historicaldocuments/frus1964-68v15/d138), [139](https://history.state.gov/historicaldocuments/frus1964-68v15/d139), [140](https://history.state.gov/historicaldocuments/frus1964-68v15/d140), [141](https://history.state.gov/historicaldocuments/frus1964-68v15/d141), [142](https://history.state.gov/historicaldocuments/frus1964-68v15/d142), [143](https://history.state.gov/historicaldocuments/frus1964-68v15/d143); XIII, docs. [119](https://history.state.gov/historicaldocuments/frus1964-68v13/d119), [120](https://history.state.gov/historicaldocuments/frus1964-68v13/d120). Schwartz, *Lyndon Johnson and Europe* (K–J Adm. II.D). See [[cal.1964-12-07.europe-and-the-alliance]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:erhard-ludwig, name:schroeder-gerhard, name:johnson-lyndon-b]
  - id: cal.1965-12-24.vietnam
    when: Dec. 24–28
    date: '1965-12-24'
    thread: vietnam
    c: 'The pause. Christmas truce, announced by Saigon and Washington Dec. 23: 6 p.m. Dec. 24 to midnight Dec. 25, Saigon time. No bombing of the North; B-52 strikes halted; the truce to end only on renewed Viet Cong attack. Behind it, the meetings of Dec. 17, 18, and 21, Rusk and McNamara for a pause. Wheeler and Westmoreland against. Dec. 27, from the Ranch, Johnson defers resuming the bombing "for several more days"; Taylor, by telephone, against, though a few days would not matter. Dec. 28, Saigon and the embassies told.'
    n: 'FRUS 1964–68, III, docs. [231](https://history.state.gov/historicaldocuments/frus1964-68v03/d231), [235](https://history.state.gov/historicaldocuments/frus1964-68v03/d235), [238](https://history.state.gov/historicaldocuments/frus1964-68v03/d238), [242](https://history.state.gov/historicaldocuments/frus1964-68v03/d242), [253](https://history.state.gov/historicaldocuments/frus1964-68v03/d253), [254](https://history.state.gov/historicaldocuments/frus1964-68v03/d254), [255](https://history.state.gov/historicaldocuments/frus1964-68v03/d255). Herring, *The Secret Diplomacy of the Vietnam War* (Viet. II.I.3). Thies, *When Governments Collide*; *The Search for Peace in Vietnam* (Viet. II.F.16). Cooper, *The Lost Crusade* (Viet. II.H.1). Berman, *Lyndon Johnson''s War*; Herring, *LBJ and Vietnam* (Viet. II.C.1). Johnson, *The Vantage Point* (K–J Adm. II.G.3). McNamara, *In Retrospect* (K–J Adm. II.G.4). Dallek, *Flawed Giant* (K–J Adm. II.A). See [[cal.1965-05-12.vietnam]]; [[cal.1965-11-28.vietnam]]. Names: Rusk, McNamara, Wheeler, Taylor (Viet. III.A); Westmoreland (Viet. III.D).'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:westmoreland-william, name:taylor-maxwell]
  - id: cal.1965-12-28.vietnam
    when: Dec. 28–Jan. 8
    date: '1965-12-28'
    thread: vietnam
    c: 'The peace offensive. Harriman, sent by Johnson: Warsaw, Dec. 29, Rapacki given Rusk''s fourteen points; Belgrade, Tito, Jan. 1; Tokyo by Jan. 8. Goldberg to Paul VI, Dec. 29, with a letter from Johnson; de Gaulle, Dec. 31. Humphrey to Manila for Marcos''s inauguration, Dec. 30, and to Tokyo, Seoul, Taipei; back Jan. 3. At Rangoon, Byroade hands the North Vietnamese consul general an aide-mémoire on the pause, Dec. 29.'
    n: 'FRUS 1964–68, III, docs. [256](https://history.state.gov/historicaldocuments/frus1964-68v03/d256), [257](https://history.state.gov/historicaldocuments/frus1964-68v03/d257), [261](https://history.state.gov/historicaldocuments/frus1964-68v03/d261), [265](https://history.state.gov/historicaldocuments/frus1964-68v03/d265), [266](https://history.state.gov/historicaldocuments/frus1964-68v03/d266), [271](https://history.state.gov/historicaldocuments/frus1964-68v03/d271), [277](https://history.state.gov/historicaldocuments/frus1964-68v03/d277), [278](https://history.state.gov/historicaldocuments/frus1964-68v03/d278); IV, docs. [7](https://history.state.gov/historicaldocuments/frus1964-68v04/d7), [12](https://history.state.gov/historicaldocuments/frus1964-68v04/d12). See [[cal.1965-12-24.vietnam]]. Names: Harriman, Rusk (Viet. III.A); Goldberg (K–J Adm. III.E); Humphrey (K–J Adm. III.D); de Gaulle (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:harriman-w-averell, name:rapacki-adam, name:tito-josip-broz, name:rusk-dean, name:goldberg-arthur-j, name:paul-vi, name:de-gaulle-charles, name:humphrey-hubert-h, name:marcos-ferdinand-e, name:byroade-henry-a]
  - id: cal.1965-12-30.congress
    when: Dec. 30
    date: '1965-12-30'
    thread: congress
    c: 'Saltonstall, Republican of Massachusetts, in the Senate since 1945, will not run again in 1966. Johnson''s telegram: "you will be missed in the councils of Washington."'
    n: '[Telegram to Senator Saltonstall Following His Announcement That He Would Not Seek Reelection](https://www.presidency.ucsb.edu/documents/telegram-senator-saltonstall-following-his-announcement-that-he-would-not-seek-reelection) (Dec. 30, 1965). BD 1858. Names: Saltonstall (Opp. III.A).'
    tags: [name:saltonstall-leverett, name:johnson-lyndon-b]
  - id: cal.1965-12-31.steel
    when: Dec. 31
    date: '1965-12-31'
    thread: steel
    also: [economy]
    c: 'Bethlehem Steel raises its prices on structural steel (Check the amount). Ackley asks for its reasons. Johnson, from Austin: the company''s answer gives "no justification"; "no time for unwarranted price increases which can lead to inflation"; the company to meet the Council of Economic Advisers "right away."'
    n: '[Statement by the President on the Price Increase by the Bethlehem Steel Company](https://www.presidency.ucsb.edu/documents/statement-the-president-the-price-increase-the-bethlehem-steel-company) (Dec. 31, 1965). See [[cal.1965-08-30.steel]]; [[cal.1965-11-06.economy]]. Names: Ackley (K–J Adm. III.H).'
    tags: [name:johnson-lyndon-b, name:ackley-gardner]
