    c: The Central Committee and the State Council reply, by letter, to the Soviet Central Committee and government, who proposed a top-level meeting of DRV, Chinese and Soviet representatives on further steps for Vietnam's security. China's stand on Vietnam is well known; it will under any circumstances meet its proletarian internationalist duty without hesitation, and has helped and will help Vietnam by military, economic and political means. China and Vietnam have held many talks and reached full agreement on major matters; there is no need to talk again. Soviet aid to Vietnam is too little; how to aid is for the Soviet–Vietnamese side to settle, and China need not take part.
