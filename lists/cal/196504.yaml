    time: 1965-04-01T22:30Z
    thread: vietnam-force-levels
    c: 'The White House: Rusk, McGeorge Bundy and McNamara question the Chiefs'' two divisions. Johnson defers them; approves the two battalions Westmoreland and Sharp asked and the change of the Marines'' mission from base security to active combat.'
    n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.15. [[w.drea-mcnamara-clifford-and-the-2011]], 27 (late afternoon; Wheeler for three divisions, "we are losing the war out there," and a reserve call-up; McNamara and Rusk for deferring; some 20,000 logistical troops, more Marines, offensive operations). The hour, 5:30 p.m.: Bundy''s agenda for the meeting, [FRUS 1964–68, II, doc. 228](https://history.state.gov/historicaldocuments/frus1964-68v02/d228). To check: McGeorge Bundy, notes of the meeting of Apr. 1, 1965, Papers of McGeorge Bundy, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.15). See [[cal.1965-03-20.vietnam-force-levels]]. Names: Rusk, Bundy, McNamara, Johnson, Westmoreland, Sharp.'
    src:
      c: 3849e807
      rows:
