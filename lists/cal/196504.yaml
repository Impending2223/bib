  - id: cal.1965-04-02.vietnam
    when: Apr. 2
    date: '1965-04-02'
    time: 1965-04-02T15:30Z
    thread: vietnam
    c: 'Taylor before Foreign Relations and Armed Services in executive session, then the House committee; guarded on troops. To the NSC: Fulbright worried of three or four divisions, and whether the resolution covers them. Johnson: no new resolution needed to send troops. Case: the resolution not enough for "a major step." Fulbright: "Maybe we made a mistake in committing ourselves publicly"; $1 million for an embassy building, "but you don''t want to ask us for 300,000 men." Stennis: "we are moving rapidly in that direction."'
    n: 'FRUS 1964–68, II, docs. [231](https://history.state.gov/historicaldocuments/frus1964-68v02/d231), [235](https://history.state.gov/historicaldocuments/frus1964-68v02/d235) (William Bundy to the congressional liaison, Apr. 3). [[w.gibbons-u-s-government-and]], III, 212–14; [[w.taylor-swords-and-plowshares]], 339 (two sessions before the combined committees, in Washington Mar. 28 to Apr. 5). [[w.mann-grand-delusion]], 422–24. To check: the joint executive session''s transcript, Apr. 2, 1965, unpublished (cited by [[w.gibbons-u-s-government-and]], III, 212 n.189). See [[cal.1965-03-08.vietnam]]. Names: Taylor, Fulbright, Johnson, Case, Stennis.'
    src:
      c: 84c0d46c
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d231: C-D'
        - 'w.gibbons-u-s-government-and III, 212–14: A-D'
        - 'via w.gibbons-u-s-government-and III, 212 n.189: A-B'
        - 'via w.gibbons-u-s-government-and III, 214 n.192: C-D'
        - 'w.mann-grand-delusion 422–24: A, C-H'
        - 'via w.mann-grand-delusion 423 n.19: E-H'
        - 'via w.mann-grand-delusion 424 n.20: C-D'
        - 'w.taylor-swords-and-plowshares 339: A'
