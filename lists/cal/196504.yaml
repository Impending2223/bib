  - id: cal.1965-04-03.vietnam
    when: Apr. 3–4
    date: '1965-04-03'
    time: 1965-04-03T03:00Z
    place: thanh-hoa
    thread: vietnam-air-war
    c: 'The Thanh Hóa bridge, rail and road, struck by Air Force F-105s, Apr. 3 and 4: the spans damaged, the bridge standing. Six aircraft lost over the two days, two F-105s to MiGs, the first engagement with them. Wheeler to McNamara, Apr. 6: the bridges at Thanh Hóa and Đồng Phương destroyed, "the most damaging military blow delivered to date."'
    n: 'FRUS 1964–68, II, docs. [220](https://history.state.gov/historicaldocuments/frus1964-68v02/d220) (Mar. 30, the decision), [241](https://history.state.gov/historicaldocuments/frus1964-68v02/d241) (Apr. 6), [250](https://history.state.gov/historicaldocuments/frus1964-68v02/d250) (Apr. 13). [[w.frankum-like-rolling-thunder]], 22–23 (the strikes of Apr. 3 and 4; the losses); [[w.staaveren-gradual-failure]], 105–09; [[w.staaveren-gradual-failure]], 106–07 (Apr. 3: seventy-nine aircraft, forty-six F-105s, sixteen with Bullpups and thirty with eight 750-pound bombs, twenty-one F-100s, two RF-101s, ten KC-135s; 254 bombs and 266 rockets, the spans not dropped; the next day 384 bombs and Bullpups, one span sagging); [[w.lich-su-khang-chien-chong-my]], III, 410–11 (Apr. 3, two flights of MiG-17s of the 921st Air Regiment, under Phạm Ngọc Lan and Trần Hanh, with the 234th Air Defense Regiment and the militia at Hàm Rồng); [[w.lich-su-khang-chien-chong-my]], IV, 386 (Hàm Rồng, Đò Lèn, Phà Ghép and Hoàng Mai bridges, Apr. 3–4: the history calls it a heavy American defeat); [[w.lich-su-khang-chien-chong-my]], III, 410–12 (the Air Defense–Air Force command''s decision, the night of Apr. 1, to use fighters at Hàm Rồng; Apr. 3, an F4 at the Đò Lèn bridge in the morning; 10 a.m., two MiG-17 flights of the 921st Regiment under Phạm Ngọc Lan and Trần Hanh down two F8s in a 20-minute sortie; 12:50 p.m., a second raid on the bridge, nearly two hours, a militia machine-gun crew under Phạm Gia Huấn downs one; eight in the day; Apr. 4, raids on the bridge at 8:30, 9:30 and 10:05 a.m., an F-105 down at once, two more to Trần Hanh''s flight in four minutes; the bridge stands). Check: the clock: the time is the first day''s, the history''s 10 a.m. for the first raid on the bridge (III, 410), taken as Hanoi''s. To check: Ofc Asst SECDEF (PA) News Release No 206–65, 4 Apr 65 (cited by [[w.staaveren-gradual-failure]], 106 n.15); Hq USAF rpt, Analysis of Air Operations, Southeast Asia, 26 Mar 65, Vol I, pp 4-14N to 4-14R (cited by [[w.staaveren-gradual-failure]], 108 n.17a); Project CHECO, Rolling Thunder, pp 31–35 (cited by [[w.staaveren-gradual-failure]], 108 n.17b); Asst SECDEF (PA), News Release 206–65, 4 Apr 65 (cited by [[w.staaveren-gradual-failure]], 108 n.17c); hist, 313th AD, Jul-Dec 65, p 187 (cited by [[w.staaveren-gradual-failure]], 108 n.17d); hist, 67th TFS, 1 Jan-30 Jun 65, chap IV (cited by [[w.staaveren-gradual-failure]], 108 n.17e); Lt Charles H. Heffron, Air to Air Encounters Over NVN (Proj CHECO, 1967), p 1 (cited by [[w.staaveren-gradual-failure]], 108 n.17f); memo, L. Unger, Dep Asst SECSTATE for Far Eastern Affairs and Chmn of VN Coordinating Cmte to George Ball, Acting SECSTATE, subj: Recent U.S. Mil Engagements in NVN and Vicinity (cited by [[w.staaveren-gradual-failure]], 108 n.17g); msg, Wheeler to Sharp, 061616Z Apr 65 (cited by [[w.staaveren-gradual-failure]], 108 n.17h); McConnell Notebook, Item 68, 3 Apr 65, and Item 93, 13 Apr 65 (cited by [[w.staaveren-gradual-failure]], 108 n.17i). See [[cal.1965-03-02.vietnam]]. Names: Wheeler, McNamara.'
