  - id: cal.1965-04-07.south-asia
    when: Apr. 7
    date: '1965-04-07'
    thread: south-asia
    also: [soviet-union, vietnam-diplomacy]
    c: 'Ayub Khan''s visit to the Soviet Union, as Bhutto tells Zhou on Apr. 20. Ayub asks that the Sino-Soviet differences be narrowed; the Soviet side: a matter between the parties, the treaty in force. If the United States attacked China, the Soviet side says, it would carry out the treaty. On Apr. 7, on the way to Tashkent, Polyansky reads them Johnson''s speech of that day and finds good parts in it.'
    n: '"[Minutes of Conversation between Premier Zhou and Bhutto](https://digitalarchive.umd.edu/document/165417)" (Apr. 20, 1965), PRC FMA 203-00653-01, 6–11, trans. Stephen Mercado, Wilson Center Digital Archive (Bhutto''s account: the Soviet side had thought to put the visit off for Brezhnev''s and Kosygin''s visit to Poland, Ayub refusing; the talks on SEATO and CENTO, the world situation, Soviet arms for India and Kashmir, and, the last day, the foreign ministers on the Soviet place at the Second Asian-African Conference; "on 7 April, they were on their way to Tashkent"). The record gives the visit no other day and no place for the reading. See [[cal.1965-04-02.china-leadership-2]]. Names: Ayub Khan, Polyansky, Johnson, Bhutto, Zhou Enlai. Check: the visit''s days. Check: the year the Archive posted the document.'
