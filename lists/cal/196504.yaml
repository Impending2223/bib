    time: 1965-04-14T15:35Z
    place: washington
    thread: south-asia
    also: [china]
    c: 'Johnson to Ayub Khan, by letter: his visit to Washington this month put off, perhaps to the fall. A visit now would fix public attention on the two countries'' differences over Communist China, with the aid bill at its most sensitive point in Congress and American casualties mounting in Vietnam. Apr. 15, McConaughy gives Ayub the letter at Rawalpindi: a postponement, not a cancellation; Ayub "slightly taken aback."'
    n: '[FRUS 1964–68, XXV, doc. 100](https://history.state.gov/historicaldocuments/frus1964-68v25/d100) (Rusk to McConaughy, the letter''s text); [doc. 103](https://history.state.gov/historicaldocuments/frus1964-68v25/d103) (McConaughy, Rawalpindi, Apr. 15). [[w.jian-maos-china-and-the]], 217 (the visit put off); [[w.zhai-china-and-the-vietnam]], 138 (the visit off, nine days before Ayub was to arrive; "canceled," Zhai writes); [[w.macfarquhar-origins-of-the-cultural]], III, 374 (Johnson puts off Ayub''s visit, planned for Apr. 25); [[w.jian-zhou-enlai]], 523 (Johnson abruptly postpones Ayub Khan''s visit; not the day). The time is the first day''s. To check: [[w.mcmahon-cold-war-on-the]] (cited by [[w.jian-maos-china-and-the]], 217 n.56, for the reasons); [[w.new-york-times]], Apr. 17, 1965 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.174a); [[w.gauhar-ayub-khan]], 302 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.174b); [[w.goodwin-remembering-america-1989]], 394–395 (cited by [[w.jian-zhou-enlai]], 523 n.18a); [[w.mcmahon-cold-war-on-the]], 318–324 (cited by [[w.jian-zhou-enlai]], 523 n.18b). Made public: FRUS 1964–68, XXV (2000). Names: Johnson, Ayub Khan, McConaughy.'
