  - id: cal.1965-04-05.desegregation-public-places-nv
    when: Apr. 5
    date: '1965-04-05'
    thread: desegregation-public-places
    also: [jobs-and-wages]
    c: 'Nevada. Sawyer approves A.B. 404, the civil rights act: no discrimination by race, color, religion or national origin in places of public accommodation or in employment, with a penalty, civil actions and injunctions; the State''s commission (NRS 233) given findings of fact and rule making.'
    n: '1965 Nev. Stat., ch. 332, [689–696](https://www.leg.state.nv.us/Statutes/53rd/Stats196504.html#Stats196504page689): "[Approved April 5, 1965]." Names: Sawyer.'
    tags: [state:nv, name:sawyer-grant]
  - id: cal.1965-04-06.vietnam
    when: Apr. 6
    date: '1965-04-06'
    thread: vietnam-force-levels
    c: 'NSAM 328, Bundy''s record of the President''s decisions of Apr. 1: two more Marine battalions and an air squadron; 18,000 to 20,000 more support troops; "a change of mission for all Marine Battalions ... to permit their more active use"; Rolling Thunder at its "slowly ascending tempo"; the moves to be understood as "gradual and wholly consistent with existing policy." Johnson to the press, Apr. 1: "I know of no far-reaching strategy that is being suggested or promulgated." McCone, by letter: hit the North harder, or face "an ever-increasing guerrilla war."'
    n: '[NSAM No. 328](https://history.state.gov/historicaldocuments/frus1964-68v02/d242) (Apr. 6, 1965) (Viet. II.I.2). The President''s News Conference, [1965 Pub. Papers 364](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=440) (Apr. 1, 1965). [FRUS 1964–68, II, doc. 230](https://history.state.gov/historicaldocuments/frus1964-68v02/d230) (McCone''s memorandum of the decisions of Apr. 1). FRUS 1964–68, II, docs. [229](https://history.state.gov/historicaldocuments/frus1964-68v02/d229), [231](https://history.state.gov/historicaldocuments/frus1964-68v02/d231), [234](https://history.state.gov/historicaldocuments/frus1964-68v02/d234), [238](https://history.state.gov/historicaldocuments/frus1964-68v02/d238). [[w.gibbons-u-s-government-and]], III, 199–203; [[w.cosmas-joint-chiefs-of-staff-2012]], 273 (the decisions of Apr. 1); [[w.staaveren-gradual-failure]], 102–03 (NSAM 328: the battalions, the support troops, the change of mission, the tempo; the decisions played down in public); [[w.marolda-united-states-navy-and]], 532 (the decisions of Apr. 1: two battalions, the change of mission; NSAM 328, Apr. 6). To check: [[w.pentagon-papers]]. See [[cal.1965-03-08.vietnam]]. Names: McGeorge Bundy, McCone, Johnson.'
