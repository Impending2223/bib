    c: 'Honolulu: McNamara, William Bundy, and McNaughton with Taylor, Wheeler, Sharp, and Westmoreland. None expects Hanoi to yield in less than six months; the bombing at about its present tempo, Hanoi and Haiphong spared; American forces from 33,500 to some 82,000, with 7,250 Korean and Australian. Apr. 21, McNamara''s report to Johnson; Ball, the same day, for a try at settlement before "a 150 percent increase" in troops.'
    n: '[[w.gibbons-u-s-government-and]], III, 230–33 (not the Korean and Australian figure); [[w.frankum-like-rolling-thunder]], 24–25 (the conference; six months at least; the bombing at its pace, Hanoi spared); [[w.drea-mcnamara-clifford-and-the-2011]], 30–31 (the conference and who attended; six months or more; the 82,000; the report; Ball''s dissent); [[w.cosmas-joint-chiefs-of-staff-2012]], 363 (the meeting; the bombing; the report); [[w.moyar-triumph-forsaken]], 370–71; [[w.westmoreland-soldier-reports]], 132 (the conference; 82,000 Americans, 7,250 others, seventeen battalions in all; no force yet for the highlands); [[w.mcnamara-in-retrospect]], ch. 7 at nn.21–22 (Pacific Command''s headquarters; all agree bombing alone not the answer; Wheeler, Sharp and Westmoreland renew the two divisions, McNamara with Taylor against; 33,000 to 82,000). [[w.ball-past-has-another-pattern]], 393–94 (Ball''s memorandum); [[w.drea-mcnamara-clifford-and-the-2011]], 59 (the bombing first on the agenda; more armed reconnaissance for Sharp, the daily sorties exceeded on good targets; the South first); [[w.taylor-swords-and-plowshares]], 342–43; [[w.dallek-flawed-giant]], 268 (the Honolulu conference of Apr. 20 agrees on two Army brigades, three more Marine battalions and logistical troops for two divisions, 82,000 by mid-June; McNamara reports it on the 21st; Ball alone excepts, and Johnson gives him until morning for "a settlement plan"; not who attended). [FRUS 1964–68, II, doc. 264](https://history.state.gov/historicaldocuments/frus1964-68v02/d264); [doc. 265](https://history.state.gov/historicaldocuments/frus1964-68v02/d265); [doc. 266](https://history.state.gov/historicaldocuments/frus1964-68v02/d266); [doc. 267](https://history.state.gov/historicaldocuments/frus1964-68v02/d267). See [[cal.1965-04-06.vietnam]]. Check: Gibbons, III, 231, has the forces then at 65,700. Names: McNamara, William Bundy, McNaughton, Taylor, Wheeler, Ball, Sharp, Westmoreland. Check: Ball has his memorandum written the night of Apr. 20, after a morning with Johnson and Rusk; FRUS''s copy is of Apr. 21.'
