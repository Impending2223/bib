    thread: latin-america-dominican-republic
    also: [press-and-broadcasting]
    c: 'Johnson, evening, with Mohr of the *New York Times*. Mohr: he "had made a journalistic mistake" in his first-day story on the Marine landing "in not giving more emphasis to the guarded report by Mann and Ball that some Communists had been identified among the rebels." Johnson disagrees: "hopeless to think that anyone would ever believe him," but he "had not landed Marines to put down a communist threat."'
    n: '[[w.dallek-flawed-giant]], 264 ("The next evening," after the statement of Apr. 28). To check: LBJ conversations, Apr. 29–May 5, 1965, Krock Papers (cited by [[w.dallek-flawed-giant]], 264 n.69). See [[cal.1965-04-28.latin-america]]. Names: Johnson, Mann, Ball. Check: the day (Dallek: "the next evening"; his note covers Apr. 29–May 5).'
    tags: [name:johnson-lyndon-b, name:mann-thomas-c, name:ball-george-w]
  - id: cal.1965-04-30.latin-america
    when: Apr. 30
    date: '1965-04-30'
    thread: latin-america-dominican-republic
    c: 'The OAS Council, through the night of Apr. 29–30, calls for a cease-fire and a neutral zone of refuge in Santo Domingo, 16–0, Chile, Mexico, Uruguay, and Venezuela abstaining. The papal nuncio arranges a cease-fire; the 82nd Airborne lands at San Isidro (Check); John Bartlow Martin sent as envoy. Johnson that evening: "people trained outside the Dominican Republic are seeking to gain control."'
    n: 'Statement by the President on the Situation in the Dominican Republic, [1965 Pub. Papers 465](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=541) (Apr. 30, 1965). [FRUS 1964–68, XXXII, doc. 42](https://history.state.gov/historicaldocuments/frus1964-68v32/d42); [doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v32/d43); [doc. 45](https://history.state.gov/historicaldocuments/frus1964-68v32/d45); [doc. 46](https://history.state.gov/historicaldocuments/frus1964-68v32/d46); [doc. 49](https://history.state.gov/historicaldocuments/frus1964-68v32/d49). [[w.rusk-as-i-saw-it-1990]], 372 (the 82nd Airborne); [[w.ball-past-has-another-pattern]], 329 (John Bartlow Martin, Kennedy''s ambassador, flown to Santo Domingo to work with Bennett and give the President an independent judgment; friendly with some rebels, he tries unsuccessfully to bring both sides together; Ball gives no day); [[w.dallek-flawed-giant]], 264 (the broadcast of the evening of the 30th: "people trained outside the Dominican Republic are seeking to gain control"; an OAS mission to arrange a cease-fire). See [[cal.1965-04-28.latin-america]]. Names: John Bartlow Martin, Johnson. Check: Rusk has Johnson order the 82nd Airborne Apr. 29, and the OAS meet first at 9 a.m. that day ([[w.rusk-as-i-saw-it-1990]], 371–72).'
