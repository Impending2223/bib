    c: Santo Domingo. Army officers and Bosch's Dominican Revolutionary Party rise against Reid Cabral's triumvirate, for Bosch's return; arms handed out to civilians. Apr. 25, Reid resigns; the rebels name Molina Ureña provisional president; Wessin's forces at San Isidro and the air force attack them. Apr. 27, Molina Ureña at the American embassy, Bennett telling him to seek terms; Caamaño at the rebels' head.
    n: '[FRUS 1964–68, XXXII, doc. 21](https://history.state.gov/historicaldocuments/frus1964-68v32/d21); [doc. 26](https://history.state.gov/historicaldocuments/frus1964-68v32/d26). The White House''s account of Apr. 24–28: Statement by the President Upon Ordering Troops Into the Dominican Republic, [1965 Pub. Papers 461](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=537) (Apr. 28, 1965), note. [[w.rusk-as-i-saw-it-1990]], 370–71 (the rising; Molina Ureña at the embassy); [[w.ball-past-has-another-pattern]], 327 (April 1965, a small group of young colonels captures the army chief of staff and launches a golpe; the national radio seized; Wessin''s counter-revolution; no day; not Bosch''s Dominican Revolutionary Party or Reid Cabral); [[w.dallek-flawed-giant]], 262–63 (the constitutionalist countercoup of Apr. 24; aimed at restoring constitutional rule and possibly Bosch; on the 27th the rebels ask Bennett to mediate and he refuses; not Reid''s resignation, Molina Ureña or Caamaño). Bibliography: [[cal.1965-04-28.latin-america]]. See [[cal.1963-09-25.latin-america]]. Names: Bosch, Reid Cabral, Wessin y Wessin, Caamaño-Deno, Molina Ureña, Bennett. Check: Rusk has Molina Ureña ask Bennett to negotiate a settlement, Bennett refusing to mediate ([[w.rusk-as-i-saw-it-1990]], 371).'
