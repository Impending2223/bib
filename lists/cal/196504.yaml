    c: 'Liu Shaoqi receives nine Chinese trade and press workers, Wang Yaoting, Hou Fazeng, Wang Weizhen, Ma Yaozeng, Wang Zhi, Su Ziping, Ju Qingdong, Song Guibao and Zhang Baosheng, and their families, the men illegally jailed by the Brazilian authorities for over a year and lately home. He says the ordeal was good; they can fight better hereafter. A test has several sides: pressure from others, when one must not bow to power, which they have borne; wealth, which must not corrupt, a great danger for those sent abroad; and poverty, which must not move one. Some who go abroad run off, but running has no way out. Many comrades abroad over the years, specialists and engineers above all, have been tempered by working with others, and welcomed; some have died abroad and are to be buried there, not brought back, a sacrifice for their cause, and the people there will honor them.'
