  - id: cal.1965-04-01.vietnam-2
    when: Apr. 1
    date: '1965-04-01'
    thread: vietnam-diplomacy
    c: 'Cooper to Bundy: a "Southeast Asia Development Association," open to Communist, neutralist and non-Communist nations alike, to end the war peacefully and keep American influence through economic rehabilitation.'
    n: '[[w.preston-war-council]], 194. To check: Cooper to Bundy, Apr. 1, 1965, NSF, Files of McGeorge Bundy, Chron., box 7, LBJ Library (cited by [[w.preston-war-council]], 194 n.10). Names: Chester Cooper, Bundy.'
