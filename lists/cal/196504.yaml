entries:
  - id: cal.1965-04-01.desegregation-schools-ma
    when: Apr. 1
    date: '1965-04-01'
    thread: desegregation-schools
    also: [states-and-cities]
    c: 'Massachusetts. The final report of the advisory committee on racial imbalance named by Kiernan, Commissioner of Education, *Because It Is Right—Educationally*: more than half the Negro pupils in Boston''s schools in schools at least 80 percent Negro; the imbalance from housing segregation.'
    n: '[*Because It Is Right—Educationally: Report of the Advisory Committee on Racial Imbalance and Education*](https://archive.org/details/becauseitisright00mass) (Apr. 1965). [Wikipedia, "Boston desegregation busing crisis"](https://en.wikipedia.org/wiki/Boston_desegregation_busing_crisis). To check: [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]; [[w.delmont-why-busing-failed]]. See [[cal.1964-02-26.desegregation-schools-boston]]. Names: Kiernan.'
    tags: [state:ma, city:boston, name:kiernan-owen-b]
  - id: cal.1965-04-02.opinion
    when: Apr. 2
    date: '1965-04-02'
    thread: opinion
    also: [foreign-aid]
    c: 'Gallup, Feb. 19–24: foreign aid in general: for 57 percent, against 33. Johnson''s $3.4 billion for aid: decreased 49, kept the same 33, increased 6.'
    n: '[[w.gallup-poll]], III, 1932. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-04-02.japan-and-korea
    when: Apr. 2
    date: '1965-04-02'
    thread: japan
    also: [economy]
    c: 'Executive Order 11211: new issues of Japan''s government exempt from the interest equalization tax, up to $100 million a year.'
    n: '[Executive Order 11211](https://www.presidency.ucsb.edu/documents/executive-order-11211-exclusion-for-original-or-new-japanese-issues-required-for) (Apr. 2, 1965). See [[cal.1963-08-01.japan-and-korea]]; [[cal.1964-09-02.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-04-02.vietnam
    when: Apr. 2
    date: '1965-04-02'
    thread: vietnam
    c: 'Taylor before Foreign Relations and Armed Services in executive session, then the House committee; guarded on troops. To the NSC: Fulbright worried of three or four divisions, and whether the resolution covers them. Johnson: no new resolution needed to send troops.'
    n: 'FRUS 1964–68, II, docs. [231](https://history.state.gov/historicaldocuments/frus1964-68v02/d231), [235](https://history.state.gov/historicaldocuments/frus1964-68v02/d235) (William Bundy to the congressional liaison, Apr. 3). [[w.gibbons-u-s-government-and]], III, 212–215. See [[cal.1965-03-08.vietnam]]. Names: Taylor, Fulbright, Johnson.'
    tags: [name:taylor-maxwell, name:fulbright-j-william, name:johnson-lyndon-b, name:bundy-william]
  - id: cal.1965-04-03.laos
    when: Apr. 3
    date: '1965-04-03'
    thread: laos
    also: [vietnam]
    c: 'Steel Tiger begins: American air operations against the infiltration routes of the Laotian panhandle, apart from Barrel Roll in the north and heavier. The division not told the Lao; Souvanna consulted on the intensification.'
    n: 'FRUS 1964–68, XXVIII, docs. [174](https://history.state.gov/historicaldocuments/frus1964-68v28/d174) (Mar. 20), [175](https://history.state.gov/historicaldocuments/frus1964-68v28/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v28/d176) (Mar. 25). [[w.frankum-like-rolling-thunder]], 117–118; [[w.cosmas-joint-chiefs-of-staff-2012]], 351; [[w.marolda-united-states-navy-and]], 512; [[w.staaveren-u-s-air-force]], 55–57; [[w.anthony-war-in-northern-laos]], 164. See [[cal.1964-12-10.laos]]. Names: Souvanna Phouma.'
    tags: [name:souvanna-phouma]
  - id: cal.1965-04-03.vietnam
    when: Apr. 3–4
    date: '1965-04-03'
    thread: vietnam
    c: 'The Thanh Hóa bridge, rail and road, struck by Air Force F-105s, Apr. 3 and 4: the spans damaged, the bridge standing. Six aircraft lost over the two days, two F-105s to MiGs, the first engagement with them. Wheeler to McNamara, Apr. 6: the bridges at Thanh Hóa and Đồng Phương destroyed, "the most damaging military blow delivered to date."'
    n: 'FRUS 1964–68, II, docs. [220](https://history.state.gov/historicaldocuments/frus1964-68v02/d220) (Mar. 30, the decision), [241](https://history.state.gov/historicaldocuments/frus1964-68v02/d241) (Apr. 6), [250](https://history.state.gov/historicaldocuments/frus1964-68v02/d250) (Apr. 13). [[w.frankum-like-rolling-thunder]], 22–23; [[w.staaveren-gradual-failure]], 105–107. See [[cal.1965-03-02.vietnam]]. Names: Wheeler, McNamara.'
    tags: [name:wheeler-earle, name:mcnamara-robert-s, place:thanh-hoa]
  - id: cal.1965-04-05.desegregation-public-places-nv
    when: Apr. 5
    date: '1965-04-05'
    thread: desegregation-public-places
    also: [jobs-and-wages]
    c: 'Nevada. Sawyer approves A.B. 404, the civil rights act: no discrimination by race, color, religion or national origin in places of public accommodation or in employment, with a penalty, civil actions and injunctions; the State''s commission (NRS 233) given findings of fact and rule making.'
    n: '1965 Nev. Stat., ch. 332, [689–696](https://www.leg.state.nv.us/Statutes/53rd/Stats196504.html#Stats196504page689): "[Approved April 5, 1965]." Names: Sawyer.'
    tags: [state:nv, name:sawyer-grant]
  - id: cal.1965-04-06.vietnam
    when: Apr. 6
    date: '1965-04-06'
    thread: vietnam-force-levels
    c: 'NSAM 328, Bundy''s record of the President''s decisions of Apr. 1: two more Marine battalions and an air squadron; 18,000 to 20,000 more support troops; "a change of mission for all Marine Battalions ... to permit their more active use"; Rolling Thunder at its "slowly ascending tempo"; the moves to be understood as "gradual and wholly consistent with existing policy." Johnson to the press, Apr. 1: "I know of no far-reaching strategy that is being suggested or promulgated." McCone, by letter: hit the North harder, or face "an ever-increasing guerrilla war."'
    n: '[NSAM No. 328](https://history.state.gov/historicaldocuments/frus1964-68v02/d242) (Apr. 6, 1965) (Viet. II.I.2). The President''s News Conference, [1965 Pub. Papers 364](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=440) (Apr. 1, 1965). FRUS 1964–68, II, docs. [229](https://history.state.gov/historicaldocuments/frus1964-68v02/d229), [231](https://history.state.gov/historicaldocuments/frus1964-68v02/d231), [234](https://history.state.gov/historicaldocuments/frus1964-68v02/d234), [238](https://history.state.gov/historicaldocuments/frus1964-68v02/d238). [[w.gibbons-u-s-government-and]], III, 199–203; [[w.cosmas-joint-chiefs-of-staff-2012]], 273; [[w.staaveren-gradual-failure]], 102; [[w.marolda-united-states-navy-and]], 532. To check: [[w.pentagon-papers]]. See [[cal.1965-03-08.vietnam]]. Names: McGeorge Bundy, McCone, Johnson.'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge, name:mccone-john-a]
  - id: cal.1965-04-06.mayors-los-angeles
    when: Apr. 6
    date: '1965-04-06'
    thread: mayors
    also: [elections-1965]
    c: Los Angeles. Yorty re-elected mayor in the primary, 392,775 of 677,969, 57.9 percent; James Roosevelt, who left the House for the race, 247,313, 36.5; McGee 4.8; five others.
    n: 'Votes: [Wikipedia, "1965 Los Angeles mayoral election"](https://en.wikipedia.org/wiki/1965_Los_Angeles_mayoral_election), from Our Campaigns; Check: the City Clerk''s canvass. To check: [[w.bollens-yorty]]. See [[cal.1961-04-04.mayors-los-angeles]]. Names: Yorty, Roosevelt, McGee.'
    tags: [state:ca, city:los-angeles, name:yorty-sam, name:roosevelt-james, name:mcgee-patrick-d]
  - id: cal.1965-04-06.mayors-st-louis
    when: Apr. 6
    date: '1965-04-06'
    thread: mayors
    also: [elections-1965]
    c: St. Louis elects Cervantes (D) mayor over Zumwalt (R), 102,961 to 47,510.
    n: 'Votes: [Wikipedia, "Alfonso J. Cervantes"](https://en.wikipedia.org/wiki/Alfonso_J._Cervantes) (Check: the Board of Election Commissioners). See [[cal.1965-03-09.mayors-st-louis]]. Names: Cervantes, Zumwalt.'
    tags: [state:mo, city:st-louis, name:cervantes-alfonso-j, name:zumwalt-maurice-r]
  - id: cal.1965-04-07.vietnam
    when: Apr. 7
    date: '1965-04-07'
    thread: vietnam
    c: 'Johnson at Johns Hopkins, Baltimore, on television: "Peace Without Conquest." "We will not be defeated. We will not grow tired"; ready "for unconditional discussions"; a billion dollars for the development of Southeast Asia, the Mekong to "dwarf even our own TVA," Eugene Black to lead. Apr. 8, Phạm Văn Đồng''s four points: American troops and bases out; no foreign alliances, as at Geneva; the South''s affairs settled by its people on the Front''s program; reunification without foreign interference.'
    n: 'Address at Johns Hopkins University: "Peace Without Conquest", [1965 Pub. Papers 394](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=470) (Apr. 7, 1965). [FRUS 1964–68, II, doc. 245](https://history.state.gov/historicaldocuments/frus1964-68v02/d245). Recording (K–J Adm. II.I). [[w.gibbons-u-s-government-and]], III, 217–220; [[w.staaveren-gradual-failure]], 103. To check: [[w.logevall-choosing-war]]; [[w.thies-when-governments-collide]]; [[w.search-for-peace-in]]; [[w.herring-lbj-and-vietnam]]; [[w.gardner-pay-any-price]]; [[w.johnson-vantage-point]]. See [[cal.1965-03-02.vietnam]]. Names: Johnson, Black, Phạm Văn Đồng.'
    tags: [name:johnson-lyndon-b, name:black-eugene-r, name:pham-van-dong]
  - id: cal.1965-04-07.opinion
    when: Apr. 7
    date: '1965-04-07'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 11–16: start peace negotiations with the Communist leaders now, 41 percent; send more troops and airplanes to strengthen our position, 42; no opinion 17.'
    n: '[[w.gallup-poll]], III, 1932–33.'
  - id: cal.1965-04-07.middle-east
    when: Apr. 7–8
    date: '1965-04-07'
    thread: middle-east
    c: 'CENTO''s thirteenth Ministerial Council at Tehran, Rusk for the United States. Rusk with the Shah, Apr. 7: the reforms, Vietnam, Iran''s military program.'
    n: '[FRUS 1964–68, XXI, doc. 7](https://history.state.gov/historicaldocuments/frus1964-68v21/d7) (editorial note: the council). [FRUS 1964–68, XXII, doc. 72](https://history.state.gov/historicaldocuments/frus1964-68v22/d72). See [[cal.1960-04-28.middle-east]]. Names: Rusk, Pahlavi.'
    tags: [name:rusk-dean, name:pahlavi-mohammed-reza]
  - id: cal.1965-04-08.medicare
    when: Apr. 8
    date: '1965-04-08'
    thread: medicare
    also: [welfare]
    c: House passes the Medicare bill, H.R. 6675, [313–115](https://voteview.com/rollcall/RH0890035). Byrnes's motion to recommit, to put his voluntary plan in its place, lost, [191–236](https://voteview.com/rollcall/RH0890034).
    n: '[111 Cong. Rec., House, Apr. 8, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-2-1.pdf). See [[cal.1965-03-23.medicare]]. Names: Byrnes.'
    tags: [name:byrnes-john-w]
  - id: cal.1965-04-08.european-community
    when: Apr. 8
    date: '1965-04-08'
    thread: european-community
    c: 'Brussels. The Six sign the Merger Treaty: one Council and one Commission for the Coal and Steel Community, the EEC and Euratom.'
    n: '[Treaty establishing a Single Council and a Single Commission of the European Communities](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:11965F/TXT), O.J. 152, July 13, 1967. To check: [[w.dinan-europe-recast]]. See [[cal.1965-03-18.european-community]].'
  - id: cal.1965-04-09.school-aid
    when: Apr. 9
    date: '1965-04-09'
    thread: school-aid
    c: Senate passes the education bill as the House sent it, [73–18](https://voteview.com/rollcall/RS0890048), so no conference. Morse, managing, holds off every amendment, eleven on roll calls; among them one for taxpayers' suits to test aid to church schools, [32–53](https://voteview.com/rollcall/RS0890041).
    n: '[111 Cong. Rec., Senate, Apr. 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-3-1.pdf). Remarks Following Enactment of the Elementary and Secondary Education Bill, [1965 Pub. Papers 407](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=483) (Apr. 9, 1965). See [[cal.1965-03-26.school-aid]]. Names: Morse.'
    tags: [name:morse-wayne, name:johnson-lyndon-b]
  - id: cal.1965-04-09.voting-rights
    when: Apr. 9
    date: '1965-04-09'
    thread: voting-rights
    c: Judiciary reports the voting bill on the Senate's deadline, amended, without recommendation. In committee Edward Kennedy's ban on poll taxes in State elections carried, 9–4, and Dirksen's exemption for States with 60 percent registered; reported 12–4 (Check the votes). Debate opens after the Easter recess, Apr. 22 (Check).
    n: 'S. Rep. No. 89-162 (1965). [111 Cong. Rec., Senate, Apr. 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-3-1.pdf). Statement by the President on the Eve of Senate Consideration of the Voting Rights Bill, [1965 Pub. Papers 439](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=515) (Apr. 20, 1965). To check: [[w.may-bending-toward-justice]]; [[w.lawson-black-ballots]]. See [[cal.1965-03-17.voting-rights]]. Names: Edward Kennedy, Dirksen.'
    tags: [name:kennedy-edward-m, name:dirksen-everett, name:eastland-james-o]
  - id: cal.1965-04-09.legislatures-va
    when: Apr. 9
    date: '1965-04-09'
    thread: legislatures
    c: '*Mann v. Davis*: Virginia''s reapportionment of 1964 upheld against Henrico County, which asked delegates of its own apart from Richmond, and against Richmond''s petitioners; Shenandoah County, under-represented, to be relieved before the July primaries.'
    n: '*Mann v. Davis*, [245 F. Supp. 241](https://static.case.law/f-supp/245/case-pdfs/0241-01.pdf) (E.D. Va. 1965). To check: [[w.moeser-politics-of-annexation]]. See [[cal.1964-09-18.legislatures-va]].'
    tags: [state:va, city:richmond]
  - id: cal.1965-04-10.middle-east
    when: Apr. 10
    date: '1965-04-10'
    thread: middle-east
    c: Tehran. A conscript of the Imperial Guard shoots his way into the Marble Palace; two guards and the assailant killed; the Shah unhurt.
    n: '[FRUS 1964–68, XXII, doc. 76](https://history.state.gov/historicaldocuments/frus1964-68v22/d76). See [[cal.1965-04-07.middle-east]]. Names: Pahlavi.'
    tags: [name:pahlavi-mohammed-reza]
  - id: cal.1965-04-11.school-aid
    when: Apr. 11
    date: '1965-04-11'
    thread: school-aid
    c: Elementary and Secondary Education Act signed, [79 Stat. 27](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg27.pdf), outside the old Junction school near Johnson City, Tex., his first, Kate Deadrich Loney, his first teacher, beside him. Title I, aid to districts by their count of children of low-income families, for the educationally deprived, private-school pupils included; Title II, library books and textbooks for children in public and private schools; Title III, supplementary centers.
    n: 'Statute (K–J Cong. II.J.2). Remarks in Johnson City, Tex., Upon Signing the Elementary and Secondary Education Bill, [1965 Pub. Papers 412](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=488) (Apr. 11, 1965). [President''s Daily Diary, Apr. 11, 1965](https://catalog.archives.gov/id/192455), image 3 (LBJ Library; National Archives Catalog). To check: [[w.eidenberg-act-of-congress]]; [[w.bailey-esea]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.graham-uncertain-triumph]]. See [[cal.1965-04-09.school-aid]]. Names: Johnson, Loney.'
    tags: [name:johnson-lyndon-b, name:loney-kate-deadrich, bill:education-1965]
  - id: cal.1965-04-11.opinion
    when: Apr. 11
    date: '1965-04-11'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, Mar. 18–23: the Johnson Administration pushing integration too fast, 34 percent; not fast enough, 17; about right, 38. Southern whites 67 too fast; whites outside the South 28. Clergymen of one''s own church in civil rights protest marches: approve 32, disapprove 56; Protestants 29 approve, Catholics 40.'
    n: '[[w.gallup-poll]], III, 1933. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-04-12.vietnam
    when: Apr. 12
    date: '1965-04-12'
    thread: vietnam
    c: 'Johnson answers Mansfield''s letter of Mar. 24 and memorandum of Mar. 18: "more agreement than difference between us."'
    n: '[FRUS 1964–68, II, doc. 248](https://history.state.gov/historicaldocuments/frus1964-68v02/d248). [[w.gibbons-u-s-government-and]], III, 208. See [[cal.1965-03-24.vietnam]]. Names: Johnson, Mansfield.'
    tags: [name:johnson-lyndon-b, name:mansfield-mike]
  - id: cal.1965-04-13.succession
    when: Apr. 13
    date: '1965-04-13'
    thread: succession
    also: [amendments]
    c: House passes H.J. Res. 1, the amendment on presidential inability and a vacancy in the Vice Presidency, [368–29](https://voteview.com/rollcall/RH0890037), and puts its text into the Senate's S.J. Res. 1. To conference.
    n: '[111 Cong. Rec., House, Apr. 13, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-5-2.pdf). See [[cal.1965-02-19.succession]].'
  - id: cal.1965-04-14.opinion
    when: Apr. 14
    date: '1965-04-14'
    thread: opinion
    also: [voting-rights]
    c: 'Gallup, Mar. 18–23: a law to send federal officials to register voters where turnout was low: favor 76 percent, oppose 16. Southern whites 49 favor, 37 oppose. Republicans 72 favor; Democrats 80; independents 70.'
    n: '[[w.gallup-poll]], III, 1933–34.'
  - id: cal.1965-04-14.legislatures-ny
    when: Apr. 14
    date: '1965-04-14'
    thread: legislatures
    also: [court]
    c: 'The New York Court of Appeals voids the plans of December: the State constitution fixes the Assembly at 150, and the Senate''s rise to 65 was not warranted. May 10, the three-judge federal court, 2–1: the November election to go on under the December plan all the same, its winners to serve one year, and a new plan due Feb. 1, 1966. Oct. 11, the Supreme Court dismisses the appeals.'
    n: '*Matter of Orans*, [15 N.Y.2d 339](https://static.case.law/ny-2d/15/case-pdfs/0339-01.pdf) (1965). [*New York Times*, Apr. 15, 1965](https://www.nytimes.com/1965/04/15/archives/gop-plan-voided-constitution-is-cited-as-requiring-150-seats-in.html); [May 11](https://www.nytimes.com/1965/05/11/archives/decision-is-2-to-1-order-applies-only-to-1965-winners-to-serve-one.html); [Oct. 12](https://www.nytimes.com/1965/10/12/archives/supreme-court-clears-election-for-legislature-dismisses-appeals-to.html). See [[cal.1964-12-15.legislatures-ny]].'
    tags: [state:ny]
  - id: cal.1965-04-16.opinion
    when: Apr. 16
    date: '1965-04-16'
    thread: opinion
    c: 'Gallup, Mar. 18–23: the most important problem: civil rights 52 percent; foreign affairs 39; immorality, crime, delinquency 4; cost of living 3; unemployment 2.'
    n: '[[w.gallup-poll]], III, 1934.'
  - id: cal.1965-04-17.students
    when: Apr. 17
    date: '1965-04-17'
    thread: students
    also: [vietnam]
    c: 'Washington. SDS''s march against the war, with Women Strike for Peace: some 15,000 to 25,000 picket the White House, hear speeches at the Washington Monument, and walk to the Capitol. Potter, SDS''s president: "We must name that system." Check the count.'
    n: '[[w.gibbons-u-s-government-and]], III, 221–222. To check: [[w.sale-sds]]; [[w.miller-democracy-is-in-the]]; [[w.gitlin-sixties]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. See [[cal.1965-03-24.students]]. Names: Potter.'
    tags: [name:potter-paul]
  - id: cal.1965-04-19.cities-and-housing-nyc
    when: Apr. 19
    date: '1965-04-19'
    thread: cities-and-housing
    c: 'New York''s Landmarks Law, signed by Wagner (Check the day): the Landmarks Preservation Commission, his creation of 1962, may designate landmarks and historic districts, and none may be altered or pulled down without its leave. Brooklyn Heights the first district, Nov. 1965.'
    n: '[Wikipedia, "New York City Landmarks Preservation Commission"](https://en.wikipedia.org/wiki/New_York_City_Landmarks_Preservation_Commission). Check: Local Law No. 46 of 1965. See [[cal.1963-10-28.cities-and-housing-nyc]]. Names: Wagner.'
    tags: [state:ny, city:nyc, name:wagner-robert-f-jr]
  - id: cal.1965-04-20.vietnam
    when: Apr. 20
    date: '1965-04-20'
    thread: vietnam-force-levels
    c: 'Honolulu: McNamara, William Bundy, and McNaughton with Taylor, Wheeler, Sharp, and Westmoreland. None expects Hanoi to yield in less than six months; the bombing at about its present tempo, Hanoi and Haiphong spared; American forces from 33,500 to some 82,000, with 7,250 Korean and Australian. Apr. 21, McNamara''s report to Johnson; Ball, the same day, for a try at settlement before "a 150 percent increase" in troops.'
    n: 'FRUS 1964–68, II, docs. [264](https://history.state.gov/historicaldocuments/frus1964-68v02/d264), [265](https://history.state.gov/historicaldocuments/frus1964-68v02/d265), [266](https://history.state.gov/historicaldocuments/frus1964-68v02/d266), [267](https://history.state.gov/historicaldocuments/frus1964-68v02/d267). [[w.gibbons-u-s-government-and]], III, 230–232; [[w.frankum-like-rolling-thunder]], 24–25; [[w.drea-mcnamara-clifford-and-the-2011]], 30–31; [[w.cosmas-joint-chiefs-of-staff-2012]], 298, 363. To check: [[w.ball-past-has-another-pattern]]. See [[cal.1965-04-06.vietnam]]. Names: McNamara, William Bundy, McNaughton, Taylor, Wheeler, Ball, Sharp, Westmoreland.'
    tags: [name:mcnamara-robert-s, name:bundy-william, name:mcnaughton-john-t, name:taylor-maxwell, name:wheeler-earle, name:sharp-u-s-grant, name:westmoreland-william, name:ball-george-w, name:johnson-lyndon-b]
  - id: cal.1965-04-22.south-carolina-sc
    when: Apr. 22
    date: '1965-04-22'
    thread: south-carolina
    also: [governors]
    c: Johnston having died Apr. 18, Governor Russell resigns; McNair, the lieutenant governor, sworn as governor, appoints him to the Senate.
    n: '[Cong. Rec., Senate, Apr. 23, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-11-1.pdf). [*Time*, Apr. 30, 1965, "South Carolina''s New Senator"](https://web.archive.org/web/20121022165945/http://www.time.com/time/magazine/article/0,9171,898654-1,00.html). To check: [[w.edgar-south-carolina]]; [[w.kalk-origins-of-the-southern]]. See [[cal.1962-06-12.south-carolina-sc]]. Names: Johnston, Russell, McNair.'
    tags: [name:johnston-olin-d, name:russell-donald-s, name:mcnair-robert-e, state:sc]
  - id: cal.1965-04-22.king-boston
    when: Apr. 22–23
    date: '1965-04-22'
    thread: king
    also: [desegregation-schools]
    c: King in Boston. Meets Volpe and addresses the General Court in joint session, Apr. 22; leads a march from Roxbury to Boston Common, Apr. 23. Carter's vigil before the School Committee's offices begins Apr. 28.
    n: '[Wikipedia, "1965–1966 Massachusetts legislature"](https://en.wikipedia.org/wiki/1965%E2%80%931966_Massachusetts_legislature). Check the march and its numbers against the *Boston Globe*, Apr. 24, 1965. To check: [[w.formisano-boston-against-busing]]; [[w.sugrue-sweet-land-of-liberty]]. See [[cal.1965-04-01.desegregation-schools-ma]]. Names: King, Volpe, Carter.'
    tags: [state:ma, city:boston, name:king-martin-luther-jr, name:volpe-john-a, name:carter-vernon-e]
  - id: cal.1965-04-23.opinion
    when: Apr. 23
    date: '1965-04-23'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 2–7: what to do next in Vietnam: withdraw completely 17 percent; negotiate, stop fighting 12; continue present policy 14; step up military activity 12; go all out, declare war 19; no opinion 28. Handling Vietnam as well as could be expected, 55; badly, 26.'
    n: '[[w.gallup-poll]], III, 1934–35.'
  - id: cal.1965-04-23.students-nj
    when: Apr. 23
    date: '1965-04-23'
    thread: students
    also: [vietnam]
    c: 'Teach-in at Rutgers, New Brunswick, N.J. Genovese, of its history department: "I do not fear or regret the impending Viet Cong victory in Vietnam. I welcome it." Dumont, Republican candidate for governor, calls for his dismissal; the university will not act (Check the dates).'
    n: '[Wikipedia, "Eugene Genovese"](https://en.wikipedia.org/wiki/Eugene_Genovese); check the words against the *New York Times* and the Newark *Star-Ledger*, Apr. 24, 1965. To check: [[w.menashe-teach-ins]]; [[w.wells-war-within]]; [[w.salmore-new-jersey-politics-and]]. See [[cal.1965-03-24.students]]. Names: Genovese, Dumont.'
    tags: [state:nj, name:genovese-eugene-d, name:dumont-wayne-jr]
  - id: cal.1965-04-24.latin-america
    when: Apr. 24
    date: '1965-04-24'
    thread: latin-america-dominican-republic
    c: Santo Domingo. Army officers and Bosch's Dominican Revolutionary Party rise against Reid Cabral's triumvirate, for Bosch's return; arms handed out to civilians. Apr. 25, Reid resigns; the rebels name Molina Ureña provisional president; Wessin's forces at San Isidro and the air force attack them. Apr. 27, Molina Ureña at the American embassy, Bennett telling him to seek terms; Caamaño at the rebels' head.
    n: 'FRUS 1964–68, XXXII, docs. [21](https://history.state.gov/historicaldocuments/frus1964-68v32/d21), [26](https://history.state.gov/historicaldocuments/frus1964-68v32/d26). The White House''s account of Apr. 24–28: Statement by the President Upon Ordering Troops Into the Dominican Republic, [1965 Pub. Papers 461](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=537) (Apr. 28, 1965), note. Bibliography: [[cal.1965-04-28.latin-america]]. See [[cal.1963-09-25.latin-america]]. Names: Bosch, Reid Cabral, Wessin y Wessin, Caamaño-Deno, Molina Ureña, Bennett.'
    tags: [name:bosch-juan, name:reid-cabral-donald, name:molina-urena-jose-rafael, name:wessin-y-wessin-elias, name:bennett-w-tapley-jr, name:caamano-deno-francisco]
  - id: cal.1965-04-26.court
    when: Apr. 26
    date: '1965-04-26'
    thread: court
    c: '*Dombrowski v. Pfister*, [380 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380479/usrep380479.pdf): a federal court may enjoin prosecutions under Louisiana''s subversive-activities laws, overbroad and, as alleged, brought to harass the Southern Conference Educational Fund for its civil rights work. Brennan for the Court, 5–2.'
    n: 'To check: [[w.powe-warren-court-and-american]]. See [[cal.1965-03-08.court]]; [[cal.1964-02-20.court]].'
  - id: cal.1965-04-27.voting-rights
    when: Apr. 27
    date: '1965-04-27'
    thread: voting-rights
    also: [court]
    c: '*Harman v. Forssenius*, [380 U.S. 528](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380528/usrep380528.pdf): Virginia''s certificate of residence, to be filed six months before the election by voters for federal office who will not pay the poll tax, struck down under the Twenty-fourth Amendment. Warren for the Court.'
    n: 'To check: [[w.powe-warren-court-and-american]]. See [[cal.1964-01-23.voting-rights]].'
  - id: cal.1965-04-27.state-and-city-finance-ok
    when: Apr. 27
    date: '1965-04-27'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: Oklahoma, special election; three questions refused. A third cent of sales tax, 171,123 to 293,278. $56.75 million in debt for State buildings, 199,512 to 261,229. $60 million in highway notes on the motor fuel tax, 213,953 to 247,256.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 51–52](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=51). To check: [[w.bellmon-life-and-times-of]]; [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1962-05-01.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1965-04-28.latin-america
    when: Apr. 28
    date: '1965-04-28'
    thread: latin-america-dominican-republic
    c: 'Santo Domingo. The junta''s officers tell the embassy they can no longer protect Americans; Bennett asks for Marines. Johnson, after meeting congressional leaders, tells the country at 8:40 p.m.: troops ordered ashore "to give protection to hundreds of Americans," 400 Marines already landed. Bennett, that night: think of "armed intervention which would go beyond the mere protection of Americans."'
    n: 'Statement by the President Upon Ordering Troops Into the Dominican Republic, [1965 Pub. Papers 461](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=537) (Apr. 28, 1965). FRUS 1964–68, XXXII, docs. [28](https://history.state.gov/historicaldocuments/frus1964-68v32/d28), [29](https://history.state.gov/historicaldocuments/frus1964-68v32/d29), [34](https://history.state.gov/historicaldocuments/frus1964-68v32/d34), [35](https://history.state.gov/historicaldocuments/frus1964-68v32/d35), [36](https://history.state.gov/historicaldocuments/frus1964-68v32/d36), [38](https://history.state.gov/historicaldocuments/frus1964-68v32/d38). [[w.drea-mcnamara-clifford-and-the-2011]], 291–296; [[w.poole-joint-chiefs-of-staff-2012]], 137–141. To check: [[w.lowenthal-dominican-intervention]]; [[w.gleijeses-dominican-crisis]]; [[w.mcpherson-yankee-no]]; [[w.rabe-killing-zone]]; [[w.martin-overtaken-by-events]]; [[w.johnson-vantage-point]]; [[w.reaching-for-glory]]. See [[cal.1965-04-24.latin-america]]. Names: Bennett, Johnson.'
    tags: [name:johnson-lyndon-b, name:bennett-w-tapley-jr]
  - id: cal.1965-04-28.transition-and-staff
    when: Apr. 28
    date: '1965-04-28'
    thread: transition-and-staff
    c: McCone out at the CIA. Raborn, a retired vice admiral who had run the Polaris program, sworn as Director of Central Intelligence, Helms, head of the clandestine service, as Deputy Director. The Senate confirmed Raborn Apr. 22.
    n: 'Remarks at the Swearing In of Admiral Raborn and Richard Helms as Director and Deputy Director, CIA, [1965 Pub. Papers 457](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=533) (Apr. 28, 1965). [111 Cong. Rec., Senate, Apr. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-10-2.pdf). To check: [[w.powers-man-who-kept-the]]. See [[cal.1965-03-18.transition-and-staff]]. Names: McCone, Raborn, Helms.'
    tags: [name:johnson-lyndon-b, name:mccone-john-a, name:raborn-william-f-jr, name:helms-richard]
  - id: cal.1965-04-29.africa
    when: Apr. 29
    date: '1965-04-29'
    thread: africa
    c: 'Habib Bourguiba Jr., Foreign Minister of Tunisia, with Johnson, bringing his father''s letter: Tunisia''s next development plan; help with equipment for its army. Johnson: Congress has nearly cut out military aid; he will see what can be done.'
    n: 'FRUS 1964–68, XXIV, docs. [150](https://history.state.gov/historicaldocuments/frus1964-68v24/d150), [151](https://history.state.gov/historicaldocuments/frus1964-68v24/d151). To check: [[w.perkins-history-of-modern-tunisia]]. See [[cal.1961-05-03.africa]]. Names: Habib Bourguiba Jr..'
    tags: [name:bourguiba-habib-jr, name:johnson-lyndon-b]
  - id: cal.1965-04-30.latin-america
    when: Apr. 30
    date: '1965-04-30'
    thread: latin-america-dominican-republic
    c: 'The OAS Council, through the night of Apr. 29–30, calls for a cease-fire and a neutral zone of refuge in Santo Domingo, 16–0, Chile, Mexico, Uruguay, and Venezuela abstaining. The papal nuncio arranges a cease-fire; the 82nd Airborne lands at San Isidro (Check); John Bartlow Martin sent as envoy. Johnson that evening: "people trained outside the Dominican Republic are seeking to gain control."'
    n: 'Statement by the President on the Situation in the Dominican Republic, [1965 Pub. Papers 465](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=541) (Apr. 30, 1965). FRUS 1964–68, XXXII, docs. [42](https://history.state.gov/historicaldocuments/frus1964-68v32/d42), [43](https://history.state.gov/historicaldocuments/frus1964-68v32/d43), [45](https://history.state.gov/historicaldocuments/frus1964-68v32/d45), [46](https://history.state.gov/historicaldocuments/frus1964-68v32/d46), [49](https://history.state.gov/historicaldocuments/frus1964-68v32/d49). See [[cal.1965-04-28.latin-america]]. Names: John Bartlow Martin, Johnson.'
    tags: [name:johnson-lyndon-b, name:martin-john-bartlow]
