    c: 'Mao, Wuchang, hears He Long, Luo Ruiqing and Yang Chengwu on operational plans and on changing the army''s cap badges and collar tabs (Dong Biwu, Wang Renzhong present). The third front is all first line, deep country, to prepare against airborne landings: tunnels in hills, built-up hills on plains. Three lines of defense; no hasty deep entry as Chiang let Japan, or Stalin let Hitler; in the first stage hold where one must, in places let go, to draw the enemy in and destroy him; "you fight yours, I mine".'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 28 and 29, 1965. [[w.teiwes-tragedy-of-lin-biao]], 28 (the briefing of Mao on military work by Luo and He Long without Lin''s prior knowledge, which angers him, though he had allowed such briefings). Made public: 2013. To check: [[w.luo-diandian-feifan-de-niandai]], 189–190 (cited by [[w.teiwes-tragedy-of-lin-biao]], 28 n.48a); [[w.jiefangjun-jiangling-zhuan-14]], 354–355 (cited by [[w.teiwes-tragedy-of-lin-biao]], 28 n.48b). Names: Mao Zedong, He Long, Luo Ruiqing, Yang Chengwu, Dong Biwu, Wang Renzhong, Stalin.'
