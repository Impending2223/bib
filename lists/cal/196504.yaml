    c: Off Hainan, over the Gulf of Tonkin, American fighters on a diversionary flight engage Chinese MiGs; Chinese airspace probably entered (William Bundy, Apr. 13). By the Chinese records, two groups of American fighters over Hainan, Apr. 8 and 9; that afternoon Mao orders the air force and navy to send their best units south and strike intruders.
