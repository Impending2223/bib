  - id: cal.1965-04-02.vietnam
    when: Apr. 2
    date: '1965-04-02'
    thread: vietnam
    c: 'Taylor before Foreign Relations and Armed Services in executive session, then the House committee; guarded on troops. To the NSC: Fulbright worried of three or four divisions, and whether the resolution covers them. Johnson: no new resolution needed to send troops.'
    n: 'FRUS 1964–68, II, docs. [231](https://history.state.gov/historicaldocuments/frus1964-68v02/d231), [235](https://history.state.gov/historicaldocuments/frus1964-68v02/d235) (William Bundy to the congressional liaison, Apr. 3). [[w.gibbons-u-s-government-and]], III, 212–14. To check: the joint executive session''s transcript, Apr. 2, 1965, unpublished (cited by [[w.gibbons-u-s-government-and]], III, 212 n.189). See [[cal.1965-03-08.vietnam]]. Names: Taylor, Fulbright, Johnson.'
