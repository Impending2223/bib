  - id: cal.1965-04-01.vietnam-hanoi
    when: Apr. 1
    date: '1965-04-01'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Secretariat''s notice no. 56-TB/TW of the Politburo''s rules on leading the remaining socialist transformation of private capitalist industry and trade, handicrafts and small trade, after a report by the Central Board for the Transformation of Private Industry and Trade: the task still heavy, complex and long; the joint public-private firms already socialist in substance, the capitalists still to be re-educated.'
    n: '*Thông báo của Ban Bí thư số 56-TB/TW về những quy định của Bộ Chính trị về việc tổ chức lãnh đạo công tác tiếp tục cải tạo xã hội chủ nghĩa đối với công thương nghiệp tư bản tư doanh, thủ công nghiệp và thương nghiệp nhỏ*, signed for the chief of the office by Phạm Chung, deputy chief. [[w.van-kien-dang-toan]], XXVI, 111–17. Made public: 2003.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1965-04-01.china-leadership
    when: Apr. 1
    date: '1965-04-01'
    place:
      - algiers
      - cairo
    thread: china-leadership
    also: [middle-east, vietnam]
    c: 'Zhou leaves Algiers for the UAR; talks with Premier Sabri and with Nasser. To Nasser: used a European trip to come to Africa and exchange views on the world. Two forms of development: peoples want independence and sweep reaction away, shaking imperialist colonial rule; the U.S. makes trouble everywhere, angers peoples, and is driven off. Since Bandung ten years of both, one in essence: break imperialist control and end colonial rule, old or new.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 722 (Apr. 1, 1965); [[w.zhou-enlai-waijiao-huodong]], 445 (Apr. 1, 1965; 7 a.m., leaving Algiers by special plane for the UAR, Ben Bella and Deputy Prime Minister Boumedienne (布迈丁) seeing him off; 12:30 p.m., arrival at Cairo, met by Prime Minister Ali Sabri; 5 p.m., Zhou calls on Sabri at the Kubba Palace; 6:30 p.m., the formal talks with Nasser at the presidential residence; midnight, talks with Nasser alone); [[w.zhonghua-renmin-gongheguo-waijiao]], 17 (Apr. 1–2, 1965; Zhou''s visit to the UAR; talks with Nasser). Made public: 1993. Names: Zhou Enlai, Sabri, Nasser.'
    src:
      c: 17be6542
      rows:
        - 'w.zhou-enlai-nianpu-1949 II, 722: ?'
        - 'w.zhou-enlai-waijiao-huodong 445: A-B'
        - 'w.zhonghua-renmin-gongheguo-waijiao 17: A'
    tags: [name:zhou-enlai, name:sabri-ali, name:nasser-gamal-abdel, polity:prc, polity:uar, vis:only:prc+uar]
