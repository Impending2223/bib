    c: 'Santo Domingo. The junta''s officers tell the embassy they can no longer protect Americans; Bennett asks for Marines. Johnson, after meeting congressional leaders, tells the country at 8:40 p.m.: troops ordered ashore "to give protection to hundreds of Americans," 400 Marines already landed. Bennett, that night: think of "armed intervention which would go beyond the mere protection of Americans."'
    n: 'Statement by the President Upon Ordering Troops Into the Dominican Republic, [1965 Pub. Papers 461](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=537) (Apr. 28, 1965). [FRUS 1964–68, XXXII, doc. 28](https://history.state.gov/historicaldocuments/frus1964-68v32/d28); [doc. 29](https://history.state.gov/historicaldocuments/frus1964-68v32/d29); [doc. 34](https://history.state.gov/historicaldocuments/frus1964-68v32/d34); [doc. 35](https://history.state.gov/historicaldocuments/frus1964-68v32/d35); [doc. 36](https://history.state.gov/historicaldocuments/frus1964-68v32/d36); [doc. 38](https://history.state.gov/historicaldocuments/frus1964-68v32/d38). [[w.drea-mcnamara-clifford-and-the-2011]], 294 (Bennett''s cables and his request for Marines; the meeting with the leaders; the address at 8:40 p.m.; Bennett''s later cables); [[w.poole-joint-chiefs-of-staff-2012]], 139 (Bennett''s request; the leaders; the address; Bennett''s cable that night); [[w.johnson-vantage-point]], 194–97; [[w.dallek-flawed-giant]], 263–64 (not Bennett''s cable that night); [[w.poole-joint-chiefs-of-staff-2012]], 139 (Bennett''s cable urging Marines ashore at once; that evening the Joint Chiefs'' order, on Johnson''s decision); [[w.ball-past-has-another-pattern]], 328 (Wednesday, April 28: the government radio announces a new junta under Colonel Benoit, who asks Bennett for twelve hundred marines; Bennett first demurs; then his "critic" message, "American lives are in danger," "the time has come," reaches Johnson in the retreat off the Oval Office with Rusk, McNamara, Bundy, Moyers and Ball, talking of Vietnam; four hundred marines ashore within hours; not the 8:40 p.m. statement). [[w.rusk-as-i-saw-it-1990]], 371 (the embassy told; Bennett''s request; the leaders). After the leaders'' meeting: [[cal.1965-04-28.latin-america-dominican-republic-2]]. To check: [[w.lowenthal-dominican-intervention]]; [[w.gleijeses-dominican-crisis]]; [[w.mcpherson-yankee-no]]; [[w.rabe-killing-zone]]; [[w.martin-overtaken-by-events]]; [[w.reaching-for-glory]]; Santo Domingo to State, msg 1132, Apr. 28, 1965, SecDef Subject Decimal files, Acc 70A-1266 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 294 n.13); President''s Daily Diary, Apr. 28, 1965, LBJ Library (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 294 n.14). See [[cal.1965-04-24.latin-america]]. Names: Bennett, Johnson. Check: Rusk, with Johnson, McNamara and Bundy when Bennett''s cable came, has Johnson order five hundred Marines ashore that day and sixteen hundred more the next ([[w.rusk-as-i-saw-it-1990]], 371).'
