    date: '1965-04-02'
    thread: vietnam-air-war
    also: [vietnam-force-levels]
    c: 'McCone to Rusk, copies to McNamara, McGeorge Bundy and Taylor: the ground forces'' change of mission to active combat right only if the strikes on the North really hurt. The strikes "have not caused a change in the North Vietnamese policy," "hardened their attitude." Else "we will find ourselves mired down in combat in the jungle in a military effort that we cannot win." Sent on to Johnson with a letter, after Apr. 2.'
    n: '[FRUS 1964–68, II, doc. 234](https://history.state.gov/historicaldocuments/frus1964-68v02/d234) (the memorandum, attached to the letter). [[w.bernstein-guns-or-butter]], 346 (the strikes; "mired down"). Made public: [[w.pentagon-papers-as-published]], 440–41 (1971), by FRUS''s note. The letter: [[cal.1965-04-06.vietnam]]. Names: McCone, Rusk, McNamara, McGeorge Bundy, Taylor.'
