    c: 'At 9:30 a.m. Apr. 25 the Joint Chiefs order CINCLANT to "take appropriate action": six ships of Task Group 44.9 with the 6th Marine Expeditionary Unit, room for 3,600 evacuees, off the coast. Apr. 26, the civil war full-scale, the Constitutionalists let American helicopters land at the Embajador Hotel; that evening two battalions of the 82nd Airborne alerted at Fort Bragg, N.C., with airlift and air support.'
    n: '[[w.poole-joint-chiefs-of-staff-2012]], 138; [[w.drea-mcnamara-clifford-and-the-2011]], 291–92 (State''s request "on a ''contingency basis''"; Wheeler and Vance approve; the Chiefs to CINCLANT: ships for up to 1,200 Americans). CINCLANT''s contingency plan, OPLAN 373-64: a show of force up to intervention by three battalions (138). See [[cal.1965-04-24.latin-america]].'
