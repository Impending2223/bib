    c: 'Honolulu: McNamara, William Bundy, and McNaughton with Taylor, Wheeler, Sharp, and Westmoreland. None expects Hanoi to yield in less than six months; the bombing at about its present tempo, Hanoi and Haiphong spared; American forces from 33,500 to some 82,000, with 7,250 Korean and Australian. Apr. 21, McNamara''s report to Johnson; Ball, the same day, for a try at settlement before "a 150 percent increase" in troops.'
    n: 'FRUS 1964–68, II, docs. [264](https://history.state.gov/historicaldocuments/frus1964-68v02/d264), [265](https://history.state.gov/historicaldocuments/frus1964-68v02/d265), [266](https://history.state.gov/historicaldocuments/frus1964-68v02/d266), [267](https://history.state.gov/historicaldocuments/frus1964-68v02/d267). [[w.gibbons-u-s-government-and]], III, 230–33 (not the Korean and Australian figure); [[w.frankum-like-rolling-thunder]], 24–25 (the conference; six months at least; the bombing at its pace, Hanoi spared); [[w.drea-mcnamara-clifford-and-the-2011]], 30–31 (the conference and who attended; six months or more; the 82,000; the report; Ball''s dissent); [[w.cosmas-joint-chiefs-of-staff-2012]], 363 (the meeting; the bombing; the report). To check: [[w.ball-past-has-another-pattern]]. See [[cal.1965-04-06.vietnam]]. Check: Gibbons, III, 231, has the forces then at 65,700. Names: McNamara, William Bundy, McNaughton, Taylor, Wheeler, Ball, Sharp, Westmoreland.'
