    c: 'The OAS Council, through the night of Apr. 29–30, calls for a cease-fire and a neutral zone of refuge in Santo Domingo, 16–0, Chile, Mexico, Uruguay, and Venezuela abstaining. The papal nuncio arranges a cease-fire; the 82nd Airborne lands at San Isidro (Check); John Bartlow Martin sent as envoy. Johnson that evening: "people trained outside the Dominican Republic are seeking to gain control."'
