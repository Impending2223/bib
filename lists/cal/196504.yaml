  - id: cal.1965-04-29.latin-america-dominican-republic-3
    when: Apr. 29
    date: '1965-04-29'
    time: 1965-04-29T23:30Z
    place: washington
    thread: latin-america-dominican-republic
    c: 'The White House, 7:30 p.m., after the conference call with Bennett ("mad dogs"): a pro-communist government a threat to the hemisphere, Americans still in danger; a cease-fire, an interim government and free elections sought. 2,500 paratroops to land at San Isidro.'
    n: '[FRUS 1964–68, XXXII: Dominican Republic; Cuba; Haiti; Guyana, doc. 41](https://history.state.gov/historicaldocuments/frus1964-68v32/d41) (the teleconference, 2240Z: "we are dealing with mad dogs now as regards leftist forces"). [[w.drea-mcnamara-clifford-and-the-2011]], 295–96. Wheeler then tells CINCLANT, who diverts the aircraft to San Isidro about 9:30 p.m.; two more battalions loading (Drea, 296). To check: Valenti''s notes, meeting in the Cabinet Room, Apr. 29, 1965, 7:15 p.m., Office of the President File, LBJ Library; CINCLANT to CJTF 122, 300230Z Apr. 1965, NSF, LBJ Library, the diversion (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 296 n.20). See [[cal.1965-04-29.latin-america-dominican-republic-2]]. Names: Bennett.'
    src:
      c: 2e2b35ce
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d41: A'
        - 'w.drea-mcnamara-clifford-and-the-2011 295–96: all'
        - 'via x.1965-04-29.teleconference-state-santo-domingo: A'
        - 'via x.1965-04-29.valenti-notes-cabinet-room-715: all'
    tags: [name:bennett-w-tapley-jr, name:johnson-lyndon-b]
  - id: cal.1965-04-29.vietnam-air-war
    when: Apr. 29
    date: '1965-04-29'
    thread: vietnam-air-war
    c: 'Rolling Thunder 12 ends, the last of the blocks since RT 9 of Apr. 2 against the North''s lines of communication into Laos and the South: bridges and ferries by day and night, armed reconnaissance against rolling stock, trucks and shipping, up to 24 strike sorties a day; six more allowed in RT 12 against trucks and trains. By its end, 26 bridges and seven ferries struck.'
    n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 363–64. By the end of April 60 of the Joint Chiefs'' targets in the North struck, 43 by American planes and 17 by the VNAF; 86 armed reconnaissance missions; of 474 sorties authorized on fixed targets 316 flown, of 264 on armed reconnaissance 249 (Cosmas, 363–64). To check: CM-568-65 to D/JS, Apr. 26, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 364 n.9). See [[cal.1965-03-02.vietnam]].'
    src:
