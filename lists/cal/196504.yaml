  - id: cal.1965-04-03.vietnam
    when: Apr. 3–4
    date: '1965-04-03'
    thread: vietnam
    c: 'The Thanh Hóa bridge, rail and road, struck by Air Force F-105s, Apr. 3 and 4: the spans damaged, the bridge standing. Six aircraft lost over the two days, two F-105s to MiGs, the first engagement with them. Wheeler to McNamara, Apr. 6: the bridges at Thanh Hóa and Đồng Phương destroyed, "the most damaging military blow delivered to date."'
    n: 'FRUS 1964–68, II, docs. [220](https://history.state.gov/historicaldocuments/frus1964-68v02/d220) (Mar. 30, the decision), [241](https://history.state.gov/historicaldocuments/frus1964-68v02/d241) (Apr. 6), [250](https://history.state.gov/historicaldocuments/frus1964-68v02/d250) (Apr. 13). [[w.frankum-like-rolling-thunder]], 22–23 (the strikes of Apr. 3 and 4; the losses); [[w.staaveren-gradual-failure]], 105–09. To check: Ofc Asst SECDEF (PA) News Release No 206-65, 4 Apr 65 (cited by [[w.staaveren-gradual-failure]], 106 n.15); Hq USAF rpt, Analysis of Air Operations, Southeast Asia, 26 Mar 65, Vol I, pp 4-14N to 4-14R (cited by [[w.staaveren-gradual-failure]], 108 n.17a); Project CHECO, Rolling Thunder, pp 31-35 (cited by [[w.staaveren-gradual-failure]], 108 n.17b); Asst SECDEF (PA), News Release 206-65, 4 Apr 65 (cited by [[w.staaveren-gradual-failure]], 108 n.17c); hist, 313th AD, Jul-Dec 65, p 187 (cited by [[w.staaveren-gradual-failure]], 108 n.17d); hist, 67th TFS, 1 Jan-30 Jun 65, chap IV (cited by [[w.staaveren-gradual-failure]], 108 n.17e); Lt Charles H. Heffron, Air to Air Encounters Over NVN (Proj CHECO, 1967), p 1 (cited by [[w.staaveren-gradual-failure]], 108 n.17f); memo, L. Unger, Dep Asst SECSTATE for Far Eastern Affairs and Chmn of VN Coordinating Cmte to George Ball, Acting SECSTATE, subj: Recent U.S. Mil Engagements in NVN and Vicinity (cited by [[w.staaveren-gradual-failure]], 108 n.17g); msg, Wheeler to Sharp, 061616Z Apr 65 (cited by [[w.staaveren-gradual-failure]], 108 n.17h); McConnell Notebook, Item 68, 3 Apr 65, and Item 93, 13 Apr 65 (cited by [[w.staaveren-gradual-failure]], 108 n.17i). See [[cal.1965-03-02.vietnam]]. Names: Wheeler, McNamara.'
