  - id: cal.1965-04-07.vietnam
    when: Apr. 7
    date: '1965-04-07'
    thread: vietnam
    c: 'Johnson at Johns Hopkins, Baltimore, on television: "Peace Without Conquest." "We will not be defeated. We will not grow tired"; ready "for unconditional discussions"; a billion dollars for the development of Southeast Asia, the Mekong to "dwarf even our own TVA," Eugene Black to lead. Apr. 8, Phạm Văn Đồng''s four points: American troops and bases out; no foreign alliances, as at Geneva; the South''s affairs settled by its people on the Front''s program; reunification without foreign interference.'
    n: 'Address at Johns Hopkins University: "Peace Without Conquest", [1965 Pub. Papers 394](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=470) (Apr. 7, 1965). [FRUS 1964–68, II, doc. 245](https://history.state.gov/historicaldocuments/frus1964-68v02/d245). Recording (K–J Adm. II.I). [[w.gibbons-u-s-government-and]], III, 217–18 (the speech, not the TVA or Black; the four points, as Hanoi''s); [[w.staaveren-gradual-failure]], 103–04 (the address; Phạm Văn Đồng''s four points); [[w.johnson-vantage-point]], 132–34 (the address). To check: [[w.logevall-choosing-war]]; [[w.thies-when-governments-collide]]; [[w.search-for-peace-in]]; [[w.herring-lbj-and-vietnam]]; [[w.gardner-pay-any-price]]. See [[cal.1965-03-02.vietnam]]. Names: Johnson, Black, Phạm Văn Đồng.'
