  - id: cal.1965-04-01.civil-rights-the-executive
    when: Apr. 1
    date: '1965-04-01'
    thread: civil-rights-the-executive
    also: [king]
    c: 'News conference. Of King''s call for a boycott of Alabama: no comment on "some plan that I am not aware of"; "we must be very careful to see that we do not punish the innocent in this country while we are trying to protect all of our people."'
    n: 'The President''s News Conference of April 1, 1965, [1965 Pub. Papers 364](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=440), 366–67 (Apr. 1, 1965). [[w.kotz-judgment-days]], 327 (not King by name; a boycott would hurt Alabama''s Negroes as well as its whites). See [[cal.1965-03-28.king]]. Names: Johnson, Martin Luther King.'
    src:
      c: 8bb8c59a
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=440: all'
        - 'w.kotz-judgment-days 327: all'
    tags: [name:johnson-lyndon-b, name:king-martin-luther-jr]
  - id: cal.1965-04-02.opinion
    when: Apr. 2
    date: '1965-04-02'
    thread: opinion
    also: [foreign-aid]
    c: 'Gallup, Feb. 19–24: foreign aid in general: for 57 percent, against 33. Johnson''s $3.4 billion for aid: decreased 49, kept the same 33, increased 6.'
    n: '[[w.gallup-poll]], III, 1932. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-04-02.japan-and-korea
    when: Apr. 2
    date: '1965-04-02'
    thread: japan
    also: [economy]
    c: 'Executive Order 11211: new issues of Japan''s government exempt from the interest equalization tax, up to $100 million a year.'
    n: '[Executive Order 11211](https://www.presidency.ucsb.edu/documents/executive-order-11211-exclusion-for-original-or-new-japanese-issues-required-for) (Apr. 2, 1965). See [[cal.1963-08-01.japan-and-korea]]; [[cal.1964-09-02.economy]].'
    tags: [name:johnson-lyndon-b]
    short: Japan's bonds exempted from the tax
  - id: cal.1965-04-02.vietnam
    when: Apr. 2
    date: '1965-04-02'
    thread: vietnam
    c: 'Taylor before Foreign Relations and Armed Services in executive session, then the House committee; guarded on troops. To the NSC: Fulbright worried of three or four divisions, and whether the resolution covers them. Johnson: no new resolution needed to send troops. Case: the resolution not enough for "a major step." Fulbright: "Maybe we made a mistake in committing ourselves publicly"; $1 million for an embassy building, "but you don''t want to ask us for 300,000 men." Stennis: "we are moving rapidly in that direction."'
    n: 'FRUS 1964–68, II, docs. [231](https://history.state.gov/historicaldocuments/frus1964-68v02/d231), [235](https://history.state.gov/historicaldocuments/frus1964-68v02/d235) (William Bundy to the congressional liaison, Apr. 3). [[w.gibbons-u-s-government-and]], III, 212–14. [[w.mann-grand-delusion]], 422–24. To check: the joint executive session''s transcript, Apr. 2, 1965, unpublished (cited by [[w.gibbons-u-s-government-and]], III, 212 n.189). See [[cal.1965-03-08.vietnam]]. Names: Taylor, Fulbright, Johnson, Case, Stennis.'
    src:
      c: 84c0d46c
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d231: C-D'
        - 'w.gibbons-u-s-government-and III, 212–14: A-D'
        - 'via w.gibbons-u-s-government-and III, 212 n.189: A-B'
        - 'via w.gibbons-u-s-government-and III, 214 n.192: C-D'
        - 'w.mann-grand-delusion 422–24: A, C-H'
        - 'via w.mann-grand-delusion 423 n.19: E-H'
        - 'via w.mann-grand-delusion 424 n.20: C-D'
    tags: [name:taylor-maxwell, name:fulbright-j-william, name:johnson-lyndon-b, name:bundy-william, name:case-clifford-p, name:stennis-john-c]
  - id: cal.1965-04-02.vietnam-congress
    when: Apr. 2
    date: '1965-04-02'
    thread: vietnam-congress
    c: 'Fulbright''s memorandum for Johnson, with Tillman: a massive ground and air war "a disaster"; the threat not Communism but Chinese expansion; a Titoist Vietnam better than weak regimes on American money; a pause in the bombing. Shown to McNamara, two hours one Sunday.'
    n: '[[w.gibbons-u-s-government-and]], III, 211–12 (from Johnson and Gwertzman, *Fulbright: The Dissenter*, 205–06). [[w.mann-grand-delusion]], 421–22 (the memorandum, with Tillman; "a bloody and interminable conflict"). Check: Austin, *The President''s War*, 120, has it handed to Johnson at a dinner of Apr. 5, which the Daily Diary does not show (Gibbons, III, 212 n.188). Names: Fulbright, McNamara, Johnson. Check: Mann has it handed to Johnson in early April and sent Apr. 6.'
    src:
      c: 7e301b29
      rows:
        - 'w.gibbons-u-s-government-and III, 211–12: all'
        - 'w.mann-grand-delusion 421–22: A-B'
    tags: [name:fulbright-j-william, name:mcnamara-robert-s, name:johnson-lyndon-b]
    short: Fulbright's memorandum against a wider war
