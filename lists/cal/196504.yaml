  - id: cal.1965-04-29.vietnam-air-war
    when: Apr. 29
    date: '1965-04-29'
    thread: vietnam-air-war
    c: 'Rolling Thunder 12 ends, the last of the blocks since RT 9 of Apr. 2 against the North''s lines of communication into Laos and the South: bridges and ferries by day and night, armed reconnaissance against rolling stock, trucks and shipping, up to 24 strike sorties a day; six more allowed in RT 12 against trucks and trains. By its end, 26 bridges and seven ferries struck.'
    n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 363–64. By the end of April 60 of the Joint Chiefs'' targets in the North struck, 43 by American planes and 17 by the VNAF; 86 armed reconnaissance missions; of 474 sorties authorized on fixed targets 316 flown, of 264 on armed reconnaissance 249 (Cosmas, 363–64). To check: CM-568-65 to D/JS, Apr. 26, 1965 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 364 n.9). See [[cal.1965-03-02.vietnam]].'
