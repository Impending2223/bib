    thread: medicare
    also: [welfare]
    c: House passes the Medicare bill, H.R. 6675, [313–115](https://voteview.com/rollcall/RH0890035). Byrnes's motion to recommit, to put his voluntary plan in its place, lost, [191–236](https://voteview.com/rollcall/RH0890034).
    n: '[111 Cong. Rec., House, Apr. 8, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-2-1.pdf). [[w.zelizer-taxing-america]], 249–50. See [[cal.1965-03-23.medicare]]. Names: Byrnes.'
