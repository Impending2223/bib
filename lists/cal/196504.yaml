    c: 'Johnson at Johns Hopkins, Baltimore, on television: "Peace Without Conquest." "We will not be defeated. We will not grow tired"; ready "for unconditional discussions"; a billion dollars for the development of Southeast Asia, the Mekong to "dwarf even our own TVA," Eugene Black to lead. Apr. 8, Phạm Văn Đồng''s four points: American troops and bases out; no foreign alliances, as at Geneva; the South''s affairs settled by its people on the Front''s program; reunification without foreign interference.'
    n: 'Address at Johns Hopkins University: "Peace Without Conquest", [1965 Pub. Papers 394](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=470) (Apr. 7, 1965). [FRUS 1964–68, II, doc. 245](https://history.state.gov/historicaldocuments/frus1964-68v02/d245). Recording (K–J Adm. II.I). [[w.gibbons-u-s-government-and]], III, 217–18 (the speech, not the TVA or Black; the four points, as Hanoi''s); [[w.staaveren-gradual-failure]], 103–04 (the address; Phạm Văn Đồng''s four points); [[w.johnson-vantage-point]], 132–34 (the address); [[w.herring-lbj-and-vietnam]], 96–97, 125 (the address: "unconditional discussions," the billion dollars, a program like the TVA for the Mekong, not Black; Hanoi''s four points in answer, 97, not their day or terms but the third); [[w.preston-war-council]], 194 (Bundy''s part in the speech; Hanoi''s four points the next day); [[w.mcpherson-political-education]], 391–92 (Goodwin the speech''s author; massive aid to all the countries of Indochina, North Vietnam included, after the war; the first systematic defense of the American role by a President: "We are there because we have a promise to keep"); [[w.schwartz-lyndon-johnson-and-europe]], 88 (the Southeast Asian Development Program, "the heart of an April 1965 speech at Johns Hopkins University"; not the billion dollars, the Mekong or Black); [[w.johnson-white-house-diary]], 256 (at Johns Hopkins, at 9: "We will not be defeated. We will not grow tired"; the Mekong and the billion dollars, as she gives them, "dwarf even our own TVA"; Eugene Black not named). [[w.logevall-choosing-war]], 371–72 (the speech, "unconditional discussions," the billion dollars; the four points, not their terms); [[w.branch-at-canaans-edge]], 205–06 (not the four points). To check: [[w.thies-when-governments-collide]]; [[w.search-for-peace-in]]; [[w.gardner-pay-any-price]]. After the Senators'' reading of the speech and the afternoon''s call on Black: [[cal.1965-04-07.vietnam-congress-2]]; [[cal.1965-04-07.vietnam-2]]. See [[cal.1965-03-02.vietnam]]. Names: Johnson, Black, Phạm Văn Đồng.'
