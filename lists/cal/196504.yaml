  - id: cal.1965-04-01.vietnam-3
    when: Apr. 1
    date: '1965-04-01'
    thread: vietnam-force-levels
    also: [vietnam]
    c: 'Bundy''s "Key Elements for Discussion," for the 5:30 meeting: morale better in the South; the armed forces in fair shape, "though top leadership is not really effective and the ratio of armed forces to the VC buildup is not good enough"; attacks near Hanoi might bring in Peking''s air.'
    n: '[FRUS 1964–68, II, doc. 228](https://history.state.gov/historicaldocuments/frus1964-68v02/d228). [[w.preston-war-council]], 203. See [[cal.1965-04-06.vietnam]]. Names: Bundy.'
