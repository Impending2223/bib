  - id: cal.1965-04-02.vietnam-congress
    when: Apr. 2
    date: '1965-04-02'
    thread: vietnam-congress
    c: 'Fulbright''s memorandum for Johnson, with Tillman: a massive ground and air war "a disaster"; the threat not Communism but Chinese expansion; a Titoist Vietnam better than weak regimes on American money; a pause in the bombing. Shown to McNamara, two hours one Sunday.'
    n: '[[w.gibbons-u-s-government-and]], III, 211–12 (from Johnson and Gwertzman, *Fulbright: The Dissenter*, 205–06). [[w.mann-grand-delusion]], 421–22 (the memorandum, with Tillman; "a bloody and interminable conflict"). Check: Austin, *The President''s War*, 120, has it handed to Johnson at a dinner of Apr. 5, which the Daily Diary does not show (Gibbons, III, 212 n.188). Names: Fulbright, McNamara, Johnson. Check: Mann has it handed to Johnson in early April and sent Apr. 6.'
    src:
      c: 7e301b29
      rows:
        - 'w.gibbons-u-s-government-and III, 211–12: all'
        - 'w.mann-grand-delusion 421–22: A-B'
    tags: [name:fulbright-j-william, name:mcnamara-robert-s, name:johnson-lyndon-b]
