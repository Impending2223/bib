  - id: cal.1965-04-02.china-leadership-2
    when: Apr. 2
    date: '1965-04-02'
    time: 1965-04-02T12:00Z
    time_approx: true
    place: karachi
    thread: china-leadership
    also: [vietnam, vietnam-hanoi, south-asia]
    c: 'Zhou, Karachi, talks with Ayub Khan. With U.S. aggression and pressure rising there is no chance of Vietnam yielding. Whether the war widens is not a matter of men''s will; once it widens no line can be drawn, as with spreading fire; the U.S. plays with fire and China will put it out. China does not oppose negotiation in principle, every matter ends in talk; but for South Vietnam the conditions and the time are not ripe. Asks Ayub, on his U.S. visit, to tell the U.S. three things: China will not itself start a war on the U.S.; Chinese words count; China is prepared. If war is forced on China it will resist to the end, no other way; if the U.S. bombs in the air, the Chinese on the ground can act by other means; a full bombing of China is war, and war has no limits. Per the Chinese record, Zhou also tells Ayub the four points he has fixed with Nasser and Ben Bella for the second Asian–African conference: no change of date, consensus, new agenda items only at the foreign ministers'' meeting, and no Soviet participation. He says Tito, with the Soviets directing behind him, put together the nonaligned appeal for talks on Vietnam, and that Nasser and Ben Bella came round when he told them the facts.'
    n: '"[Record of Conversation between Premier Zhou Enlai and the President of Pakistan Ayub Khan](https://digitalarchive.umd.edu/document/165485)" (Apr. 2, 1965), PRC FMA 106-01267-02, 37–50, trans. Stephen Mercado, Wilson Center Digital Archive. [[w.zhou-enlai-nianpu-1949]], II, 723 (Apr. 2, 1965); [[w.zhou-enlai-waijiao-huodong]], 445 (Apr. 2, 1965; 5 p.m., presidential house, Karachi; the talks with Ayub Khan); [[w.zhou-enlai-waijiao-huodong]], 445 (Apr. 2, 1965; 10:20 p.m., presidential residence, Karachi, talk with Ayub Khan alone; the book has Zhou asking Ayub to convey three points to the U.S. (no war started by China; China''s word counts and its international obligations are met; China is prepared) and a fourth: if the U.S. bombs wildly China will not wait to be killed, bombing is war, and war has no limits); [[w.zhonghua-renmin-gongheguo-waijiao]], 17–18 (Apr. 2–3, 1965; Zhou''s visit to Pakistan; talks with Ayub Khan and Bhutto; the four points to be passed to the U.S.); [[w.77-conversations-between-chinese]], [77–83](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=75) (doc. 6; headed Karachi, Apr. 2, 1965, no hour: Zhou to Ayub Khan on Vietnam, war and negotiation; the three points for Ayub to give the U.S., China will not start a war, China keeps its word as in Korea, China is prepared, summed up at 82; the NLF''s statement of Mar. 22 and the Renmin ribao editorial of Mar. 25; the editors, 82, note that Ayub''s trip to the U.S. was postponed). [[w.macfarquhar-origins-of-the-cultural]], III, 374 (on Apr. 2, in Karachi, Zhou gives Ayub Khan four points to pass to Johnson: China will not provoke a war with the United States; it will help any country the imperialists attack, and fight to the end if attacked itself; it is prepared; once war comes there will be no boundaries); [[w.jian-zhou-enlai]], 523 (Karachi, Apr. 2: Zhou asks Ayub Khan to carry to Johnson, on his coming trip to Washington, a three-point message: China will not take the initiative to provoke a war with the United States; China means what it says; China is prepared; the "lesson from Korea," the friend now Pakistan, not India); [[w.khoo-collateral-damage]], 31–32 (by the Foreign Ministry''s history, Zhou''s oral message of Apr. 2 to Ayub Khan for the Americans: China will not provoke a war; what it says counts; it is prepared; in effect an understanding that no Chinese combat troops would go to North Vietnam if the Americans stayed south of the 17th parallel). Made public: 1993. Check: the transcript (77 Conversations, doc. 6, 82) sums up three points; the fourth the chronology gives (445: bombing is war, and war has no limits) is in the transcript''s talk of the bombing, not among the three. To check: huaien, 450–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.172a); [[w.new-york-times]], Apr. 3, 1965 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.172b); [[w.bianjibu-dangdai-zhongguo-waijiao]], 160–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.173a); [[w.yixian-zhechong-yu-gongchu]], 146–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.173b); [[w.whiting-chinese-calculus-of-deterrence]], 193–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.173c); [[w.scholars-bulletin-of-the-cold-1996]], 250 (Ilya V. Gaiduk, "Vietnam War and Soviet-American Relations, 1964–73") (cited by [[w.khoo-collateral-damage]], 31 n.155); [[w.wang-taiping-zhonghua-renmin-gongheguo-waijiaoshi]], 36 (cited by [[w.khoo-collateral-damage]], 31 n.156a); [[w.zhou-enlai-waijiao-huodong]], 445 (cited by [[w.khoo-collateral-damage]], 31 n.156b); [[w.duiker-china-and-vietnam]], 49 (cited by [[w.khoo-collateral-damage]], 32 n.169a); [[w.rogers-sino-american-relations-and]], 293–314 (cited by [[w.khoo-collateral-damage]], 32 n.169b). Names: Zhou Enlai, Ayub Khan, Bhutto, Nasser, Ben Bella, Tito.'
