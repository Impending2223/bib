    c: 'Yang Shangkun 杨尚昆 leaves Zhangbagou 丈八沟, Xi''an 西安, at 8 a.m. for the Hanzhong 汉中 area: by Yuyukou 峪口 and Shiyangguan 石羊关 to the Qinling 秦岭 (65 km, photographs), over the higher Tonghe 同河 and Pinghe 平河 ridges, 27 hairpin bends, under 30 km an hour; a halt at Hekou 河口 commune; at Ningshan 宁陕 county seat, Guankou 关口 town, at 4:30 p.m.: 188 km. The county: over 6 million mu of mountains, 58,000 people, 50,000 cubic meters of timber felled a year, badly hit last year.'
