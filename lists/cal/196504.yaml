  - id: cal.1965-04-12.china-leadership
    when: Apr. 12
    date: '1965-04-12'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Zhou attends the enlarged Politburo meeting, which discusses and in the main adopts the directive (the Central Committee issues it that day). He proposes to strike second and leave room; join war preparation to the long-term plan and where they clash war preparation governs; every ministry, above all government and military ones, to keep duty officers daily. On raising the slogan "Aid Vietnam, resist America": later; now China supports the Vietnamese struggle against America with Vietnam the main party.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 724 (Apr. 12, 1965); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 618 (Apr. 12, 1965; Liu presides at the enlarged Politburo meeting, which discusses the situation in Vietnam and war preparation at home, and in the main adopts the Central Committee''s instruction on strengthening war preparation); [[w.macfarquhar-origins-of-the-cultural]], III, 371 (the Central Committee circulates the directive on preparing for war on Apr. 12: American attacks on military installations, industry, communications and big cities, even an invasion, possible; only frontier regions to mobilize now); [[w.deng-xiaoping-nianpu-1904]], III, 1855–1856 (Apr. 12, 1965; afternoon, 下午; Deng at the enlarged Politburo meeting, on the situation in Vietnam and war preparation at home; the meeting in the main adopts the Central Committee''s ''Directive on strengthening war preparation'' 《关于加强备战工作的指示》, issued on the 14th; Deng says Mao criticized the third-front construction as taken up late, the Secretariat included in the error, but it is not too late; not only the great third front but the small third front, chiefly arsenals, so that each region from the Northeast to South China could fight on its own, ''you fight yours, I fight mine; fight if you can win, leave if not, and fight again''; on Vietnam, the war depends neither on American imperialism''s will nor on that of Vietnam and China; the war may widen, first in the South, then the North and the Chinese border areas near Vietnam, or the Americans may fight the Chinese in a larger local war, even to Korea; every possible help is to be given to Vietnam); [[w.peng-zhen-nianpu-1902]], IV, 413 (Apr. 12, 1965, afternoon; Peng Zhen at the enlarged Politburo on the U.S. widening of the war in Vietnam, direct aggression on the DRV, grave threat to China''s security; the Center''s directive on strengthening war preparations adopted, issued on the 14th); [[w.jian-zhou-enlai]], 525 (the Politburo chaired by Liu; Deng''s four possibilities: the war in South Vietnam; in both South and North, linked to Laos; in China''s provinces bordering Vietnam; a larger regional war with China, even involving Korea; to be prepared for all four); [[w.jian-zhou-enlai]], 526 (Zhou''s presentation endorsing Deng: "military industry, the third front, and foreign aid all need to be accelerated," "some moves" slower, some postponed; leeway in what is said abroad; strike only after the enemy strikes first; "assisting Vietnam and resisting America" divided in two in practice, first to "assist Vietnam," then to "resist America"). Made public: 1996. To check: [[w.gailong-zhongguo-gongchan-dang-fazhan]], 797 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 371 n.152a); [[w.zedong-jianguo-yilai-mao-zedong]], 11, 359–60, 381–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 371 n.152b); Deng''s speech at a Politburo meeting, April 12, 1965, 101-4-384, Fujian Provincial Archive (cited by [[w.jian-zhou-enlai]], 525 n.25a); Zhou''s speech at a Politburo meeting, April 12, 1965, 101-4-384, Fujian Provincial Archive (cited by [[w.jian-zhou-enlai]], 526 n.27). Names: Zhou Enlai.'
