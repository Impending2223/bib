    when: Apr. 2
    date: '1965-04-02'
    thread: vietnam-congress
    c: 'Fulbright to the press after Taylor''s testimony: "very serious, very unhappy situation and all are apprehensive"; the war "can always escalate beyond control."'
    n: '[[w.gibbons-u-s-government-and]], III, 214. To check: *New York Times*, Apr. 3, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 214 n.191). See [[cal.1965-04-02.vietnam]]. Names: Fulbright, Taylor.'
