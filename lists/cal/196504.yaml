    n: '[FRUS 1964–68, II, doc. 235](https://history.state.gov/historicaldocuments/frus1964-68v02/d235) (William Bundy to MacArthur, Apr. 3, quoting the record of the call). [[w.mann-grand-delusion]], 424. Names: Rusk, Church, Fulbright, Case.'
