    tags: [name:mccone-john-a, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:taylor-maxwell]
  - id: cal.1965-04-03.laos
    when: Apr. 3
    date: '1965-04-03'
    thread: laos
    also: [vietnam]
    c: 'Steel Tiger begins: American air operations against the infiltration routes of the Laotian panhandle, apart from Barrel Roll in the north and heavier. The division not told the Lao; Souvanna consulted on the intensification.'
    n: 'FRUS 1964–68, XXVIII, docs. [174](https://history.state.gov/historicaldocuments/frus1964-68v28/d174) (Mar. 20), [175](https://history.state.gov/historicaldocuments/frus1964-68v28/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v28/d176) (Mar. 25). [[w.frankum-like-rolling-thunder]], 117 (Steel Tiger from Apr. 3, Barrel Roll to the north); [[w.cosmas-joint-chiefs-of-staff-2012]], 351 (the program, Apr. 3); [[w.marolda-united-states-navy-and]], 512 (the JCS create Steel Tiger, Apr. 3); [[w.staaveren-u-s-air-force]], 56, 58 (the program approved Mar. 20, Barrel Roll to the north; Souvanna''s assent, Mar. 30; CINCPAC''s order, from Apr. 3); [[w.anthony-war-in-northern-laos]], 164 (the day). To check: OP-33, memo, "Barrel Roll 10 Chronology," of 18 Jan 1965 (cited by [[w.marolda-united-states-navy-and]], 512 n.18a); CO Constellation, report, ser 057 of 1 Feb (cited by [[w.marolda-united-states-navy-and]], 512 n.18b); COMCARDIV3 (TF77), report, ser 0014 of 29 Mar (cited by [[w.marolda-united-states-navy-and]], 512 n.18c); memo, Mullenix to Director, Operations Evaluation Group, ser 00241-65 of 1 Apr (cited by [[w.marolda-united-states-navy-and]], 512 n.18d); OP-33, tabulation, "Barrel Roll Mission and Date Flown, as of 1500 14 April" (cited by [[w.marolda-united-states-navy-and]], 512 n.18e); msgs, CP 050253Z Mar 1965 (cited by [[w.marolda-united-states-navy-and]], 512 n.18f); 170410Z (cited by [[w.marolda-united-states-navy-and]], 512 n.18g); 190037Z (cited by [[w.marolda-united-states-navy-and]], 512 n.18h); JCS 192332Z (cited by [[w.marolda-united-states-navy-and]], 512 n.18i); 200019Z (cited by [[w.marolda-united-states-navy-and]], 512 n.18j); 231549Z (cited by [[w.marolda-united-states-navy-and]], 512 n.18k); 231953Z (cited by [[w.marolda-united-states-navy-and]], 512 n.18l); Miller, Interview, pp. 352-54 (cited by [[w.marolda-united-states-navy-and]], 512 n.18m); CINCPAC, Command History, 1965, Vol II, pp. 393-401 (cited by [[w.marolda-