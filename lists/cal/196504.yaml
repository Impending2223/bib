    when: Apr. 29–30
    date: '1965-04-29'
    thread: latin-america-dominican-republic
    c: 'Midafternoon, on Johnson''s decisions, the Joint Chiefs order the rest of the 6th MEU ashore and two airborne battalions from Fort Bragg to Ramey Air Force Base, Puerto Rico, to drop on San Isidro airfield in the morning; with the C-130s already in the air, they are sent straight to San Isidro, to land in the night. 1:08 a.m. Apr. 30, Masterson''s concept: the paratroopers to hold San Isidro and the Ozama bridges, the Marines a line east of the embassy.'
    n: '[[w.poole-joint-chiefs-of-staff-2012]], 140; [[w.drea-mcnamara-clifford-and-the-2011]], 295–96 (the President with McNamara and Mann at noon: 500 more Marines, two airborne battalions to Ramey; the orders by 3:15 p.m.; Power Pack I out of Fort Bragg about 8 p.m., more than 140 transports; diverted to San Isidro about 9:30 p.m.). See [[cal.1965-04-28.latin-america]].'
    src:
