  - id: cal.1965-04-02.china-leadership-11
    when: Apr. 2
    date: '1965-04-02'
    place: peking
    thread: china-leadership
    c: 'Peking 北京. Peng Zhen 彭真 reports to more than 28,000 at a meeting of the national design conference''s delegates, those at the central ministries'' conferences and the heads of State Council 国务院 and Peking organs and colleges: with fifteen years'' material base and lessons, to catch up with and pass the world''s advanced levels, as Sun Yat-sen said "meet them head on"; failures teach more than successes; sum up by treating oneself as an object, fully and by the facts, not by hunting who is to blame, making every man pass the gate, raising every matter to the "key link" of power holders on the capitalist road; quality first in design, two "three-way unions," of cadres, experts and masses and of designers, builders and users; links that bind production changed, a revolution in its way; designers, mostly intellectuals, judged by conduct, not origin; leave their offices for the sites; senior intellectuals to overcome individualism and bookishness; printed in the *Selected Works of Peng Zhen* 《彭真文选》 as "Set high aims, catch up with and surpass the world''s advanced levels" 《树立雄心壮志，赶上和超过世界先进水平》.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 411–412. The words: 下午 (IV, 411–412). Names: Peng Zhen.'
    src:
      c: f3424582
      rows:
