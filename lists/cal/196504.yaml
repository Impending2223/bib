    thread: china-leadership
    also: [indonesia]
    c: 'Zhou, in his farewell address on Indonesian radio: Bandung was an epoch-making act of Asia and Africa; ten years have changed Asia and Africa utterly; over two billion people are a strong force for peace and progress. In Indonesia he met Kim Il Sung, Phạm Văn Đồng, Sihanouk, Cambodia''s prime minister Norodom Kantol, Souphanouvong, Algeria''s deputy premier Said, Nepal''s crown prince Birendra and North Borneo''s Azahari, prime minister of the revolutionary government. To Azahari on China''s revolution: its victory was the work of the whole people under Mao and the Central Committee; "I am only a screw."'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 726 (Apr. 25, 1965); [[w.zhou-enlai-waijiao-huodong]], 447–49 (Apr. 16–25, 1965; the book dates the meetings item by item (Kim Il Sung Apr. 16 and 19, Phạm Văn Đồng Apr. 18 and 21, Sihanouk and Norodom Kantol Apr. 17 and 23, Souphanouvong Apr. 21, the Nepalese crown prince Apr. 23 and others); on Apr. 24, 2 p.m., Zhou meets Azahari, prime minister of the North Kalimantan Unitary Revolutionary Government, at his residence in Jakarta); [[w.zhou-enlai-waijiao-huodong]], 449 (Apr. 25, 1965; evening; the farewell address at the Indonesian radio station); [[w.zhonghua-renmin-gongheguo-waijiao]], 21 (Apr. 25, 1965; the farewell speech on Radio Indonesia). Names: Zhou Enlai, Phạm Văn Đồng, Norodom Kantol, Souphanouvong.'
