  - id: cal.1965-04-29.china-leadership-2
    when: Apr. 29–May 2
    date: '1965-04-29'
    time: 1965-04-29T09:00Z
    place: peking
    thread: china-leadership
    also: [africa]
    c: 'Zhou has five talks with Ghana''s government delegation under Foreign Minister Kojo Botsio, Apr. 29 to May 2. U.S. forces are now spread over the world, bases and fleets everywhere; the more it does so the more it angers peoples. China can offer Asian and African states its experience of anti-imperialist, anticolonial revolution; on building it feels short of experience and ability; it will give more. Apr. 30, second talk, on the world since the Second World War: in 1949 the Soviet ambassador followed the Kuomintang government to Guangzhou while Leighton Stuart stayed at Nanjing and, through Luo Longji, offered recognition and three to five billion dollars for a friendly China; Luo, in Peking in June, found Mao''s "On the People''s Democratic Dictatorship" just out and wrote Stuart to go home. The U.S., having lost China and failed in Korea, puts new colonialism in the old''s place: Israel against the Arabs, the Congo through the U.N., Laos and South Vietnam in France''s stead.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 727 (Apr. 29–May 2, 1965); [[w.zhou-enlai-waijiao-huodong]], 451–53 (Apr. 30, 1965; 3 p.m., Building 9, Diaoyutai guesthouse, the second talk; the book has Zhou saying the student sent to talk with Stuart is Huang Hua, now ambassador to Ghana); [[w.zhou-enlai-waijiao-huodong]], 450 (Apr. 29, 1965; 5 p.m., Zhejiang Hall, Great Hall of the People; the Ghana delegation under Foreign Minister Kojo Botsio (科佐·博齐约)); [[w.zhou-enlai-waijiao-huodong]], 451–54 (Apr. 29 – May 2, 1965; the five talks: Apr. 30, 3 p.m., second, Building 9, Diaoyutai guesthouse, with Zhou ending on U.S. forces and bases spread over the world; May 1, 10 a.m., third, and 5:30 p.m., fourth, same place; May 2, 10 a.m. to 2 p.m., fifth); [[w.zhonghua-renmin-gongheguo-waijiao]], 24 (Apr. 26–May 3, 1965; Botsio''s visit, Apr. 26 to May 3; Liu Shaoqi receives the delegation; Zhou''s talks with Botsio). Made public: 1993. The time is the first day''s. Names: Zhou Enlai, Kojo Botsio, Mao Zedong.'
    src:
