    date: '1965-04-29'
    time: 1965-04-29T23:30Z
    thread: latin-america-dominican-republic
    c: 'The White House, 7:30 p.m., after the conference call with Bennett ("mad dogs"): a pro-communist government a threat to the hemisphere, Americans still in danger; a cease-fire, an interim government and free elections sought. 2,500 paratroops to land at San Isidro.'
    n: '[FRUS 1964–68, XXXII: Dominican Republic; Cuba; Haiti; Guyana, doc. 41](https://history.state.gov/historicaldocuments/frus1964-68v32/d41) (the teleconference, 2240Z: "we are dealing with mad dogs now as regards leftist forces"). [[w.drea-mcnamara-clifford-and-the-2011]], 295–96. Wheeler then tells CINCLANT, who diverts the aircraft to San Isidro about 9:30 p.m.; two more battalions loading (Drea, 296). To check: Valenti''s notes, meeting in the Cabinet Room, Apr. 29, 1965, 7:15 p.m., Office of the President File, LBJ Library; CINCLANT to CJTF 122, 300230Z Apr. 1965, NSF, LBJ Library, the diversion (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 296 n.20). See [[cal.1965-04-29.latin-america-dominican-republic-2]]. Names: Bennett.'
    src:
