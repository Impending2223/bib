  - id: cal.1967-06-02.vietnam
    when: June 2–3
    date: '1967-06-02'
    thread: vietnam-air-war
    also: [soviet-union]
    c: 'American aircraft attacking an antiaircraft battery at Cẩm Phả, 50 miles north of Haiphong, hit the Soviet freighter *Turkestan*; one of her crew killed. Moscow: "an act of banditry." Washington, June 3: only military targets attacked, the ship hit by North Vietnamese fire.'
    n: 'FRUS 1964–68, V, doc. [188](https://history.state.gov/historicaldocuments/frus1964-68v05/d188). [[w.current-documents-1967]], 939–941. To check: [[w.gaiduk-soviet-union-and-the]]; [[w.clodfelter-limits-of-air-power]]. See [[cal.1967-04-18.vietnam]].'
    tags: [place:cam-pha]
    short: the *Turkestan*
