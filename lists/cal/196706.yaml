  - id: cal.1967-06-01.vietnam-air-war
    when: June 1
    date: '1967-06-01'
    thread: vietnam-air-war
    c: 'Helms to McNamara, the CIA''s reply to "Bombing Options," memorandum 196752/67, "Alternative Programs for Bombing North Vietnam": "we do not believe that any of the programs presented in your memorandum is capable of reducing the flow of military and other essential goods sufficiently to affect the war in the South or to decrease Hanoi''s determination."'
    n: '[[w.gibbons-u-s-government-and]], IV, 653–54. To check: Helms to McNamara, letter, June 1, 1967, with CIA memorandum 196752/67, "Alternative Programs for Bombing North Vietnam", Warnke Papers, McNaughton Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 654 n.109). See [[cal.1967-05-20.vietnam-air-war-3]]. Names: Helms, McNamara.'
