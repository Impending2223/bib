    n: 'FRUS 1964–68, XIX, doc. [124](https://history.state.gov/historicaldocuments/frus1964-68v19/d124). See [[cal.1967-05-16.middle-east]]. Names: Amit, McNamara, Dayan.'
    tags: [name:amit-meir, name:mcnamara-robert-s, name:dayan-moshe]
  - id: cal.1967-06-01.state-and-city-finance-mn-2
    when: June 1
    date: '1967-06-01'
    thread: state-and-city-finance
    c: 'Minnesota''s first sales tax. The legislature passes H.F. 27 over LeVander''s veto the same day: the Tax Reform and Relief Act of 1967, a tax of 3 percent on retail sales made after July 31, 1967, with relief from the property tax for owners and renters.'
    n: '*Laws of Minnesota for 1967*, Extra Session, ch. 32, art. XIII, § 2, [p. 2179](https://www.revisor.mn.gov/laws/1967/1/Session+Law/Chapter/32/pdf/#page=37); "Passed notwithstanding governor''s veto June 1, 1967," [p. 2210](https://www.revisor.mn.gov/laws/1967/1/Session+Law/Chapter/32/pdf/#page=68). See [[cal.1967-06-01.state-and-city-finance-mn]]. Names: LeVander.'
    tags: [state:mn, name:levander-harold]
  - id: cal.1967-06-01.vietnam-operations
    when: June 1
    date: '1967-06-01'
    thread: vietnam-operations
    c: Cimarron begins, the 3d Marine Division in northern Quảng Trị. The 9th Marines meet the enemy the first evening in a 600-meter bunker complex near the DMZ; contact light by June 6. North Vietnamese troops near Côn Thiên in steel helmets and flak jackets.
    n: '[[w.macv-command-history-1967]], 360.'
