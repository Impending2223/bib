    c: 'The Security Council, unanimous, Resolution 233: a cease-fire. Johnson: "a first step" toward peace. Radio Cairo, from 7:40 a.m.: American aircraft in the Israeli attacks; Egypt closes the Suez Canal. Egypt, Syria, Iraq, Algeria, Sudan and Yemen break relations with the United States, June 6–7 (Check the list).'
