  - id: cal.1967-06-03.democratic-party
    when: June 3
    date: '1967-06-03'
    thread: democratic-party
    also: [robert-kennedy, middle-east]
    c: 'New York, the New York State Democratic dinner. Johnson on the Middle East: in close touch with the leaders of both parties in Congress; all help to the Security Council. Robert Kennedy on Johnson: "He has gained huge popularity, but he has never failed to spend it in the pursuit of his beliefs or in the interest of his country."'
    n: '[[w.johnson-vantage-point]], 111, 296 (Johnson''s words, quoted at 296; Kennedy''s at 111); [[w.palermo-in-his-own-right]], 64–65 (Kennedy''s introduction, given after Johnson had spoken, he having come from a funeral in England; some 1,400 protesting outside the Americana; the words); [[w.shesol-mutual-contempt]], 397 (Kennedy late from a funeral in London, too late to introduce Johnson; drafts by Sorensen and Walinsky: "the height of his aim"; "with our help he will do so again in 1968"). To check: Remarks in New York City at the New York State Democratic Dinner, [APP](https://www.presidency.ucsb.edu/documents/remarks-new-york-city-the-new-york-state-democratic-dinner); Kennedy''s remarks at the Democratic State Committee dinner, Americana Hotel, June 3, 1967, WHFN, LBJ Library (cited by [[w.palermo-in-his-own-right]], 65 n.29); [*New York Times*, June 4, 1967](https://timesmachine.nytimes.com/timesmachine/1967/06/04/issue.html), 1 (cited by [[w.palermo-in-his-own-right]], 64 n.27). See [[cal.1967-06-03.middle-east]]. Names: Johnson, Robert Kennedy. Check: Palermo, 65, from the text of the remarks (n.29), has "or the interest of his country."'
