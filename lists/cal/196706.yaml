  - id: cal.1967-06-02.middle-east-six-day-war
    when: June 2
    date: '1967-06-02'
    place: washington
    thread: middle-east-six-day-war
    also: [europe-and-the-alliance]
    c: 'A high-level British delegation, the foreign and defense office heads with representatives of the prime minister, meets McNamara, Rusk and other senior officials, 11:30 a.m. to 1:15 p.m. Both secretaries: any use of military force needs congressional support, and given the "passionate aversion on the Hill to any unilateral action by the US" there is none. McNamara: the Israelis could delay another two to four weeks and still defeat the Arabs in a week to 10 days; a decision within two weeks; "we would have a real problem if the Soviets came in to save Egypt." No further combined naval force planning.'
    n: 'FRUS 1964–68, XIX, doc. [130](https://history.state.gov/historicaldocuments/frus1964-68v19/d130) (Leddy''s memorandum of conversation; the hour and those present: Trend, Dean, Henderson and Zuckerman for the British; Rusk, Fowler, McNamara, Bruce and Walt Rostow). [[w.drea-mcnamara-clifford-and-the-2011]], 439 (n.49). Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-06-02.middle-east]]. Names: McNamara, Rusk.'
    tags: [name:mcnamara-robert-s, name:rusk-dean, polity:uk]
    time_range:
      - 1967-06-02T15:30Z
      - 1967-06-02T17:15Z
    time_zone: America/New_York
  - id: cal.1967-06-02.middle-east-six-day-war-2
    when: June 2
    date: '1967-06-02'
    thread: middle-east-six-day-war
    c: 'Evron to Walt Rostow: his government will "hold steady for about two weeks," not an "ironclad" figure.'
    n: 'FRUS 1964–68, XIX, doc. [131](https://history.state.gov/historicaldocuments/frus1964-68v19/d131) (Rostow to Johnson, 12:45 p.m.). [[w.drea-mcnamara-clifford-and-the-2011]], 439 (n.48). Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-06-02.middle-east]]. Names: Rostow.'
    tags: [name:rostow-walt-w]
  - id: cal.1967-06-02.middle-east-six-day-war-3
    when: June 2
    date: '1967-06-02'
    thread: middle-east-six-day-war
    c: 'The Joint Chiefs to McNamara, a longer-range scenario for naval action in the Red Sea, in response to ISA''s recommendation of May 28. A balanced American force would take 31 days to assemble; a probe before that would use the warships on hand, with little chance of survival against UAR air and sea attacks. Even the stronger option is unsound: carriers in restricted waters, naval units divided between the Red and Mediterranean seas. The Chiefs want a force off the Straits of Tiran, American and British carriers in the eastern Mediterranean, and merchant ships sent through the Straits one class at a time, non-Israeli, Israeli-owned and non-Israeli-flagged, Israeli-owned and flagged. If the Egyptians challenge it: "discriminating air and naval attacks against selected military targets to full-scale airstrikes against all UAR military targets."'
    n: '[[w.drea-mcnamara-clifford-and-the-2011]], 438. To check: JCSM-310-67 for SecDef, June 2, 1967, NSC History of Middle East Crisis, vol. 3, box 18, NSF, LBJ Library; Poole, *The Joint Chiefs of Staff and National Policy, 1965–1968*, pt. 2, 560 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 438 n.46). See [[cal.1967-06-02.middle-east-six-day-war]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1967-06-02.middle-east-six-day-war-4
    when: June 2
    date: '1967-06-02'
    thread: middle-east-six-day-war
    c: ISA suggests working toward a compromise political settlement rather than a strong maritime declaration or a show of naval force.
    n: '[[w.drea-mcnamara-clifford-and-the-2011]], 439. To check: Hoopes to McNamara, June 2, 1967, FRUS 1964–68, XIX, 261 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 439 n.47). See [[cal.1967-06-02.middle-east-six-day-war-3]]. Names: McNamara. Check: the author; the page has "ISA," its note a memorandum of Hoopes for the Secretary.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1967-06-02.middle-east-six-day-war-5
    when: June 2
    date: '1967-06-02'
    thread: middle-east-six-day-war
    c: Later in the day, the crisis perhaps lengthening, the Joint Chiefs let the Sixth Fleet make port calls for upkeep, subject to curtailment on short notice.
    n: '[[w.drea-mcnamara-clifford-and-the-2011]], 439 (after Evron''s word to Rostow; with it the Pentagon''s command center shortens its morning Middle East report, Drea''s sign of lower tension). See [[cal.1967-06-02.middle-east-six-day-war-2]].'
