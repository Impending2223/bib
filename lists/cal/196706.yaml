    when: June 2
    date: '1967-06-02'
    thread: vietnam-air-war
    c: 'The Joint Chiefs'' reply to McNamara on the bombing options: heavier bombing of the North and the closing of Haiphong. Bombing below the 20th parallel would interdict less, save few planes and pilots, and could signal a decline in American will.'
    n: '[[w.gibbons-u-s-government-and]], IV, 656. See [[cal.1967-05-20.vietnam-air-war-3]]. Names: McNamara.'
    src:
