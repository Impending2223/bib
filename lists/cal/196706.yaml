  - id: cal.1967-06-05.middle-east-six-day-war
    when: June 5
    date: '1967-06-05'
    thread: middle-east-six-day-war
    c: 'Tel Aviv. McPherson, sent on from Saigon to carry Johnson''s concern to Eshkol, with Barbour and Amit: the Egyptian buildup in Sinai, shelling of the Negev; no need to go to the shelter. By McPherson''s account, the general''s calm tells them the Egyptian air force is destroyed. Telegram 3937.'
    n: 'FRUS 1964–68, XIX, doc. [158](https://history.state.gov/historicaldocuments/frus1964-68v19/d158) (its note: telegram 3937 from Tel Aviv, June 5, the meeting of Amit, Barbour and McPherson). [[w.mcpherson-political-education]], 413–15 (the meeting; McPherson''s inference). Check: McPherson dates his arrival June 6 (414). See [[cal.1967-06-05.middle-east]]. Names: McPherson, Johnson, Eshkol, Barbour.'
    src:
