entries:
  - id: cal.1967-06-01.state-and-city-finance-mn
    when: June 1
    date: '1967-06-01'
    thread: state-and-city-finance
    c: 'Minnesota. LeVander vetoes the special session''s tax bill, H.F. 27: the State''s first sales tax, 3 percent, with relief from the property tax for owners and renters. He had asked for a referendum first. His veto of the regular session''s bill, May 20, had stood.'
    n: '[Minn. Legislative Reference Library, vetoes of 1967](https://www.lrl.mn.gov/Vetoes/vetodetails?gov=1); [the veto message, June 1, 1967](https://www.leg.mn.gov/archive/vetoes/1967_sp1veto_HF27.pdf). [MNopedia, "LeVander, Karl Harold Phillip"](https://www.mnhs.org/mnopedia/search/index/person/levander-karl-harold-phillip-1910-1992). To check: [[w.peirce-great-plains-states-of]]. Names: LeVander.'
    tags: [state:mn, name:levander-harold]
  - id: cal.1967-06-01.middle-east
    when: June 1
    date: '1967-06-01'
    thread: middle-east-six-day-war
    c: Amit, head of the Mossad, with McNamara. Dayan Israel's defense minister.
    n: 'FRUS 1964–68, XIX, doc. [124](https://history.state.gov/historicaldocuments/frus1964-68v19/d124). See [[cal.1967-05-16.middle-east]]. Names: Amit, McNamara, Dayan.'
    tags: [name:amit-meir, name:mcnamara-robert-s, name:dayan-moshe]
  - id: cal.1967-06-01.state-and-city-finance-mn-2
    when: June 1
    date: '1967-06-01'
    thread: state-and-city-finance
    c: 'Minnesota''s first sales tax. The legislature passes H.F. 27 over LeVander''s veto the same day: the Tax Reform and Relief Act of 1967, a tax of 3 percent on retail sales made after July 31, 1967, with relief from the property tax for owners and renters.'
    n: '*Laws of Minnesota for 1967*, Extra Session, ch. 32, art. XIII, § 2, [p. 2179](https://www.revisor.mn.gov/laws/1967/1/Session+Law/Chapter/32/pdf/#page=37); "Passed notwithstanding governor''s veto June 1, 1967," [p. 2210](https://www.revisor.mn.gov/laws/1967/1/Session+Law/Chapter/32/pdf/#page=68). See [[cal.1967-06-01.state-and-city-finance-mn]]. Names: LeVander.'
    tags: [state:mn, name:levander-harold]
  - id: cal.1967-06-02.vietnam
    when: June 2–3
    date: '1967-06-02'
    thread: vietnam-air-war
    also: [soviet-union]
    c: 'American aircraft attacking an antiaircraft battery at Cẩm Phả, 50 miles north of Haiphong, hit the Soviet freighter *Turkestan*; one of her crew killed. Moscow: "an act of banditry." Washington, June 3: only military targets attacked, the ship hit by North Vietnamese fire.'
    n: 'FRUS 1964–68, V, doc. [188](https://history.state.gov/historicaldocuments/frus1964-68v05/d188). [[w.current-documents-1967]], 939–941. To check: [[w.gaiduk-soviet-union-and-the]]; [[w.clodfelter-limits-of-air-power]]. See [[cal.1967-04-18.vietnam]].'
    tags: [place:cam-pha]
  - id: cal.1967-06-02.middle-east
    when: June 2
    date: '1967-06-02'
    thread: middle-east-six-day-war
    also: [europe-and-the-alliance]
    c: Wilson at the White House.
    n: 'Remarks of Welcome at the White House to Prime Minister Wilson of the United Kingdom, [1967 Pub. Papers 591](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=659) (June 2, 1967). See [[cal.1967-05-16.middle-east]]. Names: Wilson, Johnson.'
    tags: [name:wilson-harold, name:johnson-lyndon-b]
  - id: cal.1967-06-02.crime-and-hijacking-co
    when: June 2
    date: '1967-06-02'
    thread: crime-and-hijacking
    c: 'Cañon City, Colo. Luis José Monge, convicted of killing his wife and three of their children, executed in the State penitentiary''s gas chamber: the last execution in the United States until Jan. 1977.'
    n: '*Monge v. People*, [158 Colo. 224](https://static.case.law/colo/158/case-pdfs/0224-01.pdf) (1965), the death sentence affirmed. [Wikipedia, "Luis Monge"](https://en.wikipedia.org/wiki/Luis_Monge). To check: [[w.mandery-wild-justice]]. See [[cal.1967-04-12.crime-and-hijacking-ca]]. Names: Monge.'
    tags: [state:co, name:monge-luis-jose]
  - id: cal.1967-06-03.middle-east
    when: June 3
    date: '1967-06-03'
    thread: middle-east-six-day-war
    c: Johnson to Eshkol on the maritime plan.
    n: 'FRUS 1964–68, XIX, doc. [139](https://history.state.gov/historicaldocuments/frus1964-68v19/d139). See [[cal.1967-05-16.middle-east]]. Names: Eshkol, Johnson.'
    tags: [name:eshkol-levi, name:johnson-lyndon-b]
  - id: cal.1967-06-04.middle-east
    when: June 4
    date: '1967-06-04'
    thread: middle-east-six-day-war
    c: Israel's cabinet decides for war.
    n: FRUS 1964–68, XIX, doc. [146](https://history.state.gov/historicaldocuments/frus1964-68v19/d146). See [[cal.1967-05-16.middle-east]].
  - id: cal.1967-06-04.opinion
    when: June 4
    date: '1967-06-04'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Apr. 19–24: would vote for a well-qualified man for President whom one''s party nominated, if he were a Catholic, 89 percent; a Jew, 82; a Negro, 54, no 40 (South 32 yes). A qualified woman: yes 57, no 39.'
    n: '[[w.gallup-poll]], III, 2065–66.'
  - id: cal.1967-06-05.middle-east
    when: June 5
    date: '1967-06-05'
    thread: middle-east-six-day-war
    also: [soviet-union]
    c: 'Israel''s aircraft strike Egypt''s air bases in the morning; war with Egypt, Jordan and Syria. 7:57 a.m., McNamara to Johnson: Kosygin on the hot line, its first use for a message of substance; Johnson replies. Twenty messages by June 10. State''s spokesman, McCloskey: the United States "neutral in thought, word, and deed."'
    n: 'FRUS 1964–68, XIX, docs. [150](https://history.state.gov/historicaldocuments/frus1964-68v19/d150), [152](https://history.state.gov/historicaldocuments/frus1964-68v19/d152), [155](https://history.state.gov/historicaldocuments/frus1964-68v19/d155), [156](https://history.state.gov/historicaldocuments/frus1964-68v19/d156), [157](https://history.state.gov/historicaldocuments/frus1964-68v19/d157), [159](https://history.state.gov/historicaldocuments/frus1964-68v19/d159). [Johnson and McNamara, 7:57 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-june-5-1967), Conversation WH6706-01-11903 (Miller Center). [[w.drea-mcnamara-clifford-and-the-2011]], 442, 457. To check: [[w.oren-six-days-of-war]]; [[w.quandt-lyndon-johnson-and-the]]; [[w.quandt-peace-process]]; [[w.six-day-war]]; [[w.segev-1967]]; [[w.shlaim-iron-wall]]; [[w.shlaim-lion-of-jordan]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.klinghoffer-vietnam-jews-and-the]]; [[w.johnson-vantage-point]]; [[w.rusk-as-i-saw-it-1990]]; [[w.dallek-flawed-giant]]. See [[cal.1967-05-16.middle-east]]; [[cal.1963-08-30.testing]]. Names: McNamara, Kosygin, McCloskey, Johnson.'
    tags: [name:mcnamara-robert-s, name:kosygin-aleksei, name:mccloskey-robert-j, name:johnson-lyndon-b, name:rusk-dean, name:rostow-walt-w]
  - id: cal.1967-06-05.states-and-cities-nm
    when: June 5
    date: '1967-06-05'
    thread: states-and-cities
    c: Tierra Amarilla, N.M. Tijerina's Alianza raids the Rio Arriba County courthouse to free members arrested June 3 at Coyote, N.M., and arrest the district attorney; a jailer shot, a deputy hurt, two men taken. Lieutenant Governor Francis calls out the Guard; the largest manhunt in the State's history. Tijerina taken days later.
    n: '[Wikipedia, "Reies Tijerina"](https://en.wikipedia.org/wiki/Reies_Tijerina); Check: the State''s charges (54 counts) and the Guard''s order. To check: [[w.nabokov-tijerina-and-the-courthouse]]; [[w.gardner-grito]]; [[w.peirce-mountain-states-of-america]]. Names: Tijerina, Francis. Check: whether Cargo was out of the State.'
    tags: [state:nm, name:tijerina-reies-lopez, name:francis-e-lee]
  - id: cal.1967-06-06.middle-east
    when: June 6
    date: '1967-06-06'
    thread: middle-east-six-day-war
    c: 'The Security Council, unanimous, Resolution 233: a cease-fire. Johnson: "a first step" toward peace. Radio Cairo, from 7:40 a.m.: American aircraft in the Israeli attacks; Egypt closes the Suez Canal. Iraq cuts off oil to the United States and Britain; Kuwait and others follow. Egypt, Syria, Iraq, Algeria, Sudan and Yemen break relations with the United States, June 6–7 (Check the list).'
    n: 'Security Council Resolution [233 (1967)](https://undocs.org/S/RES/233(1967)). Statement by the President on the United Nations Security Council''s Cease-Fire Vote in the Middle East Situation, [1967 Pub. Papers 598](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=666) (June 6, 1967). FRUS 1964–68, XXXIV, docs. [232](https://history.state.gov/historicaldocuments/frus1964-68v34/d232), [233](https://history.state.gov/historicaldocuments/frus1964-68v34/d233). [[w.drea-mcnamara-clifford-and-the-2011]], 443–444. To check: [[w.yergin-prize]]. See [[cal.1967-06-05.middle-east]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:nasser-gamal-abdel]
  - id: cal.1967-06-06.oil
    when: June 6
    date: '1967-06-06'
    thread: oil
    also: [middle-east-six-day-war]
    c: 'Arab oil embargo. Iraq stops oil to the United States and Britain for "military assistance to the enemy," on Cairo''s charge that their aircraft joined Israel''s attack. Kuwait moves to stop shipments to both. The Arab oil ministers at Baghdad, June 4–5: Arab oil denied to any country taking part in aggression on an Arab state, the Gulf of Aqaba named.'
    n: 'FRUS 1964–68, XXXIV, docs. [232](https://history.state.gov/historicaldocuments/frus1964-68v34/d232) (Baghdad, June 6: the resolutions), [233](https://history.state.gov/historicaldocuments/frus1964-68v34/d233) (editorial note). To check: [[w.yergin-prize]]; [[w.vietor-energy-policy-in-america]]; [[w.garavini-rise-and-fall-of]].'
  - id: cal.1967-06-07.middle-east
    when: June 7
    date: '1967-06-07'
    thread: middle-east-six-day-war
    c: Israel takes the Old City of Jerusalem; the Security Council, Resolution 234, a cease-fire by 2000 GMT; Jordan accepts. Johnson names a Special Committee of the National Security Council for the crisis, McGeorge Bundy its executive secretary.
    n: 'Security Council Resolution [234 (1967)](https://undocs.org/S/RES/234(1967)). Statement by the President Upon Establishing the National Security Council Special Committee on the Middle East, [1967 Pub. Papers 599](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=667) (June 7, 1967). FRUS 1964–68, XIX, doc. [197](https://history.state.gov/historicaldocuments/frus1964-68v19/d197). [[w.drea-mcnamara-clifford-and-the-2011]], 444–445. To check: [[w.bird-color-of-truth]]. See [[cal.1967-06-05.middle-east]]. Check: Drea, 444, dates Johnson''s decision to create the Special Committee June 6, its first meeting June 7 (445). Names: McGeorge Bundy, Johnson.'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:hussein-ibn-talal]
  - id: cal.1967-06-07.economy
    when: June 7
    date: '1967-06-07'
    thread: economy-debt-limit
    also: [congress]
    c: The debt limit. The House defeats H.R. 10328, $365 billion, [199–209](https://voteview.com/rollcall/RH0900069).
    n: 'Check: the Record''s page. To check: [[w.morgan-deficit-government]]. See [[cal.1967-02-08.economy]].'
  - id: cal.1967-06-07.railroads
    when: June 7
    date: '1967-06-07'
    thread: railroads
    c: The shop crafts' dispute. The Senate passes S.J. Res. 81, the Special Board, [70–15](https://voteview.com/rollcall/RS0900101); amendments for seizure of the railroads lost, [23–59](https://voteview.com/rollcall/RS0900099) and [22–64](https://voteview.com/rollcall/RS0900100). No vote in the House in June (Check how the period was carried to July 16).
    n: 'Check: the Record''s page. See [[cal.1967-05-04.railroads]].'
  - id: cal.1967-06-07.opinion
    when: June 7
    date: '1967-06-07'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Apr. 19–24: can identify Wallace, 72 percent. Of them, describing him: favorable comments 24, unfavorable 58. South 41 and 39; West 11 and 73.'
    n: '[[w.gallup-poll]], III, 2066–67. Names: Wallace.'
    tags: [name:wallace-george-c]
  - id: cal.1967-06-08.middle-east
    when: June 8–10
    date: '1967-06-08'
    thread: middle-east-six-day-war
    also: [defense, soviet-union]
    c: 'The *Liberty*, a Navy intelligence ship, some 13 miles off the Sinai coast northwest of El Arish, attacked by Israeli jet aircraft and three torpedo boats, about 8 a.m. Eastern time: 34 killed, more than 170 wounded. The Sixth Fleet launches aircraft to defend her; Johnson tells Kosygin over the hot line why. Israel apologizes the same day: a mistake. Rusk''s note to Harman, June 10: the attack "quite literally incomprehensible," "an act of military recklessness reflecting wanton disregard for human life."'
    n: 'FRUS 1964–68, XIX, docs. [204](https://history.state.gov/historicaldocuments/frus1964-68v19/d204), [210](https://history.state.gov/historicaldocuments/frus1964-68v19/d210), [212](https://history.state.gov/historicaldocuments/frus1964-68v19/d212), [219](https://history.state.gov/historicaldocuments/frus1964-68v19/d219), [256](https://history.state.gov/historicaldocuments/frus1964-68v19/d256). [[w.drea-mcnamara-clifford-and-the-2011]], 446–447. To check: [[w.ennes-assault-on-the-liberty]]; [[w.cristol-liberty-incident]]; [[w.oren-six-days-of-war]]. See [[cal.1967-06-05.middle-east]]. Names: Johnson, Kosygin, Rusk, Harman.'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:rusk-dean, name:harman-avraham]
  - id: cal.1967-06-08.oil
    when: June 8
    date: '1967-06-08'
    thread: oil
    c: 'Rusk to Udall: Algeria, Kuwait and Bahrain bar oil exports to the United States and Britain; Iraq has ordered the Iraq Petroleum Company to stop; Tapline and the Suez Canal closed; Libya has ordered the companies to cease. Emergency procedures asked. Jersey Standard to Assistant Secretary Moore the same day: the Foreign Petroleum Supply Committee the companies'' only cover under the antitrust laws.'
    n: 'FRUS 1964–68, XXXIV, docs. [235](https://history.state.gov/historicaldocuments/frus1964-68v34/d235) (Rusk), [234](https://history.state.gov/historicaldocuments/frus1964-68v34/d234) (Finlay). See [[cal.1967-06-06.oil]]. Names: Rusk, Udall, Moore.'
    tags: [name:rusk-dean, name:udall-stewart-l, name:moore-j-cordell]
  - id: cal.1967-06-09.middle-east
    when: June 9–11
    date: '1967-06-09'
    thread: middle-east-six-day-war
    also: [soviet-union]
    c: 'Egypt accepts the cease-fire the night of June 8. June 9, Israel attacks Syria on the Golan Heights; Nasser resigns, and withdraws the resignation June 10. June 10, 8:48 a.m., Kosygin on the hot line: unless the fighting stops "in the next few hours," "necessary actions will be taken, including military." Johnson, with Thompson, Helms and McNamara, turns the Sixth Fleet east toward the Syrian coast. The Soviet Union breaks relations with Israel. Israel and Syria cease fire the evening of June 10; Resolution 236, June 11.'
    n: 'FRUS 1964–68, XIX, docs. [243](https://history.state.gov/historicaldocuments/frus1964-68v19/d243), [244](https://history.state.gov/historicaldocuments/frus1964-68v19/d244), [246](https://history.state.gov/historicaldocuments/frus1964-68v19/d246), [247](https://history.state.gov/historicaldocuments/frus1964-68v19/d247), [252](https://history.state.gov/historicaldocuments/frus1964-68v19/d252), [255](https://history.state.gov/historicaldocuments/frus1964-68v19/d255). Made public: Helms''s account of the morning of June 10, in Saunders''s memorandum of Oct. 22, 1968, FRUS 1964–68, XIX (2004). See [[cal.1967-06-05.middle-east]]. Names: Nasser, Kosygin, Thompson, Helms, McNamara, Johnson.'
    tags: [name:nasser-gamal-abdel, name:kosygin-aleksei, name:thompson-llewellyn-e, name:helms-richard, name:mcnamara-robert-s, name:johnson-lyndon-b, name:saunders-harold-h]
  - id: cal.1967-06-09.desegregation-schools-boston
    when: June 9
    date: '1967-06-09'
    thread: desegregation-schools
    also: [states-and-cities]
    c: 'Massachusetts. The Supreme Judicial Court upholds the Racial Imbalance Act against the Boston School Committee: not vague; the legislature''s finding of an emergency not open to review; no denial of equal protection, no pupil shown excluded from a school for his race.'
    n: '*School Committee of Boston v. Board of Education*, [352 Mass. 693](https://static.case.law/mass/352/case-pdfs/0693-01.pdf) (1967). To check: [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]. See [[cal.1966-04.desegregation-schools-boston]].'
    tags: [state:ma, city:boston]
  - id: cal.1967-06-10.oil
    when: June 10
    date: '1967-06-10'
    thread: oil
    c: 'Interior, Assistant Secretary J. Cordell Moore: "a petroleum emergency exists which threatens the broad security interests of the United States." State, Defense and the Office of Emergency Planning concur.'
    n: 'FRUS 1964–68, XXXIV, doc. [235](https://history.state.gov/historicaldocuments/frus1964-68v34/d235), n. 3 (circular telegram 210177, June 11). See [[cal.1967-06-06.oil]]. Names: Moore.'
    tags: [name:moore-j-cordell]
  - id: cal.1967-06-11.civil-disorders
    when: June 11
    date: '1967-06-11'
    thread: civil-disorders
    c: Tampa. Martin Chambers, 19, a suspect in a burglary, shot in the back by a policeman as he runs; he dies. Rioting in the Central Avenue district that night and the next two, to June 13. Kirk flies in, June 12; the National Guard called the same day, some 500 men. A patrol of young Negro men, the "White Hats," in the streets. Over 100 arrested.
    n: '[[w.report-of-the-national]], [42–47](https://archive.org/details/reportofnation00unit/page/n70/mode/1up) (Bantam ed.). To check: [[w.mclaughlin-long-hot-summer-of]]. Names: Chambers, Kirk.'
    tags: [name:chambers-martin, name:kirk-claude-r-jr, state:fl, city:tampa]
  - id: cal.1967-06-11.opinion
    when: June 11
    date: '1967-06-11'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 2–7: Romney 48 percent, Johnson 45, undecided 7; South, Romney 48, Johnson 38. May 11–16, four candidates: Johnson 41, Romney 39, Wallace for States'' Rights 11, King for a peace party 2, undecided 7. South: Johnson 30, Romney 28, Wallace 27, King 3.'
    n: '[[w.gallup-poll]], III, 2067. Names: Romney, Johnson, Wallace, King.'
    tags: [name:romney-george-w, name:johnson-lyndon-b, name:wallace-george-c, name:king-martin-luther-jr]
  - id: cal.1967-06-12.civil-disorders
    when: June 12
    date: '1967-06-12'
    thread: civil-disorders
    c: Cincinnati, Avondale. A man protesting the conviction of his cousin, Posteal Laskey, as the "Cincinnati Strangler" arrested for loitering; a crowd, fires, looting, from the night of June 12 to June 15. The Ohio National Guard sent in (Check the day). One killed, over 400 arrested (Check the figures).
    n: '[[w.report-of-the-national]], [47–52](https://archive.org/details/reportofnation00unit/page/n75/mode/1up) (Bantam ed.). To check: [[w.mclaughlin-long-hot-summer-of]]. See [[cal.1967-06-11.civil-disorders]].'
    tags: [state:oh, city:cincinnati]
  - id: cal.1967-06-12.court
    when: June 12
    date: '1967-06-12'
    thread: court
    c: '*Loving v. Virginia*, [388 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388001/usrep388001.pdf): Virginia''s laws against marriage between white and colored persons, under which a couple married in Washington in 1958 were sentenced to a year in jail, suspended on condition that they leave the State for 25 years, violate the Equal Protection and Due Process Clauses. Sixteen States had such laws. Warren for a unanimous Court; Stewart concurring.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.wallenstein-race-sex-and-the]]; [[w.powe-warren-court-and-american]]; [[w.schwartz-super-chief]]. Names: Warren.'
    tags: [name:warren-earl, state:va]
  - id: cal.1967-06-12.court-2
    when: June 12
    date: '1967-06-12'
    thread: court
    also: [king, alabama]
    c: '*Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf): the contempt convictions of King and seven other ministers for marching on Good Friday and Easter, 1963, against a state court''s injunction, affirmed: five days in jail and $50 fines. They should have moved to dissolve the injunction, not disobeyed it. Stewart for the Court, 5–4; Warren, Douglas, Brennan and Fortas dissenting.'
    n: 'To check: [[w.westin-trial-of-martin-luther]]; [[w.garrow-bearing-the-cross]]. See [[cal.1963-04-12.alabama]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr, city:birmingham]
  - id: cal.1967-06-12.court-3
    when: June 12
    date: '1967-06-12'
    thread: court
    also: [crime-and-hijacking]
    c: '*Berger v. New York*, [388 U.S. 41](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388041/usrep388041.pdf): New York''s statute authorizing eavesdropping by court order violates the Fourth Amendment, its warrants too broad; a bribery conviction from bugs in a lawyer''s office reversed. Clark for the Court; Black, Harlan and White dissenting.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1967-06-12.court-4
    when: June 12
    date: '1967-06-12'
    thread: court
    also: [press-and-broadcasting]
    c: '*Curtis Publishing Co. v. Butts*, [388 U.S. 130](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388130/usrep388130.pdf), with *Associated Press v. Walker*: libel of public figures. Butts''s judgment against the *Saturday Evening Post*, for an article that he had fixed a football game, affirmed; Edwin Walker''s against the Associated Press, for its report that he led a charge on the marshals at Oxford, Miss., in 1962, reversed. Harlan announces the judgments.'
    n: 'To check: [[w.powe-warren-court-and-american]]. See [[cal.1964-03-09.court]]; [[cal.1962-10-01.mississippi]]. Names: Walker.'
    tags: [name:walker-edwin-a]
  - id: cal.1967-06-12.vietnam
    when: June 12
    date: '1967-06-12'
    thread: vietnam-air-war
    c: 'McNamara''s draft memorandum on the bombing of the North, with Vance: against the Joint Chiefs'' program, heavy attacks on the Hanoi-Haiphong base and mining the ports (Alternative A); for Alternative B, the attacks generally confined to the neck of North Vietnam south of 20°.'
    n: 'FRUS 1964–68, V, doc. [194](https://history.state.gov/historicaldocuments/frus1964-68v05/d194). Made public: [[w.pentagon-papers]], IV, 189–191 (1971) (Check the volume). [[w.drea-mcnamara-clifford-and-the-2011]], 211. See [[cal.1967-05-19.vietnam]]. Names: McNamara, Vance.'
    tags: [name:mcnamara-robert-s, name:vance-cyrus]
  - id: cal.1967-06-12.opinion
    when: June 12
    date: '1967-06-12'
    thread: opinion
    also: [middle-east-six-day-war]
    c: 'Gallup, June 2–7: aware of the troubles between Israel and the Arab nations and knew something of them, 59 percent. Of them: Johnson''s handling of the situation, approve 47, disapprove 14, no opinion 39. The United States to stay out 41; support Israel with aid 16; negotiate 14; work through the UN 11; send troops for Israel 5. Sympathies with Israel 55, with the Arab states 4. Britain, special survey: work with other countries to stop the fighting 41; leave them to fight it out 30.'
    n: '[[w.gallup-poll]], III, 2067–68. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-06-13.court
    when: June 13
    date: '1967-06-13'
    thread: court
    c: 'Johnson, in the Rose Garden, noon: Thurgood Marshall, Solicitor General, nominated Associate Justice, for Tom Clark, who retires with the term, his son Ramsey Clark Attorney General since March. "The right thing to do, the right time to do it, the right man and the right place." The first Negro named to the Court. Johnson had told Ramsey Clark by telephone at 7:59 a.m.'
    n: 'Remarks to the Press Announcing the Nomination of Thurgood Marshall as Associate Justice of the Supreme Court, [1967 Pub. Papers 611](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=679) (June 13, 1967); The President''s News Conference, [1967 Pub. Papers 612](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=680) (June 13, 1967). [Johnson and Ramsey Clark, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ramsey-clark-and-office-conversation-june-13), Conversation WH6706-01-11905-11906 (Miller Center). To check: [[w.williams-thurgood-marshall]]; [[w.tushnet-making-constitutional-law]]; [[w.ball-defiant-life]]; [[w.haygood-showdown]]; [[w.kalman-long-reach-of-the-2017]]; [[w.dallek-flawed-giant]]. See [[cal.1967-02-28.court]]. Names: Marshall, Tom Clark, Ramsey Clark, Johnson.'
    tags: [name:marshall-thurgood, name:clark-tom-c, name:clark-ramsey, name:johnson-lyndon-b]
  - id: cal.1967-06-13.economy
    when: June 13
    date: '1967-06-13'
    thread: economy
    also: [program]
    c: 'H.R. 6950 signed, [81 Stat. 57](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg57-2.pdf): the 7 percent investment credit and accelerated depreciation on buildings restored, the suspension ended as of Mar. 9 instead of Dec. 31. Long''s Presidential Election Campaign Fund: no money to be paid out of it until Congress adopts guidelines by law. In the Senate, May 9: the fund to lapse Sept. 15 unless Congress acts, tied [48–48](https://voteview.com/rollcall/RS0900082) and lost, Humphrey voting nay; the guidelines amendment carried, [93–4](https://voteview.com/rollcall/RS0900083); the bill passed, [93–1](https://voteview.com/rollcall/RS0900084). May 2, the House''s repeal of the fund had stood, [46–52](https://voteview.com/rollcall/RS0900078).'
    n: '[[w.zelizer-taxing-america]], 260 (the credit restored). To check: [[w.mann-legacy-to-power]]. See [[cal.1966-09-08.economy]]; [[cal.1966-10-12.program]]. Names: Long, Humphrey.'
    tags: [name:long-russell-b, name:humphrey-hubert-h, name:johnson-lyndon-b]
  - id: cal.1967-06-13.congress
    when: June 13
    date: '1967-06-13'
    thread: congress-dodd
    c: Dodd. The Senate takes up S. Res. 112, the Select Committee on Standards and Conduct's resolution to censure him, Stennis its chairman.
    n: '[113 Cong. Rec. 15663](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt12/pdf/GPO-CRECB-1967-pt12-2-2.pdf#page=1). To check: [[w.boyd-above-the-law]]; [[w.pearson-case-against-congress]]. See [[cal.1967-04-27.congress]]. Names: Dodd, Stennis.'
    tags: [name:dodd-thomas-j, name:stennis-john-c, state:ct]
  - id: cal.1967-06-15.health-ca
    when: June 15
    date: '1967-06-15'
    thread: health
    also: [women]
    c: 'Reagan signs Beilenson''s Therapeutic Abortion Act, [Cal. Stats. 1967, ch. 327](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1967/67Vol1_Chapters.pdf#page=1521): abortion in an accredited hospital, approved in advance by a committee of its medical staff, where continuing the pregnancy would "gravely impair the physical or mental health of the mother," or after rape or incest, the district attorney notified.'
    n: 'Statute, 1521–1523. To check: [[w.luker-abortion-and-the-politics]]; [[w.garrow-liberty-and-sexuality]]; [[w.reagan-when-abortion-was-a]]; [[w.cannon-governor-reagan]]. See [[cal.1967-04-25.health-co]]. Names: Reagan, Beilenson.'
    tags: [state:ca, name:reagan-ronald, name:beilenson-anthony-c]
  - id: cal.1967-06-17.testing
    when: June 17
    date: '1967-06-17'
    thread: testing
    also: [china]
    c: China explodes its first hydrogen bomb over Lop Nur, Sinkiang, dropped from an aircraft, some 3 megatons; 32 months after its first atomic test. Check the yield.
    n: '[*Peking Review*, no. 26 (1967)](https://www.marxists.org/subject/china/peking-review/1967/PR1967-26.pdf) (the communiqué). [[w.poole-joint-chiefs-of-staff-2012]], 37; [[w.drea-mcnamara-clifford-and-the-2011]], 366. To check: [[w.lewis-china-builds-the-bomb]]. See [[cal.1964-10-16.testing]]; [[cal.1966-05-17.testing]].'
  - id: cal.1967-06-17.civil-disorders
    when: June 17–20
    date: '1967-06-17'
    thread: civil-disorders
    also: [georgia]
    c: 'Atlanta, Dixie Hills. A fight at a shopping center, June 17; June 18, Carmichael speaks to a crowd of some 1,000; rocks and bottles, nine policemen hurt. June 20, after a meeting, police fire into a crowd: one killed. Ivan Allen to the neighborhood; Rap Brown there too.'
    n: '[[w.report-of-the-national]], [52–56](https://archive.org/details/reportofnation00unit/page/n80/mode/1up) (Bantam ed.). To check: [[w.allen-mayor]]; [[w.stone-regime-politics]]. See [[cal.1967-06-11.civil-disorders]]. Names: Carmichael, Allen, Brown.'
    tags: [name:carmichael-stokely, name:allen-ivan-jr, name:brown-h-rap, city:atlanta]
  - id: cal.1967-06-18.opinion
    when: June 18
    date: '1967-06-18'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 11–16: have a clear idea what the war is about, what we are fighting for: yes 48 percent, no 48. How it will end: all-out victory 15, a compromise settlement 55, defeat 5. June 2–7, after a peace and withdrawal, a South Vietnamese government strong enough to withstand Communist pressures: yes 25, no 52.'
    n: '[[w.gallup-poll]], III, 2068–69.'
  - id: cal.1967-06-19.middle-east
    when: June 19
    date: '1967-06-19'
    thread: middle-east-six-day-war-aftermath
    also: [soviet-union]
    c: 'Johnson to the State Department''s conference for educators: "five great principles of peace" for the Middle East: every nation''s right to live; justice for the refugees; innocent maritime passage; limits on the arms race; political independence and territorial integrity for all. A return to the lines of June 4 "not a prescription for peace, but for renewed hostilities"; "certainly troops must be withdrawn." The same day Kosygin, at the General Assembly''s emergency special session (opened June 17): Israel to withdraw and pay for the damage, and to be condemned.'
    n: 'Address at the State Department''s Foreign Policy Conference for Educators, [1967 Pub. Papers 630](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=698) (June 19, 1967). FRUS 1964–68, XIX, docs. [309](https://history.state.gov/historicaldocuments/frus1964-68v19/d309), [313](https://history.state.gov/historicaldocuments/frus1964-68v19/d313). See [[cal.1967-06-05.middle-east]]. Names: Kosygin, Johnson.'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:goldberg-arthur-j]
  - id: cal.1967-06-19.desegregation-schools-dc
    when: June 19
    date: '1967-06-19'
    thread: desegregation-schools
    also: [states-and-cities]
    c: 'Washington. Judge Wright, sitting in the District Court: the track system, the neighborhood school zones and the assignment of teachers deny Negro and poor children equal educational opportunity. The tracks abolished; optional zones ended; busing to relieve crowding; faculty to be integrated; plans due Oct. 2. The Board of Education votes 6–2 not to appeal and orders Superintendent Hansen not to; Hansen resigns and appeals (Check the dates).'
    n: '*Hobson v. Hansen*, [269 F. Supp. 401](https://static.case.law/f-supp/269/case-pdfs/0401-01.pdf) (D.D.C. 1967). [Wikipedia, "Hobson v. Hansen"](https://en.wikipedia.org/wiki/Hobson_v._Hansen). To check: [[w.asch-chocolate-city]]; [[w.jaffe-dream-city]]. Names: Wright, Hansen.'
    tags: [state:dc, city:washington, name:wright-j-skelly, name:hansen-carl-f]
  - id: cal.1967-06-20.draft
    when: June 20
    date: '1967-06-20'
    thread: draft
    also: [war-opposition]
    c: Houston. Muhammad Ali convicted in federal court of refusing induction, after a jury's brief deliberation; Judge Ingraham sentences him to five years and $10,000, the maximum. Free on bail pending appeal.
    n: '*Clay v. United States*, [397 F.2d 901](https://static.case.law/f2d/397/case-pdfs/0901-01.pdf) (5th Cir. 1968), the appeal. To check: [[w.remnick-king-of-the-world]]. See [[cal.1967-04-28.draft]]. Names: Ali, Ingraham.'
    tags: [name:ali-muhammad, state:tx, city:houston, name:ingraham-joe-mcdonald]
  - id: cal.1967-06-20.war-opposition
    when: June 20
    date: '1967-06-20'
    thread: war-opposition
    c: 'The House passes H.R. 10480, [387–16](https://voteview.com/rollcall/RH0900080): a year in prison or $1,000 for publicly mutilating, defacing, defiling, burning or trampling the flag. Flags had been burned at the Spring Mobilization in New York, Apr. 15.'
    n: 'To check: [[w.goldstein-saving-old-glory]].'
  - id: cal.1967-06-20.vietnam-air-war
    when: June 20
    date: '1967-06-20'
    thread: vietnam-air-war
    also: [soviet-union]
    c: An American note to Moscow acknowledges that a third flight of American aircraft struck the *Turkestan*.
    n: '[[w.current-documents-1967]], 941 (Check the page). See [[cal.1967-06-02.vietnam]].'
  - id: cal.1967-06-21.economy-debt-limit
    when: June 21
    date: '1967-06-21'
    thread: economy-debt-limit
    also: [congress]
    c: 'The House passes H.R. 10867, [217–196](https://voteview.com/rollcall/RH0900082): a permanent debt limit of $358 billion, $7 billion more from each July 1, and the participation certificates sold from July 1 counted in; recommittal blocked, [191–223](https://voteview.com/rollcall/RH0900081).'
    n: 'Check: the Record''s page. See [[cal.1967-06-07.economy]].'
  - id: cal.1967-06-22.congress-dodd
    when: June 22
    date: '1967-06-22'
    thread: congress-dodd
    c: Dodd. "Reprimand" for "censure" lost, [9–87](https://voteview.com/rollcall/RS0900108).
    n: 'Check: the Record''s page. See [[cal.1967-06-13.congress]]. Names: Dodd.'
    tags: [name:dodd-thomas-j, state:ct]
  - id: cal.1967-06-23.soviet-union
    when: June 23–25
    date: '1967-06-23'
    thread: soviet-union
    also: [middle-east-six-day-war-aftermath, vietnam, testing]
    c: 'Glassboro, N.J., Hollybush, the house of the president of Glassboro State College: Johnson and Kosygin, June 23 and 25, their only meeting. The Middle East: Kosygin, Israel''s troops back to the armistice lines, the Gulf of Aqaba to the International Court; "unless you do this there will be a war." Johnson: talks on ABMs and ICBMs; when and where might McNamara meet Soviet representatives? Kosygin: offensive weapons too. June 25, Kosygin: Phạm Văn Đồng''s answer, received at lunch: stop the bombing and Hanoi will go to the conference table at once. Johnson gives him a message for Hanoi: the bombing might stop, with immediate discussions after. Rusk with Gromyko, June 23, on nonproliferation. Johnson to Eisenhower, June 25, by telephone.'
    n: 'Remarks Following the President''s First Meeting With Chairman Kosygin at Glassboro, New Jersey, [1967 Pub. Papers 644](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=712) (June 23, 1967); Remarks Following the President''s Second Meeting With Chairman Kosygin at Glassboro, New Jersey, [1967 Pub. Papers 650](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=718) (June 25, 1967). FRUS 1964–68, XIV, docs. [228](https://history.state.gov/historicaldocuments/frus1964-68v14/d228)–[237](https://history.state.gov/historicaldocuments/frus1964-68v14/d237); XI, doc. [198](https://history.state.gov/historicaldocuments/frus1964-68v11/d198); V, doc. [217](https://history.state.gov/historicaldocuments/frus1964-68v05/d217). [Johnson and Eisenhower](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-june-26-1967), Conversation WH6706-02-11914 (Miller Center). [President''s Daily Diary, June 23, 1967](https://catalog.archives.gov/id/192469), images 4, 6, 7, 14, 15; [June 25](https://catalog.archives.gov/id/192471), images 9, 10, 11, 15 (LBJ Library; National Archives Catalog). Made public: the memoranda of conversation, FRUS 1964–68, XIV (2001). [[w.drea-mcnamara-clifford-and-the-2011]], 366–367; [[w.poole-joint-chiefs-of-staff-2012]], 37; [[w.nguyen-hanois-war]], 96 (Phạm Văn Đồng''s word through Kosygin). To check: [[w.johnson-vantage-point]]; [[w.dobrynin-in-confidence]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.zubok-failed-empire]]; [[w.dallek-flawed-giant]]. See [[cal.1966-10-10.soviet-union]]. Names: Johnson, Kosygin, McNamara, Phạm Văn Đồng, Rusk, Gromyko, Eisenhower.'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:mcnamara-robert-s, name:pham-van-dong, name:rusk-dean, name:gromyko-andrei, name:eisenhower-dwight-d]
  - id: cal.1967-06-23.congress-dodd
    when: June 23
    date: '1967-06-23'
    thread: congress-dodd
    c: Dodd censured, [92–5](https://voteview.com/rollcall/RS0900112), for using money raised at testimonial dinners and in his campaigns for himself; the count on billing the Senate and a private body for the same trips struck, [51–45](https://voteview.com/rollcall/RS0900111).
    n: 'Check: the Record''s page. See [[cal.1967-06-13.congress]]. Names: Dodd.'
    tags: [name:dodd-thomas-j, state:ct]
  - id: cal.1967-06-23.war-opposition
    when: June 23
    date: '1967-06-23'
    thread: war-opposition
    c: Los Angeles, Century City. Some 10,000 march on the Century Plaza Hotel, where Johnson speaks at a President's Club dinner. Ordered to disperse, many sit down; the police clear the street with clubs. Arrests (Check the number).
    n: 'Remarks at a President''s Club Dinner in Los Angeles, [1967 Pub. Papers 645](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=713) (June 23, 1967). [President''s Daily Diary, June 23, 1967](https://catalog.archives.gov/id/192469), images 22, 23 (LBJ Library; National Archives Catalog). To check: [[w.davis-set-the-night-on]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:ca, city:los-angeles]
  - id: cal.1967-06-25.opinion
    when: June 25
    date: '1967-06-25'
    thread: opinion
    also: [congress]
    c: 'Gallup, May 11–16: a law limiting the total a candidate''s campaign may spend: yes 73 percent, no 16. A Government pamphlet on each candidate for Congress, mailed free to every household in the district: good idea 57, poor idea 32.'
    n: '[[w.gallup-poll]], III, 2070.'
  - id: cal.1967-06-26.civil-disorders
    when: June 26–July 1
    date: '1967-06-26'
    thread: civil-disorders
    c: Buffalo, the East Side, William Street and Jefferson Avenue. Windows broken June 27; some 200 police with riot gear that night, 400 the next day; fires, looting, dozens hurt, many by gunshot. June 30, Jackie Robinson, Rockefeller's special assistant, with Sedita.
    n: 'To check: [[w.mclaughlin-long-hot-summer-of]]; [[w.goldman-high-hopes]]. See [[cal.1967-06-11.civil-disorders]]. Names: Jackie Robinson, Rockefeller, Sedita.'
    tags: [name:robinson-jackie, name:rockefeller-nelson, name:sedita-frank-a, state:ny, city:buffalo]
  - id: cal.1967-06-27.school-aid
    when: June 27–29
    date: '1967-06-27'
    thread: school-aid
    c: 'The Teacher Corps extended and enlarged, the Higher Education Act''s Title V rewritten. House, June 27: recommittal to strike the Teacher Corps lost, [146–257](https://voteview.com/rollcall/RH0900085); passed, [312–88](https://voteview.com/rollcall/RH0900086). Signed June 29, [81 Stat. 81](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg81-3.pdf).'
    n: 'Statement by the President Upon Signing Bill Extending and Enlarging the Teacher Corps, [1967 Pub. Papers 668](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=736) (June 29, 1967). To check: [[w.graham-uncertain-triumph]]. See [[cal.1965-11-08.school-aid]]; [[cal.1966-05-13.cities-and-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-06-27.economy-debt-limit
    when: June 27
    date: '1967-06-27'
    thread: economy-debt-limit
    also: [congress]
    c: The Senate passes the debt limit, H.R. 10867, [60–30](https://voteview.com/rollcall/RS0900117); a limit of $348 billion lost, [43–44](https://voteview.com/rollcall/RS0900113).
    n: 'Check: the Record''s page. See [[cal.1967-06-07.economy]].'
  - id: cal.1967-06-27.middle-east
    when: June 27–28
    date: '1967-06-27'
    thread: middle-east-six-day-war-aftermath
    c: 'Israel merges East Jerusalem with the city. A White House statement, June 28: no "hasty unilateral action."'
    n: The statement of June 28, in the note to Address at the State Department's Foreign Policy Conference for Educators, [1967 Pub. Papers 630](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=698) (June 19, 1967). See [[cal.1967-06-19.middle-east]].
  - id: cal.1967-06-27.oil
    when: June 27
    date: '1967-06-27'
    thread: oil
    c: 'OECD Council: its Special Committee for Oil to convene an international industry advisory body and report any shortfall of supply against consumption. France and West Germany abstain.'
    n: 'FRUS 1964–68, XXXIV, docs. [251](https://history.state.gov/historicaldocuments/frus1964-68v34/d251) (the resolution), [241](https://history.state.gov/historicaldocuments/frus1964-68v34/d241) (the Oil Committee, June 12), [249](https://history.state.gov/historicaldocuments/frus1964-68v34/d249) (State to Bonn, June 24: the Foreign Petroleum Supply Committee''s plan of action awaiting Interior, the Office of Emergency Planning and the Attorney General). See [[cal.1967-06-06.oil]].'
  - id: cal.1967-06-28.vietnam
    when: June 28–30
    date: '1967-06-28'
    thread: vietnam-elections
    c: 'Saigon. The generals of the Directorate, June 28–30, on the presidential election of Sept. 3: Thiệu and Kỳ, both declared candidates, on one ticket, Thiệu for President, Kỳ for Vice President, announced June 30. June 28, the division commanders agree to keep out of election politics; Dương Văn Minh not allowed home from Bangkok.'
    n: 'FRUS 1964–68, V, docs. [222](https://history.state.gov/historicaldocuments/frus1964-68v05/d222), [223](https://history.state.gov/historicaldocuments/frus1964-68v05/d223), [226](https://history.state.gov/historicaldocuments/frus1964-68v05/d226). To check: [[w.ky-twenty-years-and-twenty]]; [[w.lam-history-of-south-vietnam-2021]]; [[w.schaffer-ellsworth-bunker]]; [[w.bunker-papers]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Dương Văn Minh.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:duong-van-minh, name:bunker-ellsworth, place:saigon]
  - id: cal.1967-06-28.opinion
    when: June 28
    date: '1967-06-28'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 2–7: can identify Percy, 44 percent; Republicans 51, Democrats 39, independents 45; college-educated 71, grade school 25. Of the 44: favorable 27, unfavorable 2. Would like to see him President some day: yes 15, no 9.'
    n: '[[w.gallup-poll]], III, 2070–71. Names: Percy.'
    tags: [name:percy-charles-h]
  - id: cal.1967-06-29.vietnam-air-war
    when: June 29
    date: '1967-06-29'
    thread: vietnam-air-war
    also: [soviet-union]
    c: The Soviet freighter *Mikhail Frunze* damaged near Haiphong.
    n: '[[w.current-documents-1967]], 945. See [[cal.1967-06-02.vietnam]].'
    tags: [place:haiphong]
  - id: cal.1967-06-30.draft
    when: June 30
    date: '1967-06-30'
    thread: draft
    also: [defense]
    c: 'Military Selective Service Act signed, [81 Stat. 100](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg100.pdf): induction authority to July 1, 1971. Undergraduates deferred until the degree or 24; graduate students no longer, but for medicine and the like and studies found "necessary to the maintenance of the national health, safety, or interest." No change in the order of induction, a lottery, without a further act of Congress. No judicial review of a classification but as a defense to prosecution after an order to report; the Justice Department to prosecute promptly or tell Congress why. Senate, May 11, [70–2](https://voteview.com/rollcall/RS0900092), a volunteer force refused, [9–69](https://voteview.com/rollcall/RS0900085); House, May 25, [362–9](https://voteview.com/rollcall/RH0900062); the conference report, Senate, June 14, [72–23](https://voteview.com/rollcall/RS0900106), House, June 20, [377–29](https://voteview.com/rollcall/RH0900079). Executive Order 11360, the same day.'
    n: '[Executive Order 11360—Amending the Selective Service Regulations](https://www.presidency.ucsb.edu/documents/executive-order-11360-amending-the-selective-service-regulations) (June 30, 1967). To check: [[w.flynn-draft-1940-1973]]; [[w.flynn-lewis-b-hershey-mr]]; [[w.baskir-chance-and-circumstance]]. See [[cal.1967-03-06.draft]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-06-30.economy-debt-limit
    when: June 30
    date: '1967-06-30'
    thread: economy-debt-limit
    c: The debt limit signed, [81 Stat. 99](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg99.pdf).
    n: Statute (K–J Cong. II.J.2). See [[cal.1967-06-07.economy]].
  - id: cal.1967-06-30.trade
    when: June 30
    date: '1967-06-30'
    thread: trade
    also: [farm]
    c: 'Geneva. The Kennedy Round''s agreements signed, Roth for the United States, the last day of the Trade Expansion Act''s authority. Cotton textiles: the cuts to snap back if the Long-Term Arrangement is not renewed in 1970. Johnson proclaims lower quotas on dairy imports.'
    n: 'FRUS 1964–68, VIII, docs. [367](https://history.state.gov/historicaldocuments/frus1964-68v08/d367), [368](https://history.state.gov/historicaldocuments/frus1964-68v08/d368), [370](https://history.state.gov/historicaldocuments/frus1964-68v08/d370). Statement by the President Upon Signing Proclamation Reducing the Level of Dairy Imports, [1967 Pub. Papers 669](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=737) (June 30, 1967). See [[cal.1967-05-15.trade]]. Names: Roth, Johnson.'
    tags: [name:roth-william-m, name:johnson-lyndon-b]
  - id: cal.1967-06-30.state-and-city-finance-us
    when: June 30
    date: '1967-06-30'
    thread: state-and-city-finance
