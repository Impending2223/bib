    also: [middle-east-six-day-war-aftermath, vietnam, testing]
    c: 'Glassboro, N.J., Hollybush, the house of the president of Glassboro State College: Johnson and Kosygin, June 23 and 25, their only meeting. The Middle East: Kosygin, Israel''s troops back to the armistice lines, the Gulf of Aqaba to the International Court; "unless you do this there will be a war." Johnson: talks on ABMs and ICBMs; when and where might McNamara meet Soviet representatives? Kosygin: offensive weapons too. June 23, Kosygin: Phạm Văn Đồng''s answer, received at lunch: stop the bombing and Hanoi will go to the conference table at once. June 25, Johnson gives him a message for Hanoi: the bombing might stop, with immediate discussions after. Rusk with Gromyko, June 23, on nonproliferation. Johnson to Eisenhower, June 25, by telephone.'
    n: 'Remarks Following the President''s First Meeting With Chairman Kosygin at Glassboro, New Jersey, [1967 Pub. Papers 644](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=712) (June 23, 1967); Remarks Following the President''s Second Meeting With Chairman Kosygin at Glassboro, New Jersey, [1967 Pub. Papers 650](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=718) (June 25, 1967). FRUS 1964–68, XIV, docs. [228](https://history.state.gov/historicaldocuments/frus1964-68v14/d228)–[237](https://history.state.gov/historicaldocuments/frus1964-68v14/d237); XI, doc. [198](https://history.state.gov/historicaldocuments/frus1964-68v11/d198); V, doc. [217](https://history.state.gov/historicaldocuments/frus1964-68v05/d217). [Johnson and Eisenhower](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-june-26-1967), Conversation WH6706-02-11914 (Miller Center). [President''s Daily Diary, June 23, 1967](https://catalog.archives.gov/id/192469), images 4, 6, 7, 14, 15; [June 25](https://catalog.archives.gov/id/192471), images 9, 10, 11, 15 (LBJ Library; National Archives Catalog). [[w.rusk-as-i-saw-it-1990]], 349 (the meeting; the missile talks); [[w.rusk-as-i-saw-it-1990]], 471 (the message for Hanoi); [[w.dobrynin-in-confidence]], 167–72; [[w.branch-at-canaans-edge]], 624–25. Made public: the memoranda of conversation, FRUS 1964–68, XIV (2001). [[w.drea-mcnamara-clifford-and-the-2011]], 366–367 (Glassboro; McNamara''s case at lunch; Kosygin on offensive weapons; the Middle East); [[w.poole-joint-chiefs-of-staff-2012]], 37 (the summit; the missiles); [[w.nguyen-hanois-war]], 96 (Phạm Văn Đồng''s word through Kosygin); [[w.schwartz-lyndon-johnson-and-europe]], 181–83, 206 (the meeting; nonproliferation; missiles); [[w.johnson-vantage-point]], 256–57, 481–85 (all but Rusk with Gromyko and the call to Eisenhower); [[w.dallek-flawed-giant]], 434–37 (the meetings of June 23 and 25; the Middle East; the missiles); [[w.gibbons-u-s-government-and]], IV, 719–24 (Phạm Văn Đồng''s answer; the message for Hanoi, Rusk''s draft of June 24). Check: Dobrynin: McGuire Air Force Base offered first, Kosygin refusing any military base; Glassboro found with Governor Hughes''s help (168); McNamara''s briefing given at the lunch, before all the officials (170–71). To check: [[w.zubok-failed-empire]]. See [[cal.1966-10-10.soviet-union]]. Names: Johnson, Kosygin, McNamara, Phạm Văn Đồng, Rusk, Gromyko, Eisenhower. Check: Dallek sets the first meeting on June 25, at 11 a.m. (434), the two days on June 23 and 25 (435). Check: by Rusk''s account Governor Hughes proposed the house ([[w.rusk-as-i-saw-it-1990]], 349).'
