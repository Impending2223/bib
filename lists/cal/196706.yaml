    c: 'The CIA''s first draft of SNIE 14.3-67, "Capabilities of the Vietnamese Communists for Fighting in South Vietnam": the enemy between 460,000 and 570,000, "the higher figure is closer to the actual total." Against MACV: North Vietnamese troops 53,000 in both; Viet Cong main and local forces 63,000 in both; guerrillas 60,000–120,000 and militia 125,000, against MACV''s irregulars, 100,000–120,000; administrative services 75,000–100,000 against 23,000; political cadres at least 80,000 against 40,000. Totals 456,000–541,000 against 279,000–299,000.'
