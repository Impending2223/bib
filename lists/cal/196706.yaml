  - id: cal.1967-06-30.draft
    when: June 30
    date: '1967-06-30'
    thread: draft
    also: [defense]
    c: 'Military Selective Service Act signed, [81 Stat. 100](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg100.pdf): induction authority to July 1, 1971. Undergraduates deferred until the degree or 24; graduate students no longer, but for medicine and the like and studies found "necessary to the maintenance of the national health, safety, or interest." No change in the order of induction, a lottery, without a further act of Congress. No judicial review of a classification but as a defense to prosecution after an order to report; the Justice Department to prosecute promptly or tell Congress why. Senate, May 11, [70–2](https://voteview.com/rollcall/RS0900092), a volunteer force refused, [9–69](https://voteview.com/rollcall/RS0900085); House, May 25, [362–9](https://voteview.com/rollcall/RH0900062); the conference report, Senate, June 14, [72–23](https://voteview.com/rollcall/RS0900106), House, June 20, [377–29](https://voteview.com/rollcall/RH0900079). Executive Order 11360, the same day.'
    n: '[Executive Order 11360—Amending the Selective Service Regulations](https://www.presidency.ucsb.edu/documents/executive-order-11360-amending-the-selective-service-regulations) (June 30, 1967). [[w.califano-triumph-and-tragedy-of]], 198 (four years; the youngest first, the college deferments kept, no lottery without a new law; draft-law cases to have precedence; Johnson on Califano''s memorandum: "I agree. L."). To check: [[w.flynn-draft-1940-1973]]; [[w.flynn-lewis-b-hershey-mr]]; [[w.baskir-chance-and-circumstance]]. See [[cal.1967-03-06.draft]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
