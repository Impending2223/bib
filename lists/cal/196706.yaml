    also: [defense, soviet-union]
    c: 'The *Liberty*, a Navy intelligence ship, some 13 miles off the Sinai coast northwest of El Arish, attacked by Israeli jet aircraft and three torpedo boats, about 8 a.m. Eastern time: 34 killed, more than 170 wounded. The Sixth Fleet launches aircraft to defend her; Johnson tells Kosygin over the hot line why. Israel apologizes the same day: a mistake. Rusk''s note to Harman, June 10: the attack "quite literally incomprehensible," "an act of military recklessness reflecting wanton disregard for human life."'
    n: '[[w.drea-mcnamara-clifford-and-the-2011]], 446–447 (the attack, the dead and wounded; the aircraft launched; the hot line; the apology accepted); [[w.rusk-as-i-saw-it-1990]], 388 (the attack); [[w.califano-triumph-and-tragedy-of]], 205–06 (Clifford: "as if the Arabs or Russians had done it," "inconceivable that it was an accident"; Rusk: "incomprehensible"; Johnson privately "one hundred percent" with Clifford); [[w.poole-joint-chiefs-of-staff-2012]], 175–76 (her identification erased from the Israeli naval plot at 11 a.m.; strafing about 2 p.m., the torpedo boats about half an hour later; at 2:50 p.m. the Sixth Fleet orders aircraft from the *Saratoga* and *America*); [[w.dallek-flawed-giant]], 429–30 (the Liberty attacked on the afternoon of June 8 by Israeli planes and torpedo boats, 34 killed, 171 wounded; Israel''s signal of error, "deep regret"; Rusk''s words to Tel Aviv, "quite literally incomprehensible" and "an act of military recklessness reflecting wanton disregard for human life"; not the place, the hour, the Sixth Fleet, the hot line or the date of Rusk''s note). [[w.clifford-counsel-to-the-president-2]], 445–47 (the Situation Room, 6:40 a.m.; the hot-line message; Israel''s word of a mistake; Clifford''s inquiry). [FRUS 1964–68, XIX, doc. 204](https://history.state.gov/historicaldocuments/frus1964-68v19/d204); [doc. 207](https://history.state.gov/historicaldocuments/frus1964-68v19/d207); [doc. 210](https://history.state.gov/historicaldocuments/frus1964-68v19/d210); [doc. 212](https://history.state.gov/historicaldocuments/frus1964-68v19/d212); [doc. 219](https://history.state.gov/historicaldocuments/frus1964-68v19/d219); [doc. 256](https://history.state.gov/historicaldocuments/frus1964-68v19/d256). The time is the first day''s. To check: [[w.ennes-assault-on-the-liberty]]; [[w.cristol-liberty-incident]]; [[w.oren-six-days-of-war]]. See [[cal.1967-06-05.middle-east]]. Names: Johnson, Kosygin, Rusk, Harman. Check: Rusk gives ten American dead ([[w