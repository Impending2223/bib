  - id: cal.1967-06-01.state-and-city-finance-mn
    when: June 1
    date: '1967-06-01'
    thread: state-and-city-finance
    c: 'Minnesota. LeVander vetoes the special session''s tax bill, H.F. 27: the State''s first sales tax, 3 percent, with relief from the property tax for owners and renters. He had asked for a referendum first. His veto of the regular session''s bill, May 20, had stood.'
    n: '[Minn. Legislative Reference Library, vetoes of 1967](https://www.lrl.mn.gov/Vetoes/vetodetails?gov=1); [the veto message, June 1, 1967](https://www.leg.mn.gov/archive/vetoes/1967_sp1veto_HF27.pdf). [MNopedia, "LeVander, Karl Harold Phillip"](https://www.mnhs.org/mnopedia/search/index/person/levander-karl-harold-phillip-1910-1992). To check: [[w.peirce-great-plains-states-of]]. Names: LeVander.'
    tags: [state:mn, name:levander-harold]
    short: Minnesota's sales tax over the veto
  - id: cal.1967-06-01.middle-east
