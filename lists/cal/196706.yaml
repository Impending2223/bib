    n: '[[w.palermo-in-his-own-right]], 66. See [[cal.1967-06-03.democratic-party]]. Names: Robert Kennedy, Johnson, Harriman. Check: Palermo quotes the Daily Diary on Johnson dancing "the greater part of the evening" (66, n.35, "Ibid."; the record not identified).'
