  - id: cal.1967-06-02.crime-and-hijacking-co
    when: June 2
    date: '1967-06-02'
    thread: crime-and-hijacking
    c: 'Cañon City, Colo. Luis José Monge, convicted of killing his wife and three of their children, executed in the State penitentiary''s gas chamber: the last execution in the United States until Jan. 1977.'
    n: '*Monge v. People*, [158 Colo. 224](https://static.case.law/colo/158/case-pdfs/0224-01.pdf) (1965), the death sentence affirmed. [Wikipedia, "Luis Monge"](https://en.wikipedia.org/wiki/Luis_Monge). To check: [[w.mandery-wild-justice]]. See [[cal.1967-04-12.crime-and-hijacking-ca]]. Names: Monge.'
    tags: [state:co, name:monge-luis-jose]
  - id: cal.1967-06-02.vietnam-air-war
    when: June 2
    date: '1967-06-02'
    thread: vietnam-air-war
    c: 'Nitze, for the Navy, to McNamara, "Bombing Options": bombing south of the 20th parallel better than the present program; closing Haiphong and heavier bombing might interrupt supplies more, but the North would find other routes; "Reducing imports below NVN''s minimum requirements was probably beyond the current capability of the bombing campaign."'
    n: '[[w.gibbons-u-s-government-and]], IV, 655–56. To check: Nitze to McNamara, "Bombing Options," June 2, 1967, Warnke Papers, McNaughton Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 656 n.110). See [[cal.1967-05-20.vietnam-air-war-3]]. Names: Nitze, McNamara.'
