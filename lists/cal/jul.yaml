# Cal. IX July
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: IX
entries:
  - id: cal.1961-07-18.school-aid
    when: July 18
    date: '1961-07-18'
    thread: school-aid
    c: House Rules Committee votes 8–7 to hold the school bills. Delaney, a Catholic Democrat, joins the conservatives over parochial aid. The enlarged committee fails its first test.
    n: 'See [[cal.1961-02-20.school-aid]]. McAndrews, *Broken Ground* (K–J Adm. II.B). Names: Delaney, Smith (K–J Cong. III.D).'
  - id: cal.1961-07-20.defense
    when: July 20
    date: '1961-07-20'
    thread: defense
    c: Civil defense moved from the Office of Civil and Defense Mobilization to the Pentagon. Water pollution amendments signed. Check both.
    n: Exec. Order No. 10,952. Check. Federal Water Pollution Control Act Amendments of 1961, Pub. L. No. 87-88, 75 Stat. 204. Check. Milazzo, *Unlikely Environmentalists* (K–J Cong. II.B).
  - id: cal.1961-07-21.space
    when: July 21
    date: '1961-07-21'
    thread: space
    c: Grissom's suborbital flight.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1961-07-24.crime-and-hijacking
    when: July 24
    date: '1961-07-24'
    thread: crime-and-hijacking
    c: An Eastern Air Lines flight hijacked to Havana.
    n: See [[cal.1961-05-01.crime-and-hijacking]].
  - id: cal.1961-07-25.berlin-and-vienna
    when: July 25
    date: '1961-07-25'
    thread: berlin-and-vienna
    also: [defense]
    c: Report to the nation on Berlin. $3.25 billion more for defense; reserves to be called; draft calls tripled; fallout shelters. No direct challenge to the Soviet zone.
    n: 'Radio and Television Report to the American People on the Berlin Crisis (July 25, 1961). See [[cal.1961-06-03.berlin-and-vienna]]. Recording (K–J Adm. II.I). Names: Nitze (K–J Adm. III.F); Acheson.'
  - id: cal.1961-07-25.economy
    when: July 25
    date: '1961-07-25'
    thread: economy
    c: The Berlin requests come without new taxes. A temporary tax increase to pay for them, which Kennedy had favored, was dropped after Heller and Samuelson argued it would choke the recovery. Check the sequence and date.
    n: 'Sorensen, *Kennedy* (K–J Adm. II.G.2). Stein, *Fiscal Revolution* (K–J Adm. II.B). The Republican leaders on Berlin and the budget: Joint Senate–House Republican Leadership minutes, July 27, 1961 (Dirksen Congressional Center; Opp. II.J). See [[cal.1961-07-25.berlin-and-vienna]] (Berlin and Vienna).'
  - id: cal.1961-07-30.berlin-and-vienna
    when: July 30
    date: '1961-07-30'
    thread: berlin-and-vienna
    c: 'Fulbright on television: the East Germans have the right to close their border, and he does not know why they have not.'
    n: 'Woods, *Fulbright* (K–J Cong. II.I.1). Kempe (K–J Adm. II.D). Names: Fulbright (K–J Cong. III.B).'
