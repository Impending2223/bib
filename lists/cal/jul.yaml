    c: 'Gallup, June 23–28: tractors for the prisoners of the Cuban invasion, 20 percent for, 67 against.'
    n: '[[w.gallup-poll]], III, 1725.'
  - id: cal.1961-07-11.governors-va
    when: July 11
    date: '1961-07-11'
    thread: governors
    also: [elections-1961]
    c: 'Virginia, Democratic primary for governor: Harrison, the attorney general, the Byrd organization''s candidate, 199,519, 56.7 percent; Stephens, the lieutenant governor, running against the organization, 152,639, 43.3.'
    n: 'Votes: Wikipedia, ["1961 Virginia gubernatorial election"](https://en.wikipedia.org/wiki/1961_Virginia_gubernatorial_election), from Our Campaigns. [State Board of Elections, *Statement of the Vote*, Democratic Primary, July 11, 1961](https://va2.elstats2.civera.com/eng/files/serve/1111#page=3) (the Department of Elections'' historical database). [[w.wilkinson-harry-byrd-and-the]]; [[w.heinemann-harry-byrd-of-virginia]]; [[w.ely-crisis-of-conservative-virginia]]. Names: Harrison, Stephens, Byrd.'
    tags: [state:va, name:harrison-albertis-s-jr, name:stephens-a-e-s, name:byrd-harry-f]
  - id: cal.1961-07-12.opinion
    when: July 12
    date: '1961-07-12'
    thread: opinion
    also: [testing]
    c: 'Gallup, June 23–28: the United States to resume nuclear tests now, 55 percent; not, 26.'
    n: '[[w.gallup-poll]], III, 1726.'
  - id: cal.1961-07-17.mayors-new-orleans
    when: July 17
    date: '1961-07-17'
    thread: mayors
    c: New Orleans. Morrison, mayor since 1946, resigns to be Ambassador to the Organization of American States, confirmed July 14. The council names Schiro, a councilman at large, mayor.
    n: 'Morrison: [POCOM](https://history.state.gov/departmenthistory/people/morrison-delesseps-story); CR, Senate, July 5 and 14, 1961. [[w.haas-delesseps-s-morrison-and]]. Names: Morrison, Schiro.'
    tags: [name:morrison-delesseps-s, name:schiro-victor-h, state:la, city:new-orleans]
  - id: cal.1961-07-18.school-aid
    when: July 18
    date: '1961-07-18'
    thread: school-aid
    c: House Rules Committee votes 8–7 to hold the school bills. Delaney, a Catholic Democrat, joins the conservatives over parochial aid. The enlarged committee fails its first test.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-206) (July 19, 1961). See [[cal.1961-02-20.school-aid]]. [[w.mcandrews-broken-ground]]. Names: Delaney, Smith.'
    tags: [name:delaney-james-j, name:smith-howard-w]
  - id: cal.1961-07-19.africa
    when: July 19–22
    date: '1961-07-19'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'Bizerte. Tunisia blockades the French naval base; French paratroops land, and the town is fought over. The United States and Britain urge a cease-fire on France and Tunisia. Security Council, July 22, Resolution 164, 10–0, France not voting: an immediate cease-fire, the forces back to their former positions.'
    n: '[S.C. Res. 164](https://undocs.org/S/RES/164(1961)) (July 22, 1961). FRUS 1961–63, XXI, docs. [165](https://history.state.gov/historicaldocuments/frus1961-63v21/d165), [166](https://history.state.gov/historicaldocuments/frus1961-63v21/d166), [167](https://history.state.gov/historicaldocuments/frus1961-63v21/d167). [[w.muehlenbeck-betting-on-the-africans]].'
  - id: cal.1961-07-20.defense
    when: July 20
    date: '1961-07-20'
    thread: defense
    also: [conservation]
    c: Civil defense moved from the Office of Civil and Defense Mobilization to the Pentagon. Water pollution amendments signed, [75 Stat. 204](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg204.pdf).
    n: '[Exec. Order No. 10,952](https://www.presidency.ucsb.edu/documents/executive-order-10952-assigning-civil-defense-responsibilities-the-secretary-defense-and), [26 Fed. Reg. 6577](https://www.govinfo.gov/app/details/FR-1961-07-22). [[w.milazzo-unlikely-environmentalists]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-07-21.space
    when: July 21
    date: '1961-07-21'
    thread: space
    c: Grissom's suborbital flight.
    n: '[Remarks Upon Signing Bill Providing for an Expanded Space Program](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-providing-for-expanded-space-program). See [[cal.1961-04-12.space]]. Names: Grissom.'
    tags: [name:grissom-virgil-i]
  - id: cal.1961-07-24.crime-and-hijacking
    when: July 24
    date: '1961-07-24'
    thread: crime-and-hijacking
    c: An Eastern Air Lines flight hijacked to Havana.
    n: '[FRUS 1961–63, X, doc. 252](https://history.state.gov/historicaldocuments/frus1961-63v10/d252). See [[cal.1961-05-01.crime-and-hijacking]].'
  - id: cal.1961-07-25.berlin-and-vienna
    when: July 25
    date: '1961-07-25'
    thread: berlin-and-vienna
    also: [defense]
    c: Report to the nation on Berlin. $3.25 billion more for defense; reserves to be called; draft calls tripled; fallout shelters. No direct challenge to the Soviet zone.
    n: '[Radio and Television Report to the American People on the Berlin Crisis](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-berlin-crisis) (July 25, 1961). See [[cal.1961-06-03.berlin-and-vienna]]. Recording (K–J Adm. II.I). Names: Nitze, Acheson.'
    tags: [name:kennedy-john-f, name:nitze-paul, name:acheson-dean-g]
  - id: cal.1961-07-25.economy
    when: July 25
    date: '1961-07-25'
    thread: economy
    c: The Berlin requests come without new taxes. A temporary tax increase to pay for them, which Kennedy had favored, was dropped after Heller and Samuelson argued it would choke the recovery. Check who argued against it.
    n: 'NSC minutes, July 19, 1961, [FRUS 1961–63, XIV, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v14/d77). [Radio and Television Report to the American People on the Berlin Crisis](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-berlin-crisis) (July 25, 1961). [[w.sorensen-kennedy]]; [[w.stein-fiscal-revolution-in-america]]. The Republican leaders on Berlin and the budget: Joint Senate–House Republican Leadership minutes, July 27, 1961 (Dirksen Congressional Center; Opp. II.J). See [[cal.1961-07-25.berlin-and-vienna]] (Berlin and Vienna). Names: Heller, Samuelson.'
    tags: [name:kennedy-john-f, name:heller-walter-w, name:samuelson-paul-a]
  - id: cal.1961-07-27.confirmations
    when: July 27
    date: '1961-07-27'
    thread: confirmations
    also: [civil-rights-the-executive]
    c: Spottswood W. Robinson III, dean of Howard's law school, confirmed to the Civil Rights Commission, [73–17](https://voteview.com/rollcall/RS0870104).
    n: '[107 Cong. Rec., Senate, July 27, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-8-1.pdf). See [[cal.1961-03-07.confirmations]]. Names: Robinson.'
    tags: [name:robinson-spottswood-w-iii]
  - id: cal.1961-07-30.berlin-and-vienna
    when: July 30
    date: '1961-07-30'
    thread: berlin-and-vienna
    c: 'Fulbright on television: the East Germans have the right to close their border, and he does not know why they have not.'
    n: '[Cong. Rec., Senate, Aug. 1, 1961, 14222–14225](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-2-1.pdf#page=28) (the program''s transcript). [[w.woods-fulbright]]; [[w.kempe-berlin-1961]]. Names: Fulbright.'
    tags: [name:fulbright-j-william]
  - id: cal.1961-07-30.opinion
    when: July 30
    date: '1961-07-30'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, June 23–28: of the 76 percent who had followed the Berlin dispute, 82 percent would keep American forces in Berlin at the risk of war, 7 would not. July 13–18: if East Germany closes the roads and air access, fight the way in, 71; not, 15.'
    n: '[[w.gallup-poll]], III, 1729.'
  - id: cal.1961-07-31.opinion
    when: July 31
    date: '1961-07-31'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, July 13–18: if Russia insists on controlling Berlin, war, 60 percent; no war, 31. Chances Russia gives in by year''s end very good, 36.'
    n: '[[w.gallup-poll]], III, 1729.'
  - id: cal.1961-07-31.european-community
    when: July 31–Aug. 23
    date: '1961-07-31'
    thread: european-community
    c: 'Macmillan to the Commons: Britain to apply under Article 237 of the Rome Treaty, to learn whether the special interests of Britain, the Commonwealth and the EFTA can be met. Aug. 3, the Commons approves, 313–5, Labour''s amendment refused, 318–209. Aug. 21, NSAM 76: Kennedy asks State, the Treasury and the CEA to study the effect on the United States of Britain''s entry. Ball, Aug. 23: "the situation is well in hand."'
    n: 'HC Deb, [July 31, 1961](https://api.parliament.uk/historic-hansard/commons/1961/jul/31/european-economic-community-government), vol. 645, cc. 928–42; [Aug. 3, 1961](https://api.parliament.uk/historic-hansard/commons/1961/aug/03/european-economic-community), cc. 1651–1786. FRUS 1961–63, XIII, docs. [14](https://history.state.gov/historicaldocuments/frus1961-63v13/d14) (Macmillan to Kennedy, July 28), [15](https://history.state.gov/historicaldocuments/frus1961-63v13/d15) (NSAM 76), [16](https://history.state.gov/historicaldocuments/frus1961-63v13/d16) (Ball). [[w.camps-britain-and-the-european]]; [[w.macmillan-at-the-end-of]]; [[w.zeiler-american-trade-and-power]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.ludlow-dealing-with-britain]]; [[w.young-this-blessed-plot]]; [[w.milward-uk-and-the-european]]. See [[cal.1961-04-05.european-community]]. Names: Macmillan, Ball.'
    tags: [name:macmillan-harold, name:ball-george-w, name:kennedy-john-f]
