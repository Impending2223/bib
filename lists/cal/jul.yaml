section: IX
entries:
  - id: cal.1961-07-02.opinion
    when: July 2
    date: '1961-07-02'
    thread: opinion
    also: [space]
    c: 'Gallup, May 28–June 2: of the programs Kennedy asked sacrifices for, would pay higher taxes for retraining the unemployed, 67 percent; the armed forces, 28; civil defense, 28; the information agency, 26; space research, 21; economic aid, 21; military aid, 9.'
    n: '*The Gallup Poll*, III, 1724 (K–J Cong. II.E).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-07-05.opinion
    when: July 5
    date: '1961-07-05'
    thread: opinion
    also: [defense]
    c: 'Gallup, May 4–9: local civil defense handled well, 22 percent; poorly, 19; little or no knowledge of it, 59.'
    n: '*The Gallup Poll*, III, 1724 (K–J Cong. II.E).'
  - id: cal.1961-07-07.opinion
    when: July 7
    date: '1961-07-07'
    thread: opinion
    also: [cuba]
    c: 'Gallup, June 23–28: tractors for the prisoners of the Cuban invasion, 20 percent for, 67 against.'
    n: '*The Gallup Poll*, III, 1725 (K–J Cong. II.E).'
  - id: cal.1961-07-12.opinion
    when: July 12
    date: '1961-07-12'
    thread: opinion
    also: [testing]
    c: 'Gallup, June 23–28: the United States to resume nuclear tests now, 55 percent; not, 26.'
    n: '*The Gallup Poll*, III, 1726 (K–J Cong. II.E).'
  - id: cal.1961-07-18.school-aid
    when: July 18
    date: '1961-07-18'
    thread: school-aid
    c: House Rules Committee votes 8–7 to hold the school bills. Delaney, a Catholic Democrat, joins the conservatives over parochial aid. The enlarged committee fails its first test.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-206) (July 19, 1961). See [[cal.1961-02-20.school-aid]]. McAndrews, *Broken Ground* (K–J Adm. II.B). Names: Delaney, Smith (K–J Cong. III.D).'
    tags: [name:delaney-james-j]
  - id: cal.1961-07-20.defense
    when: July 20
    date: '1961-07-20'
    thread: defense
    c: Civil defense moved from the Office of Civil and Defense Mobilization to the Pentagon. Water pollution amendments signed, [75 Stat. 204](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg204.pdf).
    n: '[Exec. Order No. 10,952](https://www.presidency.ucsb.edu/documents/executive-order-10952-assigning-civil-defense-responsibilities-the-secretary-defense-and), [26 Fed. Reg. 6577](https://www.govinfo.gov/app/details/FR-1961-07-22). Milazzo, *Unlikely Environmentalists* (K–J Cong. II.B).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-07-21.space
    when: July 21
    date: '1961-07-21'
    thread: space
    c: Grissom's suborbital flight.
    n: '[Remarks Upon Signing Bill Providing for an Expanded Space Program](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-providing-for-expanded-space-program). See [[cal.1961-04-12.space]].'
    tags: [name:grissom-virgil-i]
  - id: cal.1961-07-24.crime-and-hijacking
    when: July 24
    date: '1961-07-24'
    thread: crime-and-hijacking
    c: An Eastern Air Lines flight hijacked to Havana.
    n: '[FRUS 1961–63, X, doc. 252](https://history.state.gov/historicaldocuments/frus1961-63v10/d252). See [[cal.1961-05-01.crime-and-hijacking]].'
  - id: cal.1961-07-25.berlin-and-vienna
    when: July 25
    date: '1961-07-25'
    thread: berlin-and-vienna
    also: [defense]
    c: Report to the nation on Berlin. $3.25 billion more for defense; reserves to be called; draft calls tripled; fallout shelters. No direct challenge to the Soviet zone.
    n: '[Radio and Television Report to the American People on the Berlin Crisis](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-berlin-crisis) (July 25, 1961). See [[cal.1961-06-03.berlin-and-vienna]]. Recording (K–J Adm. II.I). Names: Nitze (K–J Adm. III.F); Acheson.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-07-25.economy
    when: July 25
    date: '1961-07-25'
    thread: economy
    c: The Berlin requests come without new taxes. A temporary tax increase to pay for them, which Kennedy had favored, was dropped after Heller and Samuelson argued it would choke the recovery. Check who argued against it.
    n: 'NSC minutes, July 19, 1961, [FRUS vol. 14, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v14/d77). [Radio and Television Report to the American People on the Berlin Crisis](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-berlin-crisis) (July 25, 1961). Sorensen, *Kennedy* (K–J Adm. II.G.2). Stein, *Fiscal Revolution* (K–J Adm. II.B). The Republican leaders on Berlin and the budget: Joint Senate–House Republican Leadership minutes, July 27, 1961 (Dirksen Congressional Center; Opp. II.J). See [[cal.1961-07-25.berlin-and-vienna]] (Berlin and Vienna).'
    tags: [name:kennedy-john-f, name:heller-walter-w, name:samuelson-paul-a]
  - id: cal.1961-07-27.confirmations
    when: July 27
    date: '1961-07-27'
    thread: confirmations
    also: [civil-rights-the-executive]
    c: Spottswood W. Robinson III, dean of Howard's law school, confirmed to the Civil Rights Commission, [73–17](https://voteview.com/rollcall/RS0870104).
    n: '[107 Cong. Rec., Senate, July 27, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-8-1.pdf). See [[cal.1961-03-07.confirmations]].'
    tags: [name:robinson-spottswood-w-iii]
  - id: cal.1961-07-30.berlin-and-vienna
    when: July 30
    date: '1961-07-30'
    thread: berlin-and-vienna
    c: 'Fulbright on television: the East Germans have the right to close their border, and he does not know why they have not.'
    n: 'Woods, *Fulbright* (K–J Cong. II.I.1). Kempe (K–J Adm. II.D). Names: Fulbright (K–J Cong. III.B).'
    tags: [name:fulbright-j-william]
  - id: cal.1961-07-30.opinion
    when: July 30
    date: '1961-07-30'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, June 23–28: of the 76 percent who had followed the Berlin dispute, 82 percent would keep American forces in Berlin at the risk of war, 7 would not. July 13–18: if East Germany closes the roads and air access, fight the way in, 71; not, 15.'
    n: '*The Gallup Poll*, III, 1729 (K–J Cong. II.E).'
  - id: cal.1961-07-31.opinion
    when: July 31
    date: '1961-07-31'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, July 13–18: if Russia insists on controlling Berlin, war, 60 percent; no war, 31. Chances Russia gives in by year''s end very good, 36.'
    n: '*The Gallup Poll*, III, 1729 (K–J Cong. II.E).'
