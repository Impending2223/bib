# Cal. LXXXVI December 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXVI
entries:
  - id: cal.1966-12.civil-rights-organizations
    when: Dec.
    date: 1966-12
    thread: civil-rights-organizations
    also: [black-nationalism]
    c: SNCC's staff meets at Peg Leg Bates's resort, Kerhonkson, N.Y. A vote to exclude whites from membership carried, 19–18, 24 abstaining (Check the count and the dates).
    n: '[[w.carson-in-struggle]]; [[w.hogan-many-minds-one-heart]]; [[w.joseph-waiting-til-the-midnight]]. See [[cal.1966-06-06.mississippi]].'
  - id: cal.1966-12-01.vietnam
    when: Dec. 1–6
    date: '1966-12-01'
    thread: vietnam
    c: 'Marigold. Saigon, Dec. 1, at the Italian ambassador D''Orlandi''s apartment: Lewandowski, the Polish member of the ICC, back from Hanoi, reads Lodge the ten points he gave Hanoi as the American position; the Poles will support a contact of the American and North Vietnamese ambassadors in Warsaw. Dec. 2 and 4, American aircraft strike the Văn Điển vehicle depot and the Yên Viên rail yards, five miles from Hanoi''s center, targets authorized Nov. 10. Dec. 3, Lodge, on Johnson''s instructions: the embassy in Warsaw will see the North Vietnamese Dec. 6 and confirm that the ten points "broadly" reflect the American position, but "several specific points are subject to important differences of interpretation." Dec. 5, Rapacki to Gronouski: the reservation puts the contact in doubt; and the bombing near Hanoi. No meeting Dec. 6.'
    n: 'FRUS 1964–68, IV, docs. [322](https://history.state.gov/historicaldocuments/frus1964-68v04/d322), [324](https://history.state.gov/historicaldocuments/frus1964-68v04/d324), [325](https://history.state.gov/historicaldocuments/frus1964-68v04/d325), [327](https://history.state.gov/historicaldocuments/frus1964-68v04/d327). See [[cal.1966-06-29.vietnam-2]]. Names: Lewandowski, D''Orlandi, Rapacki, Lodge, Gronouski, Johnson.'
    tags: [name:lewandowski-janusz, name:lodge-henry-cabot, name:dorlandi-giovanni, name:rapacki-adam, name:gronouski-john-a, name:johnson-lyndon-b]
  - id: cal.1966-12-01.europe-and-the-alliance
    when: Dec. 1
    date: '1966-12-01'
    thread: europe-and-the-alliance
    c: 'Bonn. Kiesinger, Minister-President of Baden-Württemberg, elected Chancellor by the Bundestag: a grand coalition of the CDU/CSU and the Social Democrats, Brandt Foreign Minister and Vice Chancellor. The Free Democrats had left Erhard''s cabinet Oct. 27; Kiesinger the CDU/CSU''s candidate Nov. 10; the coalition agreed Nov. 27; Erhard resigned Nov. 30.'
    n: 'FRUS 1964–68, XV, docs. [184](https://history.state.gov/historicaldocuments/frus1964-68v15/d184), [188](https://history.state.gov/historicaldocuments/frus1964-68v15/d188). [[w.schwartz-lyndon-johnson-and-europe]]; [[w.zimmermann-money-and-security]]. See [[cal.1965-12-20.europe-and-the-alliance]]. Names: Brandt, Kiesinger, Erhard.'
    tags: [name:kiesinger-kurt-georg, name:brandt-willy, name:erhard-ludwig]
  - id: cal.1966-12-02.europe-and-the-alliance
    when: Dec. 2–16
    date: '1966-12-02'
    thread: europe-and-the-alliance
    also: [africa]
    c: 'Rhodesia. Wilson and Smith aboard HMS *Tiger* off Gibraltar, Dec. 2–3: a working document on an independence constitution, a return to legality and an interim government; Smith''s cabinet at Salisbury rejects it (Check the date, Dec. 5). Britain asks the Security Council for selective mandatory sanctions, Dec. 8; Goldberg for them, Dec. 12. Dec. 16, Resolution 232, 11–0, Bulgaria, France, Mali and the Soviet Union abstaining: members to stop imports of Rhodesia''s asbestos, iron ore, chrome, pig iron, sugar, tobacco, copper and animal products, and the sale to it of arms, aircraft and motor vehicles (Check the list).'
    n: 'Security Council Resolution [232 (1966)](https://undocs.org/S/RES/232(1966)). FRUS 1964–68, XXIV, docs. [547](https://history.state.gov/historicaldocuments/frus1964-68v24/d547), [549](https://history.state.gov/historicaldocuments/frus1964-68v24/d549), [552](https://history.state.gov/historicaldocuments/frus1964-68v24/d552). [[w.horne-from-the-barrel-of]]. See [[cal.1965-11-11.europe-and-the-alliance]]. See [[cal.1966-04-09.africa]]. Names: Wilson, Ian Smith, Goldberg.'
    tags: [name:wilson-harold, name:smith-ian-douglas, name:goldberg-arthur-j]
  - id: cal.1966-12-04.opinion
    when: Dec. 4
    date: '1966-12-04'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Nov. 10–15: Johnson''s handling of Vietnam: approve 43 percent, disapprove 40. The Johnson Administration''s program, the Great Society: favorable 32, unfavorable 44. South 20 and 54; Republicans 16 and 66; independents 27 and 50; Democrats 46 and 27.'
    n: '[[w.gallup-poll]], III, 2038–39. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-12-05.georgia
    when: Dec. 5
    date: '1966-12-05'
    thread: georgia
    also: [students, court]
    c: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf): the House''s refusal to seat Bond for his statements on the war and the draft violated the First Amendment. Warren for a unanimous Court. Since January, Bond elected again in a special election, refused again when he would not recant, and elected a third time in the regular primary and general elections of 1966.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.neary-julian-bond]]; [[w.powe-warren-court-and-american]]. See [[cal.1966-01-06.students]]. Names: Bond.'
    tags: [name:bond-julian]
  - id: cal.1966-12-06.defense
    when: Dec. 6
    date: '1966-12-06'
    thread: defense
    also: [soviet-union]
    c: 'Austin. Johnson with McNamara, Vance and the Joint Chiefs on the fiscal 1968 defense budget, five issues open between them. Wheeler for the Chiefs: deploy Nike-X, an area defense and a defense of 25 cities, $800 million in fiscal 1968, $10 billion in ten years; the Soviets deploying an ABM system around Moscow. McNamara and Vance against: the Soviets would answer with more offensive forces, each side spending $30–40 billion, neither better off. No decision; written views asked of State, the CIA and the science adviser, in by Dec. 10.'
    n: 'FRUS 1964–68, X, docs. [150](https://history.state.gov/historicaldocuments/frus1964-68v10/d150), [151](https://history.state.gov/historicaldocuments/frus1964-68v10/d151), [155](https://history.state.gov/historicaldocuments/frus1964-68v10/d155), [158](https://history.state.gov/historicaldocuments/frus1964-68v10/d158). [The President''s News Conference at Austin, Texas](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-austin-texas-0) (Dec. 6, 1966), with McNamara. [[w.halperin-decision-to-deploy-the]]; [[w.drea-mcnamara-clifford-and-the-2011]]; [[w.shapley-promise-and-power]]. Made public: the notes of the meeting, FRUS 1964–68, X (2001). Names: McNamara, Vance, Wheeler, Johnson.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:vance-cyrus, name:wheeler-earle]
  - id: cal.1966-12-07.opinion
    when: Dec. 7
    date: '1966-12-07'
    thread: opinion
    also: [economy]
    c: 'Gallup, Nov. 10–15, women: a basket of food costing $10 today to cost $12 in a year, $15 in five (medians). More to blame for higher prices: higher wages 42 percent, higher profits 44.'
    n: '[[w.gallup-poll]], III, 2039.'
  - id: cal.1966-12-08.space
    when: Dec. 8
    date: '1966-12-08'
    thread: space
    also: [soviet-union]
    c: 'Austin. Christian reads Johnson''s statement, on Goldberg''s report: agreement in the UN''s Outer Space Committee on a treaty for outer space, the moon and other celestial bodies; the "no bombs in orbit" resolution put in treaty form; access to all installations on celestial bodies. Johnson had asked for it May 7. "The most important arms control development since the Limited Test Ban Treaty of 1963." The General Assembly commends it Dec. 19 (Check).'
    n: '[Statement by the President Announcing the Reaching of an Agreement on an Outer Space Treaty](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-the-reaching-agreement-outer-space-treaty) (Dec. 8, 1966). [[w.mcdougall-heavens-and-the-earth]]. See [[cal.1966-11-11.space]]. Names: Christian, Goldberg, Johnson.'
    tags: [name:johnson-lyndon-b, name:christian-george, name:goldberg-arthur-j]
  - id: cal.1966-12-09.poverty-nyc
    when: Dec. 9
    date: '1966-12-09'
    thread: poverty
    also: [robert-kennedy]
    c: 'Brooklyn, P.S. 305. Robert Kennedy, with Lindsay and Javits, announces a program for Bedford-Stuyvesant: community corporations joined with private business. "The best of community action with the best of the private enterprise system."'
    n: '[Wikipedia, "Bedford Stuyvesant Restoration Corporation"](https://en.wikipedia.org/wiki/Bedford_Stuyvesant_Restoration_Corporation). [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]. Names: Robert Kennedy, Lindsay, Javits.'
    tags: [state:ny, city:nyc, name:kennedy-robert-f, name:lindsay-john-v, name:javits-jacob-k]
  - id: cal.1966-12-09.elections-1968-us
    when: Dec. 9–10
    date: '1966-12-09'
    thread: elections-1968
    also: [elections-1966, states-and-cities]
    c: Republican governors and governors-elect at the Broadmoor, Colorado Springs. Love chairman of their association, Chafee vice chairman, to succeed him in Dec. 1967; Reagan and Kirk to its executive committee. Bliss's "unity," and a resolution of support for him; Reagan, asked by Love, recites the "Eleventh Commandment." Romney keeps the meeting off 1968. Check the days.
    n: '*Ripon Forum*, [Jan. 1967, 3–6](https://riponsociety.org/wp-content/uploads/2023/12/1967-01_Vol-III_No-1.pdf) (Check against the press). [[w.sparacino-democratic-and-republican-governors]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-12-04.elections-1964-us]]; [[cal.1966-11-08.elections-1966]]. Names: Chafee, Reagan, Kirk, Romney, Love, Bliss.'
    tags: [name:love-john-a, name:chafee-john-h, name:reagan-ronald, name:kirk-claude-r-jr, name:bliss-ray-c, name:romney-george-w]
  - id: cal.1966-12-11.opinion
    when: Dec. 11
    date: '1966-12-11'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Nov. 10–15, a plan: the United States to train the 1 to 1½ million South Vietnamese in the army or of draft age, and withdraw 100,000 of its troops as each 100,000 are trained, most if not all within a year; supplies and economic aid to go on, the fighting left to the South Vietnamese. Approve 58 percent, disapprove 24.'
    n: '[[w.gallup-poll]], III, 2039–40.'
  - id: cal.1966-12-12.georgia
    when: Dec. 12
    date: '1966-12-12'
    thread: georgia
    also: [court, elections-1966]
    c: '*Fortson v. Morris*, [385 U.S. 231](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385231/usrep385231.pdf), argued Dec. 5: reversed; the General Assembly may choose the governor. Black for the Court, 5–4: no provision of the federal Constitution prescribes how a State chooses its governor; the Assembly, though malapportioned, may act until May 1, 1968, under *Toombs v. Fortson*; the Democratic members'' oath to support their party''s nominees ended with the election. Douglas, with Warren, Brennan and Fortas, dissenting; Fortas, with Warren and Douglas.'
    n: Opinion (Opp. II.H.1). See [[cal.1966-11-17.georgia]].
  - id: cal.1966-12-12.crime-and-hijacking
    when: Dec. 12
    date: '1966-12-12'
    thread: crime-and-hijacking
    also: [court]
    c: '*Hoffa v. United States*, [385 U.S. 293](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385293/usrep385293.pdf): the jury-tampering convictions of Chattanooga, 1964, affirmed. Stewart for the Court: Partin, the government''s paid informer in Hoffa''s company at the Nashville trial, violated none of his rights; Hoffa spoke to him of his own will. Warren dissenting; Clark, with Douglas, would dismiss the writs; White and Fortas took no part.'
    n: 'See [[cal.1964-03-04.crime-and-hijacking]]. Names: Hoffa, Partin.'
    tags: [name:hoffa-james-r, name:partin-edward-grady]
  - id: cal.1966-12-13.vietnam
    when: Dec. 13–14
    date: '1966-12-13'
    thread: vietnam
    c: 'Dec. 9, Johnson with McNamara, Katzenbach, Vance, Humphrey and Wheeler: no new targets in the North for now; State to Gronouski, Dec. 10: the pattern unchanged. Dec. 13 and 14, the Văn Điển depot and the Yên Viên yards struck again. Hanoi, Dec. 14: the embassy quarter and suburbs hit, over 100 killed or wounded. Dec. 14, Rapacki to Gronouski: Hanoi asks that the conversations begun in Saigon end; "the whole responsibility for losing this chance of a peaceful solution" is the United States''.'
    n: 'FRUS 1964–68, IV, docs. [324](https://history.state.gov/historicaldocuments/frus1964-68v04/d324), [334](https://history.state.gov/historicaldocuments/frus1964-68v04/d334), [342](https://history.state.gov/historicaldocuments/frus1964-68v04/d342). See [[cal.1966-12-01.vietnam]]. Names: McNamara, Vance, Wheeler, Katzenbach, Humphrey, Johnson, Gronouski, Rapacki.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:katzenbach-nicholas, name:vance-cyrus, name:humphrey-hubert-h, name:wheeler-earle, name:gronouski-john-a, name:rapacki-adam]
  - id: cal.1966-12-14.europe-and-the-alliance
    when: Dec. 14–16
    date: '1966-12-14'
    thread: europe-and-the-alliance
    c: Paris, the NATO ministers. The Fourteen, as the Defense Planning Committee, set up the Nuclear Defense Affairs Committee and its seven-member Nuclear Planning Group. The Council takes up Harmel's proposal, Belgium's, to study the alliance's future tasks; Couve de Murville does not object.
    n: 'FRUS 1964–68, XIII, docs. [225](https://history.state.gov/historicaldocuments/frus1964-68v13/d225), [229](https://history.state.gov/historicaldocuments/frus1964-68v13/d229) (Rusk to Johnson, Dec. 16), [232](https://history.state.gov/historicaldocuments/frus1964-68v13/d232). [[w.haftendorn-nato-and-the-nuclear]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.wenger-crisis-and-opportunity]]; [[w.priest-kennedy-johnson-and-nato]]. See [[cal.1965-11-27.europe-and-the-alliance]]. Names: Harmel, Couve de Murville.'
    tags: [name:harmel-pierre-c-j-m, name:couve-de-murville-maurice]
  - id: cal.1966-12-16.assassination
    when: Dec. 16
    date: '1966-12-16'
    thread: assassination
    also: [robert-kennedy]
    c: Jacqueline Kennedy sues William Manchester, Harper & Row and *Look* in the New York courts to stop publication of *The Death of a President*, the account the family had authorized, as written (Check the date).
    n: '[[w.corry-manchester-affair]]; [[w.manchester-death-of-a-president]]; [[w.shesol-mutual-contempt]]. See [[cal.1964-11-23.assassination]]. Names: Jacqueline Kennedy, Manchester.'
    tags: [name:kennedy-jacqueline, name:manchester-william]
  - id: cal.1966-12-16.elections-1966
    when: Dec. 16–21
    date: '1966-12-16'
    thread: elections-1966
    c: 'Eighteen of the twenty-four Democratic governors at White Sulphur Springs, W. Va., Dec. 16–17, after the midterms. Nine of them at the ranch, Dec. 21, Hughes of Iowa their chairman: the President''s policies "never in question"; problems with federal programs in their States, and with the national committee.'
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-14) (Dec. 21, 1966). [[w.savage-jfk-lbj-and-the]]. See [[cal.1966-11-08.elections-1966]]. Names: Hughes.'
    tags: [name:hughes-harold-e, name:johnson-lyndon-b]
  - id: cal.1966-12-16.state-and-city-finance-us
    when: Dec. 16–17
    date: '1966-12-16'
    thread: state-and-city-finance
    also: [states-and-cities]
    c: National Governors' Conference, special interim meeting at White Sulphur Springs, W. Va., the first between annual meetings. It "specifically endorses the principle of tax sharing and the principle of block grants," consolidating the categorical grants; its committee on State and local revenue to draft a federal tax-sharing plan on the individual income tax.
    n: '[*Official Papers, Special Interim Meeting, National Governors'' Conference* (1966), 20–21](https://www.nga.org/wp-content/uploads/2021/03/1966NGAWinterMeeting.pdf#page=24). [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1965-07-27.state-and-city-finance-us]]; [[cal.1966-12-16.elections-1966]].'
  - id: cal.1966-12-18.opinion
    when: Dec. 18
    date: '1966-12-18'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Oct. 21–26: after a peace and the withdrawal of American troops, a South Vietnamese government strong enough to withstand Communist pressure: yes 32 percent, no 44.'
    n: '[[w.gallup-poll]], III, 2040.'
  - id: cal.1966-12-21.opinion
    when: Dec. 21
    date: '1966-12-21'
    thread: opinion
    c: 'Gallup, Dec. 8–13: in politics, Republican 29 percent, Democrat 44, independent 27.'
    n: '[[w.gallup-poll]], III, 2040.'
  - id: cal.1966-12-23.vietnam
    when: Dec. 23–30
    date: '1966-12-23'
    thread: vietnam
    c: 'Dec. 23, with Johnson''s assent, the Joint Chiefs to CINCPAC: no attacks within ten nautical miles of Hanoi''s center until further notice. Dec. 24, Gronouski, back from Washington, to Rapacki: talks in Warsaw, or another third country, still wanted. Dec. 30, Rapacki: the damage done in early December cannot be made up; "we have to consider our role at this stage as terminated."'
    n: 'FRUS 1964–68, IV, docs. [349](https://history.state.gov/historicaldocuments/frus1964-68v04/d349), [351](https://history.state.gov/historicaldocuments/frus1964-68v04/d351), [355](https://history.state.gov/historicaldocuments/frus1964-68v04/d355). See [[cal.1966-12-01.vietnam]]. Names: Gronouski, Rapacki, Johnson.'
    tags: [name:johnson-lyndon-b, name:gronouski-john-a, name:rapacki-adam]
  - id: cal.1966-12-24.vietnam
    when: Dec. 24–26
    date: '1966-12-24'
    thread: vietnam
    c: 'Christmas truce, 48 hours (Check the hours); no bombing of the North. Johnson to Paul VI, Nov. 30: Hanoi''s public offer of a truce had to be accepted "as soon as possible," because of "the propaganda implications," not at the time the Pope had discussed with Rowe.'
    n: 'FRUS 1964–68, XII, doc. [307](https://history.state.gov/historicaldocuments/frus1964-68v12/d307). [[w.gibbons-u-s-government-and-1995]]; [[w.herring-lbj-and-vietnam]]. Names: Rowe, Paul VI, Johnson.'
    tags: [name:johnson-lyndon-b, name:paul-vi, name:rowe-james-h-jr]
  - id: cal.1966-12-25.vietnam
    when: Dec. 25
    date: '1966-12-25'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'The *Times* prints the first of Salisbury''s dispatches from Hanoi, where he arrived Dec. 23: homes in Hanoi damaged by American bombs, civilians killed (Check). Fifteen from North Vietnam, to Jan. 9. Dec. 31, State to all posts: based largely on North Vietnam''s official information, with errors, but not to be "dismissed out of hand."'
    n: 'FRUS 1964–68, IV, doc. [352](https://history.state.gov/historicaldocuments/frus1964-68v04/d352). [[w.salisbury-behind-the-lines-hanoi]]; [[w.salisbury-time-of-change]]; [[w.hammond-public-affairs]], 274–79. See [[cal.1966-12-13.vietnam]]. Names: Salisbury.'
    tags: [name:salisbury-harrison-e]
  - id: cal.1966-12-30.trade
    when: Dec. 30
    date: '1966-12-30'
    thread: trade
    c: 'Herter dies in Washington, 71: Special Representative for Trade Negotiations since 1962, leading the Kennedy Round at Geneva. The Trade Expansion Act''s authority to cut tariffs ends June 30, 1967.'
    n: '[Statement by the President on the Death of Christian A. Herter](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-christian-herter) (Dec. 31, 1966). [[w.preeg-traders-and-diplomats]]; [[w.evans-kennedy-round-in-american]]; [[w.zeiler-american-trade-and-power]]. See [[cal.1964-05-04.trade]]. Names: Herter.'
    tags: [name:herter-christian-a]
  - id: cal.1966-12-31.vietnam
    when: Dec. 31
    date: '1966-12-31'
    thread: vietnam
    c: 'New Year truce, 48 hours (Check the hours). News conference at the ranch: a representative ready to be named today, if Hanoi will name one; the British proposal of talks welcome; U Thant urged to take the lead. On Salisbury''s reports: "only military targets have been authorized."'
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-15) (Dec. 31, 1966). See [[cal.1966-12-24.vietnam]]; [[cal.1966-12-25.vietnam]]. Names: U Thant, Salisbury.'
    tags: [name:johnson-lyndon-b, name:u-thant, name:salisbury-harrison-e]
  - id: cal.1966-12-31.economy
    when: Dec. 31
    date: '1966-12-31'
    thread: economy
    c: 'The same news conference. A tax increase for 1967: no decision. Not a mistake to have asked none in 1966: the act of Mar. 15 and the investment credit''s suspension took "several billions." The year''s deficit $2.3 billion, against $6.4 billion estimated, by his figures; the next not as low.'
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-15) (Dec. 31, 1966). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]. See [[cal.1966-11-29.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-12.court-us
    when: Dec.
    date: 1966-12
    thread: court
    also: [states-and-cities, legislatures, amendments]
    c: 'Dirksen''s drive for a convention on apportionment, at the year''s end: applications from 28 legislatures since 1963, by the Article V Library''s count; 34 needed. New in 1965: Alabama, Arizona, Florida, Georgia, Kentucky, Louisiana, Maryland, Minnesota, Mississippi, Nebraska, New Hampshire, North Carolina, Tennessee and Utah; Virginia in 1964, New Mexico in 1966. Nine States of 1963 apply again in 1965.'
    n: 'The applications in 110–112 Cong. Rec. (1964–66), as the [Article V Library](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0) lists them (Check each against the Record). [[w.bonfield-dirksen-amendment-and-the]]; [[w.macneil-dirksen]]; [[w.dixon-democratic-representation]]. See [[cal.1966-04-20.court]]; [[cal.1963-12.states-and-cities-us]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1966-12.health-us
    when: Dec.
    date: 1966-12
    thread: health
    also: [welfare]
    c: 'Medicaid at the year''s end: 29 States have begun programs. A State without one by 1970 to lose federal matching for medical payments under the old public assistance and Kerr–Mills programs.'
    n: '[[w.weikel-decade-of-medicaid]], 305; [[w.stevens-welfare-medicine-in-america]]. See [[cal.1966-03-31.health-us]].'
