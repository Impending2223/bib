    also: [vietnam-supplemental]
    c: 'Aiken in the Senate''s debate, recalling his speech of October 1966: "What is it that we have not won which we still seek to win?" The problem "social re-engineering," which only the Vietnamese can do. No withdrawal: American forces will stay in Vietnam and Southeast Asia for many years; neither total victory nor withdrawal possible.'
