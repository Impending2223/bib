  - id: cal.1967-03-01.vietnam-congress-2
    when: Mar. 1
    date: '1967-03-01'
    thread: vietnam-congress
    also: [robert-kennedy, vietnam-air-war]
    c: 'Johnson to Jackson, by letter: "We are bombing North Vietnam because it is violating two solemn international agreements"; not to end the war or to punish, but to raise the cost of infiltration; "an integral part of our total policy which aims not to destroy North Vietnam but to force Hanoi to end its aggression." Jackson reads it in the Senate after Robert Kennedy''s speech, Mar. 2, and with McGee holds the floor past 6 p.m., off the evening news; Kennedy neither hawk nor dove but a "pigeon."'
    n: '[[w.shesol-mutual-contempt]], 373–74. To check: [*New York Times*, Mar. 3, 1967](https://timesmachine.nytimes.com/timesmachine/1967/03/03/issue.html), 10 (cited by [[w.shesol-mutual-contempt]], 373). See [[cal.1967-03-02.robert-kennedy]]. Names: Johnson, Jackson, Robert Kennedy, McGee.'
