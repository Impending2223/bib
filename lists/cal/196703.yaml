  - id: cal.1967-03-01.vietnam
    when: Mar. 1
    date: '1967-03-01'
    thread: vietnam-supplemental
    also: [congress, defense]
    c: 'The war''s supplemental, 1967. Senate: Clark''s amendment, rewritten by Mansfield''s substitute, [89–2](https://voteview.com/rollcall/RS0900024), adopted [72–19](https://voteview.com/rollcall/RS0900025): Congress''s support for the forces in Vietnam, for the President''s and others'' efforts to end the war by a negotiated settlement, and for the Geneva accords of 1954, with a conference to be convened. The authorization, S. 665, passes [89–2](https://voteview.com/rollcall/RS0900026).'
    n: '[113 Cong. Rec. 4938](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-1.pdf#page=77) (1967); [4948](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-1.pdf#page=87) (Senate, Mar. 1, 1967: the substitute as amended; the vote). FRUS 1964–68, V, doc. [94](https://history.state.gov/historicaldocuments/frus1964-68v05/d94) (Johnson and Mansfield, Mar. 1). [[w.gibbons-u-s-government-and]], IV, 587–92 (the amendment, its adoption, not its day; the bill''s passage). Gibbons has the amendment adopted Feb. 28 (IV, 590); the vote is in the Record''s Senate day of Mar. 1 (pp. 4862–4993; Gibbons cites 4948), as Voteview dates it. [[w.mann-grand-delusion]], 532–33. See [[cal.1966-03-01.vietnam]]. Names: Joseph Clark, Mansfield, Johnson. Check: Mann, 533, dates the vote of 72–19 Feb. 28.'
