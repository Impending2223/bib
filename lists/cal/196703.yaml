entries:
  - id: cal.1967-03-01.congress
    when: Mar. 1
    date: '1967-03-01'
    thread: congress-powell
    also: [states-and-cities]
    c: Powell excluded. The House refuses the previous question on the Select Committee's resolution, Celler its chairman (seat Powell, censure him, have him pay $40,000, take away his seniority), [202–222](https://voteview.com/rollcall/RH0900012). Curtis's amendment, to exclude him from the 90th Congress and declare the seat vacant, [248–176](https://voteview.com/rollcall/RH0900014); the resolution as amended, [307–116](https://voteview.com/rollcall/RH0900015).
    n: '[113 Cong. Rec., House, Mar. 1, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-2.pdf). *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 489–493 (1969). See [[cal.1967-01-10.congress]]. Names: Powell, Celler, Curtis.'
    tags: [name:powell-adam-clayton-jr, name:celler-emanuel, name:curtis-thomas-b, state:ny, city:nyc]
  - id: cal.1967-03-01.vietnam
    when: Mar. 1
    date: '1967-03-01'
    thread: vietnam-supplemental
    also: [congress, defense]
    c: 'The war''s supplemental, 1967. Senate: Clark''s amendment, rewritten by Mansfield''s substitute, [89–2](https://voteview.com/rollcall/RS0900024), adopted [72–19](https://voteview.com/rollcall/RS0900025): Congress''s support for the forces in Vietnam, for the President''s and others'' efforts to end the war by a negotiated settlement, and for the Geneva accords of 1954, with a conference to be convened. The authorization, S. 665, passes [89–2](https://voteview.com/rollcall/RS0900026).'
    n: '[113 Cong. Rec., Senate, Mar. 1, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-1.pdf). FRUS 1964–68, V, doc. [94](https://history.state.gov/historicaldocuments/frus1964-68v05/d94) (Johnson and Mansfield, Mar. 1). [[w.gibbons-u-s-government-and]], IV, 587–92. Gibbons has the amendment adopted Feb. 28 (IV, 590); the vote is in the Record''s Senate day of Mar. 1 (pp. 4862–4993; Gibbons cites 4948), as Voteview dates it. See [[cal.1966-03-01.vietnam]]. Names: Joseph Clark, Mansfield, Johnson.'
    tags: [name:clark-joseph-s, name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1967-03-01.assassination
    when: Mar. 1
    date: '1967-03-01'
    thread: assassination-garrison
    c: New Orleans. District Attorney Garrison arrests Clay Shaw on a charge of conspiring to murder Kennedy, his witness first questioned by Garrison's office about Feb. 25.
    n: '*Shaw v. Garrison*, [328 F. Supp. 390](https://static.case.law/f-supp/328/case-pdfs/0390-01.pdf) (E.D. La. 1971). To check: [[w.kirkwood-american-grotesque]]; [[w.epstein-counterplot]]; [[w.lambert-false-witness]]. See [[cal.1967-02-17.assassination]]. Names: Garrison, Shaw, Kennedy.'
    tags: [name:kennedy-john-f, name:garrison-jim, name:shaw-clay, state:la, city:new-orleans]
  - id: cal.1967-03-01.opinion
    when: Mar. 1
    date: '1967-03-01'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Feb. 16–21: the Republican convention''s choice between Romney and Nixon: Romney 45 percent, Nixon 41, no opinion 14. Business leaders: Romney 57, Nixon 38.'
    n: '[[w.gallup-poll]], III, 2052. Names: Romney, Nixon.'
    tags: [name:romney-george-w, name:nixon-richard-m]
  - id: cal.1967-03-01.europe-and-the-alliance
    when: Mar. 1
    date: '1967-03-01'
    thread: europe-and-the-alliance
    c: 'The trilateral talks. Johnson''s instructions to McCloy: force levels to be agreed among the allies on security grounds alone, broadly construed; Germany to decide its purchases in the United States and Britain; the rest of the balance of payments cost to be met by cooperation in managing monetary reserves. McCloy with Johnson at the White House, an hour: the draft says nothing on troop cuts, he objects. Johnson: "My judgment is that we''ll have to cut two divisions"; the Germans "have got to put something in the family pot."'
    n: '[FRUS 1964–68, XIII, doc. 238](https://history.state.gov/historicaldocuments/frus1964-68v13/d238) (the letter). [[w.schwartz-lyndon-johnson-and-europe]], 152–55 (the meeting, by the memorandum of conversation, LBJ Library). See [[cal.1966-09-26.europe-and-the-alliance]]. Names: McCloy, Johnson. Check the day of the meeting: Schwartz, 153, Mar. 1; his notes, the memorandum of Mar. 2.'
    tags: [name:johnson-lyndon-b, name:mccloy-john-j]
  - id: cal.1967-03-02.robert-kennedy
    when: Mar. 2
    date: '1967-03-02'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Robert Kennedy in the Senate on the war: stop the bombing of the North and say the United States is ready to negotiate within a week; the talks not to run on long without agreement; neither side to enlarge the war in the South; an international presence to replace American troops by degrees; every major political group in the South a part of the settlement. Rusk the same evening: such proposals made before, Hanoi refusing them (Check). Johnson''s news conference, and his letter to Senator Jackson of Mar. 1 on the reasons for the bombing, released the same day.'
    n: 'Kennedy''s speech, [113 Cong. Rec., Senate, Mar. 2, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-6-2.pdf), 5279–5284. Letter to Senator Jackson Concerning the Bombing of North Vietnam, [1967 Pub. Papers 267](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=335) (released Mar. 2, 1967); The President''s News Conference, [1967 Pub. Papers 259](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=327) (Mar. 2, 1967). FRUS 1964–68, V, docs. [95](https://history.state.gov/historicaldocuments/frus1964-68v05/d95), [96](https://history.state.gov/historicaldocuments/frus1964-68v05/d96) (Johnson with Jackson and Russell, Mar. 2), [105](https://history.state.gov/historicaldocuments/frus1964-68v05/d105) (Rostow on McNamara''s view of the proposal, Mar. 10). Made public: the telephone conversations, FRUS 1964–68, V (2002). [[w.schlesinger-robert-kennedy-and-his]], 772–73 (the bombing halt and talks within the week; Jackson and the letter; the news conference); [[w.gibbons-u-s-government-and]], IV, 593–94. To check: [[w.shesol-mutual-contempt]]; [[w.thomas-robert-kennedy]]. See [[cal.1966-02-19.vietnam]]. Names: Robert Kennedy, Rusk, Johnson, Jackson.'
    src:
      c: 8c96745a
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-6-2.pdf: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=335: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=327: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d95: all'
        - 'w.gibbons-u-s-government-and IV, 593–94: all'
        - 'w.schlesinger-robert-kennedy-and-his 772–73: A, G'
        - 'via w.schlesinger-robert-kennedy-and-his 773 n.69: A'
    tags: [name:kennedy-robert-f, name:rusk-dean, name:johnson-lyndon-b, name:jackson-henry-m]
  - id: cal.1967-03-02.soviet-union
    when: Mar. 2
    date: '1967-03-02'
    thread: defense-abm
    also: [soviet-union]
    c: 'News conference: Kosygin''s reply to Johnson''s letter of Jan. 27 confirms the Soviet government''s willingness to discuss means of limiting the arms race in offensive and defensive nuclear missiles; the talks to begin in Moscow with Thompson. The texts not made public.'
    n: 'The President''s News Conference, [1967 Pub. Papers 259](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=327) (Mar. 2, 1967). FRUS 1964–68, XI, docs. [178](https://history.state.gov/historicaldocuments/frus1964-68v11/d178) (Johnson''s letter, dated Jan. 21), [185](https://history.state.gov/historicaldocuments/frus1964-68v11/d185) (Kosygin''s reply, Feb. 27), [186](https://history.state.gov/historicaldocuments/frus1964-68v11/d186) (Gromyko to Thompson, Feb. 28); XI, doc. [191](https://history.state.gov/historicaldocuments/frus1964-68v11/d191) (the principals on a proposal on strategic offensive and defensive missiles, Mar. 14). [[w.drea-mcnamara-clifford-and-the-2011]], 365 (the reply, and the news conference of Mar. 2). To check: [[w.newhouse-cold-dawn]]; [[w.seaborg-stemming-the-tide]]; [[w.halperin-decision-to-deploy-the]]. See [[cal.1966-12-06.defense]]. Names: Kosygin, Thompson, Johnson. Check: Johnson''s letter dated Jan. 21 by FRUS (doc. 178) and Drea (364); Johnson gave Jan. 27.'
    src:
      c: 5d701154
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=327: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v11/d178: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v11/d191: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 365: A'
        - 'via w.drea-mcnamara-clifford-and-the-2011 365 n.69a: A'
        - 'via w.drea-mcnamara-clifford-and-the-2011 365 n.69b: A'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:thompson-llewellyn-e]
  - id: cal.1967-03-02.vietnam-supplemental
    when: Mar. 2
    date: '1967-03-02'
    thread: vietnam-supplemental
    also: [congress]
    c: 'House. A motion to recommit H.R. 4515, the war''s supplemental authorization, to bar its funds from military operations in or over North Vietnam, refused, [18–372](https://voteview.com/rollcall/RH0900017). Reuss''s offer of the Senate''s Mansfield–Clark declaration, and Yates''s of its first two parts, ruled out of order: matter for Foreign Affairs, not Armed Services.'
    n: '[113 Cong. Rec., House, Mar. 2, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-6-1.pdf), 5139–56 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 597–98. Check: Gibbons calls the 18–372 a roll call on Brown''s amendment, "the sense of the Congress" against funds for operations in or over the North (IV, 598); Voteview, a motion to recommit with instructions. See [[cal.1967-03-01.vietnam]]. Names: Reuss, Yates.'
    tags: [name:reuss-henry-s, name:yates-sidney-r]
  - id: cal.1967-03-02.economy-debt-limit
    when: Mar. 2
    date: '1967-03-02'
    thread: economy-debt-limit
    c: The debt limit to $336 billion to June 30 signed at 10:45 p.m., [81 Stat. 4](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg4-2.pdf).
    n: Statute (K–J Cong. II.J.2). See [[cal.1967-02-08.economy]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-03.vietnam
    when: Mar. 3
    date: '1967-03-03'
    thread: vietnam
    c: 'Wheeler to Westmoreland on the embassy: Rusk no objection to him, but concern at a "complete ''militarization''" of the senior posts in Saigon with elections coming; McNamara has advised Johnson against appointing him out of uniform. Better he stay where he is; Wheeler agrees.'
    n: 'FRUS 1964–68, V, doc. [97](https://history.state.gov/historicaldocuments/frus1964-68v05/d97) (Johnson to Rusk, Mar. 2). [[w.gibbons-u-s-government-and]], IV, 577–78. To check: Wheeler to Westmoreland, JCS 1637-67, Mar. 3, 1967 (Center of Military History, Westmoreland Papers). See [[cal.1967-01-31.vietnam]]. Names: Wheeler, Westmoreland, Rusk, McNamara, Johnson.'
    tags: [name:wheeler-earle, name:westmoreland-william, name:rusk-dean, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1967-03-04.consumers
    when: Mar. 4
    date: '1967-03-04'
    thread: consumers
    c: Betty Furness, the actress and television announcer, named Special Assistant for Consumer Affairs, chairman of the President's Committee on Consumer Interests and executive secretary of the Consumer Advisory Council. She succeeds Esther Peterson, who keeps her post as Assistant Secretary of Labor.
    n: 'Statement by the President Announcing the Appointment of Miss Betty Furness as Special Assistant for Consumer Affairs, [1967 Pub. Papers 271](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=339) (Mar. 4, 1967). To check: [[w.peterson-restless]]. See [[cal.1964-02-05.program]]. Names: Betty Furness, Peterson, Johnson.'
    tags: [name:furness-betty, name:peterson-esther, name:johnson-lyndon-b]
  - id: cal.1967-03-05.opinion
    when: Mar. 5
    date: '1967-03-05'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Feb. 16–21: Romney 48 percent, Robert Kennedy 46, undecided 6. Nixon 48, Kennedy 48, undecided 4; South, Nixon 57, Kennedy 37; East, Kennedy 53, Nixon 45.'
    n: '[[w.gallup-poll]], III, 2053. Names: Romney, Kennedy, Nixon.'
    tags: [name:romney-george-w, name:kennedy-robert-f, name:nixon-richard-m]
  - id: cal.1967-03-06.draft
    when: Mar. 6
    date: '1967-03-06'
    thread: draft
    also: [defense]
    c: 'Special message on Selective Service. The induction authority, expiring June 30, to be extended four years; men drafted from 19, the youngest first, reversing the order of the oldest first; undergraduate deferments not to become exemptions, and no new graduate deferments except in medicine and dentistry; uniform national rules for other deferments; a "fair and impartial random" (FAIR) system to set the order of call; the Marshall Commission kept a year more. The Commission''s report, *In Pursuit of Equity: Who Serves When Not All Serve?*, made public beforehand (Check the date): a lottery among men of 19, the student deferment ended (a majority), the local boards consolidated under regional offices. A panel under Mark Clark had reported to the House Armed Services Committee for keeping the student deferment and against a lottery (Check).'
    n: 'Special Message to the Congress on Selective Service, [1967 Pub. Papers 277](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=345) (Mar. 6, 1967). To check: [[w.service-in-pursuit-of-equity]]; [[w.flynn-draft-1940-1973]]; [[w.baskir-chance-and-circumstance]]; [[w.foley-confronting-the-war-machine]]. See [[cal.1966-07-02.defense]]. Names: Burke Marshall, Mark Clark, Johnson.'
    tags: [name:johnson-lyndon-b, name:marshall-burke, name:clark-mark-w]
  - id: cal.1967-03-06.soviet-union
    when: Mar. 6
    date: '1967-03-06'
    thread: soviet-union-alliluyeva
    also: [south-asia]
    c: New Delhi. Svetlana Alliluyeva, Stalin's daughter, in India since Dec. 20 with the ashes of her Indian companion, walks into the American Embassy and asks asylum in the United States. Bowles has a visa issued; she leaves that night for Rome, then Switzerland.
    n: 'FRUS 1964–68, XIV, docs. [205](https://history.state.gov/historicaldocuments/frus1964-68v14/d205), [208](https://history.state.gov/historicaldocuments/frus1964-68v14/d208) (Bowles''s account, Mar. 18). Made public: FRUS 1964–68, XIV (2001). To check: [[w.sullivan-stalins-daughter]]. Names: Alliluyeva, Stalin, Bowles.'
    tags: [name:stalin-joseph, name:alliluyeva-svetlana, name:bowles-chester]
  - id: cal.1967-03-06.vietnam-thant
    when: Mar. 6
    date: '1967-03-06'
    thread: vietnam-thant
    c: 'Goldberg with U Thant, back from Rangoon and his talk with Hanoi''s officials: their terms (the bombing stopped, the American forces out, the Four Points) no basis for a settlement; his idea, a "stand down" of all military activity on both sides. Rostow to Johnson: "It poses the question of a total ceasefire."'
    n: 'FRUS 1964–68, V, doc. [101](https://history.state.gov/historicaldocuments/frus1964-68v05/d101) (Johnson and Rusk by telephone, 4:03 p.m.: "What does U Thant bring back?"). [[w.gibbons-u-s-government-and]], IV, 574. To check: Goldberg''s report, Mar. 7, 1967, and Rostow''s memorandum (LBJ Library, NSF). See [[cal.1967-03-14.vietnam]]. Names: Goldberg, U Thant, Rostow, Johnson.'
    tags: [name:goldberg-arthur-j, name:u-thant, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1967-03-06.vietnam
    when: Mar. 6
    date: '1967-03-06'
    thread: vietnam
    c: 'Wheeler to Sharp and Westmoreland, back channel: "even broader authority to exert additional military pressure on North Vietnam can be obtained in the near future"; the one obstacle, military complaints of civilian restraints: "the absolute necessity for every military man to keep his mouth shut and get on with the war."'
    n: '[[w.gibbons-u-s-government-and]], IV, 569–70. To check: Wheeler to Sharp and Westmoreland, JCS 1691-67, Mar. 6, 1967 (Center of Military History, Westmoreland Papers). See [[cal.1967-02-22.vietnam-2]]. Names: Wheeler, Sharp, Westmoreland.'
    tags: [name:wheeler-earle, name:sharp-u-s-grant, name:westmoreland-william]
  - id: cal.1967-03-07.congress
    when: Mar. 7
    date: '1967-03-07'
    thread: congress
    c: 'The Senate passes the Legislative Reorganization Act of 1967, S. 355, [75–9](https://voteview.com/rollcall/RS0900043), the Joint Committee''s bill: more professional staff for committees, a legislative assistant for each Senator, review specialists, the guide service. Amendments to change Rule XXII and to require germane debate tabled, Mar. 2, [64–18](https://voteview.com/rollcall/RS0900030) and [68–13](https://voteview.com/rollcall/RS0900028). The House takes no action this Congress (Check).'
    n: 'To check: [[w.zelizer-on-capitol-hill]]; [[w.schickler-disjointed-pluralism]]. See [[cal.1965-03-09.congress]].'
  - id: cal.1967-03-07.vietnam
    when: Mar. 7
    date: '1967-03-07'
    thread: vietnam
    also: [vietnam-thant]
    c: Tuesday lunch, 12:45 to 2:30 p.m., Johnson with Rusk, McNamara, Katzenbach, Rostow and Christian. Johnson wants "an orderly public account" of the efforts to negotiate in the pauses and in Kosygin's week in London; "sick and tired of being afraid to blow a contact"; "every possible item of pressure." U Thant to put his proposal in writing.
    n: '[[w.gibbons-u-s-government-and]], IV, 570, 574. To check: notes of the lunch (LBJ Library, NSF Files of Walt W. Rostow). See [[cal.1967-03-06.vietnam-thant]]. Names: Johnson, Rusk, McNamara, Katzenbach, Rostow, Christian, U Thant, Kosygin.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:katzenbach-nicholas, name:rostow-walt-w, name:christian-george, name:u-thant, name:kosygin-aleksei]
  - id: cal.1967-03-08.vietnam-supplemental
    when: Mar. 8
    date: '1967-03-08'
    thread: vietnam-supplemental
    also: [congress]
    c: House adopts the conference report on the war's supplemental authorization, [364–13](https://voteview.com/rollcall/RH0900018), the Senate's declaration kept. Rivers, "the granddaddy of all hawks," for it.
    n: '[113 Cong. Rec., House, Mar. 8, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt5/pdf/GPO-CRECB-1967-pt5-2-1.pdf), 5768–72 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 599. See [[cal.1967-03-01.vietnam]]. Names: Rivers.'
    tags: [name:rivers-l-mendel]
  - id: cal.1967-03-08.opinion
    when: Mar. 8
    date: '1967-03-08'
    thread: opinion
    also: [soviet-union, china]
    c: 'Gallup, Feb. 16–21: the greater threat to world peace: Communist China 71 percent, Russia 20. In a war between the United States and China, Russia on the American side 48, on China''s 37. Dec. 8–13, 1966, attitude toward Russia: highly favorable 2, mildly favorable 15, mildly unfavorable 28, highly unfavorable 48.'
    n: '[[w.gallup-poll]], III, 2053.'
  - id: cal.1967-03-08.europe-and-the-alliance
    when: Mar. 8
    date: '1967-03-08'
    thread: europe-and-the-alliance
    c: 'The trilateral talks. Johnson with Rusk, McNamara, Fowler, McCloy, Rostow and Bator, 12:45 p.m. McCloy: Britain will take less than full offset, but $40 million lies between its demand and the German offer; Kiesinger''s cabinet meets Mar. 15, and Duckwitz suggests a letter from Johnson before it. McNamara and Fowler against paying any of the gap. Johnson asks whether a bargain might run: the United States to cut one division, Britain one brigade, the Germans and British to split the $40 million.'
    n: '[FRUS 1964–68, XIII, doc. 240](https://history.state.gov/historicaldocuments/frus1964-68v13/d240). [[w.schwartz-lyndon-johnson-and-europe]], 156. See [[cal.1967-03-01.europe-and-the-alliance]]. Names: Rusk, McNamara, Fowler, McCloy, Rostow, Bator, Kiesinger, Duckwitz, Johnson.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:fowler-henry-h, name:mccloy-john-j, name:rostow-walt-w, name:bator-francis-m, name:kiesinger-kurt-georg, name:duckwitz-georg-ferdinand]
  - id: cal.1967-03-09.economy
    when: Mar. 9
    date: '1967-03-09'
    thread: economy
    c: 'Special message: the 7 percent investment credit and accelerated depreciation on buildings, suspended in October to Jan. 1, 1968, to be restored at once; capital spending and orders have fallen.'
    n: 'Special Message to the Congress Recommending Reinstatement of the Investment Tax Credit and Accelerated Depreciation, [1967 Pub. Papers 301](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=369) (Mar. 9, 1967). See [[cal.1966-09-30.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-09.congress-powell
    when: Mar. 9
    date: '1967-03-09'
    thread: congress-powell
    c: Powell and thirteen voters of his district have sued McCormack and others in the District Court (Check the date of filing). The House hires counsel to defend the suit, [254–85](https://voteview.com/rollcall/RH0900020) on the previous question.
    n: 'Check: the Record''s page. *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 493 (1969). See [[cal.1967-03-01.congress]]. Names: Powell, McCormack.'
    tags: [name:powell-adam-clayton-jr, name:mccormack-john-w, state:ny, city:nyc]
  - id: cal.1967-03-10.soviet-union-alliluyeva
    when: Mar. 10
    date: '1967-03-10'
    thread: soviet-union-alliluyeva
    c: 'Kohler to Dobrynin on Alliluyeva: the United States acted on humanitarian grounds and is not encouraging her to come.'
    n: 'FRUS 1964–68, XIV, doc. [206](https://history.state.gov/historicaldocuments/frus1964-68v14/d206). See [[cal.1967-03-06.soviet-union]]. Names: Kohler, Dobrynin, Alliluyeva.'
    tags: [name:kohler-foy-d, name:dobrynin-anatoly, name:alliluyeva-svetlana]
  - id: cal.1967-03-10.vietnam
    when: Mar. 10
    date: '1967-03-10'
    thread: vietnam
    c: 'Rostow to Johnson, 3:45 p.m., on McNamara''s thinking, after McNamara''s paper on Robert Kennedy''s proposal: "deeply troubled" the war will run into 1968; willing to contemplate mining Haiphong, a crisis with Moscow and Peking; "thrashing about for a short cut." Rostow: back him on negotiations and pacification, but caution in giving up the bombing.'
    n: 'FRUS 1964–68, V, doc. [105](https://history.state.gov/historicaldocuments/frus1964-68v05/d105). [[w.gibbons-u-s-government-and]], IV, 570–72 (McNamara''s paper of Mar. 9, by Rostow''s account: eight power plants struck, then attacks held south of the 20th parallel and Moscow asked to open talks through Thompson). Made public: FRUS 1964–68, V (2002). See [[cal.1967-03-02.robert-kennedy]]. Names: Rostow, Johnson, McNamara, Robert Kennedy, Thompson.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:mcnamara-robert-s, name:kennedy-robert-f, name:thompson-llewellyn-e]
  - id: cal.1967-03-11.europe-and-the-alliance
    when: Mar. 11
    date: '1967-03-11'
    thread: europe-and-the-alliance
    c: 'Johnson to Kiesinger, for delivery at once, before the German cabinet''s meeting of Mar. 15: Bonn''s readiness to deal with the British problem "a real contribution to Alliance solidarity"; he will "hold the line against any steps which would significantly weaken NATO"; "a limited rotational plan" can satisfy NATO''s requirements. The nonproliferation treaty.'
    n: '[FRUS 1964–68, XIII, doc. 241](https://history.state.gov/historicaldocuments/frus1964-68v13/d241). [[w.schwartz-lyndon-johnson-and-europe]], 156–57. See [[cal.1967-03-08.europe-and-the-alliance]]. Names: Kiesinger, Johnson.'
    tags: [name:johnson-lyndon-b, name:kiesinger-kurt-georg]
  - id: cal.1967-03-11.vietnam
    when: Mar. 11
    date: '1967-03-11'
    thread: vietnam
    c: 'McPherson to Johnson: without "outward manifestations of searching for peace," the administration identified "along with Ky and the generals, as ''war-lovers''"; the hawks run no risk from a more open effort. Johnson''s reply, Mar. 13, in Rostow''s draft: Rostow to tell him of "the intense planning that is going forward on negotiations."'
    n: '[[w.gibbons-u-s-government-and]], IV, 570 n.26. To check: McPherson to Johnson, Mar. 11, and Johnson to McPherson, Mar. 13, 1967 (LBJ Library, ND 19/CO 312). Names: McPherson, Johnson, Kỳ, Rostow.'
    tags: [name:mcpherson-harry, name:johnson-lyndon-b, name:nguyen-cao-ky, name:rostow-walt-w]
  - id: cal.1967-03-11.vietnam-2
    when: Mar. 11
    date: '1967-03-11'
    thread: vietnam
    c: 'Johnson with Drew Pearson, by Pearson''s notes: the war "going very well"; "Lodge has got to go"; "probably Westmoreland will go," Bruce Palmer in his place. Of Gromyko: "When the Chinese get a little weaker and the Russians stronger, we''re going to have a peace."'
    n: '[[w.gibbons-u-s-government-and]], IV, 570 n.25, 578. Made public: [[w.gibbons-u-s-government-and]], IV (1995). To check: Pearson''s notes of the meeting (LBJ Library, Papers of Drew Pearson). Check: Gibbons gives the date Mar. 11 in a note and "a few days after" Mar. 10 in the text. Names: Johnson, Pearson, Lodge, Westmoreland, Palmer, Gromyko.'
    tags: [name:johnson-lyndon-b, name:pearson-drew, name:lodge-henry-cabot, name:westmoreland-william, name:palmer-bruce-jr, name:gromyko-andrei]
  - id: cal.1967-03-12.india-and-china
    when: Mar. 12
    date: '1967-03-12'
    thread: indonesia
    c: 'Djakarta. The Provisional People''s Consultative Assembly (MPRS) withdraws Sukarno''s mandate by acclamation; Suharto sworn as Acting President at 10:45 p.m. Green, Mar. 15: all effective power formally removed from Sukarno.'
    n: 'FRUS 1964–68, XXVI, docs. [232](https://history.state.gov/historicaldocuments/frus1964-68v26/d232), [233](https://history.state.gov/historicaldocuments/frus1964-68v26/d233). To check: [[w.simpson-economists-with-guns]]. See [[cal.1966-03-11.india-and-china]]. Names: Sukarno, Suharto, Green.'
    tags: [name:sukarno, name:suharto, name:green-marshall]
  - id: cal.1967-03-12.opinion
    when: Mar. 12
    date: '1967-03-12'
    thread: opinion
    also: [vietnam, elections-1968-polls]
    c: 'Gallup, Feb. 16–21: with Vietnam, a better job than Johnson or a worse. Robert Kennedy: better 26 percent, worse 14, no difference 50. Nixon: better 30, worse 18, no difference 41. Romney: better 26, worse 10, no difference 41.'
    n: '[[w.gallup-poll]], III, 2054. Names: Kennedy, Nixon, Romney, Johnson.'
    tags: [name:kennedy-robert-f, name:nixon-richard-m, name:romney-george-w, name:johnson-lyndon-b]
  - id: cal.1967-03-13.latin-america
    when: Mar. 13
    date: '1967-03-13'
    thread: latin-america
    also: [foreign-aid]
    c: 'Special message on the meeting of the American Presidents at Punta del Este in April: Congress asked to approve a commitment of up to $1.5 billion more in aid over five years, about $300 million a year, beyond the $1 billion a year given; support for a Latin American common market.'
    n: 'Special Message to the Congress on the Latin American Summit Meeting, [1967 Pub. Papers 318](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=386) (Mar. 13, 1967). FRUS 1964–68, XXXI, doc. [434](https://history.state.gov/historicaldocuments/frus1964-68v31/d434). To check: [[w.levinson-alliance-that-lost-its]]; [[w.taffet-foreign-aid-as-foreign]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-13.defense-soviet-forces
    when: Mar. 13
    date: '1967-03-13'
    thread: defense-soviet-forces
    c: Memorandum to holders of NIE 11-8-66. A review of the Soviet submarine order of battle. On Oct. 1, 1966, 36 ballistic missile submarines, 7 nuclear, about 100 launchers, not some 45 and 130; about 265 cruise missile launchers, not 250.
    n: '[FRUS 1964–68, X, doc. 174](https://history.state.gov/historicaldocuments/frus1964-68v10/d174). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
    tags: [name:helms-richard]
  - id: cal.1967-03-13.robert-kennedy
    when: Mar. 13
    date: '1967-03-13'
    thread: robert-kennedy
    c: 'Johnson to Drew Pearson, off the record: Robert Kennedy will have "twelve books written about me and twelve books written about him before the next election"; two of his journalists writing on Johnson''s foreign policy.'
    n: '[[w.dallek-flawed-giant]], 454. Names: Johnson, Pearson, Robert Kennedy. Check: the record (Dallek''s note, 454 n.51, reads "Ibid").'
    src:
      c: 4d5f87af
      rows:
        - 'w.dallek-flawed-giant 454: all'
    tags: [name:johnson-lyndon-b, name:pearson-drew, name:kennedy-robert-f]
  - id: cal.1967-03-14.poverty
    when: Mar. 14
    date: '1967-03-14'
    thread: poverty
    c: 'Special message, "America''s Unfinished Business, Urban and Rural Poverty." More for the Office of Economic Opportunity, its administration tightened. Seven aims: community action agencies to plan, audit and hire better; public officials a voice in their policy; a larger part for the States, in rural areas especially; more private enterprise; welfare recipients helped to work; new direction for rural programs; the Economic Opportunity Council to coordinate. Programs aiding the poor in the fiscal 1968 budget, $25.6 billion, $3.6 billion over 1967.'
    n: 'Special Message to the Congress: America''s Unfinished Business, Urban and Rural Poverty, [1967 Pub. Papers 331](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=399) (Mar. 14, 1967). To check: [[w.davies-from-opportunity-to-entitlement]]; [[w.matusow-unraveling-of-america]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-14.vietnam
    when: Mar. 14
    date: '1967-03-14'
    thread: vietnam-thant
    c: 'U Thant''s aide-mémoire: a general standstill truce; preliminary talks; then a reconvened Geneva conference. Thant had seen Hà Văn Lâu, Hanoi''s representative, at Rangoon, Mar. 2.'
    n: 'FRUS 1964–68, V, doc. [98](https://history.state.gov/historicaldocuments/frus1964-68v05/d98). [[w.current-documents-1967]], 892–893. [[w.gibbons-u-s-government-and]], IV, 574–75. To check: [[w.herring-secret-diplomacy-of-the]]; [[w.kraslow-secret-search-for-peace]]. Names: U Thant, Hà Văn Lâu.'
    tags: [name:u-thant, name:ha-van-lau]
  - id: cal.1967-03-14.assassination-garrison
    when: Mar. 14–17
    date: '1967-03-14'
    thread: assassination-garrison
    c: 'New Orleans. Shaw''s preliminary hearing before three judges: the witness testifies to a meeting at which Shaw, David Ferrie and Oswald spoke of killing the President; Shaw held for trial (Check the dates).'
    n: 'Check: the transcript. See [[cal.1967-03-01.assassination]]. Names: Shaw, Ferrie, Oswald.'
    tags: [name:shaw-clay, name:ferrie-david-w, name:oswald-lee-harvey, state:la, city:new-orleans]
  - id: cal.1967-03-15.vietnam
    when: Mar. 15
    date: '1967-03-15'
    thread: vietnam
    c: 'Nashville, to a joint session of the Tennessee legislature, after the Hermitage: the bombing of military targets in the North, its three purposes, the sanctuary denied, the penalty exacted, infiltration limited or made dearer; not decisive, but a serious problem for Hanoi. Bunker to succeed Lodge in Saigon; Locke, Ambassador to Pakistan, his deputy; Komer to Saigon for pacification.'
    n: 'Address on U.S. Policy in Vietnam Delivered Before a Joint Session of the Tennessee State Legislature, [1967 Pub. Papers 348](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=416) (Mar. 15, 1967). FRUS 1964–68, V, doc. [97](https://history.state.gov/historicaldocuments/frus1964-68v05/d97) (Johnson to Rusk, Mar. 2: Westmoreland considered for the embassy). [[w.gibbons-u-s-government-and]], IV, 600 (the address), 578 (Bunker). To check: [[w.schaffer-ellsworth-bunker]]; [[w.jones-blowtorch]]. Names: Bunker, Lodge, Locke, Komer, Johnson.'
    tags: [name:johnson-lyndon-b, name:bunker-ellsworth, name:lodge-henry-cabot, name:locke-eugene-m, name:komer-robert-w, state:tn, city:nashville]
  - id: cal.1967-03-15.opinion
    when: Mar. 15
    date: '1967-03-15'
    thread: opinion
    also: [jobs-and-wages, labor-disputes]
    c: 'Gallup, special survey: no strike to last more than seven days, then a Government-appointed committee to settle it, binding on both: favor 54 percent, oppose 36; business leaders 22 and 70. Unions covering whole industries under the antitrust laws: agree 45, disagree 25; business leaders 88 and 8. Business leaders, new ways to settle industry-wide strikes: yes 83.'
    n: '[[w.gallup-poll]], III, 2054–55.'
  - id: cal.1967-03-16.soviet-union
    when: Mar. 16
    date: '1967-03-16'
    thread: soviet-union-consular
    c: 'The Senate consents to the Consular Convention with the Soviet Union, signed at Moscow June 1, 1964, [19 U.S.T. 5018](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-19-4/lltreaties-19-4.pdf#page=940), [655 U.N.T.S. 214](https://treaties.un.org/doc/Publication/UNTS/Volume%20655/volume-655-I-9383-English.pdf), [66–28](https://voteview.com/rollcall/RS0900050). Reported by Foreign Relations, 15–4, Feb. 28. Refused: an amendment ending criminal immunity for Soviet consular staff, Mar. 9, [26–53](https://voteview.com/rollcall/RS0900044); reservations holding it back until the Soviets met conditions on freedom of the press, Mar. 14, [22–65](https://voteview.com/rollcall/RS0900045), or until the President advised Congress that the war in Vietnam was over or that Soviet aid to North Vietnam was not delaying the withdrawal of American troops, Mar. 15, [25–67](https://voteview.com/rollcall/RS0900046). Johnson ratifies Mar. 31. In force July 13, 1968 (Check).'
    n: 'Statement by the President Following Senate Approval of the Consular Convention With the U.S.S.R., [1967 Pub. Papers 356](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=424) (Mar. 16, 1967). FRUS 1964–68, XIV, doc. [207](https://history.state.gov/historicaldocuments/frus1964-68v14/d207). See [[cal.1966-10-07.europe-and-the-alliance]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-16.vietnam-supplemental
    when: Mar. 16
    date: '1967-03-16'
    thread: vietnam-supplemental
    also: [congress, defense]
    c: The war's supplemental authorization signed, [81 Stat. 5](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg5.pdf). The appropriation, some $12 billion, through the House, [385–11](https://voteview.com/rollcall/RH0900022), after Brown's amendment, no funds of the act for a plan to invade the North with ground forces "except in time of war," is refused on a division, 2–123.
    n: '[113 Cong. Rec., House, Mar. 16, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-1-1.pdf), 6886–89 (the House; Gibbons''s pages). Statement by the President Upon Signing Bill Authorizing Supplemental Appropriations for the Department of Defense, [1967 Pub. Papers 356](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=424) (Mar. 16, 1967). Statute (K–J Cong. II.J.2). [[w.gibbons-u-s-government-and]], IV, 600–02 (the House). See [[cal.1967-03-01.vietnam]]. Gibbons dates the House''s passage May 16 (IV, 602), a misprint: Voteview and the Record''s day, Mar. 16. Names: Johnson, Brown.'
    tags: [name:johnson-lyndon-b, name:brown-george-e-jr]
  - id: cal.1967-03-16.economy
    when: Mar. 16
    date: '1967-03-16'
    thread: economy
    c: The House passes H.R. 6950, the investment credit restored, [386–2](https://voteview.com/rollcall/RH0900023).
    n: 'Check: the Record''s page. See [[cal.1967-03-09.economy]].'
  - id: cal.1967-03-17.vietnam-support
    when: Mar. 17
    date: '1967-03-17'
    thread: vietnam-support
    c: 'Rostow sends Johnson Washburn''s letter and plan of Mar. 15: weekly ten-minute fireside reports on the war; meetings with "opinion leaders"; a bipartisan national citizens'' committee. Johnson: "Walt: I like this. Bring this up on the way out—it''s very important."'
    n: '[[w.gibbons-u-s-government-and]], IV, 603–04. To check: Rostow to Johnson, Mar. 17, 1967, with Washburn''s letter and Johnson''s reply (LBJ Library, Ex ND 19/CO 312). See [[cal.1967-02-06.vietnam-support]]. Names: Rostow, Johnson, Washburn.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:washburn-abbott-m]
  - id: cal.1967-03-18.vietnam
    when: Mar. 18
    date: '1967-03-18'
    thread: vietnam-program-5
    also: [defense]
    c: 'Westmoreland to Sharp, MACV 09101, "Force Requirements": the 470,000 of Program Four will not permit operations "of the scope and intensity required to avoid an unreasonably protracted war." Asked: a "minimum essential force" of 2⅓ divisions more, as soon as possible and not later than July 1, 1968; an "optimum force" of 4⅔ divisions, with ten tactical fighter squadrons.'
    n: 'FRUS 1964–68, V, doc. [110](https://history.state.gov/historicaldocuments/frus1964-68v05/d110). Made public: [[w.pentagon-papers]] (1971). [[w.gibbons-u-s-government-and]], IV, 611–12; [[w.drea-mcnamara-clifford-and-the-2011]], 136 (the request of Mar. 18; its forces in men, as justified Mar. 28); [[w.poole-joint-chiefs-of-staff-2012]], 54 (the two forces); [[w.cosmas-joint-chiefs-of-staff]], 44. To check: [[w.berman-lyndon-johnsons-war]]; [[w.westmoreland-soldier-reports]]; [[w.sorley-westmoreland]]; [[w.herring-lbj-and-vietnam]]. Names: Westmoreland, Sharp.'
    src:
      c: f810091f
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d110: all'
        - 'w.gibbons-u-s-government-and IV, 611–12: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 136: A-C'
        - 'via w.drea-mcnamara-clifford-and-the-2011 136 n.71a: A'
        - 'w.poole-joint-chiefs-of-staff-2012 54: B-C'
        - 'w.cosmas-joint-chiefs-of-staff 44: all'
        - 'via w.cosmas-joint-chiefs-of-staff 44 n.36a: all'
    tags: [name:westmoreland-william, name:sharp-u-s-grant]
  - id: cal.1967-03-18.vietnam-thant
    when: Mar. 18
    date: '1967-03-18'
    thread: vietnam-thant
    c: The United States accepts Thant's proposal, asking that the arrangements be worked out with both sides. Saigon accepts with proposals of its own.
    n: 'FRUS 1964–68, V, docs. [111](https://history.state.gov/historicaldocuments/frus1964-68v05/d111), [112](https://history.state.gov/historicaldocuments/frus1964-68v05/d112). [[w.gibbons-u-s-government-and]], IV, 575. See [[cal.1967-03-14.vietnam]]. Names: U Thant.'
    tags: [name:u-thant]
  - id: cal.1967-03-18.states-and-cities-us
    when: Mar. 18
    date: '1967-03-18'
    thread: states-and-cities
    c: 'White House Conference with the Governors. Johnson on "a new federalism": grants in aid $15 billion this year, $30 million in 1920, and could quadruple in five years; 400 authorities for grant programs. Authority to the States for "local treatment of local problems"; the governors to advise and consult with the President.'
    n: 'Remarks at a White House Conference With the Governors, [1967 Pub. Papers 369](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=437); Remarks at the Governors'' Luncheon, [1967 Pub. Papers 372](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=440); The President''s Toast at a Dinner for the Governors, [1967 Pub. Papers 374](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=442) (Mar. 18, 1967). To check: [[w.sabato-goodbye-to-good-time]]; [[w.conlan-new-federalism]]; [[w.sparacino-democratic-and-republican-governors]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-03-19.opinion
    when: Mar. 19
    date: '1967-03-19'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Mar. 9–14: Republicans'' choice for 1968: Nixon 39 percent, Romney 30, Rockefeller 9, Reagan 8, Percy 4, Hatfield 4, Lindsay 2; no preference 4. The best candidate: Nixon 39, Romney 34. Of the two: Nixon 53, Romney 41.'
    n: '[[w.gallup-poll]], III, 2055. Names: Nixon, Romney, Rockefeller, Reagan, Percy, Hatfield, Lindsay.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:rockefeller-nelson, name:reagan-ronald, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v]
  - id: cal.1967-03-20.vietnam
    when: Mar. 20–21
    date: '1967-03-20'
    thread: vietnam
    c: 'Guam. Johnson with Thiệu and Kỳ; Rusk, McNamara, Wheeler, Westmoreland, Lodge, Bunker, Harriman, Sharp, Komer with him. The Constituent Assembly had adopted the constitution, Mar. 18, unanimously; Kỳ: the Directorate agrees. Bunker, Locke and Komer presented as the new team. Joint statement, Mar. 21: a President to be elected under the constitution within four to five months, a legislature shortly after; village and hamlet elections from April; pacification "now beginning to show encouraging results." Johnson back in Washington the night of Mar. 21.'
    n: 'Statement by the President on the New Constitution Adopted by the Constituent Assembly of the Republic of Vietnam, [1967 Pub. Papers 379](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=447) (Mar. 20, 1967); Joint Statement Following the Meeting in Guam With Chairman Thieu and Prime Minister Ky, [1967 Pub. Papers 381](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=449) (Mar. 21, 1967); The President''s News Conference in Guam Following the Conference, [1967 Pub. Papers 382](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=450) (Mar. 21, 1967). FRUS 1964–68, V, docs. [115](https://history.state.gov/historicaldocuments/frus1964-68v05/d115), [116](https://history.state.gov/historicaldocuments/frus1964-68v05/d116), [119](https://history.state.gov/historicaldocuments/frus1964-68v05/d119). [[w.gibbons-u-s-government-and]], IV, 609–11; [[w.cosmas-joint-chiefs-of-staff]], 104 (the conference; the constitution, Mar. 18); [[w.johnson-vantage-point]], 259–60. To check: [[w.schaffer-ellsworth-bunker]]; [[w.jones-blowtorch]]. See [[cal.1966-09-11.vietnam]]; [[cal.1967-03-15.vietnam]]. Names: Johnson, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Rusk, McNamara, Wheeler, Westmoreland, Lodge, Bunker, Harriman, Sharp, Komer, Locke.'
    src:
      c: b6ff26ac
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=447: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=449: all'
