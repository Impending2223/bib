    thread: intelligence
    also: [students]
    c: 'The Katzenbach committee''s report, Katzenbach, Gardner and Helms: "No federal agency shall provide any covert financial assistance or support, direct or indirect, to any of the nation''s educational or private voluntary organizations"; support given to end as quickly as possible without destroying the organizations. Johnson accepts the policy and asks Rusk to head a committee on a public-private mechanism to fund such activities abroad openly.'
    n: 'Statement by the President Concerning the Report on the Relationship Between the CIA and Private Voluntary Organizations, [1967 Pub. Papers 403](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=471) (Mar. 29, 1967); the report, 3 *Weekly Comp. Pres. Doc.* 556. FRUS 1964–68, XXXIII, doc. [415](https://history.state.gov/historicaldocuments/frus1964-68v33/d415). To check: [[w.paget-patriotic-betrayal]]. See [[cal.1967-02-13.intelligence]]. Names: Katzenbach, Gardner, Helms, Rusk, Johnson.'
