    n: 'Statement by the President on the New Constitution Adopted by the Constituent Assembly of the Republic of Vietnam, [1967 Pub. Papers 379](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=447) (Mar. 20, 1967); Joint Statement Following the Meeting in Guam With Chairman Thieu and Prime Minister Ky, [1967 Pub. Papers 381](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=449) (Mar. 21, 1967); The President''s News Conference in Guam Following the Conference, [1967 Pub. Papers 382](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=450) (Mar. 21, 1967). [FRUS 1964–68, V, doc. 115](https://history.state.gov/historicaldocuments/frus1964-68v05/d115); [doc. 116](https://history.state.gov/historicaldocuments/frus1964-68v05/d116); [doc. 119](https://history.state.gov/historicaldocuments/frus1964-68v05/d119). [[w.gibbons-u-s-government-and]], IV, 609–10; [[w.cosmas-joint-chiefs-of-staff]], 104 (the conference; the constitution, Mar. 18); [[w.johnson-vantage-point]], 259–60; [[w.berman-lyndon-johnsons-war]], 32–33 (Thiệu and Kỳ with the draft constitution; Bunker and Komer named before; Johnson to Westmoreland, "Are they bringing in as many as they''re losing?", Westmoreland: the crossover "perhaps this month, or next month," the order of battle 287,000 and leveling; Mar. 21, his review corps by corps, Sharp on the bombing); [[w.macv-command-history-1967]], 581 (Revolutionary Development the focus of the conference; Kỳ addresses the conferees on the army''s part in it); [[w.shesol-mutual-contempt]], 382–83 (some thirty hours; "hasty and threadbare"; Johnson home: "constructive two days"); [[w.drea-mcnamara-clifford-and-the-2011]], 136 (Westmoreland, Mar. 21: unless infiltration is stopped, "this war could go on indefinitely"). [[w.westmoreland-soldier-reports]], 213–14 (Johnson to the airmen at Andersen; McNamara and Westmoreland agree on Abrams as his deputy; Westmoreland''s review, the war "could go on indefinitely"; his plan with Komer to put pacification under MACV). To check: [[w.schaffer-ellsworth-bunker]]; [[w.jones-blowtorch]]. See [[cal.1966-09-11.vietnam]]; [[cal.1967-03-15.vietnam]]. Names: Johnson, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Rusk, McNamara, Wheeler, Westmoreland, Lodge, Bunker, Harriman, Sharp, Komer, Locke.'
