  - id: cal.1967-03-01.vietnam-congress-3
    when: Mar. 1
    date: '1967-03-01'
    thread: vietnam-congress
    also: [vietnam-supplemental]
    c: 'Javits, as the Senate''s debate on the supplemental ends: the Tonkin Gulf resolution out of date, to be replaced; he will vote for the supplemental, but the United States should offer more conciliatory terms for talks and stop bombing the North; first, "legitimize the Saigon government at its roots" by the constitution and the elections.'
    n: '[[w.gibbons-u-s-government-and]], IV, 592. To check: [113 Cong. Rec. 4938](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-1.pdf#page=77) (Senate, Mar. 1, 1967) (cited by [[w.gibbons-u-s-government-and]], IV, 592 n.100). See [[cal.1967-03-01.vietnam]]. Names: Javits.'
