  - id: cal.1967-03-16.soviet-union
    when: Mar. 16
    date: '1967-03-16'
    thread: soviet-union-consular
    c: 'The Senate consents to the Consular Convention with the Soviet Union, signed at Moscow June 1, 1964, [19 U.S.T. 5018](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-19-4/lltreaties-19-4.pdf#page=940), [655 U.N.T.S. 214](https://treaties.un.org/doc/Publication/UNTS/Volume%20655/volume-655-I-9383-English.pdf), [66–28](https://voteview.com/rollcall/RS0900050). Reported by Foreign Relations, 15–4, Feb. 28. Refused: an amendment ending criminal immunity for Soviet consular staff, Mar. 9, [26–53](https://voteview.com/rollcall/RS0900044); reservations holding it back until the Soviets met conditions on freedom of the press, Mar. 14, [22–65](https://voteview.com/rollcall/RS0900045), or until the President advised Congress that the war in Vietnam was over or that Soviet aid to North Vietnam was not delaying the withdrawal of American troops, Mar. 15, [25–67](https://voteview.com/rollcall/RS0900046). Johnson ratifies Mar. 31. In force July 13, 1968 (Check). Republicans, 23–13, for: Morton organizes them, Dirksen comes round.'
    n: 'Statement by the President Following Senate Approval of the Consular Convention With the U.S.S.R., [1967 Pub. Papers 356](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=424) (Mar. 16, 1967). FRUS 1964–68, XIV, doc. [207](https://history.state.gov/historicaldocuments/frus1964-68v14/d207). [[w.hess-republican-establishment]], 87–88, 235 (the Republicans, 23–13; Morton''s work for it; Percy); [[w.rusk-as-i-saw-it-1990]], 354–55. [[w.kabaservice-rule-and-ruin]], 203 (Morton''s lead, Eisenhower consulted; the Republicans 23 to 13). See [[cal.1966-10-07.europe-and-the-alliance]]. Names: Johnson, Morton, Dirksen.'
