  - id: cal.1967-03-01.europe-and-the-alliance
    when: Mar. 1
    date: '1967-03-01'
    thread: europe-and-the-alliance
    c: 'The trilateral talks. Johnson''s instructions to McCloy: force levels to be agreed among the allies on security grounds alone, broadly construed; Germany to decide its purchases in the United States and Britain; the rest of the balance of payments cost to be met by cooperation in managing monetary reserves. McCloy with Johnson at the White House, an hour: the draft says nothing on troop cuts, he objects. Johnson: "My judgment is that we''ll have to cut two divisions"; the Germans "have got to put something in the family pot."'
    n: '[FRUS 1964–68, XIII, doc. 238](https://history.state.gov/historicaldocuments/frus1964-68v13/d238) (the letter). [[w.schwartz-lyndon-johnson-and-europe]], 152–55 (the meeting, by the memorandum of conversation, LBJ Library). [[w.gavin-gold-dollars-and-power]], 160–61 (the meeting). To check: memorandum of conversation, Johnson and McCloy, Mar. 2, 1967, NSF, NSC Histories, Trilateral Negotiations and NATO, Box 50, LBJ Library (cited by [[w.schwartz-lyndon-johnson-and-europe]], 154–55 nn.48–49). See [[cal.1966-09-26.europe-and-the-alliance]]. Check: Gavin, 160, has Johnson favor Rusk''s rotation of one division and three air wings, not a cut of two divisions. Names: McCloy, Johnson. Check the day of the meeting: Schwartz, 153, Mar. 1; his notes, the memorandum of Mar. 2.'
