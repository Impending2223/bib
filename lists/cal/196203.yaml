    n: '[[w.dikotter-cultural-revolution]], 22 n.24. Made public: 2007 (Dai Yushan in *Zhengming*, the printing the note names). To check: Dai Yushan, "Siqing dayuan''an de zhenxiang," *Zhengming*, Jan. 2007, 82–83 (cited by [[w.dikotter-cultural-revolution]], 22 n.24). Names: Liu Shaoqi, Zhou Enlai, Mao Zedong.'
