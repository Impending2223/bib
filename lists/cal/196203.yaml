    time: 1962-03-01T08:00Z
    thread: china-leadership
    also: [soviet-union]
    c: 'Deng Xiaoping 邓小平 and Yang Shangkun 杨尚昆, 4 to 6 p.m., receive the Soviet Ambassador, Chervonenko 契尔沃年科. He hands over the CPSU Central Committee''s letter to the CCP''s: differences to be narrowed as far as possible, unity kept; talks hinted at, nothing proposed.'
    n: '[[w.yang-shangkun-riji]], II, 129 (Mar. 1, 1962); [[w.deng-xiaoping-nianpu-1904]], III, 1694 (Mar. 1, 1962; afternoon; Deng receives Chervonenko and the CPSU''s letter of Feb. 22, uneasy at the two parties'' relations. Deng: the unity of the two countries and parties of great weight now; the Chinese party cares no less than any; relations abnormal for years, as the letter admits; to be solved on a common base, Marxism–Leninism, the Moscow Declaration and Statement); [[w.mao-zedong-zhuan]], V, ch. 70 nn.1, 2 (Mar. 1: Chervonenko hands Deng Xiaoping the CPSU letter of Feb. 22: the differences to be narrowed, unity kept; talks hinted at, nothing proposed; the book also cites Yang Shangkun''s diary, II, 129). The words: 下午4时到6时 (II, 129). [[w.brothers-in-arms]], 374–375 (the Soviet record, Mar. 1: Deng and Yang Shangkun reserved and nervous, expecting a document of another kind; the letter on improving relations with Albania; Deng: the larger party should take the initiative; about an hour and a half; at parting, "Your letter calls for solidarity and that is good"). Made public: 1998 ([[w.brothers-in-arms]], 374–375, the Soviet record, excerpted). To check: Record of Deng Xiaoping''s 邓小平 talk with Chervonenko 契尔沃年科, Mar. 1, 1962, receiving the CPSU Central Committee''s letter of Feb. 22 (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.1). See [[cal.1962-02-22.soviet-union]]. Names: Deng Xiaoping, Yang Shangkun, Chervonenko.'
    src:
      c: d4bfdaff
      rows:
        - 'w.yang-shangkun-riji II, 129: all'
        - 'w.deng-xiaoping-nianpu-1904 III, 1694: ?'
        - 'w.mao-zedong-zhuan V, ch. 70 nn.1, 2: B-C'
        - 'via w.mao-zedong-zhuan V, ch.70 n.1a: B-C'
