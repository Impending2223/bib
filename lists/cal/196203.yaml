    date: '1962-03-27'
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: 'Peking, the Xilou of Zhongnanhai. The Politburo, Liu Shaoqi presiding, takes up the CPSU Central Committee''s letter of Feb. 22, a month after its date. It reads the letter three ways (a wish to ease relations; a pretext to put the blame for worse ones on China; an attempt to part the CCP from Albania and the other left parties) and decides to hold to principle and unity, and to answer with a proposal for a conference of the brother parties with no precondition, in steps: CPSU–CCP talks, CPSU–Albanian talks, a three-party meeting, the twelve ruling parties, then the 81. The writers of the 1960 Reply to form a group to collect the Soviet breaches of the Statement since 1960, and the Liaison Department, the Foreign Ministry, Xinhua and the Investigation Department each another.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 492–494 (the Politburo''s meeting of Mar. 27 in the Xilou (西楼), Liu Shaoqi presiding; the reading of the letter in three ways; the five steps (CPSU–CCP, CPSU–Albanian, the three, the twelve, the 81; "they can talk first, to prepare the conference, not to settle the others'' affairs"); the reply to be "reasonable, right and moving," without Khrushchev''s name; the Indonesian, Vietnamese and New Zealand parties'' proposals of Feb. and Mar. for CPSU–CCP talks and a conference, which the CPSU had refused in Feb., to be taken up and answered after the CPSU; the writers to move to the Diaoyutai when the material was in). Made public: 1999. Check: the date. The diary has Liu Shaoqi''s Xilou meeting on how to read and answer the CPSU letter on Mar. 3 ([[w.yang-shangkun-riji]], II, 130) and on the draft reply on Mar. 30 (II, 138); on Mar. 27 the National People''s Congress opened (II, 137). See [[cal.1962-03-20.china-leadership]]. Names: Liu Shaoqi. Check: whether this is the Politburo''s first reading of the letter: the nianpu has a Central Committee draft reply of Mar. 15 ([[cal.1962-03-20.china-leadership]]), a fortnight before Wu''s meeting; Wu does not mention a draft.'
    src:
