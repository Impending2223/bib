  - id: cal.1962-03-22.soviet-union-leadership
    when: Mar. 22
    date: '1962-03-22'
    thread: soviet-union-leadership
    c: 'The Presidium, Protocol 22 continued, on the party''s guidance of industry, Khrushchev''s question, Khrushchev, Podgorny and thirteen others speaking: a year gone and the works not built; resistance in Gosplan and the State Economic Council; perhaps committees by branch. His posing of the question approved; a commission under him, with Kozlov, Kosygin, Zasyadko, Novikov, Ustinov and Rudnev, to draft proposals; Voronov, Podgorny and the republics'' and regions'' secretaries to give theirs. The decree on production administrations for farming adopted, to be published. Grossman''s letter to Khrushchev of Feb. 23 on his novel *Zhizn'' i sud''ba*: Suslov to receive him: "Ваше произведение за нас или против? Советуем быть осторожным" (Is your work for us or against? We advise you to be careful).'
    n: 'Protocol 22, items II, III and VIII. [[w.prezidium-tsk-kpss-1954]], I, 550–51 (doc. 244, Malin''s notes); III, 251–55 (P 22/II, P 22/III, P 22/VIII; Grossman''s letter, 252–55). See [[cal.1962-03-09.soviet-union-leadership]]. Made public: 2003; Grossman''s letter, 1997 (III, 255). Names: Khrushchev, Kozlov, Kosygin, Zasyadko, Novikov, Ustinov, Rudnev, Voronov, Podgorny, Grossman, Suslov.'
    tags: [name:khrushchev-nikita-s, name:kozlov-frol-r, name:kosygin-aleksei, name:voronov-gennady-i, name:podgorny-nikolai-v, name:suslov-mikhail-a, polity:ussr, name:ustinov-dmitriy-f]
  - id: cal.1962-03-22.china-leadership
    when: Mar. 22
    date: '1962-03-22'
