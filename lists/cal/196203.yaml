  - id: cal.1962-03-07.china-leadership-3
    when: Mar. 7
    date: '1962-03-07'
    place: peking
    thread: china-leadership
    c: 'Chen Yun to the Finance and Economics Small Group: no haste over the Third Five-Year Plan; the ten years in two phases, recovery first; a sharp cut in the 1962 targets; three balances (revenue and expenditure, loans and deposits, supply and demand). He argues against Wang Heshou''s seven-year steel target of 25 to 30 million tons, and asks for 150,000 tons more fish a year, half a jin a month for each of 60 million city people, and half the state''s pork purchases for the cities.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 197–99; [[w.mao-zedong-zhuan]], V, ch. 69 n.29 (Mar. 7: Chen Yun to the Central Finance and Economics Small Group: recovery now, the plan for 1962 much adjusted, the weight on farming and the market; short lines, not long, to be the basis of balance). [[w.jian-zhou-enlai]], 464 (the group''s March meeting: Chen Yun for cutting heavy industry and construction in the 1962 budget and plan); [[w.chen-yun-nianpu-xiuding]], III, 128–130 (Mar. 7: no ten-year plan now, a five-year plan first, recovery the present task; no haste over targets for the Third Five-Year Plan; this year''s plan adjusted much and then left alone, not "a year''s plan, planned all year"; industry and construction slowed for farming and the market: steel for motor junks, half a jin of fish a month in the big and middle cities, half a jin of pork, a political question; agriculture and the market a matter of the people''s livelihood, to be a state policy; "cut to the sinew and bone" in heavy industry and construction; overall balance from the start, by the short line; materials more centralized in recovery; the Planning and Economic Commissions and the State Council''s Agriculture and Forestry Office 农办 to study farming and turn to it; in the early years he cut construction to what the state could bear and allowed no new hands without materials; different views to be encouraged. Zhou interjects the couplet). Made public: 1983 ([[w.lardy-chen-yuns-strategy-for]], 202–207, the translation, cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43b). To check: [[w.chen-yun-tongzhi-wengao]], 173 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43a); [[w.lardy-chen-yuns-strategy-for]], 202 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43b); [[w.chen-yun-wenxuan-1956]], 198 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43c); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1054 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43d); [[w.lardy-chen-yuns-strategy-for]], 202–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.44a); [[w.macfarquhar-origins-of-the-cultural]], I, 57–58 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.44b); [[w.liqun-xiang-chen-yun-tongzhi]], 82 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.45a); [[w.chen-yun-yu-xin]], 514–28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.45b); [[w.lardy-chen-yuns-strategy-for]], 206 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.46a); [[w.macfarquhar-origins-of-the-cultural]], II, 165–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.46b); [[w.lardy-chen-yuns-strategy-for]], 206–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 198 n.47); [[w.lardy-chen-yuns-strategy-for]], 204–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.50a); [[w.chen-yun-tongzhi-wengao]], 175 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.50b); Chen Yun 陈云, speech at the Central Finance and Economics Small Group 中央财经小组, Mar. 7, 1962; [[w.chen-yun-wenxuan-1956]] (the note cites vol. 3 of the 1995 ed., 207–215) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.29); [[w.chen-yun-nianpu-1905]], III, 133–135 (cited by [[w.jian-zhou-enlai]], 464 n.94). Names: Chen Yun. Check: Made public: [[w.chen-yun-tongzhi-wengao]] (1980), 173, which MacFarquhar cites for the speech, is earlier if it was openly sold.'
