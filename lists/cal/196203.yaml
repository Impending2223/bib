  - id: cal.1962-03-02.china-leadership-5
    when: Mar. 2
    date: '1962-03-02'
    thread: china-leadership
    c: 'Lin Piantian 林翩天 and Wu Guoxian 吳國憲, bureau chiefs of the Ministry of Grain, report to the Ministry on Sichuan 四川 after an investigation. Chengbei 城北 commune, Bishan 璧山 county, Jiangjin 江津 prefecture: 9,818 people, 548 dead in 1960 (7 percent as printed); in Gantang 甘塘 brigade, 589 people, 102 dead in 1961 and 58 with edema now; its fourth team of 143 lost 3 percent of its population in Nov. and Dec. 1961. At Xiaowan 小灣 yard of Lailong 來龍 brigade, Chengxi 城西 commune, 7 households with 37 people have lost 12 and 11 are in hospital; Zhang Shifu''s 張世富 family of five has died out; two households have lost both parents and keep two orphans; one has lost one parent and the other is ill, and a child of 8 or 9 is alone; all but the team leader''s family of seven have edema or emaciation. Huangjiao 黃角 brigade has a case of a son killed and eaten. The report gives Jiangbei 江北 county''s patients at 79,469 in Dec. 1961 and 133,610 on Jan. 15, 1962, 22.1 percent of the farm population, and 27,305 dead, 4.5 percent; an average of 1,678 deaths a month Jan. to Oct. 1961, 3,387 in Nov., 7,225 in Dec., 2,805 in the first half of Jan. 1962. Bishan lost over 20,000 in 1960 and again in 1961.'
    n: '[[w.yang-jisheng-mubei]], I, 208–209. Made public: 2008. To check: Lin Piantian 林翩天 and Wu Guoxian 吳國憲, bureau chiefs of the Ministry of Grain, "Guanyu Sichuan qingkuang de baogao" 《關於四川情況的報告》, Mar. 2, 1962 (cited by [[w.yang-jisheng-mubei]], I, 209 n.46). Check: 548 of 9,818 is 5.6 percent; the book prints 7 percent.'
    src:
