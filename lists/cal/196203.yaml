  - id: cal.1962-03.latin-america-4
    when: Mar.
    date: 1962-03
    thread: latin-america
    c: 'With Goodwin out of the country, Ball moves Woodward, Assistant Secretary of State for Latin America, to be ambassador to Spain, and puts Edwin Martin in his place. Ball to Woodward: "because you haven''t been able to control that boy." Woodward: "How can I control him? He''s a White House man."'
    n: '[[w.goodwin-remembering-america]], 215 (Goodwin''s account, after newspaper accounts "whose accuracy I later confirmed"). See [[cal.1962-03.latin-america-3]]. Names: Ball, Woodward, Martin, Goodwin. Check: the day.'
