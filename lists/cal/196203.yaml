    thread: china-leadership
    c: 'The enlarged Standing Committee (Mar. 12–13), Liu Shaoqi presiding, adopts the Central Committee''s endorsement of speeches by Chen Yun, Li Fuchun and Li Xiannian to the Party groups of the State Council''s commissions and ministries, and Liu''s proposal that Chen Yun head the Central Finance and Economic Group. Liu: Mao is away; report to him at once; if he agrees, issue; if not, discuss again.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 12, 1962 (the entry for Mar. 12 and 13). [[w.zhou-enlai-nianpu-1949]], II, 463 (Mar. 12–13, 1962: Zhou Enlai attends the enlarged Standing Committee; it takes up Chen Yun''s Feb. 26 speech and those of Li Xiannian and Li Fuchun); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 550 (Mar. 12 and 13, 1962; Liu presides at the enlarged Politburo Standing Committee, which discusses and passes the Center''s comment forwarding Chen Yun''s and others'' Feb. 26 talk at the State Council Party-group members'' meeting, the Center''s urgent instruction on economy and the Center''s instruction on getting through the hard year; on the 13th it is proposed that Chen Yun be head of the Center''s finance and economics small group, and the participants agree); [[w.yang-shangkun-riji]], II, 133 (Mar. 13, 1962; the Xilou, 3 to 6:30 p.m., on the instruction forwarding Chen Yun''s and the others'' speeches); [[w.deng-xiaoping-nianpu-1904]], III, 1695 (Mar. 12–13, 1962; Deng at the enlarged Standing Committee); [[w.mao-zedong-zhuan]], V, ch. 69 n.31 (Mar. 12 and 13: Liu Shaoqi presides over the enlarged Standing Committee to adopt the covering comment for the three speeches: this is only discussion here, Mao is away, report to him at once; if he agrees issue, if not discuss again (Deng Liqun, *Wo wei Shaoqi tongzhi shuo xie hua*, 26)). [[w.yang-jisheng-mubei]], II, 1174 (the Politburo Standing Committee''s enlarged meeting of Mar. 13, 1962, one of the meetings that framed the measures); [[w.chen-yun-nianpu-xiuding]], III, 131 (Mar. 12–13: the meeting adopts the Center''s comment forwarding the three speeches; Liu proposes that Chen Yun still head the Central Finance and Economics Small Group, Li Fuchun his deputy; Li Fuchun: Chen Yun is the fittest, I shall be his assistant; so decided. Chen Yun, away, hearing of it, says the head had better not change; Liu: all agree, so you head it; I support you to the end). Made public: 1996. Names: Liu Shaoqi, Chen Yun, Li Fuchun, Li Xiannian.'
