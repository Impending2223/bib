    c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center 中共中央, on what he saw and heard in Zhejiang 浙江 and Jiangxi 江西: most teams have grain enough, the few in difficulty eat their fill with melons and vegetables, many better-off teams over 500 jin a head; since the draft Working Regulations the masses content with the team as the accounting unit, smaller teams, pay by work, private plots and small reclaimed plots, and the mess halls closed; household sidelines and private plots no harm to collective output but a needed supplement; the peasants unwilling to sell more than their quotas, since they cannot buy back the industrial goods they need, and asking for exchange of equal value, so light industry and handicrafts, daily goods above all, to grow; exports held up for want of raw materials and of wood and bamboo for packing, tea chests above all, which the state must supply first.'
