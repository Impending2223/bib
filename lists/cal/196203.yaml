    n: 'Mary Perot Nichols, *Village Voice*, Mar. 15, 1962 ([text](https://www.villagevoice.com/yaf-goes-wild-for-barry-goldwater/)). [[w.perlstein-before-the-storm]], 163–65 (the rally, Tower, Goldwater the last speaker). [[w.hess-republican-establishment]], 77 (the rally). To check: [[w.andrew-other-side-of-the]]; [[w.schneider-cadres-for-conservatism]]. Names: Goldwater, Thurmond, Tower. Check: Hess and Broder, 77, give nineteen thousand, ten thousand turned away.'
