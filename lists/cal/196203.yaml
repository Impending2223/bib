  - id: cal.1962-03-21.china-leadership
    when: Mar. 21
    date: '1962-03-21'
    thread: china-leadership
    c: 'Zhou Enlai at the 18th Supreme State Conference on the main questions for the NPC''s coming third session and the policies for the time; he outlines the Government Work Report: affirm achievements, criticize errors, sum up experience, overcome difficulties, point to the future, build confidence. On four years: achievements, but too much done too fast, and the farm-first policy ignored, so the proportions went wrong; the State Council bears the main blame. On a plan for 1962: better to be truthful than put forward a formal one, for figures must be firm; adjustment is a process and the experience is not enough.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 464 (Mar. 21, 1962); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 552 (Mar. 21, 1962; Liu presides at the Supreme State Conference, on the opening policy of the Third Session of the Second National People''s Congress, and speaks, reporting the spirit of the enlarged Central Work Conference: the domestic situation is to be told truly; the economy has quite large difficulties, from three years of natural calamities and largely from faults and errors in work and style; investigation was insufficient, leaders listened to reports without doing their own and believed the exaggerated ones; many high targets came from above, not from the masses; the democratic centralism of the masses was hurt; he hopes all see the difficulties and the bright future, with high ideals and careful work); [[w.macfarquhar-origins-of-the-cultural]], III, 237 (Liu Shaoqi summons the Supreme State Conference for the first time in over two and a half years; Mao had held fifteen in his four and a half years as head of state, Liu one before, in late summer 1959; Liu''s frank speech recounts the Seven Thousand Cadres Conference and the Xilou meeting; Zhou also speaks); [[w.zhu-de-nianpu-xinbian]], III, 1832–1833 (Mar. 21, 1962; Zhu De 朱德 at the Supreme State Conference 最高国务会议 Liu Shaoqi 刘少奇 chairs on the coming third session of the National People''s Congress; Liu: great economic difficulties, from three years of natural calamities and from faults in work and style, too little investigation, reports too readily believed, democratic centralism not well practiced; difficulties and the bright future both to be seen). Made public: 1996. To check: Liu Shaoqi, speech to the Supreme State Conference, Mar. 21, 1962, in [[w.jin-1949-1989-niande-zhongguo]], 432–36 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 237 n.21). Names: Zhou Enlai.'
