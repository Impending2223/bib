    c: 'Zhou Enlai, hearing Li Dazhang, governor of Sichuan, on Sichuan''s grain: Sichuan still has over a thousand small blast furnaces tying up over 90,000 workers; resolve to cut, keep one or two thousand men for the better furnaces. The 400 million jin of grain once planned to go out of the province will not. Sichuan helped the country strongly; now the country must help it; the Center adds 100 million jin, and Hubei, Jiangxi, Zhejiang and Jiangsu are to give some.'
