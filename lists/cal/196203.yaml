  - id: cal.1962-03.china-leadership-11
    when: Mar.–Apr., at Hangzhou, after the 10th
    date: 1962-03
    at: after 1962-03-10
    place: hangzhou
    thread: china-leadership
    c: 'Hangzhou 杭州. Chen Yun 陈云 reads the papers on Anhui''s 安徽 responsibility fields 责任田, which fit what he saw in the villages and his own way to restore farming, and tells his staff: an extraordinary measure for an extraordinary time; call it dividing the fields to households 分田到户 or fixing output by household 包产到户, the state, hit by such disasters natural and man-made, must rouse all the peasants, as the *Internationale* 《国际歌》 says, "by ourselves alone," to restore output fast.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 130. Made public: 2015. Names: Chen Yun.'
    tags: [polity:prc, name:chen-yun, vis:only:prc]
