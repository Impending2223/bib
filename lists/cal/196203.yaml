    c: 'Zhou Enlai at the NPC, second part of the Government Work Report, on the domestic situation and tasks. For 1958–60: great gains, but targets too high and construction too large, so the proportions of farming, light and heavy industry fell out of line; waste, no cost accounting; staff and urban population grew too fast. He takes the State Council''s blame; the laws of socialist building are not yet understood. Adjustment: 1962 the key year; farming, light, heavy industry in order; most intellectuals are working people''s intellectuals; to move the two mountains of poverty and backwardness. In the session he sees people from Sichuan, Henan and Hebei on grain and cotton.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 466 (Mar. 28, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 238–40 (Zhou at the NPC: the great majority of intellectuals are working people, though not called proletarian; the Hundred Flowers a major goal; satisfaction with "democratic reform" in Tibet; the minorities, the overseas Chinese and religious believers; the buying-out interest of the national bourgeoisie extended three years); [[w.yang-shangkun-riji]], II, 137 (Mar. 28, 1962; 3:30 to 7 p.m.; Yang Shangkun attends). Continues 467. To check: the report as printed in the *Renmin ribao*; Zhou Enlai, report to the NPC, Mar. 28, 1962, in [[w.zhou-enlai-tongyi-zhanxian]], 426–28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 239 n.32a); [[w.zhou-enlai-tongyi-zhanxian]], 407 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 239 n.32b); Zhou Enlai, report to the NPC, Mar. 28, 1962, in [[w.zhou-enlai-tongyi-zhanxian]], 428–30 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 239 n.35); Zhou Enlai, report to the NPC, Mar. 28, 1962, in [[w.zhou-enlai-tongyi-zhanxian]], 428 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 240 n.39). Names: Zhou Enlai.'
