    thread: european-community
    also: [trade]
    c: 'Proclamations 3454 and 3455: escape-clause duties raised on machine-woven carpets and on sheet glass, put off Mar. 27 to June 17. Belgium the exporter most hurt. Spaak to Ball, Mar. 27: the step taken days after the Dillon Round agreement with the Common Market. June 4, the EEC Council withdraws Dillon Round concessions on American polyethylene, polystyrene, synthetic clothing, varnishes and paints.'
    n: '[Proclamation 3454](https://www.presidency.ucsb.edu/documents/proclamation-3454-modification-trade-agreement-concession-and-adjustment-duty-certain), [Proclamation 3455](https://www.presidency.ucsb.edu/documents/proclamation-3455-modification-trade-agreement-concessions-and-adjustment-duties-cylinder) (Mar. 19, 1962); [Proclamation 3458](https://www.presidency.ucsb.edu/documents/proclamation-3458-delaying-the-effective-dates-proclamation-no-3454-and-proclamation-no) (Mar. 27, 1962). FRUS 1961–63, IX, docs. [245](https://history.state.gov/historicaldocuments/frus1961-63v09/d245), [246](https://history.state.gov/historicaldocuments/frus1961-63v09/d246) (Spaak''s letter), [247](https://history.state.gov/historicaldocuments/frus1961-63v09/d247); XIII, docs. [29](https://history.state.gov/historicaldocuments/frus1961-63v13/d29)–[34](https://history.state.gov/historicaldocuments/frus1961-63v13/d34). To check: [[w.zeiler-american-trade-and-power]]. See [[cal.1962-01-14.european-community]]. Names: Spaak, Ball.'
    tags: [name:kennedy-john-f, name:spaak-paul-henri, name:ball-george-w]
