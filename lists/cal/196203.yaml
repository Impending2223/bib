    place: ninggang
    thread: china-leadership
    c: 'Maoping 茅坪, Ninggang 宁冈. Zhu De 朱德 at a forum with local cadres and people, urging handicrafts besides grain: Jinggangshan all bamboo and leaves for rain hats and bamboo goods to be sold; the supply cooperatives to organize the making of local goods as well as buying and selling; opening Jinggangshan of economic value and of great political weight, as the first revolutionary base, made by Chairman Mao.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1829–1830. Made public: 2016. Names: Zhu De, Mao Zedong.'
    tags: [polity:prc, name:zhu-de, vis:only:prc@B-D, name:mao-zedong]
