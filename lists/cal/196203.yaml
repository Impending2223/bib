  - id: cal.1962-03-07.soviet-union
    when: Mar. 7
    date: '1962-03-07'
    thread: soviet-union-space
    also: [space]
    c: 'Kennedy''s proposals to Khrushchev for joint work in space, after Khrushchev''s message on Glenn''s flight, Feb. 21: a weather satellite system, tracking stations on each other''s territory, mapping the earth''s magnetic field, communications satellites, space medicine. Released Mar. 18.'
    n: 'Reply to Chairman Khrushchev''s Message on the flight of Colonel Glenn, [1962 Pub. Papers 158](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=218) (Feb. 21, 1962); Message to Chairman Khrushchev Proposing Joint Action in the Exploration of Outer Space, [1962 Pub. Papers 244](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=304) (Mar. 7, 1962). FRUS 1961–63, VI, docs. [35](https://history.state.gov/historicaldocuments/frus1961-63v06/d35), [41](https://history.state.gov/historicaldocuments/frus1961-63v06/d41). To check: [[w.mcdougall-heavens-and-the-earth]]; [[w.logsdon-john-f-kennedy-and]]; [[w.siddiqi-challenge-to-apollo]]. See [[cal.1962-02-20.space]]. Names: Kennedy, Khrushchev, Glenn.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s, name:glenn-john-h-jr]
  - id: cal.1962-03-08.soviet-union
    when: Mar. 8
    date: '1962-03-08'
    thread: soviet-union
    c: 'Agreement on exchanges in the scientific, technical, educational, cultural and other fields in 1962–63 signed at Washington, [13 U.S.T. 1496](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-13-2/lltreaties-13-2.pdf#page=312), [460 U.N.T.S. 3](https://treaties.un.org/doc/Publication/UNTS/Volume%20460/volume-460-I-6630-English.pdf), in force at once, from Jan. 1. Negotiated from Jan. 31 by Bohlen and Romanovsky: the Americans for more exchanges in education and information, the Soviets in science and industry.'
    n: 'FRUS 1961–63, V, doc. [168](https://history.state.gov/historicaldocuments/frus1961-63v05/d168). To check: [[w.richmond-cultural-exchange-and-the]]. Names: Bohlen, Romanovsky.'
    tags: [name:bohlen-charles-e, name:romanovsky-s-k]
