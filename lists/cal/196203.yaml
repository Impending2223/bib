    n: '[[w.fursenko-one-hell-of-a]], 154–55; [[w.fursenko-khrushchevs-cold-war]], 423 ("The president sincerely wants to avoid conducting these nuclear tests"; ready to meet "at any time"). To check: GRU resident to GRU headquarters, Mar. 3, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]], 154 n.17, 155 n.18). Check: Robert Kennedy''s date diary does not show the meeting (n.16). See [[cal.1962-03-02.testing]]. Names: Robert Kennedy, Bolshakov, Khrushchev.'
    src:
      c: a86ef752
      rows:
