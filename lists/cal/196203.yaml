    c: Zhou Enlai, "On the Question of Intellectuals," to the joint session of the national science work conference and the drama writers' conference, Canton. Most intellectuals from the old society were of the bourgeois type, but the Party always counted them in the revolutionary alliance; in twelve years most have become working people's intellectuals. Parties to trust them; where they were wrongly or too much criticized, he apologizes again for the Center; they in turn to remold themselves.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 461 (Mar. 2, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 237–38 (Zhou''s keynote to the joint opening session of the science and playwrights'' conferences: his own mandarin family, his anarchism; the debt to Zhang Shenfu, a rightist of 1957; the great majority of intellectuals patriotic; the Party leads but does not interfere in detail). Continues 462. Made public: 1997. To check: the report''s text; [[w.zhongguo-dangdai-wenxue-shi]], shang, 101 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 237 n.24); Zhou Enlai, "On the Question of Intellectuals," Mar. 2, 1962, in [[w.selected-works-of-zhou]], 366 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 238 n.25); Zhou Enlai, "On the Question of Intellectuals," Mar. 2, 1962, in [[w.selected-works-of-zhou]], 367–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 238 n.26); Zhou Enlai, "On the Question of Intellectuals," Mar. 2, 1962, in [[w.selected-works-of-zhou]], 370 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 238 n.27); [[w.schwarcz-time-for-telling-truth]], 122 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 238 n.28a); [[w.mirsky-partys-secrets-new-york]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 238 n.28b); Zhou Enlai, "On the Question of Intellectuals," Mar. 2, 1962, in [[w.selected-works-of-zhou]], 371–77 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 238 n.29); Zhou Enlai, "On the Question of Intellectuals," Mar. 2, 1962, in [[w.selected-works-of-zhou]], 377–82 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 238 n.31). Names: Zhou Enlai.'
    src:
