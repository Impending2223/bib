  - id: cal.1962-03-01.conservation
    when: Mar. 1
    date: '1962-03-01'
    thread: conservation
    c: Special message on conservation. As the Outdoor Recreation Resources Review Commission had recommended, a Bureau of Outdoor Recreation in Interior and an Outdoor Recreation Advisory Council; a Land Conservation Fund from park fees, boat charges, the motorboat gasoline tax and surplus land sales, with up to $500 million advanced over eight years; the wilderness bill again; Point Reyes, Great Basin, the Ozark rivers, Sagamore Hill, Canyonlands, Sleeping Bear Dunes; the water resources planning bill again.
    n: 'Special Message to the Congress on Conservation, [1962 Pub. Papers 176](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=236) (Mar. 1, 1962). To check: [[w.smith-john-kennedy-stewart-udall]]; [[w.smith-stewart-l-udall]]. See [[cal.1961-02-23.conservation]].'
    tags: [name:kennedy-john-f]
