    c: 'Jinggangshan 井冈山. Zhu De 朱德 visits the Jinggangshan revolutionary museum 井冈山革命博物馆. Asked where the Zhu–Mao junction 朱毛会师 took place: at Longshi 砻市, the junction gathering the risings of three provinces at Jinggangshan. At the display of the Red Army''s 红军 "three attacks on Yongxin" 三打永新: the material to be filled out; the attacks destroyed Zhu Peide''s 朱培德 main force and the divisions of Yang Chisheng 杨池生 and Yang Ruxuan 杨如轩, after which the other Nationalist 国民党 forces dared not join in, the key to the base''s and the Red Army''s growth and to the victories over the first three "encirclements." With the museum staff after: a history of Jinggangshan should take in the southern Hunan rising 湘南暴动; after the main force left in 1929 the local forces on the Hunan–Jiangxi border 湘赣边 formed the Twentieth Red Army 红二十军, later the Sixth Army Group 红六军团; he and Mao fought through southern Jiangxi 赣南 and western Fujian 闽西 and made the Central base 中央革命根据地; this to be got clear.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1829. The words: 下午 (1829). Made public: 2016. Names: Zhu De.'
