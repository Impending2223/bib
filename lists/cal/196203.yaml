    thread: china-leadership
    c: 'Zhu De 朱德 comes down Jinggangshan 井冈山 from Ciping 茨坪, by Huangyangjie 黄洋界, one of its five passes, where he looks at the pass and the place where grain carried up the hill was rested; reaching Maoping 茅坪, Ninggang 宁冈, he sees the old residence and calls on the widow of the martyr Yuan Wencai 袁文才 and other old revolutionaries. The nianpu''s note: Yuan, of Ninggang, joined the Communist Party 中国共产党 in the first civil war and led the peasants'' self-defense forces; when Mao came up the hill with the Autumn Harvest forces 秋收起义部队 he accepted their reorganization and led the second regiment of the Workers'' and Peasants'' Revolutionary Army 工农革命军; later head of the 32nd regiment of the Fourth Red Army 红四军, chairman of the Hunan–Jiangxi border government 湘赣边界工农兵政府 and chief of staff of the Fourth Red Army; killed January 1930.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1829. Names: Zhu De.'
    tags: [polity:prc, name:zhu-de]
