    c: 'The Presidium, on the conduct of Furtseva, Mukhitdinov and Firyubin. Furtseva asks to be believed that she was ill; Mukhitdinov and Firyubin accept the findings, Firyubin: "но иначе я не смог сделать" (but I could not have done otherwise). Khrushchev: a bad act, which people take for a protest against the party; the report and the decision to say "owing to illness"; Firyubin to be told his conduct was wrong; Mukhitdinov, "ошиблись в нем" (we were wrong about him), backed an Uzbek clique. Agreed.'
