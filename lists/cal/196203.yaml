    c: 'Zhu De 朱德 talks with the heads of the Nanping prefectural committee 中共福建省南平地委: in building the mountain economy, people not to crowd down the hills but up them, holding the ground, bringing its goods down and raising poultry and stock; Fujian 福建, which served the revolution, will serve socialist building too, and being on the coast must go to sea. On the struggle in western Fujian 闽西: Jinggangshan the first banner, then western Fujian''s support, its petty warlords'' wealth taken over; Fujian then underrated and places taken given up; western and northern Fujian 闽北 and southern Hunan 湘南 joined would have been a great opening, but once the Central Soviet government 中央苏区政府 was set up it turned to holding ground; the forces should have struck everywhere, even to Chiang Kai-shek''s 蒋介石 home.'
