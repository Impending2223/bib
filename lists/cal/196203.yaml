  - id: cal.1962-03-18.china-leadership
    when: Mar. 18
    date: '1962-03-18'
    place:
      - wuhan
      - peking
    thread: china-leadership
    c: 'Zhou Enlai back in Peking from Wuhan. The Central Committee issues Chen Yun''s, Li Xiannian''s and Li Fuchun''s speeches of Feb. 26 to the Party groups of the State Council''s ministries, with a covering comment: the economy is in an extraordinary period; the main task is to restore agriculture, steady the market and win a basic turn in finance and the economy; the next ten years in two stages, the first of adjustment and mainly recovery, the second of development.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 464 (Mar. 18, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 193 (Chen Yun''s speech ordered distributed to cadres, Mar. 18); [[w.yang-shangkun-riji]], II, 134 (Mar. 18, 1962; Liu Shaoqi, Deng Xiaoping and Zhou Enlai fly back from Hankou at noon); [[w.deng-xiaoping-nianpu-1904]], III, 1696 (Mar. 18, 1962; Deng, Liu and Zhou back in Peking); [[w.mao-zedong-zhuan]], V, ch. 69 n.28 (Mar. 18: the Center issues the instruction forwarding Chen Yun''s speeches: the next ten years in two stages, the first recovery with some development, the second development with some recovery; Chen Yun, Li Fuchun and Li Xiannian to convey it to the Party groups of the ministries). [[w.peng-zhen-nianpu-1902]], IV, 179 (Mar. 18, 1962; the papers issued after Liu, Zhou and Deng reported to Mao at Wuhan on the 16th; Mao agrees that the three speeches go to the province and army level and that Chen Yun head the group); [[w.chen-yun-nianpu-xiuding]], III, 131 (the Center''s directive forwarding the speeches of Chen Yun and others 《关于批发陈云等同志讲话的指示》: the next ten years in two stages, adjustment (chiefly recovery, some growth), then growth; that the first is chiefly recovery not to be said outside, in or out of the Party, but called the adjustment stage. The provinces ask to relay the speeches more widely; Chen Yun''s above all help all see the whole and face the difficulties). Made public: 1997. To check: the comment as issued; [[w.xiangqian-1962-niande-jingji-tiaozheng]], 62 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 193 n.32a); [[w.issues-and-studies-taipei]], 95 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 193 n.32b); Mainichi Shimbun correspondents'' transcription from Red Guard posters in Beijing of Liu Shaoqi''s early Cultural Revolution confession (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 193 n.32c); [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 327 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 193 n.32d); Central Committee 中共中央, instruction forwarding Chen Yun''s and others'' speeches 《中共中央关于转发陈云等同志讲话的指示》, Mar. 18, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.28). Names: Zhou Enlai, Chen Yun, Li Xiannian, Li Fuchun.'
