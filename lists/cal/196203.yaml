    c: 'Zhou Enlai receives Pakistan''s Ambassador, Pir Ali Mohammed Rashdi: states large and small should be friendly; the China–Pakistan friendship is not expedient but lasting; Pakistan''s disputes with its neighbors are to be settled directly, without a third state''s intervention; if Pakistan eases tension around it, it has its hands free for construction, to the good of independence and the people.'
