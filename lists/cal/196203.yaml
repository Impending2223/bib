  - id: cal.1962-03-17.china-leadership-2
    when: Mar. 17
    date: '1962-03-17'
    place: wuhan
    thread: china-leadership
    also: [china]
    c: 'Wuhan. Liu Shaoqi talks with Luo Ruiqing, Wang Renzhong and Xie Fuzhi on public security work: the lessons of four years are many, and the chief one is mixing the two kinds of contradiction; enemies are to be regarded as enemies, but the chief fault is to treat our own as enemies. Under the law, counties, communes and even brigades have used long detention, labor and labor re-education, and no one knows how many were tortured to death. To check, expose and criticize thoroughly: it is ugly, but should one fear the ugliness? If not exposed today, it will be tomorrow, and by the next generation. When Xie Fuzhi and Wang Renzhong speak of being criticized in these years as "right-leaning," Liu: are you afraid of "right deviation"? At the worst you lose your post; to hold to truth and lose it is honorable.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 551 (Mar. 17, 1962); [[w.yang-jisheng-mubei]], II, 1127 (in March 1962 Liu summons Xie Fuzhi and others and asks the public security ministry to sum up the lessons of the deaths and injuries done to the innocent these years: "if not exposed while we live, the next generation will expose it after we die"); [[w.yang-jisheng-tiandi-fanfu]], I, 75 (Liu: the beatings to death of the last years to be laid bare: "not today, then tomorrow; not by you, then by others; not by the living, then by the next generation"). Footnote 1 (551) gives Luo Ruiqing as then Chief of the General Staff of the PLA. Made public: 1996. Names: Liu Shaoqi, Luo Ruiqing, Xie Fuzhi.'
    src:
      c: 89f75c6e
