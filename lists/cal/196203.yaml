  - id: cal.1962-03-17.china-leadership
    when: Mar. 17
    date: '1962-03-17'
    place: wuhan
    thread: china-leadership
    c: 'Wuchang, the East Lake guesthouse, afternoon. Mao with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Luo Ruiqing, Xie Fuzhi, Wang Renzhong and Tian Jiaying: agrees to the Central Committee''s endorsement of the three speeches, to go out to provincial and army level, and to Chen Yun as head of the Central Finance Group. (On Mar. 13 he had asked them to come, with Zhou''s draft report for the National People''s Congress, and to take up the Soviet letter of Feb. 22.)'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 17, 1962. [[w.zhou-enlai-nianpu-1949]], II, 464 (Mar. 16, 1962: Zhou Enlai with Liu and Deng at Wuhan reports to Mao; Mao agrees); [[w.deng-xiaoping-nianpu-1904]], III, 1696 (Mar. 16–17, 1962; Deng at Mao''s meeting at Wuchang); [[w.mao-zedong-zhuan]], V, ch. 69 n.37 (Mar. 17: Mao meets Liu, Zhou and Deng and agrees to forward the three speeches; Zhou later says Mao agreed only that the adjustment be a stage, and left the estimate of the situation unsettled; they return Mar. 18). [[w.yang-jisheng-mubei]], II, 1174 (Mao agrees with the majority of the Standing Committee and to Chen Yun as head of the Central Finance and Economics Group; says the situation must not be seen as "pitch dark" and the deficit is false, and asks for further discussion; no day given for the meeting, the flight dated Mar. 14); [[w.yang-jisheng-mubei]], II, 1119–1120 (on Mar. 14 Liu, Zhou and Deng fly to Wuhan; Mao agrees with the majority of the Standing Committee and approves Chen Yun as head of the Finance and Economics Group, but will not have the situation seen as all black, says the deficit is false, and asks for another discussion); [[w.chen-yun-nianpu-xiuding]], III, 131 (Mao, having read with care the edited texts of the speeches of Chen Yun, Li Xiannian and Li Fuchun, calls Liu, Zhou, Deng and others the next day: the speeches to go out in the Center''s name to provincial and army level; Chen Yun to head the Central Finance and Economics Small Group). Made public: 1997. To check: Zhou Enlai 周恩来, speech at the Central Work Conference 中央工作会议, May 11, 1962 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.37). See [[cal.1962-03-13.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Luo Ruiqing, Xie Fuzhi, Chen Yun.'
