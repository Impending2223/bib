  - id: cal.1962-03.latin-america-3
    when: Mar.
    date: 1962-03
    thread: latin-america
    c: 'Chile. Moscoso, of the Alliance for Progress, and Goodwin, on a special mission to the Alessandri government in its economic crisis: 140 million dollars, only on a promise to begin the reforms pledged at Punta del Este, land redistribution among them. Goodwin: "if you don''t do something about these changes soon, Allende ... will win the next election." The young minister of finance: "The problem is that you just don''t understand Chile."'
    n: '[[w.goodwin-remembering-america]], 215 (Goodwin''s account). Names: Goodwin, Alessandri, Allende. Check: the day; "In March of 1962" (215).'
