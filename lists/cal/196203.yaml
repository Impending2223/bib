  - id: cal.1962-03-06.china-leadership
    when: Mar. 6
    date: '1962-03-06'
    place: canton
    thread: china-leadership
    c: 'Chen Yi to the national playwrights'' conference at Canton, a speech of over 30,000 characters, interrupted over sixty times by laughter or applause. The Party''s relations with intellectuals are "very abnormal": they are working people and not to be capped as bourgeois, remolding is slow and voluntary, writers have democratic rights and no party secretary or vice-premier may force a revision, internal contradictions and tragedy may be shown, and a wronged writer is to stand firm and accept discipline. Mao has never held a special discussion of modern drama and does not oppose plays; Zhou is keen on them. He says he plucked up the courage to speak after the Seven Thousand Cadres Conference.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 244–47; [[w.macfarquhar-origins-of-the-cultural]], III, 435 (Chen Yi admits in public that he held back his views on the intellectuals until after the Seven Thousand Cadres Conference); [[w.yang-jisheng-mubei]], II, 1126 n.30–31 (at the Canton meeting of Mar. 1962 Zhou and Chen Yi speak of respect for intellectuals, Chen Yi proposing to take the bourgeois intellectuals'' hat off and give the working people''s intellectuals their crown; Lu Dingyi strongly opposed it and in 1979 owned his view had been ''left''); [[w.chen-yi-nianpu]], 911 (Mar. 2–26, 1962; Chen Yi at the scientists'' forum and the conference on writing spoken drama, opera and children''s plays at Canton, and speaks: the cap of the bourgeois intellectual is to be taken off; "today I take off my hat to you"). Made public: 1980. To check: Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 47–93 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 244 n.64a); [[w.chen-yi-zhuan]], 534 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 244 n.64b); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 58 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 244 n.65a); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 50 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 245 n.67); [[w.chen-yi-zhuan]], 525, 534 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 245 n.68); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 48 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 245 n.69); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 48–55 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 245 n.70a); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 59 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 246 n.72); Chen Yi, speech of Mar. 6, 1962, in [[w.zhou-enlai-yu-wenyi]], shang, 60–61 (