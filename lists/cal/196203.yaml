    c: 'Zhou Enlai to the Central Finance and Economic Group: the hardest time has passed in the general political and policy view, but the financial difficulties are serious; full farm recovery may take five years or more; strive for fast, prepare for slow. This year''s plan needs a great adjustment, his own proposal to the Center, a 180-degree turn to the way of revolution, with steady steps. Eight measures, among them to shift planning from industry and transport to farming and the market and to cut construction. He proposes Li Xiannian deputy head of the State Planning Commission too.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 462 (Mar. 8, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 199 (Zhou takes the chair of the small group''s meeting after Chen Yun leaves, and makes a very long speech expanding on Chen''s points); [[w.mao-zedong-zhuan]], V, ch. 69 n.30 (Mar. 8: Zhou Enlai: from the political and policy view the hardest time is past, but the financial difficulties are very grave, some perhaps not yet seen; the plan for 1962 to be adjusted). [[w.jian-zhou-enlai]], 464 (Zhou: the most difficult time past, but the financial and economic difficulties serious; the planning emphasis from industry and transport to agriculture and the market; construction and investment cut further); [[w.chen-yun-nianpu-xiuding]], III, 128 (Chen Yun at the group''s meetings of Mar. 7 and 8, which study the adjustment further). Made public: 1997. To check: [[w.liqun-xiang-chen-yun-tongzhi]], 7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.53); Zhou Enlai 周恩来, speech at the Central Finance and Economics Small Group 中央财经小组会议, Mar. 8, 1962 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.30). Names: Zhou Enlai, Li Xiannian.'
