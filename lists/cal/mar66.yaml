# Cal. LXXVII March 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXVII
entries:
  - id: cal.1966-03-01.vietnam
    when: Mar. 1
    date: '1966-03-01'
    thread: vietnam-supplemental
    also: [congress, defense]
    c: 'The war''s supplemental authorization. The Senate tables Morse''s amendment to repeal the Southeast Asia resolution of Aug. 1964, [92–5](https://voteview.com/rollcall/RS0890270): Morse, Gruening, Fulbright, McCarthy, Young of Ohio the five. Gruening''s, to keep draftees from Southeast Asia''s combat areas without Congress''s consent, tabled [94–2](https://voteview.com/rollcall/RS0890271). The authorization, $4.8 billion for aircraft, missiles, and construction, passes, [93–2](https://voteview.com/rollcall/RS0890272); the House''s, [393–4](https://voteview.com/rollcall/RH0890216).'
    n: 'Check: the Record''s pages. [[w.gibbons-u-s-government-and-1995]]; [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]. See [[cal.1966-01-19.vietnam]]; [[cal.1966-02-04.vietnam]]. Names: Morse, Gruening, Fulbright, McCarthy, Young.'
    tags: [name:morse-wayne, name:gruening-ernest, name:fulbright-j-william, name:mccarthy-eugene-j, name:young-stephen-m]
  - id: cal.1966-03-01.welfare-ca
    when: Mar. 1
    date: '1966-03-01'
    thread: welfare
    also: [health]
    c: 'California. Medi-Cal begins: medical care for those on public assistance and the medically needy, under Title XIX of the Social Security Act, enacted in the Legislature''s special session of 1965. Check the date, the act and its signing.'
    n: '[Cal. Stats. 1965, 2d Ex. Sess., ch. 4, 103](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1966/66Vol1_65secondextra.pdf#page=101) (approved Nov. 12, 1965). [[w.stevens-welfare-medicine-in-america]]; [[w.rarick-california-rising]]. See [[cal.1965-07-30.medicare]].'
    tags: [state:ca]
  - id: cal.1966-03-02.transportation
    when: Mar. 2
    date: '1966-03-02'
    thread: transportation
    c: 'Message on transportation. A Cabinet Department of Transportation: the Federal Aviation Agency whole; the Coast Guard from the Treasury; the Bureau of Public Roads; the Maritime Administration; the safety work of the ICC and the CAB; the St. Lawrence Seaway corporation, the Alaska Railroad. Almost 100,000 employees, almost $6 billion. A Traffic Safety Act: $700 million over six years for State programs under federal standards; safety standards for new cars, voluntary for two years, then, if need be, prescribed. The tire safety bill, S. 2669, urged. "50,000 highway deaths this year."'
    n: '[Special Message to the Congress on Transportation](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transportation-0) (Mar. 2, 1966). [[w.davis-department-of-transportation]]; [[w.califano-triumph-and-tragedy-of]]; [[w.mashaw-struggle-for-auto-safety]]; [[w.eastman-styling-vs-safety]]. See [[cal.1965-07-13.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-02.transition-and-staff
    when: Mar. 2–4
    date: '1966-03-02'
    thread: transition-and-staff
    c: 'NSAM 341: the Secretary of State given "overall direction, coordination and supervision" of interdepartmental activities overseas, forces under an area commander excepted. A Senior Interdepartmental Group, the Under Secretary of State its executive chairman, with Defense, AID, the CIA, the Joint Chiefs, USIA, and the national security assistant; Interdepartmental Regional Groups under the Assistant Secretaries. The SIG takes over the Special Group (Counterinsurgency). Taylor''s design. Announced Mar. 4.'
    n: 'NSAM 341, FRUS 1964–68, XXXIII, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v33/d56), [58](https://history.state.gov/historicaldocuments/frus1964-68v33/d58). [[w.taylor-swords-and-plowshares]]; [[w.johnson-right-hand-of-power]]. Names: Taylor.'
    tags: [name:taylor-maxwell, name:johnson-lyndon-b]
  - id: cal.1966-03-02.press-and-broadcasting-ca
    when: Mar. 2
    date: '1966-03-02'
    thread: press-and-broadcasting
    also: [state-constitutions]
    c: '*Weaver v. Jordan*, [64 Cal. 2d 235](https://static.case.law/cal-2d/64/case-pdfs/0235-01.pdf): the California Supreme Court holds the "Free Television Act," Proposition 15, an abridgment of free speech under the State and federal Constitutions; void. 6–1, Mosk dissenting.'
    n: '*Weaver v. Jordan*, [64 Cal. 2d 235](https://static.case.law/cal-2d/64/case-pdfs/0235-01.pdf) (1966). See [[cal.1964-11-03.state-constitutions-ca]].'
    tags: [state:ca]
  - id: cal.1966-03-03.school-aid
    when: Mar. 3
    date: '1966-03-03'
    thread: school-aid
    also: [vietnam]
    c: 'Veterans'' Readjustment Benefits Act signed in the East Room, [80 Stat. 12](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg12.pdf), the "Cold War GI Bill": for service after Jan. 31, 1955, schooling at $100 a month, $125 with one dependent, $150 with more; home loans; medical care. Yarborough its author in the Senate; Teague''s committee reported it in the House.'
    n: '[Remarks Upon Signing the "Cold War GI Bill" (Veterans'' Readjustment Benefits Act of 1966)](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-cold-war-gi-bill-veterans-readjustment-benefits-act-1966) (Mar. 3, 1966). [[w.cox-ralph-w-yarborough-the]]. Names: Yarborough, Teague.'
    tags: [name:johnson-lyndon-b, name:yarborough-ralph, name:teague-olin-e]
  - id: cal.1966-03-04.opinion
    when: Mar. 4
    date: '1966-03-04'
    thread: opinion
    also: [jobs-and-wages, labor-disputes]
    c: 'Gallup, Jan. 21–26: a worker in a unionized plant required to join the union: should 42 percent, should not 49. A law making all strikes illegal: favor 27, oppose 61. Unions covering whole industries brought under the antitrust laws: agree 43, disagree 26. The laws regulating unions: not strict enough 40, too strict 11, about right 25. Those regulating business: not strict enough 20, too strict 20, about right 32.'
    n: '[[w.gallup-poll]], III, 1992–93. The union-shop question''s field dates printed 1/21-26/65 (survey 723-K).'
  - id: cal.1966-03-06.opinion
    when: Mar. 6
    date: '1966-03-06'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 10–15: bombing industrial plants and factories in North Vietnam: favor 61 percent, oppose 26. Bombing big cities in North Vietnam: favor 28, oppose 60.'
    n: '[[w.gallup-poll]], III, 1993.'
  - id: cal.1966-03-07.court
    when: Mar. 7
    date: '1966-03-07'
    thread: court
    also: [voting-rights, south-carolina]
    c: '*South Carolina v. Katzenbach*, [383 U.S. 301](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383301/usrep383301.pdf): the Voting Rights Act upheld under the Fifteenth Amendment''s enforcement clause: the coverage formula, the suspension of literacy tests, the federal examiners, the review of new voting laws. Warren for the Court; Black dissents from the review of new State laws alone.'
    n: Opinion (K–J Cong. II.J.1). Also Opp. II.H.1. [[w.lawson-black-ballots]]; [[w.landsberg-enforcing-civil-rights]]; [[w.katzenbach-some-of-it-was]]; [[w.powe-warren-court-and-american]]. See [[cal.1965-08-07.voting-rights]].
  - id: cal.1966-03-07.europe-and-the-alliance
    when: Mar. 7
    date: '1966-03-07'
    thread: europe-and-the-alliance-france
    c: 'De Gaulle to Johnson, by hand: France stays party to the North Atlantic Treaty but will recover "the entire exercise of her sovereignty over her territory," end her part in the integrated commands, and no longer put her forces at NATO''s disposal.'
    n: 'FRUS 1964–68, XIII, docs. [136](https://history.state.gov/historicaldocuments/frus1964-68v13/d136), [137](https://history.state.gov/historicaldocuments/frus1964-68v13/d137). [[w.schwartz-lyndon-johnson-and-europe]]; [[w.bozo-two-strategies-for-europe]]; [[w.priest-kennedy-johnson-and-nato]]; [[w.jackson-de-gaulle]]; [[w.bohlen-witness-to-history-1929]]. See [[cal.1965-12-20.europe-and-the-alliance]]. See [[cal.1964-04-27.europe-and-the-alliance]]. Names: de Gaulle, Johnson.'
    tags: [name:de-gaulle-charles, name:johnson-lyndon-b]
  - id: cal.1966-03-08.india-and-china
    when: Mar. 8
    date: '1966-03-08'
    thread: china
    c: 'The Senate Foreign Relations Committee, Fulbright presiding, hears scholars on policy toward mainland China, to Mar. 30. A. Doak Barnett of Columbia, the first: "containment but not isolation."'
    n: '*U.S. Policy with Respect to Mainland China: Hearings before the Senate Committee on Foreign Relations*, 89th Cong., 2d sess. (1966). [[w.foot-practice-of-power]]; [[w.kusnitz-public-opinion-and-foreign]]; [[w.goh-constructing-the-u-s]]; [[w.woods-fulbright]]. Names: Fulbright, Barnett.'
    tags: [name:fulbright-j-william, name:barnett-a-doak]
  - id: cal.1966-03-08.electoral-college
    when: Mar. 8–10
    date: '1966-03-08'
    thread: electoral-college
    also: [amendments, congress]
    c: 'Katzenbach to Bayh''s subcommittee for the administration''s S.J. Res. 58, "substantially identical" to Senator Kennedy''s of 1957: the office of elector abolished, a State''s electoral votes cast for its winner without electors; with no majority, the Senate and House together, each member a vote, to choose among the three highest; the death of a President-elect provided for. Edward Kennedy for it the same day; Robert Kennedy, Mar. 9. Mar. 10, the last day, the subcommittee adjourns to the call of the chair.'
    n: '*Election of the President* hearings, [151–52](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=159), [173](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=181), [179–80](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=187). See [[cal.1966-02-28.electoral-college]]. Names: Katzenbach, Bayh, John F. Kennedy, Edward Kennedy, Robert Kennedy.'
    tags: [name:katzenbach-nicholas, name:bayh-birch, name:kennedy-john-f, name:kennedy-edward-m, name:kennedy-robert-f]
  - id: cal.1966-03-09.crime-and-hijacking
    when: Mar. 9
    date: '1966-03-09'
    thread: crime-and-hijacking
    c: 'Message on crime and law enforcement: a year at college for selected police officers; control of the interstate traffic in firearms, S. 1592; a commission to revise the federal criminal code by 1968; bail reform; the federal prisons, parole, and probation joined in the Justice Department. For the District: higher police pay, a pistol registration act.'
    n: '[Special Message to the Congress on Crime and Law Enforcement](https://www.presidency.ucsb.edu/documents/special-message-the-congress-crime-and-law-enforcement) (Mar. 9, 1966). See [[cal.1965-03-08.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-09.opinion
    when: Mar. 9
    date: '1966-03-09'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 10–15: Johnson''s handling of Vietnam: approve 50 percent, disapprove 33.'
    n: '[[w.gallup-poll]], III, 1993. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-10.vietnam
    when: Mar. 10
    date: '1966-03-10'
    thread: vietnam-struggle
    c: The Directorate relieves Thi of the I Corps command; Kỳ had told Lodge Mar. 9 of Thi's insubordination, Lodge answering that it was an internal affair.
    n: '[FRUS 1964–68, IV, doc. 91](https://history.state.gov/historicaldocuments/frus1964-68v04/d91). [[w.topmiller-lotus-unleashed]]; [[w.minh-vietnamese-engaged-buddhism]]; [[w.luu-buddhist-crises-in-vietnam]]; [[w.moyar-political-monks]]; [[w.kahin-intervention]]; [[w.fitzgerald-fire-in-the-lake]]; [[w.ky-twenty-years-and-twenty]]; [[w.blair-lodge-in-vietnam]]; [[w.gibbons-u-s-government-and-1995]]. Names: Nguyễn Chánh Thi, Nguyễn Cao Kỳ, Lodge.'
    tags: [name:nguyen-chanh-thi, name:nguyen-cao-ky, name:lodge-henry-cabot]
  - id: cal.1966-03-10.india-and-china
    when: Mar. 10
    date: '1966-03-10'
    thread: china
    c: 'The China hearings: Fairbank of Harvard (Check the day).'
    n: '*U.S. Policy with Respect to Mainland China* (1966) (Check the pages). See [[cal.1966-03-08.india-and-china]]. Names: Fairbank.'
    tags: [name:fairbank-john-k]
  - id: cal.1966-03-11.india-and-china
    when: Mar. 11–12
    date: '1966-03-11'
    thread: indonesia
    c: 'Djakarta. Sukarno, after weeks of student demonstrations and with army units about the capital, signs an order of Mar. 11 giving Suharto authority to restore order. Mar. 12, Suharto dissolves and bans the PKI. The embassy: "its own peculiar form of military coup"; Sukarno kept as a figurehead. Komer to Johnson: follow through with "a few thousand tons of surplus wheat or rice."'
    n: 'FRUS 1964–68, XXVI, docs. [199](https://history.state.gov/historicaldocuments/frus1964-68v26/d199), [200](https://history.state.gov/historicaldocuments/frus1964-68v26/d200), [201](https://history.state.gov/historicaldocuments/frus1964-68v26/d201), [203](https://history.state.gov/historicaldocuments/frus1964-68v26/d203). [[w.simpson-economists-with-guns]]; [[w.roosa-pretext-for-mass-murder]]; [[w.robinson-killing-season]]. See [[cal.1965-10-01.india-and-china]]. Names: Komer, Sukarno, Suharto, Johnson.'
    tags: [name:sukarno, name:suharto, name:komer-robert-w, name:johnson-lyndon-b]
  - id: cal.1966-03-11.opinion
    when: Mar. 11
    date: '1966-03-11'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Feb. 10–15: Robert Kennedy 54 percent, Nixon 41, undecided 5. Independents: Nixon 52, Kennedy 39. South: 46 and 46. College-educated: Nixon 53, Kennedy 43. Catholics: Kennedy 67, Nixon 29; Protestants: Nixon 48, Kennedy 47.'
    n: '[[w.gallup-poll]], III, 1993–94. Names: Robert Kennedy, Nixon.'
    tags: [name:kennedy-robert-f, name:nixon-richard-m]
  - id: cal.1966-03-11.europe-and-the-alliance-france
    when: Mar. 11
    date: '1966-03-11'
    thread: europe-and-the-alliance-france
    c: 'The French aide-mémoire to the United States: the alliance''s organization no longer answers, as far as France is concerned, to conditions "fundamentally different from those of 1949."'
    n: 'FRUS 1964–68, XIII, docs. [141](https://history.state.gov/historicaldocuments/frus1964-68v13/d141), [142](https://history.state.gov/historicaldocuments/frus1964-68v13/d142). *American Foreign Policy: Current Documents, 1966*, pp. 317–323 (Check the page). See [[cal.1966-03-07.europe-and-the-alliance]].'
  - id: cal.1966-03-11.vietnam-struggle
    when: Mar. 11
    date: '1966-03-11'
    thread: vietnam-struggle
    c: Rallies for Thi at Đà Nẵng; strikes and closed schools spread to Huế.
    n: '[*New York Times*, Mar. 12, 1966](https://timesmachine.nytimes.com/timesmachine/1966/03/12/issue.html). See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Chánh Thi.'
    tags: [name:nguyen-chanh-thi, place:da-nang, place:hue]
  - id: cal.1966-03-12.vietnam-us
    when: Mar. 12
    date: '1966-03-12'
    thread: vietnam
    also: [states-and-cities]
    c: 'The governors at the White House, briefed on Vietnam by Rusk, McNamara, Taylor, Wheeler and Humphrey. A resolution of Rhodes''s, adopted unanimously by those present, read by Reed of Maine, the conference''s chairman: they "wholeheartedly support and endorse the policies and programs in Vietnam." Hatfield absent.'
    n: '[The President''s News Conference Held at the Close of the Governors'' Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-held-the-close-the-governors-conference) (Mar. 12, 1966). See [[cal.1965-07-28.vietnam-us]]. Names: Rusk, McNamara, Taylor, Wheeler, Humphrey, Rhodes, Reed, Hatfield.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:wheeler-earle, name:humphrey-hubert-h, name:rhodes-james-a, name:reed-john-h, name:hatfield-mark-o]
  - id: cal.1966-03-12.vietnam-struggle
    when: Mar. 12
    date: '1966-03-12'
    thread: vietnam-struggle
    c: 'The Unified Buddhist Church, Tâm Châu presiding: civilian government, a National Assembly, generals back to their military duties.'
    n: 'FRUS 1964–68, IV, docs. [94](https://history.state.gov/historicaldocuments/frus1964-68v04/d94), [95](https://history.state.gov/historicaldocuments/frus1964-68v04/d95). See [[cal.1966-03-10.vietnam]]. Names: Tâm Châu.'
    tags: [name:tam-chau]
  - id: cal.1966-03-13.opinion
    when: Mar. 13
    date: '1966-03-13'
    thread: opinion
    also: [foreign-aid, vietnam]
    c: 'Gallup, Feb. 10–15: foreign aid in general: for 53 percent, against 35. The kinds favored: training teachers and building schools 65; better farming methods 61; hospitals, doctors and nurses, medicine 61; birth control information 43; surplus food 41; factories and industries 33; highways and railroads 21; military strength 18. A country receiving aid that fails to support the United States in a major decision such as Vietnam: continue the aid 16, reduce it 30, cut it off 45.'
    n: '[[w.gallup-poll]], III, 1995.'
  - id: cal.1966-03-13.india-and-china
    when: Mar. 13
    date: '1966-03-13'
    thread: china
    c: 'Humphrey on *Meet the Press*: toward China, containment "without necessarily isolation" (Check the words).'
    n: 'Check: the transcript. See [[cal.1966-03-08.india-and-china]]. Names: Humphrey.'
    tags: [name:humphrey-hubert-h]
  - id: cal.1966-03-15.economy
    when: Mar. 15
    date: '1966-03-15'
    thread: economy-tax-adjustment
    also: [welfare]
    c: 'Tax Adjustment Act signed at night, [80 Stat. 38](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg38.pdf): some $6 billion over fifteen months, Johnson says. The excise cuts of Jan. 1 undone to Apr. 1, 1968: new cars back to 7 percent, telephone service to 10. Graduated withholding from May 1; corporations'' estimated tax paid sooner; self-employment tax in the individual''s estimate. $35 a month to some 370,000 persons 72 and over outside Social Security, from Prouty''s amendment, adopted in the Senate Mar. 8, [45–40](https://voteview.com/rollcall/RS0890275). No deduction for advertising in party convention programs. The Senate passed it Mar. 9, [79–9](https://voteview.com/rollcall/RS0890279); the conference report Mar. 15: House, [288–102](https://voteview.com/rollcall/RH0890221); Senate, [72–5](https://voteview.com/rollcall/RS0890284).'
    n: '[Statement by the President Upon Signing the Tax Adjustment Act of 1966](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-tax-adjustment-act-1966) (Mar. 15, 1966). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]; [[w.collins-more]]. See [[cal.1965-12-05.economy]]. Names: Johnson, Prouty.'
    tags: [name:johnson-lyndon-b, name:prouty-winston-l]
  - id: cal.1966-03-15.vietnam-supplemental
    when: Mar. 15
    date: '1966-03-15'
    thread: vietnam-supplemental
    also: [defense]
    c: Supplemental military authorization signed, [80 Stat. 36](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg36.pdf). The House passes the appropriation, H.R. 13546, some $13 billion, [389–3](https://voteview.com/rollcall/RH0890222).
    n: '[Remarks at the Signing of the Supplemental Military Authorization Bill](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-supplemental-military-authorization-bill) (Mar. 15, 1966). See [[cal.1966-01-19.vietnam]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-16.space
    when: Mar. 16
    date: '1966-03-16'
    thread: space
    c: 'Gemini 8: Armstrong and Scott dock with an Agena target some six and a half hours after launch, the first docking in orbit. A thruster sticks open; the joined craft tumble; Armstrong casts off the Agena and steadies the capsule with the reentry thrusters. Down in the western Pacific after some ten and a half hours, the flight cut short.'
    n: '[Statement by the President Following the Safe Return of the Gemini 8 Astronauts](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-safe-return-the-gemini-8-astronauts) (Mar. 16, 1966). [[w.hacker-on-the-shoulders-of]]. See [[cal.1965-12-15.space]]. Names: Armstrong, Scott.'
    tags: [name:armstrong-neil-a, name:scott-david-r]
  - id: cal.1966-03-16.foreign-aid
    when: Mar. 16
    date: '1966-03-16'
    thread: foreign-aid
    c: 'Asian Development Bank Act signed, [80 Stat. 71](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg71.pdf): American membership, and $200 million for 20,000 shares of the bank''s capital. Johnson: "This billion dollar bank."'
    n: '[Remarks at the Signing of the Asian Development Bank Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-asian-development-bank-act) (Mar. 16, 1966). See [[cal.1965-04-07.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-16.jobs-and-wages-ca
    when: Mar. 16
    date: '1966-03-16'
    thread: jobs-and-wages-farm-workers
    also: [robert-kennedy]
    c: The Senate's Subcommittee on Migratory Labor at Delano, Cal.; Robert Kennedy questions the Kern County sheriff on the arrests of pickets.
    n: 'Check: the hearing''s record. [[w.pawel-crusades-of-cesar-chavez]]; [[w.bardacke-trampling-out-the-vintage]]; [[w.schlesinger-robert-kennedy-and-his]]. See [[cal.1965-09-08.jobs-and-wages-ca]]. Names: Robert Kennedy.'
    tags: [state:ca, name:kennedy-robert-f]
  - id: cal.1966-03-17.middle-east
    when: Mar. 17
    date: '1966-03-17'
    thread: middle-east
    c: 'Aircraft for Israel and Jordan. Harman''s letter: Israel to buy 48 A-4 Skyhawks, and its policy not to be the first to develop nuclear weapons in the region. Jordan buys aircraft too.'
    n: '[FRUS 1964–68, XVIII, doc. 271](https://history.state.gov/historicaldocuments/frus1964-68v18/d271). [[w.spiegel-other-arab-israeli-conflict]]; [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.levey-united-states-skyhawk-sale]]. Made public: the State Department, May 1966 (Check the date). See [[cal.1965-02-25.middle-east]]. Names: Harman.'
    tags: [name:harman-avraham]
  - id: cal.1966-03-17.jobs-and-wages-farm-workers
    when: Mar. 17
    date: '1966-03-17'
    thread: jobs-and-wages-farm-workers
    c: Chavez and the grape strikers set out from Delano on foot for Sacramento.
    n: '[*New York Times*, Mar. 18, 1966](https://timesmachine.nytimes.com/timesmachine/1966/03/18/issue.html). See [[cal.1966-03-16.jobs-and-wages-ca]]. Names: Chavez.'
    tags: [state:ca, name:chavez-cesar]
  - id: cal.1966-03-18.europe-and-the-alliance-france
    when: Mar. 18
    date: '1966-03-18'
    thread: europe-and-the-alliance-france
    c: 'The Declaration of the Fourteen: the treaty and the organization under it both essential (Check the words).'
    n: '*American Foreign Policy: Current Documents, 1966*, pp. 317–323 (Check the page). See [[cal.1966-03-07.europe-and-the-alliance]].'
  - id: cal.1966-03-18.india-and-china-indonesia
    when: Mar. 18
    date: '1966-03-18'
    thread: indonesia
    c: Djakarta. Subandrio and other ministers arrested (Check).
    n: 'Check: the day. See [[cal.1966-03-11.india-and-china]]. Names: Subandrio.'
    tags: [name:subandrio]
  - id: cal.1966-03-19.vietnam-struggle
    when: Mar. 19
    date: '1966-03-19'
    thread: vietnam-struggle
    c: The strikes reach Saigon. The Struggle Movement holds Đà Nẵng and Huế.
    n: FRUS 1964–68, IV, docs. [99](https://history.state.gov/historicaldocuments/frus1964-68v04/d99), [100](https://history.state.gov/historicaldocuments/frus1964-68v04/d100). See [[cal.1966-03-10.vietnam]].
    tags: [place:saigon, place:da-nang, place:hue]
  - id: cal.1966-03-20.opinion
    when: Mar. 20
    date: '1966-03-20'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Mar. 3–8: the party one would like to see win the congressional district, by region: South, Democratic 74 percent, Republican 26; East 56 and 44; Midwest 51 and 49; West 50 and 50.'
    n: '[[w.gallup-poll]], III, 1996.'
  - id: cal.1966-03-20.japan-and-korea
    when: Mar. 20
    date: '1966-03-20'
    thread: korea
    also: [vietnam]
    c: Korea's National Assembly approves a second division and a regiment for Vietnam, 95–27, 3 abstaining, after a night's debate. Before it, Brown's letters to the Foreign Minister on the American commitment to Korea's defense (the Brown memorandum, Mar. 7; check the date), and Johnson's letter of thanks to Park, Mar. 11.
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [77](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d77), [78](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d78), [81](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d81). [[w.blackburn-mercenaries-and-lyndon-johnsons]]. See [[cal.1966-02-22.vietnam-humphrey]]; [[cal.1965-08-13.japan-and-korea]]. Names: Brown, Johnson, Park.'
    tags: [name:brown-winthrop-g, name:johnson-lyndon-b, name:park-chung-hee]
  - id: cal.1966-03-21.court
    when: Mar. 21
    date: '1966-03-21'
    thread: court
    c: 'Obscenity. *Memoirs v. Massachusetts*, [383 U.S. 413](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383413/usrep383413.pdf): *Fanny Hill* not obscene; Brennan''s plurality: a book must be "utterly without redeeming social value"; Clark, Harlan, White dissent. *Ginzburg v. United States*, [383 U.S. 463](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383463/usrep383463.pdf): Ginzburg''s conviction for mailing *Eros*, *Liaison*, and *The Housewife''s Handbook on Selective Promiscuity* affirmed, 5–4, for "pandering"; Brennan for the Court; Black, Douglas, Harlan, Stewart dissent. *Mishkin v. New York*, [383 U.S. 502](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383502/usrep383502.pdf): affirmed, 6–3.'
    n: '[[w.grazia-girls-lean-back-everywhere]]; [[w.powe-warren-court-and-american]]. Names: Ginzburg, Brennan.'
    tags: [name:ginzburg-ralph, name:brennan-william-j-jr]
  - id: cal.1966-03-21.program
    when: Mar. 21
    date: '1966-03-21'
    thread: program
    c: 'Message on consumer interests: truth in lending, the price of credit stated; fair packaging and labeling; hazardous household substances and children''s toys banned; warnings on drugs, cosmetics, and food in pressurized cans; more for the Food and Drug Administration.'
    n: '[Special Message to the Congress on Consumer Interests](https://www.presidency.ucsb.edu/documents/special-message-the-congress-consumer-interests-0) (Mar. 21, 1966). See [[cal.1964-02-05.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-22.transportation
    when: Mar. 22
    date: '1966-03-22'
    thread: transportation-auto-safety
    c: 'Ribicoff''s Subcommittee on Executive Reorganization. Roche, president of General Motors: GM, through its lawyers, had private detectives look into Nader, author of *Unsafe at Any Speed*; he apologizes. GM had owned to an inquiry Mar. 9, after press reports that Nader was followed (Check). Nader testifies the same day.'
    n: '*Federal Role in Traffic Safety: Hearings before the Subcommittee on Executive Reorganization of the Senate Committee on Government Operations*, 89th Cong., 2d sess. (1966) (Check the part). [[w.mccarry-citizen-nader]]; [[w.martin-nader]]; [[w.mashaw-struggle-for-auto-safety]]; [[w.nader-unsafe-at-any-speed]]. See [[cal.1966-03-02.transportation]]. See [[cal.1965-11-30.transportation]]. Names: Ribicoff, Nader, Roche.'
    tags: [name:ribicoff-abraham, name:nader-ralph, name:roche-james-m]
  - id: cal.1966-03-22.economy
    when: Mar. 22
    date: '1966-03-22'
    thread: economy
    c: 'Inflation. News conference: economists urge a tax increase; Johnson cites slowing signs (retail sales, durable orders, housing starts at a three-year low) and watches.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1162) (Mar. 22, 1966). [[w.okun-political-economy-of-prosperity]]; [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]. See [[cal.1966-03-15.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-22.legislatures-ny
    when: Mar. 22
    date: '1966-03-22'
    thread: legislatures
    also: [court]
    c: 'New York. The Court of Appeals adopts the districts drawn by its commission of five, Marden of the American Bar Association chairman, named Feb. 23 when the Republican Senate and the Democratic Assembly could not agree: a Senate of 57, an Assembly of 150, in force without the legislature''s vote.'
    n: '*Matter of Orans*, [17 N.Y.2d 107](https://static.case.law/ny-2d/17/case-pdfs/0107-01.pdf) (1966). [*New York Times*, Mar. 15, 1966](https://www.nytimes.com/1966/03/15/archives/commission-ends-redistricting-job-legislators-await-details-of-plan.html). [[w.dullea-charter-revision-in-the]], 79. See [[cal.1965-11-02.legislatures-ny]].'
    tags: [state:ny]
  - id: cal.1966-03-22.amendments
    when: Mar. 22
    date: '1966-03-22'
    thread: amendments
    also: [court, congress]
    c: 'Dirksen introduces S.J. Res. 148, for himself and sixteen others: an amendment to permit voluntary prayer in the public schools. "Nothing contained in this Constitution shall prohibit the authority administering any school ... from providing for or permitting the voluntary participation by students or others in prayer." No authority to prescribe a prayer''s form or content. Thirty-nine cosponsors by the session''s end.'
    n: '[112 Cong. Rec. 6477](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt5/pdf/GPO-CRECB-1966-pt5-7-1.pdf#page=42) (1966); History of Bills, 1966, [S.J. Res. 148](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt22/pdf/GPO-CRECB-1966-pt22-2.pdf#page=47). [[w.dierenfield-battle-over-school-prayer]]; [[w.macneil-dirksen]]; [[w.hulsey-everett-dirksen-and-his]]; [[w.kyvig-explicit-and-authentic-acts]]. See [[cal.1962-06-25.court]]; [[cal.1965-08-04.court]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1966-03-22.vietnam-supplemental
    when: Mar. 22
    date: '1966-03-22'
    thread: vietnam-supplemental
    also: [defense]
    c: The Senate passes the supplemental defense appropriation, H.R. 13546, [87–2](https://voteview.com/rollcall/RS0890286).
    n: 'Check: the Record''s page. See [[cal.1966-01-19.vietnam]].'
  - id: cal.1966-03-22.europe-and-the-alliance-france
    when: Mar. 22
    date: '1966-03-22'
    thread: europe-and-the-alliance-france
    c: 'Johnson''s reply to de Gaulle: the treaty "the outward and visible form of a living institution."'
    n: 'FRUS 1964–68, XIII, docs. [146](https://history.state.gov/historicaldocuments/frus1964-68v13/d146), [147](https://history.state.gov/historicaldocuments/frus1964-68v13/d147). See [[cal.1966-03-07.europe-and-the-alliance]]. Names: Johnson, de Gaulle.'
    tags: [name:johnson-lyndon-b, name:de-gaulle-charles]
  - id: cal.1966-03-23.europe-and-the-alliance-france
    when: Mar. 23
    date: '1966-03-23'
    thread: europe-and-the-alliance-france
    c: Johnson on NATO to the Foreign Service Institute.
    n: '[Remarks on the North Atlantic Treaty Organization to the Foreign Service Institute](https://www.presidency.ucsb.edu/documents/remarks-the-north-atlantic-treaty-organization-the-foreign-service-institute) (Mar. 23, 1966). See [[cal.1966-03-07.europe-and-the-alliance]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-24.court
    when: Mar. 24
    date: '1966-03-24'
    thread: court
    also: [voting-rights]
    c: '*Harper v. Virginia State Board of Elections*, [383 U.S. 663](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383663/usrep383663.pdf): Virginia''s poll tax of $1.50 in State elections void under the equal protection clause; *Breedlove v. Suttles* (1937) overruled so far. Douglas for the Court, 6–3: "Wealth, like race, creed, or color, is not germane to one''s ability to participate intelligently in the electoral process." Black, Harlan, Stewart dissent.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.lawson-black-ballots]]; [[w.powe-warren-court-and-american]]. See [[cal.1966-03-07.court]]. Names: Douglas.'
    tags: [name:douglas-william-o]
  - id: cal.1966-03-24.jobs-and-wages-il
    when: Mar. 24
    date: '1966-03-24'
    thread: jobs-and-wages
    also: [civil-rights-bill]
    c: 'Illinois Supreme Court, *Motorola, Inc. v. Illinois Fair Employment Practices Commission*: the Commission''s order reversed. Myart, a Negro applicant at Motorola''s plant in Franklin Park, Ill., July 1963; the Commission''s hearing examiner found his test score falsely recorded, and the five-minute ability test unfair to "the hitherto culturally deprived," and ordered it dropped. The examiner''s ruling, 1964, cited in the Senate''s debate on Title VII''s ability tests (Check).'
    n: '*Motorola, Inc. v. Illinois Fair Employment Practices Commission*, [34 Ill. 2d 266](https://static.case.law/ill-2d/34/case-pdfs/0266-01.pdf) (1966), under the Fair Employment Practices Act of 1961, Ill. Rev. Stat. 1963, ch. 48, pars. 851–66. [[w.chen-fifth-freedom]]. See [[cal.1964-07-02.civil-rights-bill]]. Names: Myart.'
    tags: [state:il, name:myart-leon]
  - id: cal.1966-03-25.students
    when: Mar. 25–26
    date: '1966-03-25'
    thread: students
    also: [vietnam]
    c: 'The second International Days of Protest against the war, called by the National Coordinating Committee to End the War in Vietnam: marches and rallies in many cities. New York, Mar. 26: a march down Fifth Avenue, the largest (Check the numbers).'
    n: '[[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]; [[w.wells-war-within]]. See [[cal.1965-10-15.students]].'
  - id: cal.1966-03-25.opinion
    when: Mar. 25
    date: '1966-03-25'
    thread: opinion
    c: 'Gallup, Mar. 3–8: can identify Rusk, 65 percent; college-educated nine in ten, grade school 39. Of them, his grade as Secretary of State: A 32, B 33, C 15, D 2, flunk 3. Republicans A 22; Democrats A 40.'
    n: '[[w.gallup-poll]], III, 1997. Names: Rusk.'
    tags: [name:rusk-dean]
  - id: cal.1966-03-25.vietnam-supplemental
    when: Mar. 25
    date: '1966-03-25'
    thread: vietnam-supplemental
    also: [defense]
    c: Supplemental defense appropriation signed, [80 Stat. 79](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg79.pdf).
    n: See [[cal.1966-01-19.vietnam]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-26.specials
    when: Mar. 26
    date: '1966-03-26'
    thread: specials
    c: Texas 8th, special. Lera Thomas (D) holds her husband's seat, 6,120 to 2,147 over Leman (R), 74.0 percent; Albert Thomas died Feb. 15. Swing 2.7 to R.
    n: 'Votes: CQ Guide 6th (2010) 1281. Check: Tex. Secretary of State, election returns. See [[cal.1961-04-04.states-and-cities]]. Names: Albert Thomas, Lera Thomas.'
    tags: [special:1966-03-26-h-TX-8, name:thomas-albert, name:thomas-lera-m]
  - id: cal.1966-03-28.court
    when: Mar. 28
    date: '1966-03-28'
    thread: court
    also: [mississippi, georgia, civil-rights-the-executive]
    c: 'Two cases from the South. *United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf): the federal indictments of the eighteen charged in the Neshoba County, Miss., murders of 1964 reinstated; private persons acting jointly with State officers act "under color" of law. Fortas for a unanimous Court. *United States v. Guest*, [383 U.S. 745](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383745/usrep383745.pdf): the indictment of six for conspiracy in the murder of Lemuel Penn reinstated, as alleging interference with interstate travel; Stewart for the Court. Six Justices, in two concurrences, would let Congress reach private conspiracies against Fourteenth Amendment rights.'
    n: 'Opinions (K–J Adm. II.H.1). [[w.belknap-federal-law-and-southern]]; [[w.cagin-we-are-not-afraid]]; [[w.landsberg-enforcing-civil-rights]]. See [[cal.1964-12-04.mississippi]]; [[cal.1964-12-29.civil-rights-the-executive]]. Names: Penn.'
    tags: [name:penn-lemuel-a]
  - id: cal.1966-03-28.india-and-china
    when: Mar. 28–29
    date: '1966-03-28'
    thread: india-and-china-food
    also: [foreign-aid, farm]
    c: 'Indira Gandhi in Washington, her first visit as Prime Minister. Joint statement: India''s drought; the food deficit a worldwide problem.'
    n: '[Remarks of Welcome to Prime Minister Gandhi of India on the South Lawn at the White House](https://www.presidency.ucsb.edu/documents/remarks-welcome-prime-minister-gandhi-india-the-south-lawn-the-white-house) (Mar. 28, 1966); [Joint Statement Following Discussions With Prime Minister Gandhi of India](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-prime-minister-gandhi-india) (Mar. 29, 1966). FRUS 1964–68, XXV, docs. [307](https://history.state.gov/historicaldocuments/frus1964-68v25/d307), [309](https://history.state.gov/historicaldocuments/frus1964-68v25/d309), [310](https://history.state.gov/historicaldocuments/frus1964-68v25/d310). [[w.ahlberg-transplanting-the-great-society]]; [[w.kux-india-and-the-united]]; [[w.mcmahon-cold-war-on-the]]. See [[cal.1965-12-14.india-and-china]]; [[cal.1966-02-04.india-and-china-food]]. Names: Johnson, Indira Gandhi.'
    tags: [name:gandhi-indira, name:johnson-lyndon-b]
  - id: cal.1966-03-28.vietnam
    when: Mar. 28
    date: '1966-03-28'
    thread: vietnam
    c: 'NSAM 343: Komer made Special Assistant to the President for the nonmilitary programs in Vietnam, "peaceful construction," with Leonhart as deputy and direct access to the President; the rural construction (pacification) program to be fitted to military operations. Johnson: "the war on human misery and want" as fundamental as the military operations.'
    n: 'NSAM 343, FRUS 1964–68, IV, doc. [102](https://history.state.gov/historicaldocuments/frus1964-68v04/d102). [[w.jones-blowtorch]]; [[w.hunt-pacification]]; [[w.komer-bureaucracy-at-war]]. Names: Komer, Leonhart, Johnson.'
    tags: [name:komer-robert-w, name:leonhart-william, name:johnson-lyndon-b]
  - id: cal.1966-03-29.cities-and-housing
    when: Mar. 29
    date: '1966-03-29'
    thread: cities-and-housing
    c: Rent supplements, again, in the second supplemental appropriation, H.R. 14012. The House refuses to recommit it to strike their money, [190–198](https://voteview.com/rollcall/RH0890227), and passes it, [269–122](https://voteview.com/rollcall/RH0890228).
    n: See [[cal.1965-10-14.cities-and-housing]].
  - id: cal.1966-03-29.europe-and-the-alliance-france
    when: Mar. 29
    date: '1966-03-29'
    thread: europe-and-the-alliance-france
    c: 'A second French aide-mémoire: French forces out of the allied commands July 1, 1966; allied headquarters and forces out of France by Apr. 1, 1967.'
    n: '*American Foreign Policy: Current Documents, 1966*, pp. 317–323 (Check the page). See [[cal.1966-03-07.europe-and-the-alliance]].'
  - id: cal.1966-03-29.transportation-auto-safety
    when: Mar. 29
    date: '1966-03-29'
    thread: transportation-auto-safety
    c: The Senate passes the tire safety bill, S. 2669, [79–0](https://voteview.com/rollcall/RS0890287).
    n: 'Check: the Record''s page. See [[cal.1966-03-22.transportation]].'
  - id: cal.1966-03-30.state-and-city-finance-md
    when: Mar. 30
    date: '1966-03-30'
    thread: state-and-city-finance
    c: 'Maryland. Special session: an enabling act for income or payroll taxes by Baltimore City or any county.'
    n: '*Maryland Manual*, 1967–68, [p. 289](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--289.html). [[w.callcott-maryland-and-america-1940]]; [[w.durr-behind-the-backlash]].'
    tags: [state:md, city:baltimore]
  - id: cal.1966-03-30.vietnam-struggle
    when: Mar. 30
    date: '1966-03-30'
    thread: vietnam-struggle
    c: 'Rusk to Lodge: Huế radio''s attacks on the Americans "increasingly difficult" to explain to Congress.'
    n: 'FRUS 1964–68, IV, docs. [105](https://history.state.gov/historicaldocuments/frus1964-68v04/d105), [107](https://history.state.gov/historicaldocuments/frus1964-68v04/d107). See [[cal.1966-03-10.vietnam]]. Names: Rusk, Lodge.'
    tags: [name:rusk-dean, name:lodge-henry-cabot]
  - id: cal.1966-03-30.economy
    when: Mar. 30
    date: '1966-03-30'
    thread: economy
    c: 'Johnson with the Business Council: he asks how many would recommend a tax increase, and asks restraint in capital investment.'
    n: 'Check: the record; no Public Papers item. See [[cal.1966-03-22.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-30.india-and-china-food
    when: Mar. 30
    date: '1966-03-30'
    thread: india-and-china-food
    also: [foreign-aid, farm]
    c: 'Message to Congress on food for India: of India''s 7 million tons still needed for 1966, 3.5 million from the United States, the rest from other nations; corn, vegetable oil, milk powder; an Indo-U.S. Foundation on surplus rupees.'
    n: '[Special Message to the Congress Proposing an Emergency Food Aid Program for India](https://www.presidency.ucsb.edu/documents/special-message-the-congress-proposing-emergency-food-aid-program-for-india) (Mar. 30, 1966). [FRUS 1964–68, XXV, doc. 311](https://history.state.gov/historicaldocuments/frus1964-68v25/d311). See [[cal.1966-03-28.india-and-china]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-31.transition-and-staff
    when: Mar. 31
    date: '1966-03-31'
    thread: transition-and-staff
    c: News conference. Rostow, chairman of State's Policy Planning Council, named Special Assistant, "principally, but not necessarily exclusively, in the field of foreign policy"; Bundy had left Feb. 28, Komer acting since. Kintner, of NBC, Special Assistant and Secretary to the Cabinet.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1163) (Mar. 31, 1966). [[w.milne-americas-rasputin]]; [[w.preston-war-council]]. Names: Rostow, Bundy, Komer, Kintner, Johnson.'
    tags: [name:rostow-walt-w, name:bundy-mcgeorge, name:komer-robert-w, name:kintner-robert-e, name:johnson-lyndon-b]
  - id: cal.1966-03-31.desegregation-schools-seattle
    when: Mar. 31–Apr. 1
    date: '1966-03-31'
    thread: desegregation-schools
    also: [civil-rights-organizations]
    c: 'Seattle. School boycott against the segregation of the Central Area''s schools, called by the Central Area Civil Rights Committee, CORE and the NAACP: some 4,000 students out, about 3,000 of them in Freedom Schools (the organizers'' figures).'
    n: '[Wikipedia, "Seattle school boycott of 1966"](https://en.wikipedia.org/wiki/Seattle_school_boycott_of_1966); Check: the University of Washington''s Seattle Civil Rights and Labor History Project. [[w.taylor-forging-of-a-black]].'
    tags: [state:wa, city:seattle]
  - id: cal.1966-03.transportation-san-francisco
    when: Mar.
    date: 1966-03
    thread: transportation
    also: [cities-and-housing]
    c: San Francisco. The Board of Supervisors again rejects the freeway through the Panhandle, as in 1959. Check the day, Mar. 21, and the vote, 6–5.
    n: '[*Journal of Proceedings, Board of Supervisors, City and County of San Francisco*, Mar. 21, 1966, 189–191](https://archive.org/details/journalofproceed61sanfrich). [[w.mohl-stop-the-road]]; [[w.hartman-city-for-sale]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1966-03-31.health-us
    when: Mar. 31
    date: '1966-03-31'
    thread: health
    also: [welfare]
    c: 'Medicaid''s first States. North Dakota, Oklahoma, Illinois, Minnesota, Hawaii, Pennsylvania and Puerto Rico, their programs under Title XIX from Jan. 1, conclude their agreements at the White House; the federal share 50 to 80 percent of the cost. Winston, the Commissioner of Welfare: 24 more States at work on plans.'
    n: '[Remarks at a Meeting Marking the Inauguration of the State-Federal (Title 19) Medical Assistance Program](https://www.presidency.ucsb.edu/documents/remarks-meeting-marking-the-inauguration-the-state-federal-title-19-medical-assistance) (Mar. 31, 1966). [[w.stevens-welfare-medicine-in-america]]; [[w.david-with-dignity]]; [[w.weikel-decade-of-medicaid]]. See [[cal.1965-07-30.medicare]]. Names: Johnson, Winston.'
    tags: [name:johnson-lyndon-b, name:winston-ellen, state:nd, state:ok, state:il, state:mn, state:hi, state:pa]
  - id: cal.1966-03-31.middle-east
    when: Mar. 31
    date: '1966-03-31'
    thread: middle-east
    c: 'McNaughton to McNamara: the aircraft sales to Israel and Jordan concluded.'
    n: '[FRUS 1964–68, XVIII, doc. 283](https://history.state.gov/historicaldocuments/frus1964-68v18/d283). See [[cal.1966-03-17.middle-east]]. Names: McNaughton, McNamara.'
    tags: [name:mcnaughton-john-t, name:mcnamara-robert-s]
  - id: cal.1966-03-31.economy
    when: Mar. 31
    date: '1966-03-31'
    thread: economy
    c: 'Johnson to the National League of Cities: the economy "managed with restraint"; if more is needed, "because civilian demand is too large." A news conference the same day.'
    n: '[Remarks Before the National Legislative Conference of the National League of Cities](https://www.presidency.ucsb.edu/documents/remarks-before-the-national-legislative-conference-the-national-league-cities) (Mar. 31, 1966); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1163) (Mar. 31, 1966). See [[cal.1966-03-22.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
