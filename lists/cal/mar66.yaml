# Cal. LXXVI March 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXVI
entries:
  - id: cal.1966-03-01.vietnam
    when: Mar. 1–25
    date: '1966-03-01'
    thread: vietnam
    also: [congress, defense]
    c: 'The war''s supplemental, through Congress. Mar. 1, the Senate tables Morse''s amendment to repeal the Southeast Asia resolution of Aug. 1964, [92–5](https://voteview.com/rollcall/RS0890270): Morse, Gruening, Fulbright, McCarthy, Young of Ohio the five. Gruening''s, to keep draftees from Southeast Asia''s combat areas without Congress''s consent, tabled [94–2](https://voteview.com/rollcall/RS0890271). The authorization, $4.8 billion for aircraft, missiles, and construction, passes, [93–2](https://voteview.com/rollcall/RS0890272); the House''s, [393–4](https://voteview.com/rollcall/RH0890216). Signed Mar. 15, [80 Stat. 36](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg36.pdf). The appropriation, some $13 billion: House, Mar. 15, [389–3](https://voteview.com/rollcall/RH0890222); Senate, Mar. 22, [87–2](https://voteview.com/rollcall/RS0890286); signed Mar. 25, [80 Stat. 79](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg79.pdf).'
    n: '[Remarks at the Signing of the Supplemental Military Authorization Bill](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-supplemental-military-authorization-bill) (Mar. 15, 1966). [[w.gibbons-u-s-government-and-1995]]; [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]. See [[cal.1966-02-04.vietnam]]. Names: Morse, Gruening, Fulbright (Viet. III.E); McCarthy (K–J Cong. III.B).'
    tags: [name:morse-wayne, name:gruening-ernest, name:fulbright-j-william, name:mccarthy-eugene-j, name:young-stephen-m, name:johnson-lyndon-b]
  - id: cal.1966-03-02.transportation
    when: Mar. 2
    date: '1966-03-02'
    thread: transportation
    c: 'Message on transportation. A Cabinet Department of Transportation: the Federal Aviation Agency whole; the Coast Guard from the Treasury; the Bureau of Public Roads; the Maritime Administration; the safety work of the ICC and the CAB; the St. Lawrence Seaway corporation, the Alaska Railroad. Almost 100,000 employees, almost $6 billion. A Traffic Safety Act: $700 million over six years for State programs under federal standards; safety standards for new cars, voluntary for two years, then, if need be, prescribed. The tire safety bill, S. 2669, urged. "50,000 highway deaths this year."'
    n: '[Special Message to the Congress on Transportation](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transportation-0) (Mar. 2, 1966). [[w.davis-department-of-transportation]]; [[w.califano-triumph-and-tragedy-of]]; [[w.mashaw-struggle-for-auto-safety]]; [[w.eastman-styling-vs-safety]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-02.transition-and-staff
    when: Mar. 2–4
    date: '1966-03-02'
    thread: transition-and-staff
    c: 'NSAM 341: the Secretary of State given "overall direction, coordination and supervision" of interdepartmental activities overseas, forces under an area commander excepted. A Senior Interdepartmental Group, the Under Secretary of State its executive chairman, with Defense, AID, the CIA, the Joint Chiefs, USIA, and the national security assistant; Interdepartmental Regional Groups under the Assistant Secretaries. The SIG takes over the Special Group (Counterinsurgency). Taylor''s design. Announced Mar. 4.'
    n: 'NSAM 341, FRUS 1964–68, XXXIII, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v33/d56), [58](https://history.state.gov/historicaldocuments/frus1964-68v33/d58). [[w.taylor-swords-and-plowshares]]; [[w.johnson-right-hand-of-power]]. Names: Taylor (K–J Adm. III.F).'
    tags: [name:taylor-maxwell, name:johnson-lyndon-b]
  - id: cal.1966-03-03.school-aid
    when: Mar. 3
    date: '1966-03-03'
    thread: school-aid
    also: [vietnam]
    c: 'Veterans'' Readjustment Benefits Act signed in the East Room, [80 Stat. 12](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg12.pdf), the "Cold War GI Bill": for service after Jan. 31, 1955, schooling at $100 a month, $125 with one dependent, $150 with more; home loans; medical care. Yarborough its author in the Senate; Teague''s committee reported it in the House.'
    n: '[Remarks Upon Signing the "Cold War GI Bill" (Veterans'' Readjustment Benefits Act of 1966)](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-cold-war-gi-bill-veterans-readjustment-benefits-act-1966) (Mar. 3, 1966). [[w.cox-ralph-w-yarborough-the]]. Names: Yarborough (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:yarborough-ralph, name:teague-olin-e]
  - id: cal.1966-03-07.court
    when: Mar. 7
    date: '1966-03-07'
    thread: court
    also: [voting-rights, south-carolina]
    c: '*South Carolina v. Katzenbach*, [383 U.S. 301](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383301/usrep383301.pdf): the Voting Rights Act upheld under the Fifteenth Amendment''s enforcement clause: the coverage formula, the suspension of literacy tests, the federal examiners, the review of new voting laws. Warren for the Court; Black dissents from the review of new State laws alone.'
    n: 'Opinion (K–J Cong. II.J.1). Also Opp. II.H.1. [[w.lawson-black-ballots]]; [[w.landsberg-enforcing-civil-rights]]; [[w.katzenbach-some-of-it-was]]; [[w.powe-warren-court-and-american]]. See [[cal.1965-08-07.voting-rights]]. Names: Warren, Black (K–J Cong. III.G).'
    tags: [name:warren-earl, name:black-hugo-l]
  - id: cal.1966-03-07.europe-and-the-alliance
    when: Mar. 7–29
    date: '1966-03-07'
    thread: europe-and-the-alliance
    c: 'De Gaulle to Johnson, by hand: France stays party to the North Atlantic Treaty but will recover "the entire exercise of her sovereignty over her territory," end her part in the integrated commands, and no longer put her forces at NATO''s disposal. Mar. 11, the French aide-mémoire. Mar. 18, the Declaration of the Fourteen. Mar. 22, Johnson''s reply: the treaty "the outward and visible form of a living institution." Mar. 23, Johnson on NATO to the Foreign Service Institute. Mar. 29, a second aide-mémoire: French forces out of the allied commands July 1, 1966; allied headquarters and forces out of France by Apr. 1, 1967.'
    n: 'FRUS 1964–68, XIII, docs. [136](https://history.state.gov/historicaldocuments/frus1964-68v13/d136), [137](https://history.state.gov/historicaldocuments/frus1964-68v13/d137), [141](https://history.state.gov/historicaldocuments/frus1964-68v13/d141), [142](https://history.state.gov/historicaldocuments/frus1964-68v13/d142), [146](https://history.state.gov/historicaldocuments/frus1964-68v13/d146), [147](https://history.state.gov/historicaldocuments/frus1964-68v13/d147). *American Foreign Policy: Current Documents, 1966*, pp. 317–323. [Remarks on the North Atlantic Treaty Organization to the Foreign Service Institute](https://www.presidency.ucsb.edu/documents/remarks-the-north-atlantic-treaty-organization-the-foreign-service-institute) (Mar. 23, 1966). [[w.schwartz-lyndon-johnson-and-europe]]; [[w.bozo-two-strategies-for-europe]]; [[w.priest-kennedy-johnson-and-nato]]; [[w.jackson-de-gaulle]]; [[w.bohlen-witness-to-history-1929]]. See [[cal.1965-12-20.europe-and-the-alliance]]. Names: de Gaulle (K–J Adm. III.J); Johnson (K–J Adm. III.D).'
    tags: [name:de-gaulle-charles, name:johnson-lyndon-b]
  - id: cal.1966-03-08.india-and-china
    when: Mar. 8–30
    date: '1966-03-08'
    thread: india-and-china
    c: 'The Senate Foreign Relations Committee, Fulbright presiding, hears scholars on policy toward mainland China. Mar. 8, A. Doak Barnett of Columbia: "containment but not isolation." Fairbank of Harvard Mar. 10 (Check). Mar. 13, Humphrey on *Meet the Press*: containment "without necessarily isolation" (Check the words).'
    n: '*U.S. Policy with Respect to Mainland China: Hearings before the Senate Committee on Foreign Relations*, 89th Cong., 2d sess. (1966). [[w.foot-practice-of-power]]; [[w.kusnitz-public-opinion-and-foreign]]; [[w.goh-constructing-the-u-s]]; [[w.woods-fulbright]]. Names: Fulbright (K–J Cong. III.B); Humphrey (K–J Adm. III.D).'
    tags: [name:fulbright-j-william, name:humphrey-hubert-h]
  - id: cal.1966-03-09.crime-and-hijacking
    when: Mar. 9
    date: '1966-03-09'
    thread: crime-and-hijacking
    c: 'Message on crime and law enforcement: a year at college for selected police officers; control of the interstate traffic in firearms, S. 1592; a commission to revise the federal criminal code by 1968; bail reform; the federal prisons, parole, and probation joined in the Justice Department. For the District: higher police pay, a pistol registration act.'
    n: '[Special Message to the Congress on Crime and Law Enforcement](https://www.presidency.ucsb.edu/documents/special-message-the-congress-crime-and-law-enforcement) (Mar. 9, 1966). See [[cal.1965-03-08.crime-and-hijacking]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-10.vietnam
    when: Mar. 10–31
    date: '1966-03-10'
    thread: vietnam
    c: 'The Directorate relieves Thi of the I Corps command; Kỳ had told Lodge Mar. 9 of Thi''s insubordination, Lodge answering that it was an internal affair. Mar. 11, rallies for Thi at Đà Nẵng; strikes and closed schools spread to Huế and, by Mar. 19, to Saigon. Mar. 12, the Unified Buddhist Church, Tâm Châu presiding: civilian government, a National Assembly, generals back to their military duties. The Struggle Movement holds Đà Nẵng and Huế. Mar. 30, Rusk to Lodge: Huế radio''s attacks on the Americans "increasingly difficult" to explain to Congress.'
    n: 'FRUS 1964–68, IV, docs. [91](https://history.state.gov/historicaldocuments/frus1964-68v04/d91), [94](https://history.state.gov/historicaldocuments/frus1964-68v04/d94), [95](https://history.state.gov/historicaldocuments/frus1964-68v04/d95), [99](https://history.state.gov/historicaldocuments/frus1964-68v04/d99), [100](https://history.state.gov/historicaldocuments/frus1964-68v04/d100), [105](https://history.state.gov/historicaldocuments/frus1964-68v04/d105), [107](https://history.state.gov/historicaldocuments/frus1964-68v04/d107). [[w.topmiller-lotus-unleashed]]; [[w.minh-vietnamese-engaged-buddhism]]; [[w.luu-buddhist-crises-in-vietnam]]; [[w.moyar-political-monks]]; [[w.kahin-intervention]]; [[w.fitzgerald-fire-in-the-lake]]; [[w.ky-twenty-years-and-twenty]]; [[w.blair-lodge-in-vietnam]]; [[w.gibbons-u-s-government-and-1995]]. Names: Kỳ (Viet. III.G); Lodge (Viet. III.C); Rusk (Viet. III.A).'
    tags: [name:nguyen-chanh-thi, name:nguyen-cao-ky, name:lodge-henry-cabot, name:tam-chau, name:rusk-dean]
  - id: cal.1966-03-11.india-and-china
    when: Mar. 11–18
    date: '1966-03-11'
    thread: india-and-china
    c: 'Djakarta. Sukarno, after weeks of student demonstrations and with army units about the capital, signs an order of Mar. 11 giving Suharto authority to restore order. Mar. 12, Suharto dissolves and bans the PKI. The embassy: "its own peculiar form of military coup"; Sukarno kept as a figurehead. Komer to Johnson: follow through with "a few thousand tons of surplus wheat or rice." Mar. 18, Subandrio and other ministers arrested (Check).'
    n: 'FRUS 1964–68, XXVI, docs. [199](https://history.state.gov/historicaldocuments/frus1964-68v26/d199), [200](https://history.state.gov/historicaldocuments/frus1964-68v26/d200), [201](https://history.state.gov/historicaldocuments/frus1964-68v26/d201), [203](https://history.state.gov/historicaldocuments/frus1964-68v26/d203). [[w.simpson-economists-with-guns]]; [[w.roosa-pretext-for-mass-murder]]; [[w.robinson-killing-season]]. See [[cal.1965-10-01.india-and-china]]. Names: Komer (K–J Adm. III.E).'
    tags: [name:sukarno, name:suharto, name:subandrio, name:komer-robert-w]
  - id: cal.1966-03-15.economy
    when: Mar. 15
    date: '1966-03-15'
    thread: economy
    also: [welfare]
    c: 'Tax Adjustment Act signed at night, [80 Stat. 38](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg38.pdf): some $6 billion over fifteen months, Johnson says. The excise cuts of Jan. 1 undone to Apr. 1, 1968: new cars back to 7 percent, telephone service to 10. Graduated withholding from May 1; corporations'' estimated tax paid sooner; self-employment tax in the individual''s estimate. $35 a month to some 370,000 persons 72 and over outside Social Security, from Prouty''s amendment, adopted in the Senate Mar. 8, [45–40](https://voteview.com/rollcall/RS0890275). No deduction for advertising in party convention programs. The Senate passed it Mar. 9, [79–9](https://voteview.com/rollcall/RS0890279); the conference report Mar. 15: House, [288–102](https://voteview.com/rollcall/RH0890221); Senate, [72–5](https://voteview.com/rollcall/RS0890284).'
    n: '[Statement by the President Upon Signing the Tax Adjustment Act of 1966](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-tax-adjustment-act-1966) (Mar. 15, 1966). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]; [[w.collins-more]]. See [[cal.1965-12-05.economy]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:prouty-winston-l]
  - id: cal.1966-03-16.space
    when: Mar. 16
    date: '1966-03-16'
    thread: space
    c: 'Gemini 8: Armstrong and Scott dock with an Agena target some six and a half hours after launch, the first docking in orbit. A thruster sticks open; the joined craft tumble; Armstrong casts off the Agena and steadies the capsule with the reentry thrusters. Down in the western Pacific after some ten and a half hours, the flight cut short.'
    n: '[Statement by the President Following the Safe Return of the Gemini 8 Astronauts](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-safe-return-the-gemini-8-astronauts) (Mar. 16, 1966). [[w.hacker-on-the-shoulders-of]]. See [[cal.1965-12-15.space]].'
  - id: cal.1966-03-16.foreign-aid
    when: Mar. 16
    date: '1966-03-16'
    thread: foreign-aid
    c: 'Asian Development Bank Act signed, [80 Stat. 71](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg71.pdf): American membership, and $200 million for 20,000 shares of the bank''s capital. Johnson: "This billion dollar bank."'
    n: '[Remarks at the Signing of the Asian Development Bank Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-asian-development-bank-act) (Mar. 16, 1966). See [[cal.1965-04-07.vietnam]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-21.court
    when: Mar. 21
    date: '1966-03-21'
    thread: court
    c: 'Obscenity. *Memoirs v. Massachusetts*, [383 U.S. 413](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383413/usrep383413.pdf): *Fanny Hill* not obscene; Brennan''s plurality: a book must be "utterly without redeeming social value"; Clark, Harlan, White dissent. *Ginzburg v. United States*, [383 U.S. 463](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383463/usrep383463.pdf): Ginzburg''s conviction for mailing *Eros*, *Liaison*, and *The Housewife''s Handbook on Selective Promiscuity* affirmed, 5–4, for "pandering"; Brennan for the Court; Black, Douglas, Harlan, Stewart dissent. *Mishkin v. New York*, [383 U.S. 502](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383502/usrep383502.pdf): affirmed, 6–3.'
    n: '[[w.grazia-girls-lean-back-everywhere]]; [[w.powe-warren-court-and-american]]. Names: Ginzburg (K–J Cong. III.K); Brennan, Clark, Harlan, White, Black, Douglas, Stewart (K–J Cong. III.G).'
    tags: [name:ginzburg-ralph, name:brennan-william-j-jr, name:clark-tom-c, name:harlan-john-marshall, name:white-byron-r, name:black-hugo-l, name:douglas-william-o, name:stewart-potter]
  - id: cal.1966-03-21.program
    when: Mar. 21
    date: '1966-03-21'
    thread: program
    c: 'Message on consumer interests: truth in lending, the price of credit stated; fair packaging and labeling; hazardous household substances and children''s toys banned; warnings on drugs, cosmetics, and food in pressurized cans; more for the Food and Drug Administration.'
    n: '[Special Message to the Congress on Consumer Interests](https://www.presidency.ucsb.edu/documents/special-message-the-congress-consumer-interests-0) (Mar. 21, 1966). See [[cal.1964-02-05.program]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-22.transportation
    when: Mar. 22–29
    date: '1966-03-22'
    thread: transportation
    c: 'Ribicoff''s Subcommittee on Executive Reorganization. Roche, president of General Motors: GM, through its lawyers, had private detectives look into Nader, author of *Unsafe at Any Speed*; he apologizes. GM had owned to an inquiry Mar. 9, after press reports that Nader was followed (Check). Nader testifies the same day. Mar. 29, the Senate passes the tire safety bill, [79–0](https://voteview.com/rollcall/RS0890287).'
    n: '*Federal Role in Traffic Safety: Hearings before the Subcommittee on Executive Reorganization of the Senate Committee on Government Operations*, 89th Cong., 2d sess. (1966) (Check the part). [[w.mccarry-citizen-nader]]; [[w.martin-nader]]; [[w.mashaw-struggle-for-auto-safety]]; [[w.nader-unsafe-at-any-speed]]. See [[cal.1966-03-02.transportation]]. Names: Ribicoff (K–J Adm. III.G); Nader (K–J Cong. III.H).'
    tags: [name:ribicoff-abraham, name:nader-ralph]
  - id: cal.1966-03-22.economy
    when: Mar. 22–31
    date: '1966-03-22'
    thread: economy
    c: 'Inflation. Mar. 22, news conference: economists urge a tax increase; Johnson cites slowing signs (retail sales, durable orders, housing starts at a three-year low) and watches. Mar. 30, with the Business Council: he asks how many would recommend a tax increase, and asks restraint in capital investment. Mar. 31, to the National League of Cities: "managed with restraint"; if more is needed, "because civilian demand is too large."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1162) (Mar. 22, 1966); [Remarks Before the National Legislative Conference of the National League of Cities](https://www.presidency.ucsb.edu/documents/remarks-before-the-national-legislative-conference-the-national-league-cities) (Mar. 31, 1966); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1163) (Mar. 31, 1966). [[w.okun-political-economy-of-prosperity]]; [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]. See [[cal.1966-03-15.economy]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-24.court
    when: Mar. 24
    date: '1966-03-24'
    thread: court
    also: [voting-rights]
    c: '*Harper v. Virginia State Board of Elections*, [383 U.S. 663](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383663/usrep383663.pdf): Virginia''s poll tax of $1.50 in State elections void under the equal protection clause; *Breedlove v. Suttles* (1937) overruled so far. Douglas for the Court, 6–3: "Wealth, like race, creed, or color, is not germane to one''s ability to participate intelligently in the electoral process." Black, Harlan, Stewart dissent.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.lawson-black-ballots]]; [[w.powe-warren-court-and-american]]. See [[cal.1966-03-07.court]]. Names: Douglas, Black, Harlan, Stewart (K–J Cong. III.G).'
    tags: [name:douglas-william-o, name:black-hugo-l, name:harlan-john-marshall, name:stewart-potter]
  - id: cal.1966-03-25.students
    when: Mar. 25–26
    date: '1966-03-25'
    thread: students
    also: [vietnam]
    c: 'The second International Days of Protest against the war, called by the National Coordinating Committee to End the War in Vietnam: marches and rallies in many cities. New York, Mar. 26: a march down Fifth Avenue, the largest (Check the numbers).'
    n: '[[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]; [[w.wells-war-within]]. See [[cal.1965-10-15.students]].'
  - id: cal.1966-03-26.specials
    when: Mar. 26
    date: '1966-03-26'
    thread: specials
    c: Texas 8th, special. Lera Thomas (D) holds her husband's seat, 6,120 to 2,147 over Leman (R), 74.0 percent; Albert Thomas died Feb. 15. Swing 2.7 to R.
    n: 'Votes: CQ Guide 6th (2010) 1281. Check: Tex. Secretary of State, election returns. See [[cal.1961-04-04.states-and-cities]]. Names: Thomas (K–J Cong. III.D).'
    tags: [special:1966-03-26-h-TX-8, name:thomas-albert]
  - id: cal.1966-03-28.court
    when: Mar. 28
    date: '1966-03-28'
    thread: court
    also: [mississippi, georgia, civil-rights-the-executive]
    c: 'Two cases from the South. *United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf): the federal indictments of the eighteen charged in the Neshoba County, Miss., murders of 1964 reinstated; private persons acting jointly with State officers act "under color" of law. Fortas for a unanimous Court. *United States v. Guest*, [383 U.S. 745](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383745/usrep383745.pdf): the indictment of six for conspiracy in the murder of Lemuel Penn reinstated, as alleging interference with interstate travel; Stewart for the Court. Six Justices, in two concurrences, would let Congress reach private conspiracies against Fourteenth Amendment rights.'
    n: 'Opinions (K–J Adm. II.H.1). [[w.belknap-federal-law-and-southern]]; [[w.cagin-we-are-not-afraid]]; [[w.landsberg-enforcing-civil-rights]]. See [[cal.1964-12-04.mississippi]]; [[cal.1964-12-29.civil-rights-the-executive]]. Names: Fortas, Stewart (K–J Cong. III.G); Penn (K–J Cong. III.K).'
    tags: [name:fortas-abe, name:stewart-potter, name:penn-lemuel-a]
  - id: cal.1966-03-28.india-and-china
    when: Mar. 28–Apr. 19
    date: '1966-03-28'
    thread: india-and-china
    also: [foreign-aid, farm]
    c: 'Indira Gandhi in Washington, Mar. 28–29, her first visit as Prime Minister. Joint statement: India''s drought; the food deficit a worldwide problem. Mar. 30, message to Congress: of India''s 7 million tons still needed for 1966, 3.5 million from the United States, the rest from other nations; corn, vegetable oil, milk powder; an Indo-U.S. Foundation on surplus rupees. Apr. 19, the joint resolution signed, [80 Stat. 131](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg131.pdf).'
    n: '[Remarks of Welcome to Prime Minister Gandhi of India on the South Lawn at the White House](https://www.presidency.ucsb.edu/documents/remarks-welcome-prime-minister-gandhi-india-the-south-lawn-the-white-house) (Mar. 28, 1966); [Joint Statement Following Discussions With Prime Minister Gandhi of India](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-prime-minister-gandhi-india) (Mar. 29, 1966); [Special Message to the Congress Proposing an Emergency Food Aid Program for India](https://www.presidency.ucsb.edu/documents/special-message-the-congress-proposing-emergency-food-aid-program-for-india) (Mar. 30, 1966); [Statement by the President Upon Signing Resolution Supporting U.S. Participation in Food Relief for India](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-resolution-supporting-us-participation-food-relief) (Apr. 19, 1966). FRUS 1964–68, XXV, docs. [307](https://history.state.gov/historicaldocuments/frus1964-68v25/d307), [309](https://history.state.gov/historicaldocuments/frus1964-68v25/d309), [310](https://history.state.gov/historicaldocuments/frus1964-68v25/d310), [311](https://history.state.gov/historicaldocuments/frus1964-68v25/d311). [[w.ahlberg-transplanting-the-great-society]]; [[w.kux-india-and-the-united]]; [[w.mcmahon-cold-war-on-the]]. See [[cal.1965-12-14.india-and-china]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:gandhi-indira, name:johnson-lyndon-b]
  - id: cal.1966-03-28.vietnam
    when: Mar. 28
    date: '1966-03-28'
    thread: vietnam
    c: 'NSAM 343: Komer made Special Assistant to the President for the nonmilitary programs in Vietnam, "peaceful construction," with Leonhart as deputy and direct access to the President; the rural construction (pacification) program to be fitted to military operations. Johnson: "the war on human misery and want" as fundamental as the military operations.'
    n: 'NSAM 343, FRUS 1964–68, IV, doc. [102](https://history.state.gov/historicaldocuments/frus1964-68v04/d102). [[w.jones-blowtorch]]; [[w.hunt-pacification]]; [[w.komer-bureaucracy-at-war]]. Names: Komer (Viet. III.A).'
    tags: [name:komer-robert-w, name:leonhart-william, name:johnson-lyndon-b]
  - id: cal.1966-03-29.cities-and-housing
    when: Mar. 29–Apr. 27
    date: '1966-03-29'
    thread: cities-and-housing
    c: 'Rent supplements, again, in the second supplemental appropriation, H.R. 14012. The House refuses to recommit it to strike their money, [190–198](https://voteview.com/rollcall/RH0890227), and passes it, [269–122](https://voteview.com/rollcall/RH0890228). Apr. 27, the Senate keeps the $12 million, its committee''s amendment striking it lost, [45–46](https://voteview.com/rollcall/RS0890293); $20 million refused, [18–69](https://voteview.com/rollcall/RS0890292); the bill passed, [72–12](https://voteview.com/rollcall/RS0890295).'
    n: 'See [[cal.1965-10-14.cities-and-housing]].'
  - id: cal.1966-03-31.transition-and-staff
    when: Mar. 31
    date: '1966-03-31'
    thread: transition-and-staff
    c: 'News conference. Rostow, chairman of State''s Policy Planning Council, named Special Assistant, "principally, but not necessarily exclusively, in the field of foreign policy"; Bundy had left Feb. 28, Komer acting since. Kintner, of NBC, Special Assistant and Secretary to the Cabinet.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1163) (Mar. 31, 1966). [[w.milne-americas-rasputin]]; [[w.preston-war-council]]. Names: Rostow, Bundy, Komer (K–J Adm. III.E); Kintner (K–J Adm. III.C); Johnson (K–J Adm. III.D).'
    tags: [name:rostow-walt-w, name:bundy-mcgeorge, name:komer-robert-w, name:kintner-robert-e, name:johnson-lyndon-b]
