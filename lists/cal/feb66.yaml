# Cal. LXXV February 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXV
entries:
  - id: cal.1966-02-01.foreign-aid
    when: Feb. 1–10
    date: '1966-02-01'
    thread: foreign-aid
    also: [farm, india-and-china]
    c: 'Foreign aid message, Feb. 1: aid to those who help themselves; agriculture, education and health first, and help with population. For fiscal 1967, $550 million of supporting assistance for Vietnam; five-year authorizations for economic and military aid. Food for Freedom, Feb. 10: food aid no longer governed by surpluses; shipments tied to self-help; sales for foreign currencies to give way to long-term dollar credits within five years.'
    n: '[Special Message to the Congress on the Foreign Aid Program](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-foreign-aid-program) (Feb. 1, 1966); [Special Message to the Congress: Food for Freedom](https://www.presidency.ucsb.edu/documents/special-message-the-congress-food-for-freedom) (Feb. 10, 1966). [[w.ahlberg-transplanting-the-great-society]]; [[w.brands-wages-of-globalism]]. See [[cal.1964-10-08.foreign-aid]]; [[cal.1965-09-06.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-02-03.space
    when: Feb. 3
    date: '1966-02-03'
    thread: space
    also: [soviet-union]
    c: 'Luna 9, Soviet and unmanned, lands on the moon, the first soft landing, and sends back signals. Johnson to Podgorny: "all mankind applauds it."'
    n: '[Message of Congratulations Following the Landing on the Moon of the U.S.S.R.''s Luna 9](https://www.presidency.ucsb.edu/documents/message-congratulations-following-the-landing-the-moon-the-ussrs-luna-9) (Feb. 3, 1966). [[w.mcdougall-heavens-and-the-earth]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:podgorny-nikolai-v]
  - id: cal.1966-02-04.vietnam
    when: Feb. 4–18
    date: '1966-02-04'
    thread: vietnam
    also: [congress, press-and-broadcasting]
    c: 'The Foreign Relations Committee, Fulbright in the chair, takes up the war in televised hearings on the $415 million of supplemental economic aid, mostly for Vietnam; Rusk heard Jan. 28, not televised. Feb. 4, Bell of AID; Feb. 8, Gavin, for holding enclaves on the coast; Feb. 10, Kennan, against widening the war; Feb. 17, Taylor; Feb. 18, Rusk. Feb. 5, Johnson to O''Brien by telephone: the hearings "a very, very disastrous break." Feb. 10, CBS shows reruns in place of Kennan; Fred W. Friendly, president of CBS News, resigns Feb. 15. The House passes the authorization Feb. 24, [350–27](https://voteview.com/rollcall/RH0890215).'
    n: 'Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam* (1966). [FRUS 1964–68, IV, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v04/d64). [[w.vietnam-hearings]]; [[w.gibbons-u-s-government-and]], IV, 222–230, 239–251; [[w.fry-debating-vietnam]]; [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]; [[w.friendly-due-to-circumstances-beyond]]. Made public, the call to O''Brien: FRUS 1964–68, IV (1998). Names: Fulbright (Viet. III.E); Rusk, Taylor (Viet. III.A); Bell (K–J Adm. III.H); Kennan (K–J Adm. III.E); Johnson (K–J Adm. III.D); O''Brien (K–J Adm. III.B).'
    tags: [name:fulbright-j-william, name:rusk-dean, name:bell-david-e, name:gavin-james-m, name:kennan-george-f, name:taylor-maxwell, name:johnson-lyndon-b, name:obrien-lawrence-f]
  - id: cal.1966-02-04.civil-rights-the-executive
    when: Feb. 4–10
    date: '1966-02-04'
    thread: civil-rights-the-executive
    c: 'Roger Wilkins, 34, sworn as Director of the Community Relations Service, Collins''s successor. Feb. 10, Reorganization Plan 1: the Service moved from Commerce to Justice.'
    n: '[Remarks at the Swearing In of Roger Wilkins as Director, Community Relations Service](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-roger-wilkins-director-community-relations-service) (Feb. 4, 1966); [Special Message to the Congress Transmitting Reorganization Plan 1 of 1966](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-reorganization-plan-1-1966-relating-the) (Feb. 10, 1966). [[w.wilkins-mans-life]]. See [[cal.1964-10-30.civil-rights-bill]]. Names: Collins (K–J Cong. III.F).'
    tags: [name:johnson-lyndon-b, name:wilkins-roger-w, name:collins-leroy]
  - id: cal.1966-02-05.specials
    when: Feb. 5
    date: '1966-02-05'
    thread: specials
    c: 'North Carolina 1st, special. Walter B. Jones (D), a State senator, holds Bonner''s seat, 21,773 to 14,308 for East (R), 60.3 percent. Bonner died Nov. 7, 1965. Swing 22.2 to R.'
    n: 'Votes: [N.C. *Manual*, 1967, p. 299](https://archive.org/details/northcarolinama1967nort/page/n316). See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1966-02-05-h-NC-1, name:jones-walter-b-sr, name:bonner-herbert-c]
  - id: cal.1966-02-06.vietnam
    when: Feb. 6–8
    date: '1966-02-06'
    thread: vietnam
    c: 'Honolulu, announced Feb. 4. Johnson, with Rusk, McNamara, Freeman, Gardner, Bell, Harriman, Lodge, Wheeler and Westmoreland; Thiệu and Kỳ with their ministers. Kỳ''s four goals: defeat the Viet Cong, eradicate social injustice, a viable economy, true democracy. Working groups on rural construction, the economy, health and education, diplomacy. The Declaration of Honolulu, Feb. 8: a constitution to be drafted, put to the people, ratified by secret ballot, and an elected government; the "war for the hearts of our people." Humphrey to go on to Saigon. Feb. 8, Johnson''s report at Los Angeles.'
    n: '[The Declaration of Honolulu](https://www.presidency.ucsb.edu/documents/the-declaration-honolulu); [Joint Statement Following Discussions in Honolulu With the Chief of State and the Prime Minister of Vietnam](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-honolulu-with-the-chief-state-and-the-prime-minister) (Feb. 8, 1966); [Remarks at the Los Angeles International Airport](https://www.presidency.ucsb.edu/documents/remarks-the-los-angeles-international-airport-following-the-presidents-return-from) (Feb. 8, 1966). [FRUS 1964–68, IV, doc. 69](https://history.state.gov/historicaldocuments/frus1964-68v04/d69). [[w.herring-lbj-and-vietnam]]; [[w.berman-lyndon-johnsons-war]]; [[w.karnow-vietnam]]; [[w.topmiller-lotus-unleashed]]. See [[cal.1965-11-28.vietnam]]. Names: Johnson, Humphrey (K–J Adm. III.D); Rusk, McNamara, Harriman, Wheeler (Viet. III.A); Freeman, Gardner (K–J Adm. III.G); Bell (K–J Adm. III.H); Lodge (Viet. III.C); Westmoreland (Viet. III.D); Thiệu, Kỳ (Viet. III.G).'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:freeman-orville-l, name:gardner-john-w, name:bell-david-e, name:harriman-w-averell, name:lodge-henry-cabot, name:wheeler-earle, name:westmoreland-william, name:nguyen-van-thieu, name:nguyen-cao-ky, name:humphrey-hubert-h]
  - id: cal.1966-02-08.specials
    when: Feb. 8
    date: '1966-02-08'
    thread: specials
    c: 'New York 17th, special. Kupferman (R), of the City Council, holds Lindsay''s seat: 44,125; Orin Lehman (D) 43,206; Jeffrey St. John (Conservative) 7,796; 46.4 percent. Lindsay resigned Dec. 31, 1965, to be mayor. Swing 24.8 to D.'
    n: 'Votes: CQ Guide 6th (2010) 1279. Check: *N.Y. Legislative Manual*, 1967. See [[cal.1961-04-04.states-and-cities]]; [[cal.1966-01-10.congress]]. Names: Lindsay (Opp. III.D).'
    tags: [special:1966-02-08-h-NY-17, name:kupferman-theodore-r, name:lindsay-john-v]
  - id: cal.1966-02-10.vietnam
    when: Feb. 10–23
    date: '1966-02-10'
    thread: vietnam
    also: [india-and-china, japan-and-korea]
    c: 'Humphrey, with Harriman and Valenti, from Honolulu to Saigon, then Bangkok; Vientiane, four hours with Souvanna; Karachi, Ayub, Feb. 15; New Delhi, Indira Gandhi, Feb. 17; Canberra; Wellington; Manila, Marcos; Seoul, Feb. 22–23, where Park''s government will send a further division and a brigade to Vietnam. Some 43,000 miles. Back Feb. 23; Johnson meets him at the White House.'
    n: '[Remarks of Welcome to the Vice President Following His Mission to Asia](https://www.presidency.ucsb.edu/documents/remarks-welcome-the-vice-president-following-his-mission-asia) (Feb. 23, 1966). FRUS 1964–68, XXVIII, doc. [220](https://history.state.gov/historicaldocuments/frus1964-68v28/d220); XXV, docs. [295](https://history.state.gov/historicaldocuments/frus1964-68v25/d295), [296](https://history.state.gov/historicaldocuments/frus1964-68v25/d296), [297](https://history.state.gov/historicaldocuments/frus1964-68v25/d297); XXVI, doc. [324](https://history.state.gov/historicaldocuments/frus1964-68v26/d324); XXIX, pt. 1, doc. [80](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d80). [[w.solberg-hubert-humphrey]]; [[w.humphrey-education-of-a-public-1976]]; [[w.johns-price-of-loyalty]]. See [[cal.1966-02-06.vietnam]]. Names: Humphrey, Johnson (K–J Adm. III.D); Harriman (Viet. III.A); Valenti (K–J Adm. III.C); Souvanna (Viet. III.I).'
    tags: [name:humphrey-hubert-h, name:harriman-w-averell, name:valenti-jack, name:souvanna-phouma, name:ayub-khan-mohammad, name:gandhi-indira, name:marcos-ferdinand-e, name:park-chung-hee, name:johnson-lyndon-b]
  - id: cal.1966-02-10.georgia
    when: Feb. 10–23
    date: '1966-02-10'
    thread: georgia
    also: [students]
    c: 'Bond''s suit. A three-judge district court at Atlanta upholds the House, 2–1 (Check the date): the SNCC statement and his remarks a rational ground for doubting he could take the oath in good faith. Tuttle, dissenting: beyond the House''s power under the State constitution. Bond appeals. Feb. 23 (Check), he wins the special election for the vacant seat; its Rules Committee, Bond declining to recant, keeps him out again.'
    n: '*Bond v. Floyd*, 251 F. Supp. 333 (N.D. Ga. 1966), as given in *Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966) (K–J Cong. II.J.1). See [[cal.1966-01-06.students]]. Names: Bond (K–J Cong. III.K); Tuttle (K–J Cong. III.G).'
    tags: [name:bond-julian, name:tuttle-elbert-p]
  - id: cal.1966-02-19.vietnam
    when: Feb. 19–22
    date: '1966-02-19'
    thread: vietnam
    also: [robert-kennedy]
    c: 'Robert Kennedy, in a statement: to admit discontented elements, the National Liberation Front among them, "to a share of power and responsibility is at the heart of the hope for a negotiated settlement." Humphrey, in Wellington: like "a fox in a chicken coop" (Check). Feb. 21, Rusk to Lodge and Westmoreland, the President''s draft: the position on the NLF unchanged; its views can be considered, but no place forced for it in a coalition. Feb. 22, Johnson to Rusk by telephone: "I think it''s tragic."'
    n: 'FRUS 1964–68, IV, docs. [79](https://history.state.gov/historicaldocuments/frus1964-68v04/d79), [80](https://history.state.gov/historicaldocuments/frus1964-68v04/d80), [81](https://history.state.gov/historicaldocuments/frus1964-68v04/d81). [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]; [[w.shesol-mutual-contempt]]. See [[cal.1965-11-10.robert-kennedy]]. Made public, the telegram and the call: FRUS 1964–68, IV (1998). Names: Robert Kennedy (K–J Adm. III.A); Humphrey, Johnson (K–J Adm. III.D); Rusk (Viet. III.A); Lodge (Viet. III.C); Westmoreland (Viet. III.D).'
    tags: [name:kennedy-robert-f, name:humphrey-hubert-h, name:rusk-dean, name:lodge-henry-cabot, name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1966-02-21.india-and-china
    when: Feb. 21
    date: '1966-02-21'
    thread: india-and-china
    c: 'Djakarta. Sukarno reshuffles his cabinet: Nasution out as Defense Minister, other moderates out, seven leftists in. Bundy and Cooper to Johnson: unless the army challenges it, Sukarno restored to full control.'
    n: '[FRUS 1964–68, XXVI, doc. 197](https://history.state.gov/historicaldocuments/frus1964-68v26/d197). [[w.simpson-economists-with-guns]]; [[w.robinson-killing-season]]. See [[cal.1965-10-01.india-and-china]]. Names: Bundy, Cooper (Viet. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:sukarno, name:nasution-abdul-haris, name:bundy-mcgeorge, name:cooper-chester-l, name:johnson-lyndon-b]
  - id: cal.1966-02-23.court
    when: Feb. 23
    date: '1966-02-23'
    thread: court
    also: [desegregation-public-places]
    c: '*Brown v. Louisiana*, [383 U.S. 131](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383131/usrep383131.pdf): five Negroes who stayed, silent, in the segregated Audubon Regional Library at Clinton, La., Mar. 7, 1964, after being asked to leave; their convictions for breach of the peace reversed, 5–4. Fortas, with Warren and Douglas: no evidence of a breach of the peace, and the protest within the First Amendment; Brennan and White concurring on other grounds. Black, with Clark, Harlan and Stewart, dissenting.'
    n: '[[w.powe-warren-court-and-american]]. See [[cal.1966-01-17.court]]. Names: Fortas, Warren, Douglas, Brennan, White, Black, Clark, Harlan, Stewart (K–J Cong. III.G).'
    tags: [name:fortas-abe, name:warren-earl, name:douglas-william-o, name:brennan-william-j-jr, name:white-byron-r, name:black-hugo-l, name:clark-tom-c, name:harlan-john-marshall, name:stewart-potter]
  - id: cal.1966-02-23.conservation
    when: Feb. 23–28
    date: '1966-02-23'
    thread: conservation
    c: 'Natural heritage message, Feb. 23: a Clean Rivers Demonstration Program, whole river basins cleaned from source to mouth under basin organizations; a Redwood National Park in northern California; the National Park System to be completed by 1972. Feb. 28, Reorganization Plan 2: the Federal Water Pollution Control Administration moved from Health, Education, and Welfare to Interior.'
    n: '[Special Message to the Congress Proposing Measures To Preserve America''s Natural Heritage](https://www.presidency.ucsb.edu/documents/special-message-the-congress-proposing-measures-preserve-americas-natural-heritage) (Feb. 23, 1966); [Special Message to the Congress Transmitting Reorganization Plan 2 of 1966: Water Pollution Control](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-reorganization-plan-2-1966-water-pollution) (Feb. 28, 1966). [[w.milazzo-unlikely-environmentalists]]. See [[cal.1965-10-02.conservation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-02-24.africa
    when: Feb. 24
    date: '1966-02-24'
    thread: africa
    c: 'Accra. Army and police officers seize power while Nkrumah is on his way to Peking; a National Liberation Council, Ankrah its chairman. Feb. 25, the CIA''s current intelligence reporting to Helms: a year of reports of the officers'' plotting. The State Department to the embassy: no early recognition, lest it lend credence to "charges that U.S. masterminded coup."'
    n: 'FRUS 1964–68, XXIV, docs. [257](https://history.state.gov/historicaldocuments/frus1964-68v24/d257), [258](https://history.state.gov/historicaldocuments/frus1964-68v24/d258). [[w.thompson-ghanas-foreign-policy-1957]]. Made public: FRUS 1964–68, XXIV (1999). Names: Helms (K–J Adm. III.I).'
    tags: [name:nkrumah-kwame, name:ankrah-joseph-a, name:helms-richard]
  - id: cal.1966-02-24.elections-1966
    when: Feb. 24
    date: '1966-02-24'
    thread: elections-1966
    also: [alabama]
    c: 'Lurleen Wallace announces for governor of Alabama. George Wallace, barred by the State constitution from a second term in a row, the legislature having refused in October to change it, to campaign beside her. Check the date.'
    n: '[[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. See [[cal.1965-03-20.alabama]]. Names: Wallace (K–J Cong. III.F).'
    tags: [name:wallace-george-c]
  - id: cal.1966-02-26.economy
    when: Feb. 26
    date: '1966-02-26'
    thread: economy
    also: [civil-rights-the-executive]
    c: 'News conference. Johnson names Andrew F. Brimmer, Assistant Secretary of Commerce for Economic Affairs, once of the New York Reserve Bank, to the Federal Reserve Board, to the seat whose term Balderston, the vice chairman, has served out: the first Negro on the Board. Nominated Feb. 28; confirmed Mar. 4; sworn Mar. 9.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1161) (Feb. 26, 1966). [[w.bremner-chairman-of-the-fed]]. See [[cal.1965-12-05.economy]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:brimmer-andrew-f, name:balderston-c-canby]
  - id: cal.1966-02-28.space
    when: Feb. 28
    date: '1966-02-28'
    thread: space
    c: 'St. Louis. Elliot M. See Jr. and Charles A. Bassett II, named to fly Gemini 9, killed landing their T-38 in bad weather at Lambert Field: it strikes the McDonnell building where their spacecraft is being built. Stafford and Cernan, their backups, to fly it.'
    n: '[[w.hacker-on-the-shoulders-of]]. See [[cal.1965-12-15.space]]. Names: Stafford (K–J Cong. III.K).'
    tags: [name:stafford-thomas-p]
