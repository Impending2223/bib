  - id: cal.1962-09-06.soviet-union
    when: Sept. 6
    date: '1962-09-06'
    thread: soviet-union
    c: 'Udall, eleven days in the Soviet Union on power and resources, with Khrushchev two hours at Pitsunda: the German treaty to be signed, no Western troops in Berlin; satisfaction with Kennedy''s handling of the U-2 protest and with Laos.'
    n: 'FRUS 1961–63, V, doc. [236](https://history.state.gov/historicaldocuments/frus1961-63v05/d236) (the Embassy, Sept. 7). [[w.reeves-president-kennedy]], 350 (Udall with Khrushchev); [[w.fursenko-khrushchevs-cold-war]], 456–57 ("Now, we can swat your ass"). [[w.fursenko-one-hell-of-a]], 197, 207–209 ("Now we can swat your ass"; "Out of respect for your President we won''t do anything until November"). To check: [[w.smith-stewart-l-udall]]; [[w.taubman-khrushchev]]; Khrushchev–Udall memorandum of conversation, Sept. 6, 1962, Cuba papers, National Security Archive (cited by [[w.reeves-president-kennedy]], 350). Names: Udall, Khrushchev.'
    src:
      c: dcfdda93
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d236: all'
