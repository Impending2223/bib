  - id: cal.1962-09-23.china-leadership-3
    when: Sept. 23
    date: '1962-09-23'
    thread: china-leadership
    c: 'Zhou Enlai settles the Central Committee''s decision on grain work, which he drafted; the Center issues it that day. Ten provisions: for the 1962 grain year procurement 64.126 billion jin, sales 70.3 billion, transfers up 4.5 billion, imports 10.4 billion; the amounts fixed for five years and discussed yearly; village grain fairs opened under leadership; unified procurement, sales and transfer from 1962. On his proposal the grain year changes to April 1–March 31.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 497 (Sept. 23, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 282 (at Mao''s behest the 1962 grain procurement figure is cut by almost 2 million tons to just over 32 million, less than Deng Zihui urged in July; the directive envisages a gradual rise in procurement and a fall in imports over five years); [[w.jianguo-yilai-mao-zedong]], XVI, 325 (Sept. 23, 1962; note 1 to Mao''s note of July 31: the Center''s decision, on the Finance and Trade Office''s report and the conference''s discussion, issued Sept. 23 to the bureaus, provinces, Tibet work committee, central departments, Party groups and General Political Department; for 1962 procurement 64.126 billion jin of trade grain, 3.784 billion less than 1961; sales 70.315 billion, 8.132 billion less; transfers 4.5 billion, 0.193 billion more; imports 10.4 billion, 0.6 billion less). Made public: 1997. Check: the book finds the relation between this decision and that of the plenum four days later, fixing procurement at an appropriate level for a period as Deng Zihui wanted, unclear (III, 282 n.123). To check: the decision as issued, Sept. 23, 1962; Central Committee, directive on grain of Sept. 23, 1962, in [[w.al-zhongguo-gongchan-dang-zhizheng]], 221–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 282 n.123e); Central Committee, directive on grain of Sept. 23, 1962, in [[w.xiannian-li-xiannian-lun-caizheng]], xia, 38 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 282 n.123f); Central Committee, "Decision on grain work," Sept. 23, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 325 n.1b). Names: Zhou Enlai.'
