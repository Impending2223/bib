    also: [robert-kennedy]
    c: 'The President and Barnett by telephone, 2 p.m. and 2:50 p.m.: Barnett and Lieutenant Governor Johnson to stand at Oxford while Meredith registers at Jackson. After the football game at Jackson that night Barnett calls it off. About midnight the President federalizes Mississippi''s Guard.'
    n: '[Conversation with Ross Barnett (2:00 pm)](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-200-pm), Dictabelt 4A1 (Miller Center); [Conversation with Ross Barnett (2:50 pm)](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-250-pm), Dictabelt 4C1 (Miller Center). [[w.navasky-kennedy-justice]], 231–32 (the agreement and its breaking, by Burke Marshall''s unfiled affidavit; the Guard federalized about midnight); [[w.branch-parting-the-waters]], 656–59; [[w.thomas-robert-kennedy]], 198 ("Go get him, Johnny boy"; Barnett on Watkins and the poultry program; "You''ve been fighting a soft pillow all week"; the plan to register Meredith at Jackson; the deal off that night); [[w.schlesinger-journals]], 167–71 (the first of Kennedy''s telephone calls to Barnett, of which the page gives "only his half of the dialogue": Kennedy: "Here''s my problem, Governor ... under the Constitution I have to carry out the law"; Watkins is to come to Washington; the Court''s order gives Barnett until Tuesday; Barnett thanks him "for your help on the poultry problem"; Barnett to "tell ''em to cool off and you can sneak him in"; the day by the page''s sequence, the Saturday after Robert Kennedy''s request of Friday; not the hours or the Lieutenant Governor). Check: Branch, 656–59, from the Dictabelts: at the first call Barnett would have Tom Watkins bring an idea to Washington: "I want to think it over a few days"; at the second, Robert Kennedy puts the Jackson plan; Barnett''s highway patrolmen "absolutely be unarmed"; the President calls Sorensen in the hospital for a television address. Salinger cancels it that evening; Marshall: "We''ve got a deal with Barnett." After the game the deal is off; near midnight the President signs the proclamations Schlei brings: "that''s General Grant''s table.". See [[cal.1962-06-25.mississippi]]. Names: Kennedy, Barnett, Paul Johnson, Meredith. Check: the order federalizing the Guard (its day, Sept. 30, in the Federal Register).'
