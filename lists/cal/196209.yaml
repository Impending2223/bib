  - id: cal.1962-09-04.missile-crisis
    when: Sept. 4
    date: '1962-09-04'
    thread: missile-crisis
    also: [robert-kennedy]
    c: Statement on Cuba. No offensive weapons found; were there, "the gravest issues would arise." Dobrynin assures Robert Kennedy the same day.
    n: '[FRUS 1961–63, X, doc. 411](https://history.state.gov/historicaldocuments/frus1961-63v10/d411). Statement by the President on Cuba (Sept. 4, 1962). [[w.schlesinger-robert-kennedy-and-his]], 502, 505–06 (Dobrynin''s assurance, "in early September"; the statement); [[w.fursenko-one-hell-of-a]], 205–206 (the leaders'' meeting and the statement); [[w.sorensen-kennedy]], 670; [[w.dobrynin-in-confidence]], 71–72 (Robert Kennedy, agitated, on the SA-2s and what might follow; Moscow''s instruction: "only defensive Soviet weapons in Cuba"; by Dobrynin''s account). [[w.reeves-president-kennedy]], 346–47. [[w.ball-past-has-another-pattern]], 287 (Dobrynin''s assurance; the warning). See [[cal.1962-05-24.missile-crisis]]. Names: Dobrynin, Robert F. Kennedy.'
