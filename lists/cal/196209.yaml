  - id: cal.1962-09-28.king
    when: Sept. 28
    date: '1962-09-28'
    thread: king
    also: [alabama-birmingham]
    c: 'The convention''s closing session. Roy James, a white man in the audience, walks onto the stage and strikes King in the face and back. King drops his hands: "Don''t touch him. We have to pray for him." James, a soldier for the American Nazi Party, he says. King will not press charges; Connor''s police bring them; James pleads guilty, thirty days. Within hours the FBI reports him a party member living at its "dormitory" outside Washington.'
