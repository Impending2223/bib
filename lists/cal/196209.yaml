  - id: cal.1962-09-07.cuba-3
    when: Sept. 7
    date: '1962-09-07'
    place: miami
    thread: cuba
    c: 'Miami. Harvey meets Rosselli, the first of two meetings (the second Sept. 11). Reported at them: the Cuban preparing another three-man team to penetrate Castro''s bodyguard; the pills, "the medicine," still "safe" in Cuba. Harvey, 1975: by this time he had grave doubts, and told Rosselli "there''s not much likelihood that this is going anyplace, or that it should be continued."'
    n: '[[w.sen-church-alleged-assassination-plots]], 84 (I.G. Report, 51; Harvey, testimony, June 25, 1975, 103–4; the report gives the two meetings together). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Inspector General''s Report, 1967, 51 (cited by [[w.sen-church-alleged-assassination-plots]], 84). See [[cal.1962-06.cuba-2]]. Names: Harvey, Rosselli, Castro. Check: which of the two meetings.'
    tags: [name:harvey-william-k, name:rosselli-john, name:castro-fidel]
  - id: cal.1962-09-07.china-leadership
    when: Sept. 7
    date: '1962-09-07'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Qinzheng Hall, afternoon. Mao receives youth and student delegations from Colombia, Peru, Ecuador, Guatemala and Puerto Rico and an Argentine folk-art troupe; Chen Yi and Hu Yaobang present. All on one front against imperialism for national liberation; the Chinese had a "fear-America disease, worship-America disease, pro-America disease," and one of Japan before, cured by the eight years'' war; the land revolution: rouse the masses by every means at the right time.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 7, 1962. [[w.chen-yi-nianpu]], 931 (Sept. 7, 1962, afternoon; Chen Yi present when Mao receives the Cuban travel group, and the youth and students of Peru, Ecuador, Guatemala and other Latin American countries and the Argentine folk art troupe). Made public: 2013. Names: Mao Zedong, Chen Yi, Hu Yaobang.'
    tags: [polity:prc, name:mao-zedong, name:chen-yi, vis:only:prc]
