  - id: cal.1962-09-27.china-leadership
    when: Sept. 27
    date: '1962-09-27'
    place: peking
    thread: china-leadership
    c: 'Huairen Hall. Mao presides at the Tenth Plenum''s last full session; Ke Qingshi, Liu Lantao, Peng Zhen and Li Fuchun speak. On Ke''s speech Mao: on centralization and decentralization the chief aspect should be centralization; democratic centralism within the Party, the people''s congresses and government; "we are a party where everyone may speak, even those against us." The plenum adopts the decision on the communes'' collective economy, the decision on commerce, the exchange of cadres, the control organs and the revised work regulations; Lu Dingyi, Kang Sheng and Luo Ruiqing added to the Secretariat, Huang Kecheng and Tan Zheng struck.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 27, 1962 (and the entry for Sept. 24–27). [[w.macfarquhar-origins-of-the-cultural]], III, 286–89 (the Sixty Articles in final form: the team the basic unit of accounting and, for ''a long period'', of ownership; the brigade confined to leading, supervising and helping; private plots adjacent to dwellings 5–7 percent of the land, total private land up to 15 percent; the revised rules and points for cadres); [[w.macfarquhar-origins-of-the-cultural]], III, 296 (Kang Sheng''s reward for leading the attack on Xi Zhongxun is promotion to the Central Committee''s Secretariat at the plenum); [[w.yang-shangkun-riji]], II, 211 (Sept. 27, 1962; 10 a.m. to 1:30 p.m.; the decisions adopted, the plenum closes; Li Fuchun, Ke Qingshi, Liu Lantao and Peng Zhen speak; Mao not named); [[w.mao-zedong-zhuan]], V, ch. 70 (Sept. 27: the last session; Ke Qingshi, Liu Lantao, Peng Zhen, Li Fuchun speak; ten documents adopted, with the communique; Mao concludes). [[w.yang-jisheng-mubei]], II, 731 (the Tenth Plenum, Sept. 27: the draft work regulations of the people''s communes make the production team, not the brigade, the basic accounting unit; members'' income by distribution, the public welfare fund to help hard-pressed households; three-level ownership, each level accounting for itself); [[w.peng-zhen-nianpu-1902]], IV, 216–217 (Sept. 27, 1962, morning; Peng Zhen speaks at the plenary: after the Seven Thousand a "cold air"; three attitudes to the work since the leap, those who correct errors, those who seize on them to reverse verdicts, rightists who gloat; some think retreat Marxist, the lower the targets the better; past errors of blind command, high targets and the "five winds" not to be repeated, nor a new "left"; the three red banners will not fall: without the communes and the collective economy no surviving the three years; steel from 5.35 to 18 million tons, machine types from 4,100 to 9,600, self-sufficiency in equipment from 60 to over 85 percent; but too far, the mouth opened too wide; the general line a universal truth, not studied well, "我就是一个"; against "restoration" to 1957: steel types from 850 back to 320?; construction disturbed by class struggle at home and abroad, Lushan in 1959 and the struggle against revisionism in 1960 a trap, not to be repeated). Made public: 2013. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 211) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 70), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: the plenum''s communique, *Renmin ribao*, Sept. 29, 1962, and the decisions; [[w.suinian-chinas-socialist-economy]], 296 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 286 n.144a); Central Committee, Revised Draft Regulations on the Rural People''s Communes (the Sixty Articles), Sept. 1962 version, in [[w.nongye-jitihua-zhongyao-wenjian]], xia, 633–41 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 286 n.144b); , in [[w.nongye-jitihua-zhongyao-wenjian]], xia, 474–91 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 286 n.144c); Central Committee, Revised Draft Regulations on the Rural People''s Communes (the Sixty Articles), Sept. 1962 version, in [[w.nongye-jitihua-zhongyao-wenjian]], xia, 628–49 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 286 n.144d); [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 349 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 287 n.145); [[w.yanjiushi-zhonggong-dangshi-zhongda-shijian]], 125 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 287 n.147b); , in [[w.nongye-jitihua-zhongyao-wenjian]], xia, 481 (cited by [[w.macfarquhar-