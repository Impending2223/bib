    when: Sept. 23
    date: '1962-09-23'
    thread: china-leadership
    c: 'Mao on Deng Xiaoping''s report of that day: the Secretariat now stands as Deng, Peng Zhen, Wang Jiaxiang, Li Xuefeng, Li Fuchun, Li Xiannian, Tan Zhenlin, Huang Kecheng, Tan Zheng, with Liu Lantao, Yang Shangkun and Hu Qiaomu alternates; Huang Kecheng removed, Tan Zheng suspended. Deng proposes that the plenum strike the two and elect Lu Dingyi, Kang Sheng and Luo Ruiqing. Mao: "Back to Xiaoping; do it."'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 23, 1962 ("同日"). [[w.macfarquhar-origins-of-the-cultural]], III, 329 (at the Tenth Plenum Lu Dingyi and Kang Sheng join the Secretariat, Luo Ruiqing formally replaces Huang Kecheng, and Tan Zheng leaves it); [[w.deng-xiaoping-nianpu-1904]], III, 1725 (Sept. 23, 1962; Deng''s report: secretaries Deng, Peng Zhen, Wang Jiaxiang, Li Xuefeng, Li Fuchun, Li Xiannian, Tan Zhenlin, Huang Kecheng, Tan Zheng; alternates Liu Lantao, Yang Shangkun, Hu Qiaomu; Huang''s post already revoked, Tan Zheng''s stopped; proposed, both revoked and Lu Dingyi, Kang Sheng and Luo Ruiqing elected; Mao the same day: "back to Xiaoping; do so"). Made public: 2013. To check: [[w.jiefangjun-jiangling-zhuan-14]], 507–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 329 n.39b). See [[cal.1962-09-23.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Lu Dingyi, Kang Sheng, Luo Ruiqing, Wang Jiaxiang, Li Xuefeng, Huang Kecheng, Tan Zheng, Liu Lantao, Yang Shangkun, Hu Qiaomu.'
    src:
      c: 3233f0b5
      rows:
