    c: 'Kennedy to the governors of the Bank and the Fund: the dollar "an international currency"; if it did not exist as a reserve currency "it would have to be invented"; the deficit not mismanagement but spending for the free world, $3 billion of it military abroad; the dollar to stay convertible into gold; the country "receptive to suggestions" for improving the payments system.'
