  - id: cal.1962-09-04.governors-nv
    when: Sept. 4
    date: '1962-09-04'
    thread: governors
    also: [elections-1962]
    c: 'Nevada''s primary. Republican, for governor: Gragson, mayor of Las Vegas, over Greenspun, publisher of the *Las Vegas Sun*, 16,538 to 9,176, 64.3 percent. Democratic: Governor Sawyer renominated over Austin, 40,168 to 5,017, 81.4 percent; two others.'
    n: 'Votes: [Nev. *Political History of Nevada* (12th ed., 2016), 506](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=512). [[w.peirce-mountain-states-of-america]], 170 (Greenspun beaten for the Republican nomination). To check: [[w.sawyer-hang-tough-grant-sawyer]]; [[w.elliott-history-of-nevada]]. Names: Sawyer, Gragson, Greenspun.'
    src:
      c: 62538bf5
      rows:
