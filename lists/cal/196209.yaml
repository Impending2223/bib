  - id: cal.1962-09-04.governors-nv
    when: Sept. 4
    date: '1962-09-04'
    thread: governors
    also: [elections-1962]
    c: 'Nevada''s primary. Republican, for governor: Gragson, mayor of Las Vegas, over Greenspun, publisher of the *Las Vegas Sun*, 16,538 to 9,176, 64.3 percent. Democratic: Governor Sawyer renominated over Austin, 40,168 to 5,017, 81.4 percent; two others.'
    n: 'Votes: [Nev. *Political History of Nevada* (12th ed., 2016), 506](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=512). To check: [[w.sawyer-hang-tough-grant-sawyer]]; [[w.elliott-history-of-nevada]]. Names: Sawyer, Gragson, Greenspun.'
    tags: [state:nv, city:las-vegas, name:gragson-oran-k, name:greenspun-hank, name:sawyer-grant]
  - id: cal.1962-09-04.oil
    when: Sept. 4
    date: '1962-09-04'
    thread: oil
    c: 'McDermott, Office of Emergency Planning, sends Kennedy the Petroleum Study Committee''s report, signed for State, Treasury, Defense, Justice, Interior, Commerce and Labor. Interior''s dissent: the costs reckoned, not the benefits; no new coordination needed.'
    n: 'FRUS 1961–63, IX, doc. [357](https://history.state.gov/historicaldocuments/frus1961-63v09/d357). See [[cal.1961-12-02.oil]]. Names: McDermott, Kennedy.'
    tags: [name:mcdermott-edward-a, name:kennedy-john-f]
  - id: cal.1962-09-04.missile-crisis-2
    when: Sept. 4
    date: '1962-09-04'
    thread: missile-crisis
    also: [robert-kennedy]
    c: A White House meeting on Cuba, after Schlei's memorandum on the law of a blockade. Robert Kennedy urges a statement by the President that long-range missiles would raise the gravest issues; Rusk demurs, the problem with the Soviet Union worldwide. The President takes his brother's proposal; Robert Kennedy, Katzenbach and Schlei draft it.
    n: '[[w.schlesinger-robert-kennedy-and-his]], 505–06. To check: minutes of the White House meeting, Sept. 4, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 505 n.27); Schlei''s memorandum, about Aug. 29, 1962, printed in Abram Chayes, *The Cuban Missile Crisis* (1974), app. 1 (cited by [[w.schlesinger-robert-kennedy-and-his]], 505, the second footnote). The statement: [[cal.1962-09-04.missile-crisis]]. Names: Schlei, Robert Kennedy, Rusk, Kennedy, Katzenbach.'
    src:
      c: dd8d1f84
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 505–06: all'
        - 'via w.schlesinger-robert-kennedy-and-his 505 n.27: B-C'
    tags: [name:schlei-norbert-a, name:kennedy-robert-f, name:rusk-dean, name:kennedy-john-f, name:katzenbach-nicholas]
