  - id: cal.1962-09-04.oil
    when: Sept. 4
    date: '1962-09-04'
    thread: oil
    c: 'McDermott, Office of Emergency Planning, sends Kennedy the Petroleum Study Committee''s report, signed for State, Treasury, Defense, Justice, Interior, Commerce and Labor. Interior''s dissent: the costs reckoned, not the benefits; no new coordination needed.'
    n: 'FRUS 1961–63, IX, doc. [357](https://history.state.gov/historicaldocuments/frus1961-63v09/d357). See [[cal.1961-12-02.oil]]. Names: McDermott, Kennedy.'
    tags: [name:mcdermott-edward-a, name:kennedy-john-f]
  - id: cal.1962-09-06.soviet-union
    when: Sept. 6
    date: '1962-09-06'
    thread: soviet-union
    c: 'Udall, eleven days in the Soviet Union on power and resources, with Khrushchev two hours at Pitsunda: the German treaty to be signed, no Western troops in Berlin; satisfaction with Kennedy''s handling of the U-2 protest and with Laos.'
    n: 'FRUS 1961–63, V, doc. [236](https://history.state.gov/historicaldocuments/frus1961-63v05/d236) (the Embassy, Sept. 7). [[w.smith-stewart-l-udall]]; [[w.taubman-khrushchev]]. Names: Udall, Khrushchev.'
    tags: [name:udall-stewart-l, name:khrushchev-nikita-s, name:kennedy-john-f]
  - id: cal.1962-09-07.soviet-union
    when: Sept. 7–9
    date: '1962-09-07'
    thread: soviet-union
    c: Frost, in the Soviet Union on the exchange, with Khrushchev at Gagra, Sept. 7; home, Sept. 9, he tells reporters Khrushchev thought Americans "too liberal to fight" (Check the words and the day).
    n: '[[w.reeve-robert-frost-in-russia]]. See [[cal.1962-09-06.soviet-union]]. Names: Frost, Khrushchev.'
    tags: [name:frost-robert, name:khrushchev-nikita-s]
