  - id: cal.1962-09-05.missile-crisis-warnings
    when: Sept. 5
    date: '1962-09-05'
    thread: missile-crisis-warnings
    c: From Sept. 5, U-2s and other reconnaissance aircraft fly only peripheral missions around Cuba, the State Department fearing a shoot-down over the island.
    n: '[[w.poole-joint-chiefs-of-staff]], 163–64. Check: the day of the decision; Poole: "After 5 September." Check: the record of the decision (State, the Special Group).'
