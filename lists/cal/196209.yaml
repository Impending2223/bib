  - id: cal.1962-09-07.china-leadership-3
    when: Sept. 7
    date: '1962-09-07'
    place: peking
    thread: china-leadership
    c: 'The Peking committee of the Party 中共北京市委 issues its notice on socialist education among the workers of factories and mines: the hardest time past, the economy improving; with streamlining largely done, leaders to turn to production and the work; a month or two of socialist education on the workers'' thinking and work, lively and patient; dissenters may keep their views, no struggle against them; but democratic centralism, assignments, labor discipline and working hours kept, no side jobs.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 214. Under Peng Zhen''s day; his part in the notice is not stated. Made public: 2012. Names: Peng Zhen.'
