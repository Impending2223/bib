    n: 'FRUS 1961–63, XVIII, docs. [58](https://history.state.gov/historicaldocuments/frus1961-63v18/d58), [59](https://history.state.gov/historicaldocuments/frus1961-63v18/d59), [60](https://history.state.gov/historicaldocuments/frus1961-63v18/d60). [[w.schmidt-yemen]]; [[w.kerr-arab-cold-war]]; [[w.badeau-middle-east-remembered]]; [[w.gerges-superpowers-and-the-middle]]; [[w.bass-support-any-friend]]; [[w.jones-britain-and-the-yemen]]; [[w.ferris-nassers-gamble]]; [[w.orkaby-beyond-the-arab-cold]]. Names: Sallal, al-Badr.'
