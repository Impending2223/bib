  - id: cal.1962-09-28.conservation
    when: Sept. 28
    date: '1962-09-28'
    thread: conservation
    c: 'Padre Island National Seashore Act signed, [76 Stat. 650](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg650-2.pdf): about 80 miles of the barrier island on the Texas Gulf coast; not more than $5 million for land. The Senate had refused, Apr. 10, Tower''s motion to recommit, [39–45](https://voteview.com/rollcall/RS0870233), and a road the length of the island, [24–58](https://voteview.com/rollcall/RS0870234); the House passed it Sept. 13, [258–87](https://voteview.com/rollcall/RH0870198).'
    n: 'Statute (K–J Cong. II.J.2). [Remarks Upon Signing Bill Providing for the Padre Island National Seashore](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-providing-for-the-padre-island-national-seashore) (Sept. 28, 1962). See [[cal.1961-08-07.conservation]]. Names: Tower.'
    tags: [name:kennedy-john-f, name:tower-john-g]
  - id: cal.1962-09-30.mississippi-ole-miss
    when: Sept. 30
    date: '1962-09-30'
    thread: mississippi-ole-miss
    also: [robert-kennedy]
    c: Meredith flown to Oxford; marshals at the Lyceum; riot overnight. Guihard, a French reporter, and Gunter, a local man, killed. Kennedy on television during it.
    n: '[Meeting on Civil Rights, 10:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-civil-rights), Tapes 26 and 26A (Miller Center), Sept. 30; [Robert Kennedy and Vance, 12:40 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-oval-office-between-robert-kennedy-and-cyrus), Dictabelt 4F3, Cassette A (Miller Center), Oct. 1. [Radio and Television Report to the Nation on the Situation at the University of Mississippi](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-nation-the-situation-the-university-mississippi) (Sept. 30, 1962). [Proclamation No. 3497](https://www.presidency.ucsb.edu/documents/proclamation-3497-obstructions-justice-the-state-mississippi), [27 Fed. Reg. 9681](https://www.govinfo.gov/app/details/FR-1962-10-02) (1962). [Exec. Order No. 11,053](https://www.presidency.ucsb.edu/documents/executive-order-11053-providing-assistance-for-the-removal-unlawful-obstructions-justice), [27 Fed. Reg. 9693](https://www.govinfo.gov/app/details/FR-1962-10-02) (1962). Address on Mississippi (K–J Adm. II.I). See [[cal.1962-06-25.mississippi]]. Names: Meredith, Guihard, Gunter, John F. Kennedy, Robert F. Kennedy, Katzenbach, Marshall.'
