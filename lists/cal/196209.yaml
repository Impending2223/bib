  - id: cal.1962-09-29.china-leadership-3
    when: Sept. 29
    date: '1962-09-29'
    thread: china-leadership
    c: 'Zhou Enlai receives the scientists at the enlarged meeting of the State Science Commission''s agriculture group and speaks on agriculture''s passing the test. The Eight-Point Charter and 40-article outline hold the needed measures; the trouble is too little attention. Agriculture must join commerce, transport, industry, culture. He criticizes the over-cutting of farm research bodies, with scientists put outside the establishment: call back those needed and raise a large farm science corps. All vice-premiers, ministers and bureau heads are to study natural science; Cheng Zihua is studying cotton, he grain, a contest.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 499 (Sept. 29, 1962). Made public: 1997. Names: Zhou Enlai, Cheng Zihua.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1962-09-29.china-leadership-4
    when: Sept. 29
    date: '1962-09-29'
    thread: china-leadership
    c: Zhou Enlai presides at the State Council work conference on present finance arrangements. It moves 3 billion yuan of the 5.8 billion in budgeted capital construction to agriculture and the light-industry market; adds 2.8 billion to farm and water outlay; sends out 200 million yuan for farms for cut workers; sets 1963 farm-water funds at 1.6 billion yuan and advances 380 million for 1963 water works; asks the ministries for the 1963 plans and puts forward the idea of a Third Five-Year Plan.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 499 (Sept. 29, 1962). Continues 500. Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
