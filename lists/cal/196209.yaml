    n: '[*New York Times*, Sept. 18, 1962](https://select.nytimes.com/gst/abstract.html?res=FB0610FA355C137A93CAA81782D85F468685F9); [Sept. 19](https://www.nytimes.com/1962/09/19/archives/democrats-name-dudley-a-negro-to-state-ticket-donovan-to-oppose.html); [Sept. 20](https://www.nytimes.com/1962/09/20/archives/governor-vows-hard-campaign-is-renominated-cheering-republican.html). [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.connery-rockefeller-of-new-york]]; [[w.underwood-governor-rockefeller-in-new]]. Names: Morgenthau, O''Connor, Stratton, Samuels, Beame, Donovan, Javits, Dudley, Rockefeller.'
    tags: [state:ny, name:morgenthau-robert-m, name:oconnor-frank-d, name:stratton-samuel-s, name:samuels-howard-j, name:beame-abraham-d, name:donovan-james-b, name:javits-jacob-k, name:dudley-edward-r, name:rockefeller-nelson]
