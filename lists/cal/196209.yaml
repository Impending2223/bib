  - id: cal.1962-09-26.china-leadership
    when: Sept. 26
    date: '1962-09-26'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi speaks at the Tenth Plenum and says he agrees with Mao Zedong''s views. Before the difficulties there are three attitudes: the first, to overcome them and hold to the socialist road; the second, to be frightened and abandon the socialist road, retreating; the third, to use our difficulties to attack the Party and try to overthrow its Marxist-Leninist leadership. The first is right and the second and third wrong and reactionary. He proposes that the spirit of the plenum be conveyed within a scope, not below, so as not to tie everything to class struggle and spend the whole Party''s strength on class struggle. Mao accepts the views of Liu and others: the spirit is to be conveyed only to cadres of grade 17 and above in the administration, and the whole Party is told not to slacken economic work but put it first, so that after the plenum the adjustment can go on in the main by the plan already fixed.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 560–561 (Sept. 26, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 284–85, 296 (Liu, on the plenum''s final day, interrupted often by Mao, ranges himself with the Chairman; people intimidated into abandoning the socialist path and adopting individual operation, of whom Deng Zihui is representative, a "poisonous weed"; the worst is past; he also condemns Xi Zhongxun and Liu Zhidan); [[w.yang-shangkun-riji]], II, 211 (Sept. 26, 1962; Liu speaks, with Deng Xiaoping and Zhou Enlai). Made public: 1996. Check: the book calls Sept. 26 the plenum''s final day; the Mao chronology has the last full session Sept. 27 ([[cal.1962-09-27.china-leadership]]). To check: Liu Shaoqi, address to the Tenth Plenum, Sept. 26, 1962, in [[w.jin-1949-1989-niande-zhongguo]], 513 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 284 n.134a); [[w.macfarquhar-secret-speeches-of-chairman]], 162, 169, 186, 217–47 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 284 n.134b); [[w.alitto-last-confucian]], 1–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 284 n.134c); Liu Shaoqi, address to the Tenth Plenum, Sept. 26, 1962, in [[w.jin-1949-1989-niande-zhongguo]], 513–14 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 285 n.136a); Liu Shaoqi, address to the Tenth Plenum, Sept. 26, 1962, in [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1075 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 285 n.136b); Liu Shaoqi, address to the Tenth Plenum, Sept. 26, 1962, in [[w.jin-1949-1989-niande-zhongguo]], 515–17 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 285 n.137); Liu Shaoqi, address to the Tenth Plenum, Sept. 26, 1962, in [[w.jin-1949-1989-niande-zhongguo]], 515–17 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 296 n.202a); [[w.yu-zhongguo-zuo-huo-chinas]], 367 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 296 n.202b). Names: Liu Shaoqi, Mao Zedong.'
