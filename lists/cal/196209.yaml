  - id: cal.1962-09-09.georgia
    when: Sept. 9
    date: '1962-09-09'
    thread: georgia
    also: [voting-rights]
    c: 'Terrell County. The Mount Mary and Mount Olive Baptist churches, both used for registration meetings, burned to the ground. Sheriff Mathews: no evidence of arson; the FBI finds it. A drunken bystander, Virgil Puckett, swings at an agent in the ruins and is arrested for assault. Judge Elliott had already refused the Justice Department''s injunction on Mathews''s raid of July.'
    n: '[[w.branch-parting-the-waters]], 637. To check: New York Times, Sept. 10, 1962, 1 (cited by [[w.branch-parting-the-waters]], 637 n.1). Check: the day of Elliott''s ruling, and of Puckett''s arrest. See [[cal.1962-07-25.voting-rights]]. Names: Elliott.'
    src:
      c: e94223de
      rows:
        - 'w.branch-parting-the-waters 637: all'
        - 'via w.branch-parting-the-waters 637 n.1: A'
    tags: [name:elliott-j-robert, state:ga]
