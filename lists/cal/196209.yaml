  - id: cal.1962-09-07.missile-crisis-2
    when: Sept. 7
    date: '1962-09-07'
    thread: missile-crisis
    also: [soviet-union]
    c: 'Pitsunda. On Malinovsky''s report of Sept. 6, Khrushchev in his own hand: six atomic bombs for the Il-28s, and Luna missiles, the higher figure, twelve; no R-11m regiment. The warheads to go on the *Indigirka*.'
    n: '[[w.fursenko-one-hell-of-a]], 209–12. To check: Malinovsky to Khrushchev, Sept. 6, 1962, APRF, with Khrushchev''s decisions written and dated on it (cited by [[w.fursenko-one-hell-of-a]], 210 n.43, n.44, 211 n.46). See [[cal.1962-05-24.missile-crisis]]. Names: Malinovsky, Khrushchev.'
    src:
      c: 11c2b3a9
      rows:
        - 'w.fursenko-one-hell-of-a 209–12: all'
        - 'via w.fursenko-one-hell-of-a 210 n.43: B, D'
        - 'via w.fursenko-one-hell-of-a 211 n.46: B-C'
    tags: [name:malinovsky-rodion-yakovlevich, name:khrushchev-nikita-s]
