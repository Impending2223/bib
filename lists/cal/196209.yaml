    c: 'Ruleville, Miss., night. Shots into two of the three homes sheltering SNCC''s volunteers; at Herman and Hattie Sisson''s two college girls wounded, one critically. Mayor Dorrough to the sheriff: "Bob Moses is the cause of all of it." A SNCC volunteer arrested at the hospital, charged with the shooting as a stunt.'
    n: '[[w.branch-parting-the-waters]], 637–38. To check: New York Times, Sept. 11, 1962, 20; Jet, Sept. 27, 1962, 14–21 (cited by [[w.branch-parting-the-waters]], 637 n.2). Check: the day; Branch, the night after the Terrell County burnings. Names: Moses.'
