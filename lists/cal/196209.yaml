    also: [defense]
    c: 'Gilpatric to Kennedy, with the Joint Staff''s answers to his questions on Cuba: Cuba''s offensive and defensive capability up; the present contingency plans and forces can meet the new threat, with risks not there six weeks before; MiGs could strike as far north as Tampa, farther one way.'
