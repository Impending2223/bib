  - id: cal.1962-09-06.missile-crisis
    when: Sept. 6
    date: '1962-09-06'
    time: 1962-09-06T16:30Z
    thread: missile-crisis-warnings
    also: [berlin-and-vienna]
    c: 'The Soviet Embassy, 12:30 to 1 p.m., at Dobrynin''s request. Khrushchev''s message, read for Sorensen to take down: "nothing will be undertaken before the American Congressional elections that could complicate the international situation," provided nothing changes on the other side, a German settlement and West Berlin included. Sorensen, as the President suggested: hollow and tardy, the Soviet actions in Cuba having caused turmoil already. Dobrynin: nothing new in Cuba, all of it defensive.'
    n: '[FRUS 1961–63, X, doc. 415](https://history.state.gov/historicaldocuments/frus1961-63v10/d415) (Sorensen''s memorandum for the files). [[w.sorensen-kennedy]], 667–68; [[w.dobrynin-in-confidence]], 70 ("some days later": Moscow regards "the president''s wishes" with understanding; Sorensen: Cuba already a campaign issue). See [[cal.1962-08-23.berlin-and-vienna-2]]. Made public: [[w.sorensen-kennedy]] (1965). Names: Dobrynin, Khrushchev, Sorensen.'
    src:
      c: dac4e78d
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d415: all'
        - 'w.sorensen-kennedy 667–68: all'
        - 'via x.1962-09-06.sorensen-memorandum-for-the-files-dobrynin: A-D'
        - 'w.dobrynin-in-confidence 70: B-C'
    tags: [name:dobrynin-anatoly, name:khrushchev-nikita-s, name:sorensen-theodore-c, name:kennedy-john-f]
