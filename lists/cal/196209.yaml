    c: Li Dingbang 李定邦 of the Sichuan 四川 provincial committee's general office reports on present production and living in the Ya'an 雅安 area 《雅安地區當前生產、生活情況》; the secretariat prints it Sept. 5 for the secretaries and offices. Patients remain many and abnormal deaths have not stopped. Lushan 蘆山 county has over 2,000 patients, 4 percent of its people (a work group of the Ministry of Finance and Trade finds 3,034, 5.6 percent), all of the third degree. It has over 1,000 orphans, over 2 percent, two to a production team on average and 20 percent in some. At Guangming 光明 team, Qingyuan 清源 commune, 20 households, 107 people in the primary cooperative, there are 55 now, the newcomers counted, a death rate of 50 percent, and 13 orphans, 23.6 percent. At the temporary hospital of Luxi 蘆溪 brigade, Qingyuan commune, patients cook for themselves and 20 and more share one wash basin. At Daping 大坪 commune, Tianquan 天全 county, of 88 in hospital 33 have died in two months, 4 have worsened and 16 are unchanged.
    n: '[[w.yang-jisheng-mubei]], I, 210, 216. Made public: 2008. To check: Li Dingbang 李定邦, Sichuan Provincial Committee general office, "Ya''an diqu dangqian shengchan, shenghuo qingkuang" 《雅安地區當前生產、生活情況》, Sept. 4, 1962, printed Sept. 5 by the secretariat for the secretaries, the finance office and the general office (cited by [[w.yang-jisheng-mubei]], I, 210 n.49; I, 216 n.67).'
