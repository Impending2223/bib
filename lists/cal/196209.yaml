    tags: [polity:prc, name:peng-zhen, vis:only:prc]
  - id: cal.1962-09-08.vietnam-hanoi
    when: Sept. 8
    date: '1962-09-08'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Politburo, the afternoon, on buying the 1962 tenth-month crop: the general levy fixed at 18 percent of the crop, under 20 percent reasonable by past years; more to be bought at incentive prices beyond the levy, and grain imported in time; rations held until a coming session on food.'
    n: '*Thông báo của Ban Bí thư số 37-TB/HN về Hội nghị Bộ Chính trị bàn về thu mua lương thực vụ mùa 1962*, Oct. 22, 1962, of the meeting of Sept. 8, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 783–86. Made public: 2002.'
    tags: [polity:drv]
  - id: cal.1962-09-08.china-leadership
    when: Sept. 8
    date: '1962-09-08'
    thread: china-leadership
    c: 'Zhou Enlai at the Secretariat on the combined development of grain, cotton, coal and timber; stresses two lines: develop production and guarantee supplies; guarantee the peasants'' ration, procure less, send up more, import less each year, dig out the potential locally. A note: Mao at the Central work conference in August had said this year''s grain plan should buy a little less, sell a little less, send up more, import less, and dig more local potential.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 495 (Sept. 8, 1962); [[w.deng-xiaoping-nianpu-1904]], III, 1724 (Sept. 8, 1962; afternoon; Deng presides, Zhou attends; grain, cotton, coal and timber together); [[w.peng-zhen-nianpu-1902]], IV, 214 (Sept. 8, 1962, afternoon; the Secretariat''s 335th meeting; Zhou Enlai and the regional bureaus'' first secretaries attending; grain, cotton, coal and timber developed together; Peng Zhen stresses two lines: develop production and guarantee supply; the peasants'' ration guaranteed, less procured, more sent up, imports cut year by year, the potential dug out locally (the page''s note: Mao''s instruction at the August work conference)). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
