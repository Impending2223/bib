  - id: cal.1962-09-24.china-leadership-5
    when: Sept. 24–27
    date: '1962-09-24'
    thread: china-leadership
    c: 'Mao warns the plenum to take care that the class struggle does not interfere with work. The first Lushan conference of 1959 was concerned with work until Peng Dehuai jumped up, and the work was affected. Work and class struggle should proceed together, the class struggle not in a very prominent position, special people, the security departments, being charged with it. Liu Shaoqi follows: there are not many unmasked inner-party revisionists, the whole Party need not be involved, special task forces can take care of domestic and international revisionism. Mao adds that only the cadres at grade 17 and above, some 100,000, should discuss it.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 285–86; [[w.mao-zedong-zhuan]], V, ch. 70 n.51 (Sept. 24, the plenum''s first day: Mao presiding: the three questions of Beidaihe, class, the situation and contradictions; work to be kept apart from the class struggle, as the storm of Lushan in 1959 lost the work). [[w.jian-zhou-enlai]], 471 (Zhou: the lesson of Lushan 1959; oppose the right and fend off the ultraleft, no mass movement this time; Mao endorses "routine work should not be sidelined"; the plenum adopts Zhou''s documents on the economy). Made public: 1974. To check: Mao Zedong, speech of Sept. 24, 1962, opening the Tenth Plenum, in [[w.schram-mao-tse-tung-unrehearsed]], 194–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 286 n.140a); [[w.macfarquhar-origins-of-the-cultural]], II, 223 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 286 n.140b); Mao Zedong, speech of Sept. 24, 1962, opening the Tenth Plenum, in [[w.jin-1949-1989-niande-zhongguo]], 515 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 286 n.141a); [[w.zheng-liu-shaoqi-yi-sheng]], 392–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 286 n.141c); Mao Zedong 毛泽东, speech at the plenary session of the Tenth Plenum 八届十中全会全体会议, Sept. 24, 1962 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.51); Zhou''s speech at the Tenth Plenum of the Eighth CC, September 16, 1962 (so dated; the plenum sat Sept. 24–27) (cited by [[w.jian-zhou-enlai]], 471 n.25a); [[w.zhou-enlai-zhuan-1949]], 694 (cited by [[w.jian-zhou-enlai]], 471 n.25b); Zhou''s speech at the Tenth Plenum of the Eighth CC, September 16, 1962 (so dated; the plenum sat Sept. 24–27) (cited by [[w.jian-zhou-enlai]], 471 n.26a); [[w.zhou-enlai-zhuan-1949]], 694 (cited by [[w.jian-zhou-enlai]], 471 n.26b). Names: Mao Zedong, Liu Shaoqi, Peng Dehuai. Check: the day; the book gives the remarks as made at the plenum.'
