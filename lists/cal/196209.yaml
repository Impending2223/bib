  - id: cal.1962-09-24.china-leadership-3
    when: Sept. 24–27
    date: '1962-09-24'
    thread: china-leadership
    also: [china]
    c: Mao announces a second special case review commission, to investigate Xi Zhongxun, a vice-premier in Zhou Enlai's State Council who sometimes acts as premier. Kang Sheng leads the attack on Xi at the plenum, then the commission, against the supposed "anti-party group" of Xi, Jia Tuofu, a Central Committee member and vice-chairman of the State Planning Commission, and Liu Jingfan, Li Jiantong's husband.
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 290, 296; [[w.mao-zedong-zhuan]], V, ch. 70 n.52 (Sept. 24: at the plenum two review commissions set up, one on Peng Dehuai, one on Xi Zhongxun and others over the novel *Liu Zhidan*; Mao: to use novels for anti-Party work is a great discovery, it is superstructure work; Kang Sheng passes him the note). [[w.yang-jisheng-mubei]], II, 1131 n.44 (on Sept. 27 the plenum decides to set up a commission to examine Xi Zhongxun, Jia Tuofu, Liu Jingfan and others, with Kang Sheng at its head; at Mao''s speech of Sept. 24 Kang passes a note that using a novel for anti-Party acts is a great invention, and Mao reads it out); [[w.yang-jisheng-tiandi-fanfu]], I, 79 (Sept. 27, the plenum sets up a committee to examine Xi Zhongxun, Jia Tuofu and Liu Jingfan, Kang Sheng its head); [[w.dikotter-cultural-revolution]], 30 n.7 (Kang Sheng slips Mao a note, "Using novels to carry out anti-party activities is a great invention"; Mao reads it out; Kang names Xi Zhongxun the plot''s mastermind; under Mao''s eye Xi is purged); [[w.dikotter-cultural-revolution]], 30 n.8 (Mao: "Writing novels is popular these days ... The use of novels for anti-party activity is a great invention"). Made public: 1993. Check: the day; [[w.yang-jisheng-mubei]], II, 1131 n.44, has the plenum decide on Sept. 27 to set up the commission on Xi Zhongxun, Jia Tuofu, Liu Jingfan and others, Kang Sheng its head. To check: Informant G, *Informant G, interview with the author* (undated) (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 290 n.163); [[w.weiren-jia-tuofu-zhuan-a]], 124–214 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 296 n.204); [[w.kecheng-huang-kecheng-zishu]], 270 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 79 n.96); David Holm, "The Strange Case of Liu Zhidan," *Australian Journal of Chinese Affairs*, no. 27 (Jan. 1992), 77–96 (cited by [[w.dikotter-cultural-revolution]], 30 n.7a); [[w.macfarquhar-origins-of-the-cultural]], III, 293–296 (cited by [[w.dikotter-cultural-revolution]], 30 n.7b). Names: Mao Zedong, Kang Sheng, Zhou Enlai. Check: the day; the plenum met Sept. 24–27.'
