  - id: cal.1962-09-24.china
    when: Sept. 24
    date: '1962-09-24'
    place: peking
    thread: china
    also: [japan]
    c: 'The Tenth Plenum opens. Mao Zedong, interrupting Chen Boda on the revisionists'' blockade: "日本还卖给我们化肥，卖给我们特殊钢，卖给我们农药，还准备卖给我们生产维尼纶的世界第一流的设备，而社会主义国家不卖给我们。大概下个月他们的代表就要来了，叫高崎达之助" (Japan still sells us chemical fertilizer, special steel and pesticides, and is ready to sell us the world''s finest vinylon plant, which the socialist countries will not sell us. Their representative, Takasaki Tatsunosuke, will probably come next month); "要利用资本主义国家的技术" (we must use the capitalist countries'' technology).'
    n: '[[w.mao-zedong-zhuan]], V, ch. 70 (the plenum Sept. 24–27; Mao''s speech, then Chen Boda''s, the same day); [[w.jian-zhou-enlai]], 504 (Mao''s words at the Tenth Plenum, in Chen''s translation; not the day; Chen places the plenum "in the spring of 1962"). [[w.zedong-mao-zedong-nianpu]], V, Sept. 24, 1962 (the plenum opens, Mao presiding and speaking; Chen Boda''s explanation of the draft decision after). [[w.zhou-enlai-nianpu-1949]], II, 497 (Sept. 24–27, 1962: Zhou Enlai at the Tenth Plenum, which adopts the decisions on the communes'' collective economy and farm production, the revised draft of the communes'' work regulations, and on commercial work; Mao''s speech on class, the situation, contradictions and unity in the Party); [[w.macfarquhar-origins-of-the-cultural]], III, 283 (Mao opens the plenum at 10 a.m. in the Huairentang, Zhongnanhai, and makes the first speech: classes exist in socialist countries and class struggle undoubtedly exists; talk of it "every year, every month, every day"); [[w.yang-shangkun-riji]], II, 211 (Sept. 24, 1962; 10 a.m. to 1 p.m., called at 8 a.m. by Mao; Mao speaks, then Chen Boda explains the decision on agriculture; no afternoon sitting); [[w.deng-xiaoping-nianpu-1904]], III, 1725–1726 (Sept. 24–27, 1962; Deng attends; adopted, the decisions on the communes'' collective economy, on commerce, on exchanging leading cadres, on the control organs, and the revised Working Regulations; Mao on classes, the situation, contradictions and unity, class struggle "every year, every month"; the go-it-alone, reversal and dark winds; Peng Dehuai and Xi Zhongxun under special review; Huang Kecheng and Tan Zheng out of the Secretariat, Lu Dingyi, Kang Sheng and Luo Ruiqing in; at Liu''s proposal the plenum relayed only to grade 17 and above; work first); [[w.mao-zedong-zhuan]], V, ch. 70 n.55 (Sept. 24: Mao interjects at Chen Boda''s explanation of the draft decision on the communes: Japan sells us fertilizer, special steel, pesticides, and is to sell the world''s best vinylon plant, while the socialist countries do not; use the capitalist countries'' technology; the first deferred-payment vinylon contract signed with Japan in June 1963). [[w.yang-jisheng-mubei]], II, 1175 (the Tenth Plenum of the Eighth Central Committee, Sept. 24–27, 1962; its communiqué on classes and class struggle); [[w.yang-jisheng-mubei]], I, 335 (the plenum calls on the whole Party never to forget class struggle; Anhui''s responsibility fields are criticized as a "go-it-alone wind" and a "restoration of capitalism"); [[w.yang-jisheng-tiandi-fanfu]], II, 1142 (Sept. 24–27; Mao raises class struggle again); [[w.chen-yi-nianpu]], 934 (Sept. 24–27, 1962; Chen Yi attends the plenum; "never forget class struggle"); [[w.jian-zhou-enlai]], 469–470 (the opening speech: classes and class struggle exist in a socialist country; through the socialist stage the danger of capitalist restoration; class struggle to be talked of every year, every month, at every plenum and congress); [[w.yang-jisheng-tiandi-fanfu]], I, 79 (Mao reads Kang Sheng''s note, "to use novels for anti-Party activity is a great invention": to overthrow a regime one must first make public opinion); [[w.peng-zhen-nianpu-1902]], IV, 215–216 (Sept. 24–27, 1962; Peng Zhen at the Tenth Plenum; adopts the decisions on consolidating the communes'' collective economy, the revised draft Work Regulations, commercial work, the exchange of leading cadres and strengthening the control organs; the eight-character line continued; on the 24th Mao on class, the situation, contradictions and unity, class struggle to be spoken of "年年讲，月月讲"; Peng Dehuai and Xi Zhongxun put under special investigation; Huang Kecheng and Tan Zheng removed from the Secretariat, Lu Dingyi, Kang Sheng and Luo Ruiqing added; members added to the Control Commission; on Liu Shaoqi''s proposal the plenum''s spirit conveyed only to cadres of grade 17 and above; Mao: work first); [[w.friedman-shadow-cold-war]], 93 (at the Tenth Plenum in September Mao on Wang Jiaxiang''s foreign policy, friendly to imperialism and revisionism; China no longer to rely on any big power; the focus to Asia, Africa and Latin America); [[w.dikotter-cultural-revolution]], 18 n.14 (Mao to the plenum: classes will exist for a long time; the struggle of class against class and the possibility of restoration to be acknowledged; vigilance; otherwise a country like ours can move towards its opposite); [[w.liu-jixian-ye-jianying-nianpu]], II, 895–896 (Sept. 24–27, 1962; Ye Jianying 叶剑英 at the Tenth Plenum 中共八届十中全会 in Peking 北京; its decisions on the people''s communes'' collective economy, the communes'' work regulations (revised draft), commerce, the exchange of leading cadres and the Party''s control organs; "never forget class struggle"); [[w.zhu-de-nianpu-xinbian]], III, 1850–1851 (Sept. 24–27, 1962; Zhu De 朱德 at the Eighth Central Committee''s Tenth Plenum 中共八届十中全会 in the Huairen Tang 怀仁堂, Zhongnanhai 中南海, which adopts the decisions on further consolidating the communes'' collective economy and developing farming, on commerce work, on the planned exchange of leading Party and government cadres and on strengthening the Party''s control organs, and the Work Regulations for the Rural People''s Communes; elects Lu Dingyi 陆定一, Kang Sheng 康生 and Luo Ruiqing 罗瑞卿 secretaries of the Secretariat; announces the special investigation of Peng Dehuai 彭德怀 and Xi Zhongxun 习仲勋; removes Huang Kecheng 黄克诚 and Tan Zheng 谭政 from the Secretariat; Mao Zedong 毛泽东 on class struggle, to be spoken of "every year, every month"; the plenum also puts economic work "first"); [[w.chen-yun-nianpu-xiuding]], III, 138 (Sept. 24–27; its preparatory meeting Aug. 25–Sept. 23 on the draft decision on the collective economy and the revised Sixty Articles, attacking Deng Zihui''s "go-it-alone wind" and the "reversal wind" of Peng Dehuai and Xi Zhongxun; the plenum adopts the rural papers, puts Peng and Xi under special review, removes Huang Kecheng and Tan Zheng from the Secretariat; Mao: class struggle every year, every month; Liu Shaoqi''s three attitudes to the difficulties; Mao backs Liu''s proposal to relay the plenum only to cadres of grade 17 and above, and work comes first; Chen Yun absent, ill). Made public: Check (2003 at the latest). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 211) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. To check: *Mao Zedong zhuan, 1949–1976* (2003), 1256 (cited by [[w.jian-zhou-enlai]], 504 n.44); [[w.jin-1949-1989-niande-zhongguo]], 509 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 283 n.128); Mao Zedong, speech of Sept. 24, 1962, opening the Tenth Plenum, in [[w.schram-mao-tse-tung-unrehearsed]], 189–90 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 283 n.130a); [[w.schram-maos-road-to-power]], xvii (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 283 n.130b); Mao Zedong 毛泽东, interjection at Chen Boda''s 陈伯达 explanation at the Tenth Plenum, Sept. 24, 1962 (record 插话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.55); Mao''s speech at the Tenth Plenum of the Eighth CC, September 24, 1962 (cited by [[w.jian-zhou-enlai]], 470 n.22a); [[w.zedong-mao-zedong-nianpu]], V, 151–153 (cited by [[w.jian-zhou-enlai]], 470 n.22b); [[w.luthi-sino-soviet-split]], 220–22 (cited by [[w.friedman-shadow-cold-war]], 93 n.154). Names: Mao Zedong, Chen Boda.'
