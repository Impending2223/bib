    when: Sept. 7–9
    date: '1962-09-07'
    thread: soviet-union
    c: Frost, in the Soviet Union on the exchange, with Khrushchev at Gagra, Sept. 7; home, Sept. 9, he tells reporters Khrushchev thought Americans "too liberal to fight" (Check the words and the day).
    n: '[[w.reeves-president-kennedy]], 351; [[w.fursenko-khrushchevs-cold-war]], 456–57 (Frost at Pitsunda; Khrushchev asks whether Kennedy is strong enough to fight for peace). [[w.fursenko-one-hell-of-a]], 210–11. To check: [[w.reeve-robert-frost-in-russia]]; [*New York Times*, Sept. 10, 1962](https://timesmachine.nytimes.com/timesmachine/1962/09/10/issue.html); Stewart Udall, oral history, 55–56, Kennedy Library (cited by [[w.reeves-president-kennedy]], 351). See [[cal.1962-09-06.soviet-union]]. Names: Frost, Khrushchev. Check: Fursenko and Naftali put Frost''s meeting at Pitsunda (210).'
