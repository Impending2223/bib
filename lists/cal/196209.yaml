  - id: cal.1962-09-28.middle-east-johnson-trip
    when: Sept. 28
    date: '1962-09-28'
    thread: middle-east-johnson-trip
    c: 'Johnson''s report to Kennedy on the trip: "In Iran, we must accept the Shah, with his shortcomings, as a valuable asset"; Lebanon and Cyprus best "non-aligned."'
