  - id: cal.1962-09-04.missile-crisis-2
    when: Sept. 4
    date: '1962-09-04'
    thread: missile-crisis-warnings
    also: [robert-kennedy]
    c: A White House meeting on Cuba, after Schlei's memorandum on the law of a blockade. Robert Kennedy urges a statement by the President that long-range missiles would raise the gravest issues; Rusk demurs, the problem with the Soviet Union worldwide. The President takes his brother's proposal; Robert Kennedy, Katzenbach and Schlei draft it.
    n: '[[w.schlesinger-robert-kennedy-and-his]], 505–06; [[w.fursenko-khrushchevs-cold-war]], 452–53 (Robert Kennedy: "there''s going to be something else going on"; Bundy: "a defensive weapon"; Rusk: "a kind of panic that the facts themselves don''t now justify"). To check: minutes of the White House meeting, Sept. 4, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 505 n.27); Schlei''s memorandum, about Aug. 29, 1962, printed in Abram Chayes, *The Cuban Missile Crisis* (1974), app. 1 (cited by [[w.schlesinger-robert-kennedy-and-his]], 505, the second footnote). The statement: [[cal.1962-09-04.missile-crisis]]. Names: Schlei, Robert Kennedy, Rusk, Kennedy, Katzenbach.'
    src:
      c: dd8d1f84
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 505–06: all'
        - 'via w.schlesinger-robert-kennedy-and-his 505 n.27: B-C'
        - 'w.fursenko-khrushchevs-cold-war 452–53: B-D'
        - 'via x.2006.kcw-p452-54: B-D'
    tags: [name:schlei-norbert-a, name:kennedy-robert-f, name:rusk-dean, name:kennedy-john-f, name:katzenbach-nicholas]
