  - id: cal.1962-09-06.soviet-union
    when: Sept. 6
    date: '1962-09-06'
    thread: soviet-union
    c: 'Udall, eleven days in the Soviet Union on power and resources, with Khrushchev two hours at Pitsunda: the German treaty to be signed, no Western troops in Berlin; satisfaction with Kennedy''s handling of the U-2 protest and with Laos.'
    n: 'FRUS 1961–63, V, doc. [236](https://history.state.gov/historicaldocuments/frus1961-63v05/d236) (the Embassy, Sept. 7). [[w.reeves-president-kennedy]], 350 (Udall with Khrushchev). [[w.fursenko-one-hell-of-a]], 197, 207–209 ("Now we can swat your ass"; "Out of respect for your President we won''t do anything until November"). To check: [[w.smith-stewart-l-udall]]; [[w.taubman-khrushchev]]; Khrushchev–Udall memorandum of conversation, Sept. 6, 1962, Cuba papers, National Security Archive (cited by [[w.reeves-president-kennedy]], 350). Names: Udall, Khrushchev.'
    src:
      c: dcfdda93
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d236: all'
        - 'w.reeves-president-kennedy 350: A'
        - 'via w.reeves-president-kennedy 350 n.now-as-to-cuba: A'
        - 'w.fursenko-one-hell-of-a 197, 207–209: A'
        - 'via w.fursenko-one-hell-of-a 197 n.62: A'
    tags: [name:udall-stewart-l, name:khrushchev-nikita-s, name:kennedy-john-f]
  - id: cal.1962-09-06.missile-crisis
    when: Sept. 6
    date: '1962-09-06'
    thread: missile-crisis
    also: [berlin-and-vienna]
    c: 'The Soviet Embassy, 12:30 to 1 p.m., at Dobrynin''s request. Khrushchev''s message, read for Sorensen to take down: "nothing will be undertaken before the American Congressional elections that could complicate the international situation," provided nothing changes on the other side, a German settlement and West Berlin included. Sorensen, as the President suggested: hollow and tardy, the Soviet actions in Cuba having caused turmoil already. Dobrynin: nothing new in Cuba, all of it defensive.'
    n: '[FRUS 1961–63, X, doc. 415](https://history.state.gov/historicaldocuments/frus1961-63v10/d415) (Sorensen''s memorandum for the files). [[w.sorensen-kennedy]], 667–68; [[w.dobrynin-in-confidence]], 70 ("some days later": Moscow regards "the president''s wishes" with understanding; Sorensen: Cuba already a campaign issue). See [[cal.1962-08-23.berlin-and-vienna-2]]. Made public: [[w.sorensen-kennedy]] (1965). Names: Dobrynin, Khrushchev, Sorensen.'
    src:
      c: dac4e78d
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d415: all'
        - 'w.sorensen-kennedy 667–68: all'
        - 'via x.1962-09-06.sorensen-memorandum-for-the-files-dobrynin: A-D'
        - 'w.dobrynin-in-confidence 70: B-C'
    tags: [name:dobrynin-anatoly, name:khrushchev-nikita-s, name:sorensen-theodore-c, name:kennedy-john-f]
  - id: cal.1962-09-07.soviet-union
    when: Sept. 7–9
    date: '1962-09-07'
    thread: soviet-union
    c: Frost, in the Soviet Union on the exchange, with Khrushchev at Gagra, Sept. 7; home, Sept. 9, he tells reporters Khrushchev thought Americans "too liberal to fight" (Check the words and the day).
    n: '[[w.reeves-president-kennedy]], 351. [[w.fursenko-one-hell-of-a]], 210–11. To check: [[w.reeve-robert-frost-in-russia]]; *New York Times*, Sept. 10, 1962; Stewart Udall, oral history, 55–56, Kennedy Library (cited by [[w.reeves-president-kennedy]], 351). See [[cal.1962-09-06.soviet-union]]. Names: Frost, Khrushchev. Check: Fursenko and Naftali put Frost''s meeting at Pitsunda (210).'
    src:
