    when: Sept. 4
    date: '1962-09-04'
    thread: georgia
    also: [voting-rights]
    c: Terrell County, Ga. Three shotgun blasts into the home of a woman boarding SNCC's summer volunteers. Sherrod, asleep, missed; a white student wounded in the arm, two others grazed.
    n: '[[w.branch-parting-the-waters]], 636. Check: the day; Branch, four nights after Aug. 31. See [[cal.1962-08-31.georgia]].'
