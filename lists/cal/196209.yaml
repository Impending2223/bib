    c: 'Wheeling, W. Va., the Wheeling Stadium, 5:45 p.m. Kennedy for a Democratic Congress: "This is the place where the Democratic victory of 1960 had its start, and I can assure you that this is also the place where the Democratic congressional victory of 1962 will have its start." The Republicans'' votes against welfare legislation counted. Cut short by heavy rain. The text Schlesinger''s, Sorensen in the hospital.'
