    thread: governors
    also: [elections-1962]
    c: 'Nevada''s primary. Republican, for governor: Gragson, mayor of Las Vegas, 16,538, 64.3 percent; Greenspun, publisher of the *Las Vegas Sun*, 9,176. Democratic: Governor Sawyer renominated, 40,168, 81.4 percent.'
    n: 'Votes: [Nev. *Political History of Nevada* (12th ed., 2016), 506](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=512). [[w.sawyer-hang-tough-grant-sawyer]]; [[w.elliott-history-of-nevada]]. Names: Sawyer, Gragson, Greenspun.'
