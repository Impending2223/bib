  - id: cal.1962-09-10.missile-crisis
    when: Sept. 10
    date: '1962-09-10'
    thread: missile-crisis
    also: [cuba, robert-kennedy]
    c: 'About 5:45 p.m., Bundy''s office: Bundy, Rusk, McNamara, Taylor, Robert Kennedy and Marshall Carter for McCone, on Rusk''s fear of an incident over Cuba. Rusk: no flights over the SA-2 sites; "How do you expect me to negotiate on Berlin with all these incidents?" Robert Kennedy: "What''s the matter, Dean, no guts!" The U-2s to keep to international waters and to areas without SA-2s.'
    n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 296](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d296), Carter''s diary (A). [[w.fursenko-one-hell-of-a]], 214. To check: Berkaw, memorandum, Feb. 28, 1963; "U-2 Overflights of Cuba, 29 August through 14 October 1962," Feb. 27, 1963; Kirkpatrick, "White House Meeting on 10 September 1962 on Cuban Overflights," Mar. 1, 1963 (cited by [[w.fursenko-one-hell-of-a]], 214 n.54). Names: McGeorge Bundy, Rusk, McNamara, Taylor, Robert Kennedy, Marshall Carter, McCone.'
    src:
      c: b8209284
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d296: A'
        - 'w.fursenko-one-hell-of-a 214: all'
        - 'via w.fursenko-one-hell-of-a 214 n.54a: all'
        - 'via w.fursenko-one-hell-of-a 214 n.54b: all'
        - 'via w.fursenko-one-hell-of-a 214 n.54c: all'
    tags: [name:bundy-mcgeorge, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:kennedy-robert-f, name:carter-marshall-s, name:mccone-john-a]
