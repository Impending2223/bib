  - id: cal.1962-09-25.china-leadership
    when: Sept. 25
    date: '1962-09-25'
    place: peking
    thread: china-leadership
    c: 'Huairen Hall. Mao presides at the Tenth Plenum, second day. Li Xiannian reports on commerce; Dong Biwu, then Bo Yibo and Zhu De speak. Mao to Li on grain: last year better than the year before, besides the "Twelve Articles" and the "Sixty," because peasants gave up 17.7 billion jin less; "two ends many, the middle few": the peasant keeps more, and the center more yearly, hence imports.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 25, 1962. [[w.macfarquhar-origins-of-the-cultural]], III, 263 (Li Xiannian''s speech: "Chairman Mao personally grasps commerce"; three months after he cited Liu on materials); [[w.yang-shangkun-riji]], II, 211 (Sept. 25, 1962; 9:30 a.m. to 12:30 p.m. and 4 to 6:30 p.m.; Li Xiannian on commerce, then Dong Biwu, Bo Yibo and Zhu De speak; Mao not named); [[w.mao-zedong-zhuan]], V, ch. 70 n.32 (Sept. 25: Mao presiding; Li Xiannian explains the Center''s decision on commerce; Dong Biwu, Bo Yibo and Zhu De speak; Mao interjects at Dong''s speech (Sept. 25)). [[w.zhu-de-nianpu-xinbian]], III, 1850–1851 (Sept. 25, 1962; Zhu De 朱德 speaks at the plenary: with the "eight-character policy" 八字方针 in industry and the Twelve Articles 十二条 and Sixty Articles 六十条 in farming the situation much better, the market livelier with the private plots and fairs, the peasants glad; the situation not to be judged all black; to learn to trade the most urgent thing, not for the commerce departments alone but for the Party committees and all; many countries want China''s goods; China''s climates and many hands can grow a great variety, several thousand Chinese medicines alone; the teams, well organized, to run many lines, sell to the state, and grow rich, not a few but all together). Made public: 2013. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 211) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 70), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: Li Xiannian, speech to the Tenth Plenum, Sept. 25, 1962, in [[w.xiannian-li-xiannian-lun-caizheng]], xia, 21, 31, 35 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 263 n.14c); Mao Zedong 毛泽东, interjection at Dong Biwu''s 董必武 speech at the Tenth Plenum 八届十中全会, Sept. 25, 1962 (record 插话记录), on his talk with Deng Zihui of July 17 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.32). See [[cal.1962-09-24.china]]. Names: Mao Zedong, Li Xiannian, Dong Biwu, Bo Yibo, Zhu De.'
