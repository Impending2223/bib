  - id: cal.1967-04-01.china-leadership
    when: Apr. 1
    date: '1967-04-01'
    thread: china-leadership
    c: 'Mao reads Zhou Enlai''s draft of Mar. 30 of the Center''s decision on Anhui. Article 2: the masses are not to be called counter-revolutionary or arrested for storming the military district or differing on seizures; those so branded to be cleared, the arrested freed, warrants withdrawn. Mao adds: many outside students stormed Zhongnanhai and some military schools the Ministry of Defense, and the Center did not scold them or make them confess or write self-criticisms but persuaded them home; localities treat storming military offices too gravely. Issued Apr. 1.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 1, 1967. [[w.macfarquhar-maos-last-revolution]], 181 (Mao''s addition of Apr. 1 to the draft of Zhongfa [1967] 117 on Anhui); [[w.macfarquhar-maos-last-revolution]], 178 n.49 (the center sets up a military control commission in Anhui, Qian Jun, deputy commander of the Nanjing Military Region, taking on the Anhui Military District, and rehabilitates a radical mass organization there); [[w.jianguo-yilai-mao-zedong]], XIX, 35 (Apr. 1, 1967; Mao''s added paragraph at the end of article 2 of the draft decision on Anhui that Zhou sent for review Mar. 30; the Center issued the decision Apr. 1); [[w.yang-jisheng-tiandi-fanfu]], I, 408–409 (Apr. 1, the Center''s decision on Anhui and its annex, Zhongfa [67] 117 中發〔67〕117號: mass bodies not to be declared counter-revolutionary at will, nor the masses branded so; no arrests at will; those branded for storming the district or for their views on the seizure to be cleared, the arrested freed, warrants withdrawn; "revolution is no crime"; the army to back the left and not one left body against another; Mao''s added passage on the students who stormed Zhongnanhai and the Ministry of Defense unrebuked; by Yang, the "February suppression" is checked after it); [[w.yang-jisheng-tiandi-fanfu]], II, 1145 (mass organizations not to be called counter-revolutionary at will; those so called rehabilitated, those held freed). Made public: 2013. Check: the book (178) gives no day for the Anhui commission and the rehabilitation; whether they are this decision (Zhongfa [1967] 117, 181) or the draft of Mar. 28 ([[cal.1967-03-28.china-leadership-3]]). To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 305 (cited by [[w.macfarquhar-maos-last-revolution]], 181 n.68a); Zhongfa [1967] 117, the Center''s decision on Anhui province, with Mao''s addition of Apr. 1, 1967, in [[w.wuchanjieji-wenhua-dageming-wenjian]], I, 317–324 (cited by [[w.macfarquhar-maos-last-revolution]], 181 n.68b); [[w.1966-1967-ccp-documents-of-the]], 389–395 (cited by [[w.macfarquhar-maos-last-revolution]], 178 n.49); Draft Central Committee decision on Anhui (five articles), sent to Mao for review by Zhou Enlai Mar. 30, 1967, issued Apr. 1, 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 35 n.1). Names: Mao Zedong, Zhou Enlai.'
    src:
      c: 546e0760
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Apr. 1, 1967: all'
        - 'w.macfarquhar-maos-last-revolution 181: ?'
