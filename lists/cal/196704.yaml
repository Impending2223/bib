    when: Apr. 1
    date: '1967-04-01'
    thread: vietnam-elections
    c: 'Saigon. Thiệu promulgates the constitution of the Second Republic: a President and Vice President elected on one ticket for four years, a Senate and a House, a Supreme Court. Village council elections begin Apr. 2, on successive Sundays (Check the dates).'
    n: 'FRUS 1964–68, V, docs. [100](https://history.state.gov/historicaldocuments/frus1964-68v05/d100), [102](https://history.state.gov/historicaldocuments/frus1964-68v05/d102) (Taylor and Lodge on the constitution''s military council). [[w.cosmas-joint-chiefs-of-staff]], 104 (the promulgation; the frame; the local elections from Apr. 2). See [[cal.1967-03-20.vietnam]]. Names: Nguyễn Văn Thiệu.'
