  - id: cal.1967-04-27.vietnam-program-5
    when: Apr. 27
    date: '1967-04-27'
    place: washington
    thread: vietnam-program-5
    c: 'Westmoreland with Johnson and his advisers: without the 2⅓ divisions and five squadrons asked, 565,000 men in all, "it will be nip and tuck"; another 2⅓ divisions, about 100,000 men, probably in fiscal 1969; "a war of attrition"; "frankly dismayed at even the thought of stopping the bombing."'
    n: 'FRUS 1964–68, V, doc. [149](https://history.state.gov/historicaldocuments/frus1964-68v05/d149) (Christian''s notes). [[w.westmoreland-soldier-reports]], 227–28 (the two meetings in the Cabinet Room; the "minimum essential" and the "optimum" forces; asked by McNamara, the time "to wind down our involvement": "With the optimum force, about three years; with the minimum force, at least five"); [[w.mcnamara-in-retrospect]], ch. 9 at nn.30–31 (Westmoreland''s estimates: two, three or five years with 200,000 more, 100,000 more, or 470,000; Wheeler: all worthwhile fixed targets but the ports soon struck). Made public: FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 613–16 (the hours, 10:35 to 11:50 a.m. and 4:45 to 6:30 p.m.; Rostow''s proposal of a landing near Vinh, by his notes); [[w.herring-lbj-and-vietnam]], 52, 54 (Wheeler and Westmoreland with Johnson; the war might go on five years; Johnson: "When we add divisions can''t the enemy add divisions," "If so, where does it all end?"); [[w.berman-lyndon-johnsons-war]], 34–36 ("nip and tuck"; another 2⅓ divisions, 100,000 men, probably in fiscal 1969; "a war of attrition"; the enemy 285,000, the crossover reached; "a meat grinder"; with 565,000 men three years, with 665,000 two; Wheeler on an invasion of the North and the ports); [[w.drea-mcnamara-clifford-and-the-2011]], 137 (the crossover reached but in the northern provinces; five years with his present forces); [[w.drea-mcnamara-clifford-and-the-2011]], 207 (Wheeler: nearly all the worthwhile fixed targets but the ports soon struck); [[w.barrett-uncertain-warriors]], 81–82 (Westmoreland, Wheeler and Rostow with Johnson in April, no day: Westmoreland "dismayed at even the thought of stopping the bombing program"; Johnson on the 2⅓ divisions). See [[cal.1967-03-18.vietnam]]. To check: McNaughton''s notes, Apr. 27, 1967, Warnke Papers, McNaughton Files, and Rostow''s notes, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 613 n.24; by [[w