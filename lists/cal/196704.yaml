  - id: cal.1967-04-02.vietnam-elections
    when: Apr. 2
    date: '1967-04-02'
    thread: vietnam-elections
    c: The first village and hamlet elections; the plan, 961 villages and 4,578 hamlets. By Apr. 29, 984 village elections held, turnout 77 percent of those registered; the Viet Cong kill 12 candidates and kidnap 31 others.
    n: '[[w.macv-command-history-1967]], 1263, 1266. Check: the number kidnapped, the copy reading "3!".'
