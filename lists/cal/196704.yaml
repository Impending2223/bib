  - id: cal.1967-04-14.china-leadership-4
    when: Apr. 14
    date: '1967-04-14'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi hands the rebels, in reply to the "eight whys" of Qi Benyu''s article, a statement answering item by item and setting out the facts. In answer to "why propose and carry out a bourgeois reactionary line" he writes: he still does not know why, nor has he seen an article that fully explains why he committed a line error; after the Eleventh Plenum criticized his errors, others committed errors of the same kind, which shows they too do not know why; he will try to study Mao''s works and the other books and articles the Chairman has asked him to read, to be clear in his mind, and to test it in the revolutionary masses'' practice; only then can he answer why he made a line error in this proletarian cultural revolution and how to correct it. Staff paste the statement up as a big-character poster in Zhongnanhai; within hours it is torn to pieces.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 656 (Apr. 14, 1967; the book adds that Liu was thereafter wholly denied the right to defend himself); [[w.macfarquhar-maos-last-revolution]], 138 (in a further self-criticism of April 1967 Liu still does not use Mao''s label, the "bourgeois reactionary line"). Made public: 1996. Check: the book gives only "April" for the self-criticism (138); this entry is Liu''s statement of Apr. 14 in reply to Qi Benyu''s article, which may be it. To check: Liu Shaoqi, further self-criticism of April 1967 ([[w.pipan-ziliao]], III, 733–743) (cited by [[w.macfarquhar-maos-last-revolution]], 138 n.18a); Liu Shaoqi, further self-criticism of July 1967 ([[w.pipan-ziliao]], III, 733–743) (cited by [[w.macfarquhar-maos-last-revolution]], 138 n.18b). Names: Liu Shaoqi.'
