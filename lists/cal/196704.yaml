    c: 'New York, Riverside Church, Clergy and Laymen Concerned About Vietnam: King''s "Beyond Vietnam." The government "the greatest purveyor of violence in the world today." Five steps: end all bombing of North and South; a unilateral cease-fire; no build-up in Thailand and Laos; the National Liberation Front a party to negotiations; a date set for the withdrawal of all foreign troops.'
    n: 'Text: [113 Cong. Rec. 13,223–25](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-4-2.pdf#page=43) (1967) (inserted May 18, 1967). [[w.garrow-bearing-the-cross]], 550, 552–53; [[w.gibbons-u-s-government-and]], IV, 693; [[w.branch-at-canaans-edge]], 590–94 (2,700 in the pews and 1,200 more; "my conscience leaves me no other choice"; "If America''s soul becomes totally poisoned, part of the autopsy must read ''Vietnam''"; Bennett, Heschel and Commager after; the text drafted by Harding, Maguire and Lowenstein); [[w.woods-j-william-fulbright-vietnam]], 155 (the church; the words); [[w.kotz-judgment-days]], 373–75 (some three thousand; the draft by Andrew Young from Harding and Maguire; "the greatest purveyor of violence in the world today"; the bombing ended, a unilateral cease-fire, "remove all foreign troops"); [[w.bernstein-guns-or-butter]], 417 ("the greatest purveyor of violence in the world today—my own government"); [[w.young-easy-burden]], 428–29; [[w.zaroulis-who-spoke-up]], 108. To check: [[w.king-beyond-vietnam]]; [[w.jackson-from-civil-rights-to]]; [[w.fairclough-to-redeem-the-soul]]; King, "Beyond Vietnam," Apr. 4, 1967, King Papers, King Center; New York Times, Apr. 5, 1967, 1; FBI file 100-106670-2874, Apr. 4, 1967 (cited by [[w.garrow-bearing-the-cross]], 553 n.30); Int. Richard Fernandez, Jan. 10, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 590); Int. Andrew Young, Oct. 26, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 590); Int. Vincent Harding, Dec. 30, 2004 (Branch) (cited by [[w.branch-at-canaans-edge]], 590); Int. Barry Johnson, Jan. 4, 2005 (Branch) (cited by [[w.branch-at-canaans-edge]], 590); [[w.hall-because-of-their-faith]], 42 (cited by [[w.branch-at-canaans-edge]], 590); Goldstein, *William Sloane Coffin, Jr.* (2004), 181 (cited by [[w.branch-at-canaans-edge]], 590); John C. Bennett to Henry Steele Commager, March 22, 1967, Series 3, Box 7, CALCAV, SCPC (cited by [[w.branch-at-canaans-edge]], 590); Fernandez to CALCAV executive committee, March 27, 1967, "Arrangements for Martin Luther King Meeting on Vietnam," March 30, 1967, and CALCAV press release dated April 2, 1967, all in Series 3, Box 7, CALCAYV, SCPC (cited by [[w.branch-at-canaans-edge]], 590); Powers, *Way* (n.d.), 161 (cited by [[w.branch-at-canaans-edge]], 590); Int. Harry Wachtel, Nov. 29, 1983 (Branch) (cited by [[w.branch-at-canaans-edge]], 590); Wiretap transcript of telephone conversation between MLK and Stanley Levison, 4:34 p.m., April 8, 1967, FLNY-9-1267a (cited by [[w.branch-at-canaans-edge]], 591); New York Times, April 5, 1967, p. 1 (cited by [[w.branch-at-canaans-edge]], 591); King''s prepared text for the April 4, 1967, speech at Riverside Church was distributed beforehand by CALCAV sponsors under the title "Beyond Vietnam," Series 3, Box 7, CALCAV, SCPC. The same text appears under the title "A Time to Break Silence," in Washington, ed., Testament, p. 231 ff. The address as actually delivered, which includes new beginning and ending paragraphs, plus minor changes from the body of the text, was recorded by WRVR (Radio Riverside) and preserved in Box 23, A/KS (cited by [[w.branch-at-canaans-edge]], 591); King''s prepared text for the April 4, 1967, speech at Riverside Church was distributed beforehand by CALCAV sponsors under the title "Beyond Vietnam," Series 3, Box 7, CALCAV, SCPC. The same text appears under the title "A Time to Break Silence," in Washington, ed., Testament, p. 231 ff. The address as actually delivered, which includes new beginning and ending paragraphs, plus minor changes from the body of the text, was recorded by WRVR (Radio Riverside) and preserved in Box 23, A/KS (cited by [[w.branch-at-canaans-edge]], 593); Beyond Vietnam," Vincent Harding Papers, courtesy of Vincent Harding (cited by [[w.branch-at-canaans-edge]], 593); CALCAV pamphlet, Speak on the War in Vietnam, 1967, p. 19 (cited by [[w.branch-at-canaans-edge]], 594); Transcript, "Question and Answer Period Following Dr. Martin Luther King''s address, Riverside Church, 4/4/67," Series 3, Box 7, CALCAVES CRG: (cited by [[w.branch-at-canaans-edge]], 594). See [[cal.1967-03-25.war-opposition]]. Names: Martin Luther King.'
