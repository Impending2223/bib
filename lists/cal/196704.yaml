    c: 'Mao reads Lin Biao''s Apr. 2 draft of the Military Commission''s ten-point order on supporting the left: very good, a few changes; to go as a draft to the military regions'' conference for comment, then out. Article 6, no mass "confessions of guilt": he adds that no one is to be forced to write self-criticisms, those written of free will are returned, and the long unawakened are given time to teach themselves in the struggle. In article 7 he strikes "of Liu Shaoqi and Deng Xiaoping" from the two-line teaching. Apr. 6 he reads the revised order again.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 4, 1967. [[w.jianguo-yilai-mao-zedong]], XIX, 36–40 (Apr. 4, 1967; Mao''s note to Lin Biao of Apr. 4 and of Apr. 6 (''read; send it again to the Standing Committee''s liaison meeting for discussion and approval, then it can go out''), and his changes to articles 1 and 6 and others; the draft is Lin''s of Apr. 2, the revised draft of Apr. 5; Mao also deletes ''Liu Shaoqi and Deng Xiaoping as the representatives of'' in article 7). Made public: 2013. To check: Lin Biao, draft of the Military Commission''s ten-article order on supporting the Left (zhi zuo gongzuo de shi tiao mingling 支左工作的十条命令), Apr. 2, 1967, and its revised draft sent Apr. 5, 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 36 n.1). Names: Mao Zedong, Lin Biao, Liu Shaoqi, Deng Xiaoping.'
