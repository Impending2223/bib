  - id: cal.1967-04-06.china-leadership
    when: Apr. 6
    date: '1967-04-06'
    thread: china-leadership
    c: 'Zhou Enlai receives the rebel delegates of the State Planning, Economic and Construction commissions and rebukes their argument that to topple Bo Yibo they must first topple Gu Mu and Yu Qiuli. Told Yu has not yet made his self-criticism: he is unwell, and an ill man cannot write it; Gu Mu''s and Li Xiannian''s are with Zhou; give them time to prepare, for they must work. On the economic front, with himself, only five men now carry business: could you be raised up in their place?'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 6, 1967). Made public: 2020. Names: Zhou Enlai, Bo Yibo, Gu Mu, Yu Qiuli, Li Xiannian.'
    tags: [name:zhou-enlai, name:bo-yibo, name:li-xiannian, polity:prc, vis:only:prc]
  - id: cal.1967-04-06.china-leadership-2
    when: Apr. 6
    date: '1967-04-06'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Rebels in Zhongnanhai again struggle against Liu Shaoqi, ordering him to cook his own meals, sweep, wash his clothes and change his hours, and to answer the "eight whys" in Qi Benyu''s article. Liu answers them one by one from the historical record. Asked of the "traitor group of sixty-one," he says this is simply absurd: the release of the sixty-one from prison was approved by the Party Center; when the Japanese were about to attack North China the cadres had to be protected and could not again be left to the Japanese to kill; the Party organizations in the white areas had been largely destroyed by the Wang Ming line; these comrades are most valuable; many central leaders know it, and it was settled long ago.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 655 (Apr. 6, 1967); [[w.macfarquhar-maos-last-revolution]], 182 n.73 (the same day the rebel group tells Liu Shaoqi that from now he must cook his own food, clean his own toilet, wash his own clothes and change his work and rest schedule). Made public: 1996. To check: [[w.gongheguo-shiji-4-vols]], III, 238 (cited by [[w.macfarquhar-maos-last-revolution]], 182 n.73). Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1967-04-06.china-leadership-3
    when: Apr. 6
    date: '1967-04-06'
    thread: china-leadership
    also: [china]
    c: 'The Military Commission issues Lin Biao''s ten-point order, endorsed by Mao: the PLA is not to fire on members of mass organizations, nor make arbitrary arrests, particularly large-scale ones; the labeling of mass organizations as reactionary becomes the center''s prerogative, and opposing the PLA is not a criterion; no revenge on rebels who attacked the PLA; actions contrary to the ten points to be rectified at once.'
    n: '[[w.macfarquhar-maos-last-revolution]], 181–182; [[w.jianguo-yilai-mao-zedong]], XIX, 36–40 (Apr. 6, 1967; the ten articles as Mao revised Lin Biao''s drafts of Apr. 2 and Apr. 5, n.1–3); [[w.mao-zedong-zhuan]], VI, ch. 76 n.41 (Apr. 6 Mao writes ''this is very good'' on the Military Commission order Lin Biao sends him, n.41; the ten articles: with mass organizations, whether revolutionary, controlled by reactionaries or unclear, no firing, only political work; no arbitrary arrests, still less large-scale ones; masses not to be declared reactionary organizations and banned, still less revolutionary organizations counter-revolutionary; no pursuit of those who stormed military organs, left, middle or right; the ''ten articles'' stress not pursuing those who stormed army organs, where the ''eight articles'' stressed not storming). [[w.yang-jisheng-tiandi-fanfu]], I, 409 (the Military Commission''s "ten orders": no arrests at will, still less in numbers; no mass body to be declared reactionary and banned at will; no pursuit of those who stormed army organs, left, middle or right; taken by all as correcting the "eight orders"); [[w.yang-jisheng-tiandi-fanfu]], I, 427 (the "ten orders," after the Anhui decision and under Mao''s pressure for the army to back the rebels: no mass body to be declared reactionary and banned at will; no pursuit of those who stormed army organs; Mao''s comment: "Comrade Lin Biao, this is very good"). Made public: 1968. To check: Military Commission order of ten points, Apr. 6, 1967, in [[w.1966-1967-ccp-documents-of-the]], 407–411 (cited by [[w.macfarquhar-maos-last-revolution]], 182 n.71a); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 306–309 (cited by [[w.macfarquhar-maos-last-revolution]], 182 n.71b); Military Commission of the Central Committee, ten-article order on the work of supporting the Left, Apr. 6, 1967, as Mao revised it (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 39 n.3); Mao Zedong 毛泽东, comment on the Military Commission order 《中央军委命令》 sent by Lin Biao (manuscript 手稿), Apr. 6, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.41); Chen Zaidao 陳再道, self-criticism, Dec. 1, 1967 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 427 n.26). See [[cal.1967-04.china-leadership-4]]. Names: Lin Biao, Mao Zedong.'
