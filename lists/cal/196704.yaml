    c: 'The Spring Mobilization to End the War in Vietnam. New York: from Central Park to the United Nations; King, Spock and Carmichael among the speakers; estimates of the crowd from 100,000 to 400,000 (Check). In Central Park''s Sheep Meadow some 150 to 200 young men burn their draft cards. San Francisco: a march to Kezar Stadium, some 50,000 (Check).'
    n: '[[w.garrow-bearing-the-cross]], 556–57 (New York); [[w.gibbons-u-s-government-and]], IV, 694–96 (the police''s estimate, 100,000–125,000, the organizers'', 400,000–500,000; San Francisco, 50,000 by the police''s; about 200 draft cards burned); [[w.rights-in-conflict-convention-week]], 18–19 (the Spring Mobilization Committee; Central Park to the United Nations Plaza; King among the speakers); [[w.branch-at-canaans-edge]], 599–601 (some seventy Cornell students burn their cards; King: "Stop the bombing!"; the Times''s 100,000, the police''s 125,000); [[w.kotz-judgment-days]], 377 (King, Belafonte and Spock lead 100,000 from Central Park); [[w.bernstein-guns-or-butter]], 414 (100,000 to 400,000 in Central Park; some 70 cards burned in the Sheep Meadow; 50,000 in San Francisco); [[w.young-easy-burden]], 429 (Young with King from Central Park down Fifth Avenue and across 42nd Street to the U.N. Plaza); [[w.wells-war-within]], 132–34 (Sheep Meadow; the march to the UN, King, Belafonte, Spock and Carmichael at its head; about 170 cards burned; San Francisco, sixty thousand); [[w.zaroulis-who-spoke-up]], 110–14 (100,000 by the police to 400,000 by the Mobilization; some seventy, mostly of Cornell, then others, some 175 cards by the sponsors'' count; Kezar Stadium, about 50,000); [[w.debenedetti-american-ordeal]], 175–76 (well over 50,000 down Market Street to Kezar Stadium; perhaps 200,000 in New York, the organizers claiming twice that; some 150 cards burned in the Sheep Meadow, an ex-Green Beret among them); [[w.barrett-uncertain-warriors]], 83 (King at the New York rally in April, "between 100,000 and 400,000"; 50,000 in San Francisco the same day). Check: [[w.rights-in-conflict-convention-week]], 18, gives at least 100,000, nearly 150 organizations. Check: Young, 429, believes "more than a million people" marched. Check: [[w.wells-war-within]] gives more than three hundred thousand in New York (133) and sixty thousand in San Francisco (134). To check: [[w.foley-confronting-the-war-machine]]; King, "Speech . . .," Apr. 15, 1967, King Papers, King Center; [*New York Times*, Apr. 16, 1967](https://timesmachine.nytimes.com/timesmachine/1967/04/16/issue.html), at 1; *Washington Post*, Apr. 16, 1967, at A1 (cited by [[w.garrow-bearing-the-cross]], 557 n.34); Wiretap transcript of telephone conference call among MLK, Stanley Levison, and Harry Wachtel, 6:18 p.m., April 9, 1967, FLNY-9-1269a (cited by [[w.branch-at-canaans-edge]], 599); Wiretap transcript of telephone conference call among MLK, Stanley Levison, Harry Wachtel, Andrew Young, Harry Belafonte, and Cleveland Robinson, 6:28 p.m., April 12, 1967, FLNY-9-1272a (cited by [[w.branch-at-canaans-edge]], 599); Wiretap transcript of telephone conversation between MLK and Stanley Levison, 8:20 p.m., April 12, 1967, FLNY-9-1272a (cited by [[w.branch-at-canaans-edge]], 599); Wiretap transcript of telephone conversation between Stanley Levison and Clarence Jones, 10:46 a.m., April 14, 1967, FLN Y-9-1274 (cited by [[w.branch-at-canaans-edge]], 599); wiretap transcript of telephone conversation between Stanley Levison and Harry Wachtel, 12:42 A.M., April 14, 1967, FLNY-9-1275. Levison complained to Wachtel that King was relying too much on Al Lowenstein, who was a newcomer to the team of speech contributors (cited by [[w.branch-at-canaans-edge]], 599); MLK itinerary, April 1967, A/SC47£20 (cited by [[w.branch-at-canaans-edge]], 599); Powers, *The WaratHome* (1973), 181–83 (cited by [[w.branch-at-canaans-edge]], 599); Dellinger, *From Yale to Jail* (1993), 284–86 (cited by [[w.branch-at-canaans-edge]], 599); Williams, *The King God Didn''t Save* (1970), 104 (cited by [[w.branch-at-canaans-edge]], 599); [[w.hall-because-of-their-faith]], 44 (cited by [[w.branch-at-canaans-edge]], 599); minutes of the working committee of the Spring Mobilization, 8:00 p.m., March 30, 1967, Series 1, Box 1, MOBE, SCPC (cited by [[w.branch-at-canaans-edge]], 599); Int. Ivanhoe Donaldson, Nov. 30, 2000 (B