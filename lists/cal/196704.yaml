  - id: cal.1967-04-03.china-leadership
    when: Apr. 3
    date: '1967-04-03'
    place: peking
    thread: china-leadership
    also: [china]
    c: Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, receives student delegates of the colleges and middle schools. Jiang Qing and Kang Sheng charge Fu Chongbi and Li Zhongqi of the Peking garrison with backing the Right and hitting the Left in military training.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Apr. 3, 1967); [[w.yang-jisheng-tiandi-fanfu]], I, 251–252 (the Central Cultural Revolution Group''s meeting of middle-school student delegates at the Great Hall of the People 人民大會堂; Chen Boda calls Li Zhongqi''s 李鐘奇 thinking "dragons beget dragons, phoenixes beget phoenixes, a rat''s son digs holes"; the radical middle-school Red Guards take their name, the "April 3 faction" 四三派, from the day). Made public: 2020. To check: 〈論新思潮——四三派宣言〉, *Sisan zhanbao* 《四三戰報》, no. 1, June 11, 1967 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 252 n.15a); Mi Hedu 米鶴都, *Xinlu: toushi gongheguo tonglingren* 《心路：透視共和國同齡人》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2011), 278 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 252 n.15b). Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Fu Chongbi.'
    tags: [name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
  - id: cal.1967-04-03.china-leadership-2
    when: Apr. 3
    date: '1967-04-03'
    thread: china-leadership
    also: [china]
    c: 'Deng Xiaoping 邓小平 writes to Mao Zedong 毛泽东: having read these days Qi Benyu''s 戚本禹 article (footnote 1: "Patriotism or national betrayal? On the reactionary film *Secret History of the Qing Court*", printed Apr. 1 in the *Renmin ribao* 人民日报 and *Hongqi* 红旗, which calls Liu Shaoqi 刘少奇 ''the biggest person in power in the Party taking the capitalist road'' and Deng ''the other biggest'' and ''the second biggest''), he feels the nature of his errors seems settled, and is eager to see the Chairman.'
