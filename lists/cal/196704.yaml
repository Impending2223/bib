    n: '[[w.lich-su-khang-chien-chong-my]], IV, 276. See [[cal.1967-03-31.vietnam-operations]]. By the history''s count the night of Mar. 31 Regiment 1 and Battalion 7 of Regiment 16 destroyed the southern group at Ba Vùng and shelled Sóc Con Trăn, killing 800 and shooting down 13 aircraft. The figures are the history''s.'
