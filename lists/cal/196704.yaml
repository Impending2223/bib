  - id: cal.1967-04-15.china-leadership
    when: Apr. 15–17
    date: '1967-04-15'
    thread: china-leadership
    c: 'Mao twice reads and revises Jiang Qing''s speech of Apr. 12 at the enlarged Military Commission meeting. Jiang''s Apr. 15 note: Lin Biao says it is to be sent out; she wants Mao''s corrections. Apr. 16: "can be; as arranged"; he strikes "counter-revolutionary" before Lu Dingyi, Zhou Yang, Qi Yanming and Lin Mohan. Apr. 17: strikes a little more and adds, where she tells of the Warring States'' "Chu shuo Zhao taihou," a paragraph: the Chairman said it reflects, as feudalism began to replace slavery, a redistribution of property and power within the landlord class; our children too may degenerate and bring bourgeois restoration.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 1967 (the entry "4月中旬"). [[w.jianguo-yilai-mao-zedong]], XIX, 41–44 (Apr. 15, 1967; Mao''s note of Apr. 16 (''Return to Jiang Qing. Can be; do as arranged''), his note of the revised draft sent Apr. 17 (''Read; struck a little''), and his additions and changes to the draft; Jiang spoke Apr. 12 and sent the draft Apr. 15 and its revision Apr. 17). Made public: 2013. To check: Jiang Qing, draft of her speech of Apr. 12, 1967 to the enlarged meeting of the Military Commission, sent to Mao Apr. 15, 1967 with a request for his corrections, and its revised draft of Apr. 17 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 42 n.1). Names: Mao Zedong, Jiang Qing, Lin Biao, Lu Dingyi, Zhou Yang, Qi Yanming, Lin Mohan. Check: the nianpu says "mid-April" and then gives the 15th, 16th and 17th; the span is as printed there.'
