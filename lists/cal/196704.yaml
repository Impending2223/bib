# Cal. XC April 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XC
entries:
  - id: cal.1967-04-01.vietnam
    when: Apr. 1
    date: '1967-04-01'
    thread: vietnam-elections
    c: 'Saigon. Thiệu promulgates the constitution of the Second Republic: a President and Vice President elected on one ticket for four years, a Senate and a House, a Supreme Court. Village council elections begin Apr. 2, on successive Sundays (Check the dates).'
    n: 'FRUS 1964–68, V, docs. [100](https://history.state.gov/historicaldocuments/frus1964-68v05/d100), [102](https://history.state.gov/historicaldocuments/frus1964-68v05/d102) (Taylor and Lodge on the constitution''s military council). [[w.gibbons-u-s-government-and]], IV. See [[cal.1967-03-20.vietnam]]. Names: Nguyễn Văn Thiệu.'
    tags: [name:nguyen-van-thieu, place:saigon]
  - id: cal.1967-04-01.india-and-china
    when: Apr. 1
    date: '1967-04-01'
    thread: india-and-china-food
    also: [foreign-aid]
    c: 'Joint resolution supporting emergency food aid to India signed, [81 Stat. 7](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg7.pdf): up to 3 million tons more of food grain, on condition of matching aid from other countries; $25 million more of food for CARE and other voluntary agencies. The House passed it Mar. 9, [312–63](https://voteview.com/rollcall/RH0900019).'
    n: 'Statement by the President Upon Signing Resolution Providing Additional Emergency Food for India, [1967 Pub. Papers 411](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=479) (Apr. 1, 1967). [[w.ahlberg-transplanting-the-great-society]]. See [[cal.1966-11-10.india-and-china]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-04-02.opinion
    when: Apr. 2
    date: '1967-04-02'
    thread: opinion
    c: 'Gallup, Mar. 9–14: persons 18, 19 and 20 years old permitted to vote: should 64 percent, should not 28.'
    n: '[[w.gallup-poll]], III, 2057.'
  - id: cal.1967-04-04.king
    when: Apr. 4
    date: '1967-04-04'
    thread: king
    also: [war-opposition]
    c: 'New York, Riverside Church, Clergy and Laymen Concerned About Vietnam: King''s "Beyond Vietnam." The government "the greatest purveyor of violence in the world today." Five steps: end all bombing of North and South; a unilateral cease-fire; no build-up in Thailand and Laos; the National Liberation Front a party to negotiations; a date set for the withdrawal of all foreign troops.'
    n: '[[w.king-beyond-vietnam]]. [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]; [[w.jackson-from-civil-rights-to]]; [[w.fairclough-to-redeem-the-soul]]. See [[cal.1967-03-25.war-opposition]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr, state:ny, city:nyc]
  - id: cal.1967-04-04.mayors-chicago
    when: Apr. 4
    date: '1967-04-04'
    thread: mayors
    also: [elections-1967]
    c: Chicago. Daley (D) elected to a fourth term over Waner (R), 792,238 to 272,542, 73.0 percent, carrying all fifty wards. Write-ins for Dick Gregory 19,480.
    n: 'Votes: [Wikipedia, "1967 Chicago mayoral election"](https://en.wikipedia.org/wiki/1967_Chicago_mayoral_election). Check: the Board of Election Commissioners'' canvass. [[w.royko-boss]], 159. See [[cal.1967-02-28.mayors-chicago]]. Names: Daley, Waner, Gregory.'
    tags: [state:il, city:chicago, name:daley-richard-j, name:waner-john-l, name:gregory-dick]
  - id: cal.1967-04-04.state-constitutions-ny
    when: Apr. 4
    date: '1967-04-04'
    thread: state-constitutions
    c: Albany, N.Y. New York's constitutional convention opens, the delegates elected in November 1966. Travia, Speaker of the Assembly, its president.
    n: '[WNYC, "The Convention to End All Conventions?"](https://wnyc.org/story/convention-end-all-conventions). Check: *Journal of the Constitutional Convention of the State of New York*, 1967. [[w.dullea-charter-revision-in-the]]; [[w.connery-rockefeller-of-new-york]]. See [[cal.1966-11-08.state-constitutions-ny]]. Names: Travia.'
    tags: [state:ny, city:albany, name:travia-anthony-j]
  - id: cal.1967-04-05.space
    when: Apr. 5
    date: '1967-04-05'
    thread: space
    c: 'The Apollo 204 Review Board, the director of NASA''s Langley center its chairman, reports to Webb: the fire most probably begun by a minor failure of equipment or of wire insulation, likely never to be identified; among its findings, the test''s pure oxygen at above sea-level pressure, combustible materials in the cabin, a hatch that could not be opened quickly (Check).'
    n: '[Report of Apollo 204 Review Board to the Administrator](https://www.nasa.gov/wp-content/uploads/static/history/Apollo204/summary.pdf) (Apr. 5, 1967). See [[cal.1967-01-27.space-2]]. Names: Webb.'
    tags: [name:webb-james-e]
  - id: cal.1967-04-05.opinion
    when: Apr. 5
    date: '1967-04-05'
    thread: opinion
    also: [economy]
    c: 'Gallup, Mar. 9–14: one''s own federal income tax too high 58 percent, about right 38, too low 1. Of those who had heard of the proposed 6 percent surcharge: Congress to pass it 21, reject it 61.'
    n: '[[w.gallup-poll]], III, 2057–58.'
  - id: cal.1967-04-07.middle-east
    when: Apr. 7
    date: '1967-04-07'
    thread: middle-east
    c: 'Israel and Syria fight along the demilitarized zones, from shots at an Israeli tractor plowing near Ha''on: mortars, artillery, tanks; dogfights over the Golan and Damascus. Israel claims seven Syrian MiG-21s down and none of its own; Syria admits four. Apr. 11, UNTSO asks both sides to resume the armistice commission''s meetings and suspend cultivation in the zone.'
    n: FRUS 1964–68, XVIII, docs. [402](https://history.state.gov/historicaldocuments/frus1964-68v18/d402), [403](https://history.state.gov/historicaldocuments/frus1964-68v18/d403). [[w.oren-six-days-of-war]]; [[w.segev-1967]].
  - id: cal.1967-04-07.elections-1968
    when: Apr. 7
    date: '1967-04-07'
    thread: elections-1968
    also: [vietnam]
    c: 'Hartford. Romney''s first speech on the war, to a Republican dinner: support for the war effort; against a large escalation; a negotiated settlement, with amnesty for the enemy; the war not to become a party issue (Check).'
    n: '*Daily Tar Heel*, [Apr. 8, 1967, 1](https://newspapers.digitalnc.org/lccn/sn92073228/1967-04-08/ed-1/seq-1/) (AP). [[w.kabaservice-rule-and-ruin]]; [[w.mollenhoff-george-romney]]; [[w.white-making-of-the-president-1969]]. Names: Romney.'
    tags: [name:romney-george-w, state:ct, city:hartford]
  - id: cal.1967-04-08.civil-disorders
    when: Apr. 8–10
    date: '1967-04-08'
    thread: civil-disorders
    also: [black-nationalism, students]
    c: Nashville. Carmichael speaks at Fisk, Apr. 6, at Tennessee A&I, Apr. 7, at Vanderbilt, Apr. 8. The night of Apr. 8, after police are called to a restaurant near Fisk to remove a soldier, students picket; fighting with police by Fisk and Tennessee A&I for two nights; injuries, arrests, damage (Check the days and the numbers).
    n: '[[w.joseph-stokely]]; [[w.carson-in-struggle]]. Names: Carmichael.'
    tags: [name:carmichael-stokely, state:tn, city:nashville]
  - id: cal.1967-04-08.program
    when: Apr. 8
    date: '1967-04-08'
    thread: program
    c: 'Executive Order 11341: a President''s Commission on Postal Organization, ten members, Kappel, retired chairman of AT&T, its chairman: whether the postal service is better run by a Cabinet department, a government corporation, or some other form; its report within a year. O''Brien had proposed a nonprofit government corporation, Apr. 3 (Check).'
    n: '[Executive Order 11341](https://www.presidency.ucsb.edu/documents/executive-order-11341-establishing-the-presidents-commission-postal-organization); Statement by the President Upon Signing Order Establishing the Commission on Postal Organization, [1967 Pub. Papers 436](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=504) (Apr. 8, 1967). [[w.obrien-no-final-victories]]. Names: Kappel, O''Brien, Johnson.'
    tags: [name:kappel-frederick-r, name:obrien-lawrence-f, name:johnson-lyndon-b]
  - id: cal.1967-04-09.opinion
    when: Apr. 9
    date: '1967-04-09'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 9–14: the Johnson Administration telling the public all it should know about the war: is 24 percent, is not 65; Democrats 32 and 55. What those who say not want told, most often: how many lives are being lost, the losses in materials and planes, the cost, the waste.'
    n: '[[w.gallup-poll]], III, 2058. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-04-09.space
    when: Apr. 9
    date: '1967-04-09'
    thread: space
    c: NASA gives the Apollo 204 Review Board's report to Congress.
    n: 'Check: the transmittal. See [[cal.1967-04-05.space]].'
  - id: cal.1967-04-10.railroads
    when: Apr. 10
    date: '1967-04-10'
    thread: railroads
    c: 'The shopcraft dispute: six unions, 137,000 shopworkers, against nearly every major railroad; the Emergency Board''s report of Mar. 10 accepted by the carriers, rejected by the unions. Special message: extend the no-strike period twenty days.'
    n: 'Special Message to the Congress on the Impending Nationwide Rail Strike, [1967 Pub. Papers 439](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=507) (Apr. 10, 1967). See [[cal.1967-01-28.railroads]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-04-10.king
    when: Apr. 10
    date: '1967-04-10'
    thread: king
    also: [war-opposition, civil-rights-organizations]
    c: 'The NAACP''s board on King''s Riverside address: the association not a peace organization, the merging of the two movements a mistake (Check the wording).'
    n: 'Check: the board''s statement. See [[cal.1967-04-04.king]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1967-04-10.poverty
    when: Apr. 10–11
    date: '1967-04-10'
    thread: poverty
    also: [mississippi, robert-kennedy]
    c: Jackson. The Senate's Subcommittee on Employment, Manpower and Poverty, Joseph Clark chairman, Robert Kennedy, Javits and Murphy with him, hears Marian Wright of the NAACP Legal Defense Fund on hunger in the Delta. Apr. 11, Kennedy and Clark in the Delta, at Cleveland, Miss., and in the country around it (Check the places).
    n: '[[w.kotz-let-them-eat-promises]]; [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]; [[w.dittmer-local-people]]. Names: Joseph Clark, Robert Kennedy, Javits, Murphy, Marian Wright.'
    tags: [name:clark-joseph-s, name:kennedy-robert-f, name:javits-jacob-k, name:murphy-george, name:wright-marian, state:ms, city:jackson]
  - id: cal.1967-04-10.oil
    when: Apr. 10
    date: '1967-04-10'
    thread: oil
    c: 'Johnson, Proclamation 3779: the Secretary of the Interior may set a ceiling and allocations for asphalt apart, or admit it without license. No White House release.'
    n: '[Proclamation 3779](https://www.presidency.ucsb.edu/documents/proclamation-3779-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [32 Fed. Reg. 5919](https://www.govinfo.gov/app/details/FR-1967-04-13). See [[cal.1965-12-10.oil]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-04-11.specials
    when: Apr. 11
    date: '1967-04-11'
    thread: specials
    also: [congress-powell]
    c: New York 18th, special, for the seat the House declared vacant Mar. 1. Powell re-elected, 86.3 percent, 27,963 votes to 3,999 for the Republican; he does not come to take the seat.
    n: 'Votes: CQ Guide 6th (2010) 1281. Check: *N.Y. Legislative Manual*, 1968. See [[cal.1967-03-01.congress]]. Names: Powell.'
    tags: [special:1967-04-11-h-NY-18, name:powell-adam-clayton-jr, state:ny, city:nyc]
  - id: cal.1967-04-11.court
    when: Apr. 11
    date: '1967-04-11'
    thread: court
    also: [freedom-rides]
    c: '*Pierson v. Ray*, [386 U.S. 547](https://tile.loc.gov/storage-services/service/ll/usrep/usrep386/usrep386547/usrep386547.pdf): the clergymen of the 1961 prayer pilgrimage, white and Negro, arrested in the Jackson bus terminal''s white waiting room, sue for damages under 42 U.S.C. § 1983. The police justice who convicted them immune; the policemen may plead good faith and probable cause. Warren for the Court; Douglas dissenting on the judge''s immunity.'
    n: '[[w.arsenault-freedom-riders]]. See [[cal.1961-05-24.freedom-rides]].'
  - id: cal.1967-04-11.latin-america
    when: Apr. 11–14
    date: '1967-04-11'
    thread: latin-america
    c: 'Punta del Este, the meeting of American Presidents. The Declaration of the Presidents of America, Apr. 14: a Latin American Common Market, begun in 1970 and substantially in operation within fifteen years; multinational projects of transport, power and communications; more for agriculture and education. Arosemena of Ecuador refuses to sign. Johnson home by Paramaribo, Apr. 14.'
    n: 'Remarks in Punta del Este at the Public Session of the Meeting of American Chiefs of State, [1967 Pub. Papers 446](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=514) (Apr. 13, 1967); Statement by the President Following the Close of the Meeting of American Chiefs of State at Punta del Este, Uruguay, [1967 Pub. Papers 449](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=517) (Apr. 14, 1967). FRUS 1964–68, XXXI, docs. [50](https://history.state.gov/historicaldocuments/frus1964-68v31/d50), [51](https://history.state.gov/historicaldocuments/frus1964-68v31/d51). [President''s Daily Diary, Apr. 11, 1967](https://catalog.archives.gov/id/192462), images 1, 4; [Apr. 14](https://catalog.archives.gov/id/192465) (LBJ Library; National Archives Catalog). See [[cal.1967-03-13.latin-america]]. Names: Arosemena, Johnson.'
    tags: [name:arosemena-gomez-otto, name:johnson-lyndon-b]
  - id: cal.1967-04-11.open-housing-louisville
    when: Apr. 11
    date: '1967-04-11'
    thread: open-housing
    c: Louisville. The Board of Aldermen, Republican, defeats an open housing ordinance, 9–3, over Mayor Schmied's appeal; no further action, its majority says, until the city is calm. Marches downtown that night, and through April and May.
    n: '*Kentucky Kernel*, Apr. 12, 1967 ([ExploreUK](https://exploreuk.uky.edu/catalog/xt7xwd3pzn0m)); Check: the Board''s journal. [[w.kmeyer-civil-rights-in-the]]. Names: Schmied.'
    tags: [state:ky, city:louisville, name:schmied-kenneth-a]
  - id: cal.1967-04-12.railroads
    when: Apr. 11–12
    date: '1967-04-11'
    thread: railroads
    c: The shopcraft dispute. Joint resolution extending the no-strike period passed Apr. 11, Senate [81–1](https://voteview.com/rollcall/RS0900054), House [396–8](https://voteview.com/rollcall/RH0900038); signed Apr. 12, [81 Stat. 12](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg12.pdf), to 12:01 a.m. May 3.
    n: 'Statement by the President Upon Signing Bill Extending the "No Strike" Period in the Railroad Dispute, [1967 Pub. Papers 444](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=512) (Apr. 12, 1967). Statute (K–J Cong. II.J.2). See [[cal.1967-04-10.railroads]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-04-12.crime-and-hijacking-ca
    when: Apr. 12
    date: '1967-04-12'
    thread: crime-and-hijacking
    c: San Quentin, Cal. Aaron Mitchell, convicted of killing a Sacramento policeman in 1963, executed in the gas chamber, Reagan having refused clemency. The State's only execution in Reagan's two terms.
    n: '*People v. Mitchell*, [63 Cal. 2d 805](https://static.case.law/cal-2d/63/case-pdfs/0805-01.pdf) (1966), the death sentence affirmed. [Wikipedia, "Aaron Mitchell (murderer)"](https://en.wikipedia.org/wiki/Aaron_Mitchell_(murderer)); Check: the governor''s clemency file and the day of refusal. [[w.hamm-rebel-and-a-cause]]; [[w.mandery-wild-justice]]; [[w.cannon-governor-reagan]]. See [[cal.1960-02-19.crime-and-hijacking-ca]]. Names: Mitchell, Reagan.'
    tags: [state:ca, name:mitchell-aaron, name:reagan-ronald]
  - id: cal.1967-04-12.state-and-city-finance-ne
    when: Apr. 12
    date: '1967-04-12'
    thread: state-and-city-finance
    c: 'Nebraska''s first sales and income taxes. The Legislature, 38–11, passes LB 377, the Committee on Revenue''s bill at Tiemann''s request, with the emergency clause: a sales and use tax, an income tax on individuals, trusts, estates and corporations, a corporate franchise tax. Klaver''s motion to strike the enacting clause lost, 10–36. Tiemann signs it the same day.'
    n: 'Neb. *Legislative Journal*, 77th Sess. (1967), [1294–1296](https://nebraskalegislature.gov/FloorDocs/77/PDF/Journal/r1journal.pdf#page=1294); Tiemann to the Legislature, Apr. 13, 1967: "on April 12, 1967 I approved LB 377," [1425](https://nebraskalegislature.gov/FloorDocs/77/PDF/Journal/r1journal.pdf#page=1425). *Laws of Nebraska*, 1967, ch. 487, p. 1533; *Nebraska Blue Book*, 1968, [435–436](https://govdocs.nebraska.gov/epubs/L3000/D001-1968.pdf#page=439). Names: Tiemann.'
    tags: [state:ne, name:tiemann-norbert-t]
  - id: cal.1967-04-13.congress
    when: Apr. 13
    date: '1967-04-13'
    thread: congress
    c: The House creates a Committee on Standards of Official Conduct, twelve members, six of each party, H. Res. 418, [400–0](https://voteview.com/rollcall/RH0900041) (Check its terms).
    n: '[[w.zelizer-on-capitol-hill]]. See [[cal.1966-10-22.congress]]; [[cal.1967-03-01.congress]].'
  - id: cal.1967-04-12.program
    when: Apr. 13
    date: '1967-04-13'
    thread: program
    also: [congress, economy]
    c: 'The Senate, on H.R. 6950, the investment credit bill: Gore''s amendment repealing the Presidential Election Campaign Fund Act from July 1, [48–42](https://voteview.com/rollcall/RS0900059).'
    n: 'Check: the Record''s page. See [[cal.1966-10-12.program]]; [[cal.1967-03-09.economy]]. [[w.mann-legacy-to-power]]. Names: Gore.'
    tags: [name:gore-albert-sr]
  - id: cal.1967-04-14.state-and-city-finance-md
    when: Apr. 14
    date: '1967-04-14'
    thread: state-and-city-finance
    c: 'Maryland. Agnew signs H.B. 378, the tax reform bill: a graduated income tax of 2 to 5 percent in place of the flat 3 percent.'
    n: 'Agnew, [Statement on Signing House Bill 378](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--148.html), Apr. 14, 1967, 83 Archives of Maryland 148. [[w.witcover-white-knight]]; [[w.coffey-spiro-agnew-and-the]]; [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-03-30.state-and-city-finance-md]]. Names: Agnew.'
    tags: [state:md, name:agnew-spiro-t]
  - id: cal.1967-04-15.war-opposition
    when: Apr. 15
    date: '1967-04-15'
    thread: war-opposition
    also: [students, draft, king]
    c: 'The Spring Mobilization to End the War in Vietnam. New York: from Central Park to the United Nations; King, Spock and Carmichael among the speakers; estimates of the crowd from 100,000 to 400,000 (Check). In Central Park''s Sheep Meadow some 150 to 200 young men burn their draft cards. San Francisco: a march to Kezar Stadium, some 50,000 (Check).'
    n: '[[w.debenedetti-american-ordeal]]; [[w.wells-war-within]]; [[w.zaroulis-who-spoke-up]]; [[w.foley-confronting-the-war-machine]]; [[w.garrow-bearing-the-cross]]. See [[cal.1967-04-04.king]]. Names: Martin Luther King, Spock, Carmichael.'
    tags: [name:king-martin-luther-jr, name:spock-benjamin, name:carmichael-stokely, state:ny, city:nyc, state:ca, city:san-francisco]
  - id: cal.1967-04-16.opinion
    when: Apr. 16
    date: '1967-04-16'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, special survey, Republican county chairmen, their preference for 1968: Nixon 1,227, Romney 341, Reagan 233, Percy 119, Rockefeller 67, Rhodes 34, Morton 24, Hatfield 17, Brooke 11, Lindsay 10. Of the two: Nixon 1,562, Romney 523; South, 663 and 53. Nixon''s 1,227, if he is not a candidate: Reagan 429, Romney 249, Percy 160, Rhodes 84, Morton 83.'
    n: '[[w.gallup-poll]], III, 2059. Names: Nixon, Romney, Reagan, Percy, Rockefeller, Rhodes, Morton, Hatfield, Brooke, Lindsay.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:reagan-ronald, name:percy-charles-h, name:rockefeller-nelson, name:rhodes-james-a, name:morton-thruston-b, name:hatfield-mark-o, name:brooke-edward-w, name:lindsay-john-v]
  - id: cal.1967-04-18.vietnam-2
    when: Apr. 18–21
    date: '1967-04-18'
    thread: vietnam
    c: 'The SEATO Council meets in Washington, Apr. 18–20; the seven nations with troops in Vietnam, Apr. 20–21: their efforts to go on.'
    n: 'FRUS 1964–68, V, doc. [142](https://history.state.gov/historicaldocuments/frus1964-68v05/d142). Check: the communiqués, *Dep''t St. Bull.* See [[cal.1966-10-17.vietnam]].'
  - id: cal.1967-04-19.europe-and-the-alliance
    when: Apr. 19
    date: '1967-04-19'
    thread: europe-and-the-alliance
    c: Adenauer dies at Rhöndorf, 91.
    n: 'Statement by the President on the Death of Konrad Adenauer, [1967 Pub. Papers 454](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=522) (Apr. 19, 1967). [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1966-12-01.europe-and-the-alliance]]. Names: Adenauer.'
    tags: [name:adenauer-konrad]
  - id: cal.1967-04-18.vietnam
    when: Apr. 20
    date: '1967-04-20'
    thread: vietnam-air-war
    c: American aircraft strike two thermal power plants at Haiphong, inside the zone closed to them before; strikes put off twice while Johnson was away.
    n: 'FRUS 1964–68, V, doc. [139](https://history.state.gov/historicaldocuments/frus1964-68v05/d139). [[w.clodfelter-limits-of-air-power]]; [[w.gibbons-u-s-government-and]], IV; [[w.frankum-like-rolling-thunder]], 55–58; [[w.vietnam-victory-in-vietnam]], 203. See [[cal.1966-06-29.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, place:haiphong]
  - id: cal.1967-04-20.program
    when: Apr. 20
    date: '1967-04-20'
    thread: program
    also: [congress]
    c: 'The Senate, on H.R. 6950: Long''s substitute for the campaign fund, an "Honest Election Act," [46–42](https://voteview.com/rollcall/RS0900071).'
    n: 'Check: the Record''s page. See [[cal.1967-04-12.program]]. Names: Long.'
    tags: [name:long-russell-b]
  - id: cal.1967-04-21.europe-and-the-alliance
    when: Apr. 21–22
    date: '1967-04-21'
    thread: europe-and-the-alliance
    c: 'Athens. Army officers seize power in the night, five weeks before the elections of May 28; Kanellopoulos and most of his government held; Andreas Papandreou and his father arrested. King Constantine, at Tatoi, to the American attaché before dawn: "Get word to Sixth Fleet." Kollias, a prosecutor, Prime Minister; Pattakos Minister of the Interior; Papadopoulos and Makarezos in the cabinet. Talbot, Apr. 22: a "fairly starchy posture," aid not cut off for now; State: the King to stay in Greece and bargain.'
    n: 'FRUS 1964–68, XVI, docs. [273](https://history.state.gov/historicaldocuments/frus1964-68v16/d273), [274](https://history.state.gov/historicaldocuments/frus1964-68v16/d274), [277](https://history.state.gov/historicaldocuments/frus1964-68v16/d277), [278](https://history.state.gov/historicaldocuments/frus1964-68v16/d278). Made public: FRUS 1964–68, XVI (2000). [[w.keeley-colonels-coup-and-the]]; [[w.miller-united-states-and-the]]. Names: Kanellopoulos, Andreas Papandreou, George Papandreou, Constantine, Kollias, Pattakos, Papadopoulos, Makarezos, Talbot.'
    tags: [name:kanellopoulos-panayotis, name:papandreou-andreas, name:papandreou-george, name:constantine-ii, name:kollias-constantine, name:pattakos-stylianos, name:papadopoulos-george, name:makarezos-nicholas, name:talbot-phillips]
  - id: cal.1967-04-21.jobs-and-wages-ny
    when: Apr. 21
    date: '1967-04-21'
    thread: jobs-and-wages
    also: [states-and-cities, labor-disputes]
    c: 'New York. Rockefeller signs the Public Employees'' Fair Employment Act, the Taylor Law, in place of the Condon–Wadlin Act of 1947: public employees may organize and bargain collectively; strikes forbidden, punished by fines and jail; a Public Employment Relations Board. In force Sept. 1. Laws of 1967, ch. 392.'
    n: '[N.Y. Public Employment Relations Board, "1967–1971"](https://perb.ny.gov/timeline-notable-events); [Wikipedia, "Taylor Law"](https://en.wikipedia.org/wiki/Taylor_Law). Check: *Laws of New York*, 1967, ch. 392. [[w.connery-rockefeller-of-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1966-01-01.jobs-and-wages]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1967-04-21.open-housing-md
    when: Apr. 21
    date: '1967-04-21'
    thread: open-housing
    also: [desegregation-public-places]
    c: 'Maryland. Agnew signs the open housing act, S.B. 237: no discrimination in the sale of new houses or the rental of new apartments in buildings of 12 units or more built after July 1, 1968; an owner reselling the house he lived in exempt. "A similar first," south of the Mason-Dixon line, to the public accommodations law. With it, S.B. 173, extending the public accommodations law. The same session repealed the law against interracial marriage. The act petitioned to referendum.'
    n: 'Agnew, [Statement on Signing Senate Bill 237 (Open Housing Bill) and Senate Bill 173](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--158.html), Apr. 21, 1967, 83 Archives of Maryland 158; [Statement on Open Housing Legislation](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--108.html), Mar. 17. The act: ch. 385, Acts of 1967 (*Maryland Manual*, 1969–70, [483](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000174/html/am174--483.html)). Check: the date of the miscegenation repeal. [[w.witcover-white-knight]]; [[w.coffey-spiro-agnew-and-the]]; [[w.durr-behind-the-backlash]]. Names: Agnew.'
    tags: [state:md, name:agnew-spiro-t]
  - id: cal.1967-04-22.railroads
    when: Apr. 22
    date: '1967-04-22'
    thread: railroads
    c: 'The shopcraft dispute. A special panel, Fahy, George W. Taylor and Dunlop, reports: no agreement, the parties not far apart.'
    n: 'Statement by the President Upon Receiving Report of Special Panel To Investigate the Railroad Labor Dispute, [1967 Pub. Papers 460](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=528) (Apr. 22, 1967). See [[cal.1967-04-10.railroads]]. Names: Fahy, George W. Taylor, Dunlop, Johnson.'
    tags: [name:fahy-charles, name:taylor-george-w, name:dunlop-john-t, name:johnson-lyndon-b]
  - id: cal.1967-04-23.opinion
    when: Apr. 23
    date: '1967-04-23'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Mar. 30–Apr. 5: Johnson 43 percent, Romney 35, Wallace as a third party''s candidate 13, undecided 9. South: Wallace 35, Johnson 32, Romney 26; Southern whites, Wallace 38, Johnson 28, Romney 28. Without Wallace: Romney 52, Johnson 43; South, Romney 48, Johnson 44.'
    n: '[[w.gallup-poll]], III, 2060–61. Names: Johnson, Romney, Wallace.'
    tags: [name:johnson-lyndon-b, name:romney-george-w, name:wallace-george-c]
  - id: cal.1967-04-24.vietnam
    when: Apr. 24
    date: '1967-04-24'
    thread: vietnam
    also: [war-opposition]
    c: 'Westmoreland home. New York, to the Associated Press: the enemy encouraged by opposition at home to the war (Check the place and words).'
    n: 'FRUS 1964–68, V, doc. [141](https://history.state.gov/historicaldocuments/frus1964-68v05/d141). [[w.sorley-westmoreland]]; [[w.westmoreland-soldier-reports]]. See [[cal.1967-03-18.vietnam]]. Names: Westmoreland.'
    tags: [name:westmoreland-william]
  - id: cal.1967-04-24.vietnam-air-war
    when: Apr. 24
    date: '1967-04-24'
    thread: vietnam-air-war
    c: The airfields at Kép and Hòa Lạc struck for the first time.
    n: 'Check: the Defense Department''s announcement. See [[cal.1967-04-18.vietnam]].'
    tags: [place:kep, place:hoa-lac]
  - id: cal.1967-04-24.europe-and-the-alliance
    when: Apr. 24–26
    date: '1967-04-24'
    thread: europe-and-the-alliance
    c: 'Johnson in Germany for Adenauer''s state funeral, at Cologne, Apr. 25; with Kiesinger, Apr. 24 and 26: nonproliferation, trade and money, the troops. Rostow to Barzel, Apr. 24: Johnson cannot hold off Mansfield on the troops unless Bonn acts as a partner. Back in Washington Apr. 26.'
    n: 'Exchange of Remarks With Chancellor Kurt Kiesinger Following Discussions in Bonn, [1967 Pub. Papers 462](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=530) (Apr. 26, 1967). FRUS 1964–68, XV, docs. [212](https://history.state.gov/historicaldocuments/frus1964-68v15/d212), [213](https://history.state.gov/historicaldocuments/frus1964-68v15/d213), [214](https://history.state.gov/historicaldocuments/frus1964-68v15/d214). [President''s Daily Diary, Apr. 24, 1967](https://catalog.archives.gov/id/192466), image 4; [Apr. 25](https://catalog.archives.gov/id/192467), image 5; [Apr. 26](https://catalog.archives.gov/id/192468), images 2, 3, 9 (LBJ Library; National Archives Catalog). Made public: FRUS 1964–68, XV (1999). See [[cal.1967-04-19.europe-and-the-alliance]]. Names: Kiesinger, Rostow, Barzel, Mansfield, Johnson, Adenauer.'
    tags: [name:kiesinger-kurt-georg, name:rostow-walt-w, name:barzel-rainer, name:mansfield-mike, name:johnson-lyndon-b, name:adenauer-konrad]
  - id: cal.1967-04-24.space
    when: Apr. 24
    date: '1967-04-24'
    thread: space
    also: [soviet-union]
    c: Komarov killed when Soyuz 1's parachute fails on its return, the first death in flight. Johnson's message to Podgorny.
    n: 'Message to President Podgorny on the Death of Soviet Cosmonaut Vladimir Komarov, [1967 Pub. Papers 462](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=530) (Apr. 24, 1967). [[w.siddiqi-challenge-to-apollo]]. Names: Komarov, Podgorny, Johnson.'
    tags: [name:komarov-nikolai-d, name:podgorny-nikolai-v, name:johnson-lyndon-b]
  - id: cal.1967-04-24.vietnam-operations
    when: Apr. 24
    date: '1967-04-24'
    thread: vietnam-operations
    c: 'The hill fights at Khe Sanh begin: a Marine patrol sent to set up an observation post on Hill 861 meets North Vietnamese troops; one man of the post escapes. Hill 861 taken Apr. 28, Hill 881 South May 2.'
    n: '[[w.telfer-u-s-marines-in]], 34–45; [[w.andrew-hill-fights]].'
    tags: [place:khe-sanh]
  - id: cal.1967-04-25.space
    when: Apr. 25
    date: '1967-04-25'
    thread: space
    also: [soviet-union]
    c: The Senate consents to the Outer Space Treaty, [18 U.S.T. 2410](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-18-3/lltreaties-18-3.pdf#page=94), [610 U.N.T.S. 205](https://treaties.un.org/doc/Publication/UNTS/Volume%20610/volume-610-I-8843-English.pdf), [88–1](https://voteview.com/rollcall/RS0900072) (Check the count). Johnson ratifies May 24; in force Oct. 10.
    n: 'See [[cal.1967-01-27.space]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-04-25.health-co
    when: Apr. 25
    date: '1967-04-25'
    thread: health
    also: [women]
    c: 'Colorado. Love signs Lamm''s abortion bill, the first State law to widen the grounds: in a hospital, on the approval of a panel of three physicians, where the pregnancy threatens the woman''s life or permanent physical or mental health, where the child would be born with grave defects, or after rape or incest.'
    n: 'Check: Colo. Sess. Laws 1967 (H.B. 1426). Colorado Public Radio, ["50 years ago, Colorado passed first state law liberalizing abortion"](https://www.cpr.org/2017/04/25/colorados-trailblazing-abortion-law-marks-50-years/), Apr. 25, 2017. [[w.garrow-liberty-and-sexuality]]; [[w.reagan-when-abortion-was-a]]; [[w.luker-abortion-and-the-politics]]; [[w.greenhouse-before-roe-v-wade]]. Names: Love, Lamm.'
    tags: [state:co, name:love-john-a, name:lamm-richard-d]
  - id: cal.1967-04-25.program
    when: Apr. 25
    date: '1967-04-25'
    thread: program
    also: [congress, economy]
    c: The Senate recommits H.R. 6950, [64–22](https://voteview.com/rollcall/RS0900073), with instructions to report back at once the investment credit and the campaign fund's repeal as of July 31, and within six weeks new provisions for the fund.
    n: 'Check: the Record''s page. See [[cal.1967-04-12.program]].'
  - id: cal.1967-04-26.opinion
    when: Apr. 26
    date: '1967-04-26'
    thread: opinion
    also: [jobs-and-wages, labor-disputes]
    c: 'Gallup, Mar. 30–Apr. 4: no strike to last more than 21 days, then a committee the courts appoint to settle it, binding on both: favor 68 percent, oppose 22. Union members 55 and 41.'
    n: '[[w.gallup-poll]], III, 2061.'
  - id: cal.1967-04-27.vietnam-program-5
    when: Apr. 27
    date: '1967-04-27'
    thread: vietnam-program-5
    c: 'Westmoreland with Johnson and his advisers: without the 2⅓ divisions and five squadrons asked, 565,000 men in all, "it will be nip and tuck"; another 2⅓ divisions, about 100,000 men, probably in fiscal 1969; "a war of attrition"; "frankly dismayed at even the thought of stopping the bombing."'
    n: 'FRUS 1964–68, V, doc. [149](https://history.state.gov/historicaldocuments/frus1964-68v05/d149) (Christian''s notes). Made public: FRUS 1964–68, V (2002). See [[cal.1967-03-18.vietnam]]. Names: Westmoreland, Johnson.'
    tags: [name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1967-04-27.congress
    when: Apr. 27
    date: '1967-04-27'
    thread: congress-dodd
    c: 'Dodd. The Senate''s Select Committee on Standards and Conduct, Stennis chairman, three of each party, unanimously recommends censure: at least $116,083 of funds raised at testimonial dinners and in campaigns used for his own purposes; seven trips, 1961–65, billed both to the Senate and to private organizations. His dealings with Julius Klein criticized; possible violations of law referred to the Justice Department and the Internal Revenue Service. Hearings in June–July 1966 and Mar. 13–17, 1967 (Check).'
    n: '[Senate Historical Office, "The Censure Case of Thomas J. Dodd"](https://www.senate.gov/about/powers-procedures/censure/135ThomasDodd.htm). [[w.boyd-above-the-law]]; [[w.washington-merry-go-round]]. Names: Dodd, Stennis, Julius Klein.'
    tags: [name:dodd-thomas-j, name:stennis-john-c, name:klein-julius]
  - id: cal.1967-04-28.vietnam
    when: Apr. 28
    date: '1967-04-28'
    thread: vietnam
    c: 'Westmoreland to a joint meeting of Congress: "we will prevail in Vietnam over the Communist aggressor" (Check). Johnson''s luncheon for him.'
    n: 'The address to Congress, 56 *Dep''t St. Bull.* 738 (1967). Remarks at a Luncheon for General Westmoreland, [1967 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=537) (Apr. 28, 1967). See [[cal.1967-04-24.vietnam]]. Names: Westmoreland, Johnson.'
    tags: [name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1967-04-28.railroads
    when: Apr. 28
    date: '1967-04-28'
    thread: railroads
    c: The shopcraft dispute. Johnson asks Congress for 45 days more without a strike, and legislation to follow.
    n: 'Letter to the President of the Senate and to the Speaker of the House Urging Further Extension of the "No Strike" Period, [1967 Pub. Papers 468](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=536) (Apr. 28, 1967). See [[cal.1967-04-10.railroads]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-04-28.draft
    when: Apr. 28
    date: '1967-04-28'
    thread: draft
    also: [black-nationalism, war-opposition]
    c: Houston. Muhammad Ali, called for induction, does not step forward at his name; he claims exemption as a minister of the Nation of Islam. The New York State Athletic Commission suspends his license and his title the same day; the World Boxing Association follows (Check).
    n: '*Clay v. United States*, [403 U.S. 698](https://tile.loc.gov/storage-services/service/ll/usrep/usrep403/usrep403698/usrep403698.pdf) (1971). [[w.remnick-king-of-the-world]]; [[w.marqusee-redemption-song]]. See [[cal.1963-12-01.black-nationalism]]. Names: Ali.'
    tags: [name:ali-muhammad, state:tx, city:houston]
  - id: cal.1967-04-28.europe-and-the-alliance
    when: Apr. 28
    date: '1967-04-28'
    thread: europe-and-the-alliance
    also: [economy]
    c: 'London. The trilateral talks end, McCloy, Duckwitz and Thomson the three representatives: up to 35,000 American troops to be redeployed from Germany to the United States, two brigades of the 24th Division and 96 of the 216 aircraft of three fighter wings, rotating back for exercises; the Bundesbank to invest $500 million in medium-term American securities from July; its letter to Martin on not converting dollars to gold noted. Germany to buy DM 200 million of British defense goods, Apr. 1967–Mar. 1968.'
    n: 'FRUS 1964–68, XIII, docs. [238](https://history.state.gov/historicaldocuments/frus1964-68v13/d238), [249](https://history.state.gov/historicaldocuments/frus1964-68v13/d249). Made public: FRUS 1964–68, XIII (1995). [[w.zimmermann-money-and-security]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1966-09-26.europe-and-the-alliance]]. Names: McCloy, Duckwitz, George Thomson, Martin.'
    tags: [name:mccloy-john-j, name:duckwitz-georg-ferdinand, name:thomson-george-m, name:martin-william-mcchesney-jr]
  - id: cal.1967-04-29.transportation
    when: Apr. 29
    date: '1967-04-29'
    thread: transportation
    c: Johnson authorizes the Secretary of Transportation to sign contracts for prototypes of the supersonic transport, Boeing's airframe and General Electric's engines; $198 million to be asked of Congress for the government's share of the next phase.
    n: 'Statement by the President Upon Authorizing Construction of a Prototype Supersonic Transport Aircraft, [1967 Pub. Papers 478](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=546) (Apr. 29, 1967). [[w.horwitch-clipped-wings]]. See [[cal.1964-04-01.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:boyd-alan-s]
  - id: cal.1967-04-30.opinion
    when: Apr. 30
    date: '1967-04-30'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 30–Apr. 4, a plan if Hanoi still refuses to discuss peace: the United States to train South Vietnam''s men to fight, withdraw 100,000 Americans as each 100,000 are trained, most or all within a year, and keep up supplies and aid: approve 61 percent, disapprove 22. China to send many troops if the North shows signs of giving in: will 42, will not 36.'
    n: '[[w.gallup-poll]], III, 2061–62.'
