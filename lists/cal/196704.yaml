  - id: cal.1967-04-29.transportation
    when: Apr. 29
    date: '1967-04-29'
    thread: transportation
    c: Johnson authorizes the Secretary of Transportation to sign contracts for prototypes of the supersonic transport, Boeing's airframe and General Electric's engines; $198 million to be asked of Congress for the government's share of the next phase.
    n: 'Statement by the President Upon Authorizing Construction of a Prototype Supersonic Transport Aircraft, [1967 Pub. Papers 478](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=546) (Apr. 29, 1967). To check: [[w.horwitch-clipped-wings]]. See [[cal.1964-04-01.transportation]]. Names: Johnson.'
