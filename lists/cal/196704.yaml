    date: '1967-04-01'
    thread: vietnam-diplomacy
    also: [europe-and-the-alliance]
    c: 'The Vatican. Humphrey alone with Paul VI more than an hour: the Pope admires Johnson and prays for him, but the bombing of the North is "eroding America''s moral position." Humphrey explains the pauses.'
    n: 'Humphrey to Johnson and Rusk from Florence, Apr. 2: FRUS 1964–68, XII, doc. [308](https://history.state.gov/historicaldocuments/frus1964-68v12/d308). [[w.solberg-hubert-humphrey]], 304–05. See [[cal.1967-03-29.europe-and-the-alliance]]. Names: Humphrey, Paul VI, Johnson.'
