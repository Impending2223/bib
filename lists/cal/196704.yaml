    tags: [polity:drv, vis:only:drv]
  - id: cal.1967-04-01.china-leadership-2
    when: Apr. 1–4
    date: '1967-04-01'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai holds talks each day with the Party, government and army heads and mass delegates of Sichuan on the Sichuan and Yibin problems. April 3: mass bodies may not pull leaders out for kneeling, black boards, tall hats or parading; argument, not arms; no talk of "black commander" or "black military subdistrict"; all bodies to rectify with open doors, with self-criticism first, facts and reasons.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Apr. 1–4, 1967); [[w.jianguo-yilai-mao-zedong]], XIX, 26 (Apr. 1, 1967; n.1 summarizes Zhou''s talks with the Sichuan Party, government and army heads and mass delegates, Apr. 1–4: no kneeling, black boards, tall hats or parading by the masses; argument, not arms; no ''black commander'' or ''black (army) subdistrict''). Made public: 2020. Names: Zhou Enlai.'
    src:
      c: 554aa01c
      rows:
