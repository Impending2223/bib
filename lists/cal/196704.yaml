  - id: cal.1967-04-03.vietnam-congress
    when: Apr. 3
    date: '1967-04-03'
    thread: vietnam-congress
    c: 'Byrd of West Virginia in the Senate on U Thant''s call of Apr. 1 for a unilateral American cease-fire, endorsing Clark''s: the Secretary General, "like Caesar''s wife," should be above suspicion; he "has departed from the traditional and proper role." A unilateral cessation of the bombing would "prolong the agony."'
    n: '[113 Cong. Rec. 8023–24](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-6-1.pdf#page=21) (1967) (Senate, Apr. 3, 1967). [[w.gibbons-u-s-government-and]], IV, 677 n.16. See [[cal.1967-03-31.vietnam-congress]]. Names: Byrd, U Thant, Clark.'
