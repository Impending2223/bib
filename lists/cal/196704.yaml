  - id: cal.1967-04-14.cuba
    when: Apr. 14
    date: '1967-04-14'
    thread: cuba
    c: 'McCone, out of the CIA, dictates a memorandum on the meeting of Aug. 10, 1962, after talking by telephone, at Robert Kennedy''s request, with Jack Anderson, who is preparing a column on Castro assassination attempts implicating the President and Robert Kennedy: of several Mongoose meetings on Aug. 8, 9 or 10, "I recall a suggestion being made to liquidate top people in the Castro regime, including Castro." "I took immediate exception to this suggestion"; "At no time did the suggestion receive serious consideration."'
