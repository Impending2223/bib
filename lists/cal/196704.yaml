    c: 'Mao reads Liang Xingchu''s report of Apr. 20 on the Sichuan release of those held in custody: to be printed for the Military Commission''s enlarged meeting; errors are unavoidable, if truly mended; Sichuan seized too many and branded many mass bodies reactionary, wrongly, but mends fast; now another current says all the army did there was wrong, and its men supporting the left are left stranded; keep calm, own the errors to the masses, mend at once, teach army and masses alike; this wind, he thinks, will be milder than February''s.'
