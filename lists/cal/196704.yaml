  - id: cal.1967-04-01.india-and-china
    when: Apr. 1
    date: '1967-04-01'
    thread: india-and-china-food
    also: [foreign-aid]
    c: 'Joint resolution supporting emergency food aid to India signed, [81 Stat. 7](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg7.pdf): up to 3 million tons more of food grain, on condition of matching aid from other countries; $25 million more of food for CARE and other voluntary agencies. The House passed it Mar. 9, [312–63](https://voteview.com/rollcall/RH0900019).'
    n: 'Statement by the President Upon Signing Resolution Providing Additional Emergency Food for India, [1967 Pub. Papers 411](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=479) (Apr. 1, 1967). To check: [[w.ahlberg-transplanting-the-great-society]]. See [[cal.1966-11-10.india-and-china]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    short: the food resolution
    time_range:
