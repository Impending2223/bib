    c: 'Great Hall, Fujian Hall. Mao receives Phạm Văn Đồng''s delegation, Lin Biao, Zhou Enlai, Chen Yi and Ye Jianying present, on finding the rules of guerrilla war and of battles of annihilation in Vietnam and on aid. On Wei Guoqing, battered by the Red Guards for months, besieged, unable to leave: he erred, but a good man, scholarly, not rough; known to Mao through the Vietnamese. On Dazhai: he has seen Chen Yonggui, an honest man. Zhou apologizes for the Chinese Red Guards who crossed into Vietnam, most of them good and come to fight the Americans, but heedless of the two countries'' rules; Mao: some know no border, most are from Jiangxi, some from Yunnan; explain to them and hand them over.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 11, 1967. [[w.zhonghua-renmin-gongheguo-waijiao]], 149 (Mar. 29–Apr. 11, 1967; Mao receives the delegation: praise of the war of resistance to the U.S. and the resolve to fight a protracted war; China the Vietnamese''s reliable rear). [[w.77-conversations-between-chinese]], [102–105](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=100) (doc. 26; Beijing, Apr. 11, 1967, no hour or hall: Mao with Phạm Văn Đồng and Võ Nguyên Giáp, Zhou and the interpreter Zhu Qiwen present: the rules of the war learned in fighting, "preserve the mountain green", bites of a platoon, company or battalion of American troops and a regiment of puppet troops; China to help with a 100-km railway and 100,000 tons of rice and 50,000 of maize; Wei Guoqing, criticized by the Red Guards, known to Mao from his reports on his visits to Vietnam; Giáp recalls Zhou''s telegram to Hồ of 1949 or 1950; the new ambassador Ngô Minh Loan, 103 n.159, and Trần Tử Bình''s death, 104). [[w.77-conversations-between-chinese]], [101–102](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=99) (doc. 25; headed Beijing, Apr. 10, 1967: Zhou and Mao to Phạm Văn Đồng on the Red Guards). Made public: 1998. Check: doc. 25, of Mao, Zhou and Phạm Văn Đồng on the Red Guards, is headed Apr. 10; taken here as this meeting: the calendar''s chronologies have Mao meet Đồng on Apr. 11 only, Zhou''s two talks of Apr. 10 without him ([[cal.1967-04-10.china-leadership]]), and Mao speaks of the Red Guards here (Wei Guoqing). Names: Mao Zedong, Phạm Văn Đồng, Lin Biao, Zhou Enlai, Chen Yi, Ye Jianying, Wei Guoqing, Chen Yonggui.'
