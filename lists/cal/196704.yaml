    c: 'Ye Qun 葉群, Qi Benyu 戚本禹 and Yang Chengwu 楊成武 send Chen Hong 陳虹, deputy head of the General Staff political department''s organization department, with Wang Yumin 王育民, Wang Cheng''en 王成恩 and Zhu Tiezheng 朱鐵錚 to Shanghai 上海 for the "black materials": with the garrison''s help they find the 23 files of the 1954 inquiry into the anonymous letter against Jiang Qing 江青, written in fact by Zhu Ming 朱明, wife of Lin Boqu, who killed herself in 1961. Chen telephones Yang; Yang: Zhou Enlai and Jiang Qing say bring them back first; "not a word to be lost."'
