  - id: cal.1967-04-27.vietnam-program-5
    when: Apr. 27
    date: '1967-04-27'
    thread: vietnam-program-5
    c: 'Westmoreland with Johnson and his advisers: without the 2⅓ divisions and five squadrons asked, 565,000 men in all, "it will be nip and tuck"; another 2⅓ divisions, about 100,000 men, probably in fiscal 1969; "a war of attrition"; "frankly dismayed at even the thought of stopping the bombing."'
