  - id: cal.1967-04-01.europe-and-the-alliance
    when: Apr. 1
    date: '1967-04-01'
    thread: europe-and-the-alliance
    c: 'Rome. Humphrey with Saragat: Italy for European unity in partnership with the United States; the American part in Asia "in no way lessens interest in Europe, indeed it increases it." Saragat on the nonproliferation treaty.'
    n: 'FRUS 1964–68, XII, doc. [128](https://history.state.gov/historicaldocuments/frus1964-68v12/d128). [[w.solberg-hubert-humphrey]], 305 (Saragat to Humphrey, by Humphrey''s report of Apr. 1: Johnson''s decisions, like Truman''s, to look greater twenty years on). See [[cal.1967-03-29.europe-and-the-alliance]]. Names: Humphrey, Saragat.'
    src:
      c: 1eb0354b
      rows:
