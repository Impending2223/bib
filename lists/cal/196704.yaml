  - id: cal.1967-04-29.vietnam-congress
    when: Apr. 29
    date: '1967-04-29'
    thread: vietnam-congress
    c: 'Mansfield to Johnson, "Vietnam": invite Hanoi, the NLF and China with Saigon to put their views to the Security Council; ask the World Court''s advisory opinion on the Geneva accords'' bearing. The bombing makes Hanoi ever more dependent on China; "the road to settlement with Hanoi, now, very likely runs by way of Peking." He offers to approach Peking himself.'
    n: 'Mansfield to Johnson, "Vietnam," Apr. 29, [FRUS 1964–68, V: Vietnam, 1967, doc. 151](https://history.state.gov/historicaldocuments/frus1964-68v05/d151). [[w.gibbons-u-s-government-and]], IV, 677. Names: Mansfield, Johnson.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1967-04-30.opinion
    when: Apr. 30
    date: '1967-04-30'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 30–Apr. 4, a plan if Hanoi still refuses to discuss peace: the United States to train South Vietnam''s men to fight, withdraw 100,000 Americans as each 100,000 are trained, most or all within a year, and keep up supplies and aid: approve 61 percent, disapprove 22. China to send many troops if the North shows signs of giving in: will 42, will not 36.'
    n: '[[w.gallup-poll]], III, 2061–62.'
  - id: cal.1967-04-30.vietnam-congress
    when: Apr. 30
    date: '1967-04-30'
    thread: vietnam-congress
    c: 'Rostow to Johnson on Mansfield''s proposal: Katzenbach and Goldberg "agree it''s a gimmick. Nick leans against; Arthur for." Rusk: ready to take it to the Security Council, but Thant and others will oppose; the World Court lacks jurisdiction; "strongly opposed" to a Mansfield mission to China, Mansfield being "an officer of the United States Government."'
    n: 'Rostow to Johnson, Apr. 30, [FRUS 1964–68, V: Vietnam, 1967, doc. 152](https://history.state.gov/historicaldocuments/frus1964-68v05/d152) (Rusk''s views; n. 3: Rostow''s memorandum of 11:45 a.m., Katzenbach''s "gimmick," Goldberg for). [[w.gibbons-u-s-government-and]], IV, 677–78. See [[cal.1967-04-29.vietnam-congress]]. Names: Rostow, Johnson, Mansfield, Katzenbach, Goldberg, Rusk.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:mansfield-mike, name:katzenbach-nicholas, name:goldberg-arthur-j, name:rusk-dean]
