    thread: europe-and-the-alliance
    also: [vietnam]
    c: 'Chequers, after dinner. Humphrey with Wilson on Vietnam: Kosygin obsessed with China, by Wilson''s account; Wilson thinking of moving toward the middle, between Washington and Moscow, as a go-between. Humphrey: such a shift would be misunderstood at home and might strengthen the "hawks."'
    n: 'Humphrey to Johnson and Rusk, Apr. 4: FRUS 1964–68, XII, doc. [268](https://history.state.gov/historicaldocuments/frus1964-68v12/d268). [[w.solberg-hubert-humphrey]], 305 (Humphrey''s warning to Wilson against "jeopardizing his relationship with the President," by his reports of Apr. 4 and 5). See [[cal.1967-03-29.europe-and-the-alliance]]. Names: Humphrey, Wilson, Kosygin. Check: in the report FRUS prints, the words are Kosygin''s advice to Wilson.'
    src:
      c: ed2efdf0
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d268: all'
        - 'w.solberg-hubert-humphrey 305: C'
        - 'via w.solberg-hubert-humphrey 305 n.wilson: C'
    tags: [name:humphrey-hubert-h, name:wilson-harold, name:kosygin-aleksei]
