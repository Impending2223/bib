  - id: cal.1967-04-11.china-leadership-2
    when: Apr. 11
    date: '1967-04-11'
    time: 1967-04-11T03:00Z
    place: peking
    thread: china-leadership
    also: [vietnam-hanoi, soviet-union]
    c: 'Zhou Enlai, in talks with Phạm Văn Đồng: to win, the Vietnam war must not be given up halfway. Asked whether Stalin advised the PLA not to cross the Yangtze: Stalin doubted China could cross in 1949 and thought the U.S. would send troops; the U.S. did not. When Nanjing fell, the U.S. ambassador stayed and offered recognition and perhaps aid; China paid no heed and he left. China will rouse the world''s peoples to back Vietnam''s victory; the Soviet Union would have it stop halfway, as under Stalin, who after the two atomic bombs signed with Chiang, in effect leaving China to the U.S. for interests in the Northeast and Xinjiang and Mongolia, and in August 1945 wired Mao to cooperate with the Kuomintang and start no civil war; in Moscow after Shanghai''s liberation Stalin asked Liu Shaoqi whether that telegram had hampered the war, and Liu said not.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967); [[w.zhou-enlai-waijiao-huodong]], 510 (Apr. 11, 1967; 11 a.m., Building 18, Diaoyutai guesthouse, the seventh talks, Zhou saying that of a hundred li, ninety is half the journey and the last ten the hardest); [[w.zhonghua-renmin-gongheguo-waijiao]], 149 (Mar. 29–Apr. 11, 1967; Zhou: "ninety of a hundred li done; the last ten the hardest"; mobilizing the world''s peoples to support Vietnam); [[w.77-conversations-between-chinese]], [105–112](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=103) (doc. 27; Beijing, 11 a.m., Apr. 11, 1967, the Vietnamese and Chinese delegations: Zhou on the closer victory the fiercer the struggle with the Soviets, and on Stalin, Yalta, the atomic bombs, the Chongqing talks, the Yangtze, the U.S. ambassador at Nanjing and Liu Shaoqi''s talk with Stalin in 1949 (Giáp''s question on the Yangtze, 108); then Cambodia, the Battambang incident, Sihanouk, Lon Nol, the NLF and the Khmer ''people''s'' faction). Made public: 1993. Names: Zhou Enlai, Phạm Văn Đồng, Stalin, Mao Zedong, Liu Shaoqi, Chiang Kai-shek.'
