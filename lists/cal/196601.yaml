    tags: [place:operation-crimp, province:binh-duong, province:hau-nghia]
    short: Crimp
    variants:
      - unit: A
        witness: w.lich-su-khang-chien-chong-my
        reads: 'twelve days of fighting at Củ Chi, Jan. 8–19, against the 1st Division''s brigades and the 173d Airborne: 200 actions, nearly 1,000 Americans and Saigon troops killed or wounded, 84 aircraft shot down (most of them UH-1s), 77 vehicles destroyed or damaged (56 M113s), two 105 mm guns; the sweep ended Jan. 19, the brigades moved to Đồng Dù'
        at: IV, 86–88
