    date: '1966-01-03'
    thread: vietnam-pause
    c: 'Wheeler, back from the Far East, tells "the disturbed and angry Chiefs" of his added mission for the administration. At the White House the same day, McNamara: the Chiefs have not yet answered his offer of Dec. 28 to resume the bombing if they show him the pause hurts American operations.'
