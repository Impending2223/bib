  - id: cal.1966-01.vietnam
    when: Jan.
    date: 1966-01
    thread: vietnam
    c: 'Krulak, with Greene''s and Sharp''s approval, gives McNamara in person his paper "A Strategic Appraisal, Vietnam": attrition "the route to defeat"; the people "the prize." Protect the people, strike main forces only when the odds are overwhelming; mine the ports, destroy the rail lines, power and fuel; pacification and land reform. McNamara sends him to Harriman, who asks, "Do you want a war with the Soviet Union or the Chinese?"'
