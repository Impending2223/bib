    when: Jan., early to mid
    date: 1966-01
    at: before 1966-01-01
    thread: china-leadership
    c: Chen Yi 陈毅 inspects Fujian 福建 and the front-line forces and speaks on the troops' study of Chairman Mao's works and readiness for war; he hears the reports of the forces' leaders and of the provincial committee and council, and visits forward units, communes and factories.
    n: '[[w.chen-yi-nianpu]], 1137. Made public: 1995. Names: Chen Yi, Mao Zedong.'
