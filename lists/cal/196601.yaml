  - id: cal.1966-01.china-leadership-7
    when: Jan., late
    date: 1966-01
    at: before 1966-01-21
    thread: china-leadership
    c: 'Ye Jianying 葉劍英 calls in Qiu Huizuo 邱會作 and asks whether at the Shanghai meeting he spoke with anyone about Xiao Hua 蕭華. Qiu says no; he heard only from Tao Zhu 陶鑄 that Xiao should not be made secretary-general of the Military Commission. Ye asks what one who failed to get the post may be thinking. Qiu: perhaps of finding a "pass" 路條, informing on another to be let back in. Ye: well said.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 144. The words: 1966年1月底. Made public: 2011. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 396 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 144 n.36). Names: Ye Jianying, Qiu Huizuo, Tao Zhu.'
    src:
      c: 647e2a50
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 144: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 144 n.36: all'
    tags: [polity:prc, vis:only:prc, name:ye-jianying, name:qiu-huizuo, name:tao-zhu, ok:fields-place]
  - id: cal.1966.china-leadership-34
    when: 1966, fall
    date: '1966'
    at: before 1966-09-23
    thread: china-leadership
    c: 'The heads of the General Departments and the services in Peking are told to assemble at the Jingxi Hotel 京西賓館, ride in two big cars with the curtains drawn, led by Xiao Hua 蕭華 and Yang Chengwu 楊成武, to Ye Jianying''s 葉劍英 house to see the papers on He Long 賀龍: Zhou had telephoned to stress the matter of surrender to the enemy. Ye: Mao is uneasy about He Long, many have exposed him. A dozen papers lie on the table, statements of He''s subordinates, among them a letter of He''s to an old friend in the Nationalist government. Ye says to tell no one outside; Li Zuopeng 李作鵬 gives the same time, place and men.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 165–166. Made public: 2011. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 884–885 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.18a); *Li Zuopeng huiyilu* 《李作鵬回憶錄》 (Beixin chubanshe 北新出版社, Hong Kong), 566 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.18b); *Li Zuopeng huiyilu* 《李作鵬回憶錄》, 568–569 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 166 n.19). Names: Ye Jianying, He Long, Li Zuopeng, Zhou Enlai, Yang Chengwu. Check: the day; Yang has it after the meeting of [[cal.1966-09-06.china-leadership-2]].'
    src:
      c: a638005f
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 165–166: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 165 n.18a: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 166 n.19: all'
    tags: [polity:prc, vis:only:prc, name:ye-jianying, name:he-long, name:li-zuopeng, name:zhou-enlai, ok:fields-place, name:yang-chengwu]
  - id: cal.1966.vietnam-hanoi
    when: 1966, early
    date: '1966'
    at: before 1966-01
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Central Office''s Military Party Committee resolves on building the armed forces in 1966: mend and raise the units held, take in well the new force sent from the North; among the main force stress regiments more than divisions; build up the arms, above all sappers and engineers for the roads; the regional troops and militia raised in quality.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 219. Made public: 2013. Check: the day; the history says "đầu năm 1966".'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966-01.vietnam-hanoi
    when: Jan.
    date: 1966-01
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Region 5 sets up the front command for northern Bình Định: Giáp Văn Cương, commander of the 3d Division, commander; Trần Quang Khanh, Bình Định''s provincial secretary, political commissar.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 104. Made public: 2013. Check: the day.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966.vietnam-hanoi-2
    when: '1966'
    date: '1966'
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: The Central Office forms Region 10 of Quảng Đức and Phước Long, out of Region 6, and Bình Long, out of Region 7, to hold the mountain base and build a corridor for the main force.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 222. Made public: 2013. Check: the day; the history gives the formation just after the Rừng Sác zone of May 1966 and before the supply units it names.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966.vietnam-hanoi-3
    when: 1966, mid-year
    date: '1966'
    at: before 1966-05
    thread: vietnam-hanoi
    c: Phước Long. The Bà Rá mountain work team is formed, to build Party and political cells among the hill peoples of Phước Hòa, Phước Tín, Sơn Giang and Tú Hiền communes and Phước Long town and to rouse the people against the Saigon administration.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 145. Made public: 2013. Check: the day; the history says "mid-1966".'
    tags: [polity:drv, vis:only:drv, polity:rvn, ok:fields-place]
  - id: cal.1966.europe-and-the-alliance
    when: 1966, before May
    date: '1966'
    at: before 1966-05
    thread: europe-and-the-alliance
    also: [vietnam-diplomacy]
    c: 'Tito visits Romania, returning Gheorghiu-Dej''s visit of 1963. By Bodnăraş''s account to the Vietnamese, May 7 and 10: Ceaușescu tells him of the delegation going to Vietnam; Tito condemns the American aggression in a speech, the American ambassador upset as he shakes his hand; the communiqué affirms both sides'' solidarity with the Vietnamese people.'
    n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7: ''We recently received Tito''; Note on the Second Restricted Meeting, May 10. See [[cal.1963.europe-and-the-alliance]]. Names: Tito, Gheorghiu-Dej, Ceaușescu. Check: the days of the visit. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:yugoslavia, polity:romania, name:tito-josip-broz, name:gheorghiu-dej-gheorghe, name:ceausescu-nicolae]
  - id: cal.1966.soviet-union
    when: 1966, before May
    date: '1966'
    at: before 1966-05
    thread: soviet-union
    also: [europe-and-the-alliance]
    c: Preparing the July meeting at Bucharest, the Warsaw Pact states' deputy foreign and defense ministers meet; proposals come for supranational bodies to coordinate the socialist states' foreign policy and to direct military affairs, and the Romanians refuse them. Niculescu-Mizil's and Bodnăraş's account to the Vietnamese, May 7 and 9.
    n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, May 7 (Bodnăraş: a Foreign Ministers'' Council, a single command); Note of First Restricted Meeting, May 9 (Niculescu-Mizil: ''Meetings at the level of deputy ministers''). Check: the days and the places. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [ok:fields-place, polity:romania, polity:ussr, vis:from:drv:1966-05-07]
  - id: cal.1966.china
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: china
    also: [vietnam-diplomacy]
    c: The Romanians ask the Chinese for an exchange of views on what they mean to raise with the Vietnamese; the Chinese answer coolly that a talk would be neither useful nor opportune, and the Romanians ask only to fly over China. Maurer's account to Phạm Văn Đồng, Oct. 3, and to Kosygin.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''The response of the Chinese was a little cool''. "[Transcript of Discussions with Representatives of the Chinese People''s Republic and The Communist Party of the Soviet Union on the Return of the Romanian Delegation from Vietnam (Moscow)](https://digitalarchive.umd.edu/document/122584)" (Oct. 5, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, Dosar 129/1966, file 22–32, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''the Chinese comrades said that we have talked enough''. See [[cal.1966-10-01.china]]. Names: Maurer, Phạm Văn Đồng. Check: the days. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:prc, vis:only:romania+prc, vis:from:drv:1966-10-03, name:pham-van-dong]
  - id: cal.1966.europe-and-the-alliance-2
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: europe-and-the-alliance
    also: [vietnam-diplomacy]
    c: 'Maurer, on a visit to Yugoslavia, talks with Tito and Koča Popović: to aid Vietnam and at the same time foretell negotiations in public is to support Johnson''s policy; Tito asks who does so. Maurer''s account to Phạm Văn Đồng, Oct. 3 and 4.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''several months ago, on the occasion of a visit there''; and Oct. 4: ''He asked me: "But who is doing this?"''. Names: Maurer, Tito, Popović, Johnson, Phạm Văn Đồng. Check: the days. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:yugoslavia, name:maurer-ion-gheorghe, name:tito-josip-broz, name:popovic-koca, name:johnson-lyndon-b, vis:only:romania+yugoslavia, vis:from:drv:1966-10-03, name:pham-van-dong]
  - id: cal.1966.europe-and-the-alliance-3
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    place: copenhagen
    thread: europe-and-the-alliance
    also: [vietnam-diplomacy]
    c: Copenhagen. Maurer on a visit to Denmark; in his speech at the banquet he gives, Krag asks why the Vietnamese refuse to talk. Maurer answers him in private, not in public; Krag, by Maurer's account to Phạm Văn Đồng, Oct. 3 and 4, does not spare the Americans, but fears a world war.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''during his speech at the banquet that he offered''. Names: Maurer, Krag, Phạm Văn Đồng. Check: the days. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:denmark, name:maurer-ion-gheorghe, name:krag-jens-otto, name:pham-van-dong]
  - id: cal.1966.europe-and-the-alliance-turkey
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: europe-and-the-alliance-turkey
    also: [vietnam-diplomacy]
    c: 'Maurer talks with Demirel, Turkey''s prime minister, on Vietnam. Demirel: the Americans are tired of the war and see their errors but do not know how to get out; he asks whether the Vietnamese rigidity serves a plan for a world war to hasten Communist takeover. Maurer''s account to Phạm Văn Đồng, Oct. 3.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''Demirel, for instance, said: "I know the Americans very well and they are tired of this."''; on May 7, 1966, Bodnăraş said Maurer had been invited to Turkey; see [[cal.1966.europe-and-the-alliance-turkey-2]]. Names: Maurer, Demirel, Phạm Văn Đồng. Check: the day and the place. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:turkey, name:maurer-ion-gheorghe, name:demirel-suleyman, vis:only:romania+turkey, vis:from:drv:1966-10-03, name:pham-van-dong]
  - id: cal.1966.vietnam-diplomacy
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: vietnam-diplomacy
    c: Maurer, in Switzerland for medical treatment, breakfasts with the President of the Federal Council and several of his friends; he raises Vietnam, and they answer that the Americans have done no more than reply to North Vietnam's aggressions. Maurer's account to Phạm Văn Đồng, Oct. 3.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''invited to breakfast by the president of the Federal Council''. Names: Maurer, Phạm Văn Đồng. Check: the day and the President''s name. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:switzerland, name:maurer-ion-gheorghe, vis:only:romania+switzerland, vis:from:drv:1966-10-03, name:pham-van-dong]
  - id: cal.1966.vietnam-diplomacy-2
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: vietnam-diplomacy
    c: Komócsin, for the Hungarian party, writes the RCP proposing that the Romanian, Bulgarian, Czechoslovak, East German, Polish and Soviet parties meet at Budapest to coordinate aid to Vietnam. Niculescu-Mizil's account to Phạm Văn Đồng, Oct. 3.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Niculescu-Mizil: ''The Hungarians wrote us a letter, signed by Zoltan Komocsin''. See [[cal.1966-05-10.vietnam-diplomacy-3]]. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none. Names: Phạm Văn Đồng.'
    tags: [ok:fields-place, polity:hungary, polity:romania, vis:only:hungary+romania, vis:from:drv:1966-10-03, name:pham-van-dong]
  - id: cal.1966.vietnam-diplomacy-3
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: vietnam-diplomacy
    c: 'The RCP answers the Hungarians by letter: Romania gives and will give aid to Vietnam, but any coordination must start with the Vietnamese and take in all the socialist states that aid them; it sees no such meeting as opportune. Niculescu-Mizil''s account to Phạm Văn Đồng, Oct. 3.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Niculescu-Mizil: ''We responded to them through a letter''. See [[cal.1966.vietnam-diplomacy-2]]. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none. Names: Phạm Văn Đồng.'
    tags: [polity:romania, polity:hungary, vis:only:romania+hungary, vis:from:drv:1966-10-03, name:pham-van-dong]
  - id: cal.1966.vietnam-diplomacy-4
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    place: hanoi
    thread: vietnam-diplomacy
    c: 'Hanoi. János Péter, Hungary''s foreign minister, comes on the American move expected at the UN: he would have the socialist states submit a counter-resolution, and proposes a conference of foreign ministers to hear the DRV''s view. Phạm Văn Đồng and Nguyễn Duy Trinh talk him out of the counter-resolution, by their account to Maurer, Oct. 3.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Đồng: Péter ''came especially for this problem''; Trinh: he ''was in agreement with us''. Names: Péter, Phạm Văn Đồng, Nguyễn Duy Trinh. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:hungary, polity:drv, name:peter-janos, name:pham-van-dong, name:nguyen-duy-trinh, vis:only:hungary+drv, vis:from:romania:1966-10-03]
  - id: cal.1966.china-leadership-35
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: china-leadership
    also: [vietnam-diplomacy]
    c: Liu Shaoqi declares, as Maurer has it, that the Geneva Accords have lost all value. The Chinese, by Phạm Văn Đồng's account to Maurer, Oct. 4, tell the Vietnamese they hold to the Accords and take such liberties for propaganda alone.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer, Oct. 4: ''the Geneva Accords have lost any value''. Names: Liu Shaoqi, Maurer, Phạm Văn Đồng. Check: the day and Liu''s words.'
    tags: [ok:fields-place, polity:prc, name:liu-shaoqi, name:maurer-ion-gheorghe, name:pham-van-dong]
  - id: cal.1966.vietnam-hanoi-4
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: vietnam-hanoi
    also: [vietnam-diplomacy]
    c: 'Phạm Văn Đồng, in a speech at a meeting with a Czechoslovak delegation, sets out three points: the four points reaffirmed, the unconditional end of the bombing and all acts of war against the DRV, and a third, by his account to Maurer, Oct. 3.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Đồng: ''Very recently''; ''a speech at a meeting with a Czech delegation''; the third point ''understandable in and of itself'' Names: Phạm Văn Đồng. Check: the day, and the third point.'
    tags: [polity:drv, name:pham-van-dong]
  - id: cal.1966.vietnam-diplomacy-5
    when: 1966, before June
    date: '1966'
    at: before 1966-06
    thread: vietnam-diplomacy
    c: Ceaușescu, visiting the Argeș region, declares in a speech for the DRV's four points and the Front's five, the end of the American aggression and of the bombing of the North, and the withdrawal of American and allied troops, as Zhou has it at the official talks of June 1966.
    n: '"[Transcript of Official Conversations Between the Romanian Delegation led by Nicolae Ceausescu, and the Party and Government Delegation of the Chinese P.R. led by Zhou Enlai on the Occasion of their Visit to Romania](https://digitalarchive.umd.edu/document/122577)" (June 15, 1966), Document 294 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005), pp. 788–872; ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 87/1966, f. 12–42; 51–144, trans. Larry L. Watts, Wilson Center Digital Archive. Zhou: ''the recent speech of comrade Ceausescu''; the same position, he says, ''jointly expressed and signed'' with a delegation of the Japanese Communist Party. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 294, 788–872). Names: Ceaușescu, Zhou Enlai. Check: the day and the place of the speech.'
    tags: [polity:romania, name:ceausescu-nicolae, name:zhou-enlai]
  - id: cal.1966.vietnam-diplomacy-6
    when: 1966, before June
    date: '1966'
    at: before 1966-06
    thread: vietnam-diplomacy
    also: [soviet-union, china]
    c: The Soviets tell the Vietnamese that the war may end in their victory, but that when the victory is celebrated they will no longer exist, by Zhou's account to the Romanian leaders at the official talks of June 1966.
    n: '"[Transcript of Official Conversations Between the Romanian Delegation led by Nicolae Ceausescu, and the Party and Government Delegation of the Chinese P.R. led by Zhou Enlai on the Occasion of their Visit to Romania](https://digitalarchive.umd.edu/document/122577)" (June 15, 1966), Document 294 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005), pp. 788–872; ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 87/1966, f. 12–42; 51–144, trans. Larry L. Watts, Wilson Center Digital Archive. Zhou: ''Such words cannot only come from the mouths of enemies''. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 294, 788–872). Names: Zhou Enlai. Check: the day, and a Soviet or Vietnamese record.'
    tags: [polity:ussr, polity:drv, name:zhou-enlai, vis:only:ussr+drv, vis:from:prc:1966-06-17, vis:from:romania:1966-06-17]
