    thread: vietnam-diplomacy
    also: [vietnam-hanoi]
    c: The Asian, African and Latin American peoples' solidarity conference meets at Havana. It supports Vietnam and condemns the Americans and the Saigon regime; the DRV's and the Liberation Front's delegations speak and are backed by nearly all.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 297; [[w.lich-su-khang-chien-chong-my]], V, 297–98 (the Havana conference, Jan. 3–15, 1966: the Vietnamese people''s fight called a direct support of the liberation movements of the three continents; solidarity with Vietnam made the central task). Check: the delegations'' speakers and the conference''s resolution; the passage read gives neither.'
