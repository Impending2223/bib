  - id: cal.1966-01-07.vietnam-pause
    when: Jan. 7
    date: '1966-01-07'
    thread: vietnam-pause
    c: 'Fortas to Johnson: a formal note, perhaps to U Thant: withdrawal to begin on a cease-fire and end within, perhaps, three years; no bases in Southeast Asia; a cease-fire on terms a representative group of states accepts. "It is possible that we can deal with the long-range, with future problems, more advantageously if we are out of Viet Nam than if we are there."'
    n: '[FRUS 1964–68, IV, doc. 11](https://history.state.gov/historicaldocuments/frus1964-68v04/d11). [[w.gibbons-u-s-government-and]], IV, 123 n.31. To check: [[w.kalman-abe-fortas]]. Made public: FRUS 1964–68, IV (1998). Names: Fortas, Johnson, U Thant.'
    src:
      c: 1bb90d3b
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d11: all'
        - 'w.gibbons-u-s-government-and IV, 123: A, D'
    tags: [name:fortas-abe, name:johnson-lyndon-b, name:u-thant]
  - id: cal.1966-01-07.vietnam
    when: Jan. 7
    date: '1966-01-07'
    thread: vietnam
    also: [vietnam-pause]
    c: 'Rusk to Lodge, drafted himself, Washington to Saigon 1936, on the peace offensive: Johnson saying to the other side "fish or cut bait"; "if I were a leader in Hanoi and not prepared for peace, I would be a very worried man."'
    n: '[[w.gibbons-u-s-government-and]], IV, 134–35. To check: Washington to Saigon 1936, Jan. 7, 1966, State Department, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 134 n.62). Reply: [[cal.1966-01-08.vietnam]]. Names: Rusk, Lodge, Johnson.'
