    c: 'McNamara, at his own request and without Johnson''s knowledge, with Schlesinger, Galbraith, Kaysen and Goodwin at Schlesinger''s house in Georgetown: a military solution not possible;{1} the aim "withdrawal with honor." By Schlesinger''s journal, he feared that resuming the bombing would put them "on the slippery slide."{2}'
