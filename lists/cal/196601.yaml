    also: [court]
    c: 'Reapportionment at the end of 1965, as the *State Legislatures Progress Reporter* counts it: suits against the apportionment of the legislature in 49 States, Maine alone spared; fifteen legislatures reapportioned on population in both houses, their members seated; 24 more States acting before their next elections; eight legislatures under court order to reapportion.'
