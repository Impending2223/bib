  - id: cal.1966-01-09.china-leadership-3
    when: Jan. 9
    date: '1966-01-09'
    thread: china-leadership
    c: 'Peng Zhen 彭真 speaks to the Public Security Ministry''s 公安部 party group: no spying within the Party, none done; listening devices never, "not in ten thousand years." (The editors'' note: after the Shanghai meeting, at which Lin Biao 林彪 and others charged that Luo Ruiqing 罗瑞卿, Yang Shangkun 杨尚昆 and the security organs had bugged the leaders'' quarters, the Standing Committee had Peng, with provincial secretaries, regional commanders and the ministry, search the leaders'' residences at Peking, Hangzhou, Shanghai and elsewhere; nothing found, reported to the Center under joint signature.)'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 460. Made public: 2012. Names: Peng Zhen, Lin Biao, Luo Ruiqing, Yang Shangkun.'
