  - id: cal.1966-01-02.china-leadership-3
    when: Jan. 2
    date: '1966-01-02'
    place: peking
    thread: china-leadership
    c: 'Peking 北京, the Hebei Hall of the Great Hall of the People. Peng Zhen 彭真 calls over thirty heads of culture and education, the press, the Peking committee and the army to hear Hu Sheng 胡绳 relay Mao''s 毛泽东 talk with Chen Boda 陈伯达 and others at Hangzhou on Dec. 21; to the differing views of Yao Wenyuan''s 姚文元 article: a policy of "letting go," the political question in two months; the criticism only begun, the struggle of ideas long; the wider the discussion the better, no labels, facts and reasoning; for Mao''s call to shorten university study, two departments chosen at Peking 北京大学 and People''s 中国人民大学 universities for three-year half-work, half-study, in the villages or factories.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 458. Made public: 2012. See [[cal.1965-12-21.china-leadership]]. Names: Peng Zhen, Mao Zedong, Chen Boda, Yao Wenyuan, Hu Sheng.'
