    c: 'Gallup, Dec. 11–16, 1965: Johnson''s handling of Vietnam: approve 56 percent, disapprove 26. How long the fighting will last: six months or less 3; a year 16; two years 20; longer than five years 22. Asked of the President most often: why we are fighting, and why we do not step up our effort.'
