    tags: [name:mcnamara-robert-s, name:schlesinger-arthur-m-jr, name:galbraith-john-kenneth, name:kaysen-carl, name:goodwin-richard-n, name:johnson-lyndon-b, city:washington]
  - id: cal.1966-01-07.opinion
    when: Jan. 7
    date: '1966-01-07'
    thread: opinion
    also: [china]
    c: 'Gallup, Dec. 11–16, 1965: Communist China admitted to the UN: should 22 percent, should not 67. College-educated 35 should.'
    n: '[[w.gallup-poll]], III, 1981–82.'
  - id: cal.1966-01-07.vietnam-congress
    when: Jan. 7
    date: '1966-01-07'
    thread: vietnam-congress
    c: 'Dirksen, at a news conference as reported: blockade the North, Haiphong above all; complete military victory before negotiation.'
    n: '*New York Times*, Jan. 8, 1966. [[w.gibbons-u-s-government-and]], IV, 141. Names: Dirksen.'
