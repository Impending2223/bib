    date: '1966-01-08'
    thread: china-leadership
    also: [china]
    c: 'Deng Xiaoping 邓小平 presides at the Secretariat 书记处, which discusses the experience of half-work half-study schools and the reform of full-time higher schools. Deng: the direction of half-work half-study is settled and the pace steady; it need not reach in the Third Plan the number of full-time students, nor be forced; whether the state assigns graduates is a question to watch; the aim is to move toward becoming ordinary laborers, but in thought it is still a great problem and the pace cannot be fast; other reforms start with trials, ''we shall find a road, but there must be models''; engineering courses mostly five years, a few four, none six; medicine need not be so long, a four-year course to be tried in a few schools; the one principle, educational quality and the level of science and technique are not to be lowered; education over the years, with some mistakes, has had gains, and an assessment must be divided into two.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1890 (Jan. 8, 1966). The words: 下午 (III, 1890). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
