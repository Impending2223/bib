  - id: cal.1966.china-leadership-34
    when: 1966, fall
    date: '1966'
    at: before 1966-09-23
    thread: china-leadership
    c: 'The heads of the General Departments and the services in Peking are told to assemble at the Jingxi Hotel 京西賓館, ride in two big cars with the curtains drawn, led by Xiao Hua 蕭華 and Yang Chengwu 楊成武, to Ye Jianying''s 葉劍英 house to see the papers on He Long 賀龍: Zhou had telephoned to stress the matter of surrender to the enemy. Ye: Mao is uneasy about He Long, many have exposed him. A dozen papers lie on the table, statements of He''s subordinates, among them a letter of He''s to an old friend in the Nationalist government. Ye says to tell no one outside; Li Zuopeng 李作鵬 gives the same time, place and men.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 165–166. Made public: 2011. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 884–885 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.18a); *Li Zuopeng huiyilu* 《李作鵬回憶錄》 (Beixin chubanshe 北新出版社, Hong Kong), 566 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.18b); *Li Zuopeng huiyilu* 《李作鵬回憶錄》, 568–569 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 166 n.19). Names: Ye Jianying, He Long, Li Zuopeng, Zhou Enlai. Check: the day; Yang has it after the meeting of [[cal.1966-09-06.china-leadership-2]].'
    src:
      c: a638005f
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 165–166: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 165 n.18a: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 166 n.19: all'
    tags: [polity:prc, vis:only:prc, name:ye-jianying, name:he-long, name:li-zuopeng, name:zhou-enlai, ok:fields-place]
  - id: cal.1966.vietnam-hanoi
    when: 1966, early
    date: '1966'
    at: before 1966-01
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Central Office''s Military Party Committee resolves on building the armed forces in 1966: mend and raise the units held, take in well the new force sent from the North; among the main force stress regiments more than divisions; build up the arms, above all sappers and engineers for the roads; the regional troops and militia raised in quality.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 219. Made public: 2013. Check: the day; the history says "đầu năm 1966".'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966-01.vietnam-hanoi
    when: Jan.
    date: 1966-01
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Region 5 sets up the front command for northern Bình Định: Giáp Văn Cương, commander of the 3d Division, commander; Trần Quang Khanh, Bình Định''s provincial secretary, political commissar.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 104. Made public: 2013. Check: the day.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
