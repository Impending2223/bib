        - 'via w.gibbons-u-s-government-and IV, 185 n.40b: all'
    tags: [name:westmoreland-william, name:porter-william-j, name:lansdale-edward-g]
  - id: cal.1966-01-08.vietnam-operations
    when: Jan. 8
    date: '1966-01-08'
    thread: vietnam-operations
    c: 'Crimp, in the woods on the Saigon River''s west bank opposite the Iron Triangle, in Bình Dương and Hậu Nghĩa: the 173d Airborne Brigade with an Australian battalion, and a brigade of the 1st Infantry Division. Tunnels lead to a deserted headquarters, very likely Military Region 4''s: some 7,500 documents. The 173d and the Australians: 128 Viet Cong counted killed, and possibly 190 more; 23 of their own killed, 102 wounded. The 1st Division''s brigade out Jan. 12.'
    n: '[[w.carland-united-states-army-in]], 169–173. Check: Carland has Crimp launched "the day before" Marauder I ended, the morning of Jan. 8, and the 3d Brigade''s part beginning that morning.'
    tags: [place:operation-crimp, province:binh-duong, province:hau-nghia]
  - id: cal.1966-01-08.vietnam
    when: Jan. 8
    date: '1966-01-08'
    thread: vietnam
    c: 'Lodge to Rusk, Saigon 2446: "If American opinion is steadfast we cannot lose here; and if it is not, we cannot win."'
    n: '[[w.gibbons-u-s-government-and]], IV, 135. To check: Saigon to Washington 2446, Jan. 8, 1966, State Department, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 135 n.63). See [[cal.1966-01-07.vietnam]]. Names: Lodge, Rusk.'
