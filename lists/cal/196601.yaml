    c: 'The Northwest Bureau 西北局 and the Shaanxi 陕西 committee draw up "Material on Comrade Hu Yaobang''s collusion with the anti-Party element Zhao Shouyi and others in anti-Party activity" 〈关于胡耀邦同志和反党分子赵守一等相互勾结进行反党活动的材料〉: Hu, sent to Shaanxi at the end of November 1964, joined with Zhao Shouyi 赵守一 and Li Qiming 李启明, "nails" of Xi Zhongxun''s 习仲勋 anti-Party clique, against socialism, the Bureau and the Center; sixteen "anti-Party crimes," among them Hu''s eight points for reversing the verdict, on which Chen Yuanfang 陈元方, the committee''s secretary-general, and others drafted a report to the Center, Lin Mu''s 林牧 letter to Mao 毛泽东 through Tian Jiaying 田家英 accusing the Bureau, and Hu''s "stealing intelligence"; and Peng (Zhen), Luo (Ruiqing), Lu (Dingyi) and Yang (Shangkun) 彭、罗、陆、杨 backing Hu against the Bureau. It does not mention Hu''s opposition to Liu Shaoqi 刘少奇.'
