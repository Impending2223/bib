    when: Jan. 1
    date: '1966-01-01'
    place: peking
    thread: china-leadership
    also: [latin-america]
    c: 'Zhou receives Asian, African and Latin American youth then visiting Peking: delegations of the African democratic revolutionary youth organization of Guinea, a South Vietnamese youth representative, the youth organization of the Angolan liberation movement, Indonesian youth, the Japan Youth Groups Council, and youth representatives of Brazil, the Dominican Republic, Ecuador and Haiti.'
    n: '[[w.zhou-enlai-waijiao-huodong]], 489 (Jan. 1, 1966; afternoon; Beijing); [[w.zhonghua-renmin-gongheguo-waijiao]], 77 (Jan. 1, 1966; the youth delegations, the Guinean led by Idrissa Traoré, the Japanese by Hayashi Teruo). The book names the Vietnamese 黎风 and the Angolan 阿莱克桑达. Names: Zhou Enlai.'
    src:
