  - id: cal.1966-01-03.opinion
    when: Jan. 3
    date: '1966-01-03'
    thread: opinion
    also: [vietnam-pause]
    c: 'The Harris Survey of late December: a temporary cease-fire, for 73 percent, against 20, not sure 7; a pause in the bombing, for 59, against 33, not sure 8; if the Communists will not negotiate, "all-out U.S. bombings of every part of Vietnam," for 61, against 22, not sure 17.'
    n: '[[w.gibbons-u-s-government-and]], IV, 128. To check: *Washington Post*, Jan. 3, 1966 (cited by [[w.gibbons-u-s-government-and]], IV, 128 n.47).'
    src:
