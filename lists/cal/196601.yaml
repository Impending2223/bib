    when: Jan. 8
    date: '1966-01-08'
    thread: vietnam
    also: [vietnam-pause, vietnam-air-war]
    c: 'The Joint Chiefs to McNamara, JCSM-16-66: the stand-down placing American forces "under serious and progressively increasing military disadvantage"; it "greatly weakens US negotiating leverage." The bombing to be resumed.'
    n: '[FRUS 1964–68, IV, doc. 13](https://history.state.gov/historicaldocuments/frus1964-68v04/d13). [[w.gibbons-u-s-government-and]], IV, 148. Made public: FRUS 1964–68, IV (1998). Names: McNamara.'
