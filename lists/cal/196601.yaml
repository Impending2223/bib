    time_band: workday daytime
    time_zone: America/New_York
    range_basis: kind
  - id: cal.1966-01-02.voting-rights
    when: Jan. 2
    date: '1966-01-02'
    thread: voting-rights
    also: [civil-rights-the-executive, alabama]
    c: 'Mobile, Ala., Emancipation Day. Katzenbach, the first sitting Attorney General to do so, to some 4,500: "a new emancipation" under the Voting Rights Act; suits to come against the intimidation of voters.'
    n: '[[w.branch-at-canaans-edge]], 405. To check: *Mobile Register*, Jan. 2 and 3, 1966, 1 (cited by [[w.branch-at-canaans-edge]], 405). Check: Branch says only "a historic address by the sitting Attorney General." See [[cal.1965-12-28.alabama]]. Names: Katzenbach.'
    src:
      c: d9a4c7d5
      rows:
        - 'w.branch-at-canaans-edge 405: all'
        - 'via w.branch-at-canaans-edge 405 n.historic-address-by: all'
    tags: [name:katzenbach-nicholas]
  - id: cal.1966-01-02.steel
    when: Jan. 2
    date: '1966-01-02'
    thread: steel
    c: 'Johnson''s telegram to Martin and the heads of the seven other largest steel companies: "put the interest of your country first." Califano and Ackley''s background briefing, 2:15 p.m., as "high administration officials": Bethlehem''s people "do leave themselves open to the charge of profiteering."'
    n: '[[w.califano-triumph-and-tragedy-of]], 104. To check: Johnson to the steel executives, Jan. 2, 1966, and the Califano and Ackley backgrounder, Jan. 2, 1966, 6, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 104 nn.60, 62). Names: Johnson, Califano, Ackley.'
    src:
      c: 97d727cb
      rows:
        - 'w.califano-triumph-and-tragedy-of 104: all'
        - 'via w.califano-triumph-and-tragedy-of 104 n.60: A'
        - 'via w.califano-triumph-and-tragedy-of 104 n.62: B'
    tags: [name:johnson-lyndon-b, name:califano-joseph-a-jr, name:ackley-gardner]
  - id: cal.1966-01-03.vietnam
    when: Jan. 3–5
    date: '1966-01-03'
    thread: vietnam-diplomacy
    c: 'The fourteen points, Rusk''s paper of Dec. 27, given to the press by Humphrey on his return: the Geneva agreements of 1954 and 1962 "an adequate basis for peace"; a conference, or "unconditional discussions," welcome; Hanoi''s four points open to discussion; no American bases; no troops kept "after peace is assured"; the Viet Cong''s representation no "insurmountable problem"; the bombing could stop "as a step toward peace." Jan. 4, Goldberg''s letter to U Thant. Jan. 5, Humphrey reports his trip to the NSC.'
    n: 'FRUS 1964–68, III, doc. [247](https://history.state.gov/historicaldocuments/frus1964-68v03/d247); IV, docs. [2](https://history.state.gov/historicaldocuments/frus1964-68v04/d2), [3](https://history.state.gov/historicaldocuments/frus1964-68v04/d3), [7](https://history.state.gov/historicaldocuments/frus1964-68v04/d7). The points: [[w.department-of-state-bulletin]], [Feb. 14, 1966, 225](https://archive.org/details/departmentofstat541966unit/page/225/mode/1up) (the Department''s press release 4, Jan. 7). [[w.current-documents-1966]], 740–746; [[w.gibbons-u-s-government-and]], IV, 130–31, 133 (the fourteen points; Humphrey to the NSC, 133). See [[cal.1965-12-24.vietnam]]; [[cal.1965-12-28.vietnam]]. Gibbons has Rusk offering the fourteen points at a news conference Dec. 29 (IV, 130, citing the *Bulletin* of Jan. 17 and Feb. 14, 1966); the issue of Jan. 17 prints, at 86, Rusk on Canadian television, released Dec. 30, and that of Feb. 14 the points as the Department''s release of Jan. 7. Names: Rusk, Humphrey, Goldberg, U Thant.'
    src:
      c: c8f093f4
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d247: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d2: all'
        - 'https://archive.org/details/departmentofstat541966unit/page/225/mode/1up: A-G'
        - 'w.current-documents-1966 740–746: all'
        - 'w.gibbons-u-s-government-and IV, 130–31: A-G'
        - 'w.gibbons-u-s-government-and IV, 133: I'
    tags: [name:rusk-dean, name:humphrey-hubert-h, name:goldberg-arthur-j, name:u-thant]
  - id: cal.1966-01-03.civil-rights-organizations
    when: Jan. 3
    date: '1966-01-03'
    thread: civil-rights-organizations
    c: CORE names McKissick national director, to succeed Farmer, who goes to a national literacy program. McKissick in office Mar. 1. Check the date.
    n: '*Daily Tar Heel*, [Mar. 2, 1966](https://newspapers.digitalnc.org/lccn/sn92073228/1966-03-02/ed-1/seq-2/) (AP). To check: [[w.meier-core]]. See [[cal.1965-07-01.civil-rights-organizations]]. Names: Farmer, McKissick.'
    tags: [name:farmer-james, name:mckissick-floyd-b]
  - id: cal.1966-01-03.vietnam-pause
    when: Jan. 3
    date: '1966-01-03'
    time: 1966-01-03T17:55Z
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Ball, Moyers and Valenti, 12:55 to 2:35 p.m.: all 113 governments approached, nothing yet from Hanoi; the pause to go on several more days. Bundy: "For the first time we have made headway with the *New York Times*." Ball: the pause disarming the critics in Congress; McCormack, Hickenlooper and Bolton content to let it run; Ball has seen Mansfield, Dirksen and Fulbright. Johnson: "This will be a bad week, a bad month."'
    n: '[FRUS 1964–68, IV, doc. 3](https://history.state.gov/historicaldocuments/frus1964-68v04/d3) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 133. Made public: FRUS 1964–68, IV (1998). See [[cal.1965-12-30.vietnam-congress]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, Moyers, Valenti, McCormack, Hickenlooper, Bolton, Mansfield, Dirksen, Fulbright.'
    src:
      c: 4cd5353f
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d3: all'
        - 'w.gibbons-u-s-government-and IV, 133: all'
        - 'via w.gibbons-u-s-government-and IV, 133 n.58: all'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:ball-george-w, name:moyers-bill, name:valenti-jack, name:mccormack-john-w, name:hickenlooper-bourke-b, name:bolton-frances-p, name:mansfield-mike, name:dirksen-everett, name:fulbright-j-william]
  - id: cal.1966-01-03.laos
    when: Jan. 3
    date: '1966-01-03'
    thread: laos
    also: [vietnam]
    c: 'Sullivan from Vientiane to William Bundy, 703: Tiger Hound set up at his suggestion. Of Shining Brass, the cross-border teams: "essentially an Eagle Scout program devised by some extremely well motivated and brave young men"; "except for Max Taylor, nobody in the U.S. military establishment has ever seemed willing to tell them that the program is not militarily worth the price."'
    n: '[FRUS 1964–68, XXVIII, doc. 216](https://history.state.gov/historicaldocuments/frus1964-68v28/d216). [[w.gibbons-u-s-government-and]], IV, 192 (Shining Brass). Made public: FRUS 1964–68, XXVIII (1998). See [[cal.1965-12-06.laos]]. Names: Sullivan, William Bundy, Taylor.'
    src:
      c: dcc1be64
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d216: all'
        - 'w.gibbons-u-s-government-and IV, 192: B'
        - 'via w.gibbons-u-s-government-and IV, 192 n.67: B'
    tags: [name:sullivan-william-h, name:bundy-william, name:taylor-maxwell]
