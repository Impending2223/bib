  - id: cal.1966-01-05.china-leadership
    when: Jan. 5
    date: '1966-01-05'
    place: nanchang
    thread: china-leadership
    c: 'Mao, Nanchang. Talks with Yang Shangkui, Fang Zhichun, Liu Junxiu and other Jiangxi leaders, Wang Dongxing present. On Luo Ruiqing: proud, sharp; offered a provincial post he refused; no longer fit for army work. The Party splits in two and survives; even a leader going bad is no cause for fear. On farming: go steady; buy no grain beyond the surplus; look into the petty levies, Fujian''s among them; Jiangxi to investigate and report to the Center.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1966. [[w.mao-zedong-zhuan]], VI, ch. 74 n.23 (Mao to Yang Shangkui 杨尚奎 and Fang Zhichun 方志纯 of Jiangxi, soon after the Shanghai meeting of Dec. 1965, the day by the note; place not given; on Luo Ruiqing 罗瑞卿: proud and sharp; once told to take a governorship in a province, he would not; army work no longer possible, a transfer to local work, not necessarily Jiangxi; the book adds that Luo was not yet to be wholly overthrown). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 74). Check: [[w.mao-zedong-zhuan]], VI, ch. 74 has Mao come to Wuhan from Hangzhou on Jan. 5 (at its account of the Wuhan report of Feb. 8); its note dates the talk with the Jiangxi leaders Jan. 5 (n.23). To check: Mao Zedong 毛泽东, talk with Yang Shangkui 杨尚奎, Fang Zhichun 方志纯 and others, Jan. 5, 1966 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.23). Names: Mao Zedong, Luo Ruiqing, Yang Shangkui, Fang Zhichun, Liu Junxiu, Bai Dongcai, Huang Zhizhen, Wang Dongxing.'
    src:
