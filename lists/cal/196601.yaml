    when: Jan. 4
    date: '1966-01-04'
    thread: states-and-cities
    c: Reagan announces for governor of California, on television. Check the date. Fifteen stations, Redding to San Diego.
    n: 'To check: [[w.dallek-right-moment]]. [[w.hess-republican-establishment]], 254 (the day; fifteen stations). Names: Reagan.'
    src:
      c: '18269662'
      rows:
        - 'w.hess-republican-establishment 254: all'
    tags: [name:reagan-ronald]
  - id: cal.1966-01-04.jobs-and-wages-transit
    when: Jan. 4
    date: '1966-01-04'
    thread: jobs-and-wages-transit
    also: [states-and-cities]
    c: New York. Quill and other leaders of the Transport Workers Union jailed for contempt of the injunction; Quill taken to Bellevue, ill.
    n: '[*New York Times*, Jan. 5, 1966](https://timesmachine.nytimes.com/timesmachine/1966/01/05/issue.html). See [[cal.1966-01-01.jobs-and-wages]]. Names: Quill.'
    tags: [name:quill-michael-j, state:ny, city:nyc]
  - id: cal.1966-01-04.vietnam-congress
    when: Jan. 4
    date: '1966-01-04'
    thread: vietnam-congress
    also: [laos]
    c: 'Udorn, Thailand. Symington, at his own asking, alone with Sullivan: the bombing of the trails in Laos, 274 sorties for the day, "shocking waste of air power"; Sullivan: no interdiction, at best harassment. Symington would strike the North''s fuel, power, Haiphong, dams and levees, which "everybody else" on his trip tells him would take it out of the war; Sullivan doubts it. McGeorge Bundy to Johnson: talk to Symington before he says it in public.'
    n: '[FRUS 1964–68, XXVIII, doc. 217](https://history.state.gov/historicaldocuments/frus1964-68v28/d217) (Sullivan, Jan. 5). [[w.gibbons-u-s-government-and]], IV, 142 n.86. Made public: FRUS 1964–68, XXVIII (1998). Names: Symington, Sullivan, McGeorge Bundy, Johnson.'
    src:
      c: 724cb6ad
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d217: all'
        - 'w.gibbons-u-s-government-and IV, 142: B-F'
        - 'via w.gibbons-u-s-government-and IV, 142 n.86b: B-E'
        - 'via w.gibbons-u-s-government-and IV, 142 n.86c: F'
    tags: [name:symington-william-s, name:sullivan-william-h, name:bundy-mcgeorge, name:johnson-lyndon-b]
  - id: cal.1966-01-04.vietnam
    when: Jan. 4
    date: '1966-01-04'
    thread: vietnam
    c: 'Lodge to Rusk, Saigon 2376: no good from a conference in absentia, nor from the ICC nations or a new Geneva conference; any talks between North and South, the United States joining on its own presence. "Much of this talk of negotiations reminds me of a man with smallpox trying to cure it by putting coldcream on his face"; the Communists to be punished in the North, beaten in the field and rooted out first.'
    n: '[[w.gibbons-u-s-government-and]], IV, 131 n.55. See [[cal.1966-01-02.vietnam]]. Names: Lodge, Rusk.'
    src:
      c: c8272eac
      rows:
        - 'w.gibbons-u-s-government-and IV, 131: all'
        - 'via w.gibbons-u-s-government-and IV, 131 n.55b: all'
    tags: [name:lodge-henry-cabot, name:rusk-dean]
  - id: cal.1966-01-05.legislatures-tx
    when: Jan. 5
    date: '1966-01-05'
    thread: legislatures
    c: 'The three-judge court upholds Texas''s 1965 congressional districting act, H.B. 67, as a good-faith effort: districts up to 9.7 percent above and below the ideal of 416,508. Jurisdiction kept.'
    n: '*Bush v. Martin*, [251 F. Supp. 484](https://static.case.law/f-supp/251/case-pdfs/0484-01.pdf) (S.D. Tex. 1966); Brown for the court. See [[cal.1964-03-02.legislatures-tx]]. Names: Bush.'
    tags: [state:tx, name:bush-george-h-w]
  - id: cal.1966-01-05.vietnam
    when: Jan. 5
    date: '1966-01-05'
    thread: vietnam
    also: [vietnam-pause]
    c: 'Lodge''s weekly telegram to Johnson, Saigon 2399: the pause hurting South Vietnam, the bombing to be resumed. The public to be taught that "this Chinese Communist Imperialism" is "something with which we are going to have to live year in and year out"; then "it will stand casualties better."'
    n: '[FRUS 1964–68, IV, doc. 6](https://history.state.gov/historicaldocuments/frus1964-68v04/d6). [[w.gibbons-u-s-government-and]], IV, 134. Made public: FRUS 1964–68, IV (1998). Names: Lodge, Johnson.'
    src:
      c: e4895b6c
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d6: all'
        - 'w.gibbons-u-s-government-and IV, 134: all'
        - 'via w.gibbons-u-s-government-and IV, 134 n.60: all'
    tags: [name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1966-01-06.students
    when: Jan. 6
    date: '1966-01-06'
    thread: students
    also: [vietnam, states-and-cities, civil-rights-organizations, georgia]
    c: 'SNCC against the war: the government "deceptive in its claims of concern for freedom of the Vietnamese people"; the murder of Samuel Younge at Tuskegee, Ala., "no different than the murder of peasants in Viet Nam"; support for men "unwilling to respond to a military draft." Bond, its communications director, elected to the Georgia House in June, endorses it.'
    n: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966), which gives the statement (K–J Cong. II.J.1). [[w.gibbons-u-s-government-and]], IV, 168 (the statement; Bond refused his seat, 184–12). To check: [[w.carson-in-struggle]]; *New York Times*, Jan. 7, 9 and 11, 1966 (cited by [[w.gibbons-u-s-government-and]], IV, 168 n.163). See [[cal.1965-11-27.students]]. Names: Bond, Younge.'
    src:
      c: 0f21051a
      rows:
        - 'https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf: all'
        - 'w.gibbons-u-s-government-and IV, 168: C-D'
        - 'via w.gibbons-u-s-government-and IV, 168 n.163: D'
    tags: [name:bond-julian, name:younge-samuel-jr]
  - id: cal.1966-01-06.vietnam
    when: Jan. 6
    date: '1966-01-06'
    thread: vietnam
    c: 'McNamara, at his own request and without Johnson''s knowledge, with Schlesinger, Galbraith, Kaysen and Goodwin at Schlesinger''s house in Georgetown: a military solution not possible; the aim "withdrawal with honor." By Schlesinger''s journal, he feared that resuming the bombing would put them "on the slippery slide."'
    n: '[[w.gibbons-u-s-government-and]], IV, 108; [[w.schlesinger-robert-kennedy-and-his]], 734 (the dinner, at McNamara''s request; his words; the journal). Made public: [[w.schlesinger-robert-kennedy-and-his]] (1978). See [[cal.1965-12-07.vietnam]]. Names: McNamara, Schlesinger, Galbraith, Kaysen, Goodwin, Johnson.'
    src:
      c: 96a8bfb5
      rows:
