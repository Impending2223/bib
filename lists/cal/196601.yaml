    date: 1966-01
    at: before 1966-01-21
    thread: china-leadership
    c: Peng Zhen 彭真, with Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, reads the State Council's 国务院 finance and trade office's report, sent by Li Xiannian 李先念, on spreading Tangshan's 唐山 way of organizing the circulation of goods by economic region (forwarded by the Center and State Council on Jan. 30).
    n: '[[w.peng-zhen-nianpu-1902]], IV, 464. Made public: 2012. Names: Peng Zhen, Zhou Enlai, Deng Xiaoping, Li Xiannian.'
