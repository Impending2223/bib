  - id: cal.1966-01.china-leadership-8
    when: Jan., the Spring Festival
    date: 1966-01
    at: before 1966-01-21
    thread: china-leadership
    c: 'Peng Zhen 彭真 talks with Wang Congwu 王从吾, Li Yunchang 李运昌 and Ma Guorui 马国瑞 on the Central Control Commission''s 中央监委 work: take up big questions, the line, class struggle; see people whole; strict in criticizing thought, lenient in organizational measures, Mao''s 毛泽东 view; leave room in punishing; doubtful material kept out of the files, he learned at Yan''an and has examined himself for it many times; mass meetings leave the accused no defense, an appeal allowed a criminal and to be allowed a Party member under the constitution; dismissals without the superior''s approval against the constitution.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 464. Made public: 2012. Names: Peng Zhen, Mao Zedong, Wang Congwu, Li Yunchang.'
