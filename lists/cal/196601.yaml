    date: '1966'
    at: before 1966-10
    place: copenhagen
    thread: europe-and-the-alliance
    also: [vietnam-diplomacy]
    c: Copenhagen. Maurer on a visit to Denmark; in his speech at the banquet he gives, Krag asks why the Vietnamese refuse to talk. Maurer answers him in private, not in public; Krag, by Maurer's account to Phạm Văn Đồng, Oct. 3 and 4, does not spare the Americans, but fears a world war.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''during his speech at the banquet that he offered''. Names: Maurer, Krag. Check: the days. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:denmark, name:maurer-ion-gheorghe, name:krag-jens-otto]
  - id: cal.1966.europe-and-the-alliance-turkey
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: europe-and-the-alliance-turkey
    also: [vietnam-diplomacy]
    c: 'Maurer talks with Demirel, Turkey''s prime minister, on Vietnam. Demirel: the Americans are tired of the war and see their errors but do not know how to get out; he asks whether the Vietnamese rigidity serves a plan for a world war to hasten Communist takeover. Maurer''s account to Phạm Văn Đồng, Oct. 3.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''Demirel, for instance, said: "I know the Americans very well and they are tired of this."''; on May 7, 1966, Bodnăraş said Maurer had been invited to Turkey; see [[cal.1966.europe-and-the-alliance-turkey-2]]. Names: Maurer, Demirel. Check: the day and the place. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:turkey, name:maurer-ion-gheorghe, name:demirel-suleyman, vis:only:romania+turkey, vis:from:drv:1966-10-03]
  - id: cal.1966.vietnam-diplomacy
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: vietnam-diplomacy
    c: Maurer, in Switzerland for medical treatment, breakfasts with the President of the Federal Council and several of his friends; he raises Vietnam, and they answer that the Americans have done no more than reply to North Vietnam's aggressions. Maurer's account to Phạm Văn Đồng, Oct. 3.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer: ''invited to breakfast by the president of the Federal Council''. Names: Maurer. Check: the day and the President''s name. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:switzerland, name:maurer-ion-gheorghe, vis:only:romania+switzerland, vis:from:drv:1966-10-03]
  - id: cal.1966.vietnam-diplomacy-2
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: vietnam-diplomacy
    c: Komócsin, for the Hungarian party, writes the RCP proposing that the Romanian, Bulgarian, Czechoslovak, East German, Polish and Soviet parties meet at Budapest to coordinate aid to Vietnam. Niculescu-Mizil's account to Phạm Văn Đồng, Oct. 3.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Niculescu-Mizil: ''The Hungarians wrote us a letter, signed by Zoltan Komocsin''. See [[cal.1966-05-10.vietnam-diplomacy-3]]. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [ok:fields-place, polity:hungary, polity:romania, vis:only:hungary+romania, vis:from:drv:1966-10-03]
  - id: cal.1966.vietnam-diplomacy-3
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: vietnam-diplomacy
    c: 'The RCP answers the Hungarians by letter: Romania gives and will give aid to Vietnam, but any coordination must start with the Vietnamese and take in all the socialist states that aid them; it sees no such meeting as opportune. Niculescu-Mizil''s account to Phạm Văn Đồng, Oct. 3.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Niculescu-Mizil: ''We responded to them through a letter''. See [[cal.1966.vietnam-diplomacy-2]]. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:hungary, vis:only:romania+hungary, vis:from:drv:1966-10-03]
  - id: cal.1966.vietnam-diplomacy-4
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    place: hanoi
    thread: vietnam-diplomacy
    c: 'Hanoi. János Péter, Hungary''s foreign minister, comes on the American move expected at the UN: he would have the socialist states submit a counter-resolution, and proposes a conference of foreign ministers to hear the DRV''s view. Phạm Văn Đồng and Nguyễn Duy Trinh talk him out of the counter-resolution, by their account to Maurer, Oct. 3.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Đồng: Péter ''came especially for this problem''; Trinh: he ''was in agreement with us''. Names: Péter, Phạm Văn Đồng, Nguyễn Duy Trinh. Check: the day. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:hungary, polity:drv, name:peter-janos, name:pham-van-dong, name:nguyen-duy-trinh, vis:only:hungary+drv, vis:from:romania:1966-10-03]
  - id: cal.1966.china-leadership-35
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: china-leadership
    also: [vietnam-diplomacy]
    c: Liu Shaoqi declares, as Maurer has it, that the Geneva Accords have lost all value. The Chinese, by Phạm Văn Đồng's account to Maurer, Oct. 4, tell the Vietnamese they hold to the Accords and take such liberties for propaganda alone.
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer, Oct. 4: ''the Geneva Accords have lost any value''. Names: Liu Shaoqi, Maurer, Phạm Văn Đồng. Check: the day and Liu''s words.'
    tags: [ok:fields-place, polity:prc, name:liu-shaoqi, name:maurer-ion-gheorghe, name:pham-van-dong]
  - id: cal.1966.vietnam-hanoi-4
    when: 1966, before October
    date: '1966'
    at: before 1966-10
    thread: vietnam-hanoi
    also: [vietnam-diplomacy]
    c: 'Phạm Văn Đồng, in a speech at a meeting with a Czechoslovak delegation, sets out three points: the four points reaffirmed, the unconditional end of the bombing and all acts of war against the DRV, and a third, by his account to Maurer, Oct. 3.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Đồng: ''Very recently''; ''a speech at a meeting with a Czech delegation''; the third point ''understandable in and of itself'' Names: Phạm Văn Đồng. Check: the day, and the third point.'
    tags: [polity:drv, name:pham-van-dong]
  - id: cal.1966.vietnam-diplomacy-5
    when: 1966, before June
    date: '1966'
    at: before 1966-06
    thread: vietnam-diplomacy
    c: Ceaușescu, visiting the Argeș region, declares in a speech for the DRV's four points and the Front's five, the end of the American aggression and of the bombing of the North, and the withdrawal of American and allied troops, as Zhou has it at the official talks of June 1966.
    n: '"[Transcript of Official Conversations Between the Romanian Delegation led by Nicolae Ceausescu, and the Party and Government Delegation of the Chinese P.R. led by Zhou Enlai on the Occasion of their Visit to Romania](https://digitalarchive.umd.edu/document/122577)" (June 15, 1966), Document 294 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005), pp. 788–872; ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 87/1966, f. 12–42; 51–144, trans. Larry L. Watts, Wilson Center Digital Archive. Zhou: ''the recent speech of comrade Ceausescu''; the same position, he says, ''jointly expressed and signed'' with a delegation of the Japanese Communist Party. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 294, 788–872). Names: Ceaușescu, Zhou Enlai. Check: the day and the place of the speech.'
    tags: [polity:romania, name:ceausescu-nicolae, name:zhou-enlai]
  - id: cal.1966.vietnam-diplomacy-6
    when: 1966, before June
    date: '1966'
    at: before 1966-06
    thread: vietnam-diplomacy
    also: [soviet-union, china]
    c: The Soviets tell the Vietnamese that the war may end in their victory, but that when the victory is celebrated they will no longer exist, by Zhou's account to the Romanian leaders at the official talks of June 1966.
    n: '"[Transcript of Official Conversations Between the Romanian Delegation led by Nicolae Ceausescu, and the Party and Government Delegation of the Chinese P.R. led by Zhou Enlai on the Occasion of their Visit to Romania](https://digitalarchive.umd.edu/document/122577)" (June 15, 1966), Document 294 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005), pp. 788–872; ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 87/1966, f. 12–42; 51–144, trans. Larry L. Watts, Wilson Center Digital Archive. Zhou: ''Such words cannot only come from the mouths of enemies''. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 294, 788–872). Names: Zhou Enlai. Check: the day, and a Soviet or Vietnamese record.'
    tags: [polity:ussr, polity:drv, name:zhou-enlai, vis:only:ussr+drv, vis:from:prc:1966-06-17, vis:from:romania:1966-06-17]
