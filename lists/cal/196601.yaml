  - id: cal.1966-01-03.vietnam-diplomacy-2
    when: Jan. 3
    date: '1966-01-03'
    thread: vietnam-diplomacy
    also: [vietnam-hanoi]
    c: 'Lê Thanh Nghị, DRV Vice-Premier, tells Ceaușescu and Maurer that the DRV will strike back in the South, answer the bombing of the North and press the political and diplomatic struggle abroad, where he asks the Soviet Union and the other socialist countries for their part. Ceaușescu fears public polemics may start again; Nghị shares the worry. Ceaușescu on the Americans'' peace talk: it must be unmasked.'
