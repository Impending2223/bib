    when: Jan. 9
    date: '1966-01-09'
    place: peking
    thread: china-leadership
    c: Peking 北京. Peng Zhen 彭真, with Zhou Enlai 周恩来, Zhu De 朱德, Deng Xiaoping 邓小平 and others, receives those at meetings of the PLA, the public security forces, the ministries of Agriculture, Building Materials, Building, Chemical Industry and Higher Education, and the Jinan forces' Vanguard song and dance troupe.
    n: '[[w.peng-zhen-nianpu-1902]], IV, 460; [[w.liu-jixian-ye-jianying-nianpu]], II, 934 (Jan. 9, 1966; Ye Jianying 叶剑英 with Zhou Enlai 周恩来, Zhu De 朱德, Deng Xiaoping 邓小平 and others at the reception); [[w.zhu-de-nianpu-xinbian]], III, 1946 (Jan. 9, 1966; Zhu De 朱德, with Zhou Enlai 周恩来, Deng Xiaoping 邓小平, Peng Zhen 彭真, Li Fuchun 李富春, Li Xiannian 李先念, Tan Zhenlin 谭震林, Lu Dingyi 陆定一, Bo Yibo 薄一波, Ye Jianying 叶剑英 and others, receives all those at the meetings in Peking of the PLA 中国人民解放军, the Chinese People''s Public Security Forces 中国人民公安部队, the Ministries of Agriculture, Building Materials, Building, the Chemical Industry and Higher Education 农业部、建筑材料工业部、建筑工程部、化学工业部、高等教育部, and the Vanguard troupe 前卫文工团 of the Jinan forces 济南部队 come to Peking to perform). The words: 下午 (IV, 460). Names: Peng Zhen, Zhou Enlai, Zhu De, Deng Xiaoping.'
