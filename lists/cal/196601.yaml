    when: '1966'
    date: '1966'
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: The Central Office forms Region 10 of Quảng Đức and Phước Long, out of Region 6, and Bình Long, out of Region 7, to hold the mountain base and build a corridor for the main force.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 222. Made public: 2013. Check: the day; the history gives the formation just after the Rừng Sác zone of May 1966 and before the supply units it names.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966.vietnam-hanoi-3
    when: 1966, mid-year
    date: '1966'
    at: before 1966-05
    thread: vietnam-hanoi
    c: Phước Long. The Bà Rá mountain work team is formed, to build Party and political cells among the hill peoples of Phước Hòa, Phước Tín, Sơn Giang and Tú Hiền communes and Phước Long town and to rouse the people against the Saigon administration.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 145. Made public: 2013. Check: the day; the history says "mid-1966".'
