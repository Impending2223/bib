    when: Jan. 8–11
    date: '1966-01-08'
    thread: vietnam
    c: 'Airlie House, Warrenton, Va.: the Washington agencies with Porter, Lansdale and others from Saigon on pacification, Unger and Porter in the chair. The war grave, several years'' more fighting; the Kỳ government "fragile," failing its "revolutionary" billing. The four national priority areas; one management of the Mission''s pacification effort; pressure on the government where needed, "our already questionable chances of success" otherwise reduced.'
