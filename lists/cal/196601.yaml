    thread: china-leadership
    c: Qiu Huizuo 邱會作, the four generals' chief target among the army's rebel groups backed by the Cultural Revolution Group, is protected by Lin Biao 林彪, Zhou Enlai 周恩来, Xu Xiangqian 徐向前 and Chen Boda 陈伯达.
    n: '[[w.teiwes-tragedy-of-lin-biao]], 42 (Lin''s help allegedly delayed to let the pressure build). Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 379–380 (cited by [[w.teiwes-tragedy-of-lin-biao]], 42 n.83a); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXV, 250 (cited by [[w.teiwes-tragedy-of-lin-biao]], 42 n.83b); [[w.huang-zheng-zai-lishi-de-danganli]], 31 (cited by [[w.teiwes-tragedy-of-lin-biao]], 42 n.83c). Names: Qiu Huizuo, Lin Biao, Zhou Enlai, Xu Xiangqian, Chen Boda.'
