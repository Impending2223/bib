    thread: alabama
    also: [civil-rights-organizations]
    c: Tuskegee. Samuel Younge Jr., of SNCC, shot dead near midnight at a gas station, after a quarrel with Marvin Segrest, the attendant, over its white restroom. That day Younge had escorted Negroes to register.
    n: '[[w.branch-at-canaans-edge]], 405–06. To check: [*New York Times*, Jan. 5, 1966](https://timesmachine.nytimes.com/timesmachine/1966/01/05/issue.html), 12 (cited by [[w.branch-at-canaans-edge]], 406). See [[cal.1965-12-28.alabama]]. Names: Younge.'
