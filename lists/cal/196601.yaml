  - id: cal.1966-01-01.jobs-and-wages
    when: Jan. 1
    date: '1966-01-01'
    thread: jobs-and-wages-transit
    also: [states-and-cities]
    c: 'New York. Lindsay sworn as mayor; the Transport Workers Union strikes the subways and buses the same morning. Quill, its president, defies an injunction under the Condon-Wadlin Act: "The judge can drop dead in his black robes."'
    n: '[*New York Times*, Jan. 2, 1966](https://timesmachine.nytimes.com/timesmachine/1966/01/02/issue.html). [[w.smith-on-his-own-terms]], 476 (the walkout at midnight on New Year''s Eve, as Lindsay takes office; Quill tears up the court order). To check: [[w.cannato-ungovernable-city]]; [[w.freeman-in-transit]]. See [[cal.1965-11-02.states-and-cities]]. Names: Lindsay, Quill.'
    src:
      c: 0b79fc3a
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1966/01/02/issue.html: all'
        - 'w.smith-on-his-own-terms 476: B-C'
    tags: [name:lindsay-john-v, name:quill-michael-j, state:ny, city:nyc]
    short: New York's transit strike
  - id: cal.1966-01-01.steel
    when: Jan. 1
    date: '1966-01-01'
    thread: steel
    c: 'Johnson to Califano at 7 a.m.: "What''s happening with steel?" Martin, Bethlehem''s chairman, in Ackley''s office that afternoon, gives no ground. Johnson: the government not to buy "one Goddamn ounce" of steel from any company that raised its price. By Califano''s account.'
    n: '[[w.califano-triumph-and-tragedy-of]], 103–04. Check: whose 7 a.m., the Ranch''s or Washington''s (the range covers both). To check: Califano to Johnson, Jan. 1, 1966, 10 p.m., LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 104 n.59). See [[cal.1965-12-31.steel]]. Names: Johnson, Califano, Ackley.'
    src:
      c: ff4a594d
      rows:
        - 'w.califano-triumph-and-tragedy-of 103–04: all'
        - 'via w.califano-triumph-and-tragedy-of 104 n.59: all'
    tags: [name:johnson-lyndon-b, name:califano-joseph-a-jr, name:ackley-gardner]
    time_range:
      - 1966-01-01T12:00Z
      - 1966-01-01T13:00Z
  - id: cal.1966-01-02.vietnam
    when: Jan. 2
    date: '1966-01-02'
    thread: vietnam-diplomacy
    c: 'Rusk to Lodge, drafted himself, Washington to Saigon 1865: the heart of the problem "Hanoi''s determination to grab South Viet-Nam by force"; "not too much interested in shadow boxing on side issues." Tempted, should talks come, by "a conference in absentia," the two co-chairmen alone at the table.'
    n: '[[w.gibbons-u-s-government-and]], IV, 131 n.55. Check: Gibbons dates the cable Jan. 1 and Jan. 2. Reply: [[cal.1966-01-04.vietnam]]. Names: Rusk, Lodge.'
    src:
      c: 0c845522
      rows:
        - 'w.gibbons-u-s-government-and IV, 131: all'
        - 'via w.gibbons-u-s-government-and IV, 131 n.55a: all'
    tags: [name:rusk-dean, name:lodge-henry-cabot]
    time_range:
