    c: 'Crimp, in the woods on the Saigon River''s west bank opposite the Iron Triangle, in Bình Dương and Hậu Nghĩa: the 173d Airborne Brigade with an Australian battalion, and a brigade of the 1st Infantry Division.{1} Tunnels lead to a deserted headquarters, very likely Military Region 4''s: some 7,500 documents. The 173d and the Australians: 128 Viet Cong counted killed, and possibly 190 more; 23 of their own killed, 102 wounded. The 1st Division''s brigade out Jan. 12.{2}'
    n: '[[w.carland-united-states-army-in]], 169–173; [[w.lich-su-khang-chien-chong-my]], IV, 86–88 (Củ Chi, Jan. 8–19: the history''s account of the 12-day sweep). Check: Carland has Crimp launched "the day before" Marauder I ended, the morning of Jan. 8, and the 3d Brigade''s part beginning that morning.'
    src:
      c: e6af5893
      rows:
        - 'w.carland-united-states-army-in 169–173: 1, 2'
        - 'w.lich-su-khang-chien-chong-my IV, 86–88: 1'
    tags: [place:operation-crimp, province:binh-duong, province:hau-nghia]
    short: Crimp
    variants:
      - unit: '1'
        witness: w.lich-su-khang-chien-chong-my
        reads: 'twelve days of fighting at Củ Chi, Jan. 8–19, against the 1st Division''s brigades and the 173d Airborne: 200 actions, nearly 1,000 Americans and Saigon troops killed or wounded, 84 aircraft shot down (most of them UH-1s), 77 vehicles destroyed or damaged (56 M113s), two 105 mm guns; the sweep ended Jan. 19, the brigades moved to Đồng Dù'
        at: IV, 86–88
