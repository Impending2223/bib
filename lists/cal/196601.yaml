        - 'via w.gibbons-u-s-government-and IV, 134 n.62: all'
    tags: [name:rusk-dean, name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1966-01-07.vietnam-2
    when: Jan. 7
    date: '1966-01-07'
    thread: vietnam
    c: 'Rusk to Lodge, Washington to Saigon 1935, "Literally Eyes Only for the Ambassador," drafted himself: the additions to the defense budget for Vietnam over the next 18 months some $120,000 a Viet Cong; aid to Greece $50,000 a guerrilla. "Does the prospect of $120,000 per guerrilla suggest any new lines of thinking about techniques in getting at the fellows? At that rate, they could enjoy the Riviera for many years."'
    n: '[[w.gibbons-u-s-government-and]], IV, 171–72. To check: Washington to Saigon 1935, Jan. 7, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 172 n.2). Names: Rusk, Lodge.'
    src:
      c: 83ec34b8
      rows:
        - 'w.gibbons-u-s-government-and IV, 171–72: all'
        - 'via w.gibbons-u-s-government-and IV, 172 n.2: all'
    tags: [name:rusk-dean, name:lodge-henry-cabot]
  - id: cal.1966-01-07.vietnam-3
    when: Jan. 7
    date: '1966-01-07'
    thread: vietnam
    c: 'Thomson and Ropa of the NSC staff to McGeorge Bundy, "The New Year in Asia": South Vietnam under the Directorate seven months more stable than at any time since early 1963, in part from the American commitment; Kỳ''s government "notably unsuccessful in developing significant popular enthusiasm or positive political support," its reforms "only marginal headway." Pacification "very little tangible progress" in 1965.'
    n: '[FRUS 1964–68, IV, doc. 10](https://history.state.gov/historicaldocuments/frus1964-68v04/d10). [[w.gibbons-u-s-government-and]], IV, 172–73. Made public: FRUS 1964–68, IV (1998). Names: Thomson, McGeorge Bundy, Nguyễn Cao Kỳ.'
    src:
      c: 536bc541
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d10: all'
        - 'w.gibbons-u-s-government-and IV, 172–73: all'
        - 'via w.gibbons-u-s-government-and IV, 173 n.8: all'
    tags: [name:thomson-james-c-jr, name:bundy-mcgeorge, name:nguyen-cao-ky]
  - id: cal.1966-01-07.vietnam-4
    when: Jan. 7
    date: '1966-01-07'
    thread: vietnam
    c: 'Westmoreland to Washington, MACV 0117: the programs of pacification, military and civilian, to be completely integrated, under a coordinating committee directed by Porter; Lansdale not the coordinator, his field "political action," "a very useful function for which General Lansdale has incomparable talents."'
    n: '[[w.gibbons-u-s-government-and]], IV, 185. To check: MACV 0117, Jan. 7, 1966, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 185 n.40). Check: the cable''s words and those of the talking paper of Dec. 26, which Gibbons quotes together. See [[cal.1965-12-17.vietnam-4]]. Names: Westmoreland, Porter, Lansdale.'
