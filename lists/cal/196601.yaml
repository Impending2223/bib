  - id: cal.1966-01.china-leadership-12
    when: Jan., about the 20th (the lunar New Year's Eve)
    date: 1966-01
    at: after 1966-01-19
    place: canton
    thread: china-leadership
    c: Chen Yi 陈毅 goes to Guangdong 广东 to inspect; he sees the flower fair at Canton 广州, Zhaoqing 肇庆, the Seven Star Crags 七星岩 and Dinghu Shan 鼎湖山, and writes the poems "The Canton flower fair" 《广州花市》, "Touring Zhaoqing" 《游肇庆》, "Seven Star Crags" 《七星岩》 and "The flying spring of Dinghu" 《鼎湖飞泉》.
    n: '[[w.chen-yi-nianpu]], 1137. Made public: 1995. Names: Chen Yi.'
    tags: [polity:prc, name:chen-yi, vis:only:prc]
  - id: cal.1966.china-leadership-43
    when: 1966, autumn's end
    date: '1966'
    at: before 1966-09
    thread: china-leadership
    c: On a newspaper headlined "The situation is excellent," Chen Yi 陈毅 copies two lines of Du Fu 杜甫 (the new pines he would have grow a thousand feet; the bad bamboo he would cut by the ten thousand) and mails it to Du Fu's Cottage 杜甫草堂 at Chengdu 成都, where the staff, understanding his mood, keep it.
    n: '[[w.chen-yi-nianpu]], 1172. Made public: 1995. Names: Chen Yi.'
    tags: [polity:prc, name:chen-yi, ok:fields-place, vis:only:prc]
  - id: cal.1966.china-leadership-45
    when: 1966, year's end
    date: '1966'
    at: before 1966-09
    place: peking
    thread: china-leadership
    c: 'At Ye Jianying''s 叶剑英 house in the Western Hills 西山, Peking 北京, Chen Yi 陈毅 says angrily that to overthrow all the old cadres and put the rebels in power is revisionism the faster; "they" (the nianpu: Lin Biao 林彪, Jiang Qing 江青 and their group) do no practical work and so fear no chaos; when Ye says the army must not be thrown into disorder, Chen Yi raises both hands: he will raise both hands for him even in hell.'
    n: '[[w.chen-yi-nianpu]], 1179. Made public: 1995. Names: Chen Yi, Ye Jianying, Lin Biao, Jiang Qing.'
    tags: [polity:prc, name:chen-yi, name:ye-jianying, name:lin-biao, name:jiang-qing, vis:only:prc]
  - id: cal.1966.soviet-union-2
    when: 1966–67
    date: '1966'
    thread: soviet-union
