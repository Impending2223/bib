    c: Gansu Normal University 甘肅師範大學. The provincial committee's work team 省委工作團 has Zhang Shiliang 張師亮 criticized; at a history department meeting he defends himself for a whole day; labelled anti-work team, anti-Party, against the Cultural Revolution.
