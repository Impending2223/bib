    c: Zeng Yongquan, Vice-Minister of Foreign Affairs, receives the Soviet ambassador, Chervonenko, and hands over China's reply to the Soviet aide-memoire of Apr. 20 on the nonproliferation of nuclear weapons. The Soviet aim, it says, to please the U.S. by weakening the defense power of other socialist countries, above all by denying China nuclear weapons as the price of the U.S. signing a nonproliferation agreement, is a mistaken stand. China's resolve to oppose imperialism, uphold world peace and prevent nuclear war is unshakable. Whatever pressure is used, the Chinese people will never admit that one or several big powers hold a monopoly of nuclear power and a privilege of ordering other countries about.
