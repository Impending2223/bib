    c: 'San Francisco, the Young Republican National Federation''s convention. Goldwater at Longshoremen''s Hall: "Modern liberalism is only a form of rigor mortis." A session of twenty-two hours; near dawn Nadasdy, the outgoing chairman, declares Lukens, White''s candidate, elected by two votes; adjourned at 5:15 a.m. Its platform: the federal income tax abolished, the United States out of the United Nations, a "Court of the Union" over the Supreme Court, segregation kept.'
