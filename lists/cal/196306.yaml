    n: 'Radio and Television Report to the American People on Civil Rights, [1963 Pub. Papers 468](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=526) (June 11, 1963). Address on civil rights (K–J Adm. II.I). [[w.schlesinger-robert-kennedy-and-his]], 343–44, 346 (the hour not given; the drafting by Robert Kennedy''s account); [[w.branch-pillar-of-fire]], 107–08; [[w.sorensen-kennedy]], 494–96; [[w.sundquist-politics-and-policy]], 262 (the address; the decision to ask for legislation taken May 31, by Sorensen''s account); [[w.mann-walls-of-jericho]], 364–66; [[w.robert-kennedy-in-his]], 176, 200–01 (about 8 p.m.; Sorensen''s draft four or five minutes before; the end extemporized); [[w.branch-parting-the-waters]], 823–24; [[w.kotz-judgment-days]], 62 (with little preparation, against his staff''s advice, from a sketchy text; the hour not given); [[w.bernstein-guns-or-butter]], 43 (the moral imperative; a comprehensive bill promised); [[w.thomas-robert-kennedy]], 248 (the President decides that day; Sorensen drafting; partly extemporized; "a moral issue ... as old as the Scriptures"); [[w.young-easy-burden]], 252; [[w.whalen-longest-debate]], xx, 17 (the words; Sorensen''s text handed over two minutes before air time); [[w.caro-passage-of-power]], 266 (the televised address: civil rights "a moral issue," "as old as the scriptures and . . . as clear as the American Constitution"; Caro dates it June 13); [[w.wofford-of-kennedys-and-kings]], 172–73 (the address that night; Kennedy "almost went on the air without a text"; Sorensen''s draft arrived just in time; "a moral issue ... as old as the scriptures and is as clear as the American Constitution"; not 8 p.m.); [[w.sorensen-counselor]], 279–82 (the address televised at 8 p.m. on the networks; its closing paragraphs from Kennedy''s own scribbled notes, Sorensen''s closing dropped; the text "toned down, but its substance remained"; civil rights "a moral issue," "as old as the Scriptures and as clear as the American Constitution"; Sorensen''s account, written in 2008; not "partly extemporized" or the law asked); [[w.albert-little-giant-1990]], 276 (the address that evening, the day of Wallace''s stand: "a moral issue. It is as old as the Scriptures and is as clear as the American Constitution"; the legislation he would submit; not the hour or the extemporizing). [[w.reeves-president-kennedy]], 521–22. Check: Branch, 823–24: the President''s idea that Tuesday; O''Donnell and O''Brien against it, Sorensen fearing the haste; toward six he orders fifteen minutes of network time at eight; Sorensen''s draft from the President''s ideas and scraps of Louis Martin''s ("That was Louie Martin''s speech," Lee White); no finished text; "Come on now, Burke. You must have some ideas." Robert Kennedy alone encouraged it, by Marshall''s memory; by Robert Kennedy''s, his brother "just decided that day.". Check: Whalen, 17, has the television time reserved for 7:00 p.m. Check: Caro, 266, dates the address June 13. To check: [[w.rosenberg-kennedy-johnson-and-the]] ("The Bill and the March"); [[w.berman-bill-becomes-a-law]]; [[w.loevy-to-end-all-segregation]]; [[w.civil-rights-act-of]]; [[w.risen-bill-of-the-century]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.brauer-john-f-kennedy-and]]; [[w.stern-calculating-visions]]; [[w.bryant-bystander]]; [[w.levingston-kennedy-and-king]]; Robert Kennedy, interview by Anthony Lewis, Dec. 6, 1964, II, 7–9, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 344 n.2a); Robert Kennedy, interview by John Bartlow Martin, Apr. 30, 1964, III, 39–40, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 344 n.2b). After the stand at Tuscaloosa: the address opens with it ("This afternoon, following a series of threats and defiant statements"). See [[cal.1963-06-11.alabama]].'
