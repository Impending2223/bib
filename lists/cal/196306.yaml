  - id: cal.1963-06-07.testing
    when: June 7
    date: '1963-06-07'
    thread: testing
    c: Bundy, Rostow, Kaysen, Sorensen and Schlesinger meet on Sorensen's draft of the President's speech on peace for June 10, which contains the announcement of a moratorium on nuclear testing. Neither Rusk nor McNamara, so far as Schlesinger can tell, has seen the draft or knows of the announcement. The five think the speech fine and suggest only minor changes; State and Defense are informed in the afternoon. Sorensen flies to Honolulu, where the President addresses the Mayors' Conference the next day. By Schlesinger's journal.
    n: '[[w.schlesinger-journals]], 194. Made public: [[w.schlesinger-journals]] (2007). Names: Bundy, Rostow, Kaysen, Sorensen, Schlesinger, Rusk, McNamara.'
    tags: [name:bundy-mcgeorge, name:rostow-walt-w, name:kaysen-carl, name:sorensen-theodore-c, name:schlesinger-arthur-m-jr, name:rusk-dean, name:mcnamara-robert-s]
  - id: cal.1963-06-07.soviet-union-leadership
    when: June 7
    date: '1963-06-07'
    place: moscow
    thread: soviet-union-leadership
    also: [cuba]
    c: 'The Presidium. Khrushchev, stenographed, on his talks with Castro in the south: Castro asked what divides Moscow from Peking; "nationalism," egoism, the wish to be first violin. "говорят, что мы струсили. Но если мы струсили, так зачем же мы тогда на Кубу поставили ракеты?" (they say we lost our nerve; but if so, why did we put missiles in Cuba?); Castro had thought them put there for the whole camp; a military treaty not to his advantage, a communiqué instead. A Cuban steel works doubtful, no coking coal, the cans wanted for preserves; Khrushchev wary of becoming Guevara''s enemy; the Program''s dropping of the dictatorship of the working class, which the Chinese attack, defended. A sugar-cane machine promised within two years. He will go to Cuba by Jan. 1. Then his visit to Yaroslavl: the tire works littered, rubber stored in the open, a quarter of the tires still on cotton cord; no plants for diesel-oil additives, Gosplan finding no money; advisory bodies of engineers at the works to be thought of. Approved, the talks "вполне хорошими" (quite good). Podgorny and Brezhnev to be Central Committee secretaries, Brezhnev leaving the Supreme Soviet''s chair. Lesechko faulted on the Comecon meeting, the Romanians. On a KGB note, Zhukov to be called in and warned: if he does not understand, expulsion and arrest.{1} Ponomarev, by Friedman''s account: this must be widely distributed in all countries, especially where there are inclinations toward the Chinese.{2} The KGB note is Semichastny''s, of May 27.{3}'
    n: 'Protocol 100. [[w.prezidium-tsk-kpss-1954]], I, 719–20 (doc. 292, Malin''s notes), 720–32 (doc. 293, the stenogram of items I and II, its opening and the rest of the session not stenographed: Castro and China, 720; the missiles, 720–21; the treaty, 722; the steel works and Guevara, 722; the Program, 722–23; the cane machine, 724; Jan. 1, 725–26; Yaroslavl, 726–31; the additives, 730; the advisory bodies, 731); III, 534–36 (P 100/I–II; the KGB''s note of May 27, Semichastny''s, not printed). [[w.friedman-shadow-cold-war]], 102 (Khrushchev reports on his success with Castro; Ponomarev: "this must be widely distributed in all countries, especially where there are inclinations toward the Chinese"; Friedman puts the session "in early 1963"); [[w.friedman-shadow-cold-war]], 102; [[w.prezidium-tsk-kpss-1954]], III, 535. To check: Steno, June 7, 1963, AOK (cited by [[w.friedman-shadow-cold-war]], 102 n.8a). See [[cal.1963-05-05.cuba]]. Made public: 2003. Names: Khrushchev, Castro, Guevara, Podgorny, Brezhnev, Lesechko, Zhukov, Semichastny, Ponomarev.'
    src:
      c: 26a092c0
      rows:
        - 'via x.1963-06-07.presidium-stenogram-june-7: ?'
        - 'w.friedman-shadow-cold-war 102: 2'
        - 'w.prezidium-tsk-kpss-1954 III, 535: 3'
