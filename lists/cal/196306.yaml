# Cal. XLIII June 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLIII
entries:
  - id: cal.1963-06.civil-rights-organizations
    when: June
    date: 1963-06
    thread: civil-rights-organizations
    c: McDew resigns as SNCC's chairman, for his health. An emergency meeting of the coordinating committee elects Lewis to finish the term. Check the date.
    n: 'Lewis to Emily Stoper, 1967, [interview](https://www.crmvet.org/nars/lewisj.htm), in [[w.stoper-student-nonviolent-coordinating-committee]]. SNCC Digital Gateway (K–J Cong. II.L). To check: [[w.lewis-walking-with-the-wind]]; [[w.carson-in-struggle]]. Names: Lewis, McDew.'
    tags: [name:lewis-john, name:mcdew-charles]
  - id: cal.1963-06-03.court
    when: June 3
    date: '1963-06-03'
    thread: court
    also: [desegregation-schools]
    c: '*Goss v. Board of Education*, [373 U.S. 683](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373683/usrep373683.pdf). Knoxville''s transfer plan, letting a pupil leave a school where his race is in the minority, struck down. Clark for a unanimous Court.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1963-06-03.civil-rights-bill
    when: June 3
    date: '1963-06-03'
    thread: civil-rights-bill
    c: 'Johnson to Sorensen by telephone, on the civil rights bill the papers report: "I''ve never seen it." A bill sent now would fail. First the President in the South, the moral issue "face to face"; then the Negro leaders; then the congressional leaders.'
    n: '[[w.dallek-flawed-giant]], 37 (from the conversation in the Vice Presidential Papers, Civil Rights, LBJ Library); [[w.caro-passage-of-power]], 258–61 (the call: not seen the bill, the timing, the President''s moral commitment; before it, a 10 a.m. meeting on the bill in the Oval Office, Kennedy asking Johnson to give Sorensen his views). Names: Johnson, Sorensen.'
    tags: [name:johnson-lyndon-b, name:sorensen-theodore-c]
  - id: cal.1963-06-04.civil-rights-the-executive
    when: June 4
    date: '1963-06-04'
    thread: civil-rights-the-executive
    c: 'Statement: apprenticeship programs to admit without regard to race; federal construction reviewed for discrimination in hiring; an order to come extending the equal employment committee to federally aided building.'
    n: 'Statement by the President on Equal Employment Opportunity in Federal Apprenticeship and Construction Programs, [1963 Pub. Papers 439](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=497) (June 4, 1963). To check: [[w.graham-civil-rights-era]]; [[w.sugrue-affirmative-action-from-below]]. See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Wirtz.'
    tags: [name:kennedy-john-f, name:wirtz-w-willard]
  - id: cal.1963-06-05.transportation
    when: June 5
    date: '1963-06-05'
    thread: transportation
    c: 'Air Force Academy commencement, Colorado Springs: a program with industry for the prototype of a commercial supersonic transport, faster than Mach 2, by the end of the decade; the Vice President''s committee had recommended it.'
    n: 'Remarks in Colorado Springs to the Graduating Class of the U.S. Air Force Academy, [1963 Pub. Papers 439](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=497) (June 5, 1963). To check: [[w.horwitch-clipped-wings]]. Names: Kennedy, Johnson.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1963-06-05.middle-east
    when: June 5–7
    date: '1963-06-05'
    thread: middle-east
    c: 'Iran. Khomeini arrested at Qom; riots in Tehran and the provincial cities, June 5; martial law; the troops fire into the crowds. About 200 killed by the State Department''s count; about 125 by the Shah''s. Talbot to Rusk, June 6: the Shia hierarchy "has in essence launched a civil war against the regime," against land reform and women''s rights; no evidence of a foreign hand.'
    n: 'FRUS 1961–63, XVIII, docs. [263](https://history.state.gov/historicaldocuments/frus1961-63v18/d263), [279](https://history.state.gov/historicaldocuments/frus1961-63v18/d279). To check: [[w.abrahamian-iran-between-two-revolutions]]; [[w.moin-khomeini]]; [[w.milani-shah]]. Names: Khomeini, Pahlavi, Talbot, Rusk.'
    tags: [name:khomeini-ruhollah, name:pahlavi-mohammed-reza, name:talbot-phillips, name:rusk-dean]
  - id: cal.1963-06-05.elections-1964
    when: June 5
    date: '1963-06-05'
    thread: elections-1964
    also: [assassination]
    c: 'El Paso, the Cortez Hotel, after White Sands. Kennedy to Johnson and Connally: a trip to Texas on Aug. 27, four fund-raising dinners, Dallas, Fort Worth, San Antonio and Houston. Connally against: too near Labor Day; one dinner at Austin, nonpolitical appearances in the four cities "at the proper time." Kennedy agrees; the trip put off.'
    n: 'Remarks Upon Arrival at El Paso International Airport, [1963 Pub. Papers 443](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=501) (June 5, 1963) (the three at El Paso, from White Sands). [[w.johnson-vantage-point]], 6–7, by Johnson''s account. Check: the day; Johnson gives "June 1963." Names: Kennedy, Johnson, Connally.'
    src:
      c: d8cb1a29
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=501: A'
        - 'w.johnson-vantage-point 6–7: all'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:connally-john]
  - id: cal.1963-06-08.vietnam
    when: June 8
    date: '1963-06-08'
    thread: vietnam
    c: 'The Women''s Solidarity Movement''s motion of June 7 released: the demonstrating Buddhists "exploited and controlled by communism"; the government to "expel all foreign agitators whether they wear monks'' robes or not."'
    n: 'FRUS 1961–63, III, docs. [157](https://history.state.gov/historicaldocuments/frus1961-63v03/d157) (Trueheart; the motion in its note), [160](https://history.state.gov/historicaldocuments/frus1961-63v03/d160) (Trueheart with Diệm, June 8). [[w.miller-misalliance]], 269–70 (the resolution of June 8; the foreign agitators; Diệm given a copy that evening). To check: "Solidarity Movement calls for Defense of VN. Buddhism," *Times of Viet Nam Magazine*, June 9, 1963, 1–2 (cited by [[w.miller-misalliance]], 269 n.78). See [[cal.1963-05-08.vietnam]].'
    src:
      c: ab7ef5ec
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d157: all'
        - 'w.miller-misalliance 269–70: A-B'
        - 'via w.miller-misalliance 269 n.78: A-B'
        - 'via w.miller-misalliance 270 n.79: all'
    tags: [place:saigon]
  - id: cal.1963-06-09.civil-rights-the-executive-us
    when: June 9
    date: '1963-06-09'
    thread: civil-rights-the-executive
    also: [states-and-cities]
    c: 'Kennedy to the U.S. Conference of Mayors at Honolulu: race relations "a national problem." Five steps for every city: a biracial human relations committee; ordinances and practices in accord with the Court''s rulings; Negroes hired at every level of city government; equal opportunity ordinances on jobs, housing and public accommodations; a summer drive against school dropouts.'
    n: 'Address in Honolulu Before the United States Conference of Mayors, [1963 Pub. Papers 454](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=512) (June 9, 1963). See [[cal.1963-06-04.civil-rights-the-executive]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-09.mississippi
    when: June 9
    date: '1963-06-09'
    thread: mississippi
    c: Winona. Fannie Lou Hamer, Annelle Ponder of SCLC, June Johnson and three others, coming home from a citizenship school at Charleston, S.C., arrested after trying the bus station's lunch counter; in the Montgomery County jail beaten by the sheriff, the police chief and a highway patrolman, and by Negro prisoners made to do it. Lawrence Guyot of SNCC, come to bail them, arrested and beaten.
    n: '[[w.dittmer-local-people]], 170–73. Check: the day; Dittmer, 170, 173: a Sunday, nine days before June 18. To check: [[w.mills-this-little-light-of]]; June Johnson''s affidavit, undated, Jan Hillegas Collection (cited by [[w.dittmer-local-people]], 171 n.2); "Verbatim transcript of interview by phone by Jack Minnis with Mrs. Fannie Lou Hamer," June 13, 1963, SNCC Papers, reel 38 (cited by [[w.dittmer-local-people]], 172 n.4). Names: Hamer, Ponder, June Johnson, Guyot.'
    src:
      c: 14f5eab5
      rows:
        - 'w.dittmer-local-people 170–73: all'
        - 'via w.dittmer-local-people 171 n.2: C'
        - 'via w.dittmer-local-people 172 n.4: C'
    tags: [state:ms, name:hamer-fannie-lou, name:ponder-annelle, name:johnson-june, name:guyot-lawrence]
  - id: cal.1963-06-10.program
    when: June 10
    date: '1963-06-10'
    thread: women
    c: Equal Pay Act signed, [77 Stat. 56](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg56.pdf). Equal pay for equal work regardless of sex, under the Fair Labor Standards Act; in force in a year. Women's wages, 60 percent of men's.
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing the Equal Pay Act, [1963 Pub. Papers 464](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=522) (June 10, 1963). To check: [[w.harrison-on-account-of-sex]]; [[w.zelman-women-work-and-national]]; [[w.kessler-harris-in-pursuit-of-equity]]; [[w.cobble-other-womens-movement]]; [[w.peterson-restless]]. See [[cal.1961-12-14.program]]. Names: Peterson, Green.'
    tags: [name:kennedy-john-f, name:peterson-esther, name:green-edith]
  - id: cal.1963-06-10.testing
    when: June 10
    date: '1963-06-10'
    thread: testing
    c: American University. "Not a Pax Americana enforced on the world by American weapons of war." Talks in Moscow on a test ban, agreed with Khrushchev and Macmillan; no American tests in the atmosphere while others hold off.
    n: 'Commencement Address at American University in Washington, [1963 Pub. Papers 459](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=517) (June 10, 1963). Recording (K–J Adm. II.I). Treaty (K–J Cong. II.J.2). [FRUS 1961–63, VII](https://history.state.gov/historicaldocuments/frus1961-63v07). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 346. [[w.schlesinger-thousand-days-1965]], 899–904. To check: [[w.jacobson-diplomats-scientists-and-politicians]]; [[w.seaborg-kennedy-khrushchev-and-the]]; [[w.cousins-improbable-triumvirate]]; [[w.beschloss-crisis-years]]; [[w.oliver-kennedy-macmillan-and-the]]; [[w.mastny-1963-nuclear-test-ban]]; [[w.sachs-to-move-the-world]]; [[w.terchek-making-of-the-test]]; [[w.abramson-spanning-the-century]]; [[w.bundy-danger-and-survival]]; [[w.sorensen-kennedy]]. See [[cal.1962-12-19.testing]]; [[cal.1963-04-24.testing]]; [[cal.1963-05-08.testing]]. Names: Khrushchev, Macmillan.'
    src:
      c: ae7574cd
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=517: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07: all'
