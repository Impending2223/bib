    place: jackson
    thread: mississippi
    follows:
      - cal.1963-06-15.mississippi-2
    c: 'Jackson.{1} After the Evers funeral''s silent march, five thousand, some hundred young people defy the court order and march downtown singing;{2} police with shotguns, pumper trucks and dogs club several and arrest nearly thirty;{3} 103 degrees. Doar walks into the bricks and bottles, hands raised: "My name is John Doar! ... I''m in the Justice Department in Washington. And anybody around here knows that I stand for what''s right!" The crowd disperses. Pairs had been arrested for carrying flags on Flag Day, June 14.{4}'
    n: '[[w.branch-parting-the-waters]], 826–27; [[w.risen-bill-of-the-century]], 76–77 (June 15, the funeral at the Masonic temple, King, Wilkins and Bunche present; afterward a march in three-digit heat chanting "Shoot, shoot!"; Doar steps out: "Medgar Evers would not have wanted it this way"). After the funeral: [[w.branch-parting-the-waters]], 826–27, 830. Check: Risen, 76–77, has some five hundred in the march, and Doar saying "My name is John Doar, and I am from the Department of Justice" and "Medgar Evers would not have wanted it this way"; the entry has some hundred young people and other words. To check: Evers memorial march, June 15, 1963, Pacifica Radio Archive, tape 4817 (cited by [[w.branch-parting-the-waters]], 826 n.3); [*New York Times*, June 16, 1963](https://timesmachine.nytimes.com/timesmachine/1963/06/16/issue.html), at 1 (cited by [[w.branch-parting-the-waters]], 826 n.4); interviews: John Doar, May 12, 1986 (cited by [[w.branch-parting-the-waters]], 826 n.2). See [[cal.1963-06-12.mississippi]]. Names: Doar, Evers.'
    src:
      c: cce9e12b
      rows:
        - 'w.branch-parting-the-waters 826-27: 1, 2, 3, 4'
        - 'via w.branch-parting-the-waters 826 n.3: 2'
        - 'via w.branch-parting-the-waters 826 n.4: 2, 3'
        - 'via w.branch-parting-the-waters 826 n.2: 2'
        - 'w.risen-bill-of-the-century 76–77: ?'
    tags: [name:doar-john, name:evers-medgar, state:ms, city:jackson]
