    c: Jackson.{1} Wilkins, the NAACP's executive secretary, arrested picketing outside the downtown Woolworth's, his first arrest in nearly thirty years; he bails out and flies home the same evening, leaving the NAACP's lawyers to turn from pickets to litigation.{2}
    n: '[[w.branch-pillar-of-fire]], 101–02; [[w.branch-parting-the-waters]], 816. See [[cal.1963-05-28.mississippi]]. Names: Wilkins.'
