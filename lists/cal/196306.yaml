  - id: cal.1963-06-03.civil-rights-the-executive
    when: June 3
    date: '1963-06-03'
    thread: civil-rights-the-executive
    also: [governors]
    c: 'Kennedy and Governor Jimmie Davis of Louisiana, by telephone, recorded, on school desegregation and the demonstrations. Davis: "I''m going to get hurt in the thing myself, but I''m going to handle it." Kennedy: "That''ll make a helluva difference."'
    n: '[John F. Kennedy and James H. "Jimmie" Davis](https://prde.upress.virginia.edu/conversations/4001523), JFK Dictabelt 21A.1 (PRDE only). [[w.reeves-president-kennedy]], 503. Check: the recording not heard; the words Reeves''s, from the Library''s transcript. Names: Davis, Kennedy.'
    src:
      c: ac8d3a9c
      rows:
        - 'https://prde.upress.virginia.edu/conversations/4001523: all'
        - 'w.reeves-president-kennedy 503: all'
        - 'via w.reeves-president-kennedy 503 n.im-going-to-get-hurt: all'
    tags: [name:davis-jimmie-h, name:kennedy-john-f, state:la]
  - id: cal.1963-06-04.civil-rights-the-executive
    when: June 4
    date: '1963-06-04'
    thread: civil-rights-the-executive
    c: 'Statement: apprenticeship programs to admit without regard to race; federal construction reviewed for discrimination in hiring; an order to come extending the equal employment committee to federally aided building.'
    n: 'Statement by the President on Equal Employment Opportunity in Federal Apprenticeship and Construction Programs, [1963 Pub. Papers 439](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=497) (June 4, 1963). To check: [[w.graham-civil-rights-era]]; [[w.sugrue-affirmative-action-from-below]]. See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Wirtz.'
    tags: [name:kennedy-john-f, name:wirtz-w-willard]
  - id: cal.1963-06-04.civil-rights-bill
    when: June 4
    date: '1963-06-04'
    thread: civil-rights-bill
    also: [robert-kennedy]
    c: 'Schlei to Robert Kennedy, of the Vice President''s comments on the civil rights proposals: the bill "would be disastrous for the President''s program and would not be enacted if submitted now," not that Johnson opposes such legislation but that so little has been done to prepare the country for it. Johnson had asked fifteen minutes alone with the President on it.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 347–48. [[w.mann-walls-of-jericho]], 359–60 (Schlei sent to Johnson June 3, after his request to O''Donnell for fifteen minutes with the President). To check: Schlei to Robert Kennedy, "Comments of the Vice President on the Civil Rights Legislative Proposals," June 4, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 348 n.17a); Schlei, interview by John Stewart, Feb. 20–21, 1968, 47–49, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 348 n.17b). See [[cal.1963-06-03.civil-rights-bill]]. Names: Schlei, Robert Kennedy, Johnson.'
    src:
      c: df6f6998
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 347–48: all'
        - 'via w.schlesinger-robert-kennedy-and-his 348 n.17a: all'
        - 'via w.schlesinger-robert-kennedy-and-his 348 n.17b: all'
        - 'w.mann-walls-of-jericho 359–60: B'
    tags: [name:schlei-norbert-a, name:kennedy-robert-f, name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1963-06-05.transportation
    when: June 5
    date: '1963-06-05'
    thread: transportation
    c: 'Air Force Academy commencement, Colorado Springs: a program with industry for the prototype of a commercial supersonic transport, faster than Mach 2, by the end of the decade; the Vice President''s committee had recommended it.'
    n: 'Remarks in Colorado Springs to the Graduating Class of the U.S. Air Force Academy, [1963 Pub. Papers 439](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=497) (June 5, 1963). To check: [[w.horwitch-clipped-wings]]. Names: Kennedy, Johnson.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1963-06-05.middle-east
    when: June 5–7
    date: '1963-06-05'
    thread: middle-east
    c: 'Iran. Khomeini arrested at Qom; riots in Tehran and the provincial cities, June 5; martial law; the troops fire into the crowds. About 200 killed by the State Department''s count; about 125 by the Shah''s. Talbot to Rusk, June 6: the Shia hierarchy "has in essence launched a civil war against the regime," against land reform and women''s rights; no evidence of a foreign hand.'
    n: 'FRUS 1961–63, XVIII, docs. [263](https://history.state.gov/historicaldocuments/frus1961-63v18/d263), [279](https://history.state.gov/historicaldocuments/frus1961-63v18/d279). To check: [[w.abrahamian-iran-between-two-revolutions]]; [[w.moin-khomeini]]; [[w.milani-shah]]. Names: Khomeini, Pahlavi, Talbot, Rusk.'
    tags: [name:khomeini-ruhollah, name:pahlavi-mohammed-reza, name:talbot-phillips, name:rusk-dean]
  - id: cal.1963-06-05.elections-1964
    when: June 5
    date: '1963-06-05'
    thread: elections-1964
    also: [assassination]
    c: 'El Paso, the Cortez Hotel, after White Sands. Kennedy to Johnson and Connally: a trip to Texas on Aug. 27, four fund-raising dinners, Dallas, Fort Worth, San Antonio and Houston. Connally against: too near Labor Day; one dinner at Austin, nonpolitical appearances in the four cities "at the proper time." Kennedy agrees; the trip put off.'
    n: 'Remarks Upon Arrival at El Paso International Airport, [1963 Pub. Papers 443](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=501) (June 5, 1963) (the three at El Paso, from White Sands). [[w.johnson-vantage-point]], 6–7, by Johnson''s account. [[w.young-two-suns-of-the]], 44 (the three on the trip, June 1963). [[w.reeves-president-kennedy]], 508 (the meeting; the trip proposed; Connally against). Check: the day; Johnson gives "June 1963." Names: Kennedy, Johnson, Connally. Check: Reeves dates it June 6 (508).'
    src:
      c: d8cb1a29
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=501: A'
        - 'w.johnson-vantage-point 6–7: all'
        - 'w.young-two-suns-of-the 44: B'
        - 'w.reeves-president-kennedy 508: A-C'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:connally-john]
  - id: cal.1963-06-05.republican-party-congress
    when: June 5
    date: '1963-06-05'
    thread: republican-party-congress
    also: [civil-rights-bill]
    c: 'The Senate Republican conference on civil rights, some seven hours: a consensus that the rights the Fourteenth and Fifteenth Amendments promise be secured by Congress as well as the President; Republican Senators "will support further appropriate legislation required to help solve the problems of our Nation in the field of civil rights." Saltonstall, its chairman, puts it in the Record June 6. Javits: it "crystallized sentiment in my party."'
    n: 'Saltonstall, Javits, Cooper, [109 Cong. Rec. 10262](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt8/pdf/GPO-CRECB-1963-pt8-6-1.pdf#page=19) (June 6, 1963). [[w.sundquist-politics-and-policy]], 261–62 (the conference; Javits). See [[cal.1963-06-01.civil-rights-bill]]. Names: Saltonstall, Javits. Check: Sundquist, 261, gives five and a half hours; Cooper, in the Record, seven.'
    src:
      c: 3235b639
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt8/pdf/GPO-CRECB-1963-pt8-6-1.pdf#page=19: all'
        - 'w.sundquist-politics-and-policy 261–62: A, C-D'
        - 'via w.sundquist-politics-and-policy 262 n.131: A, D'
    tags: [name:saltonstall-leverett, name:javits-jacob-k, name:cooper-john-sherman]
  - id: cal.1963-06-07.civil-rights-organizations
    when: June 7
    date: '1963-06-07'
    thread: civil-rights-organizations
    c: 'New York, Riverside Church. The National Council of Churches'' General Board creates a Commission on Religion and Race: "The world watches to see how we will act, whether with courage or with fumbling expediency."'
    n: '[[w.branch-pillar-of-fire]], 104. To check: Findlay, Church People in the Struggle, pp. 3-4, NCC press release dated June 7, 1963, A/SN115f3 (cited by [[w.branch-pillar-of-fire]], 104); "A Report of the President''s Temporary Committee of Six on Race," approved by the General Board on June 7, 1963, A/SN115f3 (cited by [[w.branch-pillar-of-fire]], 104).'
