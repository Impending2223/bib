  - id: cal.1963-06-14.china-leadership-9
    when: June 14
    date: '1963-06-14'
    place: xian
    thread: china-four-cleanups
    c: 'Xi''an 西安. Peng Zhen 彭真 reports to the cadres of the Northwest Bureau 中共中央西北局 and the Shaanxi committee: socialist education the greatest revolutionary movement since land reform, digging up revisionism''s roots; in the hard years some doubted the collective, sought free trade, speculated, wanted capitalism, many old guerrillas "new soldiers" before the socialist revolution; men to be re-educated, the revolutionary ranks regrouped; the masses roused, 20 percent of teams with grave problems, leadership seized; the upper-middle peasants friends, "仅仅是搞单干的，不能打击," for no law forbids it, only competition; cadres of landlord, rich peasant and bourgeois birth examined and taught patiently; erring cadres allowed and welcomed to correct; a "middle zone" of 4 or 5 percent to be won.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 277–278. Made public: 2012. See [[cal.1963-05.china-leadership-5]]. Names: Peng Zhen.'
    src:
