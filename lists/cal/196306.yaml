    tags: [name:wilkins-roy, state:ms]
  - id: cal.1963-06-01.march-on-washington
    when: June 1
    date: '1963-06-01'
    thread: march-on-washington
    follows:
      - cal.1963-06-01.mississippi
    c: 'King, Clarence Jones and Levison by telephone, overheard on the FBI''s tap: King, of Wilkins''s arrest, "We''ve baptized brother Wilkins!"; "We are on a breakthrough, and we need a mass protest." Randolph''s planned rally for jobs in Washington to be enlarged; a crowd of a hundred thousand needed, August the earliest.'
    n: '[[w.branch-pillar-of-fire]], 102–03; [[w.branch-parting-the-waters]], 816–17. Check: Branch, 816–17: the call at 11:31 p.m.; King: "We are on a breakthrough. ... We need a mass protest," a "mass march" on Washington "and also a unified demonstration all over America"; Paul Newman and Marlon Brando, "Kennedy men," offer help; "possibly a hundred thousand people," not before August; Levison to Ann Jones later: "you tingled.". Of Wilkins''s arrest, the call at 11:31 p.m.: [[w.branch-parting-the-waters]], 816–17. To check: Wiretap conversation ofJune 2, 1963, FLNY-9-186a, p. 3 (cited by [[w.branch-pillar-of-fire]], 102); Wiretap conversation ofJune 1, 1963, FLNY-9-185a (cited by [[w.branch-pillar-of-fire]], 102); Wiretap conversation of June 1, 1963, FLNY-9-185a (cited by [[w.branch-pillar-of-fire]], 102). Made public: Check; Branch cites the FBI''s Levison file. See [[cal.1963-06-01.mississippi]]. Names: Martin Luther King, Levison, Wilkins, Randolph.'
