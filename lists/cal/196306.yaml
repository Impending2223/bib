  - id: cal.1963-06-03.civil-rights-bill
    when: June 3
    date: '1963-06-03'
    thread: civil-rights-bill
    c: 'Johnson to Sorensen by telephone, on the civil rights bill the papers report: "I''ve never seen it." A bill sent now would fail. First the President in the South, the moral issue "face to face"; then the Negro leaders; then the congressional leaders.'
    n: '[[w.dallek-flawed-giant]], 37 (from the conversation in the Vice Presidential Papers, Civil Rights, LBJ Library); [[w.caro-passage-of-power]], 258–61 (the call: not seen the bill, the timing, the President''s moral commitment; before it, a 10 a.m. meeting on the bill in the Oval Office, Kennedy asking Johnson to give Sorensen his views); [[w.mann-walls-of-jericho]], 360–63 (recorded by Dictaphone; the South first, the moral issue face to face; Russell to be consulted, and the Republicans); [[w.shesol-mutual-contempt]], 100–102 (the call, from the Dictaphone recording''s transcript: "we haven''t passed anything yet"; the timing); [[w.kotz-judgment-days]], 61 ("if he goes down there and looks them in the eye and states the moral issue and the Christian issue, and he does it face to face"); [[w.whalen-longest-debate]], 77 ("you haven''t done your homework on public sentiment"). [[w.reeves-president-kennedy]], 504–505; [[w.branch-pillar-of-fire]], 93–95. White OH, LBJ Library; Johnson''s conversation with Sorensen, June 3, 1963, Vice Presidential Papers: Civil Rights, LBJ Library; Norbert Schlei to Robert Kennedy, June 4, 1963, Attorney General''s Papers, JFK Library; Johnson to Sorensen, June 10, 1963, Theodore Sorensen Papers, JFK Library (cited by [[w.dallek-flawed-giant]], 37); Transcript of dictaphone recording, Johnson–Sorensen, June 3, 1963, Johnson Library (cited by [[w.reeves-president-kennedy]], 504). Names: Johnson, Sorensen.'
