  - id: cal.1963-06-28.europe-and-the-alliance-kennedy-in
    when: June 28
    date: '1963-06-28'
    place: cork
    thread: europe-and-the-alliance-kennedy-in-europe
    c: 'Cork, City Hall. The Lord Mayor, Sean Casey, confers the freedom of the city on Kennedy before a crowd of more than one hundred thousand. Kennedy presents Powers, who sits with seven local first cousins, and Monsignor Michael O''Mahoney, "the pastor of a poor, humble flock in Palm Beach, Florida." A sign in the crowd: "Don''t worry, Jack. The Iron Curtain will rust in peace."'
    n: 'Remarks at the City Hall in Cork, [1963 Pub. Papers 533](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=591) (June 28, 1963). [[w.odonnell-johnny-we-hardly-knew]], 415 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Powers.'
    tags: [name:kennedy-john-f, name:powers-david-f]
  - id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-2
    when: June 28
    date: '1963-06-28'
    place: dublin
    thread: europe-and-the-alliance-kennedy-in-europe
    follows:
      - cal.1963-06-28.europe-and-the-alliance-kennedy-in
    c: Dublin, the American Embassy. Kennedy gives a luncheon for President de Valera and Prime Minister Lemass, with songs by the Bunratty Castle singers. At his request they sing "Danny Boy," and he joins them in an encore.
    n: '[[w.odonnell-johnny-we-hardly-knew]], 415 (O''Donnell''s and Powers''s account). After [[cal.1963-06-28.europe-and-the-alliance-kennedy-in|Cork]]: "We flew back to Dublin for a luncheon" ([[w.odonnell-johnny-we-hardly-knew]], 415). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, name:de-valera-eamon]
  - id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-3
    when: June 28
    date: '1963-06-28'
    place: dublin
    thread: europe-and-the-alliance-kennedy-in-europe
    follows:
      - cal.1963-06-28.europe-and-the-alliance-kennedy-in-2
    c: Arbour Hill, Dublin, where the executed leaders of the 1916 Easter Week Rebellion are buried. Kennedy and Lemass at the memorial services; cadets of the Military College at The Curragh perform a drill, which Kennedy watches "with fascination."
    n: '[[w.odonnell-johnny-we-hardly-knew]], 415–16 (O''Donnell''s and Powers''s account). After [[cal.1963-06-28.europe-and-the-alliance-kennedy-in-2|the luncheon]]: "From the luncheon," to Arbour Hill ([[w.odonnell-johnny-we-hardly-knew]], 415). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-5
    when: June 28
    date: '1963-06-28'
    place: dublin
    thread: europe-and-the-alliance-kennedy-in-europe
    follows:
      - cal.1963-06-28.europe-and-the-alliance-kennedy-in-3
    c: 'Leaving the Dail, Kennedy to O''Donnell: "Kenny, of those you''ve met, who do you think are the best politicians in America?" O''Donnell: "Daley and Mansfield." Kennedy: "I agree with you. The Irish do seem to have an art for government." Then: "Perhaps we are both prejudiced."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 417 (O''Donnell''s and Powers''s account). After [[cal.1963-06-28.europe-and-the-alliance-kennedy-in-3|Arbour Hill]]: the address to the Parliament "later that Friday afternoon" ([[w.odonnell-johnny-we-hardly-knew]], 416), then "When we left the Dail" (417). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, O''Donnell, Daley, Mansfield.'
    tags: [name:kennedy-john-f, name:odonnell-kenneth-p, name:daley-richard-j, name:mansfield-mike]
  - id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-6
    when: June 28
    date: '1963-06-28'
    place: dublin
    thread: europe-and-the-alliance-kennedy-in-europe
    follows:
      - cal.1963-06-28.europe-and-the-alliance-kennedy-in-5
    c: 'Dublin Castle, St. Patrick''s Hall. Kennedy invested a freeman of the city; de Valera robes him for the National University''s doctor of laws, then the Earl of Rosse, Vice-Chancellor, gives him Trinity''s degree. In thanks: "if they ever have a game of Gaelic football or hurling, I shall cheer for Trinity and pray for National."'
    n: 'Remarks at a Civic and Academic Reception in St. Patrick''s Hall, Dublin Castle, [1963 Pub. Papers 539](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=597) (June 28, 1963). [[w.odonnell-johnny-we-hardly-knew]], 417–18 (O''Donnell''s and Powers''s account). After [[cal.1963-06-28.europe-and-the-alliance-kennedy-in-5|leaving the Dail]]: "The President then hurried to Dublin Castle" ([[w.odonnell-johnny-we-hardly-knew]], 417). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, name:de-valera-eamon]
  - id: cal.1963-06-28.europe-and-the-alliance-kennedy-in-7
    when: June 28
    date: '1963-06-28'
    thread: europe-and-the-alliance-kennedy-in-europe
    follows:
      - cal.1963-06-28.europe-and-the-alliance-kennedy-in-6
    c: 'Dinner at President de Valera''s, Kennedy''s last night in Ireland. Kennedy asks why de Valera alone of the 1916 leaders was not shot; de Valera: his American birth. On the British: "Only if you are reasonable, will they reason with you, and being reasonable with the British means letting them know that you are willing to throw an occasional bomb into one of their lorries." Mrs. de Valera recites a poem on the Shannon; Kennedy copies it on his place card.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 418–19 (O''Donnell''s and Powers''s account). After [[cal.1963-06-28.europe-and-the-alliance-kennedy-in-6|Dublin Castle]]: "That evening" ([[w.odonnell-johnny-we-hardly-knew]], 418). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, name:de-valera-eamon]
  - id: cal.1963-06-28.china-leadership
    when: June 28
    date: '1963-06-28'
    thread: china-mao-foreign
    also: [soviet-union, china-liu, china-zhou-foreign, china-foreign]
    c: 'Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping and Peng Zhen meet each afternoon, June 28–30, on the line for the delegation''s talks in Moscow.{1} It is judged that there are two ways out: drag on, each speaking, or a break. Mao: "first, break; second, drag; carry it to the brink": China not to break first but to be ready for a break, and not to fear it.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 28, 1963 (the entry for June 28–30); [[w.lengxi-shinian-lunzhan-1956-1966]], 596–598 (Wu: the matters of the Standing Committee''s meetings after June 26, undated: where the talks should begin, how the Soviets may open, a joint statement, a halt to the polemic, who speaks first; Mao''s three outcomes, some agreement, a quarrel and a break (very likely), a quarrel without a break; his course for the delegation: hold to principle, counterattack freely, win by reason, no haste for agreement, no break by China; "even with nothing from the talks, propose the next in Peking"; the writers'' group halved, Qiao Guanhua and three others left at Peking); [[w.yang-shangkun-riji]], II, 290–291 (June 28–30, 1963; at Mao''s on the two parties'' talks: June 28, 6:30 to 8 p.m.; June 29, 2 p.m.; June 30, 2 p.m., on the Center''s statement; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1761 (June 28–30, 1963; Deng with Liu Shaoqi, Zhou Enlai and Peng Zhen on three successive afternoons at Mao''s meeting on the line for the Chinese delegation in the Sino-Soviet party talks); [[w.mao-zedong-zhuan]], V, ch. 71 (Mao convenes meetings on the talks June 25, 28 and 29; June 30 he reviews the draft statement and at 2 p.m. meets at his residence on its publication). [[w.peng-zhen-nianpu-1902]], IV, 279 (June 28–30, 1963, three afternoons; Peng Zhen, with Liu Shaoqi, Zhou Enlai and Deng Xiaoping, at Mao''s meeting on the Sino-Soviet talks (the page''s note: the reply of June 14 to the CPSU''s letter of Mar. 30, the "Proposal concerning the general line," printed in *Renmin ribao* June 17; the CPSU''s statement of June 18 rejecting it)). Made public: 1999. Check: Wu (595–598) has the Standing Committee meet the evening of June 26 ([[cal.1963-06-26.china-leadership-2]]) and twice more, the days not given; whether those are the meetings of June 28–30. See [[cal.1963-06-12.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen.'
    src:
      c: 916ff366
      rows:
        - 'w.zedong-mao-zedong-nianpu V, June 28, 1963: ?'
        - 'w.lengxi-shinian-lunzhan-1956-1966 596–598: 2'
        - 'w.yang-shangkun-riji II, 290–291: 1'
        - 'w.deng-xiaoping-nianpu-1904 III, 1761: 1'
