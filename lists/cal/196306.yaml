  - id: cal.1963-06-04.china-leadership
    when: June 4
    date: '1963-06-04'
    place: wuhan
    thread: china-polemic
    also: [vietnam-hanoi, soviet-union, china-four-cleanups, china-mao-foreign]
    c: 'Wuchang. Mao receives the Vietnam Workers'' Party delegation under Lê Duẩn, to ask its view of the reply to the Soviet letter;{1} Deng Xiaoping, Kang Sheng and Wang Renzhong present. On the rural socialist education movement: no experience of socialism, the cadres none; it will take two or three years; cadres should work and labor both, to keep revisionism out.{2} On South Vietnam, Mao: "we have been wrong."{3} Mao first takes the Vietnamese point: the economic basis of the "whole people" party and state is a matter of principle the draft had not touched. China had not wanted the internal dispute made public; Khrushchev''s joint fleet of 1958 it kept secret.{4} Deng: of the Soviet debt, over 5 billion rubles, 60 percent is for arms in the Korean war; the Port Arthur and Dairen equipment priced at 1.4 billion; trade credits under 300 million; 80 percent repaid, 1.2 billion left, to be cleared in two years. Lê Duẩn puts the Vietnamese debt above 600 million rubles. Mao: China pays 700 million a year on average, 600 million next year, 500 million after.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 4, 1963; [[w.lengxi-shinian-lunzhan-1956-1966]], 574–576 (Wu: Mao''s talk with the Vietnamese delegation, June 4, the day after Deng''s: Mao first on the Vietnamese point (the economic basis of the "whole people" party and state is a point of principle which the draft had not touched, and the Vietnamese saw it); the sharing of the open dispute that China had not wanted public, as with the joint fleet of 1958, which Khrushchev proposed and the Chinese kept secret; Deng on the debt (mostly for war arms, a total of over 5 billion rubles, 60 percent of it; the Port Arthur and Dairen equipment priced at 1.4 billion; trade credits under 300 million; 80 percent paid, 1.2 billion left, to be paid in two years or sooner) and the Vietnamese debt (Lê Duẩn: more than 600 million rubles); Mao: China pays 700 million a year, 600 million next year, 500 million after); [[w.deng-xiaoping-nianpu-1904]], III, 1759 (June 4, 1963; Deng with Mao meets Lê Duẩn and Trường Chinh to seek their views on the reply to the CPSU; Deng says the Chinese do not fear Soviet pressure, rely chiefly on themselves, and mean to repay their debt to the Soviet Union in the next two years); [[w.jian-zhou-enlai]], 494 (June 4, Mao to Lê Duẩn and others: on South Vietnam "we have been wrong"); [[w.jian-zhou-enlai]], 494; [[w.lengxi-shinian-lunzhan-1956-1966]], 574–575; [[w.lengxi-shinian-lunzhan-1956-1966]], 575–576. Made public: 1999. To check: Mao''s conversation with a VLP delegation, June 4, 1963 (cited by [[w.jian-zhou-enlai]], 494 n.14). See [[cal.1963-05-29.china-leadership]]. Names: Mao Zedong, Lê Duẩn, Deng Xiaoping, Kang Sheng, Wang Renzhong, Khrushchev.'
