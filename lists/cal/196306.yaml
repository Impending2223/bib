    time_zone: America/New_York
    range_basis: record
  - id: cal.1963-06-11.civil-rights-bill-4
    when: June 11
    date: '1963-06-11'
    place: washington
    thread: civil-rights-bill
    follows:
      - cal.1963-06-11.civil-rights-bill-2
    c: 'Sorensen drafts the civil rights address.{1} Kennedy comes to his office, the only time in three years he did so to ask about a speech; Sorensen: "Don''t worry. It''s in the typewriter now." In the Cabinet Room, with Robert Kennedy and Burke Marshall, Kennedy marks up the first draft, mostly in tone: "The cesspools of segregation and discrimination exist in every state" becomes "difficulties over segregation and discrimination exist in every city";{2} "But the pace is still shamefully slow," "But the pace is very slow."{3} At four minutes to eight Sorensen is still at work; his closing dropped for the paragraphs Kennedy had scribbled while waiting.{4}'
    n: '[[w.sorensen-counselor]], 279–82 (Sorensen''s account, written in 2008; Kennedy: "Oh, I thought I was going to have to go off the cuff on national television"; Robert Kennedy recalled that when he returned about 7 p.m. the first draft was unsatisfactory; the other edits, and the closing''s repeated statistics, not entered); [[w.purdum-idea-whose-time-has-2014]], 35–36, 57 (Kennedy with Robert Kennedy and Marshall in the Cabinet Room, scratching notes, 35–36; Sorensen drafting in his office, 36; Kennedy''s edits, "cesspools of segregation" to "difficulties over," "social revolution" to "a great change," "shamefully slow" to "very," 57; not the visit, Sorensen''s remark nor the hour). See [[cal.1963-06-11.civil-rights-bill-2]]. Names: Sorensen, Kennedy, Robert Kennedy, Marshall. Check: the hours of the visit and the markup.'
    src:
      c: dcaed531
      rows:
        - 'w.sorensen-counselor 279–82: ?'
        - 'w.purdum-idea-whose-time-has-2014 35–36, 57: 1, 3'
    tags: [name:sorensen-theodore-c, name:kennedy-john-f, name:kennedy-robert-f, name:marshall-burke]
