    c: Bundy, Rostow, Kaysen, Sorensen and Schlesinger meet on Sorensen's draft of the President's speech on peace for June 10, which contains the announcement of a moratorium on nuclear testing. Neither Rusk nor McNamara, so far as Schlesinger can tell, has seen the draft or knows of the announcement. The five think the speech fine and suggest only minor changes; State and Defense are informed in the afternoon. Sorensen flies to Honolulu, where the President addresses the Mayors' Conference the next day. By Schlesinger's journal.
