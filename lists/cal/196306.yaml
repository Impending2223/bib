  - id: cal.1963-06-22.civil-rights-bill
    when: June 22
    date: '1963-06-22'
    place: washington
    thread: civil-rights-bill
    also: [king, civil-rights-organizations]
    follows:
      - cal.1963-06-22.king
    c: 'Kennedy meets some thirty civil rights leaders, King, Randolph, Wilkins, Young, Farmer, and Lewis among them.{1} He asks them to call off the march on Washington;{2} they decline.{3} Before it, in the Rose Garden, he tells King to drop Levison and O''Dell.{4} The Cabinet Room.{5} Kennedy: "We want success in Congress, not just a big show at the Capitol."{6} Randolph: "The Negroes are already in the streets."{7} King: "It is not a matter of either/or, but of both/and."{8} In the Rose Garden, Kennedy to King: "I assume you know that you''re under very close surveillance."{9} Johnson there.{10} Robert Kennedy speaks briefly; Schlesinger there at his request. Kennedy: Bull Connor "has done more for civil rights than almost anybody else"; the administration''s approval in the Gallup poll down from 60 to 47 percent.{11} In the Rose Garden, of Levison and O''Dell: "They''re Communists; you''ve got to get rid of them"; "If they shoot you down, they''ll shoot us down, too."{12}'
    n: '[[w.schlesinger-thousand-days-1965]], 968–71; [[w.garrow-bearing-the-cross]], 271–73; [[w.navasky-kennedy-justice]], 142–43 (King with Marshall in the morning, then Robert Kennedy and the President: O''Dell and Levison; the Rose Garden, by a King lieutenant''s account); [[w.mann-walls-of-jericho]], 370–71; [[w.branch-parting-the-waters]], 835–41; [[w.kotz-judgment-days]], 64, 68–69 (Kennedy and Johnson against the March; the Rose Garden: "They''re Communists; you''ve got to get rid of them"); [[w.thomas-robert-kennedy]], 249, 252–53 (some 1,500 leaders through the White House before; "We''re in this up to our neck"; in the Rose Garden: "I assume you know that you''re under very close surveillance"; Levison O''Dell''s "handler"; Profumo; "Get rid of them"); [[w.young-easy-burden]], 264, 316 (Young with King; the walk in the Rose Garden, Levison and O''Dell); [[w.whalen-longest-debate]], 20–21 ("We want success in Congress, not just a big show at the Capitol"; Randolph: "The Negroes are already in the streets"); [[w.schlesinger-robert-kennedy-and-his]], 349 (the cabinet room, June 22: the President against a march before the bill is in committee, "an atmosphere of intimidation"; Randolph, Farmer and King defend the march; by the author''s journal); [[w.caro-passage-of-power]], 262 (June 22, the Cabinet Room, twenty-nine civil rights leaders; not the march nor the Rose Garden); [[w.schlesinger-journals]], 195–98 (Saturday morning, the Attorney General having asked Schlesinger to come: the Cabinet Room, King, Wilkins, Farmer, Whitney Young and A. Philip Randolph; Kennedy against the march before the bill was even in committee: "We want success in Congress, not just a big show at the Capitol"; King: "It is not a matter of either/or, but of both/and"; Kennedy on Bull Connor, the Gallup poll (approval 60 to 47) and Negro children in school; the page does not give the number of leaders, a request to call off the march or the Rose Garden); [[w.risen-bill-of-the-century]], 80–83 (the thirty leaders; Kennedy against the march, the leaders decline; his private words to King on the FBI''s suspicions, the two advisers unnamed; the executive order the same day); [[w.purdum-idea-whose-time-has-2014]], 86–90 (the warning in the Rose Garden before the meeting, Levison and O''Dell; the meeting in the Cabinet Room with the six leaders, Kennedy against a march as "a big show," Randolph and King for it; not the number present, nor a request to call it off); [[w.schlesinger-journals]], 196–97; [[w.kotz-judgment-days]], 68–69. [[w.reeves-president-kennedy]], 529–31 (the meeting; the march; Levison and O''Dell); [[w.branch-pillar-of-fire]], 114. Check: Branch, 835–41: King with the President at 10:10 a.m., the group at 10:30 (the appointments log, 837 n.2); Burke Marshall first, Levison "a paid agent of the Soviet Communist apparatus"; then Robert Kennedy; in the Rose Garden the President: "I assume you know you''re under very close surveillance," O''Dell "the number five Communist in the United States," Levison his "handler," Profumo and Macmillan; in the Cabinet Room his poll, 60 to 47 percent, "I may lose the next election because of this. I don''t care"; Wilkins and the Leadership Conference to lobby; to Whitney Young, "We want success in the Congress, not a big show on the Capitol"; Randolph: "There will be a march"; Johnson for corridor politics; King: "Some people thought Birmingham was ill-timed." "Including the Attorney General." The *New York Times*: "Negroes Inform Kennedy of Plan for New Protests." Wilkins of the march: "That little baby does not belong to me.". Check: Kotz, 79, has Robert Kennedy see King first: "You haven''t broken with Levison"; King: "Yes, I have"; Kennedy: "I have a tape of a conference call that you and three others had with Levison," the call of June 10 (Schlesinger''s interview with Levison, Aug. 3, 1976, and the taps of June 10 and 12, cited 79 n.55). Check: Young, 264, 316, puts the walk in the Rose Garden after the meeting. King with Marshall and Robert Kennedy before the meeting: [[w.navasky-kennedy-justice]], 142–43. Check: Caro, 262, has the President leave the meeting early, for the trip to West Germany, and ask Johnson to preside; Robert Kennedy, with a boat to catch, has Louis Martin tell Johnson to cut it short. To check: [[w.garrow-fbi-and-martin-luther]]; [[w.levingston-kennedy-and-king]]; Schlesinger, journal, June 22, 1963, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 349 n.29). See [[cal.1963-06-11.civil-rights-bill]]. Check: Garrow, 272–73, has the Rose Garden talk after the meeting, not before; so [[w.schlesinger-robert-kennedy-and-his]], 357, by King''s accounts to Young and Levison. Names: Martin Luther King, Randolph, Wilkins, Young, Farmer, Lewis, Levison, O''Dell, Johnson, Robert Kennedy, Schlesinger, Connor.'
