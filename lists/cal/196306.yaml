    c: 'Kennedy in West Berlin, with Brandt and Adenauer. The wall seen from a platform. Rudolph Wilde Platz: "Ich bin ein Berliner"; "Lass'' sie nach Berlin kommen." The Free University the same afternoon.'
    n: '[Remarks in the Rudolph Wilde Platz, Berlin](https://www.presidency.ucsb.edu/documents/remarks-the-rudolph-wilde-platz-berlin) (June 26, 1963). Address at the Free University of Berlin, [1963 Pub. Papers 526](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=584) (June 26, 1963). In Berlin from 9:45 a.m. to 5:30 p.m., by the notes: Remarks Upon Arrival at Tegel Airport in Berlin, [1963 Pub. Papers 522](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=580); Remarks at Tegel Airport, Berlin, Upon Leaving for Ireland, [1963 Pub. Papers 530](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=588) (June 26, 1963). Remarks, Rudolph Wilde Platz (K–J Adm. II.I). [[w.reeves-president-kennedy]], 535–37; [[w.rusk-as-i-saw-it-1990]], 227 (Rusk beside Adenauer during the speech; Adenauer afterward: "Does this mean that Germany could have another Hitler?"); [[w.schwartz-lyndon-johnson-and-europe]], 9 (the "dramatic Berlin speech" and the "huge and enthusiastic crowds"; the U.S. mission in Berlin: "a great day"; not Brandt, Adenauer, the wall, the words or the Free University); [[w.odonnell-johnny-we-hardly-knew]], 409–11 (West Berlin, June 26: a forty-mile tour, more than half the city''s population in the streets; the wall seen that morning; at the Brandenburg Gate a guard hands Kennedy a bouquet thrown over the wall with a note asking that it be given to him; at Checkpoint Charlie a small group of East Berliners beyond the gate wave and cheer; the square outside the Schöneberg City Hall: "Ich bin ein Berliner," "Let—them—come—to—Berlin!"; the Free University speech after it, with the ad-libbed "As I said this morning"; not Brandt, Adenauer, the platform, the square''s name or the German words of D); [[w.sorensen-counselor]], 323–25 (Sorensen on the City Hall steps behind Kennedy; the closing line with "ein" and what it means in German, for which he takes responsibility; Brandt''s memoirs say Sorensen rehearsed the line with him at dinner in Bonn the evening before, which Sorensen doubts; Kennedy''s toast at the City Hall luncheon "to the people of Berlin on both sides of the wall"; his afternoon speech at the Free University; not Adenauer, the platform at the wall or the German words). [[w.sorensen-kennedy]], 600 (the reception). To check: [[w.daum-kennedy-in-berlin]]; [[w.brandt-begegnungen-und-einsichten]]; [*New York Times*, June 27, 1963](https://timesmachine.nytimes.com/timesmachine/1963/06/27/issue.html) (cited by [[w.reeves-president-kennedy]], 535); FRUS 1961–63, XV, 536–37; *Newsweek*, July 8, 1963, at 31; DDF 1963, I, doc. 224, 659–62 (cited by [[w.schwartz-lyndon-johnson-and-europe]], 251 nn.2, 3, 5). See [[cal.1963-06-23.europe-and-the-alliance]]. See [[cal.1961-08-13.berlin-and-vienna]]. Names: Brandt, Adenauer.'
