  - id: cal.1963-06.civil-rights-organizations
    when: June
    date: 1963-06
    thread: civil-rights-organizations
    c: McDew resigns as SNCC's chairman, for his health. An emergency meeting of the coordinating committee elects Lewis to finish the term. Check the date.
    n: 'Lewis to Emily Stoper, 1967, [interview](https://www.crmvet.org/nars/lewisj.htm), in [[w.stoper-student-nonviolent-coordinating-committee]]. SNCC Digital Gateway (K–J Cong. II.L). To check: [[w.lewis-walking-with-the-wind]]; [[w.carson-in-struggle]]. Names: Lewis, McDew.'
    tags: [name:lewis-john, name:mcdew-charles]
  - id: cal.1963-06-01.civil-rights-bill
    when: June 1
    date: '1963-06-01'
    thread: civil-rights-bill
    c: Robert Kennedy meets the administration's legal and political strategists on civil rights. The government to take the lead with broad legislation against segregation and discrimination. By Garrow's account the President and Johnson side with him; the President has a broad bill drafted and asks that the plans be kept quiet.
    n: '[[w.garrow-bearing-the-cross]], 268–69; [[w.branch-pillar-of-fire]], 92–93. To check: Berl Bernhard to Theodore Sorensen and Lee White, May 15, 1963, Civil Rights Division, Kennedy Administration microfilm files, reel 6 (Commission on Civil Rights), Justice Department FOIA release (cited by [[w.garrow-bearing-the-cross]], 269 n.42). Check: Caro and Dallek give Johnson''s doubts on the bill''s timing, June 3; see [[cal.1963-06-03.civil-rights-bill]]. Names: Robert F. Kennedy, Kennedy, Johnson. Check: Branch, 92–93, from the recording, has the President, Robert Kennedy, Sorensen, Marshall and Johnson in the Oval Office, Johnson saying little ("I haven''t seen it"; Kennedy: "I haven''t seen it either"), Robert Kennedy counting some thirty demonstrations that week.'
    src:
      c: c1b2e566
      rows:
        - 'w.garrow-bearing-the-cross 268–69: all'
        - 'via w.garrow-bearing-the-cross 269 n.42a: all'
        - 'via w.garrow-bearing-the-cross 269 n.42b: all'
        - 'w.branch-pillar-of-fire 92–93: A'
        - 'via w.branch-pillar-of-fire 93 n.the-vice-president-wilted: A'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1963-06-01.mississippi
    when: June 1
    date: '1963-06-01'
    thread: mississippi
    c: Jackson. Wilkins, the NAACP's executive secretary, arrested picketing outside the downtown Woolworth's, his first arrest in nearly thirty years; he bails out and flies home the same evening, leaving the NAACP's lawyers to turn from pickets to litigation.
    n: '[[w.branch-pillar-of-fire]], 101–02. See [[cal.1963-05-28.mississippi]]. Names: Wilkins.'
    src:
      c: 2ad1fc3a
      rows:
        - 'w.branch-pillar-of-fire 101–02: all'
    tags: [name:wilkins-roy, state:ms]
  - id: cal.1963-06-01.march-on-washington
    when: June 1
    date: '1963-06-01'
    thread: march-on-washington
    c: 'King, Clarence Jones and Levison by telephone, overheard on the FBI''s tap: King, of Wilkins''s arrest, "We''ve baptized brother Wilkins!"; "We are on a breakthrough, and we need a mass protest." Randolph''s planned rally for jobs in Washington to be enlarged; a crowd of a hundred thousand needed, August the earliest.'
    n: '[[w.branch-pillar-of-fire]], 102–03. To check: Wiretap conversation ofJune 2, 1963, FLNY-9-186a, p. 3 (cited by [[w.branch-pillar-of-fire]], 102); Wiretap conversation ofJune 1, 1963, FLNY-9-185a (cited by [[w.branch-pillar-of-fire]], 102); Wiretap conversation of June 1, 1963, FLNY-9-185a (cited by [[w.branch-pillar-of-fire]], 102). Made public: Check; Branch cites the FBI''s Levison file. See [[cal.1963-06-01.mississippi]]. Names: Martin Luther King, Levison, Wilkins, Randolph.'
    src:
      c: ef58ccf0
      rows:
        - 'w.branch-pillar-of-fire 102–03: all'
        - 'via w.branch-pillar-of-fire 102 n.weve-baptized-brother-wilkins: all'
        - 'via w.branch-pillar-of-fire 102 n.we-are-on-a: all'
        - 'via w.branch-pillar-of-fire 102 n.roy-will-only-act: all'
    tags: [name:king-martin-luther-jr, name:levison-stanley-d, name:wilkins-roy, name:randolph-a-philip]
  - id: cal.1963-06-03.court
    when: June 3
    date: '1963-06-03'
    thread: court
    also: [desegregation-schools]
    c: '*Goss v. Board of Education*, [373 U.S. 683](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373683/usrep373683.pdf). Knoxville''s transfer plan, letting a pupil leave a school where his race is in the minority, struck down. Clark for a unanimous Court.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1963-06-03.civil-rights-bill
    when: June 3
    date: '1963-06-03'
    thread: civil-rights-bill
    c: 'Johnson to Sorensen by telephone, on the civil rights bill the papers report: "I''ve never seen it." A bill sent now would fail. First the President in the South, the moral issue "face to face"; then the Negro leaders; then the congressional leaders.'
    n: '[[w.dallek-flawed-giant]], 37 (from the conversation in the Vice Presidential Papers, Civil Rights, LBJ Library); [[w.caro-passage-of-power]], 258–61 (the call: not seen the bill, the timing, the President''s moral commitment; before it, a 10 a.m. meeting on the bill in the Oval Office, Kennedy asking Johnson to give Sorensen his views); [[w.mann-walls-of-jericho]], 360–63 (recorded by Dictaphone; the South first, the moral issue face to face; Russell to be consulted, and the Republicans). [[w.reeves-president-kennedy]], 504–505; [[w.branch-pillar-of-fire]], 93–95. White OH, LBJ Library; Johnson''s conversation with Sorensen, June 3, 1963, Vice Presidential Papers: Civil Rights, LBJ Library; Norbert Schlei to Robert Kennedy, June 4, 1963, Attorney General''s Papers, JFK Library; Johnson to Sorensen, June 10, 1963, Theodore Sorensen Papers, JFK Library (cited by [[w.dallek-flawed-giant]], 37); Transcript of dictaphone recording, Johnson–Sorensen, June 3, 1963, Johnson Library (cited by [[w.reeves-president-kennedy]], 504). Names: Johnson, Sorensen.'
