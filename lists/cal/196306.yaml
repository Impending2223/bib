    c: 'Leaving West Berlin for Ireland, over East Germany.{1} Kennedy, glowing: Americans would see their efforts and risks appreciated;{2} he would leave his successor a note "to be opened at a time of some discouragement": "Go to Germany."{3} To Sorensen, in the cabin of Air Force One: "We''ll never have another day like this one as long as we live."{4} By Sorensen''s account.{5}'
    n: '[[w.sorensen-kennedy]], 601; [[w.reeves-president-kennedy]], 537 (the sealed letter, "Go to Germany," told to Adenauer; the remark to Sorensen on the flight to Ireland); [[w.odonnell-johnny-we-hardly-knew]], 410 (that afternoon, boarding Air Force One to leave Germany, Kennedy "said to us," the authors: "We''ll never have another day like this one"; not Sorensen, the cabin, East Germany, the sealed note or "as long as we live"); [[w.sorensen-counselor]], 325 (at day''s end Kennedy, weary, climbs into Air Force One and sinks into a chair opposite Sorensen: "We will never have another day like this one"; Sorensen''s account, written in 2008; not the flight to Ireland or the note for his successor). Check: Counselor, 325, has "We will never have another day like this one"; the entry has "We''ll never have another day like this one as long as we live.". See [[cal.1963-06-26.berlin-and-vienna]]. Names: Kennedy, Sorensen.'
