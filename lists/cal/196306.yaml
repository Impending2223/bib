  - id: cal.1963-06-03.cuba
    when: June 3
    date: '1963-06-03'
    thread: cuba
    c: The Special Group finds it a "useful endeavor" to explore "various possibilities of establishing channels of communication to Castro."
    n: '[S. Rep. No. 94-465, 173 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=184) (the memorandum of the meeting, June 6). [[w.schlesinger-robert-kennedy-and-his]], 543. See [[cal.1963-01-04.cuba]]. Names: Castro.'
