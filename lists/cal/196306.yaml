  - id: cal.1963-06-27.europe-and-the-alliance-kennedy-in
    when: June 27
    date: '1963-06-27'
    thread: europe-and-the-alliance-kennedy-in-europe
    also: [democratic-party]
    c: 'The American Embassy, Phoenix Park, the morning after the arrival. Kennedy to Ambassador McCloskey, who had been "rewarded with the Ambassadorship for his champion fund-raising efforts": "Matt, this is a much better place than the White House. The party is running into debt, and we need you back there." McCloskey: "If you need money, send Dick Maguire over here and I''ll tell him who to see." Kennedy announces that in 1968 he will support the Democratic candidate who promises to appoint him Ambassador to Ireland.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 412–13 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, McCloskey.'
    tags: [name:kennedy-john-f, name:mccloskey-matthew-h-jr]
  - id: cal.1963-06-27.europe-and-the-alliance-kennedy-in-2
    when: June 27
    date: '1963-06-27'
    thread: europe-and-the-alliance-kennedy-in-europe
    c: The American Embassy, Phoenix Park, the morning. Kennedy talks with Prime Minister Lemass.
    n: '[[w.odonnell-johnny-we-hardly-knew]], 413 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-27.europe-and-the-alliance-kennedy-in-3
    when: June 27
    date: '1963-06-27'
    thread: europe-and-the-alliance-kennedy-in-europe
    c: 'New Ross, the riverside docks where his great-grandfather took ship. Schoolchildren spell out FAILTE on the park grass; others sing "The Boys of Wexford," and Kennedy asks for another verse, sings with them and pockets the card of the words. Of his great-grandfather: "he carried nothing with him except two things, a strong religious faith and a strong desire for liberty."'
    n: 'Remarks on the Quay at New Ross, [1963 Pub. Papers 531](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=589) (June 27, 1963). [[w.odonnell-johnny-we-hardly-knew]], 413 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-27.europe-and-the-alliance-kennedy-in-4
    when: June 27
    date: '1963-06-27'
    thread: europe-and-the-alliance-kennedy-in-europe
    c: 'Dunganstown, the old Kennedy farm. Kennedy greets Mary Ryan and other cousins in the cottage, a turf fire, cold salmon, tea. A cousin pours him a large Irish whisky; he hands it behind his back to Powers, who drinks it. Toast: "to all the Kennedys who went and those who stayed." At Mary Ryan''s demand, before Frank Aiken can take him on to Wexford, he plants a juniper tree in the garden; he kisses her cheek, his sisters Eunice and Jean looking on.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 414–15 (O''Donnell''s and Powers''s account). See [[cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe]]. Names: Kennedy, Powers, Eunice Shriver.'
    tags: [name:kennedy-john-f, name:powers-david-f, name:aiken-frank, name:shriver-eunice-kennedy]
