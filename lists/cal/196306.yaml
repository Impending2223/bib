        - 'w.schlesinger-thousand-days-1965 900–02: all'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 346 n.85: all'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s, name:macmillan-harold]
  - id: cal.1963-06-10.oil
    when: June 10
    date: '1963-06-10'
    thread: oil
    c: 'Kennedy, Proclamation 3541: from July 1, the 12.2 percent taken of the production the Secretary of the Interior estimates for the allocation period itself.'
    n: '[Proclamation 3541](https://www.presidency.ucsb.edu/documents/proclamation-3541-modifying-adjusting-imports-petroleum-and-petroleum-products), [28 Fed. Reg. 5931](https://www.govinfo.gov/app/details/FR-1963-06-13). See [[cal.1962-11-30.oil]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-11.alabama
    when: June 11
    date: '1963-06-11'
    thread: alabama
    also: [desegregation-schools]
    c: The schoolhouse door. Wallace bars Katzenbach at Foster Auditorium, Tuscaloosa. The Alabama Guard federalized; that afternoon Wallace stands aside. Vivian Malone and James Hood registered.
    n: '[Proclamation No. 3542](https://www.presidency.ucsb.edu/documents/proclamation-3542-unlawful-obstructions-justice-and-combinations-the-state-alabama). [Exec. Order No. 11,111](https://www.presidency.ucsb.edu/documents/executive-order-11111-providing-assistance-for-the-removal-obstructions-justice-and), [28 Fed. Reg. 5709](https://www.govinfo.gov/app/details/FR-1963-06-12) (1963). Telegram to Governor Wallace Concerning the Admission of Negro Students to the University of Alabama, [1963 Pub. Papers 466](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=524) (June 10, 1963). Wallace, University of Alabama (K–J Cong. II.K). [[w.schlesinger-robert-kennedy-and-his]], 337–42. To check: [[w.crisis]]; [[w.carter-politics-of-rage-1995]]; [[w.clark-schoolhouse-door]]; [[w.lesher-george-wallace]]; [[w.katzenbach-some-of-it-was]]. Names: Wallace, Katzenbach, Malone, Hood.'
    tags: [name:kennedy-john-f, name:wallace-george-c, name:katzenbach-nicholas, name:malone-vivian, name:hood-james-a]
  - id: cal.1963-06-11.civil-rights-bill
    when: June 11
    date: '1963-06-11'
    thread: civil-rights-bill
    c: Address on civil rights, 8 p.m., partly extemporized. "A moral issue," "as old as the scriptures and as clear as the American Constitution." Congress to be asked for a law.
    n: 'Radio and Television Report to the American People on Civil Rights, [1963 Pub. Papers 468](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=526) (June 11, 1963). Address on civil rights (K–J Adm. II.I). [[w.rosenberg-kennedy-johnson-and-the]], "The Bill and the March"; [[w.schlesinger-robert-kennedy-and-his]], 343–44. To check: [[w.berman-bill-becomes-a-law]]; [[w.whalen-longest-debate]]; [[w.loevy-to-end-all-segregation]]; [[w.mann-walls-of-jericho]]; [[w.civil-rights-act-of]]; [[w.risen-bill-of-the-century]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.brauer-john-f-kennedy-and]]; [[w.stern-calculating-visions]]; [[w.bryant-bystander]]; [[w.kotz-judgment-days]]; [[w.levingston-kennedy-and-king]]; [[w.sorensen-kennedy]]; [[w.robert-kennedy-in-his]]. See [[cal.1963-06-11.alabama]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-11.vietnam
    when: June 11
    date: '1963-06-11'
    thread: vietnam
    c: Thích Quảng Đức burns himself to death at a Saigon intersection, ringed by monks. Browne's photograph.
    n: 'FRUS 1961–63, III, docs. [163](https://history.state.gov/historicaldocuments/frus1961-63v03/d163), [164](https://history.state.gov/historicaldocuments/frus1961-63v03/d164). [[w.miller-misalliance]], 270–73; [[w.gibbons-u-s-government-and]], II, 144; [[w.schulimson-joint-chiefs-of-staff]], 314; [[w.futrell-united-states-air-force]], 186 (the burning, June 11). To check: [[w.browne-new-face-of-war]]; [[w.browne-muddy-boots-and-red]]; [[w.prochnau-once-upon-a-distant]]; [[w.king-they-who-burned-themselves]]; [[w.biggs-dying-without-killing]]; Miller''s interview with Malcolm Browne, Oct. 2009 (cited by [[w.miller-misalliance]], 271 n.84); Martin and Clever, III, 65-70 (cited by [[w.futrell-united-states-air-force]], 186 n.5a); msg, CINCPAC to MACV, Jun 5, 1963 (cited by [[w.futrell-united-states-air-force]], 186 n.5b). See [[cal.1963-05-08.vietnam]]. Names: Thích Quảng Đức, Browne.'
