    c: 'Lunch of Harriman, Ray Cline and Schlesinger, on Harriman''s impending mission to Moscow. Harriman: "Each of the nations has an urgent political interest. We want to get the Russian troops out of Cuba. The British want a test ban agreement. The Russians want a guarantee against the nuclear armament of Germany—and I agree with them on this point." He has no belief in the multilateral nuclear force and would go quite far to meet the Soviet wishes on Germany to get movement elsewhere, such as the test ban; none of the three optimistic of an agreement. By Schlesinger''s journal.'
