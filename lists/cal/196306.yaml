    n: '[[w.dittmer-local-people]], 170–73; [[w.branch-pillar-of-fire]], 106. Check: the day; Dittmer, 170, 173: a Sunday, nine days before June 18. To check: [[w.mills-this-little-light-of]]; June Johnson''s affidavit, undated, Jan Hillegas Collection (cited by [[w.dittmer-local-people]], 171 n.2); "Verbatim transcript of interview by phone by Jack Minnis with Mrs; Wiretap conversation of 12:01 a.m., June 10, 1963, FLNY-9-194 (cited by [[w.branch-pillar-of-fire]], 106); Memo, C. A. Evans to Hoover, June 11, 1963, cited in Mills, Fannie Lou Hamer, p. 36 (cited by [[w.branch-pillar-of-fire]], 106). Fannie Lou Hamer," June 13, 1963, SNCC Papers, reel 38 (cited by [[w.dittmer-local-people]], 172 n.4). Names: Hamer, Ponder, June Johnson, Guyot.'
