    also: [soviet-union, china-foreign]
    c: 'Zhou Enlai at the enlarged Politburo, which takes up the Central Committee''s statement, to come out July 1, on the talks between the Chinese and Soviet parties.{1} Liu Shaoqi 刘少奇 presides. The meeting adopts the statement and the line the delegation is to take at the talks in Moscow, July 5–20.{2} It meets at 8 p.m.; the statement is to be broadcast at midnight; Yang Shangkun 杨尚昆 is there.{3} Deng Xiaoping 邓小平: the talks can bring no positive result now; the outcome can only be "drag" or "break"; Khrushchev dares not break now, but China must prepare for a break.{4} Zhu De 朱德 attends.{5}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 562 (June 30, 1963); [[w.lengxi-shinian-lunzhan-1956-1966]], 599 (Wu: June 30, Liu Shaoqi presides at the enlarged Politburo, which hears the analysis, line and tactics of Mao and the Standing Committee for the talks, agrees after careful discussion and passes the Central Committee''s statement, published July 1); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 579 (June 30, 1963; Liu presides at the enlarged Politburo meeting, which adopts the Central Committee''s statement on the talks of the two parties (published in the *People''s Daily* July 1) and the line the Chinese delegation is to take at the talks, July 5–20 at Moscow); [[w.yang-shangkun-riji]], II, 291 (June 30, 1963; the enlarged Politburo, 8 p.m., adopts the Center''s statement, to be broadcast at midnight; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1761 (June 30, 1963; evening, 晚; Deng at the enlarged Politburo meeting, which adopts the statement on the Sino-Soviet party talks and the delegation''s line; Deng says the talks can bring no positive result now, neither side ready for a compromise; the outcome can only be ''drag'' or ''break''; he judges Khrushchev dare not break now, but the Chinese must prepare for a break); [[w.mao-zedong-zhuan]], V, ch. 71 (evening; Liu presides at the enlarged Politburo, which adopts the Center''s statement and the delegation''s line; Deng: "drag" or "break," not to break first (n.24); Zhou: the "edge," "one break, two drag" (n.24)). [[w.zhu-de-nianpu-xinbian]], III, 1880 (June 30, 1963; Zhu De 朱德 at the enlarged Politburo 中共中央政治局扩大会议, which adopts the Center''s statement on the talks of the Chinese and Soviet parties 《关于中苏两党会谈的声明》 (in *Renmin ribao* 人民日报 July 1) and the line the Chinese delegation is to take at the talks, held in Moscow July 5–20); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 579; [[w.yang-shangkun-riji]], II, 291; [[w.deng-xiaoping-nianpu-1904]], III, 1761; [[w.zhu-de-nianpu-xinbian]], III, 1880. Made public: 1996. To check: Enlarged Politburo meeting 中共中央政治局扩大会议, record 记录, June 30, 1963 (Deng Xiaoping''s and Zhou Enlai''s remarks) (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.24). Names: Zhou Enlai, Liu Shaoqi, Yang Shangkun, Deng Xiaoping, Khrushchev, Zhu De.'
