    n: '[[w.zedong-mao-zedong-nianpu]], V, June 12, 1963; [[w.zhou-enlai-nianpu-1949]], II, 559 (June 12, 1963: Zhou Enlai at the Politburo on the reply to the CPSU letter of Mar. 30; the letter goes out June 14 as "A Proposal Concerning the General Line of the International Communist Movement," stating the Chinese Central Committee''s views on the general line, the basic contradictions of the world, the proletariat and its dictatorship, and war and peace, as a proposal for the content of the two parties'' talks); [[w.lengxi-shinian-lunzhan-1956-1966]], 576–577 (Wu: June 12, Liu Shaoqi presides at the full Politburo, which passes the revised reply; all the drafts had been sent to its members beforehand; few changes, passed quickly; the draft''s first title "Reply of the Chinese Central Committee to the CPSU Central Committee''s letter of Mar. 30" is changed at the last drafting by Mao); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 579 (June 12, 1963; Liu presides at the Politburo meeting, which adopts the "Proposal Concerning the General Line of the International Communist Movement," the reply to the CPSU letter of Mar. 30, and prepares the list of the Chinese delegation to the July talks of the two parties); [[w.yang-shangkun-riji]], II, 286 (June 12, 1963; the Politburo, in the afternoon, settles the reply finally, to go to Moscow on the 15th, and adopts the list of the delegation; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1759–1760 (June 12, 1963; Deng at the Politburo meeting Liu Shaoqi presides over, which adopts the reply, titled on Mao''s proposal ''A proposal concerning the general line of the international communist movement'' 《关于国际共产主义运动总路线的建议》; Deng reports how it was drafted and revised: the hardest of all the papers, near seventy days, a programmatic paper); [[w.mao-zedong-zhuan]], V, ch. 71 (Liu presides; Deng reports how the reply was drafted and revised, from 21 points to 25; the draft of June 10; the Politburo adopts it, to be handed over