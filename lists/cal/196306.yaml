    n: '*Beckwith v. State*, [707 So. 2d 547](https://static.case.law/so2d/707/case-pdfs/0547-01.pdf) (Miss. 1997). [[w.dittmer-local-people]], 165–67 (the shooting at 12:20 a.m.; Arlington; not the arrest''s day). To check: [[w.evers-for-us-the-living]]; [[w.autobiography-of-medgar-evers]]; [[w.williams-medgar-evers]]; [[w.nossiter-of-long-memory]]; [[w.vollers-ghosts-of-mississippi]]; *New York Times*, June 13 and 14, 1963 (cited by [[w.dittmer-local-people]], 166 n.55). See [[cal.1963-05-28.mississippi]]. Names: Evers, Beckwith.'
