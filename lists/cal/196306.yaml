  - id: cal.1963-06-12.program
    when: June 12
    date: '1963-06-12'
    thread: jobs-and-wages
    c: House rejects the area redevelopment amendments, [204–209](https://voteview.com/rollcall/RH0880036).
    n: 'Statement by the President Following Defeat of the Area Redevelopment Bill, [1963 Pub. Papers 475](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=533) (June 13, 1963). To check: [[w.levitan-federal-aid-to-depressed]]. See [[cal.1961-05-01.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-13.middle-east
    when: June 13
    date: '1963-06-13'
    thread: middle-east-yemen
    c: 'Yemen. Kennedy approves Hard Surface: eight F-100D fighters and a transport to Saudi Arabia, on condition that Saudi aid to the royalists end.'
    n: 'FRUS 1961–63, XVIII, docs. [268](https://history.state.gov/historicaldocuments/frus1961-63v18/d268) (Rusk to Kennedy, June 12), [270](https://history.state.gov/historicaldocuments/frus1961-63v18/d270) (editorial note). To check: [[w.hart-saudi-arabia-and-the]]; [[w.bass-support-any-friend]]. See [[cal.1963-03-01.middle-east]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-14.transportation
    when: June 14
    date: '1963-06-14'
    thread: transportation
    c: 'The supersonic transport, to Congress: development could cost $1 billion over six years; the makers to pay at least 25 percent, the airlines royalties; the government''s share not over $750 million.'
    n: 'Letter to the President of the Senate and to the Speaker of the House on Development of a Civil Supersonic Air Transport, [1963 Pub. Papers 475](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=533) (June 14, 1963). See [[cal.1963-06-05.transportation]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-14.middle-east-yemen
    when: June 14
    date: '1963-06-14'
    thread: middle-east-yemen
    c: Faisal, after Celler's statement on the sending of Jewish servicemen, asks Washington to denounce it and bars American servicemen until it does. The unit's movement halted, June 15.
    n: '[FRUS 1961–63, XVIII, doc. 272](https://history.state.gov/historicaldocuments/frus1961-63v18/d272). See [[cal.1963-06-13.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Celler.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:celler-emanuel]
  - id: cal.1963-06-16.opinion
    when: June 16
    date: '1963-06-16'
    thread: opinion
    also: [desegregation-public-places, alabama]
    c: 'Gallup, May 23–28: the Kennedy administration pushing integration too fast, 36 percent; not fast enough, 18; about right, 32. Southern whites, 62 too fast.'
    n: '[[w.gallup-poll]], III, 1823. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-16.vietnam
    when: June 16
    date: '1963-06-16'
    thread: vietnam
    c: 'The government''s Interministerial Committee and the Buddhist delegation issue a joint communiqué after talks of June 14–16: the national and Buddhist flags; religious associations taken out of Ordinance No. 10; a committee to re-examine the Buddhists'' complaints; a pardon for those in the movement.'
