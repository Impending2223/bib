    c: 'Leaving West Berlin for Ireland, over East Germany. Kennedy, glowing: Americans would see their efforts and risks appreciated; he would leave his successor a note "to be opened at a time of some discouragement": "Go to Germany." To Sorensen, in the cabin of Air Force One: "We''ll never have another day like this one as long as we live." By Sorensen''s account.'
