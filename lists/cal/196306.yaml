    c: 'Civil rights message.{1} Public accommodations;{2} school suits by the Attorney General;{3} a Community Relations Service;{4} no federal funds for discrimination;{5} in voting suits, a sixth-grade education presumed literacy.{6} Fair employment backed, not asked.{7} Celler''s bill, H.R. 7152, June 20.{8} In the Senate Mansfield introduces three bills June 19: the whole program, thirty-seven Democrats and nine Republicans sponsoring; with Dirksen, all but public accommodations; with Magnuson, public accommodations alone.{9}'
    n: 'Special Message to the Congress on Civil Rights and Job Opportunities, [1963 Pub. Papers 483](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=541) (June 19, 1963). [[w.branch-pillar-of-fire]], 114; [[w.sorensen-kennedy]], 496–99 (the message and bill); [[w.sundquist-politics-and-policy]], 263; [[w.mann-walls-of-jericho]], 371 (Mansfield''s three bills, June 19: the whole program, thirty-seven Democrats and nine Republicans sponsoring; with Dirksen, all but public accommodations; with Magnuson, public accommodations alone; Celler''s, June 20); [[w.zelizer-fierce-urgency-of-now]], 49–50; [[w.bernstein-guns-or-butter]], 43, 45 (the omnibus measure; its titles); [[w.reeves-president-kennedy]], 527–28 (the White House bill, seven titles, introduced June 19; Title II on public accommodations); [[w.obrien-no-final-victories]], 144 (the civil rights bill sent to Congress on June 19: a ban on discrimination in public accommodations, authority for the Attorney General to seek school desegregation, a Community Relations Service; not the rest); [[w.risen-bill-of-the-century]], 77–78 (the message and the seven titles of H.R. 7152; fair employment endorsed, not in the bill; the sixth-grade presumption, not said to be in voting suits); [[w.civil-rights-presidents-program-1963]], 1–12 (S. 1731, the program as a Senate bill: "most of the recommendations" of the messages of Feb. 28 and June 19, Eastland, 1); [[w.civil-rights-presidents-program-1963]], 12–20 (S. 1750: S. 1731 without its preamble and the public accommodations title, Eastland, 1); [[w.purdum-idea-whose-time-has-2014]], 60–62, 80 (the bill sent June 19: voting referees, public accommodations, school suits, a Community Relations Service, four more years for the Commission, the cutoff of federal aid, an Equal Employment Opportunity Commission; no FEPC; Mansfield''s introduction in the Senate with Dirksen''s alternative and Magnuson''s separate bill; not the sixth-grade rule); [[w.man