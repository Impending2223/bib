    c: 'The Senate Republican conference on civil rights, some seven hours: a consensus that the rights the Fourteenth and Fifteenth Amendments promise be secured by Congress as well as the President;{1} Republican Senators "will support further appropriate legislation required to help solve the problems of our Nation in the field of civil rights."{2} Saltonstall, its chairman, puts it in the Record June 6.{3} Javits: it "crystallized sentiment in my party."{4}'
