y]], 529–31 (the meeting; the march; Levison and O''Dell); [[w.branch-pillar-of-fire]], 114. Check: Branch, 835–41: King with the President at 10:10 a.m., the group at 10:30 (the appointments log, 837 n.2); Burke Marshall first, Levison "a paid agent of the Soviet Communist apparatus"; then Robert Kennedy; in the Rose Garden the President: "I assume you know you''re under very close surveillance," O''Dell "the number five Communist in the United States," Levison his "handler," Profumo and Macmillan; in the Cabinet Room his poll, 60 to 47 percent, "I may lose the next election because of this. I don''t care"; Wilkins and the Leadership Conference to lobby; to Whitney Young, "We want success in the Congress, not a big show on the Capitol"; Randolph: "There will be a march"; Johnson for corridor politics; King: "Some people thought Birmingham was ill-timed." "Including the Attorney General." The *New York Times*: "Negroes Inform Kennedy of Plan for New Protests." Wilkins of the march: "That little baby does not belong to me.". Check: Kotz, 79, has Robert Kennedy see King first: "You haven''t broken with Levison"; King: "Yes, I have"; Kennedy: "I have a tape of a conference call that you and three others had with Levison," the call of June 10 (Schlesinger''s interview with Levison, Aug. 3, 1976, and the taps of June 10 and 12, cited 79 n.55). Check: Young, 264, 316, puts the walk in the Rose Garden after the meeting. King with Marshall and Robert Kennedy before the meeting: [[w.navasky-kennedy-justice]], 142–43. Check: Caro, 262, has the President leave the meeting early, for the trip to West Germany, and ask Johnson to preside; Robert Kennedy, with a boat to catch, has Louis Martin tell Johnson to cut it short. To check: [[w.garrow-fbi-and-martin-luther]]; [[w.levingston-kennedy-and-king]]; Schlesinger, journal, June 22, 1963, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 349 n.29). See [[cal.1963-06-11.civil-rights-bill]]. Check: Garrow, 272–73, has the Rose Garden talk after the meeting, not before; so [[w.schlesinger-robert-kennedy-and-his]], 357, by King''s accounts to Young and Levison. Names: Martin Luther King, Randolph, Wilkins, Young, Farmer, Lewis, Levison, O''Dell.'
