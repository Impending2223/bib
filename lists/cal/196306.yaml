  - id: cal.1963-06-11.specials
    when: June 11
    date: '1963-06-11'
    thread: specials
    c: California 23d, special. Del Clawson (R) takes Clyde Doyle's seat over Carley Porter (D), 33,042 to 21,969, 53.2 percent, four other Democrats running. Swing 24.2 to R.
    n: '[Cal. *Statement of Vote*, Nov. 3, 1964, p. 28](https://archive.org/details/castatem196264cali/page/n177). See [[cal.1961-04-04.states-and-cities]]. Names: Clawson, Doyle, Porter.'
    tags: [special:1963-06-11-h-CA-23, name:clawson-delwin-m, name:doyle-clyde-g, name:porter-carley-v]
  - id: cal.1963-06-11.state-and-city-finance-nv
    when: June 11
    date: '1963-06-11'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: Nevada, special election on the legislature's act raising the sales and use tax from 2 percent to 3, to take effect July 1. The act refused, 17,506 to 34,906, 33.4 percent.
    n: 'Votes: [Nev. *Political History of Nevada* (12th ed., 2016), 508](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=514). To check: [[w.elliott-history-of-nevada]].'
    tags: [state:nv]
  - id: cal.1963-06-11.mayors-minneapolis
    when: June 11
    date: '1963-06-11'
    thread: mayors
    also: [elections-1963]
    c: Minneapolis re-elects Naftalin (DFL) over Peterson (R), mayor before him.
    n: '[Wikipedia, "P. Kenneth Peterson"](https://en.wikipedia.org/wiki/P._Kenneth_Peterson) (Check: the vote, from the city''s canvass). See [[cal.1961-06-13.mayors-minneapolis]]. Names: Naftalin, Peterson.'
    tags: [state:mn, city:minneapolis, name:naftalin-arthur, name:peterson-p-kenneth]
  - id: cal.1963-06-11.middle-east
    when: June 11
    date: '1963-06-11'
    thread: middle-east-yemen
    c: 'Security Council, Resolution 179, 10–0, the Soviet Union abstaining: an observation mission in Yemen to certify the disengagement. Observers in place by mid-July.'
    n: '[Resolution 179 (1963)](https://undocs.org/S/RES/179(1963)). FRUS 1961–63, XVIII, docs. [286](https://history.state.gov/historicaldocuments/frus1961-63v18/d286), [295](https://history.state.gov/historicaldocuments/frus1961-63v18/d295). See [[cal.1963-04-01.middle-east]].'
