  - id: cal.1963-06-11.civil-rights-bill-2
    when: June 11
    date: '1963-06-11'
    thread: civil-rights-bill
    c: 'The Oval Office, the schoolhouse door on television. As Wallace leaves the doorway, Kennedy to Sorensen: "I think we''d better give that speech tonight." No decision had been made and no draft prepared; O''Donnell and O''Brien opposed a speech, Sorensen had reservations. Kennedy settles on 8 p.m.; Salinger asks the networks for the time, by then after 4:30 p.m. Robert Kennedy, come with Burke Marshall: "Don''t worry, we have a lot of good material over at the Justice Department that we can send to you."'
    n: '[[w.sorensen-counselor]], 278–79 (Sorensen''s account, written in 2008; Sorensen "made some noises about limited time"; not the hour of the decision). See [[cal.1963-06-11.alabama]]. Names: Kennedy, Sorensen, Wallace, O''Donnell, O''Brien, Salinger, Robert Kennedy, Marshall.'
    tags: [name:sorensen-theodore-c, name:kennedy-john-f, name:wallace-george-c, name:odonnell-kenneth-p, name:obrien-lawrence-f, name:salinger-pierre, name:kennedy-robert-f, name:marshall-burke]
  - id: cal.1963-06-11.civil-rights-bill-4
    when: June 11
    date: '1963-06-11'
    thread: civil-rights-bill
    c: 'Sorensen drafts the civil rights address. Kennedy comes to his office, the only time in three years he did so to ask about a speech; Sorensen: "Don''t worry. It''s in the typewriter now." In the Cabinet Room, with Robert Kennedy and Burke Marshall, Kennedy marks up the first draft, mostly in tone: "The cesspools of segregation and discrimination exist in every state" becomes "difficulties over segregation and discrimination exist in every city"; "But the pace is still shamefully slow," "But the pace is very slow." At four minutes to eight Sorensen is still at work; his closing dropped for the paragraphs Kennedy had scribbled while waiting.'
    n: '[[w.sorensen-counselor]], 279–82 (Sorensen''s account, written in 2008; Kennedy: "Oh, I thought I was going to have to go off the cuff on national television"; Robert Kennedy recalled that when he returned about 7 p.m. the first draft was unsatisfactory; the other edits, and the closing''s repeated statistics, not entered). See [[cal.1963-06-11.civil-rights-bill-2]]. Names: Sorensen, Kennedy, Robert Kennedy, Marshall. Check: the hours of the visit and the markup.'
    tags: [name:sorensen-theodore-c, name:kennedy-john-f, name:kennedy-robert-f, name:marshall-burke]
  - id: cal.1963-06-11.civil-rights-bill-6
    when: June 11
    date: '1963-06-11'
    thread: civil-rights-bill
    c: 'Washington, dinner at Joe Alsop''s. When the guests say, "Let''s tune in the president''s speech," Bundy: "There isn''t going to be a speech. I just left the White House 30 minutes ago and Sorensen didn''t have a draft yet."'
    n: '[[w.sorensen-counselor]], 279 (Sorensen''s account, written in 2008; "That was true. I didn''t."). Names: Bundy, Alsop, Sorensen. Check: the hour.'
    tags: [name:sorensen-theodore-c, name:bundy-mcgeorge, name:alsop-joseph]
