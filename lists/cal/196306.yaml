    c: 'Mao, on Zhou Enlai''s June 9 draft report on the adjusted plan for the last two years of the Second Five-Year Plan and its execution: sent to Zhou to revise; read, usable. The Hangzhou conference passages (pp. 6, 35–37, 41 of the draft) not to be used for now; the statement on spring crops on p. 1 to be rewritten. Four passages are struck: on class struggle, the struggle for production and scientific experiment as three great revolutionary movements; on where correct ideas come from; on teaching the comrades the Marxist theory of knowledge; on the socialist education movement.'
