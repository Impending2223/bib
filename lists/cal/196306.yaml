      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v06/d106: A, B'
        - 'w.sorensen-kennedy 729, 734: C'
        - 'via x.1963-06-08.khrushchev-to-kennedy-moscow-talks: A-B'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f, name:macmillan-harold]
  - id: cal.1963-06-09.civil-rights-the-executive-us
    when: June 9
    date: '1963-06-09'
    thread: civil-rights-the-executive
    also: [states-and-cities]
    c: 'Kennedy to the U.S. Conference of Mayors at Honolulu: race relations "a national problem." Five steps for every city: a biracial human relations committee; ordinances and practices in accord with the Court''s rulings; Negroes hired at every level of city government; equal opportunity ordinances on jobs, housing and public accommodations; a summer drive against school dropouts.'
    n: 'Address in Honolulu Before the United States Conference of Mayors, [1963 Pub. Papers 454](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=512) (June 9, 1963). [[w.sorensen-kennedy]], 494 (the mayors asked to improve their practices and ordinances). See [[cal.1963-06-04.civil-rights-the-executive]]. Names: Kennedy.'
    src:
      c: ca36d66e
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=512: all'
        - 'w.sorensen-kennedy 494: A, C'
    tags: [name:kennedy-john-f]
