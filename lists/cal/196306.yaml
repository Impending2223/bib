    n: 'Address Before the Irish Parliament in Dublin, [1963 Pub. Papers 534](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=592) (June 28, 1963). Opinion: [1 Op. O.L.C. Supp. 278](https://www.justice.gov/olc/file/477221/dl#page=294) (1963), Schlei to Bundy, May 10: honorary Irish citizenship within the spirit of the Emoluments Clause; the President might take part in the ceremony and leave the document with the State Department, subject to Congress''s consent. [[w.reeves-president-kennedy]], 537–38 (New Ross and Dunganstown, June 27); [[w.odonnell-johnny-we-hardly-knew]], 411–22 (the visit to Ireland: Dublin on the 26th, three nights at the Embassy in Phoenix Park; New Ross and Dunganstown; Cork; Galway; Limerick; Shannon; Wexford named only as the next stop. The speech to the combined houses of the Irish parliament "later that Friday afternoon," the first ceremony in the Dail''s chamber seen on national television: Lord Mountjoy, "We have lost America through the Irish"; Joyce''s "a bowl of bitter tears"; Shaw: "Other people see things, and say why. But I dream things that never were, and I say, why not?" (416–17)); [[w.obrien-no-final-victories]], 152–54 (about fifty White House staff of Irish descent flown to Ireland; Kennedy, fresh from West Berlin, met at Dublin Airport; the motorcade and City Hall at Cork, where Kennedy has O''Brien and Powers present their relatives, O''Brien''s aunt Julia Sweeney; the choir at Shannon; O''Brien, Boland and Donahue fly on to Rome for three days; not the days). See [[cal.1963-06-23.europe-and-the-alliance]]. Names: Kennedy.'
