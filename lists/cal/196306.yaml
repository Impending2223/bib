  - id: cal.1963-06.civil-rights-organizations
    when: June
    date: 1963-06
    thread: civil-rights-organizations
    c: McDew resigns as SNCC's chairman, for his health. An emergency meeting of the coordinating committee elects Lewis to finish the term. Check the date.
    n: 'Lewis to Emily Stoper, 1967, [interview](https://www.crmvet.org/nars/lewisj.htm), in [[w.stoper-student-nonviolent-coordinating-committee]]. SNCC Digital Gateway (K–J Cong. II.L). To check: [[w.lewis-walking-with-the-wind]]; [[w.carson-in-struggle]]. Names: Lewis, McDew.'
    tags: [name:lewis-john, name:mcdew-charles]
    short: Lewis SNCC's chairman
  - id: cal.1963-06-01.civil-rights-bill
    when: June 1
    date: '1963-06-01'
    thread: civil-rights-bill
    c: Robert Kennedy meets the administration's legal and political strategists on civil rights. The government to take the lead with broad legislation against segregation and discrimination. By Garrow's account the President and Johnson side with him; the President has a broad bill drafted and asks that the plans be kept quiet.
    n: '[[w.garrow-bearing-the-cross]], 268–69; [[w.branch-pillar-of-fire]], 92–93; [[w.branch-parting-the-waters]], 813 (Johnson); [[w.whalen-longest-debate]], 16–17, 76 (the President with twelve advisers, noon, the Cabinet Room; many of them against). Check: Branch, 813, quotes Johnson at the White House meeting of June 1 (Audiotape 90.3), asked by the President: he has seen none of the drafts, knows the race problem only "from what I''ve read in the press ... I''m not competent to counsel you.". Check: Whalen, 76, has Johnson noncommittal at the meeting, asked for comment: "No" (audiotape 90.3, cited 252). To check: Berl Bernhard to Theodore Sorensen and Lee White, May 15, 1963, Civil Rights Division, Kennedy Administration microfilm files, reel 6 (Commission on Civil Rights), Justice Department FOIA release (cited by [[w.garrow-bearing-the-cross]], 269 n.42). Check: Caro and Dallek give Johnson''s doubts on the bill''s timing, June 3; see [[cal.1963-06-03.civil-rights-bill]]. Names: Robert F. Kennedy, Kennedy, Johnson. Check: Branch, 92–93, from the recording, has the President, Robert Kennedy, Sorensen, Marshall and Johnson in the Oval Office, Johnson saying little ("I haven''t seen it"; Kennedy: "I haven''t seen it either"), Robert Kennedy counting some thirty demonstrations that week.'
