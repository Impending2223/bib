  - id: cal.1961-12-05.alabama-al
    when: Dec. 5
    date: '1961-12-05'
    thread: alabama
    also: [state-constitutions, state-and-city-finance]
    c: 'Constitutional amendment election, forty-five amendments, most of them county taxes and powers to court industry. State bonds: $10,000,000 for prisons refused, 74,718 to 86,687; $3,000,000 for the University of Alabama Research Institute at Huntsville adopted, 115,280 to 37,418; $2,000,000 for hospitals and health centers adopted, 97,200 to 41,961. Emergency interim legislators in case of enemy attack, adopted, 94,887 to 40,101. Eminent domain, refused, 68,842 to 69,336.'
    n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [672](https://archive.org/details/alabama-official-statistical-register-1963/page/n671)–674.'
    tags: [state:al, city:huntsville]
  - id: cal.1961-12-05.africa
    when: Dec. 5–14
    date: '1961-12-05'
    thread: africa
    c: 'The NSC on the Volta dam, Dec. 5. Rusk: the United States committed by the letter of June 29. Kennedy: no support to be had in Congress; decide, then explain; how to justify help to Nkrumah, given his course at home and abroad? The decision deferred for a legal report. Dec. 14, Kennedy to Nkrumah: the United States will help finance the dam, on his assurances of non-alignment.'
    n: 'FRUS 1961–63, XXI, docs. [239](https://history.state.gov/historicaldocuments/frus1961-63v21/d239), [240](https://history.state.gov/historicaldocuments/frus1961-63v21/d240), [241](https://history.state.gov/historicaldocuments/frus1961-63v21/d241), [242](https://history.state.gov/historicaldocuments/frus1961-63v21/d242). Made public: FRUS 1961–63, XXI (1995). See [[cal.1961-06-29.africa]]. Names: Rusk (K–J Adm. III.E); Nkrumah (K–J Adm. III.J).'
    tags: [name:kennedy-john-f, name:rusk-dean, name:nkrumah-kwame]
