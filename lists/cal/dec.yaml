  - id: cal.1961-12-31.middle-east
    when: Dec. 31–Jan. 16
    date: '1961-12-31'
    thread: middle-east
    c: 'Lebanon. The Syrian National Party and a few junior officers attempt a coup at dawn, Dec. 31; the army puts it down. Chehab suspects the Western powers, Britain most. Talbot to Lebanon''s ambassador: no American part in it. Jan. 11, the State Department leaves further assurances to the ambassador at Beirut; a cordial talk with Chehab, Jan. 16.'
    n: 'FRUS 1961–63, XVII, docs. [160](https://history.state.gov/historicaldocuments/frus1961-63v17/d160), [162](https://history.state.gov/historicaldocuments/frus1961-63v17/d162), [165](https://history.state.gov/historicaldocuments/frus1961-63v17/d165). [[w.hudson-precarious-republic]]. Names: Chehab (K–J Adm. III.J); Talbot (K–J Adm. III.E).'
    tags: [name:chehab-fuad, name:talbot-phillips]
