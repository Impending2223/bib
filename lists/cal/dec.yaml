# Cal. XIV December 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XIV
entries:
  - id: cal.1961-12-02.cuba
    when: Dec. 2
    date: '1961-12-02'
    thread: cuba
    c: Castro declares himself a Marxist-Leninist.
    n: 'See [[cal.1961-04-15.cuba]]. Names: Castro (K–J Adm. III.J).'
  - id: cal.1961-12-08.vietnam
    when: Dec. 8
    date: '1961-12-08'
    thread: vietnam
    c: State's white paper on Hanoi's direction of the insurgency.
    n: U.S. Department of State, *A Threat to the Peace* (Viet. II.I.3). See [[cal.1961-01-28.vietnam]].
  - id: cal.1961-12-10.albany
    when: Dec. 10–13
    date: '1961-12-10'
    thread: albany
    c: Freedom riders from Atlanta arrested at the Albany station. Marches; hundreds jailed.
    n: See [[cal.1961-11-17.albany]].
  - id: cal.1961-12-11.vietnam
    when: Dec. 11
    date: '1961-12-11'
    thread: vietnam
    c: USNS *Core* docks at Saigon with two Army helicopter companies.
    n: Spector, *Advice and Support* (Viet. II.I.3). See [[cal.1961-01-28.vietnam]].
  - id: cal.1961-12-11.court
    when: Dec. 11
    date: '1961-12-11'
    thread: court
    c: '*Garner v. Louisiana*, 368 U.S. 157. Sit-in convictions reversed for want of evidence.'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-12-14.program
    when: Dec. 14
    date: '1961-12-14'
    thread: program
    c: President's Commission on the Status of Women. Eleanor Roosevelt chairs; Peterson runs it.
    n: '[Exec. Order No. 10,980](https://www.presidency.ucsb.edu/documents/executive-order-10980-establishing-the-presidents-commission-the-status-women), [26 Fed. Reg. 12,059](https://www.govinfo.gov/app/details/FR-1961-12-16) (K–J Adm. II.H.2). Harrison, *On Account of Sex* (K–J Adm. II.B). Peterson, *Restless* (K–J Adm. II.G.5). Report: *American Women* (K–J Adm. II.H.3). Names: Peterson (K–J Adm. III.G).'
  - id: cal.1961-12-15.vietnam
    when: Dec. 15
    date: '1961-12-15'
    thread: vietnam
    c: Diem's request and Kennedy's pledge of more aid published.
    n: '[FRUS vol. 1](https://history.state.gov/historicaldocuments/frus1961-63v01). See [[cal.1961-01-28.vietnam]].'
  - id: cal.1961-12-15.albany
    when: Dec. 15–18
    date: '1961-12-15'
    thread: albany
    c: 'King in Albany. Arrested Dec. 16; refuses bail. Dec. 18: a truce; King out.'
    n: 'See [[cal.1961-11-17.albany]]. Names: King (K–J Cong. III.H).'
  - id: cal.1961-12-16.latin-america
    when: Dec. 16–17
    date: '1961-12-16'
    thread: latin-america
    c: Kennedy in Caracas and Bogotá.
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). See [[cal.1961-03-13.latin-america]].'
  - id: cal.1961-12-18.india-and-china
    when: Dec. 18
    date: '1961-12-18'
    thread: india-and-china
    c: India takes Goa by force. Stevenson condemns it at the UN. Galbraith had asked Nehru to wait.
    n: 'Galbraith, *Ambassador''s Journal*; Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4). Neville Maxwell, *India''s China War* (1970). Bruce Riedel, *JFK''s Forgotten Crisis: Tibet, the CIA, and the Sino-Indian War* (2015). [FRUS vol. 19](https://history.state.gov/historicaldocuments/frus1961-63v19). Names: Galbraith, Stevenson (K–J Adm. III.E).'
  - id: cal.1961-12-19.transition-and-staff
    when: Dec. 19
    date: '1961-12-19'
    thread: transition-and-staff
    c: Joseph P. Kennedy's stroke at Palm Beach. Speechless thereafter.
    n: 'Nasaw, *The Patriarch* (K–J Adm. II.G.1). Names: Joseph P. Kennedy (K–J Adm. III.A).'
  - id: cal.1961-12-19.specials
    when: Dec. 19
    date: '1961-12-19'
    thread: specials
    c: Louisiana 4th, special. Waggonner (D) over Lyons (R), 54.5 to 45.5, for Overton Brooks's seat. Swing 20.3 to R.
    n: 'Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1961-12-19-h-LA-4]
  - id: cal.1961-12-21.congo
    when: Dec. 21
    date: '1961-12-21'
    thread: congo
    c: Kitona. Tshombe accepts the central government, Gullion mediating. Repudiated within weeks. Check the repudiation.
    n: '[FRUS vol. 20](https://history.state.gov/historicaldocuments/frus1961-63v20), docs. [166](https://history.state.gov/historicaldocuments/frus1961-63v20/d166), [174](https://history.state.gov/historicaldocuments/frus1961-63v20/d174), [176](https://history.state.gov/historicaldocuments/frus1961-63v20/d176), [181](https://history.state.gov/historicaldocuments/frus1961-63v20/d181). Kalb, *Congo Cables* (K–J Adm. II.D). See [[cal.1961-02-13.congo]].'
  - id: cal.1961-12-21.europe-and-the-alliance
    when: Dec. 21–22
    date: '1961-12-21'
    thread: europe-and-the-alliance
    c: Kennedy and Macmillan at Bermuda. Testing, Berlin, Britain's Common Market application.
    n: 'Macmillan, *At the End of the Day* (K–J Adm. II.G.7). Trachtenberg, *A Constructed Peace* (K–J Adm. II.D). Zeiler, *American Trade and Power in the 1960s* (K–J Adm. II.B). Richard E. Neustadt, *Report to JFK: The Skybolt Crisis in Perspective* (1999). Frank Costigliola, *The Failed Design: Kennedy, de Gaulle, and the Struggle for Europe*, 8 Diplomatic Hist. 227 (1984). [FRUS vol. 13](https://history.state.gov/historicaldocuments/frus1961-63v13). Names: Macmillan, de Gaulle (K–J Adm. III.J).'
  - id: cal.1961-12-22.vietnam
    when: Dec. 22
    date: '1961-12-22'
    thread: vietnam
    c: Specialist James T. Davis killed in an ambush west of Saigon. Later counted the first American battle death.
    n: See [[cal.1961-01-28.vietnam]].
