# Cal. XIV December 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XIV
entries:
  - id: cal.1961-12-02.cuba
    when: Dec. 2
    date: '1961-12-02'
    thread: cuba
    c: Castro declares himself a Marxist-Leninist.
    n: See [[cal.1961-04-15.cuba]]. Check the date.
  - id: cal.1961-12-08.vietnam
    when: Dec. 8
    date: '1961-12-08'
    thread: vietnam
    c: 'State''s white paper, *A Threat to the Peace*: the case that the insurgency is directed from Hanoi.'
    n: State Department, *A Threat to the Peace* (Viet. II.I.3). Check the date.
  - id: cal.1961-12-10.albany
    when: Dec. 10–13
    date: '1961-12-10'
    thread: albany
    c: Freedom riders from Atlanta arrested at the Albany train station. Students march; hundreds jailed over the next days.
    n: See [[cal.1961-11-17.albany]].
  - id: cal.1961-12-11.vietnam
    when: Dec. 11
    date: '1961-12-11'
    thread: vietnam
    c: The USNS *Core* docks in Saigon with two Army helicopter companies, the first American units. Check the count.
    n: Spector, *Advice and Support* (Viet. II.I.3).
  - id: cal.1961-12-11.court
    when: Dec. 11
    date: '1961-12-11'
    thread: court
    c: '*Garner v. Louisiana*, 368 U.S. 157: sit-in convictions reversed for want of evidence. The Court decides the first sit-in cases without reaching the Constitution. Check.'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-12-14.program
    when: Dec. 14
    date: '1961-12-14'
    thread: program
    c: President's Commission on the Status of Women created. Eleanor Roosevelt chairs; Esther Peterson runs it.
    n: 'Exec. Order No. 10,980 (K–J Adm. II.H.2). Harrison, *On Account of Sex* (K–J Adm. II.B). Peterson, *Restless* (K–J Adm. II.G.5). Its report, *American Women* (K–J Adm. II.H.3). Names: Peterson (K–J Adm. III.G).'
  - id: cal.1961-12-15.vietnam
    when: Dec. 15
    date: '1961-12-15'
    thread: vietnam
    c: Diem's letter asking for more help and Kennedy's answer promising it are published.
    n: FRUS vol. 1. Check the dates of the letters.
  - id: cal.1961-12-15.albany
    when: Dec. 15–18
    date: '1961-12-15'
    thread: albany
    c: King comes to Albany to speak, is arrested marching on the 16th, and refuses bail. On the 18th a truce he did not negotiate lets him out. The movement reads it as a defeat.
    n: 'See [[cal.1961-11-17.albany]]. Names: King (K–J Cong. III.H).'
  - id: cal.1961-12-16.latin-america
    when: Dec. 16–17
    date: '1961-12-16'
    thread: latin-america
    c: Kennedy in Caracas and Bogotá. Large and friendly crowds.
    n: FRUS vol. 12. See [[cal.1961-08-05.latin-america]].
  - id: cal.1961-12-18.india-and-china
    when: Dec. 18
    date: '1961-12-18'
    thread: india-and-china
    c: India takes Goa from Portugal by force. Stevenson condemns it at the UN; Galbraith, in New Delhi, had tried to delay it.
    n: 'Galbraith, *Ambassador''s Journal* (K–J Adm. II.G.4). Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4). For the war of 1962: Neville Maxwell, *India''s China War* (1970); Bruce Riedel, *JFK''s Forgotten Crisis: Tibet, the CIA, and the Sino-Indian War* (2015). FRUS vol. 19. Names: Galbraith, Stevenson (K–J Adm. III.E).'
  - id: cal.1961-12-19.transition-and-staff
    when: Dec. 19
    date: '1961-12-19'
    thread: transition-and-staff
    c: Joseph P. Kennedy's stroke at Palm Beach. He cannot speak again.
    n: 'Nasaw, *The Patriarch* (K–J Adm. II.G.1). Names: Joseph P. Kennedy (K–J Adm. III.A).'
  - id: cal.1961-12-21.congo
    when: Dec. 21
    date: '1961-12-21'
    thread: congo
    c: At Kitona, with Ambassador Gullion mediating, Tshombe accepts the central government's authority. He disowns the agreement within weeks.
    n: See [[cal.1961-02-13.congo]]. Check.
  - id: cal.1961-12-21.europe-and-the-alliance
    when: Dec. 21–22
    date: '1961-12-21'
    thread: europe-and-the-alliance
    c: Kennedy and Macmillan at Bermuda. Testing, Berlin, Britain's application to the Common Market.
    n: 'Macmillan, *At the End of the Day* (K–J Adm. II.G.7). Trachtenberg, *A Constructed Peace* (K–J Adm. II.D). Zeiler, *American Trade and Power* (K–J Adm. II.B). Richard E. Neustadt, *Report to JFK: The Skybolt Crisis in Perspective* (1999). Frank Costigliola, *The Failed Design: Kennedy, de Gaulle, and the Struggle for Europe*, 8 Diplomatic Hist. 227 (1984). Check. FRUS vol. 13. Names: Macmillan, de Gaulle (K–J Adm. III.J).'
  - id: cal.1961-12-22.vietnam
    when: Dec. 22
    date: '1961-12-22'
    thread: vietnam
    c: Specialist James T. Davis, an Army radio intelligence man, killed in an ambush west of Saigon. Johnson later called him the first American to fall in Vietnam. Check.
    n: See [[cal.1961-01-28.vietnam]].
