    n: 'FRUS 1961–63, XVII, docs. [150](https://history.state.gov/historicaldocuments/frus1961-63v17/d150), [156](https://history.state.gov/historicaldocuments/frus1961-63v17/d156). [[w.brown-nationalization-of-the-iraqi]]; [[w.yergin-prize]]; [[w.tripp-history-of-iraq]]. Names: Qassim (K–J Adm. III.J).'
    tags: [name:qassim-abdul-karim]
