  - id: cal.1961-12-19.robert-kennedy
    when: Dec. 19
    date: '1961-12-19'
    thread: robert-kennedy
    also: [right-and-the-military]
    c: 'Walter and Victor Reuther and Joseph Rauh to Robert Kennedy, a memorandum, "The Radical Right in America Today": a right "bounded on the left by Senator Goldwater and on the right by Robert Welch"; the Attorney General''s list of subversive organizations; the FCC to look into free broadcast time given the right; tax exemptions revoked, which "might scare off a substantial part of the big money." Dec. 20, at the IRS, after the President''s press conference of Nov. 29: eighteen organizations listed for audit, the Ideological Organizations Project. May 15, 1962, the Commissioner informs Robert Kennedy.'
    n: '[Reuther Memorandum, 19 December 1961](https://www.jfklibrary.org/asset-viewer/archives/rfkag-063-013#?image_identifier=RFKAG-063-013-p0012), Attorney General''s papers, Kennedy Library. [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-199) (Nov. 29, 1961). [S. Rep. No. 94-755, Book III, 891–93 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=896) (K–J Adm. II.H.3). [[w.matzko-radio-right]]. Made public: the memorandum, in [[w.janson-far-right]]; the audits, by the staff of the Joint Committee on Internal Revenue Taxation, June 5, 1975, and the Church Committee, Book III (1976). Names: Walter Reuther (K–J Cong. III.I); Victor Reuther (K–J Cong. III.K); Rauh (K–J Cong. III.H); Robert Kennedy (K–J Adm. III.A); Goldwater (Opp. III.B); Welch (Opp. III.F).'
    tags: [name:kennedy-robert-f, name:reuther-walter, name:reuther-victor-g, name:rauh-joseph-l-jr, name:goldwater-barry-m, name:welch-robert, name:kennedy-john-f]
  - id: cal.1961-12-21.congo
    when: Dec. 21
    date: '1961-12-21'
    thread: congo
    c: Kitona. Tshombe accepts the central government, Gullion mediating. Repudiated within weeks. Check the repudiation.
    n: 'FRUS 1961–63, XX, docs. [166](https://history.state.gov/historicaldocuments/frus1961-63v20/d166), [174](https://history.state.gov/historicaldocuments/frus1961-63v20/d174), [176](https://history.state.gov/historicaldocuments/frus1961-63v20/d176), [181](https://history.state.gov/historicaldocuments/frus1961-63v20/d181). [[w.kalb-congo-cables]]. See [[cal.1961-02-13.congo]]. Names: Tshombe (K–J Adm. III.J); Gullion (K–J Adm. III.E).'
    tags: [name:gullion-edmund-a, name:tshombe-moise]
