# Cal. IV February
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: IV
entries:
  - id: cal.1961-02-02.program
    when: Feb. 2
    date: '1961-02-02'
    thread: program
    c: Special message on economic recovery and growth. Temporary unemployment benefits, aid to children of the unemployed, minimum wage, area redevelopment, housing, Social Security. No tax cut yet.
    n: 'Special Message to the Congress: Program for Economic Recovery and Growth (Feb. 2, 1961). Sundquist, *Politics and Policy* (K–J Cong. II.B). Heller, *New Dimensions*; Stein, *Fiscal Revolution*; Bernstein, *Promises Kept* (K–J Adm. II.A–B). CQ Almanac 1961 (K–J Cong. II.L). Names: Heller, Tobin, Gordon (K–J Adm. III.H).'
  - id: cal.1961-02-06.defense
    when: Feb. 6
    date: '1961-02-06'
    thread: defense
    c: 'McNamara tells reporters on background there is no missile gap. The story runs; the White House says no conclusion has been reached. Same day: the balance-of-payments message on gold.'
    n: Ball, *Politics and Force Levels*; Kaplan, *Wizards of Armageddon* (K–J Adm. II.D). Shapley, *Promise and Power* (K–J Adm. II.G.4). Gavin, *Gold, Dollars, and Power* (K–J Adm. II.B). Special Message to the Congress on Gold and the Balance of Payments Deficit (Feb. 6, 1961).
  - id: cal.1961-02-09.medicare
    when: Feb. 9
    date: '1961-02-09'
    thread: medicare
    c: 'Health message: hospital insurance for the aged through Social Security. King–Anderson bill introduced soon after. Dead for the session.'
    n: 'Special Message to the Congress on Health and Hospital Care (Feb. 9, 1961). Marmor, *Politics of Medicare*; Harris, *A Sacred Trust* (K–J Cong. II.B). Berkowitz, *Mr. Social Security* (K–J Adm. II.G.5). Anderson, *Outsider in the Senate* (K–J Cong. II.I.1). Blumenthal & Morone, *Heart of Power* (K–J Adm. II.B). Check the bill numbers and dates. Gallup in 1961: 67 percent for raising the Social Security tax to pay for medical insurance for the aged (*The Gallup Poll*, K–J Cong. II.E). Check the month. Names: Cohen (K–J Adm. III.G); Anderson, Mills (K–J Cong. III.B, III.D).'
  - id: cal.1961-02-09.civil-rights-the-executive
    when: Feb. 9
    date: '1961-02-09'
    thread: civil-rights-the-executive
    c: Senate confirms Robert C. Weaver as Housing and Home Finance administrator over southern objection. Check the date.
    n: Pritchett, *Robert Clifton Weaver* (K–J Adm. II.G.5).
  - id: cal.1961-02-10.opinion
    when: Feb. 10–15
    date: '1961-02-10'
    thread: opinion
    c: 'Gallup''s first reading: 72 percent approve, 6 disapprove, 22 no opinion.'
    n: '*The Gallup Poll: Public Opinion, 1935–1971*, vol. 3 (K–J Cong. II.E). American Presidency Project approval tables (K–J Adm. II.K). Roper Center iPoll for question wording and field dates (K–J Cong. II.L). Mueller, *Presidential Popularity from Truman to Johnson*; Kernell, *Explaining Presidential Popularity*; Brody, *Assessing the President* (K–J Cong. II.E). Kennedy''s own polling: Jacobs & Shapiro (K–J Cong. II.E). Names: Gallup, Harris (K–J Cong. III.J).'
  - id: cal.1961-02-13.congo
    when: Feb. 13
    date: '1961-02-13'
    thread: congo
    c: 'Katanga announces Lumumba''s death. Feb. 15: demonstrators break up the Security Council during Stevenson''s first speech there.'
    n: Kalb, *Congo Cables* (K–J Adm. II.D). FRUS vol. 20. S. Rep. No. 94-465 (K–J Adm. II.H.3) on the CIA's earlier plot. Ludo De Witte, *De moord op Lumumba* (1999); translated as *The Assassination of Lumumba* (2001); it led to the Belgian parliamentary inquiry of 2000–01. Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4).
  - id: cal.1961-02-18.transition-and-staff
    when: Feb. 18
    date: '1961-02-18'
    thread: transition-and-staff
    c: Executive order abolishes Eisenhower's Operations Coordinating Board. National security policy moves into Bundy's small staff. Check the order number and date.
    n: 'Preston, *The War Council* (K–J Adm. II.D). Bird, *Color of Truth* (K–J Adm. II.G.2). FRUS vol. 25. Names: Bundy, Rostow (K–J Adm. III.E).'
  - id: cal.1961-02-20.school-aid
    when: Feb. 20
    date: '1961-02-20'
    thread: school-aid
    c: 'Education message: grants for school construction and teachers'' salaries, public schools only. Cardinal Spellman and the bishops demand loans for parochial schools.'
    n: 'Special Message to the Congress on Education (Feb. 20, 1961). McAndrews, *Broken Ground*; Graham, *Uncertain Triumph* (K–J Adm. II.B). Munger & Fenno, *National Politics and Federal Aid to Education* (K–J Cong. II.B). Names: Powell, Delaney (K–J Cong. III.D); Ribicoff (K–J Adm. III.G).'
  - id: cal.1961-02-20.court
    when: Feb. 20
    date: '1961-02-20'
    thread: court
    c: '*Monroe v. Pape*, [365 U.S. 167](https://tile.loc.gov/storage-services/service/ll/usrep/usrep365/usrep365167/usrep365167.pdf). Section 1983 reaches police who break state law.'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-02-20.economy
    when: Feb. 20
    date: '1961-02-20'
    thread: economy
    c: 'The Federal Reserve announces it will buy longer-term Treasury securities. The end of "bills only" in practice: Operation Twist, short rates held up for the dollar, long rates pressed down for investment.'
    n: 'Garbade, *After the Accord*, ch. 19; Swanson, *Let''s Twist Again*; Meltzer; Bremner (K–J Adm. II.B). Martin''s papers on FRASER (K–J Adm. II.K). Names: Martin, Roosa (K–J Adm. III.H).'
  - id: cal.1961-02.economy
    when: Feb.
    date: 1961-02
    thread: economy
    c: The recession's trough, as the National Bureau later dated it. Unemployment 6.9 percent in the revised series; the monthly figures printed at the time differ by a few tenths. Consumer prices rose about 1 percent over the whole of 1961. The discount rate stays at 3 percent all year.
    n: NBER business-cycle chronology. FRED for the revised series; *Employment and Earnings* and the *Federal Reserve Bulletin* on FRASER for the contemporary ones (K–J Adm. II.K).
