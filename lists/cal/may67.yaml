entries:
  - id: cal.1967-05-01.railroads
    when: May 1–June 7
    date: '1967-05-01'
    thread: railroads
    also: [jobs-and-wages]
    c: 'The shop crafts'' dispute: six unions, 137,000 men who maintain the rolling stock, against nearly all the major railroads, mainly on wages. H.J. Res. 543, the no-strike period extended to June 19: House, [302–56](https://voteview.com/rollcall/RH0900049); Senate, [72–2](https://voteview.com/rollcall/RS0900077); signed May 2, [81 Stat. 13](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg13-3.pdf). May 4, Johnson''s message: a Special Board of five public members, a further 90 days without strike or lockout, its terms binding if the parties do not agree. The Senate passes it, S.J. Res. 81, June 7, [70–15](https://voteview.com/rollcall/RS0900101); amendments for seizure of the railroads lost, [23–59](https://voteview.com/rollcall/RS0900099) and [22–64](https://voteview.com/rollcall/RS0900100). No vote in the House in June (Check how the period was carried to July 16).'
    n: '[Special Message to the Congress Recommending Procedures To Complete Collective Bargaining in the Railway Labor Dispute](https://www.presidency.ucsb.edu/documents/special-message-the-congress-recommending-procedures-complete-collective-bargaining-the) (May 4, 1967). [Executive Order 11356](https://www.presidency.ucsb.edu/documents/executive-order-11356-creating-emergency-board-investigate-disputes-between-the-carriers) (May 30, 1967), an emergency board in another of the carriers'' disputes. See [[cal.1967-04-10.railroads]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-05-09.vietnam
    when: May 9–11
    date: '1967-05-09'
    thread: vietnam
    c: 'NSAM 362: American support of pacification ("Revolutionary Development") put under one manager, Westmoreland, "under the overall authority of the Ambassador." The Office of Civil Operations becomes part of MACV; Komer to be Westmoreland''s Deputy for Pacification, with the personal rank of ambassador. Bunker announces it in Saigon May 11. Civil Operations and Revolutionary Development Support (CORDS).'
    n: 'FRUS 1964–68, V, doc. [167](https://history.state.gov/historicaldocuments/frus1964-68v05/d167) (NSAM 362). [[w.scoville-reorganizing-for-pacification-support]]; [[w.jones-blowtorch]]; [[w.hunt-pacification]]; [[w.komer-bureaucracy-at-war]]; [[w.schaffer-ellsworth-bunker]]. Names: Westmoreland, Komer, Bunker, Johnson.'
    tags: [name:johnson-lyndon-b, name:westmoreland-william, name:komer-robert-w, name:bunker-ellsworth]
  - id: cal.1967-05-12.civil-rights-organizations
    when: May 12
    date: '1967-05-12'
    thread: civil-rights-organizations
    also: [black-nationalism]
    c: Atlanta. SNCC's central committee chooses H. Rap Brown, 23, its Alabama project director, chairman for Carmichael. Check the date and the meeting.
    n: '[[w.carson-in-struggle]]; [[w.brown-die-nigger-die]]; [[w.carmichael-ready-for-revolution]]; [[w.joseph-waiting-til-the-midnight]]. See [[cal.1966-05-16.civil-rights-organizations]]. Names: Brown, Carmichael.'
    tags: [name:brown-h-rap, name:carmichael-stokely]
  - id: cal.1967-05-15.court
    when: May 15
    date: '1967-05-15'
    thread: court
    also: [crime-and-hijacking]
    c: '*In re Gault*, [387 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387001/usrep387001.pdf): a boy of 15 committed by a juvenile court in Gila County, Ariz., to the State Industrial School until 21 for an obscene telephone call, for which an adult could be fined $50 or jailed two months. A juvenile in proceedings that may end in commitment has a right to notice of the charges, to counsel, to confront and cross-examine witnesses, and against self-incrimination. Fortas for the Court; Black and White concurring; Harlan concurring in part and dissenting in part; Stewart dissenting.'
    n: '[[w.tanenhaus-constitutional-rights-of-children]]; [[w.kalman-abe-fortas]]; [[w.powe-warren-court-and-american]]. Names: Fortas.'
    tags: [name:fortas-abe]
  - id: cal.1967-05-15.robert-kennedy
    when: May 15
    date: '1967-05-15'
    thread: robert-kennedy
    also: [elections-1968, vietnam]
    c: 'CBS, *Town Meeting of the World*: Robert Kennedy and Reagan on the war, answering students in Europe by satellite (Check where).'
    n: '[[w.kennedy-town-meeting-of-the]]; [[w.schlesinger-robert-kennedy-and-his]]; [[w.cannon-governor-reagan]]. Names: Robert Kennedy, Reagan.'
    tags: [name:kennedy-robert-f, name:reagan-ronald]
  - id: cal.1967-05-15.trade
    when: May 15–16
    date: '1967-05-15'
    thread: trade
    also: [european-community, farm]
    c: 'Geneva, late May 15: general agreement in the Kennedy Round, Roth and Blumenthal for the United States. Concessions on $7½ to $8 billion of American exports and as much of imports; industrial tariffs cut 33 to 35 percent on average, short of the 50 percent sought; a grains arrangement, wheat at no less than $1.73 a bushel, and 4½ million tons of food aid a year; chemicals, apart from a separate package on the American Selling Price. May 16, Humphrey, Rusk and Freeman brief 23 members of Congress; Johnson''s statement: "a final agreement covering billions of dollars worth of trade among more than 50 countries."'
    n: 'FRUS 1964–68, VIII, docs. [357](https://history.state.gov/historicaldocuments/frus1964-68v08/d357), [359](https://history.state.gov/historicaldocuments/frus1964-68v08/d359), [360](https://history.state.gov/historicaldocuments/frus1964-68v08/d360), [361](https://history.state.gov/historicaldocuments/frus1964-68v08/d361), [362](https://history.state.gov/historicaldocuments/frus1964-68v08/d362). [Statement by the President on the General Agreement Reached in the Kennedy Round Trade Negotiations at Geneva](https://www.presidency.ucsb.edu/documents/statement-the-president-the-general-agreement-reached-the-kennedy-round-trade-negotiations) (May 16, 1967). [[w.preeg-traders-and-diplomats]]; [[w.evans-kennedy-round-in-american]]; [[w.zeiler-american-trade-and-power]]; [[w.coppolaro-making-of-a-world]]. See [[cal.1964-05-04.trade]]. Names: Roth, Blumenthal, Humphrey, Rusk, Freeman, Johnson.'
    tags: [name:roth-william-m, name:blumenthal-w-michael, name:humphrey-hubert-h, name:rusk-dean, name:freeman-orville-l, name:johnson-lyndon-b]
  - id: cal.1967-05-16.middle-east
    when: May 16–19
    date: '1967-05-16'
    thread: middle-east
    c: 'Egypt''s troops into Sinai from May 14, on Soviet reports of Israeli forces massed against Syria. May 16, 10 p.m., a letter from Mohammed Fawzi, the UAR''s chief of staff, to Rikhye, commanding the UN Emergency Force: withdraw UNEF''s troops from the observation posts on the border. U Thant: a request must come to him from the government, and he would then withdraw the whole force from Gaza and Sinai. May 18, the request; he orders the withdrawal. May 19, Johnson with Rusk, McNamara and Rostow: Bohlen and Bruce to ask the French and British what they will do, to revive "as much of the tripartite as we can."'
    n: 'FRUS 1964–68, XIX, docs. [6](https://history.state.gov/historicaldocuments/frus1964-68v19/d6), [22](https://history.state.gov/historicaldocuments/frus1964-68v19/d22). [[w.parker-politics-of-miscalculation-in]]; [[w.six-day-war]]; [[w.quandt-lyndon-johnson-and-the]]; [[w.oren-six-days-of-war]]; [[w.ferris-nassers-gamble]]; [[w.segev-1967]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.johnson-vantage-point]]. Names: Mohammed Fawzi, Rikhye, U Thant, Rusk, McNamara, Rostow, Bohlen, Bruce, Johnson.'
    tags: [name:fawzi-mohammed, name:rikhye-indar-jit, name:u-thant, name:nasser-gamal-abdel, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:bohlen-charles-e, name:bruce-david-k-e, name:johnson-lyndon-b]
  - id: cal.1967-05-17.cities-and-housing
    when: May 17
    date: '1967-05-17'
    thread: cities-and-housing
    c: 'The House on the HUD and independent offices appropriation, H.R. 9960: the $10 million for rent supplements struck, [233–171](https://voteview.com/rollcall/RH0900054); recommittal to cut Model Cities from $225 million for operations to $12 million for planning lost, [193–213](https://voteview.com/rollcall/RH0900055); passed, [347–56](https://voteview.com/rollcall/RH0900056).'
    n: '[[w.haar-between-the-idea-and]]. See [[cal.1966-01-26.cities-and-housing]]; [[cal.1966-05-13.cities-and-housing]].'
  - id: cal.1967-05-19.vietnam
    when: May 19–24
    date: '1967-05-19'
    thread: vietnam
    c: 'McNamara''s draft presidential memorandum, "Future Actions in Vietnam," drafted by McNaughton. Westmoreland and Sharp ask 200,000 more men; that would mean the reserves, some 500,000 more in the forces, $10 billion more in fiscal 1968, and pressure to carry the war into Laos, Cambodia and the North. "The war in Vietnam is acquiring a momentum of its own that must be stopped." Course B: no more than 30,000 more men, about 500,000 by the end of 1968; the bombing concentrated on the routes of infiltration south of 20°. The Joint Chiefs, May 20, for the larger force and a wider war against the North; Wheeler to McNamara, May 24: the reserves needed. Rostow, May 22: an "intermediate strategy."'
    n: 'FRUS 1964–68, V, docs. [177](https://history.state.gov/historicaldocuments/frus1964-68v05/d177), [181](https://history.state.gov/historicaldocuments/frus1964-68v05/d181), [187](https://history.state.gov/historicaldocuments/frus1964-68v05/d187). Made public: [[w.pentagon-papers]], IV, 477–489 (1971). [[w.mcnamara-in-retrospect]]; [[w.shapley-promise-and-power]]; [[w.drea-mcnamara-clifford-and-the-2011]]; [[w.gibbons-u-s-government-and-1995]]; [[w.berman-lyndon-johnsons-war]]; [[w.barrett-uncertain-warriors]]; [[w.herring-lbj-and-vietnam]]. Names: McNamara, McNaughton, Westmoreland, Sharp, Wheeler, Rostow.'
    tags: [name:mcnamara-robert-s, name:mcnaughton-john-t, name:westmoreland-william, name:sharp-u-s-grant, name:wheeler-earle, name:rostow-walt-w]
  - id: cal.1967-05-22.middle-east
    when: May 22–24
    date: '1967-05-22'
    thread: middle-east
    c: 'Nasser at Bir Gafgafa, Sinai, the night of May 22: the Strait of Tiran closed to Israeli ships and to strategic cargo for Israel. U Thant in Cairo, May 23–24. Johnson on radio and television, May 23, 6:10 p.m.: the gulf "an international waterway"; a blockade of Israeli shipping "illegal and potentially disastrous to the cause of peace"; the United States "firmly committed to the support of the political independence and territorial integrity of all the nations of the area." The Security Council meets May 24.'
    n: '[Statement by the President on Rising Tensions in the Near East](https://www.presidency.ucsb.edu/documents/statement-the-president-rising-tensions-the-near-east) (May 23, 1967). FRUS 1964–68, XIX, doc. [49](https://history.state.gov/historicaldocuments/frus1964-68v19/d49). See [[cal.1967-05-16.middle-east]]. Names: Nasser, U Thant, Johnson.'
    tags: [name:nasser-gamal-abdel, name:u-thant, name:johnson-lyndon-b]
  - id: cal.1967-05-24.school-aid
    when: May 24
    date: '1967-05-24'
    thread: school-aid
    c: 'The House passes the Elementary and Secondary Education Amendments, H.R. 7819, [294–122](https://voteview.com/rollcall/RH0900061); recommittal lost, [180–236](https://voteview.com/rollcall/RH0900060). Amendments carried: Title I''s money by the national average expenditure per pupil, [222–194](https://voteview.com/rollcall/RH0900058); Title III''s supplementary centers through the State departments of education, not to the localities direct, [230–185](https://voteview.com/rollcall/RH0900059).'
    n: '[[w.graham-uncertain-triumph]]. See [[cal.1965-01-12.school-aid]].'
  - id: cal.1967-05-25.program
    when: May 25
    date: '1967-05-25'
    thread: program
    also: [elections-1968]
    c: 'Special message on election reform. An Election Reform Act: every contribution, loan and expense over $100 reported, by every candidate and committee for federal office; $5,000 the most from one person and his family to one candidate; the ceilings on campaign spending repealed. Appropriated funds, in place of Long''s check-off, to reimburse the parties'' expenses in the presidential campaign after the nominations. A Residency Voting Act: a citizen resident in a State by Sept. 1 may vote there for President.'
    n: '[Special Message to the Congress on Election Reform: The Political Process in America](https://www.presidency.ucsb.edu/documents/special-message-the-congress-election-reform-the-political-process-america) (May 25, 1967). [[w.mann-legacy-to-power]]. See [[cal.1966-10-12.program]]. Names: Long, Johnson.'
    tags: [name:johnson-lyndon-b, name:long-russell-b]
  - id: cal.1967-05-25.middle-east
    when: May 25–28
    date: '1967-05-25'
    thread: middle-east
    also: [soviet-union]
    c: 'Eban in Washington from Paris and London; with Rusk May 25. May 26, Johnson and his advisers, 1:30 p.m.: Wheeler, Israel 55 to 65 percent mobilized, some 50,000 Egyptian troops in Sinai. Eban with Johnson, 7:15 to 8:40 p.m.: what will the United States do to keep the Strait open? Johnson: Israel must not be responsible for starting hostilities; the maritime powers to act, on the British plan; and twice, "Israel will not be alone unless it decides to go it alone." Kosygin to Johnson, May 27: if Israel attacks, "we will render aid to those countries that are subjected to aggression." Israel''s cabinet, May 28, decides to wait.'
    n: 'FRUS 1964–68, XIX, docs. [72](https://history.state.gov/historicaldocuments/frus1964-68v19/d72), [77](https://history.state.gov/historicaldocuments/frus1964-68v19/d77), [84](https://history.state.gov/historicaldocuments/frus1964-68v19/d84). See [[cal.1967-05-16.middle-east]]. Names: Eban, Rusk, Wheeler, Kosygin, Johnson.'
    tags: [name:eban-abba-s, name:rusk-dean, name:wheeler-earle, name:kosygin-aleksei, name:johnson-lyndon-b, name:harman-avraham]
  - id: cal.1967-05-29.court
    when: May 29
    date: '1967-05-29'
    thread: court
    also: [open-housing]
    c: '*Reitman v. Mulkey*, [387 U.S. 369](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387369/usrep387369.pdf): California''s Proposition 14, the amendment to its constitution leaving owners free to refuse to sell or rent to whom they choose, denies the equal protection of the laws; the State has made itself a party to private discrimination. White for the Court, 5–4; Douglas concurring; Harlan, with Black, Clark and Stewart, dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.hosang-racial-propositions]]; [[w.brilliant-color-of-america-has]]. See [[cal.1964-11-03.cities-and-housing]]; [[cal.1966-05-10.open-housing-ca]].'
    tags: [state:ca]
  - id: cal.1967-05-29.court-2
    when: May 29
    date: '1967-05-29'
    thread: court
    c: '*Afroyim v. Rusk*, [387 U.S. 253](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387253/usrep387253.pdf): Congress may not take away a citizen''s citizenship without his assent; the Fourteenth Amendment protects it. A naturalized American who voted in Israel''s election of 1951 keeps his. *Perez v. Brownell* (1958) overruled. Black for the Court, 5–4; Harlan, with Clark, Stewart and White, dissenting.'
    n: '[[w.powe-warren-court-and-american]].'
  - id: cal.1967-05-30.africa
    when: May 30–31
    date: '1967-05-30'
    thread: africa
    c: 'Enugu, early May 30. Ojukwu, Military Governor of Eastern Nigeria, proclaims the Republic of Biafra. Gowon: an "act of rebellion"; the blockade of the East reimposed, the federal army mobilized. He asks the American and British ambassadors for military help; refused. State to posts, May 30: Nigeria''s problem the Nigerians'', Africa''s and the Commonwealth''s; relations kept with the Federal Military Government.'
    n: 'FRUS 1964–68, XXIV, docs. [386](https://history.state.gov/historicaldocuments/frus1964-68v24/d386), [387](https://history.state.gov/historicaldocuments/frus1964-68v24/d387). [[w.stremlau-international-politics-of-the]]. Names: Ojukwu, Gowon.'
    tags: [name:ojukwu-chukwuemeka-odumegwu, name:gowon-yakubu]
  - id: cal.1967-05-30.middle-east
    when: May 30–June 4
    date: '1967-05-30'
    thread: middle-east
    c: 'Hussein flies to Cairo, May 30, and signs a defense pact with Nasser. Rusk and McNamara to Johnson, May 30: a declaration of the maritime powers that the Strait and the gulf are international waterways, and plans to test Egypt''s interference with passage. Robert B. Anderson with Nasser in Cairo, May 31: Mohieddin to come to Washington. Amit, head of the Mossad, with McNamara, June 1; Dayan Israel''s defense minister the same day. Wilson at the White House, June 2. Johnson to Eshkol, June 3, on the maritime plan; Israel''s cabinet decides June 4 for war.'
    n: 'FRUS 1964–68, XIX, docs. [103](https://history.state.gov/historicaldocuments/frus1964-68v19/d103), [106](https://history.state.gov/historicaldocuments/frus1964-68v19/d106), [124](https://history.state.gov/historicaldocuments/frus1964-68v19/d124), [139](https://history.state.gov/historicaldocuments/frus1964-68v19/d139), [146](https://history.state.gov/historicaldocuments/frus1964-68v19/d146). [Remarks of Welcome at the White House to Prime Minister Wilson of the United Kingdom](https://www.presidency.ucsb.edu/documents/remarks-welcome-the-white-house-prime-minister-wilson-the-united-kingdom) (June 2, 1967). See [[cal.1967-05-16.middle-east]]. Names: Hussein ibn Talal, Nasser, Rusk, McNamara, Anderson, Mohieddin, Amit, Dayan, Wilson, Eshkol, Johnson.'
    tags: [name:hussein-ibn-talal, name:nasser-gamal-abdel, name:rusk-dean, name:mcnamara-robert-s, name:anderson-robert-b, name:mohieddin-zakaria, name:amit-meir, name:dayan-moshe, name:wilson-harold, name:eshkol-levi, name:johnson-lyndon-b]
