# Cal. LIX April 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LIX
entries:
  - id: cal.1965-04-02.opinion
    when: Apr. 2
    date: '1965-04-02'
    thread: opinion
    also: [foreign-aid]
    c: 'Gallup, Feb. 19–24: foreign aid in general: for 57 percent, against 33. Johnson''s $3.4 billion for aid: decreased 49, kept the same 33, increased 6.'
    n: '*The Gallup Poll*, III, 1932 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-04-06.vietnam
    when: Apr. 6
    date: '1965-04-06'
    thread: vietnam
    c: 'NSAM 328, Bundy''s record of the President''s decisions of Apr. 1: two more Marine battalions and an air squadron; 18,000 to 20,000 more support troops; "a change of mission for all Marine Battalions ... to permit their more active use"; Rolling Thunder at its "slowly ascending tempo"; the moves to be understood as "gradual and wholly consistent with existing policy." Johnson to the press, Apr. 1: "I know of no far-reaching strategy that is being suggested or promulgated." McCone, by letter: hit the North harder, or face "an ever-increasing guerrilla war."'
    n: '[NSAM No. 328](https://history.state.gov/historicaldocuments/frus1964-68v02/d242) (Apr. 6, 1965) (Viet. II.I.2). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1029) (Apr. 1, 1965). FRUS 1964–68, II, docs. [229](https://history.state.gov/historicaldocuments/frus1964-68v02/d229), [231](https://history.state.gov/historicaldocuments/frus1964-68v02/d231), [234](https://history.state.gov/historicaldocuments/frus1964-68v02/d234), [238](https://history.state.gov/historicaldocuments/frus1964-68v02/d238). *The Pentagon Papers* (K–J Adm. II.H.3). See [[cal.1965-03-08.vietnam]]. Names: McGeorge Bundy, McCone (Viet. III.A).'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge, name:mccone-john-a]
  - id: cal.1965-04-07.vietnam
    when: Apr. 7
    date: '1965-04-07'
    thread: vietnam
    c: 'Johnson at Johns Hopkins, Baltimore, on television: "Peace Without Conquest." "We will not be defeated. We will not grow tired"; ready "for unconditional discussions"; a billion dollars for the development of Southeast Asia, the Mekong to "dwarf even our own TVA," Eugene Black to lead. Apr. 8, Phạm Văn Đồng''s four points: American troops and bases out; no foreign alliances, as at Geneva; the South''s affairs settled by its people on the Front''s program; reunification without foreign interference.'
    n: '[Address at Johns Hopkins University: "Peace Without Conquest"](https://www.presidency.ucsb.edu/documents/address-johns-hopkins-university-peace-without-conquest) (Apr. 7, 1965). [FRUS 1964–68, II, doc. 245](https://history.state.gov/historicaldocuments/frus1964-68v02/d245). Recording (K–J Adm. II.I). Logevall, *Choosing War* (K–J Adm. II.D). Thies, *When Governments Collide*; *The Search for Peace in Vietnam, 1964–1968* (Viet. II.F.16). Herring, *LBJ and Vietnam*; Gardner, *Pay Any Price* (Viet. II.C.1). Johnson, *The Vantage Point* (K–J Adm. II.G.3). See [[cal.1965-03-02.vietnam]]. Names: Johnson (K–J Adm. III.D); Phạm Văn Đồng (Viet. III.H).'
    tags: [name:johnson-lyndon-b, name:black-eugene-r, name:pham-van-dong]
  - id: cal.1965-04-07.opinion
    when: Apr. 7
    date: '1965-04-07'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 11–16: start peace negotiations with the Communist leaders now, 41 percent; send more troops and airplanes to strengthen our position, 42; no opinion 17.'
    n: '*The Gallup Poll*, III, 1932–33 (K–J Cong. II.E).'
  - id: cal.1965-04-08.medicare
    when: Apr. 8
    date: '1965-04-08'
    thread: medicare
    also: [welfare]
    c: House passes the Medicare bill, H.R. 6675, [313–115](https://voteview.com/rollcall/RH0890035). Byrnes's motion to recommit, to put his voluntary plan in its place, lost, [191–236](https://voteview.com/rollcall/RH0890034).
    n: '[111 Cong. Rec., House, Apr. 8, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-2-1.pdf). See [[cal.1965-03-23.medicare]]. Names: Byrnes (Opp. III.C).'
    tags: [name:byrnes-john-w]
  - id: cal.1965-04-09.school-aid
    when: Apr. 9
    date: '1965-04-09'
    thread: school-aid
    c: Senate passes the education bill as the House sent it, [73–18](https://voteview.com/rollcall/RS0890048), so no conference. Morse, managing, holds off every amendment, eleven on roll calls; among them one for taxpayers' suits to test aid to church schools, [32–53](https://voteview.com/rollcall/RS0890041).
    n: '[111 Cong. Rec., Senate, Apr. 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-3-1.pdf). [Remarks Following Enactment of the Elementary and Secondary Education Bill](https://www.presidency.ucsb.edu/documents/remarks-following-enactment-the-elementary-and-secondary-education-bill) (Apr. 9, 1965). See [[cal.1965-03-26.school-aid]]. Names: Morse (K–J Cong. III.B).'
    tags: [name:morse-wayne, name:johnson-lyndon-b]
  - id: cal.1965-04-09.voting-rights
    when: Apr. 9
    date: '1965-04-09'
    thread: voting-rights
    c: Judiciary reports the voting bill on the Senate's deadline, amended, without recommendation. In committee Edward Kennedy's ban on poll taxes in State elections carried, 9–4, and Dirksen's exemption for States with 60 percent registered; reported 12–4 (Check the votes). Debate opens after the Easter recess, Apr. 22 (Check).
    n: 'S. Rep. No. 89-162 (1965). [111 Cong. Rec., Senate, Apr. 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-3-1.pdf). [Statement by the President on the Eve of Senate Consideration of the Voting Rights Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-the-eve-senate-consideration-the-voting-rights-bill) (Apr. 20, 1965). May, *Bending Toward Justice*; Lawson, *Black Ballots* (K–J Cong. II.C). See [[cal.1965-03-17.voting-rights]]. Names: Edward Kennedy (K–J Cong. III.B); Dirksen (K–J Cong. III.A).'
    tags: [name:kennedy-edward-m, name:dirksen-everett, name:eastland-james-o]
  - id: cal.1965-04-11.school-aid
    when: Apr. 11
    date: '1965-04-11'
    thread: school-aid
    c: Elementary and Secondary Education Act signed, [79 Stat. 27](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg27.pdf), outside the old Junction school near Johnson City, his first, Kate Deadrich Loney, his first teacher, beside him. Title I, aid to districts by their count of children of low-income families, for the educationally deprived, private-school pupils included; Title II, library books and textbooks for children in public and private schools; Title III, supplementary centers.
    n: 'Statute (K–J Cong. II.J.2). [Remarks in Johnson City, Tex., Upon Signing the Elementary and Secondary Education Bill](https://www.presidency.ucsb.edu/documents/remarks-johnson-city-tex-upon-signing-the-elementary-and-secondary-education-bill) (Apr. 11, 1965). Eidenberg & Morey, *An Act of Congress*; Bailey & Mosher, *ESEA*; Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B). Graham, *The Uncertain Triumph* (K–J Adm. II.B). See [[cal.1965-04-09.school-aid]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-04-11.opinion
    when: Apr. 11
    date: '1965-04-11'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, Mar. 18–23: the Johnson Administration pushing integration too fast, 34 percent; not fast enough, 17; about right, 38. Southern whites 67 too fast; whites outside the South 28. Clergymen of one''s own church in civil rights protest marches: approve 32, disapprove 56; Protestants 29 approve, Catholics 40.'
    n: '*The Gallup Poll*, III, 1933 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-04-13.succession
    when: Apr. 13
    date: '1965-04-13'
    thread: succession
    c: House passes H.J. Res. 1, the amendment on presidential inability and a vacancy in the Vice Presidency, [368–29](https://voteview.com/rollcall/RH0890037), and puts its text into the Senate's S.J. Res. 1. To conference.
    n: '[111 Cong. Rec., House, Apr. 13, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-5-2.pdf). See [[cal.1965-02-19.succession]].'
  - id: cal.1965-04-14.opinion
    when: Apr. 14
    date: '1965-04-14'
    thread: opinion
    also: [voting-rights]
    c: 'Gallup, Mar. 18–23: a law to send federal officials to register voters where turnout was low: favor 76 percent, oppose 16. Southern whites 49 favor, 37 oppose. Republicans 72 favor; Democrats 80; independents 70.'
    n: '*The Gallup Poll*, III, 1933–34 (K–J Cong. II.E).'
  - id: cal.1965-04-16.opinion
    when: Apr. 16
    date: '1965-04-16'
    thread: opinion
    c: 'Gallup, Mar. 18–23: the most important problem: civil rights 52 percent; foreign affairs 39; immorality, crime, delinquency 4; cost of living 3; unemployment 2.'
    n: '*The Gallup Poll*, III, 1934 (K–J Cong. II.E).'
  - id: cal.1965-04-17.students
    when: Apr. 17
    date: '1965-04-17'
    thread: students
    also: [vietnam]
    c: 'Washington. SDS''s march against the war, with Women Strike for Peace: some 15,000 to 25,000 picket the White House, hear speeches at the Washington Monument, and walk to the Capitol. Potter, SDS''s president: "We must name that system." Check the count.'
    n: 'Sale, *SDS*; Miller, *"Democracy Is in the Streets"*; Gitlin, *The Sixties*; Wells, *The War Within* (K–J Cong. II.F). DeBenedetti, *An American Ordeal*; Zaroulis & Sullivan, *Who Spoke Up?* (Viet. II.G.1). See [[cal.1965-03-24.students]]. Names: Potter (K–J Cong. III.K).'
    tags: [name:potter-paul]
  - id: cal.1965-04-20.vietnam
    when: Apr. 20
    date: '1965-04-20'
    thread: vietnam
    c: 'Honolulu: McNamara, William Bundy, and McNaughton with Taylor, Wheeler, Sharp, and Westmoreland. None expects Hanoi to yield in less than six months; the bombing at about its present tempo, Hanoi and Haiphong spared; American forces from 33,500 to some 82,000, with 7,250 Korean and Australian. Apr. 21, McNamara''s report to Johnson; Ball, the same day, for a try at settlement before "a 150 percent increase" in troops.'
    n: 'FRUS 1964–68, II, docs. [264](https://history.state.gov/historicaldocuments/frus1964-68v02/d264), [265](https://history.state.gov/historicaldocuments/frus1964-68v02/d265), [266](https://history.state.gov/historicaldocuments/frus1964-68v02/d266), [267](https://history.state.gov/historicaldocuments/frus1964-68v02/d267). Ball, *The Past Has Another Pattern* (Viet. II.H.1). See [[cal.1965-04-06.vietnam]]. Names: McNamara, William Bundy, McNaughton, Taylor, Wheeler, Ball (Viet. III.A); Sharp, Westmoreland (Viet. III.D).'
    tags: [name:mcnamara-robert-s, name:bundy-william, name:mcnaughton-john-t, name:taylor-maxwell, name:wheeler-earle, name:sharp-u-s-grant, name:westmoreland-william, name:ball-george-w, name:johnson-lyndon-b]
  - id: cal.1965-04-23.opinion
    when: Apr. 23
    date: '1965-04-23'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 2–7: what to do next in Vietnam: withdraw completely 17 percent; negotiate, stop fighting 12; continue present policy 14; step up military activity 12; go all out, declare war 19; no opinion 28. Handling Vietnam as well as could be expected, 55; badly, 26.'
    n: '*The Gallup Poll*, III, 1934–35 (K–J Cong. II.E).'
  - id: cal.1965-04-24.latin-america
    when: Apr. 24
    date: '1965-04-24'
    thread: latin-america
    c: Santo Domingo. Army officers and Bosch's Dominican Revolutionary Party rise against Reid Cabral's triumvirate, for Bosch's return; arms handed out to civilians. Apr. 25, Reid resigns; the rebels name Molina Ureña provisional president; Wessin's forces at San Isidro and the air force attack them. Apr. 27, Molina Ureña at the American embassy, Bennett telling him to seek terms; Caamaño at the rebels' head.
    n: 'FRUS 1964–68, XXXII, docs. [21](https://history.state.gov/historicaldocuments/frus1964-68v32/d21), [26](https://history.state.gov/historicaldocuments/frus1964-68v32/d26). The White House''s account of Apr. 24–28: [Statement by the President Upon Ordering Troops Into the Dominican Republic](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-ordering-troops-into-the-dominican-republic) (Apr. 28, 1965), note. Bibliography: [[cal.1965-04-28.latin-america]]. See [[cal.1963-09-25.latin-america]]. Names: Bosch (K–J Adm. III.J); Molina Ureña (K–J Cong. III.K).'
    tags: [name:bosch-juan, name:reid-cabral-donald, name:molina-urena-jose-rafael, name:wessin-y-wessin-elias, name:bennett-w-tapley-jr, name:caamano-deno-francisco]
  - id: cal.1965-04-26.court
    when: Apr. 26
    date: '1965-04-26'
    thread: court
    c: '*Dombrowski v. Pfister*, [380 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380479/usrep380479.pdf): a federal court may enjoin prosecutions under Louisiana''s subversive-activities laws, overbroad and, as alleged, brought to harass the Southern Conference Educational Fund for its civil rights work. Brennan for the Court, 5–2.'
    n: 'Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1965-03-08.court]]. Names: Brennan (K–J Cong. III.G).'
    tags: [name:brennan-william-j-jr]
  - id: cal.1965-04-27.voting-rights
    when: Apr. 27
    date: '1965-04-27'
    thread: voting-rights
    also: [court]
    c: '*Harman v. Forssenius*, [380 U.S. 528](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380528/usrep380528.pdf): Virginia''s certificate of residence, to be filed six months before the election by voters for federal office who will not pay the poll tax, struck down under the Twenty-fourth Amendment. Warren for the Court.'
    n: 'Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1964-01-23.voting-rights]]. Names: Warren (K–J Cong. III.G).'
    tags: [name:warren-earl]
  - id: cal.1965-04-28.latin-america
    when: Apr. 28
    date: '1965-04-28'
    thread: latin-america
    c: 'Santo Domingo. The junta''s officers tell the embassy they can no longer protect Americans; Bennett asks for Marines. Johnson, after meeting congressional leaders, tells the country at 8:40 p.m.: troops ordered ashore "to give protection to hundreds of Americans," 400 Marines already landed. Bennett, that night: think of "armed intervention which would go beyond the mere protection of Americans."'
    n: '[Statement by the President Upon Ordering Troops Into the Dominican Republic](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-ordering-troops-into-the-dominican-republic) (Apr. 28, 1965). FRUS 1964–68, XXXII, docs. [28](https://history.state.gov/historicaldocuments/frus1964-68v32/d28), [29](https://history.state.gov/historicaldocuments/frus1964-68v32/d29), [34](https://history.state.gov/historicaldocuments/frus1964-68v32/d34), [35](https://history.state.gov/historicaldocuments/frus1964-68v32/d35), [36](https://history.state.gov/historicaldocuments/frus1964-68v32/d36), [38](https://history.state.gov/historicaldocuments/frus1964-68v32/d38). Lowenthal, *The Dominican Intervention*; Gleijeses, *The Dominican Crisis*; McPherson, *Yankee No!*; Rabe, *The Killing Zone* (K–J Adm. II.D). Martin, *Overtaken by Events* (K–J Adm. II.G.4). Johnson, *The Vantage Point* (K–J Adm. II.G.3). *Reaching for Glory* (K–J Adm. II.J). See [[cal.1965-04-24.latin-america]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:bennett-w-tapley-jr]
  - id: cal.1965-04-28.transition-and-staff
    when: Apr. 28
    date: '1965-04-28'
    thread: transition-and-staff
    c: McCone out at the CIA. Raborn, a retired vice admiral who had run the Polaris program, sworn as Director of Central Intelligence, Helms, head of the clandestine service, as Deputy Director. The Senate confirmed Raborn Apr. 22.
    n: '[Remarks at the Swearing In of Admiral Raborn and Richard Helms as Director and Deputy Director, CIA](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-admiral-raborn-and-richard-helms-director-and-deputy-director-cia) (Apr. 28, 1965). [111 Cong. Rec., Senate, Apr. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-10-2.pdf). Powers, *The Man Who Kept the Secrets* (K–J Adm. II.E). See [[cal.1965-03-18.transition-and-staff]]. Names: McCone, Raborn, Helms (K–J Adm. III.I).'
    tags: [name:johnson-lyndon-b, name:mccone-john-a, name:raborn-william-f-jr, name:helms-richard]
  - id: cal.1965-04-30.latin-america
    when: Apr. 30
    date: '1965-04-30'
    thread: latin-america
    c: 'The OAS Council, through the night of Apr. 29–30, calls for a cease-fire and a neutral zone of refuge in Santo Domingo, 16–0, Chile, Mexico, Uruguay, and Venezuela abstaining. The papal nuncio arranges a cease-fire; the 82nd Airborne lands at San Isidro (Check); John Bartlow Martin sent as envoy. Johnson that evening: "people trained outside the Dominican Republic are seeking to gain control."'
    n: '[Statement by the President on the Situation in the Dominican Republic](https://www.presidency.ucsb.edu/documents/statement-the-president-the-situation-the-dominican-republic-0) (Apr. 30, 1965). FRUS 1964–68, XXXII, docs. [42](https://history.state.gov/historicaldocuments/frus1964-68v32/d42), [43](https://history.state.gov/historicaldocuments/frus1964-68v32/d43), [45](https://history.state.gov/historicaldocuments/frus1964-68v32/d45), [46](https://history.state.gov/historicaldocuments/frus1964-68v32/d46), [49](https://history.state.gov/historicaldocuments/frus1964-68v32/d49). See [[cal.1965-04-28.latin-america]].'
    tags: [name:johnson-lyndon-b, name:martin-john]
