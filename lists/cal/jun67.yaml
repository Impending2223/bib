# Cal. XCI June 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XCI
entries:
  - id: cal.1967-06-01.state-and-city-finance-mn
    when: June 1
    date: '1967-06-01'
    thread: state-and-city-finance
    c: 'Minnesota. LeVander vetoes the special session''s tax bill, H.F. 27: the State''s first sales tax, 3 percent, with relief from the property tax for owners and renters. He had asked for a referendum first. The legislature overrides him (Check the day). His veto of the regular session''s bill, May 20, had stood.'
    n: '[Minn. Legislative Reference Library, vetoes of 1967](https://www.lrl.mn.gov/Vetoes/vetodetails?gov=1); [the veto message, June 1, 1967](https://www.leg.mn.gov/archive/vetoes/1967_sp1veto_HF27.pdf). Check: Laws of 1967, Extra Session, ch. 32. [MNopedia, "LeVander, Karl Harold Phillip"](https://www.mnhs.org/mnopedia/search/index/person/levander-karl-harold-phillip-1910-1992). [[w.peirce-great-plains-states-of]]. Names: LeVander.'
    tags: [state:mn, name:levander-harold]
  - id: cal.1967-06-02.vietnam
    when: June 2–29
    date: '1967-06-02'
    thread: vietnam
    also: [soviet-union]
    c: 'June 2, American aircraft attacking an antiaircraft battery at Cẩm Phả, 50 miles north of Haiphong, hit the Soviet freighter *Turkestan*; one of her crew killed. Moscow: "an act of banditry." Washington, June 3: only military targets attacked, the ship hit by North Vietnamese fire; a note of June 20 acknowledges that a third flight of American aircraft struck her. June 29, the *Mikhail Frunze* damaged near Haiphong.'
    n: 'FRUS 1964–68, V, doc. [188](https://history.state.gov/historicaldocuments/frus1964-68v05/d188). *American Foreign Policy: Current Documents, 1967*, 939–941, 945. [[w.gaiduk-soviet-union-and-the]]; [[w.clodfelter-limits-of-air-power]].'
  - id: cal.1967-06-05.middle-east
    when: June 5
    date: '1967-06-05'
    thread: middle-east
    also: [soviet-union]
    c: 'Israel''s aircraft strike Egypt''s air bases in the morning; war with Egypt, Jordan and Syria. 7:57 a.m., McNamara to Johnson: Kosygin on the hot line, its first use for a message of substance; Johnson replies. Twenty messages by June 10. State''s spokesman, McCloskey: the United States "neutral in thought, word, and deed."'
    n: 'FRUS 1964–68, XIX, docs. [150](https://history.state.gov/historicaldocuments/frus1964-68v19/d150), [152](https://history.state.gov/historicaldocuments/frus1964-68v19/d152), [155](https://history.state.gov/historicaldocuments/frus1964-68v19/d155), [156](https://history.state.gov/historicaldocuments/frus1964-68v19/d156), [157](https://history.state.gov/historicaldocuments/frus1964-68v19/d157), [159](https://history.state.gov/historicaldocuments/frus1964-68v19/d159). [Johnson and McNamara, 7:57 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-june-5-1967), Conversation WH6706-01-11903 (Miller Center). [[w.oren-six-days-of-war]]; [[w.quandt-lyndon-johnson-and-the]]; [[w.quandt-peace-process]]; [[w.six-day-war]]; [[w.segev-1967]]; [[w.shlaim-iron-wall]]; [[w.shlaim-lion-of-jordan]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.klinghoffer-vietnam-jews-and-the]]; [[w.johnson-vantage-point]]; [[w.rusk-as-i-saw-it-1990]]; [[w.dallek-flawed-giant]]. See [[cal.1967-05-16.middle-east]]; [[cal.1963-08-30.testing]]. Names: McNamara, Kosygin, McCloskey, Johnson.'
    tags: [name:mcnamara-robert-s, name:kosygin-aleksei, name:mccloskey-robert-j, name:johnson-lyndon-b, name:rusk-dean, name:rostow-walt-w]
  - id: cal.1967-06-06.middle-east
    when: June 6
    date: '1967-06-06'
    thread: middle-east
    c: 'The Security Council, unanimous, Resolution 233: a cease-fire. Johnson: "a first step" toward peace. Radio Cairo, from 7:40 a.m.: American aircraft in the Israeli attacks; Egypt closes the Suez Canal. Iraq cuts off oil to the United States and Britain; Kuwait and others follow. Egypt, Syria, Iraq, Algeria, Sudan and Yemen break relations with the United States, June 6–7 (Check the list).'
    n: 'Security Council Resolution [233 (1967)](https://undocs.org/S/RES/233(1967)). [Statement by the President on the United Nations Security Council''s Cease-Fire Vote in the Middle East Situation](https://www.presidency.ucsb.edu/documents/statement-the-president-the-united-nations-security-councils-cease-fire-vote-the-middle) (June 6, 1967). FRUS 1964–68, XXXIV, docs. [232](https://history.state.gov/historicaldocuments/frus1964-68v34/d232), [233](https://history.state.gov/historicaldocuments/frus1964-68v34/d233). [[w.yergin-prize]]. See [[cal.1967-06-05.middle-east]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:nasser-gamal-abdel]
  - id: cal.1967-06-07.middle-east
    when: June 7
    date: '1967-06-07'
    thread: middle-east
    c: Israel takes the Old City of Jerusalem; the Security Council, Resolution 234, a cease-fire by 2000 GMT; Jordan accepts. Johnson names a Special Committee of the National Security Council for the crisis, McGeorge Bundy its executive secretary.
    n: 'Security Council Resolution [234 (1967)](https://undocs.org/S/RES/234(1967)). [Statement by the President Upon Establishing the National Security Council Special Committee on the Middle East](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-establishing-the-national-security-council-special-committee) (June 7, 1967). FRUS 1964–68, XIX, doc. [197](https://history.state.gov/historicaldocuments/frus1964-68v19/d197). [[w.bird-color-of-truth]]. See [[cal.1967-06-05.middle-east]]. Names: McGeorge Bundy, Johnson.'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:hussein-ibn-talal]
  - id: cal.1967-06-07.economy
    when: June 7–30
    date: '1967-06-07'
    thread: economy
    also: [congress]
    c: 'The debt limit. The House defeats H.R. 10328, $365 billion, June 7, [199–209](https://voteview.com/rollcall/RH0900069). June 21 it passes H.R. 10867, [217–196](https://voteview.com/rollcall/RH0900082): a permanent limit of $358 billion, $7 billion more from each July 1, and the participation certificates sold from July 1 counted in; recommittal blocked, [191–223](https://voteview.com/rollcall/RH0900081). Senate, June 27, [60–30](https://voteview.com/rollcall/RS0900117), a limit of $348 billion lost, [43–44](https://voteview.com/rollcall/RS0900113). Signed June 30, [81 Stat. 99](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg99.pdf).'
    n: '[[w.zelizer-taxing-america]]; [[w.morgan-deficit-government]].'
  - id: cal.1967-06-08.middle-east
    when: June 8–10
    date: '1967-06-08'
    thread: middle-east
    also: [defense, soviet-union]
    c: 'The *Liberty*, a Navy intelligence ship, some 13 miles off the Sinai coast northwest of El Arish, attacked by Israeli jet aircraft and three torpedo boats, about 8 a.m. Eastern time: 34 killed, more than 170 wounded. The Sixth Fleet launches aircraft to defend her; Johnson tells Kosygin over the hot line why. Israel apologizes the same day: a mistake. Rusk''s note to Harman, June 10: the attack "quite literally incomprehensible," "an act of military recklessness reflecting wanton disregard for human life."'
    n: 'FRUS 1964–68, XIX, docs. [204](https://history.state.gov/historicaldocuments/frus1964-68v19/d204), [210](https://history.state.gov/historicaldocuments/frus1964-68v19/d210), [212](https://history.state.gov/historicaldocuments/frus1964-68v19/d212), [219](https://history.state.gov/historicaldocuments/frus1964-68v19/d219), [256](https://history.state.gov/historicaldocuments/frus1964-68v19/d256). [[w.ennes-assault-on-the-liberty]]; [[w.cristol-liberty-incident]]; [[w.oren-six-days-of-war]]. See [[cal.1967-06-05.middle-east]]. Names: Johnson, Kosygin, Rusk, Harman.'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:rusk-dean, name:harman-avraham]
  - id: cal.1967-06-09.middle-east
    when: June 9–11
    date: '1967-06-09'
    thread: middle-east
    also: [soviet-union]
    c: 'Egypt accepts the cease-fire the night of June 8. June 9, Israel attacks Syria on the Golan Heights; Nasser resigns, and withdraws the resignation June 10. June 10, 8:48 a.m., Kosygin on the hot line: unless the fighting stops "in the next few hours," "necessary actions will be taken, including military." Johnson, with Thompson, Helms and McNamara, turns the Sixth Fleet east toward the Syrian coast. The Soviet Union breaks relations with Israel. Israel and Syria cease fire the evening of June 10; Resolution 236, June 11.'
    n: 'FRUS 1964–68, XIX, docs. [243](https://history.state.gov/historicaldocuments/frus1964-68v19/d243), [244](https://history.state.gov/historicaldocuments/frus1964-68v19/d244), [246](https://history.state.gov/historicaldocuments/frus1964-68v19/d246), [247](https://history.state.gov/historicaldocuments/frus1964-68v19/d247), [252](https://history.state.gov/historicaldocuments/frus1964-68v19/d252), [255](https://history.state.gov/historicaldocuments/frus1964-68v19/d255). Made public: Helms''s account of the morning of June 10, in Saunders''s memorandum of Oct. 22, 1968, FRUS 1964–68, XIX (2004). See [[cal.1967-06-05.middle-east]]. Names: Nasser, Kosygin, Thompson, Helms, McNamara, Johnson.'
    tags: [name:nasser-gamal-abdel, name:kosygin-aleksei, name:thompson-llewellyn-e, name:helms-richard, name:mcnamara-robert-s, name:johnson-lyndon-b, name:saunders-harold-h]
  - id: cal.1967-06-09.desegregation-schools-boston
    when: June 9
    date: '1967-06-09'
    thread: desegregation-schools
    also: [states-and-cities]
    c: 'Massachusetts. The Supreme Judicial Court upholds the Racial Imbalance Act against the Boston School Committee: not vague; the legislature''s finding of an emergency not open to review; no denial of equal protection, no pupil shown excluded from a school for his race.'
    n: '*School Committee of Boston v. Board of Education*, [352 Mass. 693](https://static.case.law/mass/352/html/0693-01.html) (1967). [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]. See [[cal.1966-04.desegregation-schools-boston]].'
    tags: [state:ma, city:boston]
  - id: cal.1967-06-11.civil-disorders
    when: June 11–15
    date: '1967-06-11'
    thread: civil-disorders
    c: Tampa. Martin Chambers, 19, a suspect in a burglary, shot in the back by a policeman as he runs, June 11; he dies. Rioting in the Central Avenue district that night and the next two. Kirk flies in, June 12; the National Guard called the same day, some 500 men. A patrol of young Negro men, the "White Hats," in the streets. Over 100 arrested.
    n: '[[w.report-of-the-national]]; [[w.mclaughlin-long-hot-summer-of]]. Names: Chambers, Kirk.'
    tags: [name:chambers-martin, name:kirk-claude-r-jr, state:fl, city:tampa]
  - id: cal.1967-06-12.civil-disorders
    when: June 12–15
    date: '1967-06-12'
    thread: civil-disorders
    c: Cincinnati, Avondale. A man protesting the conviction of his cousin, Posteal Laskey, as the "Cincinnati Strangler" arrested for loitering; a crowd, fires, looting, from the night of June 12. The Ohio National Guard sent in (Check the day). One killed, over 400 arrested (Check the figures).
    n: '[[w.report-of-the-national]]; [[w.mclaughlin-long-hot-summer-of]]. See [[cal.1967-06-11.civil-disorders]].'
    tags: [state:oh, city:cincinnati]
  - id: cal.1967-06-12.court
    when: June 12
    date: '1967-06-12'
    thread: court
    c: '*Loving v. Virginia*, [388 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388001/usrep388001.pdf): Virginia''s laws against marriage between white and colored persons, under which a couple married in Washington in 1958 were sentenced to a year in jail, suspended on condition that they leave the State for 25 years, violate the Equal Protection and Due Process Clauses. Sixteen States had such laws. Warren for a unanimous Court; Stewart concurring.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.wallenstein-race-sex-and-the]]; [[w.powe-warren-court-and-american]]; [[w.schwartz-super-chief]]. Names: Warren.'
    tags: [name:warren-earl, state:va]
  - id: cal.1967-06-12.court-2
    when: June 12
    date: '1967-06-12'
    thread: court
    also: [king, alabama]
    c: '*Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf): the contempt convictions of King and seven other ministers for marching on Good Friday and Easter, 1963, against a state court''s injunction, affirmed: five days in jail and $50 fines. They should have moved to dissolve the injunction, not disobeyed it. Stewart for the Court, 5–4; Warren, Douglas, Brennan and Fortas dissenting.'
    n: '[[w.westin-trial-of-martin-luther]]; [[w.garrow-bearing-the-cross]]. See [[cal.1963-04-12.alabama]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr, city:birmingham]
  - id: cal.1967-06-12.court-3
    when: June 12
    date: '1967-06-12'
    thread: court
    also: [crime-and-hijacking]
    c: '*Berger v. New York*, [388 U.S. 41](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388041/usrep388041.pdf): New York''s statute authorizing eavesdropping by court order violates the Fourth Amendment, its warrants too broad; a bribery conviction from bugs in a lawyer''s office reversed. Clark for the Court; Black, Harlan and White dissenting.'
    n: '[[w.powe-warren-court-and-american]].'
  - id: cal.1967-06-12.court-4
    when: June 12
    date: '1967-06-12'
    thread: court
    also: [press-and-broadcasting]
    c: '*Curtis Publishing Co. v. Butts*, [388 U.S. 130](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388130/usrep388130.pdf), with *Associated Press v. Walker*: libel of public figures. Butts''s judgment against the *Saturday Evening Post*, for an article that he had fixed a football game, affirmed; Edwin Walker''s against the Associated Press, for its report that he led a charge on the marshals at Oxford, Miss., in 1962, reversed. Harlan announces the judgments.'
    n: '[[w.powe-warren-court-and-american]]. See [[cal.1964-03-09.court]]; [[cal.1962-10-01.mississippi]]. Names: Walker.'
    tags: [name:walker-edwin-a]
  - id: cal.1967-06-12.vietnam
    when: June 12
    date: '1967-06-12'
    thread: vietnam
    c: 'McNamara''s draft memorandum on the bombing of the North, with Vance: against the Joint Chiefs'' program, heavy attacks on the Hanoi-Haiphong base and mining the ports (Alternative A); for Alternative B, the attacks generally confined to the neck of North Vietnam south of 20°.'
    n: 'FRUS 1964–68, V, doc. [194](https://history.state.gov/historicaldocuments/frus1964-68v05/d194). Made public: [[w.pentagon-papers]], IV, 189–191 (1971) (Check the volume). See [[cal.1967-05-19.vietnam]]. Names: McNamara, Vance.'
    tags: [name:mcnamara-robert-s, name:vance-cyrus]
  - id: cal.1967-06-13.court
    when: June 13
    date: '1967-06-13'
    thread: court
    c: 'Johnson, in the Rose Garden, noon: Thurgood Marshall, Solicitor General, nominated Associate Justice, for Tom Clark, who retires with the term, his son Ramsey Clark Attorney General since March. "The right thing to do, the right time to do it, the right man and the right place." The first Negro named to the Court. Johnson had told Ramsey Clark by telephone at 7:59 a.m.'
    n: '[Remarks to the Press Announcing the Nomination of Thurgood Marshall as Associate Justice of the Supreme Court](https://www.presidency.ucsb.edu/documents/remarks-the-press-announcing-the-nomination-thurgood-marshall-associate-justice-the) (June 13, 1967); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1191) (June 13, 1967). [Johnson and Ramsey Clark, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ramsey-clark-and-office-conversation-june-13), Conversation WH6706-01-11905-11906 (Miller Center). [[w.williams-thurgood-marshall]]; [[w.tushnet-making-constitutional-law]]; [[w.ball-defiant-life]]; [[w.haygood-showdown]]; [[w.kalman-long-reach-of-the-2017]]; [[w.dallek-flawed-giant]]. See [[cal.1967-02-28.court]]. Names: Marshall, Tom Clark, Ramsey Clark, Johnson.'
    tags: [name:marshall-thurgood, name:clark-tom-c, name:clark-ramsey, name:johnson-lyndon-b]
  - id: cal.1967-06-13.economy
    when: June 13
    date: '1967-06-13'
    thread: economy
    also: [program]
    c: 'H.R. 6950 signed, [81 Stat. 57](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg57-2.pdf): the 7 percent investment credit and accelerated depreciation on buildings restored, the suspension ended as of Mar. 9 instead of Dec. 31. Long''s Presidential Election Campaign Fund: no money to be paid out of it until Congress adopts guidelines by law. In the Senate, May 9: the fund to lapse Sept. 15 unless Congress acts, tied [48–48](https://voteview.com/rollcall/RS0900082) and lost, Humphrey voting nay; the guidelines amendment carried, [93–4](https://voteview.com/rollcall/RS0900083); the bill passed, [93–1](https://voteview.com/rollcall/RS0900084). May 2, the House''s repeal of the fund had stood, [46–52](https://voteview.com/rollcall/RS0900078).'
    n: '[[w.zelizer-taxing-america]]; [[w.mann-legacy-to-power]]. See [[cal.1966-09-08.economy]]; [[cal.1966-10-12.program]]. Names: Long, Humphrey.'
    tags: [name:long-russell-b, name:humphrey-hubert-h, name:johnson-lyndon-b]
  - id: cal.1967-06-13.congress
    when: June 13–23
    date: '1967-06-13'
    thread: congress
    c: 'Dodd. The Senate debates S. Res. 112, from June 13, the Select Committee on Standards and Conduct''s resolution, Stennis its chairman. "Reprimand" for "censure" lost, June 22, [9–87](https://voteview.com/rollcall/RS0900108). June 23: censured, [92–5](https://voteview.com/rollcall/RS0900112), for using money raised at testimonial dinners and in his campaigns for himself; the count on billing the Senate and a private body for the same trips struck, [51–45](https://voteview.com/rollcall/RS0900111).'
    n: '[[w.boyd-above-the-law]]; [[w.pearson-case-against-congress]]. See [[cal.1967-04-27.congress]]. Names: Dodd, Stennis.'
    tags: [name:dodd-thomas-j, name:stennis-john-c, state:ct]
  - id: cal.1967-06-17.testing
    when: June 17
    date: '1967-06-17'
    thread: testing
    also: [india-and-china]
    c: China explodes its first hydrogen bomb over Lop Nur, Sinkiang, dropped from an aircraft, some 3 megatons; 32 months after its first atomic test. Check the yield.
    n: '[*Peking Review*, no. 26 (1967)](https://www.marxists.org/subject/china/peking-review/1967/PR1967-26.pdf) (the communiqué). [[w.lewis-china-builds-the-bomb]]. See [[cal.1964-10-16.testing]]; [[cal.1966-05-17.testing]].'
  - id: cal.1967-06-17.civil-disorders
    when: June 17–20
    date: '1967-06-17'
    thread: civil-disorders
    also: [georgia]
    c: 'Atlanta, Dixie Hills. A fight at a shopping center, June 17; June 18, Carmichael speaks to a crowd of some 1,000; rocks and bottles, nine policemen hurt. June 20, after a meeting, police fire into a crowd: one killed. Ivan Allen to the neighborhood; Rap Brown there too.'
    n: '[[w.report-of-the-national]]; [[w.allen-mayor]]; [[w.stone-regime-politics]]. See [[cal.1967-06-11.civil-disorders]]. Names: Carmichael, Allen, Brown.'
    tags: [name:carmichael-stokely, name:allen-ivan-jr, name:brown-h-rap, city:atlanta]
  - id: cal.1967-06-19.middle-east
    when: June 19–28
    date: '1967-06-19'
    thread: middle-east
    also: [soviet-union]
    c: 'Johnson to the State Department''s conference for educators, June 19: "five great principles of peace" for the Middle East: every nation''s right to live; justice for the refugees; innocent maritime passage; limits on the arms race; political independence and territorial integrity for all. A return to the lines of June 4 "not a prescription for peace, but for renewed hostilities"; "certainly troops must be withdrawn." The same day Kosygin, at the General Assembly''s emergency special session (opened June 17): Israel to withdraw and pay for the damage, and to be condemned. Israel merges East Jerusalem with the city, June 27–28; a White House statement, June 28: no "hasty unilateral action."'
    n: '[Address at the State Department''s Foreign Policy Conference for Educators](https://www.presidency.ucsb.edu/documents/address-the-state-departments-foreign-policy-conference-for-educators) (June 19, 1967), with the statement of June 28 in its note. FRUS 1964–68, XIX, docs. [309](https://history.state.gov/historicaldocuments/frus1964-68v19/d309), [313](https://history.state.gov/historicaldocuments/frus1964-68v19/d313). See [[cal.1967-06-05.middle-east]]. Names: Kosygin, Johnson.'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:goldberg-arthur-j]
  - id: cal.1967-06-19.desegregation-schools-dc
    when: June 19
    date: '1967-06-19'
    thread: desegregation-schools
    also: [states-and-cities]
    c: 'Washington. Judge Wright, sitting in the District Court: the track system, the neighborhood school zones and the assignment of teachers deny Negro and poor children equal educational opportunity. The tracks abolished; optional zones ended; busing to relieve crowding; faculty to be integrated; plans due Oct. 2. The Board of Education votes 6–2 not to appeal and orders Superintendent Hansen not to; Hansen resigns and appeals (Check the dates).'
    n: '*Hobson v. Hansen*, [269 F. Supp. 401](https://static.case.law/f-supp/269/case-pdfs/0401-01.pdf) (D.D.C. 1967). [Wikipedia, "Hobson v. Hansen"](https://en.wikipedia.org/wiki/Hobson_v._Hansen). [[w.asch-chocolate-city]]; [[w.jaffe-dream-city]]. Names: Wright, Hansen.'
    tags: [state:dc, city:washington, name:wright-j-skelly, name:hansen-carl-f]
  - id: cal.1967-06-20.draft
    when: June 20
    date: '1967-06-20'
    thread: draft
    also: [war-opposition]
    c: Houston. Muhammad Ali convicted in federal court of refusing induction, after a jury's brief deliberation; Judge Ingraham sentences him to five years and $10,000, the maximum. Free on bail pending appeal.
    n: '[[w.remnick-king-of-the-world]]. See [[cal.1967-04-28.draft]]. Names: Ali.'
    tags: [name:ali-muhammad, state:tx, city:houston]
  - id: cal.1967-06-20.war-opposition
    when: June 20
    date: '1967-06-20'
    thread: war-opposition
    c: 'The House passes H.R. 10480, [387–16](https://voteview.com/rollcall/RH0900080): a year in prison or $1,000 for publicly mutilating, defacing, defiling, burning or trampling the flag. Flags had been burned at the Spring Mobilization in New York, Apr. 15.'
    n: '[[w.goldstein-saving-old-glory]].'
  - id: cal.1967-06-23.soviet-union
    when: June 23–25
    date: '1967-06-23'
    thread: soviet-union
    also: [middle-east, vietnam, testing]
    c: 'Glassboro, N.J., Hollybush, the house of the president of Glassboro State College: Johnson and Kosygin, June 23 and 25, their only meeting. The Middle East: Kosygin, Israel''s troops back to the armistice lines, the Gulf of Aqaba to the International Court; "unless you do this there will be a war." Johnson: talks on ABMs and ICBMs; when and where might McNamara meet Soviet representatives? Kosygin: offensive weapons too. June 25, Kosygin: Phạm Văn Đồng''s answer, received at lunch: stop the bombing and Hanoi will go to the conference table at once. Johnson gives him a message for Hanoi: the bombing might stop, with immediate discussions after. Rusk with Gromyko, June 23, on nonproliferation. Johnson to Eisenhower, June 25, by telephone.'
    n: '[Remarks Following the President''s First Meeting With Chairman Kosygin at Glassboro, New Jersey](https://www.presidency.ucsb.edu/documents/remarks-following-the-presidents-first-meeting-with-chairman-kosygin-glassboro-new-jersey) (June 23, 1967); [Remarks Following the President''s Second Meeting With Chairman Kosygin at Glassboro, New Jersey](https://www.presidency.ucsb.edu/documents/remarks-following-the-presidents-second-meeting-with-chairman-kosygin-glassboro-new-jersey) (June 25, 1967). FRUS 1964–68, XIV, docs. [228](https://history.state.gov/historicaldocuments/frus1964-68v14/d228)–[237](https://history.state.gov/historicaldocuments/frus1964-68v14/d237); XI, doc. [198](https://history.state.gov/historicaldocuments/frus1964-68v11/d198); V, doc. [217](https://history.state.gov/historicaldocuments/frus1964-68v05/d217). [Johnson and Eisenhower](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-june-26-1967), Conversation WH6706-01-11914 (Miller Center). Made public: the memoranda of conversation, FRUS 1964–68, XIV (2001). [[w.johnson-vantage-point]]; [[w.dobrynin-in-confidence]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.zubok-failed-empire]]; [[w.dallek-flawed-giant]]. See [[cal.1966-10-10.soviet-union]]. Names: Johnson, Kosygin, McNamara, Phạm Văn Đồng, Rusk, Gromyko, Eisenhower.'
    tags: [name:johnson-lyndon-b, name:kosygin-aleksei, name:mcnamara-robert-s, name:pham-van-dong, name:rusk-dean, name:gromyko-andrei, name:eisenhower-dwight-d]
  - id: cal.1967-06-23.war-opposition
    when: June 23
    date: '1967-06-23'
    thread: war-opposition
    c: Los Angeles, Century City. Some 10,000 march on the Century Plaza Hotel, where Johnson speaks at a President's Club dinner. Ordered to disperse, many sit down; the police clear the street with clubs. Arrests (Check the number).
    n: '[Remarks at a President''s Club Dinner in Los Angeles](https://www.presidency.ucsb.edu/documents/remarks-presidents-club-dinner-los-angeles) (June 23, 1967). [[w.davis-set-the-night-on]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:ca, city:los-angeles]
  - id: cal.1967-06-26.civil-disorders
    when: June 26–July 1
    date: '1967-06-26'
    thread: civil-disorders
    c: Buffalo, the East Side, William Street and Jefferson Avenue. Windows broken June 27; some 200 police with riot gear that night, 400 the next day; fires, looting, dozens hurt, many by gunshot. June 30, Jackie Robinson, Rockefeller's special assistant, with Sedita.
    n: '[[w.mclaughlin-long-hot-summer-of]]; [[w.goldman-high-hopes]]. See [[cal.1967-06-11.civil-disorders]]. Names: Jackie Robinson, Rockefeller, Sedita.'
    tags: [name:robinson-jackie, name:rockefeller-nelson, name:sedita-frank-a, state:ny, city:buffalo]
  - id: cal.1967-06-27.school-aid
    when: June 27–29
    date: '1967-06-27'
    thread: school-aid
    c: 'The Teacher Corps extended and enlarged, the Higher Education Act''s Title V rewritten. House, June 27: recommittal to strike the Teacher Corps lost, [146–257](https://voteview.com/rollcall/RH0900085); passed, [312–88](https://voteview.com/rollcall/RH0900086). Signed June 29, [81 Stat. 81](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg81-3.pdf).'
    n: '[Statement by the President Upon Signing Bill Extending and Enlarging the Teacher Corps](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-extending-and-enlarging-the-teacher-corps) (June 29, 1967). [[w.graham-uncertain-triumph]]. See [[cal.1965-11-08.school-aid]]; [[cal.1966-05-13.cities-and-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-06-28.vietnam
    when: June 28–30
    date: '1967-06-28'
    thread: vietnam
    c: 'Saigon. The generals of the Directorate, June 28–30, on the presidential election of Sept. 3: Thiệu and Kỳ, both declared candidates, on one ticket, Thiệu for President, Kỳ for Vice President, announced June 30. June 28, the division commanders agree to keep out of election politics; Dương Văn Minh not allowed home from Bangkok.'
    n: 'FRUS 1964–68, V, docs. [222](https://history.state.gov/historicaldocuments/frus1964-68v05/d222), [223](https://history.state.gov/historicaldocuments/frus1964-68v05/d223), [226](https://history.state.gov/historicaldocuments/frus1964-68v05/d226). [[w.ky-twenty-years-and-twenty]]; [[w.lam-history-of-south-vietnam-2021]]; [[w.schaffer-ellsworth-bunker]]; [[w.bunker-papers]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Dương Văn Minh.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:duong-van-minh, name:bunker-ellsworth]
  - id: cal.1967-06-30.draft
    when: June 30
    date: '1967-06-30'
    thread: draft
    also: [defense]
    c: 'Military Selective Service Act signed, [81 Stat. 100](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg100.pdf): induction authority to July 1, 1971. Undergraduates deferred until the degree or 24; graduate students no longer, but for medicine and the like and studies found "necessary to the maintenance of the national health, safety, or interest." No change in the order of induction, a lottery, without a further act of Congress. No judicial review of a classification but as a defense to prosecution after an order to report; the Justice Department to prosecute promptly or tell Congress why. Senate, May 11, [70–2](https://voteview.com/rollcall/RS0900092), a volunteer force refused, [9–69](https://voteview.com/rollcall/RS0900085); House, May 25, [362–9](https://voteview.com/rollcall/RH0900062); the conference report, Senate, June 14, [72–23](https://voteview.com/rollcall/RS0900106), House, June 20, [377–29](https://voteview.com/rollcall/RH0900079). Executive Order 11360, the same day.'
    n: '[Executive Order 11360—Amending the Selective Service Regulations](https://www.presidency.ucsb.edu/documents/executive-order-11360-amending-the-selective-service-regulations) (June 30, 1967). [[w.flynn-draft-1940-1973]]; [[w.flynn-lewis-b-hershey-mr]]; [[w.baskir-chance-and-circumstance]]. See [[cal.1967-03-06.draft]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-06-30.trade
    when: June 30
    date: '1967-06-30'
    thread: trade
    also: [farm]
    c: 'Geneva. The Kennedy Round''s agreements signed, Roth for the United States, the last day of the Trade Expansion Act''s authority. Cotton textiles: the cuts to snap back if the Long-Term Arrangement is not renewed in 1970. Johnson proclaims lower quotas on dairy imports.'
    n: 'FRUS 1964–68, VIII, docs. [367](https://history.state.gov/historicaldocuments/frus1964-68v08/d367), [368](https://history.state.gov/historicaldocuments/frus1964-68v08/d368), [370](https://history.state.gov/historicaldocuments/frus1964-68v08/d370). [Statement by the President Upon Signing Proclamation Reducing the Level of Dairy Imports](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-proclamation-reducing-the-level-dairy-imports) (June 30, 1967). See [[cal.1967-05-15.trade]]. Names: Roth, Johnson.'
    tags: [name:roth-william-m, name:johnson-lyndon-b]
