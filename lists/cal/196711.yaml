    c: 'Westmoreland at the National Press Club: "We have reached an important point when the end begins to come into view"; a phasing down of the American effort conceivable "within two years or less" (Check the words). The same morning, the President with Bunker, Westmoreland and his advisers: more allied troops, and the troops approved, as fast as possible. "I am beginning to agree with Bob McNamara that it does not appear the targets are worth the loss in planes."'
    n: 'FRUS 1964–68, V, doc. [409](https://history.state.gov/historicaldocuments/frus1964-68v05/d409). The address: [[w.department-of-state-bulletin]], [Dec. 11, 1967, 785–87](https://archive.org/details/departmentofstat5767unit/page/785/mode/1up) (Nov. 21, the National Press Club; "the end begins to come into view"; the text printed has U.S. units to "begin to phase down," not "within two years or less"). [[w.gibbons-u-s-government-and]], IV, 896–99 (the meeting; the speech, by the *Times* of Nov. 20); [[w.herring-lbj-and-vietnam]], 147 (the speech to the Press Club, Nov. 21: "the end begins to come into view"). To check: Tom Johnson''s notes of the meeting, Nov. 24, 1967, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 898 n.125). Gibbons dates the speech to the Press Club Nov. 19 (IV, 896). See [[cal.1967-11-13.vietnam]]. Names: Westmoreland, Bunker, Johnson, McNamara. Check: Herring, 147, has a meeting at the White House the next day, Nov. 22, on holding public support, by Westmoreland''s record of it.'
