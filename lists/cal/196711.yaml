# Cal. XCVII November 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XCVII
entries:
  - id: cal.1967-11-01.vietnam
    when: Nov. 1
    date: '1967-11-01'
    thread: vietnam
    c: 'McNamara''s "draft" memorandum to Johnson, a fifteen-month program, shown neither to Rusk, Rostow nor Wheeler: the present course will not bring success by the end of 1968 "in the eyes of the American public." He recommends: announce a stabilization, no more American forces and no wider operations against the North; plan a halt in the bombing; operations in the South reviewed to cut American casualties and give the South Vietnamese more of the war.'
    n: 'FRUS 1964–68, V, doc. [375](https://history.state.gov/historicaldocuments/frus1964-68v05/d375). [[w.mcnamara-in-retrospect]], 311–314; [[w.shapley-promise-and-power]]; [[w.barrett-uncertain-warriors]]; [[w.gibbons-u-s-government-and]], IV; [[w.berman-lyndon-johnsons-war]]. Made public: FRUS 1964–68, V (2002). Names: McNamara, Rusk, Rostow, Wheeler, Johnson.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b, name:rusk-dean, name:rostow-walt-w, name:wheeler-earle]
  - id: cal.1967-11-01.opinion
    when: Nov. 1
    date: '1967-11-01'
    thread: opinion
    also: [vietnam]
    c: 'Gallup and its affiliates in ten nations: the United States should begin to withdraw its troops, carry on at its present level of fighting, or increase its attacks on North Vietnam. Brazil 76, 5, 5 percent. Canada 41, 16, 23. England 45, 15, 15. Finland 81, 4, 5. France 72, 8, 5. Sweden 79, 10, 4. India 66, 4, 8. West Germany 58, 11, 14. Argentina 57, 6, 6. Australia 29, 18, 37.'
    n: '[[w.gallup-poll]], III, 2089.'
  - id: cal.1967-11-02.vietnam
    when: Nov. 1–2
    date: '1967-11-01'
    thread: vietnam
    c: 'The senior advisers at State and the White House: Acheson, Ball, McGeorge Bundy, Clifford, Dillon, Fortas, Lodge, Murphy, Taylor, Bradley among them. Johnson''s five questions, Nov. 2. No one for getting out; Acheson and Bundy: no negotiations to be expected, the bombing to be played down; Ball for shifting it to the DMZ.'
    n: 'FRUS 1964–68, V, doc. [377](https://history.state.gov/historicaldocuments/frus1964-68v05/d377). [[w.isaacson-wise-men]]; [[w.schandler-unmaking-of-a-president]]. Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-01.vietnam]]. Names: Acheson, Ball, Bundy, Clifford, Dillon, Fortas, Lodge, Murphy, Taylor, Bradley, Johnson.'
    tags: [name:johnson-lyndon-b, name:acheson-dean-g, name:ball-george-w, name:bundy-mcgeorge, name:clifford-clark, name:dillon-c-douglas, name:fortas-abe, name:lodge-henry-cabot, name:murphy-robert-d, name:taylor-maxwell, name:bradley-omar-n]
  - id: cal.1967-11-02.mayors-memphis
    when: Nov. 2
    date: '1967-11-02'
    thread: mayors
    also: [elections-1967]
    c: 'Memphis, under the charter of 1966: Loeb, mayor 1960–63, elected mayor over Mayor Ingram in the runoff, Ingram with most of the Negro vote. First round, Oct. 5, seven candidates; State Representative A. W. Willis Jr., the first Negro to run, fourth. Three Negroes elected to the council of thirteen (Check).'
    n: '[Wikipedia, "Henry Loeb"](https://en.wikipedia.org/wiki/Henry_Loeb); NAACP, [*Analysis of Run-Off Election, November 2, 1967*](https://radar.auctr.edu/islandora/object/auc.076%3A1958). Check: the Shelby County Election Commission''s returns, and the date of the first round. [[w.honey-going-down-jericho-road]]. See [[cal.1966-11-08.states-and-cities-memphis]]. Names: Loeb, Ingram, Willis.'
    tags: [state:tn, city:memphis, name:loeb-henry, name:ingram-william-b, name:willis-a-w-jr]
  - id: cal.1967-11-03.vietnam
    when: Nov. 3
    date: '1967-11-03'
    thread: vietnam-operations
    c: 'Đắk Tô, in the Central Highlands near the Laotian and Cambodian borders: the 4th Infantry Division and the 173d Airborne Brigade, with South Vietnamese units, against four North Vietnamese regiments.'
    n: '[[w.murphy-dak-to]]; [[w.cosmas-joint-chiefs-of-staff]]; [[w.westmoreland-soldier-reports]]; [[w.spector-after-tet]].'
    tags: [place:dak-to]
  - id: cal.1967-11-03.cities-and-housing
    when: Nov. 3
    date: '1967-11-03'
    thread: cities-and-housing
    c: 'Independent Offices and HUD Appropriation Act signed: more than $600 million under the January budget, $500 million of it from HUD. Model cities cut $350 million; rent supplements from $40 million to $10 million; the neighborhood centers out; mass transit down $55 million. Johnson: of the House Republicans, 93 percent voted to recommit and kill the rent supplements, 80 percent to recommit and delete the model cities funds.'
    n: 'Statement by the President Upon Signing the Independent Offices and Department of Housing and Urban Development Appropriation Act, 1968, [1967 Pub. Papers 989](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=381) (Nov. 3, 1967). [[w.haar-between-the-idea-and]]; [[w.zelizer-fierce-urgency-of-now]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-04.governors-la
    when: Nov. 4
    date: '1967-11-04'
    thread: governors
    also: [elections-1967, state-legislatures]
    c: 'Louisiana''s Democratic primary. McKeithen, the first governor the constitution lets succeed himself (the amendment of 1966), renominated, 836,304, 80.6 percent, over U.S. Representative Rarick, 179,846, 17.3; three others. No Republican files; the general election, Feb. 6, 1968, uncontested. Morial, a New Orleans lawyer, wins a House seat from Uptown in the primaries of 1967, the first Negro in the legislature since Reconstruction (Check: the round).'
    n: 'Votes: [Wikipedia, "1968 Louisiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Louisiana_gubernatorial_election), from the Secretary of State''s *Primary Election Returns*, 1967; [Wikipedia, "Dutch Morial"](https://en.wikipedia.org/wiki/Dutch_Morial). Check: the Secretary of State''s returns. [[w.peirce-deep-south-states-of]]; [[w.fairclough-race-and-democracy]]. See [[cal.1966-11-08.state-constitutions-la]]. Names: McKeithen, Rarick, Morial.'
    tags: [state:la, city:new-orleans, name:mckeithen-john-j, name:rarick-john-r, name:morial-ernest-n]
  - id: cal.1967-11-07.press-and-broadcasting
    when: Nov. 7
    date: '1967-11-07'
    thread: press-and-broadcasting
    c: 'Public Broadcasting Act signed, [81 Stat. 365](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg365.pdf): the Corporation for Public Broadcasting, a private nonprofit corporation, its fifteen directors appointed by the President with the Senate''s consent; $9 million authorized for it; grants for educational broadcast facilities, $10.5 million for fiscal 1968, $12.5 million for 1969, $15 million for 1970; a study of instructional television. The Carnegie Commission on Educational Television had proposed a corporation in January.'
    n: 'Remarks Upon Signing the Public Broadcasting Act of 1967, [1967 Pub. Papers 995](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=387) (Nov. 7, 1967). [[w.television-public-television]]; [[w.engelman-public-radio-and-television]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-07.mayors-cleveland
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: Cleveland. Stokes (D) elected mayor over Seth Taft (R), 129,318 to 127,467, 50.4 percent. He and Hatcher at Gary the first Negroes elected mayor of cities over 100,000.
    n: 'Votes: [Wikipedia, "1967 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1967_Cleveland_mayoral_election), from Our Campaigns. Check: the Cuyahoga County Board of Elections. See [[cal.1967-10-03.mayors-cleveland]]. Names: Stokes, Taft, Hatcher.'
    tags: [state:oh, city:cleveland, name:stokes-carl-b, name:taft-seth-c, name:hatcher-richard-g]
  - id: cal.1967-11-07.mayors-gary
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967, voting-rights]
    c: Gary. Hatcher (D) elected mayor over Joseph Radigan (R), 39,940 to 37,729, 51.4 percent, the Lake County Democratic organization, Krupa its chairman, for Radigan. Nov. 6, the federal court at Hammond enjoins the organization's officials in Gary from interfering with the election, on suits of the Justice Department and Hatcher (Check). The National Guard stands by.
    n: '*Observer* (Notre Dame), [Nov. 9, 1967](https://archives.nd.edu/Observer/1967-11-09_v02_022.pdf), 1. Votes: [Wikipedia, "1967 Gary, Indiana, mayoral election"](https://en.wikipedia.org/wiki/1967_Gary,_Indiana,_mayoral_election), from Our Campaigns. Check: the Lake County canvass; the suits'' titles. See [[cal.1967-05-02.mayors-gary]]. Names: Hatcher, Radigan, Krupa.'
    tags: [state:in, city:gary, name:hatcher-richard-g, name:radigan-joseph-b, name:krupa-john-g]
  - id: cal.1967-11-07.mayors-boston
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: Boston. White elected mayor over Hicks, 102,706 to 90,154, 53.3 percent. Sworn Jan. 1.
    n: '[Boston, *Annual Report of the Election Department*, 1967 (City Document No. 10), 107](https://archive.org/details/annualreportofbo1967bost/page/n116/mode/1up). See [[cal.1967-09-26.mayors-boston]]. Names: White, Hicks.'
    tags: [state:ma, city:boston, name:white-kevin-h, name:hicks-louise-d]
  - id: cal.1967-11-07.mayors-philadelphia
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: Philadelphia. Tate (D) re-elected over Specter (R), 353,326 to 342,398, 49.0 percent; Cecil Moore (Political Freedom Rights) 9,031, 1.3; two others.
    n: 'Votes: [Wikipedia, "1967 Philadelphia mayoral election"](https://en.wikipedia.org/wiki/1967_Philadelphia_mayoral_election), from the city''s list of mayors. [*New York Times*, Nov. 8, 1967](https://www.nytimes.com/1967/11/08/archives/fate-beats-specter-in-philadelphia-mayors-race.html). Check: the County Board of Elections'' returns. See [[cal.1967-05-16.mayors-philadelphia]]. Names: Tate, Specter, Moore.'
    tags: [state:pa, city:philadelphia, name:tate-james-h-j, name:specter-arlen, name:moore-cecil-b]
  - id: cal.1967-11-07.mayors-indianapolis
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: Indianapolis. Richard Lugar (R), once of the school board, elected mayor over Mayor Barton (D), 72,278 to 63,284, 53.3 percent. Republicans take the city council, 6 to 3.
    n: 'Votes: [Wikipedia, "1967 Indianapolis mayoral election"](https://en.wikipedia.org/wiki/1967_Indianapolis_mayoral_election). Check: the Marion County canvass. [[w.encyclopedia-of-indianapolis]]. See [[cal.1963-11-05.mayors-indianapolis]]. Names: Lugar, Barton.'
    tags: [state:in, city:indianapolis, name:lugar-richard-g, name:barton-john-j]
  - id: cal.1967-11-07.state-constitutions-ny
    when: Nov. 7
    date: '1967-11-07'
    thread: state-constitutions
    also: [elections-1967, transportation]
    c: New York's voters reject the convention's constitution, 1,327,999 to 3,487,513, 27.6 percent for. They approve Rockefeller's transportation bond issue, $2.5 billion (Check the vote).
    n: '[New York State Constitutional Convention Clearinghouse, results of the referendums to ratify](https://newyork.concon.info/?p=315). Check: the *Legislative Manual*, 1968; [*New York Times*, Dec. 12, 1967, 37](https://www.nytimes.com/1967/12/12/archives/new-charter-lost-by-2million-votes.html), the official canvass. See [[cal.1967-04-04.state-constitutions-ny]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1967-11-07.legislatures-nj
    when: Nov. 7
    date: '1967-11-07'
    thread: state-legislatures
    also: [elections-1967, legislatures]
    c: 'New Jersey''s legislative elections, the first under the districts of the 1966 convention, a Senate of forty: Republicans 31 seats, Democrats 9; in the outgoing Senate Democrats 18, Republicans 8. Republicans take the Assembly too (Check the count). Hughes, a Democrat, faces Republican majorities in both houses.'
    n: '[*Results of the General Election Held November 7, 1967*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1967-general-election.pdf) (Secretary of State); [Wikipedia, "1967 New Jersey Senate election"](https://en.wikipedia.org/wiki/1967_New_Jersey_Senate_election). [[w.salmore-new-jersey-politics-and]]. See [[cal.1966-11-08.state-constitutions-nj]]; [[cal.1965-11-02.governors-nj]]. Names: Hughes.'
    tags: [state:nj, name:hughes-richard-j]
  - id: cal.1967-11-07.governors
    when: Nov. 7
    date: '1967-11-07'
    thread: governors
    also: [elections-1967]
    c: 'Two governors elected. Kentucky: Nunn (R) over Ward (D), 51.2 percent, the State''s first Republican governor since 1943; a Republican gain. Mississippi: John Bell Williams (D) over Phillips (R), 70.3 percent. Governorships after the election: Republicans 26, Democrats 24.'
    n: '[Kentucky, Secretary of State, "1967 General Election Results"](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf); [Wikipedia, "1967 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1967_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). Check: Mississippi''s official returns. [[w.sabato-goodbye-to-good-time]]. Names: Nunn, Ward, Williams, Phillips.'
    tags: [governors:1967-11-07, state:ky, state:ms, name:nunn-louie-b, name:ward-henry, name:williams-john-b, name:phillips-rubel]
  - id: cal.1967-11-07.mississippi-ms
    when: Nov. 7
    date: '1967-11-07'
    thread: mississippi
    also: [governors, legislatures, elections-1967, voting-rights, state-legislatures]
    c: 'Mississippi. Williams (D) elected governor over Rubel Phillips (R), 315,318 to 133,379, 70.3 percent; the Freedom Democrats had endorsed Phillips. The legislature elected in the districts the federal court drew. In Holmes County, Robert Clark, a teacher, on the Freedom Democrats'' slate, elected to the House: the first Negro in the legislature since the 1890s. He takes his seat Jan. 2, 1968.'
    n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election); [Wikipedia, "Robert G. Clark Jr."](https://en.wikipedia.org/wiki/Robert_G._Clark_Jr.); [SNCC Digital Gateway, "November 1967"](https://snccdigital.org/?p=166). Check: MDAH Series 0107; *Mississippi Official and Statistical Register, 1968–1972*. [[w.campbell-robert-g-clarks-journey]]; [[w.parker-black-votes-count]]; [[w.dittmer-local-people]]. See [[cal.1967-08-29.mississippi-ms]]; [[cal.1966-07-22.mississippi-ms]]. Names: Williams, Phillips, Clark.'
    tags: [state:ms, name:williams-john-b, name:phillips-rubel, name:clark-robert-g-jr]
  - id: cal.1967-11-07.governors-ky
    when: Nov. 7
    date: '1967-11-07'
    thread: governors
    also: [elections-1967]
    c: Kentucky. Nunn (R) elected governor over Ward (D), 454,123 to 425,674, 51.2 percent; a third candidate 7,149. The first Republican governor elected since 1943. Chandler had endorsed Nunn. The Democrats keep the lieutenant governorship and the General Assembly.
    n: '[Ky. *Statement of the Official Vote*, general election, Nov. 7, 1967](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=6). [[w.harrison-new-history-of-kentucky]], 413–14. See [[cal.1967-05-23.governors-ky]]. Names: Nunn, Ward, Chandler.'
    tags: [state:ky, name:nunn-louie-b, name:ward-henry, name:chandler-a-b]
  - id: cal.1967-11-07.legislatures-va
    when: Nov. 7
    date: '1967-11-07'
    thread: state-legislatures
    also: [elections-1967, voting-rights]
    c: Virginia, the General Assembly. William Ferguson Reid, a Richmond surgeon, a founder of the Richmond Crusade for Voters, elected to the House of Delegates, the first Negro in the Assembly since 1891; a segregationist delegate unseated. Takes his seat in January.
    n: '[Wikipedia, "William Ferguson Reid"](https://en.wikipedia.org/wiki/William_Ferguson_Reid), from the State Board of Elections'' *Statement of the Vote*, Nov. 7, 1967. Check: [the State''s historical database](https://historical.elections.virginia.gov/) for his district and vote. [[w.atkinson-dynamic-dominion]]; [[w.heinemann-harry-byrd-of-virginia]]. Names: Reid.'
    tags: [state:va, city:richmond, name:reid-william-ferguson]
  - id: cal.1967-11-07.mayors-san-francisco
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: San Francisco. Alioto elected mayor, 110,405, 44.2 percent, over Dobbs, 94,504, 37.8, and Jack Morrison of the Board of Supervisors, 40,438, 16.2; fifteen others. Alioto entered after McAteer, the leading candidate, died in May; Shelley withdrew.
    n: 'Votes: [Wikipedia, "1967 San Francisco mayoral election"](https://en.wikipedia.org/wiki/1967_San_Francisco_mayoral_election), from Our Campaigns; Check: the Registrar of Voters'' statement of the vote, and the dates of McAteer''s death and Shelley''s withdrawal. [[w.hartman-city-for-sale]]; [[w.peirce-pacific-states-of-america]]. See [[cal.1963-11-05.mayors-san-francisco]]. Names: Alioto, Dobbs, Morrison, McAteer, Shelley.'
    tags: [state:ca, city:san-francisco, name:alioto-joseph-l, name:dobbs-harold, name:morrison-jack, name:mcateer-j-eugene, name:shelley-john-f]
  - id: cal.1967-11-07.state-constitutions-san-francisco
    when: Nov. 7
    date: '1967-11-07'
    thread: state-constitutions
    also: [war-opposition]
    c: San Francisco's voters reject Proposition P, a declaration of policy for a cease-fire and the withdrawal of American troops from Vietnam, put on the ballot by the State Supreme Court's order (Check the figures).
    n: '*Farley v. Healey*, [67 Cal. 2d 325](https://static.case.law/cal-2d/67/case-pdfs/0325-01.pdf) (1967), the order. Check: the Registrar of Voters'' statement of the vote. [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]. See [[cal.1967-10-16.war-opposition]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1967-11-07.mayors-san-diego
    when: Nov. 7
    date: '1967-11-07'
    thread: mayors
    also: [elections-1967]
    c: San Diego. Curran re-elected mayor over Hitch, 96,597 to 47,230, 67.2 percent.
    n: 'Votes: [City Clerk, *Election History: Mayor*](https://www.sandiego.gov/sites/default/files/legacy/city-clerk/pdf/mayorresults.pdf). See [[cal.1967-09-19.mayors-san-diego]]. Names: Curran, Hitch.'
    tags: [state:ca, city:san-diego, name:curran-frank, name:hitch-allen]
  - id: cal.1967-11-07.vietnam-operations
    when: Nov. 7
    date: '1967-11-07'
    thread: vietnam-operations
    c: Lộc Ninh's last fight. The 1st Battalion, 26th Infantry, searching for the 272d Regiment northeast of the town, hit; its commander and command group killed by rocket-propelled grenades; 18 killed, 22 wounded; 66 of the enemy dead left. The week-long battle over.
    n: '[[w.villard-united-states-army-in]], 60–62. See [[cal.1967-10-29.vietnam-operations]].'
    tags: [place:loc-ninh]
  - id: cal.1967-11-08.women
    when: Nov. 8
    date: '1967-11-08'
    thread: women
    also: [defense]
    c: 'Signed, [81 Stat. 374](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg374.pdf): the limits on the careers of women officers in the armed forces removed; the ceiling of 2 percent on women''s strength lifted; women eligible for permanent promotion to general and flag rank (Check the terms). Oveta Culp Hobby, the first director of the Women''s Army Auxiliary Corps, at the signing.'
    n: 'Remarks Upon Signing Bill Providing Equal Opportunity in Promotions for Women in the Armed Forces, [1967 Pub. Papers 998](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=390) (Nov. 8, 1967). [[w.harrison-on-account-of-sex]]. Names: Hobby, Johnson.'
    tags: [name:johnson-lyndon-b, name:hobby-oveta-culp]
  - id: cal.1967-11-08.foreign-aid
    when: Nov. 8
    date: '1967-11-08'
    thread: foreign-aid
    c: Foreign Assistance Act of 1967. The House adopts the conference report, [205–188](https://voteview.com/rollcall/RH0900202), after refusing to recommit it, [196–200](https://voteview.com/rollcall/RH0900201), with instructions to insist on amendments against countries trading with North Vietnam.
    n: 'Check: the Record''s page. [[w.zelizer-fierce-urgency-of-now]]; [[w.brands-wages-of-globalism]]. See [[cal.1967-08-17.foreign-aid]].'
  - id: cal.1967-11-09.space
    when: Nov. 9
    date: '1967-11-09'
    thread: space
    c: 'Apollo 4, unmanned: the first Saturn V launched from Cape Kennedy, all three stages; the command module recovered in the Pacific. Johnson: the flight has shown "we can launch and bring back safely to earth the spaceship that will take men to the moon."'
    n: 'Statement by the President on the Successful Launching of the First Saturn V Rocket, [1967 Pub. Papers 1007](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=399) (Nov. 9, 1967). [[w.bilstein-stages-to-saturn]]; [[w.lambright-powering-apollo]]. See [[cal.1967-01-27.space-2]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-09.states-and-cities-nyc
    when: Nov. 9
    date: '1967-11-09'
    thread: states-and-cities
    c: 'New York City. Lindsay''s Advisory Panel on Decentralization, Bundy its chairman, reports, *Reconnection for Learning*: the schools to be divided into thirty to sixty community districts, each with a board chosen largely by parents, with power over budget, staff and curriculum. Check the day.'
    n: '[[w.schools-reconnection-for-learning|full]]. [Wikipedia, "Bundy Report"](https://en.wikipedia.org/wiki/Bundy_Report). See [[cal.1967-07.states-and-cities-nyc]]. Names: Lindsay, Bundy.'
    tags: [state:ny, city:nyc, name:lindsay-john-v, name:bundy-mcgeorge]
  - id: cal.1967-11-09.oil
    when: Nov. 9
    date: '1967-11-09'
    thread: oil
    c: 'Johnson, Proclamation 3820: the Secretary of the Interior may allocate up to 15,000 barrels a day of finished products into Districts I–IV to promote employment in the Virgin Islands, where petrochemical plants are proposed. No White House release.'
    n: '[Proclamation 3820](https://www.presidency.ucsb.edu/documents/proclamation-3820-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [32 Fed. Reg. 15701](https://www.govinfo.gov/app/details/FR-1967-11-15). See [[cal.1967-07-17.oil]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-10.governors-tx
    when: Nov. 10
    date: '1967-11-10'
    thread: governors
    also: [elections-1968]
    c: 'Texas. Connally: he does not "intend to be a candidate for reelection," after eight years of public service; no fourth term. The race for 1968 opens.'
    n: '[*The Battalion* (Texas A&M), Nov. 10, 1967, 1](https://newspaper.library.tamu.edu/lccn/sn86088544/1967-11-10/ed-1/seq-1.pdf). Check: the day of the announcement. [[w.reston-lone-star]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1966-05-07.governors-tx]]. Names: Connally.'
    tags: [state:tx, name:connally-john]
  - id: cal.1967-11-11.war-opposition
    when: Nov. 11
    date: '1967-11-11'
    thread: war-opposition
    also: [vietnam]
    c: Phnom Penh. The NLF releases three American prisoners, Army sergeants, to Hayden; they return to the United States with him (Check the date and the route).
    n: '[[w.hershberger-traveling-to-vietnam]]; [[w.wells-war-within]]. Names: Hayden.'
    tags: [name:hayden-tom, place:phnom-penh]
  - id: cal.1967-11-11.state-constitutions-tx
    when: Nov. 11
    date: '1967-11-11'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Texas adopts six amendments: the Veterans'' Land Fund''s bonds raised to $400 million, 58.7 percent; a Texas Park Development Fund and its bonds, 54.7; counties to pay medical expenses of officers hurt on duty, 65.4; counties to put their taxes in one general fund, 50.3; and two others.'
    n: 'Texas Legislative Council, [*Amendments to the Texas Constitution Since 1876*](https://tlc.texas.gov/docs/amendments/Constamend1876.pdf) (2026), art. 3, §§ 49-b, 49-e, 52e; art. 8, § 9; art. 9, § 13; art. 16, § 33. Check: the Secretary of State''s canvass. [[w.reston-lone-star]]. See [[cal.1966-11-08.state-constitutions-tx]].'
    tags: [state:tx]
  - id: cal.1967-11-12.opinion
    when: Nov. 12
    date: '1967-11-12'
    thread: opinion
    also: [vietnam, civil-rights-the-executive, elections-1968-polls]
    c: 'Gallup, Oct. 27–Nov. 1: the most important problem facing the nation: Vietnam 50 percent, civil rights 21, the high cost of living 16. The party better able to handle it: Republican 30, Democratic 26, no difference 28.'
    n: '[[w.gallup-poll]], III, 2090.'
  - id: cal.1967-11-13.vietnam-order-of-battle
    when: Nov. 13
    date: '1967-11-13'
    thread: vietnam-order-of-battle
    c: 'SNIE 14.3-67, *Capabilities of the Vietnamese Communists for Fighting in South Vietnam*, as of Oct. 1: regular forces 118,000; guerrillas 70,000–90,000, reduced since early 1966; administrative services 35,000–40,000; at most 248,000. Political cadre 75,000–85,000 outside the total; the self-defense militia not counted.'
    n: 'FRUS 1964–68, V, doc. [397](https://history.state.gov/historicaldocuments/frus1964-68v05/d397) and its note. Made public: FRUS 1964–68, V (2002), in part. See [[cal.1967-09-09.vietnam-order-of-battle]].'
    tags: [name:helms-richard]
  - id: cal.1967-11-14.foreign-aid
    when: Nov. 14
    date: '1967-11-14'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1967 signed, [81 Stat. 445](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg445.pdf). Johnson: the authorization nearly $400 million under his request, already the lowest; the cuts "reduce the margin of hope to the danger point."'
    n: '[Statement by the President Upon Signing the Foreign Assistance Act of 1967](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-assistance-act-1967) (Nov. 15, 1967). Statute (K–J Cong. II.J.2). See [[cal.1967-11-08.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-14.japan-and-korea
    when: Nov. 14–15
    date: '1967-11-14'
    thread: japan
    c: 'Satō at the White House. Joint statement, Nov. 15: consultations at once on the early return of the Bonin Islands to Japan, the American bases there kept under the security treaty. The Ryukyus: Satō asks that the two governments agree "within a few years" on a date for their reversion; Johnson "fully understands" the desire. A subcommittee on the two countries'' balance of payments.'
    n: 'Joint Statement Following Discussions With Prime Minister Sato of Japan, [1967 Pub. Papers 1033](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=425) (Nov. 15, 1967). FRUS 1964–68, XXIX, pt. 2, docs. [102](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d102), [105](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d105). [[w.sarantakes-keystone]]; [[w.schaller-altered-states]]. Names: Satō, Johnson.'
    tags: [name:sato-eisaku, name:johnson-lyndon-b]
  - id: cal.1967-11-14.vietnam-order-of-battle
    when: Nov. 14
    date: '1967-11-14'
    thread: vietnam-order-of-battle
    c: 'Helms sends the estimate to Johnson: "sensitive and potentially controversial" for the "variance" of its figures with past estimates. He had thought of withholding it.'
    n: 'Helms to the President, Nov. 14, quoted in a note to FRUS 1964–68, V, doc. [397](https://history.state.gov/historicaldocuments/frus1964-68v05/d397). Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Helms, Johnson.'
    tags: [name:helms-richard, name:johnson-lyndon-b]
  - id: cal.1967-11-13.vietnam
    when: Nov. 15
    date: '1967-11-15'
    thread: vietnam
    c: 'Bunker, Westmoreland and Komer in Washington. Bunker to the President, Rusk, McNamara, Wheeler and Helms: to Congress''s committees he reported "steady progress on the political, military, and economic front."'
    n: 'FRUS 1964–68, V, doc. [400](https://history.state.gov/historicaldocuments/frus1964-68v05/d400). [[w.westmoreland-soldier-reports]]; [[w.sorley-westmoreland]]; [[w.schaffer-ellsworth-bunker]]; [[w.hammond-public-affairs]]; [[w.oberdorfer-tet]]; [[w.schmitz-tet-offensive]]. See [[cal.1967-11-01.vietnam]]. Names: Bunker, Westmoreland, Komer, Rusk, McNamara, Wheeler, Helms, Johnson.'
    tags: [name:bunker-ellsworth, name:westmoreland-william, name:komer-robert-w, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:helms-richard, name:johnson-lyndon-b]
  - id: cal.1967-11-15.europe-and-the-alliance
    when: Nov. 15
    date: '1967-11-15'
    thread: cyprus
    c: Cyprus. Grivas's National Guard attacks the Turkish Cypriot villages of Ayios Theodoros and Kophinou; fighting stops on orders from Athens. Turkey readies an invasion and demands the Greek troops on the island withdrawn and Grivas out.
    n: 'FRUS 1964–68, XVI, doc. [308](https://history.state.gov/historicaldocuments/frus1964-68v16/d308). [[w.nicolet-united-states-policy-towards]]; [[w.miller-united-states-and-the]]. See [[cal.1964-01-25.europe-and-the-alliance]]. Names: Grivas.'
    tags: [name:grivas-george]
  - id: cal.1967-11-15.poverty
    when: Nov. 15
    date: '1967-11-15'
    thread: poverty
    c: 'Economic Opportunity Amendments. The House: no funds or personnel for an unlawful civil disturbance, [332–79](https://voteview.com/rollcall/RH0900205); recommitted with instructions to cut $920 million, [221–190](https://voteview.com/rollcall/RH0900206); passed, [283–129](https://voteview.com/rollcall/RH0900207) (Check the day). Green''s amendment: the community action agency designated by the State or local government; its board a third public officials, at least a third chosen to represent the poor, the rest from the community''s groups.'
    n: 'Check: the Record''s page. [[w.zelizer-fierce-urgency-of-now]]; [[w.matusow-unraveling-of-america]]; [[w.davies-from-opportunity-to-entitlement]]. See [[cal.1967-10-05.poverty]]. Names: Green.'
    tags: [name:green-edith]
  - id: cal.1967-11-15.opinion
    when: Nov. 15
    date: '1967-11-15'
    thread: opinion
    also: [draft, defense]
    c: 'Gallup, Oct. 27–Nov. 1: the base pay of young men entering the armed forces raised to the minimum wage of business and industry: favor 80 percent, oppose 17. It would attract enough men to make the draft unnecessary: yes 42, no 50.'
    n: '[[w.gallup-poll]], III, 2090.'
  - id: cal.1967-11-15.vietnam-order-of-battle
    when: Nov. 15
    date: '1967-11-15'
    thread: vietnam-order-of-battle
    c: 'Rostow to Johnson with the estimate: manpower the Communists'' main problem; guerrillas reduced since early 1966; the main forces held up by North Vietnamese replacements. Not in it, Wheeler''s count of combat-effective enemy battalions: all 123 in Oct. 1965, 87 of 162 in Oct. 1967.'
    n: 'FRUS 1964–68, V, doc. [399](https://history.state.gov/historicaldocuments/frus1964-68v05/d399), 12:15 p.m.; the President saw it. Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Rostow, Johnson, Wheeler.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:wheeler-earle]
  - id: cal.1967-11-17.vietnam
    when: Nov. 17
    date: '1967-11-17'
    thread: vietnam
    also: [press-and-broadcasting, elections-1968]
    c: 'News conference: "constructive dissent" is not "storm trooper bullying"; whether he will run, "I will cross that bridge when I get to it."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1199) (Nov. 17, 1967). See [[cal.1967-11-13.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-17.students-philadelphia
    when: Nov. 17
    date: '1967-11-17'
    thread: students
    also: [states-and-cities]
    c: Philadelphia. Some 3,500 Negro high school students walk out to the Board of Education for courses in Negro history, more Negro teachers and the right to wear African dress. Rizzo, police commissioner since May, sends in the police; students and others beaten and arrested. Check the figures.
    n: '[Chalkbeat, Sept. 25, 2002](https://chalkbeat.org/philadelphia/2002/9/25/22185400/1967-african-american-students-strike-survive-police-riot-to-force-change); [WHYY](https://whyy.org/segments/honoring-50th-anniversary-pivotal-student-protest-philadelphia). Check: *Philadelphia Inquirer*, Nov. 18, 1967. [[w.countryman-up-south]]. Names: Rizzo.'
    tags: [state:pa, city:philadelphia, name:rizzo-frank-l]
  - id: cal.1967-11-18.economy
    when: Nov. 18
    date: '1967-11-18'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Sterling devalued, from $2.80 to $2.40, 14.3 percent; Bank rate to 8 percent; credits for Britain, an IMF standby among them. Johnson''s statement: the United States "will continue to meet its international monetary responsibilities"; gold bought and sold at $35 an ounce. Johnson with Fowler, Martin and the congressional leaders: the dollar''s defense, and the need for the tax increase.'
    n: 'Statement by the President on the Devaluation of the British Pound, [1967 Pub. Papers 1057](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=449) (Nov. 18, 1967). FRUS 1964–68, VIII, docs. [150](https://history.state.gov/historicaldocuments/frus1964-68v08/d150), [154](https://history.state.gov/historicaldocuments/frus1964-68v08/d154); XII, doc. [279](https://history.state.gov/historicaldocuments/frus1964-68v12/d279). [[w.cairncross-sterling-in-decline]]; [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]; [[w.wilson-labour-government-1964-1970]]. See [[cal.1966-07-29.europe-and-the-alliance]]. Names: Fowler, Martin, Johnson.'
    tags: [name:johnson-lyndon-b, name:fowler-henry-h, name:martin-william-mcchesney-jr]
  - id: cal.1967-11-18.elections-1968
    when: Nov. 18
    date: '1967-11-18'
    thread: elections-1968
    c: Detroit, the Veterans Memorial Building. Romney announces for the Republican nomination; to campaign first in New Hampshire.
    n: '[[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.mollenhoff-george-romney]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1966-12-09.elections-1968-us]]. Names: Romney.'
    tags: [name:romney-george-w, state:mi, city:detroit]
  - id: cal.1967-11-19.opinion
    when: Nov. 19
    date: '1967-11-19'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Oct. 27–Nov. 1: Republicans'' choice for 1968: Nixon 42 percent, Rockefeller 15, Romney 14, Reagan 13, Percy 5, Lindsay 3, Hatfield 3. Independents: Nixon 28, Rockefeller 21, Reagan 16, Romney 14, Percy 7. Democrats who disapprove of Johnson: Nixon 22, Rockefeller 20, Reagan 17, Romney 17, Percy 9.'
    n: '[[w.gallup-poll]], III, 2090–91. Names: Nixon, Rockefeller, Romney, Reagan, Percy, Lindsay, Hatfield, Johnson.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:romney-george-w, name:reagan-ronald, name:percy-charles-h, name:lindsay-john-v, name:hatfield-mark-o, name:johnson-lyndon-b]
  - id: cal.1967-11-19.vietnam
    when: Nov. 19
    date: '1967-11-19'
    thread: vietnam
    also: [press-and-broadcasting]
    c: Bunker and Westmoreland on *Meet the Press*.
    n: 'Check: the transcript. See [[cal.1967-11-13.vietnam]]. Names: Bunker, Westmoreland.'
    tags: [name:bunker-ellsworth, name:westmoreland-william]
  - id: cal.1967-11-19.economy
    when: Nov. 19
    date: '1967-11-19'
    thread: economy
    c: 'The Board announces the Reserve Banks'' discount rate from 4 to 4½ percent, "in the light of the action of the British Government to change the parity of the pound": New York from Nov. 20, Philadelphia Nov. 21, St. Louis Nov. 27.'
    n: The Board's [press release, Nov. 19, 1967](https://fraser.stlouisfed.org/title/9237/item/697571); *Federal Reserve Bulletin*, Nov. 1967, 1921; Dec. 1967, 2083. See [[cal.1967-11-18.economy]].
  - id: cal.1967-11-19.vietnam-operations
    when: Nov. 19
    date: '1967-11-19'
    thread: vietnam-operations
    c: 'Đắk Tô: Hill 875. The 2d Battalion, 503d Infantry, of the 173d Airborne Brigade, starts up the hill against the North Vietnamese 174th Regiment. That evening a misplaced bomb kills 42 paratroopers and wounds 45.'
    n: '[[w.villard-united-states-army-in]], 170–174; [[w.eggleston-dak-to-and-the]]. See [[cal.1967-11-03.vietnam]].'
    tags: [place:hill-875, place:dak-to]
  - id: cal.1967-11-20.consumers
    when: Nov. 20
    date: '1967-11-20'
    thread: consumers
    c: 'Signed, [81 Stat. 466](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg466-3.pdf): the National Commission on Product Safety, seven members, to study the hazards of household products and report in two years (Check). The House had passed it, [205–102](https://voteview.com/rollcall/RH0900193), Nov. 6. Johnson: 125,000 Americans hurt each year by faulty heating devices.'
    n: 'Remarks Upon Signing Bill Establishing the National Commission on Product Safety, [1967 Pub. Papers 1060](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=452) (Nov. 20, 1967). [[w.nadel-politics-of-consumer-protection]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-20.health-ca
    when: Nov. 20
    date: '1967-11-20'
    thread: health
    also: [welfare]
    c: '*Morris v. Williams*, [67 Cal. 2d 733](https://static.case.law/cal-2d/67/case-pdfs/0733-01.pdf): the Supreme Court of California holds unlawful the Health and Welfare Agency''s regulations cutting Medi-Cal''s services: physicians'' services restricted while the medically indigent stayed in the program; services cut out without showing that proportionate cuts could not be made. A class action brought by California Rural Legal Assistance.'
    n: '[Opinion](https://scocal.stanford.edu/opinion/morris-v-williams-32900) (SCOCAL). [[w.stevens-welfare-medicine-in-america]]; [[w.engel-poor-peoples-medicine]]; [[w.cannon-governor-reagan]]. See [[cal.1966-12.health-us]]. Check: the date of the regulations (Aug. 1967) and the sum restored.'
    tags: [state:ca]
  - id: cal.1967-11-21.conservation
    when: Nov. 21
    date: '1967-11-21'
    thread: conservation
    c: 'Air Quality Act signed, [81 Stat. 485](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg485.pdf): HEW to designate air quality control regions and issue criteria and control techniques; the States to set standards for their regions and plans to meet them, HEW to act where they do not; federal standards for new cars'' emissions, the States barred from their own but California. Muskie''s bill. Johnson: "at least 130 million tons of poison into the air each year."'
    n: 'Remarks Upon Signing the Air Quality Act of 1967, [1967 Pub. Papers 1067](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=459) (Nov. 21, 1967). Statute (K–J Cong. II.J.2). [[w.davies-politics-of-pollution]]; [[w.jones-clean-air]]; [[w.dewey-dont-breathe-the-air]]. Names: Muskie, Johnson.'
    tags: [name:muskie-edmund-s, name:johnson-lyndon-b]
  - id: cal.1967-11-21.vietnam-2
    when: Nov. 21
    date: '1967-11-21'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Westmoreland at the National Press Club: "We have reached an important point when the end begins to come into view"; a phasing down of the American effort conceivable "within two years or less" (Check the words). The same morning, the President with Bunker, Westmoreland and his advisers: more allied troops, and the troops approved, as fast as possible.'
    n: 'FRUS 1964–68, V, doc. [409](https://history.state.gov/historicaldocuments/frus1964-68v05/d409). See [[cal.1967-11-13.vietnam]]. Names: Westmoreland, Bunker, Johnson.'
    tags: [name:westmoreland-william, name:bunker-ellsworth, name:johnson-lyndon-b]
  - id: cal.1967-11-22.middle-east
    when: Nov. 22
    date: '1967-11-22'
    thread: middle-east-six-day-war-aftermath
    also: [soviet-union]
    c: 'Kosygin to Johnson, Nov. 19: the American representatives to act on the withdrawal of Israeli troops. Johnson, the same day: support the British draft, which both sides could find tolerable. Nov. 22, the Security Council adopts the British draft unanimously, Resolution 242: "the inadmissibility of the acquisition of territory by war"; withdrawal of Israeli forces "from territories occupied in the recent conflict"; an end to belligerency, every State''s right to live "within secure and recognized boundaries"; freedom of navigation; a just settlement of the refugee problem; a Special Representative. Nov. 23, U Thant names Jarring.'
    n: 'Security Council Resolution [242 (1967)](https://undocs.org/S/RES/242(1967)). FRUS 1964–68, XIX, docs. [534](https://history.state.gov/historicaldocuments/frus1964-68v19/d534), [535](https://history.state.gov/historicaldocuments/frus1964-68v19/d535), [541](https://history.state.gov/historicaldocuments/frus1964-68v19/d541), [542](https://history.state.gov/historicaldocuments/frus1964-68v19/d542). [[w.quandt-peace-process]]; [[w.spiegel-other-arab-israeli-conflict]]. See [[cal.1967-06-05.middle-east]]. Names: Kosygin, U Thant, Jarring, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b, name:u-thant, name:jarring-gunnar-v, name:goldberg-arthur-j]
  - id: cal.1967-11-22.welfare
    when: Nov. 22
    date: '1967-11-22'
    thread: welfare
    also: [health]
    c: 'Social Security Amendments. The Senate passes its bill, [78–6](https://voteview.com/rollcall/RS0900275). Johnson: benefits up more than 20 percent on average, the minimum from $44 to $70.'
    n: 'Statement by the President Following Senate Approval of the Bill To Increase Social Security Benefits, [1967 Pub. Papers 1070](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=462) (Nov. 22, 1967). [[w.steiner-state-of-welfare]]. See [[cal.1967-08-17.welfare]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-22.europe-and-the-alliance-cyprus
    when: Nov. 22
    date: '1967-11-22'
    thread: cyprus
    c: 'Cyprus. Vance sent as Johnson''s emissary: Ankara, Athens, Nicosia. Brosio and Rolz-Bennett for NATO and the UN.'
    n: 'FRUS 1964–68, XVI, doc. [318](https://history.state.gov/historicaldocuments/frus1964-68v16/d318) (Nov. 23). See [[cal.1967-11-15.europe-and-the-alliance]]. Names: Vance, Brosio, Rolz-Bennett, Johnson.'
    tags: [name:vance-cyrus, name:brosio-manlio-g, name:rolz-bennett-jose, name:johnson-lyndon-b]
  - id: cal.1967-11-22.opinion
    when: Nov. 22
    date: '1967-11-22'
    thread: opinion
    also: [congress, amendments, electoral-college]
    c: 'Gallup, Oct. 6–11: a constitutional amendment to abolish the Electoral College and elect the President by the national vote: approve 65 percent, disapprove 22. College-educated 70 and 24; grade school 54 and 19.'
    n: '[[w.gallup-poll]], III, 2091.'
  - id: cal.1967-11-22.vietnam-order-of-battle
    when: Nov. 22
    date: '1967-11-22'
    thread: vietnam-order-of-battle
    c: Westmoreland's press briefing gives the estimate's figures; the enemy's ability to carry on the war has declined.
    n: 'A note to FRUS 1964–68, V, doc. [397](https://history.state.gov/historicaldocuments/frus1964-68v05/d397). Check the briefing''s place and transcript. See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Westmoreland.'
    tags: [name:westmoreland-william]
  - id: cal.1967-11-23.vietnam-operations
    when: Nov. 23
    date: '1967-11-23'
    thread: vietnam-operations
    c: 'Thanksgiving Day. The 2d and 4th Battalions, 503d Infantry, and the 1st Battalion, 12th Infantry, take the top of Hill 875 about 11:30 a.m.: 298 North Vietnamese dead found. The 2d Battalion''s dead Nov. 19–23, 95; the 4th''s, 18. The battles around Đắk Tô, by the Army''s count: 283 Americans killed, 1,188 wounded; 61 South Vietnamese killed.'
    n: '[[w.villard-united-states-army-in]], 176–179. See [[cal.1967-11-03.vietnam]].'
    tags: [place:hill-875, place:dak-to]
  - id: cal.1967-11-24.vietnam-order-of-battle
    when: Nov. 24
    date: '1967-11-24'
    thread: vietnam-order-of-battle
    c: MACV's briefing on the enemy order of battle. The self-defense forces "not a fighting force comparable to the guerrillas"; the political cadre "has no military function." The old count's 100,000–120,000 irregulars had been one-third guerrillas, two-thirds self-defense.
    n: 'MACV briefing on Enemy Order of Battle, Nov. 24, 1967, quoted in [Thayer, vol. 2, p. 8, table 1, notes d, e](https://archive.org/details/DTIC_ADA051609/page/n18); [[w.thayer-systems-analysis-view]], II, 8. Check whether a press briefing, and where. Made public: the Thayer volumes, declassified May 9, 1977 (DTIC''s cover). See [[cal.1967-09-09.vietnam-order-of-battle]].'
  - id: cal.1967-11-26.economy
    when: Nov. 26
    date: '1967-11-26'
    thread: economy
    c: 'Gold pool losses. Frankfurt: the gold pool''s central banks to keep the price at $35.'
    n: FRUS 1964–68, VIII, doc. [156](https://history.state.gov/historicaldocuments/frus1964-68v08/d156). See [[cal.1967-11-18.economy]].
  - id: cal.1967-11-27.european-community
    when: Nov. 27
    date: '1967-11-27'
    thread: european-community
    also: [europe-and-the-alliance]
    c: 'De Gaulle''s press conference: Britain, after the devaluation, not ready to enter the Common Market; its entry would break the Community.'
    n: '[[w.parr-britains-policy-towards-the]]; [[w.schwartz-lyndon-johnson-and-europe]]. Check: the press conference''s text. Names: de Gaulle.'
    tags: [name:de-gaulle-charles]
  - id: cal.1967-11-27.trade
    when: Nov. 27
    date: '1967-11-27'
    thread: trade
    c: 'The Kennedy Round. Johnson sends Congress the agreement signed at Geneva June 30, as the Trade Expansion Act requires: concessions on $7½ to $8 billion of American exports, cuts on about as much of its imports.'
    n: 'Special Message to the Congress Transmitting Multilateral Trade Agreement Concluding the Kennedy Round of Trade Negotiations, [1967 Pub. Papers 1072](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=464) (Nov. 27, 1967). [[w.preeg-traders-and-diplomats]]; [[w.zeiler-american-trade-and-power]]. See [[cal.1964-05-04.trade]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-21.vietnam
    when: Nov. 28–29
    date: '1967-11-28'
    thread: vietnam-packers
    c: 'Packers. Harriman in Bucharest on the Romanian channel, with Maurer, back from Hanoi in October. On the same trip, from Nov. 21: the Shah of Iran, Nov. 24; Tito; Ayub (Check the days).'
    n: 'FRUS 1964–68, V, doc. [411](https://history.state.gov/historicaldocuments/frus1964-68v05/d411). [[w.herring-secret-diplomacy-of-the]]. Names: Harriman, Maurer, Pahlavi, Tito, Ayub.'
    tags: [name:harriman-w-averell, name:maurer-ion-gheorghe, name:tito-josip-broz, name:ayub-khan-mohammad, name:pahlavi-mohammed-reza]
  - id: cal.1967-11-29.defense
    when: Nov. 29
    date: '1967-11-29'
    thread: defense-clifford
    also: [foreign-aid]
    c: 'McNamara to be president of the World Bank, Woods''s successor, Woods and Fowler recommending him. Johnson''s statement: he will stay at Defense until the President and he agree on a time.'
    n: 'Statement by the President on the Nomination of Secretary McNamara as President of the International Bank for Reconstruction and Development, [1967 Pub. Papers 1077](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=469) (Nov. 29, 1967). [[w.shapley-promise-and-power]]; [[w.mcnamara-in-retrospect]], 311–314; [[w.dallek-flawed-giant]]. See [[cal.1967-11-01.vietnam]]. Names: McNamara, Woods, Fowler, Johnson.'
    tags: [name:mcnamara-robert-s, name:woods-george-d, name:fowler-henry-h, name:johnson-lyndon-b]
  - id: cal.1967-11-29.economy
    when: Nov. 29
    date: '1967-11-29'
    thread: economy-surcharge
    also: [congress]
    c: 'The surcharge after the devaluation. Ways and Means hears Fowler and Martin again (Check the dates); Mills and Byrnes: no tax increase without cuts in spending.'
    n: 'The President''s News Conference, [1967 Pub. Papers 1088](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=480) (Dec. 4, 1967). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]. See [[cal.1967-01-10.economy]]. Names: Fowler, Martin, Mills, Byrnes.'
    tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr, name:mills-wilbur-d, name:byrnes-john-w, name:johnson-lyndon-b]
  - id: cal.1967-11-29.europe-and-the-alliance-cyprus
    when: Nov. 29
    date: '1967-11-29'
    thread: cyprus
    c: 'Cyprus. The NSC: Rusk, Vance "has warded off war between Turkey and Greece"; Greece and Turkey accept a statement, Makarios to be persuaded.'
    n: 'FRUS 1964–68, XVI, doc. [332](https://history.state.gov/historicaldocuments/frus1964-68v16/d332). See [[cal.1967-11-15.europe-and-the-alliance]]. Names: Rusk, Vance, Makarios.'
    tags: [name:rusk-dean, name:vance-cyrus, name:makarios-iii]
