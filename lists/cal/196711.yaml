  - id: cal.1967-11-01.vietnam
    when: Nov. 1
    date: '1967-11-01'
    thread: vietnam
    c: 'McNamara''s "draft" memorandum to Johnson, a fifteen-month program, shown neither to Rusk, Rostow nor Wheeler: the present course will not bring success by the end of 1968 "in the eyes of the American public." He recommends: announce a stabilization, no more American forces and no wider operations against the North; plan a halt in the bombing; operations in the South reviewed to cut American casualties and give the South Vietnamese more of the war.'
    n: 'FRUS 1964–68, V, doc. [375](https://history.state.gov/historicaldocuments/frus1964-68v05/d375). [[w.mcnamara-in-retrospect]], 311–314; [[w.gibbons-u-s-government-and]], IV, 880–83; [[w.drea-mcnamara-clifford-and-the-2011]], 219, 221 (the memorandum, seen first by Johnson alone; the bombing halt); [[w.johnson-vantage-point]], 372–73 (the lunch of Oct. 31; the memorandum received Nov. 1); [[w.dallek-flawed-giant]], 494–95; [[w.herring-lbj-and-vietnam]], 58–59 (the lunch of Oct. 31; the memorandum not cleared with Rostow, Rusk or Wheeler; a halt, a ceiling, fewer American casualties; Johnson''s notes on it, "Why believe this?"); [[w.mcnamara-in-retrospect]], ch. 10 at n.42 ("continuing on our present course will not bring us by the end of 1968 enough closer to success"). [[w.barrett-uncertain-warriors]], 100 (McNamara''s "stabilize"; Fortas''s answer); [[w.berman-lyndon-johnsons-war]], 93–95 ("personal views" that "may be incompatible with your own"; no more forces, no reserves, no wider air war; "No other course affords any hope of these results in the next 15 months"); [[w.shesol-mutual-contempt]], 392 ("Continuation of our present course of action in Southeast Asia would be dangerous, costly in lives, and unsatisfactory to the American people"). Made public: FRUS 1964–68, V (2002). [[w.clifford-counsel-to-the-president-2]], 457–58 (the memorandum, nine pages, hand-delivered to the President past Rusk and Rostow, by Clifford''s account). To check: [[w.shapley-promise-and-power]]; Johnson''s notes on McNamara''s memorandum, NSF Country File, Vietnam, box 75, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 59 n.130). Names: McNamara, Rusk, Rostow, Wheeler, Johnson.'
