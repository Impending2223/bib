  - id: cal.1967-11-04.governors-la
    when: Nov. 4
    date: '1967-11-04'
    thread: governors
    also: [elections-1967, state-legislatures]
    c: 'Louisiana''s Democratic primary. McKeithen, the first governor the constitution lets succeed himself (the amendment of 1966), renominated over U.S. Representative Rarick, 836,304 to 179,846, 80.6 percent; three others. No Republican files; the general election, Feb. 6, 1968, uncontested. Morial, a New Orleans lawyer, wins a House seat from Uptown in the primaries of 1967, the first Negro in the legislature since Reconstruction (Check: the round).'
    n: 'Votes: [Wikipedia, "1968 Louisiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Louisiana_gubernatorial_election), from the Secretary of State''s *Primary Election Returns*, 1967; [Wikipedia, "Dutch Morial"](https://en.wikipedia.org/wiki/Dutch_Morial). The bar before: La. Const. of 1921, art. V, § 3, [*Constitution of the State of Louisiana* (1921), 17–18](https://archive.org/details/cu31924030492163). Check: the Secretary of State''s returns. To check: [[w.peirce-deep-south-states-of]]; [[w.fairclough-race-and-democracy]]. See [[cal.1966-11-08.state-constitutions-la]]. Names: McKeithen, Rarick, Morial.'
    tags: [state:la, city:new-orleans, name:mckeithen-john-j, name:rarick-john-r, name:morial-ernest-n]
  - id: cal.1967-11-04.vietnam
    when: Nov. 4
    date: '1967-11-04'
    thread: vietnam
    c: 'Luncheon, 2:20 p.m.: Johnson with Rusk, McNamara, Rostow, Helms, Christian and Jim Jones. "We''ve been on dead center for the last year." Of the opposition: "I''m not going to let the Communists take this government and they''re doing it right now"; Helms: under the laws "you cannot prosecute anybody for anything." Rusk, Wheeler, Helms and McNamara to make a pamphlet of three pages answering the questions on Vietnam.'
    n: 'Jones''s notes, [FRUS 1964–68, V, doc. 386](https://history.state.gov/historicaldocuments/frus1964-68v05/d386). [[w.dallek-flawed-giant]], 497 (the lunch; "dead center"). Made public: FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 869, 891 (the lunch, "dead center," the opposition, Helms). Check: Gibbons, 869, has the meeting at 2:30 p.m. Dallek calls it a Tuesday lunch (497); Jones''s notes give Saturday, Nov. 4. See [[cal.1967-11-02.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian, James R. Jones, Wheeler.'
