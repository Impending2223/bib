  - id: cal.1967-11-29.opinion
    when: Nov. 29
    date: '1967-11-29'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Oct. 27–Nov. 2, in the East: Johnson 52 percent, Reagan 42; Johnson 49, Romney 44; Rockefeller 52, Johnson 42. Oct. 6–11, the East: Johnson 48, Nixon 45.'
    n: '[[w.gallup-poll]], III, 2092. Names: Johnson, Reagan, Nixon, Romney, Rockefeller.'
