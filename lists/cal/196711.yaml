    c: 'Westmoreland at the National Press Club: "We have reached an important point when the end begins to come into view"; a phasing down of the American effort conceivable "within two years or less" (Check the words). The same morning, the President with Bunker, Westmoreland and his advisers: more allied troops, and the troops approved, as fast as possible. "I am beginning to agree with Bob McNamara that it does not appear the targets are worth the loss in planes."'
