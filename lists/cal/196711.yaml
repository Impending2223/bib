    c: 'Kosygin to Johnson, Nov. 19: the American representatives to act on the withdrawal of Israeli troops. Johnson, the same day: support the British draft, which both sides could find tolerable. Nov. 22, the Security Council adopts the British draft unanimously, Resolution 242: "the inadmissibility of the acquisition of territory by war"; withdrawal of Israeli forces "from territories occupied in the recent conflict"; an end to belligerency, every State''s right to live "within secure and recognized boundaries"; freedom of navigation; a just settlement of the refugee problem; a Special Representative. Nov. 23, U Thant names Jarring.'
    n: 'Security Council Resolution [242 (1967)](https://undocs.org/S/RES/242(1967)). FRUS 1964–68, XIX, docs. [534](https://history.state.gov/historicaldocuments/frus1964-68v19/d534), [535](https://history.state.gov/historicaldocuments/frus1964-68v19/d535), [541](https://history.state.gov/historicaldocuments/frus1964-68v19/d541), [542](https://history.state.gov/historicaldocuments/frus1964-68v19/d542). [[w.drea-mcnamara-clifford-and-the-2011]], 450 (the resolution, the British draft, withdrawal). To check: [[w.quandt-peace-process]]; [[w.spiegel-other-arab-israeli-conflict]]. See [[cal.1967-06-05.middle-east]]. Names: Kosygin, U Thant, Jarring, Johnson.'
