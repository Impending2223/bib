    also: [robert-kennedy]
    c: 'Walinsky to Robert Kennedy, "Gratuitous Advice Revisited": "a deep personal dislike of Lyndon Johnson"; "Our time, our America, is being shaped by an ignorant bully"; "to support Johnson''s reelection will be a national tragedy and a personal disaster." Kennedy to raise his conflict with Johnson toward a challenge. Against Dutton''s warning of a split: "I am not old enough to care whether the Democratic Party is split or survives."'
