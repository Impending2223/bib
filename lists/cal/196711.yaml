  - id: cal.1967-11-01.vietnam-commitments
    when: Nov. 1
    date: '1967-11-01'
    thread: vietnam-commitments
    c: 'The Foreign Relations Committee in executive session on the staff''s revisions of S. Res. 151. Fulbright: report it now, debate it in 1968, "an educational gesture." Lausche: say the Tonkin Gulf resolution gave the President his authority. Aiken: on the floor it will be "are you for the boys ... or are you for Hanoi," defeated four to one; the President has "grossly abused" his power.'
    n: 'Daily Digest, [113 Cong. Rec. D560](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=558) (the committee "in executive session, continued consideration of, but took no final action on, S. Res. 151"). [[w.gibbons-u-s-government-and]], IV, 820. To check: the committee''s executive session transcript, Nov. 1, 1967 (cited by [[w.gibbons-u-s-government-and]], IV, 820 n.72). See [[cal.1967-08-17.vietnam-commitments]]. Names: Fulbright, Lausche, Aiken.'
