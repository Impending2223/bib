  - id: cal.1967-11-03.cities-and-housing
    when: Nov. 3
    date: '1967-11-03'
    thread: cities-and-housing
    c: 'Independent Offices and HUD Appropriation Act signed: more than $600 million under the January budget, $500 million of it from HUD. Model cities cut $350 million; rent supplements from $40 million to $10 million; the neighborhood centers out; mass transit down $55 million. Johnson: of the House Republicans, 93 percent voted to recommit and kill the rent supplements, 80 percent to recommit and delete the model cities funds.'
    n: 'Statement by the President Upon Signing the Independent Offices and Department of Housing and Urban Development Appropriation Act, 1968, [1967 Pub. Papers 989](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=381) (Nov. 3, 1967). To check: [[w.haar-between-the-idea-and]]; [[w.zelizer-fierce-urgency-of-now]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-11-03.vietnam-2
    when: Nov. 3
    date: '1967-11-03'
    thread: vietnam
    c: 'Taylor, asked by Rostow, on a course put to him without its author''s name (McNamara''s): forces held at the levels approved, the bombing of the North stopped. "One form of the Pull-back Alternative"; it "would probably degenerate into an eventual pull-out." He recommends strongly against.'
    n: '[FRUS 1964–68, V, doc. 381](https://history.state.gov/historicaldocuments/frus1964-68v05/d381). [[w.johnson-vantage-point]], 374. Made public: in part, [[w.johnson-vantage-point]], 374; FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 884, 886–87 (the request, the course, the "Pull-back Alternative," the recommendation). See [[cal.1967-11-01.vietnam]]. Names: Taylor, Rostow, McNamara.'
