  - id: cal.1967-11-30.elections-1968
    when: Nov. 30
    date: '1967-11-30'
    thread: elections-1968
    also: [vietnam]
    c: 'Washington. McCarthy announces he will enter Democratic primaries against Johnson: Wisconsin, Oregon, California and Nebraska; Massachusetts and New Hampshire undecided (Check the States). "The Administration seems to have set no limit to the price which it is willing to pay for a military victory"; the challenge may "alleviate at least in some degree this sense of political helplessness." Dec. 2, Chicago, the Conference of Concerned Democrats: his first speech as a candidate; Lowenstein before him.'
    n: '[[w.mccarthy-year-of-the-people]]; [[w.eisele-almost-to-the-presidency]]; [[w.herzog-mccarthy-for-president]]; [[w.larner-nobody-knows]]; [[w.sandbrook-eugene-mccarthy]]; [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]. Names: McCarthy, Lowenstein, Johnson.'
    tags: [name:mccarthy-eugene-j, name:lowenstein-allard, name:johnson-lyndon-b]
  - id: cal.1967-11-30.vietnam
    when: Nov. 30
    date: '1967-11-30'
    thread: vietnam
    also: [congress]
    c: 'The Senate adopts Mansfield''s resolution, S. Res. 180, [82–0](https://voteview.com/rollcall/RS0900290): the sense of the Senate that the President take the American resolution of Jan. 31, 1966, to the Security Council again. Rusk and Goldberg to Johnson: move before Jan. 1, when the Council''s membership changes.'
    n: 'FRUS 1964–68, V, doc. [421](https://history.state.gov/historicaldocuments/frus1964-68v05/d421). [[w.gibbons-u-s-government-and]], IV; [[w.oberdorfer-senator-mansfield-2003]]. See [[cal.1966-01-31.vietnam]]; [[cal.1967-10-25.vietnam]]. Names: Mansfield, Rusk, Goldberg, Johnson.'
    tags: [name:mansfield-mike, name:rusk-dean, name:goldberg-arthur-j, name:johnson-lyndon-b]
  - id: cal.1967-11.mayors-baltimore
    when: Nov.
    date: 1967-11
    thread: mayors
    also: [elections-1967]
    c: 'Baltimore. Thomas D''Alesandro III, president of the City Council, son of the mayor of 1947–59, elected mayor over Arthur W. Sherwood (R), 138,938 to 28,528, 83.0 percent, carrying every precinct. McKeldin (R) not running. Democratic primary: D''Alesandro 91,965, 75.0; Angelos, once a councilman, 30,641. Sworn Dec. 5.'
    n: 'Votes: [Wikipedia, "1967 Baltimore mayoral election"](https://en.wikipedia.org/wiki/1967_Baltimore_mayoral_election), from Our Campaigns. Check: the dates of the primary and the election (Wikipedia gives Nov. 2), and the Board of Supervisors of Elections'' returns. [[w.durr-behind-the-backlash]]. Names: D''Alesandro, Angelos, McKeldin.'
    tags: [state:md, city:baltimore, name:dalesandro-thomas-iii, name:angelos-peter-g, name:mckeldin-theodore-r]
