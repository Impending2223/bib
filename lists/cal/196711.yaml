  - id: cal.1967-11-01.opinion
    when: Nov. 1
    date: '1967-11-01'
    thread: opinion
    also: [vietnam]
    c: 'Gallup and its affiliates in ten nations: the United States should begin to withdraw its troops, carry on at its present level of fighting, or increase its attacks on North Vietnam. Brazil 76, 5, 5 percent. Canada 41, 16, 23. England 45, 15, 15. Finland 81, 4, 5. France 72, 8, 5. Sweden 79, 10, 4. India 66, 4, 8. West Germany 58, 11, 14. Argentina 57, 6, 6. Australia 29, 18, 37.'
    n: '[[w.gallup-poll]], III, 2089.'
  - id: cal.1967-11-02.vietnam
    when: Nov. 1–2
    date: '1967-11-01'
    thread: vietnam
    c: 'The senior advisers at State and the White House: Acheson, Ball, McGeorge Bundy, Clifford, Dillon, Fortas, Lodge, Murphy, Taylor, Bradley among them. Johnson''s five questions, Nov. 2. No one for getting out; Acheson and Bundy: no negotiations to be expected, the bombing to be played down; Ball for shifting it to the DMZ.'
    n: 'FRUS 1964–68, V, doc. [377](https://history.state.gov/historicaldocuments/frus1964-68v05/d377); McGeorge Bundy''s summary, Nov. 10, doc. [393](https://history.state.gov/historicaldocuments/frus1964-68v05/d393) (no one for getting out; no negotiations to be expected). [[w.drea-mcnamara-clifford-and-the-2011]], 221–222 (the briefing of Nov. 1; the meeting of Nov. 2, the bombing to be moderated, not ended); [[w.dallek-flawed-giant]], 494, 496 (the advisers; firmness); [[w.herring-lbj-and-vietnam]], 59 (the Wise Men, briefed by Wheeler and Carver; Bundy''s summary, a "strong and unanimous negative" on getting out; Ball''s restriction of the bombing to the DMZ). Made public: FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 875–77. To check: [[w.isaacson-wise-men]]; [[w.schandler-unmaking-of-a-president]]; Rostow to Johnson, Nov. 2, 1967, NSF: Rostow Files, LBJ Library; Dillon''s oral history, June 29, 1969, LBJ Library (cited by [[w.dallek-flawed-giant]], 496). See [[cal.1967-11-01.vietnam]]. Names: Acheson, Ball, Bundy, Clifford, Dillon, Fortas, Lodge, Murphy, Taylor, Bradley, Johnson. Check: Dallek, 496, has Ball dissenting, by his own account (Ball, *Past Has Another Pattern*, 407).'
