    when: Nov. 29
    date: '1967-11-29'
    thread: vietnam-buttercup
    c: 'Buttercup. Rusk to Bunker: the channel to the NLF not to "shrivel up" for the South Vietnamese''s reluctance.'
    n: 'FRUS 1964–68, V, doc. [420](https://history.state.gov/historicaldocuments/frus1964-68v05/d420). [[w.herring-secret-diplomacy-of-the]]; [[w.brigham-guerrilla-diplomacy]]. Made public: FRUS 1964–68, V (2002). Names: Rusk, Bunker.'
