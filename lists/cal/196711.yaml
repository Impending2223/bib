  - id: cal.1967-11-02.mayors-memphis
    when: Nov. 2
    date: '1967-11-02'
    thread: mayors
    also: [elections-1967]
    c: 'Memphis, under the charter of 1966: Loeb, mayor 1960–63, elected mayor over Mayor Ingram in the runoff, Ingram with most of the Negro vote. First round, Oct. 5, seven candidates; State Representative A. W. Willis Jr., the first Negro to run, fourth. Three Negroes elected to the council of thirteen (Check).'
    n: '[Wikipedia, "Henry Loeb"](https://en.wikipedia.org/wiki/Henry_Loeb); NAACP, [*Analysis of Run-Off Election, November 2, 1967*](https://radar.auctr.edu/islandora/object/auc.076%3A1958). Check: the Shelby County Election Commission''s returns, and the date of the first round. To check: [[w.honey-going-down-jericho-road]]. See [[cal.1966-11-08.states-and-cities-memphis]]. Names: Loeb, Ingram, Willis.'
    tags: [state:tn, city:memphis, name:loeb-henry, name:ingram-william-b, name:willis-a-w-jr]
    short: Loeb at Memphis
