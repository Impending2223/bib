  - id: cal.1967-11-02.vietnam-congress
    when: Nov. 2
    date: '1967-11-02'
    thread: vietnam-congress
    c: 'Goldberg before Foreign Relations, in executive session, then in public: seven and possibly eight of the nine votes in the Security Council; Johnson''s question whether failure would be "a defeat for the United States," Goldberg against it; Mansfield''s resolution would help him. Fulbright: "If you don''t get but one vote I would prefer that to no vote."'
    n: 'Daily Digest, [113 Cong. Rec. D565](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=563) (the hearings on S. Con. Res. 44 and S. Res. 180, "with testimony from Arthur J. Goldberg," Sisco with him). [[w.gibbons-u-s-government-and]], IV, 920–21. To check: Senate Committee on Foreign Relations, *Submission of the Vietnam Conflict to the United Nations*, Hearings (1967), 149 ff. (cited by [[w.gibbons-u-s-government-and]], IV, 920 n.51); the committee''s executive session transcript, Nov. 2, 1967 (cited by [[w.gibbons-u-s-government-and]], IV, 920 n.50). See [[cal.1967-10-26.vietnam-congress]]. Names: Goldberg, Johnson, Mansfield, Fulbright.'
