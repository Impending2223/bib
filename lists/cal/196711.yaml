  - id: cal.1967-11-01.vietnam
    when: Nov. 1
    date: '1967-11-01'
    thread: vietnam
    c: 'McNamara''s "draft" memorandum to Johnson, a fifteen-month program, shown neither to Rusk, Rostow nor Wheeler: the present course will not bring success by the end of 1968 "in the eyes of the American public." He recommends: announce a stabilization, no more American forces and no wider operations against the North; plan a halt in the bombing; operations in the South reviewed to cut American casualties and give the South Vietnamese more of the war.'
    n: 'FRUS 1964–68, V, doc. [375](https://history.state.gov/historicaldocuments/frus1964-68v05/d375). [[w.mcnamara-in-retrospect]], 311–314; [[w.gibbons-u-s-government-and]], IV, 880–83; [[w.drea-mcnamara-clifford-and-the-2011]], 219, 221 (the memorandum, seen first by Johnson alone; the bombing halt); [[w.johnson-vantage-point]], 372–73 (the lunch of Oct. 31; the memorandum received Nov. 1); [[w.dallek-flawed-giant]], 494–95; [[w.herring-lbj-and-vietnam]], 58–59 (the lunch of Oct. 31; the memorandum not cleared with Rostow, Rusk or Wheeler; a halt, a ceiling, fewer American casualties; Johnson''s notes on it, "Why believe this?"). [[w.barrett-uncertain-warriors]], 100 (McNamara''s "stabilize"; Fortas''s answer). Made public: FRUS 1964–68, V (2002). To check: [[w.shapley-promise-and-power]]; [[w.berman-lyndon-johnsons-war]]; Johnson''s notes on McNamara''s memorandum, NSF Country File, Vietnam, box 75, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 59 n.130). Names: McNamara, Rusk, Rostow, Wheeler, Johnson.'
