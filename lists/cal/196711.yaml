  - id: cal.1967-11.robert-kennedy-campaign-2
    when: Nov., late 1967
    date: 1967-11
    thread: robert-kennedy-campaign
    also: [robert-kennedy]
    c: 'At dinner with Ethel Kennedy and the Benno Schmidts, Robert Kennedy: "if I run, I will go a long way toward proving everything that everybody who doesn''t like me has said about me ... that I''ve never accepted Lyndon Johnson as president, that I''m a selfish, ambitious, little s.o.b." Six Senate seats may be lost if he runs: "I can''t do that."'
    n: '[[w.shesol-mutual-contempt]], 403–4; [[w.thomas-robert-kennedy]], 352 (at dinner with Ethel Kennedy and friends in New York: "a selfish, ambitious little SOB"; Ethel: "People do like you"). Check: the day. Check: Thomas puts the dinner in January 1968 (352). To check: [[w.schlesinger-robert-kennedy-and-his]], 900 (cited by [[w.shesol-mutual-contempt]], 404). Names: Robert Kennedy, Johnson.'
    src:
      c: 3dc8986e
      rows:
        - 'w.shesol-mutual-contempt 403–4: all'
        - 'w.thomas-robert-kennedy 352: A'
