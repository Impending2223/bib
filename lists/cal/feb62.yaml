# Cal. XVI February 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVI
entries:
  - id: cal.1962-02.civil-rights-organizations
    when: Feb.
    date: '1962-02'
    thread: civil-rights-organizations
    also: [mississippi]
    c: 'Clarksdale, Mississippi. SNCC and CORE workers and the State NAACP''s leaders revive the Council of Federated Organizations, COFO, to coordinate the voter registration work in the State. Henry president; Moses voter registration director.'
    n: 'SNCC Digital Gateway, [Council of Federated Organizations (COFO) reorganized](https://snccdigital.org/events/cofo-reorganized/) (K–J Cong. II.L). Dittmer, *Local People*; Payne, *I''ve Got the Light of Freedom*; Carson, *In Struggle* (K–J Cong. II.F). Burner, *And Gently He Shall Lead Them* (K–J Cong. II.I.4). Wesley C. Hogan, *Many Minds, One Heart: SNCC''s Dream for a New America* (University of North Carolina Press, 2007). See [[cal.1961-08.mississippi]]. Names: Moses (K–J Cong. III.H); Henry (K–J Cong. III.K).'
    tags: [name:henry-aaron, name:moses-robert-p]
  - id: cal.1962-02-03.cuba
    when: Feb. 3
    date: '1962-02-03'
    thread: cuba
    c: Embargo on trade with Cuba proclaimed, in force Feb. 7. Food and medicine excepted.
    n: '[Proclamation No. 3447](https://www.presidency.ucsb.edu/documents/proclamation-3447-embargo-all-trade-with-cuba), [27 Fed. Reg. 1085](https://www.govinfo.gov/app/details/FR-1962-02-07) (1962). See [[cal.1961-04-15.cuba]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-02-06.school-aid
    when: Feb. 6
    date: '1962-02-06'
    thread: school-aid
    c: Education message. College aid first; the school bill again.
    n: '[Special Message to the Congress on Education](https://www.presidency.ucsb.edu/documents/special-message-the-congress-education-0) (Feb. 6, 1962). See [[cal.1961-02-20.school-aid]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-02-08.vietnam
    when: Feb. 8
    date: '1962-02-08'
    thread: vietnam
    c: MACV established. Harkins commands.
    n: '[FRUS 1961–63, II, doc. 53](https://history.state.gov/historicaldocuments/frus1961-63v02/d53). Cosmas, *MACV* (Viet. II.I.3). See [[cal.1961-01-28.vietnam]]. Names: Harkins (Viet. III.D).'
    tags: [name:harkins-paul-d]
  - id: cal.1962-02-10.berlin-and-vienna
    when: Feb. 10
    date: '1962-02-10'
    thread: berlin-and-vienna
    c: Powers exchanged for Abel on the Glienicke Bridge; Pryor freed at Checkpoint Charlie. Donovan negotiated.
    n: '[FRUS 1961–63, V, doc. 153](https://history.state.gov/historicaldocuments/frus1961-63v05/d153). James B. Donovan, *Strangers on a Bridge: The Case of Colonel Abel* (1964). See [[cal.1961-06-03.berlin-and-vienna]].'
    tags: [name:powers-francis-gary, name:abel-rudolf, name:pryor-frederic-l, name:donovan-james-b]
  - id: cal.1962-02-13.specials
    when: Feb. 13
    date: '1962-02-13'
    thread: specials
    c: Michigan 14th, special. Harold Ryan (D) holds Rabaut's seat, 50.5 to 49.2 over Waldron (R). Swing 12.1 to R.
    n: '[108 Cong. Rec., House, Feb. 21, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt2/pdf/GPO-CRECB-1962-pt2-10-1.pdf) (Ryan sworn). Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1962-02-13-h-MI-14, name:ryan-harold-m, name:rabaut-louis-c, name:waldron-robert-e]
  - id: cal.1962-02-14.press-and-broadcasting
    when: Feb. 14
    date: '1962-02-14'
    thread: press-and-broadcasting
    c: Jacqueline Kennedy's tour of the White House, CBS and NBC. About fifty million viewers.
    n: 'Recording (K–J Adm. II.I). See [[cal.1961-01-25.press-and-broadcasting]]. Names: Jacqueline Kennedy (K–J Adm. III.A).'
    tags: [name:kennedy-jacqueline]
  - id: cal.1962-02-14.vietnam
    when: Feb. 14
    date: '1962-02-14'
    thread: vietnam
    c: Press conference. The advisers fire if fired on; not combat troops "in the generally understood sense of the word."
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-175) (Feb. 14, 1962). See [[cal.1961-01-28.vietnam]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-02-16.opinion
    when: Feb. 16
    date: '1962-02-16'
    thread: opinion
    also: [right-and-the-military]
    c: 'Gallup, Jan. 11–16: 53 percent have heard of the John Birch Society. Of them, 8 favorable, 43 unfavorable, 49 no opinion.'
    n: '*The Gallup Poll*, III, 1756 (K–J Cong. II.E).'
  - id: cal.1962-02-16.students
    when: Feb. 16–17
    date: '1962-02-16'
    thread: students
    also: [testing]
    c: Students picket the White House in snow for an end to nuclear testing and for disarmament, some thousands, the Student Peace Union, Student SANE, and SDS among the sponsors; then Congress, the Soviet Embassy. Kennedy sends out a pot of coffee. Their leaders see Wiesner, Sorensen, and Bundy.
    n: '"Youthful Peace Pickets Seek End to Test of Nuclear Arms" (AP), [*News-Review* (Roseburg, Ore.), Feb. 17, 1962, 2](https://oregonnews.uoregon.edu/lccn/2003260229/1962-02-17/ed-1/seq-2/). Gitlin, *The Sixties*; Miller, *"Democracy Is in the Streets"* (K–J Cong. II.F). Names: Wiesner, Sorensen (K–J Adm. III.B); Bundy (K–J Adm. III.E). Check: the count, some 5,000 by later accounts.'
    tags: [name:kennedy-john-f, name:wiesner-jerome-b, name:sorensen-theodore-c, name:bundy-mcgeorge]
  - id: cal.1962-02-18.vietnam
    when: Feb. 18
    date: '1962-02-18'
    thread: vietnam
    c: 'Robert Kennedy in Saigon: the United States stays until it wins.'
    n: '[FRUS 1961–63, II, doc. 108](https://history.state.gov/historicaldocuments/frus1961-63v02/d108). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1961-01-28.vietnam]]. Names: Robert F. Kennedy (K–J Adm. III.A).'
    tags: [name:kennedy-robert-f]
  - id: cal.1962-02-20.space
    when: Feb. 20
    date: '1962-02-20'
    thread: space
    c: Glenn orbits three times in *Friendship 7*. A heat-shield warning; the shield holds.
    n: '[Remarks Following the Orbital Flight of Col. John H. Glenn, Jr.](https://www.presidency.ucsb.edu/documents/remarks-following-the-orbital-flight-col-john-h-glenn-jr) (Feb. 20, 1962). [Telephone Conversation With Colonel Glenn Aboard the U.S.S. Noa](https://www.presidency.ucsb.edu/documents/telephone-conversation-with-colonel-glenn-aboard-the-uss-noa) (Feb. 20, 1962). Tom Wolfe, *The Right Stuff* (1979). See [[cal.1961-04-12.space]].'
    tags: [name:glenn-john-h-jr]
  - id: cal.1962-02-20.specials
    when: Feb. 20
    date: '1962-02-20'
    thread: specials
    c: New York 6th, special. Benjamin Rosenthal (D) holds Lester Holtzman's seat, 44.5 to 43.8 over Galvin (R). Swing 15.2 to R.
    n: '[108 Cong. Rec., House, Feb. 28, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt3/pdf/GPO-CRECB-1962-pt3-3-1.pdf) (Rosenthal sworn). Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1962-02-20-h-NY-6, name:rosenthal-benjamin-s, name:holtzman-lester, name:galvin-thomas-f]
  - id: cal.1962-02-21.program
    when: Feb. 21
    date: '1962-02-21'
    thread: cities-and-housing
    c: House rejects the Urban Affairs reorganization plan, [264–150](https://voteview.com/rollcall/RH0870123).
    n: See [[cal.1962-01-24.program]].
  - id: cal.1962-02-23.opinion
    when: Feb. 23
    date: '1962-02-23'
    thread: opinion
    also: [right-and-the-military]
    c: 'Gallup, Feb. 8–13: officers'' speeches on foreign policy to be reviewed, 59 percent; officers to say what they wish, 27.'
    n: '*The Gallup Poll*, III, 1756 (K–J Cong. II.E).'
  - id: cal.1962-02-27.vietnam
    when: Feb. 27
    date: '1962-02-27'
    thread: vietnam
    c: Two South Vietnamese pilots bomb Independence Palace. Diệm and the Nhus unhurt.
    n: 'FRUS 1961–63, II, docs. [87](https://history.state.gov/historicaldocuments/frus1961-63v02/d87), [88](https://history.state.gov/historicaldocuments/frus1961-63v02/d88). Miller, *Misalliance* (Viet. II.B.7). See [[cal.1961-01-28.vietnam]]. Names: Ngô Đình Diệm, Ngô Đình Nhu, Trần Lệ Xuân (Viet. III.G).'
    tags: [name:ngo-dinh-diem, name:ngo-dinh-nhu, name:tran-le-xuan]
  - id: cal.1962-02-27.medicare
    when: Feb. 27
    date: '1962-02-27'
    thread: medicare
    c: Health message. Hospital insurance again.
    n: '[Special Message to the Congress on National Health Needs](https://www.presidency.ucsb.edu/documents/special-message-the-congress-national-health-needs) (Feb. 27, 1962). See [[cal.1961-02-09.medicare]].'
    tags: [name:kennedy-john-f]
