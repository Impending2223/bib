# Cal. XVI February 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVI
entries:
  - id: cal.1962-02-03.cuba
    when: Feb. 3
    date: '1962-02-03'
    thread: cuba
    c: Proclamation of an embargo on trade with Cuba, in force Feb. 7. Food and medicine excepted.
    n: Proclamation No. 3447, 27 Fed. Reg. 1085 (1962). Check. See [[cal.1961-04-15.cuba]].
  - id: cal.1962-02-06.school-aid
    when: Feb. 6
    date: '1962-02-06'
    thread: school-aid
    c: Education message. College classrooms and scholarships first this time; the school bill sent again.
    n: Special Message to the Congress on Education (Feb. 6, 1962). Check the date. See [[cal.1961-02-20.school-aid]].
  - id: cal.1962-02-08.vietnam
    when: Feb. 8
    date: '1962-02-08'
    thread: vietnam
    c: Military Assistance Command, Vietnam, established under Paul Harkins.
    n: 'Cosmas, *MACV* (Viet. II.I.3). Names: Harkins (Viet. III.D).'
  - id: cal.1962-02-10.berlin-and-vienna
    when: Feb. 10
    date: '1962-02-10'
    thread: berlin-and-vienna
    c: Francis Gary Powers exchanged for Rudolf Abel on the Glienicke Bridge; Frederic Pryor, an American student, freed at Checkpoint Charlie. James Donovan arranged it.
    n: 'James B. Donovan, *Strangers on a Bridge: The Case of Colonel Abel* (1964).'
  - id: cal.1962-02-14.press-and-broadcasting
    when: Feb. 14
    date: '1962-02-14'
    thread: press-and-broadcasting
    c: Jacqueline Kennedy's tour of the restored White House, on CBS and NBC. Some fifty million watch.
    n: 'Recording (K–J Adm. II.I). Names: Jacqueline Kennedy (K–J Adm. III.A).'
  - id: cal.1962-02-14.vietnam
    when: Feb. 14
    date: '1962-02-14'
    thread: vietnam
    c: Press conference. The advisers will fire if fired upon; they are not combat troops "in the generally understood sense of the word." Check the wording.
    n: News Conference (Feb. 14, 1962).
  - id: cal.1962-02-18.vietnam
    when: Feb. 18
    date: '1962-02-18'
    thread: vietnam
    c: Robert Kennedy, passing through Saigon on his world trip, tells reporters the United States will stay until it wins.
    n: Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Check the date and the words.
  - id: cal.1962-02-20.space
    when: Feb. 20
    date: '1962-02-20'
    thread: space
    c: Glenn orbits three times in *Friendship 7*. A warning light says the heat shield may be loose; it holds.
    n: See [[cal.1961-04-12.space]]. Tom Wolfe, *The Right Stuff* (1979).
  - id: cal.1962-02-21.program
    when: Feb. 21
    date: '1962-02-21'
    thread: program
    c: The House rejects the reorganization plan for an Urban Affairs department, 264–150. Southern Democrats with the Republicans. Check the vote.
    n: See [[cal.1962-01-24.program]].
  - id: cal.1962-02-27.vietnam
    when: Feb. 27
    date: '1962-02-27'
    thread: vietnam
    c: Two South Vietnamese air force pilots bomb Independence Palace. Diem and the Nhus unhurt.
    n: 'Miller, *Misalliance* (Viet. II.B). Names: Ngo Dinh Nhu, Tran Le Xuan (Viet. III.G).'
  - id: cal.1962-02-27.medicare
    when: Feb. 27
    date: '1962-02-27'
    thread: medicare
    c: Health message. Hospital insurance for the aged through Social Security again first. Check the date.
    n: See [[cal.1961-02-09.medicare]].
