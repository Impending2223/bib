# Cal. XVI February 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVI
entries:
  - id: cal.1962-02-03.cuba
    when: Feb. 3
    date: '1962-02-03'
    thread: cuba
    c: Embargo on trade with Cuba proclaimed, in force Feb. 7. Food and medicine excepted.
    n: '[Proclamation No. 3447](https://www.presidency.ucsb.edu/documents/proclamation-3447-embargo-all-trade-with-cuba), [27 Fed. Reg. 1085](https://www.govinfo.gov/app/details/FR-1962-02-07) (1962). See [[cal.1961-04-15.cuba]].'
  - id: cal.1962-02-06.school-aid
    when: Feb. 6
    date: '1962-02-06'
    thread: school-aid
    c: Education message. College aid first; the school bill again.
    n: '[Special Message to the Congress on Education](https://www.presidency.ucsb.edu/documents/special-message-the-congress-education-0) (Feb. 6, 1962). See [[cal.1961-02-20.school-aid]].'
  - id: cal.1962-02-08.vietnam
    when: Feb. 8
    date: '1962-02-08'
    thread: vietnam
    c: MACV established. Harkins commands.
    n: 'Cosmas, *MACV* (Viet. II.I.3). See [[cal.1961-01-28.vietnam]]. Names: Harkins (Viet. III.D).'
  - id: cal.1962-02-10.berlin-and-vienna
    when: Feb. 10
    date: '1962-02-10'
    thread: berlin-and-vienna
    c: Powers exchanged for Abel on the Glienicke Bridge; Pryor freed at Checkpoint Charlie. Donovan negotiated.
    n: 'James B. Donovan, *Strangers on a Bridge: The Case of Colonel Abel* (1964). See [[cal.1961-06-03.berlin-and-vienna]].'
  - id: cal.1962-02-13.specials
    when: Feb. 13
    date: '1962-02-13'
    thread: specials
    c: Michigan 14th, special. Harold Ryan (D) holds Rabaut's seat, 50.5 to 49.2 over Waldron (R).
    n: 'Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1962-02-13-h-MI-14]
  - id: cal.1962-02-14.press-and-broadcasting
    when: Feb. 14
    date: '1962-02-14'
    thread: press-and-broadcasting
    c: Jacqueline Kennedy's tour of the White House, CBS and NBC. About fifty million viewers.
    n: 'Recording (K–J Adm. II.I). See [[cal.1961-01-25.press-and-broadcasting]]. Names: Jacqueline Kennedy (K–J Adm. III.A).'
  - id: cal.1962-02-14.vietnam
    when: Feb. 14
    date: '1962-02-14'
    thread: vietnam
    c: Press conference. The advisers fire if fired on; not combat troops "in the generally understood sense of the word."
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-175) (Feb. 14, 1962). See [[cal.1961-01-28.vietnam]].'
  - id: cal.1962-02-18.vietnam
    when: Feb. 18
    date: '1962-02-18'
    thread: vietnam
    c: 'Robert Kennedy in Saigon: the United States stays until it wins.'
    n: 'Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1961-01-28.vietnam]]. Names: Robert F. Kennedy (K–J Adm. III.A).'
  - id: cal.1962-02-20.space
    when: Feb. 20
    date: '1962-02-20'
    thread: space
    c: Glenn orbits three times in *Friendship 7*. A heat-shield warning; the shield holds.
    n: Tom Wolfe, *The Right Stuff* (1979). See [[cal.1961-04-12.space]].
  - id: cal.1962-02-20.specials
    when: Feb. 20
    date: '1962-02-20'
    thread: specials
    c: New York 6th, special. Benjamin Rosenthal (D) holds Lester Holtzman's seat, 44.5 to 43.8 over Galvin (R).
    n: 'Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1962-02-20-h-NY-6]
  - id: cal.1962-02-21.program
    when: Feb. 21
    date: '1962-02-21'
    thread: program
    c: House rejects the Urban Affairs reorganization plan, [264–150](https://voteview.com/rollcall/RH0870123).
    n: See [[cal.1962-01-24.program]].
  - id: cal.1962-02-27.vietnam
    when: Feb. 27
    date: '1962-02-27'
    thread: vietnam
    c: Two South Vietnamese pilots bomb Independence Palace. Diem and the Nhus unhurt.
    n: 'Miller, *Misalliance* (Viet. II.B.7). See [[cal.1961-01-28.vietnam]]. Names: Ngo Dinh Diem, Ngo Dinh Nhu, Tran Le Xuan (Viet. III.G).'
  - id: cal.1962-02-27.medicare
    when: Feb. 27
    date: '1962-02-27'
    thread: medicare
    c: Health message. Hospital insurance again.
    n: See [[cal.1961-02-09.medicare]].
