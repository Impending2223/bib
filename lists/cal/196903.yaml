    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai writes Mao and Lin Biao on whether the Ninth Congress presidium needs a standing committee: "should one or two old comrades also be on the presidium''s standing committee?" Mao: the presidium has no standing committee, only a chairman, vice-chairmen and a secretary-general, one each.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 282 (Mar. 25, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
