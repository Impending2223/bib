  - id: cal.1969-03-18.vietnam-operations
    when: Mar. 18
    date: '1969-03-18'
    thread: vietnam-operations
    c: B-52s strike along the Cambodian–Vietnamese border on the order of the same day, the raid the Americans called, by the history, "hoạt động bữa ăn" (the meal operation); it calls the raid the start of the war's widening into Cambodia, and Nixon calls it the first turning point in his administration's conduct of the war. From March 1969 to April 1970 the B-52s fly over 3,630 sorties on Cambodia, 60 percent of those in Indochina, by the history's count.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 109 and n. 1; 248. To check: Joseph A. Amter, *Lời phán quyết về Việt Nam*, a Vietnamese edition (Quân đội nhân dân, 1985), 277 (Nixon''s words; cited by [[w.lich-su-khang-chien-chong-my]], VI, 109 n. 1). Names: Nixon. Check: the order, the American name of the operation and the figures; the history calls the bombing secret (VI, 248), and when it was made public is to be found.'
    tags: [polity:us, name:nixon-richard-m, polity:cambodia]
