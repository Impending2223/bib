    thread: china-border-war
    also: [soviet-union, china-army]
    c: 'Zhenbao Island. The second clash: Soviet troops, with several dozen vehicles and about a dozen tanks by Yang Kuisong''s account, come onto the island again.{1} By the PLA officer''s account, a young Chinese conscript in ambush fires without his officer''s leave, citing Mao.{2} Chinese artillery fires for half an hour and knocks out all the Soviet vehicles; the Soviets answer with artillery.{3}'
    n: '[[w.macfarquhar-maos-last-revolution]], 310, 312; [[w.khoo-collateral-damage]], 56 (Moscow''s retaliatory strikes, Mar. 15); [[w.jian-zhou-enlai]], 618 (a larger, fiercer fight, heavier casualties on both sides); [[w.dikotter-cultural-revolution]], 206–207 n.2 (thousands of troops clash again on the island; the Soviets, better prepared, repel the attack with dozens of tanks and armoured vehicles; hundreds die); [[w.peng-dehuai-nianpu]], 822 (Mar. 15, 1969, as *Renmin ribao* 人民日报 reports it Mar. 16, read by Peng Dehuai 彭德怀: China''s frontier troops rise in self-defense, strike back at the Soviet invading forces and drive them from Zhenbao Island 珍宝岛). To check: "Zhenbaodao qingkuang diandi", in [[w.jiuda-ziliao-huibian]], 33 (cited by [[w.macfarquhar-maos-last-revolution]], 310 n.14a); Heilongjiang sheng fu Zhenbaodao weiwentuan, "Fanxiu zhanbei jiaoyu baogao", in [[w.jiuda-ziliao-huibian]], 73–77 (cited by [[w.macfarquhar-maos-last-revolution]], 310 n.14b); [[w.kuisong-mao-zedong-yu-mosikede]], 491–494 (cited by [[w.macfarquhar-maos-last-revolution]], 311 n.19b); [[w.galenovich-rossia-i-kitai-v]], 311 (cited by [[w.macfarquhar-maos-last-revolution]], 311 n.17); [[w.barnett-china-and-the-major]], 49 (cited by [[w.khoo-collateral-damage]], 56 n.81a); [[w.robinson-china-confronts-the-soviet]], 257, 260–261 (cited by [[w.khoo-collateral-damage]], 56 n.81b); [[w.xu-yan-chinese-soviet-border-clash-of-1969]], 8–9 (cited by [[w.jian-zhou-enlai]], 618 n.8). See [[cal.1969-03-02.china-leadership-5]]. Names: Mao Zedong. Check: the PLA officer''s account (310) calls it a Soviet "retaliatory attack" by a battalion, with losses on both sides and no clear victory. Check: a Russian account of 2001 ([[w.galenovich-rossia-i-kitai-v]], 311) gives fifty-eight Soviet soldiers killed on Mar. 2 and Mar. 15 (311).'
