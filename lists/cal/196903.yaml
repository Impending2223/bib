  - id: cal.1969-03-12.china-leadership
    when: Mar. 12
    date: '1969-03-12'
    thread: china-ninth-congress
    also: [china-mao-cr]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group on Chen Boda''s first draft of the Ninth Congress political report: name Liu Shaoqi only;{1} fewer quotations of himself; Lenin the Marxism of the imperialist era, so no three milestones; the draft must tell why the Cultural Revolution, and the contradictions, and war; the "great leap" of fire and steam as cultural revolutions.{2} Zhang Chunqiao and Yao Wenyuan to write it again.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 12, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 279 (Mar. 11–12, 1969; the political report, Liu and Deng); [[w.macfarquhar-maos-last-revolution]], 289 (Mao rejects Chen Boda''s text, "Strive to Build Our Country into a Powerful Socialist State," less than a month before the congress, for its content and for Chen''s shutting out Zhang Chunqiao and Yao Wenyuan; Zhang finds it too taken with "productive forces"; Zhang and Yao, under Kang Sheng, write a new draft); [[w.macfarquhar-maos-last-revolution]], 285–286 (Chen Boda''s view that production should come first once the congress is over is criticized as fallacious at a meeting in Mao''s presence); [[w.deng-xiaoping-nianpu-1904]], III, 1947 (Mar. 12, 1969; the nianpu: Mao, at the meeting of the Cultural Revolution Group''s liaison members on the drafting of the Ninth Congress political report, says: I have never been for lumping Deng Xiaoping together with Liu Shaoqi); [[w.mao-zedong-zhuan]], VI, ch. 77 n.68 (Mar. 12, in a talk with the members of the Cultural Revolution Group''s liaison meeting, Mao raises changing the writers: ''may I ask you three, Kang Sheng, Zhang Chunqiao and Yao Wenyuan'', ''the two houses each write their own''; the theme to be stated: the contradictions, the struggle of proletariat and bourgeoisie, why the Cultural Revolution is made, the obstruction of the mass movement which is quite serious; from then Zhang and Yao draft the report; the book does not give the hall, the afternoon or the points of the entry, n.68). [[w.yang-jisheng-tiandi-fanfu]], II, 720 (Mao, with no draft from Chen Boda, proposes others: "would you three, Kang, Zhang and Yao"; "the two to write each its own"; the report to set out the struggle of the proletariat and the bourgeoisie); [[w.jian-zhou-enlai]], 592 (Mao sides with Zhang and has him prepare his own draft; Chen finishes his version, which Mao ignores; Zhang''s draft adopted; not the day). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 283–284, cited by [[w.macfarquhar-maos-last-revolution]], 289 n.21). Check: the book (286) puts this criticism "barely three months" before May 23, 1969, without a day; taken here as this meeting. To check: [[w.chen-boda-yigao]], 113–114 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.20); [[w.zhou-enlai-nianpu-1949]], III, 283–284 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.21); [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1559–60 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.22); [[w.wenyao-guanyu-chen-boda-qicao]], 88–91 (cited by [[w.macfarquhar-maos-last-revolution]], 286 n.4b); Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会 (record 谈话记录), Mar. 12, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.68); Interview 访问 with Wu Faxian 吴法宪 (record 谈话记录), Nov. 18–25, 1983, on Chen Boda''s draft of the Ninth Congress report written with Lin Biao, the draft Mao set aside, and Lin''s displeasure (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.70); [[w.wang-wenyao-wenge-qianhou-shiqi-de-chen-boda]], 136–142 (cited by [[w.jian-zhou-enlai]], 592 n.2b). Names: Mao Zedong, Chen Boda, Liu Shaoqi, Zhang Chunqiao, Yao Wenyuan.'
