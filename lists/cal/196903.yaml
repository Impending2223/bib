  - id: cal.1969-03-17.china-leadership-2
    when: Mar. 17
    date: '1969-03-17'
    place: zhenbao-island
    thread: china-border-war
    also: [soviet-union, china-army]
    c: 'Zhenbao Island.{1} The third and last battle, the Soviets apparently attacking, with a new kind of tank, under a heavy artillery barrage: two battalions in armored carriers under a lieutenant colonel, by the PLA officer''s account;{2} three tanks and 100 infantry, by a later Chinese account. China does not report the battle at the time.{3}'
    n: '[[w.macfarquhar-maos-last-revolution]], 310–312. To check: [[w.ke-wenhua-dageming-zhongde-renmin]], 323 (cited by [[w.macfarquhar-maos-last-revolution]], 310 n.15a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 319 (cited by [[w.macfarquhar-maos-last-revolution]], 310 n.15b); [[w.heilongjiang-shengzhi-dashiji]], 952 (cited by [[w.macfarquhar-maos-last-revolution]], 310 n.15c); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 319 (cited by [[w.macfarquhar-maos-last-revolution]], 311 n.16); "Zhenbaodao qingkuang diandi", in [[w.jiuda-ziliao-huibian]], 33–34 (cited by [[w.macfarquhar-maos-last-revolution]], 311 n.18a). See [[cal.1969-03-15.china-leadership-3]]. Check: the Chinese put Soviet losses in the three clashes "in the hundreds" and claimed "more than 60 prisoners of war" (311); the book says the battle was public knowledge in China by 1989 (310 n.15).'
    src:
      c: 82a91bf6
      rows:
        - 'w.macfarquhar-maos-last-revolution 310–312: 1, 2, 3'
        - 'via x.1969.zhenbaodao-qingkuang-diandi: 2'
    tags: [polity:prc]
  - id: cal.1969-03-17.vietnam-hanoi
    when: Mar. 17
    date: '1969-03-17'
    place: dau-tieng
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Dầu Tiếng, Thủ Dầu Một. Twelve battalions of the American 25th and 1st Divisions, the 11th Armored Cavalry in the van, some 10,000 men, open Atlas Wedge to break the encirclement and relieve the base. Allied air and artillery drop over 1,500 tons on the Michelin plantation and villages Mar. 18–28. Eastern Nam Bộ''s Tây Ninh–Bình Long–Biên Hòa campaign hits Trà Cao and Nước Trong: over 2,000 out of action, nine mixed companies hurt, over 200 vehicles, 20 aircraft, by the history''s count.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 109–10. Check: the day and the figures; the history gives its own.'
    tags: [polity:drv, polity:us]
