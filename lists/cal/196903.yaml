# Cal. CXIII March 1969
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CXIII
entries:
  - id: cal.1969-03-02.china-leadership
    when: Mar. 2
    date: '1969-03-02'
    thread: china-leadership
    also: [soviet-union]
    c: The Chinese government protests to the Soviet government against a Soviet military intrusion onto Zhenbao Island in Hulin county, Heilongjiang; armed clashes of border troops there through Mar. 17. *Renmin ribao* prints the note Mar. 3.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 2, 1969. Check: the chronology''s range, Mar. 2–17, gives no day-by-day record of the fighting.'
    tags: [polity:prc]
  - id: cal.1969-03-03.soviet-union-leadership
    when: Mar. 3–4
    date: '1969-03-03'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev goes to Vnukovo for Gomułka, Mar. 3, 11:20 a.m.; with Podgorny, Kosygin and Katushev negotiates with him in the new hall of the Central Committee, Mar. 3, 3 to 8 p.m., and Mar. 4, 10 to 3; the dinner at the reception house, 3:32 to 5:30; he sees the delegation off at 6.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 319–320 (Mar. 3–4). Names: Brezhnev, Gomułka.'
    tags: [name:brezhnev-leonid, name:gomu-ka-w-adys-aw, polity:ussr, polity:poland]
  - id: cal.1969-03-03.china-leadership
    when: Mar. 3
    date: '1969-03-03'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: initials the Center, State Council, Military Commission and Group''s notice on protest demonstrations against Soviet revisionist armed provocation: no storming, smashing, burning, seizing or beating at Soviet embassy, bodies or people, and a line drawn between the crowds and any foreign embassy ("five nots, one line").'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 3, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-03.china-leadership-2
    when: Mar. 3
    date: '1969-03-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, evening, with the Cultural Revolution Group on preparing the Ninth Congress: opening Mar. 15, ten days; after it no Group, the Standing Committee instead; to Chen Boda for the delay of the political report, and to Lin Biao: "eat your own food".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 3, 1969. See [[cal.1969-03-03.china-leadership]]. Made public: 2013. Names: Mao Zedong, Chen Boda, Lin Biao.'
    tags: [polity:prc, name:mao-zedong, name:chen-boda, name:lin-biao, vis:only:prc]
  - id: cal.1969-03-07.china-leadership
    when: Mar. 7
    date: '1969-03-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group on the Ninth Congress and the Soviet border clashes: see the provincial leaders before the Congress; Chen Boda''s draft report was due Feb. 20 with no word on the delay; the Group''s three-man committee to be folded into the Group''s meeting, Zhou in charge; he is against writing "milestones" (Lin Biao: to be affirmed, as history made it). That night he circles Zhou''s report summoning 123 provincial and regional chiefs and military leaders, to fly in Mar. 8.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 7, 1969. Made public: 2013. Names: Mao Zedong, Chen Boda, Lin Biao, Zhou Enlai, Mao Yuanxin.'
    tags: [polity:prc, name:mao-zedong, name:chen-boda, name:lin-biao, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-10.soviet-union-leadership
    when: Mar. 10
    date: '1969-03-10'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev receives Bouteflika, Foreign Minister of Algeria, at 3 p.m., with the Algerian ambassador Ussedi present.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 321 (Mar. 10). Names: Brezhnev, Bouteflika, Ussedi.'
    tags: [name:brezhnev-leonid, name:bouteflika-abdel-aziz, polity:ussr, polity:algeria]
  - id: cal.1969-03-10.china-leadership
    when: Mar. 10
    date: '1969-03-10'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: approves the *Renmin ribao* commentator''s article "The Soviet revisionist renegade clique''s wild anti-China fury can only dig its own grave". Printed Mar. 11.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 10, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-12.china-leadership
    when: Mar. 12
    date: '1969-03-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group on Chen Boda''s first draft of the Ninth Congress political report: name Liu Shaoqi only; fewer quotations of himself; Lenin the Marxism of the imperialist era, so no three milestones; the draft must tell why the Cultural Revolution, and the contradictions, and war; the "great leap" of fire and steam as cultural revolutions. Zhang Chunqiao and Yao Wenyuan to write it again.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 12, 1969. Made public: 2013. Names: Mao Zedong, Chen Boda, Liu Shaoqi, Zhang Chunqiao, Yao Wenyuan.'
    tags: [polity:prc, name:mao-zedong, name:chen-boda, name:liu-shaoqi, name:zhang-chunqiao, name:yao-wenyuan, vis:only:prc]
  - id: cal.1969-03-13.soviet-union-leadership
    when: Mar. 13
    date: '1969-03-13'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Brezhnev, with Kosygin, negotiates with Černík in the Kremlin, 10 to 5.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 322 (Mar. 13). Names: Brezhnev, Kosygin, Černík. Check: The evening call on Biľak is the record''s; whether the Soviet side told Černík is not in it.'
    tags: [name:brezhnev-leonid, name:kosygin-aleksei, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-03-14.soviet-union-leadership
    when: Mar. 14–19
    date: '1969-03-14'
    thread: soviet-union-leadership
    also: [europe-and-the-alliance]
    c: 'Budapest. Brezhnev leads the party-government delegation to the Warsaw Pact''s Political Consultative Committee: leaves Moscow by special train Mar. 14, 6 p.m.; in Budapest Mar. 16, noon; the meeting Mar. 17; leaves Mar. 18, 11 a.m. Moscow time; in Moscow Mar. 19, 8:35 p.m.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 322–323 (Mar. 14–19). Names: Brezhnev. Check: The record gives the movements, not the business.'
    tags: [name:brezhnev-leonid, polity:ussr, polity:hungary]
  - id: cal.1969-03-15.china-leadership
    when: Mar. 15
    date: '1969-03-15'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Huang Yongsheng, Chen Xilian, Xie Fuzhi: on the world and the Ninth Congress. The US and USSR budgets at highs; China too big to swallow, let an invader in and he is easier to fight; two futures, a rise of world revolution or a third world war that again ends in imperialism''s defeat; China supports revolution but must above all prepare for war, in the third and fourth five-year plans.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 15, 1969. Made public: 2013. Names: Mao Zedong, Chen Yi, Huang Yongsheng, Chen Xilian, Xie Fuzhi.'
    tags: [polity:prc, name:mao-zedong, name:chen-yi, name:huang-yongsheng, name:chen-xilian, name:xie-fuzhi, vis:only:prc]
  - id: cal.1969-03-16.china-leadership
    when: Mar. 16
    date: '1969-03-16'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: Zhang Chunqiao and Yao Wenyuan''s draft of the Ninth Congress political report, Part I: read once, well written, small changes only.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Mar.–31, 1969. Made public: 2013. Names: Mao Zedong, Zhang Chunqiao, Yao Wenyuan.'
    tags: [polity:prc, name:mao-zedong, name:zhang-chunqiao, name:yao-wenyuan, vis:only:prc]
  - id: cal.1969-03-18.china-leadership
    when: Mar. 18
    date: '1969-03-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Mao, Hall 118, afternoon, calls Zhou Enlai and others on the draft Ninth Congress political report and on international questions.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 18, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-21.china-leadership
    when: Mar. 21
    date: '1969-03-21'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: the same draft, Parts IV and V: few problems, small changes. Parts II and III need heavy revision or rewriting: too many theses, nearly a compendium; merge them, cut repetition, no stages, and none of the Cultural Revolution Group''s names.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Mar.–31, 1969. Made public: 2013. Names: Mao Zedong, Zhang Chunqiao, Yao Wenyuan.'
    tags: [polity:prc, name:mao-zedong, name:zhang-chunqiao, name:yao-wenyuan, vis:only:prc]
  - id: cal.1969-03-22.china-leadership
    when: Mar. 22
    date: '1969-03-22'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: Zhou Enlai''s report that the Soviet leaders asked to telephone the Chinese leaders about Zhenbao and that the Foreign Ministry will answer by a memorandum: the telephone no longer fits the state of relations, let the Soviet government raise anything through diplomatic channels. Mao: agrees with the memorandum''s position, ready for diplomatic talks.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 22, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the chronology (note 9) names the Soviet leaders, Brezhnev and Kosygin; the Soviet side''s account.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-22.china-leadership-2
    when: Mar. 22
    date: '1969-03-22'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying: on the border clashes and the Congress. "Ease a little; we are isolated, nobody pays attention." The Congress to open Apr. 1: three items, the political report, the constitution, the election of a Central Committee; no Group names in the report, only his and Liu Shaoqi''s; separate Deng Xiaoping from Liu.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 22, 1969. See [[cal.1969-03-22.china-leadership]]. Made public: 2013. Names: Mao Zedong, Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Liu Shaoqi, Deng Xiaoping.'
    tags: [polity:prc, name:mao-zedong, name:chen-yi, name:li-fuchun, name:li-xiannian, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, name:liu-shaoqi, name:deng-xiaoping, vis:only:prc]
  - id: cal.1969-03-25.china-leadership
    when: Mar. 25
    date: '1969-03-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: the first revised draft of the report: read once, slightly changed, usable in the main; compress, cut empty words and unneeded adjectives; Lin Biao to decide.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Mar.–31, 1969. Made public: 2013. Names: Mao Zedong, Zhang Chunqiao, Yao Wenyuan, Lin Biao.'
    tags: [polity:prc, name:mao-zedong, name:zhang-chunqiao, name:yao-wenyuan, name:lin-biao, vis:only:prc]
  - id: cal.1969-03-26.china-leadership
    when: Mar. 26
    date: '1969-03-26'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group on the Ninth Congress: the political report short, so that it will be read; the presidium''s list to be sounded out.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 26, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-29.china-leadership
    when: Mar. 29
    date: '1969-03-29'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group on the Congress and the border clashes: the revised political report of Mar. 28 about done, a few lines to strike with after-effects; too many quotations, foreigners cannot read them. He initials Zhou Enlai''s plan for a Central Committee of 115 members and 95 alternates (210): as proposed, but "somewhat larger".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 29, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-31.china-leadership
    when: Mar. 31
    date: '1969-03-31'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: Zhou Enlai''s plan to consult the presidium''s preliminary members and army heads and to name Xu Haidong a delegate and presidium member: agreed. For the opening session the platform not too thin; wants Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Chen Yun among those there. The presidium list, 175, becomes 176 with Xu.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 31, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Xu Haidong, Chen Yun.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:dong-biwu, name:liu-bocheng, name:zhu-de, vis:only:prc, name:chen-yun]
