  - id: cal.1969-03-28.china-leadership-2
    when: Mar. 28
    date: '1969-03-28'
    thread: china-leadership
    also: [europe-and-the-alliance, china]
    c: 'Zhou Enlai receives Albania''s ambassador, Robo (as the nianpu writes it), and its counselor, Agolli, on Agolli''s having driven drunk after a Chinese banquet and killed a Chinese worker: the fault is China''s, he himself did not take hold of it and is responsible; the Protocol Department is to study a change of rules, no Maotai at formal banquets, only wine, one bottle a table, none at informal dinners. Of his own lesson in drinking: he gave up drink in 1965 after thirty years, having learned of Maotai crossing the Maotai river in 1935; much drinking harms the body and brings political mistakes.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 283 (Mar. 28, 1969); [[w.zhou-enlai-waijiao-huodong]], 534 (Mar. 28, 1969; 6 p.m., Fujian Hall, Great Hall of the People; the ambassador Robo and the counselor (阿果利) on the incident of the drunken driving that killed a Chinese worker; the book has Zhou on his thirty years of drinking from 1935 to 1965, four occasions on which he was plied with drink (the Whampoa Military Academy about 1925 over his marriage; Wuhan in 1938; Chongqing; Moscow before the 1954 Geneva conference, Korean and Vietnamese representatives present), his decision in 1965 to stop, and drink bringing harm to the body and political mistakes). Made public: 1993. Names: Zhou Enlai. Check: the ambassador''s name.'
    src:
      c: 1f2f07c7
      rows:
