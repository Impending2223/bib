entries:
  - id: cal.1969-03-01.china-leadership
    when: Mar. 1
    date: '1969-03-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai attends the national planning forum; in the evening the Cultural Revolution Group's liaison meeting takes up its matters.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 276 (Mar. 1, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-02.china-leadership
    when: Mar. 2
    date: '1969-03-02'
    thread: china-leadership
    also: [soviet-union]
    c: The Chinese government protests to the Soviet government against a Soviet military intrusion onto Zhenbao Island in Hulin county, Heilongjiang; armed clashes of border troops there through Mar. 17. *Renmin ribao* prints the note Mar. 3.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 2, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 2–3, 1969; the protest, which it dates Mar. 3). Check: the chronology''s range, Mar. 2–17, gives no day-by-day record of the fighting. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 2–4, 1969), dates the Chinese government''s protest to the Soviet government Mar. 3 and has the Renmin ribao and Jiefangjun bao editorial "Down with the new tsars", revised by Zhou, Mar. 4.'
    src:
      c: efdcdd2a
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Mar. 2, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 277: A'
    tags: [polity:prc]
  - id: cal.1969-03-02.china-leadership-2
    when: Mar. 2
    date: '1969-03-02'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the forum''s bulletin no. 10, on devolving the management system of enterprises, notes: enterprises are devolved in three classes: most to the localities; some under dual leadership, the locality chief; a very few under dual leadership, the Center chief. Devolution is to grasp revolution, promote production, business and war preparation better, rouse local initiative and the people''s creativeness, and serve the carrying out of the Center''s policy and plan, and is in no way to be seen as throwing off a burden. It is to be done by region, systematically, prepared, by steps, with handover, in batches; every good cooperative tie is kept and adjusted well; the Center''s departments are to see it through to the end.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 276–277 (Mar. 2, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-02.china-leadership-3
    when: Mar. 2
    date: '1969-03-02'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai writes Li Fuchun, Li Xiannian, Yu Qiuli and others: Yu is to make a first draft in three days of the 1970 targets, the industrial layout and the economic regions and cooperative ties; Xie Beiyi is to rework the outline of this year''s plan in two days, the text much cut, under twenty pages, "else the workers cannot discuss it", adding a passage on commerce and foreign trade policy and plan, a mention of what worthy things may be made this year, and in the financial part a mention of reforming tax policy.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 2, 1969). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
    tags: [polity:prc, name:zhou-enlai, name:li-fuchun, name:li-xiannian, vis:only:prc]
  - id: cal.1969-03-02.china-leadership-4
    when: Mar. 2
    date: '1969-03-02'
    thread: china-leadership
    also: [china, soviet-union]
    c: 'Zhou Enlai, on the Soviet border troops'' armed incursion into the Zhenbao Island area of Heilongjiang, killing and wounding Chinese border men, the Chinese border troops forced to fire back, calls the Foreign Ministry''s people and gives them tasks, and calls the departments concerned to a forum on international questions. After the incident he repeatedly instructs the border troops to act strictly on the principle fixed by Mao and the Center: justified, advantageous, restrained.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 2, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-03.soviet-union-leadership
    when: Mar. 3–4
    date: '1969-03-03'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev goes to Vnukovo for Gomułka, Mar. 3, 11:20 a.m.; with Podgorny, Kosygin and Katushev negotiates with him in the new hall of the Central Committee, Mar. 3, 3 to 8 p.m., and Mar. 4, 10 to 3; the dinner at the reception house, 3:32 to 5:30; he sees the delegation off at 6.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 319–320 (Mar. 3–4). Names: Brezhnev, Gomułka.'
    tags: [name:brezhnev-leonid, name:gomu-ka-w-adys-aw, polity:ussr, polity:poland]
  - id: cal.1969-03-03.china-leadership
    when: Mar. 3
    date: '1969-03-03'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: initials the Center, State Council, Military Commission and Group''s notice on protest demonstrations against Soviet revisionist armed provocation: no storming, smashing, burning, seizing or beating at Soviet embassy, bodies or people, and a line drawn between the crowds and any foreign embassy ("five nots, one line").'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 3, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 4, 1969; the notice as revised by Zhou). Made public: 2013. Names: Mao Zedong.'
    src:
      c: d0cfdd51
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Mar. 3, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 278: A'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-03.china-leadership-2
    when: Mar. 3
    date: '1969-03-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, evening, with the Cultural Revolution Group on preparing the Ninth Congress: opening Mar. 15, ten days; after it no Group, the Standing Committee instead; to Chen Boda for the delay of the political report, and to Lin Biao: "eat your own food".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 3, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 3, 1969; the letter and the evening meeting). See [[cal.1969-03-03.china-leadership]]. Made public: 2013. Names: Mao Zedong, Chen Boda, Lin Biao.'
    src:
      c: bae5ae05
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Mar. 3, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 277: A'
    tags: [polity:prc, name:mao-zedong, name:chen-boda, name:lin-biao, vis:only:prc]
  - id: cal.1969-03-03.china-leadership-3
    when: Mar. 3
    date: '1969-03-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: Zhou Enlai writes Mao and Lin Biao on the Sino-Soviet border armed conflict and on grasping revolution and promoting production, and proposes that Mao call the liaison meeting's members so he can report and ask instructions in person. That evening he goes to a meeting at Mao's.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 3, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-03-03.china-leadership-4
    when: Mar. 3
    date: '1969-03-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the Sichuan Geological Bureau''s finding copper in western Sichuan, where transport is very difficult, and its asking for aircraft to carry prospecting machinery into the area, writes the Military Commission''s Office Group: consider whether helicopters can be used for survey and transport, and if so tell the Chengdu Military Region''s air force to help.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 277–278 (Mar. 3, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-04.china-leadership
    when: Mar. 4
    date: '1969-03-04'
    thread: china-leadership
    also: [soviet-union, china]
    c: The Renmin ribao and the Jiefangjun bao print the editorial "Down with the new tsars", revised by Zhou Enlai, on the Zhenbao incident.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 4, 1969). See [[cal.1969-03-02.china-leadership]]. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1969-03-04.china-leadership-2
    when: Mar. 4
    date: '1969-03-04'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'Soldiers and civilians in Peking, Tianjin, Shanghai and some twenty other cities hold marches and denunciation rallies protesting the Soviet border troops'' incursion onto Zhenbao Island. The Center, State Council, Military Commission and Cultural Revolution Group''s notice on protest marches, revised earlier by Zhou Enlai, ordered the "five nots and one line": no storming, smashing, burning, seizing or beating at the Soviet embassy, its bodies or its people in China, and a line drawn between the marching columns and the foreign embassies.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 4, 1969). See [[cal.1969-03-03.china-leadership]]. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1969-03-06.vietnam-hanoi
    when: Mar. 6
    date: '1969-03-06'
    thread: vietnam-hanoi
    c: 'The Secretariat''s circular no. 229-TT/TW on work among women in 1969 and the summing up of four years: the "three responsibilities" movement to be led on, women''s labor and their life seen to; the four years'' work reviewed at every level.'
    n: '*Thông tri của Ban Bí thư số 229-TT/TW, ngày 6 tháng 3 năm 1969, Về công tác vận động phụ nữ năm 1969 và tổng kết công tác vận động phụ nữ trong bốn năm chống Mỹ, cứu nước*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 34–36. Made public: 2004. See [[cal.1969-01-06.vietnam-hanoi-2]].'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-03-06.china-leadership
    when: Mar. 6
    date: '1969-03-06'
    thread: china-leadership
    also: [soviet-union, china]
    c: Zhou Enlai changes "Soviet revisionist" to "Soviet" in "Soviet revisionist border troops" and "Soviet revisionist armed forces" throughout the drafts the propaganda departments sent for review.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 6, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-07.china-leadership
    when: Mar. 7
    date: '1969-03-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group on the Ninth Congress and the Soviet border clashes: see the provincial leaders before the Congress; Chen Boda''s draft report was due Feb. 20 with no word on the delay; the Group''s three-man committee to be folded into the Group''s meeting, Zhou in charge; he is against writing "milestones" (Lin Biao: to be affirmed, as history made it). That night he circles Zhou''s report summoning 123 provincial and regional chiefs and military leaders, to fly in Mar. 8.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 7, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 7, 1969; the meeting at Mao''s); [[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 7, 1969; the draft telephone notice and list). Made public: 2013. Names: Mao Zedong, Chen Boda, Lin Biao, Zhou Enlai, Mao Yuanxin.'
    src:
      c: f441dd78
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Mar. 7, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 278: E'
    tags: [polity:prc, name:mao-zedong, name:chen-boda, name:lin-biao, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-07.china-leadership-2
    when: Mar. 7
    date: '1969-03-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai, on the view agreed at the Cultural Revolution Group's liaison meeting, drafts for the Center and the Group the telephone notice and list calling the heads of the provincial, municipal and regional revolutionary committees and of the great military regions to Peking to consult on the list of Ninth Congress delegates and the Congress's preparations, and sends them to Mao and Lin Biao to read.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 7, 1969). Made public: 2020. See [[cal.1969-03-07.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-03-08.china-leadership
    when: Mar. 8
    date: '1969-03-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai presides over the Cultural Revolution Group''s liaison meeting, which takes up the part of the Ninth Congress political report drafted by Chen Boda and the time and agenda of the Congress''s preparatory meeting. Afterward he reports in writing to Mao and Lin Biao: Boda handed in three quarters of the draft last night; two and a half questions remain (international, Mao Zedong Thought, uniting); Boda is to finish in three days and then all discuss. The nianpu''s note: Chen''s draft was later charged with "advocating the theory of productive forces" and set aside, and Lin Biao''s report at the Congress was redrafted by Zhang Chunqiao and Yao Wenyuan.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 8, 1969). Made public: 2020. Names: Zhou Enlai, Chen Boda, Mao Zedong, Lin Biao, Zhang Chunqiao, Yao Wenyuan.'
    tags: [polity:prc, name:zhou-enlai, name:chen-boda, name:mao-zedong, name:lin-biao, name:zhang-chunqiao, name:yao-wenyuan, vis:only:prc]
  - id: cal.1969-03-09.china-leadership
    when: Mar. 9
    date: '1969-03-09'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai presides over the first plenary session of the Ninth Congress preparatory meeting, attended by the heads of the provinces, municipalities, regions and great military regions, and announces its groups and tasks: to discuss the proposals some provinces made to replace certain delegates, approve the delegates and lists put forward by all regions and units, and settle the opening date, the size of the presidium, its list and the agenda.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 278–279 (Mar. 9, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-10.soviet-union-leadership
    when: Mar. 10
    date: '1969-03-10'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev receives Bouteflika, Foreign Minister of Algeria, at 3 p.m., with the Algerian ambassador Ussedi present.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 321 (Mar. 10). Names: Brezhnev, Bouteflika, Ussedi.'
    tags: [name:brezhnev-leonid, name:bouteflika-abdel-aziz, polity:ussr, polity:algeria]
  - id: cal.1969-03-10.china-leadership
    when: Mar. 10
    date: '1969-03-10'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: approves the *Renmin ribao* commentator''s article "The Soviet revisionist renegade clique''s wild anti-China fury can only dig its own grave". Printed Mar. 11.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 10, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-10.china-leadership-2
    when: Mar. 10
    date: '1969-03-10'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai attends the East China group of the Ninth Congress preparatory meeting.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 279 (Mar. 10, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-11.china-leadership
    when: Mar. 11–12
    date: '1969-03-11'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai goes to meetings at Mao's on Mar. 11 and 12, on the Ninth Congress political report. On the 12th Mao says the report may omit Deng Xiaoping but is to mention Liu Shaoqi.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 279 (Mar. 11, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Deng Xiaoping, Liu Shaoqi.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:deng-xiaoping, name:liu-shaoqi, vis:only:prc]
  - id: cal.1969-03-12.china-leadership
    when: Mar. 12
    date: '1969-03-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group on Chen Boda''s first draft of the Ninth Congress political report: name Liu Shaoqi only; fewer quotations of himself; Lenin the Marxism of the imperialist era, so no three milestones; the draft must tell why the Cultural Revolution, and the contradictions, and war; the "great leap" of fire and steam as cultural revolutions. Zhang Chunqiao and Yao Wenyuan to write it again.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 12, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 279 (Mar. 11–12, 1969; the political report, Liu and Deng). Made public: 2013. Names: Mao Zedong, Chen Boda, Liu Shaoqi, Zhang Chunqiao, Yao Wenyuan.'
    src:
      c: 812d4a9e
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Mar. 12, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 279: A'
    tags: [polity:prc, name:mao-zedong, name:chen-boda, name:liu-shaoqi, name:zhang-chunqiao, name:yao-wenyuan, vis:only:prc]
  - id: cal.1969-03-12.china-leadership-2
    when: Mar. 12
    date: '1969-03-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Deng Yingchao writes Zhou Enlai a note: follow Chairman Mao closely, study and apply his thought, take the long view of things and people, guard against impatience and excitement, and try to keep in health to go on working; yesterday old Pu, the Chinese-medicine physician Pu Fuzhou, told her he should avoid worry and excitement lest his heart fluctuate.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 279 (Mar. 12, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-13.soviet-union-leadership
    when: Mar. 13
    date: '1969-03-13'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Brezhnev, with Kosygin, negotiates with Černík in the Kremlin, 10 to 5.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 322 (Mar. 13). Names: Brezhnev, Kosygin, Černík. Check: The evening call on Biľak is the record''s; whether the Soviet side told Černík is not in it.'
    tags: [name:brezhnev-leonid, name:kosygin-aleksei, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-03-14.soviet-union-leadership
    when: Mar. 14–19
    date: '1969-03-14'
    thread: soviet-union-leadership
    also: [europe-and-the-alliance]
    c: 'Budapest. Brezhnev leads the party-government delegation to the Warsaw Pact''s Political Consultative Committee: leaves Moscow by special train Mar. 14, 6 p.m.; in Budapest Mar. 16, noon; the meeting Mar. 17; leaves Mar. 18, 11 a.m. Moscow time; in Moscow Mar. 19, 8:35 p.m.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 322–323 (Mar. 14–19). Names: Brezhnev. Check: The record gives the movements, not the business.'
    tags: [name:brezhnev-leonid, polity:ussr, polity:hungary]
  - id: cal.1969-03-14.vietnam-hanoi
    when: Mar. 14
    date: '1969-03-14'
    thread: vietnam-hanoi
    c: 'The Secretariat hears the Domestic Trade Ministry''s Party group on trade in 1969: rationed food, sauce and cloth roughly assured, other needs to be met quickly; the trade branch to produce and process for itself; industry, farming and localities not to rely only on the state''s share for export; contracts with cooperatives of some 200 hectares; the socialist transformation of private trade to go on.'
    n: '*Thông báo số 07-TB/TW, ngày 9 tháng 5 năm 1969, Về Hội nghị Ban Bí thư bàn công tác nội thương năm 1969* (the meeting of Mar. 14), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXX, 65–71. Made public: 2004.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-03-14.china-leadership
    when: Mar. 14
    date: '1969-03-14'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai talks with the representatives of the eight military regions.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 279 (Mar. 14, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-14.china-leadership-2
    when: Mar. 14
    date: '1969-03-14'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai receives the delegation of the Progressive Labor Party of the United States. On population growth: the American rate is still slow, not as fast as China''s; a few years ago family planning held Peking''s rate near 1 to 1.5 percent, but since the Cultural Revolution the young linked up, married early and the birth rate rose, so family planning is to be raised again this year; making contraceptives is easy but forming a habit is not. Asked whether the Sino-Soviet border conflict may grow larger: it cannot be said yet; the Soviets use it to mobilize their people and watch world opinion; an attack on China is difficult for them.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 279 (Mar. 14, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, polity:us, name:zhou-enlai, vis:only:prc+us]
  - id: cal.1969-03-15.china-leadership
    when: Mar. 15
    date: '1969-03-15'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Huang Yongsheng, Chen Xilian, Xie Fuzhi: on the world and the Ninth Congress. The US and USSR budgets at highs; China too big to swallow, let an invader in and he is easier to fight; two futures, a rise of world revolution or a third world war that again ends in imperialism''s defeat; China supports revolution but must above all prepare for war, in the third and fourth five-year plans.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 15, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 279–280 (Mar. 15, 1969; the meeting at Mao''s). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 279–280 (Mar. 15, 1969), has the liaison meeting report at Mao''s, and Mao say the Ninth Congress report is not to speak of the "February counter-current", the Congress is to be one of unity, those concerned are full of anger and it is forgivable, and they may sit on the rostrum. Names: Mao Zedong, Chen Yi, Huang Yongsheng, Chen Xilian, Xie Fuzhi.'
    src:
      c: 02af570e
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Mar. 15, 1969: all'
