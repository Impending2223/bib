  - id: cal.1969-03-02.china-leadership
    when: Mar. 2
    date: '1969-03-02'
    thread: china-border-war
    also: [soviet-union, china-army]
    c: The Chinese government protests to the Soviet government against a Soviet military intrusion onto Zhenbao Island in Hulin county, Heilongjiang;{1} armed clashes of border troops there through Mar. 17.{2} *Renmin ribao* prints the note Mar. 3.{3}
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 2, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 2–3, 1969; the protest, which it dates Mar. 3); [[w.zhonghua-renmin-gongheguo-waijiao]], 210 (Mar. 2, 1969; the Foreign Ministry note to the Soviet embassy, the strongest protest at Soviet border troops'' entering the Zhenbao Island area of Heilongjiang on Mar. 2, shooting dead or wounding several Chinese border men, and making a grave armed clash; China demands punishment of the culprits, an end to the incursions and provocation, and keeps the right to claim for all losses); [[w.macfarquhar-maos-last-revolution]], 309 (the Chinese public account of 1969: Soviet forces "made successive armed intrusions" and Chinese frontier guards "fought back in self-defense"); [[w.mao-zedong-zhuan]], VI, ch. 77 n.83 (the book''s note gives the Chinese account: on Mar. 2 Soviet frontier troops invade the Zhenbao Island area of Hulin county, Heilongjiang, and Chinese frontier troops, on instruction of the Military Commission, fight back; on Mar. 15 and 17 the Soviet side, struck, attacks the Chinese troops on the island in greater force and, after continuous fighting, is driven off by the Chinese troops and people; the note names no record, n.83; the book says nothing of a protest note). [[w.chen-yun-nianpu-xiuding]], III, 167 (Mar. 2: Soviet border troops intrude on the Zhenbao Island area of Heilongjiang province, making a grave bloody incident; China''s border troops are forced to hit back in self-defense; thereafter Sino-Soviet relations worsen further); [[w.peng-dehuai-nianpu]], 821 (Mar. 2, 1969: *Renmin ribao* 人民日报 issues the news "Our government lodges the strongest protest with the Soviet government" 《我国政府向苏联政府提出最强烈抗议》: Soviet frontier troops have intruded into the Zhenbao Island 珍宝岛 area of Heilongjiang 黑龙江 and made a very grave bloody incident). Check: the chronology''s range, Mar. 2–17, gives no day-by-day record of the fighting. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 2–4, 1969), dates the Chinese government''s protest to the Soviet government Mar. 3 and has the Renmin ribao and Jiefangjun bao editorial "Down with the new tsars", revised by Zhou, Mar. 4. Check: unit B sums up the clashes of Mar. 2, 15 and 17, entered on their days from [[w.macfarquhar-maos-last-revolution]], 309–312. To check: [[w.important-documents-on-the]], 93–94 (cited by [[w.macfarquhar-maos-last-revolution]], 309 n.9a); [[w.choushi-suxiu-maoshi-suxiu]], 42–65 (cited by [[w.macfarquhar-maos-last-revolution]], 309 n.9b).'
    src:
