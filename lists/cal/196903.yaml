  - id: cal.1969-03-21.china-leadership-3
    when: Mar. 21
    date: '1969-03-21'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'Zhou Enlai, on Kosygin''s request by carrier telephone to speak with Mao and Zhou, calls the Foreign Ministry''s Ji Pengfei, Qiao Guanhua, Ma Wenbo and Li Lianqing and settles on a memorandum in reply to the Soviet chargé: in the present relations of the two countries contact by telephone is no longer suitable, and if the Soviet government has anything to say it is to put it formally to the Chinese government through diplomatic channels.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 281 (Mar. 21, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
