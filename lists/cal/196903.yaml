  - id: cal.1969-03-11.china
    when: Mar. 11
    date: '1969-03-11'
    thread: china
    also: [soviet-union]
    c: The Foreign Ministry's information department publishes the article "Zhenbao Island Has Always Been Chinese Territory". It says that even by the unequal Sino-Russian Peking treaty the island is indisputably China's; by the accepted rule of international law the boundary on a navigable river runs along the center of the main channel, and islands are assigned by it; Zhenbao and the nearby Kabozi and Qiliqin islands lie on the Chinese side of the main channel of the Wusuli River, and have always been under Chinese administration, with Chinese border troops patrolling and Chinese residents working on them.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 211 (Mar. 11, 1969).'
    src:
      c: 79d0dfb7
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 211: all'
