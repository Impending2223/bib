    n: '[[w.lich-su-khang-chien-chong-my]], VI, 113 and n. 1. To check: *Chiến trường Trị–Thiên–Huế trong cuộc kháng chiến chống Mỹ toàn thắng* (Thuận Hóa, 1985), 172 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 113 n. 1). Check: the end; the history prints "31-4-1969".'
    tags: [polity:drv, polity:us]
