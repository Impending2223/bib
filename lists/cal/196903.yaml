    also: [india-and-china-cultural-revolution, soviet-union, china-mao-foreign]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying: on the border clashes and the Congress.{1} "Ease a little; we are isolated, nobody pays attention." The Congress to open Apr. 1: three items, the political report, the constitution, the election of a Central Committee;{2} no Group names in the report, only his and Liu Shaoqi''s;{3} separate Deng Xiaoping from Liu.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 22, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 281 (Mar. 22, 1969; the meeting and its attendants); [[w.macfarquhar-maos-last-revolution]], 290 (a week before the congress, Mao to the Group: "the only names to be mentioned in the report are those of myself and Liu Shaoqi"); [[w.deng-xiaoping-nianpu-1904]], III, 1947 (Mar. 22, 1969; the nianpu: Mao, with the Cultural Revolution Group''s liaison members, on preparing the Ninth Congress, says again that the report is to carry only his name and Liu Shaoqi''s, that Deng Xiaoping and Liu must be told apart, that the comrades who erred this time have not erred so much as Wang Ming, and that most are to be treated as contradictions among the people); [[w.mao-zedong-zhuan]], VI, ch. 77 n.61 (Mar. 22, in a talk with the members of the Cultural Revolution Group''s liaison meeting, to which Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian and Nie Rongzhen (down at their factories) were called: ''long since we met, you have done well; you should change over, Nankou, Xinhua and the Erqi works are all big plants''; will you study international questions; Nie not only the defense commission, Ye only the military science academy, look wider, military, political, home, abroad; old men have eaten more rice and have experience, the ''little turnips'' look down on you, ''I do not agree''; the ''February counter-current'' is not to be in the report; no Group member''s name in it, only Mao''s and Liu Shaoqi''s, only Liu''s bourgeois revisionist line; the comrades who erred this time erred less than Wang Ming; at the Seventh Congress not one was lost; as for Jiang Weiqing 江渭清, Tan Qilong 谭启龙, Zhang Pinghua 张平化, Zhao Ziyang 赵紫阳 and Huo Shilian 霍士廉, study what is seriously wrong, and if nothing but this time''s error, free them in time, n.61). [[w.yang-jisheng-tiandi-fanfu]], II, 714 (Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian and Nie Rongzhen called from the factories; the "February adverse current" out of the report; Apr. 1, three items on the agenda); [[w.yang-jisheng-tiandi-fanfu]], II, 1101 (on foreign relations: "a little easing is good; we are isolated now, nobody pays us attention"); [[w.liu-jixian-ye-jianying-nianpu]], II, 981 (Mar. 22, 1969; afternoon; Ye Jianying 叶剑英 at Mao''s; Mao: you old comrades must work for the country, not a single department; Nie Rongzhen not only the Defense Science Commission, Ye Jianying not only the Academy of Military Science; military, political, domestic and foreign matters; the "little turnip-heads" look down on you as old and useless; "I don''t agree"; Mao on the border clashes and the Ninth Congress). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 281 (Mar. 22, 1969), has Mao at this meeting repeating that the report will not speak of the "February counter-current", and saying that to attack Old Marshal Chen is to attack the Premier, and that Chen is still guarding the road. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1543 (cited by [[w.macfarquhar-maos-last-revolution]], 290 n.28); Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会 and Chen Yi 陈毅 and others (record 谈话记录), Mar. 22, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.61). See [[cal.1969-03-22.china-leadership]]. Made public: 2013. Names: Mao Zedong, Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Liu Shaoqi, Deng Xiaoping.'
