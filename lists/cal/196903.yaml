  - id: cal.1969-03-02.china-leadership-2
    when: Mar. 2
    date: '1969-03-02'
    thread: china-zhou
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the forum''s bulletin no. 10, on devolving the management system of enterprises, notes: enterprises are devolved in three classes: most to the localities; some under dual leadership, the locality chief; a very few under dual leadership, the Center chief. Devolution is to grasp revolution, promote production, business and war preparation better, rouse local initiative and the people''s creativeness, and serve the carrying out of the Center''s policy and plan, and is in no way to be seen as throwing off a burden. It is to be done by region, systematically, prepared, by steps, with handover, in batches; every good cooperative tie is kept and adjusted well; the Center''s departments are to see it through to the end.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 276–277 (Mar. 2, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-03-02.china-leadership-3
    when: Mar. 2
    date: '1969-03-02'
    thread: china-zhou
    also: [india-and-china-cultural-revolution, china-economy]
    c: 'Zhou Enlai writes Li Fuchun, Li Xiannian, Yu Qiuli and others: Yu is to make a first draft in three days of the 1970 targets, the industrial layout and the economic regions and cooperative ties; Xie Beiyi is to rework the outline of this year''s plan in two days, the text much cut, under twenty pages, "else the workers cannot discuss it", adding a passage on commerce and foreign trade policy and plan, a mention of what worthy things may be made this year, and in the financial part a mention of reforming tax policy.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 2, 1969). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Yu Qiuli.'
    tags: [polity:prc, name:zhou-enlai, name:li-fuchun, name:li-xiannian, vis:only:prc, name:yu-qiuli]
  - id: cal.1969-03-02.china-leadership-4
    when: Mar. 2
    date: '1969-03-02'
    thread: china-border-war
    also: [soviet-union, china-zhou-foreign]
    c: 'Zhou Enlai, on the Soviet border troops'' armed incursion into the Zhenbao Island area of Heilongjiang, killing and wounding Chinese border men, the Chinese border troops forced to fire back, calls the Foreign Ministry''s people and gives them tasks, and calls the departments concerned to a forum on international questions. After the incident he repeatedly instructs the border troops to act strictly on the principle fixed by Mao and the Center: justified, advantageous, restrained.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 2, 1969); [[w.jian-zhou-enlai]], 618 (as both sides move troops there, Zhou keeps in close touch with the front commanders by telephone; not the day). Made public: 2020. To check: Transcript of Chen Xiliang interview, July 1995 (copy in the author''s possession) (cited by [[w.jian-zhou-enlai]], 618 n.7). Names: Zhou Enlai, Mao Zedong.'
    src:
      c: eb43b90b
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 277: ?'
        - 'w.jian-zhou-enlai 618: ?'
        - 'via x.1995-07.chen-xiliang-interview-chen-jian: ?'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-02.china-leadership-5
    when: Mar. 2
    date: '1969-03-02'
    place: zhenbao-island
    thread: china-ninth-congress
    also: [soviet-union, china-border-war, china-army]
    c: Zhenbao Island. Chinese troops ambush a Soviet border detachment. By a PLA officer's account after the Ninth Congress, sixty-one Soviet soldiers who enter Chinese territory are "totally annihilated"; two badly wounded survivors are later "jolted to death" by Chinese militiamen.
    n: '[[w.macfarquhar-maos-last-revolution]], 309–310 (the account, "Zhenbaodao qingkuang diandi," to a restricted high-level audience); [[w.yang-jisheng-tiandi-fanfu]], II, 736 (Mar. 2, the Zhenbao Island incident); [[w.khoo-collateral-damage]], 56 (the preventive strike of Mar. 2, 1969); [[w.teiwes-tragedy-of-lin-biao]], 111, 118, 125 (the clash at Zhenbao Island on the Ussuri, open hostilities; Lin briefed on it, his part in foreign affairs from a military view alone; in its wake, at the time of the Ninth Congress, Mao: "We must be prepared for war"); [[w.jian-zhou-enlai]], 596 ("two border clashes ... at Zhenbao Island on the Ussuri River in March 1969"; Mao calls on the whole country to "prepare for war"); [[w.jian-zhou-enlai]], 618 (the clash of Mar. 2 at Zhenbao Island (Damansky) on the Ussuri); [[w.friedman-shadow-cold-war]], 177 (the clashes over Damanskii/Zhenbao in March 1969 hurry Peking''s return to the world for fear of Soviet attack); [[w.chang-friends-and-enemies]], 277 (Chinese and Soviet troops clash around Zhenbao Island in the Ussuri, scores killed or wounded); [[w.dikotter-cultural-revolution]], 206–207 n.1, n.2 ("in the early hours of the morning" dozens of armed Chinese soldiers cross the ice, occupy the island and fire at the Soviet border post at point-blank range; mortars; hours of crossfire until Soviet reinforcements with missile launchers arrive; the operation, prepared for months, run from the Capital West Hotel in Peking by a special telephone line, Zhou Enlai making the key decisions). To check: "Zhenbaodao qingkuang diandi", in [[w.jiuda-ziliao-huibian]], 33–34 (cited by [[w.macfarquhar-maos-last-revolution]], 310 n.11); "Zhenbaodao qingkuang diandi", in [[w.jiuda-ziliao-huibian]], 33 (cited by [[w.macfarquhar-maos-last-revolution]], 310 n.12); [[w.goldstein-return-to-zhenbao-island]], 985–997 (cited by [[w.macfarquhar-maos-last-revolution]], 309 n.10); Lyle Goldstein''s interviews with Jiang Yi, Li Danhui and Yang Kuisong (cited in Goldstein, "Do Nascent WMD Arsenals Deter?," Political Science Quarterly 118.1 (2003), 58–59) (cited by [[w.khoo-collateral-damage]], 56 n.78a); [[w.goldstein-do-nascent-wmd-arsenals]], 58–59 (cited by [[w.khoo-collateral-damage]], 56 n.78b); [[w.robinson-china-confronts-the-soviet]] (cited by [[w.khoo-collateral-damage]], 56 n.78d); [[w.yunsheng-maojiawan-jishi]], 218 (cited by [[w.teiwes-tragedy-of-lin-biao]], 125 n.41a); [[w.pollack-opening-to-america]], 411 (cited by [[w.teiwes-tragedy-of-lin-biao]], 125 n.41b); [[w.xu-xiangqian-lishi-de-huigu]], III, 848 (cited by [[w.teiwes-tragedy-of-lin-biao]], 125 n.41c); [[w.chen-yi-zhuan]], 614–615 (cited by [[w.teiwes-tragedy-of-lin-biao]], 125 n.41d); [[w.su-caiqing-huanhe-zhong-mei-guanxi]], 7 (cited by [[w.teiwes-tragedy-of-lin-biao]], 125 n.41e); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 125 n.41f); [[w.xu-yan-chinese-soviet-border-clash-of-1969]], 6–8 (cited by [[w.jian-zhou-enlai]], 618 n.6); [[w.yang-kuisong-sino-soviet-border-clash]], 21–52 (cited by [[w.dikotter-cultural-revolution]], 207 n.2a); Vitaly Bubenin, *Krovavyi Sneg Damanskogo: Sobytiia 1966–1969 gg.* (2004) (cited by [[w.dikotter-cultural-revolution]], 206 n.1). See [[cal.1969-03-02.china-leadership]]. Check: the account (310 n.12) has the Soviets, having reported thirty-one dead in the first clash, hesitate to take back fifty-nine bodies. Check: the book (309) says Russian and Chinese scholars had come by 2001 to something like a consensus that the Chinese began the fighting. Check: the book (309), naming no source, has Sino-Soviet border clashes up 150 percent from late 1964 through March 1969 over the first half of the 1960s.'
