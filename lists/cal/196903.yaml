  - id: cal.1969-03-15.china-leadership
    when: Mar. 15
    date: '1969-03-15'
    thread: china-ninth-congress
    also: [soviet-union, china-border-war, china-mao-cr, china-economy]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Huang Yongsheng, Chen Xilian, Xie Fuzhi: on the world and the Ninth Congress.{1} The US and USSR budgets at highs; China too big to swallow, let an invader in and he is easier to fight; two futures, a rise of world revolution or a third world war that again ends in imperialism''s defeat;{2} China supports revolution but must above all prepare for war, in the third and fourth five-year plans.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 15, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 279–280 (Mar. 15, 1969; the meeting at Mao''s); [[w.macfarquhar-maos-last-revolution]], 312 (Mao''s words at a briefing on the day''s fighting: "Faced with a formidable foe, we had better get mobilized"); [[w.macfarquhar-maos-last-revolution]], 313 (one of Mao''s two warnings of March 1969 to prepare for war in case of a Soviet attack); [[w.mao-zedong-zhuan]], VI, ch. 77 nn.60, 69 (Mar. 15 Mao''s long talk to the members of the Cultural Revolution Group''s liaison meeting on carrying out policy: too many seized and shut up, too few freed; those who stood on the wrong side must be given a way out; Qian Weichang 钱伟长 and Liang Sicheng 梁思成 as models; a history is no matter, a man is a history; investigators at large without aim; why not have a man confess himself; release everyone not guilty of murder, arson, poison or sabotage, a few reactionary slogans are nothing; the ''February counter-current'' not to be mentioned in the report, those who erred in the winter of 1966 and the spring of 1967 not understanding the Red Guards'' attacks; the Congress is to be a united one, men of the ''counter-current'' are to be allowed on the rostrum, n.60; the same record: the report is not done, a few days'' delay in opening does not matter, a month was given to Chen Boda, a fortnight to you, so open on Apr. 1, n.69; the book does not give the entry''s list of those present or its themes). [[w.yang-jisheng-tiandi-fanfu]], II, 608 (Mao on the cleansing of the class ranks: too many seized, too many shut up, too few freed; even traitors, agents and unrepentant capitalist-roaders to be given a way out; release all but those who killed, set fires, poisoned or sabotaged; "for the most part do not arrest, kill none"); [[w.yang-jisheng-tiandi-fanfu]], II, 720 (Mao, "three days" after the 13th by Yang: the report not yet well written, a few days'' delay no matter; a month for Chen Boda, half a month for you; open the congress on Apr. 1); [[w.khoo-collateral-damage]], 66 (Mao to members of the Cultural Revolution Group, Mar. 15: "now we are isolated and no one shows interest in us"); [[w.jian-zhou-enlai]], 619 (at a meeting with Zhou and others on the party congress Mao: "it is advantageous to get mobilized and prepared if we are facing a strong enemy"; he tells Zhou to give an internal speech on preparing for war and launching mobilizations); [[w.chen-yi-nianpu]], 1213 (Mar. 15, 1969; Mao at the Cultural Revolution Group''s caucus: he cannot necessarily hate the men of the "February adverse current"; the report (the Ninth Congress''s political report) not to speak of it; the congress to be one of unity). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 279–280 (Mar. 15, 1969), has the liaison meeting report at Mao''s, and Mao say the Ninth Congress report is not to speak of the "February counter-current", the Congress is to be one of unity, those concerned are full of anger and it is forgivable, and they may sit on the rostrum. Check: the book (313) gives Mao''s two warnings of March 1969 without days. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Li Danhui, "1969 nian Zhong Su bianjie chongtu: Yuanqi he jieguo", in [[w.huishou-wenge-2-vols]], II, 918 (cited by [[w.macfarquhar-maos-last-revolution]], 312 n.21); Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会 (record 谈话记录), Mar. 15, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.60); the record of Mao''s talk with the members of the Cultural Revolution Group''s liaison meeting, Mar. 15, 1969, in the *Wenku* (2006) (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 608 n.68); Mao Zedong, talks with the liaison meeting, Mar. 12 and 15, 1969, as quoted in [[w.xianzhi-mao-zedong-zhuan-1949]], 1538–1539 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 720 n.8); [[w.li-jie-changes-in-chinas-domestic]], 311 (cited by [[w.khoo-collateral-damage]], 66 n.167); Mao''s speech at a Central Leadership Group meeting, Mar. 15, 1969, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 619 n.13b); Mao''s speech at the First Plenum of the Ninth Central Committee, Apr. 28, 1969, in [[w.zedong-jianguo-yilai-mao-zedong]], XIII, 35–41 (cited by [[w.jian-zhou-enlai]], 619 n.13c). Names: Mao Zedong, Chen Yi, Huang Yongsheng, Chen Xilian, Xie Fuzhi.'
