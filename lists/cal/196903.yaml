    when: Mar. 16
    date: '1969-03-16'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai speaks at the second plenary session of the Ninth Congress preparatory meeting on summing up experience and carrying out policy: in nearly three years the Cultural Revolution has done too little of both, and the most important is freeing a batch of cadres; Mao says even of capitalist-roaders one divides in two, not every one is unrepentant, and they are to have the chance to correct. After the enlarged Twelfth Plenum, when the "February counter-current" was criticized, Mao told some of its comrades in Peking to go and stay in factories that he had himself made pilots, to be taught by the working class, and the rest of them, Zhou says, should do so too. Not too many are to be jailed or investigated outside; better to put them together in study classes than in "cowsheds", most being capable of remaking.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 280 (Mar. 16, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
