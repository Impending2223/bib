  - id: cal.1969-03-07.china-leadership
    when: Mar. 7
    date: '1969-03-07'
    thread: china-ninth-congress
    also: [soviet-union, china-border-war, china-mao-cr]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group on the Ninth Congress and the Soviet border clashes: see the provincial leaders before the Congress; Chen Boda''s draft report was due Feb. 20 with no word on the delay; the Group''s three-man committee to be folded into the Group''s meeting, Zhou in charge; he is against writing "milestones" (Lin Biao: to be affirmed, as history made it).{1} That night he circles Zhou''s report summoning 123 provincial and regional chiefs and military leaders, to fly in Mar. 8.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 7, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 7, 1969; the meeting at Mao''s); [[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 7, 1969; the draft telephone notice and list); [[w.mao-zedong-zhuan]], VI, ch. 77 n.67 (Mar. 7, in a talk with the members of the Cultural Revolution Group''s liaison meeting, Mao: for the meeting one thing is chiefly the paper, another the constitution, another the election; a decision was made and not carried out, not carried out and not reported; prepare two ways, a report that can be used and one that cannot; to Chen Boda 陈伯达, who is drafting it: ''I alone'', Mao: ''you always say you will mend your errors, and you do not, for ever''; the book does not give the hall or the afternoon, n.67). [[w.yang-jisheng-tiandi-fanfu]], II, 720 (Mar. 7: still no word; Mao more displeased). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会 (record 谈话记录), Mar. 7, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.67). Names: Mao Zedong, Chen Boda, Lin Biao, Zhou Enlai, Mao Yuanxin.'
    src:
