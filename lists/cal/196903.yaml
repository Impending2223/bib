    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 319–320 (Mar. 3–4). Names: Brezhnev, Gomułka.'
    tags: [name:brezhnev-leonid, name:gomu-ka-w-adys-aw, polity:ussr, polity:poland]
  - id: cal.1969-03-03.china-leadership
    when: Mar. 3
    date: '1969-03-03'
    place: peking
    thread: china-mao-foreign
    also: [soviet-union, china-army, china-foreign]
    c: 'Mao, Peking: initials the Center, State Council, Military Commission and Group''s notice on protest demonstrations against Soviet revisionist armed provocation: no storming, smashing, burning, seizing or beating at Soviet embassy, bodies or people, and a line drawn between the crowds and any foreign embassy ("five nots, one line").{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 3, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 278 (Mar. 4, 1969; the notice as revised by Zhou). Made public: 2013. Names: Mao Zedong.'
    src:
      c: d0cfdd51
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Mar. 3, 1969: 1'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 278: 1'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-03.china-leadership-2
    when: Mar. 3
    date: '1969-03-03'
    place: peking
    thread: china-ninth-congress
    also: [china-mao-cr]
    c: 'Mao, Hall 118, evening, with the Cultural Revolution Group on preparing the Ninth Congress: opening Mar. 15, ten days;{1} after it no Group, the Standing Committee instead;{2} to Chen Boda for the delay of the political report, and to Lin Biao: "eat your own food".{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 3, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 277 (Mar. 3, 1969; the letter and the evening meeting); [[w.macfarquhar-maos-last-revolution]], 296 (in March, discussing the Ninth Congress documents, Mao tells some of the Group that with the Cultural Revolution over there is no need for the Group; the Standing Committee will take its place); [[w.mao-zedong-zhuan]], VI, ch. 77 nn.66, 74 (Mar. 3, in a talk with the members of the Cultural Revolution Group''s liaison meeting, Mao, angry that the report promised for Feb. 20 has not come and no reason is given: ''the meeting fixed it and one man (Chen Boda) has put the time back'', n.66; in the same talk, about the signing of a document: do not add the Cultural Revolution Group, it is for the Cultural Revolution, which is about to end, use the Standing Committee, n.74, repeated in ch. 78 n.1; the book''s first plain word that the Cultural Revolution is coming to an end; the book does not give the opening day or Lin Biao''s ''eat your own food''). [[w.yang-jisheng-tiandi-fanfu]], II, 714 (the congress for Mar. 15, about ten days; no Cultural Revolution Group after it: "use the Standing Committee"); [[w.yang-jisheng-tiandi-fanfu]], II, 720 (Mar. 3: still no word of the report from Chen Boda; Mao angry). Check: the book (296) gives March 1969 without a day; taken here as this meeting. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1556 (cited by [[w.macfarquhar-maos-last-revolution]], 296 n.64); Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会 (record 谈话记录), Mar. 3, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.66). See [[cal.1969-03-03.china-leadership]]. Made public: 2013. Names: Mao Zedong, Chen Boda, Lin Biao.'
    src:
      c: bae5ae05
      rows:
