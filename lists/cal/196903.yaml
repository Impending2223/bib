  - id: cal.1969-03-21.china-leadership
    when: Mar. 21
    date: '1969-03-21'
    place: peking
    thread: china-ninth-congress
    also: [china-mao-cr]
    c: 'Mao, Peking: the same draft, Parts IV and V: few problems, small changes. Parts II and III need heavy revision or rewriting: too many theses, nearly a compendium; merge them, cut repetition, no stages, and none of the Cultural Revolution Group''s names.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Mar.–31, 1969; [[w.jianguo-yilai-mao-zedong]], XIX, 404, 408–409 (Mar. 21, 1969; Mao''s note on Parts IV and V of the draft sent the evening of Mar. 21 (Parts II and III had been sent before); parts I, IV and V have few problems; parts II and III need heavy revision or rewriting, with too many theses, near a compendium; they may be merged, the repetition cut, no stages described, and not one name of a member of the Group mentioned). Made public: 2013. To check: Zhang Chunqiao and Yao Wenyuan, draft of Parts IV and V of the political report to the Ninth Congress, sent to Mao the evening of Mar. 21, 1969 (Parts II and III had been sent earlier) (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 409 n.1). Names: Mao Zedong, Zhang Chunqiao, Yao Wenyuan.'
    src:
