    gloss:
      title: Estimates
      text:
        - 'Friedman, from UN statistics: $44.6 billion in aid from the Western countries, 1959 through 1967, and nearly $10 billion more from the socialist world ([[w.friedman-shadow-cold-war]], 181, citing V. G. Solodovnikov, Narody Azii i Afriki 5 (1971), 6–9).'
        - 'Friedman: average annual per capita GDP growth in sub-Saharan Africa 1.3 percent over the 1960s; food production in Africa up 2 percent a year, population 2.5 percent ([[w.friedman-shadow-cold-war]], 181, citing [[w.meredith-fate-of-africa]], 276–81).'
        - 'Friedman: labor productivity growing 3.8 percent a year in the West, 1953 to 1967, 2.65 percent in the developing countries ([[w.friedman-shadow-cold-war]], 182, citing A. I. Dinkevich, Narody Azii i Afriki 1 (1971), 3–16).'
