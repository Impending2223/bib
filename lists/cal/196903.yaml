    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Mar.–31, 1969; [[w.jianguo-yilai-mao-zedong]], XIX, 404, 409–410 (Mar. 25, 1969; Mao''s note ''Read once, with a few changes, in the main usable; it should still be cut down and the empty words and needless adjectives struck; Lin Biao to decide'' on the first revised draft sent Mar. 25; n.2 lists four further changes: he strikes ''epoch-making'' and ''brilliant'' before ''On the correct handling of contradictions among the people'', ''and Kosygin'' after ''from Khrushchev to Brezhnev'', ''biggest'' in ''the biggest handful in the Party ... led by Liu Shaoqi'', and makes ''the true face of Liu Shaoqi''s counter-revolution'' ''the true face of Liu Shaoqi as a historic counter-revolutionary''). Made public: 2013. Names: Mao Zedong, Zhang Chunqiao, Yao Wenyuan, Lin Biao.'
