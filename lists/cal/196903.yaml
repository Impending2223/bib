  - id: cal.1969-03-16.china-leadership-2
    when: Mar. 16
    date: '1969-03-16'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai speaks at the second plenary session of the Ninth Congress preparatory meeting on summing up experience and carrying out policy: in nearly three years the Cultural Revolution has done too little of both, and the most important is freeing a batch of cadres; Mao says even of capitalist-roaders one divides in two, not every one is unrepentant, and they are to have the chance to correct. After the enlarged Twelfth Plenum, when the "February counter-current" was criticized, Mao told some of its comrades in Peking to go and stay in factories that he had himself made pilots, to be taught by the working class, and the rest of them, Zhou says, should do so too. Not too many are to be jailed or investigated outside; better to put them together in study classes than in "cowsheds", most being capable of remaking.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 280 (Mar. 16, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-03-17.china-leadership
    when: Mar. 17
    date: '1969-03-17'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai revises the "Outline of the 1969 national economic plan (draft)". In the health section he adds "with Shanghai as centre, to reorganize the prevention and treatment of schistosomiasis in twelve southern provinces and cities"; he strikes from "clear away the remaining poison of a handful of capitalist-roaders" the names of Deng, Tao, Peng, He, Peng, Luo, Lu, Yang, Tan, Bo and An (Deng Xiaoping, Tao Zhu, Peng Dehuai, He Long, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun, Tan Zhenlin, Bo Yibo, An Ziwen); and in "grasp revolution, press production hard, raise a new high tide of struggle-criticism-reform and of farm and industrial output" he changes "struggle-criticism-reform" to "war preparation".
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 280 (Mar. 17, 1969). Made public: 2020. Names: Zhou Enlai, Deng Xiaoping, Tao Zhu, Peng Dehuai, He Long, Peng Zhen, Luo Ruiqing, Lu Dingyi, Tan Zhenlin, Bo Yibo.'
    tags: [polity:prc, name:zhou-enlai, name:deng-xiaoping, name:tao-zhu, name:peng-dehuai, name:he-long, name:peng-zhen, name:luo-ruiqing, name:lu-dingyi, name:tan-zhenlin, name:bo-yibo, vis:only:prc]
