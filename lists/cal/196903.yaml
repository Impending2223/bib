  - id: cal.1969-03-16.china-leadership
    when: Mar. 16
    date: '1969-03-16'
    place: peking
    thread: china-ninth-congress
    also: [china-mao-cr]
    c: 'Mao, Peking: Zhang Chunqiao and Yao Wenyuan''s draft of the Ninth Congress political report, Part I: read once, well written, small changes only.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Mar.–31, 1969; [[w.jianguo-yilai-mao-zedong]], XIX, 404, 408–412 (Mar. 16, 1969; Mao''s note ''Read once; well written; only changes of single words and phrases needed'' on Part I of the draft sent by Zhang Chunqiao and Yao Wenyuan Mar. 16 (the report Lin Biao read to the Ninth Congress Apr. 1, adopted Apr. 14, printed Apr. 28); n.1 gives the eight parts of the report as delivered); [[w.macfarquhar-maos-last-revolution]], 289 (Mao begins seeing portions of the Zhang–Yao draft Mar. 16 and revises it several times, into the congress); [[w.mao-zedong-zhuan]], VI, ch. 77 n.62 (from Mar. 16 Zhang Chunqiao and Yao Wenyuan send the draft report in batches for review; Mao changes it many times and finishes on Mar. 31, adding on that last day, the day before the opening, one sentence: to those who have progressed a little and begun to wake, help must go on from the standpoint of unity, n.62; the book does not say that Part I was read once or well written). [[w.teiwes-tragedy-of-lin-biao]], 106–107 (Mao has Zhang, Yao and Kang Sheng prepare their own draft; they finish it in a week and send it to him). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 77). To check: Zhang Chunqiao and Yao Wenyuan, draft of Part I of the political report to the Ninth Congress (Zai Zhongguo Gongchandang di jiu ci quanguo daibiao dahui shang de baogao 在中国共产党第九次全国代表大会上的报告), sent to Mao Mar. 16, 1969; delivered by Lin Biao Apr. 1, adopted Apr. 14, printed in the Renmin ribao Apr. 28 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 408 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], XIII, 11–18 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.24); [[w.nianyi-da-dongluande-niandai]], 387 (cited by [[w.teiwes-tragedy-of-lin-biao]], 107 n.6a); [[w.ye-yonglie-chen-boda]], 458–459 (cited by [[w.teiwes-tragedy-of-lin-biao]], 107 n.6b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 107 n.6c); [[w.yunsheng-maojiawan-jishi]], 210–212 (cited by [[w.teiwes-tragedy-of-lin-biao]], 107 n.6d). Names: Mao Zedong, Zhang Chunqiao, Yao Wenyuan.'
