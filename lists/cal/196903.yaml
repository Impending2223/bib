    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying: on the border clashes and the Congress. "Ease a little; we are isolated, nobody pays attention." The Congress to open Apr. 1: three items, the political report, the constitution, the election of a Central Committee; no Group names in the report, only his and Liu Shaoqi''s; separate Deng Xiaoping from Liu.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 22, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 281 (Mar. 22, 1969; the meeting and its attendants). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 281 (Mar. 22, 1969), has Mao at this meeting repeating that the report will not speak of the "February counter-current", and saying that to attack Old Marshal Chen is to attack the Premier, and that Chen is still guarding the road. See [[cal.1969-03-22.china-leadership]]. Made public: 2013. Names: Mao Zedong, Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Liu Shaoqi, Deng Xiaoping.'
