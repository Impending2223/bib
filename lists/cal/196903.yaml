    c: 'The Chinese embassy in the Soviet Union''s note to the Soviet Foreign Ministry: on the afternoon of the 10th, as the embassy''s driver was out on duty, a gang of Soviet thugs forced open the car doors, burst in and carried off letters and papers. The embassy protests strongly and demands severe punishment of the culprits, the return of the papers, and compensation for all the embassy''s losses.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 211 (Mar. 11, 1969).'
