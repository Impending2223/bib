    also: [china-border-war]
    follows:
      - cal.1969-03-02.china-leadership-5
    c: 'Peng Dehuai 彭德怀, in the agony of the interrogations, is shaken by the news of the bloody clash on Zhenbao Island 珍宝岛: Khrushchev 赫鲁晓夫 was a revisionist who betrayed Marxism, and the Soviet revisionist renegade clique 苏修叛徒集团 has openly provoked an armed clash on the border; it must be struck back firmly and our territory defended. And: he can still lead troops; he dreams of fighting; Chairman Mao 毛主席 still needs him.'
    n: '[[w.peng-dehuai-nianpu]], 821. Made public: 1998. Names: Peng Dehuai, Khrushchev, Mao Zedong. Check: the day: the nianpu has *Renmin ribao* 人民日报 issue the news of the protest Mar. 2, the calendar has it print the note Mar. 3 ([[cal.1969-03-02.china-leadership]]).'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai, name:khrushchev-nikita-s, name:mao-zedong]
