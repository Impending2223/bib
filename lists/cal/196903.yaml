        - 'w.zhou-enlai-nianpu-1949-2020 III, 278: 2'
        - 'w.mao-zedong-zhuan VI, ch. 77 n.67: ?'
        - 'w.yang-jisheng-tiandi-fanfu II, 720: ?'
