    c: 'Mao, Peking: Zhou Enlai''s plan to consult the presidium''s preliminary members and army heads and to name Xu Haidong a delegate and presidium member: agreed.{1} For the opening session the platform not too thin; wants Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Chen Yun among those there.{2} The presidium list, 175, becomes 176 with Xu.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 31, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 283 (Mar. 31, 1969; the letter on Xu Haidong and Mao''s reply); [[w.jianguo-yilai-mao-zedong]], XIX, 414–415 (Mar. 31, 1969; Mao''s note ''Agreed. The platform at tomorrow''s opening should not be too thin; Chen Boda, Kang Sheng, Old Dong, Bocheng, Zhu De, Chen Yun and a few others should be on it; please consider and decide'' on Zhou''s request of 9 p.m. Mar. 31; the six all sat on the platform Apr. 1); [[w.mao-zedong-zhuan]], VI, ch. 77 n.73 (Mar. 31 Mao writes on Zhou Enlai''s report on Xu Haidong 徐海东 joining the presidium of the Congress: ''agreed; tomorrow''s opening session should not have too few on the rostrum, there should be Boda, Kang Sheng, old Dong, Bocheng, Zhu De, Chen Yun and a few more, please consider and decide''; the book does not give the presidium''s numbers or the plan to consult the army heads, n.73). [[w.chen-yun-nianpu-xiuding]], III, 167–168 (Mar. 31: Mao''s minute on Zhou Enlai''s report on the make-up of the Ninth Congress''s presidium: "Agreed. At tomorrow''s opening there should not be too few on the platform; Boda, Kang Sheng, Old Dong, Bocheng, Zhu De, Chen Yun and a few others should be on it; please consider and decide"); [[w.zhu-de-nianpu-xinbian]], III, 1968 (Mar. 31, 1969; Mao Zedong 毛泽东, minuting Zhou Enlai''s 周恩来 request on the forming of the Ninth Congress 中共九大''s presidium: the rostrum at the opening should have Dong Biwu 董必武, Liu Bocheng 刘伯承, Zhu De 朱德 and Chen Yun 陈云). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Zhou Enlai, request for instructions of 9 p.m. Mar. 31, 1969 to Mao Zedong: that Xu Haidong, agreed that evening as a delegate with the presidium''s preliminary members and the main army heads, also join the presidium of the Ninth Congress (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 414 n.1); Mao Zedong 毛泽东, comment on Zhou Enlai''s 周恩来 report on Xu Haidong 徐海东 joining the presidium of the Ninth Congress (manuscript 手稿), Mar. 31, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.73). Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Xu Haidong, Chen Yun.'
