    c: 'Zhou Enlai receives Albania''s ambassador, Robo (as the nianpu writes it), and its counselor, Agolli, on Agolli''s having driven drunk after a Chinese banquet and killed a Chinese worker: the fault is China''s, he himself did not take hold of it and is responsible;{1} the Protocol Department is to study a change of rules, no Maotai at formal banquets, only wine, one bottle a table, none at informal dinners.{2} Of his own lesson in drinking: he gave up drink in 1965 after thirty years, having learned of Maotai crossing the Maotai river in 1935; much drinking harms the body and brings political mistakes.{3}'
