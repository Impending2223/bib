  - id: cal.1969-03-24.china-leadership
    when: Mar. 24
    date: '1969-03-24'
    thread: china-border-war
    also: [india-and-china-cultural-revolution, china-zhou, china-agriculture, china-economy]
    c: 'Zhou Enlai sums up at the close of the national planning forum: the 1969 plan and the Third Five-Year Plan should rest on the strategic line "prepare for war, prepare against famine, for the people", and on "grasp revolution, promote production, work and war preparation"; plans must be realistic, with the difficulties set out, targets realistic and revised if inexact or unachievable; quality in production and construction to be raised. In farming: grain output up for war and famine preparedness, reserves up, "grain stored with the people"; above all industry''s support of agriculture must be real, and the 1.6 million tons of steel set for farming this year must be allotted. Each county is to draw up its own farm plan from below for 1970. Light industry''s production, needs, supply and transport are to be joined; goods cannot be shared out evenly, and removing the town-country gap is gradual and not to be levelled by artifice. Family planning is to be urged and the contraceptive made easy to use. A change of ownership is to be decided by the case, not by mechanization alone, nor many shifted at once. Waste: China''s people are many, the waste of men the greatest, so organs are to be cut and men sent down; the printing of Mao''s works and the making of Mao badges must follow thrift in revolution; some in the cities have a hundred badges and many copies of Mao''s works; spreading Mao Zedong Thought must be effective, not formal; the badges grow larger, the Ministry of Materials allotted 5,000 tons of aluminium and is to be ordered to take it back, and a notice is to ban badges as gifts and offerings and factory contests in making them, "a red ocean".'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 281–282 (Mar. 24, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
