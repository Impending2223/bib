  - id: cal.1969-03-21.china-leadership-2
    when: Mar. 21
    date: '1969-03-21'
    thread: china-border-war
    also: [soviet-union, china-zhou-foreign, china-army]
    c: Zhou Enlai calls Huang Yongsheng, Wu Faxian, Wen Yucheng, Chen Xilian and the General Staff Operations Department's people and, in view of the likelihood that Soviet troops will seize Zhenbao, settles to strengthen forces on China's bank, deploy in strength, wait at ease and prepare to strike after the enemy has.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 281 (Mar. 21, 1969). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Wu Faxian, Chen Xilian, Wen Yucheng.'
    tags: [polity:prc, name:zhou-enlai, name:huang-yongsheng, name:wu-faxian, name:chen-xilian, vis:only:prc, name:wen-yucheng]
  - id: cal.1969-03-21.china-leadership-3
    when: Mar. 21
    date: '1969-03-21'
    thread: china-zhou-foreign
    also: [soviet-union, china-foreign]
    c: 'Zhou Enlai, on Kosygin''s request by carrier telephone to speak with Mao and Zhou, calls the Foreign Ministry''s Ji Pengfei, Qiao Guanhua, Ma Wenbo and Li Lianqing and settles on a memorandum in reply to the Soviet chargé: in the present relations of the two countries contact by telephone is no longer suitable, and if the Soviet government has anything to say it is to put it formally to the Chinese government through diplomatic channels.{1}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 281 (Mar. 21, 1969); [[w.khoo-collateral-damage]], 56 (Kosygin, the night of Mar. 21, by a separate Foreign Ministry line; Mao to have the chargé told to use the diplomatic channels); [[w.jian-zhou-enlai]], 619 (at a Foreign Ministry meeting "the next morning" Zhou rebukes the operator and praises Li; no telephone talk with Kosygin: if "the Soviets had something to say," they should "formally raise it through diplomatic channels"). Made public: 2020. To check: [[w.lewis-imagined-enemies]], 50 (cited by [[w.khoo-collateral-damage]], 56 nn.82–83); [[w.li-lianqing-da-waijiaojia-zhou-enlai]], VI, 138 (cited by [[w.jian-zhou-enlai]], 619 n.11a). Names: Zhou Enlai, Mao Zedong, Ji Pengfei, Qiao Guanhua.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc, name:ji-pengfei, name:qiao-guanhua]
    variants:
      - unit: '1'
        witness: w.jian-zhou-enlai
        reads: Zhou settles the answer at a Foreign Ministry meeting the morning after Kosygin's call, Mar. 22
        at: '619'
  - id: cal.1969-03-21.soviet-union
    when: Mar. 21
    date: '1969-03-21'
    thread: soviet-union
