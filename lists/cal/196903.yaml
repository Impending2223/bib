    n: '[[w.jian-zhou-enlai]], 619; [[w.liu-jixian-ye-jianying-nianpu]], II, 982 (Mar. 29, 1969; Ye Jianying 叶剑英, from the forum''s discussions, draws up the report "Looking at a Zhenbao tree from the world''s forest" 《从世界的森林看一棵珍宝树》; checked by Chen Yi 陈毅, Xu Xiangqian 徐向前 and Nie Rongzhen 聂荣臻, it goes to Mao and the Center under the four names: the causes, aims and course of the Soviet incursion on Zhenbao Island 珍宝岛, the American and Soviet bids for world hegemony and their contradictions with other countries; proposals on the militia, training and military production). Made public: 1991 ([[w.xu-xiangqian-zhuan]], the earliest work the note names; not seen). To check: [[w.fan-shuo-ye-jianying-zhuan]], 598–599 (cited by [[w.jian-zhou-enlai]], 619 n.15a); Wei et al., *Nie Rongzhen zhuan* (A biography of Nie Rongzhen), 614 (the book gives no fuller reference), cited by Chen Jian, *Zhou Enlai: A Life* (2024), 619 n.15b (cited by [[w.jian-zhou-enlai]], 619 n.15b); [[w.xu-xiangqian-zhuan]], 541–542 (cited by [[w.jian-zhou-enlai]], 619 n.15c); [[w.zheng-qian-war-preparations-around-the-ninth]], 211 (cited by [[w.jian-zhou-enlai]], 619 n.15d). See [[cal.1969-03-15.china-leadership-3]].'
