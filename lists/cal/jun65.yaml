# Cal. LXI June 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXI
entries:
  - id: cal.1965-06-01.economy
    when: June 1
    date: '1965-06-01'
    thread: economy
    c: 'Martin, at Columbia''s commencement luncheon, "Does Monetary History Repeat Itself?": "disquieting similarities between our present prosperity and the fabulous twenties."'
    n: '[Address before the Alumni Federation of Columbia University](https://fraser.stlouisfed.org/title/448/item/7898) (June 1, 1965) (FRASER). Bremner, *Chairman of the Fed*; Meltzer, *A History of the Federal Reserve* (K–J Adm. II.B). See [[cal.1964-11-23.economy]]. Names: Martin (K–J Adm. III.H).'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1965-06-01.latin-america
    when: June 1–2
    date: '1965-06-01'
    thread: latin-america
    c: Some 2,000 Marines ordered out of the Dominican Republic, June 1, on the advice of the Inter-American force's Brazilian commander and Palmer, his deputy. June 2, the OAS foreign ministers name an Ad Hoc Committee, Bunker with the delegates of Brazil and El Salvador, to find a settlement, and name the force the Inter-American Peace Force.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1031) (June 1, 1965). FRUS 1964–68, XXXII, docs. [58](https://history.state.gov/historicaldocuments/frus1964-68v32/d58), [85](https://history.state.gov/historicaldocuments/frus1964-68v32/d85), [103](https://history.state.gov/historicaldocuments/frus1964-68v32/d103). Schaffer, *Ellsworth Bunker* (Viet. II.H.1). See [[cal.1965-05-15.latin-america]]. Names: Bunker (1968 list III.F).'
    tags: [name:johnson-lyndon-b, name:palmer-bruce-jr, name:bunker-ellsworth]
  - id: cal.1965-06-02.opinion
    when: June 2
    date: '1965-06-02'
    thread: opinion
    also: [latin-america]
    c: 'Gallup, May 13–18: Johnson''s sending troops into the Dominican Republic: approve 76 percent, disapprove 17. The troops likely to stay a year or two, 41; out soon, 24.'
    n: '*The Gallup Poll*, III, 1942–43 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-03.space
    when: June 3–7
    date: '1965-06-03'
    thread: space
    c: 'Gemini 4: McDivitt and White, four days in orbit. June 3, White outside the capsule on a tether some 23 minutes, the first American to walk in space. The first flight run from the new control center at Houston. Down in the Atlantic June 7.'
    n: '[Telephone Conversation Between the President and Astronauts James McDivitt and Edward White](https://www.presidency.ucsb.edu/documents/telephone-conversation-between-the-president-and-astronauts-james-mcdivitt-and-edward) (June 7, 1965); [Remarks in Houston at the NASA Manned Spacecraft Center](https://www.presidency.ucsb.edu/documents/remarks-houston-the-nasa-manned-spacecraft-center) (June 11, 1965). McDougall, *...the Heavens and the Earth*; Siddiqi, *Challenge to Apollo* (K–J Adm. II.B). See [[cal.1964-07-31.space]]. Names: McDivitt, White (K–J Cong. III.K).'
    tags: [name:johnson-lyndon-b, name:mcdivitt-james-a, name:white-edward-h-ii]
  - id: cal.1965-06-03.economy
    when: June 3
    date: '1965-06-03'
    thread: economy
    c: 'Coinage message. Silver out of the dime and quarter: faces of the nickel''s copper-nickel on a copper core. The half dollar from 90 percent silver to 40. The Treasury to use more than 300 million ounces of silver for coins this year, more than the free world mines. Senate passes the Coinage Act June 24, [74–9](https://voteview.com/rollcall/RS0890130).'
    n: '[Special Message to the Congress Proposing Changes in the Coinage System](https://www.presidency.ucsb.edu/documents/special-message-the-congress-proposing-changes-the-coinage-system) (June 3, 1965). [111 Cong. Rec., Senate, June 24, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-3-1.pdf). See [[cal.1965-05-17.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-04.civil-rights-the-executive
    when: June 4
    date: '1965-06-04'
    thread: civil-rights-the-executive
    also: [welfare]
    c: Howard University commencement, "To Fulfill These Rights." "Freedom is not enough." "Not just equality as a right and a theory but equality as a fact and equality as a result." The breakdown of the Negro family. A White House conference in the fall under that title. Drafted by Goodwin from Moynihan's report.
    n: '[Commencement Address at Howard University: "To Fulfill These Rights"](https://www.presidency.ucsb.edu/documents/commencement-address-howard-university-fulfill-these-rights) (June 4, 1965). Recording (K–J Adm. II.I). Office of Policy Planning and Research, *The Negro Family* (K–J Adm. II.H.3). Lee Rainwater & William L. Yancey, *The Moynihan Report and the Politics of Controversy* (1967). Kotz, *Judgment Days*; Graham, *The Civil Rights Era* (K–J Adm. II.C). See [[cal.1965-03-15.voting-rights]]. Names: Goodwin (K–J Adm. III.B); Moynihan (Adm. III.B).'
    tags: [name:johnson-lyndon-b, name:goodwin-richard-n, name:moynihan-daniel-patrick]
  - id: cal.1965-06-07.court
    when: June 7
    date: '1965-06-07'
    thread: court
    also: [health]
    c: '*Griswold v. Connecticut*, [381 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381479/usrep381479.pdf): Connecticut''s ban on the use of contraceptives void as applied to married couples. Douglas for the Court, 7–2: "specific guarantees in the Bill of Rights have penumbras" that create "zones of privacy." Goldberg, with Warren and Brennan, on the Ninth Amendment; Harlan and White concurring. Black and Stewart dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). David J. Garrow, *Liberty and Sexuality: The Right to Privacy and the Making of Roe v. Wade* (1994). Powe, *The Warren Court and American Politics*; Kalman, *The Long Reach of the Sixties* (K–J Cong. II.G). See [[cal.1961-06-19.court]]. Names: Douglas, Goldberg, Warren, Brennan, Harlan, White, Black, Stewart (K–J Cong. III.G).'
    tags: [name:douglas-william-o, name:goldberg-arthur-j, name:warren-earl, name:brennan-william-j-jr, name:harlan-john-marshall, name:white-byron-r, name:black-hugo-l, name:stewart-potter]
  - id: cal.1965-06-07.vietnam
    when: June 7
    date: '1965-06-07'
    thread: vietnam
    c: 'Westmoreland to the Joint Chiefs: the war "moving to a higher level"; North Vietnamese units in the South; the South''s army cannot hold without American troops. He asks the rest of the 3d Marine Division, the Army''s airmobile division for the highlands, a Korean division, the 173d kept on: with what is there, the forty-four battalions. Sharp concurs, June 7 and 11.'
    n: '[FRUS 1964–68, II, doc. 337](https://history.state.gov/historicaldocuments/frus1964-68v02/d337); [FRUS 1964–68, III, doc. 1](https://history.state.gov/historicaldocuments/frus1964-68v03/d1). *The Pentagon Papers* (K–J Adm. II.H.3). Berman, *Planning a Tragedy*; VanDeMark, *Into the Quagmire*; Khong, *Analogies at War* (Viet. II.C.3). Barrett, *Uncertain Warriors* (Viet. II.C.1). Kaiser, *American Tragedy* (Viet. II.B.8). Logevall, *Choosing War* (K–J Adm. II.D). Carland, *Combat Operations: Stemming the Tide* (Viet. II.I.3). Westmoreland, *A Soldier Reports* (Viet. II.H.2). See [[cal.1965-03-08.vietnam]]. Names: Westmoreland, Sharp (Viet. III.D).'
    tags: [name:westmoreland-william, name:sharp-u-s-grant]
  - id: cal.1965-06-08.vietnam
    when: June 8–9
    date: '1965-06-08'
    thread: vietnam
    c: 'McCloskey, for the State Department: American troops "would be available for combat support together with the Vietnamese forces as and when necessary." Westmoreland''s authority confirmed to him June 5. June 9, the White House: no change in mission; the troops guard bases, and Westmoreland may use them for Vietnamese forces "faced with aggressive attack" when no other reserves are available.'
    n: '[FRUS 1964–68, II, doc. 339](https://history.state.gov/historicaldocuments/frus1964-68v02/d339). Hammond, *Public Affairs* (Viet. II.I.3). See [[cal.1965-06-07.vietnam]]. Names: Westmoreland (Viet. III.D).'
    tags: [name:mccloskey-robert-j, name:westmoreland-william]
  - id: cal.1965-06-10.states-and-cities
    when: June 10
    date: '1965-06-10'
    thread: states-and-cities
    c: Wagner will not seek a fourth term as mayor of New York. Lindsay, Republican of the 17th District, already a candidate since May 13. Check the date.
    n: 'Cannato, *The Ungovernable City* (Opp. II.C). Buckley, *The Unmaking of a Mayor* (Opp. II.E). Names: Wagner (K–J Cong. III.F); Lindsay (Opp. III.D).'
    tags: [name:wagner-robert-f-jr, name:lindsay-john-v]
  - id: cal.1965-06-11.opinion
    when: June 11
    date: '1965-06-11'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 13–18: the most important problem: Vietnam 23 percent; civil rights 23; threat of war 16; prestige abroad 9; world communism 9; the Dominican Republic 4; cost of living 4.'
    n: '*The Gallup Poll*, III, 1944 (K–J Cong. II.E).'
  - id: cal.1965-06-12.vietnam
    when: June 12–19
    date: '1965-06-12'
    thread: vietnam
    c: 'Saigon. Quát, deadlocked with Chief of State Sửu, hands power back to the generals, June 12. A National Leadership Council of ten generals, Thiệu chairman and chief of state. June 19, Kỳ prime minister. Taylor to Johnson, June 17: "disturbed by the selection of General Ky."'
    n: '[FRUS 1964–68, II, doc. 349](https://history.state.gov/historicaldocuments/frus1964-68v02/d349); FRUS 1964–68, III, docs. [2](https://history.state.gov/historicaldocuments/frus1964-68v03/d2), [5](https://history.state.gov/historicaldocuments/frus1964-68v03/d5). Kahin, *Intervention* (K–J Adm. II.D). Ky, *Twenty Years and Twenty Days* (Viet. II.H.3). See [[cal.1964-10-24.vietnam]]. Names: Thiệu, Kỳ (Viet. III.G); Taylor (Viet. III.A).'
    tags: [name:johnson-lyndon-b, name:phan-huy-quat, name:phan-khac-suu, name:nguyen-van-thieu, name:nguyen-cao-ky, name:taylor-maxwell]
  - id: cal.1965-06-13.opinion
    when: June 13
    date: '1965-06-13'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, May 13–18: a worker in a unionized plant required to join the union: should 43 percent, should not 49; union members 66 and 30. Approve of labor unions, 70. Unions have too much power: agree 57; big business has: agree 54.'
    n: '*The Gallup Poll*, III, 1944 (K–J Cong. II.E).'
  - id: cal.1965-06-15.latin-america
    when: June 15–18
    date: '1965-06-15'
    thread: latin-america
    c: 'Santo Domingo. June 15–16, Caamaño''s forces attack the Inter-American force''s lines; the 82d Airborne pushes into the rebel zone. Check the losses. June 18, the OAS Ad Hoc Committee proposes elections in six to nine months, a provisional government meanwhile, a general amnesty, and arms surrendered to the OAS. Caamaño''s answer, June 23: the force out within a month of the provisional government.'
    n: FRUS 1964–68, XXXII, docs. [109](https://history.state.gov/historicaldocuments/frus1964-68v32/d109), [111](https://history.state.gov/historicaldocuments/frus1964-68v32/d111). See [[cal.1965-06-01.latin-america]].
    tags: [name:caamano-deno-francisco]
  - id: cal.1965-06-15.specials
    when: June 15
    date: '1965-06-15'
    thread: specials
    also: [congress]
    c: South Carolina 2nd, special. Watson, who resigned the seat Feb. 1 after the House Democratic caucus took his seniority for backing Goldwater, re-elected as a Republican, 69.3 to 30.7 over Callison (D).
    n: 'Votes: CQ Guide 6th (2010) 1276. See [[cal.1965-01-02.congress]]. Names: Goldwater (Opp. III.B); Callison (K–J Cong. III.K).'
    tags: [special:1965-06-15-h-SC-2, name:watson-albert-w, name:goldwater-barry-m, name:callison-preston-h]
  - id: cal.1965-06-16.cities-and-housing
    when: June 16
    date: '1965-06-16'
    thread: cities-and-housing
    c: House passes the bill for a Department of Housing and Urban Development, H.R. 6927, [217–184](https://voteview.com/rollcall/RH0890071); recommittal refused, [141–259](https://voteview.com/rollcall/RH0890070).
    n: '[111 Cong. Rec., House, June 16, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-6-1.pdf). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1033) (June 17, 1965). Gelfand, *A Nation of Cities* (K–J Cong. II.B). Pritchett, *Robert Clifton Weaver and the American City* (K–J Adm. II.G.5). See [[cal.1965-01-04.program]].'
  - id: cal.1965-06-16.vietnam
    when: June 16
    date: '1965-06-16'
    thread: vietnam
    c: McNamara announces deployments that bring American ground battalions in Vietnam to thirteen and the forces there to about 70,000.
    n: '[FRUS 1964–68, III, doc. 4](https://history.state.gov/historicaldocuments/frus1964-68v03/d4). Carland, *Combat Operations: Stemming the Tide* (Viet. II.I.3). See [[cal.1965-06-07.vietnam]]. Names: McNamara (Viet. III.A).'
    tags: [name:mcnamara-robert-s]
  - id: cal.1965-06-16.health
    when: June 16
    date: '1965-06-16'
    thread: health
    c: 'Senate passes the Cigarette Labeling Act, S. 559, [72–5](https://voteview.com/rollcall/RS0890119): a health warning on every pack; for three years no federal, State, or local authority to require one in advertising, an amendment for one year refused, [29–49](https://voteview.com/rollcall/RS0890118).'
    n: '[111 Cong. Rec., Senate, June 16, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-6-2.pdf). Brandt, *The Cigarette Century* (K–J Adm. II.B). See [[cal.1964-01-11.health]].'
  - id: cal.1965-06-17.goldwater
    when: June 17
    date: '1965-06-17'
    thread: goldwater
    c: 'Washington. Goldwater announces the Free Society Association, a movement of conservative political education. Kitchel its executive director: 500,000 members expected. June 15, Goldwater will run in 1968 for Hayden''s Senate seat "regardless of who runs."'
    n: 'The Ripon Society, newsletter, July 1965, [p. 1](https://riponsociety.org/wp-content/uploads/2023/12/1965-07_Vol-1_No-5.pdf). Kabaservice, *Rule and Ruin* (Opp. II.A). Goldberg, *Barry Goldwater* (Opp. II.B). See [[cal.1965-01-12.elections-1964]]. Names: Goldwater (Opp. III.B); Kitchel (Opp. III.E); Hayden (K–J Cong. III.A).'
    tags: [name:goldwater-barry-m, name:kitchel-denison, name:hayden-carl]
  - id: cal.1965-06-18.vietnam
    when: June 18
    date: '1965-06-18'
    thread: vietnam
    c: 'First B-52 strike (Arc Light): 27 bombers from Guam on a Viet Cong base area north of Saigon, near Bến Cát. Two collide over the Pacific on the way. Check.'
    n: 'FRUS 1964–68, III, docs. [14](https://history.state.gov/historicaldocuments/frus1964-68v03/d14), [40](https://history.state.gov/historicaldocuments/frus1964-68v03/d40). Schlight, *The United States Air Force in Southeast Asia: The War in South Vietnam: The Years of the Offensive, 1965–1968* (Viet. II.F.6). See [[cal.1965-03-02.vietnam]].'
  - id: cal.1965-06-21.economy
    when: June 21
    date: '1965-06-21'
    thread: economy
    c: 'Excise Tax Reduction Act signed, [79 Stat. 136](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg136.pdf): $1.75 billion off at midnight, $1.75 billion more Jan. 1, 1966; $4.7 billion in all by 1969. House, June 2, [401–6](https://voteview.com/rollcall/RH0890061); Senate, June 15, [84–3](https://voteview.com/rollcall/RS0890116).'
    n: '[Remarks at the Signing of the Excise Tax Reduction Bill](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-excise-tax-reduction-bill) (June 21, 1965); [The President''s Statement to the Cabinet Following Passage of the Excise Tax Reductions](https://www.presidency.ucsb.edu/documents/the-presidents-statement-the-cabinet-following-passage-the-excise-tax-reductions) (June 18, 1965). [111 Cong. Rec., House, June 2, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt9/pdf/GPO-CRECB-1965-pt9-6-2.pdf); [111 Cong. Rec., Senate, June 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-5-1.pdf). See [[cal.1965-05-17.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-23.robert-kennedy
    when: June 23
    date: '1965-06-23'
    thread: robert-kennedy
    also: [testing]
    c: Robert Kennedy in the Senate on the spread of nuclear weapons, "the most vital issue now facing this Nation and the world," not Vietnam, the Dominican Republic, or Berlin. Negotiations now on a nonproliferation treaty; nuclear-free zones; the test ban extended to underground tests; American and Soviet nuclear forces halted and cut back; the IAEA strengthened.
    n: '[111 Cong. Rec. 14566–76 (1965)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-2-2.pdf#page=29). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1965-01-21.testing]]. Names: Robert Kennedy (K–J Adm. III.A).'
    tags: [name:kennedy-robert-f]
  - id: cal.1965-06-25.vietnam
    when: June 25
    date: '1965-06-25'
    thread: vietnam
    c: San Francisco, the twentieth anniversary of the UN Charter. The nations asked "to use all their influence, individually and collectively, to bring to the tables those who seem determined to make war."
    n: '[Address in San Francisco at the 20th Anniversary Commemorative Session of the United Nations](https://www.presidency.ucsb.edu/documents/address-san-francisco-the-20th-anniversary-commemorative-session-the-united-nations) (June 25, 1965). See [[cal.1965-04-07.vietnam]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-27.opinion
    when: June 27
    date: '1965-06-27'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, June 4–9: Republicans'' best candidate for 1968: Nixon 25, Lodge 14, Goldwater 13, Romney 11, Dirksen 7, Scranton 7, Rockefeller 6, Lindsay 5, Taft 3, Reagan 3, Hatfield 2, Percy 1. Independents: Lodge 20, Nixon 14, Romney 12, Goldwater 11, Scranton 9.'
    n: '*The Gallup Poll*, III, 1946 (K–J Cong. II.E). Names: Lodge (K–J Adm. III.E); Dirksen (K–J Cong. III.A); Nixon (Opp. III.E); Goldwater, Hatfield, Percy (Opp. III.B); Lindsay (Opp. III.D); Reagan (Opp. III.F); Romney, Scranton, Rockefeller (Opp. III.H).'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:goldwater-barry-m, name:romney-george-w, name:dirksen-everett, name:scranton-william-w, name:rockefeller-nelson, name:lindsay-john-v, name:taft-robert-jr, name:reagan-ronald, name:hatfield-mark-o, name:percy-charles-h]
  - id: cal.1965-06-30.cities-and-housing
    when: June 30
    date: '1965-06-30'
    thread: cities-and-housing
    c: 'House passes the housing bill, H.R. 7984, [245–169](https://voteview.com/rollcall/RH0890081): rent supplements, limited by amendment to families eligible for public housing, [240–179](https://voteview.com/rollcall/RH0890079); a motion to recommit and strike them lost, [202–208](https://voteview.com/rollcall/RH0890080).'
    n: '[111 Cong. Rec., House, June 30, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-7-1.pdf). [Statement by the President Following Passage of the Housing Bill by the House of Representatives](https://www.presidency.ucsb.edu/documents/statement-the-president-following-passage-the-housing-bill-the-house-representatives) (June 30, 1965). Gelfand, *A Nation of Cities* (K–J Cong. II.B). See [[cal.1965-06-16.cities-and-housing]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-30.india-and-china
    when: June 30
    date: '1965-06-30'
    thread: india-and-china
    c: 'India and Pakistan sign, at New Delhi and Karachi, the agreement ending the fighting in the Rann of Kutch, through Britain''s good offices: a cease-fire, troops withdrawn, the boundary to arbitration. Johnson congratulates Wilson. The same day Washington asks the World Bank to put off the July meeting of Pakistan''s aid consortium; military deliveries to both held up.'
    n: 'FRUS 1964–68, XXV, docs. [137](https://history.state.gov/historicaldocuments/frus1964-68v25/d137), [138](https://history.state.gov/historicaldocuments/frus1964-68v25/d138), [139](https://history.state.gov/historicaldocuments/frus1964-68v25/d139). Robert J. McMahon, *The Cold War on the Periphery: The United States, India, and Pakistan* (1994). See [[cal.1964-05-27.india-and-china]]. Names: Wilson (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:wilson-harold]
