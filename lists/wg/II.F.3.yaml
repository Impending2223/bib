list: wg
section: II.F.3
entries:
  - id: wg.submission-of-recorded-presidential-conversations
    c: '*Submission of Recorded Presidential Conversations to the Committee on the Judiciary of the House of Representatives by President Richard Nixon* (Apr. 30, 1974)'
    n: The edited transcripts, "expletive deleted." Reprinted within days by the *New York Times* and the *Washington Post* as paperbacks.
  - id: wg.grand-jury-report-and-transmittal
    c: Grand jury report and transmittal to the House Judiciary Committee (Mar. 1, 1974)
    n: The "road map." Sealed until 2018; now at the National Archives.
  - id: wg.watergate-special-prosecution-force-report
    c: '*Watergate Special Prosecution Force: Report* (1975)'
  - id: wg.proclamation-no-4311-39-fed
    c: Proclamation No. 4311, 39 Fed. Reg. 32,601 (Sept. 10, 1974)
    n: The pardon, signed Sept. 8, 1974.
  - id: wg.abuse-of-power-the-new
    c: '*Abuse of Power: The New Nixon Tapes* (Stanley I. Kutler ed., 1997)'
    n: Some 200 hours of abuse-of-power tapes released in 1996, transcribed. The standard printed source.
