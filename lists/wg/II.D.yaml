# Wg. II.D Revisionists
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: wg
section: II.D
entries:
  - id: wg.hougan-secret-agenda-watergate
    c: 'Jim Hougan, *Secret Agenda: Watergate, Deep Throat, and the CIA* (1984)'
    n: McCord as a CIA saboteur; the call-girl theory.
  - id: wg.colodny-silent-coup-the
    c: 'Len Colodny & Robert Gettlin, *Silent Coup: The Removal of a President* (1991)'
    n: Dean and Haig as the villains. Litigated for years.
  - id: wg.shepard-real-watergate-scandal
    c: 'Geoff Shepard, *The Real Watergate Scandal: Collusion, Conspiracy, and the Plot That Brought Nixon Down* (2015)'
    n: By a Nixon lawyer. The prosecutors' contacts with Sirica.
  - id: wg.adler-searching-for-the
    c: 'Renata Adler, *Searching for the Real Nixon Scandal: A Last Inference*, [The Atlantic](https://www.theatlantic.com), Dec. 1976'
    n: The money trail abroad. An essay, not a book; listed last because it asks the question the others answer differently.
