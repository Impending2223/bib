# Wg. III.I Others
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: wg
section: III.I
entries:
  - id: wg.who.ford-gerald-r
    s: Ford, Gerald R.
    r: Vice President; President from Aug. 9, 1974
    n: The pardon. Also Opp., Adm., Cong.
  - id: wg.who.goldwater-barry-m
    s: Goldwater, Barry M.
    r: Senator, Arizona
    n: Went to the White House with Scott and Rhodes on Aug. 7, 1974, to count the votes. Also Opp. and Cong.
  - id: wg.who.gray-l-patrick-iii
    s: Gray, L. Patrick, III
    r: Acting FBI director
    n: Burned Hunt's files; his nomination died in the Senate. Also Adm.
  - id: wg.who.helms-richard
    s: Helms, Richard
    r: Director of Central Intelligence to Feb. 1973
    n: The June 23, 1972 meeting with Walters, Haldeman, and Ehrlichman. Also Adm.
  - id: wg.who.oneill-thomas-p-jr
    s: O'Neill, Thomas P., Jr.
    r: Majority Leader
    n: Counted the House for impeachment. Breslin's book (II.A) follows him. Also Cong.
  - id: wg.who.patman-wright
    s: Patman, Wright
    r: Chairman, House Banking
    n: Sought subpoenas on the campaign money in October 1972; his committee voted him down. Also Cong.
  - id: wg.who.rhodes-john-j
    s: Rhodes, John J.
    r: Minority Leader
    n: With Goldwater and Scott, Aug. 7, 1974. Also Opp. and Cong.
  - id: wg.who.scott-hugh
    s: Scott, Hugh D., Jr.
    r: Senate Minority Leader
    n: With Goldwater and Rhodes, Aug. 7, 1974. Also Opp. and Cong.
  - id: wg.who.stennis-john-c
    s: Stennis, John C.
    r: Senator, Mississippi
    n: The proposed verifier of tape summaries in the October 1973 compromise Cox refused. Also Cong.
  - id: wg.who.walters-vernon-a
    s: Walters, Vernon A.
    r: Deputy director, CIA
    n: The June 23 meeting. Also Adm.
  - id: wg.who.wills-frank
    s: Wills, Frank
    r: Security guard, Watergate complex
    n: Found the taped door.
