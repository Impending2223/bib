# Wg. III.A The White House
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: wg
section: III.A
entries:
  - id: wg.who.butterfield-alexander-p
    s: Butterfield, Alexander P.
    r: Former deputy assistant; FAA administrator
    n: 'Disclosed the taping system to committee staff on July 13, 1973, and on television on July 16. Voice: testimony (II.G). Also Adm.'
  - id: wg.who.buzhardt-j-fred
    s: Buzhardt, J. Fred
    r: Special counsel for Watergate
    n: 'Told Sirica of the 18½-minute gap. Voice: tapes.'
  - id: wg.who.chapin-dwight-l
    s: Chapin, Dwight L.
    r: Appointments secretary to 1973
    n: Recruited Segretti. Convicted of perjury. Also Adm.
  - id: wg.who.clawson-ken-w
    s: Clawson, Ken W.
    r: Deputy director of communications
    n: The *Post* reported in October 1972 that he had claimed authorship of the Canuck letter. He denied it.
  - id: wg.who.colson-charles-w
    s: Colson, Charles W.
    r: Special counsel to 1973
    n: 'Pleaded guilty in 1974 to obstruction in the Ellsberg matter. Voice: *Born Again*; tapes. Also Adm.'
  - id: wg.who.dean-john-w-iii
    s: Dean, John W., III
    r: Counsel to the President
    n: 'Voice: testimony (II.G); tapes; memoirs (II.E). Also Adm.'
  - id: wg.who.eisenhower-julie-nixon
    s: Eisenhower, Julie Nixon
    r: The President's daughter
    n: Spoke for him through 1974. Also Adm.
  - id: wg.who.ehrlichman-john-d
    s: Ehrlichman, John D.
    r: Assistant for domestic affairs
    n: Convicted in the cover-up and the Fielding break-in. Also Adm.
  - id: wg.who.haig-alexander-m-jr
    s: Haig, Alexander M., Jr.
    r: Chief of staff from May 1973
    n: Ran the last fifteen months. Also Adm.
  - id: wg.who.haldeman-h-r
    s: Haldeman, H.R.
    r: Chief of staff
    n: 'Convicted in the cover-up. Voice: tapes; *The Ends of Power*. Also Adm.'
  - id: wg.who.nixon-richard-m
    s: Nixon, Richard M.
    r: President
    n: 'Named an unindicted co-conspirator by the grand jury. Voice: the tapes; the addresses (II.G).'
  - id: wg.who.rebozo-charles-g-bebe
    s: Rebozo, Charles G. (Bebe)
    r: Friend
    n: The $100,000 from Howard Hughes, held in a safe-deposit box. Also Adm.
  - id: wg.who.strachan-gordon-c
    s: Strachan, Gordon C.
    r: Haldeman's aide
    n: The link to the Committee's intelligence reports.
  - id: wg.who.woods-rose-mary
    s: Woods, Rose Mary
    r: Personal secretary
    n: 'The reach to the pedal. Voice: court testimony, Nov. 1973. Also Adm.'
  - id: wg.who.young-david-r
    s: Young, David R.
    r: NSC aide; co-director of the Plumbers
  - id: wg.who.ziegler-ronald-l
    s: Ziegler, Ronald L.
    r: Press secretary
    n: '"Inoperative," Apr. 17, 1973. Also Adm.'
