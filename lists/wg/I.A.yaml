# Wg. I.A Fiction
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: wg
section: I.A
entries:
  - id: wg.vonnegut-jailbird
    c: Kurt Vonnegut, *Jailbird* (1979)
    n: Walter F. Starbuck, a minor Watergate conspirator, released from prison. The only major novel with a Watergate convict for hero.
  - id: wg.mallon-watergate-a-novel
    c: 'Thomas Mallon, *Watergate: A Novel* (2012)'
    n: 'Several points of view: Pat Nixon, Fred LaRue, Dorothy Hunt, and Rose Mary Woods among them. The model for voice.'
  - id: wg.trudeau-doonesbury
    c: Garry Trudeau, *Doonesbury* (1973–74)
    n: The Watergate strips. Several papers pulled the one declaring Mitchell guilty. Pulitzer, 1975.
