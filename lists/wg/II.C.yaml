# Wg. II.C The law: prosecution, impeachment, and the Constitution
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: wg
section: II.C
entries:
  - id: wg.berger-impeachment-the-constitutional
    c: 'Raoul Berger, *Impeachment: The Constitutional Problems* (1973)'
    n: The historical case, published the year it was needed.
  - id: wg.black-impeachment-a-handbook
    c: 'Charles L. Black Jr., *Impeachment: A Handbook* (1974)'
    n: Short. Still the book for what counts as an impeachable offense.
  - id: wg.jaworski-right-and-the
    c: 'Leon Jaworski, *The Right and the Power: The Prosecution of Watergate* (1976)'
  - id: wg.doyle-not-above-the
    c: 'James Doyle, *Not Above the Law: The Battles of Watergate Prosecutors Cox and Jaworski* (1977)'
    n: By the prosecutors' press officer.
  - id: wg.ben-veniste-stonewall-the-real
    c: 'Richard Ben-Veniste & George Frampton Jr., *Stonewall: The Real Story of the Watergate Prosecution* (1977)'
    n: By two of the prosecutors.
  - id: wg.sirica-to-set-the
    c: 'John J. Sirica, *To Set the Record Straight: The Break-in, the Tapes, the Conspirators, the Pardon* (1979)'
  - id: wg.gormley-archibald-cox-conscience
    c: 'Ken Gormley, *Archibald Cox: Conscience of a Nation* (1997)'
  - id: wg.wine-banks-watergate-girl-my
    c: 'Jill Wine-Banks, *The Watergate Girl: My Fight for Truth and Justice Against a Criminal President* (2020)'
    n: The prosecutor who cross-examined Rose Mary Woods.
