# Wg. II.F.1 Cases
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: wg
section: II.F.1
entries:
  - id: wg.in-re-grand-jury-subpoena
    c: '*In re Grand Jury Subpoena Duces Tecum Issued to Richard M. Nixon*, [360 F. Supp. 1](https://static.case.law/f-supp/360/case-pdfs/0001-01.pdf) (D.D.C. 1973)'
    n: Sirica orders the tapes produced for his review, Aug. 29, 1973.
  - id: wg.nixon-v-sirica
    c: '*Nixon v. Sirica*, [487 F.2d 700](https://static.case.law/f2d/487/case-pdfs/0700-01.pdf) (D.C. Cir. 1973)'
    n: En banc, affirming. The President's refusal led to the Saturday Night Massacre.
  - id: wg.nader-v-bork
    c: '*Nader v. Bork*, [366 F. Supp. 104](https://static.case.law/f-supp/366/case-pdfs/0104-01.pdf) (D.D.C. 1973)'
    n: Cox's firing held illegal under the Justice Department's own regulation. Moot by then.
  - id: wg.senate-select-committee-on-presidential
    c: '*Senate Select Committee on Presidential Campaign Activities v. Nixon*, [498 F.2d 725](https://static.case.law/f2d/498/case-pdfs/0725-01.pdf) (D.C. Cir. 1974)'
    n: The Ervin Committee loses its subpoena for the tapes.
  - id: wg.united-states-v-liddy
    c: '*United States v. Liddy*, [509 F.2d 428](https://static.case.law/f2d/509/case-pdfs/0428-01.pdf) (D.C. Cir. 1974)'
    n: The break-in convictions affirmed. Sirica's methods reviewed.
  - id: wg.united-states-v-nixon
    c: '*United States v. Nixon*, [418 U.S. 683](https://tile.loc.gov/storage-services/service/ll/usrep/usrep418/usrep418683/usrep418683.pdf) (1974)'
    n: Unanimous. Decided July 24, 1974; the June 23, 1972 tape followed within two weeks.
  - id: wg.united-states-v-haldeman
    c: '*United States v. Haldeman*, [559 F.2d 31](https://static.case.law/f2d/559/case-pdfs/0031-01.pdf) (D.C. Cir. 1976)'
    n: The cover-up trial of Mitchell, Haldeman, Ehrlichman, and Mardian. Mardian's conviction was reversed separately.
  - id: wg.united-states-v-ehrlichman
    c: '*United States v. Ehrlichman*, [546 F.2d 910](https://static.case.law/f2d/546/case-pdfs/0910-01.pdf) (D.C. Cir. 1976)'
    n: The Fielding break-in. No national-security exception.
  - id: wg.united-states-v-barker
    c: '*United States v. Barker*, [546 F.2d 940](https://static.case.law/f2d/546/case-pdfs/0940-01.pdf) (D.C. Cir. 1976)'
    n: The Cuban-American burglars of the Fielding office. Good faith reliance on Hunt. Check.
  - id: wg.nixon-v-warner-communications-inc
    c: '*Nixon v. Warner Communications, Inc.*, [435 U.S. 589](https://tile.loc.gov/storage-services/service/ll/usrep/usrep435/usrep435589/usrep435589.pdf) (1978)'
    n: Copies of the trial tapes for broadcast denied.
