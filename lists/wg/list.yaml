# Wg.: page text and outline. Entries live in the files named by 'file'.
page_title: 'Watergate, 1971–1974: Bibliography'
h1: 'Watergate, 1971–1974: working bibliography'
lede: 'Sources, portrayals, and names for Watergate alone: the operations that led to the break-in, the break-in, the cover-up, the investigations, the tapes, impeachment, resignation, and pardon.'
logic:
  - 'Fourth of four lists. This one is Wg. The others: the Republican opposition, 1961–69 (Opp.); Nixon and his administration (Adm.); and Congress, the nation, and the states, 1969–74 (Cong.). Cross-references give list and section.'
  - 'The rule. This list holds what exists only because of the scandal, and nothing else: the covert operations from the White House and the Committee to Re-elect that led to the break-in (the Plumbers, the Fielding break-in, Gemstone, Segretti''s tricks); the break-in of June 17, 1972; and everything that followed its discovery, from the cover-up to the pardon of September 8, 1974. The Kissinger wiretaps, the Huston Plan, ITT, the milk fund, the President''s taxes, and Agnew are in Adm. even where the investigators took them up. People appear here for their Watergate part; if they had another part, they appear in Adm. or Cong. as well.'
  - Part I lists portrayals, Part II sources, Part III names. Unless a section says otherwise, entries run in chronological order. Where my knowledge is thin, the entry says so. "Check" marks a detail to verify.
sections:
  - id: p1
    num: I.
    title: Portrayals
    logic:
      - 'Two sections: A. Fiction. B. Screen and stage. *Frost/Nixon*, *Secret Honor*, and *Nixon''s Nixon* treat Watergate among other things and are in Adm. I.'
    sections:
      - id: p1a
        num: I.A
        title: Fiction
        logic:
          - Chronological by first publication.
        file: I.A.yaml
      - id: p1b
        num: I.B
        title: Screen and stage
        logic:
          - Dramas and documentaries together. Chronological by release.
        file: I.B.yaml
  - id: p2
    num: II.
    title: Sources
    logic:
      - 'Works and records to draw facts and voices from. Eight sections, from the most digested to the least: A. Narratives and histories. B. The press. C. The law: prosecution, impeachment, and the Constitution. D. Revisionists. E. Memoirs and biographies. F. Documents. G. Recordings. H. Archives. Sections A through D are chronological by first publication.'
    sections:
      - id: p2a
        num: II.A
        title: Narratives and histories
        logic:
          - Start with Kutler for the whole, then Lukas for the operations, then Drew for the months of impeachment.
