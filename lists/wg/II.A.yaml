# Wg. II.A Narratives and histories
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: wg
section: II.A
entries:
  - id: wg.mccarthy-mask-of-state
    c: 'Mary McCarthy, *The Mask of State: Watergate Portraits* (1974)'
    n: The Ervin hearings as a novelist saw the witnesses. Short.
  - id: wg.sussman-great-cover-up
    c: 'Barry Sussman, *The Great Cover-Up: Nixon and the Scandal of Watergate* (1974)'
    n: By the *Post*'s city editor on the story.
  - id: wg.breslin-how-the-good
    c: 'Jimmy Breslin, *How the Good Guys Finally Won: Notes from an Impeachment Summer* (1975)'
    n: O'Neill counting votes in the House. Funny.
  - id: wg.drew-washington-journal-the
    c: 'Elizabeth Drew, *Washington Journal: The Events of 1973–1974* (1975)'
    n: A diary kept for the *New Yorker*. The texture of the months.
  - id: wg.white-breach-of-faith
    c: 'Theodore H. White, *Breach of Faith: The Fall of Richard Nixon* (1975)'
  - id: wg.lukas-nightmare-the-underside
    c: 'J. Anthony Lukas, *Nightmare: The Underside of the Nixon Years* (1976)'
    n: The operations, the Plumbers, and the cover-up in detail. Expanded from his *New York Times Magazine* pieces.
  - id: wg.kutler-wars-of-watergate
    c: 'Stanley I. Kutler, *The Wars of Watergate: The Last Crisis of Richard Nixon* (1990)'
    n: The standard history.
  - id: wg.schudson-watergate-in-american
    c: 'Michael Schudson, *Watergate in American Memory: How We Remember, Forget, and Reconstruct the Past* (1992)'
    n: What the country later believed happened, against what did.
  - id: wg.emery-watergate-the-corruption
    c: 'Fred Emery, *Watergate: The Corruption of American Politics and the Fall of Richard Nixon* (1994)'
    n: Written with the BBC series. Clear.
  - id: wg.olson-watergate-the-presidential
    c: 'Keith W. Olson, *Watergate: The Presidential Scandal That Shook America* (2003)'
    n: Short.
  - id: wg.graff-watergate-a-new
    c: 'Garrett M. Graff, *Watergate: A New History* (2022)'
    n: Long. Uses the tapes and the grand jury material released in 2018.
