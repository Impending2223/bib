    c: Senate Select Committee hearings (May 17–Aug. 7, 1973, and after)
    n: Carried gavel to gavel on public television, replayed at night. The networks rotated daytime coverage.
  - id: wg.john-w-dean-iii-testimony
    c: John W. Dean III, testimony (June 25–29, 1973)
    n: The opening statement ran most of a day.
  - id: wg.alexander-p-butterfield-testimony-july
    c: Alexander P. Butterfield, testimony (July 16, 1973)
