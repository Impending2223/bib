            num: II.J.3
            title: Reports and hearings
            logic:
              - Chronological.
            file: II.J.3.yaml
      - id: p2k
        num: II.K
        title: Recordings
        logic:
          - Neither chamber was televised. The record is the network news, public television, radio, newsreel, and the Congressional Record. Chronological.
        file: II.K.yaml
      - id: p2l
        num: II.L
        title: Archives and reference
        logic:
          - Official record, reference, oral histories and papers, the states and the movement. Alphabetical. Links go to the home page.
        file: II.L.yaml
