# K–J Cong.: page text and outline. Entries live in the files named by 'file'.
page_title: 'Congress, the Nation, and the States, 1961–1969: Bibliography'
h1: 'Congress, the nation, and the states, 1961–1969: working bibliography'
lede: Sources, portrayals, and names for the 87th through 90th Congresses, the elections of 1962, 1964, and 1966, the movements and the backlash, the Warren Court, and the states, 1961–1969.
logic:
  - 'Sixth list in the series. This one is K–J Cong. Its companion is K–J Adm.: Kennedy, Johnson, and their administrations. The calendar (Cal.) points into both. Earlier lists: the 1968 list; Opp.; Adm.; Cong.; Wg. A later list, Viet., holds the war in Vietnam. Cross-references give list and section. Part I lists portrayals, Part II sources, Part III names. Unless a section says otherwise, entries run in chronological order. Where my knowledge is thin, the entry says so. "Check" marks a detail to verify.'
  - Overlaps. Opp. holds the Republican minority, the Goldwater movement, and the Republican governors; they reappear here only where a bill or a vote needs them, marked "Also Opp." The 1968 campaign is in the 1968 list and Opp. The Dallas rule in K–J Adm. applies here.
sections:
  - id: p1
    num: I.
    title: Portrayals
    logic:
      - 'Thin for Congress, as in Opp.; the movements drew more. Three sections: A. Fiction. B. Screen. C. Reportage.'
    sections:
      - id: p1a
        num: I.A
        title: Fiction
        logic:
          - Chronological by first publication.
        file: I.A.yaml
      - id: p1b
        num: I.B
        title: Screen
        logic:
          - Dramas and documentaries. Chronological by release.
        file: I.B.yaml
      - id: p1c
        num: I.C
        title: Reportage
        logic:
          - Chronological.
        file: I.C.yaml
  - id: p2
    num: II.
    title: Sources
    logic:
      - 'Works and records to draw facts and voices from. Twelve sections, from the most digested to the least: A. The institution and the parties. B. The agenda, bill by bill. C. Civil rights in Congress. D. Foreign policy and the war on the Hill. E. The elections. F. The nation. G. The Court. H. The states. I. Memoirs and biographies. J. Documents. K. Recordings. L. Archives and reference. Sections A through H are chronological by first publication.'
    sections:
      - id: p2a
        num: II.A
        title: The institution and the parties
        logic:
          - How Congress worked in these years, and the first reformers' complaints. Start with Polsby and Zelizer, then Bolling and Clark for the view from 1963–65.
        file: II.A.yaml
      - id: p2b
        num: II.B
        title: The agenda, bill by bill
        logic:
          - The New Frontier's stalled bills and the Great Society's passed ones. The executive side is in K–J Adm. II.B; the statutes in II.J.2.
        file: II.B.yaml
      - id: p2c
        num: II.C
        title: Civil rights in Congress
        logic:
          - The bills of 1964, 1965, and 1968, and the southern caucus. Chronological.
        file: II.C.yaml
      - id: p2d
        num: II.D
        title: Foreign policy and the war on the Hill
        logic:
          - The test ban vote, Tonkin, the Fulbright hearings, and the Senate's turn. Chronological.
        file: II.D.yaml
      - id: p2e
        num: II.E
        title: The elections and public opinion
        logic:
          - 1960 as prologue, 1962, 1964, 1966; then the polls and the study of presidential approval. The Republican side of each campaign is in Opp. II.E. The 1962 midterms have no book of their own; the missile crisis swallowed them. Use the CQ Almanac (II.L).
        file: II.E.yaml
      - id: p2f
        num: II.F
        title: The nation
        logic:
          - The movements, the books that moved the agenda, the riots, the backlash. Chronological. The Branch trilogy is in K–J Adm. II.C.
        file: II.F.yaml
      - id: p2g
        num: II.G
        title: The Court
        logic:
          - The Warren Court at full strength, 1962–69, and its critics. Cases are in II.J.1.
        file: II.G.yaml
      - id: p2h
        num: II.H
        title: The states
        logic:
          - Governors, legislatures, the southern resistance, reapportionment, the cities. Chronological. Republican governors are in Opp. II.C and II.F.
        file: II.H.yaml
      - id: p2i
        num: II.I
        title: Memoirs and biographies
        logic:
          - 'Books that preserve a person''s voice. Four groups: 1. The Senate. 2. The House. 3. Governors and mayors. 4. Movements, labor, and the press. Alphabetical by subject within each. Republicans are in Opp. II.G.'
