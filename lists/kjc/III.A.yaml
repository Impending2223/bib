  - id: kjc.who.hayden-carl
    s: Hayden, Carl
    r: Senator, Arizona; President pro tempore; Appropriations chairman
    n: The 1962 quarrel with Cannon over where conferees should meet.
  - id: kjc.who.humphrey-hubert-h
    s: Humphrey, Hubert H.
    r: Senator, Minnesota; Whip, 1961–64
    n: Floor manager of the 1964 act. Also K–J Adm. and the 1968 list.
  - id: kjc.who.long-russell-b
    s: Long, Russell B.
    r: Senator, Louisiana; Whip, 1965–69; Finance chairman from 1966
    n: 'Voice: Mann (II.I.1).'
  - id: kjc.who.mansfield-mike
    s: Mansfield, Mike
    r: Senator, Montana; Majority Leader from 1961
    n: 'Ran the Senate by consent, not by Johnson''s methods. Voice: Oberdorfer (II.I.1); tapes.'
  - id: kjc.who.smathers-george-a
    s: Smathers, George A.
    r: Senator, Florida; Secretary of the Democratic Conference, 1961–66
    n: Kennedy's friend in the Senate.
  - id: kjc.who.dirksen-everett-m-kuchel-thomas
    s: Dirksen, Everett M.; Kuchel, Thomas H.
    r: Minority Leader; Minority Whip
    n: See Opp. III.A.
