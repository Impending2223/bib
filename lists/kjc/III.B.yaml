# K–J Cong. III.B Senate Democrats
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kjc
section: III.B
entries:
  - id: kjc.who.anderson-clinton-p
    s: Anderson, Clinton P.
    r: Senator, New Mexico; Space chairman
    n: 'King–Anderson. Voice: memoir (II.I.1).'
  - id: kjc.who.blakley-william-a
    s: Blakley, William A.
    r: Appointed Senator, Texas, Jan.–June 1961
    n: Held Johnson's seat; lost the runoff to Tower. Cal.
  - id: kjc.who.byrd-harry-f
    s: Byrd, Harry F.
    r: Senator, Virginia; Finance chairman to 1965
    n: Held the tax cut until Johnson's budget came in under $100 billion.
  - id: kjc.who.church-frank
    s: Church, Frank
    r: Senator, Idaho
    n: Also Cong.
  - id: kjc.who.clark-joseph-s
    s: Clark, Joseph S.
    r: Senator, Pennsylvania
    n: 'Voice: II.A.'
  - id: kjc.who.dodd-thomas-j
    s: Dodd, Thomas J.
    r: Senator, Connecticut
    n: Censured June 23, 1967.
  - id: kjc.who.douglas-paul-h
    s: Douglas, Paul H.
    r: Senator, Illinois, to 1967
    n: 'Area redevelopment; truth in lending. Lost to Percy, 1966. Voice: memoir (II.I.1).'
  - id: kjc.who.eastland-james-o
    s: Eastland, James O.
    r: Senator, Mississippi; Judiciary chairman
    n: 'Civil rights bills went to his committee to die. Voice: Annis (II.I.1); tapes.'
  - id: kjc.who.ervin-sam-j-jr
    s: Ervin, Sam J., Jr.
    r: Senator, North Carolina
    n: The southern caucus's constitutional lawyer. Also Cong. and Wg.
  - id: kjc.who.fulbright-j-william
    s: Fulbright, J. William
    r: Senator, Arkansas; Foreign Relations chairman
    n: 'Opposed the Bay of Pigs at the Apr. 4, 1961 meeting; managed Tonkin; held the 1966 hearings. Voice: II.D; Woods (II.I.1). Also Cong.'
  - id: kjc.who.gore-albert-sr
    s: Gore, Albert, Sr.
    r: Senator, Tennessee
    n: Also Cong.
  - id: kjc.who.gruening-ernest
    s: Gruening, Ernest
    r: Senator, Alaska, to 1969
    n: 'Voted against Tonkin. Voice: memoir (II.I.1).'
  - id: kjc.who.hart-philip-a
    s: Hart, Philip A.
    r: Senator, Michigan
    n: 'Floor manager of the Voting Rights Act. Voice: O''Brien (II.I.1).'
  - id: kjc.who.hill-lister
    s: Hill, Lister
    r: Senator, Alabama; Labor and Public Welfare chairman
    n: Nearly beaten by a Republican in 1962. See Martin in Opp. III.I.
  - id: kjc.who.jackson-henry-m
    s: Jackson, Henry M.
    r: Senator, Washington
    n: Also Cong.
  - id: kjc.who.kefauver-estes
    s: Kefauver, Estes
    r: Senator, Tennessee
    n: The 1962 drug amendments after thalidomide. Died Aug. 10, 1963.
  - id: kjc.who.kennedy-edward-m
    s: Kennedy, Edward M.
    r: Senator, Massachusetts, from Nov. 1962
    n: Also Cong. and the 1968 list.
  - id: kjc.who.kennedy-robert-f
    s: Kennedy, Robert F.
    r: Senator, New York, 1965–68
    n: Also K–J Adm. and the 1968 list.
  - id: kjc.who.kerr-robert-s
    s: Kerr, Robert S.
    r: Senator, Oklahoma
    n: The uncrowned king of the Senate in 1961–62; Kerr–Mills. Died Jan. 1, 1963.
  - id: kjc.who.magnuson-warren-g
    s: Magnuson, Warren G.
    r: Senator, Washington; Commerce chairman
    n: Title II of the 1964 act went through his committee; the consumer bills.
  - id: kjc.who.mccarthy-eugene-j
    s: McCarthy, Eugene J.
    r: Senator, Minnesota
    n: Also in the 1968 list.
  - id: kjc.who.mcclellan-john-l
    s: McClellan, John L.
    r: Senator, Arkansas; Government Operations chairman
    n: Valachi, 1963.
  - id: kjc.who.mcgovern-george
    s: McGovern, George
    r: Food for Peace, 1961–62; Senator, South Dakota, from 1963
    n: Also Cong.
  - id: kjc.who.morse-wayne
    s: Morse, Wayne
    r: Senator, Oregon, to 1969
    n: 'Voted against Tonkin. Voice: Drukman (II.I.1).'
  - id: kjc.who.muskie-edmund-s
    s: Muskie, Edmund S.
    r: Senator, Maine
    n: The air and water bills, 1963–67. Also in the 1968 list.
  - id: kjc.who.russell-richard-b
    s: Russell, Richard B.
    r: Senator, Georgia; Armed Services chairman
    n: 'Leader of the southern caucus; Johnson''s mentor; Warren Commission. Voice: tapes; Fite (II.I.1).'
  - id: kjc.who.sparkman-john
    s: Sparkman, John
    r: Senator, Alabama; Banking chairman
    n: Housing.
  - id: kjc.who.stennis-john-c
    s: Stennis, John C.
    r: Senator, Mississippi
    n: The 1962 and 1967 preparedness hearings.
  - id: kjc.who.thurmond-strom
    s: Thurmond, Strom
    r: Senator, South Carolina
    n: A Democrat until Sept. 16, 1964. Also Opp.
  - id: kjc.who.yarborough-ralph-w
    s: Yarborough, Ralph W.
    r: Senator, Texas
    n: 'The Texas liberal, at war with Connally''s wing. Voice: Cox (II.I.1).'
