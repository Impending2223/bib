# 1968 I.B Literary novels
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: l68
section: I.B
entries:
  - id: l68.warren-all-the-kings
    c: Robert Penn Warren, *All the King's Men* (1946)
    n: A historian digs up the dirt that kills a judge. Includes an embedded Civil War diary.
  - id: l68.oconnor-last-hurrah
    c: Edwin O'Connor, *The Last Hurrah* (1956)
    n: A Boston mayor's last campaign. The boss as charming and dangerous. A model for Daley.
  - id: l68.drury-advise-and-consent
    c: Allen Drury, *Advise and Consent* (1959)
    n: A Senate confirmation fight. Each book of the novel follows a different senator.
  - id: l68.vidal-best-man-a
    c: 'Gore Vidal, *The Best Man: A Play About Politics* (1960)'
    n: A convention. Two candidates each hold damaging secrets on the other; a dying ex-President decides.
  - id: l68.vidal-julian
    c: Gore Vidal, *Julian* (1964)
    n: The memoir of the Apostate emperor, annotated by Libanius and Priscus.
  - id: l68.vidal-washington-d-c
    c: Gore Vidal, *Washington, D.C.* (1967)
    n: 'Washington, 1937 to the early 1950s: an old senator outmaneuvered by a manufactured young candidate. The weakest of the series.'
  - id: l68.drury-preserve-and-protect
    c: Allen Drury, *Preserve and Protect* (1968)
    n: A convention thrown into chaos after the President's death, with violence outside. Published in 1968.
  - id: l68.doctorow-book-of-daniel
    c: E.L. Doctorow, *The Book of Daniel* (1971)
    n: The Rosenberg case under other names, told by the surviving son.
  - id: l68.roth-our-gang-starring
    c: Philip Roth, *Our Gang (Starring Tricky and His Friends)* (1971)
    n: Burlesque of Nixon, written while he was in office.
  - id: l68.wouk-winds-of-war
    c: Herman Wouk, *The Winds of War* (1971)
    n: A fictional naval family in rooms with Roosevelt, Churchill, and Hitler. A German general's memoir is interleaved.
  - id: l68.drury-come-nineveh-come
    c: 'Allen Drury, *Come Nineveh, Come Tyre: The Presidency of Edward M. Jason* (1973)'
    n: One of two alternative sequels to *Preserve and Protect*. In this one, Jason wins.
  - id: l68.vidal-burr-a-novel
    c: 'Gore Vidal, *Burr: A Novel* (1973)'
    n: A young clerk narrates; Burr's dictated memoir runs inside the novel. The best of the series.
  - id: l68.mccarry-tears-of-autumn
    c: Charles McCarry, *The Tears of Autumn* (1974)
    n: An intelligence officer traces the Kennedy assassination to Saigon. Restrained and cold.
  - id: l68.shaara-killer-angels
    c: Michael Shaara, *The Killer Angels* (1974)
    n: Gettysburg in rotating close third person through real officers. Sold widely; filmed as *Gettysburg*.
  - id: l68.drury-promise-of-joy
    c: 'Allen Drury, *The Promise of Joy: The Presidency of Orrin Knox* (1975)'
    n: The other alternative sequel. In this one, Knox wins.
  - id: l68.doctorow-ragtime
    c: E.L. Doctorow, *Ragtime* (1975)
    n: Real people in invented meetings, told in short, flat sentences. A bestseller and later a musical.
  - id: l68.vidal-1876-a-novel
    c: 'Gore Vidal, *1876: A Novel* (1976)'
    n: The disputed Tilden–Hayes election as Gilded Age comedy. The closest of the series to this premise.
  - id: l68.coover-public-burning
    c: Robert Coover, *The Public Burning* (1977)
    n: Nixon narrates alternate chapters in first person during the Rosenberg executions.
  - id: l68.wouk-war-and-remembrance
    c: Herman Wouk, *War and Remembrance* (1978)
    n: Sequel to *The Winds of War*.
  - id: l68.vidal-creation
    c: Gore Vidal, *Creation* (1981)
    n: A Persian envoy meets the Buddha, Mahavira, Laozi, and Confucius.
  - id: l68.vidal-lincoln-a-novel
    c: 'Gore Vidal, *Lincoln: A Novel* (1984)'
    n: Lincoln seen only from outside, through the people around him.
  - id: l68.vidal-empire-a-novel
    c: 'Gore Vidal, *Empire: A Novel* (1987)'
    n: A woman buys a Washington paper amid Hay, Adams, Roosevelt, and Hearst.
  - id: l68.delillo-libra
    c: Don DeLillo, *Libra* (1988)
    n: Oswald and the Kennedy assassination. Real people's inner lives written as a theory of history.
  - id: l68.doctorow-billy-bathgate
    c: E.L. Doctorow, *Billy Bathgate* (1989)
    n: A teenager apprenticed to the gangster Dutch Schultz.
  - id: l68.vidal-hollywood-a-novel
    c: 'Gore Vidal, *Hollywood: A Novel of America in the 1920s* (1990)'
    n: Wilson, Harding, and the early movie business.
  - id: l68.ellroy-american-tabloid
    c: James Ellroy, *American Tabloid* (1995)
    n: 1958 to 1963. Telegraphic prose; real figures seen through invented operatives; interpolated FBI memos and wiretaps.
  - id: l68.primary-colors-a-novel-of
    c: '*Primary Colors: A Novel of Politics* (1996)'
    n: Published anonymously; by Joe Klein. A young aide and a Clinton-like governor.
  - id: l68.delillo-underworld
    c: Don DeLillo, *Underworld* (1997)
    n: 'Read the prologue: Hoover in the stands at the Polo Grounds.'
  - id: l68.vidal-golden-age-a
    c: 'Gore Vidal, *The Golden Age: A Novel* (2000)'
    n: 1939 to the 1950s; opens around the 1940 Willkie convention.
  - id: l68.ellroy-cold-six-thousand
    c: James Ellroy, *The Cold Six Thousand* (2001)
    n: 1963 to 1968. Ends with the King and Robert Kennedy killings.
  - id: l68.doctorow-march
    c: E.L. Doctorow, *The March* (2005)
    n: Sherman's march in rotating close third person, Sherman included.
  - id: l68.harris-imperium
    c: Robert Harris, *Imperium* (2006)
    n: 'Cicero told by his secretary, Tiro. Sequels: *Lustrum* (2009), titled *Conspirata* in the U.S., and *Dictator* (2015).'
  - id: l68.mallon-fellow-travelers
    c: Thomas Mallon, *Fellow Travelers* (2007)
    n: McCarthy-era Washington. Adapted by Showtime (2023).
  - id: l68.ellroy-bloods-a-rover
    c: James Ellroy, *Blood's a Rover* (2009)
    n: 1968 to 1972. Opens in June 1968.
  - id: l68.mantel-wolf-hall
    c: Hilary Mantel, *Wolf Hall* (2009)
    n: Close third person on Cromwell. The model for free indirect style.
  - id: l68.mallon-watergate-a-novel
    c: 'Thomas Mallon, *Watergate: A Novel* (2012)'
    n: Chapters rotate among real people (Nixon, Pat Nixon, Liddy, Hunt, Rose Mary Woods), each in documented idiom. The closest model for the whole project.
  - id: l68.mallon-finale-a-novel
    c: 'Thomas Mallon, *Finale: A Novel of the Reagan Years* (2015)'
    n: The same method, 1986.
