# 1968 I.C Nonfiction stylists
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: l68
section: I.C
entries:
  - id: l68.white-making-of-the
    c: Theodore H. White, *The Making of the President 1960* (1961)
    n: Civic-romantic and wide-angle. Alternates census-scale panorama with one man alone in a hotel room.
  - id: l68.mailer-miami-and-the
    c: 'Norman Mailer, *Miami and the Siege of Chicago: An Informal History of the Republican and Democratic Conventions of 1968* (1968)'
    n: Grandiose, carnal, self-dramatizing. Mailer calls himself "the reporter." Chicago as a slaughterhouse city.
  - id: l68.white-making-of-the-2
    c: Theodore H. White, *The Making of the President 1968* (1969)
    n: White on the campaign itself.
  - id: l68.thompson-fear-and-loathing
    c: 'Hunter S. Thompson, *Fear and Loathing: On the Campaign Trail ''72* (1973)'
    n: Gonzo. 1972, but useful for register.
  - id: l68.caro-years-of-lyndon
    c: 'Robert A. Caro, *The Years of Lyndon Johnson: Master of the Senate* (2002)'
    n: Monumental and patient. Explains how a mechanism of power works, then shows Johnson using it.
  - id: l68.perlstein-nixonland-the-rise
    c: 'Rick Perlstein, *Nixonland: The Rise of a President and the Fracturing of America* (2008)'
    n: Collage of headlines, TV, and letters. Resentment as the engine.
  - id: l68.caro-years-of-lyndon-2
    c: 'Robert A. Caro, *The Years of Lyndon Johnson: The Passage of Power* (2012)'
    n: Caro at his fastest. The volume covering 1968 is not yet published.
