      - id: p3h
        num: III.H
        title: The Chennault channel
        logic:
          - The people on either end of the back channel to Saigon, and those watching it. Alphabetical.
        short: III.H Chennault channel
        file: III.H.yaml
      - id: p3i
        num: III.I
        title: Humphrey camp
        logic:
