# 1968 I.A Commercial thrillers
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: l68
section: I.A
entries:
  - id: l68.condon-manchurian-candidate
    c: Richard Condon, *The Manchurian Candidate* (1959)
    n: Paranoid pulp of the period. The climax is a sniper at a nominating convention.
  - id: l68.knebel-seven-days-in
    c: Fletcher Knebel & Charles W. Bailey II, *Seven Days in May* (1962)
    n: A military coup plot, counted down by day. The President knows but cannot prove it. Clean newsroom prose.
  - id: l68.wallace-man
    c: Irving Wallace, *The Man* (1964)
    n: A Black senator becomes President through the line of succession. The impeachment trial is the set piece.
  - id: l68.knebel-night-of-camp
    c: Fletcher Knebel, *Night of Camp David* (1965)
    n: A senator comes to suspect the President is going mad.
  - id: l68.knebel-vanished
    c: Fletcher Knebel, *Vanished* (1968)
    n: A presidential press secretary's story, published in 1968. Known to me mainly by reputation.
  - id: l68.crichton-andromeda-strain
    c: Michael Crichton, *The Andromeda Strain* (1969)
    n: Presented as a classified report. Fake documents lend authority.
  - id: l68.forsyth-day-of-the
    c: Frederick Forsyth, *The Day of the Jackal* (1971)
    n: A real head of state, a fictional assassin, a clock that never stops.
  - id: l68.condon-winter-kills
    c: Richard Condon, *Winter Kills* (1974)
    n: Satirical conspiracy thriller about a murdered President. Funnier and more grotesque than Ellroy.
  - id: l68.ehrlichman-company
    c: John Ehrlichman, *The Company* (1976)
    n: 'Roman à clef by a Nixon aide. Adapted as *Washington: Behind Closed Doors* (ABC 1977).'
  - id: l68.agnew-canfield-decision
    c: Spiro T. Agnew, *The Canfield Decision* (1976)
    n: A novel by the former Vice President. Known to me only as a bibliographic fact.
  - id: l68.safire-full-disclosure
    c: William Safire, *Full Disclosure* (1977)
    n: A President blinded in an assassination attempt; a Twenty-Fifth Amendment fight. By a Nixon speechwriter.
  - id: l68.archer-shall-we-tell
    c: Jeffrey Archer, *Shall We Tell the President?* (1977)
    n: A one-week hunt for an assassin. Read the 1977 edition, where the target is Edward Kennedy. The 1985 revision replaces him.
  - id: l68.ludlum-chancellor-manuscript
    c: Robert Ludlum, *The Chancellor Manuscript* (1977)
    n: 'A novelist guesses the truth: Hoover was murdered and half his files are missing. Known to me mainly by reputation.'
  - id: l68.king-dead-zone
    c: Stephen King, *The Dead Zone* (1979)
    n: A folksy populist congressman who will become President and start a nuclear war. The demagogue at the rally.
  - id: l68.dobbs-house-of-cards
    c: Michael Dobbs, *House of Cards* (1989)
    n: A Chief Whip uses members' secrets to take power. The asides to the audience came from the 1990 BBC adaptation, not the novel.
  - id: l68.wild-cards-vi-ace-in
    c: '*Wild Cards VI: Ace in the Hole* (George R.R. Martin ed., 1990)'
    n: Shared-world novel. As I recall, set at the 1988 Democratic convention, with a candidate hiding a monstrous secret.
  - id: l68.grisham-firm
    c: John Grisham, *The Firm* (1991)
    n: A young lawyer joins a firm, learns its secret, and runs. The audience-surrogate shape that studios buy.
  - id: l68.turtledove-guns-of-the
    c: 'Harry Turtledove, *The Guns of the South: A Novel of the Civil War* (1992)'
    n: 'Alternate-history pulp. Read as a warning: rotating viewpoints that all sound alike.'
  - id: l68.harris-fatherland
    c: Robert Harris, *Fatherland* (1992)
    n: Alternate-history detective thriller in a Germany that won the war.
  - id: l68.martin-game-of-thrones
    c: George R.R. Martin, *A Game of Thrones* (1996)
    n: Each chapter is titled with its viewpoint character and written in that character's idiom. The same structure as this project.
  - id: l68.brown-angels-and-demons
    c: Dan Brown, *Angels & Demons* (2000)
    n: A papal conclave. Three-page chapters that end on a withheld fact; a one-night clock.
  - id: l68.martin-storm-of-swords
    c: George R.R. Martin, *A Storm of Swords* (2000)
    n: Includes the Red Wedding. No character is safe.
  - id: l68.greenfield-then-everything-changed
    c: 'Jeff Greenfield, *Then Everything Changed: Stunning Alternate Histories of American Politics: JFK, RFK, Carter, Ford, Reagan* (2011)'
    n: Counterfactual political history by a former RFK speechwriter, including 1968.
  - id: l68.follett-edge-of-eternity
    c: Ken Follett, *Edge of Eternity* (2014)
    n: Fictional families beside real 1960s figures, including RFK's 1968 campaign.
  - id: l68.harris-conclave
    c: Robert Harris, *Conclave* (2016)
    n: A papal election in a locked building. Filmed in 2024.
  - id: l68.clinton-president-is-missing
    c: Bill Clinton & James Patterson, *The President Is Missing* (2018)
    n: Two-page chapters. The President narrates in first person, the assassin in third.
