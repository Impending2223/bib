# 1968 II.B Vietnam and the military
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: l68
section: II.B
entries:
  - id: l68.hoopes-limits-of-intervention
    c: 'Townsend Hoopes, *The Limits of Intervention: An Inside Account of How the Johnson Policy of Escalation in Vietnam Was Reversed* (1969)'
    n: By the Under Secretary of the Air Force, a dove. Readable.
  - id: l68.rostow-diffusion-of-power
    c: 'W.W. Rostow, *The Diffusion of Power: An Essay in Recent History* (1972)'
    n: By Johnson's national security adviser.
  - id: l68.schandler-unmaking-of-a
    c: 'Herbert Y. Schandler, *The Unmaking of a President: Lyndon Johnson and Vietnam* (1977)'
    n: The March 1968 turn.
  - id: l68.clodfelter-limits-of-air
    c: 'Mark Clodfelter, *The Limits of Air Power: The American Bombing of North Vietnam* (1989)'
    n: Compares Rolling Thunder and Linebacker. Covers why weather and aircraft limited bombing in late 1968.
  - id: l68.rusk-as-i-saw
    c: Dean Rusk, *As I Saw It* (1990)
    n: Told to his son, Richard Rusk.
  - id: l68.clifford-counsel-to-the
    c: 'Clark Clifford, *Counsel to the President: A Memoir* (1991)'
    n: With Richard Holbrooke.
  - id: l68.sorley-thunderbolt-general-creighton
    c: 'Lewis Sorley, *Thunderbolt: General Creighton Abrams and the Army of His Times* (1992)'
  - id: l68.mcmaster-dereliction-of-duty
    c: 'H.R. McMaster, *Dereliction of Duty: Lyndon Johnson, Robert McNamara, the Joint Chiefs of Staff, and the Lies That Led to Vietnam* (1997)'
    n: How the Joint Chiefs were kept out. Ends in 1965.
  - id: l68.foreign-relations-of-the-united
    c: '*Foreign Relations of the United States, 1964–1968*, vol. 6, *Vietnam, January–August 1968* (2002)'
    n: Online at [history.state.gov](https://history.state.gov). Includes Tom Johnson's notes of the Tuesday lunches.
  - id: l68.foreign-relations-of-the-united-2
    c: '*Foreign Relations of the United States, 1964–1968*, vol. 7, *Vietnam, September 1968–January 1969* (2003)'
    n: Includes the Johnson–Abrams meeting of October 29, 1968. Read this one first.
  - id: l68.vietnam-chronicles-the-abrams-tapes
    c: '*Vietnam Chronicles: The Abrams Tapes, 1968–1972* (Lewis Sorley ed., 2004)'
    n: Transcripts of Abrams's staff meetings. The source for his voice.
