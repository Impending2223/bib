# 1968 III.G Military command
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: l68
section: III.G
entries:
  - id: l68.who.abrams-creighton
    s: Abrams, Creighton
    r: Commander, MACV, from summer 1968
    n: 'Flew secretly to Washington and met Johnson in the early hours of Oct. 29, 1968; supported the bombing halt. Voice: Abrams Tapes (II.B).'
  - id: l68.who.mccain-john-s-jr
    s: McCain, John S., Jr.
    r: Commander in Chief, Pacific, from July 1968
    n: His son, John McCain III, was a prisoner in Hanoi.
  - id: l68.who.mcconnell-john-p
    s: McConnell, John P.
    r: Air Force Chief of Staff
    n: Owns the B-52 question.
  - id: l68.who.moorer-thomas
    s: Moorer, Thomas
    r: Chief of Naval Operations
    n: Long-standing advocate of mining Haiphong.
  - id: l68.who.sharp-u-s-grant
    s: Sharp, U.S. Grant
    r: Commander in Chief, Pacific, until July 1968
  - id: l68.who.westmoreland-william
    s: Westmoreland, William
    r: Army Chief of Staff from July 1968
    n: Formerly MACV. On the Joint Chiefs, off the operational end.
