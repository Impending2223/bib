# 1968 III.P Running mates
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: l68
section: III.P
entries:
  - id: l68.who.connally-john-2
    s: Connally, John
    r: The crony
    n: A Texas–Texas ticket costs Texas's electors for one half of the ticket, unless Johnson moves his domicile to the District. See *Jones v. Bush* (II.D.1).
  - id: l68.who.humphrey-hubert-h-2
    s: Humphrey, Hubert H.
    r: The sitting Vice President
    n: Dump him, or force him back on as the price of unity.
  - id: l68.who.kennedy-edward-m-2
    s: Kennedy, Edward M.
    r: The poisoned chalice
    n: Reconciliation or betrayal.
  - id: l68.who.muskie-edmund-s
    s: Muskie, Edmund S.
    r: The safe choice
    n: 'Humphrey''s actual pick. Voice: recordings (II.E); memoir (II.C.2).'
  - id: l68.who.shriver-sargent
    s: Shriver, R. Sargent
    r: Ambassador to France
    n: 'A Kennedy in-law; floated in 1968. Voice: tapes; Stossel (II.C.2).'
