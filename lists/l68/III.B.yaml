# 1968 III.B Johnson's outside circle
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: l68
section: III.B
entries:
  - id: l68.who.busby-horace
    s: Busby, Horace
    r: Private consultant
    n: 'Drafted the March 31 withdrawal statement. Voice: memoir (II.C.1); his newsletter.'
  - id: l68.who.criswell-john
    s: Criswell, John
    r: Democratic National Committee
    n: With Watson, Johnson's hand on the convention's arrangements.
  - id: l68.who.daniel-price
    s: Daniel, Price
    r: Director, Office of Emergency Planning
    n: 'Former governor of Texas. Voice: tapes.'
  - id: l68.who.fortas-abe
    s: Fortas, Abe
    r: Associate Justice; nominee for Chief Justice
    n: 'Still advising Johnson. A Johnson candidacy makes the filibuster certain. Voice: tapes; hearings (II.D.2); Oyez.'
  - id: l68.who.moyers-bill
    s: Moyers, Bill
    r: Publisher, *Newsday*
    n: 'Left in 1967; close to Robert Kennedy. Would he come back? Voice: tapes, 1964–66; PBS.'
  - id: l68.who.valenti-jack
    s: Valenti, Jack
    r: President, Motion Picture Association
    n: 'Left in 1966; loyal for life. Voice: memoirs (II.C.1); decades on camera.'
  - id: l68.who.watson-w-marvin
    s: Watson, W. Marvin
    r: Postmaster General since April 1968
    n: 'Johnson''s political enforcer. Later accounts have him sounding out delegates about a draft. Voice: memoir (II.C.1); tapes.'
