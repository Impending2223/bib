# in doubt: a place whose 1960s daylight time zoneinfo does not record, or two clocks an hour or two apart, the
# entry not saying whose. Read by tools/times/propose_ranges.py (tier clocks): each a range from the earlier reading
# to the later, in UTC, the reviewer's reason its basis. Copied from the reviewers' decision files (the scratchpad's
# times-*/dec.txt, ref.txt, refused.txt and times2-*/decisions.*, dec*.py); an entry since given a time is skipped.
# id: the entry; local: the hour the record gives (24-hour), on `day` where not the entry's date; readings: the zones
# the hour may be read in (IANA, or a fixed offset, Etc/GMT+5 for UTC-5); zone: the place's zone (time_zone) where one
# place is meant; hour: where the hour stands; reason: the reviewer's, as written; by: the reviewer.
