# Congressional Quarterly, "Winning Representatives' Vote Percentages Since 1954," *CQ Weekly Report*, vol. 24, no. 29
# (week ending July 22, 1966), pp. 1563-1567 (running feet "July 22, 1966 -- PAGE 1563" ... "PAGE 1567", confirmed on
# each page; PDF pages 79-83; p. 1568, PDF page 84, is the "1966 Election Calendar", not the chart). The headnote
# (p. 1563): "This chart shows the percentage of the total Congressional district vote won by House Members in elections
# since 1954 ... Percentages are based on final, official returns. Past percentages were not applicable in areas where
# district lines had been changed by redistricting. These new districts were treated as follows: Where sufficient
# election statistics were available, CQ calculated the last Congressional vote prior to redistricting within the
# counties or wards which make up each newly created district For these districts, the majority party percentage thus
# calculated is marked by this symbol:* Where a district within a redistricted state retained its old borders, even
# though its district number is changed, the percentages since 1954, still applicable, are given. Percentages of winning
# Democrats are given in bold type, of winning Republicans in light type. Only 1964 winners' names are given, except for
# notation of winners in subsequent special elections." The footnote box (the same on pp. 1563-1567): "*Redistricted
# seat. Figure shown is the majority percentage of the previous vote for Congress cast within the confines of the new
# district." "**Resigned." "[bullet] Retiree." "X No major party opposition." "***Defeated in 1966 primary." "#Estimated
# figures." "[dagger] Deceased." "[double dagger] Liberal candidate received 6.6% of 1962 vote." Where CQ had no figures
# it prints "Not available" or "Figures unavailable" and a rating ("Safe Democratic", "Leans Republican", "Doubtful").
# The recomputed (*) figures for the 1965-66 redistrictings stand in the 1964 column (the last vote before them); the
# other marks (in the 1962 and 1960 columns) are the 1961-64 redistrictings' and are not read here.
#
# The copy read: the owner's scan (w66.pdf), PDF pages 79-83, read by eye off 300-dpi renders (Nov. 1, 2026): each page
# whole, then each State's block cropped; every cell of the listed seats read a second time from a fresh crop (or, for
# Arizona and Arkansas, a fresh render of the block); the two readings agree in every cell. The other marked cells in the
# 1964 column (States not on the missing list) read once in a crop and checked against the whole-page image.
#
# Cells: `[party, pct]`, the 1964 column as printed: pct the leading party's percentage of the TOTAL vote, party by the
# type weight (bold D, light R; the weight, not the incumbent's party: Maryland's 1st, Morton (R), is bold). The
# orchestrator converts: D = pct, or 100 - pct where R leads, the rest taken as the other major party's (an
# approximation: minor parties' votes are in the total). `old`: the cell printed without the mark (the "old borders"
# case; a figure for the old district). `unopposed`: the cell prints "X" (no major-party opposition), with the mark
# unless `old` names it; an X carries no party by its weight (the legend's X is bold too). `estimated`: CQ's "#".
# `rating`: the words CQ prints where it had no figures, as printed ("Not available*": the mark with no rating).
# `special`: a later special election's figure printed under the seat (unmarked, the old district's), not the lag.
# `two_members`: the figure stands on the line of the second-named incumbent thrown into the district, as noted.
#
# Not final / no figures: the chart prints New Jersey "(Redistricted June 18, 1966, percentages not yet computed.)"
# (p. 1565; the scan reads "perceniages", a broken t): no figures. South Carolina is printed with its full 1954-64
# history, unmarked, as if on old borders, though the issue's own outlook (p. 1516, read from the page's OCR, not by eye)
# says the 2nd lost "heavily Republican Aiken County in the recent redistricting" and the 3rd was "recently redistricted
# to include the Republican counties of Sumter and Aiken": the 2nd's cell is a figure for the old district. Nothing in
# the chart marks any other State as on old lines, pending, or awaiting a court plan. Tennessee: the outlook (p. 1517,
# OCR) says "A 1965 redistricting act was declared unconstitutional by a three-judge federal panel but was allowed to
# stand for use in this year's elections" (the 1966 lines; a later plan is 1968's). Arizona's lines are a three-judge
# court's of Feb. 2, 1966 (p. 1491, OCR). CQ's 1966 index (its corrections) not read: a lead.
#
# Checks against the issue's outlooks (OCR, not by eye): Ohio's 17th, "voted 53.5 percent Democratic in 1964" (p. 1512),
# agrees; North Carolina's 10th, "dropping Whitener's margin to 55.8 percent" (p. 1511), agrees; Idaho's 2nd, "50.3
# percent" (p. 1497), agrees. Two disagree: Idaho's 1st, chart 48.9* light, outlook "This gave Republicans 51.1 percent of
# the 1964 vote" (p. 1497): the cell is the Democrat's share printed light, not the leader's (do not convert it as R);
# Illinois's 23rd, chart 58.1*, outlook "from 54.6 to 60.7 percent" (p. 1498). Tennessee's 5th (old, 59.8) against the
# Census's Supplement No. 16 (cdh-1966s): 74,597 of 124,807, 59.8 percent: agrees.
#
# `pages` names the districts with a figure or a rating. Used for the 1966 lag (the 1964 House vote on the 1966 lines,
# the 90th Congress's).
# `pages` names the districts with a figure (the orchestrator, on wiring the file in).
