# The vote for Representative by congressional district, 1962, 1960, 1958, 1956, 1954 and 1952, on the lines of the 89th
# Congress, for the seven States that redistricted after the 88th Congress's opening: U.S. Bureau of the Census,
# *Congressional District Data Book (Districts of the 89th Congress)*, Supplements (CDDB-Supp.) Nos. 1-7, January 1965
# (South Carolina, Wisconsin, Colorado, Connecticut, Georgia, Alabama, Michigan), printed together as H. Doc. 33, 89th
# Cong., 1st Sess. (Serial Set 12706-1), table, items 11-28 ("Vote cast, by major party: For Representative": total,
# Democratic, Republican, each year; no percent printed). The copy read: govinfo's scan,
# SERIALSET-12706_01_00-002-0033-0000; the supplements carry no page numbers, so `pages` gives the PDF page, as in the
# presidential reading of the same volume (districts/cdb-1965.yaml, whose header quotes the supplements' note: the
# figures "retabulated for the geographic areas encompassed within the new boundaries", "(NA)" where a split-county
# district could not be). For the House only Alabama's figures are retabulated (its 2d and 8th, 1960-52, the 88th having
# chosen its eight seats at large); every other district whose lines changed prints "(NA)" in every year, and the other
# figures printed (the State columns and South Carolina's 1st, 2d, 3d and 6th, Colorado's 1st, Connecticut's 2d,
# Georgia's 7th) are the 1963 Data Book's figures for the same district number, unchanged, all 258 (cdh-1963.yaml). Wisconsin's and Michigan's districts all print (NA); Alabama's
# State column prints (NA) for 1962 (its eight seats chosen at large). The State columns, as in 1963, leave out the votes
# at large (Connecticut's, Michigan's), though the supplements print no column at large and no footnote saying so. Each
# page's footnotes: "- Entry represents zero. NA Not available."; no footnote marks on these items.
#
# Schema: as cdh-1963.yaml, the cells [t, D, R]; `na` the page's "(NA)" (Michigan's 17th, 1952 Democratic, printed
# "(AN)"), a dash 0 (no candidate; Georgia's 1952 Republican row prints a dash in every column, the (NA) districts too).
# The figures: every cell (1,260; 248 figures not zero, 40 dashes, 972 (NA)) read by eye off the page image at 300 dpi,
# and set against tesseract's reading of each cell (243 of the 248 figures alike; the five that differ misread by the
# machine). Checks: every district row held to its State column where no district is (NA) (South Carolina 1962-52,
# items 11-28, and Georgia's 1952 Republican row: all add exactly); D + R not over t. No United States figures.
