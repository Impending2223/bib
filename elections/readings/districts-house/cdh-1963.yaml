# The vote for Representative by congressional district, 1962, 1960, 1958, 1956, 1954 and 1952, on the lines of the 88th
# Congress (as constituted for the November 1962 elections): U.S. Bureau of the Census, *Congressional District Data Book
# (Districts of the 88th Congress)* (1963; H. Doc. 132, 88th Cong., 1st Sess., Serial Set 12613), table 1, items 11-28 ("Vote
# cast, by major party: For Representative": total, Democratic, Republican, each year; no percent printed), pp. 2-556. The
# copy read: govinfo's scan, SERIALSET-12613_00_00-002-0132-0000 (printed page = PDF page - 45), as for the presidential
# items (districts/cdb-1963.yaml, whose page and column map this file reuses). Its note (p. XV, items 1-28): "The figures are
# for districts as constituted in November 1962 and not as they were at the time of each election. For many split-county
# districts, however, it was not possible to recompute the vote cast figures for 1960 and prior years, as indicated by the
# entry 'n.a.'" Its sources (p. XV): for 1952 to 1960, the Governmental Affairs Institute's *America Votes* 4 (1962;
# copyright); for 1962, CQ Weekly Report, Special Report No. 14, Apr. 5, 1963, pt. I, "Complete Returns of the 1962
# Elections by Congressional District" (copyright); "Scattered 'write-in' votes are not included in the Weekly Report
# figures for 1962."
#
# Schema: as districts/cdb-1961.yaml (its header), the cells [t, D, R] (no percent printed); `na` the page's "n.a.", `nil`
# its "..." (no candidate, or no seat), `fn` a footnote mark printed in place of the figures (Alabama's and Arkansas's
# 1962, Texas's 22d before 1958). `al`: the column "At large" of a State that chose a seat at large with its districts
# (Connecticut, Maryland, Michigan, Ohio, Texas: seat 1) or wholly at large (Hawaii, New Mexico: positions 1 and 2), its
# figures as printed; the State column leaves them out (the pages' footnotes) but for Hawaii and New Mexico, where it gives
# the larger of the two positions' figures, party by party. `footnotes`: the pages' footnotes that bear on these items.
# The figures: each cell cut by the page map and read by tesseract alone at three settings (footnote marks before a figure
# found by the glyphs' height and erased first), voted, and held to the State column, to D + R = t where no others ran, and
# to the Clerk's returns (elections/<year>.yaml: the State's House total, and a district's D and R where the lines held);
# every cell not so held, every footnoted State, and every column where the reading erred was read by eye off the page
# image at 300 dpi (`eye`; whole columns where several cells erred; every `al` figure, not listed). The erasure of marks also took a leading digit
# (1, 2, 9) off some figures: none of those stands unread. Of 8,496 cells: 5,085 figures, 2,944 n.a., 435 dots, 32
# footnote marks; of the figures, 2,694 read by eye, 2,152 held by the State column, 215 by D + R = t, 24 by the Clerk's
# State totals alone. Against the Clerk's returns for the same district number: 1962, 759 of 771 D and R figures agree
# (the rest CQ's figures, the State columns adding to them: Kentucky's 6th, Missouri's 9th, Nebraska's 1st, Texas's 15th,
# a few by single digits; Tennessee's 5th, the two independents' vote); 1960, 355 of 386; 1958, 340 of 372; 1956, 343 of
# 372 (the rest districts renumbered or redrawn in 1962: California, Mississippi, New York, and Indiana's 9th, 1958, and a
# few by a handful of votes). Checks: every district row held to its State column, item by item, where no district is
# n.a. (North Dakota's footnoted State column the exception); D + R not over t but as `over` (Indiana's 9th, 1958; New
# York's 26th and 31st, 1958, whose totals are printed short by 100,000; New Mexico's State column, 1962). The United
# States figures (p. 2) are the States' sum for 1962, 1956 and 1954, and for 1952 but 45 in the total; not for 1960 and
# 1958 (`us_note`).
