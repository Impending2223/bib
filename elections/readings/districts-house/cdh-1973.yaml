# The vote for Representative by congressional district, 1970, 1968 and 1966, on the lines of the 93d Congress (as
# constituted for the November 1972 elections): U.S. Bureau of the Census, *Congressional District Data Book, 93d
# Congress* (1973; H. Doc. 93-109), table 1, items 1-12 ("Vote cast for Representative", 1970, 1968 and 1966: total,
# Democratic, Republican, percent for party with most votes), pp. 2-545. The copy read: the NIH Library's, archive.org
# congressionaldis00unit (printed page = PDF page - 22), as for the presidential items (districts/cdb-1973.yaml, whose
# header quotes the volume's note and the pages' footnotes). Its note (pp. X-XI): the figures were obtained from the
# National Republican Congressional Committee and "retabulated by the Committee to reflect the congressional district
# boundaries as established for the 1972 elections"; the House figures are "strictly in terms of party vote, and are not
# necessarily comparable as vote cast for particular candidates"; "the vote cast for third parties endorsing the major
# party candidates are excluded from figures shown here for 'Democratic' and 'Republican' but included in the total vote
# cast in the district" (so New York's D and R leave out the Liberal and Conservative lines). Arkansas's and Florida's
# figures leave out the votes for unopposed candidates (the pages' footnotes). Used by tools/elections/make_pvi.py's
# House index where it reads them; checked by tools/elections/cd_readings.py (house_problems).
#
# Schema: as districts/cdb-1961.yaml (its header), the cells [t, D, R, p]; `na` the page's "(NA)" (California's and
# Washington's districts, Georgia's 1966 column), `fn` a footnote mark printed in place of the figures (Arkansas's 3d,
# 1970 and 1968), a dash 0. The figures: archive.org's hOCR and tesseract read by column strip, each cell voted among
# the readings; the doubtful cells read again alone at four settings; then held to the State column and to each row's
# printed percent (D + R not over t). Every cell neither so held, and every page of a footnoted State, was read by eye
# off the page image (a footnote mark before a figure, read as a leading digit, is the commonest misreading: New York,
# Arkansas, Alabama, Georgia, Oklahoma); `eye` lists them. Checks: every district row held to its State column, item by
# item, where no footnote says the State column holds votes not distributed by district (`footnoted`: fourteen States,
# the items that do not add; Massachusetts's add) or the page prints a State column the districts do not make (`as_printed`: Arizona,
# Idaho, Michigan 1966); every printed percent to its figures but the four `percent_as_printed`; D + R not over t
# (`over`: Oklahoma's 5th, 1970). The United States figures (p. 2) are not the States' sum (`us_note`).
