# Congressional Quarterly, "Past Election Figures Set Stage for 1962 House Races," *CQ Weekly Report*, vol. 20,
# supplement ("The Elections of 1962" special report), week ending May 4, 1962, pp. 724-729: the chart of House
# percentages, 1960-1952, and the presidential percentages, district by district, under each State's 1962 districts.
# The headnote (p. 724): "This chart shows the percentage of the total Congressional District vote won by House Members
# in elections since 1952"; for districts changed by redistricting, "Where sufficient election statistics were
# available, CQ calculated the 1960 Congressional vote cast within the counties or wards which make up each newly
# created district. For these districts, the majority party percentage thus calculated is given under the 1960 column,
# marked by this symbol: [circled cross]"; the legend: "Redistricted seat. Figure shown is the majority percentage of
# the 1960 vote for Congress cast within the confines of the new district." "Where no figures whatever were available,
# the reported political complexion is given -- Safe Democratic, Safe Republican, etc." "Where a district within a
# redistricted state retained its old borders, even though its district number is changed, the percentages since
# 1952, still applicable, are given." "Percentages of winning Democrats are given in bold type, of winning Republicans
# in light type." California's "#" figures (p. 724 n.): "Newly created California district for which no past election
# percentages are available. Figure shown is the official January 1962 percentage of registered Democrats in the new
# district" -- registration, not votes: kept under `registration`, never in `d`. Footnotes: Missouri "(3) estimated
# figure" (p. 726); New York "(4) Includes slight estimates" (39th-41st) and "All New York City figures (Districts 6-24)
# include some estimates" (p. 727); Arizona "(2)" (p. 724): the new 2nd's and 3rd's figures "are a breakdown of the vote
# received by Democrat Morris K. Udall in 1961 special election in the current 2nd" (not 1960: under `special`).
#
# The copy read: the owner's scan (archive.org sim_cq-weekly_1962-05-04_20_supplement), PDF pages 38-43 = printed pp.
# 724-729 (each page's running foot read: "PAGE 724 -- Week ending May 4, 1962" ... "Week ending May 4, 1962 -- PAGE
# 729"). The scan has no text layer; its page images (1523 x 2036, about 180 dpi on the printed page) were extracted
# whole (pdfimages) and read by eye off crops enlarged 1.6-7x (Nov. 1, 2026), each State block twice, from two
# different crops at different scales, the readings compared: they agree throughout.
#
# Cells: `[party, pct]`, pct the majority party's percent of the TOTAL 1960 House vote within the new district, as
# printed; party by the type weight, bold D, light R (the headnote's rule; for a recomputed figure the weight shows the
# party carrying the area, which is not always the sitting Member's: N.Y. 1 Pike (D) light, N.Y. 15 Carey (D) light,
# N.Y. 16 Ray (R) bold, N.Y. 30 King (R) bold, Ill. 20, Kan. 1). The orchestrator converts: D = pct, or 100 - pct when R,
# the rest taken as the other major party's: an approximation where minor parties ran. `estimated`: the cells a
# footnote marks estimated. `unopposed`: X with the mark, "No major party opposition" within the new district (party
# by weight). `old`: districts printed unmarked with their 1952-60 run (old borders kept, perhaps renumbered); the
# missing list's among them carry their 1960 figure in `d` too. `unmarked`: a single 1960 figure printed WITHOUT the
# mark and without the 1952-58 run (Ill. 13; Mass. 4, 10, 11, 12): the headnote's old-borders rule would print the
# run, so the mark may have been dropped; recorded as printed, for the orchestrator to rule on.
#
# Not final: none. No State line in pp. 724-729 says "redistricting pending"; every State with a missing seat prints
# its 1962 districts (gains or losses noted) or, Texas, its old districts with the new seat at large (old lines kept
# for 1962). North Dakota's line: "No change in number of seats; redistricting bill approved".
# `pages` names the districts with a figure (the orchestrator, on wiring the file in).
