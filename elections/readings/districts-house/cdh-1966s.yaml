# The vote for Representative by congressional district, 1964, 1962, 1960, 1958, 1956 and 1954, on the lines of the 90th
# Congress, for the twenty-four States that redistricted after the 89th Congress's opening: U.S. Bureau of the Census,
# *Supplement to Congressional District Data Book: Redistricted States*, CDDB Supp. Nos. 8-15 and 17-32 (June 1966-Aug.
# 1967), "Districts of the 90th Congress": Utah, South Dakota, Montana, Idaho, Arkansas, Alabama, Indiana, Virginia
# (Nos. 8-15, June 1966), Oregon, Kansas (17, 18, June), Arizona, Florida, Texas, Kentucky, North Carolina (19-23,
# July), Missouri, Ohio (24, 25, Aug.), South Carolina, Mississippi, Illinois (26-28, Oct.), Pennsylvania, New Jersey
# (29, 30, Dec. 1966), Maryland (31, Jan. 1967), Louisiana (32, Aug. 1967); No. 16 is not in this copy. Table "Vote Cast
# and Population", items 11a-13a (1964) and 11-25 ("Vote cast, by major party: For Representative": total, Democratic,
# Republican, each year; no percent printed). The copy read: the University of Michigan's, scanned by Google (Google
# Books; the owner's PDF, "1966 Congressional District Data Supplement.pdf", 327 pp.; a second Drive file,
# "Congressional_District_Data_Book_distric (1).pdf", is the same file, md5 6f3ab312...). `pages` gives the PDF page
# (the supplements' own folios, 3 to 15, repeat from one supplement to the next). Their note (each Supp., p. 1): "Data
# for vote cast in 1964 for President and for Representative have been added; 1952 data for vote cast have been
# omitted"; the 1960 census items "have been retabulated to accord with the newly-defined district boundaries"; "The
# source notes and explanations for the vote cast ... in the Congressional District Data Book apply also to this report
# except as follows": for Representative, 1964, CQ Weekly Report No. 13, "Complete Returns of the 1964 Elections by
# Congressional District," pt. 1, Mar. 26, 1965 (copyright). The House figures are not retabulated: a district whose
# lines changed prints (NA) in every year; those printed are the 1964 returns and the 1963 Data Book's figures of a
# district carried whole into the new plan, renumbered or not (Florida's 3d, 6th, 8th were the 88th's 2d, 10th, 12th).
# Each page's footnotes: "- Represents zero. NA Not available."
#
# Schema: as cdh-1963.yaml, the cells [t, D, R]; `na` the page's (NA) (Illinois's 15th, 1958 Democratic, printed
# "(AN)"); a dash 0; `fn` a footnote mark in place of the figures (Arkansas's State column). `gutter`, `illegible`: a
# district column that runs into the binding of this copy (Alabama's 8th, Virginia's 10th, Louisiana's 8th), and what
# was done. The figures: the scan's text layer (Google's OCR, word by word with its box), set in rows and columns by the
# page's item lines and column heads, and read again by tesseract column by column; the readings voted; then held to the
# State column, to D + R = t, and to the earlier volumes; every cell not so held, every dash and every doubtful or
# missing reading read by eye off the page image at 250-600 dpi (`eye`). Of 4,626 cells: 648 figures, 51 dashes, 3,916
# (NA), 11 footnote marks. Of the figures, 529 equal the 1963 Data Book's (cdh-1963.yaml: 1962-54, the same or a
# renumbered district, and the State columns, all but two) or, for 1964, the Clerk's Democratic and Republican votes for
# the district (every 1964 district figure printed: elections/1964.yaml); 96 more held by D + R = t (or t = D, one
# candidate); 23 by eye alone (32 read by eye in all; the columns in the binding are not in `eye`). The State columns
# differ from the 1963 Data Book's only in Illinois's 1960 total (4,604,573 here, 4,634,573 read there; D + R =
# 4,604,571) and Maryland's 1956 (`printed`); the 1964 State columns are CQ's, and differ from the Clerk's sum of the
# districts in Missouri, New Jersey, Pennsylvania and Virginia. Checks: no State but Arkansas (its dashes) prints every
# district, so no row adds to a State column but those; D + R not over t but as `over`. No United States figures.
