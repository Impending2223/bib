# The vote for Representative by congressional district, 1970, 1968, 1966 and 1964, on the lines of the 92d Congress (as
# constituted for the November 1970 elections): U.S. Bureau of the Census, *Congressional District Data, Districts of
# the 92d Congress*, CDD-92-1 to CDD-92-46 (Mar.-May 1971; a report a State, Alaska, Delaware, Nevada, Vermont and
# Wyoming together in CDD-92-46), the table's "Elections" items ("Vote cast for Representative", 1970: total,
# Democratic, Republican, "Percent for party with most votes"; 1968, 1966, 1964: total, Democratic, Republican). The
# copy read: the University of California's, scanned by Google (Google Books; the owner's PDF, "92d Congress
# Congressional District Data.pdf", 333 pp.); `pages` gives the PDF page (each report is paged by itself). Its note
# (each report, last page): "Data for 1964-1968 are from the National Republican Congressional Committee report,
# Congressional District Vote Comparison, 1970. The original figures for 1964, 1966, and 1968 have been retabulated by
# the Committee to reflect changes in congressional district boundaries up to the time of the 1970 elections. Thus the
# data purport to show what the party vote would have been if the 1970 district boundaries had been in effect for those
# elections. Moreover, it should be noted that the figures for 'vote cast for Representative' in 1964, 1966, and 1968
# are strictly in terms of party vote. The data are not comparable as vote cast for particular candidates. Data for 1970
# were obtained from official State reports of the Secretaries of State." The pages' asterisk: "Data reflect party vote
# only; not comparable as vote cast for individual candidates" (`marks` "*"). New York's D and R leave out the Liberal
# and Conservative lines (its footnotes); New York's 1964 columns print (NA).
#
# Schema: as cdh-1973.yaml, the cells [t, D, R, p] (1970) and [t, D, R]; `na` the page's (NA), a dash 0, `fn` a footnote
# mark printed in place of a figure (New York's 5th and 39th, the 1970 percent); `marks` the footnote marks and
# asterisks printed on a figure; `footnoted` the State figures the districts do not make, every one under a footnote of
# the page (absentee, scattered and minor-party votes not distributed, or "Detail does not add") or a mark on the
# figure; `footnotes` each page's notes, as printed; `note` what the copy forced (columns run into the binding and set
# off their rows: New Jersey's 7th, Missouri's 5th, Ohio's 16th). The figures: the scan's text layer (Google's OCR, word
# by word with its box), set in rows and columns by the item lines and column heads, the footnote marks taken off by the
# sums; read again by tesseract column by column, and the doubtful cells cell by cell; then held to the State column, to
# D + R = t, to each printed percent, and to the Clerk's 1970 returns; every cell not so held and every column out of
# line read by eye off the page image at 300-800 dpi (`eye`). In this face a 4 prints much like a 1: where the image
# cannot tell them apart the reading that makes the sums stands. Of 6,240 cells: 5,434 figures, 166 dashes, 160 (NA),
# 480 percents. Of the figures, 5,213 held by the State column, D + R = t, one candidate's total, or the Clerk's 1970
# Democratic and Republican votes (365 of the 435 districts' 1970 D and R agree with elections/1970.yaml; the rest are
# New York's lines, Alabama's National Democrats, Virginia's and a few figures the State columns hold as printed); 51 by
# D + R within a few votes of t; 74 by the two OCRs alike; 88 by eye alone (94 read by eye in all); 8 a single reading,
# consistent with its row. Checks: every district row held to its State column, item by item, but `footnoted`; D + R not
# over t; each printed percent to its figures but `percent_as_printed` (New York's 25th, 1970). No United States
# figures.
