# U.S. Bureau of the Census, *Congressional District Data, 94th Congress*, CDD-94-1 Texas, CDD-94-2 California, CDD-94-3
# New York (1974; LCCN 74603410; SuDoc C 56.213:94-; a report a State, each paged by itself; the three the series
# printed for the States redistricted for the 1974 elections), the table's "Elections" items 1-21. The copies read, the
# owner's PDFs (Oct. 31, 2026), scanned by Google: Texas and California the Cornell University Library's (HathiTrust
# coo.31924086721408, coo.31924086721416, full view; record 009142830), New York the University of Minnesota's (not on
# HathiTrust); `pages` gives the PDF page. Its note (each report, "Vote cast, by major party"): "Source: National
# Republican Congressional Committee. Data retabulated in accordance with congressional districts as constituted for the
# 1974 elections ... Figures are for districts as constituted for the November 1974 congressional elections and not as
# they were at the time of each election. The original figures for each election year shown were retabulated by the
# Committee to reflect the congressional district boundaries as established for the 1974 elections. Thus, the data
# purport to show what the party vote would have been if the 1974 boundaries had been in effect for each election.
# Furthermore, it should be noted that the figures for 'vote cast for Representative' are strictly in terms of party
# vote, and are not necessarily comparable as vote cast for particular candidates. Also, the vote cast for third parties
# endorsing the major party candidates ..." (the sentence the 1973 Data Book also prints: in the total, not in the
# party's column, so New York's D and R leave out the Liberal, Conservative and other lines, each by a footnote). New
# York's report (p. 1): "Redistricting legislation enacted for New York effective May 29, 1974, changed only the
# boundaries for congressional districts 12, 13, 14, and 15 from that for the 93d Congress"; those four print "(NA)".
#
# This file: items 13-21, "Vote cast for President", 1972 (total, Democratic Party, Republican Party, percent) and 1968
# (the same and the American Independent Party). The House items are districts-house/cdh-1974.yaml, whose header gives
# how the figures were read and checked; 1972 prints no third party's column (`nil` in A). Used by
# tools/elections/make_pvi.py (the 1974 PVI, on the 94th Congress's lines); shown by tools/bib/pvi.py.
