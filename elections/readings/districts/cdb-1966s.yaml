# The vote for President by congressional district, 1964, 1960 and 1956, on the lines of the 90th Congress, for the
# twenty-four States that redistricted after the 89th Congress's opening: U.S. Bureau of the Census, *Supplement to
# Congressional District Data Book: Redistricted States*, CDDB Supp. Nos. 8-15 and 17-32 (June 1966-Aug. 1967),
# "Districts of the 90th Congress" (the States and dates: districts-house/cdh-1966s.yaml, whose header gives the copy,
# the note and the method); No. 16 is not in this copy. Table "Vote Cast and Population", items 1a-4a (1964: total,
# Democratic, Republican, "Percent vote for majority party") and 1-7 (1960, the same; 1956, no percent), which "are
# replacements for items 8 to 10 and 26 to 28, 'Total vote cast, 1952,'" of the 1963 Data Book (each page's head). The
# source for 1964 (each Supp., p. 1): the Governmental Affairs Institute, *America at the Polls* (1965; copyright); for
# 1960 and 1956, the 1963 Data Book's (CQ and *America Votes*). The figures are given for the new districts (Utah's,
# Idaho's, Montana's differ from the 88th's), (NA) where a district could not be made up; the State columns are the 1963
# Data Book's for 1960 and 1956, all 144 figures alike (districts/cdb-1963.yaml), and for 1964 the Clerk's Democratic
# and Republican votes in every State (elections/1964.yaml; the totals differ in Alabama, Maryland, New Jersey,
# Pennsylvania, South Carolina and Utah). Used by tools/elections/make_pvi.py; shown by tools/bib/pvi.py.
#
# Schema: as cdb-1961.yaml (its header), the cells [t, D, R, p] (1956 [t, D, R]); `na` the page's (NA), a dash 0
# (Alabama's 1964 Democratic row: no slate pledged to Johnson); `gutter`, `illegible`, `note`: a district column that
# runs into the binding of this copy (Alabama's 8th, Virginia's 10th, Louisiana's 8th, Kentucky's 7th), and what was
# done. The figures: as the House's (cdh-1966s.yaml), the text layer and tesseract voted, then held to the State column,
# to D + R = t and to each row's printed percent; every cell not so held, and every doubtful reading, read by eye off
# the page image (`eye`). Of 2,827 cells: 1,317 figures, 6 dashes, 990 (NA), 514 percents (one not legible, null). Of
# the figures, 187 State columns equal the 1963 Data Book's or the Clerk's; 823 held by the State column (Arkansas,
# Idaho, Mississippi, Montana, North Carolina, South Carolina, South Dakota, Utah, all three years; Louisiana 1960 and
# 1956), D + R = t or the printed percent; 307 by eye alone (327 read by eye in all; the binding columns not in `eye`).
# Checks: every district row held to its State column where no district is (NA); D + R not over t but as `over`
# (Illinois's 22d, 1960); each printed percent to its figures (Mississippi's 1960 percents are the Democrats', footnote
# 1). No United States figures.
