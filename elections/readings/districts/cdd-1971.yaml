# The vote for President by congressional district, 1968 and 1964, on the lines of the 92d Congress (as constituted for
# the November 1970 elections): U.S. Bureau of the Census, *Congressional District Data, Districts of the 92d Congress*,
# CDD-92-1 to CDD-92-46 (Mar.-May 1971), the table's "Elections" items ("Vote cast for President, 1968": total,
# Democratic, Republican, American Independent (so labeled in most States; "George Wallace Party", "George C. Wallace
# Party", "Courage" in New York), "Percent for party with most votes"; "Vote cast for President, 1964": total,
# Democratic, Republican). The copy, the note and the method: districts-house/cdh-1971.yaml. The figures are the
# National Republican Congressional Committee's, "retabulated by the Committee to reflect changes in congressional
# district boundaries up to the time of the 1970 elections" (each report's note). Alabama's 1968 Democratic figures are
# Humphrey's under the Alabama Independent Democratic Party and the National Democratic Party of Alabama, its American
# Independent figures Wallace's under the Democratic Party's banner (footnotes 4, 5); its 1964 Democratic figures are
# the unpledged Democratic electors'. Used by tools/elections/make_pvi.py; shown by tools/bib/pvi.py.
#
# Schema: as cdb-1973.yaml (its header), the cells [t, D, R, A, p] (`fields`); 1964 [t, D, R, nil], no third column
# printed. `marks`, `footnoted`, `footnotes`, `note`: as cdh-1971.yaml. Of 3,840 cells: 3,234 figures, 126 (NA), 480
# percents. Of the figures, 2,290 held by the State column or D + R (+ A) = t; 151 by D + R (+ A) within a few votes of
# t; 566 by the two OCRs alike; 166 by eye alone (the binding columns read in order: New Jersey's 7th, Missouri's 5th,
# Ohio's 16th, Michigan's 3d to 8th, North Carolina's 3d and 4th); 61 a single reading, consistent with its row (others
# under 1 percent of the total). Against the other volumes: the 14 districts whose lines the 93d Congress kept give the
# same 1968 figures as cdb-1973.yaml, all four columns; of 61 districts whose lines the 90th Congress had, 53 give the
# same 1964 figures as cdb-1966s.yaml (America at the Polls); of the rest, five are Alabama's (the unpledged electors'
# vote, a Democratic figure here, a dash there), and Kentucky's 6th and 7th and Pennsylvania's 6th differ by up to
# 2,204. Checks: every district row held to its State column but `footnoted`; D + R + A not over t; each printed percent
# to its figures. No United States figures.
