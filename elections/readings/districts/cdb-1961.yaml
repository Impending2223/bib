# The vote for President by congressional district, 1952, 1956 and 1960, on the lines of the 87th Congress:
# U.S. Bureau of the Census, *Congressional District Data Book (Districts of the 87th Congress)* (1961), table 1, items
# 75-84 ("Vote cast, by major party: For President"), pp. 5-71. The copy read: Boston Public Library's, archive.org
# congressionaldis1961unit (printed page = PDF page - 30). Its sources (p. XI): 1952, the Republican Congressional
# Committee's *Congressional and Presidential Vote Comparison* (1957); 1956, Congressional Quarterly Weekly Report,
# supplement to May 10, 1957; 1960, CQ Weekly Report, pt. II of Mar. 10, 1961. "The 1956 and 1960 figures are
# copyrighted by Congressional Quarterly News Features and may not be reproduced without permission from that
# organization" (p. XI): used by tools/elections/make_pvi.py; shown, cited and attributed, by tools/bib/pvi.py (the owner, Oct. 28, 2026).
# The volume's general note (p. XI): between 1952 and 1960 Kentucky (Feb. 1956), Mississippi (Apr. 1956), Texas (May
# 1957), Washington (Mar. 1957, 1959) and Virginia (Jan. 1959) changed some districts' lines; the figures are not
# said to be recomputed, and the footnotes mark Texas's 8th and 22d and Washington's.
#
# Schema (a State an entry, in the volume's order):
#   pages: {printed page: [columns]}       0 the State column; districts by number (a single-district State: 0)
#   d: {district: {1960: [t, D, R, p], 1956: [t, D, R], 1952: [t, D, R]}}   (items 75-84 in that order)
#       t total vote cast, D Democratic, R Republican, p the printed "percent vote for majority party" (1960 only;
#       null where not read: it is not used); fn: the cell holds a footnote mark (its text in `footnotes`, by page:
#       "Not available" and the like); nil: the cell holds dots or nothing (no vote there that year)
#   combined: [district]                   a district whose earlier figures stand under another's (counted as zero)
#   marks: {"district year field": n}      a footnote mark printed on a figure or a cell
#   eye: ["district year field", ...]      figures read by eye off the page image; the rest are the OCR's readings
#       (four: the page in columns, each cell alone at three settings), agreeing, or the one reading of several that
#       makes the State's printed total; every district row is held to its State total, every State row to the
#       printed United States total (p. 2), and each 1960 row to its printed percent
#   adjust: {"year field": n}              the State total = the districts + n, as its footnote says
#   footnoted: ["year field"]              a State total its footnote says includes votes not shown by district
#   over: ["district year"]                D and R exceed the total, as printed
#   percent_as_printed: ["district year"]  a printed percent the figures do not give, as printed
#   printed: >-                            what the page prints that does not add, in words
