# The vote for President by congressional district, 1968, on the lines of the 93d Congress (as constituted for the
# November 1972 elections): U.S. Bureau of the Census, *Congressional District Data Book, 93d Congress* (1973; H. Doc.
# 93-109), table 1, items 13-17 ("Vote cast for President, 1968": total, Democratic Party, Republican Party, American
# Independent Party, percent for party with most votes), pp. 2-545. The copy read: the NIH Library's, archive.org
# congressionaldis00unit (printed page = PDF page - 22; the Boston Public Library's copy, congressionaldis1973unit, the
# same edition). Its note (pp. X-XI): the elections data "were obtained from the National Republican Congressional
# Committee", its *Congressional District Vote Comparison, Tabulated in Accordance with Congressional Districts as
# Constituted for the 1972 Elections*; "The original figures for each election year shown were retabulated by the
# Committee to reflect the congressional district boundaries as established for the 1972 elections ... the vote cast
# for third parties endorsing the major party candidates are excluded from figures shown here for 'Democratic' and
# 'Republican' but included in the total vote cast in the district" (so New York's Democratic figures leave out
# Humphrey's Liberal line). Kept for computation (tools/elections/make_pvi.py); not shown on any page.
#
# Schema: as cdb-1961.yaml (its header), the cells [t, D, R, A, p] (`fields`); `na` the page's "(NA)". The figures:
# the OCR's readings (each page's block deskewed and read whole and cell by cell, at three settings), the agreeing or
# the majority reading, every page then proofed by eye against an overlay of the readings on its image; `eye` lists
# the figures entered by eye. Checks: every district row held to its State column, item by item, where no footnote
# says the State column holds votes not distributed by district (`footnoted`: eighteen States; `adjust`: New Mexico's
# 69); every row's printed percent to its figures (none off); D + R + A not over t (`over`: California's 12th). The
# United States figures (p. 2) are not the States' sum (`us_note`); no District of Columbia column.
