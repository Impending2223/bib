# Presidential primaries, 1960-1976: CQ's *Guide to U.S. Elections*, 6th ed. (2010), ch. 11, "Presidential
# Primary Returns, 1912-2008", pp. 404-422; kept by hand (read from the pages; every party's races add to CQ's
# printed totals). The build renders them: tools/bib/primaries.py (STYLE notes there).
#
# <year>:
#   pages: the pages read
#   star: CQ's note on the year's heading (delegate-selection primaries without a preference vote)
#   notes_page: the page CQ prints the year's notes on
#   footnotes: CQ's notes, by number, as printed
#   races: by date as CQ orders them
#     - {date, st (postal code), page (the page the race begins on), page_to (where it runs onto the next), fn (notes
#       on the State's heading)}
#       R, D: the party's returns, in CQ's order: {n: name as printed, v: votes, p: share as printed ('—' for
#             less than 0.05), nfn: notes on the name (1 = write-in), vfn: notes on the votes}; a party with no
#             returns: {fn: [the note printed in their place]}
#   totals: {R, D}: CQ's printed total of the year's primary votes, and its page

