  footnotes:
    1: Write-in.
    2: 'Prior to the primary, the District Republican organization agreed to divide the nine delegate votes, with six going to Nixon and three going to Rockefeller, according to the 1968 Congressional Quarterly Almanac, Vol. XXIV. Figures obtained from Scammon’s office.'
    3: 'Figures obtained from Scammon’s office. Two slates favored Humphrey; a member of an “independent” Humphrey slate received 2,250 votes.'
    4: 'Figures obtained from Scammon’s office. In America Votes, Scammon did not record vote totals if a candidate was unopposed or if the primary was strictly for delegate selection.'
    5: 'In the American Party presidential primary, Wallace received 493 of the 504 votes cast, or 97.8% of the vote, according to the office of the Nebraska secretary of state.'
    6: 'In addition to scattered votes, “others” includes Willis E. Stone who received 527 votes, Herbert F. Hoover who received 247 votes, David Watumull who received 161 votes, William W. Evans who received 151 votes, Elmer W. Coy who received 73 votes, and Don DuMont who received 39 votes in the New Hampshire primary, and Americus Liberator who received 1,302 votes in the Nebraska primary.'
    7: 'In addition to scattered votes, “others” includes John G. Crommelin who received 186 votes, Richard E. Lee who received 170 votes, and Jacob J. Gordon who received 77 votes in the New Hampshire primary.'
