1964:
  pages: '406–408'
  notes_page: 408
  footnotes:
    1: Write-in.
    2: No primary authorized.
    3: 'Source: District of Columbia Board of Elections. No figures available for vote for delegates to Republican convention.'
    4: 'Figures obtained from Scammon’s office. In America Votes, Scammon did not record vote totals if a candidate was unopposed or if the primary was strictly for delegate selection.'
    5: Gov. Edmund G. Brown (D Calif.) headed the winning state of delegates and Mayor Sam Yorty of Los Angeles headed the losing slate.
    6: 'In addition to scattered votes, “others” includes Norman LePage who received 82 votes in the New Hampshire primary, Frank R. Beckwith who received 17,884 votes and Joseph G. Ettl who received 6,704 votes in the Indiana primary, and John W. Steffey who received 22,135 votes and Robert E. Ennis who received 18,859 votes in the Maryland primary.'
    7: 'In addition to scattered votes, “others” includes Lar Daly who received 15,160 votes, John H. Latham who received 8,067 votes, and Fay T. Carpenter Swain who received 7,140 votes in the Indiana primary, and Andrew J. Easter who received 8,275 votes in the Maryland primary.'
