      what: 'Act No. 202 (S. 2), passed the Senate June 20, the House Aug. 3, 1967, proposes § 116 anew: "Each of said officers shall be eligible to succeed himself in office, but no person shall be eligible to succeed himself for more than one additional term." The election on it ordered for the general election next after the session (Nov. 5, 1968).'
