# The bars on a governor's re-election, 1960-68, in each State whose incumbent was barred (kept by hand; the owner's
# request, Oct. 23, 2026: "the authority and reason for the bar, and its scope, given"). Wikipedia's race tables say
# only "term-limited" (elections/governors.yaml); tools/bib/governors.py (STYLE 9) puts the provision in force on the
# day of each such race into the race's note: "barred from another term (Mo. Const. art. IV, § 17 (1945, amended 1965): not
# eligible for election as his own successor)".
#
# <postal code>:
#   state: the State's name
#   rules:            the provisions in force, in order; a race takes the one whose span holds its date
#     - cite:         the provision, as the Bluebook cites it ("Fla. Const. of 1885, art. IV, § 2 (superseded 1968)");
#                     null where it is not yet read
#       short:        the bar in a few words, for the race's note
#       words:        the bar's words, quoted from the source read (the clause only)
#       scope:        consecutive or for life; how many terms; whether a partial term counts, as the words say
#       from, to:     the span it governed: from its adoption (a year or a date) to the day the next rule took
#                     effect (to is exclusive; none: still in force)
#       sources:      [{label, page, url}]: each read, by page; the first is the cite's link
#       check:        what the sources read do not settle (shown in the race's note, "Check: ...")
#   changes:          [{date, what, sources}]: the amendments since, each as its record gives it
#   today:            {cite, words, sources}: the provision now, as the State's own site prints it (read Oct. 24, 2026)
#   check:            what is still open about the State (not shown in the notes)
#
# Thorpe: Francis Newton Thorpe, *The Federal and State Constitutions* (1909), 7 vols., the texts as of 1909, read on
# archive.org (federalstatecons01thor ... federalstatecons07thor), by the volume's page. A text of 1909 stands for the
# 1960s only where a later record shows it unchanged; otherwise the rule carries a Check. Host access as found Oct.
# 24, 2026: sos.mo.gov's PDF (Cloudflare challenge), legis.ga.gov (challenge), oscn.net (Turnstile), sos.tn.gov and
# capitol.tn.gov (refused or not found), ballotpedia.org (challenge) were not read; the *Book of the States* and the
# *Index Digest of State Constitutions* (1959) are borrow-only on archive.org.

