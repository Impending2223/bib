# Hand facts for the elections: what the Clerk's volumes and Wikipedia's tables do not give in a form the
# generators can read. Kept by hand. Read by tools/elections/president.py (president:) and by
# tools/bib/elections.py and congress.py (caucus:, alabama_1960:). ./bib check names anything missing.

# Winners and members of neither major party, by surname (matched only where the party is not D or R):
# the label shown, and the party they caucused with. They count with that party in seats won, net
# change and pickups, and take a striped variant of its color. check fails on a winner or a roster
# member of neither major party who is not here.
caucus:
  buckley: {name: 'James L. Buckley (N.Y., Senate, 1970)', label: Conservative, caucus: R}
  byrd: {name: 'Harry F. Byrd Jr. (Va., Senate, 1970)', label: Independent, caucus: D}
  moakley: {name: 'Joe Moakley (Mass. 9th, 1972)', label: Independent, caucus: D}
  fulton: {name: 'Richard Fulton (Tenn. 5th, 1962; printed Independent Democrat by the Clerk)', label: Independent Democrat, caucus: D}

president:
  # Wikipedia's column heads (results by State) where they are not the candidate's name.
  names:
    T. Coleman Andrews/Unpledged Electors: T. Coleman Andrews; unpledged electors
    Unpledged Electors: Unpledged electors
    Nixon/Agnew: Richard Nixon
    McGovern/Shriver: George McGovern
    Schmitz/Anderson: John G. Schmitz
    Hospers/Nathan: John Hospers

  # Electors as they voted, where a State's did not all vote for the candidate whose slate won.
  # Keys: a candidate's key (D, R, U unpledged, A American Independent) or an electee below.
  cast:
    1956: {AL: {D: 10, Jones: 1}}                         # an elector pledged to Stevenson voted for Walter B. Jones
    1960: {AL: {D: 5, Byrd: 6}, MS: {Byrd: 8}, OK: {R: 7, Byrd: 1}}
    1968: {NC: {R: 12, A: 1}}
    1972: {VA: {R: 11, Hospers: 1}}

  # The candidates for Vice President on each ticket, by the presidential candidate's key. The Clerk's table of
  # electoral votes for President and Vice President heads its columns by the presidential candidates only; a
  # running mate's electoral votes are the ticket's, except where an elector split them (vice_cast).
  vice:
    1960: {D: Lyndon B. Johnson, R: Henry Cabot Lodge}
    1964: {D: Hubert H. Humphrey, R: William E. Miller}
    1968: {R: Spiro T. Agnew, D: Edmund S. Muskie, A: Curtis E. LeMay}
    1972: {R: Spiro T. Agnew, D: R. Sargent Shriver, A: Thomas J. Anderson, Hospers: Theodora Nathan}
  # Electors for a presidential electee who voted for another for Vice President: the unpledged electors' 14 for
  # Thurmond (Alabama 6, Mississippi 8) and Oklahoma's elector for Goldwater.
  vice_cast:
    1960: {Byrd: {Strom Thurmond: 14, Barry Goldwater: 1}}

  # Who received electoral votes without a slate of their own; 'like' is the key whose color they take.
  electees:
    Jones: {name: Walter B. Jones, like: O}
    Byrd: {name: Harry F. Byrd, like: U}
    Hospers: {name: John Hospers, like: O}

  # A slate's candidate where Wikipedia's figures would assign it otherwise: year, State, party as printed.
  slates:
    1960: {AL: {Democratic: D}}                          # five Kennedy electors and six unpledged: counted with Kennedy
    1968: {AL: {Alabama Independent: A}}                 # Wallace's second slate (the State article's elector table)
    1972: {SC: {United Citizens: D}}                     # McGovern's fusion line


