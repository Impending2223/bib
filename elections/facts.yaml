    1960:
      AL: The Democratic slate, five electors pledged to Kennedy, six unpledged; its vote is counted with Kennedy.
    1964:
      AL: Johnson had no slate; the Democratic slate was unpledged.
    1968:
      AL: Humphrey ran on two slates, the Democratic and the National Democratic.
    1972:
      AL: McGovern ran on two slates, the Democratic and the National Democratic.

# 1960: the note to the popular vote reckons Alabama three ways (tools/bib/elections.py pres_summary).
alabama_1960:
  kennedy_top_elector: 318303          # Kennedy's own leading elector in Alabama (Wikipedia, from the State's canvass)
  cq_share: [5, 11]                    # Congressional Quarterly: the slate's vote divided by its electors
  cq_share_words: five-elevenths
  source: >-
    Brian J. Gaines, "Popular Myths about Popular Vote–Electoral College Splits," PS: Political Science and
    Politics 34 (2001).
  guide: >-
    CQ's Guide to U.S. Elections, 6th ed. (2010), p. 789, counts the whole slate with Kennedy (324,050), as here.
  check: >-
    Check: Kennedy's leading elector, 318,303, against Alabama's official canvass; where Congressional Quarterly gave
    the five-elevenths reckoning (not the Guide's table); Mississippi's unpledged slate against the State's canvass.

# The Senate at the opening of a Congress that has no roster in congress/ (the 86th, 94th): the party division the
# Senate Historical Office gives (senate.gov, "Party Division"), at the opening, before later admissions and
# vacancies filled. Shown in the election's Senate summary (tools/bib/elections.py, senate_opening).
senate_opening:
  86: {D: 64, R: 34}                  # Jan. 7, 1959; Hawaii's two Senators (Aug. 1959) not yet seated
  94: {D: 60, R: 37, others: ['1 Independent, caucusing with the Democrats (Byrd)', '1 Conservative, caucusing with the Republicans (Buckley)', '1 vacant (New Hampshire, contested)']}
