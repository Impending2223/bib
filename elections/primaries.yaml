# Senate primaries, from CQ's *Guide to U.S. Elections*, 6th ed. (2010), vol. 2, primary returns (kept by hand). Keyed
# by the November race (the readings' key, with the year). A round: its label as CQ prints it, then the candidates,
# each [name, party, votes, share]: votes null where CQ prints only a share (100.0, unopposed); shares as printed (they
# count candidates CQ leaves out, so they need not add to 100). CQ's footnotes to a year or a round are not read here
# (marked "footnote" on the race). A name entry's row for the race shows the rounds that name the person, before the
# November vote; an incumbent who lost renomination, the round he lost. Read Oct. 8, 2026, from the owner's page images.

