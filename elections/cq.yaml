  1958 s NM 1, 1964 s NM 1, 1970 s NM 1, 1972 s GA 2: 'CQ, pp. 1456, 1441: as the Clerk.'
  # the House pages compared Oct. 8, 2026: 570 figures, the two leading candidates (CQ prints no minor ones). Six
