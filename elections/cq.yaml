# Congressional Quarterly's *Guide to U.S. Elections*, 6th ed. (2010), compared with the Clerk's figures in
# elections/<year>.yaml (kept by hand; not read by the build). The Clerk stands (tools/elections/read.py): where CQ
# differs, the Clerk's page was read again, and the figures here are as printed there. Pages are the Guide's.
# CQ's figures fill a race only where the Clerk prints none (readings: source); the specials are
# congress/specials-cq.yaml.

president:
  1960:
    page: 789
    compared: every State but Kentucky to Michigan (the pages read); Kennedy and Nixon
    differ:
      TX: 'Clerk: Democratic 1,167,932, Republican 1,121,699 (OCR, settled against the total). CQ: Kennedy 1,167,567, Nixon 1,121,310. The Secretary of State''s compilation (presidential.shtml) gives the Clerk''s figures; the canvass is on paper (State Archives, 1989/064-12).'
      WY: 'Clerk: Republican 76,551 (page re-read Oct. 8, 2026; the recapitulation agrees). CQ: Nixon 77,451, with the canvass (1961 Official Directory, p. 53), which now stands.'
    note: >-
      CQ counts Alabama's whole Democratic slate with Kennedy (324,050), as here, and Mississippi's unpledged slate
      apart (116,248), as the Clerk; its totals: Kennedy 34,226,731, Nixon 34,108,157 (here 34,227,096 and
      34,108,546, with Wyoming's canvass: the Texas difference).
  1968:
    page: 791
    compared: Alabama to Hawaii; Nixon, Humphrey, Wallace
    differ:
      AR: 'Clerk: Republican 189,062, Democratic 184,901, American Independent 235,627. CQ: 190,759, 188,228, 240,982. The Secretary of State''s Historical Report (2008, p. 586) gives the Clerk''s.'
      CA: 'Clerk: 3,407,851, 3,186,270, 481,665. CQ: 3,467,664, 3,244,318, 487,270, the State canvass (Statement of Vote), which now stands (readings).'
      CO: 'Clerk: Democratic 331,063 (read by eye). CQ: Humphrey 335,174, the State''s Abstract (p. 22), which now stands.'
      GA: 'Clerk: Republican 366,611, Democratic 334,439 (page re-read Oct. 8, 2026; the recapitulation agrees). CQ: Nixon 380,111, Humphrey 334,440, the State''s tabulation, which now stands.'
  1972:
    page: 792
    compared: Alabama to Louisiana; Nixon, McGovern, Schmitz
    differ:
      AL: 'Clerk: Conservative (Schmitz) 11,918, the highest elector in the State''s Register (1975, p. 249). CQ: 11,928, on no elector.'
      AR: 'Clerk: Republican 445,751, Democratic 198,899, American Independent 3,016. CQ: 448,541, 199,892, 2,887, with the Secretary of State''s Historical Report (2008, p. 586), a later compilation. Check.'
      CA: 'Clerk: 4,544,134, 3,431,824, 230,496. CQ: 4,602,096, 3,475,847, 232,554, the State canvass (Statement of Vote), which now stands (readings).'

