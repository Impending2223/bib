# The national conventions, 1960-1968: each delegation's votes, how it was chosen, and the roll calls; kept by hand.
# The build renders them: tools/bib/conventions.py (STYLE notes there). Read off the pages; every figure cited by page.
#
# <YYYY>-<R|D>:
#   name: the convention, as its Proceedings name it
#   opened, closed: its first and last days
#   proc: the Proceedings: {title (italics in *...*), year, url (the copy read), page_url (the printed page in place of
#         {p}), access (open, borrow)}
#   call: the Call: {issued (the date it bears), pages (where the Proceedings print it), table (the apportionment's
#         pages), total (the printed total of delegates)}
#   methods: where the methods and dates of choosing come from: {cite, url, read (the date read), check (what to read
#            them against)}
#   states: by postal code (DC, PR, VI too), in the Call's order:
#     votes (the Call's total for the State), at_large, districts (the number of districts sending two delegates; the
#     Call: at_large + 2 x districts = votes), page (the Call's page);
#     method: primary (every delegate chosen in a primary), mixed (the districts' delegates in a primary, those at
#       large by a convention or a committee), conventions (district conventions and a State convention), convention
#       (a State convention alone), committee (a State committee alone), null (not found);
#     chosen: [{by: the body, dates: [its dates]}], as the methods' source gives them;
#     check: what is still to verify for the State (shown in the table's note)
#   ballots: by key; a calendar entry tagged rollcall:<YYYY>-<R|D>-<key> carries its table:
#     office, title (the Proceedings' heading of the tabulation), session (the session and its day), pages (the roll
#     call's pages), table (the tabulation's pages), needed (the majority), cands (the tabulation's columns, in its
#     order), totals (its printed totals), votes ({State: {candidate: votes}}; every State's add to its votes);
#     final: the tabulation after the delegations changed their votes: {title, table, totals, votes (the States that
#       differ from "all for" the nominee), note}; star: the Proceedings' note on a starred State, {st, text, page}
#   names: the tabulations' surnames, the full names (the Proceedings' own forms), for the name entries

