      when: June
      date: 1965-06
      thread: republican-party
      c: Clay, the retired general, takes over as finance chairman of the Republican National Committee, Bliss's choice. The
        finance committee raises $4 million in 1965, $7.1 million in 1966.
      n: '[[w.hess-republican-establishment]], 46–47. Names: Clay, Bliss.'
      src:
        c: dc3c7aa0
        rows:
