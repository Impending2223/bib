- add:
    entry:
      id: cal.1962-02.republican-party-2
      when: Feb.
      date: 1962-02
      thread: republican-party
      c: 'The Republican National Committee''s executive committee, at Miller''s urging, on the plan of Warner, whom Miller
        had brought from the Congressional Campaign Committee, agrees to try mail appeals for $10 gifts: 20,000 letters from
        the committee''s own lists, in New Jersey, Montana and Missouri. Three percent answer; the "sustaining member" program
        follows, on lists bought by the thousand.'
      n: '[[w.hess-republican-establishment]], 60 (the test, the answers), 46 (the program). Names: Miller, Warner.'
      src:
        c: 8c8626a0
        rows:
        - 'w.hess-republican-establishment 60: all'
        - 'w.hess-republican-establishment 46: C'
      tags:
      - name:miller-william-e
      - name:warner-william-s
- add:
    entry:
      id: cal.1962-12.republican-party-2
      when: Dec.
      date: 1962-12
      thread: republican-party
      c: Cambridge, Mass. The Ripon Society founded by seventeen young men, most of them graduate students at Harvard and
        MIT, on the model of the Bow Group, the British Conservatives' research circle. Saloma its president.
      n: '[[w.hess-republican-establishment]], 68 & n.*. Names: Saloma.'
      src:
        c: 1476294e
        rows:
        - 'w.hess-republican-establishment 68: all'
      tags:
      - name:saloma-john-s-iii
