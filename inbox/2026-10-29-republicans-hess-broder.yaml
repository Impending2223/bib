- add:
    entry:
      id: cal.1967-05-10.republican-party-congress
      when: May 10
      date: '1967-05-10'
      thread: republican-party-congress
      c: 'Bowling Green, Ohio, at Bowling Green University. Ford: thirty-one more seats would give the Republicans the House.
        "My Southern Strategy": "to drive Southern Democrats in the House into the arms of the Administration—where they belong—on
        votes that will hurt them in their home congressional districts," against "the old pattern of a Southern Democrat-Republican
        coalition"; "far better to lose a few legislative battles and win the next election."'
      n: 'The speech, as Burleson read it in the House: [113 Cong. Rec. 12611](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-1-2.pdf#page=2)
        (May 15, 1967). [[w.hess-republican-establishment]], 29 (the speech, a week before the vote on rent supplements; the
        strategy''s words). Names: Ford.'
      src:
        c: e33cf23b
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-1-2.pdf#page=2: all'
        - 'w.hess-republican-establishment 29: A, C-D'
      tags:
      - name:ford-gerald-r
- add:
    entry:
      id: cal.1967-05-15.republican-party-congress
      when: May 15
      date: '1967-05-15'
      thread: republican-party-congress
      c: 'House. Burleson reads from Ford''s speech at Bowling Green, "one of the most irresponsible statements made by a
        distinguished leader of this great institution": the minority leader "is not ''driving'' anyone anywhere on this side
        of the aisle." Ford: Republicans will make their own policy; "we are not going to have a Democrat or a segment of
        the Democratic Party determine our policy." Burleson: of the coalition, "there is no such thing, and there never has
        been."'
      n: '[113 Cong. Rec. 12611–12](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-1-2.pdf#page=2)
        (May 15, 1967). See [[cal.1967-05-10.republican-party-congress]]. Names: Burleson, Ford.'
      src:
        c: fd0b759b
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-1-2.pdf#page=2: all'
      tags:
      - name:burleson-omar-t
      - name:ford-gerald-r
