- edit:
    id: cal.1966-12-09.elections-1968-us
    base: 58b4078f
    set:
      c: 'Republican governors and governors-elect at the Broadmoor, Colorado Springs. Love chairman of their association,
        Chafee vice chairman, to succeed him in Dec. 1967; Reagan and Kirk to its executive committee. Bliss''s "unity," and
        a resolution of support for him; Reagan, asked by Love, recites the "Eleventh Commandment." Romney keeps the meeting
        off 1968. Evans: "the luxury of choice." Check the days.'
      n: '*Ripon Forum*, [Jan. 1967, 3–6](https://riponsociety.org/wp-content/uploads/2023/12/1967-01_Vol-III_No-1.pdf) (Check
        against the press). [[w.hess-republican-establishment]], 1 (Evans), 33 (Love and Chafee). To check: [[w.sparacino-democratic-and-republican-governors]];
        [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-12-04.elections-1964-us]]; [[cal.1966-11-08.elections-1966]]. Names:
        Chafee, Reagan, Kirk, Romney, Love, Bliss.'
      tags:
      - name:love-john-a
      - name:chafee-john-h
      - name:reagan-ronald
      - name:kirk-claude-r-jr
