- edit:
    id: cal.1967-05-24.school-aid
    base: 9cfbfa8c
    set:
      c: 'The House passes the Elementary and Secondary Education Amendments, H.R. 7819, [294–122](https://voteview.com/rollcall/RH0900061);
        recommittal lost, [180–236](https://voteview.com/rollcall/RH0900060). Amendments carried: Title I''s money by the
        national average expenditure per pupil, [222–194](https://voteview.com/rollcall/RH0900058); Title III''s supplementary
        centers through the State departments of education, not to the localities direct, [230–185](https://voteview.com/rollcall/RH0900059).
        Quie''s amendment, the House Republicans'' effort to move the act''s control from the Office of Education to the States,
        rejected by tellers, 168–197.'
      n: '[113 Cong. Rec. 13845](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-8-2.pdf#page=39)
        (May 24, 1967) (Quie''s amendment). [[w.hess-republican-establishment]], 28 (Quie''s amendment). To check: [[w.graham-uncertain-triumph]].
        See [[cal.1965-01-12.school-aid]]. Names: Quie.'
      also:
      - republican-party-congress
      tags:
      - name:quie-albert-h
      src:
        c: 46bd8ad5
        rows:
