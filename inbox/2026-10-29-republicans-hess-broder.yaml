      when: Apr. 28
      date: '1967-04-28'
      thread: republican-party
      also:
      - states-and-cities
      c: The Republican Governors Association announces a Washington office, in the building of the Republican National Committee,
        which gives it $90,000 for 1967. Smylie, its chairman to Dec. 1966, had run it from Boise.
      n: '[[w.hess-republican-establishment]], 33 n.* (the office), 33 (Smylie). See [[cal.1966-12-09.elections-1968-us]].
        Names: Smylie.'
      src:
        c: 8f7fb414
