      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1965-01-22.republican-party
      when: Jan. 22
      date: '1965-01-22'
      thread: republican-party
      c: 'Chicago. The Republican National Committee elects Bliss chairman, unanimously; Burch to stay until April, by the
        terms settled with Goldwater at his home in Phoenix. The committee approves Laird''s plan for a Republican Coordinating
        Committee. Its members, by Hess and Broder''s account: Eisenhower, five of the Senate''s Republican leaders, seven
        of the House''s, five governors, the four living defeated nominees, five of the national committee, one State legislator.
        Bliss to the committee: "I am no modern miracle man, but I will work hard and try to do a job for you."'
      n: '[[w.hess-republican-establishment]], 42 (the meeting, the election, the terms), 51 (the Coordinating Committee,
        its members), 54 (Bliss''s words). Check: the Coordinating Committee''s members at its founding; Hess and Broder give
        them undated. See [[cal.1965-01-12.elections-1964]]. Names: Bliss, Burch, Goldwater, Laird, Eisenhower.'
      src:
        c: d154f036
        rows:
        - 'w.hess-republican-establishment 42: A-C'
        - 'w.hess-republican-establishment 51: D-E'
        - 'w.hess-republican-establishment 54: F'
      tags:
      - name:bliss-ray-c
      - name:burch-dean
      - name:goldwater-barry-m
      - name:laird-melvin-r
      - name:eisenhower-dwight-d
