- edit:
    id: cal.1964-12-04.elections-1964-us
    base: 1d5ae079
    set:
      c: 'Republican governors and governors-elect at Denver. Smylie, chairman of their association, opens: "We are a defeated
        party with a defeated leadership." A statement on the party''s leadership, for "a policy of inclusion"; Rockefeller,
        Romney and Scranton say Burch should be replaced; Smylie presses hardest for a declaration. Morton and Bob Wilson,
        the campaign committees'' chairmen, counsel against removing Burch; Nixon, by telephone to governors there, the same.
        Check.'
      n: '*Michigan Daily*, Dec. 9, 1964 (AP) (Check against the press). [[w.hess-republican-establishment]], 1 (Smylie''s
        words), 40–41 (the statement''s words; Rockefeller, Romney and Scranton; Morton, Wilson and Nixon). To check: [[w.sparacino-democratic-and-republican-governors]];
        [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-11-03.elections-1964-2]]. Names: Rockefeller, Romney, Scranton, Burch,
        Smylie, Morton, Wilson, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:romney-george-w
      - name:scranton-william-w
      - name:burch-dean
      - name:smylie-robert-e
      - name:morton-thruston-b
