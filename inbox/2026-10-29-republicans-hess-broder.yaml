      n: '[[w.hess-republican-establishment]], 30. Check: who signed; Hess and Broder, 30, say "the entire Michigan congressional
        delegation." Names: Romney, Ford.'
      src:
        c: 88d44eca
        rows:
        - 'w.hess-republican-establishment 30: A-B'
      tags:
