      - name:bliss-ray-c
- add:
    entry:
      id: cal.1965-06-18.republican-party
      when: June 18
      date: '1965-06-18'
      thread: republican-party
      also:
      - conservative-movement
      c: Night, at the Republican National Committee. Kelly, Bliss's executive director, caught breaking into the desk of
        Kovac, the finance division's fund raiser from the Draft Goldwater movement, amid talk that the list of 1964 contributors
        was going to Goldwater's Free Society Association. Bliss dismisses Kelly, who tells reporters he was following orders.
      n: '[[w.hess-republican-establishment]], 45. Names: Kelly, Bliss, Kovac, Goldwater.'
      src:
        c: 4fd404b9
        rows:
        - 'w.hess-republican-establishment 45: all'
      tags:
      - name:kelly-william-cody
      - name:bliss-ray-c
      - name:kovac-frank
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1965-12-13.vietnam
      when: Dec. 13
      date: '1965-12-13'
      thread: vietnam
      also:
      - republican-party
      c: The Republican Coordinating Committee's paper on the war. The aim "not the unconditional surrender of North Vietnam,
        but unconditional freedom for the people of South Vietnam"; a "growing danger" of "an endless Korean-type jungle war";
        first, "a Kennedy-type quarantine on North Vietnam"; "the maximum use of American conventional air and sea power against
        significant military targets."
      n: '[[w.hess-republican-establishment]], 52. Check: the words against the paper''s text (the copy read is damaged at
        the gutter). See [[cal.1965-01-22.republican-party]].'
      src:
        c: b67fd4ef
        rows:
        - 'w.hess-republican-establishment 52: all'
- add:
    entry:
      id: cal.1966-01-25.republican-party
      when: Jan. 25
      date: '1966-01-25'
      thread: republican-party
      c: 'Washington. Republican city chairmen, in a closed meeting. Cowger, former mayor of Louisville: his administration
        took "voluntary" gifts of 2 percent of their monthly pay from its employees outside the civil service, so much "that
        I find it difficult to intelligently spend it all."'
      n: '[[w.hess-republican-establishment]], 59 n.†. Names: Cowger.'
      src:
        c: 6f4cafb3
        rows:
        - 'w.hess-republican-establishment 59: all'
      tags:
      - name:cowger-william-o
- add:
    entry:
      id: cal.1966-11-09.republican-party
      when: Nov. 9
      date: '1966-11-09'
      thread: republican-party
      also:
      - elections-1966
      c: '1:25 a.m. Bliss at his desk, watching the returns, to Morton: "I''d say we''re on our way, Thrus." Later, to reporters:
        the gains "exceeded my fondest expectations"; the party "a very live elephant now."'
      n: '[[w.hess-republican-establishment]], 54. See [[cal.1966-11-08.elections-1966]]. Names: Bliss, Morton.'
      src:
        c: d71f33e9
        rows:
        - 'w.hess-republican-establishment 54: all'
      tags:
      - name:bliss-ray-c
      - name:morton-thruston-b
