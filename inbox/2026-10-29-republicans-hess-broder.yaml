      when: June 17
      date: '1964-06-17'
      thread: elections-1964
      also:
      - goldwater
      - republican-party-congress
      c: 'Fifty-four Republican members of Congress sign a statement for Goldwater''s nomination: "We are convinced that the
        nomination of Senator Barry Goldwater will result in substantial increases in Republican members in both houses of
        Congress."'
      n: '[[w.hess-republican-establishment]], 17. Check: who signed; the text and its first printing. Names: Goldwater.'
      src:
        c: 140d5a22
        rows:
