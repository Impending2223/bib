      c: 'Li Fuchun 李富春, in a speech at Beidaihe 北戴河: inflation at least 10 per cent a year on everything from food to services, 40 to 50 per cent in places; some 12.5 billion yuan spent on goods worth 7 billion; a deficit of 3 billion yuan, many units having borrowed from the bank to feast.'
      n: '[[w.dikotter-maos-great-famine]], 161, 200. Made public: 2010. To check: speech at Beidaihe, Aug. 11, 1961, Gansu Provincial Archives, 91-18-561, p. 51 (cited by [[w.dikotter-maos-great-famine]], 161 n.29); the same, pp. 51 and 55 (cited by [[w.dikotter-maos-great-famine]], 200 n.14). Names: Li Fuchun. Check: the day; whether this is Li Fuchun''s talk to the Secretariat of Aug. 8 (see [[cal.1961-08-08.china-leadership-4]]).'
