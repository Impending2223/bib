      when: Apr. 24
      date: '1960-04-24'
      thread: china-leadership
      also:
      - china
      c: The Ministry of Health 卫生部 reports some 134 fatal poisonings in less than a month. In Baodi county, Hebei 河北, grain milled with a roller contaminated with pesticide poisons over a hundred villagers, and the flour, sold a few days later, another 150; in Wenshui, Shanxi, a pot used for poison makes over thirty kindergarten children ill; in Hubei 湖北 fertiliser balls taken for bean cakes make a thousand ill, and thirty-eight die.
      n: '[[w.dikotter-maos-great-famine]], 281. Made public: 2010. To check: Ministry of Health, report, Apr. 24, 1960, Hubei Provincial Archives, SZ115-2-355, pp. 10–13 (cited by [[w.dikotter-maos-great-famine]], 281 n.37).'
