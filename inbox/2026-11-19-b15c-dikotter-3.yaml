      c: The office of the Xinyang prefectural committee handling cases issues a document on the errors of Wang Dafu, secretary of the committee's Standing Committee, with the factual material. It puts the deaths in Xinyang in 1960 at over a million, some 67,000 of them beaten to death by the militias.
