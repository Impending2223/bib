      thread: china-leadership
      also:
      - china
      c: A report of a central inspection committee to Zhou Enlai on Hunan finds people beaten to death in eighty-two of the province's eighty-six counties and cities. In Leiyang some 260 cadres who refused to beat slackers were dismissed and thirty were beaten to death.
      n: '[[w.dikotter-maos-great-famine]], 297, 300. Made public: 2010. To check: Hunan Provincial Archives, Nov. 15, 1960, 141-2-125, p. I (cited by [[w.dikotter-maos-great-famine]], 297 n.50); Hunan Provincial Archives, Nov. 15, 1960, 141-2-125, p. 3 (cited by [[w.dikotter-maos-great-famine]], 300 n.59). Names: Zhou Enlai. Check: the day, the file being of Nov. 15, 1960.'
