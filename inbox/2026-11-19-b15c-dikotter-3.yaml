      place: nanjing
      c: 'The Federation of Trade Unions looks into the lives of iron, steel and coal workers in Nanjing 南京: canteens infested with insects and rodents; up to a thousand queuing at one canteen window of the Lingshan coal mine; 1 to 1.5 square metres of dormitory space a worker; miners without shoes.'
