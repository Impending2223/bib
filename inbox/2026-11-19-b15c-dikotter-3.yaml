      place: quxian
      c: 'A work team sent by Li Jingquan reports on Quxian county, Sichuan: 250,000 kilos of Guanyin soil dug out of deep pits by more than 10,000 people; in one village 214 of 262 families have eaten the mud, and in every village several have died of blocked colons.'
      n: '[[w.dikotter-maos-great-famine]], 284. Made public: 2010. To check: Sichuan Provincial Archives, Aug. 31, 1961, , pp. 177–8 (cited by [[w.dikotter-maos-great-famine]], 284 n.55). Names: Li Jingquan. Check: the day, the file being of Aug. 31, 1961.'
