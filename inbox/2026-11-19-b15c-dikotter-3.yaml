      also:
      - china
      c: A police report to the Ministry of Public Security from Xili county, Gansu, tells of a man who confessed to murdering a young girl and to eating the corpses of young children on two earlier occasions, and of a farmer at Zhangye railway station who found a human nose and ears in a package of meat bartered for shoes.
