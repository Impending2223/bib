      c: 'Li Fuchun, in a speech at Beidaihe: inflation is at least 10 per cent a year on everything from food to services, and 40 to 50 per cent in some places; some 12.5 billion yuan has been spent on goods worth 7 billion; the deficit is 3 billion yuan, many units having borrowed from the bank to feast.'
      n: '[[w.dikotter-maos-great-famine]], 161, 200. Made public: 2010. To check: Wuhan Municipal Archives, Aug. 11, 1961, 91-18-561, p. 51 (cited by [[w.dikotter-maos-great-famine]], 161 n.29); archives, Aug. 11, 1961, 91-18-561, pp. 51 and 55 (cited by [[w.dikotter-maos-great-famine]], 200 n.14). Names: Li Fuchun. Check: the day, the file being of Aug. 11, 1961; whether this is Li Fuchun''s talk of Aug. 8 to the Secretariat (see [[cal.1961-08-08.china-leadership-4]]).'
