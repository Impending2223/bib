      thread: china-leadership
      also:
      - china
      c: The Ministry of Public Security, having checked population statistics across the country, reports that 1 to 1.5 per cent of the 681 million counted are fake, the inflation reaching 2.2 per cent in Gansu; local cadres inflate the figures to obtain greater cloth rations and other goods.
