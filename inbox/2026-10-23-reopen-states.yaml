        c: 'Washington. Referendum Bill 16, the legislature''s act redrawing the first, second, third, fourth, sixth and seventh congressional districts: yes 416,630, no 384,466. Approved.'
        n: 'Votes: Wash. Secretary of State, [Election Results Archive](https://www.sos.wa.gov/elections/data-research/election-data-and-maps/election-results-and-voters-pamphlets/washington-state-election-results-archive) ("1966 General", Referendum Bill 16); Check: Wash. *Abstract of Votes*, Nov. 8, 1966, and the act''s chapter in the session laws of 1965. [[w.dixon-democratic-representation]].'
        tags: [state:wa]
