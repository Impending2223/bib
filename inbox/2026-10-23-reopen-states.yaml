        n: '[Wash. Legislature, Oral History Program, "Redistricting: 1962"](https://app.leg.wa.gov/oralhistory/redistricting2/1960s/1962/); [the voters'' pamphlet](https://www.sos.wa.gov/_assets/elections/voters''%20pamphlet%201962.pdf). Votes: Wash. Secretary of State, [Election Results Archive](https://www.sos.wa.gov/elections/data-research/election-data-and-maps/election-results-and-voters-pamphlets/washington-state-election-results-archive) ("1962 General", Initiative Measure 211), and [Wikipedia, "List of Washington (state) ballot measures"](https://en.wikipedia.org/wiki/List_of_Washington_(state)_ballot_measures), alike; Check: Wash. *Abstract of Votes*, Nov. 6, 1962. [[w.politics-of-reapportionment]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]].'
  - add:
      entry:
        id: cal.1965-03-24.state-and-city-finance-id
        when: Mar. 24
        date: '1965-03-24'
        thread: state-and-city-finance
        c: 'Idaho''s sales tax. Smylie approves H.B. 222, the Idaho Sales Tax Act: 3 percent on retail sales, and a use tax, collected from July 1, 1965; the income tax''s rates changed and the corporations'' deduction of the federal tax ended, for 1965.'
        n: '1965 Idaho Sess. Laws, ch. 195, [408](https://legislature.idaho.gov/wp-content/uploads/sessionlaws/sessionlaws_1965.pdf#page=441), § 19 (the rate), § 43 (the emergency and the dates); "Approved March 24, 1965," [437](https://legislature.idaho.gov/wp-content/uploads/sessionlaws/sessionlaws_1965.pdf#page=470). Names: Smylie.'
        tags: [state:id, name:smylie-robert-e]
  - add:
      entry:
        id: cal.1967-04-12.state-and-city-finance-ne
        when: Apr. 12
        date: '1967-04-12'
        thread: state-and-city-finance
        c: 'Nebraska''s first sales and income taxes. The Legislature, 38–11, passes LB 377, the Committee on Revenue''s bill at Tiemann''s request, with the emergency clause: a sales and use tax, an income tax on individuals, trusts, estates and corporations, a corporate franchise tax. Klaver''s motion to strike the enacting clause lost, 10–36. Tiemann signs it the same day.'
        n: 'Neb. *Legislative Journal*, 77th Sess. (1967), [1294–1296](https://nebraskalegislature.gov/FloorDocs/77/PDF/Journal/r1journal.pdf#page=1294); Tiemann to the Legislature, Apr. 13, 1967: "on April 12, 1967 I approved LB 377," [1425](https://nebraskalegislature.gov/FloorDocs/77/PDF/Journal/r1journal.pdf#page=1425). *Laws of Nebraska*, 1967, ch. 487, p. 1533; *Nebraska Blue Book*, 1968, [435–436](https://govdocs.nebraska.gov/epubs/L3000/D001-1968.pdf#page=439). Names: Tiemann.'
        tags: [state:ne, name:tiemann-norbert-t]
  - add:
