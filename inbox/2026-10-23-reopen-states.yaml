      id: cal.1960-09-13.governors-wa
      base: b45e8e48
      set:
        n: 'Votes: Wash. Secretary of State, [Election Results Archive](https://www.sos.wa.gov/elections/data-research/election-data-and-maps/election-results-and-voters-pamphlets/washington-state-election-results-archive) (the Secretary''s database, 1898–2006, "1960 Primary"), and [Wikipedia, "1960 Washington gubernatorial election"](https://en.wikipedia.org/wiki/1960_Washington_gubernatorial_election), alike; Check: Wash. *Official Abstract of Votes, State Primary, September 13, 1960*, 9. [[w.schwantes-pacific-northwest]]; [[w.peirce-pacific-states-of-america]]. Names: Rosellini, Andrews, Newman Clark.'
