ops:
  - edit:
      id: cal.1962-12-17.open-housing-co
      base: 84b553d6
      set:
        c: '*Colorado Anti-Discrimination Commission v. Case*, [151 Colo. 235](https://static.case.law/colo/151/case-pdfs/0235-01.pdf): the Colorado Supreme Court, en banc, sustains the Fair Housing Act of 1959 under the police power; a refusal to sell compelled is no taking for private use. Its grant of power to order "such other action as in the judgment of the commission will effectuate the purposes of this article" struck, a delegation of legislative power, and the parts of the Commission''s order resting on it. Moore for the court; Hall dissenting.'
  - edit:
      id: cal.1961-09-29.open-housing-wa
      base: 1da9db2b
      set:
        c: '*O''Meara v. Washington State Board Against Discrimination*, [58 Wash. 2d 793](https://static.case.law/wash-2d/58/case-pdfs/0793-01.pdf): the Washington Supreme Court, 5–4, holds void the legislature''s amendment of 1957 bringing publicly assisted housing under the Law Against Discrimination. A class drawn by a public loan on the home arbitrary: equal protection denied under the Fourteenth Amendment, a special privilege under Art. I, § 12. Foster for the court; Mallery, with Ott, concurring, private property taken for private use; Rosellini for the four in dissent.'
  - edit:
      id: cal.1961-08-08.state-and-city-finance-tx
      base: 2cb65e03
      set:
        n: 'Acts 1961, 57th Leg., 1st C.S., ch. 24 (H.B. 20), the Limited Sales, Excise and Use Tax Act, [Tex. Gen. Laws 71](https://lrl.texas.gov/scanned/sessionLaws/57-1/HB_20_CH_24.pdf): "Filed without Governor''s signature, Aug. 16, 1961," [114](https://lrl.texas.gov/scanned/sessionLaws/57-1/HB_20_CH_24.pdf#page=44). Tex. Legis. Ref. Library, [57th Legislature, first called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-1) (July 10–Aug. 8, 1961), and [second called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-2) (Aug. 10–14). "The Making of a Sales Tax," [*Texas Observer*, Aug. 12, 1961, p. 1](https://issues.texasobserver.org/pdf/ustxtxb_obs_1961_08_12_issue.pdf). [[w.cunningham-cowboy-conservatism]]; [[w.davidson-race-and-class-in]]. Names: Daniel.'
