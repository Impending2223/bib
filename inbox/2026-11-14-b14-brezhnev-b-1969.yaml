      when: July 3–5
      date: '1969-07-03'
      thread: soviet-union-leadership
      also:
      - middle-east
      c: Moscow. Atassi and the Syrian party-state delegation. Brezhnev meets them with Podgorny and Kosygin at Vnukovo, July 3, 5 p.m.; negotiates, July 4, 11 to 3, and July 5, 10 to 2, at the head of the Soviet government delegation in the Kremlin; a lunch July 5, 3 to 5; sees them off at 5.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 348 (July 3–5). Made public: 2016. Names: Brezhnev, Podgorny, Kosygin, Atassi.'
