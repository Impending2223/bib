      date: '1969-06-25'
      thread: soviet-union-leadership
      c: Moscow. The Central Committee's plenum. Brezhnev works at Zavidovo June 20–22 on the report "On the Results of the International Meeting" and is at the plenum June 26 until 3:20 p.m.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 346 (June 25–27). Made public: 2016. Names: Brezhnev. Check: The record does not say that Brezhnev delivered the report on June 26.'
