      when: Feb. 17
      date: '1969-02-17'
      thread: soviet-union-leadership
      c: Moscow. Brezhnev receives Ulbricht, 10 to 12:45, and lunches with him at the reception house, 1 to 2; sees him off at Vnukovo, 3 p.m.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 316 (Feb. 17). Made public: 2016. Names: Brezhnev, Ulbricht.'
      tags:
      - name:brezhnev-leonid
      - name:ulbricht-walter
      - polity:ussr
      - polity:gdr
