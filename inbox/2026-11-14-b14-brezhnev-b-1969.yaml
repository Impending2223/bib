      when: June 5–7
      date: '1969-06-05'
      thread: soviet-union-leadership
      also:
      - china
      c: Moscow. The International Meeting. Brezhnev talks with Gomułka by telephone June 5, 10 to 11; at 11, in the new hall, with Ceauşescu, Mazilu and Stoica; at 3 p.m. he opens the Meeting in the Georgievsky Hall with a short welcome; June 6, 10 to 2 and 4 on; June 7, 10 to 7, and makes his main speech.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 341–342 (June 5–7). Made public: 2016. Names: Brezhnev, Gomułka, Ceauşescu, Mazilu, Stoica. Check: The record says "a large speech"; its text is not in it.'
      tags:
      - name:brezhnev-leonid
