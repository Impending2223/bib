    entry:
      id: cal.1969-06-03.soviet-union-leadership
      when: June 3–4
      date: '1969-06-03'
      thread: soviet-union-leadership
      c: Moscow. The International Meeting of Communist and Workers' Parties. June 3, 10 to 1, Brezhnev holds a conference of the CPSU delegation (Podgorny and others); he meets at Vnukovo the delegations of the Hungarian, Polish, Bulgarian, Mongolian, East German and Czechoslovak parties; June 4, 10 to 1, he negotiates with their leaders, and at 1, with Podgorny, meets Ceauşescu's Romanian delegation; the Politburo, 6 to 7; 8 to 10, negotiations with the leaders of the parties.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 341 (June 3–4). Made public: 2016. Names: Brezhnev, Podgorny, Ceauşescu.'
      tags:
      - name:brezhnev-leonid
