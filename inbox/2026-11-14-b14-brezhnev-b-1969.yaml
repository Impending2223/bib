      when: June 13–17
      date: '1969-06-13'
      thread: soviet-union-leadership
      c: Moscow. The International Meeting closes. Brezhnev attends June 13 to 16; June 17, 9 to 12, the closing session in the Georgievsky Hall; a reception, 3 p.m.; a concert, 6; June 18, 12 noon on, he sees off the delegations at Vnukovo and Kádár's at the Kiev station.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 343–344 (June 13–17). Made public: 2016. Names: Brezhnev, Kádár.'
      tags:
      - name:brezhnev-leonid
      - name:kadar-janos
      - polity:ussr
