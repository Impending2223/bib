- add:
    entry:
      id: cal.1969-04-22.soviet-union-leadership
      when: Apr. 22–26
      date: '1969-04-22'
      thread: soviet-union-leadership
      c: Moscow. The Council for Mutual Economic Assistance's session. Brezhnev meets the delegations of Czechoslovakia, Romania, Poland, Bulgaria and the GDR at Vnukovo, Apr. 22, 8:15 to 1, and talks that day with the Czechoslovak delegation led by Husák, Černík with him, Kosygin and Podgorny for the Soviet side; Apr. 23, 9, meets the heads of the delegations of Bulgaria, Hungary, Poland, the GDR, Romania, Czechoslovakia and Mongolia at the reception house, and at 10 opens the session; the session Apr. 24 to 26, he heading the Soviet delegation; reception Apr. 26, 2 to 4; sends off the delegations Apr. 26–27.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 332–333 (Apr. 22–26). Made public: 2016. Names: Brezhnev, Husák, Černík, Kosygin, Podgorny.'
      tags:
      - name:brezhnev-leonid
      - name:husak-gustav
      - name:kosygin-aleksei
      - name:podgorny-nikolai-v
      - polity:ussr
      - polity:czechoslovakia
