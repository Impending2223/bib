      when: June 9–12
      date: '1969-06-09'
      thread: soviet-union-leadership
      c: Moscow. The International Meeting; Brezhnev, heading the CPSU delegation, attends the sessions June 9 (10 to 3:50), June 10 (10 to 9), June 11 and June 12; June 12, 3:20 to 5:25, a conference with Kuznetsov, Aleksandrov and others.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 342–343 (June 9–12). Made public: 2016. Names: Brezhnev, Kuznetsov, Aleksandrov.'
