      c: Moscow. Brezhnev receives the delegation of Czechoslovakia's trade unions led by Poláček of the Presidium of the Party's Central Committee, 11 to 12:25; the Korean delegation led by Pak Song-chol, 3 to 6, Rusakov and Gromyko taking part; sees Tsedenbal off at 7.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 333 (Apr. 28). Made public: 2016. Names: Brezhnev, Poláček, Pak Song-chol, Rusakov, Gromyko, Tsedenbal.'
