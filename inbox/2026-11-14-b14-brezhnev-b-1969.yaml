      also:
      - soviet-union-czechoslovakia
      c: Moscow. Brezhnev meets, Feb. 26, 4:20 to 7:30 p.m., the delegation leaving for Czechoslovakia under Pelshe, with Grishin and others; Feb. 27, 10 a.m., the military delegation of Czechoslovakia's Defense Minister Dzúr (ten men), Grechko taking part; at 12:30 the Hungarian delegation (Katushev negotiating); 4:20 p.m., in his office, the Polish delegation.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 318 (Feb. 26–27). Made public: 2016. Names: Brezhnev, Pelshe, Grishin, Dzúr, Grechko, Katushev. Check: The record''s list of the Polish delegation''s head is cut off.'
