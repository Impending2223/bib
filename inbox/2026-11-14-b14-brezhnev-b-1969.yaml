      when: Mar. 14–19
      date: '1969-03-14'
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance
      c: Budapest. Brezhnev leads the party-government delegation to the Warsaw Pact's Political Consultative Committee, leaving Moscow by special train Mar. 14, 6 p.m., after the Politburo; in Budapest Mar. 16, noon; the meeting Mar. 17; leaves Mar. 18, 11 a.m. Moscow time; in Moscow Mar. 19, 8:35 p.m.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 322–323 (Mar. 14–19). Made public: 2016. Names: Brezhnev. Check: The record gives the movements, not the business.'
