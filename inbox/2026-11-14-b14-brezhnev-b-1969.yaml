      c: Moscow. Brezhnev receives the Cuban delegation led by Rodríguez, June 18, 4:20 p.m., and, June 19, 10 to 11:35, the delegation of the Communist Party of Israel led by Vilner; the Politburo, 4 to 6.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 344–345 (June 18–19). Made public: 2016. Names: Brezhnev, Rodríguez, Vilner.'
