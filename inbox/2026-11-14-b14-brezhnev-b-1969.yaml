    entry:
      id: cal.1969-02-07.soviet-union-leadership
      when: Feb. 7–10
      date: '1969-02-07'
      thread: soviet-union-leadership
      c: Zavidovo, Moscow. Brezhnev, after receiving Suslov, Ustinov, Kapitonov, Katushev and Pelshe at 11, leaves for Zavidovo at noon Feb. 7 for the negotiations with Kádár; Feb. 10, 1 to 3 p.m., the lunch for Kádár at the Lenin Hills reception house; he sees Kádár off at the Kiev station, 3:15 p.m.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 314 (Feb. 7–10). Made public: 2016. Names: Brezhnev, Kádár, Suslov, Ustinov.'
      tags:
      - name:brezhnev-leonid
      - name:kadar-janos
      - name:suslov-mikhail-a
      - name:ustinov-dmitriy-f
      - polity:ussr
