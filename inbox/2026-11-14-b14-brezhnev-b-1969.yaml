      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: Moscow. Brezhnev receives Husák in his office, 6 to 11 p.m.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 332 (Apr. 24). Made public: 2016. Names: Brezhnev, Husák. Check: Husák became First Secretary of the Czechoslovak party Apr. 17; the record names no one else present.'
      tags:
      - name:brezhnev-leonid
      - name:husak-gustav
