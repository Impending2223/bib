      c: Moscow. Brezhnev, with Kosygin, negotiates with Černík in the Kremlin, 10 to 5; that evening, 9 to 10, he receives Biľak.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 322 (Mar. 13). Made public: 2016. Names: Brezhnev, Kosygin, Černík, Biľak. Check: The evening call on Biľak is the record''s; whether the Soviet side told Černík is not in it.'
