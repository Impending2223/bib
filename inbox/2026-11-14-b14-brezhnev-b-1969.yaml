      also:
      - soviet-union-czechoslovakia
      c: Moscow. Brezhnev receives the Czechoslovak party delegation led by Husák at his dacha, 6:30 p.m. to 1 a.m.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 344 (June 14). Made public: 2016. Names: Brezhnev, Husák.'
