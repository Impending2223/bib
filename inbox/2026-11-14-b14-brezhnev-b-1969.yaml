    entry:
      id: cal.1969-03-27.soviet-union-leadership
      when: Mar. 27
      date: '1969-03-27'
      thread: soviet-union-leadership
      c: Moscow. Brezhnev negotiates with the delegation of the Finnish party, Suslov, Pelshe and Ponomarev taking part; the Politburo met 10 to 4.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 324 (Mar. 27). Made public: 2016. Names: Brezhnev, Suslov, Pelshe, Ponomarev. Check: The hour of the negotiation is garbled in the record.'
