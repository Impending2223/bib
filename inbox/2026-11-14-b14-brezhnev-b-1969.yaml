patch: 2026-11-14-b14-brezhnev-b-1969
by: 'Claude (batch 14, reader 2: Brezhnev, Rabochie i dnevnikovye zapisi, vol. II, the records of his reception-room secretaries, 1965–82; the years 1965 to 1969 read), Nov. 14, 2026; HELD: the entries after Jan. 20, 1969, outside the calendar''s span (the brief R1), for the owner''s ruling'
ops:
- add:
    entry:
      id: cal.1969-01-22.soviet-union-leadership
      when: Jan. 22
      date: '1969-01-22'
      thread: soviet-union-leadership
      also:
      - space
      c: Moscow. Brezhnev, from the Barvikha sanatorium, goes to Vnukovo at noon to meet the cosmonauts of Soyuz 4 and 5 and speaks at the rally at the Palace of Congresses; at 4 p.m. the reception for the cosmonauts; back at Barvikha, 6:20.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 312 (Jan. 22). Made public: 2016. Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1969-02-04.soviet-union-leadership
      when: Feb. 4–6
      date: '1969-02-04'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: Moscow. Brezhnev receives Erban of the Czechoslovak party's Executive Committee and the National Front, Feb. 4, 3 to 6:35 p.m., and Marko, Foreign Minister of Czechoslovakia, Feb. 6, 5 to 7; at 7:15 he goes to the Kiev station to meet Kádár.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 313–314 (Feb. 4–6). Made public: 2016. Names: Brezhnev, Erban, Marko, Kádár.'
      tags:
      - name:brezhnev-leonid
      - name:kadar-janos
      - polity:ussr
      - polity:czechoslovakia
      - name:marko-jan
