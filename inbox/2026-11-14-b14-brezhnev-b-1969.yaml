      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 363 (Oct. 1–3). Made public: 2016. Names: Brezhnev, Gomułka. Check: The record''s hours of Oct. 1 do not agree: a drive to the airport at 8:25 (p.m.) stands before the 3 p.m. negotiation, and the sheet ends with his return to the dacha at 8:15 p.m.'
