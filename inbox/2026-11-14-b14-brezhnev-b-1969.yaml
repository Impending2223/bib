      thread: soviet-union-leadership
      also:
      - defense
      c: Moscow. The Politburo in the Kremlin, 10 to 4, Brezhnev presiding; 4 to 5, with Kosygin and Podgorny in the old hall, he inspects the new uniform of servicemen; 5 to 10 p.m. the Defense Council, Kosygin, Podgorny, Grechko, Povaly, Ustinov and Serbin present.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 335 (May 8). Made public: 2016. Names: Brezhnev, Kosygin, Podgorny, Grechko, Povaly, Ustinov, Serbin. Check: The record gives no agenda.'
