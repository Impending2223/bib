      c: Moscow. The leaders of the socialist countries of the East. Brezhnev, at the head of the Soviet party-government delegation, negotiates with the delegations of the GDR, Hungary, Bulgaria, Czechoslovakia, Romania and Poland at the reception house, Dec. 3, 10 to 1 and 4 to 6, and Dec. 4, 10 to 1; with them takes leave of Marshal Voroshilov at the House of Unions, 3 to 4 p.m.; the dinner in the Kremlin, 4 to 6; sees off Hungary, Poland (Dec. 4), Bulgaria and the GDR (Dec. 5, 9 and 10 a.m.); Dec. 5, 11 to 11:45, with Kosygin, Podgorny and Katushev, he receives Ceauşescu's delegation.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 375–376 (Dec. 3–5). Made public: 2016. Names: Brezhnev, Kosygin, Podgorny, Katushev, Voroshilov, Ceauşescu. Check: The record gives no business.'
