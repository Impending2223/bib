      when: May 16
      date: '1969-05-16'
      thread: soviet-union-leadership
      c: Moscow. Brezhnev meets the Romanian party-government delegation led by Ceauşescu at Vnukovo, 11 a.m., and negotiates with them, 12 to 7:30; sees them off at 9 p.m., with the leaders leaving for the international meeting.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 337 (May 16). Made public: 2016. Names: Brezhnev, Ceauşescu. Check: The record''s last line is cut off.'
