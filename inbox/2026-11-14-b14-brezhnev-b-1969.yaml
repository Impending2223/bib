      c: Moscow. The Politburo, enlarged, 11 to 5, Brezhnev presiding.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 317 (Feb. 20). Made public: 2016. Names: Brezhnev. Check: The record gives no agenda or list of those added.'
