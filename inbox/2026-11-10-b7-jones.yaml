patch: 2026-11-10-b7-jones
by: 'Claude (batch 7: Jones, The Bay of Pigs, the "already in" rows read against the calendar), Nov. 10, 2026'
ops:
- add:
    entry:
      id: cal.1962-03.cuba-5
      when: Mar.
      date: '1962-03'
      thread: cuba
      c: 'Miami. Shackley, the CIA''s station chief, by his later account: directives from Harvey to do whatever is necessary to bring about a change of regime in Cuba.'
      n: '[[w.jones-bay-of-pigs]], 157. Check: the month; Jones has "the spring of 1962." To check: Halley (alias for Shackley) testimony, Aug. 19, 1975, Church Committee, 25–26; [[w.shackley-spymaster]], x, 50–51, 53, 55–56, 68–72 (cited by [[w.jones-bay-of-pigs]], 157 n.10). Names: Harvey.'
      src:
        c: '96c97ed1'
        rows:
        - 'w.jones-bay-of-pigs 157: all'
        - 'via w.jones-bay-of-pigs 157 n.10c: all'
      tags:
      - name:harvey-william-k
- add:
    entry:
      id: cal.1962-12.cuba-5
      when: Dec.
      date: '1962-12'
      thread: cuba
      c: 'During the talks on the prisoners'' release, the CIA sends Castro a diving suit infected with a deadly poison by way of the American lawyer entrusted with it; not told, he switches it for one he has bought. Later, the lawyer: a "nice big germ bag."'
      n: '[[w.jones-bay-of-pigs]], 163. Check: the day, and the lawyer''s name; Jones does not name him. To check: the CIA Inspector General''s report, 1967, 75–77; [[w.prados-safe-for-democracy]], 312–13 (cited by [[w.jones-bay-of-pigs]], 163 n.25). See [[cal.1962-04-08.cuba]]. Names: Castro.'
      src:
        c: 'b77e4ccb'
        rows:
        - 'w.jones-bay-of-pigs 163: all'
        - 'via w.jones-bay-of-pigs 163 n.25a: all'
      tags:
      - name:castro-fidel
