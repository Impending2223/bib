    id: cal.1965-01-21.vietnam
    item: '[[w.logevall-choosing-war]], 314–15 (the meeting of Jan. 21, the day after the inauguration, no hour: Russell and Fulbright not invited; Mansfield, Dirksen and Ford among the thirteen lawmakers; Johnson, "There are no Democrats or Republicans on Vietnam")'
