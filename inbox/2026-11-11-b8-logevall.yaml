    units: E, F
- cite:
    id: cal.1964-03-25.latin-america
    item: '[[w.logevall-choosing-war]], 139 (the speech of Mar. 25: in Vietnam no option but the current policy of aid and advisers, negotiations not feasible at present)'
    units: A, E
- cite:
    id: cal.1964-06-15.vietnam
    item: '[[w.logevall-choosing-war]], 149 (by June 15 the resolution "on the shelf," Johnson''s decision to delay; not the meeting at State, its hour or the steps open)'
    units: B
- cite:
    id: cal.1964-06-23.vietnam
    item: '[[w.logevall-choosing-war]], 164 (Lodge''s resignation announced by Johnson, June 23; Taylor to replace him; Westmoreland for Harkins at MACV, June 20; not Lodge''s reasons, U. Alexis Johnson or Wheeler)'
    units: A, B, D
- cite:
    id: cal.1964-06-15.vietnam-congress
    item: '[[w.logevall-choosing-war]], 168 (the executive session of June 15: Rusk and Sullivan; Church, the war to be won or lost by the South Vietnamese, intervention a risk of war with North Vietnam or China)'
    units: A, B, C
- check:
    id: cal.1964-06-15.vietnam-congress
    text: 'Check: Logevall, 168–69, has Morse speak against only at the session of June 30 (Lodge); at June 15 he names Church skeptical and Fulbright sympathetic.'
- cite:
    id: cal.1964-06-23.vietnam-congress
    item: '[[w.logevall-choosing-war]], 169–70 (Church''s major Senate speech, the day not given: 25,000 hard-core Vietcong; "how on earth will the situation be improved by extending the war to the north?"; "Expanding the war is not getting out ... It is getting further in"; Humphrey in general support, against escalation, for a United Nations role)'
    units: E, F, G, H, I
- cite:
