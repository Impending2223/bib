    id: cal.1964-02-21.vietnam
    item: '[[w.logevall-choosing-war]], 115 (UCLA, Feb. 21: "external direction and supply" "a deeply dangerous game"; not Guantanamo)'
    units: A
- cite:
    id: cal.1964-03-16.vietnam
