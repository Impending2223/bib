- cite:
    id: cal.1964-12-09.vietnam
    item: '[[w.logevall-choosing-war]], 285 (Mansfield''s memorandum to Johnson, "early December," the day not given: "further and further out on a sagging limb"; "years and years of involvement and a vast increase in the commitment")'
