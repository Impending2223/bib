- cite:
    id: cal.1964-08-06.vietnam
    item: '[[w.logevall-choosing-war]], 203 (the joint session of the Foreign Relations and Armed Services committees, Aug. 6: McNamara''s answer to Morse, "Our Navy played absolutely no part in, was not associated with, was not aware of, any South Vietnamese actions, if there were any")'
