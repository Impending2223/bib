patch: 2026-11-11-b8-logevall
by: 'Claude (batch 8: Logevall, Choosing War, the "already in" rows read against the calendar), Nov. 11, 2026'
ops:
- add:
    entry:
      id: cal.1964-08-10.vietnam-6
      when: Aug. 10
      date: '1964-08-10'
      thread: vietnam
      c: 'Taylor''s first mission report from the embassy: the Khánh government "has about a 50-50 chance of lasting out the year." Defeatism; a public "confused and apathetic." Pressure to come from Saigon to win "by direct attack on Hanoi."'
      n: '[[w.logevall-choosing-war]], 214. To check: Taylor to State, Aug. 10, 1964, box 8, NSF VN, LBJ Library (cited by [[w.logevall-choosing-war]], 214 n.43). Names: Taylor, Nguyễn Khánh.'
      tags:
      - name:taylor-maxwell
      - name:nguyen-khanh
- add:
    entry:
      id: cal.1964-12-07.vietnam-commitments
      when: Dec. 7
      date: '1964-12-07'
      thread: vietnam-commitments
      also:
      - europe-and-the-alliance
      c: 'Wilson in Washington. Johnson presses for even a token British contingent in South Vietnam. Wilson refuses: forces tied down in Malaysia, Britain cochair of the Geneva Conference; at most a few more men for Thompson''s mission.'
      n: '[[w.logevall-choosing-war]], 279. To check: Record of Conversation, Washington, Dec. 7, 1964, FO 371/175503, PRO; FRUS 1964–68, I, p. 492 (cited by [[w.logevall-choosing-war]], 279 n.48). Names: Johnson, Wilson. Check: the day (the visit ran Dec. 7–9; the page gives none for the talk).'
      tags:
      - name:johnson-lyndon-b
      - name:wilson-harold
- add:
    entry:
      id: cal.1965-01-16.vietnam-commitments
      when: Jan. 16
      date: '1965-01-16'
      thread: vietnam-commitments
      c: Pearson at the LBJ Ranch. Johnson makes clear his determination to continue the fight (a Pearson biographer). He drives Pearson about the ranch; at dinner dominates the conversation.
      n: '[[w.logevall-choosing-war]], 337. To check: the Ranch talks (cited by [[w.logevall-choosing-war]], 337 n.6). See [[cal.1965-01-16.trade]]. Names: Johnson, Pearson. Check: the day (the page has only "a few days after" Satō''s return to Tokyo).'
      tags:
      - name:johnson-lyndon-b
      - name:pearson-lester-b
- add:
    entry:
      id: cal.1965-02-27.vietnam-congress-2
      when: Feb. 27
      date: '1965-02-27'
      thread: vietnam-congress
      also:
      - vietnam
      c: 'Senate. Morse on the white paper: a rationalization, "a Swiss cheese." Mansfield endorses it on the floor: it helps explain "why this nation has been compelled to take the steps it has in recent weeks."'
      n: '[[w.logevall-choosing-war]], 358–59. To check: Congressional Record, Feb. 27, 1965. See [[cal.1965-02-27.vietnam]]. Names: Morse, Mansfield.'
      tags:
      - name:morse-wayne
      - name:mansfield-mike
- cite:
    id: cal.1963-12-07.vietnam
    item: '[[w.logevall-choosing-war]], 82–83 (the memorandum of Dec. 7 to Johnson: the war perhaps not to be won in the South alone; a truce; a diplomatic offensive, France the key; not the copies to Kennedy or Cambodia)'
    units: B, C, D
- cite:
    id: cal.1964-01-01.vietnam
    item: '[[w.logevall-choosing-war]], 91 (the letter to Minh of Dec. 31, released to the press: "the fullest measure of support"; neutralization "only another name for a Communist take-over"; not the personnel and matériel)'
    units: A, C
- cite:
    id: cal.1964-01-06.vietnam
    item: '[[w.logevall-choosing-war]], 91 (Mansfield''s second memorandum, "early January": "close to the point of no return"; less talk of American responsibility, more of the Vietnamese; not "another Korea")'
    units: B, C
- cite:
    id: cal.1964-01-09.vietnam
    item: '[[w.logevall-choosing-war]], 92 (Bundy''s second memorandum, three days after Jan. 6: Truman hurt by the fall of China, "the first to quit in Saigon," "When we are stronger, then we can face negotiation"; McNamara''s, a new government "Communist-dominated"; not Acheson or the trade with Mansfield)'
    units: B, C, D, F
- cite:
    id: cal.1964-01-27.vietnam-congress
    item: '[[w.logevall-choosing-war]], 98 (McNamara before House Armed Services, Jan. 27: the withdrawal of a thousand men by year end never meant as a first step toward irrevocable withdrawal; not the executive session, Jan. 29 or the crutch)'
    units: A
- cite:
    id: cal.1964-02-20.vietnam
