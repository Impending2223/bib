- cite:
    id: cal.1965-02-17.vietnam-2
    item: '[[w.logevall-choosing-war]], 349–50 (the Senate''s "Vietnam debate" opens Feb. 17: Church, Saigon losing "for lack of internal cohesion," a negotiated settlement and a neutral Indochina; McGee, "If Vietnam goes, Cambodia goes ..."; not the 17th parallel or Nelson''s words)'
