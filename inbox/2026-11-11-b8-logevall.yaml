    item: '[[w.logevall-choosing-war]], 234–35 (the meeting of Sept. 9 with Johnson, McNamara, Taylor, Rusk and McCone: strikes on the North to wait, "unwise to attack until we could stabilize our base"; NSAM 314 next day; not the hour or the words "streets of Saigon")'
