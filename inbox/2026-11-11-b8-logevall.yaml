- cite:
    id: cal.1964-12-03.vietnam-congress
    item: '[[w.logevall-choosing-war]], 285 (Taylor before a closed session of the Foreign Relations Committee: a strong administration consensus that action against North Vietnam would be necessary at some point; Fulbright would not support it on behalf of a tottering regime)'
