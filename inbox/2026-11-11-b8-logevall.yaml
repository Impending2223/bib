- cite:
    id: cal.1964-08-06.vietnam-congress
    item: '[[w.logevall-choosing-war]], 203–04 (Morse and Gruening alone raised serious objections; Morse spoke Aug. 5, 6 and 7)'
    units: Q
- check:
