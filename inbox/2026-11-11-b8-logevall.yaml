    id: cal.1964-03-10.vietnam
    item: '[[w.logevall-choosing-war]], 136–38 (Gruening''s Senate speech of Mar. 10: "little hard rethinking," withdrawal; Russell''s call and congratulatory note after it, agreeing "with much of" what Morse and Gruening said; not the quotations)'
