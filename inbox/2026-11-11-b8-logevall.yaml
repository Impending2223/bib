- cite:
    id: cal.1964-11-03.vietnam
    item: '[[w.logevall-choosing-war]], 251, 255 (the Working Group, Bundy chairman, convened Nov. 3, election day; McNaughton and Mustin of the Pentagon, Ford and Carver of the CIA; not the options, the paper or the principals'' meetings)'
    units: A
- cite:
    id: cal.1964-11-19.vietnam
    item: '[[w.logevall-choosing-war]], 265–66 (the White House meeting of Nov. 19: Rusk misstates the options, William Bundy states them; McGeorge Bundy on the growing consensus around Option C, which would likely continue unless Johnson said otherwise; not McNamara or the hour)'
    units: A, D
- cite:
    id: cal.1964-12-01.vietnam
    item: '[[w.logevall-choosing-war]], 268–70 (Taylor and the principals with Johnson, Dec. 1: phase one, armed reconnaissance strikes on the infiltration routes in Laos and reprisals for a Vietcong "spectacular"; Johnson, "The plans you''ve got now ... [are] all right"; not the thirty days as phase one''s term)'
    units: A, B
- check:
    id: cal.1964-12-01.vietnam
    text: 'Check: Logevall, 269–70, puts phase two after thirty days of phase one, if Saigon''s effectiveness had bettered "to an acceptable degree," then waived; at the meeting Johnson: "Johnson City boys," "Why not say, This is it?," to Wheeler, "then I''ll be talking to you, General," and dependents to be removed from Saigon.'
- cite:
    id: cal.1964-12-07.europe-and-the-alliance
    item: '[[w.logevall-choosing-war]], 279 (Wilson''s plane in Washington the evening of Dec. 6 and the talks; his pledge of continued support; not Gordon Walker, Healey or the nuclear force)'
