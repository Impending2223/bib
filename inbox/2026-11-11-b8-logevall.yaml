    text: 'Check: Logevall, 302–03, has Bình Giã about forty miles southeast of Saigon, the Vietcong occupying it eight hours after the attack of Dec. 28, four helicopters shot down (three on the 29th, one on the 30th), and a marine battalion ambushed Dec. 31.'
- cite:
