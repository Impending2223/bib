- edit:
    id: cal.1964-05-21.poverty-2
    base: a8115ccb
    set:
      n: '[[w.johnson-white-house-diary]], 141–42, 144 (Lady Bird Johnson''s account). After [[cal.1964-05-21.poverty|the landing and the stop at the roadside school]]: "and then on we went to our first planned stop, the home of Mr. and Mrs. Arthur Robertson" ([[w.johnson-white-house-diary]], 141). Names: Lady Bird Johnson.'
- edit:
    id: cal.1964-05-21.poverty-3
    base: e8b71d23
    set:
      n: '[[w.johnson-white-house-diary]], 142–44 (Lady Bird Johnson''s account). After [[cal.1964-05-21.poverty-2|the Robertsons'' house]]: "We trudged out of the hollow ... up to the highway and then up to Lick Branch School" ([[w.johnson-white-house-diary]], 142). Names: Lady Bird Johnson.'
- edit:
    id: cal.1964-05-21.poverty-4
    base: 194e90e9
    set:
      n: '[[w.johnson-white-house-diary]], 144 (Lady Bird Johnson''s account). After [[cal.1964-05-21.poverty-3|the Lick Branch School]]: "Our next stop was at the Breathitt High School in Jackson" ([[w.johnson-white-house-diary]], 144). Names: Lady Bird Johnson, Perkins, Breathitt.'
- edit:
    id: cal.1964-05-27.europe-and-the-alliance-2
    base: 0e8e0402
    set:
      n: '[[w.johnson-white-house-diary]], 149–50 (Lady Bird Johnson''s account). After [[cal.1964-05-27.europe-and-the-alliance|the welcome on the South Lawn]]: Mrs. Johnson worked the morning "and then went down on the South grounds to greet" de Valera (148); "Tonight we entertained for President De Valera at a State Dinner" (149). Names: Johnson, Lady Bird Johnson, Robert Kennedy, Ted Kennedy, Shriver, Ball, Rusk.'
