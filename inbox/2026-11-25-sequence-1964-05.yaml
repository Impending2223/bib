- edit:
    id: cal.1964-05-20.china-leadership-5
    base: 90176c0f
    set:
      n: '[[w.yang-shangkun-riji]], II, 378 (May 20, 1964). The words: 文委电话，伯钊已抵捷克，要明天才飞阿 (II, 378). After [[cal.1964-05-20.china-leadership-4|the afternoon group meeting]], by the diary''s order, the weakest basis: the meeting "下午3时半到6时", then the call, then "晚9时开始办公" (II, 378). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Li Bozhao.'
- follows:
    id: cal.1964-05-27.china-leadership-7
    add:
    - cal.1964-05-27.china-leadership-6
- edit:
    id: cal.1964-05-27.china-leadership-7
    base: 786a6efc
    set:
      n: '[[w.yang-shangkun-riji]], II, 379 (May 27, 1964). The words: 恩来、小平同志来电话，告知常委会议情况，并准备明天下午开小组长会议 (II, 379). After the Standing Committee''s meeting, by its words ("告知常委会议情况"); after [[cal.1964-05-27.china-leadership-6|An Ziwen''s talk]], by the diary''s order, the weakest basis: "下午请假。安子文同志来谈话。恩来、小平同志来电话" (II, 379). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). See [[cal.1964-05-27.china-leadership]]. Names: Zhou Enlai, Deng Xiaoping, Yang Shangkun.'
