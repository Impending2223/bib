- add:
    entry:
      id: cal.1968-04-08.open-housing
      when: Apr. 8
      date: '1968-04-08'
      thread: open-housing
      c: 'The House and H.R. 2516, the Senate''s fair housing bill. McCormack to its supporters: "I''m not sure we are going
        to accomplish anything"; the Democratic leaders look for fifteen to twenty votes. For the White House, Barefoot Sanders
        asks Johnson to call Boggs and Halleck; Pickle''s vote found, his district given a $1.4 million housing grant (Kotz''s
        account).'
      n: '[[w.longley-lbjs-1968]], 132. To check: [[w.mann-walls-of-jericho]], 482; [[w.kotz-judgment-days]], 419. See [[cal.1968-02-06.open-housing]].
        Names: McCormack, Sanders, Boggs, Halleck, Pickle, Johnson.'
