- add:
    entry:
      id: cal.1968-01-14.elections-1968
      when: Jan. 14
      date: '1968-01-14'
      thread: elections-1968
      c: 'Sunday. Johnson in bed at the White House, by Busby''s account: the draft of the State of the Union "too long, too
        dull, too flat"; he will close the address by announcing that he will not run, and dictates the close ("let us continue").
        Busby: "we''ll have to think about this."'
      n: '[[w.longley-lbjs-1968]], 17–19 (Busby''s account). To check: [[w.busby-thirty-first-of-march]], 173, 180 (cited
        by [[w.longley-lbjs-1968]], 17, 19 nn.19, 22). See [[cal.1967-10-03.vietnam]]. Names: Johnson, Busby.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:busby-horace'
      src:
        c: dc0595bf
        rows:
        - 'w.longley-lbjs-1968 17–19: all'
- add:
    entry:
      id: cal.1968-01-23.republican-party-congress
      when: Jan. 23
      date: '1968-01-23'
      thread: republican-party-congress
      also:
      - japan-and-korea-pueblo
      c: 'Thurmond (R-S.C.) in the Senate: the seizure of the *Pueblo* "a calculated test of the will of the American people";
        the United States should "fight if necessary" for the ship and her crew, and North Korea apologize. His telegram to
        Johnson, put in the Record: an ultimatum, the ship to be "retaken by force" if not delivered within a specified time.'
      n: '[114 Cong. Rec. 679](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt1/pdf/GPO-CRECB-1968-pt1-7-1.pdf#page=91)
        (Jan. 23, 1968). [[w.longley-lbjs-1968]], 36 ("fight if necessary"). See [[cal.1968-01-23.japan-and-korea]]. Names:
        Thurmond, Johnson.'
      tags:
      - 'name:thurmond-strom'
      - 'name:johnson-lyndon-b'
      src:
        c: 8fa7565b
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt1/pdf/GPO-CRECB-1968-pt1-7-1.pdf#page=91: all'
        - 'w.longley-lbjs-1968 36: B'
        - 'via w.longley-lbjs-1968 36 n.12: B'
- add:
    entry:
      id: cal.1968-01-24.japan-and-korea-pueblo-2
      when: Jan. 24
      date: '1968-01-24'
      thread: japan-and-korea-pueblo
      c: 'The National Security Council, 1 p.m., on the *Pueblo*. McNamara: the seizure planned, the Soviets told of it in
        advance; the North Koreans "have no intention of returning the men or the ship." Wheeler: the ship''s "SOS"; no aircraft
        sent, the dark coming on and the defenses at Wonsan. McNamara, for Moorer: less than 1 percent chance of error in
        the ship''s position, 15½ to 17½ miles from shore. Rostow: Bucher''s confession "appears to have been written by the
        Soviets." Johnson: tell Fulbright, "so that he will be more responsible about his statements."'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [218](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d218). [[w.longley-lbjs-1968]],
        35–38 (the meeting; Longley cites it as doc. 213). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]].
        Names: McNamara, Wheeler, Moorer, Rostow, Bucher, Fulbright, Johnson.'
      tags:
      - 'name:mcnamara-robert-s'
      - 'name:wheeler-earle'
      - 'name:moorer-thomas'
      - 'name:rostow-walt-w'
      - 'name:bucher-lloyd-m'
      - 'name:fulbright-j-william'
      - 'name:johnson-lyndon-b'
      src:
        c: 0bc400b2
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v29p1/d218: all'
        - 'w.longley-lbjs-1968 35–38: C-H'
        - 'via w.longley-lbjs-1968 36 n.10: C-E'
        - 'via w.longley-lbjs-1968 38 n.18: F-H'
- add:
    entry:
      id: cal.1968-01-25.japan-and-korea-pueblo
      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'Breakfast on the *Pueblo*, 8:30 a.m.: Rusk, McNamara, Goldberg, Rostow. Goldberg: going to the Security Council
        "will give us time." Rostow: the seizure justifies "equivalent reprisal"; Johnson: "Walt, I do not want to win the
        argument and lose the sale." Johnson''s steps: Congress to be brought in ("see if the Fulbrights represent this country"),
        Russell''s judgment sought, a letter to Kosygin.'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [223](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d223). [[w.longley-lbjs-1968]],
        39–40, 42–43 (the breakfast; Longley''s notes 24 and 27, for Russell and the time gained, cite it as doc. 213, 514–19).
        Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]]. Names: Rusk, McNamara, Goldberg,
        Rostow, Fulbright, Russell, Kosygin, Johnson.'
      tags:
      - 'name:rusk-dean'
      - 'name:mcnamara-robert-s'
      - 'name:goldberg-arthur-j'
      - 'name:rostow-walt-w'
      - 'name:fulbright-j-william'
      - 'name:russell-richard-b'
      - 'name:kosygin-aleksei'
      - 'name:johnson-lyndon-b'
