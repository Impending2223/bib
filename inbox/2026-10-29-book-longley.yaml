      when: July 22
      date: '1968-07-22'
      thread: japan-and-korea-pueblo
      also:
      - republican-party-congress
      c: 'The House, Scherle''s special order, "Remember the *Pueblo*," six months after the seizure: some seventy members
        of both parties speak, Ford, Rivers and Bob Wilson among them. Ford: the "lack of adequate contingency planning,"
        a 12.3-knot ship on such a mission. Reid: "we will not rest until they are home again"; she will fly her flag on Sunday,
        July 28, for the crew.'
      n: '[114 Cong. Rec. 22646](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt17/pdf/GPO-CRECB-1968-pt17-5-2.pdf#page=49)
        (July 22, 1968). [[w.longley-lbjs-1968]], 51 (Reid). Check: the count of members and where the special order ends;
        Longley cites Reid at 18098, her remarks of June 20 ("150 days later"). See [[cal.1968-01-23.japan-and-korea]]. Names:
        Scherle, Ford, Rivers, Bob Wilson, Reid.'
