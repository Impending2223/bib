      when: Sept. 26
      date: '1968-09-26'
      thread: court-fortas
      c: 'Russell to Johnson: the hearings'' last disclosures, the $15,000 for nine lectures at American University, collected
        by a former law partner "from the most affluent clients of their law firm," make it "impossible for me to support
        Justice Fortas."'
