      date: '1968-04-07'
      thread: civil-disorders-king
      c: 'Johnson gives up the address to a joint session on the cities planned after King''s death. The recommendations "all
        vanilla; they wouldn''t begin to touch our problem" (Busby''s account). To McPherson: "Bobby, Gene, Nixon, any one
        of them would get a honeymoon from Congress in their first year. But not me."'
