- add:
    entry:
      id: cal.1968-03-31.elections-1968-3
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968
      also:
      - vietnam-205000
      c: 'The statement withdrawing from the race, by Busby''s account. In the West Hall in the morning, Johnson: "I want
        out of this cage"; Busby to work the January statement over with Christian; the chances of going through with it "eighty-twenty
        against." The last line''s "will not accept" changed to "would" ("too presumptuous") and put back in the evening.
        At lunch the Krims and Luci Nugent argue against it. Connally, asked through Christian: "Tonight is better than tomorrow
        night."'
      n: '[[w.longley-lbjs-1968]], 85–98 (Busby''s account; Lady Bird Johnson''s). To check: [[w.busby-thirty-first-of-march]],
        188–225; [[w.johnson-white-house-diary]], 642–46; Christian to Johnson, Mar. 31, 1968, President''s Appointment File
        (Diary Backup), Box 94, LBJ Library (cited by [[w.longley-lbjs-1968]], 95 n.54). See [[cal.1967-10-03.vietnam]]. Names:
        Johnson, Busby, Christian, Luci Nugent, Connally.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:busby-horace'
      - 'name:christian-george'
      - 'name:nugent-luci-baines-johnson'
      - 'name:connally-john'
      src:
        c: 8d39d7e1
        rows:
        - 'w.longley-lbjs-1968 85–98: all'
        - 'via w.longley-lbjs-1968 95 n.54: G'
- add:
    entry:
      id: cal.1968-03-31.elections-1968-4
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968
      c: 'Johnson, after Mass at St. Dominic''s, to Humphrey at his apartment, before Humphrey leaves for Mexico City: he
        will not run; Humphrey to wait for a call from Jones to confirm it. Humphrey "hoped to God I wouldn''t go through
        with it," by Johnson''s account.'
      n: '[[w.longley-lbjs-1968]], 89–91. To check: [[w.johnson-vantage-point]], 432; Jim Jones, "Behind L.B.J.''s Decision
        Not to Run in ''68," *New York Times*, Apr. 16, 1988 (cited by [[w.longley-lbjs-1968]], 90 n.33). See [[cal.1967-10-03.vietnam]].
        Names: Johnson, Humphrey, James R. Jones.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:humphrey-hubert-h'
      - 'name:jones-james-r'
      src:
        c: 99bb9c82
        rows:
        - 'w.longley-lbjs-1968 89–91: all'
- add:
    entry:
      id: cal.1968-03-31.soviet-union
      when: Mar. 31
      date: '1968-03-31'
      thread: soviet-union
      also:
      - vietnam
      c: 'Dobrynin with Johnson, Harriman and Rostow, 6:05 p.m., after going over the address with Harriman and Rostow: the
        Soviet Union, as Geneva co-chairman and Hanoi''s supplier, to "bring its influence to bear for a conference"; the
        Chinese "cocky" and "chesty"; "he had gone 90% of the way." Dobrynin: why not a 100 percent pause? Johnson: "But you
        are helping them." The bombing to go on below the 20th parallel, no firm time limit. In a hallway afterward, by Dobrynin''s
        account, Johnson tells him he will not run.'
      n: 'FRUS 1964–68, VI, doc. [168](https://history.state.gov/historicaldocuments/frus1964-68v06/d168); XIV, doc. [268](https://history.state.gov/historicaldocuments/frus1964-68v14/d268).
        [[w.longley-lbjs-1968]], 95–97 (the meeting; the hallway, by Dobrynin''s account). To check: [[w.dobrynin-in-confidence]],
        170–72. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-31.elections-1968]]. Names: Dobrynin, Harriman, Rostow,
        Johnson.'
      tags:
      - 'name:dobrynin-anatoly'
      - 'name:harriman-w-averell'
      - 'name:rostow-walt-w'
      - 'name:johnson-lyndon-b'
