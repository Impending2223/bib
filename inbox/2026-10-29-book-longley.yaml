      - 'name:helms-richard'
      - 'name:clifford-clark'
      src:
        c: 31042bb5
        rows:
        - 'w.longley-lbjs-1968 186–88: all'
- add:
    entry:
      id: cal.1968-08-23.soviet-union-czechoslovakia-2
      when: Aug. 23
      date: '1968-08-23'
      thread: soviet-union-czechoslovakia
      c: 'Rusk, Thompson with him, to Dobrynin: had Rusk''s soft-spoken manner misled him about the reaction here? Dobrynin:
        Dubček a weak leader letting things drift; Moscow wishes to go on with the bilateral questions, the strategic missiles
        among them. Rusk: rumors of a Soviet move on Romania; Dobrynin has "neither seen nor heard any indication whatever"
        of one.'
      n: 'FRUS 1964–68, XVII, doc. [87](https://history.state.gov/historicaldocuments/frus1964-68v17/d87). [[w.longley-lbjs-1968]],
        200. Made public: FRUS 1964–68, XVII (1996). See [[cal.1968-08-20.soviet-union]]. Names: Rusk, Thompson, Dobrynin,
        Dubček.'
      tags:
      - 'name:rusk-dean'
      - 'name:thompson-llewellyn-e'
      - 'name:dobrynin-anatoly'
      - 'name:dubcek-alexander'
      src:
