      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      c: 'Johnson''s sixtieth birthday, at the Ranch. Dirksen, by telephone, 11:15 a.m.: "Are you any closer to going out
        there to that convention?" Johnson: "I haven''t made any plans to go and rather doubt that I will." Calls to Daley,
        Criswell and others in the afternoon; at 4:40 to Humphrey: he will not come to Chicago. Christian tells the press.
        Connally had found the Southern governors against a draft, by his account.'
      n: 'FRUS 1964–68, VI, doc. [341](https://history.state.gov/historicaldocuments/frus1964-68v06/d341) (the call to Dirksen).
        [Johnson and Dirksen, 11:15 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-office-noise-and-office),
        Conversation WH6808-03-13323; [Johnson and Daley, 4:08 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-august-27-1968),
