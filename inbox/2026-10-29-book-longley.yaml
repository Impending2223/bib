      when: June 26
      date: '1968-06-26'
      thread: court-fortas
      c: 'Eastland with Johnson at the White House, by Johnson''s account: Russell''s judgment "did not faze him in the slightest";
        his "strenuous objections to Fortas," a speech of Fortas''s likening the Negro''s struggle for equality to the Jew''s;
        in the end, he thought, Russell would not support Fortas.'
      n: '[[w.longley-lbjs-1968]], 163. To check: [[w.johnson-vantage-point]], 547. See [[cal.1968-06-26.court]]. Names: Eastland,
