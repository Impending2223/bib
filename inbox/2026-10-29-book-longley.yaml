      when: June 22
      date: '1968-06-22'
      thread: court-fortas
      c: 'Clifford and Fortas with Johnson, after a meeting on Vietnam, by Clifford''s account: Fortas to be Chief Justice
        and Thornberry to take his seat. Clifford: "I do not think you can sell that package to Congress"; the Republicans
        will stall both until November; name a prominent Republican instead. Johnson: "Well, I don''t intend to put some damned
        Republican on the Court."'
      n: '[[w.longley-lbjs-1968]], 161–62. To check: [[w.clifford-counsel-to-the-president-2]], 555–56. Names: Clifford, Fortas,
        Thornberry, Johnson.'
