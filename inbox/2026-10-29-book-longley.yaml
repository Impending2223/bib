        Conversation WH6808-03-13328; [Johnson, Humphrey and Jones, 4:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-jim-jones-telephone-operators),
        Conversation WH6808-03-13329 (Miller Center). [[w.longley-lbjs-1968]], 219–21 (the day; Longley gives 4:45 for the
        call to Humphrey). To check: [[w.connally-in-historys-shadow]], 203. See [[cal.1968-08-26.elections-1968]]. Names:
        Dirksen, Daley, Criswell, Humphrey, Christian, Connally, Johnson.'
