- add:
    entry:
      id: cal.1968-02-01.opinion
      when: Feb. 1
      date: '1968-02-01'
      thread: opinion
      c: 'Panzer to Johnson: Quayle''s telephone poll on the State of the Union, Jan. 19–20: favorable 45 percent, unfavorable
        55. More favorable among those who saw or heard it than among those told of it; unfavorable among 40 percent of the
        Democrats; most unfavorable, men 21 to 49.'
      n: '[[w.longley-lbjs-1968]], 30. To check: Fred Panzer to Johnson, Feb. 1, 1968, Speeches, Box 151, LBJ Library (cited
        by [[w.longley-lbjs-1968]], 30 n.58). See [[cal.1968-01-17.program]]. Names: Johnson.'
      tags:
