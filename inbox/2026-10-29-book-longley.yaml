      when: Oct. 30
      date: '1968-10-30'
      thread: elections-1968-chennault
      c: 'DeLoach to the White House, from the FBI''s tap on the South Vietnamese embassy: Bùi Diễm to a woman the FBI takes
        to be Anna Chennault, "just among us," he cannot go into specifics on the telephone, but something "is cooking"; she
        is to come over, after a lunch with Spiro Agnew''s wife. Chennault at the embassy more than an hour that day, half
        an hour the next (Rostow to Johnson).'
      n: '[[w.longley-lbjs-1968]], 239. To check: Rostow to Johnson, Oct. 30 and 31, 1968, Anna Chennault Record, Individual
        Reviewed Folders from Various Collections, Folder 1 of 2, LBJ Library (cited by [[w.longley-lbjs-1968]], 239 nn.26–27).
