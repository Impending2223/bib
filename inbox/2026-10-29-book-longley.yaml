      when: July 31
      date: '1968-07-31'
      thread: court-fortas
      c: 'News conference. Asked whether he is discouraged by the Senate''s treatment of Fortas: "I don''t know that I can
        improve the situation by any comments that I would make. I certainly don''t want to inflame it any." How he chose
        Fortas and Thornberry; while the clearances were being sought, Republican Senators had said no appointment should
        be made in an election year.'
      n: 'The President''s News Conference of July 31, 1968, [1968–69 Pub. Papers 856](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=166)
        (July 31, 1968). [[w.longley-lbjs-1968]], 177 (the question and answer). Check: Longley gives as Johnson''s own the
        words on Thornberry he quotes from Christopher (177). See [[cal.1968-06-26.court]]. Names: Fortas, Thornberry, Johnson.'
      tags:
      - 'name:fortas-abe'
      - 'name:thornberry-william-h'
      - 'name:johnson-lyndon-b'
      src:
