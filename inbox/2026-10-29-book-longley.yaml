      when: Mar. 18
      date: '1968-03-18'
      thread: vietnam
      c: 'Johnson with Bùi Diễm, South Vietnam''s ambassador, before his return to Saigon, 6:30 to 7:10 p.m.: the criticism
        here aimed at the South Vietnamese themselves; ask MACV for a list of inefficient or corrupt commanders and "get rid
        of them"; Thiệu and Kỳ to "work together and get moving."'
      n: 'FRUS 1964–68, VI, doc. [140](https://history.state.gov/historicaldocuments/frus1964-68v06/d140). [[w.longley-lbjs-1968]],
        78–79. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-01-30.vietnam]]. Names: Bùi Diễm, Johnson, Nguyễn Văn
        Thiệu, Nguyễn Cao Kỳ.'
