        rows:
        - 'w.longley-lbjs-1968 30: all'
        - 'via w.longley-lbjs-1968 30 n.58: all'
- add:
    entry:
      id: cal.1968-02-06.vietnam-tet
      when: Feb. 6
      date: '1968-02-06'
      thread: vietnam-tet
      also:
      - japan-and-korea-pueblo
      c: 'Breakfast with the Democratic leaders of Congress, Boggs and Mansfield among them. Robert Byrd: poor intelligence,
        poor preparation for the attacks, the Viet Cong''s morale underestimated, South Vietnam''s support overestimated.
        Johnson: "I don''t agree with any of that"; at Panmunjom, "we are trying to keep them talking." At the Tuesday lunch
        Johnson is called away: Byrd, to apologize.'
      n: 'FRUS 1964–68, VI, doc. [58](https://history.state.gov/historicaldocuments/frus1964-68v06/d58) (Byrd''s four points,
        read to the advisers); doc. [59](https://history.state.gov/historicaldocuments/frus1964-68v06/d59) (the apology).
        [[w.longley-lbjs-1968]], 46, 60 (the breakfast). To check: Notes of the President''s Meeting with the Democratic Congressional
        Leadership, Feb. 6, 1968, Tom Johnson''s Notes of Meetings, Box 2, LBJ Library (cited by [[w.longley-lbjs-1968]],
        46 n.39, 60 n.20). Made public: FRUS 1964–68, VI (2002). Check: Longley names Harry Byrd at the breakfast (46); FRUS
        and Longley (60) Robert Byrd. See [[cal.1968-01-30.vietnam]]. Names: Boggs, Mansfield, Robert C. Byrd, Johnson.'
      tags:
      - 'name:boggs-hale'
      - 'name:mansfield-mike'
      - 'name:byrd-robert-c'
      - 'name:johnson-lyndon-b'
      src:
