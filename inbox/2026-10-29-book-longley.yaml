      when: Aug. 20
      date: '1968-08-20'
      thread: testing-missile-talks
      also:
      - soviet-union-czechoslovakia
      c: 'The Tuesday lunch, by Clifford''s account: Johnson, with sherry, "let us drink to a summit conference in the Soviet
        Union in October." Rusk: the Soviets would not move on Czechoslovakia having agreed to announce it. Helms: the Soviet
        Central Committee in emergency session.'
      n: '[[w.longley-lbjs-1968]], 186–88. To check: [[w.clifford-counsel-to-the-president-2]], 559–61. See [[cal.1968-07-25.testing]].
        Names: Johnson, Rusk, Helms, Clifford.'
      tags:
