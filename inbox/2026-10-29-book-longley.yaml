      - court-fortas
      c: 'Griffin (R-Mich.) in the Senate, on a report that Warren has resigned: he will not vote to confirm "an appointment
        of the next Chief Justice by a ''lame duck'' President"; such a President "would be breaking faith with our system";
        the appointment should be made by the next President, "after the people have an opportunity to speak in November."'
      n: '[114 Cong. Rec. 18171](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt14/pdf/GPO-CRECB-1968-pt14-3-1.pdf#page=21)
