      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'Johnson to Kosygin, through Rusk and the embassy in Moscow: "I am urging your most serious personal attention to
        the irrational action of North Korean authorities in seizing the USS Pueblo in international waters"; it "cannot be
        accepted."'
      n: 'FRUS 1964–68, XXIX, pt. 1, doc. [224](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d224). [[w.longley-lbjs-1968]],
        40 (the letter, quoted in n.22). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]].
        Names: Johnson, Kosygin, Rusk.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:kosygin-aleksei'
      - 'name:rusk-dean'
      src:
        c: ecf4da86
        rows:
