      date: '1968-08-09'
      thread: democratic-party
      also:
      - elections-1968-chicago
      c: 'Criswell, writing as "Bert" from Chicago, to Jim Jones: Johnson should come to the convention on the Tuesday night,
        his birthday, with no word beforehand; fireworks on the lake front; "I''m for a draft, and I''ll start it if there
        is any chance he will do it." Daley, told: "He should come here and let us whoop it up like it should be."'
      n: '[[w.longley-lbjs-1968]], 209–10. To check: John Criswell to Jim Jones, Aug. 9, 1968, Confidential File, Box 77,
