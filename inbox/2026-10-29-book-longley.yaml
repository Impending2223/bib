- add:
    entry:
      id: cal.1968-01-26.japan-and-korea-pueblo-2
      when: Jan. 26
      date: '1968-01-26'
      thread: japan-and-korea-pueblo
      c: 'Johnson with Hugh Sidey of *Time* and Jack Horner of the *Washington Star*, nothing to be attributed to him or the
        White House: the seizure "banditry on the high seas"; the first option diplomatic; "I hope it will not be necessary
        to use military force." Perhaps tied to Vietnam, to draw forces or attention away.'
      n: '[[w.longley-lbjs-1968]], 41–42 (no note). Check: Longley gives no source for the meeting. See [[cal.1968-01-23.japan-and-korea]].
        Names: Sidey, Johnson.'
      tags:
      - 'name:sidey-hugh'
      - 'name:johnson-lyndon-b'
      src:
        c: 039c41aa
        rows:
        - 'w.longley-lbjs-1968 41–42: all'
- add:
    entry:
      id: cal.1968-01-30.republican-party-congress
      when: Jan. 30
      date: '1968-01-30'
      thread: republican-party-congress
      also:
      - japan-and-korea-pueblo
      c: 'Dirksen and Ford with Johnson on the *Pueblo*, late in the day. Ford presses on the mistakes made: "If I had known
        what was on that vessel I might have blown it out of the water myself"; "your attitude is one of excuse rather than
        how to prevent it from happening again." Johnson: "I think the mistake was made by the North Koreans"; "When you send
        out a spy he sometimes does not come back."'
      n: '[[w.longley-lbjs-1968]], 44–45. To check: Notes of the President''s Meeting with Senator Dirksen and Congressman
        Ford, Jan. 30, 1968, Tom Johnson''s Notes of Meetings, Box 2, LBJ Library (cited by [[w.longley-lbjs-1968]], 45 n.33).
        See [[cal.1968-01-23.japan-and-korea]]. Names: Dirksen, Ford, Johnson.'
      tags:
      - 'name:dirksen-everett'
      - 'name:ford-gerald-r'
      - 'name:johnson-lyndon-b'
      src:
        c: df0e9498
        rows:
        - 'w.longley-lbjs-1968 44–45: all'
        - 'via w.longley-lbjs-1968 45 n.33: all'
- add:
    entry:
      id: cal.1968-01-31.vietnam-tet-2
      when: Jan. 31
      date: '1968-01-31'
      thread: vietnam-tet
      also:
      - japan-and-korea-pueblo
      c: 'Breakfast with the congressional leaders on defense, 8:40 a.m.: Stennis, Margaret Chase Smith, Hayden, Milton Young,
        Mahon, Bow, Bates. Johnson: "A desperate attack is being launched against us in Vietnam"; the North Koreans and Vietnam
        "a coordinated challenge"; "I ask you to measure your statements before you make them"; "We may have to extend enlistments.
        We may have to have 100 million dollars for Korea. We may need further call-ups." Helms: the incursions along the
        DMZ and the *Pueblo* connected, to divert attention from Vietnam.'
      n: 'FRUS 1964–68, VI, doc. [39](https://history.state.gov/historicaldocuments/frus1964-68v06/d39). [[w.longley-lbjs-1968]],
        45, 57–58 (the breakfast). Made public: FRUS 1964–68, VI (2002). Check: Longley names Rivers at the breakfast (45,
        57); FRUS''s list of those present does not. See [[cal.1968-01-30.vietnam]]. Names: Stennis, Margaret Chase Smith,
        Hayden, Milton Young, Mahon, Bow, Bates, Helms, Johnson.'
