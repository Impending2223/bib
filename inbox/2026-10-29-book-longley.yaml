      thread: elections-1968-chicago
      also:
      - vietnam-paris
      c: 'Chicago, the convention''s first day. Watson, sent by Johnson, to Humphrey: the plank on Vietnam Humphrey''s people
        worked out "doesn''t meet with the President''s approval"; "You must stay the course on Vietnam if you expect to be
        nominated." Humphrey to Johnson by telephone: Rusk and Rostow approved it. Johnson: "this plank just undercuts our
        whole policy." By Humphrey''s and Watson''s accounts.'
      n: '[[w.longley-lbjs-1968]], 212–13. To check: [[w.humphrey-education-of-a-public-1976]], 292; [[w.watson-chief-of-staff]],
        296–99; [[w.witcover-year-the-dream-died]], 315; [Johnson and Watson, 10:39 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-marvin-watson-machine-noise-and-office),
        Conversation WH6808-02-13320 (Miller Center). See [[cal.1968-07-09.elections-1968]]. Names: Watson, Humphrey, Rusk,
        Rostow, Johnson.'
