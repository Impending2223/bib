      date: '1968-06-29'
      thread: court-fortas
      c: 'Califano to Johnson on the campaign for Fortas: Paul Austin of Coca-Cola, who feels the Republicans and Southern
        Democrats are "insulting not only you, but the office of the Presidency," to call Russell, Talmadge, Harry Byrd and
        others; Weisl to ask Newhouse for editorials in the New Orleans *Times-Picayune* to move the Louisiana Senators; Clifford
        and the du Ponts for the Rhode Island Senators. Johnson, by Califano''s account, in charge of the effort himself.'
      n: '[[w.longley-lbjs-1968]], 165–66. To check: Califano to Johnson, June 29, 1968, Files Pertaining to Abe Fortas and
        Homer Thornberry, Box 1, LBJ Library (cited by [[w.longley-lbjs-1968]], 166 nn.22, 23, 26); [[w.califano-triumph-and-tragedy-of]],
