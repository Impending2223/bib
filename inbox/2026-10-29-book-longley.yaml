      when: Feb. 7
      date: '1968-02-07'
      thread: vietnam-khe-sanh
      also:
      - vietnam-tet
      c: 'The National Security Council, 12:29 p.m. Wheeler: Lang Vei evacuated; 670 Americans dead so far, the enemy''s dead
        24,199. Johnson: "Bob, are you worried?" McNamara: "I am not worried about a true military defeat." Wheeler: "this
        is not a situation to take lightly." Johnson: "Everything he wants, let''s get it to him."'
      n: 'FRUS 1964–68, VI, doc. [60](https://history.state.gov/historicaldocuments/frus1964-68v06/d60). [[w.longley-lbjs-1968]],
        61–62. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-01-08.vietnam-2]]. Names: Wheeler, McNamara, Johnson.'
