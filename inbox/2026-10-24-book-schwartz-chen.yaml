        [265](https://history.state.gov/historicaldocuments/frus1964-68v01/d265). Statement by the President Upon Instructing
        the Navy To Take Retaliatory Action in the Gulf of Tonkin, [1963–64 Pub. Papers 926](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=166)
        (Aug. 3, 1964). *The Gulf of Tonkin, the 1964 Incidents* (K–J Cong. II.J.3). [President''s Daily Diary, Aug. 2, 1964](https://catalog.archives.gov/id/192444),
        image 1; [Aug. 3](https://catalog.archives.gov/id/192445), image 1 (LBJ Library; National Archives Catalog). [[w.gibbons-u-s-government-and]],
        II, 285–286; [[w.frankum-like-rolling-thunder]], 13–14; [[w.vietnam-victory-in-vietnam]], 132; [[w.kaplan-mcnamara-ascendancy-1961-1965]],
        519; [[w.cosmas-joint-chiefs-of-staff-2012]], 105; [[w.marolda-united-states-navy-and]], 411–421; [[w.jian-maos-china-and-the]],
        213 (by Le Duan''s account to Mao, Aug. 13, the attack of Aug. 2 the local commander''s decision). To check: [[w.goulden-truth-is-the-first]];
        [[w.galloway-gulf-of-tonkin-resolution]]; [[w.austin-presidents-war]]; [[w.windchy-tonkin-gulf]]; [[w.moise-tonkin-gulf-and-the-2019]];
        [[w.johns-opening-pandoras-box]]; [[w.siff-why-the-senate-slept]]; [[w.hanyok-skunks-bogies-silent-hounds]]; [[w.hanyok-spartans-in-darkness]];
        [[w.shultz-secret-war-against-hanoi]]; [[w.conboy-spies-and-commandos]]; [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]];
        [[w.mcmaster-dereliction-of-duty-1997]]; [[w.vandemark-into-the-quagmire]]; [[w.mcnamara-in-retrospect]]; [[w.johnson-vantage-point]];
        [[w.taking-charge-2001]]; [[w.jim-in-love-and-war]]. See [[cal.1964-07-27.vietnam]]. Names: Johnson. Check: *Victory
        in Vietnam* has three boats of the 135th Torpedo Boat Group drive off the Maddox and shoot down one aircraft (132).'
- add:
    entry:
      id: cal.1960-07.china
      when: July
      date: 1960-07
      thread: china
      also:
      - soviet-union
      c: Khrushchev recalls all Soviet experts from China and sharply cuts Soviet material and military aid.
      n: '[[w.jian-maos-china-and-the]], 82 (by the Chinese histories). Washington''s knowledge: [FRUS 1958–60, XIX, doc.
        348](https://history.state.gov/historicaldocuments/frus1958-60v19/d348) (State''s Bureau of Intelligence and Research,
        Aug. 26: "an unusual exodus of Soviet technicians" reported from Peking since Aug. 12; 2,000 to 3,000 in China in
        all; "no firm evidence" yet that it is tied to the dispute). Names: Khrushchev. Check: the day of the recall.'
      tags:
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1964-08-05.china
      when: Aug. 5
      date: '1964-08-05'
      thread: china
      also:
      - vietnam
      c: 'Peking, on the Gulf of Tonkin. Zhou Enlai and Luo Ruiqing cable Hồ Chí Minh, Phạm Văn Đồng and Văn Tiến Dũng for
        closer military collaboration. The Central Military Commission puts the Kunming and Guangzhou military regions and
        the air and naval units of the south on combat readiness. The government''s statement: aggression against the Democratic
        Republic is aggression against China, which will not fail to come to its aid.'
      n: '[[w.jian-maos-china-and-the]], 212–14 (by the Chinese records). Washington''s knowledge: [FRUS 1964–68, I, doc.
        318](https://history.state.gov/historicaldocuments/frus1964-68v01/d318) (Saigon, Aug. 17: MiGs at Phúc Yên). Made
        public: the cable, *Beijing Review*, Nov. 30, 1979, by Chen''s note (354 n.34). See [[cal.1964-08-02.vietnam]]. Names:
        Zhou Enlai, Hồ Chí Minh, Phạm Văn Đồng. Check: the statement''s day; Chen''s note (355 n.42) gives the *People''s
        Daily* of Aug. 6, 1965.'
      tags:
      - name:zhou-enlai
      - name:ho-chi-minh
      - name:pham-van-dong
- add:
    entry:
      id: cal.1964-11.china
      when: Nov.
      date: 1964-11
      thread: china
      also:
      - soviet-union
      c: 'Moscow. Zhou Enlai with the new Soviet leaders on ending the polemics and mending relations: no result. By the Chinese
        accounts, Malinovsky asks the Chinese to remove Mao.'
      n: '[[w.jian-maos-china-and-the]], 84 (by the Chinese histories). Washington''s knowledge: [FRUS 1964–68, XIV, doc.
        74](https://history.state.gov/historicaldocuments/frus1964-68v14/d74) (Kohler, Nov. 19: "basic differences between
        USSR and CPR will continue"). See [[cal.1964-10-15.soviet-union]]. Names: Zhou Enlai, Malinovsky, Mao. Check: the
        days of the visit.'
      tags:
      - name:zhou-enlai
      - name:malinovsky-rodion-yakovlevich
      - name:mao-zedong
- add:
    entry:
      id: cal.1965-02-11.soviet-union
      when: Feb. 11
      date: '1965-02-11'
      thread: soviet-union
      also:
      - china
      - vietnam
      c: 'Peking. Kosygin, on his way home from Hanoi, with Mao and Zhou Enlai: let the two parties stop their polemics and
        act together for Vietnam. Mao refuses: the debate will go on for nine thousand years.'
      n: '[[w.jian-maos-china-and-the]], 231 (by a Chinese history, Cong Jin''s). In Washington, Feb. 7: [FRUS 1964–68, II,
        doc. 81](https://history.state.gov/historicaldocuments/frus1964-68v02/d81) (the NSC: Mansfield asks whether Kosygin
        will consult Peking on his way home; Thompson: he might). Made public: Cong Jin, *Quzhe fazhan de suiyue* (1989),
        by Chen''s note (358 n.107). See [[cal.1965-02-06.soviet-union]]. Names: Kosygin, Mao, Zhou Enlai.'
      tags:
      - name:kosygin-aleksei
      - name:mao-zedong
      - name:zhou-enlai
- add:
    entry:
      id: cal.1965-04-09.vietnam
      when: Apr. 9
      date: '1965-04-09'
      thread: vietnam
      also:
      - china
      c: Off Hainan, over the Gulf of Tonkin, American fighters on a diversionary flight engage Chinese MiGs; Chinese airspace
        probably entered (William Bundy, Apr. 13). By the Chinese records, two groups of American fighters over Hainan, Apr.
        8 and 9; that afternoon Mao orders the air force and navy to send their best units south and strike intruders.
      n: '[FRUS 1964–68, II, doc. 250](https://history.state.gov/historicaldocuments/frus1964-68v02/d250) (William Bundy to
        Rusk, Apr. 13). [[w.jian-maos-china-and-the]], 226–27 (the Chinese records). Names: William Bundy, Mao. Check: the
        Navy''s record of the engagement and its day.'
      tags:
      - name:bundy-william
      - name:mao-zedong
      - place:gulf-of-tonkin
- add:
    entry:
      id: cal.1965-05-31.vietnam
      when: May 31
      date: '1965-05-31'
      thread: vietnam
      also:
      - china
      c: 'Peking. Chen Yi calls in the British chargé d''affaires and asks that London pass four points to Washington: China
        will not provoke war with the United States; what China says counts; China is prepared; if the United States bombs
        China, that means war, with no limits. China supports Vietnam unconditionally, but will take direct part only if the
        war reaches Chinese territory. The same message, Chen Yi says, Zhou Enlai gave Ayub Khan, whose visit to Washington
        was put off.'
      n: '[FRUS 1964–68, II, doc. 321](https://history.state.gov/historicaldocuments/frus1964-68v02/d321) (editorial note).
        [[w.jian-maos-china-and-the]], 217–18 (by Hopson''s telegram to the Foreign Office, No. 720). To check: [[w.77-conversations-between-chinese]];
        [[w.hershberg-reading-and-warning-the]]; [[w.hershberg-informing-the-enemy]]. Names: Chen Yi, Zhou Enlai, Ayub Khan.
        Check: FRUS has Zhou and Ayub meet in Peking, Apr. 2 (II, doc. 321), or in Ayub''s March visit there (XXX, doc. 88
        n. 4); Chen, 217, at Karachi, Apr. 2.'
      tags:
      - name:chen-yi
      - name:zhou-enlai
      - name:ayub-khan-mohammad
- add:
    entry:
      id: cal.1965-06-04.vietnam
      when: June 4
      date: '1965-06-04'
      thread: vietnam
      also:
      - china
      c: 'McGeorge Bundy to Johnson, 11:10 a.m., with the British telegrams from Peking: Zhou Enlai''s message so interesting
        Johnson will want to read it himself. Rusk finds it relatively defensive. Bundy: it does not say at what point the
        Chinese might move in Vietnam in a way that would force the United States to act against China, "the $64 question."'
      n: '[FRUS 1964–68, XXX, doc. 88](https://history.state.gov/historicaldocuments/frus1964-68v30/d88); II, docs. [321](https://history.state.gov/historicaldocuments/frus1964-68v02/d321)
        (editorial note), [335](https://history.state.gov/historicaldocuments/frus1964-68v02/d335) (William Bundy to Rusk,
        June 5: London to tell Chen Yi the message was received). [[w.jian-maos-china-and-the]], 217–18 (the message), 355
        n.59. See [[cal.1965-05-31.vietnam]]. Names: McGeorge Bundy, Zhou Enlai, Rusk, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:zhou-enlai
- add:
    entry:
      id: cal.1965-06-06.vietnam
      when: June 6
      date: '1965-06-06'
      thread: vietnam
      also:
      - china
      c: 'The first Chinese engineering troops enter North Vietnam: the second division of the Chinese People''s Volunteer
        Engineering Force, over 12,000 men, to build defense works and communications on fifteen islands and eight points
        of the Tonkin Gulf coast, and to fight beside the North Vietnamese if the Americans invade. Under the agreements of
        Apr. 27 (railways) and May 30 (twelve roads). By Chinese figures, over 320,000 Chinese engineering and antiaircraft
        troops served in North Vietnam, 1965–69, 170,000 at the peak in 1967.'
      n: '[[w.jian-maos-china-and-the]], 221–25, 229 (by the Chinese military histories). Washington''s knowledge: [FRUS 1964–68,
        XXX, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v30/d113) (Cline, Dec. 6: "some Chinese Communist
        troops (albeit probably logistic ones) are already in Vietnam"); IV, doc. [52](https://history.state.gov/historicaldocuments/frus1964-68v04/d52)
        (Jan. 28, 1966: "two Chinese construction companies"). Made public: the Chinese military histories Chen cites, Han
        Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), and Li Ke and Hao Shengzhang (1989), by his notes
        (357–58); in English, [[w.jian-chinas-involvement-in-the]]. Check: the Chinese figures; Chen''s note (358 n.100) has
        Whiting give 50,000 Chinese troops in all, the Vietnamese sources 20,000.'
      tags:
      - place:gulf-of-tonkin
- add:
    entry:
      id: cal.1965-08-01.vietnam
      when: Aug. 1
      date: '1965-08-01'
      thread: vietnam
      also:
      - china
      c: The Chinese antiaircraft artillery's 61st and 63rd Divisions enter North Vietnam from Yunnan and Guangxi, asked for
        by Hanoi July 24, for Yên Bái and the Kép area, to defend the two railways to China. By Chinese figures, sixteen divisions,
        over 150,000 men, served there by rotation to March 1969.
      n: '[[w.jian-maos-china-and-the]], 225–26 (by the Chinese military histories). Made public: the Chinese military histories
        Chen cites, Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), and Li Ke and Hao Shengzhang (1989),
        by his notes (357–58); in English, [[w.jian-chinas-involvement-in-the]]. Check: the Chinese figures.'
      tags:
      - place:yen-bai
      - place:kep
