- add:
    entry:
      id: cal.1964-02-15.europe-and-the-alliance
      when: Feb. 15
      date: '1964-02-15'
      thread: europe-and-the-alliance
      also:
      - cuba
      c: 'Johnson to Heller, by telephone, 6:50 p.m., after Douglas-Home''s visit: "I am not an isolationist and I don''t
        want a fortress America but I am being driven to it more and more every day." Douglas-Home had defended Britain''s
        trade with Cuba, buses among it, before reporters at the White House, not, as Johnson had asked, its decline.'
      n: '[Johnson and Walter Heller, 6:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-heller-february-15-1964),
        Conversation WH6402-16-2091 (Miller Center). [[w.schwartz-lyndon-johnson-and-europe]], 32–33. To check: [[w.taking-charge]].
        See [[cal.1964-02-12.europe-and-the-alliance]]. Names: Heller, Douglas-Home, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:heller-walter-w
      - name:douglas-home-alec
- add:
    entry:
      id: cal.1965-06-28.economy
      when: June 28–30
      date: '1965-06-28'
      thread: economy
      also:
      - europe-and-the-alliance
      c: 'Sterling. Callaghan in Washington for American support of the pound. With Johnson, June 28: the two countries to
        "keep together" on money, no detail. June 30, at State, with McNamara, Ball and Bruce on the Defence Review: Britain''s
        defense budget to be held to £2 billion at 1964 prices by 1970. The Americans press for deflation, offering a part
        in a multilateral loan.'
      n: 'FRUS 1964–68, XII, docs. [243](https://history.state.gov/historicaldocuments/frus1964-68v12/d243) (Fowler to Johnson,
        June 28), [244](https://history.state.gov/historicaldocuments/frus1964-68v12/d244) (June 30). [[w.schwartz-lyndon-johnson-and-europe]],
        76–77 (by the British records and Bruce''s diary). Names: Callaghan, Johnson, McNamara, Ball, Bruce.'
      tags:
      - name:callaghan-james
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:ball-george-w
      - name:bruce-david-k-e
      - name:fowler-henry-h
- add:
    entry:
      id: cal.1965-08-05.economy
      when: Aug. 5
      date: '1965-08-05'
      thread: economy
      also:
      - europe-and-the-alliance
      c: 'Sterling. Johnson to Eugene Black, 10:07 a.m.: the British "laughing at us," sure the United States will not let
        the pound go. Martin to Johnson, 11:47 p.m.: the Governor of the Bank of England "absolutely disgusted" with Wilson''s
        government. Bator, called in the same night: a devaluation would be inconvenient for the United States, not a calamity.'
      n: '[Johnson and Eugene Black, 10:07 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-eugene-black-office-conversation-and-telephone),
        Conversation WH6508-01-8509; [Johnson and Martin, 11:47 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-mcc-martin-and-office-conversation),
        Conversation WH6508-02-8510 (Miller Center). [[w.schwartz-lyndon-johnson-and-europe]], 80–81. See [[cal.1965-06-28.economy]].
        Names: Black, Martin, Wilson, Bator, Johnson. Check: Bator''s notes of the meeting are dated Aug. 6 (Schwartz, 273
        n. 144).'
      tags:
      - name:johnson-lyndon-b
      - name:black-eugene-r
      - name:martin-william-mcchesney-jr
      - name:wilson-harold
      - name:bator-francis-m
- add:
    entry:
      id: cal.1965-09-10.economy
      when: Sept. 10
      date: '1965-09-10'
      thread: economy
      also:
      - europe-and-the-alliance
      c: 'Sterling. London, late Sept. 9: the Bank of England and the Chancellor of the Exchequer complete a multilateral
        package of $900 million to $1 billion, from ten countries and the Bank for International Settlements; the United States
        about $400 million, the Federal Reserve and the Exchange Stabilization Fund. The Bank of France withdraws. The Federal
        Reserve Bank of New York buys sterling from the morning of Sept. 10.'
      n: '[FRUS 1964–68, XII, doc. 249](https://history.state.gov/historicaldocuments/frus1964-68v12/d249) (Barr to Johnson,
        Sept. 10). [[w.schwartz-lyndon-johnson-and-europe]], 81–83 (the package). See [[cal.1965-08-05.economy]]. Check: Schwartz,
        81, gives $925 million in all.'
      tags:
      - name:barr-joseph-w
- add:
    entry:
      id: cal.1966-04-04.europe-and-the-alliance-france
      when: Apr. 4
      date: '1966-04-04'
      thread: europe-and-the-alliance-france
      c: 'State, 6 p.m.: Rusk, McNamara, Ball and Acheson on France and NATO. The reply to the French aide-mémoire of Mar.
        29 approved: American facilities out of France as promptly as possible. The North Atlantic Council to leave Paris,
        NATO''s military headquarters with it. If Bonn insists that French troops stay only under the present arrangements,
        the United States to back it fully; if Bonn negotiates, to urge safeguards and transit and overflight rights in France
        for the allies.'
      n: '[FRUS 1964–68, XIII, doc. 151](https://history.state.gov/historicaldocuments/frus1964-68v13/d151). [[w.schwartz-lyndon-johnson-and-europe]],
        107 (and McCloy''s instructions). See [[cal.1966-03-07.europe-and-the-alliance]]. Names: Rusk, McNamara, Ball, Acheson.'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:ball-george-w
      - name:acheson-dean-g
- add:
    entry:
      id: cal.1966-04-17.europe-and-the-alliance-france
      when: Apr. 17
      date: '1966-04-17'
      thread: europe-and-the-alliance-france
      c: 'Bonn. McCloy with Erhard, Schröder, von Hassel, Westrick and Carstens, an hour and a half, on the French troops
        in Germany. Erhard: a firm position toward de Gaulle, "if need be, hard"; the moment like Munich, 1938. McCloy: the
        President and Rusk will support any position the Federal Republic takes. Johnson had changed McCloy''s instructions,
        softer than State''s, on Bator''s telegram to the Ranch of Apr. 11.'
      n: '[FRUS 1964–68, XIII, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v13/d156). [[w.schwartz-lyndon-johnson-and-europe]],
        107–08 (the instructions changed, by Bator''s papers). See [[cal.1966-04-04.europe-and-the-alliance-france]]. Names:
        McCloy, Erhard, Schröder, von Hassel, Westrick, Carstens, de Gaulle, Rusk, Bator, Johnson.'
      tags:
      - name:mccloy-john-j
      - name:erhard-ludwig
      - name:schroder-gerhard
      - name:von-hassel-kai-uwe
      - name:westrick-ludger
      - name:carstens-karl
      - name:de-gaulle-charles
      - name:rusk-dean
      - name:bator-francis-m
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-05-19.europe-and-the-alliance-france
      when: May 19
      date: '1966-05-19'
      thread: europe-and-the-alliance-france
      c: 'The Cabinet Room, 6 p.m.: Johnson with Rusk, McNamara, Ball, Acheson, Bruce, Moyers, Bator and Rostow. A letter
        to Wilson approved in principle: not to be too exacting with the Germans, nor to freeze the nuclear sharing question.
        On Acheson''s draft aide-mémoire to France, Johnson wants nothing in writing and attacks officials who have assailed
        de Gaulle; Acheson, by Bruce''s diary, furious.'
      n: 'FRUS 1964–68, XIII, docs. [166](https://history.state.gov/historicaldocuments/frus1964-68v13/d166) (Bruce''s diary),
        [168](https://history.state.gov/historicaldocuments/frus1964-68v13/d168) (the letter, May 20). Made public: FRUS 1964–68,
        XIII (1995). [[w.schwartz-lyndon-johnson-and-europe]], 109–10. See [[cal.1966-04-04.europe-and-the-alliance-france]].
        Names: Rusk, McNamara, Ball, Acheson, Bruce, Moyers, Bator, Rostow, Wilson, de Gaulle, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:ball-george-w
      - name:acheson-dean-g
      - name:bruce-david-k-e
      - name:moyers-bill
      - name:bator-francis-m
      - name:rostow-walt-w
      - name:wilson-harold
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1966-07-05.europe-and-the-alliance
      when: July 5
      date: '1966-07-05'
      thread: europe-and-the-alliance
      c: 'Erhard to Johnson: France to make clear commitments for its troops in Germany; a joint integrated force among the
        willing allies not to be excluded in future; on the offset, payments and services other than arms to count, and the
        offset not to be tied to the presence of American troops. Johnson has McGhee acknowledge it and holds his reply.'
      n: '[FRUS 1964–68, XV, doc. 155](https://history.state.gov/historicaldocuments/frus1964-68v15/d155); XIII, doc. [193](https://history.state.gov/historicaldocuments/frus1964-68v13/d193)
        (Bator to Johnson, Aug. 11: the reply). Made public: FRUS 1964–68, XV (1999). [[w.schwartz-lyndon-johnson-and-europe]],
        117. See [[cal.1965-12-20.europe-and-the-alliance]]. Names: Erhard, McGhee, Johnson.'
      tags:
      - name:erhard-ludwig
      - name:johnson-lyndon-b
      - name:mcghee-george-c
- add:
    entry:
      id: cal.1966-08-23.europe-and-the-alliance
      when: Aug. 23
      date: '1966-08-23'
      thread: europe-and-the-alliance
      c: 'Johnson''s meeting, 6:30 p.m., on the German offset and the British and American forces in Germany: how to keep
        Britain from sharp cuts in its forces there, and what to do about the American offset agreement, which runs out in
        June 1967. McNamara and Fowler for holding Bonn to full offset; Ball for a softer line; State and Bator for talks
        of the three governments, McCloy the American. Johnson approves the talks.'
      n: '[FRUS 1964–68, XIII, doc. 197](https://history.state.gov/historicaldocuments/frus1964-68v13/d197) (Bator''s briefing).
        [[w.schwartz-lyndon-johnson-and-europe]], 123–25 (the meeting, by Bator''s papers). Names: McNamara, Fowler, Ball,
        Bator, McCloy, Johnson. Check: Schwartz, 124, has the meeting at the Ranch, "in late August"; Bator''s briefing is
        dated Washington, Aug. 23, 4 p.m.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:fowler-henry-h
      - name:ball-george-w
      - name:bator-francis-m
      - name:mccloy-john-j
- add:
    entry:
      id: cal.1966-08-25.europe-and-the-alliance
      when: Aug. 25–26
      date: '1966-08-25'
      thread: europe-and-the-alliance
      c: 'Johnson to Erhard, Aug. 25, before his cabinet''s budget meeting, and to Wilson, Aug. 26: the three governments
        to explore together "this entire range of issues: force levels, deployments and the sharing of the foreign exchange
        burden," finance ministers with foreign and defense. To Wilson: "it would be foolish to run down our assets vis-a-vis
        Moscow without some quid-pro-quo." To Erhard: the present offset agreement to be met.'
      n: '[FRUS 1964–68, XIII, doc. 198](https://history.state.gov/historicaldocuments/frus1964-68v13/d198) (to Wilson; the
        letter to Erhard, its note). [[w.schwartz-lyndon-johnson-and-europe]], 123–25. See [[cal.1966-08-23.europe-and-the-alliance]].
        Names: Erhard, Wilson, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:erhard-ludwig
      - name:wilson-harold
- add:
    entry:
      id: cal.1966-08-31.europe-and-the-alliance
      when: Aug. 31
      date: '1966-08-31'
      thread: europe-and-the-alliance
      also:
      - congress
      c: 'Senate. Mansfield and others offer S. Res. 300: with present techniques and logistics, a substantial reduction of
        American forces in Europe can be made without harm to the commitments to NATO; where it conflicts with S. Res. 99
        of Apr. 4, 1951, it controls.'
      n: '[Daily Digest, D473](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=471)
        (Aug. 31, 1966). [FRUS 1964–68, XIII, doc. 199](https://history.state.gov/historicaldocuments/frus1964-68v13/d199)
        (MacArthur to Rusk, Sept. 1: Kuchel and Dirksen). [[w.schwartz-lyndon-johnson-and-europe]], 121–22 (twelve cosponsors).
        Names: Mansfield. Check: the resolution''s page in the Record.'
      tags:
      - name:mansfield-mike
- add:
    entry:
      id: cal.1966-09-01.europe-and-the-alliance
      when: Sept. 1
      date: '1966-09-01'
      thread: europe-and-the-alliance
      c: 'Johnson to Russell Long, by telephone, 10:07 a.m., on Mansfield''s resolution: "This thing y''all did yesterday
        really murdered us on NATO." Two weeks of "a war with the British" to hold their cuts until they could be matched
        with American ones.'
      n: '[FRUS 1964–68, XV, doc. 165](https://history.state.gov/historicaldocuments/frus1964-68v15/d165). Made public: FRUS
        1964–68, XV (1999). [[w.schwartz-lyndon-johnson-and-europe]], 122–23. See [[cal.1966-08-31.europe-and-the-alliance]].
        Names: Russell Long, Mansfield, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:long-russell-b
      - name:mansfield-mike
- add:
    entry:
      id: cal.1967-03-01.europe-and-the-alliance
      when: Mar. 1
      date: '1967-03-01'
      thread: europe-and-the-alliance
      c: 'The trilateral talks. Johnson''s instructions to McCloy: force levels to be agreed among the allies on security
        grounds alone, broadly construed; Germany to decide its purchases in the United States and Britain; the rest of the
        balance of payments cost to be met by cooperation in managing monetary reserves. McCloy with Johnson at the White
        House, an hour: the draft says nothing on troop cuts, he objects. Johnson: "My judgment is that we''ll have to cut
        two divisions"; the Germans "have got to put something in the family pot."'
      n: '[FRUS 1964–68, XIII, doc. 238](https://history.state.gov/historicaldocuments/frus1964-68v13/d238) (the letter).
        [[w.schwartz-lyndon-johnson-and-europe]], 152–55 (the meeting, by the memorandum of conversation, LBJ Library). See
        [[cal.1966-09-26.europe-and-the-alliance]]. Names: McCloy, Johnson. Check the day of the meeting: Schwartz, 153, Mar.
        1; his notes, the memorandum of Mar. 2.'
      tags:
      - name:johnson-lyndon-b
      - name:mccloy-john-j
- add:
    entry:
      id: cal.1967-03-08.europe-and-the-alliance
      when: Mar. 8
      date: '1967-03-08'
      thread: europe-and-the-alliance
      c: 'The trilateral talks. Johnson with Rusk, McNamara, Fowler, McCloy, Rostow and Bator, 12:45 p.m. McCloy: Britain
        will take less than full offset, but $40 million lies between its demand and the German offer; Kiesinger''s cabinet
        meets Mar. 15, and Duckwitz suggests a letter from Johnson before it. McNamara and Fowler against paying any of the
        gap. Johnson asks whether a bargain might run: the United States to cut one division, Britain one brigade, the Germans
        and British to split the $40 million.'
      n: '[FRUS 1964–68, XIII, doc. 240](https://history.state.gov/historicaldocuments/frus1964-68v13/d240). [[w.schwartz-lyndon-johnson-and-europe]],
        156. See [[cal.1967-03-01.europe-and-the-alliance]]. Names: Rusk, McNamara, Fowler, McCloy, Rostow, Bator, Kiesinger,
        Duckwitz, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:fowler-henry-h
      - name:mccloy-john-j
      - name:rostow-walt-w
      - name:bator-francis-m
      - name:kiesinger-kurt-georg
      - name:duckwitz-georg-ferdinand
- add:
    entry:
      id: cal.1967-03-11.europe-and-the-alliance
      when: Mar. 11
      date: '1967-03-11'
      thread: europe-and-the-alliance
      c: 'Johnson to Kiesinger, for delivery at once, before the German cabinet''s meeting of Mar. 15: Bonn''s readiness to
        deal with the British problem "a real contribution to Alliance solidarity"; he will "hold the line against any steps
        which would significantly weaken NATO"; "a limited rotational plan" can satisfy NATO''s requirements. The nonproliferation
        treaty.'
      n: '[FRUS 1964–68, XIII, doc. 241](https://history.state.gov/historicaldocuments/frus1964-68v13/d241). [[w.schwartz-lyndon-johnson-and-europe]],
        156–57. See [[cal.1967-03-08.europe-and-the-alliance]]. Names: Kiesinger, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:kiesinger-kurt-georg
