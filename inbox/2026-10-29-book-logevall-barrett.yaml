      when: Jan. 11
      date: '1965-01-11'
      thread: vietnam-congress
      c: 'Russell, to reporters: no victory without a stable government in Saigon, not with "changing chair" governments; a fundamental reappraisal of policy.'
      n: '[[w.logevall-choosing-war]], 309 (the remarks, Jan. 11). To check: *Washington Post* and *New York Times*, Jan. 12, 1965 (cited by [[w.logevall-choosing-war]], 309 n.15). See [[cal.1963-12-07.vietnam-congress]]. Names: Russell.'
