      - name:wilson-harold
- add:
    entry:
      id: cal.1965-05-17.vietnam
      when: May 17
      date: '1965-05-17'
      thread: vietnam
      c: 'Clifford to Johnson, a letter: ground forces "kept to a minimum," for the protection of American installations. "This could be a quagmire," an "open end commitment" without "a realistic hope of ultimate victory." Every avenue to a settlement to be probed: "It won''t be what we want, but we can learn to live with it."'
      n: '[FRUS 1964–68, II, doc. 307](https://history.state.gov/historicaldocuments/frus1964-68v02/d307). [[w.barrett-uncertain-warriors]], 33 (the letter; the quotations). Made public: [[w.clifford-counsel-to-the-president-2]] (1991), as Barrett cites it; FRUS 1964–68, II (1996). Names: Clifford, Johnson.'
      src:
        c: 0295eaca
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d307: all'
        - 'w.barrett-uncertain-warriors 33: all'
        - 'via w.barrett-uncertain-warriors 33 n.73: all'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-06-18.vietnam-july-decision
      when: June 18
      date: '1965-06-18'
      thread: vietnam-july-decision
      c: 'Ball to Johnson, "Keeping the Power of Decision in the South Viet-Nam Crisis": "Things are in the saddle, and ride mankind"; commitments to be limited in time and size. American forces to 100,000, "but no more," the monsoon a test period. The French defeated with 250,000 men still in the field. Sent through Moyers.'
      n: '[FRUS 1964–68, III, doc. 7](https://history.state.gov/historicaldocuments/frus1964-68v03/d7). [[w.barrett-uncertain-warriors]], 27–28 (the memorandum; the quotations; sent through Moyers). Made public: FRUS 1964–68, III (1996). Names: Ball, Johnson, Moyers.'
      src:
        c: b4a0b2f4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d7: A-D'
        - 'w.barrett-uncertain-warriors 27–28: A, D-E'
        - 'via w.barrett-uncertain-warriors 28 n.50: A, D'
      tags:
      - name:ball-george-w
      - name:johnson-lyndon-b
      - name:moyers-bill
- add:
    entry:
      id: cal.1965-06-21.vietnam-july-decision
      when: June 21
      date: '1965-06-21'
      thread: vietnam-july-decision
      c: 'Moyers to Ball, by telephone, 3:30 p.m.: Johnson read the memorandum at Camp David over the weekend, and agrees "in substance with most of" it. By Moyers''s notes of Johnson''s words: "I don''t think I should go over 100,000 but think I should go to that number and explain it"; Ball to work up, over ninety days, what follows the monsoon.'
      n: '[FRUS 1964–68, III, doc. 11](https://history.state.gov/historicaldocuments/frus1964-68v03/d11). [[w.barrett-uncertain-warriors]], 28 (the report; Johnson''s words, from [[w.ball-past-has-another-pattern]], 396). Made public: [[w.ball-past-has-another-pattern]] (1982), as Barrett cites it. See [[cal.1965-06-18.vietnam-july-decision]]. Names: Moyers, Ball, Johnson.'
      src:
        c: 4a8f6381
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d11: all'
        - 'w.barrett-uncertain-warriors 28: all'
      tags:
      - name:moyers-bill
      - name:ball-george-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-07-02.vietnam-july-decision-2
      when: July 2
      date: '1965-07-02'
      thread: vietnam-july-decision
      also:
      - republican-party
      c: 'Johnson and Eisenhower, by telephone, morning. Eisenhower: "When you once appeal to force in an international situation involving military help for a nation, you have to go all out." Johnson, by the notes of Eisenhower''s secretary: "Do you really think we can beat the Viet Cong?" Eisenhower: build up as fast as possible; without the British "We would still have the Australians and the Koreans, and our own convictions."'
      n: '[[w.barrett-uncertain-warriors]], 41 (the call; the quotations, from the notes of Eisenhower''s secretary, Lillian Brown). Check: the Eisenhower Library''s memorandum has 10:55 a.m.; the recording, 11:02. To check: [Johnson and Eisenhower, 11:02 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-july-2-1965), Conversation WH6507-01-8303 (Miller Center); Memorandum of telephone conversation, 10:55 a.m., July 2, 1965, Eisenhower Library (cited by [[w.barrett-uncertain-warriors]], 41 n.101). See [[cal.1965-06-16.vietnam-2]]. Names: Johnson, Eisenhower.'
      src:
        c: d1feddd0
        rows:
        - 'w.barrett-uncertain-warriors 41: all'
        - 'via w.barrett-uncertain-warriors 41 n.101: all'
      tags:
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
