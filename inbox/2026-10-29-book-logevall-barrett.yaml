      when: Feb. 16
      date: '1965-02-16'
      thread: vietnam-congress
      c: 'Johnson with the House''s Democratic leaders, McCormack, Albert and Boggs, a briefing on Vietnam: talk of negotiation would weaken South Vietnam''s morale; no sign that Hanoi or Peking wants it.'
      n: '[[w.logevall-choosing-war]], 356 (the briefing, Feb. 16). To check: *Time*, Mar. 12, 1965 (cited by [[w.logevall-choosing-war]], 356 n.49). Names: Johnson, McCormack, Albert, Boggs.'
