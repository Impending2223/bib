      c: 'Johnson to McGeorge Bundy, by telephone, 11:24 a.m.: "it looks like to me that we''re getting into another Korea"; "I don''t think it''s worth fighting for and I don''t think we can get out." "What in the hell is Vietnam worth to me?" Bundy on Lippmann: a "diplomatic structure" within which South Vietnam goes under Hanoi''s control.'
