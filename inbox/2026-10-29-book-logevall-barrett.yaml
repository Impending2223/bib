      id: cal.1967-03-02.vietnam-congress
      when: Mar. 2
      date: '1967-03-02'
      thread: vietnam-congress
      also:
      - robert-kennedy
      c: 'Johnson to Russell, by telephone, 3:04 p.m., Russell called from the floor: Robert Kennedy''s proposal of the day already tried, the six days'' pause at Tet and the pauses before, and nothing from Hanoi; Russell to answer him. Russell: "I have some misgivings about getting into a debate ... but I''ll see about it." By his notes, "on Kennedy suggestion, turned down."'
      n: '[FRUS 1964–68, V, doc. 96](https://history.state.gov/historicaldocuments/frus1964-68v05/d96) (the call; Russell''s words); [Johnson and Russell, 3:04 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-march-2-1967), Citation #11605 (Miller Center). [[w.barrett-uncertain-warriors]], 68 (Russell called off the floor; his notes; his refusal). Made public: FRUS 1964–68, V (2002). To check: Russell''s notes, intra-office communications, Mar. 2, 1967, Russell Library (cited by [[w.barrett-uncertain-warriors]], 68 n.23). See [[cal.1967-03-02.robert-kennedy]]. Names: Johnson, Russell, Robert Kennedy.'
      src:
        c: 86ee13f0
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d96: A-C'
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-march-2-1967: A-C'
        - 'w.barrett-uncertain-warriors 68: A-B, D'
        - 'via w.barrett-uncertain-warriors 68 n.23: B, D'
      tags:
      - name:johnson-lyndon-b
      - name:russell-richard-b
      - name:kennedy-robert-f
