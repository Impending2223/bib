      when: Aug. 24
      date: '1965-08-24'
      thread: republican-party-congress
      also:
      - vietnam-congress
      c: 'Ford to Eisenhower, by telephone, other Republicans on the line: not to "undercut" the Republicans in Congress, who object to Johnson''s resting his policy on Eisenhower''s commitments. Eisenhower: his rule to "keep still while we are in a condition of crisis."'
      n: '[[w.barrett-uncertain-warriors]], 60 (the call; the quotations). Check: Barrett, 60, makes Ford the minority whip; he was the House''s minority leader from Jan. 4, 1965. To check: "Calls and Appointments 1965 (2)," DDE Appointment Book series, Eisenhower Library (cited by [[w.barrett-uncertain-warriors]], 60 n.159). See [[cal.1965-08-17.vietnam]]. Names: Ford, Eisenhower, Johnson.'
      src:
        c: '99183453'
        rows:
