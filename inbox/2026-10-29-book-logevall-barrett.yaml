      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-congress
      also:
      - vietnam-tet
      c: 'Johnson with the Democratic leadership, 8:30 to 10:06 a.m., the attacks of Tet begun. Robert Byrd on Khe Sanh: 5,000 men against 40,000; Johnson: the Joint Chiefs, in writing, prepared. Russell Long: the response soft. Johnson: "There are 700 enemy dead now as a result of our actions in Vietnam. That is not soft."'
      n: '[FRUS 1964–68, VI, doc. 35](https://history.state.gov/historicaldocuments/frus1964-68v06/d35). [[w.barrett-uncertain-warriors]], 111–12 (Long; Johnson''s answer). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-01-30.vietnam]]. Names: Johnson, Byrd, Long.'
