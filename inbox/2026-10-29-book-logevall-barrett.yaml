      - vietnam
      c: 'Johnson at Eufaula, Okla., dedicating the dam: "There are those that say you ought to go north and drop bombs.... We don''t want our American boys to do the fighting for Asian boys. We don''t want to get involved in a nation with 700 million people and get tied down in a land war in Asia."'
