      when: July 24
      date: '1964-07-24'
      thread: vietnam
      c: 'Johnson''s news conference, on de Gaulle''s call for a conference: "we do not believe in a conference called to ratify terror, so our policy is unchanged." The United States "seeks no wider war"; committed for ten years, "in three different administrations," to South Vietnam''s freedom.'
      n: 'The President''s News Conference, [1963–64 Pub. Papers 887](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=127) (July 24, 1964). [[w.logevall-choosing-war]], 188 (the answer to de Gaulle). Check: Logevall, 188, prints "conferences." See [[cal.1964-07-23.europe-and-the-alliance-france]]. Names: Johnson, de Gaulle.'
      src:
