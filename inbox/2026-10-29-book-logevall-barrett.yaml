    entry:
      id: cal.1965-02-25.vietnam-2
      when: Feb. 25
      date: '1965-02-25'
      thread: vietnam
      c: 'Rusk''s news conference: no negotiation until Hanoi shows it will stop. "The key to peace in Southeast Asia is the readiness of all those in that area to live at peace and to leave their neighbors alone." A conference "procedural"; what is wanted is "substance."'
      n: '[[w.logevall-choosing-war]], 353 (the news conference; the quotations). To check: [[w.department-of-state-bulletin]], [Mar. 15, 1965, 362](https://archive.org/details/departmentofstat521965unit/page/362/mode/1up) ("Secretary Rusk''s News Conference of February 25"); *Time*, Mar. 5, 1965, and *Washington Post*, Feb. 26, 1965 (cited by [[w.logevall-choosing-war]], 353 n.39). See [[cal.1965-02-24.vietnam-2]]. Names: Rusk.'
      src:
        c: 659a0646
        rows:
        - 'w.logevall-choosing-war 353: all'
        - 'via w.logevall-choosing-war 353 n.39: all'
      tags:
      - name:rusk-dean
