      when: Aug. 5
      date: '1964-08-05'
      thread: vietnam
      c: 'Johnson at Syracuse University, the morning after the reprisal: "there can be no peace by aggression and no immunity from reply." To the Atlantic allies: the challenge in Southeast Asia the same as "in Greece and Turkey, in Berlin and Korea, in Lebanon and in Cuba."'
      n: 'Remarks at Syracuse University on the Communist Challenge in Southeast Asia, [1963–64 Pub. Papers 928](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=168) (Aug. 5, 1964). [[w.logevall-choosing-war]], 206 (the passage for the Europeans). Check: Logevall, 206, prints "in Lebanon and in China." See [[cal.1964-08-02.vietnam]]. Names: Johnson.'
