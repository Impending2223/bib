      c: 'Mansfield on *Meet the Press*: neutralization of Southeast Asia, by agreement among the great powers, perhaps the best solution; a "full-scale debate" on the war in the Senate to come.'
      n: '[[w.logevall-choosing-war]], 305 (his words). To check: *New York Times*, Jan. 4, 1965 (cited by [[w.logevall-choosing-war]], 305 n.9). See [[cal.1964-12-09.vietnam]]. Names: Mansfield.'
