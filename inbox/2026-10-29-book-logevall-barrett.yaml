      id: cal.1965-03-06.vietnam
      when: Mar. 6
      date: '1965-03-06'
      thread: vietnam
      c: 'Johnson to Ball, by telephone: rather than hear U Thant''s and Wilson''s proposals he would "get sick and leave town"; he feels "crowded into a corner." Ball, as his lawyer, to hold off the pressure for negotiation until the North has felt the bombing.'
      n: '[[w.logevall-choosing-war]], 357 (the call; the words). To check: LBJ–Ball telcon, Mar. 6, 1965, Ball Papers, LBJ Library (cited by [[w.logevall-choosing-war]], 357 n.50). See [[cal.1965-02-24.vietnam-2]]. Names: Johnson, Ball, U Thant, Wilson.'
      src:
        c: c97f5b7c
        rows:
        - 'w.logevall-choosing-war 357: all'
        - 'via w.logevall-choosing-war 357 n.50c: all'
      tags:
