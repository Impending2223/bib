- edit:
    id: cal.1965-02-24.vietnam-2
    base: 9aa4efc3
    set:
      c: 'U Thant''s press conference at the UN: he has been in talks on Vietnam for some time. "I am sure that the great American people, if only they knew the true facts and the background to the developments in South Vietnam, will agree with me that further bloodshed is unnecessary." "As you know, in times of war and hostilities, the first casualty is truth." His talks with the parties: "concrete ideas and proposals" he cannot disclose.'
      n: '[FRUS 1964–68, II, doc. 161](https://history.state.gov/historicaldocuments/frus1964-68v02/d161) (editorial note: the press conference; extracts, *Papers of Adlai E. Stevenson*, VIII, 663–64). [[w.herring-lbj-and-vietnam]], 92–93 (the press conference and its words; before it, Bill Frye''s account of Thant''s first move in the *Chicago Sun-Times*, Feb. 21; after it, Reedy''s denial of any "authorized negotiations"; the *Times* for negotiations). [[w.logevall-choosing-war]], 352–53 (the press conference; the "concrete ideas and proposals"; the quotation). Check: Logevall, 353, has "if only they know." To check: the transcript, Stevenson Papers, Princeton, box 906 (cited by FRUS); *New York Times*, Feb. 17, 18, 21, 25, 1965 (cited by [[w.herring-lbj-and-vietnam]], 93 n.11); *New York Times*, Feb. 25, 1965 (cited by [[w.logevall-choosing-war]], 353 n.37). See [[cal.1964-08-06.vietnam-2]]. Names: U Thant.'
      src:
        c: ec06abf9
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d161: A'
        - 'w.herring-lbj-and-vietnam 92–93: A-C'
        - 'via w.herring-lbj-and-vietnam 93 n.11: A-C'
        - 'w.logevall-choosing-war 352–53: A-B, D'
        - 'via w.logevall-choosing-war 353 n.37: A-B, D'
- add:
    entry:
      id: cal.1963-08-31.vietnam-2
      when: Aug. 31
      date: '1963-08-31'
      thread: vietnam
      c: 'The State Department, 11 a.m.: Rusk, McNamara, Johnson, Taylor, McGeorge Bundy, Hilsman, Nolting and Kattenburg, the coup off. Kattenburg: acquiesce and the United States out within six months to a year; better "to withdraw in a dignified way." Rusk: "we will not pull out of Viet-Nam." Johnson: "Certainly we can''t pull out"; ties with Diệm to be restored.'
      n: '[FRUS 1961–63, IV, doc. 37](https://history.state.gov/historicaldocuments/frus1961-63v04/d37) (Hilsman''s memorandum). [[w.logevall-choosing-war]], 51 (the meeting; Kattenburg for withdrawal; Rusk, McNamara and Johnson against). Made public: the Pentagon Papers (1971), in part; FRUS 1961–63, IV (1991). Check: Logevall, 51, quotes Johnson, "disaster to pull out," and McNamara, "we have been winning the war," words not in Hilsman''s memorandum. To check: PP (Gravel), 2:741–43 (cited by [[w.logevall-choosing-war]], 51 n.24). See [[cal.1963-08-31.vietnam]]. Names: Rusk, McNamara, Johnson, Taylor, McGeorge Bundy, Hilsman, Nolting, Kattenburg, Diệm.'
      src:
        c: '84186174'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d37: all'
        - 'w.logevall-choosing-war 51: A-D'
        - 'via w.logevall-choosing-war 51 n.24a: A-D'
