      when: May 27
      date: '1964-05-27'
      thread: vietnam
      c: 'Lippmann with Johnson, McNamara, McGeorge Bundy and Ball at the White House, afternoon: neutralization, without guarantee, but no other way; a military course would fail, as France''s had. Johnson: American power greater than France''s; the reports showing the tide turning.'
