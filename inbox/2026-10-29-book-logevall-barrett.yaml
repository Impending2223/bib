      id: cal.1968-02-06.vietnam-congress
      when: Feb. 6
      date: '1968-02-06'
      thread: vietnam-congress
      also:
      - vietnam-tet
      c: 'Johnson with the Democratic congressional leadership, morning. Russell Long on the Pueblo. Robert Byrd: "we were not prepared for these attacks. We underestimated the morale and vitality of the Viet Cong. We overestimated the support of South Vietnam''s government." Johnson: "The popular thing now is to stress the mismanagement in Vietnam. I think there has been very little."'
      n: '[[w.barrett-uncertain-warriors]], 117–18 (the meeting; the quotations). [FRUS 1964–68, VI, doc. 59](https://history.state.gov/historicaldocuments/frus1964-68v06/d59) (the Tuesday lunch: Byrd''s four criticisms read out; his call of apology). To check: notes of the meeting with the Democratic congressional leadership, Feb. 6, 1968, Tom Johnson''s notes, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 118 n.31). See [[cal.1968-02-06.vietnam]]. Names: Johnson, Long, Byrd.'
      src:
        c: 959686bf
        rows:
