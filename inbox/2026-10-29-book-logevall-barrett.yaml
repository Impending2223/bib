      n: 'Remarks in Manchester to the Members of the New Hampshire Weekly Newspaper Editors Association, [1963–64 Pub. Papers 1160](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=400) (Sept. 28, 1964). [[w.logevall-choosing-war]], 238 (the passage). See [[cal.1964-09-25.elections-1964]]. Names: Johnson.'
