      when: July 23
      date: '1964-07-23'
      thread: europe-and-the-alliance-france
      also:
      - vietnam
      c: 'De Gaulle''s news conference: no military solution in South Vietnam; "since war cannot bring a solution, one must make peace." The Geneva conference reconvened, "in principle the same participants" as in 1954, without preconditions; the United States, China, the Soviet Union and France to leave Indochina, neutralized, with aid for its development.'
      n: '[[w.logevall-choosing-war]], 187–88 (the news conference; the quotations). To check: *New York Times*, July 24, 1964; Raskin and Fall, eds., *The Vietnam Reader* (cited by [[w.logevall-choosing-war]], 188 n.69). Names: de Gaulle.'
