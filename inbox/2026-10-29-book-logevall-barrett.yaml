      when: Feb. 19
      date: '1965-02-19'
      thread: vietnam
      also:
      - europe-and-the-alliance-france
      c: 'Couve de Murville with Johnson at the White House: Hanoi readier than Peking to negotiate, Peking likely to agree. Johnson: no running out on South Vietnam; "I''m not going to write the Vietcong a thank-you note for killing American boys at Pleiku."'
      n: '[[w.logevall-choosing-war]], 357 (the meeting; the words). To check: Memcon, Feb. 19, 1965, NSF VN, LBJ Library (cited by [[w.logevall-choosing-war]], 357 n.50). See [[cal.1965-02-07.vietnam]]. Names: Couve de Murville, Johnson.'
