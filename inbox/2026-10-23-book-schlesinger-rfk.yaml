- add:
    entry:
      id: cal.1963-05-29.civil-rights-the-executive
      when: May 29
      date: '1963-05-29'
      thread: civil-rights-the-executive
      c: 'The President''s Committee on Equal Employment Opportunity, Johnson its chairman, meets for the first time since November. Robert Kennedy: of some 2,000 federal employees in Birmingham, the Post Office and a Veterans Administration hospital apart, 15 Negroes.'
      n: 'Committee on Equal Employment Opportunity, Minutes of the Seventh Meeting, May 29, 1963, Johnson Papers (LBJ Library) (Check the file). [[w.schlesinger-robert-kennedy-and-his]], 335. See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1963-07-18.civil-rights-the-executive
      when: July 18
      date: '1963-07-18'
      thread: civil-rights-the-executive
      c: 'The equal employment committee''s eighth meeting, Johnson presiding. Robert Kennedy questions Webb on NASA''s equal employment staff, "one and a half men" in Washington: "I don''t think I am able to get the answers, to tell you the truth."'
      n: 'Committee on Equal Employment Opportunity, Transcript of Eighth Meeting, July 18, 1963, 33–38, Johnson Papers (LBJ Library) (Check the file). See [[cal.1963-05-29.civil-rights-the-executive]]. Check: [[w.schlesinger-robert-kennedy-and-his]], 335–36, puts the meeting "twenty days" after May 29; his note gives July 18. Names: Robert Kennedy, Webb, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:webb-james-e
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-07-29.robert-kennedy
      when: July 29
      date: '1964-07-29'
      thread: robert-kennedy
      also:
      - elections-1964
      c: The Oval Office, 1 p.m. Johnson, from a memorandum of Clifford's, tells Robert Kennedy he will not be the candidate for Vice President; offers help toward the Presidency later, another post, the running of the campaign. Kennedy declines the posts. Forty-five minutes.
      n: 'Kennedy''s dictated account, RFK Papers (JFK Library), printed in [[w.schlesinger-robert-kennedy-and-his]], 659–61. The statement: [[cal.1964-07-30.elections-1964]]. See [[cal.1964-03-10.elections-1964]]. Made public: Kennedy''s account, 1978 (Check). Names: Johnson, Robert Kennedy, Clifford.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:clifford-clark
- add:
    entry:
      id: cal.1966-01-31.robert-kennedy
      when: Jan. 31
      date: '1966-01-31'
      thread: robert-kennedy
      also:
      - vietnam
      c: 'Robert Kennedy in the Senate on the bombing''s resumption: "if we regard bombing as the answer in Vietnam—we are headed straight for disaster." The danger, the first of a series of steps "on a road from which there is no turning back."'
      n: '[112 Cong. Rec. 1602–03 (1966)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-3-2.pdf#page=28). [[w.schlesinger-robert-kennedy-and-his]], 734–35. See [[cal.1966-01-31.vietnam]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1966-05-09.robert-kennedy
      when: May 9–10
      date: '1966-05-09'
      thread: robert-kennedy
      also:
      - latin-america
      c: 'Robert Kennedy in the Senate, two days, on the Alliance for Progress, "Symbol and Substance": reform a condition of aid; aid not withheld for an American company''s sake; "Batista, not Castro, was the major cause of communism in Latin America."'
      n: '112 Cong. Rec. [10090](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt8/pdf/GPO-CRECB-1966-pt8-4-2.pdf#page=37) (May 9), [10187](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt8/pdf/GPO-CRECB-1966-pt8-5-1.pdf#page=67) (May 10) (1966). Check the pages each day runs to. [[w.schlesinger-robert-kennedy-and-his]], 700. See [[cal.1965-11-10.robert-kennedy]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1967-02-08.robert-kennedy
      when: Feb. 8
      date: '1967-02-08'
      thread: robert-kennedy
      also:
      - china
      c: 'Chicago, the University of Chicago''s conference on China (Check). Robert Kennedy: Vietnam''s communism "a native growth, with its own revolutionary traditions and dynamism," not Chinese-inspired; a China policy in "conscious and open recognition that we live in the same world."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 769–70. Check: the text. See [[cal.1967-02-06.robert-kennedy]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-03-18.robert-kennedy
      when: Mar. 18
      date: '1968-03-18'
      thread: robert-kennedy
      also:
      - elections-1968
      c: 'Manhattan, Kan. Robert Kennedy, two days a candidate, gives the Landon Lecture at Kansas State University, some fifteen thousand in the fieldhouse: "Can we ordain to ourselves the awful majesty of God—to decide what cities and villages are to be destroyed, who will live and who will die." The University of Kansas in the afternoon.'
      n: 'Kennedy, the Alfred M. Landon Lecture (Mar. 18, 1968) (Check the text). [[w.schlesinger-robert-kennedy-and-his]], 862–63. See [[cal.1968-03-14.robert-kennedy]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
