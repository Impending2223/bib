      n: 'Kennedy, Day of Affirmation address, from the advance text: [112 Cong. Rec., Senate, June 6, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt9/pdf/GPO-CRECB-1966-pt9-10-2.pdf), 12429–31. [FRUS 1964–68, XXIV, doc. 212](https://history.state.gov/historicaldocuments/frus1964-68v24/d212). [[w.schlesinger-robert-kennedy-and-his]], 743–48; [[w.thomas-robert-kennedy]]. See [[cal.1964-06-12.africa]]. Names: Robert Kennedy, Luthuli, Ian Robertson.'
      c: 'Robert Kennedy in South Africa, invited by the National Union of South African Students, whose president, Ian Robertson, is under a banning order. Cape Town, June 6, the Day of Affirmation: "Each time a man stands up for an ideal ... he sends forth a tiny ripple of hope." Then Stellenbosch, Durban, Johannesburg and Soweto; Luthuli, banned, visited on his farm, by helicopter (Groutville: Check).'
