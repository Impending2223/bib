patch: 2026-11-12-b12-nyt-19600218
by: Claude (batch 12 reader, New York Times, Feb. 18, 1960)
ops:
- edit:
    id: cal.1960-02-17.defense
    base: 0ab2b1fb
    set:
      n: 'The President''s News Conference of February 17, 1960, [1960–61 Pub. Papers 189](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=241). [[w.kallina-kennedy-v-nixon]], 89 (Symington''s charge; the answer). [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 12 ("Angry President Denies He Misled U. S. on Defenses," "President Hits Defense Critics; Says He Has Not ''Misled'' U. S.": the answer, the words, the question as raised by a reporter citing charges of complacency and of economy standing in the way of weapons; not Symington). To check: *New York Times*, [Feb. 20](https://timesmachine.nytimes.com/timesmachine/1960/02/20/issue.html), [Feb. 22](https://timesmachine.nytimes.com/timesmachine/1960/02/22/issue.html), and [Mar. 1, 1960](https://timesmachine.nytimes.com/timesmachine/1960/03/01/issue.html) (cited by [[w.kallina-kennedy-v-nixon]], 89 n.22). See [[cal.1960-01-26.defense]]. Names: Eisenhower, Symington.'
- primary:
    id: cal.1960-02-17.defense
    text: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 12 ("Angry President Denies He Misled U. S. on Defenses," "President Hits Defense Critics; Says He Has Not ''Misled'' U. S.": the answer, the words, the question as raised by a reporter citing charges of complacency and of economy standing in the way of weapons; not Symington)'
    units: A, B
- add:
    entry:
      id: cal.1960-02-17.republican-party
      when: Feb. 17
      date: '1960-02-17'
      thread: republican-party
      also:
      - elections-1960
      c: 'Eisenhower''s news conference. Asked whether the Vice-Presidential nominee should be handpicked by the Presidential nominee, chosen by an open convention, or chosen after competition in State primaries: he knows no reason for the contenders to abstain from primaries. If the President and Vice President are to work closely, they must be friends with "a certain mutual respect," so the Presidential nominee must have "some say." In 1952 he gave the Convention a list of men "completely acceptable to me."'
      n: 'The President''s News Conference of February 17, 1960, [1960–61 Pub. Papers 190](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=242) (Roberts, Newsweek; the answer). [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 17 ("Eisenhower Cool to Fight in Party on Second Place"; "Eisenhower Wary on 2d-Spot Fight": the answer; the *Times* adds that Nixon was chosen from the 1952 list by the Eisenhower strategy board and the convention told he was the choice). See [[cal.1960-02-17.defense]]. Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-02-17.elections-1960-nixon
      when: Feb. 17
      date: '1960-02-17'
      thread: elections-1960-nixon
      c: 'Eisenhower''s news conference. Asked whether he and Nixon differ in approach, Nixon the man of action and he the man to wait: no two men use the same methods. In seven years he knows of no occasion when Nixon was excluded from any important group making policy or deciding on action, "and never once that I know of has Mr. Nixon been at any major variance with me." He has no thought of trying to guide Nixon.'
      n: 'The President''s News Conference of February 17, 1960, [1960–61 Pub. Papers 195](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=247) (Wilson, Cowles Publications; the answer, at 195–96). [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 17 ("Eisenhower Cool to Fight in Party on Second Place"; "Eisenhower Wary on 2d-Spot Fight": the answer, the words; his methods and Nixon''s "probably were different, particularly in dealing with people"). See [[cal.1960-02-17.defense]]. Names: Eisenhower, Nixon.'
      tags:
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1960-02-17.farm
      when: Feb. 17
      date: '1960-02-17'
      thread: farm
      also:
      - elections-1960
      c: 'Eisenhower''s news conference. Asked whether his farm message of last week, accepting stricter controls, was prompted by the hope of winning Republican votes in the Farm Belt: "it wasn''t done in that particular thing, but I would hope that it would appeal to a lot of people and, therefore, get more votes; of course I do."'
      n: 'The President''s News Conference of February 17, 1960, [1960–61 Pub. Papers 191](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=243) (Burd, Chicago Tribune; the answer). [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 17 ("Eisenhower Cool to Fight in Party on Second Place"; "Eisenhower Wary on 2d-Spot Fight": the answer, as the *Times* has it, "one hope" of the message was to win more Republican votes in the farm belt). See [[cal.1960-02-09.farm]]. Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-02-17.cuba-2
      when: Feb. 17
      date: '1960-02-17'
      thread: cuba
      c: 'Eisenhower''s news conference. Asked whether the United States should pay Cuba more for sugar than Russia pays: the Cuban treaty on their preferred position in the sugar market is of long standing and has been studied a long time. "We must not forget that we want to be dealing in such a way that the Cuban people, who are our friends, are treated justly," with no action taken that would in the long run be detrimental to them. The United States pays in convertible currency; Cuba proposes to sell to Russia at the world price, on more of a barter basis.'
      n: 'The President''s News Conference of February 17, 1960, [1960–61 Pub. Papers 190](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=242) (Belair, New York Times; the answer, at 190–91). [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 2 ("Capital Considers a Tougher Policy on Castro Regime"; "U. S. May Harden Its Cuban Policy": the answer, "Question 5"; the 80 percent barter; not the *Times*''s reading that he left open a change in Cuba''s preferred position). See [[cal.1960-02-13.cuba]]. Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-02-16.cuba
      when: Feb. 16–17
      date: '1960-02-16'
      thread: cuba
      c: Rubottom, Assistant Secretary of State for Inter-American Affairs, holds two private meetings, in Washington and in New York, with American business leaders on the Cuban Government's moves toward expropriation of American property and the anti-American policies of the Bank of Cuba.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1 ("Capital Considers a Tougher Policy on Castro Regime": "two private meetings here and in New York yesterday and today"). Check: the days and places: the *Times*, Feb. 18, 1960, at 1, dated Feb. 17, gives the two meetings as Washington and New York on "yesterday and today," without saying which on which day. See [[cal.1960-02-13.cuba]]. Names: Rubottom.'
      tags:
      - name:rubottom-roy-r-jr
- add:
    entry:
      id: cal.1960-02-17.cuba-3
      when: Feb. 17
      date: '1960-02-17'
      thread: cuba
      also:
      - trade
      c: 'Herter, before the House Foreign Affairs Committee, asked whether the American people are happy about subsidizing a country moving "further and further toward communism": much thought is being given to changing the allocations under the Sugar Act. But the act was written to protect the price received by domestic growers, and any change in the subsidy to foreign producers would affect the entire market.'
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 2 ("U. S. May Harden Its Cuban Policy": the question and the answer). Check: the day: the *Times*, dated Feb. 17, gives no day for the appearance. See [[cal.1960-02-13.cuba]]. Names: Herter.'
      tags:
      - name:herter-christian-a
- add:
    entry:
      id: cal.1960-02-17.cuba-4
      when: Feb. 17
      date: '1960-02-17'
      thread: cuba
      also:
      - trade
      - farm
      c: Officials of the State and Agriculture Departments confer with members of the House Agriculture Committee on the proposed Sugar Act bill. The *Times* learns that the Administration's bill would let the President reduce the quota of any foreign country except the Philippines when he finds it necessary "in order to protect the national interest"; the draft is to go to Congress in two or three days.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 2 ("U. S. May Harden Its Cuban Policy": the conference "today"; "it was learned" of the bill''s authority, the words; the draft in "two or three days"). See [[cal.1960-02-13.cuba]].'
- add:
    entry:
      id: cal.1960-02-17.latin-america
      when: Feb. 17
      date: '1960-02-17'
      thread: latin-america
      also:
      - cuba
      c: 'Smathers, in a news conference, just back from a twenty-five-day trip through Latin America: "Brazil deserves to have a quota" under the Sugar Act. It is necessary, he says, to "distinguish between our foes and our friends."'
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 2 ("U. S. May Harden Its Cuban Policy": the two remarks; not the place of the conference). See [[cal.1960-02-13.cuba]]. Names: Smathers.'
      tags:
      - name:smathers-george-a
- add:
    entry:
      id: cal.1960-02-17.cuba-5
      when: Feb. 17
      date: '1960-02-17'
      thread: cuba
      c: Emilio Núñez-Portuondo, who represented Cuba at the United Nations under Batista and was dismissed by Castro, says the Castro Government has obtained twelve MIG-15 jet fighters from Czechoslovakia. They arrived in Havana around Jan. 7 aboard a Czechoslovak ship, in large wooden crates, and went to the military airport of San Antonio de los Baños; thirteen Soviet mechanics arrived Jan. 11 to help assemble them. He cites "confidential information." Havana had officially denied such reports Saturday.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("Ex-Aide Says Cuba Got 12 Czech MIG''s": the statement; the denial "Saturday"; the dateline United Nations, N.Y., and his presence in Washington). See [[cal.1960-02-13.cuba]]. Names: Castro, Batista.'
      tags:
      - name:castro-fidel
      - name:batista-y-zaldivar-fulgencio
- add:
    entry:
      id: cal.1960-02-18.cuba-2
      when: Feb. 18
      date: '1960-02-18'
      thread: cuba
      also:
      - trade
      c: 'As the *Times* reports it: the Administration''s policy of "patience and forbearance" toward Cuba is under serious review, after a series of interdepartmental meetings in the last three days on Cuba''s new arrangements with the Soviet Union. It is understood to be avoiding sudden retaliation. Under discussion: an effort to halt or isolate Castro''s policies through the other Latin-American governments; a redraft of the Sugar Act to let the negotiators reduce or eliminate subsidies for Cuban sugar, more than $100,000,000 a year; less likely for now, a 1¼-cent a pound duty on Cuban sugar to reimburse Americans whose property is taken; submission of their claims to mediation or arbitration; a powerful medium-wave transmitter at Key West or in Puerto Rico to broadcast to Cuba.'
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 2 ("Capital Considers a Tougher Policy on Castro Regime," by James Reston: the review and the objectives, as "understood"; the *Times* notes the text of the Soviet–Cuban agreement was never made public). See [[cal.1960-02-17.cuba-2]]. Names: Castro.'
      tags:
      - form:state
      - name:castro-fidel
- add:
    entry:
      id: cal.1960-02-17.middle-east
      when: Feb. 17
      date: '1960-02-17'
      thread: middle-east
      c: 'Aleppo, United Arab Republic. Nasser, on a tour of Syria begun Sunday at Latakia, to about 30,000 people in a public square: "Our union is a revolution." He has heard of persons, whom he does not identify, trying to disrupt the union of Egypt and Syria: "Today I find your unity is stronger than ever."'
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("Crowds in Syria Acclaim Nasser," by Richard P. Hunt: the speech, the crowd as estimated, the words; not the *Times*''s reading of Kassim''s campaign). Names: Nasser.'
      tags:
      - name:nasser-gamal-abdel
- add:
    entry:
      id: cal.1960-02-18.indonesia
      when: Feb. 18
      date: '1960-02-18'
      thread: indonesia
      also:
      - soviet-union
      c: Khrushchev arrives at Jakarta from Rangoon on his four-nation Asian tour. Sukarno leads 1,000 Indonesian officials, dignitaries and diplomats in greeting him. The AP estimates a throng of more than 100,000 in the airport area and many more along the motorcade route; he is to spend twelve days in Indonesia, with a 1,400-mile tour of Java and Bali.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("Jakarta Throngs Hail Khrushchev," AP, Feb. 18: the welcome, the estimate, the schedule). Names: Khrushchev, Sukarno.'
      tags:
      - name:khrushchev-nikita-s
      - name:sukarno
- add:
    entry:
      id: cal.1960-02-17.europe-and-the-alliance-britain
      when: Feb. 17
      date: '1960-02-17'
      thread: europe-and-the-alliance-britain
      also:
      - defense
      c: London. George Ward, Secretary of State for Air, announces to the House of Commons that the United States and Britain have agreed on a long-range radar station at Fylingdales Moor, Yorkshire, the third of a chain with Clear, Alaska, and Thule, Greenland, to give early warning of missile attack. The capital cost is about £43,000,000 ($120,400,000), the United States paying £35,000,000 and Britain £8,000,000; the United States provides the radar equipment and the communications linking it to the system, Britain the land and buildings. The Royal Air Force is to command it. George Brown, Labor's defense spokesman, says the maximum warning would be fifteen minutes for the United States and four for Britain.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 6 ("British to Set Up Rocket Warning," by Drew Middleton: the announcement, the cost, the division of the work, Brown''s figures, the words).'
      tags:
      - polity:uk
      - polity:us
- add:
    entry:
      id: cal.1960-02-17.latin-america-2
      when: Feb. 17
      date: '1960-02-17'
      thread: latin-america
      also:
      - defense
      c: 'Eisenhower''s news conference. Asked whether he will speak to the nation, as before his Asian tour, before leaving for South America: he expects to make a fifteen-minute television talk at 6:15 Sunday evening; he leaves early Monday. "Such items as security and strength and so on would, of course, be included."'
      n: 'The President''s News Conference of February 17, 1960, [1960–61 Pub. Papers 189](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=241) (Arrowsmith, Associated Press; the answer). [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1 ("Angry President Denies He Misled U. S. on Defenses," "Question 11": the announcement of the talk and the words; the networks'' times in "President Scoffs at Tour Dangers"). See [[cal.1960-02-17.defense]]. Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-02-17.latin-america-3
      when: Feb. 17
      date: '1960-02-17'
      thread: latin-america
      c: 'Eisenhower''s news conference. Asked whether the Secret Service or other agencies are concerned about his safety on the South American trip, after the demonstrations against Nixon: "On the contrary; they have said no word to me about it." The Secret Service has no authority in those countries. When you have a purpose directed toward the vast bulk of the people you meet, "you just can''t worry about these things."'
      n: 'The President''s News Conference of February 17, 1960, [1960–61 Pub. Papers 192](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=244) (Pierpoint, CBS News; the answer, at 192–93). [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("President Scoffs at Tour Dangers," by Felix Belair Jr.: the answer, the transcript at 12, "Questions 1 and 9"; he had no qualms about the reception Castro might get; not the Chilean Ambassador''s assurances). See [[cal.1960-02-17.defense]]. Names: Eisenhower, Nixon.'
      tags:
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1960-02-17.latin-america-4
      when: Feb. 17
      date: '1960-02-17'
      thread: latin-america
      c: The White House makes public the details of Eisenhower's three days in Brazil, on a two-week, 15,560-mile tour leaving Washington early Monday for Puerto Rico, Brasilia, Rio de Janeiro and São Paulo, then Buenos Aires and Mar del Plata, Santiago and Montevideo. He is to speak twelve to fifteen minutes to each country's national legislative body, translated after each two or three paragraphs by Col. Vernon Walters. At Rio he is to exchange greetings with Kubitschek at the Navy Ministry, and a motorcade is to take the two Presidents through the city.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("President Scoffs at Tour Dangers," by Felix Belair Jr.: the release "today"; the itinerary; no page shown; the television and radio schedule not entered). Names: Eisenhower, Kubitschek.'
      tags:
      - name:eisenhower-dwight-d
      - name:kubitschek-juscelino
- add:
    entry:
      id: cal.1960-02-17.elections-1960-nomination
      when: Feb. 17
      date: '1960-02-17'
      thread: elections-1960-nomination
      also:
      - desegregation-schools
      - voting-rights
      c: 'Richmond, Va. Symington, still undecided about being a candidate for President, at a news conference: "I think the Supreme Court is the law of the land and I believe the law should be enforced. I think every child who wants to get an education under our Constitution should have a chance to get an education." Of voting: "every American should have the right to vote." In Missouri, "we proceeded with our problem and have had no trouble."'
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("Symington Backs Civil Rights Aims," Special to the *New York Times*, Richmond, Va., Feb. 17: the news conference, the words; page not shown on the clipping). Names: Symington.'
      tags:
      - name:symington-william-s
      - state:va
      - city:richmond
- add:
    entry:
      id: cal.1960-02-17.elections-1960-primaries
      when: Feb. 17
      date: '1960-02-17'
      thread: elections-1960-primaries
      c: Milwaukee. Kennedy has breakfast with seventy-five Wisconsin labor leaders, David Rabinowitz, the Democratic state treasurer, beside him. He tells them the big issue in Wisconsin is the choice of a candidate who could win both the nomination and the election. The *Times* reads from it that his basic strategy is "Humphrey can't win."
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("Kennedy Offers New Dairy Plan," by Austin C. Wehrwein: the breakfast, with the Associated Press photograph; what he told the labor leaders; the *Times*''s reading, "implied"; the day as the morning of the second day of the tour). Names: Kennedy, Humphrey.'
      tags:
      - name:kennedy-john-f
      - name:humphrey-hubert-h
      - state:wi
      - city:milwaukee
- add:
    entry:
      id: cal.1960-02-17.elections-1960-primaries-2
      when: Feb. 17
      date: '1960-02-17'
      thread: elections-1960-primaries
      also:
      - farm
      c: 'Beaver Dam, Wis. Kennedy, in a bid for the farm vote, calls for a "do-it-yourself" program for the dairy industry: higher price supports for milk, and the farmers rather than the Government to control production, by a "self-help stabilization program." "It cannot be done by quotas and limitations imposed by Mr. Benson''s unsympathetic bureaucrats." To drive farmers out of business with low prices is "cruel and ruthless."'
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("Kennedy Offers New Dairy Plan," by Austin C. Wehrwein: the plan, the words). Names: Kennedy, Benson.'
      tags:
      - name:kennedy-john-f
      - name:benson-ezra-taft
      - state:wi
      - city:beaver-dam
- add:
    entry:
      id: cal.1960-02-17.elections-1960-primaries-3
      when: Feb. 17
      date: '1960-02-17'
      thread: elections-1960-primaries
      c: Mayville, Wis. Five hundred high school pupils mob Kennedy, excused from classes to see him, as his truck blares his campaign song, "High Hopes." Mark Stone, the principal, a Republican, says the last time classes were excused so was for Stassen in 1952 and before that for William Jennings Bryan.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("Kennedy Offers New Dairy Plan," by Austin C. Wehrwein: the crowd, "500," the principal''s words, the song). Names: Kennedy, Stassen.'
      tags:
      - name:kennedy-john-f
      - name:stassen-harold-e
      - state:wi
      - city:mayville
- add:
    entry:
      id: cal.1960-02-17.elections-1960-primaries-4
      when: Feb. 17
      date: '1960-02-17'
      thread: elections-1960-primaries
      also:
      - defense
      - farm
      c: Fond du Lac, Wis., the Retlaw Hotel ballroom. Kennedy ends the second day of his tour for the Wisconsin primary of Apr. 5 to a record crowd, which police and the hotel manager put at 1,200 to 1,500. A second-best effort in defense is like a second-best poker hand, "they both lose." The "No. 1 piece of business" for the country is "the stabilization of the income of farmers."
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html) ("Kennedy Offers New Dairy Plan," by Austin C. Wehrwein: the speech, the crowd, the words). Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:wi
      - city:fond-du-lac
- add:
    entry:
      id: cal.1960-02-17.court
      when: Feb. 17
      date: '1960-02-17'
      thread: court
      c: 'New York University Law School. Justice Black gives the first of the James Madison Lectures, "The Bill of Rights." He condemns the idea that courts should allow Congress to put "reasonable" limits on individual liberties: "I cannot accept this approach to the Bill of Rights. It is my belief that there are ''absolutes'' in our Bill of Rights, and that they were put there by men who knew what words meant and meant their prohibitions to be ''absolutes.''" He names neither Frankfurter nor Learned Hand. Russell D. Niles, the school''s dean, introduces him.'
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 16 ("Black Condemns Limit on Liberty," by Anthony Lewis: the speech "last night," the words, the *Times*''s identification of the opposing view with Frankfurter and Hand; one of his few formal addresses on legal subjects since 1937). Names: Black, Frankfurter.'
      tags:
      - name:black-hugo-l
      - name:frankfurter-felix
- add:
    entry:
      id: cal.1960-02-17.voting-rights-2
      when: Feb. 17
      date: '1960-02-17'
      thread: voting-rights
      also:
      - congress
      c: The House Rules Committee, at a hastily called closed meeting, agrees to clear a civil rights bill for the House floor starting Mar. 10. Smith, the chairman, agrees to conditions of debate under which Celler's bill, held there since last August, may be amended on the floor to add the voting-referee plan. Halleck had talked that morning to the four Republicans on the twelve-man committee, who declared they would vote the bill to the floor with the four Northern Democrats. The discharge petition stands at 209 signatures, 219 needed.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 15 ("House Unit Agrees to Send Civil Rights Bill to Floor," "Rights Deadlock Broken in House," by Russell Baker: the meeting, Mar. 10, Smith''s agreement, the committee''s makeup, the 209 signatures; the *Times*''s reading that the Republicans broke the deadlock and the Senate strategy not entered). See [[cal.1960-01-27.voting-rights]]. Names: Smith, Halleck, Celler.'
      tags:
      - name:smith-howard-w
      - name:halleck-charles-a
      - name:celler-emanuel
- add:
    entry:
      id: cal.1960-02-17.voting-rights-3
      when: Feb. 17
      date: '1960-02-17'
      thread: voting-rights
      c: 'Hennings submits his own voting-rights bill, a variation on the referee proposal: the President to appoint enrolling officers to register Negroes and assure their chance to vote, after a Federal court has found a pattern of discrimination. It would apply to Federal and local elections and be enforceable through contempt proceedings.'
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 15 ("Rights Deadlock Broken in House": the bill and its terms, as the *Times* describes them; the Senate sitting and debate not entered). See [[cal.1960-02-17.voting-rights]]. Names: Hennings.'
      tags:
      - name:hennings-thomas-c-jr
- add:
    entry:
      id: cal.1960-02-17.defense-3
      when: Feb. 17
      date: '1960-02-17'
      thread: defense
      also:
      - intelligence
      c: Dulles testifies in closed session before the Senate Subcommittee on National Policy Machinery, of the Committee on Government Operations, on the Soviet–Chinese challenge, now and in the future, and the Government's organization to meet it. Jackson, the chairman, says the testimony has set the stage for comprehensive public hearings next week, Lovett the first public witness on Wednesday. He praises Dulles's "excellent presentation" and says Dulles told the committee no administration had ever asked him to alter the facts as he saw them.
      n: '[*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1, 12 ("Angry President Denies He Misled U. S. on Defenses," "President Hits Defense Critics": the closed hearing, Jackson''s statements, the words). Names: Dulles, Jackson, Lovett.'
