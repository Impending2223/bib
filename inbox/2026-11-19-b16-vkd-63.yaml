# Read from the volumes (Nov. 19, 2026): the commemorations, provincial and local matters of *Văn kiện Đảng toàn tập* that the book-check passed over.
patch: 2026-11-19-b16-vkd-63
by: 'Claude (batch 16, reader: Văn kiện Đảng toàn tập, the 63 commemorations and provincial matters), Nov. 19, 2026'
ops:
- add:
    entry:
      id: cal.1960-03-14.vietnam-hanoi
      when: Mar. 14
      date: '1960-03-14'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 193-CT/TW on three anniversaries of 1960: Lenin''s 90th birthday (Apr. 22), Hồ Chí Minh''s 70th (May 19), the DRV''s 15th year. Lenin to be marked in the press, radio and publications, with a talk at the Center; Hồ by his life and works and a drive of work records in his honor. The plan for the DRV''s anniversary to come from the Prime Minister''s Office.'
      n: '*Chỉ thị của Ban Bí thư số 193-CT/TW, ngày 14-3-1960, Về mấy ngày kỷ niệm trong năm 1960*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 193–97. Made public: 2002. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1960-07-29.vietnam-hanoi
      when: July 29
      date: '1960-07-29'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 218-CT/TW, adding to no. 193, on the DRV''s 15th anniversary: a propaganda drive in August, to end before Sept. 2, to spur production and work and to greet the coming Party Congress. In the countryside, joined to the autumn education on cooperatives. Observances sparing; flood and storm defense not neglected; sabotage guarded against; crowds kept from the cities and the capital.'
      n: '*Chỉ thị của Ban Bí thư số 218-CT/TW, ngày 29-7-1960, Bổ sung về việc tổ chức đợt kỷ niệm 15 năm nước Việt Nam Dân chủ Cộng hoà*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 421–24. Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1960-10-11.vietnam-hanoi
      when: Oct. 11
      date: '1960-10-11'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 01-NQ/TW: the powers of the Việt Bắc Autonomous Zone and of its provinces to be studied and fixed, the two levels having differed on their roles. The Zone Committee, chiefly responsible, with the Organization Department, the Nationalities Department and the Interior Ministry''s Party group, to agree with the provinces and report to the Center. To be done by mid-November, before the zone and provincial committees are elected.'
      n: '*Nghị quyết của Ban Bí thư số 01-NQ/TW, ngày 11-10-1960, Về việc nghiên cứu quy định nhiệm vụ, quyền hạn cụ thể giữa cấp khu và cấp tỉnh trong Khu Tự trị Việt Bắc*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 957–59. Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1960-09-06.vietnam-hanoi
      when: Sept. 6
      date: '1960-09-06'
      thread: vietnam-hanoi
      c: 'The Việt Bắc Zone Committee''s Standing Committee: resolution no. 49-VP/KU, a plan to strengthen and enlarge the Party through the end of 1960, in the drive for agricultural cooperation and the completion of the democratic reform. Rural branches 76 percent of the zone''s, rural members 74 percent; 4,897 new members taken in, 364 of them of the minorities. Every village with no member to take in at least three; branches to be formed where one or two members stand; recruits sought among cooperative members, the minorities, women and youth.'
      n: '*Nghị quyết của Khu uỷ Việt Bắc số 49-VP/KU, ngày 6-9-1960, Về kế hoạch củng cố và phát triển Đảng trong cuộc vận động hợp tác hoá nông nghiệp kết hợp hoàn thành cải cách dân chủ*, signed for the Zone Committee''s Standing Committee by Phan Văn Tỉnh, its standing member. [[w.van-kien-dang-toan]], XXI, 1128–37 (appendix). Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-03-24.vietnam-hanoi
      when: Mar. 24
      date: '1961-03-24'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 15-NQ/TW on the Hồng Quảng Zone Committee, recording its decisions of Jan. 7 after the Industry Department''s report: Hồng Quảng a coal-mining industrial zone with the farmland it needs; Đông Triều district to be cut from Hải Dương and given back to it by mid-1961 at the latest; the zone ranked as a first-class province; its committee to lead the central coal enterprises in its bounds, within the powers the Center delegates.'
      n: '*Nghị quyết của Ban Bí thư số 15-NQ/TW, ngày 24-3-1961, Về tổ chức, vị trí và nhiệm vụ của Khu uỷ Hồng Quảng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 271–75. Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-08-16.vietnam-hanoi
      when: Aug. 16
      date: '1961-08-16'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 35-TT/TW on the 16th anniversary of the August Revolution and National Day (Sept. 2): to praise the three years'' socialist transformation and the economic and cultural gains, spur emulation toward the 1961 plan and the First Five-Year Plan, and rouse the struggle against the Americans and Diệm. Observed at the usual scale, with mass meetings and short emulation drives, tied to the rectification campaign; economy; guard against sabotage, drought, flood, storm and fire; crowds kept from the capital. Eleven slogans attached.'
      n: '*Thông tri của Ban Bí thư số 35-TT/TW, ngày 16-8-1961, Về việc tổ chức kỷ niệm Cách mạng Tháng Tám và lễ Quốc khánh lần thứ 16*, signed for the Secretariat by Nguyễn Khai, chief of its office. [[w.van-kien-dang-toan]], XXII, 464–68. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - polity:drv
      - polity:us
      - name:ngo-dinh-diem
      - vis:only:drv
- add:
    entry:
      id: cal.1961-10-31.vietnam-hanoi-3
      when: Oct. 31
      date: '1961-10-31'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 28-CT/TW on the 44th anniversary of the October Revolution: the observance to be larger than last year''s, though not a round year, since it follows the 22nd Congress of the Soviet Party and its program and comes as the Americans move toward military intervention in the South. Propaganda on the Soviet Union''s growth, its program, the friendship of the two peoples and unity of the socialist camp; a press, news-agency and radio drive; an exhibition of photographs of Soviet achievements.'
      n: '*Chỉ thị của Ban Bí thư số 28-CT/TW, ngày 31-10-1961, Về việc tổ chức kỷ niệm Cách mạng Tháng Mười Nga lần thứ 44*, signed for the Secretariat by Lê Văn Lương (the copy prints "Lương"). [[w.van-kien-dang-toan]], XXII, 490–94. Made public: 2002.'
      tags:
      - polity:drv
      - polity:ussr
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1961-11-03.vietnam-hanoi
      when: Nov. 3
      date: '1961-11-03'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 27-NQ/TW on the powers of the Việt Bắc Autonomous Zone: its founding stands, not to be reopened. The zone an administrative unit, its committee leading in politics, economy, culture and the military; its autonomy shown in the minorities'' culture, scripts and schools and in their share of posts; in the economy not a complete plan unit, but a guide of the provinces'' plans, mountain farming, cooperatives and local industry, with a budget of its own. The Secretariat to ask the Government Council''s Standing Committee to have the central ministries fix the division of management with the zone.'
      n: '*Nghị quyết của Ban Bí thư số 27-NQ/TW, ngày 3-11-1961, Về nhiệm vụ, quyền hạn của Khu tự trị Việt Bắc*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 503–06. Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-11-03.vietnam-hanoi-2
      when: Nov. 3
      date: '1961-11-03'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 28-NQ/TW approves the Hanoi City Committee''s request (its letter of Oct. 13) to dissolve the Party committee of the Hanoi general schools: its base organizations to pass under the ward and district committees.'
      n: '*Nghị quyết của Ban Bí thư số 28-NQ/TW, ngày 3-11-1961, Về việc giải thể Đảng bộ các trường phổ thông Hà Nội*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 507. Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-04-03.vietnam-hanoi
      when: Apr. 3
      date: '1961-04-03'
      thread: vietnam-hanoi
      c: 'The Việt Bắc Zone Committee''s Standing Committee, after its delegates'' report from the Center''s rectification conference: resolution no. 02-NQ/VB on the campaign. Beyond the Politburo''s three aims, the Party''s nationalities policy to be taught within it, against great-nationality and narrow-nationality ideas; the Party''s class line in the countryside; a zone rectification board under Hoàng Văn Kiểu; the provincial secretaries to be called in; trials in one highland and one lowland village; timing in the highlands to spare the harvest.'
      n: '*Nghị quyết của Khu uỷ Việt Bắc số 02-NQ/VB, ngày 3-4-1961, Về vấn đề chỉnh huấn*, signed for the Zone Committee''s Standing Committee by Phan Văn Tỉnh, its standing member. [[w.van-kien-dang-toan]], XXII, 754–58 (appendix). Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-11-14.vietnam-hanoi
      when: Nov. 14
      date: '1961-11-14'
      thread: vietnam-hanoi
      c: 'The Tây Bắc Zone Committee''s conference: resolution no. 11-NQ/TB on farming and forestry in the First Five-Year Plan, after the committee met at the end of October with a representative of the Central Committee. By September 69.3 percent of the zone''s peasants in agricultural cooperatives, 37 percent of households in advanced ones (lowlands 84.3 percent, highlands 35.5 percent). Aims for 1965: some 566,000 tons of grain, 296,300 of it rice; 836 kg of grain a head.'
      n: '*Nghị quyết của Hội nghị Khu uỷ Tây Bắc số 11-NQ/TB, ngày 14-11-1961, Về vấn đề phát triển nông lâm nghiệp trong kế hoạch 5 năm lần thứ nhất (1961–1965)*, signed for the Zone Committee by Bắc Dũng, deputy secretary. [[w.van-kien-dang-toan]], XXII, 759–807 (appendix). Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-04-23.vietnam-hanoi
      when: Apr. 23
      date: '1962-04-23'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 71-TT/TW on International Labor Day, May 1: to hail the workers'' drive for the 1962 plan and the five-year plan, to rouse the struggle against the Americans and Diệm in the South, and to hold the socialist camp''s unity. Mass meetings at the Center, in Hanoi and the cities and towns, and at workplaces and cooperatives, with rewards; entertainments; the press tied to the third national congress of heroes and emulation fighters; the trade-union federation to issue an appeal; guards on factories, offices and depots. Twenty-four slogans.'
      n: '*Thông tri của Ban Bí thư số 71-TT/TW, ngày 23-4-1962, Về việc tổ chức ngày Quốc tế lao động 1-5*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 411–16. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - polity:drv
      - polity:us
      - name:ngo-dinh-diem
      - vis:only:drv
- add:
    entry:
      id: cal.1962-05-04.vietnam-hanoi-2
      when: May 4–7
      date: '1962-05-04'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat, with the Nghệ An Provincial Committee''s secretary, deputy secretaries and two Standing Committee members, on farm development in the province: Nghệ An to become a center of economy, industry, politics and culture for the old Zone 4. Grain first, root crops up to about half the people''s food; industrial crops, livestock and the North''s largest timber stock, to be cut as an industry; sea fishing, fish sauce and salt; local industry; a branch of a university and research stations.'
      n: '*Thông báo của Ban Bí thư số 18-TB/HN, ngày 18-5-1962, Về cuộc họp Ban Bí thư bàn phương hướng phát triển nông nghiệp tỉnh Nghệ An*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 554–65. Made public: 2002. The sittings: "Chiều mồng 4, ngày mồng 5 và sáng mồng 7-5-1962" (the afternoon of May 4, May 5, the morning of May 7); the notice is dated May 18. The time is the first day''s.'
      time_range:
      - 1962-05-04T05:00Z
      - 1962-05-04T11:00Z
      time_band: afternoon
      time_zone: Asia/Bangkok
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-04-26.vietnam-hanoi-2
      when: Apr. 26–27
      date: '1962-04-26'
      place: hanoi
      thread: vietnam-hanoi
      c: The Secretariat, with the Phú Thọ Provincial Committee's deputy secretary and two committee members, on the province's farm plan for 1961–65 and 1963. Yields and livestock behind the North's average, cooperatives with faults. Grain first, with cassava and other root crops for the province's 800,000 people; industrial crops to about a quarter of the area; livestock and forestry; settlers to come up from the delta to clear land; local industry to follow.
      n: '*Thông báo của Ban Bí thư số 19-TB/HN, ngày 19-5-1962, Về cuộc họp Ban Bí thư bàn phương hướng phát triển nông nghiệp tỉnh Phú Thọ*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 566–72. Made public: 2002. The sittings: "Chiều ngày 26 và ngày 27-4-1962" (the afternoon of Apr. 26, and Apr. 27); the notice is dated May 19. The time is the first day''s.'
      time_range:
      - 1962-04-26T05:00Z
      - 1962-04-26T11:00Z
      time_band: afternoon
      time_zone: Asia/Bangkok
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-05-31.vietnam-hanoi
      when: May 31
      date: '1962-05-31'
      place: hanoi
      thread: vietnam-hanoi
      c: The Secretariat, Lê Đức Thọ, Lê Văn Lương, Nguyễn Văn Trân, Hoàng Anh and Tố Hữu present, with Nguyễn Thọ Chân, secretary of the Hồng Quảng Zone Committee, and two of its members, on the zone's production. The 1962 coal quota the Assembly passed, 2.75 million tons, to be worked as 2.9 million, the Party's figure. Local industry, crafts, farming, salt and fishing to be studied by the Center and the ministries; the miners' food, housing, health and schooling to be reviewed; the mines' five-year plan to be settled with the Heavy Industry Ministry and the Planning Commission and put to the Secretariat or the Government.
      n: '*Thông báo của Ban Bí thư số 22-TB/HN, ngày 31-5-1962, Về phiên họp của Ban Bí thư với Khu uỷ Hồng Quảng bàn phương hướng sản xuất của khu*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 580–82. Made public: 2002. Names: Lê Đức Thọ, Lê Văn Lương, Nguyễn Văn Trân, Hoàng Anh, Tố Hữu, Nguyễn Thọ Chân. Check: the day of the session; the notice, of May 31, gives none.'
      tags:
      - polity:drv
      - name:le-duc-tho
      - vis:only:drv
- add:
    entry:
      id: cal.1962-05-09.vietnam-hanoi-2
      when: May 9–10
      date: '1962-05-09'
      place: hanoi
      thread: vietnam-hanoi
      c: The Secretariat, with two deputy secretaries of the Thái Bình Provincial Committee and two of its members, on farm development in the province for 1961–65. A crowded province with little land to add, but fertile, with its water control largely done and a long habit of intensive farming. The notice faults the committee for conservatism, bureaucracy and a leadership short of unity and democracy, and sets the province's course for grain, crops, livestock, fish and salt, and local industry.
      n: '*Thông báo của Ban Bí thư số 24-TB/TW, ngày 1-6-1962, Về cuộc họp Ban Bí thư bàn phát triển nông nghiệp tỉnh Thái Bình*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 590–601. Made public: 2002. The sittings: "Ngày 9, 10-5-1962" (May 9 and 10); the notice is dated June 1.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-05-17.vietnam-hanoi
      when: May 17–18
      date: '1962-05-17'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat, with the Hải Dương Provincial Committee''s secretary, deputy secretary and a member, on farm direction in the province for 1961–65 and 1963: a large lowland rice province and chief food supplier of the North''s cities, with a young Party. Its views on crops, livestock, land clearing, side trades, technique, cooperatives, the pace of development, and the committee''s leadership.'
      n: '*Thông báo của Ban Bí thư số 25-TB/HN, ngày 16-6-1962, Về cuộc họp Ban Bí thư bàn phương hướng phát triển nông nghiệp tỉnh Hải Dương*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 616–26. Made public: 2002. The sittings: "Ngày 17 - 18-5-1962" (May 17 and 18); the notice is dated June 16.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-05-30.vietnam-hanoi
      when: May 30–31
      date: '1962-05-30'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat, with the Nam Định Provincial Committee''s Standing Committee, on farm direction in the province: first in the North in spring rice and with nearly half its salt, 48,000 craftsmen, a city with the North''s largest textile works. The notice faults the committee''s grasp of the farm revolution, its Party building and its use of model cooperatives, and gives directions on water control, tools and draft power, fertilizer, seed, and methods of leadership.'
      n: '*Thông báo của Ban Bí thư số 27-TB/HN, ngày 22-6-1962, Về cuộc họp Ban Bí thư bàn phương hướng sản xuất nông nghiệp tỉnh Nam Định*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 633–46. Made public: 2002. The sittings: "Ngày 30 - 31-5-1962" (May 30 and 31); the notice is dated June 22.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-06-22.vietnam-hanoi
      when: June 22–23
      date: '1962-06-22'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat, with the Hà Đông Provincial Committee, on farm development in the province: good land and water, the North''s largest craft industry, a market in the capital beside it. Held back by long enemy occupation and a weak Party base, more than 35 percent of cooperatives with no Party group and 10 percent with no member. Directions on grain, crafts and side trades, cooperatives, zoning of production, land clearing, targets and public order.'
      n: '*Thông báo của Ban Bí thư số 28-TB/HN, ngày 3-7-1962, Về cuộc họp Ban Bí thư bàn phương hướng phát triển nông nghiệp tỉnh Hà Đông*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 647–61. Made public: 2002. The sittings: "Ngày 22 - 23-6-1962" (June 22 and 23); the notice is dated July 3.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-10-17.vietnam-hanoi
      when: Oct. 17
      date: '1962-10-17'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 95-TT/TW on the 45th anniversary of the October Revolution: to raise confidence in the growth of the Soviet Union and the socialist camp and in the victory of Marxism–Leninism, to teach hardship and self-reliance, and proletarian internationalism. Propaganda on 45 years of Soviet achievement and on the friendship, aid and cooperation of the Vietnamese and Soviet peoples. Eight slogans.'
      n: '*Thông tri của Ban Bí thư số 95-TT/TW, ngày 17-10-1962, Về việc tổ chức kỷ niệm lần thứ 45 cuộc Cách mạng xã hội chủ nghĩa Tháng Mười*, signed for the Secretariat by Phạm Chung, deputy chief of the office. [[w.van-kien-dang-toan]], XXIII, 754–56. Made public: 2002.'
      tags:
      - polity:drv
      - polity:ussr
      - vis:only:drv
- add:
    entry:
      id: cal.1962-12-06.vietnam-hanoi
      when: Dec. 6
      date: '1962-12-06'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 101-TT/TW on Dec. 19, the day of national resistance, and Dec. 22, the founding of the People''s Army: at the usual scale, to carry on the fighting tradition, expose the Americans'' war plans and the American–Diệm sabotage of the North, raise vigilance, and spur the 1962 and 1963 plans. Talks on the situation, museum visits, army and people''s festivals, visits to families of the wounded and the dead, a short emulation drive; meetings in the regular forces, the armed police and the militia.'
      n: '*Thông tri của Ban Bí thư số 101-TT/TW, ngày 6-12-1962, Về kỷ niệm ngày toàn quốc kháng chiến (ngày 19 tháng 12) và ngày thành lập Quân đội nhân dân Việt Nam (ngày 22 tháng 12) năm nay*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 802–05. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - polity:drv
      - polity:us
      - name:ngo-dinh-diem
      - vis:only:drv
- add:
    entry:
      id: cal.1962-05-10.vietnam-hanoi-2
      when: May 10
      date: '1962-05-10'
      thread: vietnam-hanoi
      c: 'The Việt Bắc Zone Committee''s Standing Committee: resolution no. 50-NQ/KU on directions and tasks for 1962, after the committee''s enlarged conference of Apr. 20–25. The zone''s 1961 rice crop 50,000 tons short of 1960''s; land use up only 1.28 times. For 1962 the zone to feed itself and the settlers from the lowlands: rice output up 19.18 percent, some 6,600 hectares cleared or double-cropped.'
      n: '*Nghị quyết của Khu uỷ Việt Bắc số 50-NQ/KU, ngày 10-5-1962, Về phương hướng và nhiệm vụ năm 1962*, signed for the Zone Committee''s Standing Committee by Phan Văn Tỉnh, standing member. [[w.van-kien-dang-toan]], XXIII, 957–76 (appendix; the conference dates, the editors'' note). Made public: 2002.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1963-01-07.vietnam-hanoi
      when: Jan. 7
      date: '1963-01-07'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 688-NQ/TW, carrying out the Politburo''s decision to merge the provinces of Bắc Ninh and Bắc Giang: their Party committees become the Hà Bắc Provincial Committee. Trần Trung, until then secretary in Bắc Giang, its secretary; Nguyễn Ly, Phương Minh Nam, Ngô Duy Phương and Phạm Văn Quyện its deputy secretaries.'
      n: '*Nghị quyết của Ban Bí thư số 688-NQ/TW, ngày 7-1-1963, Về việc hợp nhất hai Ban Tỉnh uỷ Bắc Ninh và Bắc Giang*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 33–34. Made public: 2003. Names: Trần Trung, Nguyễn Ly, Phương Minh Nam, Ngô Duy Phương, Phạm Văn Quyện.'
