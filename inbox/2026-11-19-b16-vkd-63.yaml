    entry:
      id: cal.1963-01-07.vietnam-hanoi-2
      when: Jan. 7
      date: '1963-01-07'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 689-NQ/TW, carrying out the Politburo''s decision to merge the city of Haiphong and Kiến An province: their Party committees become the Haiphong City Committee. Hoàng Hữu Nhân, until then Haiphong''s secretary, its secretary; Lê Huy, until then Kiến An''s secretary, Trần Kiên, Hoàng Mậu and Tô Thiện its deputy secretaries.'
      n: '*Nghị quyết của Ban Bí thư số 689-NQ/TW, ngày 7-1-1963, Về việc hợp nhất hai Ban Chấp hành Đảng bộ Hải Phòng – Kiến An*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 35–36. Made public: 2003. Names: Hoàng Hữu Nhân, Lê Huy, Trần Kiên, Hoàng Mậu, Tô Thiện.'
      tags:
      - polity:drv
      - vis:only:drv
