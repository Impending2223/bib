    entry:
      id: cal.1963-03-02.vietnam-hanoi-2
      when: Mar. 2
      date: '1963-03-02'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat meets, after the Thái Bình Provincial Committee''s report, on local industry and crafts in the province: a crowded province with little land, a single crop and few raw materials. Farming, livestock and industrial crops to come first; fishing, salt and sedge the chief trades; mechanical work chiefly repairs and half-mechanized tools; cooperatives, not state plants, wherever they can do the work well.'
      n: '*Thông báo của Ban Bí thư số 48-TB/TW, ngày 22-5-1963, Bàn về phương hướng, nhiệm vụ phát triển công nghiệp địa phương và thủ công nghiệp của tỉnh Thái Bình*, signed for the Secretariat by Minh Châu, deputy chief of the office. [[w.van-kien-dang-toan]], XXIV, 553–56. Made public: 2003. The sitting: "Ngày 2 tháng 3 năm 1963" (Mar. 2); the notice is dated May 22.'
      tags:
      - polity:drv
      - vis:only:drv
