      date: '1963-11-18'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 85-NQ/TW, carrying out the Politburo''s decision: the Party organizations of Hồng Quảng and Hải Ninh merged into the Quảng Ninh Provincial Party organization; their two executive committees, just elected at their congresses, to form its committee, which is to choose its standing committee, secretary, deputies and inspection committee.'
      n: '*Nghị quyết của Ban Bí thư số 85-NQ/TW, ngày 18-11-1963, Về việc hợp nhất hai Đảng bộ và hai Ban Chấp hành Đảng bộ Hồng Quảng, Hải Ninh*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 628–29. Made public: 2003.'
