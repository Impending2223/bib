- add:
    entry:
      id: cal.1966-11-30.vietnam-hanoi
      when: Nov. 30
      date: '1966-11-30'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s circular no. 189-TT/TW on the 20th anniversary of the national resistance (Dec. 19), the 22nd of the People''s Army (Dec. 22) and the 6th of the National Liberation Front (Dec. 20): a propaganda drive to raise the will to beat the Americans, on the resistance against the French, the unity of army and people and of North and South, and the Front as the South''s one true representative. Stories, visits to families of the dead, small army and people''s days, exhibitions and films; the winter-spring crops, air defense and care of soldiers'' families to be pressed.'
      n: '*Thông tri của Ban Bí thư số 189-TT/TW, ngày 30-11-1966, Về việc tuyên truyền động viên nhân dịp ba ngày kỷ niệm trong tháng 12 năm 1966*, signed for the Secretariat by Vũ Tuân, chief of its office. [[w.van-kien-dang-toan]], XXVII, 323–25. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1967-01-23.vietnam-hanoi-3
      when: Jan. 23
      date: '1967-01-23'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 190-TT/TW on the 37th anniversary of the Party''s founding, Feb. 3: teaching of the Party''s traditions (loyalty to the working class and the country, Marxism–Leninism applied to Vietnam, unity, independence joined with proletarian internationalism), the will to beat the Americans, and the drive to carry out the 1967 state plan, tied to the recent congress of heroes and emulation fighters. Party members and people to discuss the plan; the winter-spring crop and the first quarter''s plan to be pressed.'
      n: '*Thông tri của Ban Bí thư số 190-TT/TW, ngày 23-1-1967, Về việc kỷ niệm lần thứ 37 ngày thành lập Đảng (3-2)*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 77–78. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1967-03-20.vietnam-hanoi
      when: Mar. 20
      date: '1967-03-20'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - soviet-union
      c: 'The Politburo''s resolution no. 158-NQ/TW on the 50th anniversary of the October Revolution, Nov. 7, 1967: the Party to teach Marxism–Leninism and the Revolution''s lessons, and to hold to unity with the Soviet and Chinese parties and the other socialist and Marxist–Leninist parties. A committee with the Fatherland Front; articles by the leaders, a book, a Soviet film week, a stamp; a month of emulation; a mass meeting in Hanoi; Soviet experts to be rewarded and Soviet delegations invited; Party and government delegations to go to Moscow. Twenty-two slogans, to be published near the day.'
      n: '*Nghị quyết của Bộ Chính trị số 158-NQ/TW, ngày 20-3-1967, Về việc kỷ niệm lần thứ 50 cuộc Cách mạng Tháng Mười vĩ đại*, signed for the Politburo, with no signer named. [[w.van-kien-dang-toan]], XXVIII, 231–39. Made public: 2003.'
      tags:
      - polity:drv
      - polity:ussr
      - polity:prc
      - vis:only:drv
- add:
    entry:
      id: cal.1967-04-18.vietnam-hanoi
      when: Apr. 18
      date: '1967-04-18'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 194-TT/TW on the 81st anniversary of International Labor Day, May 1: to hail the victories of both zones, the working class''s part in the war and in building socialism, and the support of the socialist camp and the world''s workers; a short emulation drive in honor of May Day and Hồ Chí Minh''s birthday. Kept plain: talks, readings, broadcasts and performances; meetings at plants and farms only with air-raid plans; a separate plan for the Center and Hanoi. Slogans attached.'
      n: '*Thông tri của Ban Bí thư số 194-TT/TW, ngày 18-4-1967, Về kỷ niệm lần thứ 81 ngày Quốc tế Lao động 1-5*, signed for the Secretariat by Vũ Tuân, chief of its office. [[w.van-kien-dang-toan]], XXVIII, 289–96. Made public: 2003. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1967-08-17.vietnam-hanoi
      when: Aug. 17
      date: '1967-08-17'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 199-TT/TW on the 22nd anniversary of the August Revolution and National Day (Sept. 2): the theme "nothing is more precious than independence, freedom and socialism"; talks and stories at the bases on the struggle''s tradition, in the secret years, the August days, the first resistance and the present war, joined to emulation for the autumn crop, the winter-spring crop of 1967–68, the state plan and the armed forces and air defense. A rally in Hanoi; slogans to appear in *Nhân Dân*.'
      n: '*Thông tri của Ban Bí thư số 199-TT/TW, ngày 17-8-1967, Về việc kỷ niệm lần thứ 22 ngày Cách mạng Tháng Tám và Quốc khánh 2-9*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 392–93. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-10-21.vietnam-hanoi
      when: Oct. 21
      date: '1967-10-21'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - soviet-union
      c: 'The Secretariat''s circular no. 202-TT/TW, carrying out the Politburo''s resolution no. 158 of Mar. 20, 1967: a political education drive for the 50th anniversary of the October Revolution, on its meaning and lessons for world revolution and Vietnam''s and on the Party''s views of strategy and tactics. Unity of line, independence, and fighting friendship with the Soviet, Chinese and other socialist parties and peoples to be stressed. In the Party, by branch study and discussion; outside it, reports first, then reading and discussion; results to go to the Central Propaganda and Education Department.'
      n: '*Thông tri của Ban Bí thư số 202-TT/TW, ngày 21-10-1967, Về việc tổ chức đợt tuyên truyền giáo dục trong dịp kỷ niệm lần thứ 50 cuộc Cách mạng Tháng Mười*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 433–36. Made public: 2003. See [[cal.1967-03-20.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:ussr
      - polity:prc
      - vis:only:drv
- add:
    entry:
      id: cal.1967-12-01.vietnam-hanoi
      when: Dec. 1
      date: '1967-12-01'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s circular no. 209-TT/TW on Dec. 19, Dec. 20 (the National Liberation Front''s seventh anniversary) and Dec. 22: the North to keep "the oath" to the 14 million in the South, answer the Front''s winter-spring call with emulation, and have the Front''s political program explained. Delegations of heroes and southern cadres to visit the provinces; exhibitions, films, and greetings to the South from the Fatherland Front and paired provinces.'
      n: '*Thông tri của Ban Bí thư số 209-TT/TW, ngày 1-12-1967, Về việc tuyên truyền nhân dịp ba ngày kỷ niệm trong tháng 12 năm 1967*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 473–75. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-01-27.vietnam-hanoi
      when: Jan. 27
      date: '1968-01-27'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 211-TT/TW on the 38th anniversary of the Party''s founding, Feb. 3: teaching of the Party''s fighting unity and its ties with the people, and trust in its line; members to set an example and respect the people''s collective mastery; an emulation drive under the slogan "all to beat the American aggressors". Observances brief and practical: in the countryside joined to democracy in production and in the distribution of grain and to the winter-spring crop; in plants, to democratic management and the first-quarter plan of 1968.'
      n: '*Thông tri của Ban Bí thư số 211-TT/TW, ngày 27-1-1968, Về việc kỷ niệm lần thứ 38 ngày thành lập Đảng ta (3-2)*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 165–66. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-04-15.vietnam-hanoi
      when: Apr. 15
      date: '1968-04-15'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 214-TT/TW on the 82nd anniversary of International Labor Day, May 1: the victories of both zones, the South''s attacks and risings since Tet that opened "a new period" of the war, and the North''s defeat of the bombing. Political mobilization under the slogan "all to beat the American aggressors"; the 1968 plan; a short emulation drive in honor of May Day and Hồ Chí Minh''s birthday; the resolution on work among workers and on the trade unions to be spread. Observances practical, at the bases; a separate plan for the Center and Hanoi. Twenty-three slogans attached.'
      n: '*Thông tri của Ban Bí thư số 214-TT/TW, ngày 15-4-1968, Về kỷ niệm ngày Quốc tế lao động 1-5*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 392–97. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1968-04-27.vietnam-hanoi
      when: Apr. 27
      date: '1968-04-27'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Politburo''s directive no. 159-CT/TW on the 150th anniversary of Marx''s birth, May 5, 1968: to be marked solemnly, to spur the study of Marxism–Leninism and the resolve to beat the Americans. The Central Committee to hold a rally in Hanoi in May; a popular life of Marx; press articles, an exhibition, talks by the Propaganda Department, the Nguyễn Ái Quốc school and the social-science institutes; a long-term plan to publish the classics. Eleven slogans.'
      n: '*Chỉ thị của Bộ Chính trị số 159-CT/TW, ngày 27-4-1968, Về việc tổ chức lễ kỷ niệm lần thứ 150 ngày sinh của Các Mác*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIX, 398, 497–502. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-08-16.vietnam-hanoi
      when: Aug. 16
      date: '1968-08-16'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 221-TT/TW on the 23rd anniversary of the August Revolution and National Day (Sept. 2), after six months of attacks and risings in the South, more than 3,000 American aircraft downed over the North and Hồ Chí Minh''s appeal of July 20: the theme "nothing is more precious than independence and freedom"; the appeal to be studied; an emulation drive from Aug. 19 to Dec. 31; rallies in Hanoi and Haiphong, light forms at the bases, visits to families of the dead and of soldiers. Twenty-one slogans.'
      n: '*Thông tri của Ban Bí thư số 221-TT/TW, ngày 16-8-1968, Về việc kỷ niệm lần thứ 23 Cách mạng Tháng Tám và Quốc khánh 2-9*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 605–10. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1968-12-06.vietnam-hanoi
      when: Dec. 6
      date: '1968-12-06'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s circular no. 223-TT/TW on Dec. 19, Dec. 20 and Dec. 22: a short drive on the nation''s fighting tradition, the 1968 victories of both zones and the Front as organizer of the war in the South; Hồ Chí Minh''s appeal of Nov. 3 and the emulation "each person does the work of two" to be pressed. Front-line cadres to speak in the provinces; exhibitions, a film week, visits to the wounded and to families of the dead; a joint rally in each place, Hanoi and Haiphong each holding one for Dec. 20.'
      n: '*Thông tri của Ban Bí thư số 223-TT/TW, ngày 6-12-1968, Về việc kỷ niệm ngày toàn quốc kháng chiến (19-12), ngày thành lập Quân đội Nhân dân Việt Nam (22-12) và ngày thành lập Mặt trận dân tộc giải phóng miền Nam (20-12)*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXIX, 1017–19. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1969-01-22.vietnam-hanoi
      when: Jan. 22
      date: '1969-01-22'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 227-TT/TW on the 39th anniversary of the Party''s founding, Feb. 3: the Party''s revolutionary tradition and the resolve "all for the South" and "all to beat the American aggressors". The main form: a session of every Party branch and Youth Union branch to review its chief tasks and decide measures, and to strengthen training of members and the Party''s ties with the masses, ahead of the 40th anniversary, Feb. 3, 1970.'
      n: '*Thông tri của Ban Bí thư số 227-TT/TW, ngày 22-1-1969, Về việc kỷ niệm lần thứ 39 ngày thành lập Đảng (3-2)*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 11–12. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1969-04-19.vietnam-hanoi
      when: Apr. 19
      date: '1969-04-19'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 234-TT/TW on the 83rd anniversary of International Labor Day, May 1: the victories on the military, political and diplomatic fronts, above all the South''s spring 1969 attacks, the North''s duty as rear to front, vigilance and readiness. The emulation "each person does the work of two", the 1969 state plan, economic management, distribution, air defense and public order; observances practical, at the bases, without show. Slogans attached.'
      n: '*Thông tri của Ban Bí thư số 234-TT/TW, ngày 19-4-1969, Về kỷ niệm ngày Quốc tế Lao động 1-5*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 48–52. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-04-22.vietnam-hanoi
      when: Apr. 22
      date: '1969-04-22'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 187-NQ/TW on the four great anniversaries of 1970: the Party''s 40th (Feb. 3), Lenin''s centenary (Apr. 22), Hồ Chí Minh''s 80th birthday (May 19) and the DRV''s 25th (Sept. 2). Aims: teaching Marxism–Leninism, the Party''s line and Hồ''s ethics, against revisionism, dogmatism and sectarianism; emulation in production and combat. A drive from mid-1969 to the end of 1970, begun in late June: the leaders'' articles, a book of Hồ''s pieces, a short 40-year Party history, two large exhibitions, a "class of 1970" of new members; the Secretariat to issue a directive on each day.'
      n: '*Nghị quyết của Bộ Chính trị số 187-NQ/TW, ngày 22-4-1969, Về việc tổ chức các ngày kỷ niệm lớn trong năm 1970*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXX, 53–61. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1969-08-14.vietnam-hanoi
      when: Aug. 14
      date: '1969-08-14'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 240-TT/TW on the 24th anniversary of the August Revolution and National Day (Sept. 2): to hold to Hồ Chí Minh''s appeal to fight on until every American soldier is driven out and the puppet army and regime fall; to review the North''s gains and faults; the autumn crop, the winter-spring crop and the 1969 plan. Rallies in Hanoi, Haiphong and the Quảng Ninh mines, at wartime hours and in wartime numbers; meetings at the bases elsewhere; visits to families of the dead and of soldiers; an emulation drive.'
      n: '*Thông tri của Ban Bí thư số 240-TT/TW, ngày 14-8-1969, Về việc kỷ niệm lần thứ 24 Cách mạng Tháng Tám và Quốc khánh 2-9*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 225–27. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1969-12-06.vietnam-hanoi
      when: Dec. 6
      date: '1969-12-06'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s circular no. 244-TT/TW on Dec. 19, Dec. 20 and Dec. 22: the People''s Army''s 25th anniversary to be marked solemnly. Aims: to call on all to carry out Hồ Chí Minh''s Testament and to fight on against the Americans, to press the recruiting drive, strengthen defense and care for wounded soldiers and the families of the dead. A broad propaganda drive; an "army and people''s unity" drive in the provinces; a joint rally in each place, Hanoi and Haiphong each holding two; emulation on the 1969 plan and preparation of the 1970 plan.'
      n: '*Thông tri của Ban Bí thư số 244-TT/TW, ngày 6-12-1969, Về việc tổ chức ba ngày kỷ niệm trong tháng 12 năm nay (19-12, 20-12 và 22-12)*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 357–59. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - name:ho-chi-minh
      - vis:only:drv
