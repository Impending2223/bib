    entry:
      id: cal.1963-04-23.vietnam-hanoi
      when: Apr. 23
      date: '1963-04-23'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 116-TT/TW on May 1: the North''s gains in the first two years of the five-year plan, the 1963 plan, and the South''s fight against the Americans and Diệm. Kept small: a mass meeting in the capital and the towns under the government and trade unions, no models or marches; meetings at workplaces tied to emulation; the press tied to the five-year plan, soon before the Assembly, and to the first northern congress of socialist labor teams, in May.'
      n: '*Thông tri của Ban Bí thư số 116-TT/TW, ngày 23-4-1963, Về tổ chức kỷ niệm ngày Quốc tế lao động 1-5*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIV, 534–39. Made public: 2003. Names: Ngô Đình Diệm.'
      tags:
      - polity:drv
      - polity:us
      - name:ngo-dinh-diem
      - vis:only:drv
- add:
    entry:
      id: cal.1963-03-02.vietnam-hanoi-2
      when: Mar. 2
      date: '1963-03-02'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat meets, after the Thái Bình Provincial Committee''s report, on local industry and crafts in the province: a crowded province with little land, a single crop and few raw materials. Farming, livestock and industrial crops to come first; fishing, salt and sedge the chief trades; mechanical work chiefly repairs and half-mechanized tools; cooperatives, not state plants, wherever they can do the work well.'
      n: '*Thông báo của Ban Bí thư số 48-TB/TW, ngày 22-5-1963, Bàn về phương hướng, nhiệm vụ phát triển công nghiệp địa phương và thủ công nghiệp của tỉnh Thái Bình*, signed for the Secretariat by Minh Châu, deputy chief of the office. [[w.van-kien-dang-toan]], XXIV, 553–56. Made public: 2003. The sitting: "Ngày 2 tháng 3 năm 1963" (Mar. 2); the notice is dated May 22.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1963-11-18.vietnam-hanoi
      when: Nov. 18
      date: '1963-11-18'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 85-NQ/TW, carrying out the Politburo''s decision: the Party organizations of Hồng Quảng and Hải Ninh merged into the Quảng Ninh Provincial Party organization; their two executive committees, just elected at their congresses, to form its committee, which is to choose its standing committee, secretary, deputies and inspection committee.'
      n: '*Nghị quyết của Ban Bí thư số 85-NQ/TW, ngày 18-11-1963, Về việc hợp nhất hai Đảng bộ và hai Ban Chấp hành Đảng bộ Hồng Quảng, Hải Ninh*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 628–29. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-01-17.vietnam-hanoi-2
      when: Jan. 17
      date: '1964-01-17'
      place: hanoi
      thread: vietnam-hanoi
      c: The Secretariat's resolution no. 93-NQNS/TW approves, on the Thanh Hóa Provincial Committee's proposal, the founding of a town Party committee for Sầm Sơn under the provincial committee, to strengthen the Party's leadership in the town.
      n: '*Nghị quyết của Ban Bí thư số 93-NQNS/TW, ngày 17-1-1964, Về chuẩn y việc thành lập Thị uỷ thị trấn Sầm Sơn*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 26. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-03-31.vietnam-hanoi
      when: Mar. 31
      date: '1964-03-31'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 98-NQ/TW approves the Nam Định Provincial Committee''s decision to found a Party committee at the Nam Định Textile Combine, under the provincial committee. Its tasks: to lead the base organizations and the combine''s management and the workers'' living; a term of one year; its secretary to have at least three years in the Party; powers to approve admissions and discipline.'
      n: '*Nghị quyết của Ban Bí thư số 98-NQ/TW, ngày 31-3-1964, Về việc thành lập Đảng bộ Nhà máy Liên hợp dệt Nam Định*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 109–11. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-04-23.vietnam-hanoi
      when: Apr. 23
      date: '1964-04-23'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 78-CT/TW on three coming anniversaries, within the emulation drive "Each person does the work of two": May 1, at the usual scale, with a mass meeting at Ba Đình Square in Hanoi; the 10th anniversary of Điện Biên Phủ, May 7, to be marked solemnly and widely in the army and among the people, with a rally at Ba Đình Hall, talks by veterans, exhibitions, a week of militia readiness and a day of army and people''s unity; Hồ Chí Minh''s 74th birthday, May 19, by light forms, readings of his works. Nineteen slogans.'
      n: '*Chỉ thị của Ban Bí thư số 78-CT/TW, ngày 23-4-1964, Về ba ngày kỷ niệm lớn sắp tới*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 127–32. Made public: 2003. See [[cal.1964-04-18.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1964-08-15.vietnam-hanoi
      when: Aug. 15
      date: '1964-08-15'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam-tonkin
      c: 'The Secretariat''s directive no. 82-CT/TW on the 19th anniversary of the August Revolution and National Day (Sept. 2): from Aug. 19 to Sept. 2, a propaganda drive among the people and a political session in the Party and the Youth Union, on the American plans against North and South under the Politburo''s directive no. 81 of Aug. 7 and on the North''s success against the recent American provocations. Production and readiness to be reviewed; the book *Từ tuyến đầu Tổ quốc* to be read; the armed and semi-armed forces to go over their tradition. Twenty-six slogans.'
      n: '*Chỉ thị của Ban Bí thư số 82-CT/TW, ngày 15-8-1964, Về việc kỷ niệm lần thứ 19 Cách mạng Tháng Tám và ngày Quốc khánh 2 tháng 9*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 203–08. Made public: 2003. See [[cal.1964-08-07.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1964-09-12.vietnam-hanoi
      when: Sept. 12
      date: '1964-09-12'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - china
      c: The Secretariat's circular no. 147-TT/TW on the 15th anniversary of the People's Republic of China, Oct. 1, to be held solemnly to show the Vietnamese people's gratitude for China's support against the Americans. Propaganda on China's 15 years of building, the Marxist–Leninist line of its Party under Mao Zedong, its place as chief target of American imperialism and of the revisionists, and the fighting friendship of the two peoples. A rally at the Hanoi city theater; film weeks and exhibitions in Hanoi, Haiphong, Nam Định, Vinh and the border provinces.
      n: '*Thông tri của Ban Bí thư số 147-TT/TW, ngày 12-9-1964, Về việc kỷ niệm lần thứ 15 ngày thành lập nước Cộng hoà Nhân dân Trung Hoa*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 223–26. Made public: 2003. Names: Mao Zedong.'
      tags:
      - polity:drv
      - polity:prc
      - polity:us
      - name:mao-zedong
      - vis:only:drv
- add:
    entry:
      id: cal.1964-09-12.vietnam-hanoi-2
      when: Sept. 12
      date: '1964-09-12'
      place: hanoi
      thread: vietnam-hanoi
      c: The Secretariat's circular no. 148-TT/TW on the 15th anniversary of the German Democratic Republic, Oct. 7, to be held solemnly in support of the Germans defending it, peace in Europe and German unity. Propaganda on the GDR's building of socialism, and on peace, German unity and the socialist camp's western flank resting on struggle against American imperialism and West German militarists. A rally at the Hanoi city theater and another in Haiphong by paired units and plants built with GDR help; a week of GDR films and exhibitions in Hanoi.
      n: '*Thông tri của Ban Bí thư số 148-TT/TW, ngày 12-9-1964, Về việc kỷ niệm 15 năm thành lập nước Cộng hoà Dân chủ Đức*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 227–29. Made public: 2003.'
      tags:
      - polity:drv
      - polity:gdr
      - polity:frg
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1964-12-11.vietnam-hanoi
      when: Dec. 11
      date: '1964-12-11'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s directive no. 87-CT/TW on Dec. 19, the day of national resistance, Dec. 20, the founding of the National Liberation Front of South Vietnam, and Dec. 22, the People''s Army''s 20th anniversary: a week of propaganda on the American plans against North and South, the South''s victories, the North''s in the affair of Aug. 5 and since, and the international conference of solidarity with the Vietnamese people. Talks at every base and unit; the armed forces to go over their tradition; army and people''s festivals; production and readiness to be pressed.'
      n: '*Chỉ thị của Ban Bí thư số 87-CT/TW, ngày 11-12-1964, Về việc kỷ niệm ngày toàn quốc kháng chiến (19-12), ngày thành lập Mặt trận Dân tộc Giải phóng miền Nam Việt Nam (20-12) và ngày thành lập Quân đội Nhân dân Việt Nam (22-12)*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 285–87. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1964-10-28.vietnam-hanoi
      when: Oct. 28
      date: '1964-10-28'
      thread: vietnam-hanoi
      c: 'The Standing Committee of the Việt Bắc Zone Committee: resolution no. 97-NQ/KU, carrying out the Center''s directive, founds a Party history research board under the zone committee. To sum up and write the zone''s Party history, vet the Party-history content of the Việt Bắc Revolution Museum and of materials to be printed, work with the Central board, and help the provinces finish the history of the August Revolution by the Center''s date.'
      n: '*Nghị quyết của Ban Thường vụ Khu uỷ Việt Bắc số 97-NQ/KU, ngày 28-10-1964, Về Ban Nghiên cứu Lịch sử Đảng trực thuộc Khu uỷ*, signed for the Zone Committee''s Standing Committee by Bắc Dũng, standing member. [[w.van-kien-dang-toan]], XXV, 780–84 (appendix). Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-03-10.vietnam-hanoi
      when: Mar. 10
      date: '1964-03-10'
      thread: vietnam-hanoi
      c: 'The Standing Committee of the Tây Bắc Zone Committee, after a joint meeting on Mar. 9 with the Military Region Committee''s: directive no. 61-CT/TB on defense against the new plots of the Americans and their agents, under the Politburo''s directive and the Secretariat''s no. 75-CT/TW. Enemy aircraft over all three provinces since January, jets by day on Feb. 20 and 29, supplies and leaflets dropped at Mộc Châu, Mường La, Phù Yên, Than Uyên, Điện Biên and Mường Tè, and talk of a coming Hmong "king". Expected: commandos on the highland border, air attack. Measures: propaganda, air defense, defense against commandos.'
      n: '*Chỉ thị của Ban Thường vụ Khu uỷ Tây Bắc số 61-CT/TB, ngày 10-3-1964, Về tăng cường công tác phòng và chống mọi âm mưu hoạt động mới của địch*, signed for the Zone Committee''s Standing Committee by Hoàng Văn Kiểu, secretary. [[w.van-kien-dang-toan]], XXV, 785–92 (appendix). Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1965-01-12.vietnam-hanoi
      when: Jan. 12
      date: '1965-01-12'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 89-CT/TW on the 35th anniversary of the Party''s founding, Feb. 3, to be larger than in the usual odd years: teaching on the Party''s history, role and gains, and on the tasks of 1965, the emulation drive "Each person does the work of two", production, air defense and public order, and support for the South. Talks and meetings in the people, the Party, the trade unions and the Youth Union on the Party''s history, nationally and in each place.'
      n: '*Chỉ thị của Ban Bí thư số 89-CT/TW, ngày 12-1-1965, Về việc kỷ niệm lần thứ 35 ngày thành lập Đảng ta*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 10–13. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-04-17.vietnam-hanoi-2
      when: Apr. 17
      date: '1965-04-17'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 158-TT/TW on Hồ Chí Minh''s 75th birthday, May 19: cadres and people to learn his revolutionary morals and to fight on against the Americans, in production and combat in the North, aid to the South and support for the Lao revolution. Talks, readings and press on his life and sayings, above all his recent speech at the second session of the Assembly''s third term; a short emulation drive in his honor; heroes, emulation fighters, units and children to write to him; no show or waste.'
      n: '*Thông tri của Ban Bí thư số 158-TT/TW, ngày 17-4-1965, Về việc mừng thọ Hồ Chủ tịch 75 tuổi*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 140–41. Made public: 2003. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - polity:laos
      - name:ho-chi-minh
      - vis:only:drv
- add:
    entry:
      id: cal.1965-07-01.vietnam-hanoi
      when: July 1
      date: '1965-07-01'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      c: 'The Secretariat''s circular no. 163-TT/TW: a propaganda drive for July 20, the Geneva anniversary, at home and abroad, to condemn the American war and spread Hanoi''s terms, Phạm Văn Đồng''s four points and the National Liberation Front''s five-point statement of Mar. 22, 1965. At home a short emulation drive, July 14–20, a government statement, a Foreign Ministry white paper and a rally in Hanoi; abroad, press conferences, broadcasts and exhibitions by the missions.'
      n: '*Thông tri của Ban Bí thư số 163-TT/TW, ngày 1-7-1965, Về kế hoạch tuyên truyền động viên đấu tranh trong dịp 20 tháng 7 năm nay*, signed for the Secretariat by Vũ Tuân, chief of its office. [[w.van-kien-dang-toan]], XXVI, 226–32. Made public: 2003. Names: Phạm Văn Đồng.'
      tags:
      - polity:drv
      - polity:us
      - name:pham-van-dong
      - vis:only:drv
- add:
    entry:
      id: cal.1965-08-17.vietnam-hanoi-2
      when: Aug. 17
      date: '1965-08-17'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 106-CT/TW on the 20th anniversary of the August Revolution and National Day (Sept. 2): from Aug. 19 to Sept. 2, a drive to rally people and army in production and combat against the Americans, on the revolution''s gains in North and South. Talks in the Party and among the people; the semi-armed forces taught people''s war and urged to bring down aircraft and take pilots and commandos; museums, exhibitions, films; the "Each person does the work of two" emulation.'
      n: '*Chỉ thị của Ban Bí thư số 106-CT/TW, ngày 17-8-1965, Về việc kỷ niệm lần thứ 20 ngày Cách mạng Tháng Tám và Quốc khánh 2-9*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 332–39. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1965-10-26.vietnam-hanoi
      when: Oct. 26
      date: '1965-10-26'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 112-CT/TW on the 200th anniversary of the poet Nguyễn Du''s birth: the Politburo''s decision of early 1964, and the World Peace Council''s listing of him among the figures honored in 1965, at its December 1964 session in Berlin. To be marked in November 1965, tied to production and the fight against the Americans; his works republished; ceremonies in Hanoi, Hà Tĩnh (his home), Haiphong and Nam Định, talks and readings elsewhere; the stage, film and exhibition plans to be reviewed because of the bombing; the missions abroad to help the hosts.'
      n: '*Chỉ thị của Ban Bí thư số 112-CT/TW, ngày 26-10-1965, Về việc kỷ niệm Nguyễn Du*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVI, 417–21. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1966-01-20.vietnam-hanoi-2
      when: Jan. 20
      date: '1966-01-20'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 173-TT/TW on the 36th anniversary of the Party''s founding, Feb. 3: no big rally, but talks at offices, plants, sites, farms, cooperatives and schools, on the Twelfth Plenum''s resolution, the state''s two-year plan and the tasks of 1966, with stories of the Party''s history and of the 1965 record in production and combat. Good members and models to be named; faulty ideas, over-confidence, lost vigilance, pessimism, to be dealt with in the talks.'
      n: '*Thông tri của Ban Bí thư số 173-TT/TW, ngày 20-1-1966, Về việc kỷ niệm lần thứ 36 ngày thành lập Đảng (3-2)*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 18–20. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-04-23.vietnam-hanoi
      when: Apr. 23
      date: '1966-04-23'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 178-TT/TW on the 80th anniversary of International Labor Day, May 1: propaganda tied to the Twelfth Plenum''s resolution and the two-year plan, 1966–67; an emulation month, May 1–30, in honor of May Day and Hồ Chí Minh''s birthday, May 19, aimed at the second-quarter plan, the spring rice and subsidiary crops. Observed plainly: meetings at plants and cooperatives, a larger meeting in the big cities but with no crowds by day, precautions against enemy aircraft, a separate plan for Hanoi and the Center. Twenty-six slogans attached.'
      n: '*Thông tri của Ban Bí thư số 178-TT/TW, ngày 23-4-1966, Về kỷ niệm lần thứ 80 ngày Quốc tế Lao động 1-5*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 130–35. Made public: 2003. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - vis:only:drv
