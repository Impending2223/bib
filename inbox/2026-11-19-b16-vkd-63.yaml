    entry:
      id: cal.1962-12-19.vietnam-hanoi
      when: Dec. 19–20
      date: '1962-12-19'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat and the heads of the branches concerned hear the Phú Thọ Provincial Committee on local industry and crafts in the five-year plan, 1961–65. The province has farm, forest and mineral resources and rail, road and river lines (358 km of road, 75 of rail, 294 of waterway). The Secretariat''s views: building materials, farm implements and some goods for state plants; no blast furnace to be built in the province; the committee to settle the mines, the mechanical works and its targets with the branches.'
      n: '*Thông báo của Ban Bí thư số 43-TB/TW, ngày 16-1-1963, Về phương hướng và nhiệm vụ phát triển công nghiệp địa phương và thủ công nghiệp của tỉnh Phú Thọ*, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXIV, 65–72. Made public: 2003. The sittings: "Chiều ngày 19 và ngày 20-12-1962" (the afternoon of Dec. 19, and Dec. 20); the notice is dated Jan. 16, 1963. The time is the first day''s.'
