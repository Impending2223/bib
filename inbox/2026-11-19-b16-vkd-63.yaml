    entry:
      id: cal.1966-06-22.vietnam-hanoi-2
      when: June 22
      date: '1966-06-22'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      c: 'The Secretariat''s directive no. 130-CT/TW, on the Politburo''s decision: a strong propaganda drive for July 20, the Geneva anniversary, at home and abroad, against the American escalation in the South and the bombing of the North. At home a political session in July in the Party on Trường Sơn''s article on the South''s 1965–66 dry-season victory, and a committee on American war crimes in the North, with a letter to the American people and to Bertrand Russell. Abroad, the missions to press for rallies, strikes and boycotts, the socialist countries first.'
      n: '*Chỉ thị của Ban Bí thư số 130-CT/TW, ngày 22-6-1966, Về đợt tuyên truyền vận động trong dịp 20 tháng 7 năm 1966*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 208–17. Made public: 2003. Names: Bertrand Russell.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1966-08-15.vietnam-hanoi-2
      when: Aug. 15
      date: '1966-08-15'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 135-CT/TW on the 21st anniversary of the August Revolution and National Day (Sept. 2): a political education drive through September in all bases, on Hồ Chí Minh''s call to fight the Americans, Lê Duẩn''s talk at the first army congress of youth resolved to win and Nguyễn Chí Thanh''s report of Aug. 9–10 to the provincial secretaries; the armed forces also on the talks of Võ Nguyên Giáp and Song Hào. Discussion of American crimes, the worth of independence and socialism, and each unit''s tasks; provincial and city committees to set their programs of action.'
      n: '*Chỉ thị của Ban Bí thư số 135-CT/TW, ngày 15-8-1966, Về việc kỷ niệm lần thứ 21 Cách mạng Tháng Tám và Quốc khánh 2-9*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVII, 287–94. Made public: 2003. Names: Hồ Chí Minh, Lê Duẩn, Nguyễn Chí Thanh, Võ Nguyên Giáp, Song Hào.'
      tags:
      - polity:drv
      - polity:us
      - name:ho-chi-minh
