    entry:
      id: cal.1963-04-23.vietnam-hanoi
      when: Apr. 23
      date: '1963-04-23'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 116-TT/TW on May 1: the North''s gains in the first two years of the five-year plan, the 1963 plan, and the South''s fight against the Americans and Diệm. Kept small in form: a mass meeting in the capital and the towns under the government with the trade unions, no models or marches; meetings at workplaces and cooperatives tied to emulation; the press tied to the five-year plan soon before the Assembly and to the first northern congress of socialist labor teams, in May; an appeal from the trade-union federation; guards on plants and depots.'
      n: '*Thông tri của Ban Bí thư số 116-TT/TW, ngày 23-4-1963, Về tổ chức kỷ niệm ngày Quốc tế lao động 1-5*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIV, 534–39. Made public: 2003. Names: Ngô Đình Diệm.'
