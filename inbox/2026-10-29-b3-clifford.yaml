        585 (the meeting of the early evening; Rusk: "as hard as it can be short of a contract"). Made public: FRUS 1964–68,
        VII (2003). See [[cal.1968-10-27.vietnam-paris]]. Names: Johnson, Rusk, Clifford, Wheeler, Helms, Rostow, Taylor.'
      tags:
