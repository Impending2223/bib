      when: First week of August
      date: 1960-08
      thread: transition-and-staff
      c: 'Kennedy''s house on N Street, Georgetown, at breakfast, by Clifford''s account. Kennedy asks Clifford for a memorandum,
        "a plan of takeover," ready by Election Day: "If I win, I don''t want to wake up on the morning of November 9 and
        say to myself, ''What do I do now?''"'
      n: '[[w.clifford-counsel-to-the-president-2]], 319. Names: Kennedy, Clifford.'
      tags:
      - name:kennedy-john-f
      - name:clifford-clark
      src:
