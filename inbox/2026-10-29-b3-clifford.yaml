      when: Jan. 18
      date: '1968-01-18'
      thread: defense-clifford
      c: 'After 7 p.m., by Clifford''s account. Johnson to Clifford: "Now I''ve got exactly the right place for you—Secretary
        of Defense." Clifford accepts; no one to be told until Rusk, McNamara and the congressional leaders are.'
      n: '[[w.clifford-counsel-to-the-president-2]], 462. See [[cal.1967-11-29.defense]]. Names: Johnson, Clifford, Rusk,
        McNamara.'
