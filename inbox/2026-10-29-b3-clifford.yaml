      date: '1968-03-08'
      thread: vietnam-205000
      also:
      - vietnam-congress
      c: 'Clifford and Wheeler with Russell, Stennis, Jackson and Symington, by Clifford''s account: no call-up, no extended
        tours, no more reinforcements; Jackson: "we won''t support you." Mansfield, seen apart: the end of the line on troop
        increases.'
      n: '[[w.clifford-counsel-to-the-president-2]], 498. See [[cal.1968-03-04.vietnam]]. Names: Clifford, Wheeler, Russell,
        Stennis, Jackson, Symington, Mansfield.'
