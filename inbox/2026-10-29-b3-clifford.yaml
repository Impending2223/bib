      when: Nov. 30
      date: '1963-11-30'
      thread: succession
      c: 'The Oval Office, a Saturday, into the evening, by Clifford''s account: Johnson with Clifford and Fortas on continuity
        and change. Clifford: let the Kennedy men go at their own pace; no chief of staff. Johnson: "Clark, you''re my transition
        expert now."'
      n: '[[w.clifford-counsel-to-the-president-2]], 390–91. To check: President''s Daily Diary, Nov. 30, 1963 (LBJ Library;
        National Archives Catalog, https://catalog.archives.gov/id/192438). Names: Johnson, Clifford, Fortas.'
