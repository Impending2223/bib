      when: Mar. 8
      date: '1968-03-08'
      thread: vietnam-205000
      c: 'Wheeler to Clifford, CM-3098-68: the special committee''s recommendations passed to Westmoreland at the President''s
        request, three tactical fighter squadrons at once, some 22,000 more men, the reserves called; Westmoreland''s first
        comments.'
      n: '[FRUS 1964–68, VI, doc. 114](https://history.state.gov/historicaldocuments/frus1964-68v06/d114). Made public: FRUS
