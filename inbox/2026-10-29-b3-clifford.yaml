      when: Nov. 20–22
      date: '1960-11-20'
      thread: robert-kennedy
      also:
      - transition-and-staff-cabinet
      c: 'Palm Beach, by Clifford''s account. Clifford to the President-elect at the pool, on the Attorney General: political
        choices under Grant, Harding, Truman (McGrath), Eisenhower (Brownell). Later, alone, Kennedy: "My father wants me
        to appoint Bobby"; Robert Kennedy does not want it; the President-elect would rather make him second man at Defense;
        would Clifford see his father in New York?'
      n: '[[w.clifford-counsel-to-the-president-2]], 336. Names: Clifford, John F. Kennedy, Robert Kennedy, Joseph Kennedy.'
      tags:
      - name:clifford-clark
      - name:kennedy-john-f
