      when: Apr. 1
      date: '1965-04-01'
      thread: vietnam
      also:
      - intelligence
      c: 'Taylor, home from Saigon, at the Foreign Intelligence Advisory Board, by Clifford''s account: against American combat
        troops; the American soldier "not a suitable guerilla fighter for Asian forests and jungles."'
      n: '[[w.clifford-counsel-to-the-president-2]], 409. See [[cal.1965-02-22.vietnam]]. Names: Taylor, Clifford.'
