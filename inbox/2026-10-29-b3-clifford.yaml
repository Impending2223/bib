    entry:
      id: cal.1961-11-27.elections-1962
      when: Nov. 27
      date: '1961-11-27'
      thread: elections-1962
      c: 'Clifford to the President, by letter: "the occurrence in question will not adversely affect Teddy''s chances in
        a Senate race." To Edward Kennedy, at the President''s request: no prepared statement; the matter to come out in answer
        to a question, or in a reporter''s article.'
      n: '[[w.clifford-counsel-to-the-president-2]], 369–70. See [[cal.1961-09.elections-1962]]. Names: Clifford, John F.
        Kennedy, Edward Kennedy.'
      tags:
      - name:clifford-clark
      - name:kennedy-john-f
      - name:kennedy-edward-m
      src:
        c: 26e00dba
        rows:
        - 'w.clifford-counsel-to-the-president-2 369–70: all'
- add:
    entry:
      id: cal.1962-03-20.court
      when: Mar. 20
      date: '1962-03-20'
      thread: court
      c: 'The Oval Office, alone, by Clifford''s account. Clifford to Kennedy on Whittaker''s seat: not Hastie, Robert Kennedy''s
        choice, whose opinions fall short; Paul Freund of Harvard. Asked, Clifford wants no seat: "I am an advocate, not a
        judge."'
      n: '[[w.clifford-counsel-to-the-president-2]], 374–75. See [[cal.1962-03-30.court]]. Names: Clifford, Kennedy, Whittaker,
        Robert Kennedy. Check: the day, from Clifford''s "ten days after our meeting."'
      tags:
      - name:clifford-clark
      - name:kennedy-john-f
      - name:whittaker-charles-e
      - name:kennedy-robert-f
      src:
        c: 6b8bcc2f
        rows:
        - 'w.clifford-counsel-to-the-president-2 374–75: all'
- add:
    entry:
      id: cal.1962-04-12.steel-2
      when: Apr. 12
      date: '1962-04-12'
      thread: steel
      c: 'National Airport, the Butler Terminal, about 8 p.m., aboard U.S. Steel''s airplane, by Clifford''s account. Clifford,
        sent by Kennedy through Bartlett from the state dinner, with Robert Tyson, chairman of U.S. Steel''s finance committee,
        after Goldberg''s talks fail: no smaller increase; rescind it all, or the President uses every tool; Defense already
        moving its orders. Kennedy and Clifford late that night.'
      n: '[[w.clifford-counsel-to-the-president-2]], 376–77. See [[cal.1962-04-10.steel]]. Names: Clifford, Kennedy, Bartlett,
        Goldberg.'
      tags:
      - name:clifford-clark
      - name:kennedy-john-f
