      when: June 26
      date: '1968-06-26'
      thread: vietnam-paris
      c: 'Paris, the evening, a CIA safe house: Vance with Hà Văn Lâu in secret, two hours. The bombing to stop on three conditions,
        by Clifford''s account: talks with Saigon "prompt and productive," the DMZ respected, no rockets on the cities. Lâu''s
        answer negative.'
      n: '[FRUS 1964–68, VI, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v06/d286) (Vance to Zorin,
        June 28: two hours; Lâu''s response negative). [[w.clifford-counsel-to-the-president-2]], 549. Made public: FRUS 1964–68,
        VI (2002). See [[cal.1968-05-21.vietnam-paris]]. Names: Vance, Hà Văn Lâu.'
