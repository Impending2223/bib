      when: Oct. 15
      date: '1968-10-15'
      thread: vietnam-paris
      c: 'The foreign policy group, the evening: Rusk, Clifford, Rostow, William Bundy, Read, McPherson. Read: Hanoi cannot
        have the NLF in Paris a day after the bombing stops. Clifford: no halt "until we know the date of the meeting at which
        the GVN will be present"; for the first meeting "We just need a warm body."'
      n: '[FRUS 1964–68, VII, doc. 73](https://history.state.gov/historicaldocuments/frus1964-68v07/d73). [[w.clifford-counsel-to-the-president-2]],
        577 (7:30 p.m.; a "date certain," not twenty-four hours). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-10-14.vietnam]].
        Names: Rusk, Clifford, Rostow, William Bundy, Read, McPherson.'
