- add:
    entry:
      id: cal.1965-04-28.vietnam
      when: Apr. 28
      date: '1965-04-28'
      thread: vietnam
      c: 'McCone to Johnson, by letter, his last day as Director: "as we deploy additional troops, which I believe necessary,
        we concurrently hit the north harder and inflict greater damage"; strike the petroleum, the power plants, the air
        defenses and the SAM sites; "tighten the tourniquet."'
      n: '[FRUS 1964–68, II, doc. 279](https://history.state.gov/historicaldocuments/frus1964-68v02/d279). [[w.clifford-counsel-to-the-president-2]],
        409 (the first words). Made public: FRUS 1964–68, II (1996). See [[cal.1965-04-02.vietnam]]. Names: McCone, Johnson.'
      tags:
      - name:mccone-john-a
      - name:johnson-lyndon-b
