- add:
    entry:
      id: cal.1965-07-23.vietnam-july-decision
      when: July 23
      date: '1965-07-23'
      thread: vietnam-july-decision
      c: 'Ball and Clifford by telephone, before and after Ball''s meeting with Rusk, McNamara, Wheeler, Moyers and McGeorge
        Bundy, by Clifford''s account. Moyers to Clifford: Johnson has all but decided for McNamara and Westmoreland. Johnson,
        before 7 p.m., asks the Cliffords to Camp David.'
      n: '[[w.clifford-counsel-to-the-president-2]], 416–17. See [[cal.1965-07-21.vietnam]]. Names: Ball, Clifford, Rusk,
        McNamara, Wheeler, Moyers, McGeorge Bundy, Westmoreland, Johnson.'
