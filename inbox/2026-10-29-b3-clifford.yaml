      when: May 11
      date: '1965-05-11'
      thread: vietnam
      c: Johnson hands Clifford the Director's letter and asks his reaction, by Clifford's account; no copy to be kept, the
        letter discussed with no one.
      n: '[[w.clifford-counsel-to-the-president-2]], 409. Reply: [[cal.1965-05-17.vietnam]]. See [[cal.1965-04-28.vietnam]].
