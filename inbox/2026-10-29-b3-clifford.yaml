      id: cal.1968-11-07.vietnam-paris
      when: Nov. 7
      date: '1968-11-07'
      thread: vietnam-paris
      also:
      - transition-and-staff
      c: 'The foreign policy meeting: Rusk, Clifford, Wheeler, Taylor, Helms, Rostow. Rusk: a new peace plan from Saigon;
        see how Nixon can get out of this. Clifford: Johnson and Nixon should talk; "we and South Vietnam have different goals.
        We—want to finish fighting, get peace and get out. I believe they prefer fighting go on."'
      n: '[FRUS 1964–68, VII, doc. 202](https://history.state.gov/historicaldocuments/frus1964-68v07/d202). [[w.clifford-counsel-to-the-president-2]],
        599 (Nixon to send Thiệu word; Johnson to meet him at once). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-11-02.vietnam]].
        Names: Rusk, Clifford, Wheeler, Taylor, Helms, Rostow, Nixon, Johnson.'
      tags:
