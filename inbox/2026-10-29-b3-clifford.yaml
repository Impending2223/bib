      when: Nov. 21
      date: '1960-11-21'
      thread: transition-and-staff
      also:
      - desegregation-schools
      c: 'Palm Beach. Clifford, for the President-elect, hears a group of Southern legislators protesting court-ordered desegregation,
        by Clifford''s account: he will convey their views.'
      n: '[[w.clifford-counsel-to-the-president-2]], 334. See [[cal.1960-11-21.transition-and-staff]]. Names: Clifford. Check:
