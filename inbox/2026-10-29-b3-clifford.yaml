- add:
    entry:
      id: cal.1960-07-01.elections-1960
      when: July 1
      date: '1960-07-01'
      thread: elections-1960
      c: 'Georgetown, Kennedy''s house, at breakfast, by Clifford''s account. Kennedy: about 600 delegates of the 761 needed;
        would Symington withdraw before the first ballot and support him? "I''d like to talk with you about having him on
        the ticket." Symington''s answer, through Clifford: not while a deadlock is possible.'
      n: '[[w.clifford-counsel-to-the-president-2]], 314. Names: Kennedy, Clifford, Symington.'
      tags:
      - name:kennedy-john-f
      - name:clifford-clark
      - name:symington-william-s
      src:
        c: 5679aeaf
        rows:
        - 'w.clifford-counsel-to-the-president-2 314: all'
- add:
    entry:
      id: cal.1960-07-02.elections-1960
      when: July 2
      date: '1960-07-02'
      thread: elections-1960
      c: 'Truman, in a public statement, to Kennedy: "Senator, are you certain you are quite ready for the country, or that
        the country is ready for you in the role of President in January 1961? ... May I suggest you be patient?" He stays
        for Symington.'
      n: '[[w.clifford-counsel-to-the-president-2]], 321. To check: *New York Times*, July 3, 1960. Names: Truman, Kennedy,
        Symington. Check: Clifford gives Kennedy''s answer ("If fourteen years in major elective office is insufficient experience
        ...") without its day.'
      tags:
      - name:truman-harry-s
      - name:kennedy-john-f
      - name:symington-william-s
      src:
        c: 82feb55b
        rows:
        - 'w.clifford-counsel-to-the-president-2 321: all'
- add:
    entry:
      id: cal.1960-07-29.elections-1960
      when: July 29
      date: '1960-07-29'
      thread: elections-1960
      c: Robert Kennedy and Clifford, a sandwich lunch in the candidate's Senate office, by Clifford's account. Clifford proposes
        a small group, acceptable to both brothers, to judge the campaign apart from those running it, reporting to the two
        alone. Robert Kennedy shows no enthusiasm.
      n: '[[w.clifford-counsel-to-the-president-2]], 320. Names: Robert Kennedy, Clifford.'
      tags:
      - name:kennedy-robert-f
      - name:clifford-clark
      src:
        c: b9fb7ece
        rows:
        - 'w.clifford-counsel-to-the-president-2 320: all'
