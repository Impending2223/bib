      date: '1963-09-12'
      thread: vietnam
      also:
      - intelligence
      c: 'McCone to the Foreign Intelligence Advisory Board, by Clifford''s account: South Vietnam so far gone that the United
        States might have to pull out; Diệm without support but among the Catholics. The CIA in touch with the generals, not
        encouraging a coup.'
      n: '[[w.clifford-counsel-to-the-president-2]], 405. Names: McCone, Ngô Đình Diệm. Check: Clifford calls McCone''s denial
        false (Conein and Dương Văn Minh).'
