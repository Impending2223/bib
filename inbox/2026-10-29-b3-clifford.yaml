      date: '1968-10-23'
      thread: vietnam-paris
      also:
      - republican-party
      c: 'Walter Reed, the morning: Clifford and Wheeler bring Eisenhower up to date on the negotiations, by Clifford''s account.
        Eisenhower will support the President whether or not he stops the bombing.'
      n: '[[w.clifford-counsel-to-the-president-2]], 578. Names: Clifford, Wheeler, Eisenhower.'
