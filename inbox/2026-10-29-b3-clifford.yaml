      id: cal.1960-07-30.elections-1960
      when: July 30
      date: '1960-07-30'
      thread: elections-1960
      c: 'Kennedy to Clifford, by letter: "in pretty good shape for August and September," but "by October I am concerned
        that our people may be running out of gas"; would Clifford see Shriver, to "come up with new plans for programs and
        policy, ideas and speeches for the last four weeks."'
      n: '[[w.clifford-counsel-to-the-president-2]], 320–21. See [[cal.1960-07-29.elections-1960]]. Names: Kennedy, Clifford,
        Shriver.'
      tags:
      - name:kennedy-john-f
      - name:clifford-clark
      - name:shriver-r-sargent
      src:
        c: '24721905'
        rows:
        - 'w.clifford-counsel-to-the-president-2 320–21: all'
