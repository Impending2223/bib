      when: April
      date: 1961-04
      thread: intelligence
      also:
      - cuba-bay-of-pigs
      c: 'The Oval Office, after the Bay of Pigs, by Clifford''s account. Kennedy: "I have had two full days of hell"; "I
        doubt my Presidency could survive another catastrophe like this"; "the incorrect facts were due to a failure of intelligence."
        He asks Clifford onto a board to oversee the intelligence community.'
      n: '[[w.clifford-counsel-to-the-president-2]], 349–50. See [[cal.1961-04.cuba-bay-of-pigs]]. Names: Kennedy, Clifford.'
      tags:
      - name:kennedy-john-f
      - name:clifford-clark
      src:
        c: 65dc6702
        rows:
        - 'w.clifford-counsel-to-the-president-2 349–50: all'
- add:
    entry:
      id: cal.1961-05-09.intelligence
      when: May 9
      date: '1961-05-09'
      thread: intelligence
      c: 'Clifford to Kennedy, by letter: a "comprehensive investigation" of the CIA, beyond Taylor''s study of the Bay of
        Pigs; "there are certain present Agency operations in which U.S. involvement is being concealed no better than it
        was in the Cuban effort."'
      n: '[[w.clifford-counsel-to-the-president-2]], 350. See [[cal.1961-05-04.intelligence]]. Names: Clifford, Kennedy, Taylor.'
      tags:
      - name:clifford-clark
      - name:kennedy-john-f
      - name:taylor-maxwell
      src:
        c: e737bd28
        rows:
        - 'w.clifford-counsel-to-the-president-2 350: all'
- add:
    entry:
      id: cal.1961-05-15.intelligence
      when: May 15
      date: '1961-05-15'
      thread: intelligence
      c: 'The President''s Foreign Intelligence Advisory Board, Killian its chairman, meets Kennedy for the first time, by
        Clifford''s account: access to every activity of the intelligence community; it is to see that the recommendations
        he approves are carried out.'
      n: '[[w.clifford-counsel-to-the-president-2]], 351. See [[cal.1961-05-04.intelligence]]. Names: Killian, Kennedy.'
      tags:
      - name:killian-james-r-jr
      - name:kennedy-john-f
      - name:clifford-clark
      src:
        c: 2c818b9d
        rows:
        - 'w.clifford-counsel-to-the-president-2 351: all'
