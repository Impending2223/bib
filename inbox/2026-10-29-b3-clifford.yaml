      when: Mar. 8
      date: '1968-03-08'
      thread: vietnam-205000
      c: 'Wheeler to Westmoreland and Sharp, CJCS 02721, at Clifford''s request after the *New York Times*''s "senior military
        spokesman": the shock of Tet the greater for "the euphoria engendered by optimistic statements"; be "conservative
        in assessments of the situation and enemy capabilities," as command guidance, without attribution.'
      n: '[[w.clifford-counsel-to-the-president-2]], 498–99. To check: Wheeler to Westmoreland and Sharp, CJCS 02721, Mar.
        8, 1968; Westmoreland to Wheeler, MAC 03280, "Eyes Only" (cited by [[w.clifford-counsel-to-the-president-2]], 499
        n.7). See [[cal.1968-03-04.vietnam]]. Names: Wheeler, Westmoreland, Sharp, Clifford.'
