    entry:
      id: cal.1962-11-09.intelligence
      when: Nov. 9
      date: '1962-11-09'
      thread: intelligence
      also:
      - missile-crisis
      c: 'The Foreign Intelligence Advisory Board reviews the intelligence on Cuba, by Clifford''s account: no flights over
        Cuba from Aug. 29 to Oct. 14; the delay "dangerously and inexcusably long."'
      n: '[[w.clifford-counsel-to-the-president-2]], 357–58. See [[cal.1962-09-28.missile-crisis]]. Names: Clifford.'
      tags:
      - name:clifford-clark
      src:
        c: b0659eaf
        rows:
        - 'w.clifford-counsel-to-the-president-2 357–58: all'
- add:
    entry:
      id: cal.1962-12.intelligence
      when: Late December
      date: 1962-12
      thread: intelligence
      also:
      - missile-crisis
      c: 'The Foreign Intelligence Advisory Board on McCone''s report of his agency''s performance on Cuba, by Clifford''s
        account. Clifford: a "snow job"; the estimate of Sept. 19 against McCone''s own "honeymoon cables"; the Republican
        National Committee''s charge of information held back for the election unfounded. Kennedy tells McCone to give the
