      when: Dec. 11
      date: '1963-12-11'
      thread: intelligence
      c: 'Johnson meets the Foreign Intelligence Advisory Board at Clifford''s request, by Clifford''s account: it is to go
        on as under Kennedy.'
      n: '[[w.clifford-counsel-to-the-president-2]], 391. Names: Johnson, Clifford.'
