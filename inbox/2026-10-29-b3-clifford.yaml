      when: Dec. 1
      date: '1960-12-01'
      thread: transition-and-staff-cabinet
      c: 'Lovett with the President-elect, by Clifford''s account: offered State, Defense or the Treasury, he declines again.'
      n: '[[w.clifford-counsel-to-the-president-2]], 338. See [[cal.1960-12-01.transition-and-staff-2]]. Names: Lovett, Kennedy.'
