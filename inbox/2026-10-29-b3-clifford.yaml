      when: Feb. 11
      date: '1968-02-11'
      thread: vietnam-tet
      also:
      - vietnam-205000
      c: 'Sunday, the family quarters, 4:25 to 6:15 p.m.: Westmoreland''s cable of Feb. 9 read. Taylor: "I am out of tune
        with this meeting. I read General Westmoreland''s cable differently from you." Rusk: if Westmoreland is asking for
        troops, "he has a poor Colonel doing the drafting for him." Wheeler to go out.'
      n: '[FRUS 1964–68, VI, doc. 67](https://history.state.gov/historicaldocuments/frus1964-68v06/d67). [[w.clifford-counsel-to-the-president-2]],
        477–78 (the questions put so that no request is made). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-09.vietnam]].
        Names: Westmoreland, Taylor, Rusk, Wheeler. Check: Clifford, 479, sends Wheeler to Vietnam at the meeting of Feb.
        13.'
      tags:
      - name:westmoreland-william
      - name:taylor-maxwell
      - name:rusk-dean
      - name:wheeler-earle
      - name:johnson-lyndon-b
