      - elections-1968
      c: 'The Tuesday lunch, 1:12 to 2:24 p.m. Johnson: Smathers called, "Nixon people think a ''political trick'' is planned."
        Wheeler''s list for a halt. Clifford: "We need to draft initial orders."'
      n: '[FRUS 1964–68, VII, doc. 72](https://history.state.gov/historicaldocuments/frus1964-68v07/d72). [[w.clifford-counsel-to-the-president-2]],
