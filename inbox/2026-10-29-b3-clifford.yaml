      when: Late November
      date: 1960-11
      thread: transition-and-staff-cabinet
      c: New York, at lunch, by Clifford's account. Clifford offers Lovett, for the President-elect, Defense or the Treasury;
        Lovett could not keep up with "a bunch of forty-year-old touch-football players"; he names McNamara for Defense. On
        his doctor's advice he declines by telephone the next morning.
      n: '[[w.clifford-counsel-to-the-president-2]], 337–39. Names: Clifford, Lovett, McNamara.'
      tags:
      - name:clifford-clark
      - name:lovett-robert-a
