    entry:
      id: cal.1960-08-01.elections-1960
      when: Aug. 1
      date: '1960-08-01'
      thread: elections-1960
      c: 'Shriver with Clifford, by Clifford''s account: Clifford again proposes a separate campaign review group; Shriver
        for it.'
      n: '[[w.clifford-counsel-to-the-president-2]], 321. See [[cal.1960-07-29.elections-1960]]. Names: Shriver, Clifford.'
