      when: Jan. 23
      date: '1968-01-23'
      thread: vietnam-khe-sanh
      also:
      - japan-and-korea-pueblo
      - defense-clifford
      c: 'The Tuesday lunch, 12:58 to 2:30 p.m., Clifford there for the first time. Johnson: the *Pueblo* related to the whole
        picture; something in Berlin would not surprise him. Wheeler: Westmoreland confident at Khe Sanh, reinforced, with
        artillery for bad weather.'
      n: '[FRUS 1964–68, VI, doc. 23](https://history.state.gov/historicaldocuments/frus1964-68v06/d23). [[w.clifford-counsel-to-the-president-2]],
        465–66 (the agenda: the intrusion into Cambodia, the B-52 lost at Thule, Khe Sanh, the *Pueblo*; Johnson expects the
        next blow in Berlin). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-01-23.japan-and-korea]]. Names: Clifford,
        Johnson, Wheeler, Westmoreland.'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
