      when: Mar. 9
      date: '1968-03-09'
      thread: vietnam-205000
      c: 'Wheeler to Westmoreland, JCS 2767: no decision yet to deploy the 30,000; "strong resistance from all quarters to
        putting more ground force units in South Vietnam"; the call-up "will raise unshirted hell in many influential quarters";
        "you should not count upon an affirmative decision for such additional forces."'
      n: '[FRUS 1964–68, VI, doc. 115](https://history.state.gov/historicaldocuments/frus1964-68v06/d115). [[w.clifford-counsel-to-the-president-2]],
        499. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-04.vietnam]]. Names: Wheeler, Westmoreland.'
