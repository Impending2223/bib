      date: '1960-09-02'
      thread: elections-1960
      c: 'Clifford and Gore at breakfast, the Fairfax Hotel, by Clifford''s account: the group to meet in Gore''s apartment
        there. The Gore Group meets three times a week, usually at breakfast, to the election; Robert Kennedy with it several
        times, the candidate once.'
      n: '[[w.clifford-counsel-to-the-president-2]], 323–24. See [[cal.1960-08-31.elections-1960]]. Names: Clifford, Gore,
