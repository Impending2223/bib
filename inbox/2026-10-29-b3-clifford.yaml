- add:
    entry:
      id: cal.1960-08-20.elections-1960
      when: Aug. 20
      date: '1960-08-20'
      thread: elections-1960
      c: 'Independence. Kennedy with Truman in his office at the Truman Library, forty minutes, Symington left on the steps.
        Truman will campaign for the ticket: "The convention nominated this man, and I am going to support him—and what are
        you going to do about it?"'
      n: '[[w.clifford-counsel-to-the-president-2]], 322 (Ribicoff before it, Kennedy''s emissary; the meeting). See [[cal.1960-07-02.elections-1960]].
        Names: Kennedy, Truman, Symington.'
      tags:
      - name:kennedy-john-f
      - name:truman-harry-s
      - name:symington-william-s
      src:
        c: 59c56022
        rows:
        - 'w.clifford-counsel-to-the-president-2 322: all'
