      date: '1968-05-21'
      thread: vietnam-paris
      c: 'The Tuesday lunch: Rusk, Clifford, Wheeler, Helms, Rostow. Rusk again for bombing up to the 20th parallel. Clifford:
        "With limitations placed on the military, we have no real plans to win the war"; "Hanoi cannot win the war militarily.
        ... That doesn''t mean we have won it." Johnson: "I will put it off again against my judgment."'
      n: '[FRUS 1964–68, VI, doc. 241](https://history.state.gov/historicaldocuments/frus1964-68v06/d241). [[w.clifford-counsel-to-the-president-2]],
        540–41 (Johnson to Clifford: "You''re just carrying me along week-to-week"). Made public: FRUS 1964–68, VI (2002).
        See [[cal.1968-05-14.vietnam]]. Names: Rusk, Clifford, Wheeler, Helms, Rostow, Johnson. Check: Clifford quotes himself
        "But we can''t win the war militarily"; the notes have "That doesn''t mean we have won it."'
      tags:
