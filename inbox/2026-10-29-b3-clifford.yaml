      date: '1968-03-16'
      thread: vietnam-205000
      also:
      - vietnam-congress
      c: 'Nitze to Johnson, by letter, sent on by Clifford: not to testify before Foreign Relations, not being privy to why
        only Option A is considered; other options, a proposal of his, with a stronger strategic reserve.'
      n: '[FRUS 1964–68, VI, doc. 133](https://history.state.gov/historicaldocuments/frus1964-68v06/d133). [[w.clifford-counsel-to-the-president-2]],
