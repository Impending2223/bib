      when: Mid-May
      date: 1968-05
      thread: vietnam
      also:
      - defense-clifford
      c: 'Warnke and Pursley to Clifford, a memorandum, "How Can We Best Achieve Our Objective in South Vietnam": no general
        uprising; Hanoi able to pay the price longer than the American public will exact it; "We should be able to contract
        our activities and still make it clear to the enemy that he cannot win."'
      n: '[[w.clifford-counsel-to-the-president-2]], 539–40. To check: the memorandum, undated, LBJ Library (cited by [[w.clifford-counsel-to-the-president-2]],
        540 n.6). Names: Warnke, Pursley, Clifford.'
