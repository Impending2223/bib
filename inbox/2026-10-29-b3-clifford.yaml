    entry:
      id: cal.1960-08.transition-and-staff-2
      when: August
      date: 1960-08
      thread: transition-and-staff
      c: 'A week after the breakfast, by Clifford''s account. Kennedy to Clifford by telephone: represent him on the Brookings
        Institution''s group on the transition.'
      n: '[[w.clifford-counsel-to-the-president-2]], 319–20. Names: Kennedy, Clifford.'
      tags:
      - name:kennedy-john-f
      - name:clifford-clark
      src:
