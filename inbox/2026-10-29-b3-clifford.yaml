      when: Mar. 13
      date: '1968-03-13'
      thread: vietnam-205000
      c: 'Fortas to Johnson, by letter, forwarded to Clifford: stay tough and firm, not "humble or apologetic"; go as far
        as possible "short of an American invasion of North Vietnam."'
      n: '[[w.clifford-counsel-to-the-president-2]], 502. Names: Fortas, Johnson, Clifford.'
