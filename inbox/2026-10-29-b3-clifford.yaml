      when: Sept. 14
      date: '1968-09-14'
      thread: vietnam-paris
      c: 'Camp David, by Clifford''s account. Clifford to Johnson: stop the bombing to test Hanoi, resume it if Hanoi does
        not answer; Hanoi will talk with Saigon present. Johnson: "You just want to stop the bombing without any concessions
        in return."'
      n: '[[w.clifford-counsel-to-the-president-2]], 570. See [[cal.1968-08-04.vietnam-paris]]. Names: Clifford, Johnson.'
      tags:
