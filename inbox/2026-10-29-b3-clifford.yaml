      when: Oct. 28
      date: '1968-10-28'
      thread: vietnam-paris
      c: 'Johnson with Rusk, Clifford, Wheeler, Helms, Rostow and Taylor. Clifford: "Hanoi chose Sunday as the day to relent
        and accept the GVN at the conference table"; "Only one factor remains—has a deal been made?" Johnson: "A burnt child
        dreads fire"; no decision until Tuesday morning.'
