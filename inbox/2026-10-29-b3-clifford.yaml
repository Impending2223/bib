        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d279: all'
        - 'w.clifford-counsel-to-the-president-2 409: A'
- add:
    entry:
      id: cal.1965-05-08.vietnam
      when: May 8
      date: '1965-05-08'
      thread: vietnam
      c: 'Raborn to Johnson, by letter, McCone''s argument shown to McNamara and Rusk: McNamara''s course of Apr. 21 unlikely
        by itself to gain the objectives; the limited bombing and the ground buildup not likely to bring Hanoi to terms soon.'
      n: '[FRUS 1964–68, II, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v02/d286). Made public: FRUS
        1964–68, II (1996). See [[cal.1965-04-28.vietnam]]. Names: Raborn, Johnson, McCone, McNamara, Rusk.'
