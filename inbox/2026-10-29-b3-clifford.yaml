      when: Aug. 31
      date: '1960-08-31'
      thread: elections-1960
      c: 'Kennedy and Clifford dine alone at Kennedy''s Georgetown house, by Clifford''s account. A group of outside advisers
        on the campaign, to be formed at once: Gore to lead it; Fulbright; Bolling; Dutton its secretary. Its existence to
        stay private.'
      n: '[[w.clifford-counsel-to-the-president-2]], 322–23. See [[cal.1960-07-29.elections-1960]]. Names: Kennedy, Clifford,
        Gore, Fulbright, Bolling, Dutton.'
