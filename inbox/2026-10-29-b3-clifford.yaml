- add:
    entry:
      id: cal.1965-09.vietnam
      when: Mid-September, a Sunday
      date: 1965-09
      thread: vietnam
      also:
      - intelligence
      c: 'After a cruise on the Potomac, the White House, to near midnight, by Clifford''s account. Johnson worried that the
        buildup and the bombing are not working as the military predicted; Clifford on the poor intelligence in the war zone.
        Johnson: "Why don''t you go out there and get a firsthand look?"'
      n: '[[w.clifford-counsel-to-the-president-2]], 426. Names: Johnson, Clifford.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      src:
        c: 22d295b0
        rows:
        - 'w.clifford-counsel-to-the-president-2 426: all'
- add:
    entry:
      id: cal.1965-10-26.vietnam-3
      when: Oct. 26–30
      date: '1965-10-26'
      thread: vietnam
      also:
      - intelligence
      c: 'Saigon. Clifford, for the Foreign Intelligence Advisory Board, at Lodge''s residence, Kissinger a guest there, by
        Clifford''s account. Westmoreland: the enemy''s losses soon past replacing; more authority in theater, B-52 targets
        among it. Bien Hoa and Vung Tau by helicopter. Clifford''s "action items" on intelligence approved by Johnson on his
        return.'
      n: '[[w.clifford-counsel-to-the-president-2]], 426–29. See [[cal.1965-09.vietnam]]. Names: Clifford, Lodge, Kissinger,
        Westmoreland, Johnson.'
      tags:
      - name:clifford-clark
      - name:lodge-henry-cabot
      - name:kissinger-henry-a
      - name:westmoreland-william
      - name:johnson-lyndon-b
      - place:saigon
      - place:bien-hoa
      - place:vung-tau
      src:
        c: b9c1f355
        rows:
        - 'w.clifford-counsel-to-the-president-2 426–29: all'
- add:
    entry:
      id: cal.1965-11-02.vietnam
      when: Nov. 2
      date: '1965-11-02'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'The *Washington Post*, Foisie from Saigon: Kissinger''s and Clifford''s findings, "an almost total lack of political
        maturity or unselfish political motivation" among South Vietnam''s leaders. Moyers to Clifford: the President "off
        the wall."'
      n: '[[w.clifford-counsel-to-the-president-2]], 429. See [[cal.1965-10-26.vietnam-3]]. Names: Kissinger, Clifford, Moyers.
        Check: Foisie later named Kissinger the source (Clifford, 432).'
      tags:
      - name:kissinger-henry-a
      - name:clifford-clark
      - name:moyers-bill
      src:
        c: 98b0b7af
        rows:
        - 'w.clifford-counsel-to-the-president-2 429: all'
- add:
    entry:
      id: cal.1965-11-03.vietnam-3
      when: Nov. 3
      date: '1965-11-03'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Moyers to the press on Foisie''s story: "Those views are not Mr. Clifford''s views. Whatever Professor Kissinger''s
        views are, his views are not those of the government''s." Clifford''s trip not made at the President''s request.'
      n: '[[w.clifford-counsel-to-the-president-2]], 430. See [[cal.1965-11-02.vietnam]]. Names: Moyers, Clifford, Kissinger.
        Check: the day, from Clifford''s "the next day"; Clifford calls the last statement untrue.'
      tags:
      - name:moyers-bill
      - name:clifford-clark
      - name:kissinger-henry-a
      src:
        c: 865a5954
        rows:
        - 'w.clifford-counsel-to-the-president-2 430: all'
- add:
    entry:
      id: cal.1965-11-04.vietnam
      when: Nov. 4
      date: '1965-11-04'
      thread: vietnam
      c: 'Clifford to Johnson, by letter, drafted with Moyers: a flat denial of Foisie''s article "insofar as the references
        to me are concerned." Released by the White House Nov. 6.'
      n: '[[w.clifford-counsel-to-the-president-2]], 430. See [[cal.1965-11-02.vietnam]]. Names: Clifford, Johnson, Moyers.'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
      - name:moyers-bill
      src:
        c: ae1c2e22
        rows:
        - 'w.clifford-counsel-to-the-president-2 430: all'
- add:
    entry:
      id: cal.1965-11-11.vietnam
      when: Nov. 11
      date: '1965-11-11'
      thread: vietnam
      c: 'The Ranch, by Clifford''s account. Johnson berates Clifford over Foisie''s article; Clifford: "I deeply resent your
        questioning my word." Then Clifford''s report: the buildup and the bombing have prevented defeat; North Vietnam''s
        counterescalation not cut off; the Viet Cong not to be beaten by elimination.'
      n: '[[w.clifford-counsel-to-the-president-2]], 430–31, 433. See [[cal.1965-10-26.vietnam-3]]. Names: Johnson, Clifford.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      src:
        c: 6f56c0e2
        rows:
        - 'w.clifford-counsel-to-the-president-2 430–31: A-B'
        - 'w.clifford-counsel-to-the-president-2 433: C-D'
- add:
    entry:
      id: cal.1966-11.transition-and-staff
      when: November
      date: 1966-11
      thread: transition-and-staff
      also:
      - court
      c: 'Bethesda Naval Hospital, after Johnson''s operations, by Clifford''s account. Johnson to Clifford: "I want you to
        become my Attorney General." Lady Bird Johnson presses him the next day; the day after, Clifford refuses. Johnson,
        unable to speak, on his pad: "Who should I select as A.G.?"; if Ramsey Clark, "Tom resigns and Thurgood is up."'
      n: '[[w.clifford-counsel-to-the-president-2]], 444–45. See [[cal.1966-11-16.succession]]. Names: Johnson, Clifford,
        Lady Bird Johnson, Ramsey Clark, Tom Clark, Marshall.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:johnson-lady-bird
      - name:clark-ramsey
      - name:clark-tom-c
      - name:marshall-thurgood
      src:
        c: ff4cb2b5
        rows:
        - 'w.clifford-counsel-to-the-president-2 444–45: all'
- add:
    entry:
      id: cal.1967-07-18.middle-east
      when: July 18
      date: '1967-07-18'
      thread: middle-east
      also:
      - intelligence
      c: 'Clifford, for the Foreign Intelligence Advisory Board, to Rostow, on the attack on the *Liberty*: in international
        waters, identified as American five hours before; that she could be taken for the Egyptian *El Quesir* "unbelievable";
        no evidence the Israeli high command knew her for American; "a flagrant act of gross negligence for which the Israeli
        Government should be held completely responsible, and the Israeli military personnel involved should be punished."'
      n: '[FRUS 1964–68, XIX, doc. 373](https://history.state.gov/historicaldocuments/frus1964-68v19/d373). [[w.clifford-counsel-to-the-president-2]],
        446–47 (the inquiry, a month, on the record gathered for the naval court at Malta; the findings). Made public: FRUS
        1964–68, XIX (2004). See [[cal.1967-06-08.middle-east]]. Names: Clifford, Rostow.'
      tags:
      - name:clifford-clark
      - name:rostow-walt-w
      src:
        c: 5307e08d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v19/d373: all'
        - 'w.clifford-counsel-to-the-president-2 446–47: A'
- add:
    entry:
      id: cal.1967-12.transition-and-staff
      when: December, before Christmas
      date: 1967-12
      thread: transition-and-staff
      c: 'Johnson asks Clifford to look privately into the charges, repeated by Thurmond, that Rostow was denied a clearance
        under Eisenhower, by Clifford''s account. Clifford, from the files: "Walt W. Rostow is now, and always has been, a
        loyal, dedicated citizen of this country."'
      n: '[[w.clifford-counsel-to-the-president-2]], 462. Names: Johnson, Clifford, Thurmond, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:thurmond-strom
      - name:rostow-walt-w
