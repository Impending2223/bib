        rows:
        - 'w.clifford-counsel-to-the-president-2 376–77: all'
- add:
    entry:
      id: cal.1962-09-28.missile-crisis
      when: Sept. 28
      date: '1962-09-28'
      thread: missile-crisis
      also:
      - intelligence
      c: 'McCone to the President''s Foreign Intelligence Advisory Board on Cuba, by Clifford''s account: the photography
        of Aug. 29, surface-to-air missile sites and a cruise missile on its pad, no offensive missiles; his own view, not
        his officers'', that medium-range missiles will follow once the sites deny the U-2s the island.'
      n: '[[w.clifford-counsel-to-the-president-2]], 357. Names: McCone, Clifford.'
      tags:
      - name:mccone-john-a
      - name:clifford-clark
      src:
        c: f70008f3
        rows:
        - 'w.clifford-counsel-to-the-president-2 357: all'
