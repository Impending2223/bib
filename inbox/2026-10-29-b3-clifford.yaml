      when: May 8
      date: '1968-05-08'
      thread: vietnam-paris
      c: 'Johnson with the negotiating team, 6 to 7 p.m.: Rusk, Clifford, William Bundy, Harriman, Vance, Taylor, Habib among
        them. Rusk: the issues the "no advantage" clause, the cessation of bombing, reconnaissance, the political issues.
        Clifford against bombing between the 19th and 20th parallels on the eve of the talks; Johnson with him, by Clifford''s
        account.'
      n: '[FRUS 1964–68, VI, doc. 227](https://history.state.gov/historicaldocuments/frus1964-68v06/d227). [[w.clifford-counsel-to-the-president-2]],
        538 (the four objectives; the dispute on the bombing). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-03.vietnam]].
        Names: Johnson, Rusk, Clifford, William Bundy, Harriman, Vance, Taylor, Habib.'
