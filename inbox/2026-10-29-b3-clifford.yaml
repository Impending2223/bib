      date: '1968-10-21'
      thread: vietnam-paris
      c: 'Bunker, Saigon 40788: Foreign Minister Trần Chánh Thành''s memorandum, on Thiệu''s instructions: the NLF "a tool
        of Hanoi"; Saigon will join no conference where the NLF sits "as a distinct entity from North Vietnam."'
      n: '[FRUS 1964–68, VII, doc. 96](https://history.state.gov/historicaldocuments/frus1964-68v07/d96). [[w.clifford-counsel-to-the-president-2]],
        578 (the NLF only within Hanoi''s delegation). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-10-14.vietnam]].
        Names: Bunker, Trần Chánh Thành, Nguyễn Văn Thiệu. Check: Clifford has Thiệu put it to Bunker himself.'
      tags:
