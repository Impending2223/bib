      id: cal.1960-12.robert-kennedy
      when: December
      date: 1960-12
      thread: robert-kennedy
      also:
      - transition-and-staff-cabinet
      c: 'After the meeting with Lovett, by Clifford''s account. The President-elect to Clifford by telephone: Lovett at Defense
        for a year, Robert Kennedy his deputy and successor? Or Gates kept a year so? Clifford against both; Robert Kennedy
        at one of the services, then Defense, dropped.'
      n: '[[w.clifford-counsel-to-the-president-2]], 338. See [[cal.1960-11-20.robert-kennedy]]. Names: John F. Kennedy, Clifford,
        Lovett, Robert Kennedy, Gates. Check: the day, after Dec. 1.'
