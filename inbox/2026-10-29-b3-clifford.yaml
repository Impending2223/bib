- add:
    entry:
      id: cal.1968-02-13.vietnam-205000
      when: Feb. 13
      date: '1968-02-13'
      thread: vietnam-205000
      c: 'Hoopes, Under Secretary of the Air Force, to Clifford, a personal letter: "the idea of a US military victory in
        Vietnam is a dangerous illusion"; the flow from the North "definitely increased" since 1965; stop the bombing to begin
        de-escalation; why fight "in the worst possible terrain for American forces, at the time of the enemy''s choosing"?'
      n: '[[w.clifford-counsel-to-the-president-2]], 478–79. To check: [[w.hoopes-limits-of-intervention]]. Names: Hoopes,
        Clifford.'
      tags:
      - name:hoopes-townsend-w
      - name:clifford-clark
      src:
        c: 07e4ef89
        rows:
        - 'w.clifford-counsel-to-the-president-2 478–79: all'
- add:
    entry:
      id: cal.1968-02-13.vietnam-205000-2
      when: Feb. 13
      date: '1968-02-13'
      thread: vietnam-205000
      also:
      - vietnam-tet
      c: 'The lunch, 1:12 to 2:30 p.m.: Johnson, Rusk, McNamara, Helms, Wheeler, Clifford, Rostow. Wheeler: the enemy around
        Khe Sanh "had the hell knocked out of them." Johnson''s questions on extending tours and calling reserves.'
      n: '[FRUS 1964–68, VI, doc. 74](https://history.state.gov/historicaldocuments/frus1964-68v06/d74). [[w.clifford-counsel-to-the-president-2]],
        479 (Johnson inclined to send more troops and call reserves; Wheeler to go to Vietnam first). Made public: FRUS 1964–68,
        VI (2002). See [[cal.1968-02-12.vietnam-tet]]. Names: Johnson, Rusk, McNamara, Helms, Wheeler, Clifford, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:helms-richard
      - name:wheeler-earle
      - name:clifford-clark
      - name:rostow-walt-w
      src:
        c: '06702365'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d74: all'
        - 'w.clifford-counsel-to-the-president-2 479: C'
- add:
    entry:
