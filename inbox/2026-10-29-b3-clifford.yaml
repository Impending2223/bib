      when: Late November
      date: 1960-11
      thread: robert-kennedy
      also:
      - transition-and-staff-cabinet
      c: 'New York, by Clifford''s account. Clifford to Joseph Kennedy, for the President-elect: Robert Kennedy not to be
        Attorney General; start him elsewhere, second at Defense. Joseph Kennedy: "Bobby is going to be Attorney General."'
      n: '[[w.clifford-counsel-to-the-president-2]], 336–37. See [[cal.1960-11-20.robert-kennedy]]. Names: Clifford, Joseph
        Kennedy, Robert Kennedy.'
      tags:
      - name:clifford-clark
      - name:kennedy-joseph-p
