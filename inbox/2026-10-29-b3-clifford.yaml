      when: Mar. 2
      date: '1968-03-02'
      thread: vietnam-205000
      also:
      - defense-clifford
      c: 'The Clifford task force''s first meeting, on a draft memorandum from Gelb''s staff in International Security Affairs:
        more troops alone will not gain the objectives; the enemy will match them; "total Americanization." Clifford''s questions
        to the military: will 205,000 do it? No assurance.'
      n: '[FRUS 1964–68, VI, doc. 100](https://history.state.gov/historicaldocuments/frus1964-68v06/d100) (the editorial note).
        [[w.clifford-counsel-to-the-president-2]], 493–94 (Clifford''s questions, by his account; no record of them). See
        [[cal.1968-02-28.vietnam-205000]]. Names: Clifford, Gelb.'
      tags:
      - name:clifford-clark
      - name:gelb-leslie-h
      src:
        c: dd334894
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d100: A-B'
        - 'w.clifford-counsel-to-the-president-2 493–94: C-D'
