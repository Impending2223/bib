      when: Apr. 2
      date: '1965-04-02'
      thread: intelligence
      also:
      - vietnam
      c: 'Clifford with Johnson on McCone''s successor, by Clifford''s account: Clifford for Helms. Johnson asks him to follow
        Vietnam more closely; Coyne, the board''s executive, his channel.'
      n: '[[w.clifford-counsel-to-the-president-2]], 409. See [[cal.1965-04-28.transition-and-staff]]. Names: Clifford, Johnson,
