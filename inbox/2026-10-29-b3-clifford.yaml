      date: '1968-02-10'
      thread: vietnam-tet
      also:
      - vietnam-205000
      c: 'Johnson with the Senior Foreign Affairs Advisory Council, 3:17 to 5:15 p.m. McNamara: hold Khe Sanh and reinforce
        it. Clifford: no new program now; the military call it a victory, then ask for 120,000 more men; "Giap may want to
        keep Westmoreland and 20,000 troops tied down up north."'
      n: '[FRUS 1964–68, VI, doc. 65](https://history.state.gov/historicaldocuments/frus1964-68v06/d65). [[w.clifford-counsel-to-the-president-2]],
        477 (Clifford''s words; McNamara''s plan to get Westmoreland his men without the call-up the Chiefs ask). Made public:
        FRUS 1964–68, VI (2002). See [[cal.1968-02-09.vietnam-tet]]. Names: Johnson, McNamara, Clifford, Võ Nguyên Giáp, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
