      when: Mid-September
      date: 1960-09
      thread: elections-1960
      also:
      - defense
      c: Kennedy asks Symington to head a Committee on the Defense Establishment, by Clifford's account; Clifford on it. It
        meets in Washington and New York several times.
      n: '[[w.clifford-counsel-to-the-president-2]], 324, 330. Names: Kennedy, Symington, Clifford.'
