      when: Sept. 30–Oct. 1
      date: '1960-09-30'
      thread: elections-1960
      c: 'Hyannis Port. Kennedy''s longest strategy meeting between the convention and the election, five hours, by Clifford''s
        account: Joseph Kennedy, Harris, Salinger, Sorensen, O''Donnell, O''Brien, Clifford.'
      n: '[[w.clifford-counsel-to-the-president-2]], 324. Names: John F. Kennedy, Joseph Kennedy, Harris, Salinger, Sorensen,
        O''Donnell, O''Brien, Clifford. Check: Clifford gives his two days there from Sept. 30, not the meeting''s day.'
