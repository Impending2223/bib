      when: Jan. 24
      date: '1961-01-24'
      thread: testing
      c: 'Kennedy, with Rusk and McCloy, to Clifford by telephone, by Clifford''s account: be chief disarmament negotiator
        with the Soviet Union, to be announced at the next day''s press conference. Clifford declines the next day.'
      n: '[[w.clifford-counsel-to-the-president-2]], 348. Names: Kennedy, Rusk, McCloy, Clifford.'
