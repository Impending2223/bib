      date: '1968-11-18'
      thread: vietnam-paris
      c: 'Clifford with Johnson at a private lunch, by Clifford''s account: a letter to Thiệu, talks with the Communists within
        a week, with or without Saigon. Rusk, consulted, against: Bunker to keep the final word.'
      n: '[[w.clifford-counsel-to-the-president-2]], 601. See [[cal.1968-11-12.vietnam]]. Names: Clifford, Johnson, Nguyễn
