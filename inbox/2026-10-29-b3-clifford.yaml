      when: September
      date: 1961-09
      thread: elections-1962
      c: The Oval Office, by Clifford's account. The President and Robert Kennedy ask Clifford's judgment of Edward Kennedy's
        withdrawal from Harvard in 1951 for cheating on a Spanish examination, and its effect on a race for the Senate in
        1962.
      n: '[[w.clifford-counsel-to-the-president-2]], 368–69. Names: John F. Kennedy, Robert Kennedy, Clifford, Edward Kennedy.'
