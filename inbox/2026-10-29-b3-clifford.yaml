      when: Jan. 28
      date: '1965-01-28'
      thread: transition-and-staff
      c: 'The family quarters, at lunch, by Clifford''s account: Johnson and Fortas press Clifford to be Attorney General;
        he refuses. Johnson then settles on Katzenbach.'
      n: '[[w.clifford-counsel-to-the-president-2]], 439–40. Names: Johnson, Fortas, Clifford, Katzenbach. Check: Clifford
