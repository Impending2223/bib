      when: Aug. 5
      date: '1960-08-05'
      thread: transition-and-staff
      c: 'Clifford to Kennedy, a memorandum: "It is almost impossible to avoid being inundated by yes men in the White House";
        a cabinet member''s case to come in writing, a staff member to argue the other side.'
      n: '[[w.clifford-counsel-to-the-president-2]], 329. Names: Clifford, Kennedy.'
      tags:
      - name:clifford-clark
      - name:kennedy-john-f
      src:
        c: 83d9b026
        rows:
