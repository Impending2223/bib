      when: Nov. 22
      date: '1963-11-22'
      thread: intelligence
      c: 'The Foreign Intelligence Advisory Board, Clifford in the chair, the morning, by Clifford''s account: McCone blames
        the CIA''s image on hostile journalists, Reston among them. Adjourned 1:30 p.m.; after the news from Dallas Clifford
        ends the session; its recommendations for an overhaul, asked by Kennedy, not to go to the new President.'
      n: '[[w.clifford-counsel-to-the-president-2]], 378–79. Names: Clifford, McCone, Reston, Kennedy.'
