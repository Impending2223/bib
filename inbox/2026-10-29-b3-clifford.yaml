      c: 'Johnson hears DePuy and Carver, who briefed the Senior Advisory Group, Abrams, Helms and Wheeler there. DePuy: 42,000
        of the attack force of 85,000 killed. Johnson: "Everybody is recommending surrender."'
      n: '[FRUS 1964–68, VI, doc. 162](https://history.state.gov/historicaldocuments/frus1964-68v06/d162). [[w.clifford-counsel-to-the-president-2]],
