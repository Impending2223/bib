      when: Sept. 25
      date: '1968-09-25'
      thread: vietnam-paris
      also:
      - elections-1968
      c: 'The 591st meeting of the National Security Council. Clifford: the presence of Saigon at the table an absolute condition,
        the shelling of cities "a serious matter"; "This would be a test." By Clifford''s account, Ball: "I want to associate
        myself fully with Clark Clifford"; Rusk: "If we stop the bombing with no conditions, many Democrats would vote for
        Nixon." Johnson: "A burned child dreads a fire."'
      n: '[FRUS 1964–68, VII, doc. 35](https://history.state.gov/historicaldocuments/frus1964-68v07/d35). [[w.clifford-counsel-to-the-president-2]],
        571–72. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-24.elections-1968]]. Names: Clifford, Ball, Rusk,
        Nixon, Johnson. Check: Clifford quotes Bromley Smith''s notes (his n.2); the editors print the meeting from other
        notes, where Ball''s and Rusk''s words are not.'
      tags:
      - name:clifford-clark
      - name:ball-george-w
      - name:rusk-dean
      - name:nixon-richard-m
      - name:johnson-lyndon-b
