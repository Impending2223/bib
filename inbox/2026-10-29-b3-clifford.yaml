      when: Oct. 1
      date: '1968-10-01'
      thread: elections-1968
      c: 'Johnson to Clifford on Humphrey''s speech at Salt Lake City, by Clifford''s account: "But he says he would stop
        the bombing without conditions." Clifford: we can live with it; the bombing halt tied to what follows, resumption
        reserved; do not attack the Vice President.'
      n: '[[w.clifford-counsel-to-the-president-2]], 572. See [[cal.1968-09-30.elections-1968]]. Names: Johnson, Clifford,
