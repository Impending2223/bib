    entry:
      id: cal.1965-07-22.vietnam-july-decision-2
      when: July 22
      date: '1965-07-22'
      thread: vietnam-july-decision
      c: 'After the meetings, by Clifford''s account. Ball with Clifford in the Roosevelt Room: his memoranda against each
        stage of escalation to go to Clifford. Then Johnson and McGeorge Bundy with Clifford in the anteroom; Clifford: "I
        am bearish about this whole exercise"; can a victory be won, and what do we have if we win?'
      n: '[[w.clifford-counsel-to-the-president-2]], 415–16. See [[cal.1965-07-21.vietnam]]. Names: Ball, Clifford, Johnson,
        McGeorge Bundy.'
