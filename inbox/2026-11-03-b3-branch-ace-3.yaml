      - black-nationalism
      c: 'The New York Times: "Crisis and Commitment," an advertisement by Wilkins, Whitney Young, Randolph, Height, Rustin
        and others for "racial justice by democratic process," against "strategies of violence, reprisal or vigilantism."
        King, leaked Oct. 10 as weighing it, does not sign; at his Atlanta press conference he says he could support it. Oct.
        15: "King Endorses Racial Statement."'
      n: '[[w.branch-at-canaans-edge]], 538–40. To check: Bayard Rustin reading a draft letter, from the wiretap transcript
        of a conference call with MLK, Stanley Levison, Harry Wachtel, Ralph Hellstein, Clarence Jones, Cleveland Robinson,
        Lawrence Reddick, and Walter [Fauntroy?], 11:45 p.m., Sept. 6, 1966, FLNY9-1054a (cited by [[w.branch-at-canaans-edge]],
        538); Freeman, *The Mule Train* (1998), 456 (cited by [[w.branch-at-canaans-edge]], 538); White House memo, Clifford
        Alexander to Harry McPherson ("Bayard Rustin called today ..."), Oct. 3, 1966, MLK Name File, Box 144, LBJ (cited
        by [[w.branch-at-canaans-edge]], 538); New York Times, Oct. 14, 1966, p. 27 (cited by [[w.branch-at-canaans-edge]],
        538); [[w.garrow-bearing-the-cross]], 532–33 (cited by [[w.branch-at-canaans-edge]], 538); D''Emilio, Lost Prophet,
        (cited by [[w.branch-at-canaans-edge]], 538); New York Times, Oct. 10, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]],
        539); New York Times, Oct. 14, 1966, p. 35 (cited by [[w.branch-at-canaans-edge]], 539); [[w.garrow-bearing-the-cross]],
        533 (cited by [[w.branch-at-canaans-edge]], 539); MLK, "Nonviolence: The Only Road to Freedom," Ebony, Oct. 1966,
        cited in Washington, ed., Testament, pp. 54-61 (cited by [[w.branch-at-canaans-edge]], 539); New York Times, Oct.
        15, 1966, p. 14 (cited by [[w.branch-at-canaans-edge]], 539). Names: Wilkins, Whitney Young, Randolph, Rustin, King.'
