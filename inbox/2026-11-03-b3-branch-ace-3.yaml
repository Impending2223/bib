      c: 'Miami, the Sheraton–Four Ambassadors. SCLC''s Ministers Leadership Training Program, some 150 ministers, on the
        Ford Foundation''s grant. King, Feb. 19: "the rising expectations for freedom and democracy have not been met"; kept
        from two days of it by threats. Bevel, Moynihan, Vivian. Feb. 23, King: "the valley calls us."'
      n: '[[w.branch-at-canaans-edge]], 696–97, 701–2. To check: MLK remarks to the Ministers Leadership Training Program,
        Feb. 19, 1968, A/SC28f51 (cited by [[w.branch-at-canaans-edge]], 696); Miami LHM dated Feb. 23, 1968, "RE: Washington
        Spring Project," FSC-NR (cited by [[w.branch-at-canaans-edge]], 697); [[w.mcknight-last-crusade]], 69 (cited by [[w.branch-at-canaans-edge]],
        697); Samuel B. (Billy) Kyles oral history, June 12, 1968, MVC (cited by [[w.branch-at-canaans-edge]], 697, 702);
        [[w.garrow-bearing-the-cross]], 598 (cited by [[w.branch-at-canaans-edge]], 697); [[w.fairclough-to-redeem-the-soul]],
        366–67 (cited by [[w.branch-at-canaans-edge]], 697); Bryant George, "Report to the Ford Foundation," Feb. 25, 1968,
        p. 3, Grant 67-580, FFA. The FBI sent the White House and major government agencies sketchy intelligence on Bevel''s
        controversial rhetoric in Miami: "Concerning religion, Reverend Bevel advised he did not believe in the virgin birth
        of Christ. He advised he was firmly convinced that ''Mary'' was raped by a Roman soldier." G. C. Moore to W. C. Sullivan,
        Feb. 26, 1968, FK-3227 (cited by [[w.branch-at-canaans-edge]], 701); Bryant George, “Report to the Ford Foundation,”
        Feb. 25, 1968, p. 3, Grant 67-580, FFA. The FBI sent the White House and major government agencies sketchy intelligence
        on Bevel’s controversial rhetoric in Miami: “Concerning religion, Reverend Bevel advised he did not believe in the
        virgin birth of Christ. He advised he was firmly convinced that ‘Mary’ was raped by a Roman soldier.” G. C. Moore
