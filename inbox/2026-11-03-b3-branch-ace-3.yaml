        1968, Grant 67-580, FFA (cited by [[w.branch-at-canaans-edge]], 701); Int. Marion Bascom, Jan. 19, 1995 (Branch) (cited
        by [[w.branch-at-canaans-edge]], 701); Address by C. T. Vivian, "Creative New Ministries," Feb. 22, 1968, transcript
