      thread: civil-rights-organizations
      also:
      - king
      c: 'SNCC, by telegram, to King, after his plea with Wilkins, Randolph and Whitney Young to suspend picket lines during
        the White House wedding: "You have displayed more backbone in defending Luci than you have shown for the colored people
        of Vietnam being napalmed by Luci''s father."'
      n: '[[w.branch-at-canaans-edge]], 533. To check: SNCC telegram to MLK, Aug. 3, 1966, answering a telegram of the same
        date to Carmichael from Roy Wilkins, A. Philip Randolph, Whitney Young, and [approved by telephone] MLK, A/KP23f18
        (cited by [[w.branch-at-canaans-edge]], 533); "Negroes Assail S.N.C.C. Protest," NYT, Aug. 5, 1966, p. 11 (cited by
        [[w.branch-at-canaans-edge]], 533). Names: King, Wilkins, Randolph, Whitney Young.'
      tags:
      - name:king-martin-luther-jr
      - name:wilkins-roy
      - name:randolph-a-philip
      - name:young-whitney-m-jr
      src:
