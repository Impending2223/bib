      when: Sept. 13
      date: '1966-09-13'
      thread: alabama
      c: 'Hayneville. Father Richard Morrisroe, flown in by Attorney General Flowers, testifies to the Lowndes County grand
        jury on the shooting of Daniels and himself and shows the scars on his back, shot from behind. A grand juror: "Did
        you kiss that nigger girl in the mouth?"'
      n: '[[w.branch-at-canaans-edge]], 534. To check: Chicago Daily News, Sept. 13, 1966, in file #940, RS, CHS (cited by
        [[w.branch-at-canaans-edge]], 534). Names: Flowers.'
