- add:
    entry:
      id: cal.1967-03-06.king
      when: Mar. 6
      date: '1967-03-06'
      thread: king
      also:
      - war-opposition
      c: 'New York, Wachtel''s office. King''s advisers all against his joining the April 15 march: Rustin, it would end cooperation
        with Johnson; Levison, a "squabbling pacifist, socialist, hippie collection." King: cowardly to shun a just cause
        for fear of isolation; he will decide in a few days.'
      n: '[[w.branch-at-canaans-edge]], 584. To check: [[w.garrow-bearing-the-cross]], 546–47 (cited by [[w.branch-at-canaans-edge]],
        584); wiretap transcript of telephone conversation between Stanley Levison and an unidentified party, March 6, 1967,
        FLNY-9-1235a (cited by [[w.branch-at-canaans-edge]], 584); Int. Harry Wachtel, Nov. 29, 1983 (Branch) (cited by [[w.branch-at-canaans-edge]],
        584); Int. Andrew Young, Oct. 26, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 584); Wiretap transcript of
        telephone conversation between Stanley Levison and Rachel |?], March 1, 1967, FLNY-9-1230a (cited by [[w.branch-at-canaans-edge]],
        584); [[w.garrow-bearing-the-cross]], 547 (cited by [[w.branch-at-canaans-edge]], 584); Drew Pearson, "RFK Aide Linked
        to King Fund Raising," WP, April 26, 1967, p. B-15 (cited by [[w.branch-at-canaans-edge]], 584); int. Harry Wachtel,
        Noy. 29, 1983 (cited by [[w.branch-at-canaans-edge]], 584); Int. William vanden Heuvel, Aug. 2, 2004 (Branch) (cited
        by [[w.branch-at-canaans-edge]], 584); MLK to "Mr. and Mrs. Carter Burton [sic]," MLK to William and Jean vanden Heuvel,
        Andrew Young to William and Jean vanden Heuvel, all dated March 10, 1967, A/SC38f19 (cited by [[w.branch-at-canaans-edge]],
        584); wiretap transcript of telephone conversation between MLK and Stanley Levison, 11:59 p.m., March 7, 1967, FLNY-9-1236a.
        The fund-raiser took place at the apartment ofCarter and Amanda Burden. King told Levison that he had been introduced
        by historian Arthur Schlesinger, Jr., and that the event had raised $50,000 for SCLC''s tax-exempt American Foundation
        on Nonviolence. Levison advised King to be careful of one $15,000 pledge until its donor could be vouched for by Africa
        specialist George Hauser, warning that industrialist Charles Englehard had extensive holdings in South Africa and
        "could be using us to take some of the curse off him." (cited by [[w.branch-at-canaans-edge]], 584). Names: King,
        Rustin, Levison.'
      tags:
