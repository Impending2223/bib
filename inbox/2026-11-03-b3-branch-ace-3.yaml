        532 (cited by [[w.branch-at-canaans-edge]], 536); MLK press statement in Chicago, Sept. 30, 1966, A/KS. Be BACKLASH
        (cited by [[w.branch-at-canaans-edge]], 536). Names: King, Levison, Whitney Young.'
