- add:
    entry:
      id: cal.1967-01-10.intelligence
      when: Jan. 10
      date: '1967-01-10'
      thread: intelligence
      also:
      - robert-kennedy
      - king
      c: 'Hoover on the Hill as the 90th Congress meets. To House supporters, by his aide''s notes: "many other documents
        proving Bobby was lying"; no court-approved surveillance, judges "untrustworthy." To the Senate Judiciary''s Subcommittee
        on Administrative Practice, "FBI Use of Electronic Listening Devices": "None of this misinformation has emanated from
        the FBI"; Robert Kennedy signed the order on King.'
      n: '[[w.branch-at-canaans-edge]], 570–71. To check: Jones to Wick, Jan. 10, 1967, FACP-NR (cited by [[w.branch-at-canaans-edge]],
        570); Hoover statement, "FBI Use of Electronic Listening Devices," Jan. 10, 1967, before the Subcommittee on Administrative
        Practice and Procedure, Committee of the Judiciary, U.S. Senate, Section 129, FHOC (emphasis in original) (cited by
        [[w.branch-at-canaans-edge]], 570); Hoover statement, “FBI Use of Electronic Listening Devices,” Jan. 10, 1967, before
        the Subcommittee on Administrative Practice and Procedure, Committee of the Judiciary, U.S. Senate, Section 129, FHOC
        (emphasis in original) (cited by [[w.branch-at-canaans-edge]], 570); Brownell to Hoover, May 20, 1954, reprinted in
        Macy and Kaplan, Documents, pp. 41-43. See also Belmont to Boardman, May 21, 1954 (Section 114, FHOC), which announces
        the FBI''s practical interpretation of the memo: "the Attorney General is giving us the go ahead on microphones whether
        or not there is trespass at the same time suggesting that discretion be used in certain AeA se William Manchester
        scarcely mentioned: Manchester, Death, p. 631 (cited by [[w.branch-at-canaans-edge]], 570). Names: Hoover, Robert
        Kennedy, King.'
      tags:
      - name:hoover-j-edgar
      - name:kennedy-robert-f
      - name:king-martin-luther-jr
      src:
        c: 090c29d0
        rows:
        - 'w.branch-at-canaans-edge 570–71: all'
