        attractive political home ... We are indeed closer to the Party of Jefferson than is the Democratic Party today,"
        on a "sound foundation for Republicanism not based on racism."'
      n: '[[w.kabaservice-rule-and-ruin]], 140–41. To check: Thruston B. Morton, remarks to the Republican National Committee,
        Jan. 22, 1965, Rogers C. B. Morton Papers, University of Kentucky, 97 (cited by [[w.kabaservice-rule-and-ruin]], 141
        n.94). See [[cal.1965-01-22.republican-party]]. Names: Morton.'
