        Talk 1968," *Ripon Forum* 3:8 (August 1967), 11 (cited by [[w.kabaservice-rule-and-ruin]], 208 n.63, 211 n.81). Names:
        Reagan, McCall, Romney, Agnew, Rockefeller.'
