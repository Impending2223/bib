      c: 'Miami Beach. Thurmond and the Southern delegations hold for Nixon (Check). Nixon nominated on the first ballot,
        early Aug. 8: 692 votes, 667 needed; Rockefeller 277, Reagan 182, Rhodes 55, Romney 50. After the roll, the delegations
        change: Nixon 1,238. On Reagan''s motion, made unanimous by voice vote. Bergen County''s delegates break from New
        Jersey''s favorite son, Case, for Nixon: by Auspitz''s account, of the Ripon members in Rockefeller''s delegate count,
        the turn.'
      n: '[*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968)
        (1968), the fourth session, Aug. 7, the roll call [368–379](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/368/mode/1up),
        the changes and the final tabulation [379–389](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/379/mode/1up).
        [[w.nixon-rn]], 309–11 (Thurmond and Tower holding the South; the first ballot, 692, 25 more than needed; Reagan''s
        motion). [[w.kabaservice-rule-and-ruin]], 242–43 (the Southern delegations; Bergen County). To check: [[w.witcover-resurrection-of-richard-nixon]];
        [[w.perlstein-nixonland-2008]]; [[w.nelson-resilient-america]]; F. Clifton White with Jerome Tuccille, *Politics as
        a Noble Calling* (1994), 177 (cited by [[w.kabaservice-rule-and-ruin]], 242 n.83). See [[cal.1968-08-05.elections-1968]].
        Names: Thurmond, Nixon, Rockefeller, Reagan, Rhodes, Romney, Case.'
