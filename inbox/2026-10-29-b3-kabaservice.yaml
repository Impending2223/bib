      when: Dec. 15
      date: '1968-12-15'
      thread: republican-party
      c: 'New York, the Plaza Hotel. The Ripon Society''s sixth anniversary dinner, more than 400 guests; its hosts Kissinger,
        Irwin Miller, David Rockefeller, Scranton, Thayer, Wallich and Whitney; Rusher among the guests. Lindsay: the Society
        seeks "to apply Republican principles to the most urgent national dilemmas," against "the danger of confining our
        party''s base to the privileged and secure"; a salute to "the dissidents—the ''radicals'' if you will"; under Nixon
        an "era of greatness" may be at hand.'
      n: '[[w.kabaservice-rule-and-ruin]], 250–51. To check: William A. Rusher, notes on the Ripon Society dinner, Dec. 15,
        1968, William A. Rusher Papers, Library of Congress, 169:14 (cited by [[w.kabaservice-rule-and-ruin]], 250 n.121);
        John V. Lindsay, "An Era of Greatness?," *Ripon Forum* 5:1 (January 1969), 22–24 (cited by [[w.kabaservice-rule-and-ruin]],
        251 n.122). Names: Kissinger, Miller, David Rockefeller, Scranton, Wallich, Whitney, Rusher, Lindsay, Nixon.'
