      c: 'The *Ripon Forum* on the Kerner report, two reviews. Gordon: its aim a consensus for spending on the cities by making
        whites face their racism; whites will resent the label; white hatred not the cause of Negro poverty, nor the riots
        political protest. Marans and Wallison: it champions "many of the GOP''s most progressive ideas," private alternatives
        to welfare, the States'' and localities'' part, a federal job corporation, tax credits for hiring the hard-core unemployed;
        Javits, Percy, Rockefeller and Cowger, head of the House Republican Conference''s new Urban Affairs Task Force, for
        its proposals.'
