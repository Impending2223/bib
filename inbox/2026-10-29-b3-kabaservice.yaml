        Caucus," *Washington Post*, Nov. 20, 1964, A17 (cited by [[w.kabaservice-rule-and-ruin]], 131 n.46). See [[cal.1965-01-04.congress-2]].
        Names: Curtis, Rumsfeld, Halleck, Laird, Ford, Goodell.'
