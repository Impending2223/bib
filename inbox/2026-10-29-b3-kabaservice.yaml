      c: 'The *Ripon Forum*, October. Its poll of members after the convention: Rockefeller''s supporters 82 percent, Nixon''s
        12; of Rockefeller''s, a third sure to back Nixon and Agnew. An editorial: Nixon''s stress since the convention on
        the war''s military side, and his silence on his memorandum to the platform committee, feed "the suspicion that Mr.
        Nixon''s written statement to the platform committee was only a tactical move to head off a threatened floor fight
        by George Romney and other critics of the war."'
      n: '[[w.kabaservice-rule-and-ruin]], 245–46. To check: "The Ripon Poll," *Ripon Forum* 4:10 (October 1968), 16–19 (cited
        by [[w.kabaservice-rule-and-ruin]], 245 n.99); "Editorial Points," *Ripon Forum* 4:10 (October 1968), 3 (cited by
        [[w.kabaservice-rule-and-ruin]], 246 n.103). See [[cal.1968-08-06.elections-1968-miami]]. Names: Rockefeller, Nixon,
        Agnew, Romney.'
