      when: Jan. 23
      date: '1964-01-23'
      thread: republican-party
      c: 'Eisenhower to Thayer, of the Ripon Society''s open letter: "my delight that an obviously intelligent group of people
        has taken the trouble to voice its concensus [*sic*] on this important subject, and also to express my basic agreement
