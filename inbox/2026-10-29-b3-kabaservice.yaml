        man elected). [[w.kabaservice-rule-and-ruin]], 64–65 (Nadasdy kept in the chair twenty-two hours; the tallies at 5:15
        a.m., McDevitt winning or losing by two; Lukens declared elected; the platform). To check: Goldwater''s speech, *Congressional
