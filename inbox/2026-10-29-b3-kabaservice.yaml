- edit:
    id: cal.1965-01-22.republican-party
    base: 7d88fedf
    set:
      c: 'Chicago. The Republican National Committee elects Bliss chairman, unanimously; Burch to stay until April, by the
        terms settled with Goldwater at his home in Phoenix. The committee approves Laird''s plan for a Republican Coordinating
        Committee. Its members, by Hess and Broder''s account: Eisenhower, five of the Senate''s Republican leaders, seven
        of the House''s, five governors, the four living defeated nominees, five of the national committee, one State legislator.
        Bliss to the committee: "I am no modern miracle man, but I will work hard and try to do a job for you." Goldwater
        introduces Nixon, by Nixon''s account: the man "who worked harder than any one person for the ticket." Nixon master
        of ceremonies at the luncheon before the vote. In the executive committee, Jan. 21, Burch: "obviously this is more
        or less a forced resignation." Bliss: "We have been shoved out onto the curb by the broad hips of Lyndon Johnson,
        and we have got to get back into the middle of the road." Stagg of Louisiana: "if Adam Clayton Powell can vote in
        the same party as Richard Russell, I can vote in the same party with Jacob Javits."'
      n: '[[w.hess-republican-establishment]], 42, 51, 54, 172; [[w.nixon-rn]], 265–66 (Goldwater on Nixon). [[w.kabaservice-rule-and-ruin]],
        133–35 (Bliss chairman, Burch out; the executive committee''s session of Jan. 21, Burch''s, Bliss''s and Stagg''s
        words). Check: the Coordinating Committee''s members at its founding; Hess and Broder give them undated. To check:
        Transcript of the executive session of the Executive Committee of the Republican National Committee, Jan. 21, 1965,
        Republican National Committee Papers, Library of Congress, I-B:4 (cited by [[w.kabaservice-rule-and-ruin]], 134 n.65,
        135 n.66). See [[cal.1965-01-12.elections-1964]]. Names: Bliss, Burch, Goldwater, Laird, Eisenhower, Nixon.'
      src:
        c: c8182dc0
        rows:
        - 'w.hess-republican-establishment 42: A-C'
        - 'w.hess-republican-establishment 51: D-E'
        - 'w.hess-republican-establishment 54: F'
