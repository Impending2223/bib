    set:
      c: 'Primaries. Maryland: Mahoney, a Baltimore paving contractor, on "Your home is your castle—protect it," wins the
        Democratic nomination for governor over Sickles, 148,446 to 146,607, 30.2 percent, a 1,839-vote margin; Finan 134,216,
        27.3 percent; Agnew the Republican. Massachusetts: Brooke, the attorney general, unopposed for the Republican nomination
        for the Senate; Peabody over Collins for the Democratic, 320,967 to 265,016, 50.4 percent; Thomas Boylston Adams,
        against the war, 51,435, 8.1 percent. Massachusetts 10th, the Republican primary: Margaret Heckler, a party worker,
        over Joseph Martin, Speaker in 1947–49 and 1953–55. Check: the count.'
      n: 'Maryland Manual, 1969–70, [p. 626](http://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000174/html/am174--525.html).
        [Mass. *Election Statistics*, 1966 (P.D. 43)](https://archive.org/details/electionstatisti19651966mass); check the
        page. The totals: [Wikipedia, "1966 Maryland gubernatorial election"](https://en.wikipedia.org/wiki/1966_Maryland_gubernatorial_election);
        [Wikipedia, "1966 United States Senate election in Massachusetts"](https://en.wikipedia.org/wiki/1966_United_States_Senate_election_in_Massachusetts).
        [[w.kabaservice-rule-and-ruin]], 174 (Heckler over Martin). To check: [[w.coffey-spiro-agnew-and-the]]; [[w.witcover-very-strange-bedfellows]];
        [[w.brooke-bridging-the-divide]]; [[w.rigueur-loneliness-of-the-black]]. Names: Agnew, Brooke, Peabody, Sickles, John
        Collins, Mahoney, Finan, Thomas Boylston Adams, Heckler, Martin.'
