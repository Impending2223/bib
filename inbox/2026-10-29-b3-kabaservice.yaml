        4:4 (April 1968), 7–8 (cited by [[w.kabaservice-rule-and-ruin]], 233 n.41); J. Eugene Marans and Peter J. Wallison,
        "What Republicans Should Do," *Ripon Forum* 4:4 (April 1968), 9–10 (cited by [[w.kabaservice-rule-and-ruin]], 233
        n.42). See [[cal.1968-02-29.civil-disorders]]. Names: Javits, Percy, Rockefeller, Cowger.'
