      c: 'The *Ripon Forum*, December. Editorials: no gain for the party in 1970 from a Southern strategy, the marginal seats
        being in the more liberal parts of the country; Nixon to be a "healing statesman," with "strong support in both Houses
        of Congress for progressive initiatives," an early and honorable settlement in Vietnam first. Beal: outside the South,
        Wallace drew evenly from both parties; his voters not to be won without losing more moderates.'
      n: '[[w.kabaservice-rule-and-ruin]], 248. To check: "Editorial," *Ripon Forum* 4:12 (December 1968), 3–5 (cited by [[w.kabaservice-rule-and-ruin]],
        248 n.111); "Editorial," *Ripon Forum* 4:12 (December 1968), 10–11 (cited by [[w.kabaservice-rule-and-ruin]], 248
        n.114); Christopher W. Beal, "Election ''68: What Did and Didn''t Happen," *Ripon Forum* 4:12 (December 1968), 8–9
        (cited by [[w.kabaservice-rule-and-ruin]], 248 n.112). Names: Nixon, Wallace.'
