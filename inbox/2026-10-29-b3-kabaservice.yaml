      c: 'The *Ripon Forum*, June. Michael Smith, of its governing board, after months in California, "Ronald Reagan: Here''s
        the Rest of Him": Reagan''s lack of interest in governing, the ten percent cuts across the board, his vetoes of antipoverty
        grants, repression of disorder "without treating the underlying causes." The editors: Reagan not fit for the Presidency;
        "If Reagan is unqualified to be President, he is unqualified to be vice-president." Nixon''s speeches on Negro enterprise
        "gave the former Vice President''s campaign the intellectual spark and the appearance of social concern that it had
        sorely lacked."'
      n: '[[w.kabaservice-rule-and-ruin]], 235, 239–40. To check: Michael C. Smith, "Ronald Reagan: Here''s the Rest of Him,"
        *Ripon Forum* 4:6 (June 1968), 13–32 (cited by [[w.kabaservice-rule-and-ruin]], 240 n.72); "Editorial Points," *Ripon
        Forum* 4:6 (June 1968), 4 (cited by [[w.kabaservice-rule-and-ruin]], 240 n.75); "Editorial Points," *Ripon Forum*
        4:6 (June 1968), 5 (cited by [[w.kabaservice-rule-and-ruin]], 235 n.51). Names: Reagan, Nixon.'
