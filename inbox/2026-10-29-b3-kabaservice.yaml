      c: 'Kuchel''s farewell to the Senate: an author of every civil rights bill that became law in the century; "Some of
        the votes I have cast I know have been very costly to me politically"; "not only permissible but, indeed, vital that
        the Senate of the United States lead public opinion instead of following it."'
