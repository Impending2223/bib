        301 (Nixon at the funeral); [[w.palermo-in-his-own-right]], 184 (the funeral; Kennedy walking with the coffin the
        five miles to Morehouse; McCarthy behind him in the church). [[w.kabaservice-rule-and-ruin]], 234 (the services at
        Ebenezer and Morehouse; Nixon and Rockefeller there; the Republicans of E). To check: Christopher DeMuth, "Georgia:
        At the King Funeral," *Ripon Forum* 4:5 (May 1968), 17 (cited by [[w.kabaservice-rule-and-ruin]], 234 n.44). See [[cal.1968-04-04.king]].
        Names: Humphrey, Kennedy, McCarthy, Nixon, Rockefeller, Lindsay, Brooke, Romney, Javits, Riegle. Check: Palermo, 184,
        by the Daily Diary: Johnson sent flowers and a card.'
