- edit:
    id: cal.1969-01-14.program
    base: cbc1d35c
    set:
      n: 'Annual Message to the Congress on the State of the Union, [1968–69 Pub. Papers 1263](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=573)
        (Jan. 14, 1969). [[w.johnson-vantage-point]], 565 (the closing words); [[w.dallek-flawed-giant]], 597–98 (the address
        in person; the closing words). [[w.longley-lbjs-1968]], 259–60 (the address; Christian''s count of the applause).
        [[w.mann-walls-of-jericho]], 498–99 (Russell). To check: [[w.zelizer-fierce-urgency-of-now]]; [[w.califano-triumph-and-tragedy-of]].
        See [[cal.1968-01-17.program]]. Names: Johnson, Kappel, Nixon, Russell.'
      src:
        c: 37ba1099
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=573: all'
        - 'w.johnson-vantage-point 565: A, N'
        - 'w.dallek-flawed-giant 597–98: A, N'
        - 'w.longley-lbjs-1968 259–60: A, N'
        - 'w.mann-walls-of-jericho 498–99: O'
      c: 'State of the Union, to a joint session, "for the sixth and the last time." Asked: social security up at least 13
        percent, the minimum from $55 to $80 a month; medical care for expectant mothers and infants; the poverty program
        reorganized, not crippled; the Voting Rights Act''s main provisions extended five years; the full $300 million for
        the Safe Streets grants; licensing and registration of firearms; the postal system reorganized on the Kappel report;
        Members pay $42,500, not the commission''s $50,000; the draft by random selection. A surplus of $2.4 billion in fiscal
        1969, $3.4 billion in 1970, the surtax extended, Nixon agreeing. The nonproliferation treaty ratified; the missile
        talks resumed. "At least it will be said that we tried." Of Russell, the President pro tempore: "I am sure that I
        have avoided many dangerous pitfalls by the good commonsense counsel" of Russell.'
