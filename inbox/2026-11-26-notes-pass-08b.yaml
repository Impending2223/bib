- add-words:
    id: cal.1967-06-23.soviet-union
    after: end
    words: 'June 23: Johnson arrives at 10:40 a.m., Kosygin at 11:22; they talk alone with interpreters from 11:30 to 1:30.'
    text: FRUS 1964–68, XIV, doc. [228](https://history.state.gov/historicaldocuments/frus1964-68v14/d228)
- add-words:
    id: cal.1967-06-23.soviet-union
    after: end
    words: 'Lunch follows, 1:30 to 3:10: Rusk, McNamara, Thompson, Rostow, Bundy, Watson and Christian with Johnson; Gromyko and Dobrynin with Kosygin. At Johnson''s request McNamara takes up arms control. The two talk alone again from 3:44 to 4:35.'
    text: FRUS 1964–68, XIV, doc. [231](https://history.state.gov/historicaldocuments/frus1964-68v14/d231)
- add-words:
    id: cal.1967-06-23.soviet-union
    after: end
    words: 'June 25: the delegations lunch at 1:50; Johnson and Kosygin talk alone from 3:20 to 6:09 p.m.'
    text: FRUS 1964–68, XIV, doc. [235](https://history.state.gov/historicaldocuments/frus1964-68v14/d235)
