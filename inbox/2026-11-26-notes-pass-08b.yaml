- add-words:
    id: cal.1967-04-07.china-leadership
    after: end
    words: 'In another talk of the day, timed in no record, Đồng reports the Soviet proposals: China to raise the quota for Soviet aid shipped across it from 10,000 to 30,000 tons a month, and to set aside two or three southern ports for it.'
    item: '[[w.77-conversations-between-chinese]], 97'
- add-words:
    id: cal.1967-04-07.china-leadership
    after: end
    words: Of the landing in Europe Zhou names Eisenhower, commander on the Western front, and Marshall, the Army's chief of staff.
    item: '[[w.77-conversations-between-chinese]], 98'
- add-words:
    id: cal.1967-04-07.china-leadership
    after: end
    words: 'Zhou gives the ages: he is almost seventy, Ye Jianying seventy, Chen Yi sixty-seven. Ye Jianying is present: the old horse in the stable still dreams of heroic exploits.'
    item: '[[w.77-conversations-between-chinese]], 98'
- names:
