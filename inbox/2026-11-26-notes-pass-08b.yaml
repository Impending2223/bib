- add-words:
    id: cal.1966-09-07.china-leadership-6
    after: end
    words: 'By Pu, he criticizes the standing members who wrote against the Air Force leaders and conveys Lin Biao''s view: those in the plenum who "seize on the dead to purge the living" have made an error of an anti-Party nature; no organizational measures for now, they keep their posts, to be watched.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 122'
- names:
    id: cal.1966-09-07.china-leadership-6
    add:
    - Lin Biao
    tags:
    - name:lin-biao
- add-words:
    id: cal.1966-10-05.china-leadership
    after: end
    words: The directive finds that some academies' leaders overstress their special character, suppress democracy, forbid links between classes, departments and schools and set students against students; the academies are to follow the Sixteen Points as the local colleges do, with the four bigs, and those branded counter-revolutionaries, anti-Party elements or rightists at the start of the movement are to be cleared in public. The army and the academies are not to take part in the localities' movement.
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 420'
- add-words:
    id: cal.1966-10-05.china-leadership
    after: end
    words: It abolishes Party committee leadership in the army's schools, not in the army at large; the rule that the schools' committees lead the movement after the work teams leave is cancelled.
    item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 946'
- add-words:
    id: cal.1966-10-05.china-leadership
    after: end
    words: By Qiu Huizuo, the draft is the work of Liu Zhijian, Yang Mancun and Xie Tangzhong of the All-Army Group, the marshals failing to stop it; by Wang Li, Lin dictates it after Tao Zhu's daughter Tao Siliang and another cadre's child tell him of the academies' repression.
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 420'
