    after: end
    words: 'Chen Zaidao and Zhong Hanhua, brought to Peking on July 24, are struggled. Zhou to Chen: "Chen Zaidao, yours is a betrayal of Chairman Mao and the Party!" Wu Faxian, Liu Feng and others tear the badges from their collars and caps and make them bow in the "jet plane"; Wu slaps Chen.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 539'
- add-words:
    id: cal.1967-07-26.china-leadership-3
    after: end
    words: The meeting runs six to seven hours. When Wu boxes Chen's ears, Chen Yi and Tan Zhenlin walk out; Xu Xiangqian, accused, rejects it and leaves. In a recess orderlies beat the Wuhan officers. Kang Sheng cuts Chen off when he appeals to him.
    item: '[[w.macfarquhar-maos-last-revolution]], 213'
