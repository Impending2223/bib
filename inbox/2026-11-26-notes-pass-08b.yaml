- add-words:
    id: cal.1967-06-20.soviet-union-leadership-2
    after: end
    words: Brezhnev groups the Cubans with the Chinese, as putting their national interests before the socialist world's; the Politburo is taking "certain measures" against those tendencies in the Cuban leadership.
    item: '[[w.friedman-shadow-cold-war]], 157'
- add-words:
    id: cal.1967-06-20.soviet-union-leadership-2
    after: end
    words: 'Nasser''s order of May 19, to the UN troops to leave Sinai, was a "not-well-thought-out step," taken without consulting Moscow. By the embassy''s data the UAR''s generals favored a preventive strike; Syria''s Prime Minister Zayen told the ambassador several times: "now is the best time for a decisive blow against imperialist forces in the Near East."'
    item: '[[w.friedman-shadow-cold-war]], 158–59'
- add-words:
    id: cal.1967-06-20.soviet-union-leadership-2
    after: end
    words: The Arab leaders, Nasser too, did not consult their socialist friends and, not yet Marxists, are open to petty-bourgeois nationalism, to be cured by deeper Soviet ties.
    item: '[[w.friedman-shadow-cold-war]], 159'
- names:
