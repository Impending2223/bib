- add-words:
    id: cal.1967-04-07.china-leadership
    after: end
    words: 'In another talk of the day, timed in no record, Đồng reports the Soviet proposals: China to raise the quota for Soviet aid shipped across it from 10,000 to 30,000 tons a month, and to set aside two or three southern ports for it.'
    item: '[[w.77-conversations-between-chinese]], 97'
- add-words:
    id: cal.1967-04-07.china-leadership
    after: end
    words: In the landing in Europe Zhou names Eisenhower as commander in the West and Marshall as the Army's chief of staff.
    item: '[[w.77-conversations-between-chinese]], 97–98'
- add-words:
    id: cal.1967-04-07.china-leadership
    after: end
    words: 'Zhou gives the ages: he is almost seventy, Ye Jianying seventy, Chen Yi sixty-seven. Ye Jianying is present: the old horse in the stable still dreams of heroic exploits.'
    item: '[[w.77-conversations-between-chinese]], 98–99'
- names:
    id: cal.1967-04-07.china-leadership
    add:
    - Eisenhower
    - Ye Jianying
    - Chen Yi
    tags:
    - name:eisenhower-dwight-d
    - name:ye-jianying
    - name:chen-yi
- add-words:
    id: cal.1967-04-11.china-leadership
    after: end
    words: 'Giáp is with Đồng; Zhu Qiwen is present. Mao: if you "preserve the mountain green" you need not worry about firewood; in fighting American troops take bites of a platoon, company or battalion, of puppet troops a regiment.'
    item: '[[w.77-conversations-between-chinese]], 102–103'
- add-words:
    id: cal.1967-04-11.china-leadership
    after: end
    words: 'Mao asks if China will help with a new 100-km railway; Zhou: a feasibility study is to be made. On food, Zhou: China will give 100,000 tons of rice and 50,000 of maize.'
    item: '[[w.77-conversations-between-chinese]], 103'
