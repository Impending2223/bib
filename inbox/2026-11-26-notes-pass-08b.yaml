- add-words:
    id: cal.1966-10-14.vietnam
    after: end
    words: Almost 84,000 attack sorties have been flown against the North. The barrier is to take 10,000 to 20,000 of the 470,000 men and cost about $1 billion.
    text: FRUS 1964–68, IV, doc. [268](https://history.state.gov/historicaldocuments/frus1964-68v04/d268)
- add-words:
    id: cal.1966-10-14.vietnam
    after: end
    words: 'Wheeler signs the Chiefs'' reply: they reserve judgment on 470,000, reject holding the bombing or cutting it for talks, and ask for the Rolling Thunder 52 program, which would shrink the Hanoi and Haiphong sanctuary areas.'
    text: FRUS 1964–68, IV, doc. [269](https://history.state.gov/historicaldocuments/frus1964-68v04/d269)
