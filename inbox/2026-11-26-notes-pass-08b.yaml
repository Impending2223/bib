    id: cal.1967-08-18.vietnam-air-war
    after: end
    words: Wheeler opens with a map of ten targets, three proposed for strikes the next week; the Air Force will hit the Hanoi thermal power plant at 7 p.m. Washington time, weather permitting. McNamara asks approval of three more as a package, to be done by the 24th, among them the depot, which Wheeler places at the northern edge of Hanoi, with an estimate of 30 civilian casualties.
    text: FRUS 1964–68, V, doc. [287](https://history.state.gov/historicaldocuments/frus1964-68v05/d287)
- add-words:
    id: cal.1967-08-18.vietnam-air-war
    after: end
    words: 'Johnson would approve it; McNamara advises against, as too complicated and in a populated area, and Wheeler says it need not be approved tonight. Approved: all but the depot.'
    text: FRUS 1964–68, V, doc. [287](https://history.state.gov/historicaldocuments/frus1964-68v05/d287)
- add-words:
    id: cal.1967-08-18.vietnam-air-war
    after: end
    words: 'Rusk: Senator Hugh Scott suggests a pep talk for Republican moderates at the White House. Johnson: "you can''t trust them."'
    text: FRUS 1964–68, V, doc. [287](https://history.state.gov/historicaldocuments/frus1964-68v05/d287)
