- add-words:
    id: cal.1967-08-09.china-leadership
    after: end
    words: 'The talk is to the leaders of the large military regions, notably Zeng Siyu and Liu Feng, the new Wuhan leaders. Party and government cadres who reform are welcome and all who can be saved are to be saved; rebels may seize the leaders of conservative organizations and are to teach erring army cadres; attacks on military regions are no test of left and right. Everything is to be reported to the Center: "The Premier and Comrades Chen Boda, Kang Sheng and Jiang Qing are working day and night."'
