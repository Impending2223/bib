    after: end
    words: About 1,400 antiwar protesters stand outside the Americana Hotel, Lowenstein among them; the 1,650 Democrats at the dinner are pleased.
    item: '[[w.palermo-in-his-own-right]], 64–65'
- add-words:
    id: cal.1967-06-03.democratic-party
    after: end
    words: 'Kennedy, back from a funeral in London, builds the introduction from two drafts, Sorensen''s and Walinsky''s, in the car to the hotel. He speaks of Johnson''s "height of his aim, the breadth of his achievement, the record of his past, and the promises of his future," and of 1964: "with our help he will do so again in 1968."'
    item: '[[w.shesol-mutual-contempt]], 397'
