- add-words:
    id: cal.1966-10-09.china-leadership
    after: end
    words: By Wang Li, the criticism is to settle the leaders who ran the Center's work in August and September, chiefly Zhou and Tao Zhu, and the provincial and municipal leaders.
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 299–300'
- names:
