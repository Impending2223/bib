    after: end
    words: Brezhnev groups the Cubans with the Chinese, as putting their national interests before the socialist world's; the Politburo is taking "certain measures" against those tendencies in the Cuban leadership.
    item: '[[w.friedman-shadow-cold-war]], 157'
- add-words:
    id: cal.1967-06-20.soviet-union-leadership-2
    after: end
    words: 'Nasser''s order of May 19, to the UN troops to leave Sinai, was a "not-well-thought-out step," taken without consulting Moscow. By the embassy''s data the UAR''s generals favored a preventive strike; Syria''s Prime Minister Zayen told the ambassador several times: "now is the best time for a decisive blow against imperialist forces in the Near East."'
    item: '[[w.friedman-shadow-cold-war]], 158–59'
- add-words:
    id: cal.1967-06-20.soviet-union-leadership-2
    after: end
    words: Zhou Enlai calls on the Arab states "to continue the war at any cost." The Arab leaders, Nasser too, did not consult their socialist friends and, not yet Marxists, are open to petty-bourgeois nationalism, to be cured by deeper Soviet ties.
    item: '[[w.friedman-shadow-cold-war]], 159'
- add-words:
    id: cal.1967-06-20.soviet-union-leadership-2
    after: end
    words: The Arabs now accept hands-on Soviet help in training and planning, military and diplomatic.
    item: '[[w.friedman-shadow-cold-war]], 160'
- names:
    id: cal.1967-06-20.soviet-union-leadership-2
    add:
    - Nasser
    - Zhou Enlai
    tags:
    - name:nasser-gamal-abdel
    - name:zhou-enlai
- add-words:
    id: cal.1966-12-14.robert-kennedy
    after: end
    words: George Christian succeeds him as press secretary.
    item: '[[w.shesol-mutual-contempt]], 296'
- names:
    id: cal.1966-12-14.robert-kennedy
    add:
    - Christian
    tags:
    - name:christian-george
- names:
    id: cal.1966-12-14.robert-kennedy
    tags:
    - ok:note-substance
- add-words:
    id: cal.1967-02-06.robert-kennedy
    after: end
    words: 'That morning Kennedy calls Watson for an appointment; Katzenbach lunches with him in his Senate office and urges him to deny the story publicly; Watson then calls: the President will see them at 4.'
    item: '[[w.shesol-mutual-contempt]], 365–67'
- add-words:
    id: cal.1967-02-06.robert-kennedy
    after: end
    words: 'Johnson accuses Kennedy of the leak; Kennedy says it came from "your State Department." Johnson says the war will be won by summer and Kennedy finished if he keeps on about bombing halts: he will destroy him and his dove friends, "dead politically in six months." Kennedy urges a halt in the bombing and an extension of the Tet pause; Johnson refuses, and Kennedy: "I don''t have to take that from you." Johnson asks him to tell the reporters there was no peace feeler. The meeting runs an hour and twenty minutes; Kennedy comes out just before 6 p.m.'
    item: '[[w.shesol-mutual-contempt]], 365–67'
- names:
    id: cal.1967-02-06.robert-kennedy
    add:
    - Watson
    tags:
    - name:watson-w-marvin
- names:
    id: cal.1967-02-06.robert-kennedy
    tags:
    - ok:note-substance
- add-words:
    id: cal.1967-01-11.china-leadership-2
    after: end
    words: 'Ye: "the more disorder in the localities, the steadier the army must be," or the enemy takes advantage. Seven of the thirteen military regions are in the movement, and all 157 army schools; the General Logistics Department is paralyzed, the General Political Department nearly so, the General Staff in part, the Navy and Air Force too; the Air Force''s command must move into war-readiness works.'
    item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 954–955'
- add-words:
    id: cal.1967-01-11.china-leadership-2
    after: end
    words: The meeting cancels the right of Liu Shaoqi, Deng Xiaoping, Tao Zhu, Chen Yun and He Long to attend Politburo meetings.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1936'
- add-words:
    id: cal.1967-01-11.china-leadership-2
    after: end
    words: 'Zhu De: the movement has gone so far as to harm production, forgetting "grasp revolution, promote production"; armed fighting goes on though long forbidden, to the smashing of machines and burning of houses, counter-revolutionaries making trouble among them.'
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1960'
- names:
    id: cal.1967-01-11.china-leadership-2
    add:
