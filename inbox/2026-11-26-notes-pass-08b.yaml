- add-words:
    id: cal.1967-06-03.democratic-party
    after: end
    words: 'About 1,400 antiwar protesters stand outside the Americana Hotel, Lowenstein among them. Kennedy: "the height of his aim, the breadth of his achievement, the record of his past, and the promises of his future"; "with our help he will do so again in 1968." The 1,650 at the dinner are pleased.'
