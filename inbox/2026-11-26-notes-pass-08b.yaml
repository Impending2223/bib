      c: 'Kennedy''s Senate office, at lunch. Katzenbach, calling back in Watson''s place, tells Kennedy he works for President Johnson and urges him to deny the *Newsweek* story publicly; Kennedy says he would never have made up such a story. Watson telephones: the President will see Kennedy and Katzenbach at 4 p.m.'
      n: '[[w.shesol-mutual-contempt]], 366. The order: after [[cal.1967-02-06.robert-kennedy-2]], [[w.shesol-mutual-contempt]], 366 ("But it was Nick Katzenbach who called the senator back"). See [[cal.1967-02-06.robert-kennedy]]. Names: Katzenbach, Robert Kennedy, Watson, Johnson.'
