    words: Xie Fuzhi relays Zhou's talk of the 18th. Chen Zaidao and Zhong Hanhua examine themselves. Niu Huailong, commander of the independent division, asks to speak and is stopped; its commissar Cai Bingchen walks out in anger and Niu follows.
