    words: The talks with the delegation run Dec. 7, 9:20 a.m. to 1 and 6 to 8:30 p.m., and Dec. 8, 9 to 2; Suslov, Mazurov, Novikov and Rusakov take part on the Soviet side. A lunch for the delegation follows the first morning's talk, 1 to 3 p.m.
