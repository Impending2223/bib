- add-words:
    id: cal.1967-06-23.soviet-union
    after: end
    words: 'Lunch follows, 1:30 to 3:10: Rusk, McNamara, Thompson, Rostow, Bundy, Watson and Christian with Johnson; Gromyko and Dobrynin with Kosygin. At Johnson''s request McNamara takes up arms control.'
    text: FRUS 1964–68, XIV, doc. [231](https://history.state.gov/historicaldocuments/frus1964-68v14/d231)
