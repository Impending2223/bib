      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 167–69 (№№ 40–41, Brezhnev''s notes, Dec. 7–8, "вероятно... переговоров с партийно-правительственной делегацией КНДР во главе с Ким Ир Сеном" (probably the talks with the party-government delegation of the DPRK under Kim Il Sung)), 181 nn.146–52 (the editors: the visit by the Politburo''s decision of Dec. 4; Kim and Brezhnev at Vladivostok, May 20–21; the Korean conference of Oct. 5–12; the Korean pilots sent to Vietnam; the delegation on to Romania after Dec. 9). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 160–161 (the secretaries'' record, Dec. 6–9: Moscow. Brezhnev and Suslov meet Kim Il Sung at Vnukovo Dec. 6, 2:20 p.m. Brezhnev negotiates with the Korean delegation Dec. 7, 9:20 to 1 and 6 to 8:30 (Suslov, Mazurov, Novikov and Rusakov with him), Dec. 8, 9 to 2, and Dec. 9, 9 to 1). The time is the first day''s (II, 160). Made public: 2016. To check: the Korean record. Names: Kim Il Sung, Brezhnev.'
