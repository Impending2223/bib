    words: 'The hearings are seven days of executive sessions. Stennis opens: it would be "a tragic and perhaps fatal mistake" to suspend or restrict the bombing. Witnesses: Sharp with Ryan and Roy Johnson, Aug. 9 and 10; Wheeler and Momyer, Aug. 16; McConnell and Moorer, Aug. 22 and 23; McNamara, Aug. 25; Harold K. Johnson and Greene, Aug. 28; Myers, Aug. 29.'
    item: '[[w.gibbons-u-s-government-and]], IV, 744–45'
