      when: July
      date: 1960-07
      thread: elections-1960
      also:
      - defense
      c: By Alsop's account, Herter and Gates find Eisenhower at the Newport Country Club and persuade him that defense spending
        must rise $4 billion; Herter asks a few days to staff it. After the Fifth Avenue statement Eisenhower calls it off.
      n: '[[w.smith-on-his-own-terms]], 347 (by Alsop''s account). To check: [[w.alsop-ive-seen-the-best]], 416–18 (cited
        by [[w.smith-on-his-own-terms]], 347). Check: the days; Smith puts it a day before the statement of July 23. See [[cal.1960-07-22.elections-1960]].
        Names: Alsop, Herter, Gates, Eisenhower.'
      tags:
      - name:alsop-joseph
      - name:herter-christian-a
      - name:gates-thomas-s-jr
      - name:eisenhower-dwight-d
      src:
