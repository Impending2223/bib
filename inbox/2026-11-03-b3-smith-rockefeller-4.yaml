- add:
    entry:
      id: cal.1961-01.states-and-cities
      when: Jan.
      date: 1961-01
      thread: states-and-cities
      c: 'Rockefeller''s special message to the Legislature on higher education, on the Heald committee''s report: two graduate
        centers, one on Long Island, one upstate; liberal arts in the colleges of education; community colleges; a City University
        of New York; tuition left to the State University''s trustees. The Scholar Incentive Program: up to $200 a year to
        each full-time undergraduate, $800 to graduate students.'
      n: '[[w.smith-on-his-own-terms]], 354. Check: the day; Smith gives the end of January. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
      - state:ny
      src:
        c: 6f0317f7
        rows:
        - 'w.smith-on-his-own-terms 354: all'
