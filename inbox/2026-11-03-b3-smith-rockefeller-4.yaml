      thread: elections-1960
      also:
      - republican-party
      c: 'Newport, R.I. Eisenhower, in private, of Rockefeller: "personal treachery." At his direction Hagerty telephones
        Percy in Chicago: the revised defense plank unacceptable to the White House.'
      n: '[[w.smith-on-his-own-terms]], 346. To check: [[w.rorabaugh-real-making-of-the]], 111 (cited by [[w.smith-on-his-own-terms]],
        346). See [[cal.1960-07-22.elections-1960]]. Names: Eisenhower, Hagerty, Percy, Rockefeller.'
      tags:
      - name:eisenhower-dwight-d
