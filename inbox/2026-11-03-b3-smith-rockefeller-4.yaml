- add:
    entry:
      id: cal.1961-11-17.elections-1964
      when: Nov. 17
      date: '1961-11-17'
      thread: elections-1964
      c: 'The Rockefellers'' separation announced, 6 p.m., Friday: the statement hand-delivered to New York''s seven papers
        and the two wires; a property settlement; the Governor to stay with his brother Laurance. Wilson, told at dinner beforehand,
        begs him to reconsider. Hinman, at the Republicans'' southern conference in Atlanta, not told.'
      n: '[[w.smith-on-his-own-terms]], 363–64. To check: *Time*, Nov. 24, 1961; Hinman to Rockefeller, "Republican Southern
        Conference, November 17th and 18th," Rockefeller Archive Center (both cited by [[w.smith-on-his-own-terms]], 364).
        Names: Rockefeller, Hinman.'
      tags:
      - name:rockefeller-nelson
      - name:hinman-george-l
      - state:ny
      src:
