patch: soviet-forces
by: Claude (agent), the forces brief; the estimates read in FRUS 1958-60, III; 1961-63, VIII; 1964-68, X (the TEI files)
ops:
  - add:
      entry:
        id: cal.thread.defense-soviet-forces
        s: Soviet forces
        parent: defense
        c: The intelligence community's estimates of the Soviet forces, an entry a document, dated by the record. NIE 11-8-59's 140–200 ICBMs for mid-1961; the three programs of 1960; 11-8/1-61's 10–25 launchers; 11-8-62's 50.
        c2: The intelligence community's estimates of the Soviet forces, an entry a document, dated by the record. NIE 11-4-63's 80–85 ICBM launchers; 11-8-63's 105–120; 11-8-64's 200; 11-8-65's 224; 11-14-65's 108 line divisions.
        c3: The intelligence community's estimates of the Soviet forces, an entry a document, dated by the record. NIE 11-8-66's 335 ICBM launchers and 670–765 for mid-1968; the missile submarines recounted; 11-8-68's 900.
      section: th
      after: cal.thread.defense-clifford
  - add:
      entry:
        id: cal.1960-02-09.defense-soviet-forces
        when: Feb. 9
        date: '1960-02-09'
        thread: defense-soviet-forces
        c: NIE 11-8-59, Soviet Capabilities for Strategic Attack Through Mid-1964, concurred in by the Intelligence Board. 140–200 ICBMs on launcher by mid-1961; 250–350 by mid-1962; 350–450 by mid-1963. 135 heavy and 1,100 medium bombers in mid-1960. Air Force intelligence dissents, higher from mid-1962.
        n: '[FRUS 1958–60, III, doc. 88](https://history.state.gov/historicaldocuments/frus1958-60v03/d88). [[w.bottome-missile-gap]]; [[w.freedman-us-intelligence-and-the]]; [[w.prados-soviet-estimate]]; [[w.roman-eisenhower-and-the-missile]]; [[w.steury-intentions-and-capabilities]]; [[w.preble-john-f-kennedy-and]]. See [[cal.1960-01-26.defense]]. Made public: FRUS 1958–60, III (1996). Check: an earlier release by the CIA.'
        tags: [name:dulles-allen-w]
  - add:
      entry:
        id: cal.1960-08-01.defense-soviet-forces
        when: Aug. 1
        date: '1960-08-01'
        thread: defense-soviet-forces
        c: NIE 11-8-60, Soviet Capabilities for Long Range Attack Through Mid-1965. No direct evidence of the ICBM program's pace. Three illustrative programs, 400, 700 or 200 operational launchers by mid-1963; Dulles takes the first, Air Force intelligence the second. 135 heavy and 1,100 medium bombers in mid-1960.
        n: '[FRUS 1958–60, III, doc. 111](https://history.state.gov/historicaldocuments/frus1958-60v03/d111). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1958–60, III (1996). Names: Dulles.'
        tags: [name:dulles-allen-w]
  - add:
      entry:
        id: cal.1961-06-07.defense-soviet-forces
        when: June 7
        date: '1961-06-07'
        thread: defense-soviet-forces
        c: NIE 11-8-61, Soviet Capabilities for Long Range Attack; FRUS prints its annex on the ICBM program. Two to four ICBM sites probably begun in 1957–59, probably operational now. Army and Navy intelligence dissent.
        n: '[FRUS 1961–63, VIII, doc. 29](https://history.state.gov/historicaldocuments/frus1961-63v08/d29). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
        tags: [name:dulles-allen-w]
  - add:
      entry:
        id: cal.1961-09-21.defense-soviet-forces
        when: Sept. 21
        date: '1961-09-21'
        thread: defense-soviet-forces
        c: NIE 11-8/1-61, Strength and Deployment of Soviet Long Range Ballistic Missile Forces. 10–25 launchers able to fire ICBMs at the United States, few more in the months ahead; 75–125 by mid-1963. 350–450 medium and intermediate launchers in 1962–63. Air Force intelligence, not printed in the text, about 50 now, 250 by mid-1963.
        n: '[FRUS 1961–63, VIII, doc. 45](https://history.state.gov/historicaldocuments/frus1961-63v08/d45). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
        tags: [name:dulles-allen-w]
  - add:
      entry:
        id: cal.1962-07-06.defense-soviet-forces
        when: July 6
        date: '1962-07-06'
        thread: defense-soviet-forces
        c: NIE 11-8-62, Soviet Capabilities for Long Range Attack. About 50 operational ICBM launchers; 125–175 by mid-1963, 200–300 by mid-1964, 300–600 by mid-1967. About 40 ballistic missile submarines, 120 missiles of 350 n.m. 165 heavy and 950 medium bombers. Air Force intelligence, 75–100 launchers now.
        n: '[FRUS 1961–63, VIII, doc. 96](https://history.state.gov/historicaldocuments/frus1961-63v08/d96). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
        tags: [name:mccone-john-a]
  - add:
      entry:
        id: cal.1963-03-22.defense-soviet-forces
        when: Mar. 22
        date: '1963-03-22'
        thread: defense-soviet-forces
        c: NIE 11-4-63, Soviet Military Capabilities and Policies, 1962–1967. 80–85 operational ICBM launchers at the end of 1962, a few in hardened silos; 250–325 by mid-1964, 75–100 of them silos. Antimissile defenses perhaps the largest new Soviet program.
        n: '[FRUS 1961–63, VIII, doc. 130](https://history.state.gov/historicaldocuments/frus1961-63v08/d130). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
        tags: [name:mccone-john-a]
  - add:
      entry:
        id: cal.1963-10-18.defense-soviet-forces
        when: Oct. 18
        date: '1963-10-18'
        thread: defense-soviet-forces
        c: NIE 11-8-63, Soviet Capabilities for Strategic Attack. 18 ICBM complexes, about 220 launchers in all stages; 105–120 operational Oct. 1, about 20 in hard silos; 205–235 by mid-1964, 250–350 by mid-1965. About 50 ballistic missile submarines, 11 nuclear. Air Force intelligence, 145–160 now.
        n: '[FRUS 1961–63, VIII, doc. 144](https://history.state.gov/historicaldocuments/frus1961-63v08/d144). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
        tags: [name:mccone-john-a]
  - add:
      entry:
        id: cal.1964-10-08.defense-soviet-forces
        when: Oct. 8
        date: '1964-10-08'
        thread: defense-soviet-forces
        c: NIE 11-8-64, Soviet Capabilities for Strategic Attack. About 200 operational ICBM launchers; second-generation deployment probably ended; the SS-9 and SS-10 in flight test, single hard silos begun. 400–700 by mid-1970.
        n: '[FRUS 1964–68, X, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v10/d55). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
        tags: [name:mccone-john-a]
  - add:
      entry:
        id: cal.1965-10-07.defense-soviet-forces
        when: Oct. 7
        date: '1965-10-07'
        thread: defense-soviet-forces
        c: NIE 11-8-65, Soviet Capabilities for Strategic Attack. 224 operational ICBM launchers, mostly soft and concentrated; to about double in two years, in dispersed single silos. 500–1,000 in 1975; Air Force intelligence, at least 1,000. About 735 medium and intermediate launchers.
        n: '[FRUS 1964–68, X, doc. 97](https://history.state.gov/historicaldocuments/frus1964-68v10/d97). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
        tags: [name:raborn-william-f-jr]
  - add:
      entry:
        id: cal.1965-10-21.defense-soviet-forces
        when: Oct. 21
        date: '1965-10-21'
        thread: defense-soviet-forces
        c: NIE 11-14-65, Capabilities of Soviet General Purpose Forces. About 108 line divisions ready for a war's first operations, 31 cadre divisions. The Soviets and their Warsaw Pact allies, 45 divisions and about 2,900 combat aircraft ready against NATO's Central Region.
        n: '[FRUS 1964–68, X, doc. 98](https://history.state.gov/historicaldocuments/frus1964-68v10/d98). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
        tags: [name:raborn-william-f-jr]
  - add:
      entry:
        id: cal.1966-10-20.defense-soviet-forces
        when: Oct. 20
        date: '1966-10-20'
        thread: defense-soviet-forces
        c: NIE 11-8-66, Soviet Capabilities for Strategic Attack. About 335 operational ICBM launchers; 670–765 by mid-1968, half of them SS-11s, about 80 percent hard; 800–1,100 by mid-1971.
        n: '[FRUS 1964–68, X, doc. 143](https://history.state.gov/historicaldocuments/frus1964-68v10/d143). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
        tags: [name:helms-richard]
  - add:
      entry:
        id: cal.1967-03-13.defense-soviet-forces
        when: Mar. 13
        date: '1967-03-13'
        thread: defense-soviet-forces
        c: Memorandum to holders of NIE 11-8-66. A review of the Soviet submarine order of battle. On Oct. 1, 1966, 36 ballistic missile submarines, 7 nuclear, about 100 launchers, not some 45 and 130; about 265 cruise missile launchers, not 250.
        n: '[FRUS 1964–68, X, doc. 174](https://history.state.gov/historicaldocuments/frus1964-68v10/d174). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
        tags: [name:helms-richard]
  - add:
      entry:
        id: cal.1968-10-03.defense-soviet-forces
        when: Oct. 3
        date: '1968-10-03'
        thread: defense-soviet-forces
        c: NIE 11-8-68, Soviet Strategic Attack Forces. About 900 operational ICBM launchers, to surpass the American force in numbers by 1970; a force goal of 1,100–1,500. About 700 medium and intermediate launchers. Six, perhaps seven, Y-class submarines of 16 tubes built.
        n: '[FRUS 1964–68, X, doc. 217](https://history.state.gov/historicaldocuments/frus1964-68v10/d217). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
        tags: [name:helms-richard]
