patch: 2026-11-12-b9-group-6
by: 'Claude (batch 9, group 6: Gibbons IV, Jones, Kabaservice, Kotz, MACV Command History 1964, Marolda, Perlstein, Stein, Miller; the "already in" rows), Nov. 11, 2026'
ops:
- add:
    entry:
      id: cal.1967-09-08.vietnam-pennsylvania
      when: Sept. 8
      date: '1967-09-08'
      thread: vietnam-pennsylvania
      c: 'Paris. Marcovich and Aubrac tell Mai Văn Bộ that Kissinger will come to Paris for about ten days from Sept. 9. Bộ: if Hanoi is not bombed, "something could well happen" in that time.'
      n: '[[w.gibbons-u-s-government-and]], IV, 779. To check: [[w.herring-secret-diplomacy-of-the]], 736 (cited by [[w.gibbons-u-s-government-and]], IV, 779 n.54). See [[cal.1967-09-03.vietnam-pennsylvania]]. Names: Mai Văn Bộ, Marcovich, Aubrac, Kissinger.'
      tags:
      - name:mai-van-bo
      - name:marcovich-hebert
      - name:aubrac-raymond
      - name:kissinger-henry-a
- add:
    entry:
      id: cal.1968-08-05.elections-1968-miami-13
      when: Aug. 5–8
      date: '1968-08-05'
      thread: elections-1968-miami
      c: 'Miami Beach. F. Clifton White, by his later account, asks Thurmond why he backs Nixon rather than Reagan: if the South did not back Nixon, Rockefeller might get the nomination. White: the delegates would back Reagan on a second ballot. Thurmond: "Well, you may be right, son, but we just cain''t take that chance and let Rockefeller slip in."'
      n: '[[w.kabaservice-rule-and-ruin]], 242 (White "recalled" the exchange; no day). To check: [[w.white-politics-as-a-noble]], 177 (cited by [[w.kabaservice-rule-and-ruin]], 242 n.83). Check: the day. See [[cal.1968-08-07.elections-1968]]. Names: F. Clifton White, Thurmond, Nixon, Reagan, Rockefeller.'
      tags:
      - name:white-f-clifton
      - name:thurmond-strom
      - name:nixon-richard-m
      - name:reagan-ronald
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1964-09.elections-1964-johnson-9
      when: Sept.
      date: 1964-09
      thread: elections-1964-johnson
      c: 'The Democrats'' five-minute spot "Confessions of a Republican": a young man to the camera, "I''ve always been a Republican. But when we come to Senator Goldwater, now it seems to me we''re up against a very different kind of man. . . . Those people who got a hold of that convention—who are they?" On the Klan: "when the head of the Ku Klux Klan with all those weird groups come out in favor of the candidate of my party, either they''re not Republicans or I''m not."'
      n: '[[w.perlstein-before-the-storm]], 433. Check: the day and the month. See [[cal.1964-09-12.elections-1964]]. Names: Goldwater.'
      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-09.elections-1964-johnson-10
      when: Sept.
      date: 1964-09
      thread: elections-1964-johnson
      c: 'The Democrats'' spot of discarded posters on a floor littered with confetti: "Back in July in San Francisco the Republicans held a convention." Rockefeller said Goldwater''s positions "spell disaster for the party and the country"; Scranton called Goldwaterism "a crazy quilt collection of absurd and dangerous propositions."'
      n: '[[w.perlstein-before-the-storm]], 433. Check: the day and the month. See [[cal.1964-09-12.elections-1964]]. Names: Rockefeller, Scranton.'
      tags:
      - name:rockefeller-nelson
      - name:scranton-william-w
- add:
    entry:
      id: cal.1964-09.elections-1964-johnson-11
      when: Sept.
      date: 1964-09
      thread: elections-1964-johnson
      c: 'The Democrats'' spot on Goldwater''s line of the 1930s: the country would be better off if the entire Eastern Seaboard were sawed off. A graphic shows it.'
      n: '[[w.perlstein-before-the-storm]], 433–34 (the line from Goldwater''s remark on needing a New York bank account, "unearthed" by Graham Molitor''s staff). Check: the day and the month. See [[cal.1964-09-12.elections-1964]]. Names: Goldwater.'
      tags:
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-09.elections-1964-johnson-12
      when: Sept.
      date: 1964-09
      thread: elections-1964-johnson
      c: 'The Democrats'' spot of two hands taking a Social Security card from a wallet and tearing it in two: "On at least seven occasions Senator Barry Goldwater said that he would change the present Social Security system. But even his running mate, William Miller, admits that Senator Goldwater''s voluntary plan would destroy the Social Security system. President Johnson is working on strengthening Social Security."'
      n: '[[w.perlstein-before-the-storm]], 434. Check: the day and the month. See [[cal.1964-09-12.elections-1964]]. Names: Goldwater, Miller, Johnson.'
      tags:
      - name:goldwater-barry-m
      - name:miller-william-e
      - name:johnson-lyndon-b
- cite:
    id: cal.1964-07-21.king
    item: '[[w.kotz-judgment-days]], 179 (Tuesday afternoon, Greenwood: King, with FBI agents about him, walks the Black neighborhood, looks in at the Van Pool Room and the Red Rooster juke joint, and speaks from a bench before the Savoy Café: "Mississippi has treated the Negro as if he is a thing, instead of a person"; his plane met at Jackson by FBI agents; not the airport words, the mass meetings or Abernathy)'
    units: '?'
- variant:
    id: cal.1964-07-21.king
    unit: E
    witness: w.kotz-judgment-days
    reads: the leaflets from a small plane over the Elks Lodge in Jackson the following night (July 22), addressed to the "Rt. Rev. Inciter King" and signed "The White Knights of the Ku Klux Klan of Mississippi"
    at: 179–80
- cite:
    id: cal.1964-07-22.king
    item: '[[w.kotz-judgment-days]], 179 (the following night, in Jackson, at the Elks Lodge, before one thousand: King calls on Johnson to send federal marshals to Mississippi to protect the right to register and vote; not the Masonic Temple, the words quoted or "the conscience of America")'
    units: '?'
- variant:
    id: cal.1964-07-22.king
    unit: A
    witness: w.kotz-judgment-days
    reads: the Elks Lodge, Jackson, one thousand people
    at: '179'
- to-check:
    id: cal.1964-07-22.king
    add: New York Times, July 23, 1964, p. 15 (cited by [[w.kotz-judgment-days]], 180 n.44)
- cite:
    id: cal.1964-07-22.mississippi
    item: '[[w.kotz-judgment-days]], 180 (Eastland on the Senate floor charged "a Communist conspiracy to further or participate in the invasion of Mississippi" and read out a list of alleged Communist agitators in his State, from Hoover''s reports to Johnson; King answered "the next day"; not the poverty bill, the missing men, the FBI, the Denver crash or Cronkite)'
    units: '?'
- variant:
    id: cal.1964-07-22.mississippi
    unit: C
    witness: w.kotz-judgment-days
    reads: 'the next day: "There are as many Communists in this movement as there are Eskimos in Florida"'
    at: '180'
- to-check:
    id: cal.1964-07-22.mississippi
    add: Mark Stern, *Calculating Visions*, 166 (cited by [[w.kotz-judgment-days]], 180 n.45); New York Times, July 23, 1964, p. 15; UPI-22, July 24, 1964 (cited by [[w.kotz-judgment-days]], 180 n.45)
- cite:
    id: cal.1964-07-24.king
    item: '[[w.kotz-judgment-days]], 180 (Friday morning, FBI men about King and his staff on the road to Philadelphia; at Philadelphia King visits the ruins of the Mount Zion Methodist Church and meets the farmer Bud Cole; in "the black community center," after eight ball with Robert Hudson, King on a bench: "Three young men came here to help set you free"; to the community''s fear for the three missing men: "we''ve got to shed ourselves of fear"; not the caravan or press cars, the numbers, the "long since murdered," the Freedom Democratic Party, Lewis, the farmhouse or Meridian)'
    units: '?'
- to-check:
    id: cal.1964-07-24.king
    add: New York Times, July 25, 1964, p. 9 (cited by [[w.kotz-judgment-days]], 180 n.47)
- cite:
    id: cal.1961-01-28.vietnam
    item: '[[w.marolda-united-states-navy-and]], 98–99 (Lansdale, after his visit of Jan. 2–14, in a pessimistic report read by Kennedy on Feb. 2: unless the Vietnamese mobilized and the United States revitalized its support, "the free Vietnamese and their government probably will be able to do no more than postpone eventual defeat"; Vietnam to be treated "as a combat area of the cold war"; not the plan, the approval or the meeting of Jan. 28)'
    units: '?'
- to-check:
    id: cal.1961-01-28.vietnam
    add: Memo, Assistant SECDEF for Special Operations to SECDEF, Jan. 17, 1961 (cited by [[w.marolda-united-states-navy-and]], 99 n.29)
- cite:
    id: cal.1964-09-12.elections-1964
    item: '[[w.perlstein-before-the-storm]], 432 (a girl intently licking an ice-cream cone; the maternal voice-over on strontium 90 and cesium 137; "Now there''s a man who wants to be President of the United States . . . His name is Barry Goldwater. If he''s elected, they might start testing all over again"; Geiger-counter clicks; not the day, "second," "Daisy," children killed, the vote against the treaty or "shown once")'
    units: '?'
- variant:
    id: cal.1964-09-12.elections-1964
    unit: C
    witness: w.perlstein-before-the-storm
    reads: '"His name is Barry Goldwater. If he''s elected, they might start testing all over again" (no "so"; no vote against the treaty)'
    at: '432'
