      n: '[FRUS 1961–63, IV, doc. 158](https://history.state.gov/historicaldocuments/frus1961-63v04/d158). [[w.miller-misalliance]], 300–01 (Taylor and McNamara with Diệm for nearly two hours; McNamara on the political crisis and Madame Nhu''s words; not Lodge or Harkins); [[w.moyar-triumph-forsaken]], 254; [[w.mcnamara-in-retrospect]], ch. 3 at nn.34–36 (three hours, then a formal dinner; Nhu absent; Diệm rises to Madame Nhu''s defense; McNamara: "This is not satisfactory"). [[w.reeves-president-kennedy]], 609 (the meeting at the palace); [[w.taylor-swords-and-plowshares]], 298–99 (the final call on Diệm, McNamara speaking, Lodge translating; Diệm defends his acts; Taylor''s letter promised). See [[cal.1963-09-21.vietnam]]. Made public, in part: [[w.pentagon-papers]], vol. 2, 749–51 (1971). Names: Diệm, McNamara, Taylor, Lodge, Harkins, Trần Lệ Xuân.'
