      n: 'The House sat from noon to 1:16 p.m.: [Daily Digest, D577](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=575). Address Before a Joint Session of the Congress, [1963–64 Pub. Papers 8](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=92) (Nov. 27, 1963). Recording (K–J Adm. II.I). [President''s Daily Diary, Nov. 27, 1963](https://catalog.archives.gov/id/192435), image 1 (LBJ Library; National Archives Catalog). [[w.stein-fiscal-revolution-in-america]], 452 (the tax bill: "No act of ours could more fittingly continue the work of President Kennedy than the early passage of the tax bill"; not the civil rights bill or the order); [[w.dallek-flawed-giant]], 56, 60; [[w.mann-walls-of-jericho]], 383–84 (the address; the civil rights bill); [[w.white-making-of-the-president-1965]], 46 (the drafters, Sorensen, Bundy, Galbraith, Fortas, Moyers, Busby; Johnson''s own line in pencil, Wednesday morning: "For thirty-two
        years, Capitol Hill has been my home"); [[w.kotz-judgment-days]], 32–33; [[w.zelizer-fierce-urgency-of-now]], 77–78; [[w.bernstein-guns-or-butter]], 24 (the drafts; "let us continue"; the civil rights bill); [[w.cohen-american-pharaoh]], 310 (Daley one of four guests with Mrs. Johnson and her daughters); [[w.whalen-longest-debate]], 78–79 (12:31 p.m.; "no memorial oration or eulogy could more eloquently honor President Kennedy''s memory than the earliest passage of the civil rights bill"); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 499 (South Vietnam to West Berlin); [[w.humphrey-education-of-a-public-1976]], 273 (the appeal for the civil rights bill: "No memorial or eulogy could more eloquently honor President Kennedy"); [[w.white-suite-3505]], 258 (Nov. 27, two days after the funeral; the "earliest possible passage" of civil rights and the tax cut; the dollar; a military "second to none"). [[w.caro-passage-of-power]], 399, 427–33; [[w.young-two-suns-of-the]], 110–12 (the address);
        [[w.branch-pillar-of-fire]], 178. See [[cal.1963-11-22.succession]]; [[cal.1963-06-11.civil-rights-bill]]; [[cal.1963-01-24.economy]].'
