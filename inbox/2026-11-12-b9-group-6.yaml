      n: 'White House Statement Following the Return of a Special Mission to South Viet-Nam, [1963 Pub. Papers 759](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=817) (Oct. 2, 1963). FRUS 1961–63, IV, docs. [167](https://history.state.gov/historicaldocuments/frus1961-63v04/d167), [169](https://history.state.gov/historicaldocuments/frus1961-63v04/d169); doc. [170](https://history.state.gov/historicaldocuments/frus1961-63v04/d170). Report of McNamara and Taylor to the President (Viet. II.I.3). The meetings, recorded: [11 a.m.](https://prde.upress.virginia.edu/conversations/4022293), JFK Meeting Tape 114_A49.2; [6:05 p.m.](https://prde.upress.virginia.edu/conversations/4022294), JFK Meeting Tape 114_A49.4 (PRDE only). [[w.miller-misalliance]], 300–02 (the report to Kennedy: the political situation "deeply serious"; the thousand-man withdrawal over the next three months; not the NSC, the White House statement or its words on 1965); [[w.gibbons-u-s-government-and]],
        II, 184–85; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 289 (the report; the 1,000 men); [[w.schulimson-joint-chiefs-of-staff]], 379–81 (the report, the meetings, the 1,000); [[w.futrell-united-states-air-force]], 190 (the report and the NSC; the war''s end in 1965; the thousand men); [[w.moyar-triumph-forsaken]], 254–55; [[w.mcnamara-in-retrospect]], ch. 3 at nn.37–40 (the hour''s briefing that morning: "we must have a means of disengaging from this area"; the NSC in the evening; Kennedy objects to "by the end of the year"; the statement released by Salinger). [[w.selverstone-kennedy-withdrawal]], 167–82 (the report; the morning meeting and the NSC, from the Miller Center''s draft transcripts; the statement); [[w.taylor-swords-and-plowshares]], 299 (the report to the President and the NSC, Oct. 2; the White House statement, the 1965 target and the reduction); [[w.zaroulis-who-spoke-up]], 13 (McNamara predicts most troops home by December 1965; the White House statement, quoted in
        part); [[w.schlesinger-robert-kennedy-and-his]], 716 (the McNamara-Taylor report: "This is a Vietnamese war," and the country and the war "must, in the end, be run solely by the Vietnamese"; it recommends the immediate withdrawal of 1000 advisers by the end of 1963; the sentence on troop withdrawal deleted, then restored on McNamara''s direction after he and Taylor were taken into the Oval Office by Kennedy; Kennedy to McNamara: "And tell them that means all the helicopter pilots too"; no day). [[w.reeves-president-kennedy]], 611–14 (the report; the statement). To check: [[w.selverstone-its-a-date]]; msgs, 2d AD to PACAF, Sep 29 and 30, 1963, and Oct 2, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27b); PACAF to 2d AD, Oct 9, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27c); ltrs, Frederick W. Flott to Harbin, Oct 2, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27d); Wade to CHMAAGV, Sep 30, 1963 (cited by [[w.futrell-united-states-air-force]],
        190 n.27e); William Sullivan, oral history 2, Kennedy Library (cited by [[w.reeves-president-kennedy]], 611); Salinger, press briefing, Oct. 2, 1963, National Security Files, box 314, Kennedy Library (cited by [[w.reeves-president-kennedy]], 614). See [[cal.1963-09-21.vietnam]]. Names: McNamara, Taylor.'
