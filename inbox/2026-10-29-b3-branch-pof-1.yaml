      date: '1964-06-25'
      thread: desegregation-public-places
      c: 'St. Augustine. A second wade-in beaten; at night, after Lynch and Stoner''s rally of some five hundred, segregationists
        break through the police at the Old Slave Market and beat the marchers. King to Clarence Jones by telephone, by the
        FBI''s tap: "This is the worst night we''ve ever had," forty hurt badly enough for treatment. That morning Johnson
        had put off King''s call: "Tell him I''ve sent eight helicopters down there," to Mississippi.'
      n: '[[w.branch-pillar-of-fire]], 375–79. To check: "Report on St. Augustine, Florida," by Rev. Elizabeth J. Miller,
        A/KP20f43 (cited by [[w.branch-pillar-of-fire]], 376); Jacksonville LHM dated June 26, 1964, FSA-NR, p. 3 (cited by
        [[w.branch-pillar-of-fire]], 377); NY LHM dated June 26, 1964, FSA-NR (cited by [[w.branch-pillar-of-fire]], 379);
        Tobias Simon to Honorable Bryan Simpson, June 29, 1964, Simpson Papers, UF (cited by [[w.branch-pillar-of-fire]],
        379). See [[cal.1964-06-20.desegregation-public-places]]. Names: Martin Luther King, Johnson.'
