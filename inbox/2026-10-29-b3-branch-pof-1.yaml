      thread: march-on-washington
      c: 'King, Clarence Jones and Levison by telephone, overheard on the FBI''s tap: King, of Wilkins''s arrest, "We''ve
        baptized brother Wilkins!"; "We are on a breakthrough, and we need a mass protest." Randolph''s planned rally for
