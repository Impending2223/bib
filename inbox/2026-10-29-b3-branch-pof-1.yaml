      c: 'The Oval Office, 6:15 p.m. Royall and Blaik, the President''s emissaries to Birmingham, with the President and Robert
        Kennedy, off the record: well received there; the bumper sticker "Kennedy for King—Goldwater for President." Their
        report put off.'
      n: '[[w.branch-pillar-of-fire]], 153. To check: The Blaik and Royall visit was scheduled for 6:15 to 6:35 p.m., October
        10, 1963, following the appointment of Soviet Foreign Minister Gromyko, Soviet Ambassador Dobrynin, Secretary of State
        Rusk, and U.S. Ambassador to Moscow Thompson: Appointments schedule, JFK. Newspaper reports said the visit actually
        lasted more than an hour: NYT, Oct. 11, 1963, p. 25 (cited by [[w.branch-pillar-of-fire]], 153); Earl Blaik Oral History,
        JFK (cited by [[w.branch-pillar-of-fire]], 153); Blaik to Marshall, Nov. 1, 1963, Box 18, Marshall Papers, JFK (cited
        by [[w.branch-pillar-of-fire]], 153). See [[cal.1963-09-19.alabama]]. Names: Royall, Blaik, Kennedy, Robert Kennedy.'
