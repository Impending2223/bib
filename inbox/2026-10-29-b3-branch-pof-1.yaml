      when: June 8
      date: '1964-06-08'
      thread: mississippi
      c: 'Washington, the National Theater. COFO''s citizens'' hearing on Mississippi, Moses presenting the witnesses: Guyot,
        Elizabeth Allen on her husband''s murder, Hartman Turnbow, Fannie Lou Hamer; a panel of Northern writers and educators
        to report. The goal, to members of Congress: "Federal preventative action before any more names are added to the list
        of civil rights martyrs."'
      n: '[[w.branch-pillar-of-fire]], 329–30. To check: Summary of June 8 hearing prepared by Judge Justine Polier, A/SN100f14
        (cited by [[w.branch-pillar-of-fire]], 329); COFO notice to members of the United States Congress, June 3, 1964, cited
        in Holt, The Summer That Didn''t End, pp. 204-7 (cited by [[w.branch-pillar-of-fire]], 329); Elizabeth Allen testimony
        of June 8, 1964, reprinted in Congressional Record, Jane 16, 1964, photocopied in A/SN111f17, p. 5 (cited by [[w.branch-pillar-of-fire]],
        329). See [[cal.1964-01-31.mississippi]]. Names: Moses, Guyot, Hamer.'
