    - name:wang-dongxing
- add-words:
    id: cal.1966-08-19.jobs-and-wages-airlines
    after: end
    words: Ackley puts the settlement at 4.9 percent, against the 3.2 percent guidepost. The machinists' president, Siemiller, says it "destroy[ed] all existing wage and price guidelines."
