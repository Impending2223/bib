patch: 2026-11-26-notes-pass-08
by: reader (notes pass 08)
ops:
- add-words:
    id: cal.1966-08-12.china-leadership
    after: It confirms the May removals from the Secretariat ... adds Xie Fuzhi and Liu Ningyi as secretaries.
    words: 'Removed from the Secretariat: Peng Zhen 彭真, Luo Ruiqing 罗瑞卿 and Lu Dingyi 陆定一, and Yang Shangkun 杨尚昆 as alternate.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1930'
- add-words:
    id: cal.1966-08-12.china-leadership
    after: 'and enlarges the Standing Committee ... (new: Tao, Chen Boda, Kang, Li Fuchun).'
    words: 'The 74 full members vote by secret ballot: all for Mao, Lin Biao, Deng and Kang Sheng, all but one for Zhou, Chen Boda and Tao Zhu; Li Fuchun 70, Zhu De 68, Liu Shaoqi 65, Chen Yun 58; Li Xiannian, not on the ballot, 1. Mao''s order, fixed with Lin, Zhou and Jiang Qing, overrides the vote.'
    item: '[[w.macfarquhar-maos-last-revolution]], 94'
