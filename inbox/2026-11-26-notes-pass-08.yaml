- add-words:
    id: cal.1966-08-18.china-leadership-4
    after: end
    words: 'Yang counts 1,500 students taken up on the rostrum with Mao''s consent; Zhou Enlai tells them their tasks: to be received by the Chairman, then to go down and keep order.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 241'
- add-words:
    id: cal.1966-08-18.china-leadership-4
    after: end
    words: The order fails; Mao, hemmed in, shakes hands without pause, and by Wang Dongxing's account his hand is so swollen that for days he cannot write. Yang has him receive over 3,000 Red Guards on the rostrum.
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 241'
