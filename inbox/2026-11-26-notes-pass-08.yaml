- add-words:
    id: cal.1966-08-13.china-leadership
    after: end
    words: Lin Biao presides. He calls for a few months of uproar, a sweep of "ghosts and monsters," some officials removed, some promoted, some protected.
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 48'
- add-words:
    id: cal.1966-08-13.china-leadership
    after: end
    words: He says he is "downhearted," his ability not equal to his post, and that the Chairman's instructions are to be carried out "whether we understand them or not."
    item: '[[w.macfarquhar-maos-last-revolution]], 98'
- add-words:
    id: cal.1966-08-13.china-leadership
    after: end
    words: The conference goes on criticizing Liu Shaoqi; Deng Xiaoping is criticized too.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1930'
