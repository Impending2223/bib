        061925Z Jan 67, "ARC LIGHT"; JCS to CINCPAC, 172007Z Jan 67; SAC to CINCPAC, 162200Z Jan 67, "Use of ARC LIGHT Forces"
        (cited by [[w.macv-command-history-1967]], 404 n.112). Names: Sharp, Westmoreland.'
