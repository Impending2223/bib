      when: Apr. 25
      date: '1967-04-25'
      thread: vietnam
      c: Lodge leaves Saigon after his second tour of 20 months; Bunker arrives the same day.
      n: '[[w.macv-command-history-1967]], 584. Names: Lodge, Bunker.'
