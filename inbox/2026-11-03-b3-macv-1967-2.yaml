      when: Nov. 15
      date: '1967-11-15'
      thread: vietnam-operations
      c: Đắk Tô. An enemy mortar attack on the airfield destroys two C-130s and most of an ammunition dump. Northeast of the
        town, the 3d Battalion, 42d South Vietnamese Regiment, fights on from Nov. 14, two more battalions committed.
      n: '[[w.macv-command-history-1967]], 378. See [[cal.1967-11-03.vietnam]].'
