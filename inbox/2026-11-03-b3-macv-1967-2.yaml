      date: '1967-08-11'
      thread: vietnam-air-war
      c: SAC tells its units at home to be ready to send nine more B-52s to Guam on short notice for a rate of 900 sorties,
        after III MAF asks more B-52 strikes against the buildup in and north of the DMZ and the artillery threatening Dye
        Marker.
