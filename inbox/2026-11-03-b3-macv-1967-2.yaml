      when: June 19
      date: '1967-06-19'
      thread: vietnam-operations
      c: Coronado. The whole Mobile Riverine Force's first major action, a riverine assault into Long An with the 3d Brigade,
        9th Division, blocking; 256 of the enemy, the 5th Viet Cong Battalion, killed the first day. Coronado ends July 25,
        478 killed.
      n: '[[w.macv-command-history-1967]], 395–96 (COMNAVFORV, 483: in Cần Giuộc District, June 19–20, the toughest fight
        yet, over 250 of the enemy killed, 46 Americans, 140 wounded). To check: CG II FFORCEV to COMUSMACV, letter, "Monthly
        Evaluation Report, Jun 67," July 16, 1967 (cited by [[w.macv-command-history-1967]], 396 n.91). See [[cal.1967-06-04.vietnam-operations]].'
