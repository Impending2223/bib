      thread: vietnam
      c: The Joint Chiefs find Westmoreland's herbicide requirements supportable, but orange and white herbicides by July
        1 no more than 5.3 million gallons from current production unless the cabinet acts; fiscal 1968's nine million gallons
        not to be met, 3.65 million by the end of 1967.
