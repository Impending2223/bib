      thread: japan-and-korea-korean-troops
      c: 'Sharp to Westmoreland on the talks with Seoul: Korea willing to send a "light division" of two brigades, 11,000
        men, part of the spaces from replacing 5,000 Korean logistics troops. Johnson has discussed the requirements with
        Park, promising an answer by Jan. 1, 1968; Park to try to have the troops in Vietnam by Mar. 1.'
      n: '[[w.macv-command-history-1967]], 263–64. Names: Sharp, Westmoreland, Johnson, Park.'
