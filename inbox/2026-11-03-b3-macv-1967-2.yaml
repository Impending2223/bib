      when: Feb. 27
      date: '1967-02-27'
      thread: vietnam-operations
      c: The first attack with Soviet 140mm rockets, by a Viet Cong–North Vietnamese artillery battalion, on the Đà Nẵng air
        base. Rockets on the base again July 15.
      n: '[[w.macv-command-history-1967]], 91, 79.'
