      when: May 11
      date: '1967-05-11'
      thread: vietnam
      c: Bunker's press conference in Saigon. The Mission's responsibility for Revolutionary Development integrated under
        one manager, Westmoreland, under the Ambassador's overall authority, as decided at Guam; the civil operations reorganized.
      n: '[[w.macv-command-history-1967]], 585. See [[cal.1967-05-09.vietnam]]. Names: Bunker, Westmoreland.'
