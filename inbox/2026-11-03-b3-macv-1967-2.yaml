      thread: vietnam-operations
      c: The SS *President Buchanan* hit by recoilless-rifle fire twelve miles northwest of Vũng Tàu on the channel to Saigon;
        river patrol boats, Navy helicopters and Regional Forces kill 23 of the enemy. Nov. 15, a Nationalist Chinese merchantman
        hit ten miles southeast of Nhà Bè.
