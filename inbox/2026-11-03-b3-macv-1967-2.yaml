      when: May 26
      date: '1967-05-26'
      thread: vietnam
      c: Westmoreland and the chief of the Joint General Staff agree that the United States will provide up to $42 million
        in foodstuffs for the South Vietnamese forces' commissaries, 1,200 tons a month from Sept. 1, sold below the local
        market.
