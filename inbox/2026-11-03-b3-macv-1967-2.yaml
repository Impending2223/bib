      date: '1967-03-19'
      thread: vietnam-operations
      c: Pershing, the Bồng Sơn plains. The 1st Battalion, 8th Cavalry, meets an enemy battalion; two battalions of the 5th
        Cavalry air-assault to reinforce, Mar. 20–21. The enemy breaks contact at 10 p.m. Mar. 21, leaving 159 dead. 969 of
        the enemy killed in Pershing so far.
      n: '[[w.macv-command-history-1967]], 373 (Mar. 6–7, two engagements of the 2d Brigade with companies of the 8th North
