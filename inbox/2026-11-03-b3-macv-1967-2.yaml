    entry:
      id: cal.1966-10-13.vietnam
      when: Oct. 13
      date: '1966-10-13'
      thread: vietnam
      c: 'Westmoreland to Sharp and the Joint Chiefs, "Military Planning and Operations in SVN": the successes and the buildup
        allow a new phase into 1967, a general offensive in support of security and Revolutionary Development, units to stay
        with their tactical areas of responsibility; the SLAM concept against infiltration through Laos; the roads to be opened
        and secured.'
      n: '[[w.macv-command-history-1967]], 319, 324–26 (the History, "In mid-October 1966"). To check: COMUSMACV to CINCPAC,
        130317Z Oct 66 (cited by [[w.macv-command-history-1967]], 319 n.6). Names: Westmoreland, Sharp.'
      src:
        c: 66e3de11
        rows:
        - 'w.macv-command-history-1967 319, 324–26: all'
        - 'via w.macv-command-history-1967 319 n.6: all'
      tags:
      - name:westmoreland-william
      - name:sharp-u-s-grant
