      date: '1967-03-10'
      thread: vietnam-operations
      c: Junction City. A night mortar and ground attack on the 2d Battalion, 2d Infantry; three Americans killed, 38 wounded,
        197 of the enemy found dead the next morning. Phase I ends at midnight Mar. 17; Phase II, in eastern War Zone C, from
        12:01 a.m. Mar. 18.
      n: '[[w.macv-command-history-1967]], 388. See [[cal.1967-02-22.vietnam]].'
