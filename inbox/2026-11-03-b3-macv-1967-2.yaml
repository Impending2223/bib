      when: Oct. 10
      date: '1967-10-10'
      thread: vietnam-force-levels
      c: The Joint Chiefs tell Sharp the South Vietnamese forces' fiscal 1968 structure of 685,739 is approved, contingent
        on Saigon's mobilization measures; some equipment limits to come.
      n: '[[w.macv-command-history-1967]], 188. See [[cal.1967-06-03.vietnam-force-levels]]. Names: Sharp.'
      src:
        c: fc368bce
        rows:
