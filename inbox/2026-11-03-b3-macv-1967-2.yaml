      c: The 1st Cavalry's 3d Brigade sent from Pershing to Greeley; by June's end Pershing counts 2,345 of the enemy killed.
        The brigade rejoins July 27; by August's end, 3,090.
      n: '[[w.macv-command-history-1967]], 374–75. To check: CG I FFORCEV to COMUSMACV, letter, "Monthly Evaluation Report,
