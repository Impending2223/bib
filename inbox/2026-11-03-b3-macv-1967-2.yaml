- add:
    entry:
      id: cal.1967-04-06.vietnam-operations
      when: Apr. 6
      date: '1967-04-06'
      thread: vietnam-operations
      c: Enemy battalions attack South Vietnamese units in the Quảng Trị–La Vang area; the MACV compound at Quảng Trị and
        the Triệu Phong and Hải Lăng district headquarters mortared; 220 detainees freed from the Quảng Trị jail.
      n: '[[w.macv-command-history-1967]], 335–36 (early April, 285 rounds of 82mm mortar fire on Gio Linh''s artillery in
        six attacks; the cumulative friendly casualties 149 killed, 242 wounded). To check: COMUSMACV, 090850Z Apr 67, "SPHINX
        Report" (cited by [[w.macv-command-history-1967]], 336 n.18).'
      src:
        c: cb1fc89d
        rows:
