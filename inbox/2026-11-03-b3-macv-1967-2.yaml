      when: Jan. 29
      date: '1967-01-29'
      thread: japan-and-korea-korean-troops
      also:
      - vietnam-operations
      c: The Korean 9th (White Horse) Division begins Paeng Ma I against the 18B North Vietnamese Regiment and local forces
        in Khánh Hòa, by surprise and vertical encirclement. It ends Mar. 5, 433 of the enemy lost, 19 Koreans killed; Westmoreland
        congratulates the division.
      n: '[[w.macv-command-history-1967]], 379–80. To check: Senior Observer to CG I FFORCEV, letter, Apr. 12, 1967 (cited
        by [[w.macv-command-history-1967]], 380 n.67). Names: Westmoreland. Check: the History prints the name "PENG MA I".'
      src:
        c: 92b0779d
        rows:
        - 'w.macv-command-history-1967 379–80: all'
      tags:
      - name:westmoreland-william
      - province:khanh-hoa
