      when: Aug. 20
      date: '1967-08-20'
      thread: vietnam-force-levels
      c: 'Sharp approves Westmoreland''s request to keep the 9th Marine Amphibious Brigade''s elements in Vietnam to Nov.
        1, not withdraw the second Special Landing Force by Sept. 1. Westmoreland: the enemy has not changed his strategy
        of gaining control of the northern two provinces; disrupting the elections a known objective.'
