      when: Oct. 21
      date: '1967-10-21'
      thread: vietnam-force-levels
      c: Westmoreland tells the chief of the Joint General Staff of the new ceiling and releases spaces at once for an infantry
        regiment, two military police prisoner-of-war camp companies and two reconnaissance companies; the rest by a schedule
        worked out together.
      n: '[[w.macv-command-history-1967]], 188. See [[cal.1967-10-10.vietnam-force-levels]]. Names: Westmoreland.'
