      when: Oct. 9
      date: '1967-10-09'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: The *CBS Evening News*. Don Webster's report, with John Smith's film, of an American soldier near Lai Khê, Oct. 7,
        trying to cut off a dead Viet Cong's ear; Sevareid comments.
      n: '[[w.macv-command-history-1967]], 965–66. Names: Cronkite, Sevareid.'
      src:
        c: b02c8499
        rows:
        - 'w.macv-command-history-1967 965–66: all'
      tags:
      - name:cronkite-walter
      - name:sevareid-eric
    section: '196710'
- add:
    entry:
      id: cal.1967-12-22.vietnam
      when: Dec. 22
      date: '1967-12-22'
      thread: vietnam
      c: The 1st Infantry Division convenes two special courts-martial on the soldiers charged with cutting and trying to
        cut ears from dead Viet Cong; both found guilty. Smith, the cameraman said to have furnished the knife, subpoenaed
        as a witness and absent, the embassy against further action.
      n: '[[w.macv-command-history-1967]], 966. See [[cal.1967-10-09.press-and-broadcasting]].'
      src:
        c: 10a00d2c
        rows:
        - 'w.macv-command-history-1967 966: all'
    section: '196712'
