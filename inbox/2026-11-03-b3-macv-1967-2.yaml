      when: July 9
      date: '1967-07-09'
      thread: japan-and-korea-korean-troops
      also:
      - vietnam-operations
      c: Hong Kil Dong begins in Phú Yên, elements of the Korean 9th and Capital Divisions against the 95th and 183d North
        Vietnamese Regiments and the 85th Viet Cong Battalion; four battalions air-assaulted the first day. It ends Aug. 28,
        638 of the enemy killed.
      n: '[[w.macv-command-history-1967]], 381–82 (by July 28, 127 tactical air sorties and 18 B-52 missions, 373 killed).
        To check: Westmoreland to Taylor, memorandum, "Operation HONG KIL DONG," July 28, 1967 (cited by [[w.macv-command-history-1967]],
        382 n.69). Check: the note''s Taylor.'
      src:
        c: 1605c860
        rows:
        - 'w.macv-command-history-1967 381–82: all'
        - 'via w.macv-command-history-1967 382 n.69: all'
      tags:
