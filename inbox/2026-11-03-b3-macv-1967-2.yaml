- cite:
    id: cal.1967-05.vietnam-operations-2
    item: '[[w.macv-command-history-1967]], 359 (Hickory, May 17–28, north of Côn Thiên and Gio Linh, with the Special Landing
      Force''s Beau Charger and Belt Tight and the South Vietnamese Lam Sơn 54: "for the first time" search-and-destroy operations
      in the southern half of the DMZ; the civilians evacuated to a resettlement area)'
    units: A
