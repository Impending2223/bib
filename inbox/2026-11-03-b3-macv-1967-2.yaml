      date: '1967-02-13'
      thread: vietnam-operations
      c: The 1st Cavalry Division begins Pershing in northern Bình Định as Thayer II ends; the 1st and 3d Battalions, 5th
        Cavalry, engage a battalion of the 22d North Vietnamese Regiment northeast of Bồng Sơn. South Vietnamese operations
        in the area, Hòa Xuân 503 and the Marines' Avenger.
      n: '[[w.macv-command-history-1967]], 373.'
