      when: Aug. 24
      date: '1967-08-24'
      thread: vietnam-air-war
      c: Twelve B-52 sorties against the DMZ diverted under the new rule on a SAM signal; 36 more over the next two days.
        The rule asked two distinct coincident radar emissions; a single Fan Song signal received.
      n: '[[w.macv-command-history-1967]], 434.'
