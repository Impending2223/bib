      when: Oct. 31
      date: '1967-10-31'
      thread: vietnam-force-levels
      c: 'Westmoreland to Sharp: the 101st and the 11th Brigade, sent early, will lack mobility until Program 5''s helicopters
        come; the first of six assault helicopter companies due only in December 1968. He asks them by mid-1968. The Army:
        aircraft production and pilot training forbid it.'
