      date: '1967-02-19'
      thread: vietnam-force-levels
      c: 'Westmoreland has a contingency plan prepared, Oregon: a provisional division formed in the country to reinforce
        III MAF in the southern three provinces of I Corps, should the bulk of the Marines have to go north of the Hải Vân
        Pass.'
      n: '[[w.macv-command-history-1967]], 334–35 (the History, "In mid-February"). To check: COMUSMACV, 191230Z Feb 67, "Operation
