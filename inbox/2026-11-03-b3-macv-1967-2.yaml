      date: '1967-07-15'
      thread: vietnam-operations
      c: A North Vietnamese trawler bringing arms into Quảng Ngãi intercepted by Market Time units, fired on and run aground
        near the Batangan peninsula; a large amount of ammunition and supplies taken. Reported to have come from Hainan.
      n: '[[w.macv-command-history-1967]], 42.'
