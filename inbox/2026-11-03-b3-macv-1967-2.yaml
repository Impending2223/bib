      when: Dec. 23
      date: '1967-12-23'
      thread: vietnam-air-war
      c: Westmoreland concurs in the 3d Air Division's proposal for B-52s on target every four hours, six missions a day around
        the clock, a five-hour ground divert force at U Tapao in place of the nine-hour quick-reaction force, from the start
        of the 1,200 sortie rate.
