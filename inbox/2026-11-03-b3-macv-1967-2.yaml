      when: Dec. 9
      date: '1967-12-09'
      thread: vietnam-force-levels
      c: Westmoreland approves the activation schedule for the rest of the army's units in the fiscal 1968 structure, Jan.
        1 to Apr. 1, 1968, and the concept of SEER, a system for evaluating the South Vietnamese forces.
      n: '[[w.macv-command-history-1967]], 190, 193. See [[cal.1967-10-10.vietnam-force-levels]]. Names: Westmoreland.'
