      when: May 29
      date: '1967-05-29'
      thread: vietnam-operations
      c: Sơn Tịnh District, Quảng Ngãi. The Viet Cong burn a dispensary at a Catholic refugee camp, fire on the priest's house
        and kidnap five boys, apparently taken for Revolutionary Development workers; released unharmed.
      n: '[[w.macv-command-history-1967]], 78. Check: the History''s "San Tinh."'
