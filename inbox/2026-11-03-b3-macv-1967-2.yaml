      date: '1967-01-17'
      thread: vietnam-prisoners
      c: Westmoreland to the Deputy Ambassador, by memorandum, on the prisoner-of-war camps, the situation reaching a critical
        stage; he recommends the civilian element of the Mission work with Saigon to relieve it.
      n: '[[w.macv-command-history-1967]], 987–88. Names: Westmoreland.'
      src:
        c: e822886b
        rows:
        - 'w.macv-command-history-1967 987–88: all'
      tags:
      - name:westmoreland-william
    section: '196701'
- add:
    entry:
      id: cal.1967-08-22.vietnam-prisoners
      when: Aug. 22
      date: '1967-08-22'
      thread: vietnam-prisoners
      c: Phú Quốc island. Five hundred prisoners in a compound of the prisoner-of-war camp stage a silent rebellion, refusing
        to enter their barracks, after 18 who refused to work are punished; the Joint General Staff sends a board of officers.
      n: '[[w.macv-command-history-1967]], 991.'
      src:
        c: 97e4c3c1
        rows:
        - 'w.macv-command-history-1967 991: all'
    section: '196708'
