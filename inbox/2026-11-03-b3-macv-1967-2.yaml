      date: '1967-11-13'
      thread: vietnam-operations
      c: The Special Landing Force on Badger Hunt in Quảng Nam goes into Foster, under the 7th Marines; to Nov. 30, 125 of
        the enemy killed, 258 tactical air sorties, 11,668 refugees evacuated.
      n: '[[w.macv-command-history-1967]], 370.'
