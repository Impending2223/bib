    item: '[[w.macv-command-history-1967]], 378–79 (MacArthur''s first contact, Nov. 3, in northwestern Kontum near Đắk Tô;
      the fighting 10–15 miles west and southwest, Nov. 4–13, northeast from Nov. 14; to Nov. 30, Americans 289 killed against
      1,222 of the enemy, South Vietnamese 73 against 417)'
