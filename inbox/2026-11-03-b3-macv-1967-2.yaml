- add:
    entry:
      id: cal.1967-03-08.japan-and-korea-korean-troops
      when: Mar. 8
      date: '1967-03-08'
      thread: japan-and-korea-korean-troops
      also:
      - vietnam-operations
      c: Oh Jac Kyo, the largest Korean operation yet, seven battalions under the commander of the Korean forces, to join
        the Capital and White Horse Divisions' areas along the coast in Phú Yên. The link-up done in the first phase, to Apr.
        18; the Koreans responsible from Phan Rang to 40 kilometers north of Qui Nhơn. Results, 940 of the enemy killed, 44
        Koreans.
      n: '[[w.macv-command-history-1967]], 380–81. To check: Senior Observer to CG I FFORCEV, letter, "Final Report of US
        Observers Accompanying Cap ROK and 9th ROK Divs on Operation OH JAC KYO," Apr. 12, 1967 (cited by [[w.macv-command-history-1967]],
        380 n.67).'
      src:
        c: ab80e568
        rows:
        - 'w.macv-command-history-1967 380–81: all'
      tags:
      - province:phu-yen
      - place:qui-nhon
