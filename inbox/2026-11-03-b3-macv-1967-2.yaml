      date: '1967-12-11'
      thread: vietnam-air-war
      c: North Vietnam's air force combines MiG-17s and MiG-21s for the first time, in nine engagements; Dec. 13, fifteen.
        The airfields at Kiến An, Yên Bái, Hòa Lạc, Kép and Phúc Yên struck in December, all but Cát Bi operational at the
        month's end.
