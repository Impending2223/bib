      when: Jan. 24
      date: '1967-01-24'
      thread: vietnam
      c: 'Westmoreland''s command guidance for 1967 to his field commanders: "We have entered a new phase of the conflict
        and must reexamine our strategy"; mass, surprise and economy of force against main forces, local forces, the supply
        system, the guerrillas and the infrastructure; long-range combat patrols; security spreading radially from secure
        bases.'
      n: '[[w.macv-command-history-1967]], 326–30. To check: COMUSMACV, 241227Z Jan 67, "Command Guidance" (cited by [[w.macv-command-history-1967]],
        330 n.10). Names: Westmoreland.'
