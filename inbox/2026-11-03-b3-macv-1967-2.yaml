      date: '1967-12-09'
      thread: vietnam-force-levels
      c: The 11th Infantry Brigade's port of debarkation changed from Đà Nẵng to Qui Nhơn, the move on by road; the Americal
        Division its sponsor. It arrives late in December and goes to Đức Phổ.
