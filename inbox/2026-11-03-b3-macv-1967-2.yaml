    item: '[[w.macv-command-history-1967]], 389–90 (Phase III from mid-April; ended at 2400 May 14; 2,728 of the enemy killed,
      282 friendly troops from Feb. 22; 4,161 tactical air sorties; the largest airmobile operation of the war to date)'
    units: B-D
