        812th Regiment, 324B Division, driven from near Cam Lộ after three days' battle with two Marine battalions.
      n: '[[w.macv-command-history-1967]], 357–58. To check: COMUSMACV, 200951Z Mar 67, "USMACV OPREP 5/002"; CG III MAF,
