      date: '1967-06-04'
      thread: vietnam-operations
      c: The Mobile Riverine Force, the 2d Brigade, 9th Division, with the Navy's Task Force 117, begins Coronado in Định
        Tường.
      n: '[[w.macv-command-history-1967]], 395, 483. Check: the History, 483, has the Force committed June 1.'
