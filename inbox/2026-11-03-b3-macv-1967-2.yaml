      date: '1967-02-12'
      thread: vietnam-operations
      c: Thayer II ends after the Tet truce of Feb. 8–12, with 2,248 air sorties, 196 naval gunfire missions and 170 B-52
        missions in support; 1,757 of the enemy counted killed. Feb. 6, east of Bồng Sơn, the 3d Battalion, 40th South Vietnamese
        Regiment, kills 81 of a North Vietnamese battalion.
