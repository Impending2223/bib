      thread: vietnam-air-war
      c: 'Honolulu. Sharp''s working conference on the air war outside South Vietnam: Hanoi to be convinced a long war is
        intolerable; the war goods the enemy needs in the South to be destroyed at storage and distribution points in the
        North.'
