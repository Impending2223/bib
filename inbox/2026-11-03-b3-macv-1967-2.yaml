      when: June 20
      date: '1967-06-20'
      thread: vietnam-force-levels
      c: Four PGM gunboats formally transferred to the South Vietnamese navy; the third Navy gasoline barge under military
        assistance June 11. Sept. 25, the South Vietnamese PCE-03 takes a Market Time area off Phú Quốc.
