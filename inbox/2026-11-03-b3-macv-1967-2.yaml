      when: Aug. 7
      date: '1967-08-07'
      thread: vietnam-operations
      c: Fairfax. The 4th Battalion, 12th Infantry, and the 30th South Vietnamese Ranger Battalion air-assault into Hóc Môn
        District onto a Viet Cong company; 17 helicopters damaged, two destroyed.
      n: '[[w.macv-command-history-1967]], 384.'
