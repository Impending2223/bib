      id: cal.1966-08-26.vietnam
      when: Aug. 26
      date: '1966-08-26'
      thread: vietnam
      c: 'Westmoreland to Sharp, "Concept of Military Operations in SVN," for the northeast monsoon, Nov. 1, 1966, to May
        1, 1967: "a general offensive with maximum practical support to area and population security in further support of
        Revolutionary Development." American and allied forces to attack the main forces and invade the base areas, a shield
        behind which the South''s army turns to Revolutionary Development.'
      n: '[[w.macv-command-history-1967]], 323–24 (the History, "in late August"). To check: COMUSMACV to CINCPAC, 260242Z
        Aug 66, "Concept of Military Operations in SVN" (cited by [[w.macv-command-history-1967]], 324 n.8). Names: Westmoreland,
        Sharp.'
