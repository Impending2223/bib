      when: Apr. 22
      date: '1967-04-22'
      thread: vietnam-air-war
      c: Rolling Thunder Program 55 authorized; 56 on May 2. Program 54, of Feb. 24, held back by the weather; from 55 on,
        a steady effort in Route Package 6. In five weeks, Sharp reports at midyear, more damage in the northeast quadrant
        than in all before.
      n: '[[w.macv-command-history-1967]], 430. Names: Sharp.'
