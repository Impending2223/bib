      thread: vietnam-operations
      c: The 21st South Vietnamese Division's Dân Chí 315C in Chương Thiện against the 303d Main Force and the 10th Local
        Force Battalions on the Ô Môn canal, six miles north-northwest of Vị Thanh. The first day, 365 of the enemy killed,
