      thread: vietnam-operations
      c: Badger Tooth, on the Quảng Trị–Thừa Thiên border. Marines meet two companies of the 716th North Vietnamese Regiment
        in a fortified village and take it after a night's fighting; 48 Marines killed, 81 wounded. Fortress Ridge, Dec. 21–24,
