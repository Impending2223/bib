- add:
    entry:
      id: cal.1967-08-15.vietnam
      when: Aug. 15
      date: '1967-08-15'
      thread: vietnam
      c: 'Westmoreland''s "Concept for Employment of 1st Cav (-) During NE Monsoon": when more battalions come, the division
        relieved in the Pershing and Byrd areas to be a theater exploitation force where the weather is good; October to January,
        Military Region 6, the Mây Tào base area, War Zone D and Military Region 10; February and March 1968, the Đỗ Xá area;
        back to the coast, Quảng Ngãi, in April.'
      n: '[[w.macv-command-history-1967]], 338–39. To check: COMUSMACV, 150855Z Aug 67, "Concept for Employment of 1st Cav
        (-) During NE Monsoon" (cited by [[w.macv-command-history-1967]], 338 n.21). Names: Westmoreland.'
      src:
        c: a44683db
        rows:
        - 'w.macv-command-history-1967 338–39: all'
        - 'via w.macv-command-history-1967 338 n.21: all'
      tags:
      - name:westmoreland-william
    section: '196708'
- add:
    entry:
      id: cal.1967-09-28.vietnam
      when: Sept. 28
      date: '1967-09-28'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'Westmoreland to Sharp, "Reorientation of In-Country Forces": with the 101st coming early, a brigade of the 1st Cavalry
        to I Corps at once to free a Marine regiment for the north, the 173d Airborne to Bình Định about Oct. 15, the 1st
        Cavalry''s headquarters and a second brigade to I Corps late in October; Phoenix, Santa Fe, San Angelo and Dodge City
        against Military Region 6, the 5th Viet Cong Division, Military Region 10 and War Zone D.'
      n: '[[w.macv-command-history-1967]], 339–41 (the four phases, October 1967 to March 1968; Highway 1 to be opened through
        II and III Corps by Jan. 1, 1968, and not later than Tet). Westmoreland: "I desire to preempt the enemy strategy of
        attempting to tie down forces and denude the pacification shield" (340). To check: COMUSMACV to CINCPAC, 281500Z Sep
        67, "Reorientation of In-Country Forces" (cited by [[w.macv-command-history-1967]], 341 n.23). Names: Westmoreland,
        Sharp.'
      src:
        c: cc205106
