      thread: vietnam-operations
      c: Coronado IX, the Rạch Ruộng, eight miles northeast of Sa Đéc. The 3d Battalion, 47th Infantry, and the 5th South
        Vietnamese Marine Battalion, in the Navy's armored troop carriers, under fire from the bank at 7:35 a.m.; the Marines
