      when: July 1
      date: '1967-07-01'
      thread: vietnam-air-war
      c: Sharp sets a prohibited area of four nautical miles round Haiphong, its targets struck from the lists; between four
        and ten miles, strikes only on his authority. July 14, transit of the Hanoi and Haiphong areas allowed; July 21, armed
        reconnaissance may strike up to three targets a day within the Hanoi radii. Aug. 5, strikes allowed in Haiphong's
        restricted area.
      n: '[[w.macv-command-history-1967]], 435–36. Names: Sharp.'
