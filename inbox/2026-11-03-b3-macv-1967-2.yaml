      when: Oct. 4
      date: '1967-10-04'
      thread: vietnam
      also:
      - vietnam-operations
      c: 'Westmoreland to Bunker, "Military Situation in the DMZ and Adjacent Areas": the enemy has drawn at least part of
        his forces back and "the victory has been denied," by "one of the greatest massings of firepower in support of a single
        division position in the history of warfare," B-52s, artillery, tactical air and naval gunfire. In the DMZ fighting
        of Sept. 1–24, 196 killed and 1,917 wounded.'
      n: '[[w.macv-command-history-1967]], 361–62. To check: Westmoreland to Bunker, memorandum, Oct. 4, 1967; J2 Historical
        Report for September 1967, Oct. 15, 1967 (cited by [[w.macv-command-history-1967]], 362 n.23). See [[cal.1967-09.vietnam]].
        Names: Westmoreland, Bunker.'
