    entry:
      id: cal.1967-06-12.vietnam-prisoners
      when: June 12
      date: '1967-06-12'
      thread: vietnam-prisoners
      c: Forty North Vietnamese prisoners and an infant repatriated across the Bến Hải. In 1967, 139 prisoners released in
        the South or repatriated to the North.
      n: '[[w.macv-command-history-1967]], 986.'
      src:
        c: 636a58e5
        rows:
        - 'w.macv-command-history-1967 986: all'
      tags:
      - place:ben-hai-river
    section: '196706'
