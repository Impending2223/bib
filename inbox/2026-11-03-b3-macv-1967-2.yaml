        mortar fire; by Dec. 31, 373 of the enemy killed in the Kentucky area, 364). To check: COMUSMACV to CINCPAC, 312200Z
        Oct 67, "TELECON"; CG III MAF to COMUSMACV, Nov. 4, 1967, "Monthly Evaluation" (cited by [[w.macv-command-history-1967]],
