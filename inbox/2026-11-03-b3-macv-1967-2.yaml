      thread: vietnam-operations
      c: Buffalo. The 3d Marines engage an enemy force in a bunker complex four kilometers south-southeast of Côn Thiên; under
        three hours, 35 of the enemy dead, six Marines killed. July 9–10, artillery or rockets on the Đông Hà airfield and
        Côn Thiên.
      n: '[[w.macv-command-history-1967]], 360. See [[cal.1967-07-02.vietnam-operations]].'
