      date: '1967-04-12'
      thread: vietnam-operations
      c: The 21st South Vietnamese Division's Dân Chí 285B in Phong Dinh. Apr. 13, the 44th Ranger Battalion helilifted onto
        an entrenched enemy at Hưng Thạnh hamlet on the Saintenoy canal, four more battalions flown in; the hamlet taken early
        Apr. 14, 243 of the enemy dead, 57 South Vietnamese killed.
