      c: 'The Korean Marine brigade''s biggest clash of the war: two battalions of the 21st North Vietnamese Regiment attack
        a company at dawn eight miles northwest of Quảng Ngãi city; a blocking force lifted behind them. By dusk at least
        246 of the enemy killed. The first attack on a Korean unit of any size in months.'
      n: '[[w.macv-command-history-1967]], 366–67. To check: COMUSMACV (MACCOC 3), 161006Z Feb 67, "Daily SITREP" (cited by
