patch: b3-macv-1967-2
by: Claude (b3-macv reading agent, Nov. 3-4, 2026), from MACV's Command Histories
ops:
- add:
    entry:
      id: cal.1967-03.vietnam-force-levels
      when: Late March
      date: 1967-03
      thread: vietnam-force-levels
      c: Westmoreland recommends the Army's ceiling in Vietnam raised from 314,076 to 322,668, a fourth rifle company for
        each infantry battalion and the early strength-reporting errors put right; without it USARV must cut 5,487 spaces.
      n: '[[w.macv-command-history-1967]], 136–37. To check: CG USARV to CINCUSARPAC, 250205Z Mar 67, "USARV Troop Ceiling"
        (cited by [[w.macv-command-history-1967]], 137 n.6). Names: Westmoreland.'
      src:
        c: cd2adafa
        rows:
        - 'w.macv-command-history-1967 136–37: all'
        - 'via w.macv-command-history-1967 137 n.6: all'
      tags:
      - name:westmoreland-william
    section: '196703'
- add:
    entry:
      id: cal.1967-03-31.vietnam-force-levels
      when: Mar. 31
      date: '1967-03-31'
      thread: vietnam-force-levels
      c: 'McNamara approves the Joint Chiefs'' recommendation: the Army''s base figure in Vietnam up 4,944 spaces, to correct
        the strength accounting; a cut of 2,803 deferred. Net, 2,141 spaces more in Program 4''s Army strengths through June
        30, 1968.'
      n: '[[w.macv-command-history-1967]], 136–37. To check: DA to CINCUSARPAC, Apr. 3, 1967, "Adjustment to Program 4 Army
        Strength" (cited by [[w.macv-command-history-1967]], 137 n.6). See [[cal.1967-03.vietnam-force-levels]]. Names: McNamara.'
      src:
        c: c0baad0d
        rows:
        - 'w.macv-command-history-1967 136–37: all'
        - 'via w.macv-command-history-1967 137 n.6: all'
      tags:
      - name:mcnamara-robert-s
    section: '196703'
- add:
    entry:
      id: cal.1967-04-18.vietnam-force-levels
      when: Apr. 18
      date: '1967-04-18'
      thread: vietnam-force-levels
      c: Westmoreland briefed on forming a second airmobile division from the 9th Infantry Division. He would rather make
        the 9th a "triphibian" division, moving by helicopter and by water, with the fewest land vehicles.
      n: '[[w.macv-command-history-1967]], 137–38. To check: MACJ03, memorandum for the record, "Structuring a Division for
        the Delta," Apr. 20, 1967 (cited by [[w.macv-command-history-1967]], 138 n.8). Names: Westmoreland.'
      src:
        c: 5c839ff8
        rows:
        - 'w.macv-command-history-1967 137–38: all'
        - 'via w.macv-command-history-1967 138 n.8: all'
      tags:
      - name:westmoreland-william
    section: '196704'
- add:
    entry:
      id: cal.1967-07-06.vietnam-force-levels
      when: July 6
      date: '1967-07-06'
      thread: vietnam-force-levels
      c: Westmoreland defers converting the 9th Infantry Division but still wants a second airmobile division, an exploitation
        and reaction force, to be made of the 101st Airborne Division in Vietnam as it arrives and aviation allows, probably
        in the summer of 1968.
      n: '[[w.macv-command-history-1967]], 138. To check: Westmoreland (MACJ321) to the Army Chief of Staff, letter, Aug.
        10, 1967 (cited by [[w.macv-command-history-1967]], 138 n.8). See [[cal.1967-04-18.vietnam-force-levels]]. Names:
        Westmoreland.'
      src:
        c: a51e9ca5
        rows:
        - 'w.macv-command-history-1967 138: all'
        - 'via w.macv-command-history-1967 138 n.8: all'
      tags:
      - name:westmoreland-william
    section: '196707'
- add:
    entry:
      id: cal.1967-09-22.vietnam-force-levels
      when: Sept. 22
      date: '1967-09-22'
      thread: vietnam-force-levels
      c: McNamara to the Secretary of the Army, a memorandum, approving a brigade task force and the headquarters of the 101st
        Airborne Division, about 4,500 men, to go to Vietnam by air in December.
      n: '[[w.macv-command-history-1967]], 138–39. To check: DA to CG USCONARC, 222159Z Sep 67, "Deployment of 101st Abn Div
        (-)" (cited by [[w.macv-command-history-1967]], 139 n.9). Names: McNamara.'
      src:
        c: c8b58336
        rows:
        - 'w.macv-command-history-1967 138–39: all'
        - 'via w.macv-command-history-1967 139 n.9: all'
      tags:
      - name:mcnamara-robert-s
    section: '196709'
- add:
    entry:
      id: cal.1967-10-21.vietnam-force-levels
      when: Oct. 21
      date: '1967-10-21'
      thread: vietnam-force-levels
      c: McNamara approves the accelerated deployment of the rest of the 101st Airborne Division by air in December. 10,403
        men to go with it.
      n: '[[w.macv-command-history-1967]], 138–39. To check: DA to CG USCONARC, 231418Z Oct 67 (cited by [[w.macv-command-history-1967]],
        139 n.9). See [[cal.1967-09-22.vietnam-force-levels]]. Names: McNamara.'
      src:
        c: fd25d6ed
        rows:
        - 'w.macv-command-history-1967 138–39: all'
        - 'via w.macv-command-history-1967 139 n.9: all'
      tags:
      - name:mcnamara-robert-s
    section: '196710'
- add:
    entry:
      id: cal.1967-12-08.vietnam-force-levels
      when: Dec. 8
      date: '1967-12-08'
      thread: vietnam-force-levels
      also:
      - vietnam-operations
      c: The 101st Airborne Division's 3d Brigade task force closes in Vietnam, at Biên Hòa, and moves overland to Phước Vĩnh
        as Yellowstone begins, an operation to open and use the roads.
      n: '[[w.macv-command-history-1967]], 139. See [[cal.1967-09-22.vietnam-force-levels]].'
      src:
        c: aa2c5baf
        rows:
        - 'w.macv-command-history-1967 139: all'
      tags:
      - place:bien-hoa
      - province:binh-duong
    section: '196712'
- add:
    entry:
      id: cal.1967-12-19.vietnam-force-levels
      when: Dec. 19
      date: '1967-12-19'
      thread: vietnam-force-levels
      c: The last units of the 101st Airborne Division close in Vietnam. The division's headquarters at Biên Hòa.
      n: '[[w.macv-command-history-1967]], 139. To check: CG 101st Abn Div to CG USARV, December 1967 (cited by [[w.macv-command-history-1967]],
        139 n.9). See [[cal.1967-09-22.vietnam-force-levels]].'
      src:
        c: 3bd3cb10
        rows:
        - 'w.macv-command-history-1967 139: all'
        - 'via w.macv-command-history-1967 139 n.9: all'
      tags:
      - place:bien-hoa
    section: '196712'
- add:
    entry:
      id: cal.1967-07-17.vietnam-force-levels
      when: July 17
      date: '1967-07-17'
      thread: vietnam-force-levels
      c: III MAF asks a self-propelled 40mm automatic-weapons battery, with two machine-gun sections, for Task Force Oregon,
        to escort convoys on Route 1 from Chu Lai to Đức Phổ and guard road and engineer parties.
      n: '[[w.macv-command-history-1967]], 141. To check: CG III MAF, 170902 Jul 67, "Request for Air Defense Arty" (cited
        by [[w.macv-command-history-1967]], 141 n.12).'
      src:
        c: 2932c1df
        rows:
        - 'w.macv-command-history-1967 141: all'
        - 'via w.macv-command-history-1967 141 n.12: all'
      tags:
      - place:chu-lai
      - province:quang-ngai
    section: '196707'
- add:
    entry:
      id: cal.1967-08-05.vietnam-force-levels
      when: Aug. 5
      date: '1967-08-05'
      thread: vietnam-force-levels
      c: 'Westmoreland declines III MAF''s request for an air defense battery: the allocations go by tactical priority, and
        the battalion in I Corps already supports three divisions'' worth of forces, those elsewhere four.'
      n: '[[w.macv-command-history-1967]], 141 (the refusal and its reasons; the day not given). To check: COMUSMACV, 051154Z
        Aug 67 (cited by [[w.macv-command-history-1967]], 141 n.12). See [[cal.1967-07-17.vietnam-force-levels]]. Names: Westmoreland.
        Check: the day, by the note''s message.'
      src:
        c: 02f4bc09
        rows:
        - 'w.macv-command-history-1967 141: all'
        - 'via w.macv-command-history-1967 141 n.12: all'
      tags:
      - name:westmoreland-william
    section: '196708'
- add:
    entry:
      id: cal.1967-03-29.vietnam-force-levels
      when: Mar. 29
      date: '1967-03-29'
      thread: vietnam-force-levels
      c: McNamara proposes that the Army engineer units held back for want of equipment go to Vietnam at once and use RMK-BRJ's
        surplus plants. He approves the last four engineer construction battalions of Program 4 to deploy at 80 percent strength.
      n: '[[w.macv-command-history-1967]], 141 (in late March). To check: OSD to CINCPAC, 291433Z Mar 67, "Deployment of Army
        Engineer Units"; COMUSMACV to CINCPAC, 010045Z Apr 67 (cited by [[w.macv-command-history-1967]], 141 n.13). Names:
        McNamara. Check: the day, by the note''s message.'
      src:
        c: 99f2d324
        rows:
        - 'w.macv-command-history-1967 141: all'
        - 'via w.macv-command-history-1967 141 n.13: all'
      tags:
      - name:mcnamara-robert-s
    section: '196703'
- add:
    entry:
      id: cal.1967-04-02.vietnam-force-levels
      when: Apr. 2
      date: '1967-04-02'
      thread: vietnam-force-levels
      c: Nha Trang. MACV's commanders' conference. The outgoing commander of the 1st Cavalry Division on his impressions of
        the war; the 4th Infantry Division's commander on Sam Houston's objectives and the enemy's tactics.
      n: '[[w.macv-command-history-1967]], 141–42, 376. To check: MACOC, memorandum for the record, "MACV Commanders'' Conference,
        2 Apr 67," Apr. 10, 1967 (cited by [[w.macv-command-history-1967]], 142 n.14). Check: the History, 141, gives Apr.
        3; 376 and the note''s memorandum, Apr. 2.'
      src:
        c: 669dbc12
        rows:
        - 'w.macv-command-history-1967 141–42, 376: all'
        - 'via w.macv-command-history-1967 142 n.14: all'
      tags:
      - place:nha-trang
    section: '196704'
- add:
    entry:
      id: cal.1967-04-05.vietnam-force-levels
      when: Apr. 5–14
      date: '1967-04-05'
      thread: vietnam-force-levels
      c: 'MACV''s study of the strength of the divisions and separate brigades: assigned strengths above authorized, but rifle
        companies'' foxhole strength 20 to 45 men under the assigned, for base camps and absences. Westmoreland proposes to
        McNamara 8,200 Army and 4,500 Marine spaces more in Program 4''s ceiling.'
      n: '[[w.macv-command-history-1967]], 142. To check: ACofS J1 to SJS, disposition form, May 20, 1967 (cited by [[w.macv-command-history-1967]],
        142 n.14). Names: Westmoreland, McNamara. Check: the day of the proposal.'
      src:
        c: 904bcaf7
        rows:
        - 'w.macv-command-history-1967 142: all'
        - 'via w.macv-command-history-1967 142 n.14: all'
      tags:
      - name:westmoreland-william
      - name:mcnamara-robert-s
    section: '196704'
- add:
    entry:
      id: cal.1967-04-12.vietnam-force-levels
      when: Apr. 12
      date: '1967-04-12'
      thread: vietnam-force-levels
      also:
      - vietnam-operations
      c: 'Westmoreland directs Task Force Oregon activated and moved to southern I Corps, to free Marines for the north: the
        3d Brigade, 25th Infantry Division, from Bình Định and the 196th Light Infantry Brigade from Tây Ninh to Chu Lai,
        the move completed by Apr. 20.'
      n: '[[w.macv-command-history-1967]], 336 (the order of Apr. 12; the moves); [[w.macv-command-history-1967]], 142 (the
        196th from the Junction City area; a battalion of the 3d Brigade to Chu Lai Apr. 15, the rest within a week; the 1st
        Brigade, 101st Airborne, alerted for May 1). To check: COMUSMACV to CG I FFORCEV et al., 061800Z Apr 67, "Deployment
        of Units"; COMUSMACV (MACCOC 12) to CG USARV et al., 141215Z Apr 67, "Operation OREGON" (cited by [[w.macv-command-history-1967]],
        142 n.15). Names: Westmoreland.'
      src:
        c: 64eacf94
        rows:
        - 'w.macv-command-history-1967 336: all'
        - 'w.macv-command-history-1967 142: all'
        - 'via w.macv-command-history-1967 142 n.15: all'
      tags:
      - name:westmoreland-william
      - place:chu-lai
      - province:binh-dinh
      - province:tay-ninh
    section: '196704'
- add:
    entry:
      id: cal.1967-04-12.vietnam-force-levels-2
      when: Apr. 12
      date: '1967-04-12'
      thread: vietnam-force-levels
      c: 'Westmoreland to Sharp and Wheeler, MAC 347, "Situation I Corps": the deteriorating situation there; Quảng Trị and
        Thừa Thiên under the North Vietnamese army''s Military Region 4 at Vinh, the DMZ "obliterated in a practical sense."
        He has ordered contingency plan Oregon into effect and asks the Marine brigade on Okinawa for III MAF until at least
        September.'
      n: '[[w.macv-command-history-1967]], 336–38. Westmoreland: "the forthcoming summer campaign in I Corps could be a decisive
        period of the war" (338). To check: Westmoreland (MAC 347) to Sharp and Wheeler, 121248Z Apr 67, "Situation I Corps"
        (cited by [[w.macv-command-history-1967]], 338 n.20). See [[cal.1967-04-12.vietnam-force-levels]]. Names: Westmoreland,
        Sharp, Wheeler.'
      src:
        c: 279e75bf
        rows:
        - 'w.macv-command-history-1967 336–38: all'
        - 'via w.macv-command-history-1967 338 n.20: all'
      tags:
      - name:westmoreland-william
      - name:sharp-u-s-grant
      - name:wheeler-earle
      - province:quang-tri
      - province:thua-thien
    section: '196704'
- add:
    entry:
      id: cal.1967-08-11.vietnam-force-levels
      when: Aug. 11
      date: '1967-08-11'
      thread: vietnam-force-levels
      c: In Task Force Oregon, the 3d Brigade, 25th Infantry Division, exchanges designations and colors with the 3d Brigade,
        4th Infantry Division.
      n: '[[w.macv-command-history-1967]], 142. See [[cal.1967-04-12.vietnam-force-levels]].'
      src:
        c: a32beabe
        rows:
        - 'w.macv-command-history-1967 142: all'
    section: '196708'
- add:
    entry:
      id: cal.1967-09-22.vietnam-force-levels-2
      when: Sept. 22
      date: '1967-09-22'
      thread: vietnam-force-levels
      c: Task Force Oregon designated the Americal Division.
      n: '[[w.macv-command-history-1967]], 142, 2. See [[cal.1967-04-12.vietnam-force-levels]].'
      src:
        c: 09131fc1
