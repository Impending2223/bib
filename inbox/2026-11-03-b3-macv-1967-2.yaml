      when: Apr. 16
      date: '1967-04-16'
      thread: defense
      also:
      - vietnam-operations
      c: 'Sharp to the Joint Chiefs on activating two Iowa-class battleships for naval gunfire: from Mar. 1, 1966, to Feb.
        28, 1967, the ships'' gunfire destroyed 16,666 structures, damaged 22,803 and killed 2,008 of the enemy, observed.'
      n: '[[w.macv-command-history-1967]], 488. Names: Sharp.'
