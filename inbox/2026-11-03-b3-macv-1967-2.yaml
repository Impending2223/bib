      when: Oct. 27
      date: '1967-10-27'
      thread: vietnam-force-levels
      c: At a briefing, Westmoreland approves the reorganization of the South Vietnamese forces recommended by the combined
        study group as MACV's position; Nov. 13, the chief of the Joint General Staff approves it. The same day, Oct. 27,
        he approves the airborne division as the basis of Plan Rainbow, an elite division for operations in and out of the
        country, against Base Area 609 in Laos when politics permit.
      n: '[[w.macv-command-history-1967]], 188–89, 201–02 (Nov. 2, 1,207 spaces released for the expansion; Nov. 12, 270 more).
        See [[cal.1967-04-18.laos]]. Names: Westmoreland.'
