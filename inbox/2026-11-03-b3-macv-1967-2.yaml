      c: Liên Kết 81/Rio Grande/Giant Dragon, against the North Vietnamese 40th Battalion and 21st Regiment in Quảng Ngãi,
        the first three-nation operation in I Corps with a combined command post. Feb. 19, the South Vietnamese Airborne Task
        Force counts 750 of the enemy dead, the army's highest one-day count. It ends Feb. 22, 836 of the enemy killed, 813
        credited to the South Vietnamese.
      n: '[[w.macv-command-history-1967]], 366. To check: COMUSMACV (MACCOC 3), 220952Z Feb 67; MACV MONEVAL, February 1967
