      date: '1967-02-13'
      thread: vietnam-operations
      c: The 9th Infantry Division begins Enterprise in Long An, from Rạch Kiến and Bình Phước, combined daily with the South
        Vietnamese and the Regional and Popular Forces; 369 of the enemy killed by March's end. Apr. 9–11, near Rạch Kiến,
        the 506th Viet Cong Battalion engaged.
