      when: July 5
      date: '1967-07-05'
      thread: vietnam-operations
      c: 'Buffalo, near Côn Thiên. An air observer calls artillery and air strikes on a concentration of the enemy: 200 killed.
        Enemy artillery, 7:45 a.m. to 1:45 p.m., kills 14 and wounds 25, most by one 152mm shell on a battalion command post
        of the 9th Marines, the first 152mm fire of the war.'
      n: '[[w.macv-command-history-1967]], 360. To check: COMUSMACV, 071010Z Jul 67, "Daily SITREP"; COMUSMACV, 070310Z Jul
        67, "TELECON" (cited by [[w.macv-command-history-1967]], 361 n.20). See [[cal.1967-07-02.vietnam-operations]].'
