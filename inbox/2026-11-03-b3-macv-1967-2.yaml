      when: July 15
      date: '1967-07-15'
      thread: vietnam-force-levels
      c: The Queen's Cobras' engineer company, out of Bangkok July 11 in a Thai navy LST, lands at Newport and convoys to
        Bear Cat to build the regiment's base camp.
