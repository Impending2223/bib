      when: Apr. 15
      date: '1967-04-15'
      thread: vietnam-force-levels
      c: The Joint Chiefs authorize Sharp to use elements of the 9th Marine Amphibious Brigade for Westmoreland in I Corps,
        a second Special Landing Force; one at 24 hours' reaction, one at 26, the rest on Okinawa at 15 days'.
