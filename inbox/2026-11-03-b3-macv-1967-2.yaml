      when: Nov. 13
      date: '1967-11-13'
      thread: vietnam-air-war
      c: Rusk, in a joint State–Defense message, asks the ambassador at Bangkok to seek Thailand's approval to base 25 B-52s
        at U Tapao instead of 15, for 800 sorties a month from Thailand, the ten more to come at once on a temporary basis.
        Nov. 29, the embassy reports Thailand's approval.
      n: '[[w.macv-command-history-1967]], 407. Names: Rusk.'
