      when: Feb. 13
      date: '1967-02-13'
      thread: vietnam-air-war
      c: Rolling Thunder resumes at 4 p.m. after the Tet stand-down, first set for 0700 Feb. 8 to 0700 Feb. 12, extended by
        the international political situation. Pacific Air Forces had urged Route Package 1 opened to strikes and left out
        of future truces.
      n: '[[w.macv-command-history-1967]], 429. Check: the hour, the History''s "131600W."'
