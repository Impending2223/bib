      id: cal.1967-04-10.laos
      when: Apr. 10
      date: '1967-04-10'
      thread: laos
      also:
      - vietnam
      c: MACV Planning Directive 3-67, for Apr. 1 to Dec. 31, 1967. In the Laotian panhandle, round-the-clock tactical air
        reconnaissance and strikes on the roads of Steel Tiger; B-52s on fixed targets and special interdiction points; more
        ground reconnaissance of the base and storage areas on the border; psychological warfare and herbicides.
      n: '[[w.macv-command-history-1967]], 333. To check: MACV Planning Directive No. 3-67, "Planning Guidance for Commanders
        for Period 1 Apr 67 - 31 Dec 67," Apr. 10, 1967 (cited by [[w.macv-command-history-1967]], 333 n.13).'
      src:
        c: 9b6dab52
        rows:
        - 'w.macv-command-history-1967 333: all'
        - 'via w.macv-command-history-1967 333 n.13: all'
    section: '196704'
- add:
    entry:
      id: cal.1967-04-18.laos
      when: Apr. 18
      date: '1967-04-18'
      thread: laos
      also:
      - vietnam
      c: 'Westmoreland to Sharp, the embassy at Vientiane and the Joint Chiefs: approval asked for Southpaw, the SLAM concept
        extended to South Vietnamese forces against infiltration through the Tiger Hound area, a task force of covert forces,
        an airborne or Ranger battalion and helicopters. Under study, a second phase, High Port: an elite division-size South
        Vietnamese force against Base Area 609, opposite Đắk Tô, not before Jan. 1, 1968.'
      n: '[[w.macv-command-history-1967]], 333–34 (Mar. 23 to Apr. 4, 110 tactical air sorties in the SLAM III area, 188 of
        the enemy estimated killed). To check: COMUSMACV to CINCPAC, AMEMB Vientiane and JCS, 180059Z Apr 67 (cited by [[w.macv-command-history-1967]],
        334 n.15). Names: Westmoreland, Sharp.'
      src:
