    entry:
      id: cal.1967-03-24.vietnam-prisoners
      when: Mar. 24
      date: '1967-03-24'
      thread: vietnam-prisoners
      c: The United States' protest through the International Committee of the Red Cross of atrocities against Americans held
        by the enemy, among them the torture and murder of 1st Lt. William M. Grammar and Sgt. Orville B. Frits at a church
        at Ngô Xá Đông, three miles from Quảng Trị.
      n: '[[w.macv-command-history-1967]], 971, 979. Check: the History''s spelling of the names and the place.'
      src:
        c: c2a5c8dd
        rows:
        - 'w.macv-command-history-1967 971, 979: all'
      tags:
      - place:quang-tri
    section: '196703'
- add:
    entry:
      id: cal.1967-01-04.vietnam-prisoners
      when: Jan. 4
      date: '1967-01-04'
      thread: vietnam-prisoners
      c: The Viet Cong release two American civilians and a Filipino; Washington directs three Viet Cong prisoners taken by
        Americans released in return, arranged with Saigon by the embassy and MACV.
      n: '[[w.macv-command-history-1967]], 984.'
      src:
        c: 3a28076d
        rows:
        - 'w.macv-command-history-1967 984: all'
    section: '196701'
- add:
    entry:
      id: cal.1967-03-11.vietnam-prisoners
      when: Mar. 11
      date: '1967-03-11'
      thread: vietnam-prisoners
      c: Saigon and the United States release two Viet Cong prisoners from the III Corps camp at Biên Hòa, in answer to the
        Viet Cong's release of Sergeant Womack and Private Crafts Feb. 23. Mar. 20, two North Vietnamese of the 19 taken from
        PT boats in the Gulf of Tonkin July 1, 1966, repatriated through Cambodia; Mar. 22, Saigon releases 22 "repentant"
        Viet Cong prisoners.
      n: '[[w.macv-command-history-1967]], 985.'
      src:
        c: 0621fd95
        rows:
        - 'w.macv-command-history-1967 985: all'
      tags:
      - place:bien-hoa
    section: '196703'
