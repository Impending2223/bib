      when: June 1
      date: '1967-06-01'
      thread: vietnam-operations
      c: Cimarron begins, the 3d Marine Division in northern Quảng Trị. The 9th Marines meet the enemy the first evening in
        a 600-meter bunker complex near the DMZ; contact light by June 6. North Vietnamese troops near Côn Thiên in steel
        helmets and flak jackets.
      n: '[[w.macv-command-history-1967]], 360.'
