- add:
    entry:
      id: cal.1967-10.press-and-broadcasting
      when: October
      date: 1967-10
      thread: press-and-broadcasting
      also:
      - vietnam
      c: '*Newsweek*, "Their Lions--Our Rabbits": among its allegations, an entire South Vietnamese regiment taken from action
        to supply the 173d Airborne with beer, prostitutes and laundry. Westmoreland to Osborn Elliott, its editor: Saigon''s
        officials very upset; an inspector general''s inquiry ordered into the three allegations touching American troops;
        found without basis.'
      n: '[[w.macv-command-history-1967]], 961–63 (the 42d South Vietnamese Regiment had spent some 200 battalion days in
        operations with the 173d, July to September). Names: Westmoreland. Check: the issue''s date.'
      src:
        c: 45e1ba26
        rows:
        - 'w.macv-command-history-1967 961–63: all'
      tags:
      - name:westmoreland-william
    section: '196710'
- add:
    entry:
      id: cal.1967-11-14.press-and-broadcasting
      when: Nov. 14
      date: '1967-11-14'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: UPI breaks MACV's and III MAF's embargo on the death of Maj. Gen. Bruno Hochmuth, commanding the 3d Marine Division.
        Many of the Saigon press corps angry; MACV wants countermeasures; McNamara will not suspend accreditation but finds
        UPI's action "reprehensible."
      n: '[[w.macv-command-history-1967]], 963–64 (the UPI bureau chief''s "mild regret"). Names: McNamara. Check: the copy''s
        page 963 is skewed in the scan; read off the text.'
      src:
        c: 4455adab
        rows:
        - 'w.macv-command-history-1967 963–64: all'
      tags:
      - name:mcnamara-robert-s
    section: '196711'
- add:
    entry:
      id: cal.1967-11-28.press-and-broadcasting
      when: Nov. 28
      date: '1967-11-28'
      thread: press-and-broadcasting
      also:
      - laos
      c: 'UPI, by Alvin B. Webb Jr.: McConnell said American planes have bombed targets in Laos since 1964 by agreement with
        its government. The Defense Department and the Air Force: the tape of the interview shows he spoke of armed reconnaissance
        under the agreement, escorts free to return fire.'
      n: '[[w.macv-command-history-1967]], 965. Names: McConnell. Check: the byline, the History''s "Alvin B. Well, Jr."'
      src:
        c: be164c3c
        rows:
        - 'w.macv-command-history-1967 965: all'
      tags:
      - name:mcconnell-john-p
    section: '196711'
- add:
    entry:
      id: cal.1967-11-28.press-and-broadcasting-2
      when: Nov. 28
      date: '1967-11-28'
      thread: press-and-broadcasting
      also:
      - defense
      c: 'The *New York Times*, from Marine sources: Westmoreland has recommended in writing that Walt be the next Commandant.
        Westmoreland to the *Times*''s Washington bureau, Walt and the Commandant: he made no recommendation, which would
        have been improper unasked.'
      n: '[[w.macv-command-history-1967]], 965. Names: Westmoreland, Walt.'
      src:
        c: fe65a976
        rows:
        - 'w.macv-command-history-1967 965: all'
      tags:
      - name:westmoreland-william
      - name:walt-lewis-w
    section: '196711'
