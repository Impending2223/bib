- add:
    entry:
      id: cal.1967-05-24.vietnam-force-levels
      when: May 24–27
      date: '1967-05-24'
      thread: vietnam-force-levels
      c: The 173d Airborne Brigade moved to II Corps as I Field Force's reserve, to be committed only with Westmoreland's
        approval. Its first elements land the afternoon of May 24, the landings every fifteen minutes around the clock to
        after dawn May 27; I Field Force takes operational control when the last close at New Pleiku.
      n: '[[w.macv-command-history-1967]], 142–43. To check: COMUSMACV to CG II FFORCEV, 211210Z May 67, "Reinforcement of
        II CTZ"; CG I FFORCEV to COMUSMACV, 241220Z May 67, "Reception and Employment of 173d Abn Bde"; CG I FFORCEV to COMUSMACV,
        270950Z May 67 (cited by [[w.macv-command-history-1967]], 143 n.16). Names: Westmoreland.'
      src:
        c: be4732ac
        rows:
        - 'w.macv-command-history-1967 142–43: all'
        - 'via w.macv-command-history-1967 143 n.16: all'
      tags:
      - name:westmoreland-william
      - place:pleiku
    section: '196705'
- add:
    entry:
      id: cal.1967-05-19.vietnam-force-levels
      when: May 19
      date: '1967-05-19'
      thread: vietnam-force-levels
      c: Westmoreland briefed on the arrival and stationing of a 1⅓-division force, the 198th and 11th Infantry Brigades and
        the 101st Airborne Division, and 33 battalion packets for fourth rifle companies. The 198th to Task Force Oregon or
        Bình Định, the 11th to Đức Phổ, the 101st to Bear Cat; the brigades and division due November 1967, April 1968 and
        May or June 1968.
      n: '[[w.macv-command-history-1967]], 145. To check: MACJ03, memoranda for the record, "Minimum Essential Force," May
        20 and May 24, 1967 (cited by [[w.macv-command-history-1967]], 145 n.20). Names: Westmoreland.'
      src:
        c: 62b34b32
        rows:
        - 'w.macv-command-history-1967 145: all'
        - 'via w.macv-command-history-1967 145 n.20: all'
      tags:
      - name:westmoreland-william
      - province:binh-dinh
      - province:quang-ngai
    section: '196705'
- add:
    entry:
      id: cal.1967-03-22.vietnam-program-5
      when: Mar. 22
      date: '1967-03-22'
      thread: vietnam-program-5
      also:
      - vietnam-force-levels
      c: 'Wheeler directs the Joint Staff to analyze Westmoreland''s force request, by Apr. 14: one case with a reserve call-up,
        one without; "the required forces cannot be provided without a reserve call-up" no answer. Course A, 200,000 men more,
        100,000 in fiscal 1968 and 100,000 in 1969; Course B, what can be had without the reserves, nine battalions or 10,000
        men.'
      n: '[[w.macv-command-history-1967]], 145–46. To check: NMCC to CINCPAC, 232046Z Mar 67, "Force Requirements--SEASIA";
        JCS to CINCPAC, 242358Z Mar 67, "PACOM Force Requirements"; JCS to CINCPAC, May 1 and 2, 1967, "Alternative Courses
        of Action" (cited by [[w.macv-command-history-1967]], 146 n.21). See [[cal.1967-03-18.vietnam]]. Names: Wheeler, Westmoreland.'
      src:
        c: ba9b87ec
        rows:
        - 'w.macv-command-history-1967 145–46: all'
        - 'via w.macv-command-history-1967 146 n.21: all'
      tags:
      - name:wheeler-earle
      - name:westmoreland-william
    section: '196703'
- add:
    entry:
      id: cal.1967-05-05.vietnam-program-5
      when: May 5
      date: '1967-05-05'
      thread: vietnam-program-5
      c: Westmoreland to Sharp on the alternative courses. Course B would "seriously" hurt Revolutionary Development, slowing
        it, even setting it back, the 50,000 more Regional and Popular Forces too few for the teams multiplying.
      n: '[[w.macv-command-history-1967]], 146 (his view; the day not given in the text). To check: COMUSMACV to CINCPAC,
        050710Z May 67, "Alternative Courses of Action" (cited by [[w.macv-command-history-1967]], 146 n.21). See [[cal.1967-03-22.vietnam-program-5]].
        Names: Westmoreland, Sharp. Check: the day, by the note''s message.'
      src:
        c: 9dde1dc4
        rows:
        - 'w.macv-command-history-1967 146: all'
        - 'via w.macv-command-history-1967 146 n.21: all'
      tags:
      - name:westmoreland-william
      - name:sharp-u-s-grant
    section: '196705'
- add:
    entry:
      id: cal.1967-05-12.vietnam-program-5
      when: May 12
      date: '1967-05-12'
      thread: vietnam-program-5
      c: 'Sharp to the Joint Chiefs on the alternatives: Course A would "substantially advance the day of victory"; Course
        B no buffer against escalation. He recommends the minimum essential force by June 30, 1968, forces held ready in the
        United States for the optimum force, a wider air campaign, stronger naval surface forces, and authority for the whole
        Pacific Command strategy.'
      n: '[[w.macv-command-history-1967]], 146–47 (the NMCC''s preference for Course A, with mining of the ports and inland
        waterways, the remaining high-value targets struck, more naval surface action; Course B "completely unsatisfactory";
        Sharp''s recommendations). To check: NMCC to CINCPAC, 012219Z and 021757Z May 67; CINCPAC to JCS, 12 May 67, "Alternative
        Courses of Action" (cited by [[w.macv-command-history-1967]], 146 n.22). See [[cal.1967-03-22.vietnam-program-5]].
        Names: Sharp. Check: the day, by the note''s message (its time garbled in the copy).'
      src:
        c: 593df7cd
        rows:
        - 'w.macv-command-history-1967 146–47: all'
        - 'via w.macv-command-history-1967 146 n.22: all'
      tags:
      - name:sharp-u-s-grant
    section: '196705'
