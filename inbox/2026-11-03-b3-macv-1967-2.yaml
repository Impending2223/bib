      when: Mar. 31
      date: '1967-03-31'
      thread: vietnam-operations
      c: The Australian guided-missile destroyer HMAS *Hobart* begins operations with the Seventh Fleet. HMAS *Perth* relieves
        her Sept. 26.
      n: '[[w.macv-command-history-1967]], 487, 498.'
