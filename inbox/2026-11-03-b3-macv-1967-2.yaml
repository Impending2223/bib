      when: Dec. 15
      date: '1967-12-15'
      thread: vietnam-operations
      c: 'The commander of I Field Force to Westmoreland, on Pershing: II Corps has an economy-of-force role, but any further
        draw-down could hurt pacification in Bình Định, where enemy activity has risen in the three weeks since units left
        for Đắk Tô.'
      n: '[[w.macv-command-history-1967]], 375 (the History, Dec. 16; in November two battalions sent west to Đắk Tô, Pershing
        "essentially a holding action," the kill ratio 19.7:1). To check: CG I FFORCEV to COMUSMACV, 151323Z Dec 67, "Retention
        of VN Marine TF" (cited by [[w.macv-command-history-1967]], 375 n.58). See [[cal.1967-02-13.vietnam-operations]].
        Names: Westmoreland. Check: the History''s text gives Dec. 16, the note''s message Dec. 15.'
