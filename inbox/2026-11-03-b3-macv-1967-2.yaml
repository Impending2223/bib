      when: May 28
      date: '1967-05-28'
      thread: vietnam
      c: The Office of Civil Operations and MACV's Revolutionary Development Support Directorate merged into a seventh joint
        staff section, the Assistant Chief of Staff for Civil Operations and Revolutionary Development Support (CORDS); Komer
        Westmoreland's deputy for it, with the rank of ambassador.
      n: '[[w.macv-command-history-1967]], 587, 594, 8. See [[cal.1967-05-11.vietnam]]. Names: Komer, Westmoreland.'
