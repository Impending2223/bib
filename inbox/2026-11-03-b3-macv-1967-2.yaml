      id: cal.1966-11-07.vietnam-3
      when: Nov. 7
      date: '1966-11-07'
      thread: vietnam
      c: 'The Combined Campaign Plan for 1967, AB 142: the South Vietnamese army chiefly to support Revolutionary Development,
        the American and allied forces to destroy the main forces and base areas; no clear-cut division between them. The
        corps'' tasks: security of the populated areas, the provincial capitals and district towns, the roads, a reconnaissance
        program of long-range patrols.'
      n: '[[w.macv-command-history-1967]], 317–22. To check: Combined Campaign Plan, 1967 (AB 142), Nov. 7, 1966 (cited by
        [[w.macv-command-history-1967]], 317 n.5).'
