      thread: vietnam-operations
      c: Coronado V, north and south of the Mỹ Tho River in Kiến Hòa and Định Tường, to Oct. 8; three major contacts, 134,
        69 and 94 of the enemy killed. Coronado III, Aug. 5–17, Rừng Sát; IV, Aug. 19–Sept. 9, Long An, Gò Công and Kiến Hòa,
        81.
      n: '[[w.macv-command-history-1967]], 396. See [[cal.1967-06-04.vietnam-operations]].'
