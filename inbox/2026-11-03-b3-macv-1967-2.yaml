      when: May 8
      date: '1967-05-08'
      thread: vietnam
      c: Komer forwards Bunker his ideas for pacification, actions the United States can take alone and those needing Saigon's
        part, with an assessment; the framework of Project Takeoff, launched by Westmoreland in early July.
      n: '[[w.macv-command-history-1967]], 594–95. To check: Komer to Bunker, memorandum, May 8, 1967 (cited by [[w.macv-command-history-1967]],
