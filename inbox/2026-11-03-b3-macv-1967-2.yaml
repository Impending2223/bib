      when: Mar. 23
      date: '1967-03-23'
      thread: vietnam-force-levels
      c: 'Westmoreland to the Joint Chiefs on the Air Force''s part of his request: with the minimum essential force, 5,368
        men more, five F-4 squadrons, a C-130 squadron and 21 O-2A aircraft; with the optimum, 15,259 men. Three fighter squadrons
        in the north by November 1967, two in the south by February 1968.'
      n: '[[w.macv-command-history-1967]], 164. Names: Westmoreland.'
