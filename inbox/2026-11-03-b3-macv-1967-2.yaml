      when: Dec. 22
      date: '1967-12-22'
      thread: vietnam-operations
      c: The American merchant ship *Seatrain*, at anchor in the Nhà Bè River, holed at the waterline by a floating charge
        about 2 a.m.; her pumps keep her afloat and the channel open.
