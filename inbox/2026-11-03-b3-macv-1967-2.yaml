      when: Feb. 26
      date: '1967-02-26'
      thread: vietnam-operations
      c: Ala Moana, the Filhol rubber plantation, Bình Dương. The 4th Battalion, 9th Infantry, and the 3d Squadron, 4th Cavalry,
        engage a strong enemy force; 114 killed. The 1st Brigade, 25th Division, had taken over the operation Feb. 22.
      n: '[[w.macv-command-history-1967]], 385.'
