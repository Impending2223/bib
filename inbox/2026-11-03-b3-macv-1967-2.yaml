- add:
    entry:
      id: cal.1966-09-28.vietnam-2
      when: Sept. 28
      date: '1966-09-28'
      thread: vietnam
      c: 'Sharp to Westmoreland, "Concept for Vietnam," the Pacific Command''s concept on the Joint Chiefs'' policy guidance:
        three undertakings, to destroy the North''s war-supporting capability, to seek out and destroy the Communist forces
        and infrastructure, to build the South Vietnamese nation; the tasks of each, a mining campaign and a maritime quarantine
        among those to be ready for.'
      n: '[[w.macv-command-history-1967]], 310–16 (the History, "During September 1966"). To check: CINCPAC to COMUSMACV,
        280050Z Sep 66, "Concept for Vietnam" (cited by [[w.macv-command-history-1967]], 312 n.3). Names: Sharp, Westmoreland.'
      src:
        c: 19aad584
        rows:
        - 'w.macv-command-history-1967 310–16: all'
        - 'via w.macv-command-history-1967 312 n.3: all'
      tags:
      - name:sharp-u-s-grant
      - name:westmoreland-william
    section: '196609'
