      when: June 16
      date: '1967-06-16'
      thread: vietnam
      c: 'Westmoreland to the Ambassador''s Special Assistant (CAS), on his idea of a separate battalion, regiment or brigade
        of Vietnamese of Chinese descent: not palatable to the Vietnamese, given their "historic fear and dislike of the Chinese";
        general mobilization, which would take them in, the better course.'
      n: '[[w.macv-command-history-1967]], 201. Names: Westmoreland.'
