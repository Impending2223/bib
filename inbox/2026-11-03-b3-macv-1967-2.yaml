- add:
    entry:
      id: cal.1967-02-09.vietnam
      when: Feb. 9
      date: '1967-02-09'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'The Tet cease-fire, from 8 a.m. Feb. 8. North Vietnam''s supply effort quickens at once: by noon Feb. 9, 40 junks,
        44 logistics craft and a barge headed south near the Sông Giang; an estimated 300 craft enter the Kiến Giang in a
        day. The *Stoddard* fired on by shore batteries Feb. 8. Sharp asks authority to resume Sea Dragon.'
      n: '[[w.macv-command-history-1967]], 494–95 (Feb. 10, Sharp adds that trucks are moving; a pilot: "Route 1 looked like
        the New Jersey Turnpike"). Names: Sharp.'
      src:
        c: 155f21de
        rows:
        - 'w.macv-command-history-1967 494–95: all'
      tags:
      - name:sharp-u-s-grant
    section: '196702'
- add:
    entry:
      id: cal.1967-02-23.vietnam
      when: Feb. 23
      date: '1967-02-23'
      thread: vietnam
      also:
      - vietnam-air-war
      c: The Joint Chiefs authorize wider interdiction of North Vietnam's supply and infiltration network. Sea Dragon extended
        north to 20 degrees; naval surface operations against targets ashore and in the coastal waters, radars, antiaircraft
        sites and other military targets.
      n: '[[w.macv-command-history-1967]], 496. See [[cal.1967-02.vietnam-2]].'
      src:
        c: 94cd7603
        rows:
        - 'w.macv-command-history-1967 496: all'
    section: '196702'
- add:
    entry:
      id: cal.1967-02-26.vietnam-air-war
      when: Feb. 26
      date: '1967-02-26'
      thread: vietnam-air-war
      c: Task Force 77's aircraft lay the first minefield in North Vietnam; in March, fields in the Sông Cả, the Sông Giang,
        the Sông Mã and the Cửa Sót. Announced to newsmen Feb. 27, under McNamara's public affairs guidance, as a limited
        number of non-floating mines in selected rivers.
      n: '[[w.macv-command-history-1967]], 497. Names: McNamara. Check: the History''s "Song Ga" and "Cua Sat."'
      src:
        c: b71b6752
        rows:
        - 'w.macv-command-history-1967 497: all'
      tags:
      - name:mcnamara-robert-s
    section: '196702'
