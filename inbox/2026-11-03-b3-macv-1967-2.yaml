      when: Apr. 10
      date: '1967-04-10'
      thread: vietnam-operations
      c: The first increment of River Assault Squadron 11, 18 armored troop carriers, a command boat and two monitors, moves
        to Đồng Tâm and begins battalion-size waterborne operations with the 9th Division. May 2, the *Colleton* completes
        the Mobile Riverine Base.
