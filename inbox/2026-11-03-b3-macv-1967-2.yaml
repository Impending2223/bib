      date: '1967-08-29'
      thread: vietnam-operations
      c: 'COMNAVFORV to Westmoreland on a second river patrol boat division for I Corps: no Game Warden assets diverted from
        the Delta. 120 PBRs and 22 helicopters in the country, 80 more boats due; one section to 25 miles of the Delta''s
        450 miles of major rivers.'
