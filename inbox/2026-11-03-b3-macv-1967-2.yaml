      id: cal.1967-08-18.vietnam-prisoners
      when: Aug. 18
      date: '1967-08-18'
      thread: vietnam-prisoners
      c: Westmoreland strongly recommends to Bunker more repatriations of North Vietnamese prisoners.
      n: '[[w.macv-command-history-1967]], 986. Names: Westmoreland, Bunker.'
      src:
        c: 9fcf18c0
        rows:
        - 'w.macv-command-history-1967 986: all'
      tags:
