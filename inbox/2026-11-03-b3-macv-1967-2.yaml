      when: Jan. 3
      date: '1967-01-03'
      thread: japan-and-korea-korean-troops
      also:
      - vietnam-operations
      c: The Korean Capital Division begins Maeng Ho 8, extending its area south along Highways 1 and 6B between Qui Nhơn
        and Sông Cầu; the 95th North Vietnamese Regiment avoids contact. By February's end 202 of the enemy killed, two Koreans.
      n: '[[w.macv-command-history-1967]], 379.'
