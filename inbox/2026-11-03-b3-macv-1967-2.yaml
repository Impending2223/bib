      when: Feb. 25
      date: '1967-02-25'
      thread: vietnam-operations
      c: Sharp asks the Joint Chiefs for more naval gunfire ships, citing Westmoreland's requirements and the wider Sea Dragon.
        Mar. 20, the Joint Chiefs answer, five Coast Guard cutters by May 10, two gunboats by Apr. 30, heavier gunfire under
        study.
      n: '[[w.macv-command-history-1967]], 486–87. Names: Sharp, Westmoreland.'
