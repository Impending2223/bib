      thread: vietnam-operations
      c: The 25th Infantry Division's three operations in Tây Ninh, Hậu Nghĩa and Bình Dương, to run seven months; Kole Kole,
        the 2d Brigade, May 13; Barking Sands, the 1st, and Diamond Head, the 3d, May 17.
