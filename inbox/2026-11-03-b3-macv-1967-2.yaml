      when: June 16
      date: '1967-06-16'
      thread: vietnam
      c: Westmoreland approves CORDS's proposal for a joint American civil and military program against the Viet Cong infrastructure,
        with the intelligence services of both countries and a system of coordinating committees and centers at every level.
      n: '[[w.macv-command-history-1967]], 603. Names: Westmoreland.'
