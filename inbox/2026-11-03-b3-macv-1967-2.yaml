      date: '1967-12-20'
      thread: vietnam-air-war
      c: Near the DMZ, all nine B-52s of a mission report at least two probable SAMs detonating at 32,000 to 36,000 feet,
        the nearest 1,000 feet away; the second firing at B-52s, after Oct. 29. None lost.
      n: '[[w.macv-command-history-1967]], 437 (for the year, 55 SAMs to an aircraft lost).'
