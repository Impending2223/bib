      when: Late August
      date: 1967-08
      thread: vietnam-operations
      c: 'Belt Drive and Beacon Point, Thừa Thiên, the Special Landing Forces against disruption of the elections of Sept.
        3: Belt Drive the Pacific Fleet''s 38th assault landing in South Vietnam since March 1965. Then Ballistic Charge,
        Sept. 16–22, Quảng Nam and Quảng Tín; Fortress Sentry, Sept. 17–25, Quảng Trị.'
      n: '[[w.macv-command-history-1967]], 370. To check: CTG 79.4 to BLT 1/3, 301540Z Aug 67, "Operation BEACON POINT" (cited
