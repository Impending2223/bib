      when: Oct. 20
      date: '1967-10-20'
      thread: vietnam
      c: 'MACV Planning Directive 9-67, guidance to the senior commanders for Nov. 1, 1967, to Apr. 30, 1968: "an all-out
        offensive on all fronts--political, military, economic, and psychological"; the war "has passed the point at which
        losses inflicted on the enemy exceed his current replacement input." Multi-brigade offensives against base areas not
        yet invaded; pacification''s priority III and IV Corps, then II, then I.'
      n: '[[w.macv-command-history-1967]], 342–45. To check: COMUSMACV Planning Directive No. 9-67, Oct. 29, 1967 (cited by
        [[w.macv-command-history-1967]], 343 n.25). Check: the text gives Oct. 20, the note Oct. 29.'
