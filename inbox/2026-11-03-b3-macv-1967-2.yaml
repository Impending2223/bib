      when: Feb. 11
      date: '1967-02-11'
      thread: vietnam-force-levels
      c: III MAF asks Westmoreland for an Army brigade of at least three battalions, Feb. 22 to May 15, to clear the Sa Huỳnh
        area for surveys of beach and airfield sites, a boat facility, a C-130 strip and a CIDG camp.
      n: '[[w.macv-command-history-1967]], 335. To check: CG III MAF to COMUSMACV, 110308Z Feb 67, "Forces for Sa Huynh and
        Operation LEWIS" (cited by [[w.macv-command-history-1967]], 335 n.17). Names: Westmoreland.'
