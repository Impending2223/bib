    entry:
      id: cal.1967-03.vietnam-2
      when: March
      date: 1967-03
      thread: vietnam
      c: The Philippines. Westmoreland briefs the American diplomats of the Pacific Command's area. The enemy, with three
        divisions in or near the DMZ and one moved to Quảng Ngãi, will seek to regain the initiative, exact the most attrition,
        win victories "of high psychological impact," disrupt Revolutionary Development and rest his main forces in the sanctuaries.
      n: '[[w.macv-command-history-1967]], 331–32. To check: Briefing, COMUSMACV to US PACOM-Area Diplomats in Philippines,
        March 1967 (cited by [[w.macv-command-history-1967]], 332 n.12). Names: Westmoreland. Check: the day.'
      src:
