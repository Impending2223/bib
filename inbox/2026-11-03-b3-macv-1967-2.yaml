      when: Nov. 7
      date: '1967-11-07'
      thread: korea
      also:
      - vietnam-force-levels
      c: The Joint Chiefs send Sharp a plan McNamara has approved, ten UH-1D helicopters diverted from an aviation company
        bound for Vietnam to Korea, to give the Eighth Army more surveillance and quick troop lift. Nov. 17, Westmoreland
        to USARV, the 134th Assault Helicopter Company's lift in II Corps cut from 23 helicopters to 13.
      n: '[[w.macv-command-history-1967]], 421. To check: JCS to CINCPAC, 072014Z Nov 67, "Helicopter Support for Korea" (cited
