- add:
    entry:
      id: cal.1967-03.vietnam-3
      when: Late March
      date: 1967-03
      thread: vietnam
      c: Westmoreland reviews PROVN, the Army's study of pacification and long-term development, with many reservations. Written
        on the experience of 1964 and 1965, it ignored the field forces' headquarters and the newly acquired skills, and assumed
        the South Vietnamese division commanders cared little about Revolutionary Development.
      n: '[[w.macv-command-history-1967]], 584 (at the beginning of 1967, rumors of a civil-military rivalry and a military
        takeover of pacification, from the study''s becoming known). Names: Westmoreland. Check: the day.'
      src:
        c: b157ab7e
        rows:
        - 'w.macv-command-history-1967 584: all'
      tags:
      - name:westmoreland-william
