    entry:
      id: cal.1967-09-22.vietnam
      when: Sept. 22
      date: '1967-09-22'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: Westmoreland orders a survey of the validity of the enemy body counts, after press inferences that they were inflated;
        teams to each corps from October. Found, no intentional inflation; double counting under five to ten percent in a
        major action.
      n: '[[w.macv-command-history-1967]], 967–68. Names: Westmoreland.'
      src:
        c: 7db5f75a
        rows:
        - 'w.macv-command-history-1967 967–68: all'
      tags:
      - name:westmoreland-william
    section: '196709'
- add:
    entry:
      id: cal.1967-07-17.vietnam-prisoners
      when: July 17
      date: '1967-07-17'
      thread: vietnam-prisoners
      c: 'A White House statement calls on the NLF and North Vietnam to permit impartial inspection of all prisoners and to
        repatriate the sick and wounded, and repeats the wish for an exchange: the United States willing "to discuss such
        exchanges at any time and in any appropriate way, using intermediaries or directly, by public means or privately."'
      n: '[[w.macv-command-history-1967]], 970 (read off the page image).'
      src:
        c: 67bc8cab
        rows:
        - 'w.macv-command-history-1967 970: all'
    section: '196707'
