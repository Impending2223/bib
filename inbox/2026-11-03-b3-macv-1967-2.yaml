      date: '1967-07-27'
      thread: vietnam-operations
      c: Coronado II begins on intelligence of a buildup west of Mỹ Tho; contact July 29 in the Cẩm Sơn secret zone; a South
        Vietnamese Marine task force heavily engaged 48 hours from July 30. It ends Aug. 3, 441 of the enemy killed.
      n: '[[w.macv-command-history-1967]], 396. See [[cal.1967-06-04.vietnam-operations]].'
