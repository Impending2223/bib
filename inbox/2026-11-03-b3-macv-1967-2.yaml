      date: '1967-07-29'
      thread: vietnam-air-war
      c: Fire aboard the carrier *Forrestal* off North Vietnam, a missile released by accident from an aircraft's wing just
        before the day's first launch; 131 killed, 62 injured, three missing. She returns to Norfolk for repairs; the bombing
        of the North curtailed, her A-6s and Walleye-capable aircraft missed.
