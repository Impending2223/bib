      thread: japan-and-korea-korean-troops
      c: The first increment of the Korean augmentation, 938 enlisted men, out of Pusan July 8 in the USNS *Gordon*, lands
        at Đà Nẵng.
      n: '[[w.macv-command-history-1967]], 260.'
      src:
