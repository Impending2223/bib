      when: Mar. 17
      date: '1967-03-17'
      thread: vietnam
      c: 'Rusk''s guidelines to the embassy on Revolutionary Development: Saigon to put its best officers in command of units
        supporting it, relieve and publicly rebuke those who fail, reward and promote those who succeed.'
      n: '[[w.macv-command-history-1967]], 581. Names: Rusk.'
