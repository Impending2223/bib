      c: The Joint Chiefs authorize Westmoreland to fire artillery from South Vietnam against military targets in Laos. In
        early June MACV republishes its rules of engagement for the Laotian border with that change alone.
      n: '[[w.macv-command-history-1967]], 352. To check: COMUSMACV to FFORCEV commanders, 101811Z Jun 67, "Rules of Engagement--Laos"
