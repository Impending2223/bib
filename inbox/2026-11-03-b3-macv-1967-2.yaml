      c: 'Westmoreland repeats his request of September to Sharp for 1,200 B-52 sorties a month, with an account of their
        effects: damage, casualties, the enemy''s tactics and deployments changed, his plans disrupted, "the tremendous psychological
        effect on those who survive a B-52 strike."'
      n: '[[w.macv-command-history-1967]], 407 (the Joint Chiefs, in October, suggestions for the 800 and a request for more
        justification). Names: Westmoreland, Sharp.'
