    text: 'Check: MACV''s History, 45, has Hanoi broadcast July 8 that Thanh died of a heart attack in a Hanoi hospital July
      6; a North Vietnamese soldier''s notebook taken in August, killed in action July 6; another report, wounded in a July
      air strike on the Iron Triangle.'
