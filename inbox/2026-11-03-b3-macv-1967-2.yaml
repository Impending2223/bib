      date: '1967-05-07'
      thread: vietnam-operations
      c: 'The attack on Bình Thủy air base: four A-1s, two H-34s and an Air Force hangar lost, a South Vietnamese AC-47 and
        a hangar damaged. May 13, an attack on Biên Hòa air base.'
