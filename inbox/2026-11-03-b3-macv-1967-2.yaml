      when: June 3
      date: '1967-06-03'
      thread: vietnam-force-levels
      c: Sharp concurs in Westmoreland's request for the South Vietnamese forces' fiscal 1968 levels and asks the Joint Chiefs'
        approval; the Chiefs ask about inflation, dollar costs and more advisers. McNamara briefed in Saigon in early July
        on a force of 685,739.
      n: '[[w.macv-command-history-1967]], 185–86. Names: Sharp, Westmoreland, McNamara.'
