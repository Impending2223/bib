      thread: vietnam-operations
      c: The 4th Infantry Division begins Francis Marion in the same area. From June 9, enemy mortar and rocket attacks on
        American and South Vietnamese positions round Pleiku; the B-3 Front directing the 24th North Vietnamese Regiment in
        western Kontum. By June's end, 709 of the enemy killed.
      n: '[[w.macv-command-history-1967]], 377–78. To check: MACV MONEVALs, April, May and June 1967; CG I FFORCEV to COMUSMACV,
