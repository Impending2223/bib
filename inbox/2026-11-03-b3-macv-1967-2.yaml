      c: Prairie ends, below the DMZ in Quảng Trị, begun Aug. 3, 1966, as a battalion's search and grown to nine battalions
        by October against the North Vietnamese 324B Division; 1,397 of the enemy counted killed, 14,228 helicopter and 5,190
        tactical air sorties.
