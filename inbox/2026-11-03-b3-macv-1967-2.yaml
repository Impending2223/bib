      when: Aug. 1
      date: '1967-08-01'
      thread: defense
      also:
      - vietnam-operations
      c: The Defense Department announces the battleship *New Jersey* will be brought out of mothballs and recommissioned
        for Southeast Asia, on the line about April 1968.
      n: '[[w.macv-command-history-1967]], 490.'
      src:
        c: 3d5e699b
        rows:
        - 'w.macv-command-history-1967 490: all'
