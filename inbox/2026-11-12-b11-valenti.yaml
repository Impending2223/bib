    entry:
      id: cal.1964-12.program
      when: Dec.
      date: 1964-12
      thread: program
      c: John Steinbeck, whom Johnson asked Valenti to consult for the inaugural address, sends Valenti his material about
        a month before the inaugural. Valenti passes it to Johnson and to Goodwin, who is to put the speech together; Goodwin
        is noncommittal.
      n: '[[w.valenti-very-human-president]], 86 (Valenti''s account). Check: the day; "about a month before the inaugural."
        Names: Valenti, Johnson, Goodwin.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-01.program-4
      when: Jan.
      date: 1965-01
      thread: program
      c: 'Johnson, shown Goodwin''s first draft of the inaugural without any of Steinbeck''s material, has encircled two of
        Steinbeck''s paragraphs: "I want this in the speech. It is much too good to leave unsaid." The first begins: "The
        Great Society is not the ordered, changeless, and sterile battalion of the ants." Valenti changes "miracle" to "excitement"
        in the second and drops its last phrase, "not perfect, but perfectible," and tells Goodwin: "A must, the president
        wants." The paragraphs go in. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 86–87 (Valenti''s account). Check: the day; before the inaugural, Jan. 20. See
        [[cal.1964-12.program]]. Names: Johnson, Goodwin, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:valenti-jack
- add:
    entry:
      id: cal.1965-01.economy
      when: Jan.
      date: 1965-01
      thread: economy
      c: The White House. Johnson calls in the press to brief them himself on the new budget, before a blackboard and a slide
        show, step by step through the departments' accounts, without notes. By Valenti's account.
      n: '[[w.valenti-very-human-president]], 157–58 (Valenti''s account). Check: the day. To check: the Public Papers, Jan.
        1965. Names: Johnson, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1965-01-05.white-house
      when: Jan. 5
      date: '1965-01-05'
      thread: white-house
      c: 'Valenti to Johnson, a memorandum: a former Cabinet officer of another administration has just talked with General
        Eisenhower and wants to discuss it with him; "He will be in Washington on Thursday if you choose to see him for a
        brief moment." Johnson under "brief moment": "ha, ha, ha!" He sees him.'
      n: '[[w.valenti-very-human-president]], 175 (Valenti''s account; the former Cabinet officer unnamed). Names: Valenti,
        Johnson, Eisenhower.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1965-03-29.vietnam-diplomacy
      when: Mar. 29
      date: '1965-03-29'
      thread: vietnam-diplomacy
      c: 'Valenti to Johnson, "Lower Mekong Basin": the project of Cambodia, Laos, Thailand and South Vietnam since 1957,
        under the UN Economic Commission for Asia and the Far East; more than $14 million spent; the American share less than
        four days of military aid in South Vietnam; the North Vietnamese and Chinese have raised no objection; "the one focus
        to which all the nations, including the North Vietnamese could be drawn." Johnson writes at the top: "Get this to
        Goodwin this a.m." Goodwin is drafting the Johns Hopkins speech. Within the hour Johnson questions Valenti, then telephones
        Rusk, McNamara and Eugene Black; the Mekong goes into the speech of Apr. 7.'
      n: '[[w.valenti-very-human-president]], 214–18 (Valenti''s account; the memorandum printed). Names: Valenti, Johnson,
        Goodwin, Rusk, McNamara.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:rusk-dean
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-04-26.white-house
      when: Apr. 26
      date: '1965-04-26'
      thread: white-house
      c: 'Valenti to Johnson, a memorandum: after long talks with Treasury Secretary Fowler and Secret Service chief Rowley,
        who want 4,249 square feet of the Executive Office Building, Valenti has refused and sends their letters. Johnson
        at the foot: "no, hell no. Secret Service would absolutely have no hesitancy in occupying my bedroom!"'
      n: '[[w.valenti-very-human-president]], 175 (Valenti''s account). Names: Valenti, Johnson, Fowler, Rowley.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:fowler-henry-h
      - name:rowley-james-j
- add:
    entry:
      id: cal.1965-06-28.white-house
      when: June 28
      date: '1965-06-28'
      thread: white-house
      c: 'Boston, the annual convention of the Advertising Federation of America. Valenti, with Johnson''s consent, speaks
        on the presidency and how Johnson handles it. Closing: "I sleep each night a little better, a little more confidently
        because Lyndon Johnson is my President." Reedy telephones Valenti afterward: the press office is out of copies; every
        bureau wants one.'
      n: '[[w.valenti-very-human-president]], 94–96 (Valenti''s account; the closing paragraphs printed). Names: Valenti,
        Johnson, Reedy.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:reedy-george-e
      - city:boston
      - state:ma
- add:
    entry:
      id: cal.1965-12-14.vietnam-pause-2
      when: Dec. 14
      date: '1965-12-14'
      thread: vietnam-pause
      c: Ball, Bundy, Moyers and Valenti, at Johnson's request, meet several hours on a pause in the bombing and whether it
        can go into his speech at the lighting of the Christmas tree, Friday. Ball is for a pause; Bundy leans the other way;
        Valenti with Ball.
      n: '[[w.valenti-very-human-president]], 221 (Valenti''s account). See [[cal.1965-12-14.vietnam-pause]]. Names: Ball,
        Bundy, Moyers, Valenti, Johnson.'
      tags:
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:moyers-bill
      - name:valenti-jack
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-12-14.vietnam-pause-3
      when: Dec. 14
      date: '1965-12-14'
      thread: vietnam-pause
      c: 'Valenti to Johnson, 7:15 p.m., Top Secret, Eyes Only, after the meeting with Ball, Bundy and Moyers: he sides with
        Ball for the pause. "We are in quicksand"; bombing only hardens Hanoi; a pause gives the Russians room (Thompson:
        relief in Moscow); fighting in the South goes on; the bombing can be resumed; the Republicans and hard-liners will
        urge a Haiphong blockade. Johnson questions him over an hour on how firm he is.'
      n: '[[w.valenti-very-human-president]], 221–23 (Valenti''s account; the memorandum printed). See [[cal.1965-12-14.vietnam-pause-2]].
        Names: Valenti, Johnson, Ball, Bundy, Thompson.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:thompson-llewellyn-e
- add:
    entry:
      id: cal.1966-01-22.vietnam-diplomacy
      when: Jan. 22
      date: '1966-01-22'
      thread: vietnam-diplomacy
      also:
      - vietnam-honolulu
      c: 'Valenti to Johnson, 3:50 p.m., after Johnson''s statement of the day: begin at once "one peace move right after
        another," with the military pressure kept up. Suggestions: a letter to the Pope; small briefings of Senators and Congressmen;
        task forces to Vietnam at two-week intervals (Freeman, Hornig, Gardner, a mayor); a meeting of Johnson with Westmoreland
        and Prime Minister Kỳ; a personal letter from Johnson to heads of government. Johnson seizes on the meeting and begins
        within hours to give it shape: Honolulu.'
      n: '[[w.valenti-very-human-president]], 240–42 (Valenti''s account; the memorandum printed). Names: Valenti, Johnson,
        Freeman, Hornig, Gardner, Westmoreland.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:freeman-orville-l
      - name:hornig-donald-f
      - name:gardner-john-w
      - name:westmoreland-william
- add:
    entry:
      id: cal.1966-03-21.transition-and-staff
      when: Mar. 21
      date: '1966-03-21'
      thread: transition-and-staff
      c: 'Valenti to Johnson, 7:45 p.m.: the Administration has not dramatized its achievements. Start afresh in Bundy''s
        foreign-policy staff: Rostow as Johnson''s representative on the SIG at State, with Adam Yarmolinsky on defense, Robert
        Scalapino and John Roche; advertise it as "a Johnson team." Give Komer, if he takes Vietnam, a title that is a slogan:
        Special Assistant for Peaceful Re-Construction in Vietnam. The Asian Development Bank not yet shown as a great step.'
      n: '[[w.valenti-very-human-president]], 252–53 (Valenti''s account; the memorandum printed). Names: Valenti, Johnson,
        Bundy, Rostow, Yarmolinsky, Roche, Komer.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:rostow-walt-w
      - name:yarmolinsky-adam
      - name:roche-john-p
      - name:komer-robert-w
- add:
    entry:
      id: cal.1966-04-04.vietnam-struggle-7
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-struggle
      c: 'Valenti to Johnson, 8:30 a.m., on the Kỳ government: to preserve Kỳ without American force, name a date for national
        elections, say June 1; bring four or five Buddhist and Catholic leaders into the directorate; show Viet Cong agents
        as provocateurs behind the demonstrations; split the Buddhist leadership against Trí Quang; force by Kỳ not likely
        to work; restoring Thi "as a final, totally last resort." If Kỳ falls, wait and see what a new government brings.'
      n: '[[w.valenti-very-human-president]], 244–47 (Valenti''s account; the memorandum printed). See [[cal.1966-04-04.vietnam-struggle-3]].
        Names: Valenti, Johnson.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-04-04.vietnam-struggle-8
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-struggle
      c: 'Valenti to Johnson, 10:20 p.m., after "tonight''s meeting on Vietnam": "take the starch out of the demonstrations"
        by bringing Thi into the directorate again beside Thiệu, a Buddhist and a Catholic; "We have to sacrifice Ky," placated
        in the larger interests of a free Vietnam; take the initiative.'
      n: '[[w.valenti-very-human-president]], 248–49 (Valenti''s account; the memorandum printed). See [[cal.1966-04-04.vietnam-struggle-3]].
        Names: Valenti, Johnson.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-04-06.vietnam-struggle-3
      when: Apr. 6
      date: '1966-04-06'
      thread: vietnam-struggle
      c: 'Valenti to Johnson, 6:30 p.m., on the 5:00 meeting: every Buddhist expert in the government to give his view of
        Trí Quang; a young man on Habib''s staff in Saigon, "the closest man to Tri Quang among the Americans," to be asked;
        General Walt''s evaluation of Thi, from Humphrey, who had it from Greene, attached. Johnson''s rule, "a man''s judgment
        is no better than his information"; a government-wide sifting of every shred of information in the next 48 hours.'
      n: '[[w.valenti-very-human-president]], 249–50 (Valenti''s account; the memorandum printed). See [[cal.1966-04-06.vietnam]].
        Names: Valenti, Johnson, Humphrey.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1966-04-12.latin-america
      when: Apr. 12
      date: '1966-04-12'
      thread: latin-america
      c: 'Mexico City, advancing Johnson''s visit with Moyers, two days before the arrival. Ambassador Freeman: the Mexican
        president must never ride in a closed car, so Johnson cannot use his armored limousine. Valenti telephones the Ranch.
        Johnson: "Jack, I don''t care what kind of car I ride in. I will even ride a burro if that is the only way to get
        into the city. ... Whatever you and Ambassador Freeman decide is the right course for me to follow, I will do it."'
      n: '[[w.valenti-very-human-president]], 117–20 (Valenti''s account; "two days before the arrival"). Check: the day.
        To check: the Public Papers, Apr. 1966. Names: Valenti, Moyers, Freeman, Johnson.'
      tags:
      - name:valenti-jack
      - name:moyers-bill
      - name:freeman-fulton
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-04-12.latin-america-2
      when: Apr. 12
      date: '1966-04-12'
      thread: latin-america
      c: 'Valenti, with Johnson''s answer on the open car, telephones J. Edgar Hoover. Hoover: "Just put yourself in the hands
        of the Mexican Secret Police and the local constabulary ... the president would be safer driving down the boulevards
        of Mexico City than he would be in New York City." He sends a dozen FBI agents from nearby cities in the southern
        United States. Moyers, Freeman and Valenti agree to the open car.'
      n: '[[w.valenti-very-human-president]], 120–21 (Valenti''s account). Check: the day. See [[cal.1966-04-12.latin-america]].
        Names: Valenti, Hoover, Johnson, Moyers, Freeman.'
      tags:
      - name:valenti-jack
      - name:hoover-j-edgar
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:freeman-fulton
- add:
    entry:
      id: cal.1966-04-14.latin-america
      when: Apr. 14
      date: '1966-04-14'
      thread: latin-america
      c: Johnson flies by helicopter from the Ranch to Randolph Field, Tex., and by Air Force One to Mexico City, landing
        5:30 p.m. President Díaz Ordaz greets him with an abrazo. The two ride in an open limousine the fourteen kilometers
        to Los Pinos, nearly three hours through almost three million people. By Valenti's account.
      n: '[[w.valenti-very-human-president]], 121–22 and 122 n. (Valenti''s account). To check: the Public Papers, Apr. 14,
        1966. Names: Johnson.'
      tags:
