patch: 2026-11-12-b11-valenti
by: Claude (batch 11 reader, Valenti, A Very Human President, 1963-66)
ops:
- add:
    entry:
      id: cal.1963-11-21.democratic-party-2
      when: Nov. 21
      date: '1963-11-21'
      thread: democratic-party
      also:
      - assassination
      c: 'Houston, the Rice Hotel, the end of the motorcade. O''Donnell to Valenti: "What''s your estimate?" of the crowd.
        Valenti: "between 300,000 and 400,000." O''Donnell: "Be sure the newspapers and TV guys get that figure. Have the
        chief of police give it to them." By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 31 (Valenti''s account; the *Houston Post* later "over 300,000"). See [[cal.1963-11-21.assassination]].
        Names: O''Donnell, Valenti.'
      tags:
      - name:odonnell-kenneth-p
      - name:valenti-jack
      - state:tx
      - city:houston
- add:
    entry:
      id: cal.1963-11-21.democratic-party-3
      when: Nov. 21
      date: '1963-11-21'
      thread: democratic-party
      also:
      - assassination
      c: 'Houston, the Rice Hotel, the Vice President''s suite. Johnson to Valenti in an adjoining room: "Fine reception,
        Jack ... I think the president will be pleased." He holds up the printed program for the Austin dinner, "excellent":
        "Will we have any problems tonight?" Then: "Why don''t you pack a bag and fly with me to Fort Worth tonight, and then
        we''ll go on to Austin tomorrow night?"'
      n: '[[w.valenti-very-human-president]], 31–33 (Valenti''s account). See [[cal.1963-11-21.assassination]]. Names: Johnson,
        Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - state:tx
      - city:houston
- add:
    entry:
      id: cal.1963-11-21.democratic-party-4
      when: Nov. 21
      date: '1963-11-21'
      thread: democratic-party
      also:
      - assassination
      c: 'Houston, the Sam Houston Coliseum, the enclosure behind the platform, before the Albert Thomas dinner. Kennedy and
        Johnson talk "easily of politics." Johnson presents Valenti; Kennedy: "Lyndon tells me I have you to thank for this
        terrific crowd in Houston." Valenti''s first meeting with Kennedy.'
      n: '[[w.valenti-very-human-president]], 36–37 (Valenti''s account). See [[cal.1963-11-21.assassination]]. Names: Kennedy,
        Johnson, Valenti, Thomas.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:thomas-albert
      - state:tx
      - city:houston
- add:
    entry:
      id: cal.1963-11-21.democratic-party-5
      when: Nov. 21–22
      date: '1963-11-21'
      thread: democratic-party
      also:
      - assassination
      c: Fort Worth, midnight, the airport; the motorcade to the Hotel Texas. Yarborough, who had refused the ride at Houston,
        now rides with Johnson and Mrs. Johnson, "beaming." Valenti supposes that Kennedy or someone close to him had talked
        with Yarborough.
      n: '[[w.valenti-very-human-president]], 38 (Valenti''s account; the supposition his). Check: the day; "midnight," the
        night of Nov. 21. See [[cal.1963-11-21.assassination]]. Names: Yarborough, Johnson, Lady Bird Johnson, Valenti.'
      tags:
      - name:yarborough-ralph
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:valenti-jack
      - state:tx
      - city:fort-worth
- add:
    entry:
      id: cal.1963-11-22.succession-20
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One, Love Field, before the oath. Katzenbach, from Washington, has phoned the wording of the oath to Marie
        Fehmer, who types it. Valenti, on the telephone with Katzenbach in his office, has him read it again against the typescript:
        "It was correct." Judge Sarah Hughes then comes aboard.'
      n: '[[w.valenti-very-human-president]], 47 (Valenti''s account). See [[cal.1963-11-22.succession]]. Names: Katzenbach,
        Valenti, Hughes.'
      tags:
      - name:katzenbach-nicholas
      - name:valenti-jack
      - name:hughes-sarah-t
- add:
    entry:
      id: cal.1963-11-22.succession-21
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One, in the air. Johnson tells Valenti, Moyers and Liz Carpenter he wants to speak briefly at Andrews,
        to make clear "that the presidency will go on" and to speak of his sorrow. Each writes a version; Johnson edits the
        one he is given, striking the last sentence, "I ask for God''s help," and writing: "I ask for your help—and God''s."
        The paragraph goes on an index card into his pocket.'
      n: '[[w.valenti-very-human-president]], 50–51 (Valenti''s account; he does not recall whose draft it was). See [[cal.1963-11-22.succession]].
        Names: Johnson, Valenti, Moyers, Carpenter.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:moyers-bill
      - name:carpenter-liz
- add:
    entry:
      id: cal.1963-11-22.succession-22
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One. Johnson telephones Bundy and Walter Jenkins in Washington. Reminded that Rusk and five other Cabinet
        members are in the air for Japan: "Get them back." The Cabinet to meet Saturday; the legislative leaders alerted for
        his arrival; the press told of the meetings with McNamara, Bundy and the leaders. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 52 (Valenti''s account; who is addressed in the orders he does not say). See
        [[cal.1963-11-22.succession]]. Names: Johnson, Bundy, Jenkins, Rusk, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:jenkins-walter-w
      - name:rusk-dean
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1963-11-22.succession-23
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'The Elms, the bedroom, about midnight. Johnson to Valenti: call Mary Margaret for his clothes, put his Houston business
        in order, "I want you to be on my staff at the White House. You can live with me here and at the White House when
        we finally move there." Valenti has no answer. He lives in the White House from Dec. 7, 1963, to Feb. 15, 1964.'
      n: '[[w.valenti-very-human-president]], 7–8 (Valenti''s account). See [[cal.1963-11-22.civil-rights-bill]]. Names: Johnson,
        Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1963-12-21.press-and-broadcasting
      when: Dec. 21
      date: '1963-12-21'
      thread: press-and-broadcasting
      c: 'The White House, lunch for three of the *New York Daily News*: F. M. Flynn, president and publisher; R. G. Shand,
        managing editor; Ted Lewis, its Washington political columnist. Johnson takes them through his office and the Rose
        Garden to the pool and invites them to swim. They have no suits; he swims without one. Moyers and Valenti there. Lunch
        in the family dining room. The *News* does not change its line, by Valenti.'
      n: '[[w.valenti-very-human-president]], 164–66 (Valenti''s account). Names: Johnson, Moyers, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-03-04.program
      when: Mar. 4
      date: '1964-03-04'
      thread: program
      c: Richard Goodwin's first draft of Johnson's remarks for the Eleanor Roosevelt Award, on how a nation can redress its
        grievances, contains the phrase "Great Society." Valenti likes it. Late that evening he proposes to Johnson to scrap
        the speech for the occasion and enlarge the theme into his philosophy and aims for the country at home. Johnson agrees;
        the phrase goes into the University of Michigan address. By Valenti's account.
      n: '[[w.valenti-very-human-president]], 85 and n. (Valenti''s account). Check: the day; "late that evening" follows
        the draft for the award of Mar. 4, on which evening Valenti telephoned Johnson from the Statler Hilton at 8:50 p.m.
        ([[cal.1964-03-04.women]]). To check: the Public Papers, Mar. 4, 1964. Names: Goodwin, Valenti, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:valenti-jack
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-03-13.states-and-cities
      when: Mar. 13
      date: '1964-03-13'
      thread: states-and-cities
      c: 'Johnson inspects the Ohio Valley flood damage by Air Force One, leaving Andrews, Md., 1:23 p.m. Aboard: Edwin Weisl
        and Samuel Newhouse, the publisher, asked to lunch; Representatives and Senators; Secretary Freeman. Pittsburgh: Mayor
        Barr; the governors of West Virginia, Ohio, Kentucky, Indiana and Illinois (Barron, Rhodes, Breathitt, Welsh, Kerner)
        come aboard. Flight over the flooded land. Cincinnati: Johnson speaks briefly at the airport; Missouri''s Governor
        Dalton joins. At the White House a little after 7 p.m. Johnson asks Newhouse to stay the night; he goes home. By Valenti''s
        account.'
      n: '[[w.valenti-very-human-president]], 166–68 (Valenti''s account; he dates it Friday, Mar. 13). To check: the Public
        Papers, Mar. 13, 1964; the President''s Daily Diary. Names: Johnson, Weisl, Freeman, Barr, Barron, Rhodes, Breathitt,
        Welsh, Kerner, Dalton, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:weisl-edwin-l-jr
      - name:freeman-orville-l
      - name:barr-joseph-m
      - name:barron-w-w
      - name:rhodes-james-a
      - name:breathitt-edward-t
      - name:welsh-matthew-e
      - name:kerner-otto
      - name:dalton-john-m
      - name:valenti-jack
      - city:pittsburgh
      - city:cincinnati
- add:
    entry:
      id: cal.1964-06-04.robert-kennedy
      when: June 4
      date: '1964-06-04'
      thread: robert-kennedy
      c: 'The Oval Office. Johnson and Robert Kennedy, an hour and twenty minutes, on the Olympic Games, which Kennedy wants
        him to take an interest in; General James Gavin has been pressing Valenti for a visit with Johnson, and Kennedy''s
        request comes through O''Donnell. The correspondents in the West Lobby take it for talk of the vice presidency. O''Donnell
        to Valenti meanwhile: tomorrow''s New York papers will say Kennedy is preparing to resign and run for the Senate.
        By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 129–30 (Valenti''s account). Names: Johnson, Robert Kennedy, Gavin, O''Donnell,
        Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:gavin-james-m
      - name:odonnell-kenneth-p
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-06-05.robert-kennedy
      when: June 5
      date: '1964-06-05'
      thread: robert-kennedy
      c: 'The bedroom, breakfast. Johnson to Valenti on Kennedy''s visit of the day before: "I was very impressed with Bobby
        yesterday ... knew them cold, and made a very able presentation. Damn able." On civil rights: "I asked him about the
        civil rights program and told him I was going to move it forward if I did nothing else. He was very informative and
        generous in his conversation." By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 130 (Valenti''s account). See [[cal.1964-06-04.robert-kennedy]]. Names: Johnson,
        Robert Kennedy, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-06-05.robert-kennedy-2
      when: June 5
      date: '1964-06-05'
      thread: robert-kennedy
      c: 'O''Donnell to Valenti: Johnson and Kennedy should see more of each other privately; Kennedy is ever more impressed
        with Johnson''s resolution on civil rights. Against Paul Corbin, Kennedy''s man, who has been stirring New Hampshire
        for Kennedy for Vice President. Valenti offers no dissent. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 130–31 (Valenti''s account; "the next day" after the breakfast, the day''s schedule
        that follows being June 5). Check: the day. Names: O''Donnell, Johnson, Robert Kennedy, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:odonnell-kenneth-p
      - name:valenti-jack
      - state:nh
- add:
    entry:
      id: cal.1964-06-05.labor-2
      when: June 5
      date: '1964-06-05'
      thread: labor
      c: The White House. Johnson meets John L. Lewis, his mine union executives and the mine owners on national coal policy,
        forty-five minutes. Then O. A. Knight and the executives of the Oil, Chemical and Atomic Workers, brought in as the
        Lewis group leaves, to meet the coal group. By Valenti's account.
      n: '[[w.valenti-very-human-president]], 131 (Valenti''s account). See [[cal.1964-06-05.program]]. Names: Lewis, Johnson,
        Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:lewis-john
- add:
    entry:
      id: cal.1964-06-05.vietnam-5
      when: June 5
      date: '1964-06-05'
      thread: vietnam
      also:
      - laos
      c: 'The Situation Room, nearing 7 p.m. Johnson, with Rusk, McNamara and Bundy, Valenti present, on intelligence on Laos
        and South Vietnam. Johnson: "We need more diplomatic ingenuity, not more hardware"; civilian governors and administrative
        advisers, AID, Agriculture and Peace Corps people on the farm side; "We''ve got to see that the South Vietnamese government
        wins the battle, not so much of arms, but of crops and heart and caring." To Rusk, of a boyhood fight in which his
        friends ran: "if I have to turn back I want to make sure I am not in too deep to do so." Leaving, he asks Bundy to
        talk to Robert Kennedy about Vietnam and how he sees Lodge''s work in Saigon.'
      n: '[[w.valenti-very-human-president]], 131–34 (Valenti''s account). See [[cal.1964-06-05.vietnam-4]]. Names: Johnson,
        Rusk, McNamara, Bundy, Valenti, Robert Kennedy, Lodge.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:valenti-jack
      - name:kennedy-robert-f
      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1964-06-06.laos-3
      when: June 6
      date: '1964-06-06'
      thread: laos
      c: The National Security Council on Laos decides to overfly Laos with frequent reconnaissance. Afterward Johnson and
        his party leave by helicopter for New York. By Valenti's account.
      n: '[[w.valenti-very-human-president]], 135 (Valenti''s account). See [[cal.1964-06-06.laos]]. Names: Johnson, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-06-06.elections-1964-vice-presidency
      when: June 6
      date: '1964-06-06'
      thread: elections-1964-vice-presidency
      c: 'Valenti advises Humphrey to go to New York on his own, lest speculation on the vice presidency hurt him; Humphrey
        agrees. Within the hour Johnson buzzes Valenti: "Call Hubert and see if he and Muriel would like to go with us." Valenti
        does. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 135 (Valenti''s account). Names: Valenti, Humphrey, Johnson.'
      tags:
      - name:valenti-jack
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-06-06.labor
      when: June 6
      date: '1964-06-06'
      thread: labor
      c: 'New York, the International Ladies'' Garment Workers'' Union health center. Johnson unveils a bust of David Dubinsky;
        Humphrey with him; thousands crowd the garment district. Luncheon: Mayor Wagner, Celler, Ryan, Farbstein, Humphrey.
        Johnson walks two blocks with Dubinsky through the crowd to the union auditorium, 1,600 seats filled. To Dubinsky:
        "I''m going to do much better in New York than a lot of people think." By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 135–37 (Valenti''s account). See [[cal.1964-06-05.labor]]. To check: the Public
        Papers, June 6, 1964. Names: Johnson, Humphrey, Wagner, Celler, Ryan, Farbstein, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:wagner-robert-f-jr
      - name:celler-emanuel
      - name:ryan-william-f
      - name:farbstein-leonard
      - name:valenti-jack
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1964-06-06.poverty
      when: June 6
      date: '1964-06-06'
      thread: poverty
      c: 'New York, after the luncheon at the garment workers'' health center, the men''s room. At Johnson''s request Valenti
        presses Mayor Wagner to end his feud with Adam Clayton Powell over who runs the poverty program in Harlem: Wagner''s
        man is Dr. Kenneth Clark, Powell''s a lieutenant. Johnson needs Powell, chairman of Education and Labor, free for
        the education and poverty bills. Wagner agrees to a cease-fire "for the time being." Valenti reports to Johnson.'
      n: '[[w.valenti-very-human-president]], 136–37 (Valenti''s account). Names: Valenti, Wagner, Powell, Johnson.'
      tags:
      - name:valenti-jack
      - name:wagner-robert-f-jr
      - name:powell-adam-clayton-jr
      - name:johnson-lyndon-b
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1964-06-07.laos
      when: June 7
      date: '1964-06-07'
      thread: laos
      c: 'Michael Forrestal telephones Johnson at 3 a.m.: one of our planes has been shot down over the Plain of Jars. At
        10 a.m. he asks Valenti to get Johnson''s consent to a National Security Council meeting; Johnson agrees. By Valenti''s
        account.'
      n: '[[w.valenti-very-human-president]], 137 (Valenti''s account; he puts the Plain of Jars "in Vietnam"). See [[cal.1964-06-06.laos]].
        Names: Forrestal, Johnson, Valenti.'
      tags:
      - name:forrestal-michael-v
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-06-07.laos-2
      when: June 7
      date: '1964-06-07'
      thread: laos
      c: 'The National Security Council, 12:30 p.m. Reconnaissance to continue; Johnson presses for specific recommendations
        and plans: "Where are we going?" All but General LeMay agree on the plan; LeMay wants to get tougher. After the meeting,
        to Valenti: "I get anxious and look for the fire exits when a general wants to get tough. LeMay scares the hell out
        of me." By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 137–38 (Valenti''s account). See [[cal.1964-06-07.laos]]. Names: Johnson, LeMay,
        Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:lemay-curtis-e
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-06-12.elections-1964-johnson
      when: June 12
      date: '1964-06-12'
      thread: elections-1964-johnson
      c: 'The bedroom, before 8 a.m. Johnson to Valenti: he decided the night before and "just dictated" a statement that
        he will not be a candidate this year; he had first thought to resign, but that would be unfair without a Vice President
        to take his place. Out of the race he could go on with the program without the charge of "politics." Disappointed
        in the Republican leaders, who that week accused him of election-year politics with Southeast Asia; "sick at heart"
        that the Congress has no sense of urgency and works only Tuesday to Thursday. "There aren''t enough Bob McNamaras
        and Dean Rusks." Valenti objects; neither speaks of it again. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 153–54 (Valenti''s account). Names: Johnson, Valenti, McNamara, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:mcnamara-robert-s
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-06-13.vietnam-2
      when: June 13
      date: '1964-06-13'
      thread: vietnam
      c: 'Johnson to Valenti, calling him in: "Have a talk with McGeorge Bundy. The two of you come back to me with suggestions
        about who should go to Saigon to replace Lodge." Lodge has written, in a veiled way, that it is time to leave. Johnson
        tells Valenti he is troubled by what he calls "poor administration" in Lodge''s mission, and is content that Lodge
        be relieved.'
      n: '[[w.valenti-very-human-president]], 138–39 (Valenti''s account). See [[cal.1964-06-13.vietnam]]. Names: Johnson,
        Valenti, Bundy, Lodge.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:bundy-mcgeorge
      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1964-06-13.vietnam-3
      when: June 13
      date: '1964-06-13'
      thread: vietnam
      c: Valenti and Bundy by telephone, later that day. Robert Kennedy has written Johnson that he will go to Vietnam as
        ambassador if wanted; Johnson has asked Rusk, McNamara, Bundy and Kennedy for three names, and each has put his own
        first. Kennedy has also named Terry Sanford, whom McNamara does not favor. Bundy's choice is Ball; Valenti thinks
        Ball too valuable in Washington. They talk of a congressional resolution on Vietnam; Valenti does not think the time
        right; Bundy has working papers for him to take to Johnson.
      n: '[[w.valenti-very-human-president]], 139–41 (Valenti''s account). Names: Valenti, Bundy, Robert Kennedy, Johnson,
        Rusk, McNamara, Ball, Sanford.'
      tags:
      - name:valenti-jack
      - name:bundy-mcgeorge
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:ball-george-w
      - name:sanford-terry
- add:
    entry:
      id: cal.1964-06-14.vietnam-2
      when: June 14
      date: '1964-06-14'
      thread: vietnam
      c: 'The bedroom, early, breakfast with Valenti. Johnson will not name Robert Kennedy to Saigon: "I would be accusing
        myself for the rest of my life if something happened to him out there. ... I can''t trust the security there." He
        asks Valenti to choose among Maxwell Taylor, Ball and Gilpatric. Valenti: Gilpatric, for his administration and accurate
        reports; Ball is needed in Washington; Taylor would inspire the most confidence. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 141–42 (Valenti''s account; "the next morning" after June 13). Check: the day.
        See [[cal.1964-06-13.vietnam]]. Names: Johnson, Valenti, Robert Kennedy, Taylor, Ball, Gilpatric.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:kennedy-robert-f
      - name:taylor-maxwell
      - name:ball-george-w
      - name:gilpatric-roswell-l
- add:
    entry:
      id: cal.1964-06-14.vietnam-3
      when: June 14
      date: '1964-06-14'
      thread: vietnam
      c: The Mansion, the family dining room, noon. Johnson, Clifford and Valenti. Johnson asks Clifford his choice for Saigon,
        then lays out Taylor, Ball and Gilpatric with Valenti's points of the morning, stressing Taylor and the confidence
        he would inspire. Clifford agrees. Johnson mentions that Kennedy has volunteered; Clifford says nothing to that. By
        Valenti's account.
      n: '[[w.valenti-very-human-president]], 142–43 (Valenti''s account). See [[cal.1964-06-14.vietnam]]. Names: Johnson,
        Clifford, Valenti, Taylor, Ball, Gilpatric, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:valenti-jack
      - name:taylor-maxwell
      - name:ball-george-w
      - name:gilpatric-roswell-l
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-06-15.vietnam-4
      when: June 15
      date: '1964-06-15'
      thread: vietnam
      c: 'The White House, after dinner for the Cliffords and the Alsops. Johnson, Clifford, Joseph Alsop and Valenti walk
        five times round the Ellipse, about a mile and a quarter. Johnson presses Alsop: "what the hell would you do at 9:00
        a.m. tomorrow morning?" Alsop answers in generalities. To Clifford and Valenti: Alsop is like de Gaulle on neutralization,
        "Don''t bother me, those are just details." By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 299–300 (Valenti''s account). See [[cal.1964-06-15.elections-1964-johnson]].
        Names: Johnson, Clifford, Alsop, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:alsop-joseph
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-06-17.foreign-aid
      when: June 17
      date: '1964-06-17'
      thread: foreign-aid
      c: 'The White House, 6:30 p.m. Johnson, O''Brien and Valenti with Mahon, Albert and Rooney on passing the foreign aid
        bill without Otto Passman "butchering it up." Johnson: "Either Otto Passman is going to run the foreign policy of
        this country, or I am." The bill is a billion dollars under Kennedy''s last request and what Congress appropriated
        last year: "This is a bare-bones bill ... with no fat on it." He sees the Latin American ambassadors the next day.
        The members agree to talk to Passman and find the votes. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 143–44 (Valenti''s account). Names: Johnson, O''Brien, Valenti, Mahon, Albert,
        Rooney, Passman.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
      - name:valenti-jack
      - name:mahon-george-h
      - name:albert-carl
      - name:rooney-john-j
      - name:passman-otto-e
- add:
    entry:
      id: cal.1964-06-17.program
      when: June 17
      date: '1964-06-17'
      thread: program
      c: 'After the meeting on foreign aid, Johnson to Valenti: "I keep hitting hard because I know this honeymoon won''t
        last. Every day I lose a little more political capital." The critics and snipers will move in, and "We have to get
        all we can, now, before the roof comes down." By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 144 (Valenti''s account). See [[cal.1964-06-17.foreign-aid]]. Names: Johnson,
        Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-06-21.mississippi-3
      when: June 21
      date: '1964-06-21'
      thread: mississippi
      c: 'Representative William Ryan telephones Valenti: he wants to bring in the parents of two of the three missing young
        people. Hoover calls Johnson: the missing youths'' car has been found, burned. Johnson to Hoover, as the parents arrive
        with Lee White: "You are sure that you found the right car, the same color, the same markings."; "Where did you find
        it, how far from Philadelphia, Mississippi?" Then: "Show them in." By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 144–45 (Valenti''s account; "June 21"). Check: the day; the entries of June
        23 have Johnson still holding off Ryan''s visit with the parents ([[cal.1964-06-23.mississippi-3]]). See [[cal.1964-06-21.mississippi]].
        Names: Ryan, Valenti, Hoover, Johnson, White.'
      tags:
      - name:ryan-william-f
      - name:valenti-jack
      - name:hoover-j-edgar
      - name:johnson-lyndon-b
      - name:white-lee-c
      - state:ms
- add:
    entry:
      id: cal.1964-07-24.elections-1964-4
      when: July 24
      date: '1964-07-24'
      thread: elections-1964
      c: 'The White House, afternoon. At Valenti''s instruction Mike Manatos brings Goldwater in by the Southwest Gate, away
        from reporters, to the Cabinet Room. He arrives about 5:15 p.m., fifteen minutes early; Valenti greets him; O''Brien
        and Manatos keep him company. Johnson, meeting some 400 labor leaders, reaches the Oval Office at 5:22 p.m. and reads
        two staff "talking papers" on the visit. Valenti brings Goldwater in: "Hello, Barry, it''s mighty good to see you."
        By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 145–46 (Valenti''s account). See [[cal.1964-07-24.elections-1964]]. Names: Goldwater,
        Manatos, Valenti, O''Brien, Johnson.'
      tags:
      - name:goldwater-barry-m
      - name:manatos-mike-n
      - name:valenti-jack
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-07-25.press-and-broadcasting-2
      when: July 25
      date: '1964-07-25'
      thread: press-and-broadcasting
      also:
      - elections-1964-vice-presidency
      c: The White House, 6:30 to 7:40 p.m. Johnson's backgrounder for Dan Rather of CBS and Robert Thompson of the *Los Angeles
        Times*, no direct quotes; Valenti takes the notes. Johnson on his success with Congress, "I don't wear out," and no
        one there now with Bobby Baker's skill at counting heads (off the record); a call just before from Dirksen; the 264
        businessmen at lunch; the vice president he wants, an "executive operating vice-president," an "improved model of
        a Mac Bundy or Sherman Adams"; Mann and Latin America; Cyprus; Roosevelt his "hero"; Truman, Eisenhower and Kennedy;
        his Tuesday lunch with Rusk and McNamara.
      n: '[[w.valenti-very-human-president]], 301–10 (Valenti''s notes of the interview, printed; his account). Names: Johnson,
        Thompson, Baker, Dirksen, Bundy, Mann, Rusk, McNamara, Valenti.'
