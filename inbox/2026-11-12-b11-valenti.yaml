- add:
    entry:
      id: cal.1966-04-25.transition-and-staff
      when: Apr. 25
      date: '1966-04-25'
      thread: transition-and-staff
      c: 'Johnson to Valenti, a letter, on receiving his resignation to become president of the Motion Picture Association:
        "You know how much I will miss your companionship ... I guess I just didn''t want to admit that a man should need
        another man quite so much." Valenti resigns in June.'
      n: '[[w.valenti-very-human-president]], 253–56 (the letter printed; Valenti''s account). Names: Johnson, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1966-09-04.elections-1968-johnson
      when: Sept. 4
      date: '1966-09-04'
      thread: elections-1968-johnson
      c: 'The Mansion, the family dining room, noon. Johnson, Mrs. Johnson, Valenti and his wife. Valenti raises 1968. Johnson:
        "I won''t be around then. If I could figure some way to get out of this job I would do it now. They would say I was
        playing politics if I resigned and gave the job to Humphrey." "My own party has turned against me, and the Republicans
        have chimed in." "As it is now I have even lost the Congress." "We probably need a fresh face." Valenti believes he
        has committed himself not to run. By Valenti''s account.'
      n: '[[w.valenti-very-human-president]], 154–55 (Valenti''s account; Sunday, Sept. 4, 1966). Names: Johnson, Lady Bird
        Johnson, Valenti, Humphrey.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:valenti-jack
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1966-04.transition-and-staff
      when: Apr.
      date: 1966-04
      thread: transition-and-staff
      c: The Mansion, an evening. Johnson and Mrs. Johnson dine with Valenti and his wife. Valenti gives his reasons for leaving,
        family economics, and the movie chiefs' pledge of a clause in his contract to let him take time out whenever Johnson
        wants him for a particular task. Johnson nods, pleased. Edwin Weisl has cleared the way. By Valenti's account.
      n: '[[w.valenti-very-human-president]], 253–54 (Valenti''s account; "one evening that month"). Check: the day. Names:
        Johnson, Lady Bird Johnson, Valenti, Weisl.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:valenti-jack
      - name:weisl-edwin-l-jr
- add:
    entry:
      id: cal.1966-10.vietnam-johnson-asia
      when: Oct.
      date: 1966-10
      thread: vietnam-johnson-asia
      c: 'Rome. Valenti, meeting Italian officials for the Motion Picture Association, is called from the White House: Johnson
        wants him to fly to Manila at once to join him and take part in the Manila Conference. He goes.'
      n: '[[w.valenti-very-human-president]], 254 (Valenti''s account). Check: the day. Names: Valenti, Johnson.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-11-22.succession-28
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One, the center cabin, before the oath. Johnson enters; Albert Thomas, Thornberry, Brooks and Valenti
        rise. Thomas: "Mr. President, we are ready to carry out any orders you have." Johnson smiles briefly and waves them
        to their seats. By Valenti''s account, the first time he heard Johnson so addressed.'
      n: '[[w.valenti-very-human-president]], 45 (Valenti''s account). See [[cal.1963-11-22.succession-18]]. Names: Thomas,
        Thornberry, Brooks, Johnson, Valenti.'
      tags:
      - name:thomas-albert
      - name:thornberry-william-h
      - name:brooks-jack-b
      - name:johnson-lyndon-b
      - name:valenti-jack
