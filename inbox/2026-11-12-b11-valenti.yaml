      - name:connally-john
- add:
    entry:
      id: cal.1964-09-03.elections-1964-johnson-2
      when: Sept. 3
      date: '1964-09-03'
      thread: elections-1964-johnson
      c: 'Valenti to Johnson, a memorandum: put Mike Feldman full time at the Democratic National Committee to take charge
        of the day-to-day refutation of the Goldwater-Miller charges, an instant rebuttal and "truth squads" in the regions
        and States. Johnson at the foot: "This ok by me."'
      n: '[[w.valenti-very-human-president]], 210–11 (Valenti''s account; the memorandum printed). Names: Valenti, Johnson,
        Feldman, Goldwater.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:feldman-myer
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-09-30.elections-1964-johnson
      when: Sept. 30–Oct. 1
      date: '1964-09-30'
      thread: elections-1964-johnson
      c: 'A staff member to Valenti, Sept. 30, in a memorandum: Johnson has agreed to do something for some New York political
        leaders, a long time coming; would he work it in if he is in New York before November. Johnson, at the foot, Oct.
        1: "Jack, see if you can work this blackmail into my schedule."'
      n: '[[w.valenti-very-human-president]], 174 (Valenti''s account; the staff member unnamed). Names: Valenti, Johnson.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - state:ny
- add:
    entry:
      id: cal.1964-10-14.elections-1964-new-york
      when: Oct. 14
      date: '1964-10-14'
      thread: elections-1964-new-york
      c: 'Brooklyn, the last motorcade of a day in New York State with Robert Kennedy. Johnson and Kennedy stand on the back
        seat of the open Secret Service car. Jimmy Mangano, Democratic district leader, on a hand microphone: "the closest
        confidant to the president, our own Jack Valenti"; "the next United States senator from New York, Bobby Kennedy."
        Johnson speaks. In a Jewish district farther on he tells Valenti: "Okay, Jack, you can get out now." By Valenti''s
        account.'
      n: '[[w.valenti-very-human-president]], 208–10 and the plate following p. 178 (Brooklyn, Oct. 14, 1964; Valenti''s account).
        Check: the day; the text has "the waning days of October," the plate caption Oct. 14. See [[cal.1964-10-14.elections-1964-2]].
        Names: Johnson, Robert Kennedy, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:valenti-jack
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1964-11-10.transition-and-staff-2
      when: Nov. 10
      date: '1964-11-10'
      thread: transition-and-staff
      c: 'Valenti to Johnson, "Possible Appointees": Carl Sanders ("Embodiment of the New South"); Lew Wasserman, for a department
        like HEW; L. F. McCollum of Continental Oil; Governor Harold Hughes, for Agriculture; John Swainson; John Connally,
        as Under Secretary of Defense, head of CIA or senior assistant, "the assistant President"; Thomas J. Watson, John
        Loeb and John Connor; Marty Underwood for congressional liaison; Lloyd Hand for Peace Corps director.'
      n: '[[w.valenti-very-human-president]], 211–13 (the memorandum printed, dated "November 10, 1964"; Valenti''s account;
        he adds that Hand became chief of protocol and Connor Secretary of Commerce, and that Wasserman, Watson and Loeb declined).
        Check: the day; the text says he sent it "November 19, 1964." Names: Valenti, Johnson, Sanders, Hughes, Swainson,
        Connally, Connor, Hand.'
      tags:
      - name:valenti-jack
      - name:johnson-lyndon-b
      - name:sanders-carl-e
      - name:hughes-harold-e
      - name:swainson-john-b
