      date: '1965-05-11'
      place: algiers
      thread: china-leadership
      also: *id001
      c: 'The Chinese Embassy in Algeria to the Foreign Ministry: Algeria, in Ben Bella''s words at the "crossroads of contemporary international political trends," will waver the more as the conference nears; his anti-imperialism "tough talk, weak action," and has he the courage for "revolutionary means" against the economic troubles? Still his "active side is leading"; "the Algerian ruling group is very arrogant and conceited, but its tiger''s ass can still be petted."'
      n: '[[w.friedman-shadow-cold-war]], 138. Made public: 2015. To check: PRC embassy Algeria to MFA, May 11, 1965, CFMA doc. 109-03645-02, 5–6 (cited by [[w.friedman-shadow-cold-war]], 138 n.177); PRC embassy Algeria to MFA, May 11, 1965, CFMA doc. 109-03645-02, 9 (cited by [[w.friedman-shadow-cold-war]], 138 n.178); PRC embassy Algeria to MFA, May 11, 1965, CFMA doc. 109-03645-02, 10 (cited by [[w.friedman-shadow-cold-war]], 138 n.179). Names: Ben Bella.'
