      - soviet-union
      c: 'The Foreign Ministry''s Soviet and East European Department, again on the Soviet attitude to the coup: Moscow at first toys with backing a guerrilla struggle against the new government. Soviet aid to Algeria: more than $225 million in credits, schools for technical cadres among them, some 150 tanks, twenty aircraft, sixty guns, six naval ships, military experts sent and Algerian officers trained.'
      n: '[[w.friedman-shadow-cold-war]], 139. Made public: 2015. To check: Report from Soviet-East European MFA Department on Soviet attitude and actions toward Algerian coup, July 8, 1965, CFMA doc. 109-03645-02, 32 (cited by [[w.friedman-shadow-cold-war]], 139 n.183a); Report from Soviet-East European MFA Department on Soviet attitude and actions toward Algerian coup, July 8, 1965, CFMA doc. 109-03645-02, 30 (cited by [[w.friedman-shadow-cold-war]], 139 n.185).'
