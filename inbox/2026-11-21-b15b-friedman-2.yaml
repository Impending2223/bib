- add:
    entry:
      id: cal.1964-06.soviet-union-3
      when: June
      date: 1964-06
      thread: soviet-union
      also: *id002
      c: 'Mikoyan and Aidit, on Mikoyan''s visit. Mikoyan threatens to turn the Indonesian bourgeoisie against the PKI: the 7,000 Indonesian officers trained in the USSR and the 1,500 Soviet military experts in Indonesia oppose the PKI, and if Moscow acts "the Indonesian bourgeoisie will have a change in attitude toward the PKI, and it will not be good for the PKI."'
