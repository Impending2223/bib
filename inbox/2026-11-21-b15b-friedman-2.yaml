- add:
    entry:
      id: cal.1964-05.soviet-union-3
      when: May, before the 9th
      date: 1964-05
      at: before 1964-05-09
      thread: soviet-union
      also: *id001
      c: Ben Bella in the Soviet Union, after the FLN congress, to a hero's welcome. A new loan of about $126.5 million, for projects from mines to technical schools. Ben Bella calls the Soviet Union Algeria's "loyal friend" and backs the test ban treaty, but repeats the Chinese line that while oppressed and oppressing nations exist there can be no real peace; he will not enter the Sino-Soviet quarrel or legalize the Communist Party.
      n: '[[w.friedman-shadow-cold-war]], 137–38. To check: MFA intelligence report to CC on Ben Bella''s visit to USSR, May 9, 1964, CFMA doc. 109-03526-08, 5–7 (cited by [[w.friedman-shadow-cold-war]], 138 n.175); PRC embassy Algeria to MFA, report on Ben Bella''s visit to USSR, May 19, 1964, CFMA doc. 109-03526-08, 14–17 (cited by [[w.friedman-shadow-cold-war]], 138 n.176). Names: Ben Bella. Check: the days; the text has him come "on the heels of" the April congress; the Chinese Foreign Ministry''s intelligence report on the visit is of May 9 (138 n.175).'
      src:
        c: 8f5362fc
        rows:
        - 'w.friedman-shadow-cold-war 137–38: all'
        - 'via x.1964-05-09.mfa-intelligence-cc-ben-bella-s-visit-ussr: ?'
        - 'via x.1964-05-19.prc-embassy-algeria-mfa-ben-bella-s-visit: ?'
      tags:
      - polity:ussr
      - polity:algeria
      - name:ben-bella-ahmed
      place: moscow
