- add:
    entry:
      id: cal.1963.soviet-union-2
      when: '1963'
      date: '1963'
      thread: soviet-union
      also: *id001
      c: 'Boumediene, Algeria''s Defense Minister, in the Soviet Union. The Soviets set three conditions on military aid: open opposition to China, acceptance of peaceful coexistence, the Algerian Communist Party legalized.'
      n: '[[w.friedman-shadow-cold-war]], 137. Made public: 2015. To check: PRC embassy USSR to MFA, January 2, 1964, CFMA doc. 109-03526-08, 2 (cited by [[w.friedman-shadow-cold-war]], 137 n.173). Names: Boumediene. Check: the month; the account is Boumediene''s to the North Korean ambassador, by the Chinese Embassy''s report of Jan. 2, 1964 (137 n.173).'
      src:
        c: 908c3f1c
        rows:
        - 'w.friedman-shadow-cold-war 137: all'
        - 'via x.1964-01-02.prc-embassy-ussr-mfa-january-2-1964: ?'
      tags:
