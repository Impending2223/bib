      also: *id001
      c: 'The Chinese Embassy in Algeria to the Foreign Ministry, on Ben Bella''s visit to the Soviet Union: he made the fewest concessions he could, for all his "illusions" about the USSR and the Aswan Dam''s hold on his economic imagination. Invite him to Peking as soon as possible.'
      n: '[[w.friedman-shadow-cold-war]], 138. Made public: 2015. To check: PRC embassy Algeria to MFA, report on Ben Bella''s visit to USSR, May 19, 1964, CFMA doc. 109-03526-08, 14–17 (cited by [[w.friedman-shadow-cold-war]], 138 n.176). Names: Ben Bella.'
      src:
        c: b905aaeb
        rows:
        - 'w.friedman-shadow-cold-war 138: all'
        - 'via x.1964-05-19.prc-embassy-algeria-mfa-ben-bella-s-visit: ?'
      tags:
      - polity:prc
