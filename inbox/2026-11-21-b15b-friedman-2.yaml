      date: '1963'
      at: before 1963-10
      thread: africa
      also: *id001
      c: Algeria, in one of its first acts under the constitution, creates a "Committee for Aid to the Peoples of Africa." Guerrillas from South Africa, Angola, Portuguese Guinea, the Congo and elsewhere are soon training in camps in Algeria.
      n: '[[w.friedman-shadow-cold-war]], 135. To check: [[w.shubin-anc]], 30 (cited by [[w.friedman-shadow-cold-war]], 135 n.158a); Shao He, "Algeria in the Midst of Construction," Shijie Zhishi 24 (1963), 15 (cited by [[w.friedman-shadow-cold-war]], 135 n.158b).'
