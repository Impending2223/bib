      c: 'The FLN, its left wing under Ben Bella and Boumediene in control, publishes the Tripoli Program: a new Algeria on "socialist perspectives," the French-owned enterprises nationalized, agricultural cooperatives formed.'
      n: '[[w.friedman-shadow-cold-war]], 135. To check: I. Genin, "Ekonomicheskie Meropriiatie Alzhirskogo Pravitel''stva," Mirovaia Ekonomika i Mezhdunarodnye Otnosheniia 11 (1963), 116 (cited by [[w.friedman-shadow-cold-war]], 135 n.155a); Jeffrey James Byrne, “Our Own Special Brand of Socialism,” 9, 432 (cited by [[w.friedman-shadow-cold-war]], 135 n.155b). Names: Ben Bella, Boumediene.'
      src:
