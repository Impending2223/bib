      c: 'An FLN party delegation in the Soviet Union, more warmly received: a $100 million credit. It still will not give way to Moscow''s demands.'
      n: '[[w.friedman-shadow-cold-war]], 137. To check: PRC embassy USSR to MFA, January 2, 1964, CFMA doc. 109-03526-08, 1–3 (cited by [[w.friedman-shadow-cold-war]], 137 n.174).'
