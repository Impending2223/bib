- edit:
    id: cal.1961-02.indonesia
    base: 9dd1cc28
    set:
      gloss:
        title: Estimates
        text:
        - 'Friedman: the Indonesian military armed by Moscow, warships and aircraft among the weapons, "to the tune of over 1 billion dollars in 1961–62," and trained by it ([[w.friedman-shadow-cold-war]], 141, citing [[w.mozingo-chinese-policy-towards-indonesia]], 186; the note reads "Ibid., 186," after Zhou Taomo''s working paper).'
