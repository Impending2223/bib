      gloss:
        title: Estimates
        text:
        - 'Friedman: fifteen ambassadors sent out before the end of 1969, fourteen more in 1970 ([[w.friedman-shadow-cold-war]], 177, citing [[w.jisen-cultural-revolution-in-the]], 320).'
- add:
    entry:
      id: cal.1962.africa-4
      when: 1962, shortly before independence
      date: '1962'
      at: before 1962-07
      thread: africa
      also: &id001
      - africa-algeria-morocco
      c: 'The FLN, its left wing under Ben Bella and Boumediene in control, publishes the Tripoli Program: a new Algeria on "socialist perspectives," the French-owned enterprises nationalized, agricultural cooperatives formed.'
      n: '[[w.friedman-shadow-cold-war]], 135. To check: I. Genin, "Ekonomicheskie Meropriiatie Alzhirskogo Pravitel''stva," Mirovaia Ekonomika i Mezhdunarodnye Otnosheniia 11 (1963), 116 (cited by [[w.friedman-shadow-cold-war]], 135 n.155a); Jeffrey James Byrne, "Our Own Special Brand of Socialism," Diplomatic History 33.3 (2009), 432 (cited by [[w.friedman-shadow-cold-war]], 135 n.155b). Names: Ben Bella, Boumediene.'
      src:
        c: a2500602
        rows:
        - 'w.friedman-shadow-cold-war 135: all'
        - 'via x.1963.i-genin-ekonomicheskie-meropriiatie-alzhirskogo-pravitel-stva-mirovaia: ?'
        - 'via x.undated.jeffrey-james-byrne-our-own-special-brand: ?'
      tags:
      - polity:algeria
      - name:ben-bella-ahmed
      - name:boumediene-houari
