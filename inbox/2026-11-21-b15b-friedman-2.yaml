        title: Estimates
        text:
        - 'Friedman: between 1965 and 1968 more than 320,000 Chinese troops served in the DRV, chiefly in air defense, engineering, construction, minesweeping and logistics ([[w.friedman-shadow-cold-war]], 167, citing [[w.zhai-china-and-the-vietnam]], 135).'
        - 'Friedman: Soviet aid to the DRV reportedly exceeded the Chinese by 1968, half of all socialist aid ([[w.friedman-shadow-cold-war]], 167, citing [[w.gaiduk-soviet-union-and-the]], 58–59, [[w.zhang-communist-powers-divided]], 91–92, and [[w.zhai-china-and-the-vietnam]], 136); Mehta, by the note, has Chinese economic aid in 1967–68 still above the Soviet ([[w.mehta-soviet-biscuit-factories-and]]).'
