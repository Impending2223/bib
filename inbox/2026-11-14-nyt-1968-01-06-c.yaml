        date: '1968-01-05'
        thread: africa
        c: 'Lusaka, three hours en route from the Congo to Ethiopia. Humphrey, after an hour and a half with Kaunda, pledges continued American help to Zambia and assails the "retrogressive policies" of Rhodesia, Mozambique and South Africa, which have "turned their faces away from the inevitable triumph of self-determination"; the United States to help pave 300 miles of the Great North Road, Tunduma to Iringa, with the World Bank, the Export-Import Bank and Zambia, perhaps 0 million of an estimated 0 million.'
        n: '"Humphrey Scores 3 White Regimes," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 11. See [[cal.1967-12-30.africa]]. Names: Humphrey, Kaunda.'
        tags: [name:humphrey-hubert-h, name:kaunda-kenneth-d, polity:zambia]
  - add:
      entry:
        id: cal.1968-01-05.africa-2
        when: Jan. 5
        date: '1968-01-05'
        thread: africa
        c: 'Addis Ababa. Humphrey, arriving from Zambia: Haile Selassie "is revered and respected" in the world "as one of the great statesmen of his time and our century"; Ethiopia''s soldiers in Korea remembered. He meets the Emperor Saturday, Jan. 6.'
        n: '"Humphrey in Addis Ababa" (AP), in "Humphrey Scores 3 White Regimes," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 11. See [[cal.1968-01-05.africa]]. Names: Humphrey, Haile Selassie.'
        tags: [name:humphrey-hubert-h, name:haile-selassie-i, polity:ethiopia]
