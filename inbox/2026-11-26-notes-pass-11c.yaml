# cal.1962-04-08.cuba: FRUS X, doc. 321
- add-words:
    id: cal.1962-04-08.cuba
    after: 'Bay of Pigs prisoners sentenced: thirty years, or $62 million.'
    words: The Cuban military tribunal's verdict covers 1,179 prisoners, for treason, at hard labor.
    text: '[FRUS vol. 10, doc. 321](https://history.state.gov/historicaldocuments/frus1961-63v10/d321)'
- check:
    id: cal.1962-04-08.cuba
    text: 'Check: Thomas, 176, has 1,189 men; FRUS, X, doc. 321, has 1,179.'
# cal.1962-05-06.laos: FRUS XXIV, doc. 343
- add-words:
    id: cal.1962-05-06.laos
    after: end
    words: An artillery barrage and an infantry attack take the town; two Americans of a twelve-man special forces training team there are lifted out by helicopter.
    text: '[FRUS 1961–63, XXIV, doc. 343](https://history.state.gov/historicaldocuments/frus1961-63v24/d343)'
# cal.1962-10-16.cuba: Church committee report, 146, 147 n.2
- add-words:
    id: cal.1962-10-16.cuba
    after: the group to meet every morning at 9:30.
    words: Mongoose has run a year, he says, with no acts of sabotage, and the one attempted failed twice. Lansdale, Harvey and the other CIA members of the working group are to attend the daily meetings.
    item: '[[w.sen-church-alleged-assassination-plots]], 146, 147 n.2'
- names:
    id: cal.1962-10-16.cuba
    add:
    - Lansdale
    - Harvey
    tags:
