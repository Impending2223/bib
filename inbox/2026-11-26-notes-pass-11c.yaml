# cal.1961-07-13.berlin-and-vienna: FRUS XIV, docs. 66, 67
- add-words:
    id: cal.1961-07-13.berlin-and-vienna
    after: Acheson for decisive action, the Vice President agreeing.
    words: Rusk proposes instead a congressional resolution authorizing call-ups, and quotes the Acheson paper on keeping early steps in a low key.
    text: '[FRUS 1961–63, XIV, doc. 66](https://history.state.gov/historicaldocuments/frus1961-63v14/d66)'
- add-words:
    id: cal.1961-07-13.berlin-and-vienna
    after: and quotes the Acheson paper on keeping early steps in a low key.
    words: 'Dulles: the country may be in for a long siege.'
    text: '[FRUS 1961–63, XIV, doc. 67](https://history.state.gov/historicaldocuments/frus1961-63v14/d67)'
- names:
    id: cal.1961-07-13.berlin-and-vienna
    add:
    - Dulles
    tags:
    - name:dulles-allen-w
# cal.1961-08-17.latin-america: FRUS X, doc. 257
- add-words:
    id: cal.1961-08-17.latin-america
    after: Goodwin and Guevara talk that night.
    words: 'Guevara, at a Montevideo party about 2 a.m.: no return of the expropriated property, but payment in trade; no political alliance with the East; free elections after the revolution is institutionalized; an interim modus vivendi. He thanks the United States for the invasion.'
    text: '[FRUS 1961–63, X, doc. 257](https://history.state.gov/historicaldocuments/frus1961-63v10/d257)'
# cal.1961-08-19.berlin-and-vienna: FRUS XIV, docs. 120, 121
- add-words:
    id: cal.1961-08-19.berlin-and-vienna
    after: Johnson and Clay in Berlin.
    words: Johnson carries Kennedy's letter of Aug. 18 to Mayor Brandt, and has talked with Chancellor Adenauer at Bonn.
    text: '[FRUS 1961–63, XIV, doc. 120](https://history.state.gov/historicaldocuments/frus1961-63v14/d120); [doc. 121](https://history.state.gov/historicaldocuments/frus1961-63v14/d121)'
- names:
    id: cal.1961-08-19.berlin-and-vienna
    add:
    - Brandt
    - Adenauer
    - Kennedy
    tags:
    - name:brandt-willy
    - name:adenauer-konrad
    - name:kennedy-john-f
# cal.1961-08-29.laos: FRUS XXIV, doc. 172
- add-words:
    id: cal.1961-08-29.laos
    after: end
    words: 'Kennedy: no commitment to SEATO Plan 5 "without regard to whatever else may happen in the world." Lemnitzer: the plan starts with about 13,000 Americans, 4,000 ground combat troops in Laos and nearly 9,000 supporting forces in Thailand.'
    text: '[FRUS 1961–63, XXIV, doc. 172](https://history.state.gov/historicaldocuments/frus1961-63v24/d172)'
# cal.1961-10-18.vietnam: FRUS I, doc. 174
- add-words:
    id: cal.1961-10-18.vietnam
    after: Taylor and Rostow in Saigon.
    words: With Cottrell and Nolting they call on Diệm. He asks for tactical aviation, helicopter companies, coastal patrol forces and logistic support; Nolting reports him seeming to want a bilateral defense treaty and plans for the use of American forces, perhaps combat forces.
    text: '[FRUS 1961–63, I, doc. 174](https://history.state.gov/historicaldocuments/frus1961-63v01/d174)'
- names:
    id: cal.1961-10-18.vietnam
    add:
    - Cottrell
    tags:
    - name:cottrell-sterling-j
# cal.1961-11-03.vietnam: FRUS I, docs. 210, 191
- add-words:
    id: cal.1961-11-03.vietnam
    after: Taylor's report.
    words: Rostow and representatives of State, ICA, Defense, the JCS and the CIA were on the mission. Taylor submits it, apparently at his 4:05 to 5:15 p.m. meeting with the President.
    text: '[FRUS 1961–63, I, doc. 210](https://history.state.gov/historicaldocuments/frus1961-63v01/d210)'
- add-words:
    id: cal.1961-11-03.vietnam
    after: end
    words: Taylor's cable of Oct. 25 had put the force at 6,000 to 8,000 troops, to be phased into other activities if the United States wished to stay longer.
    text: '[FRUS 1961–63, I, doc. 191](https://history.state.gov/historicaldocuments/frus1961-63v01/d191)'
- names:
    id: cal.1961-11-03.vietnam
    add:
    - Rostow
    - Kennedy
    tags:
    - name:rostow-walt-w
    - name:kennedy-john-f
# cal.1961-12-05.africa: FRUS XXI, doc. 240
- add-words:
    id: cal.1961-12-05.africa
    after: how to justify help to Nkrumah, given his course at home and abroad?
    words: Dillon would withhold approval, Nkrumah looking more a Castro than a Nasser; McNamara is for going ahead, the commitment made. Robert Kennedy, who had not spoken, argues that Houphouet-Boigny and other moderate leaders would rather the United States not go ahead, that the money be spread among Africa's needy countries, and that if it goes ahead it get something in return. Chayes puts the liability at about $25 million until 1965.
    text: '[FRUS 1961–63, XXI, doc. 240](https://history.state.gov/historicaldocuments/frus1961-63v21/d240)'
- names:
    id: cal.1961-12-05.africa
    add:
    - Dillon
    - McNamara
    - Robert Kennedy
    - Houphouet-Boigny
    - Chayes
    tags:
    - name:dillon-c-douglas
    - name:mcnamara-robert-s
    - name:kennedy-robert-f
    - name:houphouet-boigny-felix
    - name:chayes-abram
# cal.1962-04-04.vietnam: FRUS II, doc. 141
- add-words:
    id: cal.1962-04-04.vietnam
    after: Kennedy sends it to McNamara;
    words: Forrestal sends it to McNamara for the Defense Department's comments on Apr. 7;
    text: '[FRUS 1961–63, II, doc. 141](https://history.state.gov/historicaldocuments/frus1961-63v02/d141)'
- check:
