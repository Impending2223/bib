      c: The Peking Garrison 北京衛戍區 holds a meeting of cadres of battalion level and above at the Jingxi Hotel 京西賓館, Zhou Enlai 周恩來 presiding. Yang Chengwu 楊成武 reads the Military Commission's
        order enlarging the garrison and says its tasks are those given by Zhou, the Capital Work Group and Ye Jianying. Zhang Min 張民, present, recalls He Long 賀龍 sitting silent in the
        wings, worn and anxious.
