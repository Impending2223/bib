      c: During the Central Work Conference 中央工作會議 Ye Jianying 葉劍英 and Xiao Hua 蕭華, the General Political Department's director, call Xi Henghan 冼恒漢 of Lanzhou, Wang Enmao 王恩茂 and Zuo
