    entry:
      id: cal.1966.china-leadership-34
      when: 1966, fall
      date: '1966'
      at: before 1966-09-23
      thread: china-leadership
      c: 'The heads of the General Departments and the services in Peking are told to assemble at the Jingxi Hotel 京西賓館, ride in two big cars with the curtains drawn, led by Xiao Hua
        蕭華 and Yang Chengwu 楊成武, to Ye Jianying''s 葉劍英 house to see the papers on He Long 賀龍: Zhou had telephoned to stress the matter of surrender to the enemy. Ye: Mao is uneasy about
        He Long, many have exposed him. A dozen papers lie on the table, statements of He''s subordinates, among them a letter of He''s to an old friend in the Nationalist government.
        Ye says to tell no one outside; Li Zuopeng 李作鵬 gives the same time, place and men.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 165–166. Made public: 2011. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 884–885 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 165 n.18a); *Li Zuopeng huiyilu* 《李作鵬回憶錄》 (Beixin chubanshe 北新出版社, Hong Kong), 566 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.18b); *Li Zuopeng huiyilu* 《李作鵬回憶錄》,
        568–569 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 166 n.19). Names: Ye Jianying, He Long, Li Zuopeng, Zhou Enlai. Check: the day; Yang has it after the meeting of [[cal.1966-09-06.china-leadership-2]].'
