    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 124 (Mao, with Kang Sheng, Zhao Yimin 趙毅敏, Wei Wenbo 魏文伯, Jiang Qing 江青 and Zhang Chunqiao: the Outline mixes class lines and does not
      tell right from wrong, and is wrong; the Propaganda Department, the "Palace of the King of Hell" 閻王殿, is to be overthrown and the little devils freed 打倒閻王，解放小鬼; where the Center
      does wrong he calls the localities to rise against it, more Sun Wukongs 孫悟空 to make havoc in heaven; the Tenth Plenum of 1962 resolved on class struggle; if the Department, the
      Peking committee and the Group go on shielding bad people they are to be dissolved; the place not given)'
    units: B, C, E, F, G
