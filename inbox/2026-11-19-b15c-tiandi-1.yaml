    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 143 (Mar. 4: the Center convenes a meeting in the Jingxi Hotel 京西賓館 to criticize Luo Ruiqing 羅瑞卿; 95 in all attend from the General Departments,
      the services and the military regions 軍隊各總部、各兵種、各大軍區; Mao names Deng Xiaoping, Peng Zhen and Ye Jianying to preside, Deng shows himself at the opening and leaves for the third-front
      inspection, and Ye in fact presides; the meeting runs 35 days, with 86 written speeches; Luo comes in at noon 3月4日午)'
