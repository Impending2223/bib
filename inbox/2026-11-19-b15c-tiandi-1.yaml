      thread: china-leadership
      c: 'Peng Zhen 彭真 asks Lu Dingyi 陸定一 to his house and gives him the Ministry of Public Security''s file of Yan Weibing''s 嚴慰冰 anonymous letters. Peng: a letter against Lin Biao
        林彪, the Party''s vice-chairman, is a political matter; many are signed "Wang Guang-X" and give the nursery run by Wang Guangmei''s 王光美 mother as the sender''s address, so they
        are taken as setting the Standing Committee members against one another; many are on postcards, a public leaflet. Lu answers that he knew nothing of his wife''s letters.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 147. The words: 2月初 ... 上午10時左右 (I, 147). Made public: 1999. To check: Chen Qingquan 陳清泉 and Song Guangwei 宋廣渭, *Lu Dingyi zhuan* 《陸定一傳》
        (Zhonggong dangshi chubanshe 中共黨史出版社, 1999), 485–486 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 147 n.42). Names: Peng Zhen, Lu Dingyi, Lin Biao. Check: the day.'
