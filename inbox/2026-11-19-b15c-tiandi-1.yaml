- cite:
    id: cal.1966-12-06.china-leadership-4
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 335–336 (Lin Biao in the Dec. 6 summing-up: the forum went badly, wrongly, with the wrong thought, and a turn of 180 degrees is needed;
      the first two of the three points in the outline are to be wholly broken; the cadres are the key question: "this movement is in a sense a movement to criticize cadres; cadres in
      power so many years, who only speak of glory and great achievements and will not let others speak of faults, must degenerate; this time we will rouse the masses to criticize them
      hard; let the bourgeois power-holders and the proletarian power-holders both not sleep")'
    units: A, B, C
- to-check:
    id: cal.1966-12-06.china-leadership-4
    add: '*Gu Mu huiyilu* 《谷牧回憶錄》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2009), 220 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 336 n.11)'
- cite:
    id: cal.1966-12-09.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 336 (Dec. 9 the Politburo''s Standing Committee huddle, Mao attending and Zhou presiding, passes the 〈中共中央關於抓革命、促生產的十條規定〉 redrafted by
      Chen Boda and others, "the industrial ten": keep eight hours of production, make revolution in spare time, yet the factories may hold the "four bigs" and criticize the bourgeois
      reactionary line; the workers have the right to set up revolutionary organizations and may link up in their own city in spare time, and students and workers may link up with one
      another; issued Dec. 10 as Zhongfa [66] no. 603 中發[66]603號)'
    units: B, E
