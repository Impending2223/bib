    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 159–162 (the Politburo''s enlarged meeting adopts the Center''s Notice 〈通知〉 unanimously, Liu presiding; Qi Benyu sees the hands go up,
      Liu asks first the Politburo members and then those seated at the back to show their attitude, the latter not counted; the drafting group set up Apr. 16 by Jiang Qing''s list,
      Chen Boda head, Kang Sheng, Jiang Qing, Zhang Chunqiao, Wu Lengxi 吳冷西, Wang Li 王力, Yin Da 尹達, Chen Yading 陳亞丁, Guan Feng, Qi Benyu, Mu Xin 穆欣, in fact under Jiang Qing, Zhang secretary-general,
      at the rear building of the Jinjiang Hotel 錦江飯店; in March Mao at Hangzhou, hearing Kang Sheng and Zhao Yimin 趙毅敏 with Wei Wenbo 魏文伯 and Jiang Qing on the international movement,
      overturned the Center''s opinion on the CPSU''s 23rd Congress and abused the Outline; Wang Li''s one-sentence draft withdrawing the Outline refused by Mao; Mao''s mid-April remarks
      at Hangzhou, taken down by Wang Renzhong 王任重, are the Notice''s base; Mao adds long passages, and in the printed text his own are in bold; Chen Boda and Kang Sheng hold that not
      a word may be changed)'
