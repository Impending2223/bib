    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 299–300 (Oct. 9–28 the Center holds the work conference in Peking; the heads of the provincial, municipal and regional committees, the
      State Council''s ministries and commissions, and the Military Commission''s departments, the armies and the services attend, and some local rebel leaders are asked to speak; its
      business is to criticize the bourgeois reactionary line and clear the way of the cultural revolution; Wang Li: this criticism is to settle the leaders who led the Center''s work
      in August and September, chiefly the premier and Tao Zhu, and the leaders of the provincial and municipal committees)'
