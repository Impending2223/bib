      when: Apr., after the 16th
      date: 1966-04
      at: after 1966-04-16
      place: hangzhou
      thread: china-leadership
      c: 'Hangzhou 杭州. Mao, as Yang Chengwu 楊成武 afterward told Qiu Huizuo 邱會作: the Center is divided into a first line and a second, not two Centers. While he was away from Peking the
        Standing Committee decided that the Center''s work was mainly the first line''s, that he would put his views to Peking and issue no instructions from outside, and that Peking
        should give him word of big matters. A resolution and instructions on the cultural revolution, a big matter, went out without a word to him. Yang to Qiu: the counterattack is
        to begin.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 127. Made public: 2011. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 432 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 127 n.49). Names: Mao Zedong, Qiu Huizuo. Check: the day within Apr. 16–24; the page gives the meeting only.'
      src:
        c: 68abffaa
        rows:
