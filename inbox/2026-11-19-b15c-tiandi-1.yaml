- cite:
    id: cal.1966-03-17.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 124 (Mar. 17–20, the enlarged Standing Committee meeting at Hangzhou 杭州: Mao on the academic and educational circles, the bourgeoisie and
      petty bourgeoisie holding much of them; Wu Han and Jian Bozan 翦伯贊, Party members and anti-Communist, in fact Kuomintang; the schools, papers, journals and publishers to be looked
      at for whose hands hold them; the bourgeois academic authorities to be criticized, young authorities trained, young people not to be feared for breaking "the law," their manuscripts
      not held back; the Propaganda Department not to become a Rural Work Department 農村工作部; the days of the sayings within Mar. 17–20 not given; no attendance given)'
- cite:
    id: cal.1966-03-28.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 124 (Mar. 28 and 29, Mao''s two talks with Kang Sheng 康生: the Peking municipal committee and the Propaganda Department shield bad people
      and are to be dissolved; Peng Zhen is to be told to stop shielding bad people and to apologize to Shanghai; no place given)'
    units: C
- to-check:
    id: cal.1966-03-28.china-leadership-2
    add: '*Yijiuliuwu nian jiuyue dao yijiuliuliu nian wuyue wenhua zhanxian shang liang tiao daolu douzheng dashiji* 《一九六五年九月到一九六六年五月文化战线上两条道路斗争大事记》 (annex to the Circular of May 16,
      1966 「五一六通知」) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 124 n.42)'
