    note: 'I, 120: Diaoyutai'
- cite:
    id: cal.1966-02-05.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 120–122 (Liu Shaoqi 劉少奇 presides at the Standing Committee members in Peking, who discuss the draft; before the meeting Peng sends it to
      them with the line that for haste it could not be circulated in the Group; Xu Liqun reports orally and Peng does not read the Outline out; after Peng''s revision the members in
      Peking agree, and it is wired to Mao at Wuhan on Feb. 7; not that the meeting told the Group to take it to Mao)'
- to-check:
    id: cal.1966-02-05.china-leadership
    add: '[[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 12 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 122 n.35)'
- cite:
    id: cal.1966-02-07.china-leadership-3
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 122 (the Outline, after Peng Zhen''s revision and the Peking Standing Committee members'' agreement, is sent by wire to Mao at Wuhan on
      Feb. 7, unsigned; the Group''s name was added by Yao Zhen 姚臻; the draft number and the "urgent" not given)'
- to-check:
    id: cal.1966-02-07.china-leadership-3
    add: '[[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 12 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 122 n.35)'
- cite:
    id: cal.1966-02-08.china-leadership-3
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 122 (that morning 早晨 Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng and Tian Jiaying 田家英 fly by special plane from Peking''s
      western-suburb airport 北京西郊機場 to Wuhan; Wang Renzhong 王任重 meets them at the airport and has them go at once to Mao''s residence at East Lake 東湖; Hankou, the noon landing and Wuchang
      not given)'
- to-check:
    id: cal.1966-02-08.china-leadership-3
    add: Gong Yuzhi 龔育之, 〈「二月提綱」和東湖之行〉, in Zhang Hua et al., eds., *Huishou wenge* 《回首文革》 (Zhonggong dangshi chubanshe 中共黨史出版社, 2007), 286–287 (cited by [[w.yang-jisheng-tiandi-fanfu]],
      I, 122 n.36)
- cite:
    id: cal.1966-02-08.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 122–123 (the report at Mao''s East Lake 東湖 residence: Mao asks Peng whether Wu Han is anti-Party and anti-socialist; Peng: yes, he stands
      with those dismissed; Mao: Wu Han is to be dismissed no more and goes on as before as mayor 市長; to Peng''s wish for a political conclusion, Mao: the struggle against bourgeois
      ideology is a long class struggle, not to be settled by a hasty conclusion; Peng raises Guan Feng 關鋒 and Qi Benyu 戚本禹 as leftists who also wrote allusive essays and whether to
      rectify them; Mao: three years on 三年以後再說; Yang gives these as Xu Liqun''s account to Gong Yuzhi 龔育之, broadly agreeing with the Dashiji; Mao neither opposed nor approved the Outline
      (the Dashiji), and did not even circle it (Wang Li))'
