      c: 'One night during the plenum Zhou Enlai 周恩來 calls many of the army''s delegates and reads them Mao''s poster, and reads it a second time because they may not have heard. He
        says: Liu Shaoqi 劉少奇 will not do, he has failed the Chairman; Lin Biao 林彪 has supported the Chairman for ten years, and the Chairman has called on the whole country to learn
