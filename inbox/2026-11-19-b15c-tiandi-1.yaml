    entry:
      id: cal.1966-07-16.china-leadership-2
      when: July 16
      date: '1966-07-16'
      place: peking
      thread: china-leadership
      c: Jiang Qing 江青, back in Peking two days before Mao, sets up the Cultural Revolution Group's 中央文革小組 office in Building 16 of the Diaoyutai 釣魚臺, with Wang Li 王力 director and Qi
        Benyu 戚本禹, Cao Yiou 曹軼歐 and Mu Xin 穆欣 deputies and three or five aides; she also sets up an information system, the *Kuaibao* 《快報》, and a hundred cadres of regiment level and
        above as liaison men and inspectors, who go out to the provinces and departments in the guise of reporters for the *Hongqi*, the *Jiefangjun bao*, the *Renmin ribao* and the
        *Guangming ribao*; and a daily meeting of the Group at 3 p.m., Zhou Enlai 周恩來 and Tao Zhu 陶鑄 attending.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 175–176. Made public: 2001. To check: [[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 33 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 175 n.43a); Yan Changgui 閻長貴, recollection that Jiang Qing returned to Peking July 20 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 175 n.43b); Yu Ruxin 余汝信, view that Mu
        Xin was the office''s first director, Qi Benyu and Cao Siou 曹思歐 deputies (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 175 n.43c). Names: Jiang Qing, Mao Zedong, Zhou Enlai,
        Tao Zhu. Check: the day; Yan Changgui (n.43) has Jiang Qing back in Peking only July 20.'
