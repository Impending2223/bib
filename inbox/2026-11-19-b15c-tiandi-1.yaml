    witness: w.yang-jisheng-tiandi-fanfu
    reads: before dawn a group of the Workers' General Headquarters 工總司 rushes the North Station and crowds onto train 626 for Peking, which leaves at 5 a.m.; Wang Hongwen 王洪文 and Pan
      Guoping 潘國平 with more than a thousand take train 756 to Zhengzhou, made temporarily train 602, leaving at 7 a.m.; Zhou will not have so many go north and has the Railways Ministry's
