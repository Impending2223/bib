      when: Oct., after the 8th
      date: 1966-10
      at: after 1966-10-08
      thread: china-leadership
      c: During the Central Work Conference 中央工作會議 Ye Jianying 葉劍英 and Xiao Hua 蕭華, the General Political Department's director, call Xi Henghan 冼恒漢 of Lanzhou, Wang Enmao 王恩茂 and Zuo
        Qi 左齊 of Xinjiang to Ye's residence in the Western Hills of Peking 北京西山 and tell them He Long 賀龍 is a great bandit and warlord to whom the Nationalists sent men to turn him;
        they are to pass it on to Zhang Dazhi 張達志 and Guo Peng 郭鵬 and to turn their thinking round.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 166. Made public: 2011. To check: Xi Henghan 冼恒漢, *Fengyu bashi zai* 《風雨八十載》 (electronic ed.) (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 166 n.20). Names: Ye Jianying, He Long. Check: the day.'
