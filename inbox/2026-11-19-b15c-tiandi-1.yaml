- cite:
    id: cal.1966-12-26.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 338 (at his 73rd birthday dinner Mao: "some use the pretext of grasping production to press down the revolution; what they care for is
      their own official hats and the keeping of the old frames of capitalist revisionism; they fear that the masses'' revolution will reach themselves"; "whatever blocks this great
      revolution from reaching the workers and peasants, every argument against workers and peasants making the cultural revolution, is to be refuted and is wrong; it cannot be stopped,
      and the substance of my argument with Tao Zhu lies here"; the Mao chronology omits this passage)'
