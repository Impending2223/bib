- cite:
    id: cal.1966-11-10.china-leadership-3
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 341 (the Shanghai committee reports to the Center; Zhou presides over the Center''s huddle on how to deal with it, which decides to wire
      the East China Bureau and the Shanghai workers'' rebels, both drafted by Chen Boda: the Bureau to hold firm, not to recognize the General Headquarters as a lawful organization
      nor the stopping of the trains as a revolutionary act, the Cultural Revolution Group deciding to send Zhang Chunqiao back to Shanghai to persuade the workers; to the workers: "big
      principles govern small ones, and doing production well is the big principle; your act harms production and greatly the whole country''s traffic, a very great matter; we hope you
      will at once correct it and go back to Shanghai and settle problems on the spot; the Group sends Comrade Zhang Chunqiao to meet you at once"; the telegram about a thousand characters,
      in full in Xu Jingxian)'
