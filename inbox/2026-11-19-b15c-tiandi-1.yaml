    entry:
      id: cal.1966-05-23.china-leadership-5
      when: May 23
      date: '1966-05-23'
      place: peking
      thread: china-leadership
      c: 'Peking. The Hebei Hall 河北廳 of the Great Hall of the People. Liu Shaoqi 劉少奇 presides; Zhu De 朱德 makes his self-criticism: twice before, after the Gao Gang affair and after Peng
        Dehuai''s, then of Jinggangshan in the 1920s and the Fourth Red Army''s seventh congress. Zhang Dingcheng 張鼎丞, Lin Biao 林彪, Chen Yi 陳毅 and Zhou Enlai 周恩來 speak in turn. Lin:
        at the Shanghai meeting after Luo Ruiqing''s case Zhu said that "peak" could not be said of Mao Zedong Thought. Chen Yi, at length: are you out to stage a coup, to have the yellow
        robe put on you? Zhu: he has neither the strength nor the nerve; he is eighty and must be helped up a slope. Bo Yibo 薄一波: he is always speaking of orchids, the ones out of favor
        grow them. Zhou: Zhu''s part against Zhang Guotao came from others'' push; he is unreliable, a time bomb in the Standing Committee, to be asked to write out what he says.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 172–173. Made public: 2016. To check: Bu Weihua 卜偉華, *Zalan jiu shijie: wenhua dageming de dongluan yu haojie* 《砸爛舊世界——文化大革命的動亂與浩劫》 (Chinese
        University Press, Hong Kong, 2008), 87–88 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 172 n.36); Qi Benyu 戚本禹, 〈回憶江青同志〉 (his account that Liu told the questioners that the
        "Khrushchev" of the Notice was Zhu De) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 172 n.37). Names: Liu Shaoqi, Zhu De, Lin Biao, Chen Yi, Zhou Enlai, Bo Yibo, Luo Ruiqing,
        Mao Zedong. Check: whether the session is that of the enlarged Politburo meeting of May 4–26 (Yang''s page gives the hall and the day only).'
      src:
        c: da976feb
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 172–173: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 172 n.36: all'
