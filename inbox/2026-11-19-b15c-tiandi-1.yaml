    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 300–302 (Oct. 23 in the plenary meeting of the conference Liu Shaoqi and Deng Xiaoping make their self-criticisms; Liu: "I wrongly judged
      the situation and took the normal phenomena of the mass movement for a ''counter-current against the Party and the proletarian dictatorship,'' and so stood on the reactionary bourgeois
