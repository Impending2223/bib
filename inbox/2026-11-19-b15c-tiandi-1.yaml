      id: cal.1966-12-03.china-leadership-6
      when: Dec. 3–4
      date: '1966-12-03'
      place: peking
      time_range:
      - 1966-12-03T14:00Z
      - 1966-12-03T16:00Z
      time_band: night
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: Night of Dec. 3–4. Red Guards of four arts-college bodies, led by Ye Xiangzhen 葉向真, daughter of Ye Jianying 葉劍英, carry off several leaders of deputy-minister rank or above from
        their homes, among them Peng Zhen 彭真, Liu Ren 劉仁, Wan Li 萬里, Xia Yan 夏衍 and Tian Han 田漢; Peng is bound out of his bed at his residence at 7 Taijichang 臺基廠 and hidden in the hall
        of the Central Philharmonic 中央樂團. They have learned the homes and routes beforehand, with cars and the red telephones of senior cadres, and wear army greatcoats.
