      thread: china-leadership
      c: 'Ye Jianying 葉劍英 calls in Qiu Huizuo 邱會作 and asks whether at the Shanghai meeting he spoke with anyone about Xiao Hua 蕭華. Qiu says no; he heard only from Tao Zhu 陶鑄 that Xiao
