      c: Night of Dec. 3–4. Red Guards of four arts-college bodies, led by Ye Xiangzhen 葉向真, daughter of Ye Jianying, carry off more than one deputy minister or above from their homes,
        among them Peng Zhen 彭真, Liu Ren 劉仁, Wan Li 萬里, Xia Yan 夏衍 and Tian Han 田漢; Peng is bound out of his bed at his residence at 7 Taijichang 臺基廠 and hidden in the hall of the Central
        Philharmonic 中央樂團. They have learned the homes and routes beforehand, with cars and the red telephones of senior cadres, and wear army greatcoats.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 154. The words: 12月3日晚至4日晨 (I, 154). Made public: 2016. To check: Wang Wenyao 王文耀 and Wang Baochun 王保春, *Wenge qianhou shiqi de Chen Boda:
        mishu de zhengyan* 《文革前后時期的陳伯達——秘書的證言》 (Tiandi tushu 天地圖書, Hong Kong, 2014), 49–50 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 154 n.56); Ye Xiangzhen 葉向真, 〈我和父親的「文革」歲月〉, in
        Zhou Haibin 周海濱, *Jiaguo guangying* 《家國光影》 (Renmin chubanshe 人民出版社) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 154 n.57a). Names: Peng Zhen, Ye Jianying. Check: Yang gives
