- add:
    entry:
      id: cal.1966-11-21.china-leadership-3
      when: Nov. 21
      date: '1966-11-21'
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Night, 10 p.m. Li Fuchun 李富春 telephones Yu Qiuli 余秋里: what you raised Zhou Enlai 周恩來 and I have reported to the Chairman, who instructs: (1) the cultural revolution in the
        factories still goes in periods and batches; (2) the eight-hour working day is not to be touched, the workers make revolution in spare time; (3) Gu Mu 谷牧 is to take a staff to
        Shanghai, Tientsin and Shenyang to hear the workers of all factions, keep revising the document, and issue it in December; (4) the phrases "forgetting one''s origin, selfish,
        suppressing the masses" and the like are struck, and the "power-holders" are not to be drawn too widely.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 334–335. The words: 晚10點 (I, 334). Made public: 2009. To check: *Gu Mu huiyilu* 《谷牧回憶錄》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2009), 218
        (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 335 n.9). See [[cal.1966-11-21.china-leadership-2]]. Names: Li Fuchun, Zhou Enlai, Mao Zedong.'
      src:
        c: ecb0cb09
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 334–335: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 335 n.9: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:li-fuchun
      - name:zhou-enlai
      - name:mao-zedong
      - ok:fields-place
      time: 1966-11-21T14:00Z
- cite:
    id: cal.1966-11-21.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 334 (Nov. 21 Chen Boda sends for Gu Mu and Yu Qiuli and says: "we who write have no power or rank, small people, whom no one respects;
      Deng Xiaoping looked down on us, and now you too; you have mangled my draft"; the two cannot argue with him and report to Zhou, who says he and Tao Zhu will hear them again the
      next day)'
- to-check:
    id: cal.1966-11-21.china-leadership-2
