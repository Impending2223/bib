- cite:
    id: cal.1966-07-31.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 237 (Mao dictates 口授 the letter July 31: "I express to you my warm support"; "I and my revolutionary comrades take the same attitude; in
      Peking and in the country, in the cultural revolution, all who take your revolutionary attitude we support warmly"; to guard the young from going too far he tells them to unite
      all who can be united and to leave a way out to those who have erred; the letter is published to the Party''s high levels as a document of the Eleventh Plenum; Mao thereby approves
