- cite:
    id: cal.1966-11-14.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 344 (Nov. 14 at 3 p.m. 下午3時 Mao calls an enlarged meeting of the Politburo Standing Committee, Liu Shaoqi, Deng Xiaoping, Zhu De and Chen
      Yun not attending, Jiang Qing and Wang Li sitting in; Mao: the Shanghai "Workers'' General Headquarters" accords with the Constitution''s "freedom of association"; of Zhang Chunqiao''s
      signing the five-point agreement without asking the Center: "he may cut first and report after; there are always facts first and concepts after"; the day given as Nov. 16 by the
      Zhou–Gu chronology)'
