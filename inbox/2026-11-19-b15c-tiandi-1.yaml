    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 220–221 (Aug. 1–12 in Peking; 141 members and alternates of the Central Committee and 47 non-voting attend; Deng Xiaoping announces four
      items: the resolution on the proletarian cultural revolution; the Center''s major measures since the Tenth Plenum in domestic and foreign matters, to be discussed and approved;
      the plenum communiqué; the formal approval of the May decisions on personnel; Liu reports the measures, and says that Peking''s cultural revolution made mistakes, especially over
      the work groups, "for which the responsibility is mainly mine"; "in the cultural revolution Peking reported to the Chairman once a week")'
    units: C, D, E, F, G
