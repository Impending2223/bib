    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 144–145 (the night before, Ye Jianying has Luo shown the circle''s materials and Liang Biye''s 梁必業 record of denunciation; Luo does not
      sleep, and the next morning 第二天早晨 he kills himself; Mar. 18 after breakfast 早飯后 someone telephones that the meeting is off, and in despair he jumps, not killed, the leg hurt; at
