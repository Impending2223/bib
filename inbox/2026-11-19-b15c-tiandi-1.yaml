    entry:
      id: cal.1966-05-17.china-leadership-7
      when: May 17
      date: '1966-05-17'
      thread: china-leadership
      c: 'At the enlarged Politburo meeting Liu Shaoqi 劉少奇 says he had always entered his class origin as rich peasant but, having gone to Huamingloujia 花明樓, it should be landlord. Zhou
        Enlai 周恩來 says his family was a feudal official''s, he was short on class struggle and noticed nothing of Peking''s problem. Deng Xiaoping 鄧小平 makes a self-criticism: he knew
        nothing of so great a problem in the Secretariat. Lin Biao 林彪 makes none, but says his family was landlord and he had not seen it so clearly.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 162. Made public: 2016. Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Lin Biao.'
