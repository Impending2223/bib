      when: July 27
      date: '1966-07-27'
      place: peking
      thread: china-leadership
      c: 'Kang Sheng 康生, at Beijing Normal University 北京師範大學: in February and early March Peng Zhen 彭真, the great black gang of Peking, planned a coup; one plan was to send a battalion
        to each of Peking University and Renmin University, the houses for them looked over in advance, Lu Ping''s black gang repairing buildings and canteens, and Renmin''s president
        Guo Yingqiu 郭影秋 knowing all.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 169. Made public: 2016. To check: Kang Sheng''s speech at Beijing Normal University on the "February mutiny" 康生在北師大關於「二月兵變」的講話, July 27,
        1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 169 n.27); Qian Gang 錢鋼, 〈「二月兵變」真相〉, *Jiefangjun bao* 《解放軍報》, Dec. 7, 1980 (the 1980 trial''s account: in February 1966 the
        Military Commission decided to form a regiment under the garrison, for militia training and public order, and, lacking barracks, looked at empty buildings in some universities)
        (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 169 n.28). Names: Kang Sheng, Peng Zhen.'
