    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 212–214 (July 13, 19 and 22 the Center holds three meetings on the work groups, Chen Boda for the Cultural Revolution Group asking their
      withdrawal, Liu rebutting angrily and quarreling with Kang Sheng, Deng rising and refusing; the Huairen Hall meeting, which Li Xuefeng puts on July 18 afternoon and Yang, by the
      Zhou and Mao chronologies, on July 19: Liu says that this way of theirs truly sets masses against masses, "we have materials," Kang Sheng: "we have materials too," Chen Boda and
      Deng quarrel, Jiang Qing slips in and sits on a sofa; Chen Boda''s proposal was after Shanghai telephoned Wang Li in late June against the old organs sending work groups; after
      the Standing Committee dispute, Mao, asked, decides to withdraw them)'
