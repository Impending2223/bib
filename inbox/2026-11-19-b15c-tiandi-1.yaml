- cite:
    id: cal.1966-08-12.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 225–226 (Aug. 12, the last day; in the afternoon Lin Biao presides over the session; the elections: Tao Zhu, Chen Boda, Kang Sheng, Xu
      Xiangqian 徐向前, Nie Rongzhen and Ye Jianying added to the Politburo; the eleven candidates for the Standing Committee all elected; full votes for Mao, Lin, Deng and Kang Sheng,
      one short for Zhou, Tao Zhu and Chen Boda, the others over half; Liu from second place to eighth, Lin from sixth to second; no new chairman or vice-chairmen elected, and after
      the plenum Liu, Zhou, Zhu and Chen Yun are no longer named vice-chairmen in documents, Lin alone being called vice-chairman of the Central Committee)'
    units: B, E, F
