      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Zhou Enlai 周恩來 goes to Tsinghua University 清華大學, to the Jiasuo 甲所, and talks with Kuai Dafu 蒯大富: he comes at the Chairman''s and the Center''s commission; Kuai is to tell all
        of Tsinghua''s cultural revolution from June 1 to July 30, what he heard and saw and what he thinks. Kuai speaks over three hours until daylight; Zhou''s secretary Sun Yue 孫岳
        records and Zhou notes himself. He Pengfei 賀鵬飛 knocks twice and asks to listen; Zhou refuses and angrily forbids a third knock. Zhou breaks off: another meeting; a car will fetch
        Kuai at 7 p.m. to the Great Hall, and Kuai should bring three others of his own choosing.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 214–215. The words: 7月31日凌晨2點 (I, 214); 下午7點 (I, 215). Made public: 2014. To check: Kuai Dafu 蒯大富, *Qinghua wenge wushi tian* 《清華文革五十天》
        (Zhongguo wenhua chuanbo chubanshe 中國文化傳播出版社, Hong Kong, 2014), 87–91 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 215 n.80). See [[cal.1966-07-30.china-leadership]]. Names:
