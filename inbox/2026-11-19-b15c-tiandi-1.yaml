    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 302 (Oct. 24 10月24日 the groups criticize Liu Shaoqi, the speakers vying with one another, as if whoever did not criticize Liu were disloyal
      to Mao and no revolutionary)'
- cite:
    id: cal.1966-10-25.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 302–303 (Oct. 25 Mao to the conference: "if one wants the country safe: Stalin died, Malenkov could not hold, trouble came, revisionism
      came, they had set up a first front and a second front; now I think it not so good; I was on the second front, others on the first, and so it was scattered; coming into the city
      it was no longer concentrated; with a first and a second front came quite a few independent kingdoms"; "I too am responsible: first, I proposed the Secretariat, and the first and
      second fronts in the Standing Committee; then, I trusted others too much"; "the fire of the cultural revolution was lit by me, in great haste, only a few months; it does not run
      smoothly, there are conflicts, which is natural"; to the cadres: "if the line is wrong, correct it; who wants to overthrow you? I do not, and I think the Red Guards need not either";
      after the conference Chen Boda''s report goes down, and Mao''s Aug. 5 poster is published to the whole Party and country)'
    units: C, D, G
