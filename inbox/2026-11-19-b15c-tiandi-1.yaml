      c: 'Evening. In the Great Hall of the People, Zhou Enlai 周恩來 hears Kuai Dafu 蒯大富 and three others he has chosen, Liu Quan 劉泉, Liu Caitang 劉才堂 and Shen Taiping 沈台平, from seven to
        ten, Tan Qilong 譚啟龍 and Jiang Weiqing 江渭清 of the Shandong and Jiangsu committees also listening. Zhou thanks them: he will report at once to the Chairman and the Center. He has
        a supper of chicken-shred noodle soup served and sends them back to the university by car.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 215. The words: 晚7點...10點 (I, 215). Made public: 2016. To check: Kuai Dafu 蒯大富, *Qinghua wenge wushi tian* 《清華文革五十天》 (Zhongguo wenhua chuanbo
