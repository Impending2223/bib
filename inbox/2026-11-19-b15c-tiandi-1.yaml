    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 132, 149, 152 (the same speech, May 21: Yang Shangkun cannot compare with the three others, he cannot make a weather of his own and only
      held on to legs 抱了腿, namely Liu''s and Deng''s; Lu Dingyi was found in the husband-and-wife shop 夫妻老婆店, their common ground against putting politics first and against Mao Zedong
      Thought; his wife wrote anonymous letters six years, more of them when politics was put first; the "Four Families" 四大家族 have taken many positions, uncovering them is a victory
      of the "bamboo-shoot-stripping policy" 剝筍政策, to be celebrated; after the Gao Gang and Peng-Huang-Zhang-Zhou affairs this is the third; Lin Biao interjects: either they strip us
      or we strip them)'
