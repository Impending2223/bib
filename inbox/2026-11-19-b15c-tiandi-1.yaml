    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 300 (Oct. 16 Chen Boda gives for the Center the main report, 〈無產階級文化大革命中的兩條路線〉, later retitled "summing up two months of the movement";
      Mao had told Chen his thoughts before; the report praises the movement of the preceding stretch and the masses'' rebellion, finds the situation excellent, analyzes the new forms
