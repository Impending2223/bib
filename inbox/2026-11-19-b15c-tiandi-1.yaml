    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 124–125 (with Kang Sheng''s approval 經康生批準 the *Guangming ribao* 光明日報 and the *Renmin ribao* print together Qi Benyu''s 戚本禹 article 〈《海瑞罵皇帝》和《海瑞罷官》的反動實質〉;
      the day not given; the articles were held back over two months by Peng Zhen and Xu Liqun)'
- cite:
    id: cal.1966-04-09.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 125 (Deng Xiaoping, recalled urgently from outside Peking 緊急從外地召回, presides, Zhou attending; Kang Sheng relays Mao''s instructions; Peng
      states that he never has opposed and never will oppose Chairman Mao; Kang Sheng and Chen Boda 陳伯達 criticize Peng''s errors; Zhou and Deng say his line is opposed to Mao Zedong
      Thought; the decisions: a notice thoroughly criticizing the Group''s outline and revoking it, and a document-drafting group, to be reported to Mao and the Standing Committee, later
      the Cultural Revolution Group; the group''s members not given)'
    units: A, B, C
