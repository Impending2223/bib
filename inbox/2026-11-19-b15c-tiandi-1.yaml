      id: cal.1966-05-29.china-leadership-3
      when: May 29
      date: '1966-05-29'
      thread: china-leadership
      c: 'Mao approves, "carry out as proposed" 照辦, the four papers the Capital Work Group 首都工作組 has drawn up for him: the enlarging of the Peking Garrison 北京衛戍區 to four divisions, the
        redeployment of the guard troops, and the Military Commission''s orders on both. They are printed in two copies, one for Zhou Enlai 周恩來 and one sent through him to Mao, none
        for Lin Biao 林彪; Zhou has the staff say nothing of the troop movements by telephone.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 170–171. Made public: 2009. To check: Zhang Min 張民, *Zhou Enlai yu Shoudu gongzuozu* 《周恩來與首都工作組》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2009),
        74–75 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 171 n.32); Zhang Min 張民, *Zhou Enlai yu Shoudu gongzuozu* 《周恩來與首都工作組》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2009), 80 (cited
        by [[w.yang-jisheng-tiandi-fanfu]], I, 171 n.33). See [[cal.1966-05-15.china-leadership-2]]. Names: Zhou Enlai, Lin Biao, Mao Zedong. Check: whether this is the "do as proposed"
        of [[cal.1966-05-18.china-leadership-3]].'
