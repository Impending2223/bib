- add:
    entry:
      id: cal.1966-09-06.china-leadership-2
      when: Sept. 6
      date: '1966-09-06'
      place: peking
      thread: china-leadership
      c: 'Peking. The Sichuan Hall 四川廳 of the Great Hall of the People. Lin Biao 林彪 speaks to the enlarged Standing Committee of the Military Commission on He Long 賀龍, at Mao''s direction,
        He Long himself absent: his errors in purging the Hunan–Hubei base area; since the cultural revolution began, restlessness, many visitors, a "political club," and a pistol worn
        when he went to see Mao. Lin withdraws unwell; Ye Jianying takes the chair, and the members criticize He, Chen Yi and Nie Rongzhen sharply, Liu Bocheng 劉伯承, who rarely speaks,
        too. Ye ends by forbidding any word outside. Zhou had held a like small meeting and told Mao it went well.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 164–165. Made public: 2016. To check: Cheng Guang 程光, *Xinling de duihua* 《心靈的對話》 (Beixing chubanshe 北星出版社, Hong Kong, 2011), 70–71 (cited
        by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.17a); *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 524 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 165 n.17b); *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 884 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 165 n.17c). Names: Lin Biao, He Long,
        Ye Jianying, Chen Yi, Nie Rongzhen, Zhou Enlai, Mao Zedong. Check: the day, Sept. 6, is Qiu Huizuo''s (524) and the hall as he gives it; the speech''s text may be Cheng Guang''s
        addition (I, 165 n.17c).'
      src:
        c: '85315532'
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 164–165: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 165 n.17b: all'
