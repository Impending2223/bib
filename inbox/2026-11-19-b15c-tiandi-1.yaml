- cite:
    id: cal.1966-02-03.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 120 (Peng Zhen 彭真 convenes the enlarged meeting of the Group of Five 文化革命五人小組; those present besides the Group: Xu Liqun 許立群, Hu Sheng
      胡繩, Yao Zhen 姚溱, Wang Li 王力, Fan Ruoyu 范若愚, Liu Ren 劉仁 and Zheng Tianxiang 鄭天翔; the leftists, Guan Feng 關鋒 and others, criticized; Peng stresses that Hai Rui Dismissed is not to
      be talked of in its political bearings, Wu Han 吳晗 having no tie to Peng Dehuai 彭德懷)'
    units: D
