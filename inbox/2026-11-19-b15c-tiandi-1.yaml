- cite:
    id: cal.1966-07-29.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 216–217 (the evening of July 29 7月29日晚, Great Hall of the People: the meeting of activists of the colleges and universities; Li Xuefeng
      for the Peking committee declares the withdrawal of the work groups; Deng Xiaoping, Zhou Enlai and Liu Shaoqi speak; Liu: how to make a proletarian cultural revolution, "you do
      not know, and I honestly do not either; I think the others in the Center do not"; sending work groups was decided by the Center and the Center agreed, the form no longer suits
      and the Center decides to pull them out, and if the students will not let them go, they may criticize; of the Tsinghua teacher''s slogan, "support the Center, oppose Mao," "beat
      him," a protective detention; no one announces Liu''s end, Mao comes out from behind and, to everyone''s surprise, stands on the rostrum waving, the hall in an uproar; Zhou leads
      the singing of 《大海航行靠舵手》)'
    units: A, B
