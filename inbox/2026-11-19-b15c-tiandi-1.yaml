    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 125–127 (Apr. 16–24, Mao presides at Hangzhou over the enlarged Standing Committee meeting, mainly to criticize Peng Zhen and to discuss
      revoking the Outline; it takes up Peng''s errors, the revoking of the Outline, the dissolving of the Group and the setting up of a new cultural-revolution group; Mao: "I do not
      believe it is only Wu Han''s problem ... there are people in the court 朝裏有人, in every great region and every province and city"; the Feb. 3 paper "in a hurry"; on rectifying the
