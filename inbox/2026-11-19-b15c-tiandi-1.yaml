- add:
    entry:
      id: cal.1966-12-06.china-leadership-5
      when: Dec. 6
      date: '1966-12-06'
      thread: china-leadership
      c: 'At the enlarged Politburo meeting Zhou Enlai 周恩來 says that Gu Mu''s 谷牧 outline is wrong, but that bringing it out was good: it set all the thoughts out and showed the cadres''
        state of mind, that they still did not understand the cultural revolution. After the ten articles, he talked with them and they agreed, but the thought had not gone through.
        Lin Biao 林彪 asked him whether any one was through; he said none he had met, most were not, and not as isolated cases: they have a root in thought, the main thing being fear,
        "fear" first of all; he goes on to three kinds of fear.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 335. Made public: 2006. To check: Zhou Enlai, speech at the Politburo meeting, Dec. 6, 1966, in Song Yongyi 宋永毅 et al., eds., *Zhongguo
        wenhua dageming wenku* 《中國文化大革命文庫》 (2006) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 335 n.10). See [[cal.1966-12-04.china-leadership]]. Names: Zhou Enlai, Lin Biao.'
      src:
        c: 2a04b7dc
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 335: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 335 n.10: all'
