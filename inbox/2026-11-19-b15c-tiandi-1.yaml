    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 298 (Oct. 6 the Third Headquarters of the Peking Red Guards hold a rally of 100,000 in the Workers'' Gymnasium, its banner "Rally of the
      revolutionary teachers and students of the whole country in Peking to fire fiercely at the bourgeois reactionary line"; Zhou Enlai, Jiang Qing, Chen Boda, Kang Sheng, Tao Zhu,
      Zhang Chunqiao and the Group''s other members attend, Chen presiding and letting Jiang speak first; Zhang reads the Military Commission''s urgent directive on the cultural revolution
      in military academies, which declares null the labels of "counter-revolutionary" and "rightist" put on people early in the movement, returns the self-criticisms to their writers,
      and lets the material be destroyed with the masses'' agreement; Zhou says it applies equally to the colleges and middle schools, and asks the local committees that those who come
      to Peking to complain not be persecuted or held on return; Kuai Dafu 蒯大富 reads the oath; the rally adopts the telegram 〈向資產階級反動路線猛烈開火〉)'
