      c: At the meeting the Center calls of the first secretaries of the great regions, provinces and municipalities, the secretaries bring up many urgent problems. On the way out Ye
        Jianying 葉劍英 half-recites a ci he has made to the tune Yu meiren 虞美人, against the linking-up and bombardment and the many officials dismissed, and stops on seeing the others
        notice. Chen Yi 陳毅 writes for it, in his own hand, "a superb ci" 絕妙好詞.
