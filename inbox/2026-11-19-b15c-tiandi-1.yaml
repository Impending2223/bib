- cite:
    id: cal.1966-12-04.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 335–336 (Dec. 4–6 at the Huairen Hall 懷仁堂 Lin Biao presides over the enlarged Politburo meeting, which hears Gu Mu on the state of the
      revision of the "Fifteen Articles"; Liu Shaoqi and Deng Xiaoping, already sidelined, are called in; Gu''s three points: industry and communications hold high the red banner of
      Mao Zedong Thought and there is no "black line"; the staff is basically good, with no question of leadership not in proletarian hands; the continuity and cooperation of production
      forbid its stopping, and the enterprises'' Party work cannot stop; Wang Li: "on your three points industry does not make a cultural revolution? the talk of the power-holders";
      Kang Sheng, Jiang Qing and Xie Fuzhi also criticize; Lin''s summing-up of Dec. 6 wholly denies the Fifteen Articles)'
    units: B, C
