    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 122–123 (the report at Mao''s East Lake 東湖 residence: Mao asks Peng whether Wu Han is anti-Party and anti-socialist; Peng: yes, he stands
      with those dismissed; Mao: Wu Han is to be dismissed no more and goes on as before as mayor 市長; to Peng''s wish for a political conclusion, Mao: the struggle against bourgeois
      ideology is a long class struggle, not to be settled by a hasty conclusion; Peng raises Guan Feng 關鋒 and Qi Benyu 戚本禹 as leftists who also wrote allusive essays and whether to
      rectify them; Mao: three years on 三年以後再說; Yang gives these as Xu Liqun''s account to Gong Yuzhi 龔育之, broadly agreeing with the Dashiji; Mao neither opposed nor approved the Outline
      (the Dashiji), and did not even circle it (Wang Li))'
