- cite:
    id: cal.1966-06-03.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 197 (June 3, at Liu Shaoqi''s home 劉少奇家里, the enlarged Politburo Standing Committee meeting under Liu draws up eight rules: posters on
      campus; meetings not to hinder work and teaching; no marches into the streets; inside and outside kept apart, no foreigners to visit, foreign students not in the movement; no uproar
      at the homes of those struggled against; secrecy; no beating or slander; active leadership, keeping to posts; Li Xuefeng, first secretary of the new Peking committee, then: with
      these eight things are easy, now they must be told below; Deng: a mass meeting of 100,000, one pole through to the bottom, the new committee takes office; Li: first separately,
      tonight organs, the second meeting the schools)'
    units: C, D, E, F, G, H, I
