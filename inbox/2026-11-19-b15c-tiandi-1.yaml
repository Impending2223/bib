    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 120–122 (Liu Shaoqi 劉少奇 presides at the Standing Committee members in Peking, who discuss the draft; before the meeting Peng sends it to
      them with the line that for haste it could not be circulated in the Group; Xu Liqun reports orally and Peng does not read the Outline out; after Peng''s revision the members in
      Peking agree, and it is wired to Mao at Wuhan on Feb. 7; not that the meeting told the Group to take it to Mao)'
