- cite:
    id: cal.1966-02-04.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 120 (on Feb. 4 Xu Liqun 許立群 and Yao Zhen 姚溱, on Peng Zhen''s view, draft the Outline 〈文化革命五人小組關於當前學術討論的匯報提綱〉 at the Diaoyutai 釣魚臺; the
      two men''s posts not given; the Outline limits the criticism to the academic and places it under the Party''s leadership)'
- to-check:
    id: cal.1966-02-04.china-leadership-2
    add: Xi Xuan 席宣 and Jin Chunming 金春明, *"Wenhua dageming" jianshi* 《「文化大革命」簡史》, newest enlarged ed. (Zhonggong dangshi chubanshe 中共黨史出版社, 2011), 71 (cited by [[w.yang-jisheng-tiandi-fanfu]],
      I, 120 n.34)
