    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 181, 185–186 (June 1, Mao at Hangzhou to Kang Sheng and Chen Boda: Xinhua to broadcast the poster, 〈宋碩、陸平、彭珮云在文化革命中究竟干些甚么？〉, whole, and
