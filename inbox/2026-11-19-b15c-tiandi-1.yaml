- add:
    entry:
      id: cal.1966-11-16.china-leadership-5
      when: Nov. 16
      date: '1966-11-16'
      thread: china-leadership
      c: The Center entrusts Gu Mu 谷牧, head of the State Capital Construction Commission, and Yu Qiuli 余秋里, minister of the petroleum industry, to hold a forum on industry and communications;
        five ministries, seven cities and the heads of the Center's great regions send people. It discusses how industry and communications are to make the cultural revolution. The "Twelve
        Articles" drafted by Chen Boda 陳伯達 and Wang Li 王力 are handed to it, and meet with fierce criticism from the leading cadres; they praise the seventeen years' record, say production
        cannot stop and the work should go in periods and batches, and do not favor joint rebel organizations among the workers.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 334. Made public: 2011. To check: Xi Xuan 席宣 and Jin Chunming 金春明, *"Wenhua dageming" jianshi* 《「文化大革命」簡史》, newest enlarged ed. (Zhonggong
        dangshi chubanshe 中共黨史出版社, 2011), 113 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 334 n.6); *Gu Mu huiyilu* 《谷牧回憶錄》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2009), 215 (cited
        by [[w.yang-jisheng-tiandi-fanfu]], I, 334 n.7). Names: Chen Boda.'
      src:
