      when: June 3
      date: '1966-06-03'
      place: peking
      thread: china-leadership
      c: The Peking Garrison 北京衛戍區 holds a meeting of cadres of battalion level and above at the Jingxi Hotel 京西賓館, Zhou Enlai 周恩來 presiding. Yang Chengwu 楊成武 reads the Military Commission's
        order enlarging the garrison and says its tasks are those given by Zhou, the Capital Work Group and Ye Jianying 葉劍英. Zhang Min 張民, present, recalls He Long 賀龍 sitting silent
        in the wings, worn and anxious.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 171. Made public: 2009. To check: Zhang Min 張民, *Zhou Enlai yu Shoudu gongzuozu* 《周恩來與首都工作組》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2009),
