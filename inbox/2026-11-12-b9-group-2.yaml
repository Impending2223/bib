- add:
    entry:
      id: cal.1965-05-14.latin-america-dominican-republic-2
      when: May 14
      date: '1965-05-14'
      thread: latin-america-dominican-republic
      c: Johnson selects Vance and Bundy as his emissaries to Santo Domingo, to convey his policy. The move takes the Joint Chiefs, still advocating a military resolution, by complete surprise.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 308. See [[cal.1965-05-14.latin-america-dominican-republic]]; [[cal.1965-05-15.latin-america]]. Names: Johnson, Vance, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:vance-cyrus
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-05-17.latin-america-dominican-republic
      when: May 17
      date: '1965-05-17'
      thread: latin-america-dominican-republic
      c: 'Wheeler, to his colleagues of the Joint Chiefs, on the Vance and Bundy mission: he did not know "what goes" with the high-powered delegation. "I''m sort of a rump member of a rump organization—rather far back in this problem."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 308 (Wheeler "admitted to his colleagues"; Drea gives no day). To check: Commandant''s notes of the special meeting of the Joint Chiefs, No. 53, May 17, 1965, Greene Papers, MHC (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 308 n.64). Check: the day; Drea''s note 64 cites the Chiefs'' meeting of May 17, his text gives none. See [[cal.1965-05-14.latin-america-dominican-republic-2]]. Names: Wheeler.'
      tags:
      - name:wheeler-earle
- add:
    entry:
      id: cal.1967-06-02.middle-east-six-day-war
      when: June 2
      date: '1967-06-02'
      thread: middle-east-six-day-war
      also:
      - europe-and-the-alliance
      c: 'A high-level British delegation, the foreign and defense office heads with representatives of the prime minister, meets McNamara, Rusk and other senior officials. Both secretaries: any use of military force needs congressional support, and given the "passionate aversion on the Hill to any unilateral action by the US" there is none. McNamara: the Israelis could delay another two to four weeks and still defeat the Arabs in a week to 10 days; a decision within two weeks; "we would have a real problem if the Soviets came in to save Egypt." No further combined naval force planning.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 439. To check: Leddy, memorandum of conversation, June 2, 1967, FRUS 1964–68, XIX, 239–44 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 439 n.49). Check: Drea names neither the delegation''s members nor the place; Wilson was at the White House the same day. See [[cal.1967-06-02.middle-east]]. Names: McNamara, Rusk.'
      tags:
      - name:mcnamara-robert-s
      - name:rusk-dean
      - polity:uk
- add:
    entry:
      id: cal.1967-06-02.middle-east-six-day-war-2
      when: June 2
      date: '1967-06-02'
      thread: middle-east-six-day-war
      c: 'Evron to Walt Rostow: his government will "hold steady for about two weeks," not an "ironclad" figure.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 439. To check: Rostow to Johnson, June 2, 1967, FRUS 1964–68, XIX, 244–46 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 439 n.48). See [[cal.1967-06-02.middle-east]]. Names: Rostow.'
      tags:
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1968-01-24.japan-and-korea-pueblo-4
      when: Jan. 24
      date: '1968-01-24'
      thread: japan-and-korea-pueblo
      c: 'Meeting of senior State, OSD and JCS officials, without the President. McNamara: 100 to 300 aircraft to the region, easy, relatively riskless, "should be done." Clifford, defense secretary-designee: a cooling-off of several days, the incident too ambiguous for major military action. McNamara and Rusk: the USS Banner to the North Korean coast under heavy air cover. McNamara also: a Black Shield overflight of North Korea, and restraint on South Korean leaders.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 488 ("later that same evening"). To check: Smith, minutes of the meeting on the Korean crisis without the President, Jan. 24, 1968, FRUS 1964–68, XXIX, pt. 1, 483–91 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 488 n.13). Check: the hour; Drea has "later that same evening." See [[cal.1968-01-24.japan-and-korea-pueblo-2]]. Names: McNamara, Clifford, Rusk.'
      tags:
      - name:mcnamara-robert-s
      - name:clifford-clark
      - name:rusk-dean
- add:
    entry:
      id: cal.1968-01-24.japan-and-korea-pueblo-5
      when: Jan. 24
      date: '1968-01-24'
      thread: japan-and-korea-pueblo
      c: 'Meeting with the President. McNamara: some 250 Air Force and Marine fighters and bombers and the carrier Enterprise to Korea and Japan; a selective call-up of Air Force and Marine reserve air units to replace them. Johnson approves, urging 300 aircraft at once; accepts the Banner''s return to the Korean coast; authorizes a Black Shield overflight of North Korea for the next day; agrees to a personal message to Kosygin asking Soviet help in freeing the Pueblo and crew.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 488 ("a subsequent meeting on 24 January, this time including the president"). To check: Tom Johnson, notes of the President''s meeting, Jan. 24, 1968, FRUS 1964–68, XXIX, pt. 1, 493–95 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 488 n.14). Not the NSC of 1 p.m.: Drea''s note 11 cites that meeting at 480. Check: the hour. See [[cal.1968-01-24.japan-and-korea-pueblo-4]]; [[cal.1968-01-24.japan-and-korea-pueblo-2]]. Names: McNamara, Johnson, Kosygin.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1968-01-24.japan-and-korea-pueblo-6
      when: Jan. 24
      date: '1968-01-24'
      thread: japan-and-korea-pueblo
      c: McNamara urges a general military deployment into the Korean area as a show of force to signal U.S. intentions and indicate "things to come," coupled with a presidential call-up of military reserves and a request to Congress to authorize involuntary extension of the terms of active-duty servicemen.
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 487–88 ("on 24 January"). To check: summary minutes of the Pueblo Group, Jan. 24, 1968, FRUS 1964–68, XXIX, pt. 1, 469–70, 473; Tom Johnson, notes of the President''s Thursday night meeting, Jan. 25, 1968, 516, 518 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 488 n.12). Check: the meeting and the hour; Drea gives only the day. See [[cal.1968-01-24.japan-and-korea-pueblo-2]]. Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1968-01-25.japan-and-korea-pueblo-4
      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'McNamara, after the morning meeting, to his senior military and civilian staffs: the aim the return of the crew; "Excessive military pressure" might lessen its chances. No "overt action" yet to reinforce Korea and Japan; warning orders to designated Air Force and Navy units; the Kitty Hawk to move to Korea; nothing out of Southeast Asia or Europe without written approval from him or Nitze; the 8,500-man increase of the Eighth Army deferred.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 489 (n.15). To check: Nitze notes, Jan. 25, 1968, Nitze Papers, LC; JCSM-53-68 for SecDef, Jan. 25, 1968 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 489 n.15). See [[cal.1968-01-25.japan-and-korea-pueblo]]. Names: McNamara, Nitze.'
      tags:
      - name:mcnamara-robert-s
      - name:nitze-paul
- add:
    entry:
      id: cal.1968-01-25.japan-and-korea-pueblo-5
      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'White House working lunch. McNamara: authority for the President to summon as many as 150,000 reservists; no gaps in U.S. forces, against the charge of using the crisis "to plug up all the loopholes . . . in our current military posture." He cannot answer Johnson on the purpose of the deployments. Johnson approves 15 B-52s to Okinawa and 11 to Guam, disavowing any intent to use them against North Korea. Clifford: caution on mobilization.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 489. To check: Tom Johnson, notes of the President''s luncheon meeting, Jan. 25, 1968, FRUS 1964–68, XXIX, pt. 1, 507–11 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 489 n.16). See [[cal.1968-01-25.japan-and-korea-pueblo]]. Names: McNamara, Johnson, Clifford.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - name:clifford-clark
- add:
    entry:
      id: cal.1968-01-25.japan-and-korea-pueblo-6
      when: Jan. 25
      date: '1968-01-25'
      thread: japan-and-korea-pueblo
      c: 'The Thursday night meeting on the Pueblo. Wheeler: the aircraft deployments first for defense, second for reprisal attacks on North Korea if so decided. McNamara: needed to give air support to the Banner. Johnson spaces the movement of aircraft to South Korea over eight days and approves the mobilization of 28 Air Force and Navy reserve units, 14,787 men and 372 aircraft. Clifford: approaches through the UN and Kosygin with the start of a "quiet build up."'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 489. To check: Tom Johnson, notes of the President''s Thursday night meeting on the Pueblo incident, Jan. 25, 1968, FRUS 1964–68, XXIX, pt. 1, 514–19 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 489 n.17). See [[cal.1968-01-25.japan-and-korea]]. Names: Wheeler, McNamara, Johnson, Clifford, Kosygin.'
      tags:
      - name:wheeler-earle
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1968-01-26.japan-and-korea-pueblo-3
      when: Jan. 26
      date: '1968-01-26'
      thread: japan-and-korea-pueblo
      c: 'White House meeting. McNamara gives Johnson a schedule of aircraft movements from Sunday, Jan. 28, to the following Thursday: 347 aircraft, 26 B-52s among them, within striking distance of North Korea. He asks that the President request from Congress an extension of enlistments and the mobilization of individual reservists, and proposes $100 million more in military assistance for South Korea in 1968. Johnson makes no decision.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 490. To check: Tom Johnson, notes of the President''s Friday morning meeting on the Pueblo incident, Jan. 26, 1968, FRUS 1964–68, XXIX, pt. 1, 525–26 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 490 n.19). See [[cal.1968-01-25.japan-and-korea-pueblo-6]]. Names: McNamara, Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-22.soviet-union-czechoslovakia
      when: Aug. 22
      date: '1968-08-22'
      thread: soviet-union-czechoslovakia
      c: 'The Cabinet. Johnson: "we did not assume there would be no military intervention." Rusk: a U.S. decision not to act was made Monday, Aug. 19, because military intervention would have resulted in a world war.'
      n: '[[w.drea-mcnamara-clifford-and-the-2011]], 498 (n.48). To check: Tom Johnson, notes of the Cabinet meeting, Aug. 22, 1968, FRUS 1964–68, XVII, 248–49 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 498 n.48). See [[cal.1968-08-22.soviet-union]]. Names: Johnson, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
