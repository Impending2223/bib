        back Republicans not for Goldwater, Negro leaders hostile, liberal officeholders against him. Massachusetts: the Lodge,
        Scranton and Goldwater camps still apart; Miller "should be sent in QUICKLY." Faubus "will NOT endorse Johnson" and
        backs Goldwater; not to be made public, "this would hurt nationally."'
