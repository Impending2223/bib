        box 121, Goldwater Papers, Arizona State University (cited by [[w.young-two-suns-of-the]], 157 n.40); the same (cited
        by [[w.young-two-suns-of-the]], 179 n.19b, for Faubus). Names: Burch, Goldwater, Lodge, Scranton, Miller, Faubus,
        Johnson.'
