- add:
    entry:
      id: cal.1961-03-13.foreign-aid-2
      when: Mar., after the 13th
      date: 1961-03
      at: after 1961-03-13
      place: washington
      thread: foreign-aid
      c: At the next hearing the State Department's witnesses bring a letter of Rusk's forbidding them to testify. The Legal Adviser withdraws it, asking Hardy to "treat it as though
        it had not been sent," and sends the documents.
      n: '[[w.schlesinger-robert-kennedy-and-his]], 380 ("At the next hearing"; Hardy complains again to Kennedy; the documents transmitted; the hearing''s day not given). To check:
        Clark Mollenhoff, *Washington Cover-Up* (1962), 179–85 (cited by [[w.schlesinger-robert-kennedy-and-his]], 380 n.50). Split under R17: Rusk''s promise of Mar. 13 is [[cal.1961-03-13.foreign-aid]].
        See [[cal.1961-03-13.foreign-aid]]. Names: Rusk, Hardy. Check: the days of the hearing and of the withdrawal: after Mar. 13; Schlesinger gives neither.'
      tags:
      - name:rusk-dean
      - name:hardy-porter-jr
