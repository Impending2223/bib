      c: At the Secretariat, Deng Xiaoping presiding, Zhou Enlai and Chen Yun attending, Chen Guodong 陈国栋 reports on grain. Peng Zhen is there.
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1639 (May 15, 1961; afternoon; Deng presides at the Secretariat, Zhou and Chen Yun attending, hearing Chen Guodong on grain); [[w.peng-zhen-nianpu-1902]],
        IV, 130 (May 15, 1961, afternoon, the 255th meeting, hearing Chen Guodong on grain, Zhou and Chen Yun attending; Peng Zhen there); [[w.chen-yun-nianpu-xiuding]], III, 86 (May
        15, 3 p.m.: Chen Yun attends the Secretariat on grain); [[w.zhou-enlai-nianpu-1949]], II, 411 (May 14–17, 1961; 出席中共中央书记处会议，会议讨论粮食和调查研究等问题). The hour: 3 p.m. (Chen Yun nianpu);
        the afternoon (the others). Made public: 1997. Split under R17: Zhou''s own work of May 14–17 is [[cal.1961-05-14.china-leadership]]; the Secretariat''s session of May 17 is
        [[cal.1961-05-17.china-leadership-5]]. See [[cal.1961-05-14.china-leadership]]. Names: Deng Xiaoping, Zhou Enlai, Chen Yun, Chen Guodong, Peng Zhen.'
      tags:
