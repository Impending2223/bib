- edit:
    id: cal.1961-03-03.china-leadership
    base: eb56fa72
    set:
      c: Zhou Enlai with Deng Xiaoping, Peng Zhen, Li Xiannian, Chen Yi, Luo Ruiqing, Kang Sheng and Yang Shangkun on what they saw on tour, at the Premier's, 4 to 6:30 p.m.{1}
