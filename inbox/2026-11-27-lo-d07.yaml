      c: The State Department issues a background press release in the evening, to soften the effect of the Saudi announcement of non-renewal of the Dhahran agreement.
      n: 'FRUS 1961–63, XVII, doc. [24](https://history.state.gov/historicaldocuments/frus1961-63v17/d24) (Battle to Dungan, Mar. 21, 1961: the Department "immediately issued a background
        press release in the evening of March 16"; a copy enclosed). The order: after [[cal.1961-03-16.middle-east]], "immediately" (doc. 24). Split under R17: the Radio Mecca announcement
        is [[cal.1961-03-16.middle-east]]. See [[cal.1961-03-16.middle-east]]; [[cal.1961-03-18.middle-east]].'
- add:
    entry:
      id: cal.1961-03-18.middle-east
      when: Mar. 18
      date: '1961-03-18'
      place: washington
      thread: middle-east
      time_range:
      - 1961-03-18T17:00Z
      - 1961-03-18T23:00Z
      time_band: afternoon
      time_zone: America/New_York
      range_basis: record
      c: 'The Saudi Arabian Ambassador, at his request, calls on the Under Secretary of State in the afternoon with an urgent message from King Saud: the rapid action was needed to quiet
        his opponents at home and abroad; the strong relations are not affected. The Under Secretary: regrettable that the announcement came so abruptly, which precluded a joint statement;
        the United States hopes the close relations will continue.'
      n: 'FRUS 1961–63, XVII, doc. [24](https://history.state.gov/historicaldocuments/frus1961-63v17/d24) (Battle to Dungan, Mar. 21, 1961: "on the afternoon of March 18"). See [[cal.1961-03-16.middle-east]].
        Names: Saud ibn Abd al-Aziz Al Saud.'
      tags:
      - name:saud-ibn-abd-al-aziz-al-saud
