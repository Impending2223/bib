- edit:
    id: cal.1961-04-18.cuba-bay-of-pigs-2
    base: cb402920
    set:
      when: Apr. 19
      date: '1961-04-19'
      c: 'The White House, early Wednesday, after the night''s conference on Cuba.{1} Kennedy, with little to say to anybody, walks out of his office into the Rose Garden and stays alone
        almost an hour. O''Donnell to Salinger, watching: "He must be the loneliest man in the world tonight."{2}'
      follows:
      - cal.1961-04-19.cuba
      n: '[[w.odonnell-johnny-we-hardly-knew]], 307 (O''Donnell''s and Powers''s account: "the following Tuesday night, when the confirmed news of the complete failure of the invasion
        and the capture of the greatly outnumbered rebels reached the White House"; the walk, "almost an hour"); [[w.salinger-with-kennedy]], 148–49 (after the Cabinet Room conference,
        which "didn''t end until 4 a.m.," Kennedy breaks off and walks the south grounds alone while O''Donnell and Salinger watch from a window; not the words). The day: both put the
        walk on the night of the conference, which Salinger starts when Kennedy leaves the congressional reception "at midnight" (148) and [[cal.1961-04-19.cuba]] starts at 11:58 p.m.;
        so the walk fell on Apr. 19, the day of the brigade''s surrender ([[cal.1961-04-19.cuba-2]]). The order: after [[cal.1961-04-19.cuba]], the conference''s end (Salinger, 148).
        The hour: after the conference, which breaks up about 2:00 by Schlesinger''s journal ([[w.schlesinger-journals]], 113–14) and at 4 a.m. by Salinger. Made public: [[w.odonnell-johnny-we-hardly-knew]]
        (1972). Names: Kennedy, O''Donnell, Salinger.'
      time_range:
      - 1961-04-19T07:00Z
      - 1961-04-19T09:45Z
      time_zone: America/New_York
      range_basis: record
      src:
        c: 349f1eb8
        rows:
        - 'w.odonnell-johnny-we-hardly-knew 307: ?'
        - 'w.salinger-with-kennedy 148–49: ?'
    unset:
