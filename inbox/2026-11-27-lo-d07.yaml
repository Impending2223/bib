      c: At the Zhongshan Park hall 中山堂 Zhou Enlai pays respects to Chen Geng 陈赓 (died Mar. 16 at Shanghai) and takes part in the public memorial 公祭.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 399 (Mar. 25, 1961; 前往设在中山公园的灵堂吊唁…并参加公祭); [[w.yang-shangkun-riji]], I, 667 (Mar. 25, 1961; the public memorial 公祭 for Chen Geng at the Zhongshan
        Tang 中山堂, 下午3时, 3 p.m.; Yang Shangkun and Li Bozhao there, Yang with the coffin to Babaoshan 八宝山, home at 5); [[w.chen-yi-nianpu]], 862 (Mar. 25, 1961, afternoon; Chen Yi at
        the capital''s public memorial for Chen Geng, the Zhongshan Hall of Zhongshan Park); [[w.peng-zhen-nianpu-1902]], IV, 114 (Mar. 25, 1961, afternoon; Peng Zhen, with Zhou Enlai,
        Lin Biao, Deng Xiaoping and others, at the public memorial for Chen Geng in Zhongshan Park (the page''s note: Chen Geng, 1903–1961, member of the Central Committee and the Military
        Commission and Vice-Minister of National Defense; died at Shanghai Mar. 16)). The hour: 3 p.m., when Yang goes to the hall (I, 667); the other nianpus have the afternoon. The
        entry read "Chen Guang"; the diary and its editors'' note name him Chen Geng 陈赓 ([[w.yang-shangkun-riji]], I, 664 and n.1). Made public: 1997. The order: after [[cal.1961-03-25.china-leadership-2]],
        Zhou''s return that morning (Yang, I, 666). Split under R25b: the return is [[cal.1961-03-25.china-leadership-2]]. See [[cal.1961-03-25.china-leadership-2]]. Names: Zhou Enlai,
        Chen Geng.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-geng
- add:
    entry:
      id: cal.1961-04-25.china-leadership-11
      when: Apr. 25
      date: '1961-04-25'
      place: hangzhou
      thread: china-sixty-articles
      also:
