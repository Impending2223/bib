      c: The State Council names Chen Yi, Foreign Minister, the government's plenipotentiary to the enlarged Geneva conference on Laos.
      n: '[[w.chen-yi-nianpu]], 871 (May 8, 1961; 国务院委派外交部长陈毅为…出席…扩大的日内瓦会议的全权代表); [[w.zhou-enlai-nianpu-1949]], II, 410 (May 8, 1961; the same day). Split under R17: Zhou''s return and
        his talk with Chen Yi are [[cal.1961-05-08.china-leadership-2]] and [[cal.1961-05-08.china-leadership-15]]; Chen Yi leaves with the delegation May 9, [[cal.1961-05-09.china-leadership-2]].
        See [[cal.1961-05-08.china-leadership-2]]. Names: Chen Yi.'
