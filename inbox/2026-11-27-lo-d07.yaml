- add:
    entry:
      id: cal.1961-05-08.china-leadership-17
      when: May 8
      date: '1961-05-08'
      time: 1961-05-08T04:00Z
      time_approx: true
      time_zone: Asia/Shanghai
      place: peking
      thread: china-foreign
      also:
      - laos
      - soviet-union
      follows:
      - cal.1961-05-08.china-leadership-3
      c: Zhou Enlai, back from Handan, joins the Secretariat at noon and explains China's reply to the Soviet government's memorandum of May 5 on the widened Geneva conference to settle
        Laos peacefully; Chen Yi and others are to fly next day by Moscow to Geneva. The meeting agrees his plan for the delegation's work.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 410 (May 8, 1961; 出席中共中央书记处会议，就中国政府对苏联政府五月五日来的《关于和平解决老挝问题的扩大的日内瓦会议的备忘录》的答复问题作了说明。会议同意周恩来关于…的工作部署); [[w.yang-shangkun-riji]], II, 3 (May 8,
        1961; 12时总理由邯郸回来参加了会议，谈陈总等明天飞莫斯科转赴日内瓦问题). The hour: noon (12时, Yang, II, 3). Made public: 1997. The order: after [[cal.1961-05-08.china-leadership-3]], the morning session (Yang,
        II, 3: 上午书记处会议; 12时 the Premier joins). Split under R25b: the morning session is [[cal.1961-05-08.china-leadership-3]]. See [[cal.1961-05-08.china-leadership-3]]. Names: Zhou
        Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
- add:
    entry:
