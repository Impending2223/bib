      c: Kennedy fixes Cuba's sugar quota for 1961 at zero, by Proclamation 3401.
      n: '[Proclamation 3401](https://www.presidency.ucsb.edu/documents/proclamation-3401-determination-cuban-sugar-quota-supplement-the-quota-established) (Mar. 31, 1961; under the
        Sugar Act as amended by "the act of March 31, 1961"; the quota for calendar 1961 "shall be zero"; the delegation to the Secretary of Agriculture continued). The order: after
        [[cal.1961-03-31.cuba]], the proclamation''s recital of "the act of March 31, 1961". Split under R17: the Sugar Act''s extension is [[cal.1961-03-31.cuba]]. See [[cal.1960-12-16.cuba]];
        [[cal.1961-03-31.cuba]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
