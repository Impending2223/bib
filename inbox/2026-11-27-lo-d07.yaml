      c: Hangzhou 杭州, Liu Zhuang 刘庄, evening. Mao with Zhou Enlai, Deng Xiaoping and Tian Jiaying settles the notice calling the May work conference; the Zhejiang inquiry team to spend
        ten days at Shengxian 嵊县 on the questions in Mao's letter.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 25, 1961 (晚上，在杭州刘庄召集周恩来、邓小平、田家英等开会，讨论五月中央工作会议通知稿，还决定浙江调查组在嵊县…进行调查，时间定为十天). [[w.deng-xiaoping-nianpu-1904]], III, 1633–1634 (Apr. 25,
        1961; evening (晚), Deng, Zhou and Tian Jiaying at Mao''s lodging on the draft notice; the Zhejiang inquiry team to spend ten days at Shengxian on the villages'' problems). [[w.jianguo-yilai-mao-zedong]],
        XVI, 13–15 (Mao''s letter of 9 a.m. asks Deng to draft the notice with Tian Jiaying and to settle it "that evening"). The hour: the evening (晚上, Mao nianpu). Made public: 2013.
        Split under R25b: Mao''s letter of 9 a.m. is [[cal.1961-04-25.china-leadership]]. See [[cal.1961-04-25.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Tian
        Jiaying.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:tian-jiaying
      - vis:only:prc
