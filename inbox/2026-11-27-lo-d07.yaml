    base: a05d4119
    set:
      c: 'Chen Yun to the Central Work Conference: four policies for the food problem: grain imports;{1} the Sixty Articles; industrial support for agriculture; and the move of urban
        residents to the countryside, at once.{2} Each person sent back needs 75 kg. less state grain: 750,000 tonnes if 10 million go, 1.5 million if 20.{3} Three of the four grain
        crises since 1949 came from the towns'' growth. Three years have added over 25 million workers, the towns now at 130 million. Twenty million sent down would save 3 billion jin
        of grain the first year, 9 billion the second.{5}'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 30–32; [[w.yang-shangkun-riji]], II, 38 (May 31, 1961; Chen Yun speaks at the enlarged session after Zhou''s report); [[w.yang-jisheng-mubei]],
        II, 832 (Chen Yun at the work conference of May 21–June 12, May 31: four ways to the grain problem, the first the rural policy, the fourth the move of townspeople to the countryside;
        n.50); [[w.chen-yun-nianpu-xiuding]], III, 90–92 (Chen Yun speaks to the work conference on cutting staff and sending townspeople to the villages: four ways (policy, industry''s
        support, imports beyond 10 billion jin hard, townspeople to the villages), the first the root and the fourth indispensable; either squeeze the peasants'' rations or send townspeople
        down; three of the four grain crises since 1949 came from the towns'' growth; to reach 1958''s output again would take three or four years even at 20 to 30 billion jin more a
        year; 25 million new workers in three years, the towns at 130 million; twenty million sent down would save 3 billion jin the first year and 9 billion the second; printed in 《陈云文选》
        as 《动员城市人口下乡》); [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 364–374 (printed as "Mobilize the urban population to go to the countryside" 《动员城市人口下乡》, from *Chen Yun wenxuan*, III;
        the note: his speech to the Central Work Conference); [[w.chen-yun-nianpu-xiuding]], III, 90–92. Made public: 1986 ([[w.chen-yun-wenxuan-1956]], where the nianpu says the speech
        is collected; [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 364–374 prints it from the *Wenxuan*''s vol. III). Check: Made public: [[w.chen-yun-tongzhi-wengao]] (1980), cited here,
        may print the speech earlier, if it was an open printing. To check: [[w.chen-yun-tongzhi-wengao]], 120–21 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 31 n.46);
        [[w.chen-yun-tongzhi-wengao]], 128 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 32 n.53). Split under R17: Liu Shaoqi''s warning of the Soviet Union in 1921 is a
        sentence of [[cal.1961-05-31.china-leadership-2]]. Names: Chen Yun.'
