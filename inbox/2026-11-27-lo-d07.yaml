    entry:
      id: cal.1961-03-24.jobs-and-wages-2
      when: Mar. 24
      date: '1961-03-24'
      place: washington
      thread: jobs-and-wages
      c: 'Temporary Extended Unemployment Compensation Act of 1961, [75 Stat. 8](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg8.pdf), signed: some 700,000 jobless
        workers, their State benefits exhausted, to be helped at once; another 2.5 million within a year.'
      n: 'Statement by the President Upon Signing the Temporary Extended Unemployment Compensation Act, [1961 Pub. Papers 220](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=278)
        (Mar. 24, 1961; "which I have just signed into law"; Public Law 87-6). [75 Stat. 8](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg8.pdf) (1961). Split under
        R17: the House''s votes of the day are [[cal.1961-03-24.program]]. See [[cal.1961-03-24.program]]; [[cal.1961-03-24.jobs-and-wages]].'
      tags:
      - name:kennedy-john-f
