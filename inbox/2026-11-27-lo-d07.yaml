ops:
- add:
    entry:
      id: cal.1961-03-01.africa-2
      when: By Mar. 1
      date: '1961-03-01'
      thread: africa
      c: 'Williams, Assistant Secretary for African Affairs, on a tour of Africa, in Kenya: what the Africans want for themselves the United States wants for them; the press reports
        it "Africa for the Africans."'
      n: 'The President''s News Conference, [1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193) (Mar. 1, 1961; the question at
        138–39, "including the one of ''Africa for Africans''", dates the statement by the report: on or before Mar. 1). [[w.sorensen-kennedy]], 538–39 (Williams "endorsed the slogan";
        not the place or the day). Split under R25b: Kennedy''s answer at his news conference is [[cal.1961-03-01.africa]]. See [[cal.1961-03-01.africa]]. Names: Williams. Check: the
        day and the place; neither the Papers nor Sorensen gives them.'
      tags:
      - name:williams-g-mennen
- add:
    entry:
      id: cal.1961-03-07.economy
      when: Mar. 7
      date: '1961-03-07'
      place: washington
      thread: economy
      c: Martin tells the Joint Economic Committee much of the unemployment is structural, the day after the Council's statement.{1} Patman presses Martin by letter, Mar. 30.{2}
      n: '[[w.sundquist-politics-and-policy]], 57–58 (Martin to the committee the day after the Council''s statement; the hearings of Mar. 6 and 7, 58 n.2; Martin: actions that "go to
        the core of the particular problem"; Proxmire prints the two statements in the Record, Mar. 9). To check: Joint Economic Committee, *January 1961 Economic Report of the President
        and the Economic Situation and Outlook: Hearings*, 87th Cong., 1st sess. (1961), 464, 470 (cited by [[w.sundquist-politics-and-policy]], 58 n.2, for Martin). See [[cal.1961-03-06.economy]];
        [[cal.1961-03-09.economy]]. Names: Martin, Patman. Check: Patman''s letter of Mar. 30: no source read bears it (the FRASER page cited with it is Heller''s statement of Mar. 6).'
      tags:
      - name:martin-william-mcchesney-jr
      - name:patman-wright
