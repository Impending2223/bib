      id: cal.1968-08-06.elections-1968-miami-20
      when: Aug. 6
      date: '1968-08-06'
      thread: elections-1968-miami
      c: The third session, 9:15 p.m. A small demonstration for Rockefeller in the southeast corner of the floor; Reagan's
        and Nixon's backers wave their placards. Brooke, temporary chairman, gavels for order ("There will be time for demonstrations
        later") and has the sergeants at arms clear the aisles.
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2105. Names: Rockefeller, Reagan, Nixon, Brooke.'
      src:
        c: 5c81e8c9
        rows:
        - 'w.cq-weekly-report Aug. 9, 1968, 2105: all'
