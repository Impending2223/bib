      place: cua-viet
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      - vietnam
      c: Quảng Trị. Off Cửa Việt, July 30, Saigon's naval ship Đống Đa 07 seizes Tư Mâu's boat and takes it to Đà Nẵng. After more than eight months' detention the Saigon side learns nothing.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 150.'
      tags:
      - polity:drv
