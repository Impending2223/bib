- add:
    entry:
      id: cal.1962-07-15.vietnam-hanoi
      when: July 15–17
      date: '1962-07-15'
      place: hoa-nhat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      - vietnam
      c: 'Biên Hòa. The people of Tân Hiệp and Tân Hòa communes, Châu Thành, penned in the Hòa Nhật strategic hamlet, break out: the night of July 15 guerrillas outside fire on the blockhouse at the gate and 200 families go through the fence before dawn; the night of July 16 again, with the people calling the soldiers by loudspeaker to stand still or surrender; the morning of July 17, 107 more families leave. The hamlet is leveled.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 193.'
