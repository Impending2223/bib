      - vietnam
      c: Quảng Ngãi. Nà Niêu, in the Trà Bồng valley. 7 a.m., Aug. 30, aircraft bomb the camp of Region 5's Battalion 90, under 100 men while the rest are carrying rice; by 9 a.m. 30 helicopters land the 77th Ranger group. The battalion with militia and guerrillas fires on the first landings and fights more than six hours; the troops are taken off by rope ladders. The history counts 12 helicopters shot down, 4 on the spot.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 180–82. Check: the American record not read; losses as the history gives them.'
      tags:
      - polity:drv
      time: '1962-08-29T23:00Z'
      time_zone: Asia/Ho_Chi_Minh
