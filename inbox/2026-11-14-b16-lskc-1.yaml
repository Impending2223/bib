      c: Quảng Nam, Quảng Ngãi, Kon Tum. Saigon's II Corps, Gen. Nguyễn Khánh, sends three divisions against the Măng Xim base of Region 5's leaders, with two marine battalions to land in its center. The ground columns take their places in the "net" May 4. Regiment 2 and Battalion 409 with the local forces stop them; the marines landed at Nước Xu lose 80 men the same day; the reinforcing 22d Division convoy loses 13 vehicles at Cam Rẫy. May 15 the command ends the operation.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 250–52. Names: Nguyễn Khánh. Check: the history gives May 4 and May 15; the American record not read; the losses as the history gives them.'
