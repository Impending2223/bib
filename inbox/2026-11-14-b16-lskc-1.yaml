      place: kien-tuong
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Kiến Tường. The rising begins. Feb. 2 the provincial and district forces take the Sông Trăng post and force the withdrawal of posts and watchtowers along the road.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 334. Check: the history gives the start (Jan. 28) and the Sông Trăng post (Feb. 2) and tallies to Mar. 2 (II, 335: 56 killed, 300 Civil Guard and Self-Defense men destroyed or dispersed, over 200 weapons, 11 communes).'
