      - vietnam-operations
      c: Rạch Giá. The night of Sept. 14, the U Minh 101 Battalion surrounds and attacks the posts of Trà Quớn and others. By early October the province had destroyed or forced out 500 posts and cleared 15 communes and 350 hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 358–59.'
