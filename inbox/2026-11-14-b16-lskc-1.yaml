      c: Bình Định. Ship 401, Phạm Vạn master, Đặng Văn Thanh political officer, 12 men, after turning back in a monsoon two weeks out, sails again Oct. 26 for Region 5. The night of Oct. 31 it goes aground in surf at the Lộ Giao landing; the arms are unloaded and hidden by dawn and the ship, badly damaged, secretly destroyed.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 209. Made public: 2013.'
