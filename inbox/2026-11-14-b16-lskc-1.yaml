      - vietnam
      c: Cà Mau. The boat of Tư Mâu, five crew, leaves the Bồ Đề mouth for the North, July 24, sent by Region 9's standing committee to report to the Center and ask for ships with arms for the landings prepared.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 150. Made public: 2013.'
      tags:
      - polity:drv
