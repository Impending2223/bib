      place: tay-ninh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tây Ninh. Battalions 1 and 2 and their attached units, brought to full strength, hold the formal ceremony of Q761 at Trảng Dài, Feb. 9, and the regiment takes the name of the 1st Infantry Regiment.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 47. Made public: 2013. Check: the history gives the battalions'' first ceremony at Dương Minh Châu as "9-2-1961", before the regiment''s founding in July 1961 (III, 47): a misprint for 1962 or for another day.'
      tags:
      - polity:drv
      - vis:only:drv
