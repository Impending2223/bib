      thread: vietnam-hanoi
      c: Quảng Ngãi. A conference of the province in February sums up the Trà Bồng rising and the struggle of 1954–60; Võ Chí Công, secretary of the Interzone V committee, speaks.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 296 n.1. Made public: 2013. Names: Võ Chí Công. Check: the day; the speech is quoted from the Party History Board of Quảng Ngãi, an archive not read.'
