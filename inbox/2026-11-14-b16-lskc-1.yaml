      when: May
      date: '1963-05'
      place: huong-thuoc
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Thủ Dầu Một. In May Saigon's 5th Division sweeps three communes southwest of Bến Cát to move the people; guerrillas of Tây An and Phú Thứ ambush the columns on Route 14 at Rạch Bắp and Phú Thứ crossroads, and Company 304 of the province and Company 81 of Bến Cát wipe out the men in the Hương Thuốc church in the Long Cần strategic hamlet.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 297. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
