      also:
      - vietnam-operations
      - vietnam
      c: 'Bông Văn Dĩa''s boat reaches the North, Aug. 1: his second trip north; its crew report in detail to the Center.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 150. Made public: 2013. Check: the place of landing.'
