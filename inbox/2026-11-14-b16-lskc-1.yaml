      c: Hậu Nghĩa. Nov. 23 Saigon retakes the Hiệp Hòa base with a regiment, four helicopter gunships and 18 M113s in two columns, as thousands of people of four communes block the road and call on the soldiers to turn back.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 280.'
