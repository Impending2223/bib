      - vietnam-operations
      c: Kiến Phong. The night of Jan. 15, the people of three communes of Hồng Ngự district, Tân Thành, Thường Thới and Thường Phước, rise together. By Jan. 20 the province claims 165 of the Saigon side killed or wounded and 40 taken.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 324–25. The time is the first day''s.'
