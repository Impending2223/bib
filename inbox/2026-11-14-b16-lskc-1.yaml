      c: Quảng Nam. The people of Nóc Ông Tía, Phước Sơn district, 11 self-defense men and 30 families, rise Mar. 13, kill a squad of the Civil Guard with machetes, burn the Saigon administration's office and go into the forest. Five days later a company burns the hamlet and is stopped by spiked traps. The first armed rising in the province's mountains.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 353–54.'
