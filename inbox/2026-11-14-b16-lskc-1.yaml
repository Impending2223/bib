      when: July 20
      date: '1962-07-20'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Front''s Central Committee sets four urgent policies for national salvation, July 20: the Americans to halt their war of aggression; all strategic hamlets to be dismantled; a national coalition government in the South; a peaceful, neutral foreign policy.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 189 n.1. Check: the place.'
      tags:
      - polity:drv
