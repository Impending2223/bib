      when: Nov., late
      date: '1963-11'
      place: long-dat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Long Đất. At the end of November the district troops with the village guerrillas ambush on Route 15 a main-force unit sweeping to widen its base and move the people: many killed, among them the subsector chief.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 295. Check: the day.'
      tags:
      - polity:drv
