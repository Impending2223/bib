      when: Feb.
      date: '1963-02'
      thread: vietnam
      c: After Ấp Bắc the Americans and Saigon decide on a "general offensive plan", carried out from February 1963.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 263. Check: the history''s name; the American record not matched; the day.'
      tags:
      - polity:rvn
