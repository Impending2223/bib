      when: Oct.
      date: '1963-10'
      place: phuoc-loi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Long Đất. In October Company 25, with guerrillas as guides and men inside, attacks the Phước Lợi strategic hamlet: 12 hard-core officials seized, 13 weapons taken, the hamlet held.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 295. Check: the day.'
      tags:
      - polity:drv
