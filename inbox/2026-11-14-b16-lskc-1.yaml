      c: 'Quảng Nam. Region 5 uses four main-force battalions and local forces for the "crossing the Tiên river" campaign, in September, on the boundary of Tiên Phước, Quế Sơn, Thăng Bình and Tam Kỳ districts: 27 strategic hamlets broken, 7 communes and 13 villages taken.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 182. Check: the day.'
