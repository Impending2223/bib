      place: saigon
      thread: vietnam-hanoi
      also:
      - vietnam
      c: Saigon. Saigon sends Civil Guard and paratroopers against the Vimytex strikers, May 10.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 355. Check: the history''s count of the dead is cut off at III, 355.'
