      when: Feb. 6–7
      date: '1965-02-06'
      place: viet-an
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Nam. The night of Feb. 6–7 Region 5's Regiment 1 attacks the Việt An strongpoint, a key post on a hill at the junction of Routes 105 and 16, 8 km south of the Quế Sơn district seat.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 400.'
      tags:
      - polity:drv
      time_range:
      - '1965-02-06T14:00Z'
      - '1965-02-06T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-02-07.vietnam-hanoi
      when: Feb. 7
      date: '1965-02-07'
      place: pleiku
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Gia Lai. The night of Feb. 7 the Region''s Sapper Battalion 407 and Battalion 334 of Regiment 320 take a string of Civil Guard posts west of Pleiku and the Plây Mơrông commando border post: 100 killed. In the same weeks Regiment 101 takes Đắk Giao, shells the Đắk Pét base and breaks Route 14 north of Kon Tum.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 399–400.'
      tags:
      - polity:drv
      time_range:
      - '1965-02-07T14:00Z'
      - '1965-02-07T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-02.vietnam-hanoi
      when: Feb., early
      date: '1965-02'
      place: lo-o
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Thuận. Early in February Region 6's main forces destroy the Lồ Ô strongpoint at Tánh Linh and badly hurt the subsector; 1,000 people of the Đồng Me concentration area rise and go back to the base.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 402. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-02-23.vietnam-hanoi
      when: Feb. 23
      date: '1965-02-23'
      place: hoai-duc
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Thuận. The night of Feb. 23 part of the Region's main force with Hàm Tân's local troops attacks the Hiệp Hòa hamlet and badly hurts two companies come from the subsector; Feb. 23 the garrison of the Hoài Đức subsector leaves its post and runs to Võ Đắc. All Hoài Đức district and most of Tánh Linh, over 35,000 people, are free.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 402. Check: the history gives both acts on Feb. 23, the attack on the hamlet by night and the subsector''s abandoning.'
      tags:
      - polity:drv
      time_range:
      - '1965-02-23T14:00Z'
      - '1965-02-23T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-03-30.vietnam-hanoi
      when: Mar. 30
      date: '1965-03-30'
      place: kontum
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Kon Tum. Mar. 30 Regiment 101 finishes the fight against Saigon''s operation 129, begun to retake the posts lost in northern Kon Tum (Regiments 40 and 42, Ranger Battalion 21): it destroys most of Battalion 21 and a company of the 1st Battalion, 42d Regiment and shoots down three aircraft; the Saigon forces withdraw and the garrisons of Đắk Tả, Đắk Vân, Mỏ Lẹt and Măng Bút run.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 400. Check: the operation''s start not given.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-12-08.vietnam-hanoi-2
      when: Dec. 8
      date: '1964-12-08'
      place: an-lao
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Định. 8 a.m., Dec. 8. Six fighters and two reconnaissance planes cover 26 helicopters landing troops at the foot of Hill 193 to relieve the An Lão district seat; from noon aircraft bomb Regiment 2 of Region 5 for three hours, nearly 50 of its men killed or wounded. That evening the Region's command, judging the aim of the An Lão battle achieved, ends it and takes the main force out.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 390. The time is the first act''s, the landing.'
      tags:
      - polity:drv
      time: '1964-12-08T00:00Z'
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-01-01.vietnam-hanoi
      when: Jan. 1
      date: '1965-01-01'
      place: duc-thanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Phước Tuy. Jan. 1 Saigon opens operation Hùng Vương 2 to relieve Đức Thạnh and retake Bình Giã.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 385.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-01-03.vietnam-hanoi
      when: Jan. 3
      date: '1965-01-03'
      place: duc-thanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      - vietnam
      c: Phước Tuy. Jan. 3 Regiment 762 destroys a 16-vehicle convoy (two tanks, two M113s) with Ranger Battalion 35 on Route 2 from Bà Rịa to Đức Thạnh; the Bình Giã campaign ends, Dec. 2 to Jan. 3. By the Region's count it destroyed two main-force battalions (the 33d Ranger and the 4th Marine), Armored Troop 3 of M113s and two motor convoys, badly hurt three Ranger battalions (30, 35, 38) and seven Civil Guard companies and broke up most of the Self-Defense Corps in the area.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 385–86.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-04-08.vietnam-hanoi-2
      when: Apr. 8
      date: '1964-04-08'
      place: thanh-loi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Long An. Battalion 1 of the province beats a sweep of the Saigon 25th Division at Thạnh Lợi commune, Apr. 8, the most notable of the province's fights against sweeps in the drive begun at the year's start to break the pacification plan.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 358.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-05-17.vietnam-hanoi
      when: May 17
      date: '1965-05-17'
      place: phu-long-bt
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Thuận. May 17 Region 6's troops, dressed as civilians in two three-wheeled taxis, open fire by surprise on the guards of a bridge and take the Saigon office at Phú Long. The Phan Thiết subsector sends Civil Guard Companies 441 and 887 with five M113s; seven times they cross the river and are thrown back.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 434–35.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-05-22.vietnam-hanoi-2
      when: May 22
      date: '1965-05-22'
      place: phu-long-bt
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Thuận. May 22 Saigon sends a marine battalion and a Ranger battalion to counterattack at Phú Long; after four hours Region 6's troops break their assaults, 150 killed or wounded.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 435.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-06-27.vietnam-hanoi
      when: June 27
      date: '1965-06-27'
      place: bsar
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Lâm Đồng. June 27 the province's troops destroy the B'Sar strongpoint, which commands a wide area south of the Blao pass, and bring down the bridges at Đậm Mrế and Đạc Oai; the people along Routes 20 and 14 bis rise and Saigon pulls back to Bảo Lộc and Di Linh.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 434.'
      tags:
      - polity:drv
