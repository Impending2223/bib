      c: Cà Mau. The night of Sept. 9–10, Region 9's main-force Battalion 306 and the province's U Minh Battalion attack the subsectors of Cái Nước and Đầm Dơi, 21 km apart. At Cái Nước Battalion 306 is in position at 3:40 p.m., opens fire at 0:40 a.m. Sept. 10 and holds the subsector to 3 p.m. At Đầm Dơi the U Minh Battalion comes in 300 boats, in position at 6:30 p.m., fires at 4:10 a.m. and, on Nguyễn Đệ's order, withdraws by 6 a.m. Both subsectors destroyed, 327 out of action, among them the district chief and deputy of Đầm Dơi.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 286–89. The time is the first day''s, Battalion 306 in position at Cái Nước. Check: the figures as the history gives them; "one district chief killed, another taken" is cut off at III, 289.'
