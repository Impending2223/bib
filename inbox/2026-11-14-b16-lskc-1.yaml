      when: Oct. 28
      date: '1963-10-28'
      place: phan-thiet
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bình Thuận. Troops and guerrillas ambush an armored column sweeping toward Phan Thiết, Oct. 28: one carrier and dozens of men destroyed, 50 weapons taken; then they stay to help the people of the villages outside the town rise.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 261.'
      tags:
      - polity:drv
