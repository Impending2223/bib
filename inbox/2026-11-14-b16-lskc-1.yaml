      when: Jan. 17–24
      date: '1960-01-17'
      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      - vietnam
      c: Bến Tre. The rising (Đồng Khởi) begins in three communes, Định Thủy, Phước Hiệp and Bình Khánh, as the enlarged provincial committee, called by Nguyễn Thị Định Jan. 1 at Tân Huề, Mỏ Cày, had decided. Định Thủy up at 8 a.m. Jan. 17, Phước Hiệp free Jan. 19, Bình Khánh at 2 a.m. Jan. 20. By Jan. 24, 47 communes of five districts are up, 22 cleared of the Saigon administration.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 318–23. The time is the first day''s, Định Thủy. Names: Nguyễn Thị Định.'
      tags:
      - polity:drv
      time: '1960-01-17T00:00Z'
      time_zone: Asia/Ho_Chi_Minh
