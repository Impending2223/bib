      when: May 23
      date: '1962-05-23'
      place: saigon
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Saigon. The special military court sentences 12 men, May 23: four to death, four to life, four to terms of 5 to 10 years. Five thousand students and four thousand parents hold a march of 5 to 6 km at Chợ Lớn and Tân An against the verdict.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 187. Check: the day of the march is not given.'
      tags:
      - polity:drv
