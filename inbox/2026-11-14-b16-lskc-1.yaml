      c: Hà Tiên. The Lê Quang Battalion, 93 men with rifles and machetes, attacks three posts of the Civil Guard Feb. 14 and frees 7,000 people of the Ba Thê agroville in a night. Feb. 16 Saigon sends a paratroop battalion, a Ranger company and three Civil Guard companies against it.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 342–43.'
