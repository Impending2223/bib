      date: '1965-01-20'
      place: bau-lach
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Gia Định. Companies 707 and 200 of the Saigon–Gia Định Region fight together, Jan. 20, and stop two Saigon main-force battalions sweeping the Bàu Lách hamlet, Nhuận Đức commune, in the Củ Chi tunnels area: 166 out of action.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 395–96.'
      tags:
      - polity:drv
- add:
