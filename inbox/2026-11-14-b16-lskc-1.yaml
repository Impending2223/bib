      place: cam-lam
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ninh Thuận. Battalion 120 of Region 6 destroys the Cửu Lợi post in Cam Lâm district in September. In October it joins Khánh Hòa's troops against the Saigon side at Cấm Sơn; at the end of the year half of it goes to northern Ninh Thuận.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 162. Check: the day; the October fight at Cấm Sơn and the year-end move are the history''s next sentences, not entered separately.'
