      c: 'Đắk Lắk. The night of Dec. 5 (Nov. 8 by the lunar calendar), a moonless night, four infantry companies, a sapper company and a fire-support group of Region 6''s Battalions 186 and 840 attack by surprise the Saigon base at Đầm Rồn: the operations headquarters, the 45th Regiment''s command and some 700 men behind six outposts. In 55 minutes they hold the center and put over 300 out of action.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 183.'
