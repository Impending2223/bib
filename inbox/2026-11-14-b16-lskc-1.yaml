      when: Aug. 24–25
      date: '1963-08-24'
      place: saigon
      thread: vietnam
      c: Saigon. Some 1,200 students of the Polytechnic, 700 of the School of Pharmacy and over 1,200 of the Law School leave exams and classes, Aug. 24, and rally against the Diệm government. Aug. 25 several thousand students and pupils hold a large rally at the Bến Thành market.
