      id: cal.1962-06.vietnam-hanoi-2
      when: June, early
      date: '1962-06'
      place: hanoi
      thread: vietnam-hanoi
      c: 'The Secretariat opens a campaign in early June to build "four-good" Party cells and committees: good leadership of production, good enforcement of State policy and law, care for the masses'' life and mass work, and good Party building and strengthening.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 95–96. Check: the day; the history gives the Secretariat and early June. A second campaign of the same months, "three buildings, three oppositions", opened by the Politburo Apr. 26.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1962-06.vietnam-hanoi-3
      when: June–Nov.
      date: '1962-06'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The National Liberation Front's delegation under Prof. Nguyễn Văn Hiếu visits Czechoslovakia in June, the Soviet Union in July (and the July 26 celebration in Cuba), Hungary in August, Indonesia in September, China in October (and Algeria's national day), and North Korea in November.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 189. Names: Nguyễn Văn Hiếu. Check: the days; one entry for the tour, as the history gives it by month.'
      tags:
      - polity:drv
      - name:nguyen-van-hieu
- add:
