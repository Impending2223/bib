      also:
      - vietnam-operations
      c: 'Trà Vinh. The rising begins Sept. 14 in three communes: Mỹ Long, Hiệp Mỹ and Hiệp Thạnh. At 6 p.m. Sept. 15 the post at Hiệp Thạnh surrenders; the Hiệp Mỹ post is abandoned that night. Sept. 15, 12,000 from nearby communes and 2,000 townspeople march in the provincial town against terror.'
