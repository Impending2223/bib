      when: Apr., late
      date: '1961-04'
      thread: vietnam-hanoi
      also:
      - laos
      c: Military Region 4 opens Road 129 from Route 12 to Route 9 in Laos, for the new strategic transport line west of the Trường Sơn, at the end of April, with Engineer Battalions 15 and 25 of the 325th Division, Battalion 3 of Regiment 101 and Hà Tĩnh's Battalion 929. After the Central Laos campaign of late April the North had asked the Lao Party to move the strategic transport road to the west of the Trường Sơn.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 129. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
