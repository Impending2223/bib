      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. In September Saigon opens a "pacification and amnesty" campaign centered on Mỏ Cày, against the freed area and the bases.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 158. Check: the day.'
      tags:
      - polity:drv
