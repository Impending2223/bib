      place: me-pu
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Thuận. Region 6's Battalion 186 ambushes and destroys a Civil Guard company and three Self-Defense platoons marching from Hoài Đức to Mê Pu, Jan. 17, and then takes the Bắc Núi hamlet, the last next to the subsector, and besieges the Hoài Đức district seat.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 401–02.'
      tags:
      - polity:drv
