      when: May 24
      date: '1962-05-24'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The National Liberation Front's appeal, May 24, to the people of the South and to the soldiers of the Saigon army to rise against the Americans and their agents.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 189. Check: the place.'
      tags:
      - polity:drv
      - ok:fields-place
