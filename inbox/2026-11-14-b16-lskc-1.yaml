      place: ca-mau
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Cà Mau. The provincial committee meets, Jan. 6: the armed units to be brought up to strength, and a simultaneous rising of the people to be backed.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 339. Made public: 2013.'
      tags:
      - polity:drv
