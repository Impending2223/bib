      thread: vietnam-hanoi
      also:
      - vietnam-operations
      - vietnam
      c: The people of Phước Hải bring a boat out to Hồ Cóc, in the freed area, and hand it to the Region at the end of January; they get Saigon permits for the six crew to pass the sea checks. It is one of the boats for the trips to the North.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 150. Made public: 2013. Check: the day.'
