      when: Mar., early
      date: '1963-03'
      place: tram-lac
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Long An. In early March Saigon uses an infantry task force, an armored troop and Rangers to encircle and take the Trầm Lạc and Ấp Mới area at Mỹ Hạnh, Đức Hòa, and with tanks and bulldozers destroys the fighting works built by the troops, guerrillas and people there; most secret shelters destroyed, the guerrillas unable to hold.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 275. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
