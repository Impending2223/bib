      when: Sept.
      date: '1963-09'
      place: cay-cam
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Châu Đức. In September a district platoon with some guerrillas ambushes a Ranger battalion at Cây Cám: 38 killed, five weapons taken.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 294. Check: the day.'
      tags:
      - polity:drv
