      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bàu Giá, Tây Ninh. The military board of the Eastern Nam Bộ interprovince committee meets in the first days of January to carry out the Regional Committee''s directive. Two plans: take one or two district seats and four or five strongpoints, or attack Tua Hai, the base of the Saigon 32d Regiment. It proposes Tua Hai; the Regional Committee approves.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 316. Made public: 2013. Check: the day; the meeting is not dated more closely than "the first days of the year".'
