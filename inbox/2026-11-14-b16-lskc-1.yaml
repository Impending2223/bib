      when: Sept., mid
      date: '1963-09'
      place: long-dat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Long Đất. In mid-September the district''s Company 25 beats a sweep of Civil Guard Battalion 356: 75 out of action.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 295. Check: the day.'
      tags:
      - polity:drv
