      when: Oct., mid
      date: '1963-10'
      place: long-an
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Long An. In mid-October the troops of Tân Trụ and Bến Lức raid the posts at Tân Bửu, Bình Đức and Mỹ Thạnh and hold their ground against the sweeps to move the people; in the month the province's forces destroy dozens of posts and help break 20 strategic hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 279. Check: the day.'
      tags:
      - polity:drv
