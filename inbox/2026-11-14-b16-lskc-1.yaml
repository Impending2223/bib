      date: '1961-02-17'
      place: saigon
      thread: vietnam-hanoi
      also:
      - vietnam
      c: Saigon. Eight hundred workers of the Vimytex textile firm, a joint firm of Diệm's circle and the American Johnson company, strike, Feb. 17, for working conditions in line with the labor law.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 186. Names: Ngô Đình Diệm. Check: the history gives "17-2-1961" in a passage on the strikes of 1962; the year is the history''s.'
