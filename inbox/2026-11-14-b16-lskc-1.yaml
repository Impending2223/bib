      place: song-ong-doc
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cà Mau. The U Minh Battalion starts the rising Sept. 14 by an attack on the district seat at Sông Ông Đốc. By December the province had razed 62 posts, taken over 3,000 weapons and cleared 55 of 65 communes and 500 of 550 hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 357–58.'
