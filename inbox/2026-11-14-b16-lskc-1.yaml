      c: Hồ Chí Minh's article in *Nhân Dân*, under the pen name TL, Feb. 1, on the defeat of the Americans' newest tactics and arms by the people's spirit; the history cites it for the Ấp Bắc battle.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 239 n.1. Names: Hồ Chí Minh. Check: the article itself not read; its subject is the history''s.'
