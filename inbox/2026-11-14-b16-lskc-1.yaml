      when: Feb.
      date: '1961-02'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Interzone V's committee and Region 5's command decide in February to mobilize all forces to attack the Saigon side, hold the forests and mountains, build the bases and win back the plains. Thừa Thiên's forces strike sweeps at Nam Đông, Đá Mộc, Hòa Mỹ and Route 4 and on the Bồ and Ô Lâu rivers that month; in Quảng Trị the guerrillas besiege and call on isolated posts to surrender.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 141. Made public: 2013. Check: the day and the place of the decision.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
