      when: Jan. 17
      date: '1961-01-17'
      place: saigon
      thread: vietnam-hanoi
      also:
      - vietnam
      c: Saigon. Thousands of teachers and pupils of the big schools demonstrate, Jan. 17, for lower fees at the private schools and better pay for teachers.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 143.'
