      when: Apr. 1
      date: '1964-04-01'
      thread: vietnam
      also:
      - vietnam-operations
      c: 'The Saigon–American pacification plan "Chiến Thắng" (Victory) takes effect, Apr. 1: the first step to Dec. 3, 1965, pacification by priority in tactical zones I, II and III by continuous sweeps with the moving of the people into "new life hamlets"; the second, from 1966, attacks on the base areas to destroy the Liberation Army''s main units.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 334–35. Check: the American record: Chiến Thắng, in the calendar at [[cal.1964-04-01.vietnam]]; the history''s account of the plan''s two steps.'
      tags:
      - polity:rvn
      - ok:fields-place
