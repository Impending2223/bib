      place: gia-lai
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Region 5. The people boycott Diệm''s rigged "presidential election" in April: in Gia Lai the people of 600 hamlets under the Saigon side stay away and burn their voters'' cards.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 144. Names: Ngô Đình Diệm. Check: the day.'
      tags:
      - polity:drv
      - name:ngo-dinh-diem
