      when: May 1
      date: '1962-05-01'
      place: saigon
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Saigon. Tens of thousands of workers of hundreds of unions meet for May Day, May 1: resolutions for higher pay and against firings; 5,000 taxi and cyclo drivers march shouting "Down with the Americans", "Down with Ngô Đình Diệm".'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 187. Names: Ngô Đình Diệm.'
      tags:
      - polity:drv
      - name:ngo-dinh-diem
- add:
    entry:
