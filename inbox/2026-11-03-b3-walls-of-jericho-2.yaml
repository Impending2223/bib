by: 'Claude (batch 3 reading, resumed: Mann, The Walls of Jericho, 1996), Nov. 3-4, 2026'
ops:
- add:
    entry:
      id: cal.1960-11.elections-1960-5
      when: Nov.
      date: 1960-11
      thread: elections-1960
      c: 'Russell to a friend, by letter, several days after the election: "I am afraid that I go too much on personalities."
        Johnson "will be a power in the next administration"; he and Kennedy "would have been signally defeated without the
        South."'
      n: '[[w.mann-walls-of-jericho]], 289. Check: the day; Mann gives "several days after the election." See [[cal.1960-11-06.elections-1960-5]].
        Names: Russell, Johnson, Kennedy.'
      src:
        c: fe5a2c2f
        rows:
        - 'w.mann-walls-of-jericho 289: all'
      tags:
      - name:russell-richard-b
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-08-16.civil-rights-bill
      when: Aug. 16
      date: '1963-08-16'
      thread: civil-rights-bill
      c: 'Russell to a friend, by letter: the whole matter "is shot through and through with politics"; the Attorney General
        had convinced the President "that he should go all out to force through a civil rights bill and get it through this
        year" so the South would be used to it by 1964.'
      n: '[[w.mann-walls-of-jericho]], 367. Names: Russell, Robert Kennedy, John F. Kennedy.'
      src:
        c: ed3a8692
        rows:
        - 'w.mann-walls-of-jericho 367: all'
      tags:
      - name:russell-richard-b
      - name:kennedy-robert-f
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-22.succession-6
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: Johnson, having looked for Russell at Andrews ("Where's Dick?"), telephones him several hours later; ten minutes.
      n: '[[w.mann-walls-of-jericho]], 380. Check: the hour. Names: Johnson, Russell.'
      src:
        c: e884ebe1
        rows:
        - 'w.mann-walls-of-jericho 380: all'
      tags:
      - name:johnson-lyndon-b
      - name:russell-richard-b
- add:
    entry:
      id: cal.1963-11-23.succession-7
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: 'Russell to lunch at the White House, summoned by Johnson. "Call me Lyndon as you used to." Russell: "No, Mr. President,
        now you''re the president of the United States."'
      n: '[[w.mann-walls-of-jericho]], 380. Names: Russell, Johnson.'
      src:
        c: 39542ab3
        rows:
        - 'w.mann-walls-of-jericho 380: all'
      tags:
      - name:russell-richard-b
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-11.elections-1964
      when: Nov.
      date: 1964-11
      thread: elections-1964
      c: 'Russell to Willis Robertson, after the election: "They have overtaken and overwhelmed us."'
      n: '[[w.mann-walls-of-jericho]], 444. Check: the day, and whether by letter. Names: Russell, Robertson.'
      src:
        c: 6268946e
        rows:
        - 'w.mann-walls-of-jericho 444: all'
      tags:
      - name:russell-richard-b
- add:
    entry:
      id: cal.1965-07-06.voting-rights
      when: July 6
      date: '1965-07-06'
      thread: voting-rights
      also:
      - republican-party-congress
      c: 'House, the voting rights bill, H.R. 6400, a month after Judiciary reported it, Smith having held it in Rules. Ford
        and McCulloch''s substitute: no ban on the poll tax; examiners only on twenty-five complaints to the Attorney General.
        Broder: "a major battle for political credit."'
      n: '[[w.mann-walls-of-jericho]], 474. To check: David Broder, by Mann''s note to 474. Check: the Record of the day.
        See [[cal.1965-05-12.voting-rights]]. Names: Ford, McCulloch, Smith, Broder.'
      src:
        c: de886243
        rows:
        - 'w.mann-walls-of-jericho 474: all'
      tags:
      - name:ford-gerald-r
      - name:mcculloch-william-m
      - name:smith-howard-w
      - name:broder-david-s
- add:
    entry:
      id: cal.1968-07.confirmations
      when: July
      date: 1968-07
      thread: confirmations
      c: 'Russell to Judge Griffin Bell of the Fifth Circuit, by letter, a month after the Lawrence nomination stalled: Clark''s
        position "unreasonable to the point of being vicious"; "I have never been as disappointed in a man as I am in Johnson
        for being frightened by the prospect" of Georgia''s civil rights activists'' opposition.'
      n: '[[w.mann-walls-of-jericho]], 496. Check: the day. Names: Russell, Bell, Clark, Johnson.'
      src:
        c: 315caa50
        rows:
        - 'w.mann-walls-of-jericho 496: all'
      tags:
      - name:russell-richard-b
      - name:bell-griffin-b
      - name:clark-ramsey
      - name:johnson-lyndon-b
