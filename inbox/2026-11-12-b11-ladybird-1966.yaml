patch: 2026-11-12-b11-ladybird-1966
by: 'Claude (batch 11: Lady Bird Johnson, A White House Diary, 1966), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1966-01-01.vietnam-pause
      when: Jan. 1
      date: '1966-01-01'
      thread: vietnam-pause
      also:
      - steel
      c: 'LBJ Ranch. Thomas Mann, back from Mexico on the peace appeal, says he never found the Mexicans so friendly to the United States. In the car to Enchanted Rock, calls on the car telephone from Moyers and Califano: reports from the peace seekers and the price increases in steel.'
      n: '[[w.johnson-white-house-diary]], 345 (Lady Bird Johnson''s account). See [[cal.1966-01-01.steel]]. Names: Mann, Moyers, Califano.'
      tags:
      - name:mann-thomas-c
      - name:moyers-bill
      - name:califano-joseph-a-jr
      - state:tx
- add:
    entry:
      id: cal.1966-01-03.vietnam-pause-4
      when: Jan. 3
      date: '1966-01-03'
      thread: vietnam-pause
      c: 'The White House. Johnson to Mrs. Johnson, swimming, on the week: the Budget, the State of the Union Message and, "if nothing, nothing, nothing comes of the peace offensive," when to resume the bombing. That morning he had thought about Vietnam "just as long as he could," then about the Budget.'
      n: '[[w.johnson-white-house-diary]], 347 (Lady Bird Johnson''s account). See [[cal.1966-01-03.vietnam-pause]]. Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-05.press-and-broadcasting
      when: Jan. 5
      date: '1966-01-05'
      thread: press-and-broadcasting
      c: 'The White House, 5 p.m. Mrs. Johnson interviewed by Howard Taubman of the New York Times on art and on how her feelings and the President''s are reflected in the Administration and its legislation; she shows him the Homer, the Sully and the Cassatt acquired for the house and names the paintings she wants: a Copley, a West, a Bingham, an Eakins, an Innes.'
      n: '[[w.johnson-white-house-diary]], 348–49 (Lady Bird Johnson''s account). To check: the Times''s piece. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-01-05.steel
      when: Jan. 5
      date: '1966-01-05'
      thread: steel
      c: 'The White House, morning. Johnson, leaving, to Mrs. Johnson: "We''ve lost the steel fight; we may lose the war." He had slept from 12:30 to 2:30.'
      n: '[[w.johnson-white-house-diary]], 347 (Lady Bird Johnson''s account). See [[cal.1966-01-02.steel]]. Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-07.peace-corps
      when: Jan. 7
      date: '1966-01-07'
      thread: peace-corps
      also:
      - transition-and-staff
      c: 'The White House. Galbraith declines the directorship of the Peace Corps, which Johnson had offered about a week before: he is six months short of finishing a book. If Johnson ever has a job that absolutely had to be done by "a sort of a fringe liberal considered dangerous by some," he wants to do it. Mrs. Johnson meets Johnson, Cain and Galbraith leaving the elevator.'
      n: '[[w.johnson-white-house-diary]], 349 (Lady Bird Johnson''s account). Galbraith''s words as Mrs. Johnson gives them. See [[cal.1966-01-17.transition-and-staff]]. Made public: 1970. Names: Galbraith, Johnson.'
      tags:
      - name:galbraith-john-kenneth
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-11.conservation
      when: Jan. 11
      date: '1966-01-11'
      thread: conservation
      c: Washington, the Statler Ballroom. The National Wildlife Federation's dinner with the Sears Roebuck Foundation. Udall master of ceremonies, Freeman the main speaker. Mrs. Johnson presents four awards, whooping-crane statuettes, and receives one; Nelson Rockefeller's award for "dynamic leadership" against water pollution; her check to landscape the National Zoo's new automobile entrance.
      n: '[[w.johnson-white-house-diary]], 349–50 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Udall, Freeman, Nelson Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:freeman-orville-l
      - name:rockefeller-nelson
      - city:washington
- add:
    entry:
      id: cal.1966-01-11.elections-1968-johnson
      when: Jan. 11
      date: '1966-01-11'
      thread: elections-1968-johnson
      also:
      - program
      c: 'The White House, the early hours. Johnson, awake, talks with Mrs. Johnson of the years ahead, "so fraught with danger and with decisions whose outcome we cannot see." Her advice: stay healthy, laugh a little, remember he is as tough as other Presidents who have lived through the same or worse. She thinks of the end of the term as "a light at the end of a tunnel."'
      n: '[[w.johnson-white-house-diary]], 349 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-01-11.program-2
      when: Jan. 11
      date: '1966-01-11'
      thread: program
      also:
      - poverty
      c: Night. Mrs. Johnson reads the final draft of the domestic part of the State of the Union Message and suggests a sentence on thrift and common sense in the war on poverty, with respect for the taxpayer's dollar.
      n: '[[w.johnson-white-house-diary]], 351 (Lady Bird Johnson''s account). She writes on Jan. 12 "Last night." See [[cal.1966-01-11.program]]. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-11.white-house
      when: Jan. 11
      date: '1966-01-11'
      thread: white-house
      c: The White House car pool cut from one hundred chauffeurs to sixty; every trip in a White House car logged, who and where, to end social and personal chauffeuring; telephone lines to be cut to need, not status. Three or four stories on "gumshoe practice in the White House."
      n: '[[w.johnson-white-house-diary]], 350 (Lady Bird Johnson''s account). Mrs. Johnson writes "our effort"; no one is named.'
      tags: []
- add:
    entry:
      id: cal.1966-01-12.conservation
      when: Jan. 12
      date: '1966-01-12'
      thread: conservation
      c: 'Washington. Mrs. Johnson with Brooke Astor, Mary Lasker, Walter Washington and Nash Castro on beautification: the schools, playgrounds and community parks, Hains Point and a future of cherry-tree alleys; the shortage of labor for park maintenance and highway beautification, and of nursery stock.'
      n: '[[w.johnson-white-house-diary]], 350–52 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1966-01-18.program
      when: Jan. 18
      date: '1966-01-18'
      thread: program
      c: The White House. Bill Heath, with Clark Clifford, tells Mrs. Johnson that the University of Texas has named a committee of four, Heath, Norman Hackerman, Harry Ransom and Frank Erwin, to make recommendations on getting the School of Public Service under way; an advisory committee to be formed from the faculty.
      n: '[[w.johnson-white-house-diary]], 353–54 (Lady Bird Johnson''s account). Mrs. Johnson had asked Galbraith on Jan. 7 for an hour on the School (349). Names: Clifford, Lady Bird Johnson.'
      tags:
      - name:clifford-clark
      - name:johnson-lady-bird
      - state:tx
- add:
    entry:
      id: cal.1966-01-23.press-and-broadcasting
      when: Jan. 23
      date: '1966-01-23'
      thread: press-and-broadcasting
      also:
      - europe-and-the-alliance
      c: 'Telstar. Rusk interviewed by newspapermen in Rome, Paris, Bonn and London, watched in the West Hall. Asked in one question of Rhodesia and South Africa: "If you don''t mind, I''d like to take my crises one at a time."'
      n: '[[w.johnson-white-house-diary]], 355 (Lady Bird Johnson''s account). To check: the day and the programme; the transcript. Names: Rusk.'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-01-23.program
      when: Jan. 23
      date: '1966-01-23'
      thread: program
      also:
      - vietnam-support
      - economy
      c: 'The White House, dinner for the Tom Manns, the Kermit Gordons, the John Macys, Tyler and Bess, and, added by Johnson, the Vice President. Talk of a medical team and an agricultural team, headed by Freeman, for Vietnam. Johnson: "The thing I want most is a Tax Bill by April 15"; "We will not pass much this year." Kermit Gordon: "It seems to me, Mr. President, this was the way you were talking in January 1965."'
      n: '[[w.johnson-white-house-diary]], 355 (Lady Bird Johnson''s account). Mrs. Johnson gives the talk as heard at the end of the evening; she writes "Tyler and Bess" without surnames. Names: Mann, Kermit Gordon, Macy, Humphrey, Freeman, Johnson.'
      tags:
      - name:mann-thomas-c
      - name:gordon-kermit
      - name:macy-john-w-jr
      - name:humphrey-hubert-h
      - name:freeman-orville-l
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-23.white-house
      when: Jan. 23
      date: '1966-01-23'
      thread: white-house
      c: 'The White House. Results of the security check on telephones and contacts, read by Mrs. Johnson: for 1965 "more than fifty-one thousand ''unfriendly contacts,''" from abusive telephone calls and threatening letters to 166 picketings, over three hundred "unwelcome visitors" at the Main Gate, 112 of them arrested or committed for mental observation, and seven persons apprehended climbing the fence.'
      n: '[[w.johnson-white-house-diary]], 354–55 (Lady Bird Johnson''s account). The diary dates her reading, not the report. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-02-05.vietnam-honolulu
      when: Feb. 5
      date: '1966-02-05'
      thread: vietnam-honolulu
      c: The White House, dinner on the State floor. Leonard Marks, the USIA's director, on his trip the next day to Hawaii and then Saigon. Talk of the audio-visual requirements of the Lyndon Baines Johnson Library.
      n: '[[w.johnson-white-house-diary]], 359 (Lady Bird Johnson''s account).'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-02-13.vietnam-support
      when: Feb. 13
      date: '1966-02-13'
      thread: vietnam-support
      also:
      - war-opposition
      c: 'The White House, evening. Johnson to Mrs. Johnson on Hawaii: impressed with Westmoreland, "rather impressed" with Kỳ; wounded to a hospital within three hours. The SEATO Treaty: Senate, February 1955, 82 to 1, Langer against; he at the Mayo Clinic, Kennedy absent with his back. "We are trying to carry out the contracts they made." Lafayette Park full of picketers; the White House picketed 166 times in 1965. "This thing is assuming dangerous proportions, dividing the country and giving our enemies the wrong idea of the will of this country to fight." Taylor "tremendous on TV"; she calls him.'
      n: '[[w.johnson-white-house-diary]], 359–60 (Lady Bird Johnson''s account). The vote and its day are Mrs. Johnson''s report of Johnson''s words. Made public: 1970. To check: the vote on the SEATO Treaty, Feb. 1, 1955. Names: Johnson, Westmoreland, Ky, Taylor, John Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:nguyen-cao-ky
      - name:taylor-maxwell
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1966-02-20.vietnam-support
      when: Feb. 20
      date: '1966-02-20'
      thread: vietnam-support
      c: 'The White House, dinner: the Bundys, the Cliffords, Mary Margaret Valenti, the Fowlers (a party of nine). Johnson on Vietnam, "about two thirds of what we talk about these days": "There''s not a mother in the world who cares more about it than I do, because I have two hundred thousand of them over there—and they think I am in charge, and if I am not, God help them—who the Hell is!" Mrs. Johnson tells Bundy how sad she is that he is leaving.'
      n: '[[w.johnson-white-house-diary]], 361–62 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Bundy, Clifford, Fowler, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:clifford-clark
      - name:fowler-henry-h
      - name:valenti-jack
- add:
    entry:
      id: cal.1966-02-20.white-house
      when: Feb. 20
      date: '1966-02-20'
      thread: white-house
      c: 'St. Mark''s Church. Leaving, Johnson takes the hand of Coco McPherson, who has come up to him, and of her friend Janice, ten, a Negro member of the choir; they and Mrs. Johnson walk out hand in hand past Helen Thomas and the cameras. Johnson: "if you don''t watch out, she''ll be announcing your wedding." The four ride to the White House; the girls in Johnson''s office, pencils and keepsakes, then the dogs. Harry and Clay McPherson, Bill Baxter and his wife are asked to lunch.'
      n: '[[w.johnson-white-house-diary]], 360–61 (Lady Bird Johnson''s account). Names: Johnson, McPherson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1966-02-25.congress
      when: Feb. 25
      date: '1966-02-25'
      thread: congress
      also:
      - vietnam-congress-armed-services
      c: 'The White House, after 9:30 p.m. Johnson in his small office with Richard Russell. Mrs. Johnson: "Whatever lack of red-hot enthusiasm he may have for the Great Society, when the going is rough and Lyndon needs the advice of an old hand, a wise old hand, Dick Russell will usually be there."'
      n: '[[w.johnson-white-house-diary]], 366 (Lady Bird Johnson''s account). The subject is not given. Names: Johnson, Russell.'
      tags:
      - name:johnson-lyndon-b
      - name:russell-richard-b
- add:
    entry:
      id: cal.1966-02-25.women
      when: Feb. 25
      date: '1966-02-25'
      thread: women
      also:
      - alabama
      - poverty
      c: 'Tuscaloosa, Ala. Mrs. Johnson to the Leadership Conference of Women at the University of Alabama (the American Association of University Women, the State federations of business and professional women''s and of women''s clubs, the League of Women Voters), Frank Rose its host. Robert Shelton, the Klan''s imperial wizard, of Tuscaloosa, had objected to "Pinko tripe"; she arrives a day after Lurleen Wallace''s announcement. Signs: "We support LBJ on Vietnam" and "Draft Lady Bird for Governor of Alabama." Rose has a contract to train Head Start teachers for Alabama and adjoining States; the auditorium is where Wallace and Katzenbach faced each other. A chartered plane of newspaperwomen. The League of Women Voters has set up poll tax booths in supermarkets and school lobbies.'
      n: '[[w.johnson-white-house-diary]], 363–66 (Lady Bird Johnson''s account). See [[cal.1966-02-24.elections-1966]]. Names: Lady Bird Johnson, Lurleen Wallace, George Wallace, Katzenbach.'
      tags:
      - name:johnson-lady-bird
      - name:wallace-lurleen-b
      - name:wallace-george-c
      - name:katzenbach-nicholas
      - state:al
      - city:tuscaloosa
- add:
    entry:
      id: cal.1966-03-03.congress
      when: Mar. 3
      date: '1966-03-03'
      thread: congress
      c: 'The White House, 6:30 to 8:30 p.m. The Congressional Reception, about a thousand guests. At Johnson''s suggestion the Leadership, committee chairmen, Cabinet and some staff are greeted upstairs thirty minutes early; the Leadership photographed in the Lincoln Room with the Johnsons and the Humphreys: Hayden, Kuchel, Dirksen, Mansfield, Boggs, McCormack, Albert, Arends. Dirksen leads the Marine Band in "Danny Boy"; Thurmond brings the Georgia Peach Queen; Morse and Bobby and Teddy Kennedy do not come. Johnson to the newswomen: of some 2,000 votes in ten days "have not been more than 200 votes against any of my bills"; the Economic Aid Bill with less than forty against, the Asian Bank, military aid (the House lost four, the Senate two), the vote on rescinding the President''s power (five), the Tax Bill "130 to nothing."'
      n: '[[w.johnson-white-house-diary]], 368–69 (Lady Bird Johnson''s account). Betty Beale and Dorothy McCardle report Johnson''s words; the tally is as quoted. To check: the Washington Star and the Post of Mar. 4. Names: Johnson, Humphrey, Hayden, Kuchel, Dirksen, Mansfield, Boggs, McCormack, Albert, Arends, Thurmond, Morse, Robert Kennedy, Edward Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:hayden-carl
      - name:kuchel-thomas-h
      - name:dirksen-everett
      - name:mansfield-mike
      - name:boggs-hale
      - name:mccormack-john-w
      - name:albert-carl
      - name:arends-leslie-c
      - name:thurmond-strom
      - name:morse-wayne
      - name:kennedy-robert-f
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1966-03-10.congress
      when: Mar. 10
      date: '1966-03-10'
      thread: congress
      c: The White House, the Yellow Oval Room. Johnson with the Leadership "for several hours"; Mrs. Johnson meets him after 8 going back to his office.
      n: '[[w.johnson-white-house-diary]], 369 (Lady Bird Johnson''s account). The subject and the members are not given. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-03-10.program
      when: Mar. 10
      date: '1966-03-10'
      thread: program
      also:
      - europe-and-the-alliance
      - latin-america-dominican-republic
      c: 'The White House, dinner at 10:50 p.m., with Oveta Hobby and the Jim Cains. Johnson in a "thumbnail sketch": the Guatemala election, the turmoil in the Dominican Republic, de Gaulle''s ultimatums and the tightrope Wilson walks.'
      n: '[[w.johnson-white-house-diary]], 369–70 (Lady Bird Johnson''s account). Names: Johnson, Hobby.'
      tags:
      - name:johnson-lyndon-b
      - name:hobby-oveta-culp
- add:
    entry:
      id: cal.1966-03-10.white-house
      when: Mar. 10
      date: '1966-03-10'
      thread: white-house
      c: 'The White House, about 8:30 a.m. Johnson in his bedroom, drinking cup after cup of tea, with Jacobsen, Valenti, Marvin Watson, Bob Fleming and, "swiftly in and out," Moyers: reports, decisions asked, "yesterday''s triumphs and troubles," the day''s appointments. Mrs. Johnson: "a pattern of intense mental strain."'
      n: '[[w.johnson-white-house-diary]], 369 (Lady Bird Johnson''s account). Mrs. Johnson writes of what happens "these days"; she dates the morning. Names: Johnson, Jacobsen, Valenti, Moyers, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:jacobsen-jake
      - name:valenti-jack
      - name:moyers-bill
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-03-11.vietnam-pacification
      when: Mar. 11
      date: '1966-03-11'
      thread: vietnam-pacification
      c: 'The White House, evening. Johnson to Oveta Hobby and Dr. James Cain, leaving the next morning for Vietnam: a fast inoculation program; "the simple three R''s" in school; "I want to do something about the conditions that have caused this war"; Freeman''s mission, two-hundred-pound hogs for one-hundred-pound; "I want to get out of there more than anybody, including the Marines." The man who has helped most and asked least: Eisenhower. "I''m like a prize fighter in the ring. The right fist is the military, the left fist is aid." The governors come the next day for briefings, forty-six or forty-seven of them.'
      n: '[[w.johnson-white-house-diary]], 370–71 (Lady Bird Johnson''s account). Hobby and Cain were briefed all day. See [[cal.1966-03-12.vietnam-us]]. Made public: 1970. Names: Johnson, Hobby, Freeman, Eisenhower.'
      tags:
      - name:johnson-lyndon-b
      - name:hobby-oveta-culp
      - name:freeman-orville-l
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1966-03-17.congress
      when: Mar. 17
      date: '1966-03-17'
      thread: congress
      c: The White House. Johnson with Mrs. Johnson and the Charles Engelhards celebrates Mansfield's birthday with the Senator and Maureen Mansfield, half an hour.
      n: '[[w.johnson-white-house-diary]], 373 (Lady Bird Johnson''s account). "A short celebration of the Senator''s birthday." Names: Johnson, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
- add:
    entry:
      id: cal.1966-03-17.program
      when: Mar. 17
      date: '1966-03-17'
      thread: program
      c: 'The White House. The National Gallery of Art''s awards to twenty-five teachers of the visual arts, presented by Mrs. Johnson, a gold medal each and $500. John Walker: "At no time in our history have a President and a Congress done so much to create an America in which the arts have their proper place." Winners include Erwin Panofsky, Howard Conant, Wilbur Stilwell of Vermillion, S.D., Mrs. Alvin Bippus of Toledo and Marie Larkin.'
      n: '[[w.johnson-white-house-diary]], 372–73 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:sd
- add:
    entry:
      id: cal.1966-03-17.program-2
      when: Mar. 17
      date: '1966-03-17'
      thread: program
      c: Washington. The twenty-fifth anniversary exhibition of the National Gallery, the Mellon loan of more than two hundred French Impressionists, about nine thousand guests; Mrs. Johnson arrives at 10:20 p.m., the opening set for about 9:30, with the Paul Mellons and John Walker; forty-five minutes of "a purely public show." A toast to Andrew Mellon.
      n: '[[w.johnson-white-house-diary]], 373–74 (Lady Bird Johnson''s account). The Mellon dinner at the Sulgrave Club before it, no press admitted, is passed over. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1966-04-02.conservation
      when: Apr. 2
      date: '1966-04-02'
      thread: conservation
      c: 'Presidio, Tex., and Big Bend National Park. Mrs. Johnson, Udall and about seventy newspeople: 3,500 at the Presidio airport, the Sul Ross band, sombreros for all; lunch at Panther Junction, where she hands George Hartzog a check for a Golden Eagle Park Pass; a two-hour hike on the Lost Mine Trail with Udall; a campfire supper, Joe Frantz on the history of the West.'
      n: '[[w.johnson-white-house-diary]], 376–80 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - state:tx
- add:
    entry:
      id: cal.1966-04-03.conservation
      when: Apr. 3
      date: '1966-04-03'
      thread: conservation
      c: 'Big Bend National Park, Palm Sunday. Mrs. Johnson plants a pinon tree by the new concessions building; an eleven-mile raft trip of over five hours down the Rio Grande through Mariscal Canyon, twenty-four rafts, 139 people. Udall: "You have had a wilderness experience." Dinner at the Rio Grande Village Camp Ground with Nash Castro and Congressman Dick White; Udall gives the press certificates as "Original American Wet-bottoms."'
      n: '[[w.johnson-white-house-diary]], 380–83 (Lady Bird Johnson''s account). See [[cal.1966-04-02.conservation]]. Names: Lady Bird Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - state:tx
- add:
    entry:
      id: cal.1966-04-13.conservation
      when: Apr. 13
      date: '1966-04-13'
      thread: conservation
      c: Hains Point, Washington. Mrs. Johnson plants a tree with Mary Lasker and Laurance Rockefeller and Mrs. Rockefeller.
      n: '[[w.johnson-white-house-diary]], the plates after 406 (unnumbered; the caption, "Tree planting at Hains Point with Mary Lasker and Mr. and Mrs. Laurance Rockefeller, April 13"). Not in the text of the diary. Names: Lady Bird Johnson, Laurance Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-laurance-s
      - city:washington
- add:
    entry:
      id: cal.1966-04-19.democratic-party
      when: Apr. 19
      date: '1966-04-19'
      thread: democratic-party
      c: The White House. Tea for 3,600 Democratic women in Washington for a three-day conference and workshop, in three waves, the first of about 1,200 at 2 p.m. Johnson comes in; they rush him, kissing his face and hand. Photograph of the women on the steps and porch. In the crush an antique lamp in the Red Room and a bust of Henry Clay topple.
      n: '[[w.johnson-white-house-diary]], 383–85 (Lady Bird Johnson''s account). Dorothy McCardle and the United Press are quoted by Mrs. Johnson. To check: the conference, its sponsors and its program. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-06-03.program
      when: June 3
      date: '1966-06-03'
      thread: program
      also:
      - latin-america-dominican-republic
      - space
      - vietnam-elections
      c: 'Air Force One, to the Ranch. Johnson: "It''s been the best week we''ve had in a long time . . . ." Three things, by Mrs. Johnson: a peaceful election in the Dominican Republic; the soft landing of Surveyor on the moon; and the South Vietnamese government''s asking for United Nations supervision of elections.'
      n: '[[w.johnson-white-house-diary]], 386 (Lady Bird Johnson''s account). She writes on June 4 "Yesterday." See [[cal.1966-06-02.space]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-06-04.elections-1966
      when: June 4
      date: '1966-06-04'
      thread: elections-1966
      also:
      - elections-1966
      c: Texas, the Democratic primary runoff. Johnson and Mrs. Johnson vote at the Courthouse a little before 4 p.m.
      n: '[[w.johnson-white-house-diary]], 386 (Lady Bird Johnson''s account). The town is not given. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1966-06-28.conservation
      when: June 28
      date: '1966-06-28'
      thread: conservation
      c: The White House. The Committee for a More Beautiful Capital views Nathaniel Owings's model of the Mall.
      n: '[[w.johnson-white-house-diary]], 390 (Lady Bird Johnson''s account).'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-06-28.conservation-2
      when: June 28
      date: '1966-06-28'
      thread: conservation
      c: 'The White House. An awards ceremony for the beautification of Washington: plaques to winners in three categories, commercial, public and neighborhood. "Using the White House as a podium—hopefully—to thank, to applaud, to advertise, to rally citizens to action in improving our environment."'
      n: '[[w.johnson-white-house-diary]], 390 (Lady Bird Johnson''s account).'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-07-13.program
      when: July 13
      date: '1966-07-13'
      thread: program
      c: Navy Yard, Washington. Johnson at the commissioning of the Oceanographer, the floating laboratory for a six-month world tour; he invites eleven nations, the Soviet Union among them, to put scientists aboard; one aim is marine food. Hornig, the Science Adviser, and the Secretary of Commerce there.
      n: '[[w.johnson-white-house-diary]], 391–92 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at the commissioning, July 13, 1966. Names: Johnson, Hornig.'
      tags:
      - name:johnson-lyndon-b
      - name:hornig-donald-f
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1966-07-13.vietnam-support
      when: July 13
      date: '1966-07-13'
      thread: vietnam-support
      c: The White House, about 10 p.m. Johnson and Prime Minister Holt of Australia come in from a stag dinner for Ambassadors on the Sequoia.
      n: '[[w.johnson-white-house-diary]], 393 (Lady Bird Johnson''s account). Only the dinner and the hour are given. To check: the Prime Minister''s visit. Names: Johnson, Holt.'
      tags:
      - name:johnson-lyndon-b
      - name:holt-harold-e
- add:
    entry:
      id: cal.1966-07-13.white-house
      when: July 13
      date: '1966-07-13'
      thread: white-house
      c: 'The White House, 6:30 p.m., the Truman Balcony. Mrs. Johnson, Bruce Thomas, Nash Castro, Joe Bruno, Liz Carpenter, Mr. West and, later, Marvin Watson on keeping the house open to visitors: 1.8 million in 1964, 1.7 million in 1965; closed eight times and the hours cut ten times in the first half of 1966; guidebook buyers 20 percent in 1964, 16 in 1965, 11 in 1966. To open on Mondays, 8 to 4; tourists to walk the drive when a State luncheon closes the house.'
      n: '[[w.johnson-white-house-diary]], 392–93 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Liz Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
- add:
    entry:
      id: cal.1966-07-20.elections-1968-johnson
      when: July 20
      date: '1966-07-20'
      thread: elections-1968-johnson
      also:
      - program
      c: 'The White House, about 5 a.m. Johnson and Mrs. Johnson, unable to sleep, talk of each of the children, "all the troubles that beset Lyndon and about his future," and of what she wants to do before they leave the house and after: grandchildren, wildflowers, travel, running rivers.'
      n: '[[w.johnson-white-house-diary]], 395 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-07-20.governors
      when: July 20
      date: '1966-07-20'
      thread: governors
      c: 'The White House. Johnson meets members of the Midwest Governors Conference: Branigin of Indiana, Kerner of Illinois, Knowles of Wisconsin, Rhodes of Ohio.'
      n: '[[w.johnson-white-house-diary]], 396 (Lady Bird Johnson''s account). Names: Johnson, Branigin, Kerner, Knowles, Rhodes.'
      tags:
      - name:johnson-lyndon-b
      - name:branigin-roger-d
      - name:kerner-otto
      - name:knowles-warren-p
      - name:rhodes-james-a
- add:
    entry:
      id: cal.1966-07-20.latin-america
      when: July 20
      date: '1966-07-20'
      thread: latin-america
      c: The White House. Johnson's stag luncheon for President René Barrientos of Bolivia.
      n: '[[w.johnson-white-house-diary]], 396 (Lady Bird Johnson''s account). Names: Johnson, Barrientos.'
      tags:
      - name:johnson-lyndon-b
      - name:barrientos-ortuno-rene
- add:
    entry:
      id: cal.1966-07-20.program
      when: July 20
      date: '1966-07-20'
      thread: program
      c: The White House. Johnson meets sub-Cabinet officers of the AEC, AID, the Export-Import Bank, NASA, the USIA and the Arms Control and Disarmament Agency.
      n: '[[w.johnson-white-house-diary]], 396 (Lady Bird Johnson''s account). The subjects are not given. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-07-20.war-opposition
      when: July 20
      date: '1966-07-20'
      thread: war-opposition
      also:
      - civil-rights-organizations
      c: 'The White House. Mrs. Johnson with Inspector Glenard Lanier, Agent Bill Duncan, Milton Semer and Bess on parking for seven hundred wedding guests on Aug. 6: a peace organization has asked the National Park Service for a permit to picket in Lafayette Park that afternoon (to have it from 6 p.m. if it insists); another group has marched at the White House fence with banners since July 19; SNCC, led by Stokely Carmichael, "I think," means to picket near the Shrine. Guests to park at the Ellipse and enter by the Treasury.'
      n: '[[w.johnson-white-house-diary]], 395–96 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-07-23.conservation
      when: July 23
      date: '1966-07-23'
      thread: conservation
      c: 'Jeffersonville, Ind. Johnson presents a beautification award to the Post Office, his ninth speech of the day, near 10 p.m., an hour late; he throws the text aside: "It may be old-fashioned, but I still believe that my country does most things right." Mrs. Johnson''s note: "Great speech—but time to stop."'
      n: '[[w.johnson-white-house-diary]], 398 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - state:in
- add:
    entry:
      id: cal.1966-07-23.vietnam-support
      when: July 23
      date: '1966-07-23'
      thread: vietnam-support
      c: Johnson dedicates the AMVETS Building; Speaker McCormack and Mrs. Johnson unveil a bronze bust of him. Then Air Force One, with Yarborough and, through the day, Governors Branigin, Kerner and Breathitt and Senators Bayh, Hartke, Cooper, Morton and Douglas, to Indiana, Kentucky and Illinois.
      n: '[[w.johnson-white-house-diary]], 396–97 (Lady Bird Johnson''s account). Mrs. Johnson says "in the morning." Names: Johnson, McCormack, Yarborough, Branigin, Kerner.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:yarborough-ralph
      - name:branigin-roger-d
      - name:kerner-otto
- add:
    entry:
      id: cal.1966-07-23.vietnam-support-2
      when: July 23
      date: '1966-07-23'
      thread: vietnam-support
      c: Fort Campbell, Ky. Johnson awards medals to twenty-two veterans of the 101st Division home from Vietnam, sees captured weapons, and speaks as Commander in Chief; a simulated helicopter attack.
      n: '[[w.johnson-white-house-diary]], 397 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at Fort Campbell, July 23, 1966. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:ky
- add:
    entry:
      id: cal.1966-07-23.vietnam-support-3
      when: July 23
      date: '1966-07-23'
      thread: vietnam-support
      c: 'George Rogers Clark National Historical Park, Vincennes, Ind. Johnson to forty thousand on Vietnam: "Stop, look, and listen as you hear the voices talking about what''s wrong with your country." He had not heard many commentators lecture the enemy on the North Vietnamese bombing of hospitals for American servicemen in South Vietnam.'
      n: '[[w.johnson-white-house-diary]], 398 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at Vincennes, July 23, 1966. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:in
- add:
    entry:
      id: cal.1966-07-23.vietnam-support-4
      when: July 23
      date: '1966-07-23'
      thread: vietnam-support
      c: 'Lawrenceville, Ill.: an airport rally, thousands of people, "in this heartland of America that''s not supposed to be our territory." One sign, "President Goldwater." Then Vincennes, and an airport rally at Louisville, Ky.'
      n: '[[w.johnson-white-house-diary]], 397–98 (Lady Bird Johnson''s account). Mrs. Johnson says "I believe" of the sign.'
      tags:
      - name:johnson-lyndon-b
      - state:il
      - state:ky
- add:
    entry:
      id: cal.1966-08-01.jobs-and-wages-airlines
      when: Aug. 1
      date: '1966-08-01'
      thread: jobs-and-wages-airlines
      c: 'The White House. The settlement of the airline strike, celebrated Friday, "came unglued Sunday." Evening, Johnson with Califano; legislation on the Hill "had gone very badly"; Congress, determined to do something, will direct the President to "use his discretion" to end the strike, leaving him to sign or veto. Mrs. Johnson: "a sharp and skillful knife to insert between the President and Labor."'
      n: '[[w.johnson-white-house-diary]], 400, 402 (Lady Bird Johnson''s account). See [[cal.1966-07-31.jobs-and-wages-airlines]]. Names: Johnson, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
- add:
    entry:
      id: cal.1966-08-02.middle-east
      when: Aug. 2
      date: '1966-08-02'
      thread: middle-east
      c: The White House. State Dinner for President Zalman Shazar of Israel and Mrs. Shazar, 190 guests; Rudolf Serkin plays. The Shazars arrive at the front Portico a few minutes before 8, as the bridesmaids' fittings go on in the house.
      n: '[[w.johnson-white-house-diary]], 402–04 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at the arrival and the toasts, Aug. 2, 1966.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-08-20.conservation
      when: Aug. 20
      date: '1966-08-20'
      thread: conservation
      c: 'Burlington, Vt. Governor Hoff meets Johnson; helicopters to a tri-town water system, financed by Vermont and the Agriculture Department, the first of its kind, Senator Aiken''s project, which he asked Johnson to dedicate. At Battery Park Johnson on beautification and conservation: "we are going to retain that splendor in America."'
      n: '[[w.johnson-white-house-diary]], 413–14 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at Burlington, Aug. 20, 1966. Names: Johnson, Hoff, Aiken.'
      tags:
      - name:johnson-lyndon-b
      - name:hoff-philip-h
      - name:aiken-george-d
      - state:vt
      - city:burlington
- add:
    entry:
      id: cal.1966-08-20.economy
      when: Aug. 20
      date: '1966-08-20'
      thread: economy
      c: 'Lewiston, Me., City Park. Johnson on inflation: what America needs is "a strong dose of self-discipline." Margaret Chase Smith beside Mrs. Johnson in the motorcade; Muskie with Johnson.'
      n: '[[w.johnson-white-house-diary]], 414 (Lady Bird Johnson''s account). The words in quotation marks are Mrs. Johnson''s. To check: the Public Papers, remarks at Lewiston, Aug. 20, 1966. Names: Johnson, Margaret Chase Smith, Muskie.'
      tags:
      - name:johnson-lyndon-b
      - name:smith-margaret-chase
      - name:muskie-edmund-s
      - state:me
      - city:lewiston
- add:
    entry:
      id: cal.1966-08-20.program
      when: Aug. 20
      date: '1966-08-20'
      thread: program
      c: Portland, Me. At the State Pier at 8, an hour and a half late, Johnson boards the USS Northampton and invites all the Senators and Governors of the day aboard for dinner; Mrs. Johnson and James Symington send the invitations and seat two long tables; lobster.
      n: '[[w.johnson-white-house-diary]], 414 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - state:me
      - city:portland
- add:
    entry:
      id: cal.1966-08-20.vietnam-support
      when: Aug. 20
      date: '1966-08-20'
      thread: vietnam-support
      c: 'Manchester, N.H. Johnson to the Navy League''s luncheon on Vietnam: "Perhaps it reflects poorly on our world that men must fight limited wars in order to keep from fighting larger wars; but that may be the condition that exists today." He introduces a young soldier back wounded.'
      n: '[[w.johnson-white-house-diary]], 413 (Lady Bird Johnson''s account). To check: the Public Papers, remarks to the Navy League, Aug. 20, 1966. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:nh
- add:
    entry:
      id: cal.1966-08-27.press-and-broadcasting
      when: Aug. 27
      date: '1966-08-27'
      thread: press-and-broadcasting
      c: LBJ Ranch, Johnson's fifty-eighth birthday. The press from San Antonio, marooned in the hangar by rain, is brought into the house; Johnson, in his chair, talks nearly an hour, "a purely Johnsonian performance," counting his blessings, chiefly the "opportunity (he) never had before of waging war on the enemies of mankind—poverty, ignorance, disease, ugliness—and waging it with some success."
      n: '[[w.johnson-white-house-diary]], 415–16 (Lady Bird Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1966-09-01.economy-investment-credit
      when: Sept. 1
      date: '1966-09-01'
      thread: economy-investment-credit
      c: 'A New York Times story with details of a proposed tax measure, including removal of the 7 percent tax credit for plant expansion. Mrs. Johnson: the details "were known to only two or three people. How did they get in the paper?"'
      n: '[[w.johnson-white-house-diary]], 417 (Lady Bird Johnson''s account). See [[cal.1966-08-30.economy-investment-credit]], [[cal.1966-09-02.economy-investment-credit]]. To check: the Times of Sept. 1, 1966. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-09-01.economy-investment-credit-2
      when: Sept. 1
      date: '1966-09-01'
      thread: economy-investment-credit
      c: 'The White House, near 11 p.m. Johnson in his office with about a half-dozen men, Carl Albert, "looking very weary," and Califano among them. Albert: he "didn''t see how Lyndon could do it." Mrs. Johnson gets Albert, Califano and Johnson to sit down to supper just before midnight.'
      n: '[[w.johnson-white-house-diary]], 418 (Lady Bird Johnson''s account). Albert, the Majority Leader, is named; the others are not. Names: Johnson, Albert, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:albert-carl
      - name:califano-joseph-a-jr
- add:
    entry:
      id: cal.1966-09-05.elections-1966
      when: Sept. 5
      date: '1966-09-05'
      thread: elections-1966
      also:
      - vietnam-support
      c: Dayton, Ohio, the Montgomery County Fair Grounds, a week after racial unrest that called out the Guard. Governor Rhodes, Congressman Rodney Love and Senator Frank Lausche with Johnson. He speaks on youth and public service; a banner, "Thou Shalt Not Kill," about thirty-five in the group, scuffling, police link arms.
      n: '[[w.johnson-white-house-diary]], 420 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at Dayton, Sept. 5, 1966. Names: Johnson, Rhodes, Lausche.'
      tags:
      - name:johnson-lyndon-b
      - name:rhodes-james-a
      - name:lausche-frank-j
      - state:oh
      - city:dayton
- add:
    entry:
      id: cal.1966-09-05.elections-1966-2
      when: Sept. 5
      date: '1966-09-05'
      thread: elections-1966
      c: 'Lancaster, Ohio, Fairfield County Fair Grounds. Johnson, two hours late, stops fourteen times on the way from Columbus, speaking on a bull horn; twenty-six school bands; the Congressman''s wife, Mrs. Walter Moeller. A newsman: "If crossroads Ohio were his meat, Lancaster was the President''s triumph."'
      n: '[[w.johnson-white-house-diary]], 420–21 (Lady Bird Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:oh
      - city:lancaster
- add:
    entry:
      id: cal.1966-09-05.health
      when: Sept. 5
      date: '1966-09-05'
      thread: health
      c: 'Battle Creek, Mich. Johnson at the Battle Creek Sanitarium''s centennial: the health achievements of the Administration and the hope of giving the world the medical knowledge accumulated; praise of the freshman Congressman Paul Todd, no plea to elect him. Sixty-five thousand estimated along the way.'
      n: '[[w.johnson-white-house-diary]], 419–20 (Lady Bird Johnson''s account). To check: the Public Papers, remarks at Battle Creek, Sept. 5, 1966. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:mi
      - city:battle-creek
- add:
    entry:
      id: cal.1966-09-05.vietnam-support
      when: Sept. 5
      date: '1966-09-05'
      thread: vietnam-support
      c: 'Detroit, Cobo Hall, Labor Day, some five thousand. Governor Romney meets Johnson at the airport. A heckler: "Let''s settle the war in Vietnam!" Johnson, off his text: "If anyone will show me the time schedule when aggression and infiltration and ''might makes right'' will be halted, then I, as President of this country, will lay on the table the schedule for the withdrawal of all of our forces from Vietnam." The hall rises. No parade; "almost no blue shirts."'
      n: '[[w.johnson-white-house-diary]], 418–19 (Lady Bird Johnson''s account). To check: the Public Papers, Labor Day remarks at Detroit, Sept. 5, 1966. Names: Johnson, Romney.'
      tags:
      - name:johnson-lyndon-b
      - name:romney-george-w
      - state:mi
      - city:detroit
- add:
    entry:
      id: cal.1966-09-07.soviet-union
      when: Sept. 7
      date: '1966-09-07'
      thread: soviet-union
      also:
      - program
      c: 'The White House, the East Room. Reception for the winners of the Tschaikovsky Competition, the thirteen winners'' parents invited. Johnson, the spotlight failing, in the dark: they are "a national treasure." Van Cliburn master of ceremonies; Jane Marsh first prize. Alexander Zinchuk, the Soviet Embassy''s Minister Counselor, in the front row, the Dobrynins in Moscow. Steinbeck in the line.'
      n: '[[w.johnson-white-house-diary]], 421–23 (Lady Bird Johnson''s account). Names: Johnson, Dobrynin.'
      tags:
      - name:johnson-lyndon-b
      - name:dobrynin-anatoly
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-09-20.conservation
      when: Sept. 20
      date: '1966-09-20'
      thread: conservation
      c: Point Reyes, Cal. Mrs. Johnson dedicates the Point Reyes National Seashore.
      n: '[[w.johnson-white-house-diary]], 423 (Lady Bird Johnson''s account). Only the Sept. 21 entry says "Yesterday." To check: the Public Papers, remarks at Point Reyes, Sept. 20, 1966. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:ca
- add:
    entry:
      id: cal.1966-09-21.conservation
      when: Sept. 21
      date: '1966-09-21'
      thread: conservation
      c: 'Monterey, Cal., Colton Hall. Mrs. Johnson with Governor Brown, Senator Fred Farr and the Mayor, Minnie Coyle: "conservation, beautification, call it what you will, is more than just one tree, or one historic building, or one scenic highway. It is a frame of reference, a way of life." She plants a chestnut seedling carried from the East. Earlier, Mrs. Brown on the Governor''s Committee on Beautification, four days by bus.'
      n: '[[w.johnson-white-house-diary]], 423–25 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Edmund Brown.'
      tags:
      - name:johnson-lady-bird
      - name:brown-edmund-g
      - state:ca
      - city:monterey
- add:
    entry:
      id: cal.1966-09-21.conservation-2
      when: Sept. 21
      date: '1966-09-21'
      thread: conservation
      c: Hurricane Point, Big Sur, Cal. Mrs. Johnson dedicates the Big Sur Scenic Highway; Governor Brown, Senator Farr, Nathaniel Owings and she speak; a plaque with Robinson Jeffers's lines. Liz Carpenter holds the photographers back.
      n: '[[w.johnson-white-house-diary]], 425 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Edmund Brown, Liz Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:brown-edmund-g
      - name:carpenter-liz
      - state:ca
- add:
    entry:
      id: cal.1966-09-21.conservation-3
      when: Sept. 21
      date: '1966-09-21'
      thread: conservation
      c: 'San Simeon, Cal., Hearst Castle, now a State park. Mrs. Johnson and Governor Brown and Mrs. Brown receive three or four hundred guests at the Neptune Pool: conservationists, museum directors, college presidents, Pulitzer winners, movie stars, businessmen, Hearsts; a barbecue; Danny Kaye master of ceremonies, gibes at Udall.'
      n: '[[w.johnson-white-house-diary]], 426–27 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Edmund Brown, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:brown-edmund-g
      - name:udall-stewart-l
      - state:ca
- add:
    entry:
      id: cal.1966-09-23.poverty
      when: Sept. 23
      date: '1966-09-23'
      thread: poverty
      c: San Ildefonso Pueblo, N.M., with Udall. Head Start children being fed in one home; the studio of Maria and her son Popovi Da, black-on-black pottery. Then the Sangre de Cristo Mountains for the aspens; the Ranch by mid-afternoon.
      n: '[[w.johnson-white-house-diary]], 427–28 (Lady Bird Johnson''s account). Names: Udall.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - state:nm
- add:
    entry:
      id: cal.1966-10-25.vietnam-asian-trip-2
      when: Oct. 25
      date: '1966-10-25'
      thread: vietnam-asian-trip
      c: 'Manila. The First Ladies of the conference, Mrs. Marcos, Madame Kỳ, Mrs. Holt and Mrs. Johnson, tour the city by bus: Luneta Park, the Intramuros restoration, St. Augustine Church, the Santa Ana dig. Mrs. Marcos gives each a mahogany chest of handicrafts. Bamboo screening along the streets; signs reading "Fierce Vultures" and "Wolves."'
      n: '[[w.johnson-white-house-diary]], 432–34 (Lady Bird Johnson''s account). The Philippines'' press "the freest and the most aggressive I''ve ever seen." Names: Lady Bird Johnson, Marcos, Holt.'
      tags:
      - name:johnson-lady-bird
      - name:marcos-ferdinand-e
      - name:holt-harold-e
      - city:manila
- add:
    entry:
      id: cal.1966-10-25.vietnam-asian-trip-3
      when: Oct. 25
      date: '1966-10-25'
      thread: vietnam-asian-trip
      c: Manila, Malacañang Palace, evening. The Barrio Fiesta ends the conference. The "Summit Conference Pact" was completed late in the afternoon; the fiesta late because the men finished their communiqué so late; at the banquet table several Chiefs of State add their signatures to the final document. Johnson drives a tilbury; three thousand guests; a crown of flowers for each Chief of State.
      n: '[[w.johnson-white-house-diary]], 434–35 (Lady Bird Johnson''s account). The diary calls the document the "Summit Conference Pact" and the "final document." See [[cal.1966-10-24.vietnam-asian-trip]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-10-27.succession
      when: Oct. 27
      date: '1966-10-27'
      thread: succession
      c: 'Manila, the morning, before leaving. Dr. Burkley''s telephone call to Dr. James Cain, who has talked with the throat specialists and Willis Hurst: the general feeling is that Johnson should go ahead with the operation to remove the growth in his throat and repair the incisional hernia from the gall bladder operation. Cain and probably the others to come to Washington when the party returns and set the time, after a week or so of rest.'
      n: '[[w.johnson-white-house-diary]], 436 (Lady Bird Johnson''s account). Mrs. Johnson writes "Jim Gain" for Cain. To check: the operation''s date and the doctors'' account. Names: Burkley, Hurst, Johnson.'
      tags:
      - name:burkley-george-g
      - name:hurst-e-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-11-17.economy
      when: Nov. 17
      date: '1966-11-17'
      thread: economy
      c: 'Bethesda Naval Hospital. Johnson in bed meets the "big four" of fiscal and budgetary matters: Fowler, Schultze, Okun and William McChesney Martin.'
      n: '[[w.johnson-white-house-diary]], 454 (Lady Bird Johnson''s account). The subjects are not given. Names: Johnson, Fowler, Schultze, Okun, Martin.'
      tags:
      - name:johnson-lyndon-b
      - name:fowler-henry-h
      - name:schultze-charles-l
      - name:okun-arthur-m
      - name:martin-william-mcchesney-jr
- add:
    entry:
      id: cal.1966-11-17.press-and-broadcasting
      when: Nov. 17
      date: '1966-11-17'
      thread: press-and-broadcasting
      c: 'Bethesda Naval Hospital, the big conference room, the Johnsons'' thirty-second wedding anniversary. A cake from the White House kitchen reading "32 happy years," newswomen (Helen Thomas, Frances Lewine, Isabelle Shelton, Nancy Dickerson and others), a dozen photographers, staff and the Humphreys. Humphrey proposes a toast in coffee; Dickerson answers for the press. Johnson refuses cake: "Make mine tapioca."'
      n: '[[w.johnson-white-house-diary]], 454–55 (Lady Bird Johnson''s account). Names: Johnson, Humphrey.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1966-11-17.succession
      when: Nov. 17
      date: '1966-11-17'
      thread: succession
      c: Bethesda Naval Hospital. Eisenhower visits Johnson, forty-five minutes. Later Carl Albert, recuperating from his heart attack of September, comes to see him.
      n: '[[w.johnson-white-house-diary]], 454 (Lady Bird Johnson''s account). "Maintained a brisk pace," the paper said of Johnson. Names: Eisenhower, Johnson, Albert.'
      tags:
      - name:eisenhower-dwight-d
      - name:johnson-lyndon-b
      - name:albert-carl
- add:
    entry:
      id: cal.1966-11-28.white-house
      when: Nov. 28
      date: '1966-11-28'
      thread: white-house
      c: 'The White House, the East Room. Mrs. Johnson launches *The Living White House*: Melville Bell Grosvenor of the National Geographic Society and David Finley of the White House Historical Association speak; Bruce Catton wrote the foreword. Descendants of Presidents in the receiving line with Mrs. Eisenhower: Grant, Harrison, Taft, Cleveland, Madison and Monroe, Roosevelt; veteran reporters Bob Allen, Gould Lincoln and Bill White.'
      n: '[[w.johnson-white-house-diary]], 455–58 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Eisenhower.'
      tags:
      - name:johnson-lady-bird
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1966-12-01.conservation
      when: Dec. 1
      date: '1966-12-01'
      thread: conservation
      c: New York. Mrs. Johnson, a couple of hours on beautification planning with Laurance Rockefeller, Mary Lasker and other fellow workers.
      n: '[[w.johnson-white-house-diary]], 458 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Laurance Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-laurance-s
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1966-12-01.program
      when: Dec. 1
      date: '1966-12-01'
      thread: program
      c: New York, the Plaza. The National Institute of Social Sciences' awards dinner, for distinguished service to humanity, to Mrs. Johnson, Keith Funston, David Sarnoff, Danny Kaye and Cardinal Spellman. She tells of Sputnik in October 1957 and the Gemini awards in her front yard, 430 satellites in orbit. Spellman to go to Vietnam in two weeks for Christmas.
      n: '[[w.johnson-white-house-diary]], 458–60 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Spellman.'
      tags:
      - name:johnson-lady-bird
      - name:spellman-francis
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1966-12-13.program
      when: Dec. 13
      date: '1966-12-13'
      thread: program
      c: 'The White House, a snowstorm. The Christmas dinner for the National Council on the Arts, twenty-six members, outgoing and incoming. Johnson''s toast: he wants American art enjoyed "at the grass-roots level," as by "the top-hat crowd." Mrs. Johnson sums up the Council''s work: new life in community theaters, sixteen professional theaters, touring dance, opera and ballet groups. Gregory Peck introduces the APA Repertory Company.'
      n: '[[w.johnson-white-house-diary]], 460–62 (Lady Bird Johnson''s account). Johnson''s words as Mrs. Johnson gives them. To check: the Public Papers, the toast, Dec. 13, 1966. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1966-12-16.vietnam-diplomacy
      when: Dec. 16
      date: '1966-12-16'
      thread: vietnam-diplomacy
      also:
      - vietnam-support
      c: 'The White House, the evening of the Johnsons'' departure for Texas at about 9. Johnson "in serious talk" with Lodge, McNamara, Goldberg, Harriman and the Vice President, whom he brings over from the office. McNamara leaves first: "Margy is waiting for me." The rest dine. Johnson misses the Children''s Party, for the first time: "a barometer of how serious is the mood."'
      n: '[[w.johnson-white-house-diary]], 463–64 (Lady Bird Johnson''s account). The subject is not given. Names: Johnson, Lodge, McNamara, Goldberg, Harriman, Humphrey.'
      tags:
      - name:johnson-lyndon-b
      - name:lodge-henry-cabot
      - name:mcnamara-robert-s
      - name:goldberg-arthur-j
      - name:harriman-w-averell
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1966-12-24.vietnam-support
      when: Dec. 24
      date: '1966-12-24'
      thread: vietnam-support
      c: 'Kelly Air Force Base, San Antonio. Johnson, with Mrs. Johnson, Lynda, Jake Jacobsen and Dr. Burkley, meets an ambulance plane with twenty evacuees from Vietnam, wounded; Congressman Henry Gonzalez there. He goes aboard. A mother: "We just heard last night that he had been hit"; Pfc. Alex Hudson III. The small crowd applauds.'
      n: '[[w.johnson-white-house-diary]], 464–65 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Gonzalez, Jacobsen, Burkley.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:gonzalez-henry-b
      - name:jacobsen-jake
      - name:burkley-george-g
      - state:tx
      - city:san-antonio
- cite:
    id: cal.1966-01.steel
    item: '[[w.johnson-white-house-diary]], 347–48 (Jan. 5, noon: "the papers reported that the steel companies had settled for $2.75 instead of the $5.00 they had demanded"; the diary names neither company nor product; it dates the report, not the settlement)'
    units: '?'
- cite:
    id: cal.1966-01-12.program
    item: '[[w.johnson-white-house-diary]], 351–52 (Mrs. Johnson in the gallery: four-year terms for the House; aid to nations controlling population growth, "the first time a President has declared himself on the birth control issue"; "We must change to master change"; "three hundred private talks for peace in Vietnam" in 1965, no bombs "for twenty days"; about fifty-seven applauses; "almost no participation by the Republicans"; no approval from Russell or McClellan, "scant occasional expression" from Mansfield; she meets Johnson in the Speaker''s office afterward; not the hour or the text beyond these)'
    units: '?'
- cite:
    id: cal.1966-01-17.cities-and-housing
    item: '[[w.johnson-white-house-diary]], 352–53 (Jan. 18, 10 a.m., the East Room: the swearing in of Weaver, "the first Negro member of a President''s Cabinet," and Wood; Roy Wilkins, James Nabrit, Whitney Young, Walter Washington and Louie Martin present; coffee upstairs with the Weavers, the Woods, Young and Martin afterward)'
    units: '?'
- cite:
    id: cal.1966-02-06.vietnam
    item: '[[w.johnson-white-house-diary]], 358–59 (Feb. 5, noon, the Diplomatic Reception Room: Johnson leaves for Hawaii to meet Thieu, Kỳ, the Ambassador and Westmoreland on "the non-military side of pacification and economic development"; Katherine Westmoreland, the General''s daughter, flies out with him; not the arrival)'
    units: '?'
- cite:
    id: cal.1966-02-20.vietnam-2
    item: '[[w.johnson-white-house-diary]], 361 (Bundy on television "precise, razor sharp"; his quotations from President Kennedy on similar situations in Communist-infiltrated countries, against Senator Kennedy''s "espousal of the Viet Cong being included in a coalition government, before and not as the result of an election"; the Johnsons ask the Bundys, the Cliffords and Mary Margaret Valenti to dinner)'
    units: '?'
- cite:
    id: cal.1966-03-12.vietnam-us
    item: '[[w.johnson-white-house-diary]], 371 (Mar. 11 evening: Johnson to say "about forty-six or forty-seven of the Governors coming for all-day briefings"; the diary does not give the resolution)'
    units: '?'
- cite:
    id: cal.1966-03-12.press-and-broadcasting
    item: '[[w.johnson-white-house-diary]], 371 (Mar. 13: Johnson "made a surprise visit the night before to the Gridiron Dinner")'
    units: '?'
- cite:
    id: cal.1966-03-13.vietnam
    item: '[[w.johnson-white-house-diary]], 371–72 (Nixon in Johnson''s bedroom when Mrs. Johnson brings coffee, Johnson in pajamas drinking tea; Johnson names as outstanding military men Westmoreland, Goodpaster and Abrams; Nixon for the most part "in strong support"; the Chinese cautious, any discussion with China "should come now, rather than later"; leaving: "Mr. President, you know this is campaign year ... there won''t be anything personal about you in what I say about the Democratic Administration")'
    units: '?'
- cite:
    id: cal.1966-03-28.india-and-china
    item: '[[w.johnson-white-house-diary]], 374–76 (the South Lawn, about 11 a.m.: Johnson greets Mrs. Gandhi as "the leader of our sister democracy"; she warns the two nations "could not take each other for granted or allow our relations to drift"; the State Dinner, Johnson''s toast quoting her father; her reply, quoting him, on poverty as "our major problem"; the exchange of gifts in the Yellow Room; at dinner the remark to Mrs. Johnson, "Your husband is a passionate man," which the page gives to "Nehru")'
    units: '?'
- cite:
    id: cal.1966-06-04.opinion
    item: '[[w.johnson-white-house-diary]], 388–89 (June 13, Mrs. Johnson quoting the Gallup headline "President''s Standing Lowest in Thirty Months": approve 46 percent, 54 in May; disapprove up one point; no opinion 20 percent, 13 in May; Eisenhower''s low 49, Truman''s 23; she dates her note June 13, not the release, and gives no question or fieldwork)'
    units: '?'
- cite:
    id: cal.1966-06-28.vietnam-congress-4
    item: '[[w.johnson-white-house-diary]], 390–91 (Marvin Watson brings Russell to the house; "a quiet dinner, just Lyndon and Dick and I"; two hours on "the military future of the country," the Senate "and its problems and personalities and new faces"; she asks no questions and takes the decision to be "to bomb the enemy''s fuel depots," her inference; the Meredith march and Carmichael are not mentioned)'
    units: '?'
- cite:
    id: cal.1966-06-29.vietnam-air-war
    item: '[[w.johnson-white-house-diary]], 391 (after Russell leaves Johnson asks Luci for a Catholic church that is open; the monks'' church in the southwest of the city, a Brother lets them in; "Nobody at all knew"; the diary has no hour and does not name the church)'
    units: '?'
- cite:
    id: cal.1966-07-20.vietnam-prisoners
    item: '[[w.johnson-white-house-diary]], 396 (Mrs. Johnson in the front row; "full dress with television"; "hit-and-miss" on Vietnam and inflation; the Women''s Wear Daily reporter asks whether it is unfair that his paper is barred from the wedding; Johnson would "step aside" from discussing arrangements)'
    units: '?'
- cite:
    id: cal.1966-07-23.vietnam-2
    item: '[[w.johnson-white-house-diary]], 397 (the Soldiers and Sailors Monument, some forty-two thousand in the circle; signs "We love Luci," "We are backing you on Vietnam," "We have a date in ''68," "Vance speaks for us"; not the words)'
    units: '?'
- cite:
    id: cal.1966-07-23.civil-disorders
    item: '[[w.johnson-white-house-diary]], 397, 398–99 (the Indianapolis Athletic Club, a stag luncheon for about 475 men hosted by Eugene Pulliam; "the most important speech of the day ... that riots must stop"; the account of the speech as Mrs. Johnson heard it on the plane: they "start a chain reaction," "do not bring about lasting reforms," "make reform more difficult"; not the sentences quoted in the entry; Mrs. Branigin''s luncheon for ladies and the Paul Revere bowl for Luci)'
    units: '?'
- cite:
    id: cal.1966-08-06.war-opposition-2
    item: '[[w.johnson-white-house-diary]], 409 (leaving the church, "I myself did not see the pickets. I understand they were there somewhere"; the press and television on the Portico for the photographs)'
    units: '?'
- cite:
    id: cal.1966-08-06.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 407 (Johnson gives Luci to Pat at the foot of the altar steps; Humphrey not mentioned; the ceremony "longer than an hour," Bess Abell: he never looked at his watch; Hale Boggs reads the epistle, 408; Archbishop O''Boyle reads Pope Paul''s telegram, 408)'
    units: '?'
- cite:
    id: cal.1966-08-20.open-housing-2
    item: '[[w.johnson-white-house-diary]], 411–12 (Rhode Island University, Kingston: a good speech on restraint in civil rights demonstrations, the Molotov cocktail "destroys far more than the police car or pawn shop"; "no one needs the law more than they"; no "magic sword" to cut the chain of poverty; demonstrators in the quadrangle with "Stop Escalation"; not the quotation in the entry)'
    units: '?'
- cite:
    id: cal.1966-08-31.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 417 (Sept. 1, the morning headlines: "Democratic Policy Committee Recommends Moving Troops Out of Europe," "apparently the decision was unanimous," Russell, Long and Mansfield among the members; Mrs. Johnson: "playing poker with a serious adversary and showing him your hand before you begin betting"; the diary does not name S. Res. 300)'
    units: '?'
- cite:
    id: cal.1966-09-21.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 428 (Sept. 23, on what she learns at the Ranch of "a busy four days": Johnson had appointed Katzenbach to the number two place at State, Ball''s, Eugene Rostow the number three and Foy Kohler the number four; not the day, not the news conference)'
    units: '?'
- cite:
    id: cal.1966-10-06.cities-and-housing
    item: '[[w.johnson-white-house-diary]], 428–29 (the East Room, 3 p.m., Mrs. Johnson in the front row; Johnson announces Linowitz Ambassador to the OAS, Llewellyn Thompson to the Soviet Union and Bunker to the government of Vietnam, and the trip leaving Oct. 17, seventeen days and twenty-five thousand miles to New Zealand, Australia, the Philippines, Thailand, Malaysia and South Korea with a refueling stop in Alaska, "the important business" the Manila Conference of all nations involved militarily in Vietnam, Mrs. Johnson to go along; questions on the conservative candidates in the South, the stock market, the Cities Bill and rioting in the streets, "not primarily concerned with the trip"; Johnson on the Great Society: "approximately ninety bills" recommended, "about seventy-five" through both Houses, "another ten" in the next ten days, "eighty-five bills out of ninety ... a pretty good box score")'
    units: '?'
- cite:
    id: cal.1966-10-17.vietnam
    item: '[[w.johnson-white-house-diary]], the plates after 406 (unnumbered captions: "The President and First Lady arrive in New Zealand for first leg of Far East trip, October 17–November 2"; "Toasting with a native chief in Pago Pago, October 18")'
    units: '?'
- cite:
    id: cal.1966-10-24.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 434 (Oct. 25: the six Chiefs of State, Holt, Holyoake, Thanom, Park, Johnson and Marcos, "closeted in Malacanang Palace discussing all the military, civil, and diplomatic dimensions of Vietnam and hammering out a statement" while the wives toured; not the order of business)'
    units: '?'
- cite:
    id: cal.1966-10-28.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 436–37, 439–42 (the entry says to check the day of arrival: Oct. 27, "about noon" from Manila, a three-hour flight to U Ta Pao, Prime Minister Thanom and Ambassador Martin; F-105s on each wing; helicopter forty miles to Bang Saen; Oct. 29 in Bangkok, Chulalongkorn University''s honorary degree for Johnson from the King, his appeal to Hanoi''s leaders, and his signing of the International Education Act, "the first time any American legislation has ever been signed on foreign soil," as she was told; Thanom''s reception; the banquet for the King and Queen, Johnson''s toast on King Mongkut''s offer of elephants to Lincoln, Stan Getz)'
    units: '?'
- cite:
    id: cal.1966-10-30.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 442–46 (Sunday, Oct. 30: arrival at Kuala Lumpur at 9:45 a.m., the King and the Tunku; a twenty-one-gun salute; Johnson on Malaysia''s struggle against the guerrillas; the palace call; the Tunku''s dinner in the Parliament Building; a demonstration in which Chinese youths tore down American flags and "one had been shot by the police and killed," as Mrs. Johnson heard it later)'
    units: '?'
- cite:
    id: cal.1966-11-01.vietnam
    item: '[[w.johnson-white-house-diary]], 446–53 (Oct. 31: arrival in Seoul at about 3 p.m., Park at the foot of the steps, 350,000 estimated at City Hall Plaza, the Golden Key; Johnson: "To an American, the free soil of Korea is hallowed ground"; State Dinner at the Capitol after the Blue House; Nov. 2: the National Cemetery, the National Assembly, "I leave today with a deep sense of confidence in the future of Asia and the Pacific"; the diary puts the Assembly on Nov. 2, the entry on Nov. 1, and has no entry for Nov. 1)'
    units: '?'
- check:
    id: cal.1966-11-01.vietnam
    text: 'Check: Lady Bird Johnson, 451–52, puts Johnson''s address to the National Assembly on the morning of Nov. 2 (after the National Cemetery, before the Blue House coffee and Kimpo); the entry has it with Nov. 1–2. Whether the address was Nov. 1 or Nov. 2.'
- cite:
    id: cal.1966-11-02.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 453 (landing at Dulles at 8 p.m. "on a windy, wet evening," after a night in Alaska and the dateline, "another November 2"; the Cabinet, the Diplomatic Corps, a banner "Well done, Mr. President," a twenty-one-gun salute)'
    units: '?'
- cite:
    id: cal.1966-11-16.succession
    item: '[[w.johnson-white-house-diary]], 453 (Nov. 17: "Lyndon had come in late Tuesday and had been operated on early yesterday to repair the scar ... and to remove the polyp in his throat"; the growth benign)'
    units: '?'
- check:
    id: cal.1966-12-14.transition-and-staff
    text: 'Check: Lady Bird Johnson, 462, on Friday, Dec. 16: "Yesterday came the announcement of Bill Moyers'' departure," that is, Dec. 15; the entry has Moyers resigning Dec. 14.'
- cite:
    id: cal.1966-12-14.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 462 (Dec. 16: "Yesterday came the announcement of Bill Moyers'' departure"; with the Manchester book, the "credibility gap," and the critical Democratic Governors'' opinions, dissipating the Christmas mood)'
    units: '?'
- cite:
    id: cal.1966-12-16.assassination
    item: '[[w.johnson-white-house-diary]], 462 ("Mrs. Kennedy is filing suit to block publication of the book")'
    units: '?'
- cite:
    id: cal.1966-10-19.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 429–31 (Oct. 20: Wellington, "sixty thousand people lined the streets" on the newspapers'' account, the motorcade to Parliament nearly an hour; a few demonstrators outside Parliament with "Hey, hey, LBJ, how many kids have you killed today?" and "Withdraw from Vietnam"; Prime Minister Holyoake on the flight to Ohakea, a botanist; a sheep farm)'
    units: '?'
- cite:
    id: cal.1966-10-20.vietnam-asian-trip
    item: '[[w.johnson-white-house-diary]], 431–32 (Canberra, about 6:15 p.m., met by Holt, Lord Casey and Ambassador Ed Clark; a twenty-one-gun salute; Johnson: "I cannot say that miracles will occur at Manila. I carry no magic wand"; the papers: "a near-riot"; nine stops on the ride to Government House; not Melbourne, Sydney, Brisbane or Townsville)'
    units: '?'
- cite:
    id: cal.1966-10-20.vietnam-asian-trip-2
    item: '[[w.johnson-white-house-diary]], 430 (the demonstrators outside Parliament, "few in number," with signs "Hey, hey, LBJ, how many kids have you killed today?" and "Withdraw from Vietnam"; the diary has no V sign and no "STOP THE WAR" banners)'
    units: '?'
- check:
    id: cal.1966-06-28.vietnam-congress-4
    text: 'Check: Lady Bird Johnson, 390, says the dinner was "just Lyndon and Dick and I"; the entry has Johnson and Russell alone.'
- check:
    id: cal.1966-06-29.vietnam-air-war
    text: 'Check: Lady Bird Johnson, 391, has Johnson, Luci and herself at the church after Russell left ("Lyndon and Luci and I"); the entry has Johnson and Luci. No hour is given; the entry says after midnight.'
- check:
    id: cal.1966-10-28.vietnam-asian-trip
    text: 'Check: Lady Bird Johnson, 436–37, has the party leave Manila about noon on Thursday, Oct. 27, and reach U Ta Pao three hours later; the entry asks whether the day of arrival was Oct. 27 or 28.'
