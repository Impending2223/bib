- add:
    entry:
      id: cal.1960-09-06.soviet-union
      when: Sept. 6
      date: '1960-09-06'
      thread: soviet-union
      also:
      - intelligence
      c: 'Moscow, the House of Journalists. Bernon F. Mitchell and William H. Martin, mathematicians in the cryptology department of the National Security Agency, appear at a news conference of the Soviet Foreign Ministry''s Press Department, Kharlamov, its chief, beside them. They say they left the United States and took Soviet citizenship because they opposed its intelligence methods, which they feared would lead to war, above all the reconnaissance flights over the Soviet Union and other Communist countries. They read statements: the United States knowingly makes false and deceptive statements; it paid a code clerk in an ally''s embassy in Washington for information. A high NSA official told Martin, they say, that the C-130 shot down over Soviet Armenia in September 1958 carried equipment for receiving the signals of Soviet radar, on a penetration mission. They would not give the date of their arrival or say how they came.'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 10, 11 ("War Threat Seen," "Two Code Clerks Defect to Soviet," by Osgood Caruthers; "Text of Statements Read in Moscow by Former U. S. Security Agency Workers," at 10; "Soviet Assertion on Plane Backed," page not shown: the news conference, the statements, the C-130 account, their refusal on arrival; Martin disappeared with Mitchell after a vacation from June 24, reported Aug. 1). Names: Kharlamov.'
      tags:
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1960-09-06.intelligence
      when: Sept. 6
      date: '1960-09-06'
      thread: intelligence
      also:
      - antisubversion
      c: Washington. Eisenhower, through James C. Hagerty, his press secretary, calls Mitchell and Martin, the NSA defectors who denounced the United States in Moscow, "self-confessed traitors."
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 13 ("President Calls Pair Traitorous," by Jack Raymond: the characterization "came through" Hagerty). See [[cal.1960-09-06.soviet-union]]. Names: Eisenhower, Hagerty.'
      tags:
      - name:eisenhower-dwight-d
      - name:hagerty-james-c
- add:
    entry:
      id: cal.1960-09-06.intelligence-2
      when: Sept. 6
      date: '1960-09-06'
      thread: intelligence
      also:
      - antisubversion
      c: 'The Defense Department, in two statements on the NSA defectors in Moscow. The first: their statements about United States activities "in relation to its allies and foes alike" are "falsehoods," meant to sow distrust among the free nations; it confirms it has a letter they left in a safe-deposit box at a bank in Laurel, Md., obtained after they fled by way of Mexico City and Havana in mid-June. The second: the Soviet Union is trying to exploit "the two turncoats," "tools of Soviet propaganda"; one is "mentally sick" and both are "obviously confused." It does not say which is ill.'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 13 ("President Calls Pair Traitorous," by Jack Raymond: the two statements, the words; the Navy''s reply on Soviet ships near Havana and the department''s comment on the C-130 not entered). See [[cal.1960-09-06.soviet-union]].'
      tags:
      - state:md
      - city:laurel
- add:
    entry:
      id: cal.1960-09-06.antisubversion
      when: Sept. 6
      date: '1960-09-06'
      thread: antisubversion
      also:
      - intelligence
      c: 'Walter, chairman of the House Un-American Activities Committee: the committee will begin closed hearings Sept. 16 with Gates, Secretary of Defense, the first witness, on the NSA defectors. The inquiry will stress hiring practices in the National Security Agency and all Government agencies; many persons once dropped as "security risks" have managed to regain their jobs.'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 13 ("President Calls Pair Traitorous," by Jack Raymond: the announcement; the *Times* adds that the committee''s effort to subpoena personnel officials and records had failed, it was understood because the process server could not enter NSA headquarters at Fort Meade, Md., on a day it does not give). See [[cal.1960-09-06.soviet-union]]. Names: Walter, Gates.'
      tags:
      - name:walter-francis-e
      - name:gates-thomas-s-jr
- add:
    entry:
      id: cal.1960-09-06.antisubversion-2
      when: Sept. 6
      date: '1960-09-06'
      thread: antisubversion
      c: Walter denies he made the allegation, reported by a news agency, that one of the two NSA defectors was described as a homosexual in a report by the Federal Bureau of Investigation.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1 ("President Calls Pair Traitorous," by Jack Raymond: the denial; the allegation''s source not named). See [[cal.1960-09-06.soviet-union]]. Names: Walter.'
      tags:
      - name:walter-francis-e
- add:
    entry:
      id: cal.1960-09-06.immigration
      when: Sept. 6
      date: '1960-09-06'
      thread: immigration
      also:
      - elections-1960
      c: Walter, Democrat of Pennsylvania and chairman of the House Immigration subcommittee, denounces his party's platform plank on immigration as "a 'phony,'" in a letter to Bowles, chairman of the Platform Committee at the Democratic National Convention. What the platform promised is "out of date, not borne out by the facts and insincere." He attacks several points, among them the plank's opposition to the national-origins quota system as a policy of "deliberate discrimination."
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Walter Denounces Immigration Plank," UPI, Sept. 6: the letter, the words, the insertion in the *Congressional Record*; page not shown). Check: the day: the dispatch is dated Sept. 6 and says the letter "was inserted in the Congressional Record" without giving a day for either. To check: *Congressional Record*, the letter. Names: Walter, Bowles.'
      tags:
      - name:walter-francis-e
      - name:bowles-chester
- add:
    entry:
      id: cal.1960-09-06.latin-america-dominican-republic
      when: Sept. 6
      date: '1960-09-06'
      thread: latin-america-dominican-republic
      c: The State Department warns United States travelers in the Dominican Republic that they are no longer under diplomatic protection there.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) (UPI, Sept. 6: the warning; page not shown).'
- add:
    entry:
      id: cal.1960-09-06.latin-america-dominican-republic-2
      when: Sept. 6
      date: '1960-09-06'
      thread: latin-america-dominican-republic
      c: Buenos Aires. Argentina and Uruguay break diplomatic relations with the Dominican Republic, following the recommendation of the Organization of American States. The AP adds that the United States and nearly all the other American republics have taken similar action.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("2 Nations Cut Dominican Ties," AP, Sept. 6: the two breaks; the OAS condemnation for the June 24 attempt on Betancourt as the dispatch states it; page not shown).'
- add:
    entry:
      id: cal.1960-09-06.laos
      when: Sept. 6
      date: '1960-09-06'
      thread: laos
      c: Vientiane. Souvanna Phouma, Premier, declares that Maj. Gen. Phoumi Nosavan will be considered a rebel if he does not end his resistance to the new regime and return to Vientiane. Phoumi, appointed Deputy Premier and Interior Minister last week, has gone south to Savannakhet, headquarters of the resistance movement he formed last month. Souvanna says in an interview that he sent Phoumi a telegram Sept. 5 ordering him to return; it set no deadline.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Resistance Head Warned in Laos," by Jacques Nevard: the declaration, the telegram of "yesterday," the words; page not shown). Names: Souvanna Phouma, Phoumi.'
      tags:
      - name:souvanna-phouma
      - name:phoumi-nosavan
- add:
    entry:
      id: cal.1960-09-06.laos-2
      when: Sept. 6
      date: '1960-09-06'
      thread: laos
      c: Tiao Somsanith, President of the National Assembly, says in an interview that Phoumi Nosavan is now outside the law and that his action might be construed as disloyalty to King Savang Vathana, who has approved the new Government. Somsanith had been Premier in the Government that was ousted; Phoumi was his Minister of Defense.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Resistance Head Warned in Laos," by Jacques Nevard: the interview and its words; page not shown). See [[cal.1960-09-06.laos]]. Names: Somsanith, Phoumi, Savang Vathana.'
      tags:
      - name:somsanith
      - name:phoumi-nosavan
      - name:savang-vatthana
- add:
    entry:
      id: cal.1960-09-05.laos
      when: Sept. 5
      date: '1960-09-05'
      thread: laos
      c: 'Late at night the Savannakhet radio, the resistance movement''s, makes plain that the group will not be dissolved, as Phoumi Nosavan had promised on taking office in the new Government, until the situation in Vientiane returns to "normal": the withdrawal from the city of Capt. Kong Le''s paratroop battalion, which staged the coup of Aug. 9 and has held the city since.'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Resistance Head Warned in Laos," by Jacques Nevard, Vientiane, Sept. 6: the broadcast "late last night"; page not shown). Names: Phoumi, Kong Le.'
      tags:
      - name:phoumi-nosavan
      - name:kong-le
- add:
    entry:
      id: cal.1960-09-06.laos-3
      when: Sept. 6
      date: '1960-09-06'
      thread: laos
      c: Washington. Officials indicate that the United States is giving "guarded support" to the new neutralist Government of Laos.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("U. S. Support Guarded," Special to the *New York Times*, Sept. 6: the indication; page not shown).'
      tags:
      - polity:us
- add:
    entry:
      id: cal.1960-09-06.laos-4
      when: Sept. 6
      date: '1960-09-06'
      thread: laos
      c: It is reported that 300 Pathet Lao troops who had been terrorizing the Luang Prabang area surrender their arms after a Government pledge that they will not be punished.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Resistance Head Warned in Laos," by Jacques Nevard: "later, it was reported"; page not shown). Check: the day: the dispatch of Sept. 6 gives the report and no day for the surrender.'
- add:
    entry:
      id: cal.1960-09-06.china
      when: Sept. 6
      date: '1960-09-06'
      thread: china
      c: 'Taipei. Chiang Kai-shek, in an interview: "I predict that in the next six months to a year Khrushchev will succeed in gaining complete control over the Chinese Communists, at which time Mao will be forced to admit it and knuckle under or be overthrown. Mao will either go to his knees or be liquidated." Khrushchev and Mao are feuding, he says, because the Soviet restrained China from starting brushfire wars in southeast Asia.'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Chiang Sees Mao a Loser," AP, Sept. 6: the interview, the words; page not shown). Names: Chiang, Khrushchev, Mao.'
      tags:
      - name:chiang-kai-shek
      - name:khrushchev-nikita-s
      - name:mao-zedong
- add:
    entry:
      id: cal.1960-09-06.vietnam
      when: Sept. 6
      date: '1960-09-06'
      thread: vietnam
      also:
      - soviet-union
      c: Hanoi, the third national congress of the Vietnam Lao Dong (Communist) party. Nuritdin A. Mukhitdinov, head of the Soviet delegation, repeats the Moscow thesis that war can be prevented because the increased strength of Communist countries has changed the international balance of forces in their favor.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Speakers Agree on Peace," Special to the *New York Times*, Hong Kong, Sept. 6: the speech as broadcast by the Hanoi radio; page not shown). See [[cal.1960-09-05.vietnam]].'
- add:
    entry:
      id: cal.1960-09-06.vietnam-2
      when: Sept. 6
      date: '1960-09-06'
      thread: vietnam
      also:
      - china
      c: 'Hanoi, the third national congress of the Vietnam Lao Dong party. Li Fu-chun, head of the Peiping delegation: an "alliance" of Communist forces against imperialism "could prevent war." But "revisionists" are trying to "kill the revolutionary spirit of Marxism and undermine the faith of the working people in general in socialism."'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Speakers Agree on Peace," Special to the *New York Times*, Hong Kong, Sept. 6: the speech as broadcast by the Hanoi radio; the *Times*''s note on the term "revisionism"; page not shown). See [[cal.1960-09-06.vietnam]].'
- add:
    entry:
      id: cal.1960-09-06.china-2
      when: Sept. 6
      date: '1960-09-06'
      thread: china
      also:
      - soviet-union-un
      c: United Nations. The Soviet Union formally asks the General Assembly to consider admitting Communist China. Gromyko, in a message to Hammarskjold, asks that the agenda of the session opening Sept. 20 include "Representation of China in the United Nations," the Nationalist regime to be unseated and the Peiping Government seated. An accompanying memorandum calls the exclusion "a source of enormous damage" to the United Nations.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html) ("Soviet Urges U. N. Accept Red China," Special to the *New York Times*, Sept. 6: the request, the memorandum, the words; page not shown; Khrushchev''s expected speech not entered). Names: Gromyko, Hammarskjold.'
      tags:
      - name:gromyko-andrei
      - name:hammarskjold-dag
- add:
    entry:
      id: cal.1960-09-05.latin-america-2
      when: Sept. 5
      date: '1960-09-05'
      thread: latin-america
      c: San Salvador. The Legislative Assembly decrees a thirty-day nationwide state of siege at the request of President José María Lemus. It suspends the guarantees of four articles of the Constitution because of "grave perturbations in public order"; it is the first since the one-day revolt of Dec. 14, 1948. The decree comes a few hours after the funeral of the first person killed in the disturbances, a youth employed at the university library.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 6 ("Salvador Smashes a ''Communist Plot,''" "Salvador Breaks ''Communist Plot''": the decree "last night," its terms, the funeral).'
- add:
    entry:
      id: cal.1960-09-06.latin-america
      when: Sept. 6
      date: '1960-09-06'
      thread: latin-america
      c: San Salvador. The Government announces that it has smashed a "widespread Communist plot to usurp power and destroy our republican institutions." A communiqué reports for the first time the breaking up of riots said to have led to an assault last Wednesday night on the Fifth Regiment barracks in Santa Ana, and similar assaults planned on the garrisons at Ahuachapán and Sonsonate. It blames "agitators in the pay of Sino-Soviet interventionism"; students were "gullible tools."
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 6 ("Salvador Smashes a ''Communist Plot,''" "Salvador Breaks ''Communist Plot''": the announcement and the communiqué, the words). See [[cal.1960-09-05.latin-america-2]].'
      tags:
      - polity:prc
      - polity:ussr
- add:
    entry:
      id: cal.1960-09-06.elections-1960-nixon
      when: Sept. 6
      date: '1960-09-06'
      thread: elections-1960-nixon
      also:
      - school-aid
      - medicare
      c: Flemming, Secretary of Health, Education, and Welfare, at his news conference attacks Kennedy for "completely distorting the record" of Nixon and the Republican party on teachers' salaries and medical care for the aged; Kennedy's speech in Detroit "burned me up." Far from opposing "decent wages for our teachers," as Kennedy charged, teachers' salaries were "the No. 1 issue" in the school-construction plan Nixon backed. Nixon backed the Javits voluntary insurance plan, about $900,000,000 a year to the Federal Government against $690,000,000 for the Anderson plan Kennedy backs. He predicts Federal funds for classrooms under Nixon and a Federal scholarship program, and says he will write all the Governors on the medical care bill awaiting the President's signature.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 33 ("Kennedy Assailed by Flemming for ''Distorting'' Nixon''s Views," by Bess Furman: the news conference, the charges, the figures, the words; the day of Kennedy''s speech, "yesterday," given as Detroit, Sept. 5). See [[cal.1960-09-05.elections-1960]]. Names: Flemming, Kennedy, Nixon, Javits, Anderson.'
      tags:
      - name:flemming-arthur-s
      - name:kennedy-john-f
      - name:nixon-richard-m
      - name:javits-jacob-k
      - name:anderson-clinton-p
      - state:mi
      - city:detroit
- add:
    entry:
      id: cal.1960-09-06.elections-1960-rockefeller
      when: Sept. 6
      date: '1960-09-06'
      thread: elections-1960-rockefeller
      also:
      - economy
      c: 'The Statler-Hilton Hotel. Rockefeller, to more than 900 tax experts at the opening luncheon of the fifty-third annual conference of the National Tax Association: "one of the highest priority tasks of the next Administration will be to re-examine our entire tax structure with the objective of providing incentives to increased investment in private enterprise." He asks "more liberal and flexible depreciation allowances." Growth has averaged 3.4 percent a year in the last decade; he feels the national interest demands 5 to 6. He says again that if predictions of a $120,000,000 State surplus hold, he will recommend the 10 percent tax abatement promised earlier in the year.'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 25 ("Rockefeller Urges Tax Aid to Industry," by Clayton Knowles: the speech "yesterday," the words and figures; the city of the hotel not given on the clipping). Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1960-09-06.latin-america-2
      when: Sept. 6
      date: '1960-09-06'
      thread: latin-america
      c: 'Bogotá, the first plenary session of the inter-American economic meeting. Oscar Pino Salas of Cuba, after Dillon''s statement, which won loud applause from the other delegates: it is "nothing more than a ratification of the basic position of North American imperialism toward Latin America."'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 5 ("U. S. Tells Latins of Plan to Widen Development Aid," by Juan de Onís: the remark, the words). See [[cal.1960-09-05.latin-america]]. Names: Dillon.'
      tags:
      - name:dillon-c-douglas
- add:
    entry:
      id: cal.1960-09-06.latin-america-3
      when: Sept. 6
      date: '1960-09-06'
      thread: latin-america
      c: Bogotá. Felipe Herrera, president of the newly formed Inter-American Development Bank, tells the delegates that its twenty members have subscribed 85 percent of the first year's capital quota of almost $250,000,000. The rest will be in by the end of the month, he says, and the bank can then begin to make loans.
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 5 ("U. S. Will Broaden Plan for Latins": the statement; the *Times* adds that Cuba has not ratified the charter and the capital will be $40,000,000 short of the $1,000,000,000 planned). See [[cal.1960-09-05.latin-america]].'
- add:
    entry:
      id: cal.1960-09-07.elections-1960-kennedy-7
      when: Sept. 7
      date: '1960-09-07'
      thread: elections-1960-kennedy
      c: 'As the *Times* reports it: Byrd of Virginia has not endorsed the Democratic ticket; neither of Georgia''s Senators, Russell or Talmadge, has spoken for Kennedy.'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 35 ("Democrats Face a Setback in South, Survey Indicates," by Claude Sitton, "Democrats Face Trouble in South": "Byrd Is Silent," the failure of Byrd "to endorse the Democratic ticket"; "Lack of Endorsements," Russell and Talmadge). Names: Byrd, Russell, Talmadge, Kennedy.'
      tags:
      - form:state
      - name:byrd-harry-f
      - name:russell-richard-b
      - name:talmadge-herman-e
      - name:kennedy-john-f
      - state:va
      - state:ga
- add:
    entry:
      id: cal.1960-09-07.elections-1960-kennedy-8
      when: Sept. 7
      date: '1960-09-07'
      thread: elections-1960-kennedy
      c: 'Atlanta. The *Times* prints Claude Sitton''s report of two weeks of interviews in the South. William C. Battle, director of the Democratic Presidential campaign in Virginia: "There''s no doubt about it—we''re at our low point now." Hollings, Governor of South Carolina, forecasts an "uphill battle" for Kennedy there; Hodges, Governor of North Carolina: "I think [the race] is a little too close." Collins, Governor of Florida, and James Milligan, the party chairman, say Florida will be lost unless the State''s Democratic officeholders join a unified campaign. The Republicans claim the lead in Texas.'
      n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 35 ("Democrats Face a Setback in South, Survey Indicates," by Claude Sitton: the interviews and the words). Check: the days of the interviews: the *Times* gives only "two weeks of interviews in the South." See [[cal.1960-09-07.elections-1960-kennedy-7]]. Names: Sitton, Hollings, Hodges, Collins, Kennedy.'
      tags:
      - name:sitton-claude
      - name:hollings-ernest-f
      - name:hodges-luther-h
      - name:collins-leroy
      - name:kennedy-john-f
      - state:va
      - state:sc
      - state:nc
      - state:fl
      - state:tx
