- edit:
    id: cal.1964-08-06.democratic-party
    base: 63cd36da
    set:
      c: 'Jenkins''s office, then the president: Valenti, Jenkins, Moyers, O''Donnell, O''Brien, Cliff Carter, Bailey and Rowe on the Freedom Democrats'' challenge, the day of their
        State convention. In Jenkins''s office the issue, unless settled, would "surface like a ticking time bomb on the convention floor."{1} Johnson, seeing them: "Get those problems
        settled. ... Organize yourselves, get a sensible plan, and then come back and talk to me!"{2} Before seeing him they set the campaign''s lines of authority: Bailey nominally
        in charge, O''Donnell his assistant, O''Brien organization, Valenti scheduling, Moyers the speeches, Carter the field, Rowe special groups. By Valenti''s account.{3}'
      n: '[[w.kotz-judgment-days]], 190; [[w.valenti-very-human-president]], 201–03 (the Freedom Democrats'' challenge: ten to thirteen Credentials Committee members counted for seating;
        the issue "sure to surface like a ticking time bomb on the convention floor unless it was defused"; after the meeting in Jenkins''s office the group sees Johnson, who dismisses
        them within the hour; Carter at the earlier meeting; not the Oval Office: the discussion was in Jenkins''s office, 201–02, and the group then saw the president, 203). Check:
        Valenti dates the campaign meeting "August 6, a Sunday" ([[w.valenti-very-human-president]], 201); Aug. 6, 1964, was a Thursday. Check: Valenti gives Johnson''s words as "Get
        these problems settled, organize yourself, get a sensible plan, and then come back to talk to me" (203). See [[cal.1964-08-06.mississippi]]. Names: Johnson, Valenti, Jenkins,
        Moyers, O''Donnell, O''Brien, Carter, Rowe.'
      src:
        c: 6f95d5a7
        rows:
        - 'w.kotz-judgment-days 190: 1, 2'
        - 'w.valenti-very-human-president 201–03: 1, 3'
    kind: correct
