- edit:
    id: cal.1964-05-06.civil-rights-bill
    base: b66b6714
    set:
      n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-3-1.pdf) (1964). [[w.mann-walls-of-jericho]], 418 (the day''s roll calls; Russell''s
        halt); [[w.whalen-longest-debate]], 176 (also the motion to table Morton''s amendment, lost 44–47, Moss angry); [[w.risen-bill-of-the-century]], 216 (May 6, the Morton amendment;
        the first vote 45 to 45; Moss, kept outside on a telephone call, late, lights into Mansfield and votes against tabling out of spite; Mansfield clears the floor of all but senators;
        Moss placated, the second motion to table carried; Russell objects to moving to the Dirksen-Mansfield amendment); [[w.purdum-idea-whose-time-has-2014]], 278–79 (Wednesday, May
        6, Morton''s amendment: four roll calls, 45–45 (failed for want of a majority), 44–47 on the motion to table the motion to reconsider (Moss, in the cloakroom, missed the first
        vote and voted against tabling out of spite, by Purdum), reconsideration carried 46–45, then 45–46 against, and Cooper''s amendment defeated; the Times'' "hairbreadth victory";
        Stewart''s diary (the manuscript Loevy, ed., *Civil Rights Act of 1964*, 116, cites; Purdum, 278 n.); Russell then holds the vote on the Mansfield-Dirksen amendment until the
        next week for the poverty tour of Appalachia and the South); [[w.purdum-idea-whose-time-has-2014]], 278; [[w.purdum-idea-whose-time-has-2014]], 278–79. The Senate sat from noon
        to 8:36 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=1), [D207](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=205).
        Check: Risen, 216, has the first vote 45–45 on taking up the Morton amendment, the first motion to table defeated with Moss voting against, and the second carried; the entry
        has the amendment failing on the tie and, reconsidered, again 45–46. See [[cal.1964-02-10.civil-rights-bill]]. Names: Morton, Cooper, Dirksen, Moss. Check: the page.'
      gloss:
        title: Commentary
        text:
        - 'Purdum (2014): the Morton vote "the lowest moment" in the pro-civil-rights cause since the bill reached the Senate floor ([[w.purdum-idea-whose-time-has-2014]], 278).'
