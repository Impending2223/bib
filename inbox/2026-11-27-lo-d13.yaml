    set:
      c: 'Night.{1} The regulars, all but three, having walked out on the compromise, Governor Paul Johnson on television: "Mississippi''s debt to the national party is now paid in full."{2}
        Rauh returns the at-large credentials.{3} Nearly two dozen Freedom Democrats, on borrowed badges, sit in the Mississippi seats;{4} the three regulars who signed the pledge leave.
        Jenkins overrules Watson''s order to have them dragged out.{5}'
      n: '[[w.branch-pillar-of-fire]], 472–73 (by early evening the State chairman praises the regulars for walking out on the compromise; the Governor on television, 472); [[w.kotz-judgment-days]],
        219. Check: Kotz gives more than thirty Freedom Democrats smuggled in, and Johnson''s words to the three loyal regulars as "You saved your state" (219). That night, after the
        compromise: [[cal.1964-08-25.mississippi]]. After [[cal.1964-08-25.mississippi-4|the Freedom Democrats'' vote against the compromise]], held "earlier Tuesday evening" ([[w.kotz-judgment-days]],
        219); Rauh returns the credentials after the delegates'' vote to reject ([[w.branch-pillar-of-fire]], 470–72). To check: *Washington Post*, Aug. 27, 1964, at 2 (cited by [[w.branch-pillar-of-fire]],
        472); Interview with Joseph Rauh, Oct. 17, 1983 (cited by [[w.branch-pillar-of-fire]], 472); Belfrage, Freedom Summer, pp. 252–54 (cited by [[w.branch-pillar-of-fire]], 472);
        *Washington Post*, Aug. 26, 1964, at 6 (cited by [[w.branch-pillar-of-fire]], 472); Fred Berger of Natchez, Randolph Holladay of Picayune, and Douglas Wynn of Greenville. Mills,
        This Little Light, p. 131 (cited by [[w.branch-pillar-of-fire]], 472); [Conversation with WALTER JENKINS, 9:33 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-jenkins-august-26-1964-1),
        Conversation WH6408-38-5210 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 472); Walter Adams to Walter Jenkins, Sept. 1, 1964, PL1/ST24, Box 81, LBJ Library (cited by
        [[w.branch-pillar-of-fire]], 472); [[w.dittmer-local-people]], 299 (cited by [[w.branch-pillar-of-fire]], 473). See [[cal.1964-08-25.mississippi]]. Names: Paul Johnson, Rauh,
        Jenkins, Watson, Johnson.'
