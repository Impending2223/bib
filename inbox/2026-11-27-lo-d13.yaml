      thread: civil-rights-bill
      follows:
      - cal.1964-07-02.civil-rights-bill
      c: 'The East Room, 6:45 p.m. Johnson signs the Civil Rights Act, [78 Stat. 241](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg241.pdf), on television: "Let us
        close the springs of racial poison." Collins to be named director of the Community Relations Service.'
      n: 'Radio and Television Remarks Upon Signing the Civil Rights Bill, [1963–64 Pub. Papers 842](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=82)
        (July 2, 1964) ("Broadcast from the East Room at the White House at 6:45 p.m."). Statute (K–J Cong. II.J.2). [President''s Daily Diary, July 2, 1964](https://catalog.archives.gov/id/192443),
        images 4, 7, 8 (LBJ Library; National Archives Catalog). [[w.kotz-judgment-days]], 153–54; [[w.branch-pillar-of-fire]], 387–88 (seventy-two pens, 388); [[w.zelizer-fierce-urgency-of-now]],
        128–29 (the signing, 7 p.m., East Room); [[w.bernstein-guns-or-butter]], 78–79 (the signing that evening in the East Room); [[w.thomas-robert-kennedy]], 295 (Robert Kennedy at
        the signing, Roy Reuther urging a pen for him); [[w.young-easy-burden]], 298, 302 (the signing, July 2, televised; not the room); [[w.whalen-longest-debate]], 224–28 (6:45 p.m.;
        seventy-two pens); [[w.mann-walls-of-jericho]], 432 (the East Room); [[w.dallek-flawed-giant]], 120 (signed the evening of July 2 in the East Room, before a national television
        audience); [[w.young-two-suns-of-the]], 121 (signed July 2); [[w.caro-passage-of-power]], 569 (signed that evening, eight days before the Republican convention; not the East
        Room nor the statute); [[w.schlesinger-robert-kennedy-and-his]], 645 (Johnson signs the Civil Rights Act on July 2, "the usual nonsense in the Oval Office"; Robert Kennedy in
        the rear of the room, "staring at the floor"; Roy Reuther propels him across the room to Johnson: "Mr. President, I know you have reserved a pen for your Attorney General," and
        Johnson "blandly" gives him "a handful of pens"; Fauntroy on the "coldness" of Johnson toward Kennedy; not the hour, the vote or the statute); [[w.johnson-white-house-diary]],
        173–74 (the signing in the East Room at 6:30 with television, the congressional leaders behind Johnson, Mansfield, Dirksen, Boggs and Robert Kennedy there; Humphrey asks for
        the copy of the statement and it has vanished; Mrs. Johnson to the newswomen on 1957 and the thirty-seven nights; not the words); [[w.risen-bill-of-the-century]], 239–43 (that
        evening 250 in the East Room, television, Collins named, the closing words, Johnson''s pens; not the statute); [[w.purdum-idea-whose-time-has-2014]], 321–24 (the guests gathering
        in the East Room by six o''clock; Johnson begins his speech at 6:45; "Let us close the springs of racial poison"; more than seventy pens; not the Heart of Atlanta suit nor Collins).
        The time is the broadcast''s, 6:45 p.m. Washington time (Public Papers, 842; Whalen, 224–28; Purdum, 322). Check: Lady Bird Johnson, 173–74, has the ceremony at 6:30; Zelizer,
        128–29, 7 p.m. Check: Young, 298, 302, puts the signing in the Capitol Rotunda. Check: Schlesinger, 645, has the signing "in the Oval Office"; the entry has the East Room. To
        check: PPP, July 2, 1964, pp. 842–44 (cited by [[w.branch-pillar-of-fire]], 388); LBJ-Lee White, June 16, 1964, 10:13 a.m., TT, Telephone Tapes, LBJ Library (cited by [[w.dallek-flawed-giant]],
        120 n.156). See [[cal.1964-07-02.civil-rights-bill]]. Names: Johnson, Collins.'
      tags:
      - name:johnson-lyndon-b
      - name:collins-leroy
