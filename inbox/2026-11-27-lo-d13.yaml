      c: 'Atlantic City. David Lawrence, chairman of the Credentials Committee, puts off the committee''s full meeting, set for Monday afternoon, a day, and its report to the convention
        to Tuesday night. In the lobby, to Rauh, who says he has the votes for a minority report: the committee will put off its decision another day; the convention will open without
        certifying any delegates.'
      n: '[[w.dittmer-local-people]], 294 (Lawrence "postponing the full committee meeting scheduled for Monday afternoon for one day and its report to the convention until Tuesday night,"
        Rauh still having enough support for a minority report and the Mondale subcommittee no recommendation); [[w.branch-pillar-of-fire]], 466 (in the lobby, after Humphrey''s meeting
        with the Freedom Democrats, Lawrence and Rauh before the cameras: the committee would put off its decision yet another day; the convention to open without certifying any delegates).
        See [[cal.1964-08-24.democratic-party]]. Names: Lawrence, Rauh.'
