- edit:
    id: cal.1964-08-24.democratic-party
    base: 53b2b842
    set:
      c: 'Atlantic City, afternoon.{1} Humphrey with the Credentials Committee''s members for the Freedom Democrats, their delegation''s leaders, Martin Luther King and Moses: nothing
        to offer.{2} Hamer: "do you mean to tell me that your position is more important to you than four hundred thousand black people''s lives?"{3} Humphrey''s suite at the Pageant
        Motel, 1:40 p.m.; also invited, Andrew Young, Rustin, Farmer and Wilkins; Rauh there, and Representative Edith Green. Moses: "The time has come for Negroes to speak for Negroes,
