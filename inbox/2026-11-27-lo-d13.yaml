      c: 'Kuchel to Humphrey, that evening, on a cloture vote in a couple of weeks, May 22 by Whalen. Humphrey, "pretty discouraged": "Tommy, I''m talking out of both sides of my mouth";
        he floated cloture "to keep the civil rights groups in line"; no action before the first week in June.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 281–82 (that same evening Kuchel goes to see Humphrey about a cloture vote in a couple of weeks; Humphrey "pretty discouraged"; the words,
        "talking out of both sides of my mouth" and "to keep the civil rights groups in line"; he does not think "we can secure any action before the first week in June," Kuchel to Horn).
        [[w.whalen-longest-debate]], 177 (Kuchel proposes cloture May 22; Humphrey: not before June). The time is the evening of Purdum''s "that same evening," the place not given. To
        check: Horn, Periodic Log, May 7–8, 1964 (cited by [[w.whalen-longest-debate]], 264; Purdum, 281–82 n.: Horn log, 168, EMDP). See [[cal.1964-05-07.civil-rights-bill-3]]. Names:
        Kuchel, Humphrey.'
      tags:
      - name:kuchel-thomas-h
      - name:humphrey-hubert-h
- edit:
    id: cal.1964-05-13.civil-rights-bill-3
    base: 1e3ac4a7
    set:
      c: 'Humphrey to Johnson by telephone on the agreement with Dirksen: "we''ve got a much better bill than anyone ever dreamed possible. We haven''t weakened the bill one damn bit."{1}
        Johnson: "we''ve got to make this an American bill and not just a Democratic bill."{2}'
      n: '[Johnson and Humphrey, 7:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-may-13-1964-0), Conversation WH6405-06-3450
        (Miller Center; its summary: Humphrey reports the meeting on the civil rights bill, Dirksen and the cloture vote; the call also takes in the Baker investigation and the Maryland
        primary). [[w.taking-charge]], 353–55 (the call printed, 7:25 p.m.; 354: Humphrey, "a much better bill than anybody even dreamed possible," and Johnson, "we''ve got to make this
        an American bill and not just a Democratic bill"; the line "We don''t want this to be a Democratic bill" on 350 is Johnson''s call to Dirksen at 4:30 p.m., [[cal.1964-05-13.republican-party-congress]]);
        [[w.kotz-judgment-days]], 141; [[w.risen-bill-of-the-century]], 217 (the morning of May 13, before the day''s talks, Humphrey to Johnson: "We''ve got a much better bill than
        anybody ever dreamed possible"); [[w.purdum-idea-whose-time-has-2014]], 289–90 (later that evening Johnson to Humphrey, who has had dinner with Dirksen the night before: Dirksen
        can get twenty-five votes; "a much better bill than anybody even dreamed possible"; Johnson on the Volstead Act (697); Purdum has this and Kennedy''s call as separate calls).
        The time is 7:25 p.m., the recordings'' catalogue (Citation 3450). Check: Risen, 217, has Humphrey''s words to Johnson the morning of May 13, before the negotiations of that
        day; the entry has them as a call "on the agreement with Dirksen." Split under R17 and R25b: Robert Kennedy''s call of 4:05 p.m. is [[cal.1964-05-13.civil-rights-bill-4]]; this
        call is Humphrey''s of 7:25 p.m. (Taking Charge, 353–55), not the 5:30 p.m. call. See [[cal.1964-05-13.republican-party-congress]]. Names: Humphrey, Johnson.'
      src:
