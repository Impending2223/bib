    set:
      c: Peking, on the Gulf of Tonkin.{1} Zhou Enlai and Luo Ruiqing cable Hồ Chí Minh, Phạm Văn Đồng and Văn Tiến Dũng for closer military collaboration.{2}
      n: '[[w.jian-maos-china-and-the]], 212–13 (by the Chinese records: the cable of Aug. 5, "investigate and clarify the situation, discuss and formulate proper strategies and policies,
        and be ready to take action"; closer military collaboration); [[w.zhai-china-and-the-vietnam]], 132 (the cable, Aug. 5); [[w.jian-zhou-enlai]], 496 (Zhou and Luo cable Hồ, Đồng
        and Dũng: clarify the situation, set policy, be prepared). The government''s statement is of Aug. 6, not Aug. 5 as Chen has it (214): the Zhou chronology, II, 663, and Mao''s,
        V, Aug. 6, put it there, and the *People''s Daily* printed it that day. To check: *Beijing Review*, Nov. 30, 1979, at 14 (cited by [[w.jian-maos-china-and-the]], 213 n.34, for
        the cable); Li Ke and Hao Shengzhang, *Wenhua dageming zhong de renmin jiefang jun* (1989), 408, and Qu Aiguo, "Chinese Supporters in the Operations to Assist Vietnam and Resist
        America," *Junshi shilin*, no. 6 (1989), 40 (cited by [[w.jian-maos-china-and-the]], 213 n.34, for the cable); [[w.ke-wenhua-dageming-zhongde-renmin]], 408 (cited by [[w.jian-zhou-enlai]],
        496 n.18). Made public: the cable, *Beijing Review*, Nov. 30, 1979, by Chen''s note (354 n.34). See [[cal.1964-08-02.vietnam]]. Names: Zhou Enlai, Hồ Chí Minh, Phạm Văn Đồng,
        Luo Ruiqing, Văn Tiến Dũng.'
      src:
        c: 98b28ce6
        rows:
