- edit:
    id: cal.1964-08-04.vietnam
    base: 7e463bc1
    set:
      n: 'FRUS 1964–68, I, [doc. 272](https://history.state.gov/historicaldocuments/frus1964-68v01/d272). [President''s Daily Diary, Aug. 4, 1964](https://catalog.archives.gov/id/192446),
        images 3, 5, 8, 11 (LBJ Library; National Archives Catalog). [[w.gibbons-u-s-government-and]], II, 289–97 (the day hour by hour; the reports of the attack); [[w.vietnam-victory-in-vietnam]],
        132 (no engagement on Aug. 4; the incident called fabricated); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 521–22 (the reported attack; the Maddox''s doubts); [[w.cosmas-joint-chiefs-of-staff-2012]],
        106–108 (the attack); [[w.marolda-united-states-navy-and]], 426–34, 440, 443–44, 446 (the night action, 426–34); [[w.asselin-hanois-road-to-the]], 196–97 (the second attack reported;
        Hanoi''s denial: no engagement Aug. 4); [[w.johnson-vantage-point]], 114–17; [[w.moyar-triumph-forsaken]], 311–13 (311–12: the night''s contacts, the evidence then and since);
        [[w.mcnamara-in-retrospect]], ch. 5 at nn.5–10 (the Maddox''s warning at 7:40 a.m., Washington). [[w.macv-command-history-1964]], 109 (the second attack, as MACV recorded it);
        [[w.branch-pillar-of-fire]], 434–36; [[w.bernstein-guns-or-butter]], 336–37 (Herrick''s first message 7:40 p.m. Saigon time; his first count, 22 torpedoes; Stockdale over the
        scene, "Not a one"); [[w.bernstein-guns-or-butter]], 534 (Stockdale, leading planes over the gulf, saw no North Vietnamese boats); [[w.dallek-flawed-giant]], 150–53 (the attack
        reported); [[w.logevall-choosing-war]], 198–99 (the reported attack that evening); [[w.johnson-white-house-diary]], 187–89 (word that two destroyers were attacked by North Vietnamese
        PT boats, one on Sunday unanswered; not the hour or the ships'' names); [[w.goodwin-remembering-america]], 357–58 (the second attack "this very day," as the address told it);
        [[w.lich-su-khang-chien-chong-my]], III, 365–66 (Aug. 4: a great storm, the 12 torpedo boats at anchor in their base); [[w.bernstein-guns-or-butter]], 336. Check: Bernstein,
        534, dates the alleged attack Aug. 3. The time is the Maddox''s first report that an attack appeared imminent, 7:40 a.m. EDT, 7:40 p.m. Saigon time (FRUS I, doc. 272). To check:
        telephone conversation, Aug. 4, 1964, LBJL, NSF, VNCF, box 228 (cited by [[w.moyar-triumph-forsaken]], 312 n.14); [[w.mcnamara-in-retrospect]], 133, 134, 135 (cited by [[w.branch-pillar-of-fire]],
        434, 435, 436); Chronology of Second Attack, n.d., NSF: Country: Vietnam, LBJ Library (cited by [[w.dallek-flawed-giant]], 150 n.75); Chronology of events, Aug. 4–5, 1964, NSF:
        Country: Vietnam, LBJ Library (cited by [[w.dallek-flawed-giant]], 152 n.80). See [[cal.1964-08-02.vietnam]]. Check: MACV''s history, 109, has it "firmly established" that at
        least five boats engaged the destroyers; thirteen contacts fired on. Names: Stockdale.'
      gloss:
        title: Commentary
        text:
