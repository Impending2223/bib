      c: 'Kuchel to Humphrey, that evening, on a cloture vote in a couple of weeks, May 22 by Whalen. Humphrey, "pretty discouraged": "Tommy, I''m talking out of both sides of my mouth";
        he floated cloture "to keep the civil rights groups in line"; no action before the first week in June.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 281–82 (that same evening Kuchel goes to see Humphrey about a cloture vote in a couple of weeks; Humphrey "pretty discouraged"; the words,
        "talking out of both sides of my mouth" and "to keep the civil rights groups in line"; he does not think "we can secure any action before the first week in June," Kuchel to Horn).
        [[w.whalen-longest-debate]], 177 (Kuchel proposes cloture May 22; Humphrey: not before June). The time is the evening of Purdum''s "that same evening," the place not given. The
        order: after [[cal.1964-05-07.civil-rights-bill-3]], [[w.purdum-idea-whose-time-has-2014]], 281 ("That same evening," after the afternoon''s staff meeting). To check: Horn, Log,
        May 8, 1964, 168 (cited by [[w.whalen-longest-debate]], 177 n.; and by [[w.purdum-idea-whose-time-has-2014]], 281 n., "Horn log, p. 168, EMDP"). See [[cal.1964-05-07.civil-rights-bill-3]].
        Names: Kuchel, Humphrey.'
      tags:
      - name:kuchel-thomas-h
      - name:humphrey-hubert-h
- edit:
