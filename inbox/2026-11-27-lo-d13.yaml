    set:
      c: 'The Credentials Committee''s compromise, Mondale''s subcommittee: the regulars seated if they pledge to support the ticket;{1} Aaron Henry and Ed King of the Freedom Democrats
        seated at large;{2} no delegation chosen by discrimination in 1968.{3} Mondale puts it to the full committee at two o''clock. Sherwin Markman, for the White House, to Rauh''s
        plea for a recess: "A decision has been made." A voice vote; the Freedom Democrats'' strength on the committee falls from seventeen to eight. In Humphrey''s suite, hearing it
        on television, Moses: "You cheated!"{6}'
      n: '[Johnson, Humphrey, and Reuther, 2:31 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-and-walter-reuther-august-25), Conversation
        WH6408-36-5181 (Miller Center); [Johnson and Eastland, 7:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-25-1964),
        Conversation WH6408-38-5193, 5194 (Miller Center). [[w.garrow-bearing-the-cross]], 347–50 (not the regulars'' going home); [[w.young-two-suns-of-the]], 135–36 (the terms, by
        Humphrey''s report to Johnson; the Freedom Democrats'' demonstration); [[w.solberg-hubert-humphrey]], 246 (two seats at large; the rule for 1968); [[w.mann-walls-of-jericho]],
        438 (the terms); [[w.white-making-of-the-president-1965]], 280 (the terms; settled by 9:27 p.m. Tuesday); [[w.branch-pillar-of-fire]], 470–72; [[w.kotz-judgment-days]], 215–17,
        219 (Mondale''s plan at 2 p.m.; Markman: "A decision has been made"; a voice vote; the Freedom Democrats'' support on the committee from seventeen to eight); [[w.bernstein-guns-or-butter]],
        137–39 (Johnson''s three points, through Humphrey; Reuther and Humphrey with Rauh; the offer of two delegates); [[w.young-easy-burden]], 309–10 (Rauh''s offer of two seats, Ed
        King and Aaron Henry, put to the convention while the Freedom Democrats were still meeting him; refused); [[w.taking-charge]], 533–535; [[w.kotz-judgment-days]], 215–16. [[w.humphrey-education-of-a-public-1976]],
        299 (the compromise worked out with Mondale and Reuther; no discrimination in choosing delegates in future). Check: Branch has the committee carry it by acclamation, a tally
        refused; Mondale announcing it on television; Moses to Humphrey and Reuther, "You cheated!"; the Freedom Democrats at Union Temple Baptist voting to reject it, eight of the eleven
        signers for a minority report left (470–71). To check: Ibid. Also int. Robert P. Moses, Feb. 15, 1991 (cited by [[w.branch-pillar-of-fire]], 470); Interview with Joseph Rauh,
