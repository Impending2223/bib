        (III, 404). To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1116 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 404 n.31). Names: Zhou Enlai, Deng Xiaoping,
