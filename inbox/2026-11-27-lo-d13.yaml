    set:
      c: 'Zhou attends the Secretariat meeting, chaired by Deng Xiaoping, on the main questions the Central Work Conference is to settle.{1} Speaks on grain and agricultural tax and
        on procurement: this year''s crop likely better than last, so all agree on 72 billion jin purchases and 9 billion shipped up; actual execution not clear till autumn, so no big
        change these two years; the paper should not say again "unchanged for three years", which only breaks faith with the people. The agricultural tax unchanged for two years, though
        the Third Plan may adjust it, with a reasonable increase.{2} Peng Zhen attends. Decided: Tan Zhenlin to revise the Later Ten Points and the rules for the poor and lower-middle
        peasants'' associations; Peng Zhen to draft the Center''s directive on socialist education in the cities.{3} Deng: the movement to take four or five years, in town and country;
        the League has only 24 million members, over 7 million past the age.{4}'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 648–49 (June 17, 1964); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 594 (June 17, 1964; the Secretariat meeting decides to revise the "Later
        Ten Points" in the spirit of the May Central Work Conference); [[w.macfarquhar-origins-of-the-cultural]], III, 404 (at the conference''s end the Secretariat decides to revise
        the Latter Ten Points: Tan Zhenlin in charge of it and of the poor and lower-middle peasant associations'' regulations, Peng Zhen of a new directive for the urban five-antis);
        [[w.yang-shangkun-riji]], II, 385 (June 17, 1964; 3:30 to 7 p.m., the regional bureaus'' men there; Yang there; Zhou not named); [[w.deng-xiaoping-nianpu-1904]], III, 1816 (June
        17, 1964; afternoon, 下午; Deng presides at the Secretariat on the questions the Central Work Conference is to settle: the socialist education movement to take four or five years
        in town and country, thoroughly; a full-time cadre for Youth League work and one for women''s work in each commune; the League has only 24 million members, over 7 million past
        the age, fewer than the Party; on grain, the principle of fixed compulsory purchase and assigned purchase in full and negotiated purchase according to means; crop adjustment
        and the adjustment of peasants'' income will take years, one of the main contents of the Third Plan; Tan Zhenlin to preside over revising the Latter Ten Points and the regulations
        on poor and lower-middle peasants'' associations as drafts to go down, Peng Zhen to preside over drafting an instruction on socialist education in the cities); [[w.peng-zhen-nianpu-1902]],
        IV, 339 (June 17, 1964, afternoon; the Secretariat''s 379th meeting; Peng Zhen there; Tan Zhenlin to revise the Later Ten Points and the poor and lower-middle peasants'' associations''
        regulations; Peng Zhen to draft the Center''s directive on socialist education in the cities; class lines in the cities tried first in each region, reported by the regional bureaus);
        [[w.peng-zhen-nianpu-1902]], IV, 339; [[w.deng-xiaoping-nianpu-1904]], III, 1816 (the decisions); [[w.deng-xiaoping-nianpu-1904]], III, 1816. The words: 下午3时半到7时，书记处会议，大区各同志参加，小平主持
