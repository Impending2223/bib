      c: 'Robert Kennedy to Johnson by telephone, 4:05 p.m., from the day''s meeting with Dirksen: an agreement on the civil rights bill. "Congratulations!" Of the civil rights leaders:
        "They''re not going to be happy, but nothing makes them happy." Kennedy suggests Johnson call the senators who helped.'
