        point" (387, citing the Daily Diary). Check: Bernstein, 78, gives the House''s vote 289 to 124. To check: President''s Daily Diary, July 2, 1964 (cited by [[w.branch-pillar-of-fire]],
        387). See [[cal.1964-02-10.civil-rights-bill]]; [[cal.1964-06-10.civil-rights-bill]]. Check: the page.'
