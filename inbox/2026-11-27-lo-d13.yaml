        any possible sudden attack"); [[w.zhai-china-and-the-vietnam]], 132 (the readiness order, not dated). Washington''s knowledge: [FRUS 1964–68, I, doc. 318](https://history.state.gov/historicaldocuments/frus1964-68v01/d318)
