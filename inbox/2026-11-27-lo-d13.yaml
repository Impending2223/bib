      c: House accepts the Senate's bill, [289–126](https://voteview.com/rollcall/RH0880182).{1}
      n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-4-2.pdf) (1964). [President''s Daily Diary, July 2, 1964](https://catalog.archives.gov/id/192443),
        images 4, 7, 8 (LBJ Library; National Archives Catalog). [[w.mann-walls-of-jericho]], 428 (the House''s vote); [[w.kotz-judgment-days]], 153–54; [[w.branch-pillar-of-fire]],
        387–88; [[w.whalen-longest-debate]], 224–28 (Democrats 153–91, eighty-eight of them Southern, Republicans 136–35); [[w.caro-passage-of-power]], 569 (the bill released from Rules
        June 30, over Smith; the House debate July 1; passed the House July 2; not the count); [[w.johnson-white-house-diary]], 173–74 (the news of the House vote, 289 to 126, mid-afternoon);
        [[w.risen-bill-of-the-century]], 239–43 (July 2, 289 to 126, Madden calling up the bill, McCulloch''s and Celler''s ovations; Braskamp''s reading from Leviticus; Smith''s last
