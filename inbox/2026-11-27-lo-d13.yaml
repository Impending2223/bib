- edit:
    id: cal.1964-08-06.civil-rights-the-executive-2
    base: 50318b7d
    set:
      c: 'Johnson and DeLoach by telephone, 2:25 p.m., on the arrests in the Penn case, not yet made: DeLoach recommends that federal authorities make the arrest, not local ones; the
        *Screws* rule bars a federal case on the confessions. Johnson tells of his call to Hoover the day before and congratulates DeLoach on the FBI''s work. Johnson: "I think a soldier
        in uniform ought to have something to do with it. Doesn''t it?"'
      n: '[Johnson and DeLoach, 2:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-cartha-deloach-august-6-1964), Conversation WH6408-09-4781 (Miller
        Center; its summary: DeLoach reports on the progress of the FBI''s investigation of Penn''s murder and recommends that federal authorities, not local ones, make the arrest; Johnson
        reports his call to Hoover "yesterday" and congratulates DeLoach on the FBI''s work; the call not heard here). [[w.branch-pillar-of-fire]], 438 (the *Screws* precedent; Johnson''s
        words). Branch, 437, has the arrests Thursday night, after the call. To check: Screws v. United States, 325 U.S. 91 (cited by [[w.branch-pillar-of-fire]], 438); [[w.branch-parting-the-waters]],
        408–9 (cited by [[w.branch-pillar-of-fire]], 438); Rosen to Belmont, Aug. 6, 1964, FLP-151 (cited by [[w.branch-pillar-of-fire]], 438); Statement of James Lackey, Aug. 6, 1964,
        FLP-151 (cited by [[w.branch-pillar-of-fire]], 438). See [[cal.1964-08-06.civil-rights-the-executive]]. Names: Johnson, DeLoach, Hoover.'
      src:
