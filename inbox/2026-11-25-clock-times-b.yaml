      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 594–595 ("left Peking June 25"; "noon at Chengdu"; Deng: "if we go, go quickly, Mao may think of something and recall us"; Yao Zhen''s old injury to the back, Xiong Fu just over an illness; Wu wished to climb the mountain; "a military order is like a mountain falling"; Wu''s party "wished the mountain well from its foot"); [[w.peng-zhen-nianpu-1902]], IV, 279 (June 25, 1963, evening; Mao''s telegram calls Deng Xiaoping, Peng Zhen and the others back to Peking at once on the Sino-Soviet talks). The time is the first day''s. Made public: 1999. Check: Yang Shangkun''s diary has Mao''s meeting on the evening of June 25 call Deng Xiaoping and the others back to Peking at once, Yang telephoning Deng that night, and Deng''s party back by the afternoon of June 27 ([[w.yang-shangkun-riji]], II, 290). Names: Deng Xiaoping, Peng Zhen, Mao Zedong, Wu Lengxi, Yao Zhen, Fan Ruoyu, Wang Li, Wang Ruilin. Check: whether Deng and Peng Zhen also went to Emei: Wu says only that his party did; Mao''s reason for the recall is not given.'
