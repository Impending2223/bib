- edit:
    id: cal.1960-09-06.vietnam
    base: d29109ca
    kind: reword
    set:
      c: Hanoi, the third national congress of the Vietnam Lao Động (Communist) party. Nuritdin A. Mukhitdinov, head of the Soviet delegation, repeats the Moscow thesis that war can be prevented because the increased strength of Communist countries has changed the international balance of forces in their favor.
- edit:
    id: cal.1960-09-06.vietnam-2
    base: 4ee93b37
    kind: reword
    set:
      c: 'Hanoi, the third national congress of the Vietnam Lao Động party. Li Fuchun, head of the Peking delegation: an "alliance" of Communist forces against imperialism "could prevent war." But "revisionists" are trying to "kill the revolutionary spirit of Marxism and undermine the faith of the working people in general in socialism."'
- edit:
    id: cal.1960-09-06.china-2
    base: ae8f1f0e
    kind: reword
    set:
      c: United Nations. The Soviet Union formally asks the General Assembly to consider admitting Communist China. Gromyko, in a message to Hammarskjold, asks that the agenda of the session opening Sept. 20 include "Representation of China in the United Nations," the Nationalist regime to be unseated and the Peking Government seated. An accompanying memorandum calls the exclusion "a source of enormous damage" to the United Nations.
- names:
    id: cal.1960-09-06.vietnam-2
    add:
    - Li Fuchun
    tags:
    - name:li-fuchun
