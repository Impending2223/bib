      place: geneva
      thread: testing
      follows:
      - cal.1960-07-05.testing
      c: 'Tsarapkin, to newsmen after the session: any American nuclear test, for whatever purpose, without Soviet agreement the Soviet Union would consider a violation of the unofficial moratorium in effect since the talks began.'
