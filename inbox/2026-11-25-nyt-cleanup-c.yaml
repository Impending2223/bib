- edit:
    id: cal.1960-07-05.elections-1960
    base: d758d3d8
    set:
      n: 'John D. Morris, "Johnson Enters Race Officially; Sees 500 Votes," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 18 (not "as of this moment" or the front row); "Transcript of Senator Johnson''s News Conference on His Presidential Candidacy," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 (the two quotations; more than 500, Kennedy fewer than 600; Rayburn to nominate him). [[w.caro-passage-of-power]], 97–98; [[w.young-two-suns-of-the]], 34 (the day); [[w.white-making-of-the-president]], 134 (July 5 the announcement); [[w.shesol-mutual-contempt]], 36 (the announcement, at one o''clock; not Rayburn or the words). [[w.mcpherson-political-education]], 175 (the announcement before a big crowd in the Senate auditorium). To check: *Washington Evening Star*, July 6, 1960 (McGrory) (cited by [[w.caro-passage-of-power]], 97). Names: Johnson, Rayburn, Kennedy, Dodd, Inouye.'
- edit:
    id: cal.1960-06-28.specials
    base: b66c0248
    set:
      n: '[N.D. *Official Abstract*, June 28, 1960, p. 3](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1960-06-28-special.pdf). "Burdick Lead Grows," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (unofficial, forty-six counties: Burdick 104,492, Davis 103,382). See [[cal.1960-03-08.specials]]. Names: Burdick, Davis.'
- add-words:
    id: cal.1960-06-28.specials
    after: end
    words: The State Canvassing Board is to certify the count by July 18, the *New York Times* reports.
    text: '"Burdick Lead Grows," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20'
- edit:
    id: cal.1960-07-05.cuba
    base: fd394199
    set:
      n: '"Text of U.S. Protest to Cuba on Refinery Action," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 2; William J. Jorden, "U.S. Files Protest on Cuban Seizure of Oil Refineries," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 2. Names: Bonsal, Guevara.'
- add-words:
    id: cal.1960-07-05.cuba
    after: it asks the seizure rescinded.
    words: 'The note answers Guevara''s reading of the Mineral Fuel Law of 1938: the article applies only to oil from Cuban soil; the refineries were built under Law Decree 1758 of Nov. 2, 1954, which requires them to refine no Government crude.'
    text: '"Text of U.S. Protest to Cuba on Refinery Action," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 2'
- edit:
    id: cal.1960-07-05.cuba-3
    base: 5c598d70
    kind: correct
    set:
      c: 'Miró Cardona, ambassador-designate to the United States, the revolution''s first Prime Minister, resigns by letter to Dorticós, the "ideological divergencies" past reconciling, and takes asylum in the Argentine Embassy, 7:35 a.m.'
      n: 'Tad Szulc, "Ex-Cuban Premier Quits Regime and Asks Asylum," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 3. The Foreign Ministry''s answer, that afternoon, is entered apart ([[cal.1960-07-05.cuba-6]]). Names: Miró Cardona, Dorticós.'
- add:
    entry:
      id: cal.1960-07-05.cuba-6
      when: July 5
      date: '1960-07-05'
      place: havana
      thread: cuba
      follows:
      - cal.1960-07-05.cuba-3
      c: 'The Foreign Ministry announces Miró Cardona "removed" as ambassador-designate to the United States, in a reorganization of the diplomatic service, and three other ambassadors with him: Manuel Piedra de la Concha, to Italy; Francisco Pividal, to El Salvador; Francisco García Mador, to the United Nations at Geneva.'
      n: 'Tad Szulc, "Ex-Cuban Premier Quits Regime and Asks Asylum," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 3. The order: the announcement "countered" the resignation. See [[cal.1960-07-05.cuba-3]]. Names: Miró Cardona.'
      tags:
      - name:miro-cardona-jose
      time_range:
      - 1960-07-05T17:00Z
      - 1960-07-05T23:00Z
      time_band: afternoon
      time_zone: America/Havana
      range_basis: record
- edit:
    id: cal.1960-07-05.cuba-4
    base: aae474d5
    kind: correct
    set:
      c: 'The Foreign Office discloses Britain''s "strong" note on the seizure of Shell''s refinery, delivered by Fordham, the ambassador: "deepest concern and displeasure"; the refinery to be restored "on a normal footing." No reply.'
      n: 'Walter H. Waggoner, "Britain Protests Shell Plant Loss," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). The question in the Lords is entered apart ([[cal.1960-07-05.cuba-7]]). Check: the note''s day.'
- add-words:
    id: cal.1960-07-05.cuba-4
    after: end
    words: Shell's debt to its crude-oil suppliers, Cuba refusing the remittances, reached $17,000,000 by June, the *New York Times* reports.
    text: 'Walter H. Waggoner, "Britain Protests Shell Plant Loss," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html)'
- add:
    entry:
      id: cal.1960-07-05.cuba-7
      when: July 5
      date: '1960-07-05'
      place: london
      thread: cuba
      also:
      - europe-and-the-alliance-britain
      c: 'The House of Lords. Morrison of Lambeth, Foreign Secretary when Abadan was seized in 1951, asks whether Britain will use "force, even war" over its oil interests in Cuba. Lansdowne, Under Secretary for Foreign Affairs, declines to answer: "a delicate matter."'
      n: 'Walter H. Waggoner, "Britain Protests Shell Plant Loss," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). To check: Hansard, H.L. Deb., July 5, 1960. See [[cal.1960-07-05.cuba-4]].'
      tags:
      - ok:name-untagged
