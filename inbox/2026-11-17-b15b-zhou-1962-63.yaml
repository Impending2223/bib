      - china
      c: Zhou Enlai directs the General Staff of the PLA to study further the new features of the Chiang Kai-shek forces' possible raids on the mainland and the new counter-measures; the General Staff systems at once do so and arrange, and on Nov. 30 a Party committee office meeting makes supplementary rules against raids.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 597 (Nov. 27, 1963). Made public: 1997. Names: Zhou Enlai, Chiang Kai-shek.'
