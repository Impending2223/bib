      date: '1963-12-27'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai and Chen Yi telegraph the Central Committee and the Foreign Ministry: Tunisia has shown a wish to establish relations; having studied it with the delegation members, they think they can take the trip through Tunisia on this tour and settle relations with it.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 604 (Dec. 27, 1963). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
