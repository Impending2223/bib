      c: 'Zhou Enlai receives Sweden''s Ambassador, Petri (斐特里): there are many contradictions in the world, which make diplomacy hard; the chief thing is to establish peaceful coexistence among states of different systems, hard to bring about the world over but possible by degrees.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 551 (Apr. 30, 1963). Made public: 1997. Check: the ambassador''s name in Roman letters. Names: Zhou Enlai.'
