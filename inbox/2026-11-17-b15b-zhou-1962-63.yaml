    entry:
      id: cal.1963-10-01.china-leadership-3
      when: Oct. 1
      date: '1963-10-01'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai "differs," on the International Liaison Department''s report that proposes to sort the greetings of fraternal parties on National Day into left, center and right: few fraternal parties will send greetings and few of those would curse China in public, though some might hint; to sort them so closely hands a handle to others; better print all, or all in extract, in the order received, and let readers judge, with no leaning. Deng Xiaoping to the Department: do it as the Premier says.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 583 (Oct. 1, 1963). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-10-01.china-leadership-4
      when: Oct. 1
      date: '1963-10-01'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives Son Sann, Sihanouk''s private adviser and Governor of Cambodia''s National Bank, on China''s economic construction: the first Five-Year Plan could only copy the Soviet Union, with some gains and much unsuited to China; in the second China sought its own experience and made the general line; three lean years and the Soviet experts'' withdrawal forced self-reliance. The economy now recovers all round; so large a country needs time.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 583 (Oct. 1, 1963). Continues 584. Made public: 1997. Names: Zhou Enlai, Son Sann.'
      tags:
      - polity:prc
      - polity:cambodia
      - name:zhou-enlai
      - name:son-sann
      - vis:only:prc+cambodia
- add:
