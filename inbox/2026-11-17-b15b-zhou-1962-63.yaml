    entry:
      id: cal.1963-10-09.china-leadership
      when: Oct. 9
      date: '1963-10-09'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai receives Ishibashi Tanzan. On a peace treaty with Japan: America''s separate peace and the Japan–Taiwan treaty are the greatest obstacle; China works indirectly, gradually, to win that Japan voids that treaty and signs with it. Of three Japanese feelings for Taiwan, colonialist, militarist and economic, the first two are unjust and opposed; trade with Taiwan China does not oppose. Some in the ruling party set the new China and Taiwan against each other, which ends badly for both. He welcomes the straightforward way of Ishibashi, Matsumura and Takasaki.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 585 (Oct. 9, 1963). Continues 586. Made public: 1997. Names: Zhou Enlai, Ishibashi Tanzan, Matsumura Kenzo, Takasaki Tatsunosuke.'
      tags:
      - polity:prc
      - polity:japan
      - polity:roc
      - name:zhou-enlai
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1963-10-12.china-leadership
      when: Oct. 12
      date: '1963-10-12'
      thread: china-leadership
      c: 'Zhou Enlai, report to the delegates of five specialized conferences of the Central Committee and State Council, on planning, city work, finance, finance and trade, and Sino-Soviet and Sino-Mongolian border defense. To build an independent economic system and the four modernizations China must find its own road; it has no full, successful set of experience yet. For the two years of adjustment the key is far-seeing field investigation in every branch, which will fix the direction and the fifteen-year plan; each commission to go down in batches, to over 800 key farm counties and over 100 key cities with over 80 percent of industrial output. The 1963 plan, set before the northern floods and southern drought, is now tight. Departments: overall balance, self-reliance and thrift, the mass line, work with the hands.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 586 (Oct. 12, 1963). Continues 587. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-10-13.china-leadership
      when: Oct. 13
      date: '1963-10-13'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives Albania''s friendship delegation and its delegation on scientific and technical cooperation: in the thirty years after Lenin''s death Stalin had great merit; the faults and errors of those thirty years Stalin bears much of; in his late years Stalin and other high Soviet cadres seldom went to the villages and lost touch with reality; the larger the country, the likelier bureaucracy, and one oversight makes trouble.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 587 (Oct. 13, 1963). Made public: 1997. Names: Zhou Enlai, Stalin.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - name:stalin-joseph
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1963-10-13.china-leadership-2
      when: Oct. 13
      date: '1963-10-13'
      thread: china-leadership
      also:
      - indonesia
      c: Zhou Enlai receives Sumarno, Indonesia's Minister for Central Bank Affairs, on economic and trade aid. Indonesia's economic trouble he thinks only temporary; the question is how to raise farm output and grain, how to take the enterprises back from imperialism, how to hold the state's foreign trade. Economic work is complex; the private economy cannot be cut off all at once, or one loses the thread; what matters is how the state controls it; economic questions need economic means, besides decrees, with an outlet for private industry and trade, else the economy suffers.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 587 (Oct. 13, 1963). Made public: 1997. Check: the minister''s name in Roman letters (苏玛诺). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:indonesia
      - name:zhou-enlai
      - vis:only:prc+indonesia
