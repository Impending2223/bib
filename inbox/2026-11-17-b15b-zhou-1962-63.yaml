      thread: china-leadership
      also:
      - africa
      - middle-east
      c: 'Zhou Enlai flies by way of Rangoon and Karachi to Cairo. At the airport his written statement: this is his first visit to the UAR and to the African continent; he salutes all the newly independent African states and peoples and all the peoples now in struggle. Chen Yi, who attended Kenya''s independence celebrations, reaches Cairo from Nairobi to go with him.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 600 (Dec. 14, 1963). Continues 601. Names: Zhou Enlai, Chen Yi.'
