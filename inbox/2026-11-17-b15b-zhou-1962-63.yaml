      c: Zhou Enlai with Li Xiannian, Yao Yilin and Ye Jizhuang on foreign trade.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 504 (Oct. 22, 1962). Made public: 1997. Names: Zhou Enlai, Li Xiannian, Yao Yilin, Ye Jizhuang.'
