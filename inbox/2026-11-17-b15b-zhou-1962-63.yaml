      when: Oct. 24
      date: '1962-10-24'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives the UAR''s Ambassador, Zakaria Adli Imam, and takes from him Nasser''s letter on the Sino-Indian border. He gives China''s account: three proposals to negotiate refused before the conflict; India demands a withdrawal first; the 1959 offer of a 20-kilometer pullback and no patrols refused, China withdrew alone, India sent troops in; the "forward policy" provoked the clashes and on Oct. 6 India refused talks a third time. China fights back under a full attack and holds to reopening talks.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 505 (Oct. 24, 1962). Continues 506. Made public: 1997. Check: the ambassador''s name in Roman letters (查卡里亚·阿德利·伊马姆). Names: Zhou Enlai, Zakaria Adli Imam, Nasser.'
      tags:
      - polity:prc
      - polity:uar
      - polity:india
      - name:zhou-enlai
      - name:nasser-gamal-abdel
      - vis:only:prc+uar
