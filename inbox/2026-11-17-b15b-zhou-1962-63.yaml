      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-07.china-leadership-3
      when: Jan. 7
      date: '1962-01-07'
      thread: china-leadership
      c: Zhou Enlai visits Manya Reiss (玛尼亚·吕思), an American Communist Party member ill in Peking, for Deng Yingchao; tells her how to convalesce and asks about the American Party members working in China; hopes they will offer their views on the Chinese Party's work. She praises his words at the CPSU's 22nd Congress; he says the Party decided and he carried it out.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 450 (Jan. 7, 1962). Made public: 1997. Names: Zhou Enlai, Deng Yingchao, Manya Reiss.'
      tags:
      - polity:prc
      - polity:us
      - name:zhou-enlai
      - vis:only:prc+us
- add:
    entry:
      id: cal.1962-01-08.china-leadership
      when: Jan. 8
      date: '1962-01-08'
      thread: china-leadership
      c: 'Zhou Enlai redrafts the Central Committee''s decision to cut the urban population by 7 million in the first half of 1962, 5 million of them workers, to be done before spring sowing or the summer harvest. Reason: 1961 cut 13 million, 9.5 million of them workers, against a plan of 20 million. The Center issues the decision Feb. 14. A note: in December 1961 he had drafted a cut of 8 million.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 450–51 (Jan. 8, 1962), 451 n. (the December 1961 draft). Made public: 1997. To check: the draft and the decision of Feb. 14, 1962. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-01-08.china-leadership-2
      when: Jan. 8
      date: '1962-01-08'
      thread: china-leadership
      c: 'Zhou Enlai receives Abdyl Këllezi, head of Albania''s government delegation and Vice-Chairman of the Council of Ministers. On the experts'' plans for Albania, large and complete and slow to draw: the Chinese engineers'' ideas of construction do not fit Mao''s frugal building of the country; a meeting is now taking up the same fault in China; from the first Five-Year Plan China copied the Soviet Union, and its thinking was never made Chinese.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 451 (Jan. 8, 1962). Made public: 1997. Names: Zhou Enlai, Abdyl Këllezi, Mao Zedong.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc+albania
