- add:
    entry:
      id: cal.1962-04-25.china-leadership
      when: Apr. 25
      date: '1962-04-25'
      thread: china-leadership
      c: 'Zhou Enlai revises the Finance and Economic Group''s report on the 1962 plan to adjust the economy, drafted with Li Xiannian, on the other Standing Committee members'' views. The revised draft names the gaps still open: grain receipts and expenses; goods against purchasing power; the budget deficit, still to grow; coal output against distribution; raw materials short; short-haul transport severely short. Mao on it: "Return to the Premier. This is more realistic, and can serve as the basis for a small Central meeting with the regional secretaries in the first ten days of May."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 473 (Apr. 25, 1962). Made public: 1997. To check: the revised draft; Mao''s comment. Names: Zhou Enlai, Li Xiannian, Mao Zedong.'
      tags:
