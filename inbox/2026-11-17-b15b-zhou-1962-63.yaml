      thread: china-leadership
      also:
      - africa
      - indonesia
      c: Zhou Enlai leaves Kunming on an invited visit to the United Arab Republic, the Democratic and Popular Republic of Algeria and the Kingdom of Morocco. Before leaving, at the airport, he receives the athletes back from the first Games of the New Emerging Forces, praises their spirit in winning honor for the country and also points out the faults shown in the contests.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 600 (Dec. 13, 1963). Names: Zhou Enlai.'
