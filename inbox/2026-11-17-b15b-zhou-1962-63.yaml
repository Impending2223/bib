      when: Jan. 1
      date: '1962-01-01'
      thread: china-leadership
      c: 'Zhou Enlai, at Chen Yi''s banquet for foreign experts: thanks them for their help in China''s socialist construction.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 449 (Jan. 1, 1962). Names: Zhou Enlai, Chen Yi.'
