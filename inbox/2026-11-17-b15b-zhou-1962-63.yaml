      date: '1963-12-26'
      thread: china-leadership
      also:
      - africa-algeria-morocco
      c: Zhou Enlai tells Claude Gault (克鲁德·高达), of the French *Observateur*, that as a plain man his strongest impression of Algeria is the strength of the Algerians' revolutionary spirit; they have healed the wounds of war and gone forward on the revolutionary road.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 604 (Dec. 26, 1963). Check: the journalist''s name in Roman letters. Names: Zhou Enlai.'
