      when: Jan. 22
      date: '1962-01-22'
      thread: china-leadership
      c: Zhou Enlai, revising the report's part on centralism, cuts the share of capital investment the state hands down to the localities from 15–20 percent to 10–15; for the key industrial enterprises already handed down, the line "must be taken back in the first quarter of 1962" becomes "arranged within 1962 and taken back by stages."
      n: '[[w.zhou-enlai-nianpu-1949]], II, 453 (Jan. 22, 1962). Made public: 1997. Names: Zhou Enlai.'
