      when: Jan. 6
      date: '1963-01-06'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai drafts the Chinese government''s memorandum to Ceylon''s Prime Minister: after talks China is ready to accept the six states'' proposals as a preliminary basis for a meeting of officials, on two understandings. A: its frontier forces withdraw 20 kilometers along the whole border, and the rule that India keep its present posts applies to the whole border, not the west only. B: withdrawing beyond the line of actual control of Nov. 7, 1959, they will leave places such as Chedong and Longju, Wuje and the 43 western posts empty of Chinese troops, and China will set up no civil checkposts there if India''s troops and civil staff stay out. Jan. 7 he writes a supplementary letter.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 6, 1963). Made public: 1997. To check: the memorandum and the letter of Jan. 7. Names: Zhou Enlai, Srimavo Bandaranaike.'
      tags:
