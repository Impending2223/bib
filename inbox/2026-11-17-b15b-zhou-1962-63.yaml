      when: June 15
      date: '1962-06-15'
      thread: china-leadership
      c: Zhou Enlai visits the Dongguan Model School of his boyhood (now Shenyang's Sixth Middle School).
      n: '[[w.zhou-enlai-nianpu-1949]], II, 484 (June 15, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-16.china-leadership
      when: June 16
      date: '1962-06-16'
      thread: china-leadership
      c: 'Zhou Enlai at the Changchun tractor plant and the First Auto Works. He tries a Liberation truck. To the plant''s heads on its tasks: besides trucks, to support agriculture and national defense, and to take on aid to foreign countries.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 484 (June 16, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-17.china-leadership
      when: June 17
      date: '1962-06-17'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the Changchun Film Studio and the synthetic fiber plant. To the film people: film music must not outshine the picture; films should bring out the theme, the figures and the language; a film worker must study Mao''s Yan''an Talks on literature and art and serve workers, peasants and soldiers.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 484 (June 17, 1962). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-17.china-leadership-2
      when: June 17
      date: '1962-06-17'
      thread: china-leadership
      c: 'Zhou Enlai, on a report on building two railway bridges, the Tanglin and Changlin lines: agrees to add forestry capital investment of 2.01 million yuan for the two, the Ministry of Railways to build them and the materials to come from the railway and forestry ministries, any shortfall from the Economic Commission. That afternoon he goes to Harbin.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 484 (June 17, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-18.china-leadership
      when: June 18
      date: '1962-06-18'
      thread: china-leadership
      c: 'Zhou Enlai at a shell plant, a light-alloy plant and an aircraft repair plant; at the Heilongjiang farm machinery institute watches two ridging machines. Seeing the old plow, seven men pushing it in the dust, he has it stopped: too hard on poor and lower-middle peasants, tiring, dust, poor quality, must be solved; of the new seven-share ridging plow: good, make more to replace it and ease the farmers'' labor.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 484 (June 18, 1962). Continues 485. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-19.china-leadership
      when: June 19
      date: '1962-06-19'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai to Heilongjiang''s provincial committee: cutting staff and urban population in the second half-year is the basic way out; investigators are first to examine the higher organs'' errors and mend the error of "unwittingly forming a privileged stratum." On farm machines: not the Soviet big ones, but large, medium and small together. He criticizes the 20 million yuan spent on the North Building.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 485 (June 19, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-19.china-leadership-2
      when: June 19
      date: '1962-06-19'
      thread: china-leadership
      c: Zhou Enlai at the Harbin power plant; evening, to Fularji, outside Qiqihar, known for heavy machinery.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 485 (June 19, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-20.china-leadership
      when: June 20
      date: '1962-06-20'
      thread: china-leadership
      c: 'Zhou Enlai at the Fularji heavy machinery plant and the special steel plant: trust the masses and arouse them; the workers are the masters of the state and to be trusted and relied on. Then to Qiqihar, a gun factory among others.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 485 (June 20, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-20.china-leadership-2
      when: June 20
      date: '1962-06-20'
      thread: china-leadership
      c: 'Zhou Enlai, evening, hears Yu Qiuli and Kang Shi''en on the Daqing oilfield campaign; late at night, urged to rest: the older, the more work to do.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 485 (June 20, 1962). Made public: 1997. Names: Zhou Enlai, Yu Qiuli, Kang Shi''en.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-21.china-leadership-2
      when: June 21
      date: '1962-06-21'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at Saertu (now Daqing city), to inspect the Daqing oilfield. He meets the Ministry of Petroleum''s engineers, goes up on drilling teams 1202 and 1203 and shakes hands with the crews: "I was a worker too." At the North Second water-injection station he praises its job-responsibility system. Hardship is a fact; hold to self-reliance and it will come right. He commends Daqing''s scattered settlements joining industry with farming, town with country.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 485 (June 21, 1962). Continues 486; footnote: he later put it in sixteen characters, the building line of the Daqing mining area. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-22.china-leadership-2
      when: June 22
      date: '1962-06-22'
      thread: china-leadership
      c: 'Zhou Enlai arrives at Yanji, capital of the Yanbian Korean autonomous prefecture, Jilin; visits the Yanbian farm machinery plant, Yanbian University and the medical college. At the plant, told a five-share plow takes a ton and a half of steel: can it be changed? at the university the students'' dormitories; at the college the experiment equipment, and a lecture.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 486 (June 22, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-23.china-leadership
      when: June 23
      date: '1962-06-23'
      thread: china-leadership
      c: 'Zhou Enlai on the way to the Yanbian Agricultural College: protect the forests, a matter of the country and the people, or descendants will curse us; water is the lifeblood of farming, survey reservoirs, figure them, make a plan and build one by one; to talk with the peasants on soil and water conservation.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 486 (June 23, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-23.china-leadership-2
      when: June 23
      date: '1962-06-23'
      thread: china-leadership
      c: 'Zhou Enlai at the Yanbian prefectural committee''s standing committee: the army, in building works, barracks, roads, clearing land and target practice, must protect the forests; the towns have too many people and workers'' families should go into farming, a way out.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 486 (June 23, 1962). Continues 487. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-23.china-leadership-3
      when: June 23
      date: '1962-06-23'
      thread: china-leadership
      c: 'Zhou Enlai at the orchard nursery of the Yanbian Agricultural College: keep joining teaching with productive labor, raise more apple and pear seedlings fit for the place, plant the gullies and hills; the school farm to serve as a model. At the home of a Korean member of Xinfeng brigade, Changbai commune, asks about land, people, rice, livestock, grain and fuel. Night train to Jilin, arrives deep in the night; to avoid disturbing the town, gets off at dawn.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 487 (June 23, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
