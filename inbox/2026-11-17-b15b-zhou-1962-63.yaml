    entry:
      id: cal.1963-02-18.china-leadership
      when: Feb. 18
      date: '1963-02-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the Chinese Pingju Theatre''s *Seizing the Seal*: the orchestra is too big and should move from the pit onto the stage; played loud it drowns the singing so a good play cannot be heard. Feb. 26 he sees it again and calls the large orchestra, built without regard to conditions, a waste. Western things are not excluded and should be done well, but the needs of a master of art and the needs of the audience are different; he calls on musicians to reform from the people''s need and make the music more national; art must teach the young and answer to the next generation.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 534 (Feb. 18, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-21.china-leadership-2
      when: Feb. 21
      date: '1963-02-21'
      thread: china-leadership
      also:
      - cuba
      c: 'Zhou Enlai receives the Cuban government''s economic delegation under Alberto Mora: any party that relies on the masses is a good party; the masses can tell who is anti-imperialist, a true Marxist-Leninist, a revolutionary, who leads as a vanguard and serves the people, and who a bureaucrat; a dialectical and historical materialist must be conscious; "not to advance is to retreat," for what stands still while others advance falls back.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 534 (Feb. 21, 1963). Continues 535. Made public: 1997. See [[cal.1963-02-21.china-leadership]]. Names: Zhou Enlai, Alberto Mora.'
      tags:
      - polity:prc
      - polity:cuba
      - name:zhou-enlai
      - vis:only:prc+cuba
- add:
