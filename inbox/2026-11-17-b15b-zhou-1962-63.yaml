      when: Oct. 25
      date: '1963-10-25'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai and Chen Yi talk with Faure. Both sides should state their wish to establish relations, exchange ambassadors, France recognize the People's Republic and not recognize a second China. In the talks a tacit understanding must be reached beforehand, that France recognizes only one China and does not mean to make Taiwan a second China or an "independent state"; then a solution can sooner or later be found; China makes no bargain of principle on any international question.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 591 (Oct. 25, 1963). Continues 592. Made public: 1997. Names: Zhou Enlai, Chen Yi, Edgar Faure.'
      tags:
