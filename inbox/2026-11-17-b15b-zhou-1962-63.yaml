      when: Sept. 1
      date: '1963-09-01'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai at Soong Ching-ling's, to talk over the invitation to visit Ceylon.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 576 (Sept. 1, 1963). Made public: 1997. Names: Zhou Enlai, Soong Ching-ling.'
