      when: Jan. 2
      date: '1963-01-02'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai, after hearing Bandaranaike set out the principles of the six-state proposals on the Sino-Indian conflict, tells her the conference's view of the truth of the conflict is skewed. Frankly, China perhaps yielded too much after the conflict began, which brought endless demands; had it stood fast, neutral good offices might have asked each side to give up fifty-fifty.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 523 (Jan. 2, 1963). Made public: 1997. Names: Zhou Enlai, Srimavo Bandaranaike.'
      tags:
      - polity:prc
      - polity:ceylon
      - polity:india
