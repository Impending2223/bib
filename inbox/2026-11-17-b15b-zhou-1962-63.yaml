      date: '1962-06-11'
      thread: china-leadership
      c: 'Zhou Enlai at the Northeast Bureau departments'' meeting on the market: the Northeast is an important base of the country with great achievements, but large difficulties remain and the whole country must support it.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 482 (June 11, 1962). Continues 483. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-12.china-leadership
      when: June 12
      date: '1962-06-12'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai at the Anshan Iron and Steel Company. He tells his party to go light and will not stay in a new guesthouse while places in the country are hard up. In the cold-rolling mill he finds the 1.2-meter mill idle because the Soviet side broke its contract: if the guesthouse money had gone here! He urges self-reliance, visits the kitchens, gate lodge and clinic where he lives, and returns to Shenyang that evening.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 483 (June 12, 1962). Footnote: Anshan built the mill itself by 1964. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-13.china-leadership
      when: June 13
      date: '1962-06-13'
      thread: china-leadership
      c: 'Zhou Enlai tours the Shenyang tractor plant in the rain: asks about tractor quality, whether peasants like them and what implements go with them; wants the technical section to compile the facts: how much steel, above all copper, a tractor takes. He walks out in the rain with the workers; in the afternoon, the Songling machinery (aircraft) plant, asks the worker Wang Chuankang for his views of the government''s work; refuses an umbrella held for him alone.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 483 (June 13, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-14.china-leadership
      when: June 14
      date: '1962-06-14'
      thread: china-leadership
      c: 'Zhou Enlai with the central ministers who came with him, and with the Northeast Bureau and the three provinces'' heads, on work: cutting the urban population, saving grain, forestry, the market, stock-taking and asset checks.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 483 (June 14, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-15.china-leadership
      when: June 15
      date: '1962-06-15'
      thread: china-leadership
      c: 'Zhou Enlai at Tieling county, to investigate. At Digong brigade, Pingdingbao commune, he asks the members of their living and production, hears the difficulties, says they are temporary and he will carry the poor and lower-middle peasants'' wishes to the Center and Mao. He weeds with them, visits the old and children, and climbs Longshou hill with Deng Yingchao, recalling his schooldays there. During the stay at Shenyang (undated), to his household staff: no fish, eggs or meat; leaders must not be exceptions when the masses are in difficulty.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 483 (June 15, 1962). Continues 484. Made public: 1997. Names: Zhou Enlai, Deng Yingchao, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1962-06-15.china-leadership-2
      when: June 15
      date: '1962-06-15'
      thread: china-leadership
      also:
      - korea
      c: Zhou Enlai at Shenyang receives the Korean Supreme People's Assembly delegation passing through, and talks with the guests; that night he leaves for Changchun.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 484 (June 15, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:dprk
      - name:zhou-enlai
      - vis:only:prc+dprk
