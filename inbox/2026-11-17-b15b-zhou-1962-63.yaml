      id: cal.1962-04-27.china-leadership-4
      when: Apr. 27
      date: '1962-04-27'
      thread: china-leadership
      c: 'Zhou Enlai receives Ghana''s Ambassador, Bina Kexi (比纳·克西), and sums up the experience of China''s revolution and construction: achievements the main thing, faults always there, but relying on the people and drawing lessons China can lead them on.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 474 (Apr. 27, 1962). Made public: 1997. Check: the ambassador''s name in Roman letters. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ghana
      - name:zhou-enlai
      - vis:only:prc+ghana
- add:
    entry:
      id: cal.1962-04-28.china-leadership
      when: Apr. 28
      date: '1962-04-28'
      thread: china-leadership
      c: Zhou Enlai at the Central Finance and Economic Group's meeting with the directors of the regional economic commissions; it discusses and finally revises the Central Committee's draft directive issuing the 1962 plan to adjust the economy and the State Planning Commission group's outline for its report.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 474 (Apr. 28, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-30.china-leadership
      when: Apr. 30
      date: '1962-04-30'
      thread: china-leadership
      c: 'The Central Committee issues its directive on the 1962 plan to adjust the economy, as Zhou Enlai revised it. It faults the main cadres of some places and departments for too little resolve, so the adjustment goes slowly. The key: restore farm output fast; the most urgent step, shorten the industrial and construction fronts, close, merge or shrink factories, cut staff and urban population hard.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 474 (Apr. 30, 1962). Made public: 1997. To check: the directive as issued. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-28.china-leadership-2
      when: Apr. 28
      date: '1962-04-28'
      thread: china-leadership
      c: 'Zhou Enlai receives Poland''s Ambassador, Knote (克诺泰): the American farm has passed its test, solving agriculture before industry; Japan''s half-mechanization and chemical farming grew after the Second World War; taking capitalist experience, adding the socialist system and a true grasp of farming''s importance, China can catch up fast.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 475 (Apr. 28, 1962). Made public: 1997. Check: the ambassador''s name in Roman letters. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:poland
      - name:zhou-enlai
      - vis:only:prc+poland
- add:
    entry:
      id: cal.1962-04-30.china-leadership-2
      when: Apr. 30
      date: '1962-04-30'
      thread: china-leadership
      c: 'Zhou Enlai at the first meeting of the Fourth Committee of the All-China Youth Federation, on streamlining and thrift: factories and schools must close, suspend or merge some, a test of hard times; the cut people must be placed; youth cannot all go on to school. May 1 he phones the presidium: all those cut are to be taken on by the state to the end, with housing, work and a living; anyone seeing otherwise may write to him.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 475 (Apr. 30, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-04-30.china-leadership-3
      when: Apr. 30
      date: '1962-04-30'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai agrees to Mao''s view that Saifudin go back to work in Xinjiang, and tells him of the flight of border people from Tacheng, Yumin and Huocheng: the causes outer and inner, for years the work heeded little the national, religious and local economic character; mass crossings to be dealt with by law. Departments draft from his talk the Center''s directive on those who fled and returned and rules on closing the Sino-Soviet border in Xinjiang; he settles them, to go out in mid-May.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 475 (Apr. 30, 1962). Made public: 1997. To check: the directive and the rules. See [[cal.1962-04-27.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong, Saifudin.'
