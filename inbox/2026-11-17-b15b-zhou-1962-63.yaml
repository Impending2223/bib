      when: June 24
      date: '1962-06-24'
      thread: china-leadership
      c: Zhou Enlai at the Fengman power plant at first light; then the Jilin chemical fertilizer plant and the calcium carbide plant.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 487 (June 24, 1962). Made public: 1997. Names: Zhou Enlai.'
