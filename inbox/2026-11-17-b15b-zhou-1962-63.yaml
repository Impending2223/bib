      thread: china-leadership
      also:
      - south-asia
      - middle-east
      c: Zhou Enlai alone with Nasser in the morning. On the Sino-Indian border, Nasser suggests China yield once more; Zhou says China has yielded twice and can yield nothing more.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 603 (Dec. 20, 1963). Made public: 1997. Names: Zhou Enlai, Nasser.'
