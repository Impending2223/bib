      thread: china-leadership
      c: Zhou Enlai at the Central Committee's meeting on the fifteen-year plan targets for the national economy and other matters.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 576 (Aug. 27, 1963). Made public: 1997. Names: Zhou Enlai.'
