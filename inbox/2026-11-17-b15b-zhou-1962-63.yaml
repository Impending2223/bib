      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-01.china-leadership-2
      when: Sept. 1–20
      date: '1963-09-01'
      thread: china-leadership
      c: Zhou Enlai holds meetings with persons concerned on grain and cotton, Sept. 1, 7, 11, 16, 17 and 20, and hears reports on grain and cotton and talks of them with the regional bureaus' heads.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 576 (Sept. 1–20, 1963). Made public: 1997. Check: the nianpu prints "17月" for the fifth date. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-04.china-leadership
      when: Sept. 4
      date: '1963-09-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the Shanghai Opera''s dance-drama *The Small Sword Society*: reviving the old does not do, worshipping the foreign does less; first trust our own nation''s, take its essence and drop the dross; to borrow foreign things they must fit China''s history and be well blended, not soldered on to the Chinese.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 576 (Sept. 4, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-05.china-leadership-2
      when: Sept. 5
      date: '1963-09-05'
      thread: china-leadership
      c: 'Zhou Enlai at the Secretariat on the procedure of the Central work conference. Next year''s plan: the water-works funds and border-defense funds are to rise, but to be planned well. Grain is the tightest: the figures from the localities are still four or five million tons short, to be settled with the regional heads; the Northeast cannot send, Inner Mongolia only some, the provinces count and little can be sent, so low standards and melons and vegetables in place of grain; imports not to be more.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 576 (Sept. 5, 1963). Continues 577. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-05.china-leadership-3
      when: Sept. 5
      date: '1963-09-05'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai at the State Council's conference of eight provinces on production and relief from the disasters; in the half-month after he calls persons concerned many times on relief.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 577 (Sept. 5, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-05.china-leadership-4
      when: Sept. 5
      date: '1963-09-05'
      thread: china-leadership
      also:
      - africa
      - soviet-union
      c: 'Zhou Enlai receives the delegation of the Kenya African National Union and answers why China opposes the three-power treaty: it is a great fraud, not a first step but a dangerous one, binding the hands of peace-loving states while the three go on with nuclear blackmail. Africa and Latin America could first be nuclear-free; if Africa proposes it, China will agree first. For African states the first task is anti-imperialism, the second independence for each nation, the third real independence.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 577 (Sept. 5, 1963). Made public: 1997. Check: Kenya was then a British colony. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-06.china-leadership-2
      when: Sept. 6
      date: '1963-09-06'
      thread: china-leadership
      c: 'Zhou Enlai presides at the opening of the Central work conference and explains matters tied to the 1964 plan and the 1965 control figures. The Center agrees with Mao that 1963–65 be a transition stage, going on with adjusting, consolidating, filling out and raising and developing. After it a fifteen-year design: to set up basically an independent national economic or industrial system, then some fifteen years more, within the twentieth century, to build a strong socialist country with the four modernizations. Nine questions for outside the conference: the 1964 plan; relief; cotton; grain; timber; economic recovery; foreign trade; finance; city work.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 577 (Sept. 6, 1963). Continues 578. Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-07.china-leadership
      when: Sept. 7
      date: '1963-09-07'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the State Council''s conference of eight provinces on production and relief: the north''s flood is the worst in six hundred years, concentrated and sudden; the rescue shows the cadres stand risk. This is a partial disaster in a harvest year; grain and cotton are up overall; from next year other crops to be taken up too. Back home some are to manage relief, some production and foreign trade; use local money and materials first, the Center adding what falls short.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 578 (Sept. 7, 1963). Continues 579. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-07.china-leadership-2
      when: Sept. 7
      date: '1963-09-07'
      thread: china-leadership
      c: Zhou Enlai reads the Finance and Trade Office's report on some grain policy questions and has it printed for the Central work conference to discuss further.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 578 (Sept. 7, 1963). Continues 579. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-09-10.china-leadership
      when: Sept. 10
      date: '1963-09-10'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai agrees in principle to the report on several measures to strengthen broadcasts to the Soviet Union and Eastern Europe; on "added staff": it should go to the Establishment Commission to be examined; technicians to be asked for from the Ministry of Education; the aerial work team may be taken from this year''s demobilized soldiers.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 579 (Sept. 10, 1963). Made public: 1997. Names: Zhou Enlai.'
