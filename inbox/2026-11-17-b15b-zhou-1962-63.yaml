      when: Dec. 17
      date: '1963-12-17'
      thread: china-leadership
      also:
      - middle-east
      c: Zhou Enlai goes with Ali Sabri to Port Said. At the memorial hall for the martyrs of 1956 he writes of respect for them; he sees the Suez Canal Authority, the canal entrance, port and shipyard. At the mayor's rally he praises the UAR's running of the canal, built by Arab sweat and blood and defended at heavy cost. In the afternoon he flies back to Cairo.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 601 (Dec. 17, 1963). Continues 602. Names: Zhou Enlai, Ali Sabri.'
      tags:
      - polity:prc
      - polity:uar
      - name:zhou-enlai
      - name:sabri-ali
