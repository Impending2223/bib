- add:
    entry:
      id: cal.1963-12-02.china-leadership
      when: Dec. 2
      date: '1963-12-02'
      thread: china-leadership
      c: 'Zhou Enlai at the Fourth Session of the Second NPC, report on the international situation, socialist education and the plan of the transition stage. In it he gives eight principles of China''s foreign aid. Of class struggle in China: socialist education is only a beginning; teach, hold no struggle meetings; leading cadres to criticize bureaucracy, settle in a place and work with their hands; promote young and middle-aged able cadres. For the three transition years an all-round arrangement and balance. He names sixteen problems for the next two or three five-year plans.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 597 (Dec. 2, 1963). Continues 598; the eight principles are given in fuller form Jan. 15, 1964. To check: the report as printed. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
