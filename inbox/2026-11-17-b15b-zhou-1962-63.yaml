      date: '1962-12-13'
      thread: china-leadership
      c: 'Zhou Enlai at the Ministry of Education''s report: adjusting the college courses matters and is to be done well; in the Third Five-Year Plan higher education is mainly to raise quality; keep scholars among the old, weak, sick and disabled, even as advisers; teachers'' length-of-service pay may start first for the primary teachers in hard straits; students are to be held to strict demands, first the children of cadres, and the Ministry is to be a "Bao Wenzheng."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 519 (Dec. 13, 1962). Made public: 1997. Names: Zhou Enlai.'
