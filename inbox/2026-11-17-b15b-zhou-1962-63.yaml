      when: Apr. 20
      date: '1962-04-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives the Soviet trade and economic delegation under Foreign Trade Minister Patolichev. Sino-Soviet trade will grow, only a matter of time; differences of view and trade troubles can be overcome; the volume cannot jump for objective reasons but the direction is right; he asks about it himself daily. On trade with capitalist countries: keep it under good control, reckon every deal in politics as well as economics. With Africa and other undeveloped states: it is good for them; China asks no privilege, attaches no political terms, and aims to help their national economies toward independence.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 472 (Apr. 20, 1962). Made public: 1997. Names: Zhou Enlai, Patolichev.'
