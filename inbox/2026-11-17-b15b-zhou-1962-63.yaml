      when: Oct. 9
      date: '1962-10-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Shenyang Drama Troupe''s cast of *The Army at the Gates*: the drama schools should from the start teach the study of lines; the stage actor''s chief tool is his lines; he needs basic skill and the thought of an audience of a thousand and more, to be heard and understood by each.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 502 (Oct. 9, 1962). Check: the play''s title in English (兵临城下). Names: Zhou Enlai.'
      tags:
      - polity:prc
