      c: 'Zhou Enlai at the Cuban black musician Ignacio Villa''s last solo concert in China and the farewell reception of the Commission for Cultural Relations with Foreign Countries: praises his voice as the voice of the Cuban and Latin American peoples and of the Cuban people''s joy; introduces the Chinese artists Bai Yang, Zhou Xiaoyan and Guo Shuzhen; asks about the Cuban students'' study and life in China and hopes their schools arrange it better.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 469 (Apr. 6, 1962). Continues 470. Names: Zhou Enlai, Ignacio Villa.'
