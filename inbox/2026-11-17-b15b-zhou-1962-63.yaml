      id: cal.1962-10-17.china-leadership
      when: Oct. 17
      date: '1962-10-17'
      thread: china-leadership
      c: 'Zhou Enlai, at the forum of democratic personages Liu Shaoqi holds, on the Eighth Central Committee''s Tenth Plenum. What counts is that the economy improves day by day; since the enlarged Central work conference and the eight-character line, the adjustment has done well in every field; the working line now is to go on adjusting. Agriculture is to develop all round: grain, and cotton, oil and other cash crops in balance, forestry, livestock, fisheries and side occupations.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 502 (Oct. 17, 1962). Continues 503. Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
      tags:
