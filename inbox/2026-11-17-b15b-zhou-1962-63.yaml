    entry:
      id: cal.1963-11-01.china-leadership-2
      when: Nov. 1
      date: '1963-11-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai and Chen Yi fly with Faure to Shanghai; there, with Chen Yi, Zhou puts a "new direct plan for establishing relations": France''s government sends China''s a formal note recognizing the People''s Republic as the only lawful government and proposing at once to establish relations and exchange ambassadors; China answers welcoming it; both publish the notes at once and set up embassies. They also come to a tacit understanding that De Gaulle and the French government do not back "two Chinas." The plan goes that night to Mao, Liu and Deng; Mao writes early next morning: "Very good, do it so." The Chinese side gives Faure "Main Points of Premier Zhou Enlai''s Talk"; later China agrees to a joint communique in place of an exchange of notes.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 592 (Nov. 1, 1963). Continues 593. Made public: 1997. See [[cal.1963-10-31.china-leadership]]. Names: Zhou Enlai, Chen Yi, Edgar Faure, De Gaulle, Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - polity:fr
      - polity:roc
      - name:zhou-enlai
