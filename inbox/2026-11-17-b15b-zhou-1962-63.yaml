- add:
    entry:
      id: cal.1963-08-13.china-leadership-2
      when: Aug. 13–14
      date: '1963-08-13'
      thread: china-leadership
      c: 'Zhou Enlai at the Secretariat, Aug. 13 and 14, on the 1964 national economic plan and other matters. On support for agriculture: "sprinkling pepper" leaves wide gaps and farming gets nothing direct. When Bo Yibo speaks of industrial and commercial losses he breaks in: losses planned are to be kept apart from losses of poor management. The meeting decides to set up a committee to draft the decision on industrial development under Deng Xiaoping, with Zhou, Peng Zhen, Li Fuchun, Li Xiannian and others.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 573 (Aug. 13–14, 1963). Made public: 1997. Names: Zhou Enlai, Bo Yibo, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:bo-yibo
      - name:deng-xiaoping
      - name:peng-zhen
      - name:li-fuchun
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-15.china-leadership
      when: Aug. 15–29
      date: '1963-08-15'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: Zhou Enlai in five talks, Aug. 15, 17, 18, 25 and 29, with Nguyễn Văn Linh (Mười Cúc, 阮梅菊 in the nianpu), a leader of the Vietnam Workers' Party's Southern Bureau, on Sino-Soviet relations and the struggle in South Vietnam. Marxism-Leninism comes from the real struggle; the principles of the forerunners, Marx, Engels, Lenin and Stalin, are to be learned and studied and above all joined to the masses' actual struggle and developed, so that the masses truly hold them; it is a guide to action, not a dogma.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 573 (Aug. 15–29, 1963). Made public: 1997. Names: Zhou Enlai, Nguyễn Văn Linh.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1963-08-16.china-leadership
      when: Aug. 16
      date: '1963-08-16'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the Ministry of Culture''s forum on music and dance, on national and popular character: one cannot take in the world''s good things and fuse them in fourteen years; art must stand on its national base; a hundred flowers, push out the old, a hundred schools, stress the present, are the line; China''s art starts from the 650 million, among them workers, peasants and soldiers. He speaks too of ideological content, standards of art and forms.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 573 (Aug. 16, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-17.china-leadership
      when: Aug. 17
      date: '1963-08-17'
      thread: china-leadership
      c: 'Zhou Enlai at the State Council''s second national conference on cotton output in the main cotton counties: good purchase makes good processing; for good purchase the prize-sale policy must be kept; where the conditions allow, raise other farm fibers too, hemp, silk and wool; leadership must be strengthened. Aug. 19 he calls a meeting on the State Council''s instruction on cotton and on forming work groups to raise cotton output; Aug. 25 the State Council transmits the conference''s two proposals, on the main points of work now and on the main technical measures to raise next year''s cotton crop.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 573 (Aug. 17, 1963). Continues 574. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-18.china-leadership
      when: Aug. 18
      date: '1963-08-18'
      thread: china-leadership
      also:
      - indonesia
      - japan
      c: 'Zhou Enlai receives and dines the Indonesian football team and other sports delegations; of the New Emerging Forces Games to come: a new force at its birth looks weaker and smaller than the old, as a newborn child is smaller and weaker than an old man, but which has life, which has a future? the child, not the old man. The same day he watches a China–Japan volleyball match.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 574 (Aug. 18, 1963). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:indonesia
      - polity:japan
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-08-20.china-leadership
      when: Aug. 20–24
      date: '1963-08-20'
      thread: china-leadership
      c: 'Zhou Enlai at the drafting committee for the Central Committee''s decision "On Industrial Development," Aug. 20–24. Aug. 23 he agrees with Deng Xiaoping that "base on reality, look to the future" starts the line, with four additions: sum up fourteen years'' experience, plus and minus; estimate the present rightly, from a few basic figures; set a far aim, the four modernizations within twenty-three years or the twentieth century, not being first in the world; grasp China''s mark: large country, rich resources, many people, heavy task.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 574 (Aug. 20–24, 1963). Continues 575. Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-23.china-leadership
      when: Aug. 23
      date: '1963-08-23'
      thread: china-leadership
      c: 'Zhou Enlai, in the same speech, puts forward "the line and aims for developing the national economy": the three red flags, the general line above all, as program; agriculture the base and industry the leader as line; construction and production in the order of farming, light, heavy industry. After the transition of 1963–65 and the ten-year plan of 1966–75 an independent national economic system is to be basically set up, which takes in farming, commerce, science, culture, education and defense as well as industry; the proportions of its branches to be studied from China''s facts.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 575 (Aug. 23, 1963). Made public: 1997. To check: the speech. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-23.china-leadership-2
      when: Aug. 23–24
      date: '1963-08-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with Deng Yingchao at the Air Force Political Department''s drama troupe''s *Young Eagles*; Aug. 24 he talks with the cast, with Li Xiannian, Ulanhu and Song Renqiong: a success, putting air combat on the stage is original; the lines must be heard; the American and the Korean officer should not speak foreign tongues, which unconvincing becomes comic; a battle should have its dead; a play should be unified and in harmony and not wander from its theme.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 575 (Aug. 23–24, 1963). Made public: 1997. Names: Zhou Enlai, Deng Yingchao, Li Xiannian, Ulanhu, Song Renqiong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-26.china-leadership-2
      when: Aug. 26
      date: '1963-08-26'
      thread: china-leadership
      c: 'Zhou Enlai receives the Belgian parliamentarian Scheyven (舍伊文): peaceful coexistence can be only between independent states; a colony and a colonial power cannot, nor the ruled and the ruling class; it should not be abused; between unequals it cannot be; to beg it invites aggression and insult. States of different systems can learn techniques from each other; Belgium has some China can learn; common ground is to coexist in politics, trade in economics, learn in technique.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 575 (Aug. 26, 1963). Continues 576. Made public: 1997. Check: the name in Roman letters. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:belgium
      - name:zhou-enlai
      - vis:only:prc+belgium
