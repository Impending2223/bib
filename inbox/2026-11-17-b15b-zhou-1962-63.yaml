- add:
    entry:
      id: cal.1962-02-03.china-leadership
      when: Feb. 3
      date: '1962-02-03'
      thread: china-leadership
      c: 'Zhou Enlai at the Work Conference''s Fujian group on how to conduct the self-criticism: affirm the achievements, hold to the truth, correct the errors; start from a wish for unity, let off steam and clear the air above and below; criticism and self-criticism. It rests on facts: investigation; restoring regular democratic life in the Party; no random struggle, dismissal, expulsion, arrest or beating. On blame: first the Center, second the regional bureaus and provinces; the Center, bureaus and provinces the shield, the prefectures and counties the spear, and the spear has done well these days to attack the shield.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 455 (Feb. 3, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
