      date: '1962-11-12'
      thread: china-leadership
      c: Zhou Enlai with responsible persons, Nov. 12 and 23, on enlarging the railway corps to build railways in the forest regions, which lag.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 511 (Nov. 12, 23, 1962). Made public: 1997. Names: Zhou Enlai.'
