      when: Mar. 8
      date: '1962-03-08'
      thread: china-leadership
      c: 'Zhou Enlai to the Central Finance and Economic Group: the hardest time has passed in the general political and policy view, but the financial difficulties are serious; full farm recovery may take five years or more; strive for fast, prepare for slow. This year''s plan needs a great adjustment, his own proposal to the Center, a 180-degree turn to the way of revolution, with steady steps. Eight measures, among them to shift planning from industry and transport to farming and the market and to cut construction. He proposes Li Xiannian deputy head of the State Planning Commission too.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 462 (Mar. 8, 1962). Made public: 1997. Names: Zhou Enlai, Li Xiannian.'
