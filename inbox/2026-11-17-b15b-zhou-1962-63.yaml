    item: '[[w.zhou-enlai-nianpu-1949]], II, 583 (Sept. 1963: the nianpu notes that to set out its differing views the Renmin ribao and Hongqi jointly published, after discussion by the Center, commentary articles, nine by July 1964, opening the open polemic; a note gives the CPSU Central Committee''s open letter of July 14 as the cause)'
