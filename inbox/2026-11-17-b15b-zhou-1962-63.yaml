      when: May 30–mid-June
      date: '1962-05-30'
      thread: china-leadership
      c: 'Zhou Enlai at Shenyang, May 30 to mid-June: hears Sun Zhiyuan, Minister of the Third Ministry of Machine Building, and Zhao Erlu, deputy head of the State Council''s Defense Industry Office, on arms production; hears the Northeast Bureau and the three provinces'' heads on streamlining, industrial adjustment, grain, the market, farm recovery, coal and timber, and works out further ways to overcome the difficulties. The Northeast''s adjustment is to be set against the country''s; besides firm adjustment there is no way out.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 480 (May 30–mid-June, 1962). Continues 481. Made public: 1997. Names: Zhou Enlai, Sun Zhiyuan, Zhao Erlu.'
