- add:
    entry:
      id: cal.1963-12-20.china-leadership-2
      when: Dec. 20
      date: '1963-12-20'
      thread: china-leadership
      also:
      - africa
      - middle-east
      c: 'Zhou Enlai holds a press conference at Cairo and announces visits also to Algeria, Morocco, Albania, Ghana, Mali, Guinea, the Sudan and some South Asian states. China has come to Africa not too early but too late; the aims are friendship, cooperation, learning. Support for national liberation movements of Asia, Africa and Latin America is a chief part of China''s foreign policy; the two Bandung principles, common ground and no colonialists, apply to the second conference. Opposing the partial test-ban treaty does not mean opposing East–West talks. To a French television man: he and Chen Yi hope to visit France, where they studied forty years ago.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 603 (Dec. 20, 1963). Names: Zhou Enlai, Chen Yi, Nasser.'
