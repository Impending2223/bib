      when: Sept. 28
      date: '1962-09-28'
      thread: china-leadership
      c: Zhou Enlai at the Secretariat on work after the Tenth Plenum and the 1963 plan. It decides to arrange 1963's capital investment first at a little over 6 billion yuan; the comrades back from the plenum are to press the winter work arrangements, in farming especially the recovery and growth of cotton and tobacco; the main thing in carrying down the plenum is to carry out its decisions and arrange present work.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 498 (Sept. 28, 1962). Continues 499. Made public: 1997. Names: Zhou Enlai.'
