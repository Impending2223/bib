      c: 'Zhou Enlai receives Liu Renfu, former instructor of an eighth company of the People''s Liberation Army in Shanghai: he praises it for carrying on and spreading the Party''s and army''s tradition of hard struggle, forming a good style in peace and tying political education closely to practice, and hopes the higher organs will help it sum up a set of concrete experiences to go on with, for other units to learn from. A note: the masses call it "the good Eighth Company on Nanjing Road"; Apr. 25 the Ministry of National Defense names it so by order.'
