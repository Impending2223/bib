      when: Dec. 18
      date: '1963-12-18'
      thread: china-leadership
      also:
      - middle-east
      c: Zhou Enlai visits Aswan province and the Aswan High Dam site; at the luncheon of the governor, Salama, he says the Nile bred the splendid culture of ancient times and now serves the building of a national economy, and he trusts it will serve the UAR's industrious and wise people still more; he praises their spirit in winning wealth from nature.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 602 (Dec. 18, 1963). Names: Zhou Enlai.'
