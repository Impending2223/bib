      date: '1962-12-18'
      thread: china-leadership
      c: Zhou Enlai at the 76th meeting of the Standing Committee of the Second NPC gives the government's work report. The meeting decides to call the Fourth Session of the Second NPC in the second quarter of 1963, and to put off the election of delegates to the Third NPC to the second half of 1963.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 519 (Dec. 18, 1962). To check: the report as printed. Names: Zhou Enlai.'
