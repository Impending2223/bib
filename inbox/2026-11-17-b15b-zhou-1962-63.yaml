- add:
    entry:
      id: cal.1963-10-20.china-leadership
      when: Oct. 20
      date: '1963-10-20'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with Qi Yanming, Xia Yan, Lin Mohan and others on opera troupes abroad and on music and dance. Troupes abroad are to have their own character, not think of foreign exchange, be good in thought and art; Peking opera abroad should show new plays with the spirit of the new China. Music and dance: modern in content, national in form, resting on the popular; take the national critically and push out the old.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 588 (Oct. 20, 1963). Continues 589. Made public: 1997. Names: Zhou Enlai, Qi Yanming, Xia Yan, Lin Mohan.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-10-20.china-leadership-2
      when: Oct. 20
      date: '1963-10-20'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates to the Buddhists'' conference of eleven Asian states and regions: what settles things is the heart of the people; their "Appeal to the Buddhists of the World" is a moral force. To Nepal''s head: Buddhism is idealist and communism materialist, but believers and unbelievers agree politically against interference, for independence and love of country; China does not hide that it is atheist, but they can be friends. To Kongo Shuichi of the Japan Buddhist Association, on the Yangzhou meeting for Jianzhen''s 1,200th anniversary: Sino-Japanese friendship needs his will to cross a thousand hills and rivers.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 589 (Oct. 20, 1963). Continues 590; footnote: China, Cambodia, Indonesia, Japan, Korea, Laos, Nepal, Pakistan, Thailand, Vietnam and South Vietnam. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-10-22.china-leadership
      when: Oct. 22
      date: '1963-10-22'
      thread: china-leadership
      c: 'Zhou Enlai at the Secretariat, on the 1964 plan and the minutes of the second city work conference: next year is the middle year of transition, so the plan must be made from higher and farther, with the future and the whole in view, grasped hard and done well; once made, checked often; department heads to go down, each branch to send people to settle in a place and feel out the long-range plan and study the basic data.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 590 (Oct. 22, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-10-23.china-leadership
      when: Oct. 23
      date: '1963-10-23'
      thread: china-leadership
      c: 'Zhou Enlai presides at the 137th plenary meeting of the State Council, on the features of the 1964 plan: keep capital-construction costs under strict control, examine every project, stress key ones and leave leeway. Raise the pay of real scholars and engineers of merit and improve their housing; the State Science Commission to bring a plan soon. Part of each department is to go down to study the carrying out of next year''s plan and, chiefly, the long-term plan.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 590 (Oct. 23, 1963). Continues 591. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-10-23.china-leadership-2
      when: Oct. 23
      date: '1963-10-23'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives Edgar Faure, former Prime Minister of France and representative of President de Gaulle, in talks on establishing Sino-French relations. The difficulty is France's relation with Taiwan, to be settled by a reasonable way. Before Taiwan is settled formal relations and an exchange of ambassadors cannot be had, but informal ones can, such as a trade office first, semi-official or private; and if France and China establish relations France should keep no diplomatic staff or office in Taiwan; Britain's way is unpleasant for both. Three months of talks on establishing relations followed.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 590 (Oct. 23, 1963). Made public: 1997. Names: Zhou Enlai, Edgar Faure, De Gaulle.'
      tags:
      - polity:prc
      - polity:fr
      - polity:roc
      - name:zhou-enlai
      - name:faure-edgar-jean
      - name:de-gaulle-charles
      - vis:only:prc+fr
- add:
    entry:
