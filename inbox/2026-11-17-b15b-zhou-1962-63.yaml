      when: Nov. 1
      date: '1962-11-01'
      thread: china-leadership
      c: 'Zhou Enlai issues the Central Committee''s and State Council''s transmittal of the Ministry of the Interior''s report on adjusting the placement of college graduates put to wrong use. The comment: nearly a million graduates in the thirty years since 1949 are a treasure; those used outside their training after practice, or sent down too long, are to be fitted again to their strengths.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 509 (Nov. 1, 1962). Made public: 1997. To check: the comment as issued. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-02.china-leadership
      when: Nov. 2
      date: '1962-11-02'
      thread: china-leadership
      c: Zhou Enlai with the Ministry of Forestry on forestry, discussing the Central Committee's and State Council's draft decision to set up the Northeast general bureaus of forestry and of land reclamation. Cut by rule, cut and plant together, keep the green hills; no more free-handed destruction of nature; mechanization is the first question in the technical reform of forestry. On Nov. 18 he and Deng Xiaoping issue the two decisions.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 509 (Nov. 2, 1962). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-03.china-leadership
      when: Nov. 3
      date: '1962-11-03'
      thread: china-leadership
      c: 'Zhou Enlai presides at the 119th plenary meeting of the State Council, after days of hearing the ministries'' joint reports, to check how each carries out the twelve measures of city work. On streamlining: in most large and medium cities the cutting is nearly done and the hard part is placing the people; those not placed must be taken in hand by the state, not pushed out; the ministries are to hold to it to the end.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 509 (Nov. 3, 1962). Continues 510. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
