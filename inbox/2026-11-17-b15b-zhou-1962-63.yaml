      date: '1962-11-01'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai receives Takasaki Tatsunosuke again: trade of the two countries is to rest on equality and mutual benefit; for now China trades by barter, by accumulation and by degrees, and the trade is private in kind; bank settlement and other details.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 509 (Nov. 1, 1962). Made public: 1997. Names: Zhou Enlai, Takasaki Tatsunosuke.'
