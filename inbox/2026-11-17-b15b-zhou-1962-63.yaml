      when: Dec. 3
      date: '1963-12-03'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai tells Banerjee, India''s chargé d''affaires about to leave: Sino-Indian relations should improve and not worsen; no more war of notes.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 598 (Dec. 3, 1963). Made public: 1997. Names: Zhou Enlai.'
