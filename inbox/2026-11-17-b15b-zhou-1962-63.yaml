      when: June 30
      date: '1962-06-30'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai at Chen Yun's house. In late June, while Zhou toured the Northeast, the Secretariat had taken up "contracting output to the household," Deng Xiaoping and Deng Zihui supporting it. On his return Chen Yun proposes that some places redivide the land and contract output to households to stir the peasants and restore farm output fast; Zhou agrees. July 8 he attends Mao's meeting; July 9 he goes to Chen Yun's again.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 488 (June 30, 1962). Made public: 1997. Names: Zhou Enlai, Chen Yun, Deng Xiaoping, Deng Zihui.'
