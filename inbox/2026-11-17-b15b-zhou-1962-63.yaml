      date: '1963-04-20'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai to Bandaranaike, by letter: India''s treating its own interpretation of the Colombo proposals as the participants'' clarification is dishonest; it makes her "uneasy," and he "cannot but be surprised and puzzled."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 549 (Apr. 20, 1963). Made public: 1997. To check: the letter. Names: Zhou Enlai, Srimavo Bandaranaike.'
