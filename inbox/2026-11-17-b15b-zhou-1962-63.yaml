      thread: china-leadership
      also:
      - japan
      c: Zhou Enlai hears Liao Chengzhi, Ye Jizhuang and Lu Xuzhang, Nov. 5–8, on their talks with Takasaki on Sino-Japanese private trade.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 510 (Nov. 5–8, 1962). Made public: 1997. Names: Zhou Enlai, Liao Chengzhi, Ye Jizhuang, Lu Xuzhang.'
