      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai receives again the two secretaries of Russell and talks with them on the Sino-Indian boundary question and China's peaceful foreign policy.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 567 (July 20, 1963). The nianpu gives it in its June 5 item, 559. Made public: 1997. Names: Zhou Enlai, Bertrand Russell.'
