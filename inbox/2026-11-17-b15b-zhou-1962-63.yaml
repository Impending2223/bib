      - africa
      c: 'Zhou Enlai receives Ali Muhammad Hirawi, Somalia''s Minister of Information, and gives four principles of cooperation with friendly states: no condition or privilege attached to any aid, on the Bandung principles and non-interference; help to Afro-Asian friends only to make the conditions for their own self-reliant economies, not to make them lean on foreign aid; cooperation to fit China''s means, so that what is said is done and what cannot be done is told; cooperation among Afro-Asian states is to seek common growth and shake off the backwardness and poverty left by imperialism and colonialism.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 554 (May 15, 1963). Made public: 1997. Names: Zhou Enlai, Ali Muhammad Hirawi.'
