      id: cal.1963-02-28.china-leadership-2
      when: Feb. 28
      date: '1963-02-28'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, after twice seeing the Nanjing Military Region Front Drama Troupe's *Sentinels under the Neon Lights*, holds a forum with the arts circles and gives over thirty comments on theme, direction, lines, acting, sound and props. Persons are to grow and be revealed as the action advances and the conflicts deepen; he does not agree to make the bad man uglier; a disguise is not seen through at once; in opera a painted face can show it, but even there one learns by listening; the playboy's appearance should not be too outward. He asks that writers be roused to write more of the present.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 537 (Feb. 28, 1963). Made public: 1997. Names: Zhou Enlai.'
