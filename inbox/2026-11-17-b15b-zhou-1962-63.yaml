- cite:
    id: cal.1962-01-25.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 454 (Jan. 25, 1962: Zhou Enlai attends the enlarged Politburo)'
- cite:
    id: cal.1962-01-27.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 454 (Jan. 27, 1962: Zhou Enlai attends the plenary)'
- cite:
    id: cal.1962-01-30.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 454 (Jan. 30, 1962: Zhou Enlai attends the afternoon plenary)'
- cite:
    id: cal.1962-02-07.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 455 (Feb. 7, 1962: Zhou Enlai''s closing speech: the State Council and its commissions bear much of the blame; grain short by about 10 billion jin in 1962; eight measures, the first to cut offices, urban population, staff and grain supply)'
- cite:
    id: cal.1962-02-21.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 460 (Feb. 21–23, 1962: Zhou Enlai attends; the discussion found a deficit of 5 billion yuan in that year''s budget; Chen Yun''s two stages, five years of recovery and then development; Zhou agrees)'
- cite:
    id: cal.1962-03-13.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 463 (Mar. 12–13, 1962: Zhou Enlai attends the enlarged Standing Committee; it takes up Chen Yun''s Feb. 26 speech and those of Li Xiannian and Li Fuchun)'
- cite:
    id: cal.1962-03-17.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 464 (Mar. 16, 1962: Zhou Enlai with Liu and Deng at Wuhan reports to Mao; Mao agrees)'
- cite:
    id: cal.1962-03-27.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 466 (Mar. 27, 1962: Zhou Enlai''s part, on the international situation and foreign policy: peaceful coexistence, settlement by talks, against nuclear war)'
- cite:
    id: cal.1962-04-07.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 470 (Apr. 7, 1962: Zhou Enlai attends the enlarged Politburo; it also goes on to the topics of the Supreme State Conference of Mar. 21)'
- cite:
    id: cal.1962-04-09.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 470 (Apr. 9, 1962: Zhou Enlai attends the second meeting of the 18th Supreme State Conference, on the Mar. 21 topics, the Government Work Report and the NPC session)'
- cite:
    id: cal.1962-04-24.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 473 (Apr. 24, 1962: Zhou Enlai reports with Li Xiannian on the draft Finance Group report; Apr. 25 he revises it)'
- cite:
    id: cal.1962-05-07.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 476 (May 7–11, 1962: Zhou Enlai arranges the agenda and the list of those attending; speaks May 11)'
- cite:
    id: cal.1962-07-08.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 488 (July 8, 1962: Zhou Enlai attends Mao''s meeting)'
- cite:
    id: cal.1962-07-12.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 489 (July 11, 1962: Zhou Enlai reports to Mao on the border; the nianpu dates it the 11th, the entry the midnight of the 12th)'
- cite:
    id: cal.1962-07-11.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 489 (July 11, 1962: the Central Committee''s notice calling the conference for late July: rural problems, grain, commerce, state aid to farming; a note says it was put off to August at Beidaihe)'
- cite:
    id: cal.1962-07-22.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 490 (July 22, 1962: Zhou Enlai reports to Mao before dawn on the Indian attack; a note on the Indian "forward policy": about 24 new posts along the McMahon line in the first half of 1962, one at Chedong north of it on June 4)'
- cite:
    id: cal.1962-07-23.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 490 (July 22–23, 1962: the telegram: the border question a long struggle, in the west an interlocking, long armed coexistence; Chen Yi to see Menon at Geneva and hint that only direct talks of the two sides can settle it; Zhou reports to Mao again at the end of the month)'
- cite:
    id: cal.1962-07-28.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 492 (July 28, 1962: Zhou Enlai at the Beidaihe conference from July 28 to Aug. 24)'
- cite:
    id: cal.1962-08-06.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 492 (July 28–Aug. 24, 1962: Zhou Enlai at the conference, which set up a center group of Mao, Liu, Zhou, Zhu De, Deng and the heads of the State Council''s sectors and the regional bureaus'' secretaries; Mao''s Aug. 6 speech on class, the situation and contradictions, the "dark wind," "go-it-alone wind" and "reversal wind"; Zhou speaks mainly on the plan and the situation in the villages)'
- cite:
    id: cal.1962-09-16.japan
    item: '[[w.zhou-enlai-nianpu-1949]], II, 496 (Sept. 16–19, 1962: Sept. 16: restoring relations by a "promotional and gradual" method, politics and economy not separable, the three political principles kept, the right to criticize the Japanese government on great issues kept; Sept. 17: the three political principles and the three trade principles explained, the political ones the measure of friendly exchange; of the few in Japan who would revive militarism, those who suffered in the war cannot fail to care, and China, after fifty years, still less; Sept. 19: differences of view do not matter if a common way is sought)'
- cite:
    id: cal.1962-09-19.japan
    item: '[[w.zhou-enlai-nianpu-1949]], II, 496 (Sept. 19, 1962: Zhou Enlai''s speech at Matsumura''s farewell banquet: relations to rest on the three political principles, the three trade principles and the inseparability of politics and economics, to normalize them; from Zhou''s and Matsumura''s talks on widening private trade the two sides begin a memorandum on private trade)'
- cite:
    id: cal.1962-09-21.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 496 (Sept. 21, 1962: Zhou Enlai with Mao, Liu and Deng receives Nguyễn Duy Trinh and his party)'
- cite:
    id: cal.1962-09-23.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 497 (Sept. 23, 1962: Zhou Enlai receives Souphanouvong the same day)'
- cite:
    id: cal.1962-09-24.china
    item: '[[w.zhou-enlai-nianpu-1949]], II, 497 (Sept. 24–27, 1962: Zhou Enlai at the Tenth Plenum, which adopts the decisions on the communes'' collective economy and farm production, the revised draft of the communes'' work regulations, and on commercial work; Mao''s speech on class, the situation, contradictions and unity in the Party)'
- cite:
    id: cal.1962-09-26.china
    item: '[[w.zhou-enlai-nianpu-1949]], II, 498 (Sept. 26, 1962: Zhou Enlai''s speech: in the adjustment there was right and wrong; in May the difficulties were somewhat overstated, but the course remained to push hard against them; in an anti-Right drive guard against the Left, learn from the anti-Rightist excesses, no campaign; "the chance is not to be lost," unite the Party; on India: military coexistence, long struggle, struggle and unity, fighting and negotiating; unite India''s people; the struggle has reason, advantage, restraint, to answer after the other strikes, never to shoot first or attack unless it must be; the army''s task now is to watch the Indian troops, throw back their attacks, cut their retreat, force them back, and still to hold talks)'
- cite:
    id: cal.1962-10-05.south-asia
    item: '[[w.zhou-enlai-nianpu-1949]], II, 500 (Oct. 5, 1962: the General Staff''s report from AP and AFP: India stepping up war preparations, an attack likely within days, "the first real fighting in three years of border conflict," India "resolved to drive the Chinese back"; Zhou''s comment: if the enemy moves in the east, besides a hard blow there some of his strongholds in the west can be wiped out at the same time; he orders Luo Ruiqing, Chief of the General Staff, to hasten the deployments; a note: by Oct. 20 India had set up 43 posts on Chinese ground in the western sector)'
- cite:
    id: cal.1962-10-05.vietnam-hanoi
    item: '[[w.zhou-enlai-nianpu-1949]], II, 501 (Oct. 5, 1962: Zhou Enlai with Mao and Võ Nguyên Giáp: the mutual support of China and Vietnam is all-round, not military only but political and economic)'
- cite:
    id: cal.1962-10-08.south-asia
    item: '[[w.zhou-enlai-nianpu-1949]], II, 500 (Oct. 8, 1962: Zhou Enlai is called to Mao''s to study the Sino-Indian border struggle)'
- cite:
    id: cal.1962-10-08.south-asia-3
    item: '[[w.zhou-enlai-nianpu-1949]], II, 502 (Oct. 8, 1962: Zhou Enlai to Chervonenko: India may open a large war in the east; China holds only to defense, has never fired first, and will defend itself if attacked; Indian use of Soviet helicopters and transports to supply the front)'
- cite:
    id: cal.1962-10-20.china-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 504 (Oct. 20, 1962: Zhou Enlai presides at the 117th plenary meeting of the State Council on the border war: Nehru refused talks and ordered the attack; China has not given up talks; the root is India''s claim to Britain''s inheritance; let him bump until his head is broken and bleeding)'
- cite:
    id: cal.1962-10-23.south-asia-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 504 (Oct. 23, 1962: Zhou Enlai drafts the statement with Chen Yi, Wu Lengxi, Qiao Guanhua and Yao Zhen and consults Mao and the other Standing Committee members; meetings after 11 p.m., a foreign guest at 2 a.m., Mao''s at 5)'
- cite:
    id: cal.1962-10-24.south-asia
    item: '[[w.zhou-enlai-nianpu-1949]], II, 504 (Oct. 24, 1962: the statement and its three proposals; India rejected them the day it received them)'
- cite:
    id: cal.1962-10-24.south-asia-3
    item: '[[w.zhou-enlai-nianpu-1949]], II, 505 (Oct. 24, 1962: Zhou Enlai to Nehru, pained by the conflict, to look forward and turn the situation, the three proposals restated; no words of "respond positively" in the nianpu)'
- cite:
    id: cal.1962-10.japan
    item: '[[w.zhou-enlai-nianpu-1949]], II, 506 (Oct. 29–30, 1962: Zhou Enlai and Chen Yi receive and dine Takasaki Oct. 29; Zhou talks with him again Oct. 30)'
- cite:
    id: cal.1962-10-29.china
    item: '[[w.zhou-enlai-nianpu-1949]], II, 506 (Oct. 29, 1962: Zhou Enlai receives Kyaw Win and takes Ne Win''s letter; the Sept. 8 line was India''s proposal after China''s statement of Oct. 24; restoring it would push China back in the east, not a cease-fire but surrender; China keeps to a 20-kilometer pullback from the line of actual control; the nianpu has it at 506, not at 571)'
- cite:
    id: cal.1962-11-03.china-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 510 (Nov. 3, 1962: Mao on Luo Ruiqing''s proposal of Oct. 30 for a fifteen-man central committee to lead the atomic industry, with the Premier in charge and He Long, Li Fuchun, Wang Heshou, Zhang Aiping, Li Xiannian, Bo Yibo, Lu Dingyi, Nie Rongzhen, Luo Ruiqing, Zhao Erlu, Liu Jie, Sun Zhiyuan, Duan Junyi and Gao Yang: "very good, do it; coordinate with all strength")'
- cite:
    id: cal.1962-11-04.south-asia
    item: '[[w.zhou-enlai-nianpu-1949]], II, 510 (Nov. 4, 1962: Zhou Enlai to Nehru again: neither side should pose as victor; the three proposals of Oct. 24 are equal, not one-sided, mutual, not imposed; he asks Nehru to consider them again and respond positively)'
- cite:
    id: cal.1962-11-09.japan
    item: '[[w.zhou-enlai-nianpu-1949]], II, 510 (Nov. 9, 1962: Liao Chengzhi and Takasaki sign the memorandum on Sino-Japanese private trade and related papers, with Zhou Enlai and Chen Yi at the signing)'
- cite:
    id: cal.1962-11-14.china
    item: '[[w.zhou-enlai-nianpu-1949]], II, 511 (Nov. 14, 1962: Zhou Enlai drafts the Central Committee''s notice on the border clashes and relations with India: if India makes a new attack China will strike harder in self-defense, will take no step of its own to worsen relations, and will seek chances to stop the clash and reopen talks)'
- cite:
    id: cal.1962-11-17.china
    item: '[[w.zhou-enlai-nianpu-1949]], II, 512 (Nov. 17, 1962: Zhou Enlai presides at the first meeting of the Central Special Committee, set up under the Central Committee''s direct leadership with Zhou chairman and fifteen members; to Oct. 16, 1964 he held nine meetings of it and several small ones and settled over a hundred major problems of production, research and construction)'
- cite:
    id: cal.1962-11-19.china
    item: '[[w.zhou-enlai-nianpu-1949]], II, 513 (Nov. 19, 1962: Zhou Enlai goes twice to Mao''s for meetings, and talks with Foreign Ministry people between)'
- cite:
    id: cal.1962-11-19.south-asia-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 19, 1962: Zhou Enlai and Chen Yi receive Banerjee, India''s chargé d''affaires: for all the strain the two countries should stay friends and look far and deep; China has confidence and will not lose a thread of hope; he has been to Delhi four times and will go a fifth)'
- cite:
    id: cal.1962-11-20.south-asia
    item: '[[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 20, 1962: Zhou Enlai settles with Mao, Liu Shaoqi and others on active steps to turn the tension on the border)'
- cite:
    id: cal.1962-11-21.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 21, 1962: the statement at midnight, a cease-fire along the whole border from midnight Nov. 22 and a pullback of 20 kilometers behind the line of actual control from Dec. 1)'
- cite:
    id: cal.1962-11-24.china
    item: '[[w.zhou-enlai-nianpu-1949]], II, 515 (Nov. 24, 1962: Zhou Enlai reports "On the Sino-Indian Boundary Question" to the 70th meeting of the Standing Committee of the Second NPC: the relation has had a friendly side from the first and a dark side; unity and struggle; four times China yielded but within limits; the tactic is of reason, advantage and restraint, giving ground and answering after the other strikes; to friends in the democratic parties who found the unilateral steps sudden, he says the three proposals of Oct. 24 and the steps of Nov. 21 do not run against national policy or the general line of foreign policy)'
- cite:
    id: cal.1962-11-27.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 515 (Nov. 26–27, 1962: the draft letters to Ne Win and to Sukarno carried to Mao, by the departments for Zhou; Huang Zhen to travel by Rangoon to Jakarta)'
- cite:
    id: cal.1963-01-05.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 5, 1963: Zhou Enlai with Mao receives Bandaranaike, and Subandrio brought by Chen Yi)'
- cite:
    id: cal.1963-01-05.china-leadership-3
    item: '[[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 5, 1963: Zhou Enlai with Mao receives Subandrio, whom Chen Yi brought to Hangzhou)'
- cite:
    id: cal.1963-01-08.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 15, 1963: Zhou Enlai, at Mao''s request, drafts the Central Committee notice on the 1963 plan and the like; the nianpu gives a conference in mid-February, not a meeting of the regional secretaries from Feb. 5)'
- cite:
    id: cal.1963-02-11.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 533 (Feb. 11–28, 1963: Zhou Enlai at the conference; a note says it took up the five-antis in cities, strict control of fairs and a blow at speculation, the 1963 plan and the primary and middle school rules, and that Mao introduced Hunan''s socialist education and the "four clean-ups" of Baoding in Hebei, "class struggle, grasp it and it works")'
- cite:
    id: cal.1963-02-23.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 535 (Feb. 23, 1963: Zhou Enlai is with Mao in receiving Chervonenko; Mao: abuse back and forth should have a pause, so he favors a truce, and the first proposal against public polemics was Zhou''s at the CPSU 22nd Congress)'
- cite:
    id: cal.1963-03-05.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 538 (Mar. 5, 1963: the two papers print Zhou Enlai''s inscription beside Mao''s)'
- cite:
    id: cal.1963-04-24.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 550 (Apr. 24, 1963: Zhou Enlai accompanies Ali Sabri to Shanghai; on the way he says the Sino-Indian question will one day be settled peacefully and hopes the UAR works on India; he gives four "philosophical" bases of Chinese diplomacy: wait and do not press one''s views on others; never fire the first shot; no courtesy without return; retreat three stages, from the national tradition and not wholly Marxist-Leninist teaching)'
- cite:
    id: cal.1963-05-10.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 552 (May 10–12, 1963: Zhou Enlai goes to Hangzhou to report to Mao in person on the Yuejin; there twice calls the regional secretaries on grain, streamlining and farm production)'
- cite:
    id: cal.1963-05-07.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 552 (May 10–11, 1963: Zhou Enlai at the meetings of May 10 and 11; he asks that "90-odd" read "over 95" percent in the draft; Mao agrees)'
- cite:
    id: cal.1963-05-18.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 554 (May 18, 1963: Zhou Enlai presides at the Politburo on Mao''s proposal; he explains how the draft came to be drafted; no product of the mind is right at once, it comes by repeated practice, held to and corrected; he stresses Mao''s thought on the relation of knowing and doing, spirit and matter; the meeting amends it a little and the document goes out May 20)'
- cite:
    id: cal.1963-05-29.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 556 (May 26–29, 1963: Kim Il Sung''s visit; Zhou Enlai receives him and asks the Korean view of the draft reply to the CPSU)'
- cite:
    id: cal.1963-06-12.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 559 (June 12, 1963: Zhou Enlai at the Politburo on the reply to the CPSU letter of Mar. 30; the letter goes out June 14 as "A Proposal Concerning the General Line of the International Communist Movement," stating the Chinese Central Committee''s views on the general line, the basic contradictions of the world, the proletariat and its dictatorship, and war and peace, as a proposal for the content of the two parties'' talks)'
- cite:
    id: cal.1963-07-21.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 566 (July 21, 1963: the Chinese delegation back in Peking, Mao, Liu Shaoqi, Zhou Enlai and Zhu De meet it at the airport)'
- cite:
    id: cal.1963-07-31.china
    item: '[[w.zhou-enlai-nianpu-1949]], II, 568 (July 25 and July 31, 1963: the nianpu notes under July 25 the treaty on banning tests in the air, space and under water, which leaves out underground tests, signed at Moscow by the Soviet Union, the United States and Britain; the Chinese government statement of July 31, drafted under Zhou Enlai, calls for the comprehensive, thorough and resolute ban and destruction of nuclear arms and a summit of the governments, and exposes the treaty as discriminatory)'
- cite:
    id: cal.1963-08-09.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 570 (Aug. 9, 1963: Zhou Enlai back from Shanghai with Shermarke the same day)'
- cite:
    id: cal.1963-09-06.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 577 (Sept. 6–27, 1963: the Central Committee''s work conference; the nianpu says it took up chiefly the line for China''s industry, the 1964 plan and rural work)'
- cite:
    id: cal.1963-09-27.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 581 (Sept. 27, 1963: Zhou Enlai speaks at the Work Conference''s closing session on the arrangement of the 1964 plan)'
- cite:
    id: cal.1963-09-28.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 582 (Sept. 28, 1963: Zhou Enlai at Mao''s meeting on Xinjiang with Zhu De, Chen Yi, He Long, Luo Ruiqing, Liu Lantao and Wang Enmao; Mao: first solve the economy, production to grow, the economy to flourish and living to improve each year)'
- cite:
    id: cal.1963-09-30.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 582 (Sept. 30, 1963: Zhou Enlai''s speech at the 14th National Day reception: the Chinese people will overcome difficulty and within a historic period make China a great socialist power with modern farming, industry, defense and science and technology; he asks friends of all countries to give their views and point out China''s faults and errors)'
- cite:
    id: cal.1963-10-25.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 592 (Oct. 25 and 31, 1963: Mao''s instruction to Liu, Zhou, Zhu De and Deng to read the draft of the concrete policies of the rural socialist education movement and meet on it; Oct. 31 Zhou attends the Politburo, which basically adopts it, to be revised by the Standing Committee and sent down; it goes down Nov. 14 as "Provisions on Some Concrete Policies in the Rural Socialist Education Movement [Draft]")'
- cite:
    id: cal.1963-10-31.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 592 (Oct. 31, 1963: Zhou Enlai telephones Mao in Shanghai with his report of the talks with Faure on establishing relations with France; Mao has Liu, Zhou, Deng and Chen Yi fly to Shanghai Nov. 1 to talk it over and means to take up socialist education in the villages there)'
- cite:
    id: cal.1963-11-01.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 593 (Nov. 1–3, 1963: Zhou Enlai with Liu, Deng and Chen Yi at Mao''s meetings on socialist education and the plan for relations with France; present too the heads of the East China Bureau and the first secretaries of the East China provinces)'
- cite:
    id: cal.1963-11-02.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 593 (Nov. 2, 1963: Zhou Enlai settles with Faure the final "Main Points of Premier Zhou Enlai''s Talk"; that evening hands over the printed, revised text)'
- cite:
    id: cal.1963-11-02.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 593 (Nov. 2, 1963: Zhou Enlai and Chen Yi with Mao in receiving Faure)'
- cite:
    id: cal.1963-11-14.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949]], II, 594 (Nov. 14, 1963: Zhou Enlai at the enlarged Politburo, which adopts the draft Provisions on some concrete policies in the rural socialist education movement and the drafts of the reports on the 1963 plan and 1964 draft plan and on the 1963 budget and the first arrangement of the 1964 budget, to be revised by the Standing Committee and given by Li Fuchun and Li Xiannian at the Fourth Session of the Second NPC; the same day the Center issues a notice on printing and publicizing the "First Ten Points" and the "Later Ten Points")'
- cite:
