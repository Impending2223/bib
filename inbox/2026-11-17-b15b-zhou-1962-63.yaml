      date: '1962-11-13'
      thread: china-leadership
      c: Zhou Enlai with responsible persons on technical reform in agriculture.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 511 (Nov. 13, 1962). Made public: 1997. Names: Zhou Enlai.'
