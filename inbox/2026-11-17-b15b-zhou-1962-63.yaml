      date: '1962-01-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai and Deng Yingchao receive Chen Jieru, Chiang Kai-shek''s former wife; ask about her life in Shanghai; approve her going to Hong Kong to settle debts and private affairs, for as long as she likes. Zhou: Chiang''s crimes are his alone; he keeps a little national feeling and still opposes the American "two Chinas"; so hope is kept for him.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 454 (Jan. 26, 1962). Made public: 1997. Names: Zhou Enlai, Deng Yingchao, Chen Jieru, Chiang Kai-shek.'
      tags:
