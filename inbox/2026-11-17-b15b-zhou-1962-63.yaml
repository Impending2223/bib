      when: Sept. 18, 26, 27
      date: '1963-09-18'
      thread: china-leadership
      c: 'Zhou Enlai with persons concerned, among them the regional secretaries, on the finance plan, Sept. 18, 26 and 27. Agreed: 1964 revenue to be set at 38.0 to 38.5 billion yuan; some targets cut, some raised; spending held below this year''s, with thrift so that capital construction is not hurt.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 580 (Sept. 18, 26, 27, 1963). Made public: 1997. Names: Zhou Enlai.'
