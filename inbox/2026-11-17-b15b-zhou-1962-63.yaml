      c: 'Zhou Enlai with the actors of the Central Opera and Ballet: again the composite nature of stage art; he criticizes decentralism, each doing his own, in all enterprises the whole is to be seen; Western things are to be introduced and learned thoroughly, to show that China masters them, but the chief task is its own national work.'
