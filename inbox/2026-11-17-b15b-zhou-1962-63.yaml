      c: Zhou Enlai with Ke Qingshi, Zeng Xisheng, Jiang Hua, Jiang Weiqing, Tan Qilong and Yang Shangkui on grain. During the conference he follows grain closely and calls Li Xiannian, Chen Guodong, Yao Yilin, Liao Luyan and the Northeast and Southwest bureaus' leaders to talk of it several times.
