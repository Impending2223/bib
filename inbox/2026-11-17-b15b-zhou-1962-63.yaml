      date: '1962-01-07'
      thread: china-leadership
      c: 'Zhou Enlai approves a report by Zhong Ziyun, Vice Minister of Coal, on the grain and the soybean and oil supplements to restore the coal miners'' grain ration in 1962: the subsidy rates to be figured only on set output, quotas and staff.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 450 (Jan. 7, 1962). Made public: 1997. To check: the report and the comment. Names: Zhou Enlai, Zhong Ziyun.'
