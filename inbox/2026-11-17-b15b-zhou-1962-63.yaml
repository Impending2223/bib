      when: Aug. 13
      date: '1963-08-13'
      thread: china-leadership
      c: Zhou Enlai at the capital's memorial meeting for Ji Chaoding, Vice-Chairman of the China Council for the Promotion of International Trade; later, to foreign guests, he regrets Ji's early death.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 572 (Aug. 13, 1963). Continues 573. Names: Zhou Enlai, Ji Chaoding.'
