      when: Dec. 8
      date: '1962-12-08'
      thread: china-leadership
      c: 'Zhou Enlai to the national conference of county cadres of the main cotton areas: achievements are the main thing and the three red flags stay high; but three faults in leading cotton: high targets, estimates, procurement and distribution; blind command; no three-in-one of leaders, masses and experts. Cotton is now tightest; in the Third Five-Year Plan clothing rests chiefly on cotton. He sorts the cotton fields of 16 provinces into classes and arranges work for each. The Center sends the speech out Dec. 26.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 518 (Dec. 8, 1962). Made public: 1997. To check: the speech as sent out, Dec. 26, 1962. Names: Zhou Enlai.'
