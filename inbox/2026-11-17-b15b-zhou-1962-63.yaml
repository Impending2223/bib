      c: Zhou Enlai at the Secretariat, which approves the minutes of the national finance and trade conference on fairs in the large and medium cities; takes up industrial output in January and February, and decides that grave problems in the State Economic Commission's outline be pressed at once, among them poor timber output in nine southern provinces, railway cars unrepaired and rotted sleepers. Zhou puts forward views and measures for a further cut in the Center's staff.
