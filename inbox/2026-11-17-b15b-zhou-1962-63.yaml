      - south-asia
      c: 'Zhou Enlai, at the banquet of Afghanistan''s Ambassador, Mohammad Shoaib Miskinyar: Asian and African states should live in peace and friendship and settle the questions left between them by imperialist rule by friendly talks, not force or threat of force.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 519 (Dec. 20, 1962). Check: the ambassador''s name in Roman letters. Names: Zhou Enlai.'
