      date: '1963-01-05'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai sees Bandaranaike off from Peking for Hangzhou; his written statement at the airport: he trusts that Ceylon, Indonesia and the other four Afro-Asian states will come to understand that China''s constant stand for a peaceful settlement by direct Sino-Indian talks will not change, and China will always take a positive and cooperative attitude to all the friendly states'' efforts. He reaches Hangzhou that day.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 524 (Jan. 5, 1963). Continues 525. Names: Zhou Enlai, Srimavo Bandaranaike.'
