      when: Dec., early
      date: 1963-12
      thread: china-leadership
      c: 'Zhou Enlai writes for the Huaihai Campaign memorial tower: "The heroes of Huaihai will be remembered for ever."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 600 (Dec., early, 1963). Names: Zhou Enlai.'
