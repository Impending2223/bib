      thread: china-leadership
      c: 'Zhou Enlai flies back to Peking; with Fan Muhan, Vice-Minister of the First Ministry of Machine Building, and Li Qiang on negotiations to import complete sets of equipment: to order less this year and next to save foreign exchange. Apr. 28 they draft a plan by classes on his view; he agrees to cut or put off 14 million, with the note: "to put off all is no longer possible; it can only be so."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 550 (Apr. 26–28, 1963). Made public: 1997. Names: Zhou Enlai, Fan Muhan, Li Qiang.'
