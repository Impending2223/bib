      c: 'Zhou Enlai with Tsedenbal, First Secretary of the Mongolian People''s Revolutionary Party and Chairman of the Council of Ministers, on the delimiting of the China–Mongolia border and other matters, Dec. 25–27. Dec. 26 he tells how China settled borders with Burma, Nepal and Korea: China can sit down with all its Asian neighbors, which shows it wants to settle border questions with neighbors in friendship, a legacy of history.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 521 (Dec. 25–27, 1962). Made public: 1997. Names: Zhou Enlai, Tsedenbal.'
