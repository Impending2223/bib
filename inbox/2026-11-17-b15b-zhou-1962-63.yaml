    entry:
      id: cal.1962-06-25.china-leadership
      when: June 25
      date: '1962-06-25'
      thread: china-leadership
      c: Zhou Enlai flies to Shenyang. In the Northeast he said that investigators should not only look but solve problems and find the way; he sharply criticized some places for too little resolve to carry out the Center's adjustment and the cuts in staff and urban people, and by patient persuasion got the adjustment plans fixed and put into action.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 487 (June 25, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
