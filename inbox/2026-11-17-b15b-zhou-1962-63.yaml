      c: 'Zhou Enlai agrees to Wang Shoudao''s proposal for a telephone conference of the transport departments, in the light of the *Yuejin* and other accidents, to "grasp safety in production hard." On the Ministry of Communications'' plan to call on its units to "act" on the lesson: too abstract; they are to tell all staff the report''s main points and the accidents, rouse them to discuss and suggest, and see it carried out, the mass line under leadership; drop official airs, the center of the Ministry''s five-antis.'
