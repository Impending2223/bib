      date: '1963-12-24'
      thread: china-leadership
      also:
      - africa-algeria-morocco
      c: Zhou Enlai visits the home of the children of Algeria's martyrs, where live the children of those who died for national liberation.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 604 (Dec. 24, 1963). Names: Zhou Enlai.'
      tags:
