      c: 'Zhou Enlai and Chen Yi talk with Matsumura Kenzo, adviser of the Liberal Democratic Party and member of the House of Representatives, on Sept. 15, 16, 17 and 19. Sept. 15: do not raise the past again, the two peoples should stand on friendly ground, look ahead and far, and work for friendship. (A note: Matsumura said Japan had done China great harm in fifty years and he could only apologize.)'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 495 (Sept. 15, 1962). Continues 496. Made public: 1997. Names: Zhou Enlai, Chen Yi, Matsumura Kenzo.'
