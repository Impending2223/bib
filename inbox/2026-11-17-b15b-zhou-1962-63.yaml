    entry:
      id: cal.1963-10-25.china-leadership-2
      when: Oct. 25
      date: '1963-10-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai hears the Party committee heads of Yichun city on joining government and enterprise in the Yichun forest region: it should run on an economic footing, first settling thought, for a huge set of offices gets in the way. Three causes hinder progress in the system: the country''s size and uneven growth; feudal, bureaucratic and comprador habits from the past; fear of thorough reform. Uniformity of administrative organization is the most feudal and must be broken; cancel duplicate offices; a concrete plan by the end of December.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 591 (Oct. 25, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
