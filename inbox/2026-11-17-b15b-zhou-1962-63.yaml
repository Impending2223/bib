      when: Nov. 21
      date: '1962-11-21'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai and Chen Yi, twenty minutes after the statement of Nov. 21, call in Banerjee, India's chargé d'affaires, and tell him its main points, China's cease-fire and pullback along the whole border of its own accord; they hope India's government will respond positively and take matching steps.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 21, 1962). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc+india
- add:
    entry:
      id: cal.1962-11-21.china-leadership-4
      when: Nov. 21
      date: '1962-11-21'
      thread: china-leadership
      also:
      - south-asia
      - indonesia
      c: 'Zhou Enlai and Chen Yi at dawn receive, one after the other, Indonesia''s Ambassador, Sukarni (苏卡尼), and Burma''s, Kyaw Win. They give Sukarni the government''s statement of Nov. 21 and hope Sukarno will use his influence to move India to matching steps; to Kyaw Win they set out China''s steps: if India does not answer or cannot answer in time whether it will respond, China will still cease fire first and withdraw. Sukarni calls the measures very wise; Kyaw Win, lofty and generous.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 21, 1962). Made public: 1997. Check: the Indonesian ambassador''s name in Roman letters. Names: Zhou Enlai, Chen Yi, Sukarno, Kyaw Win.'
      tags:
      - polity:prc
      - polity:indonesia
      - polity:burma
      - polity:india
      - name:zhou-enlai
      - name:chen-yi
      - name:sukarno
      - vis:only:prc+indonesia+burma
- add:
