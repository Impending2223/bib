      id: cal.1962-01-20.china-leadership
      when: Jan. 20
      date: '1962-01-20'
      thread: china-leadership
      c: 'Zhou Enlai''s written supplementary comments on the report''s twelve points on basic experience: the ties of drive and realism, speed and quality; high speed on a basis of food, clothing and use; ownership in the communes to follow production. He adds four lessons: culture and education to keep pace with the economy; thrift; streamlining; the Party''s lead of the economy. He asks the report to say 5 percent a year in farm output is already a leap and his Aug. 26, 1959 figure of 10 to 20 percent was wrong. Most go into the text.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 453 (Jan. 20, 1962). Made public: 1997. To check: the Supplementary Comments, Jan. 20, 1962. Names: Zhou Enlai, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:liu-shaoqi
      - vis:only:prc
- add:
