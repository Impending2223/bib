      date: '1962-09-22'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with Zhou Ke, Zhao Qing, Wang Shu and others of the Central Opera and Ballet: asks about the performers'' housing; criticizes equalitarian thinking in the arts. The state spent a dozen years raising outstanding dancers; letting them lose health through neglect turns talent to waste; good performers should have better conditions, and promising young artists more attention.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 496 (Sept. 22, 1962). Continues 497. Made public: 1997. Names: Zhou Enlai.'
