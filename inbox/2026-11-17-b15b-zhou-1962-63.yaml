      date: '1962-01-06'
      thread: china-leadership
      c: Zhou Enlai, with Soong Ching-ling, Chen Yi and Deng Yingchao, visits the exhibition for the tenth anniversary of *China Reconstructs*. The January issue prints his inscription of Nov. 23, 1961.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 450 (Jan. 6, 1962). Names: Zhou Enlai, Soong Ching-ling, Chen Yi, Deng Yingchao.'
