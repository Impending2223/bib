      c: The Chinese Ministry of National Defense's spokesman states the full release and return of all the captured Indian military personnel; China has now given India all the Indian personnel taken in the border conflict of 1962 and the bodies and ashes of the dead. After its own cease-fire, withdrawal, leaving empty the disputed places and return of a large lot of captured Indian army material, China, it says, has now released and sent home all prisoners, to make a better mood for direct talks; it urges India to take a positive attitude.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 556 (May 26, 1963).'
