      date: '1963-01-27'
      thread: china-leadership
      c: Zhou Enlai visits the Shanghai instrument plant; and calls on Yuan Xuefen, the Yue opera actress.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 528 (Jan. 27, 1963). Made public: 1997. Names: Zhou Enlai.'
