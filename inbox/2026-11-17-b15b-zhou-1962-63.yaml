      when: Apr. 27
      date: '1962-04-27'
      thread: china-leadership
      c: 'The Central Committee transmits Zhou Enlai''s Opinions on the assignment of college graduates and agrees to his proposals: an assignment committee under Xi Zhongxun for the 1962 graduates, and a special group under Nie Rongzhen to review and draw up the political standards for taking on graduates in each field.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 474 (Apr. 27, 1962). Made public: 1997. To check: the transmittal. Names: Zhou Enlai, Xi Zhongxun, Nie Rongzhen.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:nie-rongzhen
      - vis:only:prc
