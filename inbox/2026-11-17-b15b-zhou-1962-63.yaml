- add:
    entry:
      id: cal.1962-02-17.china-leadership
      when: Feb. 17
      date: '1962-02-17'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai to Peking''s dramatists, before the drama writers'' meeting at Canton: let them "vent" first, to clear the air. Since 1959 the arts have broken old superstitions (reverence for the past, for the foreign) and made new ones (all of today good, all of the past bad, all of China good, all of abroad bad), and writers dare not write. The Party leads but does not take over; politics and art differ; the spirit of the age is not the Party''s resolutions put on the stage; contradictions among the people as well as with the enemy are to be shown.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 457 (Feb. 17, 1962). Made public: 1997. To check: the speech''s text. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
