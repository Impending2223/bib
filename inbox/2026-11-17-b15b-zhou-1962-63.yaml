      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-26.china-leadership
      when: Nov. 26–27
      date: '1962-11-26'
      thread: china-leadership
      c: 'Zhou Enlai at the Secretariat, Nov. 26 and 27, hearing Lu Dingyi, Li Fuchun and Li Xiannian. Nov. 26, on the first Five-Year Plan''s education work: one should think coolly and not call it all few, slow, poor, costly and copied; some was, some was not; the whole plan is not to be denied. On intellectuals: his report for the Center that most serve the working people is in line with the class view; Deng Xiaoping says the Premier''s report was approved by the Center.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 515 (Nov. 26–27, 1962). Continues 516. Made public: 1997. Names: Zhou Enlai, Lu Dingyi, Li Fuchun, Li Xiannian, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:lu-dingyi
      - name:li-fuchun
      - name:li-xiannian
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-28.china-leadership
      when: Nov. 28
      date: '1962-11-28'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai telegraphs Nkrumah: to hold the cease-fire China''s own steps brought about, to have the forces disengage and talks reopen, the most urgent thing is to move Nehru from his continued war preparation and refusal to talk to a positive answer to China''s proposals; the conference of six leading Afro-Asian states Ceylon''s Prime Minister proposed should be held as early as it can.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 516 (Nov. 28, 1962). Made public: 1997. Names: Zhou Enlai, Nkrumah, Nehru.'
      tags:
      - polity:prc
      - polity:ghana
      - polity:india
      - name:zhou-enlai
      - name:nkrumah-kwame
      - name:nehru-jawaharlal
      - vis:only:prc+ghana
- add:
    entry:
      id: cal.1962-11-28.china-leadership-2
      when: Nov. 28
      date: '1962-11-28'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai to Nehru, by letter, the same day: calls on India to take matching steps in time so that both sides push the situation toward relaxation.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 516 (Nov. 28, 1962). Made public: 1997. See [[cal.1962-11-04.south-asia]]. Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+india
- add:
    entry:
      id: cal.1962-11-29.china-leadership
      when: Nov. 29
      date: '1962-11-29'
      thread: china-leadership
      c: 'Zhou Enlai presides at the second meeting of the Central Special Committee: the office''s working rules and several problems the Second Ministry of Machine Building asks help on. To strengthen its science and technology and its Party and administrative leadership, the departments, the forces, the colleges and the research bodies are ordered to pick 500 of their best people for it and assign over 1,100 instruments and sets of equipment by the end of December; some technical equipment may be imported from capitalist countries. Many of the persons were named or approved by Zhou himself.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 516 (Nov. 29, 1962). Footnote at 516. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-12-03.china-leadership
      when: Dec. 3
      date: '1962-12-03'
      thread: china-leadership
      also:
      - south-asia
      - indonesia
      c: 'Zhou Enlai receives Indonesia''s Ambassador, Sukarni, who leaves Dec. 5 for the Colombo conference: the Sino-Indian border is calmer, since China stopped fire and withdrew of its own accord and will not fight again; the trouble is India; even British and American military experts do not favor an Indian war, and Nehru knows it; the Indian papers'' daily cry for war is only to hearten; so Afro-Asian work may now have effect. Why China withdrew so fast: to avoid widening the conflict; it does not favor force for the border; and it will not push India to the West.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 516 (Dec. 3, 1962). Continues 517. Made public: 1997. Check: the ambassador''s name in Roman letters. Names: Zhou Enlai, Sukarni, Nehru.'
      tags:
      - polity:prc
      - polity:indonesia
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+indonesia
- add:
    entry:
      id: cal.1962-12-03.china-leadership-2
      when: Dec. 3
      date: '1962-12-03'
      thread: china-leadership
      also:
      - laos
      c: Zhou Enlai receives the Royal Lao government's delegation under Phoumi Nosavan, Deputy Prime Minister and Minister of Finance, and talks of loan aid for Laotian construction and related matters.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 517 (Dec. 3, 1962). Made public: 1997. Names: Zhou Enlai, Phoumi Nosavan.'
      tags:
      - polity:prc
      - polity:laos
