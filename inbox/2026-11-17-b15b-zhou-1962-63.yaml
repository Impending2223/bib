      when: June 9
      date: '1962-06-09'
      thread: china-leadership
      c: Zhou Enlai to the Northeast Bureau's reporting meeting on the grain difficulty in the whole country and the Center's plan for cutting staff and urban people; as Liaoning's grain is very tight he arranges with the Center an extra 50 million jin.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 482 (June 9, 1962). Made public: 1997. Names: Zhou Enlai.'
