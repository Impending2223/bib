      c: 'Zhou Enlai, on the Ministry of Metallurgy''s first summary of its aid to Vietnam and Algeria: how much investment the Vietnamese steel plant, mines, power station and works outside the plant would take at international prices, less what was waste and rework on China''s side; the Ministry and the Foreign Economic Liaison Bureau are to work it out together and tell him.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 587 (Oct. 14, 1963). Made public: 1997. Names: Zhou Enlai.'
