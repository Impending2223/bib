      c: Zhou Enlai replies to Lord Bertrand Russell's letter on the truth of the Sino-Indian boundary question and China's constant stand on settling it by peaceful talks on equal cooperation and mutual accommodation. Russell's new book *Unarmed Victory* is, he writes, not true to history on Tibet's status and liberation and the background of the illegal McMahon line, and Russell's understanding of the Chinese government's peaceful foreign policy is far from full.
