      date: '1962-01-05'
      thread: china-leadership
      c: Zhou Enlai, with Chen Yi, Nie Rongzhen and Lu Dingyi, at the banquet for Peking's scientists and technicians; his toast calls on them to work with hard effort and self-reliance for new victories in 1962.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 449 (Jan. 5, 1962). Names: Zhou Enlai, Chen Yi, Nie Rongzhen, Lu Dingyi.'
