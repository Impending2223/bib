      c: Zhou Enlai, at the close of the Work Conference, settles with Deng Xiaoping to call another conference Feb. 8 of the regional bureaus' and the provinces' secretaries on six documents, among them the estimate of grain output and procurement for 1962–63, the cotton quotas by province, and the draft decision to cut 7 million more urban people in the first half of 1962. In the days after he calls the responsible persons again on grain, planning, streamlining, commerce, foreign affairs and the military.
