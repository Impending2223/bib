      date: '1963-04-22'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai in talks with Ali Sabri, Apr. 22 and 23, on the international situation, the Sino-Indian border and Sino-UAR relations. Apr. 22: if Sabri at New Delhi finds India willing to cooperate and not make its reading of the Colombo proposals a precondition, both may accept them in principle as the basis for talks; then China can talk; he hopes Sabri will persuade Nehru so that talks start early.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 549 (Apr. 22–23, 1963). Made public: 1997. Names: Zhou Enlai, Ali Sabri, Nehru.'
