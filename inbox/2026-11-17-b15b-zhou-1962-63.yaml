      c: 'Zhou Enlai telegraphs Fidel Castro and Cuba''s National Assembly: China''s support of the Cuban people; condemns the American-run resolution of the foreign ministers'' conference of the American states against Cuba as against the will of 200 million Latin Americans, a breach of non-intervention and self-determination, wholly illegal.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 455 (Feb. 3, 1962). Names: Zhou Enlai, Fidel Castro.'
