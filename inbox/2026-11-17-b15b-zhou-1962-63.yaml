      c: Zhou Enlai, during the Central Committee's conference on border defense on the Sino-Soviet and Sino-Mongolian frontiers, Sept. 16–Oct. 13, hears the conference's leading group and gives views on the policies of border defense. The conference discusses concrete measures and drafts the rules on several policy questions of border defense in the border areas.
