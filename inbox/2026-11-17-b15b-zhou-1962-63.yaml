      thread: china-leadership
      c: 'Zhou Enlai presides at the 129th plenary meeting of the State Council, a general mobilization on streamlining the organs directly under the Center: of 51,000 people to cut to 46,000, which can be done; the Center must finish first so that the localities can; the center of it is leadership. He repeats the Streamlining Group''s ten measures; with the Lei Feng style, the communist style, the air will change; all must see the whole, the country as one chessboard. For the State Council''s own simplification each department is to send the Center and the State Council a summary report every three months.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 543 (Mar. 30, 1963). Made public: 1997. Names: Zhou Enlai.'
