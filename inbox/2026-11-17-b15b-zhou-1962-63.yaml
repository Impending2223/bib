      date: '1962-12-30'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai to Nehru, by letter: China has made unremitting efforts for a peaceful settlement of the differences; he hopes both sides will seek a reasonable settlement by those principles. He proposes that officials of the two meet at once on the arrangements for disengagement and withdrawal, checkposts and the return of prisoners, and in January 1963 meet in Peking, in Delhi or in the capital of a friendly Afro-Asian state.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 521 (Dec. 30, 1962). Made public: 1997. To check: the letter''s text. Names: Zhou Enlai, Nehru.'
