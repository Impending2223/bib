    entry:
      id: cal.1963-12-08.china-leadership
      when: Dec. 8
      date: '1963-12-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, hearing Liu Zhaolun, head of Guangdong''s Water and Power Department, on the Shima River works to give Hong Kong more fresh water, and talking with Tao Zhu, Chen Yu, Cheng Zihua: over 95 percent of Hong Kong''s people are our compatriots, so the water works are the nation''s and go into the state plan with no hand for the British Hong Kong authorities; the water talks may go on apart from political talks; the Shima River scheme with lifting by stages is best, quicker, cheaper, and can join farm irrigation with the people''s zeal.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 600 (Dec. 8, 1963). Made public: 1997. Names: Zhou Enlai, Tao Zhu, Cheng Zihua.'
      tags:
      - polity:prc
