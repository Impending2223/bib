      when: Dec. 18
      date: '1963-12-18'
      thread: china-leadership
      also:
      - middle-east
      c: 'Zhou Enlai in talks with Nasser proposes two ways to develop the two countries'' economic and trade relations: enlarge trade and exchange non-traditional goods; and, as the UAR needs and China can, China could give the UAR a 50-million-dollar interest-free loan to help its industrial building.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 602 (Dec. 18, 1963). Made public: 1997. Names: Zhou Enlai, Nasser.'
      tags:
      - polity:prc
      - polity:uar
