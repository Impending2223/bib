      c: 'Zhou Enlai to the Propaganda Department and the Ministry of Culture on films imported from abroad: fewer, to leave copies for printing China''s own; mind quality, none with a revisionist trend or low taste; all to be passed by a special group named by the Propaganda Department, with the Foreign Affairs Office, before dubbing; a few typical ones may be bought for internal education, not many; and the censors at the film company must be stronger politically when it first reviews foreign orders.'
