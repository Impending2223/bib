- add:
    entry:
      id: cal.1963-12-27.china-leadership-4
      when: Dec. 27–31
      date: '1963-12-27'
      thread: china-leadership
      also:
      - africa-algeria-morocco
      - africa
      c: Zhou Enlai visits Morocco, Dec. 27–31. Dec. 28 he talks with King Hassan, explaining farming as base and industry as leader and self-reliance, which will take ten to twenty years and does not shut out trade; China, met with American hostility and blockade, does not mean to start an armed clash with America and believes the two will in the end agree. He calls on Prime Minister Bahnini; Dec. 30 goes to Casablanca; Dec. 31 the China–Morocco joint communique is issued.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 604 (Dec. 27–31, 1963). Continues 605. Made public: 1997. Names: Zhou Enlai, Hassan II, Ahmed Bahnini.'
      tags:
      - polity:prc
      - polity:morocco
      - polity:us
      - name:zhou-enlai
      - name:hassan-ii
      - vis:only:prc+morocco
