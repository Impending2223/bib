      when: Dec. 7–8
      date: '1963-12-07'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai tours the Pearl River mouth front units in the South Sea Fleet's ship no. 846, Dec. 7 and 8, and tells the sailors they work hard and with honor; with them guarding the sea Mao and the whole people are at ease.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 600 (Dec. 7–8, 1963). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
