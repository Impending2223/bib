      when: Sept. 16–Oct. 12
      date: '1963-09-16'
      thread: china-leadership
      c: 'Zhou Enlai presides, Sept. 16–Oct. 12, at the second city work conference. It finds the cities'' situation good, yet the five-antis not wholly under way, industrial adjustment unfinished, grain, oil and cloth short, birth rate too high, placing of labor unsettled. Eight tasks: finish industrial adjustment; do commerce well; build suburban farming; repair housing and city works; family planning; place labor; try vocational education; strengthen city administration.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 579 (Sept. 16–Oct. 12, 1963). Made public: 1997. To check: the conference papers. Names: Zhou Enlai.'
