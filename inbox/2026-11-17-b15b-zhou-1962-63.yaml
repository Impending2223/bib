      when: Nov. 22
      date: '1962-11-22'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai, on Mao's view of the night of Nov. 21, calls Chen Yi and people of the Foreign Affairs Office, the Foreign Ministry, the Propaganda Department and the *Renmin ribao* to take up international and domestic work on the boundary question and gives instructions; on Nov. 23 he reports the arrangements by letter to Mao, Liu Shaoqi, Zhu De, Deng Xiaoping, Peng Zhen and Luo Ruiqing.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 22, 1962). Made public: 1997. See [[cal.1962-11-21.china-leadership-2]]. Names: Zhou Enlai, Chen Yi, Mao Zedong, Liu Shaoqi, Zhu De, Deng Xiaoping, Peng Zhen, Luo Ruiqing.'
