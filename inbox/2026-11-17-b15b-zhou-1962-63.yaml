- add:
    entry:
      id: cal.1963-07-25.china-leadership
      when: July 25
      date: '1963-07-25'
      thread: china-leadership
      c: 'Zhou Enlai at the Secretariat. On farming: Mao does not agree to spread socialist education everywhere; the class ranks may be organized only where there are work teams, as Henan shows. Mao thinks 1963–65 three years of adjustment and learning to manage, then a new high tide; no hurry to publish figures; a Party congress in 1969. On placing people: city employment needs 2.5 million jobs a year, the cities take 1 million, 1.5 million go to production teams, farms and new reclamation. The meeting agrees to his proposal of a General Bureau of Capital Construction under the State Planning Commission.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 567 (July 25, 1963). Continues 568. Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
