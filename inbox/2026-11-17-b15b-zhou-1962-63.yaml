      c: 'Zhou Enlai, on a Foreign Ministry telegram: since the CPSU''s 22nd Congress railway staff at the Sino-Soviet border stations have been rude to the Soviet side, with anti-Soviet pictures on trains. He had phoned Heilongjiang, Jilin, Inner Mongolia and Xinjiang to stop it; now proposes Peng Zhen call the heads and send inspection groups, led by public security, to Qiqihar, Manzhouli, Suifenhe, Dalian, Erlian and Jining for a month. Feb. 19 he sees Liu Xiao, Ambassador to the Soviet Union.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 458 (Feb. 18–19, 1962). Made public: 1997. Names: Zhou Enlai, Peng Zhen, Liu Xiao.'
