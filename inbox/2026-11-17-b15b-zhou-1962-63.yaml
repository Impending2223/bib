      c: 'Zhou Enlai, with Ali Sabri at Malu commune, Jiading county, Shanghai, asks about the commune''s organization and staff, the cadres'' and members'' living and thought, trade and production; to the commune cadres: cadres must work with their hands, primary schools need more teaching of farm knowledge, local cadres are to be trained, run many lines of production; toward output be both prudent and keen.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 550 (Apr. 24, 1963). Made public: 1997. Names: Zhou Enlai, Ali Sabri.'
