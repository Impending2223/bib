      date: '1962-01-20'
      thread: china-leadership
      c: 'Zhou Enlai sees Li Ruishan, Party secretary of Nangong County, Xingtai prefecture, Hebei, a delegate to the conference: asks about the county''s work, living, population, land and grain yield; tells him to grow more cotton for the state; on summing up work, better short than over; on inspecting it, better over than short.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 453 (Jan. 20, 1962). Made public: 1997. Names: Zhou Enlai, Li Ruishan.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
