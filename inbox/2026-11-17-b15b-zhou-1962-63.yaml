      when: Apr. 26
      date: '1962-04-26'
      thread: china-leadership
      c: 'Zhou Enlai to the Secretariat: his "Opinions on improving the assignment of college graduates." Graduates are an important resource, yet they have been used outside their training and wasted; the Ministry of Education, which trains them, takes no part in assigning them; assignment must tie in closely with training; he sets out a set of methods.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 473 (Apr. 26, 1962). Continues 474. Made public: 1997. To check: the Opinions. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
