      date: '1963-01-01'
      thread: china-leadership
      c: Zhou Enlai at the banquet the CPPCC gives for members of the CPPCC and deputies of the NPC, heads of the democratic parties and of government departments in Peking aged seventy and more; he speaks off the cuff, wishing the elders to live to a hundred.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 523 (Jan. 1, 1963). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
