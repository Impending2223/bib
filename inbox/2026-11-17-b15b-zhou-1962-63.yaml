      when: Oct. 5
      date: '1962-10-05'
      thread: china-leadership
      also:
      - korea
      c: 'Zhou Enlai with responsible persons on trade with and aid to Korea. On the Foreign Economic Liaison Bureau''s report on complete-plant projects: in principle China takes the initiative and gives Korea the aid that is possible and needed, so its economy can industrialize. Earlier he had told Fang Yi, Ye Jizhuang and the Foreign Affairs Office to sort economic cooperation with socialist and newly independent states into classes and put principles to the Center.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 500 (Oct. 5, 1962). Made public: 1997. Names: Zhou Enlai, Fang Yi, Ye Jizhuang.'
