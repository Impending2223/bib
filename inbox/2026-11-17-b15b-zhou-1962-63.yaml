      c: Zhou Enlai, before Jan. 15, studies with Mao the 1963 plan, capital construction, agriculture, the market, finance and streamlining, and at Mao's request drafts a Central Committee notice on them, to take up when the regional secretaries come to Peking.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 525 (Jan., before the 15th, 1963). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
