      date: '1962-04-03'
      thread: china-leadership
      c: 'Zhou Enlai issues the Central Committee''s and State Council''s decision on unified control of commercial funds and a changed way of handing in commercial profits: from 1962 the funds of enterprises of the Ministry of Commerce''s system at all levels are held by the Ministry; it answers to the state for profits, the lower levels to it.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 469 (Apr. 3, 1962). Made public: 1997. To check: the decision. Names: Zhou Enlai.'
