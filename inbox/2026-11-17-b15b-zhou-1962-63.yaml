      date: '1962-03-28'
      thread: china-leadership
      c: 'Zhou Enlai at the NPC, second part of the Government Work Report, on the domestic situation and tasks. For 1958–60: great gains, but targets too high and construction too large, so the proportions of farming, light and heavy industry fell out of line; waste, no cost accounting; staff and urban population grew too fast. He takes the State Council''s blame; the laws of socialist building are not yet understood. Adjustment: 1962 the key year; farming, light, heavy industry in order; most intellectuals are working people''s intellectuals; to move the two mountains of poverty and backwardness. In the session he sees people from Sichuan, Henan and Hebei on grain and cotton.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 466 (Mar. 28, 1962). Continues 467. To check: the report as printed in the *Renmin ribao*. Names: Zhou Enlai.'
