      date: '1962-10-18'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai approves the Ministry of Culture's Party group's report on emergency repair of the cliff of the Mogao Caves at Dunhuang, directs the State Planning Commission to provide for it in the 1963 plan, and advances 50,000 yuan this year.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 503 (Oct. 18, 1962). Made public: 1997. Names: Zhou Enlai.'
