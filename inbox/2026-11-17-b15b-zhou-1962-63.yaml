      thread: china-leadership
      also:
      - korea
      c: Zhou Enlai with the Northeast Bureau's heads on the China–Korea border question.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 481 (June 3, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
