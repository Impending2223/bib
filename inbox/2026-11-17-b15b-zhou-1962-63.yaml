- add:
    entry:
      id: cal.1962-11-25.china-leadership-2
      when: Nov. 25
      date: '1962-11-25'
      thread: china-leadership
      c: Zhou Enlai with members of the leading group of the State Planning Commission on planning work.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 515 (Nov. 25, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
