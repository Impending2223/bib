      c: Zhou Enlai and Chen Yi receive Ceylon's Prime Minister's special envoy, G. S. Peiris, Ambassador to Burma, who hands over the six-state conference's appeal to China and India for a peaceful settlement. Zhou admires Ceylon's initiative; the aim is direct talks of China and India for a peaceful settlement; China will talk at any time; it welcomes Bandaranaike's visit, to speak of the border and of Sino-Ceylonese friendship.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 519 (Dec. 22, 1962). Continues 520. Made public: 1997. Names: Zhou Enlai, Chen Yi, G. S. Peiris, Srimavo Bandaranaike.'
