      when: Nov. 4
      date: '1963-11-04'
      thread: china-leadership
      c: Zhou Enlai flies back to Peking.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 593 (Nov. 4, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
