      date: '1963-05-13'
      thread: china-leadership
      also:
      - japan
      c: Zhou Enlai reviews the ships of the force about to sail and settles in detail its make-up, communications, underwater work and supply; to the East Sea Fleet's cadres and the crews going out he sets out why the *Yuejin* most probably struck a reef, to be judged finally by their survey on the spot. That night he takes up with persons concerned the working together of the Navy and naval air. To prove the cause he will take no "probably" or "perhaps," only full evidence. He takes the matter up again May 17 and 28.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 553 (May 13, 1963). Continues 554. Made public: 1997. Names: Zhou Enlai.'
