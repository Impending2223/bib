      when: Feb. 25
      date: '1963-02-25'
      thread: china-leadership
      c: 'Zhou Enlai at the Secretariat. On the "four clean-ups" in Hunan and Henan villages said to be done too hastily: he has told Mao, who says to try them by pilot and not to hurry; organizing the poor and lower-middle peasants likewise, pilot first, regulations after; the cities'' five-antis Peng Zhen is to take up; some industrial targets are too much nationwide and must not grow, others fall short and must be arranged; next year the order of capital construction, orders first, then production, then the plan last, is to be turned round to plan, production, orders.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 535 (Feb. 25, 1963). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Peng Zhen.'
