      date: '1963-05-09'
      thread: china-leadership
      c: 'Zhou Enlai to Mao and Peng Zhen, by letter again, on the inquiry into the *Yuejin* and how to deal with it: the lesson is very great; it first showed the Ministry of Communications'' grave bureaucracy and next some responsibility in the Navy; to check the preparations for the voyage and find out what the Shanghai Maritime Bureau and the East Sea Fleet had settled on the *Yuejin*''s route to Japan and her escort, he proposes to go to Shanghai May 10 with Luo Ruiqing or Yang Chengwu.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 552 (May 9, 1963). Made public: 1997. To check: the letter. Names: Zhou Enlai, Mao Zedong, Peng Zhen, Luo Ruiqing, Yang Chengwu.'
