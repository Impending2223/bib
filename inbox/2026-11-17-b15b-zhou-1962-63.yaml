      c: Zhou Enlai, "A Great Socialist Revolutionary Movement," twice, May 29 and June 13, to meetings of responsible cadres of the Central Committee's and State Council's organs, on the draft decision on rural work and bureaucracy in the five-antis. Bureaucracy, the political disease leading organs most easily catch, decays cadres and masses and at worst is a decline of revolutionary will; he gives its roots and twenty forms, four basic buildups (thought, politics, organization, economy), and the five hurdles for leading cadres.
