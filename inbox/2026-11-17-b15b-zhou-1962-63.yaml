      date: '1963-09-20'
      thread: china-leadership
      also:
      - indonesia
      c: 'Zhou Enlai receives Mrs. Supeni, Assistant to Indonesia''s Foreign Minister: of United Nations decisions, look to substance as well as form; if a resolution favors the world''s peoples China does not object though its seat is not restored; if it is bad, China objects whether in or out; so China now holds that its seat and the amendment of the Charter should no longer be tangled together.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 581 (Sept. 20, 1963). Made public: 1997. Names: Zhou Enlai.'
