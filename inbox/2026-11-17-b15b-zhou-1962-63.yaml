    entry:
      id: cal.1963-03-02.china-leadership
      when: Mar. 2–3
      date: '1963-03-02'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai and Chen Yi talk with Pakistan's Foreign Minister, Zulfikar Ali Bhutto, Mar. 2 and 3. Who first starts a war loses; a nuclear war, a general world war will not be fought, for industry, labor, buying power and markets would be wrecked; but local wars will be. One must see the world's changes and unite the Afro-Asian states in friendship; their economies are backward, they need industry and peace to build. He welcomes Bhutto's offer to be a bridge between China and the United States.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 538 (Mar. 2–3, 1963). Made public: 1997. Names: Zhou Enlai, Chen Yi, Bhutto.'
      tags:
      - polity:prc
      - polity:pakistan
      - polity:us
