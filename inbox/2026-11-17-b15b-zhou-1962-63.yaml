      date: '1963-05-12'
      thread: china-leadership
      c: Zhou Enlai at the Navy's Sixth Research Institute watches divers in a compression test, stays by the chamber and asks them of their feelings; he reminds the leaders to think through the divers' safety.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 553 (May 12, 1963). Made public: 1997. Names: Zhou Enlai.'
