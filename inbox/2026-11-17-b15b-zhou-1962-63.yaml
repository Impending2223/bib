      when: Dec. 9
      date: '1962-12-09'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai telegraphs Bandaranaike, for the Colombo conference of non-aligned states, wishing success to the six-state Afro-Asian conference to promote reopening of Sino-Indian talks: the boundary question can and should be settled by peaceful talks between the two for a fair and reasonable outcome; China''s cease-fire and pullback of its own accord have stopped the clash and eased the situation, and it has begun to release Indian wounded and sick prisoners.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 518 (Dec. 9, 1962). Continues 519; footnote: the conference met at Colombo Dec. 10–12 and hoped Bandaranaike would visit Peking and Delhi to carry its views. Made public: 1997. Names: Zhou Enlai, Srimavo Bandaranaike.'
      tags:
      - polity:prc
      - polity:ceylon
      - name:zhou-enlai
