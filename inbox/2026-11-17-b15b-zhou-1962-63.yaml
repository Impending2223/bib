      date: '1962-10-21'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai approves the request of the Foreign Ministry and the Foreign Economic Liaison Bureau to pay Nepal 700,000 pounds sterling in foreign exchange for the road China is building in Nepal, any shortfall of cost to be paid in goods; the road is to be finished early.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 504 (Oct. 21, 1962). Made public: 1997. Names: Zhou Enlai.'
