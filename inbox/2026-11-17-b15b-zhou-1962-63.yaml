      thread: china-leadership
      c: 'Zhou Enlai agrees to the opinions and the arrangements for receiving demobilized army cadres in the State Council Finance and Trade Office''s explanation, and comments: the Office is to name a person to settle with the General Political Department the steps for receiving them and to pass the word to the finance and trade offices of the provinces, cities, regions, prefectures and counties and to the military organs concerned.'
