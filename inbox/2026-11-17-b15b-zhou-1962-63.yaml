    entry:
      id: cal.1963-10-18.china-leadership-2
      when: Oct. 18
      date: '1963-10-18'
      thread: china-leadership
      c: 'Zhou Enlai at the evening party for the fortieth anniversary of *Chinese Youth* and its exhibition: the magazine should "face the countryside and the city," give the young knowledge of science, production, philosophy and class struggle, and speak of the world situation; short literary pieces, new revolutionary songs, cartoons; short articles, simple, lively, easy to understand.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 588 (Oct. 18, 1963). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
