      c: Zhou Enlai at the reception of Cuba's Ambassador, Pino Santos, for the ninth anniversary of the Cuban revolution of July 26, meets Melba Hernández, a heroine of the attack on the Moncada barracks; praises the Cuban revolutionaries' unyielding spirit. To open a revolutionary road is hard; once opened, people can go forward along it.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 491 (July 26, 1962). Names: Zhou Enlai, Melba Hernández.'
      tags:
