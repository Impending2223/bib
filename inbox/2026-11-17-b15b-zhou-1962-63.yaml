      c: 'Zhou Enlai in Korea, Oct. 11–13: talks with Kim Il Sung on China''s domestic situation, the Sino-Indian and Sino-Mongolian border questions, and Sino-Korean trade. He flies back to Peking Oct. 13.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 502 (Oct. 11–13, 1962). Made public: 1997. Names: Zhou Enlai, Kim Il Sung.'
