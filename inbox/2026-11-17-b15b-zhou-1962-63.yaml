      thread: china-leadership
      also:
      - laos
      - vietnam-hanoi
      c: 'Zhou Enlai, at the banquet welcoming Ưng Văn Khiêm, head of the Vietnamese delegation, and Phoumi Vongvichit, of the Laotian delegation, after the Geneva Conference: congratulates it on its international agreement for a peaceful settlement on Laos. The signing begins a new struggle; the agreement''s carrying out depends on every side; the states at Geneva have only a duty to keep it and no right to meddle in Laos''s affairs.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 491 (July 27, 1962). Continues 492. Names: Zhou Enlai, Ưng Văn Khiêm, Phoumi Vongvichit.'
