- add:
    entry:
      id: cal.1962-11-08.china-leadership
      when: Nov. 8
      date: '1962-11-08'
      thread: china-leadership
      c: 'Zhou Enlai receives the heads of the regional agricultural offices and the delegates to the conference on placing cut urban workers and young students in state farms, forests, herding and fisheries. On land reclamation: not one side only; in surveying the reclamation of Jiangxi''s lake area do not fear opposing views, hear many. Population was attended to late and now is; family planning and sending townspeople to the country are no small matter and are to be kept in hand.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 511 (Nov. 8, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-09.china-leadership
      when: Nov. 9
      date: '1962-11-09'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai, at the Cambodian chargé''s National Day reception, on India''s war mobilization and its continued troop buildup on the border: India seems to plan a new offensive to take more Chinese land, which China cannot tolerate; it will not bow to force but still holds to peaceful talks.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 511 (Nov. 9, 1962). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:cambodia
      - polity:india
      - name:zhou-enlai
