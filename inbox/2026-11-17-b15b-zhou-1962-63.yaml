      thread: china-leadership
      c: 'Zhou Enlai attends the meetings of July 28 and 29 on grain, discussing the State Council Finance and Trade Office''s revised report on grain for the Central work conference: to consolidate the collective economy and raise every peasant''s drive, besides rallying the whole Party and country behind the communes, the state''s grain procurement from the peasants is to be cut again and fixed at a level for a period, with state, collective and individual interests and town and country lives both weighed.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 492 (July 28–29, 1962). Continues 493. Made public: 1997. Names: Zhou Enlai.'
