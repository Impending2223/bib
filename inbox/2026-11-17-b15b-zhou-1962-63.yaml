      c: 'Zhou Enlai at the Secretariat on the combined development of grain, cotton, coal and timber; stresses two lines: develop production and guarantee supplies; guarantee the peasants'' ration, procure less, send up more, import less each year, dig out the potential locally. A note: Mao at the Central work conference in August had said this year''s grain plan should buy a little less, sell a little less, send up more, import less, and dig more local potential.'
