      thread: china-leadership
      c: 'Zhou Enlai signs the Central Committee''s comment approving the Defense Industry Office''s report on the equipment and supplies needed for war preparation and their placing: though the basis of an independent economy and a defense industry has been laid, there are many weaknesses in peacetime preparation for war, to be overcome fast.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 482 (June 10, 1962). Made public: 1997. To check: the comment as issued. Names: Zhou Enlai.'
