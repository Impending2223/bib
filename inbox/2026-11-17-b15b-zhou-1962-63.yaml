      date: '1963-12-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at Kunming, revising the "Main Points of the Seven-Year (1964–70) Plan for Primary, Middle and Vocational Education (preliminary draft)," with attachments, that Zhang Jichun drafted on his views with the Ministry of Education; to Deng Xiaoping by letter: it is an important plan, and though the draft is not ripe, the rise in operating and capital funds in the next seven years cannot be great, so only these first figures are put for study.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 600 (Dec. 12, 1963). Made public: 1997. To check: the draft and the letter. Names: Zhou Enlai, Zhang Jichun, Deng Xiaoping.'
