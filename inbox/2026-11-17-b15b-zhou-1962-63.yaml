      c: 'Zhou Enlai presides at the fifth meeting of the Central Special Committee; after Liu Xiyao reports on the working groups'' inspection of the Second Ministry of Machine Building, he says of its two-year plan to hold the first nuclear test in 1964 that with a plan there are tracks; be truthful, go by steps, persist, no pride or haste. The ministry''s work is to have "three highs": political and ideological quality; scientific planning; organization and discipline. The three were taken up in the Second Ministry and the other defense branches as a long guide.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 541 (Mar. 21, 1963). Continues 542. Made public: 1997. Names: Zhou Enlai, Liu Xiyao.'
