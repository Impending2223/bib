    entry:
      id: cal.1963-08-04.china-leadership-3
      when: Aug. 4
      date: '1963-08-04'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai hosts Abdirashid Ali Shermarke, Prime Minister of Somalia, on an invited visit, Aug. 4–10. Aug. 5, in talks: a state newly independent must struggle long politically before its independence is secure, before it is independent economically; take Western aid with care and let it gain no political privilege; with African brother states settle by talks, never by force. He again gives the four principles of China''s aid to friendly Afro-Asian states he gave the Somali Minister of Information on May 15.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 570 (Aug. 5, 1963). Continues 571. Made public: 1997. Names: Zhou Enlai, Abdirashid Ali Shermarke.'
      tags:
      - polity:prc
      - polity:somalia
      - name:zhou-enlai
      - name:abdirascid-ali-shermarke
      - vis:only:prc+somalia
- add:
    entry:
      id: cal.1963-08-07.china-leadership
      when: Aug. 7–9
      date: '1963-08-07'
      thread: china-leadership
      also:
      - soviet-union
      - africa
      c: 'Zhou Enlai goes with Shermarke to Shanghai. On the plane he tells him of China''s revolution: China was the first to oppose dogmatism; practice with no principle is empiricism and revisionism. At Shermarke''s request he tells of the Sino-Soviet ideological differences, and calls talk that China wants a world war and could lose half "all nonsense." Back Aug. 9, he says on the way that to put China''s house in order is to put right a quarter of the world.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 570 (Aug. 7–9, 1963). Made public: 1997. Names: Zhou Enlai, Abdirashid Ali Shermarke.'
      tags:
      - polity:prc
      - polity:somalia
      - polity:ussr
      - name:zhou-enlai
      - name:abdirascid-ali-shermarke
      - vis:only:prc+somalia
- add:
    entry:
      id: cal.1963-08-10.china-leadership
      when: Aug. 10
      date: '1963-08-10'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai tells Shermarke, on the stopping of nuclear tests: China holds for a total ban and thorough destruction of nuclear arms; the three-power treaty leaves the nuclear powers every right to go on producing, to add to stocks, to test underground, to use the arms and to find pretexts to resume tests in the air; it ties the hands and feet of non-nuclear states and is wholly unequal.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 570 (Aug. 10, 1963). Continues 571. Made public: 1997. Names: Zhou Enlai, Abdirashid Ali Shermarke.'
      tags:
      - polity:prc
      - polity:somalia
      - polity:ussr
      - polity:us
      - polity:uk
      - name:zhou-enlai
      - name:abdirascid-ali-shermarke
      - vis:only:prc+somalia
- add:
    entry:
      id: cal.1963-08-05.china-leadership
      when: Aug. 5
      date: '1963-08-05'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, told that for two or three days a downpour along the Shijiazhuang–Anyang line has cut the railway, flooded towns, broken power lines and drowned telephone lines, and that the Jingxing and Fengfeng mines may be flooded, at once informs Deng Xiaoping, Peng Zhen, Li Xiannian and Tan Zhenlin; the same day he calls the heads of water conservancy and coal and hears the facts. They decide to bring power from Anyang to save the Fengfeng mine and give up one old shaft of Jingxing to save the other three.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 571 (Aug. 5, 1963). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Xiannian, Tan Zhenlin.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:peng-zhen
      - name:li-xiannian
      - name:tan-zhenlin
