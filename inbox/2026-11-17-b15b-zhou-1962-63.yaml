      when: Apr. 21
      date: '1963-04-21'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives Ali Sabri, Chairman of the UAR''s Executive Council. On a second Afro-Asian conference: whatever the border question, wherever the conference is held, even at Delhi, he will go; the question is whether India will. Some Afro-Asian states may have bilateral troubles for a time, but the important thing is Afro-Asian unity against imperialism and colonialism, the highest common interest, to which two-state quarrels come second.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 549 (Apr. 21, 1963). Made public: 1997. Names: Zhou Enlai, Ali Sabri.'
