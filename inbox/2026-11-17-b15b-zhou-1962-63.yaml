      when: Feb. 26
      date: '1963-02-26'
      thread: china-leadership
      c: 'Zhou Enlai, "The Present Situation and Our Tasks," to the joint session of the national conference on agricultural science and technology (Feb. 8–Mar. 31, over 1,200 specialists, which fixed the 1963–72 plan) and the PLA''s conference on political work. Science and technology are weak, some at the level of the 1930s and 1940s; the tasks: fulfill the 1963 plan, including the last million of cuts in the first half; go on with the science plan; strengthen defense; socialist education. He sums up Lei Feng in four phrases and says he too learned from him. Population grew 3.1 percent last year; he wants 2 percent, the cities 1.5, taking fifteen years.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 536 (Feb. 26, 1963). Continues 537. Made public: 1997. Names: Zhou Enlai, Lei Feng.'
      tags:
      - polity:prc
