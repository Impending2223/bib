      thread: china-leadership
      c: Zhou Enlai with persons concerned on the 1963 capital construction plan, Dec. 22 and 23.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 520 (Dec. 22–23, 1962). Made public: 1997. Names: Zhou Enlai.'
