      c: 'Zhou Enlai watches the Central Opera and Ballet''s restaging of *The White-Haired Girl*: too many in the orchestra, Western and folk instruments mixed, too loud, drowning the singers; "what I felt at Yan''an I feel not at all now"; he wants the Yan''an style kept.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 488 (July 2, 1962). Made public: 1997. Names: Zhou Enlai.'
