      date: '1963-08-26'
      thread: china-leadership
      c: Zhou Enlai reads the Ministry of Communications Party group's report on inspecting the safety of ocean ships at the South China ports and notes points to watch on the routes of ocean freighters and passenger ships and other matters.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 576 (Aug. 26, 1963). Made public: 1997. Names: Zhou Enlai.'
