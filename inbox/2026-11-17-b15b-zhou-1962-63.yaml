      c: 'Zhou Enlai receives Ghana''s Ambassador, Mercer (默塞尔), on the prospect of settling the Sino-Indian border: relations are more complicated now, and their betterment does not rest on Nehru alone or on the Afro-Asian friends'' goodwill and encouragement; the border question has become a part of the American strategic plan, the most basic matter.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 545 (Apr. 7, 1963). Made public: 1997. Check: the ambassador''s name in Roman letters. Names: Zhou Enlai, Nehru.'
