      c: 'Zhou Enlai, on a Xinhua situation report: reports must give both sides, not one; a leadership that hears one side and is told what it wants drops the mass line and investigation, and grows proud.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 457 (Feb. 16, 1962). Made public: 1997. Names: Zhou Enlai.'
