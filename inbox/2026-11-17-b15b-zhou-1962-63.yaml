      c: Zhou Enlai leaves by train with Deng Yingchao for the Northeast, with several ministers of the State Council's industrial and transport sector. By the Center's decision he goes to the Northeast, Li Fuchun to East China, Li Xiannian to Central-South, Bo Yibo to North China, each to investigate and press the adjustment plan. Earlier he sent Gu Zhuoxin, deputy head of the State Planning Commission, ahead to Shenyang with a working group of over 80 deputy ministers and bureau heads.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 480 (May 28, 1962). Made public: 1997. Names: Zhou Enlai, Deng Yingchao, Li Fuchun, Li Xiannian, Bo Yibo, Gu Zhuoxin.'
