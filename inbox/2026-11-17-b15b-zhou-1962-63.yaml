      c: 'Zhou Enlai, after a report on literature and the arts, receives nineteen of the Peking Opera Troupe''s Hong Kong party, Ma Lianliang, Zhang Junqiu, Qiu Shengrong, Zhao Yanxia and others, on opera reform: rely on experts. Four ways: experts like Sa Kongliao, Lao She and Ma Yanxiang sort and revise old plays; take plays over from other kinds of opera; take over tunes and martial skills; write new plays. First the historical plays, ancient or modern since the Opium War; plays of the present second, not pitched too high. Of critics: accept the right, ignore the nitpickers.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 545 (Apr. 8, 1963). Made public: 1997. Names: Zhou Enlai, Ma Lianliang, Zhang Junqiu, Qiu Shengrong, Zhao Yanxia, Sa Kongliao, Lao She, Ma Yanxiang.'
