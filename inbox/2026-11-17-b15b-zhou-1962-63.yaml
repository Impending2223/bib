      when: Oct. 18
      date: '1963-10-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with the heads of the State Planning Commission, the Ministry of Education, the Ministry of Labor, the Youth League and the Women''s Federation on primary, middle and vocational schooling: higher education serves a break in the advanced and is not to be weakened; but only one to two percent of those entering primary school go to college, so placement of over 1.8 million born in the cities and most born in the villages needs vocational education. Schooling, family planning and employment hang together; a seven-year plan first. Zhang Jichun in charge.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 588 (Oct. 18, 1963). Made public: 1997. Names: Zhou Enlai, Zhang Jichun.'
