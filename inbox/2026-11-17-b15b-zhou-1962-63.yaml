      date: '1963-04-21'
      thread: china-leadership
      also:
      - middle-east
      c: 'Zhou Enlai at the airport, awaiting Ali Sabri, to the UAR''s Ambassador, Imam, who thinks the Israelis dangerous: one cannot say so of a people; a people is always good; great men have come from them, Marx and Einstein; part of that nation suffers foreign oppression and another part oppresses others.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 549 (Apr. 21, 1963). Made public: 1997. Names: Zhou Enlai, Zakaria Adli Imam.'
