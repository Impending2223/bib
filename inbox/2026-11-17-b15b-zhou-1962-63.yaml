      when: Apr. 20
      date: '1963-04-20'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai to Nehru, by letter: the Chinese government has done all it could to promote a peaceful settlement of the boundary question; it has lately decided of its own accord, and begun, to release and send home all the more than 3,000 Indian prisoners. All who respect the facts will judge fairly who has the sincerity to settle it peacefully; if the Indian government for reasons of home and foreign policy is for the moment not ready to negotiate, China will wait with patience.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 548 (Apr. 20, 1963). Continues 549. Made public: 1997. To check: the letter. Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+india
