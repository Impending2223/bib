    entry:
      id: cal.1962-06-04.china-leadership
      when: June 4
      date: '1962-06-04'
      thread: china-leadership
      also:
      - china
      - south-asia
      c: 'Zhou Enlai receives Cambodia''s Prime Minister, Prince Penn Nouth, at Shenyang and flies with him to Dalian. In the plane, on construction: with the right direction and line, the methods are still to be groped for; countries differ, so do their ways to independence and to building; building takes longer than revolution. On the Sino-Indian border: China''s stand is clear, to keep the status quo and settle by talks, and to stop border patrols; China has settled with Burma and Nepal by talks and now starts with Pakistan; why not India. Talks again at Dalian.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 481 (June 4, 1962). Made public: 1997. Names: Zhou Enlai, Penn Nouth.'
      tags:
      - polity:prc
      - polity:cambodia
      - name:zhou-enlai
      - name:penn-nouth
      - vis:only:prc+cambodia
- add:
    entry:
      id: cal.1962-06-04.china-leadership-2
      when: June 4
      date: '1962-06-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with Penn Nouth visits the North Sea Fleet''s ship Anshan and writes for the crew: raise high the victorious red flag of Mao Zedong''s thought and go forward. At sea he tells the crew to look after the foreign guest, "not the slightest great-power chauvinism, anywhere"; over two hours on deck in the swell, talking with the sailors about the ship''s equipment, its use and their own and their families'' lives.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 481 (June 4, 1962). Made public: 1997. Names: Zhou Enlai, Penn Nouth, Mao Zedong.'
