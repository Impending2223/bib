      when: May–June
      date: 1962-05
      thread: china-leadership
      c: 'Zhou Enlai, in May or June, asks Yang Shangkun to telephone Tian Jiaying in Shanghai: whether the private part of the rural economy might be loosened. Tian, Mao''s secretary, had made a country survey in Hunan on Mao''s word and then reported to Mao at Shanghai.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 481 (May–June, 1962). Made public: 1997. Check: the day. Names: Zhou Enlai, Yang Shangkun, Tian Jiaying, Mao Zedong.'
