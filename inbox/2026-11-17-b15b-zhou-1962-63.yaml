      when: Oct. 18
      date: '1962-10-18'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai at the enlarged Politburo meeting on the military line toward India. In days of meetings at Mao''s, the Xilou and the Yinian Tang he studies the tactics of a counterattack in self-defense, follows the border situation from hour to hour and takes part in setting the forces'' deployment. A note: since Oct. 16 Nehru and Menon have urgently planned a large attack on China, and from Oct. 17 the Indian troops north of the McMahon line have pressed their attacks all along the Kechilang river.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 503 (Oct. 18, 1962). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Nehru, Krishna Menon.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - name:nehru-jawaharlal
      - name:menon-v-k-krishna
      - vis:only:prc
