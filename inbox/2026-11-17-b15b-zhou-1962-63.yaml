      date: '1962-01-11'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai, with Chen Yi, receives Suzuki Mosaburo, adviser, and the Japan Socialist Party delegation; at the banquet Jan. 12: the blood Asanuma paid in the Japanese people''s fight against American imperialism; each country''s way of struggle follows its own conditions and the people''s awareness; the reactionaries'' charge of a military alliance between the two peoples is a lie; exchanges between them have worldwide meaning.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 452 (Jan. 11–12, 1962). Names: Zhou Enlai, Chen Yi, Suzuki Mosaburo, Asanuma Inejiro.'
