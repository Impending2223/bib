      when: Dec. 25
      date: '1963-12-25'
      thread: china-leadership
      also:
      - africa-algeria-morocco
      c: Zhou Enlai at Oran visits a liquefied petroleum plant and other works; that evening, back in Algiers, he speaks at the rally of cadres of the National Liberation Front, praising the National Liberation Army, which began with 3,000 guerrillas and dared fight hundreds of thousands of colonial troops, and after seven years of bloody war won the whole country, showing the oppressed nations of the world the right way to independence and freedom.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 604 (Dec. 25, 1963). Names: Zhou Enlai.'
