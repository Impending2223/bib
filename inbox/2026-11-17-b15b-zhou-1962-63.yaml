      date: '1963-12-07'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai to persons concerned on work toward Taiwan: China will not ignore Taiwan because it is strong nor trade in principle because it is in difficulty; it acts from the great cause of the nation and the unification of the motherland.'
