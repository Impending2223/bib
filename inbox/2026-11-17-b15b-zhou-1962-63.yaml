      date: '1962-06-08'
      thread: china-leadership
      c: 'Zhou Enlai to the Northeast military industry cadres'' conference: the hardest time is not past; this generation made the Great Leap, with gains and errors, and will overcome the difficulties, leaving none to the next. Defense industry is thin; self-reliance step by step; research and advanced technology in order; the arms industry first to press production, then add construction. He calls for unity of army, Northeast Bureau, provinces and departments, strict with self, lenient to others.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 482 (June 8, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
