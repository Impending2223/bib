- add:
    entry:
      id: cal.1963-08-30.china-leadership-2
      when: Aug. 30
      date: '1963-08-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on a Central Committee General Office brief that some leading cadres have gone by the "back door" for their children in assigning graduates of Peking''s colleges: Zhou Rongxin is to investigate fully, and if true the original assignment must stand; any who go by the back door are turned back; even where the original assignment fits their wish, they are to be sent outside Peking for the back door.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 576 (Aug. 30, 1963). Made public: 1997. Names: Zhou Enlai, Zhou Rongxin.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
