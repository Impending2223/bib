      thread: china-leadership
      c: 'Zhou Enlai revises the draft of the Central Committee''s directive issuing the Finance Group''s report: face difficulties fully and overcome them one by one; from Center to localities the main leaders split in two, one part on streamlining, one on the villages. The Group had proposed cutting over 9 million workers and 13 million urban people; the Center now decides over 10 million workers and 20 million urban people in two years. It goes to the Party May 26.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 478 (May 19, 1962). Continues 479. Made public: 1997. To check: the directive as issued, May 26, 1962. Names: Zhou Enlai.'
