    entry:
      id: cal.1963-09-27.china-leadership-3
      when: Sept. 27–28
      date: '1963-09-27'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai twice sees, Sept. 27 and 28, the experimental ballet troupe of the Peking Dance School in the ballet *Notre-Dame de Paris*, and after talks with the school's leaders and some of its creators. He does not agree to ballet now showing the Chinese people's struggle; the task is to master ballet and from that break out of the frame of solos and duets about love; works on collectivism may be made to give ballet new content; the nationalizing of ballet will take several generations.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 582 (Sept. 27–28, 1963). Made public: 1997. Names: Zhou Enlai.'
