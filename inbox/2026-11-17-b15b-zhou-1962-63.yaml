      c: Zhou Enlai at the Secretariat, which takes up the socialist education movement and other questions.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 585 (Oct. 8, 1963). Made public: 1997. Names: Zhou Enlai.'
