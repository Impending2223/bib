- add:
    entry:
      id: cal.1963-07-01.china-leadership
      when: July 1
      date: '1963-07-01'
      thread: china-leadership
      c: 'Zhou Enlai at the Politburo on the State Council''s two reports for the NPC Standing Committee, on the adjustment plan of the Second Five-Year Plan''s last two years and on the 1961 and 1962 final accounts: the Standing Committee should have an overall, faithful report. He gives the idea for the reports to the Fourth Session of the Second NPC and the First of the Third; the backward chemical, petroleum, transport, nonferrous, iron and steel and plastics industries to be laid out together, to catch up.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 562 (July 1, 1963). Continues 563. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-02.china-leadership
      when: July 2
      date: '1963-07-02'
      thread: china-leadership
      c: Zhou Enlai presides at the 134th plenary meeting of the State Council and speaks on the situation at home and abroad. At home production, construction, living and currency are not yet steady; a backward China in fourteen years could do no more, errors were unavoidable for lack of experience; the recent rectification and thrift have done well. Each department should make its own work rules on the first three of the five-antis; the Ministry of Petroleum may go first. The meeting adopts the two reports.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 563 (July 2, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-02.china-leadership-2
      when: July 2
      date: '1963-07-02'
      thread: china-leadership
      c: Zhou Enlai receives representatives of five model enterprises of thrift, among them the Xiangfan cotton mill and the Shigejie mine in Shanxi, who attend the national forum on economic work, and praises their hard struggle and thrift.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 563 (July 2, 1963). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-07-02.china-leadership-3
      when: July 2
      date: '1963-07-02'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai tells Ghana's Ambassador, Mercer, that, India being unwilling to negotiate and some states against a meeting, another Colombo meeting of the six, of heads or of foreign ministers, is not needed, the six can keep in touch by letter; if the foreign ministers must meet China does not object, on one condition, that China and India send responsible persons to sit in and state their views directly, so there is no misunderstanding. The Sino-Indian boundary can be settled only by the two sides, with no third party.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 563 (July 2, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ghana
      - polity:india
      - name:zhou-enlai
      - vis:only:prc+ghana
- add:
    entry:
      id: cal.1963-07-03.china-leadership-2
      when: July 3
      date: '1963-07-03'
      thread: china-leadership
      c: 'Zhou Enlai at the 99th meeting of the NPC Standing Committee, at which Li Fuchun gives the State Council''s report on the adjustment plan and its carrying out in the last two years of the Second Five-Year Plan. The report: in the first three years targets were too high, construction too large and proportions out of line; the economy now begins to improve all round, though farming and some others are not back at the highest level; a long time of adjusting, consolidating, filling out and raising remains.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 563 (July 3, 1963). Continues 564. Names: Zhou Enlai, Li Fuchun.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
- add:
    entry:
      id: cal.1963-07-04.china-leadership-2
      when: July 4
      date: '1963-07-04'
      thread: china-leadership
      c: 'Zhou Enlai, hearing the directors of the regional economic commissions: enterprises that make poor, dear goods are to be supported if they improve, not damped; do not gather production in one place. He sees the resolve as two more years of mainly adjustment, then both adjustment and growth; the central ministries are to grasp business; import advanced technical equipment, 50 million dollars a year for three to five years.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 564 (July 4, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-04.china-leadership-3
      when: July 4
      date: '1963-07-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the Hunan Party committee''s request to issue the draft Central Committee decision on rural work to every branch at once: that might bring disorder or concealment in the third-class brigades where no higher work team has come; he proposes it go down by stages and batches as the Center''s notice says. July 5 Mao writes: only where a politically strong work team has come may it go to the branch, to be read to all, inside out; elsewhere none.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 564 (July 4, 1963). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-06.china-leadership
      when: July 6
      date: '1963-07-06'
      thread: china-leadership
      c: 'Zhou Enlai, on a report that the Jiangnan Shipyard of the Third Ministry of Machine Building in Shanghai, repairing large foreign liners, "cannot keep contracts and credit and so is on the defensive abroad": the matter has been delayed so long, discussed and not decided, the leading group on ship repair formed and idle, the worst of bureaucracy; they are to be investigated together.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 564 (July 6, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-08.china-leadership
      when: July 8
      date: '1963-07-08'
      thread: china-leadership
      c: 'Zhou Enlai at the 101st meeting of the NPC Standing Committee, report: the class struggle abroad shows itself at home and must be analyzed and led; the village four clean-ups and city five-antis are not to be spread everywhere; cadres to settle in a place, go down and work with their hands. Building is to go by steps and in balance; how long farming, light, heavy industry stands, practice will show. Culture must rest on the proletarian outlook and begin with remolding thought. Population needs a plan; Ma Yinchu''s view has something to take; ten questions to study. The meeting adopts Li Fuchun''s and Li Xiannian''s reports.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 564 (July 8, 1963). Continues 565–66. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Ma Yinchu.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
- add:
    entry:
      id: cal.1963-07-09.china-leadership
      when: July 9
      date: '1963-07-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates to the meeting of the heads of the regional placement groups: last year the whole country''s population grew greatly, and Shanghai held its growth to 2-odd percent, no small feat; that other places could not shows "not that they could not but that they did not"; birth control is to be preached and all forces rallied to it.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 566 (July 9, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
