    entry:
      id: cal.1963-09-27.china-leadership-2
      when: Sept. 27
      date: '1963-09-27'
      thread: china-leadership
      c: 'Zhou Enlai at the close of the Central work conference on the 1964 plan. Capital construction next year to rise a little; basic industry, transport, defense industry and culture and education to get enough; use investment without waste, by four rules: raise grain and funds from bureaucracy, improve management, dig out potential, concentrate strength. On a farm bank: funds for farming are large; at any cost set up the farm bank and have it manage them.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 581 (Sept. 27, 1963). Continues 582. Made public: 1997. Names: Zhou Enlai.'
