      - name:bandaranaike-srimavo
      - vis:only:prc+ceylon
- add:
    entry:
      id: cal.1963-01-03.china-leadership
      when: Jan. 3–4
      date: '1963-01-03'
      thread: china-leadership
      also:
      - south-asia
      - indonesia
      c: 'Zhou Enlai in three-way talks with Bandaranaike and Subandrio, Jan. 3 and 4, on the Sino-Indian boundary and the six-state proposals. Jan. 3: the Colombo conference did good in putting the six as mediators, against imperialist meddling and against taking territory by force; but the proposals ask only China to pull back 20 kilometers, which is not the conference''s spirit. Jan. 4: China''s own cease-fire and withdrawal stand, so long as India does nothing to hinder them.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 524 (Jan. 3–4, 1963). Made public: 1997. Names: Zhou Enlai, Srimavo Bandaranaike, Subandrio.'
      tags:
      - polity:prc
      - polity:ceylon
      - polity:indonesia
      - polity:india
      - name:zhou-enlai
      - name:bandaranaike-srimavo
      - name:subandrio
      - vis:only:prc+ceylon+indonesia
- add:
    entry:
      id: cal.1963-01-04.china-leadership-2
      when: Jan. 4
      date: '1963-01-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhang Zhizhong sends Chen Cheng a letter, revised by Zhou Enlai: the key to Taiwan is a third cooperation of the Kuomintang and Communist Party and Taiwan''s return; then all else by its leaders'' views. Four points: apart from foreign affairs, all military and political power and personnel left to Taiwan''s leaders; the Center pays any shortfall of costs; social reform postponed; neither side to send men to sabotage the other''s unity. After revision it went round the Politburo Standing Committee.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 524 (Jan. 4, 1963). Made public: 1997. To check: the letter. Names: Zhou Enlai, Zhang Zhizhong, Chen Cheng.'
      tags:
      - polity:prc
      - polity:roc
      - name:zhou-enlai
      - vis:only:prc
- add:
