      - china
      c: 'Zhou Enlai at the gathering of the national outstanding Young Pioneer counselors and those of Peking: asks about the making of children''s films and the staging of children''s plays and how young audiences take them; tells the performers their work is of great worth, they should play for children more and be loved by them as teachers and friends.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 522 (Dec., 1962). Made public: 1997. Check: the day. Names: Zhou Enlai.'
