      when: Dec. 16
      date: '1963-12-16'
      thread: china-leadership
      also:
      - middle-east
      c: 'Zhou Enlai receives the representatives of President Sallal of Yemen, who is convalescing in Cairo, and thanks Sallal for his invitation to visit Yemen: as the itinerary is fixed he will find another time. He tells the home organs to send an ambassador to Yemen early with staff who know military and economic matters, and to give due regard to Yemen''s recent request for more trade and more goods.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 601 (Dec. 16, 1963). Made public: 1997. Names: Zhou Enlai, Abdullah al-Sallal.'
