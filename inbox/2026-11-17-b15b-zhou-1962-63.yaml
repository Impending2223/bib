- add:
    entry:
      id: cal.1962-11-25.china-leadership
      when: Nov. 25–27
      date: '1962-11-25'
      thread: china-leadership
      also:
      - south-asia
      - indonesia
      c: Zhou Enlai with Chen Yi, Zhang Hanfu and others on the Sino-Indian boundary question, then to Mao's for a meeting. On Nov. 26, on a draft letter to Ne Win written for him by the departments and sent to Mao, Liu and Deng, he adds that Huang Zhen will go by way of Rangoon to Jakarta and so call on Ne Win; the draft says Huang will give Ne Win the latest facts and hear his views directly. Nov. 27 a draft letter to Sukarno, again by the departments, says China sends Vice-Foreign Minister Huang Zhen to Jakarta to exchange views with him on the boundary question.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 515 (Nov. 25–27, 1962). Made public: 1997. Names: Zhou Enlai, Chen Yi, Zhang Hanfu, Mao Zedong, Liu Shaoqi, Deng Xiaoping, Huang Zhen, Ne Win, Sukarno.'
