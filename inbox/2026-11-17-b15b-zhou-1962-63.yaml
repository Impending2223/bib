- add:
    entry:
      id: cal.1962-12-04.china-leadership
      when: Dec. 4
      date: '1962-12-04'
      thread: china-leadership
      c: 'Zhou Enlai presides at the third meeting of the Central Special Committee. After Liu Jie''s report on the two-year plan and Zhu Guangya''s account of the theoretical design of atomic weapons, it approves the plan in principle. Zhou: strive to reach the 1964 goal; science has its laws, to be found and mastered; in experiment do not fear failure, repeat until it succeeds; be truthful, go step by step, keep at it, no pride or haste, quality first, safety first.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 517 (Dec. 4, 1962). Made public: 1997. To check: the two-year plan. Names: Zhou Enlai, Liu Jie, Zhu Guangya.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-12-04.china-leadership-2
      when: Dec. 4
      date: '1962-12-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, after hearing the Broadcasting Bureau''s Party group: broadcasting is the Party''s throat and in fact an important tool of dictatorship; its achievements in recent years are firm; it may be changed to a Party-committee system, with no Party group and a political department, Ding Laifu first secretary, Mei Yi second, Li Zhefu head of the political department.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 517 (Dec. 4, 1962). Made public: 1997. Names: Zhou Enlai, Ding Laifu, Mei Yi, Li Zhefu.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
