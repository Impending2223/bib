- add:
    entry:
      id: cal.1963-07-12.china-leadership-4
      when: July 12
      date: '1963-07-12'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives the secretaries of Bertrand Russell, Shoenman (匈曼) and Putter (普特尔), who came to China by way of India and Ceylon. He does not agree with their dark view of mankind''s development: man made the world and will find the way over the difficulties; history advances; with nuclear arms, once their destructive power is known, ways to guard against it are sought, as in the history of science each new weapon brings something newer to keep it in check; and when all have them and know the harm they can reach an agreement to ban their use.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 566 (July 12, 1963). Made public: 1997. Check: the secretaries'' names in Roman letters. Names: Zhou Enlai, Bertrand Russell.'
      tags:
      - polity:prc
      - polity:uk
      - name:zhou-enlai
      - vis:only:prc+uk
