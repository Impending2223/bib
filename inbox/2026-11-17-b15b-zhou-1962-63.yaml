      c: 'Zhou Enlai and Deng Xiaoping jointly issue two documents: the Central Committee''s and State Council''s urgent notice on pressing the present purchase of farm products, and their transmittal of the State Planning Commission''s report on preliminary ideas for cotton output and purchases, 1963–67. The report: solving the people''s clothing is now one of the main tasks.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 503 (Oct. 18, 1962). Made public: 1997. To check: the notice and the report. Names: Zhou Enlai, Deng Xiaoping.'
