      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai receives Shafqat Ali Qureshi of the Associated Press of Pakistan. China signs its border agreements and treaties with all neighbors on the principle of settling them in peaceful talks, amicably, in a spirit of equal cooperation and mutual understanding and accommodation, which holds also for any other state that settles with China in friendship in future. A socialist state does not allow expansion; China opposes great-power chauvinism now and will teach its children not to fall into it; it relies on the socialist system and the people to solve its problems and overcome any difficulty.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 544 (Mar. 31, 1963). Check: the correspondent''s name in Roman letters; whether the interview was printed. Names: Zhou Enlai.'
