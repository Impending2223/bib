      when: Oct. 1
      date: '1963-10-01'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai, on repeated cases in Peking of crowds, children above all, shouting abuse at Soviet and other foreigners, asks Peng Zhen to have the Peking Party committee call every level for education on Sino-Soviet friendship, above all that the fight against the revisionist leading group must never be against the Soviet people. Most are children, but a trace of unhealthy national feeling shows and must be guarded against, lest bad men use it. He asks Chen Yi to have the Foreign Affairs Office draft a Central Committee notice for the whole country.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 583 (Oct. 1, 1963). Made public: 1997. Names: Zhou Enlai, Peng Zhen, Chen Yi.'
      tags:
