      - vis:only:prc+nepal
- add:
    entry:
      id: cal.1963-01-23.china-leadership
      when: Jan. 23
      date: '1963-01-23'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai receives the Japan–China Fisheries Council''s delegation under Hiratsuka Tsunejiro. China welcomes those in Japan''s ruling party who want friendship and not to follow the United States, Hiratsuka, Kōno, Takasaki, Ishibashi, Matsumura; and in part those who follow the United States but speak well of China. On a private fisheries agreement: private agreements added up widen relations and push part of the government toward friendship. Hiratsuka says the week changed his view of China.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 527 (Jan. 23, 1963). Made public: 1997. Names: Zhou Enlai, Hiratsuka Tsunejiro, Kono Ichiro, Takasaki Tatsunosuke, Ishibashi Tanzan, Matsumura Kenzo.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1963-01-24.china-leadership
      when: Jan. 24
      date: '1963-01-24'
      thread: china-leadership
      c: 'Zhou Enlai, on Lunar New Year''s Eve, at the Shanghai Federation of Trade Unions'' dinner for old workers and model producers: the Party and state look to Shanghai''s workers for more in the Third Five-Year Plan. Beforehand he talks with old workers of the 1927 Third Shanghai Armed Uprising: tell the young of it; the uprising gave confidence but the workers did not turn to the countryside.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 527 (Jan. 24, 1963). Continues 528. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
