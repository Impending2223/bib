      when: Oct. 25
      date: '1963-10-25'
      thread: china-leadership
      c: Zhou Enlai asks Cheng Zihua to call the State Council's Cultural and Educational Office, the ministries and the General Bureau of Supplies to discuss, on problems in the Planning Commission's arrangement of the 1964 culture and education plan, the capital construction and the distribution and control of funds for cultural and educational work.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 591 (Oct. 25, 1963). Made public: 1997. Names: Zhou Enlai, Cheng Zihua.'
