      when: Oct. 3
      date: '1963-10-03'
      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: Zhou Enlai approves Fang Yi's request report on a loan to Algeria. The same day, at the dinner of Pakistan's Ambassador, Raza, for the visiting Pakistani party for National Day, he says the chief task now is to expose the three-power treaty's deceit of the world's peoples; when Raza says all agree it was Zhou who led the Bandung Conference and guided its course at the critical hours, he says no, it was everyone's merit, one man cannot do it, one must move all together.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 584 (Oct. 3, 1963). Continues 585. Made public: 1997. Names: Zhou Enlai, Fang Yi.'
      tags:
      - polity:prc
      - polity:pakistan
      - polity:algeria
