      thread: china-leadership
      c: 'The *Renmin ribao* and the *Jiefangjun bao*, printing Mao''s inscription "Learn from Comrade Lei Feng" for *Chinese Youth*, print with it Zhou Enlai''s: Lei Feng a good son of the working people and a good soldier of Mao. Soon after, Zhou tells his staff the young must learn from Lei Feng and so must he; there is no question of who should and who need not; to learn from him is to work doubly for the people.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 538 (Mar. 5, 1963). Continues 539. Names: Zhou Enlai, Lei Feng, Mao Zedong.'
      tags:
