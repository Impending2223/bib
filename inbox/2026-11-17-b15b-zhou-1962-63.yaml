      c: 'Zhou Enlai to Bandaranaike in their talks: China would like to talk with the six states; it cannot talk with Nehru directly, only with the six, and asks them to relay and help.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 8, 1963). Made public: 1997. Names: Zhou Enlai, Srimavo Bandaranaike, Nehru.'
