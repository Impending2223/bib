      date: '1963-10-24'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the State Physical Culture Commission Party group''s request to climb Xixabangma in 1964: all the preparations may start and the General Staff be asked to draw transport from the troops in Tibet for concentrated training; but whether to climb in 1964 is to be reported to the Center for approval after training and preparation with firm assurances. (A note: the Chinese climbers first reached the peak May 2, 1964.)'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 591 (Oct. 24, 1963). Footnote at 591: Xixabangma, then the last peak over 8,000 meters unclimbed. Made public: 1997. Names: Zhou Enlai.'
