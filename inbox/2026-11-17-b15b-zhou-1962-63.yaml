- add:
    entry:
      id: cal.1963-01-28.china-leadership
      when: Jan. 28
      date: '1963-01-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, at the Shanghai Party committee''s Spring Festival forum of democratic personages: village and market improve daily, but new development brings new difficulty. Four lines: a hundred schools, stress the present; a hundred flowers, push out the old; all parties long coexist; one heart and self-reliance. Five hurdles: thought, politics, living, family, society. The Third Five-Year Plan is the key; Shanghai to lead.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 528 (Jan. 28, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-01-28.china-leadership-2
      when: Jan. 28
      date: '1963-01-28'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai with the film actors Zhang Ruifang, Zhao Dan and others on making the film *The Red Propagandist*.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 528 (Jan. 28, 1963). Made public: 1997. Names: Zhou Enlai, Zhang Ruifang, Zhao Dan.'
      tags:
