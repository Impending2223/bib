      when: Jan. 6
      date: '1962-01-06'
      thread: china-leadership
      c: 'Zhou Enlai to Deng Xiaoping and the Secretariat, by letter, on the 1962 economic plan, for the Secretariat to take up. Grain, cotton, oil: to settle at the conference a procurement of 82 billion jin of grain, 18 million dan of cotton from at least 63 million mu, 200 million jin of edible oil. The letter sets out the streamlining measures.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 450 (Jan. 6, 1962). Made public: 1997. To check: the letter''s text. Names: Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
