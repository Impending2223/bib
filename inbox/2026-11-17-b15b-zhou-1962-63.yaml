      c: 'Zhou Enlai, Peng Zhen, Yang Shangkun and Kong Yuan telegraph Liu Shaoqi and Chen Yi abroad. Kuomintang agents had set off explosions in Cambodia and the Chinese embassy there proposed postponing Liu''s visit to Cambodia without date. The telegram: postponement without date is politically unfavorable; keep to the original plan, advance the date, and cut or drop mass scenes.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 549 (Apr. 23, 1963). Continues 550. Made public: 1997. Names: Zhou Enlai, Peng Zhen, Yang Shangkun, Kong Yuan, Liu Shaoqi, Chen Yi.'
