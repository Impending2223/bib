      when: June 29
      date: '1962-06-29'
      thread: china-leadership
      also:
      - laos
      c: 'Zhou Enlai and Chen Yi receive Quinim Pholsena and Phoumi Vongvichit and others of the delegations to the Geneva Conference from the Laotian coalition government. The formation of the coalition is only the first step, a beginning of victory; the road ahead is long: to unite the peoples, build the economy, and keep and secure peace and independence.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 487 (June 29, 1962). Continues 488; footnote: the Geneva Conference, opened May 1961, stalled after Dec. 1961 and resumed in June 1962 when Laos''s government of national union was formed. Made public: 1997. Names: Zhou Enlai, Chen Yi, Quinim Pholsena, Phoumi Vongvichit.'
      tags:
