      c: 'Zhou Enlai revises the Central Streamlining Group''s proposal on cutting state organs, Party bodies and people''s organizations ("state organs"): of 2.68 million staff, cut 940,000, 35 percent; each province may keep a reserve outside the establishment of at most 1 percent; offices to be set by need, with no demand that those above and below match; no temporary offices; the many cut are to be placed with care to the end. On Feb. 22 he settles the Central Committee''s covering comment on the proposal.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 460 (Feb. 21–22, 1962). Made public: 1997. To check: the proposal and the covering comment. Names: Zhou Enlai.'
