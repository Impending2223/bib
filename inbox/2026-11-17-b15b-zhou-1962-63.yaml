      when: Aug. 7
      date: '1963-08-07'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with Chen Yi receives the medical workers of Shanghai''s Sixth Hospital, Qian Yunqing, Chen Zhongwei and others, who replanted a severed hand: he praises their useful, creative work in Chinese surgery. The same day he talks with persons concerned on Shanghai''s airport.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 571 (Aug. 7, 1963). Names: Zhou Enlai, Chen Yi, Qian Yunqing, Chen Zhongwei.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
- add:
    entry:
      id: cal.1963-08-07.china-leadership-3
      when: Aug. 7
      date: '1963-08-07'
      thread: china-leadership
      also:
      - japan
      - soviet-union
      c: 'Zhou Enlai telegraphs the Ninth World Conference against Atomic and Hydrogen Bombs at Hiroshima: China stands always with the Japanese people who firmly demand a ban on nuclear weapons. Before this he told the Chinese delegation: let it be seen that China truly works for peace and effectively against nuclear war and so opposes the three-power treaty, which is the theme; hold to principle in the speeches, pierce the treaty''s fraud, and put a nuclear-free zone along the Pacific into the main resolution.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 571 (Aug. 7, 1963). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-08-08.china-leadership
      when: Aug. 8
      date: '1963-08-08'
      thread: china-leadership
      c: 'Zhou Enlai at the East China Bureau on the situation at home and abroad. Last October and this February the economy was judged to be beginning an all-round recovery, and half a year shows it right; but basic industries are not wholly restored, mines and railways need two or three years, investment is held down. Next year''s capital construction: expansion of reproduction, water works, flood and alkali control on the North China plain. The Secretariat said: food, clothing and use to be solved, the base balanced, the advanced caught up. This conference will take production first, class struggle after.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 571 (Aug. 8, 1963). Continues 572. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-08.china-leadership-2
      when: Aug. 8
      date: '1963-08-08'
      thread: china-leadership
      also:
      - china
      c: 'The Ministry of Education wires Zhou Enlai''s instruction on the year''s graduates: assignment is to be handled with care, not made simple; thought is truly to be raised; reasonable requests of graduates who ask to have their wishes heeded are not all to be called individualism; students are to be given the spirit of forgetting self for the public, but in assignment the leaders must also keep "public first, private after" and give both public and private their due, meeting reasonable personal wishes as far as possible.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 572 (Aug. 8, 1963). Made public: 1997. To check: the telegram. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-11.china-leadership
      when: Aug. 11
      date: '1963-08-11'
      thread: china-leadership
      also:
      - latin-america
      c: 'Zhou Enlai receives a Colombian parliamentary delegation: China wants a full, thorough and resolute ban and destruction of nuclear arms; the nuclear powers say it cannot be done at once; so China hopes Latin America and Africa will first be nuclear-free zones; if a government of Latin America or Africa proposes it, the Chinese government will be first to respond and ready to take on the duty.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 572 (Aug. 11, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:colombia
      - name:zhou-enlai
      - vis:only:prc+colombia
- add:
    entry:
      id: cal.1963-08-12.china-leadership
      when: Aug. 12
      date: '1963-08-12'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai with Chen Yi receives Pakistan''s Ambassador, Raza (罗查). On Sino-American relations: America''s wish to trade and exchange with China shows two sides of its diplomacy, to use it to press the Soviet Union to yield and to sound China out; whatever America and the Soviet Union change, however small, China will think it over with care.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 572 (Aug. 12, 1963). Made public: 1997. Check: the ambassador''s name in Roman letters. Names: Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:pakistan
      - polity:us
      - polity:ussr
      - name:zhou-enlai
