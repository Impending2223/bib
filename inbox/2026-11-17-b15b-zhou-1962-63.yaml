      thread: china-leadership
      c: Zhou Enlai presides at the central meeting on the statement on the *Yuejin* and on diving to inspect the site. It agrees with the group's report that the sinking "most probably" came from striking a reef; to settle it, and to hold to truth from facts, an examination at sea must be made on the spot.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 552 (May 8, 1963). Made public: 1997. Names: Zhou Enlai.'
