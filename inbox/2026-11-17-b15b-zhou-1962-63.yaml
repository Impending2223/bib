      - polity:uk
      - name:zhou-enlai
      - vis:only:prc+ceylon
- add:
    entry:
      id: cal.1963-07-22.china-leadership-2
      when: July 22
      date: '1963-07-22'
      thread: china-leadership
      c: 'Zhou Enlai, report on the line of socialist education to the year''s graduates of Peking''s colleges: to be educated working people with socialist awareness they need the class, labor, revolutionary and collective views, learning to old age from the masses, books and struggle, and a strong body, with late marriage and birth control. Six demands: obey assignment and pass the five hurdles; do labor training; be a teacher content to serve the next generation; go to the borders and overseas, the four seas as home; the few going to research to do it well; learn foreign languages.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 566 (July 22, 1963). Continues 567. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
