      when: Aug. 29
      date: '1963-08-29'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai telegraphs Sihanouk to thank him for his letter of Aug. 21 supporting the Chinese government's proposal of a summit of the world's governments to discuss a total ban and thorough destruction of nuclear arms, and fully agrees with and supports his proposal of a "round table" of Asian heads of state.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 576 (Aug. 29, 1963). Made public: 1997. See [[cal.1963-07-31.china]]. Names: Zhou Enlai, Sihanouk.'
