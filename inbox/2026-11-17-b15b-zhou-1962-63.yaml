      when: Feb. 20
      date: '1962-02-20'
      thread: china-leadership
      also:
      - africa-algeria-morocco
      c: 'Zhou Enlai receives Abdul Rahman Kiwan, dean of the diplomatic corps of Algeria: China supports the Algerian people''s fight for independence and holds right their way of talking with France while keeping up the armed struggle. On China''s experience of negotiating: it goes smoothly, hits setbacks, breaks off, resumes, and takes a long time; only the struggle leads to victory; the people must prepare two ways against imperialism, work for the best and ready for the worst, and never lay down arms or disband or reorganize the armed force.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 459 (Feb. 20, 1962). Made public: 1997. Names: Zhou Enlai, Abdul Rahman Kiwan.'
