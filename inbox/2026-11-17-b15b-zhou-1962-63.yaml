    entry:
      id: cal.1963-10-03.china-leadership
      when: Oct. 3
      date: '1963-10-03'
      thread: china-leadership
      also:
      - indonesia
      c: 'Zhou Enlai with He Long and Chen Yi meets the Chinese sports delegation about to go to Indonesia for the first Games of the New Emerging Forces: train in many ways, meet storm and gentle rain, quiet and noisy places, and not be tense but calm; have literary and moral cultivation and varied knowledge; winning or losing matters little, lose this time and win the next; show the style of socialist new China, in which the collective''s win or loss counts first, higher than the individualism of capitalist society.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 584 (Oct. 3, 1963). Names: Zhou Enlai, He Long, Chen Yi.'
      tags:
      - polity:prc
      - polity:indonesia
