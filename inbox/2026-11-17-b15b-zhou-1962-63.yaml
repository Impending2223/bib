      when: Dec. 19
      date: '1963-12-19'
      thread: china-leadership
      also:
      - middle-east
      - china
      c: Zhou Enlai, at Nasser's request, sets out in the talks Sino-American relations and other matters. America's holding of Taiwan is an international question, since America seized Chinese territory; the Chinese people and Chiang Kai-shek are another, an internal one; they must not be mixed; America makes it one question to split Taiwan off and make "two Chinas," the center of China's struggle in the United Nations.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 602 (Dec. 19, 1963). Continues 603. Made public: 1997. Names: Zhou Enlai, Nasser, Chiang Kai-shek.'
