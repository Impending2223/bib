      c: Zhou Enlai receives the Panchen Erdeni Choekyi Gyaltsen, Ngapoi Ngawang Jigme and Phagpalha Geleg Namgyai, and hears their written report on Tibet and other Tibetan areas. In eleven years the gains are the main thing; faults since the suppression of the revolt are secondary; they may differ on their extent; errors will be corrected. They are compatriots and comrades, but he will point out what is wrong.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 478 (May 18, 1962). Made public: 1997. Check: Chinese 班禅额尔德尼·确吉坚赞, 阿沛·阿旺晋美, 帕巴拉·格列朗杰. Names: Zhou Enlai, Panchen Erdeni, Ngapoi Ngawang Jigme, Phagpalha Geleg Namgyai.'
