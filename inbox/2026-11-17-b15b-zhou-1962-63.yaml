      id: cal.1962-04-16.china-leadership
      when: Apr. 16
      date: '1962-04-16'
      thread: china-leadership
      c: 'Zhou Enlai at the NPC''s closing session on domestic questions: understanding of socialist building needs a process; "a great deal of blindness" remains; only practice brings out the laws. The adjustment is active, not passive: some trades advance and some retreat, all for advance; farming and light industry first, so heavy industry and construction bear temporary losses; big swings are to be avoided.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 471 (Apr. 16, 1962). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1962-04-17.china-leadership
      when: Apr. 17
      date: '1962-04-17'
      thread: china-leadership
      c: 'Zhou Enlai convenes the enlarged State Council meeting on streamlining: the government''s first task now is to cut offices and posts; the line, merge units, central and local, cut staff, adjust together, place people properly; the way, to investigate on the spot, rely on the masses, Party and government to lead, lines and areas to match, all to act as one. He lays down ten measures for placing people.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 471 (Apr. 17, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
