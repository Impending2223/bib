      date: '1962-10-27'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai again receives the UAR's Ambassador and again sets out the truth of the border question and China's constant stand for a peaceful settlement. On Oct. 29 he writes about it to Nasser and to Ne Win, Chairman of Burma's Revolutionary Council and Chairman of the Council of Ministers.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 506 (Oct. 27, 1962). Made public: 1997. Check: whether Zhou''s letters to Nasser and Ne Win of Oct. 29 are the Oct. 26 letter of the entry above or further letters. See [[cal.1962-10-26.china-2]]. Names: Zhou Enlai, Zakaria Adli Imam, Nasser, Ne Win.'
