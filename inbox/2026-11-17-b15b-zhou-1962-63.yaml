      c: 'Zhou Enlai, "Be a Revolutionary Literary and Art Worker," at the joint session of the Propaganda Department''s conference on literature and art and the second enlarged session of the Third National Committee of the Federation of Literary and Art Circles. Five demands: a firm revolutionary stand; a communist ideal, standing among the people; remolding by study, practice, emulation and struggle; testing in stormy seas; long striving. The socialist line: object workers, peasants and soldiers; aim socialism; a hundred flowers, a hundred schools; revolutionary realism joined with revolutionary romanticism.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 548 (Apr. 19, 1963). Made public: 1997. Names: Zhou Enlai.'
