      when: July 21
      date: '1963-07-21'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai to Russell, by letter, and in a memorandum to the Indian and Ceylonese governments, sets out his two meetings with Russell's secretaries. The same day he tells Ceylon's Ambassador, Perera, that the secretaries wanted China to give way again on the boundary and he told them China could not; he hopes the Ambassador will report it to the Prime Minister when home.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 566 (July 21, 1963). Made public: 1997. To check: the letter and the memorandum. Names: Zhou Enlai, Bertrand Russell, A. B. Perera.'
