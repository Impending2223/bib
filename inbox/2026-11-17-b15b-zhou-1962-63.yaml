      date: '1963-03-15'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, after the China Youth Art Theatre''s *Azalea Mountain*, in a forum: the many good plays of recent years on new men and revolutionary stories are good, among them *The Army at the Gates*, *The Second Spring*, *Jinggangshan*, *Sentinels under the Neon Lights*, *Pingxingguan* and this one. Revolutionary stories should not be too mysterious or legendary, which makes them false and teaches the young nothing. In the arts he finds each goes his own way, directors, lighting, sets and costumes alike, "the eight immortals crossing the sea"; the spoken drama is a composite art and needs cooperation.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 540 (Mar. 15, 1963). Made public: 1997. Names: Zhou Enlai.'
