      when: Oct. 29
      date: '1962-10-29'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai and Chen Yi receive and dine Takasaki Tatsunosuke, former Minister of International Trade and Industry and Liberal Democratic Party Diet member. Zhou''s speech: new things with a future grow from small to large by accumulation; Sino-Japanese trade is to grow in the gradual, cumulative way, its prospect broad; the road of friendship will still have bends. Oct. 30 he talks with Takasaki again.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 506 (Oct. 29, 1962). Names: Zhou Enlai, Chen Yi, Takasaki Tatsunosuke.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - name:chen-yi
- add:
    entry:
      id: cal.1962-10-30.china-leadership
      when: Oct. 30–31
      date: '1962-10-30'
      thread: china-leadership
      also:
      - china
      - south-asia
      c: 'Zhou Enlai receives Malcolm MacDonald, once of the British Labour Party and a member of Parliament, a guest of Chen Yi for three weeks; talks Oct. 30 and 31 on China''s construction, Sino-American and Sino-British relations and the Sino-Indian border. China needs peace to build; it relies on the peasants'' drive and collective organization, the production team the basic unit; of the Americans, China pays no heed to hostile deceit and history will show it right. On the border: the British government, little informed, speaks from tradition, which is unreal and resented; one should speak from the facts.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 506 (Oct. 30–31, 1962). Continues 507–08. Made public: 1997. Names: Zhou Enlai, Malcolm MacDonald.'
      tags:
      - polity:prc
      - polity:uk
      - name:zhou-enlai
      - vis:only:prc+uk
- add:
    entry:
      id: cal.1962-10-31.china-leadership
      when: Oct. 31
      date: '1962-10-31'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives Ceylon''s Ambassador, A. B. Perera, on Prime Minister Bandaranaike''s proposal for a good-offices committee of a few friendly states on the Sino-Indian border dispute: its intent is good, but to form such a body is neither helpful nor easy. He tells the Foreign Ministry to answer every letter and cable from friendly states concerned with the dispute, setting out the truth and its complexity and China''s stand for settling it by talks.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 508 (Oct. 31, 1962). Made public: 1997. Names: Zhou Enlai, Srimavo Bandaranaike, A. B. Perera.'
      tags:
      - polity:prc
      - polity:ceylon
      - polity:india
      - name:zhou-enlai
      - name:bandaranaike-srimavo
      - vis:only:prc+ceylon
- add:
    entry:
      id: cal.1962-11-01.china-leadership
      when: Nov. 1
      date: '1962-11-01'
      thread: china-leadership
      c: 'Zhou Enlai to the national conference of cadres of the key coal mines: some trades will produce less next year, coal among them, but quality counts more; five goods: quality, lower cost, lower use, more kinds, higher productivity. He sums up the industry''s lessons since the Great Leap, criticizes high targets and blind command, takes the State Council''s main blame, and gives ten tasks. Intellectuals are not to be left in the cold.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 508 (Nov. 1, 1962). Continues 509. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
