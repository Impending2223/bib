      when: Dec. 22
      date: '1963-12-22'
      thread: china-leadership
      also:
      - africa-algeria-morocco
      c: 'Zhou Enlai and Chen Yi, in the Algiers city hall, receive from the mayor, Barakhama (巴拉马纳), the certificates of honorary citizens; Zhou: it shows the brother Algerian people''s great friendship for the Chinese people.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 603 (Dec. 22, 1963). Continues 604. Names: Zhou Enlai, Chen Yi.'
