      c: Zhou Enlai receives Chervonenko and tells the Soviet side the Chinese Central Committee has decided to send Deng Xiaoping and Peng Zhen at the head of a delegation to Moscow for talks of the two parties; and that China's Third Five-Year Plan will be taken up in the newly elected people's congress.
