      date: '1963-09-19'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai to Mao Zedong, Liu Shaoqi and Wang Jiaxiang, by letter, on the practical questions of inviting delegations of the Japan–China Friendship Association and of the Japan–China Trade Promotion League: although the government (the nianpu says the Yoshida government) approved only the second and refused passports to the first, the line is to try to have both come.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 581 (Sept. 19, 1963). Made public: 1997. Check: the nianpu names the "Yoshida government." To check: the letter. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Wang Jiaxiang.'
