      also:
      - china
      c: 'Zhou Enlai at the evening party at the Ziguang Pavilion in Zhongnanhai, to some of the Central Song and Dance Ensemble''s dancers on dance work: first make one''s own national base firm and grown, then take in others; do not hurry to learn from others; keep the national style, no copying of the West; be creative and not only imitative; learn the tradition and the best of the Chinese opera; know history when staging historical plays.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 521 (Dec. 26, 1962). Made public: 1997. Names: Zhou Enlai.'
