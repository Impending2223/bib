      thread: china-leadership
      c: 'Zhou Enlai with Deng Zihui, Tan Zhenlin and others on agriculture, forestry and water. Two tasks in farming: the work at hand and a summing up of the past. The State Council''s farm bureau is to draft a plan for restoring agriculture for the Central work conference of August. In water: flood control, alkali control, reservoir inspection, soil and water conservation; an alkali group under Chen Zhengren, with Qian Zhengying and Wang Guangwei deputies, to work on eleven prefectures.'
