      - vis:only:prc
- add:
    entry:
      id: cal.1963-01-29.china-leadership
      when: Jan. 29
      date: '1963-01-29'
      thread: china-leadership
      c: 'Zhou Enlai at Shanghai''s science and technology work conference: to build a strong socialist country the key is to modernize science and technology; the demands are truth from facts, step by step, mutual help, catching up; the conditions are dialectical materialism, manpower and resources, the socialist system, a large body of intellectuals and a first base of industry. He asks stronger mastery in scientific circles, concentrated forces, better Party–masses and leader–led relations, better working conditions, and a ten-year science plan from Shanghai.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 528 (Jan. 29, 1963). Continues 529. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-01-30.china-leadership
      when: Jan. 30
      date: '1963-01-30'
      thread: china-leadership
      c: Zhou Enlai calls on Rong Yiren, Vice-Mayor of Shanghai; and with Deng Yingchao attends the Shanghai women's Spring Festival party.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 529 (Jan. 30, 1963). Made public: 1997. Names: Zhou Enlai, Rong Yiren, Deng Yingchao.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-01-31.china-leadership
      when: Jan. 31
      date: '1963-01-31'
      thread: china-leadership
      c: 'Zhou Enlai at Suzhou: sees Chen Yun, and the Suzhou writer and bonsai artist Zhou Shoujuan, a deputy to the Jiangsu people''s congress and member of the CPPCC, whose bonsai he views; tells him to keep up his horticulture and serve the people, foreign friends and socialism, and that his essays are a flower in the garden too. He and Deng Yingchao write in his autograph book.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 529 (Jan. 31, 1963). Made public: 1997. Names: Zhou Enlai, Chen Yun, Deng Yingchao, Zhou Shoujuan.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yun
      - vis:only:prc
- add:
    entry:
      id: cal.1963-01-31.china-leadership-2
      when: Jan. 31
      date: '1963-01-31'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, back in Shanghai, on the trains to and from Suzhou, takes up with the playwrights of *The Second Spring*, Liu Chuan, Shen Ximeng and others, the script''s revision. To write the difficulties of the general line and Great Leap without leaving the audience downcast was a brave trial. On the Party''s leadership: do not make a leading cadre a perfect man from his entrance; show first an ordinary man who puts his heart in the Party''s cause.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 529 (Jan. 31, 1963). Continues 530. Made public: 1997. Names: Zhou Enlai, Liu Chuan, Shen Ximeng.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-01.china-leadership
      when: Feb. 1
      date: '1963-02-01'
      thread: china-leadership
      c: 'Zhou Enlai to the East China conferences of advanced agricultural collectives and of agricultural science and technology, on the ties of economics, politics and thought and of state, collective and individual. Eight demands: collective first, individual after; state before person; ask of self before others; blame self before others; public before private; act for the public first; I for all the people and all for me; I for the world and the world for me. Public before private, even to forgetting self in war; cadres and model workers lead in it.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 530 (Feb. 1, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-02.china-leadership
      when: Feb. 2–3
      date: '1963-02-02'
      thread: china-leadership
      c: Zhou Enlai at Wuxi; in the Lin Garden he tells the municipal Party leaders with him to buy tickets, and himself counts the party and buys them. In the afternoon returns to Shanghai; Feb. 3 to Peking.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 530 (Feb. 2–3, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-03.china-leadership
      when: Feb. 3
      date: '1963-02-03'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai at Ceylon's Ambassador Perera's National Day reception tells him that Nehru's speeches in the Indian Parliament and Indian opinion confirm China's view that the concrete parts of the six states' proposals favor India and are unfair; so China cannot withdraw its two explanations; but they are not preconditions for talks.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 530 (Feb. 3, 1963). Made public: 1997. Names: Zhou Enlai, A. B. Perera, Nehru.'
      tags:
      - polity:prc
      - polity:ceylon
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+ceylon
- add:
    entry:
      id: cal.1963-02-03.china-leadership-2
      when: Feb. 3
      date: '1963-02-03'
      thread: china-leadership
      also:
      - middle-east
      c: 'Zhou Enlai receives the Syrian economic delegation under Subhi Kahale, Minister of Communications: all the Arab friends China has met share the wish for unity, a basic factor; the Arab peoples'' unity has favorable conditions, since the wish is the same; the key is how to express it in each Arab people''s struggle for independence and nation-building.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 530 (Feb. 3, 1963). Continues 531. Made public: 1997. Names: Zhou Enlai, Subhi Kahale.'
      tags:
      - polity:prc
      - polity:syria
      - name:zhou-enlai
      - vis:only:prc+syria
- add:
    entry:
      id: cal.1963-02-06.china-leadership-2
      when: Feb. 6–7
      date: '1963-02-06'
      thread: china-leadership
      c: Zhou Enlai with the regional bureaus' heads on grain, Feb. 6 and 7. From last year's experience and their views he fixes two ways to send grain up from the provinces this year, by purchase and by exchange-purchase, so as to reach 7.35 billion jin.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 531 (Feb. 6–7, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-06.china-leadership-3
      when: Feb. 6–9
      date: '1963-02-06'
      thread: china-leadership
      c: 'Zhou Enlai at the meeting Liu Shaoqi calls of the Politburo, the Secretariat and the first secretaries of the regional bureaus, Feb. 6–9, on grain, streamlining, wages, thrift and a "five-antis" movement in the cities (graft, speculation, waste, decentralism, bureaucracy). Feb. 8 he makes the main speech on grain and farm purchase: the 1963 output plan is 321.6 billion jin, 19.5 billion over last year; return to the 390 billion of 1957 in five years. He explains the Center''s rules and gives five measures.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 531 (Feb. 6–9, 1963). Made public: 1997. See [[cal.1963-02-05.china-leadership]]. Names: Zhou Enlai, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-08.china-leadership
      when: Feb. 8
      date: '1963-02-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the Lantern Festival gathering of the capital''s writers and artists: how the "double hundred" line is better carried out, serving workers, peasants and soldiers and going among the masses, is still the arts'' chief task; again he asks them to pass the five hurdles of thought, politics, living, family and society, to learn and remold to old age, and to reflect on their own thought and words. The press accounts of Lei Feng moved him; artists should catch the spirit of the age, show typical men and praise the new; Lei Feng''s diary shows whole-hearted work for the collective and is good diary literature.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 531 (Feb. 8, 1963). Continues 532. Names: Zhou Enlai, Lei Feng.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-02-09.china-leadership
      when: Feb. 9
      date: '1963-02-09'
      thread: china-leadership
      c: Zhou Enlai with persons concerned on streamlining and wages.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 532 (Feb. 9, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-09.china-leadership-2
      when: Feb. 9
      date: '1963-02-09'
      thread: china-leadership
      also:
      - middle-east
      c: 'Zhou Enlai receives Subhi Kahale, Syria''s Minister of Communications: a new reactionary trend now is subversion from outside; coups made so, revolutionary or not, China does not favor, for they come from outside; revolution is for the people to settle; the export of revolution and of counterrevolution are both wrong and dangerous; peaceful coexistence cannot go with subversion.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 532 (Feb. 9, 1963). Made public: 1997. Names: Zhou Enlai, Subhi Kahale.'
      tags:
      - polity:prc
      - polity:syria
      - name:zhou-enlai
      - vis:only:prc+syria
- add:
    entry:
      id: cal.1963-02-10.china-leadership
      when: Feb. 10–11
      date: '1963-02-10'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai goes to Kunming to meet Prince Sihanouk, and talks with him Feb. 10 and 11 on how the Sino-Indian clash came about, the Nehru government''s aims in stirring tension, and the present state of it. The Colombo proposals are only proposals, neither arbitration nor orders; either side may agree or not; China accepts them in principle as the basis of a meeting of officials, with its two explanations kept, not as preconditions. If the Colombo conference meets again, China has one unavoidable demand: both sides must send their most responsible representatives to state their positions.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 532 (Feb. 10–11, 1963). Made public: 1997. Names: Zhou Enlai, Sihanouk.'
      tags:
      - polity:prc
      - polity:cambodia
      - polity:india
      - name:zhou-enlai
      - name:norodom-sihanouk
      - vis:only:prc+cambodia
- add:
    entry:
      id: cal.1963-02-12.china-leadership
      when: Feb. 12
      date: '1963-02-12'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai accompanies Sihanouk on his arrival in Peking, and then accompanies Liu Shaoqi in meeting him.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 532 (Feb. 12, 1963). Names: Zhou Enlai, Sihanouk, Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:cambodia
      - name:zhou-enlai
      - name:norodom-sihanouk
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1963-02-13.china-leadership
      when: Feb. 13
      date: '1963-02-13'
      thread: china-leadership
      c: 'Zhou Enlai at the Central Committee''s work conference, report on grain and streamlining. In 1962 grain output rose over 20 billion jin, the central point of the better situation; streamlining let sales fall; both to be consolidated. Grain and main farm products in 1963 are bought by the Center''s rules. On streamlining and wages: look to the next five and ten years for placing population and labor; the slogan is to face the countryside, farming, forestry, herding, fisheries; thrift, streamlining, control of the city population and family planning are long-term aims.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 533 (Feb. 13, 1963). Made public: 1997. To check: the report. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-02-15.china-leadership-3
      when: Feb. 15
      date: '1963-02-15'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with Sihanouk on China''s aid to Cambodia''s economic construction: Chinese help in industry must fit the present market and not be too large; kinds and designs must suit Cambodian tastes; so in settling projects both sides must weigh raw materials, the home market and the economics.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 533 (Feb. 15, 1963). Made public: 1997. Names: Zhou Enlai, Sihanouk.'
      tags:
      - polity:prc
      - polity:cambodia
      - name:zhou-enlai
      - name:norodom-sihanouk
      - vis:only:prc+cambodia
- add:
    entry:
      id: cal.1963-02-15.china-leadership-4
      when: Feb. 15
      date: '1963-02-15'
      thread: china-leadership
      c: 'Zhou Enlai receives the departing Ambassador of Guinea, Sangiana (桑吉亚纳): foreign work and home work both matter; economy is the base, and without it political independence is not secure and a state stays at foreign mercy, which many Afro-Asian states face. He asks him to tell President Touré to guard against assassination and be alert, rely on the masses and the unity of the leading core, and hold the army.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 534 (Feb. 15, 1963). Made public: 1997. Check: the ambassador''s name in Roman letters. Names: Zhou Enlai, Sékou Touré.'
      tags:
      - polity:prc
      - polity:guinea
      - name:zhou-enlai
      - name:toure-ahmed-sekou
      - vis:only:prc+guinea
- add:
    entry:
      id: cal.1963-02-16.china-leadership
      when: Feb. 16
      date: '1963-02-16'
      thread: china-leadership
      c: Zhou Enlai accompanies Sihanouk and his wife through the snow to the Great Wall and the Ming Tombs Reservoir.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 534 (Feb. 16, 1963). Names: Zhou Enlai, Sihanouk.'
      tags:
