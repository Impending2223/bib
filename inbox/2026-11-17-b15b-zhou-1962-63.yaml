      thread: china-leadership
      c: 'Zhou Enlai receives Guinea''s economic delegation and women''s delegation: China''s new relations with Afro-Asian states must rest on equality, mutual respect for sovereignty and non-interference, so that they support each other and struggle together out of backwardness; China especially supports the struggle to raise the status of Black people and of Africa; women are to win their independence, the most oppressed of the oppressed, and women''s liberation follows national and social liberation.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 551 (Apr. 30, 1963). Made public: 1997. Names: Zhou Enlai.'
