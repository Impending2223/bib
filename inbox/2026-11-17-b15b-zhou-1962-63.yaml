      when: Nov. 19
      date: '1962-11-19'
      thread: china-leadership
      c: 'Zhou Enlai to delegates at the national conferences of the Ministries of Agricultural Machinery, of Agriculture and of the First Machine Building: under the line of agriculture as base and industry as leader, the direction of agriculture is mechanization. In the Third Five-Year Plan mass use of farm machines is out of the question; rely on medium and small implements, hand tools, labor and animal power. In this China is five years late.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 513 (Nov. 19, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
