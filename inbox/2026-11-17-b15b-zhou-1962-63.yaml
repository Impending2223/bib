      when: Oct. 24
      date: '1963-10-24'
      thread: china-leadership
      c: Zhou Enlai with persons concerned on making agricultural surveys and other matters.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 590 (Oct. 24, 1963). Made public: 1997. Names: Zhou Enlai.'
