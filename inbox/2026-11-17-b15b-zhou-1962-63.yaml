    entry:
      id: cal.1963-12-16.china-leadership-4
      when: Dec. 16
      date: '1963-12-16'
      thread: china-leadership
      also:
      - middle-east
      c: 'Zhou Enlai at the UAR rally for Education Day: the Afro-Asian peoples must develop their national culture and science; when they hold their fate they will not only catch up with the Western states but pass them. Nasser, speaking, calls Zhou an outstanding leader of Asia, the maker of China''s revolution and a living symbol of the great Chinese people.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 601 (Dec. 16, 1963). Names: Zhou Enlai, Nasser.'
      tags:
      - polity:prc
      - polity:uar
      - name:zhou-enlai
      - name:nasser-gamal-abdel
- add:
    entry:
      id: cal.1963-12-16.china-leadership-5
      when: Dec. 16–17
      date: '1963-12-16'
      thread: china-leadership
      also:
      - middle-east
      - africa
      c: 'Zhou Enlai in talks with Nasser and others, Dec. 16 and 17, gives five points of China''s stand toward the Arab states: support their struggle for independence; their peaceful, neutral, non-aligned policy; their unity by ways they choose; peaceful settlement of disputes among them; respect by all for their sovereignty. The five went into the joint communique of Dec. 21 as "the five principles of China''s handling of relations with the Arab and African states."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 601 (Dec. 16–17, 1963). Made public: 1997. Names: Zhou Enlai, Nasser.'
      tags:
      - polity:prc
      - polity:uar
      - name:zhou-enlai
      - name:nasser-gamal-abdel
      - vis:only:prc+uar
