      c: 'Zhou Enlai holds a forum with Mo Yan, Shen Ximeng, Liu Chuan, Zhang Ying, Zhang Junxiang, Zheng Junli, Xia Yan, Wang Ping and others on filming *Sentinels under the Neon Lights*, *The Second Spring* and *The Red Propagandist*: revision of the scripts and the choice of directors and actors.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 548 (Apr. 20, 1963). Made public: 1997. Names: Zhou Enlai, Xia Yan, Shen Ximeng, Liu Chuan.'
