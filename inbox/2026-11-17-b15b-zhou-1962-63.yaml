      when: May 1–2
      date: '1963-05-01'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai, told that China''s first home-built ocean freighter, the *Yuejin*, sank suddenly on her first voyage from Qingdao to Japan, at once orders the Navy to send warships to the place to rescue; he does not sleep that night. At dawn on May 2 he writes to Mao and Peng Zhen in Hangzhou: by the crew''s report the *Yuejin* sank from three torpedo hits; to be prudent, make no formal statement until the facts are clear; and he sets up a special group to investigate.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 551 (May 1–2, 1963). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Peng Zhen.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - name:mao-zedong
      - name:peng-zhen
      - vis:only:prc
