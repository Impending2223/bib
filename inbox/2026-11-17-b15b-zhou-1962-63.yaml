      when: July 18–19
      date: '1963-07-18'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai drafts, July 18 and 19, the Central Committee''s telegram to Deng Xiaoping, Peng Zhen and Kang Sheng: as the Sino-Soviet party talks have come to nothing, it agrees to the delegation''s view that it return early; to seek a joint communique and have it say that in this meeting of the two parties the two sides stated their positions and views fairly concisely, and now agree to adjourn and to resume at a suitable time. The talks end July 20; the Chinese delegation is back in Peking July 21; Xinhua prints the communique July 22.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 566 (July 18–19, 1963). Made public: 1997. To check: the telegram. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Kang Sheng.'
