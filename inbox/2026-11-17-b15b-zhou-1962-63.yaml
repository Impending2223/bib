    entry:
      id: cal.1963-07-28.china-leadership-4
      when: July 28
      date: '1963-07-28'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai receives Kigeli V, the former King of Rwanda: peaceful coexistence is between independent states and has conditions, mutual respect for sovereignty and territory, nonaggression, noninterference, equality and mutual benefit; China and the United States too can coexist in peace, but the United States has broken the principles, keeps Taiwan, refuses to recognize the People''s Republic and bars China''s lawful seat at the United Nations, and so there is no peaceful coexistence.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 568 (July 28, 1963). Made public: 1997. Check: Rwanda is not in the polities list; the king''s name as in the nianpu (基格里五世). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:us
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-08-02.china-leadership
      when: Aug. 2
      date: '1963-08-02'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai writes to the heads of government of the world's states to pass on the proposal of the Chinese government's statement that all discuss the question of banning and destroying nuclear weapons, and hopes for a positive response.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 568 (Aug. 2, 1963). To check: the letter. See [[cal.1963-07-31.china]]. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-07-29.china-leadership-2
      when: July 29–Aug. 3
      date: '1963-07-29'
      thread: china-leadership
      c: 'Zhou Enlai chairs four meetings, July 29–Aug. 3, with Li Xiannian, Bo Yibo, Tan Zhenlin, Deng Zihui and others, hearing the State Planning Commission group''s first views on the 1964 plan''s control figures. Against those who still want a "great leap": the adjustment of 1961 runs five years; open with "two more years of adjustment"; no high grain target; no changing the plan at will; truth in science and new products; steady prices and a little more pay for city workers, all but those at fault up one or two grades within eight years; build basic industry, or it is not adjustment.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 569 (July 29–Aug. 3, 1963). Made public: 1997. Names: Zhou Enlai, Li Xiannian, Bo Yibo, Tan Zhenlin, Deng Zihui.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-xiannian
      - name:bo-yibo
      - name:tan-zhenlin
      - vis:only:prc
- add:
    entry:
      id: cal.1963-07-31.china-leadership
      when: July 31
      date: '1963-07-31'
      thread: china-leadership
      c: The Central Committee transmits the Central Streamlining Group's report on the completion of the cut and its end. From January 1961 to June 1963 the country's staff fell by 18.87 million, the urban population by 26 million, eaters of commodity grain by 28 million; this strengthened the farm front and cut the wage bill and grain sales, raised productivity and helped the finance and the economy. The report declares the nationwide streamlining basically over.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 569 (July 31, 1963). Continues 570. Made public: 1997. To check: the report. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
