- add:
    entry:
      id: cal.1963-01-15.china-leadership
      when: Jan. 15
      date: '1963-01-15'
      thread: china-leadership
      c: 'Zhou Enlai drafts the Central Committee''s notice calling a Central work conference for mid-February: the 1963 state plan; a decision on industrial work; policies on farm purchase and fairs; draft rules on planning, commercial enterprises and primary and middle schools. With a letter to Liu Shaoqi and Deng Xiaoping for comment. The notice goes out Jan. 22.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 526 (Jan. 15, 1963). Made public: 1997. To check: the notice and the letter. See [[cal.1963-01-08.china-leadership]]. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1963-01-17.china-leadership
      when: Jan. 17
      date: '1963-01-17'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives and dines the Ghana government''s friendship delegation under Kofi Asante Ofori-Atta, Minister of Justice. At the dinner: the Chinese government much admires the efforts of the Ghana government and the other friendly Afro-Asian states to bring about Sino-Indian conciliation and sincerely hopes they succeed.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 526 (Jan. 17, 1963). Names: Zhou Enlai, Kofi Asante Ofori-Atta.'
      tags:
      - polity:prc
      - polity:ghana
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-01-17.china-leadership-2
      when: Jan. 17
      date: '1963-01-17'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai and Chen Yi talk with Ofori-Atta, who says Bandaranaike asked him to appeal that China formally accept the Colombo conference''s plan. Zhou: China supports the Colombo conference and can take its proposals as a preliminary basis for Sino-Indian talks, but with two explanations: the Chinese frontier forces pull back 20 kilometers along the whole line; and the disputed places in the cease-fire arrangement are to be left empty, with no military or civil staff of either side in them.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 526 (Jan. 17, 1963). Made public: 1997. Names: Zhou Enlai, Chen Yi, Kofi Asante Ofori-Atta.'
      tags:
      - polity:prc
      - polity:ghana
      - polity:india
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc+ghana
- add:
    entry:
      id: cal.1963-01-19.china-leadership
      when: Jan. 19
      date: '1963-01-19'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai replies to Bandaranaike''s letter of Jan. 14: the Chinese government accepts in principle the Colombo conference''s proposals as a preliminary basis for a meeting of officials of China and India to discuss a stable cease-fire and disengagement and to promote talks on the boundary; it still keeps its two explanations, to carry out the principle of equality of the two sides and consistency in all sectors of the border.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 526 (Jan. 19, 1963). Made public: 1997. To check: the letter. Names: Zhou Enlai, Srimavo Bandaranaike.'
      tags:
      - polity:prc
      - polity:ceylon
      - polity:india
      - name:zhou-enlai
      - name:bandaranaike-srimavo
      - vis:only:prc+ceylon
- add:
    entry:
      id: cal.1963-01-19.china-leadership-2
      when: Jan. 19
      date: '1963-01-19'
      thread: china-leadership
      also:
      - japan
      c: Zhou Enlai receives Ii Yashiro and others of the Japanese Communist Party's Secretariat; he welcomes the party sending more progressive workers to see China and says that on his return to Peking he will take it up with the All-China Federation of Trade Unions.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 526 (Jan. 19, 1963). Continues 527. Made public: 1997. Names: Zhou Enlai, Ii Yashiro.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - vis:only:prc+japan
