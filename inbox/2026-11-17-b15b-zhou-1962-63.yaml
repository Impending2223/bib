      date: '1962-11-23'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai telegraphs Bandaranaike, Prime Minister of Ceylon: her proposal at this moment that the leaders of six friendly Afro-Asian states meet to consult on promoting Sino-Indian conciliation is truly a constructive one.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 515 (Nov. 23, 1962). Footnote at 515: the six were Ceylon, Cambodia, Burma, Egypt, Indonesia and Ghana. Made public: 1997. Names: Zhou Enlai, Srimavo Bandaranaike.'
