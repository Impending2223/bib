      when: Jan. 22
      date: '1963-01-22'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai arrives at Shanghai; with Chen Yi he receives Tulsi Giri, Vice-Chairman of Nepal's Council of Ministers and Foreign Minister, and Bahadur Khatri, Nepal's chief representative on the China–Nepal Boundary Joint Commission, and sets out China's view of the Sino-Indian border conflict and its position on the Colombo proposals.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 527 (Jan. 22, 1963). Made public: 1997. Names: Zhou Enlai, Chen Yi, Tulsi Giri.'
