      when: June
      date: 1963-06
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, after the Shenyang army drama troupe''s *Lei Feng*: more is to show our revolutionary history and glorious tradition and praise the new heroes; *Lei Feng* should be played more times in Peking.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 562 (June, 1963). Made public: 1997. Check: the day. Names: Zhou Enlai, Lei Feng.'
