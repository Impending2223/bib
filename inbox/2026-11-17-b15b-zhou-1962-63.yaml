      c: 'Zhou Enlai receives Ghana''s Deputy Minister of Agriculture, Okanse (奥坎塞): after the bomb incidents of some days ago in Ghana China is anxious for President Nkrumah''s safety; a state with a firm farm base and grain growth has what its quick industrial growth needs.'
