      when: Nov. 21
      date: '1963-11-21'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives Abdul Qayyum, Afghan Minister of State, and asks how Afghanistan treats the silt in its reservoirs: the two countries share a problem, both cut many forests, both old cultural lands that have lost much forest.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 597 (Nov. 21, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:afghanistan
