      date: '1963-03-15'
      thread: china-leadership
      c: 'Zhou Enlai at Huairen Hall, "Report on Streamlining in the Central Organs": it sums up two years'' gains and asks to overfulfill the task in its last stage. Many units still have staffing too loose, many nonproductive staff, overlapping offices; wasted labor is the greatest waste. The tail is to tie in with thrift and the five-antis, management reform, control of city population and family planning; to be done by a date so wages can be raised from August; the cut people placed to the end.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 540 (Mar. 15, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
