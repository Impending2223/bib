      c: 'Zhou Enlai at the State Economic Commission''s forum on political work, report on the international situation and the fight against revisionism, tied to construction at home: hold higher the banners of Marxism-Leninism and proletarian internationalism against revisionism; but China must do its own work better, see the class situation at home and carry on socialist education. Economic decisions test a leader''s foresight, the greatest weakness being its lack. One cannot build or enter communism behind a closed door.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 547 (Apr. 15, 1963). Made public: 1997. Names: Zhou Enlai.'
