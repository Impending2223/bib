    entry:
      id: cal.1962-10-06.china-leadership
      when: Oct. 6
      date: '1962-10-06'
      thread: china-leadership
      c: 'Zhou Enlai and Deng Xiaoping jointly sign the directive on several current problems of city work. Twelve provisions: the large and medium cities that have finished cutting staff put their strength into production; meet the industrial and construction plans; cut enterprise losses; clear overdue debts; keep workers'' living at its level; place idle labor; shrink city outskirts. Raising living in step with production is the main task; heavy industry''s adjustment is to build weak branches. Zhou directed the drafting, which took in views of the secretaries of 44 cities.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 501 (Oct. 6, 1962). Made public: 1997. To check: the directive as issued. Names: Zhou Enlai, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-06.china-leadership-2
      when: Oct. 6
      date: '1962-10-06'
      thread: china-leadership
      c: 'Zhou Enlai gives detailed arrangements at the meeting of the Party-group secretaries of the State Council''s departments for work after the Tenth Plenum: farming and the market, enterprise losses, production and capital construction, and the 1963 plan. His 1963 targets: grain 320 billion jin, cotton 20 million dan, coal 200 million tons, timber 23 million cubic meters, capital investment 6 to 7 billion yuan.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 501 (Oct. 6, 1962). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-10-07.china-leadership
      when: Oct. 7
      date: '1962-10-07'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'Zhou Enlai to the Vietnamese military delegation on the world situation and war. China does not approve the Soviet idea that a few great powers alone hold nuclear secrets: the imperialists had spread them when Moscow proposed a ban on spread. A people''s war differs from an imperialist war of aggression; in war men are chief and weapons second; he goes on to the Party and the army, the army and government, officers and men, friendly forces and international relations.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 501 (Oct. 7, 1962). Continues 502. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc+drv
