      id: cal.1962-07-24.china-leadership
      when: July 24
      date: '1962-07-24'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives the Panchen, Ngapoi and Phagpalha and exchanges views on the Panchen's written report. Since May 18 four documents have come of it. The Panchen's eight points to be studied; Tibetan and Han leaders to respect and trust each other; the Center trusts them as anti-imperialist and patriotic, and they should trust the Work Committee, which does not mean to "abolish the nation" or religion. Han comrades to criticize great-Han chauvinism, Tibetans local nationalism.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 490 (July 24, 1962). Continues 491; footnote: Xi Zhongxun, Li Weihan and others, charged by Zhou, took up the Panchen''s views and drafted four papers: strengthening the Preparatory Committee and joint work; freedom of religious belief; handling rebels; training and educating cadres. Made public: 1997. Names: Zhou Enlai, Panchen Erdeni, Ngapoi Ngawang Jigme, Phagpalha Geleg Namgyai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
