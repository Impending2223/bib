      id: cal.1962-04-18.china-leadership
      when: Apr. 18
      date: '1962-04-18'
      thread: china-leadership
      c: 'Zhou Enlai, closing address at the CPPCC''s Third National Committee: the people''s democratic united front, now in the stage of socialist construction, must unite every force that can be united; its work is in construction as well as in transformation; in the CPPCC the Party''s leadership is its collective leadership, the line and policy, not persons; communists should make friends outside the Party, and the friend who dares to differ and criticize is a candid one; culture, education and science to meet the economy''s needs, from numbers to quality.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 471 (Apr. 18, 1962). Continues 472. Names: Zhou Enlai.'
      tags:
      - polity:prc
