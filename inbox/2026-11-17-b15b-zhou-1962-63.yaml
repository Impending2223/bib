      id: cal.1962-05-11.china-leadership
      when: May 11
      date: '1962-05-11'
      thread: china-leadership
      c: 'Zhou Enlai''s speech at the Central Work Conference on why the situation is still called very grave: the unbalance caused by "our subjective errors" will clear only by degrees, and the famine''s effects are not quickly turned. Work well needs clear facts, great resolve, right methods; to close so many factories, cut so many staff, no other regime in China could, only this one with its base in the masses; "fear in the face of the task," no pride or carelessness. He explains the streamlining plan by sector, policy limits and placing. The conference decides to carry out the eight-character line and adjust by a wide margin, and broadly agrees with the Finance Group''s report that Zhou and Li Xiannian submitted; his main points go to delegates to take home. He sends Li Fuchun to Mao at Hangzhou with the draft directive.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 476–77 (May 11, 1962). Made public: 1997. To check: the main points of the speech as sent to the delegates. See [[cal.1962-05-07.china-leadership]]. Names: Zhou Enlai, Li Xiannian, Li Fuchun, Mao Zedong.'
