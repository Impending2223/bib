      when: May 10–11
      date: '1963-05-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, at the small meeting Mao has held since May 2 with some Politburo members and the regional secretaries, May 10 and 11 in Hangzhou, on the revised draft of the decision on some current problems of rural work: to narrow the movement''s blow he proposes changing "unite 90-odd percent" to "unite over 95 percent." Mao agrees.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 552 (May 10–11, 1963). Continues 553; footnote: the "First Ten Points," which on the then estimate of the class struggle calls for reorganizing the revolutionary class ranks and a great mass movement. Made public: 1997. See [[cal.1963-05-07.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1963-05-12.china-leadership
      when: May 12
      date: '1963-05-12'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai flies through thick fog to Shanghai, and hears the East Sea Fleet and Shanghai''s Maritime Rescue and Salvage Bureau on preparations for the survey at sea. The cause of the *Yuejin*''s loss must be sought from the facts and in a scientific way. To the fleet''s leaders: the sinking is now an international incident; as Premier he takes it up and they, commanders and commissars, must go to the front line and not leave it to the second and third in command; the main leaders are to hold on to what is decisive to the end; for great matters they go in person, as a rule.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 553 (May 12, 1963). Footnote at 553. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
