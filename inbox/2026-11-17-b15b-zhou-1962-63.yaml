- add:
    entry:
      id: cal.1962-11-13.china-leadership-2
      when: Nov. 13
      date: '1962-11-13'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai telegraphs Sékou Touré, President of Guinea: welcomes the Guinean government''s proposals of Nov. 6, an immediate cease-fire on the Sino-Indian border and each side''s pullback of 20 kilometers from the line of actual control, all the more urgent now; China''s basic stand for a peaceful settlement has not moved for India''s great offensive nor for its own gains in self-defense.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 511 (Nov. 13, 1962). Made public: 1997. Names: Zhou Enlai, Sékou Touré.'
      tags:
      - polity:prc
      - polity:guinea
      - polity:india
      - name:zhou-enlai
      - name:toure-ahmed-sekou
      - vis:only:prc+guinea
- add:
    entry:
      id: cal.1962-11-15.china-leadership
      when: Nov. 15
      date: '1962-11-15'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai to the leaders of Asian and African states, by letter, on the Sino-Indian boundary: the course of the question; the grave clash is wholly of the Indian government''s making; India seems to want no talks and to hold to force; the two countries have no basic conflict of interest and no reason to fight over a border; China has done all it could for three years and, not discouraged, will look for settlement and make conditions for a halt to the clash; it calls on the Afro-Asian states to do justice and promote direct talks. Sent to 25 leaders, copies to the leaders of 83 countries.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 512 (Nov. 15, 1962). Check: whether the letter was published at the time. To check: the letter. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1962-11-15.china-leadership-2
      when: Nov. 15
      date: '1962-11-15'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai telegraphs Kwame Nkrumah, President of Ghana, that he is sure the Afro-Asian friends'' appeals to China and India to stop the clash and resume talks will not be in vain: the fittest course is direct talks by the two; without both states'' sincerity a true settlement is hard to find.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 512 (Nov. 15, 1962). Made public: 1997. Names: Zhou Enlai, Nkrumah.'
      tags:
      - polity:prc
      - polity:ghana
      - polity:india
      - name:zhou-enlai
      - name:nkrumah-kwame
      - vis:only:prc+ghana
- add:
    entry:
      id: cal.1962-11-17.china-leadership
      when: Nov. 17
      date: '1962-11-17'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai presides at the 121st plenary meeting of the State Council and asks the ministers, the non-Party ones above all, Xu Deheng, Jiang Guangnai, Shen Yanbing, Liu Wenhui, Sha Qianli and Li Zhuchen, about the letter to Afro-Asian leaders. The blow to India was because it pushed too far for two years; China holds to a peaceful settlement while a thread of hope remains. Ministers are to explain it in their meetings and the non-Party ministers to the democratic parties.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 513 (Nov. 17, 1962). Made public: 1997. Names: Zhou Enlai, Xu Deheng, Jiang Guangnai, Shen Yanbing, Liu Wenhui, Sha Qianli, Li Zhuchen.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1962-11-18.china-leadership
      when: Nov. 18
      date: '1962-11-18'
      thread: china-leadership
      c: Zhou Enlai and Deng Xiaoping issue the decisions setting up the Northeast General Bureau of Forestry and the Northeast General Bureau of Land Reclamation, with rules on how the two cooperate.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 509 (Nov. 18, 1962). The nianpu gives it at the end of its Nov. 2 item. Made public: 1997. To check: the two decisions. Names: Zhou Enlai, Deng Xiaoping.'
