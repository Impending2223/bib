      when: Nov. 20
      date: '1962-11-20'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai revises the draft of the Central Committee's urgent notice, written by the departments, on explaining to cadres and masses the government's important statement of Nov. 21 on the Sino-Indian boundary, to prepare their minds before China acts.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 20, 1962). Made public: 1997. To check: the notice. Names: Zhou Enlai.'
