      when: Dec. 5
      date: '1963-12-05'
      thread: china-leadership
      c: Zhou Enlai presides at the 139th plenary meeting of the State Council and announces that while he is away on his visits to the UAR, Algeria and about a dozen other states, Vice-Premier Deng Xiaoping acts as Premier and Vice-Premier Li Fuchun takes charge of the State Council's daily work.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 598 (Dec. 5, 1963). Continues 599. Made public: 1997. Names: Zhou Enlai, Deng Xiaoping, Li Fuchun.'
