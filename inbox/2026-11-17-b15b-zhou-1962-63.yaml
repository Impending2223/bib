      also:
      - china
      c: 'Zhou Enlai tells Tong Xiaopeng to pass to Xu Dixin and Li Weihan: the interest on industrial and commercial holdings is extended three years, and the business men are to be urged to save, to run mutual funds, and where they can to invest in farms or run schools or nurseries that take in the unemployed among them; Jiangxi has much land to open; the state cannot pay for it all, and this eases its burden and rouses them.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 470 (Apr. 15, 1962). Made public: 1997. Names: Zhou Enlai, Tong Xiaopeng, Xu Dixin, Li Weihan.'
