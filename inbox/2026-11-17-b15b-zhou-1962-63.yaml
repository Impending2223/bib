- add:
    entry:
      id: cal.1963-12-05.china-leadership-3
      when: Dec. 5
      date: '1963-12-05'
      thread: china-leadership
      c: Zhou Enlai presides at the seventh meeting of the Central Special Committee, which adopts Liu Jie's report on the carrying out of the two-year plan and arrangements for later work and Zhao Erlu's views on the questions raised by the Second and Fifth Ministries of Machine Building, the Ministry of Chemical Industry and the Academy of Sciences. On his view, as the first atomic bomb is nearly through, the ground test is put first, the preparations for an air-drop test go on and an underground test is at once started as a research and design project.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 599 (Dec. 5, 1963). Made public: 1997. To check: the report and the views. Names: Zhou Enlai, Liu Jie, Zhao Erlu.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:zhao-erlu
      - vis:only:prc
- add:
    entry:
      id: cal.1963-12-05.china-leadership-4
      when: Dec. 5
      date: '1963-12-05'
      thread: china-leadership
      c: Zhou Enlai gives a television interview to the British writer Greene on China's view of war and peace. China loves peace, opposes aggressive war and wants peaceful coexistence with all states, the United States included, on the five principles; but peace must be won, by uniting peace-loving forces against imperialist aggression. Self-reliance is to use one's own people's labor and resources and trade on equality and mutual benefit; it is not self-sufficiency or a closed door.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 599 (Dec. 5, 1963). Check: the writer''s given name and whether he is Graham Greene. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:uk
      - polity:us
      - name:zhou-enlai
