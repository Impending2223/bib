      thread: china-leadership
      also:
      - africa-algeria-morocco
      - africa
      c: Zhou Enlai flies to Algiers and begins a visit to Algeria, to Dec. 26 holding four formal talks with President Ben Bella; the aim of the visit, he says, is to learn; he tells Ben Bella of China's revolution and construction.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 603 (Dec. 21–26, 1963). Made public: 1997. Names: Zhou Enlai, Ahmed Ben Bella.'
