      thread: china-leadership
      c: 'Zhou Enlai presides at the 130th plenary meeting of the State Council. On prices: factory, purchase and market prices have grown many irrationalities; only piecemeal adjustment is possible now. The meeting sets up the National Price Commission and the State Commission on Establishment as standing bodies. Zhou asks them to press streamlining of the State Council''s direct bodies, first working out the staffing of its 62 departments for a base; each department to review old laws and rules, sort those of the Second Five-Year Plan, finish its cut of 5,000, and have its minister sit in when it reports to the NPC Standing Committee.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 546 (Apr. 13, 1963). Continues 547. Made public: 1997. Names: Zhou Enlai.'
