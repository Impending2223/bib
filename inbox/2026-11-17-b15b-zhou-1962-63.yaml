      date: '1963-03-06'
      thread: china-leadership
      c: 'The *Jiefangjun bao* prints Zhou Enlai''s second inscription for the campaign to learn from Lei Feng: learn his clear class stand of love and hate, his revolutionary spirit of word and deed as one, his communist style of forgetting self for the public, his proletarian fighting will that spares no self.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 539 (Mar. 6, 1963). Names: Zhou Enlai, Lei Feng.'
