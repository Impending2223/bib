      date: '1963-10-19'
      thread: china-leadership
      c: Zhou Enlai under treatment for his teeth; he hears the State Planning Commission's leading group on the 1964 plan.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 588 (Oct. 19, 1963). Made public: 1997. Names: Zhou Enlai.'
