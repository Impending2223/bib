- add:
    entry:
      id: cal.1963-11-10.china-leadership
      when: Nov. 10
      date: '1963-11-10'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives the pardoned war criminals and their families in Peking. In a class society classes have different stands, but men can be remolded; when truly remolded, friendly coexistence follows. He cites the *Great Learning* and the *Analects* on daily self-examination; they are equal now and should not feel low; do not dwell on the past; join in building the country.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 593 (Nov. 10, 1963). Continues 594. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-11-12.china-leadership
      when: Nov. 12
      date: '1963-11-12'
      thread: china-leadership
      also:
      - africa
      c: Zhou Enlai with Chen Yi on Chen Yi's coming trip to Asian and African states.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 594 (Nov. 12, 1963). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
- add:
    entry:
      id: cal.1963-11-15.china-leadership
      when: Nov. 15
      date: '1963-11-15'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai meets Cheng Siyuan and hears of Li Zongren''s state: Cheng says Li longs for the motherland and does not want to die abroad. Zhou hopes Li will free himself from American and Taiwanese ties and guard against a third force; he sets out four courses for Li after Europe: back to America to arrange things; come, look and leave again freely; stay in Europe; or return, with arrangements to be thought out. Nothing is forced on him. Li must be ready to pass the five hurdles. Cheng is to give Li the talk truly and hear his views.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 594 (Nov. 15, 1963). Continues 595; footnote: Deling is Li Zongren. Made public: 1997. Names: Zhou Enlai, Cheng Siyuan, Li Zongren.'
      tags:
      - polity:prc
      - polity:us
      - polity:roc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-11-15.china-leadership-2
      when: Nov. 15–16
      date: '1963-11-15'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai at the Supreme State Conference Liu Shaoqi calls, Nov. 15 and 16, on Peng Zhen''s explanation of the main questions of the Fourth Session of the Second NPC. Nov. 15 he speaks first on the situation and tasks. Sino-Soviet relations: contact is kept, so divided but not broken, on the edge of a break, not yet at it; China is for unity and against a split. Socialist experience comes by practice and summing up; build mainly on self-reliance; leaping is quality as well as quantity. After three more years the adjustment is to lay a base for an all-round leap; farming as base and industry as leader holds long; 1963 began an all-round improvement.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 595 (Nov. 15–16, 1963). Made public: 1997. To check: the speech. Names: Zhou Enlai, Liu Shaoqi, Peng Zhen.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1963-11-16.china-leadership
      when: Nov. 16
      date: '1963-11-16'
      thread: china-leadership
      c: 'Zhou Enlai presides at the 138th plenary meeting of the State Council and explains further the reports Li Fuchun on the national plan and Li Xiannian on the state budget are to give at the Fourth Session of the Second NPC. He sets out the Marxist theory of knowledge: man has initiative; by practice he learns the laws, masters them, holds his own fate and uses them freely, which takes a process of knowing.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 595 (Nov. 16, 1963). Continues 596. Made public: 1997. Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1963-11-16.china-leadership-2
      when: Nov. 16
      date: '1963-11-16'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai with Liao Chengzhi and others on the coming World Peace Council meeting; Liao led the Chinese delegation at Warsaw, Nov. 28–Dec. 3, which put forward a Chinese draft resolution on banning nuclear arms and disarmament, national independence, economic and cultural growth and later peace work.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 596 (Nov. 16, 1963). Made public: 1997. To check: the draft resolution. Names: Zhou Enlai, Liao Chengzhi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1963-11-17.china-leadership
      when: Nov. 17–Dec. 4
      date: '1963-11-17'
      thread: china-leadership
      c: Zhou Enlai at the Fourth Session of the Second NPC, Nov. 17–Dec. 3, which adopts Li Fuchun's report on the 1963 plan and the 1964 draft and Li Xiannian's on the state budget; before it he called people to discuss the two reports many times. He also attends the Fourth Session of the Third National Committee of the CPPCC, Nov. 17–Dec. 4, which hears Chen Shutong's report and decides to extend the Committee's term to September 1964.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 596 (Nov. 17–Dec. 4, 1963). To check: the reports and resolutions. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Chen Shutong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
- add:
    entry:
      id: cal.1963-11-18.china-leadership
      when: Nov. 18
      date: '1963-11-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai writes for the people of Hebei and Tianjin in their fight against the floods of the Hai River: highest respect to the cadres, the people and the troops who fought the flood rare in history; they are to go on to help the stricken, rebuild homes, win next year''s harvest and rule the Hai River thoroughly. This month he also writes for the exhibition on the flood fight in Hebei: "Tame the Hai River, bring the people good."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 596 (Nov. 18, 1963). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1963-11-20.china-leadership
      when: Nov. 20
      date: '1963-11-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives the new Albanian Ambassador, Nesti Nase: two dogmatisms, one to spread revisionism as dogma, the other not applying the general truths of Marxism-Leninism to one''s own conditions, no attention to ways of struggle, the same for all; truth or error alike, only in practice are they told apart.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 596 (Nov. 20, 1963). Continues 597. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1963-11-20.china-leadership-2
      when: Nov. 20
      date: '1963-11-20'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai tells Hungary's Ambassador (郝拉思·尤若夫) that each state's socialist building must rest first on itself, each people has hands, brains and wit; cooperation of socialist states should strengthen each state's ability and independence; independence of a state and mutual aid of the camp go together; patriotism and internationalism are one.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 597 (Nov. 20, 1963). Made public: 1997. Check: the ambassador''s name in Roman letters. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:hungary
      - name:zhou-enlai
      - vis:only:prc+hungary
- add:
    entry:
      id: cal.1963-11-21.china-leadership
      when: Nov. 21
      date: '1963-11-21'
      thread: china-leadership
      c: Zhou Enlai at the Secretariat, which discusses and in principle approves Nie Rongzhen's report for the Central Science Group and the Party group of the State Science Commission on the 1963–72 plan for science and technology. Research cut off from production is to be remedied at once.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 597 (Nov. 21, 1963). Made public: 1997. To check: the report. Names: Zhou Enlai, Nie Rongzhen.'
      tags:
