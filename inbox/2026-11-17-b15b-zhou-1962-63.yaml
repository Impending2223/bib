      c: 'Zhou Enlai receives the Indonesian military friendship delegation under Ahmad Yani, Minister and Army Commander: some old Asian and African peoples have a common lot and must support each other in the common struggle; he asks them to tell Subandrio that he can push the second Afro-Asian conference along.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 550 (Apr. 28, 1963). Continues 551. Made public: 1997. Names: Zhou Enlai, Ahmad Yani, Subandrio.'
