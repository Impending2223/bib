      when: Nov. 3
      date: '1962-11-03'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai tells Ceylon's Ambassador, Perera, that the 43 aggressive posts India set up in the western sector in two years have been cleared, some thrown back by China, some withdrawn by India.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 510 (Nov. 3, 1962). Made public: 1997. Names: Zhou Enlai, A. B. Perera.'
      tags:
      - polity:prc
      - polity:ceylon
      - polity:india
      - name:zhou-enlai
