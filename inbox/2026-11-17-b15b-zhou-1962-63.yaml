      when: Feb. 21
      date: '1963-02-21'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai replies to Bandaranaike's letter, restating China's stand on the border question and the Colombo proposals. At the end of January he learned that she and others in New Delhi made clarifications of the Colombo proposals far from those given in Peking; neither is a statutory paper of the conference. Nehru's insisting on a "clarification of acceptance" beyond accepting the Colombo proposals is quite without ground; the proposals are no directive or award, and are seriously defective.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 535 (Feb. 21, 1963). Made public: 1997. To check: the letter. Names: Zhou Enlai, Srimavo Bandaranaike, Nehru.'
      tags:
