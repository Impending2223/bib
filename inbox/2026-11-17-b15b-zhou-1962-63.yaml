      when: Oct. 2–3
      date: '1963-10-02'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai receives Soviet chess players and a composer; Oct. 3 he tells the Chinese sports delegation that these players are not high in rank but his seeing them, as a representative act, shows great friendship for the Soviet people; there is now unhealthy feeling in society, opposition to revisionism has grown into opposition to foreigners, which is wrong, the shoot of an unhealthy national feeling.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 584 (Oct. 2–3, 1963). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ussr
