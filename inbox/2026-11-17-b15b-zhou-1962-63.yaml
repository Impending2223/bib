      c: Zhou Enlai has the first talk with Ceylon's Prime Minister, Srimavo Bandaranaike, arrived in Peking that day. He tells her India has set up 43 posts in the western sector; the Chinese frontier force goes on withdrawing along the whole line, and in the west China keeps posts only in two river valleys.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 522 (Dec. 31, 1962). Made public: 1997. Names: Zhou Enlai, Srimavo Bandaranaike.'
