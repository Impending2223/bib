      when: Feb. 21
      date: '1964-02-21'
      thread: republican-party-congress
      c: Dirksen names Kuchel the Republican floor manager for H.R. 7152. His aides already consulting with Humphrey's; Humphrey
        welcomes Kuchel as his "co-partner."
      n: '[[w.purdum-idea-whose-time-has-2014]], 218. To check: *Congressional Record*, Feb. 21, 1964. Names: Dirksen, Kuchel,
        Humphrey.'
      src:
        rows:
