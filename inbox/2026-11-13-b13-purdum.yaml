      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1964-02-25.civil-rights-bill
      when: Feb. 25
      date: '1964-02-25'
      thread: civil-rights-bill
      c: 'Johnson to Humphrey, on the Senate calendar: delay civil rights a few days for the cotton-wheat bill, which may
        appease Southern senators; but the bill must not be left at the White House, or "they''ll say it''s a plot of the
        cotton South." Humphrey: he takes full responsibility.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 218–19. To check: the recording, Feb. 25, 1964. Names: Johnson, Humphrey.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 218–19: all'
        c: 38e491fd
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
