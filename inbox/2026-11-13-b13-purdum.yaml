    entry:
      id: cal.1963-06-17.civil-rights-the-executive
      when: June 17
      date: '1963-06-17'
      thread: civil-rights-the-executive
      c: Robert Kennedy to religious leaders at the White House, with a map of some five hundred communities in the former
        Confederacy, Oklahoma, Kentucky, Maryland and West Virginia marked with the steps taken for voluntary desegregation.
        Asked whether the Administration will now discourage demonstrations, he would rather have matters settled by negotiation,
        but understands why one who has been refused service picks up a sign.
      n: '[[w.purdum-idea-whose-time-has-2014]], 66. To check: Kennedy''s remarks, Civil Rights Division files. Names: Kennedy.
        Check: the hour, and who was present beyond the religious leaders.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 66: all'
        c: aee40728
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1963-06-21.civil-rights-bill
      when: June 21
      date: '1963-06-21'
      thread: civil-rights-bill
      c: The White House, a two-hour meeting of the President and Robert Kennedy with 244 lawyers, sixty-six of them from
        Southern States, and three former Attorneys General, to explain and promote the civil rights bill. One of a series,
        off the record, with business and labor leaders, women's groups and religious bodies, before and after the bill's
        introduction.
      n: '[[w.purdum-idea-whose-time-has-2014]], 59–60. To check: the President''s Daily Diary, June 21, 1963. Names: Kennedy.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 59–60: all'
        c: 858c4b5d
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1963-06-21.civil-rights-the-executive
      when: June 21
      date: '1963-06-21'
      thread: civil-rights-the-executive
      c: 'Philadelphia, Independence Hall, the 175th anniversary of the Constitution''s ratification. Robert Kennedy: the
        Constitution a "vehicle of life"; the time long past when any sensible American could tolerate denial of the vote
        or "White Only" signs; must we wait for the Court to spell out each new particularity of civil rights?'
      n: '[[w.purdum-idea-whose-time-has-2014]], 63. To check: Kennedy''s address, Department of Justice. See [[cal.1963-06-21.civil-rights-bill]].
        Names: Kennedy. Check: the hour.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 63: all'
        c: 563c6cef
      tags:
      - name:kennedy-robert-f
      - city:philadelphia
      - state:pa
- add:
    entry:
      id: cal.1963-06-21.republican-party-congress
      when: June 21
      date: '1963-06-21'
      thread: republican-party-congress
      c: 'Atlanta, a speech. Halleck, asked his position on the Administration''s bill: "I just don''t know"; as a leader
        he gains nothing going one way if the troops go another.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 61–62. To check: the speech, Halleck Papers, Indiana University. Names: Halleck.
        Check: the occasion.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 61–62: all'
        c: defa5b67
      tags:
      - name:halleck-charles-a
      - city:atlanta
      - state:ga
- add:
    entry:
      id: cal.1963-07-16.civil-rights-bill-2
      when: July 16
      date: '1963-07-16'
      thread: civil-rights-bill
      c: 'Senate Judiciary Committee, 10:45 a.m., Robert Kennedy''s first appearance on the administration''s bill. Ervin,
        in place of letting him testify, speaks at length against it, Dirksen looking on: the public accommodations title
        would reach "any shoeshine boy" with a can of polish and a rag; he will oppose any bill that takes from private persons
        the right to choose their customers.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 81. To check: Senate Judiciary hearings on S. 1731 and S. 1750, Pt. 1. Names:
        Kennedy, Ervin, Dirksen. Check: the bill''s number (Purdum names S. 1731, 80).'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 81: all'
        c: 9e4319ce
      tags:
      - name:kennedy-robert-f
      - name:ervin-sam-j-jr
      - name:dirksen-everett
- add:
    entry:
      id: cal.1963-07-17.civil-rights-bill-3
      when: July 17
      date: '1963-07-17'
      thread: civil-rights-bill
      c: 'Senate Judiciary Committee. Ervin against the bill''s grant of discretion to the Attorney General to bring suits.
        Eastland: "if we pass this bill, we confer the power of a dictatorship." Ervin: it would confer the power of a dictator
        on the President. Keating and Dodd: Southern laws already control private business; Ervin: the Court nullified them
        in Brown, the Constitution changing its meaning "at noon" on May 17, 1954.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 81. To check: Senate Judiciary hearings on S. 1731 and S. 1750, Pt. 1. Names:
        Ervin, Eastland, Keating, Dodd.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 81: all'
        c: c6662677
      tags:
      - name:ervin-sam-j-jr
      - name:eastland-james-o
      - name:keating-kenneth-b
      - name:dodd-thomas-j
- add:
    entry:
      id: cal.1963-10-18.king
      when: Oct. 18
      date: '1963-10-18'
      thread: king
      c: Hoover, a top-secret memorandum on King's contacts with Levison and others alleged to be Communist-influenced, with
        an attack on King's character, to the President and the Attorney General, and copies to the Secretary of Defense,
        the CIA and the military intelligence services. Robert Kennedy orders all copies, his own among them, recalled.
      n: '[[w.purdum-idea-whose-time-has-2014]], 135. To check: the memorandum, FBI files. Names: Hoover, King, Levison, Kennedy.
        Check: the day (Purdum: Friday, Oct. 18, three days after Kennedy''s testimony).'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 135: all'
        c: 5297a8a6
      tags:
      - name:hoover-j-edgar
      - name:king-martin-luther-jr
      - name:levison-stanley-d
      - name:kennedy-robert-f
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-21.republican-party-congress-2
      when: Nov. 21
      date: '1963-11-21'
      thread: republican-party-congress
      c: 'Halleck to Frederick Hovde, president of Purdue: he is pressing the Administration for a NASA electronic research
        center on the campus at West Lafayette; he would speak to the President, who left Washington that morning for Texas,
        early the next week.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 147. To check: the letter, Halleck Papers, Indiana University. Names: Halleck.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 147: all'
        c: c734968f
      tags:
      - name:halleck-charles-a
      - state:in
- add:
    entry:
      id: cal.1964-01-21.civil-rights-bill-2
      when: Jan. 21
      date: '1964-01-21'
      thread: civil-rights-bill
      c: 'The Oval Office. Rauh, with Johnson''s leave, brings Clarence Mitchell, with whom Johnson had not been dealing on
        the bill. Johnson will oppose any strengthening in the House, keeping the Kennedy Administration''s compromise with
        McCulloch; nor will he allow the Senate to weaken it: "I don''t care how long it takes." Nothing else is to reach
        the Senate floor until the bill passes.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 176–77. To check: the President''s Daily Diary, Jan. 21, 1964. Names: Johnson,
        Rauh, Mitchell, McCulloch. Check: the hour (Purdum: the morning).'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 176–77: all'
        c: b9f72e82
      tags:
      - name:johnson-lyndon-b
      - name:rauh-joseph-l-jr
      - name:mitchell-clarence-jr
      - name:mcculloch-william-m
- add:
    entry:
      id: cal.1964-02-10.civil-rights-bill-6
      when: Feb. 10
      date: '1964-02-10'
      thread: civil-rights-bill
      c: 'Johnson to Halleck by telephone, just after 8:30 p.m., on the House''s vote: "I was mighty proud of you." Halleck:
        "a great big vote, Mr. President"; the debate "wound up in pretty good feeling."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 201. To check: the recording, Feb. 10, 1964. Names: Johnson, Halleck.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 201: all'
        c: e01fa039
      tags:
      - name:johnson-lyndon-b
      - name:halleck-charles-a
- add:
    entry:
      id: cal.1964-02-18.civil-rights-bill
      when: Feb. 18
      date: '1964-02-18'
      thread: civil-rights-bill
      c: 'The White House, after the weekly breakfast with the Democratic leaders. Johnson to Humphrey, named floor manager
        the day before: the liberals are "bomb throwers" who spread themselves thin and are never on the job; Russell knows
        the rules; the bill cannot pass without Dirksen. "You listen to Dirksen!" He will back Humphrey to the hilt.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 207–10. To check: Humphrey, *The Education of a Public Man* (cited by [[w.purdum-idea-whose-time-has-2014]],
        208–09). Names: Johnson, Humphrey, Dirksen, Russell, Mansfield. Check: the hour.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 207–10: all'
        c: 47adde2e
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:dirksen-everett
      - name:russell-richard-b
      - name:mansfield-mike
- add:
    entry:
      id: cal.1964-02-20.civil-rights-bill
      when: Feb. 20
      date: '1964-02-20'
      thread: civil-rights-bill
      c: 'Johnson to Mansfield by telephone, with Moyers on another line: Mary McGrory has found no coordinated strategy for
        the bill. Mansfield: she has not seen him or Humphrey. Johnson: the strategy is the Senate leaders'' to arrange; Mansfield
        should tell her the White House finds the plans satisfactory. Justice, with McGrory''s close sources, is starting
        the story.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 218. To check: the recording, Feb. 20, 1964. Names: Johnson, Mansfield, Humphrey,
        Moyers.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 218: all'
        c: e1503da2
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:humphrey-hubert-h
      - name:moyers-bill
