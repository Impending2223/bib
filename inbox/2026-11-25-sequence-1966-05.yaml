- edit:
    id: cal.1966-05-17.vietnam
    base: 4e9d5301
    set:
      n: 'Remarks at a Democratic Party Dinner in Chicago, [1966 Pub. Papers 513](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=589) (May 17, 1966). [[w.gibbons-u-s-government-and]], IV, 310–11 (and McPherson''s account of it, 1979); [[w.branch-at-canaans-edge]], 451 ("not arrogance but agony"); [[w.zaroulis-who-spoke-up]], 83 (a Cook County Democratic dinner; "some Nervous Nellies"). [[w.mann-grand-delusion]], 510. [[w.mcpherson-political-education]], 393. To check: *Washington Star*, May 18, 1966 (cited by [[w.branch-at-canaans-edge]], 451); [*New York Times*, May 18, 1966](https://timesmachine.nytimes.com/timesmachine/1966/05/18/issue.html), at 1, 8 (cited by [[w.branch-at-canaans-edge]], 451); [*New York Times*, May 18, 1966](https://timesmachine.nytimes.com/timesmachine/1966/05/18/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 451). See [[cal.1966-05-11.vietnam]]. Names: Johnson.'
- follows:
    id: cal.1966-05-17.vietnam
    remove:
    - cal.1966-05-17.testing
    why: 'The link''s stated basis, "the sources above", is the order of the note''s citations, which is no order of the day (R25c); none of the sources cited speaks to the Senate''s vote. The two acts are unrelated, and the hours already place them: the Senate sat from noon to 3:29 p.m. (Daily Digest, D234), and Johnson spoke at 8 p.m. after the dinner at McCormick Place (1966 Pub. Papers 520).'
- edit:
    id: cal.1966-05-26.africa
    base: 083c2c7e
    set:
      n: 'Remarks at a Reception Marking the Third Anniversary of the Organization of African Unity, [1966 Pub. Papers 556](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=632) (May 26, 1966). FRUS 1964–68, XXIV, docs. [210](https://history.state.gov/historicaldocuments/frus1964-68v24/d210), [211](https://history.state.gov/historicaldocuments/frus1964-68v24/d211). [[w.shesol-mutual-contempt]], 301 (the speech in the East Room, the ambassadors of the OAU and three hundred guests in the East Room); [[w.schlesinger-robert-kennedy-and-his]], 744 ("The week before he left," Kennedy for South Africa, Johnson "delivered a speech on Africa, his first (and last) as President"; the Times: "Cynics will wonder," "if the attention given to Senator Kennedy''s forthcoming visit" did not explain the "sudden presidential discovery of the dark continent"; no day, no place). To check: [[w.lyons-keeping-africa-off-the]]; [[w.noer-cold-war-and-black]]; [[w.deroche-black-white-and-chrome]]. See [[cal.1963-05-22.africa]].'
