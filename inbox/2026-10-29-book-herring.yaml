      id: cal.1966-11.vietnam
      when: Late Nov.
      date: 1966-11
      thread: vietnam
      c: 'Saigon. Lodge announces the Office of Civil Operations under Porter, after a month''s delay: the civilian agencies'' field offices taken into it, the civilians of each province and region under one man; Lathram its director. Westmoreland names a brigadier general his assistant for pacification.'
      n: '[[w.herring-lbj-and-vietnam]], 77–78 (the order to Lodge; his objections; the office, its form and staff; Vann in III Corps). Check: the day. To check: [[w.pentagon-papers]], Gravel ed., II, 601–602. See [[cal.1966-10-14.vietnam]]. Names: Lodge, Porter, Lathram, Westmoreland.'
