      when: Jan. 31
      date: '1966-01-31'
      thread: vietnam
      c: 'Rangoon. Hours after the bombing resumes, Vũ Hữu Bình, North Vietnam''s consul general, asks Byroade to call and gives him an aide-memoire: Hanoi''s familiar terms, in answer to the message of the pause; an answer invited. Pinta.'
      n: '[FRUS 1964–68, IV, doc. 76](https://history.state.gov/historicaldocuments/frus1964-68v04/d76) (the reply of Feb. 16, noting the aide-memoire of Jan. 31). [[w.herring-lbj-and-vietnam]], 101 (the invitation, nothing new, an answer invited; Pinta). To check: [[w.herring-secret-diplomacy-of-the]], 116–58. See [[cal.1965-12-29.vietnam]]. Names: Byroade.'
