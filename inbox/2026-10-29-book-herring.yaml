- add:
    entry:
      id: cal.1965-01-30.vietnam
      when: Jan. 30
      date: '1965-01-30'
      thread: vietnam
      c: 'Stevenson to U Thant: Washington will not take part in the talks with North Vietnam at Rangoon that Thant has arranged with Ne Win. Rusk''s answer, "There may be a time ... but not now," by Herring''s account given without consulting Johnson, nothing put in writing.'
