- add:
    entry:
      id: cal.1964-08-06.vietnam-2
      when: Aug. 6
      date: '1964-08-06'
      thread: vietnam
      c: 'U Thant at the White House: some twenty minutes alone with Johnson, then with Bunche, Stevenson, McGeorge Bundy, Cleveland and Duke. Thant: a private probe of Hồ Chí Minh''s feelings still worth making, the Pakistanis the best channel, Ne Win unwilling. Bundy: Hanoi "a blank wall." Johnson: "We are ready to get out tomorrow if they (the Communists) will behave."'
      n: 'Remarks of Welcome at the White House to the Secretary General of the United Nations, [1963–64 Pub. Papers 932](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=172); Toasts of the President and Secretary General U Thant, [1963–64 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=174) (Aug. 6, 1964). [FRUS 1964–68, I, doc. 298](https://history.state.gov/historicaldocuments/frus1964-68v01/d298) (Cleveland''s memorandum of the conversation; a like talk with Rusk at lunch at State, 1:15 p.m.). [[w.herring-lbj-and-vietnam]], 91 (Thant with Johnson, Rusk and Stevenson, Aug. 6; his proposal, "in a very tentative way," of talks between American and North Vietnamese envoys on neutral ground). Check: Herring gives talks between envoys; Cleveland''s memorandum, a private probe of Hồ. Names: U Thant, Johnson, Bunche, Stevenson, Bundy, Cleveland, Duke, Hồ Chí Minh, Ne Win.'
