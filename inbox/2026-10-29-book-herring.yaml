      when: Aug. 6
      date: '1965-08-06'
      thread: vietnam
      c: 'Paris. Gullion, retired from the Foreign Service, sent as an authorized but unofficial American, meets Mai Văn Bộ, North Vietnam''s representative: the first of four meetings, to Sept. 1. Code name XYZ, Gullion "X," Bộ "Rupert." Ball in charge.'
      n: 'FRUS 1964–68, III, docs. [112](https://history.state.gov/historicaldocuments/frus1964-68v03/d112) (editorial note: the contact, the four meetings, the talking points), [113](https://history.state.gov/historicaldocuments/frus1964-68v03/d113) (the first meeting). [[w.herring-lbj-and-vietnam]], 98–99 (from a businessman''s word to State, July 29; Ball in charge; Gullion''s instructions to build on Hanoi''s four points; the talks of August and September, the most substantive of 1964–68). Made public: [[w.herring-secret-diplomacy-of-the]], 77–107 (1983); FRUS 1964–68, III (1996). To check: [[w.herring-secret-diplomacy-of-the]]. Names: Gullion, Mai Văn Bộ, Ball.'
      src:
        c: 02f18b78
        rows:
