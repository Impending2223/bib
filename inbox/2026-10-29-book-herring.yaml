      c: '*Look*, its Nov. 30 issue on the newsstands: Sevareid, "The Final Troubled Hours of Adlai Stevenson." Stevenson''s account, two days before his death: Thant had Hanoi''s agreement in the autumn of 1964 to send an emissary to Rangoon; "someone in Washington" put it off until after the election; after it, McNamara opposed.'
