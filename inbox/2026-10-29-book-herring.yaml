      when: Sept. 5
      date: '1967-09-05'
      thread: vietnam-air-war
      c: 'Tuesday lunch, 1:05 to 2:40 p.m., Johnson with Rusk, McNamara, Rostow, Christian, Helms and Harold Johnson. McNamara: of the targets left, ten to be recommended; the bridges and rail yards "smack in the middle of Haiphong and Hanoi." Johnson: the ports of Cẩm Phả and Hòn Gai to be struck whenever no ships are in them; Rusk: the order to read "no ships."'
      n: 'Jones''s notes, [FRUS 1964–68, V, doc. 305](https://history.state.gov/historicaldocuments/frus1964-68v05/d305). [[w.herring-lbj-and-vietnam]], 57 (Cẩm Phả and Hòn Gai approved). Made public: FRUS 1964–68, V (2002). Check: Herring has the ports approved over McNamara''s and Rusk''s opposition; Jones''s notes, McNamara unsure the order could be carried out and Rusk shaping it. See [[cal.1967-08-09.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Christian, Helms, Harold K. Johnson.'
