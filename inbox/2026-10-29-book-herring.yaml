      c: 'Stevenson to Johnson: an early statement of the American position on Vietnam, for the Security Council, as Thant suggested. By Herring''s account: the United States to stop aggression, by arms if need be, but ready to explore a settlement; Thant to follow with an appeal to seven nations.'
