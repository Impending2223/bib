    entry:
      id: cal.1966-03.vietnam
      when: March
      date: 1966-03
      thread: vietnam
      c: 'The Army''s study group, field officers from Vietnam named by Harold Johnson: "A Program for the Pacification and Long-Term Development of South Vietnam" (PROVN). The weight of the effort to shift from the enemy''s main forces to the security of the countryside and to reform; the Ambassador the sole manager of every American activity in the country.'
      n: '[[w.herring-lbj-and-vietnam]], 73–74 (the report and its proposals; the Army''s deputy chief of staff for operations would not sign it, 201 n.38). To check: [[w.pentagon-papers]], Gravel ed., II, 576–77; Volney Warner''s oral history, U.S. Army Military History Institute (cited by [[w.herring-lbj-and-vietnam]], 73 n.38). Names: Harold K. Johnson.'
