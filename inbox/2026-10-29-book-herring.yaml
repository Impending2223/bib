      when: Feb. 18
      date: '1966-02-18'
      thread: vietnam
      c: 'Rangoon. Byroade gives Vũ Hữu Bình the American aide-memoire of Feb. 16, four points on the Geneva Accords; Vũ: the bombing resumed, it is "inappropriate to continue our contacts."'
      n: '[FRUS 1964–68, IV, doc. 76](https://history.state.gov/historicaldocuments/frus1964-68v04/d76) (the aide-memoire; n. 4, Byroade''s telegram 433, Feb. 19; Vũ''s aide-memoire of Feb. 19 ending the contact). [[w.herring-lbj-and-vietnam]], 101 (Byroade''s answer; the contact closed). Check: Herring dates Byroade''s answer Feb. 19; Byroade''s telegram, Feb. 18. See [[cal.1966-01-31.vietnam-2]]. Names: Byroade.'
