    entry:
      id: cal.1965-02-24.vietnam-2
      when: Feb. 24
      date: '1965-02-24'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'U Thant''s press conference at the UN: he has been in talks on Vietnam for some time. "I am sure that the great American people, if only they knew the true facts and the background to the developments in South Vietnam, will agree with me that further bloodshed is unnecessary." "As you know, in times of war and hostilities, the first casualty is truth."'
      n: '[FRUS 1964–68, II, doc. 161](https://history.state.gov/historicaldocuments/frus1964-68v02/d161) (editorial note: the press conference; extracts, *Papers of Adlai E. Stevenson*, VIII, 663–64). [[w.herring-lbj-and-vietnam]], 92–93 (the press conference and its words; before it, Bill Frye''s account of Thant''s first move in the *Chicago Sun-Times*, Feb. 21; after it, Reedy''s denial of any "authorized negotiations"; the *Times* for negotiations). To check: the transcript, Stevenson Papers, Princeton, box 906 (cited by FRUS); *New York Times*, Feb. 17, 18, 21, 25, 1965 (cited by [[w.herring-lbj-and-vietnam]], 93 n.11). See [[cal.1964-08-06.vietnam-2]]. Names: U Thant.'
