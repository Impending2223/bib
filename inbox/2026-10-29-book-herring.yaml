      when: Dec. 29
      date: '1965-12-29'
      thread: vietnam-pause
      also:
      - defense
      c: 'McNamara calls in the Joint Chiefs, explains the pause, and promises a major escalation early in the new year. They had not been asked: the cable announcing the pause sent in their name, drafted in McNamara''s office, McConnell refusing to sign it.'
      n: '[[w.herring-lbj-and-vietnam]], 42 (the meeting, "apparently to appease them"; the cable, McConnell''s refusal, his and McDonald''s protest). Check: Herring''s source is Greene''s account. To check: Wallace M. Greene, "The Bombing ''Pause'': Formula for Failure," *Air Force Magazine* (Apr. 1976), 36–39 (cited by [[w.herring-lbj-and-vietnam]], 42 n.58). See [[cal.1965-12-24.vietnam]]. Names: McNamara, McConnell.'
