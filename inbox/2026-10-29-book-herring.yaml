      when: Feb. 24
      date: '1965-02-24'
      thread: vietnam
      c: 'Rusk telephones U Thant at about 10 p.m.: "quite a reaction in Washington" to his implication that the truth was being withheld from the American people; his proposals for talks "procedural" rather than "substantive."'
      n: '[FRUS 1964–68, II, doc. 161](https://history.state.gov/historicaldocuments/frus1964-68v02/d161) (editorial note: Rusk''s call; the memorandum of it, *Papers of Adlai E. Stevenson*, VIII, 664–65; Yost to see Thant, Feb. 25, doc. [164](https://history.state.gov/historicaldocuments/frus1964-68v02/d164)). [[w.herring-lbj-and-vietnam]], 93 (Rusk aware of Thant''s proposals, in private; in public, in a press conference, the proposals "procedural"). Check: Herring has the word "procedural" from Rusk''s press conference; FRUS''s note, from the call. See [[cal.1964-08-06.vietnam-2]]. Names: Rusk, U Thant.'
