    base: 80bc40c6
    set:
      n: '[FRUS 1964–68, I, doc. 74](https://history.state.gov/historicaldocuments/frus1964-68v01/d74) (McNamara''s instructions to the mission, Mar. 5). [[w.gibbons-u-s-government-and]], II, 238 (the mission sent Mar. 8, five days in Vietnam); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 507; [[w.cosmas-joint-chiefs-of-staff-2012]], 32–33 (the visit). To check: [[w.pentagon-papers]]; [[w.mcnamara-in-retrospect]]; [[w.taylor-swords-and-plowshares]]; [[w.logevall-choosing-war]]; [[w.vandemark-into-the-quagmire]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.kaiser-american-tragedy]]; [[w.barrett-uncertain-warriors]]; *New York Times*, Mar. 10, 1964 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 507 n.45). See [[cal.1963-11-26.vietnam]]. Check: Cosmas, 32, has McNamara and Taylor with Khánh at Huế, Mar. 11, and trips into the countryside; no Delta. Names: McNamara, Taylor, Nguyễn Khánh.'
