patch: 2026-11-12-b11-odonnell
by: 'Claude (batch 11 reader, Sonnet; O''Donnell and Powers, Johnny, We Hardly Knew Ye: 1960 through Nov. 1963; pages cited by printed folio, text layer read, quotations spot-checked on the page image)'
ops:
- add:
    entry:
      id: cal.1960-04-06.elections-1960-primaries-2
      when: Apr. 6
      date: '1960-04-06'
      thread: elections-1960-primaries
      c: 'Charleston, W. Va., after the meeting at the Kanawha Hotel. Robert Kennedy, from a telephone booth, to Kennedy in Washington: the way to avoid a religious fight is to persuade Humphrey to withdraw. Kennedy: "It can''t be that bad," the seventy-thirty poll. Robert Kennedy: "The people who voted for you in that poll have just found out that you''re a Catholic." Kennedy: "Come back to Washington for a few days, and we''ll see what we can do with Hubert."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 181–82 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Robert Kennedy, Humphrey.'
      tags: ['name:kennedy-john-f', 'name:kennedy-robert-f', 'name:humphrey-hubert-h', 'state:wv']
- add:
    entry:
      id: cal.1960-05-09.elections-1960-primaries
      when: May 9
      date: '1960-05-09'
      thread: elections-1960-primaries
      c: Charleston, W. Va., the Kanawha Hotel, the day before the primary. Robert Kennedy, O'Donnell, McDonough and Harris each figure the vote on a yellow pad. O'Donnell gives Kennedy fifty-one to forty-nine, "mainly because I was trying to cheer up Bobby and O'Brien"; McDonough, an even chance; Harris keeps "changing his figures every hour."
      n: '[[w.odonnell-johnny-we-hardly-knew]], 191–92 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Robert Kennedy, O''Donnell, Harris.'
      tags: ['name:kennedy-robert-f', 'name:odonnell-kenneth-p', 'name:harris-louis', 'state:wv']
- add:
    entry:
      id: cal.1960-05-10.elections-1960-primaries-2
      when: May 10
      date: '1960-05-10'
      thread: elections-1960-primaries
      c: 'Charleston, W. Va., primary day, after the Caroline takes Kennedy off to Washington. Robert Kennedy to O''Donnell: "If we lose here today, we might as well stay home and watch the convention on television. Damn that Hubert Humphrey."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 192 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Robert Kennedy, O''Donnell, Humphrey.'
      tags: ['name:kennedy-robert-f', 'name:odonnell-kenneth-p', 'name:humphrey-hubert-h', 'state:wv']
- add:
    entry:
      id: cal.1960-07.elections-1960-los-angeles-3
      when: July
      date: 1960-07
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the convention week. Kennedy makes "one last attempt" to have Stevenson nominate him, as he had Stevenson in 1956; Stevenson: he must remain "neutral." Kennedy, to O''Donnell and Powers: "Neutral for Johnson? He''s got a short memory. He''s forgetting that I was for him in 56 when Johnson and Rayburn were both against him."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 206 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Stevenson, Johnson, Rayburn, O''Donnell, Powers. Check: the day (before July 13; the book has "no major problems" for the first four days, and Kennedy increasingly annoyed by Stevenson''s reluctance).'
      tags: ['name:kennedy-john-f', 'name:stevenson-adlai-e', 'name:johnson-lyndon-b', 'name:rayburn-sam', 'name:odonnell-kenneth-p', 'name:powers-david-f']
- add:
    entry:
      id: cal.1960-07-13.elections-1960-los-angeles-4
      when: July 13
      date: '1960-07-13'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the Biltmore, Kennedy''s suite, before the balloting. Hawaii delegates, some in Stevenson hats, tell him their caucus gave Stevenson 3½ votes, Johnson 3, Kennedy 1½. Kennedy, "for the first time that week," chastises a delegation: neither Stevenson nor Johnson can win; he ticks off New York, Pennsylvania, Illinois and Ohio on his fingers.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 208 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Stevenson, Johnson.'
      tags: ['name:kennedy-john-f', 'name:stevenson-adlai-e', 'name:johnson-lyndon-b', 'state:hi', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-13.elections-1960-los-angeles-5
      when: July 13
      date: '1960-07-13'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the Biltmore, Kennedy''s suite, the Golden Door. A message from Kenny, Hudson County leader: after a long caucus that morning, Governor Meyner still holds New Jersey''s forty-one votes for himself on the first ballot; Kennedy can count on thirty-one on the second.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 208 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy.'
      tags: ['name:kennedy-john-f', 'state:nj', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-13.elections-1960-los-angeles-6
      when: July 13
      date: '1960-07-13'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the Biltmore, Kennedy''s suite, at lunch, to his sister Pat Lawford, on the split in the California delegation over Stevenson: "Maybe I shouldn''t have listened to Pat Brown. I should have entered that primary."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 209 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy.'
      tags: ['name:kennedy-john-f', 'state:ca', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-14
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, North Rossmore Avenue, after two o''clock in the morning. Kennedy, who has read aloud Johnson''s telegram, "LBJ now means Let''s Back Jack," has Powers try to reach Johnson by telephone; a sleepy aide: Johnson is in bed. Kennedy telephones a message by Evelyn Lincoln''s husband, Abe, who types it and takes it by hand to Johnson''s suite: Kennedy wants to see Johnson at ten that morning. To Powers: "I wish I had asked Lyndon and George Smathers to be at that meeting of Southern governors we''ve got scheduled for eleven-thirty."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 214–15 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Johnson, Powers, Lincoln.'
      tags: ['name:kennedy-john-f', 'name:johnson-lyndon-b', 'name:powers-david-f', 'name:lincoln-evelyn', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-15
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the Biltmore, Kennedy''s suite, about eight. Kennedy takes Robert Kennedy into a bedroom and closes the door. Coming out, Robert Kennedy: "If you''re sure it''s what you want to do, go ahead and see him." By Powers''s account, Johnson is the "him."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 215 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Robert Kennedy, Johnson, Powers.'
      tags: ['name:kennedy-john-f', 'name:kennedy-robert-f', 'name:johnson-lyndon-b', 'name:powers-david-f', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-16
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the Biltmore, Robert Kennedy''s bedroom, half an hour after Kennedy tells him of the offer. Salinger to O''Donnell: Robert Kennedy "just asked me to add up the electoral votes in the states we''re sure of, and to add Texas." O''Donnell, to Robert Kennedy in the bathtub: "Don''t tell me it''s Johnson." "I guess it is. He''s seeing him now." O''Donnell: "Do you realize this is a disaster? Nixon will love this. ... I want to talk to your brother myself on this one."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 216 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Salinger, Robert Kennedy, Johnson.'
      tags: ['name:odonnell-kenneth-p', 'name:salinger-pierre', 'name:kennedy-robert-f', 'name:johnson-lyndon-b', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-17
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the Statler Hilton, the labor leaders assembled. Reuther and Meany, who had seen Kennedy earlier with Goldberg, are "violently angry" at the choice of Johnson; Conway "coming at me as if he was about to slug me" (O''Donnell). Rose: if Johnson is on the ticket, Kennedy will not be on the Liberal party''s line in New York. The labor people shout they will put up a candidate of their own and make a floor fight. Rose telephones Dubinsky in New York; Dubinsky, by Rose: "Kennedy is making a smart move." The shouts of "sellout" and "double cross" resume. O''Donnell and Robert Kennedy the targets.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 218–19 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Reuther, Meany, Conway, Goldberg, Kennedy, Johnson, O''Donnell, Robert Kennedy.'
      tags: ['name:reuther-walter', 'name:meany-george', 'name:conway-jack-t', 'name:goldberg-arthur-j', 'name:kennedy-john-f', 'name:johnson-lyndon-b', 'name:odonnell-kenneth-p', 'name:kennedy-robert-f', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-18
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: Los Angeles, the Biltmore, Kennedy's suite, a meeting of Southern governors approving Johnson. Soapy Williams of Michigan walks in by accident and shouts that if Johnson is nominated he will lead a floor fight against the nomination. A few of the Southerners jump up to take a punch at him; Ribicoff steps in. Kennedy, in an armchair, watches "without saying a word."
      n: '[[w.odonnell-johnny-we-hardly-knew]], 220 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Williams, Kennedy, Johnson, Ribicoff.'
      tags: ['name:williams-g-mennen', 'name:kennedy-john-f', 'name:johnson-lyndon-b', 'name:ribicoff-abraham', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-19
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the afternoon and evening. At 4:30 Jack Conway tells O''Donnell the labor people and the liberals of Michigan''s delegation are still "definitely planning a fight to the finish" against the ticket. At 7:30, on the floor, Conway telephones: no floor fight, no candidate against Johnson. By O''Donnell''s later account, Reuther''s people had made their own pact: they would drop their opposition if Johnson supported the convention''s civil rights platform; Johnson wrote a letter to that effect, which Woodcock took to a caucus of Michigan''s delegation. Williams stayed against Johnson.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 222–23 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Conway, O''Donnell, Reuther, Johnson, Williams.'
      tags: ['name:conway-jack-t', 'name:odonnell-kenneth-p', 'name:reuther-walter', 'name:johnson-lyndon-b', 'name:williams-g-mennen', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-07-15.elections-1960-los-angeles-2
      when: July 15
      date: '1960-07-15'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, the Biltmore, after the acceptance speech at the Coliseum. Robert Kennedy to O''Donnell: "I think Whizzer White would make an excellent national chairman." O''Donnell: "Whizzer White didn''t know anything about politics until three weeks ago last Sunday. Are you expecting him to be the head of the party during a Presidential campaign?" Robert Kennedy: "I guess maybe you''re right." They agree O''Donnell and Powers will travel with the candidate, Robert Kennedy will work with the party''s chairman, and there will be a Citizens-for-Kennedy organization.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 225 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Robert Kennedy, White, O''Donnell, Powers.'
      tags: ['name:kennedy-robert-f', 'name:white-byron-r', 'name:odonnell-kenneth-p', 'name:powers-david-f', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-09-09.elections-1960-kennedy-11
      when: Sept. 9
      date: '1960-09-09'
      thread: elections-1960-kennedy
      c: 'Los Angeles, a hotel room, before the evening''s speech at the Shrine Temple. Kennedy asks O''Donnell about the Houston ministers'' invitation. Robert Kennedy, the advance man Tim May, Johnson and Rayburn are against it. O''Donnell: "I think it would be a mistake. If you have to meet the religious issue, Houston is not the place to do it." Kennedy, after shaving: "Tell them I''m going to do it. This is as good a time as any to get it over with. I''ve got to face it sooner or later."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 231–33 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Robert Kennedy, Johnson, Rayburn. Check: the day (the book has the decision on the day the train trip ended at Bakersfield and Kennedy flew to Los Angeles, "a week" before the Houston meeting).'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:kennedy-robert-f', 'name:johnson-lyndon-b', 'name:rayburn-sam', 'city:los-angeles']
- add:
    entry:
      id: cal.1960-09-11.elections-1960-kennedy-3
      when: Sept. 11
      date: '1960-09-11'
      thread: elections-1960-kennedy
      c: 'El Paso, Tex., the airport, late at night, some twenty thousand at the plane. Johnson boards with newspaper clippings of what a Kennedy advance man, whom the authors call "Pete Reynolds," told El Paso reporters: "Kennedy is more popular down here than Johnson, and he needs us in Texas more than we need him." Kennedy hands the clippings to O''Donnell, who tells the man to take the next plane out. Johnson talks of him to O''Donnell until five in the morning; at breakfast: "I was too busy thinking about that feller you brought down here from Boston."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 230–31 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Johnson, Kennedy, O''Donnell, Rayburn. Check: the day (the book has the arrival "late at night" and the crowds at El Paso, Fort Worth and San Antonio on the day of the Houston ministers, Sept. 12, 236). "Pete Reynolds" is not the man''s name, the authors say (230).'
      tags: ['name:johnson-lyndon-b', 'name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:rayburn-sam', 'state:tx']
- add:
    entry:
      id: cal.1960-09-12.elections-1960-kennedy-6
      when: Sept. 12
      date: '1960-09-12'
      thread: elections-1960-kennedy
      c: 'Houston, the Rice Hotel, a suite upstairs, while Kennedy speaks to the ministers on television. O''Donnell and Powers with Rayburn, who had been against Kennedy before the convention and "lukewarm toward him afterwards." Rayburn: "By God, look at him--and listen to him! He''s eating ''em blood raw! This young feller will be a great President!"'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 233–36 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Rayburn, Kennedy, O''Donnell, Powers.'
      tags: ['name:rayburn-sam', 'name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:powers-david-f', 'state:tx', 'city:houston']
- add:
    entry:
      id: cal.1960-11-05.elections-1960-kennedy-12
      when: Nov. 5
      date: '1960-11-05'
      thread: elections-1960-kennedy
      c: 'New York, the Biltmore, Saturday, after a day of rain in Manhattan, the Bronx and Queens. Kennedy, stripped to his shorts without dry clothes, is seen by the crowd in the corridor; Johnson goes in and comes out "pale and shaken": "That boy is very mad." Kennedy to O''Donnell: tell DeSapio the parade is off, "I''m not going to have seven thousand policemen tying up the entire city of New York in the pouring rain to have one stupid politician riding down the street." If DeSapio does not cancel it, O''Donnell is to call the police commissioner. DeSapio: "You can''t do it." The parade is canceled.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 246–47 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Johnson, O''Donnell, DeSapio.'
      tags: ['name:kennedy-john-f', 'name:johnson-lyndon-b', 'name:odonnell-kenneth-p', 'name:desapio-carmine', 'city:nyc']
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-13
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      c: 'Hyannis Port, Robert Kennedy''s house, the evening. Johnson telephones from his ranch: Texas close, but safe. Kennedy to O''Donnell and others, with a smile: Johnson said, "I see we won in Pennsylvania, but what happened to you in Ohio?"'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 251 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Johnson, Kennedy, Robert Kennedy, O''Donnell.'
      tags: ['name:johnson-lyndon-b', 'name:kennedy-john-f', 'name:kennedy-robert-f', 'name:odonnell-kenneth-p', 'state:tx', 'state:oh', 'state:pa']
- add:
    entry:
      id: cal.1960-11-09.elections-1960-count-4
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960-count
      c: 'Hyannis Port, Robert Kennedy''s house, a little after three in the morning, Nixon on television. Salinger urges Kennedy to go before the reporters and cameras at the armory. Kennedy, pointing at Nixon on the screen: "You want me to put on a performance like that at this hour of the night? Not me. I''m going to bed." To friends angry that Nixon has not conceded: "Why should he concede now? If I were him, I wouldn''t."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 252–53 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Salinger, Kennedy, Nixon.'
      tags: ['name:salinger-pierre', 'name:kennedy-john-f', 'name:nixon-richard-m']
- add:
    entry:
      id: cal.1960-11-09.transition-and-staff-4
      when: Nov. 9
      date: '1960-11-09'
      thread: transition-and-staff
      c: Hyannis Port, after Kennedy's television statement at the armory. Petersen and Rowley of the Secret Service tell O'Donnell they have been told by Kennedy that the detail is under his direction and will report to him; O'Donnell learns he is to administer the White House staff, the schedule, travel and security, and "any political problems that might be bothering him."
      n: '[[w.odonnell-johnny-we-hardly-knew]], 255 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Kennedy, Powers.'
      tags: ['name:odonnell-kenneth-p', 'name:kennedy-john-f', 'name:powers-david-f', 'name:rowley-james-j']
- add:
    entry:
      id: cal.1960-11-15.transition-and-staff-cabinet
      when: Nov. 15
      date: '1960-11-15'
      thread: transition-and-staff-cabinet
      c: 'Palm Beach, Tuesday. Ribicoff golfs with Kennedy, talks with him two hours, and is offered the Attorney Generalship. Ribicoff declines: the Attorney General would be mainly involved in civil rights, and an Irish Catholic President with a Jewish Attorney General enforcing school desegregation would hardly "set well in the Protestant South." He goes instead to Health, Education and Welfare.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 258–59 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Ribicoff, Kennedy, Robert Kennedy.'
      tags: ['name:ribicoff-abraham', 'name:kennedy-john-f', 'name:kennedy-robert-f', 'state:ct']
- add:
    entry:
      id: cal.1960-12-14.transition-and-staff-cabinet
      when: Dec. 14
      date: '1960-12-14'
      thread: transition-and-staff-cabinet
      c: Georgetown, N Street, the Wednesday morning, at breakfast with Kennedy. Robert Kennedy gives in and agrees to be Attorney General.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 272–73 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Robert Kennedy, Kennedy. Check: the day (the book has "the Wednesday morning after that weekend at Palm Beach"; the weekend of Dec. 10–11).'
      tags: ['name:kennedy-robert-f', 'name:kennedy-john-f']
- add:
    entry:
      id: cal.1960-12-10.transition-and-staff-cabinet-2
      when: Dec. 10
      date: '1960-12-10'
      thread: transition-and-staff-cabinet
      c: 'Palm Beach, the weekend. Kennedy, to Powers, on the need for his brother in the Cabinet: "What if he does happen to be my brother? I want the best men I can get, and they don''t come any better than Bobby." Powers''s account is that the President-elect "talked seriously with Dave about how much he needed Bobby in the Cabinet."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 272 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Powers, Robert Kennedy. Check: the day (the book has "that weekend," after the flight to Palm Beach on Friday, Dec. 9).'
      tags: ['name:kennedy-john-f', 'name:powers-david-f', 'name:kennedy-robert-f']
- add:
    entry:
      id: cal.1961-01-21.transition-and-staff-2
      when: Jan. 21
      date: '1961-01-21'
      thread: transition-and-staff
      c: 'The White House, Saturday morning. Truman, the first visitor of Kennedy''s presidency, calls on him, his first visit since leaving the house eight years before. Truman to the photographers in the West Wing lobby: Kennedy would be a President who would allow them "the one more picture" they always ask; "I heard the other fellow wouldn''t stand for it."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 283 (O''Donnell''s and Powers''s account). Names: Truman, Kennedy.'
      tags: ['name:truman-harry-s', 'name:kennedy-john-f']
- add:
    entry:
      id: cal.1961-04-14.cuba-bay-of-pigs-2
      when: Apr. 14
      date: '1961-04-14'
      thread: cuba-bay-of-pigs
      c: 'The White House, the Friday before the landings. Kennedy, for the first time, talks to O''Donnell of the Cuban invasion plan, and shows him that morning''s message from a Marine colonel who had inspected the brigade in Guatemala, confident it could carry out its mission. Of calling the plan off: "I don''t know if we could go down there and take the guns away from them." Of opposition among his top officials: "Not one, unless you count Bill Fulbright among our top officials."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 305–07 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Fulbright.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:fulbright-j-william', 'polity:cuba']
- add:
    entry:
      id: cal.1961-04-18.cuba-bay-of-pigs-2
      when: Apr. 18
      date: '1961-04-18'
      thread: cuba-bay-of-pigs
      c: 'The White House, Tuesday night, the news of the brigade''s failure and capture confirmed. Kennedy, with little to say to anybody, walks out of his office into the Rose Garden and stays alone almost an hour. O''Donnell to Salinger, watching: "He must be the loneliest man in the world tonight."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 307 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Salinger. Check: the day (the book has "Tuesday night," Apr. 18; the brigade''s surrender was Apr. 19).'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:salinger-pierre', 'polity:cuba']
- add:
    entry:
      id: cal.1961-06-03.berlin-and-vienna-2
      when: June 3
      date: '1961-06-03'
      thread: berlin-and-vienna
      c: 'Vienna, the American Embassy residence, after the first day''s talks. Kennedy, in the bathtub, to O''Donnell and Powers, of Khrushchev when Kennedy spoke of the danger of miscalculation: "He started yelling, ''Miscalculation! Miscalculation! Miscalculation! ... You ought to take that word and bury it in cold storage and never use it again! I''m sick of it!''" Kennedy: "So I''m trying to remind myself, the next time I''m talking to Khrushchev, don''t mention ''miscalculation.''"'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 334–35 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Powers, Khrushchev.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:powers-david-f', 'name:khrushchev-nikita-s', 'polity:ussr']
- add:
    entry:
      id: cal.1961-06-03.berlin-and-vienna-3
      when: June 3
      date: '1961-06-03'
      thread: berlin-and-vienna
      c: 'Vienna, the luncheon, Kennedy to Khrushchev, who is wearing the Lenin peace medal: "I hope you get to keep it."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 335 (O''Donnell''s and Powers''s account). Names: Kennedy, Khrushchev.'
      tags: ['name:kennedy-john-f', 'name:khrushchev-nikita-s', 'polity:ussr']
- add:
    entry:
      id: cal.1961-06-04.berlin-and-vienna-2
      when: June 4
      date: '1961-06-04'
      thread: berlin-and-vienna
      c: 'Air Force One, Vienna to London, Sunday night. Kennedy calls O''Donnell into his cabin and talks alone with him for more than an hour on Khrushchev and Berlin. "All wars start from stupidity. ... it seems particularly stupid to risk killing a million Americans over an argument about access rights on an Autobahn in the Soviet zone of Germany. ... Before I back Khrushchev against the wall and put him to a final test, the freedom of all of Western Europe will have to be at stake." As the plane descends: if there is to be a nuclear war, "we''ll have to fix things so it will be started by the President of the United States, and nobody else. Not by a trigger-happy sergeant on a truck convoy at a checkpoint in East Germany."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 337–40 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Khrushchev.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:khrushchev-nikita-s', 'polity:ussr', 'polity:frg']
- add:
    entry:
      id: cal.1962-09-25.congress
      when: Sept. 25
      date: '1962-09-25'
      thread: congress
      c: The White House, 8:45 a.m., Kennedy's breakfast with the Senate and House leaders; Johnson, O'Brien, Salinger and O'Donnell also attend. Kennedy had risen at seven-thirty "to read some bills" to talk over with Mansfield and McCormack. The leaders then go to the Rose Garden to meet the press.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 291 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Names: Kennedy, Johnson, O''Brien, Salinger, O''Donnell, Mansfield, McCormack.'
      tags: ['name:kennedy-john-f', 'name:johnson-lyndon-b', 'name:obrien-lawrence-f', 'name:salinger-pierre', 'name:odonnell-kenneth-p', 'name:mansfield-mike', 'name:mccormack-john-w']
- add:
    entry:
      id: cal.1962-09-25.vietnam-2
      when: Sept. 25
      date: '1962-09-25'
      thread: vietnam
      c: The White House, fifty-two minutes. Kennedy and Nguyễn Đình Thuận, whom the authors call Secretary of State for Security. By the authors, Kennedy warns him "once again, as he had warned Diem and Nhu continually," that the Diệm regime will get no more military or economic support unless it gives its opponents more political freedom and stops persecuting the Buddhist monks.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 291–92 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Thuận, Diệm, Nhu. Check: the day or the warning (the Buddhist monks'' persecution began in May 1963; the authors place the meeting with Thuận in September 1962).'
      tags: ['name:kennedy-john-f', 'name:nguyen-dinh-thuan', 'name:ngo-dinh-diem', 'name:ngo-dinh-nhu', 'polity:rvn']
- add:
    entry:
      id: cal.1962-09-25.white-house
      when: Sept. 25
      date: '1962-09-25'
      thread: white-house
      c: The White House, during Thuận's visit. Barney Ross, of PT-109, brings Ben Kevu, the Solomon Islander who carried the message, to the President's office, the first time since 1943. Kevu, fifty-four, in the United States for Jack Paar's television show. Kennedy shows him the coconut with the message and the coast watcher's note, and gives him PT-109 tie clasps for his children. Kevu is then besieged in the West Lobby by reporters and photographers.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 292–93 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Names: Kennedy.'
      tags: ['name:kennedy-john-f']
- add:
    entry:
      id: cal.1962-09-25.white-house-2
      when: Sept. 25
      date: '1962-09-25'
      thread: white-house
      c: The White House, 11 a.m., Menzies, the Australian Prime Minister, kept waiting in the Cabinet Room during the Kevu visit; Kennedy then meets him for about an hour, Powers bringing him in to meet Kevu.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 293 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Names: Menzies, Kennedy, Powers.'
      tags: ['name:menzies-robert-g', 'name:kennedy-john-f', 'name:powers-david-f', 'polity:australia']
- add:
    entry:
      id: cal.1962-09-25.jobs-and-wages
      when: Sept. 25
      date: '1962-09-25'
      thread: jobs-and-wages
      c: The Cabinet Room, about noon. Kennedy swears in Willard Wirtz as Secretary of Labor, Wirtz's family and friends there, among them Goldberg, Adam Clayton Powell, Reuther, Meany, Paul Douglas and Heller.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 293–94 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Names: Wirtz, Kennedy, Goldberg, Powell, Reuther, Meany, Douglas, Heller.'
      tags: ['name:wirtz-w-willard', 'name:kennedy-john-f', 'name:goldberg-arthur-j', 'name:powell-adam-clayton-jr', 'name:reuther-walter', 'name:meany-george', 'name:douglas-paul-h', 'name:heller-walter-w']
- add:
    entry:
      id: cal.1962-09-25.elections-1962
      when: Sept. 25
      date: '1962-09-25'
      thread: elections-1962
      c: 'The White House, noon. Representative James E. Burke, of Massachusetts, asks O''Donnell for a photograph of himself shaking Kennedy''s hand for his campaign for reelection; held in the "Confessional Booth" until the moment. Kennedy: "How is everything back in Milton, Jim? I hope it''s quieter there than it is around here." Burke gets his picture.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 293–94 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Kennedy.'
      tags: ['name:odonnell-kenneth-p', 'name:kennedy-john-f']
- add:
    entry:
      id: cal.1962-09-25.cuba
      when: Sept. 25
      date: '1962-09-25'
      thread: cuba
      c: The White House, before lunch. Ball and McGhee ask for an urgent off-the-record meeting with Kennedy about "the growing Cuban crisis"; Kennedy sees them before he goes to lunch.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 294–96 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Ball, McGhee, Kennedy.'
      tags: ['name:ball-george-w', 'name:mcghee-george-c', 'name:kennedy-john-f', 'polity:cuba']
- add:
    entry:
      id: cal.1962-09-25.cuba-2
      when: Sept. 25
      date: '1962-09-25'
      thread: cuba
      c: 'The residence, four o''clock. Robert Kennedy, McCone and Kaysen, for Bundy, on the missile bases the Soviet technicians are building in Cuba, photographed by U-2s the week before: still only surface-to-air missiles. Kennedy authorizes another U-2 flight over Cuba the next day. McCone doubts Khrushchev will keep his word that only defensive missiles are being sent. Robert Kennedy stays twenty minutes alone with the President.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 296–97 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Robert Kennedy, McCone, Kaysen, Kennedy, Khrushchev. Check: the day or the person: the calendar has McCone on his honeymoon, dissenting from the estimate by cable on Sept. 19 (cal.1962-09-19.missile-crisis), and before the Foreign Intelligence Advisory Board on Sept. 28 (cal.1962-09-28.missile-crisis); the authors have him at the White House on Sept. 25.'
      tags: ['name:kennedy-robert-f', 'name:mccone-john-a', 'name:kaysen-carl', 'name:kennedy-john-f', 'name:khrushchev-nikita-s', 'polity:cuba', 'polity:ussr']
- add:
    entry:
      id: cal.1962-09-25.cuba-3
      when: Sept. 25
      date: '1962-09-25'
      thread: cuba
      c: The Cabinet Room, five o'clock, an hour. Kennedy with McNamara, Lemnitzer, Ball, Harriman, William Bundy and Forrestal on Cuba.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 297 (the authors'' account of Tuesday, Sept. 25, 1962 (291–301)). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, McNamara, Lemnitzer, Ball, Harriman, Forrestal. Check: the calendar has Taylor reporting to Kennedy on Vietnam at 5 p.m. (cal.1962-09-25.vietnam).'
      tags: ['name:kennedy-john-f', 'name:mcnamara-robert-s', 'name:lemnitzer-lyman-l', 'name:ball-george-w', 'name:harriman-w-averell', 'name:forrestal-michael-v', 'polity:cuba']
- add:
    entry:
      id: cal.1962-10.elections-1962-2
      when: Oct.
      date: 1962-10
      thread: elections-1962
      c: 'The White House, the Oval Room upstairs, an evening, with Johnson and O''Donnell, on whether Kennedy should speak in Chicago for Yates against Dirksen. Johnson to Kennedy: a disaster for the administration if Dirksen loses and Kuchel becomes the Republican leader. O''Donnell: "I wouldn''t mind dealing with Tommy Kuchel every day in the week if I could knock off the Republican minority leader in the Senate in this election." Kennedy: "Well, Kenny, this is one time when Lyndon is right and you''re wrong. But I''ve got a commitment to go to Chicago and help Yates, and I''ve got to stick to my commitment."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 356–57 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Johnson, Kennedy, O''Donnell, Yates, Dirksen, Kuchel. Check: the day (the book: "a week or so before the Cuban missile crisis arose," after the commitment to Daley was given).'
      tags: ['name:johnson-lyndon-b', 'name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:yates-sidney-r', 'name:dirksen-everett', 'name:kuchel-thomas-h']
- add:
    entry:
      id: cal.1962-10-16.missile-crisis-5
      when: Oct. 16
      date: '1962-10-16'
      thread: missile-crisis
      c: 'The White House, Tuesday morning, at O''Donnell''s desk. Kennedy: "You still think that fuss about Cuba is unimportant?" O''Donnell: "Absolutely. The voters won''t give a damn about Cuba." In his office Kennedy shows him enlarged U-2 prints, a magnifying glass over one: "It''s the beginning of a launching site for a medium-range ballistic missile." "We''ve just elected Capehart in Indiana, and Ken Keating will probably be the next President of the United States. Rearrange the schedule so we can have a meeting on this in the Cabinet Room at eleven-forty-five, and not a word to anybody about what it''s all about." He is to keep all the day''s other appointments so that nothing seems unusual.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 351–52 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Capehart, Keating.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:capehart-homer-e', 'name:keating-kenneth-b', 'polity:cuba']
- add:
    entry:
      id: cal.1962-10-19.missile-crisis-8
      when: Oct. 19
      date: '1962-10-19'
      thread: missile-crisis
      c: 'The White House, Friday morning, before the flight to Cleveland and Chicago. Kennedy to Robert Kennedy: "If you have any trouble, call me and I''ll call off the trip and come back and talk to them." O''Donnell: what if he cannot get a consensus? Kennedy: "I''ll make my own decision anyway. I''m the one who has the responsibility, so we''ll do what I want to do." He tells of Lincoln''s Cabinet: all aye, Lincoln no, "the no''s had it." To O''Donnell: "You''ll probably have to cut the trip short. I''ll make that speech in Chicago for Sid Yates and Dick Daley that you''re worrying about, but I don''t know about Wisconsin and the Seattle Fair."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 362 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Robert Kennedy, O''Donnell, Yates, Daley.'
      tags: ['name:kennedy-john-f', 'name:kennedy-robert-f', 'name:odonnell-kenneth-p', 'name:yates-sidney-r', 'name:daley-richard-j', 'polity:cuba']
- add:
    entry:
      id: cal.1962-10-19.missile-crisis-warnings
      when: Oct. 19
      date: '1962-10-19'
      thread: missile-crisis-warnings
      c: 'Chicago, the Sheraton-Blackstone, evening. Salinger tells Kennedy that Robert Allen and Paul Scott are to run a column on an invasion of Cuba and that Carleton Kent of the Chicago Sun-Times asks about a parachute unit alerted for a jump on Cuba. Kennedy: "Call Kent and tell him that report is all wrong. We have no plan to invade Cuba." He has O''Donnell call McNamara to ask Allen and Scott not to print the column; O''Donnell does.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 363 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Salinger, Kennedy, O''Donnell, McNamara.'
      tags: ['name:salinger-pierre', 'name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:mcnamara-robert-s', 'polity:cuba', 'city:chicago']
- add:
    entry:
      id: cal.1962-10-19.missile-crisis-warnings-2
      when: Oct. 19
      date: '1962-10-19'
      thread: missile-crisis-warnings
      c: 'Chicago, the Sheraton-Blackstone, while Kennedy is at the Yates dinner at McCormick Place. Salinger presses O''Donnell to let him in on what is happening. O''Donnell: "All I can tell you now is that the President may have to develop a cold tomorrow. If he does, we''ll have to cancel the rest of the trip and go back to Washington." O''Donnell has arranged with Dick O''Hare in Washington to cancel the rest of the trip on five minutes'' notice.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 363–64 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Salinger, Kennedy.'
      tags: ['name:odonnell-kenneth-p', 'name:salinger-pierre', 'name:kennedy-john-f', 'polity:cuba', 'city:chicago']
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-7
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis
      c: The White House, Saturday afternoon. Kennedy telephones Jackie at Glen Ora, where she is with Caroline and John for the weekend, and asks her to come back with the children that evening so that he and his family can be together if there is a sudden emergency.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 367 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy.'
      tags: ['name:kennedy-john-f', 'polity:cuba']
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-8
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis
      c: 'The White House, the weekend. Commander Shepard, the naval aide, gives O''Donnell and Powers pink identification cards: they are to be in the group that would go with the President and Mrs. Kennedy to an underground shelter outside the city. Shepard shows O''Donnell the list, Rusk, McNamara and Sorensen among those he remembers. The families of officials are to drive their own cars to a place near Quantico, with eighteen minutes'' warning. Mrs. O''Donnell: "While you''re safe with the President under a rock somewhere, what am I supposed to do with your five children?"'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 367–68 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Powers, Rusk, McNamara, Sorensen.'
      tags: ['name:odonnell-kenneth-p', 'name:powers-david-f', 'name:rusk-dean', 'name:mcnamara-robert-s', 'name:sorensen-theodore-c']
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-warnings
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis-warnings
      c: 'Washington, Jim Rowe''s house, Saturday night. Stevenson, asking O''Donnell what Kennedy thought of his part at the ExComm that afternoon, is told the President admired his courage in bringing up an opposing view. Stevenson: "I know that most of those fellows will probably consider me a coward for the rest of my life for what I said today. But perhaps we need a coward in the room when we are talking about a nuclear war."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 369–70 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Stevenson, O''Donnell, Kennedy, Rowe.'
      tags: ['name:stevenson-adlai-e', 'name:odonnell-kenneth-p', 'name:kennedy-john-f', 'name:rowe-james-h-jr']
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-33
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: 'The White House, after the congressional leaders have left his office. Kennedy to O''Donnell and others: "Oh, sure, we support you, Mister President. But it''s your decision, not ours, and if it goes wrong, we''ll knock your block off."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 372–73 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'polity:cuba']
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-quarantine
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-quarantine
      c: 'The White House, Tuesday evening, the Navy''s procedure for stopping a Soviet ship. McNamara suggests crippling it by shooting out its propellers and rudder and towing it to Charleston or Jacksonville. Kennedy: "And what happens after you shoot up the ship and tow it all the way to Florida, and then find out that it wasn''t carrying anything except baby food?" Reports of at least twenty-five Soviet ships and some submarines on their way to Cuba.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 374–75 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: McNamara, Kennedy.'
      tags: ['name:mcnamara-robert-s', 'name:kennedy-john-f', 'polity:cuba', 'polity:ussr']
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-quarantine-2
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-quarantine
      c: 'The White House, after the meeting, in Kennedy''s office with Robert Kennedy, Sorensen and O''Donnell, on the rash actions that start wars. Kennedy, who had lately read Tuchman''s The Guns of August, quotes the German Chancellor asked how the war began: "Ah, if we only knew." "I wish we could send a copy of that book to every Navy officer on every Navy ship right now. But they probably wouldn''t read it."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 375 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Robert Kennedy, Sorensen, O''Donnell.'
      tags: ['name:kennedy-john-f', 'name:kennedy-robert-f', 'name:sorensen-theodore-c', 'name:odonnell-kenneth-p', 'polity:cuba']
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-diplomacy-2
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis-diplomacy
      c: 'The White House, Friday, outside O''Donnell''s office. Rusk has brought John Scali of ABC, with the proposal Fomin made him: the removal of the missiles and a pledge of no more offensive weapons in Cuba for a pledge not to invade. Salinger, finding them there, shouts at Scali, "What the hell are you doing here?"; Rusk: "It''s all right, Pierre. I brought him here." Kennedy hears the proposal and tells Scali to take back that it is acceptable as a basis for a settlement. "But don''t use my name. ... Give them the impression that you talked to me, but don''t say so. Tell them you''ve gotten a favorable response from the highest authority in the government."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 379–80 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1962-10-26.missile-crisis-2]]. Names: Rusk, Scali, Salinger, Kennedy, O''Donnell.'
      tags: ['name:rusk-dean', 'name:scali-john-a', 'name:salinger-pierre', 'name:kennedy-john-f', 'name:odonnell-kenneth-p', 'polity:ussr', 'polity:cuba']
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-excomm-3
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis-excomm
      c: 'The White House, Saturday, the Rose Garden, after the word that Major Anderson''s U-2 had been shot down. Kennedy walks out to restrain his irritation; O''Donnell follows. By O''Donnell, Kennedy is "not so much upset by Khrushchev''s change in attitude as exasperated because the Jupiter missiles were still in Turkey." Kennedy: "Just to set the record straight, will you find out when was the last time I asked to have those damned missiles taken out of Turkey? Not the first five times I asked for their removal, just the date of the last time." O''Donnell has Bromley Smith check the file: the order was in August.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 382 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Khrushchev, O''Donnell.'
      tags: ['name:kennedy-john-f', 'name:khrushchev-nikita-s', 'name:odonnell-kenneth-p', 'polity:ussr', 'polity:cuba', 'polity:turkey']
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-excomm-4
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis-excomm
      c: 'Washington, the Sans Souci, lunch, after the morning ExComm meeting at which Kennedy asked McNamara to sound out NATO on trading the Jupiters. O''Donnell to Robert Kennedy: "Your brother will be making a terrible mistake if he pulls those missiles out of Turkey right now. Everybody in Western Europe will turn against us. And there''s no need of it." Robert Kennedy: "You''re right. Let''s eat up quickly, and get back there and talk to him."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 384 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Robert Kennedy, Kennedy, McNamara.'
      tags: ['name:odonnell-kenneth-p', 'name:kennedy-robert-f', 'name:kennedy-john-f', 'name:mcnamara-robert-s', 'polity:cuba', 'polity:turkey']
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-excomm-5
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis-excomm
      c: 'The White House, the mansion, lunch, after Kennedy''s swim. Robert Kennedy and O''Donnell tell him their talk at the Sans Souci against taking the missiles out of Turkey. Kennedy: "Relax. You fellows ought to know me better than that. I have no intention of taking those missiles out of Turkey. The only reason I asked McNamara to talk to the NATO people about it was because I was wondering what they would say."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 384 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Robert Kennedy, O''Donnell, Kennedy, McNamara.'
      tags: ['name:kennedy-robert-f', 'name:odonnell-kenneth-p', 'name:kennedy-john-f', 'name:mcnamara-robert-s', 'polity:cuba', 'polity:turkey']
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-settlement-3
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis-settlement
      c: 'The White House, Sunday, the ExComm after mass. When someone proposes that Kennedy appear on television to announce victory: "There will be none of that. I want no crowing and not a word of gloating from anybody in this government."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 387–88 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Khrushchev.'
      tags: ['name:kennedy-john-f', 'name:khrushchev-nikita-s', 'polity:ussr', 'polity:cuba']
- add:
    entry:
      id: cal.1963-10-04.elections-1964-2
      when: Oct. 4
      date: '1963-10-04'
      thread: elections-1964
      c: The White House. Connally, whom Kennedy had been pressing for months to stage a fund-raising event in Texas, comes with plans for a hundred-dollar-a-plate dinner in Austin on a Friday night, after a midday visit to Dallas. Johnson is furious that Connally did not invite him to the meeting.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 10–11 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Connally, Kennedy, Johnson.'
      tags: ['name:connally-john', 'name:kennedy-john-f', 'name:johnson-lyndon-b', 'state:tx']
- add:
    entry:
      id: cal.1963-11-14.white-house
      when: Nov. 14
      date: '1963-11-14'
      thread: white-house
      c: New York, Thursday evening. Kennedy declines the police escort for the ride in from the airport through the heavy rush-hour traffic, so as not to cause a tie-up. At Madison Avenue and Seventy-second Street a photographer pushes his camera against the limousine window and fires a flashbulb, a scare to the Secret Service agents. By the authors, the police and the Secret Service were "annoyed" at his disregard of security.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 19, 441 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy. Check: the airport (Idlewild at 19, LaGuardia, "twelve miles," at 441).'
      tags: ['name:kennedy-john-f', 'city:nyc']
- add:
    entry:
      id: cal.1963-11-19.white-house
      when: Nov. 19
      date: '1963-11-19'
      thread: white-house
      c: The White House, Tuesday. O'Donnell refuses to let Salinger give out the street routes of the motorcades on the Texas tour, on the Secret Service's advice after the crowd's treatment of Stevenson in Dallas on Oct. 24; the White House correspondents are giving Salinger a hard time.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 442 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Salinger, Stevenson.'
      tags: ['name:odonnell-kenneth-p', 'name:salinger-pierre', 'name:stevenson-adlai-e', 'state:tx']
- add:
    entry:
      id: cal.1963-11-19.defense
      when: Nov. 19
      date: '1963-11-19'
      thread: defense
      c: 'The White House, Tuesday. Kennedy meets Rusk, who leaves the next day for Hawaii and Japan: in Hawaii he is to meet Lodge, back from Saigon for talks with the President on Vietnam; he and several other Cabinet members will go on to Tokyo for a joint meeting with the Japanese cabinet on economic problems. Kennedy and Rusk talk of paving the way for Kennedy''s own visit to Japan in his trip to the Far East early in 1964.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 442 (O''Donnell''s and Powers''s account). Names: Kennedy, Rusk, Lodge.'
      tags: ['name:kennedy-john-f', 'name:rusk-dean', 'name:lodge-henry-cabot', 'polity:japan', 'polity:rvn']
- add:
    entry:
      id: cal.1963-11-19.white-house-2
      when: Nov. 19
      date: '1963-11-19'
      thread: white-house
      c: 'The White House, after Rusk''s visit. Kennedy tells O''Donnell that he and Jackie are thinking of leaving on the trip to Japan, the Philippines, India and Pakistan just after New Year''s Day: "Right after we get back from Texas, you go out there to advance the trip. ... You''ll be gone during December." O''Donnell: if he were away before Christmas, "Helen would divorce me." Powers: "not a woman in Massachusetts would vote for you in 1964." Kennedy: "Oh, all right, put off the advance trip until sometime in January. But listen, are you sure I''ll be leaving Texas in time to have lunch here with Cabot Lodge on Sunday?"'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 442–43 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Powers, Lodge.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:powers-david-f', 'name:lodge-henry-cabot', 'polity:rvn']
- add:
    entry:
      id: cal.1963-11-20.robert-kennedy-2
      when: Nov. 20
      date: '1963-11-20'
      thread: robert-kennedy
      c: 'Robert Kennedy''s house, his birthday party, the night before Kennedy leaves for Texas. Ann Brinkley, David Brinkley''s wife, urges O''Donnell to keep the President away from Dallas. Robert Kennedy asks O''Donnell if he has seen the letter he sent him from Byron Skelton, the Texas national committeeman, asking them to stay away from Dallas: "the anti-Kennedy feeling there seemed dangerous." O''Donnell tells Kennedy of neither.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 19 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Robert Kennedy, Kennedy. Check: the place (the calendar has the party at the Department of Justice, cal.1963-11-20.robert-kennedy; the authors have it at Robert Kennedy''s house, "Dave and I attended"); and "David''s wife" is the authors'' (Ann Brinkley).'
      tags: ['name:odonnell-kenneth-p', 'name:kennedy-robert-f', 'name:kennedy-john-f', 'state:tx']
- add:
    entry:
      id: cal.1963-11-21.white-house
      when: Nov. 21
      date: '1963-11-21'
      thread: white-house
      c: 'Air Force One, leaving Washington for Texas. Kennedy to O''Donnell: "I feel great. My back feels better than it''s felt in years." He tucks into the edge of the mirror in his dressing room a card with three 1960 figures to needle the Texas Democrats: the Kennedy-Johnson margin over Nixon-Lodge in Texas, 46,233 votes; Johnson''s plurality, running alone for the Senate against Tower, 379,972; Daniel''s for governor, 1,024,792. Kennedy had asked Powers for them the day before, swimming in the White House pool.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 2–3 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Powers, Johnson, Tower, Daniel.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:powers-david-f', 'name:johnson-lyndon-b', 'name:tower-john-g', 'state:tx', 'name:daniel-price']
- add:
    entry:
      id: cal.1963-11-21.democratic-party-6
      when: Nov. 21
      date: '1963-11-21'
      thread: democratic-party
      c: 'Air Force One. Yarborough boards in a rage: Connally has not invited him to the reception for the President and Jackie at the governor''s mansion before Friday night''s dinner; he has sold $11,300 of tickets and has no place at the head table, his wife not invited. At San Antonio he refuses to ride in Johnson''s car.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 21 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Yarborough, Connally, Johnson. Check: where Yarborough boarded (the page says only that he boarded Air Force One in a rage), and the day; "Connally had not invited him" and the head table are as the authors give them.'
      tags: ['name:yarborough-ralph', 'name:connally-john', 'name:johnson-lyndon-b', 'state:tx']
- add:
    entry:
      id: cal.1963-11-22.democratic-party-2
      when: Nov. 22
      date: '1963-11-22'
      thread: democratic-party
      c: 'Fort Worth, the Hotel Texas, the morning, after Kennedy sees the black-bordered advertisement in the Dallas News. Kennedy telephones O''Donnell: "Tell him if he doesn''t ride with Lyndon today, he''ll have to walk." O''Donnell and O''Brien are talking to Yarborough and "not getting anywhere": he argues that his refusal to appear with Johnson would not affect Kennedy''s popularity in Texas.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 24 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, O''Brien, Yarborough, Johnson.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:obrien-lawrence-f', 'name:yarborough-ralph', 'name:johnson-lyndon-b', 'state:tx', 'city:fort-worth']
- add:
    entry:
      id: cal.1963-11-22.democratic-party-3
      when: Nov. 22
      date: '1963-11-22'
      thread: democratic-party
      c: Fort Worth, the Hotel Texas, a hallway, before the Chamber of Commerce breakfast. Kennedy meets Yarborough, backs him against the wall and tells him sharply to cut it out.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 24 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Yarborough.'
      tags: ['name:kennedy-john-f', 'name:yarborough-ralph', 'state:tx', 'city:fort-worth']
- add:
    entry:
      id: cal.1963-11-22.democratic-party-4
      when: Nov. 22
      date: '1963-11-22'
      thread: democratic-party
      c: Fort Worth, the Hotel Texas, the President's suite, about an hour before the flight to Dallas. Kennedy telephones John Nance Garner at Uvalde; Johnson had reminded him that it was Garner's ninety-fifth birthday.
      n: '[[w.odonnell-johnny-we-hardly-knew]], 26 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Johnson.'
      tags: ['name:kennedy-john-f', 'name:johnson-lyndon-b', 'state:tx']
- add:
    entry:
      id: cal.1963-11-22.democratic-party-5
      when: Nov. 22
      date: '1963-11-22'
      thread: democratic-party
      c: 'Fort Worth, the Hotel Texas, the President''s suite. O''Brien telephones: Yarborough has agreed to ride with the Johnsons in the Dallas motorcade. Kennedy: "Good. Now we''ve got to get Connally to invite Yarborough to the reception at the governor''s mansion." O''Donnell: they will keep Yarborough and Connally apart on the plane.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 26 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Brien, Kennedy, Yarborough, Connally, O''Donnell, Johnson.'
      tags: ['name:obrien-lawrence-f', 'name:kennedy-john-f', 'name:yarborough-ralph', 'name:connally-john', 'name:odonnell-kenneth-p', 'name:johnson-lyndon-b', 'state:tx']
- add:
    entry:
      id: cal.1963-11-22.white-house
      when: Nov. 22
      date: '1963-11-22'
      thread: white-house
      c: 'Fort Worth, the Hotel Texas, the President''s suite. Kellerman, the Secret Service agent in charge, tells O''Donnell that two of his agents in Dallas want to know whether to put the clear plastic bubble top on the President''s car; the newspapers predict rain, the agents think the weather will clear. O''Donnell: "If it''s not raining, have the bubble top off."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 26 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell.'
      tags: ['name:odonnell-kenneth-p', 'state:tx']
- add:
    entry:
      id: cal.1963-11-22.democratic-party-6
      when: Nov. 22
      date: '1963-11-22'
      thread: democratic-party
      c: 'Air Force One, Fort Worth to Dallas, about thirteen minutes. Kennedy beckons to Albert Thomas from his cabin: "Give Kenny a hand with Connally." Thomas and O''Donnell press Connally, who says it was his wife who did not want Yarborough at the reception: "She said she wouldn''t let that man in her house." In the President''s cabin Connally agrees within three minutes to invite Yarborough to the reception and give him the head table at the dinner. "How can anybody say no to that man?" Kennedy to O''Donnell, landing: "This trip is turning out to be terrific."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 26–27 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Thomas, O''Donnell, Connally, Yarborough.'
      tags: ['name:kennedy-john-f', 'name:thomas-albert', 'name:odonnell-kenneth-p', 'name:connally-john', 'name:yarborough-ralph', 'state:tx']
- add:
    entry:
      id: cal.1963-11-22.succession-24
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Parkland Hospital, a corridor near the trauma room, after the President is dead. Dr. Earl Rose, the Dallas County medical examiner, says the body cannot be moved without an autopsy; the sheriff''s office and the homicide bureau agree. Judge Theron Ward, brought from a town fourteen miles away, will not sign a waiver; another judge: "As far as I''m concerned, it''s just another homicide case." O''Donnell to the examiner and the police: "Get the hell out of the way. We''re leaving." O''Donnell, Powers, O''Brien, McHugh, Clifton and the Secret Service push the casket past Rose and the police to the hearse for Love Field.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 35–37 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Powers, O''Brien.'
      tags: ['name:odonnell-kenneth-p', 'name:powers-david-f', 'name:obrien-lawrence-f', 'state:tx', 'city:dallas']
- add:
    entry:
      id: cal.1963-11-22.succession-25
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One, Love Field, before the oath. O''Donnell asks Johnson if they can take off. Johnson: "We can''t leave here until I take the oath of office. I just talked on the phone with Bobby. He told me to wait here until Sarah Hughes gives me the oath. You must remember Sarah Hughes, my old friend, the Federal judge here in Dallas. She''s on her way out here now." O''Donnell, by his account, had not known Johnson was aboard.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 37–38 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Johnson, Robert Kennedy. Check: Robert Kennedy''s version, given to O''Donnell that night, is that Johnson telephoned and said "a lot of people down here had advised him to be sworn in right away" and asked whether he had objections (38; cal.1963-11-22.robert-kennedy).'
      tags: ['name:odonnell-kenneth-p', 'name:johnson-lyndon-b', 'name:kennedy-robert-f', 'name:hughes-sarah-t', 'state:tx', 'city:dallas']
- add:
    entry:
      id: cal.1963-11-22.succession-26
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One, in flight. Johnson comes back once to the rear compartment, where O''Donnell and O''Brien are with Mrs. Kennedy and the casket, and tells them he wants them to stay on with him at the White House: "I need you now more than President Kennedy needed you." By the authors, he said the same thing in the same words to everybody on the staff in the next few days.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 41 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Johnson, O''Donnell, O''Brien, Kennedy.'
      tags: ['name:johnson-lyndon-b', 'name:odonnell-kenneth-p', 'name:obrien-lawrence-f', 'name:kennedy-john-f', 'state:tx']
- add:
    entry:
      id: cal.1963-11-22.succession-27
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One, in flight. Moyers comes back to O''Donnell and O''Brien with word that Johnson wants them to come up and join him in talking about arranging a congressional leadership meeting. O''Donnell: they do not want to leave Jackie. Moyers: "We understand perfectly." Johnson sits with Cliff Carter and Moyers in the President''s office and lounge, across a narrow passage.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 41 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Moyers, O''Donnell, O''Brien, Johnson.'
      tags: ['name:moyers-bill', 'name:odonnell-kenneth-p', 'name:obrien-lawrence-f', 'name:johnson-lyndon-b', 'state:tx']
- add:
    entry:
      id: cal.1960-09-26.elections-1960-debates-2
      when: Sept. 26
      date: '1960-09-26'
      thread: elections-1960-debates
      c: 'Chicago, the WBBM studio, after the first debate. Nixon draws Kennedy aside and talks to him quietly for several minutes. Kennedy to O''Donnell: "Just the usual small talk. I wasn''t listening to him. But ... he was watching the photographers out of the corner of his eye. When one of them was taking a picture of us, he would put a stern expression on his face and start jabbing his finger into my chest, so he would look as if he was laying down the law to me about foreign policy or Communism. Nice fellow."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 240 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Nixon, Kennedy, O''Donnell.'
      tags: ['name:nixon-richard-m', 'name:kennedy-john-f', 'name:odonnell-kenneth-p', 'city:chicago']
- add:
    entry:
      id: cal.1960-11.elections-1960-kennedy-3
      when: Nov.
      date: 1960-11
      thread: elections-1960-kennedy
      c: 'The last week, after Los Angeles on Tuesday and the San Francisco Bay area on Wednesday. Kennedy to O''Donnell, to have the weekend''s schedule changed: "I''ll be wasting my time in New York. I''ve got New York and I''ve got Connecticut. But I haven''t got California. Give me those two days in California and I''ll win there." O''Donnell: too late, the Friday night parade of the Democratic ward clubs in Chicago cannot be broken, and New York and Connecticut are fixed. Kennedy: "You and your damned schedule. If we lose California, it will be your thick-headed fault."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 245–46 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell. Check: the day (the book has it after the Wednesday in San Francisco, in the last week).'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'state:ca']
- add:
    entry:
      id: cal.1960-11-07.elections-1960-kennedy-5
      when: Nov. 7
      date: '1960-11-07'
      thread: elections-1960-kennedy
      c: 'Boston, the Statler Hilton, the last night of the campaign. Kennedy, with a chicken sandwich and a glass of milk, to O''Donnell and Powers: "Well, it''s all over. I wish I had spent forty-eight hours more in California."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 249 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Powers.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:powers-david-f', 'state:ca', 'city:boston']
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-14
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      c: 'Hyannis Port, Robert Kennedy''s house, the night. Kennedy draws O''Donnell aside and asks if he had expected to carry Ohio without trouble; O''Donnell had thought it as safe as Massachusetts. Kennedy: "That''s what I thought, too. Now a lot of guys around here are telling me that they knew we were in trouble in Ohio. If they felt that way, how come they never mentioned it until an hour ago?"'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 252 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'state:oh']
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-15
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      c: 'Hyannis Port, Robert Kennedy''s house, the night, as the farm states go Republican. Kennedy to O''Donnell: "If that''s what they want, I ought to give it to them--I ought to keep Benson in as Secretary of Agriculture for another four years."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 252 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Benson, O''Donnell.'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:benson-ezra-taft']
- add:
    entry:
      id: cal.1960-12.transition-and-staff-cabinet-11
      when: Dec.
      date: 1960-12
      thread: transition-and-staff-cabinet
      c: Rayburn, in O'Donnell's presence, recommends John Connally for Secretary of the Navy. Kennedy "readily agreed," as did McNamara. By the authors, Johnson "had nothing to do with" it, "contrary to everybody's assumption at the time."
      n: '[[w.odonnell-johnny-we-hardly-knew]], 269 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Rayburn, Connally, O''Donnell, Kennedy, McNamara, Johnson. Check: the day (the book gives none).'
      tags: ['name:rayburn-sam', 'name:connally-john', 'name:odonnell-kenneth-p', 'name:kennedy-john-f', 'name:mcnamara-robert-s', 'name:johnson-lyndon-b']
- add:
    entry:
      id: cal.1962-12.cuba-6
      when: Dec.
      date: 1962-12
      thread: cuba
      c: 'Palm Beach, the Christmas holidays, by telephone. The leaders of the Cuban brigade have asked Kennedy to review their troops at the Orange Bowl on Dec. 29. O''Donnell: "Don''t go there. After what you''ve been through with Castro, you can''t make an appearance in the Orange Bowl and pay a tribute to those rebels. It will look as though you''re planning to back them in another invasion of Cuba." Kennedy: "You''re absolutely right. I shouldn''t do it." Rusk and Bundy also advise against it; Robert Kennedy tells him to go.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 312–13 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Kennedy, Rusk, Bundy, Robert Kennedy, Castro. Check: the day (the book gives none before the 29th).'
      tags: ['name:odonnell-kenneth-p', 'name:kennedy-john-f', 'name:rusk-dean', 'name:bundy-mcgeorge', 'name:kennedy-robert-f', 'name:castro-fidel', 'polity:cuba']
- add:
    entry:
      id: cal.1963-01-14.white-house
      when: Jan. 14
      date: '1963-01-14'
      thread: white-house
      c: 'The White House pool, after the State of the Union message. Kennedy to Powers, swimming: "Things are not as bad as they might be. As I told them on the Hill, I only have to worry about Berlin, Cuba, Vietnam, Laos and NATO. This is still the best White House I ever worked in."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 399 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Powers.'
      tags: ['name:kennedy-john-f', 'name:powers-david-f']
- add:
    entry:
      id: cal.1962-12.europe-and-the-alliance-3
      when: Dec.
      date: 1962-12
      thread: europe-and-the-alliance
      c: 'Nassau, the night the pact is agreed, over a drink before dinner. Kennedy describes it to O''Donnell and Powers. O''Donnell: "A multinational ship? ... You''re going to have a NATO crew with people talking French, Italian, German, Greek and Flemish?" Kennedy: "Who cares? ... Macmillan is as happy as a clam. He''s going home to England with a nuclear missile ship. Maybe there''ll never be such a ship and maybe nothing really happened here today, but that''s beside the point. The point is that we got Macmillan off the hook."'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 396–97 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Powers, Macmillan. Check: the day (the conference at Nassau, Dec. 19–21; the book has "that night, after the pact was agreed to").'
      tags: ['name:kennedy-john-f', 'name:odonnell-kenneth-p', 'name:powers-david-f', 'name:macmillan-harold', 'polity:uk']
- cite: {id: cal.1960-01.elections-1960, item: '[[w.odonnell-johnny-we-hardly-knew]], 167–71 (the pledge: "a week later, to the great surprise of everyone in Washington, the newspaper headlines announced" DiSalle''s pledge of "all of Ohio''s delegate votes", the sixty-four at 167; the secret meeting at the Pittsburgh airport, Robert Kennedy and Bailey pressing him; Kennedy''s call to O''Donnell on New Year''s Day, "You''re going to Wisconsin"; not Morse)', units: '?'}
- cite: {id: cal.1960-04-05.elections-1960-kennedy, item: '[[w.odonnell-johnny-we-hardly-knew]], 179–80 (Eunice Kennedy: "What does it all mean, Johnny?"; the reply as the page gives it: "we''ve got to go to West Virginia in the morning and do it all over again," then Maryland, Indiana and Oregon, "and win all of them"; the hotel room at Milwaukee)', units: 'A, B'}
- cite: {id: cal.1960-04-08.elections-1960-2, item: '[[w.odonnell-johnny-we-hardly-knew]], 180–81 (the meeting of McDonough''s key workers at the Kanawha Hotel; a man stands: "There''s only one problem. He''s a Catholic. That''s our God-damned problem!"; Harris''s poll of four months before, seventy to thirty; Robert Kennedy''s question, as the page has it, "what are our problems?")', units: 'A, C'}
- check: {id: cal.1960-04-08.elections-1960-2, text: 'Check: the day: [[w.odonnell-johnny-we-hardly-knew]], 180, has the party fly from Milwaukee to Charleston "the next morning" after the Wisconsin primary (Apr. 6) and go "directly" from the airport to the Kanawha Hotel meeting; the minutes are of Apr. 8.'}
- variant: {id: cal.1960-04.elections-1960-10, unit: B, witness: w.odonnell-johnny-we-hardly-knew, reads: 'O''Donnell: he called Jack Conway, Walter Reuther''s man, and described the meeting at the Kanawha Hotel; Conway called Reuther, who urged Humphrey to withdraw; Orville Freeman and Alex Rose and others also called; Meany is not named; Humphrey: he "could not appear to be a paid tool of the Kennedys"', at: '182'}
- cite: {id: cal.1960-05.elections-1960-13, item: '[[w.odonnell-johnny-we-hardly-knew]], 191 (Kennedy came to the studio with a government food-ration package; Humphrey: "This guy thinks of everything"; the debate "inconclusive"; the day not given)', units: E}
- cite: {id: cal.1960-05-09.elections-1960-2, item: '[[w.odonnell-johnny-we-hardly-knew]], 190–91 (the telethon on "the day before the voting"; calls not screened, an old woman: "You git out of West Virginia, Mr. Humphrey!"; a party-line call cut off by the operator for an emergency call; not the $750)', units: '?'}
- cite: {id: cal.1960-05-10.elections-1960-primaries, item: '[[w.odonnell-johnny-we-hardly-knew]], 192–93 (Kennedy flew to Washington that morning; the returns at nine; he and Jackie at a movie in Georgetown with Tony and Ben Bradlee, home about 11:30; see Variant)', units: A}
- variant: {id: cal.1960-05-10.elections-1960-primaries, unit: B, witness: w.odonnell-johnny-we-hardly-knew, reads: a movie "in Georgetown" with Tony and Ben Bradlee, at: '193'}
- variant: {id: cal.1960-05-10.elections-1960-primaries, unit: C, witness: w.odonnell-johnny-we-hardly-knew, reads: 'Robert Kennedy and the others "were unable to reach Jack on the telephone"; he and Jackie came home around 11:30 and found a note from his maid on the banister, to call Bobby', at: '193'}
- cite: {id: cal.1960-05-10.elections-1960-4, item: '[[w.odonnell-johnny-we-hardly-knew]], 193 (Humphrey''s "gracious telegram message of concession"; Robert Kennedy left headquarters, "walked alone through the rain to Hubert''s hotel to put his arm around him and console him"; not the room, Muriel Humphrey or Rauh)', units: '?'}
- cite: {id: cal.1960-05.elections-1960, item: '[[w.odonnell-johnny-we-hardly-knew]], 201 (Kennedy''s call at Libertyville on the flight home from Oregon; back on the Caroline: "The same old double-talk. ... He''s got to be playing Lyndon"; Stevenson had promised, Kennedy had told O''Donnell, to endorse and nominate him if he won all his primaries; not the words to Stevenson)', units: A}
- cite: {id: cal.1960-07-02.elections-1960-2, item: '[[w.odonnell-johnny-we-hardly-knew]], 201 (the televised press conference of July 2: Kennedy "too young" and "not quite ready," the convention "prearranged"; Symington, Johnson, Meyner and Bowles preferred, Stevenson "pointedly" excluded)', units: A}
- cite: {id: cal.1960-07-04.elections-1960, item: '[[w.odonnell-johnny-we-hardly-knew]], 201–02 (Kennedy asked for equal time and replied on the Fourth: Truman''s open convention one that "studies all the candidates, reviews their records, and then takes his advice"; fourteen years in the House and the Senate more experience than any twentieth-century President had when elected; at forty-three older than Washington, Jefferson and Columbus; not the entry''s quotations)', units: '?'}
- cite: {id: cal.1960-07-11.elections-1960-2, item: '[[w.odonnell-johnny-we-hardly-knew]], 213–14 (on the Monday, Graham with Alsop at the Biltmore; Kennedy agreed "so quickly and casually" that, by the authors, Graham took it for "a fast brush-off"; not Graham''s words)', units: '?'}
- check: {id: cal.1960-07-12.elections-1960-10, text: 'Check: the day: [[w.odonnell-johnny-we-hardly-knew]], 214, has Kennedy, on Monday (July 11), asking Alsop in the same sentence about "a party Alsop was giving that night at Perino''s."'}
- cite: {id: cal.1960-07-13.elections-1960-los-angeles, item: '[[w.odonnell-johnny-we-hardly-knew]], 209–12 (out the back and over the fence to the Marion Davies house, a swim, Rayburn nominating Johnson and Freeman nominating Kennedy on television, dinner with his parents and Ann Gargan; back to the apartment, a tally sheet; the roll call; see Variant)', units: A}
- variant: {id: cal.1960-07-13.elections-1960-los-angeles, unit: B, witness: w.odonnell-johnny-we-hardly-knew, reads: 'dinner at the Davies house of "beef stew, hot rolls, salad and milk" with the Ambassador, Mrs. Kennedy and Ann Gargan; the address is "522 North Rossmore Avenue"', at: '205, 210'}
- variant: {id: cal.1960-07-13.elections-1960-los-angeles, unit: D, witness: w.odonnell-johnny-we-hardly-knew, reads: 'at Wyoming, with 750 of the 761 votes, Kennedy, seeing Teddy "crouching in the middle of the Wyoming delegation with a wide grin," said: "This may be it."', at: 211–12}
- cite: {id: cal.1960-07-14.elections-1960, item: '[[w.odonnell-johnny-we-hardly-knew]], 220–22 (after Graham''s call, Robert Kennedy to Johnson''s suite, where Rayburn and Connally were: "Do you think he might be interested in being chairman of the national committee?" Rayburn: "Shit!"; Graham to Kennedy, "Bobby''s down here telling Rayburn and Lyndon that there''s opposition"; Johnson: "If the candidate will have me, I''ll join with him in making a fight for it"; the nomination by acclamation, McCormack''s motion, 223; not the hours or the galleries)', units: B}
- cite: {id: cal.1960-07-14.elections-1960-los-angeles-9, item: '[[w.odonnell-johnny-we-hardly-knew]], 217–18 (Kennedy''s remarks to O''Donnell in the bathroom of the Biltmore suite, after the offer and before Johnson''s answer)', units: 'A, B, C, D, E, F'}
- cite: {id: cal.1960-07-14.elections-1960-los-angeles-2, item: '[[w.odonnell-johnny-we-hardly-knew]], 214–15 (Kennedy''s own message after two o''clock, typed and taken by Abe Lincoln, for ten that morning; Lady Bird Johnson, on the telephone in the morning, arranged the ten o''clock; not the caller, Shriver or Wofford)', units: '?'}
- cite: {id: cal.1960-09-27.elections-1960, item: '[[w.odonnell-johnny-we-hardly-knew]], 237–38 (Lausche refused to appear with Kennedy at the Cleveland steer roast the day before the debate; at 7:30 the next morning, at the Paynesville, Ohio, motel, Bruno: "Senator Frank Lausche ... wants to join our party" and travel with Kennedy and DiSalle; Kallina, 124 n.19, cites 211–12, which in this copy is the roll call at Los Angeles)', units: 'A, B'}
- cite: {id: cal.1960-11-08.elections-1960-chicago, item: '[[w.odonnell-johnny-we-hardly-knew]], 252 (Daley''s call to O''Donnell after three in the morning: "We''re trying to hold back our returns. Every time we announce two hundred more votes for Kennedy in Chicago, they come up out of nowhere downstate with another three hundred votes for Nixon")', units: 'A, C'}
- cite: {id: cal.1960-11-14.transition-and-staff, item: '[[w.odonnell-johnny-we-hardly-knew]], 258 (the helicopter to Key Biscayne on Monday, at the suggestion of Herbert Hoover and the Ambassador; "Nixon did most of the talking"; Kennedy on the way: "Maybe I''ll ask him how he won in Ohio"; not the agency, China or the post abroad)', units: A}
- variant: {id: cal.1960-11-14.transition-and-staff, unit: B, witness: w.odonnell-johnny-we-hardly-knew, reads: 'O''Donnell: "I sat with him while he and Nixon talked"; Nixon "did most of the talking while Kennedy studied him quietly"', at: '258'}
- variant: {id: cal.1960-11-16.transition-and-staff, unit: A, witness: w.odonnell-johnny-we-hardly-knew, reads: 'the deer hunt on Nov. 17: the party flew to Texas "the next day" after Ribicoff''s Tuesday visit (Wednesday, Nov. 16), the Johnsons woke them at five the next morning, and "that day, November 17, was the Johnsons'' twenty-sixth wedding anniversary"; Kennedy shot his on the second or third shot, O''Donnell his on the first', at: 259–62}
- cite: {id: cal.1960-11-18.cuba, item: '[[w.odonnell-johnny-we-hardly-knew]], 276 (Dulles told Kennedy "for the first time back in November" of the training in Guatemala, "the day after we came back from the LBJ Ranch")', units: '?'}
- cite: {id: cal.1960-12-08.transition-and-staff-cabinet, item: '[[w.odonnell-johnny-we-hardly-knew]], 267–68 (Shriver had gone to Dearborn to sound McNamara on the Treasury; McNamara agreed "as a matter of courtesy" to talk to Kennedy the next day; the first meeting at the N Street house "one evening in December"; McNamara asked whether Kennedy wrote Profiles in Courage without a ghost; not the day or Kennedy''s words)', units: '?'}
- cite: {id: cal.1960-12-10.transition-and-staff-cabinet, item: '[[w.odonnell-johnny-we-hardly-knew]], 270 (the Washington Post''s front-page headline of Rusk''s appointment before Kennedy''s announcement; Salinger found that Kennedy had told Graham "last night" and had not told him not to use it; not Palm Beach or Stevenson)', units: '?'}
- cite: {id: cal.1960-12.transition-and-staff-nsc-2, item: '[[w.odonnell-johnny-we-hardly-knew]], 266, 274 (after a long talk with Bundy at the Carlyle, Kennedy told O''Donnell he was seriously considering him for Secretary of State and decided he was too young at forty-one; he then wanted him Under Secretary, but Rusk preferred Bowles; Bundy agreed to be the President''s national security assistant; the page has the Carlyle talk at the Secretary of State level, not the under secretaryship)', units: '?'}
- cite: {id: cal.1960-12-15.transition-and-staff-2, item: '[[w.odonnell-johnny-we-hardly-knew]], 273–74 (the Sunday before, Pavlick waited outside the Ambassador''s house with seven sticks of dynamite to ram Kennedy''s car on the way to mass at St. Edward''s; Jackie and Caroline at the door, he "postponed it until the following Sunday"; a tip from his New Hampshire hometown; his letter: "the Kennedys bought the Presidency and the Whitehouse")', units: '?'}
- cite: {id: cal.1960-12-16.robert-kennedy, item: '[[w.odonnell-johnny-we-hardly-knew]], 273 (the announcement of Robert Kennedy as Attorney General "along with that of Douglas Dillon as Secretary of the Treasury" on the front steps at N Street; Goldberg, named Labor "the day before," with Robert; "Bobby, ... would you mind combing your hair?"; not White)', units: '?'}
- cite: {id: cal.1960-12-27.congress, item: '[[w.odonnell-johnny-we-hardly-knew]], 275 (Kennedy arranged from Palm Beach with Furcolo to have Ben Smith, a Harvard roommate and mayor of Gloucester, appointed to the Senate seat for the two years remaining)', units: '?'}
- cite: {id: cal.1961-01-09.transition-and-staff, item: '[[w.odonnell-johnny-we-hardly-knew]], 274–75 (the Massachusetts legislature, the Harvard Overseers; at Schlesinger''s house in Cambridge with Bundy and Wiesner; Schlesinger signed that day, "We''ll keep your appointment quiet until after the Senate confirms Chester Bowles"; not Chayes, Seaborg or the tax task force)', units: '?'}
- cite: {id: cal.1961-01-19.laos, item: '[[w.odonnell-johnny-we-hardly-knew]], 275–76 (the morning briefing at the White House with Eisenhower and the outgoing secretaries; Cuba, Berlin, Africa, the balance of payments and Laos in the Cabinet Room; Eisenhower "urged him to keep on supporting this plan to overthrow Castro" and talked mostly of Laos, American combat troops possibly alone there; not the two alone; the date printed "January 19, 1960" is an error for 1961)', units: '?'}
- cite: {id: cal.1961-01-20.civil-rights-the-executive, item: '[[w.odonnell-johnny-we-hardly-knew]], 280 (at the parade, the Coast Guard Academy cadets: Kennedy "noticed that there was not one black face in their ranks"; "one of his first official acts as President was to issue an order to correct that situation"; not Goodwin)', units: '?'}
- cite: {id: cal.1961-01-21.democratic-party, item: '[[w.odonnell-johnny-we-hardly-knew]], 283 (Daley, after Truman, with his wife and six children, posed with the President, "the only favor asked for by the mayor of Chicago"; not "strictly social")', units: '?'}
- cite: {id: cal.1961-06-04.press-and-broadcasting, item: '[[w.odonnell-johnny-we-hardly-knew]], 337 (O''Donnell: Reston wanted to see Kennedy before the airport; Kennedy: "I''d like to get across to the people at home the seriousness of the situation ... I''ll give Scotty a grim picture. But actually, as De Gaulle says, Khrushchev is bluffing and he''ll never sign that treaty"; Reston''s story called him "shaken" and "angry"; the page has the talk upstairs in his room, not the blinds or the hour)', units: '?'}
- cite: {id: cal.1961-07-24.berlin-and-vienna, item: '[[w.odonnell-johnny-we-hardly-knew]], 315–16, 343 (the Cabinet meeting in the Berlin crisis at which Robert Kennedy, with Ribicoff and Goldberg, proposed raising income taxes; Kennedy to O''Donnell: "I won''t mention it now to Bobby"; Mills''s call to O''Donnell, Heller''s meeting a few days later; "Kennedy quietly dismissed Bobby''s Spartan belt-tightening proposal of an income tax raise" while preparing the July 25 speech; the day not given)', units: '?'}
- cite: {id: cal.1961-10-06.berlin-and-vienna, item: '[[w.odonnell-johnny-we-hardly-knew]], 345–46 (a Friday evening in October: Gromyko in the Oval Room of the residence for more than two hours; West Berlin as an international zone, Kennedy: "You''re offering us an apple for an orchard"; Krylov''s fable of the swan, the pike and the crab, a copy for Gromyko and one for Khrushchev; the troika)', units: '?'}
- cite: {id: cal.1962-10-18.missile-crisis, item: '[[w.odonnell-johnny-we-hardly-knew]], 361–62 (Gromyko in the Oval Office on Thursday afternoon; Kennedy, by his own account that night, read him his Sept. 4 warning and "dying to confront him with our evidence" did not: "It was incredible to sit there and watch the lies coming out of his mouth")', units: '?'}
- cite: {id: cal.1962-10-19.missile-crisis-5, item: '[[w.odonnell-johnny-we-hardly-knew]], 361 (after the Thursday ExComm meeting at which LeMay urged an air strike, Kennedy to O''Donnell: "These brass hats have one great advantage in their favor. If we listen to them, and do what they want us to do, none of us will be alive later to tell them that they were wrong")', units: '?'}
- check: {id: cal.1962-10-19.missile-crisis-5, text: 'Check: the day: [[w.odonnell-johnny-we-hardly-knew]], 361, has the remark to O''Donnell after the Thursday (Oct. 18) ExComm meeting, where Kennedy had asked LeMay how the Russians would respond; the words, "tell them that they were wrong."'}
- cite: {id: cal.1962-10-20.missile-crisis, item: '[[w.odonnell-johnny-we-hardly-knew]], 364–65 (Kennedy, Admiral Burkley at his bedside: "I have a temperature and a cold. Tell the press I am returning to Washington on the advice of Doctor Burkley"; his note for Salinger, "Slight upper respiratory ... Weather raw & rainy. Recommended return to Washington. Cancelled schedule"; Johnson, in Hawaii, also returned with "a cold"; 365: that afternoon in the Oval Room the President "announced and discussed his decision to put the blockade into effect during the following week")', units: '?'}
- cite: {id: cal.1962-10-20.missile-crisis-excomm-3, item: '[[w.odonnell-johnny-we-hardly-knew]], 366–67 (after the ExComm meeting in the Oval Room, the President on the Truman Balcony with Robert Kennedy and O''Donnell; Robert Kennedy: Stevenson is "not strong enough or tough enough to be representing us at the UN at a time like this ... somebody like John McCloy"; the President: "I think Adlai showed plenty of strength and courage ... I admire him for saying what he said"; the Jupiters, "the damned things")', units: '?'}
- cite: {id: cal.1962-10-20.missile-crisis-diplomacy, item: '[[w.odonnell-johnny-we-hardly-knew]], 366 (the President to O''Donnell and Robert Kennedy on the Truman Balcony: "I think Adlai showed plenty of strength and courage ... I admire him for saying what he said"; Robert Kennedy''s proposal, "put somebody like John McCloy in his place")', units: '?'}
- cite: {id: cal.1962-10-20.missile-crisis-3, item: '[[w.odonnell-johnny-we-hardly-knew]], 370 (at the Rowe party Stevenson told O''Donnell that Friendly of the Post and Reston of the Times had heard of the crisis; O''Donnell telephoned the White House from Rowe''s bedroom, Kennedy: "This White House is like a sieve ... I''ll call them myself, right now"; both papers agreed to hold the story until Monday night)', units: '?'}
- check: {id: cal.1962-10-21.press-and-broadcasting, text: 'Check: the day: [[w.odonnell-johnny-we-hardly-knew]], 370, has Kennedy''s calls to the Post and the Times on Saturday night (Oct. 20), after O''Donnell''s call from the Rowe party, not Sunday night.'}
- cite: {id: cal.1962-10-22.missile-crisis-4, item: '[[w.odonnell-johnny-we-hardly-knew]], 370–72 (Hale Boggs brought from the Gulf by helicopter and jet; Kennedy to Dirksen: "tonight you''re going to get reelected"; McCone on the photographs, Rusk and McNamara on the blockade; Russell demanded a military attack, Fulbright backed him; Kennedy: "Last Tuesday, I was for an air strike or an invasion myself")', units: '?'}
- cite: {id: cal.1962-10-24.missile-crisis, item: '[[w.odonnell-johnny-we-hardly-knew]], 375–77 (the Cabinet Room, the blockade in force at ten; two Russian ships and a submarine near the line; McCone with a note, "some of the Russian ships are stopping"; twenty ships stopped; Rusk: "We''re eyeball to eyeball, and I think the other fellow just blinked")', units: 'A, B'}
- cite: {id: cal.1962-10-24.missile-crisis-8, item: '[[w.odonnell-johnny-we-hardly-knew]], 378 (that night McNamara and Gilpatric at the Navy''s Flag Plot, to see that the President''s orders were observed: one American vessel watching a Soviet submarine; Anderson told him "the Navy needed no advice on how to manage a blockade"; not the words quoted)', units: '?'}
- cite: {id: cal.1962-10-27.missile-crisis-excomm, item: '[[w.odonnell-johnny-we-hardly-knew]], 385–87 (the reply to Khrushchev''s first letter handwritten by Robert Kennedy, reworked and signed by Kennedy; Robert Kennedy''s report on Dobrynin at the Department of Justice; Kennedy to Powers: "God, Dave, the way you''re eating up all that chicken and drinking up all my wine, anybody would think it was your last meal"; the nine o''clock ExComm "pessimistic"; Roman Holiday)', units: '?'}
- cite: {id: cal.1963-06-05.elections-1964, item: '[[w.odonnell-johnny-we-hardly-knew]], 405, 440 (at El Paso Kennedy needled Johnson and Connally on campaign money: "Do you two think we''re ever going to have a fund-raising affair in Texas?"; Johnson passed it to Connally, who agreed to a hundred-dollar-a-plate dinner at Austin a week before Thanksgiving, the President to stop at San Antonio, Houston, Fort Worth and Dallas on the way)', units: '?'}
- cite: {id: cal.1963-10-02.vietnam, item: '[[w.odonnell-johnny-we-hardly-knew]], 17 (Kennedy asked McNamara to announce the withdrawal of a thousand soldiers and to say that all American forces would probably be out by the end of 1965: "And tell them that means all of the helicopter pilots, too"; McNamara "softened" it to the major part of the task being "completed by the end of 1965")', units: '?'}
- cite: {id: cal.1963-10-07.testing, item: '[[w.odonnell-johnny-we-hardly-knew]], 433 (the ratification signed in the Treaty Room; sixteen pens handed out to Rusk, Harriman, McCloy and the Senators who had supported it, then a seventeenth, with which he drew a line under his signature: "This one is mine")', units: '?'}
- check: {id: cal.1963-11-12.elections-1964, text: 'Check: the day: [[w.odonnell-johnny-we-hardly-knew]], 439, has the first discussion of the 1964 campaign, "a three-hour meeting" at the White House, on Nov. 13 (cal.1963-11-13.democratic-party); Schlesinger''s note cites 386–87 for it, which in this copy is Oct. 27–28.'}
- cite: {id: cal.1963-11-13.democratic-party, item: '[[w.odonnell-johnny-we-hardly-knew]], 439–40 ("at the White House on November 13 we had a three-hour meeting to discuss plans for the 1964 campaign"; Bailey and Steve Smith to organize it, Maguire treasurer, "the campaign will be run right from here"; Scammon on the Census; Florida and Texas; money from Texas; a keynote speech; "the first and only staff meeting"; Johnson not mentioned; not the theme or Atlantic City)', units: '?'}
- cite: {id: cal.1963-11-21.assassination, item: '[[w.odonnell-johnny-we-hardly-knew]], 21–23 (San Antonio, about 125,000 along the route to Brooks Air Force Base, the speech and the oxygen chamber; Houston, the Rice Hotel, the League of United Latin American Citizens, Jackie''s speech in Spanish, Kennedy asking a guest how she sounded: "The man said you were wonderful"; the Thomas dinner at the Coliseum; then Fort Worth, near midnight; Yarborough''s refusal to ride with Johnson at San Antonio and Houston, 21, 24)', units: '?'}
- cite: {id: cal.1963-11-22.succession-18, item: '[[w.odonnell-johnny-we-hardly-knew]], 33–34 (Johnson in the room at Parkland with Secret Service agents, Youngblood and Emory Roberts; "Don''t you think it might be safer if we moved the plane to Carswell?"; O''Donnell: "Get the police to seal off Love Field, and go there right now. And take off for Washington as soon as you get there"; Johnson: "You take good care of that fine lady"; not Thornberry, Brooks or Kilduff)', units: '?'}
- cite: {id: cal.1963-11-22.robert-kennedy, item: '[[w.odonnell-johnny-we-hardly-knew]], 38 (Robert Kennedy''s account to O''Donnell that night: Johnson telephoned at Hickory Hill to express his sympathy, said "a lot of people down here had advised him to be sworn in right away," and asked if he had any objections; "I was too surprised to say anything ... what''s the rush?"; he then "switched him over to Nick Katzenbach"; Johnson''s version to O''Donnell in Dallas, that Robert had told him to wait for Judge Hughes, is the other)', units: '?'}
- variant: {id: cal.1963-11-22.robert-kennedy, unit: E, witness: w.odonnell-johnny-we-hardly-knew, reads: 'Robert Kennedy, too confused and upset to talk to Johnson about who should swear him in, "switched him over to Nick Katzenbach, who was also perplexed by the whole thing"; Katzenbach is not said to have been asked and called back', at: '38'}
- cite: {id: cal.1960-10-01.elections-1960, item: '[[w.odonnell-johnny-we-hardly-knew]], 243–44 (the planning meeting at the compound on "that first Saturday in October" for the last month; the plan agreed again at "our October first meeting": Kennedy in the Midwest and the Northeast, the South left to Johnson, two days in California; Eisenhower, when he came in, to be met with courtesy and Nixon pictured as calling for his help; Kennedy apprehensive of Eisenhower''s help; the authors name O''Donnell and Powers present, not the others)', units: '?'}
- cite: {id: cal.1960-08-20.elections-1960, item: '[[w.odonnell-johnny-we-hardly-knew]], 227 (Kennedy "faced Truman calmly but politely in their private meeting at the library at Independence, and not much was said on either side"; to the reporters Truman: "When the Democratic convention decided to nominate him, that''s when I decided"; Ribicoff sent in early August to arrange the meeting)', units: '?'}
- cite: {id: cal.1960-08.elections-1960-8, item: '[[w.odonnell-johnny-we-hardly-knew]], 227–28 (the Sunday visit to Mrs. Roosevelt''s cottage, Powers with him; she made no demand for Stevenson and told him to choose his Cabinet "without making any preelection promises"; a granddaughter killed in a fall from a horse the day before, the visit kept)', units: '?'}
- cite: {id: cal.1962-12-26.vietnam, item: '[[w.odonnell-johnny-we-hardly-knew]], 15 (Mansfield, back from Southeast Asia at the President''s request, to Kennedy at Palm Beach: curb the reinforcements and withdraw; Kennedy to O''Donnell afterward: "I got angry with Mike for disagreeing with our policy so completely, and I got angry with myself because I found myself agreeing with him"; the day not given)', units: '?'}
- cite: {id: cal.1962-12-29.cuba, item: '[[w.odonnell-johnny-we-hardly-knew]], 312–13 (the Orange Bowl; Jackie''s speech in Spanish; the flag: "this flag will be returned to this brigade in a free Havana"; Kennedy came away "in a much happier frame of mind"; the advice to stay away from O''Donnell, Rusk and Bundy, and Robert Kennedy''s to go)', units: '?'}
- cite: {id: cal.1963-05-02.defense, item: '[[w.odonnell-johnny-we-hardly-knew]], 404 (the "memorable outdoor reception for 234 winners" of the Medal of Honor, the first time a President had invited so many; "one uninvited visitor, standing alone on the edge of the crowd" watching, Robert Kennedy, who "had heard that his brother was entertaining the medal winners" and could not resist sneaking in; not whose idea the reception was)', units: D}
- variant: {id: cal.1963-05-02.defense, unit: A, witness: w.odonnell-johnny-we-hardly-knew, reads: '"234 winners of the Congressional Medal of Honor"; "older ones from the two world wars and a few elderly men who were cited for heroism in the Spanish-American War"', at: '404'}
