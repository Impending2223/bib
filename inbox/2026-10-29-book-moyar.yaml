      c: 'Lodge to Rusk, a letter he types himself, for the President only: Lansdale to be sent at once to take charge, under
        Lodge, "of all U.S. relationships with a change of government here," and of the CIA station in place of John Richardson.'
      n: '[FRUS 1961–63, IV, doc. 104](https://history.state.gov/historicaldocuments/frus1961-63v04/d104). [[w.moyar-triumph-forsaken]],
        251 (the request; McCone''s refusal; Lodge to Rusk, Sept. 24: "the coup might have been pulled off"). See [[cal.1963-09-10.vietnam]].
        Names: Lodge, Rusk, Lansdale, Richardson.'
