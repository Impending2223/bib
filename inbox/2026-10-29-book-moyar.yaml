        - 'via w.moyar-triumph-forsaken 164 n.50: A-B'
      tags:
      - name:kennedy-john-f
      - name:ngo-dinh-diem
      - name:nolting-frederick-e-jr
- add:
    entry:
      id: cal.1963-06-12.vietnam
      when: June 12
      date: '1963-06-12'
      thread: vietnam
      c: 'Trueheart hands Diệm an unsigned "Memorandum" on State''s instructions of June 11 (cable 1207): the Buddhists''
        demands to be met fully, publicly and dramatically; unless they are within a few days, the United States will say
        publicly it cannot associate itself with the government''s course. Diệm reads it in silence. Thuần: any American statement
        now "disastrous" for the talks with the Buddhists.'
      n: '[FRUS 1961–63, III, doc. 169](https://history.state.gov/historicaldocuments/frus1961-63v03/d169) (Trueheart, June
        12, 8 p.m.); [doc. 167](https://history.state.gov/historicaldocuments/frus1961-63v03/d167) (the instructions). [[w.moyar-triumph-forsaken]],
        221 (the demand, with Harriman''s and Hilsman''s leave; the President not told). See [[cal.1963-05-08.vietnam]]. Names:
        Trueheart, Diệm, Nguyễn Đình Thuần.'
      src:
        c: e4ad5d1d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d169: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d167: A'
        - 'w.moyar-triumph-forsaken 221: A'
      tags:
      - name:trueheart-william-c
      - name:ngo-dinh-diem
      - name:nguyen-dinh-thuan
      - place:saigon
