- add:
    entry:
      id: cal.1962-07-09.vietnam
      when: July 9
      date: '1962-07-09'
      thread: vietnam
      also:
      - laos
      c: 'Kennedy to Diệm, by cable to Nolting, on Diệm''s concern over the Laos agreements: American policy toward Vietnam
        "must and will continue as it has since my administration took office. We have helped and shall continue to help your
        country to defend itself." For Laos, a neutral government; the only alternative "an international battleground."'
      n: '[FRUS 1961–63, II, doc. 238](https://history.state.gov/historicaldocuments/frus1961-63v02/d238). [[w.moyar-triumph-forsaken]],
        163–64 (Diệm''s refusal to sign; the letter at Harriman''s urging; Nolting''s counsel; the foreign minister signs).
        See [[cal.1962-07-23.laos]]. Names: Kennedy, Diệm, Nolting.'
      src:
        c: a5aaeee7
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v02/d238: all'
