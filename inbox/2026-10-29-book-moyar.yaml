      when: Sept. 11
      date: '1963-09-11'
      thread: vietnam
      c: 'Lodge to Rusk, eyes only: the situation "worsening rapidly"; the time come "to use what effective sanctions it has
        to bring about the fall of the existing government and the installation of another"; the suspension of aid to be studied
        by "the best brains in the government."'
      n: '[FRUS 1961–63, IV, doc. 86](https://history.state.gov/historicaldocuments/frus1961-63v04/d86) (telegram 478). [[w.moyar-triumph-forsaken]],
        250. See [[cal.1963-09-10.vietnam]]. Names: Lodge, Rusk.'
