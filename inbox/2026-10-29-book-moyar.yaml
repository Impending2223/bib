      date: '1963-10-02'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: 'Richard Starnes in the *Washington Daily News*, for Scripps-Howard: the CIA''s part in South Vietnam "a dismal chronicle
        of bureaucratic arrogance, obstinate disregard of orders, and unrestrained thirst for power"; twice it refused Lodge''s
        instructions. Richardson named as the station''s chief.'
      n: '[[w.moyar-triumph-forsaken]], 251–52 (the column; Reston to McCone that the attacks were planted, "probably a good
        deal of it from Harriman"; Halberstam''s article of Oct. 4; Richardson''s recall). To check: *Washington Daily News*,
        Oct. 2, 1963 (cited by [[w.moyar-triumph-forsaken]], 252 n.38). See [[cal.1963-09-13.vietnam-2]]. Names: Lodge, Richardson.
        Check: the column''s words, here as Moyar quotes them.'
