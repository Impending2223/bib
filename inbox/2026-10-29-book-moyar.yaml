      when: Oct. 28
      date: '1963-10-28'
      thread: vietnam-congress
      c: 'Zablocki to Krulak, sent by Taylor, on his subcommittee''s study mission: all its members came home agreed that
        Diệm, "with all his faults," is durable and has been winning; "no visible substitute"; joining with plotters, as in
        August, harmful; the resident press "arrogant, emotional, unobjective and ill-informed." Doubts of the import suspension;
        intensified operations against the North essential.'
      n: '[FRUS 1961–63, IV, doc. 222](https://history.state.gov/historicaldocuments/frus1961-63v04/d222) (Krulak''s memorandum
        for the record). [[w.moyar-triumph-forsaken]], 262. To check: "Report of the Special Study Mission to Southeast Asia
        (October 3–19, 1963)," H.R. Rep. No. 893, 88th Cong., 1st Sess. (Nov. 7, 1963) (cited by [[w.moyar-triumph-forsaken]],
        262 n.78). Names: Zablocki, Krulak, Taylor, Diệm.'
