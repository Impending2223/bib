- add:
    entry:
      id: cal.1960-05-03.vietnam
      when: May 3
      date: '1960-05-03'
      thread: vietnam
      c: 'Durbrow to State: Saigon, Nhu most likely behind it, backed a Thai plan for a raid by a hundred "Free Khmers" into
        Cambodia and flew them French arms. Persuasion having failed, he asks leave to tell Diệm the extra equipment discussed
        with Thuần will not be sent until Saigon settles with Cambodia; the MAAG chief and the USOM director concur.'
      n: '[FRUS 1958–60, I, doc. 150](https://history.state.gov/historicaldocuments/frus1958-60v01/d150) (Durbrow, telegram
        3095). [[w.moyar-triumph-forsaken]], 106 (the raid; Durbrow''s proposal to deny the equipment; Lansdale''s rejoinder,
        May 4). To check: Wood, memorandum of conversation, May 5, 1960, RG 59, C0092, reel 1, National Archives (cited by
        [[w.moyar-triumph-forsaken]], 106 n.52); [FRUS 1958–60, I, doc. 153](https://history.state.gov/historicaldocuments/frus1958-60v01/d153)
        (Lansdale''s notes on the telegram, May 4; cited by [[w.moyar-triumph-forsaken]], 106 n.53). See [[cal.1960-04-26.vietnam]].
        Names: Durbrow, Nhu, Diệm, Nguyễn Đình Thuần.'
      src:
        c: da10c492
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v01/d150: all'
        - 'w.moyar-triumph-forsaken 106: A-B'
        - 'via w.moyar-triumph-forsaken 106 n.52a: A-B'
        - 'via w.moyar-triumph-forsaken 106 n.52b: B'
      tags:
      - name:durbrow-elbridge
      - name:ngo-dinh-nhu
      - name:ngo-dinh-diem
      - name:nguyen-dinh-thuan
      - place:saigon
- add:
    entry:
      id: cal.1960-05-09.vietnam
      when: May 9
      date: '1960-05-09'
      thread: vietnam
      c: 'The 444th NSC. Amory, for the CIA: Diệm facing more insurgency in the countryside, his "one-man rule" criticized
        at all levels, a manifesto of former officials just out. Merchant hopes Rhee''s fall in Korea "would give Diem pause."
        Eisenhower: Diệm "calm and quiet," with "an attractive personality unlike Rhee"; the United States "ought to do everything
        possible to prevent the deterioration"; State, Defense and the CIA to consult, and a letter from him to Diệm to be
        considered.'
      n: '[FRUS 1958–60, I, doc. 156](https://history.state.gov/historicaldocuments/frus1958-60v01/d156) (Boggs''s memorandum
        of discussion). [[w.moyar-triumph-forsaken]], 106–07. See [[cal.1960-04-26.vietnam]]. Names: Amory, Merchant, Eisenhower,
        Diệm. Check: Moyar, 107, has Eisenhower, heeding Lansdale and Diệm''s other backers, forbid any threat of cutting
        Diệm''s aid; the memorandum of the meeting does not record it.'
      src:
        c: 8aba7c0e
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v01/d156: all'
        - 'w.moyar-triumph-forsaken 106–07: A-C'
        - 'via w.moyar-triumph-forsaken 107 n.55: A-C'
      tags:
      - name:amory-robert-jr
      - name:merchant-livingston-t
      - name:eisenhower-dwight-d
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1961-06-14.vietnam
      when: June 14
      date: '1961-06-14'
      thread: vietnam
      c: 'The White House, 10:15 a.m. Kennedy with Nguyễn Đình Thuần, who hands him a letter from Diệm: the armed forces to
        270,000, about $175 million for their first equipment over two and a half years, some $20 million a year more after.
        Thuần: about 2,800 men through the infiltrators'' reception centers on Route 9 in four months.'
      n: '[FRUS 1961–63, I, doc. 69](https://history.state.gov/historicaldocuments/frus1961-63v01/d69) (Wood''s memorandum
        of conversation); [doc. 68](https://history.state.gov/historicaldocuments/frus1961-63v01/d68) (Thuần''s visit, June
        12–17). [[w.moyar-triumph-forsaken]], 133 (the letter, of June 9, and its request). To check: Diệm to Kennedy, June
        9, 1961, NSF, box 193, John F. Kennedy Library (cited by [[w.moyar-triumph-forsaken]], 133 n.45). See [[cal.1961-05-11.vietnam]].
        Names: Kennedy, Nguyễn Đình Thuần, Diệm.'
      src:
        c: 50fa9477
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d69: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d68: A'
        - 'w.moyar-triumph-forsaken 133: B'
        - 'via w.moyar-triumph-forsaken 133 n.45: B'
      tags:
      - name:kennedy-john-f
      - name:nguyen-dinh-thuan
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1962-01-03.vietnam
      when: Jan. 3
      date: '1962-01-03'
      thread: vietnam
      also:
      - defense
      c: 'Palm Beach. Kennedy with the Joint Chiefs, Johnson, McNamara, Taylor, Harkins and Gilpatric. Harkins approved to
        command in Vietnam, without publicity for now. The President: no further military involvement; the numbers of American
        military personnel to be played down, their role "advice, training and support" and not combat. Defoliation to begin
        as a small experiment along one road.'
      n: '[FRUS 1961–63, II, doc. 2](https://history.state.gov/historicaldocuments/frus1961-63v02/d2) (Gilpatric''s memorandum
        for the record, drafted Jan. 9). [[w.moyar-triumph-forsaken]], 148 (the meeting; the numbers to be played down). To
        check: [FRUS 1961–63, II, doc. 3](https://history.state.gov/historicaldocuments/frus1961-63v02/d3) (Gilpatric to Lemnitzer,
        Jan. 4: a cover story or public explanation for the reports; cited by [[w.moyar-triumph-forsaken]], 148 n.2). See
        [[cal.1961-11-22.vietnam]]. Names: Kennedy, Johnson, McNamara, Taylor, Harkins, Gilpatric.'
      src:
        c: ecc6c033
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v02/d2: all'
        - 'w.moyar-triumph-forsaken 148: A, C'
        - 'via w.moyar-triumph-forsaken 148 n.1: A, C'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:harkins-paul-d
      - name:gilpatric-roswell-l
- add:
    entry:
      id: cal.1962-02-13.republican-party
      when: Feb. 13
      date: '1962-02-13'
      thread: republican-party
      also:
      - vietnam
      c: 'The Republican National Committee''s publication: Kennedy "less than candid" with the American people on how deeply
        the United States is involved in Vietnam. By the *New York Times*''s report, it asks whether 4,000 Americans are there,
        not the 685 the administration admits.'
      n: 'The charge as put to Kennedy the next day: The President''s News Conference of February 14, 1962, [1962 Pub. Papers
        134](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=194) (Feb. 14, 1962), question
        9. [[w.moyar-triumph-forsaken]], 145 n.85, 443 (the charge; the 4,000 and the 685). To check: *New York Times*, Feb.
        14, 1962 (cited by [[w.moyar-triumph-forsaken]], 145 n.85). Reply: [[cal.1962-02-14.vietnam]]. Check: the publication''s
        title and day.'
      src:
        c: f4735269
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=194: A'
        - 'w.moyar-triumph-forsaken 145, 443: A-B'
        - 'via w.moyar-triumph-forsaken 145 n.85: A-B'
- add:
    entry:
      id: cal.1962-02-21.vietnam
      when: Feb. 21
      date: '1962-02-21'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'State, Defense and USIA to Saigon, cable 1006, on the press: "maximum feasible cooperation, guidance and appeal
        to good faith of correspondents"; the Ambassador to decide when newsmen go on missions. "This is not a US war"; no
        stories of Americans leading combat; no numbers of Americans or details of matériel.'
      n: '[FRUS 1961–63, II, doc. 75](https://history.state.gov/historicaldocuments/frus1961-63v02/d75). [[w.moyar-triumph-forsaken]],
        149 (the directive, at Kennedy''s order by Moyar''s account; reporters kept off helicopter missions after it). To
        check: [[w.salinger-with-kennedy]]. See [[cal.1962-01-03.vietnam]]. Check: Moyar, 149, quotes the cable against "frivolous,
        thoughtless criticism" of the Saigon government; read the whole text.'
      src:
        c: e8b7d390
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v02/d75: all'
        - 'w.moyar-triumph-forsaken 149: A'
