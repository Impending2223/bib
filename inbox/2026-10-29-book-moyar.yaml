      date: '1963-10-25'
      thread: vietnam
      c: 'Lodge to Bundy: the CIA station "punctilious" in carrying out his orders; he has approved each Đôn–Conein meeting;
        no substitute for Conein, Đôn''s friend of eighteen years. A coup not to be thwarted: "it seems at least an even bet
        that the next government would not bungle and stumble as much as the present one has."'
