      when: June 14
      date: '1963-06-14'
      thread: vietnam
      c: 'Kennedy learns from his intelligence checklist of the memorandum given Diệm June 12: he "wants to be absolutely
        sure that no further threats are made and no formal statement is made without his own personal approval."'
      n: 'The White House''s memorandum for the record of June 14, quoted in [FRUS 1961–63, III, doc. 169](https://history.state.gov/historicaldocuments/frus1961-63v03/d169),
        n. 5. [[w.moyar-triumph-forsaken]], 221. See [[cal.1963-06-12.vietnam]]. Names: Kennedy, Diệm. Check: the memorandum
        itself (Kennedy Library, NSF, Clifton Series, President''s Intelligence Checklist).'
      src:
        c: 762118f2
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d169: all'
        - 'w.moyar-triumph-forsaken 221: A'
        - 'via w.moyar-triumph-forsaken 221 n.70: A'
