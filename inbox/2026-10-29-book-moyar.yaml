- add:
    entry:
      id: cal.1963-06-14.vietnam-2
      when: June 14
      date: '1963-06-14'
      thread: vietnam
      c: 'State to Trueheart, cable 1219, drafted by Wood and cleared by Hilsman and Harriman: word to reach Vice President
        Nguyễn Ngọc Thơ that, should Diệm be unable to act, the United States would back him as constitutional successor,
        with military support; contacts with those outside the government to be increased if those with possible leaders of
        a coup are too few. Received in Saigon June 16.'
      n: '[FRUS 1961–63, III, doc. 175](https://history.state.gov/historicaldocuments/frus1961-63v03/d175). [[w.moyar-triumph-forsaken]],
        222 (the instructions; Trueheart holding off after the communiqué of June 16). To check: [FRUS 1961–63, III, doc.
        180](https://history.state.gov/historicaldocuments/frus1961-63v03/d180) (Trueheart, June 19; cited by [[w.moyar-triumph-forsaken]],
        222 n.72). See [[cal.1963-06-12.vietnam]]. Names: Wood, Hilsman, Harriman, Nguyễn Ngọc Thơ, Diệm, Trueheart.'
      src:
        c: 3328d747
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d175: all'
        - 'w.moyar-triumph-forsaken 222: A'
