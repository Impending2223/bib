      id: cal.1963-09-09.vietnam-saigon
      when: Sept. 9
      date: '1963-09-09'
      thread: vietnam-saigon
      c: 'Lodge with Diệm, an hour and fifty minutes: the UN, the Senate, American opinion; without a change of policy, Lodge
        says, the suspension of aid "a very real possibility." His first advice: Nhu to go away, "not returning at least until
        end of December—after the appropriations had been voted." Diệm: out of the question; Nhu "very unjustly accused,"
        not the organizer of the raids of Aug. 20.'
      n: '[FRUS 1961–63, IV, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v04/d77) (Lodge, Sept. 9, 11
        p.m.). [[w.moyar-triumph-forsaken]], 249–50. See [[cal.1963-09-02.vietnam-saigon]]. Names: Lodge, Diệm, Nhu.'
