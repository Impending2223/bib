      when: Sept. 13
      date: '1963-09-13'
      thread: vietnam
      c: 'McCone''s summary of a cable from the CIA in Saigon: the USOM director against cutting aid; the MAAG''s chief sees
        no lessening of discipline or morale from the divisions down; Lodge and Trueheart convinced the war cannot be won
        with the regime, Lodge "considering initiating coup through General Don."'
      n: '[FRUS 1961–63, IV, doc. 105](https://history.state.gov/historicaldocuments/frus1961-63v04/d105). [[w.moyar-triumph-forsaken]],
        250 (McCone, Sept. 13, tells Kennedy Lodge is weighing a coup with Đôn; State''s caution of Sept. 15). To check: State
        to Saigon, Sept. 15, 1963, DDRS, CK3100164618 (cited by [[w.moyar-triumph-forsaken]], 250 n.27). See [[cal.1963-09-10.vietnam]].
        Names: McCone, Lodge, Trueheart, Trần Văn Đôn. Check: whether McCone gave the summary to Kennedy.'
