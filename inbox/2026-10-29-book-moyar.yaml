      date: '1963-10-24'
      thread: vietnam
      c: 'Bundy to Lodge and Harkins: "certain aspects" of the Đôn–Conein contacts "give us considerable concern": Đôn''s
        reference to a Presidential directive and to a scheduled meeting with Lodge, "for which there was no basis"; nothing
        on his backing or capabilities; perhaps an attempt by Nhu at entrapment. Lodge and Harkins to "stand back from any
        non-essential involvement."'
