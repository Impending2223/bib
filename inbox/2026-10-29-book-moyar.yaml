        206 (the eighteen, the Caravelle, the letter''s complaints; not the day); [[w.gibbons-u-s-government-and]], I, 339–40
        (the eighteen, the Caravelle, the manifesto''s complaints and demands; not the names, the day or the release). Miller,
        206, dates the letter Apr. 19, the day of doc. 142, which reports a draft to be handed Diệm at a meeting set for Apr.
        25; FRUS''s editors date the statement Apr. 26, after the meeting at the Caravelle (doc. 142 n. 3); [[w.moyar-triumph-forsaken]],
