- add:
    entry:
      id: cal.1964-03-04.vietnam-2
      when: Mar. 4
      date: '1964-03-04'
      thread: vietnam
      also:
      - elections-1964
      c: 'Johnson with the Joint Chiefs. Taylor, the Chiefs with him: the campaign in the South intensified, and "a progressive
        program of selective air and naval attacks against North Vietnam"; Chinese intervention unlikely. Johnson, by Taylor''s
        record, accepts the need to punish Hanoi but points to the political difficulties: he "does not want to lose South
        Vietnam before next November nor does he want to get the country into war." Khánh to be made "our boy"; Mansfield''s
        plan for neutralization to be examined.'
