      id: cal.1965-02-23.vietnam-congress-2
      when: Feb. 23
      date: '1965-02-23'
      thread: vietnam-congress
      c: 'Bingham (D-N.Y.), in the Record, an open letter he is sending Johnson that day: far more support for the President''s
        course in Vietnam than the press shows; between "the Goldwaters, the Nixons, and the Joe Alsops" calling for war on
        the North and those urging a pullout or negotiation, most Americans "do not want you to let the Communists have their
        way in Vietnam and they do not want you to widen the war."'
      n: '[111 Cong. Rec. 3411](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-5-2.pdf) (House,
        Feb. 23, 1965). [[w.moyar-triumph-forsaken]], 355 n.23, 487 (the letter, dated by Moyar Feb. 24). To check: Congressional
        Record, vol. 111, 3411–12 (cited by [[w.moyar-triumph-forsaken]], 355 n.23). Names: Bingham, Johnson, Goldwater, Nixon,
        Alsop.'
      src:
