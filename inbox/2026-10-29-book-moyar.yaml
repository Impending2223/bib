      c: 'Johnson and McNamara by telephone, 8:41 a.m. By Beschloss''s transcript as Moyar quotes it, Johnson on the Tonkin
        Gulf resolution: "we know ourselves, in our own conscience, that when we asked for this resolution, we had no intention
        of committing this many ground troops. We''re doing so now, and we know it''s going to be bad."'
      n: '[Johnson and McNamara, 8:41 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-july-2-1965),
        Conversation WH6507.01-8302 (Miller Center; not heard). [[w.moyar-triumph-forsaken]], 416. To check: [[w.reaching-for-glory]],
        381–83 (cited by [[w.moyar-triumph-forsaken]], 416 n.67). See [[cal.1964-08-10.vietnam]]. Names: Johnson, McNamara.'
