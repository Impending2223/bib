        I, 339 n.162); Durbrow, oral history interview, LBJ Library (cited by [[w.moyar-triumph-forsaken]], 105 n.50, for
        an American hand in the manifesto); the Caravelle manifesto, The Pentagon Papers, vol. 1, 316–21 (cited by [[w.moyar-triumph-forsaken]],
        105 n.49). Names: Trần Văn Văn, Phan Khắc Sửu, Ngô Đình Diệm. Check: Moyar, 105, by Durbrow''s later account, has
