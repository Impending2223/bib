      id: cal.1965-03-01.vietnam-congress
      when: Mar. 1
      date: '1965-03-01'
      thread: vietnam-congress
      c: 'Senate. Proxmire: "I wholeheartedly support the President''s policy"; Javits commends him. Harris (D-Okla.) joins
        him: "unless we are willing, now, to take the risks involved ... in drawing the line in South Vietnam, we shall have
        to draw it somewhere. I, for one, would like to see it drawn in South Vietnam, rather than in Thailand, in Malaysia,
        in the Philippines, in Hawaii, or in San Francisco and Seattle."'
      n: '[111 Cong. Rec. 3778, 3783](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-8-1.pdf)
        (Senate, Mar. 1, 1965). [[w.moyar-triumph-forsaken]], 355 n.23, 487 (Harris). To check: Congressional Record, vol.
        111, 3783 (cited by [[w.moyar-triumph-forsaken]], 355 n.23). Names: Proxmire, Javits, Harris.'
      src:
