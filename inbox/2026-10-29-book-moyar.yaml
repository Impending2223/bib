      c: 'The White House, 11:05 a.m., recorded: Kennedy with McNamara, McCone, Robert Kennedy, McGeorge Bundy and others
        on the generals'' plot. By Moyar''s transcription, McNamara: the matter to be taken out of "very amateurish hands,"
