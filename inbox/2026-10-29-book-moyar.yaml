      when: Oct. 1
      date: '1963-10-01'
      thread: vietnam-saigon
      c: 'Taylor''s farewell call on Dương Văn Minh: by Taylor''s record, Minh sees ultimate success doubtful, no clear chain
        of command, responsibility divided; the Buddhist trouble a struggle for privilege; "no solution." It would be "tragic"
        to slow the war by cutting aid; he sees no opposition that might rally support.'
      n: '[FRUS 1961–63, IV, doc. 162](https://history.state.gov/historicaldocuments/frus1961-63v04/d162) (Taylor''s memorandum
        for the record; the tennis of Sept. 29 in its first note). [[w.moyar-triumph-forsaken]], 253–54 (the tennis; the second
        meeting). See [[cal.1963-09-29.vietnam]]. Names: Taylor, Dương Văn Minh.'
