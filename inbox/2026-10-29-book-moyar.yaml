        telephone conversation, Aug. 4, 1964, LBJL, NSF, VNCF, box 228 (cited by [[w.moyar-triumph-forsaken]], 312 n.14).
        See [[cal.1964-08-02.vietnam]]. Names: Herrick, Johnson. Check: Moyar, 312: "most of the information now available
        supports the view that an attack did not occur."'
