      c: 'Johnson and McNamara by telephone, 12:15 p.m. By Beschloss''s transcript as Moyar quotes it, Johnson: "I see no
        program from either Defense or State that gives much hope of doing anything, except just praying and gasping to hold
        on during monsoon and hope they''ll quit. I don''t believe they''re ever going to quit."'
      n: '[Johnson and McNamara, 12:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-june-21-1965),
        Conversation WH6506.05-8168 (Miller Center; not heard). [[w.moyar-triumph-forsaken]], 406. To check: [[w.reaching-for-glory]],
        364–66 (cited by [[w.moyar-triumph-forsaken]], 406 n.27). See [[cal.1965-06-07.vietnam]]. Names: Johnson, McNamara.'
