patch: threads-8
by: Claude (thread statements, stage 6, agent 8)
ops:
- edit:
    id: cal.thread.assassination
    base: d1d85573
    set:
      c: Kennedy killed at Dallas, and the inquiry. The Texas trip planned; Dealey Plaza; Oswald shot by Ruby; the funeral; the Warren Commission named; its first meeting; Marina Oswald, the first witness; Ruby convicted; the Report; the hearings published.
      c3: Kennedy killed at Dallas, and the inquiry. The Manchester suit and its settlement; Ruby's death; Garrison's inquiry at New Orleans, Ferrie's death, Shaw's arrest and indictment; Robert Kennedy shot at Los Angeles; the Violence Commission.
- edit:
    id: cal.thread.civil-rights-the-executive
    base: a4d2657a
    set:
      c: What the President and the Attorney General did for civil rights by appointment, order and direction, and what the candidates promised. Nixon's letter to Jackie Robinson; the Senators' pledge; Lodge's promise; Weaver; the equal employment committee; the new judgeships, Cox and Marshall; the Emancipation centennial; the housing order.
      c2: What the President and the Attorney General did for civil rights by appointment, order and direction, and what the candidates promised. The Commission's century report; Baldwin; Johnson at Gettysburg; the apprenticeship order; the order on federally aided construction; Cambridge; McNamara's directive; Penn's killing and the Danielsville acquittal; the Council on Equal Opportunity; the Klan arrests; Howard University; Executive Order 11246.
      c3: What the President and the Attorney General did for civil rights by appointment, order and direction, and what the candidates promised. Weaver to the Cabinet; the Community Relations Service to Justice; Brimmer to the Board; the equal employment bill; the White House Conference "To Fulfill These Rights" and its report; Gallup on integration's pace; "The Forgotten American"; the Jury Selection and Service Act.
- edit:
    id: cal.thread.conservative-movement
    base: 8ece3352
    set:
      c: 'The organized conservatives, in the Republican Party and outside it: their groups, books, journals, rallies, campaigns and third party. Manion''s committee for Goldwater; *The Conscience of a Conservative*; Youth for Goldwater for Vice President; *National Review* neutral on Nixon; Sharon and the founding of Young Americans for Freedom; YAF''s rally at the Manhattan Center; the Breakers on the Birch Society; the Conservative Party of New York; Dodd out, Walker dropped; YAF at the Garden.'
      c2: 'The organized conservatives, in the Republican Party and outside it: their groups, books, journals, rallies, campaigns and third party. Citizens for Goldwater; the Young Republicans at San Francisco, Lukens elected; the California Republican Assembly to the right; *A Choice, Not an Echo*; the United Republicans of California; Republicans for Ronald Reagan; the Free Society Association; the party''s chairmen and Senators against the Birch Society; Buckley for mayor of New York, against Lindsay.'
      c3: 'The organized conservatives, in the Republican Party and outside it: their groups, books, journals, rallies, campaigns and third party. YAF''s fifth anniversary; the American Conservative Union on "The Reagan Phenomenon"; Schlafly beaten for the Republican women''s presidency; the Young Republicans at Omaha.'
- edit:
    id: cal.thread.crime-and-hijacking
    base: '28978422'
    set:
      c: 'Crime and the law against it: organized crime and Hoffa, the hijackings to Cuba, the death penalty, the police and the courts, the crime and gun laws. Chessman''s reprieve and execution; Robert Kennedy''s organized-crime bills; three hijackings, May–Aug. 1961; aircraft piracy a federal crime; the Wire and Travel Acts; Delaware''s death penalty restored; the Test Fleet trial.'
      c2: 'Crime and the law against it: organized crime and Hoffa, the hijackings to Cuba, the death penalty, the police and the courts, the crime and gun laws. Hoffa indicted for jury tampering; McClellan''s hearings, Valachi; Hoffa convicted at Chattanooga; Mississippi''s laws against Freedom Summer; the death penalty ended in Oregon, Iowa, West Virginia and New York; the 1965 crime message; the Crime Commission; the Law Enforcement Assistance Act.'
      c3: 'Crime and the law against it: organized crime and Hoffa, the hijackings to Cuba, the death penalty, the police and the courts, the crime and gun laws. The 1966 message; *Miranda*; the Bail Reform Act; New York''s civilian review board, named and voted down; Austin; the District crime bill vetoed; the Commission''s report; executions at San Quentin and Cañon City; the Mulford Act; *Katz*; "To Insure the Public Safety"; the Safe Streets Act; *Terry*; the Gun Control Act.'
- edit:
    id: cal.thread.cuba
    base: 3e926369
    set:
      c: Cuba short of the missile crisis, and after. Mikoyan in Havana; the covert program; the refineries seized and the sugar quota cut; the nationalizations; the Declaration of San José; the export embargo; the break; the Bay of Pigs and the Taylor inquiry; Mongoose; Punta del Este; the trade embargo; Northwoods; the prisoners' ransom; the Orange Bowl.
      c2: Cuba short of the missile crisis, and after. NSAM 213; the exile raids on Soviet ships; the sabotage program; Attwood and Lechuga; Cubela; Guantanamo's water; the OAS sanctions; *Zemel v. Rusk*; Camarioca and the refugee airlift.
      c3: Cuba short of the missile crisis, and after. The Cuban Adjustment Act; Guevara killed in Bolivia.
- edit:
    id: cal.thread.draft
    base: 67c28d72
    set:
      c: 'Selective Service: the law, its administration, and the refusals and resistance. The message and the Marshall Commission''s lottery; Muhammad Ali''s refusal and conviction; the Military Selective Service Act; Stop the Draft Week; Hershey''s letter to the boards and his statement with Ramsey Clark; the Boston indictments; graduate deferments ended; Catonsville; *O''Brien*; Spock convicted.'
- edit:
    id: cal.thread.elections-1961
    base: bdf4a73f
    set:
      c: 'The off-year elections of 1961. Governors: Hughes in New Jersey, Harrison in Virginia. Mayors: Yorty over Poulson; Wagner against DeSapio and Tammany, then re-elected over Lefkowitz; Allen over Maddox in Atlanta; Cavanagh over Miriani in Detroit; Cowger in Louisville. New York City''s new charter.'
- edit:
    id: cal.thread.elections-1968-polls
    base: 7327fc12
    set:
      c: 'Gallup on 1968: the parties'' choices and the trial heats. Nixon first among Republicans, Lodge and Goldwater behind; the county chairmen''s choice; Romney even with Humphrey, behind Johnson; Romney or Nixon at the convention; Robert Kennedy and his brother.'
      c3: 'Gallup on 1968: the parties'' choices and the trial heats. Robert Kennedy over Nixon; the county chairmen for Nixon; Romney first among Republicans, then ahead of Johnson; Robert Kennedy over Johnson among Democrats; Romney before and after "brainwashing"; Wallace as a third party''s candidate; Nixon first again; McCarthy, Kennedy and Humphrey after Mar. 31; Nixon, Humphrey and Wallace through the fall; the final poll.'
- edit:
    id: cal.thread.elections-1972
    base: '95409681'
    set:
      c: 'The 1972 nominations: the primaries, Mar. 7 to June 6 (CQ''s returns), and the conventions. Muskie in New Hampshire, Nixon over McCloskey; Wallace in Florida; McGovern in Wisconsin and Massachusetts; Humphrey in Pennsylvania, Indiana and Ohio; Wallace in Maryland and Michigan; McGovern in California; the conventions at Miami Beach, July 10 and Aug. 21.'
- edit:
    id: cal.thread.georgia
    base: 3f43799f
    set:
      c: 'Georgia: its legislature, courts, elections and schools, and the movement in Albany and Atlanta. The Sibley committee; King at Rich''s and Reidsville; Holmes and Hunter admitted at Athens; the open-schools law; Atlanta''s high schools; Allen over Maddox; the Albany Movement; King jailed at Albany, December and July; the county unit enjoined; the Senate reapportioned; Elliott''s injunction; King leaves Albany; Leroy Johnson to the Senate.'
      c2: 'Georgia: its legislature, courts, elections and schools, and the movement in Albany and Atlanta. *Gray v. Sanders*; the Albany indictments; *Wesberry v. Sanders*; the Georgia House malapportioned; Maddox''s Pickrick; Lemuel Penn killed; the Danielsville acquittal; Callaway the State''s first Republican Representative since Reconstruction; Bootle dismisses the indictment; *Fortson v. Toombs*; Bond elected; SNCC against the war.'
      c3: 'Georgia: its legislature, courts, elections and schools, and the movement in Albany and Atlanta. Bond refused his seat; *Evans v. Newton*; Bond''s suit; Summerhill; Maddox nominated; the legislature''s choice of governor enjoined; *Bond v. Floyd*; *Fortson v. Morris*; Bond sworn; Maddox chosen; Dixie Hills; King''s funeral; the delegation divided at Chicago; Talmadge renominated.'
- edit:
    id: cal.thread.governors
    base: b6b2a0cc
    set:
      c: The races for governor, primaries and generals, and the governors' acts beside them. Davis over Morrison; Sanford over Lake; Kerner, Volpe, Andersen; Hughes and Harrison; Romney declares; Wallace's primary and runoff; Connally over Don Yarborough; Brown over Nixon; Romney, Scranton, Rhodes; Bellmon, Oklahoma's first Republican; Hoff and King in New England; Minnesota to a recount.
      c2: The races for governor, primaries and generals, and the governors' acts beside them. Edmondson to the Senate; Rolvaag declared elected; Breathitt over Nunn; Paul Johnson in Mississippi; McKeithen; Burns over High; Evans over Rosellini; Kerner over Percy; Romney re-elected; Volpe back; Massachusetts's four-year terms; McNair for Russell; Wallace's succession bill; Hughes and Godwin.
      c3: The races for governor, primaries and generals, and the governors' acts beside them. Lurleen Wallace nominated; High over Burns; Reagan over Brown; Agnew, Kirk, Winthrop Rockefeller; Rockefeller's third term; Maddox chosen by the legislature; Reagan's inaugural; Nunn in Kentucky, Williams in Mississippi; Connally not to run; Lurleen Wallace's death; Kerner to the bench; Ogilvie over Shapiro; Moore in West Virginia; Mandel for Agnew.
- edit:
    id: cal.thread.medicare
    base: 5beca988
    set:
      c: Hospital insurance for the aged through Social Security. The Forand bill set aside; Mills's plan through the House; Anderson–Kennedy refused; Kerr–Mills signed; the 1961 message, King–Anderson; the 1962 message; the Garden rally; the Senate's 52–48.
      c2: Hospital insurance for the aged through Social Security. The 1963 message; the 1964 message; Johnson and O'Brien on Mills; the House bill without it; the Senate's Gore amendment; Mills after the election; the 1965 message; Eldercare and Bettercare; Mills's bill; the House, 313–115; the Senate; Medicare and Medicaid signed at Independence.
      c3: Hospital insurance for the aged through Social Security. Enrollment extended; New York's Medicaid law; the hospitals' compliance; Medicare in effect.
- edit:
    id: cal.thread.republican-party
    base: 8c0aef01
    set:
      c: 'The Republican Party: its national committee and chairmen, its governors, its factions and groups, and its leaders'' and figures'' word on policy and politics. Rockefeller declines Morton''s offer; the platform and the Fifth Avenue compact; South Carolina''s chairmen for Goldwater; the fraud charges; Advance at Harvard; Goldwater''s statement of principles; Nixon''s first speech against the administration; Eisenhower on foreign policy; the national committee at Oklahoma City; Clare Boothe Luce on Cuba; Case''s meeting of the moderates; the Ripon Society founded.'
      c2: 'The Republican Party: its national committee and chairmen, its governors, its factions and groups, and its leaders'' and figures'' word on policy and politics. Rockefeller''s Lincoln Day; the Young Republicans at San Francisco; the national committee at Denver; Nixon and Eisenhower on Diệm''s killing; the Ripon Society''s manifesto; the governors at Cleveland; Burch chairman; the governors at Denver against Burch; Goldwater and Romney by letter; Bliss for Burch; the Birch Society disowned; the Coordinating Committee''s paper on the war; Brooke for the Senate.'
      c3: 'The Republican Party: its national committee and chairmen, its governors, its factions and groups, and its leaders'' and figures'' word on policy and politics. The city chairmen; Nixon and Percy at Jackson; the county chairmen''s choices for 1968, Nixon first; Reagan''s "Creative Society"; the national committee''s paper on the war; Nixon with the Senate Republicans for an Asian peace conference; Nixon on the Manila communiqué; the governors at the Broadmoor; the Victory Gala; the Governors Association''s Washington office; Ripon''s "The Realities of Vietnam"; the Southern chairmen with Nixon at Atlanta.'
- edit:
    id: cal.thread.space
    base: ce908da0
    set:
      c: The space race and the moon program. Huntsville to NASA; Tiros; Corona's first film; Gagarin; Shepard; the moon message; Grissom and Titov; Houston; Glenn; joint work offered to Khrushchev; Telstar; Rice Stadium; the moon first; Mariner 2.
      c2: The space race and the moon program. Comsat's incorporators; Cooper; Syncom; the joint expedition offered; Cape Kennedy; Saturn I; Ranger 7; Gemini 3, 4 and 5; the Manned Orbiting Laboratory; Gemini 6 and 7.
      c3: The space race and the moon program. Luna 9; Gemini 8 to 12; the moon treaty asked; Surveyor; Lunar Orbiter; the Outer Space Treaty signed; the Apollo fire and its review board; Komarov; the treaty in force; Apollo 4, the first Saturn V; the rescue agreement; Webb leaves NASA; Apollo 7; Apollo 8.
- edit:
    id: cal.thread.students
    base: d34f505f
    set:
      c: 'College, university and high school students in politics: their organizations, demonstrations and manifestos. The Master Plan; the HUAC hearings at San Francisco; Kennedy at Ann Arbor; the McComb walkout; the peace pickets at the White House; Port Huron.'
      c2: 'College, university and high school students in politics: their organizations, demonstrations and manifestos. Tougaloo''s sit-in; North Carolina''s Speaker Ban; Freedom Summer''s volunteers; Berkeley, the police car and Sproul Hall; the teach-ins, Ann Arbor to the National Teach-In; SDS''s march; Genovese at Rutgers; Vietnam Day; the draft-card law; the Days of Protest; Miller''s draft card; SANE''s march; SNCC against the war.'
      c3: 'College, university and high school students in politics: their organizations, demonstrations and manifestos. Bond; the second Days of Protest; HUAC on the antiwar groups; Kerr dismissed; tuition and the march on Sacramento; the NSA''s money from the CIA; Stop the Draft Week; Dow at Madison; Orangeburg; graduate deferments ended; the East Side walkouts; Columbia; Cleaver at Berkeley; San Francisco State.'
- edit:
    id: cal.thread.trade
    base: ea47655e
    set:
      c: 'Trade and the tariff: the Trade Expansion Act, the Kennedy Round, the sales to the Communist countries. The OECD convention; the trade message; the escape-clause duties on carpets and glass; the House and Senate votes; the Trade Expansion Act signed, Herter named.'
      c2: 'Trade and the tariff: the Trade Expansion Act, the Kennedy Round, the sales to the Communist countries. Most-favored-nation treatment for Yugoslavia and Poland; the new tariff schedules; Canada''s wheat sale; the American sale and Mundt''s bill; the chicken war; Passman''s amendment; the longshoremen''s boycott; the Kennedy Round opens; the Six''s grain price; the automotive agreement and act.'
      c3: 'Trade and the tariff: the Trade Expansion Act, the Kennedy Round, the sales to the Communist countries. Herter''s death; Roth for Herter; the canned hams; the Kennedy Round''s agreement, signed and sent to Congress; the first cuts proclaimed; special drawing rights; the balance-of-payments program; the trade message; Roth''s study; the longshoremen''s strike.'
