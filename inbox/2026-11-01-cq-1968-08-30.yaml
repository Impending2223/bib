    entry:
      id: cal.1968-08-27.elections-1968-2
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968
      c: 'Oklahoma''s House primaries. 2d District, Democratic: Edmondson over Jack Don Nixon, 57,809 to 13,085, 81.5 percent. 3d: Albert, the Majority Leader, over Marshall, 76,061 to 32,967, 69.8 percent; Republican, Beasley over Denney, 1,463 to 967, 60.2 percent. 4th: Steed over Wickersham, once Representative, 47,860 to 17,565, 66.7 percent, Timmons 6,357, 8.8 percent; Steed and James V. Smith (R) put in one district. 5th: Jarman over Sokolsky, 33,746 to 11,859, 74.0 percent. 6th, open: Goodwin over Folsom, 22,579 to 11,590, 45.3 percent, Walton 9,351, 18.7 percent, Triplett 6,351, 12.7 percent, a runoff Sept. 17; Republican, Camp over Carrier, 17,911 to 10,920, 62.1 percent.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2314 (almost complete returns). Check: CQ prints Beasley''s share 60.0 percent and Sokolsky''s 31.1. To check: [Okla. State Election Bd., *Election Results, 1968–1974*](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf). Names: Edmondson, Albert, Steed, Wickersham, James V. Smith, Jarman, Camp.'
      tags:
