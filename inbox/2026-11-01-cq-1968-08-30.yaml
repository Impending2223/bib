      c: The convention, 10:32 p.m. Unruh moves the credentials contests be heard Aug. 27, as first scheduled; defeated at 11:03, 1,691½ to 875. The Rules Committee's report adopted by voice vote. 11:19 p.m., by voice votes, Mississippi's Loyalists seated, and the regulars of Washington, Pennsylvania, Minnesota and Connecticut.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2286, 2293. See [[cal.1968-08-26.elections-1968]]. Names: Unruh.'
