- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-5
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      also:
      - vietnam
      c: 'The convention, 1:04 a.m. Commotion over the rules for the platform''s debate. 1:13, Burton recognized to open the debate on Vietnam; clapping in unison. Albert: "Will the Convention be in order?" The delegates: "No." 1:17, Daley draws a finger across his throat; Albert takes his motion to adjourn.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2283, 2338 (Albert had refused a McCarthy delegate''s motion to adjourn; CQ''s convention story gives 1:03 a.m. and prints "Aug. 23," 2285). See [[cal.1968-08-26.elections-1968]]. Names: Burton, Albert, Daley.'
      tags:
      - name:burton-phillip
      - name:albert-carl
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-6
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: Edward Kennedy, in the morning, asks his backers to "cease all activity on my behalf."
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2342 (his telegram read to the convention at 8:02 p.m., not available, 2338). See [[cal.1968-08-26.elections-1968-chicago-8]]. Names: Edward Kennedy.'
      tags:
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-7
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago. After the plank''s defeat, New York''s delegates and others put on black armbands and sing "We Shall Overcome"; some 350 meet at a hotel downtown on a "new party." Gilligan: the war''s opponents no small minority.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2285, 2338 (the platform adopted by voice vote at 4:39 p.m. as New York sang; the band drowned it out). Check: the hour of the meeting. See [[cal.1968-08-28.elections-1968]]. Names: Gilligan.'
      tags:
      - name:gilligan-john-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-8
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: 'The convention''s fourth session, from 7:04 p.m. The roll for nominations, 8:11: Moore of North Carolina, favorite son; McCarthy by Harold Hughes, 8:39, a seven-minute demonstration; Humphrey by Alioto, 9:32; McGovern by Ribicoff, 10:07; Channing Phillips by Phillip M. Stern, 10:35, the first Negro placed in nomination before a major party''s convention.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2338. See [[cal.1968-08-26.elections-1968]]. Names: Moore, McCarthy, Harold E. Hughes, Humphrey, Alioto, McGovern, Ribicoff, Phillips, Stern.'
      tags:
      - name:moore-dan-k
      - name:mccarthy-eugene-j
      - name:hughes-harold-e
      - name:humphrey-hubert-h
      - name:alioto-joseph-l
      - name:mcgovern-george
      - name:ribicoff-abraham
      - name:phillips-channing-e
      - name:stern-philip-m
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-9
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      also:
      - press-and-broadcasting
      c: 'The Amphitheatre, 8:26 p.m. A scuffle in New York''s delegation: Alex J. Rosenberg, of the 19th District, refuses to show his credentials to a guard.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2338 (delegates who would not show their credentials ejected from the floor; "Daley''s people" in the galleries, 2283). See [[cal.1968-08-26.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-10
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: '8:30 p.m., UPI: police and Guardsmen battling thousands with clubs, rifle butts and tear gas in the heart of Chicago. Tear gas drifts into Humphrey''s suite.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2338. See [[cal.1968-08-28.elections-1968-chicago]]. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-11
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: The roll call, 10:03 p.m. Maytag of Colorado asks the chair whether "Mayor Daley can be compelled to suspend the police-state tactics." At 11:14, New Hampshire's chairman tries to move adjournment; the clerk ignores him.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2338. See [[cal.1968-08-26.elections-1968]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - state:co
