      thread: elections-1968-chicago
      also:
      - rules
      c: 'Chicago. A Rules subcommittee, 6:10 p.m.: abolish the unit rule. The full committee, 11:28 p.m., for it, at this convention; it refuses to bar the rule at every level for 1972, to have all delegates chosen in the convention''s year, and to add the State chairmen and the Young Democrats'' State presidents to the National Committee. Minority reports: Texas''s, for the rule; the liberals'', on 1972.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2287, 2292. See [[cal.1968-08-22.elections-1968-chicago-4]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-23.states-and-cities
      when: Aug. 23
      date: '1968-08-23'
      thread: states-and-cities
      also:
      - voting-rights
      c: 'Virgin Islands Elective Governor Act signed, [82 Stat. 837](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg837.pdf): the governor and a new lieutenant governor elected from 1970, four-year terms, no more than two in succession; the Constitution''s due process, equal protection and privileges and immunities clauses extended to the islands. Johnson: "This bill opens the ballot box."'
      n: 'Statement by the President Upon Signing Bill Providing for Popular Election of the Governor of the Virgin Islands, [1968–69 Pub. Papers 907](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=217) (Aug. 23, 1968). [[w.cq-weekly-report]], Aug. 30, 1968, 2319–20 (the House''s passage, June 17, by voice vote under suspension; the Senate''s agreement to the House''s amendments, July 24, with Burdick''s at the Justice Department''s request; the House, July 26). Statute (K–J Cong. II.J.2). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
