      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      c: 8:10 p.m. David Hoeh, New Hampshire's chairman, reported arrested after a scuffle with police.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2338. Check: where. See [[cal.1968-08-26.elections-1968]].'
