      c: The convention, 2:37 a.m. The minority report to seat all of Bond's Loyal National Democrats of Georgia defeated, 1,041½ to 1,413; the committee's division of Georgia's votes stands. Booing; "We want Bond." Charles E. Anderson of California burns his credentials. Dempsey moves to adjourn; adjourned by voice vote, 2:43 a.m.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2286, 2293 (most of Maddox''s regulars walk out rather than accept the division). See [[cal.1968-08-26.elections-1968-2]]. Names: Bond, Dempsey, Maddox.'
