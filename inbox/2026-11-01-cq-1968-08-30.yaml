- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-12
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      c: The roll call, 11:19 p.m. Peterson, Wisconsin's chairman, moves to suspend the rules and adjourn for two weeks, to meet again in another city; the clerk refuses to recognize him. At 11:47 Pennsylvania's 103¾ votes put Humphrey over the 1,312 needed.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2338, 2342. See [[cal.1968-08-26.elections-1968]]. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
      - state:wi
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-6
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      c: The convention, 12:02 a.m. Albert declares Humphrey nominated; "Happy Days Are Here Again." 12:03, Ronan of Illinois moves it unanimous; Albert calls the yeas, not the nays, and over boos declares it carried. Adjourned 12:07, on Doorley's motion.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2338, 2342 (only a majority needed to make it unanimous). See [[cal.1968-08-28.elections-1968]]. Names: Albert, Humphrey, Doorley.'
      tags:
      - name:albert-carl
      - name:humphrey-hubert-h
      - name:doorley-joseph-a-jr
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-7
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      c: '4:34 p.m. Humphrey names Muskie his choice for Vice President: qualified, he says, for the Presidency itself.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2284. See [[cal.1968-08-28.elections-1968]]. Names: Humphrey, Muskie.'
      tags:
      - name:humphrey-hubert-h
      - name:muskie-edmund-s
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-8
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      c: The final session, from 7:23 p.m. A film in Robert Kennedy's memory, introduced by Edward Kennedy on videotape; a demonstration and the Battle Hymn of the Republic, 8:05 to 8:24, Albert unable to restore order; then a tribute to Martin Luther King.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2338. See [[cal.1968-08-26.elections-1968]]. Names: Robert Kennedy, Edward Kennedy, Albert, Martin Luther King.'
      tags:
      - name:kennedy-robert-f
