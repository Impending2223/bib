      - alabama
      c: 'The convention''s second session, from 6:03 p.m. By voice votes, the regulars of North Carolina, Louisiana and Tennessee seated, 6:29. At 7:59, the minority report to seat the National Democratic Party of Alabama, McCarthy''s, defeated, 883½ to 1,605; Alabama''s regulars seated on their loyalty pledge; then Michigan''s and Indiana''s regulars by voice vote. The rest of the credentials report adopted: the call for 1972 to give every Democrat a "meaningful and timely" part in choosing delegates.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2286, 2293. See [[cal.1968-08-26.elections-1968-2]]. Names: McCarthy.'
