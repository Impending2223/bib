      date: '1968-08-25'
      thread: elections-1968-chicago
      also:
      - vietnam
      c: 'The Platform Committee''s drafting subcommittee, fifteen minutes on Vietnam, four motions by voice vote: O''Donnell''s, to endorse the Administration''s policy, tabled; Pell''s milder substitute defeated; the McCarthy-McGovern plank, Burton''s motion, rejected, five or six of the 22 for it. Its plank: a halt in the bombing only when it "would not endanger the lives of our troops in the field."'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2285, 2289 (O''Donnell''s account to reporters, Aug. 26; Connally had proposed the endorsement Aug. 22). Check: the day of the four motions, CQ''s analysis giving no date for them. See [[cal.1968-08-20.elections-1968-chicago-2]]. Names: O''Donnell, Pell, McCarthy, McGovern, Burton.'
      tags:
      - name:odonnell-kenneth-p
      - name:pell-claiborne-d
