      also:
      - press-and-broadcasting
      - vietnam
      c: 'Chicago, 5:45 p.m. The *Chicago Tribune*''s first edition: Johnson ordered the subcommittee to rewrite a softer plank, Humphrey''s people''s: "If you pass that platform, I will publicly repudiate it. Get back and go to work." Murphy of the White House flown in to oversee the drafting, by the *Tribune*''s and other papers'' reports. Boggs: "absolutely untrue."'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2289, 2293 (Boggs: the committee guided by the 500,000 troops in Vietnam and "capable diplomats in Paris"). Check: the day of Boggs''s denial. See [[cal.1968-08-26.elections-1968-chicago]]. Names: Johnson, Humphrey, Murphy, Boggs.'
