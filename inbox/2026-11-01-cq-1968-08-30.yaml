      c: New Mexico's primary. Cargo renominated for governor over Hawley, a conservative; Fabian Chavez, once a State senator, the Democratic nominee over five others. For the House, Morris and Walker renominated; their opponents Lujan and Foreman, once Representative from Texas.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2342. Check: the counts (CQ printed none); the State''s canvass. Names: Cargo, Hawley, Chavez, Morris, Walker, Lujan, Foreman.'
