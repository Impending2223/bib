patch: 2026-11-01-cq-1968-08-30
by: reader (Claude), CQ Weekly Report, Aug. 30, 1968
ops:
- cite:
    id: cal.1968-08-26.elections-1968
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2293 (Bailey opens it, 7:31 p.m.)'
    units: A
- cite:
    id: cal.1968-08-26.elections-1968-2
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2286, 2293 (the committee and the floor; Henry not named)'
    units: A, C-D
- check:
    id: cal.1968-08-26.elections-1968-2
    text: 'Check: CQ dates the committee''s last hearings Aug. 23 and puts its decisions on the floor Aug. 26–27: Mississippi''s Loyal National Democrats seated by voice vote, Aug. 26, 11:19 p.m.; Texas''s regulars, 1,368 to 955, Aug. 27, 1:24 a.m.; Georgia''s minority report, 1,041½ to 1,413, 2:37 a.m.; Alabama''s, 883½ to 1,605, 7:59 p.m. ([[w.cq-weekly-report]], Aug. 30, 1968, 2286, 2293). The votes: [[cal.1968-08-27.elections-1968-chicago-11]], [[cal.1968-08-27.elections-1968-chicago-12]], [[cal.1968-08-27.elections-1968-chicago-14]].'
- cite:
    id: cal.1968-08-27.elections-1968-chicago
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2287, 2293 (the minority report, 1,350 to 1,206, 11:38 p.m.)'
- check:
    id: cal.1968-08-27.elections-1968-chicago
    text: 'Check: CQ puts the unit rule''s abolition for this convention Aug. 26, by voice vote, and quotes the minority report of Aug. 27 as asking "that the unit rule not be used at any stage of the delegate selection process" and delegates chosen "within the calendar year of the National Convention"; it prints no "full and timely" ([[w.cq-weekly-report]], Aug. 30, 1968, 2287). The abolition: [[cal.1968-08-26.elections-1968-chicago-15]].'
- cite:
    id: cal.1968-08-28.elections-1968
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2285, 2287–88, 2338, 2342'
    units: A-D, G
- check:
    id: cal.1968-08-28.elections-1968
    text: 'Check: CQ prints the minority plank''s defeat 1,041¼ to 1,567¾ in its table and its chronology (2287, 2338), 1,048¼ to 1,567¾ in its story (2285), 1,041–1,567 in its analysis (2289): Burton offered it; debate from 1:03 p.m., the roll from 3:52, the result 4:39. Humphrey''s first-ballot total 1,760¼ in its table (2288) and summary (2283), 1,761¾ in its story (2284, 2342), both against 1,759¼ here; Pennsylvania put him over at 11:47 p.m., the result announced 12:02 a.m., Aug. 29 (2338, 2342). The telegrams of Johnson and Edward Kennedy read at 8:02 p.m. (2338). CQ says only that Ribicoff spoke of the tumult in the city, departing from his text (2338).'
- cite:
    id: cal.1968-08-29.elections-1968
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2284, 2338, 2340'
    units: A, C-D
- check:
    id: cal.1968-08-29.elections-1968
    text: 'Check: CQ gives Muskie 1,944½ before he was declared the nominee by acclamation on Daley''s motion, 9:54 p.m.; the majority his at 9:39 when Ohio voted ([[w.cq-weekly-report]], Aug. 30, 1968, 2284, 2338). The convention adjourned sine die 12:10 a.m., Aug. 30 (2338).'
- cite:
    id: cal.1968-08-23.elections-1968-chicago
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2285'
    units: A-C
- check:
    id: cal.1968-08-23.elections-1968-chicago
    text: 'Check: CQ: the plank released Aug. 23 by McCarthy''s people, McGovern''s and unaligned delegates after their meeting the night of Aug. 22; it asks a negotiated coalition government including the Communists; the drafting subcommittee rejects it by voice vote Aug. 25, the committee 62–35 the same day ([[w.cq-weekly-report]], Aug. 30, 1968, 2285; Aug. 26 in its analysis, 2289). The committee''s vote: [[cal.1968-08-25.elections-1968-chicago-4]].'
- cite:
    id: cal.1968-08-24.specials
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2314'
    units: A, C
- check:
    id: cal.1968-08-24.specials
    text: 'Check: CQ gives Collins 13,829, 60.0 percent, Pool 9,209 ([[w.cq-weekly-report]], Aug. 30, 1968, 2314).'
- cite:
    id: cal.1968-08-27.elections-1968-ak
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2342 (the winners, by returns from 373 of 410 precincts)'
- cite:
    id: cal.1968-08-23.transportation
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2320–22'
    units: A-B, D
- check:
    id: cal.1968-08-23.transportation
    text: 'Check: CQ gives the House''s refusal to recommit, July 26, as 166–167, Stratton''s motion; the Senate adopted the conference report July 29, 66–6; Johnson signed shortly before the veto deadline, midnight, Aug. 23 ([[w.cq-weekly-report]], Aug. 30, 1968, 2320, 2322).'
- cite:
    id: cal.1968-08-16.health
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2318–19 (the Eye Institute)'
    units: B
- check:
    id: cal.1968-08-16.health
    text: 'Check: CQ dates the Eye Institute''s signing Aug. 17, the date the Papers give both statements; the Statutes, Aug. 16 ([[w.cq-weekly-report]], Aug. 30, 1968, 2318). The House and Senate: [[cal.1968-08-01.health]], [[cal.1968-08-02.health]].'
- cite:
    id: cal.1968-08-19.vietnam-paris
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2337 (the substance)'
    units: A-B
- check:
    id: cal.1968-08-26.elections-1968-chicago-5
    text: 'Check: CQ: the first planeload of regular Army troops trained in riot control arrived Aug. 25, 8:45 a.m.; about 7,500 federal troops on alert ([[w.cq-weekly-report]], Aug. 30, 1968, 2292).'
- check:
    id: cal.1968-08-23.elections-1968-chicago-4
    text: 'Check: CQ: the first of 5,600 National Guardsmen began arriving Aug. 23 ([[w.cq-weekly-report]], Aug. 30, 1968, 2292).'
- cite:
    id: cal.1967-08-14.press-and-broadcasting
    item: '[[w.cq-weekly-report]], Aug. 30, 1968, 2333 (the task force, established Aug. 14, 1967, Eugene V. Rostow chairman)'
    units: F
- check:
    id: cal.1968-08-05.africa
    text: 'Check: CQ lists a message to Haile Selassie on the food shortage in Nigeria, Aug. 3, besides this one; the Papers print none of that day ([[w.cq-weekly-report]], Aug. 30, 1968, 2343).'
- add:
    entry:
      id: cal.1968-08-01.civil-rights-the-executive
      when: Aug. 1
      date: '1968-08-01'
      thread: civil-rights-the-executive
      c: 'Johnson to the National Bar Association''s convention, on receiving its plaque: his appointments, from the first black mayor of Washington and its city council to the Supreme Court.'
      n: 'Remarks Before the Annual Convention of the National Bar Association, [1968–69 Pub. Papers 870](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=180) (Aug. 1, 1968). [[w.cq-weekly-report]], Aug. 30, 1968, 2343 (CQ''s list of the President''s statements). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-01.health
      when: Aug. 1
      date: '1968-08-01'
      thread: health
      c: The House passes H.R. 12843, a National Eye Institute in the National Institutes of Health, by voice vote; Laird's amendment on the name of the Institute of Neurological Diseases and Blindness taken.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2319 (the Interstate and Foreign Commerce Committee had reported it July 3, H. Rept. 1644). Names: Laird.'
      tags:
      - name:laird-melvin-r
- add:
    entry:
      id: cal.1968-08-02.latin-america
      when: Aug. 2
      date: '1968-08-02'
      thread: latin-america
      c: 'Johnson to Trejos of Costa Rica: a team of scientists of the Smithsonian Institution and the Geological Survey sent to study the eruptions of the volcano Arenal.'
      n: 'Message to President Trejos Concerning the Dispatch of Scientists To Study Volcanic Eruptions in Costa Rica, [1968–69 Pub. Papers 874](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=184) (Aug. 2, 1968). [[w.cq-weekly-report]], Aug. 30, 1968, 2343 (CQ''s list). Names: Trejos, Johnson.'
      tags:
      - name:trejos-fernandez-jose-joaquin
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-02.health
      when: Aug. 2
      date: '1968-08-02'
      thread: health
      c: The Senate passes H.R. 12843, the National Eye Institute, by voice vote, without amendment; to the President.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2318–19 (the HEW Secretary, the Surgeon General and the director of the National Institutes against a separate institute; the AMA for it). See [[cal.1968-08-01.health]].'
- add:
    entry:
      id: cal.1968-08-09.cities-and-housing
      when: Aug. 9
      date: '1968-08-09'
      thread: cities-and-housing
      c: 'Johnson to Weaver: more American part in international bodies on housing, the Economic Commission for Europe''s Housing, Building and Planning Committee among them, and exchange of housing research with other nations; on a study by the Office of Science and Technology.'
      n: 'Letter to Secretary Weaver on the Need for International Exchange of Housing Information and Technology, [1968–69 Pub. Papers 876](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=186) (Aug. 9, 1968). [[w.cq-weekly-report]], Aug. 30, 1968, 2343 (CQ''s list). Names: Weaver, Johnson.'
      tags:
      - name:weaver-robert-c
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-09.transportation
      when: Aug. 9
      date: '1968-08-09'
      thread: transportation
      c: 'Maritime authorization signed, [82 Stat. 692](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg692.pdf): $429,451,000 for fiscal 1969, $84,595,000 over the request; ship construction subsidies $200,000,000 (requested $119,800,000), research $10,960,000.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2319 (the conference report, July 10; the Senate''s adoption, July 25, by voice vote, Williams of Delaware against the subsidy above the request; the House''s, July 26). Statute (K–J Cong. II.J.2). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-12.conservation
      when: Aug. 12
      date: '1968-08-12'
      thread: conservation
      also:
      - defense
      c: 'Public works and Atomic Energy Commission appropriation signed, [82 Stat. 705](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg705.pdf): $4,608,421,000 for fiscal 1969, $300,236,000 under the request; the AEC $2,570,874,000, 55.7 percent; its weapons'' operating expenses $840.8 million, up $125.3 million.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2315, 2318 (Congress done July 30; the House had adopted the conference report July 26, the Senate July 30, by voice votes, 2318; the Sentinel and Poseidon, Nerva $60.3 million, the Weston accelerator $12,074,000). Statute (K–J Cong. II.J.2). See [[cal.1968-07-20.conservation]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-13.elections-1968
      when: Aug. 13
      date: '1968-08-13'
      thread: elections-1968
      also:
      - economy-surcharge
      c: 'Economists to Humphrey: an end to the war would free about $30 billion a year for social programs, but even with peace early in 1969 not until after fiscal 1970; a long war, and the surcharge extended past June 30, 1969.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2337. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-08-14.economy-surcharge
      when: Aug. 14
      date: '1968-08-14'
      thread: economy-surcharge
      c: 'Mills: the new President in 1969 will have to ask for at least part of the surcharge, and its price more spending cuts; the war cannot be paid for without it.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2337. Names: Mills.'
      tags:
      - name:mills-wilbur-d
- add:
    entry:
      id: cal.1968-08-15.elections-1968
      when: Aug. 15
      date: '1968-08-15'
      thread: elections-1968
      c: 'Washington. Wallace''s supporters file about 6,000 of the 6,500 signatures needed by the filing deadline: no place on the District''s ballot. Venable, a coordinator of his campaign: "The District was written off months ago."'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2314 (Venable, an aide to Representative Nichols of Alabama: "the District''s three electoral votes never have been a part of our over-all plan"). Names: Wallace.'
      tags:
      - name:wallace-george-c
      - city:washington
- add:
    entry:
      id: cal.1968-08-16.elections-1968
      when: Aug. 16
      date: '1968-08-16'
      thread: elections-1968
      c: 'Massachusetts''s Ballot Law Commission: Wallace''s nomination papers in order; his name on the ballot, against a challenge that his views on race conflict with the oath to uphold the Constitution. He qualifies in Maine, Illinois and Missouri too.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2314. Names: Wallace.'
      tags:
      - name:wallace-george-c
      - state:ma
- add:
    entry:
      id: cal.1968-08-17.economy
      when: Aug. 17
      date: '1968-08-17'
      thread: economy
      c: 'Johnson on Fowler''s report on the balance of payments: improved by the inflow of capital, the business community''s restraint, the allies'' offsetting of military costs, economies abroad; the trade balance "disappointing"; the tax bill the first asset.'
      n: 'Statement by the President on the Secretary of the Treasury''s Report on the Balance of Payments Problem, [1968–69 Pub. Papers 894](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=204) (Aug. 17, 1968). [[w.cq-weekly-report]], Aug. 30, 1968, 2343 (the text). Names: Fowler, Johnson.'
      tags:
      - name:fowler-henry-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-17.elections-1968-chicago-3
      when: Aug. 17
      date: '1968-08-17'
      thread: elections-1968-chicago
      also:
      - vietnam
      c: 'McCarthy''s plank on Vietnam for the platform released: the first formal proposal of its language.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2285. See [[cal.1968-07-09.elections-1968]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-08-18.elections-1968
      when: Aug. 18
      date: '1968-08-18'
      thread: elections-1968
      c: 'Hammond, Ind. Wallace: not a racist; "they''re really using this as an excuse to get control of your heart and mind." The liberals "created a Frankenstein." The same at Oklahoma City, Aug. 16, and Chicago, Aug. 17.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2314. Names: Wallace.'
      tags:
      - name:wallace-george-c
- add:
    entry:
      id: cal.1968-08-19.elections-1968-chicago-5
      when: Aug. 19
      date: '1968-08-19'
      thread: elections-1968-chicago
      c: 'The Credentials Committee, Richard Hughes of New Jersey chairman, opens its hearings: 17 challenges and contests, delegations of fifteen States challenged in whole or in part, chiefly on the call''s rule that every Democrat may take part "regardless of race, color, creed or national origin" and on loyalty. Vance, Alabama''s chairman, challenges all McCarthy delegates.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2286 (Alabama, Connecticut, Georgia, Indiana, Louisiana, Michigan, Minnesota, Mississippi, New York, North Carolina, Pennsylvania, Tennessee, Texas, Washington, Wisconsin; New York''s withdrawn before the convention, Louisiana''s formally). See [[cal.1968-08-11.mississippi]]. Names: Richard J. Hughes, McCarthy.'
      tags:
      - name:hughes-richard-j
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-08-19.space-apollo
      when: Aug. 19
      date: '1968-08-19'
      thread: space-apollo
      c: 'Samuel Phillips, the Apollo Program Director: the first earth-orbit test of the whole spacecraft put off from December to February or March 1969, the lunar module late. In December instead, the spacecraft without the module on a Saturn 5; perhaps an orbit of the moon.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2337. Names: Phillips.'
      tags:
      - name:phillips-samuel-c
- add:
    entry:
      id: cal.1968-08-19.opinion
      when: Aug. 19
      date: '1968-08-19'
      thread: opinion
      also:
      - vietnam
      c: 'Harris, released: a halt in all bombing of North Vietnam, opposed 61 percent, favored 24, not sure 15. The Viet Cong in a coalition government before an election in the South: opposed 52 percent, favored 27, not sure 21.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2337. Check: the dates of the interviews.'
- add:
    entry:
      id: cal.1968-08-20.elections-1968-chicago-2
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968-chicago
      c: Washington. The Platform Committee's hearings open, Boggs chairman.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2285. See [[cal.1968-07-09.elections-1968]]. Names: Boggs.'
      tags:
      - name:boggs-hale
      - city:washington
- add:
    entry:
      id: cal.1968-08-20.elections-1968-2
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968
      c: Muskie frees Maine's delegation from its pledge to him as favorite son.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2292. Names: Muskie.'
      tags:
      - name:muskie-edmund-s
- add:
    entry:
      id: cal.1968-08-20.elections-1968-3
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968
      also:
      - vietnam-paris
      c: 'Columbus, Ohio. Nixon, after meeting Rhodes, who endorses him: Johnson''s policy of no further step down until Hanoi moves "realistic"; "we cannot halt the bombing unless there is some move on behalf of the enemy"; on a "clear indication" from the North, "maybe a bombing pause."'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2313. Names: Nixon, Rhodes.'
      tags:
      - name:nixon-richard-m
      - name:rhodes-james-a
- add:
    entry:
      id: cal.1968-08-20.elections-1968-4
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968
      c: Nixon at Walter Reed with Eisenhower's family, Eisenhower in critical condition; then at Harrisburg with Shafer, who is "wholeheartedly behind" his campaign.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2313. Names: Nixon, Eisenhower, Shafer.'
      tags:
      - name:nixon-richard-m
      - name:eisenhower-dwight-d
      - name:shafer-raymond-p
- add:
    entry:
      id: cal.1968-08-20.elections-1968-5
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968
      c: Javits endorses the Republican ticket.
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2313. Names: Javits.'
      tags:
      - name:javits-jacob-k
- add:
    entry:
      id: cal.1968-08-20.economy-surcharge
      when: Aug. 20
      date: '1968-08-20'
      thread: economy-surcharge
      c: 'Zwick, the Budget Director: from Sept. 1 agencies may replace only 70 percent of those who leave, not the act''s 75, to reach the cut of 245,000 in federal employment after four agencies'' exemptions; three more exemptions pending in Congress, 36 agencies asking.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2337. Names: Zwick.'
      tags:
      - name:zwick-charles-j
- add:
    entry:
      id: cal.1968-08-21.elections-1968-2
      when: Aug. 21
      date: '1968-08-21'
      thread: elections-1968
      c: 'New York. Rockefeller, after meeting Nixon, endorses him: he will "assume personal direction" of the campaign in New York and speak for the ticket in other States.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2313. Names: Rockefeller, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:nixon-richard-m
      - city:nyc
- add:
    entry:
      id: cal.1968-08-21.elections-1968-3
      when: Aug. 21
      date: '1968-08-21'
      thread: elections-1968
      c: New York. Lindsay, after meeting Nixon, endorses him; he will campaign outside the city as time permits, "perhaps four trips."
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2313. Names: Lindsay, Nixon.'
      tags:
      - name:lindsay-john-v
      - name:nixon-richard-m
      - city:nyc
- add:
    entry:
      id: cal.1968-08-21.elections-1968-4
      when: Aug. 21
      date: '1968-08-21'
      thread: elections-1968
      c: 'New York. Brooke, after meeting Nixon, endorses the ticket: Agnew "certainly not a racist. In my view he''s a progressive."'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2313. Names: Brooke, Agnew, Nixon.'
      tags:
      - name:brooke-edward-w
      - name:agnew-spiro-t
      - name:nixon-richard-m
      - city:nyc
- add:
    entry:
      id: cal.1968-08-21.vietnam-paris
      when: Aug. 21
      date: '1968-08-21'
      thread: vietnam-paris
      c: 'Paris. Jorden of the American delegation: third parties have several times taken part in the efforts to end the war, some not yet made public.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2337. Names: Jorden.'
      tags:
      - name:jorden-william-j
- add:
    entry:
      id: cal.1968-08-22.vietnam-operations
      when: Aug. 22
      date: '1968-08-22'
      thread: vietnam-operations
      c: 'Saigon shelled again after two months: two rockets on the National Assembly building; rockets at the airbase at Biên Hòa.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2337.'
      tags:
      - place:saigon
      - place:bien-hoa-air-base
- add:
    entry:
      id: cal.1968-08-22.elections-1968-chicago-2
      when: Aug. 22
      date: '1968-08-22'
      thread: elections-1968-chicago
      also:
      - vietnam
      c: 'Chicago, 9:38 a.m. The Platform Committee''s hearings resume, Boggs in the chair. Alioto: the States to share revenues with their cities. Stokes: the welfare system "inappropriate in concept." 12:30 p.m., Connally against the doves and McCarthy: if Hanoi did not respond, "our only alternative is abject surrender." From 2:45 p.m., three panels.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2292. See [[cal.1968-08-20.elections-1968-chicago-2]]. Names: Boggs, Alioto, Stokes, Connally, McCarthy.'
      tags:
      - name:boggs-hale
      - name:alioto-joseph-l
      - name:stokes-carl-b
      - name:connally-john
      - name:mccarthy-eugene-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-22.elections-1968-chicago-3
      when: Aug. 22
      date: '1968-08-22'
      thread: elections-1968-chicago
      c: 'Chicago. The Credentials Committee''s sixth session of hearings: Wisconsin, North Carolina, and part of the Tennessee delegation; in executive session from 8:30 p.m. to 1:15 a.m.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2292. See [[cal.1968-08-19.elections-1968-chicago-5]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-22.elections-1968-chicago-4
      when: Aug. 22
      date: '1968-08-22'
      thread: elections-1968-chicago
      also:
      - rules
      c: 'Chicago. The Rules Committee, Shapiro of Illinois chairman, its first public hearing. Harold Hughes, chairman of the new Commission on the Democratic Selection of Presidential Nominees: to "rectify" the apportionment of the delegations'' votes, "equal representation" at the convention of 1972, changes in procedure. In the afternoon, the unit rule.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2287, 2292. Names: Shapiro, Harold E. Hughes.'
      tags:
      - name:shapiro-samuel-h
      - name:hughes-harold-e
