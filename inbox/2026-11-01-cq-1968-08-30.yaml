      c: 'Oklahoma''s primary. Democratic, for the Senate: Monroney over Owens, 282,011 to 32,696, 80.3 percent, Leeds 22,929, 6.5 percent, Marcus 11,105, 3.2 percent, Brown 2,588, 0.7 percent. Bellmon, once governor, unopposed for the Republican nomination. American Independent: Washington over Hiniker, 435 to 244, 64.1 percent.'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2314 (almost complete returns). To check: [Okla. State Election Bd., *Election Results, 1968–1974*](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf). See [[cal.1968-08-27.state-constitutions-ok]]. Names: Monroney, Bellmon.'
