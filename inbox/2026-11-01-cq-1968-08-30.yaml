      c: '10:09 p.m. Muskie''s acceptance: to work with "the strong determination of so many young people and disadvantaged among us to make a place for themselves."'
      n: '[[w.cq-weekly-report]], Aug. 30, 1968, 2284, 2338. See [[cal.1968-08-29.elections-1968]]. Names: Muskie.'
