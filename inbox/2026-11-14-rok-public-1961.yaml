patch: 2026-11-14-rok-public-1961
by: 'Claude (Reader B, the ROK pilot, Nov. 14, 2026: the Official Gazette, nos. 2856–2889, May 16–June 22, 1961, read from the page images)'
ops:
- add:
    entry:
      id: cal.1961-05-16.korea-leadership-5
      when: May 16
      date: '1961-05-16'
      thread: korea-leadership
      also:
      - korea
      c: 'Seoul. The Military Revolutionary Committee, Lt. Gen. Chang Do-young chairman, proclaims martial law over the whole country from 9 a.m., Park Chung Hee deputy martial-law commander: assemblies, press and travel abroad barred, curfew 7 p.m. to 5 a.m.; bank accounts frozen, airports and ports closed, prices held at the May 15 level. Proclamation 4: the Committee takes all power from Chang Myon''s government as of 7 a.m., dissolves the Assembly and the local councils at 8 p.m., bans party activity, orders the cabinet arrested.'
      n: '[[w.kwanbo]], [no. 2856 (May 16, 1961), 1–2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647885&actionType=date) (Committee Decrees 1–2, Proclamations 1–8). See [[cal.1961-05-16.japan-and-korea]]. Check: Proclamation 4, the item dissolving the legislatures, is read on a damaged line of the page image. Names: Chang Do-young, Park, Chang Myon.'
      tags:
      - name:park-chung-hee
      - name:chang-myon
      - polity:rok
- add:
    entry:
      id: cal.1961-05-17.korea-leadership-3
      when: May 17
      date: '1961-05-17'
      thread: korea-leadership
      also:
      - korea
      c: Proclamations 9–11, Chang Do-young, chairman. Curfew cut to 10 p.m.–5 a.m. Arrest, detention and search in the martial-law area without a court warrant where the revolution needs it; cases it needs go to a military court. Judges and prosecutors to clear civil and criminal cases promptly and without favor; the Chief Justice and the Justice Minister to report their progress to him.
      n: '[[w.kwanbo]], [no. 2857 (May 17, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647886&actionType=date) (Committee Proclamations 9–11). See [[cal.1961-05-16.korea-leadership-5]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-18.korea-leadership-3
      when: May 18–20
      date: '1961-05-18'
      thread: korea-leadership
      also:
      - korea
      c: 'The Military Revolutionary Committee names its members, Decree 3, at 4 p.m. Decree 4 renames it the Supreme Council for National Reconstruction from May 20: Chang Do-young chairman, Park Chung Hee vice-chairman.'
      n: '[[w.kwanbo]], [no. 2860 (May 20, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647889&actionType=date) (Committee Decrees 3 and 4, both dated May 18). See [[cal.1961-05-16.korea-leadership-5]]. Names: Chang Do-young, Park.'
      tags:
      - name:park-chung-hee
      - polity:rok
- add:
    entry:
      id: cal.1961-05-18.korea-leadership-4
      when: May 18
      date: '1961-05-18'
      thread: korea-leadership
      also:
      - korea
      c: 'Proclamation 13. Non-political marches by students, working people, religious bodies and citizens in support of the revolution allowed, with notice to the local authority; the freeze lifted on foreigners'' accounts, the diplomatic corps and the U.N. command; ordinary dealings with foreign banks resumed. Proclamations 12 and 14–16 the same day: public works go on, details of the freeze, coastal shipping may sail.'
      n: '[[w.kwanbo]], [no. 2858 (May 18, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647887&actionType=date) (Committee Proclamations 12–16). See [[cal.1961-05-17.korea-leadership-3]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-19.korea-leadership-3
      when: May 19
      date: '1961-05-19'
      thread: korea-leadership
      also:
      - korea
      c: Proclamation 18, Chang Do-young. Communist activity a danger to the state. Severe punishment for forming or joining an anti-state body, for praising or helping it, for taking its orders or its money, and for making or spreading its papers; the Communist party and bodies acting with it are such a body.
      n: '[[w.kwanbo]], [no. 2859 (May 19, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647888&actionType=date) (Committee Proclamation 18; the page image is printed upside down). See [[cal.1961-05-18.korea-leadership-3]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-19.korea-leadership-4
      when: May 19–June 19
      date: '1961-05-19'
      thread: korea-leadership
      also:
      - korea
      c: Proclamation 17, Chang Do-young. One month, May 20 to June 19, to turn in unlicensed firearms, blades and explosives; no charge for those who report in the time, severe punishment after.
      n: '[[w.kwanbo]], [no. 2859 (May 19, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647888&actionType=date) (Committee Proclamation 17). See [[cal.1961-05-19.korea-leadership-3]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-20.korea-leadership-5
      when: May 20
      date: '1961-05-20'
      thread: korea-leadership
      also:
      - korea
      c: 'The Supreme Council names the cabinet, Decree 3: Chang Do-young Defense, Kim Hong-il (a reserve lieutenant general) Foreign, Han Sin Home, Paek Son-un Finance, Ko Won-jung Justice, seven other ministers, a secretariat chief and a Minister of Public Information, the others by their army, navy, marine or air force ranks. Decree 4 names members of its subcommittees.'
      n: '[[w.kwanbo]], [no. 2860 (May 20, 1961), 1–2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647889&actionType=date) (Supreme Council Decrees 3 and 4). See [[cal.1961-05-18.korea-leadership-3]]. Names: Chang Do-young, Kim Hong-il, Han Sin, Paek Son-un, Ko Won-jung.'
      tags:
      - name:kim-hong-il
      - polity:rok
- add:
    entry:
      id: cal.1961-05-20.korea-leadership-6
      when: May 20
      date: '1961-05-20'
      thread: korea-leadership
      also:
      - korea
      c: Supreme Council Proclamation 1. The ban on citizens leaving the country lifted, but not for Communist sympathizers, opponents of the revolution, holders of illicit wealth and others found unfit; travel on public business, students, those returning to homes abroad and a few more excepted.
      n: '[[w.kwanbo]], [no. 2860 (May 20, 1961), 2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647889&actionType=date) (Supreme Council Proclamation 1). See [[cal.1961-05-20.korea-leadership-5]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-21.korea-leadership-3
      when: May 21
      date: '1961-05-21'
      thread: korea-leadership
      also:
      - korea
      c: 'Supreme Council Decrees 5–7. Decree 5: every officer, soldier and army civilian to keep to the rules; no leaving the post, no drink in working hours, no restaurants, dance halls, billiard rooms or tea rooms. Decree 6: a long list of generals and colonels relieved or moved, and army colonels set over the Audit Board, the Inspection Commission and the coal and electric companies. Decree 7: the Home Ministry''s security director named.'
      n: '[[w.kwanbo]], [no. 2861 (May 21, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647890&actionType=date) (Supreme Council Decrees 5–7). See [[cal.1961-05-20.korea-leadership-5]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-22.korea-leadership-2
      when: May 22
      date: '1961-05-22'
      thread: korea-leadership
      also:
      - korea
      c: Supreme Council Proclamation 6. All political parties and social organizations dissolved as of May 23. Relief, scholarly and religious bodies without politics, and others the Council allows, to register by May 31.
      n: '[[w.kwanbo]], [no. 2862 (May 22, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647891&actionType=date) (Supreme Council Proclamations 5–10). See [[cal.1961-05-20.korea-leadership-5]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-22.korea-leadership-3
      when: May 22
      date: '1961-05-22'
      thread: korea-leadership
      also:
      - korea
      c: Supreme Council Proclamation 9. Parades and events in support of the revolution barred from May 23; Committee Proclamation 13 of May 18 void.
      n: '[[w.kwanbo]], [no. 2862 (May 22, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647891&actionType=date) (Supreme Council Proclamation 9). See [[cal.1961-05-18.korea-leadership-4]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-23.korea-leadership-4
      when: May 23
      date: '1961-05-23'
      thread: korea-leadership
      also:
      - korea
      c: Supreme Council Proclamation 11, on the press. A newspaper to have its own printing plant, a news agency its own receiving equipment; registrations broken by violations and those of irregular periodicals canceled; no new registrations for the present.
      n: '[[w.kwanbo]], [no. 2863 (May 23, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647892&actionType=date) (Supreme Council Proclamation 11; the page image is printed upside down). See [[cal.1961-05-22.korea-leadership-2]]. Check: the first lines of the proclamation, on its purpose, are read in part. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-25.korea-leadership-2
      when: May 25
      date: '1961-05-25'
      thread: korea-leadership
      also:
      - korea
      c: Supreme Council Decree 12, on rural debt. Debts of farmers and fishermen at more than two-tenths a year in interest, in cash or kind, are "high-interest debt"; creditors and debtors to report it; the claim cut to what the government fixes, the state to lend the farmer the sum.
      n: '[[w.kwanbo]], [no. 2865 (May 25, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647894&actionType=date) (Supreme Council Decree 12, effective noon May 25). See [[cal.1961-05-20.korea-leadership-5]]. Check: the decree''s terms of repayment are read in part. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-27.korea-leadership-4
      when: May 27
      date: '1961-05-27'
      thread: korea-leadership
      also:
      - korea
      c: Supreme Council Decree 15. The extraordinary martial law of May 16, which President Yun Po-sun approved May 18, lifted at noon May 27 and precautionary martial law declared. The commander keeps domestic defense and counterespionage, and supports the administration and the courts on request; military trials under Proclamation 10 go on.
      n: '[[w.kwanbo]], [no. 2867 (May 27, 1961), supp. 2, 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647896&actionType=date) (Supreme Council Decree 15). See [[cal.1961-05-16.korea-leadership-5]]. Check: the wording on the commander''s support of the courts is read in part. Names: Chang Do-young, Yun.'
      tags:
      - name:yun-po-sun
      - polity:rok
- add:
    entry:
      id: cal.1961-05-27.korea-leadership-5
      when: May 27
      date: '1961-05-27'
      thread: korea-leadership
      also:
      - korea
      c: Supreme Council Decree 17. All functions of the special courts and special prosecutors' offices stopped from noon.
      n: '[[w.kwanbo]], [no. 2867 (May 27, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647896&actionType=date) (Supreme Council Decree 17). See [[cal.1961-05-27.korea-leadership-4]]. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-28.korea-leadership
      when: May 28
      date: '1961-05-28'
      thread: korea-leadership
      also:
      - korea
      c: 'Supreme Council Decree 20, the outline for dealing with illicit wealth. Officials, politicians and businessmen who took public property or used power or contracts between July 1, 1953 and May 15, 1961: 50 million hwan for an official, 200 million for a businessman. A committee under the Council to investigate and dispose, officials in three months, others in a month. Decree 22 the same issue stops the earlier special law.'
      n: '[[w.kwanbo]], [no. 2868 (May 28, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647897&actionType=date) (Supreme Council Decree 20). See [[cal.1961-05-27.korea-leadership-4]]. Check: Decree 22 is read by its title only; the thresholds are read in part. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-06-05.korea-leadership-3
      when: June 5
      date: '1961-06-05'
      thread: korea-leadership
      also:
      - korea
      c: 'Supreme Council Decree 39. Changes in the Central Intelligence Agency''s bureaus: two bureau chiefs relieved, others named, Kim Chong-p''il among them.'
      n: '[[w.kwanbo]], [no. 2875 (June 5, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647904&actionType=date) (Supreme Council Decree 39). See [[cal.1961-05-21.korea-leadership-3]]. Check: the page image is too coarse to say which post Kim Chong-p''il takes, or the ranks. Names: Kim Chong-p''il.'
      tags:
      - name:kim-chong-pil
      - polity:rok
- add:
    entry:
      id: cal.1961-06-05.korea-leadership-4
      when: June 5
      date: '1961-06-05'
      thread: korea-leadership
      also:
      - korea
      c: 'President Yun Po-sun signs a general amnesty, Cabinet Decree 8, Chang Do-young countersigning: offenses to June 5 against the curfew, the road rules and the minor-offenses law pardoned.'
      n: '[[w.kwanbo]], [no. 2875 (June 5, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647904&actionType=date) (Cabinet Decree 8). See [[cal.1961-05-27.korea-leadership-4]]. Names: Yun, Chang Do-young.'
      tags:
      - name:yun-po-sun
      - polity:rok
- add:
    entry:
      id: cal.1961-06-06.korea-leadership-3
      when: June 6
      date: '1961-06-06'
      thread: korea-leadership
      also:
      - korea
      c: 'Supreme Council Decree 42, the Law on Extraordinary Measures for National Reconstruction. The Council the supreme organ of rule until a government is formed after elections; twenty to thirty members, a chairman and vice-chairman chosen from them; the cabinet named with its consent and under its direction; martial law, the budget, pardons and senior appointments for its vote; the Constitution set aside where it conflicts; the Constitutional Court suspended. Decrees 40 and 41 the same issue: cattle slaughter, forest produce.'
      n: '[[w.kwanbo]], [no. 2876 (June 6, 1961), 1–2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647905&actionType=date) (Supreme Council Decree 42). See [[cal.1961-05-20.korea-leadership-5]]. Check: Articles 6–10, 12–14 and 16–19 are read in part. Names: Chang Do-young.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-06-10.korea-leadership-4
      when: June 10
      date: '1961-06-10'
      thread: korea-leadership
      also:
      - korea
      c: 'President Yun Po-sun promulgates the Supreme Council Law, Law 618, Chang Do-young countersigning: standing committees and subcommittees by ministry, planning committees, a Central Intelligence Department "to remove Communist indirect aggression", a secretariat, a Public Information Office, the Reconstruction National Movement headquarters. Laws 619, the Central Intelligence Agency Law, and 620, on rural debt, the same issue.'
      n: '[[w.kwanbo]], [no. 2879 (June 10, 1961), supp. 1, 1–2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647909&actionType=date) (Law 618; Laws 619 and 620 by title only). See [[cal.1961-06-06.korea-leadership-3]]. Check: Law 619 is not read. Names: Yun, Chang Do-young.'
      tags:
      - name:yun-po-sun
      - polity:rok
- add:
    entry:
      id: cal.1961-06-12.korea-leadership-2
      when: June 12
      date: '1961-06-12'
      thread: korea-leadership
      also:
      - korea
      c: President Yun Po-sun promulgates Law 621, on registration of social organizations, Chang Do-young countersigning. Relief, scholarly and religious bodies register with the Home Ministry, those of Proclamation 6 with the Minister of Public Information; the Home Ministry may dissolve one that harms the state; groups registered under the Council's earlier order dissolved unless re-registered in fifteen days.
      n: '[[w.kwanbo]], [no. 2880 (June 12, 1961), supp. 1, 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647910&actionType=date) (Law 621). See [[cal.1961-05-22.korea-leadership-2]]. Names: Yun, Chang Do-young.'
      tags:
      - name:yun-po-sun
      - polity:rok
- add:
    entry:
      id: cal.1961-06-14.korea-leadership-3
      when: June 14
      date: '1961-06-14'
      thread: korea-leadership
      also:
      - korea
      c: President Yun Po-sun promulgates the Illicit Wealth Disposition Law, Law 623, Chang Do-young, Paek Son-un and Ko Won-jung countersigning. Officials and politicians who took 50 million hwan or more by their posts, and businessmen 200 million or more, from July 1, 1953 to May 15, 1961, and those who sent property abroad, to give it up.
      n: '[[w.kwanbo]], [no. 2882 (June 14, 1961), supp. 1, 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647912&actionType=date) (Law 623). See [[cal.1961-05-28.korea-leadership]]. Check: the penalties are read in part. Names: Yun, Chang Do-young, Paek Son-un, Ko Won-jung.'
      tags:
      - name:yun-po-sun
      - polity:rok
- add:
    entry:
      id: cal.1961-06-22.korea-leadership-4
      when: June 22
      date: '1961-06-22'
      thread: korea-leadership
      also:
      - korea
      c: President Yun Po-sun promulgates Law 633, the Special Crimes Punishment Law, under Article 22 of the Extraordinary Measures Law. Death, life or long terms for murder, injury or arson tied to elections, and for organized or habitual smuggling of 50 million hwan or more. Laws 631 and 632, the information ministry's bureaus and a national film office, the same issue.
      n: '[[w.kwanbo]], [no. 2889 (June 22, 1961), 1](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647919&actionType=date) (Laws 631–633). See [[cal.1961-06-06.korea-leadership-3]]. Check: the later articles are not read. Names: Yun, Chang Do-young, Ko Won-jung.'
      tags:
      - name:yun-po-sun
      - polity:rok
