- edit:
    id: cal.1966-08-04.open-housing
    base: 4376f2bd
    set:
      n: '[[w.branch-at-canaans-edge]], 509; [[w.ralph-northern-protest]], 122; [[w.ralph-northern-protest]], 143; [[w.anderson-confronting-the-color-line]], 226–27 (King and Raby three hours with the Negro leaders of the Democratic organization); [[w.cohen-american-pharaoh]], 394–95 (the meeting of Daley''s Negro aldermen and legislators with King and Raby, three hours, Despres there; Metcalfe''s arm round King). After [[cal.1966-08-04.open-housing-2|the meeting at the YMCA]]: the meeting Thursday morning (Ralph, 143), the mass meeting Thursday night (Branch, 509). Check: Ralph gives two thousand at New Friendship (122). Check: Anderson: a dozen aldermen and State representatives, for open housing legislation, more bank loans to Negroes, building standards and racial head counts, against replacing the absentee precinct captains; Jackson''s announcement that King would lead the weekend''s march (226–27). Check: Cohen and Taylor do not date the meeting (394–95). To check: [[w.garrow-bearing-the-cross]], 499 (cited by [[w.branch-at-canaans-edge]], 509); Speech excerpts, "MLK Rally with Mahalia Jackson," Aug. 4, 1966, A/KS (cited by [[w.branch-at-canaans-edge]], 509); Urban Affairs Weekly Report, Aug. 7, 1966, AFSC papers, 1966 CRD Housing Program, box 4, AFSC Archives (cited by [[w.ralph-northern-protest]], 122 n.88). See [[cal.1966-07-31.open-housing]]. Names: King, Raby, Daley.'
- edit:
    id: cal.1966-08-18.china-leadership-11
    base: e9ed292d
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 323 (Aug. 18, 1966; the Wengao prints the words as Mao''s of 1966, from *Renmin ribao*, Aug. 19, 1966; note 1); [[w.yang-jisheng-tiandi-fanfu]], I, 240 (the celebration opens at 7:30 a.m. 早晨7：30; Mao and Lin Biao come out to the marble balustrade and wave to the million with their little red books; Lin speaks: "the supreme commander of this great proletarian cultural revolution is our Chairman Mao, the commander in chief"; Zhou Enlai also speaks to encourage the Red Guards; hundreds of thousands of Red Guards of the middle schools wait on East Chang''an Avenue and file past the rostrum); [[w.pu-weihua-zalan-jiu-shijie]], 256, 256 n.113 (Zhou at the first reception: a warm welcome to the students and staff come from all over the country; the Peking students and those from elsewhere to learn from and help each other and exchange revolutionary experience; the capital''s students the hosts). After [[cal.1966-08-18.china-leadership-6|Lin Biao''s speech]], in the sequence of [[w.mao-zedong-zhuan]], VI, ch. 75. Names: Zhou Enlai, Mao Zedong. Check: the day of Mao''s words; the Wengao dates them 1966.'
- edit:
    id: cal.1966-08-18.china-leadership-17
    base: 60d0187a
    set:
      n: '[[w.pu-weihua-zalan-jiu-shijie]], 206. After [[cal.1966-08-18.china-leadership-11|Zhou Enlai''s speech]], in the sequence of [[w.mao-zedong-zhuan]], VI, ch. 75. See [[cal.1966-08-18.china-leadership-6]]. Names: Nie Yuanzi.'
- edit:
    id: cal.1966-08-18.china-leadership-7
    base: b30a7ede
    set:
      n: '[[w.macfarquhar-maos-last-revolution]], 108; [[w.jianguo-yilai-mao-zedong]], XVIII, 322 (Aug. 18, 1966; his words to Lin Biao on the Tiananmen rostrum as they reviewed the parade, printed from *Renmin ribao*, Aug. 19, 1966); [[w.mao-zedong-zhuan]], VI, ch. 75 n.3 (as he reviewed the marchers Mao said, ''the movement is on a very large scale, it has truly roused the masses, and means much for the revolutionization of the whole people''s thinking'', n.3; addressee not given). After [[cal.1966-08-18.china-leadership-17|the delegates'' speeches]]: the parade passes the rostrum after the speeches, and Mao speaks as he reviews it, in the sequence of the *Mao Zedong zhuan* (VI, ch. 75). Made public: 1998. To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 107 (cited by [[w.macfarquhar-maos-last-revolution]], 108 n.25); *Renmin ribao* 《人民日报》, Aug. 19, 1966 (the Xinhua report of the rally of Aug. 18) (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.3). See [[cal.1966-08-18.india-and-china-cultural-revolution]]. Names: Mao Zedong, Lin Biao. Check: "at some point" in the rally of over six hours (108); the wengao''s year is that of vol. XII.'
- edit:
    id: cal.1966-08-20.vietnam-support
    base: f1e85c0e
    set:
      n: '[[w.johnson-white-house-diary]], 413 (Lady Bird Johnson''s account). After [[cal.1966-08-20.open-housing-2|Kingston]], in Lady Bird Johnson''s sequence (412–13). To check: the Public Papers, remarks to the Navy League, Aug. 20, 1966. Names: Johnson.'
- edit:
    id: cal.1966-08-20.conservation
    base: d471fe2a
    set:
      n: '[[w.johnson-white-house-diary]], 413–14 (Lady Bird Johnson''s account). After [[cal.1966-08-20.vietnam-support|Manchester]], in Lady Bird Johnson''s sequence ("Our next stop," 413). To check: the Public Papers, remarks at Burlington, Aug. 20, 1966. Names: Johnson, Hoff, Aiken.'
- edit:
    id: cal.1966-08-20.economy
    base: ab820ddc
    set:
      n: '[[w.johnson-white-house-diary]], 414 (Lady Bird Johnson''s account). The words in quotation marks are Mrs. Johnson''s. After [[cal.1966-08-20.conservation|Burlington]], in Lady Bird Johnson''s sequence ("Our next hop," 414). To check: the Public Papers, remarks at Lewiston, Aug. 20, 1966. Names: Johnson, Margaret Chase Smith, Muskie.'
- edit:
    id: cal.1966-08-20.program
    base: ec054391
    set:
      n: '[[w.johnson-white-house-diary]], 414 (Lady Bird Johnson''s account). After [[cal.1966-08-20.economy|Lewiston]], in Lady Bird Johnson''s sequence (414). Names: Johnson, Lady Bird Johnson.'
- edit:
    id: cal.1966-08-21.open-housing
    base: 5108131a
    set:
      n: '[[w.branch-at-canaans-edge]], 520; [[w.ralph-northern-protest]], 162–64; [[w.anderson-confronting-the-color-line]], 258 (South Deering, Chicago Heights, Evergreen Park, in rain; Rockwell in Marquette Park); [[w.cohen-american-pharaoh]], 416. After [[cal.1966-08-21.civil-rights-organizations|*Meet the Press*]]: King leaves the broadcast early, goes to Liberty Baptist, and then leads the afternoon march (Branch, 520). Check: Ralph has Jerry Davis of the AFSC lead three hundred in Chicago Heights, Bevel and Jesse Jackson two hundred in Evergreen Park (163), and King''s march into Cicero announced Aug. 20 for Aug. 28 (166). Check: Anderson puts King''s announcement of the Cicero march on Saturday, Aug. 20 (257–58), and gives Rockwell a crowd of fifteen hundred (258). To check: Investigator''s report dated Aug. 22, 1966, File 940, RS, CHS (cited by [[w.branch-at-canaans-edge]], 520); "Dr. King and 500 Jeered in 5-Mile Chicago March," [*New York Times*, Aug. 22, 1966](https://timesmachine.nytimes.com/timesmachine/1966/08/22/issue.html), p. | (cited by [[w.branch-at-canaans-edge]], 520); Garrow, *Chicago 1966* (1989), 82 (cited by [[w.branch-at-canaans-edge]], 520); [*New York Times*, Aug. 22, 1966](https://timesmachine.nytimes.com/timesmachine/1966/08/22/issue.html), at 37 (cited by [[w.branch-at-canaans-edge]], 520); bid., p. 166 (cited by [[w.branch-at-canaans-edge]], 520); [[w.garrow-bearing-the-cross]], 517–18 (cited by [[w.branch-at-canaans-edge]], 520); *Chicago Tribune*, Aug. 22, 1966, at 1–2 (cited by [[w.ralph-northern-protest]], 164 n.104); *Chicago Sun-Times*, 22 August 1966 (cited by [[w.anderson-confronting-the-color-line]], 258 n.15). See [[cal.1966-08-19.open-housing]]. Names: King.'
- edit:
    id: cal.1966-08-25.china-leadership-16
    base: d57e7c44
    set:
      n: '[[w.pu-weihua-zalan-jiu-shijie]], 124. After [[cal.1966-08-25.china-leadership|Mao''s reception of the Tanzanian delegation]]: the bureau, told that Pan was kept from it, puts up its poster at once and marches that afternoon (124). Made public: 1999 (Chen Hong, *Dangshi bolan*). To check: Chen Hong 陳虹, 〈總參「八·二五」事件〉, *Dangshi bolan* 《黨史博覽》, 1999, no. 9, 21–22 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 124 n.65). See [[cal.1966-08-25.china-leadership-3]]. Names: Mao Zedong, Yang Chengwu.'
- edit:
    id: cal.1966-08-26.china-leadership-14
    base: 7cba9da9
    set:
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 664; [[w.dikotter-cultural-revolution]], 78 n.30, n.31 (the local cadres order all landlords and bad elements and their offspring killed, on a rumour of revenge; a night of butchery across several communes, more than 300 killed; a PLA officer telephones Peking, a report goes at once to the Cultural Revolution Group; nobody lifts a finger). After [[cal.1966-08-26.china-leadership-6|the bureau''s meeting]] that relayed Xie Fuzhi''s speech and put Zhang in charge of liaison with the Red Guards, in Yang''s sequence (II, 664). The words: 8 月 26 日下午 (II, 664). Made public: 2010. To check: Sun Yancheng 孫言誠, 〈「血統論」和大興「八三一事件」〉, *Yanhuang chunqiu* 《炎黃春秋》, 2012, no. 2 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 663 n.2a); Yu Luowen 遇羅文, 〈北京大興文革屠殺調查〉 (web, May 4, 2010) (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 663 n.2b).'
- edit:
    id: cal.1966-08-27.china-leadership-10
    base: d044829a
    set:
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 663. After [[cal.1966-08-27.china-leadership-9|the relay of Xie Fuzhi''s speech]], upon which the county began to act (於是), in Yang''s sequence (II, 663). Made public: 2010. To check: Sun Yancheng 孫言誠, 〈「血統論」和大興「八三一事件」〉, *Yanhuang chunqiu* 《炎黃春秋》, 2012, no. 2 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 663 n.2a); Yu Luowen 遇羅文, 〈北京大興文革屠殺調查〉 (web, May 4, 2010) (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 663 n.2b).'
- edit:
    id: cal.1966-08-27.china-leadership-11
    base: 12d222ab
    set:
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 663. After [[cal.1966-08-27.china-leadership-10|the commune''s meeting]]: "that evening" (當晚), in Yang''s sequence (II, 663). The words: 當晚 (II, 663). To check: Sun Yancheng 孫言誠, 〈「血統論」和大興「八三一事件」〉, *Yanhuang chunqiu* 《炎黃春秋》, 2012, no. 2 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 663 n.2a); Yu Luowen 遇羅文, 〈北京大興文革屠殺調查〉 (web, May 4, 2010) (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 663 n.2b).'
- edit:
    id: cal.1966-08-31.china-leadership-9
    base: 76a38539
    set:
      n: '[[w.macfarquhar-maos-last-revolution]], 114; [[w.pu-weihua-zalan-jiu-shijie]], 257, 257 n.116 (Zhou at the second reception: students from all over come to Peking to exchange experience and Peking students go out for revolutionary exchange, "a very good thing; we support you"; the Center has decided that all college students and part of the middle-school students of the country are to come to Peking by stages and batches). After [[cal.1966-08-31.china-leadership-8|Lin Biao''s speech]]: Zhou "concurred" (MacFarquhar, 114). To check: [[w.wuchanjieji-wenhua-dageming-wan]], I, 55, 148–149 (cited by [[w.macfarquhar-maos-last-revolution]], 114 n.60). See [[cal.1966-08-31.china-leadership-8]]. Names: Zhou Enlai.'
- edit:
    id: cal.1966-08-31.china-leadership-10
    base: 4395f332
    set:
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 666. After [[cal.1966-08-31.china-leadership-5|the commune''s meeting]], the one at which not all the brigade cadres would carry out the order ([[w.macfarquhar-maos-last-revolution]], 129). To check: Sun Yancheng 孫言誠, 〈「血統論」和大興「八三一事件」〉, *Yanhuang chunqiu* 《炎黃春秋》, 2012, no. 2 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 663 n.2a); Yu Luowen 遇羅文, 〈北京大興文革屠殺調查〉 (web, May 4, 2010) (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 663 n.2b). See [[cal.1966-08-31.china-leadership-5]]. Check: the day (the page: the night the nine-man group ordered the killing; the commune''s killing that night, Aug. 31, II, 665).'
