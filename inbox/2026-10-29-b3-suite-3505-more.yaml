      when: Nov.
      date: 1960-11
      thread: elections-1960
      c: After the election. White, director of organization for the Volunteers for Nixon-Lodge, has his field men check the reports of fraud in Illinois, Missouri, South Carolina and Texas, and puts them
        to Hall, the campaign manager, who seems ready to contest the returns. From Puerto Rico White hears Nixon will not; he telephones, unanswered. By White's account.
