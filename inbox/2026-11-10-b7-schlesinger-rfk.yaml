patch: 2026-11-10-b7-schlesinger-rfk
by: 'Claude (batch 7: the ''already in'' rows of Schlesinger, Robert Kennedy and His Times read against the calendar), Nov. 10-11, 2026'
ops:
- cite:
    id: 'cal.1960-12-07.transition-and-staff-cabinet'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 225–26 (Udall "the first position agreed upon," Clinton Anderson put off, by Robert Kennedy''s memorandum of 1961; the day not given)'
    units: 'A'
- to-check:
    id: 'cal.1960-12-07.transition-and-staff-cabinet'
    add:
    - 'Robert F. Kennedy, memorandum, Feb. 9, 1961, 5–6, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 226 n.13)'
- cite:
    id: 'cal.1960-12-15.transition-and-staff-cabinet'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 226–27 (Freeman chosen after Heinkel and McGovern, by Robert Kennedy''s memorandum; Goldberg, the President to him: "I am going to tell George Meany I''m appointing you"; the day not given)'
    units: 'A'
- to-check:
    id: 'cal.1960-12-15.transition-and-staff-cabinet'
    add:
    - 'Robert F. Kennedy, memorandum, Feb. 9, 1961, 5–6, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 226 n.13)'
- cite:
    id: 'cal.1961-01-24.foreign-aid'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 226–27 (McGovern to Food for Peace, Robert Kennedy''s offer when Agriculture went to Freeman, by his memorandum)'
    units: 'B'
- cite:
    id: 'cal.1960-12-01.transition-and-staff'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 227 (Ribicoff to HEW, having been offered Justice first; the day not given)'
    units: 'B'
- cite:
    id: 'cal.1960-12-17.transition-and-staff-cabinet'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 227 (Day chosen by telephone, the President wanting the cabinet finished, by Robert Kennedy''s memorandum; the day not given)'
    units: 'A'
- cite:
    id: 'cal.1961-01-20.transition-and-staff'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 236 (Robert Kennedy confirmed a week after the Judiciary Committee reported him unanimously, Gordon Allott of Colorado alone speaking against; the day not given)'
    units: 'B'
- cite:
    id: 'cal.1961-08.civil-rights-organizations'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 302 ("In August, after heated debate between ''direct action'' and ''voter registration'' wings, SNCC decided to join the campaign"; the foundations'' money and the promise of protection; Highlander and the day not named)'
    units: 'A'
- cite:
    id: 'cal.1962-04-01.voting-rights'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 302 (the Taconic, Field and Stern foundations; the tax exemption, worked out with Caplin, by Robert Kennedy''s account; not the day)'
    units: 'A'
- variant:
    id: 'cal.1962-04-01.voting-rights'
    unit: 'A'
    witness: 'w.schlesinger-robert-kennedy-and-his'
    reads: 'In January 1962 the Voter Education Project came into existence'
    at: '302'
- cite:
    id: 'cal.1961-05-14.freedom-rides'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 295 (Anniston, a bus burned, the second boarded; Birmingham, the Klan promised fifteen minutes by the police; Mother''s Day, Connor''s men off duty; Rowe, the FBI''s informer, had warned it, and the FBI told Kennedy nothing)'
    units: 'A-D'
- cite:
    id: 'cal.1961-05-15.freedom-rides'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 295 (Seigenthaler sent to Birmingham; the airlines'' bomb threats; he takes the riders by plane to New Orleans, the hour not given)'
    units: 'D'
- to-check:
    id: 'cal.1961-05-15.freedom-rides'
    add:
    - 'John Seigenthaler, recorded interview by Ronald J. Grele, Feb. 22, 1966, 305–09, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 295 n.48)'
- cite:
    id: 'cal.1961-05-19.robert-kennedy'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 296 (Seigenthaler with Patterson: "if federal marshals come into Alabama, there''ll be blood in the streets"; Floyd Mann: his troopers will protect the bus; by Seigenthaler''s account; the day not given)'
    units: 'D'
- to-check:
    id: 'cal.1961-05-19.robert-kennedy'
    add:
    - 'John Seigenthaler, recorded interview by Ronald J. Grele, Feb. 22, 1966, 314–24, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 296 n.50)'
- cite:
    id: 'cal.1961-05-20.freedom-rides'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 296–97 (the Montgomery terminal, Doar to Kennedy by telephone; Seigenthaler clubbed from behind, unconscious half an hour, FBI agents taking notes)'
    units: 'A-C'
- variant:
    id: 'cal.1961-05-20.freedom-rides'
    unit: 'D'
    witness: 'w.schlesinger-robert-kennedy-and-his'
    reads: 'On Sunday, May 21, Robert Kennedy sent in five hundred marshals with Byron White in command'
    at: '297'
- check:
    id: 'cal.1961-05-20.freedom-rides'
    text: 'Check: Schlesinger has the five hundred marshals sent in, White in command, on Sunday, May 21 (297).'
- cite:
    id: 'cal.1961-05-21.robert-kennedy-2'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 297 (King calls Kennedy at the Department of Justice; the marshals on their way; so long as he was in church, "he might say a prayer for us"; by Robert Kennedy''s account of 1964)'
    units: 'A-D'
- cite:
    id: 'cal.1961-05-21.freedom-rides-2'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 298 (Patterson: the affair would ruin them both politically; Kennedy: "Now, John, don''t tell me that. It''s more important that these people survive than for us to survive politically")'
    units: 'A-C'
- variant:
    id: 'cal.1961-05-21.freedom-rides-2'
    unit: 'C'
    witness: 'w.schlesinger-robert-kennedy-and-his'
    reads: '"It''s more important that these people survive than for us to survive politically."'
    at: '298'
- check:
    id: 'cal.1961-05-21.freedom-rides-2'
    text: 'Check: Schlesinger, from the same source (Guthman in *An Honorable Profession*, 20–21, 298 n.58), prints "It''s more important that these people survive than for us to survive politically" (298).'
- cite:
    id: 'cal.1961-05-22.robert-kennedy-2'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 298 (around four in the morning King berates Kennedy for letting it go on; "you''d be as dead as Kelsey''s nuts right now"; not the marshals'' withdrawal or the Time reporter)'
    units: 'A, D'
- to-check:
    id: 'cal.1961-05-22.robert-kennedy-2'
    add:
    - 'Robert F. Kennedy, recorded interview by Anthony Lewis, 1964, II, 20–21, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 298 n.59)'
- cite:
    id: 'cal.1961-05-24.freedom-rides'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 299 (the cooling-off period; Eastland''s word that the riders would be arrested on arriving in Jackson; Farmer: "If we got any cooler we''d be in a deep freeze"; the day not given)'
    units: 'A, C'
- cite:
    id: 'cal.1961-05-29.freedom-rides'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 300 ("On May 29," at the proposal of Katzenbach''s Office of Legal Counsel, Saloschin''s idea)'
    units: 'A'
- cite:
    id: 'cal.1961-09-22.freedom-rides'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 300 ("On September 22, 1961, the order was issued"; not Nov. 1)'
    units: 'A'
- cite:
    id: 'cal.1963-02-28.voting-rights'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 327 (the message; "Above all ... it is wrong"; its proposals, voting chief among them; Schlesinger dates it Feb. 23)'
    units: 'A'
- variant:
    id: 'cal.1963-02-28.voting-rights'
    unit: 'A'
    witness: 'w.schlesinger-robert-kennedy-and-his'
    reads: 'On February 23, 1963, John Kennedy finally submitted a legislative program on civil rights'
    at: '327'
- check:
    id: 'cal.1963-02-28.voting-rights'
    text: 'Check: Schlesinger dates the message Feb. 23 (327); the Public Papers, which he cites (327 n.49), print it under Feb. 28.'
- cite:
    id: 'cal.1963-04-14.alabama-birmingham'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 328 (Coretta King, unable to reach her husband, telephones the President; Robert Kennedy returns the call: "I promise you I will look into the situation"; the FBI in Birmingham checks that night; the day not given)'
    units: 'A, C'
- variant:
    id: 'cal.1963-04-14.alabama-birmingham'
    unit: 'B'
    witness: 'w.schlesinger-robert-kennedy-and-his'
    reads: 'His wife, unable to reach him, telephoned John Kennedy. She could not reach him either. Then Robert Kennedy returned her call'
    at: '328'
- check:
    id: 'cal.1963-04-14.alabama-birmingham'
    text: 'Check: Schlesinger has Coretta King call the President, and Robert Kennedy return the call (328).'
- cite:
    id: 'cal.1963-04-15.alabama-birmingham'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 328 ("The next day John Kennedy told Mrs. King that her husband was well"; King on the telephone to her fifteen minutes later)'
    units: 'A'
- cite:
    id: 'cal.1963-05-04.alabama-birmingham'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 329 (after the photographs of May 4, the Attorney General sends Burke Marshall and Joseph Dolan to Birmingham)'
    units: 'B'
- cite:
    id: 'cal.1963-05-08.alabama-birmingham-3'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 329 (King arrested again, Shuttlesworth ready to lead the marchers back; Dolan telephones the Attorney General; Kennedy''s talk with Shuttlesworth, by Andrew Young''s account; the march canceled; Kennedy secures King''s release; the day not given)'
    units: 'E'
- to-check:
    id: 'cal.1963-05-08.alabama-birmingham-3'
    add:
    - 'Andrew Young, recorded interview by Jean Stein, Sept. 9, 1968, 4, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 329 n.63)'
- cite:
    id: 'cal.1963-05-10.alabama'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 329 ("On May 10 the Birmingham settlement was announced": a measure of desegregation and black employment after a week of Marshall''s negotiations)'
    units: 'A-B'
- cite:
    id: 'cal.1963-07-23.civil-rights-the-executive'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 345 (the meeting Kennedy called in his office on Cambridge, by John Lewis''s account: "Before the meeting was over, people were talking to one another"; neither the terms nor the day)'
    units: 'B'
- to-check:
    id: 'cal.1963-07-23.civil-rights-the-executive'
    add:
    - 'John Lewis, recorded interview by Jean Stein, Sept. 9, 1968, 1–3, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 345 n.7)'
- cite:
    id: 'cal.1963-06-22.civil-rights-bill'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 349 (the cabinet room, June 22: the President against a march before the bill is in committee, "an atmosphere of intimidation"; Randolph, Farmer and King defend the march; by the author''s journal)'
    units: 'A-C'
- to-check:
    id: 'cal.1963-06-22.civil-rights-bill'
    add:
    - 'Schlesinger, journal, June 22, 1963, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 349 n.29)'
- cite:
    id: 'cal.1962-10-26.king'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 355 ("In October 1962 the Bureau leaked incriminating material about O''Dell to southern newspapers. Soon King placed him on temporary leave")'
    units: 'A-B'
- cite:
    id: 'cal.1963-07-03.king'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 358 (King to O''Dell "in ten days" after the meeting of June 22, his temporary resignation made permanent; the footnote dates the letter July 3; Levison, by his own account to the author, "I induced him to break," after Marshall and Young''s meeting at New Orleans, not dated)'
    units: 'A, C'
- cite:
    id: 'cal.1963-07-17.civil-rights-bill'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 358–59 (the press conference: "no evidence" that civil rights leaders are Communists or the demonstrations Communist-inspired, "a convenient scapegoat"; nothing else of it)'
    units: 'A'
- to-check:
    id: 'cal.1963-07-24.king'
    add:
    - 'Robert Kennedy to Monroney, July 23, 1963, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 359 n.73)'
- check:
    id: 'cal.1963-07-24.king'
    text: 'Check: Schlesinger has Kennedy write "senators," his letter to Monroney of July 23, 1963 and identical letters to others (359 n.73), not the Commerce Committee.'
- primary:
    id: 'cal.1963-12-24.king'
    text: '[S. Rep. No. 94-755, Book III, 133–34 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=147) (the conference of Dec. 23, nine hours, two agents of the Atlanta office; Sullivan to Belmont, Dec. 24, 1963, the six decisions quoted).'
    units: 'A'
- check:
    id: 'cal.1963-12-24.king'
    text: 'Check: the Church committee''s report prints the fifth decision "expose King as an opportunist who is not a sincere person" (Book III, 134), without "immoral."'
- cite:
    id: 'cal.1963-12-24.king'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 363 (the nine-hour session of Dec. 23, 1963, and a plan; the words it quotes for the plan, "a fraud, demagogue and scoundrel," "to take him off his pedestal," are Sullivan''s memorandum of Jan. 8, 1964, by the Church committee''s report, Book III, 136)'
    units: 'A'
- variant:
    id: 'cal.1963-12-24.king'
    unit: 'A'
    witness: 'w.schlesinger-robert-kennedy-and-his'
    reads: 'A nine-hour session on December 23, 1963, resulted in a plan ... to reveal King to the country "as being what he actually is - a fraud, demagogue and scoundrel"'
    at: '363'
- primary:
    id: 'cal.1964-01-08.king'
    text: '[S. Rep. No. 94-755, Book III, 136–37 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=150) (Sullivan to Belmont, Jan. 8, 1964, quoted; Hoover''s "o.k." and his note: "I am glad to see that ''light'' has finally, though dismally delayed, come to the Domestic Int. Div.").'
    units: 'A'
- cite:
    id: 'cal.1964-01-08.king'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 363 (the memorandum''s words and Hoover''s note, quoted; Schlesinger makes it the plan of the session of Dec. 23)'
    units: 'A'
- check:
    id: 'cal.1964-01-08.king'
    text: 'Check: Schlesinger (363) gives the memorandum''s words as the plan of the conference of Dec. 23, 1963; the Church committee''s report (Book III, 136) dates them Jan. 8, 1964.'
- check:
    id: 'cal.1963-12.king'
    text: 'Check: the day; Schlesinger (363) and the Church committee''s report (Book III, 133) date the nine-hour conference Dec. 23, 1963: the same meeting as [[cal.1963-12-24.king]]?'
- cite:
    id: 'cal.1963-07-01.civil-rights-bill'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 365 (Robert Kennedy''s statement, July 1, quoted: "The United States ... is dominated by white people, politically and economically"; "That, Mr. Chairman, is why Congress should enact this bill, and should do it in this session")'
    units: 'B'
