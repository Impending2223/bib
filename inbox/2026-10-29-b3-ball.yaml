      when: Oct. 19
      date: '1962-10-19'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: Evening. Ball, keeping his date to speak to the board of directors of the United States Chamber of Commerce, Rusk having canceled his speech at Hot Springs, Va., answers the questions on Cuba "in
        circumlocutions," by his account.
      n: '[[w.ball-past-has-another-pattern]], 293. See [[cal.1962-10-14.missile-crisis]]. Names: Ball, Rusk.'
      src:
