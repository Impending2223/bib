      when: Apr. 24
      date: '1968-04-24'
      thread: transition-and-staff
      c: 'Johnson telephones Ball at a board meeting of Standard Oil of California in San Francisco: Goldberg has resigned; take the UN for the rest of the year. Ball, a new partner of Lehman Brothers,
        demurs; Johnson has him promise to reflect overnight, by Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 436–37. See [[cal.1968-04-25.transition-and-staff]]. Names: Johnson, Ball, Goldberg.'
