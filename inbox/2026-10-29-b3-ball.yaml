      date: '1962-04-03'
      thread: european-community
      c: 'London. Ball, in a public statement on the neutral members of the EFTA, Sweden, Austria and Switzerland: some useful economic arrangements with the Community, but no free access to the Common
        Market for a country that will not accept its political commitments.'
      n: '[[w.ball-past-has-another-pattern]], 218–19. Check: the statement not read. See [[cal.1961-04-05.european-community]]. Names: Ball.'
