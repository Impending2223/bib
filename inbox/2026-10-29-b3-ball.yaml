      when: Jan. 20
      date: '1966-01-20'
      thread: vietnam-pause
      c: 'Ball to Johnson against resuming the bombing: it "may well frustrate the very political objectives we have in mind," no evidence it has weakened Ho Chi Minh''s determination; the Strategic Bombing
        Survey''s finding, "one does not break the will of the population of a police state by heavy bombing."'
      n: '[[w.ball-past-has-another-pattern]], 406. Check: the memorandum not read. Names: Ball, Johnson, Ho Chi Minh.'
