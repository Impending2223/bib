      date: '1965-01-11'
      thread: europe-and-the-alliance
      c: 'New York, the Council on Foreign Relations. Ball on Germany and the nuclear force: "We cannot count upon German willingness to resign themselves to a second-class status, nor upon our ability
        to compel Germany to do so"; the Germans not to be left isolated or aggrieved; hence a collective, seaborne multilateral force.'
      n: '[[w.ball-past-has-another-pattern]], 261–62. To check: Ball, Address before the Council on Foreign Relations, Jan. 11, 1965, manuscript, 14–15 (cited by [[w.ball-past-has-another-pattern]], 262
