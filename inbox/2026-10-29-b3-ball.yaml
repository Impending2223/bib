      - name:ball-george-w
- add:
    entry:
      id: cal.1962-10-12.latin-america-panama
      when: Oct. 12
      date: '1962-10-12'
      thread: latin-america-panama
      c: Panama. Ball dedicates the first high bridge over the Canal, named by Congress the Thatcher Ferry Bridge, for an official of the Canal of 1910–13; the Panamanians want it "the Bridge of the Americas."
        A mob breaks through the police lines; Ball cuts his speech short. The bronze name plates chiseled off, Panama's flag set on the span.
      n: '[[w.ball-past-has-another-pattern]], 326. Check: the day; Ball has the dedication at 9:30 on a Friday morning in October. Names: Ball.'
      src:
        c: 3a7c6ec2
        rows:
        - 'w.ball-past-has-another-pattern 326: all'
      tags:
      - name:ball-george-w
- add:
    entry:
      id: cal.1962-10-17.missile-crisis-2
      when: Oct. 17
      date: '1962-10-17'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: 'The ExComm in Ball''s conference room at State, the "Think Tank," Kennedy campaigning. Ball against an air strike: irreversible, and a great power acting against its own traditions loses its authority.
        By Ball''s account Robert Kennedy later puts it his way: a surprise strike another Pearl Harbor; "My brother is not going to be the Tojo of the 1960s."'
      n: '[[w.ball-past-has-another-pattern]], 290–91. Check: Ball does not date Robert Kennedy''s words. See [[cal.1962-10-14.missile-crisis]]. Names: Ball, Kennedy, Robert Kennedy.'
      src:
        c: 63bd8fd9
        rows:
        - 'w.ball-past-has-another-pattern 290–91: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-10-18.missile-crisis-5
      when: Oct. 18
      date: '1962-10-18'
      thread: missile-crisis
      c: 10 p.m., the White House. Nine of the ExComm in Ball's car, by way of the Treasury and the passage under the White House, to stay with the President past midnight. Kennedy leaning to a blockade;
        Sorensen to draft a speech. Chayes called home from Paris that night, by Ball's account.
      n: '[[w.ball-past-has-another-pattern]], 292–93. See [[cal.1962-10-18.missile-crisis-3]]. Names: Ball, Kennedy, Sorensen, Chayes.'
      src:
        c: cf11d224
        rows:
        - 'w.ball-past-has-another-pattern 292–93: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - name:chayes-abram
