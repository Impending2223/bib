      id: cal.1964-07.cyprus
      when: July
      date: 1964-07
      thread: cyprus
      c: 'Johnson, at Ball''s urging, to Papandreou and İnönü: find a solution by negotiation. Papandreou''s answer, by Ball''s account: an "ultimatum" like the Nazis'' of 1940; still, a delegate to Geneva.'
      n: '[[w.ball-past-has-another-pattern]], 356. Check: the days; the letters not read. Names: Johnson, Ball, Papandreou, İnönü.'
