      - name:erhard-ludwig
- add:
    entry:
      id: cal.1964-02-27.africa
      when: Feb. 27
      date: '1964-02-27'
      thread: africa
      c: 'Salazar to Ball, a reply of about the same length: Portugal''s overseas territories integrated, not dependent; the UN''s resolutions demand independence alone; full independence would guarantee
        neither the peoples'' progress nor a Portuguese "presence, influence and interest"; a program of evolution not feasible, given the revolutionary movement and "interests foreign to the African continent
        itself."'
      n: '[[w.ball-past-has-another-pattern]], 279–82. Check: the letter not read. See [[cal.1963-10-21.africa]]. Names: Salazar, Ball.'
      src:
        c: a609d2f2
        rows:
        - 'w.ball-past-has-another-pattern 279–82: all'
      tags:
      - name:salazar-antonio-de-oliveira
      - name:ball-george-w
- add:
    entry:
      id: cal.1964-01-25.cyprus
      when: Jan. 25
      date: '1964-01-25'
      thread: cyprus
      c: 'Stevenson to Ball, of Makarios, by Ball''s account: "a wicked, unreliable conniver"; the only way to deal with him "giving the old bastard absolute hell."'
      n: '[[w.ball-past-has-another-pattern]], 340–41. See [[cal.1964-01-25.europe-and-the-alliance]]. Names: Stevenson, Ball, Makarios III.'
      src:
        c: b5f20720
        rows:
        - 'w.ball-past-has-another-pattern 340–41: all'
      tags:
      - name:stevenson-adlai-e
      - name:ball-george-w
      - name:makarios-iii
- add:
    entry:
      id: cal.1964-01-28.cyprus
      when: Jan. 28
      date: '1964-01-28'
      thread: cyprus
      c: 'İnönü to Hare in Ankara, by Ball''s account: Turkey will invade Cyprus unless it has some kind of answer by the next morning. Bruce from London: the United States has no option but to take part
        in a force.'
      n: '[[w.ball-past-has-another-pattern]], 341. Check: Hare''s report not read. See [[cal.1964-01-25.europe-and-the-alliance]]. Names: İnönü, Hare, Bruce.'
      src:
