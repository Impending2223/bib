      c: 'London: the SEATO Council''s ministers, Ball for the United States, France an observer; then NATO''s foreign ministers, Ball the opening sessions, Rusk the end. Ball to Paris to see de Gaulle,
        with Johnson''s approval. De Gaulle: France and America to stand together, the alliance kept; NATO, a subordination, no longer suitable, France will withdraw from it, and no foreign forces on French
        soil but under French command. Ball: an integrated command needed; the multilateral force to be taken up again.'
      n: 'SEATO Council Ministers Hold 10th Meeting at London, [[w.department-of-state-bulletin]], [June 7, 1965, 920](https://archive.org/details/departmentofstat5265unit/page/920/mode/1up). [[w.ball-past-has-another-pattern]],
        331–33. Check: the days; the talk with de Gaulle not found in FRUS. Names: Ball, Rusk, de Gaulle, Johnson.'
