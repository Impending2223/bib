      - republican-party
      c: Herbert Hoover endorses Dodd's call for a Senate investigation of the UN's action in Katanga, its "naked aggression" and "atrocities."
      n: '[[w.ball-past-has-another-pattern]], 234. Check: Dodd''s statement not dated; neither read. See [[cal.1961-12-14.congo]]. Names: Dodd.'
