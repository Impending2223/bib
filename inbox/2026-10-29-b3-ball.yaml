- add:
    entry:
      id: cal.1963-11-20.trade
      when: Nov. 20
      date: '1963-11-20'
      thread: trade
      also:
      - europe-and-the-alliance
      c: '9:20 p.m. Ball, back from Paris, telephones Kennedy, by Ball''s account: the Common Market''s farm policy, Erhard willing to help; the wheat talks with the Russians; a *New York Times* story Kennedy
        fears may read as a trade offensive against the Soviet Union; Adenauer; the Mundt bill. Kennedy back from Texas Saturday, to lunch with Lodge Sunday; Ball to brief him that evening for Erhard. Their
        last talk.'
      n: '[[w.ball-past-has-another-pattern]], 310. Names: Ball, Kennedy, Erhard, Adenauer, Mundt, Lodge.'
