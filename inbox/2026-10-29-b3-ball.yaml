      c: '9:59 a.m., Ball to Johnson by telephone: the committee''s report to be finished that morning, gone over with McNamara and Rusk the night before, highly classified; such missions to be done differently,
        not sent into those waters without protection. Johnson, fearing a leak like the Gaither Report''s, wants Taylor and Clark to hear Ball first.'
      n: '[FRUS 1964–68, XXIX, doc. 270](https://history.state.gov/historicaldocuments/frus1964-68v29/d270). [[w.ball-past-has-another-pattern]], 436. Check: Ball has the report reviewed with Clifford,
