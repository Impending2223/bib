      date: '1965-02-26'
      thread: vietnam
      c: 'Friday. Johnson''s meeting on Ball''s memorandum of Oct. 5, given him through Moyers Feb. 24: he challenges its points by page; McNamara''s figures against it; Rusk on the dangers of not going
        forward. Inconclusive, by Ball''s account.'
