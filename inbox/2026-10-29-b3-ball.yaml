- add:
    entry:
      id: cal.1964-02-03.cyprus
      when: Feb. 3
      date: '1964-02-03'
      thread: cyprus
      c: London. Sandys tries the Anglo-American proposal for a NATO force on Kyprianou, Cyprus's Foreign Minister, without telling Ball; Makarios rejects it out of hand, by Ball's account.
      n: '[[w.ball-past-has-another-pattern]], 341. See [[cal.1964-01-25.europe-and-the-alliance]]. Names: Sandys, Kyprianou, Ball, Makarios III.'
      src:
        c: 9fe91b43
