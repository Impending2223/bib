- add:
    entry:
      id: cal.1962-10-20.missile-crisis-3
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: Night. Reston of the *New York Times*, who has most of the facts, by telephone to Ball; Ball asks him to hold off, and to call Bundy. Kennedy telephones Dryfoos, the publisher, who agrees to make
        the story harmless.
      n: '[[w.ball-past-has-another-pattern]], 296–97. See [[cal.1962-10-14.missile-crisis]]. Names: Reston, Ball, McGeorge Bundy, Kennedy.'
      src:
        c: f0e73cbc
        rows:
        - 'w.ball-past-has-another-pattern 296–97: all'
      tags:
      - name:reston-james
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-2
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      c: '10 a.m., the Oval Office, on Sorensen''s third draft of the address, by Ball''s account. Ball: hold Castro as responsible as Khrushchev, the blockade to take in petroleum; McNamara against: the
        blockade narrow, its one aim the missiles. Stevenson: not "render the missiles inoperable" but "dismantle and remove." Harriman, Hillenbrand and Talbot arrive at the White House in plain view, to
        send the press after China, India or Berlin.'
      n: '[[w.ball-past-has-another-pattern]], 297. See [[cal.1962-10-14.missile-crisis]]. Names: Sorensen, Ball, Castro, Khrushchev, McNamara, Stevenson, Harriman, Hillenbrand, Talbot.'
      src:
        c: 149006c7
        rows:
        - 'w.ball-past-has-another-pattern 297: all'
      tags:
      - name:sorensen-theodore-c
      - name:ball-george-w
      - name:castro-fidel
      - name:khrushchev-nikita-s
      - name:mcnamara-robert-s
      - name:stevenson-adlai-e
      - name:harriman-w-averell
      - name:hillenbrand-martin-j
      - name:talbot-phillips
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-8
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: '6:15 p.m., the State Department''s International Conference Room. Ball briefs the ambassadors of forty-six allied countries, of NATO, CENTO, SEATO and ANZUS: the background, the photographs, Hilsman
        on them; then the address on television with them, by Ball''s account. Martin briefs the OAS ambassadors.'
      n: '[[w.ball-past-has-another-pattern]], 298–99. See [[cal.1962-10-22.missile-crisis]]. Names: Ball, Hilsman, Martin.'
      src:
        c: 3f2fdbe0
        rows:
        - 'w.ball-past-has-another-pattern 298–99: all'
      tags:
      - name:ball-george-w
      - name:hilsman-roger
      - name:martin-edwin-m
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-9
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'After the address, Ball with the diplomatic press: "What will Khrushchev do? Is he going to abide by the quarantine we are about to establish? ... We are prepared for whatever Khrushchev may decide."'
      n: '[[w.ball-past-has-another-pattern]], 299. Check: the words as Ball gives them; the transcript not read. See [[cal.1962-10-22.missile-crisis]]. Names: Ball, Khrushchev.'
      src:
        c: 2bebb219
        rows:
        - 'w.ball-past-has-another-pattern 299: all'
      tags:
      - name:ball-george-w
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-3
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      c: '11:24 a.m., the Secretary to Hare in Ankara and Finletter at NATO: a negotiated removal of the offensive threat in Cuba may mean dismantling the Jupiters; Hare''s assessment urgently asked, of
        outright removal, of removal with a Polaris submarine in the area, or with a seaborne multilateral force; Finletter''s on NATO. Not to be discussed with foreigners.'
      n: '[FRUS 1961–63, XI, doc. 56](https://history.state.gov/historicaldocuments/frus1961-63v11/d56). [[w.ball-past-has-another-pattern]], 295 (the cable). Check: Ball has it as his own notice to the
        two ambassadors. See [[cal.1962-10-14.missile-crisis]]. Names: Hare, Finletter.'
      src:
        c: 4cf9280a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d56: all'
        - 'w.ball-past-has-another-pattern 295: A'
      tags:
      - name:hare-raymond-a
      - name:finletter-thomas-k
      - name:rusk-dean
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-4
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis
      c: 'U Thant to the Security Council, and in messages to Kennedy and Khrushchev at the asking of many members: a voluntary suspension of arms shipments to Cuba and of the quarantine, for two or three
        weeks, to give time for talks. No provision for verification, by Ball''s account; Washington against.'
      n: 'Message to the Acting Secretary General of the United Nations, [1962 Pub. Papers 811](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871) (Oct. 25, 1962), note
        (the appeal). [[w.ball-past-has-another-pattern]], 300 (the proposal; no verification). See [[cal.1962-10-14.missile-crisis]]. Names: U Thant, Kennedy, Khrushchev.'
      src:
        c: 50c8c167
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871: A'
        - 'w.ball-past-has-another-pattern 300: all'
      tags:
      - name:u-thant
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-5
      when: Oct. 24–25
      date: '1962-10-24'
      thread: missile-crisis
      c: 'Night, by the telephone memoranda. 10:30 p.m.: Ball reads Kennedy Khrushchev''s letter, the quarantine "an act of piracy." 11:15: Kennedy for a message giving the Russians "enough of an out to
        stop their shipments." 11:25: Ball to Rusk: U Thant to ask Khrushchev to hold off his ships, a tanker due at the line in the morning. 11:45: Ball to Stevenson. 12:30 a.m.: Ball to Bundy: Stevenson
        has got Thant out of bed; the message to go in the morning. 2 a.m.: Stevenson''s instructions for Thant''s message.'
      n: 'FRUS 1961–63, XI, docs. [63](https://history.state.gov/historicaldocuments/frus1961-63v11/d63), [64](https://history.state.gov/historicaldocuments/frus1961-63v11/d64), [65](https://history.state.gov/historicaldocuments/frus1961-63v11/d65),
        [66](https://history.state.gov/historicaldocuments/frus1961-63v11/d66), [67](https://history.state.gov/historicaldocuments/frus1961-63v11/d67); [doc. 69](https://history.state.gov/historicaldocuments/frus1961-63v11/d69)
        (the instructions). [[w.ball-past-has-another-pattern]], 301–02 (the night; the idea his, for twenty-four hours). See [[cal.1962-10-24.missile-crisis-4]]. Names: Ball, Kennedy, Khrushchev, Rusk,
        U Thant, Stevenson, McGeorge Bundy.'
      src:
        c: 19c010cb
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d63: B'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d64: C'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d65: D'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d66: E'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d67: F-G'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d69: H'
        - 'w.ball-past-has-another-pattern 301–02: C-G'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:rusk-dean
      - name:u-thant
      - name:stevenson-adlai-e
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-3
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      c: 'Kennedy to U Thant: the threat created by the secret introduction of offensive weapons into Cuba, the answer their removal; Stevenson ready to discuss arrangements.'
      n: 'Message to the Acting Secretary General of the United Nations, [1962 Pub. Papers 811](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871) (Oct. 25, 1962). See [[cal.1962-10-24.missile-crisis-4]].
        Names: Kennedy, U Thant, Stevenson.'
      src:
        c: 3c496300
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871: all'
      tags:
      - name:kennedy-john-f
      - name:u-thant
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-4
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      c: 'Morning, Stevenson to U Thant with Washington''s suggestions. Thant''s confidential message to Khrushchev, sent at 2:26 p.m. by Ball''s account: Soviet ships to keep out of the interception area
        for a limited time "to permit discussion of the modalities of a possible agreement." His note to Kennedy: American vessels to avoid direct confrontation. Zorin had called his first proposal "very
        bad."'
      n: '[FRUS 1961–63, XI, doc. 72](https://history.state.gov/historicaldocuments/frus1961-63v11/d72). [[w.ball-past-has-another-pattern]], 302 (the hour; the messages). See [[cal.1962-10-24.missile-crisis-5]].
        Names: Stevenson, U Thant, Khrushchev, Kennedy, Zorin.'
      src:
        c: '30911592'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d72: A-D'
        - 'w.ball-past-has-another-pattern 302: B-C'
      tags:
      - name:stevenson-adlai-e
      - name:u-thant
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:zorin-valentin-a
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-5
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      c: 'Finletter from Paris, 9 p.m.: the Turks set great store by the Jupiters, a symbol of the Alliance''s will to use atomic weapons in Turkey''s defense; obsolescence no matter. Any arrangement not
        agreed beforehand by Ankara "most damaging"; one not putting some other considerable atomic capability in Turkey in their place would be rejected.'
      n: '[FRUS 1961–63, XI, doc. 75](https://history.state.gov/historicaldocuments/frus1961-63v11/d75). [[w.ball-past-has-another-pattern]], 295 (Hare''s and Finletter''s replies "emphatically negative").
        See [[cal.1962-10-24.missile-crisis-3]]. Names: Finletter.'
      src:
        c: 006e65a6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d75: all'
        - 'w.ball-past-has-another-pattern 295: all'
      tags:
      - name:finletter-thomas-k
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-3
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      c: 'The Navy boards the *Marucla*, Panamanian-owned, under Soviet charter, chosen as the least provocative: no contraband. The tanker *Bucharest*, having named itself and its cargo, had been let through
        without boarding, and an East German passenger ship.'
      n: '[[w.ball-past-has-another-pattern]], 302–03. Check: the days, Ball giving the boarding as of Friday morning. See [[cal.1962-10-14.missile-crisis]].'
      src:
        c: b8771df0
        rows:
        - 'w.ball-past-has-another-pattern 302–03: all'
- add:
    entry:
      id: cal.1962-12-10.european-community
      when: Dec. 10
      date: '1962-12-10'
      thread: european-community
      c: 'Ball to Kennedy: the Brussels negotiations nearly at dead center, de Gaulle and Adenauer cool to British entry, the British treating them as "a commercial haggle." Hallstein, at lunch with Ball,
        ready to be a channel between the Commission and the British; Heath asks a confidential meeting with Ball in Paris in mid-January.'
      n: '[FRUS 1961–63, XIII, doc. 55](https://history.state.gov/historicaldocuments/frus1961-63v13/d55). The meeting: [[cal.1963-01-10.european-community-2]]. Names: Ball, Kennedy, de Gaulle, Adenauer,
        Hallstein, Heath.'
      src:
        c: 6a4a713d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d55: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:de-gaulle-charles
      - name:adenauer-konrad
      - name:hallstein-walter
      - name:heath-edward-r-g
- add:
    entry:
      id: cal.1962-12-10.europe-and-the-alliance
      when: Dec. 10
      date: '1962-12-10'
      thread: europe-and-the-alliance
      c: 'Evening. McNamara sends Ball the statement he means to make on landing in London: Skybolt has failed its flight tests. Ball by telephone, by his account: leave the tests out; he comes to consult,
        not to cancel, and must say nothing of substance before he sees the government.'
      n: '[[w.ball-past-has-another-pattern]], 263–64. See [[cal.1962-12-11.europe-and-the-alliance]]. Names: McNamara, Ball.'
      src:
        c: 84c56168
        rows:
        - 'w.ball-past-has-another-pattern 263–64: all'
      tags:
      - name:mcnamara-robert-s
      - name:ball-george-w
- add:
    entry:
      id: cal.1962-12-18.europe-and-the-alliance-2
      when: Dec. 18
      date: '1962-12-18'
      thread: europe-and-the-alliance
      c: 'On the flight to Nassau, in the President''s cabin. Ormsby-Gore to Kennedy, as Ball reconstructs it from what Kennedy told him: Macmillan''s government precarious; should he go home empty-handed,
        a more neutralist Labour government under Gaitskell.'
      n: '[[w.ball-past-has-another-pattern]], 265–66. See [[cal.1962-12-18.europe-and-the-alliance]]. Names: Ormsby-Gore, Kennedy, Ball, Macmillan, Gaitskell.'
      src:
        c: de29476b
        rows:
        - 'w.ball-past-has-another-pattern 265–66: all'
      tags:
      - name:ormsby-gore-david
      - name:kennedy-john-f
      - name:ball-george-w
      - name:macmillan-harold
      - name:gaitskell-hugh
- add:
    entry:
      id: cal.1963-01-10.european-community
      when: Jan. 10
      date: '1963-01-10'
      thread: european-community
      c: 'Paris. Ball with Couve de Murville, by Ball''s account: should de Gaulle reject British entry at his press conference of Jan. 14, as Ball has heard, serious trouble between Paris and Washington.
        Couve: "I can assure you there are no such ideas in this house."'
      n: '[[w.ball-past-has-another-pattern]], 269. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Ball, Couve de Murville, de Gaulle.'
      src:
        c: 433d5b5e
        rows:
        - 'w.ball-past-has-another-pattern 269: all'
      tags:
      - name:ball-george-w
      - name:couve-de-murville-maurice
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1963-01-10.european-community-2
      when: Jan. 10
      date: '1963-01-10'
      thread: european-community
      c: 'Evening, the Plaza Athénée. Ball and Heath at dinner, by Ball''s account: Heath, lunched by Couve and assured the way to entry is still open, confident. The next day a reporter gives Ball the
        Élysée''s advance précis of the press conference.'
      n: '[[w.ball-past-has-another-pattern]], 269. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Ball, Heath, Couve de Murville.'
      src:
        c: e86c8fdc
        rows:
        - 'w.ball-past-has-another-pattern 269: all'
      tags:
      - name:ball-george-w
      - name:heath-edward-r-g
      - name:couve-de-murville-maurice
- add:
    entry:
      id: cal.1963-01-14.europe-and-the-alliance-2
      when: Jan. 14
      date: '1963-01-14'
      thread: europe-and-the-alliance
      c: 'Bonn. Ball with Adenauer on the multilateral force, by Ball''s account. Adenauer: "You''ve set all my doubts to rest, Mr. Ball"; his government to announce its full support that afternoon. Of
        Britain: "You don''t seriously think Macmillan is ready for Europe, do you?"'
      n: '[[w.ball-past-has-another-pattern]], 269–70. Check: the government''s announcement not read. See [[cal.1962-12-18.europe-and-the-alliance]]. Names: Ball, Adenauer, Macmillan.'
      src:
        c: 663ee8e8
        rows:
        - 'w.ball-past-has-another-pattern 269–70: all'
      tags:
      - name:ball-george-w
      - name:adenauer-konrad
      - name:macmillan-harold
