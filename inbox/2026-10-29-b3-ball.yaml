      when: Feb. 13
      date: '1965-02-13'
      thread: vietnam
      c: 'Ball to Johnson, discussed with McNamara, McGeorge Bundy and Thompson and taken as the four''s agreed view but for one difference: the risks of gradually mounting pressure on the North, MIG engagements
        and Chinese intervention among them; a political program to go with it. McNamara and Bundy for pressing until Hanoi calls off the insurgency, Ball and Thompson sure Hanoi will not short of crushing
        defeat.'
      n: '[FRUS 1964–68, II, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v02/d113). [[w.ball-past-has-another-pattern]], 390–91. To check: Ball''s notes of Bundy''s call (cited by
        [[w.ball-past-has-another-pattern]], 391 n.8, for the difference). See [[cal.1965-02-07.vietnam]]. Names: Ball, Johnson, McNamara, McGeorge Bundy, Thompson.'
