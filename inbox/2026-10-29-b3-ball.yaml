      when: July 16
      date: '1968-07-16'
      thread: middle-east-six-day-war-aftermath
      c: 'Israel. Ball with Dayan, the Defense Minister; then by helicopter to Allon''s kibbutz. In Amman an audience with Hussein, bound by Khartoum''s "no peace with Israel, no negotiations": he cannot
        talk of a separate peace.'
      n: '[[w.ball-past-has-another-pattern]], 439. Check: the day of the audience. See [[cal.1968-07-15.middle-east-six-day-war-aftermath]]. Names: Ball, Dayan, Allon, Hussein.'
