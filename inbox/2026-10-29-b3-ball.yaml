      when: July 17
      date: '1968-07-17'
      thread: middle-east-six-day-war-aftermath
      c: 'Beirut airport. Fifty or more Palestinians on the terminal''s roof against American policy; a soda bottle thrown at Ball cuts his wrist, the ambassador''s driver pushing him into the car. Ball
        holds his press conference after. His telegram to Rusk: glad it was 7-Up, "Pepsi-Cola hits the spot"; Rusk: "You can do things better with Coke."'
      n: '[[w.ball-past-has-another-pattern]], 439. See [[cal.1968-07-15.middle-east-six-day-war-aftermath]]. Names: Ball, Rusk.'
      src:
        c: 3edf76b0
        rows:
        - 'w.ball-past-has-another-pattern 439: all'
      tags:
