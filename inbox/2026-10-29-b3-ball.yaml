      when: Nov. 26
      date: '1963-11-26'
      thread: succession
      c: 'Ball with Johnson as he receives the funeral''s visitors: Haile Selassie in the morning, then Prince Philip and Douglas-Home, at noon Erhard, by Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 315. Check: the records of the talks not read. Names: Ball, Johnson, Haile Selassie, Douglas-Home, Erhard.'
