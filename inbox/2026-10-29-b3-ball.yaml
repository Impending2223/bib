      when: Oct. 21
      date: '1963-10-21'
      thread: africa
      c: 'Ball to Salazar, fifteen pages, single-spaced: the drive to self-determination opposed frontally only at a price that keeps rising; Portugal has no more than a decade; it should make plain now
        that its goal is self-determination within a reasonable, not necessarily explicit, period, the right established now, its exercise after preparation.'
      n: '[[w.ball-past-has-another-pattern]], 279–80. Check: the letter not read. Reply: [[cal.1964-02-27.africa]]. Names: Ball, Salazar.'
