      id: cal.1962-10-17.missile-crisis-2
      when: Oct. 17
      date: '1962-10-17'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: 'The ExComm in Ball''s conference room at State, the "Think Tank," Kennedy campaigning. Ball against an air strike: irreversible, and a great power acting against its own traditions loses its authority.
        By Ball''s account Robert Kennedy later puts it his way: a surprise strike another Pearl Harbor; "My brother is not going to be the Tojo of the 1960s."'
      n: '[[w.ball-past-has-another-pattern]], 290–91. Check: Ball does not date Robert Kennedy''s words. See [[cal.1962-10-14.missile-crisis]]. Names: Ball, Kennedy, Robert Kennedy.'
      src:
        c: 63bd8fd9
        rows:
        - 'w.ball-past-has-another-pattern 290–91: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:kennedy-robert-f
