      date: '1963-09-06'
      thread: south-asia
      c: 'Ball from Lisbon, eyes only for the President and the Secretaries of State and Defense, his summary of the Pakistani situation: Ayub and his government "filled with deep fear" of Indian military
        action, "the central obsessive basis" of their policy; American arms for India have upset the balance by which West Pakistan was defensible.'
      n: '[FRUS 1961–63, XIX, doc. 330](https://history.state.gov/historicaldocuments/frus1961-63v19/d330). See [[cal.1963-09-03.south-asia]]. Names: Ball, Ayub Khan.'
