      thread: middle-east-six-day-war-aftermath
      c: 'Jerusalem. Ball, with Sisco, sees Eshkol, by Ball''s account: for peace Israel would return the West Bank to Jordan with minor changes, and Ball may tell Hussein so.'
      n: '[[w.ball-past-has-another-pattern]], 438–39. Check: the record not found. Names: Ball, Sisco, Eshkol, Hussein.'
