- add:
    entry:
      id: cal.1962-10-20.missile-crisis-3
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: Night. Reston of the *New York Times*, who has most of the facts, by telephone to Ball; Ball asks him to hold off, and to call Bundy. Kennedy telephones Dryfoos, the publisher, who agrees to make
        the story harmless.
      n: '[[w.ball-past-has-another-pattern]], 296–97. See [[cal.1962-10-14.missile-crisis]]. Names: Reston, Ball, McGeorge Bundy, Kennedy.'
      src:
        c: f0e73cbc
        rows:
        - 'w.ball-past-has-another-pattern 296–97: all'
      tags:
      - name:reston-james
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-2
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      c: '10 a.m., the Oval Office, on Sorensen''s third draft of the address, by Ball''s account. Ball: hold Castro as responsible as Khrushchev, the blockade to take in petroleum; McNamara against: the
        blockade narrow, its one aim the missiles. Stevenson: not "render the missiles inoperable" but "dismantle and remove." Harriman, Hillenbrand and Talbot arrive at the White House in plain view, to
        send the press after China, India or Berlin.'
      n: '[[w.ball-past-has-another-pattern]], 297. See [[cal.1962-10-14.missile-crisis]]. Names: Sorensen, Ball, Castro, Khrushchev, McNamara, Stevenson, Harriman, Hillenbrand, Talbot.'
      src:
        c: 149006c7
        rows:
        - 'w.ball-past-has-another-pattern 297: all'
      tags:
      - name:sorensen-theodore-c
      - name:ball-george-w
      - name:castro-fidel
      - name:khrushchev-nikita-s
      - name:mcnamara-robert-s
      - name:stevenson-adlai-e
      - name:harriman-w-averell
      - name:hillenbrand-martin-j
      - name:talbot-phillips
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-8
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: '6:15 p.m., the State Department''s International Conference Room. Ball briefs the ambassadors of forty-six allied countries, of NATO, CENTO, SEATO and ANZUS: the background, the photographs, Hilsman
        on them; then the address on television with them, by Ball''s account. Martin briefs the OAS ambassadors.'
      n: '[[w.ball-past-has-another-pattern]], 298–99. See [[cal.1962-10-22.missile-crisis]]. Names: Ball, Hilsman, Martin.'
      src:
        c: 3f2fdbe0
        rows:
        - 'w.ball-past-has-another-pattern 298–99: all'
      tags:
      - name:ball-george-w
      - name:hilsman-roger
      - name:martin-edwin-m
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-9
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'After the address, Ball with the diplomatic press: "What will Khrushchev do? Is he going to abide by the quarantine we are about to establish? ... We are prepared for whatever Khrushchev may decide."'
      n: '[[w.ball-past-has-another-pattern]], 299. Check: the words as Ball gives them; the transcript not read. See [[cal.1962-10-22.missile-crisis]]. Names: Ball, Khrushchev.'
      src:
        c: 2bebb219
        rows:
        - 'w.ball-past-has-another-pattern 299: all'
      tags:
      - name:ball-george-w
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-3
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      c: '11:24 a.m., the Secretary to Hare in Ankara and Finletter at NATO: a negotiated removal of the offensive threat in Cuba may mean dismantling the Jupiters; Hare''s assessment urgently asked, of
        outright removal, of removal with a Polaris submarine in the area, or with a seaborne multilateral force; Finletter''s on NATO. Not to be discussed with foreigners.'
      n: '[FRUS 1961–63, XI, doc. 56](https://history.state.gov/historicaldocuments/frus1961-63v11/d56). [[w.ball-past-has-another-pattern]], 295 (the cable). Check: Ball has it as his own notice to the
        two ambassadors. See [[cal.1962-10-14.missile-crisis]]. Names: Hare, Finletter.'
      src:
        c: 4cf9280a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d56: all'
        - 'w.ball-past-has-another-pattern 295: A'
      tags:
      - name:hare-raymond-a
      - name:finletter-thomas-k
      - name:rusk-dean
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-4
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis
      c: 'U Thant to the Security Council, and in messages to Kennedy and Khrushchev at the asking of many members: a voluntary suspension of arms shipments to Cuba and of the quarantine, for two or three
        weeks, to give time for talks. No provision for verification, by Ball''s account; Washington against.'
      n: 'Message to the Acting Secretary General of the United Nations, [1962 Pub. Papers 811](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871) (Oct. 25, 1962), note
        (the appeal). [[w.ball-past-has-another-pattern]], 300 (the proposal; no verification). See [[cal.1962-10-14.missile-crisis]]. Names: U Thant, Kennedy, Khrushchev.'
      src:
        c: 50c8c167
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871: A'
        - 'w.ball-past-has-another-pattern 300: all'
      tags:
      - name:u-thant
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-5
      when: Oct. 24–25
      date: '1962-10-24'
      thread: missile-crisis
      c: 'Night, by the telephone memoranda. 10:30 p.m.: Ball reads Kennedy Khrushchev''s letter, the quarantine "an act of piracy." 11:15: Kennedy for a message giving the Russians "enough of an out to
        stop their shipments." 11:25: Ball to Rusk: U Thant to ask Khrushchev to hold off his ships, a tanker due at the line in the morning. 11:45: Ball to Stevenson. 12:30 a.m.: Ball to Bundy: Stevenson
        has got Thant out of bed; the message to go in the morning. 2 a.m.: Stevenson''s instructions for Thant''s message.'
      n: 'FRUS 1961–63, XI, docs. [63](https://history.state.gov/historicaldocuments/frus1961-63v11/d63), [64](https://history.state.gov/historicaldocuments/frus1961-63v11/d64), [65](https://history.state.gov/historicaldocuments/frus1961-63v11/d65),
        [66](https://history.state.gov/historicaldocuments/frus1961-63v11/d66), [67](https://history.state.gov/historicaldocuments/frus1961-63v11/d67); [doc. 69](https://history.state.gov/historicaldocuments/frus1961-63v11/d69)
        (the instructions). [[w.ball-past-has-another-pattern]], 301–02 (the night; the idea his, for twenty-four hours). See [[cal.1962-10-24.missile-crisis-4]]. Names: Ball, Kennedy, Khrushchev, Rusk,
        U Thant, Stevenson, McGeorge Bundy.'
      src:
        c: 19c010cb
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d63: B'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d64: C'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d65: D'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d66: E'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d67: F-G'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d69: H'
        - 'w.ball-past-has-another-pattern 301–02: C-G'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
