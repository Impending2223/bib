      when: Aug.
      date: 1964-08
      thread: vietnam
      c: 'Within days of the second attack in the Gulf, Johnson to Ball, by Ball''s account: "Hell, those dumb, stupid sailors were just shooting at flying fish!"'
      n: '[[w.ball-past-has-another-pattern]], 379. Check: the day. Names: Johnson, Ball.'
