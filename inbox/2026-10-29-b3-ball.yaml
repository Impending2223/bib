        c: 36f17a84
        rows:
        - 'w.ball-past-has-another-pattern 310–12: all'
      tags:
      - name:ball-george-w
      - name:rusk-dean
      - name:mccone-john-a
      - name:oswald-lee-harvey
      - name:thompson-llewellyn-e
