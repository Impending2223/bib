      id: cal.1968-04-25.transition-and-staff-2
      when: Apr. 25
      date: '1968-04-25'
      thread: transition-and-staff
      c: 'Morning. Ball to Johnson: he cannot take it. Johnson: he has decided not to run, wanting peace; "I need you, George. No one else ever disagreed with me as much as you but I need you"; whom should
        he call among the partners? Two minutes later Rusk: "You''re going to the United Nations." The next day Weisl, of Lehman Brothers, close to Johnson, says Johnson has called him. By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 437. Check: the order of the calls and the news conference of the same day. See [[cal.1968-04-25.transition-and-staff]]. Names: Ball, Johnson, Rusk.'
      src:
