      when: Aug. 18
      date: '1964-08-18'
      thread: cyprus
      c: 'Acheson to Ball by telex from Geneva: the chances of a quick Greek–Turkish settlement "about the same as the odds on Goldwater"; liquidate the effort, let him come home. Ball, by teletype about
        2 a.m.: stay on.'
      n: '[[w.ball-past-has-another-pattern]], 358. Check: the telex not found in FRUS 1964–68, XVI. Names: Acheson, Ball, Goldwater.'
