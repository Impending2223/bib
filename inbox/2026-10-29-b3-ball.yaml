      when: Apr. 1
      date: '1964-04-01'
      thread: latin-america
      c: 'Johnson to Ball, the next morning, by Ball''s account: "Don''t ever do that again"; whatever the hour, he wants to know what is being done. Thereafter Ball wakes him a time or two a month.'
      n: '[[w.ball-past-has-another-pattern]], 429–30. See [[cal.1964-04-01.latin-america]]. Names: Johnson, Ball.'
