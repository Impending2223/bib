- add:
    entry:
      id: cal.1963-09.africa
      when: Sept.
      date: 1963-09
      thread: africa
      c: 'Lisbon again, on Ball''s way home. Salazar, by Ball''s account: write me a letter setting out your position, personally, and I will send you a personal reply.'
      n: '[[w.ball-past-has-another-pattern]], 278–79. Check: the day, between Sept. 5 and 9. See [[cal.1963-08-28.africa]]. Names: Salazar, Ball.'
