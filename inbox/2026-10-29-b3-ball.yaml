- add:
    entry:
      id: cal.1961-01.transition-and-staff
      when: Jan.
      date: 1961-01
      thread: transition-and-staff
      c: 'Palm Beach. Fulbright to Kennedy, at Stevenson''s asking, by Ball''s account: too many Republicans in the top posts at State, Defense and the Treasury; Ball, not William C. Foster, for Under Secretary
        for Economic Affairs. Galbraith urges the same at breakfast with Kennedy a day or two later. Foster dropped.'
      n: '[[w.ball-past-has-another-pattern]], 161–62. Check: the days; Ball has it after his return to Washington early in January, before Rusk''s call of Jan. 10. See [[cal.1960-12-12.transition-and-staff-cabinet]].
        Names: Fulbright, Kennedy, Stevenson, Ball, Foster, Galbraith.'
      src:
        c: 4adbffe3
        rows:
        - 'w.ball-past-has-another-pattern 161–62: all'
      tags:
      - name:fulbright-j-william
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:ball-george-w
      - name:foster-william-c
      - name:galbraith-john-kenneth
- add:
    entry:
      id: cal.1961-01-10.transition-and-staff
      when: Jan. 10
      date: '1961-01-10'
      thread: transition-and-staff
      c: 'Rusk to Ball by telephone: Kennedy will name him Under Secretary for Economic Affairs, the announcement the next day. Rusk sets him some of Sorensen''s pages of questions on foreign policy to
        answer.'
      n: '[[w.ball-past-has-another-pattern]], 163. See [[cal.1961-01.transition-and-staff]]. Names: Rusk, Ball, Kennedy, Sorensen.'
      src:
        c: 99f9c459
        rows:
        - 'w.ball-past-has-another-pattern 163: all'
      tags:
      - name:rusk-dean
      - name:ball-george-w
      - name:kennedy-john-f
      - name:sorensen-theodore-c
- add:
    entry:
      id: cal.1961-03-30.european-community
      when: Mar. 30
      date: '1961-03-30'
      thread: european-community
      c: 'London. Ball with Heath, Lord Privy Seal, Sir Frank Lee and British officials, by Ball''s account. Heath: given a settlement for the Commonwealth, agriculture and the EFTA, Britain ready to accept
        a common or harmonized tariff and the institutions that follow from it. Ball: the United States can accept the added discrimination only if British entry strengthens the Community''s political character;
        the Rome Treaty not "a frozen document" but "a process."'
      n: '[[w.ball-past-has-another-pattern]], 211–13. Bibliography: [[cal.1961-04-05.european-community]]. Names: Ball, Heath, Lee.'
      src:
        c: b8c6549b
        rows:
        - 'w.ball-past-has-another-pattern 211–13: all'
      tags:
      - name:ball-george-w
      - name:heath-edward-r-g
      - name:lee-frank
- add:
    entry:
      id: cal.1961-04-06.european-community
      when: Apr. 6
      date: '1961-04-06'
      thread: european-community
      c: 'The British Embassy, at dinner. Macmillan to Ball, by Ball''s account: "We''re going into Europe. We''ll need your help, since we''ll have trouble with de Gaulle, but we''re going to do it."'
      n: '[[w.ball-past-has-another-pattern]], 214. See [[cal.1961-04-05.european-community]]. Names: Macmillan, Ball, de Gaulle.'
      src:
        c: e87a1c5c
        rows:
        - 'w.ball-past-has-another-pattern 214: all'
      tags:
      - name:macmillan-harold
      - name:ball-george-w
- add:
    entry:
      id: cal.1961-05-18.european-community
      when: May 18
      date: '1961-05-18'
      thread: european-community
      c: 'London. Ball with Heath and Barclay. Heath: his speech in the Commons of May 17 the "opening gun in grand debate," to educate the Conservative Party and the country; Labour will not oppose entry
        outright. The government must not seem to act under pressure. The American aide-mémoire given Caccia "very useful."'
      n: '[FRUS 1961–63, XIII, doc. 8](https://history.state.gov/historicaldocuments/frus1961-63v13/d8) (Ball''s report). [[w.ball-past-has-another-pattern]], 216 (Heath in the Commons, May 17). See [[cal.1961-04-05.european-community]].
        Names: Ball, Heath, Barclay, Caccia.'
      src:
        c: f580c96c
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d8: all'
        - 'w.ball-past-has-another-pattern 216: C'
      tags:
      - name:ball-george-w
      - name:heath-edward-r-g
      - name:barclay-roderick-e
      - name:caccia-harold-a
- add:
    entry:
      id: cal.1961-05-22.european-community
      when: May 22
      date: '1961-05-22'
      thread: european-community
      c: 'Kennedy to Macmillan, answering his letter of Apr. 28 on Britain and the Common Market. The American interest "political": Britain a full member of the Rome Treaty, for "a stable solution of the
        place of Germany"; a customs union alone an economic difficulty without political gain; the EFTA perhaps in stages. Ball has given the American view in an aide-mémoire.'
      n: '[FRUS 1961–63, XIII, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v13/d9). [[w.ball-past-has-another-pattern]], 215 (Macmillan''s letter; Ball''s memorandum for the reply).
        Check: Ball gives Macmillan''s letter as of May 1. See [[cal.1961-04-05.european-community]]. Names: Kennedy, Macmillan, Ball.'
      src:
        c: bdbe7ec6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d9: all'
        - 'w.ball-past-has-another-pattern 215: A'
      tags:
      - name:kennedy-john-f
      - name:macmillan-harold
      - name:ball-george-w
- add:
    entry:
      id: cal.1961-08-05.european-community
      when: Aug. 5
      date: '1961-08-05'
      thread: european-community
      c: 'Ball to Kennedy: Macmillan trying to "slide sidewise into the Common Market," the Commonwealth''s and the EFTA''s interests promising a long negotiation. Britain in the Community on the Rome Treaty''s
        political terms "substantial additional weight on the Western side of the world power balance"; the industrial West in two parts, the United States and the Community, Japan outside both. Kennedy
        to welcome Macmillan''s announcement at his news conference of Aug. 10.'
      n: '[[w.ball-past-has-another-pattern]], 217–18. See [[cal.1961-07-31.european-community]]. Names: Ball, Kennedy, Macmillan.'
      src:
        c: 5e781e22
        rows:
        - 'w.ball-past-has-another-pattern 217–18: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:macmillan-harold
- add:
    entry:
      id: cal.1961-08-10.european-community
      when: Aug. 10
      date: '1961-08-10'
      thread: european-community
      c: 'News conference. Kennedy gratified that Macmillan''s call for negotiations on entering the Common Market as a full member is well received by the Six and the Commission: "We welcome the prospect
        of Britain''s participation in the institutions of the Treaty of Rome." American economic interests, and those of friendly states, to be watched.'
      n: 'The President''s News Conference, [1961 Pub. Papers 553](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=611) (Aug. 10, 1961). See [[cal.1961-08-05.european-community]].
        Names: Kennedy, Macmillan.'
      src:
        c: a5e486e8
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=611: all'
      tags:
      - name:kennedy-john-f
      - name:macmillan-harold
- add:
    entry:
      id: cal.1961-02.trade
      when: Feb.
      date: 1961-02
      thread: trade
      c: 'Early in the month. The Senate Commerce Committee''s special subcommittee on the textile industry, Pastore chairman, reports: mandatory quotas on imports. Members of both houses write Kennedy
        against Ball and for action.'
      n: '[[w.ball-past-has-another-pattern]], 190. Check: the report''s day and title; Ball has Pastore "of Connecticut." Names: Pastore, Kennedy, Ball.'
      src:
        c: 66aaa303
        rows:
        - 'w.ball-past-has-another-pattern 190: all'
      tags:
      - name:pastore-john-o
      - name:kennedy-john-f
      - name:ball-george-w
- add:
    entry:
      id: cal.1961-07-01.japan
      when: July 1–2
      date: '1961-07-01'
      thread: japan
      c: 'Okinawa. Ball with Caraway, the High Commissioner. Ball to Kennedy by telegram, with Kaysen, by Ball''s account: the island still run as a colony fifteen years after the war, trouble ahead between
        Tokyo and Washington.'
      n: '[[w.ball-past-has-another-pattern]], 196. Check: the telegram''s day. The task force: [[cal.1961-08-11.japan-and-korea]]. Names: Ball, Caraway, Kennedy, Kaysen.'
      src:
        c: e96ed636
        rows:
        - 'w.ball-past-has-another-pattern 196: all'
      tags:
      - name:ball-george-w
      - name:caraway-paul-w
      - name:kennedy-john-f
      - name:kaysen-carl
- add:
    entry:
      id: cal.1961-07-17.trade
      when: July 17
      date: '1961-07-17'
      thread: trade
      c: 'Geneva. The cotton textile meeting opens, Ball heading the American delegation, the industry''s men briefed but not present. His formula, by his account drafted the night of July 15: an importing
        country may ask exporters to hold a category "threatening to disrupt the market" to no less than its level of the year to June 30, 1961; failing agreement in thirty days, refuse imports above it.
        The procedure "to be used sparingly."'
      n: '[[w.ball-past-has-another-pattern]], 191–93. Check: the arrangement''s day and terms, as signed. See [[cal.1961-02.trade]]. Names: Ball.'
      src:
        c: 12845b3e
        rows:
        - 'w.ball-past-has-another-pattern 191–93: all'
      tags:
      - name:ball-george-w
- add:
    entry:
      id: cal.1961-10-18.africa
      when: Oct. 18
      date: '1961-10-18'
      thread: africa
      c: 'Ball to Kennedy: Clarence Randall to head a small mission to Ghana on the Volta dam, Chayes and Shooshan with him; to see Kennedy Oct. 19, to leave the next Tuesday, and to report early in November,
        the report the basis for going ahead. Randall to tell Nkrumah plainly of the American difficulties.'
      n: '[FRUS 1961–63, XXI, doc. 237](https://history.state.gov/historicaldocuments/frus1961-63v21/d237). [[w.ball-past-has-another-pattern]], 186 (the mission, Ball''s suggestion). Check: Ball has Randall
        leaving for Ghana Oct. 19 and back Oct. 31. See [[cal.1961-06-29.africa]]. Names: Ball, Kennedy, Randall, Chayes, Nkrumah.'
      src:
        c: 0a4190c9
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v21/d237: all'
        - 'w.ball-past-has-another-pattern 186: A'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:randall-clarence-b
      - name:chayes-abram
      - name:nkrumah-kwame
- add:
    entry:
      id: cal.1961-11-03.africa
      when: Nov. 3
      date: '1961-11-03'
      thread: africa
      c: 'Ball takes Randall to Kennedy, by Ball''s account. Randall: no commitment on the Volta dam now; the decision put off a year. Ball: the Africans would take it as a refusal; Randall agrees to keep
        his report quiet.'
      n: '[[w.ball-past-has-another-pattern]], 186. See [[cal.1961-10-18.africa]]. Names: Ball, Randall, Kennedy.'
      src:
        c: b78d9751
        rows:
        - 'w.ball-past-has-another-pattern 186: all'
      tags:
      - name:ball-george-w
      - name:randall-clarence-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-11-24.africa
      when: Nov. 24
      date: '1961-11-24'
      thread: africa
      also:
      - robert-kennedy
      c: 'Hyannis Port. Ball with Kennedy on the Volta dam, by Ball''s account. Robert Kennedy against: no large commitment to Nkrumah. Kennedy to Ball, at last: "All right, George, you make the decision."
        Ball: go ahead on a limited, conditional basis, no more than $28 million in the first three years, the tap to be turned off if Nkrumah behaves too badly.'
      n: '[[w.ball-past-has-another-pattern]], 186–87. Check: Ball does not date Kennedy''s words; "after repeated discussions." See [[cal.1961-10-18.africa]]. Names: Ball, Kennedy, Robert Kennedy, Nkrumah.'
      src:
        c: bdbf8ddd
        rows:
        - 'w.ball-past-has-another-pattern 186–87: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:nkrumah-kwame
- add:
    entry:
      id: cal.1961-12-14.congo
      when: Dec. 14
      date: '1961-12-14'
      thread: congo
      c: 'Tshombe to Kennedy by telegram: for ten days the UN''s troops "exerting pressure against Katanga"; "Force alone can never resolve the Congolese problem"; his "desire to negotiate" with Adoula.
        He asks Kennedy "as a free man and as a Christian to designate a suitable negotiator."'
      n: '"President Kennedy Asked To Facilitate Negotiations Between Congo Leaders," Department statement, Dec. 15, [[w.department-of-state-bulletin]], [Jan. 1, 1962, 10](https://archive.org/details/departmentofstat461962unit/page/10/mode/1up).
        [[w.ball-past-has-another-pattern]], 256–57. See [[cal.1961-12-21.congo]]. Names: Tshombe, Kennedy, Adoula.'
      src:
        c: f8753db0
        rows:
        - 'https://archive.org/details/departmentofstat461962unit/page/10/mode/1up: all'
        - 'w.ball-past-has-another-pattern 256–57: all'
      tags:
      - name:tshombe-moise
      - name:kennedy-john-f
      - name:adoula-cyrille
- add:
    entry:
      id: cal.1961-12-14.congo-2
      when: Dec. 14
      date: '1961-12-14'
      thread: congo
      c: 'Ball to Gullion, 9:23 p.m.: Kennedy''s message to Tshombe, for Hoffacker to deliver once Adoula concurs; Adoula has told Bunche he would meet Tshombe at Kitona. Gullion to be Kennedy''s man to
        bring the two together, by Ball''s account, a cease-fire left unpromised in writing; Hoffacker to say one would be in effect.'
      n: '[FRUS 1961–63, XX, doc. 162](https://history.state.gov/historicaldocuments/frus1961-63v20/d162). [[w.ball-past-has-another-pattern]], 257 (Gullion; the cease-fire). See [[cal.1961-12-14.congo]].
        Names: Ball, Gullion, Kennedy, Tshombe, Hoffacker, Adoula, Bunche.'
      src:
        c: d4456828
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v20/d162: A-B'
        - 'w.ball-past-has-another-pattern 257: C-D'
      tags:
      - name:ball-george-w
      - name:gullion-edmund-a
      - name:kennedy-john-f
      - name:tshombe-moise
      - name:hoffacker-lewis
      - name:adoula-cyrille
      - name:bunche-ralph-j
