      when: Sept. 9
      date: '1963-09-09'
      thread: south-asia
      c: '12:10–1:10 p.m., on Ball''s mission to Pakistan: Kennedy with Rusk, Ball, Harriman, U. Alexis Johnson, Talbot, McNamara, Nitze, Quinn, McCone, Bundy and Komer. Ball: the Pakistanis'' "deep, obsessive
        fear of India," touched off by American arms; Ayub''s talk of "normalizing relations" with China an empty threat; he had made "2/3 of a commitment" to McCone on Peshawar.'
      n: '[FRUS 1961–63, XIX, doc. 331](https://history.state.gov/historicaldocuments/frus1961-63v19/d331). [[w.ball-past-has-another-pattern]], 285 (Quinn''s golf). Names: Kennedy, Rusk, Ball, Harriman,
