      when: Nov. 24
      date: '1963-11-24'
      thread: assassination
      c: Night, Dulles Airport. Rusk, Ball and Harriman greet the heads of state and government arriving for the funeral, Rusk the principal ones, de Gaulle the most watched, by Ball's account.
      n: '[[w.ball-past-has-another-pattern]], 314. See [[cal.1963-11-22.assassination]]. Names: Rusk, Ball, Harriman, de Gaulle.'
