      id: cal.1968-09.elections-1968-13
      when: Sept.
      date: 1968-09
      thread: elections-1968
      c: 'Ball, having decided on an official visit to Europe in August to leave the UN for Humphrey''s campaign, Nixon then far ahead in the polls, telephones Johnson at the Ranch: not asking permission,
        "advising you that I''ve made a decision as a matter of conscience." Johnson asks two or three days to find a successor. Ball calls Humphrey and agrees to meet him in Seattle. By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 444. Check: the days. See [[cal.1968-09-26.transition-and-staff]]. Names: Ball, Humphrey, Nixon, Johnson.'
      src:
        c: 470eaf22
        rows:
