      - name:cleveland-harland
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1963-11-22.succession-3
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Andrews to the White House by helicopter: Johnson with McNamara, McGeorge Bundy, Ball and Mrs. Johnson. Johnson, by Ball''s account: "You''re men I trust the most. You must stay with me. I''ll
        need you." Each tells him what was done that day. McNamara and Ball after, twenty minutes in the Cabinet Room.'
      n: '[[w.ball-past-has-another-pattern]], 312–13. See [[cal.1963-11-22.succession]]. Names: Johnson, McNamara, McGeorge Bundy, Ball, Lady Bird Johnson.'
      src:
        c: '21439712'
        rows:
        - 'w.ball-past-has-another-pattern 312–13: all'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:ball-george-w
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1963-11-23.succession-5
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: '12:30 a.m., Andrews. The Cabinet''s plane back from the Pacific; Rusk''s statement for his colleagues, those "who had the honor of serving President Kennedy." Ball and Rusk in a car after: a larger
        plot not yet ruled out; extremists at home. Moynihan fears the Dallas police.'
      n: '[[w.ball-past-has-another-pattern]], 313–14. See [[cal.1963-11-22.assassination]]. Names: Rusk, Kennedy, Ball, Moynihan.'
      src:
        c: 3156cd12
