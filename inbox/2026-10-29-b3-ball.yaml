      when: Nov. 21
      date: '1964-11-21'
      thread: congo
      c: '11:40 a.m., Ball, Acting Secretary, to Johnson in Texas: Stanleyville deteriorating; move the planes from Ascension to Kamina, four hours from Stanleyville, Spaak wanting it, Harriman, Vance and
        Wheeler agreed; not yet a decision to drop the paratroops. Johnson: touch base with McNamara, and if he agrees, go ahead.'
