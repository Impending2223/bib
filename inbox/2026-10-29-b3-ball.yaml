      - name:u-thant
      - name:stevenson-adlai-e
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-3
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      c: 'Kennedy to U Thant: the threat created by the secret introduction of offensive weapons into Cuba, the answer their removal; Stevenson ready to discuss arrangements.'
      n: 'Message to the Acting Secretary General of the United Nations, [1962 Pub. Papers 811](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871) (Oct. 25, 1962). See [[cal.1962-10-24.missile-crisis-4]].
        Names: Kennedy, U Thant, Stevenson.'
      src:
        c: 3c496300
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871: all'
      tags:
      - name:kennedy-john-f
      - name:u-thant
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-4
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      c: 'Morning, Stevenson to U Thant with Washington''s suggestions. Thant''s confidential message to Khrushchev, sent at 2:26 p.m. by Ball''s account: Soviet ships to keep out of the interception area
        for a limited time "to permit discussion of the modalities of a possible agreement." His note to Kennedy: American vessels to avoid direct confrontation. Zorin had called his first proposal "very
        bad."'
      n: '[FRUS 1961–63, XI, doc. 72](https://history.state.gov/historicaldocuments/frus1961-63v11/d72). [[w.ball-past-has-another-pattern]], 302 (the hour; the messages). See [[cal.1962-10-24.missile-crisis-5]].
        Names: Stevenson, U Thant, Khrushchev, Kennedy, Zorin.'
      src:
        c: '30911592'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d72: A-D'
        - 'w.ball-past-has-another-pattern 302: B-C'
      tags:
      - name:stevenson-adlai-e
      - name:u-thant
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:zorin-valentin-a
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-5
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      c: 'Finletter from Paris, 9 p.m.: the Turks set great store by the Jupiters, a symbol of the Alliance''s will to use atomic weapons in Turkey''s defense; obsolescence no matter. Any arrangement not
        agreed beforehand by Ankara "most damaging"; one not putting some other considerable atomic capability in Turkey in their place would be rejected.'
      n: '[FRUS 1961–63, XI, doc. 75](https://history.state.gov/historicaldocuments/frus1961-63v11/d75). [[w.ball-past-has-another-pattern]], 295 (Hare''s and Finletter''s replies "emphatically negative").
        See [[cal.1962-10-24.missile-crisis-3]]. Names: Finletter.'
      src:
        c: 006e65a6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d75: all'
        - 'w.ball-past-has-another-pattern 295: all'
      tags:
      - name:finletter-thomas-k
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-3
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      c: 'The Navy boards the *Marucla*, Panamanian-owned, under Soviet charter, chosen as the least provocative: no contraband. The tanker *Bucharest*, having named itself and its cargo, had been let through
        without boarding, and an East German passenger ship.'
      n: '[[w.ball-past-has-another-pattern]], 302–03. Check: the days, Ball giving the boarding as of Friday morning. See [[cal.1962-10-14.missile-crisis]].'
      src:
        c: b8771df0
        rows:
        - 'w.ball-past-has-another-pattern 302–03: all'
- add:
    entry:
      id: cal.1962-12-10.european-community
      when: Dec. 10
      date: '1962-12-10'
      thread: european-community
      c: 'Ball to Kennedy: the Brussels negotiations nearly at dead center, de Gaulle and Adenauer cool to British entry, the British treating them as "a commercial haggle." Hallstein, at lunch with Ball,
        ready to be a channel between the Commission and the British; Heath asks a confidential meeting with Ball in Paris in mid-January.'
      n: '[FRUS 1961–63, XIII, doc. 55](https://history.state.gov/historicaldocuments/frus1961-63v13/d55). The meeting: [[cal.1963-01-10.european-community-2]]. Names: Ball, Kennedy, de Gaulle, Adenauer,
        Hallstein, Heath.'
      src:
        c: 6a4a713d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d55: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:de-gaulle-charles
      - name:adenauer-konrad
      - name:hallstein-walter
      - name:heath-edward-r-g
- add:
    entry:
      id: cal.1962-12-10.europe-and-the-alliance
      when: Dec. 10
      date: '1962-12-10'
      thread: europe-and-the-alliance
      c: 'Evening. McNamara sends Ball the statement he means to make on landing in London: Skybolt has failed its flight tests. Ball by telephone, by his account: leave the tests out; he comes to consult,
        not to cancel, and must say nothing of substance before he sees the government.'
      n: '[[w.ball-past-has-another-pattern]], 263–64. See [[cal.1962-12-11.europe-and-the-alliance]]. Names: McNamara, Ball.'
      src:
        c: 84c56168
        rows:
        - 'w.ball-past-has-another-pattern 263–64: all'
      tags:
      - name:mcnamara-robert-s
      - name:ball-george-w
- add:
    entry:
      id: cal.1962-12-18.europe-and-the-alliance-2
      when: Dec. 18
      date: '1962-12-18'
      thread: europe-and-the-alliance
      c: 'On the flight to Nassau, in the President''s cabin. Ormsby-Gore to Kennedy, as Ball reconstructs it from what Kennedy told him: Macmillan''s government precarious; should he go home empty-handed,
        a more neutralist Labour government under Gaitskell.'
      n: '[[w.ball-past-has-another-pattern]], 265–66. See [[cal.1962-12-18.europe-and-the-alliance]]. Names: Ormsby-Gore, Kennedy, Ball, Macmillan, Gaitskell.'
      src:
        c: de29476b
        rows:
        - 'w.ball-past-has-another-pattern 265–66: all'
      tags:
      - name:ormsby-gore-david
      - name:kennedy-john-f
      - name:ball-george-w
      - name:macmillan-harold
      - name:gaitskell-hugh
- add:
    entry:
      id: cal.1963-01-10.european-community
      when: Jan. 10
      date: '1963-01-10'
      thread: european-community
      c: 'Paris. Ball with Couve de Murville, by Ball''s account: should de Gaulle reject British entry at his press conference of Jan. 14, as Ball has heard, serious trouble between Paris and Washington.
        Couve: "I can assure you there are no such ideas in this house."'
      n: '[[w.ball-past-has-another-pattern]], 269. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Ball, Couve de Murville, de Gaulle.'
      src:
        c: 433d5b5e
        rows:
        - 'w.ball-past-has-another-pattern 269: all'
      tags:
      - name:ball-george-w
      - name:couve-de-murville-maurice
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1963-01-10.european-community-2
      when: Jan. 10
      date: '1963-01-10'
      thread: european-community
      c: 'Evening, the Plaza Athénée. Ball and Heath at dinner, by Ball''s account: Heath, lunched by Couve and assured the way to entry is still open, confident. The next day a reporter gives Ball the
        Élysée''s advance précis of the press conference.'
      n: '[[w.ball-past-has-another-pattern]], 269. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Ball, Heath, Couve de Murville.'
      src:
        c: e86c8fdc
        rows:
        - 'w.ball-past-has-another-pattern 269: all'
      tags:
      - name:ball-george-w
      - name:heath-edward-r-g
      - name:couve-de-murville-maurice
- add:
    entry:
      id: cal.1963-01-14.europe-and-the-alliance-2
      when: Jan. 14
      date: '1963-01-14'
      thread: europe-and-the-alliance
      c: 'Bonn. Ball with Adenauer on the multilateral force, by Ball''s account. Adenauer: "You''ve set all my doubts to rest, Mr. Ball"; his government to announce its full support that afternoon. Of
        Britain: "You don''t seriously think Macmillan is ready for Europe, do you?"'
      n: '[[w.ball-past-has-another-pattern]], 269–70. Check: the government''s announcement not read. See [[cal.1962-12-18.europe-and-the-alliance]]. Names: Ball, Adenauer, Macmillan.'
      src:
        c: 663ee8e8
        rows:
        - 'w.ball-past-has-another-pattern 269–70: all'
      tags:
      - name:ball-george-w
      - name:adenauer-konrad
      - name:macmillan-harold
- add:
    entry:
      id: cal.1963-08-25.vietnam-2
      when: Aug. 25
      date: '1963-08-25'
      thread: vietnam
      c: 'Lodge, by the CIA''s channel, answering cable 243: the chances of Diệm''s meeting the demands "virtually nil," and asking them would let Nhu forestall the military. Go straight to the generals
        without telling Diệm: "prepared have Diem without Nhus but it is in effect up to them whether to keep him." No move until evacuation plans are ready; Harkins concurs. Forrestal relays it to Kennedy
        at Hyannis Port, 5:34 p.m.'
      n: '[FRUS 1961–63, III, doc. 285](https://history.state.gov/historicaldocuments/frus1961-63v03/d285). [[w.ball-past-has-another-pattern]], 372 (the cable). See [[cal.1963-08-24.vietnam]]. Names: Lodge,
        Diệm, Nhu, Harkins, Forrestal, Kennedy.'
      src:
        c: 7e32e2ea
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d285: all'
        - 'w.ball-past-has-another-pattern 372: A-C'
        - 'via w.ball-past-has-another-pattern 372 n.17: A-C'
      tags:
      - name:lodge-henry-cabot
      - name:ngo-dinh-diem
      - name:ngo-dinh-nhu
      - name:harkins-paul-d
      - name:forrestal-michael-v
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-08-25.vietnam-3
      when: Aug. 25
      date: '1963-08-25'
      thread: vietnam
      c: 'The Acting Secretary to Lodge: "Agree to modification proposed." Khánh, by his approach to the CIA, "one of best of Generals"; speed needed. The press to be briefed that afternoon, the Voice of
        America to broadcast Monday morning, Saigon time. Ball approves the change, by his account, cleared with Forrestal, Bundy away.'
      n: '[FRUS 1961–63, III, doc. 286](https://history.state.gov/historicaldocuments/frus1961-63v03/d286). [[w.ball-past-has-another-pattern]], 372 (the clearance). See [[cal.1963-08-25.vietnam-2]]. Names:
        Lodge, Khánh, Ball, Forrestal.'
      src:
        c: 68d22174
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d286: A-C'
        - 'w.ball-past-has-another-pattern 372: D'
      tags:
      - name:lodge-henry-cabot
      - name:nguyen-khanh
      - name:ball-george-w
      - name:forrestal-michael-v
- add:
    entry:
      id: cal.1963-08-28.africa
      when: Aug. 28
      date: '1963-08-28'
      thread: africa
      also:
      - europe-and-the-alliance
      - south-asia
      c: 'Ball leaves Washington for Lisbon and Rawalpindi: Salazar on Portugal''s African territories, Ayub Khan on American arms for India and Pakistan''s turn toward China. New Delhi dropped from the
        trip at Bowles''s objection. Quinn, lent by McNamara, with him.'
      n: '[[w.ball-past-has-another-pattern]], 276, 283, 372. Check: the day; Ball has it two days after Aug. 26. Names: Ball, Salazar, Ayub Khan, Bowles, Quinn, McNamara.'
      src:
        c: dcad6af5
        rows:
        - 'w.ball-past-has-another-pattern 276, 283, 372: all'
      tags:
      - name:ball-george-w
      - name:salazar-antonio-de-oliveira
      - name:ayub-khan-mohammad
      - name:bowles-chester
      - name:quinn-william-w
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1963-08-29.africa
      when: Aug. 29
      date: '1963-08-29'
      thread: africa
      c: 'Lisbon, at lunch. Ball with the Foreign Minister: the United States for a Portuguese presence in Africa; the difference over self-determination one of time, Portugal to think of "some practical
        time schedule such as outside figure 10 years." The Foreign Minister: African nationalism exploited by the Communists; Ben Bella''s threats empty.'
      n: '[FRUS 1961–63, XIII, doc. 356](https://history.state.gov/historicaldocuments/frus1961-63v13/d356). See [[cal.1963-08-28.africa]]. Names: Ball, Ben Bella.'
      src:
        c: b5be5ca2
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d356: all'
      tags:
      - name:ball-george-w
      - name:ben-bella-ahmed
- add:
    entry:
      id: cal.1963-08-30.africa
      when: Aug. 30–31
      date: '1963-08-30'
      thread: africa
      c: 'Lisbon. Ball and Salazar, two days of talks, by Ball''s account. Salazar: Portugal the poorest nation in Western Europe; to lose Angola and Mozambique would ruin it; no racial discrimination there;
        its peoples not ready, and the Congo the lesson. Ball for self-determination on a reasonable schedule. Ball to Kennedy by telegram: Portugal "ruled by a triumvirate consisting of Vasco da Gama,
        Prince Henry the Navigator, and Salazar."'
      n: '[[w.ball-past-has-another-pattern]], 277–78. Check: the days; Ball gives two days of talks before Pakistan. See [[cal.1963-08-28.africa]]. Names: Ball, Salazar, Kennedy.'
      src:
        c: 1011d01f
        rows:
        - 'w.ball-past-has-another-pattern 277–78: all'
      tags:
      - name:ball-george-w
      - name:salazar-antonio-de-oliveira
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-08-30.south-asia
      when: Aug. 30
      date: '1963-08-30'
      thread: south-asia
      also:
      - china
      c: 'Pakistan signs a civil air agreement with Communist China: landing rights in Pakistan, Dacca among them. In answer the United States holds up a promised $4.3 million loan for a new airport at
        Dacca.'
      n: '[[w.ball-past-has-another-pattern]], 283. Check: the agreement''s terms and the loan''s holding, not read elsewhere. See [[cal.1963-08-28.africa]].'
      src:
        c: f63820bb
        rows:
        - 'w.ball-past-has-another-pattern 283: all'
- add:
    entry:
      id: cal.1963-09-03.south-asia
      when: Sept. 3–5
      date: '1963-09-03'
      thread: south-asia
      c: 'Rawalpindi. Ball with Ayub Khan, late on Sept. 3; with Bhutto, his staff and the Pakistani command, Sept. 4, Quinn briefing them on what the United States could do for Pakistan; alone with Ayub,
        Sept. 5. Ayub: American arms for India undercut Pakistan; stop the arms race between them; Kashmir set aside for now. Ball: the threat China, not India; Pakistan not to be seduced by Peking.'
      n: '[[w.ball-past-has-another-pattern]], 283–85. See [[cal.1963-08-28.africa]]. Names: Ball, Ayub Khan, Bhutto, Quinn.'
      src:
        c: e11bebfb
        rows:
        - 'w.ball-past-has-another-pattern 283–85: all'
