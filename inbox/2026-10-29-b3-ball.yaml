- add:
    entry:
      id: cal.1964-06-05.vietnam
      when: June 5
      date: '1964-06-05'
      thread: vietnam
      also:
      - europe-and-the-alliance-france
      c: 'Paris. Ball with Couve de Murville in the morning, then with de Gaulle at the Élysée, Bohlen there, with Johnson''s letter. Ball: if the insurgency is not put down in a reasonable time, increasing
        military pressure on Hanoi; China now like the Soviet Union of 1917. De Gaulle: "I do not believe that you can win in this situation"; the more the United States conducts the war, the more the Vietnamese
        turn against it; to the French Southeast Asia "a ''rotten'' territory in which to fight," and France will not go to war in Asia, as an ally or otherwise; a vast diplomatic operation, France, India,
        China and Japan in it.'
      n: '[FRUS 1964–68, I, doc. 202](https://history.state.gov/historicaldocuments/frus1964-68v01/d202) (Johnson''s guidelines for the talk, June 4: [doc. 196](https://history.state.gov/historicaldocuments/frus1964-68v01/d196)).
        [[w.ball-past-has-another-pattern]], 377–78. Check: Ball gives de Gaulle''s words as Vietnam "rotten country." Names: Ball, Couve de Murville, de Gaulle, Bohlen, Johnson.'
      src:
        c: ea44fe21
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d202: all'
        - 'w.ball-past-has-another-pattern 377–78: B-D'
