      when: June
      date: 1964-06
      thread: cyprus
      c: 'New York. Ball with İnönü at the UN: Turkish and Greek delegates to meet Acheson at Geneva; no promise to refrain from a military solution if the talks fail. Papandreou will have no American at
        the table, Acheson to sit "in the next room or the next building."'
      n: '[[w.ball-past-has-another-pattern]], 356. Check: the day, after June 26. Names: Ball, İnönü, Acheson, Papandreou.'
