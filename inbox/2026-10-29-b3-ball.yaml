      id: cal.1965-05.vietnam
      when: May
      date: 1965-05
      thread: vietnam
      c: 'Ball, with Acheson and Cutler, expands his outline into some thirty-five pages, a program for "the social and political reconstruction of South Vietnam": amnesty for the Viet Cong who stop fighting;
        a constitution and elections open to all peaceful citizens; foreign troops to begin leaving when the insurgency stops; Saigon to offer it as its own. Ehrlich carries it to Saigon. U. Alexis Johnson
        with some interest, Taylor against.'
      n: '[[w.ball-past-has-another-pattern]], 394. Check: the days. Names: Ball, Acheson, Cutler, Ehrlich, U. Alexis Johnson, Taylor.'
