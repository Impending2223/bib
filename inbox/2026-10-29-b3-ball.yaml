      when: Nov. 25
      date: '1963-11-25'
      thread: assassination
      c: Ball alone of the top officials stays at the State Department through the funeral, with U. Alexis Johnson, against an emergency. The evening reception there, 220 guests; sixteen seated with Johnson
        for a few minutes each, Rusk talking.
      n: '[[w.ball-past-has-another-pattern]], 314–15. See [[cal.1963-11-25.assassination]]. Names: Ball, U. Alexis Johnson, Johnson, Rusk.'
