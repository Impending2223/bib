      when: June 2
      date: '1964-06-02'
      thread: cyprus
      c: 'Night, Ball Acting Secretary, Rusk at Nehru''s funeral. Hare''s "critic" from Ankara: Turkey''s Security Council has decided to invade Cyprus; forces deployed about Iskenderun to set up "a political
        and military beachhead."'
      n: '[[w.ball-past-has-another-pattern]], 350. Check: Hare''s cable not read. Names: Ball, Rusk, Nehru, Hare.'
