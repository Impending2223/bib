      when: Nov. 7
      date: '1964-11-07'
      thread: vietnam
      c: 'Ball''s paper for the working group: Britain to persuade Moscow to bring Peking and Hanoi to a conference, Britain bringing the United States and South Vietnam; a call by the United States, Britain
        and others for a cease-fire and the Viet Cong''s disarming. Meant to gain time, by his account.'
      n: '[[w.ball-past-has-another-pattern]], 388. Check: the paper not read. See [[cal.1964-11-03.vietnam]]. Names: Ball.'
