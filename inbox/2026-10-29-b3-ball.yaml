      id: cal.1968-08-21.soviet-union-czechoslovakia
      when: Aug. 21
      date: '1968-08-21'
      thread: soviet-union-czechoslovakia
      c: 'Morning, the White House. Johnson, Rusk and Ball on the invasion. Johnson to Ball: "George, the matter''s now in your hands; do what you have to do." Rusk: "put on your hawk''s beak, go into the
        Security Council, and give the Russians hell." By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 440. See [[cal.1968-08-20.soviet-union]]. Names: Johnson, Rusk, Ball.'
      src:
        c: 906e20db
        rows:
        - 'w.ball-past-has-another-pattern 440: all'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:ball-george-w
- add:
    entry:
      id: cal.1968-08-21.soviet-union-czechoslovakia-2
      when: Aug. 21
      date: '1968-08-21'
      thread: soviet-union-czechoslovakia
      c: 'Evening, the Security Council in emergency session. Malik against inscribing the item: the forces sent "at the request" of the Prague government. Ball: the invasion "an affront to all civilized
        sensibilities," Malik''s case "a feeble and futile effort at self-justification." Malik, short of the votes, would withdraw his objection; Ball forces the vote, Araujo Castro of Brazil presiding.
        The Council has messages from Hájek and from the National Assembly''s Presidium against "the illegal occupation."'
      n: '[[w.ball-past-has-another-pattern]], 440–41. Check: the vote and the record not read. See [[cal.1968-08-20.soviet-union]]. Names: Malik, Ball, Hájek.'
      src:
        c: 33904f8f
        rows:
        - 'w.ball-past-has-another-pattern 440–41: all'
      tags:
      - name:malik-yakov-aleksandrovich
      - name:ball-george-w
      - name:hajek-jiri
- add:
    entry:
      id: cal.1968-08-23.soviet-union-czechoslovakia-3
      when: Aug. 23
      date: '1968-08-23'
      thread: soviet-union-czechoslovakia
      c: 'Ignatieff for Canada, with seven cosponsors: the Secretary-General to send a representative to Prague "to seek the release and ensure the safety of the detained Czechoslovak leaders." Malik: a
        plot to lure Czechoslovakia from its allies; Caradon: "a contemptuous, personal insult."'
      n: '[[w.ball-past-has-another-pattern]], 441–42. Check: the day; Ball has it "the next day" after the first day''s debate. See [[cal.1968-08-22.soviet-union]]. Names: Ignatieff, Malik.'
      src:
        c: e41acea4
        rows:
        - 'w.ball-past-has-another-pattern 441–42: all'
      tags:
      - name:ignatieff-george
      - name:malik-yakov-aleksandrovich
- add:
    entry:
      id: cal.1968-08-24.soviet-union-czechoslovakia
      when: Aug. 24
      date: '1968-08-24'
      thread: soviet-union-czechoslovakia
      c: 'Evening. Hájek, Czechoslovakia''s Foreign Minister, flown from Prague, before the Council: no justification for the occupation, not done at his government''s request. Malik''s three-hour filibuster
        for East Germany''s taking part; defeated, 9–2, India abstaining. The session to 3 a.m.; Malik to Ball after: "Well, I certainly kept you up late, didn''t I?"'
      n: '[[w.ball-past-has-another-pattern]], 442–43. Check: the vote. See [[cal.1968-08-22.soviet-union]]. Names: Hájek, Malik, Ball.'
      src:
        c: 74b50066
        rows:
        - 'w.ball-past-has-another-pattern 442–43: all'
      tags:
      - name:hajek-jiri
      - name:malik-yakov-aleksandrovich
      - name:ball-george-w
