- add:
    entry:
      id: cal.1962-10-12.latin-america-panama
      when: Oct. 12
      date: '1962-10-12'
      thread: latin-america-panama
      c: Panama. Ball dedicates the first high bridge over the Canal, named by Congress the Thatcher Ferry Bridge, for an official of the Canal of 1910–13; the Panamanians want it "the Bridge of the Americas."
        A mob breaks through the police lines; Ball cuts his speech short. The bronze name plates chiseled off, Panama's flag set on the span.
      n: '[[w.ball-past-has-another-pattern]], 326. Check: the day; Ball has the dedication at 9:30 on a Friday morning in October. Names: Ball.'
      src:
        c: 3a7c6ec2
        rows:
        - 'w.ball-past-has-another-pattern 326: all'
      tags:
      - name:ball-george-w
- add:
