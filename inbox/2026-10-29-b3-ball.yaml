      date: '1964-11-22'
      thread: congo
      c: '5 p.m., Ball and McGeorge Bundy to Johnson: the military at Kamina recommend holding the drop one more night, to land with the column of 600 coming up to Stanleyville by Tuesday morning; 800 to
        drop.'
