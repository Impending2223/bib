      when: Jan. 25
      date: '1966-01-25'
      thread: vietnam-pause
      also:
      - china
      c: 'Ball to Johnson, "The Resumption of Bombing Poses Grave Danger of Precipitating a War With China": the war, if won, won in the South; sustained bombing "will more than likely lead us into war
        with Red China—probably in six to nine months," and perhaps a limited war with the Soviet Union. Drawn on Whiting of INR.'
      n: '[FRUS 1964–68, IV, doc. 41](https://history.state.gov/historicaldocuments/frus1964-68v04/d41). [[w.ball-past-has-another-pattern]], 406 (Whiting and Green). Names: Ball, Johnson, Whiting.'
