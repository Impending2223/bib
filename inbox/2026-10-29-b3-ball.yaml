      when: Dec. 29
      date: '1963-12-29'
      thread: europe-and-the-alliance
      c: 'The LBJ Ranch, breakfast on the terrace: Johnson, McGeorge Bundy and Ball with Erhard. Johnson on his advisers, by Ball''s account: "No head of state ever had such a galaxy of talent."'
      n: '[[w.ball-past-has-another-pattern]], 426. Check: the day, as Ball gives it. Names: Johnson, McGeorge Bundy, Ball, Erhard.'
