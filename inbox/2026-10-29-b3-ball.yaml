      when: June 5
      date: '1967-06-05'
      thread: middle-east-six-day-war
      c: 'Early morning. Rostow to Ball in Chicago by telephone: "Do you know there''s a war on?" Johnson wants McGeorge Bundy and Ball in Washington that afternoon; Ball, with speeches at noon and in the
        evening, stays. Bundy becomes executive secretary of the NSC''s Special Committee for the Middle East.'
