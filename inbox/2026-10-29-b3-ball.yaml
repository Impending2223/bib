      id: cal.1964-08.vietnam-2
      when: Aug.
      date: 1964-08
      thread: vietnam
      c: 'McNamara proposes a further De Soto patrol to show the flag; general agreement round the table. Ball: if a destroyer is sunk, a congressional investigation; the evidence would suggest the ships
        were sent to provoke an attack. Johnson: "We won''t go ahead with it, Bob. Let''s put it on the shelf." By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 379–80. Check: the day; Ball has it right after the second attack. Names: McNamara, Ball, Johnson.'
