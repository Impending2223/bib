      when: Nov. 25
      date: '1964-11-25'
      thread: congo
      c: '12:15 p.m., Ball to Johnson: Spaak for a second drop at Paulis, 450 Europeans and 7 Americans held there; McNamara, Rusk, McCone and Wheeler inclined to it. Johnson against: no "another Korea,
        another Viet-Nam, just because of somebody wandering around searching for ''Jesus Christ''"; why will the British and French not send planes?'
