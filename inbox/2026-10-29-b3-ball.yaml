      id: cal.1964-06-10.trade
      when: June 10
      date: '1964-06-10'
      thread: trade
      c: 'Geneva, the closing of the Conference on Trade and Development. Ball sets aside his prepared text: three months and nothing agreed; get to work. The conference sets up a Trade and Development
        Board and a permanent secretariat; the seventy-seven nations'' bloc emerges.'
      n: '[[w.ball-past-has-another-pattern]], 194–95, 352. Check: the day; Ball has the speech "on Wednesday night," before leaving for Athens; FRUS gives his visits to Athens and Ankara June 10–11. See
        [[cal.1964-03-25.trade]]. Names: Ball.'
      src:
        c: c52b0875
        rows:
        - 'w.ball-past-has-another-pattern 194–95, 352: all'
      tags:
      - name:ball-george-w
- add:
    entry:
      id: cal.1964-06-10.cyprus
      when: June 10–11
      date: '1964-06-10'
      thread: cyprus
      c: 'Athens, then Ankara. Papandreou to Ball, by Ball''s account: the time not ripe; a solution by enosis; he will not talk with İnönü, but will visit Johnson; Makarios a nuisance, to be left out.
        Ankara, about 2 a.m.: Hare. Erkin at 9; then İnönü, hurt by Johnson''s letter, its "juridical thunderbolts": the Foreign Office will have to answer them.'
      n: 'FRUS 1964–68, XVI, [doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v16/d64), n. 2 (the visits, June 10–11). [[w.ball-past-has-another-pattern]], 352–54. Names: Papandreou, Ball,
        İnönü, Johnson, Makarios III, Hare, Erkin.'
      src:
        c: d186e82c
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v16/d64: A'
        - 'w.ball-past-has-another-pattern 352–54: all'
      tags:
      - name:papandreou-george
      - name:ball-george-w
      - name:inonu-ismet
      - name:johnson-lyndon-b
      - name:makarios-iii
      - name:hare-raymond-a
      - name:erkin-feridun-c
- add:
    entry:
      id: cal.1964-06-11.cyprus
      when: June 11
      date: '1964-06-11'
      thread: cyprus
      c: 'Ball to Johnson, dictated on the flight home: for the first time Athens scared, fed up with Makarios and pleading for strong American intervention; the Turks "frightened," wanting a settlement
        forced on them with face saved; the UN unable to begin; the United States now able "to bring the Cyprus matter to a conclusion." İnönü invited for June 22, Papandreou for June 24, within hours of
        Ball''s return.'
      n: '[FRUS 1964–68, XVI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v16/d64). [[w.ball-past-has-another-pattern]], 354–55. See [[cal.1964-06-10.cyprus]]. Names: Ball, Johnson,
        Makarios III, İnönü, Papandreou.'
      src:
        c: a242231c
        rows:
