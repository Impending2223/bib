      date: '1965-02-13'
      thread: vietnam
      c: 'Johnson with Thompson, Bundy and Ball on the memorandum: he reads it, has Ball go through it point by point, thanks him and hands it back, by Ball''s account. Bundy had called Ball before to qualify
