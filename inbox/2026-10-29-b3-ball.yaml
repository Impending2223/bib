- add:
    entry:
      id: cal.1963-11-22.assassination-4
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      also:
      - succession
      c: 'The State Department, Ball Acting Secretary. The UPI flash about 1:40 p.m.; Rusk from his plane past Hickam. McCone has the Watch Committee working. Oswald found in the files: thirty-two months
        in the Soviet Union, a request for Soviet citizenship. Thompson and Harriman: not a Soviet move. Cleveland and Rostow with Ball draft the proclamations and messages, a day of national mourning among
        them. By Ball''s account.'
      n: '[[w.ball-past-has-another-pattern]], 310–12. See [[cal.1963-11-22.assassination]]. Names: Ball, Rusk, McCone, Oswald, Thompson, Harriman, Cleveland, Rostow.'
