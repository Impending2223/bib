- add:
    entry:
      id: cal.1964-02-04.cyprus
      when: Feb. 4
      date: '1964-02-04'
      thread: cyprus
      c: Nicosia. A bomb explodes in the American Embassy.
      n: '[[w.ball-past-has-another-pattern]], 342. Check: the damage and the hour. See [[cal.1964-01-25.europe-and-the-alliance]].'
      src:
        c: 95d4b7b0
        rows:
        - 'w.ball-past-has-another-pattern 342: all'
- add:
    entry:
      id: cal.1964-02-09.cyprus
      when: Feb. 9
      date: '1964-02-09'
      thread: cyprus
      c: 'London. Ball with Sandys: if Makarios turns them down, the guarantor powers to the Security Council, no American unit in a UN force, no protection for him from a Turkish move. Sandys declines
        to make the tour. That night Ball sounds Kyprianou.'
      n: '[[w.ball-past-has-another-pattern]], 342–43. See [[cal.1964-02-09.europe-and-the-alliance-cyprus]]. Names: Ball, Sandys, Makarios III, Kyprianou.'
      src:
        c: 102728de
        rows:
        - 'w.ball-past-has-another-pattern 342–43: all'
      tags:
      - name:ball-george-w
      - name:sandys-duncan-e
      - name:makarios-iii
      - name:kyprianou-spyros
- add:
    entry:
      id: cal.1964-02-10.cyprus
      when: Feb. 10
      date: '1964-02-10'
      thread: cyprus
      c: 'Ankara, then Athens. İnönü to Ball: Turkish patience running out; so long as Turkey''s right of intervention stands, it will go along with the NATO force. In Athens the caretaker Prime Minister,
        Paraskevopoulos, can commit to nothing: Greece would likely approve what Makarios approves.'
      n: '[[w.ball-past-has-another-pattern]], 343. Check: the days, Ball giving none. See [[cal.1964-02-09.europe-and-the-alliance-cyprus]]. Names: İnönü, Ball, Paraskevopoulos, Makarios III.'
      src:
        c: 25f2a36d
        rows:
        - 'w.ball-past-has-another-pattern 343: all'
      tags:
      - name:inonu-ismet
      - name:ball-george-w
      - name:paraskevopoulos-john
      - name:makarios-iii
- add:
    entry:
      id: cal.1964-02-12.cyprus
      when: Feb. 12
      date: '1964-02-12'
      thread: cyprus
      c: 'Nicosia. Ball with Makarios, Sisco, Jernegan, Wilkins and Pickard with him. The morning calm; the afternoon "bloody": Makarios for the Security Council and a UN guarantee of Cyprus''s independence
        and integrity. Ball, by his telegram to Johnson, "in a fashion remote from diplomatic exchanges": the Turks would invade and no Western power would stop them. That night, by teletype, to Johnson
        and Rusk: overwhelming pressure on Makarios.'
      n: '[[w.ball-past-has-another-pattern]], 343–45. See [[cal.1964-02-09.europe-and-the-alliance-cyprus]]. Names: Ball, Makarios III, Sisco, Jernegan, Wilkins, Pickard, Johnson, Rusk.'
      src:
        c: 581fab81
        rows:
        - 'w.ball-past-has-another-pattern 343–45: all'
      tags:
      - name:ball-george-w
      - name:makarios-iii
      - name:sisco-joseph-j
      - name:jernegan-john-d
      - name:wilkins-fraser
      - name:pickard-cyril-stanley
      - name:johnson-lyndon-b
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-02-13.cyprus
      when: Feb. 13–14
      date: '1964-02-13'
      thread: cyprus
      c: 'Nicosia, the second and third days. Ball to Makarios, of the killings at Limassol: the island not to become "your private abattoir." The night of the 13th, by teletype, Johnson and Douglas-Home,
        in Washington with Butler, and Rusk approve a new variant; Makarios will not move. Sandys protests; Ball: "Should I seek higher authority?"'
      n: '[[w.ball-past-has-another-pattern]], 345–46. See [[cal.1964-02-09.europe-and-the-alliance-cyprus]]. Names: Ball, Makarios III, Johnson, Douglas-Home, Butler, Rusk, Sandys.'
      src:
        c: 6f95364e
        rows:
        - 'w.ball-past-has-another-pattern 345–46: all'
      tags:
      - name:ball-george-w
      - name:makarios-iii
      - name:johnson-lyndon-b
      - name:douglas-home-alec
      - name:butler-richard-a
      - name:rusk-dean
      - name:sandys-duncan-e
- add:
    entry:
      id: cal.1964-02-14.cyprus
      when: Feb. 14
      date: '1964-02-14'
      thread: cyprus
      c: 'Ankara again. Ball to İnönü: the UN to do nothing against Turkey''s rights of intervention. İnönü agrees, reluctantly: further serious violence on the island and Turkey will not stand still. Ball
        to London that night.'
      n: '[[w.ball-past-has-another-pattern]], 347. See [[cal.1964-02-09.europe-and-the-alliance-cyprus]]. Names: Ball, İnönü.'
      src:
        c: 558c6f59
        rows:
        - 'w.ball-past-has-another-pattern 347: all'
      tags:
      - name:ball-george-w
      - name:inonu-ismet
- add:
    entry:
      id: cal.1964-02-15.cyprus
      when: Feb. 15
      date: '1964-02-15'
      thread: cyprus
      c: 'London, the Grosvenor House, from 3 a.m. Ball''s plan, telegraphed to Johnson as his own idea: Britain, Greece and Turkey to use their rights of intervention together, their forces in small mixed
        units, three to a jeep, until a UN force is on the ground or a settlement made. "The Greek Cypriotes do not want a peace-keeping force; they just want to be left alone to kill Turkish Cypriotes."
        The British will not take it up.'
      n: '[[w.ball-past-has-another-pattern]], 347–48. See [[cal.1964-02-09.europe-and-the-alliance-cyprus]]. Names: Ball, Johnson.'
      src:
        c: '20002733'
        rows:
        - 'w.ball-past-has-another-pattern 347–48: all'
      tags:
      - name:ball-george-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-02.cyprus
      when: Feb.
      date: 1964-02
      thread: cyprus
      c: 'Athens, after Papandreou''s victory of Feb. 19: demonstrations at the American Embassy, the information office''s windows smashed, Johnson''s pictures burned. Johnson to Ball by telephone: "Why
        are those Greeks burning my picture?"'
      n: '[[w.ball-past-has-another-pattern]], 348–49. Check: the days. Names: Papandreou, Johnson, Ball.'
      src:
        c: f3fa9681
        rows:
        - 'w.ball-past-has-another-pattern 348–49: all'
      tags:
      - name:papandreou-george
      - name:johnson-lyndon-b
      - name:ball-george-w
- add:
    entry:
      id: cal.1964-02-27.cyprus
      when: Feb. 27–28
      date: '1964-02-27'
      thread: cyprus
      c: Ball telephones Acheson at home, Feb. 27, to mediate quietly between Athens and Ankara; Acheson to lunch the next day, willing, by Ball's account.
      n: '[[w.ball-past-has-another-pattern]], 349–50. Names: Ball, Acheson.'
      src:
        c: 984e7b73
        rows:
        - 'w.ball-past-has-another-pattern 349–50: all'
      tags:
      - name:ball-george-w
      - name:acheson-dean-g
- add:
    entry:
      id: cal.1964-03-13.cyprus
      when: Mar. 13
      date: '1964-03-13'
      thread: cyprus
      c: 'Ankara announces Turkey will intervene at once unless the fighting on the island stops, the ticker reporting twenty-four hours given. Ball to Johnson after lunch: the Swedes will announce a contingent
        that afternoon, the Canadians, waiting for another country, to be told before their parliament sits; Canadian troops in the air within twelve hours. The démarche withdrawn.'
      n: '[[w.ball-past-has-another-pattern]], 349. See [[cal.1964-03-04.europe-and-the-alliance]]. Names: Ball, Johnson.'
      src:
        c: 68abc0f7
        rows:
        - 'w.ball-past-has-another-pattern 349: all'
      tags:
      - name:ball-george-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-03-25.trade
      when: Mar. 25
      date: '1964-03-25'
      thread: trade
      c: 'Geneva, the UN Conference on Trade and Development, convened Mar. 23. Ball for the United States: commodity agreements "feasible for only a small number"; preferences for the developing countries
        to be weighed against the cost of departing from nondiscriminatory trade, special trading ties carrying special political responsibilities; the United States for lower tariffs and wider access.
        Giscard d''Estaing, the day before, for organized markets and guaranteed prices.'
      n: '"Common Problems of Industrial and Developing Countries," [[w.department-of-state-bulletin]], [Apr. 20, 1964, 634](https://archive.org/details/departmentofstat5064unit/page/634/mode/1up). [[w.ball-past-has-another-pattern]],
        193–94 (Giscard). Names: Ball, Giscard d''Estaing.'
      src:
        c: dba257f0
        rows:
