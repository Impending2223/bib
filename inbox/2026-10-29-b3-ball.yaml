      date: '1961-12-14'
      thread: congo
      also:
      - conservative-movement
      c: 'The American Committee for Aid to Katanga Freedom Fighters, Max Yergan chairman, in a full-page advertisement in the *New York Times* and seventeen other papers: "Katanga is the Hungary of 1961."
        The United States to stop paying for the UN''s operation in Katanga.'
      n: '[[w.ball-past-has-another-pattern]], 234. Check: the advertisement not read. See [[cal.1961-12-21.congo]]. Names: Yergan.'
      src:
        c: 38d0e76c
        rows:
        - 'w.ball-past-has-another-pattern 234: all'
- add:
    entry:
      id: cal.1961-12-17.congo
      when: Dec. 17
      date: '1961-12-17'
      thread: congo
      c: 'Ball to Kennedy in Bogotá: the UN''s limited military objectives at Elisabethville substantially reached; a de facto suspension of hostilities, not a formal cease-fire, the British and French
        having made the difference plain to Tshombe; Tshombe to meet Adoula, apparently without conditions. Gullion to fly him to Kitona.'
      n: '[FRUS 1961–63, XX, doc. 166](https://history.state.gov/historicaldocuments/frus1961-63v20/d166). See [[cal.1961-12-14.congo-2]]. Names: Ball, Kennedy, Tshombe, Adoula, Gullion.'
      src:
        c: a1b3b5a9
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v20/d166: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:tshombe-moise
      - name:adoula-cyrille
      - name:gullion-edmund-a
- add:
    entry:
      id: cal.1961-12-19.congo
      when: Dec. 19
      date: '1961-12-19'
      thread: congo
      c: 'Ball before the Town Hall at Los Angeles, "The Elements in Our Congo Policy": Congolese unity "perhaps the only really ''modern'' issue"; should Adoula fail to deal with Katanga''s secession,
        Gizenga would bid for the central government, and "our main objectives in central Africa would be drowned in blood." "There simply is no legal case, no political case, no economic case, and no moral
        case for Balkanizing the heart of Africa."'
      n: 'Ball, "The Elements in Our Congo Policy," [[w.department-of-state-bulletin]], [Jan. 8, 1962, 43](https://archive.org/details/departmentofstat461962unit/page/43/mode/1up). [[w.ball-past-has-another-pattern]],
        232–33. See [[cal.1961-12-14.congo]]. Names: Ball, Adoula, Gizenga.'
      src:
        c: 4c42a73d
        rows:
        - 'https://archive.org/details/departmentofstat461962unit/page/43/mode/1up: all'
        - 'w.ball-past-has-another-pattern 232–33: all'
        - 'via w.ball-past-has-another-pattern 233 n.8: all'
      tags:
      - name:ball-george-w
      - name:adoula-cyrille
      - name:gizenga-antoine
