- add:
    entry:
      id: cal.1963-11-29.south-asia
      when: Nov. 29
      date: '1963-11-29'
      thread: south-asia
      c: 'Ball takes Bhutto to Johnson, at Johnson''s insistence, and puts in critical remarks Johnson takes up, by Ball''s account. Bhutto, leaving, to Ball: "How dare you treat me like this?"'
      n: '[[w.ball-past-has-another-pattern]], 315. Names: Ball, Bhutto, Johnson.'
