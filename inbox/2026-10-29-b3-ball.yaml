      when: Aug. 9
      date: '1964-08-09'
      thread: cyprus
      c: '10:23 a.m., Ball to Labouisse, flash, for Papandreou: Cyprus has asked the Soviet Union for military intervention; no Soviet, Egyptian or other forces to be let onto the island; "on the verge
        of holocaust," Makarios threatening a general massacre; Papandreou to get Grivas and his men in hand and settle with İnönü on Acheson''s lines: "no longer time for horse-trading or equivocation
        or passionate oratory."'
      n: '[FRUS 1964–68, XVI, doc. 114](https://history.state.gov/historicaldocuments/frus1964-68v16/d114). [[w.ball-past-has-another-pattern]], 357. Check: Ball gives it as of "Sunday, August 12." See
        [[cal.1964-08-08.europe-and-the-alliance]]. Names: Ball, Labouisse, Papandreou, Makarios III, Grivas, İnönü, Acheson.'
