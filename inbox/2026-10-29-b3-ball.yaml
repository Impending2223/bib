      id: cal.1961-12-19.congo-2
      when: Dec. 19
      date: '1961-12-19'
      thread: congo
      also:
      - republican-party
      c: 'Nixon, in a syndicated article in the *New York Herald Tribune*: the administration''s Congo policy has failed and leads toward a Communist Congo; Tshombe "a dedicated anti-Communist."'
      n: '[[w.ball-past-has-another-pattern]], 234. Check: the article not read. See [[cal.1961-12-14.congo]]. Names: Nixon, Tshombe.'
      src:
        c: 28b745c3
        rows:
        - 'w.ball-past-has-another-pattern 234: all'
      tags:
      - name:nixon-richard-m
      - name:tshombe-moise
- add:
    entry:
      id: cal.1961-12-22.congo
      when: Dec. 22
      date: '1961-12-22'
      thread: congo
      c: 'Ball to McGeorge Bundy at Bermuda by telephone, by Ball''s account: Tshombe''s cabinet, after three hours the night before, has denounced the Kitona agreement as not binding. State''s program
        of economic pressure on Katanga, in three stages, to Leopoldville: Tshombe''s financial backers to be put in jeopardy, the Congo''s tax and customs offices in Belgium reopened; the United States,
        Belgium, Britain and the UN to consult first.'
      n: '[FRUS 1961–63, XX, doc. 179](https://history.state.gov/historicaldocuments/frus1961-63v20/d179). [[w.ball-past-has-another-pattern]], 258 (the call). See [[cal.1961-12-21.congo]]. Names: Ball,
        McGeorge Bundy, Tshombe.'
      src:
        c: 3f6dd552
        rows:
        - 'w.ball-past-has-another-pattern 258: A'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v20/d179: B-C'
      tags:
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:tshombe-moise
