      when: June 28
      date: '1965-06-28'
      thread: vietnam-july-decision
      c: 'Ball, "Cutting Our Losses in South Viet-Nam," "written on the premise that we are losing the war": the costs of a war fought by American forces against those of a carefully organized withdrawal.
        Saigon to be told it must form a government of national union under civilian leadership within a month, or the commitment reconsidered. "South Vietnam is a country with an army and no government."'
      n: '[FRUS 1964–68, III, doc. 26](https://history.state.gov/historicaldocuments/frus1964-68v03/d26). [[w.ball-past-has-another-pattern]], 396–97. See [[cal.1965-06-18.vietnam-july-decision]]. Names:
        Ball.'
