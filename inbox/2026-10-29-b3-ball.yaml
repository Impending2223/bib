      when: Nov. 21
      date: '1963-11-21'
      thread: trade
      c: Ball before Senate Banking and Currency on S. 2310, Mundt's bill against guarantees by the Export-Import Bank or any agency of payment by Communist countries; Fulbright and Linder of the Bank too.
        The Soviet purchasing mission under Borisov, First Deputy Minister of Foreign Trade, arrives the same day, Ball and Franklin D. Roosevelt Jr. to negotiate with it.
      n: '[109 Cong. Rec. D567](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=565). [[w.ball-past-has-another-pattern]], 202, 310 (the mission). See [[cal.1963-10-09.trade]].
