patch: opinions
by: 'Claude (opinions agent: the Attorney General''s and OLC''s opinions, 1960-69)'
ops:
- add:
    entry:
      id: cal.1961-01-25.cuba-2
      when: Jan. 25
      date: '1961-01-25'
      thread: cuba-bay-of-pigs
      c: 'Kramer, Office of Legal Counsel, to Robert Kennedy: a blockade of Cuba lawful as an incident of war, legal or de facto; conceivably as a necessary measure of defense. Cuba, other states and their nationals could test it in American courts; Cuba could take it to the UN and the OAS.'
      n: '[1 Op. O.L.C. Supp. 195](https://www.justice.gov/olc/file/477221/dl#page=211) (Jan. 25, 1961), memorandum opinion for the Attorney General; Kramer signed the cover memorandum and the memorandum (the editor''s note). Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1960-03-17.cuba]]. Names: Kramer, Robert Kennedy.'
      tags:
      - name:kramer-robert
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1961-04-12.cuba-3
      when: Apr. 12
      date: '1961-04-12'
      thread: cuba-bay-of-pigs
      c: 'Katzenbach, Office of Legal Counsel, to Robert Kennedy, on intervention: a neutral state breaks international law if it lets organized armed forces attack from its territory, pass through it, or be organized and trained there; not if private parties provide arms, even stockpile them, or recruit and train volunteers short of an organized force.'
      n: '[1 Op. O.L.C. Supp. 225](https://www.justice.gov/olc/file/477221/dl#page=241) (Apr. 12, 1961), memorandum opinion for the Attorney General. Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1960-03-17.cuba]]. Names: Katzenbach, Robert Kennedy.'
      tags:
      - name:katzenbach-nicholas
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1961-08-02.amendments
      when: Aug. 2
      date: '1961-08-02'
      thread: amendments
      c: 'Robert Kennedy to the President, on presidential inability: the Vice President acts as President while it lasts, and decides it where the President cannot; the President decides when it has ended. The Eisenhower-Nixon memorandum of Mar. 3, 1958, reads the clause rightly; Brownell and Rogers had said the same.'
      n: '[42 Op. Att''y Gen. 69](https://archive.org/details/op-atty-gen/042/page/n93/mode/1up) (1961). To check: [[w.feerick-twenty-fifth-amendment]]. Names: Robert Kennedy, Eisenhower, Nixon, Brownell, Rogers.'
      tags:
      - name:kennedy-robert-f
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      - name:brownell-herbert-jr
      - name:rogers-william-p
- add:
    entry:
      id: cal.1961-08-10.amendments
      when: Aug. 10
      date: '1961-08-10'
      thread: amendments
      c: Kennedy and Johnson adopt the Eisenhower-Nixon procedures on presidential inability. The President to tell the Vice President, who acts until it ends; where he cannot, the Vice President decides, after such consultation as seems to him appropriate, the Cabinet's support and the Attorney General's advice in mind; the President decides when it has ended.
      n: 'White House Statement and Text of Agreement Between the President and the Vice President on Procedures in the Event of Presidential Inability, [1961 Pub. Papers 561](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=619) (Aug. 10, 1961). See [[cal.1961-08-02.amendments]]. Names: Kennedy, Johnson, Eisenhower, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1961-09-26.civil-rights-the-executive
      when: Sept. 26
      date: '1961-09-26'
      thread: civil-rights-the-executive
      c: 'Robert Kennedy to Johnson, as chairman of the equal employment committee, the President concurring: Executive Order 10925 valid. The nondiscrimination clause in government contracts and its sanctions rest on the power of the United States to fix the terms on which it buys; the committee''s rules give contractors adequate procedure.'
      n: '[42 Op. Att''y Gen. 97](https://archive.org/details/op-atty-gen/042/page/n121/mode/1up) (1961). Made public: released for publication Oct. 26, 1965 (the volume''s note). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Robert Kennedy, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1962-06-14.women
      when: June 14
      date: '1962-06-14'
      thread: women
      c: 'Robert Kennedy to the President: the President may prescribe when appointing officers may consider only men or only women for a federal post. The opinion of 1934 leaving it to each agency head overruled.'
      n: '[42 Op. Att''y Gen. 157](https://archive.org/details/op-atty-gen/042/page/n181/mode/1up) (1962), overruling 38 Op. Att''y Gen. 77 (1934). See [[cal.1961-12-14.program]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-07-24.women
      when: July 24
      date: '1962-07-24'
      thread: women
      c: 'Kennedy to the heads of departments and agencies, on the Attorney General''s opinion: appointment and promotion hereafter without regard to sex, but where the Civil Service Commission finds an exception justified on objective standards. Dated July 23.'
      n: 'Memorandum on Equal Opportunity for Women in the Federal Service, [1962 Pub. Papers 578](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=638) (July 24, 1962). See [[cal.1962-06-14.women]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-08-30.missile-crisis
      when: Aug. 30
      date: '1962-08-30'
      thread: missile-crisis
      c: 'Schlei, Office of Legal Counsel, to Robert Kennedy: should the Soviet Union put missile bases in Cuba, international law would allow the United States extreme measures, force among them, to end the threat; the OAS and the UN first if time allows; no more force than needed.'
      n: '[1 Op. O.L.C. Supp. 251](https://www.justice.gov/olc/file/477221/dl#page=267) (Aug. 30, 1962), with a cover memorandum and an appendix of historical materials. Made public: Norbert A. Schlei, Anticipatory Self-Defense, 6 Green Bag 2d 195 (2003), without the cover memorandum and the appendix; in full, 1 Op. O.L.C. Supp. (2013) (the editor''s note). See [[cal.1962-05-24.missile-crisis]]. Names: Schlei, Robert Kennedy.'
      tags:
      - name:schlei-norbert-a
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-10-19.missile-crisis
      when: Oct. 19
      date: '1962-10-19'
      thread: missile-crisis
      c: 'A memorandum, unsigned and unaddressed, in the Office of Legal Counsel''s daybooks: the President may blockade Cuba under the laws of the United States without further action by Congress, ships alone or aircraft too. Lawful under international law, but open to question in the OAS and the UN; Cuba and the Soviet bloc could take it as an act of war.'
      n: '[1 Op. O.L.C. Supp. 486](https://www.justice.gov/olc/file/477221/dl#page=502) (Oct. 19, 1962); the editor''s note: perhaps Meeker''s, with Katzenbach. [FRUS 1961–63, XI, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v11/d31) (Meeker''s record of the meeting at State, 11 a.m.: Katzenbach, the President''s authority "ample"; a declaration of war unnecessary). Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1962-10-16.missile-crisis]].'
- add:
    entry:
      id: cal.1964-07-01.mississippi
      when: July 1
      date: '1964-07-01'
      thread: mississippi
      c: Katzenbach, Deputy Attorney General, to Johnson, through Lee White, on federal men in Mississippi. Agents may investigate and prosecute federal crimes; marshals would aggravate it; troops under 10 U.S.C. 332 and 333 only on a breakdown of the State's law enforcement, of which there is not yet evidence enough. More FBI agents the course.
      n: '[1 Op. O.L.C. Supp. 493](https://www.justice.gov/olc/file/477221/dl#page=509) (July 1, 1964), memorandum for the President, with Katzenbach''s cover memorandum to White of the same date (the editor''s note). Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1964-06-21.mississippi]]. Names: Katzenbach, Johnson, White.'
      tags:
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
      - name:white-lee-c
- add:
    entry:
      id: cal.1965-06-10.vietnam
      when: June 10
      date: '1965-06-10'
      thread: vietnam-force-levels
      c: 'Katzenbach to Johnson: no further approval by Congress needed, as a matter of law, to send 30,000 to 40,000 more troops and use them against Viet Cong concentrations as much as 150 miles from American bases. The Commander in Chief''s power; the Southeast Asia resolution. A resolution''s political uses to be weighed against its risks.'
      n: '[FRUS 1964–68, II, doc. 345](https://history.state.gov/historicaldocuments/frus1964-68v02/d345) (the date handwritten). See [[cal.1965-06-07.vietnam]]. Names: Katzenbach, Johnson.'
      tags:
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-02-25.transportation
      when: Feb. 25
      date: '1967-02-25'
      thread: transportation
      c: 'Clark, Acting Attorney General, to Boyd: the President may impound federal-aid highway funds apportioned to the States until the Secretary approves a project. Appropriations permit spending, not compel it; the States have no right to the funds before approval.'
      n: '[42 Op. Att''y Gen. 347](https://archive.org/details/op-atty-gen/042/page/n371/mode/1up) (1967). To check: [[w.fisher-presidential-spending-power]]. See [[cal.1966-11-29.economy]]. Names: Clark, Boyd.'
      tags:
      - name:clark-ramsey
      - name:boyd-alan-s
- add:
    entry:
      id: cal.1969-01-18.immigration
      when: Jan. 18
      date: '1969-01-18'
      thread: immigration
      c: 'Clark''s statement of interpretation on expatriation, after *Afroyim v. Rusk*: the expatriation provisions to be applied only to acts that show a voluntary relinquishment of citizenship, a transfer or abandonment of allegiance. The citizen may raise his intent; each case decided on all the evidence.'
      n: '[42 Op. Att''y Gen. 397](https://archive.org/details/op-atty-gen/042/page/n421/mode/1up) (1969). See [[cal.1967-05-29.court-2]]. Names: Clark.'
      tags:
      - name:clark-ramsey
