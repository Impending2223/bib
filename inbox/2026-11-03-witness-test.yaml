        - 'Wang Xiangen, *Kangmei yuanyue shilu* (1990), 46, 100–101 (cited by [[w.jian-maos-china-and-the]], 222 nn.76–77, for the agreements)'
        - 'Allen S. Whiting, "China''s Role in the Vietnam War," in Jayne Werner and David Hunt, eds., *The American War in Vietnam* (1993), 74 (cited by [[w.jian-maos-china-and-the]], 229 n.100, for 50,000 Chinese troops in all, and "Vietnamese sources" for 20,000)'
  - edit:
      id: cal.1965-06-06.vietnam
      base: fbb2f790
      set:
        variants:
          - {unit: C, witness: x.1993.whiting-chinas-role-in-the-vietnam-war, reads: '50,000 Chinese troops sent to Vietnam in all', at: 'Chen, 358 n.100 (Whiting, 74, not read)'}
