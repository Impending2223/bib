      id: cal.1964-08-05.china
      base: 7d8f3ab7
      set:
        variants:
          - {unit: D, witness: w.jian-maos-china-and-the, reads: 'the statement of 5 August (text, 214); its print, "Renmin ribao (People''s Daily), 6 August 1965" (note)', at: '214; 355 n.42'}
