      rows:
        - 'via w.jian-maos-china-and-the 227 n.93a: C'
  # --- 1965-05-31: Chen Yi's four points; where Zhou gave Ayub the message ------------------------------------------
  - cite:
      id: cal.1965-05-31.vietnam
      item: '[[w.77-conversations-between-chinese]], 77–81 (Zhou Enlai with Ayub Khan, doc. 6, headed Karachi, Apr. 2, 1965: three points, not four)'
      units: G
  - check:
      id: cal.1965-05-31.vietnam
      text: 'Check: the transcript (77 Conversations, doc. 6, 77) is headed Karachi, Apr. 2, 1965, and gives three points; Chen cites it at 79–85, the Wilson Center''s copy prints it at 76–81.'
  - edit:
      id: cal.1965-05-31.vietnam
      base: 08cc795d
      set:
        variants:
          - {unit: G, witness: x.1965-05-31.editorial-note-frus-1964-1968-2, reads: '"when they met in Peking on April 2"', at: 'FRUS 1964–68, II, doc. 321'}
          - {unit: G, witness: x.1998.frus-1964-68-xxx-doc-88-n4, reads: 'Ayub given the message "when he visited Peking in March" (telegram 720, as summarized)', at: 'FRUS 1964–68, XXX, doc. 88 n.4'}
          - {unit: G, witness: x.1965-04-02.transcript-zhou-enlais-conversation-with-ayub, reads: 'headed "Karachi, 2 April 1965"; three points to convey', at: '77 Conversations, doc. 6, 77, 80'}
          - {unit: G, witness: w.jian-maos-china-and-the, reads: '"Zhou Enlai, visiting Karachi, Pakistan," Apr. 2', at: '217'}
