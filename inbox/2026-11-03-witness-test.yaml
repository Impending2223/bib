patch: witness-test
by: reading agent, the witness test (R35-R43) on Chen, Mao's China and the Cold War; Asselin not read (copy not fetched)
# The witnesses: inbox/witnesses/2026-11-03-witness-test.yaml; the work's edges:
# sources/witnesses/by-work/jian-maos-china-and-the.yaml; the book-check addendum: notes/book-checks/chen-maos-china.md.
ops:
  # --- 1960-07: the experts recalled (82 n.158) -------------------------------------------------------------------
  - src:
      id: cal.1960-07.china
      rows:
        - 'via x.1988.xue-mouhong-dangdai-zhongguo-waijiao: A'
        - 'via x.1989.cong-jin-quzhe-fazhan-de-suiyue: A'
        - 'via x.1996.chen-jian-crucial-step-withdrawal-soviet-experts: A'
  - to-check:
      id: cal.1960-07.china
      add:
        - 'Xue Mouhong et al., *Dangdai zhongguo waijiao* (1988), 116–19 (cited by [[w.jian-maos-china-and-the]], 82 n.158)'
        - 'Cong Jin, *Quzhe fazhan de suiyue* (1989), 364 (cited by [[w.jian-maos-china-and-the]], 82 n.158)'
        - 'Chen Jian, "A Crucial Step toward the Breakdown of the Sino-Soviet Alliance," *Cold War International History Project Bulletin*, nos. 8–9 (1996–97), 246, 249–50 (cited by [[w.jian-maos-china-and-the]], 82 n.158)'
