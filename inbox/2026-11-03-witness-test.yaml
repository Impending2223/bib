  # --- 1964-08-05: Peking's cable, the readiness order, the statement (212-14 nn.34-35, 42) --------------------------
  - src:
      id: cal.1964-08-05.china
      rows:
        - 'via x.1989.li-ke-hao-shengzhang-wenhua-dageming-408: B'
        - 'via x.1989.qu-aiguo-chinese-supporters-40: B'
        - 'via x.1989.wang-dinglie-dangdai-zhongguo-kongjun-384: C'
        - 'via x.1964-08-05.cmc-general-staff-combat-readiness-order: C'
  - to-check:
      id: cal.1964-08-05.china
      add:
        - 'Li Ke and Hao Shengzhang, *Wenhua dageming zhong de renmin jiefang jun* (1989), 408, and Qu Aiguo, "Chinese Supporters in the Operations to Assist Vietnam and Resist America," *Junshi shilin*, no. 6 (1989), 40 (cited by [[w.jian-maos-china-and-the]], 213 n.34, for the cable)'
