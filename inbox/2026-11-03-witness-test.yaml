        - 'via x.1965-05-30.sino-vietnamese-road-agreement: B'
  - to-check:
      id: cal.1965-06-06.vietnam
      add:
        - 'Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), 1:540–41, 545, 548 (cited by [[w.jian-maos-china-and-the]], 222–23 nn.76, 79, 82)'
