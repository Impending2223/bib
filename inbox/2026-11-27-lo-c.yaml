- check:
    id: cal.1960-04-25.china-leadership-9
    text: 'Check: whether the 6:30 banquet is Zhu De''s, [[cal.1960-04-25.china-leadership-13]], which Zhu De nianpu III, 1773 and Peng Zhen nianpu IV, 21–22 put in the evening of the 25th.'
- check:
    id: cal.1961-04-05.laos
    text: 'Check: whether Phoumi''s offensive of this day, [[cal.1961-04-05.laos-2]], is the same operation.'
- check:
    id: cal.1961-05-19.freedom-rides-2
    text: 'Check: the day; the Public Papers date the Peace Corps council meeting May 22, [[cal.1961-05-22.peace-corps]].'
- check:
    id: cal.1961-05-30.laos-2
    text: 'Check: whether the crash is the Air America H-34 crash of [[cal.1961-05-30.laos]].'
- check:
    id: cal.1967-07-20.china-leadership-2
    text: 'Check: the venue of the meeting; Zhou chronology III, 167 has Lin Biao''s, [[cal.1967-07-20.china-leadership-15]] the Great Hall.'
- check:
    id: cal.1967-07-20.china-leadership-15
    text: 'Check: the venue of the meeting; Zhou chronology III, 167 (in [[cal.1967-07-20.china-leadership-2]]) has Lin Biao''s.'
- check:
    id: cal.1962-07-11.china-leadership-2
    text: 'Check: the report to Mao is the midnight report of [[cal.1962-07-12.china-leadership]], which Mao nianpu V puts on July 12; Zhou nianpu II, 489 puts it on July 11.'
- check:
    id: cal.1962-07-19.china-leadership-10
    text: 'Check: Mao zhuan V, ch. 70 has the Center''s urgent notice sent July 18 ([[cal.1962-07-18.china-leadership-4]]).'
- check:
    id: cal.1966-09-24.china-leadership-6
    text: 'Check: the day; [[cal.1966-09-23.china-leadership-4]] has the Center send the report out Sept. 23.'
- check:
    id: cal.1960-03-08.china-leadership-3
    text: 'Check: the day; Zhou nianpu II, 292 has Mar. 8, Waijiao huodong 271 and Peng Zhen nianpu IV, 8 Mar. 7 (afternoon, the Great Hall) ([[cal.1960-03-08.china-leadership-2]]).'
- check:
    id: cal.1960-11-29.china-leadership-7
    text: 'Check: whether Deng''s telling Kapo is one of the briefings of [[cal.1960-11-29.soviet-union-4]].'
- check:
    id: cal.1965-02-08.vietnam-force-levels
    text: 'Check: the Hawk order; [[cal.1965-02-07.vietnam]] has it on Feb. 7.'
- check:
    id: cal.1968-03-31.elections-1968-9
    text: 'Check: whether the call to the President is the call to Mrs. Johnson of [[cal.1968-03-31.elections-1968-mccarthy-2]].'
- check:
    id: cal.1964-10-14.china-leadership-2
    text: 'Check: the day; [[cal.1964-10-15.china-leadership-8]] has the same call "late at night" on Oct. 15.'
- check:
    id: cal.1964-12-14.laos
    text: 'Check: the date of Barrel Roll''s start; [[cal.1964-12-12.laos]] has it Dec. 12.'
- check:
    id: cal.1965-05-19.vietnam-air-war
    text: 'Check: the day; [[cal.1965-05-22.vietnam-air-war-2]] has the first strike north of the 20th parallel on May 22.'
- check:
    id: cal.1965-11-09.china-leadership-9
    text: 'Check: the day; [[cal.1965-11-12.china-leadership-11]] has the same comment on Nov. 12.'
- check:
    id: cal.1966-02-26.vietnam-air-war
    text: 'Check: the day; Staaveren 237 has Rolling Thunder 49 approved Feb. 25 ([[cal.1966-02-25.vietnam-air-war]]).'
- check:
    id: cal.1966-04-25.vietnam-congress-foreign-relations
    text: 'Check: the day; [[cal.1966-04-26.vietnam-congress-foreign-relations]] and [[cal.1966-04-27.vietnam-congress-foreign-relations]] give the same invitation on Apr. 26 and 27.'
- check:
    id: cal.1968-04-05.elections-1968
    text: 'Check: the day; [[cal.1968-04-07.elections-1968]] has the same request on Apr. 7.'
- check:
    id: cal.1968-06-14.elections-1968-3
    text: 'Check: the day; [[cal.1968-06-16.elections-1968-2]] has the same remark on June 16.'
- check:
    id: cal.1966-07-15.open-housing
    text: 'Check: the hours; [[cal.1966-07-16.open-housing-2]] has five hours with the gang leaders, this entry four.'
- follows:
    id: cal.1966-10-24.china-leadership-6
    add:
    - cal.1966-10-24.china-leadership-4
    basis: -4 is the reception (a morning range), -6 the luncheon at noon ([[w.zhou-enlai-waijiao-huodong]], Oct. 24, 1966)
