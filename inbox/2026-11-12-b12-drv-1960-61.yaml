      when: Mar. 1
      date: '1961-03-01'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 13-CT/TW on the struggle against counterrevolution and for public order in 1961, after directive no. 186 and the third plenum, which made the people''s democratic state, vigilance, order and defense one of the 1961 plan''s seven tasks.'
      n: '*Chỉ thị của Ban Bí thư số 13-CT/TW về tăng cường công tác đấu tranh chống phản cách mạng, giữ gìn trật tự an ninh*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 234–41. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-03-10.vietnam-hanoi
      when: Mar. 10
      date: '1961-03-10'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 14-CT/TW on the militia, self-defense forces and reserves in 1961, after the twelfth plenum and directive no. 119 of 1958: their organization, public order and local defense; recruitment; the wartime mobilization plan; training.'
      n: '*Chỉ thị của Ban Bí thư số 14-CT/TW về tăng cường chỉ đạo xây dựng dân quân tự vệ, lực lượng dự bị trong năm 1961*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 242–47. Made public: 2002.'
      tags:
      - polity:drv
