      id: cal.1961-03-31.vietnam-hanoi
      when: Mar. 31
      date: '1961-03-31'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 16-NQ/TW on the Party abroad: the many cadres, members and students sent to the fraternal countries and to countries with diplomatic or trade relations, most already in basic Party organizations, to be given a defined system of organization and leadership.'
      n: '*Nghị quyết của Ban Bí thư số 16-NQ/TW về tổ chức Đảng ở ngoài nước*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 276–81. Made public: 2002.'
