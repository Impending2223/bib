      date: '1961-02-18'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 12-CT/TW. The reform of private industry and trade by its higher form basically done; the joint state-private firms to be rearranged, their management reformed, their policies amended, the reformed capitalists, who work and obey in varying measure, further reformed.'
      n: '*Chỉ thị của Ban Bí thư số 12-CT/TW về việc củng cố và đẩy mạnh sản xuất, kinh doanh của các xí nghiệp công tư hợp doanh*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 196–204. Made public: 2002.'
      tags:
      - polity:drv
