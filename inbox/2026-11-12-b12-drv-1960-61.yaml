    entry:
      id: cal.1961-01-03.vietnam-hanoi
      when: Jan. 3
      date: '1961-01-03'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 08-CT/TW on mass cultural work: since directive no. 109 of Oct. 21, 1958, wider and closer to the Party''s thought; to be strengthened for the first five-year plan.'
      n: '*Chỉ thị của Ban Bí thư số 08-CT/TW về việc tăng cường công tác văn hoá trong quần chúng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 1–12. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-01-05.vietnam-hanoi
      when: Jan. 5–7
      date: '1961-01-05'
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: 'The Central Committee''s third plenum, Hanoi, on the Moscow meeting of the communist and workers'' parties of November 1960. Lê Duẩn''s report for the delegation, "Strengthen unity, advance to new victories!": the socialist system becoming decisive, the colonial system breaking up, war preventable. The resolution: the new declaration of the 81 parties, with that of 1957, the movement''s common program; in Indochina and Southeast Asia "peace will surely defeat war"; its documents to be studied in the Party.'
      n: '*Tăng cường đoàn kết nhất trí, tiến tới những thắng lợi mới!* (Báo cáo của đồng chí Lê Duẩn ...); *Nghị quyết của Hội nghị lần thứ ba của Trung ương Đảng Lao động Việt Nam ... về Hội nghị đại biểu các Đảng Cộng sản và Đảng Công nhân tháng 11 năm 1960 ở Mạc Tư Khoa*. [[w.van-kien-dang-toan]], XXII, 52–114 (the report, 52–103; the resolution, Jan. 5–7, 104–14). Made public: 2002. Names: Lê Duẩn.'
      tags:
      - name:le-duan
      - polity:ussr
      - polity:prc
      - polity:drv
- add:
    entry:
