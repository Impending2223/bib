      date: '1961-01-26'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 7-NQ/TW on patriotic emulation to fulfil and overfulfil the 1961 plan and the first five-year plan: a mass revolutionary movement; emulation bodies from the Center down; policies and rewards.'
      n: '*Nghị quyết của Ban Bí thư số 7-NQ/TW về việc đẩy mạnh phong trào thi đua yêu nước đảm bảo hoàn thành toàn diện và vượt mức kế hoạch nhà nước năm 1961 và kế hoạch 5 năm lần thứ nhất*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 170–79. Made public: 2002.'
      tags:
