      when: Mar. 15
      date: '1961-03-15'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 20-TT/TW on the Party''s front work: some committees slight it, thinking its field narrowed now that the socialist reform is basically done; to be strengthened.'
      n: '*Thông tri của Ban Bí thư số 20-TT/TW về việc tăng cường công tác mặt trận*, signed for the Secretariat by Nguyễn Khai, head of its office. [[w.van-kien-dang-toan]], XXII, 266–68. Made public: 2002.'
      tags:
      - polity:drv
