      n: '*Thông tri của Ban Bí thư số 23-TT/TW về việc phổ biến và chấp hành Điều lệ Đảng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 291–93. Made public: 2002.'
