      c: 'The Secretariat, Hanoi: circular no. 24-TT/TW. The district and commune people''s councils and administrative committees to be elected throughout the North in late May and June 1961: the councils'' composition and the Party''s direction of the vote.'
      n: '*Thông tri của Ban Bí thư số 24-TT/TW về việc lãnh đạo bầu cử Hội đồng nhân dân và Uỷ ban hành chính cấp huyện và xã*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 294–96. Made public: 2002.'
      tags:
      - polity:drv
