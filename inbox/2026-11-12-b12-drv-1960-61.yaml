      date: '1961-03-31'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 22-TT/TW explaining chapter I of the new Party statute: the conditions of membership, admission and probation.'
      n: '*Thông tri của Ban Bí thư số 22-TT/TW giải thích và quy định một số vấn đề trong chương I của Điều lệ Đảng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 282–90. Made public: 2002.'
