      when: Mar. 13
      date: '1961-03-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 16-CT/TW on the Party''s organization in the People''s Armed Police, set up by the Center and the government to guard the borders: its command under the Public Security Ministry''s Party group, its units'' Party committees under the local committees.'
      n: '*Chỉ thị của Ban Bí thư số 16-CT/TW quy định về hệ thống tổ chức và lãnh đạo của Đảng trong lực lượng công an vũ trang nhân dân*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 254–62. Made public: 2002.'
      tags:
      - polity:drv
