      when: Dec. 12
      date: '1960-12-12'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 13-TT/TW on the procuracy: with the transition to socialism and the Congress''s tasks the class relations will shift deeply; internal-affairs work, the procuracy''s among it, to be strengthened.'
      n: '*Thông tri của Ban Bí thư số 13-TT/TW về việc tăng cường lãnh đạo công tác kiểm sát*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 1049–52. Made public: 2002.'
      tags:
      - polity:drv
