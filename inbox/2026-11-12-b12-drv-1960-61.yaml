      date: '1961-02-08'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 11-NQ/TW on the management of socialist enterprises: "the director responsible for management under the leadership of the enterprise''s Party committee, the workers taking part in management," applied widely since the campaign of October 1958, now defined.'
      n: '*Nghị quyết của Bộ Chính trị số 11-NQ/TW về chế độ lãnh đạo quản lý xí nghiệp xã hội chủ nghĩa*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 184–95. Made public: 2002.'
      tags:
      - polity:drv
