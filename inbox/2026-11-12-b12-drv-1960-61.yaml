      when: Feb. 25
      date: '1961-02-25'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 12-NQ/TW, a rectification campaign in the spring of 1961: ideological work to be tied to life and production, for the Congress''s line of advancing "fast, strongly and surely" to socialism.'
      n: '*Nghị quyết của Bộ Chính trị số 12-NQ/TW về cuộc vận động chỉnh huấn mùa xuân 1961*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 205–14. Made public: 2002.'
      tags:
      - polity:drv
