    entry:
      id: cal.1961-03-18.vietnam-hanoi
      when: Mar. 18
      date: '1961-03-18'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 21-TT/TW. On the Central Front Board''s proposal, the second congress of the Vietnam Fatherland Front called for Apr. 25–29, 1961, to review its program and the North''s gains and the struggle for reunification.'
      n: '*Thông tri của Ban Bí thư số 21-TT/TW về việc triệu tập Đại hội đại biểu Mặt trận Tổ quốc Việt Nam lần thứ hai*, signed for the Secretariat by Nguyễn Khai, head of its office. [[w.van-kien-dang-toan]], XXII, 269–70. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-03-22.vietnam-hanoi
      when: Mar. 22
      date: '1961-03-22'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat, Hanoi, the afternoon: the organization and tasks of the Central Reunification Board passed: to study the situation in the South, propose the line for all the revolution''s work there, liaise with COSVN and see its offices carry out the Center''s orders, train cadres, supply means to the South, help direct the military work; departments of research, cadres and the reunification struggle.'
      n: 'Resolution no. 20-NQ/TW, June 1, 1961, *Nghị quyết của Ban Bí thư số 20-NQ/TW về nhiệm vụ và tổ chức của Ban Thống nhất*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 332–36. Made public: 2002.'
      tags:
      - polity:drv
