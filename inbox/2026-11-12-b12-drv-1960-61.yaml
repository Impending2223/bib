    entry:
      id: cal.1960-12-30.vietnam-hanoi
      when: Dec. 30–Jan. 5
      date: '1960-12-30'
      thread: vietnam-hanoi
      c: 'The Central Committee''s third plenum, Hanoi, on the state plan for 1961, the first of the five-year plan, after the three-year plan fulfilled: grain first, to feed the people and add reserves; livestock; industrial crops for the factories and exports; fish; the state farms. Industry, transport, trade, policy, management, cadres.'
      n: '*Nghị quyết của Hội nghị Trung ương lần thứ ba ... về kế hoạch nhà nước 1961*. [[w.van-kien-dang-toan]], XXII, 13–51 (the resolution, of the sessions of Dec. 30, 1960–Jan. 5, 1961). Made public: 2002. Check: the plenum''s communiqué (XXII, 118) has it meet Dec. 28, 1960–Jan. 6, 1961; its resolutions, Dec. 30–Jan. 5 (13) and Jan. 5–7 (104).'
      tags:
      - polity:drv
