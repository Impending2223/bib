      date: '1961-01-16'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 17-TT/TW. Handicraft cooperativization basically complete: members'' congresses to be held and a system of handicraft cooperative unions set up.'
      n: '*Thông tri của Ban Bí thư Trung ương số 17-TT/TW về việc mở Đại hội xã viên và thành lập hệ thống liên hiệp hợp tác xã thủ công nghiệp*, signed for the Secretariat by Nguyễn Khai, head of its office. [[w.van-kien-dang-toan]], XXII, 138–39. Made public: 2002.'
      tags:
      - polity:drv
