    entry:
      id: cal.1960-06-27.vietnam-hanoi-2
      when: June 27–30
      date: '1960-06-27'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi, sessions of June 27, 28 and 30, on the five-year plan study board''s report on the direction, tasks and control figures of the first five-year plan, 1961–65: the report sound at bottom. Two books: the state plan''s targets, to be met in four years or four and a half, the growth of industry and agriculture set a little lower than the board''s; and higher targets for the branches to strive for. Capital construction 5,100 million dong in the first book. The 1961 plan to be drafted at once.'
      n: 'Resolution no. 119-NQ/TW, July 4, 1960, *Nghị quyết của Bộ Chính trị số 119-NQ/TW về bản báo cáo "Phương hướng, nhiệm vụ và các con số kiểm tra chủ yếu làm căn cứ cho việc lập dự án kế hoạch 5 năm lần thứ nhất phát triển kinh tế quốc dân (1961–1965)"*. [[w.van-kien-dang-toan]], XXI, 395–97. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-06-30.vietnam-hanoi
      when: June 30
      date: '1960-06-30'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 215-CT/TW. The fifth-month harvest poor, minds unsettled; by June 20 rice bought and debts collected at 25 percent of the target, rice sold well over the plan. Central cadres to be sent to help the local committees explain the grain policy and propose changes.'
      n: '*Chỉ thị của Ban Bí thư số 215-CT/TW về việc tăng cường lực lượng lãnh đạo của Đảng nhằm giải quyết tốt vấn đề lương thực*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 392–94. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-07.vietnam-hanoi-2
      when: July, late
      date: 1960-07
      thread: vietnam-hanoi
      c: 'The Central Committee''s eighteenth plenum, Hanoi. Lê Duẩn reports on the meeting of the communist and workers'' parties of the socialist countries at Bucharest, June 24; the plenum endorses its communiqué: socialist unity, with the Soviet Union at its head, to be guarded "like the apple of the eye." The reports of the Party''s congresses at every level and their views on the drafts heard; the political report, the report on the statute and the revised draft statute adopted; the Third Congress to open Sept. 5.'
      n: '[[w.van-kien-dang-toan]], XXI, 439–41, 442 (the plenum''s two communiqués of Aug. 15, 1960). Names: Lê Duẩn. Check: the day.'
      tags:
      - name:le-duan
      - polity:ussr
      - polity:drv
- add:
    entry:
      id: cal.1960-07-09.vietnam-hanoi
      when: July 9
      date: '1960-07-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 217-CT/TW on the Buddhists. A unified Buddhist Association set up with the Party''s help; some cadres have erred against the policy. Some 4,000 monks and nuns in the North; Buddhism strong in the South and abroad, in Southeast Asia above all: good work with it helps with the Catholics, the South''s Buddhists and Buddhist opinion abroad.'
      n: '*Chỉ thị của Ban Bí thư số 217-CT/TW về công tác đối với Phật giáo*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 398–401. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-07-20.vietnam-hanoi
      when: July 20
      date: '1960-07-20'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 338-TT/TW. The 1960 wage reform marred in places by added allowances and wrong grading, the ideological work slighted; the new pay to be paid from early August, and savings deposits urged when the new and back pay are drawn.'
      n: '*Thông tri của Ban Bí thư số 338-TT/TW về việc tăng cường lãnh đạo hơn nữa đối với công tác tiền lương và việc vận động gửi tiền tiết kiệm trong dịp lĩnh lương mới*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 402–05. See [[cal.1960-05-20.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-07-28.vietnam-hanoi
      when: July 28
      date: '1960-07-28'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 339-TT/TW, explaining and adding to the farm cooperatives'' policies: pay and work points for cooperative cadres; public land, ponds and riverbanks, the land of those who went South; the price of buffaloes and oxen taken into common ownership, too low in places; members of the old regime''s administration and army with "great crimes," and their families.'
      n: '*Thông tri của Ban Bí thư số 339-TT/TW giải thích và bổ sung thêm một số điểm về chính sách cụ thể xây dựng hợp tác xã nông nghiệp*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 406–20. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-08-12.vietnam-hanoi
      when: Aug. 12
      date: '1960-08-12'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 219-CT/TW on the grain shortage between harvests: more people hungry, those with surplus unwilling to sell to the state or selling to the hungry at high prices. More production, thrift, purchases and debt collection, mutual aid, rationed distribution; vigilance against enemy sabotage.'
      n: '*Chỉ thị của Ban Bí thư số 219-CT/TW về những biện pháp cấp bách để giải quyết khó khăn về lương thực hiện nay*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 425–30. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-08-15.vietnam-hanoi
      when: Aug. 15
      date: '1960-08-15'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 220-CT/TW, pressing directive no. 186 against counterrevolutionaries: its execution reviewed; mass campaigns of repression where the enemy is active, as a central task for a time; the old puppets, bandits and reactionary parties reformed; the police''s investigation stepped up; the commune cell the level that acts.'
      n: '*Chỉ thị của Ban Bí thư số 220-CT/TW về việc tích cực thi hành Chỉ thị số 186 đẩy mạnh cuộc đấu tranh chống bọn phản cách mạng*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 431–38. See [[cal.1960-02-17.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-08-15.vietnam-hanoi-2
      when: Aug. 15
      date: '1960-08-15'
      thread: vietnam-hanoi
      c: 'The Central Committee''s two communiqués on its eighteenth plenum: on the Bucharest meeting, the world''s balance "tilting more each day" to peace and socialism, but the Americans renewing the cold war; and the Third Congress called for Sept. 5.'
      n: '*Thông cáo của Hội nghị lần thứ 18 Ban Chấp hành Trung ương Đảng Lao động Việt Nam về Hội nghị Bucarét*; *... về việc triệu tập Đại hội Đảng*. [[w.van-kien-dang-toan]], XXI, 439–41, 442.'
      tags:
      - polity:us
      - polity:drv
- add:
    entry:
      id: cal.1960-08-16.vietnam-hanoi
      when: Aug. 16
      date: '1960-08-16'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 122-NQ/TW, on the Interior Ministry''s Party group''s report to its session of July 23. Workers and employees kept on from the old regime, paid their old wages for six years, to come under the common system of wages, social insurance and welfare.'
      n: '*Nghị quyết của Bộ Chính trị số 122-NQ/TW về việc thống nhất chế độ tiền lương của công nhân, viên chức lưu dung vào chế độ tiền lương, bảo hiểm xã hội và phúc lợi chung*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 443–45. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-08-18.vietnam-hanoi
      when: Aug. 18
      date: '1960-08-18'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 221-CT/TW, the autumn drive, the last to basically complete lower-level farm cooperatives by the fourteenth and sixteenth plenums and the three-year plan: 15 to 20 percent more households in, the cooperatives already over half the working peasants'' households; new ones of 30 to 50 households; rich peasants and landlords not yet admitted. "Let the tenth-month crop make up for the fifth-month."'
      n: '*Chỉ thị của Ban Bí thư số 221-CT/TW về việc căn bản hoàn thành hợp tác hóa nông nghiệp và đẩy mạnh sản xuất nông nghiệp trong mùa thu*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 446–59. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-08-30.vietnam-hanoi
      when: Aug. 30
      date: '1960-08-30'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 124-NQ/TW, of its April session, on the socialist reform of the handicrafts: 500,000 craftsmen, output 595.8 million dong in 1959, 45.4 percent of industry and handicrafts together. Production teams and supply cooperatives to become middle-level producers'' cooperatives, then higher; technique improved; the crafts an auxiliary of industry through the first five-year plan.'
      n: '*Nghị quyết của Bộ Chính trị số 124-NQ/TW (họp tháng 4-1960) về vấn đề đẩy mạnh việc cải tạo và phát triển thủ công nghiệp theo chủ nghĩa xã hội*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 460–74. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-09-05.vietnam-hanoi
      when: Sept. 5
      date: '1960-09-05'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 222-CT/TW, the day the Third Congress opens: from mid-September through October a wide campaign to make its resolutions known, talks by hamlet, factory, office and school, emulation in production after; the building of socialism in the North at its center.'
      n: '*Chỉ thị của Ban Bí thư số 222-CT/TW về việc tiến hành một đợt tuyên truyền cổ động rộng rãi để giới thiệu những Nghị quyết của Đại hội Đảng lần thứ III*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 475–80. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-09-27.vietnam-hanoi
      when: Sept. 27
      date: '1960-09-27'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi, the afternoon, Phạm Hùng, Tố Hữu and Lê Văn Lương present: a Party History Research Board, Trường Chinh at its head; the paper *Thời mới* kept, under the Central Front Board, its bad elements watched and eased out; *Cứu quốc* to go on weekly; a directive to define the Vietnam News Agency''s role. On the Propaganda and Education Board''s proposal, the Sự thật publishing house to pass from the Party to the state, under the Prime Minister''s Office, the Board directing its politics.'
      n: '*Thông báo số 02-TB/TH về Hội nghị Ban Bí thư*, Oct. 11, 1960; *Nghị quyết của Ban Bí thư số 02-NQ/TW về Nhà xuất bản Sự thật*, Oct. 17, 1960. [[w.van-kien-dang-toan]], XXI, 960–63, 983–84 (Sự thật). Made public: 2002. Names: Trường Chinh, Phạm Hùng, Tố Hữu, Lê Văn Lương.'
      tags:
      - name:truong-chinh
      - polity:drv
- add:
    entry:
      id: cal.1960-10-06.vietnam-hanoi
      when: Oct. 6
      date: '1960-10-06'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 01-CT/TW, after directive no. 222: conferences at every level and in every branch to study the Third Congress''s resolutions, points of earlier disagreement to be discussed through; congresses that did not elect committees to meet again; the zone, city and province congresses about late November or early December.'
      n: '*Chỉ thị của Ban Bí thư số 01-CT/TW về việc tiến hành hội nghị ở các cấp, các ngành để thảo luận các nghị quyết của Đại hội đại biểu toàn quốc lần thứ III*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 953–56. See [[cal.1960-09-05.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-10-12.vietnam-hanoi
      when: Oct. 12
      date: '1960-10-12'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 02-CT/TW on the Vietnam News Agency, "a weapon" of the Party: news and photographs to guide opinion, answer the enemy and present the people''s achievements and the government''s peaceful diplomacy abroad; more staff and equipment, correspondents in every zone and province and, step by step, abroad.'
      n: '*Chỉ thị của Ban Bí thư số 02-CT/TW về tăng cường công tác thông tấn xã*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 964–67. See [[cal.1960-09-27.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-10-13.vietnam-hanoi
      when: Oct. 13
      date: '1960-10-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 05-TT/TW on the mountain campaign of cooperatives and the democratic reform, some provinces done: firmer leadership; the rules on landlords'' crops, surplus grain, houses and guns, illegal sales of land and cattle, landlords'' children sent to schools by mistake, confiscation and requisition, the reclassification of landlords, land among the working peasants.'
      n: '*Thông tri của Ban Bí thư số 05-TT/TW về việc tăng cường lãnh đạo cuộc vận động hợp tác hóa nông nghiệp kết hợp hoàn thành cải cách dân chủ ở miền núi; bổ sung và giải thích một số điểm về chính sách cụ thể*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 968–82. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-10-18.vietnam-hanoi
      when: Oct. 18
      date: '1960-10-18'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 03-CT/TW on dividing the 1960 harvest in the farm cooperatives: the state''s share, to be settled at a conference the Secretariat will call; the cooperatives'' funds for accumulation; the members'' shares, rent for land, cattle and tools; the year''s accounts closed quickly.'
      n: '*Chỉ thị của Ban Bí thư số 03-CT/TW về lãnh đạo tốt việc phân chia hoa lợi năm 1960 trong các hợp tác xã sản xuất nông nghiệp*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 985–94. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11-03.vietnam-hanoi
      when: Nov. 3
      date: '1960-11-03'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 04-CT/TW on the grain question: political education of cadres, members and every class; policy in rice purchase, the tax and debt collection; the Party''s grain work carried out in full.'
      n: '*Chỉ thị của Ban Bí thư số 04-CT/TW ra sức phấn đấu để giải quyết thắng lợi vấn đề lương thực*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 995–1000. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11-07.vietnam-hanoi
      when: Nov. 7
      date: '1960-11-07'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 09-TT/TW, with an outline: the mountain campaign of cooperatives and democratic reform, nearly done by early 1961, to be summed up province by province, each draft report passed by the standing committee before the conference.'
      n: '*Thông tri của Ban Bí thư số 09-TT/TW về việc tổng kết cuộc vận động hợp tác hóa nông nghiệp kết hợp hoàn thành cải cách dân chủ ở miền núi*, and *Đề cương hướng dẫn nội dung tổng kết ...*. [[w.van-kien-dang-toan]], XXI, 1001–08. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11-10.vietnam-hanoi
      when: Nov. 10
      date: '1960-11-10'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 10-TT/TW on the Law on Marriage and the Family: wife-beating, concubinage, forced and child marriage fewer, but violations many, in the Catholic areas the ban on divorce and on marriage with non-Catholics; a deep campaign in the Party and among the people early in 1961.'
      n: '*Thông tri của Ban Bí thư số 10-TT/TW về việc tuyên truyền thực hiện Luật Hôn nhân và gia đình, chuẩn bị đợt tuyên truyền vận động sâu rộng vào đầu năm 1961*, signed for the Secretariat by Nguyễn Khai, head of its office. [[w.van-kien-dang-toan]], XXI, 1009–11. See [[cal.1960-03-07.vietnam-hanoi-3]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11-11.vietnam-hanoi
      when: Nov. 11
      date: '1960-11-11'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo to the Nam Bộ and Interzone V Executive Committees, cable no. 17-NB, the night of the coup in Saigon, by the enemy''s news and the Saigon, British, American and French radios: paratroops under Col. Nguyễn Chánh Thi round the palace; at 8 p.m. Diệm not yet treating. The plotters pro-American, somewhat pro-French, anticommunist, but their fight "to our advantage." A great mass political struggle to overthrow the Diệm clique, for a broad national democratic coalition government; a program for a front for the liberation of the South; political with armed struggle; liberated places under the front''s name, not the Party''s flag or the North''s.'
      n: '*Điện của Bộ Chính trị số 17-NB gửi Xứ uỷ Nam Bộ và Liên khu uỷ V*. [[w.van-kien-dang-toan]], XXI, 1012–16. Made public: 2002. Names: Ngô Đình Diệm, Nguyễn Chánh Thi.'
      tags:
      - polity:rvn
      - polity:us
      - polity:fr
      - name:ngo-dinh-diem
      - name:nguyen-chanh-thi
      - polity:drv
- add:
    entry:
      id: cal.1960-11-12.vietnam-hanoi
      when: Nov. 12
      date: '1960-11-12'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo to the Nam Bộ and Interzone V Executive Committees, cable no. 20-NB, 4 p.m.: Diệm has brought troops from the provinces, retaken the radio and, it seems, relieved the palace; the coup probably broken. It agrees with the Nam Bộ committee''s cable. The plotters not to be put level with Diệm; a front sought with those who go on against him. The Liberation Front to come out at once, "without waiting for its personnel," with a short appeal and eleven slogans: overthrow Diệm, a coalition government, freedoms, Law 10/59 repealed, the agrovilles disbanded, neutrality, reunification.'
      n: '*Điện của Bộ Chính trị số 20-NB gửi Xứ uỷ Nam Bộ và Liên khu uỷ V*. [[w.van-kien-dang-toan]], XXI, 1017–22. See [[cal.1960-11-11.vietnam-hanoi]]. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - polity:rvn
      - polity:us
      - name:ngo-dinh-diem
      - polity:drv
- add:
    entry:
      id: cal.1960-11-16.vietnam-hanoi
      when: Nov. 16
      date: '1960-11-16'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat to the Nam Bộ Executive Committee, cable no. 34/NB, answering its no. 40/NB: the Liberation Front to come out by a manifesto of the main slogans, the nine of the last cable and two more, equal rights and autonomy for the minorities, against war; signed by the Front, not by its campaign committee or its representatives "Dr. Cung and Huỳnh Tấn Phát." Fronts then formed locally by the program; later a congress and a central committee; Cao Đài, Hòa Hảo and Catholic figures among them.'
      n: '*Điện của Ban Bí thư số 34/NB gửi Xứ uỷ Nam Bộ*. [[w.van-kien-dang-toan]], XXI, 1023–24. See [[cal.1960-11-12.vietnam-hanoi]]. Made public: 2002. Names: Huỳnh Tấn Phát, Cung.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11-20.vietnam-hanoi
      when: Nov. 20
      date: '1960-11-20'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat to the Nam Bộ and Interzone V Executive Committees, cable no. 35/NB: a wide propaganda campaign in the South after the failed coup, Diệm''s weakness and "reshuffle" exposed; the plotters'' soldiers, mostly patriotic, not to be put level with Diệm. The Politburo''s word of Nov. 12 on coalition governments in liberated communes and districts was for the coup''s first days: now the two-faced government still.'
      n: '*Điện của Ban Bí thư số 35/NB gửi Xứ uỷ Nam Bộ và Liên khu uỷ V*. [[w.van-kien-dang-toan]], XXI, 1025–28. See [[cal.1960-11-12.vietnam-hanoi]]. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - name:ngo-dinh-diem
      - polity:drv
- add:
    entry:
      id: cal.1960-11-24.vietnam-hanoi
      when: Nov. 24
      date: '1960-11-24'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat to the Nam Bộ Executive Committee, cable no. 40/NB: the manifesto of the National Front for the Liberation of South Vietnam, passed by the Politburo, sent; its wording to be fitted to the South, its substance argued by cable; Interzone V to get the same text. Its release to be planned in the Party and among the people.'
      n: '*Điện của Ban Bí thư số 40/NB gửi Xứ uỷ Nam Bộ*. [[w.van-kien-dang-toan]], XXI, 1029. See [[cal.1960-11-16.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11-29.vietnam-hanoi
      when: Nov. 29
      date: '1960-11-29'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 06-CT/TW. A wide anti-"U.S.-Diệm" propaganda campaign in the North after the coup in Saigon: its failure, the regime''s decay; the North ready to back every struggle in the South and to build itself as a firm base for reunification; material for books of propaganda abroad.'
      n: '*Chỉ thị của Ban Bí thư số 06-CT/TW về việc mở một đợt tuyên truyền rộng rãi chống Mỹ - Diệm nhân cuộc đảo chính xảy ra ở Sài Gòn*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 1030–34. See [[cal.1960-11-20.vietnam-hanoi]]. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - polity:us
      - polity:rvn
      - name:ngo-dinh-diem
      - polity:drv
- add:
    entry:
