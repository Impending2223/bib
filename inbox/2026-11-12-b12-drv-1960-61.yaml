patch: 2026-11-12-b12-drv-1960-61
by: 'Claude (batch 12, the DRV''s records: Văn kiện Đảng toàn tập, vols. 21 (1960) and 22 (1961)), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1960-01-13.vietnam-hanoi
      when: Jan. 13
      date: '1960-01-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 181-CT/TW on physical training and sport. Since directive no. 106 of Oct. 2, 1958, the movement wider and faster, chiefly among students and in the army; many Party committees still leave it to one member. Sport and hygiene to raise health and serve production and defense.'
      n: '*Chỉ thị của Ban Bí thư số 181-CT/TW về công tác thể dục thể thao*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 34–38. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-01-19.vietnam-hanoi
      when: Jan. 19
      date: '1960-01-19'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 305-TT/TW on the rural campaigns. The state plan in the countryside lags: winter-spring planting short of its area, the cooperatives weakly consolidated. Each Party committee to review its own direction and fix concrete measures commune by commune.'
      n: '*Thông tri của Ban Bí thư số 305-TT/TW về việc tăng cường lãnh đạo, quyết tâm hoàn thành tốt công tác trung tâm ở nông thôn hiện nay*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 39–42. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-01-20.vietnam-hanoi
      when: Jan. 20
      date: '1960-01-20'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 100-NQ/TW. Some senior non-party intellectuals in the government have applied to join the Party in the "6-1" recruitment. A good sign, but better not to admit them now: they work and struggle to more effect as non-members. Their cells to tell them so, keep them informed of the Party''s resolutions and invite them to the Party groups'' meetings.'
      n: '*Nghị quyết của Bộ Chính trị số 100-NQ/TW về việc một số nhân sĩ trí thức cao cấp trong Chính phủ xin gia nhập Đảng ta*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 43–44. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-01-21.vietnam-hanoi
      when: Jan. 21
      date: '1960-01-21'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 309-TT/TW. In the communes the women''s cadre boards of the peasant associations give way to executive committees of the Women''s Union, a front organization of all classes of women; done before Mar. 8.'
      n: '*Thông tri của Ban Bí thư số 309-TT/TW về việc chấn chỉnh bộ máy tổ chức của phụ nữ ở các xã*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 49–51. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-01-21.vietnam-hanoi-2
      when: Jan. 21
      date: '1960-01-21'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 307-TT/TW. The resolutions of the Central Committee''s fourteenth, fifteenth and sixteenth plenums to be studied by the cadres, Party members and workers of the state enterprises and farms and the joint state-private firms, revolutionary morality among the subjects; done in the first quarter of 1960.'
      n: '*Thông tri của Ban Bí thư số 307-TT/TW về việc tổ chức học tập Nghị quyết Hội nghị Trung ương lần thứ 14, 15, 16 ...*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 45–48. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-01-23.vietnam-hanoi
      when: Jan. 23
      date: '1960-01-23'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 310-TT/TW, on the farm cooperatives'' policy after the sixteenth plenum and the new statute of the lower-level cooperatives. Members pressed to join and to bring in their means of production, their own and the cooperatives'' long-run interests slighted; the rules on land, draft animals, tools and the division of the harvest restated.'
      n: '*Thông tri của Ban Bí thư số 310-TT/TW bổ sung một số điểm cụ thể về chính sách hợp tác hóa nông nghiệp*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 52–62. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-05.vietnam-hanoi
      when: Feb. 5
      date: '1960-02-05'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 183-CT/TW on statistical surveys. After five years of planning the leadership still knows the economy incompletely, late and inexactly; the surveys to be strengthened, the branches and Party committees to take part.'
      n: '*Chỉ thị của Ban Bí thư số 183-CT/TW về việc tăng cường công tác điều tra thống kê*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 63–66. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-06.vietnam-hanoi
      when: Feb. 6
      date: '1960-02-06'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 184-CT/TW. Economic contracts, binding as state discipline, between the state enterprises and the state agencies, for production, supply, sale, transport and building: a tool of planning and of economic accounting.'
      n: '*Chỉ thị của Ban Bí thư số 184-CT/TW về việc áp dụng chế độ hợp đồng kinh tế giữa các xí nghiệp quốc doanh và các cơ quan Nhà nước*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 67–69. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-09.vietnam-hanoi
      when: Feb. 9
      date: '1960-02-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 185-CT/TW on the National Assembly elections, set by the Assembly''s eleventh session for the first half of 1960. The new Assembly to hold the Party''s best cadres and the most trusted of every class, as the united front requires; in the South the election to raise faith in the North''s regime.'
      n: '*Chỉ thị của Ban Bí thư số 185-CT/TW về việc lãnh đạo bầu cử đại biểu Quốc hội*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 70–73. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-09.vietnam-hanoi-2
      when: Feb. 9
      date: '1960-02-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 314-TT/TW, after its conference of Nov. 23–Dec. 2, 1959, on directive no. 156 of August 1959: cooperatives in the mountains with the democratic reform completed. Trials in 35 communes, the campaign widened to 286; the circular explains and adds to the directive on the classes, the land and the treatment of landlords in the highlands.'
      n: '*Thông tri của Ban Bí thư số 314-TT/TW bổ sung một số điểm về hoàn thành cải cách dân chủ trong cuộc vận động hợp tác hóa nông nghiệp kết hợp hoàn thành cải cách dân chủ ở miền núi ...*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 74–105. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-17.vietnam-hanoi
      when: Feb. 17
      date: '1960-02-17'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 186-CT/TW on the struggle against counterrevolutionaries in the North, "the outpost of the socialist camp in Southeast Asia." The most dangerous, the "U.S.-Diệm" spies, their best agents the reactionaries among the Catholics and the old puppet officials; Chiang''s agents in the mountains. Five tasks: know the enemy, raise vigilance, guard the Party within, reform the old puppets and reactionaries, punish sabotage at once. The capital, the borders, the coast and the demarcation line at Vĩnh Linh to be guarded first.'
      n: '*Chỉ thị của Ban Bí thư số 186-CT/TW về mấy công tác lớn phải làm để đẩy mạnh công tác đấu tranh chống bọn phản cách mạng, nhằm bảo vệ công cuộc cải tạo xã hội chủ nghĩa và xây dựng chủ nghĩa xã hội ở miền Bắc*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 106–30. Made public: 2002. Names: Ngô Đình Diệm, Chiang Kai-shek.'
      tags:
      - name:ngo-dinh-diem
      - name:chiang-kai-shek
      - polity:drv
- add:
    entry:
      id: cal.1960-02-19.vietnam-hanoi
      when: Feb. 19
      date: '1960-02-19'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 103-NQ/TW on the debts of private firms entering joint state-private ownership: in Haiphong''s second round 140,000 dong of debt on 551,000 declared; in Hanoi, 215 firms owing over 200,000. Debts to the workers and taxes first; the rules for each kind.'
      n: '*Nghị quyết của Ban Bí thư số 103-NQ/TW về vấn đề thanh toán các khoản nợ của các xí nghiệp tư doanh khi thực hiện công tư hợp doanh*. [[w.van-kien-dang-toan]], XXI, 131–35. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-20.vietnam-hanoi
      when: Feb. 20
      date: '1960-02-20'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 187-CT/TW on the Party committees and the police. The struggle against counterrevolution a part of the class struggle, the police "a sharp weapon" of Party and state; each committee to lead the police collectively and hear their report on the enemy every six months.'
      n: '*Chỉ thị của Ban Bí thư số 187-CT/TW tăng cường sự lãnh đạo của các cấp uỷ Đảng đối với công tác công an và cơ quan công an*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 136–39. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-24.vietnam-hanoi
      when: Feb. 24
      date: '1960-02-24'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 104-NQ/TW, adding to resolution no. 05 of March 1956: the rural work boards at each level strengthened and reorganized, to help the Party committees lead the countryside into socialism, by the sixteenth plenum''s resolution.'
      n: '*Nghị quyết của Ban Bí thư số 104-NQ/TW kiện toàn Ban Công tác nông thôn các cấp*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 140–44. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-25.vietnam-hanoi
      when: Feb. 25
      date: '1960-02-25'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 105-NQ/TW. A Social Research Department set up under the Central Committee for "a special task," Trần Quốc Hoàn of the Central Committee in charge: its budget a separate one among the secret funds of the Ministry of Finance''s Party group, accounted to the Center by Hoàn and one member of that group; its cadres'' files kept apart, for secrecy.'
      n: '*Nghị quyết của Ban Bí thư số 105-NQ/TW về việc thành lập Vụ Nghiên cứu Xã hội*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 145–46. Made public: 2002. Names: Trần Quốc Hoàn.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-26.vietnam-hanoi
      when: Feb. 26
      date: '1960-02-26'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 111-NQ/TW. Gold, silver, diamonds, jade and precious stones that capitalists bring into joint state-private firms, personal jewelry apart, are capital: deposited with the Bank, valued at its buying price; hidden capital to pay their debts to the state and the workers first.'
      n: '*Nghị quyết của Ban Bí thư số 111-NQ/TW về việc giải quyết vấn đề vàng bạc đối với tư sản trong công tư hợp doanh*. [[w.van-kien-dang-toan]], XXI, 147–49. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-26.vietnam-hanoi-2
      when: Feb. 26
      date: '1960-02-26'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 189-CT/TW. The Center''s draft directive on the first five-year plan, 1961–65, to be built from the top down and the bottom up: the cities, zones and provinces to discuss its tasks and control figures and send their views.'
      n: '*Chỉ thị của Ban Bí thư số 189-CT/TW về việc các thành phố, khu, tỉnh, tham gia xây dựng Dự thảo chỉ thị về kế hoạch 5 năm lần thứ nhất (1961–1965)*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 150–53. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-29.vietnam-hanoi
      when: Feb. 29
      date: '1960-02-29'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 190-CT/TW. Handicraft cooperatives: by the end of 1959, 208,229 craftsmen organized, 70 percent of the full-time trades under Internal Trade, 3,054 cooperatives of nearly 100,000 members; cooperativization of the crafts can be basically completed in 1960. Handicraft cooperative campaign boards to be set up at each level.'
      n: '*Chỉ thị của Ban Bí thư số 190-CT/TW về việc thành lập Ban Vận động hợp tác xã thủ công nghiệp các cấp*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 154–57. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-03.vietnam-hanoi
      when: Mar. 3
      date: '1960-03-03'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 191-CT/TW on local industry. Since the fourteenth plenum more than 500 provincial and zonal plants, output 13 percent of the central state industry''s, nearly 5,000 workers; some cadres build without the people''s labor and local means. Local industry to serve agriculture first.'
      n: '*Chỉ thị của Ban Bí thư số 191-CT/TW về việc xây dựng và phát triển công nghiệp địa phương*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 158–71. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-07.vietnam-hanoi
      when: Mar. 7
      date: '1960-03-07'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 192-CT/TW, not to be published, to the zone, city and province committees only. Party members, state employees, notables and intellectuals who own capital, shares or rented houses and offer to "donate" them in the reform of private business: as a rule to be reformed like other capitalists; a donation allowed only in particular cases, by the Center.'
      n: '*Chỉ thị của Ban Bí thư số 192-CT/TW về chính sách đối với đảng viên, cán bộ, nhân viên Nhà nước và nhân sĩ, trí thức, tư sản xin "hiến" tài sản trong cuộc vận động cải tạo công thương nghiệp tư bản tư doanh*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 172–74. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-07.vietnam-hanoi-2
      when: Mar. 7
      date: '1960-03-07'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 317-TT/TW. The reform of private industry and trade in 1959 basically met the Center''s aims; the small and middle capitalists still to be reformed, the reformed firms not yet consolidated. The movement to be widened in 1960, Hanoi, Haiphong and Nam Định first.'
      n: '*Thông tri của Ban Bí thư số 317-TT/TW về việc tăng cường lãnh đạo, tiếp tục mở rộng phong trào cải tạo công thương nghiệp tư bản tư doanh*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 175–77. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-07.vietnam-hanoi-3
      when: Mar. 7
      date: '1960-03-07'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 318-TT/TW on the Law on Marriage and the Family passed by the National Assembly''s eleventh session: its enforcement touches old customs, nationality, religion and class; a long campaign of propaganda and education to carry it.'
      n: '*Thông tri của Ban Bí thư số 318-TT/TW về công tác tuyên truyền vận động quán triệt Luật Hôn nhân và gia đình*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 178–80. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-08.vietnam-hanoi
      when: Mar. 8
      date: '1960-03-08'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 319-TT/TW on the National Assembly elections, after directive no. 185: the candidates the Party''s best and the most trusted, their composition to reflect the front and the class line; landlords and their children by the Prime Minister''s circular on the electoral law; regroupees from the South and returned overseas Vietnamese to vote whatever their residence.'
      n: '*Thông tri của Ban Bí thư số 319-TT/TW về việc đẩy mạnh hơn nữa công tác chuẩn bị bầu cử đại biểu Quốc hội*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 181–83. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-08.vietnam-hanoi-2
      when: Mar. 8
      date: '1960-03-08'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 320-TT/TW on probationary members, now more than 50,000: 53 percent of the members in the Northwest, 45 in Lào Cai, 23 in Hưng Yên, 20 in Hanoi. Their training, classes, and admission to full membership.'
      n: '*Thông tri của Ban Bí thư số 320-TT/TW về tăng cường công tác đối với đảng viên dự bị*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 184–89. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-11.vietnam-hanoi
      when: Mar. 11
      date: '1960-03-11'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 321-TT/TW. Three months after the Center''s conference on consolidating the farm cooperatives, the results poor, some communes not yet told; consolidation to go on until the spring-summer drive, after the census; in the mountains, new cooperatives to stop.'
      n: '*Thông tri của Ban Bí thư số 321-TT/TW về việc tiếp tục đẩy công tác củng cố hợp tác xã lên một bước nữa*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 190–92. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-15.vietnam-hanoi
      when: Mar. 15
      date: '1960-03-15'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 195-CT/TW on the handicraft cooperatives in 1960: over 200,000 in cooperative bodies, 3,054 cooperatives of 85,000 members; the towns of Bắc Ninh, Hưng Yên, Sơn Tây and Vinh basically cooperativized. The work to be basically finished this year.'
      n: '*Chỉ thị của Ban Bí thư số 195-CT/TW về việc đẩy mạnh phong trào hợp tác hóa và phát triển sản xuất thủ công nghiệp năm 1960*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 198–200. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-17.vietnam-hanoi
      when: Mar. 17
      date: '1960-03-17'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 196-CT/TW. A new policy for buying and selling grain to be studied: an outline to the Secretariat by the end of March, surveys with the province committees, trials in the fifth-month crop of 1960.'
      n: '*Chỉ thị của Ban Bí thư số 196-CT/TW về việc tổ chức nghiên cứu chính sách mua bán lương thực thích hợp với tình hình mới*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 201–04. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-17.vietnam-hanoi-2
      when: Mar. 17
      date: '1960-03-17'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 198-CT/TW on the Party congresses at every level, by the seventeenth plenum''s resolution: from March the basic organizations to discuss the drafts for the national congress and elect delegates; the committees preparing the political report and the revised statute to guide the discussion.'
      n: '*Chỉ thị của Ban Bí thư số 198-CT/TW về việc tiến hành Đại hội các cấp*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 205–13. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-19.vietnam-hanoi
      when: Mar. 19
      date: '1960-03-19'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 107-NQ/TW. The central handicraft cooperative campaign board, fourteen members, under directive no. 190, Nguyễn Văn Thao, head of the handicraft department, first among them.'
      n: '*Nghị quyết của Ban Bí thư số 107-NQ/TW về việc thành lập Ban Vận động hợp tác xã thủ công nghiệp Trung ương*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 214–15. Made public: 2002. Names: Nguyễn Văn Thao.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-19.vietnam-hanoi-2
      when: Mar. 19
      date: '1960-03-19'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 197-CT/TW on children and the Young Pioneers, nearly half a million in the Pioneers: some children still overworked; communist morality, schooling, health and play; the work to be under the Party, with one body in charge of it.'
      n: '*Chỉ thị của Ban Bí thư số 197-CT/TW về công tác thiếu niên, nhi đồng*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 216–25. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-24.vietnam-hanoi
      when: Mar. 24
      date: '1960-03-24'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 199-CT/TW. The world moving toward détente, but the United States strengthening SEATO, signing the security treaty with Japan, making the South a colony and base and intervening in Laos. Economy and defense to be joined in the first five-year plan, its planners and the General Military Party Committee together; a draft plan of mobilization for the first year of a war to be studied.'
      n: '*Chỉ thị của Ban Bí thư số 199-CT/TW về việc lập dự án kế hoạch động viên và kết hợp giữa kinh tế và quốc phòng*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 226–29. Made public: 2002.'
      tags:
      - polity:us
      - polity:japan
      - polity:drv
- add:
    entry:
      id: cal.1960-03-30.vietnam-hanoi
      when: Mar. 30
      date: '1960-03-30'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 200-CT/TW. In the big cities private owners hold 81 percent of the floor space of housing, rented houses 33 percent, a quarter of it with owners absent: owners of many rented houses to be reformed and all rented housing in the cities and towns brought under state management.'
      n: '*Chỉ thị của Ban Bí thư số 200-CT/TW về việc cải tạo những người có nhiều nhà cho thuê và quản lý toàn bộ nhà cửa cho thuê ở thành phố và thị xã*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 230–32. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-30.vietnam-hanoi-2
      when: Mar. 30
      date: '1960-03-30'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 201-CT/TW on the credit cooperatives, now in nearly every lowland commune, with people''s credit funds in many mountain communes: to be developed and consolidated in 1960, with the farm and supply cooperatives, under the Party committees.'
      n: '*Chỉ thị của Ban Bí thư số 201-CT/TW về việc tăng cường lãnh đạo phát triển và củng cố hợp tác xã vay mượn trong năm 1960*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 233–39. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-31.vietnam-hanoi
      when: Mar. 31
      date: '1960-03-31'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 109-NQ/TW. A Party committee of the People''s Armed Police set up over its command and units, for the time under the Party group of the Ministry of Public Security.'
      n: '*Nghị quyết của Ban Bí thư số 109-NQ/TW về việc thành lập Đảng uỷ Công an nhân dân vũ trang*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 240–41. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03-31.vietnam-hanoi-2
      when: Mar. 31
      date: '1960-03-31'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 110-NQ/TW. A section to guide, study and report on the completion of the democratic reform in the mountains, by the sixteenth plenum and directive no. 156, with the Central Committee''s Nationalities Board.'
      n: '*Nghị quyết của Ban Bí thư số 110-NQ/TW về tổ chức bộ phận chuyên trách việc hoàn thành cải cách dân chủ trong cuộc vận động hợp tác hóa nông nghiệp kết hợp hoàn thành cải cách dân chủ ở miền núi*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 242–44. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-04.vietnam-hanoi
      when: Apr. 4
      date: '1960-04-04'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 202-CT/TW on livestock: neglected in 1959, the peasants in the cooperatives uncertain of its gain, fodder short, the policies ill applied. Propaganda, amended policies, better breeding and fodder.'
      n: '*Chỉ thị của Ban Bí thư số 202-CT/TW về việc tích cực lãnh đạo công tác chăn nuôi*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 245–53. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-04.vietnam-hanoi-2
      when: Apr. 4
      date: '1960-04-04'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 324-TT/TW on irrigation in 1960, after the review of 1959 under the Politburo''s resolution no. 63: 84,557,810 cubic meters of earth moved, four times 1958; over 200,000 small works. Local plans, better tools, trained cadres.'
      n: '*Thông tri của Ban Bí thư số 324-TT/TW về việc tăng cường lãnh đạo và thực hiện tốt nhiệm vụ công tác thuỷ lợi năm 1960*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 254–57. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-07.vietnam-hanoi
      when: Apr. 7
      date: '1960-04-07'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 203-CT/TW on schooling for 1960–61: 2,400,000 pupils in the general and infant schools, 16 percent of the people; adult supplementary education becoming a mass movement. Quantity with quality; the cadres, the key ones from the commune up, first.'
      n: '*Chỉ thị của Ban Bí thư số 203-CT/TW về nhiệm vụ phát triển giáo dục bổ túc văn hóa và phổ thông năm học 1960–1961*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 258–63. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-13.vietnam-hanoi
      when: Apr. 13
      date: '1960-04-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 327-TT/TW. The Supreme People''s Court set up by the National Assembly''s eighth session, the courts separated from the Ministry of Justice: their organization and cadres to be strengthened, to punish counterrevolutionaries and other offenders.'
      n: '*Thông tri của Ban Bí thư số 327-TT/TW về việc tăng cường tổ chức và cán bộ đối với toà án nhân dân các cấp*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 264–67. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-15.vietnam-hanoi-2
      when: Apr. 15
      date: '1960-04-15'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 204-CT/TW, after the Center''s conference of Mar. 21–25 on the farm cooperatives. The lower-level cooperatives to be basically completed in 1960 and some raised to the higher level, by the sixteenth plenum; production the chief content of cooperativization; ideological work first.'
      n: '*Chỉ thị của Ban Bí thư số 204-CT/TW về công tác hợp tác hóa nông nghiệp trong năm 1960 và trong đợt Xuân - Hạ*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 268–75. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-21.vietnam-hanoi
      when: Apr. 21–22
      date: '1960-04-21'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi, in session: wages, social insurance and welfare reviewed, the direction of the 1960 wage reform and increase decided. The afternoon of Apr. 22, on the State Planning Commission''s and the Irrigation Ministry''s Party group''s proposal: three hydroelectric works, Làng Hít in Thái Nguyên, Thác Bà in Yên Bái, Quảng Cư in Vĩnh Phúc.'
      n: '[[w.van-kien-dang-toan]], XXI, 309–11 (the Secretariat''s resolution no. 114-NQ/TW of May 13, 1960, 309: the works, the afternoon of Apr. 22; the Politburo''s resolution no. 115-NQ/TW of May 20, 1960, 311: the session of Apr. 21–22, the wages). Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-22.vietnam-hanoi
      when: Apr. 22
      date: '1960-04-22'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 113-NQ/TW on the cadres'' study of theory: Marxist-Leninist philosophy, political economy and scientific socialism, and the basics of economic management. At the Nguyễn Ái Quốc school, branch I, a one-year course for leading cadres beside the two-year course for theory cadres; political economy first for those studying at their posts.'
      n: '*Nghị quyết của Bộ Chính trị số 113-NQ/TW về công tác học tập lý luận của cán bộ*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 276–79. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-25.vietnam-hanoi
      when: Apr. 25
      date: '1960-04-25'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 205-CT/TW on the farm tax, debts and rice purchase of the fifth-month crop of 1960. The tenth-month crop of 1959 bought some 100,000 tons more than 1958''s, but the drive at 88.8 percent of the maximum plan, 94.8 of the minimum; the farm tax 9,000 tons short, 96.5 percent; many provinces short of the Center''s quota.'
      n: '*Chỉ thị của Ban Bí thư số 205-CT/TW về việc tiến hành công tác thu thuế nông nghiệp, thu nợ và mua thóc vụ chiêm 1960*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 280–87. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-04-30.vietnam-hanoi
      when: Apr. 30
      date: '1960-04-30'
      thread: vietnam-hanoi
      also:
      - vietnam
      - japan-and-korea-rhee
      c: 'The Party Center to the Nam Bộ and Interzone V Executive Committees, cable no. 34, on South Korea: the movement against "the U.S.-Rhee" regime strong in the cities, among students and intellectuals, weak in the countryside, the army aloof or repressing, its leaders pro-American bourgeois; one cruel agent replaced by a subtler. Its lessons: mass political struggle can shake a dictatorship but without military force cannot win; the students matter most; the enemy''s quarrels at the top to be used. Members not to hope too much from it; the cities, Saigon and Chợ Lớn''s students above all, to be better led.'
      n: '*Điện của Trung ương Đảng số 34 gửi Xứ uỷ Nam Bộ, Khu uỷ V*. [[w.van-kien-dang-toan]], XXI, 306–08. Made public: 2002. Names: Rhee.'
      tags:
      - polity:us
      - polity:rok
      - polity:rvn
      - name:rhee-syngman
      - polity:drv
- add:
    entry:
      id: cal.1960-05-13.vietnam-hanoi
      when: May 13
      date: '1960-05-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 114-NQ/TW, on the Politburo''s decision for three hydroelectric works: Thác Bà and Làng Hít first, on time; Quảng Cư, which would also water Vĩnh Phúc and Bắc Ninh, to be timed in the five-year plan. The planners and the Irrigation Ministry''s Party group to discuss the plan with the Soviet experts.'
      n: '*Nghị quyết của Ban Bí thư số 114-NQ/TW về việc xây dựng ba công trình thuỷ điện Làng Hít, Thác Bà, Quảng Cư*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 309–10. See [[cal.1960-04-21.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:ussr
      - polity:drv
- add:
    entry:
      id: cal.1960-05-20.vietnam-hanoi
      when: May 20
      date: '1960-05-20'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 115-NQ/TW on its session of Apr. 21–22: the wage reform of 1958 met the thirteenth plenum''s aims but left too many scales and unequal pay between heavy and light industry and for technicians. For 1960 the three-year plan''s rise of 25 percent over the 1957 average; simpler scales, minimum and maximum wages, pay by post for officials, new allowances; one system of wages, social insurance and welfare for all on the state payroll.'
      n: '*Nghị quyết của Bộ Chính trị số 115-NQ/TW về cải tiến chế độ tiền lương và tăng lương năm 1960*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 311–25. See [[cal.1960-04-21.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-05-20.vietnam-hanoi-2
      when: May 20
      date: '1960-05-20'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 331-TT/TW, after directive no. 198. The outline of the Central Committee''s political report to the national congress to be discussed at the congresses of the zones, provinces, Hanoi and Haiphong and of the organizations under the Center: Vĩnh Linh, the Thái Nguyên steel complex, the central agencies, the railways, the armed police.'
      n: '*Thông tri của Ban Bí thư số 331-TT/TW về việc quy định Đại hội đảng bộ các cấp thảo luận Đề cương Báo cáo Chính trị của Trung ương Đảng ở Đại hội toàn quốc*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 326–27. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-05-21.vietnam-hanoi
      when: May 21
      date: '1960-05-21'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 206-CT/TW on the congresses of the zones, cities and provinces: to discuss the outline of the political report and the draft statute and send delegates up to the national congress; the committees not re-elected until after it.'
      n: '*Chỉ thị của Ban Bí thư số 206-CT/TW về việc tiến hành Đại hội đại biểu khu, thành, tỉnh*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 328–31. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-05-21.vietnam-hanoi-2
      when: May 21
      date: '1960-05-21'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Party Center to the Nam Bộ and Interzone V Executive Committees, cable: "we and the friends" have lately exchanged views on the world and the South, at bottom as the Center''s cable of some weeks before. In the South peace and war at once: political struggle the chief form, armed struggle in its support, for self-defense; wholly political in the cities. The South''s revolution the South''s own work; the North cannot meet its needs; "no evidence whatever" of the North''s intervention to be shown. Diệm''s promises of reform to be exposed and used for legal struggle in the cities.'
      n: '*Điện của Trung ương gửi X.U.N.B và L.K.U. V*. [[w.van-kien-dang-toan]], XXI, 332–36. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - polity:us
      - polity:rvn
      - name:ngo-dinh-diem
      - polity:drv
- add:
    entry:
      id: cal.1960-05-27.vietnam-hanoi
      when: May 27
      date: '1960-05-27'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 207-CT/TW, after the Politburo''s decision of Apr. 22 for three hydroelectric works: Thác Bà first; the people and the economic and political bodies in its reservoir to be moved; the Yên Bái committee to help the Irrigation Ministry organize the site and, with the Public Security Ministry''s Party group, guard it.'
      n: '*Chỉ thị của Ban Bí thư số 207-CT/TW về việc dời dân và những cơ sở kinh tế, chính trị ở trong khu vực hồ chứa của Nhà máy thủy điện Thác Bà và việc tổ chức công trường xây dựng nhà máy*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 337–39. See [[cal.1960-04-21.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-05-28.vietnam-hanoi
      when: May 28
      date: '1960-05-28'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 332-TT/TW, carrying out the Politburo''s resolution on the 1960 wage reform: political education from the announcement to the end of the regrading; each Party committee responsible for its own staff''s grades; wages tied to finance, money and the supply of goods.'
      n: '*Thông tri của Ban Bí thư số 332-TT/TW về việc thi hành Nghị quyết của Hội nghị Bộ Chính trị về cải tiến chế độ tiền lương và tăng lương năm 1960*, signed for the Secretariat by Lê Văn Lương, head of its office. [[w.van-kien-dang-toan]], XXI, 340–43. See [[cal.1960-05-20.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-06-02.vietnam-hanoi
      when: June 2
      date: '1960-06-02'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 208-CT/TW on floods and typhoons in 1960. Since the peace 64 million cubic meters of earth, 1,200,000 of stone, 205,000 of concrete on the dikes; some still low. Command boards at every level, youth and militia the core of the dike guards, strict discipline.'
      n: '*Chỉ thị của Ban Bí thư số 208-CT/TW về công tác phòng và chống lụt bão năm 1960*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 344–48. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-06-09.vietnam-hanoi
      when: June 9
      date: '1960-06-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 211-CT/TW on public health: sickness down since the peace, with the fraternal countries'' help, but the work short of need. In 1960 a deep campaign of exercise, hygiene and prevention; the social diseases, mothers and children, the health of the factories, farms and mountains; cadres trained; the Party to lead.'
      n: '*Chỉ thị của Ban Bí thư số 211-CT/TW về việc tăng cường công tác y tế*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 349–57. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-06-16.vietnam-hanoi
      when: June 16
      date: '1960-06-16'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: directive no. 212-CT/TW on cooperatives in sea fishing along the North''s more than 800 kilometers of coast, important for the economy, politics and defense. The coastal reform done but in Hải Ninh; the boat owners'' exploitation to be ended by stages: fishing teams, lower and higher fishing cooperatives, fishing-farming cooperatives; the Party''s class line on the coast, shares, technique.'
      n: '*Chỉ thị của Bộ Chính trị số 212-CT/TW về việc tiến hành hợp tác hóa nghề cá ở miền biển*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 358–75. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-06-22.vietnam-hanoi
      when: June 22
      date: '1960-06-22'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 213-CT/TW on the reform of private business, now under way in 31 provinces and cities, mostly small and middle capitalists: the small ones; the obstinate, set aside for now; hotels, inns and eating houses; overseas Vietnamese back from Thailand with capital, encouraged; small traders in trades the state takes over whole.'
      n: '*Chỉ thị của Ban Bí thư số 213-CT/TW về chủ trương đối với một số vấn đề cụ thể trong công tác cải tạo công thương nghiệp tư bản tư doanh hiện nay*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 376–82. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-06-22.vietnam-hanoi-2
      when: June 22
      date: '1960-06-22'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 336-TT/TW, under the Politburo''s wage resolution: separate pay scales, decided at its meeting of May 29, for the cadres, workers and employees of the Party and mass organizations from the Center to the localities.'
      n: '*Thông tri của Ban Bí thư số 336-TT/TW về việc ban hành các bảng lương cho cán bộ, công nhân, viên chức công tác ở các cơ quan dân đảng từ trung ương đến địa phương*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 383–86. See [[cal.1960-05-20.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-06-27.vietnam-hanoi
      when: June 27
      date: '1960-06-27'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat, Hanoi: directive no. 214-CT/TW. "U.S.-Diệm" terror in the South, and charges that the North organizes subversion there, to clear the way for SEATO; the Indian and Canadian members of the International Commission preparing conclusions unfavorable to Hanoi. A wide political campaign in the North for July 20: the United States to get out of the South, the South''s government to carry out the Geneva Agreements, the Commission to do its duty; in step with the anti-American movements of Korea and Japan.'
      n: '*Chỉ thị của Ban Bí thư số 214-CT/TW về vấn đề mở một đợt đấu tranh chính trị rộng lớn chống Mỹ - Diệm nhân dịp 20-7*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 387–91. Made public: 2002. Names: Ngô Đình Diệm.'
      tags:
      - polity:us
      - polity:rvn
      - polity:india
      - polity:canada
      - name:ngo-dinh-diem
      - polity:drv
