    entry:
      id: cal.1961-01-23.vietnam-hanoi
      when: Jan. 23
      date: '1961-01-23'
      thread: vietnam-hanoi
      c: 'The Central Committee: resolution no. 06-NQ/TW, by its third plenum, signed by Lê Duẩn, First Secretary. Nguyễn Văn Trân added to the Secretariat''s seven. A Central Control Commission of eleven, Nguyễn Lương Bằng head. A Central Military Committee of fourteen, Võ Nguyên Giáp secretary, Văn Tiến Dũng and Song Hào deputies, Lê Duẩn, Nguyễn Chí Thanh, Hoàng Văn Thái, Lê Quang Đạo and Trần Văn Trà among them. Lê Duẩn head of the Reunification Board; Trường Chinh director of the Nguyễn Ái Quốc school, branch I, for Lê Đức Thọ; Nguyễn Chí Thanh head of the Rural Work Board; Xuân Thủy deputy secretary of the National Assembly''s Party group, for Hoàng Văn Hoan, now Hanoi''s Party secretary; Ưng Văn Khiêm Foreign Minister.'
      n: '*Nghị quyết của Hội nghị Ban Chấp hành Trung ương lần thứ ba số 06-NQ/TW về vấn đề phân công*, signed for the Central Committee by Lê Duẩn, First Secretary. [[w.van-kien-dang-toan]], XXII, 115–17. Made public: 2002. Names: Lê Duẩn, Trường Chinh, Võ Nguyên Giáp, Văn Tiến Dũng, Nguyễn Chí Thanh, Hoàng Văn Thái, Lê Quang Đạo, Trần Văn Trà, Lê Đức Thọ, Xuân Thủy, Ưng Văn Khiêm, Nguyễn Văn Trân, Nguyễn Lương Bằng, Song Hào, Hoàng Văn Hoan.'
