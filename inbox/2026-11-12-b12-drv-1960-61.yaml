      date: '1961-01-27'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 10-CT/TW on training cadres for the farm cooperatives, managers, accountants, technicians: the duties of the boards and ministries; a central school of agricultural cooperatives to train the local schools'' teachers.'
      n: '*Chỉ thị của Ban Bí thư số 10-CT/TW về việc đào tạo và bồi dưỡng cán bộ cho phong trào hợp tác hoá nông nghiệp*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 180–83. Made public: 2002.'
