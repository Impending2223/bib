    entry:
      id: cal.1960-12-17.vietnam-hanoi
      when: Dec. 17
      date: '1960-12-17'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 07-CT/TW, a campaign in January 1961 for the Law on Marriage and the Family, in force since Jan. 13, 1960.'
      n: '*Chỉ thị của Ban Bí thư số 07-CT/TW về đợt tuyên truyền vận động thi hành Luật Hôn nhân và gia đình vào tháng 1-1961*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXI, 1053–58. See [[cal.1960-11-10.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
