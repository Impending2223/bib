      when: Jan. 13
      date: '1961-01-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 15-TT/TW. Economic and technical norms and technical standards in the enterprises and building sites going well, by the report of the Council of Government''s standing committee; the Party committees to see them finished.'
      n: '*Thông tri của Ban Bí thư Trung ương số 15-TT/TW về việc tăng cường lãnh đạo hoàn thành tốt công tác xây dựng chỉ tiêu kinh tế kỹ thuật và tiêu chuẩn kỹ thuật ở các xí nghiệp, công trường*, signed for the Secretariat by Nguyễn Khai, head of its office. [[w.van-kien-dang-toan]], XXII, 127–29. Made public: 2002.'
      tags:
      - polity:drv
