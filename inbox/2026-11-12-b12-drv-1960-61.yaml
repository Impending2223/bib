      when: Jan. 11
      date: '1961-01-11'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 29-NQ/TW, on the women''s Party group''s proposal: the Central Women''s Party group reorganized, its members named.'
      n: '*Nghị quyết của Ban Bí thư số 29-NQ/TW về việc tổ chức lại Đảng đoàn phụ nữ Trung ương*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 123–24. Made public: 2002.'
      tags:
      - polity:drv
