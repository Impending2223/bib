      when: Dec. 3
      date: '1960-12-03'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat to the Nam Bộ Executive Committee, cable no. 49/NB: some words of the manifesto changed on its advice; further changes to be proposed word by word, "for once out it cannot be corrected"; when will it be published, for Interzone V to do the same. The Front''s program still under review. Local front committees broad, their lists perhaps not public at first; the central committee''s members and their announcement later.'
      n: '*Điện của Ban Bí thư số 49/NB gửi Xứ uỷ Nam Bộ*. [[w.van-kien-dang-toan]], XXI, 1047–48. See [[cal.1960-11-24.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
