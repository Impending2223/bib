      when: Feb. 27
      date: '1961-02-27'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 13-NQ/TW, on its session of November 1960, the tasks of farm cooperativization in 1961: technique and production, democratic management, the errors of policy corrected, political work; small cooperatives merged only where the members want it, good cadres lead and one core cooperative is sound.'
      n: '*Nghị quyết của Bộ Chính trị số 13-NQ/TW về nhiệm vụ và phương hướng công tác hợp tác hoá nông nghiệp trong năm 1961*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 215–33. Made public: 2002.'
      tags:
      - polity:drv
