      when: Apr. 6
      date: '1961-04-06'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 25-TT/TW on electing judges and people''s assessors at every level: the people''s courts "an instrument of dictatorship" of the state, under the Party.'
      n: '*Thông tri của Ban Bí thư số 25-TT/TW về việc lãnh đạo bầu thẩm phán và hội thẩm nhân dân các cấp toà án*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 297–99. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-04-11.vietnam-hanoi
      when: Apr. 11
      date: '1961-04-11'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 17-CT/TW on grain. Farm output in 1960 fell badly; two months to the corn, sweet potato and fifth-month harvests, shortage and hunger in the fifth-month lowlands and where the last crop failed. By the Politburo''s directive the Prime Minister''s directive no. 130-TTg of Apr. 4; the zone, city and province committees to see that "no one at all" in their areas dies of hunger.'
      n: '*Chỉ thị của Ban Bí thư số 17-CT/TW về vấn đề lương thực*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 300–04. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-04-14.vietnam-hanoi
      when: Apr. 14
      date: '1961-04-14'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 389-NQNS/TW, after the second national trade union congress: the Party group of the General Federation of Labor reorganized, Trần Danh Tuyên secretary, Hoàng Quốc Việt a member.'
      n: '*Nghị quyết của Ban Bí thư số 389-NQNS/TW về việc tổ chức lại Đảng đoàn Tổng Công đoàn*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 305. Made public: 2002. Names: Trần Danh Tuyên, Hoàng Quốc Việt.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-04-14.vietnam-hanoi-2
      when: Apr. 14
      date: '1961-04-14'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 27-TT/TW on electing the district, town and châu Party committees as their terms end: nine to 25 members, by circular no. 322-TT/TW of Mar. 23, 1960.'
      n: '*Thông tri của Ban Bí thư số 27-TT/TW về việc bầu cử các Ban Chấp hành Đảng bộ huyện, thị, châu*, signed for the Secretariat by Nguyễn Khai, head of its office. [[w.van-kien-dang-toan]], XXII, 306–07. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-04-28.vietnam-hanoi
      when: Apr. 28
      date: '1961-04-28'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 18-CT/TW on irrigation works and the dikes in the flood season: 32 large works in 1961, 213 percent of the 1960 investment, over 500 local ones at twice 1960''s.'
      n: '*Chỉ thị của Ban Bí thư số 18-CT/TW về việc tăng cường lãnh đạo hơn nữa công tác xây dựng cơ bản công trình thuỷ lợi và công tác đê điều kè cống trong mùa lũ lụt bão*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 308–12. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-05-08.vietnam-hanoi
      when: May 8
      date: '1961-05-08'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 18-NQ/TW on grain policy. The 1960 fifth-month crop bad; for the tenth-month crop the Politburo had made selling surplus rice to the state an obligation by ratio: necessary and right, purchases near 1959''s good year; but commandism and coercion in many places, hoarding and fear of hunger widespread, the countryside tense in places. Grain to go fully before the next plenum.'
      n: '*Nghị quyết của Bộ Chính trị số 18-NQ/TW về chính sách lương thực hiện nay*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 313–22. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-05-11.vietnam-hanoi
      when: May 11
      date: '1961-05-11'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat, Hanoi: directive no. 19-CT/TW, a campaign against the American plan to send troops into the South. Washington sends Vice President Johnson to Saigon this day to settle with Ngô Đình Diệm more military aid and troops; $41 million more for Diệm, counterguerrilla trainers and arms. Its present aim to threaten the South''s and Laos''s revolutions and build up Diệm, the ground laid for intervention later.'
      n: '*Chỉ thị của Ban Bí thư số 19-CT/TW về phát động đấu tranh chống âm mưu đế quốc Mỹ định đưa quân vào miền Nam Việt Nam*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 323–26. Made public: 2002. Names: Ngô Đình Diệm, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:ngo-dinh-diem
      - polity:us
      - polity:rvn
      - polity:drv
- add:
    entry:
      id: cal.1961-06-01.vietnam-hanoi
      when: June 1
      date: '1961-06-01'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 19-NQ/TW, under Article 37 of the statute: a joint cell committee (liên chi) where a basic organization has 300 members or more and one of its sections 50 or more.'
      n: '*Nghị quyết của Ban Bí thư số 19-NQ/TW về việc thành lập Liên chi trong tổ chức cơ sở của Đảng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 327–31. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-06-16.vietnam-hanoi
      when: June 16
      date: '1961-06-16'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN: directive on mass and front work. The movement strong and the National Liberation Front''s influence wide, but faults in the work; the mass organizations to be built wide and many in every area, and firm.'
      n: '*Chỉ thị của Trung ương Cục miền Nam thiết thực đẩy mạnh công tác dân vận - mặt trận để tiến kịp với tình hình phát triển hiện nay*. [[w.van-kien-dang-toan]], XXII, 633–40. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-06-26.vietnam-hanoi
      when: June 26
      date: '1961-06-26'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 20-CT/TW against "U.S.-Diệm" commandos and spies sent North, by sea, across the border or by parachute; since Kennedy became President, Washington more active in sending saboteurs into the socialist countries; the "observation teams" trained since late 1957.'
      n: '*Chỉ thị của Ban Bí thư số 20-CT/TW về công tác đối phó với hoạt động tung biệt kích gián điệp của bọn Mỹ - Diệm ra phá hoại miền Bắc nước ta*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 337–44. Made public: 2002. Names: Ngô Đình Diệm, Kennedy.'
      tags:
      - name:kennedy-john-f
      - polity:us
      - polity:rvn
      - name:ngo-dinh-diem
      - polity:drv
- add:
    entry:
      id: cal.1961-06-30.vietnam-hanoi
      when: June 30
      date: '1961-06-30'
      thread: vietnam-hanoi
      c: 'The Central Committee''s fourth plenum, Hanoi: resolution no. 22-NQ/TW on strengthening the Central Committee''s leadership. Three years of victory; the land reform''s errors liquidated. The line right, but at times late and not made concrete; the faults chiefly in organizing and directing its execution, to be gone into at later plenums on single subjects. Every member of the Central Committee to spend time at the base each year, those over branches to direct one basic organization themselves.'
      n: '*Nghị quyết của Hội nghị Trung ương lần thứ tư số 22-NQ/TW về việc tăng cường lãnh đạo của Trung ương*. [[w.van-kien-dang-toan]], XXII, 345–64. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-07-03.vietnam-hanoi
      when: July 3
      date: '1961-07-03'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi, Lê Duẩn, Phạm Hùng, Hoàng Anh and Nguyễn Văn Trân present, on pay for commune cadres: the government and the Party to pay some Party and administration cadres; the cooperatives their own cadres; the mass organizations'' cadres, as revolutionary bodies, no state allowance.'
      n: '*Thông báo Hội nghị Ban Bí thư số 14-TB/TW về chế độ đãi ngộ đối với cán bộ xã*, Nov. 24, 1961, signed by Phạm Chung, deputy head of the Central Office. [[w.van-kien-dang-toan]], XXII, 550–54. Made public: 2002. Names: Lê Duẩn, Phạm Hùng, Hoàng Anh, Nguyễn Văn Trân.'
      tags:
      - name:le-duan
      - polity:drv
- add:
    entry:
      id: cal.1961-07-05.vietnam-hanoi
      when: July 5
      date: '1961-07-05'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: resolution no. 21-NQ/TW, on the reports of the Central Industry Board and the central handicraft cooperative union board: the tasks of the handicraft cooperatives, production concentrated by trade, as far as it brings better process, tools or mechanization.'
      n: '*Nghị quyết của Ban Bí thư số 21-NQ/TW về nhiệm vụ, phương hướng phát triển sản xuất và củng cố hợp tác xã thủ công nghiệp*, signed for the Secretariat by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 371–88. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-07-07.vietnam-hanoi
      when: July 7
      date: '1961-07-07'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 23-CT/TW on finishing the grain work of the 1961 fifth-month crop under the Politburo''s resolution of May 8: the committees slow to lead from the start.'
      n: '*Chỉ thị của Ban Bí thư số 23-CT/TW về việc tăng cường lãnh đạo hoàn thành công tác lương thực vụ chiêm 1961*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXII, 389–94. See [[cal.1961-05-08.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-07-12.vietnam-hanoi
      when: July 12
      date: '1961-07-12'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 24-CT/TW. A corps of part-time lecturers in Marxism-Leninism for the cadres'' study at their posts: their standards, lists, hours and training.'
      n: '*Chỉ thị của Ban Bí thư số 24-CT/TW về tổ chức đội ngũ giảng viên lý luận kiêm chức*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 395–98. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-07-19.vietnam-hanoi
      when: July 19
      date: '1961-07-19'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: a resolution on the direction of credit, the management of money and the drawing of savings.'
      n: '[[w.van-kien-dang-toan]], XXII, 508 (the Secretariat''s directive no. 30-CT/TW of Nov. 9, 1961, citing it). Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-07-24.vietnam-hanoi
      when: July 24
      date: '1961-07-24'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 25-CT/TW. The movement of "technical demonstrations" to rationalize production and improve technique in the enterprises, sites and handicraft cooperatives to be pressed.'
      n: '*Chỉ thị của Ban Bí thư số 25-CT/TW về việc tiếp tục đẩy mạnh phong trào thi đua hợp lý hoá sản xuất, cải tiến kỹ thuật*, signed for the Secretariat by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 399–403. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-07-25.vietnam-hanoi
      when: July 25
      date: '1961-07-25'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: regulation no. 24-QĐ/TW. Cadres and staff of the Party, state and mass organizations sent, and to be sent, to work in "the West" at the "friendly party''s" request: their political, cultural and professional training and their material care added to; proletarian internationalism; good relations among them and with the cadres at home.'
      n: '*Quy định của Ban Bí thư số 24-QĐ/TW về một số chế độ đối với cán bộ, nhân viên dân, chính, đảng công tác ở miền Tây*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 404–09. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-08-04.vietnam-hanoi
      when: Aug. 4
      date: '1961-08-04'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN: directive on the struggle against spies and on building its own "security" and "protection" organization. The enemy, weakening in the countryside and mountains, adds police and informers in the towns and rebuilds its spy networks in the strong rural areas, for commando raids and terror.'
      n: '*Chỉ thị của Trung ương Cục miền Nam về đấu tranh chống gián điệp và xây dựng lần tổ chức "an ninh", "bảo vệ" của ta*. [[w.van-kien-dang-toan]], XXII, 641–52. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-08-10.vietnam-hanoi
      when: Aug. 10
      date: '1961-08-10'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat to the Nam Bộ Executive Committee, secret cable no. 168, answering its no. 104/NB of July 11 on the first conference of the Central Office for South Vietnam: to grasp the whole South, Interzone V and Nam Bộ, and the Politburo''s new directive; COSVN''s organs, base area and division of work; the battlefields redrawn, their chiefs named; one leadership, one budget, one system of liaison, transport and supply. The Center has named its secretary and deputy; Trần Lương to stay in Nam Bộ with the standing committee; Võ Chí Công deputy secretary, and secretary of Interzone V; Trần Văn Quang commander for Nam Bộ, Nguyễn Đôn for Zone V.'
      n: '*Điện mật của Ban Bí thư gửi XUNB số 168 góp ý về nội dung Hội nghị lần thứ nhất của Trung ương Cục miền Nam*. [[w.van-kien-dang-toan]], XXII, 461–63. Made public: 2002. Names: Trần Lương, Võ Chí Công, Trần Văn Quang, Nguyễn Đôn.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-08-21.vietnam-hanoi
      when: Aug. 21
      date: '1961-08-21'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 36-TT/TW, guiding the Party''s discussion of the fifth plenum''s resolution on agriculture in the first five-year plan.'
      n: '*Thông tri của Ban Bí thư số 36-TT/TW hướng dẫn thảo luận Nghị quyết Hội nghị Trung ương lần thứ năm về phát triển nông nghiệp trong kế hoạch 5 năm lần thứ nhất*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 469–71. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-09-08.vietnam-hanoi
      when: Sept. 8
      date: '1961-09-08'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi, Hồ Chí Minh, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Lê Thanh Nghị and Chu Văn Tấn present, on the summing up of the mountain campaign of cooperatives and democratic reform: on the whole good, feudal exploitation basically ended, some counterrevolutionaries repressed; over 73 percent of the working peasants'' households in cooperatives in nearly two years; management weak, technique little improved, livestock down. The mountain cooperative a political as well as a productive body, the upper strata of the minorities to be won.'
      n: '*Thông báo số 10-TB/VPTW về Hội nghị Bộ Chính trị ngày 8-9-1961 bàn về tổng kết hợp tác hoá kết hợp hoàn thành cải cách dân chủ ở miền núi*, Sept. 20, 1961, signed by Phạm Chung, deputy head of the Central Office. [[w.van-kien-dang-toan]], XXII, 475–79. Made public: 2002. Names: Hồ Chí Minh, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Lê Thanh Nghị, Chu Văn Tấn.'
      tags:
      - name:ho-chi-minh
      - name:le-duan
      - name:truong-chinh
      - name:pham-van-dong
      - polity:drv
- add:
    entry:
      id: cal.1961-09-15.vietnam-hanoi
      when: Sept. 15
      date: '1961-09-15'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat, Hanoi: directive no. 26-CT/TW, signed by Lê Duẩn, on helping the revolution in the South, now "a strong high tide," its bases forming; Diệm, with American help in everything, will strike harder. Beyond the South''s own efforts, the North''s active help in every field; the North to prepare too to help the South rebuild once liberated. The Politburo has passed principles of aid; the Reunification Board, the Organization Board and the Central Military Committee to make them known.'
      n: '*Chỉ thị của Ban Bí thư số 26-CT/TW về việc tích cực công tác giúp đỡ cách mạng miền Nam*, signed for the Secretariat by Lê Duẩn. [[w.van-kien-dang-toan]], XXII, 472–74. Made public: 2002. Names: Ngô Đình Diệm, Lê Duẩn.'
      tags:
      - name:le-duan
      - name:ngo-dinh-diem
      - polity:us
      - polity:rvn
      - polity:drv
- add:
    entry:
      id: cal.1961-10-04.vietnam-hanoi
      when: Oct. 4
      date: '1961-10-04'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 27-CT/TW on the concentrated reform, in camps, of those "dangerous to social security," after directive no. 13 and the decisions of the National Assembly''s Standing Committee and the Council of Government: counterrevolutionaries first, those with "blood debts" to the people; to be done urgently and under the zone, city and province committees, for errors would cost politically.'
      n: '*Chỉ thị của Ban Bí thư số 27-CT/TW về việc lãnh đạo công tác tập trung cải tạo những phần tử nguy hiểm cho an ninh xã hội*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 480–83. See [[cal.1961-03-01.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-10-31.vietnam-hanoi-2
      when: Oct. 31
      date: '1961-10-31'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 29-CT/TW on grain from the 1961 tenth-month crop. The fifth-month crop''s tax in rice at 100.46 percent of plan; purchases and debt collection 84.5 percent of the maximum, 100.8 of the minimum; rice evened out within the cooperatives.'
      n: '*Chỉ thị của Ban Bí thư số 29-CT/TW về công tác lương thực vụ mùa 1961*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 496–502. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-11-06.vietnam-hanoi
      when: Nov. 6
      date: '1961-11-06'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi, the afternoon, Phạm Hùng, Hoàng Anh and Nguyễn Văn Trân present, with the Labor Youth Union''s Vũ Quang, Lê Bình and Nguyễn Văn Trọng, on the congress of the Vietnam Youth Federation: its report and statute; Phạm Huy Thông to be its chairman.'
      n: '*Thông báo Hội nghị Ban Bí thư số 13-TB/HN bàn về Đại hội liên hiệp Thanh niên Việt Nam*, Nov. 17, 1961. [[w.van-kien-dang-toan]], XXII, 540–42. Made public: 2002. Names: Phạm Hùng, Hoàng Anh, Nguyễn Văn Trân, Vũ Quang, Lê Bình, Nguyễn Văn Trọng, Phạm Huy Thông.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-11-09.vietnam-hanoi
      when: Nov. 9
      date: '1961-11-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 30-CT/TW, under the Politburo''s resolution of July 19: credit and cash management better in the third quarter, but the imbalance between money in circulation and goods still serious; credit, money and savings work to be strengthened.'
      n: '*Chỉ thị của Ban Bí thư số 30-CT/TW về việc tăng cường công tác tiền tệ, tín dụng và huy động tiết kiệm*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 508–11. See [[cal.1961-07-19.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-11-09.vietnam-hanoi-2
      when: Nov. 9
      date: '1961-11-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 31-CT/TW on finance, trade and banking. The year began with grain and food short and prices jumping; the winter-spring crop of 1960–61, rice, corn, sweet potatoes and cassava together, over 60 percent above 1960''s, the autumn rice 135,000 tons; food steadier in recent months.'
      n: '*Chỉ thị của Ban Bí thư số 31-CT/TW về việc tăng cường lãnh đạo công tác tài chính - mậu dịch - ngân hàng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 512–29. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-11-13.vietnam-hanoi
      when: Nov. 13
      date: '1961-11-13'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 30-NQ/TW on the Party''s organization in the army, after the resolutions of 1952 and 1955 and the directives of 1957 and 1960.'
      n: '*Nghị quyết của Bộ Chính trị số 30-NQ/TW về một số vấn đề về tổ chức đảng trong quân đội*, signed for the Politburo by Nguyễn Chí Thanh. [[w.van-kien-dang-toan]], XXII, 530–35. Made public: 2002. Names: Nguyễn Chí Thanh.'
      tags:
      - name:nguyen-chi-thanh
      - polity:drv
- add:
    entry:
      id: cal.1961-11-13.vietnam-hanoi-2
      when: Nov. 13
      date: '1961-11-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 32-CT/TW, pressing the movement to protect public order, "a broad mass campaign" by directive no. 186 of Feb. 17, 1960.'
      n: '*Chỉ thị của Ban Bí thư số 32-CT/TW về việc đẩy mạnh phong trào bảo vệ trị an*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 536–39. See [[cal.1960-02-17.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-11-22.vietnam-hanoi
      when: Nov. 22
      date: '1961-11-22'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 33-CT/TW on the rules for merging farm cooperatives into larger ones, by the Politburo''s resolution on cooperativization in 1961: crops near harvest left to the small cooperative, the rest to the large; debts for production and for fixed assets.'
      n: '*Chỉ thị của Ban Bí thư số 33-CT/TW về một số chính sách trong khi tiến hành hợp nhất mở rộng quy mô hợp tác xã sản xuất nông nghiệp*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 543–49. See [[cal.1961-02-27.vietnam-hanoi]]. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-11-24.vietnam-hanoi
      when: Nov. 24
      date: '1961-11-24'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 31-NQ/TW on the plan to rebuild and enlarge Haiphong, the North''s largest port, a strategic point for defense: 250,000 to 300,000 people over some three five-year plans to 1975; the port to 4 million tons a year, eastward; new industry at Vật Cách.'
      n: '*Nghị quyết của Bộ Chính trị số 31-NQ/TW về quy hoạch cải tạo và mở rộng thành phố Hải Phòng*. [[w.van-kien-dang-toan]], XXII, 555–60. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-11-25.vietnam-hanoi
      when: Nov. 25
      date: '1961-11-25'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat to COSVN, cable no. 525, on learning and reporting the enemy''s situation, the spies of the imperialists, the Americans above all, and the reactionaries: every member to report; trusted members to be placed in the enemy''s intelligence, police and reactionary bodies; men in key posts won over; some planted to stay hidden after the South''s liberation.'
      n: '*Điện của Ban Bí thư gửi Trung ương Cục số 525 hướng dẫn việc nắm và báo cáo về tình hình địch*. [[w.van-kien-dang-toan]], XXII, 561–67. Made public: 2002.'
      tags:
      - polity:us
      - polity:drv
- add:
    entry:
      id: cal.1961-11-30.vietnam-hanoi
      when: Nov. 30–Dec. 2
      date: '1961-11-30'
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: The Central Committee's sixth plenum, Hanoi. Lê Duẩn reports for the delegation, led by Hồ Chí Minh, to the Soviet party's Twenty-second Congress; the plenum approves the report and the delegation's acts, studies Khrushchev's report on the new program "for building communism," to be spread in the Party and among the people. The Politburo to put the Central Committee's view of the Albanian-Soviet quarrel to the Soviet, Albanian and fraternal parties when it can. Unity with the Soviet and Chinese parties, the Soviet Union "the center."
      n: '*Báo cáo của Đoàn đại biểu Đảng Lao động Việt Nam dự Đại hội lần thứ XXII của Đảng Cộng sản Liên Xô do đồng chí Lê Duẩn trình bày ...*; *Kết luận của Hội nghị Ban Chấp hành Trung ương lần thứ sáu ...*; *Thông cáo về Hội nghị lần thứ sáu ...*. [[w.van-kien-dang-toan]], XXII, 568–608 (the report, 568–602; the conclusions, 603–04; the communiqué, 605–08). See [[cal.1961-11.vietnam-hanoi]]. Made public: 2002. Names: Lê Duẩn, Hồ Chí Minh, Khrushchev.'
      tags:
      - name:le-duan
      - name:ho-chi-minh
      - name:khrushchev-nikita-s
      - polity:ussr
      - polity:prc
      - polity:drv
- add:
    entry:
      id: cal.1961-12-11.vietnam-hanoi
      when: Dec. 11
      date: '1961-12-11'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 34-CT/TW, after the Center''s conference on the tenth-month grain: where the work is done well the people sell rice and pay the tax willingly; elsewhere shortcomings.'
      n: '*Chỉ thị của Ban Bí thư số 34-CT/TW về việc tăng cường lãnh đạo công tác lương thực hiện nay*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 609–15. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-12-22.vietnam-hanoi
      when: Dec. 22
      date: '1961-12-22'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat, Hanoi: directive no. 35-CT/TW. With the Staley plan, and after General Taylor''s visit, the American National Security Council has approved a program of armed intervention: some 70 military aircraft, many weapons and nearly 1,000 American officers and men sent to the South, part of the Seventh Fleet patrolling its coast. The political struggle against it to go on and widen: American personnel, aircraft and arms out; the International Commission to act.'
      n: '*Chỉ thị của Ban Bí thư số 35-CT/TW về tiếp tục đẩy mạnh cuộc đấu tranh chống đế quốc Mỹ và tay sai Ngô Đình Diệm đưa thêm nhiều vũ khí và nhân viên quân sự Mỹ vào miền Nam Việt Nam*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXII, 616–20. Made public: 2002. Names: Taylor, Staley.'
      tags:
      - name:taylor-maxwell
      - polity:us
      - polity:rvn
      - name:staley-eugene
      - polity:drv
- add:
    entry:
      id: cal.1961-12-28.vietnam-hanoi
      when: Dec. 28
      date: '1961-12-28'
      thread: vietnam-hanoi
      c: 'The Politburo, Hanoi: resolution no. 32-NQ/TW on the plan for building Vinh into a socialist industrial city: industry at Bến Thủy and to the northwest, the port and stores, 90 square meters of civil land a head; the province committee to direct it.'
      n: '*Nghị quyết của Bộ Chính trị số 32-NQ/TW về quy hoạch xây dựng thành phố Vinh*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXII, 621–27. Made public: 2002.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-12-31.vietnam-hanoi
      when: Dec. 31
      date: '1961-12-31'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 36-CT/TW on winter-spring production and rice purchase: seedlings enough, more land ploughed, irrigation pressed; but ploughing slow, fertilizer low, the season late; buffaloes and oxen dead of cold in places.'
      n: '*Chỉ thị của Ban Bí thư số 36-CT/TW về việc đẩy mạnh sản xuất đông - xuân và thu mua lương thực*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXII, 628–32. Made public: 2002.'
      tags:
      - polity:drv
