      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Zone V Executive Committee: resolution no. 62 on proselytizing among the enemy''s troops. "U.S.-Diệm" plan to raise the regular army from 150,000 to 300,000, lengthen service, call up reserves, put the Civil Guard under Defense, form commando units, and draw the Self-Defense Corps and the youth into their forces.'
      n: '*Nghị quyết của Khu uỷ V số 62 về công tác binh vận*. [[w.van-kien-dang-toan]], XXII, 731–53. Made public: 2002. Names: Ngô Đình Diệm.'
