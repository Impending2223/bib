      when: Jan. 13
      date: '1961-01-13'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: circular no. 14-TT/TW. All the army''s farms handed to the Ministry of State Farms, by the Center''s decision, for the army''s building and the farms'' management; their Party organizations to the local Party committees.'
      n: '*Thông tri của Ban Bí thư số 14-TT/TW về việc chuyển giao các đảng bộ nông trường quân đội về cho các cấp uỷ Đảng địa phương trực tiếp phụ trách*, signed for the Secretariat by Nguyễn Khai, head of its office. [[w.van-kien-dang-toan]], XXII, 125–26. Made public: 2002.'
      tags:
      - polity:drv
