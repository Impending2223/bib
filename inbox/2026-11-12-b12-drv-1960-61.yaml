      when: Mar. 10
      date: '1961-03-10'
      thread: vietnam-hanoi
      c: 'The Secretariat, Hanoi: directive no. 15-CT/TW on forestry, after its directive of March 1959: still slighted by the Party committees; to be developed fast for industrialization and the people''s needs.'
      n: '*Chỉ thị của Ban Bí thư số 15-CT/TW về việc tăng cường lãnh đạo công tác lâm nghiệp*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 248–53. Made public: 2002.'
      tags:
      - polity:drv
