patch: 2026-11-12-b9-dallek-b
by: 'Claude (batch 9 reader, Dallek, Flawed Giant, pp. 413–599: the ''already in'' rows)'
ops:
- add:
    entry:
      id: cal.1967-06.middle-east-six-day-war
      when: June, early
      date: 1967-06
      thread: middle-east-six-day-war
      c: 'Johnson to Roche, in a take-off on Eban, "a little miniature Winston Churchill": "They''re going to hit. There''s
        nothing we can do about it." By Roche''s account.'
      n: '[[w.dallek-flawed-giant]], 427 ("at the beginning of June"). Check: the day. To check: NSC Histories, "Mid-East
        Crisis: Summary" and "The President in the Middle East Crisis, May 12–June 19, 1967," NSF; Rostow to LBJ, May 31,
        1967, Diary Backup; John P. Roche oral history (cited by [[w.dallek-flawed-giant]], 427 n.111). Names: Johnson, Roche,
        Eban.'
      tags:
      - name:johnson-lyndon-b
      - name:roche-john-p
      - name:eban-abba-s
- add:
    entry:
      id: cal.1967-09-15.vietnam-pennsylvania
      when: Sept. 15
      date: '1967-09-15'
      thread: vietnam-pennsylvania
      also:
      - labor
      c: 'Luncheon with the AFL-CIO Executive Council. Johnson: "We are offering to negotiate with Ho Chi Minh. Our position
        is clear. We will stop the bombing if he will launch productive and meaningful discussions. We are not asking, as
        most people think, that stopping the infiltration is a condition of a bombing pause."'
      n: '[[w.dallek-flawed-giant]], 481 (the luncheon "with U.S. labor leaders," two days after Sept. 13). To check: LBJ
        meeting with AFL-CIO Executive Council, Sept. 15, 1967, NSF: Meeting Notes File (cited by [[w.dallek-flawed-giant]],
        481 n.105). Names: Johnson, Ho.'
      tags:
      - name:johnson-lyndon-b
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1967-09-26.vietnam-support
      when: Sept. 26
      date: '1967-09-26'
      thread: vietnam-support
      c: 'Johnson to college and university educators: "The problem is not one of communication. The problem is that Ho wants
        South Vietnam. He isn''t going to give it up. He doesn''t want to talk about it."'
      n: '[[w.dallek-flawed-giant]], 481 (the same day as the meeting with McNamara and others). To check: LBJ meeting with
        educators, Sept. 26, 1967, Tom Johnson Papers (cited by [[w.dallek-flawed-giant]], 481 n.107). Names: Johnson, Ho.'
      tags:
      - name:johnson-lyndon-b
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1967-10-02.vietnam-3
      when: Oct. 2
      date: '1967-10-02'
      thread: vietnam
      c: 'Johnson to Clifford, Acheson and other "wise men," by Dallek: a bombing halt would show "frustration & failure"
        and encourage North Vietnam.'
      n: '[[w.dallek-flawed-giant]], 482. Check: who was present; Dallek''s note gives a meeting with Col. Robin Olds and
        Clifford''s notes of Oct. 2. To check: LBJ meeting with Col. Robin Olds, Oct. 2, 1967, Tom Johnson Papers; Clifford
        Notes on meeting with LBJ, Oct. 2, 1967, Clifford Papers (cited by [[w.dallek-flawed-giant]], 482 n.109). Names: Johnson,
        Clifford, Acheson.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:acheson-dean-g
- add:
    entry:
      id: cal.1967-10-25.vietnam-support-2
      when: Oct. 25
      date: '1967-10-25'
      thread: vietnam-support
      c: 'Rostow to McNamara, Rusk and Helms: "the President has an urgent need for reliable, usable data on Vietnam and ways
        of measuring the evolution of the conflict." A special interagency task force to be set up at once, reporting on that
        basis from Jan. 1, 1968.'
      n: '[[w.dallek-flawed-giant]], 492. To check: Rostow to McNamara et al., Oct. 25, 1967, NSF: Country: Vietnam (cited
        by [[w.dallek-flawed-giant]], 492 n.144). Names: Rostow, McNamara, Rusk, Helms.'
      tags:
      - name:rostow-walt-w
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:helms-richard
- add:
    entry:
      id: cal.1967-10-28.vietnam-diplomacy
      when: Oct. 28
      date: '1967-10-28'
      thread: vietnam-diplomacy
      c: 'Rostow to Johnson: an NLF contact describes three possible negotiations, on the political settlement within South
        Vietnam, on U.S.–Hanoi relations, and between North and South. Rostow: "the first piece of paper we have received
        from the other side which goes directly to the heart of the matter which is political settlement in South Vietnam."'
      n: '[[w.dallek-flawed-giant]], 484. To check: Rostow to LBJ, Oct. 28, 1967, NSF: Memos to the Pres. (cited by [[w.dallek-flawed-giant]],
        484 n.118). Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-11-01.vietnam-support
      when: Nov. 1
      date: '1967-11-01'
      thread: vietnam-support
      c: 'Johnson to Rostow: "I can''t clean up all the mess the New York Times leaves behind while these old pros and intellectuals
        [at Radio Free Europe] sit silent."'
      n: '[[w.dallek-flawed-giant]], 492. To check: LBJ to Rostow, Nov. 1, 1967, Handwriting File (cited by [[w.dallek-flawed-giant]],
        492 n.142). Names: Johnson, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-11-02.vietnam-5
      when: Nov. 2
      date: '1967-11-02'
      thread: vietnam
      c: 'Ball, leaving the Cabinet Room after the Wise Men, to Acheson, McCloy and John Cowles of the Minneapolis Tribune:
        "You''re like a flock of old buzzards sitting on a fence, sending the young men off to be killed. You ought to be
        ashamed of yourselves."'
      n: '[[w.dallek-flawed-giant]], 496. Check: the day, from the meeting of the Wise Men. To check: Ball, *The Past Has
        Another Pattern*, 407 (cited by [[w.dallek-flawed-giant]], 496 n.6). Names: Ball, Acheson, McCloy.'
      tags:
      - name:ball-george-w
      - name:acheson-dean-g
      - name:mccloy-john-j
- add:
    entry:
      id: cal.1968-01-31.vietnam-tet-8
      when: Jan. 31
      date: '1968-01-31'
      thread: vietnam-tet
      c: 'Johnson to Westmoreland and Bunker: daily press briefings to "convey to the American public your confidence in our
        capability to blunt these enemy moves, and to reassure the public here that you have the situation under control."'
      n: '[[w.dallek-flawed-giant]], 505. To check: Schandler, *The Unmaking of a President*, 83–84 (cited by [[w.dallek-flawed-giant]],
        505 n.35). Names: Johnson, Westmoreland, Bunker.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:bunker-ellsworth
- add:
    entry:
      id: cal.1968-03-14.vietnam-205000-3
      when: Mar. 14
      date: '1968-03-14'
      thread: vietnam-205000
      c: 'Johnson to Clifford: he believes in consultation but fears bringing too many people into the discussion lest Hanoi
        learn of his "new policy"; the head of the group studying Acheson''s idea not to reveal that he is "doing a Vietnam
        review job."'
      n: '[[w.dallek-flawed-giant]], 511.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:acheson-dean-g
- add:
    entry:
      id: cal.1968-03-20.vietnam-205000-6
      when: Mar. 20
      date: '1968-03-20'
      thread: vietnam-205000
      c: 'Johnson to his closest White House advisers: "I want war like I want polio. What you want and what your image is
        are two different things." The speech to "meet emergency needs in strength" and make "a reasonable offer on peace."'
      n: '[[w.dallek-flawed-giant]], 512. Check: who was present and the hour. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-07-19.vietnam-3
      when: July 19–20
      date: '1968-07-19'
      thread: vietnam
      c: 'Honolulu. Clifford, privately to Johnson, Rusk and Rostow: "we could not win the war"; "absolutely certain" the
        South Vietnamese do not want it to end, with over 500,000 American troops and a "golden flow of money"; Johnson to
        tell them "we were going to make an all-out effort to settle the war in the next six months." Johnson, by Clifford,
        "impressed," raises all three points with Thiệu.'
      n: '[[w.dallek-flawed-giant]], 566. Check: the day; Dallek has the conference July 18–20. To check: Clifford, *Counsel
        to the President*, 551–53; Notes for U.S. Briefing on Honolulu meetings, July 19, 1968, NSF: Rostow Files (cited by
        [[w.dallek-flawed-giant]], 566 n.47). Names: Clifford, Johnson, Rusk, Rostow, Thiệu.'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:rostow-walt-w
      - name:nguyen-van-thieu
- add:
    entry:
      id: cal.1968-08-14.health
      when: Aug. 14
      date: '1968-08-14'
      thread: health
      c: 'Johnson to the National Medical Association, a group of black physicians: "every boy and girl born into this land
        has a chance to start life with good health"; "Medicare is a triumph of rightness. Now we must seek new ways to improve
        and to expand medical care."'
      n: '[[w.dallek-flawed-giant]], 552. To check: Remarks to the National Medical Association, Aug. 14, 1968, 1968–69 Pub.
        Papers (cited by [[w.dallek-flawed-giant]], 552 n.8, 882–89). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-09-09.cities-and-housing
      when: Sept. 9
      date: '1968-09-09'
      thread: cities-and-housing
      c: 'The National Housing Partnership created, Edgar F. Kaiser to head it: government and private industry to build 600,000
        housing units for low- and middle-income families.'
      n: '[[w.dallek-flawed-giant]], 553. To check: 1968–69 Pub. Papers, II (cited by [[w.dallek-flawed-giant]], 553 n.10).
        Names: Kaiser, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:kaiser-edgar-f
- add:
    entry:
      id: cal.1968-10-01.court-2
      when: Oct. 1
      date: '1968-10-01'
      thread: court
      c: 'Johnson, privately to a journalist: if he had another four-year term, "the Fortas appointment would have been different."'
      n: '[[w.dallek-flawed-giant]], 564. To check: LBJ meeting with David Wise, Oct. 1, 1968, WHCF: Aides: Christian (cited
        by [[w.dallek-flawed-giant]], 564 n.41). Names: Johnson, Fortas.'
      tags:
      - name:johnson-lyndon-b
      - name:fortas-abe
- add:
    entry:
      id: cal.1968-11-19.vietnam-paris
      when: Nov. 19
      date: '1968-11-19'
      thread: vietnam-paris
      c: 'Johnson to Rusk and others: Thiệu "intransigent"; he is "dealing with a more friendly President now than he would
        be in the future."'
      n: '[[w.dallek-flawed-giant]], 597. Check: whether the second words were said to Thiệu or of him. To check: LBJ meeting
        with Rusk et al., Nov. 19, 1968, NSF: Meeting Notes (cited by [[w.dallek-flawed-giant]], 597 n.133). Names: Johnson,
        Rusk, Thiệu.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:nguyen-van-thieu
- add:
    entry:
      id: cal.1968-11-20.vietnam-paris
      when: Nov. 20
      date: '1968-11-20'
      thread: vietnam-paris
      c: 'Clifford, the day after: "we are getting a run-around in Saigon. . . . We cannot agree to what they are insisting
        on. We have a perfect right to go on with the talks."'
      n: '[[w.dallek-flawed-giant]], 597. To check: LBJ meeting with foreign policy advisers, Nov. 20, 1968, Tom Johnson Papers
        (cited by [[w.dallek-flawed-giant]], 597 n.133). See [[cal.1968-11-19.vietnam-paris]]. Names: Clifford.'
      tags:
      - name:clifford-clark
- add:
    entry:
      id: cal.1968-12-08.vietnam-paris
      when: Dec. 8
      date: '1968-12-08'
      thread: vietnam-paris
      c: Saigon's representatives reach Paris, Thiệu having delayed them; they argue procedural questions, which delay the
        start of substantive talks until Nixon takes office.
      n: '[[w.dallek-flawed-giant]], 597. Check: the day of arrival. Names: Thiệu.'
      tags:
      - name:nguyen-van-thieu
- add:
    entry:
      id: cal.1968-12-09.soviet-union
      when: Dec. 9
      date: '1968-12-09'
      thread: soviet-union
      c: 'Johnson to the Moscow embassy by back channel: "the whole government" in favor of missile talks; failing to meet
        could mean a loss of "time, momentum, and unity" toward an arms control agreement.'
      n: '[[w.dallek-flawed-giant]], 596. To check: Message to Amb. Thompson, Dec. 9, 1968, NSF: Rostow Files (cited by [[w.dallek-flawed-giant]],
        596 n.128). Names: Johnson, Thompson.'
      tags:
      - name:johnson-lyndon-b
      - name:thompson-llewellyn-e
- add:
    entry:
      id: cal.1968-12-11.soviet-union
      when: Dec. 11
      date: '1968-12-11'
      thread: soviet-union
      c: 'Thompson reports Dobrynin''s observation that if Johnson decided not to go ahead with the meeting that would be
        understood in Moscow; Johnson on the message: "I''m ready—are they?" Rostow, that day: "every normal argument is for
        leaving it to Nixon. And that may be the correct course. But it may also be a decision we shall regret more than any
        other"; Johnson on his memo: "I agree."'
      n: '[[w.dallek-flawed-giant]], 596. See [[cal.1968-12-09.soviet-union]]. To check: Rostow to LBJ, Dec. 11, 1968, memos
        at 9:55 a.m. and 1:35 p.m., NSF: Rostow Files (cited by [[w.dallek-flawed-giant]], 596 n.128). Names: Thompson, Dobrynin,
        Johnson, Rostow.'
      tags:
      - name:thompson-llewellyn-e
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1969-01-07.vietnam-paris-2
      when: Jan. 7
      date: '1969-01-07'
      thread: vietnam-paris
      c: 'Johnson to Thiệu, by cable to Saigon and Paris: "the dangerous implications that I see developing from the situation
        in Paris. . . . A continued stalemate on present lines can only have most serious effects on basic American public
        support for our whole effort to assist your country to preserve its independence."'
      n: '[[w.dallek-flawed-giant]], 597. To check: Cable to Saigon and Paris, Jan. 7, 1969, DSDUF (cited by [[w.dallek-flawed-giant]],
        597 n.133). Names: Johnson, Thiệu.'
      tags:
      - name:johnson-lyndon-b
      - name:nguyen-van-thieu
