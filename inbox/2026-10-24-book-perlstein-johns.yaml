- add:
    entry:
      id: cal.1963-01-14.goldwater
      when: Jan. 14
      date: '1963-01-14'
      thread: goldwater
      also:
      - elections-1964
      c: 'White sees Goldwater in his office, by White''s and Rusher''s accounts: "Clif, I''m not a candidate. And I''m not going to be." To a draft: "Draft, nothin''! ... It''s my political neck and I intend to have something to say about what happens to it."'
      n: '[[w.perlstein-before-the-storm]], 189–90. To check: [[w.white-suite-3505]]; [[w.rusher-rise-of-the-right]]. See [[cal.1961-10-08.goldwater]]. Names: White, Rusher, Goldwater.'
      tags:
      - name:white-f-clifton
      - name:rusher-william-a
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1963-02-05.goldwater
      when: Feb. 5
      date: '1963-02-05'
      thread: goldwater
      also:
      - elections-1964
      c: 'White, with Barr, at Goldwater''s office again; Goldwater cuts him short. Barr: "We''re free to draft a candidate if we choose and there isn''t much you or anyone else can do about it."'
      n: '[[w.perlstein-before-the-storm]], 190–91. To check: [[w.white-suite-3505]]. See [[cal.1961-10-08.goldwater]]. Names: White, Goldwater.'
