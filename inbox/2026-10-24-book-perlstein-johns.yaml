- add:
    entry:
      id: cal.1966-01-25.vietnam
      when: Jan. 25
      date: '1966-01-25'
      thread: vietnam
      also:
      - congress
      c: 'The Cabinet Room, 5:30–7:40 p.m. Johnson, Rusk and McNamara with the bipartisan leadership and the ranking members of Appropriations, Armed Services and Foreign Affairs, on resuming the bombing. Ford: "If your advisers say bombing is necessary—I''m for it." Mansfield: continue the lull. Dirksen: "If we are not winning now, let''s do what is necessary to win." Hickenlooper: "Either get out or lick them."'
      n: '[FRUS 1964–68, IV, doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v04/d43) (Valenti''s notes). [[w.johns-vietnams-second-front]], 105. See [[cal.1965-12-24.vietnam]]. Made public: FRUS 1964–68, IV (1998). Names: Johnson, Rusk, McNamara, Ford, Mansfield, Dirksen, Hickenlooper.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:ford-gerald-r
      - name:mansfield-mike
      - name:dirksen-everett
      - name:hickenlooper-bourke-b
- add:
    entry:
      id: cal.1966-03-13.vietnam
      when: Mar. 13
      date: '1966-03-13'
      thread: vietnam
      c: 'Johnson has Nixon to the White House on the war, by Nixon''s account: Nixon for stronger action to bring Hanoi to the table; his criticism in the campaign not "directed personally at you." Check the date.'
      n: '[[w.johns-vietnams-second-front]], 220. To check: [[w.nixon-rn]]. Names: Johnson, Nixon.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1966-08-09.vietnam
      when: Aug. 9
      date: '1966-08-09'
      thread: vietnam
      also:
      - elections-1966
      c: 'The Republican National Committee''s paper on the war and the administration''s word: "a steady diet of rosy predictions and misleading statements"; the people "never know what they don''t know."'
      n: '[[w.johns-vietnams-second-front]], 114. To check: the report, Aug. 9, 1966 (Johns: box 198, May Papers).'
- add:
    entry:
      id: cal.1966-08-23.elections-1966
      when: Aug. 23
      date: '1966-08-23'
      thread: elections-1966
      also:
      - vietnam
      c: Nixon, after a meeting with Republican Senators that Morton arranged, for an all-Asian peace conference, China and North Vietnam in it; the war to go on meanwhile; the European allies to join an embargo on North Vietnam.
      n: '[[w.johns-vietnams-second-front]], 114–15. To check: [[w.gibbons-u-s-government-and]]. Names: Nixon, Morton.'
      tags:
      - name:nixon-richard-m
      - name:morton-thruston-b
