      c: 'Chicago. Half a dozen of White''s leaders, Goldwater refusing to run. Hughes, Indiana''s treasurer: "Let''s draft the son of a bitch." A front man: Dominick first, O''Donnell the alternate. Check the date: after Feb. 5.'
      n: '[[w.perlstein-before-the-storm]], 191. To check: [[w.white-suite-3505]]. See [[cal.1961-10-08.goldwater]]. Names: Goldwater, Dominick, O''Donnell.'
