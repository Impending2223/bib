      id: cal.1966-08-25.elections-1966
      when: Aug. 25
      date: '1966-08-25'
      thread: elections-1966
      also:
      - vietnam
      c: 'The Republican congressional leadership''s release: "encouragement and endorsement of the proposal of an all-Asian Peace Conference," Percy''s; the Republicans "the party of peace." Dirksen doubtful.'
      n: '[[w.johns-vietnams-second-front]], 121. To check: the release, Aug. 25, 1966 (Johns: Republican Congressional Leadership File, folder 69, Dirksen Papers). See [[cal.1966-08-23.elections-1966]]. Names: Percy, Dirksen.'
      tags:
      - name:percy-charles-h
      - name:dirksen-everett
- add:
    entry:
      id: cal.1967-05-01.vietnam
      when: May 1
      date: '1967-05-01'
      thread: vietnam
      also:
      - congress
      c: 'The Senate Republican Policy Committee''s staff paper, "The War in Vietnam," made public: American policy in Indochina since 1945, no alternative offered; what the American interest in Southeast Asia is, and how much further the party and the nation will go for it. Prepared after the committee''s meeting of late March, at Javits''s suggestion. The leadership shelves it.'
      n: '[[w.johns-vietnams-second-front]], 150. To check: [[w.gibbons-u-s-government-and]]. Names: Javits.'
      tags:
      - name:javits-jacob-k
- add:
    entry:
      id: cal.1967-05-02.vietnam
      when: May 2
      date: '1967-05-02'
      thread: vietnam
      also:
      - congress
      c: 'Tower on the Policy Committee''s paper: "neither party policy nor a Senate Republican party position. It was simply a ''think piece.''" Reagan, at a press conference: "our goal should be to win."'
      n: '[[w.johns-vietnams-second-front]], 150–51. See [[cal.1967-05-01.vietnam]]. Names: Tower, Reagan.'
      tags:
      - name:tower-john-g
      - name:reagan-ronald
- add:
    entry:
      id: cal.1967-07-10.vietnam
      when: July 10
      date: '1967-07-10'
      thread: vietnam
      also:
      - congress
      c: 'Bradford Morse and Stafford, with other House Republicans, propose a staged de-escalation, "GRID": no bombing north of the 21st parallel, Hanoi in, Haiphong out, for sixty days; north of the 20th if Hanoi answers in kind; and so on, step for step. Check the date: the press release cited for it is of July 17.'
      n: '[[w.johns-vietnams-second-front]], 157. Names: Bradford Morse, Stafford.'
      tags:
      - name:morse-bradford
      - name:stafford-robert-t
- add:
    entry:
      id: cal.1965-01-26.vietnam
      when: Jan. 26
      date: '1965-01-26'
      thread: vietnam
      c: 'Nixon to the Sales Executive Club of New York: "We will be thrown out in a matter of months—certainly within the year" unless the strategy changes; sea and air power against the routes south and the bases in Laos and North Vietnam. Neutrality: "we get out; they stay in; they take over."'
      n: '[[w.johns-vietnams-second-front]], 82. To check: the speech, Nixon Pre-Presidential Papers, Speech File, box 83/2 (NARA, Laguna Niguel). Names: Nixon.'
      tags:
      - name:nixon-richard-m
