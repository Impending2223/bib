- add:
    entry:
      id: cal.1962-04-13.goldwater
      when: Apr. 13
      date: '1962-04-13'
      thread: goldwater
      also:
      - elections-1964
      c: 'Minnesota, a 3M fishing camp. White''s group, its third meeting: regional directors named and given each State''s rules for choosing delegates; $5,000 a month to keep White on the road; a chairman, a women''s chairman and a finance chairman in every State by December.'
