- add:
    entry:
      id: cal.1960-11-07.elections-1960-nixon
      when: Nov. 7
      date: '1960-11-07'
      time: 1960-11-08T03:30Z
      time_approx: true
      time_zone: America/Chicago
      place: chicago
      thread: elections-1960-nixon
      follows:
      - cal.1960-11-07.elections-1960-6
      c: 'Chicago. The election-eve telecast, on the air at 9:30 p.m. Central: Eisenhower speaks first from Washington, then Lodge from Boston, then Nixon, who asks all to vote with
        "America first" in mind. Over at ten; Nixon leaves for Los Angeles.'
      n: '[[w.nixon-six-crises]], 373–74 (by Nixon''s account: "scheduled to go on the air at 9:30 Central Time"; Eisenhower from Washington, then Lodge from Boston; Nixon''s closing;
        "The program was over at ten and we left immediately for the airport"). The hour: 9:30 p.m. Central, the schedule (373). The order: after [[cal.1960-11-07.elections-1960-6]],
        Nixon at the studio before the broadcast (373). See [[cal.1960-11-07.elections-1960]], which holds the day''s bibliography. Names: Nixon, Eisenhower, Lodge.'
      tags:
      - name:nixon-richard-m
      - name:eisenhower-dwight-d
      - name:lodge-henry-cabot
      - city:chicago
