- check:
    id: cal.1960-11-05.elections-1960-kennedy
    text: 'Check: the hour and the stops; Goodwin has the motorcade lost "the whole afternoon" in the Bronx, O''Donnell telling him so at the Biltmore near 6 p.m. ([[w.goodwin-remembering-america]],
      127–28); [[w.communications-freedom-of-communications-part]], 899–905, has the Bronx stops before the Queens luncheon and a Queens rally at "2:15 in the afternoon" (904), and O''Donnell
      has the day''s tour of Manhattan, the Bronx and Queens in the rain, then the Biltmore ([[w.odonnell-johnny-we-hardly-knew]], 246). No order is set.'
- edit:
    id: cal.1960-11-05.elections-1960-2
    base: 5d0d6745
    set:
      n: '[[w.white-making-of-the-president]], 329 (heard by White); [[w.communications-freedom-of-communications-part]], 908–09 (outside the Coliseum, New York, Nov. 5, in rain, with
        Johnson, Mrs. Johnson and their daughters: the circus elephants, "Dick grabbed that tail in 1952 and 1956"; "Dick Nixon stands where McKinley stood and Taft," Harding, Coolidge,
        Landon, Dewey; "I understand that Tom Dewey has just joined Dick Nixon out on the coast"; Waterbury "at 1 in the morning" to come; not midnight, the street corner, "Nixon Day"
        or Stevenson''s suggestion). The words White quotes at "midnight" (329), the elephants and "Dick grabbed that tail in 1952," are those of the remarks outside the Coliseum ([[w.communications-freedom-of-communications-part]],
        908–09), not of the 90th Street rally (906–07). White has Kennedy at the Bridgeport airport "at 12:30 in the morning" ([[w.white-making-of-the-president]], 338), so "midnight"
        is loose and the range may end too late. See [[cal.1960-10-31.elections-1960]]. Names: Kennedy, Stevenson, Nixon. Check: the place; APP gives ten of his remarks in New York that
        day.'
