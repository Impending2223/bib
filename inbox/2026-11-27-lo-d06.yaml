      - 1960-11-08T03:00Z
      time_band: evening
      time_zone: America/New_York
      c: 'Boston, the Boston Garden. Kennedy with Pat Lynch, McCormack, Joe Ward and the State ticket, and his sisters Patricia Lawford and Eunice Shriver and Jean Kennedy: "I am delighted
        to be back home in Boston"; he asks help "tonight." Not a committee, not a protege: "a Democratic candidate."'
      n: 'Speech of Senator John F. Kennedy, Boston Garden, Boston, MA, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-boston-garden-boston-ma) (Nov. 7,
        1960). [[w.communications-freedom-of-communications-part]], 950–53; [[w.white-making-of-the-president]], 342–43 (the Garden "late on the eve of election," the procession behind
        schedule for Faneuil Hall at eleven); [[w.obrien-no-final-victories]], 94 (the drive from the airport through the crowd; "the night before the election"). The hour: "tonight"
        ([[w.communications-freedom-of-communications-part]], 950); the Garden before Faneuil Hall at eleven (White 343). The order: after [[cal.1960-11-07.elections-1960-kennedy-9]],
        the printed order alone ([[w.communications-freedom-of-communications-part]], 941–50); before [[cal.1960-11-07.elections-1960-kennedy-7]], White, 343. See [[cal.1960-11-07.elections-1960-5]],
        which holds the day''s bibliography. Names: Kennedy, McCormack, Shriver.'
      tags:
      - name:kennedy-john-f
      - name:mccormack-john-w
      - name:shriver-eunice-kennedy
      - state:ma
      - city:boston
