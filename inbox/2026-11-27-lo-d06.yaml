      c: Peking, the central work conference. Mao tells Chen Yun he endorses Chen's proposal to import grain, and asks Zhou Enlai and Chen to handle the details.
      n: '[[w.jian-zhou-enlai]], 457 (by Jian''s account: "at a central work conference on December 30"; Zhou, at the airport, learns of Mao''s decision). To check: [[w.chen-yun-nianpu-1905]],
        III, 55 (cited by [[w.jian-zhou-enlai]], 457 n.66a). See [[cal.1960-12-30.china-leadership-2]]. Names: Mao Zedong, Chen Yun, Zhou Enlai.'
      tags:
      - name:mao-zedong
      - name:chen-yun
      - name:zhou-enlai
- add:
    entry:
      id: cal.1961-01-09.transition-and-staff-2
      when: Jan. 9
      date: '1961-01-09'
      time: 1961-01-09T19:20Z
      time_approx: true
      time_zone: America/New_York
      place: massachusetts
      thread: transition-and-staff
      c: Cambridge, Schlesinger's house. Bundy settles his post as Special Assistant for National Security Affairs; Chayes takes the Legal Adviser's; Wiesner on science adviser; the
        tax task force reports. Seaborg offered the AEC by telephone. Schlesinger to the White House, unannounced till Bowles is confirmed. Kennedy is at the house from about 2:20 to
        shortly after 5, about 300 people in the cold outside; after Schlesinger, 2:30 to 3:30, Surrey's tax task force, Chayes, Bundy, Stratton and Wiesner see him.
      n: '[[w.schlesinger-journals]], 102 (109 Irving Street, "in the afternoon": JFK''s "arrival at about 2:20 and his departure shortly after 5," about 300 people; with Schlesinger
        "from about 2:30 to 3:30," then the tax task force under Surrey, Chayes, Bundy, Stratton and Wiesner; Bundy''s idea of Seaborg for the AEC, telephoned from the house); [[w.odonnell-johnny-we-hardly-knew]],
        274–75 (the meeting with Bundy and Wiesner and Schlesinger''s signing, "We''ll keep your appointment quiet until after the Senate confirms Chester Bowles"). The hour: arrival
        "about 2:20" (102). See [[cal.1961-01-09.transition-and-staff]], which holds the day''s bibliography. Names: Kennedy, Bundy, Chayes, Wiesner, Seaborg, Schlesinger, Bowles, Surrey.'
      tags:
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:chayes-abram
      - name:wiesner-jerome-b
      - name:seaborg-glenn-t
      - name:schlesinger-arthur-m-jr
      - name:bowles-chester
      - name:surrey-stanley-s
      - name:sorensen-theodore-c
