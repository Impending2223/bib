- edit:
    id: cal.1960-11-07.elections-1960
    base: 5efd2398
    set:
      c: 'Election eve.{1} Nixon''s four-hour telethon on ABC, from Detroit.{2} A quarter hour with Dewey.{3} Asked of the sit-ins: their objective he supports; their methods a legal
        question, better met by the Attorney General''s talks with the owners.{5}'
      n: 'Remarks of Vice President Richard M. Nixon, National Telethon, ABC Network, Southfield, MI, [APP](https://www.presidency.ucsb.edu/documents/remarks-vice-president-richard-m-nixon-national-telethon-abc-network-southfield-mi)
        (Nov. 7, 1960); Radio and Television Remarks on Election Eve, [1960–61 Pub. Papers 852](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=904) (Nov.
        7, 1960). [[w.kallina-kennedy-v-nixon]], 165; [[w.nixon-rn]], 221–22 (the one telethon, the day before the election; the telecast with Eisenhower and Lodge); [[w.white-making-of-the-president]],
        311–13 (the telethon from Detroit, the costs as estimated; Dewey at 6:30; the half-hour of the three at eleven). [[w.nixon-six-crises]], 371–74 (the telethon from WXYZ-TV, Detroit,
        four hours, Lodge from Boston; the election-eve telecast from Chicago, Eisenhower from Washington, Lodge from Boston). [[w.gifford-center-cannot-hold]], 161 (the sit-ins). The
        hours: the telethon, "a four-hour afternoon" show, ended "At six, Eastern Time" ([[w.nixon-six-crises]], 372). Split under R25b: the Chicago telecast is [[cal.1960-11-07.elections-1960-nixon]];
        the scene at the studio, [[cal.1960-11-07.elections-1960-6]], comes between. To check: *Washington Post*, Nov. 8, 1960 (cited by [[w.kallina-kennedy-v-nixon]], 165 n.22); The
        Speeches of Vice President Richard M. Nixon, Presidential Campaign of 1960 (1961), 1193, U.S. Government Printing Office, printed (cited by [[w.gifford-center-cannot-hold]],
        161 n.66). See [[cal.1960-08-17.elections-1960-2]]. Names: Nixon, Dewey, Eisenhower, Lodge. Check: whether the President''s remarks are his part of the half hour with Nixon and
        Lodge.'
      time_range:
      - 1960-11-07T19:00Z
      - 1960-11-07T23:00Z
      time_zone: America/New_York
      src:
        c: 8d9e3545
        rows:
        - 'https://www.presidency.ucsb.edu/documents/remarks-vice-president-richard-m-nixon-national-telethon-abc-network-southfield-mi: 2, 5'
        - 'https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=904: 3'
        - 'w.kallina-kennedy-v-nixon 165: 1, 2, 3'
