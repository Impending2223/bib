      c: 'Manchester, N.H., a television program. Kennedy with Gov. Hodges of North Carolina; his three sisters read him the questions: "I thought tonight I might try to answer eight
        or nine of the leading" questions.'
      n: 'Television Program of Senator John F. Kennedy, Manchester, NH, [APP](https://www.presidency.ucsb.edu/documents/television-program-senator-john-f-kennedy-manchester-nh) (Nov.
        7, 1960). [[w.communications-freedom-of-communications-part]], 941–50 (Hodges thanked "for being with us tonight in New Hampshire," 941; "I thought tonight I might try to answer
        eight or nine"; his three sisters "with me tonight" to read the questions, 942). The hour: "tonight" (941). The order: after [[cal.1960-11-07.elections-1960-5]], the printed
        order alone ([[w.communications-freedom-of-communications-part]], 938–41). See [[cal.1960-11-07.elections-1960-5]], which holds the day''s bibliography. Names: Kennedy, Hodges,
        Shriver.'
