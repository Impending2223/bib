- cite:
    id: 'cal.1968-10-20.vietnam-paris'
    item: '[[w.van-kien-dang-toan]], XXIX, 960–63 (the Politburo''s secret cable to COSVN, Oct. 20, signed "Trinh": the Front''s role and Saigon''s change of policy no longer conditions, to be fought for at the conference; a preparatory four-party meeting, if need be some 7 to 10 days after the halt, perhaps before the American election, 960–61; the Front''s statement of Oct. 21 and its statements after the halt drafted in the North; foreign affairs done in the North, 962–63; the copy''s folios; not Thọ''s report or the delegation''s seeming in no hurry)'
    units: 'A, B'
