- add:
    entry:
      id: cal.1968-02-10.vietnam-hanoi
      when: Feb. 10
      date: '1968-02-10'
      thread: vietnam-hanoi
      also:
      - vietnam-tet
      c: 'The Politburo''s secret cable to COSVN, Region V and the Trị–Thiên committee: the Saigon armed forces'' letter of resolve to Hồ Chí Minh not to be published, the enemy could twist it; it will be given him and kept. The armed forces in the South not to declare in public their obedience to the Party and to Hồ; the Front''s role to be put forward, the Party''s leadership spoken of only within.'
      n: '*Điện mật của Bộ Chính trị, ngày 10 tháng 2 năm 1968*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIX, 173. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1968-02-21.vietnam-hanoi
      when: Feb. 21
      date: '1968-02-21'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 157-CT/TW on the April elections of people''s councils and administrative committees of the autonomous zones, provinces and centrally run cities: to strengthen them for the decentralization of economic management. Over half the councilors from those directly producing and fighting, 40 to 45 percent kept from the old councils; several members of each committee''s standing committee on the administrative committee; two women on each. Results to be reported to the Center.'
      n: '*Chỉ thị của Ban Bí thư số 157-CT/TW, ngày 21 tháng 2 năm 1968, Về việc lãnh đạo bầu cử Hội đồng nhân dân và Uỷ ban hành chính các cấp khu tự trị, tỉnh, thành phố trực thuộc Trung ương*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 174–79. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-02-26.vietnam-hanoi
      when: Feb. 26
      date: '1968-02-26'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 212-TT/TW on economic and financial management and the protection of state property: embezzlement and theft of state property growing, offenders shielded. Directive no. 150 and the Government''s resolution no. 59 of May 10, 1967 to be carried out in full; inspections, discipline and prosecution; Party committees to report to the Center.'
      n: '*Thông tri của Ban Bí thư số 212-TT/TW, ngày 26 tháng 2 năm 1968, Về việc tăng cường chỉ đạo công tác quản lý kinh tế - tài chính, bảo vệ tài sản của Nhà nước trong tình hình hiện nay*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 180–82. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-02-29.vietnam-hanoi
      when: Feb. 29
      date: '1968-02-29'
      thread: vietnam-hanoi
      c: 'The Secretariat and the Standing Committee of the Council of Ministers on the decentralization of economic management to the provinces and centrally run cities: to go on steadily, as the Council''s resolution and the joint meetings of August and September 1967 laid down. The Economic Management Reform Group to follow it for the Council, study the central apparatus, and pass its plan for industrial enterprises to the Industry Board for the Politburo.'
      n: '*Thông báo số 05-TB/TW, ngày 15 tháng 3 năm 1968, Về Hội nghị Ban Bí thư và Thường vụ HĐCP bàn về vấn đề phân cấp quản lý kinh tế* (the meeting of Feb. 29), signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXIX, 192–93. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-03-01.vietnam-hanoi
      when: Mar. 1
      date: '1968-03-01'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo''s resolution no. 175-NQ/TW: a political mobilization of the whole people, "Everything to defeat the American aggressors!" The war over seven years old, the North''s against the bombing nearly three; the chance of victory now real. The North to aid the South with all its strength, defend itself, push farming and industry, and order the people''s life in wartime; Party, army and people to raise their will to fight for a decisive victory on the main battlefield.'
      n: '*Nghị quyết của Bộ Chính trị số 175-NQ/TW, ngày 1 tháng 3 năm 1968, Về động viên chính trị toàn dân để thực hiện thắng lợi nhiệm vụ "Tất cả để đánh thắng giặc Mỹ xâm lược!"*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIX, 183–91. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-03-14.vietnam-hanoi
      when: Mar. 14
      date: '1968-03-14'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Duẩn, Lê Văn Lương, Hoàng Anh, Nguyễn Văn Trân and Xuân Thủy present, on the Youth Union''s work: heroic young men and women in the fighting, the "three readies" movement filling the army and militia; the union 2.3 million strong; but education in politics and the new man shallow, the young kept out of the struggle against embezzlement and bureaucracy, the minorities'' youth neglected. Its tasks for 1968 set.'
      n: '*Thông báo số 09-TB/TW, ngày 10 tháng 5 năm 1968, Về cuộc họp của Ban Bí thư cho ý kiến về công tác Đoàn Thanh niên trong năm 1968* (the meeting of Mar. 14), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXIX, 507–12. Made public: 2004. Names: Lê Duẩn, Lê Văn Lương, Hoàng Anh, Nguyễn Văn Trân, Xuân Thủy.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
      - name:xuan-thuy
- add:
    entry:
      id: cal.1968-03-15.vietnam-hanoi
      when: Mar. 15
      date: '1968-03-15'
      thread: vietnam-hanoi
      c: 'The Secretariat and the Standing Committee of the Council of Ministers on planning: the State Planning Commission, with the ministries and provinces, to draw up the 1969 state plan, the local plans, and the long-range plans, a perspective of some fifteen years after the war and the second five-year plan. The 1969 plan a wartime plan, with some provision for recovery; its control figures to the joint meeting in April, the plan drawn up from below and to the Politburo in November.'
      n: '*Thông báo số 07-TB/TW, ngày 10 tháng 4 năm 1968, Về Hội nghị Ban Bí thư và Thường vụ Hội đồng Chính phủ* (the meeting of Mar. 15), signed by Trần Xuân Bách, chief of the Central Office. [[w.van-kien-dang-toan]], XXIX, 388–91. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-03-18.vietnam-hanoi
      when: Mar. 18
      date: '1968-03-18'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 213-TT/TW on carrying out the Politburo''s resolution on the political mobilization: two reports only at each meeting, on the general situation, from the study paper "Everything to defeat the American aggressors!" and Trường Chinh''s speech to the cadres'' conference, and on the branch''s or locality''s own work. The new period, the spring offensive and uprising, the enemy''s designs; faults to be named, measures set.'
      n: '*Thông tri của Ban Bí thư số 213-TT/TW, ngày 18 tháng 3 năm 1968, Hướng dẫn thi hành Nghị quyết Bộ Chính trị về cuộc động viên chính trị "Tất cả để đánh thắng giặc Mỹ xâm lược"*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXIX, 194–97. Made public: 2004. See [[cal.1968-03-01.vietnam-hanoi]]. Names: Trường Chinh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:truong-chinh
- add:
    entry:
      id: cal.1968-03.vietnam-hanoi
      when: Mar.
      date: '1968-03'
      thread: vietnam-hanoi
      also:
      - vietnam-tet
      - vietnam
      c: 'COSVN''s sixth conference, enlarged, resolution no. 01/NQNT: in a month of the general offensive and uprising about a third of Saigon''s army and a fifth of the American combat strength, a third of its aircraft and vehicles, destroyed or worn down, by its count. The aim, the Saigon government overthrown entirely; to attack without letup, hold on in the cities, spread guerrilla war, build the armed forces, rouse the cities and countryside to rise, spread mutiny in Saigon''s army, use the Alliance, set up revolutionary government wherever the enemy falls.'
      n: '*Nghị quyết hội nghị Trung ương cục (mở rộng) lần thứ sáu, số 01/NQNT, tháng 3 năm 1968* (the appendix). [[w.van-kien-dang-toan]], XXIX, 1275–1314 (the figures, 1276–77). Made public: 2004. See [[cal.1968-02-04.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
- add:
    entry:
      id: cal.1968-04-03.vietnam-hanoi
      when: Apr. 3
      date: '1968-04-03'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Secretariat''s cable to the zone, city, provincial and directly attached Party committees on Johnson''s partial halt of Apr. 1: forced on him by the defeats since Tết, the protests at home and abroad, the quarrels in Washington and with Saigon; meanwhile more troops and money, bombing still from Đò Lèn south. Cadres and people to be told of the victory and warned against complacency and illusions; the armed forces kept ready, shelters kept, evacuation and the political mobilization carried on.'
      n: '*Điện của Ban Bí thư, ngày 3 tháng 4 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 198–200. Made public: 2004. Names: Johnson.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-03.vietnam-hanoi-2
      when: Apr. 3
      date: '1968-04-03'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Politburo''s secret cable to COSVN: Johnson forced into "limited bombing," a step down so as to talk with the North; still bombing from the 17th parallel to the 20th, still adding troops. Both halves of the country to press the diplomatic attack. The North has declared that it will name a representative to contact the American one on the unconditional end of the bombing so that talks can begin; the Front to issue, about a week later, a solemn statement: its resolve, its five-point position for a political settlement, its readiness to talk with the Americans on that basis, the text drafted in the North. COSVN to explain it to Party, army and people against wrong tendencies.'
      n: '*Điện mật của Bộ Chính trị, ngày 3 tháng 4 năm 1968*, signed "Bộ Chính trị." [[w.van-kien-dang-toan]], XXIX, 201–3. Made public: 2004. See [[cal.1968-04-03.vietnam]]. Names: Johnson.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-05.vietnam-hanoi
      when: Apr. 5
      date: '1968-04-05'
      thread: vietnam-hanoi
      c: 'The Secretariat''s secret cable no. 73 amends directive no. 157 on the people''s council elections of zones, cities and provinces: councilors directly producing and fighting 30 to 50 percent, not over half; 45 to 60 percent kept from the old councils, not 40 to 45; some, not many, of the standing committees on the administrative committees, in the key posts; one or two women members, not two; few committee members on the councils.'
      n: '*Điện mật của Ban Bí thư số 73, ngày 5 tháng 4 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 204–5. Made public: 2004. See [[cal.1968-02-21.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-04-08.vietnam-hanoi
      when: Apr. 8
      date: '1968-04-08'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Politburo''s secret cable to COSVN on the diplomatic struggle: Johnson can win neither the war nor, perhaps, the election; his speech of Mar. 31 soft, the "limited bombing" a defeat and a trick, his withdrawal perhaps a ruse. The struggle between the North and the United States in two steps: contacts at ambassadors'' level, at Phnom Penh or Warsaw, on the time, place and level of the talks, kept short; then formal talks at ministers'' level, chiefly on the full end of the bombing. The Front''s statement on a political settlement to be held ready, not issued at once, its readiness to talk with the Americans not in the same statement; the second front, the all-South committee of the Alliance, still to be formed; illusions of peace to be fought.'
      n: '*Điện mật của Bộ Chính trị, ngày 8 tháng 4 năm 1968*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIX, 206–13. Made public: 2004. See [[cal.1968-04-08.vietnam]]. Names: Johnson, Nguyễn Duy Trinh.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
      - name:johnson-lyndon-b
      - name:nguyen-duy-trinh
- add:
    entry:
      id: cal.1968-04-10.vietnam-hanoi
      when: Apr. 10
      date: '1968-04-10'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 158-CT/TW on finance, trade and prices in 1968: three years'' work turned to the war''s needs, reserves of some goods built up. Now to serve production, farming, local industry and transport first; to mobilize goods, materials and capital and add to reserves; to improve distribution under a wartime consumption policy; to tighten economic and financial management; to press the reform of the market and the control of prices.'
      n: '*Chỉ thị của Ban Bí thư số 158-CT/TW, ngày 10 tháng 4 năm 1968, Về việc tăng cường và cải tiến lãnh đạo và chỉ đạo công tác tài chính, thương nghiệp, giá cả trong năm 1968*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 214–23, 387 (the copy''s folios run on from 223 to 387 in the text). Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-04-23.vietnam-hanoi
      when: Apr. 23
      date: '1968-04-23'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Duẩn, Lê Văn Lương, Nguyễn Văn Trân, Hoàng Anh and Xuân Thủy present, hears the Central Industry Board on a democratic campaign in the enterprises: after ten years industry, transport and construction well grown, but waste and embezzlement, productivity rising slowly, quality falling, management bureaucratic. A campaign to raise the collective mastery of cadres, workers and staff and reform management in industry to be prepared.'
      n: '*Thông báo số 11-TB/TW, ngày 25 tháng 5 năm 1968, Về việc chuẩn bị tiến hành cuộc vận động phát huy vai trò làm chủ tập thể của cán bộ, công nhân, viên chức, cải tiến quản lý kinh tế trong các xí nghiệp và các ngành thuộc khối công nghiệp* (the meeting of Apr. 23), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXIX, 522–25. Made public: 2004. Names: Lê Duẩn, Lê Văn Lương, Nguyễn Văn Trân, Hoàng Anh, Xuân Thủy.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
      - name:xuan-thuy
- add:
    entry:
      id: cal.1968-05-08.vietnam-hanoi
      when: May 8
      date: '1968-05-08'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo''s secret cable to Phạm Hùng: a coalition government in the South not to be formed yet. One made mostly of the Alliance, with pro-French and pro-American men and defectors, the Front a minority without key posts, would lower the Front; the Americans would ignore it. In time, the balance changed, a broad coalition of the Front, the Alliance, the pro-French and even pro-American men for peace, the Front keeping its place; the Americans to be made to recognize both.'
      n: '*Điện mật của Bộ Chính trị, ngày 8 tháng 5 năm 1968*, to "anh Bảy Cường." [[w.van-kien-dang-toan]], XXIX, 503–4. Made public: 2004. See [[cal.1968-04-08.vietnam-hanoi]]. Names: Phạm Hùng.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-05-08.vietnam-hanoi-2
      when: May 8
      date: '1968-05-08'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Secretariat''s secret cable no. 117 to the zone, city and provincial committees: the Government has chosen Paris for the contacts with the Americans and sent Xuân Thủy; the South fights on in the general offensive and uprising. The struggle harder, the diplomatic front complex. Strategic transport, aid to the front, air defense and production to be pressed; illusions guarded against; the diplomacy left to the Center, the Government and Hồ Chí Minh.'
      n: '*Điện mật của Ban Bí thư số 117, ngày 8 tháng 5 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 505–6. Made public: 2004. See [[cal.1968-05-03.vietnam]]. Names: Xuân Thủy, Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
      - name:xuan-thuy
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1968-05-14.vietnam-hanoi
      when: May 14
      date: '1968-05-14'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s secret cable no. 126 to the Trị–Thiên committee: the Thừa Thiên–Huế Alliance has never stated its attitude to the Liberation Front. Its cable joining the national Alliance accepts the Alliance''s stand in its manifesto, so Lê Văn Hảo''s cable to Trịnh Đình Thảo needs no addition, as COSVN had suggested; henceforth it should state its attitude when fitting, as the national Alliance did.'
      n: '*Điện mật của Ban Bí thư số 126, ngày 14 tháng 5 năm 1968*, signed "Lương" (Lê Văn Lương). [[w.van-kien-dang-toan]], XXIX, 513–14. Made public: 2004. See [[cal.1968-02-08.vietnam-hanoi]]; [[cal.1968-04-20.vietnam-2]]. Names: Lê Văn Hảo, Trịnh Đình Thảo.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-05-17.vietnam-hanoi
      when: May 17
      date: '1968-05-17'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo''s secret cable no. 253 to the Region IX committee: some gains, the encroachment on U Minh beaten, Càng Long and An Trường opened. The region, rich and populous, a key to the enemy''s pacification and "Vietnamization"; his war in Cambodia draws his main forces off the delta. The region''s long disunity to be ended; besides local and guerrilla forces it to build some strong main-force units, with Region VIII, under COSVN''s and the Military Commission''s orders.'
      n: '*Điện mật của Bộ chính trị số 253, ngày 17 tháng 5 năm 1968*, to the Region IX committee and "anh Sáu Nam, anh Mười Khang, anh Bảy Cường," signed "Bộ chính trị." [[w.van-kien-dang-toan]], XXIX, 515–17. Made public: 2004.'
      tags:
      - polity:drv
      - polity:cambodia
      - vis:only:drv
- add:
    entry:
      id: cal.1968-05-20.vietnam-hanoi
      when: May 20
      date: '1968-05-20'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 217-TT/TW: the tens of thousands of pupils and children evacuated from Hanoi, Haiphong, Nam Hà and other cities to stay out through the summer. Families kept from bringing them home; the host provinces, Hà Tây, Hà Bắc, Vĩnh Phú, Hải Hưng, to organize light study, recreation, labor and medical care.'
      n: '*Thông tri của Ban Bí thư số 217-TT/TW, ngày 20 tháng 5 năm 1968, Về việc quản lý học sinh và trẻ em sơ tán trong dịp hè 1968*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 518–21. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-05-29.vietnam-hanoi
      when: May 29
      date: '1968-05-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 161-CT/TW on work among Buddhists, Cao Đài and Protestants: their bodies now patriotic, but in some places places of worship and ordinary religious life infringed, the Buddhists'' above all. The policy to be kept, places of worship protected; allowances for the religious bodies and needy clergy; patriotic clergy to be cultivated.'
      n: '*Chỉ thị của Ban Bí thư số 161-CT/TW, ngày 29 tháng 5 năm 1968, Về công tác vận động đồng bào theo đạo Phật, đạo Cao đài, đạo Tin lành trước tình hình và nhiệm vụ mới*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 526–29. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-05-30.vietnam-hanoi
      when: May 30
      date: '1968-05-30'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 162-CT/TW on Front work in the North: unity strengthened, but pessimism and impatience in parts of the people; the Politburo''s resolution no. 53 of May 9, 1962 not yet carried through. The Fatherland Front at every level; help to the Democratic and Socialist parties; the religions; the Chinese residents of the cities; the intellectuals; the elders; the Vietnamese returned from abroad; mass work joined with security work.'
      n: '*Chỉ thị của Ban Bí thư số 162-CT/TW, ngày 30 tháng 5 năm 1968, Về công tác Mặt trận ở miền Bắc trước tình hình và nhiệm vụ mới*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 530–35. Made public: 2004. See [[cal.1962-05-09.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-05.vietnam-hanoi
      when: May
      date: '1968-05'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh, rereading his testament, adds to it, "absolutely secret": he is 78; no lavish funeral; his body to be cremated, the ashes in three urns for North, Center and South, each buried on a hill with a simple house for visitors and trees planted; after victory the war''s wounds to be healed, the farm cooperatives spared the agricultural tax for a year, the cities and villages rebuilt.'
      n: '*Di chúc của Chủ tịch Hồ Chí Minh*, the draft of May 1968 ("Tháng 5-1968, khi xem lại thư này ...," 262), [[w.van-kien-dang-toan]], XXX, 260–64. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1968-06-06.vietnam-hanoi
      when: June 6
      date: '1968-06-06'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s circular no. 218-TT/TW on transport in Military Region IV: since the "limited bombing" the Americans have struck hard from Nghệ An south, Nghệ An and Hà Tĩnh above all, with delayed-action bombs on the river and road routes; deliveries to the front short of plan. Air defense regrouped around the key points; a steering board for transport in the region, of the region''s command, the Transport Ministry, the forward General Department, military transport and the three provinces, Nghệ An, Hà Tĩnh and Quảng Bình.'
      n: '*Thông tri của Ban Bí thư số 218-TT/TW, ngày 6 tháng 6 năm 1968, về việc tăng cường lãnh đạo và tổ chức chỉ đạo bảo đảm giao thông vận tải ở Quân khu IV*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 536–38. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-06-08.vietnam-hanoi
      when: June 8
      date: '1968-06-08'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 179-NQ/TW: the management and distribution of grain to be unified in the state and the farm cooperatives, the free market in grain narrowed and then abolished. In two steps: first education and the policies of procurement and distribution; then the free market in paddy, rice, maize, flour and dried cassava and potato ended, the village markets included. In force from the 1968 spring harvest in the delta and midlands.'
      n: '*Nghị quyết của Ban Bí thư số 179-NQ/TW, ngày 8 tháng 6 năm 1968, Về thống nhất quản lý, phân phối lương thực vào Nhà nước và hợp tác xã nông nghiệp, tích cực thu hẹp và tiến tới xoá bỏ thị trường tự do về lương thực*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 539–64. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-06-13.vietnam-hanoi
      when: June 13
      date: '1968-06-13'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s secret cable no. 155 to Nghệ An, Hà Tĩnh, Quảng Bình and Vĩnh Linh: deliveries short of plan, losses of men and goods rising under the bombing, the preparations of central branches and local committees inadequate. People''s air defense to cut casualties; transport to the front checked and put right, the clearing of delayed-action bombs taught, discipline on the roads.'
      n: '*Điện mật của ban bí thư số 155, ngày 13 tháng 6 năm 1968*. [[w.van-kien-dang-toan]], XXIX, 565–66. Made public: 2004. See [[cal.1968-06-06.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-07-03.vietnam-hanoi
      when: July 3
      date: '1968-07-03'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s circular no. 219-TT/TW strengthens the steering board for transport in Military Region IV: Phan Trọng Tuệ, Minister of Transport, its head; Lê Quang Hòa political commissar; Lê Văn Tri, deputy commander of air defense and air force, Hoàng Văn Thái, head of the forward General Department of Rear Services, and Nguyễn Tường Lân, deputy minister, its deputies. A Party and a state body at once.'
      n: '*Thông tri của Ban Bí thư số 219-TT/TW, ngày 3 tháng 7 năm 1968, Về việc tăng cường hơn nữa việc lãnh đạo và chỉ đạo bảo đảm giao thông vận tải ở Quân khu IV*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 567–69. Made public: 2004. See [[cal.1968-06-06.vietnam-hanoi]]. Names: Phan Trọng Tuệ, Lê Quang Hòa, Lê Văn Tri, Hoàng Văn Thái, Nguyễn Tường Lân.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-07-04.vietnam-hanoi
      when: July 4
      date: '1968-07-04'
      thread: vietnam-hanoi
      c: 'The Secretariat''s secret cable no. 21 to "anh Đồng," secretary of the Vĩnh Linh committee, answering his no. 7: the enemy''s heavy attacks on Vĩnh Linh perhaps meant to cover his withdrawal from Khe Sanh by Đông Hà and Cửa Việt. Those not needed in the worst-hit villages to be evacuated; production pressed, but not at the cost of lives.'
      n: '*Điện mật của Ban Bí thư số 21, ngày 4 tháng 7 năm 1968*. [[w.van-kien-dang-toan]], XXIX, 570. Made public: 2004. See [[cal.1968-01-12.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-07-11.vietnam-hanoi
      when: July 11
      date: '1968-07-11'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 163-CT/TW: a round of political study on Hồ Chí Minh''s appeal of July 20, to be published then. The political mobilization so far has cleared understanding of the new period, not yet the will and work it asks. When the appeal appears, the press to spread it; the Secretariat to hold a conference for the Party and the Youth Union first, then the people; the mobilization to be summed up.'
      n: '*Chỉ thị của Ban Bí thư số 163-CT/TW, ngày 11 tháng 7 năm 1968, Về tổ chức đợt sinh hoạt chính trị học tập và chấp hành Lời kêu gọi 20-7 của Hồ Chủ tịch*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIX, 575–80. Made public: 2004. See [[cal.1968-03-01.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1968-07-13.vietnam-hanoi
      when: July 13
      date: '1968-07-13'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 164-CT/TW: a campaign for "long-term anti-American, national-salvation savings" deposits. Finances sound, by production and the large aid of the fraternal countries, but heavy war spending and poor management; cash to be drawn out of circulation to balance the economy, steady prices and money, and prepare for recovery after the war. District and village committees to lead it.'
      n: '*Chỉ thị của Ban Bí thư số 164-CT/TW, ngày 13 tháng 7 năm 1968, Về việc vận động nhân dân gửi tiền "tiết kiệm dài hạn chống Mỹ, cứu nước"*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 581–84. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-07-16.vietnam-hanoi
      when: July 16
      date: '1968-07-16'
      thread: vietnam-hanoi
      also:
      - soviet-union
      - vietnam-paris
      c: 'The Politburo''s letter to Brezhnev and Kosygin, answering theirs of June 13: since Mar. 31 the Americans add troops in the South and bomb from the 17th parallel to the 20th; at Paris they set conditions on withdrawal and will not recognize the Front; their stand unchanged. As agreed in the Moscow talks of April, fighting hard while talking; the diplomatic struggle important, Hanoi''s attitude serious and in good will; the unconditional end of the bombing first, then concrete talks. Moscow asked to keep pressing Washington.'
      n: '*Thư của Bộ Chính trị, ngày 16 tháng 7 năm 1968* (the appendix); the April talks led by Phạm Văn Đồng, Lê Đức Thọ and Xuân Thủy passing through on their way to Paris (1318). [[w.van-kien-dang-toan]], XXIX, 1314–20. Made public: 2004. See [[cal.1968-06-03.vietnam-paris]]. Names: Brezhnev, Kosygin, Johnson, Phạm Văn Đồng, Lê Đức Thọ, Xuân Thủy.'
      tags:
      - polity:drv
      - polity:ussr
      - polity:us
      - vis:only:drv+ussr
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - name:johnson-lyndon-b
      - name:pham-van-dong
      - name:le-duc-tho
      - name:xuan-thuy
- add:
    entry:
      id: cal.1968-07-26.vietnam-hanoi
      when: July 26
      date: '1968-07-26'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s secret cable no. 193 to the Quảng Bình, Hà Tĩnh and Nghệ An committees: heavy bombing and a long drought, casualties high. Transport to the front, with the region''s transport board, the three provinces'' first task, as the Center said at the year''s start; the drought and pests fought for the tenth-month crop; shelters; the worst-hit places settled.'
      n: '*Điện mật của Ban Bí thư số 193, ngày 26 tháng 7 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 585–86. Made public: 2004. See [[cal.1968-07-03.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-08-02.vietnam-hanoi
      when: Aug. 2
      date: '1968-08-02'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s circular no. 220-TT/TW militarizes transport in Region IV: a Transport Assurance Command for the region replaces the steering board, under the Central Military Commission, the Defense Ministry and the Standing Committee of the Council of Ministers. Maj. Gen. Phan Trọng Tuệ, Minister of Transport, its commander; Maj. Gen. Lê Quang Hòa its commissar; the chairmen of Nghệ An, Hà Tĩnh and Quảng Bình among its deputies. Command boards in the three provinces, military stations along the routes; all in place by Aug. 15.'
      n: '*Thông tri của Ban Bí thư số 220-TT/TW, ngày 2 tháng 8 năm 1968, Về việc tổ chức hệ thống chỉ huy thống nhất bảo đảm giao thông vận tải Khu IV*, signed for the Secretariat by Lê Văn Lương; a chart of the command, 597. [[w.van-kien-dang-toan]], XXIX, 587–98. Made public: 2004. See [[cal.1968-07-03.vietnam-hanoi]]. Names: Phan Trọng Tuệ, Lê Quang Hòa.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-08-06.vietnam-hanoi
      when: Aug. 6
      date: '1968-08-06'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 165-CT/TW: the provincial Party congresses, four years since the last, one term put off, to meet this year under the statute; the provinces from Nghệ An south later. To review the work since the bombing began, set the tasks and elect new provincial committees, the elections truly democratic.'
      n: '*Chỉ thị của Ban Bí thư số 165-CT/TW, ngày 6 tháng 8 năm 1968, Về việc mở Đại hội đại biểu Đảng bộ các tỉnh*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 599–603. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-08-08.vietnam-hanoi
      when: Aug. 8
      date: '1968-08-08'
      thread: vietnam-hanoi
      c: 'The Secretariat and the Standing Committee of the Council of Ministers, Lê Duẩn, Lê Văn Lương, Tố Hữu, Nguyễn Côn and Trần Hữu Dực, on general education for 1968–70: schools, pupils and teachers well up since 1964–65, but nearly a million children not in school, some 75 percent of seventh-grade leavers without a place in the eighth, quality falling, teachers short. Quality first; more schools; teachers trained; the Party and the Youth Union built in the schools.'
      n: '*Thông báo số 14-TB/TW, ngày 26 tháng 8 năm 1968, Về cuộc họp Ban Bí thư Trung ương Đảng và Thường vụ Hội đồng Chính phủ bàn về công tác giáo dục phổ thông trong ba năm tới (1968 - 1970)* (the meeting of Aug. 8), signed by Trần Xuân Bách, chief of the Central Office. [[w.van-kien-dang-toan]], XXIX, 615–16, 733–38 (the copy''s folios run on from 616 to 733 in the text). Made public: 2004. Names: Lê Duẩn, Lê Văn Lương, Tố Hữu, Nguyễn Côn, Trần Hữu Dực.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
- add:
    entry:
      id: cal.1968-08-11.vietnam-hanoi
      when: Aug. 11
      date: '1968-08-11'
      thread: vietnam-hanoi
      c: 'The Secretariat''s secret cable to the committees of Hà Bắc, Hải Hưng, Vĩnh Phú, Hanoi, Haiphong, Hà Tây, Thái Bình and Nam Hà: days of rain over the Thái Bình and Cầu basins, a sudden flood at Thái Nguyên; the Thái Bình and Red rivers still rising. Flood work the urgent center: dikes guarded, lives, property and stores saved, communications kept; meetings put off.'
      n: '*Điện mật của Ban Bí thư, ngày 11 tháng 8 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 604. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-08-20.vietnam-hanoi
      when: Aug. 20
      date: '1968-08-20'
      thread: vietnam-hanoi
      c: 'The Secretariat and the Standing Committee of the Council of Ministers, Lê Thanh Nghị, Nguyễn Duy Trinh, Tố Hữu, Nguyễn Văn Trân, Nguyễn Côn and Trần Hữu Dực, after Trần Hữu Dực''s report on the floods and typhoon: heavy losses to production, lives and state property, the dikes still threatened. Work not urgent put off beside the aid to the front; waterlogged rice saved and replanted; industry, transport and communications restored; food, shelter and hygiene for the people; Central Committee members sent to the localities.'
      n: '*Thông báo số 13-TB/TW, ngày 24 tháng 8 năm 1968, Về Hội nghị Ban Bí thư và Thường vụ Hội đồng Chính phủ bàn về công tác phòng, chống lụt, bão* (the meeting of Aug. 20), signed by Trần Xuân Bách, chief of the Central Office. [[w.van-kien-dang-toan]], XXIX, 611–14. Made public: 2004. See [[cal.1968-08-11.vietnam-hanoi]]. Names: Lê Thanh Nghị, Nguyễn Duy Trinh, Tố Hữu, Nguyễn Văn Trân, Nguyễn Côn, Trần Hữu Dực.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:nguyen-duy-trinh
- add:
    entry:
      id: cal.1968-08-29.vietnam-hanoi
      when: Aug. 29
      date: '1968-08-29'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Fifteenth Plenum. A report on the diplomatic front since the spring, no speaker named: Johnson''s statement of Mar. 31 and Hanoi''s of Apr. 3 have brought a new phase of "fighting while talking," good for Hanoi. Few chances that Washington settles on Hanoi''s terms before a decisive victory, more if the bombing stops; at Paris an honorable way out offered if the Americans end the aggression and withdraw, the secret soundings pressed. If the bombing stops: the end of all acts of war demanded, then American and allied withdrawal and talks with the Front; "reciprocity" refused; Hanoi and the Front to issue programmatic statements.'
      n: '*Báo cáo tại Hội nghị Ban chấp hành Trung ương lần thứ 15, ngày 29 tháng 8 năm 1968, Về thắng lợi to lớn của ta trên mặt trận đấu tranh ngoại giao và hoạt động quốc tế từ đầu xuân 1968 đến nay*. [[w.van-kien-dang-toan]], XXIX, 739–74 (the case of a halt, 769–70). Made public: 2004. The plenum''s days not given by the volume. Names: Johnson.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08.vietnam-hanoi
      when: Aug.
      date: '1968-08'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo''s resolution on the general uprising and general offensive in the South, after the Central Military Commission''s and the battlefields'' reports: the offensive, opened at Tết, a great success in a short time, a sudden change in the war; Saigon''s army 180,000 killed and 250,000 disintegrated, by its count. Yet the aims set in January not reached; the attacks and risings in the cities not strong or sustained, Huế not held. The offensive to go on to a decisive victory: an important part of the American forces destroyed, the greater part of Saigon''s army destroyed or broken up, its government overthrown, the American will broken. The war a long one, on the country''s own strength, a decisive victory sought in a relatively short time.'
      n: '*Nghị quyết của Bộ Chính trị, tháng 8 năm 1968, về tổng khởi nghĩa, tổng công kích ở miền Nam*. [[w.van-kien-dang-toan]], XXIX, 775–76, 863–913 (the copy''s folios run on from 776 to 863 in the text; the figures, 863; the faults, 865–66; the aims, 880–81). Made public: 2004. See [[cal.1968-01.vietnam-tet]].'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
- add:
    entry:
      id: cal.1968-09-12.vietnam-hanoi
      when: Sept. 12
      date: '1968-09-12'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 222-TT/TW on the campaign, decided by the Secretariat and the Standing Committee of the Council of Ministers, to manage the market and fight speculation and theft of state materials and goods, to the end of 1968: steel, fuel, coal, grain, food, cloth and medicines kept from leaking out of the state enterprises; in state bodies first, the big cities, the transport hubs and main routes.'
      n: '*Thông tri của Ban Bí thư số 222-TT/TW, ngày 12 tháng 9 năm 1968, Về việc chỉ đạo đợt vận động quản lý thị trường, chống đầu cơ, lấy cắp vật tư, hàng hoá của Nhà nước*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXIX, 914–16. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-09-25.vietnam-hanoi
      when: Sept. 25
      date: '1968-09-25'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 181-NQ/TW on work among the young: the young the bulk of the armed forces, 40 percent of farm labor and 60 to 80 percent of industrial; the Youth Union''s role, functions and tasks in the new situation set, the Party''s leadership of it strengthened.'
      n: '*Nghị quyết của Ban Bí thư Trung ương Đảng số 181-NQ/TW, ngày 25 tháng 9 năm 1968, Về công tác vận động thanh niên*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 917–39. Made public: 2004. See [[cal.1968-03-14.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-10-10.vietnam-hanoi
      when: Oct. 10–13
      date: '1968-10-10'
      thread: vietnam-hanoi
      c: 'The Politburo in session on the economy and the tasks of 1969: great victories, the front supplied and the economy turned to wartime, but management weak, the Party''s line not grasped, the masses'' collective mastery and the dictatorship of the proletariat not fully used. In 1969, a year of the utmost importance: the front first, production and the people''s life, preparation for the years after and for recovery after the war; management reformed, the market campaign pressed. Its resolution no. 185-NQ/TW dated Dec. 26.'
      n: '*Nghị quyết của Bộ Chính trị số 185-NQ/TW, ngày 26 tháng 12 năm 1968, Về nhận định tình hình kinh tế hiện nay và nhiệm vụ kinh tế năm 1969 (Kỳ họp từ ngày 10 đến ngày 13-10-1968)*, signed for the Politburo by Phạm Văn Đồng. [[w.van-kien-dang-toan]], XXIX, 1186–1205. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:pham-van-dong
- add:
    entry:
      id: cal.1968-10-15.vietnam-hanoi
      when: Oct. 15
      date: '1968-10-15'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Politburo''s secret cable to COSVN: at Paris, behind the scenes, the Americans make Saigon''s part in the conference their condition for ending the bombing. To press them, a four-party conference on an equal footing may be accepted, the Front invited by Hanoi, Saigon by Washington; it will not settle anything at once, the Front to keep its demands. COSVN to give its views, send cadres north at once, Trần Bửu Kiếm too if he is to be the Front''s representative, and explain to the Alliance why it is left out of this step.'
      n: '*Điện mật của Bộ Chính trị, ngày 15 tháng 10 năm 1968* (no. 323, by the cable of Oct. 20, 960), signed "Bộ Chính trị." [[w.van-kien-dang-toan]], XXIX, 949–53. Made public: 2004. See [[cal.1968-10-10.vietnam-paris]]. Names: Trần Bửu Kiếm.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
      - name:tran-buu-kiem
- add:
    entry:
      id: cal.1968-10-16.vietnam-hanoi
      when: Oct. 16
      date: '1968-10-16'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo''s resolution no. 183-NQ/TW strengthens the Trị–Thiên–Huế regional committee: Hoàng Anh, Hoàng Sâm and Nguyễn Quyết added, Hoàng Anh its secretary, Trần Văn Quang his deputy. The committee leads all work in the region under the Politburo, the Central Military Commission for military matters, the Secretariat for the rest; its ties with Group 559, the B5 front''s Party committee, Quảng Bình and Vĩnh Linh set.'
      n: '*Nghị quyết của Bộ Chính trị số 183-NQ/TW, ngày 16 tháng 10 năm 1968, Về việc kiện toàn tổ chức và lãnh đạo của Khu uỷ Trị - Thiên - Huế*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXIX, 954–57. Made public: 2004. Names: Hoàng Anh, Hoàng Sâm, Nguyễn Quyết, Trần Văn Quang.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-10-19.vietnam-hanoi
      when: Oct. 19
      date: '1968-10-19'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Secretariat''s secret cable no. 291 to the zone, city and provincial committees: Western and Saigon talk of an American halt to the bombing, forced by defeats and the election, or a rumor for the election. No illusions; shelters repaired, the schools'' first; if the bombing stops, transport and urgent economic work pressed at once; the bombing may come back, spying and psychological war will grow; the southern provinces of Region IV still under fire meanwhile.'
      n: '*Điện mật của Ban Bí thư số 291, ngày 19 tháng 10 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 958–59. Made public: 2004. Names: Johnson.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-10-20.vietnam-hanoi
      when: Oct. 20
      date: '1968-10-20'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Politburo''s secret cable no. 00/1968 to the Region V and Trị–Thiên committees: the line of its cable of Oct. 10 to COSVN, the Americans unable to win, Humphrey to be courted and Nixon attacked; then the decision of the last days: if Washington ends the bombing and all other acts of war unconditionally, a four-party conference of the DRV, the Front, the United States and the Saigon government, with a preparatory meeting seven to ten days after the halt, perhaps before the American election. The work in the South set; the cable for the regional standing committees.'
      n: '*Điện mật của Bộ Chính trị số 00/1968, ngày 20 tháng 10 năm 1968*, signed "Bộ Chính trị"; the editors'' note: it differs from the cable "ở trang 468" (of Oct. 10) in date, addressee and some content (964 n.). [[w.van-kien-dang-toan]], XXIX, 964–69. Made public: 2004. See [[cal.1968-10-20.vietnam-paris]]. Names: Humphrey, Nixon.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
      - name:humphrey-hubert-h
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-10-23.vietnam-hanoi
      when: Oct. 23
      date: '1968-10-23'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Duẩn, Lê Văn Lương, Tố Hữu, Nguyễn Văn Trân and Hoàng Anh present, hears the General Department of Forestry''s Party group: forestry a key branch, the tropical forest a great and lasting resource, a shield against disasters; but the forests badly protected, planting slow. The urgent matters only decided, the whole question left for later: the destruction of the forests to be stopped at once, protection and planting pressed, the Party''s leadership of forestry strengthened.'
      n: '*Thông báo số 18-TB/TW, ngày 23 tháng 10 năm 1968, Về Hội nghị Ban Bí thư bàn về lâm nghiệp* (the meeting''s day not given), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXIX, 970–74. Made public: 2004. Names: Lê Duẩn, Lê Văn Lương, Tố Hữu, Nguyễn Văn Trân, Hoàng Anh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
- add:
    entry:
      id: cal.1968-10-27.vietnam-hanoi
      when: Oct. 27
      date: '1968-10-27'
      thread: vietnam-hanoi
      c: 'The Central Committee''s letter to Kim Il Sung, signed by Lê Duẩn: Nguyễn Duy Trinh has reported to the Politburo Kim''s and Kenji Miyamoto''s views on a plan toward a world people''s front against the United States and for Vietnam; with the socialist camp and the movement split, Kim''s measures practical; the concrete steps given to his ambassador in Hanoi.'
      n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, ngày 27 tháng 10 năm 1968*, to Kim Il Sung (the appendix). [[w.van-kien-dang-toan]], XXIX, appendix, after 1390 (the copy''s pages unnumbered). Made public: 2004. Names: Kim Il Sung, Lê Duẩn, Nguyễn Duy Trinh, Kenji Miyamoto.'
      tags:
      - polity:drv
      - polity:dprk
      - vis:only:drv+dprk
      - name:kim-il-sung
      - name:le-duan
      - name:nguyen-duy-trinh
- add:
    entry:
      id: cal.1968-10-31.vietnam-hanoi
      when: Oct. 31
      date: '1968-10-31'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Secretariat''s secret cable no. 302 to the zone, city and provincial committees: the American government may order the bombing and other acts of war against the North stopped at 7 or 8 a.m., Hanoi time, Nov. 1; a great defeat for them. The victory to be explained, but the South''s liberation still hard; no slackening: the armed forces ready, shelters kept, evacuees to stay put, counter-espionage; strategic transport the first task, in the old Region IV above all; production and the people''s life seen to.'
      n: '*Điện mật của Ban Bí thư số 302, ngày 31 tháng 10 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 975–77. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-10.vietnam-hanoi
      when: Oct.
      date: '1968-10'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN''s eighth conference, resolution no. 07/NQNT, "a supreme effort, resolutely forward to win a decisive victory": the spring offensive a leap that upset the enemy''s dispositions, the later high points weakening him further. Forces to be built up; the political tide and the rising in Saigon and the towns pressed, the rising in the countryside, the liberated areas made a strong rear; the committees'' leadership and the Party''s base strengthened.'
      n: '*Nghị quyết của Hội nghị lần thứ tám Trung ương cục, số 07/NQNT, tháng 10 năm 1968, Về nỗ lực vượt bực, kiên quyết tiến lên giành thắng lợi quyết định* (the appendix). [[w.van-kien-dang-toan]], XXIX, 1321–90. Made public: 2004. See [[cal.1968-03.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-11-02.vietnam-hanoi
      when: Nov. 2
      date: '1968-11-02'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Secretariat''s secret cable no. 305 on explaining the bombing halt: provincial, district and base secretaries to be gathered to hear the delegates back from the Center, then every Party member and the people within the week; Hồ Chí Minh''s appeal and the statements of the Government and the Front read out. The victory, the enemy''s designs, the unchanged stand: American and allied troops out, the South''s affairs settled by its people on the Front''s program. A cadres'' conference called by the Secretariat Nov. 4.'
      n: '*Điện mật của Ban bí thư số 305, ngày 2 tháng 11 năm 1968*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 978–80. Made public: 2004. See [[cal.1968-10-31.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1968-11-09.vietnam-hanoi
      when: Nov. 9
      date: '1968-11-09'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo''s directive supplementing its August resolution, after the halt and Washington''s acceptance of four-way talks: the Americans forced into "de-Americanization," seeking to leave the South with Saigon''s army and government still strong; they may end the war soon that way, or drag it out. The aim still a decisive victory in a relatively short time, readiness for a long war; if the Americans pull out, a decisive victory means all their troops gone and the revolution''s forces stronger than Saigon''s, masters of most of the countryside and part of the cities. Military attack with urban risings, political struggle, work among enemy troops pressed.'
      n: '*Chỉ thị của Bộ Chính trị, ngày 9 tháng 11 năm 1968, Bổ sung một số điểm cho Nghị quyết tháng 8-1968 về đẩy mạnh tổng công kích, tổng khởi nghĩa, giành thắng lợi quyết định* (the title the editors''). [[w.van-kien-dang-toan]], XXIX, 985–98. Made public: 2004. See [[cal.1968-08.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
- add:
    entry:
      id: cal.1968-11-18.vietnam-hanoi
      when: Nov. 18
      date: '1968-11-18'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Duẩn, Lê Văn Lương and Tố Hữu present, hears the General Federation of Trade Unions'' Party group on its work in 1968 and plans for 1969: some progress since resolution no. 167; for 1969, the workers to be educated and roused for production and management, their life seen to, propaganda, the unions'' organization and cadres strengthened.'
      n: '*Thông báo Hội nghị Ban Bí thư số 21-TB/TW, ngày 18 tháng 12 năm 1968, về công tác công đoàn năm 1968 và phương hướng nhiệm vụ công tác công đoàn năm 1969* (the meeting of Nov. 18), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXIX, 1171–78. Made public: 2004. Names: Lê Duẩn, Lê Văn Lương, Tố Hữu.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
- add:
    entry:
      id: cal.1968-11-21.vietnam-hanoi
      when: Nov. 21
      date: '1968-11-21'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 166-CT/TW on public order, the market and a new way of life in the cities and towns: labor discipline slack, speculation, smuggling, theft, disorder and unhealthy ways among the young growing. The police, with the people, militia and youth, to find and punish the chief offenders; the market campaign pressed; children out of school placed; work found for needy families; streets and state property guarded; cultural life for the young.'
      n: '*Chỉ thị của Ban Bí thư số 166-CT/TW, ngày 21 tháng 11 năm 1968, Về một số vấn đề nhằm tăng cường công tác trị an xã hội, quản lý thị trường và xây dựng nếp sống mới ở các thành phố, thị xã*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 999–1005. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-11-28.vietnam-hanoi
      when: Nov. 28
      date: '1968-11-28'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 167-CT/TW against the enemy''s seizure of fishermen and sea carriers for intelligence and psychological war: enemy vessels watched and coastal villages warned, the boats organized in teams under leaders, armed forces to strike back. Those killed or wounded resisting treated as soldiers; families of those held supported; those released welcomed, their accounts heard; Party members who kept faith commended.'
      n: '*Chỉ thị của Ban Bí thư số 167-CT/TW, ngày 28 tháng 11 năm 1968, Về việc tăng cường đối phó, đập tan âm mưu, thủ đoạn của địch bắt người làm nghề trên mặt biển*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 1006–12. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-12-01.vietnam-hanoi
      when: Dec. 1
      date: '1968-12-01'
      thread: vietnam-hanoi
      also:
      - soviet-union
      c: 'The Politburo''s secret cable to the Soviet Politburo, after hearing the party-government delegation''s report on its talks in Moscow with the delegation led by Brezhnev: well pleased with the results and with Moscow''s agreement with the Party''s line; Moscow''s suggestions to be studied with care. Thanks for the agreements on Soviet economic and military aid for 1969; solidarity with the CPSU pledged.'
      n: '*Điện mật của Bộ Chính trị, ngày 1 tháng 12 năm 1968*, signed by the Politburo of the Central Committee, Vietnam Workers'' Party. [[w.van-kien-dang-toan]], XXIX, 1013–14. Made public: 2004. See [[cal.1968-11-20.soviet-union-leadership]]; [[cal.1968-11-25.vietnam]]. Names: Brezhnev.'
      tags:
      - polity:drv
      - polity:ussr
      - vis:only:drv+ussr
      - name:brezhnev-leonid
- add:
    entry:
      id: cal.1968-12-02.vietnam-hanoi
      when: Dec. 2
      date: '1968-12-02'
      thread: vietnam-hanoi
      c: 'The Secretariat and the Standing Committee of the Council of Ministers, at sittings of Nov. 12 and Dec. 2, hear the Labor Ministry on carrying out the Politburo''s and the Council''s labor resolutions: manpower supplied for economy and defense, technical training up; but labor still wasted, discipline lax, productivity falling in some branches. Labor management the basic link of economic management; a new division of social labor; women''s labor managed with care.'
      n: '*Thông báo Hội nghị Ban Bí thư và Thường vụ Hội đồng Chính phủ số 22-TB/TW, ngày 19 tháng 12 năm 1968, bàn về công tác lao động*, signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXIX, 1179–85. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-12-04.vietnam-hanoi
      when: Dec. 4
      date: '1968-12-04'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Secretariat''s secret cable no. 348 to the committees from Thanh Hóa north: since Nov. 1 reconnaissance flights over the North go on, with bombing and fire on parts of Region IV; on Dec. 3 bombs and cluster bombs on villages in Quảng Trạch and Quảng Ninh districts, Quảng Bình. Vigilance and secrecy; the armed forces ready; air defense, evacuation and camouflage of stores; the people neither lulled nor alarmed.'
      n: '*Điện mật của Ban Bí thư số 348, ngày 4 tháng 12 năm 1968*, signed for the Secretariat by Trần Xuân Bách. [[w.van-kien-dang-toan]], XXIX, 1015–16. Made public: 2004. See [[cal.1968-10-31.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-12-12.vietnam-hanoi
      when: Dec. 12
      date: '1968-12-12'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 224-TT/TW on errors in the "three contracts" and land management in some farm cooperatives: "three contracts to the household," most often for subsidiary crops, in places for rice, vegetables, industrial crops and pigs, and cooperative land let slip. To be corrected where wrong, carefully and step by step, production kept up; the Central Agriculture Board to send cadres to Vĩnh Phú to guide some villages with the provincial committee.'
      n: '*Thông tri của Ban Bí thư số 224-TT/TW, ngày 12 tháng 12 năm 1968, Về việc chấn chỉnh công tác ba khoán và quản lý ruộng đất của hợp tác xã sản xuất nông nghiệp ở một số địa phương*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 1020–26. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-12-12.vietnam-hanoi-2
      when: Dec. 12
      date: '1968-12-12'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Politburo''s secret cable to Phạm Hùng after the halt: little to be had at Paris before Johnson goes; the settlement is with Nixon. In the South a hard blow to make Nixon decide to leave quickly; Saigon''s government to be overthrown and Thiệu and Kỳ replaced, using France and the pro-French; a government in Saigon to talk with the Front toward a coalition. At Paris four equal delegations, the Front independent, not negotiable; behind the scenes, bargaining on withdrawal and a provisional coalition to force a change in Saigon, American withdrawal discussed first. The Front and the Alliance to draw up a minimum program for a provisional coalition government.'
      n: '*Điện mật của Bộ Chính trị, ngày 12 tháng 12 năm 1968*, to "anh Bảy Cường." [[w.van-kien-dang-toan]], XXIX, 1167–70 (the copy''s folios run on from 1026 to 1167 between documents). Made public: 2004. See [[cal.1968-10-20.vietnam-hanoi]]. Names: Phạm Hùng, Johnson, Nixon, Thiệu, Kỳ.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - polity:fr
      - vis:only:drv
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
- add:
    entry:
      id: cal.1968-12-28.vietnam-hanoi
      when: Dec. 28
      date: '1968-12-28'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 225-TT/TW on spreading the Politburo''s resolution on the economy and the tasks of 1969: in full to the boards, Party groups and committees of zones, cities and provinces, in substance to other cadres; the chief cause of the faults the weakness of economic management; each branch and locality to review its 1968 work and set its 1969 plan by it.'
      n: '*Thông tri của Ban Bí thư số 225-TT/TW, ngày 28 tháng 12 năm 1968, Về việc phổ biến Nghị quyết của Bộ Chính trị về nhận định tình hình kinh tế hiện nay và nhiệm vụ kinh tế năm 1969*, signed Minh Châu. [[w.van-kien-dang-toan]], XXIX, 1206–9. Made public: 2004. See [[cal.1968-10-10.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-12.vietnam-hanoi
      when: Dec.
      date: '1968-12'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s secret cable to COSVN, Region V and Trị–Thiên: the armed bands formed by the risen people of the cities to be led closely by the Party and named for workers, women, students, Buddhists. Propagandists, writers and cameramen to Saigon, Đà Nẵng, Huế and Route 9; Burchett, Madeleine Riffaud, Joris Ivens and a Cuban journalist to be invited to the battlefield; the Propaganda Board to send cadres to COSVN; *Sud Vietnam en lutte* to be kept going.'
      n: '*Điện mật của Ban Bí thư, tháng 12 năm 1968*, signed for the Secretariat "Thọ." [[w.van-kien-dang-toan]], XXIX, 1210–11. Made public: 2004. Check: the volume dates the cable December 1968; its matter, the cities'' risings, Huế, Route 9, reads as of the first weeks of the Tết offensive. Names: Burchett, Madeleine Riffaud, Joris Ivens.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:burchett-wilfred
- add:
    entry:
      id: cal.1969-01-06.vietnam-hanoi
      when: Jan. 6
      date: '1969-01-06'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Duẩn, Lê Văn Lương, Tố Hữu and Nguyễn Văn Trân present, in the morning, on work among the young in 1969: the young brave and inventive in fighting, production and transport; but little in labor management and technical change, their education behind the movement, their wish for schooling and science ill served. Their collective mastery to be raised, the Youth Union built up; the ties between Party and Union set.'
      n: '*Thông báo số 05-TB/TW, ngày 14 tháng 3 năm 1969, Cuộc họp Ban Bí thư về công tác vận động thanh niên năm 1969* (the meeting of the morning of Jan. 6), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXX, 37–41. Made public: 2004. See [[cal.1968-09-25.vietnam-hanoi]]. Names: Lê Duẩn, Lê Văn Lương, Tố Hữu, Nguyễn Văn Trân.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
- add:
    entry:
      id: cal.1969-01-06.vietnam-hanoi-2
      when: Jan. 6
      date: '1969-01-06'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Văn Lương, Tố Hữu and Nguyễn Văn Trân present, in the afternoon, hears the Central Women''s Party group on 1968 and its plans for 1969: the "three responsibilities" movement still spreading, women''s place and standing rising. In 1969 the movement a step higher: women''s labor, their life, their education, the Union''s organization; the Party group to sum up the work of the four years of the war.'
      n: '*Thông báo số 04-TB/TW, ngày 4 tháng 2 năm 1969, Cuộc họp Ban Bí thư về công tác vận động phụ nữ năm 1969* (the meeting of the afternoon of Jan. 6), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXX, 13–18. Made public: 2004. Names: Lê Văn Lương, Tố Hữu, Nguyễn Văn Trân.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-01-13.vietnam-hanoi
      when: Jan. 13
      date: '1969-01-13'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 168-CT/TW on cultivating and holding up "good people, good deeds": besides the heroes and emulation fighters, thousands of ordinary people doing good; Hồ Chí Minh has given his badge to thousands since 1959. Committees and mass bodies to praise them promptly, in the press, on the radio and in books.'
      n: '*Chỉ thị của Ban Bí thư số 168-CT/TW, ngày 13 tháng 1 năm 1969, Về việc bồi dưỡng và nêu gương người tốt, việc tốt*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 1–4. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1969-01-17.vietnam-hanoi
      when: Jan. 17
      date: '1969-01-17'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 226-TT/TW on the 1969 elections of people''s councils and administrative committees of districts and villages: to strengthen them for the "collective mastery" campaign in the countryside and the decentralization of economic management; the councils not to be much changed; the administrative committees made effective.'
      n: '*Thông tri của Ban bí thư số 226-TT/TW, ngày 17 tháng 1 năm 1969, Về việc lãnh đạo bầu cử Hội đồng nhân dân và Uỷ ban hành chính huyện, xã và các cấp tương đương năm 1969*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXX, 7–10. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-01-17.vietnam-hanoi-2
      when: Jan. 17–18
      date: '1969-01-17'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Duẩn, Tố Hữu and Nguyễn Côn, with the Minister in the Prime Minister''s Office and Bình Phương, deputy secretary of the Northwest regional committee, hears the standing committees of Sơn La, Nghĩa Lộ and Lai Châu on their seven-year and two-year plans, again Jan. 27. The Northwest to become a great region of industrial and oil crops, livestock and forest; settled farming and settlement for the shifting cultivators, intensive food crops, new economic zones, local industry, roads.'
      n: '*Thông báo số 06-TB/TW, ngày 20 tháng 3 năm 1969, ý kiến của Ban Bí thư Về phương hướng phát triển kinh tế, văn hóa của ba tỉnh Sơn La, Nghĩa Lộ, Lai Châu* (the meetings of Jan. 17, 18 and 27), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXX, 42–47. Made public: 2004. Names: Lê Duẩn, Tố Hữu, Nguyễn Côn, Bình Phương.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
- add:
    entry:
      id: cal.1969-01-27.vietnam-hanoi
      when: Jan. 27
      date: '1969-01-27'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 228-TT/TW amends directive no. 168: good people and good deeds to be praised in the press and on the radio after checking; Hồ Chí Minh will consider them for his badge; branches and localities no longer to propose them to him.'
      n: '*Thông tri của Ban bí thư số 228-TT/TW, ngày 27 tháng 1 năm 1969, Bổ sung Chỉ thị số 168-CT/TW về việc bồi dưỡng và nêu gương người tốt, việc tốt*, signed for the Secretariat by Trần Xuân Bách, chief of its office; printed before no. 226 by the editors (5 n.). [[w.van-kien-dang-toan]], XXX, 5–6. Made public: 2004. See [[cal.1969-01-13.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1969-02-11.vietnam-hanoi
      when: Feb. 11
      date: '1969-02-11'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo''s cable to Phạm Hùng: agreed with COSVN on pushing the cities'' struggle for peace and the forming of a third force, between the patriots and Washington''s extreme agents; the Alliance need not call openly for talks with the middle strata on a peace cabinet. For study: talks between the Front and the Alliance on a provisional coalition government, at a low level its program and a campaign for it, at a high level its proclamation, with ministers, once the socialist countries'' recognition is sounded. Sihanouk to be invited to the North; the ambassador, Nguyễn Thương, called home.'
      n: '*Điện của Bộ Chính trị, ngày 11 tháng 2 năm 1969, Về đấu tranh ở đô thị* (the title the editors''), to "Anh Bảy Cường" (Phạm Hùng, the editors'' note). [[w.van-kien-dang-toan]], XXX, 19–21. Made public: 2004. Names: Phạm Hùng, Sihanouk, Nguyễn Thương.'
      tags:
      - polity:drv
      - polity:us
      - polity:cambodia
      - vis:only:drv
      - name:norodom-sihanouk
- add:
    entry:
      id: cal.1969-02-12.vietnam-hanoi
      when: Feb. 12
      date: '1969-02-12'
      thread: vietnam-hanoi
      c: 'The Central Committee''s letter to the twenty-third congress of the Danish Communist Party: greetings; the Danish party''s fight against the monopolies, NATO and West German revanchism; thanks for its support of Vietnam.'
      n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, ngày 12 tháng 2 năm 1969, gửi Đại hội lần thứ XXIII Đảng Cộng sản Đan Mạch* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Check: whether *Nhân Dân* printed it.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-02-14.vietnam-hanoi
      when: Feb. 14
      date: '1969-02-14'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 169-CT/TW on education in 1968–70: five million at school, from kindergarten to general and adult schooling; nearly a million children without the second level, tens of thousands illiterate in the mountains and Catholic areas, quality weak, teachers short and overworked. Quality first, the second level the core, the South''s needs served, the teachers trained, the curricula and textbooks revised.'
      n: '*Chỉ thị của Ban Bí thư số 169-CT/TW, ngày 14 tháng 2 năm 1969, Về công tác giáo dục trong ba năm 1968-1970*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 21–33. Made public: 2004. See [[cal.1968-08-08.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-03-06.vietnam-hanoi
      when: Mar. 6
      date: '1969-03-06'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 229-TT/TW on work among women in 1969 and the summing up of four years: the "three responsibilities" movement to be led on, women''s labor and their life seen to; the four years'' work reviewed at every level.'
      n: '*Thông tri của Ban Bí thư số 229-TT/TW, ngày 6 tháng 3 năm 1969, Về công tác vận động phụ nữ năm 1969 và tổng kết công tác vận động phụ nữ trong bốn năm chống Mỹ, cứu nước*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 34–36. Made public: 2004. See [[cal.1969-01-06.vietnam-hanoi-2]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-03-14.vietnam-hanoi
      when: Mar. 14
      date: '1969-03-14'
      thread: vietnam-hanoi
      c: 'The Secretariat hears the Domestic Trade Ministry''s Party group on trade in 1969: rationed food, sauce and cloth roughly assured, other needs to be met quickly; the trade branch to produce and process for itself; industry, farming and localities not to rely only on the state''s share for export; contracts with cooperatives of some 200 hectares; the socialist transformation of private trade to go on.'
      n: '*Thông báo số 07-TB/TW, ngày 9 tháng 5 năm 1969, Về Hội nghị Ban Bí thư bàn công tác nội thương năm 1969* (the meeting of Mar. 14), signed for the chief of the office by Phạm Chung, his deputy. [[w.van-kien-dang-toan]], XXX, 65–71. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-04-28.vietnam-hanoi
      when: Apr. 28–May 3
      date: '1969-04-28'
      thread: vietnam-hanoi
      c: 'The Secretariat and the Standing Committee of the Council of Ministers on the 1970 state plan''s direction and control figures: the North''s economy through nearly four years of bombing, but gravely out of balance. A leap in agriculture urgent and possible; industry to serve it; transport restored; more home goods and better distribution; planning improved and policies and organization readied by the end of 1969.'
      n: '*Thông báo số 09-TB/TW, ngày 14 tháng 6 năm 1969, Về Hội nghị liên tịch Ban Bí thư và Thường vụ Hội đồng Chính phủ bàn về phương hướng của số kiểm tra kế hoạch nhà nước năm 1970* (the sittings of Apr. 28–May 3), signed by Phạm Chung, deputy chief of the Central Office. [[w.van-kien-dang-toan]], XXX, 198–205. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-04.vietnam-hanoi
      when: Apr.
      date: '1969-04'
      thread: vietnam-hanoi
      also:
      - vietnam-pacification
      c: 'Region V''s ninth committee conference on winning the people of the fringe areas and holding them, and building the liberated countryside: the enemy''s "accelerated pacification" set back again, his hold loosened, the spring offensive of 1969 weakening him further. The tasks and measures in the areas he still controls and in the liberated areas.'
      n: '*Nghị quyết Hội nghị Khu uỷ V lần thứ chín, tháng 4 năm 1969, Về công tác giành dân vùng ven và giữ dân xây dựng vùng giải phóng ở nông thôn* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
- add:
    entry:
      id: cal.1969-04.vietnam-hanoi-2
      when: Apr.
      date: '1969-04'
      thread: vietnam-hanoi
      c: 'Region V''s committee, resolution no. 08-NQKUV, on building the Party: the regional organization grown quickly in the fighting; the lessons of its building, its direction and tasks, and the work at hand.'
      n: '*Nghị quyết của khu uỷ V số 08-NQKUV, tháng 4 năm 1969, Về xây dựng đảng* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-05-07.vietnam-hanoi
      when: May 7
      date: '1969-05-07'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Secretariat''s cable no. 130 to the zone, city and provincial committees: by the Politburo''s decision the Front''s delegation will put forward at the next Paris session its "principles and main content of an overall solution to the South Vietnam problem," the Government''s delegation to support it in full; a diplomatic and political blow from strength. To be explained from *Nhân Dân*''s reports; neither "peace is near" nor "too many concessions"; the plan kept secret until then.'
      n: '*Điện của Ban Bí thư số 130, ngày 7 tháng 5 năm 1969, Về vấn đề tiến công ngoại giao*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 62–64. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1969-05-08.vietnam-hanoi
      when: May 8–10
      date: '1969-05-08'
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-paris
      c: 'The Sixteenth Plenum. The Politburo''s resolution no. 188-NQ/TW on the situation and tasks, of May 10: the Americans, their will shaken, de-escalating step by step and "de-Americanizing" the war. The task: to press the general offensive and uprising with the diplomatic attack, defeat the design of ending the war from strength and "de-Americanization," force the Americans to withdraw and the Saigon army to collapse, a decisive victory. Lê Duẩn on the South''s revolution; an outline on the diplomatic front: the halt and the four-party conference forced from Washington, the overall solution to be put forward.'
      n: '*Nghị quyết của Bộ Chính trị số 188-NQ/TW, ngày 10 tháng 5 năm 1969, Về tình hình và nhiệm vụ*, [[w.van-kien-dang-toan]], XXX, 118–43 (the task, 134); *Đề cương báo cáo Về tình hình và nhiệm vụ trên mặt trận đấu tranh ngoại giao*, the plenum''s, "May 8–10, 1969" (76 n.), 76–117; *Bài nói của đồng chí Lê Duẩn ... tại Hội nghị Trung ương lần thứ 16, tháng 5 năm 1969, Về nhiệm vụ cách mạng miền Nam*, from the tape, not revised by him (144 n.), 144–70. Made public: 2004. See [[cal.1968-08-29.vietnam-hanoi]]. Names: Lê Duẩn.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
      - name:le-duan
- add:
    entry:
      id: cal.1969-05-10.vietnam-hanoi
      when: May 10
      date: '1969-05-10'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh dates the last of his testament, May 10, 1969: the war against the Americans will be won; then he will go through North and South, and thank the fraternal and friendly countries. He is 79. His drafts of May 15, 1965, witnessed by Lê Duẩn, and of May 1968, "absolutely secret," ask for cremation and his ashes divided among North, Center and South; the text published in 1969 has neither.'
      n: '*Di chúc của Chủ tịch Hồ Chí Minh*, the drafts printed whole, "các bản in nguyên văn bản thảo di chúc" (the 1965 text, witnessed by Lê Duẩn, 256–59; May 1968, 260–64; May 10, 1969, 265), [[w.van-kien-dang-toan]], XXX, 253–65; the testament as published in 1969, 313–20. Made public: 1969, the published text; the drafts, 2004. See [[cal.1968-05.vietnam-hanoi]]. Names: Hồ Chí Minh, Lê Duẩn.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
      - name:le-duan
- add:
    entry:
      id: cal.1969-05-10.vietnam-hanoi-2
      when: May 10
      date: '1969-05-10'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 170-CT/TW: patriotic emulation pressed toward the fifth congress of heroes and emulation fighters; four years of emulation summed up and new drives begun; emulation conferences from the base to the Center, mostly done by the end of the third quarter.'
      n: '*Chỉ thị của Ban Bí thư số 170-CT/TW, ngày 10 tháng 5 năm 1969, Về việc đẩy mạnh phong trào thi đua yêu nước, tiến tới Đại hội Anh hùng, chiến sĩ thi đua lần thứ V*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 72–75. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-05-12.vietnam-hanoi
      when: May 12
      date: '1969-05-12'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 171-CT/TW: a round of political study within the Party for Hồ Chí Minh''s 79th birthday, on the recovery of production, the reform of economic and financial management and of the apparatus, and the revolutionary morality of cadres and members, with criticism and self-criticism; the main text the article by "T.L.," Hồ''s pen name, for the Party''s anniversary.'
      n: '*Chỉ thị của Ban Bí thư số 171-CT/TW, ngày 12 tháng 5 năm 1969, Về đợt sinh hoạt chính trị nội bộ nhân dịp mừng thọ Hồ Chủ tịch 79 tuổi*, signed for the Secretariat by Lê Văn Lương; "T.L.," the editors'' note (173 n.). [[w.van-kien-dang-toan]], XXX, 171–76. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1969-05-22.vietnam-hanoi
      when: May 22
      date: '1969-05-22'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 189-NQ/TW sets up a Board for the Study of the Southern Rural Economy, under the Secretariat: to study the direction, measures and policies for restoring and developing the South''s rural economy once peace returns.'
      n: '*Nghị quyết của Ban Bí thư số 189-NQ/TW, ngày 22 tháng 5 năm 1969, Về việc thành lập Ban Nghiên cứu kinh tế nông thôn miền Nam*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 177–78. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-05-24.vietnam-hanoi
      when: May 24
      date: '1969-05-24'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 191-NQ/TW on planning the building and reconstruction of Hanoi after the victory over the Americans: since 1954 Hanoi a city of industry, economy and culture. The new capital''s area the hills of Tam Dương and Bình Xuyên districts; the old city, nearly a thousand years old, to be rebuilt.'
      n: '*Nghị quyết của Bộ Chính trị số 191-NQ/TW, ngày 24 tháng 5 năm 1969, Về nhiệm vụ của Quy hoạch xây dựng và cải tạo Thủ đô Hà Nội sau ngày chiến thắng giặc Mỹ xâm lược*, signed for the Politburo by Phạm Văn Đồng. [[w.van-kien-dang-toan]], XXX, 179–87. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:pham-van-dong
- add:
    entry:
      id: cal.1969-05-27.vietnam-hanoi
      when: May 27
      date: '1969-05-27'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s cable to Phạm Hùng, answering his no. 253: the political situation favorable, his attention to troop proselytizing, seminars and opinion right. Lê Duẩn proposes a broad mass movement on the Front''s ten points: open legal bodies to discuss them, delegations to the National Assembly to demand a debate; Saigon''s comrades kept from complacency.'
      n: '*Điện của Ban Bí thư, ngày 27 tháng 5 năm 1969, Về đẩy mạnh đấu tranh chính trị* (the title the editors''), to "Anh Bảy Cường," signed Lê Văn Lương; "Anh Ba" is Lê Duẩn. [[w.van-kien-dang-toan]], XXX, 188. Made public: 2004. See [[cal.1969-05-07.vietnam-hanoi]]. Names: Phạm Hùng, Lê Duẩn.'
      tags:
      - polity:drv
      - polity:rvn
      - vis:only:drv
      - name:le-duan
- add:
    entry:
      id: cal.1969-06-09.vietnam-hanoi
      when: June 9
      date: '1969-06-09'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s cable no. 111 to the zone, city and provincial secretaries: the people''s congress in the South, led by the Party, has chosen the Provisional Revolutionary Government of the Republic of South Vietnam. A mark of the general offensive''s victories, a blow at the Saigon regime''s claim to legality, a step toward a broad coalition. To be told to the standing committees, spread only after Liberation Radio announces it; provinces to cable their twinned provinces in the South; illusions and impatience both guarded against.'
      n: '*Điện của Ban Bí thư số 111, ngày 9 tháng 6 năm 1969, Về việc thành lập Chính phủ Cách mạng lâm thời Cộng hoà miền Nam Việt Nam* (the title the editors''), signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 189–91. Made public: 2004.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1969-06-10.vietnam-hanoi
      when: June 10
      date: '1969-06-10'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s circular no. 235-TT/TW on hailing and supporting the Provisional Revolutionary Government, a national, democratic and coalition government with the Front''s forces at its core: to be explained from the congress''s documents and the press, with the Front''s ten-point solution; after the Government''s and the National Assembly Standing Committee''s statements of support and recognition, the Fatherland Front and mass bodies to follow.'
      n: '*Thông tri của Ban Bí thư số 235-TT/TW, ngày 10 tháng 6 năm 1969, Về việc hưởng ứng và ủng hộ Chính phủ Cách mạng lâm thời Cộng hoà miền Nam Việt Nam*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 192–95. Made public: 2004. See [[cal.1969-06-09.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1969-06-13.vietnam-hanoi
      when: June 13
      date: '1969-06-13'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 236-TT/TW dissolves the Region IV Transport Assurance Command and the command boards of Nghệ An, Hà Tĩnh and Quảng Bình, on the Central Military Commission''s and the transport Party committee''s proposal; the Council''s Standing Committee to hear the command''s report, settle its stores and give awards.'
      n: '*Thông tri của Ban Bí thư số 236-TT/TW, ngày 13 tháng 6 năm 1969, Về việc giải thể hệ thống chỉ huy thống nhất bảo đảm giao thông vận tải Khu IV*, signed for the Secretariat by Lê Văn Lương; circular no. 220 cited at XXIX, 324 (196 n.). [[w.van-kien-dang-toan]], XXX, 196–97. Made public: 2004. See [[cal.1968-08-02.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-06-18.vietnam-hanoi
      when: June 18
      date: '1969-06-18'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 237-TT/TW on pressing the investigation and denunciation of American war crimes, under circular no. 183-TT/TW of June 28, 1966: the Party groups and committees to see to it; the ministries of Culture, Defense and Public Security and the others concerned to collect the records and evidence.'
      n: '*Thông tri của Ban Bí thư số 237-TT/TW, ngày 18 tháng 6 năm 1969, Về việc đẩy mạnh hơn nữa công tác điều tra tố cáo tội ác của đế quốc Mỹ trong tình hình hiện nay*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXX, 206–8. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1969-06-18.vietnam-hanoi-2
      when: June 18
      date: '1969-06-18'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 238-TT/TW on spreading and enforcing the statute of the higher-level farm cooperatives, adopted by the Government: part of the campaign for the members'' collective mastery; each cooperative''s own rules drawn up; about a month in each base, after the tenth-month transplanting.'
      n: '*Thông tri của Ban Bí thư số 238-TT/TW, ngày 18 tháng 6 năm 1969, Về việc phổ biến và thi hành Điều lệ hợp tác xã sản xuất nông nghiệp*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXX, 209–11. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-06-19.vietnam-hanoi
      when: June 19
      date: '1969-06-19'
      thread: vietnam-hanoi
      also:
      - laos
      c: 'The Politburo''s resolution no. 190-NQ/TW on helping "Party X," the Lao People''s Revolutionary Party, build the economy and culture of its liberated zone, run since 1965 on the scale of a state: the aid plans ill fitted to Hanoi''s budget, the advisers too few, transport of goods poor. The three-year plan of aid, 1968–70, to be pressed, a new plan prepared for a lull; the aid organization at home strengthened.'
      n: '*Nghị quyết của Bộ Chính trị số 190-NQ/TW, ngày 19 tháng 6 năm 1969, Về việc giúp Đảng X đẩy mạnh xây dựng kinh tế, phát triển văn hóa ở vùng giải phóng*; "Đảng X," the editors'' note (212 n.). [[w.van-kien-dang-toan]], XXX, 212–18. Made public: 2004.'
      tags:
      - polity:drv
      - polity:laos
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1969-06-25.vietnam-hanoi
      when: June 25
      date: '1969-06-25'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 239-TT/TW on the care and education of children, after the article by "T.L.," Hồ Chí Minh, for June 1: committees, the children''s committee, the schools, the Youth Union and parents to answer for their morals, schooling, health and play, before the 1969–70 school year.'
      n: '*Thông tri của Ban Bí thư số 239-TT/TW, ngày 25 tháng 6 năm 1969, Về việc chăm sóc và giáo dục thiếu niên, nhi đồng*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXX, 219–21. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1969-07.vietnam-hanoi
      when: July
      date: '1969-07'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN''s ninth conference, early in July, under the Politburo''s resolution: more than a year of the general offensive and uprising, a new situation. The enemy''s strategy and the tasks ahead; military attack and the building of the armed forces; mass work, the political struggle in town and country, troop proselytizing; the revolutionary government strengthened, security against the enemy''s espionage.'
      n: '*Nghị quyết Hội nghị trung ương cục lần thứ chín, tháng 7 năm 1969* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered; a passage perhaps lost, by the editors'' note, which they place at p. 365). Made public: 2004. See [[cal.1968-10.vietnam-hanoi]]. Check: the conference''s month: "early July 1969" by the resolution, August by COSVN''s resolution of Oct. 5; it extends to June 1970 the recruiting drive of the "Hồ Chí Minh class" just past.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1969-08-02.vietnam-hanoi
      when: Aug. 2
      date: '1969-08-02'
      thread: vietnam-hanoi
      c: 'The Central Committee''s letter to the tenth congress of the Romanian Communist Party: greetings on Romania''s industry and agriculture; thanks for its support.'
      n: '*Thư của Ban chấp hành Trung ương Đảng Lao động Việt Nam, ngày 2 tháng 8 năm 1969, gửi Đại hội lần thứ X Đảng Cộng sản Rumani* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Check: whether *Nhân Dân* printed it.'
      tags:
      - polity:drv
      - polity:romania
      - vis:only:drv+romania
- add:
    entry:
      id: cal.1969-08-09.vietnam-hanoi
      when: Aug. 9
      date: '1969-08-09'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution reorganizes the Council of Ministers'' economic bodies: Heavy Industry split into a Ministry of Power and Coal, a Ministry of Engineering and Metals and a General Department of Chemicals; a Ministry of Food; Materials a ministry; a Government Inspection Committee; the Prime Minister''s industry, agriculture and finance offices merged into one Economic Office. Đỗ Mười Deputy Prime Minister and its head; Trần Danh Tuyên Materials, Nguyễn Hữu Mai Power and Coal, Đinh Đức Thiện Engineering and Metals, Ngô Minh Loan, from the Peking embassy, Food; Nguyễn Thanh Bình the Inspection Committee.'
      n: '*Nghị quyết của Bộ Chính trị số 1733-NQ/TW* (so printed), *ngày 9 tháng 8 năm 1969, Về việc sửa đổi và thành lập một số tổ chức mới thuộc Hội đồng Chính phủ*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXX, 222–24. Made public: 2004. Check: the number, 1733, beside nos. 187–194 of 1969. Names: Đỗ Mười, Trần Danh Tuyên, Nguyễn Hữu Mai, Đinh Đức Thiện, Ngô Minh Loan, Nguyễn Thanh Bình.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-09-02.vietnam-hanoi
      when: Sept. 2
      date: '1969-09-02'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Hồ Chí Minh dies at 9:47 a.m., National Day, of a heart attack, at 79. The Politburo announces it as Sept. 3, so that the day of his death should not fall on the nation''s day of celebration.'
      n: '[[w.van-kien-dang-toan]], XXX, 228–29 n. (the editors'' note, from the Politburo''s notice no. 151-TB/TW of Aug. 19, 1989, on the testament and the day of the death). Made public: 1989, the day. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1969-09-03.vietnam-hanoi
      when: Sept. 3
      date: '1969-09-03'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Central Committee''s call to cadres, Party members, soldiers, the people and Vietnamese abroad: Hồ Chí Minh has died at 9:47 a.m., Sept. 3, in Hanoi, after an illness and a severe heart attack. Grief to be turned into revolutionary action; his line, his thought and his ways followed: "Nothing is more precious than independence and freedom"; the war and socialist construction carried to complete victory.'
      n: '*Lời kêu gọi của Ban Chấp hành Trung ương Đảng lao động Việt Nam*, Sept. 3, 1969, from *Nhân Dân*, Sept. 5, 1969. [[w.van-kien-dang-toan]], XXX, 232–36. See [[cal.1969-09-02.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1969-09-04.vietnam-hanoi
      when: Sept. 4
      date: '1969-09-04'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The special communiqué of the Central Committee, the National Assembly''s Standing Committee, the Council of Ministers and the Fatherland Front''s presidium: Hồ Chí Minh dead. A state funeral; seven days of mourning, Sept. 4–10; a solemn memorial; a State Funeral Committee of 26, Lê Duẩn its head, Tôn Đức Thắng, Trường Chinh and Phạm Văn Đồng his deputies.'
      n: '*Thông cáo đặc biệt*, Hanoi, Sept. 4, 1969, from *Nhân Dân*, Sept. 5, 1969, [[w.van-kien-dang-toan]], XXX, 228–31; the committee''s list, from *Nhân Dân*, Sept. 5, 237–39. See [[cal.1969-09-03.vietnam-hanoi]]. Names: Hồ Chí Minh, Lê Duẩn, Tôn Đức Thắng, Trường Chinh, Phạm Văn Đồng.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - name:le-duan
      - name:ton-duc-thang
      - name:truong-chinh
      - name:pham-van-dong
- add:
    entry:
      id: cal.1969-09-04.vietnam-hanoi-2
      when: Sept. 4
      date: '1969-09-04'
      thread: vietnam-hanoi
      c: 'The Politburo''s directive no. 172-CT/TW on the state funeral: the State Funeral Committee to run it at the center, the provinces at home; no feasts, receptions, shows, sports or films Sept. 4–10; grief turned to action, vigilance against the enemy. With it four slogans, the rules of mourning, the flags and armbands, and the committee''s programs, of Sept. 5, for the lying in state at Ba Đình Hall from Sept. 6 and the memorial.'
      n: '*Chỉ thị của Bộ Chính trị số 172-CT/TW, ngày 4 tháng 9 năm 1969, Về việc tổ chức Lễ quốc tang Hồ Chủ tịch*, signed for the Politburo by Lê Duẩn; the attached papers, 245–52. [[w.van-kien-dang-toan]], XXX, 240–52. Made public: 2004. See [[cal.1969-09-04.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
      - name:le-duan
- add:
    entry:
      id: cal.1969-09-09.vietnam-hanoi
      when: Sept. 9
      date: '1969-09-09'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The memorial for Hồ Chí Minh. Lê Duẩn reads the Central Committee''s eulogy: "Bidding you farewell, we swear," five oaths: to hold high the banner of national independence, fight on to victory over the Americans, liberate the South, defend the North and reunite the country; to strive for the ideals of socialism and communism; to guard the Party''s unity "like the pupil of our eye"; to restore and strengthen the unity of the socialist camp and the fraternal parties; to learn all their lives from his morals and ways.'
      n: '*Điếu văn của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, do đồng chí Lê Duẩn ... đọc tại Lễ truy điệu trọng thể Hồ Chủ tịch, ngày 9 tháng 9 năm 1969*. [[w.van-kien-dang-toan]], XXX, 321–27 (the oaths, 322–26). See [[cal.1969-09-04.vietnam-hanoi-2]]. Names: Hồ Chí Minh, Lê Duẩn.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - name:le-duan
- add:
    entry:
      id: cal.1969-09-29.vietnam-hanoi
      when: Sept. 29
      date: '1969-09-29'
      thread: vietnam-hanoi
      c: 'The Politburo''s directive no. 173-CT/TW: a round of political study, "Learn from and follow President Hồ''s Testament." Party members and the people to discuss the testament, the Central Committee''s eulogy and its call; an emulation movement; committees to review their unity, democracy and leadership, members their morals; economic management and the Party''s building strengthened.'
      n: '*Chỉ thị của Bộ Chính trị số 173-CT/TW, ngày 29 tháng 9 năm 1969, Về đợt sinh hoạt chính trị "Học tập và làm theo Di chúc của Hồ Chủ tịch"*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXX, 330–36. Made public: 2004. See [[cal.1969-09-09.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
      - name:truong-chinh
- add:
    entry:
      id: cal.1969-10-05.vietnam-hanoi
      when: Oct. 5
      date: '1969-10-05'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN''s Standing Committee, resolution no. 12-NQNT, on the apparatus of the Provisional Revolutionary Government, under the ninth conference''s resolution: the President''s Office; the ministries of Defense, over all armed forces in the South, Foreign Affairs, Interior, Economy and Finance, Information and Culture, Education and Youth, Health, Social Affairs and the Wounded, Justice; the Government''s delegations in the regions; the advisory council; the government''s Party group.'
      n: '*Nghị quyết của Thường vụ Trung ương Cục số 12-NQNT, ngày 5 tháng 10 năm 1969, Về tổ chức bộ máy Chính phủ Cách mạng lâm thời* (the appendix); it dates the ninth conference "tháng 8-1969." [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004. See [[cal.1969-06-09.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-10-06.vietnam-hanoi
      when: Oct. 6
      date: '1969-10-06'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 241-TT/TW on the Finance and Trade Boards: set up at every level by resolution no. 137-NQ/TW of Apr. 12, 1966, some not yet complete, Lạng Sơn''s dissolved on its own without the Center''s leave. To be kept and strengthened.'
      n: '*Thông tri của Ban Bí thư số 241-TT/TW, ngày 6 tháng 10 năm 1969, Về tổ chức và lãnh đạo các Ban Tài chính thương nghiệp các cấp*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXX, 337–38. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-10-24.vietnam-hanoi
      when: Oct. 24
      date: '1969-10-24'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s cable no. 00 to COSVN, Region V and Trị–Thiên: on the Moratorium of Oct. 15 millions of Americans in 1,200 towns, some legislators, governors and mayors among them, demanded that Nixon bring all the troops home; some American civilians and soldiers in Vietnam joined. The cities of the South not ready for it; for the new round in mid-November, a broad movement in Saigon–Chợ Lớn, of students, workers and Buddhists, and of the Thiệu–Kỳ–Khiêm opposition such as Trần Ngọc Liễng, demanding that Nixon withdraw at once and all.'
      n: '*Điện của Ban Bí thư số 00, ngày 24 tháng 10 năm 1969, Về việc phát động phong trào đấu tranh chính trị rộng lớn ở miền Nam* (the title the editors''). [[w.van-kien-dang-toan]], XXX, 339–41. Made public: 2004. Names: Nixon, Thiệu, Kỳ, Khiêm, Trần Ngọc Liễng.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
      - name:nixon-richard-m
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
      - name:tran-thien-khiem
- add:
    entry:
      id: cal.1969-10-24.vietnam-hanoi-2
      when: Oct. 24–25
      date: '1969-10-24'
      thread: vietnam-hanoi
      c: 'The Secretariat with the Standing Committee of the Council of Ministers, the State Planning Commission and Hanoi''s leaders on the cities in 1970, a year after the bombing ended: Hanoi, Haiphong, Nam Định and the Quảng Ninh industrial zone first. Enterprises regrouped where best for production, crafts restored; two tasks, an eight-hour day of real productivity and the life of workers, cadres and townspeople eased; indirect staff cut.'
      n: '*Thông báo số 12-TB, ngày 29 tháng 10 năm 1969, Về Hội nghị Ban Bí thư bàn vấn đề giải quyết đời sống ở thành phố trong năm 1970* (the meeting of Oct. 24–25). [[w.van-kien-dang-toan]], XXX, 342–49. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-10-30.vietnam-hanoi
      when: Oct. 30
      date: '1969-10-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'COSVN''s Standing Committee, resolution no. 14-NQNT, on pressing guerrilla war in the general offensive and uprising: its strategic place, its present state and urgent tasks, the forms of its organization and action.'
      n: '*Nghị quyết của Thường vụ Trung ương Cục số 14-NQNT, ngày 30 tháng 10 năm 1969, Về việc đẩy mạnh chiến tranh du kích trong tổng công kích, tổng khởi nghĩa* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-11-12.vietnam-hanoi
      when: Nov. 12
      date: '1969-11-12'
      thread: vietnam-hanoi
      c: 'The Central Committee''s letter to the thirty-first congress of the Communist Party of Great Britain: greetings on its fight against the monopolies, for Britain''s leaving NATO and the removal of American bases; thanks for its support of Vietnam.'
      n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, ngày 12 tháng 11 năm 1969, gửi Đại hội lần thứ XXXI Đảng Cộng sản Anh* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Check: whether *Nhân Dân* printed it.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-11-20.vietnam-hanoi
      when: Nov. 20
      date: '1969-11-20'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Politburo''s resolution no. 194-NQ/TW on the American pilots captured in the North: not prisoners of war, Hanoi not bound by the Geneva Convention of 1949, but its relevant points to be applied in a humane policy, to win American and world opinion. Food, clothing and medicine kept as now; healthy quarters, exercise and labor; political education; a card home monthly, a parcel every two months; those held in secret allowed cards by early 1970; belongings kept; religious services; the dead buried together for return.'
      n: '*Nghị quyết của Bộ Chính trị số 194-NQ/TW, ngày 20 tháng 11 năm 1969, Về chính sách đối với giặc Mỹ lái máy bay bị bắt ở miền Bắc*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXX, 350–52. Made public: 2004.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
      - name:nguyen-duy-trinh
- add:
    entry:
      id: cal.1969-11-21.vietnam-hanoi
      when: Nov. 21
      date: '1969-11-21'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 242-TT/TW on the industrious, simple and honest life of the revolutionary, against abuse and embezzlement of state and collective property: some cadres abuse their posts, keep slush funds, set their own perquisites, take state materials for private houses. Slush funds forbidden and returned to the budget; abuse of office forbidden; the people to criticize and watch over cadres.'
      n: '*Thông tri của Ban Bí thư số 242-TT/TW, ngày 21 tháng 11 năm 1969, Về việc phát huy lối sống cần cù, giản dị, liêm khiết của người cách mạng; chống lạm dụng, tham ô tài sản của Nhà nước và của tập thể*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 353–56. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1969-11-29.vietnam-hanoi
      when: Nov. 29
      date: '1969-11-29'
      thread: vietnam-hanoi
      also:
      - soviet-union
      c: 'The Politburo, in the morning, decides to preserve Hồ Chí Minh''s body for the long term and build his mausoleum, open to visitors in 1971: white pillow and mattress, khaki clothes of his own cut, a thin blanket, his sandals in a small glass case. The mausoleum modern yet national, solemn yet simple, at historic Ba Đình; an agreement to be signed with the Soviet Union for its help; the Central Military Commission to guard the body, the Architecture Ministry to build.'
      n: '*Thông báo của Ban Bí thư số 14-TB/TW, ngày 4 tháng 12 năm 1969, Quyết định của Bộ Chính trị về việc giữ gìn thi hài Hồ Chủ tịch và xây dựng lăng mộ của Người* (the session of Nov. 29); placed by subject, out of date order, by the editors (328 n.). [[w.van-kien-dang-toan]], XXX, 328–29. Made public: 2004. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:ussr
      - vis:only:drv
      - name:ho-chi-minh
- cite:
    id: 'cal.1968-01.vietnam-tet'
    item: '[[w.van-kien-dang-toan]], XXIX, 1–161 (the Fourteenth Plenum, January 1968: Lê Duẩn''s speech, from the tape, not revised by him, the Politburo''s resolution debated with the comrades of COSVN, Region V and Trị–Thiên, 1–41; the plenum''s resolution, "Anh dũng tiến lên, thực hiện tổng công kích và tổng khởi nghĩa," 41–69: the bulk of the Saigon army destroyed or broken up, its government overthrown at every level, the American will to aggression crushed, 51; the State Planning Commission''s report, 69–161; the copy''s folios)'
    units: 'A'
