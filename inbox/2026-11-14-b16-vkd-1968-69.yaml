patch: 2026-11-14-b16-vkd-1968-69
by: 'Claude (batch 16, reader 3: Văn kiện Đảng toàn tập, vols. 29 and 30, 1968–69), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1968-01-12.vietnam-hanoi
      when: Jan. 12
      date: '1968-01-12'
      thread: vietnam-hanoi
      c: 'The Secretariat''s secret cable no. 06 to the Vĩnh Linh Party committee: the fighting there fierce, much of the population evacuated, life and organization disrupted. The committee right to put ideological work and the base''s organization first; production for self-help, food and vegetables in every team and family; air defense, order, counter-commando and counter-espionage work, better shelters.'
      n: '*Điện mật của Ban Bí thư số 06, ngày 12 tháng 1 năm 1968*, to the Party committee of Vĩnh Linh, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 153–55. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-01-15.vietnam-hanoi
      when: Jan. 15
      date: '1968-01-15'
      thread: vietnam-hanoi
      c: 'The Secretariat''s secret cable no. 09 to the zone, city and provincial committees: at Tết, delegations of Party, government and mass bodies to visit the army, police, youth shock brigades and the units at stations, bridges, roads and power plants under attack. Small keepsakes only, no collections among the people; families of soldiers, the wounded and the dead, and the children evacuated from Vĩnh Linh and Quảng Bình, to be visited too.'
      n: '*Điện mật của Ban Bí thư số 09, ngày 15 tháng 1 năm 1968*. [[w.van-kien-dang-toan]], XXIX, 156–57. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-01-16.vietnam-hanoi
      when: Jan. 16
      date: '1968-01-16'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 173-NQ/TW sets up the Central Committee''s International Affairs Board, under the eleventh, twelfth and thirteenth plenums'' resolutions on foreign work: to propose foreign policy to the Center, review the foreign plans of the Party, state and mass bodies, and coordinate them. Nguyễn Duy Trinh its head; Xuân Thủy standing deputy; Nguyễn Văn Kỉnh and Lê Toàn Thư deputies.'
      n: '*Nghị quyết của Bộ Chính trị số 173-NQ/TW, ngày 16 tháng 1 năm 1968, về thành lập Ban công tác Quốc tế của Trung ương Đảng*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIX, 158–59. Made public: 2004. Names: Nguyễn Duy Trinh, Xuân Thủy, Nguyễn Văn Kỉnh, Lê Toàn Thư.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:nguyen-duy-trinh
      - name:xuan-thuy
- add:
    entry:
      id: cal.1968-01-16.vietnam-hanoi-2
      when: Jan. 16
      date: '1968-01-16'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 174-NQ/TW dissolves the People''s International Board, its work for the trade unions, youth and women passing to the new International Affairs Board, and forms a Party group over the peace committee, the Afro-Asian solidarity committee and the friendship societies: Nguyễn Văn Kỉnh its secretary, Phạm Hồng deputy.'
      n: '*Nghị quyết của Ban Bí thư số 174-NQ/TW, ngày 16 tháng 1 năm 1968, về giải thể Ban Quốc tế Nhân dân và thành lập Đảng đoàn các tổ chức đoàn kết, hữu nghị*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIX, 160–61. Made public: 2004. Names: Nguyễn Văn Kỉnh, Phạm Hồng.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-01-21.vietnam-hanoi
      when: Jan. 21
      date: '1968-01-21'
      thread: vietnam-hanoi
      also:
      - vietnam-tet
      - vietnam
      c: 'The Politburo''s secret cable to Phạm Hùng, Võ Chí Công and Trần Văn Quang: a second front to be formed, the "Alliance of National, Democratic and Peace Forces," in the cities above all, its central body to appear in Saigon before or a few days after Tết; independent of the Liberation Front but allied with it. Its slogans independence, freedom, peace and neutrality, food and land, American withdrawal, a national coalition government; its flag red, blue and red with a yellow star. The revolutionary government in the South to be called the Government of the Republic of Vietnam. COSVN to carry it out.'
      n: '*Điện mật của Bộ Chính trị, ngày 21 tháng 1 năm 1968*, to "anh Bảy Cường, anh Năm Công, anh Bảy Tiến" (Phạm Hùng, Võ Chí Công and Trần Văn Quang, the editors'' notes), signed "Bộ Chính trị." [[w.van-kien-dang-toan]], XXIX, 162–64. Made public: 2004. Names: Phạm Hùng, Võ Chí Công, Trần Văn Quang.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1968-02-01.vietnam-hanoi
      when: Feb. 1
      date: '1968-02-01'
      thread: vietnam-hanoi
      also:
      - vietnam-tet
      c: 'The Secretariat''s secret cable no. 23 to the zone, city and provincial committees: by first reports, on Jan. 30 and 31 the forces and people of the South struck nearly all the enemy''s vital points, towns, airfields and bases, and the cities'' people rose. The news to be spread at once; production, transport, air defense, evacuation and order kept up; letters and cables to the twinned provinces of the South.'
      n: '*Điện mật của Ban Bí thư số 23, ngày 1 tháng 2 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 167–68. Made public: 2004.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1968-02-04.vietnam-hanoi
      when: Feb. 4–5
      date: '1968-02-04'
      thread: vietnam-hanoi
      also:
      - vietnam-tet
      c: 'COSVN''s Standing Committee meets the evening of Feb. 4 on the key zone, Saigon, and resolves Feb. 5 with the Region''s Military Commission: the attack a great first success, struck on time and on target, the Saigon administration and command paralyzed; but it fell short, many spearhead battalions never reached the city to join the sappers, the people were not roused to rise; "a concrete opportunity" lost, by faults of planning and command. The new plan: hold on, fight on inside and around Saigon, encircle it in several rings, toward the final blow.'
      n: '*Nghị quyết của Thường vụ Trung ương cục và Quân uỷ Miền, ngày 5 tháng 2 năm 1968, Về quân sự đối với khu trọng điểm* (the appendix). [[w.van-kien-dang-toan]], XXIX, 1267–74 (folios as the copy prints them). Made public: 2004. See [[cal.1968-02-01.vietnam-tet]].'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - vis:only:drv
- add:
    entry:
      id: cal.1968-02-08.vietnam-hanoi
      when: Feb. 8
      date: '1968-02-08'
      thread: vietnam-hanoi
      also:
      - vietnam-tet
      - vietnam
      c: 'The Politburo''s secret cable no. 44 to Phạm Hùng and COSVN on the Alliance''s emergency manifesto, broadcast Feb. 7: it says nothing of overthrowing Thiệu and Kỳ, may make the Alliance seem neutral between the Americans and the Front, and leaves out the socialist countries. Not to be carried in the North; in the South, if broadcast already, to be passed over; COSVN to draft another. The alliances of Huế and central Trung Bộ, with good manifestos, not yet to join Saigon''s. Henceforth COSVN to cable its major statements in advance; the Politburo''s directives to be signed by the Politburo, particular matters by Lê Đức Thọ or Lê Văn Lương.'
      n: '*Điện mật của Bộ Chính trị số 44, ngày 8 tháng 2 năm 1968*, to "anh Bảy Cường và Trung ương Cục," signed "Bộ Chính trị." The calls of the Front''s central committee and the liberation armed forces'' command, and the command''s special communiqué no. 2, drafted in the North on the Politburo''s instructions (171). [[w.van-kien-dang-toan]], XXIX, 169–72. Made public: 2004. See [[cal.1968-01-21.vietnam-hanoi]]. Names: Phạm Hùng, Thiệu, Kỳ, Lê Đức Thọ, Lê Văn Lương.'
      tags:
      - polity:drv
