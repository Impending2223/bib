    text: 'Check: the volume prints the plenum''s own resolution, titled "Anh dũng tiến lên, thực hiện tổng công kích và tổng khởi nghĩa, giành thắng lợi quyết định cho sự nghiệp chống Mỹ, cứu nước," dated only January 1968 (XXIX, 41); Lê Duẩn''s speech has the Politburo''s resolution laid before the plenum (1–2).'
- check:
    id: 'cal.1968-02.vietnam'
    text: 'Check: the Politburo''s cables of Jan. 21 and Feb. 8, 1968 (*Văn kiện Đảng toàn tập*, XXIX, 162–64, 169–71) have the Alliance ordered formed, its central body to appear in Saigon before or a few days after Tết, and its emergency manifesto broadcast Feb. 7; those of Huế and central Trung Bộ already formed by Feb. 8.'
- cite:
    id: 'cal.1968-04-03.vietnam'
    item: '[[w.van-kien-dang-toan]], XXIX, 201–3 (the Politburo''s secret cable to COSVN of Apr. 3: the North has declared it will name a representative to contact the American one on the unconditional end of the bombing so that talks can begin, 202; not Johnson''s answer or the American note)'
    units: 'A'
- cite:
    id: 'cal.1968-07-20.vietnam'
    item: '[[w.van-kien-dang-toan]], XXIX, 571–75 (*Lời kêu gọi của Chủ tịch Hồ Chí Minh nhân ngày 20 tháng 7*, from his *Toàn tập*, vol. 12 (2000), 371–74: since the spring of 1968 the resistance in the South "tiến lên một thời kỳ mới" (into a new period); the aggressors "đang ở bước đường cùng" (at the end of their road); peace the day the Americans end the war and the bombing and withdraw their and their allies'' troops)'
    units: 'A, B'
- cite:
    id: 'cal.1968-10-10.vietnam-paris'
    item: '[[w.van-kien-dang-toan]], XXIX, 940–48 (the Politburo''s secret cable no. 320 to COSVN, Oct. 10: a four-party conference agreed on two conditions, that the Americans discuss it with the Front and that the Saigon government change its policy, 945; the copy''s folios; not the interval between the halt and the talks)'
    units: 'A'
