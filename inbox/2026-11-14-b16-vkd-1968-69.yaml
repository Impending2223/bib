- cite:
    id: 'cal.1968-11-03.vietnam'
    item: '[[w.van-kien-dang-toan]], XXIX, 981–84 (*Lời kêu gọi của Chủ tịch Hồ Chí Minh*, "Cả nước tiến lên đánh thắng giặc Mỹ xâm lược," Nov. 3, 1968, from his *Toàn tập*, vol. 12 (2000), 406–8: the halt of Nov. 1 a glorious victory, 3,200 aircraft shot down; thanks to the socialist countries and the world''s people, "kể cả nhân dân tiến bộ Mỹ" (the progressive American people too); all American and allied troops to leave the South; the South to attack and rise without letup and win complete victory)'
    units: 'A-C'
