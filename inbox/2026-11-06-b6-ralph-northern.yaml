      when: Nov., mid
      date: 1965-11
      thread: king
      c: 'Chicago. A meeting of church-based inner-city development staff, Bevel absent. A participant asks how SCLC is gaining
        "technical know-how and especially political know-how." William Robinson, of the Church Federation of Greater Chicago,
        CCCO''s treasurer, a former Republican legislator: "The Movement must make up its mind if Chicago is really to be
        one of the demonstration centers for the urban North."'
      n: '[[w.ralph-northern-protest]], 54. Check: the day. To check: Bevel, "SCLC—Chicago Project," Nov. 8, 1965, SCLC papers,
        MLK Library (cited by [[w.ralph-northern-protest]], 54 n.30b). See [[cal.1965-09.king]].'
      tags:
      - state:il
      - city:chicago
