      when: July, late
      date: 1966-07
      thread: open-housing
      c: Chicago. Archbishop Cody, through his assistant, Father Edward Egan, relays his indignation that the Chicago Freedom
        Movement has made St. Gall's, whose pastor works for interracial understanding, a target of its early Gage Park marches.
      n: '[[w.ralph-northern-protest]], 146. Check: the day. To check: "Chicago Debriefing," Maria Pappalardo to Barbara Moffett,
        Charlotte Meachem and others, July 29, 1966, AFSC papers, 1966 CRD Housing Program, box 4, AFSC Archives (cited by
        [[w.ralph-northern-protest]], 146 n.49a); [[w.anderson-confronting-the-color-line]], 220–22 (cited by [[w.ralph-northern-protest]],
        146 n.49b). See [[cal.1966-07-24.open-housing]].'
