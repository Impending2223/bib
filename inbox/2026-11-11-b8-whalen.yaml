      date: 1964-02
      thread: civil-rights-bill
      c: 'Humphrey, floor manager of H.R. 7152, to newsmen: he will not guess how long it will take; a spiritually exhausting
        struggle, with a lot of strain on personal friendships. "Before this is over, I''ll be everybody''s SOB. It can''t
        be helped."'
      n: '[[w.whalen-longest-debate]], 136–37. Names: Humphrey. Check: the day and the month; Whalen, 136–37, places it as
        Humphrey takes the floor management, before the strategy session of Feb. 28.'
