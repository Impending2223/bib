- cite:
    id: cal.1963-04-16.alabama-birmingham
    item: '[[w.whalen-longest-debate]], xviii (the letter written from his cot in jail, in answer to a group of clergymen;
      quoted; not the day or the number of the clergymen)'
    units: '?'
- cite:
    id: cal.1963-05-02.alabama
    item: '[[w.whalen-longest-debate]], xviii–xix (May 2: more than a thousand school children march in Birmingham, singing,
      and are hauled off to jail; not the number arrested)'
    units: '?'
- check:
    id: cal.1963-05-02.alabama-birmingham
    text: 'Check: Whalen, xix, has King say that night: "Don''t worry about your children who are in jail. The eyes of the
      world are on Birmingham. We''re going on in spite of dogs and fire hoses. We''ve gone too far to turn back."'
- cite:
    id: cal.1963-05-03.alabama-birmingham
    item: '[[w.whalen-longest-debate]], xviii–xix (Connor and his men on the marching children with billy clubs, police dogs
      and fire hoses, which Whalen has on May 2; not Kelly Ingram Park)'
    units: '?'
- check:
    id: cal.1963-05-03.alabama-birmingham
    text: 'Check: Whalen, xviii–xix, puts the clubs, dogs and fire hoses at the children''s march of May 2, and King''s words
      to the parents that night.'
- variant:
    id: cal.1963-05-03.alabama-birmingham
    unit: B
    witness: w.whalen-longest-debate
    reads: Bull Connor and his men descended on the culprits with billy clubs, police dogs, and fire hoses [the children of
      May 2]
    at: xviii–xix
- cite:
    id: cal.1963-06-11.alabama
    item: '[[w.whalen-longest-debate]], 17 (Wallace in the doorway, refusing the proclamation Katzenbach hands him; the President
      federalizes the Alabama National Guard; Wallace backs off and the two students are admitted; not the place or the hour)'
    units: '?'
- cite:
    id: cal.1963-06-12.mississippi
    item: '[[w.whalen-longest-debate]], 17 (Evers shot in his driveway "barely three hours after Kennedy''s address"; not
      the place or the arrest)'
    units: '?'
- variant:
    id: cal.1963-06-12.mississippi
    unit: B
    witness: w.whalen-longest-debate
    reads: He died several hours later.
    at: '17'
- check:
    id: cal.1963-06-12.mississippi
    text: 'Check: Whalen, 17, has Evers shot "barely three hours after" the President''s address, and dying "several hours
      later" (the entry: after midnight; within the hour).'
- cite:
    id: cal.1963-08-28.march-on-washington
    item: '[[w.whalen-longest-debate]], 24–26 ("almost a quarter of a million people" on the Mall; Randolph presiding; Rustin
      and Randolph the organizers; King''s "I have a dream"; the leaders at the White House about 5 p.m.; not the route, Lewis''s
      text or King as the last speaker)'
    units: '?'
- variant:
    id: cal.1963-08-28.march-on-washington
    unit: B
    witness: w.whalen-longest-debate
    reads: when the several hundred thousand people drifted away through the trees and across the lawns
    at: '26'
- cite:
    id: cal.1963-09-09.alabama
    item: '[[w.whalen-longest-debate]], 33 (the five federal district judges enjoin the troopers; the governor replaces them
      with national guardsmen; Kennedy federalizes the Guard and orders it from the schools; integration proceeds; no days;
      not the pupils at Birmingham and Mobile)'
    units: '?'
- cite:
    id: cal.1963-09-15.alabama
    item: '[[w.whalen-longest-debate]], 33–34 (the morning of Sept. 15, a bomb under the steps of the church; four girls killed,
      twenty injured; police kill two more youngsters in the rioting; not dynamite, the names, the afternoon or the two boys
      as shot by others)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession
    item: '[[w.whalen-longest-debate]], 71 (the words at Andrews, "I will do my best ... That is all I can do. I ask for your
      help--and God''s"; also the oath in the plane at Love Field, 98 minutes after Kennedy died, not the hour or the judge)'
    units: C
- variant:
    id: cal.1963-11-22.succession
    unit: A
    witness: w.whalen-longest-debate
    reads: Johnson had taken the oath of office in the plane as it stood on the runway at Love Field, Dallas, just 98 minutes
      after John Kennedy died.
    at: '71'
- check:
    id: cal.1963-11-22.succession
    text: 'Check: Whalen, 71, has the oath "just 98 minutes after John Kennedy died" (the entry: 2:38 p.m.).'
- cite:
    id: cal.1963-11-22.succession-3
    item: '[[w.whalen-longest-debate]], 71 (the helicopter, "the seven-minute ride," from Andrews to the White House; not
      the passengers or the talk)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-10
    item: '[[w.whalen-longest-debate]], 72 (Johnson, from his suite in the Executive Office Building, calls Truman and Eisenhower
      "to discuss funeral plans"; not the room, the hour or the words)'
    units: B
- cite:
    id: cal.1963-11-23.succession-3
    item: '[[w.whalen-longest-debate]], 74 (the address to a joint session set for Wednesday, Nov. 27, among his first decisions
      at 3 a.m., Nov. 23; not McCormack, Robert Kennedy or the words)'
    units: '?'
- check:
    id: cal.1963-11-23.succession-3
    text: 'Check: Whalen, 74, has Johnson decide at The Elms, at 3 a.m. on Nov. 23, to address Congress "on Wednesday, November
      27, the day before Thanksgiving" (the entry: Tuesday first, Wednesday later that day).'
- cite:
    id: cal.1964-01-17.robert-kennedy
    item: '[[w.whalen-longest-debate]], 97 (Johnson sends the Attorney General to Indonesia to settle the dispute between
      Sukarno and Malaysia; not the Tokyo talks)'
    units: A
- cite:
    id: cal.1964-01-23.robert-kennedy
    item: '[[w.whalen-longest-debate]], 98 (a cease-fire agreement between the leaders of the two nations, and a promise to
      begin negotiations on their border dispute; not the place, Sukarno''s order or the foreign ministers'' meeting)'
    units: '?'
- cite:
    id: cal.1964-06-06.laos
    item: '[[w.whalen-longest-debate]], 194 (two U.S. aircraft shot down over Laos "on two successive days," over the weekend
      of June 6-7; not the crews or the place)'
    units: '?'
- cite:
    id: cal.1964-06-19.congress
    item: '[[w.whalen-longest-debate]], 217 (Kennedy and Bayh by private plane to New England after the final roll call on
      H.R. 7152; fog and a thunderstorm; the plane plunges into an apple orchard; the pilot and a member of Kennedy''s staff
      killed; Bayh drags Kennedy from the plane; Kennedy seriously injured; not Moss''s name, the broken back or the place)'
    units: '?'
- check:
    id: cal.1964-06-19.congress
    text: 'Check: Whalen, 217, has the convention at Springfield and the plane approaching Barnes Airport, Westfield; Bayh
      and his wife with minor injuries; Kennedy in Cooley Dickinson Hospital.'
