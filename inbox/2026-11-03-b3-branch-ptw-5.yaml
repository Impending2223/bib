- add:
    entry:
      id: cal.1963-08-21.king
      when: Aug. 21
      date: '1963-08-21'
      thread: king
      also:
      - civil-rights-bill
      c: 'Chicago, the National Insurance Association, "the economic power structure of the Negro community," $10,000 guaranteed.
        King: "you owe it to them to pour some of these resources back into the struggle"; Congress "playing around with one
        of the vital issues facing our nation"; nonviolence against communism''s "the end justifies the means"; "I have a
        dream that one day, right down in Birmingham, Alabama, where the home of my good friend Arthur Shores was bombed just
        last night ..."'
      n: '[[w.branch-parting-the-waters]], 870-71. To check: Chicago Defender, Aug. 24-30, 1963, 1; Donald H. Smith, tape
        9, State Historical Society of Wisconsin (cited by [[w.branch-parting-the-waters]], 870 n.2). See [[cal.1963-06-23.king-detroit]].
        Names: Martin Luther King, Shores.'
      tags:
      - name:king-martin-luther-jr
      - name:shores-arthur-d
      - state:il
      - city:chicago
      src:
        c: 8231eff8
        rows:
        - 'w.branch-parting-the-waters 870-71: all'
        - 'via w.branch-parting-the-waters 870 n.2a: all'
        - 'via w.branch-parting-the-waters 870 n.2b: all'
- add:
    entry:
      id: cal.1963-08-25.march-on-washington
      when: Aug. 25
      date: '1963-08-25'
      thread: march-on-washington
      also:
      - press-and-broadcasting
      - king
      c: 'King and Wilkins on *Meet the Press*. Spivak, to Wilkins: authorities who "believe it would be impossible to bring
        more than 100,000 militant Negroes into Washington without incidents and possibly rioting." King asked three times
        about Rustin; Robert MacNeil of NBC on "social equality." King on Daley and J. H. Jackson booed: "we are in the midst
        of a great social revolution, and no social revolution can be neat and tidy at every point."'
      n: '[[w.branch-parting-the-waters]], 871-72. To check: Meet the Press, transcript, Aug. 25, 1963 (cited by [[w.branch-parting-the-waters]],
        871 n.1). See [[cal.1963-07-04.civil-rights-organizations]]. Names: Martin Luther King, Wilkins, Spivak, Rustin, MacNeil,
        Daley.'
      tags:
      - name:king-martin-luther-jr
      - name:wilkins-roy
      - name:spivak-lawrence
      - name:rustin-bayard
      - name:macneil-robert
      - name:daley-richard-j
      src:
        c: 556626d8
        rows:
        - 'w.branch-parting-the-waters 871-72: all'
        - 'via w.branch-parting-the-waters 871 n.1: all'
- add:
    entry:
      id: cal.1963-08.march-on-washington
      when: Aug., before the 28th
      date: '1963-08'
      thread: march-on-washington
      also:
      - defense
      c: 'Washington readies for the march: liquor sales banned, the first time since Prohibition; proclamations drafted for
        4,000 troops in the suburbs, 15,000 paratroopers on alert in North Carolina; elective surgery canceled; Chief Judge
        John Lewis Smith Jr. tells his judges to be ready for all-night hearings; the Senators'' games put off.'
      n: '[[w.branch-parting-the-waters]], 872. To check: [[w.gentile-march-on-washington]], 127, 148-49 (cited by [[w.branch-parting-the-waters]],
        872 n.1). Check: the days. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - city:washington
      src:
        c: eb9813bc
        rows:
        - 'w.branch-parting-the-waters 872: all'
- add:
    entry:
      id: cal.1963-08.march-on-washington-2
      when: Aug., before the 28th
      date: '1963-08'
      thread: march-on-washington
      c: 'Rustin''s arrangements: four thousand volunteer marshals from New York; his headquarters tent by the Washington
        Monument; several hundred portable toilets, twenty-one drinking fountains, twenty-four first-aid stations, a check-cashing
        office; 80,000 cheese sandwiches made at Riverside Church; a seven-minute limit on speeches; "assume that everybody
        is absolutely stupid."'
      n: '[[w.branch-parting-the-waters]], 872-73. To check: Viorst, *Fire in the Streets*, 224-25 (cited by [[w.branch-parting-the-waters]],
        872 n.3, 873 n.3); Life, Sept. 6, 1963, 20-29 (cited by [[w.branch-parting-the-waters]], 873 n.1); New York Times,
        Aug. 28, 1963, 1 (cited by [[w.branch-parting-the-waters]], 873 n.2); [[w.gentile-march-on-washington]], 163 (cited
        by [[w.branch-parting-the-waters]], 873 n.4). Check: the days. Names: Rustin.'
      tags:
      - name:rustin-bayard
      - city:washington
      src:
        c: 8046025d
        rows:
        - 'w.branch-parting-the-waters 872-73: all'
        - 'via w.branch-parting-the-waters 872 n.3: A'
        - 'via w.branch-parting-the-waters 873 n.1: A'
        - 'via w.branch-parting-the-waters 873 n.2: A'
- add:
    entry:
      id: cal.1963-08.march-on-washington-3
      when: Aug., the last week
      date: '1963-08'
      thread: march-on-washington
      also:
      - civil-rights-organizations
      c: 'John Lewis''s speech for the march, drafted with SNCC''s staff: the Americus prisoners, the Plaquemine charges,
        Slater King; "I want to know, which side is the Federal Government on?"; Courtland Cox: nothing in the bill protects
        those seeking to vote or protest; Tom Kahn: "the masses, must bring them about"; Forman: "We will march through the
        South, through the heart of Dixie, the way Sherman did"; polished by Julian Bond and Eleanor Holmes.'
      n: '[[w.branch-parting-the-waters]], 869-70, 873-74. To check: Allen interviews of John Lewis, Sept. 23, 1969, Rachelle
        Horowitz, Nov. 8, 1968; [[w.gentile-march-on-washington]], 171-75; [[w.forman-making-of-black-revolutionaries]], 333-34
        (cited by [[w.branch-parting-the-waters]], 873 n.5); [[w.schlesinger-robert-kennedy-and-his]], 377; [[w.garrow-bearing-the-cross]],
        281-82 (cited by [[w.branch-parting-the-waters]], 869 n.3). Names: Lewis, Bond.'
      tags:
      - name:lewis-john
      - name:bond-julian
      src:
        c: '68470287'
        rows:
        - 'w.branch-parting-the-waters 869-70, 873-74: all'
        - 'via w.branch-parting-the-waters 873 n.5a: all'
- add:
    entry:
      id: cal.1963-08-27.march-on-washington-2
      when: Aug. 27
      date: '1963-08-27'
      thread: march-on-washington
      c: 'Afternoon. Archbishop O''Boyle, to give the invocation, finds Lewis''s draft incendiary; Burke Marshall, Reuther
        and white clergymen join the complaint. Rustin''s emergency mediation at the Statler-Hilton: the elders against "too
        little, too late"; Lewis defends his text. In the lobby, Malcolm X to reporters: the protest made a Kennedy pep rally
        by white forces.'
      n: '[[w.branch-parting-the-waters]], 874. See [[cal.1963-08.march-on-washington-3]]. Names: Burke Marshall, Reuther,
        Rustin, Lewis, Malcolm X, Kennedy.'
      tags:
      - name:marshall-burke
      - name:reuther-walter
      - name:rustin-bayard
      - name:lewis-john
      - name:malcolm-x
      src:
        c: 6bb6e7a0
        rows:
        - 'w.branch-parting-the-waters 874: all'
- add:
    entry:
      id: cal.1963-08-27.civil-rights-organizations
      when: Aug. 27
      date: '1963-08-27'
      thread: civil-rights-organizations
      also:
      - march-on-washington
      - voting-rights
      c: 'Moses leads pickets outside the Justice Department all night, with supporters of the Americus prisoners and the
        Albany Nine; his sign: "When There Is No Justice, What Is the State but a Robber Band Enlarged?"'
      n: '[[w.branch-parting-the-waters]], 874-76. To check: [[w.gentile-march-on-washington]], 160 (cited by [[w.branch-parting-the-waters]],
        875 n.1). See [[cal.1963-08-09.georgia-albany]]. Names: Moses.'
      tags:
      - name:moses-robert-p
      - city:washington
      src:
        c: 60d913a9
        rows:
        - 'w.branch-parting-the-waters 874-76: all'
- add:
    entry:
      id: cal.1963-08-27.king
      when: Aug. 27
      date: '1963-08-27'
      thread: king
      also:
      - march-on-washington
      c: 'Washington, the Willard Hotel, through the night. King writes his speech for the march: "Five score years ago";
        the "promissory note," the "bad check" marked "insufficient funds"; "Those who hope that the Negro needed to blow
        off steam and will now be content will have a rude awakening"; "The marvelous new militancy ... must not lead us to
        a distrust of all white people"; "we can never be satisfied." By morning Walker has it typed.'
      n: '[[w.branch-parting-the-waters]], 875-76. To check: King, interview by Donald H. Smith, Nov. 29, 1963, tape 9; Coretta
        Scott King, *My Life with Martin Luther King, Jr.*, 240-41 (cited by [[w.branch-parting-the-waters]], 875 n.2); Chicago
        Defender, Aug. 24-30, 1963, 4 (a draft printed, cited by [[w.branch-parting-the-waters]], 875 n.3). See [[cal.1963-08-28.march-on-washington]].
        Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      - city:washington
      src:
        c: f71b7de4
        rows:
        - 'w.branch-parting-the-waters 875-76: all'
        - 'via w.branch-parting-the-waters 875 n.2a: all'
        - 'via w.branch-parting-the-waters 875 n.2b: A'
- add:
    entry:
      id: cal.1963-08-28.march-on-washington-3
      when: Aug. 28
      date: '1963-08-28'
      thread: march-on-washington
      also:
      - robert-kennedy
      - antisubversion
      c: 'Morning. Robert Kennedy telephones Archbishop O''Boyle on Lewis''s speech. FBI agents, on Hoover''s order, call
        Charlton Heston and other celebrities in their hotel rooms: stay indoors, the government expects violence.'
      n: '[[w.branch-parting-the-waters]], 876. To check: [[w.gentile-march-on-washington]], 176, 212; Jet, Sept. 12, 1963,
        14-29 (cited by [[w.branch-parting-the-waters]], 876 n.1). See [[cal.1963-08-27.march-on-washington-2]]. Names: Robert
        Kennedy, Lewis, Hoover.'
      tags:
      - name:kennedy-robert-f
      - name:lewis-john
      - name:hoover-j-edgar
      - city:washington
      src:
        c: dd401049
        rows:
        - 'w.branch-parting-the-waters 876: all'
