    item: '[[w.branch-parting-the-waters]], 876-83'
    units: A-C, E-F
- check:
    id: cal.1963-08-28.march-on-washington
    text: 'Check: Branch, 876-83: twenty-one charter trains, buses through the Baltimore tunnel at a hundred an hour (Gentile);
      the police estimate at noon more than 200,000; Wilkins announces Du Bois''s death in Ghana: "regardless of the fact
      that in his later years Dr. Du Bois chose another path"; Marshall brings a revised Lewis text by police sidecar; O''Boyle
      withholds the invocation; under Lincoln''s seat Randolph, King, Blake and Lewis cut the Sherman passage, King: "John,
      I know you as well as anybody. That doesn''t sound like you"; Lewis: "the party of Kennedy is also the party of Eastland.
      The party of Javits is also the party of Goldwater"; the leaders'' wives kept from the march; Mahalia Jackson, "Tell
      ''em about the dream, Martin"; King off his text after "a mighty stream."'
