    text: 'Check: Branch, 896-98, from Audiotapes 112.5, 112.6 and 113.1: five men, William Hamilton for Boutwell, "Mr. President,
      we came here, sir, with big chips on our shoulder"; the President''s three steps: Negro clerks, biracial talks, one
      Negro policeman; Hamilton: a third of the police would quit; Frank Newton of the telephone company: "a lot of people
      ... think you''ve been giving those people encouragement"; Kennedy: "Oh, public accommodations is nothing!"; "King has
      got a ... terrific investment in nonviolence, and SNCC has got an investment in violence"; the New York Times, Sept.
      24: "Kennedy Says Birmingham Can Solve Its Own Problems."'
