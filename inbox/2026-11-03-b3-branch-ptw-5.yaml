      c: 'Washington, SNCC''s annual conference, the week after the assassination. A processional to the President''s grave
        voted down. Moses: "The white people in the country, by and large, have not as yet made up their minds whether they''re
        willing to grant freedom to Negroes"; "It is true, the Negroes are blackmailing the Federal Government"; Freedom Schools,
        staffed by Northern students who came for the Freedom Vote.'
      n: '[[w.branch-parting-the-waters]], 920. To check: New York Times, Nov. 30, 1963, 8 (cited by [[w.branch-parting-the-waters]],
        920 n.4); "Movement Soul," Folkways FD5486 (cited by [[w.branch-parting-the-waters]], 920 n.2); interviews: John Lewis,
        May 31, 1984 (cited by [[w.branch-parting-the-waters]], 920 n.1). Check: the conference''s days. See [[cal.1963-11-02.mississippi-ms]].
        Names: Moses, Lewis.'
