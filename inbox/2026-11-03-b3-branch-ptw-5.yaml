      c: 'Lee White to the President on Representative John L. Pilcher of Albany, Ga.: if the civilian hospitals near Turner
        Air Force Base stay segregated and so unusable under the Pentagon''s new rules, is Turner eligible for a new military
        hospital? The Budget Bureau: only with the President''s approval. No decision before Texas. The President has White
        see that Washington''s barbers stop complaining of serving Negroes, from a *Star* story.'
      n: '[[w.branch-parting-the-waters]], 917. To check: White to Kennedy, Nov. 20, 1963, and the memoranda of Nov. 8-16,
        Lee White Papers, box 19, JFK Library (cited by [[w.branch-parting-the-waters]], 917 n.4); Evelyn Lincoln to White,
        Nov. 10, 1963 (cited by [[w.branch-parting-the-waters]], 917 n.3). Names: White, Kennedy, Pilcher.'
