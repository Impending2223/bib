- add:
    entry:
      id: cal.1963-08-08.georgia
      when: Aug. 8
      date: '1963-08-08'
      thread: georgia
      c: Americus, Ga. After a mass meeting at Friendship Baptist, two hundred young people march a block through the Negro
        section; police fire warning shots; Sheriff Fred B. Chappell jabs Don Harris of SNCC with an electric cattle prod;
        bricks and clubs; seventy-seven jailed. Harris, two white Northern students and a young Negro of Americus charged
        with seditious conspiracy under the "Angelo Herndon statute," a capital crime, no bail. Nearly a hundred teenagers
        jailed in July over the Martin Theater.
      n: '[[w.branch-parting-the-waters]], 864-65. To check: Whitehead, *Attack on Terror*, 136; [[w.forman-making-of-black-revolutionaries]],
        338-44; Abram, *The Day Is Short*, 139-40; New York Times, Aug. 14, 1963, 21 (cited by [[w.branch-parting-the-waters]],
        864 n.7). Check: the day of the sedition charges; the siege''s toll, seven officers and twenty-eight demonstrators
        wounded, one shot dead in a white neighborhood.'
      tags:
      - state:ga
      src:
        c: cfabfa5e
        rows:
        - 'w.branch-parting-the-waters 864-65: all'
        - 'via w.branch-parting-the-waters 864 n.7c: all'
        - 'via w.branch-parting-the-waters 864 n.7d: all'
- add:
    entry:
