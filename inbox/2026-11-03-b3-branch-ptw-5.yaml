- add:
    entry:
      id: cal.1963-07-09.civil-rights-the-executive
      when: July 9
      date: '1963-07-09'
      thread: civil-rights-the-executive
      also:
      - defense
      c: 'The White House, recorded: Johnson to the President on Houston''s cutting off dockside power over the Navy''s rules
        on off-base segregation: "The head of Houston Power and Light Company is Eastland''s cousin. So I called up Albert
        Thomas and I said, ''Shall I tell the President that you cannot supply power to a Navy installation there because
        of the Negro question? And ... what are you gonna do about space?''" The power back. Johnson: the governors of Texas,
        Arkansas and Georgia to know segregation "may cost them the economy of that state." Kennedy: "You could do all that
        on the phone?"'
      n: '[[w.branch-parting-the-waters]], 863-64. To check: [Kennedy, Johnson, Katzenbach, McNamara and Taylor, July 9](https://prde.upress.virginia.edu/conversations/4006293),
        JFK Meeting Tape 96.6 (PRDE only) (cited by [[w.branch-parting-the-waters]], 863 n.4). Names: Johnson, Kennedy, Eastland,
        Thomas.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      - name:eastland-james-o
      - name:thomas-albert
      - state:tx
      - city:houston
      src:
        c: 37d50209
        rows:
        - 'w.branch-parting-the-waters 863-64: all'
        - 'via w.branch-parting-the-waters 863 n.4: all'
- add:
    entry:
      id: cal.1963-08-01.civil-rights-the-executive
      when: Aug. 1
      date: '1963-08-01'
      thread: civil-rights-the-executive
      also:
      - civil-rights-bill
      c: 'News conference. Asked why the demonstrations have subsided: the biracial groups'' work, Congress''s consideration
        of remedies, the Negro leadership''s sense of a "long drawn-out task"; "merely because the demonstrations have subsided
        does not ... mean that we should go to sleep and forget the problem."'
      n: 'The President''s News Conference of August 1, 1963, [1963 Pub. Papers 612](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=670),
        617. [[w.branch-parting-the-waters]], 864. To check: New York Times, Aug. 2, 1963, 1, 10 (cited by [[w.branch-parting-the-waters]],
        864 n.3). Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: f3d1eaa6
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=670: all'
        - 'w.branch-parting-the-waters 864: all'
        - 'via w.branch-parting-the-waters 864 n.3: all'
