      when: Aug. 13
      date: '1963-08-13'
      thread: civil-rights-the-executive
      also:
      - georgia
      c: 'The Justice Department''s press office: the FBI finds no merit in the complaints of police brutality at Americus,
        Ga. Robert Kennedy declines to challenge the sedition prosecutions for the United States.'
      n: '[[w.branch-parting-the-waters]], 864-65. To check: New York Times, Aug. 14, 1963, 21 (cited by [[w.branch-parting-the-waters]],
        864 n.7). See [[cal.1963-08-08.georgia]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      src:
        c: a509bdff
        rows:
        - 'w.branch-parting-the-waters 864-65: all'
        - 'via w.branch-parting-the-waters 864 n.7d: A'
- cite:
    id: cal.1963-08-09.georgia-albany
    item: '[[w.branch-parting-the-waters]], 866-68'
- check:
    id: cal.1963-08-09.georgia-albany
    text: 'Check: Branch, 731, 866-68: Ware''s was a civil suit, Sheriff L. Warren Johnson cleared of civil liability; a special
      federal grand jury, nearly sixty subpoenas; the perjury counts over a meeting with C. B. King; Joni Rabinowitz and Anderson
      alone charged with conspiring against Smith; Robert Kennedy announces it at a press conference the day his nephew Patrick
      dies; Katzenbach: the picketing "must become a matter of serious Federal legal concern"; Judge Elliott had pressed the
      investigation.'
