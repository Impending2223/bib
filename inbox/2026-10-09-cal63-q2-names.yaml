      entry: {id: kjc.who.king-coretta-scott, s: 'King, Coretta Scott', r: 'Martin Luther King Jr.''s wife'}
      section: III.K
  - add:
      entry: {id: kjc.who.moore-william-l, s: 'Moore, William L.', r: 'Baltimore postman; shot dead near Attalla, Alabama, on a one-man walk to Mississippi, Apr. 23, 1963'}
      section: III.K
  - add:
      entry: {id: kjc.who.rockefeller-margaretta-fitler, s: 'Rockefeller, Margaretta Fitler', r: 'Nelson Rockefeller''s second wife ("Happy"); married May 4, 1963'}
      section: III.K
  - add:
      entry: {id: kjc.who.cooper-l-gordon-jr, s: 'Cooper, L. Gordon, Jr.', r: 'Astronaut; *Faith 7*, May 15–16, 1963'}
