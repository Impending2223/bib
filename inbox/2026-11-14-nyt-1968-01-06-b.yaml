by: 'Claude (the lead), Nov. 14, 2026, from the owner''s clipping of the *New York Times*, Jan. 6, 1968, p. 8'
ops:
  - add:
      entry:
        id: cal.1968-01-05.vietnam-congress
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-congress
        also: [vietnam-pacification]
        c: 'Đà Nẵng region, the fourth day of a planned twelve in South Vietnam. Edward Kennedy, for his Judiciary subcommittee on refugees, visits three refugee settlements and four hospitals; by helicopter to Thượng Đức. At a news conference in a settlement: "an upward swing, an improvement" since 1965. Saigon counts 527,000 refugees, the Mission''s refugee section 409,000; civilian casualties in the hospitals about twice what he had been led to expect, some 25 per cent of patients in two Delta hospitals, not 10 or 11; at Hội An, Dr. Louis Betz: half the civilian war casualties of three months caused by the Viet Cong, half by the allies.'
        n: '"E. M. Kennedy Sees Gain on Refugees," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 8. Names: Kennedy. Check: the trip''s days (from Jan. 2, by "his fourth day").'
        tags: [name:kennedy-edward-m]
  - add:
      entry:
        id: cal.1968-01-05.congress
        when: Jan. 5
        date: '1968-01-05'
        thread: congress
        also: [vietnam]
        c: 'Teague (D-Tex.), chairman of the House Veterans'' Affairs Committee: the committee to look next month into the costs families of the war dead pay beyond the Government''s funeral allowance, 00 to 00 by an AP survey; the inquiry may bring new limits on burial in the national cemeteries, "filling up so fast that the problem has become critical." Of Arlington''s more than 150,500 plots, 4,832 unused.'
        n: '"U.S. Aid for Funerals" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 8 (the headline cut in the clipping). Names: Teague.'
        tags: [name:teague-olin-e]
