      n: '[[w.schlesinger-robert-kennedy-and-his]], 616, 759; [[w.schlesinger-journals]], 253–54 (the entry of Oct. 30: the Dillons'' dinner; Kennedy, from campaigning, "last stop: Connecticut," arrives about 10:30, Goodwin a few moments before; "we talked until 2:30" at P.J. Clarke''s; the 80 percent for Johnson and 20 for him; "rueful about his own vogue"; the Warren Report; also Johnson on their day of campaigning, undated, and the Manchester book, not in the entry); [[w.thomas-robert-kennedy]], 333 (the Warren Commission, a poor job; not to be criticized in public; the month only). The time is Kennedy''s arrival at the Dillons'', about 10:30 p.m.; they left for Clarke''s about midnight ([[w.schlesinger-journals]], 253). To check: Schlesinger, journal, Oct. 30, 1966, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 616 n.51). Names: Robert Kennedy, Schlesinger, Johnson.'
