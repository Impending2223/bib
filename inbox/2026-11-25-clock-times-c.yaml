- edit:
    id: cal.1966-01-31.vietnam
    base: 82af24b6
    set:
      time: 1966-01-31T15:00Z
      time_zone: America/New_York
      n: 'Statement by the President Announcing Resumption of Air Strikes on North Vietnam, [1966 Pub. Papers 114](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=190) (Jan. 31, 1966); Reply to a Letter From a Group of House Members, [1966 Pub. Papers 44](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=120) (Jan. 22, 1966); Reply to a Letter From a Group of Senators, [1966 Pub. Papers 112](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=188) (Jan. 28, 1966). [FRUS 1964–68, IV, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v04/d55); [doc. 56](https://history.state.gov/historicaldocuments/frus1964-68v04/d56); [doc. 57](https://history.state.gov/historicaldocuments/frus1964-68v04/d57); [doc. 59](https://history.state.gov/historicaldocuments/frus1964-68v04/d59). [[w.gibbons-u-s-government-and]], IV, 140, 155–58, 163–64 (the House members'' letter, 140; the Senators'' letter and the reply, 155–58; the NSC and the resumption, 163–64); [[w.preston-war-council]], 227; [[w.califano-triumph-and-tragedy-of]], 121 (resumed Jan. 31; Hanoi and Haiphong still barred); [[w.branch-at-canaans-edge]], 433 (from the White House theater, 10 a.m.); [[w.cosmas-joint-chiefs-of-staff-2012]], 408 (the order to resume at 0001, Jan. 31, Saigon time, by armed reconnaissance of designated areas and routes); [[w.drea-mcnamara-clifford-and-the-2011]], 69 (after 37 days; rain, low visibility and a lower level of sorties); [[w.zaroulis-who-spoke-up]], 71 (a letter from seventy-six members of Congress and one from fifteen Democratic senators; Johnson''s reply, guided by the resolution of Aug. 10, 1964; Ho''s letter to foreign governments, "impudent threat," undated; Jan. 31 on television, the bombing resumed); [[w.clifford-counsel-to-the-president-2]], 437 (the bombing resumes after the thirty-seven day pause, announced by the President at 10 a.m. on Jan. 31 as Air Force planes were already going north; not the broadcast or the words); [[w.dallek-flawed-giant]], 351 (Jan. 31: Johnson announces renewed bombing and says the end of the pause did "not mean the end of our pursuit of peace"; asks for an immediate meeting of the U.N. Security Council; expresses "full sympathy" with the Pope''s appeal; not the hour, the television or Goldberg); [[w.schlesinger-journals]], 245 (the entry of Mar. 11: "toward the end of January, he decided to end the pause and resume bombing," for reasons, so far as Schlesinger could find out, "psychological and political rather than military"; not the day or the 37 days). [[w.mann-grand-delusion]], 481–83 (the Senators'' letter; the reply; the resumption). [[w.rusk-as-i-saw-it-1990]], 466 (the resumption). To check: "Johnson Asks U.N. to Summon Vietnam Peace Conference/ Bombing in North Resumes," [*New York Times*, Feb. 1, 1966](https://timesmachine.nytimes.com/timesmachine/1966/02/01/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 433). See [[cal.1965-12-24.vietnam]]; [[cal.1966-01-03.vietnam]]. Made public, the NSC notes: FRUS 1964–68, IV (1998). Gibbons dates the NSC meeting Sunday, Jan. 30, the notes'' date of Jan. 29 an error (IV, 163 n.146); FRUS''s editors take its time, 1:20–2:30 p.m., Jan. 29, from the Daily Diary (doc. 55 n. 1). The time is the first day''s: the broadcast, 10 a.m. (the Public Papers'' note, 114). Names: Johnson, Hồ Chí Minh, Rusk, Goldberg, Hartke.'
- edit:
    id: cal.1966-01-31.vietnam-air-war
    base: 89e47bb0
    set:
      n: '[[w.branch-at-canaans-edge]], 433. To check: President''s Daily Diary, Jan. 31, 1966, p. 1, LBJ (cited by [[w.branch-at-canaans-edge]], 433); [Johnson and Robert McNamara, 9:20 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-january-31-1966), Conversation WH6601-11-9543 (Miller Center) (cited by [[w.branch-at-canaans-edge]], 433). The call, 9:20 a.m. by the Miller Center''s catalogue, came before Johnson''s broadcast of 10 a.m. ([1966 Pub. Papers 114](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=190)); it reports the strikes already flown. See [[cal.1966-01-31.vietnam]]. Names: McNamara, Johnson.'
