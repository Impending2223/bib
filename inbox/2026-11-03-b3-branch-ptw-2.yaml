- add:
    entry:
      id: cal.1961-10-12.civil-rights-organizations
      when: Oct. 12
      date: '1961-10-12'
      thread: civil-rights-organizations
      also:
      - mississippi
      c: 'Medgar Evers, the NAACP''s Mississippi field secretary, to Wilkins, Current and Hurley, "Operation of Other Civil
        Rights Organizations in the State of Mississippi": strong NAACP branches have kept the student registration projects
        from headway; King raised little for the Freedom Riders in the State; Moses, Hardy and the other registration workers
        "became involved with some hoodlums, law enforcement officers, and voter registrars."'
      n: '[[w.branch-parting-the-waters]], 557. To check: Evers to Wilkins, Current and Hurley, Oct. 12, 1961, File III-A-253,
        NAACP Papers, Library of Congress (cited by [[w.branch-parting-the-waters]], 557 n.3). Names: Medgar Evers, Wilkins,
        Martin Luther King, Moses, Hardy.'
      src:
        c: 6e5092d6
        rows:
        - 'w.branch-parting-the-waters 557: all'
        - 'via w.branch-parting-the-waters 557 n.3: all'
      tags:
      - name:evers-medgar
      - name:wilkins-roy
      - name:king-martin-luther-jr
      - name:moses-robert-p
      - name:hardy-john
      - state:ms
- add:
    entry:
