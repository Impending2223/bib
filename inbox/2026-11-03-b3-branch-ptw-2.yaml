      c: 'Recorder''s court, Judge Durden. C. B. King, bandaged: the charges a cover for segregation. The city attorney: Albany
        no longer enforces segregation laws against federal rulings. King, Abernathy, Anderson and Slater King guilty, each
        $200 and sixty days, suspended so long as they break no law; the segregation ordinances, Durden says, overruled by
        the Supreme Court. Kelley: "I think the Attorney General''s intervention ... has given Dr. King plenty of reason to
        leave."'
