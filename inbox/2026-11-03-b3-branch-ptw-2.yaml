      c: 'Wyatt Walker of SCLC to the Afro-American Newspapers, his nomination for American of the Year: Robert Kennedy. "Moved
        with decisiveness in Montgomery violence. Petitioned ICC for new ruling with teeth."'
      n: '[[w.branch-parting-the-waters]], 560–61. To check: Walker to Arthur M. Carter, Dec. 26, 1961, SCLC Papers, box 33,
        King Library and Archives (cited by [[w.branch-parting-the-waters]], 561 n.1). Names: Robert Kennedy.'
      src:
        c: fed20306
        rows:
        - 'w.branch-parting-the-waters 560–61: all'
        - 'via w.branch-parting-the-waters 561 n.1: all'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1961-12-20.king
      when: Dec. 20
      date: '1961-12-20'
      thread: king
      also:
      - civil-rights-organizations
      c: 'King to the Reverend O. Clay Maxwell, president of the National Baptist Convention''s Sunday School Congress, which
        had removed him as its vice president: he will not fight J. H. Jackson''s edict by suit or protest; it "would make
        me look little rather than big."'
      n: '[[w.branch-parting-the-waters]], 561. To check: Maxwell to King, Dec. 14, 1961; King to Maxwell, Dec. 20, 1961,
        King Papers, box 15, King Library and Archives (cited by [[w.branch-parting-the-waters]], 561 nn.4–5). Names: Martin
        Luther King, Jackson.'
      src:
        c: bdf58f1c
        rows:
        - 'w.branch-parting-the-waters 561: all'
        - 'via w.branch-parting-the-waters 561 n.5: all'
      tags:
      - name:king-martin-luther-jr
      - name:jackson-john-h
