      c: 'Later that night, Gardner to Albany''s leading white citizens: pay King''s fine in secret and put him out of the
        jail, and deny it. Robert Kennedy, they are told, has said the nation''s security and prestige suffer each day King
        is held. Pritchett consults Kelley, then instructs his desk sergeant.'
      n: '[[w.branch-parting-the-waters]], 605–6. To check: interviews: Laurie Pritchett, Nov. 25, 1986 (cited by [[w.branch-parting-the-waters]],
        606 n.1). See [[cal.1962-07-11.robert-kennedy]]. Names: Martin Luther King, Robert Kennedy.'
      src:
        c: d376eac7
        rows:
        - 'w.branch-parting-the-waters 605–6: all'
        - 'via w.branch-parting-the-waters 606 n.1: C'
      tags:
