      c: 'SCLC''s sixth convention opens in Birmingham, integrated, without demonstrations. The downtown merchants paint over
        their "Whites Only" signs at the last moment; neither side tells the press. That night at St. John''s Church, Walker:
        "I have come to Birmingham to ride the Bull!" Jackie Robinson refused a motorcade by the police.'
      n: '[[w.branch-parting-the-waters]], 647. To check: Birmingham police notes of the mass meeting, Sept. 24, 1962, Birmingham
        Public Library (cited by [[w.branch-parting-the-waters]], 647 n.2). See [[cal.1962-09.alabama-birmingham-2]]. Names:
        Robinson.'
