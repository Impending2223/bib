      c: 'Press conference. The warning repeated. Asked of King''s telegrams on the terror in the South: the burning of two
        churches for Negroes'' efforts to register, "I don''t know any more outrageous action which I have seen occur in this
        country for a good many months or years"; the shootings in Mississippi "cowardly as well as outrageous." Those registering
        "deserve the protection of the United States Government," and "if it requires extra legislation and extra force, we
        shall do that."'
