      when: July 12
      date: '1962-07-12'
      thread: georgia-albany
      also:
      - king
      c: 'King, at Shiloh: "This is one time I''m out of jail that I''m not happy to be out." The "subtle and conniving tactics"
        of his release. Pritchett, he says, has all but promised the December cases dropped and a biracial commission. Pritchett,
        at his own: "there has been nothing of a settlement in reference to anything." Kelley: "no communicable information"
        on who paid.'
      n: '[[w.branch-parting-the-waters]], 606. To check: interviews: Asa Kelley, Jan. 22, 1986 (cited by [[w.branch-parting-the-waters]],
        606 n.4). See [[cal.1962-07-12.georgia-albany]]. Names: Martin Luther King.'
      src:
        c: 8f4f7ceb
        rows:
        - 'w.branch-parting-the-waters 606: all'
      tags:
      - name:king-martin-luther-jr
      - state:ga
      - city:albany-ga
