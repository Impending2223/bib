      when: Oct. 1
      date: '1961-10-01'
      thread: antisubversion
      c: 'W. E. B. Du Bois, ninety-three, applies to join the Communist Party, by letter to its chairman, Gus Hall, made public:
        "capitalism cannot reform itself; it is doomed to self-destruction." Hoover takes no public notice.'
      n: '[[w.branch-parting-the-waters]], 563. To check: Du Bois to Hall, Oct. 1, 1961, King Papers, box 8, King Library
        and Archives; Jet, Dec. 7, 1961, 5 (cited by [[w.branch-parting-the-waters]], 563 n.2).'
      src:
        c: 2ee95501
        rows:
