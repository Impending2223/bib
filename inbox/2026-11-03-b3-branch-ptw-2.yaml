      when: July 21
      date: '1962-07-21'
      thread: robert-kennedy
      also:
      - georgia-albany
      - king
      c: 'Robert Kennedy to King by telephone, on Elliott''s order. King feels "impelled" to march; Kennedy: Southern governors
        and school officials pray for an excuse to defy federal orders. King: "Some of these problems you have created yourself
        by appointing these segregationist federal judges." Kennedy hands the phone to Burke Marshall, nearly two hours: defiance
        would put King where the administration means to put Barnett. That night King, through Clarence Jones: he will obey
        until the lawyers have the order overturned.'
      n: '[[w.branch-parting-the-waters]], 610–11. To check: Martin Luther King, oral history, JFK Library; Levison''s conversation
        of Aug. 3, 1962, FBI; interviews: Burke Marshall, Sept. 26, 1984; Charles Sherrod, Jan. 23, 1986; Clarence Jones,
        May 18, 1986; C. B. King, July 10, 1985; Laurie Pritchett, Nov. 25, 1986 (cited by [[w.branch-parting-the-waters]],
        610 n.2). Check: Pritchett told Branch he had the call wiretapped (610 n.2). See [[cal.1962-07-20.albany]]. Names:
        Robert Kennedy, Martin Luther King, Burke Marshall, Barnett.'
