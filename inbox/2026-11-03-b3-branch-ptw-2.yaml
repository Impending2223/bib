      id: cal.1962-09.alabama-birmingham-2
      when: Sept.
      date: 1962-09
      thread: alabama-birmingham
      c: 'Days before SCLC''s convention, A. G. Gaston brings Shuttlesworth to Smyer at a white hotel. Smyer asks him to keep
        King away, then for assurance of no trouble; Shuttlesworth: "You all called me to the wrong meeting." The next morning,
        with the men of Sears, Loveman''s, Newberry''s, Greene''s, Woolworth''s and Pizitz''s: Shuttlesworth, "We''re past
        water now. We have to have toilets." Loveman will paint over the restroom signs. Fountains and restrooms integrated
        for a convention without demonstrations.'
      n: '[[w.branch-parting-the-waters]], 644–46. To check: Shuttlesworth, oral histories, King Library and Archives and
        Howard University; Raines, *My Soul Is Rested*, 168–69 (cited by [[w.branch-parting-the-waters]], 645 nn.1–2). Check:
        the days. See [[cal.1962-09.alabama-birmingham]]. Names: Shuttlesworth.'
