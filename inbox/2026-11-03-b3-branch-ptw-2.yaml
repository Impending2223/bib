- add:
    entry:
      id: cal.1962-01-12.civil-rights-organizations
      when: Jan. 12
      date: '1962-01-12'
      thread: civil-rights-organizations
      also:
      - press-and-broadcasting
      - king
      c: '*Time*, "Confused Crusade." Wilkins on SNCC: "They don''t take orders from anybody; they don''t consult anybody
        ... When the headlines are gone, the issues still have to be settled in court." King: "a mistake to try ... to throw
        the students out of the movement." Anonymous SNCC leaders on King''s status-seeking and his leaving the Albany jail;
        Forman pictured among four national leaders. Levison''s letter of Jan. 11 in protest, unpublished.'
      n: '[[w.branch-parting-the-waters]], 557–58. To check: "Confused Crusade," Time, Jan. 12, 1962, 15 (cited by [[w.branch-parting-the-waters]],
        557 n.5); Levison to Time, Jan. 11, 1962, SCLC Papers, box 36, King Library and Archives (cited by [[w.branch-parting-the-waters]],
        558 n.1). See [[cal.1961-12-24.civil-rights-organizations]]. Names: Wilkins, Martin Luther King, Forman, Levison.'
      src:
        c: b83e2201
        rows:
        - 'w.branch-parting-the-waters 557–58: all'
        - 'via w.branch-parting-the-waters 557 n.5: A-D'
        - 'via w.branch-parting-the-waters 558 n.1: E'
      tags:
      - name:wilkins-roy
      - name:king-martin-luther-jr
      - name:forman-james
      - name:levison-stanley-d
