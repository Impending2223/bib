      c: 'Evening, Meredith on his way to Memphis. Robert Kennedy to Barnett: "He is going to show up for classes tomorrow."
        Barnett: "They''re going to give him special treatment? They can''t do that, General." Ten minutes later Kennedy calls
        again with exact notice, on Marshall''s advice: "they will be down there at ten o''clock." Barnett: "Ten o''clock
        will be all right."'
      n: '[[w.branch-parting-the-waters]], 649. To check: Lord, *The Past That Would Not Die*, 139–43; [[w.navasky-kennedy-justice]],
        185–92, 199–204 (cited by [[w.branch-parting-the-waters]], 647 n.3). See [[cal.1962-09-25.mississippi-ole-miss-2]].
        Names: Robert Kennedy, Barnett, Burke Marshall.'
