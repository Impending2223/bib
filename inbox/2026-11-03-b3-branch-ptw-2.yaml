      thread: georgia-albany
      also:
      - democratic-party
      c: 'James Gray to the President by telephone, Mayor Kelley in his office: "Jack, we''ve got Martin Luther King in jail.
        ... We don''t want him in jail, but what can we do? He violated our law. ... It would be very nice if you sent somebody
        down here to pick him up." Kennedy will send someone; Gray to see the Attorney General. By Gray''s account.'
      n: '[[w.branch-parting-the-waters]], 603–4. To check: interviews: James Gray, Jan. 24, 1986 (cited by [[w.branch-parting-the-waters]],
        603 n.3). See [[cal.1962-07-10.albany]]. Names: Kennedy, Martin Luther King.'
