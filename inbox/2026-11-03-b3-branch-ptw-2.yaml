      c: 'King, back in Albany, at the night''s mass meeting: "I understand that the city attorney has gone to Atlanta to
        get an injunction to get the undesirables out." "The salvation of the Negro in Albany, Georgia, is within the hands
        and the soul of the Negro himself." Gandhi''s Salt March; "Albany''s March to the Sea," the next afternoon.'
      n: '[[w.branch-parting-the-waters]], 608–9. To check: Watters, *Down to Now*, 196–202 (cited by [[w.branch-parting-the-waters]],
