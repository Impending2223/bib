      date: '1962-07-16'
      thread: georgia-albany
      c: 'The "Albany Manifesto," dated July 15, handed to Pritchett about 1:30 p.m.: the city has dealt in bad faith these
        six months. Small groups test the library and the parks; met by police, many arrested.'
      n: '[[w.branch-parting-the-waters]], 608. To check: the "Albany Manifesto," July 15, 1962, Albany city records (cited
