        and the White House through King, not Levison himself. White: "from the character of some of the people over at the
        White House he would not have been surprised if it were reported that Levison actually did have such a contact." By
        Evans''s report.'
      n: '[[w.branch-parting-the-waters]], 565. To check: Evans to Belmont, Feb. 6, 1962, FBI file 100-392452, serial 136
        (cited by [[w.branch-parting-the-waters]], 565 n.3). See [[cal.1962-02-02.king]]. Names: Evans, Byron White, Hoover,
        Levison, Martin Luther King.'
