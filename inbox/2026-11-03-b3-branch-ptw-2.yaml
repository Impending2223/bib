      also:
      - georgia-albany
      c: 'Robert Kennedy to reporters: "Dr. King''s release should make it possible for the citizens of Albany to resolve
        their differences in this situation in a less tense atmosphere. Therefore, I am very glad that Dr. King has been released."
        Guthman: no federal official paid the fine; Burke Marshall had called Mrs. King and others.'
      n: '[[w.branch-parting-the-waters]], 607. To check: Albany Journal, July 12, 1962, 1 (cited by [[w.branch-parting-the-waters]],
        607 n.1). See [[cal.1962-07-12.georgia-albany]]. Names: Robert Kennedy, Martin Luther King, Guthman, Burke Marshall,
        Coretta King.'
