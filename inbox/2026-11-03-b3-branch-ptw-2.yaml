        old, from two informants in the party. Hoover''s notation: "King is no good any way. Under no circumstances should
        our informant be endangered." The file not to be shown, being too important.'
      n: '[[w.branch-parting-the-waters]], 564–65. To check: Bland to Sullivan, Feb. 3, 1962, with Hoover''s notation, FBI
        file 100-392452, serial 135 (cited by [[w.branch-parting-the-waters]], 565 n.2); [[w.garrow-fbi-and-martin-luther]]
        (the informants, cited by [[w.branch-parting-the-waters]], 565 n.1). See [[cal.1962-02-02.king]]. Names: Sullivan,
        Byron White, Levison, Hoover, Martin Luther King.'
