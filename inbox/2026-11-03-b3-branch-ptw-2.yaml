      when: July 28
      date: '1962-07-28'
      thread: georgia-albany
      c: 'William Hansen of SNCC, the one white jailed in the marches of July 27, beaten by inmates in the Dougherty County
        jail overnight: a broken jaw, cuts, broken ribs. Sheriff D. C. "Cull" Campbell, seventy-six, strikes C. B. King, come
        as Hansen''s lawyer, on the head with a cane. Pritchett: "This is exactly what we''ve been trying to prevent." Campbell
        to FBI agent Cheek: "Yeah, I hit him in the head. I told the son of a bitch to get out of my office, and he didn''t
        get out."'
