      when: Dec. 24
      date: '1961-12-24'
      thread: civil-rights-organizations
      also:
      - georgia-albany
      - press-and-broadcasting
      c: 'Sitton in the Sunday *New York Times*, "Rivalries Beset Integration Campaign": the quarrels among the organizations
        at Albany, traced to the sit-ins of 1960.'
      n: '[[w.branch-parting-the-waters]], 557. To check: Sitton, "Rivalries Beset Integration Campaign," New York Times,
        Dec. 24, 1961, E5 (cited by [[w.branch-parting-the-waters]], 557 n.4); Vernon Jordan''s reports and the NAACP officers''
        calls, Oct.–Dec. 1961, NAACP Papers, Library of Congress (cited by [[w.branch-parting-the-waters]], 557 n.2). See
        [[cal.1961-12-15.albany]].'
      src:
        c: 48b51d2b
        rows:
        - 'w.branch-parting-the-waters 557: all'
        - 'via w.branch-parting-the-waters 557 n.4: all'
      tags:
