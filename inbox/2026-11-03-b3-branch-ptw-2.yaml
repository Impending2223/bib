    text: 'Check: Branch, 625, has Marshall tell Robert Kennedy beforehand that Albany''s demonstrations were "not Roy''s
      style"; Clarence Mitchell asks the Department to act, arrest somebody, file a suit, protect a march; Kennedy: "You know
      as well as I do, Clarence, that we have done what we can do under existing law. ... We could do a great deal more if
      our hands weren''t tied" (Kunstler, *Deep in My Heart*, 118–19; Doar to Robert Kennedy, Aug. 7, 1962).'
