      c: B. C. Gardner, Mayor Kelley's law partner, for Gray, flies to Washington. He and Robert Kennedy agree King's jailing
        an embarrassment to Albany, Georgia, the Kennedys and the country, to be ended by any means. Gardner home that night
        with a plan. By Gardner's account.
      n: '[[w.branch-parting-the-waters]], 604. To check: interviews: B. C. Gardner, July 11, 1985 (cited by [[w.branch-parting-the-waters]],
        604 n.1). See [[cal.1962-07-11.georgia-albany-2]]. Names: Robert Kennedy, Martin Luther King.'
