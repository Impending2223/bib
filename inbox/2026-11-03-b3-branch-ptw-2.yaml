      c: 'Dawn. Gardner at the jail desk with $356: "Here''s Martin Luther King''s fine. Turn him out." The receipt made out
        to King and Abernathy. At 7:30 a.m. Pritchett tells them their fines are paid, by "an unidentified, well-dressed Negro
        male"; they must go.'
      n: '[[w.branch-parting-the-waters]], 606. To check: interviews: B. C. Gardner, July 11, 1985; James Gray, Jan. 24, 1986
        (cited by [[w.branch-parting-the-waters]], 606 n.2); New York Times, July 13, 1962, 10 (cited by [[w.branch-parting-the-waters]],
        606 n.3). See [[cal.1962-07-10.albany]]. Names: Martin Luther King, Abernathy.'
      src:
        c: e2508e20
        rows:
