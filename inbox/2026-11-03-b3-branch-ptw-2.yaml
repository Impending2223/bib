      when: Dec. 6
      date: '1961-12-06'
      thread: mississippi
      c: Moses out of the Pike County jail on a $1,000 appeal bond, after thirty-seven days for disturbing the peace in the
        McComb students' march of October.
      n: '[[w.branch-parting-the-waters]], 559. To check: U.S. Attorney, New York, "Résumé of the Inquiry Re: Robert Parris
        Moses," Mar. 21, 1962, SNCC Papers, box 17, King Library and Archives (cited by [[w.branch-parting-the-waters]], 559
        n.3). See [[cal.1961-10-04.mississippi]]. Names: Moses.'
      src:
        c: 84f4a773
        rows:
        - 'w.branch-parting-the-waters 559: all'
        - 'via w.branch-parting-the-waters 559 n.3: all'
      tags:
      - name:moses-robert-p
      - state:ms
- add:
    entry:
      id: cal.1961-12.mississippi
      when: Dec.
      date: 1961-12
      thread: mississippi
      c: McComb. A shotgun blast into the bedroom of the house where John Hardy lodges; he survives. The Masonic Temple closed
        to SNCC; no one comes to the registration classes.
      n: '[[w.branch-parting-the-waters]], 560. To check: SNCC, *Mississippi: A Chronicle of Violence*, 6, SNCC Papers, box
        16, King Library and Archives (cited by [[w.branch-parting-the-waters]], 560 n.1). Check: the day; Branch places it
        in the days before Moses left jail, Dec. 6. See [[cal.1961-10-04.mississippi]]. Names: Hardy.'
      src:
        c: 6744fafe
        rows:
        - 'w.branch-parting-the-waters 560: all'
        - 'via w.branch-parting-the-waters 560 n.1: A'
      tags:
      - name:hardy-john
      - state:ms
      - city:mccomb
- add:
    entry:
      id: cal.1961-12.mississippi-2
      when: Dec.
      date: 1961-12
      thread: mississippi
      also:
      - elections-1962
      c: 'Moses leaves southwest Mississippi with Hardy, Curtis Hayes, Hollis Watkins and others for Amzie Moore''s house
        at Cleveland, Miss., in the Delta. With Bevel and Diane Nash, out of jail on appeal, a new plan: small cadres of young
        workers, no alliances with the churches, the businessmen or white liberals; Negro candidates for Congress in two districts,
        R. L. T. Smith at Jackson, Moses his manager, and Theodore Trammell at Greenwood, Bevel his.'
      n: '[[w.branch-parting-the-waters]], 559–60. Check: the day; after Dec. 6. To check: interviews: Robert P. Moses, July
        30, 1984 (cited by [[w.branch-parting-the-waters]], 560 n.2). See [[cal.1961-10-04.mississippi]]. Names: Moses, Hardy,
        Diane Nash.'
      src:
        c: 15f8f9fc
        rows:
        - 'w.branch-parting-the-waters 559–60: all'
        - 'via w.branch-parting-the-waters 560 n.2: A'
      tags:
      - name:moses-robert-p
      - name:hardy-john
      - name:nash-diane
      - state:ms
- add:
    entry:
      id: cal.1962-01.elections-1962
      when: Jan.
      date: 1962-01
      thread: elections-1962
      also:
      - mississippi
      c: 'Jackson, Miss. The Reverend R. L. T. Smith, a Negro, announces on television for Congress: "We can''t lose."'
      n: '[[w.branch-parting-the-waters]], 560. To check: Jet, Jan. 25, 1962, 18ff. (cited by [[w.branch-parting-the-waters]],
        560 n.3). Check: the day. See [[cal.1961-12.mississippi-2]].'
      src:
        c: bd7cdc01
        rows:
        - 'w.branch-parting-the-waters 560: all'
        - 'via w.branch-parting-the-waters 560 n.3: all'
      tags:
      - state:ms
      - city:jackson
- add:
    entry:
