      when: July 11
      date: '1962-07-11'
      thread: georgia-albany
      c: 'Night. Six hundred at Shiloh. Outside, bricks and bottles at the police cars in Harlem. Pritchett, with Captain
        Ed Friend, into the church; an ovation. "I never have interrupted your peaceful assemblies. ... This business of throwing
        rocks is not good." Slater King: "We want to give him respect, but not like he''s some kind of God."'
      n: '[[w.branch-parting-the-waters]], 604–5. To check: New York Times, July 13, 1962, 10; Albany Journal, July 12, 1962,
        1, 16 (cited by [[w.branch-parting-the-waters]], 604 n.2); Watters, *Down to Now*, 204–8 (cited by [[w.branch-parting-the-waters]],
        604 n.5, 605 n.1); interviews: Laurie Pritchett, Nov. 25, 1986; Ed Haggerty, July 11, 1985 (cited by [[w.branch-parting-the-waters]],
        604 nn.3–4).'
      src:
