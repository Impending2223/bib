      when: Dec.
      date: 1961-12
      thread: mississippi
      also:
      - freedom-rides
      c: 'Judge Mize enjoins further Freedom Rides at McComb. Judge Cox upholds and extends the order: the ICC''s ruling applies
        to Negroes, the injunction only to agitators. Burke Marshall seeks reversal.'
      n: '[[w.branch-parting-the-waters]], 559–60. To check: New York Times, Dec. 23, 1961, 26 (cited by [[w.branch-parting-the-waters]],
        559 n.9). Check: the days of both orders. See [[cal.1961-12-01.mississippi]]. Names: Mize, Cox, Burke Marshall.'
      src:
        c: e38aeb1a
        rows:
        - 'w.branch-parting-the-waters 559–60: all'
        - 'via w.branch-parting-the-waters 559 n.9: A'
      tags:
      - name:mize-sidney-c
      - name:cox-w-harold
      - name:marshall-burke
      - state:ms
      - city:mccomb
- add:
    entry:
      id: cal.1961-12-19.georgia-albany
      when: Dec. 19
      date: '1961-12-19'
      thread: georgia-albany
      also:
      - press-and-broadcasting
      c: 'The *New York Herald Tribune* on the Albany truce: "a devastating loss of face" for King, "one of the most stunning
        defeats" of his career. Pritchett denies the city granted a point; the charges stand. Albany''s leaders give the white
        reporters a steak dinner at the Radium Springs club; Mayor Kelley: Robert Kennedy called within the hour of the truce
        to congratulate the city.'
      n: '[[w.branch-parting-the-waters]], 556–57. To check: New York Herald Tribune, Dec. 19, 1961 (cited by [[w.branch-parting-the-waters]],
        557 n.1); New York Times, Dec. 19, 1961, 1, 24; Albany Journal, Dec. 19, 1961, 1, 7, 10, 11 (cited by [[w.branch-parting-the-waters]],
        556 n.1). See [[cal.1961-12-15.albany]]. Names: Martin Luther King, Robert Kennedy.'
      src:
        c: b346bdf6
        rows:
        - 'w.branch-parting-the-waters 556–57: all'
        - 'via w.branch-parting-the-waters 557 n.1: A'
        - 'via w.branch-parting-the-waters 556 n.1: B-C'
      tags:
      - name:king-martin-luther-jr
      - name:kennedy-robert-f
      - state:ga
      - city:albany-ga
- add:
