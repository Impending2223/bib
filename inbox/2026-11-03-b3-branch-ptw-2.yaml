      c: 'The convention''s closing session. Roy James, a white man in the audience, walks onto the stage and strikes King
        in the face and back. King drops his hands: "Don''t touch him. We have to pray for him." James, a soldier for the
        American Nazi Party, he says. King will not press charges; Connor''s police bring them; James pleads guilty, thirty
        days. Within hours the FBI reports him a party member living at its "dormitory" outside Washington.'
      n: '[[w.branch-parting-the-waters]], 653–55. To check: interviews: Septima Clark, Dec. 17, 1983; Edward Gardner and
        John Drew, Jan. 21, 1986; Robert Brank Fulton''s statement, Sept. 29, 1962; Anne Braden to King and Walker, Oct. 6,
        1962, SCLC Papers (cited by [[w.branch-parting-the-waters]], 653 n.5); Rosen to Belmont, Sept. 28, 1962, FBI (cited
        by [[w.branch-parting-the-waters]], 655 n.2). See [[cal.1962-09-28.civil-rights-organizations]]. Names: Martin Luther
        King, Connor.'
