      when: July 21
      date: '1962-07-21'
      thread: georgia-albany
      c: 'Night, Shiloh, seven hundred waiting. The Reverend S. B. Wells, a freight loader at the Marine depot: "I''ve heard
        about an injunction, but I haven''t seen one!" Nearly two hundred, mostly teenagers, march behind him; blocked at
        the bus station, Wells kneels; Pritchett: "All right, Rev, come on and get up, goddamn it. Let''s go to jail." 113
        jailed, then some fifty more. King, watching from a car: "They can stop the leaders, but they can''t stop the people."'
      n: '[[w.branch-parting-the-waters]], 611–13. To check: interviews: S. B. Wells, July 9, 1985 (cited by [[w.branch-parting-the-waters]],
        612 n.1); New York Times, July 22, 1962, 1; Albany Herald, July 22, 1962, 1; Lewis, *King*, 161 (cited by [[w.branch-parting-the-waters]],
        612 n.2); interviews: Claude Sitton, Dec. 14, 1983 (cited by [[w.branch-parting-the-waters]], 612 n.3). See [[cal.1962-07-20.albany]].
        Names: Martin Luther King.'
