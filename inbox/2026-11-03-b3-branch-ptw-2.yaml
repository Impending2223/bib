    text: 'Check: Branch, 656–59, from the Dictabelts: at the first call Barnett would have Tom Watkins bring an idea to Washington:
      "I want to think it over a few days"; at the second, Robert Kennedy puts the Jackson plan; Barnett''s highway patrolmen
      "absolutely be unarmed"; the President calls Sorensen in the hospital for a television address. Salinger cancels it
      that evening; Marshall: "We''ve got a deal with Barnett." After the game the deal is off; near midnight the President
      signs the proclamations Schlei brings: "that''s General Grant''s table."'
