      c: 'Night. Terrell County, Ga., the Mount Olive Baptist Church: Sherrod''s registration meeting, thirty-eight Negroes
        and two white SNCC workers. Sheriff Z. T. Mathews and armed deputies burst in; from the pulpit he says no more than
        the 51 registered of the county''s 8,209 Negroes need be: "We want our colored people to go on living like they have
        for the last hundred years." Registration closed until December. The reporters'' tire slashed, sand in their tank.'
      n: '[[w.branch-parting-the-waters]], 619–20. To check: Sitton, New York Times, July 27, 1962, 1; Watters, *Down to Now*,
        164–68 (cited by [[w.branch-parting-the-waters]], 619 n.2).'
