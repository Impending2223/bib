        c: 'Peoples'' Council Against Ratification of the Security Treaty holds its rally in Hibiya Park: 100,000 called, slightly more than 1,000 show.'
        n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) (Richard J. H. Johnston, "Demonstration Draws 22,000 of 225,000 Expected in Japan," Tokyo, July 2: the rally scheduled "this afternoon" of Government employees, union members and students; the Council''s "announced sole aim" the abandonment of the security pact; page not shown). See [[cal.1960-07-02.japan-2]].'
  - add:
      entry:
        id: cal.1960-07-02.cuba-10
        when: By July 2
        date: '1960-07-02'
        place: havana
        thread: cuba
        also: [soviet-union]
        c: 'Soviet ship *Jean Jaurès* appears off Morro Castle earlier in the week, goes on to Matanzas to discharge cargo; due back in Havana Monday, July 4. Shipping circles speculate she carries arms for the Castro Government.'
        n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Soviet Tankers on Way to Cuba," London, July 2, AP: "earlier this week"; "Monday"; the speculation the dispatch''s; page not shown). Check: the day of the call off Morro Castle; the cargo. See [[cal.1960-07-02.cuba-7]].'
