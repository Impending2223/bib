patch: 2026-11-13-b13-risen
by: 'Claude (b13-risen: Risen, The Bill of the Century, PDF text to printed p. 145), Nov. 12-13, 2026'
ops:
- add:
    entry:
      id: cal.1963-10-24.republican-party-congress-2
      when: Oct. 24
      date: '1963-10-24'
      thread: republican-party-congress
      c: Kennedy, waiting since noon for the call Halleck promised, telephones him a few minutes before 1 p.m. Halleck
        has the votes to get the bill out of the Judiciary Committee; by O'Brien's account Kennedy is "overjoyed."
      n: '[[w.risen-bill-of-the-century]], 129 (O''Brien''s account; the day by Risen''s order after the Yellow
        Room meeting). To check: O''Brien, *No Final Victories* (1974), 148 (cited by [[w.risen-bill-of-the-century]],
        129 n.47). See [[cal.1963-10-24.civil-rights-bill]]. Names: Kennedy, Halleck, O''Brien. Check: the day.'
      tags:
      - name:kennedy-john-f
      - name:halleck-charles-a
      - name:obrien-lawrence-f
      src:
        c: 19ee22a6
        rows:
        - 'w.risen-bill-of-the-century 129: all'
- add:
    entry:
      id: cal.1963-10-21.civil-rights-bill
      when: Oct. 21
      date: '1963-10-21'
      thread: civil-rights-bill
      c: 'Libonati, late in the afternoon, to Harvard undergraduates lobbying on Capitol Hill for the bill: he will
        withdraw his amendment. The Harvard Crimson reports it next day. McCulloch hears of it and telephones Robert
        Kennedy''s office; Kennedy is out.'
      n: '[[w.risen-bill-of-the-century]], 124 (the students'' visit; Kennedy later swore he never had the message).
        To check: *Harvard Crimson*, Oct. 22, 1963, "Lobbyists Press for Civil Rights Bill" (cited by [[w.risen-bill-of-the-century]],
        124 n.30). See [[cal.1963-10-10.civil-rights-bill]]. Names: Libonati, McCulloch, Robert Kennedy.'
      tags:
      - name:libonati-roland-v
      - name:mcculloch-william-m
      - name:kennedy-robert-f
      src:
        c: 52271fbc
        rows:
        - 'w.risen-bill-of-the-century 124: all'
- add:
    entry:
      id: cal.1963-07-17.civil-rights-bill-2
      when: July 17
      date: '1963-07-17'
      thread: civil-rights-bill
      c: 'Satterfield, in a memorandum, plans a Coordinating Committee for Fundamental American Freedoms against
        the civil rights bill: offices near Capitol Hill, a research staff, files on vulnerable Senators, witnesses,
        pamphlets and ads, mailing lists, editorial pages in the Midwest and mountain States; $100,000 for six months.'
      n: '[[w.risen-bill-of-the-century]], 98–99 (the memorandum of July 17; later Loeb chairman, Kilpatrick vice
        chairman, Draper''s $215,000 by way of the Mississippi State Sovereignty Commission, 99). To check: "Rough
        Memo Concerning Preparation for Work of the Committee to Defeat the Civil Rights Act of 1963," box 17, Filvaroff
        and Wolfinger Papers, University at Buffalo Library (cited by [[w.risen-bill-of-the-century]], 98 n.74).
        Names: Loeb.'
      tags:
      - name:loeb-henry
      src:
        c: 39123b2d
        rows:
        - 'w.risen-bill-of-the-century 98–99: all'
- add:
    entry:
      id: cal.1963-07-11.civil-rights-bill
      when: July 11
      date: '1963-07-11'
      thread: civil-rights-bill
      c: 'Washington, the Mayflower Hotel. Satterfield''s first off-the-record breakfast for his committee against
        the civil rights bill: seventy-five representatives of the Chamber of Commerce, the American Bar Association
        and other groups; none agrees to join.'
      n: '[[w.risen-bill-of-the-century]], 99 (the breakfast; the Chicago breakfast of the committee''s staff director
        Synon a bigger failure, undated). To check: John Synon, interview by Raymond Wolfinger, Sept. 7, 1965, box
        22, Filvaroff and Wolfinger Papers, University at Buffalo Library (cited by [[w.risen-bill-of-the-century]],
        99 n.75).'
      tags: []
      src:
        c: aea5b59e
        rows:
        - 'w.risen-bill-of-the-century 99: all'
- add:
    entry:
      id: cal.1963-06-07.civil-rights-bill
      when: June 7
      date: '1963-06-07'
      thread: civil-rights-bill
      c: 'Biemiller of the AFL-CIO leaves a memorandum at the White House on the coming bill: "The package is inadequate";
        fair employment wanted. That afternoon, Meany having telephoned him from Italy, he sees Kennedy. By Biemiller''s
        account Kennedy says they will "kill the bill" and he cannot go with them.'
      n: '[[w.risen-bill-of-the-century]], 108 (Biemiller''s recollection). To check: "Labor Views on Administration
        Civil Rights Program," June 7, 1963, box 9, Filvaroff and Wolfinger Civil Rights Act Papers, University
        at Buffalo Library (cited by [[w.risen-bill-of-the-century]], 108 n.100); Biemiller, interview by Stern,
        May 24, 1979, JFK Library (cited by [[w.risen-bill-of-the-century]], 108 n.101). Names: Biemiller, Meany,
        Kennedy. Check: the hour; Kennedy''s words are Biemiller''s paraphrase.'
      tags:
      - name:biemiller-andrew-j
      - name:meany-george
      - name:kennedy-john-f
      src:
        c: dd332549
        rows:
        - 'w.risen-bill-of-the-century 108: all'
