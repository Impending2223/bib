      id: cal.1966-08.china-leadership-51
      when: Aug., after the 5th
      date: '1966-08'
      at: after 1966-08-05
      place: peking
      thread: china-leadership
      c: Lin Biao 林彪, arrived in Peking, told by Mao 毛泽东 that he is to be the successor, writes Mao that he cannot accept. Mao insists, and Lin gives in.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 64. Made public: 1993 ([[w.weixun-wo-suo-zhidaode-ye]]). To check: [[w.weixun-wo-suo-zhidaode-ye]], 215 (cited by [[w.teiwes-tragedy-of-lin-biao]], 64 n.18a); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 64 n.18b). See [[cal.1966-08-06.china-leadership-2]]. Names: Lin Biao, Mao Zedong.'
      tags:
