- add:
    entry:
      id: cal.1966-10-01.china-leadership-10
      when: Oct. 1
      date: '1966-10-01'
      place: peking
      thread: china-leadership
      c: Tiananmen 天安门, the National Day rostrum. A representative of a mass organization in the army's schools, perhaps Tao Zhu's 陶铸 daughter, complains to Mao 毛泽东 and Lin Biao 林彪 of the suppression of mass activities in those schools.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 66 (in a Party historian''s version, 66 n.22, Mao''s daughter and Tao Shiliang talk, Tao Shiliang critical of the suppression in army schools, Lin Doudou present). Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: a Party historian in the military, interview by Teiwes and Sun, as they report it (cited by [[w.teiwes-tragedy-of-lin-biao]], 66 n.22); [[w.nianyi-da-dongluande-niandai]], 96 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23a); [[w.yunsheng-maojiawan-jishi]], 42–43 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23c). Names: Tao Zhu, Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:tao-zhu
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
      src:
        c: f7005f75
        rows:
