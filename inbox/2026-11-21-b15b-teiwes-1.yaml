- add:
    entry:
      id: cal.1966-08.china-leadership-55
      when: Aug., at the Eleventh Plenum
      date: '1966-08'
      at: after 1966-08-01
      thread: china-leadership
      c: Mao 毛泽东 asks He Long 贺龙, who has held back at the Party life meetings (shenghuohui) where Liu Shaoqi 刘少奇 and Deng Xiaoping 邓小平 are sharply criticized, whether he has joined in, and urges him to speak frankly; He says he cannot make such severe charges as the other leaders.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 34 (shortly afterward He Long''s situation seriously worsens). Made public: 1993 ([[w.he-long-zhuan-bianxiezu-he-long-mengnan-jishi]]). To check: [[w.he-long-zhuan-bianxiezu-he-long-mengnan-jishi]], 79–81 (cited by [[w.teiwes-tragedy-of-lin-biao]], 34 n.67). Names: Mao Zedong, He Long, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:he-long
