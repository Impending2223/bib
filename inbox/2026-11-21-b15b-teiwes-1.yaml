      when: Apr.
      date: '1967-04'
      thread: china-leadership
      c: Three dancers of the air force troupe planning the show for the anniversary of the Yan'an talks, Mao's 毛泽东 dancing partners at Zhongnanhai, tell him their story. Mao, knowing they back Wu Faxian 吴法宪 and Yu Lijin 余立金, is sympathetic, tells them he means to protect Wu, and refers them to Ye Qun 叶群.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 43 (the authors'' reconstruction). Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 287, 379–380 (cited by [[w.teiwes-tragedy-of-lin-biao]], 44 n.86a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 292 (cited by [[w.teiwes-tragedy-of-lin-biao]], 44 n.86b); [[w.barnouin-ten-years-of-turbulence]], 132–134 (cited by [[w.teiwes-tragedy-of-lin-biao]], 44 n.86c). Names: Mao Zedong, Wu Faxian, Ye Qun.'
