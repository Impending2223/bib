      n: '[[w.teiwes-tragedy-of-lin-biao]], 45, 88 (Lin recuperating at Beidaihe). Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 287, 380 (cited by [[w.teiwes-tragedy-of-lin-biao]], 45 n.87a); [[w.xu-xiangqian-zhuan]], 535 (cited by [[w.teiwes-tragedy-of-lin-biao]], 45 n.87b); *Xinqingyuan* (New Light Industry College), a Red Guard paper, no. 40 (Sept. 19, 1967), 4 (cited by [[w.teiwes-tragedy-of-lin-biao]], 45 n.87c); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 45 n.87d); [[w.nianyi-da-dongluande-niandai]], 380 (cited by [[w.teiwes-tragedy-of-lin-biao]], 88 n.68). Names: Zhou Enlai, Jiang Qing, Wu Faxian, Ye Qun, Qiu Huizuo.'
      tags:
