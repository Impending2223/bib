      id: cal.1966-10.china-leadership-22
      when: Oct., early
      date: '1966-10'
      at: before 1966-10-01
      thread: china-leadership
      c: Lin Biao 林彪 sends the army group's draft to the Cultural Revolution Group; Chen Boda 陈伯达, Jiang Qing 江青, Kang Sheng 康生 and Zhang Chunqiao 张春桥 object that various points cannot stand, revise it heavily and add a clause abolishing Party committee leadership of the movement.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 67. Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 96 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23a); [[w.yunsheng-maojiawan-jishi]], 42–43 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23c). See [[cal.1966-10.china-leadership-21]]. Names: Lin Biao, Chen Boda, Jiang Qing, Kang Sheng, Zhang Chunqiao.'
