      id: cal.1966-10.china-leadership-24
      when: Oct., late
      date: '1966-10'
      at: before 1966-10-21
      place: peking
      thread: china-leadership
      c: Peking. Military students besiege the Defense Ministry, into early November. Lin Biao 林彪 tries to keep clear of it; Zhou Enlai's 周恩来 political skill defuses it.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 67. To check: [[w.nianyi-da-dongluande-niandai]], 96–99 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24a); [[w.yunsheng-maojiawan-jishi]], 56–58, 61–62 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24b); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 277–278 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24c); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXV, 161 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24d); [[w.yanjiubu-zhongguo-renmin-jiefang-jun]], 627 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24e); [[w.barnouin-ten-years-of-turbulence]], 126–132 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24f); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24g). Names: Lin Biao, Zhou Enlai.'
