- add:
    entry:
      id: cal.1966-03-11.china-leadership-5
      when: Mar. 11
      date: '1966-03-11'
      thread: china-leadership
      c: 'Lin Biao 林彪, by letter, on political work in industry and communications, after the five-week national conference on industry and communications and its political work: Mao''s thought and "politics in command"; the system doing an "excellent" job of promoting politics, and in recent years reforming the working people''s outlook.'
      n: '[[w.teiwes-tragedy-of-lin-biao]], 57, 59–60. Made public: *Renmin ribao*, June 1966 ([[w.teiwes-tragedy-of-lin-biao]], 59). To check: [[w.kau-lin-piao-affair]], 321–322 (cited by [[w.teiwes-tragedy-of-lin-biao]], 60 n.6a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 264–265 (cited by [[w.teiwes-tragedy-of-lin-biao]], 60 n.6b). Names: Lin Biao, Mao Zedong.'
      tags:
