      when: Oct., early
      date: '1966-10'
      at: before 1966-10-01
      thread: china-leadership
      c: Lin Biao 林彪 orders the army's Cultural Revolution Group to draft an urgent directive on the movement in the military schools. Its draft, with various proposals, affirms the Party committees' leadership.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 66–67. Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 96 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23a); [[w.yunsheng-maojiawan-jishi]], 42–43 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23c). Names: Lin Biao.'
