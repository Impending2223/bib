      date: '1966-08'
      at: after 1966-08-01
      thread: china-leadership
      c: At the Eleventh Plenum, to the participants' many anxious questions how long the movement will last, assurances that it will be over in three months.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 65 ("apparently"). Made public: 1986 ([[w.lishi-zai-zheli-chensi]]). To check: [[w.harding-chinese-state-in-crisis-1991]], 138–141, 174 (cited by [[w.teiwes-tragedy-of-lin-biao]], 65 n.19a); [[w.lishi-zai-zheli-chensi]], I, 167 (cited by [[w.teiwes-tragedy-of-lin-biao]], 65 n.19b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 65 n.19c).'
