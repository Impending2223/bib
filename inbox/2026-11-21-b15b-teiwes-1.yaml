      date: '1967-04'
      at: before 1967-04-21
      thread: china-leadership
      c: Ye Qun 叶群 receives the three dancers, tells them their support of Wu Faxian 吴法宪 is right and endorses their show for May 13; seeing their faction is a minority, she advises them to join the navy's and the logistics department's "royalists."
      n: '[[w.teiwes-tragedy-of-lin-biao]], 43. Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 287, 379–380 (cited by [[w.teiwes-tragedy-of-lin-biao]], 44 n.86a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 292 (cited by [[w.teiwes-tragedy-of-lin-biao]], 44 n.86b); [[w.barnouin-ten-years-of-turbulence]], 132–134 (cited by [[w.teiwes-tragedy-of-lin-biao]], 44 n.86c). See [[cal.1967-04.china-leadership-21]]. Names: Ye Qun, Wu Faxian.'
