        - 'via x.undated.teiwes-sun-interview-military-party-historian: ?'
        - 'via x.undated.teiwes-sun-oral-sources: ?'
- add:
    entry:
      id: cal.1966-10.china-leadership-19
      when: Oct., after the 1st
      date: '1966-10'
      at: after 1966-10-01
      thread: china-leadership
      c: Ye Qun 叶群, told by Lin Doudou of Tao Shiliang's complaint at Tiananmen, takes it for a new turn in the movement and urges Doudou to "blow wind in Lin Biao's 林彪 ear," presenting it as Mao's view.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 66 n.22 (a Party historian in the military, interviewed). Made public: 1996 ([[w.teiwes-tragedy-of-lin-biao]], the account''s first printing). To check: a Party historian in the military, interview by Teiwes and Sun, as they report it (cited by [[w.teiwes-tragedy-of-lin-biao]], 66 n.22). See [[cal.1966-10-01.china-leadership-10]]. Names: Ye Qun, Lin Biao, Mao Zedong.'
      tags:
