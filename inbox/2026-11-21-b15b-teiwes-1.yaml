      date: '1967-08'
      at: before 1967-08-01
      thread: china-leadership
      c: 'Lin Biao 林彪, by letter, reports to Mao: Chen Zaidao''s problem handled as instructed, new men sent to take over the Wuhan Military Region; the clashes of mass factions, and above all the seizure of weapons from the army''s armories, need attention at once. He has the Cultural Revolution Group''s leaders vet the letter first; they change some words, not its message.'
      n: '[[w.teiwes-tragedy-of-lin-biao]], 85–86 ("apparently in early August"; the timing from the tenor of Zhang Yunsheng''s recollections, 85 n.60). Made public: 1988 ([[w.yunsheng-maojiawan-jishi]]). To check: [[w.wen-feng-shentanxia-de-lin-biao]], 152–154 (cited by [[w.teiwes-tragedy-of-lin-biao]], 85 n.60a); *Dongfanghong kuaibao* (The East Is Red Bulletin), a Red Guard paper, no. 102 (October 1967), 12 (cited by [[w.teiwes-tragedy-of-lin-biao]], 85 n.60b); [[w.wen-feng-shentanxia-de-lin-biao]], 152–153 (cited by [[w.teiwes-tragedy-of-lin-biao]], 86 n.62a); [[w.yunsheng-maojiawan-jishi]], 129–131 (cited by [[w.teiwes-tragedy-of-lin-biao]], 86 n.62b). Names: Lin Biao, Mao Zedong.'
      tags:
      - polity:prc
