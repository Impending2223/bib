      thread: china-leadership
      c: Xiao Hua 蕭華, head of the General Political Department, under Jiang Qing's pressure and taking a neutral stand, tells the two army troupes' factions to stage a joint show; both refuse. Ye Qun 叶群 is said to be enraged.
