      id: cal.1966-11.china-leadership-30
      when: Nov., before the 17th
      date: '1966-11'
      at: before 1966-11-17
      thread: china-leadership
      c: Yu Qiuli 余秋里, a leading planning official, proposes to Li Fuchun 李富春, nominal head of the State Planning Commission and a new member of the Politburo Standing Committee, a meeting on the Cultural Revolution and the needs of production.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 68 (Yu in fact ran the Commission; Li assisted Zhou Enlai on the economy, 68 n.25). Made public: 1987 ([[w.shinian-houde-pingshuo]]). To check: [[w.nianyi-da-dongluande-niandai]], 134–137 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.25a); [[w.shinian-houde-pingshuo]], 47–52 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.25b); [[w.li-ping-wenhua-dageming-zhongde-zhou-enlai]], 122 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.25c). See [[cal.1966-11-17.china-leadership-2]]. Names: Li Fuchun.'
