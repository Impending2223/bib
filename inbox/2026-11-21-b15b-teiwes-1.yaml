      id: cal.1966-09.china-leadership-26
      when: Sept.
      date: '1966-09'
      place: peking
      thread: china-leadership
      c: Maojiawan, Lin Biao's 林彪 residence in Peking. Many letters addressed to Mao and Lin arrive, by Zhang Yunsheng's recollection papers "signed by Chairman Mao," as material against He Long 贺龙 is gathered.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 10, 35 (whether Mao passed on papers first sent from Maojiawan, or sent new ones, the authors cannot tell). Made public: 1988 ([[w.yunsheng-maojiawan-jishi]]). To check: [[w.yunsheng-maojiawan-jishi]], 33–39 (cited by [[w.teiwes-tragedy-of-lin-biao]], 36 n.70a); [[w.nianyi-da-dongluande-niandai]], 383 (cited by [[w.teiwes-tragedy-of-lin-biao]], 36 n.70b). Names: Lin Biao, He Long, Mao Zedong.'
