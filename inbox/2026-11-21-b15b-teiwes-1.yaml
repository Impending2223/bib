- add:
    entry:
      id: cal.1966-09.china-leadership-25
      when: Sept., early
      date: '1966-09'
      at: before 1966-09-01
      thread: china-leadership
      c: Mao 毛泽东 asks Lin Biao 林彪 to convene the Military Commission's Standing Committee to "issue a warning" about He Long 贺龙, under the guideline "first struggle, then protect."
      n: '[[w.teiwes-tragedy-of-lin-biao]], 35 (by Zhang Yunsheng''s recollection; presumably before Mao''s consoling remarks to He). Made public: 1988 ([[w.yunsheng-maojiawan-jishi]]). To check: [[w.yunsheng-maojiawan-jishi]], 33–39 (cited by [[w.teiwes-tragedy-of-lin-biao]], 36 n.70a); [[w.nianyi-da-dongluande-niandai]], 383 (cited by [[w.teiwes-tragedy-of-lin-biao]], 36 n.70b). See [[cal.1966-09-06.china-leadership-2]]. Names: Mao Zedong, Lin Biao, He Long.'
      tags:
