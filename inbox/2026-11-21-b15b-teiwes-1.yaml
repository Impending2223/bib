    item: '[[w.teiwes-tragedy-of-lin-biao]], 52, 92–101 (Lin, two hours late, speaks from an outline Mao gave him: Yang''s "mountaintopism," trusting a small gang from one district of Jin-Cha-Ji; "double dealing," a "Luo Ruiqing element"; the "distortion of Marxism," the "absolute authority" theory; Yang meant to remove Wu Faxian, Xie Fuzhi, Xu Shiyou, Han Xianchu, Huang Yongsheng, Chen Xilian and Yang Dezhi; the minority to be knocked down; the top leadership met Mao four times to decide; nothing of a "rightist wind" or a backer; of Jiang Qing: she "loyally executed Chairman Mao''s instructions" and "has been very creative herself")'
