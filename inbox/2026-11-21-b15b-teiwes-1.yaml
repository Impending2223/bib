      n: '[[w.teiwes-tragedy-of-lin-biao]], 20 n.28 (senior Party historians hold the report unreliable; a well-placed historian: an investigation found the 1956 vote for Mao unanimous). Made public: 1991 ([[w.gai-jun-zhongguo-gongchandang-boran-zhuangkuo]]). To check: Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 20 n.28a); [[w.gai-jun-zhongguo-gongchandang-boran-zhuangkuo]], 447 (cited by [[w.teiwes-tragedy-of-lin-biao]], 20 n.28b); [[w.macfarquhar-succession-to-mao-and]], 306 n. (cited by [[w.teiwes-tragedy-of-lin-biao]], 20 n.28c); [[w.teiwes-mao-and-his-lieutenants]], 63–67 (cited by [[w.teiwes-tragedy-of-lin-biao]], 20 n.28d). Names: Ye Jianying, Mao Zedong, Lin Biao.'
