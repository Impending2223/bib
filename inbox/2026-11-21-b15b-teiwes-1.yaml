- add:
    entry:
      id: cal.1966-10.china-leadership-23
      when: Oct., early
      date: '1966-10'
      at: before 1966-10-01
      thread: china-leadership
      c: 'Liu Zhijian 劉志堅, head of the army''s Cultural Revolution Group, argues there is no precedent for abolishing Party committee leadership. Zhang Chunqiao 张春桥: Party leadership is leadership by Mao and his Thought. Liu: very fine, but the lower levels still need concrete persons to lead them.'
      n: '[[w.teiwes-tragedy-of-lin-biao]], 67. Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 96 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23a); [[w.yunsheng-maojiawan-jishi]], 42–43 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23c). See [[cal.1966-10.china-leadership-22]]. Names: Zhang Chunqiao, Mao Zedong.'
