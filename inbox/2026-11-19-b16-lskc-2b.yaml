      when: Feb. 4
      date: '1967-02-04'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: An Phú, Bến Cát. The village forces, having learned the plan, break a sweep by a battalion and by the history's count put nearly 100 out of action and destroy two armored vehicles.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 323. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: ben-cat
- add:
    entry:
      id: cal.1967-02-18.vietnam-hanoi
      when: Feb. 18
      date: '1967-02-18'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cà Na hamlet, Long Nguyên commune, Bến Cát. Bến Cát district troops and the Long Nguyên guerrillas turn back a sweep by two battalions. The same day the Uyên Hưng guerrillas destroy a group of 36 pacification workers.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 323. See [[cal.1967-02-04.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:rvn
      place: ben-cat
- add:
    entry:
      id: cal.1967-02-23.vietnam-hanoi
      when: Feb. 23–24
      date: '1967-02-23'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 20, Di Linh, Lâm Đồng. Battalion 186 with Di Linh district troops attacks the strategic hamlet at kilometer 5 and destroys a Civil Guard platoon; Feb. 24 an ambush destroys a security company sent to relieve it. The two blows set the people of the hamlet to rise; the battalion then goes on, with Battalion 145, against Saigon's defenses west and northwest of Bảo Lộc and the commandos at Tân Rai.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 316–17. The time is the first day''s. Check: the day of the attack on Bảo Lộc; the history gives none.'
      tags:
      - polity:drv
      - polity:rvn
      place: di-linh
- add:
    entry:
      id: cal.1967-02.vietnam-hanoi-3
      when: Feb., late
      date: 1967-02
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Lê Hồng Phong base area, Bình Thuận. Six battalions of American and Korean troops sweep into the base; Company 440 of the province, village guerrillas and self-defense men put 230 out of action, destroy two armored vehicles and shoot down two helicopters. The enemy holds some ground but cannot move the people into new hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 317. Check: the day; the history says "the end of February". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rok
