      when: Apr. 30
      date: '1966-04-30'
      thread: vietnam-struggle
      c: Đà Nẵng. A large demonstration; the administration of Thiệu and Kỳ in the city is paralyzed. The people hold many wards, seize the government buildings and the radio station, wreck the American Information Office and arrest agents of the police.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 137–138. See [[cal.1966-03-30.vietnam-struggle]]. Names: Kỳ, Thiệu. Check: whether the day is Apr. 30 or the sentence''s run to it.'
