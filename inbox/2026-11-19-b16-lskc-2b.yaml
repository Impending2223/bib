      n: '[[w.lich-su-khang-chien-chong-my]], IV, 102. See [[cal.1966-01-19.vietnam-hanoi]]. The history gives, for Jan. and Feb., 1,583 killed by the Blue Dragon brigade in Tuy Hòa district. Check: the charge; no record read.'
