      when: Nov. 6–8
      date: '1966-11-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Chà Dơ, Sa Mát, Trại Đèn and Bãi Trứng, Tây Ninh. The 1st Division's 2d Brigade lands at Chà Dơ and Sa Mát and its 3d Brigade at Trại Đèn and Bãi Trứng; Regiment 16 of the 9th Division hits them as they land and by the history's count hurts a battalion badly at Chà Dơ and east of Trại Đèn. The night of Nov. 7 into 8 Battalion 1 of Regiment 16 raids the camp of Battalion 2, 2d Brigade, at Chà Dơ, destroying a company and wearing down another.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 245. See [[cal.1966-11-02.vietnam-hanoi]]. The time is the first day''s; the history says "the night of the 7th into the 8th" for the raid. Check: the clock, whose it is. The figures are the history''s.'
