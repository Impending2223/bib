    id: cal.1966-03-12.vietnam-struggle
    item: '[[w.lich-su-khang-chien-chong-my]], IV, 137 (the first small meetings and demonstrations at Huế and Đà Nẵng, Mar. 12, before the strikes)'
    units: A
- add:
    entry:
      id: cal.1966-03-19.vietnam-struggle-4
      when: Mar. 19
      date: '1966-03-19'
      thread: vietnam-struggle
      also:
      - vietnam-hanoi
      c: 'Đà Nẵng. The Huế students'' general association sends delegates to a conference of Đà Nẵng students and pupils on two questions: the harm of the red dollar; selling the country or saving it.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 137. Check: the conference''s place; the history says only that the Huế association sent its delegates "in".'
      tags:
      - polity:drv
      - polity:rvn
      place: da-nang
- add:
    entry:
      id: cal.1966-03-28.vietnam-struggle
      when: Mar. 28
      date: '1966-03-28'
      thread: vietnam-struggle
      c: Đà Lạt. Students of the university and pupils of the Trần Hưng Đạo, Bùi Thị Xuân and Bồ Đề schools strike for democracy and better living; they march to the market and call on the people to close it.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 140. See [[cal.1966-03-12.vietnam-struggle]].'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
- add:
    entry:
      id: cal.1966-03-30.vietnam-struggle-4
      when: Mar. 30
      date: '1966-03-30'
      thread: vietnam-struggle
      c: 'Đà Nẵng. By the history''s count more than 100,000 march in a show of strength: "Thiệu and Kỳ resign," "the Americans must withdraw."'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 137. See [[cal.1966-03-12.vietnam-struggle]]. The figure is the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: da-nang
- add:
    entry:
      id: cal.1966-04-01.vietnam-struggle
      when: Apr. 1
      date: '1966-04-01'
      thread: vietnam-struggle
      c: 'Đà Lạt. More than 3,000 rally at the Hòa Bình exhibition ground and march to the American Information Office to demand the Americans leave the city, then to the city hall with three demands: news of the struggle on the radio, a headquarters, protection. The marchers take the radio station and broadcast a declaration of Vietnam''s "ten wants and ten don''ts."'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 140–141. See [[cal.1966-03-28.vietnam-struggle]]. Check: the rally''s day against Mar. 28 and the radio''s hours; the history gives the day alone.'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
- add:
    entry:
      id: cal.1966-04-02.vietnam-struggle-6
      when: Apr. 2
      date: '1966-04-02'
      thread: vietnam-struggle
      c: Huế. By the history's count nearly half the city's people march, 15,000 of them soldiers of I Corps and officials of the Saigon administration; each group adds its own demands.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 137. See [[cal.1966-03-12.vietnam-struggle]]. The figure is the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: hue
- add:
    entry:
      id: cal.1966-04-04.vietnam-struggle-9
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-struggle
      c: Đà Lạt. Troops and police take back the radio station; the crowd, held off to this day, burns it and withdraws.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 141. See [[cal.1966-04-01.vietnam-struggle]]. The history also has field police and rangers retaking the Hòa Bình market, with no day. Check: the place; the history''s paragraph is on Đà Lạt.'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
