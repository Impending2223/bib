      when: Dec. 17
      date: '1966-12-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Long Giang and Lộc Giang, Hoài Ân. Regiment 12 of the 3d Division, with district troops and the Hoài Ân guerrillas, beats a sweep by four companies of the American air cavalry.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 308. Check: the district; the history gives it for the guerrillas, not for the ground.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1966-12-25.vietnam-hanoi
      when: Dec. 25
      date: '1966-12-25'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Xuân Sơn. Regiment 12 attacks without warning and destroys a mixed American force of two artillery and two infantry companies.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 308. See [[cal.1966-12-17.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
