      when: May–June
      date: 1967-05
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Hạ Cần Giuộc, Long An. In May and June district troops and guerrillas fight off one sweep after another by an American brigade across eight communes and by the history's count put hundreds out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 329. Check: the days; the history gives the two months. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
