- cite:
    id: cal.1966-01-28.vietnam-operations
    item: '[[w.lich-su-khang-chien-chong-my]], IV, 111–13 (the landing at Đức Phổ, Jan. 28, 8 a.m., at the Phổ An and Phổ Quang beaches: five Marine battalions, a Saigon marine task force and the 5th Regiment, 8,000 men; the Marines end it Feb. 18)'
    units: A
