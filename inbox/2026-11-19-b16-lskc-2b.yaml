      c: Núi Một, Phù Mỹ. After the American command sends two brigades of the 1st Cavalry Division from An Khê and three Saigon battalions into the Hội Sơn valley (Operation Taylor, from Sept. 15), the Region's main force attacks the command post at Núi Một that night. In an hour by the history's count it takes the ground, puts hundreds, mostly Americans, out of action, destroys scores of vehicles and ends the operation.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 216. Check: the clock, whose it is; the American name of the operation. The figures are the history''s.'
