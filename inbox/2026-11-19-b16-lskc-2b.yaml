      c: Phổ Nhơn and Phổ Phong communes, Đức Phổ. A battalion of American troops comes in; guerrillas stop it and by the history's count kill 18.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 112. See [[cal.1966-01-28.vietnam-operations]]. The figures are the history''s.'
