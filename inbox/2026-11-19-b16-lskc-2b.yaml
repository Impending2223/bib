      - vietnam-operations
      c: Route 4, Cái Bè to Trung Lương, Mỹ Tho. That night 700 mines and charges, laid by two engineer companies of the region, a Mỹ Tho engineer platoon, 37 guerrilla teams and 1,500 civilians, wreck 80 points of the road; the people along it rise in the new hamlets. Two more waves in August follow.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 331. Check: the year, which the page leaves to the dry season 1966–67; the history''s count of mines and men; the clock, whose it is.'
