      id: cal.1967-05-16.vietnam-struggle
      when: May 16
      date: '1967-05-16'
      thread: vietnam-struggle
      c: The student Nhất Chi Mai, a Buddhist, burns herself to death on the Buddha's 2,511th birthday (the 8th of the 4th lunar month, Đinh Mùi) to protest the war and ask peace and equality among the religions. The history says it moved tens of thousands and began a Buddhist movement against the Americans and Thiệu and Kỳ; each year on the holiday the students hold a "Nhất Chi Mai" week of demonstrations.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 325. Names: Kỳ, Thiệu. Check: the place, which the history does not give; the day.'
      tags:
      - polity:drv
      - polity:rvn
      - name:nguyen-cao-ky
      - name:nguyen-van-thieu
