      c: Thạnh Phú, Hòa Mỹ commune. That night a raid annihilates a Korean company.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 102. See [[cal.1966-01-19.vietnam-hanoi]]. Check: the unit; the history says "a company of Korean troops".'
      tags:
