      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Châu Hưng post, Bình Đại, Bến Tre. That night a sapper detachment of Battalion 261 with secret self-defense men attacks and destroys the Civil Guard post. At the same time a company of Battalion 516 attacks the Giồng Quéo post and destroys a "propaganda" platoon.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 332. Check: the clock, whose it is.'
