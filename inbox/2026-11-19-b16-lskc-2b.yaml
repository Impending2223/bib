      c: Phổ An commune, Đức Phổ. An American company comes in; eleven district local-force men and ten commune guerrillas draw it into their ground and in six hours by the history's count kill 106 and shoot down five aircraft, three falling on the spot.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 113. See [[cal.1966-01-28.vietnam-operations]]. The figures are the history''s.'
