      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tuy Đức, Quảng Đức. The Region 6 forces, with Regiment 16 sent by the Liberation Army command, open fire without warning and destroy the post, then turn to Bu Prăng; Route 14 is cleared from southwest of Đức Lập to Bát Kiến Đức, and Phước Long's liberated area joins west Quảng Đức's.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 118. Check: the day; the history says "early February".'
