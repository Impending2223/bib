    entry:
      id: cal.1967-01-29.vietnam-hanoi
      when: Jan. 29
      date: '1967-01-29'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Phố Tinh, Tịnh Phước, Quảng Ngãi. Battalion 48 attacks a Korean company and hurts it badly.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 306. The history says the attack backed the people''s political struggle against the Korean killings in Bình Sơn and Sơn Tịnh.'
      tags:
      - polity:drv
      - polity:rok
      place: pho-tinh
- add:
    entry:
      id: cal.1967-02-01.vietnam-hanoi
      when: Feb. 1
      date: '1967-02-01'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tịnh Kỳ and Đồng Xuân, Quảng Ngãi. Battalion 48 ambushes a force landed by helicopter and by the history's count puts nearly 200 out of action and takes 40 weapons.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 306. See [[cal.1967-01-29.vietnam-hanoi]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: tinh-ky
