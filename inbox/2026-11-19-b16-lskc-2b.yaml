      c: Phổ Cường commune, Đức Phổ. Aircraft land troops; a helicopter sets down eight meters from the guerrillas Nguyễn Khánh and Lê Xu, who throw grenades into its door, killing three Americans and wrecking it.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 112–113. See [[cal.1966-01-28.vietnam-operations]].'
