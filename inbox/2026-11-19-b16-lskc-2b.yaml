      c: Cát Hanh commune, Phù Cát. A Korean company sweeps into the village; the guerrilla Nguyễn Đức Cường holds the Vĩnh Tường cave with a carbine from morning to afternoon and by the history's count kills 13. Wounded, out of ammunition, he writes his farewell in blood on a handkerchief and dies by the last grenade as the troops turn him over.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 309–10. See [[cal.1966-12-17.vietnam-hanoi]]. The figures are the history''s.'
