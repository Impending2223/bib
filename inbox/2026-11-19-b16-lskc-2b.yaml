      when: Mar. 28
      date: '1968-03-28'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Tà Cơn, post 3, west (Châu Lang Chánh). An American company attacks the post and is thrown back.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 155. See [[cal.1968-02-10.vietnam-khe-sanh-2]].'
      tags:
      - polity:drv
      - polity:us
      place: ta-con
