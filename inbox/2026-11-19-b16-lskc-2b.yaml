- add:
    entry:
      id: cal.1968-05-09.vietnam-may-offensive
      when: May 9–11
      date: '1968-05-09'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Y bridge, south Saigon. That night Subregion 3 takes the bridge, chosen first because it draws the enemy's forces and opens the way to the Chợ Quán bridge. Battalion 1 first destroys a company of the American 9th Division's 3d Brigade that had taken the Rạch Ông bridge, and the American command bombs the area heavily. Battalion 1 holds the south end for three days, to May 11; by the history's count it puts 200 Americans out of action, burns four M113s and shoots down an aircraft. The night of May 11 Battalions 1 and 2 are ordered out of District 8.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 187. See [[cal.1968-05-08.vietnam-may-offensive]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: saigon
      time_range:
      - 1968-05-09T14:00Z
      - 1968-05-09T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-05-04.vietnam-may-offensive
      when: May 4–8
      date: '1968-05-04'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: An Phú Đông and Tân Thới Hiệp, north Saigon. Regiment 16 of the Region and Subregion 1's independent battalions, meeting the Saigon 1st, 5th and 7th Airborne Battalions on the way to Tân Sơn Nhứt and the Joint General Staff, defend the two communes from May 4 to 7 and by the history's count put over 200 out of action. May 8 they raid a motor convoy at Tân Thới Đông and Tân Thới Trung, destroying 50 vehicles and by the history's count killing or wounding 230.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 188. Check: the days; the history gives May 4–7 and May 8. The time is the first day''s, May 4. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
- add:
    entry:
      id: cal.1968-05-27.vietnam-may-offensive
      when: May 27
      date: '1968-05-27'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: 'Saigon, Districts 6 and 5. Subregion 2, with two battalions still fit to fight (one, Battalion 308, newly up from Trà Vinh), moves out on the Command''s order of May 26: Battalions 6, 308 and 7, reinforced from Regiment 1 of the 9th Division, advance on Districts 6 and 5. After seven days with the local forces they take the Phú Định bridge and by the history''s count put hundreds out of action. Early in June three battalions go on to Khổng Tử, Mạnh Tử and Nguyễn Tri Phương streets, with the district''s armed people; the enemy counterattacks with bombing in tens of strikes, killing civilians.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 192–93. See [[cal.1968-05-24.vietnam-hanoi]]. The time is the first day''s. Check: the days the three battalions reach each street. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      place: saigon
- add:
    entry:
      id: cal.1968-06-02.vietnam-may-offensive
      when: June 2
      date: '1968-06-02'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Khổng Tử street, Saigon. In the close fight an American armed helicopter fires rockets by mistake into the Phước Đức school and kills dozens of Saigon officers commanding the counterattack, among them two colonels, four lieutenant colonels and two majors.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 193. See [[cal.1968-05-27.vietnam-may-offensive]]. Check: the charge, from the history alone; no record read.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: saigon
- add:
    entry:
      id: cal.1968-06-07.vietnam-may-offensive
      when: June 7–14
      date: '1968-06-07'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Saigon, Districts 5, 6, 1 and 2. June 7 to 14 dozens of uneven fights between the forces' infantry detachments and the Saigon 5th and 9th Airborne, 4th and 6th Ranger and 81st Commando Battalions, backed by tanks, armored cars and hundreds of sorties. By the history's count two battalions of Subregions 1 and 2 lose nearly all their company and battalion commanders; Companies 1 and 2 of Battalion Phú Lợi are down to one or two men. The forces' guns also fire on Tân Sơn Nhứt, the port, the Navy command, the city hall and the American embassy. The second phase of the second wave ends June 13.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 193–94. See [[cal.1968-05-27.vietnam-may-offensive]]. The history gives the phase ending "June 13". Check: the days of the gunfire. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      place: saigon
- add:
    entry:
      id: cal.1968-05-06.vietnam-may-offensive-4
      when: May 6–7
      date: '1968-05-06'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Phú Hưng and Hữu Định fields, Bến Tre. May 6 two battalions of the province ambush the force that has come to relieve the edge of the town and attack boats on the Ba Lai river. The morning of May 7 the Saigon 10th Regiment, with air and artillery cover, walks into the ambush; when its command and leading battalion are in the middle of the field the forces open fire. By the history's count nearly 400 are killed or wounded; 125 weapons and 8 PRC-25 radios are taken; the regiment's deputy commander, a major, and an artillery captain die and the commanders flee.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 197–98. Check: the clock; the history gives "the morning of May 7" for the fight. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-time
      place: ben-tre
- add:
    entry:
      id: cal.1968-05-08.vietnam-may-offensive-2
      when: May 8
      date: '1968-05-08'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Ba Lai river, Hữu Định, Bến Tre. The Americans at Bến Tre town send 14 warships with a battalion from Vàm An Hóa into the river to destroy the forces at Hữu Định. The forces, hidden along both banks, fire when the ships are in the plan's ground; after over an hour 82 mm recoilless and B41 gunners sink or burn 10 ships on the spot and by the history's count put hundreds of Americans out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 198. See [[cal.1968-05-06.vietnam-may-offensive-4]]. Check: the clock; the units, which the history gives as "the forces". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: ben-tre
- add:
    entry:
      id: cal.1968-05-11.vietnam-may-offensive
      when: May 11–13
      date: '1968-05-11'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: 'Bến Tre town. That night the forces attack from two directions: the Region''s sapper company destroys two posts in Bình Phú commune; infantry and commandos hold some key areas of the town. The morning of May 12 three security companies and an armored troop counterattack; after three days the forces, with heavy losses and supply short, withdraw.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 198. See [[cal.1968-05-08.vietnam-may-offensive-2]]. Check: the clock, whose it is.'
