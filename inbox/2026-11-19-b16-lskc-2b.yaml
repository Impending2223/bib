      when: May 19
      date: '1968-05-19'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: West of the Tà Cơn base. Battalion 7 of Regiment 66 ambushes an American Marine company probing the siege lines and by the history's count destroys it and burns three M113s.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 221. See [[cal.1968-02-10.vietnam-khe-sanh-2]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: ta-con
- add:
    entry:
      id: cal.1968-05-28.vietnam-khe-sanh
      when: May 28
      date: '1968-05-28'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Làng Cát, 1 kilometer south of Rào Quán. Battalion 8 of Regiment 102, 308th Division, opens the 308th's fighting here and by the history's count kills over 100.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 221. See [[cal.1968-05-15.vietnam-hanoi]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1968-06.vietnam-khe-sanh
      when: June, early
      date: 1968-06
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Tà Ri, Tà Quan, Pa Trang and Húc Cốt. The enemy lands two Marine battalions to set up a footing for relieving Tà Cơn and Khe Sanh.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 222. See [[cal.1968-05-28.vietnam-khe-sanh]]. Check: the day of the landing; the history says "early June".'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
- variant:
    id: cal.1968-06-27.vietnam
    unit: A
    witness: w.lich-su-khang-chien-chong-my
    reads: Abrams orders the Khe Sanh base abandoned June 26, 1968, ending the operation "Scotland II"; June 19 Cushman orders the Americans out of Ka Long, Pa Trang and hill 835 back to Tà Cơn, Route 9 and Đông Hà; the history takes both as a defeat of the base
    at: V, 222–23
