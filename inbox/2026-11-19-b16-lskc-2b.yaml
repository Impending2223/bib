      c: Ka Long, Pa Trang and hill 835. The American command orders all its troops out and back to Tà Cơn, Route 9 and Đông Hà.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 222. See [[cal.1968-06.vietnam-khe-sanh]]. The history names the order Cushman''s. See also [[cal.1968-06-20.vietnam-khe-sanh]].'
