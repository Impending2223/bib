      - polity:drv
      - polity:rvn
      place: nha-trang
- add:
    entry:
      id: cal.1968-02-04.vietnam-tet-2
      when: Feb. 4
      date: '1968-02-04'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Nha Trang. The fighting in the city goes on to the sixth day of Tết and the attackers, unable to finish it as the enemy's pressure grows, withdraw. Regiment 20 with local forces works in Diên Khánh and Vĩnh Xương districts, cutting Route 21 and Route 1.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 125. See [[cal.1968-01-29.vietnam-tet-2]]. Check: the day; "the sixth day of Tết" by the South''s calendar.'
      tags:
      - polity:drv
      - polity:rvn
      place: nha-trang
- add:
    entry:
      id: cal.1968-02-04.vietnam-tet-3
      when: Feb. 4
      date: '1968-02-04'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: 'Vĩnh Long. After naval gunfire and bombing the enemy lands two battalions of the American 9th Division''s 2d Brigade behind the Cầu Vồng road, with Saigon troops, closing two arms around the town. The front command, after six days and heavy losses, decides to hit a part of the American force and withdraw. At 11 p.m. Battalion 306 raids an American group south of the Cá Trê bridge, destroys a company and by the history''s count puts hundreds out of action, and opens the way for the wounded and the mobile battalion to leave for Phước Hậu, 5 kilometers south. The history''s count for the six days: 9,800 of the other side out of action; its own dead 228.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 147–48. See [[cal.1968-01-30.vietnam-tet-16]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: vinh-long
      time: 1968-02-04T15:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-01-31.vietnam-tet-10
      when: Jan. 31
      date: '1968-01-31'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Mộc Hóa, Kiến Tường. The province's forces, delayed by the long march and the crossing of the Vàm Cỏ Tây, have not reached their targets by Jan. 30; the attack opens at 4 a.m. Jan. 31. The enemy breaks before the eastern column; some flee toward the Cá Rô bridge, some surrender. The western column does not arrive in time, the enemy counterattacks, and the eastern column is thrown back with heavy losses.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 148. Check: the clock, whose it is. The history rates the result "limited".'
      tags:
      - polity:drv
      - polity:rvn
      place: moc-hoa
      time: 1968-01-30T20:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-01-31.vietnam-tet-17
      when: Jan. 31
      date: '1968-01-31'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Cao Lãnh, Kiến Phong. The attack, late for want of ammunition and explosives, opens at 1 a.m. Battalion 1 goes for the province chief's residence against an enemy on the high ground and breaks into small groups in the streets; Battalion 2 on the American quarter hurts Battalion 2 of the Saigon 16th Regiment but is stopped by chemical shells. Feb. 1 the force fights on; Feb. 2 to 6 it withdraws to the outlying communes, going into the town at times. For seven days the history counts 500 of the other side killed and 20 posts removed.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 149. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: cao-lanh
      time: 1968-01-30T17:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-20
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Châu Đốc, An Giang. At 2 a.m. the province's battalion with political and troop-proselytizing forces attacks the main targets in the town and in a few hours takes most of them; by 6 a.m. the enemy holds ten pockets, with the province chief's residence and the Phủ Vị house as redoubts. The afternoon of Jan. 31, after bombing and shelling, a battalion of the Saigon 21st Division lands at the airfield and a company by the Lò Heo canal and they counterattack. That night the force leaves the town but for a bridge guard; the guard dies nearly to a man the morning of Feb. 1 holding off the counterattack.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 149–50. The time is the first day''s. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      place: chau-doc
      time: 1968-01-29T18:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-21
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Trà Vinh. At midnight Battalions 501 and 509 of the province with sapper, artillery and district units attack in three columns. The first takes a corner of the province chief's residence and opens the jail, freeing hundreds; the second takes the Thái Bình theater and the Long Bình bridge; the third goes for the airfield and the headquarters of the Saigon 14th Regiment. That morning people rise and enter the offices and posts; at 1 p.m. Battalion 2 of the 14th Regiment comes from Cầu Ngang to relieve the residence and the fight in the town turns hard. The provincial committee withdraws the forces to the districts; by Feb. 5 the history counts 5,000 of the other side destroyed or broken up, 50 posts surrendered or abandoned, 14 communes freed.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 150–51. The time is the first act''s. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: tra-vinh
      time: 1968-01-29T16:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-22
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Sóc Trăng. Battalion Phú Lợi of the province attacks the center, takes the whole supply area and the dependents' quarters and goes on to the province chief's residence; Company 301 of Vĩnh Châu goes for the American quarter, Company 247 for the Nước Ngọt lake area, another column for the airfield. The units hold in the town three days against counterattacks, then, with heavy losses, withdraw to the outskirts.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 151. Check: the day of the attack, the history giving the day alone.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: soc-trang
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-23
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Bạc Liêu. The province's forces go in on two lines. High water holds back the main line, a battalion and a commando platoon, which crosses the Bạc Liêu canal by boat in the morning and takes wards 5 and 6, then withdraws to the Kim Cấu–Vĩnh Trạch bridge. The second line, four infantry platoons, a fire company and a militia company from Châu Thới by Tân Tạo, reaches the airfield, breaks open the big jail, frees cadres, fighters and people, takes the hospital and attacks the artillery position of the Saigon 21st Division at the Hội Đồng Điều post. After counterattacks the forces cannot hold the town and strike it by night and leave by day for many days.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 151–52. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      place: bac-lieu
      time_range:
      - 1968-01-29T22:00Z
      - 1968-01-30T04:00Z
      time_band: morning
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-24
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Cà Mau. At midnight Battalion U Minh 2 takes the Phật Tổ pagoda and enters wards 2, 3 and 4, holding 2 kilometers of street. Battalion U Minh 3, an hour late, takes the new hospital and the subsector but, short of explosives, cannot open the gate of the administrative building or the province chief's residence. Jan. 31 aircraft bomb Battalion U Minh 3 while Battalion 2 of the Saigon 32d Regiment attacks from behind; it destroys a company. South of town guerrillas of Cái Nước and Ngọc Hiển enter wards 8 and 9. At Năm Căn the district's forces hold the post under siege for 15 days until the enemy leaves for Đồng Cùng.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 152. The time is the first act''s. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      place: ca-mau
      time: 1968-01-29T16:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-25
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Rạch Giá. At 3 a.m. Battalion 207 of the province enters the town in several columns and in 15 minutes takes a corner of the subsector's operations center, the post office, the police station and the treasury. The force does not take its other objectives and has many casualties; at 5 a.m. it withdraws to Rạch Giồng to meet the counterattack. District forces and the people surround the district posts.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 152–53. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      place: rach-gia
      time: 1968-01-29T19:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-02-10.vietnam-khe-sanh-2
      when: Feb. 10
      date: '1968-02-10'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Tà Cơn, Route 9. After the fall of Làng Vây, the front command decides to besiege Tà Cơn and force the enemy out to relieve it; the siege opens Feb. 10. Division 325 holds the north and northwest against hills 845 and 832 and Động Tri; mortars of 82 mm and 12.7 mm machine guns hold the enemy down from a distance. The enemy, busy with Huế, does not relieve; it takes hills 550, 595 and 573 to complete its defense.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 153–54. See [[cal.1968-02-07.vietnam]]. Check: the day; the name as the history prints it, "Tà Cơn".'
      tags:
      - polity:drv
      - polity:us
      place: ta-con
- add:
    entry:
      id: cal.1968-02-25.vietnam-khe-sanh
      when: Feb. 25
      date: '1968-02-25'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Tà Cơn. The first of four counterattacks, in two columns of two American Marine companies, falls on a post held by a unit of Regiment 66; the fight runs from 8 a.m. to 2:45 p.m. and by the history's count over 100 of the attackers are killed, the rest fleeing.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 155. See [[cal.1968-02-10.vietnam-khe-sanh-2]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: ta-con
      time: 1968-02-25T00:00Z
      time_zone: Asia/Ho_Chi_Minh
