      date: '1966-02-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Cảnh hamlet, Hòa Thịnh commune. Three American battalions come in; a small detachment beats twelve assaults and by the history's count kills 170. Platoon leader Đậu Trọng Lâm kills 42 himself.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 103. See [[cal.1966-01-19.vietnam-hanoi]]. Check: the units; the history says "three battalions of American troops" in Phú Yên. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: hoa-thinh
