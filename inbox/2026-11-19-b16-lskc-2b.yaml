      also:
      - vietnam-hanoi
      c: Saigon, west of the city. Regiment 2 (Battalions 267, 269 and Binh Tan 6, Võ Văn Hoàng commanding) attacks the Phú Lâm radar group, goes on to Cầu Tre, hurts a ranger battalion and takes the Minh Phụng and Bình Thới areas. Two ranger battalions with armor counterattack; at Duy Linh square B40 and B41 gunners and machine guns of the regiment fire on the lead. May 7 and 8 the regiment holds two high-rise buildings at the Minh Phụng crossing against A-37 bombing and two ranger battalions with dozens of M41 tanks. The fight runs to May 10; the regiment then splits, one battalion north to the Phú Thọ cemetery, two south past Cầu Gỗ to Bình Tiên.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 185–86. The history gives the offensive''s opening at 12:30 a.m. May 5; see [[cal.1968-05-05.vietnam]]. The time is not the regiment''s. Check: the day each arm reached its ground.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      - ok:fields-time
      place: saigon
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-2
      when: May 5
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Saigon, around Tân Sơn Nhứt. Regiment 1 of the 9th Division, attached to Subregion 2, breaks through the outer screen and attacks the Bảy Hiền crossing and targets around the airfield. At the French cemetery the Saigon paratroops, the strategic reserve, come out of the airfield to stop it; a hard fight follows at Mả Xây. In two days, May 5 and 6, by the history's count the regiment kills nearly 200; May 7 Subregion 2 orders it west of Bà Quẹo to defend.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 186. See [[cal.1968-05-05.vietnam]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-4
      when: May 5–7
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Saigon, the east. "Dare-to-die" teams of Battalions 2 and 4 of Subregion 4 bring down a corner of the highway bridge, blocking traffic for days. Night of May 7 the subregion's main units fight the Saigon Marine Group A in District 9; a sapper detachment takes the Sincovina factory, the posts nearby are abandoned, and engineers with guerrillas blow the Sụp and Trao Trảo bridges and hold the area from Long Bình to Bình Trưng for days.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 188. The history gives the bridge May 5 and the district fighting the night of May 7. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-time
      place: saigon
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-5
      when: May 5–6
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Saigon, northeast. At dawn two infantry companies with local self-defense men cross the bridge by truck, take high-rise buildings at the end of Tự Đức street and beat counterattacks by a Saigon marine battalion. At noon May 6 a ranger battalion with dozens of armored cars counterattacks; the force splits into teams, burns two M113s and holds until ordered to change direction.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 188–89. Check: the clock, whose it is; the bridge as printed, "Phan Thanh Giản". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
      time_range:
      - 1968-05-04T16:00Z
      - 1968-05-04T22:00Z
      time_band: predawn
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-05-06.vietnam-may-offensive-2
      when: May 6–9
      date: '1968-05-06'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Saigon, District 3. The city Youth League with a sapper detachment attacks three Saigon police posts and holds the Bàn Cờ and Vườn Chuối areas to May 8. May 9 a ranger battalion with the ward police retakes them; the League fighters under Nguyễn Sơn Hà fight to the last. May 9 and 10 the Lê Thị Riêng commando team under Lê Thị Bạch Cúc with Subregion 5 fights in Districts 1 and 2, calling on the troops by loudspeaker to turn their guns on the authorities.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 189. The history gives May 6, 7, 8, then May 9 and 10. Check: the days of the Bạch Cúc team; the page continues.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
- add:
    entry:
      id: cal.1968-05-06.vietnam-may-offensive-3
      when: May 6–8
      date: '1968-05-06'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Saigon, District 5. The armed forces of the Chinese-community organization rouse hundreds of people, who take the district administrative building May 6 to 8 and go on to the Lò Gạch, Lò Gốm and Lò Sâu quarters, hamlet 1 of Trang Tử ward and hamlet 6 of Phú Lâm ward.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 190. Check: whether the days are the occupation of the building or of the quarters; the history gives "May 6 to 8".'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-6
      when: May 5–7
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Đồng Dù base and Củ Chi town. Two composite battalions of the 9th Division attack the American troops for three days and by the history's count put nearly 200 out of action, destroy 60 vehicles and burn two fuel depots. May 8 Battalion 5 of Regiment 2 attacks two American companies at Bà Điểm, by the history's count nearly 100 out of action and two M113s destroyed. Night of May 9 two Region sapper companies attack the Quang Trung training camp at Hóc Môn, put 80 out of action and wreck the command and signals area.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 190. Check: the days; the history gives May 5, 6 and 7; May 8; the night of May 9. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: cu-chi
- add:
    entry:
      id: cal.1968-05-08.vietnam-may-offensive
      when: May 8
      date: '1968-05-08'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Lò Heo, Chánh Hưng, south Saigon. That night Battalion Phú Lợi, attached to Subregion 3, raids the enemy at Lò Heo and holds at Chánh Hưng against counterattacks. The same night Battalions 1 and 2 of Long An and the Long An sappers go for the Y bridge, with Battalions 5 (Nhà Bè) and 6 (Đồng Nai) on the flanks.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 187. See [[cal.1968-05-05.vietnam]]. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
