      when: Mar. 7
      date: '1967-03-07'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: An Nghiệp, Tuy An. Village guerrillas in their works beat a sweep by an American platoon and by the history's count put 12 out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 311. Check: the unit; the history says "an American platoon". The figures are the history''s.'
