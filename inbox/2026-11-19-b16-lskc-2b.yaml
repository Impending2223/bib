      when: Apr.
      date: 1966-04
      thread: vietnam-struggle
      c: Saigon. 79 writers, artists, professors and lawyers meet and form a committee to prepare a national cultural congress; they issue a declaration against the debased culture of films, popular music, novels and press.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 132. Check: the day.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
