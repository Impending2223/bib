- add:
    entry:
      id: cal.1966-06.vietnam-hanoi-3
      when: June, mid
      date: 1966-06
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Party Committee of the Route 9–North Quảng Trị Front holds its first session, Colonel Quách Sỹ Kha presiding as commissar and secretary: it takes up how the region''s armed forces will fight and how they will join the other battlefields. It resolves to bring main-force troops into the front to draw down and hold an important part of the enemy''s main force, the enemy having since early May enlarged Làng Vây, Tà Cơn, Cà Lu, Tân Lâm, Cùa and Ba Dốc, begun a line of bunkers along the Hiếu river from Đông Hà to Cửa Việt, widened the roads from Huế to Đông Hà and to Khe Sanh, and built airfields at Ái Tử, Đông Hà and Tà Cơn. Trương Chí Công, Quảng Trị''s secretary, and Hồ Sỹ Thản, Vĩnh Linh''s, are added to the committee. The front''s headquarters is at Chợ Cồn, 10 kilometers west of Đồng Hới. The session looks ahead to a heavier American reaction and, if the Americans land ground troops south of Military Region 4, chiefly at Vĩnh Linh and Quảng Bình, to the size of the force they might use and for how long; the front is to build plans for fighting on several grounds so that it can attack in every case and keep its losses lowest.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 197–98. See [[cal.1966-06.vietnam-hanoi]]. Made public: 2013. Check: the day; the history says "mid-June 1966". Names: none with entries.'
      tags:
      - polity:drv
      - vis:only:drv
      - polity:us
      - ok:fields-place
- add:
