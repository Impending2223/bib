      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ia Vầm and Chư Pông, the Central Highlands. To Apr. 7 the region's armed forces fight off the American and Saigon sweeps with medium and small actions and by the history's count put 600 out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 314. The history gives the span, Feb. 11 to Apr. 7. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
