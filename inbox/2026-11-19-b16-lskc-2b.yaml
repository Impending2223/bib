- cite:
    id: cal.1966-11-01.vietnam-saigon
    item: '[[w.lich-su-khang-chien-chong-my]], IV, 246–47 (the Command sets guns close to Saigon to fire on the National Day rally; Reuters, Nov. 1: the guests on the stand fled and crawled under it)'
    units: A
- add:
    entry:
      id: cal.1966-10-26.vietnam-hanoi-2
      when: Oct. 26–28
      date: '1966-10-26'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: East of the Sa Thầy river, 12 to 14 kilometers west-northwest of Plei Giăng. After bombing (B-52s included) and shelling that clear the ground, the morning the American 4th Division's 1st Brigade lands. When night falls Regiment 320 attacks the American columns. Oct. 28 the history counts two American companies destroyed and a third badly hurt; it quotes UPI, Oct. 28, on the division, in Vietnam two months, being punished.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 249–50. See [[cal.1966-10-18.vietnam-hanoi]]. Check: the clock, whose it is; the history''s Oct. 20 patrols of Saigon commandos west of the post. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: sa-thay
      time_range:
      - 1966-10-25T22:00Z
      - 1966-10-26T04:00Z
      time_band: morning
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1966-11-10.vietnam-hanoi
      when: Nov. 10
      date: '1966-11-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: West of the Sa Thầy river. Nov. 9 helicopters land three Saigon ranger companies 22 to 24 kilometers west-northwest of Plei Giăng; at noon Nov. 10 Battalion 9 of Regiment 66, having judged their line of search, ambushes and destroys two companies. That night Regiment 320 shells the American artillery east of the river and by the history's count kills 70 and destroys four 105 mm howitzers.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 250. See [[cal.1966-10-26.vietnam-hanoi-2]]. The time is the first day''s, noon. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: sa-thay
      time: 1966-11-10T04:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1966-11-11.vietnam-hanoi-2
      when: Nov. 11–13
      date: '1966-11-11'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Landing zone C1, west bank of the Sa Thầy river. Nov. 11 the American 4th Division's 2d Brigade lands Battalion 2, with artillery and two Saigon ranger companies; the artillery Battalion 32 had lain in wait there since before the campaign opened. The morning of Nov. 12 the enemy comes to the place expected and 120 mm shells hit its formation. Nov. 13, with air cover, an American company jumps down at C1 to gather its dead, and a company of the 25th Division's 3d Brigade feeling south of C1 is destroyed by Battalion 9 of Regiment 66.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 251. See [[cal.1966-11-10.vietnam-hanoi]]. The history says the artillery waited "over a month". Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-time
      place: sa-thay
- add:
    entry:
      id: cal.1966-11-20.vietnam-hanoi
      when: Nov. 20–21
      date: '1966-11-20'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: East of the Sa Thầy river and the Pô Cô. Nov. 20 and 21 Regiments 320, 66 and 95 attack the clusters of the 1st Cavalry Division's 2d Brigade and the 4th Division and break the 4th Division's blocking line east of the Pô Cô, going on into districts 4 and 5 of Gia Lai. Nov. 27 and 28 the Americans leave the ground on both banks of the Sa Thầy.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 252. See [[cal.1966-10-26.vietnam-hanoi-2]].'
      tags:
      - polity:drv
      - polity:us
      place: sa-thay
- add:
    entry:
      id: cal.1966-12-06.vietnam-hanoi
      when: Dec. 6
      date: '1966-12-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cà Đin, Gia Lai. After the Americans regroup and push the Saigon 42d Regiment out to Plei Kleng and Plei Le, they land a battalion and two companies at Cà Đin; the artillery Battalion 200 hits them and by the history's count hurts Battalion 1 of the 1st Cavalry Division's 2d Brigade badly. The history ends the Sa Thầy campaign here, Dec. 6.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 252. See [[cal.1966-10-26.vietnam-hanoi-2]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: ca-din
- add:
    entry:
      id: cal.1967-01-09.vietnam-hanoi
      when: Jan. 9–13
      date: '1967-01-09'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bàu Khai to Kiến An, Bến Cát. To Jan. 13 ambushes destroy eight tanks and armored cars and by the history's count kill or wound all the troops riding them.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 255. See [[cal.1967-01-08.vietnam-hanoi]]. The history gives the span, Jan. 9 to 13. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: ben-cat
- add:
    entry:
      id: cal.1967-01-11.vietnam-hanoi-2
      when: Jan. 11
      date: '1967-01-11'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Dầu Tiếng. That night the forces shell the field headquarters of the American 4th Division's 3d Brigade and by the history's count kill or wound over 100 and wreck 15 GMC trucks.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 255. See [[cal.1967-01-08.vietnam-hanoi]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: dau-tieng
      time_range:
      - 1967-01-11T14:00Z
      - 1967-01-11T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1967-01-16.vietnam-hanoi
      when: Jan. 16–17
      date: '1967-01-16'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Thanh An, across the Saigon river. Regiment 2 of the 9th Division crosses the river in secret on Jan. 16 and 17, surprises an American group and by the history's count hurts two battalions badly. Guerrillas there hang mines in trees to ambush boats on the river.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 255. See [[cal.1967-01-08.vietnam-hanoi]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
- variant:
    id: cal.1967-01-26.vietnam-operations
    unit: A
    witness: w.lich-su-khang-chien-chong-my
    reads: Cedar Falls ended Jan. 26, with some 2,500 Americans, 200 Saigon troops and 54 New Zealanders put out of action, 149 vehicles (M41 tanks, M113 and M118 carriers among them) destroyed or damaged and 28 aircraft shot down or damaged
    at: IV, 257
- add:
    entry:
      id: cal.1967-02-02.vietnam-hanoi
      when: Feb. 2
      date: '1967-02-02'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 22 to the Cambodian border, Tây Ninh. The American 25th Division opens the division-sized Gadsden operation west of Route 22 to break the bases there and drive the forces east, to where Junction City would later fall. It ends Feb. 21; by the history's count nearly 2,000 of the Americans out of action, 69 vehicles destroyed and 13 aircraft shot down.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 265. Check: the name as the history prints it, "Gaxđơn". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: tay-ninh
- add:
    entry:
      id: cal.1967-02-14.vietnam-hanoi
      when: Feb. 14
      date: '1967-02-14'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Minh Thạnh, Dầu Tiếng and Bến Củi. While Gadsden runs, the 2d and 3d Brigades of the American 1st Division open Tucson to clear the way for moving supplies to the starting points of the next operation. It ends Feb. 21; by the history's count 334 men, 29 vehicles and 7 aircraft lost. The II Field Force's forward headquarters moves to Dầu Tiếng to run the operation.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 265. See [[cal.1967-02-02.vietnam-hanoi]]. Check: the name as printed, "Tắcxơn". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: dau-tieng
- add:
    entry:
      id: cal.1967-02-25.vietnam-hanoi
      when: Feb. 25
      date: '1967-02-25'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cà Bon, in the middle of the base. The American II Field Force lands the Saigon Marine Group A there; the group, alarmed by the American losses, huddles in one place and does not move out. Feb. 28 helicopters take it to Trại Bí.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 268. See [[cal.1967-02-22.vietnam]]. Check: the day of the landing; the history gives Feb. 25.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1967-02-26.vietnam-hanoi
      when: Feb. 26
      date: '1967-02-26'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Trảng A Lâu and Tà Xia. A battalion of Regiment 1, 9th Division, raids Trảng A Lâu and by the history's count kills 150 Americans; another part, with the guerrillas of the Central Office, destroys an American company at Tà Xia.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 268. See [[cal.1967-02-22.vietnam]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1967-02-28.vietnam-hanoi
      when: Feb. 28
      date: '1967-02-28'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Southeast of Giếng Thí. Battalion 7 of Regiment 16 ambushes an American battalion, shoots down three helicopters and destroys a company.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 268. See [[cal.1967-02-22.vietnam]]. The history goes on with a raid that night by Battalion 9, cut at the page''s end.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1967-03-03.vietnam-hanoi
      when: Mar. 3
      date: '1967-03-03'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Workshop S3 of the Region's communications office, Tà Đạt. Nineteen guerrillas under Squad Leader Đạt turn back eight assaults, destroy an American company of the 173d Brigade, hurt another badly and take 22 PRC-25 radios; one of them is killed. The workshop gets the First Class Military Exploit Order, Đạt the Second Class. The same time the guerrillas of Giếng Thí hamlet, Bà Chiêm, destroy nearly all an American paratroop company with directional mines.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 269–70. See [[cal.1967-02-22.vietnam]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1967-03-06.vietnam-hanoi
      when: Mar. 6–9
      date: '1967-03-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tà Xia. Regiment 1 shells the American group as it presses the base again and by the history's count puts hundreds out of action and damages 12 guns. Mar. 8 and 9 the forces shell the post at Bến Ra and fight the sweep at Lôvia.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 270–71. See [[cal.1967-02-22.vietnam]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1967-03-10.vietnam-hanoi-2
      when: Mar. 10
      date: '1967-03-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Đồng Pan and Bàu Cỏ. That night Battalion 4 of Regiment 2, with two 120 mm guns of Battalion 58, raids the start base of an American brigade at Đồng Pan; by the history''s count hundreds killed, 150 vehicles (50 armored) and 12 guns damaged. The same night Regiment 16, with a 120 mm gun, raids the operation''s supply base at Bàu Cỏ: 64 vehicles (24 armored), 9 guns and 200 Americans.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 271. See [[cal.1967-03-10.vietnam-operations]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      time_range:
      - 1967-03-10T14:00Z
      - 1967-03-10T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
      place: dong-pan
- add:
    entry:
      id: cal.1967-03-13.vietnam-hanoi-2
      when: Mar. 13
      date: '1967-03-13'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Dương Minh Châu base. The American columns begin to leave it. The history calls this the defeat of the first phase of Junction City: 5,859 of the other side out of action, 33 guns and 497 vehicles destroyed or damaged, 90 aircraft shot down.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 271. See [[cal.1967-02-22.vietnam]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1967-03-15.vietnam-hanoi
      when: Mar. 15
      date: '1967-03-15'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The American command in Saigon opens the second phase, turning the main thrust to the east of the base with wide encirclement, deep thrusts, careful advance and heavy bombing. The Command of the 9th Division masses Regiment 2 at Chà Dơ and sets up for a large battle; the local forces are given anti-tank and antiaircraft guns and set to hunting vehicles and aircraft and laying mines. The history dates the second phase's start Mar. 18.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 272–73. See [[cal.1967-02-22.vietnam]]. Check: Mar. 15 against Mar. 18 in the same history.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
- add:
    entry:
      id: cal.1967-03-18.vietnam-hanoi
      when: Mar. 18
      date: '1967-03-18'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Lộc Ninh bridge. Leaving Suối Đá for the bridge, the Americans meet mines laid by the guerrillas of Group 82 (Bà Hảo district), which destroy eight armored cars.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 274. See [[cal.1967-03-19.vietnam-hanoi]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: loc-ninh
- cite:
    id: cal.1967-03-19.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], IV, 274 (Mar. 19: the mines at Đồng Rùm, 8 aircraft and over 100 Americans; Mar. 19 also the 3d Regiment''s raid on the mechanized group of the 1st Brigade, 9th Division, at Bàu Bàng, by the history 400 Americans, 92 vehicles and 9 guns)'
    units: all
- variant:
    id: cal.1967-03-20.vietnam-operations
    unit: A
    witness: w.lich-su-khang-chien-chong-my
    reads: the 3d Regiment's raid on the mechanized infantry group of the 1st Brigade, 9th Division, at Bàu Bàng on Route 13, Mar. 19, by the history 400 Americans, 92 vehicles (65 armored) and 9 guns destroyed
    at: IV, 274
- add:
    entry:
      id: cal.1967-03-20.vietnam-hanoi-2
      when: Mar. 20–21
      date: '1967-03-20'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Đồng Rùm area. The night of Mar. 20 into 21, with the Americans newly up and unfamiliar with the ground, the 9th Division''s command sends Regiments 2 and 16 into a decisive battle on ground chosen before: Regiment 2 from Chà Dơ destroys the southern group and goes on to the headquarters of the 4th Division''s 3d Brigade; Regiment 16 from the north attacks southward. By the history''s count the two regiments hurt an artillery battalion (18 guns) and three armored troops (72 vehicles) badly, shoot down 10 aircraft and put 1,220 out of action; an unfound mechanized group in the west and the rest of the northern wing escape by helicopter, and the chance to take the 3d Brigade''s commander is lost.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 274–75. See [[cal.1967-03-19.vietnam-hanoi]]. The American account is [[cal.1967-03-21.vietnam-operations]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      time_range:
      - 1967-03-20T14:00Z
      - 1967-03-20T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
      place: dong-rum
- add:
    entry:
      id: cal.1967-03-28.vietnam-hanoi
      when: Mar. 28
      date: '1967-03-28'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bàu Trí. An American force of the 3d Brigade sweeps up; Battalion 9 of Regiment 16 stops it, by the history's count kills 200 and damages 23 tanks and armored cars, and it falls back to Đồng Rùm. Mar. 22 a battalion that pushed north of Sóc Tầm was surrounded by guerrillas; Mar. 26 the division sent Regiments 1 and 16 against it, but helicopters lifted it out first.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 275. See [[cal.1967-02-22.vietnam]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
- add:
    entry:
      id: cal.1967-04-01.vietnam-hanoi-2
      when: Apr. 1–2
      date: '1967-04-01'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The American wings leave: Apr. 1 the southern wing quits Đồng Rùm; Apr. 2 the force leaves Cà Tum.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 276. See [[cal.1967-03-31.vietnam-operations]]. By the history''s count the night of Mar. 31 Regiment 1 and Battalion 7 of Regiment 16 destroyed the southern group at Ba Vùng and shelled Sóc Con Trăn, killing 800 and shooting down 13 aircraft. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: dong-rum
- add:
    entry:
      id: cal.1967-04-06.vietnam-hanoi
      when: Apr. 6–13
      date: '1967-04-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The enemy quits the Đồng Kền group Apr. 6 and from Apr. 6 to 9 the groups at Ba Vùng, Bàu Cột and Bàu Trâm run back to Sóc Con Trăn; Apr. 13 all the enemy at Sóc Con Trăn leave the Dương Minh Châu base. The command then sends Regiments 1 and 16 across the Saigon river to cut the retreat toward Hớn Quản between Cần Lê and Bình Phú.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 276. See [[cal.1967-04-01.vietnam-hanoi]]. The history gives the end of Junction City as May 15, by Westmoreland''s word, with 14,233 of the other side out of action. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
- add:
    entry:
      id: cal.1966-07-19.vietnam-hanoi
      when: July 19
      date: '1966-07-19'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Cầu Giẽ, Vạn Điểm and the Đông Anh oil depot, around Hanoi. Several flights of American aircraft attack; the missile, antiaircraft and air units act together and shoot down some. Battalion 61 of Missile Regiment 236 is named the first unit to bring an American aircraft down on its own ground and is given the flag "Follow Uncle Hồ's word, resolve to defeat the American aggressors."
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 398.'
      tags:
      - polity:drv
      - polity:us
      place: hanoi
- add:
    entry:
      id: cal.1966-07-20.vietnam-hanoi-2
      when: July 20
      date: '1966-07-20'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Vô Tranh. Missile Battalion 72 of Regiment 285, in position there, shoots down an EB-66 electronic reconnaissance aircraft on the spot.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 398. Check: the province; the history gives none.'
      tags:
      - polity:drv
      - polity:us
      place: vo-tranh
- add:
    entry:
      id: cal.1967-03-20.vietnam-hanoi-3
      when: Mar. 20
      date: '1967-03-20'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cường Gián sands and Đông Hà. That night Battalion 4 of Regiment 84 crosses the Bến Hải, marches 20 kilometers, assembles on the Cường Gián sands and fires hundreds of H12 rockets into the American Marines' area at Đông Hà. The same night the artillery on the south bank fires hard on Tân Lâm, Cam Lộ and Cửa Việt to keep them from reinforcing Dốc Miếu. The history calls it the first formal fighting by the North's armed forces in the South.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 405–406. See [[cal.1967-03-20.vietnam-operations-2]]. The history says "the night of Mar. 20". Check: the clock, whose it is; "Cường Gián" as printed.'
      tags:
      - polity:drv
      - polity:us
      place: dong-ha
      time_range:
      - 1967-03-20T14:00Z
      - 1967-03-20T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1967-03-21.vietnam-hanoi
      when: Mar. 21
      date: '1967-03-21'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Dốc Miếu. At dawn the artillery goes on shelling hard the convoy of trucks loaded with troops coming to relieve the base. By the history's count the fight of Mar. 20 and 21 puts hundreds of Americans out of action and wrecks the base's tunnels and works; the Saigon police group south of the Bến Hải is afraid to act afterward.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 405–406. See [[cal.1967-03-20.vietnam-hanoi-3]]. The history says "the dawn of Mar. 21". Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
      time_range:
      - 1967-03-20T16:00Z
      - 1967-03-20T22:00Z
      time_band: predawn
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1967-10-14.vietnam-hanoi
      when: Oct. 14
      date: '1967-10-14'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hoàng Trường commune, Hoàng Hóa, Thanh Hóa. The commune's platoon of elderly militia shoots down an American aircraft with infantry weapons; Oct. 24 it shoots down a second.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 416. Check: which aircraft each day; the history says "two aircraft in the two days, Oct. 14 and 24".'
      tags:
      - polity:drv
      - polity:us
      place: thanh-hoa
- add:
    entry:
      id: cal.1967-10-24.vietnam-hanoi
      when: Oct. 24
      date: '1967-10-24'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hoàng Trường commune, Hoàng Hóa, Thanh Hóa. The platoon of elderly militia shoots down its second American aircraft with infantry weapons.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 416. See [[cal.1967-10-14.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      place: thanh-hoa
- add:
    entry:
      id: cal.1967-11-04.vietnam-hanoi
      when: Nov. 4
      date: '1967-11-04'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ngọc Bờ Biêng, Đắk Tô. After bombing with fire, crater and chemical bombs, at 8 a.m. the Americans attack the saddle-back post held by Squad 7, Company 11, Battalion 6 of Tây Ninh, eight times in the day; the squad beats them off and by the history's count kills 120. The American 4th Division, in the Mac Arthur operation in the southern Highlands, and the 173d Brigade, sweeping Phú Yên, are airlifted to Đắk Tô.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 23. See [[cal.1967-11-03.vietnam]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: dak-to
      time: 1967-11-04T00:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1967-11-05.vietnam-hanoi
      when: Nov. 5
      date: '1967-11-05'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ngọc Tang, Đắk Tô. An American company surprises and takes the campaign's second post, held by Company 11; the defenders fight hand to hand, kill 70 by the history's count and retake it. Nguyễn Tấn, a new recruit in his first fight, fires his last round at the nearest American and dies.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 23. See [[cal.1967-11-04.vietnam-hanoi]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: dak-to
- add:
    entry:
      id: cal.1967-06-14.vietnam-hanoi
      when: June 14
      date: '1967-06-14'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Off Ba Làng An, Quảng Ngãi. Ship 198, sailed Jun. 6, meets the enemy that night six nautical miles off the landing; she fires back and drives for the beach. The crew fights on, destroys the ship and goes ashore; the political officer Huỳnh Ngọc Trạch and the deputy captain Phạm Chuyên Nghiệp are killed.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 50. See [[cal.1967-06-06.vietnam-hanoi]]. The history says "the night of Jun. 14". Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: ba-lang-an
      time_range:
      - 1967-06-14T14:00Z
      - 1967-06-14T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-02-09.vietnam-tet-2
      when: Feb. 9–12
      date: '1968-02-09'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Huế, the northern wing. From Feb. 9 to 12 the forces fight enemy counterattacks without a break. Feb. 11 Battalion 1 of the American 5th Marines is added in the Triangle, bringing the enemy there to 16 American and Saigon battalions.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 110–11. See [[cal.1968-02-08.vietnam-tet-2]]. The time is the first day''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: hue
- add:
    entry:
      id: cal.1968-02-13.vietnam-tet
      when: Feb. 13
      date: '1968-02-13'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Quế Chữ, Bôn Trì and Bôn Phổ, outside Huế. The enemy attacks from Liễu Cốc Thượng toward Quế Chữ and from Rú Lầu toward Bôn Trì and Bôn Phổ; the forces strike hard at the enemy's rear and push him back. That evening Battalion 9 of Regiment 8 goes into the citadel to reinforce it; the enemy has gained strength and the forces turn to defend the four gates, Chánh Tây, Hữu, Thượng Tứ and Đông Ba, and the road from Route 1 into An Hòa. Battalion 815 of Regiment 9 is brought from the southern wing to replace Battalion 816, which is sent into the city.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 111–12. See [[cal.1968-02-08.vietnam-tet-2]]. The history gives the Battalion 815 move without a day. Check: the clock; "the evening of the 13th".'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-time
      place: hue
- add:
    entry:
      id: cal.1968-02-16.vietnam-tet
      when: Feb. 16–17
      date: '1968-02-16'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Huế, Đông Ba. After the Military Committee's order of the night of Feb. 15 to hold the citadel for the good of the whole South and Trị–Thiên, and the region committee's decision to hold a week more, the enemy counterattacks hard on Feb. 16 and 17 and takes Đông Ba.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 111. See [[cal.1968-02-15.vietnam-tet]].'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: hue
- add:
    entry:
      id: cal.1968-02-18.vietnam-tet-6
      when: Feb. 18
      date: '1968-02-18'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Huế. The enemy takes the Thủy Quan gate and threatens the Hữu, An Hòa and Thượng Tứ gates. The command sends Battalion 816 of Regiment 9, from stopping the enemy at Bôn Trì and An Lưu, to Regiments 6 and 8, and Battalion 810 from the southern wing across the Gia Hội quarter to hold the enemy at the Đông Ba gate. A regiment coming from Route 9 arrives only on Feb. 18 at its assembly point, Battalion 7 with it, and cannot throw the enemy back; the forces are pushed into the citadel. The enemy has added a Marine battalion at Mang Cá and Đông Ba and bombards day and night with naval guns and aircraft.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 111–12. See [[cal.1968-02-16.vietnam-tet]].'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: hue
- variant:
    id: cal.1968-02-24.vietnam
    unit: A
    witness: w.lich-su-khang-chien-chong-my
    reads: 'the forces'' withdrawal from Huế: unit by unit, all out of the city in secret and safe by Feb. 25; part of the forces fighting on the left bank of the Perfume river, ordered late, crossed it Feb. 27 to the freed area of Phú Vang. For the 25 days the history counts 25,000 of the other side killed, taken, surrendered or broken up, over 200 aircraft shot down or damaged, 41 warships burned and 533 vehicles destroyed'
    at: V, 114
- add:
    entry:
      id: cal.1968-02-27.vietnam-tet
      when: Feb. 27
      date: '1968-02-27'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Huế, left bank of the Perfume river. A part of the forces, late in receiving the order to withdraw, crosses the river Feb. 27 to the liberated area of Phú Vang.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 114. See [[cal.1968-02-22.vietnam-tet-2]]. The history gives the rest of the forces'' withdrawal complete Feb. 25.'
      tags:
      - polity:drv
      - polity:rvn
      place: hue
- add:
    entry:
      id: cal.1968-02-19.vietnam-tet
      when: Feb. 19
      date: '1968-02-19'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Phú Lâm, Saigon. At 2:15 a.m. Battalion 1 of Long An and Battalion 6 of Bình Tân attack the Saigon 30th Ranger Battalion and do not succeed.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 116. See [[cal.1968-02-17.vietnam-tet-2]]. The history opens this "second peak" of the offensive in Saigon with shelling, Feb. 17, by Rocket Regiments 96 and 208. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
      time: 1968-02-18T18:15Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-02-20.vietnam-tet-3
      when: Feb. 20–21
      date: '1968-02-20'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Triều Châu cemetery, 3 kilometers northwest of the Phú Thọ racecourse, Saigon. From noon Feb. 20 to 2 p.m. Feb. 21 the forces, attacking at Cầu Tre, Tân Thới and Phú Thọ Hòa, beat many counterattacks by the Saigon 33rd Ranger Battalion with aircraft and tanks, burn two tanks and M113s and shoot down an aircraft. At the same time a battalion of Regiment 2, 9th Division, attacks the 25th Division's 3d Brigade on a relief sweep at Vĩnh Lộc, Tân Bình, 6 kilometers northwest of the city.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 116–17. See [[cal.1968-02-19.vietnam-tet]]. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      place: saigon
      time: 1968-02-20T04:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-02-24.vietnam-tet-2
      when: Feb. 24–25
      date: '1968-02-24'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Thủ Đức and northeast of Gia Định. Feb. 24 the forces destroy the Giồng Ông Tố bridge and the Kinh bridge, 3 kilometers northeast of Gia Định; Feb. 24 and 25 their guns shell Tân Sơn Nhứt, the Capital Special Zone, the Thủ Đức noncommissioned-officers' school and the An Nhơn fuel depots. Feb. 25 the forces take the Sicovina textile mill at Thủ Đức.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 117. See [[cal.1968-02-17.vietnam-tet-2]]. The time is the first day''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
- add:
    entry:
      id: cal.1968-02-28.vietnam-tet
      when: Feb. 28
      date: '1968-02-28'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Saigon. By the history's word the sound of the general offensive stops Feb. 28, closing the first wave on all the main fronts and across the South.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 117. See [[cal.1968-01-31.vietnam-tet]]. Check: the day; the history says "by Feb. 28".'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1968-02-01.vietnam-tet-3
      when: Feb. 1
      date: '1968-02-01'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Đà Lạt. The night of Feb. 1 Battalion 145, Sapper Company 852, Company 809 and the advance party of Battalion 186 join and renew the attack on the subsector; the forces hold two thirds of its positions and nine offices and departments around it.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 135. See [[cal.1968-01-31.vietnam-tet-16]]. The history says "the night of Feb. 1". Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
      time_range:
      - 1968-02-01T14:00Z
      - 1968-02-01T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-02-04.vietnam-tet-4
      when: Feb. 4
      date: '1968-02-04'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Đà Lạt. Battalion 186, now all up, with Sapper Company 852 and Company 809, attacks the subsector again; the forces take only three quarters of the positions, held off in the southwest by an armored battalion the enemy brings in. In the northwest three thrusts go deep toward the center, at the province chief's residence, the Civil Guard headquarters and the Public Security office; the enemy counterattacks hard and there is heavy fighting at the Hòa Bình market until helicopters are called to destroy it, and the forces fall back to Đa Cát.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 135–36. See [[cal.1968-01-31.vietnam-tet-16]]. Battalion 186 reached its position only the night of Feb. 4. Check: whether the northwest thrusts are Feb. 4; the history gives no day.'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
- add:
    entry:
      id: cal.1968-02-07.vietnam-tet-2
      when: Feb. 7–11
      date: '1968-02-07'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Đà Lạt. After seven days of fighting the forces draw out to regroup, except in the northwest, where they hold some streets until Feb. 11. For the first thrust the history counts 1,450 of the other side killed, 22 vehicles (10 armored) destroyed and 11 aircraft shot down, 4 damaged.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 136. See [[cal.1968-01-31.vietnam-tet-16]]. The history ends the withdrawal Feb. 11. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
- add:
    entry:
      id: cal.1968-09-10.vietnam-hanoi
      when: Sept. 10
      date: '1968-09-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tây Ninh and the east and southeast of Saigon. The units open fire on the second phase of the third wave's campaign Sept. 10, as the command planned, shifting the main fighting east and southeast while hitting hard in the west and southwest to help the people tear down the new hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 236. Check: which of the two campaigns the history means by "phase 2"; the time of the opening.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1968-09-12.vietnam-hanoi-3
      when: Sept. 12
      date: '1968-09-12'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 22. Regiment 88 of the 5th Division ambushes and counterattacks and by the history's count puts about 350 out of action, destroys 46 vehicles and shoots down 6 helicopters.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 236. See [[cal.1968-09-12.vietnam-hanoi-2]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
- add:
    entry:
      id: cal.1968-09-16.vietnam-hanoi
      when: Sept. 16
      date: '1968-09-16'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 26. Regiment 174 of the 5th Division ambushes a mechanized infantry unit on the move and by the history's count kills or wounds over 200, burns 26 vehicles (9 armored) and 5 armed escort helicopters.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 236. See [[cal.1968-09-12.vietnam-hanoi-2]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
- add:
    entry:
      id: cal.1968-09-16.vietnam-hanoi-2
      when: Sept. 16–18
      date: '1968-09-16'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Củi, Bến Cát. Regiment 5 of the 5th Division makes its first raid on the base. Sept. 17 it raids a second time and by the history's count puts hundreds out of action and destroys or damages hundreds of vehicles and many heavy guns; the day after, a third raid, by the history's count nearly 400 out of action, 100 vehicles and 9 guns of the outer defense line.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 236. Made no separate entry for Sept. 17 and 18: the history''s run of three raids is one account. See [[cal.1968-09-12.vietnam-hanoi-2]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: ben-cat
- add:
    entry:
      id: cal.1968-10-10.vietnam-hanoi-2
      when: Oct. 10
      date: '1968-10-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Nhà Bè port. Sappers of the Rừng Sác secretly enter and plant explosives that sink a tanker of the Caltex company, 30 million liters. The history gives a second, Dec. 4.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 241. See [[cal.1968-08-21.vietnam-hanoi-3]]. Check: the day, which the history gives with the second ship; the ship''s name and size.'
      tags:
      - polity:drv
      - polity:us
      place: nha-be
- add:
    entry:
      id: cal.1968-12-04.vietnam-hanoi-2
      when: Dec. 4
      date: '1968-12-04'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Nhà Bè port. The Rừng Sác sappers sink a second Caltex tanker, 30 million liters, the same way.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 241. See [[cal.1968-10-10.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      place: nha-be
- cite:
    id: cal.1968-09-15.vietnam-paris
    item: '[[w.lich-su-khang-chien-chong-my]], V, 336 (the high-level private meetings of Sept. 8 to Oct. 14: Lê Đức Thọ and Xuân Thủy with the American heads, then four more, Sept. 12, 15 and 20 and Oct. 14; the Americans still press a full bombing halt for a step-down in the South and a "package")'
    units: A
- cite:
    id: cal.1968-09-20.vietnam-paris
    item: '[[w.lich-su-khang-chien-chong-my]], V, 336 (Sept. 20: the Americans formally demand that a Saigon representative take part in the talks after the bombing stops, calling it new and an "important factor" easing the halt)'
    units: A
- cite:
    id: cal.1968-10-11.vietnam-paris
    item: '[[w.lich-su-khang-chien-chong-my]], V, 336–37 (Oct. 11: Xuân Thủy asks the American head whether, if Vietnam accepts Saigon''s taking part in the next stage, the Americans will end the bombing of the North completely; the head must ask Washington, but the Americans take it as a way out of the deadlock)'
    units: A
- add:
    entry:
      id: cal.1968-10-14.vietnam-paris-2
      when: Oct. 14
      date: '1968-10-14'
      thread: vietnam-paris
      also:
      - vietnam-hanoi
      c: Paris. Lê Đức Thọ and Xuân Thủy meet the American heads in private, the last of five high-level private meetings after Sept. 8 (Sept. 8, 12, 15 and 20 and Oct. 14). From Oct. 15 to 31 the talks turn to a full unconditional halt, a joint paper, and whether the coming conference is of four sides or two.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 336–37. See [[cal.1968-10-11.vietnam-paris]]. Names: Lê Đức Thọ, Xuân Thủy. Check: the day against the American record read, which has private meetings Oct. 11 and Oct. 16 and for Oct. 14 only a Cabinet Room meeting in Washington.'
      tags:
      - polity:drv
      - polity:us
      - name:le-duc-tho
      - name:xuan-thuy
      place: paris
- add:
    entry:
      id: cal.1968-11-03.vietnam-paris
      when: Nov. 3
      date: '1968-11-03'
      thread: vietnam-paris
      also:
      - vietnam-hanoi
      c: Paris. The American representative meets the DRV delegation and proposes that the two sides meet Nov. 6 to arrange the "substantive meeting in a new form." The delegation agrees but says it must be a four-party meeting. The Americans are at a loss, Saigon having sent no delegation.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 341. See [[cal.1968-11-06.vietnam-paris]]. The history says the dispute over the meeting''s name and the shape of the table ran through 14 sessions; the American side called it two-sided and proposed first a rectangular table, then three other shapes. Check: whether Nov. 3 is the day; the history says "the same day" as Hồ Chí Minh''s appeal.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: paris
- add:
    entry:
      id: cal.1968-11-04.vietnam-paris
      when: Nov. 4
      date: '1968-11-04'
      thread: vietnam-paris
      also:
      - vietnam-hanoi
      c: Paris. Nguyễn Thị Bình, for the National Liberation Front's delegation, arrives and is to take part in the Nov. 6 meeting.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 341. See [[cal.1968-11-03.vietnam-paris]]. Names: Nguyễn Thị Bình.'
      tags:
      - polity:drv
      - name:nguyen-thi-binh
      place: paris
- add:
    entry:
      id: cal.1968-08-21.vietnam-hanoi-4
      when: Aug. 21
      date: '1968-08-21'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Thủy artillery base, Cần Thơ. After studying the Lộ Tẻ raid, 39 men of Battalion 309 and a sapper detachment under Dương Tử, the battalion commander, move in secretly that night, raid the base and by the history's count put about 170 out of action and destroy or damage 18 guns. Leaving, they are spotted and hit by heavy fire; some are killed and some stray for days.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 251. See [[cal.1968-08-21.vietnam-hanoi-3]]. The history says "the night of Aug. 21" and gives Lộ Tẻ as the night of Aug. 13. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: can-tho
      time_range:
      - 1968-08-21T14:00Z
      - 1968-08-21T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-10-27.vietnam-hanoi-2
      when: Oct. 27
      date: '1968-10-27'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Đồng Dù base, Củ Chi. A secret guerrilla team under Chín Khảnh, deputy district commander for intelligence, goes in disguised and sets a time mine in the officers' club, wounding or killing a number of officers, eight of them field grade.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 245. Check: the clock; "Chín Khảnh" as the history gives the name. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: cu-chi
- add:
    entry:
      id: cal.1968-11-03.vietnam-hanoi
      when: Nov. 3
      date: '1968-11-03'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Giồng Trôm, Bến Tre. The Saigon 7th Division's Regiments 10 and 11 sweep the liberated communes of Long Mỹ, Tân Hào, Thuận Điền, Phước Long and Thạnh Phú Đông, and a security company the commune of Nhơn Trạch. Battalions 5 and 516 and the local forces fight hard to the end of the day; the night of Nov. 3 the province command decides to move all its force in secret to Sơn Phú commune, a remote place on the Hàm Luông river.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 257–58. See [[cal.1968-07-23.vietnam-hanoi]]. The history gives the sweep after the American 3d Brigade and the 117th river assault group were added in Sept. and Oct. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      - ok:fields-time
      place: ben-tre
- add:
    entry:
      id: cal.1968-11-04.vietnam-hanoi-2
      when: Nov. 4
      date: '1968-11-04'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Sơn Phú commune, Hàm Luông river, Bến Tre. The enemy finds the force the morning after; after 400 rounds of shelling, the Saigon River Group 23 enters the river and an M113 troop deploys on Route 5. The force beats off dozens of attacks that day and by the history's count kills hundreds. The night of Nov. 4 an engineer platoon, an infantry platoon and fire support raid Battalion 1 of the 10th Regiment; the ring breaks and the force slips out. Battalions 5 and 516 get the Third Class Military Exploit Order.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 258. See [[cal.1968-11-03.vietnam-hanoi]]. The history says "the night of Nov. 4". Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-time
      place: ben-tre
- add:
    entry:
      id: cal.1968-11-15.vietnam-hanoi
      when: Nov. 15
      date: '1968-11-15'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mouth of the Bến Tre, Bến Tre. A water-sapper company slips in, fixes charges and sinks 15 vessels of an American river flotilla.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 259. See [[cal.1968-11-04.vietnam-hanoi-2]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: ben-tre
- add:
    entry:
      id: cal.1968-11-20.vietnam-hanoi
      when: Nov. 20
      date: '1968-11-20'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Thạnh Trị district seat, Sóc Trăng. Battalion Phú Lợi, with district troops and guerrillas, destroys the 7 bunkers guarding the subsector and Security Company 127 and takes many weapons and supplies. Dec. 5 the forces of Châu Thành, Hồng Dân and Lịch Hội Thượng attack some targets in the subsectors; Dec. 18 Battalion Phú Lợi and Châu Thành troops break up three civil-defense platoons and help the people of Trà Cú Cạn hamlet rise.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 253. Check: the days of Dec. 5 and Dec. 18; the province for Châu Thành, which the history gives with Sóc Trăng.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1968-12.vietnam-hanoi-2
      when: Dec., early
      date: 1968-12
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Thanh Mỹ commune, Kiến Phong. In the first week of December B-52s bomb the area from the Cái Lân creek to Kinh Phèn and kill Võ Văn Trị (Mười Đồng), deputy secretary of the province committee and political commissar of the province command, and Lê Văn Nhị (Hai Tiến), of the standing committee and province commander. About the same time the enemy "leaps" troops in on the Cao Lãnh district committee office and kills several cadres, among them Hồ Văn Tiến, the district secretary.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 262. Check: the days; the history gives "the first week of December 1968" for the bombing and "about that time" for the district office.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1968-11.vietnam-hanoi
      when: Nov., late
      date: 1968-11
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Nhà Đài crossroads, Vĩnh Long. In mid-November the enemy sends the Saigon 405th Battalion to build an operations base at the crossroads; at the end of the month Regiment 3 with two battalions raids the base and by the history's count puts 350 out of action, then moves to Vĩnh Xuân, Thầy Phó, Hựu Thành and An Trường to meet the sweeps. In December the regiment beats most of the sweeps and by the history's count hurts one ranger battalion and one of the 16th Regiment badly.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 252. Check: the days; the history gives "the end of November" and "December". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1968-11.vietnam-hanoi-2
      when: Nov., mid
      date: 1968-11
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Language school of the Saigon Air Force Command, Đồng Khánh street, District 5. In mid-November a secret armed team of the Chinese-community organization puts a 105 kg charge on a three-wheeled motor vehicle and blows up the school; by the history's count dozens of American, Thai, Korean and Saigon officers are killed or wounded. In early December a secret security team ambushes General Kiêm's convoy, wounding him and some of his staff.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 242. Check: the days; the history gives "mid-November" and "early December". Kiêm, said to command the President''s office staff and the intelligence commission. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
      place: saigon
- add:
    entry:
      id: cal.1968-03.vietnam-khe-sanh-2
      when: Mar., late
      date: 1968-03
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: 'The Route 9–Khe Sanh Front''s command, with the 325C Division ordered to the Highlands at the end of March and only two infantry divisions (304 and 320), two artillery and antiaircraft regiments (45 and 241), two infantry regiments (27 and 270) and the 126th Sapper Regiment left, readjusts: half the force besieging Tà Cơn goes to fight along Route 9 and slow the enemy''s advance; the rest hold the siege lines and fight the landings. The history puts the American strength in Quảng Trị at the equal of three divisions, over 60,000, two thirds of them Americans.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 218. See [[cal.1968-02-10.vietnam-khe-sanh-2]]. Made public: 2013. Check: the day; the history gives the end of March.'
      tags:
      - polity:drv
      - vis:only:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
- cite:
    id: cal.1968-04-01.vietnam-2
    item: '[[w.lich-su-khang-chien-chong-my]], V, 218–19 (Apr. 1: the American 1st Cavalry Division, the Saigon 3d Airborne Brigade and the Marines open "Flying Horse" ("Lam Sơn 207"), 30,000 men in four thrusts: Làng Cát, Làng Khoai, Húc Thượng and Húc Hạ, 18 km east of Khe Sanh; Cà Lu and Tân Lâm and then up Route 9; north of Khe Sanh; and the airborne brigade at Ku Bốc and north of Làng Vây; bombing within 400 meters of Tà Cơn''s center and B-52s 2 to 3 km out)'
    units: A
- add:
    entry:
      id: cal.1968-04-05.vietnam-khe-sanh
      when: Apr. 5
      date: '1968-04-05'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Hill 400. Battalion 4 of Regiment 24 raids an American company by surprise and by the history's count puts nearly 100 out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 219. See [[cal.1968-02-10.vietnam-khe-sanh-2]]. The history says the units in these days were made to shake off the first confusion by "test" blows. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
