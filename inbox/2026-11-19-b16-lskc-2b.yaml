    entry:
      id: cal.1966-04-07.vietnam-struggle-2
      when: Apr. 7
      date: '1966-04-07'
      thread: vietnam-struggle
      c: 'Saigon. The sixth sleepless night: by the history''s count hundreds of thousands defy the ban and the curfew and surround Kỳ''s offices, demanding that Thiệu and Kỳ resign.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 142. See [[cal.1966-03-12.vietnam-struggle]]. The figure is the history''s.'
      tags:
      - polity:drv
      - polity:rvn
