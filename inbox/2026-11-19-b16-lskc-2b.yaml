      c: Tà Cơn. At night, and again Mar. 1 and 2, Regiment 9 tries to take stretches of the trenches south of the base; its lines had closed to 40 or 50 meters. The attempts fail.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 155. See [[cal.1968-02-10.vietnam-khe-sanh-2]]. The history says "the night of Feb. 28 and Mar. 1 and 2". Check: the clock, whose it is.'
