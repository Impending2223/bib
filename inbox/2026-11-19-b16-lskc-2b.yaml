    entry:
      id: cal.1968-01-30.vietnam-tet-3
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Tuy Hòa, Phú Yên. At the South's New Year's Eve the enemy in town and the posts around fire in the new year; under their flares the attackers close on their targets. Company 202 of the province, Lê Trung Kiên commanding, attacks the headquarters of the Saigon 47th Regiment and the American advisers' compound and by the history's count kills 78; the Quyết Thắng platoon takes the police office; Battalion 12 holds the 18-room house in ward 2 against counterattacks; outside the town forces hit the headquarters of the Korean White Horse Division's 28th Regiment and the Đông Tác airfield south of the Đà Rằng; thousands from three districts demonstrate. For Jan. 30 to Feb. 5 the history counts 1,114 out of action in the province, 349 of them Americans and 464 Koreans, 47 aircraft and 28 vehicles destroyed.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 123. See [[cal.1968-01-30.vietnam-tet-12]]. The history has the province''s forces fire "a day earlier than the general plan". Check: the day, which falls the night of Jan. 29–30 by the South''s calendar. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rok
      - polity:rvn
      place: tuy-hoa
      time: 1968-01-29T16:00Z
      time_zone: Asia/Ho_Chi_Minh
      time_approx: true
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-9
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Pleiku. At 12:55 a.m. the forces go in from several directions and take the Region 2 police area, the administrative area, the ranger area and the province Civil Guard headquarters, and break open three jails to free 2,000 prisoners. Sapper Battalion 408 hits the Arêa airfield, damaging 15 helicopters and 35 vehicles; Regiment 95 destroys a convoy of 26 vehicles on Route 19; guns fire on the Saigon II Corps headquarters and the radar area. On the first day 11 outlying communes are freed.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 125–26. The history puts the 1st Cavalry Division''s headquarters at An Khê and the 4th Infantry Division''s at Pleiku. Check: the clock, whose it is; "Arêa" as printed. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: pleiku
      time: 1968-01-29T16:55Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-18
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Kon Tum. In the night Battalion 304 of the province and Sapper Battalion 406 take the administrative area, the subsector, the airfield and Special Zone 24 and hold half the town; at first light the enemy counterattacks and the two battalions break scores of assaults. A Xâu of Battalion 304 fights the day through in the open and by the history's count kills scores with grenades he throws back; A Thang, 16, fights to his last round. Outside, the forces surround the Kleng post and take seven strategic hamlets along Provincial Route 5.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 126. Check: the day; the history gives "in the night" for the opening. A Xâu is named a Hero of the People''s Armed Forces Nov. 23, 1969 (V, 126 n.1). The figures are the history''s.'
      tags:
