      when: Jan. 17
      date: '1967-01-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cát Hanh commune, Phù Cát. A Korean company sweeps into the village; the guerrilla Nguyễn Đức Cường holds the Vĩnh Tường cave with a carbine from morning to afternoon and by the history's count kills 13. Wounded, out of ammunition, he writes his farewell in blood on a handkerchief and dies by the last grenade as the troops turn him over.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 309–10. See [[cal.1966-12-17.vietnam-hanoi]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rok
      place: cat-hanh
      time_range:
      - 1967-01-16T22:00Z
      - 1967-01-17T11:00Z
      time_band: daytime
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1967-01-18.vietnam-hanoi
      when: Jan. 18
      date: '1967-01-18'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Đập Ấu post and Mai Tức bridge, Route 7. That night a company of Battalion 306 attacks and destroys the Đập Ấu post; the whole battalion then beats the counterattack to retake the Mai Tức bridge, held by a sapper detachment, and by the history's count puts over 200 out of action. The Military Command gives the battalion a Third Class Military Exploit Order for it.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 336. Check: the clock, whose it is; the place, which the history gives only as the Vĩnh–Trà zone. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      time_range:
      - 1967-01-18T14:00Z
      - 1967-01-18T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
