      c: Làng Cát. Battalion 7 of Regiment 102 attacks the post a second time; after two hours, with a company down by nearly a third, it by the history's count kills over 100 and forces the two American companies holding it to call for reinforcements.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 221. See [[cal.1968-05-28.vietnam-khe-sanh]]. The figures are the history''s.'
