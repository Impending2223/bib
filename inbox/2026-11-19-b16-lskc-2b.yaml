- add:
    entry:
      id: cal.1968-01-29.vietnam-tet-4
      when: Jan. 29
      date: '1968-01-29'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Trại Thủy hill (the Buddha-statue hill), Nha Trang. The attackers fight the enemy all day to 5 p.m., then withdraw to the foot of the hill; the next day a ranger company with air cover retakes it and, by the history's count, is badly hurt by ambushes in the streets below.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 125. See [[cal.1968-01-29.vietnam-tet-2]]. The history dates the fight "Jan. 29, the 30th of the twelfth month by the South''s calendar". Check: the day against the night of Jan. 29–30, when the attack on the city opened. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-time
      place: nha-trang
