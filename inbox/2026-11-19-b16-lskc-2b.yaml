    entry:
      id: cal.1968-04-07.vietnam-khe-sanh
      when: Apr. 7
      date: '1968-04-07'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Hills 542 and 567, northwest of Làng Vây. At noon a battalion of the Saigon 3d Airborne Brigade lands; the defenders' artillery hits its formation and by the history's count puts two companies out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 219. See [[cal.1968-04-05.vietnam-khe-sanh]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-place
      time: 1968-04-07T04:00Z
      time_zone: Asia/Ho_Chi_Minh
