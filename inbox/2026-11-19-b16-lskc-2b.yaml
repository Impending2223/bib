      when: Jan. 19
      date: '1967-01-19'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ma Lâm, Sơn Hòa, Phú Yên. Village guerrillas ambush a platoon on a sweep and by the history's count kill seven.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 311. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
- add:
    entry:
      id: cal.1967-01-25.vietnam-hanoi
      when: Jan. 25
      date: '1967-01-25'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Gò Nổi, Điện Bàn. Battalion 1 of the province, district troops and local guerrillas surround and stop an American Marine battalion on a sweep to move the people into new hamlets, and hurt it. The history calls it the first time in Region 5 that a province battalion, with district troops, guerrillas and the people, beat such a force.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 304. See [[cal.1966-12-27.vietnam-hanoi]]. Check: the result, which the history gives as "many losses".'
      tags:
      - polity:drv
      - polity:us
      place: go-noi-dien-ban
- add:
    entry:
      id: cal.1967-01-26.vietnam-hanoi
      when: Jan. 26–Feb. 18
      date: '1967-01-26'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Phổ Minh commune, Đức Phổ. To Feb. 18 the guerrillas beat many sweeps and by the history's count put over 300 out of action; they also raid an American supply area.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 306. The history gives the span, Jan. 26 to Feb. 18. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: duc-pho
