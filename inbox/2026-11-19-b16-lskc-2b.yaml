      c: Hòn Đồn base, An Định commune, Tuy An. That night the province's Sapper Company 202 raids the base and destroys a platoon; the raid helps An Định rise and cut the Saigon hamlet administration for days.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 311–12. See [[cal.1967-03-07.vietnam-hanoi]]. The history says "the next night". Check: the clock, whose it is.'
