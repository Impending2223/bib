      when: Mar. 8
      date: '1968-03-08'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Tà Cơn. An enemy ranger company attacks a post of a Regiment 9 detachment southeast of the base; the post, on high ground, sees it coming and destroys it as it comes into range.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 155. See [[cal.1968-02-10.vietnam-khe-sanh-2]].'
