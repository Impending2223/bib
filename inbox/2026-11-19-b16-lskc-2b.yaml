      date: '1967-03-14'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Phước Tây, Định Tường. The enemy sets up a special forces camp of five companies under American advisers, which runs twelve commando operations into the surrounding hamlets. In the second half of March, by the history's count, it kills over 500 cadres, guerrillas and supporters and wrecks over 100 houses.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 330. Check: the place, which the history gives as the subsector''s; the count is the history''s.'
