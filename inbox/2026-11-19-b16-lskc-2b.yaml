- cite:
    id: cal.1966-07-02.soviet-union-leadership
    item: '[[w.lich-su-khang-chien-chong-my]], V, 294 (July 4–6: the Warsaw Pact states meet at Bucharest, leaders and the foreign and defense ministers of the Soviet Union, Bulgaria, Hungary, the GDR, Poland, Romania and Czechoslovakia; after a report on Vietnam they declare against the American crimes, for more aid, and their readiness to send volunteers)'
    units: A
- cite:
    id: cal.1966-07-22.china-leadership-4
    item: '[[w.lich-su-khang-chien-chong-my]], V, 291 (the mass meeting in Tiananmen Square, July 22, 1966; Liu Shaoqi: American aggression against Vietnam is aggression against China, 700 million are the rear of the Vietnamese people)'
    units: A
- cite:
    id: cal.1966-01-03.vietnam-diplomacy
    item: '[[w.lich-su-khang-chien-chong-my]], V, 297–98 (the Havana conference, Jan. 3–15, 1966: the Vietnamese people''s fight called a direct support of the liberation movements of the three continents; solidarity with Vietnam made the central task)'
    units: A
- cite:
    id: cal.1965-03-24.students
    item: '[[w.lich-su-khang-chien-chong-my]], V, 304 (the first teach-in on the war, University of Michigan, Mar. 24, 1965, over 3,000 students)'
    units: A
- cite:
    id: cal.1965-06-08.war-opposition
    item: '[[w.lich-su-khang-chien-chong-my]], V, 304 (June 8, 1965, over 18,000 at New York)'
    units: A
- cite:
    id: cal.1965-10-15.students
    item: '[[w.lich-su-khang-chien-chong-my]], V, 305 (Oct. 15 and 16, 1965: over 100,000 in 60 cities; a night march of over 10,000 at Berkeley toward the Oakland Army Base; David Miller burns his draft card at the Whitehall Street induction center)'
    units: A
- cite:
    id: cal.1965-11-02.students
    item: '[[w.lich-su-khang-chien-chong-my]], V, 305–06 (Norman Morrison, 31, a young Quaker, burns himself before the window of the Secretary of Defense, with his 18-month-old daughter set down on the ground)'
    units: A
- cite:
    id: cal.1967-10-21.war-opposition
    item: '[[w.lich-su-khang-chien-chong-my]], V, 310 (Oct. 21, 1967: 200,000 from across the country gather before the Lincoln Memorial and surround the Pentagon; the history prints the day after a demonstration of Oct. 17 as "the next day")'
    units: A
- add:
    entry:
      id: cal.1965-11-09.war-opposition-2
      when: Nov. 9
      date: '1965-11-09'
      thread: war-opposition
      c: New York, the United Nations. Roger LaPorte, 22, burns himself to death before the building to protest the war. The history takes it as following Morrison's act a week before.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 306. See [[cal.1965-11-02.students]]. Names: Morrison, LaPorte. Check: the record, not read; the history prints the name "Rôgiơ Lapotơ".'
      tags:
      - polity:us
      - name:morrison-norman-r
      - name:laporte-roger-allen
      place: nyc
- add:
    entry:
      id: cal.1965-11-10.war-opposition
      when: Nov. 10
      date: '1965-11-10'
      thread: war-opposition
      c: Two women burn themselves to protest the war, one a young mother of two children, the other 79. The history gives the names, as it prints them, as Xilin Giancaoxki and Helga Alíthớt.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 306. See [[cal.1965-11-09.war-opposition-2]]. Check: the names and the places; no record read; the history says "Nov. 10".'
      tags:
      - polity:us
- add:
    entry:
      id: cal.1966-02-23.vietnam-diplomacy
      when: Feb. 23
      date: '1966-02-23'
      thread: vietnam-diplomacy
      also:
      - vietnam-hanoi
      c: Algeria. President Boumédienne answers Hồ Chí Minh's letter of Jan. 24, 1966.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 300. See [[cal.1966-01-24.vietnam-hanoi-2]]. Names: Hồ Chí Minh, Boumédienne. The history''s sentence is cut at the page end; the content of the reply is on V, 301.'
      tags:
      - polity:algeria
      - polity:drv
      - name:ho-chi-minh
      - name:boumediene-houari
- add:
    entry:
      id: cal.1966-07-04.vietnam-diplomacy
      when: July 4
      date: '1966-07-04'
      thread: vietnam-diplomacy
      c: Hamburg. In the afternoon about 2,000 students and others rally and march to the American consulate with the slogans "Americans go home" and "Hands off Vietnam." In Frankfurt the people demonstrate 20 hours, day and night, before the American consulate, against the new American crime; the history adds similar marches in Munich, Stuttgart, Heidelberg and Düsseldorf.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 300. Check: the days of the Frankfurt and other marches, which the history gives as "in the same days"; the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:frg
      - polity:us
      place: hamburg
      time_range:
      - 1966-07-04T11:00Z
      - 1966-07-04T17:00Z
      time_band: afternoon
      time_zone: Europe/Berlin
      range_basis: record
- add:
    entry:
      id: cal.1966-07-07.vietnam-diplomacy
      when: July 7
      date: '1966-07-07'
      thread: vietnam-diplomacy
      c: India. Prime Minister Indira Gandhi declares that the United States must stop bombing North Vietnam, withdraw foreign troops from the South, reconvene the 1954 Geneva conference and guarantee Vietnam's independence and territorial integrity.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 298. Names: Gandhi. Check: the place and the words, which the history gives in part.'
      tags:
      - polity:india
      - polity:us
      - ok:fields-place
      - name:gandhi-indira
- add:
    entry:
      id: cal.1966-08-17.vietnam-diplomacy
      when: Aug. 17
      date: '1966-08-17'
      thread: vietnam-diplomacy
      also:
      - soviet-union-leadership
      c: Moscow. 6,000 representatives of the capital's people rally in answer to Hồ Chí Minh's appeal; the rally resolves that the Soviet government's will to go on aiding fraternal Vietnam to throw back the imperialists is wholly in keeping with the deepest feeling of all the Soviet people.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 292. Names: Hồ Chí Minh. Check: the place; the history says "in the Soviet Union", of the capital''s people. The figures are the history''s.'
      tags:
      - polity:ussr
      - name:ho-chi-minh
      place: moscow
- cite:
    id: cal.1965-05-13.vietnam-mayflower
    item: '[[w.lich-su-khang-chien-chong-my]], V, 314–15 (May 11: Rusk cables Kohler at Moscow to meet the DRV ambassador Nguyễn Văn Kỉnh with the President''s message; the embassy refuses to receive him or the message, there being no relations between the states; Soviet Deputy Foreign Minister Firyubin also refuses to forward it, Hanoi never having asked; May 13 Kohler gives a letter with the message to the British consul at Hanoi, E. F. Young, for the foreign affairs chief of the city committee; returned the next day)'
    units: A
- cite:
    id: cal.1966-01-31.vietnam-2
    item: '[[w.lich-su-khang-chien-chong-my]], V, 317–18 (the evening of Jan. 31 at Rangoon: the consul general, whom the history prints as Nguyễn Hữu Bình and, at V, 315, as Vũ Hữu Bình, tells Byroade of the contradictions in the American "peace initiatives" and that a political solution is possible only when the United States accepts the DRV''s four points and ends the bombing unconditionally and for good)'
    units: A
- cite:
    id: cal.1967-07-21.vietnam
    item: '[[w.lich-su-khang-chien-chong-my]], V, 319–20 (the Pugwash group meets at Paris June 16–18 with Kissinger "in the President''s name" and sends Marcovich; Aubrac, who sheltered Hồ in 1946, goes with him; July 21 they reach Hanoi as a scientific mission to the Health Ministry; July 24 Hồ receives Aubrac; July 24 and 25 Phạm Văn Đồng: negotiations on the whole of Vietnam, the South first, need the Front, but the first stage may leave it out; "if you need a contact, meet our representative at Paris")'
    units: A
- variant:
    id: cal.1967-07-21.vietnam
    unit: A
    witness: w.lich-su-khang-chien-chong-my
    reads: 'Phạm Văn Đồng to Aubrac and Marcovich, July 24 and 25: talks on the substance, the whole of Vietnam and first the South, need the Front''s presence, though the first stage may leave it out; for a contact, meet the DRV representative at Paris; no mention of a de facto halt'
    at: V, 320
- cite:
    id: cal.1967-08-25.vietnam-pennsylvania
    item: '[[w.lich-su-khang-chien-chong-my]], V, 320 (Aug. 25, Sept. 13 and Oct. 6: the three American messages passed to the DRV through Mai Văn Bộ, its general delegate at Paris; the two Frenchmen disappointed that the messages "still carry conditions," Aubrac thinking of breaking off)'
    units: A
- cite:
    id: cal.1967-09-29.vietnam
    item: '[[w.lich-su-khang-chien-chong-my]], V, 326 (Sept. 29, San Antonio: Johnson says the United States and the South are ready to discuss at once with the North; the history calls it pressure of opinion at home and abroad)'
    units: A
- add:
    entry:
      id: cal.1965-06-03.vietnam-diplomacy
      when: June 3
      date: '1965-06-03'
      thread: vietnam-diplomacy
      also:
      - vietnam-hanoi
      c: Hanoi. Foreign Minister Nguyễn Duy Trinh, receiving the Canadian ambassador, a member of the International Commission up from Saigon, says the United States is following a policy of the stick and the carrot.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 315. Names: Nguyễn Duy Trinh. Check: whether the Canadian is the commission''s member only.'
      tags:
      - polity:drv
      - name:nguyen-duy-trinh
      place: hanoi
- add:
    entry:
      id: cal.1965-05-14.vietnam-mayflower
      when: May 14
      date: '1965-05-14'
      thread: vietnam-mayflower
      also:
      - vietnam-hanoi
      c: Hanoi. The letter and the American message that Kohler gave the British consul, E. F. Young, on May 13 for the city committee's foreign affairs chief are returned to the consul; the history calls the message a threat of war in both zones if the North would not accept the American kind of peace.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 315. See [[cal.1965-05-13.vietnam-mayflower]]. The history says "the next day". Names: Kohler.'
      tags:
      - polity:drv
      - polity:us
      - polity:uk
      - name:kohler-foy-d
      place: hanoi
- add:
    entry:
      id: cal.1967-06-16.vietnam-pennsylvania
      when: June 16–18
      date: '1967-06-16'
      thread: vietnam-pennsylvania
      also:
      - vietnam-diplomacy
      - vietnam-hanoi
      c: Paris. For three days a group of French and American scientists of the Pugwash movement meets, with Henry Kissinger, professor at Harvard, taking part and presiding "in the American President's name"; it agrees to send Marcovich, a molecular biologist at the Pasteur Institute, and then asks Raymond Aubrac, who had known Hồ Chí Minh at Fontainebleau in 1946, to go with him.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 318–19. See [[cal.1967-07-21.vietnam]]. Names: Hồ Chí Minh, Kissinger, Aubrac, Marcovich. The history says "June 16, 17 and 18". Check: Kissinger''s part, which the history gives; no record read.'
      tags:
      - polity:drv
      - polity:us
      - polity:fr
      - name:ho-chi-minh
      - name:kissinger-henry-a
      - name:aubrac-raymond
      - name:marcovich-hebert
      place: paris
- variant:
    id: cal.1967-01.vietnam
    unit: A
    witness: w.lich-su-khang-chien-chong-my
    reads: the Thirteenth Plenum of the Central Committee, Jan. 23 to 26, 1967, on pushing the diplomatic struggle
    at: V, 324
- add:
    entry:
      id: cal.1967-02-08.vietnam-diplomacy
      when: Feb. 8
      date: '1967-02-08'
      thread: vietnam-diplomacy
      c: India. Foreign Minister Chagla says his government notes with satisfaction Nguyễn Duy Trinh's statement that talks are possible once the bombing ends. The history lists U Thant's three points (stop the bombing of the North, scale down military action by all sides in the South, give the Front a part in any settlement) and de Gaulle's sharp criticism of the United States in the same days.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 326. See [[cal.1967-01-28.vietnam]]. Names: Nguyễn Duy Trinh. Check: the place; the history gives the statement without one.'
      tags:
      - polity:india
      - polity:drv
      - name:nguyen-duy-trinh
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-12
      when: May 5
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Tân Uyên and Lái Thiêu, Bình Dương. The province forces with Regiment 12 of the 7th Division open a round of action west of Route 16 and by the history's count put hundreds out of action. Mid-May Regiment 14 of the division, with the Region's artillery, raids the Sở Hội base, hurting an infantry battalion and destroying two mixed artillery positions. Tân Uyên district troops and the Bình Mỹ guerrillas break a sweep by an American battalion at Bàu Đồng Tràm and by the history's count put nearly 100 out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 194–95. Check: the days of the Sở Hội raid and the Bàu Đồng Tràm fight, which the history gives as "mid-May" and no day. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: tan-uyen
- add:
    entry:
      id: cal.1968-05-08.vietnam-may-offensive-4
      when: May 8
      date: '1968-05-08'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Mỹ Hạnh, Đức Hòa. Despite heavy bombing, the district's forces stop an American battalion sweeping into the village and by the history's count kill or wound nearly 100.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 196. Check: the province, which the history gives only through Long An in the page''s run. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: my-hanh
- add:
    entry:
      id: cal.1968-05.vietnam-may-offensive-5
      when: May, early
      date: 1968-05
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Đất Đỏ, Long Đất. In the first week of May the district forces attack the subsector and destroy most of the Saigon administration in the communes and hamlets. The enemy counterattacks with four battalions (one Australian), three tank and armored troops, aircraft and guns against the base at Minh Đạm; the district with Province Battalion 445 holds it by every form of tactic.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 195. Check: the days; the history gives "the first week of May 1968" and no result at the page''s end.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      - ok:fields-place
      place: long-dat
- add:
    entry:
      id: cal.1968-05-24.vietnam-may-offensive
      when: May 24
      date: '1968-05-24'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Lộ Tẻ airfield, Cần Thơ. That night a sapper company of the Region enters the field and with hand charges and grenades destroys 18 helicopters, 2 trucks and a field fuel store and kills or wounds nearly 30.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 201. See [[cal.1968-02-18.vietnam-tet-4]]. The history says "the night of May 24". Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      place: can-tho
      time_range:
      - 1968-05-24T14:00Z
      - 1968-05-24T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-05-25.vietnam-may-offensive-2
      when: May 25
      date: '1968-05-25'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: The road from Cái Tắt to Tầm Vu, Vị Thanh. The Cần Thơ forces, chiefly Tây Đô Battalion, ambush a Saigon column, hurt a battalion of the 33d Regiment badly, destroy 50 trucks and take military stores. Early in June the province's districts attack and by the history's count destroy 50 posts and free dozens of communes and hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 201. See [[cal.1968-05-24.vietnam-may-offensive]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-place
      place: vi-thanh
- add:
    entry:
      id: cal.1968-05-29.vietnam-may-offensive
      when: May 29
      date: '1968-05-29'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Thạnh Trị, Sóc Trăng. Province defense Unit B68 with local guerrillas destroys the post at the Phật Mẫu pagoda and the Cầu Đá position and pushes into the center of Thạnh Trị, removing the subsector's hold; at the same time Châu Thành district troops and guerrillas besiege the posts at Mỹ Thuận, Tà Ông and Đại Súa until they surrender, widening the liberated area up to the town.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 202–03. See [[cal.1968-05-05.vietnam-may-offensive]]. Check: the day, which the history gives for the Thạnh Trị part; the rest "at the same time".'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1968-05-19.vietnam-may-offensive
      when: May 19
      date: '1968-05-19'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Hoằng bridge, Rạch Giá. A woman courier of the province's troop-proselytizing section, with Chị Nhơn and a boy, Đức, of Giục Tượng, bring the bridge down.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 203. Check: the bridge''s name as printed, "Hoằng", and the place.'
      tags:
      - polity:drv
      - polity:rvn
      place: rach-gia
- add:
    entry:
      id: cal.1968-10-27.vietnam-saigon
      when: Oct. 27
      date: '1968-10-27'
      thread: vietnam-saigon
      also:
      - vietnam-struggle
      - vietnam-hanoi
      c: Saigon, An Quang pagoda. More than 500 delegates of 20 groups and religions hold a service and meeting calling for Thiệu, Kỳ and Hương to resign and for an end to the war and peace in the South.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 243. Names: Thiệu, Kỳ, Hương. Check: the day, which the history prints with an ellipsis after it; Hương, whom the history names by surname alone and the series takes as Trần Văn Hương.'
      tags:
      - polity:drv
      - polity:rvn
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
      - name:tran-van-huong
      place: saigon
- add:
    entry:
      id: cal.1968-12-25.vietnam-saigon
      when: Dec. 25
      date: '1968-12-25'
      thread: vietnam-saigon
      also:
      - vietnam-struggle
      c: Saigon. On Christmas Day more than 1,000 pupils and students of Saigon's universities and high schools march with torches for peace from the Hiền Vương Catholic Center to the Redemptorist church, in the three-month wave of student protest against Thiệu's "general mobilization" decree and the militarizing of the schools.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 243. Names: Thiệu. Check: the church''s name as the history gives it; no record read.'
      tags:
      - polity:drv
      - polity:rvn
      - name:nguyen-van-thieu
      - ok:fields-place
      place: saigon
- add:
    entry:
      id: cal.1968-12.vietnam-hanoi-3
      when: Dec., mid
      date: 1968-12
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Vườn Trầu hamlet, Phước Thạnh commune, Củ Chi. The American 25th Division, having found the assembly place of Battalion 7 of the Củ Chi local forces, sends a regiment with artillery and tanks to surround it. Fighting from its tunnels and prepared ground for over a day, the battalion puts two American companies out of action by the history's count; the enemy adds two infantry battalions and armor, and the battalion's command decides to break out of the ring to save the force.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 245–46. Check: the day; the history says "mid-December 1968". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: cu-chi
- add:
    entry:
      id: cal.1966-07.vietnam-hanoi
      when: July, early
      date: 1966-07
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Đồng Dù base, Củ Chi. Battalion 8, artillery, fires 200 rounds into the center of the base and by the history's count kills or wounds scores of Americans and destroys 20 vehicles.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 217. Check: the day; the history says "the beginning of July 1966". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: dong-du
- add:
    entry:
      id: cal.1966-07-16.vietnam-hanoi-2
      when: July 16
      date: '1966-07-16'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 1, south of Quảng Trị. Regiment 6 of Thừa Thiên thrusts down to the road and by the history's count hurts a battalion badly and destroys 15 vehicles.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 208. Check: the place, which the history gives only as "the road". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1966-07-18.vietnam-hanoi
      when: July 18
      date: '1966-07-18'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Điền, Thừa Thiên. Local troops with the district guerrillas ambush traffic, burn two GMC trucks and by the history's count kill 14.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 208. See [[cal.1966-07-16.vietnam-hanoi-2]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1966-07-24.vietnam-hanoi
      when: July 24
      date: '1966-07-24'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Sa Nhỏ, 16 kilometers northwest of Củ Chi town. The enemy, having found the Region's main force there, lands an American company from 12 helicopters; Battalion 8 of the Region, with two companies, destroys it. The Americans at Đồng Dù land two more companies from 25 helicopters at Cỏ Ống to relieve it; Battalion 8 slips past the fire to the enemy's belt, by the history's count kills scores and burns five aircraft, and the rest flee toward Trung Hòa.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 217. Check: the day of the second landing, which the history gives with the first. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: sa-nho
- add:
    entry:
      id: cal.1966-08.vietnam-hanoi-4
      when: Aug., mid
      date: 1966-08
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bông Trang and Lò Gạch. The American 1st Division's 1st Brigade sweeps with tens of tanks and armored carriers; Battalion Phú Lợi of Bình Dương ambushes it and by the history's count puts nearly 200 out of action and burns 16 tanks and M113s. The history calls it the battalion's best counterattack. About the same time Phước Long's Companies 270 and 271 attack the Phước Bình subsector and shell the province town, by the history's count killing or wounding nearly 100 Saigon and American troops.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 217. Check: the day; the history says "mid-August 1966". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1966-09.vietnam-hanoi-2
      when: Sept., early
      date: 1966-09
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Biên Hòa airfield. The Region's artillery shells it and by the history's count destroys 20 aircraft and puts many American pilots and technicians out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 218. Check: the day; the history says "the beginning of September 1966". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: bien-hoa
- add:
    entry:
      id: cal.1966-09-04.vietnam-hanoi
      when: Sept. 4
      date: '1966-09-04'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Chợ Hôm, Huế. The armed work teams on the edge of the city and the guerrillas destroy a local-force unit. The same day the Hương Thủy guerrillas snipe at the Americans in the Phú Bài base.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 214. Check: the day of the Phú Bài sniping; the history gives it with the first.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      place: hue
- add:
    entry:
      id: cal.1966-09-10.vietnam-hanoi
      when: Sept. 10
      date: '1966-09-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Nam Giang post, Thừa Thiên. The province's local-force battalion with guerrillas attacks the post, then ambushes the convoy sent out to sweep and by the history's count puts nearly 200 out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 214. See [[cal.1966-09-04.vietnam-hanoi]]. The figures are the history''s.'
