    entry:
      id: cal.1968-05.vietnam-may-offensive-3
      when: May, mid
      date: 1968-05
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Đà Lạt. In a week in mid-May Battalion 810 and the province's commando teams attack 13 targets in 26 actions.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 205. Check: the days and the targets; the page lists them.'
      tags:
      - polity:drv
