    entry:
      id: cal.1968-05.vietnam-may-offensive-4
      when: May, early
      date: 1968-05
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Cẩm Bình motor pool, Quảng Đà. Sapper Battalion 89 of the Region attacks the pool, hurts an American company badly and destroys 36 vehicles of all kinds.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 207. Check: the day; the history says "early in May 1968". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1968-05-06.vietnam-may-offensive-5
      when: May 6–June 13
      date: '1968-05-06'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Khâm Đức, Núi Ngang, Quảng Nam. From May 6 to June 13 the 2d Division hits the American 196th and 11th Infantry Brigades near Núi Ngang by the history's count and so frees the province forces to attack a run of posts on the edges of the towns and district seats.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 207. The history gives the span, May 6 to June 13. Check: the units of the brigades; the figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: kham-duc
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-9
      when: May 5–6
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Quảng Ngãi town. Two sapper companies of the province and the town forces attack the Quảng Ngãi subsector in two days, May 5 and 6, and hurt two companies of Saigon and security troops badly. Early in June Sapper Company 506A in two parts attacks the province rural-construction group and the American quarters on Võ Tánh street and by the history's count kills scores from Cống Kiều to Trần Quốc Toản street.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 208. The history says the attack avenges the 500 killed at Sơn Mỹ in March. Check: the days of the June attack. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      place: quang-ngai
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-10
      when: May 5–6
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Route 1, Ông Diệu bridge to Phù Mỹ district seat, Bình Định. At dawn the 3d Division of Region 5 (less a regiment), with province and district forces, attacks eight targets along the road. About 11 p.m. May 6 a convoy with air and artillery cover, coming out of Phù Mỹ, runs into the division's ambush; the history counts 32 vehicles burned and over 100 killed. The morning of May 23 two main-force battalions and two local companies attack the Đèo Nhông artillery position and the posts at Gò Lôi and Mồ Côi, drawing the 173d Brigade out to relieve them again.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 208–09. The time is the first act''s, May 5. Check: the clock, whose it is; the end of the May 24 passage, which the page cuts. The figures are the history''s.'
