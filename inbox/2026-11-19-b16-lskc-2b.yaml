      c: Khe Đôn and Sóc Xoài, Tây Ninh. Regiment 16 fights the Americans and by the history's count kills 79 and shoots down three helicopters; it also ambushes three vehicles on the Tây Ninh–Suối Đá road. From Nov. 15 to 20 the division's forces fight many actions at Bàu Bỏ, Bàu Câu, Sóc Kỳ and Cà Tum and by the history's count put nearly 200, mostly Americans, out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 247. See [[cal.1966-11-02.vietnam-hanoi]]. Check: the days of the Bàu Bỏ run. The figures are the history''s.'
