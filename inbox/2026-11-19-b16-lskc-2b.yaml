      date: 1966-10
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Region 8 Party Committee directs its provinces to hold a period of political study on the situation and the new tasks, to harden the will to fight the Americans.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 326. Made public: 2013. Check: the day; the history says "the end of October 1966".'
      tags:
      - polity:drv
      - vis:only:drv
