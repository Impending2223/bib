      when: Apr. 1
      date: '1966-04-01'
      thread: vietnam-struggle
      c: 'Đà Lạt. More than 3,000 rally at the Hòa Bình exhibition ground and march to the American Information Office to demand the Americans leave the city, then to the city hall with three demands: news of the struggle on the radio, a headquarters, protection. The marchers take the radio station and broadcast a declaration of Vietnam''s "ten wants and ten don''ts."'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 140–141. See [[cal.1966-03-28.vietnam-struggle]]. Check: the rally''s day against Mar. 28 and the radio''s hours; the history gives the day alone.'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
