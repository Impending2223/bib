      when: Feb.
      date: 1967-02
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Rạch Kiến post, Long An. Women of Long Cang, Long Định and Phước Vân communes, led by Tư Nhành, gather again and again and march on the post to protest the sweeps and the wild shelling and to demand payment for damage.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 328–29. Check: the day; the history says "February 1967" and "several times".'
      tags:
      - polity:drv
      - polity:rvn
      place: rach-kien
