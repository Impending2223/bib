      when: May 16–20
      date: '1968-05-16'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Tân An and Phú Bình, Bình Thuận. For five days to May 20 Battalion 840 with the local forces stops two sweeps, hurts the Saigon 44th Battalion badly, destroys two M41 tanks and holds the liberated area.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 205. Check: the district; the history gives the two communes only.'
