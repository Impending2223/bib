      c: Núi Lạc and Ngọc Lâm, Phú Yên. Feb. 3 and 4 the defenders stop the Korean and Saigon troops and by the history's count kill 200 more.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 103. See [[cal.1966-01-19.vietnam-hanoi]]. The figures are the history''s.'
