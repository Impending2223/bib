      id: cal.1967-01.vietnam-hanoi-2
      when: Jan.
      date: 1967-01
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cần Đước. In a fight against a sweep a district unit loses a squad, all its weapons and its dead. The history says doubt and reluctance to fight the Americans spread among the belt's forces; the units argue the fight over and conclude that, with the two lines far apart and the fight slow, the Americans massed fire; the answer is to fight close and fast. Battalion 2 of Long An takes up the method.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 328. Check: the day; the page runs on to Battalion 2''s success, with no day.'
      tags:
      - polity:drv
      - polity:us
