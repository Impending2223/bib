      c: Phú Phong hamlet, Hòa Đồng commune. A village guerrilla squad stops five assaults by a Korean Blue Dragon battalion.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 102. See [[cal.1966-01-19.vietnam-hanoi]].'
