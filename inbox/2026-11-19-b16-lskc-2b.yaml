      c: Phú Thọ hamlet, Hòa Đồng. Regiment 10 (less a battalion) beats nine assaults and by the history's count kills 130. That night it raids and destroys a company at Thạnh Phú and routs two others at Thạnh Phú and Phú Phong.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 102–103. See [[cal.1966-01-19.vietnam-hanoi]]. The figures are the history''s.'
