      c: Dầu Tiếng. That night Regiment 2 shells the base a second time and by the history's count kills 300, burns a fuel store of about 12,000 liters, wrecks five helicopters and two 105 mm guns. Westmoreland ended Attleboro Nov. 24 by the history; in the withdrawal the 11th Armored Regiment is hit at Bến Cát and Suối Râm and the 173d Brigade at Dầu Tiếng and Thủ Đức. For the 72 days the history counts 4,500 of the other side out of action, 1,700 Americans, and 65 aircraft shot down or damaged.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 248. See [[cal.1966-11-02.vietnam-hanoi]]. The history says "the night of the 25th". Names: Westmoreland. Check: the clock, whose it is. The figures are the history''s.'
