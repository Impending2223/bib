- add:
    entry:
      id: cal.1967-03-17.vietnam-hanoi
      when: Mar. 17
      date: '1967-03-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tuy An, Đồng Xuân and Sông Cầu, Phú Yên. The Korean Tiger Division opens the Đống Đa operation, a large sweep across the three districts. The history charges that Korean troops kill 532 people in Tuy An district, most of them women, children and old people, burn hundreds of houses, and move over 60,000 into new hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 312. Check: the charge; no record read. The history''s name of the operation as printed.'
      tags:
      - polity:drv
      - polity:rok
      place: tuy-an
- add:
    entry:
      id: cal.1967-03-14.vietnam-hanoi
      when: Mar. 14
      date: '1967-03-14'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Phước Tây, Định Tường. The enemy sets up a special forces camp of five companies under American advisers, which runs twelve commando operations into the surrounding hamlets. In the second half of March, by the history's count, it kills over 500 cadres, guerrillas and supporters and wrecks over 100 houses.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 330. Check: the place, which the history gives as the subsector''s; the count is the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
- add:
    entry:
      id: cal.1967-05-16.vietnam-hanoi
      when: May 16
      date: '1967-05-16'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ông Trợ hill, An Định, Tuy An. That night Sapper Company 202 attacks the Korean-held post by surprise and in half an hour takes it, putting 150 out of action and taking many weapons and stores. The history takes it as the opening of a wider run of attacks in Phú Yên.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 312–13. See [[cal.1967-03-17.vietnam-hanoi]]. The history says "the night of May 16". Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rok
      place: ong-tro
      time_range:
      - 1967-05-16T14:00Z
      - 1967-05-16T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1967-07-17.vietnam-hanoi
      when: July 17
      date: '1967-07-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 4, Cái Bè to Trung Lương, Mỹ Tho. That night 700 mines and charges, laid by two engineer companies of the region, a Mỹ Tho engineer platoon, 37 guerrilla teams and 1,500 civilians, wreck 80 points of the road; the people along it rise in the new hamlets. Two more waves in August follow.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 331. Check: the year, which the page leaves to the dry season 1966–67; the history''s count of mines and men; the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      time_range:
      - 1967-07-17T14:00Z
      - 1967-07-17T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
      place: cai-be
- add:
    entry:
      id: cal.1967-05-16.vietnam-struggle
      when: May 16
      date: '1967-05-16'
      thread: vietnam-struggle
      c: The student Nhất Chi Mai, a Buddhist, burns herself to death on the Buddha's 2,511th birthday (the 8th of the 4th lunar month, Đinh Mùi) to protest the war and ask peace and equality among the religions. The history says it moved tens of thousands and began a Buddhist movement against the Americans and Thiệu and Kỳ; each year on the holiday the students hold a "Nhất Chi Mai" week of demonstrations.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 325. Check: the place, which the history does not give; the day.'
      tags:
      - polity:drv
      - polity:rvn
- add:
    entry:
      id: cal.1967-10.vietnam-hanoi
      when: Oct.
      date: 1967-10
      thread: vietnam-hanoi
      c: The Congress of those determined to defeat the American aggressors throughout the South names 20 officers and men of eastern Nam Bộ Heroes of the People's Armed Forces; the Congress calls Củ Chi "the land of steel."
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 325. Check: the day and the place; the history gives the month alone. "Củ Chi đất thép" as printed.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
