      when: Jan.–Feb.
      date: 1967-01
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ninh Thuận. In January and February the province's forces raid Ninh Chữ port and Thành Sơn airfield and hurt an American military police company at Phan Rang.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 318. Check: the days; the history gives the two months.'
