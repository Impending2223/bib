      c: Pleiku airfield. Sappers raid it; with the raid on the air cavalry base at An Khê the history counts 130 aircraft destroyed or damaged.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 117. The history prints the An Khê raid "the night of Feb. 29", a day 1966 lacks; see the book-check, leads. Check: the figure covers both raids. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: pleiku
- add:
    entry:
      id: cal.1966-04.vietnam-hanoi-4
      when: Apr., late
      date: 1966-04
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The American command ends its first large strategic counteroffensive at the end of April, two months before its plan. By the history's count the dry season of 1965–66 put nearly 67,000 of the other side out of action, hurt 9 American and 7 Saigon battalions, destroyed 940 aircraft, mostly helicopters, and 6,000 military vehicles, 300 of them tanks and armored cars.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 120. Check: the day; the history says "the end of April". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
