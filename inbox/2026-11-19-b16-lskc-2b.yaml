    entry:
      id: cal.1968-01-30.vietnam-tet-19
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Logistics Command 5, Nha Trang. Seven fighters hold the command against nine counterattacks, kill scores, destroy two armored vehicles and die to the last man.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 125. See [[cal.1968-01-29.vietnam-tet-2]]. Check: the day; the history gives none. The figures are the history''s.'
