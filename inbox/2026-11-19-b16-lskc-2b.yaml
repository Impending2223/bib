      when: May 10
      date: '1968-05-10'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Route 21 extended, Đức Trọng. Battalions 186 and 240 move in secretly and attack the hamlets of Thanh Bình and Gia Thạch, north of the district seat.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 205. Check: the result; the page gives none.'
      tags:
      - polity:drv
      - polity:rvn
      place: duc-trong
