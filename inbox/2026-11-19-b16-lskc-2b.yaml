- cite:
    id: cal.1966-01-01.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], IV, 100 (the conference of the fighters who have killed Americans opens a movement to capture Americans alive; the prisoner''s rope handed to the 3d Division''s representative)'
    units: all
- add:
    entry:
      id: cal.1966-01.vietnam-hanoi-2
      when: Jan.
      date: 1966-01
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region 5 sets up a front command for north Bình Định: Giáp Văn Cương, commander of the 3d Division, commands; Trần Quang Khanh, secretary of the Bình Định Party Committee, is its political commissar.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 104. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
      - polity:us
- add:
    entry:
      id: cal.1966-01-19.vietnam-hanoi
      when: Jan. 19
      date: '1966-01-19'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'South Phú Yên. At dawn American, Korean and Saigon forces open an operation along both banks of the Đà Rằng: the Korean Blue Dragon brigade into Hòa Tân, Hòa Bình, Hòa Mỹ, Hòa Đồng and Hòa Thịnh; the Saigon 47th Regiment of the 23d Division on Routes 5 and 7; the 101st Airborne''s brigade by helicopter onto the heights. From Jan. 1 to 15 eight battalions had cleared the communes north of the river.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 101–102. The history has the operation ending late April. Check: the name "Vanbuahem" as printed, and the operation''s American name.'
      tags:
      - polity:drv
      - polity:us
      - polity:rok
      - polity:rvn
      place: tuy-hoa
      time_range:
      - 1966-01-18T22:00Z
      - 1966-01-19T04:00Z
      time_band: morning
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
