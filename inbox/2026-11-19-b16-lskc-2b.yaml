      c: Ông Trợ hill, An Định, Tuy An. That night Sapper Company 202 attacks the Korean-held post by surprise and in half an hour takes it, putting 150 out of action and taking many weapons and stores. The history takes it as the opening of a wider run of attacks in Phú Yên.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 312–13. See [[cal.1967-03-17.vietnam-hanoi]]. The history says "the night of May 16". Check: the clock, whose it is. The figures are the history''s.'
