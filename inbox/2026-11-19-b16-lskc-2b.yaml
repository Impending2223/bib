      place: ta-con
- add:
    entry:
      id: cal.1968-02-17.vietnam-tet-3
      when: Feb. 17
      date: '1968-02-17'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Nam Bộ. The night of Feb. 17 into Feb. 18 the forces attack together 11 provincial towns, 17 district towns and 7 airfields, besides Saigon. Across the country from Feb. 17 the history has the forces attack dozens of cities and provincial towns and hundreds of district seats and bases again.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 156–57. See [[cal.1968-02-17.vietnam-tet-2]]. The history says "the night of the 17th into the 18th". Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
      time_range:
      - 1968-02-17T14:00Z
      - 1968-02-17T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-02-17.vietnam-tet-4
      when: Feb. 17–Mar. 15
      date: '1968-02-17'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Central Highlands. From Feb. 17 to Mar. 15 the forces fight over 100 actions and by the history's count put thousands out of action, mostly Americans. Regiment 95, on Route 19, destroys 145 vehicles in March; Regiment 18 destroys 98 vehicles and shoots down 17 aircraft; Regiment 320 destroys Battalion 4 of the Saigon 45th Regiment north of Buôn Ma Thuột; Battalion 6 of Regiment 24 destroys two companies of the American 173d Airborne Brigade at Kon Tum.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 156. The history gives the span, Feb. 17 to Mar. 15. Check: the days of the Regiment 95, 18, 320 and Battalion 6 actions. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1968-02-17.vietnam-tet-5
      when: Feb. 17
      date: '1968-02-17'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Mỹ Tho. At the second peak the enemy has strengthened the city's defenses, and only part of Battalion 514 gets in, from the southeast, destroying an M113 and a bunker at the Quay bridge and setting a boat afire on the Bảo Định. Regiments 1 and 2 of the region, Feb. 19 to 29, cannot enter the town and fight the counterattacks in the outlying communes of Đạo Thạnh, Mỹ Phong, Thanh Bình and Mỹ Tịnh An.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 157–58. See [[cal.1968-01-29.vietnam-tet-3]]. The history says "the night of Feb. 17". Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: my-tho
      time_range:
      - 1968-02-17T14:00Z
      - 1968-02-17T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-02-18.vietnam-tet-2
      when: Feb. 18
      date: '1968-02-18'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: 'Phan Thiết. Battalion 840 and sapper Company 482 attack the town, the main target of Region 6''s first rank: the Bình Thuận subsector, the police office and the jail. After four days the forces hold some targets and break the jail, freeing 780 prisoners; the enemy counterattacks hard with aircraft and naval guns and shells the center, and the forces move to the outskirts.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 156–57. See [[cal.1968-01-30.vietnam-tet-12]]. Check: the clock, which the history does not give. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      place: phan-thiet
- add:
    entry:
      id: cal.1968-02-18.vietnam-tet-3
      when: Feb. 18
      date: '1968-02-18'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Đà Lạt. Battalion 186 with Company 810 and the Biệt Động team 860 of the province attacks the Political Warfare School, the artillery position and the Đa Thành hamlets and goes on toward the center; at the Kim Thạch–Vạn Kiếp line the 2d Ranger Group stops it. After by the history's count killing hundreds, the force leaves the Kim Thạch area at 9 p.m. Feb. 19. Southwest of the city Battalion 145 (less a company), Company 816 and team 820 take the hamlets of Du Sinh, An Thành and Nam Thiên and shell the subsector and the administrative building, but are held.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 157. See [[cal.1968-01-31.vietnam-tet-16]]. Check: the day of the attack, which the history gives only as the wave of Feb. 17–18; the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
- add:
    entry:
      id: cal.1968-02-21.vietnam-tet
      when: Feb. 21
      date: '1968-02-21'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Đà Lạt. The forward command decides to move most of Battalions 186 and 145 to the countryside, chiefly Đức Trọng district, leaving Company 810 and the commando teams to keep up small attacks and hold the enemy.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 157. See [[cal.1968-02-18.vietnam-tet-3]]. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
      - polity:rvn
      place: dalat
- add:
    entry:
      id: cal.1968-02-18.vietnam-tet-4
      when: Feb. 18
      date: '1968-02-18'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Lộ Tẻ airfield, Cần Thơ. At 1 a.m. a part of the sappers and Battalion 307 of the region attack from the Vòng Cung road, where the forces had held since Feb. 4, destroy 29 aircraft, mostly helicopters, burn a fuel store and a rocket-ammunition store and destroy two trucks. At 8 a.m. they withdraw; the Saigon 42d Ranger Battalion follows to the Rau Răm creek, where Battalion 307 hurts it badly.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 158. See [[cal.1968-01-30.vietnam-tet-15]]. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: lo-te
      time: 1968-02-17T17:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-02-18.vietnam-tet-5
      when: Feb. 18
      date: '1968-02-18'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: An Bình and Long Tuyền, outskirts of Cần Thơ. The enemy sends in Battalion 3 of the American 9th Division's 2d Brigade, three Saigon main-force and security battalions, an M113 troop and aircraft, the first American infantry in a direct fight in the western Nam Bộ. By the history's count the defenders stop them, kill nearly 300 and shoot down 2 aircraft. The morning of Feb. 20 another battalion of the brigade hits their rear and the defenders destroy a company.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 158. See [[cal.1968-02-18.vietnam-tet-4]]. The Feb. 20 action is the same operation. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: can-tho
