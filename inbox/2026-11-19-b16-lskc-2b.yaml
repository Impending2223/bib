    entry:
      id: cal.1968-03-30.vietnam-khe-sanh
      when: Mar. 30
      date: '1968-03-30'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Tà Cơn, post 3. Two American and two Saigon companies, with tanks and artillery, attack the post a second time; after half a day by the history's count 300 of them are killed.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 155. See [[cal.1968-03-28.vietnam-khe-sanh]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
