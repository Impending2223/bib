      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Nam. Five American battalions sweep into the Sơn–Cẩm–Hà base and the hills west of Tam Kỳ and Quế Sơn. After ten days the 2d Division with the local forces and guerrillas has by the history's count killed hundreds; a women's guerrilla squad of Kỳ An commune under its deputy commune chief, Trương Thị Đào, kills 18.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 117. The history gives the ten days from the sweep; the entry runs to about Mar. 1. Check: the end. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: tam-ky
