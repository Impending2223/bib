      id: cal.1966-06-20.vietnam-hanoi
      when: June 20
      date: '1966-06-20'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Route 9–North Quảng Trị Front's command holds an enlarged military-political conference, down to battalion commanders, to carry out the Party Committee's resolution and set out its plan of operations. The front now has the 324th Infantry Division, which had fought in Laos, at the Plain of Jars, Luang Namtha, in 1961–62.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 198–99. See [[cal.1966-06.vietnam-hanoi-3]]. Made public: 2013. The text layer prints the day as "20-6-1966" across a line break.'
