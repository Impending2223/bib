      id: cal.1966-04-04.vietnam-struggle-9
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-struggle
      c: Đà Lạt. Troops and police take back the radio station; the crowd, held off to this day, burns it and withdraws.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 141. See [[cal.1966-04-01.vietnam-struggle]]. The history also has field police and rangers retaking the Hòa Bình market, with no day. Check: the place; the history''s paragraph is on Đà Lạt.'
      tags:
      - polity:drv
      - polity:rvn
      place: dalat
