      when: Feb. 28
      date: '1966-02-28'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tân Kim commune, Cam Lộ, Quảng Trị. A squad of ten under Bùi Ngọc Đủ guards an ammunition dump on a nameless hill by the La La stream, stocked for the coming battle in Quảng Trị. An American battalion with air and artillery support attacks it fifteen times from 7 a.m.; at dark it withdraws, by the history's count leaving nearly 200 dead. Two of the squad are killed.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 119–120. The song "Con suối La La" by Huy Thục is written for it. Check: the clock, whose it is. The figures are the history''s.'
