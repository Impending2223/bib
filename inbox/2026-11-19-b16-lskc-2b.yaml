      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Hiếu Nhơn district town, Hội An. That night Battalion 2 of the province and Company 2 of Hội An attack the troops in the town and by the history's count kill 70, opening the way for the people around to rise.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 305. The history says "the night of the 4th into the 5th". Check: the clock, whose it is. The figures are the history''s.'
