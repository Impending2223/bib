      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Huế, Quảng Trị town, 8 district towns, 12 bases. At dawn infantry, artillery and sappers attack together the targets around Huế and Quảng Trị and the district seats and bases of Trị–Thiên. May 22 Regiment 2 of the 324th Division ambushes a convoy on Route 1 between Mỹ Chánh and Huế and by the history's count puts nearly 100 out of action and burns 16 vehicles. In the last week of May Regiments 6 and 9 of the Region, at A Sầu and A Lưới, hit the 101st Airborne and the Saigon 1st Division.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 214–15. The history gives the 324th Division''s May 22 ambush after Giáp''s cable no. 592B of Apr. 19. Check: the clock, whose it is; the day of the A Sầu and A Lưới actions. The figures are the history''s.'
