      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Hòa Trung post, southeast of Cà Mau town. That night Battalion U Minh II, with secret self-defense men, attacks the post, which guards the town and has over 100 immigrant Catholic families around it; after some hours it has destroyed a security company and a platoon.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 338. Check: the clock, whose it is; the rest of the result, which the page gives past the count read.'
