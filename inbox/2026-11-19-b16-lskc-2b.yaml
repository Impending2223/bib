      when: July 9
      date: '1966-07-09'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: West of Cam Lộ, Route 9. The enemy lands a Saigon ranger battalion by helicopter to retake the lost hills, and a reinforced battalion at Lèn Đất 300 and Lèn Đá 300 north of the road. Battalion 7, in position there, opens fire, kills many and forces them back to the next knob.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 202. See [[cal.1966-06-26.vietnam-hanoi]]. The history goes on, with no day, to a paratroop battalion''s counterattack on hill 402, where Battalion 8 of Regiment 2 puts nearly 100 out of action. The figures are the history''s.'
