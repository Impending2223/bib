- add:
    entry:
      id: cal.1966-06-17.vietnam-saigon
      when: June 17
      date: '1966-06-17'
      thread: vietnam-saigon
      also:
      - vietnam-struggle
      c: 'Kỳ, as chairman of the Central Executive Committee, signs a decree of "economic measures to stabilize the economy": the piaster is devalued and prices rise 100 percent. The history gives the notes in circulation at 18 billion at the end of 1965 and 57 billion by July 1966.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 124. Check: the decree as printed against the Official Gazette; no record read.'
      tags:
      - polity:drv
      - polity:rvn
      place: saigon
- add:
    entry:
      id: cal.1966-04-13.vietnam-hanoi
      when: Apr. 13
      date: '1966-04-13'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Hưng Điền training center, two kilometers northeast of Bến Tre. Mortars west of Châu Thành and Giồng Trôm and by Bến Tre town fire to hold down the enemy artillery; Battalion 516, with a support company and a sapper company, storms the center, where over 400 civil-guard, security and rural-construction men are in training. In an hour by the history's count nearly 300 killed, 98 taken, 200 weapons and nearly two tons of ammunition captured; two inside agents had been won.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 146. The hour is "24 giờ", midnight ending Apr. 13. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      place: ben-tre
      time: 1966-04-13T16:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1966.vietnam-hanoi-3
      when: 1966, mid-year
      date: '1966'
      thread: vietnam-hanoi
      c: Phước Long. The Bà Rá mountain work team is formed, to build Party and political cells among the hill peoples of Phước Hòa, Phước Tín, Sơn Giang and Tú Hiền communes and Phước Long town and to rouse the people against the Saigon administration.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 145. Made public: 2013. Check: the day; the history says "mid-1966".'
      tags:
      - polity:drv
      - vis:only:drv
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1966-10-26.vietnam-hanoi
      when: Oct. 26
      date: '1966-10-26'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cái Đuốc post, Chương Thiện. Battalion 306 attacks and destroys it, putting a security company and a Civil Guard platoon out of action, then withdraws to the Ba Quân canal and Ngã Cay as reserve for Battalion 303, which is to ambush any retaking. At noon, after artillery and air strikes, helicopters land the Saigon 21st Division's Regiment 33 on the ground held by Regiment 1's offices and Battalion 306. At 6 p.m. Battalion 306 in two thrusts destroys Regiment 33's command post and hurts a battalion badly; at 10 p.m. Battalions 306 and 303 destroy another main-force battalion at the Ba Quân canal.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 334–35. Check: the clock, whose it is; the province, which the history gives only as the region''s main effort. The result is the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-place
      time: 1966-10-26T04:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
