      also:
      - vietnam-operations
      c: Hòa Thịnh. The attacks go on to Feb. 9 at Mỹ Cảnh, Bến Đá and Suối Phẫu; by the history's count 230 American and 60 Korean troops killed.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 103. See [[cal.1966-02-06.vietnam-hanoi]]. The history says "Feb. 7 and 9". The figures are the history''s.'
