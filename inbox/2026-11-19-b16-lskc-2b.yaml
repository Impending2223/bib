      when: Nov. 3–5
      date: '1966-11-03'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Trảng Tranh, northwest of Bàu Gòn, Tây Ninh. At 9 a.m. the Americans land a part of the 196th Brigade 500 meters from the Dương Minh Châu base and beside the 9th Division's forward command post; the division's guard and scout platoon is sent out. The night of Nov. 3–4 the division's guns hit command posts at Gò Dầu, Bàu Đồn, Trảng Bàng and Trâm Vàng and the 196th Brigade's at Trảng Lớn. The morning of Nov. 4 two more battalions land northwest of Bàu Gòn and with the first attack Battalion 9 of Regiment 16 from two sides; the battalion holds in its works. Nov. 5 a battalion of the 25th Division's 2d Brigade lands at Trảng Dài. By the history's count three American battalions are hurt by the end of Nov. 5 and a battalion commander killed.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 243–44. See [[cal.1966-11-02.vietnam-hanoi]]. The time is the first day''s. Check: the clock, whose it is. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      place: tay-ninh
      time: 1966-11-03T01:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
