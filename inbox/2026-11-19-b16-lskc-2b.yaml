      c: Xuân Sơn. Regiment 12 attacks without warning and destroys a mixed American force of two artillery and two infantry companies.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 308. See [[cal.1966-12-17.vietnam-hanoi]].'
