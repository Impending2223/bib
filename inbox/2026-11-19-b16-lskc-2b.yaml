      when: Apr. 15
      date: '1968-04-15'
      thread: vietnam-khe-sanh
      also:
      - vietnam-hanoi
      c: Post 622. Battalion 8 of Regiment 66, in a favorable position, raids two American companies by surprise and by the history's count puts over 100 of the air cavalry out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 220. See [[cal.1968-04-05.vietnam-khe-sanh]]. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
