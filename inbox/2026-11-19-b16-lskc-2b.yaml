      when: Apr. 21
      date: '1966-04-21'
      thread: vietnam-struggle
      c: Four pupils are shot dead; tens of thousands march at once. Pupils and youth hold "sleepless nights," camp fires and a war-crimes trial; at Blao, Buôn Ma Thuột, Phan Thiết and Phan Rang workers strike in support.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 141. See [[cal.1966-04-01.vietnam-struggle]]. Check: the place, which the history''s Đà Lạt paragraph suggests; and who fired.'
