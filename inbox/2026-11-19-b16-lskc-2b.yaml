      c: Khe Chùa and the line Ba De, Cù Đinh to Đá May, Route 9. The morning two battalions of the American 5th Marines land and form a defensive line; the Saigon airborne group, from Cùa, lands at Khe Vạn and Làng Đôn, 10 kilometers west of Tân Lâm, to close with the Marines two arms on the north of Route 9.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 208. See [[cal.1966-07-17.vietnam-hanoi]]. Check: the clock, whose it is.'
