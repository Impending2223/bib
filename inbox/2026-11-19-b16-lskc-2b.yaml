      when: Apr. 24
      date: '1966-04-24'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Pleiku airfield. Sappers raid it; with the raid on the air cavalry base at An Khê the history counts 130 aircraft destroyed or damaged.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 117. The history prints the An Khê raid "the night of Feb. 29", a day 1966 lacks; see the book-check, leads. Check: the figure covers both raids. The figures are the history''s.'
