      when: Dec. 27
      date: '1966-12-27'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Điện Bàn, Quảng Nam. The Võ Như Hưng suicide youth team ambushes a sweep by two companies and destroys two tanks.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 304. Check: the side of the companies; the history says "the enemy".'
