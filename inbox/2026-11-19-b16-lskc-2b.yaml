      c: Hill 314. The American 3d Battalion, Marines, with air and artillery, attacks in two columns the hill held by a battalion of the defenders; by the history's count two companies cannot "climb the slope" on the first day and are carried back. The afternoon, under 82 mm fire, the Saigon airborne group, which had stood in place, withdraws to Cùa.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 208–09. See [[cal.1966-07-22.vietnam-hanoi]]. The history quotes AP, July 25, on a company with 71 wounded, nearly half. Check: the clock, whose it is.'
