      id: cal.1968-05-05.vietnam-may-offensive-3
      when: May 5–8
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Mỹ Tho and Gò Công. In the offensive's first week the province's Battalion 263 with Region sapper Companies 312 and 314 attacks the Hùng Vương training base and by the history's count puts nearly 500 out of action. Battalion 514C, north of Cái Bè, destroys the Hộ Cư, Hậu Mỹ and Mỹ Thiên posts; the city's commandos take the American quarters, a police post and the Armored Regiment 6 base; guerrillas of Bình Trưng, Long Hưng and Song Thuận shoot down three helicopters. At Gò Công Battalion 514B destroys the Sơn Quy post and May 8 fights counterattacks at Bình Lạc, Bình Phú, Bình Nho and Bình Thọ.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 197. See [[cal.1968-05-05.vietnam]]. Check: the days; the history gives "the first week". The figures are the history''s.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      place: my-tho
- add:
    entry:
      id: cal.1968-06-29.vietnam-may-offensive
      when: June 29
      date: '1968-06-29'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Bến Lức bridge, Route 4. A three-man sapper team of the Region under Tư Cường, which had failed on June 20 and 28 to get the charge to the footing, at 11:30 p.m. puts a 1,000 kg charge under the bridge. At 12:30 a.m. June 30 spans 5 and 6 fall and the Saigon platoon guarding it is wiped out. The history calls the cutting of Route 4 a great blow to the enemy and a help to the second wave.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 196–97. The team''s names are Dương, Trung and Bảy. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:rvn
      place: ben-luc
      time: 1968-06-29T15:30Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-7
      when: May 5
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Cống Đá post, Thạnh Trị district, Sóc Trăng. The district forces besiege and destroy the post; a party ambushes the security company sent from the district seat to relieve it and hurts it badly.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 202. Check: the province; the history gives the district only. The figures are the history''s.'
      tags:
      - polity:drv
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1968-05-05.vietnam-may-offensive-8
      when: May 5–11
      date: '1968-05-05'
      thread: vietnam-may-offensive
      also:
      - vietnam-hanoi
      c: Chợ Lầu town, northern Bình Thuận. At dawn Company 440 of the province takes the town and destroys a security and a civil-guard platoon. The afternoon of May 7 it ambushes a security company coming to relieve the town and hurts it badly; at 3 p.m. that day four ranger companies from Lương Sơn in three columns try to surprise it. May 8 Battalion 840 sends a company to take Lâm Lộc hamlet and spread to Long Lễ and Hội Tân. May 11 the American command sends Battalion 3 of the 1st Air Cavalry Brigade and Battalion 3 of the Saigon 44th Regiment from Phan Thiết to relieve Lâm Lộc and Phan Rí.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 204. The time is the first act''s, May 5. Check: the clock, whose it is; the Americans'' unit as the history prints it.'
      tags:
      - polity:drv
      - polity:us
      - polity:rvn
      - ok:fields-time
