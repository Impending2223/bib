      when: Nov. 24
      date: '1964-11-24'
      thread: vietnam
      c: Westmoreland to Taylor, a memorandum on the military situation. Sustained bombing of the North to wait until the
        government in Saigon stands "on a reasonably firm political, military, and psychological base before we risk the great
        strains that may be incurred"; at least to the turn of the year, perhaps to the spring. He is not a party "to the
        thought that this country is despondent at this juncture."
      n: '[FRUS 1964–68, I, doc. 428](https://history.state.gov/historicaldocuments/frus1964-68v01/d428) n.2 (the memorandum
        and its date). [[w.westmoreland-soldier-reports]], 111–12 (its argument). Check: that the words Westmoreland quotes
        are the memorandum''s; he says only that he told Taylor. To check: Westmoreland to Taylor, Nov. 24, 1964, *Declassified
        Documents*, 1977, 278E (cited by FRUS 1964–68, I, doc. 428 n.2). Names: Westmoreland, Taylor.'
