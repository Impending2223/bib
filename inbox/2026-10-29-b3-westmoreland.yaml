      id: cal.1968-03-24.vietnam-205000
      when: Mar. 24
      date: '1968-03-24'
      thread: vietnam-205000
      c: 'Clark Air Base, the Philippines, in secret. Wheeler to Westmoreland: "The President says very bluntly that he does
        not have the horses to change our strategy"; a large call-up of reserves and contesting the enemy''s widening of the
        war politically infeasible. Westmoreland keeps the 82d Airborne''s brigade, a mechanized brigade to replace the Marine
        regiment, 23,000 support troops, a ceiling of 549,000, and 13,500 South Vietnamese civilians. Wheeler: McNamara had
        recommended Westmoreland for Chief of Staff in mid-January.'
      n: '[[w.westmoreland-soldier-reports]], 358–59, 361 (the meeting; the decision; the appointment). See [[cal.1968-03-10.vietnam]].
        Names: Wheeler, Westmoreland, Johnson, McNamara.'
