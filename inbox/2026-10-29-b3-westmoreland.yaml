      when: Jan. 6
      date: '1965-01-06'
      thread: vietnam
      c: 'Taylor to Johnson, Saigon 2052 to 2058, five sections, answering his CAP 64375 of Dec. 30: "We are faced here with
        a seriously deteriorating situation." Graduated air attacks on the North the one course with a chance of success;
        "to take no positive action now is to accept defeat in the fairly near future." Dependents to stay for now; guarding
        American installations with American troops would take 34 battalion equivalents, some 75,000 men. Section V, Westmoreland''s
        analysis, Taylor concurring: of three ways to bring in American ground forces, none recommended now.'
      n: '[FRUS 1964–68, II, doc. 9](https://history.state.gov/historicaldocuments/frus1964-68v02/d9), [doc. 10](https://history.state.gov/historicaldocuments/frus1964-68v02/d10),
        [doc. 11](https://history.state.gov/historicaldocuments/frus1964-68v02/d11), [doc. 13](https://history.state.gov/historicaldocuments/frus1964-68v02/d13);
        Johnson''s cable, [FRUS 1964–68, I, doc. 477](https://history.state.gov/historicaldocuments/frus1964-68v01/d477).
        [[w.westmoreland-soldier-reports]], 113–14 (the reply framed with Alexis Johnson and Westmoreland). See [[cal.1964-12-24.vietnam]].
        Names: Taylor, Johnson, Westmoreland, U. Alexis Johnson.'
