      id: cal.1968-02-03.vietnam-khe-sanh
      when: Feb. 3
      date: '1968-02-03'
      thread: vietnam-khe-sanh
      c: 'Wheeler to Johnson, CM-2944-68, after Johnson''s telephone call of the evening before: Westmoreland''s answer on
        reinforcing Khe Sanh. Not Dien Bien Phu: the air, the heavy artillery east of the mountains, supply by air and helicopter.
        Four Marine battalions and a ranger battalion at Khe Sanh; two brigades of the 1st Cavalry and one of the 101st Airborne
        north of the Hải Vân Pass. Wanted: another squadron of C-130s, a second alerted, heavy air-drop equipment in reserve.
        Tactical nuclear weapons not required now; should the situation at the DMZ change dramatically, they or chemical agents
        "active candidates."'
      n: '[FRUS 1964–68, VI, doc. 51](https://history.state.gov/historicaldocuments/frus1964-68v06/d51). [[w.westmoreland-soldier-reports]],
        350 (the question; the C-130s and air-drop equipment). Check: Westmoreland dates the call Feb. 3 (350); Wheeler''s
        memorandum of Feb. 3 puts it the evening before. Names: Wheeler, Johnson, Westmoreland.'
