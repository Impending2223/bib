      id: cal.1964-02.republican-party-2
      when: Feb.
      date: 1964-02
      thread: republican-party
      also:
      - vietnam
      c: Nixon in South Vietnam, on a trip for Pepsi-Cola, by Westmoreland's account. Lodge, his running mate of 1960, orders
        no official honors for him and no air transport for the press; Westmoreland takes him by helicopter to a secure hamlet
        near Saigon, the reporters there before them by taxi.
      n: '[[w.westmoreland-soldier-reports]], 67. Check: the month. Names: Nixon, Lodge, Westmoreland.'
