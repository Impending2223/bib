      when: Feb. 11
      date: '1968-02-11'
      thread: vietnam-khe-sanh
      c: 'JCS 1690 to CINCPAC: the contingency planning for nuclear weapons at Khe Sanh ended, on Johnson''s order. Westmoreland,
        by his account, had set up a small secret group to study their use there; told to desist.'
      n: '[FRUS 1964–68, VI, doc. 51](https://history.state.gov/historicaldocuments/frus1964-68v06/d51) n.5 (the order). [[w.westmoreland-soldier-reports]],
        338 (the study group). Check: the day Westmoreland was told; he gives none. See [[cal.1968-02-01.vietnam-khe-sanh]].
        Names: Johnson, Westmoreland.'
