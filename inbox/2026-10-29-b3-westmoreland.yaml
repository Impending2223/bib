      when: Feb. 3
      date: '1968-02-03'
      thread: vietnam-tet
      c: 'Westmoreland''s press conference in Saigon, Johnson having suggested daily ones. Asked whether Khe Sanh is a diversion
        for an attack on Saigon: each, he answers, a diversion for the other, the enemy''s plan a concerted, country-wide
        effort.'
      n: '[[w.westmoreland-soldier-reports]], 351. Names: Westmoreland, Johnson.'
