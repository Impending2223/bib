    entry:
      id: cal.1965-05-08.vietnam-force-levels
      when: May 8
      date: '1965-05-08'
      thread: vietnam-force-levels
      c: 'Westmoreland sends Washington his concept for the American units: first, secure the base areas, operating to the
        range of light artillery; then offensive operations and deep patrolling with the South Vietnamese; then a reserve
        for them and long-range offensive operations, from bases inland. A battalion asked for Cam Ranh Bay. Taylor approves
        the concept.'
      n: '[[w.westmoreland-soldier-reports]], 135. Names: Westmoreland, Taylor.'
      src:
        c: fcf02d24
        rows:
        - 'w.westmoreland-soldier-reports 135: all'
      tags:
      - name:westmoreland-william
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1965-06-24.vietnam-force-levels
      when: June 24
      date: '1965-06-24'
      thread: vietnam-force-levels
      c: 'Westmoreland to Wheeler, MAC 3240, answering JCS 2331 of June 22: "we are in for the long pull"; "The struggle has
        become a war of attrition." Short of nuclear weapons, no quick end. American forces must go in, in numbers, to carry
        the war to the enemy; 10,000 men would give no chance of winning, and nothing obliges the Americans to be cast as
        the French.'
      n: '[FRUS 1964–68, III, doc. 17](https://history.state.gov/historicaldocuments/frus1964-68v03/d17). [[w.westmoreland-soldier-reports]],
        140 (the long pull). Check: Westmoreland dates the message mid-June (140). See [[cal.1965-06-07.vietnam]]. Names:
        Westmoreland, Wheeler.'
      src:
        c: 7587c104
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d17: all'
        - 'w.westmoreland-soldier-reports 140: A'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
- add:
    entry:
      id: cal.1965-06-30.vietnam-force-levels
      when: June 30
      date: '1965-06-30'
      thread: vietnam-force-levels
      c: 'Westmoreland to Wheeler, MAC 3320, answering JCS 2400 of June 28, the President''s question: will thirty-four American
        and ten third-country battalions convince Hanoi and the Viet Cong they cannot win? "The direct answer to your basic
        question is ''no.''" The force should restore the military balance by the end of December, not make the enemy back
        off; he holds to the forty-four battalions.'
      n: '[FRUS 1964–68, III, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v03/d31). [[w.westmoreland-soldier-reports]],
        141 (the President''s query; the answer). See [[cal.1965-06-07.vietnam]]. Names: Westmoreland, Wheeler.'
      src:
        c: 98bad8a6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d31: all'
        - 'w.westmoreland-soldier-reports 141: A-C'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
