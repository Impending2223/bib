- add:
    entry:
      id: cal.1968-10-14.vietnam-paris
      when: Oct. 14
      date: '1968-10-14'
      thread: vietnam-paris
      c: 'The Cabinet Room, 1:38 to 3:40 p.m.: Johnson with Rusk, Clifford, the Joint Chiefs, Russell and, from 3:15, Westmoreland,
        on a halt to the bombing of the North. Clifford: the risk "minor"; McConnell: "If you are to stop bombing, NOW is
        the time to do it"; Russell: "It will be hard to resume." Westmoreland: the Communists "may erode this agreement";
        "Abrams'' approach is very practical. I see no problem"; "Militarily, the enemy is BANKRUPT." Johnson will not go
        ahead unless both Secretaries and all the Joint Chiefs support it.'
      n: '[FRUS 1964–68, VII, doc. 69](https://history.state.gov/historicaldocuments/frus1964-68v07/d69). [[w.westmoreland-soldier-reports]],
        384 (the meeting; Russell, Moorer and Westmoreland skeptical). Check: Westmoreland recalls telling the meeting the
        halt traded "an important military asset" for "a questionable political result" (384); the notes FRUS prints do not
        have it. See [[cal.1968-10-14.vietnam]]. Names: Johnson, Rusk, Clifford, Russell, Westmoreland, McConnell, Abrams.'
      src:
        c: 08abc1d8
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d69: all'
        - 'w.westmoreland-soldier-reports 384: A, E'
