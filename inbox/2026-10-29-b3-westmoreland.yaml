      thread: vietnam
      c: 'Cam Ranh Bay, 9:50 a.m., Johnson on his way from Khorat to Rome. To the senior unit commanders: "We are not going
        to yield. We are not going to shimmy. We are going to wind up with a peace with honor." To the troops, Kỳ, Westmoreland
        and Bunker there: an Oak Leaf Cluster to Westmoreland''s Distinguished Service Medal; the medal to Abrams, Palmer,
        Momyer and Cushman among others; the Medal of Freedom to Bunker, Locke and Komer.'
