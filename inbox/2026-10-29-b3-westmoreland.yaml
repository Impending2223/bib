      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-06-27.vietnam-operations
      when: June 27
      date: '1965-06-27'
      thread: vietnam-operations
      c: 'War Zone D. The 173d Airborne Brigade, two battalions, with the Australian battalion, a South Vietnamese regiment
        and two airborne battalions, in a three-day sweep: the first entry in years by any but Communist troops; several sharp
        engagements with the Viet Cong.'
      n: '[[w.westmoreland-soldier-reports]], 141.'
      src:
        c: af2386d8
        rows:
        - 'w.westmoreland-soldier-reports 141: all'
