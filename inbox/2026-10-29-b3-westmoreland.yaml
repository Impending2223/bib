- add:
    entry:
      id: cal.1968-03.vietnam-khe-sanh
      when: Mar.
      date: 1968-03
      thread: vietnam-khe-sanh
      c: 'Westmoreland makes Momyer, his deputy for air, single manager of tactical air in the northern provinces, the Marines''
        fixed-wing aircraft included: several systems in one region a "dog''s breakfast," as he cables Wheeler. The Commandant
        makes it a doctrinal issue in the Joint Chiefs; Harold Johnson does not back Westmoreland; Sharp does. By Westmoreland''s
        account, the one issue over which he thought of resigning.'
      n: '[[w.westmoreland-soldier-reports]], 342–44. Check: the day of the order and of the cables. Names: Westmoreland,
        Wheeler, Harold Johnson, Sharp.'
      src:
        c: f361f7e6
        rows:
        - 'w.westmoreland-soldier-reports 342–44: all'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
      - name:johnson-harold-k
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1968-05.vietnam
      when: May
      date: 1968-05
      thread: vietnam
      c: 'Washington. Westmoreland to Johnson: the South Vietnamese forces short of M-16s, the Defense Department not having
        contracted for them in bulk. Johnson, by Westmoreland''s account, had not known; he will "knock heads together."'
      n: '[[w.westmoreland-soldier-reports]], 158–59. Check: the month; Westmoreland was in Washington Apr. 6–7. Names: Westmoreland,
        Johnson.'
      src:
        c: ef2f6d07
        rows:
        - 'w.westmoreland-soldier-reports 158–59: all'
      tags:
      - name:westmoreland-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-10-31.vietnam-paris
      when: Oct. 31
      date: '1968-10-31'
      thread: vietnam-paris
      c: 'The National Security Council, its 593d meeting, 6:40 to 6:50 p.m.: Johnson will order the bombing of the North
        stopped at 8 a.m. tomorrow. The Chiefs, Westmoreland, and Abrams, called back quietly, for it; Johnson reads their
        words, Westmoreland''s: "But if the rules of engagement as suggested here are adopted, I see no problem." Asked one
        by one, everyone agrees. After, Johnson to Westmoreland: he had Abrams come to say it to his face.'
      n: '[FRUS 1964–68, VII, doc. 167](https://history.state.gov/historicaldocuments/frus1964-68v07/d167). [[w.westmoreland-soldier-reports]],
        384–85 (the meeting; the poll). Check: Westmoreland recalls sitting along the wall with the Chiefs, Wheeler excepted,
        and not being asked (384–85). See [[cal.1968-10-14.vietnam]]. Names: Johnson, Westmoreland, Abrams.'
      src:
        c: 23b00c83
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d167: all'
        - 'w.westmoreland-soldier-reports 384–85: A, D'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:abrams-creighton
