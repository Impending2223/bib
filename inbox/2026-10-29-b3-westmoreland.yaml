        Papers, History Backup, LBJ Library (cited by FRUS 1964–68, I, doc. 471 n.2). See [[cal.1964-12-22.vietnam]]. Names:
        Throckmorton, Westmoreland, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu, Taylor, Nguyễn Khánh, Trần Văn Hương.'
