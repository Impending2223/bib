- edit:
    id: cal.1965-02-07.vietnam
    base: b637127c
    set:
      n: 'Statement by the President Upon Ordering Withdrawal of American Dependents From South Viet-Nam, [1965 Pub. Papers
        153](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=229) (Feb. 7, 1965). FRUS 1964–68,
        II, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v02/d76), [77](https://history.state.gov/historicaldocuments/frus1964-68v02/d77),
        [78](https://history.state.gov/historicaldocuments/frus1964-68v02/d78), [79](https://history.state.gov/historicaldocuments/frus1964-68v02/d79),
        [80](https://history.state.gov/historicaldocuments/frus1964-68v02/d80), [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87).
        [[w.gibbons-u-s-government-and]], III, 60–64 (the attack; Bundy and Taylor for reprisal; the NSC, Feb. 6; four barracks,
        one struck); [[w.staaveren-gradual-failure]], 9–18; [[w.frankum-like-rolling-thunder]], 15–17 (the attack on Camp
        Holloway; Flaming Dart, Đồng Hới struck, the rest weathered out; Chấp Lễ, Feb. 8); [[w.vietnam-victory-in-vietnam]],
        142–43 (the attack on the airfield and Camp Holloway; Flaming Dart on Hồ Xá and Đồng Hới, 143); [[w.drea-mcnamara-clifford-and-the-2011]],
        56 (the attack; Bundy and Taylor for reprisal; the President''s approval the evening of Feb. 6; one barracks hit,
        the rest weathered out; the next day''s strikes); [[w.cosmas-joint-chiefs-of-staff-2012]], 213–214 (the attack; the
        recommendation; the NSC; the dependents); [[w.marolda-united-states-navy-and]], 495–97 (the attack; the reprisal authorized;
        Flaming Dart; Chấp Lễ; the dependents); [[w.anthony-war-in-northern-laos]], 156 (the attack, 7 killed and 109 wounded;
        the recommendation; the NSC''s approval); [[w.nguyen-hanois-war]], 74–75 (the attack); [[w.asselin-hanois-road-to-the]],
        206 (the same); [[w.johnson-vantage-point]], 124–26 (the reprisal approved, one target struck, the others weathered
        in; the dependents ordered home); [[w.dallek-flawed-giant]], 247–48 (eight advisers killed, 247; one of four targets
        hit, 248). [[w.logevall-choosing-war]], 324–27 (the attack, 8 killed and 126 wounded, ten aircraft destroyed, 324;
        Bundy''s call; the NSC of Feb. 6, the four targets; the dependents, 327); [[w.moyar-triumph-forsaken]], 353 (seven
        Americans killed, more than a hundred wounded, twenty-five aircraft hit; the NSC; Flaming Dart against Đồng Hới).
        [[w.westmoreland-soldier-reports]], 115–16, 118 (the attack; Bundy, Taylor and U. Alexis Johnson in Westmoreland''s
        operations room, Bundy''s call to the White House; Westmoreland, Bundy and Khánh at Pleiku; the strikes on Đồng Hới,
        and Chấp Lễ the next day; the dependents). To check: [[w.pentagon-papers]]; [[w.kahin-intervention]]; [[w.berman-planning-a-tragedy]];
        [[w.khong-analogies-at-war]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]];
        [[w.goldstein-lessons-in-disaster]]; [[w.gardner-pay-any-price]]; [[w.kaiser-american-tragedy]]; [[w.thompson-rolling-thunder]];
        [[w.clodfelter-limits-of-air-power]]; [[w.pribbenow-rolling-thunder-and-linebacker]]; [[w.mcnamara-in-retrospect]];
        [[w.taylor-swords-and-plowshares]]; [[w.cooper-lost-crusade]]; [[w.bird-color-of-truth]]; [[w.westmoreland-soldier-reports]];
        Jacob Van Staaveren, USAF Plans and Operations in Southeast Asia, 1965 (Washington, 1966), pp 6-7 (cited by [[w.anthony-war-in-northern-laos]],
        156 n.83); Report of Investigation, Pleiku Incident, by Board of Officers to Investigate Incident at MACV Compound
        and Camp Holloway, Pleiku, RVN, Maj Gen Milton B. Adams, USAF, President, 16 Feb 65 (cited by [[w.staaveren-gradual-failure]],
        9 n.1a); Transcript of News Conference by McNamara and Ball on Air Strike in VN, Wash Post, 8 Feb 65 (cited by [[w.staaveren-gradual-failure]],
        9 n.1b); Hist, CINCPAC, 1965, Vol II, pp 317-18 (cited by [[w.staaveren-gradual-failure]], 12 n.5a); CINCPACFLT rpt,
        The United States Navy in the Pacific, 1965, pp 13-14 (cited by [[w.staaveren-gradual-failure]], 12 n.5b); New York
        Times, Feb 11, 65 (cited by [[w.staaveren-gradual-failure]], 12 n.5c); Project CHECO Team, Rolling Thunder (Proj CHECO,
        1966), pp 8-9 (cited by [[w.staaveren-gradual-failure]], 16 n.12); Rolling Thunder (Proj CHECO, 1966) (cited by [[w.staaveren-gradual-failure]],
        17 n.13a); hist, CINCPAC, 1965, Vol II, pp 319-20 (cited by [[w.staaveren-gradual-failure]], 17 n.13b); Hq USAF rpt,
        Analysis of Air Operations, Southeast Asia, 26 Mar 65, Vol I, pp 3-1 to 3-10 (cited by [[w.staaveren-gradual-failure]],
        17 n.13c); Msg, JCS to CINCPAC, COMUSMACV, 071459Z Feb 65 (cited by [[w.staaveren-gradual-failure]], 18 n.15a); Hq
        USAF rpt, Analysis of Air Operations, Southeast Asia, Vol I, pp 3-1 to 3-10 (cited by [[w.staaveren-gradual-failure]],
        18 n.15b); hist, CINCPAC, 1965, Vol II, p 321 (cited by [[w.staaveren-gradual-failure]], 18 n.15c); SEA CHECO Team,
        "Rolling Thunder—March–June 1965—Continuing Report" (Mar. 28, 1966), 4-13 (cited by [[w.frankum-like-rolling-thunder]],
        15 n.2, for the targets); Bundy to Johnson, Feb. 7, 1965 ([FRUS 1964–68, II, doc. 84](https://history.state.gov/historicaldocuments/frus1964-68v02/d84));
        William P. Bundy, manuscript history of the Vietnam War, chap. 22B, pp. 5–6, LBJ Library (cited by [[w.dallek-flawed-giant]],
        247); 52d Aviation Battalion, "Camp Holloway Attack Narrative," Feb. 12, 1965, MHI, Harold K. Johnson Papers, box
        35 (cited by [[w.moyar-triumph-forsaken]], 353 n.14). See [[cal.1964-11-01.vietnam]]; [[cal.1964-12-24.vietnam]];
        [[cal.1965-01-27.vietnam]]. Check: Frankum, 15, gives 8 Americans killed, 128 wounded; Cosmas, 213, 8 killed, 108
        wounded, 20 aircraft damaged or destroyed. Check: Marolda, 495, gives eight killed and 109 wounded. Names: McGeorge
        Bundy, Taylor, Johnson. Check: *Victory in Vietnam* credits the 409th Sapper Battalion: 100 killed and 20 aircraft
        destroyed (142). Check: Asselin, 206, has a Special Forces camp attacked, eight Americans killed, more than a hundred
        wounded. Check: Johnson gives eight Americans killed outright and one later, more than a hundred wounded, five aircraft
        destroyed and fifteen damaged; the NSC met at 7:45 p.m., Feb. 6 (124). Check: Van Staaveren, 9, gives one American
        killed and twenty-four wounded at the advisers'' compound, seven killed and 104 wounded at Camp Holloway. Check: Gibbons,
        III, 60, gives eight Americans killed and 60 or more wounded. Check: Westmoreland gives eight Americans killed and
        five aircraft destroyed (115).'
