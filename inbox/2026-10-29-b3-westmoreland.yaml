      c: 'Detroit, the Veterans of Foreign Wars. Nixon, passing Johnson''s car on the road from the airport, telephones him:
        he has given the veterans "a real hard line" on Vietnam. Johnson: "Congratulations"; he means to do the same. By Westmoreland''s
        account, riding with Johnson.'
      n: '[[w.westmoreland-soldier-reports]], 383. Check: the day; Westmoreland gives late summer. See [[cal.1968-08-19.vietnam-paris]].
