- add:
    entry:
      id: cal.1964-08-28.laos
      when: Aug. 28
      date: '1964-08-28'
      thread: laos
      also:
      - vietnam
      c: 'Westmoreland to Taylor, against Sullivan''s concept for the Laotian panhandle: the Lao air force''s capacity against
        the twenty-two infiltration targets "negligible"; he urges attacks by the South Vietnamese air force and Farmgate,
        154 sorties on six targets, and asks approval of combined American–South Vietnamese planning. Washington demurs, by
        his account.'
      n: '[FRUS 1964–68, XXVIII, doc. 128](https://history.state.gov/historicaldocuments/frus1964-68v28/d128). [[w.westmoreland-soldier-reports]],
        110 (the request and Washington''s answer). Names: Westmoreland, Taylor, Sullivan.'
      src:
        c: 29869fb3
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d128: A-B'
        - 'w.westmoreland-soldier-reports 110: B-C'
      tags:
      - name:westmoreland-william
      - name:taylor-maxwell
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1964-09-20.vietnam
      when: Sept. 20
      date: '1964-09-20'
      thread: vietnam
      c: 'Rhade tribesmen in four CIDG camps near Ban Mê Thuột revolt at midnight, Sept. 19: they disarm their American Special
        Forces advisers, kill seventy-three South Vietnamese soldiers, take hostages, and some 2,000 march on the town and
        take its radio station. The 23d Division blocks the roads. Y Bham, of the new FULRO, disappears, by Westmoreland''s
        account toward Cambodia.'
      n: '[[w.westmoreland-soldier-reports]], 78–79.'
      src:
        c: fb728b50
        rows:
        - 'w.westmoreland-soldier-reports 78–79: all'
      tags:
      - place:ban-me-thuot
- add:
    entry:
      id: cal.1964-09-27.vietnam
      when: Sept. 27
      date: '1964-09-27'
      thread: vietnam
      c: Bon Sar Pa, the last camp holding out. Westmoreland, by his account, telephones Khánh at Dalat in the night to call
        off the attack Khánh has ordered for the morning; Khánh countermands it. The American advisers leave the camp; Khánh
        flies there, and the Montagnards surrender their arms.
      n: '[[w.westmoreland-soldier-reports]], 80–81. See [[cal.1964-09-20.vietnam]]. Names: Westmoreland, Nguyễn Khánh.'
      src:
        c: bf081532
        rows:
        - 'w.westmoreland-soldier-reports 80–81: all'
      tags:
      - name:westmoreland-william
      - name:nguyen-khanh
      - place:dalat
- add:
    entry:
      id: cal.1964-11.vietnam-saigon
      when: Nov., late
      date: 1964-11
      thread: vietnam-saigon
      c: 'Kỳ to Westmoreland, in Westmoreland''s office, by Westmoreland''s account: Khánh must go, the commanders having
        lost confidence in him. Told that Washington will back no change but by orderly and legal process, Kỳ will wait three
        months; his choice to succeed Khánh, Thiệu. Westmoreland reports the talk to Taylor and to Washington.'
      n: '[[w.westmoreland-soldier-reports]], 92–93. Names: Nguyễn Cao Kỳ, Westmoreland, Nguyễn Khánh, Nguyễn Văn Thiệu, Taylor.'
      src:
        c: 2db1ea23
        rows:
        - 'w.westmoreland-soldier-reports 92–93: all'
      tags:
      - name:nguyen-cao-ky
      - name:westmoreland-william
      - name:nguyen-khanh
      - name:nguyen-van-thieu
      - name:taylor-maxwell
      - place:saigon
- add:
    entry:
      id: cal.1964-12-08.vietnam-saigon
      when: Dec. 8
      date: '1964-12-08'
      thread: vietnam-saigon
      c: 'Westmoreland''s dinner at his villa for some twenty senior South Vietnamese commanders, Thiệu and Kỳ among them,
        at Taylor''s wish. Taylor, in French: the recent disorders have "completely dismayed the staunchest friends of South
        Vietnam"; political stability "crucial" to any more aid. The generals give an implied pledge to work in harmony.'
      n: '[[w.westmoreland-soldier-reports]], 93. Names: Westmoreland, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Taylor.'
      src:
        c: 657e76b2
        rows:
        - 'w.westmoreland-soldier-reports 93: all'
      tags:
      - name:westmoreland-william
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
      - name:taylor-maxwell
      - place:saigon
- add:
    entry:
      id: cal.1964-12.vietnam-2
      when: Dec.
      date: 1964-12
      thread: vietnam
      c: 'Westmoreland in Washington after his father''s funeral in South Carolina, by his account: a conference with the
        Joint Chiefs, none with Johnson or McNamara. Vance belittles his need for more military police, then relents. LeMay
        upbraids him for his use of air power.'
      n: '[[w.westmoreland-soldier-reports]], 86, 89 (LeMay, "when I was in Washington late in 1964"; the visit; Vance). Check:
        the dates. Names: Westmoreland, Johnson, McNamara, Vance, LeMay.'
      src:
        c: d802adea
        rows:
        - 'w.westmoreland-soldier-reports 89: A-B'
        - 'w.westmoreland-soldier-reports 86: C'
      tags:
      - name:westmoreland-william
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:vance-cyrus
      - name:lemay-curtis-e
- add:
    entry:
      id: cal.1965-03-06.vietnam-2
      when: Mar. 6
      date: '1965-03-06'
      thread: vietnam
      c: 'Westmoreland to Wheeler, MAC 1190, answering his question of Mar. 4: the Viet Cong hold the initiative throughout
        the South; the security situation in I and II Corps "steadily deteriorating since mid-1964," Bình Định near a critical
        point. The forecast for six months, on present courses: the government''s forces driven into isolated strongholds;
        by Westmoreland''s quotation of his evaluation, "a series of islands of strength clustered around district and province
        capitals," and a Viet Cong takeover probably within a year.'
      n: '[FRUS 1964–68, II, doc. 182](https://history.state.gov/historicaldocuments/frus1964-68v02/d182). [[w.westmoreland-soldier-reports]],
        122 (the forecast). Check: that the evaluation Westmoreland quotes, of early March, is this message (FRUS prints it
        in part). Names: Westmoreland, Wheeler.'
      src:
        c: cb4d1690
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d182: A-C'
        - 'w.westmoreland-soldier-reports 122: C-D'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
- add:
    entry:
      id: cal.1965-03.vietnam
      when: Mar.
      date: 1965-03
      thread: vietnam
      c: 'Westmoreland, after the strikes near the Mang Yang pass, asks broad authority to use the American aircraft in the
        South "as I judge prudent." Told that beyond emergencies he needs the Joint Chiefs'' approval for each mission, he
        answers that it is "impractical and operationally unsound": "I urge that I be given my head." A return cable lifts
        almost all the restrictions, by his account.'
      n: '[[w.westmoreland-soldier-reports]], 111. Check: the dates of the messages. See [[cal.1965-02-24.vietnam]]. Names:
        Westmoreland.'
      src:
        c: 2e29ad9d
        rows:
        - 'w.westmoreland-soldier-reports 111: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-03.vietnam-force-levels
      when: Mar.
      date: 1965-03
      thread: vietnam-force-levels
      c: 'Westmoreland''s estimate of the situation, begun the day after Harold K. Johnson leaves Saigon, Mar. 12: an American
        Army division for the highlands, an Army brigade for Biên Hòa and Vũng Tàu, more Marines, some seventeen battalions
        in all, to be used offensively; Taylor''s enclaves "an inglorious, static use of U.S. forces in overpopulated areas."
        DePuy carries it to Washington with Taylor at the end of March.'
      n: '[[w.westmoreland-soldier-reports]], 126–30. Check: the date of the estimate. Names: Westmoreland, Harold K. Johnson,
        Taylor, DePuy.'
      src:
        c: 9dc7dee3
        rows:
        - 'w.westmoreland-soldier-reports 126–30: all'
      tags:
      - name:westmoreland-william
      - name:johnson-harold-k
      - name:taylor-maxwell
      - name:depuy-william-e
- add:
    entry:
      id: cal.1965-05-08.vietnam-force-levels
      when: May 8
      date: '1965-05-08'
      thread: vietnam-force-levels
      c: 'Westmoreland sends Washington his concept for the American units: first, secure the base areas, operating to the
        range of light artillery; then offensive operations and deep patrolling with the South Vietnamese; then a reserve
        for them and long-range offensive operations, from bases inland. A battalion asked for Cam Ranh Bay. Taylor approves
        the concept.'
      n: '[[w.westmoreland-soldier-reports]], 135. Names: Westmoreland, Taylor.'
      src:
        c: fcf02d24
        rows:
        - 'w.westmoreland-soldier-reports 135: all'
      tags:
      - name:westmoreland-william
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1965-06-24.vietnam-force-levels
      when: June 24
      date: '1965-06-24'
      thread: vietnam-force-levels
      c: 'Westmoreland to Wheeler, MAC 3240, answering JCS 2331 of June 22: "we are in for the long pull"; "The struggle has
        become a war of attrition." Short of nuclear weapons, no quick end. American forces must go in, in numbers, to carry
        the war to the enemy; 10,000 men would give no chance of winning, and nothing obliges the Americans to be cast as
        the French.'
      n: '[FRUS 1964–68, III, doc. 17](https://history.state.gov/historicaldocuments/frus1964-68v03/d17). [[w.westmoreland-soldier-reports]],
        140 (the long pull). Check: Westmoreland dates the message mid-June (140). See [[cal.1965-06-07.vietnam]]. Names:
        Westmoreland, Wheeler.'
      src:
        c: 7587c104
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d17: all'
        - 'w.westmoreland-soldier-reports 140: A'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
- add:
    entry:
      id: cal.1965-06-30.vietnam-force-levels
      when: June 30
      date: '1965-06-30'
      thread: vietnam-force-levels
      c: 'Westmoreland to Wheeler, MAC 3320, answering JCS 2400 of June 28, the President''s question: will thirty-four American
        and ten third-country battalions convince Hanoi and the Viet Cong they cannot win? "The direct answer to your basic
        question is ''no.''" The force should restore the military balance by the end of December, not make the enemy back
        off; he holds to the forty-four battalions.'
      n: '[FRUS 1964–68, III, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v03/d31). [[w.westmoreland-soldier-reports]],
        141 (the President''s query; the answer). See [[cal.1965-06-07.vietnam]]. Names: Westmoreland, Wheeler.'
      src:
        c: 98bad8a6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d31: all'
        - 'w.westmoreland-soldier-reports 141: A-C'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
- add:
    entry:
      id: cal.1965-06.vietnam-force-levels
      when: June
      date: 1965-06
      thread: vietnam-force-levels
      c: Johnson, as an interim measure, authorizes Westmoreland to commit American forces in support of the South Vietnamese
        "in any situation . . . when, in COMUSMACV's judgment, their use is necessary to strengthen the relative position"
        of their forces.
      n: '[[w.westmoreland-soldier-reports]], 141. Check: the day. See [[cal.1965-06-07.vietnam]]. Names: Johnson, Westmoreland.'
      src:
        c: fe283f50
        rows:
        - 'w.westmoreland-soldier-reports 141: all'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-06-27.vietnam-operations
      when: June 27
      date: '1965-06-27'
      thread: vietnam-operations
      c: 'War Zone D. The 173d Airborne Brigade, two battalions, with the Australian battalion, a South Vietnamese regiment
        and two airborne battalions, in a three-day sweep: the first entry in years by any but Communist troops; several sharp
        engagements with the Viet Cong.'
      n: '[[w.westmoreland-soldier-reports]], 141.'
      src:
        c: af2386d8
        rows:
        - 'w.westmoreland-soldier-reports 141: all'
- add:
    entry:
      id: cal.1965-10.vietnam-congress
      when: Oct., late
      date: 1965-10
      thread: vietnam-congress
      c: Edward Kennedy in South Vietnam, five days, on the refugees. By Westmoreland's account, he holds a press conference,
        the television cameras there, in the heart of an old camp, a new one being built a few miles down the road.
      n: '[[w.westmoreland-soldier-reports]], 303–04. Names: Edward Kennedy, Westmoreland.'
      src:
        c: b6f5e892
        rows:
        - 'w.westmoreland-soldier-reports 303–04: all'
      tags:
      - name:kennedy-edward-m
      - name:westmoreland-william
- add:
    entry:
      id: cal.1966-07-12.vietnam
      when: July 12
      date: '1966-07-12'
      thread: vietnam
      c: 'Đà Nẵng. Westmoreland with Walt and Hoàng Xuân Lãm, the I Corps commander, on the North Vietnamese build-up below
        the demilitarized zone: Walt to move a division into Quảng Trị if need be, with the Special Landing Force and first
        call on the B-52s; Lãm promised up to five battalions of the general reserve.'
      n: '[[w.westmoreland-soldier-reports]], 197. Names: Westmoreland, Walt.'
      src:
        c: dc3d9bfa
        rows:
        - 'w.westmoreland-soldier-reports 197: all'
      tags:
      - name:westmoreland-william
      - name:walt-lewis-w
      - place:da-nang
- add:
    entry:
      id: cal.1966-09.vietnam-2
      when: Sept., mid-month
      date: 1966-09
      thread: vietnam
      c: 'Clark Air Base, the Philippines. Starbird tells Westmoreland of McNamara''s plan for an electronic barrier below
        the demilitarized zone and across the Laotian panhandle. Westmoreland: he welcomes the devices, but will use them
        his own way, in depth, between his strongpoints.'
      n: '[[w.westmoreland-soldier-reports]], 200. Names: Starbird, McNamara, Westmoreland.'
      src:
        c: e152ec8f
        rows:
        - 'w.westmoreland-soldier-reports 200: all'
      tags:
      - name:starbird-alfred-d
      - name:mcnamara-robert-s
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-04-25.vietnam-2
      when: Apr. 25
      date: '1967-04-25'
      thread: vietnam
      c: 'Westmoreland to the South Carolina General Assembly, at McNair''s invitation: the black soldier in Vietnam has served
        "with distinction equal to his white comrades in arms." The University of South Carolina gives him an honorary degree;
        a protester''s placard, "Doctor of War."'
      n: '[[w.westmoreland-soldier-reports]], 226. Check: the day. Names: Westmoreland, McNair.'
      src:
        c: 3c02676a
        rows:
        - 'w.westmoreland-soldier-reports 226: all'
      tags:
      - name:westmoreland-william
      - name:mcnair-robert-e
      - state:sc
- add:
    entry:
      id: cal.1967-04.republican-party-2
      when: Apr., late
      date: 1967-04
      thread: republican-party
      also:
      - vietnam
      c: 'Palm Desert, Cal. Westmoreland with Eisenhower, at Johnson''s request. Eisenhower: he has advised Johnson to give
        Westmoreland the men he needs to finish the job; he laments the restrictions on the war.'
      n: '[[w.westmoreland-soldier-reports]], 229–30. Check: the day, after the address of Apr. 28. Names: Westmoreland, Eisenhower,
        Johnson.'
      src:
        c: 9bdb0e8d
        rows:
        - 'w.westmoreland-soldier-reports 229–30: all'
      tags:
      - name:westmoreland-william
      - name:eisenhower-dwight-d
      - name:johnson-lyndon-b
      - state:ca
- add:
    entry:
      id: cal.1967-04.vietnam-congress
      when: Apr., late
      date: 1967-04
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'Thruston Morton, by Westmoreland''s account: Westmoreland''s "unpatriotic acts," not telling flag- and draft-card
        burners from legitimate dissent, only add fuel to the controversy over the war.'
      n: '[[w.westmoreland-soldier-reports]], 226. Check: the day and the words. See [[cal.1967-04-24.vietnam]]. Names: Morton,
        Westmoreland.'
      src:
        c: a1a0e06c
        rows:
        - 'w.westmoreland-soldier-reports 226: all'
      tags:
      - name:morton-thruston-b
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-11.vietnam-congress
      when: Nov.
      date: 1967-11
      thread: vietnam-congress
      c: Ichord and Jackson give the press Westmoreland's confidential testimony to the House and Senate Armed Services Committees,
        with his estimate of when American withdrawals might begin, by Westmoreland's account.
      n: '[[w.westmoreland-soldier-reports]], 234. Check: the day. See [[cal.1967-11-13.vietnam]]. Names: Ichord, Jackson,
        Westmoreland.'
      src:
