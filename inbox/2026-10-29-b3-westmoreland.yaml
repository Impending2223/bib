      when: Oct., late
      date: 1965-10
      thread: vietnam-congress
      c: Edward Kennedy in South Vietnam, five days, on the refugees. By Westmoreland's account, he holds a press conference,
        the television cameras there, in the heart of an old camp, a new one being built a few miles down the road.
      n: '[[w.westmoreland-soldier-reports]], 303–04. Names: Edward Kennedy, Westmoreland.'
