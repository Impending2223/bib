      thread: vietnam-tet
      c: The Tet truce cancelled in I Corps's two northern provinces, Washington and Thiệu having approved at Westmoreland's
        urging through Bunker; the bombing just north of the DMZ to go on. The South Vietnamese announcement, due that morning,
        not made, the government's press office closed for Tet, Thiệu at Mỹ Tho; Zorthian announces it at a Mission press
        conference late in the afternoon. Elsewhere the truce of 36 hours that Thiệu has agreed to, half the troops on alert.
      n: '[[w.westmoreland-soldier-reports]], 319. Check: the day of Washington''s approval. See [[cal.1968-01-20.vietnam-tet]].
        Names: Nguyễn Văn Thiệu, Westmoreland, Bunker, Zorthian.'
