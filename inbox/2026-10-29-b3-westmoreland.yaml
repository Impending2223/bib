    set:
      n: 'FRUS 1964–68, I, docs. [187](https://history.state.gov/historicaldocuments/frus1964-68v01/d187), [188](https://history.state.gov/historicaldocuments/frus1964-68v01/d188),
        [189](https://history.state.gov/historicaldocuments/frus1964-68v01/d189). The President''s News Conference, [1963–64
        Pub. Papers 733](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=817) (June 2, 1964).
        [[w.gibbons-u-s-government-and]], II, 261–63 (the conference, June 1–3; who came; the resolution and the strikes discussed;
        not Johnson''s words of June 2); [[w.cosmas-joint-chiefs-of-staff-2012]], 75–77 (the conference); [[w.dallek-flawed-giant]],
        105 (the conference). [[w.westmoreland-soldier-reports]], 70–71, 82 (the conference; Westmoreland: "the entire military
        situation is tenuous but not hopeless"; his HOP TAC plan approved there). To check: MFR, "Special Meeting on Southeast
        Asia, Plenary Session, 1 June 1964," JMF 9150 (1 Jun 64); MFR, CJCS, "Highlights of Honolulu Conference," June 2,
        1964, OCJCS File (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 75 n.27, 77 n.29); Bundy to Johnson, May 22, 1964
        ([FRUS 1964–68, I, doc. 167](https://history.state.gov/historicaldocuments/frus1964-68v01/d167)), and Apr. 29, NSF:
        Memos to the President, LBJ Library; [Johnson and Bundy, May 13, 1964, 5:35 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mcgeorge-bundy-may-13-1964),
        Conversation WH6405-06-3446 (Miller Center; not heard here); Bundy to Johnson, May 25, 1964, draft ([FRUS 1964–68,
        I, doc. 173](https://history.state.gov/historicaldocuments/frus1964-68v01/d173): the recommendation, not the conference);
        Bundy to Johnson, May 26, 1964, Diary Backup, LBJ Library; William P. Bundy, manuscript history of the Vietnam War,
        chap. 13, LBJ Library (cited by [[w.dallek-flawed-giant]], 105). See [[cal.1964-05-24.vietnam]]. Names: Rusk, McNamara,
        Taylor, McCone, Lodge, Westmoreland, Felt, Sharp, Johnson.'
