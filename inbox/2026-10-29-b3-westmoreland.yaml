      id: cal.1966-07-12.vietnam
      when: July 12
      date: '1966-07-12'
      thread: vietnam
      c: 'Đà Nẵng. Westmoreland with Walt and Hoàng Xuân Lãm, the I Corps commander, on the North Vietnamese build-up below
        the demilitarized zone: Walt to move a division into Quảng Trị if need be, with the Special Landing Force and first
        call on the B-52s; Lãm promised up to five battalions of the general reserve.'
      n: '[[w.westmoreland-soldier-reports]], 197. Names: Westmoreland, Walt.'
      src:
        c: dc3d9bfa
        rows:
