      c: 'Westmoreland to the Mission Council: a major offensive coming, sixty-forty that it strikes before Tet, probably
        Jan. 25. Davidson, his intelligence chief: forty-sixty that the enemy maneuvers in the truce and strikes after it.'
      n: '[[w.westmoreland-soldier-reports]], 318. Names: Westmoreland, Davidson.'
