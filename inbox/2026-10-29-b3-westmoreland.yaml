      - place:saigon
- add:
    entry:
      id: cal.1964-05-12.vietnam
      when: May 12
      date: '1964-05-12'
      thread: vietnam
      c: 'Saigon. McNamara and Taylor with the Country Team, Lodge, Harkins and Westmoreland among them: Khánh''s government
        weak at the center and in the provinces. Westmoreland, by his account, to McNamara during the visit: the war a "bottomless
        pit," long and costly; a people-to-people program to hold the American people''s patience. McNamara brushes it aside.'
      n: '[FRUS 1964–68, I, doc. 151](https://history.state.gov/historicaldocuments/frus1964-68v01/d151) (the meeting). [[w.westmoreland-soldier-reports]],
        105 (his talk with McNamara). Names: McNamara, Taylor, Lodge, Harkins, Westmoreland, Nguyễn Khánh.'
      src:
        c: 2dc7ed4e
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d151: A-B'
        - 'w.westmoreland-soldier-reports 105: C-E'
      tags:
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:lodge-henry-cabot
      - name:harkins-paul-d
      - name:westmoreland-william
      - name:nguyen-khanh
      - place:saigon
- add:
    entry:
      id: cal.1964-06-20.vietnam
      when: June 20
      date: '1964-06-20'
      thread: vietnam
      c: Westmoreland takes command of the Military Assistance Command, Vietnam, from Harkins.
      n: '[[w.westmoreland-soldier-reports]], 69. Names: Westmoreland, Harkins.'
