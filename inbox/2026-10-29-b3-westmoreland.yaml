      c: 'Westmoreland to Howard Tuckner of NBC: against a halt in the bombing. "I think his plans concern a major effort
        to win a spectacular battlefield success on the eve of the Tet festival next Monday."'
      n: '[[w.westmoreland-soldier-reports]], 318. Names: Westmoreland.'
