    entry:
      id: cal.1968-02.vietnam-tet
      when: Feb., early
      date: 1968-02
      thread: vietnam-tet
      c: Saigon. Westmoreland forms a task force for the refugees under Forsythe, Komer to supervise; with Bunker he puts
        it to Thiệu. Thiệu gives Forsythe an office in Independence Palace and a counterpart in the Minister of Pacification,
        and puts Kỳ in charge. American engineers and building stocks; Viên the ARVN's engineers.
      n: '[[w.westmoreland-soldier-reports]], 333. Check: the day. Names: Westmoreland, Forsythe, Komer, Bunker, Nguyễn Văn
        Thiệu, Nguyễn Cao Kỳ, Cao Văn Viên.'
      src:
        c: 62fa8d1d
        rows:
        - 'w.westmoreland-soldier-reports 333: all'
      tags:
      - name:westmoreland-william
      - name:forsythe-george-i
      - name:komer-robert-w
      - name:bunker-ellsworth
      - name:nguyen-van-thieu
