      when: Dec. 25
      date: '1964-12-25'
      thread: vietnam-saigon
      c: 'Taylor to Rusk, Saigon 1939: Khánh, in forwarding the generals'' complaint against the Ambassador to Hương, has
        made "what was initially personal vendetta of a few thin-skinned Generals major issue between our two govts." In consultation
        with Alexis Johnson, Westmoreland and Throckmorton, he sends Throckmorton to see the four young generals of Dec. 20,
        one by one, to set the record straight. He would have Hương form a committee of three to look into the generals''
        complaints.'
      n: '[FRUS 1964–68, I, doc. 467](https://history.state.gov/historicaldocuments/frus1964-68v01/d467). See [[cal.1964-12-22.vietnam]].
        Names: Taylor, Rusk, Nguyễn Khánh, Trần Văn Hương, U. Alexis Johnson, Westmoreland, Throckmorton.'
