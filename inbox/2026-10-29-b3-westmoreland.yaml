      when: Apr. 25
      date: '1967-04-25'
      thread: vietnam
      c: 'Westmoreland to the South Carolina General Assembly, at McNair''s invitation: the black soldier in Vietnam has served
        "with distinction equal to his white comrades in arms." The University of South Carolina gives him an honorary degree;
        a protester''s placard, "Doctor of War."'
      n: '[[w.westmoreland-soldier-reports]], 226. Check: the day. Names: Westmoreland, McNair.'
