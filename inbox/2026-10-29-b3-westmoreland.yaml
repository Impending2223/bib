- edit:
    id: cal.1964-12-28.vietnam-operations
    base: 76479f95
    set:
      n: '[FRUS 1964–68, II, doc. 6](https://history.state.gov/historicaldocuments/frus1964-68v02/d6) (Wheeler''s account
        to the principals, Jan. 5, 1965). [[w.cosmas-united-states-army-in]], 194; [[w.vietnam-victory-in-vietnam]], 139–41,
        461 nn.29–30 (the campaign; the hamlet taken, Dec. 27; the 33d Ranger and 4th Marine Battalions destroyed); [[w.futrell-united-states-air-force]],
        260 (the rangers and the marines committed); [[w.moyar-triumph-forsaken]], 337–38. [[w.westmoreland-soldier-reports]],
        104 (the two regiments as the Viet Cong''s 9th Division; the ranger and marine battalions virtually destroyed). Check:
        FRUS''s editors date the battle Dec. 28–Jan. 4 (II, doc. 14, n. 5). Check: *Victory in Vietnam* gives the campaign
        as Dec. 2–Jan. 3: the 33d Ranger Battalion destroyed Dec. 28, six helicopters shot down; the 4th Marine Battalion
        Dec. 30–31, an American captain among eight prisoners; in all 1,755 killed, 293 captured, 56 aircraft shot down or
        damaged (139–41, 461 n.30). Check: Futrell, 260, has two North Vietnamese regiments raid the hamlet the night of Dec.
        27, and three helicopters lost to ground fire on the 29th. Check: Westmoreland dates the attack Dec. 27 and its end
        New Year''s Day (104).'
      src:
        c: 0e8ae310
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d6: all'
