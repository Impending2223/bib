- add:
    entry:
      id: cal.1968-02.vietnam-tet-2
      when: Feb., early
      date: 1968-02
      thread: vietnam-tet
      also:
      - vietnam-khe-sanh
      c: 'MACV Forward, a branch of Westmoreland''s headquarters, opens at Phú Bài under Abrams: all American ground forces
        north of the Hải Vân Pass under it, with the III Marine Amphibious Force. A month later the Provisional Corps, Vietnam,
        under Cushman, and MACV Forward closed.'
      n: '[[w.westmoreland-soldier-reports]], 345. Check: the place; Wheeler to the National Security Council, Feb. 7, gives
        Đà Nẵng ([FRUS 1964–68, VI, doc. 60](https://history.state.gov/historicaldocuments/frus1964-68v06/d60)). Check: the
        day. Names: Westmoreland, Abrams, Cushman.'
      src:
        c: 4c5e480c
        rows:
        - 'w.westmoreland-soldier-reports 345: all'
      tags:
      - name:westmoreland-william
      - name:abrams-creighton
      - name:cushman-robert-e-jr
- add:
    entry:
      id: cal.1968-02-08.vietnam-205000
      when: Feb. 8
      date: '1968-02-08'
      thread: vietnam-205000
      also:
      - vietnam-tet
      c: 'Westmoreland to Wheeler, MAC 1810: Khe Sanh might be lost; his forces stretched; he asks formally, by April, the
        troops Wheeler has spoken of, the 82d Airborne and half a Marine division. MAC 1812: where troops beyond the ceiling
        of 525,000 would go. The ARVN''s modernization first; another American and another Korean division perhaps needed
        before the end of 1968.'
      n: '[FRUS 1964–68, VI, doc. 63](https://history.state.gov/historicaldocuments/frus1964-68v06/d63) n.4 (the two telegrams).
        [[w.westmoreland-soldier-reports]], 353 (the divisions). To check: MAC 1810 and MAC 1812, Feb. 8, 1968, Westmoreland
        Papers, #29 History File, LBJ Library (cited by FRUS 1964–68, VI, doc. 63 n.4). See [[cal.1968-02-09.vietnam]]. Names:
        Westmoreland, Wheeler.'
      src:
        c: 5e643295
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d63: A-B'
        - 'w.westmoreland-soldier-reports 353: C'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
