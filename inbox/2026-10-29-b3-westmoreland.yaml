      when: May 7
      date: '1967-05-07'
      thread: vietnam-elections
      c: 'Saigon, Thiệu''s quarters at Tân Sơn Nhứt, Sunday morning: Westmoreland, at Bunker''s request, with Thiệu. Westmoreland:
        the armed forces need their best leader at their head, and Thiệu is the man; Thiệu agrees. Thiệu: a civilian President
        probably needed, Trần Văn Hương the strongest candidate. Bunker to Rusk the same day: the generals have agreed that
        the armed forces not take part in the election as a bloc.'
      n: '[FRUS 1964–68, V, doc. 163](https://history.state.gov/historicaldocuments/frus1964-68v05/d163). [[w.westmoreland-soldier-reports]],
