      id: cal.1968-01-30.vietnam-tet
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      c: 'Thiệu, in midmorning, cancels the truce throughout the country. Westmoreland, through Kerwin, his chief of staff,
        to all American units, a priority message: "troops will be placed on maximum alert with particular attention to the
        defense of headquarters complexes, logistical installations, airfields, population centers and billets."'
      n: '[[w.westmoreland-soldier-reports]], 323. See [[cal.1968-01-30.vietnam]]. Names: Nguyễn Văn Thiệu, Westmoreland.'
      src:
        c: 85aaae85
