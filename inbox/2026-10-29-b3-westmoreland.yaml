      when: Jan. 20
      date: '1968-01-20'
      thread: vietnam-tet
      c: 'Westmoreland to Wheeler: "The enemy is presently developing a threatening posture in several areas in order to seek
        victories essential to achieving prestige and bargaining power. He may exercise his initiatives prior to, during,
        or after Tet."'
      n: '[[w.westmoreland-soldier-reports]], 318–19. Names: Westmoreland, Wheeler.'
