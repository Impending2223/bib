      when: Jan. 20
      date: '1968-01-20'
      thread: vietnam-tet
      c: 'Wheeler to McNamara, CM-2927-68, "Tet Stand down," at Rostow''s request: Westmoreland''s case for a 36-hour truce,
        not 48. "The enemy is presently developing a threatening posture in several areas in order to seek victories essential
        to achieving prestige and bargaining power. He may exercise his initiatives prior to, during or after Tet." Thiệu
        and Viên for the shortest truce; Sharp for no more than 36 hours.'
      n: '[FRUS 1964–68, VI, doc. 21](https://history.state.gov/historicaldocuments/frus1964-68v06/d21). [[w.westmoreland-soldier-reports]],
        318–19 (Westmoreland''s message). Names: Wheeler, McNamara, Rostow, Westmoreland, Nguyễn Văn Thiệu, Cao Văn Viên,
        Sharp.'
