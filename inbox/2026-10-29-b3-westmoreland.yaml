      when: Dec. 25
      date: '1964-12-25'
      thread: vietnam-saigon
      c: 'Throckmorton, Westmoreland''s deputy, calls on Kỳ, Cang and Thiệu, one by one, at Taylor''s request: the misunderstandings
        of Dec. 20 corrected, the consequences of Khánh''s message to Hương made plain. Kỳ, by Westmoreland''s account: Khánh
        "practically finished" as commander in chief three weeks before, using the dispute "to reconsolidate his position."
        The generals, but Cang, will seek an accommodation with Hương.'
