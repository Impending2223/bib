      when: Sept. 22
      date: '1965-09-22'
      thread: vietnam-force-levels
      c: 'McNamara to Johnson: the estimate for 1965 from the 175,000 of July to 210,000, refined at Honolulu and recommended by the Joint Chiefs Aug. 23, for more airlift, air defense, artillery, strike aircraft and engineers. He asks authority for 35,000 more, to 210,000: "essential to our effort."'
      n: 'FRUS 1964–68, III, doc. [149](https://history.state.gov/historicaldocuments/frus1964-68v03/d149). [[w.drea-mcnamara-clifford-and-the-2011]], 47, 115 (the request). Made public: FRUS 1964–68, III (1996). See [[cal.1965-08-23.vietnam]]. Names: McNamara, Johnson.'
