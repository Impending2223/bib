      id: cal.1964-11-19.vietnam
      when: Nov. 19
      date: '1964-11-19'
      thread: vietnam
      c: 'Johnson with Rusk, McNamara, McGeorge and William Bundy, 12:30 p.m., on the working group''s three options; Taylor back Nov. 27, recommendations by Dec. 1. McGeorge Bundy: the officers of the Pacific Command not included for now. Johnson: no firm decisions without the military''s participation; he could not face the congressional leaders otherwise. McNamara: the Joint Chiefs at work for weeks, Wheeler at every discussion with Taylor.'
      n: 'FRUS 1964–68, I, doc. [417](https://history.state.gov/historicaldocuments/frus1964-68v01/d417) (Thomson''s memorandum for the record, drafted Nov. 24). [[w.drea-mcnamara-clifford-and-the-2011]], 13 (the meeting, Johnson on the military). Made public: FRUS 1964–68, I (1992). See [[cal.1964-11-03.vietnam]]. Names: Rusk, McNamara, McGeorge Bundy, William Bundy, Taylor, Wheeler, Johnson.'
