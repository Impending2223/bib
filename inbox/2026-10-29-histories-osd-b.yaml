      id: cal.1965-09-29.vietnam
      when: Sept. 29
      date: '1965-09-29'
      thread: vietnam-force-levels
      c: 'Lunch: Johnson with Ball, McNamara, McGeorge Bundy, Raborn, Moyers and Califano. McNamara asks interim authority for 195,000, the last 15,000 about Nov. 15; the 35,000 more support troops, not combat. Johnson: "no choice but to approve the increase." Approved, to 195,000. Announced from Saigon as the troops arrive. Also tear gas and rice for South Vietnam; the Rolling Thunder program approved.'
      n: 'FRUS 1964–68, III, doc. [155](https://history.state.gov/historicaldocuments/frus1964-68v03/d155) (Califano''s memorandum for the record). [[w.drea-mcnamara-clifford-and-the-2011]], 47, 115 (the 195,000, the quotation). Made public: FRUS 1964–68, III (1996). See [[cal.1965-08-23.vietnam]]. Names: Ball, McNamara, McGeorge Bundy, Raborn, Moyers, Califano, Johnson.'
