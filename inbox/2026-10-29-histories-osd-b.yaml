- add:
    entry:
      id: cal.1968-07-08.testing-missile-talks
      when: July 8
      date: '1968-07-08'
      thread: testing-missile-talks
      c: 'The Executive Committee of the Committee of Principals, 5 p.m., on the position for the missile talks. Rusk: without control the arms race spirals to new plateaus of expense, no more security. Clifford: the first sessions general, no concrete proposals or concessions, verification the chief problem. A working group under Fisher of ACDA to develop positions; Defense to draft an opening statement; no word to the press.'
      n: 'FRUS 1964–68, XI, doc. [252](https://history.state.gov/historicaldocuments/frus1964-68v11/d252). [[w.drea-mcnamara-clifford-and-the-2011]], 338–39 (the meeting, Rusk, Clifford, the working group). Made public: FRUS 1964–68, XI (1997). To check: [[w.seaborg-stemming-the-tide]]; [[w.newhouse-cold-dawn]]. See [[cal.1968-06-21.testing]]. Names: Rusk, Clifford, Fisher.'
      tags:
