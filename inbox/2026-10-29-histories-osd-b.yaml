      when: Sept. 24
      date: '1965-09-24'
      thread: vietnam-force-levels
      c: 'Califano, for Johnson, asks McNamara whether a decision on his memorandum is needed at once: not that day. Johnson reluctant to go above 200,000; McNamara to bring an alternative ceiling, the forces phased so that the increases can be stopped at any point.'
      n: 'FRUS 1964–68, III, doc. [153](https://history.state.gov/historicaldocuments/frus1964-68v03/d153) (Bromley Smith to McGeorge Bundy, from Califano). [[w.drea-mcnamara-clifford-and-the-2011]], 47 (Johnson and the 200,000). Made public: FRUS 1964–68, III (1996). See [[cal.1965-08-23.vietnam]]. Names: Califano, McNamara, Johnson.'
