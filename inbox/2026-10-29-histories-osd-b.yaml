      c: Rusk to Lodge, msg 753, eyes only, after an informal review over the weekend. The Viet Cong turning to small actions; how the increased American ground and air strength is to be used, and whether the increases should go at the planned pace. Lodge's assessment asked, with the South Vietnamese reaction to wider American ground operations.
      n: 'FRUS 1964–68, III, doc. [141](https://history.state.gov/historicaldocuments/frus1964-68v03/d141). [[w.drea-mcnamara-clifford-and-the-2011]], 115 (the message, the reinforcements questioned). Made public: FRUS 1964–68, III (1996). See [[cal.1965-08-23.vietnam]]. Names: Rusk, Lodge.'
