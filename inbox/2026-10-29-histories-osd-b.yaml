- add:
    entry:
      id: cal.1965-09-18.vietnam
      when: Sept. 18
      date: '1965-09-18'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'Lodge to Rusk, msg 953, answering: the Viet Cong may be avoiding large actions; the American troops a chance to pacify the areas around them. Westmoreland wants the full Phase I list deployed on the schedule worked out at Honolulu, the 1st Division on time. His strategy: halt the Viet Cong offensive, resume the offensive, restore the country to the government''s control.'
      n: 'FRUS 1964–68, III, doc. [144](https://history.state.gov/historicaldocuments/frus1964-68v03/d144). [[w.drea-mcnamara-clifford-and-the-2011]], 115 (Lodge, after consulting Westmoreland, for the full Phase I). Made public: FRUS 1964–68, III (1996). See [[cal.1965-09-14.vietnam]]. Names: Lodge, Rusk, Westmoreland.'
