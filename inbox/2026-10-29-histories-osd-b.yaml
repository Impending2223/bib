- add:
    entry:
      id: cal.1968-05-02.testing
      when: May 2
      date: '1968-05-02'
      thread: testing-missile-talks
      also:
      - soviet-union
      c: 'Johnson to Kosygin, by the private channel: arms limitation in the Middle East; and talks on strategic arms, his proposal since December 1966. He proposes that the two governments announce, early in the General Assembly''s debate on the nonproliferation treaty, bilateral negotiations to limit strategic offensive and defensive missiles. The shorter of two drafts, without the specifics the Joint Chiefs had opposed. Rusk gives Dobrynin a copy May 3.'
      n: 'FRUS 1964–68, XI, doc. [237](https://history.state.gov/historicaldocuments/frus1964-68v11/d237) (the letter, its delivery). [[w.drea-mcnamara-clifford-and-the-2011]], 337 (the letter, the shorter draft). Made public: FRUS 1964–68, XI (1997). To check: [[w.newhouse-cold-dawn]]; [[w.seaborg-stemming-the-tide]]; Rusk to Johnson, Apr. 26, 1968, and CM-3227-68, Wheeler to Clifford, Apr. 22, 1968 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 337 n.64). Names: Johnson, Kosygin, Rusk, Dobrynin.'
      tags:
