- follows:
    id: cal.1966-07-13.robert-kennedy-2
    remove:
    - cal.1966-07-13.amendments
    why: 'The call is placed by its own hour, 11:39 p.m. July 13 (the Miller Center''s catalogue, Conversation WH6607-01-10407; PRDE the same). The entry''s note names the amendments entry as what it follows "(the sources above)", but nothing in either line or in their sources joins them: Hoover''s witnesses against Robert Kennedy and the Senate subcommittee''s hearing on a four-year House term are two matters, and no word of either says which came first.'
