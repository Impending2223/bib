    why: 'The call is placed by its own hour, 11:39 p.m. (the Miller Center''s tape of July 14, 1966, Conversation WH6607-01-10407). The entry''s note names the amendments entry as what it follows "(the sources above)", but nothing in either line or in their sources joins them: Hoover''s witnesses against Robert Kennedy and the Senate subcommittee''s hearing on a four-year House term are two matters, and no word of either says which came first.'
