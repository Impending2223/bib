      c: The freeze on bank funds lifted, the withdrawal of deposits excepted.
      n: '[[w.ilchi]], I, May 20, 1961, revolution, item 3. See [[cal.1961-05-16.korea-leadership-3]].'
      tags:
      - polity:rok
