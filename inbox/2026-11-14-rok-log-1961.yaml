patch: 2026-11-14-rok-log-1961
by: 'Claude (ROK pilot, Reader A: Ilchi, I, May 16–June 30, 1961, from the page images), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1961-05-16.korea-leadership
      when: May 16
      date: '1961-05-16'
      thread: korea-leadership
      c: 'The Military Revolutionary Committee: all assemblies, national and local, dissolved; the cabinet''s members to be arrested; the courts halted. Under its Proclamation No. 8, the local assemblies'' spending stopped from the day. The election of the Chief Justice and justices, set for May 25, put off without date.'
      n: '[[w.ilchi]], I, May 16, 1961, revolution, items 2, 7; business, items 1–2.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-16.korea-leadership-2
      when: May 16
      date: '1961-05-16'
      thread: korea-leadership
      c: 'The Military Revolutionary Committee announces six pledges: among them anticommunism made firmer, corruption swept away, the people''s hardship relieved.'
      n: '[[w.ilchi]], I, May 16, 1961, revolution, item 3.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-16.korea-leadership-3
      when: May 16
      date: '1961-05-16'
      thread: korea-leadership
      c: The Military Revolutionary Committee freezes bank funds and prices.
      n: '[[w.ilchi]], I, May 16, 1961, revolution, item 7; May 17, revolution, item 4 (prices held at the level of May 15).'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-16.korea-leadership-4
      when: May 16
      date: '1961-05-16'
      thread: korea-leadership
      c: 'Serving officers at the head of the police: Brig. Gen. Cho Hŭng-man, the Home Ministry''s public security bureau; Col. Yi Kwang-sŏn, Seoul; colonels and lieutenant colonels in Kyŏnggi, Kangwŏn, North Ch''ungch''ŏng and North Chŏlla.'
      n: '[[w.ilchi]], I, May 16, 1961, appointments, item 1. Names: Cho Hŭng-man, Yi Kwang-sŏn.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-17.korea-leadership
      when: May 17
      date: '1961-05-17'
      thread: korea-leadership
      c: Chang Myon's officials held in the Capitol; the revolutionary authorities promise their safety and tell the former ministers to give themselves up. Liaison officers to every ministry to take over its business.
      n: '[[w.ilchi]], I, May 17, 1961, revolution, items 2–3. See [[cal.1961-05-16.korea-leadership]]. Names: Chang Myon.'
      tags:
      - polity:rok
      - name:chang-myon
- add:
    entry:
