      id: cal.1961-05-21.korea-leadership
      when: May 21
      date: '1961-05-21'
      thread: korea-leadership
      c: The cabinet sworn in, pledged to fulfil the revolutionary pledges soon. Chang Do-young, Prime Minister and Minister of Defense; Kim Hong-il, Foreign Affairs; Han Sin, Home Affairs; Paek Sŏn-jin, Finance; Ko Wŏn-jŭng, Justice; Mun Hŭi-sŏk, Education; Pak Ki-sŏk, Construction; Chang Kyŏng-sun, Agriculture and Forestry; Chŏng Rae-hyŏk, Commerce and Industry; Chang Tŏk-sŭng, Health and Social Affairs; Kim Kwang-ok, Transportation; Pae Tŏk-chin, Communications; Kim Pyŏng-sam, general affairs; Sim Hŭng-sŏn, public information. All officers but Kim Hong-il.
      n: '[[w.ilchi]], I, May 21, 1961, revolution, item 1; appointments, item 1. See [[cal.1961-05-20.korea-leadership]]. Names: Chang Do-young, Kim Hong-il, Han Sin, Paek Sŏn-jin, Ko Wŏn-jŭng, Mun Hŭi-sŏk, Pak Ki-sŏk, Chang Kyŏng-sun, Chŏng Rae-hyŏk, Chang Tŏk-sŭng, Kim Kwang-ok, Pae Tŏk-chin, Kim Pyŏng-sam, Sim Hŭng-sŏn.'
