      when: May 17
      date: '1961-05-17'
      thread: korea-leadership
      c: The Military Revolutionary Committee orders the pro-communists rounded up.
      n: '[[w.ilchi]], I, May 17, 1961, directives, item 1.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1961-05-18.korea-leadership
      when: May 18
      date: '1961-05-18'
      thread: korea-leadership
      c: Yun Po-sun, at 3 p.m., confirms the emergency martial law after the fact and calls on the nation to get through the crisis and complete the revolution.
      n: '[[w.ilchi]], I, May 18, 1961, revolution, item 4. Names: Yun.'
      tags:
      - polity:rok
      - name:yun-po-sun
- add:
    entry:
      id: cal.1961-05-18.korea-leadership-2
      when: May 18
      date: '1961-05-18'
      thread: korea-leadership
      c: 'Chang Do-young, the committee''s chairman, to the press, Korean and foreign: corruption to be swept away; an anticommunist democracy built.'
      n: '[[w.ilchi]], I, May 18, 1961, revolution, item 5. Names: Chang Do-young.'
      tags:
      - polity:rok
      - name:chang-yo-yong
- add:
    entry:
      id: cal.1961-05-19.korea-leadership
      when: May 19
      date: '1961-05-19'
      thread: korea-leadership
      c: 'The Military Revolutionary Committee renames itself the Supreme Council for National Reconstruction; its first session. The state a democratic republic, the Council its supreme organ, with the executive and judicial power; the cabinet all soldiers; five members to draft a constitution. Council Decree No. 4: thirty members and two advisers, Lt. Gen. Chang Do-young chairman, Maj. Gen. Park Chung Hee vice-chairman, Kim Hong-il and Kim Tong-ha the advisers.'
      n: '[[w.ilchi]], I, May 19, 1961, revolution, items 2–5; appointments, item 1. Names: Chang Do-young, Park, Kim Hong-il, Kim Tong-ha.'
      tags:
      - polity:rok
      - name:chang-yo-yong
      - name:park-chung-hee
      - name:kim-hong-il
- add:
    entry:
      id: cal.1961-05-19.korea-leadership-2
      when: May 19–20
      date: '1961-05-19'
      thread: korea-leadership
      c: Yun Po-sun announces his resignation, trusting the Council to lift the people out of poverty. May 20, he withdraws it.
      n: '[[w.ilchi]], I, May 19, 1961, revolution, item 1; May 20, revolution, item 1. Names: Yun.'
      tags:
      - polity:rok
      - name:yun-po-sun
