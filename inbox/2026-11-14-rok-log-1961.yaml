      date: '1961-05-20'
      thread: korea-leadership
      c: 'Chang Do-young, a special statement: smugglers to be put to death; labor disputes forbidden.'
      n: '[[w.ilchi]], I, May 20, 1961, revolution, item 5. Names: Chang Do-young.'
      tags:
      - polity:rok
      - name:chang-yo-yong
