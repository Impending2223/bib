      date: '1961-05-20'
      thread: korea-leadership
      c: The revolutionary cabinet announced, Chang Do-young at its head. Maj. Gen. Han Sin, Home Minister; Maj. Gen. Chŏng Rae-hyŏk, Commerce and Industry; Brig. Gen. Yun T'ae-il, mayor of Seoul; Col. Yi Wŏn-yŏp, the Board of Audit.
      n: '[[w.ilchi]], I, May 20, 1961, revolution, item 2; appointments, item 2. Names: Chang Do-young, Han Sin, Chŏng Rae-hyŏk, Yun T''ae-il, Yi Wŏn-yŏp.'
      tags:
      - polity:rok
      - name:chang-yo-yong
- add:
    entry:
      id: cal.1961-05-20.korea-leadership-2
      when: May 20
      date: '1961-05-20'
      thread: korea-leadership
      c: 'The Supreme Council''s fourteen subcommittees, a Council member at the head of each: among them home affairs, Pak Wŏn-bin; finance, Mun Chae-jun; foreign affairs and defense, Yu Yang-su; public security, Han Ung-jin.'
      n: '[[w.ilchi]], I, May 20, 1961, appointments, item 1. See [[cal.1961-05-19.korea-leadership]]. Names: Pak Wŏn-bin, Mun Chae-jun, Yu Yang-su, Han Ung-jin.'
      tags:
      - polity:rok
