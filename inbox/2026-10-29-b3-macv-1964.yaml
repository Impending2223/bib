patch: b3-macv-1964
by: Claude (b3-macv reading agent, Oct. 29, 2026), from MACV's Command History, 1964
ops:
- add:
    entry:
      id: cal.1964-01-27.vietnam
      when: Jan. 27
      date: '1964-01-27'
      thread: vietnam
      c: Saigon. Westmoreland takes up the new post of deputy to Harkins at the Military Assistance Command. His survey of
        its staff leads to his recommendation to fold the advisory group into the command.
      n: '[[w.macv-command-history-1964]], 9, 188 (the day, 188). Check: the History''s chronology, 189, has him named Jan.
        14. Names: Westmoreland, Harkins.'
      src:
        c: 6f68fadf
        rows:
        - 'w.macv-command-history-1964 9: all'
        - 'w.macv-command-history-1964 188: B'
      tags:
      - name:westmoreland-william
      - name:harkins-paul-d
      - place:saigon
    section: '196401'
- add:
    entry:
      id: cal.1964-03-03.vietnam
      when: Mar. 3
      date: '1964-03-03'
      thread: vietnam
      c: Herbicides. Approval of crop destruction missions in War Zone D and twelve other Viet Cong areas delegated to the
        Ambassador and the commander in Saigon, as asked in February. Since May 1963 each mission had needed the approval
        of the Assistant Secretary of State for Far Eastern Affairs and of Defense.
      n: '[[w.macv-command-history-1964]], 94–95. To check: State to Saigon, 1055, May 1963 (cited by [[w.macv-command-history-1964]],
        94 n.105, for the rule of 1963). See [[cal.1962-01-13.vietnam]].'
      src:
        c: a0f46f5c
        rows:
        - 'w.macv-command-history-1964 94–95: all'
        - 'via w.macv-command-history-1964 94 n.105: C'
    section: '196403'
- add:
    entry:
      id: cal.1964-03-10.vietnam-2
      when: Mar. 10
      date: '1964-03-10'
      thread: vietnam
      also:
      - laos
      c: 'MACV promulgates OPLAN 98-64: South Vietnamese operations across the border into Laos south of the 17th parallel,
        of growing intensity, first to prove the North''s infiltration and then to disrupt it, with American advice, planning,
        training and materiel. Covert: the men in mufti, the equipment unmarked, air strikes only by unmarked VNAF or Laotian
        planes. A uniformed companion plan, 98A, Mar. 13.'
      n: '[[w.macv-command-history-1964]], 163. To check: MACJ5, letter of promulgation to OPLAN 98-64, Mar. 10, 1964; MACJ5,
        letter of promulgation to OPLAN 98A, Mar. 13, 1964 (cited by [[w.macv-command-history-1964]], 163 n.41). See [[cal.1964-03-16.vietnam]].'
      src:
        c: 6d78fe25
        rows:
        - 'w.macv-command-history-1964 163: all'
        - 'via w.macv-command-history-1964 163 n.41a: A-B'
        - 'via w.macv-command-history-1964 163 n.41b: C'
    section: '196403'
- add:
    entry:
      id: cal.1964-03-12.vietnam
      when: Mar. 12
      date: '1964-03-12'
      thread: vietnam
      c: 'MACV''s study of folding the Military Assistance Advisory Group into the command, ordered by McNamara during his
        visit, goes to CINCPAC: feasible, in effect within three months; a more responsive command, some 85 spaces saved,
        a year to settle fully. In February Harkins had advised against any change.'
      n: '[[w.macv-command-history-1964]], 9, 10–11. To check: COMUSMACV, MACJ01 1227, 171055Z Feb 64 (cited by [[w.macv-command-history-1964]],
        10 n.2); COMUSMACV, MACJ01 1867, 111034Z Mar 64 (cited by [[w.macv-command-history-1964]], 11 n.5, for McNamara''s
        order); MACJ1, Study on Reorganization of Hq MACV and MAAG, Ser 5300/0219, Mar. 12, 1964 (cited by [[w.macv-command-history-1964]],
        11 n.6). See [[cal.1964-01-27.vietnam]]. Names: McNamara, Harkins.'
      src:
        c: ebae870d
        rows:
        - 'w.macv-command-history-1964 10–11: all'
        - 'w.macv-command-history-1964 9: C'
        - 'via w.macv-command-history-1964 10 n.2: C'
        - 'via w.macv-command-history-1964 11 n.5: A'
        - 'via w.macv-command-history-1964 11 n.6: A-B'
      tags:
      - name:mcnamara-robert-s
      - name:harkins-paul-d
    section: '196403'
- add:
    entry:
      id: cal.1964-04-10.vietnam
      when: Apr. 10
      date: '1964-04-10'
      thread: vietnam
      c: The Joint Chiefs approve folding the advisory group into MACV, for immediate implementation, against CINCPAC's opposition.
        MACV to remain a subordinate unified command under CINCPAC.
      n: '[[w.macv-command-history-1964]], 11–12. To check: CINCPAC to COMUSMACV, 022306Z Apr 64 (cited by [[w.macv-command-history-1964]],
        11 n.9, for CINCPAC''s opposition); JCS to COMUSMACV, 5802, 101545Z Apr 64 (cited by [[w.macv-command-history-1964]],
        12 n.10). See [[cal.1964-03-12.vietnam]].'
      src:
        c: 4805fdfb
        rows:
        - 'w.macv-command-history-1964 11–12: all'
        - 'via w.macv-command-history-1964 11 n.9: A'
        - 'via w.macv-command-history-1964 12 n.10: all'
    section: '196404'
- add:
    entry:
      id: cal.1964-04-15.vietnam
      when: Apr. 15
      date: '1964-04-15'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'MACV publishes OPLAN 37-64, on CINCPAC''s plan and McNamara''s recommendation after his visit: actions in any order
        or sequence of escalation to force Hanoi to stop supporting the insurgents, chiefly by South Vietnamese forces with
        American advice, planning and materiel. American air support beyond VNAF''s means: reconnaissance, Farm Gate strikes,
        overt strikes by B-57s.'
      n: '[[w.macv-command-history-1964]], 163. To check: MACJ5, letter of promulgation to COMUSMACV OPLAN 37-64, Apr. 15,
        1964 (cited by [[w.macv-command-history-1964]], 163 n.38); CINCPAC, letter of promulgation to OPLAN 37-64, Ser 000115,
        Mar. 30, 1964 (cited by [[w.macv-command-history-1964]], 163 n.39, for CINCPAC''s plan); JCS 5375, 181522Z Mar 64
        (cited by [[w.macv-command-history-1964]], 163 n.40, for McNamara''s recommendation). See [[cal.1964-03-16.vietnam]].
        Names: McNamara.'
      src:
        c: b289dde1
        rows:
        - 'w.macv-command-history-1964 163: all'
        - 'via w.macv-command-history-1964 163 n.38: all'
        - 'via w.macv-command-history-1964 163 n.39: A'
        - 'via w.macv-command-history-1964 163 n.40: A'
      tags:
      - name:mcnamara-robert-s
    section: '196404'
- add:
    entry:
      id: cal.1964-05-15.vietnam-2
      when: May 15
      date: '1964-05-15'
      thread: vietnam
      c: The Military Assistance Advisory Group, Vietnam, consolidated into MACV, which takes on the whole of both headquarters'
        functions.
      n: '[[w.macv-command-history-1964]], 14. To check: MAAG General Order 165, May 14, 1964; MACV General Order 49, May
        15, 1964 (cited by [[w.macv-command-history-1964]], 14 nn.13–14). See [[cal.1964-03-12.vietnam]].'
      src:
        c: 29e92d92
        rows:
        - 'w.macv-command-history-1964 14: all'
        - 'via w.macv-command-history-1964 14 n.13: all'
        - 'via w.macv-command-history-1964 14 n.14: all'
    section: '196405'
- add:
    entry:
      id: cal.1964-06-10.vietnam-force-levels
      when: June 10
      date: '1964-06-10'
      thread: vietnam-force-levels
      c: The Joint Chiefs approve keeping the Marine helicopter squadron at Đà Nẵng indefinitely, for I Corps, as MACV asked
        May 28. It was to have handed its aircraft to the VNAF by June 30; by MACV's count it flew some four-fifths of the
        troop lifts there.
      n: '[[w.macv-command-history-1964]], 58. To check: COMUSMACV, MACJ31 4325, 281755Z May 64 (cited by [[w.macv-command-history-1964]],
        58 n.30, for the request); JCS 6777, 102230Z Jun 64 (cited by [[w.macv-command-history-1964]], 58 n.31). See [[cal.1963-11-26.vietnam]].'
      src:
        c: c7744b0b
        rows:
        - 'w.macv-command-history-1964 58: all'
        - 'via w.macv-command-history-1964 58 n.30: A'
        - 'via w.macv-command-history-1964 58 n.31: A'
      tags:
      - place:da-nang
    section: '196406'
- add:
    entry:
      id: cal.1964-07-28.vietnam-force-levels
      when: July 28
      date: '1964-07-28'
      thread: vietnam-force-levels
      c: 'MACV''s plan for the buildup agreed at Honolulu goes to the Joint Chiefs: advisers and units to arrive Aug. 1–Dec.
        1, the Special Forces Sept. 15–Feb. 1, 1965. The increase first estimated at about 4,200 men, then 4,800; advisory
        teams for 113 of the 237 districts; the Special Forces from 523 to 1,299, on permanent assignment.'
      n: '[[w.macv-command-history-1964]], 15. To check: COMUSMACV, MACJ32 5380, 240005Z Jun 64 (cited by [[w.macv-command-history-1964]],
        15 n.16, for the advisers); COMUSMACV, MACJ32 4661, 060839Z Jun 64 (cited by [[w.macv-command-history-1964]], 15 n.17,
        for the Special Forces); COMUSMACV, MACJ32 6180, 161045Z Jul 64 (cited by [[w.macv-command-history-1964]], 15 n.18,
        for the estimates); COMUSMACV, MACJ1 7044, 281229Z Jul 64 (cited by [[w.macv-command-history-1964]], 15 n.19, for
        the plan). See [[cal.1964-07-27.vietnam]].'
      src:
        c: 86b85d3c
        rows:
        - 'w.macv-command-history-1964 15: all'
        - 'via w.macv-command-history-1964 15 n.16: C'
        - 'via w.macv-command-history-1964 15 n.17: D'
        - 'via w.macv-command-history-1964 15 n.18: B, D'
        - 'via w.macv-command-history-1964 15 n.19: A'
    section: '196407'
- add:
    entry:
      id: cal.1964-07-29.vietnam
      when: July 29
      date: '1964-07-29'
      thread: vietnam
      c: Herbicides. At MACV's request, State delegates approval of all crop destruction missions to the Ambassador and the
        commander in Saigon. Of 5,690 hectares of crops destroyed in 1964, 4,865 after this; 79 in 1963.
      n: '[[w.macv-command-history-1964]], 95. To check: Saigon to State, 294, July 29, 1964 (cited by [[w.macv-command-history-1964]],
        95 n.110). See [[cal.1964-03-03.vietnam]].'
      src:
        c: a629e0c9
        rows:
        - 'w.macv-command-history-1964 95: all'
        - 'via w.macv-command-history-1964 95 n.110: B'
    section: '196407'
- add:
    entry:
      id: cal.1964-08-03.laos
      when: Aug. 3
      date: '1964-08-03'
      thread: laos
      also:
      - vietnam
      c: 'COMUSSEASIA''s outline plan to occupy the Laos panhandle, on the Joint Chiefs'' and CINCPAC''s queries of June:
        forces prepositioned, the panhandle sealed, the secured area carried to the Plain of Jars, then the government''s
        control restored and the American forces withdrawn. Beside the Laotian forces, eight divisions, five American, and
        seven brigades or regimental combat teams, two American.'
      n: '[[w.macv-command-history-1964]], 164. To check: COMUSSEASIA, Outline Contingency Plan for Military Operations to
        Occupy Laos Panhandle, Aug. 3, 1964 (cited by [[w.macv-command-history-1964]], 164 n.45); JCS 6676, 052237Z Jun 64;
        JCS 6647, 052217Z Jun 64; CINCPAC, 100448Z Jun 64; CINCPAC, 132345Z Jun 64 (cited by [[w.macv-command-history-1964]],
        164 n.44, for the queries). See [[cal.1964-03-10.vietnam-2]].'
      src:
        c: c0556d1e
        rows:
        - 'w.macv-command-history-1964 164: all'
        - 'via w.macv-command-history-1964 164 n.45: all'
        - 'via w.macv-command-history-1964 164 n.44a: A'
        - 'via w.macv-command-history-1964 164 n.44b: A'
        - 'via w.macv-command-history-1964 164 n.44c: A'
        - 'via w.macv-command-history-1964 164 n.44d: A'
    section: '196408'
- add:
    entry:
      id: cal.1964-08-06.vietnam-force-levels
      when: Aug. 6
      date: '1964-08-06'
      thread: vietnam-force-levels
      c: 'The Army designates the 5th Special Forces Group for duty in South Vietnam from Oct. 1: 1,299 men on permanent assignment
        in place of the detachments on temporary duty, 707 men. MACV''s formal request, July 22.'
      n: '[[w.macv-command-history-1964]], 57. To check: COMUSMACV to CINCPAC, 220347Z Jul 64 (cited by [[w.macv-command-history-1964]],
        57 n.21, for the request); DA to COMUSMACV, 062324Z Aug 64 (cited by [[w.macv-command-history-1964]], 57 n.22). See
        [[cal.1964-07-28.vietnam-force-levels]].'
      src:
        c: 110cbb81
        rows:
        - 'w.macv-command-history-1964 57: all'
        - 'via w.macv-command-history-1964 57 n.21: B'
        - 'via w.macv-command-history-1964 57 n.22: A'
    section: '196408'
- add:
    entry:
      id: cal.1964-08-12.vietnam-2
      when: Aug. 12
      date: '1964-08-12'
      thread: vietnam
      c: 'Hop Tac. III Corps issues Operations Order Hop Tac 1: pacification across the military boundaries in the provinces
        around Saigon, planned by an American task force at Westmoreland''s order. Under way in September.'
      n: '[[w.macv-command-history-1964]], 68. To check: Hq MACV, Terms of reference, Planning Task Force, June 23, 1964 (cited
        by [[w.macv-command-history-1964]], 68 n.47); Operations Order Hop Tac 1, Hq III Corps, Aug. 12, 1964 (cited by [[w.macv-command-history-1964]],
        68 n.48). Names: Westmoreland.'
      src:
        c: f2e58f7f
        rows:
        - 'w.macv-command-history-1964 68: all'
        - 'via w.macv-command-history-1964 68 n.47: B'
        - 'via w.macv-command-history-1964 68 n.48: B'
      tags:
      - name:westmoreland-william
      - place:saigon
    section: '196408'
- add:
    entry:
      id: cal.1964-08-15.vietnam-force-levels
      when: Aug. 15
      date: '1964-08-15'
      thread: vietnam-force-levels
      c: 'Westmoreland to CINCPAC after the Gulf of Tonkin: Hanoi''s likeliest reply, if any, a ground attack on Huế or Đà
        Nẵng by North Vietnamese units slipped into the northern provinces. He asks a logistic command and a signal battalion
        for the Army''s support command, one Marine and two Army Hawk battalions, and certain units alerted to deploy.'
      n: '[[w.macv-command-history-1964]], 101, 162. To check: COMUSMACV to CINCPAC, MACJ3 8149, 150123Z Aug 64 (cited by
        [[w.macv-command-history-1964]], 162 n.30, and 101 n.128). See [[cal.1964-08-02.vietnam]]. Names: Westmoreland.'
      src:
        c: b194dc8c
        rows:
        - 'w.macv-command-history-1964 162: A-B'
        - 'w.macv-command-history-1964 101: B'
        - 'via w.macv-command-history-1964 162 n.30: A-B'
        - 'via w.macv-command-history-1964 101 n.128: B'
      tags:
      - name:westmoreland-william
    section: '196408'
- add:
    entry:
      id: cal.1964-09-20.vietnam
      when: Sept. 20
      date: '1964-09-20'
      thread: vietnam
      c: 'The Rhade rise in Darlac and Quảng Đức. Montagnard strike forces of the Civilian Irregular Defense Groups, with
        American Special Forces advisers, rebel the night of Sept. 19–20 at four camps, to seize their Vietnamese leaders
        and take Ban Mê Thuột and Gia Nghĩa; Ban Mê Thuột saved, its garrison warned by American advisers. Their aims, by
        the Embassy''s account: better treatment, Montagnards in office, aid, autonomy.'
      n: '[FRUS 1964–68, I, doc. 358](https://history.state.gov/historicaldocuments/frus1964-68v01/d358) (Saigon 937, Sept.
        24: the aims). [[w.macv-command-history-1964]], 122–24, 192 (the camp, Bon Sar Pa). To check: Hq 5th Special Forces
        Group, "Historical Resume of Montagnard Uprising, Sep 1964," undated (cited by [[w.macv-command-history-1964]], 122
        n.169).'
      src:
        c: 2dc1a86e
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d358: A, D'
        - 'w.macv-command-history-1964 122–24, 192: A-C'
        - 'via w.macv-command-history-1964 122 n.169: A-C'
      tags:
      - province:darlac
      - province:quang-duc
      - place:ban-me-thuot
      - place:gia-nghia
    section: '196409'
- add:
    entry:
      id: cal.1964-09-28.vietnam
      when: Sept. 28
      date: '1964-09-28'
      thread: vietnam
      c: 'Gas. Westmoreland sends CINCPAC his plans for riot control munitions, asked in June: CS gas to be used first by
        the South Vietnamese, who have the means, without heavy American involvement. American policy bars American use except
        in defense of American lives.'
      n: '[[w.macv-command-history-1964]], 95–96. To check: CINCPAC to COMUSMACV, 242259Z Jun 64 (cited by [[w.macv-command-history-1964]],
        95 n.112, for the request). Names: Westmoreland.'
      src:
        c: d0caab5f
        rows:
        - 'w.macv-command-history-1964 95–96: all'
        - 'via w.macv-command-history-1964 95 n.112: B'
      tags:
      - name:westmoreland-william
    section: '196409'
- add:
    entry:
      id: cal.1964-10-01.vietnam-force-levels
      when: Oct. 1
      date: '1964-10-01'
      thread: vietnam-force-levels
      c: Westmoreland recommends to CINCPAC that the approved force structure of South Vietnam's armed forces, set through
        fiscal 1967, be carried through fiscal 1974. The Joint Strategic Objectives Plan had assumed the insurgency over before
        fiscal 1968.
      n: '[[w.macv-command-history-1964]], 155. See [[cal.1964-03-16.vietnam]]. Names: Westmoreland.'
      src:
        c: 407c5d9e
        rows:
        - 'w.macv-command-history-1964 155: all'
      tags:
      - name:westmoreland-william
    section: '196410'
- add:
    entry:
      id: cal.1964-10-31.vietnam-order-of-battle
      when: Oct. 31
      date: '1964-10-31'
      thread: vietnam-order-of-battle
      also:
      - vietnam
      c: 'MACV''s infiltration study, from the interrogation of 187 prisoners and defectors: over 34,000 men infiltrated from
        the North since 1959, perhaps 45,000. In 1964, 4,700 reported by August, about three-quarters young draftees of North
        Vietnamese origin, the veterans of the French war used up.'
      n: '[FRUS 1964–68, I, doc. 392](https://history.state.gov/historicaldocuments/frus1964-68v01/d392). [[w.macv-command-history-1964]],
        47 (the study, infiltration in 1964). Check: the History, 47, citing the study, has infiltration add some 7,000 men
        in 1964, about 90 percent draftees.'
      src:
        c: 13af9972
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d392: all'
        - 'w.macv-command-history-1964 47: A'
        - 'via w.macv-command-history-1964 47 n.30: A'
    section: '196410'
- add:
    entry:
      id: cal.1964-10-31.vietnam-saigon
      when: Oct. 31
      date: '1964-10-31'
      thread: vietnam-saigon
      c: 'Westmoreland to Taylor, "U.S. Posture Toward the Emerging GVN": be "tougher and more exacting" about its performance.
        Saigon''s officials take American aid as certain, without quid pro quo; the government "is not winning the war."'
      n: '[FRUS 1964–68, I, doc. 391](https://history.state.gov/historicaldocuments/frus1964-68v01/d391). Names: Westmoreland,
        Taylor.'
      src:
        c: 576c704d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d391: all'
      tags:
      - name:westmoreland-william
      - name:taylor-maxwell
    section: '196410'
- add:
    entry:
      id: cal.1964-11-24.vietnam-force-levels
      when: Nov. 24
      date: '1964-11-24'
      thread: vietnam-force-levels
      c: 'MACV asks CINCPAC to approve Alternative 1 of its joint survey of the South Vietnamese forces: 31,459 more regulars,
        35,387 Regional and 79,194 Popular Forces, for progress in the priority Hop Tac areas; $125.8 million the first year.
        The Embassy recommends the same to State.'
      n: '[[w.macv-command-history-1964]], 61–62. To check: COMUSMACV, MACJ3 14864, 241055Z Nov 64; Saigon 1623, Nov. 24,
        1964 (cited by [[w.macv-command-history-1964]], 62 n.33). See [[cal.1964-10-01.vietnam-force-levels]].'
      src:
        c: a91c2d23
        rows:
        - 'w.macv-command-history-1964 61–62: all'
        - 'via w.macv-command-history-1964 62 n.33a: A'
        - 'via w.macv-command-history-1964 62 n.33b: C'
    section: '196411'
- add:
    entry:
      id: cal.1964-12-12.laos
      when: Dec. 12
      date: '1964-12-12'
      thread: laos
      also:
      - vietnam-air-war
      c: 'Barrel Roll begins: armed reconnaissance and strikes by Second Air Division planes on Route 8 in the panhandle,
        a strong point on Route 12 the secondary target. Five missions by year''s end, three by the Air Force, two by the
        Navy; little seen on the roads.'
      n: '[[w.macv-command-history-1964]], 113. To check: JCS to COMUSMACV, 112144Z Dec 64 (cited by [[w.macv-command-history-1964]],
        113 n.167, for the program). Check: the first mission''s day, against the Air Force''s and the Navy''s histories.
        See [[cal.1964-12-10.laos]].'
      src:
        c: 4a9170c0
        rows:
        - 'w.macv-command-history-1964 113: all'
        - 'via w.macv-command-history-1964 113 n.167: A'
    section: '196412'
- add:
    entry:
      id: cal.1964-12-25.vietnam
      when: Dec. 25
      date: '1964-12-25'
      thread: vietnam
      also:
      - vietnam-prisoners
      c: 'Tây Ninh Province. A combined operation, at the South Vietnamese army''s request, the first planned with riot control
        munitions: some 870 grenades and 300 pounds of bulk CS dropped on a suspected Viet Cong camp, in hope of freeing American
        prisoners. The camp found abandoned.'
      n: '[[w.macv-command-history-1964]], 96. To check: MACV MILREP, Dec. 19–26, 1964 (cited by [[w.macv-command-history-1964]],
        96 n.113). See [[cal.1964-09-28.vietnam]].'
      src:
        c: d71bb9b6
        rows:
        - 'w.macv-command-history-1964 96: all'
        - 'via w.macv-command-history-1964 96 n.113: B-C'
      tags:
      - province:tay-ninh
    section: '196412'
- edit:
    id: cal.1964-07-27.vietnam
    base: a2d1bbea
    set:
      n: 'FRUS 1964–68, I, docs. [236](https://history.state.gov/historicaldocuments/frus1964-68v01/d236), [242](https://history.state.gov/historicaldocuments/frus1964-68v01/d242),
        [249](https://history.state.gov/historicaldocuments/frus1964-68v01/d249). [[w.gibbons-u-s-government-and]], II, 282
        (the decision of July 27: 5,000 more, the Vietnamese told). [[w.logevall-choosing-war]], 184, 189 (Khánh''s "march
