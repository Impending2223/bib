- add:
    entry:
      id: cal.1961-01-03.congress
      when: Jan. 3
      date: '1961-01-03'
      thread: congress
      c: 'Senate Democrats in caucus. Mansfield, Johnson''s choice to succeed him as majority leader, moves that Johnson preside over the caucus as Vice President. Gore against: "This caucus is not open to former senators." Carried, 46–17.'
      n: '[[w.dallek-flawed-giant]], 8. To check: [[w.caro-passage-of-power]]. Names: Mansfield, Johnson, Gore. Check: Dallek gives Jan. 5, "seventeen days before taking office" (8), which would be Jan. 3.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
      - name:gore-albert-sr
    section: '196101'
- add:
    entry:
      id: cal.1963-06-03.civil-rights-bill
      when: June 3
      date: '1963-06-03'
      thread: civil-rights-bill
      c: 'Johnson to Sorensen by telephone, on the civil rights bill the papers report: "I''ve never seen it." A bill sent now would fail. First the President in the South, the moral issue "face to face"; then the Negro leaders; then the congressional leaders.'
      n: '[[w.dallek-flawed-giant]], 37 (from the conversation in the Vice Presidential Papers, Civil Rights, LBJ Library). Names: Johnson, Sorensen.'
      tags:
      - name:johnson-lyndon-b
      - name:sorensen-theodore-c
    section: '196306'
- add:
    entry:
      id: cal.1963-11-23.transition-and-staff
      when: Nov. 23
      date: '1963-11-23'
      thread: transition-and-staff
      c: 'The Cabinet Room, 2:30 p.m.: Johnson''s first Cabinet meeting. "I want you all to stay on. I need you."'
      n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 2 (LBJ Library; National Archives Catalog) (the meeting). [[w.dallek-flawed-giant]], 56 (the words). See [[cal.1963-11-22.succession]]. Names: Johnson. Check: Dallek''s text puts the meeting on Nov. 25 (56); his note (56 n.7) and the Daily Diary on Nov. 23.'
      tags:
      - name:johnson-lyndon-b
    section: '196311'
- add:
    entry:
      id: cal.1963-11-23.poverty
      when: Nov. 23
      date: '1963-11-23'
      thread: poverty
      c: 'Heller to Johnson: Kennedy had asked for a program against poverty. Johnson: "That''s my kind of program. We should push ahead full-tilt on this project."'
      n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 3 (LBJ Library; National Archives Catalog) (Heller with Johnson, 7:41 p.m.). [[w.dallek-flawed-giant]], 60. To check: [[w.gillette-launching-the-war-on]]. Names: Heller, Johnson, Kennedy.'
      tags:
      - name:heller-walter-w
      - name:johnson-lyndon-b
      - name:kennedy-john-f
    section: '196311'
