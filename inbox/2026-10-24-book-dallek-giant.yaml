      date: '1963-11-25'
      thread: economy
      c: 'Evening. Johnson with his economic advisers, Heller and Dillon among them: the tax cut accepted, the 1965 budget held under $100 billion. "We won''t have the votes to get it to the floor unless we tell them the budget will be about $100 billion." Byrd of the Finance Committee to be won so.'
      n: '[President''s Daily Diary, Nov. 25, 1963](https://catalog.archives.gov/id/192433), image 3 (LBJ Library; National Archives Catalog) (the day''s schedule: Dillon, Kermit Gordon and Heller, 8:45 p.m.). [[w.dallek-flawed-giant]], 60, 72 (from the notes of the meeting, Heller Papers, JFK Library, and Ackley''s, LBJ Library). See [[cal.1963-01-24.economy]]. Names: Johnson, Heller, Dillon, Harry F. Byrd.'
      tags:
      - name:johnson-lyndon-b
      - name:heller-walter-w
      - name:dillon-c-douglas
      - name:byrd-harry-f
    section: '196311'
- add:
    entry:
      id: cal.1963-12-23.foreign-aid
      when: Dec. 23
      date: '1963-12-23'
      thread: foreign-aid
      c: The White House, a Christmas party for the House, the absent Democrats called back for the aid appropriation. Johnson, on a chair in the State Dining Room, asks for the bill without Mundt's amendment; a committee promised to make aid cheaper. Halleck courted.
      n: '[[w.dallek-flawed-giant]], 70–71. To check: [[w.johnson-vantage-point]]. See [[cal.1963-11-15.foreign-aid]]. Names: Johnson, Mundt, Halleck.'
      tags:
      - name:johnson-lyndon-b
      - name:mundt-karl-e
      - name:halleck-charles-a
    section: '196312'
- add:
    entry:
      id: cal.1964-07-31.robert-kennedy
      when: July 31
      date: '1964-07-31'
      thread: robert-kennedy
      also:
      - elections-1964
      c: 'Lunch in the Mansion, four hours, with three reporters, of the *New York Times*, the *Herald Tribune* and the *Washington Post*: Johnson acts out his meeting with Robert Kennedy of July 29. At their next meeting Kennedy charges a breach of confidence; Johnson denies talking to the reporters.'
      n: '[[w.dallek-flawed-giant]], 142. See [[cal.1964-07-29.robert-kennedy]]. Names: Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
    section: '196407'
- add:
    entry:
      id: cal.1964-09-09.vietnam
      when: Sept. 9
      date: '1964-09-09'
      thread: vietnam
      c: 'The White House, 11 a.m.: Johnson with Taylor, Rusk, McNamara, McCone, Wheeler and McGeorge Bundy on the courses of action of Sept. 8. Strikes on the North to wait until "our side could defend itself in the streets of Saigon"; Johnson ready "to do more, when we had a base."'
      n: '[FRUS 1964–68, I, doc. 343](https://history.state.gov/historicaldocuments/frus1964-68v01/d343). [[w.dallek-flawed-giant]], 239. Made public: FRUS 1964–68, I (1992). The order: [[cal.1964-09-10.vietnam]]. See [[cal.1964-08-02.vietnam]]. Names: Johnson, Taylor, Rusk, McNamara, McCone, Wheeler, McGeorge Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:mccone-john-a
      - name:wheeler-earle
      - name:bundy-mcgeorge
    section: '196409'
- add:
    entry:
      id: cal.1964-09-14.elections-1964
      when: Sept. 14
      date: '1964-09-14'
      thread: elections-1964
      also:
      - goldwater
      c: 'Valenti to Moyers, Feldman and Dutton: "the biggest asset we have is Goldwater''s alleged instability in re atom and hydrogen bombs. We MUST NOT let this slip away." Feldman and Dutton''s committee of sixteen, the "five o''clock club," meets at 9:30 a.m. and 6 p.m.: books against Goldwater, rebuttals, questions for the reporters with him. Feldman reports to Johnson almost daily.'
      n: '[[w.dallek-flawed-giant]], 174–75 (Valenti''s memorandum, WHCF: EX/PL2, LBJ Library). See [[cal.1964-09-07.elections-1964]]. Names: Valenti, Moyers, Feldman, Dutton, Goldwater, Johnson. Check: the day the committee first met.'
      tags:
      - name:valenti-jack
      - name:moyers-bill
      - name:feldman-myer
      - name:dutton-frederick-g
      - name:johnson-lyndon-b
    section: '196409'
- add:
    entry:
      id: cal.1965-05-10.court
      when: May 10
      date: '1965-05-10'
      thread: court
      c: 'Johnson asks the FBI for background checks on Goldberg and Fortas: Goldberg to Health, Education, and Welfare, Celebrezze to the Court of Appeals, Fortas to Goldberg''s seat. Goldberg "happy on [the] Court."'
      n: '[[w.dallek-flawed-giant]], 234 (Stegall to DeLoach, May 10, 1965, WHCF: Aides: Macy, LBJ Library). To check: [[w.kalman-abe-fortas]]; [[w.murphy-fortas]]. Names: Johnson, Goldberg, Fortas, Celebrezze.'
      tags:
      - name:johnson-lyndon-b
      - name:goldberg-arthur-j
      - name:fortas-abe
      - name:celebrezze-anthony-j
    section: '196505'
- add:
    entry:
      id: cal.1965-06-23.vietnam-july-decision
      when: June 23
      date: '1965-06-23'
      thread: vietnam-july-decision
      c: 'The Cabinet Room, evening. Ball: stop at 100,000 men, a trial of three months, perhaps then a shift to Thailand. Rusk and McNamara against; McNamara for more forces as needed. Johnson asks Ball and McNamara for studies of the next three months, in a week.'
      n: 'FRUS 1964–68, III, docs. [15](https://history.state.gov/historicaldocuments/frus1964-68v03/d15), [16](https://history.state.gov/historicaldocuments/frus1964-68v03/d16) (editorial note). [[w.dallek-flawed-giant]], 272. Made public: FRUS 1964–68, III (1996). To check: [[w.ball-past-has-another-pattern]]. Bibliography: [[cal.1965-07-01.vietnam]]. Names: Ball, Rusk, McNamara, Johnson.'
      tags:
      - name:ball-george-w
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - ok:thread-first
    section: '196506'
- add:
    entry:
      id: cal.1965-07-02.vietnam-july-decision
      when: July 2
      date: '1965-07-02'
      thread: vietnam-july-decision
      c: 'Johnson puts off the decisions to the end of the month: McNamara to Saigon in mid-July; Harriman to Moscow on a reconvened Geneva conference; Ball to explore contacts with Hanoi and the Viet Cong.'
      n: '[[w.dallek-flawed-giant]], 272 (from McGeorge Bundy''s manuscript history). See [[cal.1965-07-01.vietnam]]. Names: Johnson, McNamara, Harriman, Ball.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:harriman-w-averell
      - name:ball-george-w
    section: '196507'
- add:
    entry:
      id: cal.1965-07-16.vietnam-july-decision
      when: July 16
      date: '1965-07-16'
      thread: vietnam-july-decision
      c: 'Johnson to Vance: no supplemental request to Congress of more than $300 to $400 million before January; a larger one "will kill" the domestic program.'
      n: '[[w.dallek-flawed-giant]], 274. To check: [[w.vandemark-into-the-quagmire]]. See [[cal.1965-07-01.vietnam]]. Names: Johnson, Vance.'
      tags:
      - name:johnson-lyndon-b
      - name:vance-cyrus
    section: '196507'
- add:
    entry:
      id: cal.1965-07-19.court
      when: July 19
      date: '1965-07-19'
      thread: court
      c: 'Fortas to Johnson, declining Goldberg''s seat "with a heart full of gratitude": he can serve the Johnsons and his firm better off the Court.'
      n: '[[w.dallek-flawed-giant]], 235 (Fortas to Johnson, July 19, 1965, WHCF: CF: EX/FG535, LBJ Library). See [[cal.1965-05-10.court]]. Names: Fortas, Johnson, Goldberg.'
      tags:
      - name:fortas-abe
      - name:johnson-lyndon-b
      - name:goldberg-arthur-j
    section: '196507'
- add:
    entry:
      id: cal.1965-08-17.steel
      when: Aug. 17
      date: '1965-08-17'
      thread: steel
      c: 'Abel of the Steelworkers at the White House: "I made commitments to the members who elected me." Johnson likens him to Russell against the civil rights bill.'
      n: '[[w.dallek-flawed-giant]], 304. To check: [[w.califano-triumph-and-tragedy-of]]. See [[cal.1963-04-11.steel]]. Names: Abel, Johnson, Russell.'
      tags:
      - name:abel-i-w
      - name:johnson-lyndon-b
      - name:russell-richard-b
    section: '196508'
- add:
    entry:
      id: cal.1965-12-29.program
      when: Dec. 29
      date: '1965-12-29'
      thread: program
      c: Johnson with Califano approves "a massive second-year program that would astound the Congress and the country" for the State of the Union.
      n: '[[w.dallek-flawed-giant]], 302. To check: [[w.califano-triumph-and-tragedy-of]]. See [[cal.1965-01-04.program]]. Names: Johnson, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
    section: '196512'
- add:
    entry:
      id: cal.1966-06-01.vietnam
      when: June 1
      date: '1966-06-01'
      thread: vietnam
      c: Fulbright with Johnson at the White House, nearly two hours, Johnson doing most of the talking on the war's choices. Fulbright still without confidence in the policy; he will "keep in touch."
      n: '[[w.dallek-flawed-giant]], 370–71. See [[cal.1966-02-04.vietnam]]. Names: Fulbright, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
    section: '196606'
- add:
    entry:
      id: cal.1966-06-15.vietnam
      when: June 15
      date: '1966-06-15'
      thread: vietnam
      c: 'After the reception for a delegation from Austria, fifty minutes with Fulbright: by Fulbright''s account "a highly emotional harangue," Johnson set on force enough to bring the Communists to a settlement.'
      n: '[[w.dallek-flawed-giant]], 371–72. See [[cal.1966-06-01.vietnam]]. Names: Fulbright, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
    section: '196606'
- add:
    entry:
      id: cal.1967-06-11.court
      when: June 11
      date: '1967-06-11'
      thread: court
      c: 'Johnson asks Larry Temple, of Connally''s staff, to be a special counsel, and about the Court: "I''m thinking of appointing a black. Who would you recommend?" Temple: Judge Higginbotham. Johnson wants a name the country knows.'
      n: '[[w.dallek-flawed-giant]], 441. See [[cal.1967-02-28.court]]. Names: Johnson, Temple, Connally, Higginbotham.'
      tags:
      - name:johnson-lyndon-b
      - name:temple-larry
      - name:connally-john
      - name:higginbotham-a-leon-jr
    section: '196706'
- add:
    entry:
      id: cal.1967-09-08.elections-1968
      when: Sept. 8
      date: '1967-09-08'
      thread: elections-1968
      c: 'The LBJ Ranch, eight hours: Johnson with Connally, Pickle and Mrs. Johnson on running again. Connally doubts he can be reelected; Johnson: out of the race, free to make peace; Pickle fears for the party''s seats in Congress; Mrs. Johnson, for his health. A decision not to run, tentative.'
      n: '[[w.dallek-flawed-giant]], 523–24 (from Mrs. Johnson''s diary and Pickle''s account). To check: [[w.johnson-white-house-diary]]. Names: Johnson, Connally, Pickle, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:connally-john
      - name:pickle-james-j
      - name:johnson-lady-bird
    section: '196709'
- add:
    entry:
      id: cal.1967-09-26.vietnam-pennsylvania
      when: Sept. 26
      date: '1967-09-26'
      thread: vietnam-pennsylvania
      c: 'The White House, 1:15 p.m.: Johnson with McNamara, Katzenbach, Helms, Rostow and Christian. Hanoi "playing us for suckers. They have no more intention of talking than we have of surrendering." Katzenbach to write a memorandum on keeping the Paris channel or "wrapping it up."'
      n: '[FRUS 1964–68, V, doc. 336](https://history.state.gov/historicaldocuments/frus1964-68v05/d336). [[w.dallek-flawed-giant]], 481. Made public: FRUS 1964–68, V (2002). See [[cal.1967-07-21.vietnam]]. Names: Johnson, McNamara, Katzenbach, Helms, Rostow, Christian.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:katzenbach-nicholas
      - name:helms-richard
      - name:rostow-walt-w
      - name:christian-george
    section: '196709'
- add:
    entry:
      id: cal.1968-03-08.elections-1968
      when: Mar. 8
      date: '1968-03-08'
      thread: elections-1968
      c: 'Johnson tells his aides to go ahead: organizing for the primaries and the convention''s delegates.'
      n: '[[w.dallek-flawed-giant]], 527. See [[cal.1967-09-08.elections-1968]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
    section: '196803'
- add:
    entry:
      id: cal.1968-04-07.elections-1968
      when: Apr. 7
      date: '1968-04-07'
      thread: elections-1968
      c: 'Irwin Miller, of the Republicans for Johnson of 1964, asks whether Johnson would object to his heading a Draft Rockefeller committee. Johnson: "a full-speed go-ahead."'
      n: '[[w.dallek-flawed-giant]], 545 (Califano to Johnson, Apr. 7, 1968, WHCF: Aides: Califano, LBJ Library). To check: [[w.califano-triumph-and-tragedy-of]]. See [[cal.1968-03-21.elections-1968]]. Names: Miller, Rockefeller, Johnson.'
      tags:
      - name:miller-j-irwin
      - name:rockefeller-nelson
      - name:johnson-lyndon-b
    section: '196804'
- add:
    entry:
      id: cal.1968-07-01.court-fortas
      when: July 1
      date: '1968-07-01'
      thread: court-fortas
      c: 'Russell to Johnson: released from any commitment on Fortas and Thornberry. The nomination of Alexander Lawrence to the district court in Georgia, pending since February, held back, he concludes, until after the Court nominations.'
      n: '[[w.dallek-flawed-giant]], 560–61. See [[cal.1968-06-26.court]]. Names: Russell, Johnson, Fortas, Thornberry.'
      tags:
      - name:russell-richard-b
      - name:johnson-lyndon-b
      - name:fortas-abe
      - name:thornberry-william-h
    section: '196807'
- add:
    entry:
      id: cal.1968-07-09.elections-1968
      when: July 9
      date: '1968-07-09'
      thread: elections-1968
      c: Boggs, chairman of the platform committee, asks the White House for direction; Johnson agrees to see him.
      n: '[[w.dallek-flawed-giant]], 574 (Jim Jones''s memorandum, July 9, 1968, WHCF: EX/PL1, LBJ Library). See [[cal.1968-04-27.elections-1968]]. Names: Boggs, Johnson.'
      tags:
      - name:boggs-hale
      - name:johnson-lyndon-b
    section: '196807'
- add:
    entry:
      id: cal.1968-07-25.elections-1968
      when: July 25
      date: '1968-07-25'
      thread: elections-1968
      c: 'Humphrey shows Johnson the draft of a speech on Vietnam, the NLF in the talks hinted at. Johnson: it would endanger his sons-in-law and the peace. By Humphrey''s account: "If I announced this, he''d destroy me for the presidency."'
      n: '[[w.dallek-flawed-giant]], 571. To check: [[w.solberg-hubert-humphrey]]. See [[cal.1968-04-27.elections-1968]]. Names: Humphrey, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
    section: '196807'
- add:
    entry:
      id: cal.1968-08-04.vietnam-paris
      when: Aug. 4
      date: '1968-08-04'
      thread: vietnam-paris
      c: 'Clifford alone with Johnson: stop the bombing; three and a half years of trying to win militarily, "[It] cannot be done"; press Saigon to talk. Johnson: "I don''t agree with a word that you have said."'
      n: '[[w.dallek-flawed-giant]], 568 (Clifford''s "Talks with LBJ," Aug. 4, 1968, Clifford Papers). To check: [[w.clifford-counsel-to-the-president-2]]. See [[cal.1968-07-29.vietnam]]. Names: Clifford, Johnson.'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
    section: '196808'
- add:
    entry:
      id: cal.1968-08-24.elections-1968
      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968
      c: 'Boggs called from Chicago to the White House, on the Czech crisis by the announcement. Westmoreland reads him Abrams''s cable of Aug. 23: a halt would bring "a several-fold increase in U.S. and allied casualties in the First Corps." He takes it back to the platform committee.'
      n: '[[w.dallek-flawed-giant]], 575. See [[cal.1968-07-09.elections-1968]]. Names: Boggs, Westmoreland, Abrams, Johnson.'
      tags:
      - name:boggs-hale
      - name:westmoreland-william
      - name:abrams-creighton
      - name:johnson-lyndon-b
    section: '196808'
- add:
    entry:
      id: cal.1968-09-15.elections-1968
      when: Sept. 15
      date: '1968-09-15'
      thread: elections-1968
      c: 'Billy Graham brings Johnson six points from Nixon: he will never embarrass Johnson; a working relationship, his advice sought; special assignments after the election; a major share of the credit when Vietnam is settled. Johnson: he will support Humphrey loyally, and cooperate with Nixon if he wins.'
      n: '[[w.dallek-flawed-giant]], 578 (Graham''s memorandum). See [[cal.1968-09-10.elections-1968]]. Names: Graham, Nixon, Johnson, Humphrey.'
      tags:
      - name:graham-billy
      - name:nixon-richard-m
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
    section: '196809'
- add:
    entry:
      id: cal.1963-12-03.foreign-aid
      when: Dec. 3
      date: '1963-12-03'
      thread: foreign-aid
      c: 'Leadership breakfast. Johnson on the tax cut: "We have been a year in doing it. [We] can''t expect better results in a week." Civil rights before the committee since May, no hearings before next year. The leaders offer a cotton bill; Johnson will not "launch my administration with a Cotton Bill."'
      n: '[[w.dallek-flawed-giant]], 70 (from the notes of the breakfast, Diary Backup, LBJ Library). See [[cal.1963-11-15.foreign-aid]]. Names: Johnson. Check: Dallek''s text gives Dec. 5, his note the breakfast of Dec. 3 (70 n.36).'
      tags:
      - name:johnson-lyndon-b
    section: '196312'
- add:
    entry:
      id: cal.1964-06-09.civil-rights-bill
      when: June 9
      date: '1964-06-09'
      thread: civil-rights-bill
      c: 'Eve of the cloture vote. Johnson to Humphrey by telephone: has he the sixty-seven votes? "I don''t want to know what you think. What''s the vote going to be?" Humphrey sure of sixty-six; that evening he works on three Democrats of the Southwest. Hayden''s vote promised earlier, for the Central Arizona project.'
      n: '[[w.dallek-flawed-giant]], 119. To check: [Johnson and Humphrey, 7:03 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-june-9-1964-0), Conversation WH6406-05-3667 (Miller Center); [[w.humphrey-education-of-a-public-1976]], 282. See [[cal.1964-03-26.civil-rights-bill]]. Names: Johnson, Humphrey, Hayden. Check: which call; the recordings give two, 1:06 and 7:03 p.m.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:hayden-carl
    section: '196406'
- add:
    entry:
      id: cal.1965-01-11.school-aid
      when: Jan. 11
      date: '1965-01-11'
      thread: school-aid
      c: 'Johnson to the Cabinet: "Tomorrow I am sending to the Congress the Message on Education.... I want—and I intend—education to be the cornerstone on which we build this administration''s program and record." Each department''s first priority to support it, "not merely the legislation, but the cause itself."'
      n: '[[w.dallek-flawed-giant]], 198. See [[cal.1965-01-04.program]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
    section: '196501'
- add:
    entry:
      id: cal.1965-03-16.vietnam
      when: Mar. 16
      date: '1965-03-16'
      thread: vietnam
      c: 'The White House, 1 p.m.: Johnson with Rusk, McNamara and McGeorge Bundy. Bundy''s agenda: four more weeks of Rolling Thunder, Barrel Roll, the Army Chief of Staff''s twenty-one points, ground forces. Johnson asks for "more ideas and more horsepower and more imagination"; every able-bodied South Vietnamese man under forty in the army.'
      n: '[FRUS 1964–68, II, doc. 200](https://history.state.gov/historicaldocuments/frus1964-68v02/d200) (the agenda). [[w.dallek-flawed-giant]], 256 (from Bundy''s notes of the meeting). Made public: FRUS 1964–68, II (1996). See [[cal.1965-02-13.vietnam]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
    section: '196503'
- add:
    entry:
      id: cal.1965-06-03.vietnam
      when: June 3
      date: '1965-06-03'
      thread: vietnam
      c: 'Leadership meeting. By Mansfield''s account Johnson hopeful on Santo Domingo, pessimistic on Vietnam: the Joint Chiefs and others for bombing Hanoi; he has put them off a week, to hear Taylor and for fear of China. No feelers from the other side.'
      n: 'Mansfield''s memorandum, [FRUS 1964–68, II, doc. 327](https://history.state.gov/historicaldocuments/frus1964-68v02/d327). [[w.dallek-flawed-giant]], 270. Made public: FRUS 1964–68, II (1996). To check: [[w.gibbons-u-s-government-and]], III, 276. See [[cal.1965-03-16.vietnam]]. Names: Mansfield, Johnson, Taylor.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
      - name:taylor-maxwell
    section: '196506'
- add:
    entry:
      id: cal.1965-06-05.vietnam
      when: June 5
      date: '1965-06-05'
      thread: vietnam
      c: 'Lunch at the State Department: Rusk, McNamara, Ball and the Bundys; Johnson joins them unasked. By William Bundy''s account "a reflective discussion of where we were headed," nothing decided. Johnson: would more Americans mean the Vietnamese would do less? McNamara: no sign of it.'
      n: '[[w.dallek-flawed-giant]], 270 (from William Bundy''s manuscript history of the war). See [[cal.1965-06-03.vietnam]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, William Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:bundy-william
    section: '196506'
- add:
    entry:
      id: cal.1965-07-29.medicare
      when: July 29
      date: '1965-07-29'
      thread: medicare
      c: 'Eleven officers of the American Medical Association at the White House. Johnson, quoting Byrnes: past quarrels done, the program to be made to work. He asks for doctors to serve Vietnam''s civilians by turns; they promise a program. Before the reporters Moyers calls in, the Association''s president: "we have every intention of obeying the new law."'
      n: '[[w.dallek-flawed-giant]], 210. To check: [[w.califano-triumph-and-tragedy-of]]; [[w.johnson-vantage-point]]. See [[cal.1965-01-07.medicare]]. Names: Johnson, Byrnes, Moyers. Check: Dallek''s text gives July 30, the day of the signing at Independence; his note, the Diary Backup of July 29 (210 n.73). The Daily Diary of July 30 shows no such meeting through 1:20 p.m. ([July 30, 1965](https://catalog.archives.gov/id/192456), images 1–2).'
      tags:
      - name:johnson-lyndon-b
      - name:byrnes-john-w
      - name:moyers-bill
    section: '196507'
- add:
    entry:
      id: cal.1966-06-17.vietnam-2
      when: June 17
      date: '1966-06-17'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'NSC, 6:05 p.m.: the strikes on the oil stores. Johnson: not to disrupt the oil reaching the forces in the field is to pay in American casualties. The decision waits on Rusk''s return from NATO, Ronning''s report from Hanoi, word to the allies. Goldberg alone against. "In order not to be lobbied on the decision, not another soul should be informed of this discussion."'
      n: '[FRUS 1964–68, IV, doc. 159](https://history.state.gov/historicaldocuments/frus1964-68v04/d159). [[w.dallek-flawed-giant]], 373. Made public: FRUS 1964–68, IV (1998). Names: Johnson, Rusk, Ronning, Goldberg.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:ronning-chester
      - name:goldberg-arthur-j
    section: '196606'
- add:
    entry:
      id: cal.1967-07-25.vietnam
      when: July 25
      date: '1967-07-25'
      thread: vietnam
      c: 'Johnson with the Senate leaders. Fulbright: the war "a hopeless venture," "ruining our domestic and our foreign policy. I will not support it any longer." Johnson: Fulbright has "a blind spot"; let them repeal the Gulf of Tonkin resolution. "You can tell the troops to come home."'
      n: '[[w.dallek-flawed-giant]], 474 (from Tom Johnson''s notes of the meeting, LBJ Library). Names: Johnson, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:fulbright-j-william
    section: '196707'
- add:
    entry:
      id: cal.1967-11-04.vietnam
      when: Nov. 4
      date: '1967-11-04'
      thread: vietnam
      c: 'Luncheon, 2:20 p.m.: Johnson with Rusk, McNamara, Rostow, Helms, Christian and Jim Jones. "We''ve been on dead center for the last year." Rusk, Wheeler, Helms and McNamara to make a pamphlet of three pages answering the questions on Vietnam.'
      n: 'Jones''s notes, [FRUS 1964–68, V, doc. 386](https://history.state.gov/historicaldocuments/frus1964-68v05/d386). [[w.dallek-flawed-giant]], 497. Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-02.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian, Jones, Wheeler. Check: Dallek calls it a Tuesday lunch (497); Jones''s notes give Saturday, Nov. 4.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:helms-richard
      - name:christian-george
      - name:jones-james-r
      - name:wheeler-earle
    section: '196711'
- add:
    entry:
      id: cal.1968-02-09.vietnam-tet
      when: Feb. 9
      date: '1968-02-09'
      thread: vietnam-tet
      c: 'The Cabinet Room, 11:02 a.m.: Johnson with the Joint Chiefs, Rusk, McNamara, Clifford and Rostow. "Hope for the best and expect the worst": extensions, call-ups, specialists. Should he ask for more than the Gulf of Tonkin resolution, a declaration of war? Rusk: no; a challenge to Moscow and Peking "in a way we have never challenged them before." Clifford: "a very strange contradiction in what we are saying and doing."'
      n: '[FRUS 1964–68, VI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v06/d64). [[w.dallek-flawed-giant]], 507. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-09.vietnam]]. Names: Johnson, Wheeler, Rusk, McNamara, Clifford, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:wheeler-earle
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:clifford-clark
      - name:rostow-walt-w
    section: '196802'
- add:
    entry:
      id: cal.1968-05-06.vietnam-paris
      when: May 6
      date: '1968-05-06'
      thread: vietnam-paris
      c: 'The White House, 1:20 p.m.: Johnson with Rusk, Clifford, Harriman, Vance and the others before the delegation leaves for Paris. Johnson pessimistic; the negotiators to be optimistic. Rusk: "They''ll come in with a roar." Clifford: they will not talk without a halt. Johnson: "What would you do about stopping the bombing?" Nothing settled.'
      n: '[FRUS 1964–68, VI, doc. 225](https://history.state.gov/historicaldocuments/frus1964-68v06/d225). [[w.dallek-flawed-giant]], 539–40. Made public: FRUS 1964–68, VI (2002). To check: [[w.clifford-counsel-to-the-president-2]], 536. See [[cal.1968-05-03.vietnam]]. Names: Johnson, Rusk, Clifford, Harriman, Vance.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:clifford-clark
      - name:harriman-w-averell
      - name:vance-cyrus
    section: '196805'
- add:
    entry:
      id: cal.1968-05-07.vietnam-paris
      when: May 7
      date: '1968-05-07'
      thread: vietnam-paris
      c: 'Tuesday luncheon: Clifford, Rusk, Helms, Rostow. Rusk: "We should not pull our punches. We should not understate our own case." Johnson: the negotiators to be "tough traders. Let''s not put our minimum condition on the table first."'
      n: '[FRUS 1964–68, VI, doc. 226](https://history.state.gov/historicaldocuments/frus1964-68v06/d226). [[w.dallek-flawed-giant]], 540. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-06.vietnam-paris]]. Names: Johnson, Clifford, Rusk, Helms, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:rusk-dean
      - name:helms-richard
      - name:rostow-walt-w
    section: '196805'
- add:
    entry:
      id: cal.1968-06-25.transition-and-staff
      when: June 25
      date: '1968-06-25'
      thread: transition-and-staff
      c: 'Staff meeting. Johnson on "recent press reports that the White House staff is tired ... that many officials are soon leaving ... and that the machinery of government is grinding to a halt": he hopes all will stay until January; "lots of work to do and no room for a letdown." Fresh proposals wanted for the months left.'
      n: '[[w.dallek-flawed-giant]], 550 (from the notes of the meeting, NSF: Meeting Notes, LBJ Library). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
    section: '196806'
- add:
    entry:
      id: cal.1968-06-25.court-fortas
      when: June 25
      date: '1968-06-25'
      thread: court-fortas
      c: 'Manatos to Johnson, the day before the nominations: Robert Byrd will do "everything in [his] power" against Fortas, "that ''leftist'' member of the Court"; Russell Long calls Fortas "one of the dirty five"; the Fortas-Thornberry package "real trouble."'
      n: '[[w.dallek-flawed-giant]], 557 (Manatos''s memoranda of 3 and 4:15 p.m., Special File: Fortas and Thornberry, LBJ Library). To check: [[w.kalman-abe-fortas]], 329. Names: Manatos, Byrd, Fortas, Long, Thornberry, Johnson.'
      tags:
      - name:manatos-mike-n
      - name:byrd-robert-c
      - name:fortas-abe
      - name:long-russell-b
      - name:thornberry-william-h
      - name:johnson-lyndon-b
    section: '196806'
- add:
    entry:
      id: cal.1968-07-24.elections-1968
      when: July 24
      date: '1968-07-24'
      thread: elections-1968
      c: 'Lunch, 1:30 p.m.: Johnson with Rusk, Clifford, Taylor, Helms, Wheeler and Rostow. "I want to sit down with Mr. Nixon to see what kind of world he really wants. When he gets the nomination he may be more responsible. He says he is for our position in Vietnam." Then the Democratic platform on Vietnam.'
      n: '[FRUS 1964–68, VI, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v06/d308). [[w.dallek-flawed-giant]], 571. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-07-09.elections-1968]]. Names: Johnson, Nixon, Rusk, Clifford, Taylor, Helms, Wheeler, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - name:rusk-dean
      - name:clifford-clark
      - name:taylor-maxwell
      - name:helms-richard
      - name:wheeler-earle
      - name:rostow-walt-w
    section: '196807'
- add:
    entry:
      id: cal.1968-09-16.space
      when: Sept. 16
      date: '1968-09-16'
      thread: space
      c: 'Webb leaves NASA. By the accounts Dallek gives, he had offered to resign before; Johnson, "fed up with this same old story": "Let''s call in the press." To the reporters, Webb: budget cuts have put the United States second in space; the agency "a sort of whipping boy."'
      n: '[[w.dallek-flawed-giant]], 423–24 (from Webb''s and Paine''s oral histories and Sherrod''s papers, NASA Archives). Names: Webb, Johnson. Check: the day, against the press of Sept. 16–17.'
      tags:
      - name:webb-james-e
      - name:johnson-lyndon-b
    section: '196809'
- add:
    entry:
      id: cal.1968-09-24.elections-1968
      when: Sept. 24
      date: '1968-09-24'
      thread: elections-1968
      c: 'Johnson to Clifford, by Clifford''s account: he doubts Humphrey''s fitness to be President, wanting "guts"; he would think more of him if he "showed he had some balls."'
      n: '[[w.dallek-flawed-giant]], 577. To check: [[w.clifford-counsel-to-the-president-2]], 570–72. See [[cal.1968-09-10.elections-1968]]. Names: Johnson, Clifford, Humphrey.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:humphrey-hubert-h
    section: '196809'
- add:
    entry:
      id: cal.1968-11-01.elections-1968-chennault
      when: Nov. 1
      date: '1968-11-01'
      thread: elections-1968-chennault
      c: 'Johnson has William Bundy brief Humphrey on Chennault''s pressure on Thiệu. Humphrey, without direct evidence of Nixon''s part, will not leak it: "difficult to explain how we knew about what she had done."'
      n: '[[w.dallek-flawed-giant]], 591. To check: [[w.solberg-hubert-humphrey]], 398–400. See [[cal.1968-10-29.elections-1968-chennault]]. Names: Johnson, William Bundy, Humphrey, Chennault, Nguyễn Văn Thiệu, Nixon.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-william
      - name:humphrey-hubert-h
      - name:chennault-anna
      - name:nguyen-van-thieu
      - name:nixon-richard-m
