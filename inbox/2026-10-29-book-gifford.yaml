        (Nixon). [[w.gifford-center-cannot-hold]], 183–86. To check: The Speeches of Vice President Richard M. Nixon, Presidential Campaign
        of 1960 (1961), 174-75, U.S. Government Printing Office, printed (cited by [[w.gifford-center-cannot-hold]], 184 n.44); The
        Speeches of Vice President Richard M. Nixon, Presidential Campaign of 1960 (1961), 175-78, U.S. Government Printing Office,
