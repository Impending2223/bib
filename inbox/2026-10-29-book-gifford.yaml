      when: July 24
      date: '1960-07-24'
      thread: republican-party
      also:
      - goldwater
      - elections-1960
      c: 'Chicago. Shorey, South Carolina''s Republican chairman and a cochairman of the Goldwater for President Committee, to reporters:
        Rockefeller''s "attempt ... to impose his will in a dictatorial fashion upon this convention" and Nixon''s "apparent acquiescence"
        have left the convention "restive, dissatisfied and flexible." As many as 120 first-ballot votes for Goldwater, from Nevada,
        Virginia, Nebraska, Mississippi, North Carolina and Louisiana among others.'
      n: '[[w.gifford-center-cannot-hold]], 155. To check: Charleston News and Courier, July 25, 1960, A1 (cited by [[w.gifford-center-cannot-hold]],
        155 n.39); Columbia State, July 25, 1960 (cited by [[w.gifford-center-cannot-hold]], 155 n.40). See [[cal.1960-07-22.elections-1960]].
        Names: Rockefeller, Nixon, Goldwater. Check: the day; Gifford''s sources are of July 25.'
      tags:
