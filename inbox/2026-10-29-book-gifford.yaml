      when: July 19
      date: '1960-07-19'
      thread: elections-1960
      also:
      - republican-party
      c: 'Rockefeller''s statement to the platform committee, "Let Freedom Ring: A Centennial Memorandum for the 1960 Republican Party
        Platform," printed and handed out: the ground of his statement of June 8 again. To every delegate, "A Republican Approach to
        the Great Issues," thirty-two pages.'
      n: '[[w.gifford-center-cannot-hold]], 50–51, 75–76. To check: "Let Freedom Ring: A Centennial Memorandum for the 1960 Republican
        Party Platform", Rockefeller Papers, RG 4, Series J.1, Subseries 2, Box 14, Folder 115, Rockefeller Archive Center (cited by
        [[w.gifford-center-cannot-hold]], 51 n.82). See [[cal.1960-06-08.elections-1960]]. Names: Rockefeller. Check: whether he gave
        the statement in person; and the day of the delegates'' pamphlet, which Gifford does not date.'
      tags:
      - name:rockefeller-nelson
      - city:chicago
      src:
        c: 9b0fdbd0
        rows:
        - 'w.gifford-center-cannot-hold 50–51: all'
        - 'w.gifford-center-cannot-hold 75–76: A'
        - 'via w.gifford-center-cannot-hold 51 n.82: A'
- add:
