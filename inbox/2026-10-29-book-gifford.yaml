      when: July
      date: 1960-07
      thread: conservative-movement
      also:
      - goldwater
      c: 'Chicago, after the convention. Liebman and Charles Edison, once New Jersey''s governor, give Youth for Goldwater''s leaders
        a luncheon at the Pick-Congress Hotel: keep on. Caddy, with Liebman''s help, an interim committee to call a conference in the
        fall and found a standing organization of young conservatives.'
      n: '[[w.gifford-center-cannot-hold]], 137. To check: [[w.schneider-cadres-for-conservatism]]. See [[cal.1960-07-27.conservative-movement]].
        The conference: [[cal.1960-09-10.conservative-movement]]. Check: the day.'
      tags:
      - city:chicago
      src:
        c: ad67fa68
        rows:
        - 'w.gifford-center-cannot-hold 137: all'
- add:
    entry:
      id: cal.1960-08-06.republican-party
      when: Aug. 6
      date: '1960-08-06'
      thread: republican-party
      also:
      - south-carolina
      c: 'Columbia. The State Republican convention in reconvened session. Wannamaker, the national committeeman: the party still a
        small minority, organized in 24 of the 46 counties at the March convention, with no one to contest local races; candidates for
        Congress must be raised "from pups" or won from the Democrats. Meanwhile, he proposes, nominate the Democrats'' congressional
        nominees as the party''s own. Called "me-tooism"; voted down.'
      n: '[[w.gifford-center-cannot-hold]], 159–60. To check: Minutes of the 1960 Republican State Convention, Columbia, S.C., Mar.
