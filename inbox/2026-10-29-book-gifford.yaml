      when: July 21
      date: '1960-07-21'
      thread: elections-1960
      also:
      - republican-party
      c: 'The Draft Rockefeller Committee, Brinton of San Francisco its chairman, releases a five-State survey by Political Analysis
        Associates: "Republican defeat is certain unless Governor Rockefeller is nominated." Nixon to lose California, New York, Pennsylvania,
        Illinois and Texas, a fifth or more undecided in each; "Nixon''s image is fixed. And it is not a winning image."'
      n: '[[w.gifford-center-cannot-hold]], 49–51. To check: Draft Rockefeller Committee, press release, July 21, 1960, Rockefeller
        Papers, RG 15, Series 22, Subseries 4, Box 48, Folder 1186, Rockefeller Archive Center (cited by [[w.gifford-center-cannot-hold]],
        51 n.83). Names: Rockefeller, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:nixon-richard-m
      src:
        c: a2d8ddb9
        rows:
        - 'w.gifford-center-cannot-hold 49–51: all'
        - 'via w.gifford-center-cannot-hold 51 n.83: all'
- add:
