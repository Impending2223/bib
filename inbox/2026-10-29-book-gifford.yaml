        meeting; the fourteen points). [[w.gifford-center-cannot-hold]], 52–53, 76, 154–55 (the meeting, at Nixon''s asking; the fourteen
        points, seven domestic and seven foreign; the statement on the wire the morning of July 23; Goldwater''s press conference).
