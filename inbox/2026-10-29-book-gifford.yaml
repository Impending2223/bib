      id: cal.1960-05-11.elections-1960
      when: May 11
      date: '1960-05-11'
      thread: elections-1960
      also:
      - civil-rights-the-executive
      c: 'Jackie Robinson to Nixon, after their meeting with Rogers in May: speak out with authority on civil rights soon, or "it will
        be hard to convince people that your interest isn''t motivated by politics." Kennedy has sent columnists Nixon''s record before
        1950.'
      n: '[[w.gifford-center-cannot-hold]], 72, 74. To check: Jackie Robinson to Nixon, May 11, 1960, Series 320, Box 649, "Robinson,
        Jackie," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 72 n.46). Names: Jackie Robinson, Nixon, Rogers, Kennedy.
        Check: the day of the meeting; Gifford gives May.'
      tags:
      - name:robinson-jackie
      - name:nixon-richard-m
      - name:rogers-william-p
      - name:kennedy-john-f
      src:
        c: 934daced
        rows:
