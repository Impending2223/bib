        nations of the world"; then to Wilkes-Barre and Scranton. Eisenhower receives them at the White House: "All of us are Americans";
        a firm national policy in days "unusually troublous." Mitchell with them. Their conclusions: an agency of the next administration
        to work with the nationality groups; Nixon and Lodge endorsed.'
      n: 'Remarks to Members of the American Nationalities for Nixon-Lodge, [1960–61 Pub. Papers 704](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=756)
