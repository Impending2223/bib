- add:
    entry:
      id: cal.1960-01-12.elections-1960
      when: Jan. 12
      date: '1960-01-12'
      thread: elections-1960
      also:
      - voting-rights
      c: 'Nixon puts off Wilkins, who asked on Jan. 6 to bring twenty to twenty-five heads of civil rights organizations, Randolph,
        King and Reuther among them, to see him on Jan. 14. Don Hughes of his staff to say he is booked that week, then that he has
        commitments in Florida until after Jan. 27, when, Rogers has told him, Wilkins cannot gather the group: "I think we can get
        out of it this way."'
      n: '[[w.gifford-center-cannot-hold]], 64–65. Names: Nixon, Wilkins, Randolph, Martin Luther King, Reuther, Rogers.'
      tags:
      - name:nixon-richard-m
      - name:wilkins-roy
      - name:randolph-a-philip
      - name:king-martin-luther-jr
      - name:reuther-walter
      - name:rogers-william-p
      src:
        c: 6b4d602e
        rows:
        - 'w.gifford-center-cannot-hold 64–65: all'
- add:
    entry:
      id: cal.1960-01-22.voting-rights
      when: Jan. 22
      date: '1960-01-22'
      thread: voting-rights
      also:
      - republican-party-congress
      - elections-1960
      c: 'Wilkins to Nixon by telegram: the House Republican leaders hold back from the discharge petition to bring the civil rights
        bill out of the Rules Committee, "Halleckism"; "this performance [is] not calculated to generate love for the Republican Party
        and its candidates among Negro voters."'
      n: '[[w.gifford-center-cannot-hold]], 65. To check: Wilkins to Nixon, telegram, Jan. 22, 1960, Series 320, Box 820, "Wilkins,
        Roy," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 65 n.22). Names: Wilkins, Nixon, Halleck.'
      tags:
      - name:wilkins-roy
      - name:nixon-richard-m
      - name:halleck-charles-a
      src:
        c: bc5db71f
        rows:
        - 'w.gifford-center-cannot-hold 65: all'
        - 'via w.gifford-center-cannot-hold 65 n.22: all'
- add:
    entry:
      id: cal.1960-02-03.elections-1960
      when: Feb. 3
      date: '1960-02-03'
      thread: elections-1960
      also:
      - voting-rights
      c: 'Finch to Agnes Waldron of Nixon''s staff, on Wilkins''s telegram: a reply "signed by someone other than RN." Nixon sure of
        a meaningful civil rights law this session; he will fight for all measures "reasonably designed to secure the primary rights
        of all American citizens."'
      n: '[[w.gifford-center-cannot-hold]], 65. To check: Finch to Agnes Waldron, Feb. 3, 1960, Series 320, Box 820, "Wilkins," Nixon
        Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 65 n.23). See [[cal.1960-01-22.voting-rights]]. Names: Finch, Wilkins,
        Nixon.'
      tags:
      - name:finch-robert-h
      - name:wilkins-roy
      - name:nixon-richard-m
      src:
        c: 581b969e
        rows:
        - 'w.gifford-center-cannot-hold 65: all'
        - 'via w.gifford-center-cannot-hold 65 n.23: all'
- add:
    entry:
      id: cal.1960-04-08.republican-party
      when: Apr. 8
      date: '1960-04-08'
      thread: republican-party
      also:
      - elections-1960
      c: 'Val Washington, the National Committee''s director for Negro voters, back from a month in Colorado, Oregon, Washington and
        California, by telephone to Finch: no effort by Nixon or his staff on the issues; apathy among Negroes and whites alike. In
        California, complaints that Nixon''s staff, Finch above all, keeps people from him.'
      n: '[[w.gifford-center-cannot-hold]], 70–71. To check: Memorandum to Finch of Val Washington''s telephone call, Apr. 8 [1960],
        Series 320, Box 801, "Washington, Val," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 70 n.42). Names: Finch,
        Nixon. Check: the day of the call; the memorandum is dated Apr. 8.'
      tags:
      - name:finch-robert-h
      - name:nixon-richard-m
      src:
        c: 75f7f036
        rows:
        - 'w.gifford-center-cannot-hold 70–71: all'
        - 'via w.gifford-center-cannot-hold 70 n.42: all'
