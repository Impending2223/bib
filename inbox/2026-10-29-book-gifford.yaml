- add:
    entry:
      id: cal.1960-06-10.elections-1960
      when: June 10
      date: '1960-06-10'
      thread: elections-1960
      also:
      - civil-rights-the-executive
      c: 'Jackie Robinson''s column prints, with Nixon''s leave, Nixon''s letter to him on civil rights: no party may take the Negro
        vote "for granted"; a strong stand "not only for the clear-cut moral considerations involved" but for the country''s standing
        abroad; to deny the struggle "the full talent and energies of 17 million Negro Americans" would be "stupidity of the greatest
        magnitude." Rockefeller''s challenge a "healthy stimulus."'
      n: '[[w.gifford-center-cannot-hold]], 74–75. To check: New York Post, June 10, 1960, 96 (cited by [[w.gifford-center-cannot-hold]],
        75 n.55). See [[cal.1960-05-11.elections-1960]]. Names: Jackie Robinson, Nixon, Rockefeller.'
      tags:
      - name:robinson-jackie
      - name:nixon-richard-m
      - name:rockefeller-nelson
      src:
        c: b55411be
        rows:
        - 'w.gifford-center-cannot-hold 74–75: all'
        - 'via w.gifford-center-cannot-hold 75 n.55: all'
- add:
    entry:
      id: cal.1960-06.elections-1960-4
      when: June
      date: 1960-06
      thread: elections-1960
      also:
      - civil-rights-the-executive
      c: 'Buffalo. Rockefeller to the National Sunday School and Baptist Training Union Conference: an executive order against discrimination
        in housing; the Labor Board to refuse to certify unions that discriminate; federal money to help cities and towns desegregate;
        the Attorney General empowered to sue to desegregate schools; a permanent ban on discrimination in government contract work;
        equal opportunity in every federal agency.'
      n: '[[w.gifford-center-cannot-hold]], 75. To check: Amsterdam News (New York), June 25, 1960, Series 320, Box 554, "Negro Press,"
        Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 75 n.57); Baltimore Afro-American, July 2, 1960 (cited by [[w.gifford-center-cannot-hold]],
        75 n.57). Names: Rockefeller. Check: the day; Gifford gives none, citing the *Amsterdam News* of June 25.'
      tags:
      - name:rockefeller-nelson
      - state:ny
      - city:buffalo
      src:
        c: 62813b26
        rows:
        - 'w.gifford-center-cannot-hold 75: all'
        - 'via w.gifford-center-cannot-hold 75 n.57a: all'
        - 'via w.gifford-center-cannot-hold 75 n.57b: all'
