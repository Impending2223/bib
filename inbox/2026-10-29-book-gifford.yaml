      - elections-1960
      c: 'Youth for Goldwater for Vice President, Croll its chairman; Caddy, Franke, Harley, Noble and Weicher its executive committee.
        Its aims, by Croll: the vice-presidential nomination for Goldwater, and the philosophy of *The Conscience of a Conservative*
        in the Young Republican National Federation.'
      n: '[[w.gifford-center-cannot-hold]], 133–34. To check: [[w.evans-revolt-on-the-campus]]; [[w.schneider-cadres-for-conservatism]].
        See [[cal.1960-04-09.conservative-movement]]. Names: Goldwater. Check: the day of the founding; Gifford dates Croll''s statement
        May 12 and the committee a month after the meeting of Apr. 9.'
      tags:
      - name:goldwater-barry-m
      src:
        c: 30fa24a1
        rows:
        - 'w.gifford-center-cannot-hold 133–34: all'
- add:
    entry:
      id: cal.1960-05-23.elections-1960
      when: May 23
      date: '1960-05-23'
      thread: elections-1960
      also:
      - soviet-union-u2
      c: 'Rockefeller''s statement on the summit''s collapse, the first of those on "national issues of serious moment" he promised
        in December: "The people need to know what went wrong, where we are, and where we are going." The illusions and the procedures
        that led to the summit in question; the "purpose and prudence" of the American handling of the flight too. Neither "fatal debacle"
        nor "shining victory."'
      n: '[[w.gifford-center-cannot-hold]], 45. To check: Rockefeller, press release, May 23, 1960, Rockefeller Papers, RG 15, Gubernatorial
        Speeches, Box 3, Folder 165, Rockefeller Archive Center (cited by [[w.gifford-center-cannot-hold]], 45 n.61); [[w.smith-on-his-own-terms]];
        [[w.persico-imperial-rockefeller]]. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
      src:
        c: f73c2c55
        rows:
        - 'w.gifford-center-cannot-hold 45: all'
        - 'via w.gifford-center-cannot-hold 45 n.61: all'
- add:
    entry:
      id: cal.1960-05-25.elections-1960-2
      when: May 25
      date: '1960-05-25'
      thread: elections-1960
      also:
      - republican-party
      c: 'Rockefeller to a meeting of Republican State leaders: "in all candor," he would accept a draft for the nomination. He may
        go to the convention after all, if the party accepts that he will not take second place. Morton welcomes it.'
      n: '[[w.gifford-center-cannot-hold]], 45–46. To check: Congressional Quarterly Weekly Report XVIII (May 27, 1960): 929 (cited
        by [[w.gifford-center-cannot-hold]], 45 n.62); Congressional Quarterly Weekly Report XVIII (June 3, 1960): 964 (cited by [[w.gifford-center-cannot-hold]],
        46 n.63). See [[cal.1960-05-23.elections-1960]]. Names: Rockefeller, Morton. Check: the day; Gifford gives two days after the
        statement of May 23.'
      tags:
      - name:rockefeller-nelson
      - name:morton-thruston-b
      src:
        c: d22c42ff
        rows:
        - 'w.gifford-center-cannot-hold 45–46: all'
        - 'via w.gifford-center-cannot-hold 45 n.62: A-B'
        - 'via w.gifford-center-cannot-hold 46 n.63: C'
- add:
    entry:
      id: cal.1960-06-09.elections-1960-2
      when: June 9
      date: '1960-06-09'
      thread: elections-1960
      c: 'Nixon on Rockefeller''s statement: "he is free to criticize, since it is motivated by his concern over some administrative
        policies"; it will not hurt his chances; he has set out his policies "with greater precision and in much more detail than the
        candidates of either party."'
      n: '[[w.gifford-center-cannot-hold]], 47–48. To check: New York Herald Tribune, June 10, 1960 (cited by [[w.gifford-center-cannot-hold]],
        48 n.69). See [[cal.1960-06-08.elections-1960]]. Names: Nixon, Rockefeller. Check: the day; Gifford''s source is the *Herald
