      date: '1960-06-24'
      thread: conservative-movement
      also:
      - goldwater
      - elections-1960
      c: 'Shorey, South Carolina''s Republican chairman, and Aubrey Barker of Arizona, cochairmen of the Goldwater for President Committee,
        in a letter for funds: Goldwater''s chances of the nomination "slim," but fifty delegates'' votes for him would advance "principled
        Republicanism"; *The Conscience of a Conservative* to each recipient. They will support Nixon if he is nominated.'
      n: '[[w.gifford-center-cannot-hold]], 153. To check: Shorey and Aubrey Barker to M. Jeff Watts Jr., June 24, 1960, Series 320,
        Box 693, "Shorey, G.D. Jr.," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 153 n.34). See [[cal.1960-03-26.elections-1960]].
        Names: Goldwater, Nixon.'
      tags:
      - name:goldwater-barry-m
      - name:nixon-richard-m
      - state:sc
      src:
        c: 673e310d
        rows:
        - 'w.gifford-center-cannot-hold 153: all'
        - 'via w.gifford-center-cannot-hold 153 n.34: all'
- add:
