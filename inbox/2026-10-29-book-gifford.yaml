      c: 'Des Moines. The Midwest Federation of College Young Republican Clubs: a liberal chairman elected by five votes; the conservative
        delegates carry a resolution for Goldwater and endorse him for the vice-presidential nomination.'
      n: '[[w.gifford-center-cannot-hold]], 115, 133 (the day and the endorsement, 115; the chairman and the resolution, 133). To check:
        National Review, Apr. 9, 1960 (cited by [[w.gifford-center-cannot-hold]], 115 n.65); [[w.evans-revolt-on-the-campus]]. Names:
        Goldwater. Check: Gifford, 115, after *National Review*, gives the endorsement as all 450 college delegates''; 133, after Evans,
        a resolution the conservatives pushed through.'
      tags:
      - name:goldwater-barry-m
      - state:ia
      - city:des-moines
