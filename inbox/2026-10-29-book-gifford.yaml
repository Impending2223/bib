        - 'w.gifford-center-cannot-hold 74: A'
        - 'via w.gifford-center-cannot-hold 72 n.46: all'
- add:
    entry:
      id: cal.1960-05-12.republican-party
      when: May 12
      date: '1960-05-12'
      thread: republican-party
      also:
      - elections-1960
      c: 'Morton has offered Rockefeller the convention post of his choice, keynote speaker and temporary chairman or permanent chairman.
        Hinman to Rockefeller: take the permanent chairmanship, refuse both places on the ticket again, and let Morhouse announce the
        New York delegation for Nixon; to refuse the vice presidency at the convention itself would do more harm.'
      n: '[[w.gifford-center-cannot-hold]], 43–44. To check: Hinman to Rockefeller, May 12, 1960, Rockefeller Papers, RG 4, Series J.2,
        Subseries 4, Box 92, Folder 635, Rockefeller Archive Center (cited by [[w.gifford-center-cannot-hold]], 44 n.59). Names: Morton,
        Rockefeller, Hinman, Morhouse, Nixon. Check: the day of Morton''s offer; Gifford gives mid-May.'
      tags:
      - name:morton-thruston-b
      - name:rockefeller-nelson
      - name:hinman-george-l
      - name:morhouse-l-judson
      - name:nixon-richard-m
      - state:ny
      src:
        c: 28623d24
        rows:
        - 'w.gifford-center-cannot-hold 43–44: all'
        - 'via w.gifford-center-cannot-hold 44 n.59: all'
- add:
    entry:
      id: cal.1960-05.elections-1960-2
      when: May
      date: 1960-05
      thread: elections-1960
      also:
      - republican-party
      c: 'Mid-May. Rockefeller turns down Morton''s offer and will not go to the convention, the one way to keep his name out of the
        running for Vice President: "Frankly, I could not justify leaving the governorship of the state of New York to become the Vice
        President." Morhouse: he "should not be ruled out of contention for the Presidency."'
      n: '[[w.gifford-center-cannot-hold]], 44–45. To check: Congressional Quarterly XVII (May 20, 1960): 890 (cited by [[w.gifford-center-cannot-hold]],
        45 n.60). See [[cal.1960-05-12.republican-party]]. Names: Rockefeller, Morton, Morhouse. Check: the day; Gifford''s source is
        of May 20.'
      tags:
      - name:rockefeller-nelson
      - name:morton-thruston-b
      - name:morhouse-l-judson
      - state:ny
      src:
        c: 0eb8ecaf
        rows:
        - 'w.gifford-center-cannot-hold 44–45: all'
        - 'via w.gifford-center-cannot-hold 45 n.60: all'
