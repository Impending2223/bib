- edit:
    id: cal.1968-03-04.vietnam
    base: be9bb97d
    set:
      c: 'Clifford''s group reports on Westmoreland''s request for 205,000 more men.{1} Its draft memorandum: some 22,000 to Vietnam at once;{2} a call-up of about 262,000 reservists, higher draft calls, enlistments extended;{3} the rest of the request to wait on events;{4} the strategic guidance to Westmoreland to be studied anew.{5} Clifford: "We seem to have a sinkhole. We put in more—they match it."{6} Rusk: the bombing of the North might be stopped during its rainy season;{7} Johnson: "Really get on your horses on that."{8} Clifford: "a whole new look at the whole situation." Without the troops for Korea and the naval units, 242,000 reservists and a 454,000 increase in strength.{9} Fowler: expenditures up $2.5 billion in fiscal 1968 and $10 billion in fiscal 1969, a $500 million cost to the balance of payments; a new fiscal program needed.{10} Wheeler: the 22,000 is all that can be provided by June 15; with the call-up Westmoreland''s request can be met by Sept. 1 and Dec. 1, not by May 1.{11}'
