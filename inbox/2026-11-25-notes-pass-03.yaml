- edit:
    id: cal.1967-07-13.vietnam-program-5
    base: 874f5c9e
    set:
      c: 'Johnson''s news conference with McNamara and Westmoreland: Westmoreland to have the troops he needs.{1} Wheeler is with them. Johnson: "some additional troops are going to be needed and are going to be supplied."{2} The same day, in the Cabinet Room, McNamara reports "complete accord" on the troop question: 19 or 21 battalions, total strength 525,000. Wheeler: the figures should not be disclosed.{3} The smaller package, cut almost in half, comes to just over 47,000 men under a ceiling of 525,000.{4} Clifford and Taylor are to go to the allies.{5}'
