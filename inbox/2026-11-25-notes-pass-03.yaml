- edit:
    id: cal.1968-04-03.robert-kennedy
    base: 4b547fe3
    set:
      c: 'Robert Kennedy and Sorensen with Johnson at the White House, at Kennedy''s asking.{1} Would Johnson oppose his candidacy, or mobilize forces against him?{2} Johnson: but for a few fund-raising dinners he plans to keep out of campaign politics;{3} he "does not wish to forego his options."{4} The Cabinet Room, 10 a.m., an hour and forty minutes;{5} Rostow and Charles S. Murphy with Johnson.{6} Johnson: "I want to keep the Presidency out of this campaign. I''m not that pure, but I am that scared."{7} Kennedy: "You are a brave and dedicated man, Mr. President."{8} Johnson has Kennedy''s wire; he says he has taken himself out of the election. He hopes Kennedy will keep in touch with Katzenbach; Clifford will see him at any time. Kennedy: the speech was "magnificent"; a lot of it "was my fault."{9} Johnson does some 90 percent of the talking. Humphrey is the next visitor.{10}'
