- edit:
    id: cal.1968-02-12.vietnam-tet
    base: 3f3e8b1e
    set:
      c: 'Westmoreland: the enemy''s third phase, to take Quảng Trị and Thừa Thiên, begun;{1} he asks for reinforcements now.{2} Johnson with his advisers: a brigade of the 82d Airborne, 3,800 men, and Marines, 6,500, to Vietnam;{3} the Joint Chiefs had asked that a reserve call-up come first.{4} Westmoreland asks that a Marine regiment package and a brigade package of the 82d Airborne go at once: "I need these 525,000 troops now," the ceiling promised for 1969.{5} The meeting runs 1:45 to 3:08 p.m. McNamara: send the units for the period of the emergency only, and send Wheeler to meet Bunker, Westmoreland and Vance; 14 days. Clifford asks what has changed in the enemy''s strategy. Rusk would send the six battalions without a permanent commitment.{6}'
