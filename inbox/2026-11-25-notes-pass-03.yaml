- edit:
    id: cal.1960-11-15.economy
    base: 4d0b19ee
    set:
      c: 'Augusta, Ga. Eisenhower with Anderson, Gates and others; Goodpaster reads the draft directive on the balance of payments, and it is revised. Gates: 500,000 dependents abroad; Anderson: a goal of 200,000, a cut of 60 percent. Gates fears the services'' fuss and Kennedy''s use of the issue; Eisenhower: morale will be all right with proper leadership. State''s embassies to be cut too. Anderson to ask Adenauer $650 million a year; the directive out Wednesday. Present also: Lennartson, von Klemperer of the Treasury, Gen. George Brown, Hagerty and Col. John Eisenhower, who writes the memorandum. Eisenhower opens on the State and Defense memorandum for continued military aid to Italy, Belgium and the Netherlands; Anderson would make them pay. He wants the lower ranks favored in the cut of dependents; the regular services are "enlisted for service and not for personal gain."'
