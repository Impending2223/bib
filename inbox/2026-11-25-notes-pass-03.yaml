- edit:
    id: cal.1967-04-27.vietnam-program-5
    base: db8924d3
    set:
      c: 'Westmoreland with Johnson and his advisers: without the 2⅓ divisions and five squadrons asked, 565,000 men in all, "it will be nip and tuck";{1} another 2⅓ divisions, about 100,000 men, probably in fiscal 1969;{2} "a war of attrition";{3} "frankly dismayed at even the thought of stopping the bombing."{4} Rusk, McNamara, Katzenbach, Vance, Komer, Rostow and Wheeler are present; Christian takes the notes. The sessions run 10:35 to 11:50 a.m. and 4:45 to 6:30 p.m.{5} Westmoreland: the enemy totals 285,000 and the crossover point was reached last month; on the present program of 470,000 men, "a meat grinder," the war could go on five years; with 565,000, three; with 665,000, two. Johnson: "When we add divisions, can''t the enemy add divisions? If so, where does it all end?"{6} Wheeler: the bombing will soon have struck all worthwhile fixed targets but the ports; without the added divisions "the momentum will die."{7} Asked by McNamara how long to wind down: with the optimum force about three years, with the minimum at least five.{8}'
