- edit:
    id: cal.1967-05-19.vietnam
    base: eeb20840
    set:
      c: 'McNamara''s draft presidential memorandum, "Future Actions in Vietnam," drafted by McNaughton.{1} Westmoreland and Sharp ask 200,000 more men;{2} that would mean the reserves, some 500,000 more in the forces, $10 billion more in fiscal 1968, and pressure to carry the war into Laos, Cambodia and the North.{3} "The war in Vietnam is acquiring a momentum of its own that must be stopped."{4} Course B: no more than 30,000 more men, about 500,000 by the end of 1968;{5} the bombing concentrated on the routes of infiltration south of 20°.{6} The new request would bring U.S. forces in Vietnam to 670,000 and in the area to 770,000.{7}'
