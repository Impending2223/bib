- edit:
    id: cal.1960-07-05.elections-1960
    base: d7a50cf5
    set:
      c: 'Johnson announces in the New Senate Office Building''s auditorium, Rayburn in the front row: "I am, as of this moment, a candidate for the office of President of the United States."{1} The next President "a working President," not a talking or a traveling one.{2} A fifteen-minute statement, fifteen minutes of questions. He claims more than 500 first-ballot votes, Kennedy fewer than 600; Rayburn is to nominate him, Dodd and Inouye to second.{3}'
