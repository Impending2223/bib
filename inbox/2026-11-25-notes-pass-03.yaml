- edit:
    id: cal.1960-07-03.elections-1960-nomination-3
    base: 1a63e6ea
    set:
      c: Kennedy to answer Truman at his own news conference, the Roosevelt Hotel, New York, July 4. NBC, by Kintner's telegram, to carry it live, radio and television; CBS to tape it and use what it judges news; ABC portions. The conference is arranged by telephone from Hyannis Port; Sorensen flew in from the West Coast July 3; Shriver makes the arrangements.
- edit:
    id: cal.1960-07-04.elections-1960
    base: 4b2b2389
    set:
      c: 'New York. Kennedy''s televised press conference, the reply to Truman, drafted with Sorensen at Hyannis Port: if "fourteen years in major elective office is insufficient experience," that rules out every President of the century;{1} an age test would have kept "Christopher Columbus from even discovering America."{2} "If the people of this nation select me to be their President, I believe that I am ready."{3} At the Hotel Roosevelt, a 1,600-word statement read in twelve minutes, then questions from some 100 newsmen. Truman, reached at Independence, had not read it.{4}'
