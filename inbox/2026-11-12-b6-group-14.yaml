      id: cal.1963-02.defense-4
      when: Feb.
      date: 1963-02
      thread: defense
      c: Robert Kennedy walks fifty miles in 17 hours and 50 minutes, in the fifty-mile craze the White House had started.
      n: '[[w.reeves-president-kennedy]], 472. See [[cal.1963-02.defense]]. Check: the day and month; Reeves gives none. Names:
        Robert Kennedy.'
