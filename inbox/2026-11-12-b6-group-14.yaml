- add:
    entry:
      id: cal.1964-08-01.vietnam
      when: Aug. 1
      date: '1964-08-01'
      thread: vietnam
      c: 'William Bundy begins a ten-day vacation, by his recollection with the understanding that Johnson "would not make
        any new major decision, or ... seriously consider expanding the war, at least until after the election." His "state
        of mind" was that of the Washington policy circle: "muddling through with our fingers crossed."'
      n: '[[w.dallek-flawed-giant]], 148 and n.71. Bundy''s recollection, as Dallek gives it. See [[cal.1964-08-02.vietnam]].
        Names: William Bundy.'
      src:
        c: b9ac31b1
        rows:
        - 'w.dallek-flawed-giant 148: all'
      tags:
      - name:bundy-william
- add:
