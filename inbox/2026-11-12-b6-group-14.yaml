- add:
    entry:
      id: cal.1964-06.desegregation-public-places
      when: June
      date: 1964-06
      thread: desegregation-public-places
      c: St. Augustine, Fla., Shiloh Baptist Church, a weekend. Jean Young, down from Atlanta without warning, joins a day
        march, her first, acting as if she did not know her husband; Andrew Young, who prefers that she not come, stays at
        the church.
      n: '[[w.young-easy-burden]], 294. Young''s account. Check: the day; Young gives "one weekend" of the St. Augustine campaign.
        Names: Young.'
      src:
        c: 4e1b1183
        rows:
        - 'w.young-easy-burden 294: all'
      tags:
      - name:young-andrew-j-jr
      - state:fl
      - city:st-augustine
- add:
    entry:
      id: cal.1965-03.voting-rights-selma-6
      when: Mar.
      date: 1965-03
      thread: voting-rights-selma
      c: 'Selma, a night after the attack at the Edmund Pettus Bridge. SCLC''s staff, days without rest, are monitoring the
        barricades outside Brown Chapel; Jesse Jackson, the Chicago Theological Seminary student who had brought students
        to Selma, volunteers: "You all go relax. I''ll keep watch here for you." By Young''s account.'
      n: '[[w.young-easy-burden]], 386. Young''s account, in the chapter on Chicago. Check: the night; Young gives "one night
        after the terrible attack" (Mar. 7). Names: Young.'
      src:
        c: 4e63ef97
        rows:
        - 'w.young-easy-burden 386: all'
      tags:
      - name:young-andrew-j-jr
      - state:al
      - city:selma
- add:
    entry:
      id: cal.1968-06-05.king-poor-peoples
      when: June 5
      date: '1968-06-05'
      thread: king-poor-peoples
      also:
      - assassination
      c: 'Washington, the Willard Hotel, the night Robert Kennedy is shot. Coretta King and Young watch the television and
        the medical reports. Young: they had thought they might rebuild "a forceful national consensus around Kennedy, salvaging
        at least something in the wake of Martin''s death." "Now even that hope was gone."'
      n: '[[w.young-easy-burden]], 486. Young''s account. Check: the night and hour; Young gives "the night Kennedy was shot"
        (the shooting after midnight in Los Angeles, June 5; death June 6). Names: Coretta King, Young, Robert Kennedy.'
      src:
        c: 77650a43
        rows:
        - 'w.young-easy-burden 486: all'
      tags:
      - name:king-coretta-scott
      - name:young-andrew-j-jr
      - name:kennedy-robert-f
      - city:washington
      - state:dc
- add:
    entry:
      id: cal.1967-07.war-opposition-3
      when: July
      date: 1967-07
      thread: war-opposition
      c: Aspen, Colo. McNamara and his son Craig, back from a hike, find the house they have rented surrounded by a mob of
        chanting antiwar demonstrators; they duck out of sight, and soon fly home to Washington.
      n: '[[w.mcnamara-in-retrospect]], ch. 10 between nn.25 and 26. McNamara''s account. The page adds that protesters had
        twice tried to burn his house under construction at Snowmass Village (no days). Check: the day; he places it after
        his wife''s operation of "early July" and the climb of the Grand Teton, before the Tuesday Lunch of Aug. 8. Names:
        McNamara.'
      src:
        c: 788d496e
        rows:
        - 'w.mcnamara-in-retrospect ch. 10 at nn.25-26: all'
      tags:
      - name:mcnamara-robert-s
      - state:co
      - city:aspen
- add:
    entry:
      id: cal.1963-02.defense-2
      when: Feb.
      date: 1963-02
      thread: defense
      c: 'Palm Beach. The President''s own fifty-mile hike: he organizes a walk with his brother-in-law Prince Stanislaus
        Radziwill, Chuck Spalding and Dr. Max Jacobson, who gives first aid along the route; he follows in a white Lincoln
        convertible until he is bored, then gives each walker a "Medal of Honor," an inscribed tea bag.'
      n: '[[w.reeves-president-kennedy]], 472. See [[cal.1963-02.defense]]. Check: the day and month; Reeves dates the craze
        from the first week of February and gives no day for the President''s hike. Names: Kennedy.'
      src:
        c: 9489ef18
        rows:
        - 'w.reeves-president-kennedy 472: all'
      tags:
      - name:kennedy-john-f
      - state:fl
      - city:palm-beach
- add:
    entry:
      id: cal.1963-02.defense-3
      when: Feb.
      date: 1963-02
      thread: defense
      c: 'Kennedy, as the press wonders whether his notably unfit press secretary will try fifty miles: "We all know and love
        Plucky and we think he''s funny. But I wonder what the rest of the country thinks of him. I wonder if they don''t
        think he''s making an ass of himself?" On his advice Salinger announces that he is not "plucky enough" to go fifty
        miles.'
      n: '[[w.reeves-president-kennedy]], 472. See [[cal.1963-02.defense]]. Check: the day and month; Reeves dates neither
        the remark nor the announcement. Names: Kennedy, Salinger.'
      src:
        c: e1d3ccde
        rows:
        - 'w.reeves-president-kennedy 472: all'
      tags:
      - name:kennedy-john-f
      - name:salinger-pierre
- add:
