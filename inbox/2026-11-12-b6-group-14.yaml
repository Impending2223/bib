      id: cal.1965-03-15.voting-rights-9
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: The joint session, during Johnson's address. Generals and admirals, heads of the armed forces, and most of the Supreme
        Court Justices, led by Warren, rise and applaud, "in violation of the protocol of appearing neutral." Senator Ellender
        of Louisiana, "a leader of the southern irreconcilables," slumps "in his chair, looking miserable," as do many other
        southern members.
      n: '[[w.kotz-judgment-days]], 312. See [[cal.1965-03-15.voting-rights]]. Names: Johnson, Warren, Ellender.'
      src:
        c: 6665976b
        rows:
        - 'w.kotz-judgment-days 312: all'
      tags:
      - name:johnson-lyndon-b
      - name:warren-earl
      - name:ellender-allen-j
