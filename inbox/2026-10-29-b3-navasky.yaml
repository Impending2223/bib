      c: 'Cox to Robert Kennedy on the Colorado case: the United States to refrain from supporting the plaintiffs, and to
        urge dismissal on technical grounds. Colorado''s voters, in every county, had chosen a Senate apportioned partly by
        area; the government would "fasten upon the people of every state a doctrinaire system of representation." Marshall''s
        memorandum attached, against him.'
