      c: 'Robert Kennedy and Barnett by telephone, 7 p.m. Barnett: Meredith to register at Jackson, in the State House, Thursday
        at 3, where the trustees meet, not at Oxford; whether the trustees will let him is theirs to decide. Kennedy to consult
        Meredith. Later that day: if Meredith goes to Oxford, against the board''s orders, Barnett will not answer for his
        safety.'
      n: '[[w.navasky-kennedy-justice]], 165–66 (the Department''s summary and transcript). See [[cal.1962-06-25.mississippi]].
        Names: Robert Kennedy, Barnett, Meredith.'
