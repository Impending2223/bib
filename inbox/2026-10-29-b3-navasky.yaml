      thread: crime-and-hijacking
      also:
      - robert-kennedy
      - congress
      c: 'Robert Kennedy before the Senate Judiciary Committee for S. 2813, the administration''s wiretap bill: the law on
        wiretapping "chaotic"; section 605 "unsatisfactory to almost everyone." Neither S. 1495 nor S. 2813 treats eavesdropping,
