patch: 2026-11-12-b11-goodwin
by: Claude (batch 11 reader, Goodwin, Remembering America, 1960-68)
ops:
- add:
    entry:
      id: cal.1960-04-05.elections-1960-4
      when: Apr. 5
      date: '1960-04-05'
      thread: elections-1960
      c: 'Milwaukee, the Pfister, the third-floor suite, the night of the Wisconsin primary. Kennedy, slowly sipping chicken
        noodle soup, sees from the split of the districts that Humphrey took the Protestant ones and he the Catholic: the
        result will be read in religious terms. To a sister who asks what it means: "that we have to do it all over again.
        We have to go through every primary and win every one of them — West Virginia and Maryland and Indiana and Oregon,
        all the way to the convention."'
      n: '[[w.goodwin-remembering-america]], 83 (Goodwin''s account, not an eyewitness''s; the sister not named). See [[cal.1960-04-05.elections-1960-3]].
        Names: Kennedy, Humphrey.'
      tags:
      - name:kennedy-john-f
      - name:humphrey-hubert-h
      - state:wi
      - city:milwaukee
- add:
    entry:
      id: cal.1960-04-19.elections-1960-religion
      when: Apr. 19
      date: '1960-04-19'
      thread: elections-1960-religion
      c: 'Wheeling, W. Va. Kennedy, answering a question from the audience, "without warning, spontaneously": "I am a Catholic,
        but the fact that I was born a Catholic — does that mean that I can''t be president of the United States? I''m able
        to serve in Congress and my brother was able to give his life, but we can''t be president?" The crowd responds; he
        decides to bring the issue up himself wherever he goes.'
      n: '[[w.goodwin-remembering-america]], 87 (Goodwin''s account; "much to the surprise of his advisers"). Check: the day
        and the place; the book gives Apr. 19, Wheeling. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:wv
      - city:wheeling
- add:
    entry:
      id: cal.1960-07-13.elections-1960-nomination
      when: July 13
      date: '1960-07-13'
      thread: elections-1960-nomination
      c: 'Washington. When Wyoming''s votes give Kennedy the nomination, Goodwin and the staff of the Senate office leave
        for the Democratic National Committee''s headquarters on K Street, where the committee staff are watching the convention
        on television. They put briefcases and cartons of papers on the desks: by "inviolable tradition" the National Committee,
        its records and staff belong to the nominee.'
      n: '[[w.goodwin-remembering-america]], 90 (Goodwin''s account). Check: the day; Wyoming''s votes put Kennedy over on
        the night of July 13, Los Angeles time. See [[cal.1960-07-13.elections-1960]]. Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - city:washington
- add:
    entry:
      id: cal.1960-09-12.latin-america
      when: Sept. 12
      date: '1960-09-12'
      thread: latin-america
      also:
      - elections-1960-kennedy
      c: 'Goodwin, on a bus in west Texas, finishes the draft of a speech on Latin American policy and puts into it "Alianza
        para progreso," from the title of a New Mexico society''s magazine left on the seat; by telephone Karl Meyer reports
        Ernesto Betancourt''s word that the phrase is safe and wants "progress." Kennedy, told by his throat doctor to save
        his voice, writes on his pad: "Let''s not waste this one. The ministers is the big one for today." The draft was for
        the Alamo, San Antonio, that afternoon.'
      n: '[[w.goodwin-remembering-america]], 108–9 (Goodwin''s account; the draft set aside, the phrase first proclaimed at
        Tampa, Oct. 18, 109). Check: the bus ride; the book gives no day, the Alamo afternoon being Sept. 12. See [[cal.1960-09-12.elections-1960-kennedy-4]].
        Names: Goodwin, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
      - state:tx
      - city:san-antonio
- add:
    entry:
      id: cal.1960-09-22.farm-4
      when: Sept. 22
      date: '1960-09-22'
      thread: farm
      also:
      - elections-1960-kennedy
      c: 'Kennedy, at 3 a.m., telephones Goodwin about the farm speech for the National Plowing Contest, which he has read
        and approved: "I want to be sure I don''t fall on my face. Call Hubert in the morning and read it to him. Make sure
        it''s right." At dawn Goodwin reads it to Humphrey: "Wonderful, Dick, it''s just what I would have said myself." The
        program memos had been prepared by Humphrey''s staff.'
      n: '[[w.goodwin-remembering-america]], 118–19 (Goodwin''s account; where the call was taken not given). Check: the day;
        the book puts the call the night before the contest, which the calendar dates Sept. 22. See [[cal.1960-09-22.farm-2]].
        Names: Kennedy, Goodwin, Humphrey.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1961-01.latin-america
      when: Jan.
      date: 1961-01
      thread: latin-america
      c: 'The Oval Office, late in the month. Kennedy, holding a message from Betancourt, to Goodwin: "I''d like to get a
        major statement on our Latin policy soon. Next to Berlin it''s the most critical area, and will be for a long time."
        He will "make a big commitment"; asks if something can be ready in a month: "I don''t care if everyone agrees. You
        know what our thinking is." Of Cuba: "I don''t want this to be an anti-Cuban speech. Just throw Castro in with the
        other dictators." Goodwin to draft an answer to a telegram from Somoza saying democracy for Nicaragua is Kennedy''s
        hope too.'
      n: '[[w.goodwin-remembering-america]], 146–48 (Goodwin''s account). Check: the day; "Sometime toward the end of January"
        (146). Names: Kennedy, Goodwin, Betancourt, Castro.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:betancourt-romulo
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-02.intelligence-2
      when: Feb.
      date: 1961-02
      thread: intelligence
      c: 'The White House. Cord Meyer of the CIA, to Goodwin: "We thought you should know about some of the things we have
        been doing": the National Student Association, publications in Western Europe, contributions to noncommunist parties
        from Italy to Peru. Meyer refers to Guatemala and Iran; not to the U-2 or the plans against Cuba.'
      n: '[[w.goodwin-remembering-america]], 169–70 (Goodwin''s account). Check: the day; "A week or two after the inauguration"
        (169). Names: Goodwin.'
      tags:
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-07.latin-america-dominican-republic
      when: Mar. 7
      date: '1961-03-07'
      thread: latin-america-dominican-republic
      also:
      - latin-america
      c: '10 a.m. Goodwin meets Berle on the Dominican Republic: cables tell of increased brutality by Trujillo''s regime,
        after the OAS States, the United States among them, broke relations. Kennedy, believing Trujillo''s overthrow inevitable
        (by Goodwin''s account), has asked that a contingency plan be drafted to guide the transition to a friendly democratic
        regime.'
      n: '[[w.goodwin-remembering-america]], 152 (Goodwin''s account; "Tuesday, March 7"). Names: Goodwin, Berle, Kennedy,
        Trujillo.'
      tags:
      - name:goodwin-richard-n
      - name:berle-adolf-a
      - name:kennedy-john-f
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-03-07.latin-america
      when: Mar. 7
      date: '1961-03-07'
      thread: latin-america
      c: 10:30 a.m. Schlesinger and Rostow with Goodwin on a special economic mission for Bolivia. Kennedy, who telephoned
        Goodwin at home on both nights of the weekend, had demanded that they "get going on this matter." They decide the
        emissaries are to ignore the International Monetary Fund's and the State Department's proposals for anti-inflationary
        austerity and offer immediate economic assistance.
      n: '[[w.goodwin-remembering-america]], 152–53 (Goodwin''s account). Names: Goodwin, Schlesinger, Rostow, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:rostow-walt-w
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-03-07.cuba-2
      when: Mar. 7
      date: '1961-03-07'
      thread: cuba
      also:
      - latin-america
      c: 11 a.m. Goodwin with men from the Defense Department and the CIA, on the desirability of setting up a revolutionary
        government should the invasion of Cuba, "still-conjectural," succeed.
      n: '[[w.goodwin-remembering-america]], 153 (Goodwin''s account). See [[cal.1961-02-07.cuba]]. Names: Goodwin.'
      tags:
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-07.civil-rights-the-executive
      when: Mar. 7
      date: '1961-03-07'
      thread: civil-rights-the-executive
      c: '2:30 p.m. Robert Kennedy telephones Goodwin, angry: "Too many people are getting involved in this thing" (civil
        rights). "We have to decide whether we are going to have an administration position and what it''s going to be." Goodwin
        takes it that the Attorney General will soon take full command.'
      n: '[[w.goodwin-remembering-america]], 153 (Goodwin''s account). Check: the day; Goodwin ties the call to the freedom
        riders'' "bloody trip to the heart of the South," which began in May 1961. Names: Robert Kennedy, Goodwin.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-07.latin-america-2
      when: Mar. 7
      date: '1961-03-07'
      thread: latin-america
      c: '5 p.m., the "fish room": a final conference of more than twenty on the address to the Latin American diplomats.
        Twice Kennedy calls Goodwin to the Oval Office: "I don''t want it on television. I can''t go to the well too often.
        This is not for the American people, it''s a message to Latin America. Let''s save our television for something like
        health or education. Make sure the speech is beamed to Latin America. Keep repeating it the next day."'
      n: '[[w.goodwin-remembering-america]], 154 (Goodwin''s account). Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-11.latin-america
      when: Mar. 11
      date: '1961-03-11'
      thread: latin-america
      c: 'The Oval Office. Goodwin brings Kennedy the draft of the Alliance for Progress address, which he must give "in two
        days." Kennedy reads it for a couple of hours, making editorial revisions: "Good job, Dick." Of the Spanish phrases:
        "But do I really have to say these words?" Goodwin: the whole idea is a partnership, and some Spanish words will be
        taken as a sign of respect. Kennedy: "Do you know any Spanish?" "Not much." "Well I don''t know any." "It would be
        nice if they could understand what I was saying. ... Maybe I''ll get Jackie to help me."'
      n: '[[w.goodwin-remembering-america]], 155–56 (Goodwin''s account; Goodwin had worked on the draft at home "a few days").
        Check: the day; "I''ve got to give it in two days" (155), the address Mar. 13. Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-03-14.latin-america
      when: Mar. 14
      date: '1961-03-14'
      thread: latin-america
      c: 'Kennedy to Goodwin, the morning after the address to the Latin American diplomats: "All right, that''s the easy
        part. I made a speech. Now let''s show we mean it. Starting today."'
      n: '[[w.goodwin-remembering-america]], 167 (Goodwin''s account; he adds it was almost three weeks before he left for
        Rio, 167–68). See [[cal.1961-03-13.latin-america]]. Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-04-20.cuba-6
      when: Apr. 20
      date: '1961-04-20'
      thread: cuba
      c: 'The Oval Office, a few hours after the address to the newspaper editors. Goodwin tells Kennedy his words on unilateral
        intervention were unwise: "a kind of vague threat in the face of defeat," when "we have no intention at all of intervening
        in Cuba." Kennedy: "I didn''t want us to look like a paper tiger. We should scare people a little, and I did it to
        make us appear still tough and powerful. ... Anyways, it''s done. You may be right, but it''s done."'
      n: '[[w.goodwin-remembering-america]], 180–81 (Goodwin''s account, from his notes: "the first time I had made an ex
        post facto criticism of the president"). See [[cal.1961-04-20.cuba]]. Names: Goodwin, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-21.cuba-4
      when: Apr. 21
      date: '1961-04-21'
      thread: cuba
      c: 'The breakfast before the press conference, by Goodwin''s notes. Kennedy: "The happiest people in government today
        are the ones who can say they didn''t know anything about it." He will make "a short opening statement designed to
        cut off questions about Cuba." Worried that the blame will fall wholly on the CIA, after Reston''s story of an operation
        not properly staffed and no NSC meeting; it is decided to leak that the Joint Chiefs studied and approved it. He "could
        fire Allen Dulles," a man who "would go quietly," but Dulles keeps the Republicans off his back. "Memory is short,
        and if we just sit tight for about three weeks, things will cool off."'
      n: '[[w.goodwin-remembering-america]], 181 (Goodwin''s account, quoting his notes). Names: Kennedy, Dulles, Reston,
        Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:dulles-allen-w
      - name:reston-james
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-04.cuba-4
      when: Apr.
      date: 1961-04
      thread: cuba
      c: 'The Oval Office, on Goodwin''s return from Rio, the invasion approved. Kennedy leads him to a window over the Rose
        Garden: "Well, Dick, it looks like we''re finally going to put your Cuban policy into action": Goodwin''s campaign
        statement on the "freedom fighters."'
      n: '[[w.goodwin-remembering-america]], 179–80 (Goodwin''s account). Check: the day; between his return from Rio and
        the landing of Apr. 17. See [[cal.1960-10-19.elections-1960-kennedy]]. Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1961-08-04.latin-america
      when: Aug. 4
      date: '1961-08-04'
      thread: latin-america
      c: 'Punta del Este, the night before the conference opens. In Dillon''s hotel room Goodwin objects that the delegation
        has only words to give. Dillon: "I''ll pledge a billion dollars a year." Ed Martin of the State Department: "We can''t
        do that. Nobody has approved it. It hasn''t been cleared." Dillon: "Of course I have the authority. I''m the personal
        representative of the president of the United States ... Plenipotentiary. It says so on my credentials. And I''m going
        to give them a billion dollars."'
      n: '[[w.goodwin-remembering-america]], 191–92 (Goodwin''s account). Names: Goodwin, Dillon, Martin.'
      tags:
      - name:goodwin-richard-n
      - name:dillon-c-douglas
      - name:martin-edwin-m
      - city:punta-del-este
- add:
    entry:
      id: cal.1961-08.latin-america
      when: Aug.
      date: 1961-08
      thread: latin-america
      also:
      - cuba
      c: 'Punta del Este. Guevara, to a young Argentine delegate, of Goodwin''s cigars: "I see Goodwin likes cigars. I bet
        he wouldn''t dare smoke Cuban cigars." The next day a polished-mahogany box of Havanas arrives at Goodwin''s room,
        with Guevara''s typed, signed note, in Spanish: "Since I have no greeting card, I have to write. Since to write to
        an enemy is difficult, I limit myself to extending my hand."'
      n: '[[w.goodwin-remembering-america]], 195–96 (Goodwin''s account; the note in his English). Check: the day, Aug. 5–17.
        Names: Guevara, Goodwin.'
      tags:
      - name:guevara-ernesto
      - name:goodwin-richard-n
      - city:punta-del-este
- add:
    entry:
      id: cal.1961-08-19.latin-america
      when: Aug. 19
      date: '1961-08-19'
      thread: latin-america
      also:
      - cuba
      c: 'The White House, on the delegation''s return from Punta del Este. Kennedy greets the delegation on the lawn, then
        walks in with Goodwin, who tells him of the meeting with Guevara. No sign of annoyance: "Write up a complete account,
        and circulate it to Rusk, Bundy, and the others." He opens Guevara''s box of Cuban cigars, takes one, lights it: "You
        should have smoked the first one."'
      n: '[[w.goodwin-remembering-america]], 202 (Goodwin''s account). Check: the day; the meeting ran to almost 6 a.m., and
        the delegation flew eleven hours to Andrews. See [[cal.1961-08-17.latin-america]]. Names: Kennedy, Goodwin, Guevara,
        Rusk, Bundy.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:guevara-ernesto
      - name:rusk-dean
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-08.cuba
      when: Aug.
      date: 1961-08
      thread: cuba
      c: 'Goodwin to Kennedy, in a memorandum on Cuba policy after the Punta del Este conference and the talk with Guevara:
        "Pay as little attention as possible to Cuba. Do not allow them to appear as the victims of U.S. aggression. Do not
        create the impression we are obsessed with Castro — an impression which only strengthens Castro''s hand in Cuba and
        encourages anti-American and leftist forces in other countries to rally round the Cuban flag."'
      n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account, quoting the memorandum). Check: the day; the book dates
        it after the conference only. Names: Goodwin, Kennedy, Castro.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-10.latin-america-dominican-republic
      when: Oct.
      date: 1961-10
      thread: latin-america-dominican-republic
      also:
      - latin-america
      - intelligence
      c: 'The Oval Office, the afternoon after the press conference on advisers in the White House and State. Kennedy to Goodwin:
        "maybe we''d be better off if you were in the State Department, closer to the action"; then, brushing it aside: "Hell,
        if Dick goes over there, we''ll never hear anything about Latin America." Told that the CIA has transferred small
        arms to a group that would overthrow Trujillo by assassination: "Tell them no more weapons. The United States is not
        to get involved in any assassinations. I''d like to get rid of Trujillo, but not that way."'
      n: '[[w.goodwin-remembering-america]], 210 (Goodwin''s account). Check: the day; the book puts the press conference
        "late in October"; Bundy waiting in the room. Names: Kennedy, Goodwin, Bundy, Trujillo.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:bundy-mcgeorge
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-11.transition-and-staff-2
      when: Nov.
      date: 1961-11
      thread: transition-and-staff
      also:
      - latin-america
      c: 'The South Lawn, before the helicopter for Kennedy''s weekend in Virginia. He beckons Goodwin to the steps and says,
        over the rotors: "You know, Dick, I think you''ll be more effective in the State Department. I''m going to announce
        it next week." Mounting the steps: "We''ll talk about it when I get back." The talk never took place.'
      n: '[[w.goodwin-remembering-america]], 210–11 (Goodwin''s account). Check: the day; Kennedy announced the changes in
        the State Department Nov. 17 (212). Names: Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1962-10.missile-crisis-diplomacy-2
      when: Oct.
      date: 1962-10
      thread: missile-crisis-diplomacy
      also:
      - latin-america
      c: 'At the White House''s request Goodwin works with Schlesinger on the draft of Stevenson''s speech for the United
        Nations: its subject, the Soviet missiles in Cuba. Goodwin is then to go with Dillon to Mexico City, to the meeting
        of the Latin American foreign ministers, to explain Kennedy''s naval quarantine before he announces it.'
      n: '[[w.goodwin-remembering-america]], 217 (Goodwin''s account; he did not take part in the secret deliberations). Check:
        the day; "mid-October of 1962" (217). Names: Goodwin, Schlesinger, Stevenson, Dillon, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:stevenson-adlai-e
      - name:dillon-c-douglas
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-03-18.latin-america-2
      when: Mar. 18
      date: '1963-03-18'
      thread: latin-america
      c: 'San José, Kennedy''s hotel room, the night of arrival; with Goodwin, O''Donnell and Powers. Kennedy, jacket off,
        waves to the crowd in the street: "If we could only move them all to Ohio, just for the election. I might carry the
        damn state." Of cables from Southeast Asia: "Think of all the energy and time we''re putting in over there. This is
        where we should be putting our attention. It''s all going to be decided down here. ... It''s going to be the biggest
        foreign-policy issue in the election, Latin America."'
      n: '[[w.goodwin-remembering-america]], 221 (Goodwin''s account). See [[cal.1963-03-18.latin-america]]. Names: Kennedy,
        Goodwin, O''Donnell.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:odonnell-kenneth-p
      - city:san-jose
- add:
    entry:
      id: cal.1963-11-19.press-and-broadcasting
      when: Nov. 19
      date: '1963-11-19'
      thread: press-and-broadcasting
      also:
      - latin-america
      c: 'Evelyn Lincoln''s office. Kennedy tells Goodwin he thought the Miami speech went well, then picks up the Washington
        Daily News, "Kennedy Gets Mild Response from Publishers," and is infuriated: "It serves me right to talk to publishers.
        I don''t want to talk to publishers again. It doesn''t do any good. What about that dinner in New York? Do I have
        to do that?" To Goodwin: "Come and see me tomorrow."'
      n: '[[w.goodwin-remembering-america]], 224 (Goodwin''s account; Goodwin had flown to Palm Beach the weekend of Nov.
        16 to work on the speech). See [[cal.1963-11-18.cuba]]. Names: Kennedy, Goodwin, Lincoln.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:lincoln-evelyn
- add:
    entry:
      id: cal.1963-11-20.latin-america
      when: Nov. 20
      date: '1963-11-20'
      thread: latin-america
      c: 'The White House. Goodwin brings in a group of Latin American artists and intellectuals, who urge Kennedy to make
        his brother head of all Latin American affairs, "a kind of hemispheric superchief." Kennedy: "It''s a good idea. I
        understand you''re going to see the attorney general later in the day. Why don''t you ask Bobby if he''ll take the
        job." Robert Kennedy is receptive, but noncommittal.'
      n: '[[w.goodwin-remembering-america]], 224 (Goodwin''s account). Names: Kennedy, Robert Kennedy, Goodwin.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1963-11-20.latin-america-2
      when: Nov. 20
      date: '1963-11-20'
      thread: latin-america
      also:
      - transition-and-staff
      c: 'The Oval Office, the afternoon. Goodwin and Schlesinger again urge an undersecretary of state for Latin America,
        a relative of the President if need be. Kennedy: "I''ve told Rusk three times that I thought we should have an undersecretary
        for Latin affairs. All I get back is that it''s being studied. Arthur, you and Dick write a memo for me to sign. Say
        that I already know the reasons why I can''t do it. Now I want the reasons why I can do it." He approves Goodwin''s
        names for the Council of the Arts and asks for James Fleming of Indiana; of the Council: "It''s a good idea, let''s
        work on it." Goodwin never saw him again.'
      n: '[[w.goodwin-remembering-america]], 224–25 (Goodwin''s account). Names: Kennedy, Goodwin, Schlesinger, Rusk.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:rusk-dean
- add:
    entry:
      id: cal.1963-11-21.transition-and-staff
      when: Nov. 21
      date: '1963-11-21'
      thread: transition-and-staff
      c: Thursday morning. Milton Esterow of the New York Times tells Goodwin he is writing for the next day's paper that
        Kennedy intends to appoint him presidential adviser on the arts, with a "Man in the News" profile. Goodwin telephones
        the party in Texas; within the hour the assistant press secretary reports that Kennedy wants a statement on the appointment,
        for release Friday afternoon.
      n: '[[w.goodwin-remembering-america]], 225 (Goodwin''s account). Names: Goodwin, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-22.assassination-16
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      c: 'The White House, from the afternoon. Goodwin, told the President is dead, goes to Ralph Dungan''s office, where
        Shriver, Bundy, Sorensen and others are at work on the arrangements. With Shriver, Walton and Schlesinger he prepares
        the East Room as it was when Lincoln lay there, at Mrs. Kennedy''s wish: a catafalque from Fort Myer, black crepe,
        candlesticks, Shriver''s crucifix, an honor guard. Shriver rules that the public will view the body at the Capitol
        Rotunda. Schlesinger: "What kind of country is this?"'
      n: '[[w.goodwin-remembering-america]], 226–29 (Goodwin''s diary, repeated "slightly edited"). Names: Goodwin, Dungan,
        Shriver, Bundy, Sorensen, Walton, Schlesinger, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:dungan-ralph-a
      - name:shriver-r-sargent
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:walton-william
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-12-15.latin-america
      when: Dec. 15
      date: '1963-12-15'
      thread: latin-america
      c: 'Sunday morning. Pedro San Juan, who had been Kennedy''s interpreter and adviser on Latin American trips, telephones
        Goodwin: "I am going to write an obituary. The Alliance for Progress, born October 1960, died, December 14, 1963."
        Goodwin''s diary: "There is real gloom among the advocates of the Alliance for Progress. Mann is a colonialist by
        mentality ..."'
      n: '[[w.goodwin-remembering-america]], 245 (Goodwin''s account, quoting his diary). See [[cal.1963-12-14.latin-america]].
        Names: Goodwin, Mann.'
      tags:
      - name:goodwin-richard-n
      - name:mann-thomas-c
- add:
    entry:
      id: cal.1963-12-16.robert-kennedy
      when: Dec. 16
      date: '1963-12-16'
      thread: robert-kennedy
      also:
      - latin-america
      c: 'The Attorney General''s office, Monday. Schlesinger and Goodwin, to discuss the Kennedy Library and to lament Mann''s
        appointment, find Robert Kennedy pouring bourbon. On the Alliance: "It''s important to me and Ed Henry and a lot of
        people." Harriman had told him: "I didn''t come down here to work for George Ball or Dean Rusk; I came to work for
        John Kennedy." "We''re important to Johnson. I''m the most important because my name happens to be Kennedy. But we''re
        all important, if we act together." Then: "I''ve lost a brother, but that''s not what''s important. What''s important
        is what we were trying to do for this country. ... Remember after November fifth we''re all done." Of a column on
        southern opposition to him as Vice President: "Well, he''s already got the Negroes."'
      n: '[[w.goodwin-remembering-america]], 246–47 (Goodwin''s account). Check: the telephone call he took, "He''s dead.
        Let him be dead," not identified. Names: Robert Kennedy, Schlesinger, Goodwin, Harriman, Ball, Rusk, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:goodwin-richard-n
      - name:harriman-w-averell
      - name:ball-george-w
      - name:rusk-dean
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-03-17.latin-america-panama
      when: Mar. 17
      date: '1964-03-17'
      thread: latin-america-panama
      c: 'The Oval Office. Johnson, coming out as Goodwin waits in the corridor during a Peace Corps meeting in the fish room:
        "Tell me, Dick, what do you think we should do about this Panama thing?" Goodwin: "Tell them they''re a great country,
        our allies in the fight for freedom, that they''ve fought beside us in war and been our friends in peace, that we''re
        grateful, glad to have them as friends, anxious to keep a small misunderstanding from damaging such a valuable relationship."
        Johnson: "Can you write me a statement?" "Send it over to Jack Valenti. He''ll make sure it gets right to me." Goodwin
        finishes it by early evening; Valenti sends a messenger for it.'
      n: '[[w.goodwin-remembering-america]], 250–52 (Goodwin''s account). Check: the day; "Around March 17" (250). Names:
        Johnson, Goodwin, Valenti, Shriver.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:valenti-jack
      - name:shriver-r-sargent
- add:
    entry:
      id: cal.1964-03-21.latin-america-panama
      when: Mar. 21
      date: '1964-03-21'
      thread: latin-america-panama
      c: 'The White House. Johnson walks into George Reedy''s morning briefing: "Is it all right with you folks, if I monitor
        your press conference?" He reads a statement, to go to the president of the OAS that afternoon: the inability to resolve
        differences with Panama "a source of deep regret"; "We are prepared to review every issue ... at any time and at any
        place." Goodwin''s draft, marginally amended; four days without acknowledgment. Mar. 24: Chiari welcomes the "constructive
        evaluation."'
      n: '[[w.goodwin-remembering-america]], 252–53 (Goodwin''s account; the statement and Chiari''s reply quoted in part).
        Names: Johnson, Reedy, Goodwin, Chiari.'
      tags:
      - name:johnson-lyndon-b
      - name:reedy-george-e
      - name:goodwin-richard-n
      - name:chiari-roberto-f
- add:
    entry:
      id: cal.1964-03.transition-and-staff
      when: Mar.
      date: 1964-03
      thread: transition-and-staff
      c: 'Valenti, having asked Goodwin for a speech for a Democratic party gathering, hears the draft the next day: it is
        "just the sort of thing he wanted for LBJ." "LBJ''s way of speaking is a lot closer to Roosevelt than to Kennedy.
        Kennedy''s stuff might have been fine for him, but not for Johnson." He will recommend that the president bring Goodwin
        to the White House, and take the speech up "in its pristine form."'
      n: '[[w.goodwin-remembering-america]], 253–54 (Goodwin''s account). Check: the day; "Within a day or two" of the Mar.
        21 statement (253). Names: Valenti, Goodwin, Johnson, Kennedy.'
      tags:
      - name:valenti-jack
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1964-03.robert-kennedy-3
      when: Mar.
      date: 1964-03
      thread: robert-kennedy
      also:
      - transition-and-staff
      c: 'Robert Kennedy, asked by Goodwin the night after Valenti''s offer whether he should take a White House job under
        Johnson: "from the selfish point of view ... I wish you wouldn''t. But I guess you have to. After all, if any one
        of us is in a position to keep him from blowing up Costa Rica, or something like that, then we ought to do it. So
        I guess you should do it. If you do, you have to do the best job you can, and with complete loyalty. There''s no other
        way."'
      n: '[[w.goodwin-remembering-america]], 254 (Goodwin''s account). Check: the day. Names: Robert Kennedy, Goodwin, Valenti,
        Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:valenti-jack
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-03.transition-and-staff-2
      when: Mar.
      date: 1964-03
      thread: transition-and-staff
      c: 'Pennsylvania Avenue, midmorning. Bundy, whom Goodwin has not talked with in almost a year, hails him: "We really
        miss you at the White House, Dick. We could really use someone of your abilities." That afternoon the offer is made
        and accepted; Goodwin''s responsibilities are to be almost exclusively domestic.'
      n: '[[w.goodwin-remembering-america]], 254 (Goodwin''s account). Check: the day; the morning after the talk with Robert
        Kennedy. Names: Bundy, Goodwin.'
      tags:
      - name:bundy-mcgeorge
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1964-03.transition-and-staff-3
      when: Mar.
      date: 1964-03
      thread: transition-and-staff
      also:
      - program
      c: 'The mansion, a morning. Johnson, in the bathroom off his bedroom, to Goodwin: "I wanted you to work for me. Some
        folks around here, some of your Kennedy friends, were against it. ... Look, Dick, I need you. I need you more than
        Kennedy ever did. And you need me." "I''m going to pass all those bills you cared about." "You''re going to be my
        voice, my alter ego, like Harry Hopkins." "I''m going to get my War on Poverty. ... But no compromises on civil rights.
        I''m not going to bend an inch, this year or next. Those civil rightsers are going to have to wear sneakers to keep
        up with me."'
      n: '[[w.goodwin-remembering-america]], 256–58 (Goodwin''s account). Check: the day; "one morning in late March 1964"
        (256). Names: Johnson, Goodwin, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1964-04.program-2
      when: Apr.
      date: 1964-04
      thread: program
      also:
      - vietnam
      c: 'The White House pool. Johnson, swimming, has Goodwin and Moyers come in, undressed: "Now, I''ve got two basic problems
        — get elected, and pass legislation the country needs." The tax cut done and "the civil rights bill is coming — with
        a little high-priced help from my good friend Dirksen." Medicare may take longer. "Now, boys, you let me finish the
        Kennedy program. You start to put together a Johnson program, and don''t worry about whether it''s too radical or
        if Congress is ready for it. That''s my job." Leaving the pool: "They''re trying to get me in a war over there: It
        will destroy me. I turned them down three times last week."'
      n: '[[w.goodwin-remembering-america]], 267–71 (Goodwin''s account). Check: the day; "one afternoon in early April of
        1964" (267). Names: Johnson, Goodwin, Moyers, Dirksen.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:moyers-bill
      - name:dirksen-everett
- add:
    entry:
      id: cal.1964-05-22.program-2
      when: May 22
      date: '1964-05-22'
      thread: program
      c: 'The Oval Office, the morning. Goodwin, with Moyers, brings Johnson the draft of the Michigan commencement address,
        finished the night before. Johnson, penciling changes, reads it, then reads it again, more slowly. Goodwin: "It''s
        very different from Kennedy, Mr. President ... It''s a whole new direction for the Democratic party." Johnson: "It
        ought to do just fine, boys. Just what I told you." Then, to Valenti: "What time''s that damn plane leave? And why
        are we always running out of Fresca?"'
      n: '[[w.goodwin-remembering-america]], 277–78 (Goodwin''s account; he does not go to Ann Arbor and watches the videotape).
        See [[cal.1964-05-22.program]]. Names: Goodwin, Moyers, Johnson, Valenti.'
      tags:
      - name:goodwin-richard-n
      - name:moyers-bill
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-05.press-and-broadcasting
      when: May
      date: 1964-05
      thread: press-and-broadcasting
      also:
      - program
      - elections-1964
      c: 'The small room beside the Oval Office, a few days after Ann Arbor. Johnson to Goodwin, over scotch: "Henry Luce
        called me this morning. Old man Henry himself. He said he''d support me on the basis of the Great Society speech alone."
        With Moyers and Valenti he reads reviews by Reston, Krock and U.S. News. "The only two newspapermen practically all
        of them admire are Lippmann and Reston. As long as these two are for LBJ, he will, on the whole, get a good press
        from the rest of them." If Goldwater is nominated, "we''ll sweep every part of the country, even New York."'
      n: '[[w.goodwin-remembering-america]], 282–83 (Goodwin''s account). Check: the day; "a few days after returning from
        Ann Arbor" (282). Names: Johnson, Goodwin, Luce, Moyers, Valenti, Reston, Krock, Lippmann, Goldwater.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:moyers-bill
      - name:valenti-jack
      - name:reston-james
      - name:lippmann-walter
      - name:goldwater-barry-m
      - name:luce-henry-r
      - name:krock-arthur
- add:
    entry:
      id: cal.1964-07-29.robert-kennedy-6
      when: July 29
      date: '1964-07-29'
      thread: robert-kennedy
      also:
      - elections-1964-vice-presidency
      c: 'The White House drive. Moyers telephones Goodwin: "Lyndon''s telling Bobby that he can''t have the nomination."
        Goodwin, pacing between the West Wing and the Executive Office Building, sees Robert Kennedy''s limousine stop and
        the window roll down. Goodwin: "It''s too bad." Kennedy: "That''s okay." Goodwin: "I suppose there''s nothing to be
        done about it." Kennedy shakes his head and drives off.'
      n: '[[w.goodwin-remembering-america]], 298 (Goodwin''s account). See [[cal.1964-07-29.robert-kennedy]]. Names: Moyers,
        Goodwin, Robert Kennedy, Johnson.'
      tags:
      - name:moyers-bill
      - name:goodwin-richard-n
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-08-26.elections-1964-atlantic-city-4
      when: Aug. 26
      date: '1964-08-26'
      thread: elections-1964-atlantic-city
      c: 'Aboard the plane to Atlantic City, to nominate Humphrey; with Goodwin, who had helped draft both Johnson''s speeches.
        Johnson, glass held to the light: "every family has a certain thread that runs through it. In the Kennedys it was
        women. ... For other families it''s money, or skiing, or meat. In ours it was alcohol." He holds out the glass for
        a refill.'
      n: '[[w.goodwin-remembering-america]], 301 (Goodwin''s account). See [[cal.1964-08-26.elections-1964]]. Names: Johnson,
        Goodwin.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - state:nj
      - city:atlantic-city
- add:
    entry:
      id: cal.1964-08-27.elections-1964-atlantic-city
      when: Aug. 27
      date: '1964-08-27'
      thread: elections-1964-atlantic-city
      c: 'Aboard the plane to Atlantic City, the night of the acceptance speech. Busby and Goodwin revise the draft on the
        president''s last-minute directions. Goodwin: with Goldwater as the opponent Johnson can run the campaign from the
        White House. Johnson: "You fellows ought to stop talking about being happy about Goldwater. Suppose there is a heart
        attack or something. Goldwater is a mean, vindictive little man." He recalls Goldwater''s letter after he took the
        vice-presidency: demeaning to accept office under someone who was his inferior.'
      n: '[[w.goodwin-remembering-america]], 301–2 (Goodwin''s account). Names: Busby, Goodwin, Johnson, Goldwater.'
      tags:
      - name:busby-horace
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:goldwater-barry-m
      - state:nj
      - city:atlantic-city
- add:
    entry:
      id: cal.1964-08.elections-1964-johnson
      when: Aug.
      date: 1964-08
      thread: elections-1964-johnson
      also:
      - elections-1964
      c: 'The West Wing, the first floor, an early campaign meeting: Moyers, Valenti, Goodwin, Clifford, O''Brien. Johnson,
        unannounced: "Now, boys, let''s hear what you have in mind for me." After twenty minutes: "I''m the president. That''s
        our greatest asset. And I don''t want to piss it away by getting down in the mud with Barry." The Hutchinson story:
        "Now Barry''s already got a rope around him, and he''s knotted it pretty firm. All you have to do is give a little
        tug. And while he''s fighting to keep standing, I''ll just sit right here and run the country."'
      n: '[[w.goodwin-remembering-america]], 303–4 (Goodwin''s account). Check: the day; "toward the end of August" (303).
        Names: Johnson, Moyers, Valenti, Goodwin, Clifford, O''Brien, Goldwater.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:valenti-jack
      - name:goodwin-richard-n
      - name:clifford-clark
      - name:obrien-lawrence-f
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-08.elections-1964-5
      when: Aug.
      date: 1964-08
      thread: elections-1964
      also:
      - elections-1964-goldwater
      c: 'The White House, the end of the month. Moyers, Goodwin and others view the television spot made for the campaign:
        a girl plucks a daisy as a countdown becomes a nuclear explosion; "Vote for President Johnson on November third. The
        stakes are too high for you to stay home." Moyers: "It''s wonderful. But it''s going to get us in a lot of trouble."
        The plan: saturate prime time for a few days, then withdraw it when the protests come.'
      n: '[[w.goodwin-remembering-america]], 304–6 (Goodwin''s account; the voice-over as he gives it). Check: the day; "at
        the end of August" (305). Names: Moyers, Goodwin.'
      tags:
      - name:moyers-bill
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-03-15.voting-rights-11
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'The White House, 9:30 a.m. Valenti to Goodwin at his office door: "Good morning, Dick, the president''s speaking
        to Congress tonight. He needs a speech from you right away." Valenti, senior at Sunday''s meeting, had assigned a
        draft to Busby. Johnson, told so in bed that morning: "The hell you did. Don''t you know a liberal Jew has his hand
        on the pulse of America? And you assign the most important speech of my life to a Texas public relations man? Get
        Dick to do it. And now!" Goodwin writes until 6 p.m.'
      n: '[[w.goodwin-remembering-america]], 325–28 (Goodwin''s account; the bedroom scene by Moyers''s account to Goodwin
        that evening). See [[cal.1965-03-15.voting-rights-10]]. Names: Valenti, Goodwin, Busby, Johnson, Moyers.'
      tags:
      - name:valenti-jack
      - name:goodwin-richard-n
      - name:busby-horace
      - name:johnson-lyndon-b
      - name:moyers-bill
- add:
    entry:
      id: cal.1965-04-28.latin-america-dominican-republic-4
      when: Apr. 28
      date: '1965-04-28'
      thread: latin-america-dominican-republic
      c: 'The West Wing. Goodwin, summoned to an emergency meeting in the Cabinet Room, meets Bundy, who says the President
        has ordered Marines flown to the Dominican Republic: "They''re already in the air." Goodwin: why the Marines, why
        not the Army? In the Cabinet Room Bundy tells others, laughing: "You know what Goodwin says? He wants to know if we
        can send someone else beside the marines."'
      n: '[[w.goodwin-remembering-america]], 406 (Goodwin''s account). See [[cal.1965-04-28.latin-america-dominican-republic-2]].
        Names: Goodwin, Bundy, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-06-22.transition-and-staff
      when: June 22
      date: '1965-06-22'
      thread: transition-and-staff
      c: 'The Oval Office; Moyers and Goodwin with Johnson. Goodwin remarks that the aid-to-education bill has the support
        of the liberal organizations; Johnson: "I am not going to have anything more to do with the liberals. They won''t
        have anything to do with me. They all just follow the communist line — liberals, intellectuals, communists. ... I
        detest the United Nations. They''ve tried to make a fool out of me. ... I can''t trust anybody anymore. ... I''m going
        to get rid of everybody who doesn''t agree with my policies. I''ll take a tough line — put Abe Fortas or Clark Clifford
        in the Bundy job." Of Gagarin and the astronauts in Paris: "a personal insult to me."'
      n: '[[w.goodwin-remembering-america]], 401 (Goodwin''s account, from his diary of that day; the first part also the
        epigraph, 392). Names: Johnson, Moyers, Goodwin, Fortas, Clifford, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:goodwin-richard-n
      - name:fortas-abe
      - name:clifford-clark
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-06-28.transition-and-staff
      when: June 28
      date: '1965-06-28'
      thread: transition-and-staff
      c: 'The Oval Office, by Goodwin''s diary. Johnson asks Goodwin and Moyers whether Tom Wicker is out to destroy him,
        in some conspiracy; they say no. He switches: Robert Kennedy was behind the public assassination of Ed Clark, whom
        he had made ambassador to Australia; and he had agreed to appoint Harlan Cleveland to the fourth place at State but
        now "wouldn''t appoint him dog catcher": he thinks Cleveland leaked the story of the United Nations speech to Reston.'
      n: '[[w.goodwin-remembering-america]], 401 (Goodwin''s account, from his diary of June 28). Names: Johnson, Goodwin,
        Moyers, Wicker, Robert Kennedy, Cleveland, Reston.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:moyers-bill
      - name:wicker-tom
      - name:kennedy-robert-f
      - name:cleveland-j-harlan
      - name:reston-james
- add:
    entry:
      id: cal.1965-07-05.transition-and-staff
      when: July 5
      date: '1965-07-05'
      thread: transition-and-staff
      c: 'The Oval Office. Johnson, interrupting a talk on domestic matters, lifts a manila folder from his desk: "You know,
        Dick, the communists are taking over the country. Look here. It''s Teddy White''s FBI file. He''s a communist sympathizer."'
      n: '[[w.goodwin-remembering-america]], 402 (Goodwin''s account). Names: Johnson, Goodwin, White.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:white-theodore-h
- add:
    entry:
      id: cal.1965-07-14.vietnam-july-decision-4
      when: July 14
      date: '1965-07-14'
      thread: vietnam-july-decision
      c: 'A staff meeting. Johnson walks in, listens a while: "Don''t let me interrupt. But there''s one thing you ought to
        know. Vietnam is like being in a plane without a parachute, when all the engines go out. If you jump, you''ll probably
        be killed, and if you stay in, you''ll crash and probably burn. That''s what it is." He leaves without waiting for
        a reply.'
      n: '[[w.goodwin-remembering-america]], 403–4 (Goodwin''s account). Names: Johnson, Goodwin.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1965-07.vietnam-july-decision-4
      when: July
      date: 1965-07
      thread: vietnam-july-decision
      c: 'A National Security Council meeting, Goodwin invited as an observer because the agenda includes a major speech he
        would draft. Johnson: "There are those who think we already have enough troops, and that I should turn Westmoreland
        down. ... Others, like Bob McNamara, want me to declare war, call up the reserves ... The third possibility is to
        do pretty much what we''re doing, send Westy the troops he says he needs." No hand for doing nothing; none for a war
        government, McNamara silent. "Well, then, I guess we''re all in agreement." To Wheeler: "You agree, don''t you, General
        Wheeler?" He nods. "Fine, then, it''s all decided. I hope you fellows are right, but I''m willing to bet on you."'
      n: '[[w.goodwin-remembering-america]], 382–83 (Goodwin''s account; no numbers discussed). Check: the day; "In July"
        (382). Names: Johnson, Goodwin, McNamara, Wheeler, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:westmoreland-william
- add:
    entry:
      id: cal.1966-01-12.program-3
      when: Jan. 12
      date: '1966-01-12'
      thread: program
      c: The White House, the day of the State of the Union. Goodwin, after a week of drafting and almost thirty-six hours
        without rest, finishes the peroration at dawn; the White House doctor injects an unnamed red liquid so he can go on.
        The text goes to the president by midmorning; Goodwin hears from former colleagues that the domestic pledges are being
        diluted and the war statements made more militant. At the end of the afternoon the president's secretary asks him
        to ride to the Hill; he says he will call back, has the operator hold his calls, and goes back to sleep.
      n: '[[w.goodwin-remembering-america]], 423–24 (Goodwin''s account; "I was never to see or talk to Lyndon Johnson again").
        See [[cal.1966-01-12.program-2]]. Names: Goodwin, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01.vietnam-pause-2
      when: Jan.
      date: 1966-01
      thread: vietnam-pause
      c: 'The Pentagon. Goodwin, hoping to persuade McNamara to continue the pause in the bombing: "since we all know a negotiated
        settlement of some kind is inevitable, the sooner we move the better our bargaining position will be." McNamara, turning
        to the map of Southeast Asia: "Do you think it would make any difference to American security, Dick, if this entire
        place went communist?" Goodwin: that is another question. McNamara: "It wouldn''t make the slightest bit of difference."'
      n: '[[w.goodwin-remembering-america]], 452–53 (Goodwin''s account). Check: the day; "late January" and before the resumption
        of the bombing (453). Names: Goodwin, McNamara.'
      tags:
      - name:goodwin-richard-n
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-02.vietnam-3
      when: Feb.
      date: 1966-02
      thread: vietnam
      also:
      - robert-kennedy
      c: 'Robert Kennedy telephones Goodwin in Middletown at 7 a.m. about the Fulbright hearings: "Do you think there''s anything
        constructive I can add?" Goodwin, an hour later: everyone says the solution is a negotiated settlement but no one
        has said what it would look like. Kennedy: "Would you try your hand at a statement?" Goodwin: "I''ll give it a shot."
        That afternoon he reads him the draft, which gives the National Liberation Front "a share of power and responsibility."'
      n: '[[w.goodwin-remembering-america]], 453–54 (Goodwin''s account). Check: the day; "two weeks later" than his late-January
        visit to McNamara (453). Names: Robert Kennedy, Goodwin, Fulbright.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-07-23.assassination
      when: July 23
      date: '1966-07-23'
      thread: assassination
      also:
      - robert-kennedy
      c: 'Book Week. Goodwin, reviewing Edward J. Epstein''s Inquest on the Warren Commission, writes that it "not only raises
        questions but demands explorations and answers," and proposes that an "independent group should look at [Epstein''s]
        charges and determine whether the commission investigation was so flawed that another inquiry is necessary." July
        24, the New York Times: "Mr. Goodwin is the first member of the President''s inner circle to suggest publicly that
        an official re-examination be made of the Warren report."'
      n: '[[w.goodwin-remembering-america]], 462–63 (Goodwin''s account, quoting the review and the Times). Names: Goodwin.'
      tags:
      - name:goodwin-richard-n
- add:
    entry:
      id: cal.1966-07-25.assassination
      when: July 25
      date: '1966-07-25'
      thread: assassination
      also:
      - robert-kennedy
      c: 'New York, Robert Kennedy''s apartment, after dinner, to 2:30 a.m. Goodwin, who is to spend the night, proposes that
        they find their own investigator on the Warren Report; Marina Oswald "must know something." Kennedy, turning his scotch
        glass, eyes on the floor: "I''m sorry, Dick, I just can''t focus on it." He suggests Carmine Bellino. At his bedroom
        door: "I never thought it was the Cubans. If anyone was involved it was organized crime. But there''s nothing I can
        do about it. Not now."'
      n: '[[w.goodwin-remembering-america]], 463–65 (Goodwin''s account). Names: Robert Kennedy, Goodwin.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - city:nyc
- add:
    entry:
      id: cal.1966-09-16.war-opposition
      when: Sept. 16
      date: '1966-09-16'
      thread: war-opposition
      also:
      - vietnam
      c: 'The National Board of Americans for Democratic Action. Goodwin condemns the Administration''s conduct of the war
        and proposes a national organization to unite all its critics. The New York Times, Sept. 17: "Richard N. Goodwin,
        once an adviser and speechwriter for both Presidents, combined his attack with a proposal for a national organization
        to unite all critics of the Administration''s policy." He had not told Robert Kennedy of the talk, "which he regards
        as virtually burning his bridges to the Johnson Administration." The White House refuses comment.'
      n: '[[w.goodwin-remembering-america]], 466–67 (Goodwin''s account, quoting Frankel''s story). Names: Goodwin, Robert
        Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1967-11.robert-kennedy-campaign-decision-2
      when: Nov.
      date: 1967-11
      thread: robert-kennedy-campaign-decision
      also:
      - elections-1968
      c: Goodwin, at Robert Kennedy's request, sets out in a letter the arguments for his running in 1968, with a disclaimer
        that he would advise against it. "If you represent what the American people want ... then they'll go for you." "If
        you can't beat LBJ in 1968, then whom can you beat?" "You are the guy in the back row with the huge cymbals and when
        you clang them at the wrong place the whole auditorium jumps." Kennedy had asked that he not say he wanted him to
        run.
      n: '[[w.goodwin-remembering-america]], 477–79 (Goodwin''s account, quoting the letter). Check: the day; "a letter in
        November 1967" (478). Names: Goodwin, Robert Kennedy, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-12.robert-kennedy-campaign-decision-2
      when: Dec.
      date: 1967-12
      thread: robert-kennedy-campaign-decision
      also:
      - elections-1968
      c: 'Boston, the Charles Restaurant, then Goodwin''s house on Chestnut Street. Goodwin and Edward Kennedy, at Robert
        Kennedy''s asking, debate the arguments for his running; inconclusive. On the sidewalk Edward Kennedy: "Just the same,
        maybe he should do it. All his instincts tell him to go. And he''s got good instincts." Goodwin: what would the President
        have done? "He would have advised against it. But he would have done it himself."'
      n: '[[w.goodwin-remembering-america]], 479–80 (Goodwin''s account). Check: the day; "As fall became winter" (479). Names:
        Edward Kennedy, Goodwin, Robert Kennedy, Kennedy.'
      tags:
      - name:kennedy-edward-m
      - name:goodwin-richard-n
      - name:kennedy-robert-f
      - name:kennedy-john-f
      - state:ma
      - city:boston
- add:
    entry:
      id: cal.1968-03-06.robert-kennedy-campaign-decision
      when: Mar. 6
      date: '1968-03-06'
      thread: robert-kennedy-campaign-decision
      also:
      - elections-1968-mccarthy
      c: 'Wednesday. Robert Kennedy telephones Goodwin in New Hampshire from his New York apartment: "I''m still considering
        getting into this thing, and I''d like McCarthy to know this now, so he doesn''t think my decision has any relationship
        to whatever happens in New Hampshire." Goodwin: "I can''t act as your messenger. I''m working for McCarthy now." He
        will tell McCarthy that Kennedy called and what the message is. Kennedy: "How do you think you''re going to do?" "We''re
        going to get at least forty percent." "How would I have done?" "You would have won sixty-forty."'
      n: '[[w.goodwin-remembering-america]], 506–8 (Goodwin''s account; "six days before the election"). Names: Robert Kennedy,
        Goodwin, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - state:nh
- add:
    entry:
      id: cal.1968-03-08.elections-1968-mccarthy
      when: Mar. 8
      date: '1968-03-08'
      thread: elections-1968-mccarthy
      also:
      - robert-kennedy-campaign-decision
      c: 'New Hampshire, McCarthy''s suite. Goodwin gives McCarthy Robert Kennedy''s message. McCarthy: "Why don''t you tell
        him that I only want one term anyway. Let him support me now, and after that he can have it." "The presidency should
        be a one-term office. Then the power would be in the institution." Of the Kennedys: "They never appreciated me." Goodwin
        telephones Kennedy, whose answer is a groan of disbelief.'
      n: '[[w.goodwin-remembering-america]], 508–9 (Goodwin''s account). Check: the day; "only after two more days" (508)
        from the call of Mar. 6. Names: Goodwin, McCarthy, Robert Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:nh
- add:
    entry:
      id: cal.1968-03.robert-kennedy-campaign-decision
      when: Mar.
      date: 1968-03
      thread: robert-kennedy-campaign-decision
      also:
      - elections-1968-mccarthy
      c: 'Goodwin, in bed with influenza at the Georgetown Inn, telephones Robert Kennedy that he is going to Wisconsin: "you''re
        not on the ballot in Wisconsin, and a defeat for Johnson is as important to you as to McCarthy." Kennedy: "If that''s
        your decision." Goodwin: "That''s it. Good luck." The next day he flies to Milwaukee. Kennedy tells friends and staff
        that Goodwin was responsible for at least 10 percent of McCarthy''s New Hampshire vote, and calls him "His Nibs."'
      n: '[[w.goodwin-remembering-america]], 520 (Goodwin''s account). Check: the day; after Kennedy''s announcement of Mar.
        16, with the primary "little more than two weeks away" (519). Names: Goodwin, Robert Kennedy, McCarthy, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:wi
- add:
    entry:
      id: cal.1968-03-31.elections-1968-mccarthy-3
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-mccarthy
      also:
      - elections-1968-johnson
      c: 'Milwaukee, a hotel suite, Sunday night. Goodwin, Blair Clark and Theodore White watch Johnson''s address. Goodwin:
        "Look at him, he looks terrible. You won''t believe this, but I feel sorry for him." At the announcement he leaps
        up, pointing at the set; by White''s account: "I thought it would take another six weeks." The corridors fill with
        volunteers chanting.'
      n: '[[w.goodwin-remembering-america]], 522–23 (Goodwin''s account; the words at the set as White gives them, Goodwin
        not recalling). See [[cal.1968-03-31.elections-1968-3]]. Names: Goodwin, White, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:white-theodore-h
      - name:johnson-lyndon-b
      - state:wi
      - city:milwaukee
- add:
    entry:
      id: cal.1968-03-31.elections-1968-mccarthy-4
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-mccarthy
      also:
      - elections-1968-johnson
      c: 'Milwaukee, after the address. Goodwin advises McCarthy to call Johnson, which he does (Mrs. McCarthy speaks with
        Mrs. Johnson), and to call Daley, Governor Lawrence and Governor Hughes for their support, to ease the party leaders''
        hostility. McCarthy, returning from a private room: "Indiana will be decisive." Humphrey would not announce until
        April 27.'
      n: '[[w.goodwin-remembering-america]], 524 (Goodwin''s account). See [[cal.1968-03-31.elections-1968-mccarthy-2]]. Names:
        Goodwin, McCarthy, Johnson, Daley, Lawrence, Hughes, Humphrey.'
      tags:
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - name:daley-richard-j
      - name:lawrence-david-l
      - name:hughes-richard-j
      - name:humphrey-hubert-h
      - state:wi
- add:
    entry:
      id: cal.1968-04-05.elections-1968-mccarthy
      when: Apr. 5
      date: '1968-04-05'
      thread: elections-1968-mccarthy
      also:
      - robert-kennedy-campaign-decision
      c: 'Washington, outside McCarthy''s house, the morning after the riots. Goodwin tells McCarthy he is leaving the campaign
        for Robert Kennedy: "I''m sorry, Senator, more than you know, but I just can''t be part of a campaign whose purpose
        is to end the political career of one of my best friends." McCarthy: "Well, that''s the kind of campaign it has to
        be." Goodwin: "That''s how I would have to advise you. And that''s why I can''t do it." McCarthy: "Maybe we''ll meet
        again."'
      n: '[[w.goodwin-remembering-america]], 527 (Goodwin''s account). Names: Goodwin, McCarthy, Robert Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - city:washington
- add:
    entry:
      id: cal.1968-04-05.robert-kennedy-campaign-decision
      when: Apr. 5
      date: '1968-04-05'
      thread: robert-kennedy-campaign-decision
      also:
      - robert-kennedy-campaign
      c: 'Hickory Hill. Robert Kennedy, to Goodwin: "Well, it''s about time." Goodwin: "it''s not my fault you didn''t run.
        You''re the one who put me in this position." In the sitting room, Walinsky, Greenfield, Sorensen, Salinger, O''Donnell.
        Goodwin: "Listen you bastards, I''m the only one of you who did the right thing, and I''m the only one who''s going
        to suffer for it." He spends the next weeks assembling a media crew, John Frankenheimer among them.'
      n: '[[w.goodwin-remembering-america]], 527–28 (Goodwin''s account). Names: Robert Kennedy, Goodwin, Walinsky, Greenfield,
        Sorensen, Salinger, O''Donnell.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:walinsky-adam
      - name:greenfield-jeff
      - name:sorensen-theodore-c
      - name:salinger-pierre
      - name:odonnell-kenneth-p
      - state:va
      - city:mclean
- add:
    entry:
      id: cal.1968-04.robert-kennedy-campaign-6
      when: Apr.
      date: 1968-04
      thread: robert-kennedy-campaign
      also:
      - elections-1968-mccarthy
      c: 'Indianapolis, late at night, outside McCarthy''s headquarters. Robert Kennedy sits on the stairs with young McCarthy
        volunteers: "I know why I''m here. I''m running for office. Why are you here?" A young woman: "I joined his campaign
        in New Hampshire to fight against the war because he was there. And you weren''t there." Kennedy: "I want you to know
        that you make me proud to be an American. You''ve done a wonderful thing. I''m only sorry we couldn''t have done it
        together." Walking on, to Goodwin: "Damn it, damn it all, those are my people."'
      n: '[[w.goodwin-remembering-america]], 530–31 (Goodwin''s account). Check: the day; the Indiana campaign, before the
        primary of May 7. Names: Robert Kennedy, Goodwin, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1968-05-28.robert-kennedy-campaign-primaries-2
      when: May 28
      date: '1968-05-28'
      thread: robert-kennedy-campaign-primaries
      also:
      - elections-1968
      c: 'Aboard the plane from Los Angeles to Portland, election night in Oregon. As reports radioed to the plane show defeat
        nearly certain, the cabin falls silent. Kennedy, near Goodwin: "We frightened them." At the Portland hotel Kennedy,
        O''Brien, vanden Heuvel and others draft the concession: "He beat us, and he beat us fairly. It''s my own fault. I
        could have done a better job. You might point out that our combined vote is an overwhelming rejection of the war."
        Returning to Los Angeles: "I''ve got to debate him."'
      n: '[[w.goodwin-remembering-america]], 533 (Goodwin''s account). See [[cal.1968-05-28.elections-1968-2]]. Names: Robert
        Kennedy, Goodwin, O''Brien, vanden Heuvel, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:goodwin-richard-n
      - name:obrien-lawrence-f
      - name:vanden-heuvel-william-j
      - name:mccarthy-eugene-j
      - state:or
      - city:portland
- cite:
    id: cal.1960-01-14.elections-1960
    item: '[[w.goodwin-remembering-america]], 72–74 (Goodwin and Sorensen meet Kennedy at the Butler Aviation terminal, National
      Airport, on a cold January night, with a draft of the speech: "I don''t mind sticking it to old Ike"; the speech does
      not name Eisenhower; not the delivery)'
    units: '?'
- cite:
    id: cal.1960-05-10.elections-1960-2
    item: '[[w.goodwin-remembering-america]], 88–89 (Humphrey''s telegram of concession at 1 a.m.; Robert Kennedy walks to
      him in the rain; "I am no longer a candidate for the presidential nomination"; Kennedy at Charleston: "The religious
      issue has been buried here in the soil of West Virginia")'
    units: '?'
- cite:
    id: cal.1960-09-25.elections-1960-4
    item: '[[w.goodwin-remembering-america]], 112–16 (Sorensen, Feldman and Goodwin prepare index cards through the night;
      Kennedy reads them in bed next morning; calls Sorensen''s opening statement "too rhetorical" and dictates his own to
      Evelyn Lincoln; naps; not the hotel)'
    units: '?'
- cite:
    id: cal.1960-09-22.farm-2
    item: '[[w.goodwin-remembering-america]], 118–20 (Goodwin''s draft for the Plowing Contest: "Give them the whole thing
      from our position on parity to Food for Peace"; Kennedy''s remark on boarding the plane afterward, "Fuck the farmers
      after November"; not the speech''s words)'
    units: '?'
- cite:
    id: cal.1960-10-14.peace-corps
    item: '[[w.goodwin-remembering-america]], 120 (Goodwin, eating in a campus cafeteria, is told by a press staff member:
      "You know what he just did? He proposed a Peace Corps"; 700 sign up within two days; the book puts Kennedy''s arrival
      "late on the evening of October 13")'
    units: '?'
- cite:
    id: cal.1960-10-19.elections-1960-kennedy
    item: '[[w.goodwin-remembering-america]], 124–26 (Goodwin types the statement at the Biltmore, New York; telephones Kennedy
      at the Carlyle, asleep; none of the staff has "the heart to wake" him; "the only public statement by the candidate in
      the entire campaign that he had not personally reviewed"; Kennedy: "It was the words ''freedom fighters''"; not Sorensen
      or Salinger by name)'
    units: '?'
- cite:
    id: cal.1960-10-20.cuba
    item: '[[w.goodwin-remembering-america]], 125–26 (the sentence "We must attempt to strengthen the non-Batista, democratic,
      anti-Castro forces in exile, and in Cuba itself" quoted; Nixon''s answer the next day; Reston''s Sunday column; Kennedy,
      the next night on the Caroline: "If I win this thing, I won it; but if I lose it, you guys lost it")'
    units: '?'
- cite:
    id: cal.1960-10-25.king
    item: '[[w.goodwin-remembering-america]], 121–22 (Kennedy, told by his brother of King''s arrest, asks his staff; O''Donnell
      and others against intervening; Shriver, waiting outside, has Goodwin tell him when the staff have gone, and speaks
      to Kennedy alone; Kennedy then telephones Coretta King: "do all I can"; King freed that day; the elder King''s vote;
      not the Judge''s order)'
    units: '?'
- cite:
    id: cal.1960-11-05.elections-1960-kennedy
    item: '[[w.goodwin-remembering-america]], 127–29 (the motorcade lost, "riding around the Bronx trying to find some crowds";
      Kennedy at the Biltmore: "It''s that fucking De Sapio, he screwed the whole thing up"; "I''ll take care of those guys
      after Tuesday"; the driver: "Well next time get a road map"; not O''Donnell as a target)'
    units: '?'
- cite:
    id: cal.1960-11-05.elections-1960-kennedy-12
    item: '[[w.goodwin-remembering-america]], 127–29 (Goodwin and Dave Powers wait at the Carlyle with the draft of the evening''s
      speech, then take a taxi to the Biltmore; Kennedy in his undershorts eating from a food warmer, Goodwin cutting his
      steak; he walks through the guests, among them Lehman, Mrs. Roosevelt, De Sapio and Prendergast, to the driver; not
      Johnson)'
    units: '?'
- cite:
    id: cal.1960-11-05.elections-1960-kennedy-11
    item: '[[w.goodwin-remembering-america]], 129–30 (Goodwin''s draft of the evening''s speech, which Kennedy makes "his
      own"; "I am not promising action in the first 100 days alone — I am promising you 1000 days of exacting presidential
      leadership"; not the oath)'
    units: '?'
- cite:
    id: cal.1960-10-18.latin-america
    item: '[[w.goodwin-remembering-america]], 109 (the Alianza para Progreso "first proclaimed" at Tampa on Oct. 18; Goodwin''s
      account of its drafting for San Antonio, Sept. 12, 108–9)'
    units: '?'
- cite:
    id: cal.1960-09-12.elections-1960
    item: '[[w.goodwin-remembering-america]], 109–10 (the Houston ministers "that night," the day of the Alamo speech; Kennedy''s
      words quoted in part; not the question period)'
    units: '?'
- cite:
    id: cal.1961-03-13.latin-america
    item: '[[w.goodwin-remembering-america]], 156–59 (that afternoon Kennedy in the Oval Office practices "techo ... trabajo
      ... obrero," Goodwin correcting him; the East Room at 5 p.m., the address at 6, quoted at length; the ambassadors''
      reaction, "El Plan Kennedy"; the text''s Spanish phrases)'
    units: '?'
- cite:
    id: cal.1961-04-07.cuba-2
    item: '[[w.goodwin-remembering-america]], 176–77 (a breakfast in the White House mess with Schlesinger, Rostow and Bundy,
      who suggests he see Rusk; Rusk: "You know, Dick, maybe we''ve been oversold on the fact that we can''t say no to this
      thing"; not the day, "just prior to the week of final decision")'
    units: '?'
- cite:
    id: cal.1961-04-20.cuba
    item: '[[w.goodwin-remembering-america]], 180 (the address "the most truculent statement of his administration": "our
      restraint is not inexhaustible"; "we do not intend to be lectured on intervention by those whose character was stamped
      for all time on the bloody streets of Budapest")'
    units: '?'
- cite:
    id: cal.1961-05.cuba-2
    item: '[[w.goodwin-remembering-america]], 189 (about the middle of May at the State Department, some twenty at the table;
      McNamara, his hand on Goodwin''s shoulder: "The only thing to do is eliminate Castro"; the CIA man: "You mean Executive
      Action"; McNamara: "I mean it, Dick, it''s the only way"; the CIA''s memorandum "for the files")'
    units: '?'
- cite:
    id: cal.1961-08-05.latin-america
    item: '[[w.goodwin-remembering-america]], 192–93 (Dillon reads Kennedy''s statement, "at least one billion dollars in
      development assistance ... in the first year"; Guevara, headset on, after the session: "We will see. Messages are words.
      The facts are stubborn"; Dillon''s further offer of twenty billion; not the other delegates'' replies)'
    units: '?'
- cite:
    id: cal.1961-08-17.latin-america
    item: '[[w.goodwin-remembering-america]], 196–202 (Guevara''s closing speech, "an instrument of economic imperialism";
      Dillon''s reply; the talk at a Montevideo party from about 2 a.m. to almost 6, Goodwin and Guevara in a sitting room,
      an Argentine and a Brazilian interpreting, Juan de Onis the journalist; Guevara: "thank us for the Bay of Pigs"; a modus
      vivendi; Goodwin''s memorandum for Kennedy)'
    units: '?'
- cite:
    id: cal.1961-12-16.latin-america
    item: '[[w.goodwin-remembering-america]], 214 (Kennedy asks Goodwin by telephone whether to go despite the Secret Service:
      "I think the trip will be a triumph"; Goodwin drafted all his speeches for Venezuela and Colombia; at the airport: "if
      this doesn''t work out, you''d better keep on going south"; a crowd of 500,000 at Bogotá)'
    units: '?'
- cite:
    id: cal.1963-03-18.latin-america
    item: '[[w.goodwin-remembering-america]], 221 (Goodwin drafted Kennedy''s speeches for the meeting; Kennedy in his hotel
      room that night, 221)'
    units: '?'
- cite:
    id: cal.1963-11-18.cuba
    item: '[[w.goodwin-remembering-america]], 224 (Goodwin flew to Palm Beach the weekend of Nov. 16 to work on the Alliance
      for Progress speech; an audience of "fairly conservative publishers," not enthusiastic)'
    units: '?'
- cite:
    id: cal.1963-11-23.assassination-6
    item: '[[w.goodwin-remembering-america]], 230–31 (Goodwin in the East Room corner with Salinger, Schlesinger, Walton and
      Dungan; the altar boy and the candles; Mrs. Kennedy kneels, her cheek on the flag; Robert Kennedy opens the casket and
      asks Walton and Schlesinger to look: "white and waxy"; open 5–10 minutes, then closed)'
    units: '?'
- cite:
    id: cal.1963-12-14.latin-america
    item: '[[w.goodwin-remembering-america]], 244–45 (Goodwin''s late-November memorandum to Johnson on the Alliance: "only
      eleven months" and someone in overall charge, Shriver or Robert Kennedy; Salinger announces Mann on Saturday, Dec. 14;
      Schlesinger sends Goodwin the transcript marked "R.I.P.")'
    units: '?'
- cite:
    id: cal.1964-01-23.economy
    item: '[[w.goodwin-remembering-america]], 262–65 (Johnson''s calls from the transcripts: 12:34 Smathers on Long''s amendment;
      1:05 Anderson; Hartke; 1:28 Ribicoff; 1:47 Byrd; the committee reconsiders 9–8; 4:30 Anderson; 5:36 Ribicoff; 5:40 Byrd;
      the quotations)'
    units: '?'
- cite:
    id: cal.1964-02-11.robert-kennedy
    item: '[[w.goodwin-remembering-america]], 247–48 (Robert Kennedy back from the Far East, in the Oval Office: Johnson:
      "I want you to get rid of that Paul Corbin"; "President Kennedy isn''t president anymore. I am"; "I know you''re president,
      and don''t you ever talk to me like that again"; "I don''t want you to do any more favors for me. Ever"; Goodwin not
      present)'
    units: '?'
- cite:
