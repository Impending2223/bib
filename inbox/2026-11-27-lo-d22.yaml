        a division, 43–43; the teller vote, 65–62, 22,780). [[w.cq-weekly-report]], July 26, 1968, 1941. See [[cal.1968-07-23.crime-and-hijacking-guns]]. Check: the hour within the sitting;
        the House sat from 11 a.m. ([114 Cong. Rec. 22,744](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt17/pdf/GPO-CRECB-1968-pt17-6-1.pdf#page=1) (1968)) to 7:40 p.m. ([22,832](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt17/pdf/GPO-CRECB-1968-pt17-6-1.pdf#page=89)).
        Names: Horton, Dingell.'
