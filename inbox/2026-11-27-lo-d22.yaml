- edit:
    id: cal.1968-08-06.elections-1968-miami
    base: bdffc054
    kind: correct
    settles:
    - 'Check: CQ''s chronology has the platform adopted at 12:22 a.m.'
    set:
      when: Aug. 7
      date: '1968-08-07'
      time: 1968-08-07T04:22Z
      time_zone: America/New_York
      n: '[Republican Party Platform of 1968](https://www.presidency.ucsb.edu/documents/republican-party-platform-1968) (Aug. 5, 1968). [*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the third session, Aug. 6, [239](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/239/mode/1up) (the report adopted by voice vote; one "no" heard). [[w.cq-weekly-report]], Aug. 9, 1968, 2095, 2097, 2140 (adopted by voice vote, without debate; Dirksen''s committee). The chronology dates the adoption 12:22 a.m., Aug. 7 ([[w.cq-weekly-report]], Aug. 9, 1968, 2140: Romney at the podium 12:08, the Platform adopted by voice vote 12:22, adjournment moved 12:24), and the Proceedings place it after Romney''s remarks and the ruling on the North Carolina delegate (236–39) and close the session at 12:25 a.m. ([267](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/267/mode/1up)); CQ''s summary dates it by the session, Aug. 6 (2095, 2097), its analysis Aug. 7 (2099), its text "adopted ... on Aug. 6" (2126). See [[cal.1968-08-05.elections-1968]]. Names: Dirksen.'
- follows:
    id: cal.1968-08-06.elections-1968-miami
    remove:
    - cal.1968-08-06.elections-1968-miami-17
    why: the adoption is dated Aug. 7, 12:22 a.m. (CQ, Aug. 9, 1968, 2140; the Proceedings, 267), and a link runs within one day
