- edit:
    id: cal.1968-07-23.crime-and-hijacking-guns
    base: e2da4982
    kind: correct
    set:
      c: The House on the gun bill, H.R. 17735. McClory's amendment, federal licensing of gun owners, refused by teller vote, 84–179.
      n: '[114 Cong. Rec. 22,763](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt17/pdf/GPO-CRECB-1968-pt17-6-1.pdf#page=20) (1968) (July 23, 1968) (a division first, 59–102; then
        tellers, McClory and Sikes, 84–179). [[w.cq-weekly-report]], July 26, 1968, 1939. Split under R25b and R17: the Record gives Horton''s amendment its own page (22,779–80), after
        Dingell''s and MacGregor''s; it is now an entry, [[cal.1968-07-23.crime-and-hijacking-guns-2]]. Names: McClory.'
