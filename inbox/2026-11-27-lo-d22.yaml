- edit:
    id: cal.1968-07-15.conservation-4
    base: 70d2e738
    kind: correct
    settles:
    - 'Check: CQ prints 295–104.'
    set:
      c: 'The House passes H.R. 5117, the first stage of the Palmetto Bend reclamation project in Texas, [295–104](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt16/pdf/GPO-CRECB-1968-pt16-4-2.pdf#page=103): a dam on the Navidad, $34,077,000. Aspinall: no appropriation for it "this year or next year or until the fiscal situation clears up."'
      n: '[114 Cong. Rec. 21,425](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt16/pdf/GPO-CRECB-1968-pt16-4-2.pdf#page=103) (1968) (July 15, 1968) (the motion to suspend the rules and pass; roll call no. 257, yeas 295, nays 104, not voting 33). [[w.cq-weekly-report]], Aug. 2, 1968, 2039. The Record''s tally settles the count: CQ prints 295–104, as the Record; the Daily Digest (D350) 294–104; the entry had 296–103, Voteview''s. The House sat from noon to 11:11 p.m.: [Daily Digest, D351](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=349). Order: after [[cal.1968-07-15.conservation-3|the rivers and harbors bill]], in the House''s order of business, by the Record''s pages: rivers and harbors, 21369–86; Palmetto Bend, 21423–26 ([Daily Digest, D350](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=348)); roll calls 381 and 385. Names: Aspinall.'
