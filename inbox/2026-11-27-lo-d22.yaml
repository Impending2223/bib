- edit:
    id: cal.1968-07-30.vietnam-paris
    base: 620e4bb7
    kind: correct
    set:
      src:
        c: 1078301a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d314: 1'
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dean-rusk-july-30-1968: 1'
      place: washington
      time: 1968-07-30T05:57Z
      time_zone: America/New_York
      c: 'Johnson to Rusk by telephone, on the Paris cable: Clifford "kind of expressing the viewpoint that''s contained in the cable"; "we''re not going to stop the bombing until they
        agree to stop some."{1}'
      n: 'FRUS 1964–68, VI, doc. [314](https://history.state.gov/historicaldocuments/frus1964-68v06/d314) (Washington, July 30, 1968, 9:57 a.m.). [Johnson and Rusk, 9:57 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dean-rusk-july-30-1968),
        Conversation WH6807-02-13219 (Miller Center). Made public: FRUS 1964–68, VI (2002). Split under R25b and R17: FRUS, doc. 316, gives the meeting with his foreign policy advisers
        its own hours (1 to 2:05 p.m.); it is now an entry, [[cal.1968-07-30.vietnam-paris-4]]. See [[cal.1968-07-29.vietnam]]. Names: Johnson, Rusk, Clifford.'
    unset:
    - time_range
    - time_band
    - range_basis
- add:
    entry:
      id: cal.1968-07-30.vietnam-paris-4
      when: July 30
      date: '1968-07-30'
      place: washington
      thread: vietnam-paris
      follows:
      - cal.1968-07-30.vietnam-paris
      c: 'Johnson with Rusk, Clifford, Taylor, Wheeler and Helms, 1 to 2:05 p.m.: he asks Taylor for a report on "this new wave of demands to stop the bombing."'
      n: 'FRUS 1964–68, VI, doc. [316](https://history.state.gov/historicaldocuments/frus1964-68v06/d316) (Notes of Meeting, Washington, July 30, 1968, 1–2:05 p.m.). [[w.clifford-counsel-to-the-president-2]],
        567–68 (the lunch: Johnson to Rusk on his news conference, "You missed a lot of opportunities"; to Clifford, on his remark that the concentrated bombing had "in some respects
        produced more dividends," "Lay off that line. It''s a damned lie"). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-07-30.vietnam-paris]]. Names: Johnson, Rusk, Clifford,
        Taylor, Wheeler, Helms.'
      time_range:
      - 1968-07-30T09:00Z
      - 1968-07-30T10:05Z
      time_zone: America/New_York
      range_basis: record
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:clifford-clark
      - name:taylor-maxwell
      - name:wheeler-earle
      - name:helms-richard
