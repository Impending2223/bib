      c: Mao announces that the country should be on standby to "fight a great war, an early war, and even a nuclear war," after the clash on Zhenbao (Damansky) Island of Mar. 15 and before the Ninth Congress, by Dikötter's account.
      n: '[[w.dikotter-cultural-revolution]], 207 (after the battle of Mar. 15, "as soon as the confrontation was over"; the Ninth Congress opened two weeks later). Check: the day and the occasion; Dikötter''s page gives neither, and his note (348 n.3) cites Mao''s speech at the First Plenum of the Ninth Central Committee, Apr. 28, 1969. To check: "Mao Zedong''s Speech at the First Plenary Session of the CCP''s Ninth Central Committee," Apr. 28, 1969, Wilson Center Digital Archive (cited by [[w.dikotter-cultural-revolution]], 348 n.3). See [[cal.1969-03-15.china-leadership]]. Names: Mao Zedong.'
