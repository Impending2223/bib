      c: 'After midnight, while Dirksen''s motion to adopt the platform is seconded, Robert T. Hood Jr., a North Carolina delegate, seeking recognition, is ruled out of order by Ford: he "has lost his opportunity" to offer an amendment.'
      n: '[*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), [239](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/239/mode/1up) (Dirksen: no amendment needed; the Delegate from North Carolina, not on his feet before the second, "has lost his opportunity"). [[w.cq-weekly-report]], Aug. 9, 1968, 2097 (Hood ruled out during the seconds of Dirksen''s motion; the platform approved as he strode to the podium). The hour: after Romney at the podium, 12:08 a.m., and before the adoption, 12:22 ([[w.cq-weekly-report]], Aug. 9, 1968, 2140). See [[cal.1968-08-07.elections-1968-miami]]. Names: Ford.'
      time_range:
