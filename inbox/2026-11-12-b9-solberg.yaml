      when: Sept. 30
      date: '1968-09-30'
      thread: elections-1968-humphrey
      c: 'On the plane east, after the broadcast, in his bed compartment. Humphrey to his aides: he has given his pledge for peace; with incomes at a record high and unemployment at 2 percent, it is time for an all-out attack on Nixon.'
      n: '[[w.solberg-hubert-humphrey]], 385. See [[cal.1968-09-30.elections-1968]]. Names: Humphrey, Nixon.'
      src:
