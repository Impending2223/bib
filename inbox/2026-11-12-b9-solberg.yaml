- add:
    entry:
      id: cal.1968-04-02.elections-1968-humphrey
      when: Apr. 2
      date: '1968-04-02'
      thread: elections-1968-humphrey
      c: 'At the congressional leadership breakfast, Hale Boggs and Russell Long take Humphrey aside: he should declare at once, "or Kennedy will wrap it up."'
      n: '[[w.solberg-hubert-humphrey]], 324. To check: Humphrey, "Notes on Mexico," n.d., WHM u/p, Box 48, Humphrey Papers (cited by [[w.solberg-hubert-humphrey]], 324, its note). See [[cal.1968-04-02.elections-1968-2]]. Names: Boggs, Long, Humphrey.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 324: all'
      tags:
      - name:humphrey-hubert-h
      - name:boggs-hale
      - name:long-russell-b
- add:
    entry:
      id: cal.1968-04-02.elections-1968-humphrey-2
      when: Apr. 2
      date: '1968-04-02'
      thread: elections-1968-humphrey
      c: 'Monroney, of Oklahoma, telephones Humphrey: he fears a Kennedy blitz. Robert Kennedy has offered Fred Harris second place on the ticket and urged him to stand as Oklahoma''s favorite son, then withdraw in Kennedy''s favor; Harris, Monroney says, has held back, friendly to Humphrey.'
      n: '[[w.solberg-hubert-humphrey]], 324–25. To check: Humphrey, "Memo for record," Apr. 2, 1968, WHM u/p, Box 48, Humphrey Papers (cited by [[w.solberg-hubert-humphrey]], 324, its note). See [[cal.1968-04-02.elections-1968-2]]. Names: Monroney, Humphrey, Robert Kennedy, Fred Harris.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 324–25: all'
      tags:
      - name:humphrey-hubert-h
      - name:monroney-almer-s
      - name:kennedy-robert-f
      - name:harris-fred-r
      - state:ok
- add:
    entry:
      id: cal.1968-08-25.elections-1968-chicago-13
      when: Aug. 25, night
      date: '1968-08-25'
      thread: elections-1968-chicago
      c: Chicago, late at night. Ginsburg to Humphrey's suite, crowded with newsmen and politicians; Humphrey takes him into a bedroom, closes the door, and they go over "the differences and their implications." Humphrey vows to stand firm.
      n: '[[w.solberg-hubert-humphrey]], 353. After the meeting in Boggs''s room: [[cal.1968-08-25.elections-1968-chicago-9]]. Check: the day; Solberg: "late that night," the evening before the convention opened. Names: Ginsburg, Humphrey.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 353: all'
      tags:
      - name:humphrey-hubert-h
      - name:ginsburg-david
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-24
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - vietnam-paris
      c: 'Chicago, the morning. Ginsburg, three hours more with Charles Murphy over the plank on Vietnam: Humphrey''s text, "Stop the bombing of North Vietnam. The action and its timing shall take into account the security of our troops and the likelihood of a response from Hanoi"; Johnson''s, the "when clause," "Stop all the bombing of North Vietnam when this action would not endanger the lives of our troops in the field; this action should take into account the response from Hanoi." Murphy calls the Ranch twice; Jim Jones stands against Humphrey''s wording both times.'
      n: '[[w.solberg-hubert-humphrey]], 353 (Ginsburg at lunch: "They played with these words, and the President at the other end of the line down on the ranch just hung on to every inch as if he had nothing else to do"). After the night''s talk: [[cal.1968-08-25.elections-1968-chicago-13]]. Names: Ginsburg, Charles Murphy, Humphrey, Johnson, Jones.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 353: all'
      tags:
      - name:humphrey-hubert-h
      - name:ginsburg-david
      - name:murphy-charles-s
      - name:jones-jim
      - name:johnson-lyndon-b
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-09-28.elections-1968-humphrey
      when: Sept. 28
      date: '1968-09-28'
      thread: elections-1968-humphrey
      c: 'The morning after Ball''s arrival. Humphrey, with Muriel Humphrey, who has broken off her campaigning in Idaho, to Berman at breakfast: "I''d kill myself to win if I thought I had a chance. But if I don''t have a chance, it''s no use." He will "go like hell for the next two weeks, see what happens," and if no better "take it easy and maybe go out two days a week."'
      n: '[[w.solberg-hubert-humphrey]], 381. Check: the day; Solberg gives none, the breakfast following the night of Ball''s arrival. See [[cal.1968-09-27.elections-1968]]. Names: Humphrey, Ball.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 381: all'
      tags:
      - name:humphrey-hubert-h
      - name:ball-george-w
- add:
