      id: cal.1968-09-28.elections-1968-humphrey-2
      when: Sept. 28
      date: '1968-09-28'
      thread: elections-1968-humphrey
      c: 'Humphrey dedicates one of the big Columbia River dams, flying in by small plane: an address on conservation and recreation.'
      n: '[[w.solberg-hubert-humphrey]], 381 (O''Brien''s call to the riverside construction shack after the address: [[cal.1968-09-28.elections-1968]]). Check: the day and the dam; Solberg: "Saturday, September 29," Saturday being Sept. 28; no dam named. See [[cal.1968-09-27.elections-1968]]. Names: Humphrey.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 381: all'
      tags:
      - name:humphrey-hubert-h
