      date: '1968-09-30'
      thread: elections-1968-humphrey
      c: 'Salt Lake City, after 1:45 p.m. Shown the final version of the speech, O''Brien: "not worth a damn." Van Dyk is to call Goldberg before the speech, Connell the governors, O''Brien Edward Kennedy, Harris the other senators.'
      n: '[[w.solberg-hubert-humphrey]], 384. See [[cal.1968-09-30.elections-1968]]. Names: O''Brien, Van Dyk, Goldberg, Edward Kennedy, Harris.'
