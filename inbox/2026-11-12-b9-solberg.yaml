      when: Sept. 29
      date: '1968-09-29'
      thread: elections-1968-humphrey
      c: 'Seattle. Arthur Goldberg, from New York, and Richard Hughes, from New Jersey, telephone Humphrey: a complete and unconditional bombing pause is absolutely essential if he is to carry their States.'
      n: '[[w.solberg-hubert-humphrey]], 382. Check: the day; Solberg: "Sunday, September 30," the Sunday being Sept. 29, the broadcast Monday, Sept. 30. See [[cal.1968-09-29.elections-1968-4]]. Names: Goldberg, Hughes, Humphrey.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 382: all'
      tags:
      - name:humphrey-hubert-h
      - name:goldberg-arthur-j
      - name:hughes-richard-j
      - state:wa
      - city:seattle
