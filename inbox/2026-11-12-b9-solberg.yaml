      c: 'Seattle. Welsh, telephoning Read, learns that George Fitzgibbon, the courier Ball sent to Paris to confer with Harriman and Vance, is back: Harriman has said it is only "a fifty-fifty proposition" whether he can accept the statement shown him.'
      n: '[[w.solberg-hubert-humphrey]], 382. Check: the day; Solberg: the end of the day his party left Seattle, the Sunday he dates Sept. 30. See [[cal.1968-09-29.elections-1968-humphrey]]. Names: Read, Ball, Harriman, Vance.'
      src:
        rows:
        - 'w.solberg-hubert-humphrey 382: all'
