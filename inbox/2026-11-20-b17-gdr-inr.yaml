      id: cal.1965-12-13.vietnam-hanoi
      when: Dec. 13
      date: '1965-12-13'
      thread: vietnam-hanoi
      c: Berlin, afternoon. Mielke receives Nguyen Minh Tien, director of the technical operations sector of the DRV's state security ministry. Tien reports on the war as Hanoi gives it, among it that the Americans have built 8,000 strategic hamlets of which 7,000 are destroyed and that 748 aircraft had been shot down when he left, 814 by what he has since heard. He asks the Stasi to share its experience in eavesdropping, countermeasures, photography, surveillance, mail control, document production and equipment for informants, to advise on cadres and buildings, and to arrange a meeting with Interior Minister Dickel; Mielke says the specialists must first check what can be given, asks for the DRV's orders and says six years of contact were lost.
      place: berlin
      n: '"[Memorandum of a Meeting of Minister Erich Mielke with Nguyen Minh Tien on 13 December 1965](https://digitalarchive.umd.edu/document/120719)" (Dec. 14, 1965), BStU MfS Abt X 652, 31–49, trans. Sean O''Grady, Wilson Center Digital Archive. Obtained for CWIHP by Martin Grossheim. Berlin, Dec. 14, 1965, five copies; the memorandum gives the time as "from 16:00 until 19:00" and names an interpreter (redacted). Tien says he was last in the GDR in 1959; the DRV''s list of orders is to be paid from the GDR''s aid. Check: the year the Archive posted the document; its page gives none.'
      src:
        c: 92d7c084
        rows:
        - 'https://digitalarchive.umd.edu/document/120719: all'
