      id: cal.1967-05-30.china
      when: May 30
      date: '1967-05-30'
      thread: china
      also:
      - vietnam-hanoi
      c: 'Washington. George C. Denney Jr. of INR to the Secretary, Intelligence Note 418, "Probable Effects of Chinese Possession of MRBMs on the Vietnam War": most estimates give the Chinese medium-range missiles able to reach U.S. bases in Asia by the end of 1967. INR says that by early 1968 Peking might feel freer to extend aid to Hanoi, by letting the North Vietnamese use Chinese airfields, lending missile boats, opening ports if Haiphong is closed and sending ground forces north and "advisers" south. It doubts that the missiles would spur full-scale Chinese involvement.'
      place: washington
      n: '"[Intelligence Note 418 from George C. Denney, Jr., to the Secretary, Probable Effects of Chinese Possession of MRBMs on Vietnam War](https://digitalarchive.umd.edu/document/134074)" (May 30, 1967), RG 59, Entry UD-UP 141, Bureau of Intelligence and Research, Reports Coordination and Review Staff, Intelligence Reports, 1961, 1963–67, box 2, IN-400-499 1967, Wilson Center Digital Archive. Contributed by William Burr, National Security Archive. Marked SECRET/NO FOREIGN DISSEM; an original scan of four pages; the report states it was not coordinated outside INR. Check: the year the Archive posted the document; its page gives none. Names: Denney.'
      src:
