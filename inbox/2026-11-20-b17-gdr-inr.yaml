      - vis:only:drv+gdr
- add:
    entry:
      id: cal.1965-12-06.vietnam-hanoi-2
      when: Dec. 6
      date: '1965-12-06'
      thread: vietnam-hanoi
      also:
      - soviet-union
      c: 'The Soviet Committee for State Security, by a letter in the Stasi''s files, answers a request: the KGB says it will give the DRV''s state security institutes radio interception devices, punched-card tabulators, forensic and food-testing laboratory equipment, tube-technology eavesdropping gear, wire-tapping apparatus and an "AJAX" portable radio for foot surveillance. The Vietnamese, it says, asked for transistor eavesdropping technology. A deputy head of the DRV ministry''s technical operations department spent a month in Moscow, then went to Hungary about spare parts for equipment assembled there.'
      n: '"[Letter from the Committee for State Security of the Council of Ministers of the USSR on Aid to the Ministry for State Security of the DRV](https://digitalarchive.umd.edu/document/120864)" (Dec. 6, 1965), BStU MfS Abt. X 652, 29–30, trans. Sean O''Grady, Wilson Center Digital Archive. Obtained for CWIHP by Martin Grossheim. Marked TOP SECRET, nos. 208/65 and 470/65; "Translation from the Russian", two copies, dated Dec. 6, 1965 at the foot. The letter names no addressee; it speaks of "your request". Check: the year the Archive posted the document; its page gives none. Check: the letter''s own date; the Archive dates it by the translation.'
      src:
        c: c65fd932
        rows:
        - 'https://digitalarchive.umd.edu/document/120864: all'
