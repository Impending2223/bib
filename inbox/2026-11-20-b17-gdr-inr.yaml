      id: cal.1968-07-19.vietnam-hanoi
      when: July 19
      date: '1968-07-19'
      thread: vietnam-hanoi
      c: 'Berlin. Colonel Hentschke, head of the MfS''s technical operations sector, to the director of Department X: the Vietnamese are to be told that a box of equipment, 2,500 kg gross, consigned to Techno Import, Haiphong, is shipped; it goes at the end of July by a contractor to Poland for sea transport. Other technical devices have been shipped to the training group of "Comrade Han". The delivery note lists 100 dictation machines with foot pedals, microphones and headphones, 1,000 magnetic tapes, two stereo tape recorders, ten tape-reel devices and devices named "Hamburg II" (35), "Magdeburg 52/3" (10) and 1312 (10).'
      place: berlin
      n: '"[Technical Operations Sector, Deliveries to the Ministry of State Security of the DRV](https://digitalarchive.umd.edu/document/120722)" (July 19, 1968), BStU MfS Abt X 645, 390–391, trans. Sean O''Grady, Wilson Center Digital Archive. Obtained for CWIHP by Martin Grossheim. The memorandum is numbered OTS 822/68, signature VD 66/201; the Archive''s summary has the shipment going to Haiphong. Check: the year the Archive posted the document; its page gives none.'
      src:
