      c: 'Hanoi. Trần Quốc Hoàn to Mielke: by Mielke''s authorization the DRV ministry sends a delegation of three to study VHF tracing and searching at the MfS. He asks Mielke to order the Department of Radio Technology to help it, and thanks him for training the ministry''s staff.'
      place: hanoi
      n: '"[Letter from DRV Minister of Public Security Tran Quoc Hoan to GDR Minister of State Security Erich Mielke](https://digitalarchive.umd.edu/document/120865)" (Jan. 7, 1967), BStU MfS Abt X 652, 161, trans. Sean O''Grady, Wilson Center Digital Archive. Obtained for CWIHP by Martin Grossheim. The letter is on the stationery of the DRV''s Ministry of State Security, dated "07/01/1967"; the three delegates'' names are redacted. See [[cal.1965-11-01.vietnam-hanoi]]. Check: the year the Archive posted the document; its page gives none.'
