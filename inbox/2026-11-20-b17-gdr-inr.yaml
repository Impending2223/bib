      id: cal.1965-04-23.china
      when: Apr. 23
      date: '1965-04-23'
      thread: china
      also:
      - testing
      c: 'Washington. Thomas L. Hughes of INR to the Secretary, through S/S, "Will Communist China Assist Other Nations in Acquiring Nuclear Weapons?": press reports that UAR nuclear scientists will go to China for "advanced training" prompt it. INR expects no substantial Chinese help to any country in the next two or three years; a Chinese stockpile may take several years, perhaps a decade. It notes that Peking has not said it will help, could hold out the prospect or give low-level training, and would face demands from Albania, North Vietnam, North Korea and Indonesia.'
      place: washington
      n: '"[Intelligence Note from Thomas L. Hughes to the Secretary, Will Communist China Assist Other Nations in Acquiring Nuclear Weapons?](https://digitalarchive.umd.edu/document/134056)" (Apr. 23, 1965), RG 59, Entry UD-UP 141, Bureau of Intelligence and Research, Reports Coordination and Review Staff, Intelligence Reports, 1961, 1963–67, box 1, Intelligence Notes (1965) April to May 3, Wilson Center Digital Archive. Marked SECRET; an original scan, four pages and INR''s special distribution list. INR''s reading of the *People''s Daily* editorial of Nov. 22, 1964: no active interest in a ban on dissemination. Check: the year the Archive posted the document; its page gives none. Names: Hughes.'
