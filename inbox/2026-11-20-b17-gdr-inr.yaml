      id: cal.1966-02-01.vietnam-hanoi-2
      when: Feb. 1
      date: '1966-02-01'
      thread: vietnam-hanoi
      c: Berlin, afternoon. Mielke with Nguyen Minh Tien, at the close of Tien's stay; Beater, Wolf, Schmid, Hanewald and Damm of the MfS present. Tien sums up the work on the DRV's technical operations sector and asks help with equipment lists, the plans of buildings and the training of cadres at the GDR's cost. Mielke says the GDR will pay for training and give what it buys with Western currency, but wants the cadres first; he proposes that two operational officers and two technical specialists go to the DRV, says a DRV military delegation is coming from Warsaw, and that 20 marks handed in at the border by a West Berlin informant of the Stasi were staged for propaganda, which Tien is not to tell the DRV embassy.
      place: berlin
      n: '"[Note on a Meeting of Minister Erich Mielke with Nguyen Minh Tien on 1 February 1966](https://digitalarchive.umd.edu/document/120720)" (Feb. 10, 1966), BStU MfS Abt X 652, 50–63, trans. Martin Grossheim, Wilson Center Digital Archive. Berlin, Feb. 10, 1966, five copies; the note gives the time as "from 15:00 until 17:00". The note records Mielke saying the GDR took in 272,000 marks for Vietnam, 23,000 of them from MfS staff; its elisions are the Archive''s. At the end Tien receives a camera and another member of the delegation a microscope. Check: the year the Archive posted the document; its page gives none.'
      src:
