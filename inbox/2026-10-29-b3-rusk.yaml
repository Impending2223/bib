- add:
    entry:
      id: cal.1963-08-29.vietnam-2
      when: Aug. 29
      date: '1963-08-29'
      thread: vietnam
      c: 'Saigon, 6 p.m., Lodge to the Department, cable 375: the course set is the overthrow of the Diệm government; "there is no turning back because there is no possibility, in my view, that the war
        can be won under a Diem administration."'
      n: '[FRUS 1961–63, IV, doc. 12](https://history.state.gov/historicaldocuments/frus1961-63v04/d12). [[w.rusk-as-i-saw-it-1990]], 438. See [[cal.1963-08-24.vietnam]]. Names: Lodge, Ngô Đình Diệm.'
      src:
        c: 060b86d4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d12: all'
        - 'w.rusk-as-i-saw-it-1990 438: A'
      tags:
      - name:lodge-henry-cabot
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1963-08-29.vietnam-3
      when: Aug. 29
      date: '1963-08-29'
      thread: vietnam
      c: '8:17 p.m., Rusk to Lodge, eyes only, cable 279: can Diệm be separated from the Nhus? "My own personal assessment is (and this is not an instruction) that the Nhus are by all odds the greater part
        of the problem in Viet-Nam."'
      n: '[FRUS 1961–63, IV, doc. 17](https://history.state.gov/historicaldocuments/frus1961-63v04/d17). [[w.rusk-as-i-saw-it-1990]], 438–39. See [[cal.1963-08-24.vietnam]]. Names: Rusk, Lodge, Ngô Đình
        Diệm, Ngô Đình Nhu, Trần Lệ Xuân.'
      src:
        c: 58f7c3bb
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d17: all'
        - 'w.rusk-as-i-saw-it-1990 438–39: A'
      tags:
      - name:rusk-dean
      - name:lodge-henry-cabot
      - name:ngo-dinh-diem
      - name:ngo-dinh-nhu
      - name:tran-le-xuan
- add:
    entry:
      id: cal.1963-10-10.berlin-and-vienna
      when: Oct. 10–12
      date: '1963-10-10'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'An American convoy of eighteen vehicles held at Marienborn, Oct. 10, and again at Babelsberg, Oct. 11: its men will not dismount. Rusk summons Dobrynin, 9 a.m., Oct. 11: a unilateral change of
        established procedures, by force. Kennedy with Rusk, McNamara, Taylor and Thompson, 12:30 p.m. Kohler to Zorin in Moscow that evening; Zorin: the convoy refused the established procedures. Through,
        Oct. 12.'
      n: 'FRUS 1961–63, XV, docs. [220](https://history.state.gov/historicaldocuments/frus1961-63v15/d220), [221](https://history.state.gov/historicaldocuments/frus1961-63v15/d221), [223](https://history.state.gov/historicaldocuments/frus1961-63v15/d223),
        [226](https://history.state.gov/historicaldocuments/frus1961-63v15/d226), [228](https://history.state.gov/historicaldocuments/frus1961-63v15/d228). [[w.rusk-as-i-saw-it-1990]], 227. Check: Rusk
        puts the harassment over the tailgates in September 1963 (227). See [[cal.1963-06-26.berlin-and-vienna]]. Names: Rusk, Dobrynin, Kennedy, McNamara, Taylor, Thompson, Kohler, Zorin.'
      src:
