      when: Feb. 4
      date: '1968-02-04'
      thread: japan-and-korea-pueblo
      c: 'Rusk and McNamara on *Meet the Press*. McNamara, by Rusk''s account: no certainty whether the *Pueblo* came within the twelve-mile limit until Bucher is heard and the logs read.'
      n: 'The program: the Library of Congress''s inventory of Spivak''s photographs, LOT 13025-934. [[w.rusk-as-i-saw-it-1990]], 393. Check: Rusk does not date the program ("shortly after the seizure").
        See [[cal.1968-01-23.japan-and-korea]]. Names: Rusk, McNamara, Bucher.'
      src:
        c: 69004fb2
        rows:
        - '"The program": A'
        - 'w.rusk-as-i-saw-it-1990 393: all'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bucher-lloyd-m
- add:
    entry:
      id: cal.1968-10-29.vietnam-paris
      when: Oct. 29
      date: '1968-10-29'
      thread: vietnam-paris
      c: 'The Tuesday lunch, 1 to 2:20 p.m., on Thiệu''s refusal. Clifford had thought the final clearance with Thiệu a formality. Rusk: wait to hear from Bunker; "We have invested 29,000 dead and $75 billion.
        We must be careful not to flush this down the drain. But we do have the right to expect cooperation from South Vietnam."'
      n: '[FRUS 1964–68, VII, doc. 148](https://history.state.gov/historicaldocuments/frus1964-68v07/d148). [[w.rusk-as-i-saw-it-1990]], 489. Check: the memoir quotes Rusk differently: "We lost 29,000 men
        and invested $75 billion" (489). See [[cal.1968-10-29.vietnam]]. Names: Nguyễn Văn Thiệu, Clifford, Rusk, Bunker.'
      src:
        c: 427a2452
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d148: all'
        - 'w.rusk-as-i-saw-it-1990 489: D'
      tags:
      - name:nguyen-van-thieu
      - name:clifford-clark
      - name:rusk-dean
      - name:bunker-ellsworth
      - name:johnson-lyndon-b
