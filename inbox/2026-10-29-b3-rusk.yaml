        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d236: C-D'
        - 'w.rusk-as-i-saw-it-1990 227: A'
      tags:
      - name:rusk-dean
      - name:kornienko-georgi-m
      - name:dobrynin-anatoly
- add:
    entry:
      id: cal.1963-11-22.assassination-3
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      also:
      - succession
      c: 'Over the Pacific, an hour west of Hawaii: six members of the Cabinet, bound for the joint meeting with Japan''s, told by a wire flash that Kennedy has been shot. Salinger confirms it by radio;
        Rusk turns the plane back and announces the death on the loudspeaker. From Hawaii, on Johnson''s word, nonstop to Washington.'
      n: '[[w.rusk-as-i-saw-it-1990]], 296, 321. See [[cal.1963-11-22.assassination]]. Names: Kennedy, Salinger, Rusk, Johnson.'
      src:
        c: 241828c3
        rows:
        - 'w.rusk-as-i-saw-it-1990 296: A-C'
        - 'w.rusk-as-i-saw-it-1990 321: D'
      tags:
      - name:kennedy-john-f
      - name:salinger-pierre
      - name:rusk-dean
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-11-23.transition-and-staff-2
      when: Nov. 23
      date: '1963-11-23'
      thread: transition-and-staff
      also:
      - succession
      c: 'Johnson calls Rusk to the Executive Office Building. Rusk offers to resign; Johnson: it is his duty to stay, by Rusk''s account.'
      n: '[[w.rusk-as-i-saw-it-1990]], 321. Check: the day, Rusk saying only that he slept a few hours after landing. See [[cal.1963-11-23.transition-and-staff]]. Names: Johnson, Rusk.'
      src:
        c: c1da62ad
        rows:
        - 'w.rusk-as-i-saw-it-1990 321: all'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
- add:
    entry:
      id: cal.1965-02-23.vietnam
      when: Feb. 23
      date: '1965-02-23'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'Rusk''s paper "Viet Nam": a stable government in Saigon the first priority; "to throw back the Hanoi-Viet Cong aggression without a major war if possible"; air strikes on the North "directly linked
        to specific events in South Viet Nam"; a Marine battalion combat team at Đà Nẵng at once.'
      n: '[FRUS 1964–68, II, doc. 157](https://history.state.gov/historicaldocuments/frus1964-68v02/d157). [[w.rusk-as-i-saw-it-1990]], 448 (for Johnson alone, "no distribution," by his account). Names:
        Rusk.'
      src:
        c: e077a04b
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d157: all'
        - 'w.rusk-as-i-saw-it-1990 448: all'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-03-16.china
      when: Mar. 16
      date: '1966-03-16'
      thread: china
      c: 'Rusk before the Foreign Affairs subcommittee on the Far East and the Pacific, in executive session, on policy toward Asia. On China: no intention to attack it; more unofficial contacts; the Warsaw
        talks to go on; arms control open to negotiation; Taiwan not to be abandoned or expelled from the United Nations.'
      n: '[112 Cong. Rec. D118](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=116). [[w.rusk-as-i-saw-it-1990]], 289. Check: whether and when the statement was
        made public; Rusk calls it a speech (289). See [[cal.1966-03-08.india-and-china]]. Names: Rusk.'
      src:
        c: 905339ed
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=116: A'
        - 'w.rusk-as-i-saw-it-1990 289: all'
      tags:
      - name:rusk-dean
