- add:
    entry:
      id: cal.1963-11-04.berlin-and-vienna
      when: Nov. 4–5
      date: '1963-11-04'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'A small American convoy held on the autobahn over dismounting and lowering the tailgates. Rusk calls in the Soviet chargé, Kornienko, 11:30 a.m., Nov. 4: the convoy within the limits for not dismounting,
        the procedures given the Soviet military Oct. 29. Nov. 5, 6:10 p.m., Rusk to Dobrynin, who knows nothing of it; about then the Soviets let the convoy go, no one dismounting, no tailgate lowered.'
      n: 'FRUS 1961–63, XV, docs. [234](https://history.state.gov/historicaldocuments/frus1961-63v15/d234), [236](https://history.state.gov/historicaldocuments/frus1961-63v15/d236). [[w.rusk-as-i-saw-it-1990]],
        227. Check: Rusk puts the harassment over the tailgates in September 1963 (227). See [[cal.1963-10-10.berlin-and-vienna]]. Names: Rusk, Kornienko, Dobrynin.'
      src:
        c: 84370d07
        rows:
