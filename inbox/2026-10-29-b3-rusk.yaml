- add:
    entry:
      id: cal.1961-01-12.transition-and-staff-cabinet
      when: Jan. 12
      date: '1961-01-12'
      thread: transition-and-staff-cabinet
      c: 'Rusk before Foreign Relations on his nomination. Aiken on his ties to the Rockefellers, Chase Manhattan and Standard Oil: "What do you do with your money?" Rusk: "I begin, sir, by paying taxes."'
      n: '[107 Cong. Rec. D11](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=9). [[w.rusk-as-i-saw-it-1990]], 205–06 (the exchange). Check: Rusk does not date
        the exchange; the Digest gives one hearing on the nomination. See [[cal.1960-12-12.transition-and-staff-cabinet]]. Names: Rusk, Aiken.'
      src:
        c: 637f18ab
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=9: A'
        - 'w.rusk-as-i-saw-it-1990 205–06: B-C'
      tags:
      - name:rusk-dean
      - name:aiken-george-d
- add:
    entry:
      id: cal.1961-02-01.congo
      when: Feb. 1
      date: '1961-02-01'
      thread: congo
      c: Rusk to Kennedy, "Suggested New United States Policy on the Congo." A new UN mandate to bring the Congo's armed forces under control, by force if need be; a middle-of-the-road government under
        Ileo, failing that one taking in Lumumba's followers but not Lumumba; a larger UN hand in its administration. Rusk sums it up at the NSC that day; Kennedy approves it after.
      n: 'FRUS 1961–63, XX, docs. [17](https://history.state.gov/historicaldocuments/frus1961-63v20/d17), [18](https://history.state.gov/historicaldocuments/frus1961-63v20/d18) (the NSC; the approval).
        [[w.rusk-as-i-saw-it-1990]], 277. Names: Rusk, Kennedy, Ileo, Lumumba.'
      src:
        c: 130df690
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v20/d17: A-D'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v20/d18: E-F'
        - 'w.rusk-as-i-saw-it-1990 277: A-D'
      tags:
      - name:rusk-dean
      - name:kennedy-john-f
      - name:ileo-joseph
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1961-02-17.berlin-and-vienna
      when: Feb. 17
      date: '1961-02-17'
      thread: berlin-and-vienna
      c: Soviet aide-mémoire to the Federal Republic. Without a peace treaty ending the occupation, a separate treaty with East Germany; West Berlin a demilitarized "free city," the access routes, air and
        land, under East German control.
      n: '[FRUS 1961–63, XIV, doc. 73](https://history.state.gov/historicaldocuments/frus1961-63v14/d73) (the aide-mémoire; Bonn''s reply, July 12). [[w.rusk-as-i-saw-it-1990]], 219. Check: the aide-mémoire''s
        text not read.'
      src:
        c: 18678e9a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d73: A'
        - 'w.rusk-as-i-saw-it-1990 219: all'
- add:
    entry:
      id: cal.1961-05.china
      when: May
      date: 1961-05
      thread: china
      c: 'Rusk with Kennedy, a long private talk on China, by Rusk''s account: two Chinas, a quiet reconciliation of Peking and Taipei, or waiting. Kennedy rules out a change: "I don''t want to read in
        the Washington Post or the New York Times that the State Department is thinking about a change in our China policy!"'
      n: '[[w.rusk-as-i-saw-it-1990]], 282–83. Names: Rusk, Kennedy.'
      src:
        c: de0bbf5c
        rows:
        - 'w.rusk-as-i-saw-it-1990 282–83: all'
      tags:
      - name:rusk-dean
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-05.china-2
      when: May
      date: 1961-05
      thread: china
      also:
      - laos
      c: Geneva, the conference on Laos. At a reception Rusk offers Chen Yi his hand; Chen Yi steps back, speaks with his colleagues, then takes it, by Rusk's account. A private meeting, sounded out before,
        declined.
      n: '[[w.rusk-as-i-saw-it-1990]], 287. See [[cal.1961-05-16.laos]]. Names: Rusk, Chen Yi.'
      src:
        c: 834097a5
        rows:
        - 'w.rusk-as-i-saw-it-1990 287: all'
      tags:
      - name:rusk-dean
      - name:chen-yi
- add:
    entry:
      id: cal.1961-05-31.latin-america
      when: May 31
      date: '1961-05-31'
      thread: latin-america
      c: 'Rusk telephones Salinger in Paris, with Kennedy, that Trujillo has been killed: for the President, in confidence, Trujillo''s son being in Paris. Salinger speaks of it at a press briefing before
        the news is public, by Rusk''s account.'
      n: '[[w.rusk-as-i-saw-it-1990]], 368–69. Check: Rusk gives no day. See [[cal.1961-05-30.latin-america]]. Names: Rusk, Salinger, Kennedy, Trujillo.'
      src:
        c: 518bf840
        rows:
        - 'w.rusk-as-i-saw-it-1990 368–69: all'
      tags:
      - name:rusk-dean
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-01.cuba-bay-of-pigs
      when: May 1
      date: '1961-05-01'
      thread: cuba-bay-of-pigs
      c: Rusk briefs Foreign Relations' subcommittee on American Republics Affairs on Cuba, in executive session.
      n: '[107 Cong. Rec. D184](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=182). Check: Rusk recalls telling the committee at an executive session that spring
        that Cuba might become a Soviet missile base ([[w.rusk-as-i-saw-it-1990]], 215); which session is not settled: the subcommittee also met on Cuba Apr. 28, the full committee invited, and Rusk briefed
        the full committee May 3 ([107 Cong. Rec. D194](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=192)). See [[cal.1961-04-17.cuba]]. Names: Rusk.'
      src:
        c: b001e3a6
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=182: all'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-07-17.berlin-and-vienna
      when: July 17
      date: '1961-07-17'
      thread: berlin-and-vienna
      c: 'The American, British and French replies to the Soviet aide-mémoire of June 4 delivered in Moscow, held back from July 12 for the North Atlantic Council. Gromyko to each ambassador: up to the
        West whether the Berlin problem is made worse or settled by agreement.'
      n: '[FRUS 1961–63, XIV, doc. 73](https://history.state.gov/historicaldocuments/frus1961-63v14/d73). [[w.rusk-as-i-saw-it-1990]], 222 (the delay). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Gromyko.'
      src:
        c: a25b2d08
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d73: all'
        - 'w.rusk-as-i-saw-it-1990 222: A'
      tags:
      - name:gromyko-andrei
- add:
    entry:
      id: cal.1961-08-05.berlin-and-vienna
      when: Aug. 5–6
      date: '1961-08-05'
      thread: berlin-and-vienna
      also:
      - europe-and-the-alliance
      c: 'Paris: Rusk, Home and Couve de Murville on Berlin and Germany, Aug. 5; Brentano with them, Aug. 6. Formal negotiations with the Russians in October or early November, the Ambassadorial Group in
        Washington to prepare the Western position. Rusk and Home for a public move toward a Foreign Ministers'' meeting; Couve against any until Western preparations tell on Khrushchev.'
      n: 'FRUS 1961–63, XIV, docs. [94](https://history.state.gov/historicaldocuments/frus1961-63v14/d94), [99](https://history.state.gov/historicaldocuments/frus1961-63v14/d99) (Rusk to Kennedy, eyes only,
        Aug. 7). [[w.rusk-as-i-saw-it-1990]], 222. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Rusk, Douglas-Home, Couve de Murville, Brentano, Khrushchev.'
      src:
        c: 9f9556fd
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d94: A'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d99: B-E'
        - 'w.rusk-as-i-saw-it-1990 222: A, C'
      tags:
      - name:rusk-dean
      - name:douglas-home-alec
      - name:couve-de-murville-maurice
      - name:brentano-heinrich-von
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1961-09-21.berlin-and-vienna
      when: Sept. 21
      date: '1961-09-21'
      thread: berlin-and-vienna
      also:
      - china
      - testing
      c: 'New York, 2:30 p.m.: Rusk and Gromyko on Germany and Berlin, disarmament and China. Gromyko: the principles the two governments agreed the day before well received; the Chinese People''s Republic
        to be brought into the disarmament talks, perhaps by an informal understanding between the two of them. Rusk will take it under advisement: effective disarmament, in the long run, would need Peking.'
      n: '[FRUS 1961–63, VII, doc. 75](https://history.state.gov/historicaldocuments/frus1961-63v07/d75). [[w.rusk-as-i-saw-it-1990]], 225 (the talks of late September). To check: the part on Germany and
        Berlin, FRUS 1961–63, XIV, 431–33 (its summary by telegram). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Rusk, Gromyko.'
      src:
        c: 50cb4ec2
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07/d75: all'
        - 'w.rusk-as-i-saw-it-1990 225: A'
      tags:
      - name:rusk-dean
      - name:gromyko-andrei
- add:
    entry:
      id: cal.1961-12-12.berlin-and-vienna
      when: Dec. 12
      date: '1961-12-12'
      thread: berlin-and-vienna
      also:
      - europe-and-the-alliance-france
      c: 'Kennedy telephones de Gaulle, on Rusk''s recommendation from Paris, for the text the four Foreign Ministers had agreed: the NATO Council to approve diplomatic contacts with the Soviet Union, to
        find on what basis formal negotiation might be possible. De Gaulle objects: contacts by whom, and no agreed Western positions.'
      n: '[FRUS 1961–63, XIV, doc. 239](https://history.state.gov/historicaldocuments/frus1961-63v14/d239). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Kennedy, de Gaulle, Rusk.'
      src:
        c: b9efd054
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d239: all'
      tags:
      - name:kennedy-john-f
      - name:de-gaulle-charles
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-12-13.europe-and-the-alliance
      when: Dec. 13–15
      date: '1961-12-13'
      thread: europe-and-the-alliance
      also:
      - berlin-and-vienna
      c: 'Paris, the NATO ministers. Rusk and McNamara brief the allies on intelligence and strategy, by Rusk''s report to Kennedy "unprecedented in NATO experience." Couve de Murville, by Rusk''s account,
        holds out against "negotiations" in the communiqué: "One does not telephone President de Gaulle."'
      n: '[FRUS 1961–63, XIII, doc. 117](https://history.state.gov/historicaldocuments/frus1961-63v13/d117) (Rusk to Kennedy, eyes only, Dec. 15). [[w.rusk-as-i-saw-it-1990]], 226 (the communiqué). Names:
        Rusk, McNamara, Couve de Murville, de Gaulle.'
      src:
        c: f6447211
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d117: A-B'
        - 'w.rusk-as-i-saw-it-1990 226: C'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:couve-de-murville-maurice
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1962-03-11.berlin-and-vienna
      when: Mar. 11
      date: '1962-03-11'
      thread: berlin-and-vienna
      c: 'Geneva, after dinner: Rusk and Home to Gromyko on the harassment of the air corridors to Berlin, Soviet bombers dropping chaff three days before, flights filed for the hours of the Western airlines.
        Rusk: not tolerable; the United States would not shrink from the danger. Gromyko: the Soviet note answers it; the Soviet Union will look to its own interests and East Germany''s.'
      n: '[FRUS 1961–63, XV, doc. 7](https://history.state.gov/historicaldocuments/frus1961-63v15/d7). Check: Rusk has Home shout at Gromyko over the chaff, "This harassment has got to stop!", and the harassment
        end soon after, undated ([[w.rusk-as-i-saw-it-1990]], 225–26). Names: Rusk, Douglas-Home, Gromyko.'
      src:
        c: 09b7e576
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d7: all'
      tags:
      - name:rusk-dean
      - name:douglas-home-alec
      - name:gromyko-andrei
- add:
    entry:
      id: cal.1962-04-16.berlin-and-vienna
      when: Apr. 16
      date: '1962-04-16'
      thread: berlin-and-vienna
      c: Rusk and Dobrynin alone, 2:34 p.m., on the talks begun at Geneva. No "new round of talks" in Washington taken for granted. The Soviet paper on access unacceptable while tied to the withdrawal of
        Western forces from West Berlin.
      n: '[FRUS 1961–63, XV, doc. 39](https://history.state.gov/historicaldocuments/frus1961-63v15/d39). [[w.rusk-as-i-saw-it-1990]], 226–27 (the talks with Dobrynin, mid-April to late May). See [[cal.1962-03-11.berlin-and-vienna]].
        Names: Rusk, Dobrynin.'
      src:
        c: 2f6c36a2
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d39: all'
        - 'w.rusk-as-i-saw-it-1990 226–27: A'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
- add:
    entry:
      id: cal.1962-10-15.missile-crisis
      when: Oct. 15
      date: '1962-10-15'
      thread: missile-crisis
      c: Evening. The U-2's film read; Hilsman telephones Rusk at a party, by Rusk's account. By midnight the senior advisers know. Bundy lets Kennedy sleep till morning.
      n: '[[w.rusk-as-i-saw-it-1990]], 230. See [[cal.1962-10-14.missile-crisis]]. Names: Hilsman, Rusk, Bundy, Kennedy.'
      src:
        c: 154dc62f
        rows:
        - 'w.rusk-as-i-saw-it-1990 230: all'
      tags:
      - name:hilsman-roger
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-17.missile-crisis
      when: Oct. 17
      date: '1962-10-17'
      thread: missile-crisis
      c: Rusk's dinner for Gromyko at the State Department, long scheduled. In a long talk after it Gromyko lets on nothing of the missiles, by Rusk's account.
      n: '[[w.rusk-as-i-saw-it-1990]], 233. See [[cal.1962-10-14.missile-crisis]]. Names: Rusk, Gromyko.'
      src:
        c: 67ac4643
        rows:
        - 'w.rusk-as-i-saw-it-1990 233: all'
      tags:
      - name:rusk-dean
      - name:gromyko-andrei
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-6
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: 'An hour before the address, in his office, Rusk gives Dobrynin a copy of it: the missiles known, and what is to be done. Dobrynin, by Rusk''s account, "a man in physical shock": "This is a terrible
        situation."'
      n: '[[w.rusk-as-i-saw-it-1990]], 235. See [[cal.1962-10-14.missile-crisis]]. Names: Rusk, Dobrynin.'
      src:
        c: b25d81ae
        rows:
        - 'w.rusk-as-i-saw-it-1990 235: all'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-7
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: An hour after the address, at the State Department, Rusk shows the photographs to the ambassadors of more than sixty nonaligned countries; about forty line up to wish him well, by his account.
      n: '[[w.rusk-as-i-saw-it-1990]], 235. See [[cal.1962-10-14.missile-crisis]]. Names: Rusk.'
      src:
        c: cb13a6ae
        rows:
        - 'w.rusk-as-i-saw-it-1990 235: all'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-6
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-jupiters
      c: Night. Rusk, with Kennedy's assent, telephones Cordier at Columbia and dictates a statement for U Thant to make, proposing the removal of both the Jupiters and the missiles in Cuba, to reach U
        Thant only on a further signal. None is sent.
      n: '[FRUS 1961–63, XI, doc. 99](https://history.state.gov/historicaldocuments/frus1961-63v11/d99) (Rusk''s letter of March 1987; Bundy: Cordier to stand by the night of Oct. 27). [[w.rusk-as-i-saw-it-1990]],
        240–41. Made public: Rusk''s letter to James G. Blight, read by Bundy at the Hawk''s Cay conference, March 1987 ([FRUS 1961–63, XI, doc. 99](https://history.state.gov/historicaldocuments/frus1961-63v11/d99)).
        Check: in the memoir the suggestion is Rusk''s and Kennedy agrees (240–41); in the letter Kennedy instructs him. See [[cal.1962-10-14.missile-crisis]]. Names: Rusk, Kennedy, Cordier, U Thant.'
      src:
        c: d4922297
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d99: all'
        - 'w.rusk-as-i-saw-it-1990 240–41: all'
      tags:
      - name:rusk-dean
      - name:kennedy-john-f
      - name:cordier-andrew-w
      - name:u-thant
- add:
    entry:
      id: cal.1963-07-10.civil-rights-bill
      when: July 10
      date: '1963-07-10'
      thread: civil-rights-bill
      also:
      - desegregation-public-places
      c: 'Rusk before the Commerce Committee for S. 1732, on public accommodations: discrimination at home weighs on relations abroad. Thurmond: does he favor the demonstrations? Rusk: "if I were denied
        what our Negro citizens are denied, I would demonstrate."'
      n: '[109 Cong. Rec. D323](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=321). [[w.rusk-as-i-saw-it-1990]], 586–87. Check: Rusk names the Judiciary Committee
        (586). See [[cal.1963-07-01.civil-rights-bill]]. Names: Rusk, Thurmond.'
      src:
        c: d4a0e966
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=321: A'
        - 'w.rusk-as-i-saw-it-1990 586–87: all'
      tags:
      - name:rusk-dean
      - name:thurmond-strom
- add:
    entry:
      id: cal.1963-08-09.soviet-union
      when: Aug. 9
      date: '1963-08-09'
      thread: soviet-union
      also:
      - berlin-and-vienna
      - testing
      c: 'Pitsunda, Khrushchev''s dacha on the Black Sea, 10:15 a.m.: Rusk, Kohler and Thompson with Khrushchev, Gromyko and Dobrynin. Khrushchev on a German peace treaty; then trade, chemical plants among
        it. Aside, by Rusk''s account, Khrushchev: Adenauer, de Gaulle and Macmillan have told him they would not fight a nuclear war over Berlin; "Why should I believe that you Americans would fight a
        nuclear war over Berlin?"'
      n: 'FRUS 1961–63, XV, doc. [208](https://history.state.gov/historicaldocuments/frus1961-63v15/d208); V, doc. [346](https://history.state.gov/historicaldocuments/frus1961-63v05/d346). [[w.rusk-as-i-saw-it-1990]],
        227–28. See [[cal.1963-08-05.testing]]. Names: Rusk, Kohler, Thompson, Khrushchev, Gromyko, Dobrynin, Adenauer, de Gaulle, Macmillan.'
      src:
        c: 2ea21218
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d208: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d346: A, C'
        - 'w.rusk-as-i-saw-it-1990 227–28: A, D-E'
      tags:
      - name:rusk-dean
      - name:kohler-foy-d
      - name:thompson-llewellyn-e
      - name:khrushchev-nikita-s
      - name:gromyko-andrei
      - name:dobrynin-anatoly
