      n: '[[w.schlesinger-thousand-days-1965]], 1012; [[w.caro-passage-of-power]], 538–39 (Heller''s notes: still for it, and for the man in the suburbs too; in another of Heller''s versions, "Come back to me in a couple of weeks"). Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1963-05-01.poverty]]. Names: Kennedy, Heller.'
