- edit:
    id: cal.1963-11-23.poverty-2
    base: ad4cd3ea
    set:
      n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 3 (LBJ Library; National Archives Catalog) (the time). [[w.johnson-vantage-point]], 69–71; [[w.dallek-flawed-giant]], 60 (Johnson''s words, in Dallek''s form: "That''s my kind of program"). [[w.caro-passage-of-power]], 539–40. Names: Heller, Johnson, Kennedy. Check: Johnson gives 7:40 p.m. (69).'
- add:
    entry:
      id: cal.1960-04-08.elections-1960
      when: Apr. 8
      date: '1960-04-08'
      thread: elections-1960
      c: 'Kennedy calls on Johnson in his Capitol office and asks him, by Johnson''s account, to get Robert Byrd "out of West Virginia": Byrd''s organization working for Humphrey before the primary. Johnson: Byrd''s own State.'
      n: '[[w.caro-passage-of-power]], 84–85. Names: Kennedy, Johnson, Byrd, Humphrey.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:byrd-robert-c
      - name:humphrey-hubert-h
    section: '196004'
- add:
    entry:
      id: cal.1960-05-27.elections-1960
      when: May 27–31
      date: '1960-05-27'
      thread: elections-1960
      c: 'Johnson''s western tour, six States in five days from the Friday before Memorial Day: Des Moines, Loveless aboard the plane; Idaho Falls, to Lieutenant Governor Drevlow, "You''re damn right I am" a candidate; Spokane, Coeur d''Alene, Pierre. On the U-2: Khrushchev, not the President, should apologize. Montana dropped from the schedule.'
      n: '[[w.caro-passage-of-power]], 87–92 (the Friday "on the eve of a long Memorial Day weekend," 88). Check the dates and the stops. Names: Johnson, Loveless, Herseth, Khrushchev.'
      tags:
      - name:johnson-lyndon-b
      - name:loveless-herschel-c
      - name:herseth-ralph
      - name:khrushchev-nikita-s
    section: '196005'
- add:
    entry:
      id: cal.1960-06-29.congress
      when: June 29
      date: '1960-06-29'
      thread: congress
      also:
      - elections-1960
      c: Johnson and Rayburn announce that Congress will recess, not adjourn, before the conventions and return Aug. 8. The bills left pending over the delegates.
      n: '[[w.caro-passage-of-power]], 94 (Bolling''s account of Rayburn''s reluctance). Check: the concurrent resolution and its day. See [[cal.1960-01-06.congress]]. Names: Johnson, Rayburn.'
      tags:
      - name:johnson-lyndon-b
      - name:rayburn-sam
    section: '196006'
- add:
    entry:
      id: cal.1960-07-05.elections-1960
      when: July 5
      date: '1960-07-05'
      thread: elections-1960
      c: 'Johnson announces in the New Senate Office Building''s auditorium, Rayburn in the front row: "I am, as of this moment, a candidate for the office of President of the United States." The next President "a working President," not a talking or a traveling one.'
      n: '[[w.caro-passage-of-power]], 97–98. Names: Johnson, Rayburn.'
      tags:
      - name:johnson-lyndon-b
      - name:rayburn-sam
    section: '196007'
- add:
    entry:
      id: cal.1960-07-12.elections-1960-2
      when: July 12
      date: '1960-07-12'
      thread: elections-1960
      c: 'The Biltmore''s Crystal Ballroom, 3 p.m. Johnson, by telegram and at a press conference, challenges Kennedy to debate before the Texas and Massachusetts delegations. Kennedy comes, nearly alone. Johnson on quorum calls and roll calls missed; Kennedy: "I assume he was talking about some other candidate."'
      n: '[[w.caro-passage-of-power]], 102–05. See [[cal.1960-07-12.elections-1960]]. Names: Johnson, Kennedy, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      - name:kennedy-robert-f
    section: '196007'
- add:
    entry:
      id: cal.1960-11-04.elections-1960
      when: Nov. 4
      date: '1960-11-04'
      thread: elections-1960
      c: Dallas, the Adolphus Hotel. A Republican crowd, Representative Alger with a sign, LBJ SOLD OUT TO YANKEE SOCIALISTS, surrounds the Johnsons in the lobby; thirty minutes to the elevators, the police sent off by Johnson. Houston, next day, apologies.
      n: '[[w.caro-passage-of-power]], 149–50; Sorensen''s view of its effect quoted, 156. Names: Johnson, Lady Bird Johnson, Alger.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:alger-bruce-r
    section: '196011'
- add:
    entry:
      id: cal.1960-12.rules
      when: Dec.
      date: 1960-12
      thread: rules
      c: A private dining room at the Sheraton-Carlton. Johnson tells Kerr, Humphrey, Smathers and Russell he will keep the chairmanship of the Senate Democrats' conference as Vice President; Mansfield, to succeed him as leader, has agreed, and to his keeping the Majority Leader's office.
      n: '[[w.caro-passage-of-power]], 164–65 (Humphrey''s account). Check the day. Names: Johnson, Kerr, Humphrey, Smathers, Russell, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:kerr-robert-s
      - name:humphrey-hubert-h
      - name:smathers-george-a
      - name:russell-richard-b
      - name:mansfield-mike
    section: '196012'
- add:
    entry:
      id: cal.1961-01-28.transition-and-staff
      when: Jan. 28
      date: '1961-01-28'
      thread: transition-and-staff
      c: 'The Oval Office. Johnson had sent a draft executive order giving the Vice President "continuing surveillance and review" of national security policy, the agencies to cooperate with him. Kennedy hands him a letter instead: "I am hereby requesting you to review policies relating to the national security." No order issued; no staff.'
      n: '[[w.caro-passage-of-power]], 169–71 (the draft''s earlier form not found in either library). Names: Johnson, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-john-f
    section: '196101'
- add:
    entry:
      id: cal.1961-04-15.cuba-bay-of-pigs
      when: Apr. 15–17
      date: '1961-04-15'
      thread: cuba-bay-of-pigs
      c: 'Johnson, outside the invasion''s planning, flies to Norfolk to crown his daughter Azalea Queen as the B-26s strike Cuba''s airfields; then to the Ranch to entertain Adenauer, at Kennedy''s request: Fredericksburg, Apr. 16; Austin, the legislature, Apr. 17, as the brigade lands. Back to Washington that night.'
      n: '[[w.caro-passage-of-power]], 182–84. Names: Johnson, Adenauer, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:adenauer-konrad
      - name:kennedy-john-f
    section: '196104'
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-4
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      c: 'Evening, the ExComm, the President and his brother out of the room. Johnson against the Turkish trade: "We''re backing down"; the Russians "shot down one plane, and they gave up Turkey"; the U-2''s loss, not the letters, to be answered. Kennedy back about 7:20; Johnson left out of the smaller meeting in the Oval Office after.'
      n: '[Executive Committee Meeting, 4:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-10), Tape 41 (Miller Center); [continued](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-11), Tape 41A (Miller Center). [FRUS 1961–63, XI, doc. 94](https://history.state.gov/historicaldocuments/frus1961-63v11/d94). [[w.caro-passage-of-power]], 216–21. See [[cal.1962-10-16.missile-crisis]]. Names: Johnson, Robert Kennedy, Bundy, Dillon, Thompson, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:bundy-mcgeorge
      - name:dillon-c-douglas
      - name:thompson-llewellyn-e
      - name:kennedy-john-f
    section: '196210'
- add:
    entry:
      id: cal.1963-06-03.civil-rights-bill-2
      when: June 3
      date: '1963-06-03'
      thread: civil-rights-bill
      c: 'The Oval Office, 10 a.m. Johnson, asking for weeks, admitted to a meeting on the bill with Robert Kennedy, O''Donnell and Sorensen; Kennedy has him tell Sorensen his views. That afternoon, by telephone: he has not seen the bill; pass the tax bill and the rest first, "get them down in the storm cellar," then attack; the President to give the Negro a moral commitment himself: "The President is the cannon."'
      n: '[[w.caro-passage-of-power]], 257–61 (from Johnson''s transcript of the call). Names: Johnson, Kennedy, Robert Kennedy, O''Donnell, Sorensen.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:odonnell-kenneth-p
      - name:sorensen-theodore-c
    section: '196306'
- add:
    entry:
      id: cal.1963-09-12.baker
      when: Sept. 12
      date: '1963-09-12'
      thread: baker
      c: 'The *Washington Post*: Ralph Hill''s suit of Sept. 9, in the District Court, charges that Baker took $5,600 to place Hill''s vending machines with a North American Aviation subcontractor, then had them replaced by Serv-U''s.'
      n: '[[w.caro-passage-of-power]], 276–77. Check: the suit''s docket. Names: Robert Baker.'
      tags:
      - name:baker-robert-g
    section: '196309'
- add:
    entry:
      id: cal.1963-09-13.baker
      when: Sept. 13–16
      date: '1963-09-13'
      thread: baker
      c: Copenhagen. Jenkins telephones Johnson on the Baker story; Johnson in his suite two days, calling Fortas; Greenland and the Danish navy dropped from the trip. Home to Andrews after the Iceland dinner, 1 a.m.
      n: '[[w.caro-passage-of-power]], 275–77 (Reedy''s and McDowell''s accounts). See [[cal.1963-09-12.baker]]. Names: Jenkins, Johnson, Fortas, Reedy.'
      tags:
      - name:jenkins-walter-w
      - name:johnson-lyndon-b
      - name:fortas-abe
      - name:reedy-george-e
    section: '196309'
- add:
    entry:
      id: cal.1963-10-28.baker
      when: Oct. 28
      date: '1963-10-28'
      thread: baker
      also:
      - robert-kennedy
      c: 'After the weekend''s stories of Ellen Rometsch, deported in August, Robert Kennedy asks Hoover to have the Senate leaders keep sex out of the Rules Committee''s inquiry. Hoover sees Mansfield and Dirksen: nothing in it touches the national security.'
      n: '[[w.caro-passage-of-power]], 290–91. Check: the FBI''s record of the meeting. See [[cal.1963-10-07.baker]]. Names: Robert Kennedy, Hoover, Mansfield, Dirksen.'
      tags:
      - name:kennedy-robert-f
      - name:hoover-j-edgar
      - name:mansfield-mike
      - name:dirksen-everett
    section: '196310'
- add:
    entry:
      id: cal.1963-11-23.robert-kennedy
      when: Nov. 23
      date: '1963-11-23'
      thread: robert-kennedy
      also:
      - succession
      c: About 8:55 a.m. Johnson walks into the Oval Office and asks Evelyn Lincoln to clear it by 9:30; Robert Kennedy asks him to wait. Johnson works from EOB 274 three days, to the funeral; Bundy's note proposing it missed.
      n: '[[w.caro-passage-of-power]], 374–75, 377. Names: Johnson, Evelyn Lincoln, Robert Kennedy, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:lincoln-evelyn
      - name:kennedy-robert-f
      - name:bundy-mcgeorge
    section: '196311'
- add:
    entry:
      id: cal.1963-11-23.transition-and-staff-2
      when: Nov. 23
      date: '1963-11-23'
      thread: transition-and-staff
      c: 'First Cabinet meeting, 2:30 p.m.: "I want you all to stay on. I need you." Robert Kennedy late, brought in by Bundy; Rusk and Stevenson pledge support. Johnson to Freeman after: Kennedy late on purpose.'
      n: '[[w.caro-passage-of-power]], 375–76 (Freeman''s diary). Names: Johnson, Robert Kennedy, Bundy, Rusk, Stevenson, Freeman.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:bundy-mcgeorge
      - name:rusk-dean
      - name:stevenson-adlai-e
      - name:freeman-orville-l
    section: '196311'
- add:
    entry:
      id: cal.1963-11-23.succession-3
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: 'Johnson would address Congress Tuesday, the day after the funeral; McCormack counsels delicacy. Robert Kennedy, through Bundy and then Shriver, wants a day''s wait. Johnson: "It will be on Wednesday."'
      n: '[Johnson and McCormack, 3:54 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-mccormack-november-23-1963), Tape K6311.01A, PNO 17 (Miller Center). [[w.caro-passage-of-power]], 376–77. See [[cal.1963-11-22.succession]]. Names: Johnson, McCormack, Robert Kennedy, Bundy, Shriver.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:kennedy-robert-f
      - name:bundy-mcgeorge
      - name:shriver-r-sargent
    section: '196311'
- add:
    entry:
      id: cal.1963-11-25.assassination-2
      when: Nov. 25
      date: '1963-11-25'
      thread: assassination
      c: 'Johnson against a national commission: the FBI''s report and a Texas court of inquiry, Fortas advising. By telephone to Hoover, and to Alsop: "We don''t send in a bunch of carpetbaggers." Carr announces the court after the funeral; the *Post*''s editorial of Nov. 26 drops its call for a presidential commission.'
      n: '[Johnson and Hoover, 10:30 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-november-25-1963), Tape K6311.02, PNO 12 (Miller Center); [Johnson and Alsop, 10:40 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-joseph-alsop-november-25-1963), Tape K6311.02, PNOs 17, 18 (Miller Center). [[w.caro-passage-of-power]], 440–42. Check: Caro puts Fortas''s advice on the evening of Nov. 25 and the calls after it (441); the catalogue gives the calls that morning. See [[cal.1963-11-22.assassination]]. Names: Johnson, Fortas, Hoover, Alsop, Carr.'
      tags:
      - name:johnson-lyndon-b
      - name:fortas-abe
      - name:hoover-j-edgar
      - name:alsop-joseph
      - name:carr-waggoner
    section: '196311'
- add:
    entry:
      id: cal.1963-11-25.trade
      when: Nov. 25
      date: '1963-11-25'
      thread: trade
      also:
      - succession
      c: 'After the burial, Johnson to O''Brien, with O''Donnell: "a terrible thing to Kennedy''s memory to have this wheat sale thing repudiated"; count the votes. O''Brien to the Hill.'
      n: '[Johnson and Lawrence O''Brien, 4:04 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-november-25-1963), Tape K6311.02, PNO 20 (Miller Center). [[w.caro-passage-of-power]], 414–15. Check: Caro gives 4:40 p.m. See [[cal.1963-10-09.trade]]. Names: Johnson, O''Brien, O''Donnell, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
      - name:odonnell-kenneth-p
      - name:kennedy-john-f
    section: '196311'
- add:
    entry:
      id: cal.1963-11-25.economy-2
      when: Nov. 25
      date: '1963-11-25'
      thread: economy
      c: 'Night, after the governors: Heller, Dillon and Gordon with Johnson. Byrd will not let the tax bill out without a budget under $100 billion; the draft stands at $101.5 billion. Johnson: "If you want to get an $11 billion tax bill, you''re going to have to give up $1, 1½ billion of expenditures." Dillon and Heller agree.'
      n: '[[w.caro-passage-of-power]], 418–24 (Ackley''s notes). See [[cal.1963-01-24.economy]]. Names: Heller, Dillon, Gordon, Johnson, Byrd.'
      tags:
      - name:heller-walter-w
      - name:dillon-c-douglas
      - name:gordon-kermit
      - name:johnson-lyndon-b
      - name:byrd-harry-f
    section: '196311'
- add:
    entry:
      id: cal.1963-11-29.civil-rights-bill
      when: Nov. 29
      date: '1963-11-29'
      thread: civil-rights-bill
      c: 'Wilkins with Johnson in the Oval Office, the first of five meetings with the civil rights leaders one at a time: "I want that bill passed." O''Brien''s memo the same day: a discharge petition too late to bring the bill out of Rules before the recess.'
      n: '[[w.caro-passage-of-power]], 485, 488–90 (Wilkins''s account). See [[cal.1963-11-27.succession]]. Names: Wilkins, Johnson, O''Brien.'
      tags:
      - name:wilkins-roy
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
    section: '196311'
- add:
    entry:
      id: cal.1963-11-29.assassination-2
      when: Nov. 29
      date: '1963-11-29'
      thread: assassination
      c: 'The commission''s members. Katzenbach and Cox to Warren at the Court, 2:30 p.m.: he will not serve. Johnson to Russell, 4:05 p.m.: Russell refuses; Warren''s name kept from him. Warren to the Oval Office; Johnson: "39 million in an hour"; Warren accepts. Robert Kennedy''s names, Dulles and McCloy, taken. The list to the press; to Russell, 8:55 p.m.: "I couldn''t serve there with Chief Justice Warren."'
      n: '[Johnson and Russell, 4:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-november-29-1963), Tape K6311.05, PNO 7 (Miller Center); [8:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-november-30-1963), Tape K6311.06, PNOs 14–16 (Miller Center). [[w.caro-passage-of-power]], 442–48. See [[cal.1963-11-29.assassination]]. Names: Katzenbach, Cox, Warren, Johnson, Russell, Robert Kennedy, Dulles, McCloy.'
      tags:
      - name:katzenbach-nicholas
      - name:cox-archibald
      - name:warren-earl
      - name:johnson-lyndon-b
      - name:russell-richard-b
      - name:kennedy-robert-f
      - name:dulles-allen-w
      - name:mccloy-john-j
    section: '196311'
- add:
    entry:
      id: cal.1963-12-02.civil-rights-bill
      when: Dec. 2
      date: '1963-12-02'
      thread: civil-rights-bill
      c: 'Johnson to Bolling, evening, in confidence: the discharge petition "has got to go." Bolling counts about 160 Democrats, the Republicans "up in the air." Johnson: a vote against signing a vote against civil rights. Whitney Young with Johnson the same day.'
      n: '[Johnson and Bolling, 6:56 p.m.](https://prde.upress.virginia.edu/conversations/9020028), Tape K6312.02, PNO 8 (PRDE only). [[w.caro-passage-of-power]], 487–88, 490. Names: Johnson, Bolling, Whitney Young.'
      tags:
      - name:johnson-lyndon-b
      - name:bolling-richard
      - name:young-whitney-m-jr
    section: '196312'
- add:
    entry:
      id: cal.1963-12-03.civil-rights-bill
      when: Dec. 3
      date: '1963-12-03'
      thread: civil-rights-bill
      c: 'Meany rides in with Johnson from The Elms and sits in on the leaders'' breakfast; labor''s "full support." Johnson for the petition: "All you are asking is a hearing"; as many Democrats as can be had, the Republicans to match them. Albert''s count, 165 or 150; Johnson asks one by the whips. King in the Oval Office, shown the Republicans not signed. Albert Thomas brings six Texans.'
      n: '[Johnson and Carl Albert, 5:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-albert-december-3-1963), Tape K6312.03 (Miller Center); [Johnson and David McDonald, King present, 12:10 p.m.](https://prde.upress.virginia.edu/conversations/9020036), Tape K6312.02, PNO 18 (PRDE only). [[w.caro-passage-of-power]], 490, 492–94. Names: Meany, Johnson, Albert, Boggs, King, Albert Thomas, McCormack.'
      tags:
      - name:meany-george
      - name:johnson-lyndon-b
      - name:albert-carl
      - name:boggs-hale
      - name:king-martin-luther-jr
      - name:thomas-albert
      - name:mccormack-john-w
    section: '196312'
- add:
    entry:
      id: cal.1963-12-04.civil-rights-bill
      when: Dec. 4
      date: '1963-12-04'
      thread: civil-rights-bill
      c: 'The House Republican conference against the petition, McCulloch and Ford speaking. Johnson to the Business Council and the AFL-CIO''s Executive Council: "the party of Lincoln." That evening Clarence Brown, Rules'' ranking Republican, to Smith: something has to be done.'
      n: 'Remarks to Members of the Business Council, [1963–64 Pub. Papers 22](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=106) (Dec. 4, 1963); Remarks at a Meeting With the AFL-CIO Executive Council, [1963–64 Pub. Papers 20](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=104) (Dec. 4, 1963). [[w.caro-passage-of-power]], 494–97. Names: McCulloch, Ford, Johnson, Clarence Brown, Smith.'
      tags:
      - name:mcculloch-william-m
      - name:ford-gerald-r
      - name:johnson-lyndon-b
      - name:brown-clarence-j
      - name:smith-howard-w
    section: '196312'
- add:
    entry:
      id: cal.1963-12-05.civil-rights-bill
      when: Dec. 5
      date: '1963-12-05'
      thread: civil-rights-bill
      c: 'Smith''s statement: hearings on the bill "reasonably soon" in January. Brown: early January, seven to ten days, twelve at most; Halleck: the five Republicans on Rules to vote it out, the House to pass it by the end of January.'
      n: '[[w.caro-passage-of-power]], 496–97. Check: the statement''s text. Names: Smith, Clarence Brown, Halleck.'
      tags:
      - name:smith-howard-w
      - name:brown-clarence-j
      - name:halleck-charles-a
    section: '196312'
- add:
    entry:
      id: cal.1963-12-05.economy
      when: Dec. 5
      date: '1963-12-05'
      thread: economy
      c: 'Byrd to lunch in the small office off the Oval Office, asked by telephone Dec. 4, Valenti present. Byrd''s terms: the budget under $100 billion, in writing, seen by him and Williams, before the tax bill leaves Finance. To reporters: "what I''ve been asking for all along."'
      n: '[Johnson and Byrd, Dec. 4, 4:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-december-4-1963), Tape K6312.03, PNO 19 (Miller Center) (the invitation). [[w.caro-passage-of-power]], 475–77 (Valenti''s accounts and Byrd''s to reporters). See [[cal.1963-11-25.economy-2]]. Names: Byrd, Johnson, Valenti, Williams.'
      tags:
      - name:byrd-harry-f
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:williams-john-j
    section: '196312'
- add:
    entry:
      id: cal.1963-12-12.economy
      when: Dec. 12
      date: '1963-12-12'
      thread: economy
      c: 'Finance has taken up Long''s oil amendment, the Treasury''s letter supporting it. Johnson to Dillon: "I thought you had an agreement that you''d be against every amendment"; every Democrat on the committee at every meeting, against every one. If the tax bill gets behind civil rights, "it''s Good night, Grace."'
      n: '[Johnson and Dillon, 4:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-douglas-dillon-december-12-1963), Tape K6312.08, PNO 6 (Miller Center). [[w.caro-passage-of-power]], 481–82. See [[cal.1963-12-05.economy]]. Names: Long, Johnson, Dillon.'
      tags:
      - name:long-russell-b
      - name:johnson-lyndon-b
      - name:dillon-c-douglas
    section: '196312'
- add:
    entry:
      id: cal.1963-12-13.economy
      when: Dec. 13
      date: '1963-12-13'
      thread: economy
      c: 'Johnson to Byrd: "I''m working on my budget every night"; "You can tell your grandchildren you were the senator who finally got a President to cut his budget"; the amendments voted before the recess. Byrd, "tired of this talking": "Right."'
      n: '[Johnson and Byrd, 11:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-december-13-1963), Tape K6312.08, PNO 14 (Miller Center). [[w.caro-passage-of-power]], 482–83. See [[cal.1963-12-05.economy]]. Names: Johnson, Byrd.'
      tags:
      - name:johnson-lyndon-b
      - name:byrd-harry-f
    section: '196312'
- add:
    entry:
      id: cal.1963-12-20.poverty
      when: Dec. 20
      date: '1963-12-20'
      thread: poverty
      c: 'Cabinet officers and their staffs on the poverty program, Sorensen at the head of the table: a dispute over who would run the projects. Demonstration projects in a few cities from $500 million found in existing programs.'
      n: '[[w.caro-passage-of-power]], 540 (Capron''s account). See [[cal.1963-11-19.poverty]]. Names: Sorensen.'
      tags:
      - name:sorensen-theodore-c
    section: '196312'
- add:
    entry:
      id: cal.1963-12-23.civil-rights-bill
      when: Dec. 23
      date: '1963-12-23'
      thread: civil-rights-bill
      c: '10:30 p.m., still in the Oval Office, Johnson to Wilkins by telephone: a Negro secretary to be hired, Gerri Whittington; names for the Civil Rights Commission; the State of the Union; a Mexican-American for the staff. Wilkins: "We need you."'
      n: '[Johnson and Wilkins, 10:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-roy-wilkins-december-24-1963), Tape K6312.17, PNO 3 (Miller Center). [[w.caro-passage-of-power]], 491. See [[cal.1963-11-29.civil-rights-bill]]. Names: Johnson, Wilkins.'
      tags:
      - name:johnson-lyndon-b
      - name:wilkins-roy
    section: '196312'
- add:
    entry:
      id: cal.1963-12-25.press-and-broadcasting
      when: Dec. 25
      date: '1963-12-25'
      thread: press-and-broadcasting
      c: 'From the Ranch, Johnson to Valenti on the merger of Houston''s National Bank of Commerce, held up by the Federal Reserve and the Antitrust Division; Jones, its president, publishes the *Houston Chronicle*: no approval "unless they give me their lung as long as I''m in public life." Jones to the Ranch Dec. 27, quietly.'
      n: '[Johnson and Valenti, 1:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-jack-valenti-december-25-1963), Tape K6312.21, PNO 1 (Miller Center); [Johnson and Jones, 8:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-johnny-jones-december-25-1963), Tape K6312.18, PNO 15 (Miller Center). [[w.caro-passage-of-power]], 523–24. Check: which call Caro quotes. Names: Johnson, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
    section: '196312'
- add:
    entry:
      id: cal.1963-12-27.press-and-broadcasting
      when: Dec. 27
      date: '1963-12-27'
      thread: press-and-broadcasting
      c: 'Jones of the *Chronicle* at the Ranch with Gus Wortham, Albert Thomas in George Brown''s place: "Whenever you need anything call on us." Not enough, Johnson tells Wortham after: a letter.'
      n: '[[w.caro-passage-of-power]], 524–25 (Johnson''s account to Brown, Jan. 2). See [[cal.1963-12-25.press-and-broadcasting]]. Names: Albert Thomas, Johnson.'
      tags:
      - name:thomas-albert
      - name:johnson-lyndon-b
    section: '196312'
- add:
    entry:
      id: cal.1963-12-29.poverty
      when: Dec. 29–Jan. 3
      date: '1963-12-29'
      thread: poverty
      c: Heller and Gordon at the Ranch. Johnson doubles the poverty money to a billion dollars, half of it new; not demonstrations in a few cities but a program "big and bold" enough to pass. Community action kept.
      n: '[[w.caro-passage-of-power]], 540–44 (Heller''s account; Johnson''s memoir). See [[cal.1963-11-19.poverty]]. Names: Heller, Gordon, Johnson.'
      tags:
      - name:heller-walter-w
      - name:gordon-kermit
      - name:johnson-lyndon-b
    section: '196312'
- add:
    entry:
      id: cal.1963-12-30.program
      when: Dec. 30
      date: '1963-12-30'
      thread: program
      also:
      - poverty
      c: 'Sorensen''s first draft of the State of the Union, at the Lewis Ranch: "This Administration hereby declares unconditional war on poverty in America."'
      n: '[[w.caro-passage-of-power]], 544–45. See [[cal.1963-01-14.program]]. Names: Sorensen.'
      tags:
      - name:sorensen-theodore-c
    section: '196312'
- add:
    entry:
      id: cal.1964-01-02.press-and-broadcasting
      when: Jan. 2
      date: '1964-01-02'
      thread: press-and-broadcasting
      c: 'Johnson to George Brown, in the hospital: no merger without a letter from Jones that the *Chronicle* will support his administration "as long as you''re there"; the bank not to be mentioned. Brown: Albert Thomas thinks it "too much of a trade." "Okay." Jones''s letter the next day.'
      n: '[Johnson and George Brown, 11:55 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-brown-january-2-1964), Conversation WH6401-03-1143 (Miller Center). [[w.caro-passage-of-power]], 525–27. See [[cal.1963-12-25.press-and-broadcasting]]. Names: Johnson, Albert Thomas.'
      tags:
      - name:johnson-lyndon-b
      - name:thomas-albert
    section: '196401'
- add:
    entry:
      id: cal.1964-01-04.press-and-broadcasting
      when: Jan. 4
      date: '1964-01-04'
      thread: press-and-broadcasting
      c: 'Johnson to Albert Jackson, managing editor of the *Dallas Times-Herald*, on its reporter Margaret Mayer''s letter of Dec. 17 asking about the Johnson stations: stop her. The paper''s records and its stations'' might be asked for. Jackson, Jan. 5: "We''ll take care of the thing tomorrow."'
      n: '[Johnson and Jackson, 8:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-albert-jackson-january-5-1964), Conversation WH6401-05-1183 (Miller Center); [Jan. 5, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-albert-jackson-january-5-1964-0), Conversation WH6401-05-1186 (Miller Center). [[w.caro-passage-of-power]], 521–23. Check: the Miller Center dates the first call Jan. 5. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
    section: '196401'
- add:
    entry:
      id: cal.1964-01-07.economy
      when: Jan. 7
      date: '1964-01-07'
      thread: economy
      c: 'Byrd and Williams brought to the White House to see the budget''s galleys and the Budget Bureau''s tally sheets: $97.9 billion. Johnson: "Now you can tell your friends that you forced the President of the United States to reduce the budget."'
      n: '[[w.caro-passage-of-power]], 552–53. See [[cal.1963-12-05.economy]]. Names: Byrd, Williams, Johnson.'
      tags:
      - name:byrd-harry-f
      - name:williams-john-j
      - name:johnson-lyndon-b
    section: '196401'
- add:
    entry:
      id: cal.1964-01-08.press-and-broadcasting
      when: Jan. 8
      date: '1964-01-08'
      thread: press-and-broadcasting
      c: 'Before the State of the Union, Johnson to Jones: the letter received, the merger signed that morning, "From here on out, we''re partners"; to Brown, the same. Saxon announces the approval Jan. 13.'
      n: '[Johnson and Jones, 11:04 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-jones-january-8-1964), Conversation WH6401-08-1236 (Miller Center); [Johnson and Brown, 11:20 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-brown-and-office-secretary-january-8), Conversation WH6401-08-1239 (Miller Center). [[w.caro-passage-of-power]], 527. See [[cal.1963-12-25.press-and-broadcasting]]. Names: Johnson, Saxon.'
      tags:
      - name:johnson-lyndon-b
      - name:saxon-james-j
    section: '196401'
- add:
    entry:
      id: cal.1964-01-16.vietnam
      when: Jan. 16
      date: '1964-01-16'
      thread: vietnam
      c: 'Johnson approves the Krulak committee''s plan of covert operations against the North, received at the Ranch Jan. 2: raids on the trail and the coasts of the Gulf of Tonkin, from Feb. 1. No NSAM; not announced.'
      n: '[[w.caro-passage-of-power]], 533–35. Check: the record of the approval. See [[cal.1963-11-26.vietnam]]. Names: Johnson, Krulak.'
      tags:
      - name:johnson-lyndon-b
      - name:krulak-victor-h
    section: '196401'
- add:
    entry:
      id: cal.1964-01-18.civil-rights-bill
      when: Jan. 18
      date: '1964-01-18'
      thread: civil-rights-bill
      c: 'The petition at 178 names. Halleck in the Oval Office at noon: no Lincoln''s Birthday speech "when Howard Smith''s got his foot on Lincoln''s neck." Johnson telephones Webb before him, on what NASA can do for Purdue, in Halleck''s district; after he leaves: "Let''s help him."'
      n: '[Johnson and Webb, 12:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-webb-january-18-1964), Conversation WH6401-16-1421 (Miller Center). [[w.caro-passage-of-power]], 559. See [[cal.1964-01-09.civil-rights-bill]]. Names: Halleck, Smith, Johnson, Webb.'
      tags:
      - name:halleck-charles-a
      - name:smith-howard-w
      - name:johnson-lyndon-b
      - name:webb-james-e
    section: '196401'
- add:
    entry:
      id: cal.1964-01-21.civil-rights-bill
      when: Jan. 21
      date: '1964-01-21'
      thread: civil-rights-bill
      c: 'Webb to Johnson after seeing Halleck: a $750,000 building at Purdue, research grants on an installment basis; "the minute he kicks over the traces, we stop the installment." Johnson: "Sounds good."'
      n: '[Johnson and Webb, 3:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-webb-january-21-1964), Conversation WH6401-18-1454 (Miller Center). [[w.caro-passage-of-power]], 560. See [[cal.1964-01-18.civil-rights-bill]]. Names: Webb, Johnson, Halleck.'
      tags:
      - name:webb-james-e
      - name:johnson-lyndon-b
      - name:halleck-charles-a
    section: '196401'
- add:
    entry:
      id: cal.1964-01-23.civil-rights-bill
      when: Jan. 23
      date: '1964-01-23'
      thread: civil-rights-bill
      c: 'Smith gives in, Republicans on Rules having met with its Democrats: the hearings to end Jan. 30, the bill "will be voted out."'
      n: '[[w.caro-passage-of-power]], 560. Check: the Rules Committee''s record. See [[cal.1964-01-09.civil-rights-bill]]. Names: Smith, Johnson.'
      tags:
      - name:smith-howard-w
      - name:johnson-lyndon-b
    section: '196401'
- add:
    entry:
      id: cal.1964-01-23.economy
      when: Jan. 23
      date: '1964-01-23'
      thread: economy
      c: 'Finance adopts Dirksen''s amendment repealing the excises on jewelry, furs, handbags and luggage, 12–5, $450 million a year; Anderson, Hartke and Ribicoff revive their own. Johnson by telephone: the three to withdraw them; Byrd to allow one motion on all the amendments. The afternoon vote strikes them, 9–8, Byrd''s the ninth: "My vote."'
      n: '[Johnson and Smathers, 12:34 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-smathers-january-23-1964), Conversation WH6401-19-1489 (Miller Center); [Anderson, 1:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-clinton-anderson-january-23-1964), WH6401-19-1490; [Hartke, 1:11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-vance-hartke-january-23-1964), WH6401-19-1492; [Ribicoff, 1:14 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-abraham-ribicoff-and-office-conversation), WH6401-19-1493; [Byrd, 1:17 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-january-23-1964), WH6401-19-1495; [Byrd to the operator](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd), WH6401-19-1496; [Byrd, 5:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-january-23-1964-0), WH6401-20-1510 (Miller Center). [[w.caro-passage-of-power]], 554–57. See [[cal.1964-01-07.economy]]. Names: Dirksen, Clinton Anderson, Hartke, Ribicoff, Johnson, Byrd, Smathers.'
      tags:
      - name:dirksen-everett
      - name:anderson-clinton-p
      - name:hartke-rupert-v
      - name:ribicoff-abraham
      - name:johnson-lyndon-b
      - name:byrd-harry-f
      - name:smathers-george-a
    section: '196401'
- add:
    entry:
      id: cal.1964-01-27.transition-and-staff
      when: Jan. 27
      date: '1964-01-27'
      thread: transition-and-staff
      c: Schlesinger resubmits the resignation he wrote after Dallas; accepted. Goldman of Princeton to succeed him, already reported.
      n: '[[w.caro-passage-of-power]], 588–89 (Schlesinger''s account). See [[cal.1964-01-15.transition-and-staff]]. Names: Schlesinger, Goldman.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:goldman-eric-f
      - name:johnson-lyndon-b
    section: '196401'
- add:
    entry:
      id: cal.1964-02-11.robert-kennedy
      when: Feb. 11
      date: '1964-02-11'
      thread: robert-kennedy
      also:
      - elections-1964
      c: 'The Oval Office. Johnson tells Robert Kennedy to have Paul Corbin, of the National Committee, fired: he is organizing a write-in for Kennedy in New Hampshire. Kennedy refuses; by his account, Johnson: "President Kennedy isn''t President anymore."'
      n: '[[w.caro-passage-of-power]], 583–84. Names: Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
    section: '196402'
- add:
    entry:
      id: cal.1964-03-19.transition-and-staff
      when: Mar. 19
      date: '1964-03-19'
      thread: transition-and-staff
      also:
      - elections-1964
      c: Salinger, told at lunch that he may run for the Senate in California, resigns as Press Secretary that afternoon, effective at once; the filing closes Mar. 20.
      n: '[[w.caro-passage-of-power]], 592–94. Check: the White House''s announcement. Names: Salinger.'
      tags:
      - name:salinger-pierre
    section: '196403'
