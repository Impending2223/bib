      when: June 27
      date: '1968-06-27'
      thread: elections-1968-state-conventions
      c: 'New York, the night before the State committee meets. Burns, the State chairman, with the reform leaders at Eleanor
        French''s house: twelve to fifteen at-large seats for McCarthy''s people; Mrs. French: no fewer than twenty-eight.'
      n: '[[w.chester-american-melodrama]], 408–9. See [[cal.1968-06-18.elections-1968-state-conventions]]. Names: McCarthy.'
