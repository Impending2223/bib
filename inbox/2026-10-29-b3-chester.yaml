      date: '1968-03-23'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'Robert Kennedy leaves New York for California, his first trip there as a candidate, advanced by Salinger and Tuck
        on Unruh''s and Dutton''s advice: San Francisco''s airport, the arrival moved indoors; Sacramento.'
      n: '[[w.chester-american-melodrama]], 129–30. Names: Robert Kennedy, Salinger, Unruh, Dutton.'
