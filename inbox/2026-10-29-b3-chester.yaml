      also:
      - democratic-party
      c: Short, Humphrey's treasurer, reports a further $2 million in loans, after a million borrowed in September; of eighteen
        lending more than $100,000 each in the reports of late October, three of United Artists' board with Krim, three of
        Gulf and Western's, Weisl among them; Andreas's committees. Fewer than thirty people give a third of the $12 to 13
        million the campaign spends.
      n: '[[w.chester-american-melodrama]], 714–16. Names: Humphrey.'
