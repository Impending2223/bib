- add:
    entry:
      id: cal.1968-08-28.elections-1968-2
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968
      also:
      - elections-1968-chicago
      c: '9:30 a.m. Edward Kennedy, by telephone to Humphrey, Daley and Unruh, will withdraw his name even if it is put forward;
        a statement to the wire services. Unruh tells the California caucus; Daley, from the Illinois caucus at the Sherman
        House: 112 of its 118 votes for Humphrey.'
      n: '[[w.chester-american-melodrama]], 575, 578. See [[cal.1968-08-25.elections-1968]]. Names: Edward Kennedy, Humphrey,
        Daley, Unruh.'
      tags:
      - name:kennedy-edward-m
      - name:humphrey-hubert-h
      - name:daley-richard-j
      - name:unruh-jesse-m
      src:
        c: '78fadce7'
        rows:
        - 'w.chester-american-melodrama 575, 578: all'
- add:
    entry:
      id: cal.1968-03-23.war-opposition
      when: Mar. 23–24
      date: '1968-03-23'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'Lake Villa, Ill., a YMCA camp. Several hundred from the antiwar, draft-resistance, New Left and black militant groups
        on the Democratic convention: from ignoring it to "closing" it; the sense of the meeting, a mass "funeral march" on
        the Amphitheatre. Dellinger to organize it: "We are going to storm the hearts and minds of the American people."'
      n: '[[w.chester-american-melodrama]], 516–17. Names: Dellinger.'
      tags:
      - name:dellinger-david
      - state:il
      src:
        c: cd499a80
        rows:
        - 'w.chester-american-melodrama 516–17: all'
- add:
    entry:
      id: cal.1968-04-27.war-opposition
      when: Apr. 27
      date: '1968-04-27'
      thread: war-opposition
      also:
      - civil-disorders
      - elections-1968-chicago
      c: 'Chicago, the Loop. The Chicago Peace Council''s march, some sixty-five hundred: the police club the marchers, twenty
        injured, Superintendent Conlisk looking on; the only such day of the nation''s that turns violent.'
      n: '[[w.chester-american-melodrama]], 517–18.'
      tags:
      - city:chicago
      - state:il
      src:
        c: '015b4da6'
        rows:
        - 'w.chester-american-melodrama 517–18: all'
- add:
    entry:
      id: cal.1968-08-01.civil-disorders
      when: Aug. 1
      date: '1968-08-01'
      thread: civil-disorders
      also:
      - elections-1968-chicago
      - war-opposition
      c: 'Chicago. The report of the citizens'' inquiry into the peace march of Apr. 27, Sparling''s, of Roosevelt University:
        the violent police "cannot be truly labeled ''exceptions''"; "the political system of Chicago, not merely individual
        officers, was at work that Saturday." City Hall silent.'
      n: '[[w.chester-american-melodrama]], 518. See [[cal.1968-04-27.war-opposition]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - city:chicago
      - state:il
      src:
        c: '810fb026'
        rows:
        - 'w.chester-american-melodrama 518: all'
- add:
    entry:
      id: cal.1968-08-20.elections-1968-chicago-2
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Lowenstein calls off the Coalition for an Open Convention''s rally in Chicago, Soldier Field booked for the week
        by the Democratic National Committee for "Lyndon Johnson''s Birthday Party": the authorities "seem determined to have
        a confrontation that can only produce violence and bloodshed." McCarthy had already told his supporters to stay away.'
      n: '[[w.chester-american-melodrama]], 519. Names: Lowenstein, McCarthy, Johnson.'
      tags:
      - name:lowenstein-allard
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      src:
        c: bddb091b
        rows:
        - 'w.chester-american-melodrama 519: all'
- add:
    entry:
      id: cal.1968-08-30.elections-1968-chicago
      when: Aug. 30
      date: '1968-08-30'
      thread: elections-1968-chicago
      also:
      - civil-disorders
      c: 'Chicago, 4 a.m. The police raid the fifteenth floor of the Conrad Hilton, McCarthy''s staff''s, on a tip from the
        National Guard that things were thrown from room 1506A: staff lined against the wall, rooms entered with pass keys,
        beatings.'
      n: '[[w.chester-american-melodrama]], 591, 599. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - city:chicago
      - state:il
      src:
        c: '997bc77d'
        rows:
        - 'w.chester-american-melodrama 591, 599: all'
- add:
    entry:
      id: cal.1968-09-06.elections-1968-chicago
      when: Sept. 6
      date: '1968-09-06'
      thread: elections-1968-chicago
      also:
      - civil-disorders
      c: 'Chicago. Daley''s report, "The Strategy of Confrontation": police intelligence knew of plans "to assassinate Senator
        Eugene McCarthy, Vice-President Hubert Humphrey, Mayor Richard J. Daley, and other political leaders." Aug. 22, the
        State''s Attorney had called a grand jury on the stories, sixteen subpoenaed Aug. 23.'
      n: '[[w.chester-american-melodrama]], 596–97. Names: Daley, McCarthy, Humphrey.'
      tags:
      - name:daley-richard-j
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - city:chicago
      - state:il
      src:
        c: c4ec2c6b
        rows:
        - 'w.chester-american-melodrama 596–97: all'
- add:
    entry:
      id: cal.1968-05-18.elections-1968
      when: May 18
      date: '1968-05-18'
      thread: elections-1968
      also:
      - republican-party
      c: 'New York. Mitchell, Nixon''s law partner, takes charge of his campaign, after Bellmon''s withdrawal in May to run
        for the Senate in Oklahoma; Ellsworth to the Washington office. Mitchell: "We don''t have any of them around here,"
        of politicians.'
      n: '[[w.chester-american-melodrama]], 614–16. Names: Mitchell, Nixon, Bellmon, Ellsworth.'
      tags:
      - name:mitchell-john-n
      - name:nixon-richard-m
      - name:bellmon-henry
      - name:ellsworth-robert
      src:
        c: e58f7f83
        rows:
        - 'w.chester-american-melodrama 614–16: all'
- add:
    entry:
      id: cal.1968-06-10.elections-1968-2
      when: June 10
      date: '1968-06-10'
      thread: elections-1968
      also:
      - republican-party
      c: 'New York, 450 Park Avenue. Nixon''s policy research, Buchanan''s since October 1966, set in three parts: domestic
        and economic policy under Greenspan, foreign policy under Richard Allen, "the Presidency" under Price. Whalen leaves
        soon after. That month Mitchell puts Derge, of Indiana University, over the campaign''s opinion research: the Opinion
        Research Corporation''s panels in twelve States, $250,000.'
      n: '[[w.chester-american-melodrama]], 616–18. Names: Nixon, Buchanan, Greenspan, Richard Allen, Price, Whalen, Mitchell.'
      tags:
      - name:nixon-richard-m
      - name:buchanan-patrick-j
      - name:greenspan-alan
      - name:allen-richard-v
      - name:price-raymond-k-jr
      - name:whalen-richard-j
      - name:mitchell-john-n
      src:
        c: f9443a38
        rows:
        - 'w.chester-american-melodrama 616–18: all'
- add:
    entry:
      id: cal.1968-09.elections-1968-6
      when: Sept.
      date: '1968-09'
      thread: elections-1968
      also:
      - republican-party
      - civil-rights-the-executive
      c: 'Early in the month. Longstreth, of the Philadelphia Chamber of Commerce, to Nixon: in Philadelphia meet privately
        with Negro Republican leaders. Nixon: "I am not going to campaign for the black vote at the risk of alienating the
        suburban vote"; "If I am President, I am not going to owe anything to the black community."'
      n: '[[w.chester-american-melodrama]], 624–25 (Longstreth''s account). Names: Nixon.'
      tags:
      - name:nixon-richard-m
      - state:pa
      src:
        c: c3e69e97
        rows:
        - 'w.chester-american-melodrama 624–25: all'
- add:
    entry:
      id: cal.1968-08-29.elections-1968-2
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968
      also:
      - democratic-party
      c: Chicago, before the acceptance speech. O'Brien shows Humphrey a rough plan for the campaign, cut down from Orville
        Freeman's "black book"; Humphrey approves it. O'Brien stays on to manage the campaign.
      n: '[[w.chester-american-melodrama]], 632, 638–39. Check: a manager of Humphrey''s gives Aug. 30 (632). Names: O''Brien,
        Humphrey, Orville Freeman.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - name:freeman-orville-l
      - city:chicago
      - state:il
      src:
        c: '34171418'
        rows:
        - 'w.chester-american-melodrama 638–39: all'
        - 'w.chester-american-melodrama 632: A'
- add:
    entry:
      id: cal.1968-09-11.vietnam-paris
      when: Sept. 11
      date: '1968-09-11'
      thread: vietnam-paris
      also:
      - elections-1968
      c: 'Harriman, in a radio interview: no progress made in Paris.'
      n: '[[w.chester-american-melodrama]], 642. Names: Harriman.'
      tags:
      - name:harriman-w-averell
      src:
        c: c33ef09c
        rows:
        - 'w.chester-american-melodrama 642: all'
- add:
    entry:
      id: cal.1968-09-13.elections-1968-2
      when: Sept. 13
      date: '1968-09-13'
      thread: elections-1968
      also:
      - democratic-party
      - press-and-broadcasting
      c: 'Humphrey''s campaign takes its advertising from Doyle Dane Bernbach, by cable to Bernbach in Mexico, and gives it
        to Campaign Planning Associates, Napolitan''s, with Lennen and Newell, for a flat fee. D.D.B.''s plan, $6 or 7 million;
        Short, the treasurer, to Lennen and Newell: "I may be able to give you two and a half million."'
      n: '[[w.chester-american-melodrama]], 637–40. Names: Humphrey, Napolitan.'
      tags:
      - name:humphrey-hubert-h
      - name:napolitan-joseph
      src:
        c: c63baee3
        rows:
        - 'w.chester-american-melodrama 637–40: all'
- add:
    entry:
      id: cal.1968-09-15.elections-1968-2
      when: Sept. 15
      date: '1968-09-15'
      thread: elections-1968
      also:
      - vietnam-paris
      c: 'Paris, unannounced, on his way to NATO at Brussels. Ball, still at the United Nations, two private talks with Harriman:
        since Aug. 19 Harriman has been moving, with Johnson''s leave, toward the San Antonio formula; Humphrey''s white paper
        on a halt well on the safe side of what he and Vance are telling the North Vietnamese.'
      n: '[[w.chester-american-melodrama]], 643–44. Names: Ball, Harriman, Vance, Humphrey, Johnson.'
      tags:
      - name:ball-george-w
      - name:harriman-w-averell
      - name:vance-cyrus
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      src:
        c: '8afc8a99'
        rows:
        - 'w.chester-american-melodrama 643–44: all'
- add:
    entry:
      id: cal.1968-09-25.elections-1968
      when: Sept. 25
      date: '1968-09-25'
      thread: elections-1968
      c: 'Los Angeles. Humphrey at Pepperdine College and Leisure World in Orange County, no public rally; a taped appeal
        on KHJ; then Sacramento. On a halt: "The President has not made me his slave, and I am not his humble servant. ...
        He is not screening my speeches."'
      n: '[[w.chester-american-melodrama]], 644–45. Names: Humphrey, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      - state:ca
      src:
        c: a4372dfb
        rows:
        - 'w.chester-american-melodrama 644–45: all'
- add:
    entry:
      id: cal.1968-09-26.elections-1968
      when: Sept. 26
      date: '1968-09-26'
      thread: elections-1968
      c: 'New York. McCarthy, back from the south of France: he does not intend to support Humphrey.'
      n: '[[w.chester-american-melodrama]], 645. Names: McCarthy, Humphrey.'
      tags:
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      src:
        c: df340068
        rows:
        - 'w.chester-american-melodrama 645: all'
- add:
    entry:
      id: cal.1968-09-26.elections-1968-2
      when: Sept. 26
      date: '1968-09-26'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Night, after word of the weekend''s Gallup (Humphrey 15 points behind Nixon''s 43 percent, Wallace 21). O''Brien
        and Humphrey: $100,000 for a half hour on national television, Monday, Sept. 30, from Salt Lake City. O''Brien had
        found $100,000 for buttons and stickers only on Monday.'
      n: '[[w.chester-american-melodrama]], 645–46. Names: O''Brien, Humphrey, Nixon, Wallace.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - name:nixon-richard-m
      - name:wallace-george-c
      - ok:result-form
      src:
        c: '63c3c5f0'
        rows:
        - 'w.chester-american-melodrama 645–46: all'
- add:
    entry:
      id: cal.1968-09-26.elections-1968-3
      when: Sept. 26
      date: '1968-09-26'
      thread: elections-1968
      also:
      - republican-party
      c: 'Derge presents Nixon and Mitchell the Opinion Research Corporation''s findings on Wallace''s supporters: more than
        half for Nixon in a two-way race, most liable to change. His advice, adopted: no move to the right, no attack on Wallace,
        but a vote for Wallace a wasted vote. Goldwater carries the line to his old followers in speeches and a leaflet.'
      n: '[[w.chester-american-melodrama]], 625–26. Names: Nixon, Mitchell, Wallace, Goldwater.'
      tags:
      - name:nixon-richard-m
      - name:mitchell-john-n
      - name:wallace-george-c
      - name:goldwater-barry-m
      src:
        c: '27b2e2ad'
        rows:
        - 'w.chester-american-melodrama 625–26: A-B'
        - 'w.chester-american-melodrama 626: C'
- add:
    entry:
      id: cal.1968-09-26.elections-1968-4
      when: Sept. 26
      date: '1968-09-26'
      thread: elections-1968
      also:
      - republican-party
      c: 'De Vries, consultant to the party''s congressional and senatorial campaigns, to Mitchell, a personal letter: Nixon''s
        vote "staying the same—about forty per cent" for five or six months; "this race is by no means in the bag for Nixon";
        the cross-pressured will go back to their parties; "a strategy and a plan in the tank" wanted. Mitchell does not answer.'
      n: '[[w.chester-american-melodrama]], 630–31. Names: De Vries, Mitchell, Nixon.'
      tags:
      - name:de-vries-walter
      - name:mitchell-john-n
      - name:nixon-richard-m
      src:
        c: '348d2aa8'
        rows:
        - 'w.chester-american-melodrama 630–31: all'
- add:
    entry:
      id: cal.1968-09-27.elections-1968
      when: Sept. 27
      date: '1968-09-27'
      thread: elections-1968
      also:
      - vietnam
      c: 'Portland, Ore. Several hundred students of Reed College and Portland State walk out on Humphrey, "End the War!"
        After midnight Ball, resigned from the United Nations to work for him, and Fred Harris with Humphrey in his suite:
        work begins on the definitive speech.'
      n: '[[w.chester-american-melodrama]], 646. Names: Humphrey, Ball, Fred Harris.'
      tags:
      - name:humphrey-hubert-h
      - name:ball-george-w
      - name:harris-fred-r
      - state:or
      src:
        c: c1dd267b
        rows:
        - 'w.chester-american-melodrama 646: all'
- add:
    entry:
      id: cal.1968-09-28.elections-1968
      when: Sept. 28
      date: '1968-09-28'
      thread: elections-1968
      also:
      - vietnam
      c: 'O''Brien, at the Watergate, reads the draft of the speech and dictates a memorandum, sent to Seattle by telecopier:
        a weak, vacillating draft, not worth the campaign''s last $100,000. Humphrey by telephone: "Your comments are valid";
        come to Seattle. That night in Seattle, hecklers on the platform; Humphrey: "I shall not be driven from this platform
        by a handful who believe in nothing."'
      n: '[[w.chester-american-melodrama]], 646–47. Names: O''Brien, Humphrey.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - state:wa
      src:
        c: '38a5e7c3'
        rows:
        - 'w.chester-american-melodrama 646–47: all'
- add:
    entry:
      id: cal.1968-09-29.elections-1968-3
      when: Sept. 29
      date: '1968-09-29'
      thread: elections-1968
      also:
      - vietnam
      c: 'Seattle, then Salt Lake City. O''Brien with Humphrey alone in the afternoon; at night, a dozen in Humphrey''s suite
        on the halt: O''Brien and Harris to cut the condition on the demilitarized zone, Rowe and Connell against making the
        speech at all; Ball, by telephone, gets Harriman''s assurance. Humphrey: "Let''s worry about what I''m going to say,
        for a change!", and writes the passage himself. The session ends at 5:15 a.m. All day Sunday Humphrey''s headquarters
        telephones McCarthy''s and Kennedy''s leaders: the speech "a major new independent position."'
      n: '[[w.chester-american-melodrama]], 647–48, 741. See [[cal.1968-09-26.elections-1968-2]]. Names: O''Brien, Humphrey,
        Fred Harris, Rowe, Ball, Harriman.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
