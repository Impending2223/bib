      when: July 12
      date: '1968-07-12'
      thread: elections-1968
      also:
      - china
      c: 'Humphrey''s speech for San Francisco, issued as a statement for his illness: East-West relations more important
        than Southeast Asia; China to be welcomed into the United Nations.'
      n: '[[w.chester-american-melodrama]], 421. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
