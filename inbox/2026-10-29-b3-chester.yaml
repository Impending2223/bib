      when: Mar. 2–3
      date: '1968-03-02'
      thread: republican-party
      also:
      - elections-1968
      c: 'New York, a couple of days after Romney''s withdrawal: Rockefeller at lunch with Hinman and Emmet Hughes, then the
        first weekend of March, with Happy Rockefeller, at 812 Fifth Avenue, on whether to run; none flatly for it, none ruling
        it out. The date in view, Mar. 22, the last day to enter Oregon''s primary, which would put him on Nebraska''s ballot
        too.'
      n: '[[w.chester-american-melodrama]], 210, 220–21. See [[cal.1968-02-28.elections-1968]]. Names: Rockefeller, Hinman,
        Emmet Hughes.'
