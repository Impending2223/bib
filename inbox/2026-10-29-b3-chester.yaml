      c: 'Nixon, on national radio: "We have a gravely serious security gap." The Soviets 50 percent ahead in bombers; the
        lead in nuclear submarines down four-fifths; "parity," a doctrine of "marking time"; a "survival gap" by 1970 or 1971.'
      n: '[[w.chester-american-melodrama]], 722–23. Names: Nixon.'
