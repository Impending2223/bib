      when: Aug. 10
      date: '1968-08-10'
      thread: georgia-bond
      also:
      - elections-1968-chicago
      - georgia
      c: 'Macon, Ga. Bond''s State convention, mounted with McCarthy''s staff: forty-one challenge delegates to Chicago, twenty-one
        white, twenty Negro, against the regular slate the State chairman, James Gray, and Governor Maddox picked.'
      n: '[[w.chester-american-melodrama]], 555–56. See [[cal.1968-08-26.elections-1968-2]]. Names: Bond, Maddox.'
      tags:
      - name:bond-julian
      - name:maddox-lester
      - state:ga
      src:
