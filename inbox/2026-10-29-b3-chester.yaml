      when: Aug. 1
      date: '1968-08-01'
      thread: elections-1968
      also:
      - democratic-party
      - vietnam
      c: 'Washington, a private lunch at the Carroll Arms: the peace-plank coalition. Gilligan and Kenneth O''Donnell, its
        convenors; Pell and Morse; Mankiewicz and Sorensen for McGovern''s and Kennedy''s men; Blair Clark and Rauh for McCarthy;
        Dutton. One plank, no lever for any candidate, no direct criticism of Johnson; Gilligan and O''Donnell cochairmen,
        Dutton to draft. Rauh pays.'
      n: '[[w.chester-american-melodrama]], 527–28. Names: Gilligan, Kenneth O''Donnell, Pell, Morse, Mankiewicz, Sorensen,
        Rauh, Dutton, Johnson.'
      tags:
      - name:gilligan-john-j
      - name:odonnell-kenneth-p
