      when: Mar. 16
      date: '1968-03-16'
      thread: elections-1968
      also:
      - democratic-party
      c: 'French Lick, Ind., the State''s Democratic county leaders at dinner, the day of Robert Kennedy''s announcement.
        Humphrey and St. Angelo, the State chairman, from a storeroom behind the banquet, telephone Governor Branigin in Fort
        Lauderdale, Fla., twenty minutes: he will run in the primary of May 7 as a favorite son for Johnson. Branigin "capitulated";
        Humphrey announces it at the dinner.'
      n: '[[w.chester-american-melodrama]], 156–60. Names: Humphrey, Branigin, Johnson, Robert Kennedy.'
      tags:
      - name:humphrey-hubert-h
      - name:branigin-roger-d
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
