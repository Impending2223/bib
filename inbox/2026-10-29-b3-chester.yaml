      when: May 30
      date: '1968-05-30'
      thread: robert-kennedy-campaign
      also:
      - cities-and-housing
      - elections-1968
      c: 'Robert Kennedy''s statement, "A Program for the Urban Crisis," by Edelman, nine and a half pages, not given as a
        speech: a Negro infant three times as likely as a white to die in the first year; "no program to attack the problems
        of the inner city can be constructed in the isolation of the ghetto"; private investment in low-cost housing in the
        ghettos.'
      n: '[[w.chester-american-melodrama]], 332–33. See [[cal.1968-05-28.elections-1968-3]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      src:
        c: b8f2d534
        rows:
        - 'w.chester-american-melodrama 332–33: all'
