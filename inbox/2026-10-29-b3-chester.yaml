      id: cal.1968-05-19.republican-party
      when: May 19
      date: '1968-05-19'
      thread: republican-party
      also:
      - elections-1968
      c: 'Emmet Hughes to Rockefeller, a private memorandum: "make clear ... the CHOICE that you are presenting to the Republican
        Party," that he and Nixon "stand for two profoundly different views"; Nixon''s haziness on the issues "his deliberate
        intent to blur issues between you and him"; the public word aimed at the polls, "NOT the presumed preconceptions of
        delegates."'
      n: '[[w.chester-american-melodrama]], 385–86. Names: Emmet Hughes, Rockefeller, Nixon.'
      tags:
      - name:hughes-emmet-john
      - name:rockefeller-nelson
      - name:nixon-richard-m
      src:
        c: a5670774
        rows:
        - 'w.chester-american-melodrama 385–86: all'
