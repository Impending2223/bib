      when: Mar. 11
      date: '1968-03-11'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      - vietnam
      c: Sorensen with Johnson, alone in the Oval Office, arranged by Pierson at the Gridiron dinner Mar. 9. By the Kennedy
        office's account, Johnson asks what he would do about the war, and Sorensen suggests an independent commission, to
        show the policy "would not remain unalterably fixed." By the White House's, outside advice discussed, no formal commission.
      n: '[[w.chester-american-melodrama]], 121 (both accounts). See [[cal.1968-03-14.robert-kennedy]]. Names: Sorensen, Johnson,
        Pierson.'
      tags:
      - name:sorensen-theodore-c
