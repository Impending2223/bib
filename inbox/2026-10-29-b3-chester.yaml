- add:
    entry:
      id: cal.1968-08-17.elections-1968-2
      when: Aug. 17
      date: '1968-08-17'
      thread: elections-1968
      also:
      - vietnam
      - robert-kennedy-campaign
      c: 'New York. Humphrey: he and Robert Kennedy held "remarkably similar views on Vietnam," both against forcing a coalition
        government on Saigon before negotiations. Walinsky, Mankiewicz, Schlesinger and Goodwin, to the *New York Times*:
        "false and misleading"; Kennedy for the Viet Cong''s part in the government, which Humphrey had called "putting a
        fox in a chicken coop."'
      n: '[[w.chester-american-melodrama]], 529–30. Names: Humphrey, Robert Kennedy, Walinsky, Mankiewicz, Schlesinger, Goodwin.'
      tags:
      - name:humphrey-hubert-h
      - name:kennedy-robert-f
      - name:walinsky-adam
      - name:mankiewicz-frank
      - name:schlesinger-arthur-m-jr
      - name:goodwin-richard-n
      - city:nyc
      src:
        c: '74b0a2d0'
        rows:
        - 'w.chester-american-melodrama 529–30: all'
- add:
    entry:
      id: cal.1968-08-19.elections-1968-chicago
      when: Aug. 19
      date: '1968-08-19'
      thread: elections-1968-chicago
      also:
      - vietnam
      c: 'Washington, the Statler Hilton. The platform committee''s hearings open, Boggs in the chair; Goodwin''s threat of
        a walkout brings anti-administration witnesses, McGovern, Fulbright, Gaylord Nelson, Galbraith, Sam Brown, Hilsman.
        The peace-plank group''s count: 39 or 40 of the 110 members with it. The same day, Johnson to the Veterans of Foreign
        Wars at Detroit: "It takes two to make a bargain."'
      n: '[[w.chester-american-melodrama]], 530–32. See [[cal.1968-08-01.elections-1968]]. Names: Boggs, Goodwin, McGovern,
        Fulbright, Gaylord Nelson, Galbraith, Sam Brown, Hilsman, Johnson.'
      tags:
      - name:boggs-hale
      - name:goodwin-richard-n
      - name:mcgovern-george
      - name:fulbright-j-william
      - name:nelson-gaylord-a
      - name:galbraith-john-kenneth
      - name:brown-sam
      - name:hilsman-roger
      - name:johnson-lyndon-b
      src:
        c: b884693a
        rows:
        - 'w.chester-american-melodrama 530–32: all'
- add:
    entry:
      id: cal.1968-08-20.elections-1968-chicago
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968-chicago
      also:
      - soviet-union-czechoslovakia
      - vietnam
      c: 'Washington, the platform committee, 9:27 p.m. Rusk has finished for the administration''s policy when Boggs reads
        a press dispatch: the invasion of Czechoslovakia. Rusk: "I think I ought to see what this is all about."'
      n: '[[w.chester-american-melodrama]], 532. See [[cal.1968-08-19.elections-1968-chicago]]. Names: Rusk, Boggs.'
      tags:
      - name:rusk-dean
      - name:boggs-hale
      src:
        c: '76859112'
        rows:
        - 'w.chester-american-melodrama 532: all'
- add:
    entry:
      id: cal.1968-08-21.elections-1968-chicago
      when: Aug. 21
      date: '1968-08-21'
      thread: elections-1968-chicago
      also:
      - rules
      c: 'Humphrey''s headquarters releases his letter to Governor Shapiro of Illinois, chairman of the rules committee: abolish
        the unit rule at this convention and in the call to 1972. Connally, told otherwise, feels betrayed.'
      n: '[[w.chester-american-melodrama]], 557 (Sanford''s account). Names: Humphrey, Shapiro, Connally.'
      tags:
      - name:humphrey-hubert-h
      - name:shapiro-samuel-h
      - name:connally-john
      src:
        c: '876694de'
        rows:
        - 'w.chester-american-melodrama 557: all'
- add:
    entry:
      id: cal.1968-08-24.elections-1968-chicago
      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968-chicago
      c: 'Chicago, after midnight, the Statler Hilton. Gilligan with Ginsburg and Welsh, Humphrey''s draftsmen, and Geoghegan
        of Boggs''s staff, over the peace plank, released at 10:30 the night before, clause by clause. Ginsburg: "There''s
        not ten cents of difference between this and the Vice-President''s policy." He never calls back. That evening Charles
        Murphy, Johnson''s man in Chicago, collects Ginsburg''s final draft.'
      n: '[[w.chester-american-melodrama]], 533–36. See [[cal.1968-08-23.elections-1968-chicago]]. Names: Gilligan, Ginsburg,
        Geoghegan, Boggs, Charles Murphy, Humphrey, Johnson.'
      tags:
      - name:gilligan-john-j
      - name:ginsburg-david
      - name:geoghegan-william-a
      - name:boggs-hale
      - name:murphy-charles-s
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      src:
        c: '5622d279'
        rows:
        - 'w.chester-american-melodrama 533–36: all'
