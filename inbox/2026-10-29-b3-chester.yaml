      id: cal.1968-04-02.elections-1968-2
      when: Apr. 2
      date: '1968-04-02'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Humphrey, back from Mexico City, telephones Democratic politicians all day: he cannot yet say he is running, but
        they should not commit themselves to Robert Kennedy. At the airport the night before, home without a word.'
      n: '[[w.chester-american-melodrama]], 139, 142–43. Names: Humphrey, Robert Kennedy.'
      tags:
      - name:humphrey-hubert-h
      - name:kennedy-robert-f
      src:
        c: '610030c0'
        rows:
        - 'w.chester-american-melodrama 139, 142–43: all'
