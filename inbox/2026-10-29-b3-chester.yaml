      c: 'The *New York Times*, from Humphrey''s camp''s private polls, Napolitan''s: "Democratic Leaders, Calling Polls Misleading,
        Say Humphrey Can Win." Three days before, its survey: Humphrey third in electoral votes, 28 to Wallace''s 66 and Nixon''s
        380. The same day Connell''s memorandum for reporters, "Humphrey on the Upswing, Gallup or Not!": Sindlinger''s telephone
        polls and five State polls; telegrams to the State chairmen to tell contributors.'
      n: '[[w.chester-american-melodrama]], 712–14. Names: Napolitan, Humphrey, Wallace, Nixon.'
