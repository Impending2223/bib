      when: June 20
      date: '1968-06-20'
      thread: elections-1968
      also:
      - democratic-party
      - vietnam
      c: 'Humphrey to the National Press Club: "Hubert Humphrey as Vice-President is a member of the team. Hubert Humphrey
        as President is captain of a team—there''s a lot of difference."'
      n: '[[w.chester-american-melodrama]], 404–5. Names: Humphrey.'
