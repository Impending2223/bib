- add:
    entry:
      id: cal.1968-05-19.elections-1968
      when: May 19
      date: '1968-05-19'
      thread: elections-1968
      also:
      - republican-party
      c: 'New Orleans, the Roosevelt Hotel, Sunday. Reagan at dinner with the Southern Republican State chairmen, twenty-six
        with their guests, in his suite: the mood "come on in or forget it"; Reagan, still disclaiming, lackluster. The next
        morning Rockefeller, in the same hotel, at breakfast with them: stay uncommitted.'
      n: '[[w.chester-american-melodrama]], 444–46 (Dent''s account among others). See [[cal.1968-05-31.elections-1968]].
        Names: Reagan, Rockefeller, Dent.'
      tags:
      - name:reagan-ronald
      - name:rockefeller-nelson
      - name:dent-harry-s
      - state:la
      src:
        c: b6ec0fc8
        rows:
        - 'w.chester-american-melodrama 444–46: all'
- add:
    entry:
      id: cal.1968-07-31.elections-1968-miami
      when: July 31
      date: '1968-07-31'
      thread: elections-1968-miami
      also:
      - republican-party
      c: 'Miami Beach, the Fontainebleau''s La Ronde Room. Reagan, the first of the contenders to arrive, before the Platform
        Committee: "We must reject the idea that every time the law is broken, society is guilty rather than the law-breaker";
        to the universities'' dissidents, "Obey the rules or get out"; "we are in Vietnam because it is in our national interest
        to be there."'
      n: '[[w.chester-american-melodrama]], 448–49. Names: Reagan.'
      tags:
      - name:reagan-ronald
      src:
        c: f1861f2b
        rows:
        - 'w.chester-american-melodrama 448–49: all'
- add:
    entry:
      id: cal.1968-08-03.elections-1968-miami
      when: Aug. 3
      date: '1968-08-03'
      thread: elections-1968-miami
      also:
      - republican-party
      c: 'Miami Beach. The *New York Times*, from Leonard Hall, Rockefeller''s floor manager: "Rockefeller Aides Fear Reagan
        Is Gaining Rapidly," up to 300 votes for Reagan on the first ballot. That night, Reagan back in Miami Beach, on television:
        "It''s very difficult to disagree with most of the things that Mr. Wallace is saying."'
      n: '[[w.chester-american-melodrama]], 449, 454–55. Names: Hall, Rockefeller, Reagan, Wallace.'
      tags:
      - name:hall-leonard-w
      - name:rockefeller-nelson
      - name:reagan-ronald
      - name:wallace-george-c
      src:
        c: f0d04c19
        rows:
        - 'w.chester-american-melodrama 454–55: A'
        - 'w.chester-american-melodrama 449: B'
- add:
    entry:
      id: cal.1968-08-04.elections-1968-miami
      when: Aug. 4
      date: '1968-08-04'
      thread: elections-1968-miami
      also:
      - republican-party
      c: 'Miami Beach, Sunday. Southern party leaders with Mitchell, at their asking, on the Vice Presidency: Nixon will not
        split the ticket, which they take to exclude a divisive liberal. Reagan with the delegations of Alabama, Georgia,
        Mississippi, Montana, Utah and Wyoming; Utah decides for Romney on the first ballot.'
      n: '[[w.chester-american-melodrama]], 449, 458. Names: Mitchell, Nixon, Reagan, Romney.'
      tags:
      - name:mitchell-john-n
      - name:nixon-richard-m
      - name:reagan-ronald
      - name:romney-george-w
      src:
        c: f08b441a
        rows:
        - 'w.chester-american-melodrama 458: A'
        - 'w.chester-american-melodrama 449: B'
- add:
    entry:
      id: cal.1968-08-06.elections-1968-miami-2
      when: Aug. 6
      date: '1968-08-06'
      thread: elections-1968-miami
      also:
      - republican-party
      - desegregation-schools
      - vietnam
      c: 'Miami Beach, the Hilton Plaza, the morning. Nixon with the Southern delegations, coffee and buns, in two groups,
        the talk shaped by Dent and Thurmond the night before; the second, Florida, the Carolinas, Kentucky, Virginia, Tennessee,
        the District and Arkansas, taped by a Florida delegate for the *Miami Herald*. "I am not going to take ... anybody
        that is going to divide this party." Busing a child "into a strange community ... I think you destroy that child";
        no court "qualified to be a local school district." Open housing: he backed the act to get it "out of our sight" before
        the convention. Vietnam: Eisenhower and Korea; "we''ve got the cards."'
      n: '[[w.chester-american-melodrama]], 461–64. Made public: the *Miami Herald*''s transcript (Check the day). Names:
        Nixon, Dent, Thurmond, Eisenhower.'
      tags:
      - name:nixon-richard-m
      - name:dent-harry-s
      - name:thurmond-strom
      - name:eisenhower-dwight-d
      src:
        c: '43a089d3'
        rows:
        - 'w.chester-american-melodrama 461–64: all'
- add:
    entry:
      id: cal.1968-08-06.elections-1968-miami-3
      when: Aug. 6
      date: '1968-08-06'
      thread: elections-1968-miami
      also:
      - republican-party
      c: 'Miami Beach, the Versailles Hotel. Reagan with Thurmond, before the South Carolina delegation, then alone upstairs,
        forty-five minutes: Thurmond''s admiration, but it is not Reagan''s year; Nixon acceptable, "Nobody''s ever been able
        to pin any fraud on him." Reagan by telephone to Clarke Reed of Mississippi: "release your delegates." Goldwater,
        for Nixon, among the delegations: Reagan a wonderful Vice President; Reagan''s telegrams to the delegations: not so.'
      n: '[[w.chester-american-melodrama]], 465–66. Names: Reagan, Thurmond, Goldwater, Nixon.'
      tags:
      - name:reagan-ronald
      - name:thurmond-strom
      - name:goldwater-barry-m
      - name:nixon-richard-m
      src:
        c: d966e301
        rows:
        - 'w.chester-american-melodrama 465–66: all'
- add:
    entry:
      id: cal.1968-08-08.elections-1968-miami-2
      when: Aug. 8
      date: '1968-08-08'
      thread: elections-1968-miami
      also:
      - republican-party
      c: 'Miami Beach, from 2:15 a.m., the night after the nomination. Nixon''s meetings on a running mate: twenty-four in
        his penthouse, "I have brought no names to Miami"; at 2:45 a.m., twenty-two, Thurmond, Dent, Goldwater, Nunn, Brock,
        Fannin, John Rhodes, James Rhodes, Jack Miller, Brownell, Finch, Billy Graham, Rumsfeld; Thurmond for Reagan, then
        Baker, Volpe and Agnew acceptable; James Rhodes: "With Reagan on the ticket, we''d lose Ohio." At 9 a.m., the Jackie
        of Hearts Room: Bliss, Dirksen, Ford, Murphy, Bob Wilson, Rogers Morton, Tower, O''Donnell; Wilson and Ford for Lindsay,
        Tower for Reagan. Then Mitchell, Haldeman, Ellsworth, Morton, Tower and Finch: "you three ... or Ted Agnew." Tower,
        at Nixon''s asking, to Thurmond: Volpe or Agnew? Morton calls Agnew; at 12:40 p.m. Nixon names him.'
      n: '[[w.chester-american-melodrama]], 484–90 (the names Nixon''s staff released; Sears: Agnew decided ten days before).
        See [[cal.1968-08-08.elections-1968-miami]]. Names: Nixon, Thurmond, Dent, Goldwater, Nunn, Brock, Fannin, John J.
        Rhodes, James A. Rhodes, Jack Miller, Brownell, Finch, Graham, Rumsfeld, Baker, Volpe, Agnew, Bliss, Dirksen, Ford,
        Murphy, Bob Wilson, Rogers Morton, Tower, Peter O''Donnell, Lindsay, Reagan, Mitchell, Haldeman, Ellsworth, Sears.'
      tags:
