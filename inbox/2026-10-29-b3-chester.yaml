      when: Oct. 1
      date: '1968-10-01'
      thread: elections-1968
      c: The day after Salt Lake City. McCarthy, who calls Humphrey's new position no move at all, has Eller telephone Hill,
        from his notes on the back of Hill's letter, the conditions on which Humphrey could earn his endorsement.
      n: '[[w.chester-american-melodrama]], 742. See [[cal.1968-09-30.elections-1968]]. Names: McCarthy, Humphrey.'
