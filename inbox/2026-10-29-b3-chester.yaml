      when: June 17
      date: '1968-06-17'
      thread: elections-1968
      also:
      - electoral-college
      c: 'Wallace on ABC''s *Issues and Answers*: he is working for "a coalition government." Two weeks later, on NBC''s *Today*:
        he will win because one of the other candidates will "throw his votes to me in the electoral college."'
      n: '[[w.chester-american-melodrama]], 658. Names: Wallace.'
      tags:
      - name:wallace-george-c
