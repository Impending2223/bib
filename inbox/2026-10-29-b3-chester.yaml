      when: Mar. 10
      date: '1968-03-10'
      thread: republican-party
      also:
      - elections-1968
      c: 'New York. Rockefeller''s supporters gathered to test the wind: seven governors, Agnew, Winthrop Rockefeller, Shafer,
        LeVander, Chafee, Love and McCall, Boe sending a man; three Senators, half a dozen Representatives, Lindsay. No one
        from the big Midwestern States, the South or the party''s leaders in Congress.'
      n: '[[w.chester-american-melodrama]], 221. Names: Rockefeller, Agnew, Winthrop Rockefeller, Shafer, LeVander, Chafee,
        John A. Love, McCall, Boe, Lindsay.'
