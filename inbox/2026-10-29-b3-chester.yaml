      when: Mar. 26–29
      date: '1968-03-26'
      thread: elections-1968
      also:
      - democratic-party
      c: Wisconsin. O'Brien, sent out to look at Johnson's campaign, Tuesday to Friday, Mar. 29; back, he tells Johnson "it
        didn't look good." The campaign's professionals, Staebler, Birkhead and Burkhardt with Asplin, on the telephone each
        night to Rowe or Watson with bad news.
      n: '[[w.chester-american-melodrama]], 8, 137. Names: O''Brien, Johnson, Staebler, Rowe, Watson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
