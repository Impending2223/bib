      when: June 7
      date: '1968-06-07'
      thread: elections-1968
      c: 'Wallace''s first tour after his wife''s death, eleven days, in the South: chiefly to raise money. In Atlanta the
        auditorium half empty, twenty-seven Secret Service men; "Dixie" sung.'
      n: '[[w.chester-american-melodrama]], 290. See [[cal.1968-05-07.alabama-al]]. Names: Wallace.'
