      when: May 30
      date: '1968-05-30'
      thread: republican-party
      also:
      - elections-1968
      c: 'New York, 22 West Fifty-fifth Street. Jack Tinker and Partners, Rockefeller''s agency since May 1, Losee in charge
        under Emmet Hughes and Alton Marshall, presents its media plan and a twenty-nine-page strategy paper: "The American
        crisis ... is a failure of leadership." The budget, $4.5 million: television spots $2 million, network television
        $1 million, newspapers $1.5 million; the advertising from mid-June, to peak at Gallup''s last interviews before Miami
        Beach. "The whole strategy of our campaign was to influence the polls."'
      n: '[[w.chester-american-melodrama]], 383–87. Names: Emmet Hughes, Rockefeller.'
      tags:
      - name:hughes-emmet-john
      - name:rockefeller-nelson
      src:
        c: cdc42016
        rows:
        - 'w.chester-american-melodrama 383–87: all'
