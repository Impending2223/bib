      when: Mar. 25
      date: '1968-03-25'
      thread: elections-1968
      c: 'Wisconsin, McCarthy''s campaign. A meeting of forty of the staff on the Milwaukee ghetto, where Gans, managing the
        State, makes no special effort. A senior man: "We need those Polish votes to get Milwaukee." Shouts of "White racist!";
        Hersh, the press officer, and his assistant, Mary Lou Oates, resign.'
      n: '[[w.chester-american-melodrama]], 135–36. Names: Gans, Hersh, McCarthy.'
      tags:
      - name:gans-curtis
      - name:hersh-seymour
      - name:mccarthy-eugene-j
