      id: cal.1968-08-04.elections-1968
      when: Aug. 4
      date: '1968-08-04'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Chicago, a motel at O''Hare Airport, secret. McGovern with many of those at the Huron dinner and other liberal Democrats;
        he seems eager to run. Harold Hughes: "I love you, George, but you can''t do anything for me!" McGovern to the Black
        Hills with his family to decide.'
      n: '[[w.chester-american-melodrama]], 415. See [[cal.1968-07-13.elections-1968]]. Names: McGovern, Harold Hughes.'
      tags:
      - name:mcgovern-george
      - name:hughes-harold-e
      - city:chicago
      - state:il
      src:
        c: e6168a72
        rows:
        - 'w.chester-american-melodrama 415: all'
- add:
    entry:
