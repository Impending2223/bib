      when: June 26
      date: '1968-06-26'
      thread: elections-1968-state-conventions
      c: 'New York. Duffey, who led McCarthy''s people out of Connecticut''s convention, with McCarthy: McCarthy wants the
        nine delegates Bailey offered. Duffey writes Bailey and tells the press he will take them, reserving the right to
        protest.'
      n: '[[w.chester-american-melodrama]], 400. See [[cal.1968-06-22.elections-1968-state-conventions]]. Names: McCarthy.'
