      - elections-1968
      c: 'The Machinists'' election guide, against Wallace: "Wallace''s Alabama is a low-wage, right-to-work state. ... How
        sympathetic could you expect him to be to demands for higher wages?" The UAW''s "Wallace desk" at Solidarity House,
