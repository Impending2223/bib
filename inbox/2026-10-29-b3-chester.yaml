      date: '1968-06-18'
      thread: elections-1968-state-conventions
      also:
      - elections-1968
      c: 'New York''s Democratic primary for delegates to Chicago, by district: of 123 chosen, 63 for McCarthy, 30 pledged
        to Robert Kennedy, 19 uncommitted, 11 for Humphrey. Humphrey had not campaigned in the State.'
      n: '[[w.chester-american-melodrama]], 403, 405. Check: the figures, against the State''s returns. See [[cal.1968-06-28.elections-1968-state-conventions]].
        Names: McCarthy, Robert Kennedy, Humphrey.'
      tags:
      - name:mccarthy-eugene-j
