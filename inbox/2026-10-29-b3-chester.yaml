      when: Sept. 16
      date: '1968-09-16'
      thread: elections-1968
      c: Dallas. The American Independent Party's convention names Wallace, a formality, no running mate. A $1,000-a-plate
        lunch for him brings in at least $50,000, a $25 supper at least $30,000 more.
      n: '[[w.chester-american-melodrama]], 607, 666. Names: Wallace.'
      tags:
