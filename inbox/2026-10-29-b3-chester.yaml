      when: Aug. 25
      date: '1968-08-25'
      thread: elections-1968-chicago
      also:
      - vietnam
      c: 'Chicago, Sunday evening. Charles Murphy with Boggs, Ginsburg and Welsh: Ginsburg''s plank, "Stop the bombing of
        North Vietnam," unacceptable to Johnson. The President''s words: "Stop all bombing of North Vietnam when this action
        would not endanger the lives of our troops in the field; this action should take into account the response from Hanoi."'
      n: '[[w.chester-american-melodrama]], 536. See [[cal.1968-08-24.elections-1968-chicago]]. Names: Charles Murphy, Boggs,
        Ginsburg, Johnson.'
      tags:
      - name:murphy-charles-s
      - name:boggs-hale
      - name:ginsburg-david
      - name:johnson-lyndon-b
      src:
        c: '9443b573'
        rows:
        - 'w.chester-american-melodrama 536: all'
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-2
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - vietnam
      c: 'Chicago, the drafting committee''s last session, the morning: Boggs''s plank not open to amendment; fifteen minutes.
        The platform committee: 65 for the majority plank, 35 for the peace plank. The planks released that evening.'
      n: '[[w.chester-american-melodrama]], 536–37. See [[cal.1968-08-25.elections-1968-chicago-2]]. Names: Boggs.'
      tags:
      - name:boggs-hale
      src:
        c: '48dd6d7b'
        rows:
        - 'w.chester-american-melodrama 536–37: all'
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-3
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - jobs-and-wages
      c: 'Chicago. Meany at lunch with 350 union delegates and alternates: stay in line for Humphrey. A Labor for McCarthy
        lunch, Schrade''s, in answer.'
      n: '[[w.chester-american-melodrama]], 542. Names: Meany, Humphrey, McCarthy.'
      tags:
      - name:meany-george
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      src:
        c: '5fad0be3'
        rows:
        - 'w.chester-american-melodrama 542: all'
- add:
    entry:
      id: cal.1968-08-27.elections-1968
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968
      also:
      - elections-1968-chicago
      c: 'Chicago, the Conrad Hilton, about 4:30 p.m. Stephen Smith with McCarthy in Goodwin''s room: McCarthy''s delegates
        for Edward Kennedy? The accounts differ, Goodwin''s and Smith''s. At 8:30 p.m. CBS reports Smith asked McCarthy''s
        support; Smith, angry, presses Goodwin to deny it. Edward Kennedy had told DiSalle by telephone and telegram not to
        put his name in nomination.'
      n: '[[w.chester-american-melodrama]], 571–75 (Goodwin''s account in *Look*, Smith''s by Peter Maas in *New York*). Names:
        Stephen Smith, McCarthy, Goodwin, Edward Kennedy, DiSalle.'
      tags:
      - name:smith-stephen-e
      - name:mccarthy-eugene-j
      - name:goodwin-richard-n
      - name:kennedy-edward-m
      - name:disalle-michael-v
      src:
        c: ebb62a94
        rows:
        - 'w.chester-american-melodrama 571–75: all'
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-3
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      c: Chicago, the LaSalle's Grand Ballroom, the morning. Humphrey, McGovern and McCarthy before the California delegation;
        McCarthy's first thrust at McGovern.
      n: '[[w.chester-american-melodrama]], 560–61. Names: Humphrey, McGovern, McCarthy.'
      tags:
      - name:humphrey-hubert-h
      - name:mcgovern-george
      - name:mccarthy-eugene-j
