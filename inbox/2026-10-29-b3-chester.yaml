      date: '1968-07'
      thread: electoral-college
      also:
      - elections-1968
      - republican-party-congress
      c: 'After Orfield''s "A Proposal for Outfoxing Wallace" in the *Washington Post*, July 7: Goodell (R-N.Y.) and Udall
        (D-Ariz.) gather signatures to a bipartisan compact, candidates for the House to vote for the presidential candidate
        with a plurality of the popular vote. July 23, the *Post*: the plan informally endorsed by Nixon and Humphrey, several
        Senators and at least fifty Representatives. Wallace, by wire: "a conspiracy to circumvent the Constitution."'
      n: '[[w.chester-american-melodrama]], 655. Check: the days. Names: Goodell, Morris Udall, Nixon, Humphrey, Wallace.'
      tags:
      - name:goodell-charles-e
