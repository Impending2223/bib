      when: Oct. 8
      date: '1968-10-08'
      thread: elections-1968
      c: 'McCarthy, asked of the conditions: "I never drew up a list, and if I had, the demands would not be four but probably
        two and a half." That night, at a fund-raising dinner for O''Dwyer, the four conditions, Humphrey unnamed. Humphrey:
        "not prone to meeting conditions."'
      n: '[[w.chester-american-melodrama]], 744. See [[cal.1968-10-05.democratic-party]]. Names: McCarthy, O''Dwyer, Humphrey.'
