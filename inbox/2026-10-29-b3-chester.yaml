      c: 'Humphrey with the staff of the *New York Times*, two hours: "I have never been told what to say by the President.
        I have never cleared a speech with the White House"; of the talks in Paris, "I suggest that we talk."'
      n: '[[w.chester-american-melodrama]], 421. Names: Humphrey, Johnson.'
