      id: cal.1968-04-10.elections-1968-state-conventions
      when: Apr. 10
      date: '1968-04-10'
      thread: elections-1968-state-conventions
      c: 'Connecticut. Democratic primaries in thirty-one of the larger towns, on petitions McCarthy''s people filed, for
        delegates to the State convention: rather more than 44 percent of those voting for McCarthy. Of the convention''s
        958 delegates, McCarthy''s 284.'
      n: '[[w.chester-american-melodrama]], 395, 397–98. See [[cal.1968-02-17.elections-1968]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:ct
      src:
        c: '8af6e7bd'
        rows:
        - 'w.chester-american-melodrama 395, 397–98: all'
