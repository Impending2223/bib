      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: Sacramento. Unruh and Robert Kennedy's partisans file his slate of delegates for California's primary of June 4.
      n: '[[w.chester-american-melodrama]], 127. Names: Unruh, Robert Kennedy.'
      tags:
      - name:unruh-jesse-m
