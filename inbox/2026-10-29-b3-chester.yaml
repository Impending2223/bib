- add:
    entry:
      id: cal.1968-07-25.elections-1968-2
      when: July 25
      date: '1968-07-25'
      thread: elections-1968
      also:
      - vietnam
      c: 'Humphrey''s offices in the Executive Office Building, from 10 a.m.: a dozen professors with Reilly, Welsh, Van Dyk,
        Orville Freeman, Stewart and Ginsburg rework Reilly''s draft statement on Vietnam, a halt in the bombing in it, from
        Huntington''s task force''s white paper. Humphrey joins them in the afternoon: show it to Johnson, or to Rusk and
        the State Department without him.'
      n: '[[w.chester-american-melodrama]], 422. Names: Van Dyk, Orville Freeman, Ginsburg, Huntington, Humphrey, Johnson,
        Rusk.'
      tags:
      - name:van-dyk-ted
      - name:freeman-orville-l
      - name:ginsburg-david
      - name:huntington-samuel
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
