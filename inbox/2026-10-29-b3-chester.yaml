- add:
    entry:
      id: cal.1968-04-16.elections-1968-2
      when: Apr. 16
      date: '1968-04-16'
      thread: elections-1968
      also:
      - republican-party
      c: 'Los Angeles. F. Clifton White, back from his soundings for Reagan, to the California delegation behind closed doors:
        much feeling for the Governor in the country, citizens-for-Reagan committees in Minnesota, Kansas, Colorado and Idaho,
        the South sympathetic. The *Los Angeles Times*''s State Poll the same day, California''s Republicans: Nixon 54 percent,
        Rockefeller 35, Reagan 8. Apr. 17, Reagan to the press: "It''s a free country. They know my feelings, and there''s
        not much I can do about it."'
      n: '[[w.chester-american-melodrama]], 202–3. Names: F. Clifton White, Reagan, Nixon, Rockefeller.'
      tags:
      - name:white-f-clifton
      - name:reagan-ronald
