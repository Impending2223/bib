      when: Aug. 17
      date: '1968-08-17'
      thread: elections-1968
      also:
      - georgia
      c: Maddox, governor of Georgia, declares himself a candidate for the Democratic nomination, against "socialist decay
        in the land."
      n: '[[w.chester-american-melodrama]], 556. Names: Maddox.'
      tags:
      - name:maddox-lester
      - state:ga
      src:
        c: '1db59203'
