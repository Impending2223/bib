      when: Aug. 9
      date: '1968-08-09'
      thread: elections-1968
      also:
      - vietnam
      c: The LBJ Ranch. Humphrey brings Johnson his tenth draft of the statement on Vietnam; Johnson, unruffled, as good as
        says he could not have done better himself. The draft much weakened.
      n: '[[w.chester-american-melodrama]], 423 (by one who saw the draft). See [[cal.1968-07-25.elections-1968]]. Names:
        Humphrey, Johnson.'
