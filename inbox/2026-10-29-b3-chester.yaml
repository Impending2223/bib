      when: Feb. 17
      date: '1968-02-17'
      thread: elections-1968
      also:
      - democratic-party
      c: Connecticut. McCarthy's first appearance in the State, a rally at Westport, some 2,500, the night of Bailey's fund-raising
        dinner at Hartford, some 1,800.
      n: '[[w.chester-american-melodrama]], 397. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:ct
      src:
        c: '54bafee2'
        rows:
        - 'w.chester-american-melodrama 397: all'
