      date: '1968-09'
      thread: elections-1968
      c: 'Early in the month, Washington, the Sheraton, secret. Hersh''s meeting on a fourth party for McCarthy, Goodwin,
        Walinsky, Lucey and Raskin with his studies there. McCarthy: "I guess we could win New York, California, Oregon, Minnesota,
        and maybe even Wisconsin." His decision: his name off the ballot in every State but California, there only if his
        supporters get the 330,000 signatures by midnight, Sept. 20.'
