      c: 'Hyannis Port, on television, on his parents'' lawn beside his mother and father. Edward Kennedy thanks the country
        for its sympathy: "Each of us will have to decide, in a private way, in our own hearts, in our own consciences, what
        we will do in the course of this summer and in future summers."'
