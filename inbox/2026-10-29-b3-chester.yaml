      when: May 22
      date: '1968-05-22'
      thread: elections-1968
      c: 'San Francisco, the Cow Palace. McCarthy, after his remark on supporting Humphrey, a speech by Gorman: the war grown
        out of a systematic delusion about America''s role in the world, John Kennedy, Robert Kennedy and Humphrey its champions;
        "the time had come to divide the party if it was not already divided"; Freckles, Kennedy''s dog; no deals with other
        candidates.'
      n: '[[w.chester-american-melodrama]], 301–4. Given again at the Portland Coliseum, May 27 (304). See [[cal.1968-05-21.elections-1968]].
        Names: McCarthy, Humphrey, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
