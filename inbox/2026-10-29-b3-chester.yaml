      when: Nov.
      date: '1967-11'
      thread: elections-1968
      also:
      - republican-party
      c: 'Thomas Reed, for Reagan''s undeclared campaign, assembles a film unit, Snazelle and Mercer of San Francisco: films
        of Reagan for the primaries, "Ronald Reagan: Citizen Governor" ready by March 1968.'
      n: '[[w.chester-american-melodrama]], 204–6. Names: Reed, Reagan.'
      tags:
      - name:reed-thomas-c
      - name:reagan-ronald
      - state:ca
      src:
