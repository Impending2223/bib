    entry:
      id: cal.1968-04-03.elections-1968-3
      when: Apr. 3
      date: '1968-04-03'
      thread: elections-1968
      c: 'McCarthy''s campaign telephones, for the first and only time: for six or seven hours Goodwin and Gans call Democratic
        leaders, Pat Brown and Anne Alanson in California, Midwestern governors, Eastern mayors.'
      n: '[[w.chester-american-melodrama]], 139. Names: Goodwin, Gans, Brown, McCarthy.'
      tags:
      - name:goodwin-richard-n
      - name:gans-curtis
