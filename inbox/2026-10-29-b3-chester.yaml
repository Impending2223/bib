      date: '1968-05-21'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'San Francisco, after a speech at the Press Club, a week before Oregon''s primary. Robert Kennedy: "I think that
        if I get beaten in any primary, I am not a very viable candidate."'
      n: '[[w.chester-american-melodrama]], 300. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
