      when: July 26
      date: '1968-07-26'
      thread: elections-1968
      c: Providence, R.I. Wallace in the State the day his five hundred petition signatures are gathered; a telephone interview
        with all comers on local television. By the end of July he is on the ballot in thirty-nine States.
      n: '[[w.chester-american-melodrama]], 291–92. Names: Wallace.'
      tags:
      - name:wallace-george-c
