      c: 'Chicago, the afternoon. McCarthy to his staff and supporters: go on presenting the issues until November; the protest
        cannot be ignored. Not yet endorsing Humphrey; a fourth party he "might" support if it drew a large following, but
        would not lead. "If you people keep on this way, I may—as we say—lose my cool."'
      n: '[[w.chester-american-melodrama]], 587. Names: McCarthy, Humphrey.'
