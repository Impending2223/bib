      date: '1968-04-03'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Connecticut. McCarthy, to cheering crowds, on Bailey, the State chairman and national chairman: "you only need a
        strong organization when you don''t have people who can make independent judgments. ... I think Mr. Bailey is like
        the Wizard of Oz. When you pull the curtain back, there is only a voice."'
      n: '[[w.chester-american-melodrama]], 395. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:ct
      src:
        c: fa7f38cc
        rows:
        - 'w.chester-american-melodrama 395: all'
