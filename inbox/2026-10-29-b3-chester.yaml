      date: '1967-10-29'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Salem, Ore., the YWCA. The first formal meeting of Oregon''s Democrats against the war, convened by Howard Morgan,
        once the State chairman, and Blaine Whipple: seventy-five of the eighty asked. Robert Kennedy dropped, for supporting
        Johnson''s stand on the war; McCarthy to be invited into the primary, a delegation of three sent to him in Washington.'
      n: '[[w.chester-american-melodrama]], 298 (Whipple''s account). Names: Howard Morgan, Whipple, Robert Kennedy, McCarthy,
        Johnson.'
