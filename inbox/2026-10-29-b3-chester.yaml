      when: Aug. 30
      date: '1968-08-30'
      thread: elections-1968
      c: 'Louisville. Wallace with A. B. Chandler, governor of Kentucky and baseball commissioner, several hours in a motel:
        Chandler to be his running mate, the choice to be announced at Washington, Sept. 10.'
      n: '[[w.chester-american-melodrama]], 697. Names: Wallace, Chandler.'
      tags:
