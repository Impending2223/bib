        - 'w.chester-american-melodrama 221: all'
- add:
    entry:
      id: cal.1968-03-19.republican-party-congress
      when: Mar. 19
      date: '1968-03-19'
      thread: republican-party-congress
      also:
      - elections-1968
      c: 'Washington, the morning. Rockefeller with sixteen or seventeen Republican Senators, Morton and Hugh Scott his hosts.
        No enthusiasm; Fong: let him spend his money on a campaign, it would publicize the party and help elect Nixon. On
        his jet back to New York that night, Rockefeller decides it is hopeless.'
      n: '[[w.chester-american-melodrama]], 221–22. See [[cal.1968-03-18.republican-party]]. Names: Rockefeller, Thruston
        Morton, Hugh Scott, Fong, Nixon.'
