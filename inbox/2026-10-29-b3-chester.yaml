      when: May 28
      date: '1968-05-28'
      thread: elections-1968
      also:
      - cities-and-housing
      c: 'Davis, Cal., the University of California. McCarthy on the cities, Larner''s speech: the ghettos "treated as colonial
        people"; federal money on a great scale to break up the ghetto and redesign the metropolitan pattern, not to improve
        the ghetto, Kennedy''s way; Humphrey''s "politics of happiness."'
      n: '[[w.chester-american-melodrama]], 330–32. Names: McCarthy, Larner, Robert Kennedy, Humphrey.'
      tags:
      - name:mccarthy-eugene-j
      - name:larner-jeremy
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:ca
      src:
        c: '4e31b48e'
        rows:
        - 'w.chester-american-melodrama 330–32: all'
