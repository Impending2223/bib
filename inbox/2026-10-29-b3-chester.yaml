      when: June
      date: '1967-06'
      thread: elections-1968
      also:
      - republican-party
      c: 'West Yellowstone, Mont., the Western Governors'' Conference. Reagan in private conference with F. Clifton White
        and other old Goldwater hands. Broder, in the *Washington Post* the next day: a Reagan organization coming, White
        its head. Denied by all.'
      n: '[[w.chester-american-melodrama]], 198. Check: the day. Names: Reagan, F. Clifton White, Broder.'
      tags:
      - name:reagan-ronald
      - name:white-f-clifton
      - name:broder-david-s
