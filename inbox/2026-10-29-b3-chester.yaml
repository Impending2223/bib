      when: Oct. 5–6
      date: '1968-10-05'
      thread: democratic-party
      also:
      - elections-1968
      c: 'Minneapolis, the Dyckman Hotel. The New Democratic Coalition''s first meeting, some two hundred leaders of the Kennedy,
        McGovern and McCarthy movements from forty States, Hill, Peterson and Lowenstein among them: no endorsement to be
        discussed. Eller to Hill: the Senator does not object to his revealing their exchange. Hill gives McCarthy''s four
        conditions to Walters of the *Washington Star* and Shellum of the *Minneapolis Tribune*: an immediate halt to the
        bombing; elections in Vietnam with the NLF; the draft laws reformed; the party reformed.'
      n: '[[w.chester-american-melodrama]], 742–43. See [[cal.1968-10-01.elections-1968-2]]. Names: Lowenstein, McCarthy,
        Humphrey.'
