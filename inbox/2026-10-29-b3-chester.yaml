      date: '1968-03-19'
      thread: democratic-party
      also:
      - elections-1968
      - robert-kennedy-campaign
      c: 'Chicago. Daley, three days after Robert Kennedy''s announcement: Johnson cannot be beaten. Before it, three telephone
        calls from Robert Kennedy and one from Edward Kennedy.'
