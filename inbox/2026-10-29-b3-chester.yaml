      when: Mar. 18
      date: '1968-03-18'
      thread: republican-party
      also:
      - elections-1968
      c: 'Washington, Rockefeller''s house on Foxhall Road. Rockefeller at dinner with Thruston Morton: Morton to manage his
        campaign, if he makes one, to the convention. Earlier, Hughes''s draft of a statement not to run; Hinman with Free''s
        poll in Oregon, Rockefeller down twelve points and Nixon up eight. The day before, a delegation from Oregon at 812
        Fifth Avenue to urge him to run.'
      n: '[[w.chester-american-melodrama]], 221. Names: Rockefeller, Thruston Morton, Emmet Hughes, Hinman, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:morton-thruston-b
