      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968-chicago
      also:
      - elections-1968
      c: 'Chicago, Saturday evening. Goodwin, for McCarthy, two hours with Connally, angry at Humphrey over the unit rule;
        Goodwin then bets McCarthy will be nominated. McCarthy, told, is displeased. Sunday, Humphrey''s men mollify Connally;
        before the convention opens, Humphrey to him: a "bureaucratic mix-up."'
      n: '[[w.chester-american-melodrama]], 557–58. See [[cal.1968-08-21.elections-1968-chicago]]. Names: Goodwin, McCarthy,
        Connally, Humphrey.'
      tags:
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - name:connally-john
      - name:humphrey-hubert-h
      src:
        c: '0e031d0e'
        rows:
        - 'w.chester-american-melodrama 557–58: all'
- add:
    entry:
      id: cal.1968-08-24.elections-1968-2
      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968
      also:
      - elections-1968-chicago
      c: 'Daley by telephone to Edward Kennedy at Hyannis Port, Saturday: Humphrey in trouble; Kennedy should be a candidate,
        come to Chicago, or say he would accept a draft. Kennedy: none of these; Stephen Smith, a New York delegate, will
        be in touch. Smith had seen Daley in Chicago the day before.'
      n: '[[w.chester-american-melodrama]], 569, 575 (Smith''s account). Names: Daley, Edward Kennedy, Stephen Smith, Humphrey.'
      tags:
      - name:daley-richard-j
      - name:kennedy-edward-m
      - name:smith-stephen-e
      - name:humphrey-hubert-h
      src:
        c: be01ca1f
        rows:
        - 'w.chester-american-melodrama 569, 575: all'
- add:
    entry:
      id: cal.1968-08-25.elections-1968
      when: Aug. 25
      date: '1968-08-25'
      thread: elections-1968
      also:
      - elections-1968-chicago
      c: 'Chicago, Sunday. Unruh at breakfast with Daley at the Sherman House: Humphrey not a winner, "Let''s get another
        candidate." Smith at the Standard Club from noon, Daley holding Illinois''s choice forty-eight hours; Smith telephoning
        delegations all afternoon and evening. DiSalle sets up a Draft Kennedy office at the Sherman House. Goodwin to Smith
        that night: McCarthy will consider stepping down for Kennedy. "Are you prepared to turn down the Presidency of the
        United States?"'
      n: '[[w.chester-american-melodrama]], 569–70. See [[cal.1968-08-24.elections-1968-2]]. Names: Unruh, Daley, Stephen
        Smith, DiSalle, Goodwin, McCarthy, Edward Kennedy, Humphrey.'
      tags:
      - name:unruh-jesse-m
      - name:daley-richard-j
      - name:smith-stephen-e
      - name:disalle-michael-v
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - name:kennedy-edward-m
      - name:humphrey-hubert-h
      src:
        c: e3357fb5
        rows:
        - 'w.chester-american-melodrama 569–70: all'
