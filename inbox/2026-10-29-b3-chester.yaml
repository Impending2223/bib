      when: Oct. 1
      date: '1968-10-01'
      thread: elections-1968
      c: 'Wallace leaves Chicago for Grand Rapids, Mich., then Kalamazoo, Lansing and Flint: he claims the whole South and
        the border States, 170 electoral votes.'
