      when: Mar. 5–6
      date: '1968-03-05'
      thread: elections-1968
      c: 'California, the night of Mar. 5, McCarthy''s petition parties, some five hundred, Jo Sedida''s idea: at midnight,
        the first hour of the season for signatures, the guests turn canvassers; by 6 a.m., 33,000 signatures, 13,851 required.
        McCarthy first on the ballot.'
      n: '[[w.chester-american-melodrama]], 328. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:ca
      src:
