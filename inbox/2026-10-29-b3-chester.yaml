      date: '1968-04-04'
      thread: elections-1968
      also:
      - georgia
      c: 'Atlanta, the Henry Grady Hotel. The American Independent Party''s convention for Wallace in Georgia, called by Roy
        Harris with Marvin Griffin, Peter Zack Geer and other former officeholders, the party''s charter filed with the secretary
        of state: some six thousand come. Fifty thousand petitions printed and circulated; 210,000 signatures, 100,000 required.'
      n: '[[w.chester-american-melodrama]], 287–88. Names: Griffin, Wallace.'
      tags:
      - name:griffin-marvin
