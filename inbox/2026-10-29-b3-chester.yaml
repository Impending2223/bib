      date: '1968-09-09'
      thread: elections-1968
      c: 'Three of Wallace''s aides, Trammell among them, call on Chandler, after a Kentucky elector''s resignation in protest
        against Chandler "an integrationist": Chandler asked to disown his record on race, and refuses. "A retreat on that?
        ... Chaos in this country." The choice dropped.'
      n: '[[w.chester-american-melodrama]], 697. See [[cal.1968-08-30.elections-1968]]. Names: Chandler, Wallace.'
      tags:
      - name:chandler-a-b
