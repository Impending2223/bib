      when: July 13
      date: '1968-07-13'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Huron, S.D., a memorial dinner for Robert Kennedy, McGovern away in Sweden: Unruh, Sorensen and other Kennedy men
        come, to lure McGovern into running. The next day DiSalle, governor of Ohio 1959–63, says he will nominate Edward
        Kennedy whether he likes it or not.'
      n: '[[w.chester-american-melodrama]], 415, 566. Check: Chester gives July 14 for the dinner at 566. Names: McGovern,
        Unruh, Sorensen, DiSalle, Edward Kennedy.'
      tags:
      - name:mcgovern-george
      - name:unruh-jesse-m
      - name:sorensen-theodore-c
      - name:disalle-michael-v
      - name:kennedy-edward-m
      - state:sd
