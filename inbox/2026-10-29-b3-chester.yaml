- add:
    entry:
      id: cal.1967-07.democratic-party
      when: July
      date: '1967-07'
      thread: democratic-party
      also:
      - war-opposition
      - elections-1968
      c: 'End of the month. Rauh, of Americans for Democratic Action, "a proposal to maximize political support for an end
        to the war in Vietnam": any candidate who ran against Johnson would be weaker than the peace movement and "hurt rather
        than help the cause of peace"; the liberals to fight instead for a "peace plank" in the Democratic platform.'
      n: '[[w.chester-american-melodrama]], 61. Names: Rauh, Johnson.'
      tags:
      - name:rauh-joseph-l-jr
      - name:johnson-lyndon-b
      src:
        c: a707cf55
        rows:
        - 'w.chester-american-melodrama 61: all'
- add:
    entry:
      id: cal.1967-07-25.democratic-party
      when: July 25
      date: '1967-07-25'
      thread: democratic-party
      also:
      - elections-1968
      c: 'Rauh with McGovern, a long talk, by Rauh''s account: McGovern has no intention of running against Johnson, nor has
        any other of the Senate''s doves.'
      n: '[[w.chester-american-melodrama]], 61. Names: Rauh, McGovern, Johnson.'
      tags:
      - name:rauh-joseph-l-jr
      - name:mcgovern-george
      - name:johnson-lyndon-b
      src:
        c: '7fc70622'
        rows:
        - 'w.chester-american-melodrama 61: all'
- add:
    entry:
      id: cal.1967-08-04.democratic-party
      when: Aug. 4
      date: '1967-08-04'
      thread: democratic-party
      also:
      - robert-kennedy
      - elections-1968
      c: 'On the plane to California, to Unruh''s fund-raising dinner. Lowenstein to Robert Kennedy: the movement against
        Johnson wants a candidate. Kennedy not interested; warns him off the California Democratic Council. Asked at the airport
        about the peace movement in California: "That''s a matter for the people of California to decide for themselves."'
      n: '[[w.chester-american-melodrama]], 62–63 (Lowenstein''s account). See [[cal.1967-08-04.robert-kennedy]]. Names: Lowenstein,
        Robert Kennedy, Unruh, Johnson.'
      tags:
      - name:lowenstein-allard
      - name:kennedy-robert-f
      - name:unruh-jesse-m
      - name:johnson-lyndon-b
      src:
        c: '87a714a6'
        rows:
        - 'w.chester-american-melodrama 62–63: all'
- add:
    entry:
