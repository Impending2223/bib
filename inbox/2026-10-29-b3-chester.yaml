      when: Oct.
      date: '1968-10'
      thread: elections-1968
      c: 'Early in the month. Connell, Humphrey''s executive assistant, a memorandum, "Preparation for the Harris poll of
        October 7": twenty-seven States, fourteen "probable," nine "real possibilities"; "We should prepare a full-scale orchestration
        on the theme: ''The swing is on to Humphrey.''" Napolitan to O''Brien: "not a bad memo."'
      n: '[[w.chester-american-melodrama]], 711–12. Names: Napolitan, O''Brien, Humphrey.'
      tags:
