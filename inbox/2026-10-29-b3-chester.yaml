      when: Aug. 15
      date: '1967-08-15'
      thread: democratic-party
      also:
      - war-opposition
      - elections-1968
      c: 'College Park, Md., the National Student Association''s convention at the University of Maryland. Lowenstein launches
        "Dump Johnson." Three organizations: Dissenting Democrats, for the peace movement; Concerned Democrats, for the politicians;
        the students, under Sam Brown.'
      n: '[[w.chester-american-melodrama]], 63. Names: Lowenstein, Sam Brown, Johnson.'
      tags:
      - name:lowenstein-allard
      - name:brown-sam
      - name:johnson-lyndon-b
      src:
        c: '6b2a9b95'
        rows:
        - 'w.chester-american-melodrama 63: all'
- add:
    entry:
      id: cal.1967-10-20.elections-1968
      when: Oct. 20
      date: '1967-10-20'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Los Angeles, breakfast in McCarthy''s suite: Lowenstein; Hill, of the California Democratic Council; Eller, McCarthy''s
        legislative aide. McCarthy: "Where''s labor in this thing? Do you have any money? Can you get enough volunteers?"
        After an hour and a quarter: "You fellows have been talking about three or four names. I guess you can cut it down
        to one."'
      n: '[[w.chester-american-melodrama]], 67. Names: McCarthy, Lowenstein.'
      tags:
      - name:mccarthy-eugene-j
      - name:lowenstein-allard
      src:
        c: '4cb114ac'
        rows:
        - 'w.chester-american-melodrama 67: all'
- add:
    entry:
      id: cal.1967-12-14.elections-1968
      when: Dec. 14
      date: '1967-12-14'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Manchester, N.H., the Sidor Lecture. McCarthy on "The New Civil Rights," to fourteen hundred, no word of entering
        the primary. After, at a house, some sixty Democrats, two county chairmen and the Mayor of Nashua among them: "here
        we have the government in exile"; a poll before coming in? "I think it would be very discouraging." To Halberstam,
        on the way to the airport: still of a mind to stay out of New Hampshire.'
      n: '[[w.chester-american-melodrama]], 84–85. Names: McCarthy, Halberstam.'
      tags:
      - name:mccarthy-eugene-j
      - name:halberstam-david
      - state:nh
      src:
        c: '793bf316'
        rows:
        - 'w.chester-american-melodrama 84–85: all'
- add:
    entry:
      id: cal.1967-12.elections-1968
      when: Dec.
      date: '1967-12'
      thread: elections-1968
      also:
      - democratic-party
      c: 'After the Sidor Lecture. Hoeh and Studds, of McCarthy''s New Hampshire group, a memorandum for Blair Clark, his
        new campaign manager: "There is nothing to be lost—and a great deal to be gained—by coming into New Hampshire"; McIntyre''s
        prediction of 3,000 to 5,000 votes for McCarthy; "A victory here ... would have major national repercussions"; a twelve-day
        schedule; the cost reckoned at $55,000 (it came to a little over $175,000). Clark puts the case to McCarthy on the
        train to New York, before Christmas.'
      n: '[[w.chester-american-melodrama]], 85–87. See [[cal.1967-12-14.elections-1968]]. Names: Studds, McIntyre, McCarthy.'
      tags:
      - name:studds-gerry-e
      - name:mcintyre-thomas-j
      - name:mccarthy-eugene-j
      - state:nh
      src:
        c: d23994c8
        rows:
        - 'w.chester-american-melodrama 85–87: all'
- add:
    entry:
      id: cal.1968-01-02.elections-1968
      when: Jan. 2
      date: '1968-01-02'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Manchester, N.H., the Wayfarer Hotel. Blair Clark to Hoeh: get ready, the Senator will announce something within
        forty-eight hours. At dinner McCarthy telephones Hoeh: he is coming in; Hoeh to tell the press in the morning.'
      n: '[[w.chester-american-melodrama]], 87. See [[cal.1967-12-14.elections-1968]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:nh
      src:
        c: ad77c5d2
        rows:
        - 'w.chester-american-melodrama 87: all'
- add:
    entry:
      id: cal.1968-01-24.robert-kennedy-campaign
      when: Jan. 24
      date: '1968-01-24'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'New York, Robert Kennedy''s apartment at United Nations Plaza. Kennedy and Lowenstein rough out half a dozen conditions
        under which Lowenstein would leave McCarthy for Kennedy, most of them a failure of McCarthy''s campaign. Before the
        month is out Lowenstein passes some on to McCarthy, as his own. Kennedy to Lowenstein: the seizure of the *Pueblo*
        the day before has changed his mind about running, a reminder of what could put him in Johnson''s power.'
      n: '[[w.chester-american-melodrama]], 89, 109 (Lowenstein''s account). Names: Robert Kennedy, Lowenstein, McCarthy,
        Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:lowenstein-allard
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      src:
        c: df64d82b
        rows:
        - 'w.chester-american-melodrama 89: A-B'
        - 'w.chester-american-melodrama 109: C'
- add:
    entry:
      id: cal.1968-01-25.elections-1968
      when: Jan. 25
      date: '1968-01-25'
      thread: elections-1968
      c: 'Nashua, N.H. McCarthy''s first campaign visit to the State: outside City Hall, by the bust of John Kennedy, where
        Kennedy began in 1960; handshaking at a shopping center.'
      n: '[[w.chester-american-melodrama]], 88. See [[cal.1968-01-03.elections-1968]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:nh
      src:
        c: '77562449'
        rows:
        - 'w.chester-american-melodrama 88: all'
- add:
    entry:
      id: cal.1968-03-06.elections-1968
      when: Mar. 6
      date: '1968-03-06'
      thread: elections-1968
      also:
      - democratic-party
      c: 'New Hampshire. Johnson''s write-in campaign, Boutin its organizer, a full-page advertisement in the State''s newspapers:
        "the Communists in Vietnam are watching the New Hampshire primary." Its radio spots against "fuzzy thinking and surrender";
        Governor King: McCarthy "a champion of appeasement and surrender"; McIntyre: McCarthy the friend of "draft-dodgers
        and deserters."'
      n: '[[w.chester-american-melodrama]], 98 (the advertisement, Mar. 6; the spots and the Governor''s and McIntyre''s words
        not dated). See [[cal.1968-01-03.elections-1968]]. Names: Boutin, John W. King, McIntyre, McCarthy, Johnson.'
      tags:
      - name:boutin-bernard-l
      - name:king-john-w
      - name:mcintyre-thomas-j
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - state:nh
      src:
        c: '2fadd9e2'
        rows:
        - 'w.chester-american-melodrama 98: all'
- add:
    entry:
      id: cal.1966-10-01.robert-kennedy
      when: Oct. 1
      date: '1966-10-01'
      thread: robert-kennedy
      also:
      - democratic-party
      c: 'Goodwin with Robert Kennedy, a long talk, the first of two (the second Oct. 16), on running against Johnson in 1968:
        Johnson''s standing will fall and Kennedy''s rise, the people hating Johnson''s personality, not only his style or
        his policies; but Johnson "would dump Humphrey and even stop the war if necessary to defeat you."'
      n: '[[w.chester-american-melodrama]], 111. Names: Goodwin, Robert Kennedy, Johnson, Humphrey.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      src:
        c: e8f294b0
        rows:
        - 'w.chester-american-melodrama 111: all'
- add:
    entry:
      id: cal.1966-11-09.robert-kennedy
      when: Nov. 9
      date: '1966-11-09'
      thread: robert-kennedy
      also:
      - democratic-party
      c: 'The day after the midterms. Walinsky, of Robert Kennedy''s Senate staff, a memorandum: Kennedy to run against Johnson
        in 1968, not wait for 1972. "Lyndon Johnson is a lame duck."'
      n: '[[w.chester-american-melodrama]], 111. Names: Walinsky, Robert Kennedy, Johnson.'
      tags:
      - name:walinsky-adam
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      src:
        c: '19a65329'
        rows:
        - 'w.chester-american-melodrama 111: all'
- add:
    entry:
      id: cal.1967-11-03.robert-kennedy-campaign
      when: Nov. 3
      date: '1967-11-03'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'Schlesinger to Robert Kennedy, a long letter, after their dinner the night before, when Kennedy learned McCarthy
        would run: "McCarthy has definitely decided to go"; to back Johnson against him would be "fatal," convincing "a lot
        of people, especially the young, that you prefer politics to principle"; Kennedy could beat Johnson in the primaries;
        he ought to be asked to run by a group of leading Democrats, and might talk with McCarthy, who "might be willing to
        stand aside and support you."'
      n: '[[w.chester-american-melodrama]], 113–14. See [[cal.1967-11-03.robert-kennedy]]. Names: Schlesinger, Robert Kennedy,
        McCarthy, Johnson.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      src:
        c: '76595b4c'
        rows:
        - 'w.chester-american-melodrama 113–14: all'
- add:
    entry:
      id: cal.1968-01-19.robert-kennedy-campaign
      when: Jan. 19
      date: '1968-01-19'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'New York, the day Johnson names Clifford for McNamara. Robert Kennedy, in the car to Westchester County with Newfield
        and Ronnie Eldridge: "He might just as well have appointed Attila the Hun!" Before he would run, Johnson shown psychotic,
        or the Senate''s doves asking him, or "one more politician of the national stature of Unruh." At dinner with Stephen
        Smith and Carter Burden, to Smith: "I think I''m going to cost you a lot of money this year!"'
      n: '[[w.chester-american-melodrama]], 107–8. See [[cal.1968-01-19.defense]]. Names: Robert Kennedy, Clifford, McNamara,
        Unruh, Stephen Smith, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:clifford-clark
      - name:mcnamara-robert-s
      - name:unruh-jesse-m
      - name:smith-stephen-e
      - name:johnson-lyndon-b
      src:
        c: '1472d9ed'
        rows:
        - 'w.chester-american-melodrama 107–8: all'
- add:
