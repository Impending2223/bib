      when: Aug. 5
      date: '1967-08-05'
      thread: democratic-party
      also:
      - elections-1968
      c: 'California. Lowenstein and Hill, chairman of the California Democratic Council: three thousand dollars to be raised,
        half in California; Gans, of the ADA''s staff, to open an office in Washington, Sept. 1.'
      n: '[[w.chester-american-melodrama]], 63. Names: Lowenstein, Gans.'
      tags:
      - name:lowenstein-allard
      - name:gans-curtis
      src:
        c: '7f5e1c27'
        rows:
        - 'w.chester-american-melodrama 63: all'
