      when: Apr. 1
      date: '1968-04-01'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'Chicago, the day after Johnson''s withdrawal. Edward Kennedy with St. Angelo, Indiana''s Democratic chairman: would
        Branigin leave the primary to Robert Kennedy and McCarthy? No: Branigin stays on the ballot, all but one or two of
        the ninety-two county chairmen for him.'
      n: '[[w.chester-american-melodrama]], 160. See [[cal.1968-03-16.elections-1968-5]]. Names: Edward Kennedy, Branigin,
        Robert Kennedy, McCarthy.'
      tags:
      - name:kennedy-edward-m
