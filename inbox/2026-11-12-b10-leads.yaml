    entry:
      id: cal.1963-11-29.civil-rights-bill-3
      when: Nov. 29
      date: '1963-11-29'
      thread: civil-rights-bill
      time: 1963-11-29T17:04Z
      c: 'Johnson to McCormack by telephone, on Smith and the civil rights bill in Rules. Johnson: "He won''t give you a hearing
        of any kind [before the recess]?" McCormack: "No." "He was frank about it. He won''t do anything to help [the bill]
        along."'
      n: '[[w.caro-passage-of-power]], 463 (the call; Smith will not even say when in January the hearings begin). To check:
        transcript, "12:04 P.M. to John McCormack and Leslie Arends," Nov. 29, 1963, *The Presidential Recordings: Lyndon
        B. Johnson*, I, 252–53, 300 (cited by [[w.caro-passage-of-power]], Notes, 463). See [[cal.1963-11-29.civil-rights-bill]].
        Names: Johnson, McCormack, Smith. Check: the hour, from the transcript''s heading in Caro''s note, which names Arends
        as well.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:smith-howard-w
- add:
    entry:
      id: cal.1962-03-29.court
      when: Mar. 29
      date: '1962-03-29'
      thread: court
      time: 1962-03-29T16:00Z
      c: 'The President''s news conference, 11 a.m., the State Department Auditorium. Asked about the Supreme Court''s reapportionment
        decision and what the Federal Government could do to support it: the administration had endorsed the principles as
        a friend of the Court; not appropriate to comment on the merits of a case in litigation. "[T]he right to fair representation
        and to have each vote count equally is, it seems to me, basic to the successful operation of a democracy."'
      n: 'The President''s News Conference, [1962 Pub. Papers 274](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=334)
        (Mar. 29, 1962; the page as [[w.schlesinger-robert-kennedy-and-his]], 398 n.29 gives it for the passage), [American
        Presidency Project](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-203) (the twenty-ninth,
        the question and the answer read there). [[w.schlesinger-robert-kennedy-and-his]], 398 ("in his next press conference").
        See [[cal.1962-03-27.court]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
