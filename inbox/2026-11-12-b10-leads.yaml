- add:
    entry:
      id: cal.1960-05-24.soviet-union-u2
      when: May 24
      date: '1960-05-24'
      thread: soviet-union-u2
      c: 'The National Security Council, after the summit. Dulles, on probable Soviet policy, based largely on Khrushchev''s
        speech in Berlin: somewhat reassuring. The members agree that the United States should not take the initiative to
        reopen discussions with the Soviet Union, but should keep to the test ban negotiations and the Ten Nation Conference.
        Herter: visible actions to raise military readiness might help. Gates agrees, though the defense posture had not been
        predicated on significant Soviet concessions at the summit.'
      n: '[[w.watson-into-the-missile-age]], 723. To check: [FRUS 1958–60, X, pt. 1, doc. 153](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d153)
        (cited at [[cal.1960-05-15.soviet-union]]). Names: Dulles, Khrushchev, Herter, Gates.'
      tags:
      - name:dulles-allen-w
      - name:khrushchev-nikita-s
      - name:herter-christian-a
      - name:gates-thomas-s-jr
