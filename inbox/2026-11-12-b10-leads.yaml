- add:
    entry:
      id: cal.1966-07-23.vietnam-2
      when: July 23
      date: '1966-07-23'
      thread: vietnam
      c: 'Indianapolis, 12:25 p.m., the Soldiers and Sailors Monument, the 150th anniversary of Indiana. Johnson: "discouraging
        setbacks for the militant Communists"; "We are not going to run out on South Vietnam. We are not going to break America''s
        word. However long it takes, we will persist until the Communists end the fighting or until we negotiate an honorable
        peace."'
      n: 'Remarks in Indianapolis at a Ceremony Marking the 150th Anniversary of the State of Indiana, [1966 Pub. Papers 760](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=134)
        (July 23, 1966), [American Presidency Project](https://www.presidency.ucsb.edu/documents/remarks-indianapolis-ceremony-marking-the-150th-anniversary-the-state-indiana)
        (the words and the hour, read there; the page, 760, from [[w.dallek-flawed-giant]], 377 n.119, which gives 760–62).
        [[w.dallek-flawed-giant]], 377 (the visit to Indiana, Kentucky and Illinois on July 23; the setbacks; "run out"; "However
        long it takes"). See [[cal.1966-07-23.civil-disorders]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:in
      - city:indianapolis
- add:
    entry:
      id: cal.1966-09-06.vietnam-congress
      when: Sept. 6
      date: '1966-09-06'
      thread: vietnam-congress
      also:
      - press-and-broadcasting
      c: 'The White House, a briefing of members of Congress on Vietnam. Johnson introduces Jim Lucas of UPI, two and a half
        years in Vietnam, as "not a propagandist of mine, and not a spokesman for the administration." Lucas, a "hawk": "this
        is going to be a long war," but "we can reduce them [the Viet Cong] to bandit status" by pushing them up into the
        hills.'
      n: '[[w.dallek-flawed-giant]], 380 ("At the beginning of September"; the introduction, Lucas''s words). To check: Congressional
        Briefing, Sept. 6, 1966, Congressional Briefings on Vietnam, LBJ Library (cited by [[w.dallek-flawed-giant]], 380
        nn.125, 128). Names: Johnson. Check: the day, from Dallek''s note 125; his text has "the beginning of September."'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-02-17.robert-kennedy-2
      when: Feb. 17
      date: '1967-02-17'
      thread: robert-kennedy
      also:
      - vietnam
      c: 'Kintner to Johnson: Robert Kennedy intends a speech critical of peace negotiations with Hanoi and of China policy.
        Johnson asks Rostow for "comment & action" on a preemptive "definitive" administration speech on foreign policy. Nothing
        is done.'
      n: '[[w.dallek-flawed-giant]], 453 ("In February"; the advice, Johnson''s request, "Nothing was done"). To check: Kintner
        to LBJ, Feb. 17, 1967, NSF: Name: Kintner, LBJ Library (cited by [[w.dallek-flawed-giant]], 453 n.30). See [[cal.1967-02-17.robert-kennedy]].
        Names: Kintner, Johnson, Rostow, Robert Kennedy. Check: the day, from Dallek''s note 30; his text has "February."'
      tags:
      - name:kintner-robert-e
      - name:johnson-lyndon-b
      - name:rostow-walt-w
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1967-03-31.press-and-broadcasting
      when: Mar. 31
      date: '1967-03-31'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: 'Johnson with Howard K. Smith of ABC, after the address at Nashville on Mar. 15. Smith: the reaction was good, but
        the administration''s greatest weakness is still "its inability to get over the complete story on its objectives in
        Vietnam." Johnson: "Our greatest weakness is our inability to communicate actions to the people so that they have
        been told. Nobody has tried as hard. I don''t have an answer."'
      n: '[[w.dallek-flawed-giant]], 453 (the exchange, after the address of Mar. 15 to the Tennessee legislature). To check:
        LBJ meeting with Smith, Mar. 31, 1967, Diary Backup, LBJ Library (cited by [[w.dallek-flawed-giant]], 453 n.29). See
        [[cal.1967-03-24.press-and-broadcasting]]. Names: Johnson, Smith. Check: the day, from Dallek''s note 29; his text
        puts the talk after Mar. 15 with no day.'
      tags:
      - name:johnson-lyndon-b
      - name:smith-howard-k
- add:
    entry:
      id: cal.1967-07-06.vietnam-2
      when: July 6
      date: '1967-07-06'
      thread: vietnam
      also:
      - korea
      c: 'Humphrey, back from Korea, where he discussed Vietnam with Korean, Japanese and Vietnamese leaders: all optimistic
        about the future of East Asia, and believing "that the military defeat of the United States/South Vietnam forces is
        no longer a possibility."'
      n: '[[w.dallek-flawed-giant]], 471 (the report; not the day). To check: Humphrey to LBJ, July 6, 1967, Humphrey Papers
        (cited by [[w.dallek-flawed-giant]], 471 n.76). See [[cal.1967-07-01.vietnam]]. Names: Humphrey. Check: the day, from
        Dallek''s note 76; his text has "returned from a trip to Korea."'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1964-09-07.vietnam-air-war
      when: Sept. 7
      date: '1964-09-07'
      thread: vietnam-air-war
      also:
      - laos
      c: 'Washington, the principals without the President. Wheeler presents a JCS proposal for "deliberately provocative
        actions" against North Vietnam, then a systematic bombing campaign of increasing severity. Taylor opposes it; the
        others agree. Systematic bombing might be needed "depending on GVN progress and Communist reaction in the meantime,"
        but not yet. They will recommend to Johnson limited actions to "show the Communists we mean business": naval patrols
        in the Tonkin Gulf and Oplan 34-A operations resumed, consultations with Souvanna Phouma for limited South Vietnamese
        operations in Laos, preparations "to respond on a tit-for-tat basis" to provocations.'
      n: '[[w.logevall-choosing-war]], 233–34 (the meeting of Sept. 7; the proposal, Taylor, the agreement, the actions).
        To check: William Bundy''s summary of the meeting, attached to McGeorge Bundy to Johnson, Sept. 8, 1964, [FRUS 1964–68,
        I, doc. 342](https://history.state.gov/historicaldocuments/frus1964-68v01/d342) (cited by [[w.logevall-choosing-war]],
        235 n.23). See [[cal.1964-09-08.vietnam-3]]. Names: Wheeler, Taylor, Souvanna Phouma.'
      tags:
      - name:wheeler-earle
      - name:taylor-maxwell
      - name:souvanna-phouma
- add:
    entry:
      id: cal.1964-12.europe-and-the-alliance-france
      when: Dec.
      date: 1964-12
      thread: europe-and-the-alliance-france
      also:
      - vietnam-diplomacy
      c: 'Paris. Rusk calls on de Gaulle. Rusk: Communists cannot be trusted and can never be neutral. De Gaulle: neutralization
        is working, imperfectly, in Cambodia and Laos, and no one can be sure it would not work in Vietnam; America cannot
        win militarily in the region and should learn from the French experience in Indochina and Algeria and "eliminate this
        area from the Cold War."'
      n: '[[w.logevall-choosing-war]], 280 ("in mid December"). To check: Rusk to LBJ, Dec. 16, 1964, NSF CF, box 170, LBJ
        Library; Couve–Rusk meeting notes, Dec. 17, 1964, Quai d''Orsay (cited by [[w.logevall-choosing-war]], 280 n.49).
        Names: Rusk, de Gaulle. Check: the day; Logevall has "mid December," his note a report of Dec. 16 and meeting notes
        of Dec. 17.'
      tags:
      - name:rusk-dean
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1964-12.vietnam-diplomacy
      when: Dec.
      date: 1964-12
      thread: vietnam-diplomacy
      also:
      - press-and-broadcasting
      - europe-and-the-alliance-france
      c: 'Walter Lippmann, back from Paris and de Gaulle, summoned to the Oval Office. Johnson asks about de Gaulle''s neutralization
        plan: could it prevent a Communist takeover of the entire country? Lippmann: no other choice; it would take a million
        Americans to pacify the country, and a lasting military victory could never be achieved. Johnson, doubtful: "This
        is a commitment I inherited. I don''t like it, but how can I pull out?"'
      n: '[[w.logevall-choosing-war]], 280 ("Upon his return from Paris"). To check: Ronald Steel, *Walter Lippmann and the
        American Century*, 555–56; Lippmann''s column, *Washington Post*, Dec. 22, 1964 (cited by [[w.logevall-choosing-war]],
        280 n.50). See [[cal.1964-12.europe-and-the-alliance-france]]. Names: Lippmann, Johnson. Check: the day; Logevall
        places the Paris talk in mid December and the summons on his return.'
      tags:
      - name:lippmann-walter
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-01.japan
      when: Jan.
      date: 1965-01
      thread: japan
      also:
      - vietnam-diplomacy
      c: 'Satō, after the talks in Washington, to a group of reporters: the solution for Vietnam must lie with Asians, not
        westerners; the "rational approach" of the western world would fail to resolve it, and the patience and forbearance
        of the Asian mind hold the key.'
      n: '[[w.logevall-choosing-war]], 337 ("After the meetings"). To check: *Washington Post*, Jan. 13, 1965, among the sources
        of [[w.logevall-choosing-war]], 337 n.5. See [[cal.1965-01-12.japan-and-korea]]. Names: Satō. Check: the day; Logevall
        has no day, only after the talks of Jan. 12–13.'
      tags:
      - name:sato-eisaku
- add:
    entry:
      id: cal.1965-04-17.vietnam-congress
      when: Apr. 17
      date: '1965-04-17'
      thread: vietnam-congress
      c: Fulbright urges a halt in the bombing, while saying he supports administration policy.
      n: '[[w.logevall-choosing-war]], 372 (the call, with the date; as Cooper''s memorandum reports it). To check: Cooper
        to LBJ, Apr. 21, 1965, NSF VN, box 16, LBJ Library (cited by [[w.logevall-choosing-war]], 372 n.94). See [[cal.1965-04-21.vietnam-congress-2]].
        Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1965-04-21.vietnam-4
      when: Apr. 21
      date: '1965-04-21'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Chester Cooper to Johnson: the Johns Hopkins "honeymoon period" is over. The administration''s propaganda position
        is hurt by the comments of Lippmann, Kennan, Galbraith and Fulbright, the student demonstrations, the unhelpful comments
        of France and Canada, and the "worldwide fear of war," especially in India and Japan.'
      n: '[[w.logevall-choosing-war]], 372 (Cooper''s memorandum, by Logevall''s account; "honeymoon period" is his word for
        the effect of the speech). To check: Cooper to LBJ, Apr. 21, 1965, NSF VN, box 16, LBJ Library (cited by [[w.logevall-choosing-war]],
        372 n.94). See [[cal.1965-04-17.vietnam-congress]]. Names: Cooper, Lippmann, Kennan, Galbraith, Fulbright, Johnson.'
      tags:
      - name:cooper-chester-l
      - name:lippmann-walter
      - name:kennan-george-f
      - name:galbraith-john-kenneth
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1961-03.laos-3
      when: Mar.
      date: 1961-03
      thread: laos
      c: 'Kennedy, privately, to his own men, after his public warnings on Laos: he does not intend to honor obligations in
        Laos; the talk and the troop movements are a bluff. If the United States must make a stand in Southeast Asia, it will
        be across the border, in Vietnam.'
      n: '[[w.reeves-president-kennedy]], 75 ("two days later," of the public warning after Mar. 23, is the warning, not the
        remark). To check: James Reston, interview; Collier and Horowitz, *The Kennedys*, 274; Rust, *Kennedy in Vietnam*,
        32–34 (cited by [[w.reeves-president-kennedy]], Source Notes, 75). See [[cal.1961-03-23.laos]]. Names: Kennedy. Check:
        the day and the month; Reeves gives the remark after the warning of Mar. 23 and before Mar. 28.'
      tags:
      - name:kennedy-john-f
