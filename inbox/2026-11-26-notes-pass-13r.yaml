    after: end
    words: MACV counts 11 boats destroyed and 22 damaged and the Vinh depot 90 percent destroyed; the losses are an A1H at the Lach Chao estuary and an A4C at Hon Gay.
    item: '[[w.macv-command-history-1964]], 109–10'
- add-words:
    id: cal.1964-08-05.vietnam
    after: end
    words: The Ticonderoga's strike on the Vinh depot begins at 1330H; Commander Stockdale's VF 51 Crusaders strafe the antiaircraft sites first. The Constellation's aircraft reach Hon Gay about 1540H.
    item: '[[w.marolda-united-states-navy-and]], 446–47'
- add-words:
    id: cal.1964-08-05.vietnam
    after: end
    words: Four of the 67 aircraft engaged are hit or lost; two aviators are lost. Petty Officer Joe Lee Williams, after 18 hours arming aircraft on the Ticonderoga's deck, falls into an E-1B's propeller and is killed.
    item: '[[w.marolda-united-states-navy-and]], 449'
- check:
    id: cal.1964-08-05.vietnam
    text: 'Check: Marolda (449) counts of 34 boats 7 destroyed, 10 severely and 16 lightly damaged; MACV (109–10) 11 destroyed and 22 damaged. MACV gives 64 sorties, Marolda 67 aircraft engaged.'
