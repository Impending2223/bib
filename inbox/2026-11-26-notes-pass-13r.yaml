- add-words:
    id: cal.1965-01-03.china-leadership
    after: end
    words: 'Deng Xiaoping attends; he says he agrees with the Chairman: going down fast was right at first, now they must come up slowly and look at the whole.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1842'
- check:
    id: cal.1965-01-03.china-leadership
    text: 'Check: MacFarquhar (III, 426) gives 18,000 work-team members and six weeks of documents.'
