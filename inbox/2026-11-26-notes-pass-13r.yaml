      time_band: night
      time_zone: America/New_York
      range_basis: record
      c: 'Johnson to Moyers, working late, on the "Daisy" spot: "I''ve been swamped with calls!" Chuckling: "I guess it did what we goddamned set out to do, didn''t it?"'
      n: '[[w.perlstein-before-the-storm]], 413–14 (Moyers "working late in his office," summoned); [[w.goldberg-barry-goldwater]], 225 (by telephone, "soon after"). Check: Perlstein has a summons, Goldberg a call. See [[cal.1964-09-07.elections-1964-johnson]]. Names: Johnson, Moyers.'
