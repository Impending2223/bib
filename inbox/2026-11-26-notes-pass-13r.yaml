- add-words:
    id: cal.1964-08-16.china-leadership-2
    after: end
    words: Teams of several thousand to ten thousand are to fight a "battle of annihilation"; a third of the central organs' cadres are to go down in units of 10,000 or more (MacFarquhar's reading).
