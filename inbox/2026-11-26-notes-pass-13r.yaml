- add-words:
    id: cal.1964-02-27.china-leadership-3
    after: end
    words: Peng Zhen revises the draft. The CC's Feb. 20 letter had called the CPSU's Feb. 12 letter open factional and splitting activity and "demanded" a copy.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 321'
- add-words:
    id: cal.1964-02-27.china-leadership-3
    after: end
    words: Peng Zhen, Li Fuchun and Yang Shangkun attend Mao and Liu Shaoqi at Diaoyutai in meeting Kim Il Sung, Feb. 27 and 29, on the reply to the CPSU's letter of Nov. 29.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 321'
- add-words:
    id: cal.1964-02-27.china-leadership-3
    after: end
    words: Mao tells Kim, at the first talk, that the CPSU may or may not give the letter, a refusal likelier.
