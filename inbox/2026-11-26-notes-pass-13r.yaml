    entry:
      id: cal.1964-10-16.soviet-union-2
      when: Oct. 16
      date: '1964-10-16'
      place: washington
      thread: soviet-union
      time_range:
      - 1964-10-16T10:00Z
      - 1964-10-16T16:00Z
      time_band: morning
      time_zone: America/New_York
      range_basis: record
      c: 'The White House, the morning. Dobrynin brings Johnson the new leaders'' assurance that Soviet foreign policy will not change, "the pursuit of peaceful coexistence and the relaxation of tensions." Johnson, by Dobrynin''s account: "We do not want to bury the Soviet Union, but at the same time we do not want to be buried"; he would spend a night at the ambassador''s house "without a pistol under my pillow."'
      n: 'Statement by the President Following a Meeting With the Russian Ambassador, [1963–64 Pub. Papers 1356](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=596) (Oct. 16, 1964). [[w.dobrynin-in-confidence]], 132–33 (Dobrynin''s account; "in the morning"); [[w.fursenko-khrushchevs-cold-war]], 539 (after the NSC meeting, "Later that day"). See [[cal.1964-10-15.soviet-union]]. Names: Dobrynin, Johnson.'
      tags:
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
