    after: end
    words: The ceremony is in the Rose Garden, with the Ozark, Fire Island and Canyonlands bills also signed. Johnson calls the 88th Congress the "conservation Congress", thanks Udall, Anderson, Jackson and Aspinall, and regrets that Laurance Rockefeller is absent.
