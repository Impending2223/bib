    - ok:note-substance
- add-words:
    id: cal.1964-12-18.king
    after: end
    words: Lee White arranges the visit to limit news coverage; King comes with his family and SCLC colleagues, flown in on Governor Rockefeller's plane. Johnson introduces Ramsey Clark.
    item: '[[w.kotz-judgment-days]], 243–44'
- add-words:
    id: cal.1964-12-18.king
    after: end
    words: 'Johnson presses the war on poverty; King says voting rights legislation is needed. As King later recalled, Johnson says: "I can''t get a voting rights bill through in this session of Congress."'
    item: '[[w.garrow-bearing-the-cross]], 368'
