      when: June 11
      date: '1964-06-11'
      time: 1964-06-11T22:11Z
      time_zone: America/New_York
      thread: robert-kennedy
      also:
      - vietnam
      c: 'Johnson to Robert Kennedy by telephone, 6:11 p.m.: his note "the nicest thing that happened to me since I''ve been here"; he cannot "think of letting you do that," but Kennedy must help him find the man, and soon. By Clifford''s account Johnson turned the offer down after talking with Rusk, McNamara and Clifford, for Kennedy''s safety in the war zone.'
      n: '[Johnson and Robert Kennedy, 6:11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-and-office-conversation-june-11), Tape WH6406.06, Citation #3699 (Miller Center). [[w.taking-charge]], 405–6; [[w.shesol-mutual-contempt]], 199 ("on the evening of June 11"); [[w.clifford-counsel-to-the-president-2]], 395 (the grounds; Clifford''s account). Made public: the recordings, opened by the LBJ Library. Check the year. See [[cal.1964-06-11.robert-kennedy]]. Names: Johnson, Robert Kennedy, Rusk, McNamara, Clifford.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:clifford-clark
      follows:
      - cal.1964-06-11.robert-kennedy
