    id: cal.1964-03-10.china-leadership
    after: end
    words: 'Mao to Maurer, who heads the Romanians: neither "fortress" has been taken; the two parties agree against those who wave the baton and control other countries; Romania should work on Poland, perhaps Hungary, even Bulgaria.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 722'
- add-words:
    id: cal.1964-03-10.china-leadership
    after: end
    words: At the dinner Mao toasts the parties' friendship and Gheorghiu-Dej's health; Maurer toasts Mao's, for the Romanian party, its Central Committee, its Politburo and Gheorghiu-Dej.
