      time_band: afternoon
      time_zone: America/New_York
      range_basis: record
      c: Late afternoon, Clark Clifford's law office. Robert Kennedy tells Clifford he has just sent Johnson a letter offering to take Lodge's place in Saigon, Vietnam "obviously the most important problem facing the United States"; it is not a political ploy.
      n: '[[w.clifford-counsel-to-the-president-2]], 395 ("the late afternoon of June 11"); [[w.shesol-mutual-contempt]], 198–99. See [[cal.1964-06-11.robert-kennedy]]. Names: Robert Kennedy, Clifford, Lodge.'
      tags:
      - name:kennedy-robert-f
