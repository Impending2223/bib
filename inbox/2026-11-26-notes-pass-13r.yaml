      time_band: night
      time_zone: America/New_York
      range_basis: record
      c: 'That night on NBC, in *Monday Night at the Movies*, the Democrats'' "Daisy": a girl counting petals, a countdown, a bomb; Johnson''s voice: "We must either love each other, or we must die." Shown once as a paid spot. Tony Schwartz made it with Doyle Dane Bernbach.'
      n: '[[w.perlstein-before-the-storm]], 412–14 (the spot; Schwartz and DDB; "Monday, September 7"; once as a paid commercial); [[w.white-making-of-the-president-1965]], 322 (NBC''s *Monday Night at the Movies*, Sept. 7, shown once); [[w.goldberg-barry-goldwater]], 225 (a commercial break; Johnson''s voice; aired only once); [[w.bernstein-guns-or-butter]], 148 (Schwartz''s spot; withdrawn). Check: Bernstein, 148, has the spots run "in mid-September." To check: [[w.dallek-flawed-giant]], 175–76; [[w.branch-pillar-of-fire]], 490–91; [[w.zelizer-fierce-urgency-of-now]], 157; [[w.schwartz-lyndon-johnson-and-europe]], 43; [[w.young-two-suns-of-the]], 174–76; [[w.mann-daisy-petals-and-mushroom]]. See [[cal.1964-09-07.elections-1964]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      follows:
      - cal.1964-09-07.elections-1964
- add:
