- edit:
    id: cal.1964-08-05.vietnam
    base: 2905ec52
    set:
      c: Pierce Arrow.{1} Planes from the Ticonderoga and the Constellation strike the torpedo boat bases and the oil depot at Vinh, 64 sorties.{2} Two planes lost;{3} Alvarez taken, the first American airman held in the North.{4}
      n: 'Special Message to the Congress on U.S. Policy in Southeast Asia, [1963–64 Pub. Papers 930](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=170); Remarks at Syracuse University on the Communist Challenge in Southeast Asia, [1963–64 Pub. Papers 928](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=168) (Aug. 5, 1964). [FRUS 1964–68, I, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v01/d286). [[w.gibbons-u-s-government-and]], II, 297–98 (Pierce Arrow, on the boat bases and oil; Syracuse, n.58; Stockdale leading the strike); [[w.frankum-like-rolling-thunder]], 15 (the strike on the boat bases and Vinh; Alvarez taken, Sather killed); [[w.vietnam-victory-in-vietnam]], 132, 461 n.20 (the strike, 64 sorties; a pilot captured); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 522 (the strikes; the request for a resolution); [[w.cosmas-joint-chiefs-of-staff-2012]], 108–109 (the strike; the message); [[w.marolda-united-states-navy-and]], 443–48 (the strikes; Alvarez and Sather shot down); [[w.anthony-war-in-northern-laos]], 127 (the strikes; two planes lost, a pilot taken); [[w.bernstein-guns-or-butter]], 337 (Stockdale leads the reprisal, bombs Vinh; the resolution sent Aug. 5); [[w.marolda-united-states-navy-and]], 449 (the count: 33 of the 34 boats hit, 7 destroyed, 10 badly damaged; 4 of 67 aircraft hit or lost, two aviators lost; Williams killed on the *Ticonderoga*''s deck); [[w.zaroulis-who-spoke-up]], 22 (McNamara''s after-midnight news conference on the strikes, including the Hon Gay coal mine; Johnson asks Congress for the resolution the next day); [[w.macv-command-history-1964]], 191 (Aug. 5: "US carrier planes hit PT pens and Vinh oil tanks in DRV"; not the carriers'' names, the sorties, the planes lost, Alvarez or Johnson); [[w.lich-su-khang-chien-chong-my]], III, 366–69; [[w.lich-su-khang-chien-chong-my]], III, 367–68 (12:30 p.m., Aug. 5, the first raid, on Cửa Hội, Nghệ An: one shot down 2 km west of Hòn Mắt island; a flight of eight on the Gianh river port, Quảng Bình, from the west behind the mountains: one shot down, one hit; a flight of eight on Hòn Gai and Bãi Cháy, Quảng Ninh: an A4 down at Hà Tu, its pilot, "I. Anvơrét," taken by Sgt. Nguyễn Kim Bảo of the Northeast Military Region, two border guards and the militia; 2:45 p.m., Bãi Cháy and Lạch Trường: three down, one hit; 4:20 p.m., the Gianh port again: two down; the afternoon, Cửa Hội again). [[w.macv-command-history-1964]], 109–10 (the strikes, 64 sorties, 11 boats destroyed, 22 damaged, Vinh''s depot 90 percent destroyed, two planes lost, Alvarez held). The time is the first strike''s: 1330H by Marolda (446), 12:30 p.m. Hanoi time by the Lịch sử (III, 367), the same hour. Johnson at Syracuse is [[cal.1964-08-05.vietnam-2]]; the message to Congress is an entry of its own. To check: [[w.moise-tonkin-gulf-and-the-2019]]; Hist, CINCPAC, 1964, pp 367–69 (cited by [[w.anthony-war-in-northern-laos]], 127 n.90). See [[cal.1964-08-02.vietnam]]. Names: Alvarez, Johnson. Check: *Victory in Vietnam* gives eight aircraft shot down of the 64 sorties, and one pilot captured (132, 461 n.20).'
