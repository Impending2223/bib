    after: end
    words: The message is titled "Toward Full Educational Opportunity." The $1 billion is two-thirds of the total.
    item: '[[w.bernstein-guns-or-butter]], 191–92'
- add-words:
    id: cal.1965-01-12.school-aid
    after: end
    words: 'Perkins''s bill: districts where 3 percent or more of the pupils come from families earning under $40 a week, some five million of 48 million pupils; $100 million for books; about $100 million for supplementary centers.'
    item: '[[w.zelizer-fierce-urgency-of-now]], 178–79'
- names:
    id: cal.1965-01-12.school-aid
    add: []
    tags:
    - ok:note-substance
- add-words:
    id: cal.1965-01-15.king
    after: end
    words: Johnson gives birthday greetings, King's thirty-sixth, and asks for recommendations on pending appointments.
    item: '[[w.branch-pillar-of-fire]], 560'
- add-words:
    id: cal.1965-01-15.king
    after: end
    words: 'King asks that the first Negro be named to the Cabinet; Johnson says he plans to. Johnson presses the Medicare, education and poverty bills and, to King''s surprise, says they must "come up with" voting rights legislation: "That will answer 70 percent of your problems!"'
    item: '[[w.kotz-judgment-days]], 250–51'
- add-words:
    id: cal.1965-01-15.king
    after: end
    words: 'Johnson would have age and literacy the only tests and no poll tax, and, if the States fail, registration under federal control: "They can all go to the Post Office like they buy a stamp."'
    item: '[[w.kotz-judgment-days]], 251'
- add-words:
    id: cal.1965-01-15.king
    after: end
    words: 'Johnson: voting rights "will be the greatest breakthrough of anything not even excepting this ''64 act."'
    item: '[[w.zelizer-fierce-urgency-of-now]], 203'
- add-words:
    id: cal.1965-01-15.king
    after: end
    words: 'On the education bills Johnson says: "We''ve got to try with every force at our command."'
    item: '[[w.zelizer-fierce-urgency-of-now]], 178'
- add-words:
    id: cal.1965-01-15.king
    after: end
    words: King says the five Southern States Johnson did not carry have under 40 percent of Negroes registered.
    item: '[[w.zelizer-fierce-urgency-of-now]], 204'
- names:
    id: cal.1965-01-15.king
