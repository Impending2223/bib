      c: 'The Great Hall, the dinner after Mao''s talk with the Romanian delegation. Mao: the talks were good, both sides felt equal; "tonight a meeting of unity." Mao toasts the two parties'' friendship and Gheorghiu-Dej''s health; Maurer toasts Mao''s, for the Romanian party, its Central Committee, its Politburo and Gheorghiu-Dej.'
