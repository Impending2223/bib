      when: Oct. 28
      date: '1964-10-28'
      thread: elections-1964-johnson
      c: 'On the way into Los Angeles, Johnson with a few correspondents on the polls: too good; Texas at 53 or 54 percent; he gives Goldwater Arizona, Mississippi, Alabama, South Carolina, Louisiana, Georgia and Florida; Lady Bird would go to Austin on election night; he would keep the Cabinet.'
      n: '[[w.white-making-of-the-president-1965]], 375 (White there). See [[cal.1964-10-28.elections-1964]]. Names: Johnson, Goldwater, Lady Bird Johnson.'
      tags:
