- edit:
    id: cal.1964-06-11.robert-kennedy
    base: db83edca
    set:
      c: 'Robert Kennedy to Johnson: "if you wished me to go to Viet Nam in any capacity I would be glad to do so."{1}'
      n: '[Johnson and Robert Kennedy, 6:11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-and-office-conversation-june-11), Tape WH6406.06, Citation #3699 (Miller Center); [June 12, 7:26 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-june-12-1964), Tape WH6406.08, Citation #3731 (Miller Center); [May 28, 11:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-may-28-1964), Tape WH6405.11, Citations #3539 and #3540 (Miller Center). Kennedy to Johnson, June 11, 1964, LBJ Library (Check the file). [[w.schlesinger-robert-kennedy-and-his]], 728 (the letter, undated, filed June 11); [[w.gibbons-u-s-government-and]], II, 276 n.164 (the note of June 11, from Schlesinger); [[w.branch-pillar-of-fire]], 321, 337; [[w.clifford-counsel-to-the-president-2]], 395 (Robert Kennedy at Clifford''s office late that afternoon: the letter sent, not a political ploy; Johnson''s refusal after talking with Rusk, McNamara and Clifford); [[w.shesol-mutual-contempt]], 198–99 (the letter; Kennedy at Clifford''s office that afternoon; Johnson''s answer by telephone that evening); [[w.shesol-mutual-contempt]], 262 (May 28, Kennedy for a group on Vietnam: "Being quite frank about it"); [[w.thomas-robert-kennedy]], 293 (early June; Johnson touched, fearing an independent agent); [[w.taking-charge]], 405–6; [[w.taking-charge]], 374–75. Made public: the recordings, opened by the LBJ Library. Check the year. Check: [[w.taking-charge]], 405 n.4, quotes the letter "I would be glad to go.". To check: [[w.taking-charge-2001]]. Names: Robert Kennedy, Johnson, Sanford. Johnson''s call of that evening, Kennedy''s of June 12 and their call of May 28 are entries of their own, as is Kennedy''s visit to Clifford''s office that afternoon.'
