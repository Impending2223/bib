    id: cal.1964-09-07.elections-1964
    base: 30ae9f48
    set:
      c: 'Labor Day.{1} Johnson opens his campaign in Cadillac Square, Detroit: "There is no such thing as a conventional nuclear weapon."{2}'
      n: 'Remarks in Cadillac Square, Detroit, [1963–64 Pub. Papers 1049](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=289) (Sept. 7, 1964); Remarks in Seattle on the Control of Nuclear Weapons, [1963–64 Pub. Papers 1078](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=318) (Sept. 16, 1964). [[w.perlstein-before-the-storm]], 412–14, 418–20 (the spot; Cadillac Square); [[w.dallek-flawed-giant]], 175–76 (the Daisy spot); [[w.white-making-of-the-president-1965]], 322 (the Daisy Girl spot on NBC''s *Monday Night at the Movies*, Sept. 7, shown once); [[w.branch-pillar-of-fire]], 490–91 (the daisy spot); [[w.goldberg-barry-goldwater]], 225 ("Monday Night at the Movies"; the daisy, the countdown, Johnson''s voice: "To make a world in which all of God''s children can live, or go into the dark"; shown once; Johnson to Moyers after: "I guess it did what we Goddamned set out to do, didn''t it"); [[w.zelizer-fierce-urgency-of-now]], 157 (the "Daisy" spot, Sept. 7, aired once); [[w.bernstein-guns-or-butter]], 148 (Tony Schwartz''s two commercials, the daisy and the ice cream cone; the first withdrawn; O''Brien: it "did more to crystallize public opinion against Goldwater than any other single tool"); [[w.schwartz-lyndon-johnson-and-europe]], 19 (Johnson to a Detroit audience in September 1964 on the nuclear exchange, n.44 dating it Sept. 7, Pub. Papers 1049–52; the passage "Modern weapons are not like any other," not the Cadillac Square quotation); [[w.schwartz-lyndon-johnson-and-europe]], 43 (the "Daisy" ad, a girl picking the petals from a daisy, a nuclear countdown, a bomb; not the night, the network or its showing once). [[w.young-two-suns-of-the]], 168, 174–76 (Cadillac Square; the spot on NBC that night, once). Johnson spoke "just before noon": [1963–64 Pub. Papers 1049](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=289), the NOTE. Check: Bernstein, 148, has the spots run "in mid-September.". To check: Moyers to Johnson, Sept. 13, 1964 ("That''s exactly what we wanted to imply"), LBJ Library, White House Central Files, EX: PL 6-3 (cited by [[w.perlstein-before-the-storm]], 414 n.1); [[w.mann-daisy-petals-and-mushroom]]; [[w.lamb-campaign-decision-making]]; Manchester, Glory and the Dream, p. 1260 (cited by [[w.branch-pillar-of-fire]], 490); [[w.edwards-goldwater]], 299–300 (cited by [[w.branch-pillar-of-fire]], 490). See [[cal.1964-08-26.elections-1964]]; [[cal.1964-07-15.elections-1964]]. Names: Johnson. The "Daisy" spot that night and the Seattle remarks of Sept. 16 are entries of their own.'
