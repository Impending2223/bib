      c: Robert Kennedy charges Johnson with a breach of confidence over his account to the reporters of their meeting of July 29; Johnson denies talking to them and will check his schedule.
      n: '[[w.shesol-mutual-contempt]], 210 ("Within days"; at the White House); [[w.bernstein-guns-or-butter]], 136 (by telephone; Johnson to check his "schedule"). Check: Shesol has Kennedy at the White House, Bernstein and Clifford (397) a telephone call. Check: the day. To check: Robert Kennedy, memorandum dictated Aug. 4–6, 1964, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 662 n.84). See [[cal.1964-07-31.robert-kennedy]]. Names: Robert Kennedy, Johnson.'
