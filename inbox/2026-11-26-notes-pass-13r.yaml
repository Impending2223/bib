- add:
    entry:
      id: cal.1964-05-28.robert-kennedy
      when: May 28
      date: '1964-05-28'
      time: 1964-05-28T15:45Z
      time_zone: America/New_York
      thread: robert-kennedy
      also:
      - vietnam
      - civil-rights-the-executive
      c: 'Johnson and Robert Kennedy by telephone, 11:45 a.m. Johnson thanks him for his note on civil rights and asks after Cambridge, Md.; Kennedy: jobs, with 33 or 35 percent unemployment. On Vietnam Kennedy finds too much emphasis on the military side; the war "will never be won militarily"; he urges a group on Vietnam like the ExComm. Johnson: "We''d like to have you."'
      n: '[Johnson and Robert Kennedy, May 28, 11:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-may-28-1964), Tape WH6405.11, Citations #3539 and #3540 (Miller Center). [[w.taking-charge]], 374–75 (the note on civil rights, Cambridge); [[w.shesol-mutual-contempt]], 262–63 ("Being quite frank about it"; the ExComm). Made public: the recordings, opened by the LBJ Library. Check the year. Names: Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - ok:fields-place
