- add-words:
    id: cal.1964-06-11.robert-kennedy
    after: end
    words: By Clifford's account Johnson turns the offer down after talking with Rusk, McNamara and Clifford, on grounds of Kennedy's safety in the war zone.
    item: '[[w.clifford-counsel-to-the-president-2]], 395'
- add-words:
    id: cal.1964-06-11.robert-kennedy
    after: end
    words: 'Johnson on the call: the note is "the nicest thing that happened to me since I''ve been here"; he cannot "think of letting you do that."'
    item: '[[w.taking-charge]], 406'
- add-words:
    id: cal.1964-06-11.robert-kennedy
    after: end
    words: By Schlesinger, Johnson tells Valenti he would "be accusing myself for the rest of my life" if something happened to Kennedy there.
    item: '[[w.schlesinger-robert-kennedy-and-his]], 728'
- add-words:
    id: cal.1964-06-11.robert-kennedy
    after: end
    words: 'May 28: Kennedy says there is too much emphasis on the military side, that the war "will never be won militarily"; Johnson says, "We''d like to have you."'
