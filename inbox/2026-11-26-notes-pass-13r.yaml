      n: 'Check: Branch: Johnson "embraced that goal for his administration but deflected it beyond 1965" (547). After White''s memorandum: [[cal.1964-12-18.civil-rights-the-executive]]. To check: Lee White to Johnson, Dec. 18, 1964, Daily Diary backup, Johnson Library; King, "Address . . .," Feb. 23, 1968 (his account), King Papers, King Center (cited by [[w.garrow-bearing-the-cross]], 368 n.11); [*New York Times*, Dec. 19, 1964](https://timesmachine.nytimes.com/timesmachine/1964/12/19/issue.html), at 32; *Washington Post*, Dec. 19, 1964, at A2; *Atlanta Constitution*, Dec. 19, 1964, at 3 (cited by [[w.garrow-bearing-the-cross]], 368 n.12); [*New York Times*, Dec. 19, 1964](https://timesmachine.nytimes.com/timesmachine/1964/12/19/issue.html), at 32 (cited by [[w.branch-pillar-of-fire]], 547); King statement to Washington reporters, Dec. 18, 1964, A/KS (cited by [[w.branch-pillar-of-fire]], 547); Lee White to LBJ, Dec. 18, 1964, Diary Back-up, Box 12, LBJ (cited by [[w.branch-pillar-of-fire]], 547); Juanita Roberts note, Diary Back-up, Box 12, LBJ (cited by [[w.branch-pillar-of-fire]], 547); PDD, Dec. 18, 1964, LBJ (cited by [[w.branch-pillar-of-fire]], 547). Check: the record. [[w.garrow-bearing-the-cross]], 368, 598 (Johnson''s reply, by King''s account); [[w.kotz-judgment-days]], 243–44 (Dec. 18, Lee White''s arrangements; no voting law in 1965; Selma to begin Jan. 2); [[w.branch-pillar-of-fire]], 547; [[w.bernstein-guns-or-butter]], 216, 218 (Rockefeller''s jet to Washington; Johnson: the poverty program would help; by King''s later account, "I can''t get a voting rights bill through in this session of Congress"); [[w.young-easy-burden]], 326 (Johnson "talking about his federal programs" almost the whole session; King after: "Kennedy asked questions for an hour; Johnson talks for an hour."). See [[cal.1964-12-10.voting-rights]], [[cal.1964-11-18.civil-rights-the-executive]]. Names: Martin Luther King, Johnson. The time: King flown in "Friday afternoon" ([[w.branch-pillar-of-fire]], 547).'
