- add-words:
    id: cal.1965-01-21.vietnam
    after: end
    words: 'Johnson opens: "We do not separate Democrats and Republicans in Vietnam." Vietnam is his worst problem, one he "wrestles with all the time, day and night." Rusk: political instability is the greatest problem. McNamara puts infiltration since 1959 at 19,000 to 34,000. Long asks why not push into North Vietnam; Dirksen asks why not bring the dependents home, "We are pampering our forces in South Vietnam."'
    text: '[FRUS 1964–68, II, doc. 30](https://history.state.gov/historicaldocuments/frus1964-68v02/d30)'
- add-words:
    id: cal.1965-01-21.vietnam
    after: end
    words: Thirteen lawmakers attend, among them Mansfield, Dirksen, Long, Smathers, Ford, Laird and McCormack; Johnson says he wants the meeting kept small.
    item: '[[w.logevall-choosing-war]], 315'
