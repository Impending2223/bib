    id: cal.1964-10-15.soviet-union
    base: 5f567233
    set:
      c: Khrushchev removed, "for reasons of age and health."{1} Brezhnev First Secretary, Kosygin Chairman of the Council of Ministers.{4}
      n: 'FRUS 1964–68, XIV, docs. [51](https://history.state.gov/historicaldocuments/frus1964-68v14/d51), [52](https://history.state.gov/historicaldocuments/frus1964-68v14/d52), [53](https://history.state.gov/historicaldocuments/frus1964-68v14/d53), [55](https://history.state.gov/historicaldocuments/frus1964-68v14/d55). Statement by the President Following a Meeting With the Russian Ambassador, [1963–64 Pub. Papers 1356](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=596) (Oct. 16, 1964). [[w.fursenko-one-hell-of-a]], 353–54 (Polyanski''s indictment, Cuba in it); [[w.dobrynin-in-confidence]], 131–33 (Oct. 16, morning: no change in foreign policy; Johnson: "We do not want to bury the Soviet Union, but at the same time we do not want to be buried"; "without a pistol under my pillow"; China''s bomb that day; by Dobrynin''s account); [[w.fursenko-khrushchevs-cold-war]], 535–39 (TASS, Oct. 15; Dobrynin to Johnson: "the pursuit of peaceful coexistence and the relaxation of tensions"); [[w.prezidium-tsk-kpss-1954]], III, 767–70 (the Presidium''s resolution of Oct. 13–14, the plenum''s of Oct. 14, Khrushchev''s statement); [[w.schwartz-lyndon-johnson-and-europe]], 26 (Khrushchev deposed in October 1964; Brezhnev, called "party chairman," and Kosygin, "Premier," his successors; not the day, the Black Sea, the Central Committee or the Dobrynin visit); [[w.khrushchev-1964-stenogrammy]], 267–70 (docs. 21–23, the announcement of the plenum, the Presidium of the Supreme Soviet''s protocol and decree); [[w.schattenberg-brezhnev]], 173–74 (the plenum, Oct. 14: Khrushchev released "due to advanced age"; Brezhnev First Secretary, Kosygin recommended for the Council of Ministers); [[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 16, 1964: the CPSU plenum''s and Supreme Soviet Presidium''s communiqués relieve Khrushchev "for age and health" as first secretary, Presidium member and chairman of the Council of Ministers; elect Brezhnev and name Kosygin); [[w.macfarquhar-maos-last-revolution]], 9 (Oct. 14); [[w.lengxi-shinian-lunzhan-1956-1966]], 888–897 (Wu''s note from Soviet memoirs: the Presidium of Oct. 12 at Brezhnev''s, Oct. 13, Oct. 14 a.m. and p.m.; Khrushchev''s statement of resignation; the plenum the evening of Oct. 14 under Brezhnev, Suslov reading Polyansky''s report; the Oct. 15 Supreme Soviet Presidium, 830–831); [[w.friedman-shadow-cold-war]], 124 (the ouster announced two days before China''s nuclear test; Peking''s leaders think for a moment they have won); [[w.chang-friends-and-enemies]], 250 (at almost the same time Khrushchev replaced, officially for "health reasons"). Check: the government post: the plenum of Oct. 14 resolved his release and recommended Kosygin; the Presidium of the Supreme Soviet relieved him and appointed Kosygin by decree, Oct. 15 ([[w.khrushchev-1964-stenogrammy]], 267–70); the Supreme Soviet confirmed both Dec. 9, the day [[w.schattenberg-brezhnev]], 174 n.22, gives for his removal. To check: [[w.taubman-khrushchev]]; [[w.khrushchev-vremya-lyudi-vlast]]; [[w.luthi-sino-soviet-split]], 287 (cited by [[w.friedman-shadow-cold-war]], 124 n.96a); [[w.radchenko-two-suns-in-the]], 127–29 (cited by [[w.friedman-shadow-cold-war]], 124 n.96b). Names: Khrushchev, Kosygin, Dobrynin, Brezhnev, Johnson. His recall of Oct. 13 ([[cal.1964-10-13.soviet-union]]) and the Central Committee''s plenum of Oct. 14 ([[cal.1964-10-14.soviet-union-leadership]]) have entries of their own; so does Dobrynin''s call on Johnson of Oct. 16.'
