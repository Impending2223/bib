- edit:
    id: cal.1964-03-10.china-leadership
    base: '17732864'
    set:
      c: 'Mao, Beijing, the Hall of the People, afternoon: receives the Romanian delegation, with Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng. Mao: the open polemic was begun by the other side, to end only when they retract; it is a war of pens: no one dies, the sky does not fall, grass grows, fish swim, women bear children. China will answer every article and resolution, perhaps ten years, there are 2,000;{1} he has a five-year plan, then Liu and the others.{2}'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 10, 1964. [[w.lengxi-shinian-lunzhan-1956-1966]], 712–723 (Mao received the delegation in the Old Peking Hall (老北京厅) of the Great Hall from 5:30 p.m. until past 7, with Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng, Wu Xiuquan and Wu Lengxi; Mao: the polemic is a war of pens, no one dies, the sky does not fall, the grass grows, the fish swim, women bear children; China will answer every article of the 2,000-odd and every resolution, about ten years; the quarrel began in 1958 over the joint fleet and in 1960 at Bucharest; "two fortresses neither taken"; a dinner, toasts to Gheorghiu-Dej and to Mao, "a meeting of unity"); [[w.yang-shangkun-riji]], II, 359 (Mar. 10, 1964; from 6 p.m. to 8:15, at the Great Hall 大会堂; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1804 (Mar. 10, 1964; afternoon, 下午; Deng with Mao, Liu Shaoqi, Peng Zhen and others receives and dines the Romanian Workers'' Party Central Committee''s delegation; on the 12th he and Liu Shaoqi see the delegation off at the airport on its way to Korea); [[w.peng-zhen-nianpu-1902]], IV, 323 (Mar. 10, 1964, afternoon; Peng Zhen, with Liu Shaoqi, Deng Xiaoping and others, accompanies Mao in meeting the Romanian delegation and at the dinner; Mao: the open polemic was started by them, it needs a fair settlement; the talks good, both sides felt equal, "今晚是个团结的会见"). Made public: 1999. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng. The time is Wu''s: the talk from 5:30 p.m. until past 7 (713). Check: Yang Shangkun''s diary, as the note gives it (II, 359), has 6 to 8:15 p.m. The dinner after the talk, with Mao''s "a meeting of unity" (722; IV, 323, 席间), is an entry of its own.'
      src:
