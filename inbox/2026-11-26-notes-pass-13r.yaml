      n: '[[w.white-making-of-the-president-1965]], 373 ("1:45 a.m. Albuquerque time (4:45 Washington time)"; "about 2:30"). See [[cal.1964-10-28.elections-1964]]. Names: Johnson, Bundy, McNamara, Rusk.'
