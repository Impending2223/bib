- add-words:
    id: cal.1964-07-28.china-leadership
    after: end
    words: The reply holds to a well-prepared meeting of the parties united on Marxism–Leninism, opposes the CPSU's splitting meeting, and says the Central Committee will attend neither it nor its preparatory meeting.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 347'
- add-words:
    id: cal.1964-07-28.china-leadership
    after: end
    words: 'Mao would goad Khrushchev into calling the meeting, expecting he dares not; his two closing paragraphs, by Wu Lengxi: if they hold it, the day of their "so-called congress" is the hour they enter the grave; they should "rein in at the cliff."'
