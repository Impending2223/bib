- add-words:
    id: cal.1965-01-21.china-leadership-2
    after: end
    words: The report is Li Fuchun's of Jan. 6 on revolutionizing planning and drawing up the long-term plan. Mao has it printed also for the Secretariat, the regional bureaus, the provincial committees and Yu Qiuli's "small planning commission," whose five, six or seven members Yu picks himself, none from the old planning commission.
    item: '[[w.jianguo-yilai-mao-zedong]], XVII, 524–25'
- add-words:
    id: cal.1965-01-21.china-leadership-2
    after: end
    words: The small commission answers directly to Zhou Enlai.
    item: '[[w.macfarquhar-origins-of-the-cultural]], III, 426–27'
- cite:
