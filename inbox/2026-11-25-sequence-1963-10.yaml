- edit:
    id: cal.1963-10-05.vietnam-saigon-2
    base: '95757876'
    set:
      n: '[[w.sen-church-alleged-assassination-plots]], 217, 221 (the cable, drafted for McCone by Colby, chief of the Far East Division, by Colby''s testimony of June 20, 1975). After [[cal.1963-10-05.vietnam-saigon|the station''s cable]]: "Upon being informed," McCone sends the first of two cables (217); the cable "responded" (221). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Director to Saigon, Oct. 5, 1963 (cited by [[w.sen-church-alleged-assassination-plots]], 221). See [[cal.1963-10-05.vietnam-saigon]]. Names: McCone, Diệm.'
- edit:
    id: cal.1963-10-12.goldwater
    base: 81174fe4
    set:
      n: '[[w.white-suite-3505]], 222–23. After [[cal.1963-10-12.elections-1964|Rockefeller''s challenge at Eugene]]: the challenge made "just before Barry came in"; at the San Francisco airport "the reporters asked him if he would take Rockefeller up on his offer" (222–23). See [[cal.1963-10-12.elections-1964]]. Names: Goldwater, Hess.'
- edit:
    id: cal.1963-10-29.civil-rights-bill-2
    base: a1e9fec7
    set:
      n: '[[w.whalen-longest-debate]], 62–63; [[w.risen-bill-of-the-century]], 132 (Halleck: "my commitment does not extend to FEP"; Risen lists Halleck, Arends and McCulloch with Kennedy); [[w.purdum-idea-whose-time-has-2014]], 142–43 (the meeting at 9:30 a.m. with McCulloch and Halleck; Halleck: "We''ve got at least seven and maybe another on our side"; Kennedy believes he has nine, "And we hope maybe Libonati will support us"; Halleck''s word on the FEPC; "That''s the Republican FEPC!"; not the full list present, nor "We''ve got nine"). After [[cal.1963-10-29.republican-party-congress-2|the Republicans'' meeting in Arends''s office]]: "Then Charlie Halleck and Bill McCulloch drove down to the White House" (Whalen, 62). To check: Audiotape log 118.2, Oct. 29, 1963, JFK Library (cited by [[w.whalen-longest-debate]], 251). Names: Kennedy, Halleck, McCulloch, Johnson, Albert, Celler, Katzenbach, Burke Marshall, Libonati.'
