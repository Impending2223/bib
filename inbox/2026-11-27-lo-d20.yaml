- edit:
    id: cal.1967-08-26.china-leadership
    base: ccd363ab
    kind: correct
    set:
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178–179 (Aug. 26, 1967); [[w.jianguo-yilai-mao-zedong]], XIX, 440 n.14 (Aug. 1967; the editors'' note: in Aug. 1967 the Center
        decided to suspend Wang Li and Guan Feng from their posts for investigation; it gives no day); [[w.macfarquhar-maos-last-revolution]], 230 (by noon Yang is back in
        Peking, briefing Zhou); [[w.mao-zedong-zhuan]], VI, ch. 76 n.68 (that night at the Diaoyutai Zhou Enlai chairs a small meeting of the Center''s leaders, Chen Boda,
        Kang Sheng, Jiang Qing and others attending, reads out Mao''s instruction word by word, ''today''s meeting is to convey an important decision of Chairman Mao''; Wang
        Li and Guan Feng are then isolated; Qi Benyu later, by Mao''s instruction at a meeting, also arrested, n.68). [[w.yang-jisheng-tiandi-fanfu]], I, 545 (Yang flies back
        at noon; in the evening Zhou chairs the small liaison meeting at the Diaoyutai, Chen Boda, Kang Sheng, Jiang Qing present: "today''s meeting relays an important decision
        of Chairman Mao" and reads Yang''s record word for word; Wang Li and Guan Feng are put under examination; by Yan Changgui, Jiang Qing wept when Zhou left; Qi Benyu
        dealt with likewise in January; by Han Suyin, Zhou purged the three); [[w.jian-zhou-enlai]], 583 (around noon Yang conveys Mao''s decision "word by word"; that evening
        Zhou reads Mao''s instructions, sentence by sentence, to Jiang Qing, Chen Boda, Kang Sheng and the other Group members; Wang and Guan promptly arrested); [[w.liu-jixian-ye-jianying-nianpu]],
        II, 970 (Aug. 26, 1967; on Mao''s instruction Wang Li 王力 and Guan Feng 关锋 put in isolation for examination 隔离审查). Made public: 2020. See [[cal.1967-08-25.china-leadership-2]].
        To check: the Chronology''s date for Mao''s marking of Wang Li''s speech; Central Committee, decision of Aug. 1967 to suspend Wang Li and Guan Feng for investigation
        (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 440 n.14a); [[w.zishen-zhanjiang-yu-tongshuai]], 373–376 (cited by [[w.macfarquhar-maos-last-revolution]], 230 n.36);
        Yang Chengwu 杨成武, account of Mao''s decision on Wang Li, Guan Feng and Qi Benyu, Aug. 1967, in [[w.zhang-zishen-yang-chengwu-jiangjun-fangtanlu]], 43–45 (cited by [[w.mao-zedong-zhuan]],
        VI, ch. 76 n.68); [[w.zhou-enlai-zhuan-1949]], 1928 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 545 n.78); Yan Changgui 閻長貴, 〈戚本禹、閻長貴說「文革」〉, *Wangshi* 《往事》, no. 119
        (Mar. 29, 2013) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 545 n.79); Han Suyin 韓素音, *Zhou Enlai he ta de shiji* 《周恩來和他的世紀》 (Zhongyang wenxian chubanshe, 1992),
        472 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 545 n.80); [[w.zhou-enlai-nianpu-1949]], III, 183 (cited by [[w.jian-zhou-enlai]], 583 n.71a); [[w.zishen-yang-chengwu-nianpu-chronological]],
        455–456 (cited by [[w.jian-zhou-enlai]], 583 n.71b). Yang (I, 545) has the meeting that evening, after the noon briefing. Names: Zhou Enlai, Mao Zedong, Yang Chengwu,
        Wang Li, Guan Feng, Qi Benyu, Chen Boda, Kang Sheng, Jiang Qing.'
      c: Zhou Enlai, told at noon by Yang Chengwu, back from Shanghai, of Mao's decision that Wang Li, Guan Feng and Qi Benyu are wreckers of the Cultural Revolution and that
        the Premier is to handle them.{1} Wang Li and Guan Feng are put under isolation and examination.{2}
