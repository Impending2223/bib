        838 ("if one more politician, on the level of Unruh, asks me to run, I''ll do it"; none of the Senate doves wants it). See [[cal.1968-01-19.defense]]. Chester (108)
        and Schlesinger (838) have the dinner after the cocktail party, that night. Names: Robert Kennedy, Clifford, McNamara, Unruh, Johnson, Newfield.'
