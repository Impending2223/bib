- edit:
    id: cal.1967-08-16.vietnam-support
    base: 7cd720e9
    kind: correct
    set:
      c: 'East Room, 1:18 p.m.: the Vietnam Civilian Service Awards. Lady Bird Johnson and Henry Cabot Lodge, the former Ambassador, are on the stage. A small group of civilians,
        AID workers and members of a church group, receive citations for their work in Saigon hospitals and schools.'
      n: 'Remarks Upon Presenting the Vietnam Civilian Service Awards, [1967 Pub. Papers 779](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=171)
        (Aug. 16, 1967) (the Papers'' note: spoken at 1:18 p.m. in the East Room; awards to Scotton, Kim, O''Neill, James, Shepley and Savage, the last posthumous). [[w.johnson-white-house-diary]],
        559. The Papers give 1:18 p.m. for what the Diary calls "early." Names: Lady Bird Johnson, Lodge.'
      time: 1967-08-16T17:18Z
      time_zone: America/New_York
- edit:
    id: cal.1967-08-21.press-and-broadcasting
    base: 3f3d2b11
    kind: correct
    set:
      n: '[[w.califano-triumph-and-tragedy-of]], 172; [[w.graham-uncertain-triumph]], 174–75. Check: Graham, 174, has Cater persuade Johnson to approve the leak (Cater to Johnson,
        July 12, 1967, 257 n.31). To check: Califano to Johnson, July 24, 1967, 11 a.m., Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 172 n.13); [*New
        York Times*, Aug. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/08/21/issue.html) (cited by [[w.graham-uncertain-triumph]], 175 n.33). Califano (172)
        has Cater''s scolding that morning, after the story. Names: Califano, Johnson, Cater.'
      c: 'Marjorie Hunter in the *New York Times*, the second lead on the front page: the Friday task force''s secret report on education, the programs to stay concentrated
        on poor urban and rural children.{1} Califano had leaked it through an intermediary at Johnson''s order.{2}'
- add:
    entry:
      id: cal.1967-08-21.press-and-broadcasting-3
      when: Aug. 21
      date: '1967-08-21'
      place: washington
      thread: press-and-broadcasting
      also:
      - school-aid
      follows:
      - cal.1967-08-21.press-and-broadcasting
      time_range:
      - 1967-08-21T10:00Z
      - 1967-08-21T16:00Z
      time_band: morning
      time_zone: America/New_York
      range_basis: record
      c: 'Johnson chews out Cater, his aide on education, for the leak. Cater, nearly trembling, comes to Califano''s office to find who did it; Califano: "I did."'
      n: '[[w.califano-triumph-and-tragedy-of]], 172 (that morning Cater comes to his office; later that morning Califano shows the President the story, and Johnson never mentions
        it again). See [[cal.1967-08-21.press-and-broadcasting]]. The order: after [[cal.1967-08-21.press-and-broadcasting]], the story the leak produced, Califano, 172. Names:
        Johnson, Cater, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:cater-s-douglass
      - name:califano-joseph-a-jr
