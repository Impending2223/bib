        Chairman Mao." He reads out Yang Chengwu''s record of Mao''s instruction word for word.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 545 (Yang flies back at noon; in the evening Zhou chairs the small liaison meeting at the Diaoyutai, Chen Boda, Kang Sheng and
        Jiang Qing present, and reads Yang''s record word for word; Wang Li and Guan Feng are then put under isolation and examination). See [[cal.1967-08-26.china-leadership]].
        The order: after [[cal.1967-08-26.china-leadership]], Zhou told at noon, Yang Jisheng, I, 545. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yang Chengwu, Mao
        Zedong.'
