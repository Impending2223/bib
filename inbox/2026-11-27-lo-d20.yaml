        Hearing Before the Senate Committee on Foreign Relations*, 90th Cong., 2d Sess. (1968). [[w.mann-grand-delusion]], 578–80; [[w.cq-weekly-report]], Mar. 1, 1968, 384.
        [[w.mcnamara-in-retrospect]], ch. 5 at n.18 (Fulbright: "I never meant to leave the impression that I thought you were deliberating trying to deceive us"; Mansfield,
        Pell and Symington the same). [[w.woods-j-william-fulbright-vietnam]], 168–69 (the closed session, seven and a half hours; Herrick''s cables of Aug. 3 and 4, 1964,
        read by Fulbright; McNamara''s 21-page statement to the press after, "monstrous"); [[w.woods-fulbright]], 477–78 (seven and a half hours; Herrick''s cables; McNamara''s
        twenty-one pages to the press, "monstrous"); [[w.zaroulis-who-spoke-up]], 154 (Feb. 20: McNamara before Fulbright''s committee; "highly classified and unimpeachable
