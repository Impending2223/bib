- edit:
    id: cal.1967-07-22.china-leadership-4
    base: 5cb312bb
    kind: reword
    set:
      c: Zhou Enlai calls Ye Ming, Kong Qingde, Li Zuopeng and Liu Feng at the Wangjiadun airfield, Wuhan, and has Kong Qingde run the Wuhan Military Region for the time. The
        Wuhan air force is under double leadership and is to follow the Region's command, not take stands at will. Chen Zaidao and Zhong Hanhua are to take a stand quickly
        and win the initiative.
- add:
    entry:
      id: cal.1967-07-22.china-wuhan
      when: July 22
