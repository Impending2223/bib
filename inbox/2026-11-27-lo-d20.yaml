      time_zone: Asia/Shanghai
      range_basis: record
      c: Zhou Enlai puts Wang Li and Xie Fuzhi on their plane to Peking; his own, with Li Zuopeng, takes off after.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 537 (the afternoon of the 22nd: Zhou puts Wang Li and Xie Fuzhi on their plane; his and Li Zuopeng''s plane takes off later; in
        the air he has theirs circle so that he lands first); [[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967; 下午, in the afternoon, he flies back to Peking, read
        on the page image); [[w.macfarquhar-maos-last-revolution]], 212 (Xie and Wang land in Peking at 4:55 p.m., Zhou having had their plane circle). Made public: 2020. See
        [[cal.1967-07-22.china-leadership-4]]; [[cal.1967-07-22.china-leadership-7]]. The order: after [[cal.1967-07-22.china-leadership-4]], the call at the airfield, Yang
        Jisheng, I, 537; the landing, [[cal.1967-07-22.china-leadership-7]], follows. Names: Zhou Enlai, Wang Li, Xie Fuzhi, Li Zuopeng.'
      tags:
      - name:zhou-enlai
      - name:wang-li
      - name:xie-fuzhi
      - name:li-zuopeng
      - polity:prc
      - vis:only:prc
      - ok:fields-place
