      c: Fletcher is in Califano's office by 7:15 p.m. and goes with him to the Oval Office. Johnson, taken with him, gives him a bedroom on the mansion's third floor.
      n: '[[w.califano-triumph-and-tragedy-of]], 235 (in Califano''s office by 7:15 that evening; the Oval Office; the bedroom on the third floor of the mansion). Check: the
        day. Califano, 235, has the nominations "a week later, on September 6," which would make this day Aug. 30. See [[cal.1967-08-23.states-and-cities]]; [[cal.1967-09-06.states-and-cities]].
        The order: after [[cal.1967-08-23.states-and-cities]], the flight to Washington, Califano, 235. Names: Johnson, Califano.'
