- add:
    entry:
      id: cal.1965-11-12.china-leadership-5
      when: Nov. 12
      date: '1965-11-12'
      thread: china-leadership
      c: 'Tianjin 天津. Mao 毛泽东, left Peking 北京 by special train for the south, hears the Hebei Provincial Committee 河北省委 heads. "What are my instructions?" They: "prepare for war, prepare
        for famine, for the people." Mao: "for the people has been said for years." Are the four clean-ups good? "Plainly good." He goes on by Jinan 济南, Xuzhou 徐州, Bengbu 蚌埠 and Nanjing
        南京, hearing the local heads, and reaches Shanghai 上海 Nov. 17.'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 74. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 74). To check:
        Mao Zedong 毛泽东, talk on hearing the heads of the Hebei Provincial Committee 河北省委, Nov. 12, 1965 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.15); [[w.xianzhi-mao-zedong-zhuan-1949]],
        the first edition (2003), for the same passage. See [[cal.1965-11-10.china-leadership]]. Names: Mao Zedong. Check: the days at the stops after Tianjin; the Nov. 13 and Nov. 19
        dates of other entries for the tour.'
      src:
        c: 01e59d7c
        rows:
        - 'w.mao-zedong-zhuan VI, ch. 74: all'
        - 'via w.mao-zedong-zhuan VI, ch.74 n.15: all'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      place: tianjin
