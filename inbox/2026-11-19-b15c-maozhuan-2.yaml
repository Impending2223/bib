      when: Apr. 18
      date: '1964-04-18'
      thread: china-leadership
      c: 'Changsha 长沙. Mao 毛泽东 hears Zhang Pinghua 张平化 of Hunan 湖南, with Li Ruishan 李瑞山 and Wang Yanchun 王延春. Zhang asks for Tao Zhu 陶铸 and Wang Renzhong 王任重 whether urban street residents
        may form laboring people''s associations and classes be drawn. Mao: "I agree"; there are classes in the villages, in factories; in towns, none would mean a party and state of
        the whole people. Not drawn before, that is all.'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 72. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 72). To check:
