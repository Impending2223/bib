- add:
    entry:
      id: cal.1964-03-28.china-leadership-5
      when: Mar. 28–29
      date: '1964-03-28'
      thread: china-leadership
      c: 'Handan 邯郸. Mao 毛泽东 stops two days, hears Tao Lujia 陶鲁笳 of Shanxi 山西 and Lin Tie 林铁 of Hebei 河北 and five Hebei prefectural heads. Did the work hinder production? "Every step
        close to production." The class struggle was not raised by the Party: the people want the four clean-ups. Hears Chen Yonggui''s 陈永贵 name for the first time.'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 72. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 72). To check:
        Mao Zedong 毛泽东, talks on hearing Tao Lujia 陶鲁笳, Lin Tie 林铁 and others, Mar. 28 and 29, 1964 (records 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.37); [[w.xianzhi-mao-zedong-zhuan-1949]],
        the first edition (2003), for the same passage. See [[cal.1964-03-28.china-leadership-2]]. Names: Mao Zedong, Tao Lujia, Lin Tie, Chen Yonggui. Check: the days of the stop; the
        book says "two days" from the 28th.'
      src:
        c: c2252aac
        rows:
        - 'w.mao-zedong-zhuan VI, ch. 72: all'
        - 'via w.mao-zedong-zhuan VI, ch.72 n.37: all'
