- add:
    entry:
      id: cal.1964-08-04.china-leadership-6
      when: Aug. 4
      date: '1964-08-04'
      thread: china-leadership
      c: 'Tian Jiaying 田家英, the day before he leaves Peking with Liu Shaoqi 刘少奇 for Guangzhou to revise the Latter Ten Points 后十条, asks Mao 毛泽东 for his views. Mao: do not see the grass-roots
        cadres as black all through; do not mass many work-team members on one point. Tian gives both to Liu on the plane from Peking to Wuchang 武昌.'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 73. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 73). To check:
        *Mao Zedong he ta de mishu Tian Jiaying* 《毛泽东和他的秘书田家英》 (enlarged ed., Zhongyang wenxian chubanshe, Aug. 1996), 99 (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.9); [[w.xianzhi-mao-zedong-zhuan-1949]],
        the first edition (2003), for the same passage. See [[cal.1964-08-05.china-leadership]]. Names: Tian Jiaying, Mao Zedong, Liu Shaoqi. Check: the day Tian gave Liu the two points;
        the book has Liu leave Aug. 5 and Tian go with him.'
      src:
        c: c8911e00
        rows:
        - 'w.mao-zedong-zhuan VI, ch. 73: all'
        - 'via w.mao-zedong-zhuan VI, ch.73 n.9: all'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
