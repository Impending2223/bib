- add:
    entry:
      id: cal.1963-05-09.china-leadership-8
      when: May 9
      date: '1963-05-09'
      thread: china-leadership
      c: 'Hangzhou 杭州. Mao 毛泽东 forwards the Zhejiang Provincial Committee''s 浙江省委 materials on batches of cadres taking part in labor with a comment of some 1,300 characters: cadre labor
        "of great revolutionary meaning"; the rural branch secretaries of the country to labor within three years, the factory branch secretaries to be good hands; class struggle, production
        and scientific experiment the three great revolutionary movements; an education of men, a regrouping of the class ranks. The same day Zhou Enlai 周恩来 writes that he would come
        to the meeting, and Mao asks the secretaries to stay.'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 72. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 72). To check:
        Mao Zedong 毛泽东, comment on the *Yi pi ganbu canjia laodong de cailiao* 《一批干部参加劳动的材料》 of the Zhejiang Provincial Committee''s office 浙江省委办公厅, May 9, 1963 (*Jianguo yilai zhongyao
        wenxian xuanbian* 《建国以来重要文献选编》, vol. 16, Zhongyang wenxian chubanshe, July 1997, 292-293) (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.11); [[w.xianzhi-mao-zedong-zhuan-1949]],
        the first edition (2003), for the same passage. See [[cal.1963-05-08.china-leadership-10]]. Names: Mao Zedong, Zhou Enlai.'
      src:
        c: f7db7a07
        rows:
        - 'w.mao-zedong-zhuan VI, ch. 72: all'
        - 'via w.mao-zedong-zhuan VI, ch.72 n.11: all'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
      place: hangzhou
