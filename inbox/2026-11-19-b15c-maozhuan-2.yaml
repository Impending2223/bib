      when: June, late
      date: 1963-06
      thread: soviet-union
      c: Moscow 莫斯科. The Soviet government expels six staff of the Chinese embassy 中国驻苏联大使馆 and declares them persona non grata, on the ground that they distributed the Central Committee's
        June 14 Proposal 《关于国际共产主义运动总路线的建议》 in Moscow.
      n: '[[w.mao-zedong-zhuan]], V, ch. 71. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 71). To check:
        [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Check: the day; the book says "late June" and gives six; Yang Shangkun''s diary five (see
        [[cal.1963-07-09.soviet-union]]).'
      src:
        c: 8c4f984d
        rows:
        - 'w.mao-zedong-zhuan V, ch. 71: all'
      tags:
