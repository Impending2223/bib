      when: Apr. 2
      date: '1964-04-02'
      thread: china-leadership
      c: 'Wuchang 武昌, afternoon. Mao 毛泽东 hears Wang Renzhong 王任重, first secretary of Hubei 湖北: half the communes and brigades to finish the movement this year. Mao: too hasty? will it
        be a show? Begin with the enemy, or with the four clean-ups? Let the next batch begin with cadres washing and putting down their burden. Has Wang lectured the two tens? "You
        are not old, not ill."'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 72. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 72). To check:
