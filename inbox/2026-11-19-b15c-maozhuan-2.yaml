      place: handan
- add:
    entry:
      id: cal.1964-03-30.china-leadership-5
      when: Mar. 30–Apr. 1
      date: '1964-03-30'
      thread: china-leadership
      c: Zhengzhou 郑州. Mao 毛泽东 hears, in two afternoons, Liu Lantao 刘澜涛 of the Northwest Bureau 西北局, Li Qiming 李启明 of Shaanxi 陕西, Li Baohua 李葆华 of Anhui 安徽, Liu Jianxun 刘建勋 of Henan
        河南 and Henan prefectural heads. The education to be thorough, three to four years; the people's contradictions and the four clean-ups first, the enemy's after; where leadership
        is usurped, seize power first. Asks Anhui and Henan on drainage of the lower Yellow River.
      n: '[[w.mao-zedong-zhuan]], VI, ch. 72. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 72). To check:
