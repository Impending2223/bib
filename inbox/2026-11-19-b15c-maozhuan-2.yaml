        [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1964-04-02.china-leadership-7]]. Names: Mao Zedong, Zhang Pinghua, Li Ruishan,
        Wang Yanchun, Tao Zhu, Wang Renzhong. Check: the book dates Wang Renzhong''s earlier raising of the question Apr. 5, in Hubei, where Mao made no answer.'
