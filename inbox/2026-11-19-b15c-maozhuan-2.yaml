        VI, ch. 72 n.38); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1964-03-28.china-leadership-5]]. The time is the first day''s.
        Names: Mao Zedong, Liu Lantao, Li Qiming, Li Baohua, Liu Jianxun. Check: the book gives Mar. 30 as the day Mao reached Zhengzhou and its note Mar. 30 and Apr. 1 for the talks.'
      src:
