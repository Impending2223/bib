- add:
    entry:
      id: cal.1965-05.china-leadership-5
      when: May, mid
      date: 1965-05
      thread: china-leadership
      c: 'The Military Commission 中央军委 holds its war-preparation conference 备战会议. Mao 毛泽东 gives many views: the line of operations if war comes; the large and small Third Fronts 三线 to
        be speeded; new weapons to be developed; stocks of materiel and grain to be laid in.'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 74. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 74). To check:
        [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1965-05-25.china-leadership-5]]. Names: Mao Zedong. Check: the day; the book says
        "mid-May." Whether these are the views of the Standing Committee members in the summary Lin Biao sent Mao May 22 ([[cal.1965-05-25.china-leadership-5]]).'
      src:
        c: df6d31e6
        rows:
        - 'w.mao-zedong-zhuan VI, ch. 74: all'
