patch: 2026-11-24-nyt-1960-07-03
by: 'Claude (reader, New York Times, July 3, 1960, from the owner''s screenshots of Nov. 23; inventory notes/nyt/1960-07-03.md), Nov. 24, 2026'
ops:
- edit:
    id: cal.1960-07-02.elections-1960-2
    base: '61697434'
    set:
      n: '[[w.sorensen-kennedy]], 151–52; [[w.clifford-counsel-to-the-president-2]], 321; [[w.wofford-of-kennedys-and-kings]], 49 (July 2, Truman on television against Kennedy; Symington, Johnson, Bowles, Meyner and "several others"; "be patient"; not the quotations or the number); [[w.odonnell-johnny-we-hardly-knew]], 201 (the televised press conference of July 2: Kennedy "too young" and "not quite ready," the convention "prearranged"; Symington, Johnson, Meyner and Bowles preferred, Stevenson "pointedly" excluded). [*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 18, 19 ("Truman Charges Kennedy Backers Run Convention," Independence, Mo., July 2, at 1, 19; the transcript, at 18; the replies of Symington, Humphrey, Ribicoff, Brown, Stevenson, Miller, Halleck, McCarthy, Gore, Jackson and Clark, at 19). Check: Clifford gives Kennedy''s answer ("If fourteen years in major elective office is insufficient experience ...") without its day. Reply: [[cal.1960-07-04.elections-1960]]. Names: Truman, Symington, Johnson, Bowles, Kennedy.'
- primary:
    id: cal.1960-07-01.soviet-union
    text: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 2 ("Arctic Search Is Pressed for U.S. Plane Carrying 6," Bonn, July 2: the RB-47 out of Brize Norton missing since July 1, the search; the Pentagon''s denial of any overflight; not the shooting down)'
    units: '?'
- primary:
    id: cal.1960-07-02.congo
    text: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Two Tribes Battle in Capital of Congo," Léopoldville, July 2, UPI: Bayaka against Bakongo in Léopoldville from the night of July 1, some 100 jailed, a curfew; Lulua against Baluba at Luluabourg; page not shown)'
    units: '?'
- add:
    entry:
      id: cal.1960-07-01.cuba
      when: July 1
      date: '1960-07-01'
      place: havana
      thread: cuba
      also: [oil]
      c: Cuba seizes the Esso and Shell refineries. Esso's at Belot, its feeder tanks near empty, closed by the Cuban Petroleum Institute for want of crude.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 15 (Tad Szulc, "Cuban Airline Flights Cut as Oil Concerns Ask Cash," Havana, July 2: the two seizures "yesterday," Esso''s in the morning; Esso''s affiliates told the same day to make Cubana pay cash for fuel); "Cuban Seizure Studied," London, July 2 (the Foreign Office: Britain "actively considering" what steps to take on Shell''s; page not shown). See [[cal.1960-06-29.cuba]].'
- add:
    entry:
      id: cal.1960-07-01.cuba-2
      when: July 1
      date: '1960-07-01'
      thread: cuba
      also: [soviet-union, oil]
      c: Guevara, president of the National Bank, in a speech, says the Soviet Union will fill all Cuba's oil needs, some 26 million barrels a year.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 15 (Szulc, "Cuban Airline Hit by Action on Oil," the speech "yesterday"; the place not given). See [[cal.1960-07-01.cuba]]. Names: Guevara.'
      tags: [name:guevara-ernesto]
- add:
    entry:
      id: cal.1960-07-01.state-legislatures
      when: July 1
      date: '1960-07-01'
      place: honolulu
      thread: state-legislatures
      c: Hawaii's legislature ends its special session, seventeen days after it opened at Iolani Palace. Twelve bills for Hilo, struck by the tidal wave of May 23; a compromise on the sale and lease of public lands.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 18 ("Hawaii Legislators End Special Session," Honolulu, July 2: ended "late Friday"). Check: the bills'' numbers and the land act''s terms. See [[cal.1960-06-23.states-and-cities-us]].'
      tags: [state:hi, city:honolulu]
- add:
    entry:
      id: cal.1960-07-01.voting-rights
      when: July 1
      date: '1960-07-01'
      thread: voting-rights
      also: [civil-rights-organizations]
      c: 'The NAACP asks the Red Cross to relieve Negro families in Fayette County, Tenn., who registered to vote and lost jobs, credit and insurance and cannot buy gasoline: Wilkins, by telegram, a "man-made disaster." Next day the Memphis branch''s leaders go into the county.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Boycott of Negroes Stirs Plea for Aid," the telegram "yesterday"; Memphis, July 2, the branch, David S. Cunningham its president; page not shown). Check: the day: the story carries no dateline for the telegram; "yesterday" read from a story of July 2. Names: Wilkins.'
      tags: [name:wilkins-roy, state:tn]
- add:
    entry:
      id: cal.1960-06-30.antisubversion
      when: June 30
      date: '1960-06-30'
      thread: antisubversion
      also: [court]
      c: Pennsylvania Supreme Court orders four Philadelphia teachers rehired, dismissed in 1954 as incompetent for refusing to testify before Congressional investigations of communism. Refusal to testify no proof of incompetence; on *Slochower*.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Philadelphia Told to Rehire Teachers," Philadelphia, July 2: the ruling "Thursday"; Angelina Intille, Sadie T. Atkinson, Goldie E. Watson and Thomas Deacon; page not shown). To check: the opinion, its name and citation.'
      tags: [state:pa, city:philadelphia]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination
      when: July 2
      date: '1960-07-02'
      thread: elections-1960-nomination
      also: [press-and-broadcasting]
      c: 'Kennedy, by telegram to the three networks'' presidents, Stanton, Kintner and Goldenson, asks equal time under Section 315 to answer Truman, who spoke for "another duly announced candidate," Symington; suggests Tuesday or Wednesday evening.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 19 (Leo Egan, "Kennedy Demands Air Time to Reply," "Kennedy Seeking Air Time to Reply," Los Angeles, July 2: the telegram''s text). See [[cal.1960-07-02.elections-1960-2]]. Reply: [[cal.1960-07-02.elections-1960-nomination-2]]. Names: Kennedy, Truman, Symington.'
      tags: [name:kennedy-john-f, name:truman-harry-s, name:symington-william-s, name:stanton-frank]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-2
      when: July 2
      date: '1960-07-02'
      thread: elections-1960-nomination
      also: [press-and-broadcasting]
      c: 'CBS, by telegram to Kennedy, offers thirty minutes of television and radio for a spokesman of his choosing, July 4 or July 9, with questions from the press. Stanton: Section 315 does not apply, Truman not a candidate and his program a news interview; were Kennedy to reply in person, equal time would be owed every other candidate.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 19 ("C.B.S. Outlines Conditions": "last night"; the hours, July 4, 1 to 1:30 p.m., July 9, noon to 12:30). See [[cal.1960-07-02.elections-1960-nomination]]. Names: Kennedy, Truman.'
      tags: [name:stanton-frank, name:kennedy-john-f, name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-3
      when: July 2
      date: '1960-07-02'
      place: minneapolis
      thread: elections-1960-nomination
      c: 'Humphrey, in an interview: will not let his name go to the convention for Vice President in a contest; would, it is believed, accept it unopposed. His choice Freeman. "I''m a candidate for re-election to the Senate."'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 20 ("Humphrey Is Open to 2d Spot Draft," Minneapolis, July 2). Names: Humphrey, Freeman.'
      tags: [name:humphrey-hubert-h, name:freeman-orville-l, state:mn, city:minneapolis]
- add:
    entry:
      id: cal.1960-07-02.cuba
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: cuba
      also: [congress]
      c: Senate Finance shelves the House's bill extending the Sugar Act through 1961 and reports instead a resolution giving the President authority to cut Cuba's quota until Jan. 1, 1961. Senate adopts it, 84–0.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 20 (Russell Baker, "Congress Recess Delayed by Fight over Cuba Sugar," "Congress Recess Snarled by Fight"). To check: 106 Cong. Rec. (1960), the day''s pages. Reply: [[cal.1960-07-02.cuba-2]]. See [[cal.1960-06-29.cuba]].'
- add:
    entry:
      id: cal.1960-07-02.cuba-2
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: cuba
      also: [congress]
      c: House, reconvened about 10 p.m., by a unanimous shouting vote sends the Senate's sugar resolution back, unconstitutional, revenue measures the House's to originate.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 20 (Baker, "Congress Recess Snarled by Fight"). To check: 106 Cong. Rec. (1960), the day''s pages. See [[cal.1960-07-02.cuba]].'
      time: 1960-07-03T02:00Z
      time_approx: true
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-03.cuba
      when: July 3
      date: '1960-07-03'
      place: washington
      thread: cuba
      also: [congress]
      c: Senate, after 2 a.m., passes a compromise sugar bill by voice vote, the key test 30–29.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1 (Baker, "Congress Recess Delayed by Fight over Cuba Sugar," Washington, Sunday, July 3). Check: the bill''s terms and the test vote''s question; the *Times* of July 4. To check: 106 Cong. Rec. (1960), the day''s pages. See [[cal.1960-07-02.cuba-2]]. Law: [[cal.1960-07-06.cuba-2]].'
      time: 1960-07-03T06:00Z
      time_approx: true
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-02.confirmations
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: confirmations
      also: [civil-rights-the-executive]
      c: 'Senate confirms Robert S. Rankin, of Duke, to the Civil Rights Commission, over Southern noes; Winthrop G. Brown ambassador to Laos, Andrew G. Lynch to the Somali Republic, Clare H. Timberlake to the Congo; Jacob Mishler and Frederick W. Kaess district judges; Edward C. Sweeney to the Subversive Activities Control Board; Carl J. Stephens general counsel of Agriculture. Earlier, 247 postmasters.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Rights'' Board Aide Approved by Senate," Washington, July 2, AP: "tonight"; page not shown). To check: Senate Executive Journal (1960). Names: Brown.'
      tags: [name:brown-winthrop-g]
- add:
    entry:
      id: cal.1960-07-02.foreign-aid
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: foreign-aid
      c: House, on Anderson's plea, votes $73,667,700, the first payment to the International Development Association, 137–100 standing, Albert Thomas leading; most Republicans against. Senate had approved it July 1.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Loan Fund Voted," Washington, July 2, UPI: Anderson''s call and letter to Appropriations; page not shown). To check: 106 Cong. Rec. (1960), the day''s pages. Names: Anderson.'
      tags: [name:anderson-robert-b]
- add:
    entry:
      id: cal.1960-07-02.immigration
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: immigration
      c: Congress completes the compromise refugee bill, Senate then House; to the White House. European refugees up to a quarter of those the thirty-eight other nations resettle; the conferees drop the Senate's 4,500 from the Middle East and the Far East.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 20 ("Immigration Bill Voted," Washington, July 2, AP). To check: the bill''s number; 106 Cong. Rec. (1960).'
- add:
    entry:
      id: cal.1960-07-02.testing
      when: July 2
      date: '1960-07-02'
      place: moscow
      thread: testing
      also: [soviet-union]
      c: The United States' note, delivered to the Soviet Foreign Ministry, answering Khrushchev's of June 27 on the Geneva walkout. The fault the Soviet Union's; talks should resume.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 2 (William J. Jorden, "U.S. Blames Soviet for Snag on Arms; Urges New Talks," Washington, July 2: delivered "this morning"; the text, at 2). To check: *Documents on Disarmament, 1960*. See [[cal.1960-06-27.testing]]. Names: Khrushchev.'
      tags: [name:khrushchev-nikita-s]
- add:
    entry:
      id: cal.1960-07-02.defense
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: defense
      c: Douglas, Deputy Secretary of Defense, orders old defense records declassified by stages, downgraded each twelve years, the most sensitive excepted.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 8 ("Pentagon to Cut Secrecy of Files," Washington, July 2, UPI: Murray Snyder, in charge of the project, on the 1958 step). See [[cal.1960-07-02.congress]]. Names: Douglas.'
      tags: [name:douglas-james-h-jr]
- add:
    entry:
      id: cal.1960-07-02.congress
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: congress
      also: [press-and-broadcasting]
      c: 'House Government Information subcommittee files its report on five years of inquiry: agencies "from the White House down" withhold more from Congress and the public, claiming executive privilege, despite the 1958 law. Hoffman, Republican, dissents.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 8 ("Pentagon to Cut Secrecy of Files"). To check: the report, H. Rept., 86th Cong. Names: Moss.'
      tags: [name:moss-john-e]
- add:
    entry:
      id: cal.1960-07-02.conservation
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: conservation
      c: Kerr, chairman of the Senate Select Committee on National Water Resources, makes public the Reclamation Bureau's $22 billion plan for the West's water over forty years, 17 million acres more under irrigation by 2000.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Senators Receive a 22-Billion Plan for Conservation," Washington, July 2, AP; page not shown). Names: Kerr.'
      tags: [name:kerr-robert-s]
- add:
    entry:
      id: cal.1960-07-02.soviet-union
      when: July 2
      date: '1960-07-02'
      place: vienna
      thread: soviet-union
      also: [soviet-union-u2, japan]
      c: Khrushchev, at the Hofburg before the Austro-Soviet Society, on the U-2 and on the cancelled visit to Japan; American prestige low.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 2 (M. S. Handler, "U.S. Prestige Low, Khrushchev Says," Vienna, July 2). Check: the hall and the words, from the clipping. Names: Khrushchev.'
      tags: [name:khrushchev-nikita-s]
- add:
    entry:
      id: cal.1960-07-02.europe-and-the-alliance-france
      when: July 2
      date: '1960-07-02'
      place: paris
      thread: europe-and-the-alliance-france
      c: 'Auriol''s letter of May 25 to Léon Noël, president of the Constitutional Council, published: de Gaulle''s acts unconstitutional, the council not consulted (the school aid, the refusal of a special session in March, the Community''s revision); he will no longer sit.'
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html), at 1, 10 (Robert C. Doty, "Auriol Terms Acts of de Gaulle Illegal," "Auriol in Protest Says de Gaulle Commits Unconstitutional Acts," Paris, July 2). Names: de Gaulle.'
      tags: [name:de-gaulle-charles]
- add:
    entry:
      id: cal.1960-07-02.europe-and-the-alliance
      when: July 2
      date: '1960-07-02'
      place: rome
      thread: europe-and-the-alliance
      c: Italy. The neo-Fascist Italian Social Movement withdraws its support from Tambroni's government, its Genoa congress banned. Tambroni with Gronchi.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) (Paul Hofmann, "Italian Neo-Fascists Announce They''ll Cease to Back Tambroni," Rome, July 2; page not shown).'
- add:
    entry:
      id: cal.1960-07-02.latin-america
      when: July 2
      date: '1960-07-02'
      place: washington
      thread: latin-america
      also: [latin-america-dominican-republic]
      c: Venezuela, through Falcón Briceño, its ambassador, asks the OAS Council's president, Sánchez Gavito, for a meeting of foreign ministers on its charge against the Dominican Republic, the bomb of June 24. The Dominican Republic proclaimed in a state of national emergency.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Venezuela Presses Dominican Charge," Washington, July 2, AP: "tonight"; Ciudad Trujillo, July 2, UPI; page not shown). See [[cal.1960-06-24.latin-america]]. Names: Betancourt.'
      tags: [name:betancourt-romulo]
- add:
    entry:
      id: cal.1960-07-02.japan
      when: July 2
      date: '1960-07-02'
      place: tokyo
      thread: japan
      c: Liberal Democratic leaders agree on a party convention July 13 to elect Kishi's successor. In Tokyo, by the police count, 22,000 of an expected 225,000 demonstrate.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) (Richard J. H. Johnston, "Demonstration Draws 22,000 of 225,000 Expected in Japan," Tokyo, July 2; page not shown). Check: whose count. Names: Kishi.'
      tags: [name:kishi-nobusuke]
- add:
    entry:
      id: cal.1960-07-02.south-asia
      when: July 2
      date: '1960-07-02'
      thread: south-asia
      also: [india-and-china-kashmir]
      c: Nehru begins a five-day visit to Kashmir and Ladakh, Srinagar and Leh.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Nehru Starts Visit to Disputed Areas," New Delhi, July 2; page not shown). Names: Nehru.'
      tags: [name:nehru-jawaharlal]
- add:
    entry:
      id: cal.1960-07-02.white-house
      when: July 2
      date: '1960-07-02'
      place: gettysburg
      thread: white-house
      c: Eisenhower plays thirty-six holes at the Gettysburg Country Club, with William E. Robinson, Arthur Nevins, Dick Slechter and George E. Allen.
      n: '[*New York Times*, July 3, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/03/issue.html) ("Eisenhower Golfs," Gettysburg, Pa., July 2, AP: six hours; page not shown). Names: Eisenhower.'
      tags: [name:eisenhower-dwight-d, state:pa, city:gettysburg]
