      c: 'Chen Yi 陈毅 and his wife, Zhang Qian 张茜, give a banquet for the delegation of Cambodia''s National Assembly at the opening of the China–Cambodia air service, led by Prince Sisowath Pola 西梳瓦·波拉西 (so printed), and the other Cambodian friends on the first flight; he speaks: the air service a further step in the two countries'' friendship; admiration for Prince Sihanouk''s defense of Cambodia''s territory and sovereignty and of peace in Southeast Asia.'
