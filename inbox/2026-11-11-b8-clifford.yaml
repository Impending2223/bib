patch: 2026-11-11-b8-clifford
by: 'Claude (batch 8: Clifford, Counsel to the President, the "already in" rows read against the calendar), Nov. 11, 2026'
ops:
- add:
    entry:
      id: cal.1964-10-14.elections-1964-jenkins
      when: Oct. 14
      date: '1964-10-14'
      thread: elections-1964-jenkins
      c: 'Fortas and Clifford ask three editors to hold the story of Jenkins''s arrest of Oct. 7: Noyes of the *Washington Star*, who will hold it if no one else prints it; the *Daily News*, which agrees to withhold it; Wiggins of the *Post*, who gives no commitment until he can assess the matter. They decide to tell no one in the White House, the President included. By Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 399–401 (Fortas''s call shortly before 10 a.m.; the *Star*, the *News*, the *Post*; no one in the White House told). See [[cal.1964-10-14.elections-1964]]. Names: Fortas, Clifford, Wiggins, Jenkins. Check: the hours; Clifford gives none but "shortly before 10 a.m." for Fortas''s call.'
      tags:
      - name:fortas-abe
      - name:clifford-clark
      - name:wiggins-james-r
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1968-03-11.vietnam-205000-2
      when: Mar. 11
      date: '1968-03-11'
      thread: vietnam-205000
      c: 'Johnson to Clifford by telephone, the morning after the *Times*'' story of the troop request: a personal betrayal by someone in the Administration, he is sure a civilian in the Pentagon; Clifford to investigate. He tries to convince himself that he rejected the request the week before; by Clifford''s account he had not.'
      n: '[[w.clifford-counsel-to-the-president-2]], 501 (the call "the next morning"; the betrayal; the Pentagon civilian; the request not rejected). See [[cal.1968-03-10.vietnam]]. Names: Johnson, Clifford. Check: the hour of the call.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
- add:
    entry:
      id: cal.1965-07-26.vietnam-air-war-2
      when: July 26
      date: '1965-07-26'
      thread: vietnam-air-war
      also:
      - vietnam-july-decision
      c: 'The White House, the evening, the same group as in the day''s meetings, now "in effect a war council": whether to attack the surface-to-air missile sites in North Vietnam. Clifford argues strongly to take them out "with whatever means were available." By Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 421–22. See [[cal.1965-07-26.vietnam-july-decision]]. To check: FRUS 1964–68, III, doc. 90 (the decision of July 26, cited under [[cal.1965-07-27.vietnam-2]]). Names: Clifford. Check: the hour and who attended; Clifford says only "the same group."'
      tags:
      - name:clifford-clark
