      c: Washington, the Congressional Hotel. Humphrey asks Schlesinger to look at his speech for the Jefferson-Jackson Day dinner. Both think it too crude and direct in its attack on Nixon. Schlesinger rewrites it at the typewriter; Humphrey uses it in the evening with minor changes.
