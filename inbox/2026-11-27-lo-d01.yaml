- edit:
    id: cal.1960-03-18.china-leadership
    base: 06bb9b92
    kind: correct
    set:
      c: Hangzhou, the Hangzhou Hotel, evening.{1} Mao receives B. P. Koirala, Prime Minister of Nepal.{2} China wants not an inch of Nepal's land, or India's; the boundary to be marked, with a strip on both sides unpatrolled and no regular troops; a treaty of friendship and nonaggression like Burma's if Nepal wishes; self-reliance first.{3}
      src:
        c: '19372896'
        rows:
        - 'w.zedong-mao-zedong-nianpu IV, Mar. 18, 1960: 1, 2, 3'
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 134–135: 2'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 18, 1960. [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 134–135 (Mar. 11–24, 1960; Mao and Liu receive Koirala, the day not given). The nianpu gives the morning''s talk with Zhou Enlai and Chen Yi on Nepal as an item of its own: [[cal.1960-03-18.china-mao-foreign]]. Made public: 2001. Check: the book gives Mao''s words to Koirala, with no day: China is in no hurry to enter the U.N. (it can wait ten years, then ten more); that China invaded India is untrue, a year''s quarrel with India being among friends, and the one real quarrel in the world is with the United States, which holds Taiwan and calls China an "aggressor"; the entry''s talk at Hangzhou may be where. Names: Mao Zedong, Koirala.'
