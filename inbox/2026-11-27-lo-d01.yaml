      - vis:only:prc+burma
- edit:
    id: cal.1960-01-28.china-leadership-7
    base: 19da9e81
    settles:
    - 'Check: the day:'
    set:
      n: '[[w.peng-dehuai-nianpu]], 758. Made public: 1998. Names: Peng Zhen, Peng Dehuai, Yang Shangkun. Check: the day: the nianpu puts the call "in the Spring Festival" under Jan. 28, the lunar New Year, but Yang Shangkun''s diary has him on the special train from Peking on Jan. 24, at Guangzhou on Jan. 26–28 (Jan. 28: at Zhu De''s in the afternoon to pay a New Year call) and at Hainan from Jan. 29 ([[w.yang-shangkun-riji]], I, 473–74), and the Peng Zhen chronology has Peng Zhen leave with him on the 24th (IV, 3): the call is not Jan. 28 for both men; it falls before Jan. 24, or after their return ([[cal.1960-01-24.china-leadership-6]], [[cal.1960-01-28.china-leadership-5]]).'
- edit:
    id: cal.1960-01-30.china-leadership
    base: 5d3bf61e
    kind: correct
    set:
      c: 'Zhou Enlai with Chen Yi again to the Soviet Ambassador: the Soviet Central Committee''s leaning to India in the Sino-Indian boundary dispute is wrong; the Sino-Soviet difference is one finger of ten and should not hurt the two parties'' unity.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 286 (Jan. 30, 1960). The nianpu puts the meeting at Liu Shaoqi''s on the afternoon before this talk (II, 286): [[cal.1960-01-29.china-liu]]. Made public: 1997. Names: Zhou Enlai, Chen Yi, Chervonenko, Liu Shaoqi.'
