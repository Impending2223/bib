      c: 'On the special train at Hengyang 衡阳, afternoon. Mao 毛泽东 talks with Ning Sheng 宁生, secretary of the prefectural committee, Yang Xingzhou 杨兴洲, secretary of the city committee, the secretary of the party committee of Depot 445 and others. Ning reports on Yingpi commune 英陂公社, Hengyang county: seven households run family pig teams, one young couple with three children raising 207 pigs. Mao: the method is good, quick, yields many pigs; to be spread.'
