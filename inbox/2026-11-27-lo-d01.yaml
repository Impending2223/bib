      n: '[[w.yang-shangkun-riji]], I, 489 (Mar. 18, 1960; 7 to 11 p.m.); [[w.zhou-enlai-nianpu-1949]], II, 295 (Mar. 18, 1960; Zhou back in Peking, attends the Politburo meeting Liu presides, on foreign affairs and the Congress); [[w.peng-zhen-nianpu-1902]], IV, 9 (Mar. 18, 1960; the Politburo passes the three reports for the Congress). Made public: 1996. To check: [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 481. See [[cal.1960-03-18.china-leadership-2]]. Names: Liu Shaoqi, Zhou Enlai, Peng Zhen, Yang Shangkun.'
