      c: Peking, Wucheng Hall 武成殿, Zhongnanhai 中南海, 10 a.m. Zhou Enlai's second talk with Ne Win. The exchange of notes to be rewritten as an agreement, drafted by officials of both sides from the record of the talks and Ne Win's amendments; the friendship treaty to be drafted by men each side names. Chen Yi takes part.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 282 (Jan. 26, 1960); [[w.zhou-enlai-waijiao-huodong]], 270 (Jan. 26, 1960; 上午10时, 中南海武成殿); [[w.chen-yi-nianpu]], 802 (Jan. 26, 1960, morning; Chen Yi at the talks of Zhou Enlai and Ne Win). Made public: 1993. See [[cal.1960-01-25.china-leadership]]. Names: Zhou Enlai, Ne Win, Chen Yi.'
      time: 1960-01-26T02:00Z
      time_zone: Asia/Shanghai
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:ne-win
      - name:chen-yi
