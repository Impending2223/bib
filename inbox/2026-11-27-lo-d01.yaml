    set:
      c: Mao, 3 a.m., orders his confidential secretary Gao Zhi to print nine copies of the Guangdong committee's directive of Feb. 25 for Zhou Enlai, Li Fuchun, Kang Sheng, Hu Qiaomu and the five first secretaries studying at Conghua, to be discussed on the afternoon of Mar. 3 and spread in the provinces. The directive names five problems in the communes.
      time: 1960-03-01T19:00Z
      time_zone: Asia/Shanghai
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 49–54 (Mar. 2, 1960, 3 a.m.; notes at 51–54). The hour: the manuscript''s date line, "三月二日上午三时" (XV, 49); the second act the same page gives, at 6 a.m., is an entry of its own. Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Guangdong Provincial Committee, directive of Feb. 25, 1960 on some problems in current people''s commune work, sent to the Guangzhou and Hainan committees and all prefectural, municipal and county committees and to the Center and Mao (cited by [[w.jianguo-yilai-mao-zedong]], XV, 52 n.2a). See [[cal.1960-03-01.china-leadership-2]]. Names: Mao Zedong, Zhou Enlai, Li Fuchun, Kang Sheng, Gao Zhi, Hu Qiaomu.'
