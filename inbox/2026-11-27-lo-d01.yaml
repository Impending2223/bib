      c: 'Montgomery, Ala. The *Montgomery Advertiser*, in a survey of local leaders on the ruling in *White v. Crook* that women may sit on Alabama juries: a League of Women Voters president, her first reaction laughter; the head of a Republican ladies'' club, women can learn to serve; a district attorney, the language in court may be rough.'
      n: '[[w.branch-at-canaans-edge]], 437–38; 889 (the note: the League president''s words, *Montgomery Advertiser*, Feb. 12, 1966). To check: *Montgomery Advertiser*, Feb. 12, 1966 (cited by [[w.branch-at-canaans-edge]], 889). Check: the day of the club head''s and the attorney''s words, which the note does not date. See [[cal.1966-02-07.alabama]]. Names: none.'
      tags:
      - polity:us
      - state:alabama
      - city:montgomery
