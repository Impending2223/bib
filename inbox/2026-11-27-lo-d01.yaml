- edit:
    id: cal.1960-01-24.china-leadership
    base: b37fa046
    set:
      time: 1960-01-23T18:00Z
      time_zone: Asia/Shanghai
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 24, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 27 (Jan. 24, 1960, 2 a.m.). The hour: 2 a.m., by the date line of the manuscript ("一月二十四日上午二时", [[w.jianguo-yilai-mao-zedong]], XV, 27); the Mao nianpu has "晨". Made public: 2013. To check: Chinese Foreign Ministry, note to the Indian Embassy in China, Dec. 26, 1959, restating the facts of the boundary and proposing settlement by negotiation (cited by [[w.jianguo-yilai-mao-zedong]], XV, 27 n.2a). Names: Mao Zedong, Zhou Enlai.'
