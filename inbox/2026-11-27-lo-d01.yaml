- edit:
    id: cal.1960-01-25.china-leadership
    base: 392e05a4
    kind: correct
    set:
      when: Jan. 25
      c: 'Zhou Enlai talks with Ne Win on the boundary.{1} Proposals: the northern undefined sector by the watershed, except Pianma, Gulang, Gangfang and the Dulong valley, then surveyed and marked; the three areas returned to China, their size for a joint commission; the Namwan leased area left to Burma in exchange for the Panghung and Panlao tribes'' lands west of the 1941 line to China; a boundary treaty and a friendship treaty to be drafted by the commission.{2}'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281–82 (Jan. 25, 1960); [[w.zhou-enlai-waijiao-huodong]], 270 (Jan. 25, 1960; 上午10时15分, 中南海武成殿); [[w.zhou-enlai-waijiao-huodong]], 270 (Jan. 26, 1960; 上午10时, 中南海武成殿: the second talk, its own entry); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 131 (Jan. 24–28, 1960; Ne Win''s visit on invitation; Zhou''s talks on the matters of common concern, the friendship and boundary questions); [[w.chen-yi-nianpu]], 802 (Jan. 26, 1960, morning; Chen Yi at the second talk). The second talk, Jan. 26, is [[cal.1960-01-26.china-zhou-foreign]], which the nianpu (II, 282) and the Waijiao huodong (270) give a day of its own. Made public: 1993. Names: Zhou Enlai, Ne Win.'
      src:
        c: d3908a96
        rows:
        - 'w.zhou-enlai-nianpu-1949 II, 281–82: 1, 2'
        - 'w.zhou-enlai-waijiao-huodong 270: 1, time'
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 131: 1'
        - 'w.chen-yi-nianpu 802: ?'
- add:
    entry:
      id: cal.1960-01-26.china-zhou-foreign
      when: Jan. 26
      date: '1960-01-26'
      place: peking
      thread: china-zhou-foreign
      also:
      - china-foreign
      c: Peking, Wucheng Hall 武成殿, Zhongnanhai 中南海, 10 a.m. Zhou Enlai's second talk with Ne Win. The exchange of notes to be rewritten as an agreement, drafted by officials of both sides from the record of the talks and Ne Win's amendments; the friendship treaty to be drafted by men each side names. Chen Yi takes part.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 282 (Jan. 26, 1960); [[w.zhou-enlai-waijiao-huodong]], 270 (Jan. 26, 1960; 上午10时, 中南海武成殿); [[w.chen-yi-nianpu]], 802 (Jan. 26, 1960, morning; Chen Yi at the talks of Zhou Enlai and Ne Win). Made public: 1993. See [[cal.1960-01-25.china-leadership]]. Names: Zhou Enlai, Ne Win, Chen Yi.'
      time: 1960-01-26T02:00Z
      time_zone: Asia/Shanghai
      tags:
