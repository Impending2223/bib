        - 'w.peng-zhen-nianpu-1902 IV, 9: ?'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 295 (Mar. 18, 1960); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 481 (Mar. 18, 1960; Liu presides; the Politburo discusses and passes the reports and drafts for the Congress''s second session: the report on the draft 1960 plan, the draft plan''s outline, the report on the 1959 accounts and 1960 budget draft); [[w.yang-shangkun-riji]], I, 489 (Mar. 18, 1960; 7 to 11 p.m.; the Sino-Nepalese boundary, the preparations for the Congress and its two reports, six documents Mao had sent); [[w.peng-zhen-nianpu-1902]], IV, 9 (Mar. 18, 1960; Peng Zhen at the Politburo meeting, which adopts for the NPC the report on the 1960 plan, the plan''s summary and the report on the 1959 final accounts and the 1960 budget). The Politburo meeting, 7 to 11 p.m., is [[cal.1960-03-18.china-liu]]. The return is before the match: Zhou was at Hangzhou with Mao that morning ([[cal.1960-03-18.china-leadership]]) and watched the match in Peking ([[cal.1960-03-18.china-leadership-3]]). Made public: 1996. Names: Zhou Enlai, Liu Shaoqi.'
