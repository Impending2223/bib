- edit:
    id: cal.1960-01-23.china-leadership
    base: 3655867e
    kind: correct
    set:
      c: Zhou Enlai flies to Hangzhou.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281 (Jan. 22, 1960; the flight the next day). The nianpu has the flight, then the talk with Mao, in one sentence (II, 281); the talk is its own entry. Made public: 1997. Names: Zhou Enlai.'
- tag:
    id: cal.1960-01-23.china-leadership
