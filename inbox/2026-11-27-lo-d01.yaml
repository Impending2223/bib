- edit:
    id: cal.1960-01-23.china-leadership
    base: 3655867e
    kind: correct
    set:
      c: Zhou Enlai flies to Hangzhou.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281 (Jan. 23, 1960). The talk with Mao is its own entry, [[cal.1960-01-23.china-zhou]] ([[w.zedong-mao-zedong-nianpu]], IV, Jan. 23, 1960: the afternoon). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
- cite:
    id: cal.1960-01-23.china-leadership
    item: '[[w.yang-shangkun-riji]], I, 472 (Jan. 22, 1960; Zhou to fly to Hangzhou the next day for Mao''s instructions)'
- add:
    entry:
      id: cal.1960-01-23.china-zhou
      when: Jan. 23
      date: '1960-01-23'
      place: hangzhou
      thread: china-zhou
      also:
      - china-mao
      c: Hangzhou 杭州, Liu Zhuang 刘庄, afternoon. Zhou Enlai talks with Mao 毛泽东. He reports the meeting of the Politburo Standing Committee at Liu Shaoqi's the evening before, at Diaoyutai 钓鱼台, on China and Burma and other matters.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 23, 1960. [[w.zhou-enlai-nianpu-1949]], II, 281 (Jan. 22–23, 1960; the flight, then the talk with Mao). Made public: 2013. See [[cal.1960-01-22.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi.'
      time_range:
      - 1960-01-23T04:00Z
      - 1960-01-23T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
      range_basis: record
      tags:
