- add:
    entry:
      id: cal.1960-01-23.china-zhou
      when: Jan. 23
      date: '1960-01-23'
      place: hangzhou
      thread: china-zhou
      also:
      - china-mao
      c: Hangzhou 杭州, Liu Zhuang 刘庄, afternoon. Zhou Enlai, come from Peking for instructions, talks with Mao 毛泽东. He reports the meeting of the Politburo Standing Committee that Liu Shaoqi called at Diaoyutai 钓鱼台 the evening before, on China and Burma and other matters.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 23, 1960. [[w.zhou-enlai-nianpu-1949]], II, 281 (Jan. 22, 1960; the talk with Mao after the flight; no hour). Made public: 1997. See [[cal.1960-01-22.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi.'
      time_range:
      - 1960-01-23T04:00Z
      - 1960-01-23T10:00Z
      time_band: afternoon
      time_zone: Asia/Shanghai
      range_basis: record
      tags:
