      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 6, 1960. [[w.yang-shangkun-riji]], I, 468 (Jan. 6, 1960; Mao at the club, noon to 2 p.m., the Standing Committee on the meeting''s agenda; to open the next day); [[w.deng-xiaoping-nianpu-1904]], III, 1525 (Jan. 6, 1960; Deng attends, at noon); [[w.zhu-de-nianpu-xinbian]], III, 1760 (Jan. 6, 1960, afternoon; Zhu De 朱德 at the meeting of the Politburo Standing Committee 中共中央政治局常委 at Shanghai 上海). The hour: noon to 2 p.m., by the diary (I, 468); the Mao nianpu and the Zhu De nianpu have the afternoon, the Deng nianpu noon. Made public: 2013. Check: Made public: the diary printed the day in 2001 ([[w.shangkun-yang-shangkun-riji-2]]; reprinted [[w.yang-shangkun-riji]], I, 468), before the year the note gives. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Yang Shangkun, Ke Qingshi, Li Jingquan, Tao Zhu, Wang Renzhong, Ouyang Qin, Lin Tie, Zhang Zhongliang.'
