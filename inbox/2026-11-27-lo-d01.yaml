      n: '[[w.yang-shangkun-riji]], I, 486 (Mar. 7, 1960). The words: 7时半到12时半，主席接见大使; 接见完毕后……回留园已经早上2时了 (I, 486). The range: from the audience''s end, 12:30 a.m. Mar. 8, to the return at 2 a.m. The day: Mar. 7, the diary''s day (I, 486); the hours fall after midnight, Mar. 8. See [[cal.1960-03-07.china-leadership]]. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Mao Zedong.'
