    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 58–59 (Mar. 3, 1960, 4 a.m.; notes at 59–61); [[w.mao-zedong-zhuan]], V, ch. 66 n.3 (Mar. 3, the Jilin report forwarded; every province, municipality and region to sum up its experience on the technical revolution and report). The meeting: Mao''s notes plan it for the afternoon ("今日下午", XV, 58; "三日下午", XV, 55); Zhou Enlai had proposed "三日下午或晚上" and went to Mao''s "三日晚" ([[w.zhou-enlai-nianpu-1949]], II, 291); the Mao nianpu has it that evening ([[cal.1960-03-03.china-leadership]]). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66); the text in full, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the comrades at the afternoon meeting, by note 2 (XV, 60), are twenty-five (Zhou Enlai, Li Fuchun, Kang Sheng, Hu Qiaomu, Tao Zhu, the five Central-South first secretaries, ministers and others). To check: Jilin Provincial Committee, report of Feb. 26, 1960 to Mao and the Center on the movement for technical innovation and technical revolution (cited by [[w.jianguo-yilai-mao-zedong]], XV, 59 n.1a); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Jilin Provincial Committee''s report on the technical innovation and technical revolution movement (manuscript 手稿), Mar. 3, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.3). Names: Mao Zedong.'
