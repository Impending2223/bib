      - vis:only:prc+burma
- edit:
    id: cal.1960-01-28.china-leadership-7
    base: 19da9e81
    settles:
    - 'Check: the day:'
    set:
      n: '[[w.peng-dehuai-nianpu]], 758. Made public: 1998. Names: Peng Zhen, Peng Dehuai, Yang Shangkun. Check: the day: the nianpu writes the call "春节期间" (during the Spring Festival) under Jan. 28, the lunar New Year (758); but Yang Shangkun''s diary has him leave Peking on Jan. 24, at Guangzhou on Jan. 28 ([[cal.1960-01-28.china-leadership-5]]) and still travelling in Guangdong, Hubei, Henan and Anhui on Feb. 21 ([[w.yang-shangkun-riji]], I, 473–81), and the Peng Zhen nianpu has Peng Zhen leave with him on Jan. 24 and back in Peking on Feb. 27 ([[w.peng-zhen-nianpu-1902]], IV, 3–4); neither records the call in their days in Peking before Jan. 24 (I, 472–73; IV, 3). The call is not Jan. 28, nor in the festival''s days, for both men; no record read gives its day.'
- edit:
    id: cal.1960-01-30.china-leadership
    base: 5d3bf61e
    kind: correct
    set:
      c: 'Zhou Enlai with Chen Yi again to the Soviet Ambassador: the Soviet Central Committee''s leaning to India in the Sino-Indian boundary dispute is wrong; the Sino-Soviet difference is one finger of ten and should not hurt the two parties'' unity.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 286 (Jan. 30, 1960). The nianpu puts the meeting at Liu Shaoqi''s on the afternoon before this talk (II, 286): [[cal.1960-01-29.china-liu]]. Made public: 1997. Names: Zhou Enlai, Chen Yi, Chervonenko.'
