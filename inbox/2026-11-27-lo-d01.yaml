- edit:
    id: cal.1960-01-24.china-leadership
    base: b37fa046
    set:
      time: 1960-01-23T18:00Z
      time_zone: Asia/Shanghai
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 24, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 27 (Jan. 24, 1960, 2 a.m.). The hour: 2 a.m., by the date line of the manuscript ([[w.jianguo-yilai-mao-zedong]], XV, 27); the Mao nianpu has "晨", the morning. Made public: 2013. To check: Chinese Foreign Ministry, note to the Indian Embassy in China, Dec. 26, 1959, restating the facts of the boundary and proposing settlement by negotiation (cited by [[w.jianguo-yilai-mao-zedong]], XV, 27 n.2a). Names: Mao Zedong, Zhou Enlai.'
- edit:
    id: cal.1960-01-24.china-leadership-7
    base: 04aeb555
    settles:
    - 'Check: whether on Yang Shangkun'
    set:
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1527 (Jan. 24, 1960); [[w.peng-zhen-nianpu-1902]], IV, 3 (Jan. 24, 1960; Peng Zhen leaves Peking for Guangzhou by special train with Deng Xiaoping, Li Fuchun, Liu Lantao, Yang Shangkun, Hu Qiaomu and others). The words: 上午……二十六日上午 (III, 1527). The time is the first day''s. Made public: 2009 (the nianpu). Names: Deng Xiaoping. On the same special train as Yang Shangkun ([[cal.1960-01-24.china-leadership-6]]), by the Peng Zhen nianpu, IV, 3, which lists Deng, Li Fuchun, Liu Lantao, Yang and Hu Qiaomu together.'
- edit:
    id: cal.1960-01-25.china-leadership
    base: 392e05a4
    kind: correct
    set:
      when: Jan. 25
      c: 'Zhou Enlai talks with Ne Win on the boundary.{1} Proposals: the northern undefined sector by the watershed, except Pianma, Gulang, Gangfang and the Dulong valley, then surveyed and marked; the three areas returned to China, their size for a joint commission; the Namwan leased area left to Burma in exchange for the Panghung and Panlao tribes'' lands west of the 1941 line to China; a boundary treaty and a friendship treaty to be drafted by the commission.{2}'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281–82 (Jan. 25–26, 1960); [[w.zhou-enlai-waijiao-huodong]], 270 (Jan. 25, 1960; 上午10时15分, 中南海武成殿); [[w.zhou-enlai-waijiao-huodong]], 270 (Jan. 26, 1960; 上午10时, 中南海武成殿); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 131 (Jan. 24–28, 1960; Ne Win''s visit on invitation; Zhou''s talks on the matters of common concern, the friendship and boundary questions); [[w.chen-yi-nianpu]], 802 (Jan. 26, 1960, morning; Chen Yi takes part in the talks between Zhou Enlai and Ne Win). Made public: 1993. The second talk, Jan. 26, is [[cal.1960-01-26.china-zhou-foreign]]. Names: Zhou Enlai, Ne Win.'
      src:
        c: d3908a96
        rows:
        - 'w.zhou-enlai-nianpu-1949 II, 281–82: ?'
        - 'w.zhou-enlai-waijiao-huodong 270: 1'
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 131: 1'
        - 'w.chen-yi-nianpu 802: ?'
- add:
    entry:
      id: cal.1960-01-26.china-zhou-foreign
      when: Jan. 26
      date: '1960-01-26'
      place: peking
      thread: china-zhou-foreign
