- edit:
    id: cal.1964-10-14.elections-1964
    base: b8a187d2
    set:
      n: 'Statement by the President on Walter Jenkins, [1963–64 Pub. Papers 1354](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=594) (Oct. 15, 1964). [[w.dallek-flawed-giant]], 179–81 (not Hoover''s report); [[w.white-making-of-the-president-1965]], 367–71 (the *Newsweek* party, about 7 p.m., Oct. 7; the *Star* learns of it Tuesday, Oct. 13; Seib calls the White House Wednesday morning; the arrest of 1959; Quayle''s telephone poll Thursday finds no change); [[w.branch-pillar-of-fire]], 513–14, 517; [[w.goldberg-barry-goldwater]], 230–31 (Fortas sent for the resignation; Fortas and Clifford ask editors to hold the story; the Republicans tipped by the FBI within forty-eight hours, Goldwater told Oct. 12; Goldwater: "one of the sorriest rumors"; then only "thorough security checks"); [[w.kotz-judgment-days]], 225 (arrested Oct. 7 in a YMCA men''s room; hospitalized; the Pentagon''s copy of his Reserve ratings); [[w.bernstein-guns-or-butter]], 151–53 (by White and Clifford: Fortas and Clifford at the *Star*; Fortas obtains the resignation; Lady Bird Johnson''s statement). [[w.young-two-suns-of-the]], 191–92 (the arrests, Oct. 7 and 1959). [[w.clifford-counsel-to-the-president-2]], 399–402 (the arrest after the *Newsweek* party, Oct. 7; the charge of 1959; Fortas to the hospital for the resignation). Check: Kotz has the newspapers report the arrest Oct. 12 (225). To check: George Reedy OH, Dec. 20, 1968, LBJ Library; Jack Valenti OH, Feb. 19, 1971, LBJ Library; FBI interviews, LBJ Cross-References (interview of Oct. 16, 1964, p. 47), FBI; C. Douglas Dillon to Nicholas Katzenbach, Oct. 16, 1964, NSF: McGeorge Bundy File, LBJ Library (cited by [[w.dallek-flawed-giant]], 179–81); *U.S. News & World Report*, Oct. 26, 1964, at 54–56 (cited by [[w.branch-pillar-of-fire]], 513); [*New York Times*, Oct. 15, 1964](https://timesmachine.nytimes.com/timesmachine/1964/10/15/issue.html), at 1, 31 (cited by [[w.branch-pillar-of-fire]], 517); [*New York Times*, Oct. 16, 1964](https://timesmachine.nytimes.com/timesmachine/1964/10/16/issue.html), at 1, 20 (cited by [[w.branch-pillar-of-fire]], 517); [[w.kearns-lyndon-johnson-and-the]], 207–9 (cited by [[w.branch-pillar-of-fire]], 517); [[w.goldman-tragedy-of-lyndon-johnson]], 295–98 (cited by [[w.branch-pillar-of-fire]], 517); [[w.miller-lyndon]], 486–87 (cited by [[w.branch-pillar-of-fire]], 517); [[w.deloach-hoovers-fbi]], 384–87 (cited by [[w.branch-pillar-of-fire]], 517). After [[cal.1964-10-14.elections-1964-jenkins|the calls on the editors]]: Fortas and Clifford, done with the papers, reach the President about 4 p.m., and after the afternoon''s calls he lets Fortas go to the hospital for the resignation ([[w.clifford-counsel-to-the-president-2]], 400–01); White has it done before the story moved on the wires ([[w.white-making-of-the-president-1965]], 369). See [[cal.1964-09-07.elections-1964]]. Names: Jenkins, Johnson, Hoover. Check: Dallek gives the 1959 charge as "investigation of a suspicious person" (181). Check: the date of Hoover''s report.'
- edit:
    id: cal.1964-10-14.elections-1964-4
    base: d1d078b1
    set:
      n: '[[w.white-making-of-the-president-1965]], 368–69; [[w.branch-pillar-of-fire]], 517 (from Washington, that night: "My heart is aching...."); [[w.clifford-counsel-to-the-president-2]], 402 (the statement, quoted in part, "had reached"; not where it was made). After [[cal.1964-10-14.elections-1964-3|McNamara''s call to the Waldorf]], while Mrs. Johnson "was preparing" the statement ([[w.califano-triumph-and-tragedy-of]], 20), and after [[cal.1964-10-14.republican-party|the Republican statement]] put the story on the wires: White makes hers the first reaction once the story was public ([[w.white-making-of-the-president-1965]], 368). To check: "Statement of Mrs. Lyndon B. Johnson," Oct. 15, 1964, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 20 n.6). See [[cal.1964-10-14.elections-1964]]. Names: Lady Bird Johnson, Jenkins. Check: the day; the statement in the LBJ Library is dated Oct. 15 (cited by Califano, 20 n.6).'
