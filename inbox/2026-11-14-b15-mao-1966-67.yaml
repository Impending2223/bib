patch: 2026-11-14-b15-mao-1966-67
by: 'Claude (batch 15, reader 4, the PRC: *Mao Zedong nianpu, 1949–1976*, V (Jan.–Sept. 1966) and VI (Oct. 1966–Dec. 1967), from the owner''s Drive epub of the 2013 set), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1966-01-05.china-leadership
      when: Jan. 5
      date: '1966-01-05'
      thread: china-leadership
      c: 'Mao, Nanchang. Talks with Yang Shangkui, Fang Zhichun, Liu Junxiu and other Jiangxi leaders, Wang Dongxing present. On Luo Ruiqing: proud, sharp; offered a provincial post he refused; no longer fit for army work. The Party splits in two and survives; even a leader going bad is no cause for fear. On farming: go steady; buy no grain beyond the surplus; look into the petty levies, Fujian''s among them; Jiangxi to investigate and report to the Center.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 5, 1966. Made public: 2013. Names: Mao Zedong, Luo Ruiqing, Yang Shangkui, Fang Zhichun, Liu Junxiu, Bai Dongcai, Huang Zhizhen, Wang Dongxing.'
      tags: [name:mao-zedong, name:luo-ruiqing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-01-06.china-leadership
      when: Jan. 6
      date: '1966-01-06'
      thread: china-leadership
      also: [soviet-union]
      c: 'Mao reads the Center''s draft reply to the CPSU Central Committee''s letter of Nov. 28, 1965, which attacked the *Renmin ribao*–*Hongqi* editorial of Nov. 11 against the CPSU leaders'' "united action": "Very good." Best handed to the Soviet ambassador soon. The reply is sent Jan. 7.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 6, 1966. Made public: 2013. To check: the CPSU letter of Nov. 28, 1965 and the Center''s reply of Jan. 7, 1966 (named by the nianpu, not printed in it). Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-01-12.china-leadership
      when: Jan. 12
      date: '1966-01-12'
      thread: china-leadership
      c: 'Mao, Wuchang, hears Tao Zhu, Wang Renzhong, Chen Yu and Zhang Pinghua. Distribution is the third aspect of the relations of production. The Central-South''s farm targets (4-5-8, set for the Third Five-Year Plan) for 1970: ten more years will do, no forcing. Putting politics first does not mean dropping work. The general line stays unaltered. The Four Cleanups to end by 1968. Recalls his talk in Peking in Oct. 1965: if Peking turns revisionist, the provinces should rise as Cai E did against Yuan Shikai.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 12, 1966. Made public: 2013. Names: Mao Zedong, Tao Zhu, Wang Renzhong, Chen Yu, Zhang Pinghua.'
      tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-01-16.china-leadership
      when: Jan. 16
      date: '1966-01-16'
      thread: china-leadership
      c: 'Mao, Wuchang, talks with the secretaries of the Central-South Bureau and the provincial leaders. Approves the Hubei committee''s notice that politics commands economics, work and technique; eclecticism ("even-handed on every side") is the fault to watch.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 16, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-01.china-leadership
      when: Feb. 1
      date: '1966-02-01'
      thread: china-leadership
      c: 'Lin Biao, Suzhou, has Ye Qun telephone Liu Zhijian, deputy director of the PLA General Political Department: Jiang Qing came the day before; she is strong politically and expert in the arts; her views to be carried out in thought and in organization; the army''s art-and-literature papers to go to her.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 1, 1966. Made public: 2013. Names: Lin Biao, Ye Qun, Jiang Qing, Liu Zhijian.'
      tags: [name:lin-biao, name:ye-qun, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-02.china-leadership
      when: Feb. 2
      date: '1966-02-02'
      thread: china-leadership
      c: 'Shanghai. Jiang Qing, with Lin Biao''s consent, holds a forum on army literary and artistic work (to Feb. 20) and does most of the talking. The summary, revised by Zhang Chunqiao and Chen Boda and sent to Mao, says an anti-Party, anti-socialist black line opposed to Mao''s thought has ruled the arts for sixteen years, and calls for a socialist cultural revolution to root it out.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 2, 1966. Made public: 2013. Names: Jiang Qing, Lin Biao, Zhang Chunqiao, Chen Boda.'
      tags: [name:jiang-qing, name:lin-biao, name:zhang-chunqiao, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-03.china-leadership
      when: Feb. 3
      date: '1966-02-03'
      thread: china-leadership
      c: 'Mao, Wuchang, talks with Wang Renzhong. The Three Gorges project: do not speak too absolutely; perhaps build upstream first; Wang to report to the Center. Agrees to Wang''s plan to put Mao''s talks since 1958 in order; gives him the text of the Jan. 30, 1962 speech to the enlarged work conference, marked for revision.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 3, 1966. Made public: 2013. Names: Mao Zedong, Wang Renzhong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-03.china-leadership-2
      when: Feb. 3
      date: '1966-02-03'
      thread: china-leadership
      c: 'The Cultural Revolution Five-Man Group meets on the academic criticism since the attack on Wu Han''s *Hai Rui Dismissed from Office*: Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng and others, eleven in all; Zhou Yang absent. The draft "Outline Report on the Present Academic Discussion" (the February Outline) follows: the criticism is a long struggle, to go by argument and "letting go," with no hurried political verdicts; Wu Han''s case not to be confined to politics.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 3, 1966. Made public: 2013. To check: *Wenhua geming wuren xiaozu guanyu dangqian xueshu taolun de huibao tigang (caoan)* (文化革命五人小组关于当前学术讨论的汇报提纲(草案)), the Outline; the Group''s membership as note 4 gives it (Peng Zhen, Lu Dingyi, Kang Sheng, Zhou Yang, Wu Lengxi). Names: Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng, Zhou Yang, Wu Han.'
      tags: [name:peng-zhen, name:lu-dingyi, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-05.china-leadership
      when: Feb. 5
      date: '1966-02-05'
      thread: china-leadership
      c: 'Peking. The Politburo Standing Committee, Liu Shaoqi presiding, approves the Outline Report and tells the Five-Man Group to take it to Mao at Wuhan, who will decide.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 3, 1966 ("二月五日"). Made public: 2013. See [[cal.1966-02-03.china-leadership-2]]. Names: Liu Shaoqi, Peng Zhen.'
      tags: [name:liu-shaoqi, name:peng-zhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-05.china-leadership-2
      when: Feb. 5
      date: '1966-02-05'
      thread: china-leadership
      c: 'Mao to Jiang Qing, on seven papers Peng Zhen sent Feb. 1 about the *Hai Rui* question (editors'' meeting, Zhang Chunqiao''s telephoned views, Guan Feng''s drafts, a letter of Guo Moruo, Guan Feng''s and Deng Tuo''s essays of 1962, the Hai Rui memorials, the actors'' self-criticisms): keep them with you.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 5, 1966 ("同日"). Made public: 2013. Names: Mao Zedong, Jiang Qing, Peng Zhen, Zhang Chunqiao, Guan Feng, Guo Moruo, Deng Tuo.'
      tags: [name:mao-zedong, name:jiang-qing, name:peng-zhen, name:zhang-chunqiao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-05.china-leadership-3
      when: Feb. 5
      date: '1966-02-05'
      thread: china-leadership
      also: [soviet-union]
      c: 'Mao approves the Center''s draft reply to the Polish United Workers'' Party Central Committee''s letter of Dec. 28, 1965: the CCP will send no delegation to the summit of the Warsaw Pact states and the Asian socialist states'' parties that the PUWP proposed. "Agreed; do as drafted"; returned to Kang Sheng and Wu Lengxi.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 5, 1966 ("同日"). Made public: 2013. Names: Mao Zedong, Kang Sheng, Wu Lengxi.'
      tags: [name:mao-zedong, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-06.china-leadership
      when: Feb. 6
      date: '1966-02-06'
      thread: china-leadership
      c: 'Mao to Peng Zhen, on Wang Renzhong''s request of Feb. 4 to print the 7,000-cadres speech: the standing members in Peking, with Kang Sheng, Lu Dingyi and Chen Boda, to revise it and consider printing it for county and regiment cadres at the Central-South Bureau''s request, there only, as a trial. Real democratic centralism needs education, trials, spread, and long repetition, else it stays a phrase.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 6, 1966. Made public: 2013. Names: Mao Zedong, Peng Zhen, Wang Renzhong, Kang Sheng, Lu Dingyi, Chen Boda.'
      tags: [name:mao-zedong, name:peng-zhen, name:kang-sheng, name:lu-dingyi, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-08.china-leadership
      when: Feb. 8
      date: '1966-02-08'
      thread: china-leadership
      c: 'Mao, Wuchang, hears Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun and Hu Sheng on the Outline Report. A conclusion in two months: not possible even then. Guo Moruo and Fan Wenlan to be asked for a little self-criticism, not attacked. Wu Han may stay vice-mayor. Guan Feng''s essay of 1962: a matter for three years on. Told the Standing Committee has approved the Outline, he does not at once object. The Center circulates it Feb. 12.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 8, 1966. Made public: 2013. See [[cal.1966-02-03.china-leadership-2]]. Names: Mao Zedong, Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng, Guo Moruo, Fan Wenlan, Wu Han, Guan Feng.'
      tags: [name:mao-zedong, name:peng-zhen, name:lu-dingyi, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-09.china-leadership
      when: Feb. 9
      date: '1966-02-09'
      thread: china-leadership
      c: 'Mao, Wuchang, hears Kang Sheng and Tian Jiaying on editing vol. 5 of the *Selected Works*: start preparing; Tian to begin, the staff to grow later (Hu Qiaomu ill, Chen Boda on other work). The 7,000-cadres speech, revised often, to be read again at Wuchang, sent for Party discussion, then published.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 9, 1966. Made public: 2013. Names: Mao Zedong, Kang Sheng, Tian Jiaying, Hu Qiaomu, Chen Boda.'
      tags: [name:mao-zedong, name:kang-sheng, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-09.china-leadership-2
      when: Feb. 9
      date: '1966-02-09'
      thread: china-leadership
      also: [soviet-union]
      c: 'Mao, Wuchang, hears Wu Lengxi, for the standing members in Peking, on foreign affairs. The CPSU leaders'' words are stale, not worth ink; no answer now. On "highest and liveliest Marxism" and "peak of Marxism-Leninism" for Mao Zedong Thought, which the Peking standing members reject: keep the usage of the Tianjin meeting of March 1960, "Marxism-Leninism, Mao Zedong Thought"; both of Lin Biao''s formulas are wrong. Peng Zhen and Kang Sheng to tell Lin at Suzhou on leaving Wuhan.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 9, 1966. Made public: 2013. Names: Mao Zedong, Wu Lengxi, Lin Biao, Peng Zhen, Kang Sheng.'
      tags: [name:mao-zedong, name:lin-biao, name:peng-zhen, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-12.china-leadership
      when: Feb. 12
      date: '1966-02-12'
      thread: china-leadership
      c: 'Mao approves the revised text of his Jan. 30, 1962 speech (Peng Zhen''s report of Feb. 11: discussed twice, Wang Renzhong joining; small changes): "all read; do as proposed." Issued the same day to county and regiment Party committees.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 12, 1966. Made public: 2013. Names: Mao Zedong, Peng Zhen, Wang Renzhong.'
      tags: [name:mao-zedong, name:peng-zhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-12.china-leadership-2
      when: Feb. 12
      date: '1966-02-12'
      thread: china-leadership
      c: 'The Center circulates the Outline Report on the academic discussion.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 8, 1966 ("二月十二日，中共中央批转了这个提纲"). Made public: 2013. See [[cal.1966-02-08.china-leadership]].'
      tags: [polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-19.china-leadership
      when: Feb. 19
      date: '1966-02-19'
      thread: china-leadership
      c: 'Mao reads the Hubei Party committee''s Feb. 5 plan to mechanize farming in the province in five, seven and ten years, by its own machines. "Very good": to Liu Shaoqi, to issue to all provincial committees; each to draw a five-, seven- and ten-year plan on its own resources, from a few trials outward, and mechanize in about twenty-five years; the last ten years were not well handled. The Center issues his note and the plan Apr. 10. He leaves Wuhan that night for Changsha.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 19, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Wang Renzhong.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-21.china-leadership
      when: Feb. 21
      date: '1966-02-21'
      thread: china-leadership
      c: 'The Center''s notice on editing Mao''s works: put his main articles, talks and manuscripts since 1958 in order, batch by batch, as Party documents; vol. 5 of the *Selected Works* (1949–57) to be worked up from the 1960 editorial text and circulated for comment as soon as may be.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 21, 1966. Made public: 2013. To check: *Zhonggong zhongyang guanyu bianji Mao Zedong tongzhi zhuzuo de tongzhi* (中共中央关于编辑毛泽东同志著作的通知), Feb. 21, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-21.china-leadership-2
      when: Feb. 21–22
      date: '1966-02-21'
      thread: china-leadership
      c: 'Mao, Changsha, hears Ye Jianying, Yang Chengwu and others on military work. Luring the enemy deep worked against Japan, not now in Vietnam; the United States will not rush in; hold the first line some months, plan a second hand; defend coastal cities in depth, Stalingrad fashion; keep the army''s total strength; provincial public-security troops go under the military districts (a second force is a Soviet copy he never liked); agrees to Zhou Enlai''s and Deng Xiaoping''s plan to put industrial and construction units on a military footing in three to five years. On Mar. 27 he approves Lin Biao''s minute of the talk.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 21 afternoon and Feb. 22 morning, 1966 (the entry "2月21日下午、22日上午"). Made public: 2013. Names: Mao Zedong, Ye Jianying, Yang Chengwu, Zhou Enlai, Deng Xiaoping, Lin Biao.'
      tags: [name:mao-zedong, name:ye-jianying, name:zhou-enlai, name:deng-xiaoping, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-02-23.china-leadership
      when: Feb. 23
      date: '1966-02-23'
      thread: china-leadership
      c: 'Mao, Changsha, hears Zhang Pinghua, Wang Yanchun, Li Ruishan, Hua Guofeng and others on Hunan. Individual farming: four years unsettled, to be settled by spring 1968; landlords, rich peasants and many rich middle peasants take the capitalist road; in Shaoshan, Tian Jiaying''s 1962 team found 40 percent of households for dividing the land. A rise of about a tenth a year in output is much. On Hubei''s mechanization plan: widen its terms by five years.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 23, 1966. Made public: 2013. Names: Mao Zedong, Zhang Pinghua, Wang Yanchun, Li Ruishan, Hua Guofeng, Tian Jiaying.'
      tags: [name:mao-zedong, name:hua-guofeng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-12.china-leadership
      when: Mar. 12
      date: '1966-03-12'
      thread: china-leadership
      c: 'Mao to Liu Shaoqi, on farm mechanization, answering Liu''s letter of Mar. 11: the State Planning Commission''s small group to Hubei, every Center bureau and province to send people there for seven to ten days and draft five-, seven- and ten-year plans, for a work conference about Aug.–Sept.; mainly local self-reliance; provinces to keep 30 to 50 percent of output over plan in steel, machine tools and farm machinery; tie it to war readiness, famine readiness and "for the people"; Soviet farm policy drained the peasants. He marks the typed copy "not sent; to be discussed."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 12, 1966. Made public: Dec. 26, 1977 (*Renmin ribao*, "A Letter on Farm Mechanization"). Names: Mao Zedong, Liu Shaoqi.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-13.china-leadership
      when: Mar. 13
      date: '1966-03-13'
      thread: china-leadership
      also: [soviet-union]
      c: 'Mao, Hangzhou, to the Center, on the CPSU''s invitation to its 23rd Congress and the analysis by the Party committee at the embassy in Moscow: right. Do not go; the worst is a great anti-Chinese show, which shows the Soviets wrong. A brief reply giving reasons; a telegram of greetings doubtful; a critical article after the Congress. Flexibility is already large: state ties, trade, exchanges, letters; if the United States attacked the USSR and the USSR fought, China would back it. Asks the standing members to come on Mar. 17 to decide.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 13, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-17.china-leadership
      when: Mar. 17
      date: '1966-03-17'
      thread: china-leadership
      c: 'Hangzhou. Mao opens an enlarged meeting of the Politburo Standing Committee (to Mar. 20): Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Peng Zhen, Chen Boda, Kang Sheng, the bureaus'' first secretaries and Center department heads; Deng Xiaoping away on the northwest third-front tour. First session, afternoon: the case of Luo Ruiqing.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 17, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Peng Zhen, Chen Boda, Kang Sheng, Deng Xiaoping, Luo Ruiqing.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:zhu-de, name:lin-biao, name:peng-zhen, name:chen-boda, name:kang-sheng, name:deng-xiaoping, name:luo-ruiqing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-17.china-leadership-2
      when: Mar. 17
      date: '1966-03-17'
      thread: china-leadership
      c: 'Mao to Jiang Qing, having read the summary of her army forum twice and altered it: issue it in the Military Commission''s name, to some Center leaders for comment, first the Commission''s members. His changes: the title, "Summary of the Forum on Army Literary and Artistic Work Convened by Comrade Jiang Qing at Comrade Lin Biao''s Request"; cut the claims that his four works are "the peak of contemporary Marxist literary theory" and "enough for centuries" and that "the army was made by the Chairman"; the black line to be fought for decades, even centuries; the "national defense literature" slogan of the 1930s bourgeois, Lu Xun''s "mass literature of the national revolutionary war" proletarian; the Party''s mistake was to have taken up the matter late.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 17, 1966 ("三月上旬、17日、24日"). Made public: 2013. Names: Mao Zedong, Jiang Qing, Lin Biao.'
      tags: [name:mao-zedong, name:jiang-qing, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-18.china-leadership
      when: Mar. 18
      date: '1966-03-18'
      thread: china-leadership
      also: [soviet-union]
      c: 'Hangzhou. Mao speaks to the enlarged Standing Committee meeting. On the Party''s past: it has lived through many dangers; its heirs must change as well as inherit. On the academic criticism: Jian Bozan, Hou Wailu and others should be brought down, not too many; the Party has many hesitaters. Mao Zedong Thought as "highest and liveliest," "peak": not to be said. The 23rd Congress: not to go, no greetings telegram, simply tell them; Nov. 7 greetings stay; the mass bodies (women''s, youth, student, trade-union federations, peace congress) case by case. To Wu Lengxi at the close: the *Renmin ribao* printed muck, promoted ghost plays and praised Hai Rui; learn from it. The meeting decides to send no delegation to the 23rd Congress.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 18, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Peng Zhen, Wu Lengxi, Jian Bozan, Hou Wailu.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:peng-zhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-19.china-leadership
      when: Mar. 19
      date: '1966-03-19'
      thread: china-leadership
      c: 'Hangzhou. Mao to the enlarged Standing Committee meeting: read Lu Xun''s own writings, not translations, and make extracts; likewise Marx; Yang Rongguo of Zhongshan University proposed an anthology of the best of Marx, Engels, Lenin and Stalin. "Always right" does not exist: high procurement and blind commanding taught that.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 19, 1966. Made public: 2013. Names: Mao Zedong, Yang Rongguo.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-20.china-leadership
      when: Mar. 20
      date: '1966-03-20'
      thread: china-leadership
      c: 'Hangzhou. Mao to the enlarged Standing Committee meeting. Schools and universities are mostly held by bourgeois, petty-bourgeois and landlord-born people; the struggle is on in only 15 of 28 provinces and cities; five to ten years of criticism are needed to train successors. Do not suppress young writers'' articles; Guo Moruo and Fan Wenlan to be kept. The Propaganda Department not to be choked off, nor made another Rural Work Department. Farm mechanization to be tied to war and famine readiness.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 20, 1966. Made public: 2013. Names: Mao Zedong, Guo Moruo, Fan Wenlan.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-22.china-leadership
      when: Mar. 22
      date: '1966-03-22'
      thread: china-leadership
      also: [soviet-union]
      c: 'The Center sends the CPSU Central Committee a letter, approved by Mao: the CCP will send no delegation to the CPSU''s 23rd Congress.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 18, 1966, note 13. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, polity:ussr, vis:only:prc+ussr]
- add:
    entry:
      id: cal.1966-03-24.china-leadership
      when: Mar. 24
      date: '1966-03-24'
      thread: china-leadership
      c: 'Mao to Jiang Qing, returning the army forum summary after a third reading: all pieces seen, all agreed; a few additions and word changes in the text, the original returned to her.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 17, 1966 (the entry "三月上旬、17日、24日"). Made public: 2013. See [[cal.1966-03-17.china-leadership-2]]. Names: Mao Zedong, Jiang Qing.'
      tags: [name:mao-zedong, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-27.china-leadership
      when: Mar. 27
      date: '1966-03-27'
      thread: china-leadership
      c: 'Mao reviews the draft joint communiqué of the CCP and JCP delegations that Zhou Enlai and Peng Zhen send in the afternoon (drafted by the two sides'' groups from three talks in early March among Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng and Miyamoto Kenji). He rewrites the passage on the international united front against U.S. imperialism: the widest and truest, its base the revolutionary peoples.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 27, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Peng Zhen, Liu Shaoqi, Deng Xiaoping, Kang Sheng, Miyamoto Kenji.'
      tags: [name:mao-zedong, name:zhou-enlai, name:peng-zhen, name:liu-shaoqi, name:deng-xiaoping, name:kang-sheng, polity:prc, polity:japan, vis:only:prc+japan]
- add:
    entry:
      id: cal.1966-03-28.china-leadership
      when: Mar. 28
      date: '1966-03-28'
      thread: china-leadership
      c: 'Shanghai. Mao receives the JCP delegation under General Secretary Miyamoto Kenji and lunches with it, Kang Sheng, Zhao Yimin, Wei Wenbo and Zhao Anbo present. Communism cannot be built while imperialism stands; even with it down, the dead bourgeoisie corrupts Communists. China has many revisionists and many dogmatists, who worship foreign and Chinese dead; do not fear isolation or war.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 28, 1966. Made public: 2013. Names: Mao Zedong, Miyamoto Kenji, Kang Sheng, Zhao Yimin, Wei Wenbo, Zhao Anbo.'
      tags: [name:mao-zedong, name:kang-sheng, polity:prc, polity:japan, vis:only:prc+japan]
- add:
    entry:
      id: cal.1966-03-28.china-leadership-2
      when: Mar. 28–29
      date: '1966-03-28'
      thread: china-leadership
      c: 'Mao to Kang Sheng, Shanghai: the Peking municipal committee and the Propaganda Department shield bad men and should be dissolved; why may the Wu Han criticism not be tied to his dismissal and the Lushan conference? Peng Zhen is to stop shielding and apologize to Shanghai. The academic criticism by the mass line, with trial points, without the 1958 negation of everything.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 28, 1966. Made public: 2013. Names: Mao Zedong, Kang Sheng, Peng Zhen, Wu Han.'
      tags: [name:mao-zedong, name:kang-sheng, name:peng-zhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-03-29.china-leadership
      when: Mar. 29
      date: '1966-03-29'
      thread: china-leadership
      c: 'Shanghai. Mao receives the JCP delegation again: the communiqué will not come out; a news item will do; a communiqué is formalism, and issued now would please neither side.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 29, 1966. Made public: 2013. See [[cal.1966-03-28.china-leadership]]. Names: Mao Zedong, Miyamoto Kenji.'
      tags: [name:mao-zedong, polity:prc, polity:japan, vis:only:prc+japan]
- add:
    entry:
      id: cal.1966-03-30.china-leadership
      when: Mar. 30
      date: '1966-03-30'
      thread: china-leadership
      c: 'Shanghai. Mao to Kang Sheng, Zhao Yimin, Wei Wenbo, Zhang Chunqiao and Jiang Qing: why did the Propaganda Department need no word on Wu Han''s many reactionary pieces, yet had to be told of Yao Wenyuan''s? "Overthrow the King of Hell, free the little devils"; support the young Monkey Kings; the Tenth Plenum resolved on class struggle; when the Center is wrong the localities should attack the Center. If the Department will not support them, dissolve it.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 30, 1966. Made public: 2013. Names: Mao Zedong, Kang Sheng, Zhang Chunqiao, Jiang Qing, Yao Wenyuan, Zhao Yimin, Wei Wenbo, Wu Han.'
      tags: [name:mao-zedong, name:kang-sheng, name:zhang-chunqiao, name:jiang-qing, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04.china-leadership
      when: Apr.
      date: '1966-04'
      thread: china-leadership
      c: 'Mao reads Lin Yishan''s report of Mar. 9 to the Center and to him on building the Three Gorges project (the Yangtze Valley Planning Office; early start, in the Third or Fourth Five-Year Plan): "Read. A report from the other side is needed."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 1966 (the entry "4月"; no day). Made public: 2013. Names: Mao Zedong, Lin Yishan.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-02.china-leadership
      when: Apr. 2
      date: '1966-04-02'
      thread: china-leadership
      c: 'Zhou Enlai to Mao and the Secretariat: Kang Sheng, back Mar. 31, brought Mao''s instructions; with Peng Zhen and Kang he proposes a Secretariat meeting to raise the banner of proletarian cultural revolution and criticize reactionary academic thought in literature, history and philosophy, a Center notice to follow for Mao to see. The Five-Man Group''s report sent Mao is wrong; the group, enlarged with Shanghai and Peking people, to rewrite or discard it.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 2, 1966. Made public: 2013. Names: Zhou Enlai, Mao Zedong, Kang Sheng, Peng Zhen.'
      tags: [name:zhou-enlai, name:mao-zedong, name:kang-sheng, name:peng-zhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-09.china-leadership
      when: Apr. 9–12
      date: '1966-04-09'
      thread: china-leadership
      c: 'The Secretariat meets under Deng Xiaoping, Zhou Enlai attending. Kang Sheng conveys Mao''s criticism of the Five-Man Group''s Outline and criticizes Peng Zhen. Decided: a Center notice withdrawing the Outline; a document-drafting group for the cultural revolution, Chen Boda head, Jiang Qing and Liu Zhijian deputies, Kang Sheng adviser, members including Yin Da, Zhang Chunqiao, Chen Yading, Guan Feng, Qi Benyu, Wu Lengxi, Wang Li, Mu Xin and Yang Yongzhi. Zhou, Deng and Peng Zhen report to Mao.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 9, 1966. Made public: 2013. Names: Deng Xiaoping, Zhou Enlai, Kang Sheng, Peng Zhen, Chen Boda, Jiang Qing, Liu Zhijian, Yin Da, Zhang Chunqiao, Chen Yading, Guan Feng, Qi Benyu, Wu Lengxi, Wang Li, Mu Xin, Yang Yongzhi.'
      tags: [name:deng-xiaoping, name:zhou-enlai, name:kang-sheng, name:peng-zhen, name:chen-boda, name:jiang-qing, name:zhang-chunqiao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-10.china-leadership
      when: Apr. 10
      date: '1966-04-10'
      thread: china-leadership
      c: 'The Center issues the army forum summary with its note (Mao, early April, on the Apr. 1 draft: "read, agree"): the summary rightly treats the basic questions of class struggle on the art front, for the army and for the whole front. (The Center withdrew it May 3, 1979.)'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. (the entry "4月上旬") and note 22. Made public: 2013. Names: Mao Zedong, Jiang Qing, Lin Biao. Check: the nianpu''s heading is "early April"; the issue date, Apr. 10, is its own.'
      tags: [name:mao-zedong, name:jiang-qing, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-10.china-leadership-2
      when: Apr. 10
      date: '1966-04-10'
      thread: china-leadership
      c: 'The Center issues Wang Renzhong''s speech of Jan. 24 on putting politics first (Mao sent it Feb. 25 to Liu Shaoqi; the Center''s note, Mao: "agreed"): bonuses and other material incentives do not fit; rely on Mao Zedong Thought and the general line.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. (the entry "同旬", after "4月上旬") and Feb. 25, 1966. Made public: 2013. Names: Mao Zedong, Wang Renzhong, Liu Shaoqi.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-14.china-leadership
      when: Apr. 14
      date: '1966-04-14'
      thread: china-leadership
      c: 'Mao reads the Center General Office''s *Wendian zhaiyao* no. 168 on half-work, half-study at Peking''s arts schools. Every school and subject (primary to university, military, medical, arts, Party schools, language and diplomatic schools) to come "down from the building" to factories and villages, live and work with workers and peasants, study half and half, at most four to six; reading cut sharply; reading too much kills; teachers and students equal.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 14, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-14.china-leadership-2
      when: Apr. 14
      date: '1966-04-14'
      thread: china-leadership
      c: 'Mao revises, again and again to month''s end, the Center''s notice withdrawing the Five-Man Group''s Outline, from drafts of Zhou Enlai, Deng Xiaoping and Peng Zhen. On the 14th he sends Jiang Qing two Peking drafts, asks Kang Sheng and Chen Boda to go to Shanghai to discuss them with her, and to report to him at Hangzhou on the night of the 16th or the morning of the 17th; the text becomes the May 16 Circular.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 14, 17–30, 1966 (the entry "4月14日、17日至月底"). Made public: 2013. See [[cal.1966-02-12.china-leadership-2]]. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Peng Zhen, Jiang Qing, Kang Sheng, Chen Boda.'
      tags: [name:mao-zedong, name:zhou-enlai, name:deng-xiaoping, name:peng-zhen, name:jiang-qing, name:kang-sheng, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-16.china-leadership
      when: Apr. 16–24
      date: '1966-04-16'
      thread: china-leadership
      c: 'Hangzhou. Mao presides over an enlarged Standing Committee meeting, mainly to criticize Peng Zhen; also to dissolve the Five-Man Group and set up a new Cultural Revolution Group. Present: Liu Shaoqi (from Apr. 20, back from Pakistan, Afghanistan and Burma), Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Yi, Li Xiannian, Chen Boda, Kang Sheng, Nie Rongzhen, Ye Jianying, Xie Fuzhi, Xiao Hua, Li Jingquan, Tao Zhu, Li Xuefeng, Liu Lantao, Song Renqiong, Wei Wenbo and Jiang Hua.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 16, 1966. Made public: 2013. Names: Mao Zedong, Peng Zhen, Liu Shaoqi, Zhou Enlai, Lin Biao, Deng Xiaoping, Chen Yi, Li Xiannian, Chen Boda, Kang Sheng, Nie Rongzhen, Ye Jianying, Xie Fuzhi, Xiao Hua, Li Jingquan, Tao Zhu, Li Xuefeng, Liu Lantao, Song Renqiong, Wei Wenbo, Jiang Hua.'
      tags: [name:mao-zedong, name:peng-zhen, name:liu-shaoqi, name:zhou-enlai, name:lin-biao, name:deng-xiaoping, name:chen-yi, name:li-xiannian, name:chen-boda, name:kang-sheng, name:nie-rongzhen, name:ye-jianying, name:xie-fuzhi, name:li-jingquan, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-22.china-leadership
      when: Apr. 22
      date: '1966-04-22'
      thread: china-leadership
      c: 'Hangzhou. Mao to the enlarged Standing Committee meeting: not Wu Han alone; a struggle touching souls, with people "in the court" in the Center departments, bureaus and provinces, culture and propaganda offices, the Party and army above all. The Feb. 3 Outline was hurried; at Wuhan he rejected the talk of dealing with the left. "No breaking, no building": break, and give reasons. Revisionism may come early or late in China; it may come in the Party and army, not only in culture.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 22, 1966. Made public: 2013. Names: Mao Zedong, Wu Han.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-24.china-leadership
      when: Apr. 24
      date: '1966-04-24'
      thread: china-leadership
      c: 'Hangzhou. Mao presides over the enlarged Standing Committee meeting, which in the main approves the Center''s draft notice and the list of the Cultural Revolution Group, for the enlarged Politburo meeting.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 24, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-04-28.china-leadership
      when: Apr. 28
      date: '1966-04-28'
      thread: china-leadership
      c: 'Hangzhou. Mao to Chen Boda and Kang Sheng, on Peng Zhen: not a needle or a drop of water gets into Peking; Peng remolds the Party on his own world view and has prepared his fall; attack his errors thoroughly. Class struggle does not depend on will; dust unswept does not go.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 28, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda, Kang Sheng, Peng Zhen.'
      tags: [name:mao-zedong, name:chen-boda, name:kang-sheng, name:peng-zhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-04.china-leadership
      when: May 4–26
      date: '1966-05-04'
      thread: china-leadership
      c: 'Peking. The enlarged Politburo meeting, Liu Shaoqi presiding; Mao absent. On the line of the Hangzhou meeting of April it criticizes Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun for errors and ends their posts.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 4, 1966. Made public: 2013. To check: the Politburo meeting''s minutes and reports of May 4–26, 1966 (not printed in the nianpu); note 29 gives the rehabilitations (Peng, Feb. 17, 1979; Luo, May 20, 1980; Lu, June 8, 1979; Yang, Oct. 23, 1980). Names: Liu Shaoqi, Mao Zedong, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun.'
      tags: [name:liu-shaoqi, name:mao-zedong, name:peng-zhen, name:luo-ruiqing, name:lu-dingyi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-05.china-leadership
      when: May 5
      date: '1966-05-05'
      thread: china-leadership
      c: 'Shanghai. Mao receives the Albanian party and government delegation under Mehmet Shehu, and dines with it, Zhou Enlai, Lin Biao, Deng Xiaoping and Wu Xiuquan present. He speaks of his death and of revisionism: Marx''s and Engels''s party was taken from them by their heirs, the USSR''s by Khrushchev; for China two possibilities, revisionism taking Peking, or a part of the leadership splitting. "We are at dusk," so he means to clear out bourgeois restoration while he has breath.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 5, 1966. Made public: 2013. Names: Mao Zedong, Mehmet Shehu, Zhou Enlai, Lin Biao, Deng Xiaoping, Wu Xiuquan.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, name:deng-xiaoping, polity:prc]
- add:
    entry:
      id: cal.1966-05-07.china-leadership
      when: May 7
      date: '1966-05-07'
      thread: china-leadership
      c: 'Mao to Lin Biao, on the General Logistics Department''s report of May 6 on army farming (40 to 50 billion catties of grain in three to five years): a very good plan. The army should be a big school, in peace and in a third world war, learning politics, military affairs and culture, farming, running small factories, doing mass work, joining the Four Cleanups; the "May 7 directive."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 7, 1966. Made public: Aug. 1, 1966 (the *Renmin ribao* editorial of that day paraphrased it); the text, Check. To check: the General Logistics Department''s report of May 6, 1966, *Guanyu jinyibu gaohao bu dui nongfu ye shengchan de baogao*. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-09.china-leadership
      when: May 9
      date: '1966-05-09'
      thread: china-leadership
      c: 'Mao revises Yao Wenyuan''s article "On the Great Black Shop Three-Family Village" (*Yanshan yehua*, *Sanjia cun zhaji*), striking "anti-Party, anti-socialist" from the title. *Jiefang ribao* and *Wenhui bao* print it May 10; the *Renmin ribao* May 11.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 9, 1966. Made public: May 10, 1966 (*Jiefang ribao*, *Wenhui bao*). Names: Mao Zedong, Yao Wenyuan.'
      tags: [name:mao-zedong, name:yao-wenyuan, polity:prc]
- add:
    entry:
      id: cal.1966-05-16.china-leadership
      when: May 16
      date: '1966-05-16'
      thread: china-leadership
      c: 'Peking. The enlarged Politburo meeting adopts the Center''s notice (the May 16 Circular), drafted by Chen Boda and others, revised by Mao: it withdraws the Five-Man Group''s Outline, dissolves the group and its office and sets up a Cultural Revolution Group under the Standing Committee. It is printed in the *Renmin ribao* May 17, 1967.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 4–26, 1966 (the entry "5月4日—26日") and note 25. Made public: May 17, 1967 (*Renmin ribao*). To check: *Zhongguo gongchandang zhongyang weiyuanhui tongzhi* (中国共产党中央委员会通知), May 16, 1966. Names: Chen Boda, Mao Zedong.'
      tags: [name:chen-boda, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-16.china-leadership-2
      when: May 16
      date: '1966-05-16'
      thread: china-leadership
      c: 'The Center forwards, Mao having read it, the working group''s report on Luo Ruiqing: his errors are a bourgeois military line against the proletarian, revisionism against Marxism-Leninism and Mao Zedong Thought, and opposition to the Center, to Mao and to Lin Biao. Luo is removed as secretary of the Secretariat and Vice Premier.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 16, 1966. Made public: 2013. Names: Luo Ruiqing, Mao Zedong, Lin Biao.'
      tags: [name:luo-ruiqing, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-17.china-leadership
      when: May 17
      date: '1966-05-17'
      thread: china-leadership
      c: 'Mao reads Zhang Shizhao''s letter of May 10 asking to hold back from publication his *Liuwen zhiyao* (a guide to Liu Zongyuan''s prose), submitted to the Zhonghua Book Company: "To Liu, Zhou, Deng: read; send to Kang Sheng and talk it over with Mr. Zhang: either publish as planned, or, as he asks, take one, two or three years to revise and then print; take your pick." On Zhang''s remark that the Cultural Revolution is "a swift decisive fight" he notes "not so fast"; on those who "hang the sheep''s head of communism and sell anti-communist dog meat," that they should be roundly criticized.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 17, 1966. Made public: 2013. Names: Mao Zedong, Zhang Shizhao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-18.china-leadership
      when: May 18
      date: '1966-05-18'
      thread: china-leadership
      c: 'Peking. Lin Biao, at the enlarged Politburo meeting, makes a long speech on coups: they are now the fashion, they follow a dynasty''s founding after ten, twenty, fifty years; a counter-revolutionary coup may come; whoever opposes Mao, all should kill. The Center circulates it Sept. 22.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 18, 1966. Made public: Check (circulated Party-wide Sept. 22, 1966; 2013 at the latest). Names: Lin Biao, Mao Zedong.'
      tags: [name:lin-biao, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-18.china-leadership-2
      when: May 18
      date: '1966-05-18'
      thread: china-leadership
      c: 'Zhou Enlai reports to Mao on strengthening the Peking garrison and the guard of key offices in the capital: Mao, "do as proposed" (mid-May, no day). Also mid-May, Mao reads Lin Biao''s May 17 report of a General Political Department paper: Lin''s directive of May 11, that appointments of the first and second leaders of the large military regions, services and three headquarters go to Mao and the Center before they are announced, a system to last; Mao: "return to Lin."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May (the two entries "5月中旬" and "同旬"). Made public: 2013. Names: Zhou Enlai, Mao Zedong, Lin Biao. Check: the nianpu dates the two papers only to the middle ten days of May; May 18 is Zhou''s report''s date.'
      tags: [name:zhou-enlai, name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-21.china-leadership
      when: May 21
      date: '1966-05-21'
      thread: china-leadership
      c: 'Kang Sheng telephones Mao at Hangzhou on the Peking enlarged meeting: a review committee to examine Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun, to be announced to the meeting; Jiang Qing and others would put Yao Wenyuan on the Cultural Revolution Group. Mao agrees.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 21, 1966. Made public: 2013. Names: Kang Sheng, Mao Zedong, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun, Jiang Qing, Yao Wenyuan.'
      tags: [name:kang-sheng, name:mao-zedong, name:peng-zhen, name:luo-ruiqing, name:lu-dingyi, name:jiang-qing, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-23.china-leadership
      when: May 23
      date: '1966-05-23'
      thread: china-leadership
      c: 'Mao approves the Secretariat''s draft explanation of the errors of Lu Dingyi and Yang Shangkun: "seen; agreed," to Deng Xiaoping. Issued May 24.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 23, 1966. Made public: 2013. Names: Mao Zedong, Lu Dingyi, Yang Shangkun, Deng Xiaoping.'
      tags: [name:mao-zedong, name:lu-dingyi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-23.china-leadership-2
      when: May 23
      date: '1966-05-23'
      thread: china-leadership
      c: 'The enlarged Politburo meeting decides: Peng Zhen, Lu Dingyi and Luo Ruiqing out of the Secretariat, Yang Shangkun out as alternate; Peng out as first secretary and mayor of Peking, Lu as head of the Propaganda Department; Tao Zhu to the Secretariat as standing secretary and Propaganda head; Ye Jianying to the Secretariat and as secretary-general of the Military Commission; Li Xuefeng first secretary at Peking; a plenum to confirm.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 23, 1966. Made public: 2013. Names: Peng Zhen, Lu Dingyi, Luo Ruiqing, Yang Shangkun, Tao Zhu, Ye Jianying, Li Xuefeng.'
      tags: [name:peng-zhen, name:lu-dingyi, name:luo-ruiqing, name:tao-zhu, name:ye-jianying, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-28.china-leadership
      when: May 28
      date: '1966-05-28'
      thread: china-leadership
      c: 'Mao approves the list of the Center Cultural Revolution Group agreed by the standing members in Peking: head Chen Boda; adviser Kang Sheng; deputy heads Jiang Qing, Wang Renzhong, Liu Zhijian and Zhang Chunqiao; members Xie Tangzhong, Yin Da, Wang Li, Guan Feng, Qi Benyu, Mu Xin and Yao Wenyuan. The Center sends it to county and regiment Party committees the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 28, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda, Kang Sheng, Jiang Qing, Wang Renzhong, Liu Zhijian, Zhang Chunqiao, Xie Tangzhong, Yin Da, Wang Li, Guan Feng, Qi Benyu, Mu Xin, Yao Wenyuan.'
      tags: [name:mao-zedong, name:chen-boda, name:kang-sheng, name:jiang-qing, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-29.china-leadership
      when: May 29
      date: '1966-05-29'
      thread: china-leadership
      c: 'Peking. Liu Shaoqi, Zhou Enlai and Deng Xiaoping decide: Chen Boda to lead a temporary work group into the *Renmin ribao*, Zhang Chengxian one into Peking University. Their letter of May 30 to Mao: "agreed." Chen enters the *Renmin ribao* May 31 and reorganizes its leadership.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 29, 1966. Made public: 2013. Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Boda, Zhang Chengxian, Mao Zedong.'
      tags: [name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:chen-boda, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-05-29.china-leadership-2
      when: May 29
      date: '1966-05-29'
      thread: china-leadership
      c: 'Tsinghua University Middle School forms the first Red Guard organization in the country.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 29, 1966. Made public: Check (the founding; the school''s posters of June 24 and July 4, in *Hongqi*, no. 11, Aug. 21, 1966).'
      tags: [polity:prc]
- add:
    entry:
      id: cal.1966-06-01.china-leadership
      when: June 1
      date: '1966-06-01'
      thread: china-leadership
      c: 'Mao to Kang Sheng and Chen Boda, on the wall poster of Nie Yuanzi and six others at Peking University ("What have Song Shuo, Lu Ping and Peng Peiyun been doing in the Cultural Revolution?"): Xinhua to broadcast it whole, the papers to print it; "the reactionary fortress can be broken from here." It is broadcast that evening; the *Renmin ribao* prints it June 2 with a commentator''s article and an editorial.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 1, 1966. Made public: June 1, 1966 (the broadcast); Mao''s note, 2013. To check: the poster of May 25 as printed in the *Cultural Revolution Bulletin* no. 13, May 27. Names: Mao Zedong, Kang Sheng, Chen Boda, Nie Yuanzi, Song Shuo, Lu Ping, Peng Peiyun.'
      tags: [name:mao-zedong, name:kang-sheng, name:chen-boda, polity:prc]
- add:
    entry:
      id: cal.1966-06-01.china-leadership-2
      when: June 1
      date: '1966-06-01'
      thread: china-leadership
      c: 'The *Renmin ribao* editorial "Sweep Away All Ghosts and Monsters," drafted under Chen Boda: sweep the "ghosts and monsters" on the ideological and cultural front; smash the four olds and set up the four news.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 1, 1966. Names: Chen Boda.'
      tags: [name:chen-boda, polity:prc]
- add:
    entry:
      id: cal.1966-06-03.china-leadership
      when: June 3
      date: '1966-06-03'
      thread: china-leadership
      c: 'Mao approves two Xinhua dispatches: the Center puts Li Xuefeng first secretary of the Peking committee, Wu De (from Jilin) second; the new committee sends a work group under Zhang Chengxian to Peking University, removes Lu Ping and Peng Peiyun, and reorganizes the university committee. Printed June 4.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 3, 1966. Made public: June 4, 1966 (*Renmin ribao*). Names: Mao Zedong, Li Xuefeng, Wu De, Zhang Chengxian, Lu Ping, Peng Peiyun.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-06-03.china-leadership-2
      when: June 3
      date: '1966-06-03'
      thread: china-leadership
      c: 'Peking. Liu Shaoqi presides over the enlarged Standing Committee meeting, which hears Li Xuefeng on the Peking colleges and agrees his eight rules: wall posters kept on campus; no meetings that hinder work and teaching; no marches into the streets; no foreigners; no raids on the homes of the denounced; secrecy; no beating or slander; keep to the post.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 3, 1966. Made public: 2013. Names: Liu Shaoqi, Li Xuefeng.'
      tags: [name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-05.china-leadership
      when: June 5
      date: '1966-06-05'
      thread: china-leadership
      c: 'Mao, on a report of the Center General Office on foreign press notice of the Peking committee''s reorganization: "to Jiang Qing; Chen Boda''s work group (Mu Xin and others) entered the *Renmin ribao* on June 1; Wu Lengxi struck from the Cultural Revolution Group list."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 5, 1966. Made public: 2013. Names: Mao Zedong, Jiang Qing, Chen Boda, Mu Xin, Wu Lengxi. Check: note 40 gives May 31, not June 1, for Chen''s entry.'
      tags: [name:mao-zedong, name:jiang-qing, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-07.china-leadership
      when: June 7
      date: '1966-06-07'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Mao answers Zhou Enlai''s telephone request: Liu Shaoqi, Zhou, Deng Xiaoping, Kang Sheng and Tao Zhu to come to Hangzhou on June 9 and meet Hồ Chí Minh there.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 7, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Kang Sheng, Tao Zhu, Hồ Chí Minh.'
      tags: [name:mao-zedong, name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, name:kang-sheng, name:tao-zhu, name:ho-chi-minh, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-07.china-leadership-2
      when: June 7
      date: '1966-06-07'
      thread: china-leadership
      c: 'Mao answers Kang Sheng''s telephone request on the articles that raise Zhou Yang and whether to name him: wait until the standing members arrive.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 7, 1966. Made public: 2013. Names: Mao Zedong, Kang Sheng, Zhou Yang.'
      tags: [name:mao-zedong, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-09.china-leadership
      when: June 9–12
      date: '1966-06-09'
      thread: china-leadership
      c: 'Hangzhou. Mao presides over an enlarged Standing Committee meeting that hears Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng and Tao Zhu on the Cultural Revolution.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 9, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng, Tao Zhu.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:deng-xiaoping, name:kang-sheng, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-10.china-leadership
      when: June 10
      date: '1966-06-10'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Hangzhou. Mao receives Hồ Chí Minh, Kang Sheng, Wu Xiuquan and Jiang Qing present. He says he may not outlast the next year (he is then 73, a dangerous age by the Chinese saying); everything divides in two; Bernstein and Kautsky were Marx''s and Engels''s heirs, and who China''s are, Bernstein, Kautsky or Khrushchev, is not known; there is time to prepare. The struggle began in Nov. 1965 with the young Yao Wenyuan. On industry: begin small, in China and Vietnam, and grow.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 10, 1966. Made public: 2013. Names: Mao Zedong, Hồ Chí Minh, Kang Sheng, Wu Xiuquan, Jiang Qing, Yao Wenyuan.'
      tags: [name:mao-zedong, name:ho-chi-minh, name:kang-sheng, name:jiang-qing, name:yao-wenyuan, polity:prc, polity:drv, vis:only:prc+drv]
- add:
    entry:
      id: cal.1966-06-10.china-leadership-2
      when: June 10
      date: '1966-06-10'
      thread: china-leadership
      c: 'Hangzhou, evening. Mao presides over the enlarged Standing Committee meeting. The Cultural Revolution: let go, do not fear disorder, rouse the masses; work groups need not be sent; one Peking University poster has lit the fire; the left are active, the right resist but do not prevail; the blow will be wide and sorted later; build a left core of the active, regardless of rank or fame.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 10, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-12.china-leadership
      when: June 12
      date: '1966-06-12'
      thread: china-leadership
      c: 'Hangzhou. Mao to the enlarged Standing Committee meeting: first seize power and criticize the authorities, then reform teaching and the school system. Entrance examinations to be set, by school nomination and selection; this year''s university admission put off half a year; textbooks rewritten. A blow at 5 percent is plenty. Work groups sent too early are no good; let it be chaotic first, then send them when things are clear.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 12, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-14.china-leadership
      when: June 14
      date: '1966-06-14'
      thread: china-leadership
      c: 'Mao approves the Secretariat''s lists for the four special-case groups on Peng Zhen, Lu Dingyi, Luo Ruiqing and Yang Shangkun.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 14, 1966. Made public: 2013. Names: Mao Zedong, Peng Zhen, Lu Dingyi, Luo Ruiqing, Yang Shangkun.'
      tags: [name:mao-zedong, name:peng-zhen, name:lu-dingyi, name:luo-ruiqing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-16.china-leadership
      when: June 16
      date: '1966-06-16'
      thread: china-leadership
      also: [soviet-union]
      c: 'Mao, Changsha, late at night, on the Foreign Ministry''s plan for Zhou Enlai''s party and government delegation to Romania (talks on the international situation, Sino-Soviet relations, Sino-Romanian relations): "agreed in principle; Liu and Deng to settle it." He had agreed by telephone, June 6, to the trip of a week from June 16. On the train through Nanchang that day he tells the Jiangxi leaders the movement is a rehearsal against revisionism for the untried young.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 6 and June 16, 1966 (the entries of those dates). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
      tags: [name:mao-zedong, name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-19.china-leadership
      when: June 19
      date: '1966-06-19'
      thread: china-leadership
      c: 'Mao answers Wang Dongxing''s call of the night before: Hu Qiaomu, back in Peking, wants work; Deng Xiaoping, Kang Sheng, Chen Boda and Tao Zhu ask whether he may join Kang''s editing of the *Selected Works*. Mao: yes; he may also join other work, the Cultural Revolution, but not necessarily the Cultural Revolution Group; he may write, editorials; he should read the wall posters at the colleges.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 19, 1966. Made public: 2013. Names: Mao Zedong, Wang Dongxing, Hu Qiaomu, Deng Xiaoping, Kang Sheng, Chen Boda, Tao Zhu.'
      tags: [name:mao-zedong, name:deng-xiaoping, name:kang-sheng, name:chen-boda, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-23.china-leadership
      when: June 23
      date: '1966-06-23'
      thread: china-leadership
      c: 'Mao reads Liu Shaoqi''s and Deng Xiaoping''s letter of June 22: the Secretariat, with several standing members, proposes to publish Mao''s Jan. 30, 1962 speech on July 1, the Party''s 45th anniversary. Next day, through his secretary Xu Yefu: print it in the Party only. June 27, Wang Dongxing''s note: "The Chairman: not to be published; wait another year."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 23, 1966 and June 27, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Xu Yefu, Wang Dongxing.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-26.china-leadership
      when: June 26
      date: '1966-06-26'
      thread: china-leadership
      c: 'Shaoshan, the Dishuidong. Mao receives and hears the leaders of the Hunan committee and the Xiangtan prefectural and county committees. At the close: "I led you on the Long March before; now I will lead you on another." Wang Yanchun, acting first secretary of Hunan, asks him to inscribe the Shaoshan irrigation district: wait until yields are high.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 26, 1966. Made public: 2013. Names: Mao Zedong, Wang Yanchun.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-06-30.china-leadership
      when: June 30
      date: '1966-06-30'
      thread: china-leadership
      c: 'Mao to Liu Shaoqi and Deng Xiaoping, 2 a.m.: publishing the 1962 speech now is out of season; after the Cultural Revolution, with new experience, revise it and then consider; Wang Renzhong agrees. Chen Boda, Kang Sheng and Tao Zhu to expand the twelve-article draft guiding the movement to twenty or so, each article one thing, a second draft to him in a week; the East China Bureau''s June 21 report is worth a look.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 30, 1966. Made public: 2013. See [[cal.1966-06-23.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Wang Renzhong, Chen Boda, Kang Sheng, Tao Zhu.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:chen-boda, name:kang-sheng, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-02.china-leadership
      when: July 2
      date: '1966-07-02'
      thread: china-leadership
      c: 'Mao approves Liu Shaoqi''s and Deng Xiaoping''s draft notice (June 30): industry, communications and construction units not to start the Cultural Revolution all at once; the stress on culture, education and Party and government organs; factories and the rest follow the Four Cleanups and the Twenty-three Articles together with the movement. "Agreed; send it down quickly." The Center and State Council issue it that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 2, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-08.china-leadership
      when: July 8
      date: '1966-07-08'
      thread: china-leadership
      c: 'Mao to Jiang Qing, from Wuhan. Great disorder brings great order; again in seven or eight years. A friend''s talk on coups (Lin Biao''s of May 18) makes him uneasy: he never believed his few little books had such power; "forced onto Liangshan," he agrees against his will, the first time in a life; there is some tiger in him and some monkey; his aim is to overthrow the right across Party and country, and to sweep the ghosts again in seven or eight years; he is a Zhong Kui of the 1960s.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 8, 1966. Made public: Check (the nianpu, 2013 at the latest; the Center circulated the letter within the Party at a date not given there). Names: Mao Zedong, Jiang Qing, Lin Biao.'
      tags: [name:mao-zedong, name:jiang-qing, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-10.china-leadership
      when: July 10
      date: '1966-07-10'
      thread: china-leadership
      c: 'Mao approves Tao Zhu''s and Zhang Pinghua''s letter of July 5 on the Central Propaganda Department: its leadership reorganized; its chief task to spread Mao Zedong Thought; criticism of section heads and above in July and August; the national conference of activists in studying Mao''s works in September to be prepared. "Agreed; the Standing Committee to decide last."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 10, 1966. Made public: 2013. Names: Mao Zedong, Tao Zhu, Zhang Pinghua.'
      tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-11.china-leadership
      when: July 11
      date: '1966-07-11'
      thread: china-leadership
      c: 'Wuchang. Mao receives Crown Prince Birendra of Nepal, Zhou Enlai and Han Nianlong present. Ansteel too big for Nepal or China; small and middle plants; independence in economy means independence in politics; China''s self-reliance was forced by the broken treaties and the withdrawn experts; the foreign debt paid, the home debt soon.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 11, 1966. To check: Xinhua''s report of the visit. Names: Mao Zedong, Birendra, Zhou Enlai, Han Nianlong.'
      tags: [name:mao-zedong, name:birendra-bir-bikram-sha-dev, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1966-07-11.china-leadership-2
      when: July 11–12
      date: '1966-07-11'
      thread: china-leadership
      c: 'Wuchang. Mao shows Zhou Enlai and Wang Renzhong his letter of July 8 to Jiang Qing, in talks of three hours (July 11, afternoon) and two (July 12, morning). Zhou proposes seeing Lin Biao; Mao agrees. Zhou goes to Dalian July 14, tells Lin Mao''s views; Lin accepts and promises to revise his May 18 speech on his return to Peking.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 11, 1966 (the entry "7月11日下午、12日上午") and note 47. Made public: 2013. See [[cal.1966-07-08.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Wang Renzhong, Jiang Qing, Lin Biao.'
      tags: [name:mao-zedong, name:zhou-enlai, name:jiang-qing, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-12.china-leadership
      when: July 12
      date: '1966-07-12'
      thread: china-leadership
      c: 'Mao reads a letter of June 28 from seven students of the Peking Language Institute, children of cadres: cadres have become "officials," privileged, less revolutionary; they ask a cut in pay, no special treatment, regular manual labor, penalties for breaking the law, half-work half-study everywhere, holiday work in factories, villages and army. Mao refers it to Chen Boda and Kang Sheng.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 12, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda, Kang Sheng. Check: the nianpu cuts Mao''s note after "Boda, Kang Sheng, decide" (伯达、康生酌处); the rest, Check.'
      tags: [name:mao-zedong, name:chen-boda, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-16.china-leadership
      when: July 16
      date: '1966-07-16'
      thread: china-leadership
      c: 'Mao swims the Yangtze at Wuhan, from the Dakoutou at Wuchang down past the Wuhan Iron and Steel Company, some thirty li in a little over an hour: "the Yangtze is wide and deep; a good place to swim; the current tempers the body and the will."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 16, 1966. Made public: 2013. To check: Xinhua''s report of July 25, 1966, if any. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-17.china-leadership
      when: July 17
      date: '1966-07-17'
      thread: china-leadership
      c: 'Wuchang. Mao receives delegates to the emergency meeting of Afro-Asian writers and the observers of international bodies, Guo Moruo, Xu Guangping, Ba Jin and Liu Baiyu present.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 17, 1966. To check: Xinhua''s report. Names: Mao Zedong, Guo Moruo, Xu Guangping, Ba Jin, Liu Baiyu.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-07-18.china-leadership
      when: July 18
      date: '1966-07-18'
      thread: china-leadership
      c: 'Peking. Mao returns after nine months away and lives at the Zhongnanhai swimming pool, never again at the Juxiang Shuwu. Reads the Cultural Revolution Group''s materials on the work groups; hears the Group''s report; shows his dissatisfaction with the movement''s progress.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 18, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-19.china-leadership
      when: July 19
      date: '1966-07-19'
      thread: china-leadership
      c: 'Peking. At Mao''s wish Liu Shaoqi presides over an enlarged Standing Committee meeting. Chen Boda proposes to withdraw the work groups; Liu, Deng Xiaoping and most others oppose. Asked afterward, Mao decides to withdraw them.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 19, 1966. Made public: 2013. Names: Liu Shaoqi, Mao Zedong, Chen Boda, Deng Xiaoping.'
      tags: [name:liu-shaoqi, name:mao-zedong, name:chen-boda, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-19.china-leadership-2
      when: July 19
      date: '1966-07-19'
      thread: china-leadership
      c: 'Peking, evening. Mao presides over an enlarged Standing Committee meeting at the Huairentang.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 19, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-21.china-leadership
      when: July 21
      date: '1966-07-21'
      thread: china-leadership
      c: 'Mao reads the draft of July 16, "The Situation of the Great Proletarian Cultural Revolution and Some Questions of Party Policy" (Chen Boda): "Good." The work group (the drafters) to meet once or twice, then the Politburo, with the bureaus and Shanghai and Peking, for two or three days, then it may be published in the Central Committee''s name, best Aug. 1. His changes: the Revolution aims at "revolutionizing men''s thought"; "guide to action" for "highest instruction"; "will win a great victory." He revises it many times more.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 21, 1966. Made public: 2013. To check: *Wuchan jieji wenhua da geming de xingshi he dang de ruogan fangzhen wenti* (the draft of July 16; the later "Sixteen Points"). Names: Mao Zedong, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-23.china-leadership
      when: July 23
      date: '1966-07-23'
      thread: china-leadership
      c: 'Mao, Diaoyutai Building 12, hears Li Xuefeng and Wu De on the Cultural Revolution in Peking, Tao Zhu and Kang Sheng present. After a week''s thought, the movement in Peking is cold; sending work groups was wrong; they obstruct; leaders do not go down to where there is trouble.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 23, 1966. Made public: 2013. Names: Mao Zedong, Li Xuefeng, Wu De, Tao Zhu, Kang Sheng.'
      tags: [name:mao-zedong, name:tao-zhu, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-24.china-leadership
      when: July 24
      date: '1966-07-24'
      thread: china-leadership
      c: 'Diaoyutai Building 12. Mao to the Cultural Revolution Group: no work groups; at most observers, who investigate and do not give orders. Withdraw the groups, suspend the "black gang"; left students and teachers to form revolutionary committees and run it themselves. "Fight and reform": fight the Party people on the capitalist road and the academic authorities. The *Renmin ribao*, the Propaganda and Culture departments and the Peking committee were not in our hands; some comrades fear the masses.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 24, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-24.china-leadership-2
      when: July 24
      date: '1966-07-24'
      thread: china-leadership
      c: 'The Center and State Council issue the notice on reforming college admission: from this year admission is delegated to the provinces and autonomous regions; the entrance examination is abolished; recommendation and selection combined.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 24, 1966. Made public: Check (a published notice; the nianpu gives no printing).'
      tags: [polity:prc]
- add:
    entry:
      id: cal.1966-07-25.china-leadership
      when: July 25
      date: '1966-07-25'
      thread: china-leadership
      c: 'Diaoyutai Building 12. Mao to the Cultural Revolution Group and the Center bureaus'' heads, on the draft document: the policy of sending work groups must change; revolutionary teachers and students to make revolution, form committees, the half-hearted middle to join; work groups do not know how to fight or reform and have obstructed for a month, helping the "black gang"; let the masses reach the Center directly, by letter, telephone and telegram.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 25, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-25.china-leadership-2
      when: July 25
      date: '1966-07-25'
      thread: china-leadership
      c: 'Mao reads Xinhua''s draft on the Propaganda Department meeting that denounced Zhou Yang: "Seen; usable, to Tao Zhu, then to Zhang Pinghua"; on p. 5 "highest instruction" to "guide"; hereafter avoid "highest and liveliest," "peak" and "highest instruction."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 25, 1966. Made public: 2013. Names: Mao Zedong, Tao Zhu, Zhang Pinghua, Zhou Yang.'
      tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-26.china-leadership
      when: July 26
      date: '1966-07-26'
      thread: china-leadership
      c: 'Peking. The enlarged Politburo meeting decides to withdraw the work groups. The Peking Party committee orders it for the colleges on July 28 and applies it to the middle schools.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 26, 1966. Made public: 2013.'
      tags: [polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-07-29.china-leadership
      when: July 29
      date: '1966-07-29'
      thread: china-leadership
      c: 'Peking, Great Hall. The Peking committee''s meeting of college and middle-school activists: Li Xuefeng reads the committee''s decision on withdrawing the work groups; Liu Shaoqi and Deng Xiaoping take responsibility for sending them; Zhou Enlai conveys Mao''s three tasks for the schools (fight, criticize, reform). Mao meets all the delegates at the close. The recording goes to the provinces, and the work groups are withdrawn there.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 29, 1966. To check: Xinhua''s report, July 30. Names: Li Xuefeng, Liu Shaoqi, Deng Xiaoping, Zhou Enlai, Mao Zedong.'
      tags: [name:liu-shaoqi, name:deng-xiaoping, name:zhou-enlai, name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-07-31.china-leadership
      when: July 31
      date: '1966-07-31'
      thread: china-leadership
      c: 'Mao replies to the Red Guards of the Middle School attached to Tsinghua University on their posters of June 24 and July 4 ("Long live the revolutionary spirit of rebellion"): warm support; "to rebel against reactionaries is justified"; unite all who can be united; give the erring work and a way to remake themselves; the proletariat must free all mankind. He asks the standing members to say whether it is right. Dated Aug. 1; not sent to the Red Guards then, but circulated as a plenum document.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 31, 1966. Made public: Aug. 1966 (circulated with the plenum papers); the Red Guards'' posters in *Hongqi*, no. 11, Aug. 21, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-01.china-leadership
      when: Aug. 1–12
      date: '1966-08-01'
      thread: china-leadership
      c: 'Peking, Great Hall. The Eleventh Plenum of the Eighth Central Committee, Mao presiding. Agenda, from Deng Xiaoping: the Decision on the Cultural Revolution; the major decisions since the Tenth Plenum; the personnel changes of May; a communiqué. Liu Shaoqi reports the Center''s work since the Tenth Plenum and takes responsibility for the work groups. Mao, during Chen Boda''s speech: over 90 percent of the work groups wholly wrong, under 10 percent good; they are to be withdrawn; they suppressed the movement.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 1, 1966. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Liu Shaoqi, Chen Boda.'
      tags: [name:mao-zedong, name:deng-xiaoping, name:liu-shaoqi, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-01.china-leadership-2
      when: Aug. 1
      date: '1966-08-01'
      thread: china-leadership
      c: 'Peking, 10 p.m., the Zhongnanhai pool. Mao calls Zhou Enlai and others to a meeting. Before it Zhou, on Mao''s view, sees Wang Guangmei and Kuai Dafu; next morning he sees the Tsinghua work-group head, Ye Lin, and Kuai, to start settling Tsinghua.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 1, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Wang Guangmei, Kuai Dafu, Ye Lin.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-03.china-leadership
      when: Aug. 3
      date: '1966-08-03'
      thread: china-leadership
      c: 'Plenum, afternoon. Mao to Liu Lantao: withdraw the work groups; set up committees, congresses and groups of revolutionary teachers, students and staff to run it themselves, the Marxist-Leninist way. To Song Renqiong: put aside airs; be ordinary people; the masses are pleased.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 3, 1966. Made public: 2013. Names: Mao Zedong, Liu Lantao, Song Renqiong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-03.china-leadership-2
      when: Aug. 3
      date: '1966-08-03'
      thread: china-leadership
      c: '9 p.m. Mao reads Chen Boda''s revised draft (Aug. 3) of the Decision on the Great Proletarian Cultural Revolution: "Revised very well; print it at once." Chen: Kang Sheng, Tao Zhu, Wang Renzhong, Zhang Chunqiao and he took up the group meetings'' views that morning.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 3, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda, Kang Sheng, Tao Zhu, Wang Renzhong, Zhang Chunqiao.'
      tags: [name:mao-zedong, name:chen-boda, name:kang-sheng, name:tao-zhu, name:zhang-chunqiao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-04.china-leadership
      when: Aug. 4
      date: '1966-08-04'
      thread: china-leadership
      c: 'Peking. Mao presides over an enlarged Standing Committee meeting. The Center broke its own order (to suspend classes six months); the "mass line" and "trusting the masses" were fakes; some stood on the bourgeois side against the proletariat. Liu Shaoqi: "I bear the main responsibility in Peking." Mao: you ran a dictatorship in Peking; a directional error, in truth the bourgeois standpoint. Ye Jianying: millions of troops, no fear of ghosts. Mao: the ghosts are in this room. He ends the plenary day; the group meetings to hear it passed on.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 4, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Ye Jianying.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:ye-jianying, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-04.china-leadership-2
      when: Aug. 4
      date: '1966-08-04'
      thread: china-leadership
      c: 'Mao approves Tao Zhu''s report of July 29: the Propaganda Department, after Mao''s instruction of July 25, proposes that "highest and liveliest," "peak" and "highest instruction" not be used in Party and government speeches and documents, or in editorials, headings, comments and news leads; foreign friends'' praise to be printed as said; "to go to the provincial committees to observe." The Center circulates it that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 4, 1966 (the entry "同日" under Aug. 4). Made public: 2013. See [[cal.1966-07-25.china-leadership-2]]. Names: Mao Zedong, Tao Zhu.'
      tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-05.china-leadership
      when: Aug. 5
      date: '1966-08-05'
      thread: china-leadership
      c: 'Mao writes on a copy of the *Beijing ribao* of June 2 "Bombard the Headquarters: My Wall Poster": the first Marxist-Leninist poster and the commentator''s article well written; for fifty-odd days some leaders from the Center to the localities did the reverse, on a reactionary bourgeois standpoint, ran a bourgeois dictatorship, beat down the movement, spread terror; recalls the right deviation of 1962 and the "left in form, right in essence" of 1964. A plenum document, to county and regiment level Aug. 17; printed Aug. 5, 1967.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 1966. Made public: Aug. 5, 1967 (*Renmin ribao*). To check: *Paoda siling bu: wo de yizhang dazibao* (炮打司令部——我的一张大字报), the text as the nianpu prints it, Aug. 5, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-05.china-leadership-2
      when: Aug. 5
      date: '1966-08-05'
      thread: china-leadership
      c: 'Mao, reading the *Renmin ribao* commentator''s article of June 2 for the plenum papers, annotates the sentence that "we accept unconditionally the leadership of the Party Center headed by Chairman Mao": a leadership that harms the revolution should be resisted, as many revolutionary teachers, students and cadres resisted it in this movement.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 1966 ("同日"). Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-05.china-leadership-3
      when: Aug. 5
      date: '1966-08-05'
      thread: china-leadership
      c: 'On Mao''s wish the Center withdraws its circulation of June 20 of Peking University''s Cultural Revolution Bulletin no. 9, which Liu Shaoqi had sent out with a covering note approving the work group''s handling of beating and brawling there.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 1966 ("同日"). Made public: 2013. Names: Mao Zedong, Liu Shaoqi.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-05.china-leadership-4
      when: Aug. 5
      date: '1966-08-05'
      thread: china-leadership
      c: 'Mao revises the plenum communiqué three times (Aug. 5, 9, 11): strikes the plenum''s welcome of Liu Shaoqi''s statement (the July 22 statement on aid to Vietnam); adds that U.S. imperialism and its running dogs are paper tigers; "a development," not an "epoch-making new development," of Marxism-Leninism for Mao''s directions on the Cultural Revolution; strikes "serving U.S. imperialism" from the Soviet revisionist leading clique.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 9 and 11, 1966. Made public: 2013. Names: Mao Zedong, Kang Sheng, Liu Shaoqi.'
      tags: [name:mao-zedong, name:kang-sheng, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-06.china-leadership
      when: Aug. 6
      date: '1966-08-06'
      thread: china-leadership
      c: 'Mao, at the pool, with Zhou Enlai and others, on the lists of the Standing Committee, Politburo and Secretariat. Zhou draws a list from the views agreed; Mao revises the Standing Committee''s order, putting Tao Zhu, seventh, fourth, after Zhou and before Chen Boda.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 6, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Tao Zhu, Chen Boda.'
      tags: [name:mao-zedong, name:zhou-enlai, name:tao-zhu, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-06.china-leadership-2
      when: Aug. 6
      date: '1966-08-06'
      thread: china-leadership
      c: 'Mao has his secretary tell Lin Biao, resting at Dalian, to attend the plenum. Lin flies to Peking that night and goes straight to the Great Hall.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 6, 1966. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-07.china-leadership
      when: Aug. 7
      date: '1966-08-07'
      thread: china-leadership
      c: 'Mao, at the pool, calls Zhou Enlai and others to discuss the draft Decision of the Central Committee on the Cultural Revolution. He proposes that in debate they use argument, not force.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 7, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-07.china-leadership-2
      when: Aug. 7
      date: '1966-08-07'
      thread: china-leadership
      c: 'Mao twice reads the draft Decision. 2 p.m.: "unknown petty figures" to "unknown young people." 10 p.m.: agrees the changes; a few words altered on p. 10, among them that scientists, technicians and staff be remolded "gradually," not "continually."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 7, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-08.china-leadership
      when: Aug. 8
      date: '1966-08-08'
      thread: china-leadership
      c: 'The plenum, Zhou Enlai presiding, adopts the Decision of the Central Committee on the Great Proletarian Cultural Revolution (the Sixteen Points): a new stage of the socialist revolution; the main current right, setbacks to be expected; the Party must dare to rouse the masses; the masses to free themselves; rely on the revolutionary left; the aim is those in power taking the capitalist road; separate the two kinds of contradictions.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 8, 1966. Made public: Aug. 1966 (the Decision, *Renmin ribao*; Check the day, which the nianpu does not give). To check: *Zhongguo gongchandang zhongyang weiyuanhui guanyu wuchan jieji wenhua da geming de jueding* (中国共产党中央委员会关于无产阶级文化大革命的决定), Aug. 8, 1966, and the plenum''s communiqué of Aug. 12. Names: Zhou Enlai, Mao Zedong.'
      tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-10.china-leadership
      when: Aug. 10
      date: '1966-08-10'
      thread: china-leadership
      c: 'Peking, 7:15 p.m. Mao goes to the Center''s reception post outside the Zhongnanhai west gate and meets crowds who came to hail the Decision: "You must care about affairs of state and carry the Great Proletarian Cultural Revolution through."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 10, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-08-11.china-leadership
      when: Aug. 11
      date: '1966-08-11'
      thread: china-leadership
      c: 'Ye Qun, Aug. 11 and 12, has men write an accusation against Liu Shaoqi; Lin Biao sends it to Mao through Jiang Qing on Aug. 14.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 11, 12, 1966 (the entry "8月11日、12日"). Made public: 2013. Names: Ye Qun, Liu Shaoqi, Lin Biao, Mao Zedong, Jiang Qing.'
      tags: [name:ye-qun, name:liu-shaoqi, name:lin-biao, name:mao-zedong, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-12.china-leadership
      when: Aug. 12
      date: '1966-08-12'
      thread: china-leadership
      c: 'The plenum''s last session. It adds to the Politburo Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian, Nie Rongzhen and Ye Jianying; as alternates Li Xuefeng, Song Renqiong and Xie Fuzhi; and enlarges the Standing Committee from seven to eleven: Mao, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun (new: Tao, Chen Boda, Kang, Li Fuchun). It does not re-elect a chairman and vice-chairmen; Lin alone is named vice-chairman; Liu, Zhou, Zhu and Chen Yun''s vice-chairmanships lapse. It confirms the May removals from the Secretariat and Tao Zhu''s and Ye Jianying''s appointments.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 12, 1966. Made public: Aug. 1966 (the communiqué, *Renmin ribao*; Check the day, which the nianpu does not give). Names: Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Li Xuefeng, Song Renqiong, Xie Fuzhi, Mao Zedong, Lin Biao, Zhou Enlai, Deng Xiaoping, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun.'
      tags: [name:tao-zhu, name:chen-boda, name:kang-sheng, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, name:xie-fuzhi, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:deng-xiaoping, name:liu-shaoqi, name:zhu-de, name:li-fuchun, name:chen-yun, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-12.china-leadership-2
      when: Aug. 12
      date: '1966-08-12'
      thread: china-leadership
      c: 'Mao to the plenum''s closing session: the Ninth Congress, eight years after the second session of the Eighth, to meet next year at a suitable time; the Politburo and its Standing Committee to prepare it. Whether the Decision is right, practice will say. Reliance on the masses has two possibilities, relying or not relying; some will not carry out the Decision; the new Politburo and Standing Committee are a guarantee. The erring to be given a way out and allowed to mend.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 12, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-13.china-leadership
      when: Aug. 13–23
      date: '1966-08-13'
      thread: china-leadership
      c: 'Peking. A Central Work Conference meets, to carry out the spirit of the Eleventh Plenum.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 13, 1966. Made public: 2013.'
      tags: [polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-15.china-leadership
      when: Aug. 15
      date: '1966-08-15'
      thread: china-leadership
      c: 'Mao approves Chen Boda''s report of Aug. 13 on the Cultural Revolution Group''s plans: every school and unit to study and master the Sixteen Points, the *Renmin ribao* to run editorials in succession; the natural-science and technical units to take the Revolution as the key but with a division of work, key and advanced research not to stop; "may be done." The Center sends it with Mao''s note to county and regiment level and science, industry and communications units Aug. 20.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 15, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-15.china-leadership-2
      when: Aug. 15
      date: '1966-08-15'
      thread: china-leadership
      c: 'Mao reads Chen Boda''s and Kang Sheng''s report that Li Xuefeng be relieved of the Peking first secretaryship and Wu De take it: Li to stay in name, Wu De to run the work; Lin Biao to preside over a meeting of Lin, Zhou, Tao Zhu, Liu Shaoqi, Deng Xiaoping and Li Xuefeng on it.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 15, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda, Kang Sheng, Li Xuefeng, Wu De, Lin Biao, Zhou Enlai, Tao Zhu, Liu Shaoqi, Deng Xiaoping.'
      tags: [name:mao-zedong, name:chen-boda, name:kang-sheng, name:lin-biao, name:zhou-enlai, name:tao-zhu, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-16.china-leadership
      when: Aug. 16
      date: '1966-08-16'
      thread: china-leadership
      c: 'The Center decides to hold a mass rally of a million at Peking "to celebrate the Great Proletarian Cultural Revolution," its guests young students from Peking and elsewhere. Mao will attend and asks for a uniform.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 16, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-18.china-leadership
      when: Aug. 18
      date: '1966-08-18'
      thread: china-leadership
      c: 'Peking, Tiananmen, 5 a.m. Mao, in an army uniform, at the rally of a million, Chen Boda presiding, the first of eight receptions of Red Guards. Lin Biao: break the old ideas, culture, customs and habits; overthrow those in power taking the capitalist road, the bourgeois "reactionary authorities" and "royalists." Zhou Enlai: the Sixteen Points are the program; be the masses'' pupils before their teachers.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 18, 1966. To check: Xinhua''s and the *Renmin ribao*''s accounts of Aug. 19. Names: Mao Zedong, Chen Boda, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:chen-boda, name:lin-biao, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1966-08-21.china-leadership
      when: Aug. 21
      date: '1966-08-21'
      thread: china-leadership
      c: 'Great Hall, Fujian Hall. Mao receives the Zambian delegation under Vice President Reuben Kamanga, Dong Biwu, Zhou Enlai and Chen Yi present. U.S. imperialism is the enemy; small countries are not to be looked down on; China backs every African struggle for independence; the imperialists will not win in the end, the people will.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 21, 1966. To check: Xinhua''s report. Names: Mao Zedong, Reuben Kamanga, Dong Biwu, Zhou Enlai, Chen Yi.'
      tags: [name:mao-zedong, name:dong-biwu, name:zhou-enlai, name:chen-yi, polity:prc]
- add:
    entry:
      id: cal.1966-08-21.china-leadership-2
      when: Aug. 21
      date: '1966-08-21'
      thread: china-leadership
      c: 'Peking, the pool. Mao presides over an enlarged Standing Committee meeting. First: argue, do not use force. "We do not interfere"; let disorder run some months; the great majority are good, the bad a few percent; the *Renmin ribao* to write an editorial urging workers, peasants and soldiers not to interfere.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 21, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-21.china-leadership-3
      when: Aug. 21
      date: '1966-08-21'
      thread: china-leadership
      c: 'On Mao''s approval the PLA General Staff and General Political Department issue the rule that troops are in no case to be used to put down the revolutionary student movement by force.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 21, 1966 ("同日"). Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-25.china-leadership
      when: Aug. 25
      date: '1966-08-25'
      thread: china-leadership
      c: 'Afternoon, the Diaoyutai guesthouse. Mao receives the Tanzanian friendship delegation under Colonel Yusuf Himid (so in the nianpu), Zhou Enlai, Yang Chengwu and Peng Shaohui present. After asking of conditions in Tanzania: he hopes they grow and that all Africa''s peoples win.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 25, 1966. To check: Xinhua''s report. Names: Mao Zedong, Zhou Enlai, Yang Chengwu, Peng Shaohui. Check: the head''s name (the nianpu''s 尤素夫·希米德).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1966-08-26.china-leadership
      when: Aug. 26
      date: '1966-08-26'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Great Hall, room 118. Mao receives the Vietnamese party and government delegation under Phạm Văn Đồng, Lin Biao, Zhou Enlai, Tao Zhu, Li Xiannian and Yang Chengwu present, on the war. The Vietnamese will make something of it; the initiative is theirs; in half a year the situation will change. A foreign army fighting an invader is met by the nation''s majority; climate, terrain and spirit tell against it. Experience and confidence come from fighting; from 1960 to 1966, from small victories to large; the United States adds troops because the Vietnamese are strong.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 26, 1966. Made public: 2013. Names: Mao Zedong, Phạm Văn Đồng, Lin Biao, Zhou Enlai, Tao Zhu, Li Xiannian, Yang Chengwu.'
      tags: [name:mao-zedong, name:pham-van-dong, name:lin-biao, name:zhou-enlai, name:tao-zhu, name:li-xiannian, polity:prc, polity:drv, vis:only:prc+drv]
- add:
    entry:
      id: cal.1966-08-26.china-leadership-2
      when: Aug. 26
      date: '1966-08-26'
      thread: china-leadership
      c: 'Mao reads Xie Fuzhi''s report of Aug. 25 on cutting the Ministry of Public Security, after Mao''s April instruction at Hangzhou to cut two-thirds: twelve bureaus to six, ninety sections to thirty-odd, 1,400 staff to 400; the enterprises (7,000 people) to other units; to 200 or 300 by the end of the Revolution. "Print for the Politburo; the plan good; discuss at the next meeting."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 26, 1966. Made public: 2013. Names: Mao Zedong, Xie Fuzhi.'
      tags: [name:mao-zedong, name:xie-fuzhi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-28.china-leadership
      when: Aug. 28
      date: '1966-08-28'
      thread: china-leadership
      c: 'Mao, at the pool, hears Tao Zhu, Kang Sheng and Zhang Pinghua on the Cultural Revolution. Students from outside Peking already number 140,000; let them all come, in batches. Students no longer care for "fight, criticize, reform," his own phrase; they want to sweep the "monsters" in society. The Revolution will run past year''s end, to the Spring Festival at least. Science students to study a little, arts students not; let them link up and give them all letters of introduction, left or right.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 28, 1966. Made public: 2013. Names: Mao Zedong, Tao Zhu, Kang Sheng, Zhang Pinghua.'
      tags: [name:mao-zedong, name:tao-zhu, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-28.china-leadership-2
      when: Aug. 28
      date: '1966-08-28'
      thread: china-leadership
      c: 'Mao at the pool to Tang Pingzhu (acting editor of the *Renmin ribao*) and Hu Chi (of the *Jiefangjun bao*), Tao Zhu, Kang Sheng and Zhang Pinghua present: the paper to have four pages and four supplements, six pages at times; long articles like Yao Wenyuan''s to run; the supplements'' titles in Lin Biao''s, Chen Boda''s, Kang Sheng''s hands and one from Lu Xun''s characters; start in January. The masthead stays his. For a dozen years the paper did not obey him.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 28, 1966. Made public: 2013. Names: Mao Zedong, Tang Pingzhu, Hu Chi, Tao Zhu, Kang Sheng, Zhang Pinghua, Yao Wenyuan, Lin Biao, Chen Boda.'
      tags: [name:mao-zedong, name:tao-zhu, name:kang-sheng, name:yao-wenyuan, name:lin-biao, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-28.china-leadership-3
      when: Aug. 28
      date: '1966-08-28'
      thread: china-leadership
      c: 'Mao reads Guan Feng''s and Qi Benyu''s report of Aug. 26 to Jiang Qing on the Peking Red Guards: since Aug. 18 they are in every school; seizing and beating, ransacking, cutting girls'' braids; the new Peking leaders wait and watch; some Red Guard bodies led by "royalists." He has it sent to the Politburo, Secretariat, Cultural Revolution Group, Peking committee, Bo Yibo and Tao Lujia: "this should be discussed."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 28, 1966 ("同日"). Made public: 2013. Names: Mao Zedong, Guan Feng, Qi Benyu, Jiang Qing, Bo Yibo, Tao Lujia.'
      tags: [name:mao-zedong, name:jiang-qing, name:bo-yibo, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-29.china-leadership
      when: Aug. 29
      date: '1966-08-29'
      thread: china-leadership
      c: 'Peking. Mao presides over an enlarged Standing Committee meeting: the Revolution goes into society, by argument, not force. Agrees with the Group that most work-team members are good and not every head bad; those who sent the teams to bear the blame; the State Council''s department heads to apologize to the masses; the name "royalist" to go. Red Guards in organs not to be disbanded, nor encouraged; the army is itself Red Guard. Some provincial, large-city and middle-city committees will fall. On Li Fuchun''s ten points (his Aug. 28 note): not one needed.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 29, 1966. Made public: 2013. Names: Mao Zedong, Li Fuchun.'
      tags: [name:mao-zedong, name:li-fuchun, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-30.china-leadership
      when: Aug. 30
      date: '1966-08-30'
      thread: china-leadership
      c: 'Mao reads Zhang Shizhao''s letter of that morning: his house was searched the night before; "send to the Premier to deal with; he should be protected." Zhou Enlai orders the goods returned, two soldiers posted and Zhang moved secretly to Hospital 301, and writes out a list of leaders and democratic figures to be protected: Soong Ching Ling, Guo Moruo, Zhang Shizhao, Cheng Qian, He Xiangning, Fu Zuoyi, Zhang Zhizhong, Cai Tingkai, Shao Lizi, Li Zongren and others. Mao answers Zhang Sept. 1.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 30, 1966. Made public: 2013. Names: Mao Zedong, Zhang Shizhao, Zhou Enlai, Soong Ching Ling, Guo Moruo, Cheng Qian, He Xiangning, Fu Zuoyi, Zhang Zhizhong, Cai Tingkai, Shao Lizi, Li Zongren.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-30.china-leadership-2
      when: Aug. 30
      date: '1966-08-30'
      thread: china-leadership
      c: 'The Center announces: Chen Boda, ill, is excused from work with the Center''s approval; during his leave or his absences from Peking the head of the Cultural Revolution Group is its first deputy head, Jiang Qing.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 30, 1966 ("同日"). Made public: 2013. Names: Chen Boda, Jiang Qing.'
      tags: [name:chen-boda, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-31.china-leadership
      when: Aug. 31
      date: '1966-08-31'
      thread: china-leadership
      c: 'Mao reads Lin Biao''s draft of his speech that afternoon to the Red Guards: after "the Chairman and the Center warmly praise your daring" Lin adds in his hand "Firmly oppose suppressing you! Your revolutionary acts are excellent!" Mao: "Returned to Lin; this change is good."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 31, 1966. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-08-31.china-leadership-2
      when: Aug. 31
      date: '1966-08-31'
      thread: china-leadership
      c: 'Tiananmen. Mao receives 500,000 Red Guards and revolutionary students and teachers (the second reception), puts on a Red Guard armband, tells Chen Yi on the tower "Old Chen, I''ll protect you," and is photographed with him arm in arm.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 31, 1966. Names: Mao Zedong, Chen Yi.'
      tags: [name:mao-zedong, name:chen-yi, polity:prc]
- add:
    entry:
      id: cal.1966-09-01.china-leadership
      when: Sept. 1
      date: '1966-09-01'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Mao, Liu Shaoqi, Zhu De and Zhou Enlai cable Hồ Chí Minh, Trường Chinh and Phạm Văn Đồng on the DRV''s 21st anniversary: the U.S. aggressors are in the fire of the people''s war, hoping to save themselves by widening the war and the "peace talks" trick; the Chinese people are ready to strike the American aggressors with the Vietnamese anywhere, at any time, to the final victory.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 1, 1966. Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Hồ Chí Minh, Trường Chinh, Phạm Văn Đồng.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:zhu-de, name:zhou-enlai, name:ho-chi-minh, name:truong-chinh, name:pham-van-dong, polity:prc, polity:drv]
- add:
    entry:
      id: cal.1966-09-01.china-leadership-2
      when: Sept. 1
      date: '1966-09-01'
      thread: china-leadership
      c: 'Mao, at the pool at noon, hears Zhou Enlai on Xinjiang and Qingdao. On Sept. 4 he approves three papers Zhou sends: the Center''s telegram putting Tan Qilong in charge of settling the Qingdao workers'' and students'' dispute; two telegrams to the Xinjiang committee and the Northwest Bureau: protect Saifudin, Wang Enmao shielded him in no way; in Yili, Tacheng and Altay the Revolution to go in the "four bigs" only in a way that denies the Soviets an opening.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 1, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Tan Qilong, Saifudin, Wang Enmao.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-01.china-leadership-3
      when: Sept. 1
      date: '1966-09-01'
      thread: china-leadership
      c: 'Mao reads the General Political Department''s report of Aug. 31: the Revolution in the army''s organs above army level, planned for two or three months from September, is put off in the large military regions and the garrisons of the large cities, since several provinces'' leaderships are paralyzed and the army must stand ready. "Do as proposed."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 1, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-02.china-leadership
      when: Sept. 2
      date: '1966-09-02'
      thread: china-leadership
      c: 'Mao circles Zhou Enlai''s notice for the Center and the Military Commission: no outsiders to enter the top-secret plants and research and design units of the Second Ministry of Machine Building (the atomic-energy ministry). Issued that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 2, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-03.china-leadership
      when: Sept. 3
      date: '1966-09-03'
      thread: china-leadership
      c: 'Mao reads Fu Lianzhang''s letter of Aug. 28: labeled an "anti-Party, anti-socialist black gang member," he begs protection. Mao: "To Tao Zhu: look into it. This man is no power-holder and has no great crime; he should be protected." Tao writes the same day to Xiao Hua and Liu Zhijian of the General Political Department to have the General Logistics Department protect him.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 3, 1966. Made public: 2013. Names: Mao Zedong, Fu Lianzhang, Tao Zhu, Xiao Hua, Liu Zhijian.'
      tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-05.china-leadership
      when: Sept. 5
      date: '1966-09-05'
      thread: china-leadership
      c: 'Mao, at the pool, to He Long: gives him the accusation written by Wu Faxian and others at Lin Biao''s instigation. Do not be afraid; "I''ll be your royalist." His old three marks of He: loyal to the Party and people, hard on the enemy, close to the masses.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1966. Made public: 2013. Names: Mao Zedong, He Long, Wu Faxian, Lin Biao.'
      tags: [name:mao-zedong, name:he-long, name:wu-faxian, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-05.china-leadership-2
      when: Sept. 5
      date: '1966-09-05'
      thread: china-leadership
      c: 'Mao at the pool to Lin Biao, Zhou Enlai, Wang Renzhong and others: no more life meetings on Liu Shaoqi; the tone rises each time, to "anti-Party, anti-socialist," and that puts him with Peng, Luo, Lu and Yang. History: Chen Duxiu in 1927 only "rightist," expelled only for splitting; Qu Qiubai putschist, a line error; Li Lisan; the Fourth Plenum, Luo Zhanglong''s Center; Wang Ming''s four years; Li Lisan and Wang Ming re-elected at the Seventh Congress; Zhang Guotao''s Center, yet with good men in it (Xu Xiangqian, Li Xiannian).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1966. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Wang Renzhong, Liu Shaoqi, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun, Chen Duxiu, Qu Qiubai, Li Lisan, Wang Ming, Zhang Guotao, Xu Xiangqian, Li Xiannian.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:liu-shaoqi, name:peng-zhen, name:luo-ruiqing, name:lu-dingyi, name:xu-xiangqian, name:li-xiannian, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-05.china-leadership-3
      when: Sept. 5
      date: '1966-09-05'
      thread: china-leadership
      c: 'Mao reads, at 2 a.m., Tao Zhu''s draft *Renmin ribao* editorial "Use Civilized Struggle, Not Violence": "seen; issue." It says the Chairman has told us again and again that the Revolution is to be made by argument, not force. Printed Sept. 5.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1966. Made public: 2013. Names: Mao Zedong, Tao Zhu.'
      tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-05.china-leadership-4
      when: Sept. 5
      date: '1966-09-05'
      thread: china-leadership
      c: 'The Center and State Council issue a notice on bringing revolutionary students of colleges and middle schools outside Peking, with teachers'' and staff representatives, to Peking to see the Cultural Revolution. The Red Guards'' "great linking up" quickens.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 5, 1966.'
      tags: [polity:prc]
- add:
    entry:
      id: cal.1966-09-07.china-leadership
      when: Sept. 7
      date: '1966-09-07'
      thread: china-leadership
      c: 'Mao reads Wang Xiaoyu''s report of Sept. 4 to the Cultural Revolution Group (Qingdao: the Laoshan county four-cleanups team tells workers and peasants to educate the students): wrong; Qingdao, Changsha, Xi''an alike set workers against students. To Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Li Fuchun, Wang Renzhong and Jiang Qing: the Center should issue an instruction against it and a *Renmin ribao* editorial urge workers and peasants not to meddle; Peking has not set workers and peasants on students. The editorial "Grasp Revolution, Promote Production" appears that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 7, 1966. Made public: 2013. Names: Mao Zedong, Wang Xiaoyu, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Li Fuchun, Wang Renzhong, Jiang Qing.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:tao-zhu, name:chen-boda, name:kang-sheng, name:li-fuchun, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-08.china-leadership
      when: Sept. 8
      date: '1966-09-08'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s Sept. 5 provisional rules on approving the appointment and removal of Party and government cadres, drawn by the Standing Committee liaison meeting: bureau secretaries and provincial and ministerial heads, fixed by the Standing Committee or proposed by the liaison meeting for Mao and Lin Biao; bureau-level cadres by Tao Zhu; the heads of large regions, services and headquarters to Mao and the Center. "Print for the Politburo, Secretariat, Group and Peking committee; discuss soon."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 8, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao, Tao Zhu.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-09.china-leadership
      when: Sept. 9
      date: '1966-09-09'
      thread: china-leadership
      c: 'Mao reads Chen Yi''s Sept. 9 foreign-affairs bulletin no. 9: an Austrian''s letter faults China''s staff in Vienna for dress and cars; a Tanzanian''s letter faults the embassy''s show. "This criticism is well written; every mission abroad should take note; revolutionize, else it is dangerous; begin at Vienna."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 9, 1966. Made public: 2013. Names: Mao Zedong, Chen Yi.'
      tags: [name:mao-zedong, name:chen-yi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-09.china-leadership-2
      when: Sept. 9
      date: '1966-09-09'
      thread: china-leadership
      c: 'Evening. Mao has Xu Yefu telephone He Long: the matter has been settled with Lin Biao and others; go and call on them. Next day He Long tells Lin: he opposes whoever opposes the Party Center and Mao, and backs whoever backs them.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 9, 1966. Made public: 2013. See [[cal.1966-09-05.china-leadership]]. Names: Mao Zedong, Xu Yefu, He Long, Lin Biao.'
      tags: [name:mao-zedong, name:he-long, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-10.china-leadership
      when: Sept. 10–15
      date: '1966-09-10'
      thread: china-leadership
      c: 'Mao five times reads Tao Zhu''s draft Center notice on the display of portraits and the slogans for National Day. Sept. 10: cuts the hundred slogans, "too many, scholasticism," to thirty at most; Sept. 12: thirty; Sept. 14: twenty-three, "a lesson: think; do not decide in haste; ask more comrades about great matters"; Sept. 15 and 16: "agreed."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 10, 1966. Made public: 2013. Names: Mao Zedong, Tao Zhu.'
      tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-11.china-leadership
      when: Sept. 11
      date: '1966-09-11'
      thread: china-leadership
      c: 'Mao circles, at dawn, Tao Zhu''s draft *Renmin ribao* editorial "Workers, Peasants and Revolutionary Students, Unite Under the Banner of Mao Zedong Thought," sent at 1 a.m. with the note that it follows Mao''s instruction and was revised by the Cultural Revolution Group. Printed that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 11, 1966. Made public: 2013. Names: Mao Zedong, Tao Zhu.'
      tags: [name:mao-zedong, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-13.china-leadership
      when: Sept. 13
      date: '1966-09-13'
      thread: china-leadership
      c: 'Mao, ill three days, to Lin Biao, Zhou Enlai and Tao Zhu: a rally of 700,000 at Tiananmen on the 14th or 15th, 10 a.m. or 5 p.m.; if he can get up he will see the crowds; if not, Lin to preside.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 13, 1966. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Tao Zhu.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-14.china-leadership
      when: Sept. 14
      date: '1966-09-14'
      thread: china-leadership
      c: 'Mao approves, "issue at once, no discussion," the Center''s rules (Zhou Enlai''s and Tao Zhu''s, discussed Sept. 8) for the Cultural Revolution below the county: it goes with the Four Cleanups; Peking and out-of-town students and Red Guards not to link up below the county unless the provincial or prefectural committee arranges; the Four Cleanups may pause for the autumn harvest; the "four olds" in the villages to be broken in the slack season. Five articles.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 14, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Tao Zhu.'
      tags: [name:mao-zedong, name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-14.china-leadership-2
      when: Sept. 14
      date: '1966-09-14'
      thread: china-leadership
      c: 'Mao approves, "issue at once," Li Fuchun''s Sept. 9 draft notice on grasping revolution and promoting production: the Sept. 7 editorial to be posted as a wall poster; staff of enterprises, construction, research, design and commerce stay at their posts; Red Guards not to link up there; in units where the Revolution has begun, two teams, one for revolution, one for production and work. Six articles.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 14, 1966. Made public: 2013. Names: Mao Zedong, Li Fuchun.'
      tags: [name:mao-zedong, name:li-fuchun, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-14.china-leadership-3
      when: Sept. 14
      date: '1966-09-14'
      thread: china-leadership
      c: 'Mao reads Liu Shaoqi''s draft outline of self-criticism for the meeting of work-group leaders in Peking: "basically well written, very serious, the second half better"; to be circulated as a draft to the Politburo, Secretariat, work-group leaders, Peking committee and Cultural Revolution Group for opinion, then revised before reporting, "which may steady it." Liu speaks on it Oct. 23, at the work conference.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 14, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-15.china-leadership
      when: Sept. 15
      date: '1966-09-15'
      thread: china-leadership
      c: 'Tiananmen. Mao receives a million Red Guards and revolutionary teachers and students from all over the country (the third reception), Lin Biao and Zhou Enlai speaking. He is photographed with some 300 student delegates and alone with Jiao Shouyun, daughter of Jiao Yulu; receives Ted Hill, chairman of the Communist Party of Australia (Marxist-Leninist), and his wife; tells Chen Yun, whom he meets, "I have not overthrown you; rest and work later."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1966. To check: Xinhua''s report of the review (Sept. 16). Names: Mao Zedong, Lin Biao, Zhou Enlai, Jiao Shouyun, Ted Hill, Chen Yun. Check: the talk with Chen Yun is from the nianpu alone.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:chen-yun, polity:prc]
- add:
    entry:
      id: cal.1966-09-15.china-leadership-2
      when: Sept. 15
      date: '1966-09-15'
      thread: china-leadership
      c: 'Mao, morning, reads Tao Zhu''s draft of Lin Biao''s speech for that afternoon: "very good; I changed a little." His changes: "a small handful of reactionary bourgeois elements, the unreformed landlords, rich peasants, counter-revolutionaries, bad elements and rightists, who oppose the proletariat''s dictatorship and plan to shell our proletarian headquarters." On whether Lin alone should speak or Zhou also (Zhou preferred Lin alone; Tao, both): "both may speak"; Zhou''s draft, "agreed."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1966. Made public: 2013. Names: Mao Zedong, Tao Zhu, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:tao-zhu, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-16.china-leadership
      when: Sept. 16
      date: '1966-09-16'
      thread: china-leadership
      c: 'Kang Sheng writes Mao that Liu Shaoqi had ordered An Ziwen, Bo Yibo and others to "surrender" and leave prison: in 1936 sixty-one Party members, with the Center''s approval, came out of prison. Kang: "I long doubted" the decision. Mao: "Seen." On Nov. 24 Mao reads Zhou Enlai''s draft telegram to the Northwest Bureau on Liu Lantao''s release, and Liu Lantao''s letter of Nov. 22.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, mid-Sept. 1966 (the entry "9月中旬") and note 71. Made public: 2013. Names: Kang Sheng, Mao Zedong, Liu Shaoqi, An Ziwen, Bo Yibo, Zhou Enlai, Liu Lantao. Check: the nianpu dates the letter in the middle ten days of Sept; Kang''s letter bears Sept. 16.'
      tags: [name:kang-sheng, name:mao-zedong, name:liu-shaoqi, name:bo-yibo, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-17.china-leadership
      when: Sept. 17
      date: '1966-09-17'
      thread: china-leadership
      c: 'Mao approves Lin Biao''s report of Sept. 17: the General Staff and General Political Department propose that no Red Guards or similar bodies be formed in villages, factories, offices, institutes and mass organizations, and the Center''s covering note: "do as proposed." Issued Sept. 25.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 17, 1966 (the entry "9月中下旬"). Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-24.china-leadership
      when: Sept. 24
      date: '1966-09-24'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s telegram, agreed at the Standing Committee liaison meeting that day, to the East China Bureau, the Shanghai committee and the Peking Red Guards'' Southern Column and the Peking schools'' Red Guards in Shanghai: the Sixteen Points'' rule of argument, not force, must be kept; the forced parade of capitalists in Shanghai on Sept. 25 and the mass meeting planned must stop; the Peking Red Guards finish and come home for National Day. Sent the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 24, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-09-30.china-leadership
      when: Sept. 30–Oct. 1
      date: '1966-09-30'
      thread: china-leadership
      c: 'Mao reads Chen Boda''s and Zhang Chunqiao''s draft of Lin Biao''s National Day speech, which says "bourgeois reactionary line"; Tao Zhu and others think it too heavy and propose "bourgeois anti-revolutionary line." Mao agrees. On Oct. 1 evening Zhang says the phrase in Lin''s speech is ungrammatical and proposes the first wording back. Mao: leave it; "from now say: thoroughly criticize the bourgeois reactionary line."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, end of Sept. 1966 (the entry "9月底") and Oct. 1, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda, Zhang Chunqiao, Lin Biao, Tao Zhu. Check: the nianpu gives only "end of September" for the draft; the speech''s printed phrase, Check *Renmin ribao*, Oct. 2.'
      tags: [name:mao-zedong, name:chen-boda, name:zhang-chunqiao, name:lin-biao, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-01.china-leadership
      when: Oct. 1
      date: '1966-10-01'
      thread: china-leadership
      c: 'Tiananmen, 10 a.m. Mao at the rally for the PRC''s seventeenth anniversary (over 1,500,000), receives Red Guards and revolutionary teachers and students (the fourth reception); at noon, the wounded drillers of the Daqing 3211 team; walks over Jinshui Bridge into the crowd. The day lasts over six hours. Evening: sits on the square with the people; watches the fireworks from the gate.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-10-01.china-leadership-2
      when: Oct. 1
      date: '1966-10-01'
      thread: china-leadership
      c: 'On the Tiananmen tower, Mao to Ted Hill: go to the universities; left, right and middle; the old intellectuals still needed, for the papers and broadcasts; full change takes long. Pointing to the marchers: imperialism and revisionism fear the students, and so do some of our cadres, central and provincial, who would call out workers and peasants against them, not the army. To Li Zongren: the Red Guards sealed the CPPCC and the democratic parties, but both remain.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1966. Made public: 2013. Names: Mao Zedong, Ted Hill, Li Zongren.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-02.china-leadership
      when: Oct. 2
      date: '1966-10-02'
      thread: china-leadership
      c: 'The *Renmin ribao* reprints, ahead of *Hongqi* no. 13, the editorial "Advance on the Great Road of Mao Zedong Thought": "the bourgeois reactionary line must be thoroughly criticized," the phrase''s first public use. Zhou Enlai tells Mao his view: the Party has called line errors "left" or "right," never "bourgeois reactionary." Mao explains in English: first "counter-revolutionary line," then "anti-revolutionary line," and "reactionary line" at last the best.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 2, 1966. Made public: 2013. Names: Zhou Enlai, Mao Zedong.'
      tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-04.china-leadership
      when: Oct. 4
      date: '1966-10-04'
      thread: china-leadership
      c: 'Mao, at the pool, presides over an enlarged Politburo meeting that hears Zhou Enlai, Tao Zhu and army leaders on the Cultural Revolution. He proposes a Center work conference of the regions'' heads.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 4, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Tao Zhu.'
      tags: [name:mao-zedong, name:zhou-enlai, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-05.china-leadership
      when: Oct. 5
      date: '1966-10-05'
      thread: china-leadership
      c: 'With Mao''s reading and consent the Center forwards the Military Commission''s and General Political Department''s urgent directive on the Cultural Revolution in military academies, from Lin Biao''s proposal: every frame binding the masses'' movement in the academies to be discarded.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 5, 1966. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-07.china-leadership
      when: Oct. 7
      date: '1966-10-07'
      thread: china-leadership
      c: 'Mao answers Zhou Enlai''s Oct. 7 request: Lin Biao asked yesterday whether Mao still weighs the gain and loss of holding a national work conference now; if too early, the bureau secretaries and provinces can be told by telephone to wait. Mao: "Hold it as planned, but seven days, not three."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 7, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-09.china-leadership
      when: Oct. 9–28
      date: '1966-10-09'
      thread: china-leadership
      c: 'Peking, Great Hall, East Hall. The Central Work Conference opens, Mao presiding; Lin Biao introduces the agenda. The bureaus'' secretaries, the provinces'' heads and the Center ministries'' heads attend; the conference discusses the Cultural Revolution and criticizes the "bourgeois reactionary line."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 9, 1966. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-14.china-leadership
      when: Oct. 14
      date: '1966-10-14'
      thread: china-leadership
      c: 'Evening, at the pool. Mao calls the Politburo''s standing members, the bureaus'' heads and the conference''s group leaders and hears reports on the conference.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 14, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-15.china-leadership
      when: Oct. 15
      date: '1966-10-15'
      thread: china-leadership
      c: 'Mao reads Chen Boda''s draft speech for the conference, "The Two Lines in the Great Proletarian Cultural Revolution" (four parts: the situation good; the two lines; and others the nianpu does not name). Evening: "seen, usable; the rest to follow; give it out to the members for several days'' discussion afterward." On cadres'' sons "some not good, some bad, even on the revisionist road, degenerating into revisionist representatives" he strikes the last clause. Night: part four, "usable; print the whole at once so it can be handed out as it is spoken."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 15, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-18.china-leadership
      when: Oct. 18
      date: '1966-10-18'
      thread: china-leadership
      c: 'Peking. Mao, in an open car along Chang''an Avenue, receives 1,500,000 Red Guards and revolutionary teachers and students for over an hour, the fifth reception.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-10-22.china-leadership
      when: Oct. 22
      date: '1966-10-22'
      thread: china-leadership
      c: '4 a.m. Mao reads Deng Xiaoping''s "preliminary self-criticism" for the conference (draft of Oct. 21): "may be given so." After "turn over a new leaf" add something positive: with one''s own effort and comrades'' help one believes the errors will be corrected; "give me time, I shall stand up; half a life in revolution, a fall, am I to be crushed?" And drop "preliminary" from the title.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 22, 1966. Made public: 2013. Names: Mao Zedong, Deng Xiaoping.'
      tags: [name:mao-zedong, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-23.china-leadership
      when: Oct. 23
      date: '1966-10-23'
      thread: china-leadership
      c: 'Peking. Liu Shaoqi and Deng Xiaoping make their self-criticisms at the Central Work Conference, taking the main responsibility for the "line error" in directing the Cultural Revolution.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 23, 1966. Made public: 2013. Names: Liu Shaoqi, Deng Xiaoping.'
      tags: [name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-24.china-leadership
      when: Oct. 24
      date: '1966-10-24'
      thread: china-leadership
      c: 'Peking, the pool, evening. Mao to Politburo members and bureau heads: the conference is nearly done. The students have made mistakes, but we "lords" mostly; never admit "anti-Party, anti-socialist": could one still work? Liu''s and Deng''s posters should not be put in the streets; let them err; allow people to make revolution (Lu Xun''s *Ah Q*, "not allowed to make revolution"). The disorder came from the Center: "I did not think one poster of Nie Yuanzi''s, one Red Guard, one national link-up would make so much." Five months'' experience; five years needed.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 24, 1966. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Nie Yuanzi.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-24.china-leadership-2
      when: Oct. 24
      date: '1966-10-24'
      thread: china-leadership
      c: 'Mao hears Nie Rongzhen, Qian Xuesen and others on preparations for the combined missile-and-nuclear-warhead test: prepare for failure; failure is no matter, learn from it. The test succeeds Oct. 27.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 24, 1966. Made public: 2013. To check: Xinhua''s communiqué of Oct. 27, 1966 on the test. Names: Mao Zedong, Nie Rongzhen, Qian Xuesen.'
      tags: [name:mao-zedong, name:nie-rongzhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-24.china-leadership-3
      when: Oct. 24
      date: '1966-10-24'
      thread: china-leadership
      c: 'Mao returns Chen Boda''s revised speech of Oct. 16: "seen, very good; put ''grasp revolution, promote production'' in somewhere; print as small booklets, at least two for every Party branch and every Red Guard squad." On Nov. 6, on a second revision: first to county and regiment level, then down when the cadres above are of one mind. Issued Nov. 9.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 24, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-25.china-leadership
      when: Oct. 25
      date: '1966-10-25'
      thread: china-leadership
      c: 'Peking. Mao to the Central Work Conference, on the first and second fronts and on the Cultural Revolution. After Stalin''s death Malenkov could not hold, and revisionism came; hence a first and a second front; now it has bred "independent kingdoms," and the Eleventh Plenum changed it. Before it he was on the second front, leaving daily work to others to build their standing; he bears blame, for proposing the Secretariat and for trusting too much. Peking could not carry out his views, so the Wu Han criticism began in Shanghai.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 25, 1966. Made public: 2013. Names: Mao Zedong, Wu Han.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-25.china-leadership-2
      when: Oct. 25
      date: '1966-10-25'
      thread: china-leadership
      c: 'Great Hall, Fujian Hall, evening. Mao receives Pakistan''s Foreign Minister Sharifuddin Pirzada and his wife, Chen Yi and his wife Zhang Qian present; signs an English *Quotations from Chairman Mao* at the guest''s request.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 25, 1966. Names: Mao Zedong, Sharifuddin Pirzada, Chen Yi, Zhang Qian.'
      tags: [name:mao-zedong, name:pirzada-sharifuddin, name:chen-yi, polity:prc, polity:pakistan]
- add:
    entry:
      id: cal.1966-10-25.china-leadership-3
      when: Oct. 25
      date: '1966-10-25'
      thread: china-leadership
      c: 'Mao cables the Fifth Congress of the Albanian Party of Labor: Albania, "a great beacon of socialism in Europe"; he quotes a Tang line of poetry (a friend at the world''s edge is as a neighbor).'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 25, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-10-28.china-leadership
      when: Oct. 28
      date: '1966-10-28'
      thread: china-leadership
      c: 'At the pool Mao calls Zhou Enlai and others to talk on conveying the conference''s spirit and the specific policies.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 28, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-10-31.china-leadership
      when: Oct. 31
      date: '1966-10-31'
      thread: china-leadership
      c: 'Mao reads Xiao Hua''s report of Oct. 30 to Lin Biao on how the army makes its Cultural Revolution: those back from the work conference to pass on its spirit; the military regions'' organs begin in November, to end about the Spring Festival; army-level organs first as in divisions, with positive education; military districts about two months; academies strengthened; units below army keep order. "Agreed; returned to Lin."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 31 or early Nov. 1966 (the entry "10月31日或11月初"). Made public: 2013. Names: Mao Zedong, Xiao Hua, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-03.china-leadership
      when: Nov. 3
      date: '1966-11-03'
      thread: china-leadership
      c: 'Tiananmen. Mao receives over two million Red Guards and revolutionary teachers and students from 10:10 a.m. for more than seven hours, the sixth reception. On the tower he asks Liu Shaoqi about Wang Guangmei and the children. Liu: now that the Revolution is up, I will go to the masses too. Mao: you are old; do not.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 3, 1966. Names: Mao Zedong, Liu Shaoqi, Wang Guangmei. Check: the talk with Liu, from the nianpu alone.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc]
- add:
    entry:
      id: cal.1966-11-04.china-leadership
      when: Nov. 4
      date: '1966-11-04'
      thread: china-leadership
      c: 'Mao reads Lin Biao''s revised speech of Oct. 25 to the work conference (Lin''s cover note of Nov. 3: "your instructions very good; I fully agree"). Changes: "thought-consciousness" to "ideology" or "the realm of thought"; "communism is selflessness" to "communism is for the public"; "Chairman Mao created a new type of state" to "led us to create"; strikes from the sentence that none in the world is Chairman Mao''s equal in practice, theory or talent a clause the nianpu cuts off. "Agreed."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 4, 1966. Made public: 2013. Names: Mao Zedong, Lin Biao. Check: the nianpu''s sentence breaks off ("现在还…"); the exact clause struck, Check.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-06.china-leadership
      when: Nov. 6
      date: '1966-11-06'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s Oct. 31 report on printing Liu Shaoqi''s and Deng Xiaoping''s self-criticisms: "do it." The Center General Office prints both Nov. 9 for county and regiment level.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 6, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
      tags: [name:mao-zedong, name:zhou-enlai, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-08.china-leadership
      when: Nov. 8
      date: '1966-11-08'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Zhongnanhai, the Yinian Tang, evening. Mao receives the Vietnam Workers'' Party Central Committee delegation under Lê Duẩn, Lin Biao and Zhou Enlai present, on the war. It is a fact that cannot be unmade; who attacked whom is plain. In the last two years they have found the basic rules, theirs and the enemy''s strengths and weaknesses; "we back you"; their experience has world meaning, all learn from it how to fight Americans. The United States is the one that fears: why else add troops? Asia''s masses hold a revolt not yet broken out; the Vietnamese will win; the hardest time marks the nearing victory (the Diem years, or now). The Soviet people still help.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 8, 1966. Made public: 2013. Names: Mao Zedong, Lê Duẩn, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:le-duan, name:lin-biao, name:zhou-enlai, polity:prc, polity:drv, vis:only:prc+drv]
- add:
    entry:
      id: cal.1966-11-10.china-leadership
      when: Nov. 10–11
      date: '1966-11-10'
      thread: china-leadership
      c: 'Tiananmen. Mao receives over two million Red Guards and revolutionary teachers and students, the seventh reception: Nov. 10 from 10 a.m. for six hours (to those Center and other leaders on the tower: "put politics in command, go among the masses"); Nov. 11 from 2:30 p.m., in an open car along Chang''an Avenue.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 10, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-11-14.china-leadership
      when: Nov. 14
      date: '1966-11-14'
      thread: china-leadership
      c: 'Peking, Diaoyutai Building 12, afternoon. A meeting of some Politburo standing members and the Cultural Revolution Group affirms the words and acts of the Shanghai Workers'' General Headquarters in the Anting incident, and tells Chen Boda to draft a document on how mines and factories are to make the Cultural Revolution.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 14, 1966. Made public: 2013. Names: Chen Boda. Check: whether Mao attended; the nianpu does not say.'
      tags: [name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-15.china-leadership
      when: Nov. 15
      date: '1966-11-15'
      thread: china-leadership
      c: 'Diaoyutai Building 12. Mao calls Zhou Enlai and others to discuss the handling of archives in the Cultural Revolution. On Nov. 16 the Politburo revises the supplementary regulation by Mao''s view; Zhou sends it; midnight, Mao: "returned to the Premier; do as drafted." Issued the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 15, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-16.china-leadership
      when: Nov. 16
      date: '1966-11-16'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s draft notice of the Center and State Council: from Nov. 21 to the spring thaw, revolutionary students, teachers and Red Guards of colleges, military academies and middle schools stop traveling by train, boat or bus to Peking or elsewhere to link up; those waiting at stations to be persuaded home; transport is wanted to carry freight in the first year of the Third Five-Year Plan.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 16, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-17.china-leadership
      when: Nov. 17
      date: '1966-11-17'
      thread: china-leadership
      c: 'Zhongnanhai, the Yinian Tang, evening. Mao receives a Guinean economic delegation under Ismael Touré, Minister of Economic Development, Chen Yi present. Guinea''s stand against imperialism helps the world''s peoples; the Americans, three million, fought Britain eight years and won; Guinea has more than that. China''s inherited school system and its staff are of the Kuomintang; reform is needed, and the outcome not sure.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 17, 1966. To check: Xinhua''s report. Names: Mao Zedong, Ismael Touré, Chen Yi.'
      tags: [name:mao-zedong, name:chen-yi, polity:prc, polity:guinea]
- add:
    entry:
      id: cal.1966-11-17.china-leadership-2
      when: Nov. 17–21
      date: '1966-11-17'
      thread: china-leadership
      c: 'Peking. An industry-and-communications forum of provincial and State Council officials takes up the "twelve instructions on the Cultural Revolution in factories" drafted under Chen Boda. They reject its allowance of factory factions and student link-ups, and a draft by Gu Mu, "Some Provisions on the Cultural Revolution in Industrial and Communications Enterprises" (the "fifteen articles"), says the industry front for seventeen years followed Mao''s line: no stopping production; workers join in spare hours; students not to link up in factories. Chen Boda and the Group oppose and attack it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 17, 1966. Made public: 2013. Names: Chen Boda, Gu Mu.'
      tags: [name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-20.china-leadership
      when: Nov. 20
      date: '1966-11-20'
      thread: china-leadership
      c: 'The Center forwards the Peking committee''s notice of Nov. 18: no factory, mine, school, office or other unit may keep a private jail or court, or seize and beat people. Mao had told Chen Boda to send Wang Li and Guan Feng around Peking to find any such places and have the prisoners released at once.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 20, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda, Wang Li, Guan Feng.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-22.china-leadership
      when: Nov. 22
      date: '1966-11-22'
      thread: china-leadership
      c: 'Mao hears Zhou Enlai and Li Fuchun on the draft provisions for industry. Four points: the Revolution in mines and factories by stages; the eight-hour day untouched, workers make revolution in spare hours; after revision Gu Mu to take a team to Shanghai, Tianjin and Shenyang and hear every faction, aim to issue in December; the draft''s list of power-holders too wide, drop "forgetting one''s roots, selfish, suppressing the masses."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 22, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Fuchun, Gu Mu.'
      tags: [name:mao-zedong, name:zhou-enlai, name:li-fuchun, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-24.china-leadership
      when: Nov. 24
      date: '1966-11-24'
      thread: china-leadership
      c: 'Mao reads Jiang Qing''s draft speech of Nov. 24 for the coming arts-and-literature rally and adds a paragraph: new literature and art have grown against the old; even Peking opera, hardest to reform, has new works; thirty years ago Lu Xun was the bold banner-bearer of the cultural revolution. Nov. 28, 1 a.m., on her draft of the 27th: a paragraph added where she speaks of work groups: the trouble is their policy, not their form; units without groups relied on old leaders.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, late Nov. 1966 (the entry "11月下旬"). Made public: 2013. Names: Mao Zedong, Jiang Qing, Lu Xun.'
      tags: [name:mao-zedong, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-25.china-leadership
      when: Nov. 25
      date: '1966-11-25'
      thread: china-leadership
      c: 'With Mao''s consent the Center and State Council telegraph the East China Bureau and the Zhejiang committee: a few of the masses have taken the Wenzhou public security bureau; it harms order, the fight against the enemy and the Revolution; withdraw at once; the same elsewhere.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 25, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-11-25.china-leadership-2
      when: Nov. 25–26
      date: '1966-11-25'
      thread: china-leadership
      c: 'Tiananmen. Mao receives 2,500,000 Red Guards and revolutionary teachers and students, the eighth and last reception: Nov. 25 from 11:30 a.m., four hours; Nov. 26 from 2:30 p.m., in an open car, at the square, Chang''an Avenue and the western airfield. Since Aug. 18 he has received over 11,000,000 person-times.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 25, 1966. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-12-02.china-leadership
      when: Dec. 2
      date: '1966-12-02'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s draft of Dec. 1, a supplementary Center and State Council notice on revolutionary link-ups: students who reached Peking before Nov. 16 and those traveling elsewhere to be home by Dec. 20; free meals and rides end Dec. 21; four rules. He strikes from the draft the string of titles before "Chairman Mao" (great teacher, leader, commander, helmsman). Issued that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 2, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-03.china-leadership
      when: Dec. 3
      date: '1966-12-03'
      thread: china-leadership
      c: 'Mao reads Xinhua''s report of the capital arts rally; Zhou Enlai''s covering note says the Group and Lin Biao approved it and asks whether three passages naming people are fit. Mao strikes the names: Peng Zhen, Liu Ren, Zheng Tianxiang, Wan Li, Deng Tuo, Chen Kehan, Li Qi, Zhao Dingxin, Lu Dingyi, Zhou Yang, Lin Mohan, Qi Yanming, Xia Yan, Tian Han and Yang Hansheng. Printed Dec. 4.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 3, 1966. Made public: Dec. 4, 1966 (*Renmin ribao*). Names: Mao Zedong, Zhou Enlai, Lin Biao, Peng Zhen, Lu Dingyi, Zhou Yang.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, name:peng-zhen, name:lu-dingyi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-03.china-leadership-2
      when: Dec. 3
      date: '1966-12-03'
      thread: china-leadership
      c: 'Mao approves the Nanjing Military Region committee''s urgent report of Dec. 1 and has the Military Commission send it all over the country: demobilized and transferred soldiers to form no Red Guards or other separate bodies, join the Revolution in their own units; not to storm army offices; not to link up in units or hand out leaflets there.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 3, 1966 ("同日"). Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-04.china-leadership
      when: Dec. 4–6
      date: '1966-12-04'
      thread: china-leadership
      c: 'Peking. Lin Biao presides over an enlarged Politburo meeting that hears Gu Mu on his revised draft of the provisions for industry. Lin and others criticize and reject the draft.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 4, 1966. Made public: 2013. Names: Lin Biao, Gu Mu.'
      tags: [name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-09.china-leadership
      when: Dec. 9
      date: '1966-12-09'
      thread: china-leadership
      c: 'The pool. Mao attends the Standing Committee liaison meeting, Zhou Enlai presiding, which passes the "Ten Provisions of the Center on Grasping Revolution and Promoting Production" (the "industrial ten"), redrafted by Chen Boda and others: workers have the right to form revolutionary organizations, exchange experience in their own city in spare time; students may visit plants by plan in the workers'' spare hours; workers may send delegates to the city''s schools. Issued Dec. 10.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 9, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda.'
      tags: [name:mao-zedong, name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-15.china-leadership
      when: Dec. 15
      date: '1966-12-15'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s Dec. 13 draft "Opinions of the Center on the Cultural Revolution in the Countryside"; Zhou asks whether it is to be settled at Mao''s with some standing members and Group members, or again by Lin Biao with the Politburo, Secretariat, Group and Peking committee. Mao: "Zhou to proceed; Lin to preside, pass it, and issue it at once." Lin presides over the enlarged Politburo meeting that day and it passes: the village revolution''s weight on Party power-holders on the capitalist road and unreformed landlords and other bad elements; the "four bigs"; neighboring teams and communes may visit in slack time.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 15, 1966. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-16.china-leadership
      when: Dec. 16
      date: '1966-12-16'
      thread: china-leadership
      c: 'Lin Biao writes the preface to the second printing of *Quotations from Chairman Mao*: Mao is the greatest Marxist-Leninist of the age, who "genially, creatively and comprehensively" inherited, defended and developed Marxism-Leninism to a new stage.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 16, 1966. Names: Lin Biao, Mao Zedong.'
      tags: [name:lin-biao, name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1966-12-21.china-leadership
      when: Dec. 21
      date: '1966-12-21'
      thread: china-leadership
      also: [soviet-union]
      c: 'The pool. Mao receives the representative of the provisional Central Committee of the Communist Party of Poland (Marxist-Leninist), "Yang Li" in the nianpu; Kang Sheng and Wu Xiuquan present. Fighting Khrushchev''s revisionism alone is not enough; the revisionism in our own party too; we mended and patched, did not treat it as class struggle on the whole; it is not one man but one class against another.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 21, 1966. Made public: 2013. Names: Mao Zedong, Kang Sheng, Wu Xiuquan. Check: the Polish delegate''s name and the party (the nianpu''s 杨力).'
      tags: [name:mao-zedong, name:kang-sheng, polity:prc, polity:poland, vis:only:prc+poland]
- add:
    entry:
      id: cal.1966-12-25.china-leadership
      when: Dec. 25
      date: '1966-12-25'
      thread: china-leadership
      c: 'Mao reads Guan Feng''s Dec. 24 report to Jiang Qing: the *Hongqi* New Year editorial quotes Mao''s "Bombard the Headquarters" poster and his note on the commentator''s article; may it be printed? Mao: "Both not to be quoted."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 25, 1966. Made public: 2013. Names: Mao Zedong, Guan Feng, Jiang Qing.'
      tags: [name:mao-zedong, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-26.china-leadership
      when: Dec. 26
      date: '1966-12-26'
      thread: china-leadership
      c: 'Mao''s seventy-third birthday. Evening, at the pool, on short notice he gives a dinner for Jiang Qing, Chen Boda, Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu and Yao Wenyuan. Before it he speaks: socialist revolution is at a new stage; the USSR has restored capitalism; the new central question is whether the proletariat can keep power; the fortress falls from within. The Cultural Revolution is the whole trial of strength with the bourgeoisie''s agents in the Party: the May 16 Circular, the broadcast poster, the Red Guard link-up joined the country. Chinese revolutions have begun with students.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 26, 1966. Made public: 2013. Names: Mao Zedong, Jiang Qing, Chen Boda, Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu, Yao Wenyuan.'
      tags: [name:mao-zedong, name:jiang-qing, name:chen-boda, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-26.china-leadership-2
      when: Dec. 26
      date: '1966-12-26'
      thread: china-leadership
      c: 'Mao reads Li Xuefeng''s self-criticism points of that day at the North China Bureau: he strikes "peak of Marxism-Leninism" and "highest and liveliest"; to Chen Boda, ask whether the standing members and the Group have it, is it right, is it worth sending out as a model, for many lack the will to criticize themselves truly. Dec. 28 he returns the revised points, "revised well; send so"; Dec. 29 the Center circulates them. Li criticizes his "direction and line errors" from early June to mid-July in directing Peking''s revolution.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 26, 1966. Made public: 2013. Names: Mao Zedong, Li Xuefeng, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-26.china-leadership-3
      when: Dec. 26
      date: '1966-12-26'
      thread: china-leadership
      c: 'Mao reads the Heilongjiang committee''s report of Dec. 23 to the Center and the Northeast Bureau (a three-level cadres'' conference, Nov. 14–Dec. 7): "to Chen Boda and the Group: see if it can go to county and regiment level; I think it better than Li Xuefeng''s; the enclosure is not yet here." Dec. 29 the Center circulates it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 26, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda, Li Xuefeng.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-28.china-leadership
      when: Dec. 28
      date: '1966-12-28'
      thread: china-leadership
      c: 'Mao reads the Heilongjiang Cultural Revolution office''s report of Dec. 25 to the Group on points on the Revolution in city streets (the street movement to aim at Party people on the capitalist road above the street offices and at unreformed landlords and other bad elements; a neighborhood committee chairman is not a power-holder): "To Chen Boda: (1) telegraph agreement to their views; (2) the committee to do more work, gain more experience, then write specific articles for the Center." The Center telegraphs so the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 28, 1966. Made public: 2013. Names: Mao Zedong, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-29.china-leadership
      when: Dec. 29
      date: '1966-12-29'
      thread: china-leadership
      c: 'The pool. Mao calls a meeting and criticizes Jiang Qing for charging Tao Zhu with a line error, without the Center''s approval. At the Standing Committee liaison meetings of Dec. 27 and 28 Jiang and others had called Tao "the biggest royalist in China."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 29, 1966. Made public: 2013. Names: Mao Zedong, Jiang Qing, Tao Zhu.'
      tags: [name:mao-zedong, name:jiang-qing, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-30.china-leadership
      when: Dec. 30
      date: '1966-12-30'
      thread: china-leadership
      c: 'The Center and State Council, Mao having read and agreed, issue the notice on stopping the "red sea" (the painting of Mao''s quotations and portraits everywhere).'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 30, 1966. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1966-12-31.china-leadership
      when: Dec. 31
      date: '1966-12-31'
      thread: china-leadership
      c: 'The Center and State Council issue the notice on short military and political training for revolutionary teachers and students of colleges and middle schools: Mao has often told Lin Biao that training by army cadres is good, and that those trained differ from the untrained; the Peking garrison''s experience to be spread.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 31, 1966. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-01.china-leadership
      when: Jan. 1
      date: '1967-01-01'
      thread: china-leadership
      c: 'The *Renmin ribao* and *Hongqi* New Year editorial, "Carry the Great Proletarian Cultural Revolution Through to the End": 1967 will be the year of all-round class struggle, a general attack by the proletariat and the revolutionary masses on the Party''s handful on the capitalist road and the "ghosts and monsters" in society. *Hongqi* prints Yao Wenyuan''s "On the Counter-Revolutionary Double-Dealer Zhou Yang," with a passage of Mao''s in bold type.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 1, 1967. Names: Yao Wenyuan, Zhou Yang, Mao Zedong.'
      tags: [name:yao-wenyuan, name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1967-01-02.china-leadership
      when: Jan. 2
      date: '1967-01-02'
      thread: china-leadership
      c: 'Mao decides to send Zhang Chunqiao and Yao Wenyuan to Shanghai as investigators of the Cultural Revolution Group, to report to the Center on the Revolution there. They arrive Jan. 4.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 2, 1967. Made public: 2013. Names: Mao Zedong, Zhang Chunqiao, Yao Wenyuan.'
      tags: [name:mao-zedong, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-04.china-leadership
      when: Jan. 4
      date: '1967-01-04'
      thread: china-leadership
      c: 'Mao, at the pool, calls Zhou Enlai and others and asks him about Jiang Qing''s charge that Tao Zhu "suppressed the masses." Zhou reports Tao''s reception on Dec. 30, 1966 of the "Group to Seize Wang Renzhong in Guangzhou" and says it was no suppression. Mao: do not bring Wang Renzhong to Peking; let him make his self-criticism at Wuhan.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 4, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Jiang Qing, Tao Zhu, Wang Renzhong.'
      tags: [name:mao-zedong, name:zhou-enlai, name:jiang-qing, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-06.china-leadership
      when: Jan. 6
      date: '1967-01-06'
      thread: china-leadership
      c: 'Mao reads Liu Shaoqi''s letter of Jan. 5: Red Guards at the Peking Institute of Civil Engineering want him to make a public self-criticism. "To the Premier: please deal with it; I think it better he not speak. Please work on the students." Next morning Zhou receives the students'' delegates and stops them forcing Liu to the institute.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 6, 1967. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-06.china-leadership-2
      when: Jan. 6
      date: '1967-01-06'
      thread: china-leadership
      c: 'Yang Chengwu, acting chief of the General Staff, tells Xu Xiangqian Mao''s instruction that Xu take the headship of the All-Army Cultural Revolution Group. On Jan. 11 the Politburo and the Military Commission so decide.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 6, 1967. Made public: 2013. Names: Yang Chengwu, Xu Xiangqian, Mao Zedong.'
      tags: [name:xu-xiangqian, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-08.china-leadership
      when: Jan. 8
      date: '1967-01-08'
      thread: china-leadership
      c: 'Mao calls Chen Boda, Kang Sheng, Jiang Qing, Wang Li, Guan Feng, Qi Benyu and others, on the seizure of the Shanghai *Wenhui bao* (Jan. 4) and *Jiefang ribao* (Jan. 5) by their rebels: the direction is good, a seizure of power by the left; "this is a national question; we back their rebellion"; one class overthrowing another. Revolution needs opinion first: reprint the Red Guard papers widely; "our papers are dead"; use left, middle and right and keep in touch with all.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 8, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Kang Sheng, Jiang Qing, Wang Li, Guan Feng, Qi Benyu.'
      tags: [name:mao-zedong, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-10.china-leadership
      when: Jan. 10
      date: '1967-01-10'
      thread: china-leadership
      c: 'Mao reads two Xinhua pieces from Jiang Qing (on the Shanghai rebels'' attack on the bourgeois reactionary line, and the Shanghai Workers'' General Headquarters'' urgent notice to the two papers, Jan. 9, which freezes funds and bars higher wages and calls the Shanghai committee''s economism its new form): "Both very good. In two or three days draft for the Center, State Council and Military Commission a message of congratulation to Shanghai''s rebel bodies, saying their line and acts are right and calling the whole Party, army and people to follow; then pass it at a larger meeting."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 10, 1967. Made public: 2013. Names: Mao Zedong, Jiang Qing.'
      tags: [name:mao-zedong, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-11.china-leadership
      when: Jan. 11
      date: '1967-01-11'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s drafts of the message to Shanghai''s rebel bodies (from the Center, State Council, Military Commission and Cultural Revolution Group) and a *Renmin ribao*–*Hongqi* editorial against economism, and Chen Boda''s and Jiang Qing''s drafts of Jan. 9 on economism, on stopping the corruption of mass bodies, and on broadcasting stations: "all five seen, very good. Lin Biao to preside over a Politburo meeting this afternoon or tomorrow, with the Group and some others, to pass and issue them."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 11, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Jiang Qing, Lin Biao.'
      tags: [name:mao-zedong, name:zhou-enlai, name:chen-boda, name:jiang-qing, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-11.china-leadership-2
      when: Jan. 11
      date: '1967-01-11'
      thread: china-leadership
      c: 'Peking, Great Hall, Hebei Hall. A Politburo meeting, Zhou Enlai presiding. On the many posters against He Long: Mao has said only that He is to call on people and hear their criticism, not be named in public, nor seized by Red Guards. Xu Xiangqian, Ye Jianying and Zhu De urge the army''s stability. It names Xu head of the All-Army Cultural Revolution Group, Jiang Qing adviser, Xiao Hua and Yang Chengwu among deputies; it passes the message to Shanghai and the Center''s notice against economism (a handful on the capitalist road are inciting wage and welfare demands to turn the struggle aside) and three more papers.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 11, 1967. Made public: 2013. Names: Zhou Enlai, Mao Zedong, He Long, Xu Xiangqian, Ye Jianying, Zhu De, Jiang Qing.'
      tags: [name:zhou-enlai, name:mao-zedong, name:he-long, name:xu-xiangqian, name:ye-jianying, name:zhu-de, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-11.china-leadership-3
      when: Jan. 11
      date: '1967-01-11'
      thread: china-leadership
      c: 'The Military Commission reorganizes the All-Army Cultural Revolution Group, to work under the Commission and the Center Cultural Revolution Group: head Xu Xiangqian; adviser Jiang Qing; deputies Xiao Hua, Yang Chengwu, Wang Xinting, Xu Liqing, Guan Feng, Xie Tangzhong, Li Manchun.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 11, 1967. Made public: 2013. Names: Xu Xiangqian, Jiang Qing, Xiao Hua, Yang Chengwu, Wang Xinting, Xu Liqing, Guan Feng, Xie Tangzhong, Li Manchun.'
      tags: [name:xu-xiangqian, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-12.china-leadership
      when: Jan. 12
      date: '1967-01-12'
      thread: china-leadership
      c: 'Mao reads three drafts of the Cultural Revolution Group: a Center notice that the point of struggle is not to be turned on the army; a Center and State Council set of rules on public-security work in the Cultural Revolution; a Military Commission notice that the army may not be an air-raid shelter. "Agreed. To Zhou: important, so the Politburo should pass them." The first says that no person or body may storm the PLA''s organs; the second gives six rules, among them lawful punishment of counter-revolutionaries.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 12, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-13.china-leadership
      when: Jan. 13
      date: '1967-01-13'
      thread: china-leadership
      c: 'Mao has Liu Shaoqi brought to the Great Hall and tells him to study and look after his health. Liu: the error of line is mine, the main responsibility mine; asks to resign as head of state, as a Politburo standing member and as head of the editorial committee of Mao''s works, and to go with his wife and children to Yan''an or his old home to farm.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 13, 1967. Made public: 2013. Names: Mao Zedong, Liu Shaoqi.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-14.china-leadership
      when: Jan. 14
      date: '1967-01-14'
      thread: china-leadership
      c: 'Mao reads Chen Boda''s *Hongqi* commentator''s article "Proletarian Revolutionaries, Unite!" (Wang Li, Guan Feng): "very well written," quoting his bold-typed words: to take power from the handful of Party people on the capitalist road is, under proletarian dictatorship, one class overthrowing another. Printed in *Hongqi* no. 2 (Jan. 16) and the *Renmin ribao*.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 14, 1967. Made public: Jan. 16, 1967 (*Hongqi*, no. 2; *Renmin ribao*). Names: Mao Zedong, Chen Boda, Wang Li, Guan Feng.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-16.china-leadership
      when: Jan. 16
      date: '1967-01-16'
      thread: china-leadership
      c: 'Mao presides over an enlarged Standing Committee meeting. Some of our cadres have changed in a dozen years. The left''s seizures of power are good, the right''s not. The left grows quickly: Shanghai''s left workers were a thousand and more in early Nov., a million by early Jan.; let the masses choose new cadres, factory heads and secretaries. Takeover means looking after politics and watching, not business; the army takes radio stations only where the left is not in strength. Not the army alone wins the land now; workers and peasants do, the army helps.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 16, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-17.china-leadership
      when: Jan. 17
      date: '1967-01-17'
      thread: china-leadership
      c: 'Great Hall, room 118. Mao receives the delegation of a foreign Communist party. There is a party within our party, harmony on the surface, fierce struggle beneath; he doubted some of those "serving the people"; without the Cultural Revolution nothing could be done. Shanghai''s workers took over factories, offices and schools; Lenin: train cadres in the revolution. Left and right both use his banner as "defenders." Of titles, "great commander, helmsman, teacher, leader," "I want none." On choosing Central Committee members for the Ninth Congress: Liu and Deng, he thinks, should be elected.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 17, 1967. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping. Check: the party and its delegation; the nianpu does not name them.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, polity:prc]
- add:
    entry:
      id: cal.1967-01-17.china-leadership-2
      when: Jan. 17
      date: '1967-01-17'
      thread: china-leadership
      c: 'Mao approves Lin Biao''s reply of that day to the *Jiefangjun bao*: "agreed, a good reply." On Jan. 13 Xiao Li and seven others posted "Where Is the *Jiefangjun bao* Going?" and seized the paper; Lin wrote them "your acts are excellent; I back you firmly."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 17, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Xiao Li.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-19.china-leadership
      when: Jan. 19
      date: '1967-01-19'
      thread: china-leadership
      c: 'Zhou Enlai and Li Fuchun talk with He Long; Zhou: Chairman Mao protects you, and I protect you.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 19, 1967. Made public: 2013. Names: Zhou Enlai, Li Fuchun, He Long, Mao Zedong.'
      tags: [name:zhou-enlai, name:li-fuchun, name:he-long, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-19.china-leadership-2
      when: Jan. 19
      date: '1967-01-19'
      thread: china-leadership
      c: 'The Center, State Council and Military Commission order, on reports that bad men incite raids on storehouses: troops to be sent at once to every important grain and goods store, prison and other protected unit, under military control.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 19, 1967. Made public: 2013.'
      tags: [polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-21.china-leadership
      when: Jan. 21
      date: '1967-01-21'
      thread: china-leadership
      c: 'Mao reads the Nanjing Military Region committee''s telegram to the Military Commission on the Peking Third Headquarters'' Anhui liaison station and others calling a mass meeting in Hefei and asking the Anhui military district for troops to guard it: "To Lin Biao: the army should back the left masses. Whenever a true revolutionary body asks the army''s support or help, do so. ''Not intervening'' is false; it already has. The order should be issued afresh and the earlier orders rescinded."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 21, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-21.china-leadership-2
      when: Jan. 21
      date: '1967-01-21'
      thread: china-leadership
      c: 'Afternoon. Mao presides over an enlarged Standing Committee meeting on the army''s support of the revolutionary left and tells Wang Li to draft an instruction at once.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 21, 1967. Made public: 2013. Names: Mao Zedong, Wang Li.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-21.china-leadership-3
      when: Jan. 21
      date: '1967-01-21'
      thread: china-leadership
      c: 'Mao reads the Yanbian prefecture committee''s telegram of Jan. 19 to the Center Cultural Revolution Group (two rebel bodies fight over the *Yanbian ribao*, casualties): "To the Premier: the power in Yanbian held by the counter-revolutionaries should be taken; please arrange it. Mao Yuanxin went to Yanbian a month and it is much better; he leaves for Harbin today; if he has not gone, talk to him."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 21, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Mao Yuanxin.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-21.china-leadership-4
      when: Jan. 21
      date: '1967-01-21'
      thread: china-leadership
      c: 'Mao reads Li Zaihan''s telegram of Jan. 20 to the General Political Department and the Group (Guizhou: the rebel "Red Guard Army''s" leaders turn on the army, seize sentries and arms, hold cadres): "To the Premier: bring to Peking Li, the military district commander, a few provincial committee members who are true revolutionaries and some reliable rebel leaders, a dozen or so, study them, fix a policy, and send them back to carry it out. Each province and city might do so, one by one." Zhou talks with Li Zaihan on the 25th.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 21, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Zaihan.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-22.china-leadership
      when: Jan. 22
      date: '1967-01-22'
      thread: china-leadership
      c: 'Noon, Great Hall. Mao receives the senior generals at the enlarged meeting of the Military Commission''s liaison group: back the rebels, though few; declare yourselves. The "not intervening" line was false. Do the right masses'' work, save many cadres. He disapproves the "jet plane" treatment, hours of denunciation, of Liao Hansheng, Liu Zhijian and Su Zhenhua; do not go too far; no forced confessions; random arrests, of provincial secretaries and army cadres, will not do; everyone errs, "I too." Zhang Tixue and Jiang Weiqing, after errors, should be given time to mend.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 22, 1967. Made public: 2013. Names: Mao Zedong, Liao Hansheng, Liu Zhijian, Su Zhenhua, Zhang Tixue, Jiang Weiqing.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-22.china-leadership-2
      when: Jan. 22
      date: '1967-01-22'
      thread: china-leadership
      c: 'The *Renmin ribao*, Mao having read it, prints the editorial "Revolutionary Proletarian Great Alliance; Seize the Power of the Capitalist-Roaders."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 22, 1967. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1967-01-23.china-leadership
      when: Jan. 23
      date: '1967-01-23'
      thread: china-leadership
      c: 'Mao reads the draft decision of the Center, State Council, Military Commission and Cultural Revolution Group that the PLA firmly supports the revolutionary left (Wang Li''s), sent by Zhou Enlai and others: "issue." It says the PLA must stand on the proletarian revolutionaries'' side; the earlier instructions not to intervene are void. Issued that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 23, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Wang Li.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-26.china-leadership
      when: Jan. 26
      date: '1967-01-26'
      thread: china-leadership
      c: 'Mao reads Lin Biao''s draft "Military Commission Order" of Jan. 25. Lin''s note: Xu Xiangqian said yesterday afternoon that many senior army cadres are seized at will, their homes searched, punished in disguise, offices half or wholly paralyzed; Nie Rongzhen, Ye Jianying and Yang Chengwu came after; they agreed in the Group''s meeting with Zhou and Chen Yi on seven articles. Mao: "The seven are very good; issue; add one on managing cadres'' children."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 26, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Yang Chengwu, Zhou Enlai, Chen Yi.'
      tags: [name:mao-zedong, name:lin-biao, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, name:zhou-enlai, name:chen-yi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-27.china-leadership
      when: Jan. 27
      date: '1967-01-27'
      thread: china-leadership
      c: 'Mao reads Zhang Boseng''s report of Jan. 25 to Zhou Enlai and Chen Boda on Hunan: the provincial committee is paralyzed; many want officials dismissed and expelled from the Party, and ask leave to come to Peking. Mao: "To the Premier: treat Hunan as Guizhou. Zhang Boseng was the only provincial secretary who held his post, did not flee, at the start of the movement last year. See him, and ask others, cadres and rebel leaders, to come and talk it over."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 27, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Zhang Boseng, Chen Boda.'
      tags: [name:mao-zedong, name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-28.china-leadership
      when: Jan. 28
      date: '1967-01-28'
      thread: china-leadership
      c: 'Mao, at the pool, calls Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying and others to revise the draft Military Commission Order. He then reads the revised text: "eight articles, very good, issue." He rewrites article five: for "the right''s storming to be resisted, the left''s to be welcomed" put "from now no storming at all." The eight: back the true proletarian left, hit the right, dictatorship over proven counter-revolutionaries; all stay at their posts; only argument inside the army, no arrest, search or seal without orders; and others.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 28, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
      tags: [name:mao-zedong, name:zhou-enlai, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-30.china-leadership
      when: Jan. 30
      date: '1967-01-30'
      thread: china-leadership
      c: 'Mao reads Tan Zhenlin''s report of Jan. 28 on the Ministries of State Farms, Agriculture and Aquatic Products: "To Lin Biao and Zhou Enlai: worth reading. In Party, government, army, mass bodies, schools, factories, villages, trade a few counter-revolutionaries, rightists and degenerates have crept in; this time most jumped out, a great good. The revolutionary masses must find out and overthrow them, then deal with them by weight. Tan''s views are right. Zhou to print it for many to read, to be on guard."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 30, 1967. Made public: 2013. Names: Mao Zedong, Tan Zhenlin, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:tan-zhenlin, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-30.china-leadership-2
      when: Jan. 30
      date: '1967-01-30'
      thread: china-leadership
      c: 'Mao reads Chen Boda''s *Hongqi* editorial draft "On the Proletarian Revolutionaries'' Struggle to Seize Power," sends it to Lin Biao: "I read it, think it very good, made some changes." He adds "exclude all, overthrow all" to the line on opposing everything without distinction, and rewrites two paragraphs: erring cadres not all to be brought down; those not anti-Party, anti-socialist and who persist after repeated teaching are to be allowed to mend and make amends.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 30, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Lin Biao.'
      tags: [name:mao-zedong, name:chen-boda, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-31.china-leadership
      when: Jan. 31
      date: '1967-01-31'
      thread: china-leadership
      c: 'Mao reads the notice of Guizhou''s revolutionary rebels'' headquarters in the *New Guizhou Daily* of Jan. 26: the headquarters took over on Jan. 25 the powers of the provincial and Guiyang committees and councils. "To the Premier: a very good notice; publish it? The paper of ten articles drawn up lately, once revised after their return, may follow as a second." The *Renmin ribao* reprints it Feb. 1 with an editorial "Spring Thunder in the Southwest."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 31, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-01-31.china-leadership-2
      when: Jan. 31
      date: '1967-01-31'
      thread: china-leadership
      c: 'Mao reads the Center, State Council and Military Commission telegram to the Xinjiang committee, the Xinjiang Military Region, the Production and Construction Corps and the "Xinjiang Revolutionary Seizure Headquarters": "issue." Stop all armed clashes among the people at once; the armed forces not to fire where there are crowds; no one may storm or seize power at the Military Region''s headquarters or the Corps; the armed conflict in the Shihezi area to await the Center''s investigators.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 31, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-01.china-leadership
      when: Feb. 1
      date: '1967-02-01'
      thread: china-leadership
      c: 'Mao to Zhou Enlai: putting tall hats and painted faces on those in power on the capitalist road and parading them is a form of violence and does not teach. Only argument and reason can persuade. "Please tell the revolutionary teachers, students and masses."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 1, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-02.china-leadership
      when: Feb. 2
      date: '1967-02-02'
      thread: china-leadership
      c: 'Mao reads a letter of Jan. 29 from Wang Renzhong''s wife, Xiao Huina: he is dying, seized and held, no one knows where; she asks for treatment. Mao: "To Lin and Zhou: pass to the Group. Persuade the Red Guards to let him see a doctor; they may call him as needed if his illness allows." On Feb. 3 the Center telegraphs the Hubei committee and Wuhan Military Region to that effect.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 2, 1967. Made public: 2013. Names: Mao Zedong, Wang Renzhong, Xiao Huina, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-03.china-leadership
      when: Feb. 3
      date: '1967-02-03'
      thread: china-leadership
      c: 'Great Hall, room 118. Mao receives Hysni Kapo and Beqir Balluku of the Albanian Party of Labor, Zhou Enlai, Kang Sheng, Ye Jianying, Yang Chengwu, Xiao Hua and Wang Shusheng present. In the Party the struggle has not been public: at the Seven Thousand Cadres Conference he said revisionism would overthrow us; in five years only single cases and single men were taken up; no form had been found to expose our dark side openly, from below. The attack on Wu Han began in Peking''s absence, a team in Shanghai under Yao Wenyuan; he read the article first alone.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 3, 1967. Made public: 2013. Names: Mao Zedong, Hysni Kapo, Beqir Balluku, Zhou Enlai, Kang Sheng, Ye Jianying, Yang Chengwu, Xiao Hua, Wang Shusheng, Wu Han, Yao Wenyuan. Check: the names Kapo and Balluku are a reading of the nianpu''s 卡博 and 巴卢库.'
      tags: [name:mao-zedong, name:zhou-enlai, name:kang-sheng, name:ye-jianying, name:yao-wenyuan, polity:prc]
- add:
    entry:
      id: cal.1967-02-06.china-leadership
      when: Feb. 6
      date: '1967-02-06'
      thread: china-leadership
      c: 'Mao calls Zhou Enlai, Chen Boda, Ye Jianying, Jiang Qing and others on seizing power. A city''s seizure needs the three-in-one: delegates of the masses, the army and the revolutionary cadres; without it no recognition. The army does not seize power; whoever seizes should be arrested. To Chen Boda and Jiang Qing: this "business of yours" must take criticism; you lack political, worker-peasant and army experience; Tao Zhu was settled in two or three hours without me, Lin Biao or the Premier, reported afterward; Boda does not consult; "you will fall sooner or later." He orders the Shanghai "People''s Commune" kept out of the press: "all provinces called commune, the nation would be ''the Chinese People''s Commune,'' no Center, no State Council."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 6, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Ye Jianying, Jiang Qing, Tao Zhu, Lin Biao.'
      tags: [name:mao-zedong, name:zhou-enlai, name:chen-boda, name:ye-jianying, name:jiang-qing, name:tao-zhu, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-06.china-leadership-2
      when: Feb. 6
      date: '1967-02-06'
      thread: china-leadership
      c: 'Mao approves the Center and State Council notice on revolutionary students and Red Guards'' marches on foot: long-distance marches stop everywhere; those out return, on foot in principle; meals and local fares to be paid by themselves; from Feb. 8 students and Red Guards at Peking no longer fed and housed free.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 6, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-07.china-leadership
      when: Feb. 7
      date: '1967-02-07'
      thread: china-leadership
      c: 'Mao reads the Tibet Military Region committee''s telegram of Feb. 6: Tibetan rebels want Zhang Guohua brought down and call the Region''s committee "royalist"; they ask the Center to state a view soon. "To Lin, Zhou, Ye, Nie, Xu: study whether Zhang Guohua, Zhou Renshan, Wang Qimei and others are good men or bad; telegraph me in a day or two; issue a statement. Some matters are settled too slowly. Xinjiang should be settled quickly. Some great matters are settled too fast, not at leisure in the Standing Committee." On Feb. 12 the Military Commission replies: Zhang is on Mao''s line.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 7, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Ye Jianying, Nie Rongzhen, Xu Xiangqian, Zhang Guohua, Zhou Renshan, Wang Qimei.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:ye-jianying, name:nie-rongzhen, name:xu-xiangqian, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-07.china-leadership-2
      when: Feb. 7
      date: '1967-02-07'
      thread: china-leadership
      c: 'Mao approves the Center''s telegram to the embassies and consulates: staff to form no fighting bodies; those formed to become Cultural Revolution study groups under the embassy Party committee, none to meddle with its authority.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 7, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-08.china-leadership
      when: Feb. 8
      date: '1967-02-08'
      thread: china-leadership
      c: 'Evening. Mao reads Zhou Enlai''s letter: the Center liaison meeting of Feb. 7 proposes to bring Jiang Hua, Cao Xiangren, Ye Fei, Tan Qilong, Jiang Weiqing and Liu Junxiu to Peking, to rest and be protected, and to put Peking and Tianjin under military control. Mao: "seen; returned to Zhou to keep."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 8, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Jiang Hua, Cao Xiangren, Ye Fei, Tan Qilong, Jiang Weiqing, Liu Junxiu.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-09.china-leadership
      when: Feb. 9
      date: '1967-02-09'
      thread: china-leadership
      c: 'Mao twice reads and revises the Military Commission''s draft rule that the army, supporting the proletarian left''s seizures of power, is not to fire at will. Morning: "some changes; many supports now go to the right, not the left, and we are on the defensive; write several instructions from the experience; quickly." Afternoon, to Lin Biao: changed more; to be passed at the party-government-army meeting under Zhou first. He adds article five (even a counter-revolutionary body''s masses are mostly good; bad men few) and article six (stand firm; though tens of thousands demonstrate, surround, beat, seize, insult, no matter; fear is the great error).'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 9, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-10.china-leadership
      when: Feb. 10
      date: '1967-02-10'
      thread: china-leadership
      c: 'Mao presides over an enlarged Standing Committee meeting: Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Li Fuchun, Ye Jianying, Jiang Qing and Wang Li. He tells the Cultural Revolution Group to meet and criticizes Chen Boda and Jiang Qing for publicly naming and bringing down Tao Zhu: "a standing member bringing down a standing member," "high in the eye, low in the hand, great in will, small in talent"; they did it alone; "I think it as before: no report, a blockade of me, the Premier excepted." He proposes to widen the meeting: Chen Yi, Tan Zhenlin, Xu Xiangqian, Li Xiannian, Xie Fuzhi, Guan Feng, Qi Benyu.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 10, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Li Fuchun, Ye Jianying, Jiang Qing, Wang Li, Tao Zhu, Chen Yi, Tan Zhenlin, Xu Xiangqian, Li Xiannian, Xie Fuzhi, Guan Feng, Qi Benyu.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:li-fuchun, name:ye-jianying, name:jiang-qing, name:tao-zhu, name:chen-yi, name:tan-zhenlin, name:xu-xiangqian, name:li-xiannian, name:xie-fuzhi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-11.china-leadership
      when: Feb. 11
      date: '1967-02-11'
      thread: china-leadership
      c: 'Mao twice reads the Military Commission''s draft rules on the Cultural Revolution in organs above army level, drafted at his proposal: Lin Biao''s of Feb. 10, "do it; follow the changes made at last night''s meeting"; Zhou''s of the night of the 10th, "to the Premier, issue." Seven articles: study and carry out the eight-article order of Jan. 28; the "four bigs" by stages; none for army units below, naval bases, the Peking garrison and special units; no link-ups with them.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 11, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-12.china-leadership
      when: Feb. 12
      date: '1967-02-12'
      thread: china-leadership
      c: 'Mao to Zhang Chunqiao, Wang Li, Yao Wenyuan and Qi Benyu: since the Group''s founding it has never once asked him to preside; since June it stood in for the Secretariat, another "independent kingdom"; it dismisses the Standing Committee. Cultural revolution one or two years, then a halt. Now "bring down all" is in the air; to bring down all cadres is anarchism; the doubt of everything is anarchism; to "perfect the proletarian dictatorship" is wrong. On the Shanghai "People''s Commune" kept from the press: as the Peking one too; calling all "communes" would mean a change of national name and form; Paris, had it won, might have turned bourgeois; the Soviets turned.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 12, 1967. Made public: 2013. Names: Mao Zedong, Zhang Chunqiao, Wang Li, Yao Wenyuan, Qi Benyu.'
      tags: [name:mao-zedong, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-14.china-leadership
      when: Feb. 14
      date: '1967-02-14'
      thread: china-leadership
      c: 'Mao reads Wang Mingkun''s telephone report (Group''s *Yaoshi huibao* no. 8, Feb. 12) on the Xi''an clashes: yesterday we wired Lin Biao and the Group a view that favored Xi''an Jiaotong; now it looks wrong, we stand with the Xi''an PLA Telecommunications Engineering College and the Northwest Industrial University, and shut Jiaotong out. Mao: "To Lin and Zhou: shutting out Jiaotong and backing the ultra-left needs study; keep investigating; no hurry to say so in public. The ultra-left are suspect of wrecking factories; Jiaotong does not favor it. Tell the Group."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 14, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Wang Mingkun.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-15.china-leadership
      when: Feb. 15
      date: '1967-02-15'
      thread: china-leadership
      c: 'Evening, Great Hall. Mao receives the Mauritanian government delegation under Foreign and Planning Minister Wani (so in the nianpu), Zhou Enlai, Chen Yi and others present. We have little experience since liberation; they may have much to teach; an exchange; the poor lands of the north depend on rain; Shachiyu is the way, without machines.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 15, 1967. To check: Xinhua''s report. Names: Mao Zedong, Zhou Enlai, Chen Yi. Check: the minister''s name in French (the nianpu''s 瓦尼).'
      tags: [name:mao-zedong, name:zhou-enlai, name:chen-yi, polity:prc]
- add:
    entry:
      id: cal.1967-02-16.china-leadership
      when: Feb. 16
      date: '1967-02-16'
      thread: china-leadership
      c: 'Peking, Huairen Hall, afternoon. At the Center''s liaison meeting, Zhou Enlai chairing, on "grasping revolution, promoting production," Tan Zhenlin, Chen Yi, Ye Jianying, Xu Xiangqian, Li Xiannian, Yu Qiuli and others attack the present way of the Cultural Revolution. Tan, asked why Chen Pixian may not come to Peking: Zhang Chunqiao says they will ask the masses; Tan: the masses, always the masses; where is the Party''s leadership? "You mean to break the old cadres one by one; this is the cruelest struggle in the Party''s history." He rises to leave; Zhou calls him back; Chen Yi: do not go; fight them; those who rise are revisionists. This is later called the "February Countercurrent."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 16, 1967. Made public: 2013. Names: Zhou Enlai, Tan Zhenlin, Chen Yi, Ye Jianying, Xu Xiangqian, Li Xiannian, Yu Qiuli, Chen Pixian, Zhang Chunqiao.'
      tags: [name:zhou-enlai, name:tan-zhenlin, name:chen-yi, name:ye-jianying, name:xu-xiangqian, name:li-xiannian, name:zhang-chunqiao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-16.china-leadership-2
      when: Feb. 16
      date: '1967-02-16'
      thread: china-leadership
      c: 'Mao approves Lin Biao''s Military Commission rule on the limits of army seizure of power: "seen, agreed." The army may seize only in academies and schools (not secret-staff, advanced-technology, flying schools or classes for foreign trainees), art troupes, sports teams, hospitals (only the General Hospital and military region and service general and teaching hospitals), military plants (not those on advanced tests, naval bases'' plants or secret plants); only by that unit''s real proletarian left, with no outside body; no seizure of guard, signals, drill, service and transport units.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 16, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-18.china-leadership
      when: Feb. 18
      date: '1967-02-18'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s draft *Hongqi* editorial "Cadres Must Be Treated Rightly." Zhou: it should be discussed at the party-government-army-culture liaison meeting, and the passage on the revolutionary cadres joining the masses should explain the three-in-one in the localities and inside organs. Mao: agreed; discuss, write in the three-in-one; hereafter all important editorials the same. He strikes the last three slogans (long live the Cultural Revolution; long live Mao''s line; long live the great teacher, leader, commander, helmsman). On Feb. 22 he reads the revised text: "issue."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 18, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-19.china-leadership
      when: Feb. 19
      date: '1967-02-19'
      thread: china-leadership
      c: 'Morning. Mao presides over a Politburo meeting, Zhou Enlai, Li Fuchun, Ye Jianying, Li Xiannian, Kang Sheng, Xie Fuzhi and Ye Qun (for Lin Biao) present. He severely criticizes the speeches of Tan Zhenlin, Chen Yi and Xu Xiangqian of Feb. 16. The meeting makes Tan, Chen and Xu "ask leave and examine themselves." From Feb. 25 to Mar. 18, at Mao''s view, seven "Politburo life meetings" at Huairen Hall criticize them and Li Fuchun, Li Xiannian, Ye Jianying and Nie Rongzhen; Jiang Qing and others call it a "bourgeois restoration countercurrent." The Politburo then stops meeting; the Center Cultural Revolution Group''s liaison meetings replace Zhou''s Standing Committee liaison meeting.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Fuchun, Ye Jianying, Li Xiannian, Kang Sheng, Xie Fuzhi, Ye Qun, Lin Biao, Tan Zhenlin, Chen Yi, Xu Xiangqian, Nie Rongzhen, Jiang Qing.'
      tags: [name:mao-zedong, name:zhou-enlai, name:li-fuchun, name:ye-jianying, name:li-xiannian, name:kang-sheng, name:xie-fuzhi, name:ye-qun, name:lin-biao, name:tan-zhenlin, name:chen-yi, name:xu-xiangqian, name:nie-rongzhen, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-19.china-leadership-2
      when: Feb. 19
      date: '1967-02-19'
      thread: china-leadership
      c: 'Mao reads Tan Zhenlin''s letter of Feb. 17 to Lin Biao, which Lin sends on (Tan: Jiang Qing and the others enjoy knocking down old cadres, the Group will not do as successors; "I have decided to rebel; I am ready to die, but not by my own hand nor to betray the country"). Lin''s note: Tan''s thought has sunk to this, past all hope. Mao: "Seen. To Zhou; return to Lin."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. Made public: 2013. Names: Mao Zedong, Tan Zhenlin, Lin Biao, Jiang Qing, Zhou Enlai.'
      tags: [name:mao-zedong, name:tan-zhenlin, name:lin-biao, name:jiang-qing, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-19.china-leadership-3
      when: Feb. 19
      date: '1967-02-19'
      thread: china-leadership
      c: 'Lin Biao sends Mao the Peking garrison''s two reports on the military training trials at Peking University, Tsinghua and three other colleges and two middle schools, and asks whether they may go to the whole country. Mao: "(1) Both to be sent out at once. (2) Colleges, middle schools and upper primary classes to train once a year, twenty days; during it four hours a day, school hours cut four hours. (3) Party, government, army, mass organs, except the old, middle-aged and young to train twenty days a year." On Mar. 23, on Chen Boda''s and Wang Li''s request to print them: not to be published.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Chen Boda, Wang Li.'
      tags: [name:mao-zedong, name:lin-biao, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-19.china-leadership-4
      when: Feb. 19
      date: '1967-02-19'
      thread: china-leadership
      c: 'Mao reads the draft items on Guizhou''s "revolutionary committee": "name ''revolutionary committee'' is right; change all four papers to it; two days'' printing, three in the first, one in the second." The papers of Feb. 22 and 23 print "the Guizhou Revolutionary Committee," not "the Mao Zedong Thought Guizhou Revolutionary Committee."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Wang Li.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-19.china-leadership-5
      when: Feb. 19
      date: '1967-02-19'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s draft of the Center''s letter to the poor and lower-middle peasants and cadres of the communes: rouse all for spring plowing at once; hold a three-level cadre meeting and a team members'' meeting. "Lin Biao to read and return to Wang Dongxing to issue." Sent Feb. 22.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao, Wang Dongxing.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-21.china-leadership
      when: Feb. 21
      date: '1967-02-21'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s draft Center telegram to Zhang Chunqiao and Yao Wenyuan: agreed to the change of name of the Shanghai People''s Commune to the Shanghai Municipal Revolutionary Committee. Renamed Feb. 24.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 21, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Zhang Chunqiao, Yao Wenyuan.'
      tags: [name:mao-zedong, name:zhou-enlai, name:zhang-chunqiao, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-24.china-leadership
      when: Feb. 24
      date: '1967-02-24'
      thread: china-leadership
      c: 'Mao reads the Guangzhou Military Region''s report of Feb. 23 on the seizure struggle at Guangzhou: "To the Premier: tell the Region to find out the political attitude of Zhao Ziyang and Ou Mengjue, and of the other provincial secretaries and standing members; perhaps bring Zhao and Ou to Peking, with Chen Yu and Huang Yongsheng, for a talk to enlighten them."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 24, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Zhao Ziyang, Ou Mengjue, Chen Yu, Huang Yongsheng.'
      tags: [name:mao-zedong, name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-02-28.china-leadership
      when: Feb. 28
      date: '1967-02-28'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s report of the night of Feb. 27 on Guangdong: the Center''s liaison meeting resolves that Guangdong be put under military control at once and prepare a three-in-one revolutionary committee; Huang Yongsheng head, Chen De deputy, to run the province and help the provincial committee''s self-criticism. Yunnan, much the same, to be put under control first. "Agreed."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 28, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Huang Yongsheng, Chen De.'
      tags: [name:mao-zedong, name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03.china-leadership
      when: Mar.
      date: '1967-03'
      thread: china-leadership
      c: 'Mao agrees to Zhou Enlai''s proposal to put the Center''s Investigation Department under military control.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 1967 (the entry "3月"; no day). Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-03.china-leadership
      when: Mar. 3
      date: '1967-03-03'
      thread: china-leadership
      c: 'Mao reads the Shenyang Military Region''s report of Mar. 2 on sending staff as Mao Zedong Thought propaganda teams to factories and colleges to explain Party policy: "To Lin and Zhou: print for the army-level conference. The army should help the locality in farming and in industry too; the Shenyang way of sending many into factories to propagate and investigate is good. The 27th Army at Wuxi, the 54th at Chongqing, the 23rd at Yichun and Weihe also have good experience. The army cannot look on while industrial output falls."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 3, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-07.china-leadership
      when: Mar. 7
      date: '1967-03-07'
      thread: china-leadership
      c: 'Mao revises Wang Li''s and Guan Feng''s draft *Hongqi* editorial "On the Revolutionary ''Three-in-One''" ("to Lin Biao; after reading return to the Group"). He adds a paragraph: wherever power is to be seized, units must have army or militia: county level and up send army delegates, commune level and down militia delegates; if the army lacks them, leave a vacancy. The article has his bold-typed line: the new provisional organ of power should be called a revolutionary committee. *Hongqi* no. 5, Mar. 30; the *Renmin ribao* reprints it Mar. 10.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 7, 1967. Made public: Mar. 10, 1967 (*Renmin ribao*, ahead of *Hongqi* no. 5). Names: Mao Zedong, Wang Li, Guan Feng, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-07.china-leadership-2
      when: Mar. 7
      date: '1967-03-07'
      thread: china-leadership
      c: 'Mao reads the Tianjin garrison commander''s report of Mar. 6 on how military training united the whole of Yan''an Middle School at Tianjin: "To Lin, Zhou and the Group: send it to the whole country; army training of colleges and middle schools and upper primary, in stages, joining the opening of school, the reorganizing of bodies, the three-in-one leadership and fight-criticize-reform; first trials, then spread; those who erred, teachers and cadres, not shut out of the training."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 7, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Zheng Sansheng.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-07.china-leadership-3
      when: Mar. 7
      date: '1967-03-07'
      thread: china-leadership
      c: 'The Center issues the draft "Rules for the Cultural Revolution in Colleges": those outside back by Mar. 20; short military-political training; criticize and struggle with those on the capitalist road and reactionary authorities; study ways to reform the old school system; a provisional power body of revolutionary teachers, students, staff and revolutionary cadres.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 7, 1967. Made public: 2013.'
      tags: [polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-09.china-leadership
      when: Mar. 9
      date: '1967-03-09'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s forward of the Mar. 5 request of Xie Fuzhi and others on preparing the Peking seizure of power: "To the Premier: the workers'' congress is not yet held, the middle schools'' and peasants'' not heard of. A citywide congress and committee election seem best for the end of March; settle it with Xie Fuzhi." After the poor-peasant, workers'' and middle-school congresses Peking''s revolutionary committee is formed Apr. 20: Xie Fuzhi head; Wu De, Zheng Weishan, Fu Chongbi and Nie Yuanzi deputies.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 9, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Xie Fuzhi, Wu De, Zheng Weishan, Fu Chongbi, Nie Yuanzi.'
      tags: [name:mao-zedong, name:zhou-enlai, name:xie-fuzhi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-10.china-leadership
      when: Mar. 10
      date: '1967-03-10'
      thread: china-leadership
      c: 'Mao on Zhou Enlai''s report of Mar. 10 on carrying out his Mar. 9 instruction on the way to form revolutionary committees: "other provinces and cities likewise; where conditions are not ripe, wait until ripe, then hold it; where anarchy rules, put it first under military control."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 10, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-10.china-leadership-2
      when: Mar. 10
      date: '1967-03-10'
      thread: china-leadership
      c: 'Mao replies to Zhang Shizhao: "Your letter received. For the whole, our hearts are one. One person''s circumstance is complex and cannot yet be settled; your plan had best be put off." Zhang had written that since 1949 the state''s rise owes all to the Party, that Mao and Liu''s unity guarantees its core; if Liu erred, let the two talk frankly, Liu self-criticize, but Liu must not be brought down.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 10, 1967. Made public: 2013. Names: Mao Zedong, Zhang Shizhao, Liu Shaoqi.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-12.china-leadership
      when: Mar. 12
      date: '1967-03-12'
      thread: china-leadership
      c: 'Mao to Zhou Enlai and others, on when the Cultural Revolution''s second stage (the three-in-one) will end: "perhaps by February to May; by May the three-in-one revolutionary committees may be ripe, at provincial level at least nearly; then the outline will show."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 12, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the nianpu''s "二、三、四、五月" is read as the months Feb.–May (it adds "到了五月份"); the wording of his sentence, Check.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-14.china-leadership
      when: Mar. 14
      date: '1967-03-14'
      thread: china-leadership
      c: 'Great Hall. Mao receives Makosso, Minister of Justice and Labor of the Congo (Brazzaville), and his wife. In the Cultural Revolution, eight or nine months in, the people criticize us; we need some democracy to wash the dirt off.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 14, 1967. To check: Xinhua''s report. Names: Mao Zedong, Makosso.'
      tags: [name:mao-zedong, polity:prc, polity:congo]
- add:
    entry:
      id: cal.1967-03-16.china-leadership
      when: Mar. 16
      date: '1967-03-16'
      thread: china-leadership
      c: 'Mao to Lin Biao, Chen Boda, Wang Li: the *Selected Works* reprinted or translated will lose no names: "not one removed. Peng Dehuai''s name used to be printed above; nothing wrong. These are history; without the Simas there would be no Jin history." Notes need much time; print the old edition. Vols. 5 and 6 a year hence. Military control is not the 1949 kind that ran everything; factory cadres are 90 percent good; the bad few. A notice: seizures must be agreed with the Center first; big factories'' workers are most and most important; no hurry.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 16, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Chen Boda, Wang Li, Peng Dehuai.'
      tags: [name:mao-zedong, name:lin-biao, name:chen-boda, name:peng-dehuai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-16.china-leadership-2
      when: Mar. 16
      date: '1967-03-16'
      thread: china-leadership
      c: 'The Center sends out its comment on the materials of the "surrender and treason" of Bo Yibo, Liu Lantao, An Ziwen, Yang Xianzhen and others, calling their 1936 release, approved by the Center, "surrender and treason" and making it a main count against Liu Shaoqi.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 16, 1967. Made public: 2013. Names: Bo Yibo, Liu Lantao, An Ziwen, Yang Xianzhen, Liu Shaoqi.'
      tags: [name:bo-yibo, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-17.china-leadership
      when: Mar. 17
      date: '1967-03-17'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s report, Fuzhou Military Region on setting up Fujian''s revolutionary committee and the seizure. Zhou proposes the province go through military control to prepare the three-in-one; if the sides think it ripe, send delegates; if the founding meeting of the 18th cannot be cancelled, make it a preparatory meeting. Mao: "Do it." Han Xianchu phones: the meeting is put off, delegates arrive tomorrow.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 17, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Han Xianchu.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-18.china-leadership
      when: Mar. 18
      date: '1967-03-18'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s draft of the Center''s letter to the workers and cadres of factories and mines (Mar. 16): keep a good order of socialist production and of the Cultural Revolution; the eight-hour day, with the Revolution outside it; no leaving posts in work hours; the quality of goods; economy; no damage to state property. Sent Mar. 19.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 18, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-19.china-leadership
      when: Mar. 19
      date: '1967-03-19'
      thread: china-leadership
      c: 'Mao reads a paper on "grave disorder on the Qiqihar railway bureau": "To Lin and Zhou: every railway bureau in disorder should be put under military control and quickly put in order; those in good order should also have army delegates, to draw their good experience. Also motor transport, shipping and port loading; to manage only industry and not transport is wrong."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 19, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-19.china-leadership-2
      when: Mar. 19
      date: '1967-03-19'
      thread: china-leadership
      c: 'The Center, Mao having read it, issues the notice on stopping the national great link-up: the plan for a link-up after the spring thaw is cancelled. The Military Commission decides to put its forces on the five tasks (supporting the left, farm, industry, military control, military training).'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 19, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-20.china-leadership
      when: Mar. 20
      date: '1967-03-20'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s report of Mar. 18 putting the defense industry''s ministries'' institutes, and the Academy of Sciences'' defense institutes, under military control, to the National Defense Science and Technology Commission, as Nie Rongzhen proposed; the State Council''s industrial, trade, farm and health ministries are to be ranked and where paralyzed also put under control. "Agreed; return to the Premier." The same day Lin Biao tells an army conference the Revolution''s loss is least, its gain greatest, and to "raise a gale of ten, eleven, twelve."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 20, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Nie Rongzhen, Lin Biao.'
      tags: [name:mao-zedong, name:zhou-enlai, name:nie-rongzhen, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-21.china-leadership
      when: Mar. 21
      date: '1967-03-21'
      thread: china-leadership
      c: 'Evening, Great Hall, Fujian Hall. Mao hears Zhou Enlai and others on the seven "life criticism meetings" held on the Feb. 16 speeches of Tan Zhenlin, Chen Yi, Xu Xiangqian, Li Fuchun, Li Xiannian, Ye Jianying and Nie Rongzhen.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 21, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Tan Zhenlin, Chen Yi, Xu Xiangqian, Li Fuchun, Li Xiannian, Ye Jianying, Nie Rongzhen.'
      tags: [name:mao-zedong, name:zhou-enlai, name:tan-zhenlin, name:chen-yi, name:xu-xiangqian, name:li-fuchun, name:li-xiannian, name:ye-jianying, name:nie-rongzhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-23.china-leadership
      when: Mar. 23
      date: '1967-03-23'
      thread: china-leadership
      c: 'Mao reads Qi Benyu''s "Patriotism or National Betrayal? On the Reactionary Film *Secret History of the Qing Court*" (Mar. 22): "well written; some small changes." He adds a note on the Red Lantern Shining; and strikes the four titles before "Chairman Mao"; adds a paragraph: were the Chinese people to organize Boxers to "kill and burn" in the imperialist states, or were those states to come to China to invade, oppress and exploit it and so rouse the Chinese to resist? Printed in *Hongqi* no. 5 (Mar. 30) and the *Renmin ribao*.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 23, 1967. Made public: Mar. 30, 1967 (*Hongqi*, no. 5). Names: Mao Zedong, Qi Benyu.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-23.china-leadership-2
      when: Mar. 23
      date: '1967-03-23'
      thread: china-leadership
      c: 'Mao, the Center, State Council, Military Commission and Cultural Revolution Group decide on military control of the Daqing oilfield: the control commission directs both the Revolution and production, toward the three-in-one; workers stay at their posts; those who erred, models and red-flag bearers among them, to be taught and united.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 23, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-27.china-leadership
      when: Mar. 27
      date: '1967-03-27'
      thread: china-leadership
      c: 'Mao, 2 a.m., on the Group''s *Cultural Revolution Bulletin* no. 435 (Yibin, Sichuan, the two sides fiercely opposed): "To the Group: this should be dealt with; find about ten from each side to come to Peking and talk; Gan Weihan of the Chengdu Region too; settle with the Premier." Chen Boda, Kang Sheng and Jiang Qing write him that they drafted a document three weeks ago; he sends it to Lin Biao: it touches Yibin and the Chengdu Region''s and some sub-districts'' policy toward mass bodies; Lin to read and pass to Nie Rongzhen.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 27, 1967. Made public: 2013. Names: Mao Zedong, Gan Weihan, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Lin Biao, Nie Rongzhen.'
      tags: [name:mao-zedong, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, name:lin-biao, name:nie-rongzhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-29.china-leadership
      when: Mar. 29
      date: '1967-03-29'
      thread: china-leadership
      c: 'Mao reads Wang Li''s and Guan Feng''s report of Mar. 28, "The Tsinghua Work Group''s Carrying Out the Bourgeois Reactionary Line on the Cadre Question": "very good; may be published and broadcast; look into one or two schools and one or two organs; print first for those at the liaison meeting." He strikes Liu Shaoqi''s name from it, keeps the others'' surnames and makes their given names "xx," and retitles it. In *Hongqi* no. 5 (Mar. 30), the *Renmin ribao* and others.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 29, 1967. Made public: Mar. 30, 1967 (*Hongqi*, no. 5). Names: Mao Zedong, Wang Li, Guan Feng, Liu Shaoqi.'
      tags: [name:mao-zedong, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-30.china-leadership
      when: Mar. 30
      date: '1967-03-30'
      thread: china-leadership
      c: 'Mao reads Lin Biao''s record of his Mar. 20 speech at the army conference: "very good; send it to the Group to consider, then print a booklet for the grass roots of Party, government, army and people. I made a few changes." Among them: "China is, one might say, the country that decides in the world" becomes "as things stand"; "all the places are dark, we can make them light, from black to red" becomes "most places"; and he adds that the world''s revolutionaries are rising or will rise.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 30, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-03-30.china-leadership-2
      when: Mar. 30
      date: '1967-03-30'
      thread: china-leadership
      c: 'Mao agrees to add Xie Fuzhi, Xiao Hua, Yang Chengwu and Su Yu to the Military Commission''s Standing Committee, and Xie to be deputy head of the All-Army Cultural Revolution Group.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 30, 1967. Made public: 2013. Names: Mao Zedong, Xie Fuzhi, Xiao Hua, Yang Chengwu, Su Yu.'
      tags: [name:mao-zedong, name:xie-fuzhi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-04-01.china-leadership
      when: Apr. 1
      date: '1967-04-01'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s draft of Mar. 30 of the Center''s decision on Anhui. Article 2: the masses are not to be called counter-revolutionary or arrested for storming the military district or differing on seizures; those so branded to be cleared, the arrested freed, warrants withdrawn. Mao adds: many outside students stormed Zhongnanhai and some military schools the Ministry of Defense, and the Center did not scold them or make them confess or write self-criticisms but persuaded them home; localities treat storming military offices too gravely. Issued Apr. 1.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 1, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-04-04.china-leadership
      when: Apr. 4
      date: '1967-04-04'
      thread: china-leadership
      c: 'Mao reads Lin Biao''s Apr. 2 draft of the Military Commission''s ten-point order on supporting the left: "very good, small changes; send as a draft to those at the military regions'' conference for opinion, then issue." Article 6, no mass "confessions of guilt": he adds that no one is to be forced to write self-criticisms, those written of free will are returned, and the long unawakened are given time to teach themselves in the struggle. In article 7 he strikes "of Liu Shaoqi and Deng Xiaoping" from the two-line teaching. Apr. 6 he reads the revised order again.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 4, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Liu Shaoqi, Deng Xiaoping.'
      tags: [name:mao-zedong, name:lin-biao, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-04-11.china-leadership
      when: Apr. 11
      date: '1967-04-11'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Great Hall, Fujian Hall. Mao receives Phạm Văn Đồng''s delegation, Lin Biao, Zhou Enlai, Chen Yi and Ye Jianying present, on finding the rules of guerrilla war and of battles of annihilation in Vietnam and on aid. On Wei Guoqing, battered by the Red Guards for months, besieged, unable to leave: he erred, but a good man, scholarly, not rough; known to Mao through the Vietnamese. On Dazhai: he has seen Chen Yonggui, an honest man.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 11, 1967. Made public: 2013. Names: Mao Zedong, Phạm Văn Đồng, Lin Biao, Zhou Enlai, Chen Yi, Ye Jianying, Wei Guoqing, Chen Yonggui.'
      tags: [name:mao-zedong, name:pham-van-dong, name:lin-biao, name:zhou-enlai, name:chen-yi, name:ye-jianying, polity:prc, polity:drv, vis:only:prc+drv]
- add:
    entry:
      id: cal.1967-04-15.china-leadership
      when: Apr. 15–17
      date: '1967-04-15'
      thread: china-leadership
      c: 'Mao twice reads and revises Jiang Qing''s speech of Apr. 12 at the enlarged Military Commission meeting. Jiang''s Apr. 15 note: Lin Biao says it is to be sent out; she wants Mao''s corrections. Apr. 16: "can be; as arranged"; he strikes "counter-revolutionary" before Lu Dingyi, Zhou Yang, Qi Yanming and Lin Mohan. Apr. 17: strikes a little more and adds, where she tells of the Warring States'' "Chu shuo Zhao taihou," a paragraph that the Chairman said it reflects the first redistribution of property and power within the landlord class; our children too may degenerate and bring bourgeois restoration.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 1967 (the entry "4月中旬"). Made public: 2013. Names: Mao Zedong, Jiang Qing, Lin Biao, Lu Dingyi, Zhou Yang, Qi Yanming, Lin Mohan. Check: the nianpu says "mid-April" and then gives the 15th, 16th and 17th; the span is as printed there.'
      tags: [name:mao-zedong, name:jiang-qing, name:lin-biao, name:lu-dingyi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-04-23.china-leadership
      when: Apr. 23
      date: '1967-04-23'
      thread: china-leadership
      c: 'Mao reads Liang Xingchu''s report of Apr. 20 on the Sichuan release of those held in custody: "add to the print for those at the Military Commission''s enlarged meeting. To err is unavoidable if one truly mends. Sichuan seized too many and called many mass bodies reactionary, wrong, but they mend fast. Now another current: some say all the army has done there is wrong, and the army''s left-support, control and training men are embarrassed. Keep calm, tell the masses of your errors, mend at once; teach both the army and the masses positively. I think this wind will not be as severe as in February."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 23, 1967. Made public: 2013. Names: Mao Zedong, Liang Xingchu.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-04-23.china-leadership-2
      when: Apr. 23
      date: '1967-04-23'
      thread: china-leadership
      c: 'Mao reads the Henan military district committee''s report of the 22nd (Henan''s rebel bodies are to send some 4,000 delegates to Peking): "To Lin and Zhou: Henan disputes fiercely; call the two sides'' leaders for a talk; of the military district, keep only Zhao Wenfu; do not want Liu Jianxun, Wen Minsheng, Ji Dengkui, Dai Suli, Yang Weiping: is that right? Hubei, too, a big issue, almost all the provincial committee bad; study it soon." On Apr. 27 Zhou begins to talk with Chen Zaidao and others.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 23, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Zhao Wenfu, Liu Jianxun, Wen Minsheng, Ji Dengkui, Dai Suli, Yang Weiping, Chen Zaidao.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-04-24.china-leadership
      when: Apr. 24
      date: '1967-04-24'
      thread: china-leadership
      c: 'Evening. Mao meets the heads of the Shanghai, Shanxi, Guizhou, Heilongjiang, Shandong and Peking revolutionary committees and watches with them the Shanghai Dance School''s ballet *The White-Haired Girl*.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 24, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05.china-leadership
      when: May
      date: '1967-05'
      thread: china-leadership
      c: 'Mao receives a foreign military delegation and explains the Cultural Revolution, Lin Biao and others present. It began, he says, with Yao Wenyuan''s critique of *Hai Rui* in the winter of 1965; the capital was held by revisionists, "not a drop of water in, not a needle"; Jiang Qing had it organized in Shanghai; he read the text three times. By policy and tactics four stages: from Yao''s article to the Eleventh Plenum, launching; from the Plenum to the January storm, turning the course; from the seizure to the great alliance and three-in-one; from Qi Benyu''s *Patriotism or National Betrayal?* and the critique of *Self-Cultivation*, the fourth.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 1967 (no day). Made public: 2013. Names: Mao Zedong, Lin Biao, Yao Wenyuan, Jiang Qing, Qi Benyu. Check: the delegation and the day; the nianpu gives only "5月."'
      tags: [name:mao-zedong, name:lin-biao, name:yao-wenyuan, name:jiang-qing, polity:prc]
- add:
    entry:
      id: cal.1967-05.china-leadership-2
      when: May
      date: '1967-05'
      thread: china-leadership
      c: 'Mao sends Wang Dongxing to see Deng Xiaoping with three points: be patient, do not hurry; Liu and Deng can be separated; if need be, write to him. Deng asks to talk with Mao, saying many poster charges are untrue. One night Mao has Xu Yefu fetch Deng to his home; Deng reports in detail on 1931 (he left the Seventh Red Army for Shanghai to report) and accepts Mao''s criticism of his and Liu''s work groups. If Deng has business, Mao says, go to Wang Dongxing or write him.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 1967 (no day). Made public: 2013. Names: Mao Zedong, Wang Dongxing, Deng Xiaoping, Liu Shaoqi, Xu Yefu. Check: the days; the nianpu has only "同月" and "一天深夜."'
      tags: [name:mao-zedong, name:deng-xiaoping, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-04.china-leadership
      when: May 4–7
      date: '1967-05-04'
      thread: china-leadership
      c: 'Mao three times reads Chen Boda''s draft, by Wang Li and Guan Feng, "The Essence of *Self-Cultivation* Is Betrayal of the Proletarian Dictatorship" (Liu Shaoqi''s *On the Self-Cultivation of a Communist*). May 4: "some views written into the text; revise; then to the Group and the Standing Committee liaison meeting." May 6: "added a few lines on p. 7; is it right? print a clean proof for me." May 7: "print so." He adds two paragraphs, on the book''s picture of communist society, all good with no dark side, no contradiction, no opposite, society''s growth ended; and on how any thing, any person, divides in two.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 4, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Wang Li, Guan Feng, Liu Shaoqi.'
      tags: [name:mao-zedong, name:chen-boda, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-07.china-leadership
      when: May 7
      date: '1967-05-07'
      thread: china-leadership
      c: 'Mao reads the Guangdong control commission''s report of May 5 on training the men sent to support the left: "To Lin: may be sent out for others'' reference. Every military region''s troops should drill a short while, ten to fourteen days, on the Guangzhou plan and way; those already drilled, again in one or two months; all ''three supports, two armies'' men every one or two months, to praise the good, correct the wrong, and fight again."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 7, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-07.china-leadership-2
      when: May 7
      date: '1967-05-07'
      thread: china-leadership
      c: 'Mao reads the Shandong military district''s wire of May 4 to the Jinan Region and the Group (the point of struggle in Shandong is turned more and more on the PLA): "To Lin, Zhou and the Group: here the students and workers who fought (a minority in the province) suggest that the provincial military district, sub-districts and county armed departments mostly have problems; study how to settle it, tell me. Of Shandong and the provinces, the regular army has erred little; the Chongqing 54th wires asking if backing Chongqing University''s ''Aug. 15'' was wrong; call the two sides, and settle with Liang, Zhang, Gan and Wei."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 7, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Liang Xingchu, Zhang Guohua, Gan Weihan, Wei Jie.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-09.china-leadership
      when: May 9
      date: '1967-05-09'
      thread: china-leadership
      c: 'Mao reads the Group''s draft opinion on propaganda for the 25th anniversary of the Yan''an Talks on Literature and Art: May''s propaganda to turn on the *Talks*, with performances and commemorations; the papers to reprint the *Talks* and six other texts of Mao. "To the liaison meeting for decision; if all agree, I do not object."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 9, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-10.china-leadership
      when: May 10
      date: '1967-05-10'
      thread: china-leadership
      c: 'Mao reads a letter from Jinan masses forwarded by Liu Bocheng on Apr. 30 (Jinan''s wind against the PLA, at force twelve): "it shows the mood of many in the army these days. Meeting this, be calm, do more work, build on success, mend errors; the problem can be solved."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 10, 1967. Made public: 2013. Names: Mao Zedong, Liu Bocheng.'
      tags: [name:mao-zedong, name:liu-bocheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-11.china-leadership
      when: May 11
      date: '1967-05-11'
      thread: china-leadership
      c: 'Mao approves the Center, State Council, Military Commission and Group''s telegram agreeing to a Tibet military control commission to Zhang Guohua''s chairmanship, replying to the Tibet Military Region. May 12: "do it," on the Peking Military Region''s request to put Hebei and Shijiazhuang, Tangshan, Zhangjiakou, Chengde and Hengshui under military control.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 11, 1967 and May 12, 1967. Made public: 2013. Names: Mao Zedong, Zhang Guohua.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-13.china-leadership
      when: May 13
      date: '1967-05-13'
      thread: china-leadership
      c: 'Mao reads a letter of Apr. 21 from Qin Houde, an army man at Jinan on the left-support work: the support has gone to the conservatives, not the left; some propaganda teams deal roughly with "counter-revolutionary" bodies; the provincial revolutionary committee and the Jinan Military Region''s headquarters for guarding the Cultural Revolution are at opposite poles. Mao: "Print it as a *Kuaibao*, to the Group''s office. It is a common problem, much to be noted. The Jinan air force (May 5) and the Region (May 6) have publicly backed the provincial committee; the army has reported to the Center; the problem is begun to be solved; in other provinces and cities some solved, some not."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 13, 1967. Made public: 2013. Names: Mao Zedong, Qin Houde.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-14.china-leadership
      when: May 14
      date: '1967-05-14'
      thread: china-leadership
      c: 'Mao reads the Lanzhou Military Region committee''s telegram of May 13 asking leave to back Gansu''s rebels and form Gansu''s revolutionary committee: "To Lin and Zhou: the view has reason; confer with Zhang, Xian, Zhan Danan. Hu Jizong and others have stood forth and agree with the Region; they strongly back the Third Headquarters; why not skip military control and, after some work as the Region says, form the provincial revolutionary committee?" On July 30 he reads the memorandum on Gansu: "very good, do it": no military control, a preparatory group directly.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 14, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Zhang Dazhi, Xian Henghan, Zhan Danan, Hu Jizong.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-14.china-leadership-2
      when: May 14
      date: '1967-05-14'
      thread: china-leadership
      c: 'For the Center''s note forwarding the Guangdong military control commission''s report of May 13 and the Hunan military district''s of May 12, Mao drafts the note to the whole army (Center, Military Commission, Cultural Revolution Group, army Cultural Revolution Group): mistakes must be mended outright, or they sink deeper and cost more in the end; do not waver; do not believe what wives and children bring from the "protect" bodies; bear criticism from workers, peasants, students, soldiers and cadres, accept the good, explain the wrong; the great majority are good, the bad no more than one, two, three percent. "To Zhou and Lin, the liaison meeting, issue." Sent May 15.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 14, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-16.china-leadership
      when: May 16
      date: '1967-05-16'
      thread: china-leadership
      c: 'Noon, Great Hall room 118. Mao receives the Congo (Brazzaville) government''s security delegation under Bindi, Zhou Enlai and Xie Fuzhi present. On the disorder of the Cultural Revolution: "chaotic; the Red Guards are everywhere; not my creation, the masses''; the posters, Red Guards, bombarding this and that. Our government, the Center, the Ministry of Public Security could do nothing; when the Red Guards and masses came, there was a way; what we did not know for decades the Red Guards made plain." It will be disorderly one or two years; the sky will not fall.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 16, 1967. To check: Xinhua''s report. Names: Mao Zedong, Bindi, Zhou Enlai, Xie Fuzhi. Check: the head''s name (the nianpu''s 宾迪).'
      tags: [name:mao-zedong, name:zhou-enlai, name:xie-fuzhi, polity:prc, polity:congo]
- add:
    entry:
      id: cal.1967-05-17.china-leadership
      when: May 17
      date: '1967-05-17'
      thread: china-leadership
      c: 'The Center notices that it will publish the May 16, 1966 Circular, and the *Renmin ribao* prints it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 17, 1967. See [[cal.1966-05-16.china-leadership]].'
      tags: [polity:prc]
- add:
    entry:
      id: cal.1967-05-18.china-leadership
      when: May 18
      date: '1967-05-18'
      thread: china-leadership
      c: 'Mao, 2:30 a.m., reads and corrects the *Hongqi*–*Renmin ribao* editorial "A Great Historic Document," for the publication of the Circular. His paragraph: after the means of production are socialized, are there still classes and class struggle; does it all turn on seizing power; under proletarian dictatorship is revolution still needed, against whom and how? Marx and Engels could not solve it; Lenin saw the defeated bourgeois stronger than the proletariat and bent on restoration; Mao''s thought answers it. "To Wang Li: back at once; I changed a little; the Group to decide."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 18, 1967. Made public: 2013. Names: Mao Zedong, Wang Li.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-18.china-leadership-2
      when: May 18
      date: '1967-05-18'
      thread: china-leadership
      c: 'Jiang Qing forwards to Lin Biao, Zhou Enlai and Kang Sheng a notice faked by the Kuomintang in 1932 papers, "the Wuhao and others leave the Communist Party," which Nankai University''s rebels found, with a letter: "they found an anti-Communist notice headed by Wuhao (Zhou xx) and want to talk." May 19 Zhou notes on her letter: forged by the enemy; writes Mao with a chronology of 1931–32; the forgeries were made after he left for Jiangxi. Mao: "To the Group: read and file."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 18, 1967. Made public: 2013. Names: Jiang Qing, Lin Biao, Zhou Enlai, Kang Sheng, Mao Zedong.'
      tags: [name:jiang-qing, name:lin-biao, name:zhou-enlai, name:kang-sheng, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-22.china-leadership
      when: May 22
      date: '1967-05-22'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s May 21 draft Military Commission order for the Inner Mongolia Military Region: "do as drafted." All Inner Mongolians in Peking back by May 24; no storming and no link-ups in the region''s organs and units; some who defy the Center to be punished; the troops to fight no more; backing the left, teaching the conservatives. The army hears it May 23.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 22, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-23.china-leadership
      when: May 23
      date: '1967-05-23'
      thread: china-leadership
      c: 'The Center Cultural Revolution Group forms a literature-and-art section, Jiang Qing head, Qi Benyu and Yao Wenyuan deputies. By Mao''s view it is dissolved Oct. 12.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 23, 1967. Made public: 2013. Names: Jiang Qing, Qi Benyu, Yao Wenyuan, Mao Zedong.'
      tags: [name:jiang-qing, name:yao-wenyuan, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-24.china-leadership
      when: May 24
      date: '1967-05-24'
      thread: china-leadership
      c: 'Mao reads the Group''s *Kuaibao* of May 20, "Why does the antagonism between the Jiangxi Military Region and the revolutionary masses grow": "To Lin and Zhou, to the Group, then to Wang Dongxing: whether some of the Jiangxi commanders'' attitude to the masses is right needs study. Hunan, Hubei and Henan military regions too."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 24, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Wang Dongxing.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-26.china-leadership
      when: May 26
      date: '1967-05-26'
      thread: china-leadership
      c: 'Mao reads the request of Zhao Yimin, deputy head of the Center''s International Liaison Department, of May 18 on the Chinese delegation to the Sino-Burmese party talks; Jiang Qing is on the list. Mao: "Better that Jiang Qing not go."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 26, 1967. Made public: 2013. Names: Mao Zedong, Zhao Yimin, Jiang Qing.'
      tags: [name:mao-zedong, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-27.china-leadership
      when: May 27
      date: '1967-05-27'
      thread: china-leadership
      c: 'Mao drafts for the Military Commission the note forwarding the 54th Army''s report of May 26 on work among opponents: "the 54th at Chongqing has done well; for your reference. Where two sides of the revolutionary masses are sharply opposed, careful political work will solve it; even for conservative or reactionary bodies with masses, work finely. Lin and Zhou to read and issue."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 27, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-28.china-leadership
      when: May 28
      date: '1967-05-28'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s draft of the Center, State Council, Military Commission and Group decision on military control of State Council ministries ("trial draft"): "do it." It goes out that day; the ministries form control commissions or groups.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 28, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-05-31.china-leadership
      when: May 31
      date: '1967-05-31'
      thread: china-leadership
      c: 'Mao hears Zhou Enlai and agrees that military control of the Ministries of Railways and Communications cannot wait. That day the Center issues the two decisions (trial drafts), Mao having written "do it," and on June 1 an order on keeping the railway and transport in revolutionary order.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 31, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-06-06.china-leadership
      when: June 6
      date: '1967-06-06'
      thread: china-leadership
      c: 'Mao approves the Center, State Council, Military Commission and Group order against the recent "beating, smashing, looting, ransacking and seizing": none but the organs of dictatorship may, by law, seize people, set up private courts, search or ransack; none may seize or destroy files and seals of Party, government and army organs, or state and collective property; the garrison and local troops may arrest and detain the ringleaders and killers.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 6, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-06-06.china-leadership-2
      when: June 6
      date: '1967-06-06'
      thread: china-leadership
      c: 'Great Hall, room 118, afternoon. Mao receives Sanmugathasan, member of the Politburo and secretary of the Ceylon Communist Party''s Central Committee, Kang Sheng and Liu Ningyi present. On the Middle East: the United States and Britain are on the defensive in the Mediterranean and the Near East; a local war likely, with the imperialists behind, mainly Israel against the UAR; oil is the aim (60 percent under the Americans, 35 under the British); if Israel wins locally the war may widen, which touches the USSR. The UAR may close Suez, at least in war, hurting Britain, France and Germany most; the Americans can go round Africa.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 6, 1967. Made public: 2013. To check: the Chinese Government''s statement of June 6, 1967 on the Middle East war (note 77). Names: Mao Zedong, N. Sanmugathasan, Kang Sheng, Liu Ningyi.'
      tags: [name:mao-zedong, name:kang-sheng, polity:prc]
- add:
    entry:
      id: cal.1967-06-09.china-leadership
      when: June 9
      date: '1967-06-09'
      thread: china-leadership
      c: 'Afternoon. Mao receives the writers of Asia, Africa and the world at the Afro-Asian Writers'' Permanent Bureau''s symposium on the 25th anniversary of his Yan''an talks on literature and art, and is photographed with them; Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing attend.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 9, 1967. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
      tags: [name:mao-zedong, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, polity:prc]
- add:
    entry:
      id: cal.1967-06-17.china-leadership
      when: June 17
      date: '1967-06-17'
      thread: china-leadership
      c: 'China explodes its first hydrogen bomb in the west of the country. Mao reads Xinhua''s communiqué, "China''s First Hydrogen Bomb Explodes Successfully," and strikes "great teacher, great leader, great commander, great helmsman" from it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 17, 1967. Made public: June 17, 1967 (Xinhua). To check: the Xinhua communiqué of June 17, 1967 as issued. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1967-06-18.china-leadership
      when: June 18
      date: '1967-06-18'
      thread: china-leadership
      c: 'Great Hall, room 118. Mao presides over an enlarged Standing Committee meeting on the Red Guard delegation of Yao Wenyuan to the Fifth Congress of the Albanian Labor Youth. On Yao''s draft speech: quote me little; page 21 too long, cut half; Red Guards only want to blow; since the Cultural Revolution there is much blowing and foreigners dislike it; "blow at home, do not blow abroad." Cut "three stages, three milestones." Foreigners object to the *Peking Review* and Xinhua''s propaganda. "Yesterday, the H-bomb communiqué: I struck all the ''great teacher...'' and ''boundless light.'' We should be modest, abroad especially."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 18, 1967. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags: [name:mao-zedong, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-06-21.china-leadership
      when: June 21
      date: '1967-06-21'
      thread: china-leadership
      c: 'Mao reads the Group''s *Xindian kuaibao* no. 234 of June 19, a letter from Xi''an on rebel bodies'' extravagant celebrations of founding revolutionary committees: "To the Group: suggest it be published; discuss at the Standing Committee liaison meeting; add a note." On June 29 the Center issues the notice on thrift in making revolution and against extravagance.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 21, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-06-24.china-leadership
      when: June 24
      date: '1967-06-24'
      thread: china-leadership
      c: 'Evening, Great Hall, room 118. Mao receives Zambia''s President Kenneth Kaunda and party, Lin Biao, Zhou Enlai, Chen Yi and Li Xiannian present. China''s years at war, twenty-five of eighteen since victory; China is undeveloped, farming and handicraft not mechanized; railways fewer than India''s; few ocean ships. Those independent earlier owe those later help; "you have been free two and a half years; we eighteen"; without the world''s liberation China cannot at last be free.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 24, 1967. To check: Xinhua''s report. Names: Mao Zedong, Kenneth Kaunda, Lin Biao, Zhou Enlai, Chen Yi, Li Xiannian.'
      tags: [name:mao-zedong, name:kaunda-kenneth-d, name:lin-biao, name:zhou-enlai, name:chen-yi, name:li-xiannian, polity:prc]
- add:
    entry:
      id: cal.1967-06-27.china-leadership
      when: June 27
      date: '1967-06-27'
      thread: china-leadership
      c: 'Great Hall, room 118, afternoon. Mao receives the Marxist-Leninist Communist Party of Peru''s study group, the Communist Party of Ecuador (Marxist-Leninist)''s, and the Bolivian Politburo member Gutiérrez, Kang Sheng and Liu Ningyi present. Their talk is of one kind: down with imperialism, revisionism, reaction; seize power, set up proletarian dictatorship. Before it comes the bourgeois-democratic revolution, land to the peasants, without touching peasants'' private ownership; some bourgeoisie in conflict with imperialism not to be touched at first; unite the proletariat, peasants, urban petty bourgeoisie, national bourgeoisie and their intellectuals.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 27, 1967. Made public: 2013. Names: Mao Zedong, Gutiérrez, Kang Sheng, Liu Ningyi. Check: Gutiérrez''s party; the Peruvian and Ecuadorian delegates are not named.'
      tags: [name:mao-zedong, name:kang-sheng, polity:prc, polity:bolivia]
- add:
    entry:
      id: cal.1967-07-04.china-leadership
      when: July 4
      date: '1967-07-04'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s report of the night of July 3 on settling Jiangxi and proposing a division from Shandong to support the military control commission and the future revolutionary committee: "Whether to move a division from Shandong, decide after the Jiangxi conference has an outline."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 4, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-05.china-leadership
      when: July 5
      date: '1967-07-05'
      thread: china-leadership
      c: 'Mao reads a Center General Office paper of July 4 on the masses'' making giant statues of him over the country: "To Lin, Zhou and the Group: such things waste money and harm, no good; if not stopped a boasting wind will rise. Discuss at an enlarged Standing Committee meeting, and issue a stop." On a note on a Peking Mining Institute body collecting and printing his unpublished talks: "stop that too." On July 13 the Center issues, "do it," a directive on putting up statues: all to stop; nothing of his unpublished may be printed without his and the Center''s approval.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 5, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-06.china-leadership
      when: July 6
      date: '1967-07-06'
      thread: china-leadership
      c: 'Mao reads two booklets of *Chairman Mao on Education*, one of the Center''s Political Research Office (June), one of the Tianjin University "Aug. 13" Red Guards (May). The first: "to Chen Boda: many errors, cut at least a third." The second: "I have not read it; it may too hold bad things; with the Group look at both and your own; strike the bad, keep about half, the more correct."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 6, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-06.china-leadership-2
      when: July 6
      date: '1967-07-06'
      thread: china-leadership
      c: 'Mao reads the Military Commission General Office''s paper of July 4 (letters from Ganzhou, Jiangxi, of fierce fighting, asking the Center to send troops): "To Lin and Zhou: Ganzhou is grave, it reaches a dozen counties of southern Jiangxi; a division sent would hold Nanchang, Ji''an, Yichun and Fuzhou, but Ganzhou far; could Guangzhou''s send a division, at least a regiment, to Ganzhou, then back to Guangdong? Think first; talk it over." That night Zhou writes: Huang Yongsheng can send two regiments and a division headquarters. Mao, next day: "returned to the Premier."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 6, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Huang Yongsheng.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:huang-yongsheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-12.china-leadership
      when: July 12
      date: '1967-07-12'
      thread: china-leadership
      c: 'Mao reads Lin Biao''s draft of July 10, a General Staff and General Political Department notice "Firmly Carry Out Vice-Chairman Lin''s Instruction on Building Large Full-Length Statues of Chairman Mao" (Lin of June 28: big statues have become the masses'' demand; the army too should build them at large offices with a courtyard or square): "Returned to Lin. Not to be issued. The Center has instructed already."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 12, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-13.china-leadership
      when: July 13
      date: '1967-07-13'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s draft Center notice forbidding the stirring of peasants to enter cities to fight (in Jiangxi and elsewhere some bad men in local armed-forces offices incite peasants into the towns): "do it." He changes "bad men" to "a few comrades whose thinking is not remolded": "not to be called bad men." Issued that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 13, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-13.china-leadership-2
      when: July 13
      date: '1967-07-13'
      thread: china-leadership
      c: 'Afternoon. Mao calls Lin Biao, Zhou Enlai, the Group''s liaison meeting members, Xiao Hua and Yang Chengwu. A year to start; the second year to see the outline and settle the base; the next to end: that is the Cultural Revolution. He proposes going to Hubei and Hunan; to Zhou: go to Wuhan, protect Chen Zaidao. Most think Wuhan''s fighting is grave and no safe place for him. "I do not fear disorder; Yang Chengwu will go with me." Wang Dongxing to ready the train; Zheng Weishan to ride with them to talk on Hebei.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 13, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Xiao Hua, Yang Chengwu, Chen Zaidao, Wang Dongxing, Zheng Weishan.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-14.china-leadership
      when: July 14
      date: '1967-07-14'
      thread: china-leadership
      c: 'Mao leaves Peking on a special train at 3 a.m. with Yang Chengwu, Zheng Weishan and Wang Dongxing, his first time away in a year. On the train he hears Zheng on army support of the left in Hebei: before military control, three or four from each big county and two or three from each small to meet and be told the policy; to err is nothing, and he is chiefly to blame: on Jan. 21 he told the army to intervene and back the left; then the "eight articles" caught too many and banned some bodies; Lin''s "ten articles" let the pressed rise again; then the June 6 order; some do not obey it; "back and forth is good."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 14, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zheng Weishan, Wang Dongxing, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-17.china-leadership
      when: July 17
      date: '1967-07-17'
      thread: china-leadership
      c: 'Wuchang, the East Lake guesthouse, morning. Mao calls Zhou Enlai, Yang Chengwu, Zheng Weishan, Yu Lijin and Wang Dongxing; Xie Fuzhi and Wang Li report on Yunnan, Sichuan and others; Wuhan is also taken up. Military control is hard: whoever runs it errs; work on the army, let its cadres and men off blame. On publishing the May 16 Circular: he and Zhou decided it at once; so quick it set off guessing and hit Zhou. Sichuan''s list of the provisional committee has twelve added, Li Dazhang among them: "my doing; someone known in Sichuan is needed." On peasants brought into towns to fight: "a sign of weakness; encircling the cities from the villages was right when the imperialists and Chiang held the cities; now to say it is wrong."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 17, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Yang Chengwu, Zheng Weishan, Yu Lijin, Wang Dongxing, Xie Fuzhi, Wang Li, Li Dazhang.'
      tags: [name:mao-zedong, name:zhou-enlai, name:xie-fuzhi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-18.china-leadership
      when: July 18
      date: '1967-07-18'
      thread: china-leadership
      c: '7:30 p.m., East Lake guesthouse. Mao calls Zhou Enlai, Xie Fuzhi, Yang Chengwu, Wang Li, Zheng Weishan, Yu Lijin, Wang Dongxing, Li Zuopeng and Wuhan''s Chen Zaidao and second commissar Zhong Hanhua. To Chen and Zhong: Sichuan is very grave, Wuhan different, not so bad as Hunan or Jiangxi; the storming was fierce, and "keep the Military Commission''s eight articles"; then arrests and dissolutions; the "ten articles" cheered the rebels. Guns to be kept together; four sides (the Wuhan bodies and the army''s left-support units) to be worked on; a cadre meeting, with the people''s armed departments; the "Million Heroes" to be worked on, else they''ll turn on you. To err is no matter.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 18, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Xie Fuzhi, Yang Chengwu, Wang Li, Zheng Weishan, Yu Lijin, Wang Dongxing, Li Zuopeng, Chen Zaidao, Zhong Hanhua.'
      tags: [name:mao-zedong, name:zhou-enlai, name:xie-fuzhi, name:li-zuopeng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-20.china-leadership
      when: July 20
      date: '1967-07-20'
      thread: china-leadership
      c: 'Wuhan. The "Million Heroes," some with soldiers backing them who did not know where Mao was lodged, storm the East Lake guesthouse and take Wang Li to the Wuhan Military Region compound to question him. It came of Xie Fuzhi''s and Wang Li''s open support for days of the rebel "Three New Two Headquarters" and "Third Headquarters," pressing the army-backed "Million Heroes," named "conservative." Lin Biao and Jiang Qing write Mao that Wuhan is bad and his safety threatened; leave early. Mao decides to leave at once.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 20, 1967. Made public: 2013. Names: Wang Li, Xie Fuzhi, Lin Biao, Jiang Qing, Mao Zedong.'
      tags: [name:xie-fuzhi, name:lin-biao, name:jiang-qing, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-21.china-leadership
      when: July 21
      date: '1967-07-21'
      thread: china-leadership
      c: '2 a.m. Mao leaves the East Lake guesthouse for the airfield, Zhou Enlai, who came to Wuhan, arranging it; at 11 a.m. he flies to Shanghai and lodges at the Hongqiao guesthouse until Sept. 16. Of the "Shanghai Workers'' General Headquarters" smashing the "Joint Headquarters," seen in a film: inside the working class there is no basic conflict of interest, still less cause under proletarian dictatorship for two irreconcilable camps. He asks of the drought round Shanghai and orders artificial rain.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 21, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-22.china-leadership
      when: July 22
      date: '1967-07-22'
      thread: china-leadership
      c: 'Morning, Shanghai. Mao hears Yang Chengwu relay Zhou Enlai''s 8:20 telephone call from Wuhan: report of Wuhan events to be oblique, no names; protect Chen Zaidao and others. Mao: Wuhan is to be treated as an error; if he has resolve, we cannot get out and Zhou cannot get in, yet he has not ordered that none pass; agrees to protect Chen. 11 a.m., with Yang, Zhang Chunqiao, Yu Lijin, Wang Dongxing: Zhou, Xie Fuzhi and Wang Li have nothing to say in Wuhan, they''d be surrounded and made to sign that the "Million Heroes" is revolutionary; best leave; talks in Peking, three sides together. This is no longer Wuhan''s matter but the nation''s; Zhou to act as he sees fit.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 22, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zhou Enlai, Zhang Chunqiao, Yu Lijin, Wang Dongxing, Chen Zaidao, Xie Fuzhi, Wang Li.'
      tags: [name:mao-zedong, name:zhou-enlai, name:zhang-chunqiao, name:xie-fuzhi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-22.china-leadership-2
      when: July 22
      date: '1967-07-22'
      thread: china-leadership
      c: 'Lin Biao presides over a full meeting of the Cultural Revolution Group, which names the Wuhan "July 20 incident" a "counter-revolutionary riot."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 22, 1967. Made public: 2013. Names: Lin Biao.'
      tags: [name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-22.china-leadership-3
      when: July 22
      date: '1967-07-22'
      thread: china-leadership
      c: 'Jiang Qing, receiving Henan''s mass bodies'' delegates: do not be naive; when the handful who raised the fight have agreed, your arms must not be put down; "I recall a Henan body raised the slogan ''attack by argument, defend by arms,''" and it is right. On the 23rd the *Wenhui bao* prints "Wengong wuwei." Fighting spreads over the country.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 22, 1967. Made public: 2013. Names: Jiang Qing.'
      tags: [name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-24.china-leadership
      when: July 24
      date: '1967-07-24'
      thread: china-leadership
      c: 'Evening, Shanghai. Mao to Yang Chengwu, who goes to Peking: arrange the 40th anniversary of the army; tell the Premier not to be so sharp (Lin Biao, Jiang Qing and others in the handling of Wuhan); treat it as an error; watch for those who make something of it; bring Chen Zaidao, Zhong Hanhua, Division Commander Niu and Commissar Cai to the Jingxi Hotel; tell Chen three things: self-criticize, study, mind safety.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 24, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zhou Enlai, Lin Biao, Jiang Qing, Chen Zaidao, Zhong Hanhua.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-25.china-leadership
      when: July 25
      date: '1967-07-25'
      thread: china-leadership
      c: 'Afternoon. Mao reads the Wuhan Military Region committee''s draft "Notice of the PLA Wuhan Forces" (July 24) and drafts the Center''s reply to it: "the stand and policy you now take are right; the notice may be published. Erring cadres, Chen Zaidao whom the masses want brought down included, may stand and join the revolution if they hold to no error, mend and are forgiven; work on the troops and the Million Heroes; work on the left, no revenge; watch for bad men." 10 p.m., he revises the Center''s open telegram to the city of Wuhan, sent by Lin Biao. The notice is posted July 26 and printed July 29.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 25, 1967. Made public: 2013. Names: Mao Zedong, Chen Zaidao, Lin Biao.'
      tags: [name:mao-zedong, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-25.china-leadership-2
      when: July 25
      date: '1967-07-25'
      thread: china-leadership
      c: 'Peking, Tiananmen square. A rally of a million welcomes Xie Fuzhi and Wang Li back from Wuhan and backs Wuhan''s rebels; Lin Biao and Jiang Qing attend. Lin proposes "smash the General Political Department''s Yamen": four directors and twenty heads of the department are put under investigation one after another.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 25, 1967. Made public: 2013. Names: Xie Fuzhi, Wang Li, Lin Biao, Jiang Qing.'
      tags: [name:xie-fuzhi, name:lin-biao, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-26.china-leadership
      when: July 26
      date: '1967-07-26'
      thread: china-leadership
      c: 'Mao to Yang Chengwu, going back to the Aug. 1 reception: those who want Sept. 9, the Autumn Harvest Uprising, as Army Day are wrong; Nanchang was Aug. 1, the Soviet government''s decision of 1933, unchangeable; it was national and big politics, though lost by wrong policy; the Autumn Harvest local, not to be puffed because he took part. Make the reception large, all the old marshals to come, Yang to give the toast.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 26, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-27.china-leadership
      when: July 27
      date: '1967-07-27'
      thread: china-leadership
      c: 'Lin Biao presides over a meeting that decides first, inside, to remove Chen Zaidao and Zhong Hanhua. Lin: Wuhan is the nation''s matter; "seize the big article"; criticize the "Liu-Deng line with guns" and pull out the handful in the army on the capitalist road.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 27, 1967. Made public: 2013. Names: Lin Biao, Chen Zaidao, Zhong Hanhua, Liu Shaoqi, Deng Xiaoping.'
      tags: [name:lin-biao, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-07-31.china-leadership
      when: July 31
      date: '1967-07-31'
      thread: china-leadership
      c: 'Afternoon. Mao answers Zhou Enlai''s telephone: Lin Biao, Jiang Qing and others do not want Xu Xiangqian, Nie Rongzhen and Ye Jianying at the Aug. 1 reception. Zhu De, Xu Xiangqian and the other marshals under attack must go. That night at the Great Hall Zhu De, Xu, Nie and Ye attend.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 31, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao, Jiang Qing, Zhu De, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, name:jiang-qing, name:zhu-de, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-01.china-leadership
      when: Aug. 1
      date: '1967-08-01'
      thread: china-leadership
      c: '*Hongqi* prints the editorial "The Proletariat Must Firmly Hold the Gun" for the army''s 40th anniversary, drafted under Guan Feng: it calls to expose the Party''s handful on the capitalist road in the army too and "fight them down and fight them stinking": "the great direction of the struggle."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 1, 1967. Names: Guan Feng.'
      tags: [polity:prc]
- add:
    entry:
      id: cal.1967-08-03.china-leadership
      when: Aug. 3
      date: '1967-08-03'
      thread: china-leadership
      c: 'Afternoon, Shanghai. Mao hears Yang Chengwu, back from Peking, relay what Lin Biao, Zhou Enlai and the Group need instruction on. On the staffing of the Wuhan, Shenyang, Jiangxi and Henan commands and some field and air units: the Cultural Revolution is good for knowing cadres; cadres are mostly good; "one pull, three beat down" is not reasonable; the courts and police have good men. The Chongqing 54th... Staff, rear-service, navy and air corps to send investigation teams of seven or eight to Hunan, Jiangxi, Anhui; Anhui the key; call them to Peking.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 3, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Lin Biao, Zhou Enlai. Check: the nianpu''s "一揪三打倒" ("one pull, three beat down") is the phrase as given; Mao''s gloss, Check.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-03.china-leadership-2
      when: Aug. 3
      date: '1967-08-03'
      thread: china-leadership
      c: 'Noon, Hongqiao guesthouse. Mao calls Yang Chengwu, Zhang Chunqiao and Wang Dongxing and hears Yu Lijin on Wuhan. On the "Xiangjiang Storm" ruling, which the Center''s "Feb. 4 instruction" set: the instruction was wrong, the Center chiefly to blame, else the Region would not obey: "that put the Region in the front line"; the dissolving was by the Group and the liaison meeting, "I did not know, nor Lin Biao, but I will take the blame."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 3, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zhang Chunqiao, Wang Dongxing, Yu Lijin, Lin Biao.'
      tags: [name:mao-zedong, name:zhang-chunqiao, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-04.china-leadership
      when: Aug. 4
      date: '1967-08-04'
      thread: china-leadership
      c: 'Mao revises the draft Center "Some Decisions on the Hunan Question," and Aug. 7 agrees the revision. In the passage that the Group''s "Feb. 4 instruction" on the Hunan Military District''s report of "Xiangjiang Storm" "had a fault," he writes "was in error," and adds: from this learn; why send the Feb. 4 instruction in haste on one side''s word, unknown? So the Center is chiefly responsible. Four articles: the Hunan Military District''s self-criticism good; the district to be reorganized and a Hunan preparatory group started; the bodies to unite under it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 4, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-05.china-leadership
      when: Aug. 5
      date: '1967-08-05'
      thread: china-leadership
      c: 'The *Renmin ribao* prints Mao''s "Bombard the Headquarters: My Wall Poster," written a year before. Tiananmen square holds a rally on the poster''s first anniversary and a denunciation of "the biggest handful on the capitalist road, headed by China''s Khrushchev."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 5, 1967. See [[cal.1966-08-05.china-leadership]]. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc]
- add:
    entry:
      id: cal.1967-08-05.china-leadership-2
      when: Aug. 5
      date: '1967-08-05'
      thread: china-leadership
      c: 'Under Mao''s intervention the "Pull Out Liu" fire line is forced to withdraw. Since mid-July, urged by Kang Sheng, Xie Fuzhi and Qi Benyu, scores of Peking bodies had besieged the Zhongnanhai west gate and stormed the State Council.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 5, 1967. Made public: 2013. Names: Mao Zedong, Kang Sheng, Xie Fuzhi, Qi Benyu.'
      tags: [name:mao-zedong, name:kang-sheng, name:xie-fuzhi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-07.china-leadership
      when: Aug. 7
      date: '1967-08-07'
      thread: china-leadership
      c: 'Wang Li receives the Foreign Ministry''s rebels: why may not Red Guards do diplomacy? Why not shake the Ministry''s Party committee? Tearing down Chen Yi, the direction right, why not; "you have not yet the power; with some you would have swagger." On Aug. mid, the Ministry''s rebels storm the Ministry and declare seizure of the committee''s power. Also Aug. 7 Xie Fuzhi, to the whole Ministry of Public Security: smash the old political, ideological, theoretical and organizational stuff, break the old machine; courts, procuratorates and police are stormed and files seized over the country.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 7, 1967. Made public: 2013. Names: Wang Li, Chen Yi, Xie Fuzhi.'
      tags: [name:chen-yi, name:xie-fuzhi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-10.china-leadership
      when: Aug. 10
      date: '1967-08-10'
      thread: china-leadership
      c: 'The Center, State Council, Military Commission and Group, Mao having read and agreed, order national defense forces to guard the railways: the military control commissions and groups of the railway bureaus, branches and stations to be reorganized and made one command; railway police under the guard troops.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 10, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-10.china-leadership-2
      when: Aug. 10
      date: '1967-08-10'
      thread: china-leadership
      c: 'Mao reads the Center''s "Some Decisions on the Jiangxi Question": "seen, do it." The military district reorganized; PLA troops to be sent to support the left; a preparatory group for a Jiangxi revolutionary committee under Cheng Shiqing as main man; both sides to keep the truce, none to take PLA arms or loot depots.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 10, 1967. Made public: 2013. Names: Mao Zedong, Cheng Shiqing.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-11.china-leadership
      when: Aug. 11
      date: '1967-08-11'
      thread: china-leadership
      c: 'Mao reads Chen Boda''s and Jiang Qing''s *Renmin ribao*–*Hongqi* editors'' article "Socialist Road or Capitalist Road?": "well written, but some places only blame without proof; think again; return to Chen and Jiang, do so." Printed Aug. 15 and in *Hongqi* no. 13 (Aug. 17).'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 11, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Jiang Qing.'
      tags: [name:mao-zedong, name:chen-boda, name:jiang-qing, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-14.china-leadership
      when: Aug. 14
      date: '1967-08-14'
      thread: china-leadership
      c: 'Mao reads a letter of July 2 from Sanmugathasan to the American expert Sidney Rittenberg at the Broadcasting Bureau, apologizing for having repeated Mao''s talk after his visit and asking Rittenberg to explain to Kang Sheng or Liu Ningyi. Mao: "To Kang Sheng: do not blame those who published; talk of this sort may be published; it does no harm."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 14, 1967. Made public: 2013. See [[cal.1967-06-06.china-leadership-2]]. Names: Mao Zedong, N. Sanmugathasan, Sidney Rittenberg, Kang Sheng, Liu Ningyi.'
      tags: [name:mao-zedong, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-16.china-leadership
      when: Aug. 16
      date: '1967-08-16'
      thread: china-leadership
      c: 'Shanghai. Mao receives the Albanian experts (Mo Yixiu and Mu Xi in the nianpu), who have come to translate, proof and publish *Quotations from Chairman Mao* in Albanian, Yao Wenyuan present. I do not know the use of the *Quotations*; time will tell. He said long ago to make *Marx*, *Engels*, *Lenin* and *Stalin Quotations*; no one took it up; take it up. The Chinese experience is limited; for other countries to consult. Of cadres: in seventeen years some have ceased to be Marxists, are content and do not advance; some do ill; some are good; teach the first, oust the second; most are good.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 16, 1967. Made public: 2013. Names: Mao Zedong, Yao Wenyuan. Check: the experts'' names in Albanian (the nianpu''s 莫依修 and 穆希).'
      tags: [name:mao-zedong, name:yao-wenyuan, polity:prc]
- add:
    entry:
      id: cal.1967-08-16.china-leadership-2
      when: Aug. 16
      date: '1967-08-16'
      thread: china-leadership
      c: 'Mao reads the Center, State Council, Military Commission and Group''s letter to the coal workers, "seen, do it": warring and stopped mines to stop at once and resume output; all out of their posts to return. The letter is dated Aug. 15.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 16, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-18.china-leadership
      when: Aug. 18
      date: '1967-08-18'
      thread: china-leadership
      c: 'Mao approves, "do it; after the first batch is tried, fix the second''s range and way, which may change," Zhou Enlai''s Aug. 17 draft of the Military Commission''s and Group''s opinion on training classes for armed cadres in each province: to review where support of the left went wrong; by criticism and the "four bigs"; study of Mao''s works.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 18, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-20.china-leadership
      when: Aug. 20
      date: '1967-08-20'
      thread: china-leadership
      c: 'The Center, State Council, Military Commission and Group issue, Mao having read and agreed, the rules on further thrift, controlling collective buying power, and the management of funds, goods and prices.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 20, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-20.china-leadership-2
      when: Aug. 20, 28; Sept. 5
      date: '1967-08-20'
      thread: china-leadership
      c: 'Mao three times reads and revises the article by Yao Wenyuan and his Shanghai writing group, "The Ugly Soul of a Revisionist: On the Reactionary Essence of *Ideals, Sentiments, Spiritual Life* and *Thought, Feeling, Style*" (Tao Zhu''s two books of 1962 and 1964); "very good; publish in Peking"; "three articles against Liu in two or three months." He retitles it "On Two Books of Tao Zhu." Where it speaks of the "Peking May 16 Red Guard Regiment," he adds that it dares not show itself, hiding underground in Peking for months, and sticks leaflets by night; the masses will find out who it is. He cuts the paragraph that "working-people intellectuals" is nonsense.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 20, 1967. Made public: 2013. Names: Mao Zedong, Yao Wenyuan, Tao Zhu, Liu Shaoqi.'
      tags: [name:mao-zedong, name:yao-wenyuan, name:tao-zhu, name:liu-shaoqi, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-22.china-leadership
      when: Aug. 22
      date: '1967-08-22'
      thread: china-leadership
      c: 'Zhou Enlai tells Guangzhou''s two delegations in Peking: do not say again "the handful in the army"; it was an error of the propaganda organs after the July 20 incident, and Mao criticized it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 22, 1967. Made public: 2013. Names: Zhou Enlai, Mao Zedong.'
      tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-22.china-leadership-2
      when: Aug. 22
      date: '1967-08-22'
      thread: china-leadership
      c: 'Night. Foreign-affairs rebels and some Red Guard bodies in Peking storm and burn the British chargé''s office, the gravest breach of the law in foreign dealings since 1949.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 22, 1967. To check: the day''s Xinhua and British accounts.'
      tags: [polity:prc]
- add:
    entry:
      id: cal.1967-08-25.china-leadership
      when: Aug. 25
      date: '1967-08-25'
      thread: china-leadership
      c: 'Mao reads the Center, State Council, Military Commission and Group''s "Call to Hold Up the Army and Cherish the People": "very good, issue." A mass movement of supporting the army and cherishing the people; new compacts; trust and rely on the masses, the army and most cadres; the army firmly backs the revolutionary left and the Red Guards; the people help the "three supports, two armies" work; open mass self-criticism on both sides.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 25, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-25.china-leadership-2
      when: Aug. 25–26
      date: '1967-08-25'
      thread: china-leadership
      c: 'Shanghai. Mao twice hears Yang Chengwu, sent back by Zhou Enlai: Wang Li''s Aug. 7 talk to incite seizure of the Foreign Ministry; Guan Feng''s draft of the Aug. 1 *Hongqi* editorial urging "pull out the handful in the army." Mao: Wang Li''s talk is "a great, great, great poisonous weed"; Wang, Guan and Qi Benyu wreck the Cultural Revolution, not good men; "report to the Premier only; arrest them; Zhou to handle." On Qi: a serious error, to be criticized, a time limit, see whether he mends. On the 26th noon Yang returns and tells Zhou; Wang Li and Guan Feng are then isolated for examination; Qi Benyu in Jan. 1968.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 25, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zhou Enlai, Wang Li, Guan Feng, Qi Benyu.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-08-29.china-leadership
      when: Aug. 29
      date: '1967-08-29'
      thread: china-leadership
      c: 'Afternoon, Hongqiao guesthouse. Mao hears Yang Chengwu on the Group''s meeting of Aug. 25. On Wang Li''s Aug. 7 talk: "I could not say such things; I did not tell him to run the Foreign Ministry." Who is to handle propaganda and foreign affairs: "the first way better; Yao Wenyuan to take over; prepare a time." The Foreign Ministry cadres'' files to be looked at and kept: "they have perhaps done it." Zhou is not well: sleep more, no long meetings. On those who would bring down the Heilongjiang revolutionary committee: "no."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 29, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Wang Li, Yao Wenyuan, Zhou Enlai.'
      tags: [name:mao-zedong, name:yao-wenyuan, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-01.china-leadership
      when: Sept. 1
      date: '1967-09-01'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Mao, Lin Biao and Zhou Enlai cable Hồ Chí Minh and others on the DRV''s 22nd anniversary: U.S. imperialism''s defeat in Vietnam is because its war is naked aggression; the Vietnamese have used the people''s war and set a model, after the Second World War, of one country alone fighting and beating the aggression of U.S. imperialism.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 1, 1967. Names: Mao Zedong, Lin Biao, Zhou Enlai, Hồ Chí Minh.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:ho-chi-minh, polity:prc, polity:drv]
- add:
    entry:
      id: cal.1967-09-04.china-leadership
      when: Sept. 4
      date: '1967-09-04'
      thread: china-leadership
      c: 'Shanghai. Mao hears Yang Chengwu on the Group''s recent meetings and work. On the rebels'' wish to bring down Xu Shiyou: the first count against Xu is wrong, he never opposed me. On the planned order against seizing guns: "good."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 4, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Xu Shiyou.'
      tags: [name:mao-zedong, name:xu-shiyou, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-05.china-leadership
      when: Sept. 5
      date: '1967-09-05'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s draft of Sept. 4, an order of the Center, State Council, Military Commission and Group on not seizing the PLA''s arms, equipment and military goods: "seen; do it." Four articles; breakers to be punished as breakers of the national law. Issued that day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 5, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-07.china-leadership
      when: Sept. 7
      date: '1967-09-07'
      thread: china-leadership
      c: 'Mao reads Qi Benyu''s letter of Sept. 4 of self-criticism: "Seen; returned to Qi Benyu. Some errors are useful; they bring deep thought and correction. When you can, tell Guan and Wang." Qi writes that Guan Feng and Wang Li made very grave errors, "left" adventurism; his own part in the Foreign Ministry matter relates to Wang Li''s.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 7, 1967. Made public: 2013. Names: Mao Zedong, Qi Benyu, Guan Feng, Wang Li.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-09.china-leadership
      when: Sept. 9
      date: '1967-09-09'
      thread: china-leadership
      c: 'Evening, Hongqiao guesthouse. Mao to Yang Chengwu, Zhang Chunqiao and Yu Lijin on the Cultural Revolution''s outlook: two ends, better yet, or a nation divided into two great camps irreconcilable, as in Nanjing and Wuxi, Peking, and everywhere; if not united, would the country, as after 1911, fall into long disorder? They think it improbable, and give five reasons. Of the first, "Chairman Mao''s high prestige and Mao Zedong Thought": speak of the thought, not the man, "too much of it and you will pay." He has read Lin Biao''s talk of Aug. 9 and its two points.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 9, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zhang Chunqiao, Yu Lijin, Lin Biao.'
      tags: [name:mao-zedong, name:zhang-chunqiao, name:lin-biao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-13.china-leadership
      when: Sept. 13
      date: '1967-09-13'
      thread: china-leadership
      c: 'Mao reads the Center, State Council, Military Commission and Group''s drafts of the notice on autumn harvest, sowing and plowing and of the notice forbidding looting of state goods, storming of storehouses and securing state property: "do it."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 13, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-13.china-leadership-2
      when: Sept. 13
      date: '1967-09-13'
      thread: china-leadership
      c: 'Mao twice reads Lin Biao''s talk of Aug. 9 to Zeng Siyu and Liu Feng. Sept. 13: "read, changed some; send it down." Oct. 11: "kept long; read a second time, a small change; ask Zhou, Boda and Kang Sheng to read; put a Center heading on it and issue." He strikes every mention of Chen Zaidao by name; strikes "this is a great development of Marxism" after the line on the main contradiction; and a passage that all earlier revolutions began in haste (Autumn Harvest, land revolution, the landlord, Chiang, Japan).'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 13, 1967 and Oct. 11, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zeng Siyu, Liu Feng, Chen Zaidao, Zhou Enlai, Chen Boda, Kang Sheng.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:chen-boda, name:kang-sheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-16.china-leadership
      when: Sept. 16
      date: '1967-09-16'
      thread: china-leadership
      c: 'Mao leaves Shanghai by train in the morning for Hangzhou. At noon he talks with the 20th Army''s commissar Nan Ping and the Air Force 5th Army''s commissar Chen Liyun, Yang Chengwu, Zhang Chunqiao, Yu Lijin and Wang Dongxing present. A year gone, the second three months; in July, August, September ten more provinces'' matters remain; by the Spring Festival the country will have an outline. Factions: two sides in one factory, one school, one family; each has a backer. The army has had two styles: democratic, with officers and men close; and the other, scolding, aloof, no democracy.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 16, 1967. Made public: 2013. Names: Mao Zedong, Nan Ping, Chen Liyun, Yang Chengwu, Zhang Chunqiao, Yu Lijin, Wang Dongxing. Check: the day Mao left Shanghai and the day of the talk are both "9月16日"; the nianpu says the talk was "中午," on the train.'
      tags: [name:mao-zedong, name:zhang-chunqiao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-17.china-leadership
      when: Sept. 17
      date: '1967-09-17'
      thread: china-leadership
      c: 'Nanchang. Mao, on his train in the morning, talks with Cheng Shiqing, Yang Dongliang and others of Jiangxi, Yang Chengwu, Zhang Chunqiao and others present: by education, not by the sword; the army''s and local bodies'' cadres mostly good though some err; more cadres to stand forth in Jiangxi; the rebels'' revenge is bad; "no punishment without teaching, none after it"; criticize the ultra-left of "doubt everything"; few, but with much power, tied to bad men in society. Unite the majority.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 17, 1967. Made public: 2013. Names: Mao Zedong, Cheng Shiqing, Yang Dongliang, Yang Chengwu, Zhang Chunqiao.'
      tags: [name:mao-zedong, name:zhang-chunqiao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-18.china-leadership
      when: Sept. 18
      date: '1967-09-18'
      thread: china-leadership
      c: 'Changsha. Mao hears Li Yuan, Hua Guofeng and Zhang Boseng of Hunan on its state, Yang Chengwu, Zhang Chunqiao and others present. Both sides workers, one "left," one "conservative"; "I still cannot see it"; the more they are pressed the more they resist; the rebels at schools must learn policy too; the "center" is that which the masses recognize in the struggle, not self-named. Clearing cadres needs a mass movement, which turns back at its time; most must be educated; blows too wide are bad. Each side to criticize itself, not the other: the army''s own way.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 18, 1967. Made public: 2013. Names: Mao Zedong, Li Yuan, Hua Guofeng, Zhang Boseng, Yang Chengwu, Zhang Chunqiao.'
      tags: [name:mao-zedong, name:hua-guofeng, name:zhang-chunqiao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-19.china-leadership
      when: Sept. 19
      date: '1967-09-19'
      thread: china-leadership
      c: 'Wuhan, on the train in the morning. Mao to Zeng Siyu and Liu Feng: the July 20 incident could have been avoided; Wang Li lit a fire at the Water and Power Institute, backed one side and beat the other, set the "Million Heroes" against several "steel" bodies, and the people suffered; the army regions, sub-districts and county armed departments were stormed. Bring together the key cadres of the independent divisions, sub-districts and county armed departments, and win them over; the Zhengzhou men have a strategic place: Hubei and Henan hold a hundred million, the Central Plain, the Yangtze and the Peking-Guangzhou line.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 19, 1967. Made public: 2013. Names: Mao Zedong, Zeng Siyu, Liu Feng, Wang Li.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-19.china-leadership-2
      when: Sept. 19
      date: '1967-09-19'
      thread: china-leadership
      c: 'Evening, East Lake guesthouse. Mao to Yang Chengwu, Zhang Chunqiao, Yu Lijin and Wang Dongxing: to free a lot of cadres and use some boldly; most are good. On the Ninth Congress: to be held, he hopes, next autumn, or at the latest in Jan. 1969; the Central Committee is to be enlarged with "fresh blood," and so are the delegates. On Liu Shaoqi and Deng Xiaoping: "I think there should be a difference; Deng fought; may he be a member? Do you agree?" He Long, he thinks, should perhaps be elected, "the head of the Second Front Army." Party organs and government organs should be cut down and slim; whether to call a National People''s Congress, and when; whether the revolutionary committee and the Party organ should be one body or two: think it over.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 19, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zhang Chunqiao, Yu Lijin, Wang Dongxing, Liu Shaoqi, Deng Xiaoping, He Long.'
      tags: [name:mao-zedong, name:zhang-chunqiao, name:liu-shaoqi, name:deng-xiaoping, name:he-long, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-20.china-leadership
      when: Sept. 20
      date: '1967-09-20'
      thread: china-leadership
      c: 'Evening, East Lake guesthouse. Mao to Zeng Siyu, Liu Feng, Fang Ming and Zhang Chunqing: on the "Million Heroes," Wang Li and others hurried to the masses to take sides before the troops were told and made ready, took a wrong tilt and stirred a wasps'' nest; do not squeeze the "Million Heroes" so hard, most of them are good; do not squeeze the independent division, its men were taken in; always leave a way out for those who erred, Chen Zaidao too. No one has authorized the "jet plane," the placards, the tall hats; the Red Guards even quote his *Hunan Report* but that was meant for local tyrants. To train army cadres: nothing for eighteen years, my fault as Military Commission chairman.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 20, 1967. Made public: 2013. Names: Mao Zedong, Zeng Siyu, Liu Feng, Fang Ming, Zhang Chunqing, Chen Zaidao, Wang Li.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-21.china-leadership
      when: Sept. 21
      date: '1967-09-21'
      thread: china-leadership
      c: 'Morning, East Lake guesthouse. Mao to Yang Chengwu: the three months July–September moved fast; the country''s Cultural Revolution is "greatly good, not merely good"; better than at any time; by the Spring Festival the country will be about settled; the Cultural Revolution ends next spring, "it cannot be done again." He leaves Wuhan by train.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 21, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-22.china-leadership
      when: Sept. 22
      date: '1967-09-22'
      thread: china-leadership
      c: 'Zhengzhou, on the train, morning. Mao hears Liu Jianxun, Ji Dengkui and Wang Xin of Henan: the slogan to "pull out the handful in the army" is wrong.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 22, 1967. Made public: 2013. Names: Mao Zedong, Liu Jianxun, Ji Dengkui, Wang Xin.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-23.china-leadership
      when: Sept. 23
      date: '1967-09-23'
      thread: china-leadership
      c: 'Mao returns to Peking. The Center, State Council, Military Commission and Group issue, on his approval, the urgent notice that students away from home and petitioners at Peking return at once to their own units; from Sept. 28 all reception offices stop receiving travelers; liaison offices are closed by Sept. 28.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 23, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-24.china-leadership
      when: Sept. 24
      date: '1967-09-24'
      thread: china-leadership
      c: 'Mao calls Zhou Enlai and others and speaks of the Ninth Congress: the successor is of course Lin Biao; Liu Shaoqi and Deng Xiaoping to be told apart.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 24, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao, Liu Shaoqi, Deng Xiaoping.'
      tags: [name:mao-zedong, name:zhou-enlai, name:lin-biao, name:liu-shaoqi, name:deng-xiaoping, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-28.china-leadership
      when: Sept. 28–30
      date: '1967-09-28'
      thread: china-leadership
      c: 'Mao twice reads the editorial of the *Renmin ribao*, *Hongqi* and *Jiefangjun bao* for the 18th National Day, "Long Live the Victory of the Cultural Revolution Under Proletarian Dictatorship." Sept. 28: "usable; cite some of Lenin, and mention Marxism-Leninism often." The revised text quotes Lenin: revolution is the festival of the oppressed and exploited, and the dictatorship of the proletariat the new class''s boldest and most merciless battle with a stronger enemy.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 28, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-29.china-leadership
      when: Sept. 29
      date: '1967-09-29'
      thread: china-leadership
      c: 'Mao reads Lin Biao''s draft National Day speech: "returned to Lin; very good, sweeping, solid, not boastful; a summing-up article for the year''s struggle." It says: Chairman Mao has just told us, fight self, criticize revisionism. Printed Oct. 2. Afternoon: Mao calls Zhou Enlai and others on the Ninth Congress.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 29, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-09-30.china-leadership
      when: Sept. 30
      date: '1967-09-30'
      thread: china-leadership
      c: 'Great Hall. Mao receives the Albanian party and government delegation under Mehmet Shehu, on the Cultural Revolution, Zhou Enlai, Kang Sheng and Liu Ningyi present. From the first half of 1966 to Feb. 1967 he took the outlook more gravely: a first possibility, defeat; a second, victory. Now the first is victory, though prepare for both. Part of China''s work is passable and part bad; were all well, why a Cultural Revolution? There is a dark side to change. Last summer those for the Revolution were the minority; workers were not up; students were pressed, the left could not stand, the Red Guards were just breaking free. Now workers have risen and the revolutionaries are in the majority in most provinces.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 30, 1967. Made public: 2013. Names: Mao Zedong, Mehmet Shehu, Zhou Enlai, Kang Sheng, Liu Ningyi.'
      tags: [name:mao-zedong, name:zhou-enlai, name:kang-sheng, polity:prc]
- add:
    entry:
      id: cal.1967-10-01.china-leadership
      when: Oct. 1
      date: '1967-10-01'
      thread: china-leadership
      c: 'Tiananmen, 10 a.m. Mao, with Lin Biao, Zhou Enlai and other leaders, at the rally of the PRC''s 18th anniversary and the march; at night, on the gate tower, the fireworks.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1967. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1967-10-03.china-leadership
      when: Oct. 3
      date: '1967-10-03'
      thread: china-leadership
      c: 'Great Hall, room 118. Mao receives the Congo (Brazzaville) government delegation under Prime Minister Noumazalay, Zhou Enlai, Li Xiannian and Xu Yixin present, on the Cultural Revolution. Anarchism has grown too; better exposed, so that we can teach. Some Red Guards strike blindly, want to bring down Chen Yi, Zhou Enlai and Li Xiannian, which is wrong; those cadres are to be protected. Of officials: rank up, pay up, a better house, a car: all well, only no bureaucratic airs; "I ask one thing of you: put away the official''s airs."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 3, 1967. To check: Xinhua''s report. Names: Mao Zedong, Noumazalay, Zhou Enlai, Li Xiannian, Xu Yixin, Chen Yi.'
      tags: [name:mao-zedong, name:zhou-enlai, name:li-xiannian, name:chen-yi, polity:prc, polity:congo]
- add:
    entry:
      id: cal.1967-10-05.china-leadership
      when: Oct. 5
      date: '1967-10-05'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Great Hall, room 118, afternoon. Mao receives the DRV party and government delegation under Lê Thanh Nghị and Hoàng Văn Hoan, and the National Liberation Front''s under the war hero Huang Wendan (so in the nianpu), Lin Biao, Zhou Enlai, Nie Rongzhen, Yang Chengwu and Su Yu present. "You are facing the world''s first imperialism; as you say, in the end you will win. Make it a long war: that is what the Americans fear."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 5, 1967. Made public: 2013. Names: Mao Zedong, Lê Thanh Nghị, Hoàng Văn Hoan, Lin Biao, Zhou Enlai, Nie Rongzhen, Yang Chengwu, Su Yu. Check: the NLF delegation head''s Vietnamese name (the nianpu''s 黄文旦); note 124 names Lê Thanh Nghị and Hoàng Văn Hoan.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:nie-rongzhen, polity:prc, polity:drv, vis:only:prc+drv]
- add:
    entry:
      id: cal.1967-10-07.china-leadership
      when: Oct. 7
      date: '1967-10-07'
      thread: china-leadership
      c: 'Mao reads, and slightly alters, the Center''s draft notice printing "Chairman Mao''s Important Instructions on His Inspection of North, Central-South and East China," the notes of his talks July 14–Sept. 23, which it issues that day: the situation "greatly good, not merely good"; "the confusion fooled the enemy and steeled the masses"; unite in great alliances; "among the working class there is no basic conflict of interest."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 7, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-10-09.china-leadership
      when: Oct. 9
      date: '1967-10-09'
      thread: china-leadership
      c: 'Mao reads Chen Boda''s and Jiang Qing''s request of that day to pick *Liu Shaoqi''s Remarks* and the draft "Publishers'' Note": he changes the clause "he and Deng Xiaoping, another of the Party''s greatest capitalist-roaders" to "he and some other capitalist-roaders," and strikes Deng''s name from another place. "To Lin and Zhou, then to Chen: leave Deng Xiaoping out of the Note; whether the publisher is to be named, settle at a meeting." The three volumes appear as *The Counter-Revolutionary Revisionist Remarks of China''s Khrushchev, Liu Shaoqi*, "the People''s Publishing House data room," internal.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 9, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Jiang Qing, Liu Shaoqi, Deng Xiaoping, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:chen-boda, name:jiang-qing, name:liu-shaoqi, name:deng-xiaoping, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-10-12.china-leadership
      when: Oct. 12
      date: '1967-10-12'
      thread: china-leadership
      c: 'Evening, Great Hall. Mao again receives the Albanian delegation under Mehmet Shehu, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng and Li Fuchun present. Since late September the great alliances grow and the unalliance few; the settlement still needs months, a year and a half in all, three years planned, since June 1 a year. Where disorder is worst it is easier; where indifferent, harder. Of the officials: the new governments mean a great test; high pay, rank, house, car, and they stop being revolutionary and become officials; "we are helpless; this time good; the masses sort them out." It is not Liu Shaoqi''s work alone.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 12, 1967. Made public: 2013. Names: Mao Zedong, Mehmet Shehu, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Li Fuchun, Liu Shaoqi.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:li-fuchun, name:liu-shaoqi, polity:prc]
- add:
    entry:
      id: cal.1967-10-13.china-leadership
      when: Oct. 13–14
      date: '1967-10-13'
      thread: china-leadership
      c: 'Mao calls Zhou Enlai and others on the Ninth Congress''s political report and the choice of delegates.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 13, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-10-14.china-leadership
      when: Oct. 14
      date: '1967-10-14'
      thread: china-leadership
      c: 'The Center, State Council, Military Commission and Group issue the notice that all colleges, middle and primary schools reopen at once, carry out Mao''s "fight self, criticize revisionism," teach as they reform, form great alliances, set up three-in-one leaderships and prepare enrollment.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 14, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-10-17.china-leadership
      when: Oct. 17
      date: '1967-10-17'
      thread: china-leadership
      c: 'The Center, State Council, Military Commission and Group issue the notice on forming great alliances by trades and systems, with a passage of Mao''s: every factory, school, department and unit to form great revolutionary alliances by trade, line, class, in revolutionary principle. The *Renmin ribao* prints the passage Oct. 19.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 17, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-10-20.china-leadership
      when: Oct. 20
      date: '1967-10-20'
      thread: china-leadership
      c: 'Mao reads Chen Boda''s and Yao Wenyuan''s draft *Renmin ribao* editorial "Carry Out Chairman Mao''s Cadre Policy Correctly": "usable." It quotes his recent instruction: to treat cadres rightly is the key to three-in-one, to strengthening the great alliance, to fight, criticize, reform in each unit. Printed Oct. 21.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 20, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Yao Wenyuan.'
      tags: [name:mao-zedong, name:chen-boda, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-10-21.china-leadership
      when: Oct. 21
      date: '1967-10-21'
      thread: china-leadership
      c: 'The Center and the Group issue a notice asking opinions on the Ninth Congress: when to hold it and how to prepare it, as Mao lately raised. Party committees of every place and department to inquire and report to the Center.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 21, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-10-23.china-leadership
      when: Oct. 23
      date: '1967-10-23'
      thread: china-leadership
      c: 'Morning. Mao receives the Mauritanian Islamic Republic delegation under President Moktar Ould Daddah, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng and Li Fuchun present. He asks closely after Mauritania; relations to grow; if they keep it up they can stand and set an example to Africa. Noon: he receives the Japanese Haguruma-za troupe.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 23, 1967. To check: Xinhua''s report. Names: Mao Zedong, Moktar Ould Daddah, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Li Fuchun.'
      tags: [name:mao-zedong, name:daddah-moktar-ould, name:lin-biao, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:li-fuchun, polity:prc]
- add:
    entry:
      id: cal.1967-10-24.china-leadership
      when: Oct. 24
      date: '1967-10-24'
      thread: china-leadership
      c: 'Mao reads the Qinghai Party core group''s telegram of Oct. 19 to the Center and the Group asking to restore Party life: "To the Group: discuss and answer, and send to the localities to follow." On "may Party life be restored," he writes "should be so." On Oct. 26 Zhang Chunqiao tells Liu Xianquan by telephone that the units with revolutionary committees may restore Party life, but the matter is large: how to "restore"; whether all old members take part; leadership organs first or all together.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 24, 1967. Made public: 2013. Names: Mao Zedong, Zhang Chunqiao, Liu Xianquan.'
      tags: [name:mao-zedong, name:zhang-chunqiao, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-10-25.china-leadership
      when: Oct. 25
      date: '1967-10-25'
      thread: china-leadership
      c: 'Mao reads Nie Rongzhen''s report of Sept. 20 on altering and reorganizing the defense research system: "kept long; read today; very good; do it." The Center, State Council, Military Commission and Group send it out Nov. 9: the defense units taken over into several academies; more trial-making and processing capacity; military control carried out in steps, the whole by the first half of 1968.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 25, 1967. Made public: 2013. Names: Mao Zedong, Nie Rongzhen.'
      tags: [name:mao-zedong, name:nie-rongzhen, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-03.china-leadership
      when: Nov. 3
      date: '1967-11-03'
      thread: china-leadership
      c: 'Mao reads the sixth draft of the editorial of the *Renmin ribao*, *Hongqi* and *Jiefangjun bao* for the 50th anniversary of the October Revolution, "March Forward Along the Road the October Socialist Revolution Opened": "revised well; usable." Chen Boda and Yao Wenyuan: the "six points on the Chairman''s thought" are newly put in order; they say: the contradiction between classes goes on in the socialist stage; the bourgeois restoration is a danger; the struggle is power again.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 3, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Yao Wenyuan.'
      tags: [name:mao-zedong, name:chen-boda, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-05.china-leadership
      when: Nov. 5
      date: '1967-11-05'
      thread: china-leadership
      c: 'Mao to the Group''s liaison meeting on the Ninth Congress and rectification. First reports on it can be put together and sent round for more; the views on rectification too. A year and more of fighting has brought out many bad men; "we must fight out a party." Rectification cannot be finished before the Congress; after it, by the new program and rules, rectify and build further. Members must be lively; the lifeless need not apply. Admit workers, poor peasants, Red Guard activists; "the old blood has too much carbon dioxide."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 5, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-05.china-leadership-2
      when: Nov. 5
      date: '1967-11-05'
      thread: china-leadership
      c: 'Mao to Kang Sheng and Yang Chengwu: on the article printed Nov. 3 in the *Renmin ribao* over Yang''s name, "Raise High the Absolute Authority of the Great Commander Chairman Mao..." "I read only the headline, not the text; by the headline it is wrong, metaphysical. That is Chen Boda''s matter, not yours." Kang and Yang tell the Group''s liaison meeting. The article was written by the "General Staff''s proletarian revolutionaries" and revised by Chen Boda.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 5, 1967. Made public: 2013. Names: Mao Zedong, Kang Sheng, Yang Chengwu, Chen Boda.'
      tags: [name:mao-zedong, name:kang-sheng, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-07.china-leadership
      when: Nov. 7
      date: '1967-11-07'
      thread: china-leadership
      c: 'Mao reads the Group''s *Kuaibao* no. 5290 of Nov. 5, "Chen Yonggui on the Cultural Revolution in the Villages": "To Boda and the Group: may go to the villages." Chen: the aim is the handful in the Party on the capitalist road and their black hounds in the provinces, prefectures, counties; not the grass-roots cadres; not to bring down all; where revolutionary committees exist, the county and commune lead; rely on the poor and lower-middle peasants. He strikes Liu''s, Deng''s and Tao''s names after "the Party''s biggest handful on the capitalist road" in the Center''s notice forwarding it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 7, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda, Chen Yonggui, Liu Shaoqi, Deng Xiaoping, Tao Zhu.'
      tags: [name:mao-zedong, name:chen-boda, name:liu-shaoqi, name:deng-xiaoping, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-07.china-leadership-2
      when: Nov. 7
      date: '1967-11-07'
      thread: china-leadership
      also: [soviet-union]
      c: 'Mao reads Zhou Enlai''s draft of that day for the 50th anniversary of the October Revolution, a telegram to the Supreme Soviet''s Presidium and the Council of Ministers. Zhou: in the name of the Standing Committee of the National People''s Congress and the State Council only, to congratulate the Soviet people; not again in the Party''s name. Mao: "do it."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 7, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-09.china-leadership
      when: Nov. 9
      date: '1967-11-09'
      thread: china-leadership
      c: 'Mao reads the Center''s draft instruction on the Cultural Revolution in village grass roots for this winter and spring: "do it." Adds "only in some parts hit by disaster, or in the hands of capitalist-roaders and landlords, rich peasants, counter-revolutionaries, bad elements and rightists, is it not good"; strikes Liu''s, Deng''s and Tao''s names; the three-level ownership with the team the base, and the private plots, to stay; production teams generally not to seize power. Issued Dec. 4.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 9, 1967. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Tao Zhu.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:deng-xiaoping, name:tao-zhu, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-12.china-leadership
      when: Nov. 12
      date: '1967-11-12'
      thread: china-leadership
      c: 'The Center, State Council, Military Commission and Group issue, Mao having read and agreed, the decision on Guangdong: a preparatory group for the Guangdong revolutionary committee of Huang Yongsheng, Chen Yu, Kong Shiquan, Wang Shoudao, Chen De and representatives of the great-alliance mass bodies. The same day, the notice on the ten-article agreement for a great alliance reached by Guangxi''s two sides in Peking on Nov. 8.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 12, 1967. Made public: 2013. Names: Mao Zedong, Huang Yongsheng, Chen Yu, Kong Shiquan, Wang Shoudao, Chen De.'
      tags: [name:mao-zedong, name:huang-yongsheng, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-15.china-leadership
      when: Nov. 15
      date: '1967-11-15'
      thread: china-leadership
      c: 'Mao reads Yunnan military control commission''s report of Nov. 11 to the Military Commission and Group on carrying out the call to hold study classes in Mao''s thought: "To the Group and the liaison meeting: suggest sending it round; short and to the point, it gets at the heart. Discuss and decide." Gains: the petty-bourgeois faction, mountaintopism and small-group thinking much checked, the great alliance helped; the release of revolutionary cadres better grasped.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 15, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-15.china-leadership-2
      when: Nov. 15
      date: '1967-11-15'
      thread: china-leadership
      c: 'Mao reads the Beijing Knitting Mill revolutionary committee''s notice of Nov. 11 on its founding, and the Unit 8341''s report of the 13th on its support of industry: "seen, very good; thanks, comrades!" The Center sends them round on Nov. 17.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 15, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-16.china-leadership
      when: Nov. 16
      date: '1967-11-16'
      thread: china-leadership
      c: 'Mao reads the Group''s *Kuaibao* no. 5414, "The Jiangxi Preparatory Group Heeds Method": "To Yao Wenyuan: the four experiences of Jiangxi may be sent to all places; settle with the comrades." On the third (send many Mao Zedong Thought propaganda teams to factories and villages), he notes: "this exists in very many places in the country." Nov. 17 the Center, Military Commission and Group pass the Jiangxi experiences on.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 16, 1967. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags: [name:mao-zedong, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-18.china-leadership
      when: Nov. 18
      date: '1967-11-18'
      thread: china-leadership
      c: 'The Center, State Council, Military Commission and Group issue, Mao having read and agreed, the decision on Guangxi: a preparatory group for the Guangxi Zhuang Autonomous Region revolutionary committee of Wei Guoqing, An Pingsheng and others, with representatives of the revolutionary mass bodies.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 18, 1967. Made public: 2013. Names: Mao Zedong, Wei Guoqing, An Pingsheng.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-20.china-leadership
      when: Nov. 20
      date: '1967-11-20'
      thread: china-leadership
      c: 'Mao reads the *Renmin ribao*, *Jiefangjun bao* and *Hongqi* editors'' article "The Struggle of the Two Roads in China''s Villages": "seen, usable; the material quoted must be checked true." Printed Nov. 23.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 20, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-22.china-leadership
      when: Nov. 22
      date: '1967-11-22'
      thread: china-leadership
      c: 'Mao reads Yao Wenyuan''s report of Nov. 21 on a difference between Nan Ping and Chen Liyun, heads of the Zhejiang military control, over uniting the Zhejiang "Red Storm" bodies: "To Lin and Zhou: Zhejiang''s ''Red Storm'' is not like Hubei''s ''Million Heroes''; it is an old rebel body that has erred and has many masses; Yao Wenyuan''s view is right, to help, criticize and unite. Discuss and settle." Nan holds to teach and unite the erring rebels; Chen to hold back to keep the rebel ranks pure. On Dec. 2 the Center and the Group issue the notice on treating rightly those rebels who erred.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 22, 1967. Made public: 2013. Names: Mao Zedong, Yao Wenyuan, Nan Ping, Chen Liyun, Lin Biao, Zhou Enlai.'
      tags: [name:mao-zedong, name:yao-wenyuan, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-27.china-leadership
      when: Nov. 27
      date: '1967-11-27'
      thread: china-leadership
      c: 'Mao reads the Center''s Liaison Department''s paper of Nov. 25 on Anzai Kuji and two others of the Japanese left review *Kakumei senshi* (Revolutionary Fighter): they cannot see why comrades back from China say Japan must follow the road of surrounding the cities from the villages; Chinese hints of it go against Mao Zedong Thought; to stress the world meaning of China''s way denies the October road from city to village. Mao: "To Kang Sheng: this deserves notice; I think Anzai is right. What is your view? Tell me." On Dec. 1 Yao Wenyuan conveys it to Anzai and the others.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 27, 1967. Made public: 2013. Names: Mao Zedong, Kang Sheng, Anzai Kuji, Yao Wenyuan.'
      tags: [name:mao-zedong, name:kang-sheng, name:yao-wenyuan, polity:prc, polity:japan, vis:only:prc]
- add:
    entry:
      id: cal.1967-11-30.china-leadership
      when: Nov. 30
      date: '1967-11-30'
      thread: china-leadership
      also: [laos]
      c: 'Great Hall, evening. Mao receives the Lao People''s Party delegation under Kaysone Phomvihan, to hear the Lao struggle against the Americans, Lin Biao, Zhou Enlai, Kang Sheng and Liu Ningyi present.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 30, 1967. Made public: 2013. Names: Mao Zedong, Kaysone Phomvihan, Lin Biao, Zhou Enlai, Kang Sheng, Liu Ningyi. Check: the party''s name (the nianpu''s 老挝人民党, the Lao People''s Party).'
      tags: [name:mao-zedong, name:kaysone-phomvihan, name:lin-biao, name:zhou-enlai, name:kang-sheng, polity:prc, polity:laos, vis:only:prc+pathet-lao]
- add:
    entry:
      id: cal.1967-12-01.china-leadership
      when: Dec. 1
      date: '1967-12-01'
      thread: china-leadership
      c: 'Mao approves the Center''s directive creating Tianjin''s revolutionary committee: "very good, do it." Founded Dec. 6, with Xie Xuegong as head.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 1, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-02.china-leadership
      when: Dec. 2
      date: '1967-12-02'
      thread: china-leadership
      c: 'Mao reads Zhou Enlai''s and others'' draft of the Center and the Group, "Opinions and Questions on Putting the Party''s Organization in Order, Restored and Rebuilt," and changes "within half a month" in "send opinion within half a month" to "before New Year''s Day."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 2, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-05.china-leadership
      when: Dec. 5
      date: '1967-12-05'
      thread: china-leadership
      c: 'Mao approves with his circle Zhou Enlai''s draft of the same day, the two pacts of the two sides at the Zhengzhou and Xi''an railway bureaus on a great alliance, and the Center''s note forwarding them: let the other railway systems make similar pacts to keep the trains running.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 5, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-06.china-leadership
      when: Dec. 6
      date: '1967-12-06'
      thread: china-leadership
      c: 'Mao reads the Group''s *Chairman Mao on the Revolution in Education* (Nov.) and revises it in many places: of Confucius''s birth, "of a decayed slave-owning aristocracy, never went to middle school or college; he began by arranging funerals for others, a piper; later he held a private school and opposed students'' labor"; on Buddhist sutras the cut of the Diamond Sutra passage. "To Chen Boda: a few changes; read it through, and if you think right, print."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 6, 1967. Made public: 2013. Names: Mao Zedong, Chen Boda.'
      tags: [name:mao-zedong, name:chen-boda, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-10.china-leadership
      when: Dec. 10
      date: '1967-12-10'
      thread: china-leadership
      c: 'Mao circles Zhou Enlai''s draft of that day of the decision of the Center, State Council, Military Commission and Group on putting public security organs under military control. The decision is dated Dec. 9.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 10, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-17.china-leadership
      when: Dec. 17
      date: '1967-12-17'
      thread: china-leadership
      c: 'Mao reads Hunan preparatory group''s request of Dec. 13: the statue of Mao at Shaoshan and the railway to Shaoshan are nearly done, the people want a grand opening on Dec. 26, his 74th birthday; they ask him to inscribe "Shaoshan station," Lin Biao and Zhou to write for the statue. The meeting''s title: "completion of the statue and opening of the railway" or "birthday celebration"? Mao''s reply is not given.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 17, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai. Check: the nianpu does not give Mao''s answer.'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-17.china-leadership-2
      when: Dec. 17
      date: '1967-12-17'
      thread: china-leadership
      c: 'Mao reads Yao Wenyuan''s draft of the Center, State Council, Military Commission and Group decision on military control of Xinhua; strikes three "boundless" and two "extremely" from item 3 of part 2 (a firm leadership core "boundlessly loyal to Chairman Mao," a news corps "extremely proletarian, extremely militant"): "I struck a few improper adjectives." Issued Dec. 18.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 17, 1967. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags: [name:mao-zedong, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-18.china-leadership
      when: Dec. 18
      date: '1967-12-18'
      thread: china-leadership
      c: 'Evening, Great Hall. Mao receives the Albanian-Chinese Friendship Association delegation under a Central Committee member and minister without portfolio (Pei Qi in the nianpu), Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Yang Chengwu and Wang Shusheng present, on the Cultural Revolution. We did not foresee that each office and place would split into two, nor large-scale armed fighting. A great examination of cadres by mass method; some good men may be wronged, none killed; if wrong, redressed later. The Cultural Revolution is a name for a political and economic revolution.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 18, 1967. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Yang Chengwu, Wang Shusheng. Check: the delegation head''s name (the nianpu''s 佩奇).'
      tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:chen-boda, name:kang-sheng, polity:prc]
- add:
    entry:
      id: cal.1967-12-19.china-leadership
      when: Dec. 19
      date: '1967-12-19'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Mao cables Nguyễn Hữu Thọ, president of the National Liberation Front''s Presidium, on the Front''s seventh anniversary: no state, large or small, with the people fully roused and resolutely relying on them in a people''s war, can fail to beat the strongest enemy; "the days of the American aggressors in Vietnam are not long"; "700 million Chinese are your strong rear, and China''s broad land your sure base."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 19, 1967. Names: Mao Zedong, Nguyễn Hữu Thọ.'
      tags: [name:mao-zedong, name:nguyen-huu-tho, polity:prc, polity:drv]
- add:
    entry:
      id: cal.1967-12-22.china-leadership
      when: Dec. 22
      date: '1967-12-22'
      thread: china-leadership
      also: [vietnam-hanoi]
      c: 'Great Hall, afternoon. Mao receives the Southern Vietnamese people''s delegation under Ruan Chunlong (so in the nianpu, vice-chairman of the Southern Vietnam Afro-Asian Solidarity Committee) and the National Liberation Front''s resident mission in China under Ruan Wenguang, Lin Biao, Zhou Enlai, Chen Boda and Kang Sheng present. The Front under Chairman Nguyễn Hữu Thọ is today''s government, the Saigon one is past, not trusted by its own; the Front has not the name, but is one; the question is the final victory, not whether; it is in sight though not in hand.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 22, 1967. Made public: 2013. Names: Mao Zedong, Nguyễn Hữu Thọ, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng. Check: the delegates'' names in Vietnamese (the nianpu''s 阮春龙 and 阮文广; notes 130, 131).'
      tags: [name:mao-zedong, name:nguyen-huu-tho, name:lin-biao, name:zhou-enlai, name:chen-boda, name:kang-sheng, polity:prc, polity:drv, vis:only:prc+drv]
- add:
    entry:
      id: cal.1967-12-22.china-leadership-2
      when: Dec. 22
      date: '1967-12-22'
      thread: china-leadership
      c: 'The Center, State Council, Military Commission and Group issue, Mao having read and agreed, the notice on the Cultural Revolution in the civil aviation system, with further military control.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 22, 1967. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-27.china-leadership
      when: Dec. 27
      date: '1967-12-27'
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s Dec. 27 request that the conditions for a Jiangxi revolutionary committee are ripe: "agreed; Liu Ruisen is to be joined in." On the same day he reads the Center, State Council, Military Commission and Group''s decision on Ningxia: "do it." It sets up a preparatory group for the Ningxia Hui Autonomous Region revolutionary committee, Kang Jianmin head.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 27, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Liu Ruisen, Kang Jianmin.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-29.china-leadership
      when: Dec. 29
      date: '1967-12-29'
      thread: china-leadership
      c: 'Morning. Mao reads Yao Wenyuan''s Dec. 28 draft of the three papers'' editorial for New Year 1968, "Welcome the All-Round Victory of the Great Proletarian Cultural Revolution": "seen; usable; a few boasting adjectives struck." He strikes "the red sun in the hearts of the world''s people" and "the highest level of Marxism-Leninism of our time."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 29, 1967. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags: [name:mao-zedong, name:yao-wenyuan, polity:prc, vis:only:prc]
- add:
    entry:
      id: cal.1967-12-29.china-leadership-2
      when: Dec. 29
      date: '1967-12-29'
      thread: china-leadership
      c: 'Afternoon. Mao calls Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao and others to settle the line for editing the *Selected Works* vol. 5: follow the form of the first four volumes, select articles of theory, policy, line and major matters, "those still of use; those of little use not." Some manuscripts later, not now. On the articles for vol. 6, to be published singly first: "first inside the Party."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 29, 1967. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao.'
