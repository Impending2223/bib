patch: 2026-11-11-b8-rusk
by: 'Claude (batch 8: Rusk, As I Saw It, the "already in" rows read against the calendar), Nov. 11, 2026'
ops:
- add:
    entry:
      id: cal.1962-11-29.cuba
      when: Nov. 29
      date: '1962-11-29'
      thread: cuba
      also: [soviet-union]
      c: 'Late Nov. Mikoyan, on his way home through Washington, to an American official: Castro "is crazy"; he kept Mikoyan "waiting for ten days without seeing me." Cuba: "We have been waiting all our lives for a country to go Communist without the Red Army, and it happened in Cuba. It makes us feel like boys again!"'
      n: '[[w.rusk-as-i-saw-it-1990]], 245 (told "one of our people"; Rusk''s account). See [[cal.1962-11-29.missile-crisis]]; [[cal.1962-11-03.cuba]]. Names: Mikoyan, Castro. Check: the day and the hearer; Rusk gives neither, only "on his way home"; Mikoyan was with Kennedy in Washington Nov. 29. Check: Rusk has Castro keep Mikoyan waiting ten days; the first meeting is dated Nov. 3.'
      tags: [name:mikoyan-anastas, name:castro-fidel]
- add:
    entry:
      id: cal.1968-03-30.vietnam
      when: Mar. 30
      date: '1968-03-30'
      thread: vietnam
      c: State cables the embassies the news of the partial bombing halt Johnson has approved.
      n: '[[w.rusk-as-i-saw-it-1990]], 482. See [[cal.1968-03-28.vietnam-205000]]. Names: Johnson. Check: the cable, its text and hour; Rusk gives the day and names no document.'
      tags: [name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1968-03-30.vietnam-2
      when: Mar. 30
      date: '1968-03-30'
      thread: vietnam
      c: Rusk leaves for Wellington, New Zealand, for a SEATO meeting.
      n: '[[w.rusk-as-i-saw-it-1990]], 482–83. See [[cal.1968-03-30.vietnam-205000]]. Names: Rusk. Check: the hour and the party; Rusk says SEATO, Clifford (521–22, by the note of the entry cited) says ANZUS.'
      tags: [name:rusk-dean]
- add:
    entry:
      id: cal.1968-03-30.elections-1968-johnson
      when: Mar. 30–31
      date: '1968-03-30'
      thread: elections-1968-johnson
      also: [vietnam]
      c: 'Rusk, flying to Wellington, is called from the White House about a "final paragraph" added to the address of Mar. 31: Johnson''s withdrawal. It comes as "no surprise."'
      n: '[[w.rusk-as-i-saw-it-1990]], 483. See [[cal.1968-03-31.elections-1968]]. Names: Rusk, Johnson. Check: the day, the hour and the caller; Rusk gives none.'
      tags: [name:rusk-dean, name:johnson-lyndon-b]
