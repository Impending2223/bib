    item: '[[w.rusk-as-i-saw-it-1990]], 462–63 (U Thant''s Rangoon initiative of the fall of 1964, Hanoi said by him to have "agreed" to meet there; no American reply for five months; not Ne Win, the day or Rusk''s answer; Stevenson''s word to Thant read otherwise, see the Check)'
    units: '?'
