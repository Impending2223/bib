- edit:
    id: cal.1964-07-17.elections-1964-johnson
    base: db04cb72
    set:
      n: '[[w.johnson-white-house-diary]], 182–83 (Lady Bird Johnson''s account). After [[cal.1964-07-17.program|the Library and the Trumans'' house]]: "Then we went with Mrs. Truman to their old-fashioned white house ... We drove back to the Muehlebach Hotel ... About 6:30 President and Mrs. Truman arrived at the Presidential Suite" ([[w.johnson-white-house-diary]], 181). Names: Truman, Lady Bird Johnson, Lynda Bird Johnson.'
