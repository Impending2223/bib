- edit:
    id: cal.1964-07-17.program
    base: 1f6b643b
    set:
      n: '[[w.johnson-white-house-diary]], 180–82 (Lady Bird Johnson''s account). After [[cal.1964-07-17.white-house|the guidebook]]: the day "began with the presentation of the one millionth copy of the White House guidebook"; then "Lynda, Simone Poulain of the press office, and I left for Friendship Airport" ([[w.johnson-white-house-diary]], 179). Names: Lady Bird Johnson, Truman, Lynda Bird Johnson.'
