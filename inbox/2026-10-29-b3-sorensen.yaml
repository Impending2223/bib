      when: Sept. 28
      date: '1962-09-28'
      thread: mississippi-ole-miss
      c: 'Sorensen, in the hospital, to the President, by memorandum: his suggestions on the crisis. Sept. 29, the President''s
        instructions to him for a possible television address.'
      n: '[[w.sorensen-kennedy]], 484. See [[cal.1962-09-27.mississippi]]. Names: Sorensen. Check: the memorandum, not found.'
      tags:
      - name:sorensen-theodore-c
      - name:kennedy-john-f
