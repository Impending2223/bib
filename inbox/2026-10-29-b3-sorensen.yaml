- add:
    entry:
      id: cal.1962-10-01.mississippi-ole-miss-2
      when: Oct. 1
      date: '1962-10-01'
      thread: mississippi-ole-miss
      c: 'Kennedy and Barnett by telephone, 12:14 and 1:45 a.m., the riot under way: the State police back. By Sorensen''s
        account, Kennedy: "Listen, Governor, somebody''s been shot down there already and it''s going to get worse. ... I
        want them back. Good-bye." Barnett agrees to send the two hundred troopers back.'
      n: '[Conversation with Ross Barnett, 12:14 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-1214-am),
        [cont.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-1214-am-cont);
        [1:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-145-am), [cont.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-145-am-cont)
        (Miller Center). [[w.sorensen-kennedy]], 486 (Kennedy''s words; Barnett''s agreement). See [[cal.1962-09-30.mississippi-ole-miss]].
        Names: Kennedy, Barnett. Check: the quoted words against the recordings, not heard.'
      tags:
      - name:kennedy-john-f
      - name:barnett-ross-r
      src:
        c: a1c78371
        rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-1214-am: A'
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-145-am: A'
        - 'w.sorensen-kennedy 486: B, C'
- add:
    entry:
      id: cal.1962-10-09.missile-crisis-2
      when: Oct. 9
      date: '1962-10-09'
      thread: missile-crisis
      c: 'Kennedy, whose authorization every U-2 flight needs, approves a mission over western Cuba: the SAMs there, seen
        first Aug. 29, the likeliest to be operational; and two convoy reports from inside Cuba of a possible medium-range
        missile site. Bad weather holds it to Oct. 14.'
      n: '[[w.sorensen-kennedy]], 672. See [[cal.1962-08-29.missile-crisis]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: d36861b5
        rows:
        - 'w.sorensen-kennedy 672: all'
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-3
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      c: 'The 506th NSC, 2:30 to 4:50 p.m. The third draft of the President''s speech read and revised: the numbers of missiles
        and sites out; "quarantine," not blockade, Rusk for it; the responsibility pinned on Khrushchev; no invitation to
        a summit. Anderson on the quarantine''s procedures. United Nations inspection of the missiles'' removal to be asked.'
      n: '[FRUS 1961–63, XI, doc. 38](https://history.state.gov/historicaldocuments/frus1961-63v11/d38) (the minutes). [[w.sorensen-kennedy]],
        698 (the meeting; the draft read; Anderson; the inspection). See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy,
        Rusk, Khrushchev, Anderson.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:khrushchev-nikita-s
      - name:anderson-george-w-jr
      src:
        c: 174d91a4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d38: all'
        - 'w.sorensen-kennedy 698: A, B, F, G'
