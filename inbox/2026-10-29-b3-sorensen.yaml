- add:
    entry:
      id: cal.1962-03-07.soviet-union-3
      when: Mar. 7
      date: '1962-03-07'
      thread: soviet-union
      c: 'Khrushchev, by private message, calls off the television exchange set for Mar. 25, to be filmed Mar. 8: offended
        by the address of Mar. 2 on resuming tests. Sorensen had begun the President''s script that day. By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 557–58. See [[cal.1962-03-02.testing]]. Names: Khrushchev, Sorensen. Check: the message,
        not found in FRUS.'
      tags:
      - name:khrushchev-nikita-s
      - name:sorensen-theodore-c
      src:
        c: fbce7950
        rows:
        - 'w.sorensen-kennedy 557–58: all'
