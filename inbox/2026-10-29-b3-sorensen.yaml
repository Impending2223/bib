- add:
    entry:
      id: cal.1961-08-31.testing-2
      when: Aug. 31
      date: '1961-08-31'
      thread: testing
      c: 'Kennedy with the National Security Council and the congressional leaders. The White House statement: the Soviet
        announcement "primarily a form of atomic blackmail, designed to substitute terror for reason"; the stockpile and the
        delivery systems "wholly adequate."'
      n: 'White House Statement Following the President''s Meeting With the National Security Council and Congressional Leaders
        on the Resumption of Nuclear Tests by the U.S.S.R, [1961 Pub. Papers 584](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=642)
        (Aug. 31, 1961). [[w.sorensen-kennedy]], 620. See [[cal.1961-08-30.testing]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: a8b90bd9
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=642: all'
        - 'w.sorensen-kennedy 620: all'
- add:
    entry:
      id: cal.1961-09-03.testing-2
      when: Sept. 3
      date: '1961-09-03'
      thread: testing
      c: Hyannis Port, Mass. Kennedy and Macmillan, by joint statement, propose to Khrushchev that the three governments agree,
        effective at once, to no tests in the atmosphere; existing means of detection enough; representatives to meet at Geneva
        by Sept. 9.
      n: 'Joint Statement With Prime Minister Macmillan Proposing a Three-Power Agreement To End Atmospheric Nuclear Tests,
        [1961 Pub. Papers 587](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=645) (Sept.
        3, 1961). [[w.sorensen-kennedy]], 620. See [[cal.1961-08-30.testing]]. Names: Kennedy, Macmillan, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:macmillan-harold
      - name:khrushchev-nikita-s
      src:
        c: ee7fc72b
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=645: all'
        - 'w.sorensen-kennedy 620: all'
- add:
    entry:
      id: cal.1961-11-24.civil-rights-the-executive-2
      when: Nov. 24
      date: '1961-11-24'
      thread: civil-rights-the-executive
      c: Hyannis Port, the day after Thanksgiving, after a day of meetings on trade and defense. The President, Robert Kennedy,
        Marshall, O'Brien, O'Donnell and Sorensen reassess civil rights. The literacy test and poll tax measures to go up
        in January; executive actions faster. The housing order to wait on the Urban Affairs department, Weaver its secretary-to-be.
      n: '[[w.sorensen-kennedy]], 480–81. See [[cal.1961-11-23.civil-rights-the-executive]]. Names: Kennedy, Robert Kennedy,
        Marshall, O''Brien, O''Donnell, Sorensen, Weaver.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
