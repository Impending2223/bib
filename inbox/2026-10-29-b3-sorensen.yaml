      id: cal.1961-12-07.economy-2
      when: Dec. 7
      date: '1961-12-07'
      thread: economy
      c: 'Miami. Kennedy opens the AFL-CIO convention: "It''s warmer here today than it was yesterday." Labor''s part in keeping
        American goods competitive; those in wage negotiations to recognize "the desirability of ... maintaining stable prices."'
      n: 'Address in Miami at the Opening of the AFL-CIO Convention, [1961 Pub. Papers 786](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=844)
        (Dec. 7, 1961). [[w.sorensen-kennedy]], 438–39. Names: Kennedy.'
