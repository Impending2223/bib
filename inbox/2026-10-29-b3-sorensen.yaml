      when: Feb. 20
      date: '1962-02-20'
      thread: testing
      c: 'Gaitskell to Kennedy, by letter: no American tests before the disarmament conference opens at Geneva, Mar. 14; the
        tests announced before then, so that the Soviets may agree to a treaty in its first month; a treaty to call them off.'
      n: '[[w.sorensen-kennedy]], 623. Names: Gaitskell, Kennedy.'
      tags:
      - name:gaitskell-hugh
      - name:kennedy-john-f
