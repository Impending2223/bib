      date: '1962-02-27'
      thread: testing
      c: 'Kennedy to Macmillan, by letter: his senior advisers unanimous for tests in the atmosphere from about Apr. 15; the
        decision to be announced on television Thursday, Mar. 1. Macmillan asks for Mar. 2.'
      n: '[FRUS 1961–63, VII, doc. 138](https://history.state.gov/historicaldocuments/frus1961-63v07/d138). [[w.sorensen-kennedy]],
