    entry:
      id: cal.1962-11-19.civil-rights-the-executive-2
      when: Nov. 19
      date: '1962-11-19'
      thread: civil-rights-the-executive
      c: 'The White House, at night. Kennedy with Justice and White House aides settles the housing order''s terms: voluntary
        for housing already built and for conventional mortgages; a committee in the Executive Office under Lawrence, Pennsylvania''s
        retiring governor.'
      n: '[[w.sorensen-kennedy]], 482. The order: [[cal.1962-11-20.civil-rights-the-executive]]. See [[cal.1961-11-24.civil-rights-the-executive]].
        Names: Kennedy, Lawrence.'
      tags:
      - name:kennedy-john-f
      - name:lawrence-david-l
      src:
        c: c667a7cc
        rows:
        - 'w.sorensen-kennedy 482: all'
- add:
    entry:
      id: cal.1962-11-29.missile-crisis-2
      when: Nov. 29
      date: '1962-11-29'
      thread: missile-crisis
      c: 'Kennedy with Mikoyan, Rusk, Thompson and Dobrynin present, 4:40 to 7:55 p.m., on Cuba: the declarations to close
        the affair; failing them, the President would state the American position at a press conference. By Sorensen''s account,
        Mikoyan reports that Khrushchev liked the spirit of the President''s statements.'
      n: '[FRUS 1961–63, XI, doc. 218](https://history.state.gov/historicaldocuments/frus1961-63v11/d218). [[w.sorensen-kennedy]],
        725. See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy, Mikoyan, Rusk, Thompson, Dobrynin, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:mikoyan-anastas
      - name:rusk-dean
      - name:thompson-llewellyn-e
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      src:
        c: be26acaa
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d218: A, B'
        - 'w.sorensen-kennedy 725: C'
- add:
    entry:
      id: cal.1962-12-10.transition-and-staff-2
      when: Dec. 10
      date: '1962-12-10'
      thread: transition-and-staff
      c: 'The Cabinet. Its agenda: the foreign situation, Rusk; the economic situation and outlook, Heller; the 1963 legislative
        program, Sorensen.'
      n: '[[w.sorensen-kennedy]], 284. Names: Rusk, Heller, Sorensen.'
      tags:
      - name:rusk-dean
      - name:heller-walter-w
      - name:sorensen-theodore-c
      src:
        c: f6386256
        rows:
        - 'w.sorensen-kennedy 284: all'
- add:
    entry:
      id: cal.1962-12-14.congo-2
      when: Dec. 14
      date: '1962-12-14'
      thread: congo
      c: 'Kennedy tentatively approves State''s proposal of an American fighter squadron for the UN in the Congo, as it would
        not go into combat or under UN command: if both Adoula and U Thant ask for it.'
      n: '[[w.sorensen-kennedy]], 638. Names: Kennedy, Adoula, U Thant.'
      tags:
      - name:kennedy-john-f
      - name:adoula-cyrille
      - name:u-thant
      src:
        c: c9771b0d
        rows:
        - 'w.sorensen-kennedy 638: all'
- add:
    entry:
      id: cal.1962-12-17.congo-3
      when: Dec. 17
      date: '1962-12-17'
      thread: congo
      c: 'Kennedy rules against an immediate move, Adoula and U Thant reported hesitant and the squadron''s advocates now
        for its combat use under the UN: a military survey mission first. U Thant''s first request, more planes, trucks and
        armored personnel carriers, met.'
      n: '[[w.sorensen-kennedy]], 638. See [[cal.1962-12-14.congo]]. Names: Kennedy, Adoula, U Thant.'
      tags:
      - name:kennedy-john-f
      - name:adoula-cyrille
      - name:u-thant
      src:
        c: 0c7acf1a
        rows:
        - 'w.sorensen-kennedy 638: all'
- add:
    entry:
      id: cal.1962-12-17.congo-4
      when: Dec. 17
      date: '1962-12-17'
      thread: congo
      c: 'Sorensen, by memorandum after the morning''s meeting: his doubts, which Dillon and Bell share, on sending American
        combat forces to the Congo; hard to explain intervention against non-communist Katanga; the confidence won by the
        care taken over Cuba at risk.'
      n: '[FRUS 1961–63, XX, doc. 365](https://history.state.gov/historicaldocuments/frus1961-63v20/d365) ("no indication
        that this memorandum was sent to anyone"). [[w.sorensen-kennedy]], 638. See [[cal.1962-12-14.congo]]. Names: Sorensen,
        Dillon, Bell.'
      tags:
      - name:sorensen-theodore-c
      - name:dillon-c-douglas
      - name:bell-david-e
      src:
        c: e1670fef
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v20/d365: all'
        - 'w.sorensen-kennedy 638: all'
- add:
