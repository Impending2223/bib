      when: June 8
      date: '1963-06-08'
      thread: testing
      c: 'Khrushchev to Kennedy, by letter, on his and Macmillan''s of May 31: ready to receive their representatives in Moscow.
        "Success now depends only upon the question of what baggage representatives of the Western powers bring with them
        to Moscow." The word reaches Kennedy in Honolulu as the American University speech is revised.'
      n: '[FRUS 1961–63, VI, doc. 106](https://history.state.gov/historicaldocuments/frus1961-63v06/d106). [[w.sorensen-kennedy]],
