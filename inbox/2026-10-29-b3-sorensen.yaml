      id: cal.1962-01-23.steel-2
      when: Jan. 23
      date: '1962-01-23'
      thread: steel
      c: 'The White House. Kennedy with Goldberg, Blough and McDonald, privately: an early settlement, and one to make a price
        rise unnecessary. No pledge on prices asked; none given.'
      n: '[[w.sorensen-kennedy]], 445–46. See [[cal.1961-09-06.steel]]. Names: Kennedy, Goldberg, Blough.'
      tags:
      - name:kennedy-john-f
