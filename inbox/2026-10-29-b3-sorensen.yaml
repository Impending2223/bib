      date: '1962-03-06'
      thread: steel
      c: 'Goldberg to Blough, in private: the Council of Economic Advisers'' figure, about ten cents an hour in benefits,
        well within the industry''s capacity without a price rise. Blough does not disagree.'
      n: '[[w.sorensen-kennedy]], 446. See [[cal.1962-01-23.steel]]. Names: Goldberg, Blough.'
