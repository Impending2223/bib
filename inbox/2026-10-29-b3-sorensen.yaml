      when: June 12
      date: '1963-06-12'
      thread: civil-rights-bill
      c: Capitol Hill. A special caucus of Southern Senators vows to block any civil rights legislation.
      n: '[[w.sorensen-kennedy]], 496. See [[cal.1963-06-11.civil-rights-bill]]. Check: the day; Sorensen gives "the following
