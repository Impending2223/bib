ops:
- add:
    entry:
      id: cal.1960-05-03.elections-1960-3
      when: May 3
      date: '1960-05-03'
      thread: elections-1960
      c: 'Washington. "Fellow Pastors in Christ," an open letter of thirteen Protestant leaders from Dean Sayre''s office
        at the cathedral, Sayre its drafter, Bishop Oxnam a signer: no candidate to be discounted "because of his chosen faith."
        Copies to every Protestant minister in West Virginia. By Sorensen''s account, he arranged it, his part kept from the
        press.'
      n: '[[w.sorensen-kennedy]], 143–44. See [[cal.1960-04-21.elections-1960]]. Names: Sorensen. Check: the thirteen signers.'
      tags:
      - name:sorensen-theodore-c
      src:
        c: 25b6675f
        rows:
        - 'w.sorensen-kennedy 143–44: all'
- add:
    entry:
      id: cal.1960-05-07.elections-1960
      when: May 7
      date: '1960-05-07'
      thread: elections-1960
      c: Clarksburg, W. Va. Johnson speaks, the Saturday before the primary.
      n: '[[w.sorensen-kennedy]], 141. Names: Johnson. Check: what he said; Sorensen gives the appearance only.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: 6d77b7e9
        rows:
        - 'w.sorensen-kennedy 141: all'
- add:
    entry:
      id: cal.1960-05.elections-1960-8
      when: May
      date: 1960-05
      thread: elections-1960
      c: 'West Virginia, the campaign''s close. Kennedy on television, Franklin D. Roosevelt Jr. putting the religious questions,
        Sorensen''s: as President he "would not take orders from any Pope, Cardinal, Bishop or priest"; one who did would
        be breaking his oath, "and should be impeached."'
      n: '[[w.sorensen-kennedy]], 145. See [[cal.1960-04-21.elections-1960]]. Names: Kennedy, Franklin D. Roosevelt Jr., Sorensen.
        Check: the day, before the primary of May 10.'
      tags:
      - name:kennedy-john-f
      - name:roosevelt-franklin-d-jr
      - name:sorensen-theodore-c
      src:
        c: f452b4b5
        rows:
        - 'w.sorensen-kennedy 145: all'
- add:
    entry:
      id: cal.1960-05.elections-1960-9
      when: May
      date: 1960-05
      thread: elections-1960
      c: 'A week before Oregon''s primary, Truman against the primaries and for Symington; against Kennedy, only his residence
        in Massachusetts. Kennedy: "I have news for Mr. Truman. Mr. Symington was born in Massachusetts."'
      n: '[[w.sorensen-kennedy]], 148. Names: Truman, Symington, Kennedy. Check: the day, about May 13.'
      tags:
      - name:truman-harry-s
      - name:symington-william-s
      - name:kennedy-john-f
      src:
        c: 8ce4a3e3
        rows:
        - 'w.sorensen-kennedy 148: all'
- add:
    entry:
      id: cal.1960-05.elections-1960-10
      when: May
      date: 1960-05
      thread: elections-1960
      c: '*L''Osservatore Romano*: the church "has the duty and the right" to tell Catholics how to vote. Kennedy''s statement:
        his support of the separation of church and state "is not subject to change under any conditions."'
      n: '[[w.sorensen-kennedy]], 148. See [[cal.1960-04-21.elections-1960]]. Names: Kennedy. Check: the day of the editorial
        and of the statement.'
      tags:
      - name:kennedy-john-f
      src:
        c: 3cfce41f
        rows:
        - 'w.sorensen-kennedy 148: all'
- add:
    entry:
      id: cal.1960-06-02.elections-1960-2
      when: June 2
      date: '1960-06-02'
      thread: elections-1960
      c: 'Williams, governor of Michigan, for Kennedy, after Kennedy''s visit to his summer home on Mackinac Island, Mich.:
        42 more of the State''s 51 votes. Before it, Sorensen with Williams and the State''s Democratic leaders, at the State
        convention in May; a questionnaire in forty-one parts for Kennedy to answer in writing.'
      n: '[[w.sorensen-kennedy]], 148–49. Names: Williams, Kennedy, Sorensen. Check: the day of the Michigan convention.'
      tags:
      - name:williams-g-mennen
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      src:
        c: b0f2953c
        rows:
        - 'w.sorensen-kennedy 148–49: all'
- add:
    entry:
      id: cal.1960-07-02.elections-1960-2
      when: July 2
      date: '1960-07-02'
      thread: elections-1960
      c: 'Truman''s televised press conference. His endorsement of Symington repeated; Johnson, Bowles, Meyner and six others
        added. The convention "prearranged ... mockery ... controlled ... by one candidate." To Kennedy: "are you certain
        that you are quite ready for the country, or that the country is ready for you"; "May I urge you to be patient?"'
      n: '[[w.sorensen-kennedy]], 151–52. Reply: [[cal.1960-07-04.elections-1960]]. Names: Truman, Symington, Johnson, Bowles,
        Kennedy.'
      tags:
      - name:truman-harry-s
      - name:symington-william-s
      - name:johnson-lyndon-b
      - name:bowles-chester
      - name:kennedy-john-f
      src:
        c: a2189c1e
        rows:
        - 'w.sorensen-kennedy 151–52: all'
- add:
    entry:
      id: cal.1960-07-04.elections-1960-2
      when: July 4
      date: '1960-07-04'
      thread: elections-1960
      c: 'New York. Kennedy''s televised press conference, the reply to Truman, drafted with Sorensen at Hyannis Port: if
        "fourteen years in major elective office is insufficient experience," that rules out every President of the century;
        an age test would have kept "Christopher Columbus from even discovering America." "If the people of this nation select
        me to be their President, I believe that I am ready."'
      n: '[[w.sorensen-kennedy]], 152–53. See [[cal.1960-07-02.elections-1960]]. Names: Kennedy, Truman, Sorensen.'
      tags:
      - name:kennedy-john-f
      - name:truman-harry-s
      - name:sorensen-theodore-c
      src:
        c: 50b1ec60
        rows:
        - 'w.sorensen-kennedy 152–53: all'
- add:
    entry:
      id: cal.1960-07-10.elections-1960-3
      when: July 10
      date: '1960-07-10'
      thread: elections-1960
      c: Los Angeles. Illinois's delegation declares for Kennedy, the Sunday before the convention.
      n: '[[w.sorensen-kennedy]], 155. Names: Kennedy. Check: the vote.'
      tags:
      - name:kennedy-john-f
      src:
        c: 65b82124
        rows:
        - 'w.sorensen-kennedy 155: all'
- add:
    entry:
      id: cal.1960-07-10.elections-1960-4
      when: July 10
      date: '1960-07-10'
      thread: elections-1960
      c: '*Meet the Press*. Kennedy: "I think we are going to win the nomination. ... But I don''t think it is wrapped up.
        ... No convention is."'
      n: '[[w.sorensen-kennedy]], 155. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 941e901d
        rows:
        - 'w.sorensen-kennedy 155: all'
- add:
    entry:
      id: cal.1960-11-07.elections-1960-4
      when: Nov. 7
      date: '1960-11-07'
      thread: elections-1960
      c: 'Kennedy''s election eve. Manchester, N.H., with his three sisters: "I believe that there is a publisher who has
        less regard for the truth than William Loeb but I can''t think of his name." A nationwide question-and-answer program
        from Manchester, his sisters asking. The Boston Garden. At 11 p.m., a telecast from Faneuil Hall, his wife from Hyannis
        Port and Johnson from Austin on it.'
      n: '[[w.sorensen-kennedy]], 210. See [[cal.1960-11-07.elections-1960]]. Names: Kennedy, Loeb, Johnson.'
      tags:
      - name:kennedy-john-f
      - name:loeb-henry
      - name:johnson-lyndon-b
      src:
        c: 5dc5e774
        rows:
        - 'w.sorensen-kennedy 210: all'
- add:
    entry:
      id: cal.1960-12-15.transition-and-staff-3
      when: Dec. 15
      date: '1960-12-15'
      thread: transition-and-staff
      c: Palm Beach. The Secret Service picks up a New Hampshire man who had driven to Florida with dynamite in his car to
        crash it into Kennedy's; by his account he had let a chance go the Sunday before, Kennedy's wife and children with
        him.
      n: '[[w.sorensen-kennedy]], 238–39. Names: Kennedy. Check: the man''s name (Sorensen gives none) and the Sunday, Dec.
        11.'
      tags:
      - name:kennedy-john-f
      src:
        c: eb5c0fc1
        rows:
        - 'w.sorensen-kennedy 238–39: all'
- add:
    entry:
      id: cal.1960-12-21.transition-and-staff-2
      when: Dec. 21
      date: '1960-12-21'
      thread: transition-and-staff
      c: 'Palm Beach, an all-day and late-night session: Kennedy and the Budget Bureau''s new men on Sorensen''s check list
        of over 250 items, from area redevelopment to Nike-Zeus, from the pledges, the platform and the Eighty-sixth Congress''s
        unfinished bills. Kennedy: "Now I know why Ike had Sherman Adams." Added by him: a commission on campaign costs; memoranda
        to the appointees on federal employment and on conflicts of interest. A letter of questions to each Cabinet designee
        follows.'
      n: '[[w.sorensen-kennedy]], 238–39. See [[cal.1960-11-09.transition-and-staff]]. Names: Kennedy, Sorensen.'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      src:
        c: 1973678d
        rows:
        - 'w.sorensen-kennedy 238–39: all'
- add:
    entry:
      id: cal.1961-01-16.transition-and-staff-2
      when: Jan. 16–17
      date: '1961-01-16'
      thread: transition-and-staff
      c: 'Palm Beach, the patio. Kennedy and Sorensen on the inaugural address: the domestic passages dropped ("It''s too
        long anyway"); "this won''t all be finished in a hundred days or a thousand." Jan. 17, on the *Caroline* to Washington,
        the opening paragraphs dictated to Evelyn Lincoln.'
      n: '[[w.sorensen-kennedy]], 242–43. The address: [[cal.1961-01-20.transition-and-staff]]. Names: Kennedy, Sorensen,
        Lincoln. Check: the first day; Sorensen gives "the next morning" and "Later that day—January 17."'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - name:lincoln-evelyn
      src:
        c: 686f8d0d
        rows:
        - 'w.sorensen-kennedy 242–43: all'
- add:
    entry:
      id: cal.1961-01.transition-and-staff-2
      when: Late Jan.
      date: 1961-01
      thread: transition-and-staff
      also:
      - civil-rights-the-executive
      c: 'Kennedy''s first Cabinet meeting. The Treasury out of its partisan role: Dillon, Rusk and McNamara excused from
        every political function. The Coast Guard''s honor guard at the parade, no Negro in it: each member to examine his
        own department, opportunity at all levels.'
      n: '[[w.sorensen-kennedy]], 272, 473 (272: the Treasury; 473: the Coast Guard). Names: Kennedy, Dillon, Rusk, McNamara.
        Check: the day; Sorensen gives "the following week" (473).'
      tags:
      - name:kennedy-john-f
      - name:dillon-c-douglas
      - name:rusk-dean
      - name:mcnamara-robert-s
      src:
        c: c097fe3c
        rows:
        - 'w.sorensen-kennedy 272: A, B'
        - 'w.sorensen-kennedy 473: A, C'
- add:
    entry:
      id: cal.1961-02.civil-rights-the-executive-3
      when: Feb.
      date: 1961-02
      thread: civil-rights-the-executive
      c: Wilkins of the NAACP gives Sorensen, at the President's request, a memorandum of sixty-one pages on new executive
        action. King a longer one. Both for an across-the-board executive order, a "Second Emancipation Proclamation," by
        the centennial.
      n: '[[w.sorensen-kennedy]], 476. Names: Wilkins, Sorensen, Martin Luther King. Check: the day; King''s document undated.'
      tags:
      - name:wilkins-roy
      - name:sorensen-theodore-c
      - name:king-martin-luther-jr
      src:
        c: 6ea5cbb9
        rows:
        - 'w.sorensen-kennedy 476: all'
- add:
    entry:
      id: cal.1961-06-15.transition-and-staff-2
      when: June 15
      date: '1961-06-15'
      thread: transition-and-staff
      c: The Cabinet. On its agenda, put there by Hodges, "A candid discussion with the President on relationships with the
        White House staff." Sorensen's note to Kennedy, "Shall I leave?" Kennedy ignores the note and the item.
      n: '[[w.sorensen-kennedy]], 259. Names: Hodges, Sorensen, Kennedy.'
      tags:
      - name:hodges-luther-h
      - name:sorensen-theodore-c
      - name:kennedy-john-f
      src:
        c: 82ab8b2c
        rows:
        - 'w.sorensen-kennedy 259: all'
