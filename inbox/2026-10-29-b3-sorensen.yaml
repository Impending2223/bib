      thread: steel
      c: Washington airport, the afternoon. Tyson, U.S. Steel's finance chairman, with Goldberg, and separately with Clifford
        aboard the corporation's plane, Kennedy having asked Clifford to speak for him. No progress. Word that Blough wants
        the talks kept up.
      n: '[[w.sorensen-kennedy]], 457. See [[cal.1962-04-10.steel]]. Names: Goldberg, Clifford, Kennedy, Blough.'
