      when: Aug. 30
      date: '1961-08-30'
      thread: testing
      c: 'White House statement that night on the Soviet resumption: a hazard to every human being; the pretext, "the very
        crisis which they themselves have created" over Germany and Berlin.'
      n: 'White House Statement on Soviet Resumption of Nuclear Weapons Tests, [1961 Pub. Papers 580](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=638)
