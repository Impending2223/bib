- add:
    entry:
      id: cal.1962-04-12.steel-5
      when: Apr. 12
      date: '1962-04-12'
      thread: steel
      c: The Cabinet Room, 8:50 a.m. The President with Robert Kennedy, Goldberg, McNamara, Hodges, Fowler, Dixon of the FTC,
        Heller, O'Brien and Sorensen. Antitrust and Defense's purchasing the only tangible steps. Hodges to answer Blough's
        press conference; calls to every steel contact; a fact book by the government's economists.
      n: '[[w.sorensen-kennedy]], 452, 454–56. See [[cal.1962-04-10.steel]]. Names: Kennedy, Robert Kennedy, Goldberg, McNamara,
        Hodges, Fowler, Heller, O''Brien, Sorensen, Blough.'
