- add:
    entry:
      id: cal.1963-09-23.trade-2
      when: Sept. 23
      date: '1963-09-23'
      thread: trade
      c: 'The Cabinet. Freeman: a Minnesota grain trader reports a possible Soviet interest in buying American wheat. The
        Secretaries of State, Defense, Commerce, Labor and the Treasury give their views; one member warns of Polish-Americans''
        opposition. A smaller session follows in the President''s office.'
