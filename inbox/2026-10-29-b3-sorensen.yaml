- add:
    entry:
      id: cal.1962-04-13.steel-5
      when: Apr. 13
      date: '1962-04-13'
      thread: steel
      c: 'Sorensen''s office, the morning: the legislative alternatives. A ninety-day "Steel Price Emergency Act of 1962,"
        prices rolled back to their Apr. 9 level until a board of inquiry reports; an amendment to the Defense Production
        Act reviving authority over prices and wages. None promising.'
      n: '[[w.sorensen-kennedy]], 454–55. See [[cal.1962-04-10.steel]]. Names: Sorensen.'
      tags:
      - name:sorensen-theodore-c
      src:
        c: 82e695d0
        rows:
        - 'w.sorensen-kennedy 454–55: all'
- add:
    entry:
      id: cal.1962-04-13.steel-6
      when: Apr. 13
      date: '1962-04-13'
      thread: steel
      c: 'The Cabinet Room. Inland and Kaiser holding, Armco uncertain. McNamara: the others "will all have to come down."
        Armco to be reached first.'
      n: '[[w.sorensen-kennedy]], 456. See [[cal.1962-04-10.steel]]. Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
      src:
