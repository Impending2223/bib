        rows:
        - 'w.sorensen-kennedy 457–58: all'
- add:
    entry:
      id: cal.1962-05-08.economy-2
      when: May 8
      date: '1962-05-08'
      thread: economy
      c: 'Atlantic City. Kennedy to the United Auto Workers'' convention: "a noninflationary and peaceful settlement ... in
        your forthcoming negotiations in the aircraft and missile industries." "Last week, after speaking to the Chamber of
        Commerce and the Presidents of the American Medical Association, I began to wonder how I got elected."'
      n: 'Address in Atlantic City at the Convention of the United Auto Workers, [1962 Pub. Papers 364](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=424)
        (May 8, 1962). [[w.sorensen-kennedy]], 438–39. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: d9099e45
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=424: all'
        - 'w.sorensen-kennedy 438–39: all'
- add:
    entry:
      id: cal.1962-05-21.economy-2
      when: May 21
      date: '1962-05-21'
      thread: economy
      c: Kennedy to the White House Conference on National Economic Issues. By Sorensen's account, he chastises the American
        bankers who have told their European counterparts that his deficits must bring inflation.
      n: 'Remarks to Members of the White House Conference on National Economic Issues, [1962 Pub. Papers 420](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=480)
        (May 21, 1962). [[w.sorensen-kennedy]], 468. Names: Kennedy. Check: the passage on the bankers, not found in the Public
        Papers'' text.'
      tags:
      - name:kennedy-john-f
      src:
        c: ddce3d45
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=480: A'
        - 'w.sorensen-kennedy 468: all'
- add:
    entry:
      id: cal.1962-06-06.economy-2
      when: June 6
      date: '1962-06-06'
      thread: economy
      c: 'The White House, the second meeting on the economy. Heller gloomier. Samuelson and Solow: "for the first time the
        prudent odds for a so-called ''Kennedy recession'' ... have ceased to be negligible"; "Only an early tax cut appears
        to be capable of giving the economy the stimulus it needs in time."'
      n: '[[w.sorensen-kennedy]], 424. See [[cal.1962-06-04.economy]]. Names: Heller, Samuelson.'
      tags:
      - name:heller-walter-w
      - name:samuelson-paul-a
      src:
        c: a96aa05a
        rows:
        - 'w.sorensen-kennedy 424: all'
- add:
    entry:
      id: cal.1962-07.economy-4
      when: Mid-July
      date: 1962-07
      thread: economy
      c: 'Samuelson and Solow, for "a majority of economists inside and outside the government": without a temporary emergency
        tax cut, losses of profits, production and employment in "the developing recession." By the end of June Samuelson
        had put the odds of a recession in 1962 at even.'
      n: '[[w.sorensen-kennedy]], 424. See [[cal.1962-06-06.economy]]. Names: Samuelson. Check: the day, and whether a memorandum
        to the President.'
      tags:
      - name:samuelson-paul-a
      src:
        c: e11f3974
        rows:
        - 'w.sorensen-kennedy 424: all'
- add:
    entry:
      id: cal.1962-07.economy-5
      when: July
      date: 1962-07
      thread: economy
      c: 'The Cabinet, at the President''s request: Sorensen leads a discussion of its part in mending relations with business,
        after his analysis of June. His list of steps, in a memorandum to each member: luncheons with each department''s business
        clientele, business advisory groups, more speeches to business, no uncleared controversial remarks.'
      n: '[[w.sorensen-kennedy]], 466. Names: Sorensen. Check: the day.'
      tags:
      - name:sorensen-theodore-c
      src:
        c: 39eecceb
        rows:
        - 'w.sorensen-kennedy 466: all'
- add:
    entry:
      id: cal.1962-07-10.medicare-2
      when: July 10
      date: '1962-07-10'
      thread: medicare
      c: 'The legislative leaders'' breakfast, Medicare''s tactics and tally its first subject, as on July 3 and 17. O''Brien''s
        head count 51–49 for: at least four liberal Republicans and one Southern Democrat switching from 1960.'
      n: '[[w.sorensen-kennedy]], 343–44. Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-john-f
      src:
        c: 215cfcf5
        rows:
        - 'w.sorensen-kennedy 343–44: all'
- add:
    entry:
      id: cal.1962-07-17.medicare-3
      when: July 17
      date: '1962-07-17'
      thread: medicare
      c: 'The leaders'' breakfast, the morning of the vote. O''Brien''s count: "50-50 at best, and Senator Randolph has a
        problem." Kennedy talks to Randolph, and has West Virginia''s and the party''s leaders, labor and the welfare groups
        talk to him.'
      n: '[[w.sorensen-kennedy]], 344. The vote: [[cal.1962-07-17.medicare]]. See [[cal.1962-07-10.medicare]]. Names: O''Brien,
        Randolph, Kennedy. Check: Kennedy''s instruction to Bell to drop a project of Randolph''s from the Budget, undated
        (344).'
      tags:
      - name:obrien-lawrence-f
      - name:randolph-jennings
      - name:kennedy-john-f
      src:
        c: 655eb204
        rows:
        - 'w.sorensen-kennedy 344: all'
