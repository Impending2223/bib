      when: May 31
      date: '1963-05-31'
      thread: civil-rights-bill
      c: Kennedy decides on a sweeping civil rights bill, over the opposition of some of his political advisers. By Sorensen's
        account.
      n: '[[w.sorensen-kennedy]], 494. See [[cal.1963-05-20.civil-rights-bill]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
