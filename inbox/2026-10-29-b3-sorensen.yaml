      when: Aug. 23
      date: '1962-08-23'
      thread: berlin-and-vienna
      c: 'Sorensen at lunch with Dobrynin, one of the ambassador''s get-acquainted luncheons: the congressional campaign will
        not inhibit the President''s answer to new pressure on Berlin.'
      n: '[[w.sorensen-kennedy]], 667–68. The brief: Bundy to Sorensen, [FRUS 1961–63, XV, doc. 103](https://history.state.gov/historicaldocuments/frus1961-63v15/d103).
        Names: Sorensen, Dobrynin, Bundy.'
