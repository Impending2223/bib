        rows:
        - 'w.sorensen-kennedy 456: all'
- add:
    entry:
      id: cal.1962-04-13.steel-7
      when: Apr. 13
      date: '1962-04-13'
      thread: steel
      c: 'New York, a luncheon: Goldberg and Clifford for the President with Tyson, Blough and Worthington of U.S. Steel.
        Complete rescission the one action the President will accept. During it, word by telephone to Blough and Goldberg:
        Bethlehem has rescinded.'
      n: '[[w.sorensen-kennedy]], 457–58. See [[cal.1962-04-10.steel]]. Names: Goldberg, Clifford, Blough.'
      tags:
      - name:goldberg-arthur-j
      - name:clifford-clark
