    entry:
      id: cal.1962-03-12.steel-2
      when: Mar. 12
      date: '1962-03-12'
      thread: steel
      c: 'Goldberg to McDonald, in private: the same figure, as appropriate to price stability. The talks resume Mar. 14.'
      n: '[[w.sorensen-kennedy]], 446. See [[cal.1962-03-06.steel]]. Names: Goldberg.'
      tags:
      - name:goldberg-arthur-j
      src:
