      when: June 10
      date: '1963-06-10'
      thread: civil-rights-bill
      also:
      - republican-party
      c: 'Kennedy to Eisenhower, by letter: "It is clear that such a measure cannot pass either house without substantial
        bipartisan support." Eisenhower kept fully informed.'
      n: '[[w.sorensen-kennedy]], 499. See [[cal.1963-05-31.civil-rights-bill]]. Names: Kennedy, Eisenhower. Check: the letter,
