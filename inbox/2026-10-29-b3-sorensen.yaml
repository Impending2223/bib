- add:
    entry:
      id: cal.1962-04-12.steel-7
      when: Apr. 12
      date: '1962-04-12'
      thread: steel
      c: 'Blough''s press conference, mild. Hodges''s reply: "a handful of men who said in effect that United States Steel
        comes first, the United States of America second."'
      n: '[[w.sorensen-kennedy]], 455. See [[cal.1962-04-10.steel]]. Names: Blough, Hodges.'
