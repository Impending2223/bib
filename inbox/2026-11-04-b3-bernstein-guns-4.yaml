      id: cal.1963-10.civil-rights-bill-2
      when: Oct., early
      date: 1963-10
      thread: civil-rights-bill
      also:
      - republican-party-congress
      c: 'Kennedy invites Dirksen and Katzenbach on Air Force One to Chicago for the Army-Air Force football game, then
        stays behind for a crisis in Vietnam. Dirksen and Katzenbach ride together on the civil rights bill. Dirksen, as
        they land: "Don''t worry. This bill will come to a vote in the Senate."'
      n: '[[w.bernstein-guns-or-butter]], 64. Check: the day. To check: Katzenbach, Oral History Interview, LBJ Library
        (cited by [[w.bernstein-guns-or-butter]], 64 n.5). Names: Kennedy, Dirksen, Katzenbach.'
