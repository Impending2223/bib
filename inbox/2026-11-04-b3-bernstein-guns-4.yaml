      when: Feb. 3–4
      date: '1964-02-03'
      thread: civil-rights-bill
      c: 'House, in Committee of the Whole on the civil rights bill, the amendments begin. Title I, voting: nine Southern
        amendments defeated; two by Southern Republicans accepted, a three-judge court for defendants as for the Attorney
        General, and Puerto Rico within the bill.'
      n: '[[w.bernstein-guns-or-butter]], 51. To check: [[w.whalen-longest-debate]] (cited by [[w.bernstein-guns-or-butter]],
        51 n.3). See [[cal.1964-01-31.civil-rights-bill]].'
      src:
        c: 58c9ac07
        rows:
        - 'w.bernstein-guns-or-butter 51: all'
- add:
    entry:
      id: cal.1964-02-05.civil-rights-bill
      when: Feb. 5
      date: '1964-02-05'
      thread: civil-rights-bill
      c: 'House, Title II, public accommodations, two days of amendments. Smith on a podiatrist''s practice, a remark he
        strikes from the Record. His motion, in Bernstein''s words "a restatement of the Thirteenth Amendment," defeated
        149 to 107; many Southerners leave the floor. The other amendments defeated.'
      n: '[[w.bernstein-guns-or-butter]], 51. Check: the days (Bernstein: two days, after Title I''s of Feb. 3–4, before
        Title III''s of Feb. 6). To check: [[w.whalen-longest-debate]] (cited by [[w.bernstein-guns-or-butter]], 51 n.3).
        See [[cal.1964-02-03.civil-rights-bill]]. Names: Smith.'
      tags:
      - name:smith-howard-w
      src:
        c: b85bd3c5
        rows:
        - 'w.bernstein-guns-or-butter 51: all'
- add:
    entry:
      id: cal.1964-02-06.civil-rights-bill
      when: Feb. 6
      date: '1964-02-06'
      thread: civil-rights-bill
      c: 'House, Titles III to V. Public facilities: every amendment defeated but a Southern Republican''s, the government
        to pay the attorney''s fee of a defendant who loses, accepted by Celler at McCulloch''s insistence. Public education:
        six rejected, two accepted. The Civil Rights Commission: Willis''s amendment, no inquiry into the membership of
        a bona fide fraternal, religious or civic organization; the commission''s life limited to four years.'
      n: '[[w.bernstein-guns-or-butter]], 51. To check: [[w.whalen-longest-debate]] (cited by [[w.bernstein-guns-or-butter]],
        51 n.3). See [[cal.1964-02-03.civil-rights-bill]]. Names: Celler, McCulloch.'
      tags:
      - name:celler-emanuel
      - name:mcculloch-william-m
      src:
        c: b5e1571e
        rows:
        - 'w.bernstein-guns-or-butter 51: all'
