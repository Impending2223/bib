- add:
    entry:
      id: cal.1964-11-30.cities-and-housing
      when: Nov. 30
      date: '1964-11-30'
      thread: cities-and-housing
      c: 'Wood''s Task Force on Metropolitan and Urban Problems reports to Johnson: "an urban nation for at least 60 years
        . . . Yet we have never fashioned a genuine national response." Its members: Cavanagh of Detroit, Klaman, McGill,
        Ylvisaker, Glazer, Norman Kennedy, Meyerson, Wurster, Vernon, Karl Menninger.'
