      date: '1964-03-05'
      thread: civil-rights-bill
      c: 'Chicago. Robert E. Bryant, examiner of the Illinois Fair Employment Practice Commission, on Leon Myart''s complaint
        against Motorola, after a hearing Jan. 27: its 28-question general ability test unfair to culturally deprived groups;
        Motorola to stop giving it and to hire Myart. Motorola appeals to the commission, employers'' associations with
        it.'
      n: '[[w.bernstein-guns-or-butter]], 73–74. To check: Herbert Hill, "The Equal Employment Opportunity Acts of 1964
        and 1972," Indus. Rel. L.J. (Spring 1977), 12–16 (cited by [[w.bernstein-guns-or-butter]], 74 n.6).'
