      when: Dec. 15
      date: '1965-12-15'
      thread: cities-and-housing
      c: 'The task force''s report, on time: a demonstration cities program for 66 cities, 6 of over 500,000, 10 of 250,000
        to 500,000, 50 smaller, every city invited to compete, a presidential commission to choose. "The objective . . .
        is to completely eliminate blight in the designated area."'
