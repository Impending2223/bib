patch: 2026-11-14-b14-brezhnev-a-1969
by: 'Claude (batch 14, reader 1: Brezhnev''s workbooks, vol. I, Oct. 1964–Dec. 1969), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1969-02-04.soviet-union-leadership-2
      when: Feb. 4
      date: '1969-02-04'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Moscow. Brezhnev with Erban, chairman of the Czechoslovak National Front, whose delegation is in the USSR Feb. 2–4. His points for the talk: glad of the first acquaintance; relations of the CPSU and the Czechoslovak party good, and others want to quarrel them; the post-January course juggled by the right; open struggle, no yielding and no halting halfway, the anti-socialist forces well organized; the Federal Republic''s revanchists and the West; the opposition''s aims now a congress, elections to the National Assembly, the unions, a law on workers'' councils taking industry out of the party''s reach, attacks on the security organs and rehabilitations to blacken the party and tie it to the Soviet Union; the National Front''s part and Erban''s own praised.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 348–49 (№ 82, Brezhnev''s points for the talk, Feb. 4), 434 nn.1–3 (the editors: the National Front delegation under Erban, the Politburo''s decision of Jan. 19; the talk Feb. 4). Made public: 2016. To check: the Czechoslovak record; the points are Brezhnev''s, not what was said. Names: Erban, Brezhnev.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - vis:only:ussr+czechoslovakia
- add:
    entry:
      id: cal.1969-02-25.soviet-union-leadership
      when: Feb. 25
      date: '1969-02-25'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'The Politburo, on Chervonenko''s report on the situation in Czechoslovakia (by the editors, probably). Brezhnev''s notes: the Czechoslovak editions to be halted, or not; an answer to the request on the "Black Book"; a letter to the Executive Committee of the Czechoslovak party giving the Soviet assessment and tying it to the leading role of the party and normalization; the circulation of Tribuna; a document on Svoboda; support for the internationalist cadres, Kalek and Hofmann; the information media and unmet undertakings; to prepare a meeting on the model of Čierna nad Tisou; the Executive Committee without Smrkovský; a meeting of the six fraternal parties; a marshal to go at Svoboda''s request. By the editors, the question was a Soviet–Czechoslovak meeting in March or a meeting of the six parties; neither held.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 359–60 (№ 85, Brezhnev''s notes, Feb. 25), 438–39 nn.51–62 (the editors: the meeting question, the six parties, not held). Made public: 2016. To check: the protocol of Feb. 25, and the date, which the book gives from the notes'' own heading. Names: Chervonenko, Brezhnev, Svoboda, Smrkovský.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:chervonenko-stepan-v
      - name:svoboda-ludvik
