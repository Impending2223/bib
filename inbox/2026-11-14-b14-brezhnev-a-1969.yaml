- add:
    entry:
      id: cal.1969-09-30.soviet-union-leadership
      when: Sept. 30
      date: '1969-09-30'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'The Politburo. Brezhnev''s outline for it: after the information on Bulgaria (Zhivkov''s visit Sept. 25–26), a stop on Czechoslovakia, his telephone talks of Sept. 29 and 30 with Husák, Bilak and Svoboda, and a military delegation under Grechko to the army''s 25th anniversary (Oct. 5–7), leaving two days early; with the party-government delegation for the GDR''s 20th anniversary, talks with the other leaders at Berlin on Soviet troops abroad and the Middle East and the Security Council, a front of help to the Arab states; China, the next steps; the Polish delegation under Gomułka and Cyrankiewicz, in Moscow Oct. 1–3; Soviet troop pay abroad; volunteers; a meeting with the Romanians where all can be said in a comradely way; aid to the UAR, Sudan and Libya; preparation for Phạm Văn Đồng; planes; the commander of the group of forces in the GDR; Brandt''s telegram, with his candidacy for chancellor.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 428–30 (№ 94, "Наброски... к заседанию Политбюро ЦК КПСС 30 сентября 1969 г." (sketches for the Politburo of Sept. 30, 1969)), 450–51 nn.251–263 (the editors: the Politburo of Sept. 30 heard Brezhnev on the talks with Zhivkov and the calls with Husák, Bilak and Svoboda, and decided on the Grechko delegation, the GDR delegation and the Polish visit; Tsarapkin''s telegram of Sept. 29 on Brandt). Made public: 2016. To check: the protocol of Sept. 30. Names: Husák, Bilak, Svoboda, Grechko, Zhivkov, Gomułka, Cyrankiewicz, Brandt, Brezhnev.'
