- add:
    entry:
      id: cal.1969-10-02.soviet-union-leadership
      when: Oct. 2
      date: '1969-10-02'
      thread: soviet-union-leadership
      c: 'Moscow. Second day of the talks of the Soviet and Polish party-government delegations, Brezhnev, Kosygin and others with Gomułka and Cyrankiewicz (Oct. 1–3). Brezhnev''s notes: what the Soviet side heard from the Poles the day before "была для нас большим потрясением" (was a great shock to us); prices of vodka and beer raised; no butter, only margarine.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 430 (№ 95, "Заметки... в ходе выступления В. Гомулки на второй день переговоров" (notes during Gomułka''s speech on the second day of the talks), Oct. 2), 450 n.256 (the editors: the Polish delegation in Moscow Oct. 1–3 by the Politburo''s decision of Sept. 30; Kirilenko, Baibakov, Lesechko, Ilichev and Aristov added to the Soviet side). Made public: 2016. To check: the Polish record; what the shock was. Names: Gomułka, Cyrankiewicz, Brezhnev.'
      tags:
