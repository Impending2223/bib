- add:
    entry:
      id: cal.1969-12-05.soviet-union-leadership
      when: Dec. 5
      date: '1969-12-05'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Ceauşescu. Brezhnev''s notes of Ceauşescu''s statement: ways to better relations of the parties and the countries, the irritants to be removed, on both sides; some economic questions open, no agreement for 1970 on coke; in 1969 certain military equipment not delivered, aircraft among it, and cooperation between certain aircraft plants; an agreement for 1971–75, and a meeting of the delegations of the two governments. In the second record, of the same day, the Romanian party: the fight with the right, frequent changes of cadres in the lower organizations.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 433–34 (№№ 97–98, Brezhnev''s notes of Ceauşescu''s statement and "О положении в партии" (on the situation in the party), Dec. 5), 452 nn.270–275 (the editors: Ceauşescu on relations of the RCP and CPSU, coke, the shortfall in the 1965–70 supply agreement, military cooperation, the 1971–75 agreement). Made public: 2016. To check: the Romanian record. Names: Ceauşescu, Brezhnev.'
      tags:
      - polity:ussr
      - polity:romania
      - name:brezhnev-leonid
      - name:ceausescu-nicolae
      - vis:only:ussr+romania
- add:
    entry:
      id: cal.1969-06-26.soviet-union-leadership
      when: June 26
      date: '1969-06-26'
      thread: soviet-union-leadership
      c: 'The Plenum of the Central Committee. Brezhnev''s report, "Об итогах Международного совещания коммунистических и рабочих партий" (on the results of the International Meeting of Communist and Workers'' Parties), two hours and forty-five minutes. Speakers, by his list: Shelest, Grishin, Kunaev, Fedoseev, Chiryaev (Yakutia), Kulidzhanov (the cinematographers'' union), Epishev (the Army), the designer Babakin, Keldysh. The next day, June 27, the Moscow city and oblast party aktiv on the same results, Brezhnev to report, with eight speakers listed.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 397–98 (№ 89, Brezhnev''s notes, June 26–27), 444 nn.145–47 (the editors: the report at the Plenum of June 26; the Politburo of June 25 ordered aktiv meetings on the results of the Moscow Meeting and set Brezhnev to report to the Moscow aktiv; the Soviet statement on the Chinese border, approved June 13). Made public: 2016. To check: the Plenum''s stenogram and the report as printed; the notes are his list of speakers, not their words. Names: Brezhnev, Shelest, Grishin, Kunaev.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:shelest-petr-e
