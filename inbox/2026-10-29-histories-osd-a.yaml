      when: Apr. 29
      date: '1961-04-29'
      thread: laos
      c: 'Rusk''s meeting on Laos at the State Department, McNamara, Robert Kennedy and the Chiefs there. McNamara: the enemy could deny the airfield at Vientiane; a stand in Thailand and South Vietnam. Burke: still possible to go in. LeMay: air power could stop the Pathet Lao. Decker: no good place to fight in Southeast Asia, but hold as much as possible.'
      n: '[FRUS 1961–63, XXIV, doc. 67](https://history.state.gov/historicaldocuments/frus1961-63v24/d67). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 242. See [[cal.1961-04-26.laos]]. Names: Rusk, McNamara, Robert Kennedy, Burke, LeMay, Decker.'
