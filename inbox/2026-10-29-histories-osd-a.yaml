        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 463 n.62b: A-C'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 463 n.63a: D'
    section: '196103'
- add:
    entry:
      id: cal.1961-08-31.defense
      when: Aug. 31
      date: '1961-08-31'
      thread: defense
      c: 'McNamara announces a Defense Supply Agency, its director answering to the Secretary: wholesale management of the supplies the services hold in common. Up to $21 billion of stock to come under it, against $3.7 billion managed in common now; a cut in inventories of $2 to $4 billion foreseen.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 25–26. To check: DoD News Release 885-61, Aug. 31, 1961 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 26 n.38). Names: McNamara. Check: Kaplan has the agency effective Oct. 1, 1961 (20), operating from Jan. 1, 1962 (26).'
      tags:
      - name:mcnamara-robert-s
      src:
        c: dc7997de
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 25–26: all'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 26 n.38: all'
    section: '196108'
- add:
    entry:
      id: cal.1962-03-31.defense
      when: Mar. 31
      date: '1962-03-31'
      thread: defense
      c: 'The Pentagon announces 97 more installations to be closed, 11 of them abroad, 25 government-owned plants run by contractors to be sold among them: about 4,000 employees, more than $20 million a year saved.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 463. To check: *Washington Post*, Mar. 31, 1962 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 463 n.64). See [[cal.1961-03-30.defense]].'
