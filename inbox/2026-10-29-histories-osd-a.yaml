- add:
    entry:
      id: cal.1962-11-24.defense
      when: Nov. 24
      date: '1962-11-24'
      thread: defense
      c: 'The Pentagon names General Dynamics prime contractor for the TFX, the F-111A and B, over Boeing, the military evaluators'' choice. The ground, a memorandum for the record of Nov. 21 by Zuckert and Korth, approved by McNamara: either aircraft would serve; General Dynamics'' more parts in common, Boeing''s cost estimate too optimistic.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 468–69. To check: DoD News Release 1907-62, Nov. 24, 1962 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 469 n.85); Zuckert, Korth and McNamara, memorandum for the record, Nov. 21, 1962, *TFX Contract Investigation: Hearings*, pt. 2, 350–53 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 469 n.86); [[w.art-tfx-decision]]; [[w.coulam-illusions-of-choice]]; [[w.shapley-promise-and-power]]. Names: Zuckert, Korth, McNamara.'
      tags:
