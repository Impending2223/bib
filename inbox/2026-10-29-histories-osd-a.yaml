- add:
    entry:
      id: cal.1961-04-26.laos
      when: Apr. 26
      date: '1961-04-26'
      thread: laos
      c: 'Kennedy with Bowles, McNamara, Burke, Rostow and Bundy on Laos, the Cabinet Room: the cables from Vientiane, the Laotian army "on the ropes." The advisers agree a large war there unjustified, even at the loss of Laos; Kennedy refuses to decide against intervention, and presses Macmillan, through Bruce, and the British and French envoys for a cease-fire. Naval forces into the South China Sea and the Gulf of Siam; the forces for Laos under SEATO''s plans alerted.'
      n: '[FRUS 1961–63, XXIV, doc. 62](https://history.state.gov/historicaldocuments/frus1961-63v24/d62) (the meeting, by Bundy''s memorandum). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 241 (the naval forces, the alert). To check: [[w.poole-joint-chiefs-of-staff]], 98 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 241 n.51); [[w.schlesinger-thousand-days]]. Names: Kennedy, Bowles, McNamara, Burke, Rostow, Bundy, Macmillan, Bruce. Check: Kaplan''s note for the naval forces cites Harriman''s cable of May 1 ([FRUS 1961–63, XXIV, doc. 74](https://history.state.gov/historicaldocuments/frus1961-63v24/d74)), which does not name them.'
