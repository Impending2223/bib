    entry:
      id: cal.1964-11-19.defense
      when: Nov. 19
      date: '1964-11-19'
      thread: defense
      c: 'McNamara announces 95 actions to reduce, consolidate or close installations at home and abroad, the Brooklyn Navy Yard and the Springfield Armory, Mass., among them: more than 63,000 jobs in 33 States and the District. The decisions "irrevocable unless some new evidence is brought to our attention."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 465. To check: DoD News Release 822-64, Nov. 19, 1964 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 465 n.70); McNamara''s press conference, Nov. 19, 1964, *McNamara Public Statements, 1964*, IV, 1780, 1782 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 465 n.71). See [[cal.1963-12-07.defense]]. Names: McNamara. Check: the other yards as announced; Kaplan gives the yards study''s: Portsmouth, N.H., phased out by fiscal 1975, Mare Island and San Francisco joined.'
