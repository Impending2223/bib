      when: Dec. 7
      date: '1963-12-07'
      thread: defense
      c: 'McNamara to Johnson: 35 installations to be closed over three and a half years, 28 at home and 7 abroad, the San Francisco and Philadelphia Navy Yards among them. Johnson hesitates; McNamara offers to hold the two yards for the round due in November 1964, and puts the Naval Repair Facility at San Diego in their place.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 463–64. To check: McNamara to Johnson, Dec. 7, 1963, Agency File, NSF, LBJ Library (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 464 n.65); [Johnson and McNamara, 5:03 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-december-7-1963), Tape K6312.05 (Miller Center) (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 464 n.65). See [[cal.1961-03-30.defense]]. Names: McNamara, Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      src:
