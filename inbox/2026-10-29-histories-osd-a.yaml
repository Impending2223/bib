- add:
    entry:
      id: cal.1961-03-30.defense
      when: Mar. 30
      date: '1961-03-30'
      thread: defense
      c: 'The Pentagon announces 73 installations to be closed, 52 at home and 21 abroad, most of them small: Presque Isle Air Force Base, Me., the Naval Station at New Orleans and the Raritan Arsenal, N.J., among them. Savings put at $56.8 million in fiscal 1962; almost 22,000 positions cut. None of Georgia''s 19 bases on the list, the papers note.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 462–63. To check: DoD News Release 269-61, Mar. 30, 1961 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 463 n.62); *Wall Street Journal*, Mar. 31, 1961 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 463 n.63). See [[cal.1961-03-28.defense]].'
      tags:
      - name:mcnamara-robert-s
      src:
