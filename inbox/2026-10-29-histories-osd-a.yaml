- add:
    entry:
      id: cal.1960-01-07.defense
      when: Jan. 7
      date: '1960-01-07'
      thread: defense
      c: 'The 430th meeting of the NSC. Eisenhower''s approval of Gates''s recommendations noted: the ICBM program raised from 20 squadrons (9 Atlas, 11 Titan) to 27 (13 Atlas, 14 Titan); Polaris submarines from 9 to 12, three more begun in fiscal 1961, and long-lead items for three more.'
      n: '[FRUS 1958–60, III, doc. 82](https://history.state.gov/historicaldocuments/frus1958-60v03/d82) (the action, NSC Action 2168, approved Jan. 13). [[w.watson-into-the-missile-age]], 345 (the meeting, the squadrons). To check: [[w.roman-eisenhower-and-the-missile]]. Names: Eisenhower, Gates. Check: Watson has Eisenhower approve the program at the meeting; the record notes an approval already given, its action approved Jan. 13.'
      tags:
      - name:eisenhower-dwight-d
      - name:gates-thomas-s-jr
      src:
        c: 86a6b290
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d82: all'
        - 'w.watson-into-the-missile-age 345: A, B'
        - 'via w.watson-into-the-missile-age 345 n.106: B, C'
    section: '196001'
