    base: aba5bb72
    set:
      n: '[[w.schlesinger-robert-kennedy-and-his]], 888–89; [[w.witcover-85-days]], 193–94 (Creighton University, noon; the student''s question, whether the Army is not a way out of the ghettos, and the answer, "how can you say that we can deal with the problems of the poor by sending them to Vietnam?"; the last speech in the Negro section of Omaha, in the rain, "Run for the buses!"). Order: after [[cal.1968-05-13.robert-kennedy-campaign-primaries|Wahoo]], by Witcover (191–93: Wahoo "the next morning," Boys Town, then Omaha for the noon rally at Creighton). To check: Helen Dudar, "The Perilous Campaign," *New York Post*, June 5, 1968 (cited by [[w.schlesinger-robert-kennedy-and-his]], 889 n.63). Names: Robert Kennedy.'
