    base: 12ecb236
    set:
      n: '[[w.johnson-white-house-diary]], 675 (Lady Bird Johnson''s account). The day''s tour of Van Cortlandt Manor and Sunnyside with Laurance Rockefeller and Liz Carpenter (672–74) and the dinner at Brooke Astor''s (675–76) are passed over, sights and a social evening. Order: after [[cal.1968-05-18.elections-1968-republican-nomination|the tea at Tarrytown]], by Mrs. Johnson''s diary (675: "Back at Laurance and Mary''s, I changed ... and we set out for Lyndhurst"). Names: Lady Bird Johnson.'
