    set:
      n: '[[w.thomas-robert-kennedy]], 381; [[w.schlesinger-robert-kennedy-and-his]], 907 (the Portland Zoo: Kennedy dodges McCarthy; Larner, McCarthy''s speechwriter, shouts "Coward"); [[w.witcover-85-days]], 217 (the Portland zoo; Barry tells Kennedy McCarthy is approaching, "within 50 yards or so"; "Let''s get out of here"; "Coward! Chicken!" from McCarthyites; McCarthy boards the press bus and invites the reporters to his campaign). Order: after [[cal.1968-05-26.robert-kennedy-campaign-primaries|Neveh Shalom]], by Witcover (217: "Earlier, Kennedy had spoken at the Neveh Shalom Synagogue"). See [[cal.1968-05-25.robert-kennedy-campaign-2]]. Names: Robert Kennedy, McCarthy.'
