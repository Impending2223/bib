      n: '[[w.schlesinger-robert-kennedy-and-his]], 889; [[w.witcover-85-days]], 197–98 (the press room at the Sheraton-Fontenelle; the combined vote against the Administration "about 84 percent"; "I think the people want to move in a different direction. We can''t have the politics of happiness and joy when we have so many problems in our own country."). Check: the day and the occasion. Order: after [[cal.1968-05-14.robert-kennedy-campaign-primaries-2|the television remarks]], by Witcover (197: after television, the reporters'' demand, and Kennedy down to the press room). See [[cal.1968-05-14.elections-1968]]. Names: Robert Kennedy, McCarthy, Johnson, Humphrey.'
