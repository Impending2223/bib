    set:
      n: '[[w.witcover-85-days]], 185, 189 (the next day''s stories mostly give Humphrey a modest edge, 189). Order: after [[cal.1968-05-10.robert-kennedy-campaign-primaries-2|Nebraska City]], by Witcover (188–89: the motorcade through six towns "before reaching Omaha" for the dinner, "That night"). Names: Robert Kennedy, Humphrey, McCarthy.'
