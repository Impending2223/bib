      n: 'FRUS 1964–68, III, docs. [250](https://history.state.gov/historicaldocuments/frus1964-68v03/d250), [253](https://history.state.gov/historicaldocuments/frus1964-68v03/d253), [254](https://history.state.gov/historicaldocuments/frus1964-68v03/d254) (editorial note). [[w.johnson-vantage-point]], 237; [[w.gibbons-u-s-government-and]], IV, 126–27; [[w.zaroulis-who-spoke-up]], 66 (Johnson, at the Ranch, telephones his decision on the "peace offensive" to Washington late at night on Dec. 27; the Bundy brothers caught at a debutante ball); [[w.dallek-flawed-giant]], 345–46 (Johnson agrees to a bombing pause on Dec. 27, after the Christmas truce; Taylor urges a longer halt; not the call or "several more days"). [[w.preston-war-council]], 226 (Taylor, by Bundy''s report, "thinks the political reward of a solid pause is worth it at this stage"). To check: McGeorge Bundy to Johnson, Dec. 27, 1965, NSF Memos to the President—McGeorge Bundy, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 126 n.42). The time is Taylor''s call, 10 p.m. Washington time (doc. 253); Johnson told Rusk of the deferral at about 10:30 p.m. (doc. 254). See [[cal.1965-12-24.vietnam]]. Check: Gibbons (IV, 127 n.43), from McGeorge Bundy''s memorandum of Dec. 27, has Taylor now for going on with the pause "since we have endured three days." Names: Johnson, Taylor.'
