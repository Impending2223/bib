- edit:
    id: cal.1965-12-04.vietnam-pause-2
    base: 097aeb9e
    set:
      n: '[FRUS 1964–68, III, doc. 216](https://history.state.gov/historicaldocuments/frus1964-68v03/d216). [[w.gibbons-u-s-government-and]], IV, 118 n.18. Made public: FRUS 1964–68, III (1996). The order: Bundy''s memorandum, written that morning, reached the Ranch at 11 a.m. Central time ([FRUS 1964–68, III, doc. 215](https://history.state.gov/historicaldocuments/frus1964-68v03/d215), n.1); Goldberg''s talk with Rusk and Ball ran from 12:30 to 12:55 p.m. (doc. 216, n.2), and he wrote after it. Names: Goldberg, Johnson, Rusk, Ball.'
