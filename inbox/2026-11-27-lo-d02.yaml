- add:
    entry:
      also:
      - republican-party
      c: 'Eisenhower, on Rockefeller''s statement: "I see the fine hand of Emmet in this."'
      date: '1960-06-08'
      id: cal.1960-06-08.elections-1960-rockefeller
      n: '[[w.smith-on-his-own-terms]], 341 (Eisenhower "muttered" it; Smith tells it after Nixon''s remark that Rockefeller deserved "a good swift kick" and before Rockefeller''s telephone call to the White
        House of June 9). Alan Levy, "Today''s Writing: Art or Séance?," [*The Tech* (MIT), Apr. 25, 1962](http://tech.mit.edu/V82/PDF/V82-N11.pdf) (Eisenhower "remarked" it when Rockefeller "fired off
        a pre-convention blast at Nixon and the Eisenhower Administration"; Smith''s source, 341 n.). Made public: *The Tech* (MIT), Apr. 25, 1962, the earliest printing found. See [[cal.1960-06-08.elections-1960]].
        Check: the day, June 8 or 9, and to whom he said it; neither Smith nor Levy gives either. Names: Eisenhower, Rockefeller, Emmet Hughes.'
      tags:
      - name:eisenhower-dwight-d
      - name:rockefeller-nelson
      - name:hughes-emmet-john
      thread: elections-1960-rockefeller
      when: June 8–9
