      c: Katmandu. Zhou Enlai calls on Prince Himalaya, 4:30 p.m.; Chen Yi present.
      date: '1960-04-26'
      id: cal.1960-04-26.china-zhou-foreign-3
      n: 'Sino-Nepalese joint communique, Kathmandu, Apr. 29, 1960, [[w.peking-review]], no. 18 (May 3, 1960), 6 (Zhou calls on "His Royal Highness Prince Himalaya Bir Bickram Shah Deva" during the visit;
        the day not given); [[w.zhou-enlai-waijiao-huodong]], 276 (Apr. 26, 1960; 下午4时30分, 拜会喜马拉雅亲王); [[w.zhou-enlai-nianpu-1949]], II, 314 (Apr. 26, 1960; calls in turn on Koirala and Prince Himalaya);
        [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 139 (Apr. 26–29, 1960; Zhou and Chen Yi call on Himalaya Bir Bikram Shah Deva, the day not given); [[w.chen-yi-nianpu]], 813 (4:30 p.m. (下午16时30分);
        Chen Yi present when Zhou Enlai calls on Prince Himalaya Bir Bikram Shah Deva; the book has the call on Apr. 27). See [[cal.1960-04-26.china-leadership-2]]. Check: the day: the Chen Yi nianpu has
        the call on Apr. 27, 4:30 p.m., after the morning''s trip to Pokhara, and none on the 26th (813); the Waijiao huodong (276) and the Zhou nianpu (II, 314) have it on the 26th, and the Waijiao huodong
        has Zhou in talks with Koirala at Pokhara at 4 p.m. on the 27th (277). The Waijiao dashiji (139) has "the king of Nepal," 国王喜马拉雅; the communique has the Prince. Names: Zhou Enlai, Chen
        Yi.'
      place: katmandu
