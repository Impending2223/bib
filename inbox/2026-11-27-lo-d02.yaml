- edit:
    base: 696718e6
    id: cal.1960-06-16.soviet-union
    kind: correct
    set:
      c: Moscow.{1} Peng Zhen's delegation, arrived from Peking the day before, meets Kozlov of the Presidium for eight hours of argument.{2} Kozlov faults the three Lenin articles and the Peking trade-union
        meeting, in theory and in organization, a typed document of some twenty pages in hand; asked how the Bucharest meeting is to go, he says it will be settled there. The delegation cables that it is
        not a good sign.{3} Liu Xiao is there. Kozlov wants "the mutual relations of the two parties" discussed and faults the Chinese line on the epoch, war and peace, coexistence, peaceful transition,
        relations between parties, domestic policy, the "hundred flowers," the economy and India. Peng answers point by point; at the end he says the two parties should and can unite and should exchange
        views often.{4}
      date: '1960-06-17'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 279–280; [[w.brothers-in-arms]], 363 (Chen Yi to Chervonenko, Aug. 4, 1960: Peng Zhen''s talks with Kozlov at Moscow brought no unity); [[w.peng-zhen-nianpu-1902]],
        IV, 35–36 (June 17, 1960, 3 to 11:20 p.m. Moscow time, at the CPSU Central Committee''s building; Peng Zhen''s delegation with Kozlov and other Presidium members, Liu Xiao there; the Soviet side
        wants "the mutual relations of the two parties" discussed and faults the Chinese line on the epoch, war and peace, coexistence, peaceful transition, relations between parties, domestic policy, the
        "hundred flowers," the economy and India; Peng answers point by point; over eight hours; Peng at the end: the two parties should and can unite, and should exchange views often); [[w.deng-xiaoping-nianpu-1904]],
        III, 1565 n.1 (the talks of June 17, 1960). The day: the Peng Zhen nianpu dates the talks June 17 (IV, 35), with the delegation leaving Peking and reaching Moscow June 16; Wu has the delegation
        reach Moscow June 16 and meet Kozlov "the next day" (279). Made public: 1998 ([[w.brothers-in-arms]], 363, Chen Yi''s account in the Soviet record of Aug. 4, 1960). Check: [[w.friedman-shadow-cold-war]],
        52 n.105 (Kozlov''s report to the July plenum), has a Soviet delegation led by Kozlov, Kuusinen, Ponomarev and Andropov ask the Chinese delegation of Peng Zhen and Kang Sheng, at a meeting before
        the Romanian congress, "Are you looking for allies for yourselves in a struggle against the CPSU?"; it puts that meeting "at the beginning of July.". See [[cal.1960-06-12.china-leadership]]. Names:
        Peng Zhen, Kozlov, Liu Xiao.'
      range_basis: record
      src:
        c: f6317a49
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 279–280: 1, 2, 3'
        - 'w.brothers-in-arms 363: ?'
        - 'w.peng-zhen-nianpu-1902 IV, 35–36: 4'
      time_range:
      - 1960-06-17T12:00Z
      - 1960-06-17T20:20Z
      time_zone: Europe/Moscow
      when: June 17
