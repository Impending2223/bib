      c: 'Hoover to Bissell, by memorandum: a source "whose reliability has not been tested" reports that Giancana has told friends Castro is "to be done away with very shortly," in November; that he has met the assassin-to-be three times; and that a girl is to drop a "pill" in Castro''s food or drink.'
      n: '[[w.sen-church-alleged-assassination-plots]], 79 (the memorandum, Hoover to the DCI, attention the DDP, Oct. 18, 1960, as the report quotes it). Made public: 1975. To check: Hoover to the DCI (Att: DDP), memorandum, Oct. 18, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 79). See [[cal.1960-09.cuba-4]]. Names: Hoover, Bissell, Giancana, Castro.'
      tags:
