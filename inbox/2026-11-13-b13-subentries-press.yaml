- edit:
    id: cal.1962-05-23.immigration
    base: 660d9525
    set:
      part_of: cal.1962-05-23.press-and-broadcasting
      c: 'Hong Kong, the refugees from the mainland: several thousand cleared by American consuls to be admitted under the Attorney General''s parole power, as the Hungarians and the Cubans were; food already sent for about half a million refugees there.'
      n: '[1962 Pub. Papers 431](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=491), at 431. To check: [[w.bon-tempo-americans-at-the-gate]]. See [[cal.1960-07-14.immigration]].'
- edit:
    id: cal.1962-05-23.medicare
    base: ddca1b3c
    set:
      part_of: cal.1962-05-23.press-and-broadcasting
      follows:
      - cal.1962-05-23.immigration
      c: 'The mail on his Medicare speech about evenly divided; but the mail no true indicator: "I got last week 28 letters on Laos ... [and] 440 letters on the cancellation of a tax exemption for a ''mercy'' foundation."'
      n: '[1962 Pub. Papers 431](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=491), at 432. [[w.sorensen-kennedy]], 332–33 (the mail, from "a 1962 press conference"). See [[cal.1962-05-20.medicare]]. Names: Kennedy.'
