- edit:
    id: cal.1966-10-06.vietnam-asian-trip
    base: 5f0d130e
    set:
      part_of: cal.1966-10-06.press-and-broadcasting
      c: 'Johnson names Sol Linowitz Ambassador to the Organization of American States, Llewellyn Thompson Ambassador to the Soviet Union and Ellsworth Bunker, as Mrs. Johnson has it, "Ambassador to the government of Vietnam." The trip: from Oct. 17, seventeen days, twenty-five thousand miles, New Zealand, Australia, the Philippines, Thailand, Malaysia, South Korea, a refueling stop in Alaska; the Manila Conference of all the nations in the war "the important business"; Mrs. Johnson to go. On the Great Society: "When you pass eighty-five bills out of ninety recommended, I think that is a pretty good box score."'
- edit:
    id: cal.1966-10-06.cities-and-housing
    base: a72c655c
    set:
      part_of: cal.1966-10-06.press-and-broadcasting
      follows:
      - cal.1966-10-06.vietnam-asian-trip
      c: Demonstration Cities "one of the most important pieces of legislation for the good of all American mankind that we can act upon this session," the push the Speaker's meeting asked for.
      n: '[1966 Pub. Papers 1117](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=491), at 1119. [[w.califano-triumph-and-tragedy-of]], 135; [[w.dallek-flawed-giant]], 321 (Oct. 6, press conference: no domestic problem "more critical than rebuilding our cities"; demonstration cities "one of the most important pieces of legislation for the good of all American mankind that we can act upon this session"; not the Speaker''s meeting); [[w.johnson-white-house-diary]], 428–29 (the news conference, the East Room, 3 p.m., Mrs. Johnson in the front row; among the questions "the Cities Bill"; not the words in the entry). Names: Johnson, McCormack.'
