- edit:
    id: cal.1965-07-13.court
    base: 91bb275f
    set:
      part_of: cal.1965-07-13.press-and-broadcasting
      n: '[1965 Pub. Papers 735](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=209), at 736, 742; Remarks at the Swearing In of Judge Thurgood Marshall as Solicitor General, [1965 Pub. Papers 910](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=384) (Aug. 24, 1965). [111 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf) (1965). [[w.branch-at-canaans-edge]], 261; [[w.johnson-white-house-diary]], 295–96 (the news conference, watched on television at the Ranch; Thurgood Marshall "the first Negro to hold such a post," Solicitor General; not the circuit or the number). [[w.kotz-judgment-days]], 330 (the answer, after Ford''s charge of inconsistency). To check: [[w.williams-thurgood-marshall]]. Names: Marshall, Cox. Check: the page.'
- edit:
    id: cal.1965-07-13.transition-and-staff
    base: 8c65ee2b
    set:
      part_of: cal.1965-07-13.press-and-broadcasting
      follows:
      - cal.1965-07-13.court
      c: 'Watched at the Ranch: Leonard Marks named to head the USIA, replacing Carl Rowan; Penelope Thunberg a Tariff Commissioner. Asked whether Rusk may resign: "None whatever. ... He sits to my right in the Cabinet Room, he ranks first in the Cabinet, and he ranks first with me."'
