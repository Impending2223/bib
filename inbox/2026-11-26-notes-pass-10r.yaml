    tags:
    - name:liao-zhigao
    - name:li-dazhang
- add-words:
    id: cal.1960-09-05.vietnam
    after: end
    words: The Congress opens Sept. 5 with 525 delegates and 56 alternates, for over 500,000 Party members.
    item: '[[w.lich-su-khang-chien-chong-my]], III, 57'
- add-words:
    id: cal.1961-03-11.cuba
    after: end
    words: 'Bissell''s refinement: a diversionary landing elsewhere, by 160 men, to seize a beachhead next to ground fit for guerrillas.'
    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 179'
- add-words:
    id: cal.1969-10-18.china-leadership
    after: end
    words: Lin's six-point directive is titled "On Strengthening Defenses and Guarding against an Enemy Surprise Attack." Huang sends it to the eleven military regions, the navy, the air force and the Peking Garrison.
    item: '[[w.macfarquhar-maos-last-revolution]], 318'
- add-words:
    id: cal.1969-10-17.china-leadership
    after: end
    words: Wang Dongxing, Mao's chief bodyguard, helps Zhou with the moving of the leaders.
    item: '[[w.teiwes-tragedy-of-lin-biao]], 113'
- names:
    id: cal.1969-10-17.china-leadership
    add:
    - Wang Dongxing
    tags:
    - name:wang-dongxing
- names:
    id: cal.1960-07-14.china-leadership
