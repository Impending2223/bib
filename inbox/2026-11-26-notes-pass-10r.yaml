- add-words:
    id: cal.1960-08-18.china-leadership
    after: end
    words: The 203rd meeting, Peng Zhen presiding. Drought has hit 650 million mu this spring. Agriculture first; capital projects stopped as planned; grain shipped on time; rations arranged to next summer's harvest; Shanxi, Hebei, Shandong and Henan to report within a fortnight. Bo Yibo, Wang Heshou, Yao Yilin and others sit in.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 51–52'
- names:
