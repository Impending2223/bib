- add-words:
    id: cal.1960-12-23.china-leadership
    after: end
    words: In Liao Zhigao's letter of Dec. 25, Mao says that perhaps 90 percent of the cadres are good, the last three kinds, and asks how fit the 10 percent figure is for the first three.
    item: '[[w.yang-jisheng-mubei]], II, 1139–1141 n.63'
- names:
    id: cal.1960-12-23.china-leadership
