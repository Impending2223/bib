- add-words:
    id: cal.1960-03.china-leadership-11
    after: end
    words: By the end of February 880,000 water works built or repaired, 30,000 of them new reservoirs; seven million laborers out on manure; a plan for 40 million pigs.
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 78 n.1'
- add-words:
    id: cal.1960-02-27.china-leadership-6
    after: end
    words: 45,000 cadres sent out; 24 backward counties and cities, 260-odd cadres to sit in them.
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 80 n.1'
- add-words:
