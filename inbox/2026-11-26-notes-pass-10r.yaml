    after: end
    words: 'Peng Zhen attends the 175th meeting. A piece of Lenin on the commune is proposed for the four volumes. Also on the agenda: overcoming the "five too many" (meetings, papers and returns, sitting in offices, routine business, general calls) and scientific secrecy.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 12'
- names:
