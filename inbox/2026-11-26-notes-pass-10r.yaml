- edit:
    id: cal.1960-11-18.china-leadership-3
    base: 0cf723cd
    kind: correct
    set:
      n: '[[w.yang-shangkun-riji]], I, 610–612 (Nov. 18, 1960); [[w.peng-zhen-nianpu-1902]], IV, 75–76 (Nov. 18, 1960, all day; Peng Zhen at the eighth plenary, ten speakers (morning Romania, Belgium, Paraguay, Turkey, Guatemala; afternoon Jordan, Mongolia, New Zealand, West Germany, Sudan); Wilcox of New Zealand: Khrushchev''s "no arms, no armies, no war" spreads illusions; peaceful transition in the capitalist centers doubtful; "factional activity" better left out, China not warlike; differences to be settled by consultation). The words: 上午……下午到会 (I, 610). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Gheorghiu-Dej, Tsedenbal, Wilcox, Reimann, Yang Shangkun.'
- edit:
    id: cal.1960-11-21.soviet-union
    base: c2ed8347
    kind: correct
    set:
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 389–390 ("on the 21st"); [[w.yang-shangkun-riji]], I, 618–621 (Nov. 21, 1960; Monje (Bolivia), Ba Thein Tin (Burma: fully against the Soviet view), the Costa Rican, the Malayan, Ghosh (India: against China on the border, for striking the factional passage); afternoon the Thai, the Ecuadorian, the Algerian; the session to 2:45 p.m.); [[w.peng-zhen-nianpu-1902]], IV, 77 (Nov. 21, 1960, all day; Peng Zhen at the tenth plenary; Bolivia, Burma, Costa Rica, Malaya, India, Thailand, Ecuador, Algeria; Ba Thein Tin of Burma, its general secretary: the "three noes" possible only after socialism wins the world; the Twentieth Congress''s peaceful transition split the Burmese party in armed struggle, its leaders defecting, its guerrillas deserting; the Burmese, Thai and Malayan parties wrote to the CPSU in 1957; "group factions" and "national communism" to go). Made public: 1999. See [[cal.1960-11-14.soviet-union-2]]. Check: the account is the Chinese delegation''s; Wu says the CPSU planned it.'
- edit:
    id: cal.1961-02.china-leadership-3
    base: 0b00e7fd
    kind: correct
    set:
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 103–104; [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 168–179 (the Center 中共中央 forwards the Central Culture and Education Small Group''s 中央文教小组 report "On the arrangement of culture and education work in 1961 and for a period to come" 《关于一九六一年和今后一个时期文化教育工作安排的报告》 on Feb. 7, 1961, to be followed: rural students over sixteen held to about 2 percent of the rural labor force for three to five years, 172; quality first in higher education, 173; enrolment for 1961, higher schools 250,000, 94,000 fewer than in 1960; printed from the Central Committee''s document). Made public: 1997. To check: [[w.zhonghua-renmin-gongheguo-jiaoyu]], 285, 288–89 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 103 n.80a); [[w.zhongguo-jiaoyu-nianjian-1949]], 93 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 103 n.80b).'
- check:
    id: cal.1969-10-17.china-leadership
    text: 'Check: the part of the day: [[w.zhou-enlai-nianpu-1949-2020]], III, 322, has the talks "that evening" (当晚), and [[w.chen-yi-nianpu]], 1213, the display in the evening; [[w.liu-jixian-ye-jianying-nianpu]], II, 985, and [[w.zhu-de-nianpu-xinbian]], III, 1970, put the display in the afternoon.'
- check:
    id: cal.1960-08.elections-1960-8
    text: 'Check: the day: the APP text of the Hyde Park speech (read) has Kennedy there Aug. 14, a Sunday, thanking Mrs. Roosevelt; O''Donnell (227–28) has the visit on a Sunday. The speech is [[cal.1960-08-14.medicare]].'
- check:
    id: cal.1961-03-23.laos
    text: 'Check: the 12,000 of [[w.vietnam-victory-in-vietnam]] is its note''s total of Vietnamese volunteers in Laos "during this campaign" (456 n.21), not a strength of March 1961; the units'' going into Laos is [[cal.1961.laos]].'
- add-words:
    id: cal.1960-10-21.china-leadership-8
    after: end
    words: By Dikötter's account the report puts 80,000 dead in Zhengyang county, where an earlier inquiry had counted 18,000, and one villager in ten starved in Suiping.
    item: '[[w.dikotter-maos-great-famine]], 116'
- check:
    id: cal.1960-10-21.china-leadership-8
    text: 'Check: Dikötter (116) has the report come from the Ministry of Supervision.'
- cite:
