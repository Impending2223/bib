    item: '[[w.peng-zhen-nianpu-1902]], IV, 18'
- names:
    id: cal.1960-04-16.china-leadership-6
    add:
    - Deng Xiaoping
    - Peng Zhen
    tags:
    - name:deng-xiaoping
    - name:peng-zhen
- add-words:
    id: cal.1960-06-04.china-leadership-3
    after: end
    words: 'Peng speaks: American imperialism, having wrecked the summit, talks of "peace efforts" while it makes tension everywhere and arms madly.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 32–33'
- names:
    id: cal.1960-07-14.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
