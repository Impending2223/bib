    tags:
    - name:khrushchev-nikita-s
- add-words:
    id: cal.1960-07-31.china-leadership
    after: end
    words: 'Zhou, at Mao''s request: "We must defend our honor and repay all the debts we owe them."'
    item: '[[w.jian-zhou-enlai]], 453'
- add-words:
    id: cal.1969-10-18.china-leadership
    after: end
    words: Under the order 95 divisions, some 940,000 men, 4,100 aircraft, many tanks and guns and 600 ships are dispersed and hidden.
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 738'
- names:
    id: cal.1960-02-04.cuba
    add: []
    tags:
    - ok:note-substance
- add-words:
    id: cal.1960-03-24.china-leadership-2
    after: end
    words: 'Hu Qiaomu, Chen Boda, Kang Sheng and Wu Lengxi are at Tianjin with them. At the opening Liu Shaoqi proposes that Mao Zedong thought not be split from Marxism–Leninism. Deng: at home, "Marxism–Leninism, Mao Zedong thought," with a pause between; Mao agrees, and says abroad only Marxism–Leninism.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 254–255'
- names:
    id: cal.1960-03-24.china-leadership-2
    add:
    - Hu Qiaomu
    - Chen Boda
    - Kang Sheng
    - Wu Lengxi
    tags:
    - name:hu-qiaomu
    - name:chen-boda
    - name:kang-sheng
    - name:wu-lengxi
- add-words:
    id: cal.1960-10-02.soviet-union
    after: end
    words: Wu Lengxi and Chen Boda, left in Peking, turn the delegation's cables into suggestions for the Standing Committee, which cables back.
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 367'
- names:
    id: cal.1960-10-02.soviet-union
    add:
    - Wu Lengxi
    tags:
    - name:wu-lengxi
- add-words:
    id: cal.1960-11-07.soviet-union-2
    after: end
    words: 'The letter runs over 80,000 characters, 91 pages in Chinese. Andropov gives it to Liu Xiao and hopes it is not tied to the meeting: "the meeting is the meeting, the answer is the answer." Liu Shaoqi has the delegation read it.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70–71'
- check:
    id: cal.1960-11-07.soviet-union-2
    text: 'Check: Peng Zhen nianpu (IV, 71) has Andropov give the letter to Liu Xiao after the morning ceremony ended, the delegation reading it in the afternoon; Deng nianpu (III, 1593) has it handed that morning.'
- names:
    id: cal.1960-11-07.soviet-union-2
    add:
    - Liu Xiao
    tags:
    - name:liu-xiao
- add-words:
    id: cal.1960-11-09.soviet-union-2
    after: end
    words: Ponomarev and Andropov come too, at 5 p.m., to Liu Shaoqi's lodging; Liu, Deng and Peng answer in turn, the quarrel is theirs.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 72'
- names:
    id: cal.1960-11-09.soviet-union-2
    add:
    - Ponomarev
    - Andropov
    - Liu Shaoqi
    tags:
    - name:ponomarev-boris-n
    - name:andropov-yuriy-vladimirovich
    - name:liu-shaoqi
- add-words:
    id: cal.1960-11-14.soviet-union-2
    after: end
    words: Peng Zhen is at the plenary.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 74'
- names:
    id: cal.1960-11-14.soviet-union-2
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1960-11-18.china-leadership-3
    after: end
    words: 'Wilcox: Khrushchev''s "no arms, no armies, no war" spreads illusions; peaceful transition in the capitalist centers is doubtful; "factional activity" is better left out; China is not warlike; differences to be settled by consultation. Peng Zhen attends.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 75–76'
- names:
    id: cal.1960-11-18.china-leadership-3
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1960-11-21.soviet-union
    after: end
    words: 'Eight parties speak: Bolivia, Burma, Costa Rica, Malaya, India, Thailand, Ecuador, Algeria. Ba Thein Tin, Burma''s general secretary, disagrees wholly with the CPSU: the "three noes" are possible only after socialism wins the world; when the Twentieth Congress put forward peaceful transition, the party''s revisionists called for giving up armed struggle, and leaders defected and guerrillas deserted; "group factions" must not go into the resolution, and "national communism" must go. Peng Zhen attends.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 77'
- names:
    id: cal.1960-11-21.soviet-union
    add:
    - Peng Zhen
    - Ba Thein Tin
    tags:
    - name:peng-zhen
    - name:thakin-ba-thein-tin
- add-words:
    id: cal.1960-11-26.soviet-union-2
    after: end
    words: 'Liu Shaoqi and Yang Shangkun are there. Liu: the visit depends on the meeting''s result; since the Nov. 5 letter the meeting runs on a wrong line and has come to the edge. The talk runs three hours.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 79–80'
- names:
    id: cal.1960-11-26.soviet-union-2
    add:
    - Yang Shangkun
    tags:
    - name:yang-shangkun
- add-words:
    id: cal.1960-12-23.china-leadership
    after: end
    words: Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Tan Zhenlin and Peng Zhen are there.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 86'
- add-words:
    id: cal.1960-12-30.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 88'
- names:
    id: cal.1960-12-30.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1961-01-13.china-leadership
    after: end
    words: 'Peng Zhen interjects, when Mao says industry should seek quality and variety, not quantity: productivity is low for three reasons, too many non-productive staff, too many trainees and apprentices, the low technique of the "small native and foreign groups."'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 91'
- names:
    id: cal.1961-01-13.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1961-01-25.china-leadership-2
    after: end
    words: 'Peng Zhen is there, at the 232nd meeting, on college textbooks, the theory corps and rail transport. Peng: rules in industry set up before the old are broken; so with textbooks. Jiang Nanxiang to be told: in science no new books issued, the old not dropped. Hu Sheng to write the philosophy text, approved by the end of March, Peng to arrange printing. The fifth and sixth volumes of Mao''s *Selected Works* put off: some of his talks are settled views, some thoughts on the way, not to be spread about.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 94'
- names:
    id: cal.1961-01-25.china-leadership-2
    add:
    - Peng Zhen
    - Jiang Nanxiang
    - Hu Sheng
    tags:
    - name:peng-zhen
    - name:jiang-nanxiang
    - name:hu-sheng
- add-words:
    id: cal.1961-01-27.china-leadership-2
    after: end
    words: 'Peng Zhen is there, Zhou attending. Timber: 3 million cubic meters waiting in the north; the 72 forestry bureaus sent down in 1958 to come under the Center and provinces jointly, later the Center; pit props first. Coal: 710,000 tons a day in the first quarter of last year, 570,000 now, attendance 70 to 80 percent; the 61 big mines'' coal to be allotted by the Center.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 95–96'
- names:
    id: cal.1961-01-27.china-leadership-2
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1961-02-14.china-leadership
    after: end
    words: 'The 238th meeting, Peng Zhen presiding. Peng: if output reaches 500,000 tons a day in late February, allot nine-tenths; the Datong mines are supplied, attendance only 70 percent; warnings to the metallurgy, railway and machinery ministries. Zhou reports the grain shortage in the provinces; Tan Zhenlin to draft a paper to squeeze grain for workers from the non-working and light workers; no hope to be put in imported grain.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 102–103'
- names:
    id: cal.1961-02-14.china-leadership
    add:
    - Peng Zhen
    - Tan Zhenlin
    tags:
    - name:peng-zhen
    - name:tan-zhenlin
- add-words:
    id: cal.1961-02-22.china-leadership-3
    after: end
    words: Liu Shaoqi presides, 10 p.m. to 1 a.m.; Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 107'
- names:
    id: cal.1961-02-22.china-leadership-3
    add:
    - Liu Shaoqi
    - Peng Zhen
    tags:
    - name:liu-shaoqi
    - name:peng-zhen
- add-words:
    id: cal.1961-03-07.china-leadership-2
    after: end
    words: 'Peng Zhen is there, Chen Yun attending, at the 241st meeting. Deng relays Mao: Khrushchev''s letter of Feb. 27 offers a million tons of wheat on loan and 500,000 tons of Cuban sugar; the grain not wanted, the sugar acceptable. Also: communes and teams made smaller; a two-year and a seven-year plan; fewer papers, more investigation; Mao has views of the Secretariat''s and the departments'' work.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 110'
- names:
    id: cal.1961-03-07.china-leadership-2
    add:
    - Peng Zhen
    - Chen Yun
    - Khrushchev
    tags:
    - name:peng-zhen
    - name:chen-yun
    - name:khrushchev-nikita-s
- add-words:
    id: cal.1961-04-03.china-leadership-5
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 116–117'
- names:
    id: cal.1961-04-03.china-leadership-5
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1960-04-22.china-leadership-4
    after: end
    words: The meeting opens at 3; Lu's report ends at 4:15, warmly received; a concert follows, 5 to 6. Yang Shangkun and Li Bozhao are there from 2.
    item: '[[w.yang-shangkun-riji]], I, 501'
- names:
    id: cal.1960-04-22.china-leadership-4
    add:
    - Yang Shangkun
    - Li Bozhao
    tags:
    - name:yang-shangkun
    - name:li-bozhao
- check:
    id: cal.1960-10-02.soviet-union
    text: 'Check: the day: Yang''s diary (I, 558–559) also has the committee''s first session Oct. 1, 1 to 3 p.m., in St. George''s Hall.'
- add-words:
    id: cal.1960-11-09.soviet-union-2
    after: end
    words: 'Mikoyan: the 1,300 lorries and part of the oil, refused by the departments, are to be settled; experts can be sent again, 38 still in China.'
    item: '[[w.yang-shangkun-riji]], I, 592'
- add-words:
    id: cal.1960-11-14.soviet-union-2
    after: end
    words: Kim Il of the Korean party speaks first, forty minutes. Deng reads from the text, a twenty-minute break after the third part; the Soviet Presidium's faces darken. The session breaks up at 3:30 p.m.
    item: '[[w.yang-shangkun-riji]], I, 600'
- check:
    id: cal.1960-11-14.soviet-union-2
    text: 'Check: the session''s hour and Kim Il''s length: Yang (I, 600) has it open at 10 a.m., Kim Il forty minutes, Deng four hours, the day ending at 3:30 p.m.; Wu (381) has Deng speak in the afternoon after Kim Il''s whole morning; Peng Zhen nianpu (IV, 74) puts the plenary in the morning.'
- add-words:
    id: cal.1960-11-21.soviet-union
    after: end
    words: 'Monje of Bolivia argues against China: the Twentieth and Twenty-first Congresses cannot be struck; the minority should follow the majority. Ghosh of India, though he blames China on the border, still holds that the passage on factional activity should be struck.'
    item: '[[w.yang-shangkun-riji]], I, 619'
- check:
    id: cal.1961-03-07.china-leadership-2
    text: 'Check: Yang (I, 660–661) has Mao''s points as a two-year plan and an eight-year plan; Deng nianpu (III, 1620–21) and Peng Zhen nianpu (IV, 110) a seven-year plan.'
- names:
    id: cal.1960-11-21.soviet-union
    add:
    - Ghosh
    tags:
    - name:ghosh
- add-words:
    id: cal.1960-03-31.china-leadership-3
    after: end
    words: Deng Xiaoping presides. On the *Lenin Selected Works*, the editors are to report what the Soviet editions cut and changed and what the four volumes add; the point against the Soviets is whether there must be violent revolution. Li Lisan reports the light industry conference on technical revolution. The control commissions are to catch bad men and bad deeds.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1537'
- names:
    id: cal.1960-03-31.china-leadership-3
    add:
    - Deng Xiaoping
    - Li Lisan
    tags:
    - name:deng-xiaoping
    - name:li-lisan
- names:
    id: cal.1960-07-14.china-leadership
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1960-07-31.china-leadership
    after: end
    words: Deng Xiaoping attends.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1569'
- names:
    id: cal.1960-07-31.china-leadership
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1960-08-03.china-leadership-4
    after: end
    words: Deng Xiaoping presides.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1569'
- names:
    id: cal.1960-08-03.china-leadership-4
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1960-10-02.soviet-union
    after: end
    words: In its eight plenaries and eleven secretariat sessions the committee disputes the epoch, peaceful coexistence and transition, war and peace, disarmament, "going it alone" and "national communism," revisionism and dogmatism, factions, the cult of personality and the Twentieth and Twenty-first Congresses. No agreement on banishing world war, on factions or on the two Congresses; they are left to the November meeting of eighty-one parties.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1580'
- names:
    id: cal.1960-10-02.soviet-union
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1960-12-30.china-leadership
    after: end
    words: Deng Xiaoping asks Chen Yun what poultry and eggs will earn abroad in 1961.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1608'
- names:
    id: cal.1960-12-30.china-leadership
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1961-01-13.china-leadership
    after: end
    words: 'Deng interjects, on Mao''s remarks on productivity: big, middle and small together; small first, but in the long run the middle road, the stress on the middle.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1611–1612'
- names:
    id: cal.1961-01-13.china-leadership
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1961-01-25.china-leadership-2
    after: end
    words: 'Deng presides. Railways: all power to the ministry, with political departments and commissars, the old rules restored. Private plots to stay unchanged for twenty years. Textbooks for the universities. Mao''s talks to be printed only with his review; his works not to be misused. Two volumes of Liu Shaoqi''s works, some 800,000 characters. Theorists drawn to the center for *Hongqi*, the *Renmin ribao* and the Propaganda Department; frontier-science researchers at the Academy spared going down.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1615–1616'
- names:
    id: cal.1961-01-25.china-leadership-2
    add:
    - Deng Xiaoping
    - Liu Shaoqi
    tags:
    - name:deng-xiaoping
    - name:liu-shaoqi
- add-words:
    id: cal.1961-01-27.china-leadership-2
    after: end
    words: Deng presides.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1617'
- names:
    id: cal.1961-01-27.china-leadership-2
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1961-03-07.china-leadership-2
    after: end
    words: 'Deng presides. Mao, at Guangzhou, has talked with Zhang Pinghua and with Deng and others, and means the communes cut smaller after spring sowing wherever possible, the powers of commune, brigade and team fixed in regulations against levelling and blind command. Industry to rise steadily: a two-year plan by the end of March, then a seven-year plan from 1963. Civil aviation to go under the air force.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1620–1621'
- names:
    id: cal.1961-03-07.china-leadership-2
    add:
    - Zhang Pinghua
    tags:
    - name:zhang-pinghua
- add-words:
    id: cal.1960-04-22.china-leadership-4
    after: end
    words: Luo Ronghuan, Li Fuchun and He Long are there too.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1772–1773'
- names:
    id: cal.1960-04-22.china-leadership-4
    add:
    - Luo Ronghuan
    - Li Fuchun
    - He Long
    tags:
    - name:luo-ronghuan
    - name:li-fuchun
    - name:he-long
- add-words:
    id: cal.1960-06-02.china-leadership-4
    after: end
    words: Zhu De attends, in the morning.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1777'
- names:
    id: cal.1960-06-02.china-leadership-4
    add:
    - Zhu De
    tags:
    - name:zhu-de
- check:
    id: cal.1960-07-31.china-leadership
    text: 'Check: Zhu De nianpu (III, 1780) has Zhu De at the Politburo Standing Committee on July 28, 30 and 31, on grain, frontier science and the note on the experts'' recall; the line has the plenary session.'
- add-words:
    id: cal.1960-10-01.china-leadership-11
    after: end
    words: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao and Dong Biwu are on the gate tower with 500,000 people in the square.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1783'
- names:
    id: cal.1960-10-01.china-leadership-11
    add:
    - Mao Zedong
    - Liu Shaoqi
    - Zhou Enlai
    - Zhu De
    - Chen Yun
    - Lin Biao
    - Dong Biwu
    tags:
    - name:mao-zedong
    - name:liu-shaoqi
    - name:zhou-enlai
    - name:zhu-de
    - name:chen-yun
    - name:lin-biao
    - name:dong-biwu
- add-words:
    id: cal.1961-01-13.china-leadership
    after: end
    words: 'Zhu De speaks to the plenary: a good meeting; "agriculture, light, heavy" has been said but heavy, light, agriculture done; less steel built if need be, more put into light industry, as a long-term line; exports to be chiefly light-industry goods, not farm and side products.'
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1790'
- names:
    id: cal.1961-01-13.china-leadership
    add:
    - Zhu De
    tags:
    - name:zhu-de
- add-words:
    id: cal.1969-10-17.china-leadership
    after: end
    words: 'The meeting is in the gymnasium after the sports display. With Zhou are Dong Biwu, Zhu De, Chen Yun, Ye Jianying, Chen Yi, Deng Zihui, Li Fuchun, Zhang Dingcheng and others. Zhou: the Chairman, by the present situation, has decided that some comrades leave Peking before the 20th or a little after, and has named each one''s place; Zhou will telephone the arrangements, the Center''s General Office ready special planes or trains.'
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1970'
- names:
    id: cal.1969-10-17.china-leadership
    add:
    - Deng Zihui
    - Li Fuchun
    - Zhang Dingcheng
    tags:
    - name:deng-zihui
    - name:li-fuchun
    - name:zhang-dingcheng
- add-words:
    id: cal.1960-12-30.china-leadership
    after: 'Chen Yun 陈云: 1961 will be no better than 1960; rest the people and the animals, and import grain.'
    words: 'His words: "eating first, construction second"; someone adds "the market second, construction third," and Mao sums it up so.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 61–62'
- add-words:
    id: cal.1961-02-22.china-leadership-3
    after: end
    words: 'Chen Yun: the factories have 20 percent more workers than they need, and five million sent home would add much farm labor; purchasing power exceeds goods by 10 billion yuan: more goods, less spending, more high-priced sweets, restaurants and yarn, price rises kept narrow so as not to hurt bank savings. Townspeople hold 2.5 billion yuan in savings, commune members 1.5 billion, the rest in their pockets. Goods to the villages before the towns, to buy farm produce.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 75'
- add-words:
    id: cal.1960-03-24.china-leadership-2
    after: end
    words: 'Zhou: some have set the two against each other, and some vulgarize, calling everything Mao Zedong thought. Liu: Marxism–Leninism and Mao Zedong thought are not to be made two things. Peng Zhen: some articles handle Mao''s leadership and the collective badly. Mao: a report to the Center headed "the Chairman and the Center" will not do.'
    item: '[[w.zhou-enlai-nianpu-1949]], II, 296–297'
- add-words:
    id: cal.1960-07-31.china-leadership
    after: end
    words: 'Zhou reports on Sino-Soviet relations: the recall will bear on projects, science, defense technology, the peaceful use of atomic energy, students abroad, propaganda, international exchanges and foreign trade.'
    item: '[[w.zhou-enlai-nianpu-1949]], II, 336'
- add-words:
    id: cal.1960-03-15.china-leadership-2
    after: end
    words: His letter to Liu and Deng asks the Central meeting to pass the three drafts and issue them within seven to ten days to the first secretaries.
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 76'
- add-words:
    id: cal.1960-03-15.china-leadership-2
    after: end
    words: On the mess halls Mao inserts that the nation should aim at 80 percent of rural people eating in halls, seven provinces and cities already over 90 percent, the rest not to be forced, two or three years; starch from plant stalks "a great invention."
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 82–89'
- add-words:
    id: cal.1960-09-30.china-leadership
    after: end
    words: 'Mao on France: China will deal with it only if it breaks with Chiang Kai-shek and leaves China''s aid alone; its 800,000 troops cost 3 billion francs a day and will bring it down. China fought twenty-two years, its army cut from 300,000 to some 20,000, and won back by policy. The points are the typed copy Zhou hands Abbas on Oct. 6.'
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 342–344'
- names:
    id: cal.1960-09-30.china-leadership
    add:
    - Chiang Kai-shek
    tags:
    - name:chiang-kai-shek
- add-words:
    id: cal.1960-11-15.china-leadership
    after: end
    words: Mao adds that those who go need the will not to fear hardship, else they must not go; two-thirds of the country is fine, a third bad, to be turned round within five months for a great harvest in 1961.
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 398–399'
- add-words:
    id: cal.1961-01-18.china-leadership-2
    after: end
    words: 'The request, "On some questions of foreign trade in 1961": grain imports raised from 2.2 billion jin to 8 billion, the 1 billion for re-export apart, all bought from capitalist countries.'
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 182–183'
- add-words:
    id: cal.1961-02.china-leadership-3
    after: end
    words: 'Enrolment for 1961: higher schools 250,000, 94,000 fewer than in 1960; secondary specialist schools 500,000, 110,000 fewer; ordinary middle schools 3,350,000, 990,000 fewer.'
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 176'
- add-words:
    id: cal.1961-04-03.china-leadership-5
    after: end
    words: 'Agriculture first: over 500 million people are in the villages, some 40 percent of them laborers, who must grow the grain that feeds the towns.'
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 238–239'
- add-words:
    id: cal.1960-07-14.china-leadership
    after: end
    words: 'Zhou''s report holds that the Comintern''s founding and its dissolution were each needed, and treats three periods: 1919–27, more good than harm; 1927–35, mostly wrong, with the greatest influence on the Chinese party; 1935–43, less interference than in the first and still less than in the second.'
    item: '[[w.zhou-enlai-nianpu-1949]], II, 331–333'
- add-words:
    id: cal.1960-07-14.china-leadership
    after: end
    words: 'Zhou divides the Party''s relations with the Comintern and the Soviets into five periods: Moscow "good on the two ends but bad in the middle." The struggle with Khrushchev will be long and complex, to be waged for unity, not a split.'
    item: '[[w.jian-zhou-enlai]], 452–453'
- add-words:
    id: cal.1960-07-14.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 46'
- add-words:
    id: cal.1960-07-14.china-leadership
    after: end
    words: Deng Xiaoping attends.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1566'
