    - name:bo-yibo
    - name:wang-heshou
    - name:yao-yilin
- add-words:
    id: cal.1960-12-23.china-leadership
    after: end
    words: By Liao Zhigao's letter of Dec. 25 to Li Dazhang, Mao says perhaps 90 percent of the cadres are good, the last three kinds, and asks whether 10 percent is right for the first three.
    item: '[[w.yang-jisheng-mubei]], II, 1140'
- names:
    id: cal.1960-12-23.china-leadership
    add:
