- names:
    id: cal.1960-07-31.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1960-08-03.china-leadership-4
    after: end
    words: It adopts in the main the draft directive on the whole Party taking hold of agriculture and grain. Zhou Enlai attends; Peng Zhen is there.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 49'
- names:
    id: cal.1960-08-03.china-leadership-4
    add:
    - Zhou Enlai
    - Peng Zhen
    tags:
    - name:zhou-enlai
    - name:peng-zhen
- add-words:
    id: cal.1960-08-18.china-leadership
    after: end
    words: The 203rd meeting, Peng Zhen presiding. Drought has hit 650 million mu this spring. Agriculture first; capital projects stopped as planned; grain shipped on time; rations arranged to next summer's harvest; Shanxi, Hebei, Shandong and Henan to report within a fortnight. Bo Yibo, Wang Heshou, Yao Yilin and others sit in.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 51–52'
- names:
    id: cal.1960-08-18.china-leadership
    add:
    - Peng Zhen
    - Bo Yibo
    - Wang Heshou
    - Yao Yilin
    tags:
