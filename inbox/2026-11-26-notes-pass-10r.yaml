patch: notes-pass-10r
by: 'Claude (reader; the notes pass, batch 10r: R33a, building on the entry from its cites); audited by Claude (Opus), Nov. 27, 2026 (notes/notes-pass/audit-10.md)'
ops:
- edit:
    id: cal.1969-12-05.soviet-union-leadership
    base: bf9a42fc
    kind: correct
    set:
      c: 'Moscow. Brezhnev with Ceaușescu. His notes of Ceaușescu: the irritants in the relations of the parties and the countries to be removed, on both sides; no agreement for 1970 on coke; military equipment, aircraft among it, not delivered in 1969, and cooperation between aircraft plants; an agreement for 1971–75 and a meeting of the two governments'' delegations.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 433–34 (№ 97, Brezhnev''s notes of Ceaușescu''s statement, Dec. 5), 451–52 nn.270–274 (the editors: Ceaușescu on relations of the RCP and CPSU, coke, the shortfall in the 1965–70 supply agreement, military cooperation, the 1971–75 agreement). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 376 (the secretaries'' record, Dec. 5: Brezhnev, with Kosygin, Podgorny and Katushev, receives Ceaușescu''s delegation in the new hall of the Central Committee, 11 to 11:45, and sees it off). The notes of № 98 (I, 434), "О положении в партии" (on the situation in the party), are of Brezhnev''s talk with Husák that day, by the editors (I, 434 n.a; 452 n.275), and are entered with it. Made public: 2016. To check: the Romanian record. Names: Ceaușescu, Brezhnev.'
      time: 1969-12-05T08:00Z
      time_zone: Europe/Moscow
