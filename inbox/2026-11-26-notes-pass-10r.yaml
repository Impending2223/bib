patch: notes-pass-10r
by: 'Claude (reader; the notes pass, batch 10r: R33a, building on the entry from its cites)'
ops:
- add-words:
    id: cal.1969-10-02.soviet-union-leadership
    after: end
    words: Kirilenko, Baibakov, Lesechko, Ilichev and Aristov are added to the Soviet side by the Politburo's decision of Sept. 30.
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 450 n.256'
