- add-words:
    id: cal.1969-12-05.soviet-union-leadership
    after: end
    words: Kosygin, Podgorny and Katushev sit with Brezhnev, in the Central Committee's new hall, 11 to 11:45.
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 376'
- add-words:
    id: cal.1969-12-05.soviet-union-leadership
    after: end
    words: 'His note on the party: frequent changes of cadres in the lower organizations.'
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 434'
- names:
    id: cal.1969-12-05.soviet-union-leadership
    add:
    - Kosygin
    - Podgorny
    - Katushev
    tags:
    - name:kosygin-aleksei
    - name:podgorny-nikolai-v
    - name:katushev-konstantin-f
- add-words:
    id: cal.1960-03-31.china-leadership-3
    after: end
    words: 'Peng Zhen attends the 175th meeting. A piece of Lenin on the commune is proposed for the four volumes. Also on the agenda: overcoming the "five too many" (meetings, papers and returns, sitting in offices, routine business, general calls) and scientific secrecy.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 12'
- names:
    id: cal.1960-03-31.china-leadership-3
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1960-04-16.china-leadership-6
    after: end
    words: Deng Xiaoping calls the meeting; Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 18'
- names:
    id: cal.1960-04-16.china-leadership-6
    add:
    - Deng Xiaoping
    - Peng Zhen
    tags:
    - name:deng-xiaoping
    - name:peng-zhen
- add-words:
    id: cal.1960-06-04.china-leadership-3
    after: end
    words: 'Peng speaks: American imperialism, having wrecked the summit, talks of "peace efforts" while it makes tension everywhere and arms madly.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 32–33'
- add-words:
    id: cal.1960-07-14.china-leadership
    after: end
    words: Zhou reviews the Comintern from its founding in 1919 to its dissolution in 1943 and its effect on the Chinese revolution. Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 46'
- names:
    id: cal.1960-07-14.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1960-07-31.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 48'
- names:
    id: cal.1960-07-31.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1960-08-03.china-leadership-4
    after: end
    words: It adopts in the main the draft directive on the whole Party taking hold of agriculture and grain. Zhou Enlai attends; Peng Zhen is there.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 49'
- names:
    id: cal.1960-08-03.china-leadership-4
    add:
    - Zhou Enlai
    - Peng Zhen
    tags:
    - name:zhou-enlai
    - name:peng-zhen
- add-words:
    id: cal.1960-08-18.china-leadership
    after: end
    words: The 203rd meeting, Peng Zhen presiding. Drought has hit 650 million mu this spring. Agriculture first; capital projects stopped as planned; grain shipped on time; rations arranged to next summer's harvest; Shanxi, Hebei, Shandong and Henan to report within a fortnight. Bo Yibo, Wang Heshou, Yao Yilin and others sit in.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 51–52'
- names:
    id: cal.1960-08-18.china-leadership
    add:
    - Peng Zhen
    - Bo Yibo
    - Wang Heshou
    - Yao Yilin
    tags:
    - name:peng-zhen
    - name:bo-yibo
    - name:wang-heshou
    - name:yao-yilin
- add-words:
    id: cal.1960-03-24.china-leadership-2
    after: end
    words: 'Hu Qiaomu, Chen Boda, Kang Sheng and Wu Lengxi are at Tianjin with them. At the opening Liu Shaoqi proposes that Mao Zedong thought not be split from Marxism–Leninism. Deng: at home, "Marxism–Leninism, Mao Zedong thought," with a pause between; Mao agrees, and says abroad only Marxism–Leninism.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 254–255'
- names:
    id: cal.1960-03-24.china-leadership-2
    add:
    - Hu Qiaomu
    - Chen Boda
    - Kang Sheng
    - Wu Lengxi
    tags:
    - name:hu-qiaomu
    - name:chen-boda
    - name:kang-sheng
    - name:wu-lengxi
- add-words:
    id: cal.1960-10-02.soviet-union
    after: end
    words: 'The draft carries four "nails" aimed at China: the Twentieth Congress line wholly right; an unnamed attack on "factional activity"; condemnation of the personality cult; world war avoidable.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 366'
- add-words:
    id: cal.1960-10-02.soviet-union
    after: end
    words: Wu Lengxi and Chen Boda, left in Peking, turn the delegation's cables into suggestions for the Standing Committee, which cables back.
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 367'
- names:
    id: cal.1960-10-02.soviet-union
    add:
    - Wu Lengxi
    tags:
    - name:wu-lengxi
- add-words:
    id: cal.1960-11-07.soviet-union-2
    after: end
    words: 'The letter runs over 80,000 characters, 91 pages in Chinese. Andropov gives it to Liu Xiao and hopes it is not tied to the meeting: "the meeting is the meeting, the answer is the answer." Liu Shaoqi has the delegation read it.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70–71'
- check:
    id: cal.1960-11-07.soviet-union-2
    text: 'Check: Peng Zhen nianpu (IV, 71) has Andropov give the letter to Liu Xiao after the morning ceremony ended, the delegation reading it in the afternoon; Deng nianpu (III, 1593) has it handed that morning.'
- names:
    id: cal.1960-11-07.soviet-union-2
    add:
    - Liu Xiao
    tags:
    - name:liu-xiao
- add-words:
    id: cal.1960-11-09.soviet-union-2
    after: end
    words: Ponomarev and Andropov come too, at 5 p.m., to Liu Shaoqi's lodging; Liu, Deng and Peng answer in turn, the quarrel is theirs.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 72'
- names:
    id: cal.1960-11-09.soviet-union-2
    add:
    - Ponomarev
    - Andropov
    - Liu Shaoqi
    tags:
    - name:ponomarev-boris-n
    - name:andropov-yuriy-vladimirovich
    - name:liu-shaoqi
- add-words:
    id: cal.1960-11-14.soviet-union-2
    after: end
    words: Kim Il of the Korean party has spoken all morning; Deng follows, in five parts, four hours. Peng Zhen is at the plenary.
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 381'
- names:
    id: cal.1960-11-14.soviet-union-2
    add:
    - Kim Il
    - Peng Zhen
    tags:
    - name:kim-il
    - name:peng-zhen
- add-words:
    id: cal.1960-11-18.china-leadership-3
    after: end
    words: 'Wilcox: Khrushchev''s "no arms, no armies, no war" spreads illusions; peaceful transition in the capitalist centers is doubtful; "factional activity" is better left out; China is not warlike; differences to be settled by consultation. Peng Zhen attends.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 75–76'
- names:
    id: cal.1960-11-18.china-leadership-3
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1960-11-21.soviet-union
    after: end
    words: 'Eight parties speak: Bolivia, Burma, Costa Rica, Malaya, India, Thailand, Ecuador, Algeria. Ba Thein Tin, Burma''s general secretary, disagrees wholly with the CPSU: the "three noes" are possible only after socialism wins the world; the Twentieth Congress''s peaceful transition split his party''s armed struggle, its leaders defecting, its guerrillas deserting; "group factions" and "national communism" must go. Peng Zhen attends.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 77'
- names:
    id: cal.1960-11-21.soviet-union
    add:
    - Peng Zhen
    - Ba Thein Tin
    tags:
    - name:peng-zhen
    - name:thakin-ba-thein-tin
- add-words:
    id: cal.1960-11-26.soviet-union-2
    after: end
    words: 'Liu Shaoqi and Yang Shangkun are there. Liu: the visit depends on the meeting''s result; since the Nov. 5 letter the meeting stands at the edge of a wrong line. The talk runs three hours.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 79–80'
- names:
    id: cal.1960-11-26.soviet-union-2
    add:
    - Yang Shangkun
    tags:
    - name:yang-shangkun
- add-words:
    id: cal.1960-12-23.china-leadership
    after: end
    words: Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Tan Zhenlin and Peng Zhen are there.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 86'
- add-words:
    id: cal.1960-12-30.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 88'
- names:
    id: cal.1960-12-30.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1961-01-13.china-leadership
    after: end
    words: 'Peng Zhen interjects, when Mao says industry should seek quality and variety, not quantity: productivity is low for three reasons, too many non-productive staff, too many trainees and apprentices, the low technique of the "small native and foreign groups."'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 91'
- names:
    id: cal.1961-01-13.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1961-01-25.china-leadership-2
    after: end
    words: 'Peng Zhen is there, at the 232nd meeting, on college textbooks, the theory corps and rail transport. Peng: rules in industry set up before the old are broken; so with textbooks. Jiang Nanxiang to be told: in science no new books issued, the old not dropped. Hu Sheng to write the philosophy text, approved by the end of March, Peng to arrange printing. The fifth and sixth volumes of Mao''s *Selected Works* put off: some of his talks are settled views, some thoughts on the way, not to be spread about.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 94'
- names:
    id: cal.1961-01-25.china-leadership-2
    add:
    - Peng Zhen
    - Jiang Nanxiang
    - Hu Sheng
    tags:
    - name:peng-zhen
    - name:jiang-nanxiang
    - name:hu-sheng
- add-words:
    id: cal.1961-01-27.china-leadership-2
    after: end
    words: 'Peng Zhen is there, Zhou attending. Timber: 3 million cubic meters waiting in the north; the 72 forestry bureaus sent down in 1958 to come under the Center and provinces jointly, later the Center; pit props first. Coal: 710,000 tons a day in the first quarter of last year, 570,000 now, attendance 70 to 80 percent; the 61 big mines'' coal to be allotted by the Center.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 95–96'
- names:
    id: cal.1961-01-27.china-leadership-2
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1961-02-14.china-leadership
    after: end
    words: The 238th meeting, Peng Zhen presiding. If output reaches 500,000 tons a day in late February, allot nine-tenths. Datong's equipment and grain are in place, attendance only 70 percent. Warnings to the metallurgy, railway and machinery ministries. Zhou reports the grain shortage in the provinces; Tan Zhenlin to draft a paper to squeeze grain for workers from the non-working and light workers; no hope in imported grain.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 102–103'
- names:
    id: cal.1961-02-14.china-leadership
    add:
    - Peng Zhen
    - Tan Zhenlin
    tags:
    - name:peng-zhen
    - name:tan-zhenlin
- add-words:
    id: cal.1961-02-22.china-leadership-3
    after: end
    words: Liu Shaoqi presides, 10 p.m. to 1 a.m.; Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 107'
- names:
    id: cal.1961-02-22.china-leadership-3
    add:
    - Liu Shaoqi
    - Peng Zhen
    tags:
    - name:liu-shaoqi
    - name:peng-zhen
- add-words:
    id: cal.1961-03-07.china-leadership-2
    after: end
    words: 'Peng Zhen is there, Chen Yun attending, at the 241st meeting. Deng relays Mao: Khrushchev''s letter of Feb. 27 offers a million tons of wheat on loan and 500,000 tons of Cuban sugar; the grain not wanted, the sugar acceptable. Also: communes and teams made smaller; a two-year and a seven-year plan; fewer papers, more investigation; Mao has views of the Secretariat''s and the departments'' work.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 110'
- names:
    id: cal.1961-03-07.china-leadership-2
    add:
    - Peng Zhen
    - Chen Yun
    - Khrushchev
    tags:
    - name:peng-zhen
    - name:chen-yun
    - name:khrushchev-nikita-s
- add-words:
    id: cal.1961-04-03.china-leadership-5
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 116–117'
- names:
    id: cal.1961-04-03.china-leadership-5
    add:
    - Peng Zhen
