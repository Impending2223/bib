    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1960-08-03.china-leadership-4
    after: end
    words: Deng Xiaoping presides.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1569'
- names:
    id: cal.1960-08-03.china-leadership-4
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1960-10-02.soviet-union
    after: end
    words: In its eight plenaries and eleven secretariat sessions the committee disputes the epoch, peaceful coexistence and transition, war and peace, disarmament, "going it alone" and "national communism," revisionism and dogmatism, factions, the cult of personality and the Twentieth and Twenty-first Congresses. No agreement on banishing world war, on factions or on the two Congresses; they are left to the November meeting of eighty-one parties.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1580'
- names:
    id: cal.1960-10-02.soviet-union
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1960-12-30.china-leadership
    after: end
    words: Deng Xiaoping asks Chen Yun what poultry and eggs will earn abroad in 1961.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1608'
- names:
    id: cal.1960-12-30.china-leadership
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1961-01-13.china-leadership
    after: end
    words: 'Deng interjects, on Mao''s remarks on productivity: big, middle and small together; small first, but in the long run the middle road, the stress on the middle.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1611–1612'
- names:
    id: cal.1961-01-13.china-leadership
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1961-01-25.china-leadership-2
    after: end
    words: 'Deng presides. Railways: all power to the ministry, with political departments and commissars, the old rules restored. Private plots to stay unchanged for twenty years. Textbooks for the universities. Mao''s talks to be printed only with his review; his works not to be misused. Two volumes of Liu Shaoqi''s works, some 800,000 characters. Theorists drawn to the center for *Hongqi*, the *Renmin ribao* and the Propaganda Department; frontier-science researchers at the Academy spared going down.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1615–1616'
- names:
    id: cal.1961-01-25.china-leadership-2
    add:
    - Deng Xiaoping
    - Liu Shaoqi
    tags:
    - name:deng-xiaoping
    - name:liu-shaoqi
- add-words:
    id: cal.1961-01-27.china-leadership-2
    after: end
    words: Deng presides.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1617'
- names:
    id: cal.1961-01-27.china-leadership-2
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1961-03-07.china-leadership-2
    after: end
    words: 'Deng presides. Mao, at Guangzhou, has talked with Zhang Pinghua and with Deng and others, and means the communes cut smaller after spring sowing wherever possible, the powers of commune, brigade and team fixed in regulations against levelling and blind command. Industry to rise steadily: a two-year plan by the end of March, then a seven-year plan from 1963. Civil aviation to go under the air force.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1620–1621'
- names:
    id: cal.1961-03-07.china-leadership-2
    add:
    - Zhang Pinghua
    tags:
    - name:zhang-pinghua
- add-words:
    id: cal.1960-04-22.china-leadership-4
    after: end
    words: Luo Ronghuan, Li Fuchun and He Long are there too.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1772–1773'
- names:
    id: cal.1960-04-22.china-leadership-4
    add:
    - Luo Ronghuan
    - Li Fuchun
    - He Long
    tags:
    - name:luo-ronghuan
    - name:li-fuchun
    - name:he-long
- add-words:
    id: cal.1960-06-02.china-leadership-4
    after: end
    words: Zhu De attends, in the morning.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1777'
- names:
    id: cal.1960-06-02.china-leadership-4
    add:
    - Zhu De
    tags:
    - name:zhu-de
- add-words:
    id: cal.1960-07-31.china-leadership
    after: end
    words: 'Of the Soviet recall: 1,390 experts, 343 contracts and supplements and 257 scientific and technical projects cancelled.'
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1780 n.1'
- check:
    id: cal.1960-07-31.china-leadership
    text: 'Check: Zhu De nianpu (III, 1780) has Zhu De at the Politburo Standing Committee on July 28, 30 and 31, on grain, frontier science and the note on the experts'' recall; the line has the plenary session.'
- add-words:
    id: cal.1960-10-01.china-leadership-11
    after: end
    words: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao and Dong Biwu are on the gate tower with 500,000 people in the square.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1783'
- names:
    id: cal.1960-10-01.china-leadership-11
    add:
    - Mao Zedong
    - Liu Shaoqi
    - Zhou Enlai
    - Zhu De
    - Chen Yun
    - Lin Biao
    - Dong Biwu
    tags:
    - name:mao-zedong
    - name:liu-shaoqi
    - name:zhou-enlai
    - name:zhu-de
    - name:chen-yun
    - name:lin-biao
    - name:dong-biwu
- add-words:
    id: cal.1961-01-13.china-leadership
    after: end
    words: 'Zhu De speaks to the plenary: a good meeting; "agriculture, light, heavy" has been said but heavy, light, agriculture done; less steel built if need be, more put into light industry, as a long-term line; exports to be chiefly light-industry goods, not farm and side products.'
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1790'
- names:
    id: cal.1961-01-13.china-leadership
    add:
    - Zhu De
    tags:
    - name:zhu-de
- add-words:
    id: cal.1969-10-17.china-leadership
    after: end
    words: 'The meeting is in the gymnasium after the sports display. With Zhou are Dong Biwu, Zhu De, Chen Yun, Ye Jianying, Chen Yi, Deng Zihui, Li Fuchun, Zhang Dingcheng and others. Zhou: the Chairman, by the present situation, has decided that some comrades leave Peking before the 20th or a little after, and has named each one''s place; Zhou will telephone the arrangements, the Center''s General Office ready special planes or trains.'
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1970'
- names:
    id: cal.1969-10-17.china-leadership
    add:
    - Deng Zihui
    - Li Fuchun
    - Zhang Dingcheng
    tags:
    - name:deng-zihui
    - name:li-fuchun
    - name:zhang-dingcheng
- add-words:
    id: cal.1960-12-30.china-leadership
    after: end
    words: 'Chen Yun''s three points: be ready in mind and work; men and beasts to rest this winter for spring ploughing; import as much grain as can be had, "eating first, construction second." Mao sums up: eating first, the market second, construction third.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 61–62'
- add-words:
    id: cal.1961-02-22.china-leadership-3
    after: end
    words: 'Chen Yun: the factories have 20 percent more workers than they need, and five million sent home would add much farm labor; purchasing power exceeds goods by 10 billion yuan: more goods, less spending, more high-priced sweets, restaurants and yarn, price rises kept narrow so as not to hurt bank savings. Townspeople hold 2.5 billion yuan in savings, commune members 1.5 billion, the rest in their pockets. Goods to the villages before the towns, to buy farm produce.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 75'
- add-words:
    id: cal.1960-03-24.china-leadership-2
    after: end
    words: 'Zhou: some have set the two against each other, and some vulgarize, calling everything Mao Zedong thought. Liu: Marxism–Leninism and Mao Zedong thought are not to be made two things. Peng Zhen: some articles handle Mao''s leadership and the collective badly. Mao: a report to the Center headed "the Chairman and the Center" will not do.'
    item: '[[w.zhou-enlai-nianpu-1949]], II, 296–297'
- add-words:
    id: cal.1960-07-14.china-leadership
    after: end
    words: 'Zhou''s report holds that the Comintern''s founding and its dissolution were each needed, and treats three periods: 1919–27, more good than harm; 1927–35, mostly wrong, with the greatest influence on the Chinese party; 1935–43, little interference.'
    item: '[[w.zhou-enlai-nianpu-1949]], II, 331–333'
- add-words:
    id: cal.1960-07-31.china-leadership
    after: end
    words: 'Zhou reports on Sino-Soviet relations: the recall will bear on projects, science, defense technology, the peaceful use of atomic energy, students abroad, propaganda, international exchanges and foreign trade.'
    item: '[[w.zhou-enlai-nianpu-1949]], II, 336'
- add-words:
    id: cal.1960-03-15.china-leadership-2
    after: end
    words: His letter to Liu and Deng asks the Central meeting to pass the three drafts and issue them within seven to ten days to the first secretaries.
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 76'
- add-words:
    id: cal.1960-03-15.china-leadership-2
    after: end
    words: 'Hunan''s report: by the end of February 880,000 water works built or repaired, 30,000 of them new reservoirs; seven million laborers out on manure; a plan for 40 million pigs. Shandong''s: 45,000 cadres sent out, 24 backward counties and cities, 260-odd cadres to sit in them.'
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 78–81'
- add-words:
    id: cal.1960-03-15.china-leadership-2
    after: end
    words: On the mess halls Mao inserts that the nation should aim at 80 percent of rural people eating in halls, seven provinces and cities already over 90 percent, the rest not to be forced, two or three years; starch from plant stalks "a great invention."
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 82–89'
- add-words:
    id: cal.1960-09-30.china-leadership
    after: end
    words: 'Mao on France: China will deal with it only if it breaks with Chiang Kai-shek and leaves China''s aid alone; its 800,000 troops cost 3 billion francs a day and will bring it down. China fought twenty-two years, its army cut from 300,000 to some 20,000, and won back by policy. The points are the typed copy Zhou hands Abbas on Oct. 6.'
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 342–344'
- names:
    id: cal.1960-09-30.china-leadership
    add:
    - Chiang Kai-shek
    tags:
    - name:chiang-kai-shek
- add-words:
    id: cal.1960-11-15.china-leadership
    after: end
    words: 'The five-man group''s report of Nov. 10: 10,176 cadres of the central organs to go down, 7.33 percent, for three years as a rule. Mao adds that those who go need the will not to fear hardship; two-thirds of the country fine, a third bad, to be turned round within five months for a great harvest in 1961.'
    item: '[[w.jianguo-yilai-mao-zedong]], XV, 398–400'
- add-words:
    id: cal.1961-01-18.china-leadership-2
    after: end
    words: 'The request, "On some questions of foreign trade in 1961": grain imports raised from 2.2 billion jin to 8 billion, the 1 billion for re-export apart, all bought from capitalist countries. The Center approves it Feb. 7.'
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 182–187'
- add-words:
    id: cal.1961-02.china-leadership-3
    after: end
    words: 'Enrolment for 1961: higher schools 250,000, 94,000 fewer than in 1960; secondary specialist schools 500,000, 110,000 fewer; ordinary middle schools 3,350,000, 990,000 fewer.'
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 168–179'
- check:
    id: cal.1961-02.china-leadership-3
    text: 'Check: the note says the higher schools'' 1961 intake is 90,000 fewer than 1960; the page (XIV, 176) reads 94,000.'
- add-words:
    id: cal.1961-04-03.china-leadership-5
    after: end
    words: 'Agriculture first: over 500 million people are in the villages, some 40 percent of them laborers, who must grow the grain that feeds the towns.'
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 238–253'
