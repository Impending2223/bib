      c: In the operations department of the General Staff 總參作戰部 a wall poster, "Bombard Yang Chengwu" 炮轟楊成武, is put up, backing the foreign affairs bureau's; the department's head Wang Shangrong 王尚榮 and deputy head Lei Yingfu 雷英夫 sign first.
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 1043 (the operations department''s poster of Aug. 25, 1966, backing the foreign affairs bureau''s, from the General Staff''s summary of 1979, n.36); [[w.pu-weihua-zalan-jiu-shijie]], 124 (after the foreign affairs bureau''s poster and its march, the operations department''s, 〈炮轟楊成武〉, Wang Shangrong and Lei Yingfu first to sign; no day); [[w.teiwes-tragedy-of-lin-biao]], 34–35 (by late August a poster "Bombard Yang Chengwu" at the General Staff''s offices, by Wang Shangrong and Lei Yingfu, of He Long''s old Second Red Army, head and deputy head of the Warfare Department; the staff of He''s office support it; Ye Qun takes it for an attack on Lin). Made public: [[w.yunsheng-maojiawan-jishi]], 33 (1988, the title as "Bombard XXX," without the authors'' names; marking not seen). Printed for internal circulation: [[w.zhonggong-dangshi-jiaoxue-cankao]], XXVI, 89. To check: Zhonggong zongcanmoubu weiyuanhui 中共總參謀部委員會, *Zongcan jiguan "sancha sanzheng" yundong zongjie* 《總參機關「三查三整」運動總結》, Jan. 15, 1979 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 1043 n.36); Chen Hong 陳虹, 〈總參「八·二五」事件〉, *Dangshi bolan* 《黨史博覽》, 1999, no. 9, 21–22 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 124 n.65); [[w.yunsheng-maojiawan-jishi]], 33 (cited by [[w.teiwes-tragedy-of-lin-biao]], 35 n.69a); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXVI, 89 (cited by [[w.teiwes-tragedy-of-lin-biao]], 35 n.69c). See [[cal.1966-08-25.china-leadership-3]]. The order: after [[cal.1966-08-25.china-leadership-3]], [[w.yang-jisheng-tiandi-fanfu]], II, 1043 (the operations department''s poster backs the bureau''s). Names: Yang Chengwu, Lei Yingfu.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:yang-chengwu
      - name:lei-yingfu
