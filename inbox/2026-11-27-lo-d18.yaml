- check:
    id: cal.1966-07-17.china-leadership-5
    text: 'Check: the day and the place: Yang (I, 220, read) has the telegram July 17, from Shanghai, citing the *Shinian wenge dashiji*, 109 (not seen); the Mao nianpu (V, July 17, read) has Mao at Wuchang that day, meeting the Afro-Asian writers, leaving Wuhan at 3 p.m. and back in Peking July 18.'
- check:
    id: cal.1966-07-19.china-leadership-6
    text: 'Check: the day: Li Da''s letter is signed 七月十九日 and Pu (138, read) says he wrote it that afternoon after reading in the papers of Mao''s swim; the *Renmin ribao* reported the swim July 26 ([[cal.1966-07-26.china-leadership-4]] is the calendar''s entry of that report, not read here); Pu does not say which paper Li read, and the Hubei papers of July 17–19 were not seen.'
- check:
    id: cal.1966-07-20.china-leadership-3
    text: 'Check: the day: Yang (I, 214, read) has the work group free Kuai July 20, on Kuai''s own words (his book, 72); MacFarquhar (83) has Wang Li and Guan Feng find him "still detained" (the month-dated entry); Yang puts that visit July 22.'
- edit:
    id: cal.1966-07-23.china-leadership-5
    base: 3e03e977
    set:
      n: '[[w.macfarquhar-maos-last-revolution]], 83; [[w.pu-weihua-zalan-jiu-shijie]], 175 (dated July 22, the enlarged Standing Committee on the Peking colleges'' preliminary plan: Liu, most work groups good; Deng against withdrawing them; Ye Jianying and Liu Zhijian, for the army, oppose withdrawing them). Made public: 1991. Check: the meeting: the Zhizheng sishinian (272) has report meetings under Liu from July 19 to 23, the afternoon of July 23 the one where Liu says most work groups are good; the Liu Shaoqi nianpu (II, 645–646), the Deng Xiaoping nianpu (III, 1924–1925) and Pu (175) have the enlarged Standing Committee on the Peking colleges'' plan July 22 ([[cal.1966-07-22.china-leadership-7]]) and nothing of July 23 but the evening at Liu''s (Deng, III, 1925); of MacFarquhar''s two sources (83 n.76) only the Zhizheng sishinian has July 23. To check: [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 272 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.76b). The words: "the afternoon of July 23" (MacFarquhar 83). Names: Liu Shaoqi, Deng Xiaoping, Bo Yibo, Ye Jianying, Liu Zhijian.'
- cite:
    id: cal.1966-07-23.china-leadership-5
    item: '[[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 272 (July 19–23, the report meetings on the Cultural Revolution under Liu Shaoqi; the afternoon of July 23, Liu and others at the meeting: most work groups are good; work groups cannot be done without; the question is helping them, not withdrawing them)'
