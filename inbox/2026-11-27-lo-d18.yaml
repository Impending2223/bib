      c: 'After the editorial Zhou Enlai tells Mao his view: the Party has called line errors "left" or "right," never "bourgeois reactionary." Mao explains in English: first "counter-revolutionary line," then "anti-revolutionary line," and "reactionary line" at last the best.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 2, 1966 (社论发表后). [[w.zhou-enlai-nianpu-1949-2020]], III, 71 (Zhou''s doubts and Mao''s reply on "reactionary line"; under Oct. 1, "later," no day); [[w.jian-zhou-enlai]], 552–553 (the editorial "Thoroughly Criticize the Bourgeois Reactionary Line," so Chen; "bourgeois reactionary line" a new invention; after reading it Zhou asks Mao what it means, line errors having always been "leftist" or "rightist"; Mao: "reactionary line," not "counterrevolutionary line," so that those in it are not necessarily enemies; not the day). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 75), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. Check: the day: the Mao nianpu has the talk under Oct. 2, after the editorial''s printing; the Zhou nianpu (III, 71) after the editorial of its Oct. 1 item, with no day. See [[cal.1966-10-02.china-leadership]]. After the reprint, by the nianpu''s words. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
