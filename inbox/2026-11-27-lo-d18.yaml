- edit:
    id: cal.1966-08-18.china-leadership-11
    base: c98f9f80
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 323 (Aug. 18, 1966; the Wengao prints the words as Mao''s of 1966, from *Renmin ribao*, Aug. 19, 1966; note 1); [[w.yang-jisheng-tiandi-fanfu]], I, 240 (the celebration opens at 7:30 a.m. 早晨7：30; Mao and Lin Biao come out to the marble balustrade and wave to the million with their little red books; Lin speaks: "the supreme commander of this great proletarian cultural revolution is our Chairman Mao, the commander in chief"; Zhou Enlai also speaks to encourage the Red Guards; hundreds of thousands of Red Guards of the middle schools wait on East Chang''an Avenue and file past the rostrum); [[w.pu-weihua-zalan-jiu-shijie]], 256, 256 n.113 (Zhou at the first reception: a warm welcome to the students and staff come from all over the country; the Peking students and those from elsewhere to learn from and help each other and exchange revolutionary experience; the capital''s students the hosts). The 7:30 a.m. is the rally''s opening (Yang, I, 240, read); Lin Biao and Zhou speak after it, and Zhou''s speech has no hour of its own. After [[cal.1966-08-18.china-leadership-6|Lin Biao''s speech]], in the sequence of [[w.mao-zedong-zhuan]], VI, ch. 75. Names: Zhou Enlai, Mao Zedong. Check: the day of Mao''s words; the Wengao dates them 1966.'
      time_range:
      - 1966-08-17T22:00Z
      - 1966-08-18T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      range_basis: record
    unset:
    - time
- edit:
    id: cal.1966-08-19.cities-and-housing-3
    base: cb45c6de
    settles:
    - 'Check: the day;'
    set:
      n: 'Daily Digest, Aug. 19, 1966, [D444](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=442): the Senate adopts two modified Tower amendments raising the limit on grants to any one State from 12½ to 15 percent (sections 105 and 205), and rejects another of his, to make the bill essentially a planning bill, 27 to 53. [[w.bernstein-guns-or-butter]], 466 (the 15 percent amendment, undated). The Digest settles the day: Bernstein''s "August 9" for Tower''s motions (466) is not it. The Senate sat from noon to 3:36 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=1), [D445](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=443). See [[cal.1966-08-19.cities-and-housing]]. Names: Tower.'
