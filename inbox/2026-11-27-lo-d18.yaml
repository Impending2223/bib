      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 362–365 (Sept. 15, 1966; Mao''s notes on the two drafts Tao sent at 2 a.m. Sept. 15, his change to Lin''s text printed from *Renmin ribao*, Sept. 16 (revised copy held)). Made public: 2013. To check: Lin Biao, draft of his speech to the Red Guard rally of Sept. 15, 1966, sent to Mao by Tao Zhu at two o''clock that morning (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 363 n.1); Zhou Enlai, draft of his speech to the Red Guard rally of Sept. 15, 1966, with his note to Tao Zhu of Sept. 14 (Lin alone to speak) and Tao Zhu''s note (both to speak), sent to Mao by Tao Zhu at two o''clock Sept. 15 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 364 n.1). The words: 上午, of both drafts (V, Sept. 15). Names: Mao Zedong, Tao Zhu, Lin Biao, Zhou Enlai.'
