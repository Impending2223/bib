    base: 18134d2f
    settles:
    - 'Check: the day and hour;'
    set:
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 224. The words: 上午10點半 (I, 224). Made public: 2008. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2008, 3rd ed.), 594–595 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 224 n.18a); [[w.zedong-mao-zedong-nianpu]], V, 609 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 224 n.18b). Names: Lin Biao, Ye Qun, Zhou Enlai, Mao Zedong. Check: the day and hour; Yang''s note (I, 224 n.18) gives the Mao chronology (V, 609) as having Lin back on the evening of Aug. 8, but the chronology as read (V, Aug. 6) has him fly back the evening of Aug. 6 ([[cal.1966-08-06.china-leadership-2]]).'
