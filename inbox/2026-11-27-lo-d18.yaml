- edit:
    id: cal.1966-07-05.civil-rights-organizations-2
    base: 94a3023e
    set:
      n: '[[w.kotz-judgment-days]], 362. The hour, 15:48 at the LBJ Ranch, is the recordings catalogues'' (the Miller Center''s and PRDE''s); Texas kept standard time all year in 1966, so 3:48 p.m. is 21:48Z. Check: whether the Ranch''s Daily Diary kept Central or Washington time. To check: [Johnson and Young, 3:48 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-whitney-young-july-5-1966), Conversation WH6607-01-10406 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 362 n.41). See [[cal.1966-07-05.civil-rights-organizations]]. Names: Johnson, Whitney Young.'
      place: lbj-ranch
      time_zone: Etc/GMT+6
- edit:
    id: cal.1966-07-10.open-housing
    base: 106bda9e
    set:
      n: '[Demands of the Chicago Freedom Movement](https://www.crmvet.org/docs/66chi.htm) (July 10, 1966); King, [Address at rally at Soldier Field](https://okra.stanford.edu/link/document660710-000) (King Papers Project). [[w.garrow-bearing-the-cross]], 490–93; [[w.branch-at-canaans-edge]], 501–2 (98 degrees; five thousand walk the three miles; fourteen demands taped to City Hall''s door; Daley''s July 9 figures, 102,847 apartments in 9,226 buildings; the talks of July 11); [[w.kotz-judgment-days]], 365 (short of the 100,000 hoped for; five thousand to City Hall; the demands taped to the door; Daley rejects them the next day); [[w.bernstein-guns-or-butter]], 397 (30,000 of the 100,000 hoped for; 5,000 to City Hall); [[w.young-easy-burden]], 408–9 (the ninety-six demands pinned to the city hall door; Daley the next day, promising nothing); [[w.ralph-northern-protest]], 105–9 (over thirty thousand; the march to City Hall; the meeting of July 11); [[w.anderson-confronting-the-color-line]], 207–08 (the rally; July 11, King and Raby with Daley, who cites the city''s "massive programs"); [[w.cohen-american-pharaoh]], 383–86. Check: Young, 409, counts about thirty thousand at Soldier Field. Check: Cohen and Taylor give 23,000 by the city''s estimate, 60,000 by the organizers'' (384), and 5,000 to 38,000 on the march (385). To check: King, Address at rally at Soldier Field, July 10, 1966, 12 pp. (the text; King Papers Project); [[w.chicago-1966]]; [[w.chicago-freedom-movement]]; [[w.fairclough-to-redeem-the-soul]]; *Washington Post*, July 11 at A1 and July 12, 1966, at A1; *Chicago Tribune*, July 11 and 12, 1966, 1; *New York Times*, [July 11 at 1](https://timesmachine.nytimes.com/timesmachine/1966/07/11/issue.html) and [July 12, 1966, at 26](https://timesmachine.nytimes.com/timesmachine/1966/07/12/issue.html) (cited by [[w.garrow-bearing-the-cross]], 492 n.19); Investigator''s Report, "Rally and March, Southern Christian Leadership Conference/Coordinating Council of Community Organizations," July 11, 1966, File 940, RS, CHS (cited by [[w.branch-at-canaans-edge]], 501); [[w.king-beyond-vietnam]], 285 (cited by [[w.branch-at-canaans-edge]], 501); Oates, *Let the Trumpet Sound* (1982), 409 (cited by [[w.branch-at-canaans-edge]], 501); *Chicago Daily News*, July 12, 1966, at 4 (cited by [[w.ralph-northern-protest]], 108 n.44). Names: King, Daley, Raby.'
