- edit:
    id: cal.1966-08-03.china-leadership
    base: af131dd5
    kind: correct
    set:
      c: 'Plenum, afternoon. Mao to Liu Lantao: withdraw the work groups; set up committees, congresses and groups of revolutionary teachers, students and staff to run it themselves, the Marxist-Leninist way.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 3, 1966. [[w.pu-weihua-zalan-jiu-shijie]], 190 (the afternoon plenary in the East Hall of the Great Hall, Zhou Enlai presiding; Liu Lantao, Song Renqiong, Li Jingquan and Wei Wenbo, of four regional bureaus, speak; after Liu Lantao Mao: without breaking the work groups you cannot set up the congresses and committees of revolutionary teachers and students; sending work groups to suppress students is an anti-Marxist idea). Pu has Mao speak after Liu Lantao''s speech, the first of the four. Made public: 2013. Names: Mao Zedong, Liu Lantao.'
      tags:
