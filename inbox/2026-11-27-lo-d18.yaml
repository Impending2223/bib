    id: cal.1966-08-06.china-leadership-2
    text: 'Check: the day and hour of Lin''s coming: the Mao nianpu (V, Aug. 6, read) has him fly back "that evening" (当晚) of Aug. 6; Wu Faxian, by Yang (I, 224, read), the landing at 10:30 a.m. Aug. 8, after Zhou''s word on the evening of Aug. 7.'
