    base: 1da00982
    set:
      n: 'San Francisco Police Department, [*128 Hours: A Report of the Civil Disturbance in the City & County of San Francisco*](https://archive.org/details/128hoursreportof1968long) (1966), 1–4 (Sept. 27: shortly after 2:30 p.m. Officer Alvin Johnson, of Potrero radio car one, finds the stalled car at Griffith Street and Oakdale; Matthew Johnson and Clifton Bacon run; four shots on the slope below Navy Road; the radio call logged at 3:10 p.m., the ambulance at 3:14). [Wikipedia, "Hunters Point social uprising (1966)"](https://en.wikipedia.org/wiki/Hunters_Point_social_uprising_%281966%29) (read Nov. 25, 2026: the officer at the car at 2:30 p.m.; the police told of the shooting at 3:10 p.m.; *128 Hours*, 2–4). The words: "Shortly after 2:30 P.M." (*128 Hours*, 1), the time of the first sighting; the shots a few minutes later. To check: [[w.crowe-prophets-of-rage]]. Split under R25b and R17: the article, after *128 Hours*, gives the riot, Shelley''s call and Brown''s order hours of their own (7:35, 11:39 and 11:44 p.m.), and the shooting into the Bayview Community Center and the end of the emergency days of their own; each is now an entry. See [[cal.1965-08-11.states-and-cities]]. Names: Matthew Johnson.'
      time_approx: true
