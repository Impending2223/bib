      n: '[[w.branch-at-canaans-edge]], 509; [[w.ralph-northern-protest]], 122; [[w.ralph-northern-protest]], 143; [[w.anderson-confronting-the-color-line]], 226–27 (King and Raby three hours with the Negro leaders of the Democratic organization); [[w.cohen-american-pharaoh]], 394–95 (the meeting of Daley''s Negro aldermen and legislators with King and Raby, three hours, Despres there; Metcalfe''s arm round King). After [[cal.1966-08-04.open-housing-2|the meeting at the YMCA]]: the meeting Thursday morning (Ralph, 144), the mass meeting Thursday night (Branch, 509). The words: "Thursday night," "tonight" (Branch, 509). Check: Ralph gives two thousand at New Friendship (122). Check: Anderson: a dozen aldermen and State representatives, for open housing legislation, more bank loans to Negroes, building standards and racial head counts, against replacing the absentee precinct captains; Jackson''s announcement that King would lead the weekend''s march (226–27). Check: Cohen and Taylor do not date the meeting (394–95). To check: [[w.garrow-bearing-the-cross]], 499 (cited by [[w.branch-at-canaans-edge]], 509); Speech excerpts, "MLK Rally with Mahalia Jackson," Aug. 4, 1966, A/KS (cited by [[w.branch-at-canaans-edge]], 509); Urban Affairs Weekly Report, Aug. 7, 1966, AFSC papers, 1966 CRD Housing Program, box 4, AFSC Archives (cited by [[w.ralph-northern-protest]], 122 n.88). See [[cal.1966-07-31.open-housing]]. Names: King, Raby, Daley.'
