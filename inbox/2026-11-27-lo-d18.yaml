        witness: w.yang-jisheng-tiandi-fanfu
        reads: 'Aug. 7 evening Zhou tells Wu Faxian to send a plane to Dalian next day; Lin and Ye Qun 葉群 land at the western-suburb airport at 10:30 a.m. on Aug. 8 (Wu Faxian''s account, as Yang gives it; Yang''s note 18 says the Mao chronology has Lin back on the evening of Aug. 8, which the text of the chronology read here does not: it has the evening of Aug. 6)'
