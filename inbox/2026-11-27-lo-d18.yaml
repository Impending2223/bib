- edit:
    id: cal.1966-08-21.elections-1966
    base: d1077d9d
    kind: correct
    settles:
    - 'Check: the place.'
    set:
      c: 'The Catskills, Johnson and Robert Kennedy together.{1} Johnson''s speech; he introduces congressmen, then "a young man for whom I have the deepest respect": shrieks of "Bobby!"{2} The *Christian Science Monitor*''s headline, Aug. 22: "New Yorkers Applaud Johnson, Squeal at Kennedy."{3}'
      n: 'Remarks at the Dedication of the Ellenville Community Hospital, Ellenville, New York, [1966 Pub. Papers 849](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=223) (Aug. 19, 1966) (Johnson names Senator Robert F. Kennedy, "a young man for whom I have the deepest respect," who has joined him that afternoon after the Senate passed the demonstration cities bill). [[w.shesol-mutual-contempt]], 346; [[w.thomas-robert-kennedy]], 327 (Kennedy tours New York with Johnson, Aug. 21; the *Monitor*: "Crowds Applaud LBJ, Squeal at Kennedy"). Shesol and Thomas have the day Aug. 21, the day of the Campobello visit; the Public Papers date the Ellenville remarks, with Kennedy named, Aug. 19. The same remarks as [[cal.1966-08-19.health]]. Shesol''s note (532, to 345–346) dates the *Monitor*''s story Aug. 22, so it is not "the next day" of Aug. 19. Check: Thomas gives the headline "Crowds Applaud LBJ, Squeal at Kennedy" (327); his note cites the *Times* of Nov. 14, 1966 (462). To check: *Christian Science Monitor*, Aug. 22, 1966; *Newsweek*, Oct. 24, 1966; *U.S. News & World Report*, Nov. 7, 1966, at 40 (cited by [[w.shesol-mutual-contempt]], 345, 346). Names: Johnson, Robert Kennedy.'
      when: Aug. 19
      date: '1966-08-19'
      place: ellenville
- variant:
    id: cal.1966-08-25.china-leadership-3
    'on': Wang Shangrong 王尚榮 and Lei Yingfu 雷英夫, old subordinates of He Long 賀龍, sign it, and some of He Long's office staff join.
    witness: w.pu-weihua-zalan-jiu-shijie
    reads: the bureau's poster, "Great Good News" 〈特大喜訊〉, names Yang Chengwu and the deputy chief of staff for foreign affairs; Wang Shangrong and Lei Yingfu sign first the operations department's, "Bombard Yang Chengwu" 〈炮轟楊成武〉, after the bureau's march that afternoon; He Long's office staff post their own
    at: '124'
