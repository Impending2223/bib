      id: cal.1960-04.elections-1960-5
      when: Apr.
      date: 1960-04
      thread: elections-1960
      c: 'West Virginia. Back from the Greenbrier, Humphrey decides to run. Herb Waters explains slating: he has told "the
        appropriate people" Humphrey''s side would put up $25,000 and was "laughed out of the office," by Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 213–15; [[w.solberg-hubert-humphrey]], 210 (an aide''s advice: "One thousand
        dollars to get on a slate in a populated area"). To check: David Ginsburg to Humphrey, Mar. 15, 1960, Box 575, Humphrey
        Papers; Harry W. Ernst, *The Primary That Made a President: West Virginia 1960* (1962), 24; Claude Ellis, interview,
        Sept. 9, 1964, Kennedy Library; the *New York Times*, Aug. 10, 1981 (cited by [[w.solberg-hubert-humphrey]], 210,
        its note). See [[cal.1960-04.elections-1960]]. Check: the day. Names: Humphrey.'
      src:
        c: 07725ebf
        rows:
        - 'w.humphrey-education-of-a-public-1976 213–15: all'
        - 'w.solberg-hubert-humphrey 210: ?'
