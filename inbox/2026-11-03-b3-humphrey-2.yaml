      id: cal.1961-08.testing
      when: Summer
      date: 1961-08
      thread: testing
      c: 'The White House. Kennedy and Humphrey swim in the pool, then lunch in the Rose Garden. Humphrey: his bill for a
        disarmament agency, "not a prayer" without Kennedy''s support. Kennedy: go ahead; State and Defense will offer changes
        but support it.'
      n: '[[w.humphrey-education-of-a-public-1976]], 251 (the Russians "bearing down heavily on Berlin," the reserves called
        up); [[w.solberg-hubert-humphrey]], 217 (after the address on Berlin; Humphrey: "at this very hour when we build our
        armed strength"). To check: Humphrey, interview with Sherman, Box 2, Autobiography files; "Book Tapes," n.d., Box
        8, Autobiography files, Humphrey Papers (cited by [[w.solberg-hubert-humphrey]], 217, its note). See [[cal.1961-07-25.berlin-and-vienna]].
        Check: the day; Solberg puts it after the address of July 25. Names: Kennedy, Humphrey.'
      src:
