        - 'via w.solberg-hubert-humphrey 210 n.slate-ernst: B'
        - 'via w.solberg-hubert-humphrey 210 n.slate-ellis: B'
      tags:
      - name:humphrey-hubert-h
      - name:ginsburg-david
