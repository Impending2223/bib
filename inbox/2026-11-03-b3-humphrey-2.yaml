      date: '1966-02-14'
      thread: vietnam-humphrey
      c: 'Bangkok, evening. Humphrey and Harriman with Thanom, his deputies and the ministers of foreign affairs, defense,
        development and interior. Thanat: their fear of talks admitting the Viet Cong, of a coalition pressed on Saigon; Lippmann''s
        columns, Mansfield''s report on Cambodia, Morse''s charges. The insurgency, Praphat''s new suppression command; the
        Thais'' want of help.'
      n: 'Humphrey and Harriman to Johnson, Bangkok, Feb. 15, 1966, [FRUS 1964–68, XXVII: Mainland Southeast Asia; Regional
        Affairs, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v27/d308) (the meeting "last evening").
        [[w.humphrey-education-of-a-public-1976]], 332 (the Thais wanted commitments Rusk had turned down weeks before). See
        [[cal.1966-02-10.vietnam]]. Check: the day: the telegram is dated Feb. 15, its time group 141920Z. Names: Humphrey,
        Harriman, Thanom, Thanat, Lippmann, Mansfield, Morse, Praphat.'
