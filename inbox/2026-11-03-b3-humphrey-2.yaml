      when: Mar.
      date: 1960-03
      thread: elections-1960
      c: 'Wisconsin. Robert Kennedy spreads the word that Hoffa is pouring money into the State for Humphrey, $1.2 million.
        Humphrey: the story untrue, his requests that it be stopped unheeded.'
      n: '[[w.solberg-hubert-humphrey]], 205 (the word, the figure); [[w.humphrey-education-of-a-public-1976]], 208–09 (the
        story, Hoffa''s way of getting even with the Kennedys; untrue, and the requests to stop it unheeded, by his account).
        To check: Humphrey, interview with Drew Pearson, Apr. 22, 1960, Box 3, PFPM, Humphrey Papers; Heaney to Gaylord Nelson,
        Mar. 17, 1960, Box 734, Humphrey Papers (cited by [[w.solberg-hubert-humphrey]], 205, its note). See [[cal.1960-03.elections-1960]].
        Check: the day. Names: Robert Kennedy, Hoffa, Humphrey.'
