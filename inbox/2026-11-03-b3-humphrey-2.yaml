    entry:
      id: cal.1963-12.economy
      when: Dec. 1963–Jan. 1964
      date: 1963-12
      thread: economy
      c: 'The White House, at night, Humphrey fetching Byrd. Drinks; Lady Bird Johnson woken. Johnson to Byrd: "I need your
        commitment that you''ll get that bill out"; vote against it, but not bottle it up. Byrd: "if you want that bill out,
        I''ll do nothing to stop it." Humphrey to remind him daily on the floor.'
      n: '[[w.humphrey-education-of-a-public-1976]], 290–93 (after the Gridiron Dinner, by his account); [[w.solberg-hubert-humphrey]],
        242 (after the funeral; "Hubert, you tell him every day that the President is waiting for action"). See [[cal.1963-12-05.economy]].
        Check: the day: Humphrey gives "the spring of 1964," after the Gridiron Dinner; the bill was reported in January and
        passed the Senate Feb. 7, 1964 ([[cal.1964-02-07.economy]]); Solberg, 242, puts it after Kennedy''s funeral. Names:
        Byrd, Humphrey, Johnson, Lady Bird Johnson.'
      src:
        c: bd12691f
        rows:
