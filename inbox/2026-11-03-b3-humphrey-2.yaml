    entry:
      id: cal.1964-08.elections-1964-3
      when: Aug.
      date: 1964-08
      thread: elections-1964
      c: 'Rowe in Humphrey''s Senate office, as the convention nears: the questions again; then he calls Johnson and hands
        Humphrey the telephone. Humphrey: "Mr. President ... I understand your concern about relationships between the President
        and Vice President. You can rely on me. I will be loyal." Johnson thanks him; no commitment.'
      n: '[[w.humphrey-education-of-a-public-1976]], 298 (the place, the words); [[w.solberg-hubert-humphrey]], 245 (the words,
        by Rowe''s account; no comment in reply). To check: James Rowe, interview; Rowe to Johnson, "On Behalf of Hubert Humphrey,"
        Aug. 20, 1964, CF68PP, Humphrey Papers; [[w.martin-adlai-stevenson-and-the]], 803 (cited by [[w.solberg-hubert-humphrey]],
        245, its note). See [[cal.1964-08-20.elections-1964-2]]. Check: the day. Names: Rowe, Johnson, Humphrey.'
      src:
        c: b9ea4e1c
        rows:
        - 'w.humphrey-education-of-a-public-1976 298: all'
        - 'w.solberg-hubert-humphrey 245: all'
        - 'via w.solberg-hubert-humphrey 245 n.going-to-call-rowe: all'
        - 'via w.solberg-hubert-humphrey 245 n.going-to-call-memo: all'
      tags:
      - name:rowe-james-h-jr
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1964-07.elections-1964-6
      when: Before July 30
      date: 1964-07
      thread: elections-1964
      c: 'Rowe, at Johnson''s direction, has Humphrey to his house in Cleveland Park and questions him on the porch: his view
        of Johnson, his loyalty, any disagreement with his policies; his debts, mortgages, "other women"; "any skeletons in
        your closet?" Humphrey answers, by both men''s accounts.'
      n: '[[w.humphrey-education-of-a-public-1976]], 298; [[w.solberg-hubert-humphrey]], 243–44 (Rowe''s account: "the horse
        shedding"; Humphrey: "My God, I''ve been in public life twenty years"; before the ban on the Cabinet). To check: James
        Rowe, interview; Rowe, interview with Connell, n.d., Connell files; Hugh Sidey, "The Horse-Shedding of Hubert Humphrey"
        (cited by [[w.solberg-hubert-humphrey]], 244, its note). Check: the day. Names: Rowe, Johnson, Humphrey.'
      src:
        c: 43afbb4b
        rows:
        - 'w.humphrey-education-of-a-public-1976 298: all'
        - 'w.solberg-hubert-humphrey 243–44: all'
        - 'via w.solberg-hubert-humphrey 244 n.asked-every-rowe: all'
      tags:
      - name:rowe-james-h-jr
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
