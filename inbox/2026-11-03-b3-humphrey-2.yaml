      c: 'West Virginia, after Wisconsin. Humphrey, broke, hears offers of help from the other candidates: Johnson''s people
        refuse money "absolutely"; Symington''s come up with a little, later, by Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 213. See [[cal.1960-04.elections-1960]]. Check: the day. Check: Solberg,
        210, has a few Johnson friends send $1,000 contributions from New York toward the end, and Clements in the State to
        check on the delegates. Names: Humphrey, Johnson, Symington.'
