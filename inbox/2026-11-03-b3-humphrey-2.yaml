      c: 'Thief River Falls, Minn. Humphrey, at an early-morning coffee for farmers and townspeople, answers their questions
        on Kennedy: his own man, free of any church; the Vikings in Ireland, the reddish hair and blue eyes: "Why, he is one
        of us!"'
      n: '[[w.humphrey-education-of-a-public-1976]], 233. Check: the month. Names: Humphrey, Kennedy.'
