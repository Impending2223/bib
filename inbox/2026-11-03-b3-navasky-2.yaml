      when: Mar. 4
      date: '1961-03-04'
      thread: robert-kennedy
      also:
      - press-and-broadcasting
      c: 'Lyle Wilson of UPI: Hoover not about to retire; the reports of a rift untrue. "Ask for the source, ask for proof."
        The FBI and its boss at Justice "on the same basis of friendly informality as in other years."'
      n: '[[w.navasky-kennedy-justice]], 41–42. See [[cal.1961-02-27.robert-kennedy]]. Names: Hoover.'
      src:
        c: a553fb6b
        rows:
        - 'w.navasky-kennedy-justice 41–42: all'
      tags:
      - 'name:hoover-j-edgar'
    section: '196103'
