      when: Mar. 19
      date: '1961-03-19'
      thread: robert-kennedy
      c: 'Robert Kennedy, a press statement, of Hoover: "[We] get along extremely well. I have a great deal of admiration
        for him. I would hope that he would continue to have a long and worthy service."'
      n: '[[w.navasky-kennedy-justice]], 42. To check: Robert Kennedy, press statement, Mar. 19, 1961, Office of Public Information,
        Department of Justice (cited by [[w.navasky-kennedy-justice]], 42 n.17). See [[cal.1961-02-27.robert-kennedy]]. Names:
        Robert Kennedy, Hoover.'
      src:
        c: d83374cc
        rows:
        - 'w.navasky-kennedy-justice 42: all'
        - 'via w.navasky-kennedy-justice 42 n.17: all'
      tags:
      - 'name:kennedy-robert-f'
      - 'name:hoover-j-edgar'
    section: '196103'
