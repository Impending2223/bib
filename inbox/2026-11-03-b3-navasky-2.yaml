      when: Mar. 3
      date: '1961-03-03'
      thread: robert-kennedy
      also:
      - press-and-broadcasting
      c: 'Sokolsky''s column: the *Insider''s Newsletter* has Hoover out by summer; he will not resign, but might be dismissed.
        Kennedy "an astute man"; to dismiss Hoover "would start such a fracas as no one needs."'
      n: '[[w.navasky-kennedy-justice]], 41. See [[cal.1961-02-27.robert-kennedy]]. Names: Hoover, Robert Kennedy.'
      src:
        c: 356cd264
        rows:
        - 'w.navasky-kennedy-justice 41: all'
      tags:
      - 'name:hoover-j-edgar'
      - 'name:kennedy-robert-f'
    section: '196103'
- add:
    entry:
