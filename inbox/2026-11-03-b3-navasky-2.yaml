      when: Feb. 27
      date: '1961-02-27'
      thread: robert-kennedy
      also:
      - press-and-broadcasting
      c: 'The Hearst papers: "the line is" that Robert Kennedy and Hoover have fallen out; "never been as close a team" at
        Justice. Kennedy at Hoover''s office on the organized-crime program; the two walk to the Treasury to see Dillon.'
      n: '[[w.navasky-kennedy-justice]], 41. Names: Robert Kennedy, Hoover, Dillon.'
      src:
        c: 8654c63a
        rows:
        - 'w.navasky-kennedy-justice 41: all'
      tags:
      - 'name:kennedy-robert-f'
      - 'name:hoover-j-edgar'
      - 'name:dillon-c-douglas'
    section: '196102'
- add:
    entry:
