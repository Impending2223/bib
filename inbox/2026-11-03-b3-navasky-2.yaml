      when: Jan.
      date: 1961-01
      thread: crime-and-hijacking
      c: 'Hoover, in the FBI''s *Law Enforcement Bulletin* for January: "muddle-headed sentimentalists" wrap "teenage brigands"
        in the term "juvenile delinquency"; banish it; call it "youthful criminality."'
      n: '[[w.navasky-kennedy-justice]], 17. To check: FBI *Law Enforcement Bulletin*, Jan. 1961, Hoover''s editorial (cited
        by [[w.navasky-kennedy-justice]], 17 n.4). Names: Hoover.'
      src:
        c: afc08568
        rows:
        - 'w.navasky-kennedy-justice 17: all'
        - 'via w.navasky-kennedy-justice 17 n.4: all'
      tags:
      - 'name:hoover-j-edgar'
    section: '196101'
- add:
    entry:
      id: cal.1961-06.crime-and-hijacking
      when: June
      date: 1961-06
      thread: crime-and-hijacking
      c: 'Hoover against "misguided do-gooders," "maudlin viewers of the death penalty" and "Bible quoters who object to capital
        punishment."'
      n: '[[w.navasky-kennedy-justice]], 17. To check: the FBI''s *Law Enforcement Bulletins* and Hoover''s speeches (cited
        by [[w.navasky-kennedy-justice]], 17 n.4). See [[cal.1961-01.crime-and-hijacking-2]]. Names: Hoover. Check: the occasion
        and the day.'
      src:
        c: 6f9ec93f
        rows:
        - 'w.navasky-kennedy-justice 17: all'
      tags:
      - 'name:hoover-j-edgar'
    section: '196106'
- add:
    entry:
      id: cal.1963-11.antisubversion
      when: Nov.
      date: 1963-11
      thread: antisubversion
      c: 'New York, the Hilton. Hoover to 4,500 teenagers at a CYO convention: Communists to be banned from campus; their
        presence "has nothing to do with academic freedom."'
      n: '[[w.navasky-kennedy-justice]], 17. Names: Hoover. Check: the month (Navasky: "a year later" than November 1962)
        and the day.'
      src:
        c: 112da015
        rows:
        - 'w.navasky-kennedy-justice 17: all'
      tags:
      - 'name:hoover-j-edgar'
      - 'state:ny'
      - 'city:nyc'
    section: '196311'
- add:
    entry:
