      n: '[[w.jian-maos-china-and-the]], 212–14 (by the Chinese records). Washington''s knowledge: [FRUS 1964–68, I, doc.
        318](https://history.state.gov/historicaldocuments/frus1964-68v01/d318) (Saigon, Aug. 17: MiGs at Phúc Yên). To check:
        *Beijing Review*, Nov. 30, 1979, 14 (cited by [[w.jian-maos-china-and-the]], 213 n.34, for the cable); the government''s
        statement, *Renmin ribao*, Aug. 6, 1965 (so cited), and Mao''s approval of it, *Jianguo yilai Mao Zedong wengao*,
        11:120 (cited by [[w.jian-maos-china-and-the]], 214 n.42, for the statement). Made public: the cable, *Beijing Review*,
        Nov. 30, 1979, by Chen''s note (354 n.34). See [[cal.1964-08-02.vietnam]]. Names: Zhou Enlai, Hồ Chí Minh, Phạm Văn
        Đồng. Check: the statement''s day; Chen''s note (355 n.42) gives the *People''s Daily* of Aug. 6, 1965.'
