- add:
    entry:
      id: cal.1965-04-14.south-asia
      when: Apr. 14–15
      date: '1965-04-14'
      thread: south-asia
      also:
      - china
      c: 'Johnson to Ayub Khan, by letter: his visit to Washington this month put off, perhaps to the fall. A visit now would
        fix public attention on the two countries'' differences over Communist China, with the aid bill at its most sensitive
        point in Congress and American casualties mounting in Vietnam. Apr. 15, McConaughy gives Ayub the letter at Rawalpindi:
        a postponement, not a cancellation; Ayub "slightly taken aback."'
      n: '[FRUS 1964–68, XXV, doc. 100](https://history.state.gov/historicaldocuments/frus1964-68v25/d100) (Rusk to McConaughy,
        the letter''s text); [doc. 103](https://history.state.gov/historicaldocuments/frus1964-68v25/d103) (McConaughy, Rawalpindi,
        Apr. 15). [[w.jian-maos-china-and-the]], 217 (the visit put off). To check: [[w.mcmahon-cold-war-on-the]] (cited by
        [[w.jian-maos-china-and-the]], 217 n.56, for the reasons). Made public: FRUS 1964–68, XXV (2000). Names: Johnson,
        Ayub Khan, McConaughy.'
      tags:
      - name:johnson-lyndon-b
      - name:ayub-khan-mohammad
      - name:mcconaughy-walter-p-jr
      src:
        c: 39a46c73
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v25/d100: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v25/d103: C-D'
        - 'w.jian-maos-china-and-the 217: A'
- add:
    entry:
      id: cal.1965-04-15.south-asia
      when: Apr. 15
      date: '1965-04-15'
      thread: south-asia
      c: 'Shastri''s visit to Washington put off too: Johnson''s message, through Bowles, gives Vietnam and the "intense debate"
        ahead on the aid program in Congress. Bundy to Bowles: not "merely a conditioned reflex" to the decision on Ayub.'
      n: '[FRUS 1964–68, XXV, doc. 101](https://history.state.gov/historicaldocuments/frus1964-68v25/d101) (Bundy to Bowles,
        5:30 p.m.); [doc. 102](https://history.state.gov/historicaldocuments/frus1964-68v25/d102) (the message, 8:57 p.m.).
        Made public: FRUS 1964–68, XXV (2000). See [[cal.1965-04-14.south-asia]]. Names: Shastri, Johnson, Bowles, McGeorge
        Bundy.'
      tags:
      - name:shastri-lal-bahadur
      - name:johnson-lyndon-b
      - name:bowles-chester
      - name:bundy-mcgeorge
      src:
        c: 36f0ad9a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v25/d102: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v25/d101: B'
- add:
    entry:
      id: cal.1968-01-08.china
      when: Jan. 8
      date: '1968-01-08'
      thread: china
      c: 'Warsaw. The 134th meeting of the Sino-American ambassadorial talks, two hours and a quarter: Gronouski and the Chinese
        chargé, Chen Dong. Taiwan the key obstacle; "peaceful coexistence" out of the question while the United States "occupies"
        Taiwan. The last meeting until Jan. 20, 1970.'
      n: '[FRUS 1964–68, XXX, doc. 295](https://history.state.gov/historicaldocuments/frus1964-68v30/d295) (Gronouski''s report).
        [[w.jian-maos-china-and-the]], 249, 251 (the last meeting until 1970). To check: [[w.goh-constructing-the-u-s]]. Made
        public: FRUS 1964–68, XXX. Names: Gronouski.'
      tags:
      - name:gronouski-john-a
      src:
        c: 83e4e9e5
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v30/d295: A-D'
        - 'w.jian-maos-china-and-the 249: E'
        - 'w.jian-maos-china-and-the 251: E'
- add:
    entry:
      id: cal.1968-11-25.china
      when: Nov. 25
      date: '1968-11-25'
      thread: china
      c: 'Warsaw. The Chinese chargé, Chen Dong, to Stoessel, answering his letters of Sept. 12 and Nov. 15: the 135th meeting,
        which the Americans ask put off, to be held Feb. 20, 1969, "By that time your new President will have been in office
        for a month." The two principles restated: American forces out of Taiwan, an agreement on the five principles of peaceful
        coexistence.'
      n: '[FRUS 1964–68, XXX, doc. 331](https://history.state.gov/historicaldocuments/frus1964-68v30/d331). [[w.jian-maos-china-and-the]],
        245 (Peking''s quick answer). Made public: FRUS 1964–68, XXX. See [[cal.1968-01-08.china]]. Names: Stoessel. Check:
        Chen, 245, has the United States propose in November to resume the talks and Peking answer "with unprecedented speed";
        by FRUS, Stoessel''s letters asked the meeting put off.'
      tags:
      - name:stoessel-walter-j-jr
      src:
        c: 1408fb64
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v30/d331: all'
        - 'w.jian-maos-china-and-the 245: B'
- add:
    entry:
      id: cal.1968-11-29.china
      when: Nov. 29
      date: '1968-11-29'
      thread: china
      c: 'Rusk to Stoessel: the meeting of Feb. 20 accepted, at 2 p.m.; the meetings henceforth to alternate between the two
        embassies, as Wang Ping-nan proposed Sept. 13, 1958, for more secure surroundings.'
      n: '[FRUS 1964–68, XXX, doc. 332](https://history.state.gov/historicaldocuments/frus1964-68v30/d332). Made public: FRUS
        1964–68, XXX. See [[cal.1968-11-25.china]]. Names: Rusk, Stoessel, Wang Ping-nan.'
      tags:
      - name:rusk-dean
      - name:stoessel-walter-j-jr
      - name:wang-ping-nan
      src:
        c: fe7f38a1
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v30/d332: all'
- add:
    entry:
      id: cal.1968-10-16.vietnam
      when: Oct. 16
      date: '1968-10-16'
      thread: vietnam
      also:
      - vietnam-paris
      c: 'Paris, in private: Harriman and Vance with Xuân Thủy and Hà Văn Lâu. The message delivered: the "serious talks"
        the day after a halt must include Saigon and the NLF. Thủy: a "new condition," which the Politburo will likely reject;
        an "outside chance" it will accept.'
      n: '[FRUS 1964–68, VII, doc. 76](https://history.state.gov/historicaldocuments/frus1964-68v07/d76) (Rostow to Johnson,
        9:30 a.m.: "this morning''s meeting"). [[w.nguyen-hanois-war]], 126 (the meeting, Hanoi''s side). Made public: FRUS
        1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Harriman, Vance, Xuân Thủy, Hà Văn Lâu. Check: Nguyen,
        126, dates the meeting Oct. 15.'
      tags:
      - name:harriman-w-averell
      - name:vance-cyrus
      - name:xuan-thuy
      - name:ha-van-lau
      src:
        c: 3d691b81
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d76: all'
        - 'w.nguyen-hanois-war 126: A'
        - 'via w.nguyen-hanois-war 126 n.61: all'
- add:
    entry:
      id: cal.1968-10-21.vietnam-paris
      when: Oct. 21
      date: '1968-10-21'
      thread: vietnam-paris
      c: 'Paris, four hours: Harriman and Vance with Xuân Thủy and Hà Văn Lâu. Thủy proposes a joint communiqué: the bombing
        stopped without conditions, a "four power conference," to meet "as soon as possible." The four powers and the open
        date refused; Thủy leaves the impression the NLF could be in Paris a week after the halt. No agreement.'
      n: '[FRUS 1964–68, VII, doc. 95](https://history.state.gov/historicaldocuments/frus1964-68v07/d95) (Read''s situation
        report, Vance by secure telephone). [[w.nguyen-hanois-war]], 128 (the meeting). Made public: FRUS 1964–68, VII (2003).
        See [[cal.1968-09-07.vietnam]]. Names: Harriman, Vance, Xuân Thủy, Hà Văn Lâu.'
      tags:
      - name:harriman-w-averell
      - name:vance-cyrus
      - name:xuan-thuy
      - name:ha-van-lau
      src:
        c: 17509a4e
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d95: all'
        - 'w.nguyen-hanois-war 128: A'
        - 'via w.nguyen-hanois-war 128 n.68: all'
- add:
    entry:
      id: cal.1968-10-25.soviet-union
      when: Oct. 25
      date: '1968-10-25'
      thread: soviet-union
      also:
      - vietnam-paris
      c: 'Rostow with Dobrynin at his house, 5 p.m.: the President''s oral communication on the stories from Soviet sources
        that peace is near. At 6 a message to the President from Kosygin on Vietnam arrives. By Nguyen''s account it hopes
        "third-rate details" of the talks can be settled.'
      n: '[FRUS 1964–68, VII, doc. 122](https://history.state.gov/historicaldocuments/frus1964-68v07/d122) (Rostow to Johnson,
        9 p.m.). [[w.nguyen-hanois-war]], 128 (the letter). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]].
        Names: Rostow, Dobrynin, Kosygin. Check: the message''s text.'
      tags:
      - name:rostow-walt-w
      - name:dobrynin-anatoly
      - name:kosygin-aleksei
      - name:johnson-lyndon-b
      src:
