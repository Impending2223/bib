    entry:
      id: cal.1964-03-19.transition-and-staff-4
      when: Mar. 19
      date: '1964-03-19'
      time: 1964-03-19T20:30Z
      time_zone: America/New_York
      place: washington
      thread: transition-and-staff
      c: 'The White House, 3:30 p.m. Johnson sees Salinger, Moyers having arranged the time: Salinger will resign to run for the Senate in California. Johnson: "Remember, I did the same thing myself once"; he tells him to draft a letter of resignation and will write one accepting it.'
      n: '[[w.salinger-with-kennedy]], 346 (Salinger''s account: "The President sent for me at 3:30 P.M."); [[w.white-making-of-the-president-1965]], 246 (Moyers arranges the time). Check: the hour against Mrs. Johnson''s diary, 96, not read here. See [[cal.1964-03-19.transition-and-staff]]. Names: Johnson, Salinger, Moyers.'
      tags:
      - name:johnson-lyndon-b
      - name:salinger-pierre
      - name:moyers-bill
