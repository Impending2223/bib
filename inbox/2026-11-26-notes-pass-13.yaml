      c: 'Atlantic City, Rowe''s room. Jenkins telephones Humphrey twice: "You can''t land a plane in Washington; there''s too much fog"; then, "You can''t go until tomorrow." Humphrey, sworn to secrecy, is let tell Muriel.'
      n: '[[w.solberg-hubert-humphrey]], 254 (after they had ordered something to eat). See [[cal.1964-08-25.elections-1964-3]]. Names: Walter Jenkins, Humphrey, Rowe.'
