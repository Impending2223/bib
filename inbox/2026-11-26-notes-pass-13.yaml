      n: '[[w.caro-passage-of-power]], 592–94; [[w.robert-kennedy-in-his]], 413 (Salinger''s call to Robert Kennedy on the Thursday; the filing on Friday); [[w.white-making-of-the-president-1965]], 246 (Salinger''s decision; Moyers arranges the time with the President; Johnson counts out $450, the filing fee, in cash); [[w.johnson-white-house-diary]], 96 (Salinger tells Johnson in his office about 3 p.m. that he will resign to run for the Senate in California, and then tells the press; the diary has no lunch); [[w.salinger-with-kennedy]], 345–47 (the lawyer''s call at lunch; Salinger tells Jenkins and Moyers; Johnson sees him at 3:30; the letter of resignation at 5 and Johnson''s letter accepting it; Reedy named at once; Johnson gives him a filing fee in cash, Salinger saying $450 and Johnson hearing $250). Check: Robert Kennedy has Salinger call him on Thursday "to resign the next day" ([[w.robert-kennedy-in-his]], 413). To check: *Washington Evening Star*, Mar. 20, 1964; *Newsweek*, Mar. 30, 1964 (cited by [[w.caro-passage-of-power]], 592–93). Check: the White House''s announcement. Names: Salinger. The time is the letters, 5 p.m. by Salinger (346); Johnson saw him at 3:30, an entry of its own.'
