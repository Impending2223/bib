      time_range:
      - 1964-07-15T23:00Z
      - 1964-07-16T02:00Z
      time_band: evening
      time_zone: America/New_York
      range_basis: record
      c: 'Galbraith, summoned to Washington by Johnson, three hours with him that evening, by Schlesinger''s journal, from Galbraith. Johnson goes through some eighteen vice-presidential possibilities and narrows them to six: Humphrey, Kennedy, McNamara, Stevenson, McCarthy, Shriver; McNamara with great admiration, Humphrey with warmth. He complains of the coldness of the Kennedy people.'
      n: '[[w.schlesinger-journals]], 228–29 ("three hours with him that evening and another hour the next morning"; the journal of July 23). Check: the journal does not say at which of the two meetings Johnson went through the list. See [[cal.1964-07-16.elections-1964-johnson]]. Names: Galbraith, Johnson, Humphrey, Robert Kennedy, McNamara, Stevenson, McCarthy, Shriver.'
      tags:
      - name:galbraith-john-kenneth
