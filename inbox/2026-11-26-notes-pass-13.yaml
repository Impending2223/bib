    words: Moyers buzzes Johnson; Johnson sees Salinger at 3:30 p.m. Salinger hands in his letter at 5 p.m. and Johnson gives him his letter of acceptance. Asked the California filing fee, Salinger says $450; Johnson, hearing $250, hands him that in cash, by Salinger's account.
