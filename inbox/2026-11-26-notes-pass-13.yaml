      time: 1964-05-15T00:38Z
      time_zone: America/New_York
      thread: baker
      c: 'Johnson to Mansfield by telephone, 8:38 p.m., just off the plane and reading the ticker: "Sorry you had all that difficulty today, but I''m awfully grateful to you." Mansfield: "it had to be done." Johnson on Williams: "a mean vicious man."'
      n: '[Johnson and Mike Mansfield, 8:38 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mike-mansfield-may-15-1964), Conversation WH6405-07-3457 (Miller Center; catalogued May 14, 20:38). [[w.taking-charge]], 356–57. Made public: the recordings, opened by the LBJ Library. Check the year. See [[cal.1964-05-14.baker]]. Names: Johnson, Mansfield, Williams.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
