# ---------------------------------------------------------------- 1963: Văn kiện Đảng toàn tập, vol. 24 (2003)
- add:
    entry:
      id: cal.1963-01-02.vietnam-hanoi
      when: Jan. 2
      date: '1963-01-02'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 65-NQ/TW on the first stage, about 1961–70, of the Red River''s control and development: the dikes raised against a flood of +13.3 m at Hanoi; temporary flood basins at Tam Nông and Thanh Thủy, in Phú Thọ, and Văn Cốc, in Sơn Tây and Hà Đông; the Chinese experts commended.'
      n: '*Nghị quyết của Bộ Chính trị số 65-NQ/TW về quy hoạch trị thuỷ và khai thác lưu vực sông Hồng thời kỳ đầu*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIV, 8–11. Made public: 2003.'
      tags: [polity:drv, polity:prc]
- add:
    entry:
      id: cal.1963-01-02.vietnam-hanoi-2
      when: Jan. 2
      date: '1963-01-02'
      thread: vietnam-hanoi
      c: 'The Secretariat with the standing committee of the Council of Ministers, on the people''s land reclamation: some 160,000 hectares reclaimed in 1961–62, 45 percent of the task set; the course for the years ahead and the policies to be issued.'
      n: '*Thông báo của Ban Bí thư số 42-TB/TW về cuộc Hội nghị giữa Ban Bí thư Trung ương*, Jan. 15, 1963, of the meeting of Jan. 2, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXIV, 50–57. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-01-05.vietnam-hanoi
      when: Jan. 5
      date: '1963-01-05'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 66-NQ/TW on the 1963 plan, the five-year plan''s third year: farming grew in 1962 despite natural disasters, industry at a fair pace; for 1963, more strength for agriculture, on the campaign to improve the cooperatives'' management and technique; closer direction of the plan from the center to the localities.'
      n: '*Nghị quyết của Bộ Chính trị số 66-NQ/TW về hướng dẫn và nhiệm vụ kế hoạch năm 1963*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIV, 12–32 (the tasks, 19 ff.). Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-01-12.vietnam-hanoi
      when: Jan. 12
      date: '1963-01-12'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 67-NQ/TW on the state''s finances for 1963: domestic revenue in 1962, by the revised budget, 80 million đồng below the plan and 4.3 percent above 1961, the slowest rise in years (28 percent a year in the three years of socialist transformation, 10.5 percent in 1961); large, slow works begun and farming in difficulty.'
      n: '*Nghị quyết của Bộ Chính trị số 67-NQ/TW về phương hướng thu chi tài chính nhà nước năm 1963*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIV, 40–49. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-01-31.vietnam-hanoi
      when: Jan. 31
      date: '1963-01-31'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 58-CT/TW on the drought: more than two months without rain, cold and frost since mid-December, over 120,000 hectares dry; forces to be massed against it and the winter-spring crop pressed.'
      n: '*Chỉ thị của Ban Bí thư số 58-CT/TW về việc khẩn trương tập trung lực lượng chống hạn, đẩy mạnh vụ sản xuất Đông - Xuân*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 75–80. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-02-01.vietnam-hanoi
      when: Feb. 1
      date: '1963-02-01'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 68-NQ/TW on the people''s procuracy: an instrument of the dictatorship, to see the law obeyed, strictly and uniformly, and so to strengthen the dictatorship over counterrevolutionaries and secure the people''s democratic rights.'
      n: '*Nghị quyết của Bộ Chính trị số 68-NQ/TW về công tác kiểm sát*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXIV, 81–86. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-02-11.vietnam-hanoi
      when: Feb. 11
      date: '1963-02-11'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 69-NQ/TW on organization and Party building in 1963: the members'' political quality, the base organizations, the leadership and methods at the center and in the provinces, cities and districts, the training and management of cadres.'
      n: '*Nghị quyết của Ban Bí thư số 69-NQ/TW về nhiệm vụ và phương hướng công tác tổ chức, xây dựng Đảng năm 1963*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 87–97. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-02-16.vietnam-hanoi
      when: Feb. 16
      date: '1963-02-16'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 59-CT/TW on local military work in 1963: the militia and self-defense forces, strengthened in 1962, the core of the people''s fight against commandos and bandits, for public order and the protection of production.'
      n: '*Chỉ thị của Ban Bí thư số 59-CT/TW về nhiệm vụ công tác quân sự địa phương năm 1963*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 98–100. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-02-19.vietnam-hanoi
      when: Feb. 19
      date: '1963-02-19'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 70-NQ/TW opens the campaign "Cải tiến quản lý hợp tác xã, cải tiến kỹ thuật" (improve the cooperatives'' management, improve technique) for all-round, strong and steady farm production: the cooperatives'' yields stalled, in places fallen.'
      n: '*Nghị quyết của Bộ Chính trị số 70-NQ/TW về cuộc vận động "Cải tiến quản lý hợp tác xã, cải tiến kỹ thuật, nhằm phát triển sản xuất nông nghiệp toàn diện, mạnh mẽ và vững chắc"*. [[w.van-kien-dang-toan]], XXIV, 101–17. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-02-23.vietnam-hanoi
      when: Feb. 23
      date: '1963-02-23'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 71-NQ/TW on farming in the highlands: the fifth plenum''s line to apply there too, with provisions of its own for the highlands'' conditions; collectivization and production there reviewed.'
      n: '*Nghị quyết của Bộ Chính trị số 71-NQ/TW về vấn đề phát triển nông nghiệp ở miền núi*, signed for the Politburo by Nguyễn Chí Thanh. [[w.van-kien-dang-toan]], XXIV, 118–55. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-03-02.vietnam-hanoi
      when: Mar. 2
      date: '1963-03-02'
      thread: vietnam-hanoi
      c: 'The Politburo, on the preliminary design of the Thác Bà hydroelectric plant, decides to go on building it: the reservoir''s normal level 58 m, 61.90 m in a ten-thousand-year flood; 108,000 kW; the whole plant done by the end of 1967.'
      n: '*Nghị quyết của Bộ Chính trị số 72-NQ/TW về thiết kế sơ bộ Nhà máy Thuỷ điện Thác Bà*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXIV, 178–79. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-03-07.vietnam-hanoi
      when: Mar. 7
      date: '1963-03-07'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 73-NQ/TW fixes the food obligation for the rest of the first five-year plan: the farm tax and the sales of paddy and maize to the state held at about 17 percent of the harvest for the North, on the average of 1960–62, each locality''s quota in absolute amounts.'
      n: '*Nghị quyết của Bộ Chính trị số 73-NQ/TW về chính sách ổn định nghĩa vụ lương thực trong kế hoạch 5 năm lần thứ nhất*, signed for the Politburo by Phạm Hùng. [[w.van-kien-dang-toan]], XXIV, 180–89 (the rate, 185). Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-03-08.vietnam-hanoi
      when: Mar. 8–9
      date: '1963-03-08'
      thread: vietnam-hanoi
      c: 'The Politburo: the Center''s "chỉ đạo riêng" (special direction), members of the Politburo and the Secretariat each to follow chosen provinces, cities and units and a base of their own, and to lead the great campaigns; a summing-up of the Party''s more than thirty years of experience.'
      n: '*Nghị quyết của Bộ Chính trị số 74-NQ/TW về công tác chỉ đạo riêng của Trung ương*, Mar. 14, of the session of Mar. 8, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 190–94, 527–29 (Nghị quyết của Bộ Chính trị, No. 77-NQ/TW, Apr. 18, of the meeting of Mar. 9; signed for the Politburo by Lê Duẩn). Made public: 2003. Check: one session or two; the resolutions give Mar. 8 and Mar. 9.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-04-16.vietnam-hanoi
      when: Apr. 16
      date: '1963-04-16'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 76-NQ/TW on the trade unions'' role and tasks in socialist industrialization: by the Third Congress''s decision, their place raised in every field under the Trade Union Law, a school of economic and state management.'
      n: '*Nghị quyết của Ban Bí thư số 76-NQ/TW về vai trò và nhiệm vụ của công đoàn trong sự nghiệp công nghiệp hoá xã hội chủ nghĩa và xây dựng chủ nghĩa xã hội*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 509–26. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-05-21.vietnam-hanoi
      when: May 21
      date: '1963-05-21'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 80-NQ/TW on the leadership of labor and wage work and the strengthening of the Ministry of Labor.'
      n: '*Nghị quyết của Bộ Chính trị số 80-NQ/TW về việc tăng cường lãnh đạo công tác lao động tiền lương và kiện toàn Bộ Lao động*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 549–52. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-07-08.vietnam-hanoi
      when: July 8
      date: '1963-07-08'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 124-TT/TW on the pupils from the South: their boarding schools in the North still needed for a long time, of great political meaning for the revolution in the South now and after.'
      n: '*Thông tri của Ban Bí thư số 124-TT/TW về việc tích cực giải quyết tốt vấn đề học sinh miền Nam*, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXIV, 584–87. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-07.vietnam-hanoi-2
      when: July
      date: '1963-07'
      thread: vietnam-hanoi
      c: 'COSVN''s resolution on fighting and breaking the strategic hamlets: the enemy has built nearly 5,000 hamlets, wards and blocks, regrouping over 6,000,000 people, short of the 8,000 planned for 1962; the hold of 2,500 broken from one to forty times, over 300 abandoned, over 50,000 people back in their homes. The hamlets the urgent task.'
      n: '*Nghị quyết của Trung ương Cục miền Nam, tháng 7 năm 1963, về công tác chống, phá khu, ấp chiến lược, gom dân*. [[w.van-kien-dang-toan]], XXIV, 912–39 (appendix, its pages unnumbered in the copy, counted from 910; the figures, 914–16). Made public: 2003. Check: the day; the volume gives the month.'
      tags: [polity:drv, polity:rvn]
- add:
    entry:
      id: cal.1963-07-31.vietnam-hanoi
      when: July 31
      date: '1963-07-31'
      thread: vietnam-hanoi
      c: 'The Interzone V Party Committee''s enlarged third conference, July 15–31, closes: a people''s patriotic war, all-round and protracted; guerrilla war and political struggle to defeat the sweeps and the strategic hamlets; the enemy''s offensive plans for 1963 and 1964 to be defeated; the mountain bases held and widened, the lowlands'' liberated zones extended, the towns'' movement pressed.'
      n: '*Nghị quyết Hội nghị khu uỷ Khu V mở rộng lần thứ III, họp từ 15 đến 31 tháng 7 năm 1963*. [[w.van-kien-dang-toan]], XXIV, 940–93 (appendix, pages counted from 910; the tasks, 955). Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-07-24.vietnam-hanoi
      when: July 24
      date: '1963-07-24'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 85-NQ/TW, in place of resolution no. 51-NQ/TW, on the campaign "Nâng cao ý thức trách nhiệm, tăng cường quản lý kinh tế tài chính, cải tiến kỹ thuật, chống tham ô, lãng phí, quan liêu" (raise responsibility, tighten economic and financial management, improve technique, against embezzlement, waste and bureaucracy): the "three builds, three antis."'
      n: '*Nghị quyết của Bộ Chính trị số 85-NQ/TW về việc hợp nhất hai Đảng bộ và hai*, signed for the Politburo by Lê Duẩn. [[w.van-kien-dang-toan]], XXIV, 588–602. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-07-27.vietnam-hanoi
      when: July 27
      date: '1963-07-27'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh at the conference to make known the Politburo''s resolution on the "3 xây, 3 chống" (three builds, three antis): it and the cooperatives'' campaign two wheels of one cart; the sense of ownership and responsibility weak, economic management loose, labor discipline slack.'
      n: '*Bài nói của Chủ tịch Hồ Chí Minh tại Hội nghị phổ biến Nghị quyết của Bộ Chính trị ...*. [[w.van-kien-dang-toan]], XXIV, 603–08. See [[cal.1963-07-24.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags: [name:ho-chi-minh, polity:drv]
- add:
    entry:
      id: cal.1963-08-27.vietnam-hanoi
      when: Aug. 27
      date: '1963-08-27'
      thread: vietnam-hanoi
      also: [soviet-union, china]
      c: 'The Secretariat''s circular no. 128-TT/TW on international relations, after the Central Committee has made known to the Party its views on the movement''s strategy and its stand for overcoming the differences: only the Central Committee, or those it charges, may speak abroad on the movement''s line; delegations to prepare what they will say, and ask the Politburo or the Secretariat where needed; letters abroad on the differences, and private requests to foreigners for documents on them, to be prevented.'
      n: '*Thông tri của Ban Bí thư số 128-TT/TW về một số vấn đề về quan hệ quốc tế trong tình hình trước mắt hiện nay*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 610–11. Made public: 2003.'
      tags: [polity:drv, polity:ussr, polity:prc]
- add:
    entry:
      id: cal.1963-09-11.vietnam-hanoi
      when: Sept. 11
      date: '1963-09-11'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 66-CT/TW on urgent work against the spies and commandos the Americans and Diệm drop into the North: many teams caught and punished, counterrevolutionaries sent to reeducation; but some intrusions undetected, the dangerous ones not concentrated fast enough, internal security in many offices, plants, farms and units neglected.'
      n: '*Chỉ thị của Ban Bí thư số 66-CT/TW về việc tiến hành khẩn trương các công tác để sẵn sàng đập tan âm mưu của Mỹ - Diệm tung gián điệp, biệt kích ra phá hoại miền Bắc nước ta*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 616–25. Made public: 2003. Names: Ngô Đình Diệm.'
      tags: [name:ngo-dinh-diem, polity:drv, polity:us, polity:rvn]
- add:
    entry:
      id: cal.1963-09-20.vietnam-hanoi
      when: Sept. 20
      date: '1963-09-20'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 67-CT/TW on the people''s air defense: American and Diệm aircraft over the North to scout, drop commandos and supply their agents; a surprise bombing of some important place possible. The Council of Ministers'' decree no. 112 of July 25 on the people''s air defense to be studied and carried out, the Central Military Party Committee and the Defense Ministry directing.'
      n: '*Chỉ thị của Ban Bí thư số 67-CT/TW về công tác phòng không nhân dân*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 626–27. Made public: 2003. Names: Ngô Đình Diệm.'
      tags: [name:ngo-dinh-diem, polity:drv, polity:us, polity:rvn]
- add:
    entry:
      id: cal.1963-10.vietnam-hanoi-3
      when: Oct.
      date: '1963-10'
      thread: vietnam-hanoi
      c: 'The Interzone VI Party Committee''s enlarged conference, its resolution no. 128: the enemy has regrouped people, retaken ground and set new posts in the bases, the southern Central Highlands above all; the strategic hamlets mostly finished in the zones it controls and contests; the zone''s tasks changed to suit.'
      n: '*Nghị quyết số 128 (HN.J mở rộng ... đến tháng 10 năm 1963)*, "HN.J" the Interzone VI committee''s conference by the editors'' note. [[w.van-kien-dang-toan]], XXIV, 994–1056 (appendix, pages counted from 910; the editors could not fix the days, 994 n.2). Made public: 2003. Check: the days.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-11-19.vietnam-hanoi
      when: Nov. 19
      date: '1963-11-19'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 68-CT/TW opens the campaign to protect the Party: revolutionary vigilance and discipline, the political vetting of cadres and members whose histories are unclear, the management of the Party''s ranks improved; piloted from December 1962, to run alongside the three great campaigns to the end of 1965.'
      n: '*Chỉ thị của Ban Bí thư số 68-CT/TW về việc mở cuộc vận động nâng cao tinh thần cảnh giác cách mạng, ý thức tổ chức kỷ luật; làm tốt công tác thẩm tra chính trị và cải tiến công tác quản lý đội ngũ cán bộ, đảng viên để bảo vệ Đảng (gọi tắt là cuộc vận động bảo vệ Đảng)*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 630–41 (the span, 635). Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-11-27.vietnam-hanoi
      when: Nov. 27
      date: '1963-11-27'
      thread: vietnam-hanoi
      also: [laos]
      c: 'The Secretariat''s rules no. 86-NQ/TW for the cadres and staff the Party has sent to work in "miền Tây" (the West), at the request of "Bạn" (the friends): to serve there for the long term, home every three years or so for six months to a year of study; allowances for them and their families, in place of the Secretariat''s rules of July 25, 1961.'
      n: '*Quy định của Ban Bí thư số 86-NQ/TW về một số chế độ đối với cán bộ, nhân viên công tác miền Tây*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 642–49. Made public: 2003. Check: "miền Tây", Laos by the house use of the time; the volume does not say.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-11-29.vietnam-hanoi
      when: Nov. 29
      date: '1963-11-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 69-CT/TW for Dec. 20, the National Liberation Front''s third anniversary: a week of labor and production in support of the South, Dec. 15–22, opened by a mass rally in Ba Đình Square, Hanoi; rallies in Haiphong, Nam Định, Vinh and the towns.'
      n: '*Chỉ thị của Ban Bí thư số 69-CT/TW về việc tổ chức một tuần lễ ủng hộ mạnh mẽ cuộc đấu tranh của đồng bào miền Nam vào dịp 20 tháng 12 năm nay*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 650–54 (the week, 652). Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1963-12-13.vietnam-hanoi
      when: Dec. 13
      date: '1963-12-13'
      thread: vietnam-hanoi
      c: 'The Politburo sets up a steering committee to prepare the National Assembly''s election, under the Politburo''s direct guidance: thirteen members, among them Trường Chinh, Phạm Văn Đồng and Ưng Văn Khiêm, Hoàng Văn Hoan its head.'
      n: '*Nghị quyết của Bộ Chính trị số 87-NQ/TW về việc thành lập Ban chỉ đạo chuẩn bị việc bầu cử đại biểu Quốc hội*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 655–56. Made public: 2003. Names: Trường Chinh, Phạm Văn Đồng, Ưng Văn Khiêm, Hoàng Văn Hoan.'
      tags: [name:truong-chinh, name:pham-van-dong, name:ung-van-khiem, polity:drv]
- add:
    entry:
      id: cal.1963-12-16.vietnam-hanoi
      when: Dec. 16
      date: '1963-12-16'
      thread: vietnam-hanoi
      c: 'The Politburo re-forms the Council on the Enemy Situation, first set up in October 1957, to pool the services'' secret information, agree on an estimate before it goes to the Central Committee, and coordinate strategic intelligence: Võ Nguyên Giáp, Văn Tiến Dũng, Trần Quốc Hoàn, Nguyễn Văn Vịnh, Xuân Thủy and Nguyễn Khang; Lê Trọng Nghĩa its secretary.'
      n: '*Nghị quyết của Bộ Chính trị số 88-NQ/TW về việc thành lập Hội đồng địch tình*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXIV, 667–68. Made public: 2003. Names: Võ Nguyên Giáp, Văn Tiến Dũng, Trần Quốc Hoàn, Nguyễn Văn Vịnh, Xuân Thủy, Nguyễn Khang, Lê Trọng Nghĩa.'
      tags: [name:vo-nguyen-giap, name:van-tien-dung, name:xuan-thuy, polity:drv]
- add:
    entry:
      id: cal.1963-12-30.vietnam-hanoi
      when: Dec. 30
      date: '1963-12-30'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 72-CT/TW on improved tools and the first mechanization of farming: improved implements, carts, pumps and small machines, for higher labor productivity.'
      n: '*Chỉ thị của Ban Bí thư số 72-CT/TW về việc đẩy mạnh phong trào cải tiến công cụ và bước đầu cơ khí hoá nông nghiệp*, signed for the Secretariat by Nguyễn Chí Thanh. [[w.van-kien-dang-toan]], XXIV, 678–90. Made public: 2003.'
      tags: [polity:drv]
# ---- 1963: the remaining documents of the volume
