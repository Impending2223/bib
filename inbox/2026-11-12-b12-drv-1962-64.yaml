    entry:
      id: cal.1963-04-22.vietnam-hanoi
      when: Apr. 22
      date: '1963-04-22'
      thread: vietnam-hanoi
      c: 'The Secretariat on the People''s Courts'' work for 1963, after the Supreme Court''s party group reports: the Party committees inattentive to the courts, the state still without enough laws or rules of trial.'
      n: '*Thông báo của Ban Bí thư số 47-TB/TW bàn về phương hướng, nhiệm vụ công tác năm 1963 của ngành Toà án nhân dân*, signed for the Secretariat by Minh Châu, deputy chief of the office. [[w.van-kien-dang-toan]], XXIV, 530–33. Made public: 2003.'
      tags: [polity:drv]
