      date: '1963-09-05'
      thread: vietnam-hanoi
      c: 'The Secretariat names the Party groups of the Committee for Cultural Relations with Foreign Countries, Phạm Hồng its secretary, and of the Union of Literature and Arts, among them Nguyễn Đình Thi, Hoài Thanh, Nông Quốc Chấn, Bảo Định Giang and Đỗ Nhuận.'
