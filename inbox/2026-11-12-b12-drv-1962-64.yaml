      when: Apr. 15
      date: '1963-04-15'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 75-NQ/TW on holding the congresses of the Party organizations of the interzones, provinces and cities.'
      n: '*Nghị quyết của Ban Bí thư số 75-NQ/TW về việc mở đại hội đại biểu các cấp khu, tỉnh, thành*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 492–505. Made public: 2003.'
      tags: [polity:drv]
