      date: '1963-04-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 62-CT/TW on improving the Party schools for junior and base cadres: over 15,000 junior and nearly 55,000 base cadres trained.'
      n: '*Chỉ thị của Ban Bí thư số 62-CT/TW về việc cải tiến công tác trường Đảng bồi dưỡng cán bộ sơ cấp và cơ sở*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIV, 484–91. Made public: 2003.'
      tags: [polity:drv]
