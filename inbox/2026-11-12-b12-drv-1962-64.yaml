      when: May 5
      date: '1962-05-05'
      thread: vietnam-hanoi
      c: 'COSVN''s conference on carrying out the Central Committee''s resolution (of February) on the immediate work of the revolution in the South, Apr. 20–May 5, ends; its minutes stand as a resolution. Since 1960 the movement has risen strongly; at the end of 1961 the Americans began armed aggression on a graver scale.'
      n: '*Biên bản hội nghị Anh Trọng tháng 4 năm 1962 nghiên cứu và đặt kế hoạch thực hiện nghị quyết Anh Tư về công tác trước mắt của cách mạng miền Nam*; *Nghị quyết Hội nghị Trung ương Cục miền Nam, tháng 5 năm 1962, về nhiệm vụ quân sự*. [[w.van-kien-dang-toan]], XXIII, 851–906 (appendix; "Anh Trọng" COSVN and "Anh Tư" the Central Committee, the editors'' notes, 851); 907–15 (the military resolution: the Americans'' command in Saigon, more advisers, units in combat; the Staley–Taylor plan). See [[cal.1962-02-26.vietnam-hanoi]]. Made public: 2002. Check: whether the military resolution of May is this conference''s.'
      tags: [polity:drv, polity:us]
