    entry:
      id: cal.1963-07-08.vietnam-hanoi-2
      when: July 8
      date: '1963-07-08'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 65-CT/TW on studying and spreading the eighth plenum''s resolution, which affirmed the Party''s line on building socialism in the North and on industrialization.'
      n: '*Chỉ thị của Ban Bí thư số 65-CT/TW về việc tổ chức nghiên cứu học tập và tuyên truyền Nghị quyết của Hội nghị Trung ương lần thứ tám*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIV, 580–83. See [[cal.1963-03-26.vietnam-hanoi]]. Made public: 2003.'
      tags: [polity:drv]
