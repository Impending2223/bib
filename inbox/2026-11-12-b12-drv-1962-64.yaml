      date: '1963-02-11'
      thread: vietnam-hanoi
      c: 'The Secretariat on the work of the Central Committee''s Agriculture Department in 1963: in 1962 it settled the highland cooperatives'' course, piloted the campaign to improve the cooperatives'' management, and the policies on livestock and land reclamation.'
      n: '*Thông báo của Ban Bí thư số 46-TB/TW, ngày 27 tháng 2 năm 1963, về cuộc họp Ban Bí thư ngày 11-2-1963 bàn về công tác của Ban Nông nghiệp Trung ương trong năm 1963*. [[w.van-kien-dang-toan]], XXIV, 170–73. Made public: 2003.'
      tags: [polity:drv]
