- cite:
    id: cal.1964-03-27.vietnam
    item: '[[w.van-kien-dang-toan]], XXV, 90–108 (Hồ Chí Minh''s report, Mar. 27–28: the Front''s demands, the American troops and arms out of the South; reunification step by step, by peaceful means, the two zones to consult; not the delegates or the air defense)'
