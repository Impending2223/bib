      date: '1963-06-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 120-TT/TW on pilot campaigns to improve the handicraft, fishing and salt cooperatives, some begun without study or close direction.'
      n: '*Thông tri của Ban Bí thư số 120-TT/TW về việc thí điểm cải tiến hợp tác xã thủ công nghiệp, hợp tác xã nghề cá, hợp tác xã nghề muối*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIV, 557–59. Made public: 2003.'
      tags: [polity:drv]
