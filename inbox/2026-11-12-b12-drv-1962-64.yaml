    set:
      n: '[[w.asselin-hanois-road-to-the]], 134–36; [[w.van-kien-dang-toan]], XXIII, 705–26 (Thư của đồng chí Lê Duẩn gửi Trung ương Cục miền Nam, Về cách mạng miền Nam: to push the revolution in the South "đi quá mức độ cần thiết" (beyond the necessary degree) would bring no victory, 710; Laos''s victory shows the Americans can be made to retreat step by step; the South''s demand to overthrow the puppet government and build "một chính quyền độc lập và trung lập" (an independent and neutral government), the right measure, a good tactic, 711–12; not the imperialists'' other reactions). Made public: the Party''s collected documents, *Văn kiện Đảng toàn tập*, vol. 23 (2002), 705–25, by Asselin''s notes (125 n.45, 134 n.122). Names: Lê Duẩn.'
