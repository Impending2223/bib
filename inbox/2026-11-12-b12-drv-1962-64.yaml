patch: 2026-11-12-b12-drv-1962-64
by: 'Claude (batch 12, share b12-vkd-b: the DRV, Văn kiện Đảng toàn tập, vols. XXIII–XXV, 1962–64), Nov. 12, 2026'
ops:
# ---------------------------------------------------------------- 1964: Văn kiện Đảng toàn tập, vol. 25 (2002)
- add:
    entry:
      id: cal.1964-01-08.vietnam-hanoi
      when: Jan. 8
      date: '1964-01-08'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 133-TT/TW on receiving overseas Vietnamese: nearly 45,000 brought home in four years from Thailand, New Caledonia, the New Hebrides and South America; those of New Caledonia and the New Hebrides all by March, over 30,000 still to come from Thailand. Most to be settled half in trade, half on the land, in the midlands and on the coast; the Interior Ministry''s party group in charge.'
      n: '*Thông tri của Ban Bí thư số 133-TT/TW về tổ chức chu đáo việc đón tiếp kiều bào về nước*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 1–6. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-01-09.vietnam-hanoi
      when: Jan. 9
      date: '1964-01-09'
      thread: vietnam-hanoi
      c: 'The Politburo merges the Party organizations of the Air Defense and the Air Force into one, the Air Defense–Air Force, under the Central Military Party Committee, Đặng Tính secretary of its provisional committee; and those of the Right Bank and Left Bank Military Regions into Military Region III.'
      n: '*Nghị quyết của Bộ Chính trị số 90-NQ/TW về việc hợp nhất Đảng bộ Phòng không và Đảng bộ Không quân thành Đảng bộ Phòng không - Không quân* and *Quyết định của Bộ Chính trị số 91-NQ/TW về việc hợp nhất Đảng bộ Quân khu hữu ngạn và Đảng bộ Quân khu tả ngạn thành Đảng bộ Quân khu III* (the titles the editors''), each signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 7–10. Made public: 2003. Names: Đặng Tính.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-02-01.vietnam-hanoi
      when: Feb. 1
      date: '1964-02-01'
      thread: vietnam-hanoi
      c: 'The Politburo''s notice no. 50-TB/TW on Nguyễn Khánh''s coup of Jan. 30: a new American plot; Washington "thay ngựa" (changes horses) a second time, to save the situation and intervene deeper. The North to build socialism, back the South in every way and stand ready against any plot on the North.'
      n: '*Thông báo của Bộ Chính trị số 50-TB/TW về cuộc đảo chính mới ở miền Nam Việt Nam*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 50–51. See [[cal.1964-01-30.vietnam]]. Made public: 2003. Names: Nguyễn Khánh.'
      tags: [name:nguyen-khanh, polity:drv, polity:us]
- add:
    entry:
      id: cal.1964-03-05.vietnam-hanoi
      when: Mar. 5
      date: '1964-03-05'
      thread: vietnam-hanoi
      c: 'The Politburo''s instruction no. 76-CT/TW on the election of the third National Assembly, set for Sunday, Apr. 26: an Assembly of the whole people''s unity, on the worker-peasant alliance; the Party with the Fatherland Front to draw up the list of candidates, the masses to discuss it, the Front to fix it.'
      n: '*Chỉ thị của Bộ Chính trị số 76-CT/TW về việc lãnh đạo bầu cử đại biểu Quốc hội khoá III*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXV, 73–79. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-03-14.vietnam-hanoi
      when: Mar. 14
      date: '1964-03-14'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 138-TT/TW for Mar. 19, Saigon-Cholon''s day against the Americans: McNamara back in Saigon to press the war in the South and provocations against the North; rallies in Hanoi, the towns and the industrial zones, their resolutions sent to the National Liberation Front; the slogans, among them "Đế quốc Mỹ cút khỏi miền Nam Việt Nam!" (American imperialists, out of South Vietnam!).'
      n: '*Thông tri của Ban Bí thư số 138-TT/TW về tổ chức kỷ niệm ngày chống Mỹ 19-3*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 87–89. Made public: 2003. Names: McNamara.'
      tags: [name:mcnamara-robert-s, polity:drv, polity:us]
- add:
    entry:
      id: cal.1964-03.vietnam-hanoi
      when: Mar.
      date: '1964-03'
      thread: vietnam-hanoi
      c: 'COSVN''s second conference, its resolution no. 2/NQ: nearly a third of the strategic hamlets razed, most of the rest shaken; in 1964 the enemy''s drives to regroup the people to be broken, most hamlets in the contested zones razed and turned into combat villages; the army to make the hamlets one of its chief tasks.'
      n: '*Nghị quyết hội nghị Trung ương Cục lần thứ hai số 2/NQ, tháng 3 năm 1964*. [[w.van-kien-dang-toan]], XXV, 701–79 (appendix; the hamlets, 728–30). Made public: 2003. Check: the day; the volume gives the month.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-07-10.vietnam-hanoi
      when: July 10
      date: '1964-07-10'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 80-CT/TW for July 20, ten years after Geneva: a week of struggle, July 14–20, larger than in past years, a great rally in Hanoi; the government to issue a statement and send notes to the two co-chairmen and the members of the 1954 conference, on their responsibility for the agreements; the Fatherland Front and the mass organizations to answer it and write to the National Liberation Front.'
      n: '*Chỉ thị của Ban Bí thư số 80-CT/TW về đợt đấu tranh 20-7-1964*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 160–67 (the week, 163–64). Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-07-23.vietnam-hanoi
      when: July 23
      date: '1964-07-23'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 103-NQ/TW on organization work for 1964 and early 1965: the leadership and execution of the Party and the state improved, above all at the center and at the base; the government''s ministries and committees and the Central Committee''s departments sorted out, their cadres concentrated; defense, security, foreign affairs and ideological work under closer control.'
      n: '*Nghị quyết của Ban Bí thư số 103-NQ/TW về phương hướng nhiệm vụ công tác tổ chức năm 1964 và thời gian tới*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 168–83 (the tasks, 176–78). Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-08-07.vietnam-hanoi-2
      when: Aug. 7
      date: '1964-08-07'
      thread: vietnam-hanoi
      also: [vietnam-tonkin]
      c: 'Hồ Chí Minh, for the Party and the government, at a ceremony honoring the air-defense and naval units: eight American planes shot down and three damaged, an American pilot taken alive, American warships driven from the North''s waters; four more planes reported damaged at Biên Hòa. No complacency; if the Americans and their puppets violate the North, the whole people will defeat them.'
      n: '*Bài nói của Chủ tịch Hồ Chí Minh tại buổi lễ tuyên dương các đơn vị phòng không và hải quân*. [[w.van-kien-dang-toan]], XXV, 201–02 (given Aug. 7, the editors'' note, 201; from his *Toàn tập*, vol. 11 (2000), 303–04). See [[cal.1964-08-04.vietnam]]. Names: Hồ Chí Minh.'
      tags: [name:ho-chi-minh, polity:drv, polity:us]
- add:
    entry:
      id: cal.1964-08-21.vietnam-hanoi
      when: Aug. 21
      date: '1964-08-21'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 83-CT/TW on the roads the Politburo has decided to build and improve in the west and the north of Tonkin, for national defense and the highlands'' economy: the time very short; the government''s standing committee has given each ministry and province its task, the Transport Ministry''s party group to settle the details.'
      n: '*Chỉ thị của Ban Bí thư số 83-CT/TW về việc lãnh đạo và chỉ đạo việc làm mới và cải thiện một số tuyến đường thuộc miền Tây và miền Bắc Bắc Bộ*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 209–12. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-09-17.vietnam-hanoi
      when: Sept. 17
      date: '1964-09-17'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 105-NQ/TW on local industry: to serve the provinces'' production and technical revolution, farming above all, and to make cheap consumer goods; a province, of about a million people, to have some industry of its own.'
      n: '*Nghị quyết của Bộ Chính trị số 105-NQ/TW về tình hình, nhiệm vụ, phương hướng, chính sách phát triển công nghiệp địa phương*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXV, 230–65 (the tasks, 239–40). Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-10-07.vietnam-hanoi
      when: Oct. 7
      date: '1964-10-07'
      thread: vietnam-hanoi
      also: [china]
      c: 'The Secretariat''s instruction no. 86-CT/TW on the Sino-Vietnamese agreement on joint protection of the border region''s security, signed by the two countries'' public security ministries and general staffs, approved by both Central Committees, in force from October: the armed forces and police of both sides to act together within 20 km of the border; local protocols at odds with it void; the Central Military Party Committee to direct it, the General Staff with Public Security.'
      n: '*Chỉ thị của Ban Bí thư số 86-CT/TW về việc thực hiện Hiệp nghị về vấn đề hiệp đồng bảo vệ an ninh khu vực biên giới Việt - Trung*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 270–72. Made public: 2003.'
      tags: [polity:drv, polity:prc]
- add:
    entry:
      id: cal.1964-10-26.vietnam-hanoi
      when: Oct. 26
      date: '1964-10-26'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 152-TT/TW on the International Conference in Support of the Vietnamese People against American Imperialist Aggression, called by the Vietnam Peace Committee and the Fatherland Front, to open in Hanoi Nov. 25: Hoàng Quốc Việt and three others to direct its preparation; a propaganda drive once it is announced.'
      n: '*Thông tri của Ban Bí thư số 152-TT/TW về Hội nghị quốc tế ủng hộ nhân dân Việt Nam chống đế quốc Mỹ xâm lược*, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXV, 273–75. Made public: 2003. Names: Hoàng Quốc Việt.'
      tags: [polity:drv, polity:us]
- add:
    entry:
      id: cal.1964-12.vietnam-hanoi-2
      when: Dec.
      date: '1964-12'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh, for the Central Committee and the government, at a reception for the army''s twentieth anniversary, General Kim Chang-bong''s North Korean military delegation present: the army has dealt the Americans blows, as on Aug. 5; all to stand ready and work like two. "Thắng lợi nhất định sẽ về ta" (Victory will surely be ours).'
      n: '*Bài nói của Chủ tịch Hồ Chí Minh trong buổi chiêu đãi mừng Quân đội ta 20 tuổi*. [[w.van-kien-dang-toan]], XXV, 288–89 (from his *Toàn tập*, vol. 11 (2000), 349–50). Check: the day; the volume gives none. Names: Hồ Chí Minh, Kim Chang-bong.'
      tags: [name:ho-chi-minh, polity:drv, polity:dprk, polity:us]
- add:
    entry:
      id: cal.1964-12-26.vietnam-hanoi-2
      when: Dec. 26
      date: '1964-12-26'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 107-NQ/TW names the commissions to prepare the Fourth Party Congress: the political report under Lê Duẩn, with Trường Chinh, Phạm Văn Đồng and Nguyễn Duy Trinh; Party building, and the Central Committee''s personnel, under Lê Đức Thọ; the second five-year plan under Nguyễn Duy Trinh; credentials under Nguyễn Lương Bằng; the arrangements under Hoàng Quốc Việt.'
      n: '*Nghị quyết của Bộ Chính trị số 107-NQ/TW về việc cử các đồng chí tham gia các Ban giúp Trung ương chuẩn bị Đại hội Đảng toàn quốc lần thứ IV*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 290–92. Made public: 2003. Names: Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Nguyễn Duy Trinh, Lê Đức Thọ, Nguyễn Lương Bằng, Hoàng Quốc Việt.'
      tags: [name:le-duan, name:truong-chinh, name:pham-van-dong, name:le-duc-tho, polity:drv]
# ---- 1964: the remaining documents of the volume
- add:
    entry:
      id: cal.1964-03-06.vietnam-hanoi
      when: Mar. 6
      date: '1964-03-06'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 137-TT/TW on propaganda and education for the election of the third National Assembly, Apr. 26: a chance to teach the people the merits of the state of people''s democratic dictatorship and the citizen''s duties and rights, and to press the building of the North and the support of the South.'
      n: '*Thông tri của Ban Bí thư số 137-TT/TW về việc tuyên truyền giáo dục nhân cuộc bầu cử đại biểu Quốc hội khoá III*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 80–86. See [[cal.1964-03-05.vietnam-hanoi]]. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-04-04.vietnam-hanoi
      when: Apr. 4
      date: '1964-04-04'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 140-TT/TW on summing up the study of the Ninth Plenum''s resolution on international problems and checking the work done: the senior and middle cadres around the Center have finished it, most city and provincial committees have held their enlarged meetings, the junior cadres now studying.'
      n: '*Thông tri của Ban Bí thư số 140-TT/TW về việc tổng kết học tập và kiểm tra công tác trong kỳ nghiên cứu Nghị quyết Trung ương lần thứ chín*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 112–15. See [[cal.1964-01-27.vietnam-hanoi]]. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-05-08.vietnam-hanoi
      when: May 8
      date: '1964-05-08'
      thread: vietnam-hanoi
      c: 'The Secretariat allows the Central Committee''s Board for Research on Party History an office and research departments, under the Politburo''s resolution no. 41 of Jan. 24, 1962.'
      n: '*Nghị quyết của Ban Bí thư số 969-NQNS/TW về việc tổ chức bộ máy giúp việc của Ban Nghiên cứu Lịch sử Đảng Trung ương*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 133–34. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-05-13.vietnam-hanoi
      when: May 13
      date: '1964-05-13'
      thread: vietnam-hanoi
      c: 'The Secretariat puts the Party organizations of the central government, mass and Party offices back under the Central Committee, from the Hanoi city committee, for closer control by the Center.'
      n: '*Nghị quyết của Ban Bí thư số 99-NQ/TW về việc đưa đảng bộ các cơ quan chính, dân, đảng trung ương trở về trực thuộc Ban Chấp hành Trung ương*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 135–36. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-05-15.vietnam-hanoi
      when: May 15
      date: '1964-05-15'
      thread: vietnam-hanoi
      c: 'The Politburo revises the Party dues of members working and studying abroad: under resolution no. 61-NQ/TW of Nov. 29, 1962 those with more income paid less than those with less.'
      n: '*Nghị quyết của Bộ Chính trị số 100-NQ/TW về việc sửa đổi mức đóng đảng phí của các đảng viên làm công tác và học tập ở nước ngoài*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 137–38. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-05-25.vietnam-hanoi
      when: May 25
      date: '1964-05-25'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 141-TT/TW on organizing and leading the Party members and people of the lowlands who go to reclaim land in the highlands, under the Politburo''s campaign for the lowlanders to help develop the highlands'' economy.'
      n: '*Thông tri của Ban Bí thư số 141-TT/TW về một số vấn đề tổ chức và lãnh đạo đối với đảng viên, quần chúng miền xuôi đi khai hoang ở miền núi*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 139–48. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-06-03.vietnam-hanoi
      when: June 3
      date: '1964-06-03'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 79-CT/TW on protecting the cadres'' health: cadres the Party''s and the state''s most precious capital; the health of the long-serving ones in general poor.'
      n: '*Chỉ thị của Ban Bí thư số 79-CT/TW về công tác bảo vệ sức khoẻ của cán bộ*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 149–53. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-06-23.vietnam-hanoi
      when: June 23
      date: '1964-06-23'
      thread: vietnam-hanoi
      c: 'The Secretariat forms the Party group in the third National Assembly: Trường Chinh its secretary, with Hoàng Văn Hoan, Nguyễn Duy Trinh, Hoàng Quốc Việt, Phạm Văn Bạch, Chu Văn Tấn, Nguyễn Văn Hưởng and Tôn Quang Phiệt.'
      n: '*Nghị quyết của Ban Bí thư số 983-NQNS/TW về việc thành lập Đảng đoàn Quốc hội*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXV, 154–55. Made public: 2003. Names: Trường Chinh, Hoàng Văn Hoan, Nguyễn Duy Trinh, Hoàng Quốc Việt, Phạm Văn Bạch, Chu Văn Tấn, Nguyễn Văn Hưởng, Tôn Quang Phiệt.'
      tags: [name:truong-chinh, polity:drv]
- add:
    entry:
      id: cal.1964-06-24.vietnam-hanoi
      when: June 24
      date: '1964-06-24'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 142-TT/TW on summing up economic work, after its circular of Apr. 3 on studying the second long-term plan: the economy''s course for ten or fifteen years, the second five-year plan, 1966–70, and the planning of the national economy.'
      n: '*Thông tri của Ban Bí thư số 142-TT/TW về việc tổ chức tổng kết công tác kinh tế*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXV, 156–59. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-09-03.vietnam-hanoi
      when: Sept. 3
      date: '1964-09-03'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 84-CT/TW on education in the highlands for the school years 1964–65 and 1965–66: over 100,000 freed from illiteracy in three years, 25,000 of them cadres, Party members and young activists; 80,000 to 150,000 a year in complementary classes.'
      n: '*Chỉ thị của Ban Bí thư số 84-CT/TW về nhiệm vụ công tác giáo dục ở miền núi trong hai năm học 1964 - 1965 và 1965 - 1966*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 213–22. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-09-25.vietnam-hanoi
      when: Sept. 25
      date: '1964-09-25'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 150-TT/TW on carrying out the Politburo''s resolution on local industry: the provinces and cities to study their own course and plans for it, the central ministries their parts.'
      n: '*Thông tri của Ban Bí thư số 150-TT/TW về việc thi hành Nghị quyết của Bộ Chính trị về nhiệm vụ và phương hướng phát triển công nghiệp địa phương*, signed for the Secretariat by Phạm Chung, acting chief of the office. [[w.van-kien-dang-toan]], XXV, 266–69. See [[cal.1964-09-17.vietnam-hanoi]]. Made public: 2003.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1964-11-26.vietnam-hanoi
      when: Nov. 26
      date: '1964-11-26'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 153-TT/TW on checking and summing up the first campaign to improve the cooperatives'' management: the fourth round over in the delta and midlands, thirteen provinces in the fifth, the first campaign to be done by the end of 1964; the second to be prepared.'
      n: '*Thông tri của Ban Bí thư số 153-TT/TW về việc kiểm tra, đánh giá, tổng kết cuộc vận động cải tiến quản lý hợp tác xã nông nghiệp lần thứ nhất*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXV, 276–84 (with the guiding outline, 279–84). Made public: 2003.'
      tags: [polity:drv]
# ---- 1964: entries already in the calendar, the volume read
- edit:
    id: cal.1964-01-17.vietnam-hanoi
