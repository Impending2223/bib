      when: Mar. 29
      date: '1963-03-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s instruction no. 61-CT/TW on improving the cadres'' in-service study of theory and politics, of their trades and techniques, and of general education.'
      n: '*Chỉ thị của Ban Bí thư số 61-CT/TW về cải tiến việc học tập tại chức về lý luận và chính trị, về nghiệp vụ và kỹ thuật và về văn hoá*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXIV, 195–203. Made public: 2003.'
      tags: [polity:drv]
