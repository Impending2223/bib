    set:
      n: '[[w.asselin-hanois-road-to-the]], 128; [[w.van-kien-dang-toan]], XXIII, 143–64 (Nghị quyết của Bộ Chính trị họp ngày 26–27 tháng 2 năm 1962, Về công tác cách mạng miền Nam; signed for the Politburo "Ba," Lê Duẩn by the editors'' note, 164: the Front''s slogans to include a policy of neutrality, 149; "vừa đánh, vừa đòi thành lập chính phủ liên hiệp thật sự, đòi tổng tuyển cử thật sự, đòi hoà bình trung lập" (fight while demanding a real coalition government, real general elections, peace and neutrality), steps of transition, 163; not Nguyễn Vũ Tùng). Made public: 2002. Thereafter, by Elliott, units not to resist sweeps, to preserve forces; a cable to COSVN on the political struggle''s worth in negotiations (Asselin, 128, nn.68–69). To check: Nguyễn Vũ Tùng, "The 1961–1962 Geneva Conference," in Goscha and Laplante, eds., *The Failure of Peace in Indochina* (2010), 259 (cited by [[w.asselin-hanois-road-to-the]], 128 n.65). Names: Lê Duẩn.'
      src:
