      when: Aug. 3
      date: '1968-08-03'
      thread: soviet-union-leadership
      also: *id001
      c: Bratislava. Biľak hands Shelest the "letter of invitation," in which eleven party leaders go behind Dubček's back and call on Moscow to come to the rescue of socialism in Czechoslovakia.
      n: '[[w.schattenberg-brezhnev]], 281 (n.141). To check: original of the letter in P. Pauer, *Prag 1968*, 196–97; Shelest, *Da ne sudimy budete*, 385 (cited by [[w.schattenberg-brezhnev]], 281 n.141). Made public: 2021 at the latest. Names: Biľak, Shelest, Dubček. Check: the day (the work: "on 3 August in Bratislava").'
