- add:
    entry:
      id: cal.1964-04-17.soviet-union-leadership
      when: Apr. 17
      date: '1964-04-17'
      thread: soviet-union-leadership
      c: Khrushchev's seventieth birthday. The party elite go to toast him in the Lenin Hills. Brezhnev soon urges the comrades to leave, though Khrushchev wants the celebration to go on.
      n: '[[w.schattenberg-brezhnev]], 168 (by Shelest''s account; Brezhnev''s reason, not to wear Khrushchev out). To check: P. E. Shelest, *Da ne sudimy budete* (1995), 194 (cited by [[w.schattenberg-brezhnev]], 168 n.434). Made public: 2021 at the latest. See [[cal.1964-04-17.soviet-union]]. Names: Khrushchev, Brezhnev, Shelest.'
      tags:
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - name:shelest-pyotr-y
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-09.soviet-union-leadership
      when: Sept., early
      date: 1964-09
      thread: soviet-union-leadership
      c: 'Podgorny''s dacha. The plotters discuss the procedure against Khrushchev; they do not know what to do. Shelest suggests beginning in Ukraine, inviting Khrushchev to a plenum of the Ukrainian party to confront him there and so force a plenum in Moscow. Brezhnev against: it must happen in Moscow.'
      n: '[[w.schattenberg-brezhnev]], 169. To check: RGASPI, f. 666, op. 1, d. 9, l. 21, Shelest''s working notes (cited by [[w.schattenberg-brezhnev]], 169 nn.439–40). Made public: 2021 at the latest. Names: Podgorny, Brezhnev, Shelest, Khrushchev. Check: the day ("In the early September").'
      tags:
      - name:podgorny-nikolai-v
      - name:brezhnev-leonid
      - name:shelest-pyotr-y
      - name:khrushchev-nikita-s
