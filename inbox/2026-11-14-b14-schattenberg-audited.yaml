- add:
    entry:
      id: cal.1968-08-13.soviet-union-leadership-2
      when: Aug. 13
      date: '1968-08-13'
      thread: soviet-union-leadership
      also: *id001
      c: 'Brezhnev''s eighty-minute telephone call to Dubček, evening, as to a friend ("Sasha"); Dubček keeps to "Comrade Brezhnev." Brezhnev: the cadre issues can be settled in the Presidium today, not at an extraordinary plenum; does Dubček stand personally behind the obligation of Čierna? Dubček: only a plenum can decide; he is considering giving up his post. Brezhnev: then the Presidium has no power, and the conversation was not to be taken seriously.'
      n: '[[w.schattenberg-brezhnev]], 279–80 (n.124–32). To check: telephone conversation of Brezhnev and Dubček, Aug. 13, 1968, in S. Karner et al. eds., *Prager Frühling* (2008), II, doc. 57, 329–43 (cited by [[w.schattenberg-brezhnev]], 279–80 nn.125, 127–32). Names: Brezhnev, Dubček.'
      tags:
      - name:brezhnev-leonid
      - name:dubcek-alexander
      - polity:czechoslovakia
      - polity:ussr
      - vis:only:ussr+czechoslovakia
- add:
    entry:
      id: cal.1960-02.soviet-union-leadership
      when: Feb.
      date: 1960-02
      thread: soviet-union-leadership
      also:
      - space
      c: Brezhnev, the Central Committee secretary for armament and rockets, visits a rocket design office and plant. Listens without interrupting; closes with a joke that they might launch a bigger "beetle" to make more noise, which offends them.
      n: '[[w.schattenberg-brezhnev]], 151–52 (Chertok''s account, 151 nn.276–278). To check: B. Chertok, *Raketen und Menschen*, 380 (cited by [[w.schattenberg-brezhnev]], 151 n.276 ff.). Made public: 2021 at the latest. Names: Brezhnev. Check: the day.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1960-05-07.soviet-union-leadership
      when: May 7
      date: '1960-05-07'
      thread: soviet-union-leadership
      c: The Supreme Soviet elects Brezhnev Chairman of its Presidium in Voroshilov's place, Voroshilov having been asked to request release on "health grounds." Brezhnev gives up his post as a Secretary of the Central Committee.
      n: '[[w.schattenberg-brezhnev]], 153 (n.291–94). To check: RGANI, f. 80, op. 1, d. 1200, l. 49; Fursenko, *Prezidium TsK KPSS*, I, 441, III, 127 (cited by [[w.schattenberg-brezhnev]], 153 nn.291, 293). See [[cal.1960-05-04.soviet-union]]. Names: Brezhnev, Voroshilov.'
      tags:
      - name:brezhnev-leonid
      - name:voroshilov-kliment-e
      - polity:ussr
- add:
    entry:
      id: cal.1960-10-24.soviet-union-leadership
      when: Oct. 24
      date: '1960-10-24'
      thread: soviet-union-leadership
      also:
      - space
      c: 'Baikonur. A rocket explodes on the pad: 126 dead, Nedelin, the commander, among them. Brezhnev heads the commission of inquiry and goes to the site at once; on his return he reports to Khrushchev an unforeseen accident, a tragic chain of events, and advises that no one be held responsible and rocket building go on.'
      n: '[[w.schattenberg-brezhnev]], 152 (nn.286–89). To check: B. Chertok, *Raketen und Menschen*, 380, 382; S. Khrushchev, *Geburt einer Supermacht*, 364–65 (cited by [[w.schattenberg-brezhnev]], 152 nn.286–89). Made public: 2021 at the latest. Made public: 2021 at the latest. Names: Nedelin, Brezhnev, Khrushchev. Check: the days of Brezhnev''s trip and report.'
      tags:
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1961-02-09.soviet-union-leadership
      when: Feb. 9
      date: '1961-02-09'
      thread: soviet-union-leadership
      also:
      - africa
      c: 'Brezhnev, off on his first foreign tour, to Africa for ten days. His plane comes under fire from French fighter jets before it reaches Algeria. France: warning shots, the plane off its course; the Soviet Union and Morocco suspect deliberate sabotage.'
      n: '[[w.schattenberg-brezhnev]], 159 (the incident; n.330), 153–54 (the departure by the Presidium''s custom; *Izvestiya*, Feb. 9, 1961, "Schastlivogo puti," 154 n.296). To check: GARF, f. R-7523, op. 78, d. 76 (press survey of the trip to Guinea, Ghana and Morocco), l. 3, 5, 10 (cited by [[w.schattenberg-brezhnev]], 159 n.330). Names: Brezhnev. Check: the work puts the tour "in the January" at 161 and "early 1961" at 159; "before it reached Algeria" for a tour begun in Morocco.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - polity:fr
      - polity:morocco
- add:
    entry:
      id: cal.1961-02.soviet-union-leadership
      when: Feb., after the 9th
      date: 1961-02
      thread: soviet-union-leadership
      also:
      - africa
      c: Morocco. Brezhnev, welcomed by *Pravda* as a "symbol of freedom," talks with the heir Hassan on Soviet successes; Morocco accepts Soviet aid and weapons. King Mohammed V promises to push for the closing of the American air base and to let arms pass to the Algerian rebels.
      n: '[[w.schattenberg-brezhnev]], 159 (nn.330–32). To check: GARF, f. R-7523, op. 78, d. 76, l. 9, 12; W. Murphy, *Brezhnev*, 168 (cited by [[w.schattenberg-brezhnev]], 159 nn.331–32). Names: Brezhnev, Hassan, Mohammed V. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - name:hassan-ii
      - polity:ussr
      - polity:morocco
- add:
    entry:
      id: cal.1961-02.soviet-union-leadership-2
      when: Feb., after the 9th
      date: 1961-02
      thread: soviet-union-leadership
      also:
      - africa
      - congo
      c: 'Guinea. Brezhnev speaks to 20,000 in Conakry and tours the country five days, in Labé and Kankan: no distinction by skin colour; the Soviet Union on the side of the oppressed. Sékou Touré awards him a medal as a "Fighter for Independence." A five-year trade agreement. A joint communiqué condemns Lumumba''s murder as the colonial powers'' treachery, calls for the withdrawal of Belgian troops and an end to the Algerian war.'
      n: '[[w.schattenberg-brezhnev]], 159–60 (nn.333–38). To check: GARF, f. R-7523, op. 78, d. 76, l. 15, 17 f., 21; d. 77, l. 3, 10 f., 14 f. (cited by [[w.schattenberg-brezhnev]], 159–60 nn.333–35). Names: Brezhnev, Sékou Touré, Lumumba. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - name:lumumba-patrice
      - polity:ussr
      - polity:guinea
      - name:toure-ahmed-sekou
- add:
    entry:
      id: cal.1961-02.soviet-union-leadership-3
      when: Feb., after the 9th
      date: 1961-02
      thread: soviet-union-leadership
      also:
      - africa
      c: Ghana. Brezhnev meets Nkrumah, who proves the most open to the Soviet overtures and accepts a return invitation for the summer of 1961. Brezhnev promises 80 million dollars in loans and technological and military help.
      n: '[[w.schattenberg-brezhnev]], 160 (nn.340–42). To check: GARF, f. R-7523, op. 78, d. 76; d. 77 (cited by [[w.schattenberg-brezhnev]], 160 nn.340–42). Names: Brezhnev, Nkrumah. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - name:nkrumah-kwame
      - polity:ussr
      - polity:ghana
- add:
    entry:
      id: cal.1961-04.soviet-union-leadership
      when: Apr.
      date: 1961-04
      thread: soviet-union-leadership
      c: Brezhnev summons the secretaries of the republics' Supreme Soviets to Moscow to discuss law-making and the publication of laws in the republics' languages, and the work on petitions, foreign delegations, citizenship and honours.
      n: '[[w.schattenberg-brezhnev]], 154 (n.301). To check: GARF, f. R-7523, op. 78, d. 136, l. 169 (stenogram of the conference of the secretaries) (cited by [[w.schattenberg-brezhnev]], 154 n.300). Names: Brezhnev. Check: the day.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1961-06-16.soviet-union-leadership
      when: June 16
      date: '1961-06-16'
      thread: soviet-union-leadership
      also:
      - space
      c: Khrushchev, Brezhnev and Keldysh, president of the Academy of Sciences, honoured as Heroes of Socialist Labour for the successful spaceflight; the photograph shows Khrushchev and Brezhnev close, grinning, Keldysh between.
      n: '[[w.schattenberg-brezhnev]], 156 (nn.308–09). To check: Fursenko, *Prezidium TsK KPSS*, III, 509; GARF, f. R-7523, op. 78, d. 37b, l. 66 (cited by [[w.schattenberg-brezhnev]], 156 nn.308–09). Names: Khrushchev, Brezhnev, Keldysh.'
      tags:
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      - name:keldysh-mstislav-v
      - polity:ussr
- add:
    entry:
      id: cal.1961-09-23.soviet-union-leadership
      when: Sept. 23–30
      date: '1961-09-23'
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance
      c: 'Finland. Brezhnev''s eight-day visit, Kekkonen his host: the Finns want the Soviet Union to build a nuclear power station. At Kajaani, with Kekkonen, a tie shop; to Kekkonen''s offer of a tie he answers "Just one?".'
      n: '[[w.schattenberg-brezhnev]], 160–61 (nn.344–50). To check: S. Autio-Sarasmo, in J. Smith and M. Ilic eds., *Khrushchev in the Kremlin* (2011), 141–42; the Finnish press, *Maakansa*, Sept. 29, 1961 (cited by [[w.schattenberg-brezhnev]], 160 nn.344–48). Names: Brezhnev, Kekkonen. Check: the days (the work: eight days; Sept. 29 the seventh).'
      tags:
      - name:brezhnev-leonid
      - name:kekkonen-urho
      - polity:ussr
      - polity:finland
- add:
    entry:
      id: cal.1961-11.soviet-union-leadership
      when: Nov.
      date: 1961-11
      thread: soviet-union-leadership
      also:
      - africa
      c: Sudan. Brezhnev negotiates Soviet aid, a factory to preserve fish, fruit and vegetables; just before, the Sudanese press had reported an American aid package, grain and flour worth 4.6 million dollars and radio stations. West Germany opens a consumer goods fair in Khartoum.
      n: '[[w.schattenberg-brezhnev]], 161 (nn.351–54). To check: GARF, f. R-7523, op. 78, d. 88 (press survey), l. 16 (cited by [[w.schattenberg-brezhnev]], 161 n.351). Names: Brezhnev. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - polity:sudan
- add:
    entry:
      id: cal.1961-12.soviet-union-leadership
      when: Dec.
      date: 1961-12
      thread: soviet-union-leadership
      also:
      - south-asia
      c: 'India. Brezhnev, with his wife, fourteen days from Bombay by Calcutta to Madras: speeches, flowers, Soviet-financed building sites. Soviet aid of some 720 million rubles, free of conditions.'
      n: '[[w.schattenberg-brezhnev]], 161 (nn.355–57). To check: GARF, f. R-7523, op. 78, d. 91 (press survey), l. 3 (cited by [[w.schattenberg-brezhnev]], 161 n.355). Names: Brezhnev. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - polity:india
- add:
    entry:
      id: cal.1961-12-11.soviet-union-leadership
      when: Dec. 11
      date: '1961-12-11'
      thread: soviet-union-leadership
      c: 'Brezhnev''s report to the party meeting of the apparatus of the Presidium of the Supreme Soviet, after the Twenty-second Congress: the cult of personality severely harmed the economy and the country''s political and intellectual life; Stalin violated Lenin''s principles and abused power; mass repressions of party, state and military cadres. The era overcome; the Supreme Soviet to prepare a new constitution.'
      n: '[[w.schattenberg-brezhnev]], 157 (nn.311–13). To check: GARF, f. R-7523, op. 78, d. 107, l. 14, 23, 27 (cited by [[w.schattenberg-brezhnev]], 157 nn.312–13). Made public: 2021 at the latest. Names: Brezhnev, Stalin.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1962-09.soviet-union-leadership
      when: Sept.
      date: 1962-09
      thread: soviet-union-leadership
      c: Yugoslavia. Brezhnev visits Tito; they stand together in an open car to the ovations of Belgrade, and hunt together.
      n: '[[w.schattenberg-brezhnev]], 162 (n.367). To check: GARF, f. R-7523, op. 78, d. 127, l. 12 f. (cited by [[w.schattenberg-brezhnev]], 162 n.367). Names: Brezhnev, Tito. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - name:tito-josip-broz
      - polity:ussr
      - polity:yugoslavia
- add:
    entry:
      id: cal.1963-06.soviet-union-leadership
      when: June
      date: 1963-06
      thread: soviet-union-leadership
      c: 'After Kozlov''s illness in April, Khrushchev redistributes power in the Presidium: Podgorny recalled from Ukraine to be a Secretary of the Central Committee with Brezhnev, who is to give up the chairmanship of the Presidium of the Supreme Soviet. Brezhnev again over armament and spaceflight. Mzhavanadze, also meant for Moscow, resists. Explained as strengthening the economic cadres.'
      n: '[[w.schattenberg-brezhnev]], 163 (nn.378–82). To check: Fursenko, *Prezidium TsK KPSS*, I, 719, 820, 860; RGANI, f. 80, op. 1, d. 1200, l. 57 (cited by [[w.schattenberg-brezhnev]], 163 nn.378–82). Names: Kozlov, Khrushchev, Podgorny, Brezhnev, Mzhavanadze. Check: the day of the reshuffle (the work: "June 1963").'
      tags:
      - name:kozlov-frol-r
      - name:khrushchev-nikita-s
      - name:podgorny-nikolai-v
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1963-10.soviet-union-leadership
      when: Oct.
      date: 1963-10
      thread: soviet-union-leadership
      c: 'Afghanistan. Brezhnev''s five-day visit: hunting with the king; a speech to the students of Kabul University on his hard but happy student years; the Soviet Union "a bastion of peace," Tereshkova an example to Afghan women.'
      n: '[[w.schattenberg-brezhnev]], 161 (nn.359–61). To check: GARF, f. R-7523, op. 83, d. 17 (press survey), l. 24, 34; d. 19, l. 3, 28–32 (cited by [[w.schattenberg-brezhnev]], 161 nn.359–61). Names: Brezhnev, Tereshkova. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1963-11-16.soviet-union-leadership
      when: Nov. 16–23
      date: '1963-11-16'
      thread: soviet-union-leadership
      c: Iran. Brezhnev's visit, with his wife. In his speech to the parliament the Soviet Union makes more cement, machine tools and electric motors than the United States and will in seven years produce twice as much; the plan to turn Siberian rivers south to the Caspian would benefit Iran too. Isfahan and Shiraz; the Hermitage not comparable to what he sees.
      n: '[[w.schattenberg-brezhnev]], 161–62 (nn.362–66). To check: GARF, f. R-7523, op. 83, d. 20, l. 11 f., 21 f., 38 f., 52 f., 55 (Nov. 16–23, 1963) (cited by [[w.schattenberg-brezhnev]], 162 nn.362–66). Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - polity:iran
- add:
    entry:
      id: cal.1963-12-10.soviet-union-leadership
      when: Dec. 10–15
      date: '1963-12-10'
      thread: soviet-union-leadership
      c: 'Czechoslovakia. Brezhnev''s five-day visit for twenty years of Soviet–Czechoslovak friendship: the reception at Prague Castle, wreaths, the festive session of the Central Committee, factories, Bratislava, where he speaks of the war.'
      n: '[[w.schattenberg-brezhnev]], 162 (nn.368–69). To check: GARF, f. R-7523, op. 83, d. 21 (press survey), l. 1–3, 18 (Dec. 10–15, 1963) (cited by [[w.schattenberg-brezhnev]], 162 nn.368–69). See [[cal.1963-12-04.cuba]]. Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - polity:czechoslovakia
- add:
    entry:
      id: cal.1964-02-10.soviet-union-leadership
      when: Feb. 10–15
      date: '1964-02-10'
      thread: soviet-union-leadership
      c: 'The plenum of the Central Committee. Khrushchev''s digressions fill eighty-six pages of the verbatim record, which he is given to "sanitize." On scientists: they must show initiative or it will be said the Council of Ministers insults the scholars. On the Krasnodar secretaries'' promise of thirty hundredweight a hectare: "I think they have swindled."'
      n: '[[w.schattenberg-brezhnev]], 165 (nn.397–401). To check: RGANI, f. 2, op. 1, d. 742 (the retorts taken from the stenogram of the plenum, Feb. 10–15, 1964), l. 4, 7, 13, 72–73 (cited by [[w.schattenberg-brezhnev]], 165 nn.397–401). Made public: 2021 at the latest. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1964-05-11.soviet-union-leadership
      when: May 11
      date: '1964-05-11'
      thread: soviet-union-leadership
      c: 'Luzhniki. Brezhnev presents the Order of Lenin to the Moscow Chief Building Authority in the sports palace: Stalin''s cult ruined construction; thanks to Khrushchev half the Soviet people have moved into new housing since 1954. He ends with lines of Mayakovsky.'
      n: '[[w.schattenberg-brezhnev]], 156 (n.310). To check: RGANI, f. 80, op. 1, d. 55, l. 2–4, 10 (speech, May 11, 1964) (cited by [[w.schattenberg-brezhnev]], 156 n.310). Names: Brezhnev, Khrushchev, Stalin.'
      tags:
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1965-03-24.soviet-union-leadership
      when: Mar. 24–26
      date: '1965-03-24'
      thread: soviet-union-leadership
      c: The plenum of the Central Committee on agriculture. Brezhnev, without naming Khrushchev, attacks the "great shortcomings and mistakes" in the management of agriculture. Farms to be paid enough to cover costs and pay wages; decisions on profitability, not "subjectivism"; more tractors and repair shops, the harvest in twenty days. No more charlatans, campaigns or coercion. Prices of consumer goods in the country to match the cities'. In closing, Mar. 26, he warns that the line on aligning farmers' and workers' living standards must be explained with care.
      n: '[[w.schattenberg-brezhnev]], 211–12 (the speech, nn.68–74), 212 (the closing words, n.75). To check: RGANI, f. 2, op. 1, d. 780 (stenogram of the first and second sessions, Mar. 24, 1965), l. 6–54; d. 782 (fifth session), l. 75 f.; d. 785 (fifth session, Mar. 26, 1965), l. 110 (cited by [[w.schattenberg-brezhnev]], 211–12 nn.68–75, 175 n.29). Names: Brezhnev, Khrushchev.'
      tags:
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1961-02.soviet-union-leadership-4
      when: Feb., end
      date: 1961-02
      thread: soviet-union-leadership
      also:
      - africa
      c: Morocco. Brezhnev ends his African tour with a second visit to King Mohammed V.
      n: '[[w.schattenberg-brezhnev]], 160 (n.343). Names: Brezhnev, Mohammed V. Check: the day.'
      tags:
