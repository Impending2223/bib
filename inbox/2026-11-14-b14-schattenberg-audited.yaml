      also: *id001
      c: The Politburo resolves on a letter from the Central Committee to Dubček.
      n: '[[w.schattenberg-brezhnev]], 275 (n.65). To check: Politburo resolution, July 6, 1968, in Tomilina ed., *Chekhoslovatskiy krizis* (2010), 117–18 (cited by [[w.schattenberg-brezhnev]], 275 n.65). Made public: 2021 at the latest. Names: Dubček.'
