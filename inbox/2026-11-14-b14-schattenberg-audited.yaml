      when: Apr. 15
      date: '1968-04-15'
      thread: soviet-union-leadership
      c: Brezhnev and Andropov advocate annulling the citizenship of the civil-rights activists Gabay and Marchenko. No host country is found.
      n: '[[w.schattenberg-brezhnev]], 253 (n.89). To check: RGANI, f. 89, perechen'' 18, document 47, l. 1–2 (cited by [[w.schattenberg-brezhnev]], 253 n.89). Made public: 2021 at the latest. Names: Brezhnev, Andropov, Gabay, Marchenko.'
      tags:
      - name:brezhnev-leonid
      - name:andropov-yuriy-vladimirovich
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1968-05-27.soviet-union-leadership
      when: May 27
      date: '1968-05-27'
      thread: soviet-union-leadership
      also: *id001
      c: 'Kosygin to the Politburo on Prague: they had been entirely wrong; no "healthy core"; Dubček, Černík and Smrkovský hardly differ from Kolder, Biľak and Štrougal. No one has more authority than Dubček, Černík and Svoboda: the Soviet side must go on relying on them.'
      n: '[[w.schattenberg-brezhnev]], 275 (n.61–63). To check: A. Pikhoya, *Moskva, Kreml'', vlast''*, 56, 60 (cited by [[w.schattenberg-brezhnev]], 275 nn.61, 63). Made public: 2021 at the latest. Names: Kosygin, Dubček, Svoboda, Černík, Smrkovský, Kolder, Biľak, Štrougal.'
      tags:
      - name:kosygin-aleksei
      - name:dubcek-alexander
      - name:svoboda-ludvik
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1968-07-03.soviet-union-leadership
      when: July 3
      date: '1968-07-03'
      thread: soviet-union-leadership
      also: *id001
      c: The Politburo resolves on holding a conference of the representatives of the brother parties (the Warsaw meeting).
      n: '[[w.schattenberg-brezhnev]], 275 (n.65). To check: Politburo resolution, July 3, 1968, in Tomilina ed., *Chekhoslovatskiy krizis* (2010), 117 (cited by [[w.schattenberg-brezhnev]], 275 n.65). Made public: 2021 at the latest. Names: none.'
      tags:
      - polity:ussr
      - vis:only:ussr
