- add:
    entry:
      id: cal.1967-05-08.soviet-union-leadership
      when: May 8
      date: '1967-05-08'
      thread: soviet-union-leadership
      c: Moscow. Brezhnev, with Egorychev, the Moscow party chief, inaugurates the grave of the Unknown Soldier in Alexander Gardens and the red marble blocks for the Hero Cities on the Kremlin wall. Egorychev makes an emotional speech; Brezhnev takes the torch and lights the eternal flame.
      n: '[[w.schattenberg-brezhnev]], 261 (n.165). To check: *Pravda*, May 9, 1967, 1–2, "Siyay v vekakh, ogon'' slavy!" (cited by [[w.schattenberg-brezhnev]], 261 n.165). Names: Brezhnev, Egorychev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1967-05-18.soviet-union-leadership
      when: May 18
      date: '1967-05-18'
      thread: soviet-union-leadership
      c: 'The Politburo. Brezhnev: Podgorny, Kosygin and Suslov and he propose releasing Semichastny as KGB chairman, with Andropov in his place to bind the KGB more closely to the Central Committee; no objection to him. Semichastny, summoned believing he is to report, asks for an investigating committee; Brezhnev calmly says it is no punishment. By Semichastny''s account, Shelepin is in hospital, Voronov sent away on business and Pelshe recalled from a trip, other members seen in Brezhnev''s office before the meeting.'
      n: '[[w.schattenberg-brezhnev]], 185–86 (by Semichastny''s account; the day by Shelest''s, 186 n.115), 250 (Andropov). To check: V. Semichastny, *Bespokoynoye serdtse*, 392–94, 408; Shelest, *Da ne sudimy budete*, 279 (cited by [[w.schattenberg-brezhnev]], 185–86 nn.112–16). Made public: 2021 at the latest. Names: Brezhnev, Podgorny, Kosygin, Suslov, Semichastny, Andropov, Shelepin, Voronov, Pelshe.'
      tags:
      - name:brezhnev-leonid
      - name:podgorny-nikolai-v
      - name:kosygin-aleksei
      - name:suslov-mikhail-a
      - name:andropov-yuriy-vladimirovich
      - name:shelepin-aleksandr-n
      - name:voronov-gennady-i
      - name:pelshe-arvid-y
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1967-10-15.soviet-union-leadership
      when: Oct. 15
      date: '1967-10-15'
      thread: soviet-union-leadership
      c: Volgograd. Brezhnev opens the memorial on Mamayev Kurgan, with The Motherland Calls, the statue. His speech joins the glory of the heroes to the duty of those who follow, the defeat of fascism to the party's leadership.
      n: '[[w.schattenberg-brezhnev]], 261–62 (n.167). To check: Brezhnev''s speech at the opening of the memorial site, Volgograd, Oct. 15, 1967 (cited by [[w.schattenberg-brezhnev]], 262 n.167). Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1968-01-08.soviet-union-leadership
      when: Jan. 8
      date: '1968-01-08'
      thread: soviet-union-leadership
      c: 'The Central Committee accepts Gromyko''s proposal for a Year of Human Rights: conferences, public meetings, talks and newspaper articles.'
      n: '[[w.schattenberg-brezhnev]], 253 (n.76). To check: RGANI, f. 89, perechen'' 19, documents 43, 45 (cited by [[w.schattenberg-brezhnev]], 253 n.76). Made public: 2021 at the latest. Names: Gromyko.'
      tags:
      - name:gromyko-andrei
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1968-01-26.soviet-union-leadership
      when: Jan. 26
      date: '1968-01-26'
      thread: soviet-union-leadership
      c: 'Andropov to the Central Committee: the Western press campaign has stirred a group of thirty to forty around Litvinov and Bogoraz against the sentence on the four. He proposes no more publications on human rights; articles on civic duty and patriotism instead; further warnings for Yakir, Litvinov and Bogoraz, and, if they fail, his authorization to expel them from Moscow.'
      n: '[[w.schattenberg-brezhnev]], 253 (n.78). To check: RGANI, f. 89, perechen'' 17, document 48, l. 1–4 (cited by [[w.schattenberg-brezhnev]], 253 n.78). Made public: 2021 at the latest. Names: Andropov, Litvinov, Bogoraz, Yakir.'
      tags:
      - name:andropov-yuriy-vladimirovich
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1968-03-21.soviet-union-leadership
      when: Mar. 21
      date: '1968-03-21'
      thread: soviet-union-leadership
      also: &id001
      - soviet-union-czechoslovakia
      c: The Politburo, with Novotný threatened with removal as President, resolves to send a letter of warning to the Czechoslovak Central Committee. Brezhnev withholds it at Dubček's request.
      n: '[[w.schattenberg-brezhnev]], 272–73 (n.47). To check: Politburo resolution "O pis''me Politbyuro TsK KPSS v adres Prezidiuma TsK KPCh," Mar. 21, 1968, in Tomilina ed., *Chekhoslovatskiy krizis* (2010), 57 (cited by [[w.schattenberg-brezhnev]], 273 n.47). Made public: 2021 at the latest. Names: Novotný, Brezhnev, Dubček. Check: the work puts the decision Mar. 22 in its text and Mar. 21 in its note; when the letter was withheld.'
      tags:
      - name:novotny-antonin
      - name:brezhnev-leonid
      - name:dubcek-alexander
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1968-04.soviet-union-leadership-2
      when: Apr., at the plenum of Apr. 9–10
      date: 1968-04
      thread: soviet-union-leadership
      also: *id001
      c: 'The commission to draft the plenum''s resolution on the Czechoslovak situation. Ponomarev reads out a draft stressing "the action of our party"; Brezhnev: "together with the communist brother parties"; Kosygin: no claim to lead; Gromyko asks why "of Europe"; Brezhnev to Ponomarev: not to stress the CPSU. Agreed: the joint action of all the brother parties of the socialist countries against German imperialism. Andropov: "a good suggestion."'
      n: '[[w.schattenberg-brezhnev]], 179 (n.61). To check: RGANI, f. 2, op. 3, d. 105, l. 58 (cited by [[w.schattenberg-brezhnev]], 179 n.61). Made public: 2021 at the latest. Names: Ponomarev, Brezhnev, Kosygin, Gromyko, Andropov. Check: the day.'
      tags:
      - name:ponomarev-boris-n
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - name:gromyko-andrei
      - name:andropov-yuriy-vladimirovich
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1968-04-11.soviet-union-leadership
      when: Apr. 11
      date: '1968-04-11'
      thread: soviet-union-leadership
      also: *id001
      c: 'Brezhnev''s "night letter" to Dubček: it is late at night and he is not asleep; he would like to ask his advice, but it is too late to telephone. Their trust is "indestructible"; the fate of the party and the state depends directly on Dubček''s actions and personal responsibility.'
      n: '[[w.schattenberg-brezhnev]], 274 (n.54–55; of the letters to Dubček generally, written in consultation with the Politburo and one by hand to its members'' dictation, by the ambassador Chervonenko, 274 n.53: not shown to be this one). To check: letter, Brezhnev to Dubček, Apr. 11, 1968, in Navratil ed., *The Prague Spring 1968* (2006), 98–101 (cited by [[w.schattenberg-brezhnev]], 274 nn.54–55). Names: Brezhnev, Dubček.'
      tags:
      - name:brezhnev-leonid
      - name:dubcek-alexander
      - polity:czechoslovakia
      - polity:ussr
      - vis:only:ussr+czechoslovakia
- add:
    entry:
