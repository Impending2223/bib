      when: Feb. 15
      date: '1967-02-15'
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance
      c: Kosygin telephones Brezhnev and calls his visit to England historic.
      n: '[[w.schattenberg-brezhnev]], 191 (Brezhnev''s notebook, 191 n.159). To check: RGANI, f. 80, op. 1, d. 980 (cited by [[w.schattenberg-brezhnev]], 191 n.159). Made public: 2021 at the latest. Names: Kosygin, Brezhnev.'
      tags:
      - name:kosygin-aleksei
