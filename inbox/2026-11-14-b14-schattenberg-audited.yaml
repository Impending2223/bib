      id: cal.1967-01-27.soviet-union-leadership
      when: Jan. 27
      date: '1967-01-27'
      thread: soviet-union-leadership
      c: 'Brezhnev receives Semichastny, the KGB chairman: the regular report on the current situation, a special report on the young writers, an open discussion on trust.'
      n: '[[w.schattenberg-brezhnev]], 190–91 (Brezhnev''s notebook). To check: RGANI, f. 80, op. 1, d. 980, l. 7ob., 16, 21 (cited by [[w.schattenberg-brezhnev]], 191 n.159). Made public: 2021 at the latest. Names: Brezhnev, Semichastny.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
