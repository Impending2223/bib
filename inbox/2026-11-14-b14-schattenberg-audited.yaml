      id: cal.1965-03.soviet-union-leadership
      when: Mar.
      date: 1965-03
      thread: soviet-union-leadership
      c: 'Kosygin to a Gosplan meeting: the idea long and doggedly promoted that the automobile industry need not be developed; managers of large enterprises denied the right to a car, forced to use trucks illegally for business travel. "Is that correct?"'
      n: '[[w.schattenberg-brezhnev]], 224–25 (the passage quoted, 225). To check: RGAE, f. 4372, op. 66, d. 3, l. 176 (cited by [[w.schattenberg-brezhnev]], 224 n.206). Made public: 2021 at the latest. Names: Kosygin. Check: the day.'
      tags:
      - name:kosygin-aleksei
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-03-25.soviet-union-leadership
      when: Mar. 25
      date: '1965-03-25'
      thread: soviet-union-leadership
      c: The commission drafting the plenum's resolution on agriculture. Brezhnev moderates, gives no opinion of his own and asks the others. The first speaker would cut the resolution's second page; Brezhnev asks, cheerfully, what everyone thinks. A lively debate on its structure and how much criticism of agriculture it should hold.
      n: '[[w.schattenberg-brezhnev]], 178–79 (the day, 178 n.59). To check: RGANI, f. 2, op. 1, d. 773, l. 23 (cited by [[w.schattenberg-brezhnev]], 178 n.59). Made public: 2021 at the latest. Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-05-08.soviet-union-leadership
      when: May 8
      date: '1965-05-08'
      thread: soviet-union-leadership
      c: 'The Supreme Soviet awards seven cities the title of Hero City or confirms their existing titles: Leningrad, Kiev, Volgograd, Sevastopol, Odessa, Moscow and Brest.'
      n: '[[w.schattenberg-brezhnev]], 263. Names: none.'
      tags:
      - polity:ussr
- add:
    entry:
      id: cal.1965-07-15.soviet-union-leadership
      when: July 15
      date: '1965-07-15'
      thread: soviet-union-leadership
      c: The Presidium (Protocol 206) entrusts Shelepin with leading its sessions in Brezhnev's absence.
      n: '[[w.schattenberg-brezhnev]], 185 (the protocol, 185 n.108). To check: RGANI, f. 3, op. 2, d. 12, l. 95, extract from Protocol no. 206, July 15, 1965 (cited by [[w.schattenberg-brezhnev]], 185 n.108). Made public: 2021 at the latest. Names: Shelepin, Brezhnev. Check: the work puts the decision in "the summer of 1965"; the day is the protocol''s.'
      tags:
      - name:shelepin-aleksandr-n
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-09.soviet-union-leadership
      when: Sept.
      date: 1965-09
      thread: soviet-union-leadership
      c: On Semichastny's report for the KGB on the writers Sinyavsky and Daniel, who had published parodies of the Soviet Union in the West, the Presidium calls for a public trial, a message at home and abroad.
      n: '[[w.schattenberg-brezhnev]], 251. To check: V. Semichastny, *Bespokoynoye serdtse*, 252–53; *Kul''tura i vlast'' ot Stalina do Gorbacheva. Apparat TsK KPSS i kul''tura 1965–1972 gg.* (2009), 35, 126 (cited by [[w.schattenberg-brezhnev]], 251 n.60). Made public: 2021 at the latest. Names: Semichastny, Sinyavsky, Daniel. Check: the day.'
      tags:
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-09-16.soviet-union-leadership
      when: Sept. 16
      date: '1965-09-16'
      thread: soviet-union-leadership
      c: 'Brezhnev sends the draft of his speech for the coming plenum to all members of the Central Committee: "I request comments."'
      n: '[[w.schattenberg-brezhnev]], 181 (the covering words, 181 n.75). To check: RGANI, f. 2, op. 1, d. 790, l. 1 (cited by [[w.schattenberg-brezhnev]], 181 n.75). Made public: 2021 at the latest. Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-09-27.soviet-union-leadership-3
      when: Sept. 27–29
      date: '1965-09-27'
      thread: soviet-union-leadership
      c: The commission to draft the plenum's resolution. Suslov would write "the plenum proposes" for "the plenum commissions"; Kosygin finds "commission" better. Brezhnev first supports Suslov; Podgorny preferring "commission," he decides for it if the majority is.
      n: '[[w.schattenberg-brezhnev]], 179. To check: RGANI, f. 2, op. 1, d. 791, l. 113 (cited by [[w.schattenberg-brezhnev]], 179 n.60). Made public: 2021 at the latest. Names: Suslov, Kosygin, Brezhnev, Podgorny. Check: the day.'
      tags:
      - name:suslov-mikhail-a
      - name:kosygin-aleksei
      - name:brezhnev-leonid
      - name:podgorny-nikolai-v
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1966-08.soviet-union-leadership
      when: Aug.
      date: 1966-08
      thread: soviet-union-leadership
      c: 'The Soviet government under Kosygin agrees with Fiat to build a car factory at Togliatti on the Volga: 600,000 vehicles a year.'
      n: '[[w.schattenberg-brezhnev]], 225 (nn.205, 211). To check: S. Zhuravlev et al., *Avtovaz mezhdu proshlym i budushchim* (2006), 33, 46 (cited by [[w.schattenberg-brezhnev]], 225 nn.205, 211). Names: Kosygin. Check: the day.'
      tags:
      - name:kosygin-aleksei
      - polity:ussr
      - polity:italy
