patch: 2026-11-14-b14-schattenberg
by: 'Claude (batch 14, reader 5: Schattenberg, *Brezhnev: The Making of a Statesman*, pp. 151–65, 167–88, 204–15, 217–19, 224–27, 250–53, 261–63, 270–85), Nov. 14, 2026; audited by Claude (Opus), batch 14 audit, Nov. 14, 2026'
