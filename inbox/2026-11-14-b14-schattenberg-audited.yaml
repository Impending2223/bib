      id: cal.1968-07-27.soviet-union-leadership
      when: July 27
      date: '1968-07-27'
      thread: soviet-union-leadership
      also: *id001
      c: The Politburo sends appeals to the Soviet people and to the Czechoslovak army, to be published in the event of military intervention. Two days before the meeting at Čierna nad Tisou.
      n: '[[w.schattenberg-brezhnev]], 276 (n.79–82). To check: Politburo resolution, "Konkrete Vorbereitungen zum Einmarsch," in S. Karner et al. eds., *Prager Frühling* (2008), II, doc. 49, 301 (cited by [[w.schattenberg-brezhnev]], 276 n.80). Made public: 2021 at the latest. Names: none.'
