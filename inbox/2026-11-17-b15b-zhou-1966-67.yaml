      id: cal.1967-05-12.china-leadership
      when: May 12
      date: '1967-05-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai wires the Jiangxi Red Guards command of colleges and middle schools and the Jiangxi Military Districts Party committee on Red Guards occupying the *Jiangxi ribao*: they are to leave at once so the paper may be unsealed and printed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149 (May 12, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
