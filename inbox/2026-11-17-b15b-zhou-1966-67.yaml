      when: Oct. 14
      date: '1966-10-14'
      thread: china-leadership
      c: 'Zhou Enlai, on the Academy of Sciences Cultural Revolution, to Liu Xiyao: tell the General Political Department that the liaison men are to prepare to work formally at the Academy, not temporarily.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (Oct. 14, 1966). Made public: 2020. Names: Zhou Enlai, Liu Xiyao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-15.china-leadership-2
      when: Oct. 15
      date: '1966-10-15'
      thread: china-leadership
      c: 'Zhou Enlai receives eleven Tibetan students of the Central Nationalities Institutes cadre course, Sonam Dondrub and others. The Panchen Lama is to stay in Peking. Of the demand that serf-owners children be sent back to Tibet to be reformed, and called "black five categories": the Center has not approved the name, nor are "red five categories" red from birth, which would mean no need of reform, a fatalism and new superstition; old superstition to be broken, and new.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (Oct. 15, 1966). Made public: 2020. Names: Zhou Enlai, Panchen Lama.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-15.china-leadership-3
      when: Oct. 15
      date: '1966-10-15'
      thread: china-leadership
      c: 'Zhou Enlai, with Jiang Qing and others, receives people of the Capital Colleges Red Guard Revolutionary Rebel Headquarters. Asked about the charge that Shanghai uses Zhous statement that the Shanghai committee is correct as a shield to suppress revolution, he says he told the committee by telephone that they were not a black gang but revolutionary: revolutionary or not is enemy against us, correct or not is among the people; two questions of different nature, not to be confused, as he has said many times.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76–77 (Oct. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-15.china-leadership-4
      when: Oct. 15
      date: '1966-10-15'
      thread: china-leadership
      also:
      - testing
      c: 'Zhou Enlai, on the National Defense Science Commissions request on the nuclear test: if the weather allows, agreed to a second cold test on the 17th; after it Zhang Zhenhuan may fly to the base to inspect on the spot and bring all those concerned back to Peking to report.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Zhenhuan.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-15.china-leadership-5
      when: Oct. 15
      date: '1966-10-15'
      thread: china-leadership
      c: 'Zhou Enlai, on Liu Jies request on handling the files of the Four Cleanups work group at Plant 221 in Qinghai: the group has been disbanded and all files are to be sealed; the "Prairie Red Guards" are to be led to see that they must make revolution by the plants and places own strength and not link up.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Jie.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
