      date: '1966-02-17'
      thread: china-leadership
      c: 'Zhou Enlai reads Yu Qiulis outline on Third Front construction: the large and small fronts have done well; steel still lags, and mine construction is the core fault. Sends it to Mao: "Worth a look; please skim."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 13 (Feb. 17, 1966). Made public: 2020. Names: Zhou Enlai, Yu Qiuli, Mao Zedong.'
