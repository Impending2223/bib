    entry:
      id: cal.1966-03-12.china-leadership-3
      when: Mar. 12–16
      date: '1966-03-12'
      thread: china-leadership
      c: Zhou Enlai attends the North China Bureau meeting, Tianjin.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 12, 1966). Made public: 2020. Names: Zhou Enlai.'
