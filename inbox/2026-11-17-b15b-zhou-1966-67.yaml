- add:
    entry:
      id: cal.1967-04-12.china-leadership
      when: Apr. 12
      date: '1967-04-12'
      thread: china-leadership
      c: Zhou Enlai learns that a son of Guo Moruo has killed himself, and visits Guo on Apr. 20.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 12, 1967). Made public: 2020. Names: Zhou Enlai, Guo Moruo.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-12.china-leadership-2
      when: Apr. 12–13
      date: '1967-04-12'
      thread: china-leadership
      c: Zhou Enlai attends the enlarged meeting of the Military Commission, at which Kang Sheng, Chen Boda and Jiang Qing make many speeches inciting the overthrow of Liu Shaoqi and Deng Xiaoping. This and the army-level cadres meeting of Feb. 26 to Mar. 25 were meant to deal with "supporting the Left, supporting farming, industry, military control and training", and were turned by them into meetings to bring down Liu.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 12, 13, 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Chen Boda, Jiang Qing, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - name:zhou-enlai
      - name:kang-sheng
      - name:chen-boda
      - name:jiang-qing
      - name:liu-shaoqi
      - name:deng-xiaoping
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-13.china-leadership
      when: Apr. 13
      date: '1967-04-13'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai reviews the Centers notice, in the names of the Center, State Council, Military Commission and Cultural Revolution Group, to the Guangdong military control committee, the Central-South financial and economic commission and all regions and provinces, on running the Canton spring export fair well; he adds that no power is to be seized in the fair or its bodies. The notice gives five points to ensure its success; Mao approves it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 13, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-13.china-leadership-2
      when: Apr. 13
      date: '1967-04-13'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with Huang Yongsheng and Fu Chongbi and others on the Canton fair.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Fu Chongbi.'
      tags:
      - name:zhou-enlai
      - name:huang-yongsheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-13.china-leadership-3
      when: Apr. 13
      date: '1967-04-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, in the evening, receives Inner Mongolias rebel delegates: do not seize Ulanhu; organizations across trades are to dissolve; individual interest yields to the whole and a mans grievance for a time is no matter; fight self-interest and set up the public; do not hold on to the PLA, but mend army–people relations. At the meeting the Centers Decision on the Inner Mongolia question is read and explained.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 13, 1967, the item after). Made public: 2020. To check: the Centers decision on Inner Mongolia, as issued. Names: Zhou Enlai, Ulanhu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-14.china-leadership
      when: Apr. 14
      date: '1967-04-14'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai writes Mao and Lin Biao on the Canton fair: five points were issued, but Huang Yongsheng reports tension and the military control committee can hardly keep order; after settling Inner Mongolia this morning he called the Foreign Trade Ministry and Foreign Trade Institute rebels, who will send men to help. Many college and office rebels busy with quarrels at home hamper the fairs companies and halls and form factions with local rebels; if not at once dissuaded, the opening on the 15th will be much harmed; he will fly to Canton at 7 this morning with Huang Yongsheng to settle it himself.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141–142 (Apr. 14, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Huang Yongsheng.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - name:huang-yongsheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-14.china-leadership-2
      when: Apr. 14
      date: '1967-04-14'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai flies to Canton. During his stay, for the fair and for Guangdong, he talks many times with Huang Yongsheng, Liu Xingyuan, Lin Liming, Lu Xuzhang, Chen De and Wen Yucheng, meets Cantons mass bodies four times and inspects the fairs display.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 142 (Apr. 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Chen De.'
      tags:
      - name:zhou-enlai
      - name:huang-yongsheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-14.china-leadership-3
      when: Apr. 14
      date: '1967-04-14'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai speaks at the Canton representatives meeting of all circles and explains the Centers five-point notice on the spring fair: tomorrows opening is to be seen as a new campaign and the meeting made a success. Respect and trust the PLA; no posters criticizing it outside. Cadres are the wealth of Party and state and their experience is needed; they must stand forth or the work cannot go on.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 142 (Apr. 14, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-04-15.china-leadership-2
      when: Apr. 15
      date: '1967-04-15'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai holds a symposium with the Canton mass bodies. To those who say they will seize "Cantons Tan Zhenlin" and the "handful" in the Military Region and oppose military control: it was Maos decision from the whole situation and he handled it; to say so points the spearhead at the Party Center. Do not raise to principle each small thing the Region says. Do not think a right direction means no mistakes: the same may fail; they need another rectification. To the Peking students in Canton: to cause a great linking up again as last year cannot be allowed; speak and shout slogans in Guangdong with care.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 142–143 (Apr. 15, 1967). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin.'
      tags:
      - name:zhou-enlai
      - name:tan-zhenlin
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-16.china-leadership
      when: Apr. 16
      date: '1967-04-16'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Zhou Enlai calls at Conghua on Hồ Chí Minh, who is recuperating there.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 16, 1967). Made public: 2020. Names: Zhou Enlai, Hồ Chí Minh.'
      tags:
      - name:zhou-enlai
      - name:ho-chi-minh
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1967-04-17.china-leadership
      when: Apr. 17
      date: '1967-04-17'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai again meets Cantons mass bodies. He rebukes those who, because *Secret History of the Qing Court* has the four words "all under heaven is public", covered the four characters written by Sun Yat-sen in the Zhongshan Hall, and orders them restored before dawn. Make the past serve the present; Sun is still to be affirmed in the Cultural Revolution; last years removal of Suns bronze statue at Nanjing was wrong.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 17, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-18.china-leadership
      when: Apr. 18
      date: '1967-04-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, at the fourth meeting with Cantons mass bodies: Guangdong is on the front and war and war preparation weigh heavily; if rail, telephone and telegraph fail it is very bad for us. If they find the Cultural Revolution slow, slower may be better, for fast has little experience and more falls. To say the revolutionaries cannot join production and that the conservatives do it better would make them no revolutionaries. Talk of capitalist restoration by the army or some of its heads is not so. Return to classes to make revolution is not suppression; the cry "long live revolutionary hitting, smashing, looting" is wrong, nothing revolutionary in it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 18, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-19.china-leadership
      when: Apr. 19
      date: '1967-04-19'
      thread: china-leadership
      c: Zhou Enlai flies back to Peking.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 19, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-20.china-leadership
      when: Apr. 20
      date: '1967-04-20'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai speaks at the founding meeting of the Peking Municipal Revolutionary Committee: while grasping revolution hard, promote production hard, and have the Cultural Revolution shine in economic construction and scientific research; here Peking has great influence on the country.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143 (Apr. 20, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-04-21.china-leadership
      when: Apr. 21
      date: '1967-04-21'
      thread: china-leadership
      c: 'Zhou Enlai receives the correspondents of the *Hongqi*, the *Renmin ribao*, the *Jiefangjun bao* and Xinhua stationed in other places: report more widely; the armys support of the Left is the centre, but report its successes in supporting industry and farming too, and hear the views of the conservatives, a large mass; look at the whole.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 143–144 (Apr. 21, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-04-21.china-leadership-2
      when: Apr. 21–24
      date: '1967-04-21'
      thread: china-leadership
      c: 'Zhou Enlai attends the enlarged Military Commission meeting. In the outline of his speech he writes "the February disorder" for the "February adverse current": the error was in relations with the masses, in intent for Mao, wishing to do well but sometimes standing wrong and thinking in the old way; the comrades self-criticisms are a summing of experience; keep calm, correct at once, and stand ready to bear responsibility.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144 (Apr. 21, 24, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-22.china-leadership
      when: Apr. 22
      date: '1967-04-22'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with Han Xianchu on Fujian. The next day he receives Fujian delegates and requires the mass body occupying the *Fujian ribao* to leave at once: Fujian is at the front.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144 (Apr. 22, 1967). Made public: 2020. Names: Zhou Enlai, Han Xianchu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-23.china-leadership-3
      when: Apr. 23
      date: '1967-04-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the report of the Chengdu Railway Bureaus military control committee that five or six hundred Red Guards moved into the bureau and disturb its work: ask the Cultural Revolution Groups office to telephone and see if they can be persuaded to leave; if not, think of a formal telegram.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144 (Apr. 23, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-25.china-leadership
      when: Apr. 25
      date: '1967-04-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with Tan Qilong. He had meant to have the outline of the Cultural Revolution ready next year; now the situation is complicated, and long spiritual preparation is needed; the cost of the socialist revolution may be no less than the democratic. On the cadres he is troubled: they cannot come out to work. On Tans return to Shandong to make his self-criticism: hear views, do not take positions lightly nor tell of his achievements, criticize himself more; Zhou has told them he is only to be criticized and no violence or encirclement. After Tan returns the rebels violate this, and Zhou rebukes those responsible.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 144–145 (Apr. 25, 1967). Made public: 2020. Check: the day of the rebuke; the chronology says only "after". Names: Zhou Enlai, Tan Qilong.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-26.china-leadership
      when: Apr. 26
      date: '1967-04-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the military-control cadres of the defence branches. Military control is a transitional means, unlike that of the early years of liberation. "Grasp revolution, promote production" is not dualism but revolution to push production; not that the masses have nothing to be criticized: todays editorial calls for overthrowing anarchism. Have the greatest patience: patience is not tolerance, and tolerating error will not do. Final say on revolution and business in a controlled unit is the control committees; the masses can criticize and propose, not supervise business.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 26, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-04-26.china-leadership-2
      when: Apr. 26
      date: '1967-04-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with Gu Zhuoxin and other heads of the Northeast Bureau and the Shenyang Military Region: they must unite and not split, or the masses are divided and set against each other and armed fights follow; the Region to back the Northeast Bureau in leading the Cultural Revolution and in grasping farming and industry.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Gu Zhuoxin.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-27.china-leadership
      when: Apr. 27
      date: '1967-04-27'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives the Inner Mongolian petitioners sitting at the gate of Zhongnanhai and tells them to dissolve their "Workers, Peasants and Soldiers Revolutionary Committee" and other bodies across trades and go back to their own units and trades.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 27, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-28.china-leadership
      when: Apr. 28
      date: '1967-04-28'
      thread: china-leadership
      c: 'Zhou Enlai, with Kang Sheng and Li Fuchun, receives delegates of the Institute of International Relations. On the "February mutiny": so far as he knows, there was no such thing; "prepare for war, prepare for famine, for the people" is the policy Mao put forward at the Hangzhou conference, and carrying out his order.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 28, 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Li Fuchun.'
      tags:
      - name:zhou-enlai
      - name:kang-sheng
      - name:li-fuchun
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-28.china-leadership-2
      when: Apr. 28
      date: '1967-04-28'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of the two factions of the Zhanyou Song and Dance Troupe: unite, and he will go to see the *Long March Suite* sung by both; otherwise not. On May 2 he goes to the joint performance in Peking.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-30.china-leadership
      when: Apr. 30
      date: '1967-04-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai consults Chen Boda on the clause in the Centers Opinions on the Fujian Question that those arrested for storming the Military Region be freed at once, and adds: "except the odd active counter-revolutionary yet to be made clear."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 145 (Apr. 30, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-30.china-leadership-2
      when: Apr. 30
      date: '1967-04-30'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives Fujians rebel delegates and reads and explains the Centers Opinions on the Fujian Question. After return they are not to name Ye Fei in so large a paper as the *Fujian ribao*; official papers should leave room; no more storming the Military Region nor meetings like the "Feb. 7" to shell someone; Fujian is on the front, not like Peking.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 146 (Apr. 30, 1967, the item after). Made public: 2020. To check: the Centers Opinions on the Fujian Question, as issued. Names: Zhou Enlai, Ye Fei.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-30.china-leadership-3
      when: Apr. 30
      date: '1967-04-30'
      thread: china-leadership
      c: 'Zhou Enlai talks with the delegates of mass bodies of the Centers and State Councils departments on seats on the May Day viewing stand: tickets are to be shared out fairly and not wrangled over on the stand, or none will go. On the situation: most departments ask for military control, or output will not rise. The ordering conference is to meet after May Day; the Third Five-Year Plan must go up; Yuan Baohua, though kept in post under supervision, must attend this one and not "rebel" there.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 146 (Apr. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yuan Baohua.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-01.china-leadership
      when: May 1
      date: '1967-05-01'
      thread: china-leadership
      c: Zhou Enlai talks with Gu Mu on Yuan Baohua.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 146 (May 1, 1967). Made public: 2020. Names: Zhou Enlai, Gu Mu, Yuan Baohua.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-03.china-leadership
      when: May 3
      date: '1967-05-03'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates of the summer grain-and-oil purchase conference of 14 provinces and municipalities. Farmers report land and grain too small and population and disaster too large: "to store wealth in the people"; not encouraging dishonesty but a way to deal with bureaucracy. High targets and high purchases harmed farmers; now they report less. If we are factual and rely on poor and lower-middle peasants they will tell the truth; ten percent more grain is only good, and peasants will not eat it up: better in their homes than bought in. More purchase means resale, a false picture and wasted trips. To those who call correct grain policy and rules the bourgeois reactionary line: tell revolutionary from bourgeois reactionary line by the situation and the substance of policy, not by a word or the sight of goods; needed rewards are not "material incentive".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 146–147 (May 3, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-05-04.china-leadership-2
      when: May 4
      date: '1967-05-04'
      thread: china-leadership
      c: 'Zhou Enlai receives the finance-and-trade mass bodies and does not agree to their forming a "liaison station to criticize Li Xiannian". To the rebels who seized cadres and left them untraced: "what style is that? a kidnappers style"; the finance and trade ministries must not do so. Of the "February adverse current": it was a difference of understanding and view, no question of principle; a mistaken leaning is among the people; Li Xiannians is among the people; judge a man by his whole history, not a moment; the Center knows its cadres.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 4, 1967). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-05.china-leadership
      when: May 5
      date: '1967-05-05'
      thread: china-leadership
      c: Zhou Enlai writes Chen Yi, Tan Zhenlin, Li Xiannian, Yu Qiuli and Gu Mu, copy to Li Fuchun, warning them not to take the "May Day unity" for an illusion, or "there will be another new swing".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 5, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi, Tan Zhenlin, Li Xiannian, Yu Qiuli, Gu Mu, Li Fuchun.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - name:tan-zhenlin
      - name:li-xiannian
      - name:li-fuchun
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-05.china-leadership-2
      when: May 5
      date: '1967-05-05'
      thread: china-leadership
      c: Zhou Enlai talks with the vice-premiers Chen Yi, Tan Zhenlin, Li Xiannian and Li Fuchun, with Yu Qiuli and Gu Mu.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 5, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi, Tan Zhenlin, Li Xiannian, Li Fuchun, Yu Qiuli, Gu Mu.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - name:tan-zhenlin
      - name:li-xiannian
      - name:li-fuchun
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-06.china-leadership
      when: May 6
      date: '1967-05-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with Gan Weihan on the armed fight at Plant 132.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 6, 1967). Made public: 2020. Names: Zhou Enlai, Gan Weihan.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-07.china-leadership-3
      when: May 7
      date: '1967-05-07'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, after talking with Li Dazhang, Zeng Xisheng and Liao Jingdan, receives delegates of some Sichuan cities and counties. To those dissatisfied with the self-criticisms of Gan Weihan and Wei Jie: sincere in attitude, and understanding takes a process; trust and rely on most cadres. Chen Boda reads the Centers Decision on handling the Sichuan question.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 147 (May 7, 1967). Made public: 2020. To check: the Centers Decision on handling the Sichuan question, as issued. Names: Zhou Enlai, Li Dazhang, Zeng Xisheng, Liao Jingdan, Gan Weihan, Wei Jie, Chen Boda.'
      tags:
