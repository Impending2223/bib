- add:
    entry:
      id: cal.1966-05-26.china-leadership
      when: May 26
      date: '1966-05-26'
      thread: china-leadership
      c: 'Zhou Enlai at the first full meeting of the Capital Work Group, Ye Jianying presiding. The meeting settles its tasks, organization, work plan and method, and the moving in of two army divisions. Zhou: the capital garrison work is to be firm and steady, clear-headed, not hurried, or bad elements slip in; it touches the whole; the counter-revolutionaries are few, the army reliable. If urgent troop movements are needed when Zhou is away, Deng Xiaoping may be asked. He reports the meeting and arrangements to Mao May 31.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 32 (May 26, 1966). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Deng Xiaoping, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - name:deng-xiaoping
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-05-27.china-leadership
      when: May 27
      date: '1966-05-27'
      thread: china-leadership
      also:
      - testing
      c: Zhou Enlai receives a Chilean parliamentary delegation under the second vice-president of the Chamber (Xiboli Kalousi, 席博里·卡洛斯). Small countries often do great things; China as a large one takes care to do no injustice nor meddle in others affairs. Chinas tests are for defence and world peace; China will never use nuclear weapons first, and wants all banned and destroyed. The U.S.–Soviet non-proliferation treaty aims at China and at isolating it. At home output has risen but is small beside need; keep the economy in proportion; big cities strain supply and traffic.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 32–33 (May 27, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+chile
- add:
    entry:
      id: cal.1966-05-28.china-leadership-2
      when: May 28
      date: '1966-05-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates to the Xingtai earthquake science conference: the richest in over a dozen years. Do not stop at phenomena; seismic stations and staff are far too few, and quality is needed as well as number; the State Science Commission and Nie Rongzhen to carry on, as oil has shone so earthquakes should; two "threes": leaders, experts and masses, and research with teaching and production. Analyze first-hand data, find contradictions, no cliques; dare to think, speak, act, argue and make revolution.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 33 (May 28, 1966). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen.'
      tags:
      - name:zhou-enlai
      - name:nie-rongzhen
      - polity:prc
      - vis:only:prc
