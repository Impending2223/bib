      when: Nov. 6
      date: '1966-11-06'
      thread: china-leadership
      c: 'Zhou Enlai writes Soong Ching Ling: busier lately, he has held her article back until now and is uneasy; he sends the Chinese and English versions, revised, for her to look over. The *Renmin ribao* prints it Nov. 13.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 6, 1966). Made public: 2020. Names: Zhou Enlai, Soong Ching Ling.'
      tags:
      - name:zhou-enlai
      - polity:prc
