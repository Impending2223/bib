- add:
    entry:
      id: cal.1966-09-01.china-leadership-6
      when: Sept. 1
      date: '1966-09-01'
      thread: china-leadership
      c: 'Zhou Enlai tells Hospital 301 to be ready to receive Zhang Zhizhong, Zhang Shizhao, Cheng Qian, Fu Zuoyi, Cai Tingkai, Li Zongren and Shao Lizi: old and ill, the government is to protect them.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52 (Aug. 30, 1966; "九月一日"). Made public: 2020. See [[cal.1966-08-30.china-leadership]]. Names: Zhou Enlai, Zhang Zhizhong, Zhang Shizhao, Cheng Qian, Fu Zuoyi, Cai Tingkai, Li Zongren, Shao Lizi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-01.china-leadership-7
      when: Sept. 1
      date: '1966-09-01'
      thread: china-leadership
      c: 'Zhou Enlai at the symposium of Red Guard delegates of the capitals colleges and middle schools. Organize first, then unite: a schools Red Guards should have at least a general meeting, a congress of delegates and a leading body; avoid cutting off from the schools masses and from the Red Guards own. Do not disturb production or work units; hit no wide circle: "we must make revolution and produce, or what do we eat?" Factories cannot stop; the service trades must keep supplying; power stations not for a second; protect key state organs and the broadcast and press. Do not overthrow ordinary bourgeois persons who did no sabotage, nor search and raid houses. Respect Soong Ching Ling, Sun Yat-sens widow, who rescued underground comrades and has long worked with the Party; wall posters at her house are improper, and she is not to be struck down because her sister married Chiang Kai-shek.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 54–55 (Sept. 1, 1966). Made public: 2020. Names: Zhou Enlai, Soong Ching Ling, Sun Yat-sen, Chiang Kai-shek.'
      tags:
      - name:zhou-enlai
      - name:chiang-kai-shek
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09.china-leadership
      when: Sept., early
      date: 1966-09
      thread: china-leadership
      c: 'Zhou Enlai, on Li Fuchuns proposal and Maos approval, has Yu Qiuli and Gu Mu moved to the State Council to help run the economy: "help me hold the economic line; if the base stays in order the situation holds; if it falls into chaos it cannot be mended; production must not stop." As the Red Guard exchange of experience begins, to ease the railways he has Gu Mu and Yu Qiuli draw up a detailed rail transport plan, freight needed for production first, then passenger plans with a margin for student travel.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 55 (Sept., early 1966). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Mao Zedong, Yu Qiuli, Gu Mu.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
      at: before 1966-09-01
- add:
    entry:
      id: cal.1966-09-12.china-leadership
      when: Sept. 12
      date: '1966-09-12'
      thread: china-leadership
      c: Zhou Enlai tells Gu Mu to collect the figures on rail freight.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 55 (Sept., early 1966; the 12th). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
      tags:
      - name:zhou-enlai
      - polity:prc
