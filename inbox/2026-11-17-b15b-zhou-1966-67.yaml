    entry:
      id: cal.1966-03-29.china-leadership-3
      when: Mar. 29
      date: '1966-03-29'
      thread: china-leadership
      c: Zhou Enlai calls Li Xiannian, Tan Zhenlin, Wang Guangwei, Chen Zhengren, Qian Zhengying and Zhou Rongxin on farming.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Mar. 29, 1966). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Tan Zhenlin, Wang Guangwei, Chen Zhengren, Qian Zhengying, Zhou Rongxin.'
