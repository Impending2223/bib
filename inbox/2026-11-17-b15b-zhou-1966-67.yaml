      c: At a mass meeting of ten thousand at Peking University, Chen Boda, Kang Sheng and Jiang Qing propose withdrawing the work group and dismissing Zhang Chengxian. Afterward schools across the country seize and struggle against their work-group heads.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42 (July 27, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chengxian.'
