      thread: china-leadership
      c: 'Liao Chengzhi, reviewing the Xinhua photographs of the rally, conveys to Xinhua Zhou Enlais recent instructions on its reporting: the new leadership must correct two faults of the past, reporters writing the story before the event and merely filling in names at the scene, not listening to the speakers; and news photographs pasted up from several.'
