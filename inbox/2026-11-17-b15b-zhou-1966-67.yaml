- add:
    entry:
      id: cal.1966-10-01.china-leadership-3
      when: Oct. 1
      date: '1966-10-01'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai revises the *Renmin ribao* editorial for the 17th anniversary of the Peoples Republic, "Arm Seven Hundred Million People with Mao Zedong Thought", as Chen Boda had revised it. The draft equated failure to understand the Cultural Revolution with deliberate opposition; Zhou changes it. The enemies of the proletariat are opposing the Cultural Revolution in various ways, even raising the "red flag" against the red flag, to deceive some of the masses and "bombard" the proletarian headquarters; others still do not understand Maos proletarian line and keep "fear" first in the mass movement, speaking of the Sixteen Points but acting against them, which the enemy can use to fish in troubled waters; if they hold to error they will split from the people and become power-holders on the capitalist road. To Mao he notes that two passages on p. 3 do not separate the two kinds of contradiction, which will affect the leadership of the movement; the wording he leaves to Tang Pingzhu. Mao circles it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70–71 (Oct. 1, 1966). Names: Zhou Enlai, Chen Boda, Mao Zedong, Tang Pingzhu.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:mao-zedong
      - polity:prc
- add:
    entry:
      id: cal.1966-10-01.china-leadership-4
      when: Oct. 1
      date: '1966-10-01'
      thread: china-leadership
      also:
      - china
      c: 'The *Hongqi*, issue 13, prints the editorial "Advance on the Broad Road of Mao Zedong Thought": a very few use new forms to deceive the masses and oppose the Sixteen Points, stubbornly holding the bourgeois reactionary line, which must be thoroughly criticized, with no eclecticism. Zhou Enlai tells his liaison man Liu Xiyao that Chen Boda published an editorial criticizing the "bourgeois reactionary line" without the Centers discussion; no one was ready, and many leading cadres are now in difficulty. He later asks Mao if "reactionary line" is apt: the Party has called line errors "Left" or Right, never a reactionary line. Mao replies that it was first "counter-revolutionary line", then "line opposed to the revolution", and in the end "reactionary line". Criticism of the "bourgeois reactionary line" then begins across the country.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71 (Oct. 1, 1966). Names: Zhou Enlai, Chen Boda, Liu Xiyao, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:mao-zedong
      - polity:prc
