- add:
    entry:
      id: cal.1967-06-14.china-leadership-2
      when: June 14
      date: '1967-06-14'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, on an international train stopped at Liuzhou in Guangxi, sends for the delegates of the two Guangxi factions in Peking and orders them to telephone home at once to keep the train running; it leaves Liuzhou next morning.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-14.china-leadership-3
      when: June 14
      date: '1967-06-14'
      thread: china-leadership
      c: Zhou Enlai writes Mao asking him to call a meeting to hear a report on the national economy now and the arrangement of the 1967 plan, and proposes the attendance go to the twenty-two or three of the liaison meeting. The next day he goes to Maos for the meeting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-15.china-leadership
      when: June 15
      date: '1967-06-15'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai sends a plane to bring Zhang Boseng, Wang Caifang and others from Hunan to Peking and puts them up at the Jingxi Hotel. Next day he tells them to tell Hunans two factions: (1) no street marches, (2) no storming of others, (3) no armed fighting, (4) no calling the peasants into town, (5) study the documents well and do the work and production well. "Whoever does these best holds Mao Zedong Thoughts red flag highest."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 15, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Boseng, Wang Caifang.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-16.china-leadership
      when: June 16
      date: '1967-06-16'
      thread: china-leadership
      c: 'Zhou Enlai, before dawn, receives the rebels of the Foreign Trade, Finance, Commerce and Grain ministries and other finance-and-trade units and sharply criticizes their holding on the 13th a meeting to down Li Xiannian against his dissuasion. "I do not agree to downing Li Xiannian. Without checking or verification you call a Politburo member the "chief renegade": who is pleased? The enemy. I urged you not to hold the meeting and you gave the Center no notice: do you still heed the highest instruction? Since last year I have done this work and talked many a meeting out of being held. To see some young generals go farther and farther afield makes me very sad; I told Chairman Mao so yesterday." To the demand to down Chen Guodong: "put your slogan; I must still see the material and report to the Center; Chen has work, and the grain front cannot suffer more; not every place should hope to knock out a big tiger." He orders them to send back by a set time the leading cadres they hold.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158–159 (June 16, 1967). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Chen Guodong, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-17.china-leadership-2
      when: June 17
      date: '1967-06-17'
      thread: china-leadership
      also:
      - china
      - south-asia
      c: Zhou Enlai meets the core group of the Foreign Ministrys "Liaison Station" and its business supervision group on the wrecking of the Chinese embassy in India.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159 (June 17, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
