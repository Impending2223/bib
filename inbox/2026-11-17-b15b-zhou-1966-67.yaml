      when: May 18
      date: '1967-05-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives people from Inner Mongolia in Peking and the delegates of the Inner Mongolia Military Regions guard battalion. To the battalion: the army is the pillar of the dictatorship of the proletariat and must stay steady, not leave at once like students; no red armbands, no linking up with mass bodies; organizations across trades to dissolve.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
