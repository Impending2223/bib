      when: Oct. 16
      date: '1966-10-16'
      thread: china-leadership
      c: 'Zhou Enlai, on the Peoples Publishing House Red Guards refusal, as bourgeois, to print selected works of Sun Yat-sen, Soong Ching Ling, Liao Zhongkai, He Xiangning, Liu Yazi and Zhu Zhixin: he agrees to bring out only Suns and Soongs before the centenary of Suns birth, the rest later or by other presses.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77 (Oct. 16, 1966). Made public: 2020. Names: Zhou Enlai, Sun Yat-sen, Soong Ching Ling, Liao Zhongkai, He Xiangning, Liu Yazi, Zhu Zhixin.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
