      when: Feb. 8–9
      date: '1966-02-08'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Zhou Enlai reports to the Foreign Ministrys Fourth Conference of Ambassadors Abroad on five matters: the situation, the international anti-U.S. united front, the Vietnam war, foreign work and the study of Maos works. Foreign policy is the Centers to hold and report to; but do not ask the Center on technical and routine acts; the fronts commanders, guided by Maos thought, to act flexibly. Foreign work has Party, state and peoples sides, to be joined; foreign trade and foreign economic work too; front-line work to be led as one, in the embassys Party committee.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 11–12 (Feb. 8, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
