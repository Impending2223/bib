      id: cal.1966-03-07.china-leadership
      when: Mar. 7
      date: '1966-03-07'
      thread: china-leadership
      c: Zhou Enlai at the Secretariat meeting, reports the drought work in the eight northern provinces.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17 (Mar. 7, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
