- add:
    entry:
      id: cal.1966-10.china-leadership-2
      when: Oct.
      date: 1966-10
      thread: china-leadership
      c: 'Zhou Enlai tells his health doctor, Zhang Zuoliang, to go and see Liu Shaoqi and find how he is. Liu answers: thanks for the Premiers concern, how is he, is he well? Zhang: well, only too busy and rests too little. Liu: "give my regards to him, and ask him to look after himself."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10.china-leadership-3
      when: Oct.
      date: 1966-10
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, during the Central Work Conference, talks with Yang Yichen: Heilongjiangs defence place is important, it must not fall into disorder, nor production be left to collapse; few there are grasping production, and Yang should come out and work, not be held by the rebels over disagreement about the Cultural Revolution; create conditions and concentrate on production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 1966, the item after). Made public: 2020. Check: the day; the chronology says "during the Central Work Conference" (Oct. 9–28). Names: Zhou Enlai, Yang Yichen.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-02.china-leadership
      when: Nov. 2
      date: '1966-11-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews and revises the Centers and State Councils urgent notice asking out-of-town revolutionary teachers, students and Red Guards in Peking to leave in good order: having met Maos wish, to go quickly and keep discipline and the railways clear.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 2, 1966). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
