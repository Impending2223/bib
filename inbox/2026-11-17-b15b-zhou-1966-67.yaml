      when: Oct. 8
      date: '1966-10-08'
      thread: china-leadership
      also:
      - testing
      - china
      c: 'Zhou Enlai convenes the Central Special Commission and hears Zhang Zhenhuan on preparations and the date for the flight test combining missile and nuclear warhead. This test, on Chinas own mainland, is of great weight and must go without trouble: inspect the "cold" test round strictly and the "hot" more so; everything with a hundred percent assurance; the warhead to be given a shock test, to ensure no nuclear explosion in any abnormal case. The cold flight test about Oct. 15, with results in two or three days for Maos final decision; armed guard against Red Guard interference. Two cold rounds are fired successfully Oct. 13 and 16.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 74 (Oct. 8, 1966). Made public: 2020. Names: Zhou Enlai, Zhang Zhenhuan, Mao Zedong.'
