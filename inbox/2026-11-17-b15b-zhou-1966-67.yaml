      when: '1967'
      date: '1967'
      thread: china-leadership
      c: In stopping armed fights, great alliance, freeing cadres and the three-in-one, Zhou Enlai by day and night receives mass delegates of every region and branch, often from the evening to the dawn, sometimes without time to eat, patiently teaching them to think of the whole, drop factionalism, treat cadres rightly and reach alliance and three-in-one.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205–206 (1967, the last items, the item after). Made public: 2020. Names: Zhou Enlai.'
