    entry:
      id: cal.1966-09-01.china-leadership-4
      when: Sept. 1
      date: '1966-09-01'
      thread: china-leadership
      c: 'Mao on the draft notice on specific problems in the Cultural Revolution: "This paper is not to be issued."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 31, 1966). Made public: 2020. See [[cal.1966-08-31.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
