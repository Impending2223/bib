      c: 'Zhou Enlai reads the First Machine Ministrys report on measures against drought in the eight northern provinces: the spirit and measures are good; whether they disturb the plan and production and materials set earlier is to be seen; Bo Yibo and Yu Qiuli to settle and report. Mar. 9, Yu reports that with some adjustment and untapped capacity the plan will mostly not be disturbed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14 (Feb. 20, 1966). Made public: 2020. Names: Zhou Enlai, Bo Yibo, Yu Qiuli.'
