- add:
    entry:
      id: cal.1966-10-03.china-leadership
      when: Oct. 3
      date: '1966-10-03'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with the Red Guard delegates from all over the country in Peking for the National Day: grasp revolution and promote production, and do not lose the farm season; linking up now strains transport and grain supply. Errors of line by Party leaders are contradictions among the people; most Party and government leading organs are not a black gang but erred in direction and line. Cherish the national minorities leaders; do not shut the doors of the Peoples Political Consultative Conference and the democratic parties. Breaking the four olds and setting up the four news needs social investigation and is long work. Even with great democracy there must be high centralization: arrest powers belong to the courts; the power of propaganda, the Party papers, Xinhua and the radio stations, to no Red Guard group; without unified leadership you will go astray.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71–72 (Oct. 3, 1966). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- cite:
