- cite:
    id: cal.1966-08-01.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 43 (Aug. 1–3, 1966; Zhou handles Tsinghua for Mao: Aug. 1 Wang Guangmei, Ye Lin, and twice Kuai Dafu; Aug. 2 and 3 Wang and Ye again, and Tsinghua students and some of the work group)'
- add:
    entry:
      id: cal.1966-08-02.china-leadership
      when: Aug. 2
      date: '1966-08-02'
      thread: china-leadership
      c: Zhou Enlai, after a meeting at Maos, speaks at the Eleventh Plenum on four years experience and his understanding of the Cultural Revolution. Since the Tenth Plenum every major decision was Maos own; Mao personally had the Nie Yuanzi poster printed in the *Renmin ribao*, and that spread the whole Revolution; the withdrawal of the work groups too was Maos own decision on his return. For the work groups the Standing Committee, above all those left to run the Center in Peking, bear the responsibility; most of the cadres in them are good and were not given the policy; the Peking committee and work groups must bear more.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 2, 1966). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Nie Yuanzi.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
