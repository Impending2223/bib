- add:
    entry:
      id: cal.1966-10-13.china-leadership
      when: Oct. 13
      date: '1966-10-13'
      thread: china-leadership
      c: 'Zhou Enlai, at the Fifth Group of the Central Work Conference, says: dare to make revolution, including against oneself, not against ones whole political life but against the bourgeois world outlook in ones thinking. No one was fully ready or had experience; Mao saw the movements course plainly; if we do not, no matter: follow Mao closely and do not fall behind.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 75–76 (Oct. 13, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-13.china-leadership-2
      when: Oct. 13
      date: '1966-10-13'
      thread: china-leadership
      c: 'Zhou Enlai, on the demand of the "88 Red Flag Fighting Corps" of the Harbin Military Engineering Institute that Lu Yang of the National Defense Science Commission hand over his "black list" and work notes, rules: the corps may state its views or send delegates, with the all-army Cultural Revolution Group and the Commissions men present; the notes are state secrets, not to be given, but sealed by the Military Commission; cadres may attend criticism meetings but must be given rest and not kept long, for they have work. On the 17th he tells Liu Zhijian the three points apply to the Commissions eleven institutes.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (Oct. 13, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Lu Yang, Liu Zhijian.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-13.china-leadership-3
      when: Oct. 13
      date: '1966-10-13'
      thread: china-leadership
      c: Zhou Enlai and Tao Zhu write Mao on the progress of the Central Work Conference and suggest Mao talk with the Standing Committee on the 14th or 15th and hear reports. The evening of the 14th the Standing Committee, the regional heads and the group leaders meet at Maos to report on and consider the conference.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 76 (Oct. 13, 1966, the item after). Made public: 2020. See [[cal.1966-10-14.china-leadership]]. Names: Zhou Enlai, Tao Zhu, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
