- add:
    entry:
      id: cal.1966-10-22.china-leadership-3
      when: Oct. 22
      date: '1966-10-22'
      thread: china-leadership
      c: Zhou Enlai talks with the Red Guards of the Second Headquarters of Peking and some out-of-town student delegates and asks the Red Guard bodies to open their doors to rectification and examine their own errors. Anyone may err, and to say so is not eclecticism; do not press extreme demands, for going too "Left" is Right in "Left" form. Army, courts and organs of propaganda are to stay under Party leadership, and not everything is to be stormed. Yang Xiufeng is not a black gang.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79–80 (Oct. 22, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Yang Xiufeng.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-23.china-leadership-2
      when: Oct. 23
      date: '1966-10-23'
      thread: china-leadership
      c: 'Zhou Enlai calls the State Councils vice-premiers and branch heads, the ministries Party-group secretaries, the heads of the Centers direct organs and Military Commission and some of the Cultural Revolution Group, on easing the strain between the work groups and the students. The group heads, or a few chief men, are to step forward and take responsibility; errors of the work groups remain among the people; two comrades will make self-criticisms at the afternoon meeting. On students wanting to see posters and files at the ministries: the Military Commission, the Defense Ministry, Public Security and Foreign Affairs among them cannot let them and must hold.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 80 (Oct. 23, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-23.china-leadership-3
      when: Oct. 23
      date: '1966-10-23'
      thread: china-leadership
      c: 'Zhou Enlai answers Liu Zhijians telephoned request on how to characterize the errors of the work groups: follow Article 7 of the Sixteen Points. It says that some schools, units and work-group leaders, Party and government cadres included, erred in direction and line, not all the groups; the groups error was chiefly carrying out a line, but to speak of it generally as Article 7 does, so that the masses do not ask whose wrong line it was.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 80 (Oct. 23, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Zhijian.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
