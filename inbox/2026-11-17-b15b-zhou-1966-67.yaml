      when: Dec. 17
      date: '1966-12-17'
      thread: china-leadership
      c: 'Zhou Enlai tells Xinhua: no "black gang" or "black line" in print.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 17, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-19.china-leadership
      when: Dec. 19
      date: '1966-12-19'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates of the Jiangxi "accusation group" in Peking and asks the factions to unite on the common aim: if production stops, one cannot serve the people.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 19, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-19.china-leadership-2
      when: Dec. 19
      date: '1966-12-19'
      thread: china-leadership
      c: Zhou Enlai tells Gu Mu that the two hundred liaison men drawn for the Cultural Revolution in mines and enterprises may be drawn and trained first, the time to go down to be fixed later.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 19, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-19.china-leadership-3
      when: Dec. 19
      date: '1966-12-19'
      thread: china-leadership
      c: 'Zhou Enlai speaks at the collective reception of out-of-town teachers, students and Red Guards. The Cultural Revolutions speed, breadth and depth were beyond what was foreseen; no one, himself included, was spiritually ready enough. Of the beating and corporal punishment that goes on despite prohibition: it should be punished and such lawlessness struck, or it will become white terror.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100–101 (Dec. 19, 1966, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-12-21.china-leadership-2
      when: Dec. 21
      date: '1966-12-21'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of demobilized and transferred servicemen. Their wish for an independent organization is a matter of principle, unsuitable and needless: go back to your units and grasp revolution and production. Told some doubt the three directives Mao approved, he says there are three, Mao approved them himself, they are not false, and reads them out.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 21, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-21.china-leadership-3
      when: Dec. 21
      date: '1966-12-21'
      thread: china-leadership
      c: 'Zhou Enlai tells Luo Qingchang, head of the Partys Liaison Department, how to approach the Cultural Revolution: "no self in the heart, active in revolution, seek truth from facts."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 21, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Luo Qingchang.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-21.china-leadership-4
      when: Dec. 21
      date: '1966-12-21'
      thread: china-leadership
      c: Zhou Enlai receives staff of Shanghais Jinjiang Hotel who came to Peking; he first sent word that their occupying the Foreign Ministry was wrong and they must leave it, or he would not see them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 21, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-22.china-leadership
      when: Dec. 22
      date: '1966-12-22'
      thread: china-leadership
      c: Zhou Enlai receives delegates of the 1965 and 1966 college and technical-school graduates. He does not agree that graduates all go back to their schools to "make revolution" nor that the class of 1965 form an organization cut off from their units.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 22, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-23.china-leadership
      when: Dec. 23
      date: '1966-12-23'
      thread: china-leadership
      c: Xu Ming, deputy secretary-general of the State Council, dies, wronged, persecuted by Jiang Qing and others.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101 (Dec. 23, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-24.china-leadership
      when: Dec. 24
      date: '1966-12-24'
      thread: china-leadership
      c: 'Zhou Enlai, told before dawn that Tsinghua Red Guards, backed by the Cultural Revolution Group, will march one or two thousand today and press at Zhongnanhais west gate to take Wang Guangmei back to Tsinghua for self-criticism, tells his staff that anyone who comes for her must ask him. He tells Tong Xiaopeng and Wang Dongxing the students are not to storm Zhongnanhai and are to be talked out of seizing Liu Shaoqi and Deng Xiaoping: to seize Wang is to tie her to Liu.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 101–102 (Dec. 24, 1966). Made public: 2020. Names: Zhou Enlai, Wang Guangmei, Tong Xiaopeng, Wang Dongxing, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-24.china-leadership-2
      when: Dec. 24
      date: '1966-12-24'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai wires the Southwest Bureau (his secretary also telephoning the Chengdu Military Region) on Peking Aeronautics Institute and other Red Guards who went to the Southwest Third Front Construction Commission to seize Peng Dehuai and take him to Peking: (1) the Chengdu Military Region sends troops to go with the Red Guards and escort Peng to Peking, no one on the way to hold him or insult him in word or deed, his safety absolutely assured; (2) not by air, by train arranged with the Region; (3) the Peking garrison to meet him at Peking station and arrange his lodging and study.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 24, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Peng Dehuai.'
      tags:
      - name:zhou-enlai
      - name:peng-dehuai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-24.china-leadership-3
      when: Dec. 24
      date: '1966-12-24'
      thread: china-leadership
      c: Zhou Enlai talks with He Long. As the rebels of the State Physical Culture and Sports Commission harass He without end, he proposes He stop work and rest. Dec. 26, learning that staff put He at Diaoyutai, he has him moved to the New Sixth Institute to avoid Jiang Qing and Kang Sheng, who live there; soon after he takes He Long and Xue Ming to his own home, the Xihuating.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 24, 1966, the item after). Made public: 2020. Check: the day of the move to the New Sixth Institute and to the Xihuating; the chronology gives Dec. 26 for the first and "soon after" for the second. Names: Zhou Enlai, He Long, Jiang Qing, Kang Sheng.'
      tags:
      - name:zhou-enlai
      - name:he-long
      - name:jiang-qing
      - name:kang-sheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-26.china-leadership-4
      when: Dec. 26
      date: '1966-12-26'
      thread: china-leadership
      also:
      - china
      c: 'The *Renmin ribao* prints the editorial "Welcome the High Tide of the Cultural Revolution in Mines and Enterprises": it is not optional but must be done, and done on a great scale; workers have the right to form revolutionary organizations; the working class should welcome revolutionary students to the factories to link up.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 26, 1966). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-12-26.china-leadership-5
      when: Dec. 26
      date: '1966-12-26'
      thread: china-leadership
      c: Zhou Enlai speaks at the collective reception of out-of-town workers delegates, asking the workers to go home soon and make revolution there.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 26, 1966, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-12-26.china-leadership-6
      when: Dec. 26
      date: '1966-12-26'
      thread: china-leadership
      c: 'Zhou Enlai, asked by Wu De what attitude the Peking committee should take to the Dec. 27 meeting of the capitals colleges to criticize Liu Shaoqi and Deng Xiaoping, writes: it may stay away.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Wu De, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-26.china-leadership-7
      when: Dec. 26
      date: '1966-12-26'
      thread: china-leadership
      c: 'Zhou Enlai receives Red Guard delegates of Pekings First and Second Foreign Languages Institutes: to promote linking up and mind policy at once, keep policy and routine business apart; policy may be discussed, specific work not interfered with, for it has some secrecy; not all of diplomacy goes on wall posters.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 102 (Dec. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-27.china-leadership
      when: Dec. 27
      date: '1966-12-27'
      thread: china-leadership
      c: Zhou Enlai chairs the Centers liaison meeting, Dec. 27 and 28. Jiang Qing and others charge Tao Zhu with being "Chinas biggest royalist".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 27, 28, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
