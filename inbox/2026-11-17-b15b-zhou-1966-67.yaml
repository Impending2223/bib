      when: July 24
      date: '1966-07-24'
      thread: china-leadership
      c: 'Zhou Enlai, at 4 a.m., writes Liu Shaoqi and Deng Xiaoping: on last nights talk, after thought and more papers, the differences come from the reading of the situation and of the problem, not other causes; better not to talk of them. In Peking sending work groups was general and necessary, but each groups case is special and needs a local inquiry; working relations must be settled and fixed, or work is hard. He went this morning to the Foreign Languages Institute to read the wall posters.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 40–41 (July 24, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
