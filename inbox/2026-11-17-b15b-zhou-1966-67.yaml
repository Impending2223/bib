      c: 'Zhou Enlai chairs the Centers liaison meeting on the East China Bureaus request for a way to settle students and Red Guards linking up in hospitals and the disorder there. Decided: wire the bureau, all bureaus, the provincial committees and the Health Ministry that the Center agrees Red Guards are not to link up at hospitals, and the hospitals are to follow the Centers forwarding on Sept. 25 of the General Staff and General Political Department report; those already formed are to dissolve of themselves.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 68 (Sept. 26, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
