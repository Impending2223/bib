    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 72 (Oct. 4, 1966; Zhou, with Tao Zhu and military heads, reports on the Cultural Revolution to Mao at the enlarged Politburo meeting; Mao proposes a Central Work Conference of the local heads)'
- add:
    entry:
      id: cal.1966-10-05.china-leadership-2
      when: Oct. 5
      date: '1966-10-05'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'Zhou Enlai talks with Ion Gheorghe Maurer, chairman of Romanias Council of Ministers, who reports his talks in Vietnam. Zhou: on Vietnam the Chinese and Soviet positions are wholly opposite, with no joint action; Vietnam will be talked of when the time comes, the issue is the conditions, the moment and who decides, and Vietnam decides; anyone mobilized by the Soviet Union and the U.S. to press Vietnam may cross China if Vietnam invites, with exceptions, such as U Thant, who would have to be considered; aid goods to Vietnam go through China under the agreements.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 72 (Oct. 5, 1966). Made public: 2020. Names: Zhou Enlai, Ion Gheorghe Maurer, U Thant.'
      tags:
      - name:zhou-enlai
      - name:maurer-ion-gheorghe
      - name:u-thant
      - polity:prc
      - vis:only:prc+romania
