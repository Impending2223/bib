      when: Feb. 22
      date: '1966-02-22'
      thread: china-leadership
      c: Zhou Enlai amends the Centers and State Councils notice forming an agricultural leading group for the eight northern provinces, municipalities and regions (Shanxi, Hebei, Shandong, Henan, Shaanxi, Inner Mongolia, Liaoning, Peking), their farming a main strategic thrust. Zhou is group leader and heads the Hebei and Peking sections.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 15 (Feb. 22, 1966). Made public: 2020. Names: Zhou Enlai.'
