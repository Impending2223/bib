    id: cal.1966-08-30.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52 (Aug. 30, 1966; Zhous three orders on Zhang Shizhao and the list of persons to be protected)'
- add:
    entry:
      id: cal.1966-08-30.china-leadership-4
      when: Aug. 30
      date: '1966-08-30'
      thread: china-leadership
      c: Zhou Enlai tells the Ministry of Public Security to pass his list of persons to be protected to the United Front Work Department, which is to mark out the range by it and draw up a list of non-Party figures. The list takes in, besides those named in Zhous three orders, the state Vice-Chairmen, the vice-chairmen and members of the NPC Standing Committee, the CPPCC vice-chairmen, the State Councils vice-premiers, ministers and vice-ministers, the heads of the democratic parties, and the presidents of the Supreme Peoples Court and Procuratorate.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52 (Aug. 30, 1966, the item after). Made public: 2020. See [[cal.1966-08-30.china-leadership]]. Names: Zhou Enlai, Soong Ching Ling, Guo Moruo, Zhang Shizhao, Cheng Qian, He Xiangning, Fu Zuoyi, Zhang Zhizhong, Shao Lizi, Cai Tingkai, Li Zongren, Sha Qianli, Zhang Naiqi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-08-30.china-leadership-5
      when: Aug. 30
      date: '1966-08-30'
      thread: china-leadership
      c: 'Zhou Enlai meets the delegates of the two factions at the Academy of Sciences. He asks whether Hua Luogengs house was searched and whether he was struggled or beaten: searching a professors house is not good. Disorder is not feared, but disorder must make sense and follow policy. As to Zhang Jingfus statement: he may declare his stand first; do not press so hard; there must be facts and reasoning in debate, no labelling; the Academys people to keep a scientific attitude.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 52–53 (Aug. 30, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Hua Luogeng, Zhang Jingfu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-08-31.china-leadership-3
      when: Aug. 31
      date: '1966-08-31'
      thread: china-leadership
      c: 'Zhou Enlai reviews the draft Center and State Council notice on specific problems in the Cultural Revolution, written by Tao Zhus staff on his instruction, to go down to county and regiment level: key and secret organs and units to be firmly protected, with the armed forces, public security, foreign affairs, the radio and television stations, Xinhua, archives, airfields, railway hubs, ports, power stations, banks, warehouses, foreign trade offices, key utilities and the leading research bodies listed. He adds the *Renmin ribao*, the *Jiefangjun bao* and *Hongqi*, proposes issuing it, and sends it to Mao, Lin Biao, Kang Sheng, Li Fuchun and Jiang Qing, back to Wang Dongxing. Jiang Qing proposes that the Standing Committee discuss it, or that at least Mao and Lin read and revise it carefully.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 31, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Mao Zedong, Lin Biao, Kang Sheng, Li Fuchun, Jiang Qing, Wang Dongxing.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:mao-zedong
      - name:lin-biao
      - name:kang-sheng
      - name:li-fuchun
      - name:jiang-qing
