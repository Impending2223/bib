- add:
    entry:
      id: cal.1966-10-31.china-leadership-2
      when: Oct. 31
      date: '1966-10-31'
      thread: china-leadership
      also:
      - china
      c: The Center and the State Council issue, reviewed and revised by Zhou Enlai, an urgent notice on keeping order on the railways. Order is badly disturbed; to secure the transport of teachers, students, passengers and state goods each place is to bring students to Peking by plan and control the numbers, following the notice of Sept. 5; Nov. 1–5 the students of all places are to pause in coming; Red Guards to follow the railway rules and never stop or hold trains; the railways to restore order quickly.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 31, 1966). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
