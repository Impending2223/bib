      when: May 16
      date: '1967-05-16'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Chongqing factions delegates and reads and explains the Centers Opinions on the Chongqing Question: look ahead and stop debate; mass bodies not to seize each others men; respect and trust the PLA.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 16, 1967, the item after). Made public: 2020. To check: the Centers Opinions on the Chongqing Question, as issued. Names: Zhou Enlai.'
