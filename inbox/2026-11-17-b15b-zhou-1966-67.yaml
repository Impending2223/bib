      when: '1967'
      date: '1967'
      thread: china-leadership
      c: 'Zhou Enlai tells Fu Chongbi to protect Luo Ruiqing, keep it secret, and not let him be seized. Told that Luos wound after operation has not healed and rebels still want him at struggle meetings, he orders: no struggle during the operation period.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 206 (1967, the last items, the item after). Made public: 2020. Names: Zhou Enlai, Fu Chongbi, Luo Ruiqing.'
