      - name:zhou-enlai
      - name:nie-rongzhen
      - name:ye-jianying
      - name:xu-xiangqian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-08.china-leadership-2
      when: Feb. 8
      date: '1967-02-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai twice, with Ye Jianying, Nie Rongzhen, Xu Xiangqian and Xiao Hua, talks with Zhang Guohua and Chen Mingyi on Tibet. The rebels hold the regional Party committees and peoples councils power but work is paralyzed: keep the Military Commissions eight orders, guard the Regions command and the arsenals absolutely, and allow no rebels to storm in and seize power or arms.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 8, 1967). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Nie Rongzhen, Xu Xiangqian, Xiao Hua, Zhang Guohua, Chen Mingyi.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - name:nie-rongzhen
      - name:xu-xiangqian
