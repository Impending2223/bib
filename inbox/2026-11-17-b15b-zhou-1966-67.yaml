      when: Oct. 21
      date: '1966-10-21'
      thread: china-leadership
      c: Zhou Enlai calls Li Xuefeng, Liu Lantao, Song Renqiong, Li Jingquan, Wei Wenbo, Wang Renzhong, Wei Guoqing and other regional heads, with Tao Zhu, Chen Boda, Li Fuchun, Chen Yi, Ye Jianying, Tan Zhenlin, Xiao Hua and Jiang Qing, on the manner of Liu Shaoqis and Deng Xiaopings self-criticisms.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 21, 1966). Made public: 2020. Names: Zhou Enlai, Li Xuefeng, Liu Lantao, Song Renqiong, Li Jingquan, Wei Wenbo, Wang Renzhong, Wei Guoqing, Tao Zhu, Chen Boda, Li Fuchun, Chen Yi, Ye Jianying, Tan Zhenlin, Xiao Hua, Jiang Qing, Liu Shaoqi, Deng Xiaoping.'
