    entry:
      id: cal.1967-06-17.china-leadership-3
      when: June 17
      date: '1967-06-17'
      thread: china-leadership
      c: 'Zhou Enlai receives the delegates of the two factions of the Health Ministry and asks about the rural medical teams sent down: go quickly into the villages, investigate, and take up the patriotic health campaign, with prevention first. June 20 evening he receives the first medical teams about to go to the Northwest: they are work teams and propaganda teams, not to link up; five tasks: investigate and study, help the masses treat and prevent disease, spread the summer patriotic health campaign, teach health protection widely, and help train village health workers.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159 (June 17, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-06-20.china-leadership
      when: June 20
      date: '1967-06-20'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai sends a plane to bring Liu Ruisen and others to Peking. June 21, receiving Liu Peishan and Liu Ruisen, he gives six rules on Jiangxi: no marches in the streets; no armed fighting or storming one another inside a unit; no disturbing rail, passenger or shipping traffic; no random arrests; no calling peasants into town; no shooting, no seizing power.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159 (June 20, 21, 1967). Made public: 2020. Names: Zhou Enlai, Liu Peishan, Liu Ruisen.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-21.china-leadership-2
      when: June 21–25
      date: '1967-06-21'
      thread: china-leadership
      also:
      - africa
      c: Zambias President Kaunda visits China; Zhou Enlai receives him and holds talks with him from the 21st to the 25th.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 159–160 (June 21–25, 1967). Made public: 2020. Names: Zhou Enlai, Kenneth Kaunda.'
      tags:
      - name:zhou-enlai
      - name:kaunda-kenneth-d
      - polity:prc
      - vis:only:prc+zambia
- add:
    entry:
      id: cal.1967-06-22.china-leadership
      when: June 22
      date: '1967-06-22'
      thread: china-leadership
      also:
      - africa
      - testing
      c: 'Zhou Enlai, in talks with Kaunda: imperialism frightens people with atom, missile and hydrogen bombs and wants to monopolize them; China will expose it; the imperialist "non-proliferation" is a lie, meaning nuclear monopoly. June 23: to hold national independence one must win economic independence.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 22, 1967). Made public: 2020. Names: Zhou Enlai, Kenneth Kaunda.'
      tags:
      - name:zhou-enlai
      - name:kaunda-kenneth-d
      - polity:prc
      - vis:only:prc+zambia
- cite:
    id: cal.1967-06-24.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 24, 1967; Zhou with Mao at the reception of Kaunda; Zhou takes Kaunda and his wife to Shanghai on the 25th)'
- add:
    entry:
      id: cal.1967-06-25.china-leadership
      when: June 25
      date: '1967-06-25'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai, in talks with Kaunda, gives Chinas three principles for Chinese aid experts abroad: no interference in the host countrys internal affairs, serve the people wholeheartedly; teach the host countrys people, then return quickly; pay and treatment exactly equal to the host countrys technicians, no privilege and no great-power chauvinism.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 25, 1967). Made public: 2020. Names: Zhou Enlai, Kenneth Kaunda.'
      tags:
      - name:zhou-enlai
      - name:kaunda-kenneth-d
      - polity:prc
      - vis:only:prc+zambia
- add:
    entry:
      id: cal.1967-06-24.china-leadership-2
      when: June 24
      date: '1967-06-24'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of the Centers ministries and the delegates attending the coming national ordering conference: no side is to storm it, and each is to sign a pledge on the spot. The ordering is two quarters late and may not be put off again; let this test whether they are true rebels. Cadres: free a big batch.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 24, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-24.china-leadership-3
      when: June 24
      date: '1967-06-24'
      thread: china-leadership
      c: 'Zhou Enlai receives the heads of the military control delegations of the provinces and municipalities attending the national production, supply and marketing conference: military control must be made to work, whichever the faction; none may keep rules above the military control committees. The June 6 general order was drawn by the Center, State Council, Military Commission and Cultural Revolution Group and approved by Mao and Lin Biao and must be obeyed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160 (June 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-25.china-leadership-2
      when: June 25
      date: '1967-06-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, at Shanghai after seeing Kaunda off, talks with Shanghais cadres and mass delegates. He cannot sleep in Shanghai: the problems of six provinces (Jiangxi, Guangxi, Henan, Hunan, Zhejiang and one more) must be settled back in Peking; he leaves at once. On the three-in-one: Mao says provinces and cities need cadres in command; young Red Guards go up one day and are downed the next, politically immature, not yet fit to head a provincial or municipal revolutionary committee.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 160–161 (June 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-26.china-leadership
      when: June 26
      date: '1967-06-26'
      thread: china-leadership
      c: Zhou Enlai returns to Peking.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 26, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-26.china-leadership-2
      when: June 26
      date: '1967-06-26'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai receives the head of a Japanese scientific instruments exhibition group, (Jinyuan Dingsi, 靳原定司), and the trade unionist Takano Minoru. Will the Cultural Revolution knock down all Chinas traditional culture and all with a popular character? No: much that is excellent in the literary and artistic heritage and in what is of the people is to be inherited critically.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Takano Minoru.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1967-06-28.china-leadership
      when: June 28
      date: '1967-06-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with Chen Yi, the Foreign Ministrys Party group, the heads of the ministrys business supervision groups, the core group of its "Rebel Liaison Station" and the heads of its mass bodies on the ministrys movement and business. On the rebels wish to criticize Chen Yi: the best way is what he proposed, with a smaller scope; "I said long ago you may state your views on Marshal Chen, but the Center has made no conclusion and you cannot impose one on me."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 28, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-28.china-leadership-2
      when: June 28
      date: '1967-06-28'
      thread: china-leadership
      c: Zhou Enlai, told that armed fights between two factions at Plant 404 have stopped 80 percent of its shops, tells Nie Rongzhen to call a meeting and have the parties concerned send delegates to Peking to settle it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen.'
      tags:
      - name:zhou-enlai
      - name:nie-rongzhen
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-29.china-leadership
      when: June 29
      date: '1967-06-29'
      thread: china-leadership
      c: 'Zhou Enlai, on students of the Peking Institute of Civil Engineering taking turns at Zhongnanhais west gate to demand Liu Shaoqi be seized: Wang Dongxing is to persuade them to go back, and Zhou will guarantee Liu hands in a written self-criticism; if they will not go after the persuasion, Qi Benyu is to deal with it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161 (June 29, 1967). Made public: 2020. Names: Zhou Enlai, Wang Dongxing, Liu Shaoqi, Qi Benyu.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-29.china-leadership-2
      when: June 29
      date: '1967-06-29'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, told that over ten thousand students and workers left Chengdu to petition in Peking, wires the Mianyang county committee, for all of the "Red Guard Chengdu Corps Going to Peking to Petition", copy to the Sichuan preparatory group for a revolutionary committee and the Chengdu Military Region: keep by Maos Apr. 20 Center notice; such numbers coming hinder traffic, hurt production and hurt the Cultural Revolution in Chengdu; stop at Mianyang, send ten delegates by train and the rest back to Chengdu. July 1 he wires Zhang Guohua at Mianyang for all the petitioners, dissuading them from bringing over 50,000: it harms grasping revolution and promoting production, Third Front construction and transport; agree the delegates number with Zhang. July 8 the "Red Cheng Headquarters" agrees to send sixty delegates and to persuade the rest to go back. July 10 Zhou and Chen Boda wire it, copy to the Sichuan group and the Centers delegation to the Southwest, to turn back the eight or nine thousand already on the way.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 161–162 (June 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Guohua, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-29.china-leadership-3
      when: June 29
      date: '1967-06-29'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks three times with the Jiangxi Military District and the Jiangxi delegates of both factions in Peking, severely criticizing the claim that "the most pressing task before proletarian rebels is the gun, to seize power and seize arms". He orders both sides to telephone home at once to stop the error, leave the military organs, return arms and ammunition to the Region and await the men the Center sends. Both are to agree: no street marches, no fights or storming, no seizing or holding men, no hindering rail, road or shipping, no calling peasants into town, no seizing power, no shooting. Under no circumstances may rail, road and shipping stop, and above all coal output and shipment; with so much coal unshipped, production will stop.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 162 (June 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-29.china-leadership-4
      when: June 29
      date: '1967-06-29'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, receiving the Guangxi factions delegates for the fourth time, tells them first to "cool off", study Maos "On the Correct Handling of Contradictions among the People", then agree to carry out the Centers notice of June 24. July 4 the Guangxi delegates in Peking reach a ten-point agreement; July 5 Zhou orders it printed and issued to all, and the two factions and the Region to telegraph and telephone it home for the whole region to do.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 162–163 (June 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-30.china-leadership
      when: June 30
      date: '1967-06-30'
      thread: china-leadership
      c: Zhou Enlai attends the memorial meeting for Ye Jizhuang.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 163 (June 30, 1967). Names: Zhou Enlai, Ye Jizhuang.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-06.china-leadership
      when: June
      date: 1967-06
      thread: china-leadership
      c: 'Zhou Enlai, when Kang Sheng pins the label "three surrenders and one extermination" on the foreign-affairs line, asks him to his face: the Foreign Ministrys general policy, whether under him as concurrent minister or under Chen Yi, passed through his hands and was sent to Mao; the foreign policy is basically Maos, and they handle the details. Kang pleads he meant Wang Jiaxiang of the Liaison Department.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 163 (June 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Chen Yi, Wang Jiaxiang, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:kang-sheng
      - name:chen-yi
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967.china-leadership-5
      when: 1967, first half
      date: '1967'
      thread: china-leadership
      c: In the first half of the year, whenever ministers of the State Council were seized for struggle, Zhou Enlai, Li Fuchun and Li Xiannian in turn took them to live in Zhongnanhai to protect them, a few days to two or three weeks, some a year or more; some were struggled by day and housed there by night, and at the struggles Zhou sent a secretary or liaison man. Not fully counted, over forty, those sheltered include Yu Qiuli, Gu Mu, Wang Zhen, Chen Zhengren, Liao Chengzhi, Fang Yi, Yao Yilin, Kang Shien, Liu Ningyi, Zhou Rongxin, Duan Junyi, Lü Dong, Wang Zheng, Liu Lanbo, Qian Zhiguang, Jiang Yizhen, Wang Lei, Sun Zheng, Qian Xinzhong, Qian Zhengying, Lin Hujia, Li Renjun and Zhang Jingwu.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 163–164 (first half of 1967). Made public: 2020. Check: the names of the list, which runs on past those given. Names: Zhou Enlai, Yu Qiuli, Gu Mu, Chen Zhengren, Liao Chengzhi, Fang Yi, Yao Yilin, Liu Ningyi, Zhou Rongxin, Duan Junyi, Lü Dong, Wang Zheng, Liu Lanbo.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967.china-leadership-6
      when: 1967, first half
      date: '1967'
      thread: china-leadership
      c: Zhou Enlai, while leaders of the large regions and provinces were under attack, ignores Jiang Qings and Kang Shengs inquiries after them, and with Fu Chongbis help lodges the hardest-pressed at the Jingxi Hotel and the Central Organs hostel in Peking under guard. Not fully counted, they include Li Jingquan, Song Renqiong, Zhang Tixue, Zhang Pinghua, Ye Fei, Jiang Hua, Tan Qilong, Jiang Weiqing, Yang Shangkui, Liu Junxiu, Ouyang Qin, Huang Huoqing, Huang Oudong, Zeng Xisheng, Liao Zhigao, Zhao Shiyan, Zhu Dehai, Wang Zhishou, Yang Chao and Gao Kelin. Mao approves. Where some were forced to Peking by rebels, as Liu Lantao of the Northwest, Zhou and Chen Yi also cared for them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 164 (first half of 1967, the item after). Made public: 2020. Check: the day; the chronology gives no date. Names: Zhou Enlai, Li Jingquan, Song Renqiong, Zhang Pinghua, Ye Fei, Jiang Hua, Tan Qilong, Jiang Weiqing, Mao Zedong, Fu Chongbi, Liu Lantao, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:li-jingquan
      - name:mao-zedong
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-02.china-leadership
      when: July 2
      date: '1967-07-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives, in the evening, delegates of Henans "Feb. 7 Commune" and "Revolutionary Rebel General Command" on the stoppage of rail traffic at Anyang: they are to send men back at once to work with the Centers delegate to find the cause. He criticizes the stoppage of production for the July 1 march: to mark the Partys birthday one grasps revolution and promotes production; stopping production for revolution goes against Mao Zedong Thought. Proposes the three sides agree to carry out the Centers notice of June 24 and add: no halt in production or business, no riding atop trains. He asks the Henan Military Region to order at once that subdistricts and armed departments not call peasants to town for armed fights, and to seal the guns. On "catching renegades": "you publish him, he publishes you, on wind and shadow; a serious political matter, not a game." He then talks with the military control and production group of the Railways Ministry on the Anyang stoppage.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 164 (July 2, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-07-04.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 164 (July 3, 1967; Zhous letter to Mao and Lin Biao on Jiangxi, asking to move a division of the 26th Army into Jiangxi to back the Left and strengthen the military control committee and the coming revolutionary committee; Mao, July 4: wait until the Jiangxi conference shows some result)'
- add:
    entry:
      id: cal.1967-07-03.china-leadership
      when: July 3–8
      date: '1967-07-03'
      thread: china-leadership
      also:
      - soviet-union
      c: Romanias Premier Maurer visits China; Zhou Enlai receives him and holds many talks with him.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 164–165 (July 3–8, 1967). Made public: 2020. Names: Zhou Enlai, Ion Gheorghe Maurer.'
      tags:
      - name:zhou-enlai
      - name:maurer-ion-gheorghe
      - polity:prc
      - vis:only:prc+romania
- add:
    entry:
      id: cal.1967-07-04.china-leadership-2
      when: July 4
      date: '1967-07-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates of Henans factions: on flood prevention, whichever sides view, all prevent floods together; no robbing of flood-prevention gear and what was taken is to be recovered; the leaders of any who rob it or beat flood-prevention staff are to be arrested and punished, for it is a matter of the lives of thousands; flood prevention is finally under the military control side. Both sides to telephone home and issue a joint notice.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July 4, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-06.china-leadership-3
      when: July 6–9
      date: '1967-07-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai goes to Maos for meetings on July 6, 7 and 9. Mao proposes a journey south, to Wuhan, to swim the Yangtze. July 10 Zhou telephones the Wuhan Military Region that the Wuhan mass bodies delegates need not come to Peking and are to settle matters in Wuhan.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July 6, 7, 9, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07.china-leadership
      when: July, mid
      date: 1967-07
      thread: china-leadership
      also:
      - china
      c: In the first ten days and the middle of July armed fighting in Changsha, Hunan, kills a dozen or more. To settle Hunan Zhou Enlai talks in turn with the Hunan Military District, the Party committees heads and the mass bodies.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July, early and mid 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      at: before 1967-07-21
- add:
    entry:
      id: cal.1967-07-09.china-leadership
      when: July 9
      date: '1967-07-09'
      thread: china-leadership
      c: Zhou Enlai has the Railways Ministrys production command group find out how the Peking–Canton and Baoji–Chengdu trunk lines are blocked.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July 9, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-10.china-leadership
      when: July 10
      date: '1967-07-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, hearing Huang Yongsheng on Guangdong: a great alliance with the Left as its core is no monopoly, and he is to be told plainly there is no sole sway; in a great alliance no "conservative" at all is impossible, and they cannot be excluded, or the Red Congress is not approved. On Hong Kong: not like Macao; force in Hong Kong does not fit present policy; the reason China does not take Macao is to keep an opening, the market is ours; the struggle in Hong Kong is long and not to be hurried, for haste does us harm.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165 (July 10, 1967). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
      tags:
      - name:zhou-enlai
      - name:huang-yongsheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-10.china-leadership-2
      when: July 10
      date: '1967-07-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates of both Jiangxi factions in Peking on an agreement to carry out the Centers "June 24" notice and his instructions. The revolutionary masses may have radicals and gradualists, not all radicals; "conservative" is not to be lumped with reactionary and counter-revolutionary, it is still among the people, slow in thought and in seeing things. Some bodies with great rebel spirit, others weaker and leaning conservative: that is allowed; if all were rebels they would go to the extreme Left. July 11 he calls the Jiangxi Military District cadres in Peking; July 13 he receives the Jiangxi delegates, reads and explains the Centers Several Decisions on the Jiangxi Question, and tells them: on return no small moves, no mass meeting to seize and struggle against someone; act by the Sixteen Points; armed fights and beating are against Mao Zedong Thought.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 165–166 (July 10, 1967, the item after). Made public: 2020. To check: the Centers Several Decisions on the Jiangxi Question, as issued. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-12.china-leadership-2
      when: July 12
      date: '1967-07-12'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai calls the Centers liaison meeting at Diaoyutai on the Centers Instruction on Building Statues of Mao and its Notice Forbidding Stirring Peasants to Armed Fights in Towns. The 13th he reviews both and sends them to Mao for approval and issue.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 12, 1967). Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
- cite:
    id: cal.1967-07-13.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 13, 1967; Zhous draft Center notice forbidding the stirring of peasants into towns for armed fights; the instruction on statues of Mao)'
