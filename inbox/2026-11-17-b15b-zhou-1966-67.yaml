- add:
    entry:
      id: cal.1966-03-02.china-leadership
      when: Mar. 2–5
      date: '1966-03-02'
      thread: china-leadership
      c: 'Zhou Enlai hears reports on drought resistance in the eight northern provinces. On the 5th: the key to spreading model experience is cadres staying at a point and learning from the masses; working groups not to command blindly; call it the agricultural group, not "leading"; rely mainly on the localities; take care in settling city–country and farm–industry ties, try first and spread what works, not praise too soon, as in 1958; the Center not to interfere much, few circulars, no random telephoning; self-reliance; wells and plans from below; waste of labor is waste of grain; no rush, equalizing transfers or mass armies.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 16 (Mar. 2, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-03.china-leadership
      when: Mar. 3
      date: '1966-03-03'
      thread: china-leadership
      c: 'Zhou Enlai drafts the Centers reply to the Shanghai Party committee and to Chen Pixian on Chens nasal treatment: agreed with the plan; Chen to rest at ease, the experts sure to cure the early-stage nasopharyngeal tumor.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 16 (Mar. 3, 1966). Made public: 2020. Names: Zhou Enlai, Chen Pixian.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-05.china-leadership
      when: Mar. 5
      date: '1966-03-05'
      thread: china-leadership
      c: 'Zhou Enlai reports on the international and domestic situation to the national industry-and-transport work conference and political work conference. On the eight northern provinces: they long drew grain from the south; farming has not passed the test, which harms industry, war preparation and construction. Industry to help farming, but farming to rely mainly on itself; support should go where needed, through to the end. Industry and transport to support basic industry, mines above all; the weak base leaves the seat unsteady.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17 (Mar. 5, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
