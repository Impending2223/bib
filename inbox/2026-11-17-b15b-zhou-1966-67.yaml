      when: Oct. 31
      date: '1966-10-31'
      thread: china-leadership
      c: Zhou Enlai receives the Red Guard delegates of Tianjin Engineering College and criticizes Red Guards who halted a train for over ten hours to search it for "black five categories", hampering its running.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 31, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
