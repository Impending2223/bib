- add:
    entry:
      id: cal.1966-03-23.china-leadership
      when: Mar. 23
      date: '1966-03-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the second strong quake in the Xingtai area on the afternoon of the 22nd and the rumors in Peking, instructs: keep both watchfulness and calm; strengthen observation at the epicenter, flying seismographs to Lushan and Gengzhuangqiao and opening wire and radio links through Shijiazhuang to Peking; the quake area to prepare to cut losses; trace the rumors, correcting and educating those who passed on a mistake and prosecuting the malicious.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26 (Mar. 23, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-23.china-leadership-2
      when: Mar. 23
      date: '1966-03-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai calls Li Siguang, Zhang Jingfu, Zhang Youxuan and Wu Heng, with officials and experts of the Petroleum Ministry and the Academy of Sciences Institute of Geophysics, on the earthquake: prediction is to be done well.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26–27 (Mar. 23, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Siguang, Zhang Jingfu, Zhang Youxuan, Wu Heng.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-26.china-leadership
      when: Mar. 26
      date: '1966-03-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the North China Bureaus report, forwarded by the Xingtai relief headquarters, on losses and relief goods distributed in five Julu brigades, to Li Xiannian and Zhou Rongxin: at the coming conference of prefectural secretaries of the hard-hit areas, raise what needs care, so that state help does not bring dependence.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Mar. 26, 1966). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Zhou Rongxin.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-28.china-leadership-3
      when: Mar. 28
      date: '1966-03-28'
      thread: china-leadership
      c: Zhou Enlai calls Lin Mohan, Li Qi and Zhou Weizhi on the Peking-opera revolution festival of modern plays, an experimental Peking-opera troupe, and Culture Ministry artists going among the people. Actors must live among the people; the Peking Peoples Art Theatres *Live Like Him* (on Nguyễn Văn Trỗi) lacked the life of the people, the actors in love with themselves. Many theatres stay too long in town; first be revolutionary people. War plays to show the hardship of war, not make it look easy.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Mar. 28, 1966). Made public: 2020. Names: Zhou Enlai, Lin Mohan, Li Qi, Zhou Weizhi, Nguyễn Văn Trỗi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
