      thread: china-leadership
      c: Zhou Enlai calls Tao Zhu, Li Fuchun, Kang Sheng, Ye Jianying, Xie Fuzhi, Li Xiannian, Tan Zhenlin, Bo Yibo, Chen Yi, Wu De, Wang Dongxing and Zhou Rongxin on the political education of the Red Guards.
