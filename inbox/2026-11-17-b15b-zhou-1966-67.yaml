      - vis:only:prc
- cite:
    id: cal.1967-05-18.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 18, 1967; Jiang Qing sends Lin Biao, Zhou and Kang Sheng the "Wu Hao and others leave the Communist Party" notice that Nankai University rebels found in a pre-1949 Kuomintang paper, saying the notice was headed by Wu Hao (Zhou), and asks to see him)'
- add:
    entry:
      id: cal.1967-05-19.china-leadership
      when: May 19
      date: '1967-05-19'
      thread: china-leadership
      c: 'Zhou Enlai writes on Jiang Qings letter that the "Wu Hao and others leave the Communist Party" notice is a pure forgery by the enemy: he was then already in the Central Soviet area; Kang Sheng and Chen Yun, in Shanghai, knew it was done by the enemy and took steps. He writes Mao the same day, with a chronicle of the events of 1931–32. He has had no time before: busy with Sichuan and Inner Mongolia and with the soldiers of the Inner Mongolia Region in turn, he went through the Shanghai papers only today; the "notice" is the forged one of Feb. 28, 1932, and the forgery and the handling through the *Shenbao* took place after he reached Jiangxi. Mao: "to the Cultural Revolution Groups comrades to read; keep."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 19, 1967). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Kang Sheng, Chen Yun, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:kang-sheng
      - name:chen-yun
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-19.china-leadership-2
      when: May 19
      date: '1967-05-19'
      thread: china-leadership
      c: 'Zhou Enlai, on the special-case groups work: be careful, have evidence, witnesses and material proof.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
