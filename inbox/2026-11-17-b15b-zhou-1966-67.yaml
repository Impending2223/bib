    entry:
      id: cal.1966-09-05.china-leadership-6
      when: Sept. 5
      date: '1966-09-05'
      thread: china-leadership
      c: Zhou Enlai goes twice to Maos for meetings.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57 (Sept. 5, 1966). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-06.china-leadership
      when: Sept. 6
      date: '1966-09-06'
      thread: china-leadership
      c: 'Zhou Enlai chairs the Centers liaison meeting: Tao Zhu, Kang Sheng, Li Fuchun, Xie Fuzhi, Ye Jianying, Chen Yi, Wang Dongxing, Zhou Rongxin and others.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57 (Sept. 6, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Kang Sheng, Li Fuchun, Xie Fuzhi, Ye Jianying, Chen Yi, Wang Dongxing, Zhou Rongxin.'
