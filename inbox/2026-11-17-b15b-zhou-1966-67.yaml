      thread: china-leadership
      also:
      - china
      c: Zhou Enlai tells the liaison mens office to take Yang Chao, Sichuans vice-governor, to the Central Direct Organs hostel to live.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 17, 1967). Made public: 2020. Names: Zhou Enlai, Yang Chao.'
