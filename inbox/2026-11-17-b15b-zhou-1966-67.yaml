- add:
    entry:
      id: cal.1966-10-30.china-leadership
      when: Oct. 30
      date: '1966-10-30'
      thread: china-leadership
      c: 'Zhou Enlai, before dawn, calls the two factions at the Great Hall of the People and tells them to stop quarrelling, as it hurts the work: the Hall serves the Center, not for their debates; the small reasons yield to the large; school forms and ways of struggle are not to come into the Hall.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (Oct. 30, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-30.china-leadership-2
      when: Oct. 30
      date: '1966-10-30'
      thread: china-leadership
      c: 'Zhou Enlai, on Tao Lujias request whether to send someone to the criticism of Bo Yibo called Nov. 2 by the industry-transport colleges: only a man of the industry-transport political department may sit in, saying he is unprepared and cannot speak. On the day itself he tells Tao to tell the students Bo is ill and, with the Centers approval, is treated elsewhere and cannot attend.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (Oct. 30, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Lujia, Bo Yibo.'
      tags:
      - name:zhou-enlai
      - name:bo-yibo
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-30.china-leadership-3
      when: Oct. 30
      date: '1966-10-30'
      thread: china-leadership
      c: Zhou Enlai drafts the Centers Provisions on Handling Archive Materials and Other Matters in the Cultural Revolution. Those who erred in the bourgeois reactionary line are errors among the people; student bodies are not to curb the original work groups and higher leaders freedom of movement or deny them rest. Organs of dictatorship, secret and key organs, news and broadcast offices and the head organs of the Center and the bureaus are closed to the linking up of revolutionary masses inside and outside; students linking up with other offices are not to enter or seal them, nor lead masses into them; likewise villages, enterprises and research and design bodies.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83–84 (Oct. 30, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
