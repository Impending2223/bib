      when: July 28–29
      date: '1966-07-28'
      thread: china-leadership
      c: 'Zhou Enlai goes to the Peking No. 2 Foreign Languages Institute to take part in the students debate. After hearing each side: one revolutionary in intention may still err; opposing each other is bad, strengthen unity; the Cultural Revolution begins in Party and government offices, cultural and educational units, above all schools; the work group should stay to learn, and so does he.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42 (July 28, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-07-29.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42–43 (July 29, 1966; Zhous speech after Dengs: the movement went from early heat to a cooler middle for two reasons, the leaders misjudgment of the situation and fear of disorder, and the hasty decision to send work groups everywhere; most work-group members are good, old revolutionaries meeting new problems; the three tasks; the school Cultural Revolutions bodies after the withdrawal; Liu Shaoqi speaks after him)'
