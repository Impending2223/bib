- add:
    entry:
      id: cal.1966-01-15.china-leadership
      when: Jan. 15
      date: '1966-01-15'
      thread: china-leadership
      c: 'Zhou Enlai at the closing session of the Fifth National Cotton Conference, on preparing for war, for famine and for the people. War: a peaceful setting is good for construction; China will not start a war; but with imperialism standing and the Vietnam war widening, every field is to build with war in mind, not stop work. Famine: some disaster is certain in so large a country; leave a margin; suit measures to each place. The people: cut cotton acreage only after consulting communes, brigades and teams, by the mass line, no forced quotas; grain first; the Center to attend to the dry northern provinces.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 3 (Jan. 13, 1966; the 15th). Made public: 2020. To check: the speech as printed, if printed. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-01-14.china-leadership
      when: Jan. 14
      date: '1966-01-14'
      thread: china-leadership
      c: Zhou Enlai meets Ding Laifu, Xu Zirong and Yang Chengwu on the security of radio stations.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 3 (Jan. 14, 1966). Made public: 2020. Names: Zhou Enlai, Ding Laifu, Xu Zirong, Yang Chengwu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-01-16.china-leadership-2
      when: Jan. 16
      date: '1966-01-16'
      thread: china-leadership
      c: 'Zhou Enlai reports to the all-army political work conference on the international situation and, at home, on preparing for war, for famine and for the people. On fighting aggression: lure the enemy deep into our own territory, where the terrain is known and the people close, to destroy him in large numbers. On farming: grain output first; a Party that leaves the people has nothing to lead.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 3–4 (Jan. 16, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-01-17.china-leadership
      when: Jan. 17
      date: '1966-01-17'
      thread: china-leadership
      c: 'Zhou Enlai receives a delegation of the Progressive Labor Party of the United States led by Max, and recounts the Chinese partys early history and lessons: the task is to defeat U.S. imperialist aggression; ending U.S. imperialism is the Americans own domestic affair, for their party and people.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4 (Jan. 17, 1966). Made public: 2020. Names: Zhou Enlai, Max.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+us
- add:
    entry:
      id: cal.1966-01-18.china-leadership
      when: Jan. 18
      date: '1966-01-18'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'Zhou Enlai talks with the DRV government economic delegation under Deputy Premier Lê Thanh Nghị. On the Soviet cut-off of aid: the harm may do no damage and some good, forcing self-reliance; had Soviet help continued, Chinas atomic bomb would not have gone off, or would have been controlled; science needs practice.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4 (Jan. 18, 1966). Made public: 2020. Names: Zhou Enlai, Lê Thanh Nghị.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1966-01.china-leadership
      when: Jan., mid
      date: 1966-01
      thread: china-leadership
      c: 'Zhou Enlai revises the Centers and State Councils notice forwarding Zhejiangs report on hog trading: the 1965 national loss on hogs was 4.4 billion yuan; commercial departments to follow Zhejiangs experience. Zhou adds a line: buy in time within the province, push sales, face the countryside.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4 (Jan., mid, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      at: before 1966-01-11
- add:
    entry:
      id: cal.1966-01-21.china-leadership
      when: Jan. 21
      date: '1966-01-21'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - africa
      c: Zhou Enlai writes Tanzanias President Nyerere on Vietnam, exposing the U.S. Presidents "fourteen points" for a "peaceful settlement" as a plot, and reaffirming support for the DRVs position. Asks Nyerere to speak out among the Afro-Asian states.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4 (Jan. 21, 1966). Made public: 2020. Check: the chronology ties the "fourteen points" to a Honolulu conference; the Honolulu conference met Feb. 6–8, 1966. To check: the letter, if printed. Names: Zhou Enlai, Julius Nyerere, Lyndon Johnson.'
      tags:
      - name:zhou-enlai
      - name:nyerere-julius-k
      - name:johnson-lyndon-b
      - polity:prc
      - vis:only:prc+tanzania
- add:
    entry:
      id: cal.1966-01-22.china-leadership
      when: Jan. 22
      date: '1966-01-22'
      thread: china-leadership
      also:
      - japan
      - china
      c: 'Zhou Enlai receives the Japan–China Trade Promotion Association delegation under Kawase Ikkan, with Kimura Ichizo of the Japan International Trade Promotion Association, Kansai. An air agreement: both need it; the Ikeda and Satō governments opposed it because "the U.S. does not permit"; Japan can sign one with the Soviet Union. A joint statement may open a gap. On the U.S.: the ambassadors have met at Warsaw over ten years; China proposed agreement on peaceful coexistence and U.S. withdrawal from Taiwan and the Strait; the U.S. refused. China will not start a war, but if forced is ready, and the U.S. aggressor can be destroyed on the mainland.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 4–5 (Jan. 22, 1966). Made public: 2020. Names: Zhou Enlai, Kawase Ikkan, Kimura Ichizo, Ikeda Hayato, Satō Eisaku.'
      tags:
      - name:zhou-enlai
      - name:ikeda-hayato
      - name:sato-eisaku
      - polity:prc
      - vis:only:prc+japan
- add:
    entry:
