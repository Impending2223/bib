    entry:
      id: cal.1966-10-29.china-leadership-2
      when: Oct. 29
      date: '1966-10-29'
      thread: china-leadership
      c: Zhou Enlai, told that rebels broke open Tao Lujias office and took some papers, orders all files of the State Economic Commission gathered and sealed by the State Council, none to be moved without the State Councils approval.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 83 (Oct. 29, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Lujia.'
