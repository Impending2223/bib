- cite:
    id: cal.1966-08-31.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 31, 1966; Zhou with Mao and Lin Biao at the second reception of out-of-town teachers, students and Red Guards; Lins speech; Zhou: learn from the PLA, serve the people, keep the three main rules and eight points, argument, not force)'
- add:
    entry:
      id: cal.1966-08.china-leadership-2
      when: Aug., late
      date: 1966-08
      thread: china-leadership
      c: 'Zhou Enlai repeatedly dissuades Red Guards of the Tibet Nationalities Institute, the Central Nationalities Institute and others from struggling the Panchen Lama: minority leaders such as Ulanhu and the Panchen are to be protected.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 1966). Made public: 2020. Names: Zhou Enlai, Ulanhu, Panchen Lama.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      at: before 1966-08-21
- add:
    entry:
      id: cal.1966-08.china-leadership-3
      when: Aug., late
      date: 1966-08
      thread: china-leadership
      c: 'Zhou Enlai, learning that some Red Guards seized the Panchen Lama at his residence and held him at the Central Nationalities Institute, has the Peking garrison send men to stop it: no insulting struggle. He tells Xu Bing and Liu Shuzhou that the masses struggle is to be back to back, Party members to keep their posts, and to protect the Panchen even if they are themselves struggled. Xu, Liu, Zhous liaison man and garrison officers go to the Institute and move the Panchen to safety.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53–54 (Aug. 1966, "八月下旬"). Made public: 2020. Names: Zhou Enlai, Panchen Lama, Xu Bing, Liu Shuzhou.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      at: before 1966-08-21
- add:
    entry:
      id: cal.1966-08.china-leadership-4
      when: Aug., late
      date: 1966-08
      thread: china-leadership
      c: 'Zhou Enlai, learning that Red Guards are attacking Hangzhous Lingyin Temple, a national key cultural relic, has his secretary telephone the Zhejiang committee: protect it, and the committee to do its work. He later wires it to close the temple for the time.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 54 (Aug., end 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      at: before 1966-08-21
- add:
    entry:
      id: cal.1966-08.china-leadership-5
      when: Aug., late
      date: 1966-08
      thread: china-leadership
      c: 'Zhou Enlai tells the head of the Partys United Front Work Department, as many democrats, non-Party patriots and business leaders are attacked and the policy undermined: the Department is not to waver on the policy nor let go; the work must go on.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 54 (Aug., end 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      at: before 1966-08-21
- add:
    entry:
      id: cal.1966-09-01.china-leadership-5
      when: Sept. 1
      date: '1966-09-01'
      thread: china-leadership
      c: Zhou Enlai goes to Maos to report on the Cultural Revolution in Xinjiang and in Qingdao.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 54 (Sept. 1, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
