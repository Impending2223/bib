- add:
    entry:
      id: cal.1966-08-03.china-leadership-5
      when: Aug. 3
      date: '1966-08-03'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, answering Liu Zhijians request on whether to withdraw the work groups from the armys colleges: take it up at todays afternoon meeting of the Center; it must be reported to the Chairman.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 3, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Zhijian.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-08-04.china-leadership-3
      when: Aug. 4
      date: '1966-08-04'
      thread: china-leadership
      c: 'Zhou Enlai attends the Cultural Revolution Groups meeting and then the enlarged Standing Committee meeting, at which Mao sharply condemns sending the work groups: a question of direction, of line, a line error against Marxism, standing on the bourgeois side against the proletariat, suppression and terror that came from the Center.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 4, 1966). Made public: 2020. See [[cal.1966-08-04.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-08-04.china-leadership-4
      when: Aug. 4
      date: '1966-08-04'
      thread: china-leadership
      c: Zhou Enlai speaks that evening at the Tsinghua all-staff-and-student debate meeting, Li Xuefeng presiding. He comes as a Center worker to learn and to support carrying the Cultural Revolution through; Mao and the Standing Committee had him look into it at Tsinghua. He criticizes the work groups "errors" and clears Kuai Dafu; most of the group are old revolutionaries meeting new problems. Forming associations of workers, poor peasants and cadres children in the schools is wrong; unite 90 percent of the masses and 95 percent of the cadres.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44–45 (Aug. 4, 1966). To check: the speech as circulated at Tsinghua. Names: Zhou Enlai, Li Xuefeng, Kuai Dafu.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-08-05.china-leadership-5
      when: Aug. 5
      date: '1966-08-05'
      thread: china-leadership
      c: Zhou Enlai, after a meeting at Maos, telephones Liu Shaoqi and advises him not to appear in public for now and not to receive foreign guests (Liu had that day received a delegation under Zambias Minister of Commerce and Industry, Chimba).
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 5, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-08-05.china-leadership-6
      when: Aug. 5
      date: '1966-08-05'
      thread: china-leadership
      c: Zhou Enlai calls He Long, Nie Rongzhen, Chen Yi, Xu Xiangqian, Ye Jianying, Yang Chengwu and Liu Zhijian. The next day he calls some other heads of the armed forces.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 5, 1966, the item after). Made public: 2020. Names: Zhou Enlai, He Long, Nie Rongzhen, Chen Yi, Xu Xiangqian, Ye Jianying, Yang Chengwu, Liu Zhijian.'
      tags:
      - name:zhou-enlai
