- add:
    entry:
      id: cal.1966-12-28.china-leadership-3
      when: Dec. 28
      date: '1966-12-28'
      thread: china-leadership
      c: 'Zhou Enlai has his secretary telephone Deng Zihui: he may plead illness and stay away from todays criticism meeting of the farm branch.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 28, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Deng Zihui.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-12-29.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 29, 1966; Zhou at Maos meeting, where Mao criticizes Jiang Qing for charging Tao Zhu with error of direction and line without discussion by the Center)'
- add:
    entry:
      id: cal.1966-12-30.china-leadership-2
      when: Dec. 30
      date: '1966-12-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the State Economic Commission rebels plan to go to Canton and seize Bo Yibo and bring him to Peking, wires Guangdong: the Military Region is to send troops and escort Bo by train on the three rules used for Peng Dehuai. Next day he tells the General Staffs Operations Department that the Region is to watch the route and prevent accident.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 30, 1966). Made public: 2020. Names: Zhou Enlai, Bo Yibo, Peng Dehuai.'
      tags:
      - name:zhou-enlai
      - name:bo-yibo
      - name:peng-dehuai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-31.china-leadership-2
      when: Dec. 31
      date: '1966-12-31'
      thread: china-leadership
      c: 'Zhou Enlai talks with Kuai Dafu and other Tsinghua rebel leaders. Mao does not agree to Wang Guangmei going back to Tsinghua to make self-criticism; give him an outline of the questions and she will answer. To a claim that Liu Shaoqis case is one between enemy and us: "I do not see it so; do not impose your view on me." Do not post "Down with Liu Shaoqi" at Tiananmen.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 31, 1966). Made public: 2020. Names: Zhou Enlai, Kuai Dafu, Wang Guangmei, Liu Shaoqi, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12.china-leadership
      when: Dec.
      date: 1966-12
      thread: china-leadership
      c: 'Zhou Enlai telephones Peking Hospital himself on the hospital rebels refusal to let Pu Yi be treated in a ward for senior cadres: allow it, and give active treatment and nursing.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 1966). Made public: 2020. Names: Zhou Enlai, Pu Yi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12.china-leadership-2
      when: Dec.
      date: 1966-12
      thread: china-leadership
      c: By Zhou Enlais desk calendar, from the start of the Red Guard movement to the end of 1966 he received delegates of Red Guards and mass organizations from Peking and all over the country more than 160 times.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 ("下半年", 1966). Made public: 2020. Check: the span; the chronology says the second half of the year, by his desk calendar. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-01.china-leadership-2
      when: Jan. 1
      date: '1967-01-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai telephones Chen Pixian in Shanghai before dawn: the Center has decided he is to come out and work; Shanghai must not fall into disorder, and the north–south railway must not be cut.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967). Made public: 2020. Names: Zhou Enlai, Chen Pixian.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-01.china-leadership-3
      when: Jan. 1
      date: '1967-01-01'
      thread: china-leadership
      c: 'Zhou Enlai, on Beijing Iron and Steel Institute students hunger strike demanding Lü Dong be dismissed, tells Li Fuchun: persuade the students to stop; the dismissal cannot be forced on the Center; Lü Dongs case is for the Center to examine and settle.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Lü Dong.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-01-01.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 1, 1967; the *Renmin ribao*–*Hongqi* New Year editorial, "Carry the Great Proletarian Cultural Revolution Through to the End", reviewed by Mao: 1967 is to be the year of a general attack on the power-holders on the capitalist road)'
- add:
    entry:
      id: cal.1967-01-02.china-leadership-2
      when: Jan. 2
      date: '1967-01-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, before dawn, calls delegates in Peking of over twenty railway units and tells them the railways must never be paralyzed, not for a moment: a break hurts production, the Cultural Revolution, the Third Five-Year Plan and the peoples livelihood. The national railway rebel liaison station should form a liaison committee quickly to keep the lines open.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 2, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-01-02.china-leadership-3
      when: Jan. 2
      date: '1967-01-02'
      thread: china-leadership
      c: Zhou Enlai chairs the Centers liaison meeting on East China and on the military training of college and middle-school students; Jiang Qing, Zhang Chunqiao, Wang Li and Yao Wenyuan also attend. From now the main members of the Cultural Revolution Group take part in the Centers liaison meetings.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Zhang Chunqiao, Wang Li, Yao Wenyuan.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-02.china-leadership-4
      when: Jan. 2
      date: '1967-01-02'
      thread: china-leadership
      c: Zhou Enlai tells Liao Chengzhi through his secretary not to attend the criticism meeting of Fang Fang that morning.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104 (Jan. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liao Chengzhi, Fang Fang.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-03.china-leadership
      when: Jan. 3
      date: '1967-01-03'
      thread: china-leadership
      c: 'Zhou Enlai, at the pledge meeting of returned overseas Chinese in Peking for a new victory in the Cultural Revolution of overseas Chinese affairs, says the Red Guards should foster three spirits, the revolutionary, the scientific and organization and discipline: learn the PLAs discipline, the Three Main Rules and Eight Points, and the "three-eight style".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 104–105 (Jan. 3, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-01-03.china-leadership-2
      when: Jan. 3
      date: '1967-01-03'
      thread: china-leadership
      c: Zhou Enlai has his secretary tell Xiao Hua and Liu Zhijian to attend that afternoons meeting of the Cultural Revolution Group and to speak of the Jan. 5 meeting of 35 army academies to criticize the bourgeois reactionary line.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 3, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Xiao Hua, Liu Zhijian.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-03.china-leadership-3
      when: Jan. 3–4
      date: '1967-01-03'
      thread: china-leadership
      c: Zhou Enlai talks three times with rebel delegates of army academies and arts units, to persuade them to cancel the Jan. 5 meeting "to criticize the bourgeois reactionary line", aimed at Ye Jianying and Chen Yi. To aim the criticism of the armys bourgeois reactionary line at the two Vice-Chairmen is a wrong direction; to take Ye and Chen as its representatives is false to fact; the meeting cannot be held. The rebels agree to put it off.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 3, 4, 1967). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-04.china-leadership-2
      when: Jan. 4
      date: '1967-01-04'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai confers with Tao Zhu on what the Politburo meeting is to settle. Meanwhile Chen Boda, Kang Sheng and Jiang Qing receive the "Corps to Canton to seize Wang Renzhong" of the Central-South Bureau and charge that Tao Zhu is "a faithful executor of the Liu–Deng bourgeois reactionary line", "Chinas biggest royalist" and "the backstage boss of the Central-South Bureau". Slogans "Down with Tao Zhu" and "Drag out Tao Zhu" appear everywhere.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Jiang Qing, Wang Renzhong.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-01-04.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967; Zhou at Maos: asked about Jiang Qings charge that Tao "suppressed the masses", he reports how Tao received the Canton corps on Dec. 30, 1966: not suppression)'
- add:
    entry:
      id: cal.1967-01-04.china-leadership-3
      when: Jan. 4
      date: '1967-01-04'
      thread: china-leadership
      c: 'Zhou Enlai has his secretary tell Kuai Dafu to convey Maos view to the "Corps to Canton to seize Wang Renzhong": do not bring Wang to Peking; let him make his self-criticism at Wuhan.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Kuai Dafu, Wang Renzhong, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-04.china-leadership-4
      when: Jan. 4
      date: '1967-01-04'
      thread: china-leadership
      c: Zhou Enlai talks with Zhou Rongxin, whom Jiang Qing named in criticism.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 4, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-04.china-leadership-5
      when: Jan. 4
      date: '1967-01-04'
      thread: china-leadership
      c: Zhou Enlai talks with Liu Jiandong, Fu Chongbi and Zheng Weishan on Pekings reception work and on the garrisons custody of cadres "struck down", and asks them for lists.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105–106 (Jan. 4, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liu Jiandong, Fu Chongbi, Zheng Weishan.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-05.china-leadership
      when: Jan. 5
      date: '1967-01-05'
      thread: china-leadership
      c: 'Zhou Enlai talks before dawn with Tao Zhu and tells him to stay at home and rest for some days. Then he talks twice with the rebels massed at Zhongnanhais west gate to seize Tao, urging them home: Taos case is for Mao and the Center to discuss. Jan. 7, receiving the "Liaison Station to Criticize Tao Zhu": a Standing Committee member; a meeting to criticize him now is not fit, for the Standing Committee has not discussed it. Jan. 23, before Jiang Qing and Chen Boda, to delegates of the capitals students: the Eleventh Plenum elected Tao, and he has no ground to distrust him.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 5, 7, 23, 1967). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Jiang Qing, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:jiang-qing
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-05.china-leadership-2
      when: Jan. 5
      date: '1967-01-05'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with Chen Yi. On Foreign Ministry rebels "bombardment" of its political department and their demand to dismiss Fu Hao, Xi Yi and Wang Luming and hold a criticism meeting: the Centers spirit is to dismiss no one lightly, and let those who erred keep on in the movement under test; dismissal harms normal work; the Ministrys Party committee is to tell the rebels that Zhou and Chen Yi will not attend the meeting.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 5, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi, Fu Hao, Wang Luming.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-05.china-leadership-3
      when: Jan. 5
      date: '1967-01-05'
      thread: china-leadership
      c: 'Xinhua asks how to issue its piece on Chen Yis reception of a foreign guest. Zhou Enlai: "Vice-Premier Chen has no problem; issue it."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 5, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-06.china-leadership-3
      when: Jan. 6
      date: '1967-01-06'
      thread: china-leadership
      also:
      - china
      c: Shanghai rebels under Wang Hongwen, planned by Zhang Chunqiao and Yao Wenyuan, seize power from the Shanghai Party committee and municipal peoples council. After it a storm of seizing power rises across the country, from the Centers ministries to local Party and government offices and every trade; the anarchism of "overthrow all" floods, and society falls into unprecedented chaos.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 6, 1967). Made public: 2020. Names: Zhou Enlai, Wang Hongwen, Zhang Chunqiao, Yao Wenyuan.'
      tags:
      - name:zhou-enlai
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-06.china-leadership-4
      when: Jan. 6
      date: '1967-01-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, told that Tsinghuas "Jinggangshan" Red Guards under Kuai Dafu have tricked Wang Guangmei out of Zhongnanhai, sends his secretary Sun Yue to Tsinghua to get her back and telephones Kuai to release her. Jan. 7, receiving rebels of the Seventh Ministry of Machine Building, he calls the trick "not open and above-board, a ghost behind the back; the style is not to be encouraged"; it is no longer seizure but cheating into struggle, not what Communists do.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106–107 (Jan. 6, 7, 1967). Made public: 2020. Names: Zhou Enlai, Wang Guangmei, Kuai Dafu, Sun Yue.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-06.china-leadership-5
      when: Jan. 6
      date: '1967-01-06'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on a report that rebels of army academies in Peking and Red Guards of Tsinghua and other colleges have formed a "liaison committee to thoroughly overthrow the anti-Party He Long clique" and plan next day a meeting to criticize and parade He Long: "do not stir it; I will deal with it."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai, He Long.'
      tags:
      - name:zhou-enlai
      - name:he-long
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-06.china-leadership-6
      when: Jan. 6–7
      date: '1967-01-06'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks three times by telephone with Jiang Weiqing on the armed clashes of two factions at Nanjing and the stopped traffic, and proposes remedies. He twice receives the Nanjing University Red Guards corps to Peking: transport is the most pressing, Shanghais coal is short too; first restore traffic, which worries him most; those who start the fighting between the sides are to be tried at law.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 6, 7, 1967). Made public: 2020. Names: Zhou Enlai, Jiang Weiqing.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-07.china-leadership
      when: Jan. 7
      date: '1967-01-07'
      thread: china-leadership
      c: 'Zhou Enlai talks with both factions of the Peking Institute of Civil Engineering, who plan a joint action to Zhongnanhai to seize Liu Shaoqi: they may send posters but not seize, for the Partys and states standing.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-07.china-leadership-2
      when: Jan. 7
      date: '1967-01-07'
      thread: china-leadership
      c: 'Jiang Qing writes on a paper to Zhou Enlai: the masses want to struggle against Zhou Rongxin and Tong Xiaopeng, who should come when called. Jan. 9 Zhou notes to Wang Li: the two must examine themselves deeply, but say "come when criticized", not "come when called", or he will not be able to find them to ask or work.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Zhou Rongxin, Tong Xiaopeng, Wang Li.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-07.china-leadership-3
      when: Jan. 7–8
      date: '1967-01-07'
      thread: china-leadership
      c: 'Zhou Enlai, till the morning of the 8th, receives the two factions of the Seventh Ministry of Machine Building and warns them to beware of sliding into confusing the two kinds of contradiction. No fighting, and restore normal order; open-door rectification; seize no men, not Tan Zhenlin or Li Fuchun or other vice-premiers, nor Liu Shaoqi and Deng Xiaoping, nor Tao Zhu: "if all those around Chairman Mao are seized, how is the Party Center to be guarded? Liu, Deng and Tao are Standing Committee members and I must still protect them"; hold a work meeting; military training for discipline.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107 (Jan. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin, Li Fuchun, Liu Shaoqi, Deng Xiaoping, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:tan-zhenlin
      - name:li-fuchun
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-08.china-leadership-2
      when: Jan. 8
      date: '1967-01-08'
      thread: china-leadership
      c: Zhou Enlai, before dawn, told that rebels are storming the gates of Zhongnanhai to seize Liu Shaoqi, Deng Xiaoping, Tao Zhu and other Center leaders, calls them to the Great Hall of the People and urges them not to. The Party Center does not agree; those they want to seize, Tan Zhenlin, Chen Yi, Li Fuchun, Li Xiannian, Yu Qiuli, are on the first line of Party and government, by Maos side doing real work, and the days great matters need them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 107–108 (Jan. 8, 1967). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Tao Zhu, Tan Zhenlin, Chen Yi, Li Fuchun, Li Xiannian, Yu Qiuli.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:tao-zhu
      - name:tan-zhenlin
      - name:chen-yi
      - name:li-fuchun
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-08.china-leadership-3
      when: Jan. 8
      date: '1967-01-08'
      thread: china-leadership
      c: 'Zhou Enlai speaks at the national petroleum systems meeting to criticize the bourgeois reactionary line. On the paralysis of Daqings leadership, the struggle against the "Iron Man" Wang Jinxi, and the loss of command in the field: Wang was right to oppose workers leaving the field and giving up production. Why should some insist on opposing Daqing and downing Wang? A plot, to destroy the model Mao set up. When rebels shout "Down with Liu Shaoqi, Down with Deng Xiaoping" he turns his back in protest: at the Eleventh Plenum the two were still Standing Committee members; criticism may be back to back, not by seizure.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 108 (Jan. 8, 1967, the item after). Names: Zhou Enlai, Wang Jinxi, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - polity:prc
- add:
    entry:
      id: cal.1967-01-09.china-leadership
      when: Jan. 9
      date: '1967-01-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, told that Red Guards have moved into He Longs house to struggle him, talks with He, who lives with him at the Xihuating: "do not go home; I will stand in front." He telephones the house to tell the Red Guards to move out: "if there is anything, tell me." In the evening he receives the Red Guards of the Peking Physical Culture Institute at the Great Hall.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 108 (Jan. 9, 1967). Made public: 2020. Names: Zhou Enlai, He Long.'
      tags:
      - name:zhou-enlai
      - name:he-long
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-09.china-leadership-2
      when: Jan. 9
      date: '1967-01-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates of the public security, procuratorial and court systems who came to Peking to link up: the mass bodies formed in these organs are to be independent and not led by outsiders; linking up in designated places; no giving up or hampering the work of dictatorship and the defence of the people, which is their glorious first task.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 108 (Jan. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-09.china-leadership-3
      when: Jan. 9
      date: '1967-01-09'
      thread: china-leadership
      c: 'Zhou Enlai receives the rebel delegates of the foreign affairs system. Told by some to overthrow Chen Yi: "I oppose it; I cannot accept it. How can it be so arbitrary?" Foreign work is an important branch bearing on the states fate; he proposes forming a liaison general station of the foreign affairs system.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 108–109 (Jan. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-10.china-leadership-2
      when: Jan. 10
      date: '1967-01-10'
      thread: china-leadership
      c: 'Zhou Enlai receives the Railways Ministry liaison station and Pekings train crews: revolution at home is the way to promote production, and going elsewhere only wrecks it. Over 10,000 left Daqing for Peking, and many wells have stopped; "losing production to run after revolution" is false revolution. The railways are to be mobilized from top to bottom to keep transport going; Lü Zhengcao is not to be dragged about but tested in work.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 10, 1967). Made public: 2020. Names: Zhou Enlai, Lü Zhengcao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-10.china-leadership-3
      when: Jan. 10
      date: '1967-01-10'
      thread: china-leadership
      c: 'Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, meets delegates of the Peking "Third Headquarters", the Peking Aeronautics Institute "Red Flag" and other mass organizations: "because of rebelling they do no work; what rebellion is that? I cannot find the man running the railways and must have Li Xiannian grasp it, or do it myself." Since the end of last year he has meant to bring the railway systems delegates into one general liaison station, and it has not been done; Lü Zhengcao is to do it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Li Xiannian, Lü Zhengcao.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-01-11.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 11, 1967; Zhou at the Politburo meeting: on the big-character posters on He Long, Mao says the Politburo and Standing Committee are not to name him in public but have him call to hear criticism; the Red Guards not to seize him; the meeting passes five papers, the Notice against economism and the congratulation to Shanghais rebel bodies among them)'
- check:
    id: cal.1967-01-11.china-leadership-2
    text: 'Check: Zhous chronology says Lin Biao presided, at Maos proposal; this entry has Zhou presiding.'
- cite:
    id: cal.1967-01-11.china-leadership-3
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109 (Jan. 11, 1967; the Military Commissions notice reorganizing the All-Army Cultural Revolution Group: Xu Xiangqian head, Jiang Qing adviser, Xiao Hua, Yang Chengwu and others deputies)'
- add:
    entry:
      id: cal.1967-01-12.china-leadership-2
      when: Jan. 12
      date: '1967-01-12'
      thread: china-leadership
      c: 'Zhou Enlai tells the staff receiving visitors in Peking to tell the Red Guards and masses plainly that leading cadres are not to be seized: seizing stops their work; cadres who erred should be tried in their work and given a chance to correct.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 109–110 (Jan. 12, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-12.china-leadership-3
      when: Jan. 12
      date: '1967-01-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, after days of talks with Kunming Military Region officers and Kunming rebels about rebels breaking into the Regions compound, learns that they will withdraw and has a telegram sent in the Centers and State Councils name to the Kunming rebels united command, for workers, peasants and students: leave the compound.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 12, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-12.china-leadership-4
      when: Jan. 12
      date: '1967-01-12'
      thread: china-leadership
      c: At Jiang Qings instigation, rebels of Zhongnanhai storm the homes of Liu Shaoqi, Deng Xiaoping and Tao Zhu, and seize and surround them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967, the item after; "十二日"). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Liu Shaoqi, Deng Xiaoping, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-13.china-leadership-2
      when: Jan. 13
      date: '1967-01-13'
      thread: china-leadership
      c: 'Zhou Enlai talks with Chemical Industry Ministry people who seized secret papers of the Defense Ministry: the papers were taken, and he must take it up.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 13, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-13.china-leadership-3
      when: Jan. 13
      date: '1967-01-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai attends the Politburo meeting, which adopts the Several Provisions on Strengthening Public Security Work in the Cultural Revolution (the "six public security articles"), issued the same day: real counter-revolutionaries who kill, burn, cause traffic accidents, storm prisons, steal state secrets or slander Mao and Lin Biao to be punished by law; revolutionary masses and Leftists protected; landlords, rich peasants, bad elements and rightists not to link up or enter revolutionary organizations.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 13, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-01-13.china-leadership-4
      when: Jan. 13
      date: '1967-01-13'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of the 1965 college graduates: those assigned to mines, enterprises and institutions are not to leave their posts for their old schools, nor link up in other factories and villages, but learn from workers and peasants in their units.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-14.china-leadership-2
      when: Jan. 14
      date: '1967-01-14'
      thread: china-leadership
      c: 'Zhou Enlai talks with the regional heads and provincial secretaries: some of our leading cadres cannot keep up, resist in thought, even oppose; a new high tide is starting and they must prepare in spirit and get through this pass.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110 (Jan. 14, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-14.china-leadership-3
      when: Jan. 14
      date: '1967-01-14'
      thread: china-leadership
      c: 'Zhou Enlai receives rebels from Anhui and the National Womens Federation: the Cultural Revolution is spreading to factories and villages; those at production posts should grasp revolution and promote production in their units, organized by system and post. The Center does not approve national organizations; the "National Federation of Transferred, Demobilized, Honored and Disabled Servicemen" is not recognized.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 110–111 (Jan. 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-14.china-leadership-4
      when: Jan. 14
      date: '1967-01-14'
      thread: china-leadership
      also:
      - china
      c: 'With Zhou Enlais support and after a fight by Ye Jianying and other marshals, the Center issues the Notice that the Spearhead of Struggle Must Not Be Pointed at the Army: the army has the task of war preparation and defence, and no one or body may storm the PLA.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 14, 1967, the item after). Made public: 2020. To check: the notice, as issued. Names: Zhou Enlai, Ye Jianying.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-15.china-leadership
      when: Jan. 15
      date: '1967-01-15'
      thread: china-leadership
      c: 'Zhou Enlai speaks at the meeting called in Peking by over 150 units to grasp revolution and promote production: each unit, factory and school to rely on itself, organize its strength and do its work well.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 15, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-01-15.china-leadership-2
      when: Jan. 15
      date: '1967-01-15'
      thread: china-leadership
      c: Zhou Enlai, learning that the United Front Work Departments files were seized, has the Public Security Ministry and the Centers General Office, in his and Li Fuchuns name, confer with the rebels who seized them and the masses who guarded them, and seal the files for the time.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 15, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-16.china-leadership-2
      when: Jan. 16
      date: '1967-01-16'
      thread: china-leadership
      c: 'Zhou Enlai receives the national petroleum system workers rebel liaison station and delegates of the Peking Petroleum Institute. Seizing power is complicated, and in most units it is not yet prepared; they may seize leadership of the Cultural Revolution, but over production supervise only; they may form a united committee to hold the systems Cultural Revolution. The Daqing red flag must not fall. He tells Kang Shien: production is yours to run, and its tasks must not fail.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967). Made public: 2020. Names: Zhou Enlai, Kang Shien.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-01-16.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967; Zhou at the Centers liaison meeting where Mao says it is good that Left masses rise to seize power: take over, run affairs only, not the work)'
- add:
    entry:
      id: cal.1967-01-16.china-leadership-3
      when: Jan. 16
      date: '1967-01-16'
      thread: china-leadership
      c: 'Zhou Enlai telephones Wang Guangmei: be able to stand the test.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 16, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wang Guangmei.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-17.china-leadership-3
      when: Jan. 17
      date: '1967-01-17'
      thread: china-leadership
      c: Zhou Enlai receives the rebel delegates of the State Science Commission. Some advanced tasks are to be done; their struggle-criticism-reform to follow in three months. Liu Shaoqi and Deng Xiaoping, Standing Committee members, are not named in the press; do not pull them into your meetings, or the leaders will not attend.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 17, 1967). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-18.china-leadership
      when: Jan. 18
      date: '1967-01-18'
      thread: china-leadership
      c: Zhou Enlai, at the forum on the Cultural Revolution of "Left" students and cadres, says that seizing power is to seize the leadership of the Cultural Revolution.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111–112 (Jan. 18, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-18.china-leadership-2
      when: Jan. 18
      date: '1967-01-18'
      thread: china-leadership
      c: Zhou Enlai tells the national finance-and-trade systems meeting that rebel and revolutionary bodies everywhere should organize by industry and system, so as to grasp revolution and promote production; finance and trade, petroleum, industry and transport, railways, foreign affairs, defence industry, politics and law and research are all to form them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 18, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-01-18.china-leadership-3
      when: Jan. 18
      date: '1967-01-18'
      thread: china-leadership
      c: 'Zhou Enlai receives rebels of the Academy of Sciences who charge that the liaison men he sent are "mud-mixers": look to the main direction, not to want no fault; the liaison men have worked hard and he thinks the estimate unfair.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-18.china-leadership-4
      when: Jan. 18
      date: '1967-01-18'
      thread: china-leadership
      c: 'Zhou Enlai has his secretary tell Liu Jie: do not admit to being anti-Party or anti-socialist.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liu Jie.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-01-19.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 19, 1967; Zhou and Li Fuchun with He Long: Lin Biao says He spread talk that Lin has a bad history and does not propagate Mao Thought; Mao and Zhou protect him; Zhongnanhai is unsafe, Zhu Des chest was even searched; Zhou will find a quiet place and fetch him back in autumn)'
- add:
    entry:
      id: cal.1967-01-20.china-leadership
      when: Jan. 20
      date: '1967-01-20'
      thread: china-leadership
      c: Zhou Enlai, at dawn, has Yang Dezhong secretly escort He Long and Xue Ming to Xiangbizigou near Xiangshan. Rebels afterward repeatedly clamor to seize He. Feb. 18 and 19 Zhou twice has his secretary tell the State Physical Culture Commission rebels that the Premier does not agree to struggle against He Long, the Centers decision.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 19, 1967, the item after; "次日"). Made public: 2020. Names: Zhou Enlai, He Long, Xue Ming, Yang Dezhong.'
      tags:
      - name:zhou-enlai
      - name:he-long
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-19.china-leadership-3
      when: Jan. 19
      date: '1967-01-19'
      thread: china-leadership
      c: 'Zhou Enlai, seeing Ye Jianyings report on the enlarged Military Commission meeting of the day (Cultural Revolution Group members attending), and that Jiang Qing and Chen Boda mean to hold a mass meeting of 100,000 that night to struggle against Xiao Hua, telephones Ye: without my order Xiao Hua is not to go to make self-criticism at the meeting.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Xiao Hua, Jiang Qing, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - name:jiang-qing
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-19.china-leadership-4
      when: Jan. 19
      date: '1967-01-19'
      thread: china-leadership
      c: Zhou Enlai has the Cultural Revolution Groups working office send reporters to learn how the factions stand in seizing the Peking committees power, and how farm and forestry units stand in seizing theirs.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-20.china-leadership-2
      when: Jan. 20–21
      date: '1967-01-20'
      thread: china-leadership
      c: 'Zhou Enlai talks with the Railways Ministry rebels, the night of the 20th into the 21st: the Ministry is to form a Left alliance or the work will be hard to do; the rebels of the countrys railways must unite to grasp revolution and promote production, and try to send over sixty trains a day in the last ten days of the month.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 20, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01.china-leadership
      when: Jan., early
      date: 1967-01
      thread: china-leadership
      c: Zhou Enlai, told that rebels ransacked Chen Yuns home, sends Tong Xiaopeng to stop it and has Yang Dezhong move Chen Yun from the New Sixth Institute to a safe place.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan., early and mid 1967). Made public: 2020. Names: Zhou Enlai, Chen Yun, Tong Xiaopeng, Yang Dezhong.'
      tags:
      - name:zhou-enlai
      - name:chen-yun
      - polity:prc
      - vis:only:prc
      at: before 1967-01-11
- add:
    entry:
      id: cal.1967-01-21.china-leadership-5
      when: Jan. 21
      date: '1967-01-21'
      thread: china-leadership
      c: 'Zhou Enlai receives the rebel delegates of the Second Ministry of Machine Building, telling its vice-ministers that to seize the leadership of the Cultural Revolution in the ministry is in keeping with the Center, but over production and finance only supervision may be exercised. To the rebels: do not seize and drag about leading cadres.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 21, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-21.china-leadership-6
      when: Jan. 21
      date: '1967-01-21'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of the two factions of the Academy of Sciences: the Centers power is not to be seized.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-01-23.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 21, 23, 1967; Mao to Lin Biao that troops must back the broad Left masses, the earlier "no involvement" being false; the Center, State Council, Military Commission and Cultural Revolution Group issue on the 23rd the decision that the PLA firmly support the revolutionary Left)'
- add:
    entry:
      id: cal.1967-01-22.china-leadership-3
      when: Jan. 22
      date: '1967-01-22'
      thread: china-leadership
      c: Zhou Enlai tells the meeting of mass delegates from other places in Peking that in takeovers there must be a great alliance, against dispersion, each one for himself and anarchism; seizing power is no self-seeking scramble of individuals or small groups; some units, the army and war-preparation offices among them, cannot take the form of mass seizure.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 22, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-01-22.china-leadership-4
      when: Jan. 22
      date: '1967-01-22'
      thread: china-leadership
      c: 'Zhang Linzhi, minister of coal, is hounded to death by rebels. Zhou Enlai, on hearing, says in grief: "A minister dead and no one knows how; how can I answer to the Party Center?" He has the Public Security Ministry report the autopsy and in later talks with mass delegates often speaks of Zhangs death: cadres may not be struggled thus, and old cadres are not to be seen with hostility, for they are the Partys and states treasure.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113 (Jan. 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Linzhi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-23.china-leadership-2
      when: Jan. 23
      date: '1967-01-23'
      thread: china-leadership
      c: 'Zhou Enlai has his secretary tell Zhou Rongxins liaison man: if the Geology Ministry rebels come to seize Zhou Rongxin, answer that he will first make his self-criticism inside the office, and outside after.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 113–114 (Jan. 23, 1967). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-24.china-leadership
      when: Jan. 24
      date: '1967-01-24'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of military academies in Peking and from elsewhere: military organs are not to be stormed, posters may be sent; the staff, political, rear services and communications work of every service cannot stop; do not settle contradictions among the people by the means for enemy contradictions.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (Jan. 24, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-24.china-leadership-2
      when: Jan. 24
      date: '1967-01-24'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on Anhui and Guizhou control-commission rebels wish to seize Qian Ying and take her back to the province for struggle: not now.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (Jan. 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Qian Ying.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-25.china-leadership
      when: Jan. 25
      date: '1967-01-25'
      thread: china-leadership
      c: 'Zhou Enlai receives the finance-and-trade rebels: seize only the leadership of the Cultural Revolution and supervise business; do not cast aside all with "head" in their titles; keep some for work to go smoothly; seizing ministers at will without notice is not what is urged. Mu Xin is not to be set down as a counter-revolutionary revisionist; no material shows Ye Jizhuang tied to the "black gang".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (Jan. 25, 1967). Made public: 2020. Names: Zhou Enlai, Mu Xin, Ye Jizhuang.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-25.china-leadership-2
      when: Jan. 25
      date: '1967-01-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai tells Wu Faxian through his secretary: at once draft, in the State Councils and Military Commissions names, an order announcing that the army takes over civil aviation, with all airfields and ports; operations stay with the old leaders. The State Council and Military Commission issue it Jan. 26.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114 (Jan. 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wu Faxian.'
      tags:
      - name:zhou-enlai
      - name:wu-faxian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-25.china-leadership-3
      when: Jan. 25
      date: '1967-01-25'
      thread: china-leadership
      c: Zhou Enlai speaks at the Peking science and technology circles meeting "to smash the bourgeois reactionary lines new counter-attack". Seizing power must be serious, not left to drift, and anarchy is not allowed; see two sides of cadres who erred; "doubt everything, overthrow everything" is anarchism, not Mao Zedong Thought; revolutionary character must join scientific character; that one has made revolution is no license to do as one pleases.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 114–115 (Jan. 25, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-01-26.china-leadership-2
      when: Jan. 26
      date: '1967-01-26'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai has his secretary ask the liaison man whether Wang Enmao was taken back last night.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 26, 1967). Made public: 2020. Names: Zhou Enlai, Wang Enmao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-26.china-leadership-3
      when: Jan. 26
      date: '1967-01-26'
      thread: china-leadership
      c: 'Zhou Enlai receives the rebel delegates of the industry-and-transport branches. Seizing power presupposes the Partys leadership, and is first of the leadership of the Cultural Revolution; not every power-holder is a bourgeois power-holder; distinguish. Yu Qiuli rose from "little red devil", started hard at Daqing and has done well in planning at the small Planning Commission; his problems are among the people, the Center needs him, Mao has said several times to protect him. While Yu was struggled, Zhou sent a liaison man each time to agree three rules with the rebels beforehand: two hours at most, then release; no corporal punishment; no seizing him away.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yu Qiuli.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-27.china-leadership-2
      when: Jan. 27
      date: '1967-01-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Xinjiang rebels before dawn and warns them: the Cultural Revolution in the Xinjiang Military Region has stopped, by the Centers decision; they are not to kick aside the regional committee and the Regions leaders. The same day he criticizes the Tianjin rebels for kidnapping the municipal leaders.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 27, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-27.china-leadership-3
      when: Jan. 27
      date: '1967-01-27'
      thread: china-leadership
      c: Zhou Enlai talks with Li Xiannian on railway problems.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 27, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-28.china-leadership-2
      when: Jan. 28
      date: '1967-01-28'
      thread: china-leadership
      c: Zhou Enlai chairs, before dawn, the meeting of Standing Committee members and the Cultural Revolution Group on the draft of the Military Commissions "eight articles".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 28, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-01-28.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 28, 1967; Zhou at Maos in the afternoon, then with Xu Xiangqian, Nie Rongzhen and Ye Jianying revising the "eight articles", striking the sentence "resist Right attack from now, welcome Left attack"; the Military Commission issues the eight orders the same day: firm support for the true proletarian revolutionaries, posts held, the two kinds of contradiction kept apart, no free arrest or house-search, no storming of military leading organs, no linking up, army-level organs to take the Cultural Revolution by stages)'
- add:
    entry:
      id: cal.1967-01-28.china-leadership-3
      when: Jan. 28
      date: '1967-01-28'
      thread: china-leadership
      c: 'Zhou Enlai receives the railway system rebels and requires the Railways Ministry rebels to form at once a business group: choose it now, keep a duty man, and keep work from breaking off, for he must have someone at every minute on the telephone. Rail transport cannot stop an hour; the whole before the part.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 115 (Jan. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-28.china-leadership-4
      when: Jan. 28
      date: '1967-01-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Zhejiang rebel delegates and tells those who broke into the provincial military district to leave at once. To say everything is the Liu–Deng line is not scientific; not all in power take the capitalist road. Five suggestions on seizing power: rouse the masses from below and unite; rebels at the core, uniting the majority; ones own units rebels first, others to help; seize the leadership of the Cultural Revolution and supervise production; province, prefecture, county, seized from the top down. The Zhejiang committees work was good before the Revolution; Jiang Hua is an old comrade of the Jinggang Mountains and a minority man, whom Mao says to protect. After the Spring Festival he will propose that middle schools open: mathematics, physics and chemistry can be taught, with college students as teachers.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 116 (Jan. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Hua, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-28.china-leadership-5
      when: Jan. 28
      date: '1967-01-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the attack of rebels on troops the Heilongjiang Military District sent to Yichun to take over public security, posts and forestry, writes the General Staff: two regiments are to go, with Red Guards to do propaganda; reactionary ringleaders, once exposed or isolated, are to be arrested; if they fire on arrest or hit the PLA, fire back where necessary; ordinarily fire into the air, warn and order arms handed in.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 116 (Jan. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-29.china-leadership
      when: Jan. 29
      date: '1967-01-29'
      thread: china-leadership
      c: 'Zhou Enlai receives, before dawn, the rebels of the Peking Military Regions Zhanyou Song and Dance Troupe: putting tall hats on people, kneeling, tearing off insignia, parading and house-searching are bad and a slur on the PLA. Hearing that they will no longer sing Xiao Huas *Long March Suite* he says: "because a man made a mistake, you will not even sing his songs? Sing it; I will sing it myself. Xiao Huas is a contradiction among the people; he was once a little red devil."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 116–117 (Jan. 29, 1967). Made public: 2020. Names: Zhou Enlai, Xiao Hua.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-29.china-leadership-2
      when: Jan. 29
      date: '1967-01-29'
      thread: china-leadership
      c: 'Zhou Enlai receives, before dawn, delegates of the Wuhan "Command to Struggle Against Wang Renzhong" who came to Peking: let Tao Zhu stay in Zhongnanhai and struggle against him back to back; the Center does not agree to face-to-face struggle by seizing him.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Wang Renzhong.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-29.china-leadership-3
      when: Jan. 29
      date: '1967-01-29'
      thread: china-leadership
      c: 'Zhou Enlai has his secretary tell the head of the Ninth Academy rebels of the Second Ministry of Machine Building that Liu Xiyao may not be held: the Academy of Sciences affairs are his to settle.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Liu Xiyao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-30.china-leadership-3
      when: Jan. 30
      date: '1967-01-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai drafts the decision of the Center, State Council and Military Commission on the recent events in Zhejiang: the masses of the "Zhejiang Revolutionary Rebel United Headquarters" who broke into the provincial military district are quickly and of themselves to leave the compound.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 30, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-30.china-leadership-4
      when: Jan. 30
      date: '1967-01-30'
      thread: china-leadership
      c: Zhou Enlai, told that Gu Mu, just back from inquiring into the Third Front, was kidnapped by Construction Commission rebels, sends a liaison man to the commissions rebels to demand his return to Zhongnanhai, "the Premier wants Gu Mus report".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-31.china-leadership-3
      when: Jan. 31
      date: '1967-01-31'
      thread: china-leadership
      c: 'Zhou Enlai receives rebels of the North China Bureau: the power of the Bureaus secretariat is not to be seized; the Bureau is an organ sent out by the Center, and seizing its power is seizing the Centers. Li Xuefeng is at work on Tianjin and not for now to return to make his self-criticism.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 31, 1967). Made public: 2020. Names: Zhou Enlai, Li Xuefeng.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-31.china-leadership-4
      when: Jan. 31
      date: '1967-01-31'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of army academies, arts troupes, hospitals and military factories and explains the "eight orders": the army differs from civilian places and cannot take leave to make revolution as schools do; like factories and transport the armys work cannot stop; the Cultural Revolution only in spare time; military organs and war-preparation systems not to be stormed; the army must keep firmly steady.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 31, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-31.china-leadership-5
      when: Jan. 31
      date: '1967-01-31'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of staff of organs from all over the country, and criticizes Peking rebels who seize leaders of the Center, the State Councils ministries and the provincial committees without notice: notice must be given beforehand, or an accident may follow, and no small one but one touching the Partys, the states and the peoples fate. He warns staff of the Centers General Office, Guard Bureau, Secretariat and State Councils Secretariat: "I fear a knife from inside, a stab in the back, when we have no guard."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 117 (Jan. 31, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-01-31.china-leadership-6
      when: Jan. 31
      date: '1967-01-31'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews and revises the telegram of the Center, State Council and Military Commission to the Xinjiang regional committee, the Xinjiang Military Region and the regional "Revolutionary Power-Seizing Command": stop at once all armed clashes among the people; no one and no mass body may storm or seize power in the Regions leading offices, nor the Regions armed, cipher and troop units and the Production and Construction Corps.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Jan. 31, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01-31.china-leadership-7
      when: Jan. 31
      date: '1967-01-31'
      thread: china-leadership
      c: Zhou Enlai agrees, on Ye Jianyings proposal, to bring Qin Jiwei to Peking for treatment of illness.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Jan. 31, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Qin Jiwei.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-01.china-leadership-2
      when: Jan.
      date: 1967-01
      thread: china-leadership
      c: By Zhou Enlais desk calendar, besides central meetings and major events, in January he talked on all kinds of questions with central, local and army leaders 88 times, and received delegates of Red Guards, rebels and masses 114 times.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Jan. 1967, the last item). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-01.china-leadership-2
      when: Feb. 1
      date: '1967-02-01'
      thread: china-leadership
      c: 'Zhou Enlai tells the army reception staff brought in: the key problem in seizing power, which the *Hongqi* editorial does not mention, is to seize the "self" in each of our own thoughts and rid it of selfish ideas. Support the youngs warmth and courage and help them in good faith; to see them err and not say so would be our crime.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Feb. 1, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-01.china-leadership-3
      when: Feb. 1
      date: '1967-02-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Railways Ministry rebels and rebukes them: "why can you not unite?" If it goes on he will put the Ministry under military control; he has held seven meetings large and small with them on the main artery not stopping for a moment. Think whether one unit or the whole country is more important, one man or 700 million; seize "self" in your heads. Not all old cadres are to be struck down in a lump.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 118 (Feb. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-01.china-leadership-4
      when: Feb. 1
      date: '1967-02-01'
      thread: china-leadership
      c: 'Zhou Enlai receives the industry-and-transport rebels and criticizes the tall hats and parading as disguised corporal punishment. Not every minister and head of province or city is a power-holder on the capitalist road; if all provinces and cities were "black line", where was Maos "red line" of these years? Gu Mu is not "black gang", he has work at the State Council; do not drag him about. On Daqing, now much confused, with attacks on Yu Qiuli and the Iron Man Wang Jinxi: "I am very worried and wish I could fly there."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119 (Feb. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu, Yu Qiuli, Wang Jinxi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-02.china-leadership-2
      when: Feb. 2
      date: '1967-02-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai convenes the vice-premiers office meeting on the draft Center and State Council notice on revolutionary teachers and students linking up on foot, and sends it after to the Cultural Revolution Group and Mao. The Center and State Council issue it Feb. 3: long-distance linking up on foot is stopped for now; parties already out are to return, in principle on foot, bearing their own city travel and meals; from Feb. 8 board and lodging in Peking is no longer free.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119 (Feb. 2, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-02-02.china-leadership-3
      when: Feb. 2
      date: '1967-02-02'
      thread: china-leadership
      c: 'Zhou Enlai writes Chen Boda, Jiang Qing and the Cultural Revolution Group proposing: (1) from now at 10 p.m. every Monday, Wednesday and Friday a liaison meeting at Diaoyutai, centred on the Cultural Revolution, he attending, on the situation, policy and drafts; the 3rd to take up documents on reopening middle and primary schools and industrial output, the next, farming; (2) Tuesday, Thursday and Saturday at 3:30 p.m. at the Huairen Hall or State Council a meeting of four Standing Committee men (Zhou, Chen, Kang, Li) with vice-premiers (Chen, Li, Tan, Xie) and Ye Jianying, to take up Party and government business, a Group member such as Jiang Qing to come. Feb. 4 Mao writes on the letter: "This paper is not used; return to Zhou."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119 (Feb. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Jiang Qing, Kang Sheng, Li Fuchun, Chen Yi, Li Xiannian, Tan Zhenlin, Xie Fuzhi, Ye Jianying, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:jiang-qing
      - name:kang-sheng
      - name:li-fuchun
      - name:chen-yi
      - name:li-xiannian
      - name:tan-zhenlin
      - name:xie-fuzhi
      - name:ye-jianying
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-02.china-leadership-4
      when: Feb. 2
      date: '1967-02-02'
      thread: china-leadership
      c: 'Zhou Enlai, after long exhaustion, feels unwell and the doctors find heart disease; he tells his secretary to keep it quiet. Next day his staff, worried, write a big-character poster on his office door asking him to change his way of work and rest; Chen Yi, Nie Rongzhen, Li Xiannian, Ye Jianying and others sign it. Feb. 4 Zhou writes on it "Accept sincerely; see in practice", and Deng Yingchao adds five proposals: shorten night work, leave gaps between meetings, leave room in each days schedule, rest on return from meetings, shorter meetings.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 119–120 (Feb. 2–4, 1967). Made public: 2020. Names: Zhou Enlai, Deng Yingchao, Chen Yi, Nie Rongzhen, Li Xiannian, Ye Jianying.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - name:nie-rongzhen
      - name:li-xiannian
      - name:ye-jianying
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-02-03.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 3, 1967; Zhou with Mao at the meeting with Hysni Kapo and Beqir Balluku of Albania)'
- add:
    entry:
      id: cal.1967-02-04.china-leadership
      when: Feb. 4
      date: '1967-02-04'
      thread: china-leadership
      c: Zhou Enlai sends to find the cause of the death of Zhao Erlu, who died after repeated struggle meetings, and presses for the autopsy findings. Feb. 6 he attends the memorial for Zhao and for Yang Zhicheng.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 4, 6, 1967). Made public: 2020. Names: Zhou Enlai, Zhao Erlu, Yang Zhicheng.'
      tags:
      - name:zhou-enlai
      - name:zhao-erlu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-05.china-leadership
      when: Feb. 5
      date: '1967-02-05'
      thread: china-leadership
      c: Zhou Enlai, told that people are making trouble at the Military Commission office at Sanzuomen, aimed at Xu Xiangqian, has Nie Rongzhen, Ye Jianying, Yang Chengwu, Xiao Hua and Fu Chongbi find out what lies behind it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 5, 1967). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Yang Chengwu, Xiao Hua, Fu Chongbi.'
      tags:
      - name:zhou-enlai
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:ye-jianying
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-06.china-leadership-3
      when: Feb. 6
      date: '1967-02-06'
      thread: china-leadership
      c: 'Zhou Enlai writes Mao: some urgent questions, the takeover of the Tianjin and Peking public security bureaus and the seizure of power in some central departments and provinces, need his instruction; he proposes Mao see the four Standing Committee men, Chen Yi, Ye Jianying, Xie Fuzhi and Jiang Qing that afternoon. In the afternoon he goes to Maos.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 6, 1967). Made public: 2020. See [[cal.1967-02-06.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Chen Yi, Ye Jianying, Xie Fuzhi, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:chen-yi
      - name:ye-jianying
      - name:xie-fuzhi
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-06.china-leadership-4
      when: Feb. 6
      date: '1967-02-06'
      thread: china-leadership
      c: Zhou Enlai calls Nie Rongzhen, Chen Yi, Xu Xiangqian, Ye Jianying, Xiao Hua and Yang Chengwu on the army question.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen, Chen Yi, Xu Xiangqian, Ye Jianying, Xiao Hua, Yang Chengwu.'
      tags:
      - name:zhou-enlai
      - name:nie-rongzhen
      - name:chen-yi
      - name:xu-xiangqian
      - name:ye-jianying
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-06.china-leadership-5
      when: Feb. 6
      date: '1967-02-06'
      thread: china-leadership
      c: Zhou Enlai tells Li Xiannian through his secretary that the Finance Ministrys business power cannot be seized.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-02-07.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 120–121 (Feb. 7, 1967; Zhou reviews and revises the Foreign Affairs Office draft instruction on the Cultural Revolution in embassies and consulates, stressing that fighting groups already formed become study groups under the Party committee, with a right to criticize and suggest, none to supervise, and none to meddle directly with the committees authority)'
- add:
    entry:
      id: cal.1967-02-07.china-leadership-3
      when: Feb. 7
      date: '1967-02-07'
      thread: china-leadership
      c: 'Mao writes on a paper to Lin Biao, Zhou Enlai, Ye Jianying, Nie Rongzhen and Xu Xiangqian: some questions are handled too slowly, the Xinjiang question should be settled sooner; some great ones too fast, without the Standing Committees calm discussion, which seems unnecessary.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Ye Jianying, Nie Rongzhen, Xu Xiangqian.'
      tags:
