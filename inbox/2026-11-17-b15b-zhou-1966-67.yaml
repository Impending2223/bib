      c: Zhou Enlai, with Chen Boda, Kang Sheng, Jiang Qing and Yang Chengwu, attends the forum of military-training cadres, who report that Kuai Dafu attacks the PLAs training as "more of a work group than a work group".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yang Chengwu, Kuai Dafu.'
