    entry:
      id: cal.1967-04-04.china-leadership-2
      when: Apr. 4
      date: '1967-04-04'
      thread: china-leadership
      c: Zhou Enlai talks before dawn with the responsible men of the Peking garrison and the 65th Army on military training.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Apr. 3, 1967, the item after; "次日凌晨"). Made public: 2020. Names: Zhou Enlai, Fu Chongbi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-04.china-leadership-3
      when: Apr. 4
      date: '1967-04-04'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, with Xu Xiangqian, Nie Rongzhen, Ye Jianying, Xie Fuzhi, Xiao Hua, Yang Chengwu, Su Yu and Cultural Revolution Group members, talks with the Fuzhou Military Region leaders on Fujian.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 4, 1967). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Xie Fuzhi, Xiao Hua, Yang Chengwu, Su Yu.'
      tags:
      - name:zhou-enlai
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:ye-jianying
      - name:xie-fuzhi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-05.china-leadership
      when: Apr. 5
      date: '1967-04-05'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, answering the Foreign Ministry on students returned from abroad who want to move into the ministry building to "make revolution": the building is not open.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 5, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-06.china-leadership
      when: Apr. 6
      date: '1967-04-06'
      thread: china-leadership
      c: 'Zhou Enlai receives the rebel delegates of the State Planning, Economic and Construction commissions and rebukes their argument that to topple Bo Yibo they must first topple Gu Mu and Yu Qiuli. Told Yu has not yet made his self-criticism: he is unwell, and an ill man cannot write it; Gu Mus and Li Xiannians are with Zhou; give them time to prepare, for they must work. On the economic front, with himself, only five men now carry business: could you be raised up in their place?'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 6, 1967). Made public: 2020. Names: Zhou Enlai, Bo Yibo, Gu Mu, Yu Qiuli, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:bo-yibo
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04-07.china-leadership
      when: Apr. 7
      date: '1967-04-07'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Zhou Enlai holds talks with Premier Phạm Văn Đồng.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
      tags:
      - name:zhou-enlai
      - name:pham-van-dong
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1967-04-09.china-leadership
      when: Apr. 9
      date: '1967-04-09'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Zhou Enlai goes with Phạm Văn Đồng and his party by air to Dazhai and back to Peking the same day.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 9, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
      tags:
      - name:zhou-enlai
      - name:pham-van-dong
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1967-04-10.china-leadership
      when: Apr. 10
      date: '1967-04-10'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Zhou Enlai, in talks with Phạm Văn Đồng: a war always ends; political struggle goes on at all times, and war is its highest form, so there is no war without political struggle. Strengthen international propaganda to win sympathy, weaken and split the enemy and use the contradictions among enemies; this was done and is to be done more.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
      tags:
      - name:zhou-enlai
      - name:pham-van-dong
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1967-04-11.china-leadership-2
      when: Apr. 11
      date: '1967-04-11'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'Zhou Enlai, in talks with Phạm Văn Đồng: for the Vietnam war to win in the end, it must not be given up halfway. Asked whether Stalin advised that the PLA not cross the Yangtze: Stalin doubted that China could cross in 1949 and thought the U.S. would send troops if Chiang failed; but the U.S. knew Chiang could not be propped up and the Yangtze could not stop the PLA; if it sent troops it would bear the guilt of war, and did not. When the PLA took Nanjing, the U.S. ambassador stayed and told a democratic figure that if the Communist government wanted ties with the U.S., he would not leave, the U.S. would recognize it and might give five billion dollars; China paid no heed and the ambassador left.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140 (Apr. 7, 10, 11, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng, Stalin, Chiang Kai-shek.'
      tags:
      - name:zhou-enlai
      - name:pham-van-dong
      - name:stalin
      - name:chiang-kai-shek
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1967-04-07.china-leadership-2
      when: Apr. 7–10
      date: '1967-04-07'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives representatives of Tianjins mass bodies three times, the 7th, 9th and 10th. On the roots of the "anti-Party clique": do not hit a wide circle, be factual; the line toward comrades who erred is to punish the past to warn the future and cure the sickness to save the man. An absolute "criticized, then must fall" is wrong: criticize one, not necessarily fell; if one criticism fells a man, how many must fall?'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 140–141 (Apr. 7, 9, 10, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
