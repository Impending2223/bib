      date: '1966-05-01'
      thread: china-leadership
      c: 'Zhou Enlai, on the program of the State Council offices party: *Three Old Men Watch the Crops* overdraws the peasants backwardness and makes them ugly, an old stage trick; *Cotton-Picking Dance* shows skill but not a harvest, form and content ill joined. An evening is not only amusement; the Culture Ministry should take performances seriously.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 28–29 (May 1, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
