      when: Oct. 20
      date: '1966-10-20'
      thread: china-leadership
      c: Zhou Enlai, after going to Maos, talks with Liu Shaoqi and Deng Xiaoping in the Henan Hall of the Great Hall.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 20, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Mao Zedong.'
