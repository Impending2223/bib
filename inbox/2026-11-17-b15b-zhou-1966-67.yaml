      when: Sept. 26
      date: '1966-09-26'
      thread: china-leadership
      c: 'Zhou Enlai receives all the people of the Red Guards Third Headquarters. Next day he has his secretary write them: his remark of the day before, "what you think correct and true you may hold for a time", was not complete. If debate and practice, by yourselves or others, show you wrong in all or part, admit the error and correct it; if right in all or part, hold to what is right. "This is what Chairman Mao often teaches: hold to truth, correct error."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 68 (Sept. 26, 1966, the item after; "次日"). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
