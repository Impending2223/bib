      when: July 28
      date: '1966-07-28'
      thread: china-leadership
      c: Zhou Enlai receives an Afghan economic delegation under Minister of Agriculture and Irrigation Mir Reza and asks about farming, water and reservoir silting. Afghanistan has good experience of silt control; he tells Fang Yi, director of the Commission for Economic Relations with Foreign Countries, to have the Chinese embassy study the local silting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42 (July 28, 1966). Made public: 2020. Names: Zhou Enlai, Fang Yi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+afghanistan
