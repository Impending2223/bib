      c: 'Zhou Enlai, on a report from the Peking committees general office that 34 Peking middle schools and out-of-town students have formed an "East Is Red Preparatory Committee" which would rename Peking "East Is Red City" and remove the Tiananmen ornamental columns and the two stone lions to set up bronze statues of Mao and heroes, writes to the committee and to Zhou Rongxin: tell them through the liaison station that this is a state matter, of concern abroad; they may care and propose, but not decide or name; a naming without force costs credit.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 68 (Sept. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin.'
