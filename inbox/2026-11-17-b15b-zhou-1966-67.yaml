- add:
    entry:
      id: cal.1967-05-09.china-leadership-2
      when: May 9
      date: '1967-05-09'
      thread: china-leadership
      also:
      - testing
      - china
      c: Zhou Enlai chairs the Central Special Commission to check the preparation of the hydrogen bomb air-burst test. Every link of the test is to be examined again and again for safety and success; health protection along the track of the cloud to be done thoroughly and emergency measures made ready against accident.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 9, 1967). Made public: 2020. Names: Zhou Enlai.'
