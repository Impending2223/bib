- add:
    entry:
      id: cal.1966-12-06.china-leadership-2
      when: Dec. 6
      date: '1966-12-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, told by people from Shanghai of a large-scale armed clash of masses in Shanghai that left several dead, has Tong Xiaopeng send someone to talk with the Shanghai students and report the record to him.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 97–98 (Dec. 6, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tong Xiaopeng.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-07.china-leadership
      when: Dec. 7
      date: '1966-12-07'
      thread: china-leadership
      c: Zhou Enlai receives delegates of the Academy of Sciences units outside Peking. Sweep away ghosts and monsters but not all cadres; not everyone with a fault or a bad habit is one. Scientists of great contribution are to be protected, and ordinary scientists who are not anti-Party or anti-socialist too. The Academy is to centre on research and join teaching and production; not to be an office, but to join theory and production and take up advanced and guiding work.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 98 (Dec. 7, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-08.china-leadership
      when: Dec. 8
      date: '1966-12-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the public security delegates of Peking and from other places. Public security is an organ of dictatorship and must keep its dignity: no one is to storm in at will. He announces that garrison troops will hold the Ministry of Public Security and no one may storm it; its men are to keep discipline, not leave their posts or take leave to make revolution.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 98 (Dec. 8, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-12-09.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 98 (Dec. 9, 1966; Zhou chairs the Politburo liaison meeting at Maos on conveying the spirit of the industry-and-transport symposium; on the Cultural Revolution Groups wish to circulate the Fifteen Articles nationally for open criticism, he says the criticism is not to widen: the regional heads present to speak of it to Standing Committee members at home)'
- add:
    entry:
      id: cal.1966-12-10.china-leadership
      when: Dec. 10
      date: '1966-12-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai calls a symposium of provincial and municipal heads who attended the industry-and-transport symposium or were "seized" and brought to Peking. Prepare for a rising tide: the trend is like ten thousand horses and cannot be stopped, only guided, or one is swept away. Form production teams of those who know production, activists and old workers. Break out of passivity. Three rules toward the Red Guards: welcome their criticism, correcting what is true and heeding what is not; stand with them to study what they want and accept what is reasonable; keep to principle and policy, and sign not everything, never lying on rails and stopping trains.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 98 (Dec. 10, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-11.china-leadership
      when: Dec. 11
      date: '1966-12-11'
      thread: china-leadership
      also:
      - testing
      - space
      c: Zhou Enlai chairs the 17th meeting of the Central Special Commission on the artificial satellite. Dongfeng-3 to be built in 1968; Dongfeng-4 may be tried; an intercontinental missile may also be built; all to be settled within these four years.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 11, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-12.china-leadership
      when: Dec. 12
      date: '1966-12-12'
      thread: china-leadership
      c: 'Zhou Enlai talks with delegates of four mass organizations of the Academy of Sciences: no one thought great democracy would come to this; he never dreamed the movement would come so hard; how high the tide will go will be seen only after it comes.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 12, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-13.china-leadership
      when: Dec. 13
      date: '1966-12-13'
      thread: china-leadership
      c: Zhou Enlai talks with delegates of several Red Guard bodies of the Peking Foreign Languages Institute and orders the Institutes "armed work team", which stormed the Foreign Ministry to seize Chen Yi, to leave within three days, or unarmed garrison troops will go to pull them out.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 13, 1966). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-13.china-leadership-2
      when: Dec. 13
      date: '1966-12-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai chairs the Centers liaison meeting. With rail and ship stopping and posts and telecommunications disturbed everywhere, it drafts a notice of the Center and State Council: no person, body or office is to hinder or stop the running of trains, buses and ships, force a way aboard, or force into the work rooms of post, telecommunications and broadcasting; their staffs must hold their posts. Zhou revises it and sends it to the Cultural Revolution Group with a table of the months train-stopping across the country.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 13, 1966, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-12-14.china-leadership
      when: Dec. 14
      date: '1966-12-14'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks twice with delegates of the Chengdu "Workers Rebel Corps". Think of the whole, not the individual; large industry is linked and one link out of joint touches all; over two thousand have left their posts for Peking though he wired them not to come; think of thirty million workers, the farmers, the army; if workers, peasants and soldiers all came it would be a great affair. Keep the two kinds of contradiction apart; do not club to death every committee head and Southwest Bureau leader who erred.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99 (Dec. 14, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-12-15.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 99–100 (Dec. 13, 15, 1966; Zhous letter of the 13th to Mao on the Instruction on the Cultural Revolution in the Villages, proposing to drop the line that other revolutionary mass organizations may also be set up, since the villages have poor and lower-middle peasant associations, committees, militia and Red Guards; Mao agrees; on the 15th the enlarged Politburo meeting under Lin Biao adopts the draft, Lin charging that phasing the revolution in the villages is the same spirit as work groups; issued the same day)'
- add:
    entry:
      id: cal.1966-12-16.china-leadership-2
      when: Dec. 16
      date: '1966-12-16'
      thread: china-leadership
      c: 'Zhou Enlai tells Liu Jie, through his staff, to stay some days more at Plant 221: besides ensuring the quality of the fifth tests product, he is to look into and work on the plants Cultural Revolution problems.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 100 (Dec. 16, 1966). Made public: 2020. Names: Zhou Enlai, Liu Jie.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
