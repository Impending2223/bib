    entry:
      id: cal.1967-06-03.china-leadership
      when: June 3
      date: '1967-06-03'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, with Military Commission and Cultural Revolution Group heads, talks with the Henan Military Districts He Yunhong and others on Henan. June 13, 14 and 15 he receives the two factions delegates from Henan.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (June 3, 1967). Made public: 2020. Names: Zhou Enlai, He Yunhong.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-04.china-leadership
      when: June 4
      date: '1967-06-04'
      thread: china-leadership
      c: Zhou Enlai tells his secretary to tell the Seventh Ministry of Machine Buildings "Sept. 16" rebel body, which holds the Defense Ministrys building, to leave at once or he will not receive them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (June 4, 1967). Made public: 2020. Check: the day; the chronology gives it under June 3–5. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-04.china-leadership-2
      when: June 4
      date: '1967-06-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, from 10 p.m. to 4 a.m., receives delegates of the defence-industry mass bodies and of the military control committees. The Seventh Ministry "Sept. 16" body set up loudspeakers at the Defense Ministrys gate with "ten thousand guns to fire on Nie Rongzhen": error, an extreme Left leaning, to be admitted. In criticizing leading cadres, leave their working hours; when a task comes, put criticism off; military factories not to be overtired, or accidents follow. The wind of beating is not to grow: unreasonable and brutal, not like proletarian revolutionaries; the control committees are authorized to arrest on the spot those who gang-fight. It is wholly factional struggle and the whole is ignored. The six machine-building ministries are to be put under military control. On "catching renegades": material goes to the Center to be checked, not onto posters in the streets; some is enemy-made frame-up; think of the Partys and states highest interest and do not take those around Mao to be so bad.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (June 4, 1967, the item after). Made public: 2020. Check: the day; the chronology gives it after the June 3 item, "that evening 10 p.m. to 4 a.m." Names: Zhou Enlai, Nie Rongzhen, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:nie-rongzhen
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-05.china-leadership
      when: June 5
      date: '1967-06-05'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai calls an enlarged liaison meeting of the Standing Committee on the draft general order of the Center, State Council, Military Commission and Cultural Revolution Group; the Centers Notice on the question of "catching renegades" (second draft); the notice on carrying revolution further, promoting production, raising income and saving outlay; the plan for full military control of the Railways Ministry (draft); and the supplementary decision on military control of the defence-industry ministries, the National Defence Science and Technology Research Academy and their units (draft).
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (June 5, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-06-06.china-leadership-3
      when: June 6
      date: '1967-06-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, on the Zhejiang "United General Headquarters" rebels storming into the Hangzhou Silk Printing and Dyeing Mill, smashing machines and seizing men, with large-scale armed fighting and bloodshed, orders the Zhejiang military control committee to send troops in to work and separate the two sides. June 11, told of another large armed fight of the "United Headquarters" and the "Red Violence" faction, he orders Zhejiangs garrison and the two bodies to send delegates to Peking to talk; June 13 he receives Zhejiangs delegates.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156 (June 6, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-06.china-leadership-4
      when: June 6
      date: '1967-06-06'
      thread: china-leadership
      c: 'Zhou Enlai talks with the staff attending the Afro-Asian Writers meeting: a serious international meeting cannot have views forced on it; some foreigners are progressive, some patriotic; allow differing views, no uniformity; Marxism-Leninism and Mao Zedong Thought must be open to discussion.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 156–157 (June 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-06-09.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 9, 1967; Zhou with Mao at the reception of the delegates to the Afro-Asian writers meeting)'
- add:
    entry:
      id: cal.1967-06-09.china-leadership-2
      when: June 9
      date: '1967-06-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, with Center leaders and Cultural Revolution Group members, hears Wen Yucheng on the Cultural Revolution in the Canton area. "How can conservative bodies be overthrown? Unite and educate them." Help the mass bodies to a great alliance; in Hunan the "Xiangjiang Storm" covers nearly the whole province and crosses trades, its heads truly bad, some from secret societies; to name Tao Zhu in the press and criticize him must be put to Mao. Told of the fierce factional fighting in the railway offices: "military control is unavoidable; perhaps it cannot wait." He continues the talk with Wen that evening.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 9, 1967). Made public: 2020. Names: Zhou Enlai, Wen Yucheng, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-11.china-leadership
      when: June 11
      date: '1967-06-11'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, with Li Xiannian and Lu Xuzhang, meets the Foreign Trade Ministrys Canton fair assistance group and the ministrys two factions, and sharply criticizes their fights, their seizing and holding leading cadres at will. The wind must be stopped. Without a thought for the Party and the state they are not content to down men but shout "great renegade chief"; "you overthrow Politburo members at will: is it your dictatorship or the dictatorship Mao leads?" The verdict of enemy contradiction on Ye Jizhuang is wrong: he did a great deal in foreign trade and is dying, but the Party must be fair. The two sides must agree: no seizing, grabbing, beating or storming the meeting hall; each criticism not over three hours; no "jet plane" posture.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 11, 1967). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Lu Xuzhang, Ye Jizhuang.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-11.china-leadership-2
      when: June 11–13
      date: '1967-06-11'
      thread: china-leadership
      c: 'Zhou Enlai receives the farm branchs rebels twice, the 11th and 13th. To the demand to drag out Tan Zhenlin: he has read their material on Tan, which must be verified; no such early conclusion. "I am in poor health and work so many hours a day; how can I stand it? I have not yet fallen; I hope you will not either."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 11, 13, 1967). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin.'
      tags:
      - name:zhou-enlai
      - name:tan-zhenlin
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-12.china-leadership
      when: June 12
      date: '1967-06-12'
      thread: china-leadership
      c: Zhou Enlai attends the memorial meeting for Jiang Guangnai.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157 (June 12, 1967). Names: Zhou Enlai, Jiang Guangnai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-06-12.china-leadership-2
      when: June 12
      date: '1967-06-12'
      thread: china-leadership
      also:
      - testing
      - china
      c: 'Zhou Enlai chairs the Central Special Commission with Li Fuchun, Ye Jianying and Nie Rongzhen and hears Luo Shunchu report all the preparations for the hydrogen bomb test. Do not fall into empiricism: the test has new features and must be handled with care and seriousness and its problems truly settled; after the general rehearsal on the 13th the whole assembly of the bomb is to be fully checked again for safety and reliability; Nie Rongzhen to go to the site and direct. The meeting fixes that the safety work outside the test area is under Zhou, Li Fuchun and Luo Shunchu directly.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 157–158 (June 12, 1967). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Ye Jianying, Nie Rongzhen, Luo Shunchu.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - name:ye-jianying
      - name:nie-rongzhen
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-06-17.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 17, 1967; Chinas first hydrogen bomb explodes)'
- add:
    entry:
      id: cal.1967-06-14.china-leadership
      when: June 14
      date: '1967-06-14'
      thread: china-leadership
      c: Zhou Enlai, after talking with Song Renqiong, talks with Li Fuchun and Chen Xilian on Anshan Iron and Steel; Li, on Zhous instruction, had earlier held four meetings with the mills delegates.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 158 (June 14, 1967). Made public: 2020. Names: Zhou Enlai, Song Renqiong, Li Fuchun, Chen Xilian.'
      tags:
