      c: 'Zhou Enlai, before dawn, writes Liu Shaoqi, Deng Xiaoping and Peng Zhen: he had meant to take up the international questions (diplomacy, war preparation, aid abroad, the Vietnam war) after Peng Zhens talk at the Chairmans; it is better not to wait; proposes a talk at Lius at 3:30 that afternoon, and has Li Zhizhong summon Li Fuchun, Li Xiannian, Lu Dingyi, Kang Sheng, Wu Lengxi, Liao Chengzhi, Liu Ningyi, Zhang Hanfu, Qiao Guanhua and Li Tianyou. Liu: agreed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 11 (Feb. 7, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Li Zhizhong, Li Fuchun, Li Xiannian, Lu Dingyi, Kang Sheng, Wu Lengxi, Liao Chengzhi, Liu Ningyi, Zhang Hanfu, Qiao Guanhua, Li Tianyou.'
