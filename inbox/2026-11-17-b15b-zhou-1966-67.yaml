      date: '1966-05-25'
      thread: china-leadership
      c: At Kang Shengs and Cao Yious prompting, seven Peking University philosophy department people under Nie Yuanzi put up a wall poster attacking the universitys Party committee and Pekings municipal committee. Zhou Enlai had told the university to proceed with great care, for it held students from dozens of countries, and to keep inside and outside apart. After the poster he sends officials of the North China Bureau, the State Councils Foreign Affairs Office and the Ministry of Higher Education to the university that night, to rebuke Nie for going against the Centers plans and to restate the rule on inside and outside. Kang Sheng, learning of the rebuke, secretly reports the poster to Mao, behind Liu Shaoqi and Deng Xiaoping.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31–32 (May 25, 1966). Made public: 2020. Names: Zhou Enlai, Nie Yuanzi, Kang Sheng, Cao Yiou, Liu Shaoqi, Deng Xiaoping, Mao Zedong.'
      tags:
