      date: '1966-02-02'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Zhou Enlai to Li Tianyou and Li Qiang, on the Vietnamese foreign trade ministrys complaint that Chinese departments, ignorant of the facts, insisted on shipping aid goods in covered wagons or not at all: "Why so mechanical? Not like wartime transport. Correct it at once; sum up and do not repeat it."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 8 (Feb. 2, 1966). Made public: 2020. Names: Zhou Enlai, Li Tianyou, Li Qiang.'
      tags:
      - name:zhou-enlai
