    entry:
      id: cal.1966-12-28.china-leadership-2
      when: Dec. 28
      date: '1966-12-28'
      thread: china-leadership
      c: Zhou Enlai chairs the Centers liaison meeting, the second day; Jiang Qing and others charge Tao Zhu with being "Chinas biggest royalist".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 103 (Dec. 27, 28, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:tao-zhu
      - polity:prc
