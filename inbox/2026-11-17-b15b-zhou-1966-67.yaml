      date: 1966-09
      thread: china-leadership
      c: 'Zhou Enlai, on a hospital crowds wish to struggle against Hu Yousong, Li Zongrens wife: she has faults and may be criticized, but not at Li Zongrens home; no struggle there. Oct. 1, on the Tiananmen stand, he tells Li Zongren he should spend a few days in Hospital 301: the Red Guards are young and warm but know little Party policy and may disturb him.'
