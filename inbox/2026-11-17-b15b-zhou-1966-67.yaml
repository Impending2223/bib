      - vis:only:prc
- cite:
    id: cal.1967-02-08.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 8, 1967; Zhous letter to Mao and Lin Biao reporting Xinjiang, Tibet, Shandong, Jiangsu, Hunan, Shaanxi, Zhejiang, Yunnan and Guangxi, and proposing to bring Ye Fei, Tan Qilong, Jiang Weiqing, Yang Shangkui, Liu Junxiu and Jiang Hua to Peking to rest, and military control of Peking and Tianjin, beginning with the public security bureaus)'
- add:
    entry:
      id: cal.1967-02-09.china-leadership-2
      when: Feb. 9
      date: '1967-02-09'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai chairs the Centers liaison meeting, which adopts the notice, to be issued by the Public Security Ministry and the Peking garrison, that the garrisons headquarters takes over the Peking Public Security Bureau, sets up a military control committee and puts all its subordinate organs under military control. Issued with Maos approval Feb. 11.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121–122 (Feb. 9, 1967). Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
- add:
    entry:
      id: cal.1967-02-09.china-leadership-3
      when: Feb. 9
      date: '1967-02-09'
      thread: china-leadership
      c: Zhou Enlai tells Wu Faxian and Zou Renong through his secretary to put the Peking and Shanghai civil aviation administrations and airports under military control as fast as possible.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wu Faxian.'
      tags:
      - name:zhou-enlai
      - name:wu-faxian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-09.china-leadership-4
      when: Feb. 9
      date: '1967-02-09'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai has Fu Chongbi and Huang Zuozhen meet the delegates of the Tongxian armory technical school and the "Workers Red Rebel Headquarters", and order both sides to stop the armed fight, leave the scene and return the guns.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Fu Chongbi, Huang Zuozhen.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-09.china-leadership-5
      when: Feb. 9
      date: '1967-02-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on whether the Zhejiang Military District should join the criticism of Jiang Hua called by the "Zhejiang Revolutionary Rebel United Command": it may attend but not speak or take a stand.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Hua.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-10.china-leadership-2
      when: Feb. 10
      date: '1967-02-10'
      thread: china-leadership
      c: 'Zhou Enlai, after the meeting at Maos, calls the liaison meeting of Center Party, government and army heads and Cultural Revolution Group members, which adopts the Military Commissions Several Provisions on the Cultural Revolution in Organs above Army Level: by Party committees, the "four bigs" by stages; none in army units below, naval, air and Peking garrison units and units the Commission names, with no one linking up with them; no seizing of power from below and no storming in military leading organs; no fighting groups in them; tell proletarian from bourgeois power-holders and not overthrow all; against anarchism, extreme democracy, small-group spirit and individualism. He sends it to Mao and Lin Biao; Mao on the 11th: "to the Premier, issue as is."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 10, 1967). Made public: 2020. See [[cal.1967-02-11.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-11.china-leadership-2
      when: Feb. 11
      date: '1967-02-11'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Xian delegates from eight units. Wang Renzhong is gravely ill and Mao told him to bring Wang back to rest; for ten days he could not find him, and had to order the military region to find him by a time; only today was Wang handed over: "anarchism and liberalism have flooded to the edge."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 122–123 (Feb. 11, 1967). Made public: 2020. Names: Zhou Enlai, Wang Renzhong, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-11.china-leadership-3
      when: Feb. 11
      date: '1967-02-11'
      thread: china-leadership
      c: 'Zhou Enlai chairs the Centers liaison meeting at Huairen Hall. Ye Jianying and Xu Xiangqian and others confront face to face the Cultural Revolution Groups throwing the Party and the army into confusion. Ye to Chen Boda: "you have thrown the Party into confusion, the government, the factories and villages, and still not enough, you must throw the army too; what do you want? Can there be revolution without the Partys leadership? Without the army?" Xu, thumping the table: the army is the pillar of the dictatorship of the proletariat; shall men like Kuai Dafu command it?'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Xu Xiangqian, Chen Boda, Kuai Dafu.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - name:xu-xiangqian
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-11.china-leadership-4
      when: Feb. 11
      date: '1967-02-11'
      thread: china-leadership
      also:
      - china
      c: 'Du Ping, political commissar of the Nanjing Military Region, as the Centers representative at the Zhejiang Military District, meets Chen Liyun, Nan Ping, Ruan Xianbang and rebel delegates and conveys Zhou Enlais instruction: the Center sends a special plane the evening of the 11th to take Jiang Hua to Peking, and he must be taken safely to Jiaxing airfield.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Du Ping, Jiang Hua.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-11.china-leadership-5
      when: Feb. 11
      date: '1967-02-11'
      thread: china-leadership
      c: 'Zhou Enlai receives the rebel delegates of the Agriculture, State Farms and Land Reclamation and Aquatic Products ministries, the Meteorological Bureau and the Farm Office, which have seized power: fire the first shot of spring plowing; farming is seasonal and lost once the season is gone; each unit to study its production team well; the farm branch to prepare an appeal to the whole country to grasp revolution and promote production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-13.china-leadership
      when: Feb. 13
      date: '1967-02-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates of the Harbin "Red Rebels United Headquarters": to throw Daqing into disorder is very dangerous; it is so important that the army must take it over. The Northeasts farming has not passed, coal output is down, transport has trouble; help part of the cadres of the provincial committee to stand forth and grasp production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 13, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-14.china-leadership-2
      when: Feb. 14
      date: '1967-02-14'
      thread: china-leadership
      c: Zhou Enlai chairs the Centers liaison meeting on seizing power in the Peking municipality and the Centers ministries and commissions.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 14, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-02-15.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 15, 1967; Zhou with Mao receiving the Mauritanian delegation)'
- cite:
    id: cal.1967-02-16.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967; Zhou chairs at Huairen Hall; the meeting was to take up grasping revolution and promoting production in the State Councils branches; Tan Zhenlin, Chen Yi, Ye Jianying, Li Xiannian and Yu Qiuli lose their temper at the Cultural Revolution Groups Jiang Qing, Chen Boda and Kang Sheng for confusing Party and army and persecuting old cadres; Tan to Zhang Chunqiao: "you want to knock the old cadres down one by one; I will fight to the end, though they cut off my head, jail me and expel me from the Party"; Tan starts to leave and Zhou calls him back; Zhou asks Chen Boda why the *Hongqi* editorial of issue 13 was not shown to the Standing Committee)'
- add:
    entry:
      id: cal.1967-02-16.china-leadership-3
      when: Feb. 16
      date: '1967-02-16'
      thread: china-leadership
      c: 'Zhang Chunqiao, Yao Wenyuan and Wang Li with Jiang Qing, after the Huairen Hall meeting, draw up a "record" and report to Mao, Zhang adding that Zhou has objected to the *Hongqi* editorial of issue 13 not being sent to him for review. Mao: the Party constitution does not require that editorials go through the Standing Committee. He tells Zhang to talk with Zhou: the Cultural Revolution Group is to be treated as a secretariat, and major Party and state questions put first to it for discussion.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967, the item after). Made public: 2020. See [[cal.1967-02-16.china-leadership]]. Names: Zhou Enlai, Zhang Chunqiao, Yao Wenyuan, Wang Li, Jiang Qing, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - name:jiang-qing
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-16.china-leadership-4
      when: Feb. 16
      date: '1967-02-16'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, in the evening, receives the Inner Mongolia regional committees and military regions heads and the Inner Mongolia rebel delegates, and stresses that the army must stay steady; to storm the army is "not thinking of the nations whole interest"; the military region may not be stormed, nor the military factories, and the army does not seize power; trust and cherish the PLA.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-17.china-leadership
      when: Feb. 17
      date: '1967-02-17'
      thread: china-leadership
      c: Zhou Enlai, before dawn, receives the finance-and-trade rebels and orders on the spot the arrest of Du Xiangguang, who refused to carry out an order, got the rebels to push the Party committee aside and seized the Finance Ministrys business power. The finance power cannot be seized; the Finance Ministry carries it out for the Center. Seizures not recognized by the Center do not count and will be examined one by one; the Party groups of the Finance and Commerce ministries are restored and Li Xiannian, Wu Bo and Yao Yilin to take charge; ministries that dropped their Party groups must restore them. The warrant against Yao Yilin is to be withdrawn and Duan Junyi and Wang Lei handed over. To treat leaders as enemies, parade them for a dozen days, put tall hats and black boards on them and make them "jet planes" is "cruel struggle, merciless blows"; "it makes me very sad and grieved; at this key moment I must speak or I am guilty."
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 17, 1967). Made public: 2020. Names: Zhou Enlai, Du Xiangguang, Li Xiannian, Wu Bo, Yao Yilin, Duan Junyi, Wang Lei.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-17.china-leadership-2
      when: Feb. 17
      date: '1967-02-17'
      thread: china-leadership
      c: 'Tan Zhenlin writes Lin Biao, going on against Jiang Qing and others: "the Premier has been worked over enough; he is broad-minded and can endure; wait and see."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Tan Zhenlin, Lin Biao, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:tan-zhenlin
      - name:lin-biao
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-18.china-leadership-2
      when: Feb. 18
      date: '1967-02-18'
      thread: china-leadership
      c: 'Zhou Enlai, before dawn, receives the finance-and-trade bureau chiefs and above: power seizure has gone off; correct it. Seize only the leadership of the Cultural Revolution; the Centers power and the Partys leadership, and the governments finance, public security, foreign affairs and defence powers, are not to be seized; the rebels may supervise business, not go past it; no supervision of finance in full. Cadres who erred are not to be given "cruel struggle, merciless blows", nor endless struggle.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 18, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-02-18.china-leadership-3
      when: Feb. 18
      date: '1967-02-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, in talk of the army, says the Military Commissions emergency instruction of Oct. 5 had a mobilizing effect and a side effect: of late the storming of military organs is very fierce.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-18.china-leadership-4
      when: Feb. 18
      date: '1967-02-18'
      thread: china-leadership
      c: Zhou Enlai chairs the liaison meeting at Huairen Hall.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-18.china-leadership-5
      when: Feb. 18
      date: '1967-02-18'
      thread: china-leadership
      c: 'Zhou Enlai receives rebel delegates of the defence-industry branch and, told that the Second Ministry rebels seized the Party committees leadership, says: "you have no limit." Above the ministrys committee is the Center; it may not be pushed aside. Power only of the leadership of the Cultural Revolution, business only by supervision; finance, foreign affairs, defence, defence industry and propaganda belong to the Center. Ministers and bureau heads of the defence industry, except those the Center has suspended for self-examination, are not to be held by you, nor is a dismissal not approved by the Center valid. Beating, hanging boards and parading are the bad style of the "Left" line, "cruel struggle, merciless blows"; "I am sad, and if I do not say so I am guilty."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-02-18.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967; Zhou reads the draft *Hongqi* editorial "Cadres Must Be Treated Rightly", which holds the great majority of cadres good and calls refusal of class analysis of power-holders, and doubt and overthrow of all, an anarchist trend; he notes that it is very important and timely and proposes it be discussed at the Party-government-army-Group liaison meeting before it appears; Mao agrees and asks the three-in-one be written in; printed Mar. 1)'
- add:
    entry:
      id: cal.1967-02-18.china-leadership-6
      when: Feb. 18
      date: '1967-02-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai has his secretary telephone the Jiangxi committee: the Jiangxi rebels are to take Yang Shangkui and Liu Junxiu safely to Peking by Feb. 20. They arrive by air the 19th.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 127 (Feb. 18, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yang Shangkui, Liu Junxiu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-02-19.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 127 (Feb. 19, 1967; Zhou at the Politburo meeting; Zhou also makes self-criticism at the "life meetings" of Feb. 25 to Mar. 18; the Politburo stops meeting and the Cultural Revolution Group in effect takes its place; the liaison meeting Zhou led, with the vice-premiers and others, is replaced by the Cultural Revolution Groups, which Wu Faxian and others join)'
- add:
    entry:
      id: cal.1967-02-19.china-leadership-6
      when: Feb. 19
      date: '1967-02-19'
      thread: china-leadership
      c: 'Zhou Enlai, told that the "West Suburb Preparatory Office to Struggle against the Peng, Lu, Luo and Yang Counter-revolutionary Revisionist Clique", made up of the "New Peking University Commune", Tsinghuas "Jinggangshan Corps" and others, will hold criticism meetings on Peng Zhen, Lu Dingyi, Luo Ruiqing and Yang Shangkun on Feb. 26 and 27, and will "seize above and sweep below", dragging out and parading 26 people (Peng Zhen, Liu Ren, Zheng Tianxiang, Wan Li, Wu Han, Lin Feng, Jiang Nanxiang, Lu Ping, Peng Peiyun, Lu Dingyi, Zhou Yang, Wu Lengxi, Lin Mohan, Xu Liqun, Xia Yan, Xiao Xiangrong, Su Zhenhua, Xu Zirong, An Ziwen and others), asks Chen Boda, Kang Sheng and Jiang Qing: "is the slogan of sweeping below fit?" "Does the Offices wish to drag out so many help the struggle and criticism?"'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 127 (Feb. 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Peng Zhen, Lu Dingyi, Luo Ruiqing, Yang Shangkun, Zhou Yang, Wu Lengxi, Lin Mohan, Xia Yan, Xiao Xiangrong, Su Zhenhua, Xu Zirong, An Ziwen, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:peng-zhen
      - name:lu-dingyi
      - name:luo-ruiqing
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-20.china-leadership
      when: Feb. 20
      date: '1967-02-20'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai tells the briefing on power seizure in Shanxi that there is now a chain reaction: since Januarys seizures, whether or not a department has a power-holder on the capitalist road, the rebels seize. Some places seize power from every "first secretary"; explained so, what would the Party and country be? The Centers ministers and vice-ministers are not all power-holders on the capitalist road; the Centers Party, finance, foreign and cultural powers cannot be seized; military power belongs to the Center, and to seize a military regions or rebel against it is "a mistake of the whole direction". He disapproves of "die-hards who hold to the bourgeois reactionary line": if that stands, anyone with too little self-criticism can be called one. Farming is the pressing matter, seasonal; the middle cadres of the Centers ministries are important, and if set aside business cannot be grasped.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 20, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- cite:
    id: cal.1967-02-19.china-leadership-5
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 20, 1967; Zhou reviews the Centers Letter to the Poor and Lower-Middle Peasants and Cadres of the Peoples Communes: most commune cadres good; those who erred to make good in spring plowing; he proposes at once a three-level cadre meeting of commune, brigade and team to arrange spring work; he sends it to Wang Dongxing for Mao, who writes "do as proposed")'
- add:
    entry:
      id: cal.1967-02-21.china-leadership-2
      when: Feb. 21
      date: '1967-02-21'
      thread: china-leadership
      c: Zhou Enlai, after going to Maos, talks with Chen Yi and Tan Zhenlin.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 21, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi, Tan Zhenlin, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - name:tan-zhenlin
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-22.china-leadership
      when: Feb. 22
      date: '1967-02-22'
      thread: china-leadership
      c: Zhou Enlai talks before dawn with Chen Boda, Jiang Qing, Kang Sheng, Wang Li and Guan Feng.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 22, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Jiang Qing, Kang Sheng, Wang Li, Guan Feng.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:jiang-qing
      - name:kang-sheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-22.china-leadership-2
      when: Feb. 22
      date: '1967-02-22'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews and revises the Centers Notice on the supplementary explanation of the Military Commissions eight orders: the eight orders are good and, but for the seventh, which concerns army matters only, apply to the localities. Students, staff and peasants linking up elsewhere are to return at once; military leading organs, the army and the localities war-preparation and cipher systems are not to be stormed or linked with; Party Center organs, the defence-industry ministries, Public Security, Foreign Affairs, the Planning, Finance, Economic, Construction and Science commissions, all banks, the *Renmin ribao*, *Hongqi*, *Jiefangjun bao*, Xinhua and the Broadcasting Bureau are not to be taken over by outsiders, and those already in to leave. Mao approves and issues it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 128–129 (Feb. 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-23.china-leadership
      when: Feb. 23
      date: '1967-02-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with the heads of the large military regions: provinces, prefectures and counties are to be put into action, with military departments foremost, and form production offices at each level to lead spring plowing, quickly, for the season presses. The regions commanders take charge and draw in provincial and prefectural cadres; leaders who have not passed their test may come out and work first and pass it afterward. The Military Commission the same day issues its instruction on the army giving strong help to the localities in spring production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 23, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-27.china-leadership
      when: Feb. 27
      date: '1967-02-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai attends the Cultural Revolution Groups liaison meeting on Guangdong, then writes Mao: the Guangdong committees principal men were wrong to "yield power" to the rebels; the situation will not bear long delay; he proposes military control at once and a three-in-one revolutionary committee to be prepared, and the same for Yunnan, much like Guangdong. Mao: "Agreed."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 27, 1967). Made public: 2020. See [[cal.1967-02-28.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02-28.china-leadership-2
      when: Feb. 28
      date: '1967-02-28'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with the leaders of the Guangdong committee and the Canton Military Region and announces that the Canton Military Region and the Guangdong Military District will form a military control over the province, in two teams, one for the Cultural Revolution and one for business. The same day he talks with Yunnan officials and rebels on military control of Yunnan.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 28, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-02.china-leadership
      when: Feb.
      date: 1967-02
      thread: china-leadership
      c: By Zhou Enlais desk calendar, in February he talked on all kinds of questions with central, local and army leaders 43 times, and received delegates of mass organizations 27 times.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 1967, the last item). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-01.china-leadership
      when: Mar. 1
      date: '1967-03-01'
      thread: china-leadership
      c: 'Zhou Enlai convenes the ministers of the industry-and-transport branches and rebel delegates and hears each ministry on its business. He has told Mao of the power seizures in the ministries, thinking supervision of business best, and Mao agrees. To the rebels: no more random seizing; the State Council asks you to promise not to seize and struggle against cadres at will; if you must, telephone him and he will send a liaison man to get the man back. The wind of beating, smashing, looting, house-searching and seizing must be stopped. Not every wrong word or act is "anti-Party, anti-socialist"; if so, who would speak after? That is slavishness. Do not put every error on the power-holders. Business is delayed; ministries are to restore normal order and ministry- and bureau-level cadres to work.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 129–130 (Mar. 1, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-03-01.china-leadership-2
      when: Mar. 1
      date: '1967-03-01'
      thread: china-leadership
      also:
      - china
      c: The *Hongqi* prints the editorial "Cadres Must Be Treated Rightly".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967). See [[cal.1967-02-18.china-leadership]]. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-03-02.china-leadership
      when: Mar. 2
      date: '1967-03-02'
      thread: china-leadership
      c: Zhou Enlai talks with Yang Dezhong on military control of the Peking Hotel.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 2, 1967). Made public: 2020. Names: Zhou Enlai, Yang Dezhong.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-02.china-leadership-2
      when: Mar. 2
      date: '1967-03-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates of the "Xian Workers Rebel Command" and Xian Jiaotong students. (1) Rebel bodies to rectify inside against headline-chasing, mountaintop-ism and anarchism. (2) The Xian slogan "hit, harden, grab" is reactionary. (3) Do not raise "great alliance, great seizure": is there no unit with a proletarian power-holder? Drop "die-hards who cling to the bourgeois reactionary line". (4) No more marches or loudspeaker trucks: he does not believe parades leave production alone. (5) Respect for the PLA is the sign of true and false revolution. (6) Do not drag leaders about; give them a chance to examine and make amends. (7) Alliances by system, not across trades.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-02.china-leadership-3
      when: Mar. 2
      date: '1967-03-02'
      thread: china-leadership
      c: Zhou Enlai talks with Yu Qiuli, Song Renqiong, Chen Xilian and Kang Shien on the Daqing oilfield.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yu Qiuli, Song Renqiong, Chen Xilian, Kang Shien.'
      tags:
      - name:zhou-enlai
      - name:chen-xilian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-03.china-leadership-2
      when: Mar. 3
      date: '1967-03-03'
      thread: china-leadership
      c: 'Zhou Enlai attends and speaks at the meeting for Xiao Huas self-criticism: Xiaos mistakes were not done knowingly, from lack of experience; he is a "little red devil", whose history is glorious; do not use a magnifying glass on a mans error of the moment, look at his whole history. House-searching Xiao Huas home is a "witch wind".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 3, 1967). Made public: 2020. Names: Zhou Enlai, Xiao Hua.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-06.china-leadership
      when: Mar. 6
      date: '1967-03-06'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates of mass organizations from Zhejiang: the root remedy is rectification, not wrangling; study Maos works and the Centers documents well.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 130 (Mar. 6, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-08.china-leadership
      when: Mar. 8
      date: '1967-03-08'
      thread: china-leadership
      c: 'Zhou Enlai has the original report from a corps of the Peking Military Region on the Yanan Middle School of Tianjin and Maos note of the 7th printed for the members of the liaison meeting and the delegates to the meeting of army-level cadres, and has a covering note drawn up for the Center to forward to the whole country. Maos note: the paper may go to the country for reference, and the army should give military training by stages to colleges, middle schools and upper primary classes; do not shut out erring teachers and cadres from it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 7, 1967; "次日"). Made public: 2020. See [[cal.1967-03-07.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-07.china-leadership-4
      when: Mar. 7
      date: '1967-03-07'
      thread: china-leadership
      c: 'Zhou Enlai, on the spread of meningitis in Anhui, Jiangsu, Zhejiang, Shanghai, Jiangxi and Fujian, writes Li Fuchun and Li Xiannian: at once see Sun Zheng, Qian Xinzhong, Cui Yitian and Huang Shuze of the Health Ministry and the three rebel bodies ("Red Rebel Corps", "Revolutionary Rebel United Headquarters", "East Is Red Commune"); best to set up a meningitis prevention office of Qian, Cui and one man from each, to begin work at once, undisturbed by other work.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Qian Xinzhong, Cui Yitian, Huang Shuze, Sun Zheng.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-07.china-leadership-5
      when: Mar. 7
      date: '1967-03-07'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with Li Xuefeng, Zheng Weishan, Chen Boda, Kang Sheng, Li Fuchun and Xie Fuzhi on Tianjin.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 7, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Xuefeng, Zheng Weishan, Chen Boda, Kang Sheng, Li Fuchun, Xie Fuzhi.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:li-fuchun
      - name:xie-fuzhi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-08.china-leadership-2
      when: Mar. 8
      date: '1967-03-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai has his secretary tell Zhang Chunqiao: Mar. 12 is the 42nd anniversary of Sun Yat-sens death; Shanghai is to mark it as in other years, and its Party and government heads are to lay a wreath at his former residence.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 8, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Chunqiao, Sun Yat-sen.'
      tags:
      - name:zhou-enlai
      - name:zhang-chunqiao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-10.china-leadership-3
      when: Mar. 10
      date: '1967-03-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai revises the draft Center telegram, in reply to the Nanjing Military Region, the Jiangsu Military District, Zhang Chunqiao and Yao Wenyuan, on Jiangsu: as the mass bodies there cannot soon unite and the conditions for the three-in-one are not ripe, the Center decides that the Nanjing Military Region and the Jiangsu Military District set up a military control committee, in two teams, one to grasp revolution and one to run production, including industry, farming, finance and trade.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 10, 1967). Made public: 2020. See [[cal.1967-03-10.china-leadership]]. Names: Zhou Enlai, Zhang Chunqiao, Yao Wenyuan.'
      tags:
      - name:zhou-enlai
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-03-10.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 131 (Mar. 10, 1967; Zhous report of Mar. 10 on carrying out Maos Mar. 9 instruction, with his revision, the same day, of the Centers reply on Jiangsu)'
- add:
    entry:
      id: cal.1967-03-10.china-leadership-4
      when: Mar. 10
      date: '1967-03-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the Kunming Iron and Steel Companys request for military takeover: agreed; Ye Jianying to telephone the Region.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (Mar. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ye Jianying.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-13.china-leadership
      when: Mar. 13
      date: '1967-03-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai speaks to the conference of army-level cadres: whatever happens, settle the leading bodies of provinces, municipalities and regions in March, to grasp revolution and promote production; the members of each leading body to be mainly PLA, for revolutionary mass bodies alone will not do; where there is none, a production command first. Units gone paralyzed or half so, seized by bad men, frontier, coastal and communication points, organs of dictatorship, secret and key organs, and defence enterprises, are all to be under military control. Education, culture and health must be taken up too; epidemic prevention is very urgent. If some fear the army become a work group, that depends on which work group: if it stands on Maos line and pushes the Cultural Revolution and the three-in-one, why not? Military control committees should help local leaders to come out and show themselves; mass bodies to be attached by trade; reactionary organizations and those who gravely break law and discipline or leak state secrets are to be arrested and prosecuted.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (Mar. 13, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-03-13.china-leadership-2
      when: Mar. 13
      date: '1967-03-13'
      thread: china-leadership
      also:
      - testing
      - china
      c: 'Zhou Enlai reviews and signs the State Councils and Military Commissions telegram to the Lanzhou Military Region on military control of Plant 504 and the Xigu power plant: a top-secret plant, power not to be seized; absolute safety and stable output; no linking up with outside bodies inside the plant. On the 25th he signs another, repeating that Plant 504 is not to be seized or stopped, the "four bigs" to cease and give way to positive education. From mid-March to the end of November he signs eleven urgent telegrams to nuclear-industry plants for their production safety.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (Mar. 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-13.china-leadership-3
      when: Mar. 13
      date: '1967-03-13'
      thread: china-leadership
      also:
      - china
      - vietnam-hanoi
      c: 'Zhou Enlai telephones Wei Guoqing: Guangxi is at the front of the aid to Vietnam against America, so full military control; Wei to come forward as head of the control committee.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 132 (Mar. 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wei Guoqing.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-14.china-leadership-2
      when: Mar. 14
      date: '1967-03-14'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews the proclamation of military control of factories, drafted by the Peking garrison on the views of the State Council and Military Commission: all factory staff are to hold their production posts, keep discipline and obey command; those long away from the plant to return within a week, or be disciplined, down to dismissal. The 15th the liaison meeting adopts it and he sends it to Mao; the 16th he drafts the Centers note forwarding it for the whole country to follow.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 14, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-03-14.china-leadership-3
      when: Mar. 14
      date: '1967-03-14'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai drafts the telegram of the Center, State Council and Military Commission to all provincial, municipal and regional and military-region committees: Pekings Huairou County has done well to set up a front-line command to grasp revolution and promote production, and all places should at once do likewise, with military delegates in the main, above all at county level; mobilize all strength to push farming and its output measures and the support of spring plowing by industry, transport, finance and trade, health and education. He sends it to Chen Boda for Mao, noting that such a command approaches a preparatory group for the three-in-one but stresses production, or is the production team under the military control committee: if it can be formed it is good.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-15.china-leadership
      when: Mar. 15
      date: '1967-03-15'
      thread: china-leadership
      c: 'Zhou Enlai chairs the Cultural Revolution Groups liaison meeting on the Centers Letter to the Workers, Staff and Cadres of the Countrys Factories, Mines and Enterprises: the working class to be the model of grasping revolution and promoting production and of great revolutionary alliance and against anarchism; keep the eight-hour day and fight absence without cause, slipshod work, disregard of quality and waste of state materials. The 16th he sends it to Mao for approval, and orders it broadcast and printed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 15, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- cite:
    id: cal.1967-03-18.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 15–16, 1967; Zhous part in the Centers letter to the workers, staff and cadres of factories, mines and enterprises, as chronicled for the 15th and 16th)'
- cite:
    id: cal.1967-03-17.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 133 (Mar. 17, 1967; Zhou, before dawn, on the Fuzhou Military Regions report on a Fujian revolutionary committee and seizure of power, thinks conditions unripe and telephones Han Xianchu: Fujian to prepare the three-in-one through military control; if all agree it is ripe, send delegates to the Center; if the Mar. 18 mass meeting cannot be cancelled, make it a preparatory meeting for seizing power; Mao agrees)'
- add:
    entry:
      id: cal.1967-03-17.china-leadership-2
      when: Mar. 17
      date: '1967-03-17'
      thread: china-leadership
      c: 'Zhou Enlai writes Li Fuchun, Li Xiannian, Yu Qiuli, Gu Mu and Ye Jianying: Mao instructs that after the defence industry, military control may be applied to the State Councils industry-transport and finance-trade branches where paralyzed and in anarchy; to meet together the morning of the 18th.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 134 (Mar. 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Yu Qiuli, Gu Mu, Ye Jianying, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - name:ye-jianying
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-17.china-leadership-3
      when: Mar. 17
      date: '1967-03-17'
      thread: china-leadership
      c: 'Zhou Enlai receives the Party-group members and rebels of the National Defense Science Commission and the Defense Industry Offices ministries: seizing power and criticism are to be separate, some only criticism and no seizure. Defence output has suffered since the Cultural Revolution; rank the leading cadres and give them a chance to make self-criticism, but not everyone through the pass, and no dragging; that is to doubt all, the bourgeois reactionary line. He kept Wang Zheng (the Fourth Ministrys head) in Zhongnanhai for protection some days ago; now he is let out, and there is to be no more seizing.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 134 (Mar. 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wang Zheng.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-03-20.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 134–135 (Mar. 18, 1967; Zhou, after talking with Li Fuchun, Nie Rongzhen and Ye Jianying on military control, writes Mao and Lin Biao that military control is announced for the defence industry: three military delegates to each department using the existing bodies, the masses to rectify with open doors and help the leaders to show themselves, to a three-in-one; he also gives views on military control of the State Councils industry-transport, finance-trade, farm-forestry and health branches; Mao: "return to the Premier, do as said"; the report of Nie Rongzhen to the Center on military takeover of defence research bodies, Zhou agreeing and proposing six defence-industry ministries, Mao: "Premier, do it")'
- add:
    entry:
      id: cal.1967-03-18.china-leadership-2
      when: Mar. 18
      date: '1967-03-18'
      thread: china-leadership
      c: 'Zhou Enlai, on the stoppage of work in the Third Bureau of the Partys Investigation Department through the fight of its two factions, orders Yang Dezhong at once to pick three leaders from the Central Guards Regiment to go and declare military control there, and asks the Military Commission and General Political Department to prepare a delegation of three to five for military control of the Department as a whole; he also reviews the Centers and Military Commissions notice on the Third Bureaus military control: the delegation is to keep the bureaus business going and the Partys and states core secrets safe. Mao agrees to military control of the whole Department.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 135 (Mar. 18, 1967, the item after). Made public: 2020. See [[cal.1967-03.china-leadership]]. Names: Zhou Enlai, Yang Dezhong, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-03-19.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 135 (Mar. 19, 1967; Zhou reviews the Centers notice on stopping the great linking up nationwide, cancelling the plan for one after the spring thaw; Mao approves; issued that day)'
- add:
    entry:
      id: cal.1967-03-21.china-leadership-2
      when: Mar. 21
      date: '1967-03-21'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on Maos instruction that "all railway bureaus in disorder should be put under military control", has Yu Qiuli and Gu Mu at once draft a decision on military control of the railways, communications and posts-and-telecommunications ministries and their key enterprises. In revising it he adds: under the military control committee two teams, a Cultural Revolution committee and a business leading group; treat cadres by inquiry and class analysis, not rejecting or overthrowing all, nor all restoring and combining. The Cultural Revolution Group finds fault with it at the liaison meeting.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 135 (Mar. 21, 1967). Made public: 2020. See [[cal.1967-03-21.china-leadership]]. Names: Zhou Enlai, Yu Qiuli, Gu Mu, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-21.china-leadership-3
      when: Mar. 21
      date: '1967-03-21'
      thread: china-leadership
      c: 'Zhou Enlai receives the finance-and-trade rebels and the Party-group members of the ministries, and tells the ministries to take up business at once. To rebels who want Chen Yun criticized and posters against Li Xiannian put up in the streets: "I cannot answer; matters within the Standing Committee are for the Center to decide; the Standing Committee has not decided to produce material to criticize Chen Yun; I do not favor posters in the streets; Li Xiannian is vice-premier and the Center trusts him." That he and the Cultural Revolution Group differ in tone: "so we do; Mao has not decided, so of course I answer for protecting." House-searching, beating, smashing, looting and seizing are not allowed. Of the "adverse current of capitalist restoration from above": it depends on content; seizing beyond supervision, the Party Centers and ministries business power, or acting from selfish thoughts, is a restoration current.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 135–136 (Mar. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yun, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:chen-yun
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-21.china-leadership-4
      when: Mar. 21
      date: '1967-03-21'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, on the poster by David Kupp, a foreign teacher at the Xian Foreign Languages Institute, criticizing the rebels extreme Left ways (he took an expulsion by mass meeting for the "whole-people Party" way, called "revolutionary hitting, smashing, looting" a plague and asked that those leading the revolution astray be cleared out), proposes it be published in the Groups Cultural Revolution bulletin with Maos comment. Mao Mar. 20 had written that the foreigner saw the questions well and analyzed them rather well.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 136 (Mar. 21, 1967, the item after). Made public: 2020. Check: the day; the chronology gives Maos comment as of Mar. 20. Names: Zhou Enlai, David Kupp, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-21.china-leadership-5
      when: Mar. 21
      date: '1967-03-21'
      thread: china-leadership
      c: Zhou Enlai goes to Maos to report on the seven "Politburo life criticism meetings".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 136 (Mar. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-21.china-leadership-6
      when: Mar. 21
      date: '1967-03-21'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives, in the evening, the rebel delegates and Party-group members of the Railways, Communications and Posts ministries: to settle quickly the work of the three; full military control of all three; whatever happens the second quarters output must be done well; railways, ships, docks, buses, ports and transport firms, the large first; control to push the great alliance and the three-in-one, whose key is to see two sides of the leading cadres; restoring business is not restoration. Of the talk that Li Xiannian, Yu Qiuli and Gu Mu belong to "the bourgeois headquarters": "if they were not Maos headquarters, could I bring them today? Be factual; do not believe rumor."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 136 (Mar. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian, Yu Qiuli, Gu Mu.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-22.china-leadership
      when: Mar. 22
      date: '1967-03-22'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai reviews the State Councils and Military Commissions notice on military control of Peking Hospital, stressing that its mass bodies must "rectify" and must treat cadres rightly.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 22, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-03-22.china-leadership-2
      when: Mar. 22
      date: '1967-03-22'
      thread: china-leadership
      c: 'Zhou Enlai, after the Peking workers congress, talks with Kuai Dafu: do not make absolutes of cadres; neither "no criticism" nor "one criticism, down they go" is right; he sees no new material for downing Yu Qiuli; do not be "Left" in form and Right in fact.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Kuai Dafu, Yu Qiuli.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-23.china-leadership-3
      when: Mar. 23
      date: '1967-03-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews the draft decision of the Center, State Council and Military Commission on military control of the Daqing oilfield: speedily restore and re-elect the leading bodies at each level, reinstate the production command, and ensure output, construction, research and design. He sends it to Mao: for so large a national enterprise, with a division of troops stationed at Daqing, the decision should come from the Center, State Council and Commission. Mao: "do as proposed."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 23, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-23.china-leadership-4
      when: Mar. 23
      date: '1967-03-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates of Daqings workers and affirms its past work. On treating cadres rightly: criticism severe, handling lenient. Some slogans are made absolute and he cannot interfere, for this is great democracy, but he does not agree; for example, "long live revolutionary hitting, smashing and looting" is "Left" in form and Right in fact, an infantile "Left" disorder.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 23, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-24.china-leadership
      when: Mar. 24
      date: '1967-03-24'
      thread: china-leadership
      c: 'Zhou Enlai calls the members of the Health Ministrys Party group and delegates of four rebel bodies and asks about epidemic prevention. He has named Qian Xinzhong and Cui Yitian to the meningitis office, and all four bodies are to back it: the most urgent work, not a days delay. The "Hundred Ugly Pictures" make the Party ugly and hurt it; that they said Li Xiannian was wrongly criticized: he thinks the criticism was too little, but it cannot be said that his words were poisonous weeds.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 137 (Mar. 24, 1967). Made public: 2020. Names: Zhou Enlai, Qian Xinzhong, Cui Yitian, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-24.china-leadership-2
      when: Mar. 24
      date: '1967-03-24'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with Xu Xiangqian, Nie Rongzhen, Ye Jianying, Xiao Hua and Yang Chengwu on Qinghai.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Xiao Hua, Yang Chengwu.'
      tags:
      - name:zhou-enlai
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:ye-jianying
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-24.china-leadership-3
      when: Mar. 24
      date: '1967-03-24'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with Wang Enmao and Saifudin on Xinjiang. Next day he receives delegates of Xinjiangs rebel bodies in Peking: do not fix the nature of Wang Enmaos case beforehand.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wang Enmao, Saifudin.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-27.china-leadership-2
      when: Mar. 27
      date: '1967-03-27'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, learning of the earthquake at Hejian and Daqing in Hebei, tells the State Science Commission, the Academy of Sciences and the Geology and Petroleum ministries to go to the site, and sends his liaison man Liu Xiyao to command there. The 29th he orders them to watch closely the earthquake signs of the Peking–Tianjin area.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 27, 1967). Made public: 2020. Names: Zhou Enlai, Liu Xiyao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-28.china-leadership
      when: Mar. 28
      date: '1967-03-28'
      thread: china-leadership
      c: 'Zhou Enlai calls the liaison meeting at Huairen Hall on three things: (1) the decision on military control of the railway, communications and posts ministries; (2) a draft trial rule for military control of defence plants and defence research institutes; (3) who is to carry out, in the army, supporting the Left, farming and industry, military control and military training.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 28, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-03-28.china-leadership-2
      when: Mar. 28
      date: '1967-03-28'
      thread: china-leadership
      c: 'Zhou Enlai receives the Party-group members and rebels of 21 ministries and commissions (water and power, coal, metallurgy, materials, forestry, planning, textiles and others). The revolution started from above has no precedent and no experience; it is in its second stage, and with more experience cadres are not to be hauled about; criticize them at agreed times and let them go back to their work. The State Council needs Yu Qiuli and Gu Mu, for the Center has few to grasp business. It is the busy farm season and industrys second quarter: no general review of cadres; rank them and free a batch to business posts.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138 (Mar. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Yu Qiuli, Gu Mu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-28.china-leadership-3
      when: Mar. 28
      date: '1967-03-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews the Centers draft decision on Anhui: the Jan. 26 seizure there did not produce a great alliance of proletarian revolutionaries nor a true three-in-one; at once form a military control committee under Qian Jun, deputy commander of the Nanjing Military Region, to hold the provinces leadership with two teams, for revolution and for production. He sends it to Lin Biao for Mao; Mao approves it and sends it round the country.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 138–139 (Mar. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Qian Jun, Lin Biao, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:lin-biao
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-03-29.china-leadership-2
      when: Mar. 29
      date: '1967-03-29'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'Zhou Enlai tells Pham Van Dong in talks: the Soviet Union says China will attack it; China will not; it is so large and has more at home than it can manage.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 29, 1967). Made public: 2020. Names: Zhou Enlai, Phạm Văn Đồng.'
      tags:
      - name:zhou-enlai
      - name:pham-van-dong
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1967-03-30.china-leadership-3
      when: Mar. 30
      date: '1967-03-30'
      thread: china-leadership
      also:
      - china
      c: The *Hongqi*, no. 5, prints Qi Benyus "Patriotism or National Betrayal? On the Reactionary Film *Secret History of the Qing Court*", the editorial office investigators article of Wang Li and Guan Feng, "Hit a Big Number, Protect a Small Handful" Is a Part of the Bourgeois Reactionary Line, and a commentators "The Bourgeois Reactionary Line on the Cadre Question Must Be Criticized". They attack Liu Shaoqi and for the first time, unnamed, put on him in public "the biggest power-holder on the capitalist road in the Party".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 30, 1967). See [[cal.1967-03-23.china-leadership]]. Names: Zhou Enlai, Qi Benyu, Wang Li, Guan Feng, Liu Shaoqi.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - polity:prc
- add:
    entry:
      id: cal.1967-03-30.china-leadership-4
      when: Mar. 30
      date: '1967-03-30'
      thread: china-leadership
      c: Zhou Enlai watches the film *Secret History of the Qing Court* in the evening at Huairen Hall.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
