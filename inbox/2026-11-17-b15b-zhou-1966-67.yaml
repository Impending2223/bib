      when: May 20
      date: '1967-05-20'
      thread: china-leadership
      c: Zhou Enlai talks with those concerned on the Anshan Iron and Steel problem.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 20, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-21.china-leadership
      when: May 21
      date: '1967-05-21'
      thread: china-leadership
      c: 'Zhou Enlai receives some arts workers of the army, navy and air force troupes: the PLA must set an example in factory and school, make no cliques, unite and perform jointly.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 21, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-21.china-leadership-2
      when: May 21
      date: '1967-05-21'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, after talking with the heads of the Inner Mongolia committee and Military Region, attends the enlarged meeting of the Military Commissions Standing Committee, which makes the Commissions five-point decision on Inner Mongolia: (1) all Inner Mongolians in Peking to be back by May 24; (2) the Regions leading organs and troops to have positive education only, no "four bigs", no linking up, no fighting groups, no joining marches and meetings; (3) the few who defy the Center to be punished by degree; (4) officers and men absolutely not to join armed fights and to oppose hitting, smashing, looting, searching and seizing; (5) support the Left and educate and unite the conservatives. May 22 the Region issues five orders by it; Zhou reviews the orders and the Commissions comment and sends them to Mao.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 21, 1967, the item after). Made public: 2020. See [[cal.1967-05-22.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-24.china-leadership-2
      when: May 24
      date: '1967-05-24'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai calls the heads of the Foreign Affairs Office, the Foreign Ministry and the Hong Kong–Macao Work Committee on Hong Kong. The struggle with the Hong Kong British authorities must follow strictly the Centers line and policy, with reason, advantage and restraint; he criticizes the over-"Left" slogans and extreme acts proposed by the departments.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 24, 27, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-27.china-leadership-2
      when: May 27
      date: '1967-05-27'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai calls the heads of the Foreign Affairs Office, the Foreign Ministry and the Hong Kong–Macao Work Committee on Hong Kong a second time, repeating that the struggle must follow the Centers line with reason, advantage and restraint.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 24, 27, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-25.china-leadership
      when: May 25
      date: '1967-05-25'
      thread: china-leadership
      also:
      - japan
      c: Zhou Enlai receives the delegation of the Japan Journalists League. China would like through Tōhō Tsūshinsha to learn more of the common interests of the Chinese and Japanese peoples; the Japanese ruling class knows China better than China knows Japan, a weakness to be made up; Chinese reporters hear what they wish to hear, a single side and narrow; Xinhua and the journalists association might commission the League for long, full and systematic reports on certain matters.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 25, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1967-05-25.china-leadership-2
      when: May 25
      date: '1967-05-25'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai orders the arrest of those who beat the Inner Mongolia Military Regions heads at the meeting on Inner Mongolia in the CPPCC auditorium on the 24th, and goes to Maos to report on Inner Mongolia. Next day he talks with Xu Xiangqian, Nie Rongzhen, Ye Jianying, Yang Chengwu and Su Yu on settling it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 152 (May 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Yang Chengwu, Su Yu.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:ye-jianying
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-26.china-leadership-2
      when: May 26
      date: '1967-05-26'
      thread: china-leadership
      c: 'Zhou Enlai receives members of the Academy of Sciences "Power-Seizing Committee" and some cadres: Guo Moruo is to be brought into the three-in-one. Told that the liaison men headed by Liu Xiyao are a work group in disguise and should be downed: "it does not fit the facts; I cannot agree in any case; that is no fear, many shout down with."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 26, 1967). Made public: 2020. Names: Zhou Enlai, Guo Moruo, Liu Xiyao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-26.china-leadership-3
      when: May 26
      date: '1967-05-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Hohhot mass bodies delegates and announces the Military Commissions five-point decision on Inner Mongolia. Not to quarrel and not work over a difference of view: grasp revolution, production, work and war preparation. As to criticizing Ulanhu, no hurry to seize him back; the time has not come; there is a nationality question too.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Ulanhu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-26.china-leadership-4
      when: May 26
      date: '1967-05-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on Wang Enmaos report that the masses at Urumqis Liudaogou coal mine and Yuhuliang power plant have fought two days and cannot be dissuaded: the plant is under military control and no armed fight is allowed between the two sides; send unarmed troops to separate them and work among the masses, but no hurry to arrest. He wires the Yuhuliang plant to cooperate with the Xinjiang Military Region, stop the fight, and bring the workers back to their posts so the plant keeps generating.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Wang Enmao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-27.china-leadership-3
      when: May 27
      date: '1967-05-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai chairs the Center liaison meeting, which adopts the Decision of the Center, State Council, Military Commission and Cultural Revolution Group on Military Control of the State Councils Departments (a trial draft). May 28 he sends it to Mao and Lin Biao: after this years struggle to lead the revolution and supervise business, most units rebels have split in two and struggle with each other, hurting production and business greatly, and military control cannot be avoided. Mao approves and it is issued the same day.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 27, 1967). Made public: 2020. See [[cal.1967-05-28.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-28.china-leadership-2
      when: May 28
      date: '1967-05-28'
      thread: china-leadership
      c: 'Zhou Enlai receives the rebel delegates of the Health Ministrys system and criticizes their having first acted, then reported: seizing away several of the ministrys leaders without Center approval. All sides to unite and agree on picking some bureau heads to run business; the Health Ministry is unlike the Culture and Education ministries, it cannot stop work, with so many hospitals.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 153 (May 28, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-28.china-leadership-3
      when: May 28
      date: '1967-05-28'
      thread: china-leadership
      c: 'Zhou Enlai instructs Xinhua on *Cankao xiaoxi*: it should report not only the good news; some of what the enemy says of China must be printed too, or the masses and rebels cannot know the many sides; do not let "fear" come first.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-29.china-leadership
      when: May 29
      date: '1967-05-29'
      thread: china-leadership
      c: 'Mao writes on a letter from Wang Hairong and Tang Wensheng reporting a current of attacks on Zhou Enlai in society, to Lin Biao, Zhou and the Cultural Revolution Group: "Please read. The ultra-Left view is wrong; the comrades of the Group should persuade them."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 29, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Wang Hairong, Tang Wensheng, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-29.china-leadership-2
      when: May 29
      date: '1967-05-29'
      thread: china-leadership
      c: Zhou Enlai, after consulting Song Renqiong and Chen Xilian, talks with the rebels on the Anshan Iron and Steel problem.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Song Renqiong, Chen Xilian.'
      tags:
      - name:zhou-enlai
      - name:chen-xilian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-29.china-leadership-3
      when: May 29
      date: '1967-05-29'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai attends the Cultural Revolution Groups meeting on Henan. The next day, told of heavy armed fights between the two sides in Zhengzhou and wounded left uncared for, he has the Health Ministry send medical teams at once and do something to help unity.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-30.china-leadership
      when: May 30
      date: '1967-05-30'
      thread: china-leadership
      c: 'Zhou Enlai has his secretary tell the liaison man in the health system that he has settled with the "Red Flag" faction of the Peking Traditional Medicine College: they are to release the Health Ministrys ministers from the Medical University today, to the State Council first and home after the Premier has seen them. June 1, after talking with Li Fuchun and Li Xiannian on the Ministry, he receives its delegates: this week he and Li Fuchun took in hand the Ministrys movement; hereafter three rules: no random seizing; talks are allowed, but a man in danger of being seized reports at once. Qian Xinzhong, Cui Yitian, Huang Shuze, Zhang Kai and He Biao are for now to write material at the State Council. Health business cannot stop.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154 (May 30, 1967). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Qian Xinzhong, Cui Yitian, Huang Shuze, Zhang Kai, He Biao.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-31.china-leadership-2
      when: May 31
      date: '1967-05-31'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, on the State Council liaison offices report that at Zhengzhou, Xuzhou, Bengbu, Jinhua, Xuanhua and other rail hubs armed fights have blown up locomotives and stopped work, leaving four main trunk lines (Peking–Canton, Tianjin–Pukou, Shanghai–Longhai, Zhejiang–Fujian) paralyzed, with 69 freight trains halted at Xuzhou alone, approves the urgent telegram of the 68th Army Party committee of the Jinan Military Region asking for military control of the Xuzhou railway sub-bureau and station.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 154–155 (May 31, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-31.china-leadership-3
      when: May 31
      date: '1967-05-31'
      thread: china-leadership
      c: 'Zhou Enlai goes to Maos at noon to say that railways and shipping are the arteries of the country, and if they stop the economy cannot be recovered: military control of rail and transport must not be put off. Mao agrees.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (May 31, 1967, the item after). Made public: 2020. See [[cal.1967-05-31.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-31.china-leadership-4
      when: May 31
      date: '1967-05-31'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai calls Li Fuchun, Li Xiannian, Ye Jianying, Xiao Hua, Yang Chengwu, Gu Mu and Yu Qiuli, and they fix measures: (1) issue quickly in public an order against stopping rail and ship traffic; (2) give the 18 railway administrations to nearby garrisons to hold under military control, and coastal and river shipping to the navy; (3) the army men in control kept apart from the military subdistricts and armed departments and out of local support-the-Left work; (4) the General Staff to draw up a troop-movement plan by the next day. He sends the report to Mao and the eight telegrams on rail stoppages to Chen Boda, Kang Sheng, Jiang Qing and the Cultural Revolution Group, noting that another "letter to railway and shipping workers" is to be issued after it is settled. June 1 the Center, State Council, Military Commission and Cultural Revolution Group issue the Order on Resolutely Safeguarding the Revolutionary Order of Rail and Other Transport.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (May 31, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Ye Jianying, Xiao Hua, Yang Chengwu, Gu Mu, Yu Qiuli, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - name:ye-jianying
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05.china-leadership-3
      when: May
      date: 1967-05
      thread: china-leadership
      c: By Zhou Enlais desk calendar, in May, besides meetings, he talked with central, local and army leaders over thirty times and received delegates of mass bodies 28 times.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (May 1967, the last item). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-06-01.china-leadership
      when: June 1
      date: '1967-06-01'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with Cultural Revolution Group members on Guangxi, and before dawn the next day with the Guangxi Military Regions heads.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 155 (June 1, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
