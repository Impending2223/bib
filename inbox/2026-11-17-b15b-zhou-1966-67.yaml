      thread: china-leadership
      c: Zhou Enlai, after talks with Tao Zhu, Li Fuchun and Ye Jianying, meets the chief men of the regions, provinces and cities and the heads of the State Councils branches and the Cultural Revolution Group on conveying the spirit of the Central Work Conference and on policies and measures of the movement.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 82 (Oct. 26, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Ye Jianying.'
