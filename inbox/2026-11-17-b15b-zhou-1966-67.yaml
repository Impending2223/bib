      - name:mao-zedong
      - polity:prc
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1967-11-08.china-leadership
      when: Nov. 8
      date: '1967-11-08'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai sends to Mao for approval, and then issues, the Centers Instruction on the Cultural Revolution at the Grass Roots of the Villages this Winter and Next Spring.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 8, 1967). Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
- add:
    entry:
      id: cal.1967-11-08.china-leadership-2
      when: Nov. 8
      date: '1967-11-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, in the evening, receives the Canton delegates in Peking and criticizes bodies that go to the military control committees Mao Zedong Thought classes to seize cadres: telephone home at once and release them; cadres in the classes are protected by the committee. Cadres are not to be met with factionalism but with Party spirit; being rebels is no license. Asked whether democratic persons are to take part in the "four bigs": no.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194–195 (Nov. 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-09.china-leadership-2
      when: Nov. 9
      date: '1967-11-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on Henans request to seize power and form a revolutionary committee: first the great revolutionary alliance and the three-in-one, then talk of power and a committee; one faction may not seize power or set up a committee.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 9, 1967). Made public: 2020. See [[cal.1967-11-09.china-leadership]]. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-11.china-leadership
      when: Nov. 11
      date: '1967-11-11'
      thread: china-leadership
      c: Zhou Enlai calls the State Council business group on foreign trade and foreign aid, with Li Fuchun, Li Xiannian, Chen Yi, Nie Rongzhen, Su Yu and Yu Qiuli.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 11, 1967). Made public: 2020. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Chen Yi, Nie Rongzhen, Su Yu, Yu Qiuli.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - name:li-xiannian
      - name:chen-yi
      - name:nie-rongzhen
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-11.china-leadership-2
      when: Nov. 11
      date: '1967-11-11'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai chairs the enlarged liaison meeting of the Cultural Revolution Group, which adopts papers on the Guangdong and Guangxi questions.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-12.china-leadership-2
      when: Nov. 12
      date: '1967-11-12'
      thread: china-leadership
      c: Zhou Enlai receives the ambassadors abroad and the rebels of the embassies in turn.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 12, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-13.china-leadership
      when: Nov. 13
      date: '1967-11-13'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, to make sure of a good Canton autumn fair, talks that evening with delegates of Cantons and Zhanjiangs mass bodies and asks them to unite and write a Letter to the People of Canton calling all bodies, workers, peasants, soldiers, students and traders, Party and government offices and service trades to pull together for the fair, and not fight "civil war" now. No one may sabotage or disturb; the military control committee may detain trouble-makers.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 13, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-11-14.china-leadership
      when: Nov. 14
      date: '1967-11-14'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, for the sixth time, receives Guangdongs mass delegates in Peking, reads and explains the Decision of the Center, State Council, Military Commission and Cultural Revolution Group on the Guangdong Question, and asks them to go home to study, rectify, break provincialism, liberate cadres and reach the great alliance; to reach it a batch of cadres must be freed.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 14, 1967). Made public: 2020. To check: the Decision on the Guangdong Question, as issued. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-14.china-leadership-2
      when: Nov. 14
      date: '1967-11-14'
      thread: china-leadership
      also:
      - china
      c: The Center, State Council, Military Commission and Cultural Revolution Group issue the Notice that army-level and higher offices of all military regions are not for now to hold the "four bigs" and that units below army keep to positive education, drawn up under Zhou Enlai.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195 (Nov. 14, 1967, the item after). See [[cal.1967-11-12.china-leadership]]. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-11-16.china-leadership-2
      when: Nov. 16
      date: '1967-11-16'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Zhou Enlai receives the delegation of the South Vietnam National Liberation Front under Deng Chenshi (邓尘施) and part of the Vietnamese party and government delegation under Nguyễn Duy Trinh (阮维桢). Told that Vietnam sends the children of cadres to school at Guilin in China: not fit for a cadres children school; the children of workers and peasants lose by it, and sending only cadres children makes them special; China made its cadres children special in the past and the Cultural Revolution has shown many problems.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 195–196 (Nov. 16, 1967). Made public: 2020. Check: the name of the NLF delegations head, given in Chinese as 邓尘施. Names: Zhou Enlai, Nguyễn Duy Trinh.'
      tags:
      - name:zhou-enlai
      - name:nguyen-duy-trinh
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1967-11-16.china-leadership-3
      when: Nov. 16
      date: '1967-11-16'
      thread: china-leadership
      c: Zhou Enlai tells the Partys United Front Work Department "great alliance" headquarters to agree whether they can answer for Zhang Jingwus protection; if so, they may take him back to the Department; if not, the Peking garrison will keep him in custody.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 16, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Zhang Jingwu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-16.china-leadership-4
      when: Nov. 16–17
      date: '1967-11-16'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates of Guangxis "Lianzhi" and "April 22" on Nov. 16 and 17: in the great alliance treat cadres rightly and put away factional views of them; he persuades the two to let Wei Guoqing, An Pingsheng and Wu Jinnan into the autonomous regions revolutionary committee preparatory group.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 16, 17, 1967). Made public: 2020. Names: Zhou Enlai, Wei Guoqing.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-17.china-leadership
      when: Nov. 17
      date: '1967-11-17'
      thread: china-leadership
      c: Zhou Enlai reviews the letter of the Peking Knitting General Mills revolutionary committee reporting its joy to Mao, and the report of the army unit stationed there, soon to be forwarded by the Center, and strikes out the words naming Liu Shaoqi and Peng Zhen, leaving only "the biggest handful of power-holders in the Party on the capitalist road".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 17, 1967). See [[cal.1967-11-15.china-leadership-2]]. Names: Zhou Enlai, Liu Shaoqi, Peng Zhen.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:peng-zhen
      - polity:prc
- add:
    entry:
      id: cal.1967-11-18.china-leadership-2
      when: Nov. 18
      date: '1967-11-18'
      thread: china-leadership
      c: Zhou Enlai calls the State Council business group meeting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 18, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-18.china-leadership-3
      when: Nov. 18
      date: '1967-11-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives delegates of the Jiangsu "Old Workers General" and "New Workers General" and other bodies and gets the two to agree in Peking to unite and settle the Changzhou railway matter: Changzhou is where trains on the Shanghai–Nanjing line often stop, and Henans coal cannot pass, which hurts all output; next year is the third year of the Third Five-Year Plan. To the rebels from the army: the army is not to meddle in the localities; if you have views on the Region, raise them at the Regions meetings, do not link up in the localities, still less join or stir local armed fights.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196 (Nov. 18, 1967, the item after). Made public: 2020. See [[cal.1967-11-18.china-leadership]]. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-19.china-leadership
      when: Nov. 19
      date: '1967-11-19'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Guangxis delegates in Peking for the eighth time, reads and explains the Decision of the Center, State Council, Military Commission and Cultural Revolution Group on the Guangxi Question, and stresses that the agreement must be carried out: above all the railways and transport must be done well and not interrupted. To the demand that Guangxi cadres studying in Peking be seized and taken back for criticism: "I take it you are putting on a rival show; if one is worth criticizing, keep them all in Peking to be criticized: study first, criticism after."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 196–197 (Nov. 19, 1967). Made public: 2020. To check: the Decision on the Guangxi Question, as issued. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-20.china-leadership-2
      when: Nov. 20
      date: '1967-11-20'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, told that Xiamens "Cuhe Lian" is seizing many arms from the military subdistrict and the field army and has wounded soldiers, wires with Chen Boda the "Cuhe Lian", copy to the Xiamen military control committee and the Fuzhou Military Region: this violates the Sept. 5 order; Xiamen is the front of national defence and seizing front-line troops arms is absolutely not to be allowed; stop at once and return all arms taken to their units.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (Nov. 20, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-20.china-leadership-3
      when: Nov. 20
      date: '1967-11-20'
      thread: china-leadership
      c: Zhou Enlai chairs the enlarged liaison meeting of the Cultural Revolution Group to discuss and revise the Centers Circular on Seeking Views on Convening the Ninth Congress. Next day he sends it to Mao.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (Nov. 20, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-23.china-leadership
      when: Nov. 23
      date: '1967-11-23'
      thread: china-leadership
      c: Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, holds a forum with delegates of Pekings factory mass bodies and hears of steel and coal output. As many workers plead illness and will not go down the pits, he stresses good political and ideological work.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (Nov. 23, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-24.china-leadership
      when: Nov. 24–25
      date: '1967-11-24'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates of Heilongjiangs "Paohong" and "Shanshang" factions on Nov. 24 and 25 and criticizes the failure of several bodies to reach agreement and unite. To the heads: do not lead the masses wrong, nor eagerly make civil war and seek the limelight; the masses will not follow. The three Northeast provinces are the countrys base for grain, coal and oil; coal is down and grain and oil cannot be shipped. Both sides are to agree on union within a week and go home to grasp revolution and production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197 (Nov. 24, 25, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-25.china-leadership
      when: Nov. 25
      date: '1967-11-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, told that at Zhengzhou station, from factional armed fights, traffic is stopped and over 3,000 wagons are stranded, has the two Zhengzhou factions flown to Peking: "3,000 wagons stopped at Zhengzhou, and I am very grieved. If I had time I would go myself." The railway has a military control committee and still no production command; the railways have had a year and a half of revolution and come to this; what are paper and pens, when trains must run? Delegates of the countrys railway bureaus in Peking also attend.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 197–198 (Nov. 25, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-25.china-leadership-2
      when: Nov. 25
      date: '1967-11-25'
      thread: china-leadership
      c: Zhou Enlai calls the State Council business group meeting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 198 (Nov. 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-26.china-leadership
      when: Nov. 26–27
      date: '1967-11-26'
      thread: china-leadership
      also:
      - africa
      c: Zhou Enlai is with Mao at the receptions of Burmese guests and of E. F. Hill, chairman of the Communist Party of Australia (Marxist-Leninist); he receives Tanzanias Minister of Health and attends the Mauritanian National Day reception.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 198 (Nov. 26, 27, 1967). Check: the day of each. Names: Zhou Enlai, Mao Zedong, Edward Hill.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
- add:
    entry:
      id: cal.1967-11-28.china-leadership
      when: Nov. 28–Dec. 1
      date: '1967-11-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, each day from Nov. 28 to Dec. 1, calls Liu Jiandong, Wang Xin and other heads of the Henan Military District and the two Zhengzhou railway bureau factions to settle the Zhengzhou railway problem, and gets the two to agree seven accords, among them the agreement on the great revolutionary alliance in the Zhengzhou railway bureau within Henan; the Xian railway bureau on its own reaches a great alliance. To push the other bureaus he drafts the Centers note forwarding the Zhengzhou and Xian agreements to the whole country: the railways bear greatly on the victory of the Cultural Revolution, state construction and the peoples livelihood; other bureaus bodies should reach similar agreements. Dec. 5 he sends the agreements and the note to Mao for approval, with the marginal remark that, the railways and coal being so crucial, the Railways Ministry has held two Mao Zedong Thought classes, mostly of the bureaus rebel delegates, control committee heads and business cadres, and the Coal Ministry sends men to the main coal areas to help military-control staff hold classes in batches, to push the great alliance.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 198–199 (Nov. 28–Dec. 1, 1967). Made public: 2020. Names: Zhou Enlai, Liu Jiandong, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-28.china-leadership-2
      when: Nov. 28
      date: '1967-11-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on Li Deshengs report from Hefei, where the 12th Army is hampered for over half a month by a crowd that makes uproar at the military control committee, storms the army headquarters and injures its officers, with repeated persuasion in vain, writes: telephone Li: first political work; if not heeded, announce the Sept. 5 order and divide them, demanding the ringleaders; if still not, and they commit violence, arrest the ringleaders on the spot; tell the followers that they will not be pursued, but if they repeat, the ringleaders will be arrested on the spot.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Nov. 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Desheng.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-29.china-leadership
      when: Nov. 29
      date: '1967-11-29'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives the Pakistan Air Force delegation under Air Marshal Nur Khan. On the causes of the Cultural Revolution: a large country with so many people, with leading organs and masses separated by many layers, easily loses touch with the masses; without revolutionizing thought it breeds bureaucracy and revisionism. China does not recommend this experience to other countries nor tell others to do likewise.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Nov. 29, 1967). Made public: 2020. Names: Zhou Enlai, Nur Khan.'
      tags:
      - name:zhou-enlai
      - name:khan-malik-nur
      - polity:prc
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1967-11-30.china-leadership-2
      when: Nov. 30
      date: '1967-11-30'
      thread: china-leadership
      also:
      - middle-east
      c: Zhou Enlai cables President Qahtan al-Shaabi of the Peoples Republic of South Yemen, congratulating it on its independence.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Nov. 30, 1967). Names: Zhou Enlai, Qahtan al-Shaabi.'
      tags:
      - name:zhou-enlai
      - name:shaabi-qahtan-mohammed-al
      - polity:prc
- add:
    entry:
      id: cal.1967-12-01.china-leadership-2
      when: Dec. 1
      date: '1967-12-01'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai chairs the Cultural Revolution Groups liaison meeting on the Opinions and Questions on Restoring Party Organizational Life, the Order to Ensure the Safety of Rail Freight, and the Notice on Treating Right the Old Rebels Who Erred.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Dec. 1, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-12-02.china-leadership-2
      when: Dec. 2
      date: '1967-12-02'
      thread: china-leadership
      c: Zhou Enlai calls the State Council business group meeting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199 (Dec. 2, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-02.china-leadership-3
      when: Dec. 2
      date: '1967-12-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, with Chen Boda, Kang Sheng and Jiang Qing, receives Tianjins delegates; Kang reads the Centers approval of Tianjins revolutionary committee. To the rumor in Tianjin that Zhou took part in the eighth reception of Tianjin delegates and upset the "leaders" plan: proletarian political acts are open and factual; no slandering or inventing; if anyone doubts, put it out and settle it face to face, and not scheme behind ones back.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 199–200 (Dec. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-03.china-leadership
      when: Dec. 3
      date: '1967-12-03'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with Chen Xilian, Pan Fusheng, Wang Jiadao and others. Next day he calls the Cultural Revolution Groups liaison meeting on Heilongjiang and other papers.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200 (Dec. 3, 1967). Made public: 2020. Names: Zhou Enlai, Chen Xilian, Pan Fusheng, Wang Jiadao.'
      tags:
      - name:zhou-enlai
      - name:chen-xilian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-04.china-leadership
      when: Dec. 4
      date: '1967-12-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on robbery of the state vault, writes Chen Xilian: robbing a state vault is a crime; cash taken is to be returned in full by a set date and the chief culprit handed over; any further robbery will be dealt with as in the act, with detention and examination, the ringleaders handed over and arrested and tried by law.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200 (Dec. 4, 1967). Made public: 2020. Names: Zhou Enlai, Chen Xilian.'
      tags:
      - name:zhou-enlai
      - name:chen-xilian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-09.china-leadership
      when: Dec. 9
      date: '1967-12-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai calls the State Council business group meeting; and, in the Cultural Revolution Groups liaison meeting, the Decision on Military Control of Public Security Organs, which he sends Dec. 10 to Lin Biao for Mao. In revising it he added: public security, procuratorial and judicial organs are among the organs of dictatorship; in many places their rebels both link up with local mass bodies as revolutionary bodies and act as organs of dictatorship, a mixing of two functions that does not help the Cultural Revolution; where rebels inside or outside have seized power, military control still goes on; after it outside rebels leave at once and no longer link up there, inside rebels come under the control committee or military delegates, link up neither in nor out, and no longer join local great alliances and delegates congresses by system, only help the committee with revolution and business inside.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200 (Dec. 9, 1967). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-09.china-leadership-2
      when: Dec. 9
      date: '1967-12-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai tells Huang Yongsheng, on the offices of the Guangdong revolutionary committees preparatory group: following other provinces experience, do not divide it into so many groups, which hurts leadership; leave some specific work to the departments and bureaus.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 200–201 (Dec. 9, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
      tags:
      - name:zhou-enlai
      - name:huang-yongsheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-10.china-leadership-2
      when: Dec. 10
      date: '1967-12-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on Li Deshengs report that four mass bodies under the Wuhu "Three Preparatory Offices" go on refusing to hand in arms, do beating, smashing, looting and house-searching, have stormed the troops three times since December, seized many arms and ammunition and taken the control committees building, replies: in the name of the Anhui military control committee give those groups a written warning to stop at once under the Sept. 5 order and seal and hand in arms; if they still ignore it and keep on breaking the law, the control committee will carry out the Centers order and deal with them by law.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 201 (Dec. 10, 1967). Made public: 2020. Names: Zhou Enlai, Li Desheng.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-10.china-leadership-3
      when: Dec. 10
      date: '1967-12-10'
      thread: china-leadership
      also:
      - testing
      - china
      c: 'Zhou Enlai chairs the 19th meeting of the Central Special Commission on the coming nuclear test. In the air we do only the needed tests, and in production we economize; time is short, so be ready before the 24th. The commission is to issue orders naming the commander, deputies, commissar and chief of staff, as Mao did in the civil war, each absolutely responsible; no one but the participants may enter the test area; all disputes of the two factions must stop in the highest interest and everyone go all out as one; the bases saying "test now, settle accounts and rebel after" is wrong: whom to rebel against? Drop factionalism and strengthen Party spirit.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 201 (Dec. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-10.china-leadership-4
      when: Dec. 10
      date: '1967-12-10'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of the health system and hears the report of its work conference: medicines are not to be a source of profit; a handling charge and the cost of renewed production are enough.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 201 (Dec. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-14.china-leadership
      when: Dec. 14
      date: '1967-12-14'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Jiangsus rebel delegates and rebukes the storming of the harbor bureau: the military control system is not to be washed away; the harbor bureau must be under it, and both factions obey the committee; its prestige must be set up in any case, for if military control has no authority how is the passage to great alliance and three-in-one made? "Could you do it as chairmen of revolutionary committees?" Private radio transmitters, radio-telephones and broadcasts and tapping of long-distance lines are illegal; if warned and not stopped they become a counter-revolutionary matter and subject to the law.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 201 (Dec. 14, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-15.china-leadership
      when: Dec. 15
      date: '1967-12-15'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with cadres of the Nanjing Military Region on how to set up the prestige of military control and run it well.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 15, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-15.china-leadership-2
      when: Dec. 15
      date: '1967-12-15'
      thread: china-leadership
      c: Zhou Enlai calls the Cultural Revolution Groups liaison meeting, which adopts the Decision of the Center, State Council, Military Commission and Group on Military Control of Xinhua. Next day he sends it and the list of the control group to Lin Biao for Mao; the 19th he talks with Xinhuas military control delegates.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 15, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-16.china-leadership
      when: Dec. 16
      date: '1967-12-16'
      thread: china-leadership
      c: Zhou Enlai calls the State Council business group meeting, and has his secretary put the latest brief on coal output in the meeting folder beforehand.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 16, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-17.china-leadership-3
      when: Dec. 17
      date: '1967-12-17'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: Zhou Enlai and Kang Sheng write Mao and Lin Biao that Hồ Chí Minh is soon to go home, with his illness and treatment, and propose that Mao and Lin see or visit him before he leaves. That evening Zhou and Kang go to Yuquanshan to see him.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 17, 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Mao Zedong, Lin Biao, Hồ Chí Minh.'
      tags:
      - name:zhou-enlai
      - name:kang-sheng
      - name:mao-zedong
      - name:lin-biao
      - name:ho-chi-minh
      - polity:prc
      - vis:only:prc+drv
- cite:
    id: cal.1967-12-17.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 17–18, 1967; Maos note to Lin Biao, Zhou and the Group on the Hunan preparatory groups request to hold a birthday celebration for Mao and ceremonies for his statue and the Xiangshan railway: no "absolute authority", no "plant and plant great", birthday celebrations long banned and the ban to be restated, the Hunan meeting set for another day; Zhous note of the 18th stops its circulation by 5 p.m. and asks recipients to bring it to the meeting)'
- add:
    entry:
      id: cal.1967-12-17.china-leadership-4
      when: Dec. 17
      date: '1967-12-17'
      thread: china-leadership
      c: Zhou Enlai receives students abroad about to return to study, and tells them Maos quotations are not to be used at random; propaganda to the Soviet and East European peoples is not to be forced on them; every nation has its self-respect and forcing things on it breeds ill feeling.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-12-18.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 18, 1967; Zhou with Mao at the reception of the delegation of the Albania–China Friendship Association)'
- add:
    entry:
      id: cal.1967-12-19.china-leadership-2
      when: Dec. 19
      date: '1967-12-19'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the two Guangxi factions study class members who would go back to Guangxi to preach the great alliance, has his secretary telephone Tan Furen, in charge of the classes, to look into it: if the atmosphere of alliance is good and both are willing to go and speak, he may agree.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202 (Dec. 19, 1967). Made public: 2020. Names: Zhou Enlai, Tan Furen.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-20.china-leadership
      when: Dec. 20
      date: '1967-12-20'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Heilongjiangs "Hanlianzong" and "Paohong" delegates and urges them to think of the whole and strengthen Party spirit. "Absolute" and "infinite" are not scientific, nor was the earlier "summit": if all become absolute authority, we must fall.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 202–203 (Dec. 20, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-21.china-leadership
      when: Dec. 21
      date: '1967-12-21'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives Pakistans Deputy Chairman of the Planning Commission, Ahmad, and his government economic delegation. In building, rely on self-reliance: first farming, grain, then clothing and housing, so the people are lively, then light and heavy industry. China has no experience either and feels its way; Chinese experts do not know your conditions and their views may not suit you.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 203 (Dec. 21, 1967). Made public: 2020. Names: Zhou Enlai, Ahmad.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1967-12-21.china-leadership-2
      when: Dec. 21
      date: '1967-12-21'
      thread: china-leadership
      also:
      - testing
      - china
      c: 'Zhou Enlai hears Luo Shunchu on preparation for the nuclear test. On the safety of the radar commander and tracking and photographing stations: if safe, do it; if not, not; in research and tests "safety first"; under socialism we care for mens safety; in war there are sacrifices, in war on nature the test is whether a sacrifice is unavoidable; where not unavoidable, safety must be assured, and what is not worth it is not done.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 203 (Dec. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Luo Shunchu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-22.china-leadership-3
      when: Dec. 22
      date: '1967-12-22'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai reviews the Centers, State Councils, Military Commissions and Groups Notice on the Cultural Revolution in the Civil Aviation System and sends it to Lin Biao for Mao. He notes that the civil aviation bureaus have long been under the air force and military control, but as the General Administration and its plants and schools hold the "four bigs" they are affected by linking up in and out; the discontented have often stirred masses to storm airfields and disturb flights, lately even beating pilots with arms, five crews hurt, in an attempt to paralyze civil aviation; the Military Commissions office group has found the ringleaders and had them arrested and tried; a further military control notice has passed the Groups small liaison meeting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 203 (Dec. 22, 1967). Made public: 2020. See [[cal.1967-12-22.china-leadership-2]]. Names: Zhou Enlai, Lin Biao, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:lin-biao
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-22.china-leadership-4
      when: Dec. 22
      date: '1967-12-22'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai receives delegates of nineteen countries at the consultative meeting of the Afro-Asian Writers Association. On a united front of Afro-Asian writers: the leading members take Marxism-Leninism and Mao Zedong Thought as the Associations guide, but the programme need not state it in so many words, to suit the Party-minded level of the Afro-Asian and Latin American masses and the times.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 203–204 (Dec. 22, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-12-23.china-leadership
      when: Dec. 23
      date: '1967-12-23'
      thread: china-leadership
      also:
      - testing
      - china
      c: 'Zhou Enlai and Nie Rongzhen reply by wire to the heads of the nuclear test base, Zhang Shaoyu and Zhang Zhenhuan: agreed to the time fixed for the test. Wipe out factional hostility; all preparation and safety before zero hour is to be done in earnest and responsibly, the organization strengthened, jobs fixed and checked strictly, work made finer and more thorough; beware of fear, carelessness and haste. After zero hour arrange the work well, no hurry to leave the site or go home, no settling of accounts after, and the glorious political task is to be fully done.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 204 (Dec. 23, 1967). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen, Zhang Zhenhuan.'
      tags:
      - name:zhou-enlai
      - name:nie-rongzhen
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-23.china-leadership-2
      when: Dec. 23
      date: '1967-12-23'
      thread: china-leadership
      c: Zhou Enlai calls the State Council business group meeting, having his secretary ask beforehand for the defence industrys 1967 output and 1968 plan, the coal brief and the daily railway report, and for the Second to Seventh Ministries of Machine Building each to send a control-committee head and a minister or vice-minister running business.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 204 (Dec. 23, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-23.china-leadership-3
      when: Dec. 23
      date: '1967-12-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates of the three Northeast provinces and tells those who still go to factories to stir armed fights and stop production: stop meddling, let the working class settle its own questions; make no new factions and no more linking up; work hard at dropping the petty-bourgeois "self" and factionalism. To judge Mao Zedong Thought by "plant and plant great" and "absolute authority" is to back and uphold it with sayings that do not fit it, an unserious and disrespectful attitude. Chen Boda, Kang Sheng, Yao Wenyuan, Xie Fuzhi, Yang Chengwu, Song Renqiong, Chen Xilian and Pan Fusheng are also at the reception.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 204 (Dec. 23, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Yao Wenyuan, Xie Fuzhi, Yang Chengwu, Song Renqiong, Chen Xilian, Pan Fusheng.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:yao-wenyuan
      - name:xie-fuzhi
      - name:chen-xilian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-12-25.china-leadership
      when: Dec. 25
      date: '1967-12-25'
      thread: china-leadership
      also:
      - testing
      - china
      c: 'Zhou Enlai calls Luo Shunchu, Qian Xuesen, Li Jue, Zhu Guangya, Wang Zhichang, Deng Jiaxian and others to hear the report on the test. Told it did not succeed: the Ninth Academy should gather its experts on one floor with a secret telephone and a place to rest to think and discuss; their daring to try is good; "failure is the mother of success"; the fault is that some theoretical and design men were not on the spot; do not lose heart; those who took part are to collect all the data, which is very precious, and analyze them and sum up the experience on return; use materialist dialectics to see scientific experiment; "settle accounts after the test" is factionalism at work and not allowed; press on with all strength. The test also had interference from its own unit: revolution not joined to grasping production disturbs production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 204–205 (Dec. 25, 1967). Made public: 2020. Check: the chronology does not give the date or kind of the test. Names: Zhou Enlai, Luo Shunchu, Qian Xuesen, Li Jue, Zhu Guangya, Wang Zhichang, Deng Jiaxian.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
