- add:
    entry:
      id: cal.1967-07-18.china-leadership-2
      when: July 18
      date: '1967-07-18'
      thread: china-leadership
      c: While Zhou Enlai is away from Peking, Jiang Qing, Kang Sheng and Chen Boda stir rebels to seize and struggle against Liu Shaoqi, Deng Xiaoping and Tao Zhu and their wives, and raid their homes.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 18, 1967). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Kang Sheng, Chen Boda, Liu Shaoqi, Deng Xiaoping, Tao Zhu.'
