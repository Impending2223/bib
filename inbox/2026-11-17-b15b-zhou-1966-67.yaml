      when: Oct. 24
      date: '1966-10-24'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai receives Pakistans Foreign Minister Pirzada: the two countries differ in system, nation and belief but have a basis for peaceful coexistence and both will keep the Five Principles.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 80 (Oct. 24, 1966). Made public: 2020. Names: Zhou Enlai, Pirzada.'
      tags:
      - name:zhou-enlai
      - name:pirzada-sharifuddin
      - polity:prc
      - vis:only:prc+pakistan
