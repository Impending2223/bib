- add:
    entry:
      id: cal.1966-01-05.china-leadership-2
      when: Jan. 5
      date: '1966-01-05'
      thread: china-leadership
      c: 'Zhou Enlai approves the State Planning Commission report (Song Shaowen) on opposing waste, practising thrift, the "three inspections" of stocks and the recovery of scrap metal: a nationwide output-and-thrift drive; scrap steel to furnaces first, handicrafts second, others third. Zhou: agreed; Song to draft the Centers and the State Councils note; a State Council leading group is set up, and units and provinces are to set up theirs. The Center and the State Council send the report out Jan. 16.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 1 (Jan. 5, 1966). Made public: 2020. To check: the report *Guanyu fandui langfei, lixing jieyue, kaizhan "sancha" he fei jinshu huishou gongzuo de baogao* (关于反对浪费、厉行节约、开展“三查”和废金属回收工作的报告) and the Centers and State Councils notice of Jan. 16, 1966 (named by the chronology, not printed in it). Names: Zhou Enlai, Song Shaowen.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-01-06.china-leadership-2
      when: Jan. 6
      date: '1966-01-06'
      thread: china-leadership
      c: 'Zhou Enlai hears Xie Fuzhi on a national public security conference to be called. On guard and confidential work: the Party has always held to Party-committee leadership and the mass line, against vertical command and mystery; the whole Party and the whole people to run public security. Six points on secrecy: act on responsibility; those transferred away not to ask about or meddle in their old units, nor see their papers, passes to be taken back; no "old chief" ties; the Centers General Office to draw up a work system; a national secrecy conference to meet with the public security conference, Peng Zhen presiding.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 1–2 (Jan. 6, 1966). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi, Peng Zhen.'
      tags:
      - name:zhou-enlai
      - name:xie-fuzhi
      - name:peng-zhen
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-01-07.china-leadership
      when: Jan. 7
      date: '1966-01-07'
      thread: china-leadership
      also:
      - japan
      - vietnam-hanoi
      c: 'Zhou Enlai receives the Japan Socialist Party Diet member Okada Haruo and Tsukada Shohei, vice-chairman of the Hokkaido assembly. On Asia and Vietnam, at their request: Vietnam is the focus of the worlds contradictions; two camps, the U.S. insisting on the war, the rest demanding U.S. troops leave the South; the U.S. in a dilemma.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 2 (Jan. 7, 1966). Made public: 2020. Names: Zhou Enlai, Okada Haruo, Tsukada Shohei.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1966-01-08.china-leadership
      when: Jan. 8
      date: '1966-01-08'
      thread: china-leadership
      c: 'Zhou Enlai at the Secretariat meeting, which hears Jiang Nanxiang on the national conference on half-work, half-study higher education. Zhou: go carefully and steadily or it will collapse; reform of the humanities needs at least two years of trial; the Ministry of Higher Education to go down and see; do not cut specialties so fine.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 2 (Jan. 8, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Nanxiang.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
