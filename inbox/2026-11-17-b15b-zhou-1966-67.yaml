      when: Nov. 4
      date: '1966-11-04'
      thread: china-leadership
      c: 'Zhou Enlai receives the Chinese sports delegation to the first Asian Games of the New Emerging Forces. Of some who petitioned at He Longs home and would not leave, wearing the marshal down: this is wrong; "I was very displeased to hear of it."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 4, 1966). Names: Zhou Enlai, He Long.'
      tags:
      - name:zhou-enlai
      - name:he-long
      - polity:prc
