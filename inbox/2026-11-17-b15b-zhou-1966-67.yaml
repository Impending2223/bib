- add:
    entry:
      id: cal.1966-01-28.china-leadership
      when: Jan. 28
      date: '1966-01-28'
      thread: china-leadership
      c: Zhou Enlai, Tianjin, hears the citys responsible officials on farm leadership, land clearing, tree planting and learning from other places. The municipal committee to give half its strength to farming, its secretaries and mayors each taking a district and visiting four times a year; plant by the teams own discussion; grain first on new land; tree the Peking–Tianjin road; learn from others and keep a local banner.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 6 (Jan. 28, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-01-28.china-leadership-2
      when: Jan. 28
      date: '1966-01-28'
      thread: china-leadership
      c: 'Zhou Enlai finishes revising the Propaganda Departments forwarding note and Qian Xinzhongs report on family planning. The report: a natural increase of 27.8 per thousand a year; the note: family planning is a great matter, to be pressed as the Centers and State Councils instruction of December 1962 directs. Zhou adds Tianjins birth rate, over 30 per thousand after liberation, 13 in 1964, and calls for late marriage first in the cities.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 6–7 (Jan. 28, 1966). Made public: 2020. Names: Zhou Enlai, Qian Xinzhong.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
