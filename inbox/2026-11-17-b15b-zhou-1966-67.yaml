      id: cal.1966-03-18.china-leadership-2
      when: Mar. 18–20
      date: '1966-03-18'
      thread: china-leadership
      c: 'Zhou Enlai attends the enlarged meeting of the Politburo Standing Committee Mao holds at Hangzhou. When Mao says planning powers must go down and the Center manage little in detail, Zhou puts in: part of the defence industry should go to local management too, since in war the Center cannot run it and should keep only the advanced work; the trend is down, not up. During the meeting he talks separately with Peng Zhen and the heads of the regions and calls on Nie Rongzhen.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 22 (Mar. 18, 1966). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Peng Zhen, Nie Rongzhen.'
      tags:
