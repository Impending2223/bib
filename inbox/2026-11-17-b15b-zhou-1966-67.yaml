      c: Zhou Enlai speaks at a mass rally at Tirana. How to keep revisionism from usurping Party and state, and capitalism from returning, no socialist state has a full experience; China, by Maos teaching, has taken basic measures. The Cultural Revolution of recent months is a sharp class struggle in ideology, in the end "a struggle of restoration against anti-restoration", which will strengthen the dictatorship of the proletariat.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 37–38 (June 27, 1966). To check: the speech as printed in the *Renmin ribao*. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
