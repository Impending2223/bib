- add:
    entry:
      id: cal.1966-10-21.china-leadership-2
      when: Oct. 21
      date: '1966-10-21'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of teachers and students of half-work, half-study schools come to Peking. Asked whether these are Maos educational thought: half-work, half-study with study first is, but it must be made concrete; the aim is a socialist-minded, educated laborer developed morally, mentally and physically; a school, whether full-time or half-work, is to put study first and learn work, farming and soldiering in the course. Not every school has "one small group"; some leaders have only individual or partial faults and are not power-holders on the capitalist road.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 21, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-22.china-leadership-2
      when: Oct. 22
      date: '1966-10-22'
      thread: china-leadership
      c: Zhou Enlai, with Tao Zhu and Li Fuchun, talks with Deng Xiaoping.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 22, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Deng Xiaoping.'
