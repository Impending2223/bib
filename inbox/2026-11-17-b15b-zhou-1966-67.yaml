- add:
    entry:
      id: cal.1966-11-08.china-leadership-2
      when: Nov. 8
      date: '1966-11-08'
      thread: china-leadership
      c: 'Liao Chengzhi and Li Jinde telephone Zhou Enlai: should Liu Shaoqi and Deng Xiaoping attend the Nov. 12 meeting for the centenary of Sun Yat-sens birth, which over a thousand Red Guards are to attend? If they come, they fear Red Guards will rush the platform or shout unfit slogans. Zhou: "Liu and Deng may ask leave and not attend; Red Guards may be invited, with work done beforehand."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 8, 1966). Made public: 2020. Names: Zhou Enlai, Liao Chengzhi, Li Jinde, Liu Shaoqi, Deng Xiaoping, Sun Yat-sen.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-08.china-leadership-3
      when: Nov. 8
      date: '1966-11-08'
      thread: china-leadership
      c: 'Zhou Enlai talks with delegates of the three Red Guard headquarters of Pekings colleges. Told by one "do not fear disorder, let the whole country go into disorder", he asks: "disorder like your surrounding Zhongnanhai, both west gates, with slogans that Tao Zhu has "risen straight into the clouds"? That is feudal thought; why should so old a comrade, a Central Committee member, not work at the Center?" On "bring out the fourth man": "what slogan is that? how do you treat Chairman Maos pupil and comrade?" Tao Zhu was right that the Health Ministrys Party committee is no black gang; great democracy has limits, with centralization too; Tao was elected to the Standing Committee at the Eleventh Plenum under Mao himself. The gates of Zhongnanhai and the State Council are so blocked that Maos own gate cannot open, and he goes by a small one: "I look on with sorrow." He asks the three headquarters to help.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85–86 (Nov. 8, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-09.china-leadership
      when: Nov. 9
      date: '1966-11-09'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Zhou Enlai talks with the Vietnam Workers Party delegation under Lê Duẩn. On the Cultural Revolution: if a party rests on a few mens prestige and not on Marxism-Leninism and Mao Zedong Thought taken to the masses, a few men of prestige can change its nature wholly; an error of line is not being anti-Party, we count it as a contradiction among the people; we say democratic centralism, but how socialist and proletarian democracy are to work has no model yet.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 86 (Nov. 9, 1966). Made public: 2020. Names: Zhou Enlai, Lê Duẩn.'
      tags:
      - name:zhou-enlai
      - name:le-duan
      - polity:prc
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1966-11-09.china-leadership-2
      when: Nov. 9
      date: '1966-11-09'
      thread: china-leadership
      c: 'Zhou Enlai chairs the discussion revising the *Renmin ribao* editorial "More on Grasping Revolution and Promoting Production", repeating that production and construction cannot be broken or stalled and rejecting talk that stresses "grasp revolution" and never production. The editorial is fixed to print the next day: the national economy is a whole, one link tied to the next, one department out of joint may touch all; farm and industrial output stopped for a moment touches the peoples livelihood; the Revolution in mines, enterprises, institutions and villages is not to take up production time or leave production posts, and the policy of "grasp revolution, promote production" is to be kept at all times.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 86–87 (Nov. 9, 1966). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-11-09.china-leadership-3
      when: Nov. 9
      date: '1966-11-09'
      thread: china-leadership
      also:
      - china
      c: The Shanghai Workers Revolutionary Rebel General Headquarters, under Wang Hongwen, is founded. The Shanghai committee, by the Sixteen Points and the Centers rule against organizations across trades, decides on a stand of not approving, not supporting and not joining.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 9, 1966). Made public: 2020. Names: Zhou Enlai, Wang Hongwen.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-10.china-leadership-2
      when: Nov. 10
      date: '1966-11-10'
      thread: china-leadership
      also:
      - china
      c: Before dawn the General Headquarters of Shanghais rebel workers, in the name of going to Peking to "lodge a complaint", lies on the rails at Anting station near Shanghai and stops the trains, cutting the Shanghai–Nanjing line for thirty-one hours.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 10, 1966). Made public: 2020. See [[cal.1966-11-09.china-leadership-3]]. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-10.china-leadership-3
      when: Nov. 10
      date: '1966-11-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, told of it, has Chen Boda wire the East China Bureaus Han Zheyi that the Bureau and the Shanghai committee must stand firm: the General Headquarters is not to be recognized as lawful nor lying on the rails as revolutionary action. He also wires the Shanghai workers at Anting that their act harms their own units output and badly harms the countrys traffic, and asks them to return to Shanghai at once and settle matters on the spot. The Cultural Revolution Group sends Zhang Chunqiao, who, behind the Center and the Shanghai committee, recognizes the General Headquarters and calls the Anting affair revolutionary action; afterward the Group and Mao approve his handling and stand.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 9, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda, Han Zheyi, Zhang Chunqiao, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:zhang-chunqiao
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11.china-leadership
      when: Nov., early
      date: 1966-11
      thread: china-leadership
      c: 'Zhou Enlai rules on the Red Guards plan to hold a rally of a hundred thousand at Tiananmen to criticize Tan Qilong and parade him: the criticism meeting is not to be held, nor the parade.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov., early 1966). Made public: 2020. Names: Zhou Enlai, Tan Qilong.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
      at: before 1966-11-01
- cite:
    id: cal.1966-11-10.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 10–11, 1966; Zhou with Mao at the seventh reception, two million out-of-town teachers, students and Red Guards)'
- add:
    entry:
      id: cal.1966-11-12.china-leadership-2
      when: Nov. 12
      date: '1966-11-12'
      thread: china-leadership
      c: 'Zhou Enlai speaks at the meeting for the centenary of Sun Yat-sens birth. Sun was a great revolutionary of the Chinese bourgeois-democratic revolution; the 1911 Revolution he led had great historical meaning: it did not finish the democratic task against imperialism and feudalism, but it ended over two thousand years of feudal monarchy and raised the spirit of democracy; the Chinese people will always remember his part.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87–88 (Nov. 12, 1966). Names: Zhou Enlai, Sun Yat-sen.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-11-13.china-leadership
      when: Nov. 13
      date: '1966-11-13'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, with Tao Zhu, Chen Yi, He Long, Xu Xiangqian, Ye Jianying, Xiao Hua, Yang Chengwu and the heads of the General Departments and services, receives at the Workers Stadium those in Peking from the armys academies and from cultural and sports units. He walks the field with Tao Zhu to meet the delegates and leaves. Chen Yi, Xu Xiangqian, Ye Jianying and others criticize extreme practices in the Cultural Revolution and stress that the army must not fall into disorder.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 13, 1966). Names: Zhou Enlai, Tao Zhu, Chen Yi, He Long, Xu Xiangqian, Ye Jianying, Xiao Hua, Yang Chengwu.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:chen-yi
      - name:he-long
      - name:xu-xiangqian
      - name:ye-jianying
      - polity:prc
- add:
    entry:
      id: cal.1966-11-14.china-leadership-2
      when: Nov. 14
      date: '1966-11-14'
      thread: china-leadership
      c: Zhou Enlai chairs the Centers liaison meeting. Gu Mu reports his views on the "Twelve Instructions on the Cultural Revolution in Factories" Chen Boda drafted in the Cultural Revolution Groups name and proposes a national industry-and-transport conference on how mines and factories are to carry it out. Zhou agrees and has the Twelve taken to the meeting for opinions.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 14, 1966). Made public: 2020. Names: Zhou Enlai, Gu Mu, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-14.china-leadership-3
      when: Nov. 14
      date: '1966-11-14'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on Wei Wenbos report that rebels keep on struggling against Li Baohua and Li Renzhi, tells Tao Zhu to telephone the Anhui committee; if true, to telephone the head of the "Aug. 27 Rebel Corps": in any case free Li and Li and let them go home to rest.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 14, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Wei Wenbo, Li Baohua, Li Renzhi, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-14.china-leadership-4
      when: Nov. 14
      date: '1966-11-14'
      thread: china-leadership
      c: 'Zhou Enlai calls an emergency meeting of the heads of Pekings college Red Guards: the weather turns cold and many out-of-town students are in Peking; whichever faction, take united action and help the PLA receive them well and give them political study and military training.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 14, 1966, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-11-14.china-leadership-5
      when: Nov. 14
      date: '1966-11-14'
      thread: china-leadership
      c: Zhou Enlai, on Yan Dakais request to return to Hebei for farm output, tells Tao Zhu, Li Fuchun and Li Xuefeng that if the North China Bureau names Xie Xueheng first secretary of the Tianjin committee, it is better for Yan to go back and run farming in Hebei.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 14, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Yan Dakai, Tao Zhu, Li Fuchun, Li Xuefeng.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:li-fuchun
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-11-15.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 15, 1966; Zhou at Maos on archive materials; next day the Politburo meeting revises the supplementary rules by Maos view, issued with his approval the same day)'
- add:
    entry:
      id: cal.1966-11-16.china-leadership-2
      when: Nov. 16
      date: '1966-11-16'
      thread: china-leadership
      c: 'Zhou Enlai receives Red Guard delegates of some Tianjin universities: Chen Bodas speech is not to spread, for it is still being revised; a national Red Guard organization will hardly do, an international one still less.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 16, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-11-16.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 16, 1966; Zhou finishes the Centers and State Councils notice on revolutionary linking up and sends it to Mao, who writes "return to the Premier to handle"; issued the same day: from Nov. 21 to the spring thaw teachers, students and Red Guards everywhere stop going by rail, ship and bus to Peking or elsewhere to link up)'
- add:
    entry:
      id: cal.1966-11-16.china-leadership-3
      when: Nov. 16
      date: '1966-11-16'
      thread: china-leadership
      c: Zhou Enlai attends the Peking middle schools meeting to criticize the bourgeois reactionary line.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 16, 1966, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-11-17.china-leadership-3
      when: Nov. 17
      date: '1966-11-17'
      thread: china-leadership
      c: Zhou Enlai tells Zheng Weishan that, from the trend of Red Guards coming to Peking, to prepare to receive three million. After they arrive they will have short military and political training by plan; 100,000 to 110,000 cadres of squad rank and above and old soldiers to be drawn from the army for the Red Guards military training.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89 (Nov. 17, 1966). Made public: 2020. Names: Zhou Enlai, Zheng Weishan.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-17.china-leadership-4
      when: Nov. 17
      date: '1966-11-17'
      thread: china-leadership
      c: Zhou Enlai lists eleven points for special guard (Zhongnanhai, Diaoyutai, the Defense Ministry, Public Security, Foreign Ministry, State Planning Commission, Xinhua, the *Renmin ribao*, the broadcasting building, the post and telegraph building, the Great Hall of the People) and orders their guard strengthened so that no one from outside can get in in any case.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 89–90 (Nov. 17, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-17.china-leadership-5
      when: Nov. 17
      date: '1966-11-17'
      thread: china-leadership
      c: Zhou Enlai receives delegates of the "88 Corps" and the "East Is Red" of the Harbin Military Engineering Institute and rebukes the 88 Corps for storming the National Defense Science Commission at Sanzuomen and seizing Lu Yang. Under Nie Rongzhen the Defense and State Science commissions did mostly well, the atom bomb and the missile are in the sky; to doubt everything is not scientific, nor Mao Zedong Thought, nor seeking truth from facts.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 90 (Nov. 17, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Lu Yang, Nie Rongzhen.'
      tags:
      - name:zhou-enlai
      - name:nie-rongzhen
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-11-17.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 90 (Nov. 17–23, 1966; before the planning and the industry-and-transport conferences Zhou has Yu Qiuli press the preparation, so as to fix the 1967 plan early and well, and has Gu Mu form a team on carrying out "grasp revolution, promote production"; the delegates reject the Twelve Instructions allowance of factory factions and student link-ups; Gu Mu drafts the Fifteen Articles)'
- add:
    entry:
      id: cal.1966-11-19.china-leadership
      when: Nov. 19
      date: '1966-11-19'
      thread: china-leadership
      c: 'Zhou Enlai attends the industry-and-transport symposium under Gu Mu and sums up the situation in four phrases: "just rising and hard to stop; the trend of the time; go with it and guide it." Go in with the attitude "if I do not enter the sea of woe, who will?"; guide the tide, stand forth to guard the Partys and states interest, and not complain if swept away oneself.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 90 (Nov. 19, 1966). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-11-22.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 90–91 (Nov. 22, 1966; Zhou and Li Fuchun report to Mao that Chen Boda and the Cultural Revolution Group object to the Fifteen Articles; Maos four points)'
- add:
    entry:
      id: cal.1966-11-19.china-leadership-2
      when: Nov. 19
      date: '1966-11-19'
      thread: china-leadership
      c: 'Zhou Enlai, told that the Peking Institute of Political Science and Law will hold a mass meeting to criticize Li Xuefeng and to chase Liu Shaoqi and Deng Xiaoping, tells Xinhua: the Center has settled the Liu and Deng question and it is not to be taken to the masses; the Center does not support such a meeting; Xinhua, the *Renmin ribao* and the radio are to send no reporters.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 91 (Nov. 19, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Xuefeng, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-11-20.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 91 (Nov. 20, 1966; Zhous instruction to forward the Peking committees Nov. 18 Important Notice to the bureaus and provincial committees, each to print it in its own name and post it in schools, mines and offices: no private detention, courts or beating)'
- add:
    entry:
      id: cal.1966-11-21.china-leadership
      when: Nov. 21
      date: '1966-11-21'
      thread: china-leadership
      c: 'Zhou Enlai, on the Peking Foreign Languages Institute students appeal, wall posters and loudspeakers at the Foreign Ministry over an exhibition abroad: tell the students he will see their delegates this week; no more protests at the Ministry or loudspeakers before the talk.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 91 (Nov. 21, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-23.china-leadership
      when: Nov. 23
      date: '1966-11-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, answering Du Ping, political commissar of the Nanjing Military Region, on students demand that Jiang Weiqing come to a meeting to make a self-criticism: tell the students he is ill and cannot attend, and could not make one if forced; when cured he will; the provincial committee to work with the students and avoid a deadlock.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 91 (Nov. 23, 1966). Made public: 2020. Names: Zhou Enlai, Du Ping, Jiang Weiqing.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-11-24.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 24, 1966; Zhous draft telegram to the Northwest Bureau on Liu Lantaos release from prison, with his letter to Mao: the Seventh and Eighth Congresses examined it, so the Center must admit it knew; Mao: "do as proposed")'
- cite:
    id: cal.1966-11-25.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 24, 1966; Zhou reviews and issues the Centers and State Councils telegram to the East China Bureau and Zhejiang committee, copy to all: public security organs are organs of dictatorship, to be kept working; masses who entered must leave at once; students and masses had burst into public security offices and hurt policemen in Zhejiang, Fujian, Xinjiang, Yunnan, Jilin and Hebei)'
- add:
    entry:
      id: cal.1966-11-24.china-leadership-3
      when: Nov. 24
      date: '1966-11-24'
      thread: china-leadership
      c: 'Zhou Enlai at the discussion and revision of the draft Provisions on the Cultural Revolution in Mining and Industrial Enterprises. Liu Lanbo, Lü Zhengcao and Lü Dong express anger at Chen Bodas and the Cultural Revolution Groups efforts to throw industry and transport into disorder. Zhou: "if we do not go to hell, who will? if we do not enter the tigers lair, who will?" All are to give up personal interest for the Party and state, in the spirit of going into the tigers lair for its cub, and to resolve to enter "hell".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 24, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Liu Lanbo, Lü Zhengcao, Lü Dong, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-11-25.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 25–26, 1966; Zhou with Mao at the eighth reception of out-of-town teachers, students and Red Guards)'
- add:
    entry:
      id: cal.1966-11-26.china-leadership
      when: Nov. 26
      date: '1966-11-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, receiving the delegates of the Sichuan group come to Peking to lodge complaints, orders: the Military Commission will take back tonight the weapons stored by the "East Is Red Commune" and the "Aug. 1 Red Flag Fighting Corps" of the Chengdu Geological Institute; the Commission is to check, not one bullet missing.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 93 (Nov. 26, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-27.china-leadership
      when: Nov. 27
      date: '1966-11-27'
      thread: china-leadership
      c: 'Zhou Enlai speaks at the collective reception by the Centers leaders of out-of-town teachers, students and masses. The present situation is "the trend of the time, not to be stopped": guide it, not block or stem it. Keep the two kinds of contradiction apart; those who erred in line are generally contradictions among the people. Great democracy has a limit; democracy and freedom go with centralization and discipline. Respect and trust the organs of dictatorship and the PLA; do not disturb the *Renmin ribao*, *Jiefangjun bao*, Xinhua, radio and television, nor foreign affairs, cipher and key organs. Removal or suspension of Party and government heads belongs to the committees and the Center; the ultimatum is no way to settle contradictions among the people.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 93 (Nov. 27, 1966). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-11-28.china-leadership
      when: Nov. 28
      date: '1966-11-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai revises and approves the State Councils telegram to the Chengdu workers who would come to Peking to petition, adding: think carefully, thousands of workers petitioning in Peking is hard to receive and talk with and hurts the factories output; if the other sides workers come likewise, output suffers more.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 93 (Nov. 28, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-28.china-leadership-2
      when: Nov. 28
      date: '1966-11-28'
      thread: china-leadership
      c: Zhou Enlai at the Cultural Revolution rally of the arts world under Chen Boda. After Jiang Qing calls for a full exposure of the "monstrous crimes" of the old Peking committee, Propaganda and Culture departments, Zhou says the aim of the Cultural Revolution is to strengthen the dictatorship of the proletariat, dig out the roots of revisionism, guard against capitalist restoration and speed the productive forces; the revolution in the arts has won a great victory over the revisionist black line in the arts, though he criticizes the arts world in places. The Group announces the Military Commission has named Jiang Qing adviser on cultural work to the PLA.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 93 (Nov. 28, 1966, the item after). See [[cal.1966-11-24.china-leadership]]. Names: Zhou Enlai, Chen Boda, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:jiang-qing
      - polity:prc
- add:
    entry:
      id: cal.1966-11-29.china-leadership
      when: Nov. 29
      date: '1966-11-29'
      thread: china-leadership
      c: 'Zhou Enlai, at the Workers Stadium, appears before the hundred thousand of the armys academies and cultural and sports units in Peking, and leaves. Chen Yi, Ye Jianying and others again criticize wrong practices in the Cultural Revolution. Afterward Jiang Qing charges in the Cultural Revolution Group: "these army receptions are suppressing the masses."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 13, 1966; "二十九日"). Names: Zhou Enlai, Chen Yi, Ye Jianying, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - name:ye-jianying
      - name:jiang-qing
      - polity:prc
- add:
    entry:
      id: cal.1966-11-30.china-leadership
      when: Nov. 30
      date: '1966-11-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai wires the "Red Rebel Corps" of the Jilin "Mao Zedong Thought Education University" and the Jilin Normal University Red Guards: on Zhao Lins release from prison, the Center on Nov. 26 replied to the Northeast Bureau and the Jilin committee; he asks them to follow it: the Center knows, and if they have new material they may send delegates to the Center, not publish or hunt it in meetings.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 94 (Nov. 30, 1966). Made public: 2020. Names: Zhou Enlai, Zhao Lin.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-30.china-leadership-2
      when: Nov. 30
      date: '1966-11-30'
      thread: china-leadership
      c: 'Zhou Enlai, on Shaanxi Secretary Li Ruishans wire that the Red Guards led by Xian Jiaotong University want delegates to sit in at the provincial committees three-level cadres meeting to hear self-criticisms of Liu Lantao and Zhao Shiyan, rules: Mao did say Red Guards and revolutionary students are not to attend the Partys three-level cadre meetings.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 94 (Nov. 30, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Ruishan, Liu Lantao, Zhao Shiyan, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-11-30.china-leadership-3
      when: Nov. 30
      date: '1966-11-30'
      thread: china-leadership
      c: 'Zhou Enlai speaks at the collective reception by the Centers leaders of masses from factories, mines, institutions and offices around the country. Because of the Cultural Revolution all have had problems; the Center is studying them and drafting decisions; they have been long away from their units, with production and work, and most may go back, leaving a few delegates. Chen Boda adds that in a word it is the Premiers instruction, the Centers spirit: make revolution and grasp and promote production, without hampering production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 94 (Nov. 30, 1966, the item after). Names: Zhou Enlai, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - polity:prc
- add:
    entry:
      id: cal.1966-12-01.china-leadership
      when: Dec. 1
      date: '1966-12-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews the Centers and State Councils Supplementary Notice on Revolutionary Linking Up by Teachers and Students of Colleges and Middle Schools and sends it to Mao: out-of-town teachers, students and Red Guards in Peking before Nov. 26 leave by Dec. 20; all linking up elsewhere to be back by Dec. 20, and from Dec. 21 no free rides; those still in Peking to get military and political training from the PLA and be sent home early; none to stop on the way. Mao: "return to the Premier, do as written."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 94–95 (Dec. 1, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-12-02.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 1, 1966; Zhous draft of the supplementary notice, sent Dec. 1, and Maos return of it)'
- add:
    entry:
      id: cal.1966-12-02.china-leadership-2
      when: Dec. 2
      date: '1966-12-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai drafts the Center General Offices wire to Sichuans Mianyang county committee, for the responsible man: of the thousand-odd workers taking different roads from Mianyang to Peking, send someone to Guangyuan to work on them, urge them by all means to go back to Chengdu by train, and let only delegates go north.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 2, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-02.china-leadership-3
      when: Dec. 2
      date: '1966-12-02'
      thread: china-leadership
      c: Zhou Enlai calls Tao Zhu, Li Fuchun, Yu Qiuli, Gu Mu and Cultural Revolution Group staff to discuss the Eight Points on Grasping Revolution and Promoting Production that Chen Boda drafted separately; the meeting makes them ten. He writes Mao on the meeting and suggests Mao talk with them on the 3rd or 4th about how revolution is to go in mines and enterprises.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 2, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Yu Qiuli, Gu Mu, Chen Boda, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:li-fuchun
      - name:chen-boda
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-02.china-leadership-4
      when: Dec. 2
      date: '1966-12-02'
      thread: china-leadership
      c: 'Zhou Enlai reviews Xinhuas draft report of the speeches of Chen Boda, Jiang Qing, Zhou and others at the Nov. 28 arts rally and draws double lines beside three places that name Peng Zhen, Liu Ren, Zheng Tianxiang, Wan Li, Deng Tuo, Chen Kehan, Li Qi, Zhao Yixin, Lu Dingyi, Zhou Yang, Lin Mohan, Xia Yan, Qi Yanming, Tian Han, Yang Hansheng and others as "counter-revolutionary revisionists". He sends it to Mao with a note: the Cultural Revolution Group has passed it and Lin Biao reviewed it; whether the naming on pp. 7, 9 and 13 is fit is for the Chairman to say.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 2, 1966, the item after). Made public: 2020. See [[cal.1966-11-28.china-leadership-2]]. Names: Zhou Enlai, Peng Zhen, Lu Dingyi, Zhou Yang, Lin Mohan, Xia Yan, Tian Han, Mao Zedong, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:peng-zhen
      - name:lu-dingyi
      - name:mao-zedong
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-12-03.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95 (Dec. 3, 1966; Mao strikes the three passages of names and returns it "to the Premier, changed, please consider again"; Zhou has Chen Boda, Kang Sheng and Jiang Qing read it and Tang Pingzhu print it as Mao marked)'
- add:
    entry:
      id: cal.1966-12-03.china-leadership-3
      when: Dec. 3
      date: '1966-12-03'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates of twelve mass organizations of the Peking Foreign Languages Institute and does not agree to their going to the Foreign Ministry to "feel for the black line". Mao does not favor the name "royalist", which hurts too many, nor "black gang", "black line". Of the charge that Feng Zhi, who went to the Afro-Asian Writers meeting, is "black gang": that was a Leftist meeting and the delegates chosen were Leftists. Of the charge that Chen Yi "mixes in mud" he asks why: his aim is to unite all, he has a good heart, a comrade long known, who has done much for the Party. He too once failed to understand; do not storm the Foreign Ministry, the Foreign Affairs Office, Public Security, Defense, Zhongnanhai, Diaoyutai or the Great Hall: he would step out to stop them.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 95–96 (Dec. 3, 1966). Made public: 2020. Names: Zhou Enlai, Feng Zhi, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-04.china-leadership-2
      when: Dec. 4
      date: '1966-12-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, told that Jiang Qing, Qi Benyu and others prompted some people to seize Peng Zhen, Liu Ren, Wan Li, Lin Mohan, Xia Yan, Tian Han and Xu Liqun before dawn, says that no precedent is to be set: men are not to be taken away at will. He tells the Peking garrison and Public Security to find them at once and sends Zhou Rongxin to learn from the Red Guard groups where they are. Afterward he rebukes the student bodies for abduction and tells them not to parade the men, gets them back, and has the garrison draw up a plan to protect them.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 96 (Dec. 4, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Qi Benyu, Peng Zhen, Liu Ren, Wan Li, Lin Mohan, Xia Yan, Tian Han, Xu Liqun, Zhou Rongxin.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:peng-zhen
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-12-04.china-leadership-3
      when: Dec. 4
      date: '1966-12-04'
      thread: china-leadership
      c: 'Zhou Enlai receives worker delegates from Chengdu who came to Peking and criticizes their forcing their way onto trains: the Red Guards transport is stopped chiefly to speed materials, fuel and other goods; as the working class they should know the Cultural Revolution is not to hurt production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 96 (Dec. 4, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-12-04.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 96 (Dec. 4–6, 1966; Zhou at the enlarged Politburo meeting under Lin Biao: Gu Mu reports on the industry-and-transport symposium; Lin Biao, Kang Sheng, Chen Boda and Wang Li attack Gus outline as saying "do not make the Cultural Revolution"; on the 6th, on Chens charge that Gu did not consult him, Zhou says he had Gu write it, overnight, with no time to ask opinion, and that though it has faults it did some work)'
- add:
    entry:
      id: cal.1966-12-06.china-leadership
      when: Dec. 6
      date: '1966-12-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai calls Chen Yi, Liao Chengzhi and Foreign Ministry officials on the Macao question.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 97 (Dec. 6, 15, 1966). Made public: 2020. Names: Zhou Enlai, Chen Yi, Liao Chengzhi.'
