      when: Oct. 19
      date: '1966-10-19'
      thread: china-leadership
      c: 'Zhou Enlai, on the "Mao Zedong Thought Red Guards" of the Peking Institute of Foreign Trade, who want Li Xiannian at their criticism of the bourgeois reactionary line on the 20th and three loudspeaker cars to play Lis recorded speech in the streets: Li may attend; the three cars are not allowed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 77–78 (Oct. 19, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-20.china-leadership
      when: Oct. 20
      date: '1966-10-20'
      thread: china-leadership
      c: Zhou Enlai, before dawn, receives Red Guard delegates of the Harbin Institute of Technology and warns them not to post at Tiananmen a poster against Liu Shaoqi. Even if Liu has erred, he has no right now to answer them; Liu is a Standing Committee member and head of state, and even replacing him need not be done by rousing the masses; be careful; what the Center has not urged and the Sixteen Points lack, think twice. The Eighth Congress constitution did not mention Mao Zedong Thought at Maos own proposal, owing to the world situation then. Workers and peasants cannot take leave or link up; to "bombard the headquarters" everywhere does not make every place a bourgeois headquarters. The unleashing of the masses to this degree is rare in history; the present Revolution is a struggle for power in thought, which Marx, Engels, Lenin and Stalin never waged.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 78 (Oct. 20, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-10-20.china-leadership-2
      when: Oct. 20
      date: '1966-10-20'
      thread: china-leadership
      c: Zhou Enlai chairs the Centers liaison meeting to study concrete measures on some policies.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 78 (Oct. 20, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
