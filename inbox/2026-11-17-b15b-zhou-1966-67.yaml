- add:
    entry:
      id: cal.1966-09-07.china-leadership-2
      when: Sept. 7
      date: '1966-09-07'
      thread: china-leadership
      also:
      - china
      c: 'The *Renmin ribao* prints the editorial "Grasp Revolution, Promote Production", drafted by Tao Zhu on Zhou Enlais instruction: revolution and production both; production units and offices to strengthen leadership; workers, commune members, technicians and others to hold their posts; students not to go to the villages and factories to interfere.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57–58 (Sept. 7, 1966). Names: Zhou Enlai, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - polity:prc
- add:
    entry:
      id: cal.1966-09-07.china-leadership-3
      when: Sept. 7
      date: '1966-09-07'
      thread: china-leadership
      c: 'Zhou Enlai, at the meeting of out-of-town students in Peking and at the debate meeting of the Academy of Sciences, refers to the editorial and asks that it be studied. At the Academy: besides the Cultural Revolution, the production struggle and scientific experiment go on; the Academys advanced research and many key experiments cannot be left aside as now; as for his own responsibility, he cannot watch it continue; the most urgent and needed work must not suffer in the Cultural Revolution.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58 (Sept. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-07.china-leadership-4
      when: Sept. 7
      date: '1966-09-07'
      thread: china-leadership
      c: 'Zhou Enlai, told that 340,000 out-of-town students are in Peking and still rising, beyond the reception offices strength, writes Jiang Qing and the Cultural Revolution Group, copy to Mao, Lin Biao, the Standing Committee and Secretariat: the Center should notify the provinces of the rise and its practical difficulties, and a central leader should urge the students in Peking to go home early.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58 (Sept. 7, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Mao Zedong, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:mao-zedong
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-08.china-leadership-2
      when: Sept. 8
      date: '1966-09-08'
      thread: china-leadership
      c: Zhou Enlai convenes the Centers liaison meeting, which adopts the Centers Provisions on the Cultural Revolution in the Villages below the County. Below the county it goes with the Four Cleanups; students and Red Guards, from Peking and elsewhere, not to link up in offices, communes and teams below the county, nor county-level cadres and commune members to go out; the autumn harvest first, the Four Cleanups may pause; breaking the "four olds" in the villages in the slack season; cadres who cannot go on are decided by the higher committee, not dismissed directly by the masses; paralyzed leadership to be quickly adjusted. The meeting discusses also Maos instruction of Sept. 7 on Qingdao.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 58–59 (Sept. 8, 1966). Made public: 2020. See [[cal.1966-09-14.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-08.china-leadership-3
      when: Sept. 8
      date: '1966-09-08'
      thread: china-leadership
      c: 'Zhou Enlai reviews the Centers Notice on Grasping Revolution and Promoting Production: offices, mines and enterprises to study the editorial; industry, farming, transport and commerce to form command organs; staff in production and research to keep their posts, students and Red Guards not to enter factories and research units; the Cultural Revolution of the busy units after hours or put off; no direct dismissal of leaders by the masses; quality, variety, thrift and safety, and the safety of hubs and warehouses. He sends it and the rural provisions to Mao with a letter: after reading the Jiangsu Cultural Revolution Groups telegram of Sept. 8 and the Shangrao Red Guard headquarters of Sept. 7, the two papers need a Politburo discussion before they go out.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 59–60 (Sept. 8, 1966, the item after). Made public: 2020. See [[cal.1966-09-14.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-08.china-leadership-4
      when: Sept. 8
      date: '1966-09-08'
      thread: china-leadership
      c: 'Zhou Enlai telephones Liu Lantao and the student delegates fasting before the gate of the Shaanxi Party committee: stop fasting, eat and get treatment; they may make demands, but not require Liu alone to answer; he himself cannot answer at once, knowing nothing of the facts; "you cannot stop eating because some have not been struck down and your demands are unanswered."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60 (Sept. 8, 1966, the item after). Made public: 2020. Check: the day; the chronology gives it under Sept. 8 with no day of its own. Names: Zhou Enlai, Liu Lantao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-08.china-leadership-5
      when: Sept. 8
      date: '1966-09-08'
      thread: china-leadership
      c: Zhou Enlai goes to Maos for a meeting, and talks in turn with Deng Xiaoping and Tao Zhu.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60 (Sept. 8, 1966, the item after). Made public: 2020. Check: the day. Names: Zhou Enlai, Mao Zedong, Deng Xiaoping, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:deng-xiaoping
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-10.china-leadership-2
      when: Sept. 10
      date: '1966-09-10'
      thread: china-leadership
      c: 'Zhou Enlai speaks at the meeting of all the "expeditionary fighters" of the Capital Colleges Red Guard Headquarters, giving the Red Guards about to link up elsewhere three tasks: fighting teams, study teams, propaganda teams. On visits to factories and villages, do not hamper local production: it is the "three autumns" season; support production; the editorial on revolution and production is written and he plans another. To those going to Shanghai: its output bears on the whole countrys construction and it has heavy tasks and many advanced scientific experiments; do not force on them what should not be done. A proletarian dictatorship needs the order of revolution and construction, or production suffers.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60 (Sept. 10, 1966). To check: the speech as printed or circulated. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-09-10.china-leadership-3
      when: Sept. 10
      date: '1966-09-10'
      thread: china-leadership
      c: 'Zhou Enlai, at the second symposium of Red Guard delegates of the capitals colleges and middle schools, answers their questions. What is to be broken is the four olds and what is to be opposed is the bourgeois power-holders; not all of them, nor every Party and government leader, take the capitalist road: "where would the Party Center be put?" Do not strike out at random or call every leader "black gang"; some leading organs and leaders have erred, but not all organs erred in direction or line; "black gang" and "black line" went out of use long ago, look at the Sixteen Points; to say all, or most, are bad is not true to fact. Stopping trains at will is anarchism and against Maos thought; it upsets the transport plan, and Pekings grain comes from outside.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 60–61 (Sept. 10, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-11.china-leadership-2
      when: Sept. 11
      date: '1966-09-11'
      thread: china-leadership
      c: Zhou Enlai calls Zhao Erlu and Liu Jie on the problem of Plant 221.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 61 (Sept. 11, 1966). Made public: 2020. Names: Zhou Enlai, Zhao Erlu, Liu Jie.'
      tags:
      - name:zhou-enlai
      - name:zhao-erlu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-12.china-leadership-2
      when: Sept. 12
      date: '1966-09-12'
      thread: china-leadership
      c: 'Zhou Enlai chairs the Centers liaison meeting: Tao Zhu, Kang Sheng, Li Fuchun, Ye Jianying, Xie Fuzhi, Gu Mu, Yu Qiuli, Zhao Erlu, Li Xiannian, Tan Zhenlin, Wang Dongxing, Zhou Rongxin, Zhang Chunqiao and Tong Xiaopeng attend.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 61 (Sept. 12, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Kang Sheng, Li Fuchun, Ye Jianying, Xie Fuzhi, Gu Mu, Yu Qiuli, Zhao Erlu, Li Xiannian, Tan Zhenlin, Wang Dongxing, Zhou Rongxin, Zhang Chunqiao, Tong Xiaopeng.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:kang-sheng
      - name:li-fuchun
      - name:ye-jianying
      - name:xie-fuzhi
      - name:zhao-erlu
      - name:li-xiannian
      - name:tan-zhenlin
      - name:zhang-chunqiao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-12.china-leadership-3
      when: Sept. 12
      date: '1966-09-12'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, on seeing a leaflet of the "Eliminate Islam Revolutionary Combat Team" (a body drawn from part of the Chinese Islamic Association), "Rise Up and Fight to Eliminate Islam to the End", that night has Xiao Xianfa, head of the State Councils Religious Affairs Bureau, find out the facts. He tells Zhang Jingwu by telephone that the leaflet is seriously wrong and he is to settle it on the 13th.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 61 (Sept. 12, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Xiao Xianfa, Zhang Jingwu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-13.china-leadership-2
      when: Sept. 13
      date: '1966-09-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhang Jingwu convenes the State Councils Religious Affairs Bureau and the Islamic Association, conveys Zhou Enlais instruction, and notifies the religious and nationalities offices and schools of 27 provinces, municipalities and regions: the leaflet is seriously wrong and void; each place to control and recall it.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 61–62 (Sept. 12, 1966, the item after). Made public: 2020. See [[cal.1966-09-12.china-leadership-3]]. Names: Zhou Enlai, Zhang Jingwu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-13.china-leadership-3
      when: Sept. 13
      date: '1966-09-13'
      thread: china-leadership
      c: 'Zhou Enlai, at the full meeting of the Red Guards of the Second Headquarters of the capitals colleges, speaks to over 12,000 about to leave for Guangxi, Changsha, Chengdu and Canton. On the Red Guards three tasks: tell struggle by argument from force, the two kinds of contradiction, inside the school from outside, home from abroad. Not all power-holders in cultural and educational and Party and government organs take the capitalist road; a leader who erred in line or direction is not thereby "black gang"; do not misuse the word. In Shanghai someone asked if he said the Shanghai committee was not a black gang but revolutionary: he did say so; error of line is not being unrevolutionary or anti-Party, nor to be raised at once to a contradiction between enemy and us. Rely on the masses with leadership; the Cultural Revolution is Chinas own affair, abroad only propaganda, not forcing our views on others.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 62 (Sept. 13, 1966). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1966-09-14.china-leadership-4
      when: Sept. 14
      date: '1966-09-14'
      thread: china-leadership
      c: 'Zhou Enlai chairs the Centers liaison meeting, which agrees to study at once the economic and social policies of the Cultural Revolution: groups under each branchs heads to gather material and make first proposals for the liaison meeting, then Maos approval or the Politburo.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 62 (Sept. 14, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-14.china-leadership-5
      when: Sept. 14
      date: '1966-09-14'
      thread: china-leadership
      c: 'Zhou Enlai reviews Tao Zhus draft Notice on Pressing the Study of Social Policy Questions in the Cultural Revolution, which lists eight areas needing policy: the reform of landlords, rich peasants, counter-revolutionaries, bad elements and rightists; democratic parties, the national bourgeoisie, the federation of industry and commerce and their figures; natural scientists and other senior intellectuals; overseas Chinese, religion, foreign affairs, nationalities. He revises it many times.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 62–63 (Sept. 14, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-23.china-leadership
      when: Sept. 23
      date: '1966-09-23'
      thread: china-leadership
      c: Zhou Enlai, revising the Notice on social policy questions, adds that the Cultural Revolution Group should first send reporters of the newspapers and other staff to the places concerned and to important cities to inquire and collect material; and that after National Day the liaison meetings sessions on principle will take the questions one by one, by urgency and readiness.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 14, 1966; "九月二十三日"). Made public: 2020. See [[cal.1966-09-14.china-leadership-5]]. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-09-15.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 15, 1966; Zhous speech: farm and industrial output; workers, commune members, technicians and cadres to keep their posts; Red Guards not to link up in factories and below the county)'
- add:
    entry:
      id: cal.1966-09-15.china-leadership-3
      when: Sept. 15
      date: '1966-09-15'
      thread: china-leadership
      c: Zhou Enlai, learning late at night that two organizations at the Peking No. 1 Cotton Mill are in fierce dispute and may come to blows, telephones Gu Mu to settle it, and Qian Zhiguang to have Jiao Shanmin find and settle it that night.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu, Qian Zhiguang, Jiao Shanmin.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-15.china-leadership-4
      when: Sept. 15
      date: '1966-09-15'
      thread: china-leadership
      c: Zhou Enlai calls Nie Rongzhen on problems of the Seventh Ministry of Machine Building.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63 (Sept. 15, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen.'
      tags:
      - name:zhou-enlai
      - name:nie-rongzhen
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-16.china-leadership-2
      when: Sept. 16
      date: '1966-09-16'
      thread: china-leadership
      c: Zhou Enlai chairs the Centers liaison meeting, which discusses Li Xiannians draft report on several policy questions in finance, trade and handicrafts, among other matters. Joint state-private firms to become state ones and the capitalists fixed interest to be ended altogether; large cooperative shops, where ready, step by step to state shops; small traders and peddlers to remain, buying and selling for the state shops; the self-employed to stay and, where ready, form cooperative groups or join cooperatives; the grain ration of the non-farm population not to be raised for now. The paper goes out Sept. 23.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 63–64 (Sept. 16, 1966). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-16.china-leadership-3
      when: Sept. 16
      date: '1966-09-16'
      thread: china-leadership
      c: 'Zhou Enlai receives E. F. Hill, chairman of the Communist Party of Australia (Marxist-Leninist). On the Cultural Revolution: the views in the wall posters are not wholly ours; many are those of one school, one Red Guard squad or one group.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 16, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Edward Hill.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+australia
- add:
    entry:
      id: cal.1966-09-16.china-leadership-4
      when: Sept. 16
      date: '1966-09-16'
      thread: china-leadership
      c: 'Zhou Enlai reviews Gu Mus report on settling the struggle of the two organizations at the State Economic Commission, agrees that students may not link up in factories and still less move into the ministries and commissions and disturb the state organs, and writes: hold to keeping revolutionary teachers and students out of liaison stations in the ministries and commissions, though liaison men may visit them regularly.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 16, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Gu Mu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-17.china-leadership-2
      when: Sept. 17
      date: '1966-09-17'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai revises and issues the Centers and State Councils telegram to the bureaus and the provincial, municipal and regional committees on securing rail transport: rail transport is under great strain, and so as not to hurt farm and industrial output the revolutionary teachers and students of each place are for now not to go to other provinces and cities to link up.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 17, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-17.china-leadership-3
      when: Sept. 17
      date: '1966-09-17'
      thread: china-leadership
      c: Zhou Enlai telephones Deng Xiaoping.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 17, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Deng Xiaoping.'
      tags:
      - name:zhou-enlai
      - name:deng-xiaoping
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-18.china-leadership
      when: Sept. 18
      date: '1966-09-18'
      thread: china-leadership
      c: 'Zhou Enlai drafts the Centers reply to the Jilin committee, copy to the bureaus, on the pay of those criticized and struggled against: even those whose case is decided, no change for now; if a man draws less pay, or gives part of it as Party dues, that is his own wish, not to be forced, and he is not to be made ill by spending less; those not yet decided keep their pay.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 18, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-18.china-leadership-2
      when: Sept. 18
      date: '1966-09-18'
      thread: china-leadership
      c: Zhou Enlai calls Song Renqiong, Li Fuchun, Tao Zhu, Kang Sheng and Cultural Revolution Group staff to discuss the Cultural Revolution in the three Northeast provinces.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64 (Sept. 18, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Song Renqiong, Li Fuchun, Tao Zhu, Kang Sheng.'
      tags:
      - name:zhou-enlai
      - name:li-fuchun
      - name:tao-zhu
      - name:kang-sheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-21.china-leadership
      when: Sept. 21
      date: '1966-09-21'
      thread: china-leadership
      c: Zhou Enlai calls Song Renqiong, Gu Zhuoxin, Ma Mingfang and Pan Fusheng on Heilongjiang.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 64–65 (Sept. 18, 1966, the item after; "二十一日"). Made public: 2020. Names: Zhou Enlai, Song Renqiong, Gu Zhuoxin, Ma Mingfang, Pan Fusheng.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-20.china-leadership
      when: Sept. 20
      date: '1966-09-20'
      thread: china-leadership
      c: 'Zhou Enlai writes Jiang Qing: the two notices on economic policy in the Cultural Revolution, on farming and industry and on research, have helped production; the revised draft on finance, trade and handicrafts has been with the Cultural Revolution Group some days, and Chen Boda is asked to attend to it, so that it may be discussed and put to the Politburo.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 65 (Sept. 20, 1966). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-21.china-leadership-2
      when: Sept. 21
      date: '1966-09-21'
      thread: china-leadership
      c: Zhou Enlai talks with representatives of three Red Guard groups of the Harbin Engineering Institute. If industry keeps being hit next years output will be too; more important are the advanced projects, a month lost this year, where a slightly wrong part will not do; this is not "theory of weapons alone". Recognize and support the leadership of the Heilongjiang committee, and see two sides in it and in each cadre; "black gang" and "black line" are no longer used by the Center; absolute thinking is not Maos thought. A leaflet calling to overthrow Islam would split the nationalities at home and Afro-Asia abroad. The mistake in sending work groups does not void the Four Cleanups teams. Papers, Xinhua, TV and radio are tools of dictatorship and no group may occupy them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 65 (Sept. 21, 1966). Made public: 2020. Names: Zhou Enlai, Song Renqiong.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-22.china-leadership
      when: Sept. 22
      date: '1966-09-22'
      thread: china-leadership
      c: 'Zhou Enlai convenes the Party-group members of the State Councils branches and ministries and says: cadres must stand the test, be sober, not fear "shelling", and bear responsibility and grievance before the masses; the Red Guards are new and cannot be stopped, support, protect and explain policy to them; do not use the two sides struggle against each other; drop "black gang", "black line" and "five black categories". Policy on democratic parties, religion, nationalities, senior intellectuals, overseas Chinese and foreign affairs is to be thought out and taken up after National Day. Ulanhu, Saifudin and Ngapo are to be protected on purpose; Liu Wenhui and Jiang Guangnai too are to go up on Tiananmen.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 65–66 (Sept. 22, 1966). Made public: 2020. Names: Zhou Enlai, Ulanhu, Saifudin, Ngapo Ngawang Jigme, Liu Wenhui, Jiang Guangnai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-22.china-leadership-2
      when: Sept. 22
      date: '1966-09-22'
      thread: china-leadership
      c: Zhou Enlai views the film of the nuclear test.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 22, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-23.china-leadership-2
      when: Sept. 23
      date: '1966-09-23'
      thread: china-leadership
      c: 'Zhou Enlai, on the appeal from the Haocun agricultural middle school, Jiaohe County, Hebei, to the farmers of the country to hand all private plots, gardens and trees to the commune, notes: he has asked the farm office to send cadres to Haocun and to Pekings outer counties to find in what circumstances and by whom the appeal was made, since it has good and bad sides; if agricultural middle schools below the county spring up everywhere at once, farming suffers.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 23, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-23.china-leadership-3
      when: Sept. 23
      date: '1966-09-23'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai tells Red Guards about to go to eastern Inner Mongolia to investigate that they may not go to the areas near the border: that breaks the rule.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 23, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-24.china-leadership-2
      when: Sept. 24
      date: '1966-09-24'
      thread: china-leadership
      c: 'Zhou Enlai reviews the General Political Departments and General Staffs report proposing that villages, mines, enterprises, institutions, Party and government offices and mass bodies form no Red Guards, and the Centers note forwarding it to the country. The note: the Peking, Shandong, Jilin and Shaanxi military commands report Red Guards spreading from schools to the villages and enterprises; some have formed in the militia, carry arms and have used force, and hurt production. On Xu Xiangqians proposal, no Red Guards or guards corps in villages and enterprises; the militia to hold its posts, grasp revolution and promote production, and bring in the autumn harvest. Issued the next day.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 66 (Sept. 24, 1966). Made public: 2020. See [[cal.1966-09-17.china-leadership]]. Names: Zhou Enlai, Xu Xiangqian.'
      tags:
      - name:zhou-enlai
      - name:xu-xiangqian
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-09-24.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 67 (Sept. 24, 1966; Zhou chairs the Centers liaison meeting, which settles the telegram on the Peking Red Guards plan to parade a hundred or two hundred capitalists in Shanghai; sent that night with Maos consent)'
- add:
    entry:
      id: cal.1966-09-25.china-leadership
      when: Sept. 25
      date: '1966-09-25'
      thread: china-leadership
      also:
      - testing
      c: 'Zhou Enlai chairs the 16th meeting of the Central Special Commission. The Center has decided that factories, research bodies, villages, Party and government offices and mass bodies form no Red Guards, and those formed are to be dissolved by agreement; put the energy into research and production. The atomic bomb owes much to the experts: they are not capitalists or rightists, and so long as they work hard, even with faults of thought, unite with them in work. Maximum democracy and maximum centralization both: to withhold the first or fail to rouse the masses is a Right deviation; to give the organs of dictatorship to the masses is tailism, a Right deviation in "Left" form. Restore the rules that should not have been smashed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 67 (Sept. 25, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-25.china-leadership-2
      when: Sept. 25
      date: '1966-09-25'
      thread: china-leadership
      c: 'Zhou Enlai receives the leaders of the Capital Colleges Red Guard Revolutionary Rebel Headquarters. To those who call his Sept. 15 speech a great poisonous weed: not so, the Center studied it and Mao read it; "grasp revolution, promote production" is not early; advanced projects, the autumn farm season and the workers work cannot wait; linking up elsewhere is to stop; capitalists are not to be paraded, nor their homes, nor those of their leaders, searched. Asked whether one who erred in line is revolutionary or not: he too once erred in line, yet is not unrevolutionary or counter-revolutionary; Chen Duxiu represented a wrong line but was not without any use. He has told Mao the Partys history should be told the young entire, errors with successes, and Mao agreed. Two fears to avoid: step forward and meet the teachers and students, and dare to point out and explain policy against violations.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 67–68 (Sept. 25, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
