      also:
      - china
      c: Zhou Enlai attends the Cultural Revolution Groups liaison meeting, hearing the Jiangxi preparatory group and Shanxis revolutionary committee, and discusses forming a Jiangxi revolutionary committee. After it he talks with the Peking Military Regions heads and Liu Geping.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (Dec. 26, 1967). Made public: 2020. Names: Zhou Enlai, Liu Geping.'
      tags:
