- add:
    entry:
      id: cal.1966-10-28.china-leadership-2
      when: Oct. 28
      date: '1966-10-28'
      thread: china-leadership
      c: 'Zhou Enlai speaks at the plenary session of the Central Work Conference, explaining some concrete rules: (1) Pekings teachers and students not to link up outside for now, to free transport for out-of-town students to go home; (2) Red Guards generally limited to revolutionary youth under thirty in schools, and not to be formed in villages, cities, mines, enterprises, institutions and offices, which cannot stop production or work for revolution; the army, public security, courts, prisons, Xinhua, newspapers and broadcast and television stations to be held by the Party; Red Guards may require leaders to come and explain and make self-criticism but not suspend or dismiss them, seize them, raid their homes or beat them; (3) Four Cleanups teams are not the same as the present work groups; (4) get out from under the work-group files. He gives four points of his own experience in working with Red Guards: step forward and meet them, support them warmly, be a pupil before a teacher, hold ones ground and explain policy. "To tell the truth, I never dreamed of such a situation." A timetable: could provincial and regional organs end their movement before the Spring Festival, and the Centers ministries too? The conference closes that day.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 82 (Oct. 28, 1966, the item after). Made public: 2020. See [[cal.1966-10-09.china-leadership]]. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
