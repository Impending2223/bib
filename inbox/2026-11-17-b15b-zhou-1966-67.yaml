      when: Nov. 12–29
      date: '1966-11-12'
      thread: china-leadership
      c: Zhou Enlai holds over ten talks with Academy of Sciences delegates and with members of the Academys Party committee.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 7, 1966; "十二日至二十九日"). Made public: 2020. Check: the days of the talks. Names: Zhou Enlai.'
