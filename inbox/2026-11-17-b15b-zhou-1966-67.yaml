      - vis:only:prc
- cite:
    id: cal.1967-07-17.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 17, 1967; Zhou at Maos with Xie Fuzhi and Wang Li, Yang Chengwu, Wang Dongxing, Yu Lijin and Zheng Weishan, hearing the Yunnan, Guizhou, Sichuan and Wuhan questions; Mao has Zhou go back to Peking on the 18th to settle Hunan; Mao says that the May 16 notice was fixed by him and Zhou on the spot and issued so fast that it raised much talk and the blame fell on Zhou)'
- add:
    entry:
      id: cal.1967-07-17.china-leadership-2
      when: July 17
      date: '1967-07-17'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with Chen Zaidao and Zhong Hanhua.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 17, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua.'
