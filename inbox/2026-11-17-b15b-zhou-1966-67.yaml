- add:
    entry:
      id: cal.1966-03-31.china-leadership
      when: Mar. 31
      date: '1966-03-31'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, with Peng Zhen and others, hears Kang Sheng relay Maos talks, held away from Peking, with Kang, Jiang Qing and Zhang Chunqiao. Mao calls the February Outline wrong, confusing class lines and reversing friend and enemy; the Propaganda Department is the Palace of the King of Hell: overthrow the King, free the little devils.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27–28 (Mar. 31, 1966). Made public: 2020. See [[cal.1966-03-28.china-leadership-2]]. Names: Zhou Enlai, Peng Zhen, Kang Sheng, Mao Zedong, Jiang Qing, Zhang Chunqiao.'
      tags:
      - name:zhou-enlai
      - name:peng-zhen
      - name:kang-sheng
      - name:mao-zedong
      - name:jiang-qing
      - name:zhang-chunqiao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-31.china-leadership-2
      when: Mar. 31
      date: '1966-03-31'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai flies to Shijiazhuang.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 28 (Mar. 31, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-04-01.china-leadership
      when: Apr. 1
      date: '1966-04-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, in the second quake zone (Dongwang and Gengzhuangqiao communes in Ningjin, Matouli commune, and Hejiazhai commune in Julu), inspects drought work and spring sowing and speaks at a mass meeting. Relief must not miss the farm season: production first, houses after; turn his four phrases round to "self-reliance, hard work, produce, rebuild homes". Rely on oneself and the collective; the state helps but mainly oneself. The area hit was large but losses small because the first quake taught; record the costly lessons for later generations. The masses may criticize failures in relief. Visits over 140 patients at Dongwangs temporary hospital; reaches Xingtai at night.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 24 (Apr. 1, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-04-01.china-leadership-2
      when: Apr. 1
      date: '1966-04-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at Gengzhuangqiao, inspecting the Academy of Sciences earthquake team: prediction must be accurate and in time. To the University of Science and Technologys seismology students: he hopes their generation will solve earthquake prediction. He orders Pekings building designers brought to the site, to settle what houses will stand a quake. Apr. 27, receiving Li Siguang and Weng Wenbo: the prediction is the task he gives them.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 24 (Apr. 1, 1966, the item after). Made public: 2020. Names: Zhou Enlai, Li Siguang, Weng Wenbo.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-04-02.china-leadership-2
      when: Apr. 2
      date: '1966-04-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, Handan, talks with provincial and prefectural leaders and hears of the well-digging drought work. He doubts the order to dig 7,000 wells in the area by the end of April: first save the wheat harvest and spring sowing; wells after the wheat or autumn harvest. "Haste makes waste."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 24–25 (Apr. 2, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-04-03.china-leadership
      when: Apr. 3
      date: '1966-04-03'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the Zhanghe Forest brigade, Wei County, with cadres and villagers. He objects to writing "Party members" and "the masses" apart: write Party members and non-members, all are masses; a Party man cut off from the masses becomes an official. On wells: fit pumps and lines, place labor sensibly. In the afternoon at Qiansangquan brigade, Daming County, he tells Qian Zhengying to have the Water Conservancy Institute send men to guide well work, and the State Council working group in residence to see the wells equipped. Told the brigade paid no cash for two years and its grain is 5.7 liang a day, he says he is sorry; angry that the supply and credit cooperatives withheld the cotton-seed and fertilizer money. In the evening with Damings county committee: dismayed that over 9,000 people and 3,000 carts were drawn to the Haihe works ("if I were secretary I would refuse"); wells use much labor in the busy April.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 25 (Apr. 3, 1966). Made public: 2020. Names: Zhou Enlai, Qian Zhengying.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-04-04.china-leadership
      when: Apr. 4
      date: '1966-04-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, Linzhang County, talks with cadres and villagers and the county secretary: decades of backwardness in farming cannot be turned in a year; the countys well plan cannot be done in a year; "I reserve on watering everything in one year."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 25 (Apr. 4, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-04-05.china-leadership
      when: Apr. 5
      date: '1966-04-05'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at Ci County, to officials of Hebei, Handan and the central departments, repeating what the days inspection showed. The drive for wells has run hot: "active attitude, steady steps, voluntary, self-reliance", neither phrase to be dropped; no added burdens on the people; mechanization step by step; relief joined to production, loans to spur self-help, not dependence.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 25–26 (Apr. 5, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-04-05.china-leadership-2
      when: Apr. 5
      date: '1966-04-05'
      thread: china-leadership
      c: 'Zhou Enlai inspects the Yuecheng Reservoir. A reservoir serves flood control and irrigation together: in a dry year irrigation counts more; plan for all uses, farm and forest too; the water department to see it through. Told part of the main dam was built by dumping earth into water, he calls it unsafe, to be watched, and the method to be recorded in the project file: do not hide faults from later generations. On earthquakes: find their laws; prediction not yet solved anywhere; "why not we first?"'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26 (Apr. 5, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-04-06.china-leadership
      when: Apr. 6
      date: '1966-04-06'
      thread: china-leadership
