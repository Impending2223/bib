      when: May 19
      date: '1967-05-19'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Railways Ministry rebels. To a proposal to smash the Ministrys business supervision group: "you go too fast to principle"; "I announce military control of the Railways Ministry; if you storm again you will be dealt with as under military control."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 19, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
