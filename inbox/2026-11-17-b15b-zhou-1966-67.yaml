      date: '1966-01-23'
      thread: china-leadership
      c: 'Zhou Enlai writes Deng Xiaoping, Peng Zhen and Li Fuchun: he goes to Tianjin this afternoon to treat a hand ailment; urgent diplomatic and defence matters to Deng for decision, the State Councils routine requests to Li Fuchun.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 5 (Jan. 23, 1966). Made public: 2020. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun.'
