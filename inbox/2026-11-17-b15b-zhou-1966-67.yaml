      when: May 18
      date: '1967-05-18'
      thread: china-leadership
      c: Zhou Enlai convenes the State Councils business group.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 18, 1967). Made public: 2020. Names: Zhou Enlai.'
