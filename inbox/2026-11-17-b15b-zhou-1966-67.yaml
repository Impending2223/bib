      thread: china-leadership
      c: Zhou Enlai, with Tao Zhu, Chen Boda, Kang Sheng, Jiang Qing and Yao Wenyuan, attends the capitals meeting marking the thirtieth anniversary of Lu Xuns death. Yao Wenyuan, speaking, calls for criticism of "eclecticism, fairness and compromise", a hint at Zhou.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 84 (Oct. 31, 1966, the item after). Names: Zhou Enlai, Tao Zhu, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan.'
