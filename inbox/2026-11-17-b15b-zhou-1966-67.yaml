    entry:
      id: cal.1967-03.china-leadership-2
      when: Mar.
      date: 1967-03
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, in instructions to the Fuzhou Military Region: revolutionary mass bodies are not to fight with arms, nor to hit, smash, loot, search, raid and seize.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 139 (Mar. 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
