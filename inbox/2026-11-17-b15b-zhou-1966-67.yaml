    entry:
      id: cal.1967-07-12.china-leadership-3
      when: July 12
      date: '1967-07-12'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives delegates of the foreign-affairs systems mass bodies and criticizes the extreme "Left" practice of Chinese embassy staff abroad forcing foreign friends to wear Mao badges in their propaganda.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 12, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-13.china-leadership-3
      when: July 13
      date: '1967-07-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews and signs the State Councils and Military Commissions telegram to the military control committee of Plant 221 and the "Prairie Red Rebel Headquarters" and other bodies: stop the armed fight at once, and quickly restore production and normal order.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-14.china-leadership-2
      when: July 14
      date: '1967-07-14'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai leaves Peking at 2:30 a.m. for Wuhan. On arrival he talks in turn with the heads of the Wuhan Military Region and the Wuhan air force, and in the evening goes to Maos.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 14, 1967). Made public: 2020. See [[cal.1967-07-14.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-15.china-leadership
      when: July 15–18
      date: '1967-07-15'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai calls the meeting of the heads of the Wuhan Military Region, the Hubei Military District and the Wuhan air force and hears their reports. July 18, in the afternoon, he sums up: he affirms the Regions work in grasping revolution and promoting production, and proposes that Chen Zaidao and Zhong Hanhua admit of their own accord that supporting the Left went wrong in direction and line. The Regions errors are the responsibility of its chief leaders; the Cultural Revolution is without precedent and they had no experience; one examines an error and corrects it, and when corrected it is well; they are asked to admit error and write self-criticism to protect them, not to down them. Before the meeting he told Zhong Hanhua that Mao, setting out, said he was to go to Wuhan to protect Chen Zaidao.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 166 (July 15–18, 1967). Made public: 2020. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-16.china-leadership
      when: July 16
      date: '1967-07-16'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai talks with the two factions at the East Lake hostel, Wuchang.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 16, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
