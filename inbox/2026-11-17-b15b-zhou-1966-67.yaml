      date: '1966-05-10'
      thread: china-leadership
      also:
      - china
      - soviet-union
      c: 'Zhou Enlai, at Shehus farewell banquet, sharply denounces collusion of the U.S. and the Soviet Union in a nuclear monopoly: Chinas test is a great encouragement to all peoples; in no circumstances will China use nuclear weapons first. The nights of the 10th and 11th he does not sleep, drafting the China–Albania joint statement.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 30 (May 10, 1966). Made public: 2020. Names: Zhou Enlai, Mehmet Shehu.'
      tags:
