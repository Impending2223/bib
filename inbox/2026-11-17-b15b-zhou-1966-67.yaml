- add:
    entry:
      id: cal.1967-07-18.china-leadership-3
      when: July 18
      date: '1967-07-18'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, after going to Maos in the evening with Chen Zaidao, Zhong Hanhua and others, flies back to Peking at 11:30 p.m.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 18, 1967, the item after). Made public: 2020. See [[cal.1967-07-18.china-leadership]]. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-19.china-leadership
      when: July 19
      date: '1967-07-19'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, in the evening, talks with the Hunan leaders and then receives the delegates of Hunans two factions to settle the Changsha railway problem.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 19, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-07-20.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 20, 1967; the Wuhan Incident: Xie Fuzhi and Wang Li, the Centers delegation, suppress the "Million Heroes" backed by the Wuhan Military Region and call it a "conservative organization"; on the 20th the Heroes haul Wang Li from his lodging to the Regions compound and question him; Wang is later falsely made out to have been a "mutiny" by Chen Zaidao, a "counter-revolutionary incident")'
- add:
    entry:
      id: cal.1967-07-20.china-leadership-2
      when: July 20
      date: '1967-07-20'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai goes to Lin Biaos for a meeting and in the afternoon flies to Wuhan. Wu Faxian falsely says Chen Zaidao has sent troops to ring the Wangjiadun airfield to seize Zhou, and has Zhous plane diverted to a hillside field over sixty kilometers from Wuhan. Zhou leaves his secretary and two companies of guards at the hillside field and, with two bodyguards, drives to the city to talk with Wuhan Region cadres and steady the situation.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 20, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Lin Biao, Wu Faxian, Chen Zaidao.'
      tags:
      - name:zhou-enlai
      - name:lin-biao
      - name:wu-faxian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-21.china-leadership-2
      when: July 21
      date: '1967-07-21'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai arranges for Mao to leave Wuhan before dawn for Shanghai.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 167 (July 21, 1967). Made public: 2020. See [[cal.1967-07-21.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-22.china-leadership-4
      when: July 22
      date: '1967-07-22'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai calls Ye Ming, Kong Qingde, Li Zuopeng and Liu Feng at the Wangjiadun airfield, Wuhan, and has Kong Qingde run the Wuhan Military Region for the time. The Wuhan air force is under double leadership and is to follow the Regions command, not take stands at will. Chen Zaidao and Zhong Hanhua are to take a stand quickly and win the initiative. In the afternoon he flies back to Peking.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967). Made public: 2020. Names: Zhou Enlai, Ye Ming, Kong Qingde, Li Zuopeng, Liu Feng, Chen Zaidao, Zhong Hanhua.'
      tags:
      - name:zhou-enlai
      - name:li-zuopeng
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-07-22.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967; Zhou at the full meeting of the Cultural Revolution Group under Lin Biao, who calls the July 20 incident a "counter-revolutionary riot")'
- add:
    entry:
      id: cal.1967-07-22.china-leadership-5
      when: July 22
      date: '1967-07-22'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai drafts the Centers telegram to the Wuhan Military Region: the Center considers that the Million Heroes coming to Peking with delegates will not soon be settled and that Wuhan needs quick calming, so asks Chen Zaidao, Zhong Hanhua, Fu Chuanzuo, Liu Feng, Niu Huailong and seven others to come to Peking first for a talk.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua, Fu Chuanzuo, Liu Feng, Niu Huailong.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-07-22.china-leadership-3
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 22, 1967; Jiang Qing, receiving Henans mass delegates, affirms "attack by argument, defend by force" and urges that they keep their arms; the slogan is printed in Shanghais *Wenhui bao* the next day and armed fights across the country sharply rise)'
- add:
    entry:
      id: cal.1967-07-23.china-leadership
      when: July 23
      date: '1967-07-23'
      thread: china-leadership
      c: Zhou Enlai goes to Lin Biaos for meetings on the 23rd and 24th.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 23, 24, 1967). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-24.china-leadership-2
      when: July 24
      date: '1967-07-24'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai lodges Chen Zaidao and eleven others, come to Peking, at the Jingxi Hotel and tells them to keep it secret. Told that rebels backed by the Cultural Revolution Group are surrounding and storming the hotel to drag them out for struggle, he sends Fu Chongbi and others to the spot: in no case may they be taken; Chen Zaidao and Zhong Hanhua are to be protected. He then orders Qi Benyu to deal with it: "if they are taken away you must answer to the Chairman." Qi is made to go and tell the rebels to leave.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Zaidao, Zhong Hanhua, Fu Chongbi, Qi Benyu, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-24.china-leadership-3
      when: July 24
      date: '1967-07-24'
      thread: china-leadership
      c: Zhou Enlai hears Yang Chengwu, who returned to Peking from Maos southern tour.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 24, 1967, the item after). Made public: 2020. See [[cal.1967-07-24.china-leadership]]. Names: Zhou Enlai, Yang Chengwu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-07-25.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168 (July 25, 1967; Zhou at the Tiananmen rally of a million welcoming Wang Li back "in victory")'
- add:
    entry:
      id: cal.1967-07-25.china-leadership-3
      when: July 25
      date: '1967-07-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates of both Anshan factions and sharply criticizes the two for harming output by faction: unite and go back at once to restore production. He cannot believe the Anshan question cannot be solved; if he could find time he would go; output has fallen to a thousand-odd tons a day and many coke ovens have stopped; he does not believe Anshans working class can watch it collapse without pain.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 168–169 (July 25, 1967, the item after). Made public: 2020. Check: the chronologys note says that Jiang Qing, Chen Boda, Kang Sheng and Zhang Chunqiao first opposed Zhous proposal that Li Fuchun go to Anshan, then proposed Guan Feng, and that Zhou did not agree. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-26.china-leadership-2
      when: July 26
      date: '1967-07-26'
      thread: china-leadership
      c: Zhou Enlai talks before dawn with Wu Faxian, Zhang Xiuchuan, Zheng Weishan, Tan Furen, Huang Yongsheng and Chen Xilian.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 26, 1967). Made public: 2020. Names: Zhou Enlai, Wu Faxian, Zheng Weishan, Huang Yongsheng, Chen Xilian.'
      tags:
      - name:zhou-enlai
      - name:wu-faxian
      - name:huang-yongsheng
      - name:chen-xilian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-26.china-leadership-3
      when: July 26
      date: '1967-07-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai chairs, at the Jingxi Hotel, the enlarged liaison meeting of the Standing Committee: Politburo members, Cultural Revolution Group members, heads of the General Departments and services and the regional and military-district heads in Peking. Xie Fuzhi and Wu Faxian call Chen Zaidao and others the "ringleaders" of the "July 20 counter-revolutionary riot" and attack Xu Xiangqian. Wu Faxian also fights Chen Zaidao and the others, for which Zhou rebukes him sharply; Jiang Qing praises Wu for "the rebel spirit".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 26, 1967, the item after). Made public: 2020. See [[cal.1967-07-26.china-leadership]]. Names: Zhou Enlai, Xie Fuzhi, Wu Faxian, Chen Zaidao, Xu Xiangqian, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:xie-fuzhi
      - name:wu-faxian
      - name:xu-xiangqian
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-26.china-leadership-4
      when: July 26
      date: '1967-07-26'
      thread: china-leadership
      c: Zhou Enlai goes in the evening to Lin Biaos for a meeting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-27.china-leadership-2
      when: July 27
      date: '1967-07-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Hunan Military Districts heads and the delegates of Hunans two factions and criticizes the rebels looting of arsenals: both sides to seal the arms they hold and agree under the 47th Armys leadership. On the Wuhan "July 20 incident": a good thing about them is they do not change names, "Million Heroes" and the independent division both wear armbands; the Million Heroes erred but are a mass body and can be educated. Qi Benyu cuts in: the Million Heroes cannot be praised.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 27, 1967). Made public: 2020. Names: Zhou Enlai, Qi Benyu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-07-27.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 169 (July 26–27, 1967; Lin Biao presides over the meeting that settles the Wuhan matter; Zhous attendance and his meetings before and after)'
- add:
    entry:
      id: cal.1967-07-28.china-leadership
      when: July 28
      date: '1967-07-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives, before dawn, delegates of the two Jiangxi factions and asks the provincial preparatory committee for a great alliance to unite the more conservative bodies: keep a high posture, for it is a contradiction among the people, only a matter of understanding. Of "Baiji", the term some use for Wuhans "Million Heroes": abuse is the Kuomintangs method, not ours.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 28, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-28.china-leadership-2
      when: July 28
      date: '1967-07-28'
      thread: china-leadership
      c: Zhou Enlai goes to the Cultural Revolution Groups meeting on stopping the seizing of arms.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 28, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-29.china-leadership
      when: July 29
      date: '1967-07-29'
      thread: china-leadership
      c: Zhou Enlai tells the Peking garrison through his secretary to get Zhang Tixue, Ye Fei and Zhang Pinghua back from Han Aijing, whose Peking Aeronautics Institute "Red Flag" men seized them.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 29, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Pinghua, Ye Fei.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-29.china-leadership-2
      when: July 29
      date: '1967-07-29'
      thread: china-leadership
      c: 'Tsinghua rebels raid Xu Xiangqians home and carry off many secret papers. Zhou Enlai, told of it, orders: (1) everyone who entered Xus home to withdraw; (2) the safety of Xu, his family and staff guaranteed; (3) nothing in Xus home to be taken away, and the cabinet of files and papers already taken to be recovered in full from Tsinghua by the Peking garrison.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Xu Xiangqian.'
      tags:
      - name:zhou-enlai
      - name:xu-xiangqian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-29.china-leadership-3
      when: July 29–30
      date: '1967-07-29'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai meets three times with Xie Fuzhi, Yang Chengwu, Wang Li, Liu Feng and others on the Wuhan problem.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 29, 30, 1967). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi, Yang Chengwu, Wang Li, Liu Feng.'
      tags:
      - name:zhou-enlai
      - name:xie-fuzhi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-30.china-leadership
      when: July 30
      date: '1967-07-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, with Kang Sheng, receives the Henan Military Districts heads and the delegates of Henans two factions. Kang abuses Wuhans "Million Heroes" before all and calls Chen Zaidao a "counter-revolutionary". Zhou: do not call the Million Heroes "Hundred Bandits"; the Center has not said so, only that a small handful of bad heads are in the Million Heroes, for it is still a mass body; those of its masses who erred are to be allowed and welcomed back to their production posts to correct the error by grasping revolution and promoting production and business. If there are views on the Region, a military subdistrict or a field army, send them posters but do not post them outside.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170 (July 30, 1967). Made public: 2020. Names: Zhou Enlai, Kang Sheng, Chen Zaidao.'
      tags:
      - name:zhou-enlai
      - name:kang-sheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-30.china-leadership-2
      when: July 30
      date: '1967-07-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai twice receives, on July 30 and Aug. 1, the Hunan Military Districts heads and delegates of Hunans two factions: if Hunan is not brought under control it is dangerous; the Regions and subdistricts comrades must take responsibility and stop at once the reckless issue and seizing of guns; guns issued must be taken back.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 170–171 (July 30, Aug. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-07-31.china-leadership-2
      when: July 31
      date: '1967-07-31'
      thread: china-leadership
      c: 'Zhou Enlai asks Mao, away from Peking, whether Lin Biao, Jiang Qing and others should be allowed to bar Xu Xiangqian, Nie Rongzhen and Ye Jianying from the Aug. 1 army-day reception. Mao: Zhu De, Xu Xiangqian and the other marshals under attack are all to attend. In the afternoon Zhou fixes the guest list with Liu Ningyi, Yang Chengwu and Wang Xinting, tells Xu himself, has the route from Xus residence to the Great Hall of the People chosen, and in the evening attends the reception.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (July 31, 1967). Made public: 2020. See [[cal.1967-07-31.china-leadership]]. Names: Zhou Enlai, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Lin Biao, Jiang Qing, Mao Zedong, Zhu De, Liu Ningyi, Yang Chengwu, Wang Xinting.'
      tags:
      - name:zhou-enlai
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:ye-jianying
      - name:lin-biao
      - name:jiang-qing
      - name:mao-zedong
      - name:zhu-de
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-01.china-leadership-2
      when: Aug. 1
      date: '1967-08-01'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, told that the Guangxi "Lianzhi" delegation in Peking has taken He Ximing and Huo Fan, called "historical counter-revolutionaries" and "renegades" by Kang Sheng, back to Nanning for struggle, wires that they be sent safely to Peking by a set date. In November the Lianzhi sends He and Huo back to Peking.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (Aug. 1, 1967). Made public: 2020. Names: Zhou Enlai, He Ximing, Huo Fan, Kang Sheng.'
      tags:
      - name:zhou-enlai
      - name:kang-sheng
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-08-01.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (Aug. 1, 1967; the *Hongqi* editorial "The Proletariat Must Firmly Grasp the Gun", drafted under Guan Feng and passed by Chen Boda: to expose, defeat and discredit the small handful of power-holders on the capitalist road in the army, "the main direction of struggle")'
- add:
    entry:
      id: cal.1967-08-02.china-leadership
      when: Aug. 2
      date: '1967-08-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with Yang Dezhi, Cheng Shiqing, Liu Peishan and others on Jiangxi. Aug. 3 and 5 he receives all the Jiangxi delegates in Peking: military subdistricts and armed departments are not again to issue guns at will, and those issued are to be taken back; mass bodies are to stop armed fights, stop seizing guns, stop calling peasants into the towns to fight, and trust the PLA.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171 (Aug. 2, 3, 5, 1967). Made public: 2020. Names: Zhou Enlai, Yang Dezhi, Cheng Shiqing, Liu Peishan.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-03.china-leadership-3
      when: Aug. 3
      date: '1967-08-03'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai drafts the reply of the Center, State Council, Military Commission and Cultural Revolution Group to the Canton Military Region: agreed to take the "counter-revolutionary organization" hat off the "Aug. 1 Fighting Corps", but its form across trades was not right and is not to be restored after; Mao, reading it, adds: "but if other Canton mass bodies still cross trades, this one may for the time be allowed to, and be attached to a trade later."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 171–172 (Aug. 3, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-08-05.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172 (Aug. 5, 1967; the *Renmin ribao* prints Maos "Bombard the Headquarters" with the editorial "Bombard the Bourgeois Headquarters", calling for criticism of "the biggest handful of power-holders in the Party on the capitalist road")'
- add:
    entry:
      id: cal.1967-08-05.china-leadership-3
      when: Aug. 5
      date: '1967-08-05'
      thread: china-leadership
      c: 'Zhou Enlai goes to Tiananmen for the meeting marking the first anniversary of "Bombard the Headquarters". To Kuai Dafu and others who say it is now the "third great linking up" with Pekings students to go all over the country: the estimate is wrong, the Center has no such estimate; the situation is one of great criticism and great alliance.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172 (Aug. 5, 1967, the item after). Names: Zhou Enlai, Kuai Dafu.'
      tags:
      - name:zhou-enlai
      - polity:prc
- cite:
    id: cal.1967-08-05.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172 (Aug. 5, 1967; since mid-July, under the prompting of Kang Sheng, Xie Fuzhi and Qi Benyu, over a hundred Peking mass bodies set up outside Zhongnanhais west gate the "Pull Out Liu Front Line", besiege Zhongnanhai and storm the State Council; Zhou criticizes the rebels many times and insists on not leaving Zhongnanhai, so that they never dare enter and the many leaders inside are protected; at Maos intervention the Front Line is removed)'
- add:
    entry:
      id: cal.1967-08-06.china-leadership
      when: Aug. 6
      date: '1967-08-06'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Foreign Ministrys liaison station and delegates of the Peking Foreign Languages Institute and makes three rules with the rebels for the meeting of the foreign affairs branch to criticize Chen Yi: small meetings in the main; no shouts of "Down with" and no "Down with" banners; no insult to a mans dignity, no disguised armed fighting, no seizing of men.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172 (Aug. 6, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-06.china-leadership-2
      when: Aug. 6
      date: '1967-08-06'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, in the evening, receives Hunans delegates to Peking: seizing guns at random is unlawful; an error by the PLA in supporting the Left does not make it a black command; such disrespect for the field armies amounts to wanting no leadership and is anarchist. On transport: all bodies must unite on grasping revolution and promoting production; if transport stops the arteries are cut and the peoples livelihood suffers.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 172–173 (Aug. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-07.china-leadership-3
      when: Aug. 7
      date: '1967-08-07'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai goes to the Foreign Ministrys small hall for the foreign affairs branchs meeting to criticize Chen Yi, and, seeing a slogan "Down with the three-anti element Chen Yi", insists that the rebels take it down before he enters the meeting room: "it was agreed yesterday; you still do this." For the next days, to protect Chen Yi, he attends the meetings one after another, or sends his secretary. Once rebels, hearing Zhou cannot attend, gather several hundred to storm in and seize Chen; Zhou, on his secretarys report, orders the garrison to send troops to protect Chen and bring him back to Zhongnanhai.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 7, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-08-07.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 7, 1967; Xie Fuzhi to the whole Ministry of Public Security: smash the public security, procuratorial and judicial organs; the evil of the old machine smashed; from this the storming of those organs spreads and persecution of their staff grows; Aug. 24 Zhou tells the two Guangxi factions that the organs are to be seen as two sides and not all bad)'
- cite:
    id: cal.1967-08-07.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 7, 1967; Wang Li receives the Foreign Ministry rebels and stirs them to seize its power; he reports to Jiang Qing and Chen Boda, who back him; mid-month the rebels storm and smash the ministrys political department, declare they hold the Party committees power and seal all vice-ministers offices)'
- add:
    entry:
      id: cal.1967-08-08.china-leadership
      when: Aug. 8
      date: '1967-08-08'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, seeing the leaflet of Wang Lis speech of Aug. 7, sends it to Kang Sheng and Wang Li and proposes that the three of them talk. Kang and Wang do not come.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173 (Aug. 8, 1967). Made public: 2020. Names: Zhou Enlai, Wang Li, Kang Sheng.'
      tags:
      - name:zhou-enlai
      - name:kang-sheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-08.china-leadership-2
      when: Aug. 8
      date: '1967-08-08'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai has the all-army Cultural Revolution Groups office for supporting the Left send at once the full account of the attacks on the Nanjing, Canton and Shenyang military regions, and calls the heads of the Canton and Shenyang Regions and of the three services in Peking.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 173–174 (Aug. 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-08.china-leadership-3
      when: Aug. 8
      date: '1967-08-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai approves the Zhejiang Military Regions headquarters, political and rear services departments to close their doors and take up the "four bigs". On the 16th he telephones Chen Liyun and Nan Ping: the units of the Region are not to be in disorder; tell the rebels not to live in the Region; no linking up between army and people; views go on posters; Zhejiang is at the front and the enemy first; troops are a fighting body and form no fighting groups.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Liyun, Nan Ping.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-09.china-leadership
      when: Aug. 9
      date: '1967-08-09'
      thread: china-leadership
      c: Zhou Enlai goes to Lin Biaos meeting, where Lin says this Cultural Revolution is "truly of the smallest cost and the greatest victory"; many Party and government organs are now paralyzed, outwardly in great disorder, but the disorder is "needed and normal"; "if it is to collapse, let it collapse".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 9, 1967). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-10.china-leadership-3
      when: Aug. 10
      date: '1967-08-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai has his secretary wire Huang Yongsheng and Li Yuan, commander of the 47th Army in Hunan: Plant 272 in Hunan must be guarded by troops; weapons seized are to be returned to the army; a "dead order" that none may seize arms of the defence plants; if they cannot be persuaded, they may send a few delegates to Peking to Su Yu of the defence-industry military control group. Aug. 21 he wires Li Yuan again, on the rebels "takeover" of Plant 282: they are to withdraw; the arms of the defence depots are absolutely not to be touched. The same day he talks with army heads on stopping the seizing of arms from defence depots.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 10, 21, 1967). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Su Yu.'
      tags:
      - name:zhou-enlai
      - name:huang-yongsheng
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-08-10.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 10, 1967; the Order on Sending Defense Forces to Keep the Railways Open, drafted by Zhou and approved by Mao)'
- add:
    entry:
      id: cal.1967-08-12.china-leadership
      when: Aug. 12
      date: '1967-08-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, before dawn, receives the delegates of Jiangxis two factions and the Jiangxi Military Districts heads: the pro-army liaison station may not be set up inside the Region and must move out at once; the Center has not called a third great linking up; the claim is wrong. The same day the Jiangxi delegations in Peking reach an eight-point agreement to carry out the "June 24" notice and Zhous instructions on Jiangxi.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 12, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-12.china-leadership-2
      when: Aug. 12
      date: '1967-08-12'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai writes Lin Biao, Chen Boda, Kang Sheng, Li Fuchun and Jiang Qing on Chinas credit to Mali: our aid is in no case to fill the gap in Mali–French trade and push Mali back into a colonial economy it cannot get out of. Aug. 14, talking with a Malian ministerial delegate, Kouyate: if our aid is used to meet Frances wishes and cover her deficit and trade gap, we help you return to colonialism; we cannot do that.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174–175 (Aug. 12, 14, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+mali
- add:
    entry:
      id: cal.1967-08-12.china-leadership-3
      when: Aug. 12–16
      date: '1967-08-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks without break with the Hunan "Workers Federation", the "Xiangjiang Storm" and the other factions and with Hunans Party, government and army heads, to settle Hunan. On the 15th: call on the workers to go back to factory and mine to carry out struggle, criticism and reform, grasp revolution and promote production, business and work, and ensure this years output; be a doer of revolution, not a talker.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 12–16, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-14.china-leadership-2
      when: Aug. 14
      date: '1967-08-14'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, before dawn, receives delegates of Cantons mass bodies come to Peking on public order and criticizes the Guangzhou Railway "General Command" for storming the airport on the 12th, seizing a navigation station and taking the militias guns: no side may take arms or seize guns; keep a sense of the enemy; with public security paralyzed, what if Hong Kong agents come in? To whom are escaped criminals to be handed? Emptying the police stations of guns he cannot forgive. The 16th, before dawn, he receives the Canton delegates again and hears their proposals for a settlement.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 14, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-14.china-leadership-3
      when: Aug. 14
      date: '1967-08-14'
      thread: china-leadership
      c: 'Zhou Enlai, on the demand of over a thousand in the defence research system to seize Xiao Hua and struggle against him: struggle may be, but he is to be returned after, not carried off.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 14, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Xiao Hua.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-14.china-leadership-4
      when: Aug. 14
      date: '1967-08-14'
      thread: china-leadership
      c: Zhou Enlai calls a small liaison meeting which adopts the letter of the Center, State Council, Military Commission and Cultural Revolution Group to the workers and staff of the coal industry. He adds that those who held to going down the pits and to output and did well, in whichever body or none, are to be praised and suitably rewarded. Mao approves; issued Aug. 16.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 14, 1967, the item after). Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
- add:
    entry:
      id: cal.1967-08-15.china-leadership
      when: Aug. 15
      date: '1967-08-15'
      thread: china-leadership
      c: Zhou Enlai receives delegates of the finance and trade branches, and on the 17th attends the self-criticism meeting of Li Xiannian.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 175 (Aug. 15, 17, 1967). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - name:zhou-enlai
      - name:li-xiannian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-17.china-leadership
      when: Aug. 17
      date: '1967-08-17'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives Cambodias Foreign Minister Phurissara (普里萨拉), twice, on Aug. 17 and 19.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176 (Aug. 17, 19, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+cambodia
- add:
    entry:
      id: cal.1967-08-18.china-leadership-2
      when: Aug. 18
      date: '1967-08-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the heads of the Anhui delegation in Peking and rebukes them for printing and posting material and pictures of beating, bumping and looting against advice: put up in Peking it is the best material for foreign reporters; to have the Cultural Revolution come to this does the country no good.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176 (Aug. 18, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-19.china-leadership
      when: Aug. 19
      date: '1967-08-19'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on six Xian rebel bodies (the Workers, Mining and Enterprises Federation and others) demand to seize Peng Dehuai and bring him to Xian for struggle: the Cultural Revolution Group has discussed it; for now Peng is not to be taken elsewhere to be struggled.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176 (Aug. 19, 1967). Made public: 2020. Names: Zhou Enlai, Peng Dehuai.'
      tags:
      - name:zhou-enlai
      - name:peng-dehuai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-21.china-leadership
      when: Aug. 21
      date: '1967-08-21'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the representatives of the mass bodies of the industry-transport, finance-trade and farm-forestry branches, the military delegates in the ministries, those running business and students of related colleges. To storm the military control committees is not allowed and leads the masses wrong; the committees must be backed, their historic task unfinished; the field armies guard the railways section by section. Rail transport and coal are the most urgent: much coal cannot be delivered, and power for industry and even for homes is nearly cut; first rail, with coal, which affect each other; output is falling. The Railways and Communications ministries are to send men down the lines as the Coal Ministry does, to urge the two factions to stop armed fights, stopping trains, wrecking track, delays and seizing guns; the other ministries too. Pekings colleges are not to link up again as last year; the Red Guard Congresss liaison stations everywhere are to be withdrawn.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176 (Aug. 21, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-08-21.china-leadership-2
      when: Aug. 21
      date: '1967-08-21'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, told that Xiamen mass bodies mean to seize the weapons of a garrison units gunboat, so that it dare not come ashore, tells the Cultural Revolution Groups office: Chen Boda should announce in the Cultural Revolution Groups or in Zhous and Chens name that seizing the gunboats arms is not allowed; to seize field-army arms before the enemy is wrong; if the warning is not heeded and they seize again, they are to be declared counter-revolutionary.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 176–177 (Aug. 21, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Boda.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-08-22.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 177 (Aug. 22, 1967; Zhou before dawn receives Cantons two delegations in Peking: seizing the armys arms and its aid-to-Vietnam supplies shows no sense of the enemy, "simply ignorant"; do not do what pains friends and pleases foes; do not go on with "the handful in the army", wrongly put out by the propaganda organs after the July 20 incident, which Mao criticized; to demand army power is wrong; the two sides agree on the spot to stop seizures, return the armys arms, stop all armed fighting and the hitting, smashing, looting, searching and seizing)'
- add:
    entry:
      id: cal.1967-08-22.china-leadership-3
      when: Aug. 22
      date: '1967-08-22'
      thread: china-leadership
      also:
      - china
      - vietnam-hanoi
      c: Zhou Enlai reviews the draft telegram of the Center to the Canton Military Region and the mass bodies on stopping the seizing of military supplies for Vietnam; and the draft telegram to the Chongqing garrison command and the bodies on stopping armed fights there, which he asks be sent in the Cultural Revolution Group offices name.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 177 (Aug. 22, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-08-22.china-leadership-2
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 177 (Aug. 23, 1967; Zhou, before dawn after the burning of the British chargés office on the night of the 22nd by Peking Red Guards and rebels, receives the foreign-affairs rebels and sharply criticizes the burning and the seizure of the Foreign Ministry: "you have no regard for the Center, anarchism"; the telegrams to foreign countries in the name of the supervision group are wholly unlawful and void; foreign affairs power is Maos and the Party Centers, given to the State Council; "between the Cultural Revolution Group and me you have no gap to drive into"; after the July 20 incident the tide is abnormal and the whole estimate wrong, "the country on the eve of counter-revolutionary restoration" and "taking power by arms" are not so; he talks the same day in turn with the Ministrys station, the Foreign Languages Institute and the Foreign Affairs Office and Foreign Ministry heads)'
- add:
    entry:
      id: cal.1967-08-24.china-leadership
      when: Aug. 24
      date: '1967-08-24'
      thread: china-leadership
      also:
      - china
      - vietnam-hanoi
      c: 'Zhou Enlai, before dawn, receives the two factions of Guangxi come to Peking and severely criticizes the seizing of military supplies for Vietnam and factional armed fights: stop the "civil war" at once, seal and hand in arms, keep the railways open. Look how the civil war has gone: the railways fought over section by section are worse than the old warlord wars, and cannot be borne; attacking railways and taking field-army guns is nothing of the Cultural Revolution; the slogan "drag out the handful in the army" turns the spearhead.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178 (Aug. 24, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-25.china-leadership-3
      when: Aug. 25
      date: '1967-08-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks at 1 a.m. with Yang Chengwu, back from Shanghai: on the provinces, Wang Lis Aug. 7 speech inciting the rebels to seize the Foreign Ministry, the burning of the British office and the siege of Zhongnanhai to seize Liu Shaoqi. "How can this go on? I fear a chain reaction. Two things must not be shaken: the Centers leadership and the PLAs prestige." He sends Yang to Shanghai to report to Mao with Wang Lis Aug. 7 speech.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178 (Aug. 25, 1967). Made public: 2020. See [[cal.1967-08-25.china-leadership-2]]. Names: Zhou Enlai, Yang Chengwu, Wang Li, Liu Shaoqi, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-25.china-leadership-4
      when: Aug. 25
      date: '1967-08-25'
      thread: china-leadership
      also:
      - china
      c: 'Jiang Qing, against Zhou Enlais wish that Song Renqiong go back to work in Liaoning, has rebels at night burst into the Jingxi Hotel to seize Song Renqiong and Chen Xilian, threatening to "beat them to death". Zhou, told of it, has Fu Chongbi take men and rescue Song and Chen from the rebels, and has them moved. Next dawn, receiving Liaonings delegates, he severely criticizes it as "not proletarian politics, in plain words the style of Kuomintang agents"; he asks of each side: stop armed fighting, support the PLA and not hinder it, seal all arms, keep the railways open; the Northeast is an industrial region with heavy traffic, and the lines in and out of the Pass cannot stop.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178 (Aug. 25, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Song Renqiong, Chen Xilian, Fu Chongbi.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - name:chen-xilian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-26.china-leadership
      when: Aug. 26
      date: '1967-08-26'
      thread: china-leadership
      also:
      - china
      c: 'Mao, who heard Yang Chengwu on Aug. 25, tells Yang: Wang, Guan and Qi (Wang Li, Guan Feng, Qi Benyu) are wreckers of the Cultural Revolution, not good men; report only to the Premier and have them arrested; the Premier is to handle it. He marks Wang Lis Aug. 7 speech "a very, very big poisonous weed". Later he tells Yang to deal with Qi Benyus case a little more slowly. At noon Yang returns to Peking and tells Zhou Maos decision. Zhou then chairs the small liaison meeting with Chen Boda, Kang Sheng and Jiang Qing attending and conveys Maos instruction. Wang Li and Guan Feng are put under isolation and examination; in January 1968 Qi Benyu is also.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178–179 (Aug. 26, 1967). Made public: 2020. See [[cal.1967-08-25.china-leadership-2]]. To check: the Chronologys date for Maos marking of Wang Lis speech. Names: Zhou Enlai, Mao Zedong, Yang Chengwu, Wang Li, Guan Feng, Qi Benyu, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-27.china-leadership
      when: Aug. 27
      date: '1967-08-27'
      thread: china-leadership
      c: 'Zhou Enlai, at dawn, receives the foreign-affairs rebels, who again press him unreasonably on "criticizing" Chen Yi: "you are wholly putting pressure on me, and wearing me down; since yesterday noon, eighteen hours, I have not rested a minute; my body cannot stand more." The rebels take no notice and his heart disease acts; the doctor helps him from the room. The rebels still say "we will block Chen Yis car", "we will storm the meeting again". At the door he turns: "whoever blocks Comrade Chen Yis car, I will step forward at once; whoever storms the meeting, I will stand at the Great Halls door and you will tread over me." He cannot work for a day and a half.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 27, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-29.china-leadership-2
      when: Aug. 29
      date: '1967-08-29'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on rebels seizing arms at an arsenal in Yunnan, tells Chen Kang, deputy commander of the Kunming Military Region: the Center and the Cultural Revolution Group agree the Region may send troops to guard it and to persuade; if persuasion fails, arrest the ringleaders.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 29, 1967). Made public: 2020. Names: Zhou Enlai, Chen Kang.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-30.china-leadership
      when: Aug. 30
      date: '1967-08-30'
      thread: china-leadership
      c: 'Zhou Enlai tells the Peking garrison on the armed fight of the two Seventh Ministry factions: shout over in the Cultural Revolution Groups name; if they do not heed, add troops at once to separate them and ask both sides for delegates.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 30, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08-31.china-leadership
      when: Aug. 31
      date: '1967-08-31'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, after talking with Chen Yi, receives the foreign affairs rebels and the Foreign Ministrys Party group and repeats that foreign affairs power belongs to the Center. He sharply criticizes the "revolutionary leading cadre" who acts as "foreign minister" after the Ministrys "power seizure": "you lately speak and report everywhere and spread the slogan "down with Liu, Deng and Chen"; you put yourself against the Center. The extreme-Left thought and acts at home now hurt our foreign work and our credit abroad."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179 (Aug. 31, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08.china-leadership
      when: Aug.
      date: 1967-08
      thread: china-leadership
      c: 'Zhou Enlai says in a talk: because Wuhan produced a Chen Zaidao, "Chen Zaidaos" are being sought everywhere; that is wrong. An error of line and direction is among the people; the armys differs from the Partys and governments. Trust the PLA; to seize its guns, uniforms and supplies, even to seize the commander, commissar and chief of staff, is wrong, and the question should be put more seriously; the method of seizing a handful of power-holders everywhere, used in early last year, would make a great error.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 179–180 (Aug. 1967). Made public: 2020. Names: Zhou Enlai, Chen Zaidao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08.china-leadership-2
      when: Aug.
      date: 1967-08
      thread: china-leadership
      c: Zhou Enlai, told that Li Jingquan and several other regional, provincial and municipal heads living at the Central Organs Hostel have been seized and paraded by rebels, has Fu Chongbi and others send troops to protect them and moves Wang Renzhong, Jiang Weiqing and over twenty others to a safe house of the Peking garrison, to be kept strictly secret. For two days Jiang Qing and others at meetings, before Zhou, ask Fu where they are. Mao later approves Zhous measures.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Aug. 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Jingquan, Fu Chongbi, Wang Renzhong, Jiang Weiqing, Jiang Qing, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:li-jingquan
      - name:jiang-qing
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08.china-leadership-3
      when: Aug.
      date: 1967-08
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai instructs Anhuis Baihu farm: (1) staff of reform-through-labor farms, cadres included, are not to hold the "four bigs"; (2) prisoners are not to use the Cultural Revolution to riot; (3) warn the prisoners not to riot, or they will be suppressed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Aug. 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-08.china-leadership-4
      when: Aug.
      date: 1967-08
      thread: china-leadership
      c: By Zhou Enlais desk calendar, in August, besides meetings, he talked with central, local and army leaders 45 times and received delegates of mass bodies from all parts over fifty times.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Aug. 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-01.china-leadership-2
      when: Sept. 1
      date: '1967-09-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, before dawn, receives the Canton delegates in Peking: factionalism has reached its peak and must go no further; if they do not turn back, whichever side, they will commit a crime. Whampoa harbor cannot unload; each ship loses 500 pounds a day; this is not grasping revolution and promoting production but gross waste; if they go on, Whampoa will be put under military control, which may use arms and arrest. That afternoon the two sides, on his instructions, agree to stop the armed fight, seal and hand in arms and back the PLA. At 3 p.m. he receives the members of the Centers investigation team to Canton and tells them to see the two sides keep the agreement and not take part in their struggle.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Sept. 1, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-01.china-leadership-3
      when: Sept. 1
      date: '1967-09-01'
      thread: china-leadership
      c: 'Zhou Enlai tells the enlarged meeting of the Peking Revolutionary Committee that stopping armed fights is the main task now, including not seizing the PLAs arms and equipment. Factional struggle has hampered production all along, and transport has fallen to the lowest; foreign ships cannot load at the ports and are fined daily; the best test of revolution is good production. He knows some people study him and dig up things from years ago: help is welcome if in good faith, but to use it as a threat, to stir hidden wind and light hidden fires for a plot, he is against.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180–181 (Sept. 1, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-09-01.china-leadership-4
      when: Sept. 1
      date: '1967-09-01'
      thread: china-leadership
      also:
      - china
      c: Because Chinese staff abroad, under extreme-Left influence, meddled in Cambodias internal affairs, Sihanouk dissolves the Cambodia–China Friendship Association. Zhou Enlai criticizes the Chinese staff in Cambodia. On the 11th Sihanouk closes five overseas Chinese papers; on the 13th he announces the withdrawal of Cambodias embassy staff from China but no break; on the 14th Zhou receives Cambodias ambassador, Zhang Gang, expresses regret, and tries to persuade and keep them; the 18th Sihanouk cancels the withdrawal.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (Sept. 1, 1967, the item after). Made public: 2020. Check: the day of the dissolution; the chronology gives it after Sept. 1. Names: Zhou Enlai, Norodom Sihanouk.'
      tags:
      - name:zhou-enlai
      - name:norodom-sihanouk
      - polity:prc
      - vis:only:prc+cambodia
- add:
    entry:
      id: cal.1967-09-02.china-leadership
      when: Sept. 2
      date: '1967-09-02'
      thread: china-leadership
      c: 'Zhou Enlai, before dawn, receives the finance-and-trade rebels, who want Li Xiannian downed, and urges all branches to stop armed fights and unite. To Foreign Trade Ministry rebels showing signs of copying the Foreign Ministrys "power seizure": that one was wrong and has been criticized; stop there and do not copy it. Seizing the PLAs guns is unlawful and to be arrested on the spot, the Centers decision; if rebels seize a vault the PLA may fire; it cannot be bound for ever by "four nots" (not hit back, not answer back, not use hands, not shoot), which are for the people and the masses; to seize a vault is robbery.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (Sept. 2, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-02.china-leadership-2
      when: Sept. 2
      date: '1967-09-02'
      thread: china-leadership
      c: 'Zhou Enlai, on Mu Xin being secretly seized by rebels of the Central Drama Institute, writes Chen Boda, Kang Sheng, Jiang Qing, Xie Fuzhi and others: Xie to investigate; after the facts are known it must be declared that such abductions after the June 6 general order are in no way allowed, and a public admission of error written, and if they refuse it will be announced across the country.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181–182 (Sept. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mu Xin, Chen Boda, Kang Sheng, Jiang Qing, Xie Fuzhi.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - name:xie-fuzhi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-02.china-leadership-3
      when: Sept. 2
      date: '1967-09-02'
      thread: china-leadership
      also:
      - china
      - vietnam-hanoi
      c: Zhou Enlai receives the air force men who shot down a U.S. aircraft over Guangxi.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 2, 1967, the item after). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-09-03.china-leadership
      when: Sept. 3
      date: '1967-09-03'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai calls the Cultural Revolution Groups liaison meeting, which adopts the Order Forbidding the Seizure of the PLAs Arms, Equipment and Military Supplies of All Kinds. After it he calls that night the heads in Peking of the large military regions, provincial districts and the three services and two general departments, and the order is amended. Next day he sends it to Mao; Sept. 5 the Center, State Council, Military Commission and Group issue it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 3, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- cite:
    id: cal.1967-09-05.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 3–5, 1967; the order forbidding the seizure of the PLAs arms, equipment and military supplies, drawn at Zhous liaison meeting and sent to Mao)'
- add:
    entry:
      id: cal.1967-09-03.china-leadership-2
      when: Sept. 3
      date: '1967-09-03'
      thread: china-leadership
      also:
      - testing
      - china
      c: 'Zhou Enlai reviews and signs the State Councils and Military Commissions telegram to the Lanzhou Military Region, the local garrison and the Centers investigation group on the seizure, in armed fights, of large stores of top-secret technical papers of the Second Ministrys Company 103: the act is extremely wrong; the Region and the group are to deal with it severely, all files and materials seized to be handed over at once in full, and refusal to be judged under the law of the state.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 3, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-05.china-leadership-2
      when: Sept. 5
      date: '1967-09-05'
      thread: china-leadership
      also:
      - africa
      c: Zhou Enlai receives Tanzanias Finance Minister Jamal and Zambias Minister of State Soko, heading the joint Tanzania–Zambia economic delegation, and attends the signing of the agreement of the Chinese, Tanzanian and Zambian governments on building the Tanzania–Zambia railway.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 5, 1967). To check: the agreement as published. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-09-06.china-leadership
      when: Sept. 6
      date: '1967-09-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives Heilongjiangs mass delegates and tells both sides to carry out at once the agreement already reached to stop armed fights; then he receives the Centers investigation group to Heilongjiang.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 6, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-06.china-leadership-2
      when: Sept. 6
      date: '1967-09-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai agrees, with the two factions of the Public Security Ministrys preliminary hearing bureau in fierce struggle and the office paralyzed, with the Ministrys Party groups request that the Peking garrison take it over.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182 (Sept. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-06.china-leadership-3
      when: Sept. 6
      date: '1967-09-06'
      thread: china-leadership
      c: 'Zhou Enlai receives the liaison men and correspondents of the Cultural Revolution Group posted to the provinces. Of claims in some places that it is now "on the eve of a reactionary capitalist restoration current rebounding across the country" and that "power must be taken by arms and settled by war": the estimate is wholly wrong, an extreme-Left leaning. "Seizing the handful in the army" is extreme Left, the anarchism of doubting and overthrowing all. Every province must first stop armed fights and seizing of guns and set up revolutionary order; the tasks are great criticism, great alliance and the three-in-one; grasp revolution and promote production, above all transport, then coal, steel, oil and the few most basic industries.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 182–183 (Sept. 6, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-07.china-leadership-2
      when: Sept. 7
      date: '1967-09-07'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the demand of eight colleges rebel bodies, Peking Aeronautics "Red Flag" and Tsinghua "Jinggangshan" among them, that the *Guangming ribao* be stopped, writes Chen Boda, Kang Sheng, Jiang Qing and Yao Wenyuan: how the *Guangming ribao* is to be handled he is not clear, but having it closed by college rebels is not needed.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183 (Sept. 7, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - name:yao-wenyuan
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-08.china-leadership
      when: Sept. 8
      date: '1967-09-08'
      thread: china-leadership
      c: 'Zhou Enlai receives delegates to the national defence research meeting and rebukes the factional fighting that has thrown production into disorder. A model producer wanting to keep the old production order is well-meaning; the rebels may break the old order but not upset production order. How much production the fights have harmed, and what damage to state property: wholly petty-bourgeois factionalism.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183 (Sept. 8, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-08.china-leadership-2
      when: Sept. 8
      date: '1967-09-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, in the evening, receives Fujians delegates in Peking: all sides to go back at once, make an agreement and carry out the Centers order of Sept. 5; when local and whole interests clash the local yields; the main side of contradictions among the people is that small reasons yield to great; aiming the spearhead at the Military Region, "seizing the handful in the army" above all, is wholly wrong.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183 (Sept. 8, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-09.china-leadership-2
      when: Sept. 9
      date: '1967-09-09'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, before dawn, receives Liaonings delegates, asking each side to drop factionalism and unite, make an agreement to stop armed fights, seal arms, restore production and keep the railways open, and swear to carry it out. In the afternoon he receives the Centers investigation group to Liaoning.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183 (Sept. 9, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-10.china-leadership
      when: Sept. 10
      date: '1967-09-10'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, before dawn, receives the military control delegates and mass body delegates of the defence-industry ministries and criticizes the ministries for going on with armed fights after the Centers order of Sept. 5; the control committees are to call the sides to agree to stop fights and linking up and to grasp revolution and promote production. The new task of defence industry is to reach the great alliance and the three-in-one by great criticism; this is to be seen as a centre; the present factional struggle cannot go on.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 183–184 (Sept. 10, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-09-10.china-leadership-2
      when: Sept. 10
      date: '1967-09-10'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai drafts the Centers telegram to the Nanjing Military Region and Nanjings three mass factions, agreeing to and backing the agreement the three reached to stop armed fights firmly; they are to print the agreement and the Centers reply across the province and call all bodies to carry it out and unite in great criticism.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 10, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-11.china-leadership
      when: Sept. 11
      date: '1967-09-11'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: 'Zhou Enlai, on the Indian armys provocations against Chinese border troops, puts forward a plan of deployment: if the enemy does not fire again, our side need not return fire.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 11, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+india
- add:
    entry:
      id: cal.1967-09-12.china-leadership
      when: Sept. 12
      date: '1967-09-12'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, told that Zhang Jingwus home was searched and Nationalities Institute rebels are seizing him everywhere, has him brought to the State Council to live, and tells his liaison man to criticize such acts.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 12, 1967). Made public: 2020. Names: Zhou Enlai, Zhang Jingwu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-12.china-leadership-2
      when: Sept. 12
      date: '1967-09-12'
      thread: china-leadership
      c: 'Zhou Enlai receives the Cultural Revolution Groups correspondents posted in the provinces and the petitions staff: sum up experience and give the Center reports both objective and aimed at solving things, so that the Center sees where the knot of some problems lies.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 12, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-13.china-leadership-3
      when: Sept. 13
      date: '1967-09-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on peasants entering the Canton Military Region compound for armed fighting and planning a meeting, talks with the delegates of the Canton suburban "Poor Peasants Federation" and orders them at once to telephone home to persuade those who occupied the compound to withdraw and stop the meeting, to avoid larger fighting. The 15th he receives Cantons delegates and criticizes the "Dizong" for refusing advice, holding the meeting and sitting in at the Region: out of the compound by noon. Be more partisan in Party spirit and less in factionalism, the main direction now; Cantons order must be restored at once to grasp revolution and promote production; the Canton fair must not stop.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 13, 15, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-13.china-leadership-4
      when: Sept. 13
      date: '1967-09-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai telephones Yang Chengwu, for Mao away from Peking: Tianjins Tanggu port is wholly at a standstill from armed fights of the two sides, with over forty foreign ships in port; he has called the two sides delegates to Peking to talk and they have agreed to stop the fighting and keep an eight-hour day; he proposes military control of the port to help loading and unloading. Mao agrees.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184 (Sept. 13, 1967, the item after). Made public: 2020. See [[cal.1967-09-13.china-leadership]]. Names: Zhou Enlai, Yang Chengwu, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-13.china-leadership-5
      when: Sept. 13
      date: '1967-09-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, for the sixth time, receives Guangxis delegates in Peking: the railways to be taken over along the whole line by the PLA; Guilins "Laoduo" to join in protecting the line; the "April 22" to pull down its works; both sides to seal arms. The 16th the two reach in Peking a seven-point agreement on handing in all guns and ammunition.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 184–185 (Sept. 13, 16, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-16.china-leadership-2
      when: Sept. 16
      date: '1967-09-16'
      thread: china-leadership
      c: 'Zhou Enlai, with Chen Boda, Jiang Qing and others of the Cultural Revolution Group, receives the "Heaven" and "Earth" factions of the Peking colleges Red Guard Congress, on Sept. 16 and 17, and warns Kuai Dafu and others that to go on propagating "seize the handful in the army" and opposition to the PLA is wrong, an extreme-Left trend. Corporal or disguised punishment of cadres, seizing men by tearing down walls, tapping telephones, stealing meeting records and twisting one sentence to attack are fascist acts. That the Peking colleges factions go on "running all under heaven", linking up everywhere and carrying their factional views down to affect other places is petty-bourgeois fanaticism: do not claim sole authority or sole Leftism, unite. Their factional views are to be criticized; those still out linking up are given a month to return or be expelled from the roll; all schools are to have military training, which alone unifies scattered organization. On criticizing the "May 16" corps: only a small handful of bad ringleaders have misled some masses; expose them and stop; "no widening", no arresting and striking a batch among the masses.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 185 (Sept. 16, 17, 1967). Made public: 2020. Names: Zhou Enlai, Chen Boda, Jiang Qing, Kuai Dafu.'
      tags:
      - name:zhou-enlai
      - name:chen-boda
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-17.china-leadership-2
      when: Sept. 17
      date: '1967-09-17'
      thread: china-leadership
      also:
      - south-asia
      c: 'The Foreign Ministry, without the Centers approval, agrees that the Chinese embassy in Pakistan protest to Pakistans government over a non-official Pakistani paper printing Taiwans anti-Communist news and Brezhnevs anti-China remarks. After receiving Pakistans ambassador that day Zhou Enlai severely rebukes the Ministrys men: "you have made another mess for me; was the reply to the embassy approved by me? why was it not sent to me?"'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 185 (Sept. 17, 1967). Made public: 2020. Names: Zhou Enlai, Leonid Brezhnev.'
      tags:
      - name:zhou-enlai
      - name:brezhnev-leonid
      - polity:prc
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1967-09-18.china-leadership-2
      when: Sept. 18
      date: '1967-09-18'
      thread: china-leadership
      c: 'Zhou Enlai talks with the Foreign Ministrys Party-group members and business-supervision group members, the day after his rebuke over the protest to Pakistan: "a matter that talk would settle: is it worth a protest? you have spoiled all the relations; this is extreme-Left conduct."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 185–186 (Sept. 17, 1967; "次日"). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-19.china-leadership-3
      when: Sept. 19
      date: '1967-09-19'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, after talks with Chen Xilian and others, receives Liaonings delegates and orders the mass bodies of Lüda, Fushun, Dandong, Xinmin, Jinzhou, Benxi and other places each to make an agreement by Sept. 25 to hand in and seal all arms, stop armed fights and unite to grasp revolution, production and business, to meet National Day.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 19, 1967). Made public: 2020. Names: Zhou Enlai, Chen Xilian.'
      tags:
      - name:zhou-enlai
      - name:chen-xilian
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-20.china-leadership-2
      when: Sept. 20
      date: '1967-09-20'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai speaks at the mobilization meeting for the National Day preparations. Peking students linking up elsewhere are to return soon and correct the wrong estimates of "seizing power by arms" and the "third great linking up"; they are to drop beating, kidnapping, house-searching, seizing men, private courts, seizing archives, tapping telephones and private radio stations, make a good great alliance and meet National Day. The army made errors in supporting the Left because it long had no mass work and no experience, with too little understanding and so not effective or earnest: a question of understanding.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 20, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-09-22.china-leadership-2
      when: Sept. 22
      date: '1967-09-22'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Guangxis mass delegates and asks them to unite and restore the railways: whichever factions head stands up and runs the railway transport well is good, doing as Mao directs; whoever opposes is factional and not proletarian. This must be made plain.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 22, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-22.china-leadership-3
      when: Sept. 22
      date: '1967-09-22'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews the draft Emergency Notice on the Immediate Return of Students Linking up Elsewhere and of Petitioners in Peking to Their Own Units, and sends it to Mao. On the 23rd Mao: have it issued as a Center document to the Centers comrades and offices concerned, printed in large characters for posting by every unit, and sent in clear code to all places.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 22, 1967, the item after). Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
- cite:
    id: cal.1967-09-24.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 24, 1967; Zhou at Maos: on convening the Ninth Congress Mao says the successor is of course Lin Biao, and that Liu Shaoqi and Deng Xiaoping are to be told apart)'
- add:
    entry:
      id: cal.1967-09-24.china-leadership-2
      when: Sept. 24
      date: '1967-09-24'
      thread: china-leadership
      c: 'Zhou Enlai, his health worse by the day, still works through the night. He tells Deng Yingchao: by about eight each morning his spirit is gone and his hands shake. On Sept. 27, asked twice to write "Warmly Celebrate the 18th Anniversary of the Great Peoples Republic of China" for National Day, he fails because his hand trembles, and tells his secretary to have the responsible men prepare it in Fangsong type.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 24, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Deng Yingchao.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-26.china-leadership
      when: Sept. 26
      date: '1967-09-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai attends the celebration meeting of the finance-and-trade system on its great revolutionary alliance and conveys Maos instruction, given on his return from inspecting North China, Central-South and East China: the bodies are to handle contradictions among the people rightly by Maos newest instruction, make more self-criticism, drop the "self" and unite further in politics and thought.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 26, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- cite:
    id: cal.1967-09-23.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 25, 1967; the *Renmin ribao* reports that Mao has inspected the Cultural Revolution in North, Central-South and East China in July, August and September and is back in Peking; Oct. 7 the Center sends his remarks on the tour to the whole country)'
- add:
    entry:
      id: cal.1967-09-26.china-leadership-2
      when: Sept. 26
      date: '1967-09-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the army heads of Hubei, Henan and other provinces, drilled in Peking: the great alliance now rising is good and is to be pushed, led and furthered with skill; do not unite without principle, do not hurry, do not cover up contradictions that should be pointed out.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 26, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-26.china-leadership-3
      when: Sept. 26–Oct. 14
      date: '1967-09-26'
      thread: china-leadership
      also:
      - china
      c: Albanias Premier Mehmet Shehu, member of the Party of Labors Politburo, leads a party and government delegation to China and attends National Day. During the visit Zhou Enlai holds three talks with Shehu.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187 (Sept. 26–Oct. 14, 1967). Made public: 2020. Names: Zhou Enlai, Mehmet Shehu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1967-09-27.china-leadership
      when: Sept. 27
      date: '1967-09-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, before dawn, receives for the fourth time the delegates of Cantons mass bodies: drop "self", set up "public"; no factionalism but Party spirit; unite on Mao Zedong Thought by criticism and self-criticism and grasp revolution and production. The spearhead is not to be pointed at the Military Region; an error of carrying out the reactionary line is among the people, not to be made a contradiction with the enemy; the responsibility lies mainly with the leaders, not level by level. Canton is to guard against both extreme-Left and Right moods: criticizing the extreme Left must not revive the Right, nor the reverse. The public security organs cannot split into factions in their work; as they are paralyzed there must be military control; airfields, railways, vaults, docks and ports are all under it and not to be touched. On the 25th and 26th he talked with the Canton Military Regions Standing Committee and Huang Yongsheng on Guangdong.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 187–188 (Sept. 27, 1967). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng.'
      tags:
      - name:zhou-enlai
      - name:huang-yongsheng
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-28.china-leadership-2
      when: Sept. 28
      date: '1967-09-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the mass delegates of the three Northeast provinces and asks why they still shout "drag out the handful in the army": wrong. Why must the working class be irreconcilable? Are they easy when factories stop? The Cultural Revolution has run fifteen months: could it run another fifteen? To "take leave for revolution" and a "third great linking up" are great errors. The military control committees must keep traffic open, a dead order; any faction that obstructs rail transport will have its heads arrested. Sealing and handing in guns, and reaching the great alliance through great criticism and fighting self and criticizing revisionism, is the important task.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 28, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-29.china-leadership-2
      when: Sept. 29
      date: '1967-09-29'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai, in the first talks with Congo (Brazzaville) Premier Noumazalaye: China is pushing health workers down to the villages to serve the peasants; the rural population is 85 percent of the whole and most doctors are in the cities; agriculture is the base, and imported grain is bad. Second talks Oct. 5: collective economy rests chiefly on self-reliance, on making them feel the need; if tools, livestock and funds all come from the state, with a change of circumstances and too little state strength it collapses.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 29, Oct. 5, 1967). Made public: 2020. Names: Zhou Enlai, Ambroise Noumazalaye.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+congo-brazzaville
- add:
    entry:
      id: cal.1967-09-29.china-leadership-3
      when: Sept. 29
      date: '1967-09-29'
      thread: china-leadership
      c: Zhou Enlai goes to Maos for a meeting on convening the Ninth Congress.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-09-30.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 30, 1967; Zhou with Mao at the reception of the Albanian party and government delegation under Shehu)'
- add:
    entry:
      id: cal.1967-09-30.china-leadership-2
      when: Sept. 30
      date: '1967-09-30'
      thread: china-leadership
      c: Zhou Enlai, after talking with Chen Yi and the Foreign Ministrys Party group, studies the list of those to be on the Tiananmen tower for National Day.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188 (Sept. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09-30.china-leadership-3
      when: Sept. 30
      date: '1967-09-30'
      thread: china-leadership
      c: 'Zhou Enlai drafts the Centers several decisions on reporting the National Day meetings in the provinces, municipalities and regions: besides the names of the revolutionary committee, military control committee or preparatory group heads at the celebration, the names of the main heads of the large military region and provincial military district who are not on the military control committee are also to be reported. (The chronology notes this was Zhous way of protecting cadres: a cadre named in the National Day report was understood to have no political problem.)'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 188–189 (Sept. 30, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-09.china-leadership
      when: Sept.
      date: 1967-09
      thread: china-leadership
      c: On Zhou Enlais proposal the Center decides that Yang Chengwu be head of the Military Commissions office group, set up in August 1967 to run the Commissions daily work, its first members Wu Faxian, Ye Qun, Qiu Huizuo and Zhang Xiuchuan.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Sept. 1967). Made public: 2020. Names: Zhou Enlai, Yang Chengwu, Wu Faxian, Ye Qun, Qiu Huizuo.'
      tags:
      - name:zhou-enlai
      - name:wu-faxian
      - name:ye-qun
      - name:qiu-huizuo
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-02.china-leadership
      when: Oct. 2
      date: '1967-10-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, before dawn, told that the customs and port office at Xiamen, split in two factions, have left no one to see to British merchant ships, so they cannot berth, drafts himself a telephone message to the Xiamen military control committee for the two bodies: this act breaks state law and hurts the countrys credit and is intolerable; the committee and investigation group are to call on both bodies to act jointly toward foreigners and in business; the committee is to take the necessary steps to protect harbor inspection, berthing and loading, and any faction that breaks it is to be punished as the ringleader under the June 6 order. The same day the British ship berths and begins loading.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 2, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-03.china-leadership-2
      when: Oct. 3
      date: '1967-10-03'
      thread: china-leadership
      c: 'Zhou Enlai writes Mao proposing talks on: (1) the Cultural Revolutions course and some concrete matters of students and Red Guards; (2) industrial and farm output and next years plan; (3) international questions. One question at each meeting, the circle limited to the Politburo, the Secretariat, the Military Commissions Standing Committee, the Cultural Revolution Group and, from Pekings committee, Wu De and Liu Jiandong.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 3, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Wu De, Liu Jiandong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-10-03.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 3, 1967; Zhou with Mao at the reception of Premier Noumazalaye of Congo (Brazzaville); Mao on Red Guards beating blindly and wanting to bring down Chen Yi, Zhou and Li Xiannian)'
- add:
    entry:
      id: cal.1967-10-03.china-leadership-3
      when: Oct. 3
      date: '1967-10-03'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai, with Mao, receives the Pakistani governments friendship delegation under Minister of Information and Broadcasting Shahabuddin.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 3, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1967-10-04.china-leadership
      when: Oct. 4
      date: '1967-10-04'
      thread: china-leadership
      c: Zhou Enlai twice visits Xu Shiyou, on Oct. 4 and 6. Xu had been brought by Mao and Zhou to live at Zhongnanhai, where he stayed about a month.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 4, 6, 1967). Made public: 2020. Names: Zhou Enlai, Xu Shiyou.'
      tags:
      - name:zhou-enlai
      - name:xu-shiyou
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-10-05.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 5, 1967; Zhou with Mao at the reception of Vietnams Deputy Premier Lê Thanh Nghị and the National Assemblys vice-chairman Hoàng Văn Hoan with their party and government delegation)'
- add:
    entry:
      id: cal.1967-10-06.china-leadership
      when: Oct. 6
      date: '1967-10-06'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai says to Premier Noumazalaye on the way to the airport: the stages of revolution cannot be jumped; the idea of continuing revolution must join with the idea that its stages cannot be skipped.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 6, 1967). Made public: 2020. Names: Zhou Enlai, Ambroise Noumazalaye.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+congo-brazzaville
- add:
    entry:
      id: cal.1967-10-07.china-leadership-2
      when: Oct. 7
      date: '1967-10-07'
      thread: china-leadership
      c: Zhou Enlai goes to Maos for a meeting.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 7, 1967). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-08.china-leadership
      when: Oct. 8
      date: '1967-10-08'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai flies to Wuhan with the Albanian delegation under Shehu for the forum on "order after disorder" in Wuhan; there he talks with the Wuhan Regions heads and with the mass bodies delegates. Oct. 9, at the Wuhan masses meeting welcoming the delegation, he asks the bodies to study Maos works, rectify with open doors, make more self-criticism, strengthen proletarian Party spirit, overcome petty-bourgeois factionalism and push the great alliance. Oct. 10 he flies back to Peking.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 8, 9, 10, 1967). Made public: 2020. Names: Zhou Enlai, Mehmet Shehu.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1967-10-11.china-leadership
      when: Oct. 11
      date: '1967-10-11'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai writes on the General Political Departments report on appointing and removing army officers, to Ye Jianying and Yang Chengwu and for Lin Biao: reports and approvals of the Military Commission on daily administration, troop movement, appointments, unit organization, weapons and equipment, not part of supporting Left, farm, industry, military control and training, defence or foreign affairs, should go from the Commission and the General Staff direct to Vice-Chairman Lin for approval, not through his hands; otherwise too many papers pile up with him, he has no time, and exceeds his authority to the harm of great matters.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 11, 1967). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Yang Chengwu, Lin Biao.'
      tags:
      - name:zhou-enlai
      - name:ye-jianying
      - name:lin-biao
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-10-12.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 12, 1967; Zhou with Mao at the reception of Shehu and the Albanian delegation)'
- add:
    entry:
      id: cal.1967-10-12.china-leadership-2
      when: Oct. 12
      date: '1967-10-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai calls the heads of the foreign affairs branch and the rebel leaders: it is over half a year since the January seizure of power, and not everything can be downed; analyze; revolution and business cannot be parted, and are proved in business.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 190–191 (Oct. 12, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-13.china-leadership-2
      when: Oct. 13
      date: '1967-10-13'
      thread: china-leadership
      also:
      - china
      c: 'With the road from Nanjiang to Duku in Kashgar, Xinjiang, cut for over fifty days by the armed fight of two factions, and a Center investigation group sent four days ago, Zhou Enlai telephones at dawn the group and the factions heads: both sides to level every roadblock, post, ditch and works on the road by dawn of the 13th and seal their arms, the 9th Air Force to see it done. Nov. 4 he has his secretary tell the group to stay on at Kashgar and finish the sealing of arms and the union of the two factions.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 13, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-10-13.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 13–14, 1967; Zhou at Maos meeting on the political report to the Ninth Congress and the election of delegates)'
- add:
    entry:
      id: cal.1967-10-17.china-leadership-2
      when: Oct. 17
      date: '1967-10-17'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the death of Pu Yi, rules that the family may choose among the Revolutionary Cemetery, the Wanan and the Peoples cemeteries to place his ashes, and has the *Renmin ribao* print the news. Dec. 17 three further rulings: a pension of 520 yuan by the rules; all Pu Yis royalties handed to the Political Consultative Conference to go to his wife; his ashes in the Peoples Cemetery as the family wishes. He tells Pu Jie a fine tomb might be thought of.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 17, 1967). Made public: 2020. Names: Zhou Enlai, Pu Yi, Pu Jie.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-20.china-leadership-2
      when: Oct. 20–22
      date: '1967-10-20'
      thread: china-leadership
      also:
      - africa
      - korea
      c: 'Zhou Enlai holds talks with Mauritanias President Daddah, in China on a visit, stating his view of the international situation and Chinas stand on settling international questions by the Five Principles of peaceful coexistence. Oct. 23 he is with Mao at the reception of Daddah. Oct. 24, on the road to the airport as Daddah goes to Korea, he asks him to carry three messages to Premier Kim Il Sung, Prince Sihanouk and President Nasser: China has always taught the overseas Chinese to obey the host countrys laws but cannot control what they do; its embassies have deviations in their work, not hidden, and corrected at any time; imperialism slanders China, but its policy toward Korea and Cambodia has not changed and it has always supported their anti-imperialist struggle. Oct. 27 he sees Daddah off and welcomes him at the capital airport on his way from Korea to Cambodia.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 20–22, 24, 27, 1967). Made public: 2020. Names: Zhou Enlai, Moktar Ould Daddah, Kim Il Sung, Norodom Sihanouk, Gamal Abdel Nasser.'
      tags:
      - name:zhou-enlai
      - name:daddah-moktar-ould
      - name:kim-il-sung
      - name:norodom-sihanouk
      - name:nasser
      - polity:prc
      - vis:only:prc+mauritania
- cite:
    id: cal.1967-10-23.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 23, 1967; Zhou with Mao at the reception of the Mauritanian president)'
- add:
    entry:
      id: cal.1967-10-27.china-leadership
      when: Oct. 27
      date: '1967-10-27'
      thread: china-leadership
      also:
      - korea
      - africa
      c: 'Zhou Enlai greets Mauritanias President Daddah at the capital airport, passing through Peking from Korea to Cambodia. Daddah conveys Premier Kim Il Sungs four-point message: (1) Koreas policy toward China has not changed and will not; (2) Kim has deep friendship with Mao and Zhou, which he cherishes, made in common struggle; (3) some differences exist, not serious, and may be settled by meeting and discussion; (4) he believes that if Korea is attacked China will help it as it has many times.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 191 (Oct. 27, 1967). Made public: 2020. See [[cal.1967-10-23.china-leadership]]. Names: Zhou Enlai, Moktar Ould Daddah, Kim Il Sung.'
      tags:
      - name:zhou-enlai
      - name:daddah-moktar-ould
      - name:kim-il-sung
      - polity:prc
      - vis:only:prc+mauritania
- add:
    entry:
      id: cal.1967-10-21.china-leadership-2
      when: Oct. 21
      date: '1967-10-21'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, told that in Suzhou, because of two-faction strife in finance and trade, export goods and daily goods are badly held up and nearly half the citys grain shops have stopped supply, has Du Ping of the Nanjing Military Region and Jiangsus military control committee men in Peking call the two Suzhou factions delegates and the garrison heads to settle it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 192 (Oct. 21, 1967). Made public: 2020. Names: Zhou Enlai, Du Ping.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-26.china-leadership
      when: Oct. 26
      date: '1967-10-26'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Cambodias ambassador Zhang Gang and explains Chinas side of the Cambodian misunderstanding of some of its policies and work: China does nothing to please the enemy; even where there are misunderstandings and unexpected criticisms, thinking of the common enemy puts them second. He asks Zhang to tell Sihanouk to keep his views, not argue them in public and give the enemy no use of them.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 192 (Oct. 26, 1967). Made public: 2020. Names: Zhou Enlai, Norodom Sihanouk.'
      tags:
      - name:zhou-enlai
      - name:norodom-sihanouk
      - polity:prc
      - vis:only:prc+cambodia
- add:
    entry:
      id: cal.1967-10-27.china-leadership-2
      when: Oct. 27
      date: '1967-10-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reports to Mao on the Qinghai committee core groups request of the 19th on whether units that have formed revolutionary committees may resume Party organizational life. Mao: "all places should do so; but the Party organization shall not allow those found with proof to be renegades or spies, nor those who behaved very badly in the Cultural Revolution and will not repent, to take part in organizational life."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 192 (Oct. 27, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-28.china-leadership
      when: Oct. 28
      date: '1967-10-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates to the national grain conference and the railway conference, asks each of 21 provinces, municipalities and regions of grain output and purchase, and gives three points: (1) rely on the home base, produce well, eat no imported grain; (2) by degrees stop hauling southern grain north; (3) buy no more than needed, and store grain and wealth in the people. If the line, aims and policy are right, farmers are to do the particulars themselves, without the top meddling or commanding blindly. "Turning to the countryside" in the city population is not all farming: process industry and handicrafts in the villages, and when electrified, handicrafts are industry; so town and country join. Why cotton is not turned to cloth: railways are the key; if they do not rise, coal and power do not, the cotton cannot be moved, and mills cannot raise output.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 192–193 (Oct. 28, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-10-29.china-leadership
      when: Oct. 29
      date: '1967-10-29'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, before dawn, again receives the delegates of the national railway conference: how to raise rail transport is too important; grain and industrial output come back to it; grasp revolution and promote production, and the railways are the key; traffic has not regained its level, and if this years target is not met next year suffers. To shout revolution and not grasp business makes the revolution empty. Whether once "conservative" or not, whoever does this well is a revolutionary. To freeze a locomotive depot at the drop of a hat is in no way revolutionary but wrecks the revolution and is not allowed; think of the whole; freight first.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193 (Oct. 29, 1967). Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
- add:
    entry:
      id: cal.1967-10-29.china-leadership-2
      when: Oct. 29
      date: '1967-10-29'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the Tongchuan coal mine in Shaanxi shut over two months by armed fighting, proposes two steps: first the State Councils business group sends men to help the 21st Army persuade the "Feb. 19" faction to stop fighting and return to the mine; if that fails, call the masses delegates and some bad ringleaders to Peking with the army, and at the meeting have the ringleaders stand aside, to teach and move the masses to a great alliance. Nov. 2 he receives Shaanxis army heads and some mass delegates and tells the officials to call the Shaanxi Military District, the garrison and the Coal Ministrys preparatory group to settle Tongchuan; Nov. 4 he forwards the two factions agreement; Nov. 9 the Center, State Council, Military Commission and Group issue the instruction on settling Tongchuan.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193 (Oct. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-29.china-leadership-3
      when: Oct. 29
      date: '1967-10-29'
      thread: china-leadership
      c: Zhou Enlai goes to Maos for a meeting on opening the schools and how to run the universities.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193 (Oct. 29, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10-31.china-leadership
      when: Oct. 31
      date: '1967-10-31'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the delegates of Cantons mass bodies: students are not to meddle in the workers movement; the workers must first steady the situation, and the working class stand forth as a model.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 193–194 (Oct. 31, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10.china-leadership
      when: Oct.
      date: 1967-10
      thread: china-leadership
      c: After National Day Zhou Enlai, told that He Long has a high fever and vomits, orders him sent to Hospital 301; Jiang Qing objects, and he then orders him to Hospital 267 and sends Yang Dezhong to bring his greetings.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Oct. 1967). Made public: 2020. Names: Zhou Enlai, He Long, Jiang Qing, Yang Dezhong.'
      tags:
      - name:zhou-enlai
      - name:he-long
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-10.china-leadership-2
      when: Oct.
      date: 1967-10
      thread: china-leadership
      c: At Jiang Qings prompting, Peking "Heaven" faction students go to the Western Hills to search the marshals residences. Zhou Enlai orders Fu Chongbi to send two regiments to guard them and dissuade the students, and himself deep at night takes the heads of the Peking garrison to inspect the marshals quarters and gives instructions on the guard.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Oct. 1967, the item after). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Fu Chongbi.'
      tags:
      - name:zhou-enlai
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-02.china-leadership
      when: Nov. 2–5
      date: '1967-11-02'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, over four days, holds talks on the problems of Shaanxi, Guangdong, Guangxi, Heilongjiang and other provinces, meaning to settle seven provinces soon. Nov. 8 the two Guangxi factions in Peking reach the ten-point agreement on promoting the great revolutionary alliance.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 2–5, 1967). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-11-05.china-leadership-3
      when: Nov. 5
      date: '1967-11-05'
      thread: china-leadership
      c: Zhou Enlai goes to Maos for the Cultural Revolution Groups small liaison meeting, at which Mao speaks of the Ninth Congress and rectifying the Party.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 5, 1967). Made public: 2020. See [[cal.1967-11-05.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-11-03.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 6, 1967; the *Renmin ribao*, *Hongqi* and *Jiefangjun bao* editorial for the 50th anniversary of the October Revolution, drafted under Chen Boda and Yao Wenyuan and approved by Mao, first summing up Maos views on class struggle in socialist society as the "theory of continuing revolution under the dictatorship of the proletariat")'
- add:
    entry:
      id: cal.1967-11-07.china-leadership-3
      when: Nov. 7
      date: '1967-11-07'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai writes Mao proposing that, for the 50th anniversary of the October Revolution, the Standing Committee of the National Peoples Congress and the State Council wire the Supreme Soviets Presidium and the Council of Ministers to congratulate the Soviet people. Mao approves.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 194 (Nov. 7, 1967). Made public: 2020. See [[cal.1967-11-07.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
