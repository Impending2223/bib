patch: b15b-zhou-1966-67
by: 'Claude (batch 15, second wave, reader 4: *Zhou Enlai nianpu, 1949–1976*, the 2020 edition, vol. III (下卷), 1966–67; the 1997 middle volume ends with 1965), Nov. 16–17, 2026'
