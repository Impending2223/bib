    entry:
      id: cal.1966-08-05.china-leadership-8
      when: Aug. 5–11
      date: '1966-08-05'
      thread: china-leadership
      c: Zhou Enlai goes every day to Maos for meetings, and talks with Liu Shaoqi, Deng Xiaoping, Chen Yun, Tao Zhu, Kang Sheng, Chen Boda, Xie Fuzhi and others.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 5–11, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Chen Yun, Tao Zhu, Kang Sheng, Chen Boda, Xie Fuzhi.'
