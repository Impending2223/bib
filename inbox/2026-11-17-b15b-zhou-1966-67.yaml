- add:
    entry:
      id: cal.1966-03-07.china-leadership-2
      when: Mar. 7
      date: '1966-03-07'
      thread: china-leadership
      c: Zhou Enlai chairs the northern agricultural groups meeting. Keep on with drought work from below; the aim is to change the areas backwardness within three to five years and end the grain haul from the south. Guard against slackening after two snows, and blind command. Land improvement; small waterworks; farm manure first; good tools; small Third Front works, which are sometimes a small city moved; the south not slackened.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17 (Mar. 7, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-08.china-leadership
      when: Mar. 8
      date: '1966-03-08'
      thread: china-leadership
      c: 'Zhou Enlai receives Romanias ambassador (Qiaozhiwu, 乔治乌) and his wife. On farming: living standards have risen but are not to be overrated; the countrys must be raised too, or the gap widens.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 17–18 (Mar. 8, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+romania
- add:
    entry:
      id: cal.1966-03-08.china-leadership-2
      when: Mar. 8
      date: '1966-03-08'
      thread: china-leadership
      also:
      - africa
      c: 'Zhou Enlai receives Algerias ambassador (Muhammad Sharif Sahli, 穆罕默德谢里夫·萨赫利) and exchanges views on language and script: besides the national tongue, a foreign language helps; language is a tool; on script reform, Putonghua promotion works best, simplified characters help but meet obstacles, and Latin spelling meets great resistance and may not replace characters.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 18 (Mar. 8, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc+algeria
- add:
    entry:
      id: cal.1966-03-08.china-leadership-3
      when: Mar. 8
      date: '1966-03-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, learning of the strong earthquake at Xingtai, Hebei, orders the Health Ministry to send medical teams and the General Staff to add men and medical units from the 63rd Army; the Academy of Sciences and State Science Commission to watch and study the quakes duration and direction. That night he meets State Council and General Staff staff, and tells Liu Shaoqi, Deng Xiaoping, Peng Zhen, Chen Yun, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Xiao Hua and Yang Chengwu of four measures: scientific teams to the site; Zeng Shan for the Center and the State Council to inspect and arrange relief; medical, supply and engineering staff from the ministries to go; he plans to fly to Shijiazhuang the next afternoon.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 18 (Mar. 8, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Chen Yun, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Xiao Hua, Yang Chengwu, Zeng Shan.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:peng-zhen
      - name:chen-yun
      - name:li-fuchun
      - name:li-xiannian
      - name:tan-zhenlin
      - name:bo-yibo
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-09.china-leadership
      when: Mar. 9
      date: '1966-03-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai and Zhou Rongxin, the State Councils secretary-general, report jointly to the Center and Mao on the Xingtai earthquake. It reached Handan, Shijiazhuang and Hengshui; worst hit were over thirty communes of Longyao, Ningjin and Julu counties, 320,000 people; first count over 7,000 dead, over 20,000 seriously hurt, about 80 percent of houses down. Measures: a Center delegation under Zeng Shan; the General Staff to bring in the Peking Military Region and local troops (the 63rd Army has a front command and a medical force of over 2,000; the 66th and 69th Armies and the Hebei Military District stand by); over 500 Peking medical staff leaving from the 8th; 54 veterinarians; trade, grain, finance ministries and the supply cooperatives to send aid; survey teams of the Academy of Sciences and the Geology Ministry left the night of the 8th. The delegation to stress relief propaganda, guard against a second quake and against saboteurs, and settle the peoples living and restore production.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 18–19 (Mar. 9, 1966). Made public: 2020. Names: Zhou Enlai, Zhou Rongxin, Zeng Shan.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-09.china-leadership-2
      when: Mar. 9
      date: '1966-03-09'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, in the afternoon, goes to the quake zone for the Center and the State Council in spite of aftershocks: Shijiazhuang, where he hears the prefectural Party committee; at 4 p.m. the Xingtai prefectural leaders; at 11 p.m. Longyao County. At the countys relief headquarters, six points: the line is self-reliance, hard work, rebuilding homes and production; three or four cadres to lead each brigade, drawn from lightly hit and unhit places; the 63rd Army to command, with sub-commands; flying groups, a county committeeman over one or two communes; experience recorded for the next generation, the laws of quakes not yet solved, "we must solve them"; cooking pots, one for three households, within two days.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 19–20 (Mar. 9, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-10.china-leadership-2
      when: Mar. 10
      date: '1966-03-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, back at Shijiazhuang at 1 a.m., questions the prefectural and city Party leaders on grain, water, fertilizer, seed and land improvement: why are some thoughts hard to settle? One must grasp both ends, the masses first; the Centers things come from the masses; set models. After the quake, practise self-reliance, "troubles make a nation".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 10, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-10.china-leadership-3
      when: Mar. 10
      date: '1966-03-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, at Baijiazhai in Longyao County, the worst-hit place, speaks at a mass meeting: move mountains like the Foolish Old Man; "fight" the earth; Communists, Youth League members and Young Pioneers to lead the relief. Leads the crowd in shouting the four slogans (strive, self-reliance, produce, rebuild homes). Visits families struck by the quake: record the lessons for later generations. Leaves for Peking at 5 p.m.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 10, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-03-12.china-leadership-2
      when: Mar. 12
      date: '1966-03-12'
      thread: china-leadership
      c: 'Zhou Enlai writes Liu Shaoqi, Peng Zhen, Chen Yi, Li Xiannian and Kang Sheng: he goes this noon to Tianjin for the North China Bureau meeting on five questions (war preparation, the small Third Front, drought, passing the grain test, study of Maos works), about five days; he plans a month of investigation and study in Hebei and Peking. He leaves arrangements on foreign affairs, defence, the Military Commission, the Secretariat and the State Council, and reports to Mao. Leaves for Tianjin at 12:30.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 12, 1966). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Peng Zhen, Chen Yi, Li Xiannian, Kang Sheng, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:peng-zhen
      - name:chen-yi
      - name:li-xiannian
      - name:kang-sheng
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
