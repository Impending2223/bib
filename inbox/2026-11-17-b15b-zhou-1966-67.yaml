      - polity:prc
      - vis:only:prc
      at: before 1966-09-21
- add:
    entry:
      id: cal.1966-09-02.china-leadership-2
      when: Sept. 2
      date: '1966-09-02'
      thread: china-leadership
      c: Zhou Enlai drafts "Several Points on the Red Guards" (unfinished), ten demands on the movement. The Red Guards to learn from the PLA, to be built into a fighting force with socialist consciousness and strict organization and discipline; to learn and master policy and tell enemy, friend and ally; the Partys united front policy is still needed and right; democrats with legal standing in the state and the front and scientists and technicians who have contributed are to be protected unless some active counter-revolution is found; argument, not force, no blows; searches of persons to be settled with the Peking committee, the garrison and the public security organs. Red Guards linking up must not hinder the Partys and states head organs, key organs and propaganda organs, the transport system, foreign relations, factory and construction work, research, nor reach the plants of advanced technology and their data.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 55–56 (Sept. 2, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-03.china-leadership-2
      when: Sept. 3
      date: '1966-09-03'
      thread: china-leadership
      c: Zhou Enlai makes the last revisions to the Points on the Red Guards at dawn and has his secretary call Tao Zhu, Kang Sheng, Li Fuchun, Xie Fuzhi, Chen Yi, Yang Chengwu, Wu De, Jiang Qing, Wang Renzhong, Zhang Chunqiao, Liu Zhijian, Yao Wenyuan, Wang Li, Guan Feng and Qi Benyu to discuss them in the morning. Tao Zhu, Chen Yi and others approve; Kang Sheng and others are against. The Points are not issued.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 56 (Sept. 3, 1966). Made public: 2020. See [[cal.1966-09-02.china-leadership-2]]. Names: Zhou Enlai, Tao Zhu, Kang Sheng, Li Fuchun, Xie Fuzhi, Chen Yi, Yang Chengwu, Wu De, Jiang Qing, Wang Renzhong, Zhang Chunqiao, Liu Zhijian, Yao Wenyuan, Wang Li, Guan Feng, Qi Benyu.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:kang-sheng
      - name:li-fuchun
      - name:xie-fuzhi
      - name:chen-yi
      - name:jiang-qing
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1966-09-02.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 56 (Sept. 2, 1966; on the Second Ministrys report that Red Guards at Lanzhou, Xining and elsewhere seek to enter its secret plants, Zhou telephones the Qinghai leaders to persuade the Red Guards courteously, and signs the Centers and Military Commissions urgent telegram to the committees and military regions of Qinghai, Gansu, Hunan, Sichuan and Inner Mongolia)'
- add:
    entry:
      id: cal.1966-09-02.china-leadership-3
      when: Sept. 2
      date: '1966-09-02'
      thread: china-leadership
      also:
      - china
      c: 'The Center forwards the Ministry of Public Security Party groups "Four Questions on the Relations between Public Security Organs and the Masses in the Cultural Revolution", drawn up on Zhou Enlais view: students and masses not to enter public security offices to seize the "black gang" nor storm police stations; the organs secrets not to be given to the masses; the masses not to punish prisoners in prisons and detention houses; unreasonable rules of the organs to be reformed, those of national range after general study.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 56–57 (Sept. 2, 1966, the item after). Made public: 2020. Check: the day; the chronology gives it after the entries of Sept. 2–3. To check: the document as the Center forwarded it. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-04.china-leadership
      when: Sept. 4
      date: '1966-09-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai chairs the Centers liaison meeting and, with Tao Zhu, Li Fuchun, Ye Jianying, Kang Sheng, Xie Fuzhi, Chen Yi and others, drafts two urgent telegrams to the Xinjiang committee and the Northwest Bureau. For the safety of the frontier, the Cultural Revolution in Yili, Tacheng, Altay and other border areas may use the "four bigs" to air and expose problems; the regions committee to settle them, by adjusting the leadership from above, with no direct dismissal by the masses. Out-of-town students are to be persuaded not to enter those areas, and those there sent away. By the nationalities policy the Center protects Saifudin; Wang Enmao rightly carried out the Centers decision and did not shield him; this may be told to the masses and to the Peking students; Xinjiangs movement must strengthen unity of Uighur, Han and other nationalities. Sent to Mao, who writes: "issue".'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57 (Sept. 4, 1966). Made public: 2020. See [[cal.1966-09-01.china-leadership-2]]. Names: Zhou Enlai, Tao Zhu, Li Fuchun, Ye Jianying, Kang Sheng, Xie Fuzhi, Chen Yi, Saifudin, Wang Enmao, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:tao-zhu
      - name:li-fuchun
      - name:ye-jianying
      - name:kang-sheng
      - name:xie-fuzhi
      - name:chen-yi
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09-05.china-leadership-5
      when: Sept. 5
      date: '1966-09-05'
      thread: china-leadership
      c: 'Zhou Enlai revises the "Provisional Rules on the Procedure for Appointing and Removing Party and Government Cadres", discussed at the Centers liaison meeting, and sends them to Mao. Bureau secretaries, the first and second secretaries of provincial, municipal and regional committees, governors, ministers and first or executive vice-ministers of central ministries, the State Councils office heads, commission heads and party-group secretaries or deputies: fixed by the Standing Committee, or proposed by its liaison meeting to Mao and Lin Biao. Department- and bureau-level cadres in Party and government: proposed by the liaison meeting, approved by Tao Zhu. The first and second leaders of the large military regions, services and three headquarters: reported to Mao and the Center.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 57 (Sept. 5, 1966). Made public: 2020. Reply: [[cal.1966-09-08.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao, Tao Zhu.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - name:lin-biao
      - name:tao-zhu
      - polity:prc
      - vis:only:prc
