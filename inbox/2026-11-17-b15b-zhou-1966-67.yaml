- add:
    entry:
      id: cal.1966-04-10.china-leadership-4
      when: Apr. 10
      date: '1966-04-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the correspondent of Pakistans *Dawn* (Yicha Xiao Houseyin, 伊查效·侯赛因) and answers his ten written questions. Chinas four sentences on the U.S.: China will not start a war on the U.S.; Chinese words count, and aid to any state attacked by the U.S.-led imperialists is certain, resisting a U.S. attack on China to the end if it comes; China is prepared, and the invader "will come in and not get out", nuclear weapons included; once war starts it has no bounds, and air power alone is a delusion: "can you come from the air and we not go by land?" The four are one whole; the main obstacle to normal ties is the U.S. policy of aggression against China.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Apr. 10, 1966). To check: the interview as printed in *Dawn* and the *Renmin ribao*. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
