      when: Feb. 21–25
      date: '1966-02-21'
      thread: china-leadership
      c: Zhou Enlai revises several times the draft Center and State Council directive on fighting drought and waterlogging to change the norths farm backwardness, adding that soil moisture is under 10 percent in many places, and that cadres are to study and spread Jiao Yulus example at Lankao. Later, as it lacks concrete plans, he proposes not issuing it for the time being.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14–15 (Feb. 21, 1966). Made public: 2020. Names: Zhou Enlai, Jiao Yulu.'
