      when: '1967'
      date: '1967'
      thread: china-leadership
      c: By Zhou Enlais record, to keep rail transport open and push the railways to a quick great alliance and three-in-one, in the year he received cadres and masses of the railway system nearly a hundred times; the alliance and three-in-one of the countrys eighteen railway bureaus, fifty-two sub-bureaus and some main stations and sections were all won through his attention.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 205 (1967, the last items). Made public: 2020. Check: the span. Names: Zhou Enlai.'
