      when: Feb. 2
      date: '1966-02-02'
      thread: china-leadership
      also:
      - africa
      - vietnam-hanoi
      c: Zhou Enlai receives the departing Guinean Ambassador Camara Mamadi and a Guinean economic delegation. The U.S. is set on widening the war in Vietnam; its "peace offensive" deceives world opinion. Message for President Touré. Education to join life, history and production; socialist states should help the nationalist states to self-reliance; victories come by struggle, not talks.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 8 (Feb. 2, 1966). Made public: 2020. Names: Zhou Enlai, Camara Mamadi, Ahmed Sekou Touré.'
      tags:
      - name:zhou-enlai
      - name:toure-ahmed-sekou
      - polity:prc
      - vis:only:prc+guinea
