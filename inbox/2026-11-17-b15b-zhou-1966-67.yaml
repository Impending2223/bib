      when: Feb. 13
      date: '1966-02-13'
      thread: china-leadership
      c: 'Zhou Enlai talks with some Chinese ambassadors on scientific and technical study tours: examine exits more strictly, stagger them, not many to one country; some foreign things are not advanced; badly chosen tours give away Chinas own bottom; the State Councils Foreign Affairs Office to hold the gate. Embassies to take up scientific and technical research; diplomats in the West and their wives to learn some science.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 12 (Feb. 13, 1966). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
