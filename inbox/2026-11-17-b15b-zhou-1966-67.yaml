- add:
    entry:
      id: cal.1966-08-05.china-leadership-7
      when: Aug. 5
      date: '1966-08-05'
      thread: china-leadership
      c: Zhou Enlai tells the duty secretary to wake him at any hour if Maos office calls him to a meeting or a talk.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 45 (Aug. 5, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
