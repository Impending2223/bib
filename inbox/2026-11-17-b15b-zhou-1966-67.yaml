      date: '1966-02-09'
      thread: china-leadership
      also:
      - africa
      - vietnam-hanoi
      c: 'Zhou Enlai receives the departing Ghanaian ambassador (Mai Ye, 麦耶) on the Vietnam war and on President Nkrumahs visit to China. He exposes the U.S. and South Vietnamese leaders joint communiqué at Honolulu: the U.S., its "peace talk" ruse failing and wary of widening the war, wants a joint statement to deceive the worlds peoples and meet quarrels at home.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 12 (Feb. 9, 1966). Made public: 2020. Names: Zhou Enlai, Kwame Nkrumah.'
      tags:
      - name:zhou-enlai
