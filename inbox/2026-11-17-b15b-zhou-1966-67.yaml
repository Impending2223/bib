- add:
    entry:
      id: cal.1967-05-10.china-leadership-2
      when: May 10
      date: '1967-05-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai calls the enlarged Standing Committee liaison meeting, which adopts the Peking Military Regions request for military control of Hebei and of five prefectures (Shijiazhuang, Tangshan, Zhangjiakou, Chengde, Hengshui), and the Centers and Military Commissions Several Opinions on the Gansu Question. May 11 he sends both to Mao: Hebei has been talked over several times and military control is wanted for the time as a transition; as a large province the military control committee is best headed by Zheng Weishan; the Hebei committees leaders, Liu Zihou, Yan Dakai, Li Yanbo and Lin Tie, need no conclusion now; for Gansu military control is best for now. Mao approves both.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 10, 1967). Made public: 2020. Names: Zhou Enlai, Zheng Weishan, Liu Zihou, Yan Dakai, Li Yanbo, Lin Tie, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1967-05-14.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 14, 1967; Maos May 14 note on military control in Gansu: could it be skipped, following the Regions view, with a provincial revolutionary committee formed after a period of work)'
- add:
    entry:
      id: cal.1967-05-11.china-leadership-2
      when: May 11
      date: '1967-05-11'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai reviews the Peking Revolutionary Committees important notice: the Centers order to grasp revolution, promote production and promote work is to be carried out; no hitting, smashing, looting, house-searching or seizing; the few who incite armed fights and the men who beat people to be dealt with by law; no destroying state property or labor discipline; no use of vehicles for armed fights, no absence without cause; the Centers Apr. 20 notice stopping linking up to be firmly obeyed. He sends it to Mao proposing it be issued in principle; Mao approves; issued May 14.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 148–149 (May 11, 1967). Names: Zhou Enlai, Mao Zedong.'
      tags:
      - name:zhou-enlai
      - name:mao-zedong
      - polity:prc
- add:
    entry:
      id: cal.1967-05-11.china-leadership-3
      when: May 11
      date: '1967-05-11'
      thread: china-leadership
      c: 'Zhou Enlai, that evening, receives the rebel delegates of the foreign affairs system and dissuades them from a mass meeting to seize and struggle against Chen Yi: the Center does not agree; Chen is not dismissed and must work; if he is to make a self-criticism at a meeting the conditions must be made, for now a crowd, a "jet plane" seat, would not do; when the time comes he will go with him. The rebels surround Zhou and try to make him say "Chen Yi is an anti-three-anti element". He answers in anger: "I did not say it; you impose it on me; I protest. You may call for downing Chen Yi, but not impose it on me. There are still several vice-premiers; I will protect them one by one. With my health, as it has become in this one year, you should let us do more for the revolution."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149 (May 11, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-11.china-leadership-4
      when: May 11–12
      date: '1967-05-11'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, over thousands of masses at Hohhot storming the Inner Mongolia committees building and armed fights, calls in succession Yang Chengwu, Xiao Hua, Zheng Weishan, Wu Faxian and the Inner Mongolia Military Regions head Teng Haiqing to settle it.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149 (May 11, 12, 1967). Made public: 2020. Names: Zhou Enlai, Yang Chengwu, Xiao Hua, Zheng Weishan, Wu Faxian, Teng Haiqing.'
      tags:
      - name:zhou-enlai
      - name:wu-faxian
      - polity:prc
      - vis:only:prc
