- add:
    entry:
      id: cal.1967-05-13.china-leadership-3
      when: May 13
      date: '1967-05-13'
      thread: china-leadership
      c: Zhou Enlai, for the 25th anniversary of Maos Yanan Talks on literature and art, directs the arts troupes of the army, navy and air force in Peking to perform jointly. Li Zuopeng and others go against it, backing one side and suppressing the other with premeditation, and the armed fight with bloodshed of May 13 follows. Zhou criticizes both sides. Afterward Lin Biao, Jiang Qing and others, by attending performances, back the side that Li Zuopeng, Wu Faxian and Qiu Huizuo back, which becomes "the proletarian revolutionaries of the three services that Vice-Chairman Lin supports".
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 149–150 (May 13, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Li Zuopeng, Lin Biao, Jiang Qing, Wu Faxian, Qiu Huizuo.'
      tags:
      - name:zhou-enlai
      - name:li-zuopeng
      - name:lin-biao
      - name:jiang-qing
      - name:wu-faxian
      - name:qiu-huizuo
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-15.china-leadership
      when: May 15
      date: '1967-05-15'
      thread: china-leadership
      c: 'Zhou Enlai, before dawn, receives the Red Guard delegates of the Peking Foreign Languages Institute and sharply criticizes their storming the Foreign Ministry to seize Chen Yi: first admit the error; he gave the policy and they would not listen, and are turning to the opposite. Even if they would bring Chen down, it is not so simple; he orders troops to guard the Ministry, and whoever storms in will be held. A full dossier or a protest or a poster is allowed: "I do not fear being brought down; I have worked for decades."'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 15, 1967). Made public: 2020. Names: Zhou Enlai, Chen Yi.'
      tags:
      - name:zhou-enlai
      - name:chen-yi
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-16.china-leadership-2
      when: May 16
      date: '1967-05-16'
      thread: china-leadership
      c: Zhou Enlai, told that the Economic Relations Commission rebels would seize Fang Yi, has him brought from hospital back to the State Council, and tells his secretary to say, if they ask, "the Premier called him for talks". May 18, receiving the commissions rebels, he says Fang Yis going abroad was approved by the Center.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 150 (May 16, 1967). Made public: 2020. Names: Zhou Enlai, Fang Yi.'
      tags:
      - name:zhou-enlai
      - polity:prc
      - vis:only:prc
