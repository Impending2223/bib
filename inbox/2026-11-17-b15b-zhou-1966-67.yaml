- add:
    entry:
      id: cal.1966-09.china-leadership-2
      when: Sept., late
      date: 1966-09
      thread: china-leadership
      c: Zhou Enlai tells Gu Mu to draft a notice against any casual interference with rail and shipping order.
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 55 (Sept., early 1966; "月底"). Made public: 2020. Check: the day; the chronology says months end. Names: Zhou Enlai, Gu Mu.'
      tags:
