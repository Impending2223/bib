      when: July 27
      date: '1966-07-27'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai, at midnight, receives Pakistans Commerce Minister and the Presidents adviser on defence, Faruque. Told that Irans and Turkeys leaders are interested in visiting China: they may find an official delegation hard just now, but semi-official or near-official people could come; China would welcome them and be ready to receive them; the systems differ, the interests are shared.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 42 (July 27, 1966). Made public: 2020. Names: Zhou Enlai.'
