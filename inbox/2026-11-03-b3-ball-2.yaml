patch: b3-ball-2
by: 'Claude (b3 reading agent, group state: Ball, The Past Has Another Pattern; batch 3 resumed)'
ops:
- add:
    entry:
      id: cal.1960-07-26.elections-1960-2
      when: July 26
      date: '1960-07-26'
      thread: elections-1960
      also:
      - transition-and-staff
      c: 'Ball to Stevenson, a long letter: if Kennedy wins, Stevenson will be offered the United Nations; if he does not
        want it, he should tell Kennedy promptly that he is interested "solely" in the "post of major responsibility," State.
        Offer to campaign in selected areas, and an ad hoc group to frame a foreign policy program for the first months of
        next year.'
      n: '[[w.ball-past-has-another-pattern]], 159. Names: Ball, Stevenson, Kennedy.'
      src:
        c: ffa91e74
        rows:
        - 'w.ball-past-has-another-pattern 159: all'
      tags:
      - name:ball-george-w
      - name:stevenson-adlai-e
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-03.foreign-aid
      when: Mar.
      date: 1961-03
      thread: foreign-aid
      also:
      - european-community
      c: Ball's first official trip to Europe. At the White House's charge he presses Erhard, Minister of Economics, to increase
        Germany's aid. Ball thinks it a mistake to treat the allies as a bank for Third World programs; Kennedy not impressed,
        by Ball's account.
      n: '[[w.ball-past-has-another-pattern]], 184–85. Check: the day and the place; Ball has "the middle of March." Names:
        Ball, Erhard, Kennedy.'
      src:
        c: '69234129'
        rows:
        - 'w.ball-past-has-another-pattern 184–85: all'
      tags:
      - name:ball-george-w
      - name:erhard-ludwig
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-05.european-community
      when: May
      date: 1961-05
      thread: european-community
      c: 'Ball to Kennedy, a memorandum: Britain''s aloofness from the Community reflects its long habit of balance-of-power
        politics.'
      n: '[[w.ball-past-has-another-pattern]], 209 (the memorandum; beside it Ball recalls Macmillan to Eisenhower, 1960:
        should France and Germany unite Western Europe, "Britain, in the long run, had no choice but to lead a peripheral
        alliance against them"). Check: the day. See [[cal.1961-04-05.european-community]]. Names: Ball, Kennedy.'
      src:
        c: d082742b
        rows:
        - 'w.ball-past-has-another-pattern 209: all'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-08-04.transition-and-staff
      when: Aug. 4–10
      date: '1961-08-04'
      thread: transition-and-staff
      c: Ball Acting Secretary of State for the first time, Rusk and Bowles both out of the country.
      n: '[[w.ball-past-has-another-pattern]], 171 (and Rusk to Ball "one day during the latter part of the summer": "I want
        you to take over more and more political matters and get yourself injected into them. Chet isn''t up to it"). Names:
        Ball, Rusk, Bowles.'
      src:
        c: 9260a040
        rows:
        - 'w.ball-past-has-another-pattern 171: all'
      tags:
      - name:ball-george-w
      - name:rusk-dean
      - name:bowles-chester
- add:
    entry:
      id: cal.1961-09.transition-and-staff-2
      when: Sept.
      date: 1961-09
      thread: transition-and-staff
      c: 'Rusk divides the Under Secretaries'' work, by Ball''s account: Bowles administration and personnel, policy planning
        and long-term operations; Ball to back Rusk up in crises.'
      n: '[[w.ball-past-has-another-pattern]], 171–72. Check: the day; Ball has "early September." See [[cal.1961-08-04.transition-and-staff]].
        Names: Rusk, Bowles, Ball.'
      src:
        c: f3694ae5
        rows:
        - 'w.ball-past-has-another-pattern 171–72: all'
      tags:
      - name:rusk-dean
      - name:bowles-chester
      - name:ball-george-w
- add:
    entry:
      id: cal.1964-11-23.vietnam
      when: Nov. 23
      date: '1964-11-23'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Joseph Alsop''s column, word of Ball''s dissent having reached him: "Ball''s knowledge of Asia could be comfortably
        contained in a fairly small thimble." Ball, by a note to Alsop: "You''ve got the receptacle wrong"; not a thimble
        "but a soup plate; it is at once both wider and more shallow than you suggest."'
      n: '[[w.ball-past-has-another-pattern]], 384. Check: the column''s paper; the day of Ball''s note. See [[cal.1964-10-05.vietnam]].
        Names: Alsop, Ball.'
      src:
        c: 5ff3ae26
        rows:
        - 'w.ball-past-has-another-pattern 384: all'
      tags:
      - name:alsop-joseph
      - name:ball-george-w
- add:
    entry:
      id: cal.1968-12-29.vietnam
      when: Dec. 29
      date: '1968-12-29'
      thread: vietnam
      also:
      - defense-clifford
      c: 'Clifford: "the level of combat is such that we are building up our troops; not cutting them down."'
      n: '[[w.ball-past-has-another-pattern]], 414. Check: the occasion and the text. Names: Clifford.'
      src:
        c: 1556d139
        rows:
        - 'w.ball-past-has-another-pattern 414: all'
      tags:
      - name:clifford-clark
