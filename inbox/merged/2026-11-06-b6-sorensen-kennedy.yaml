- add:
    entry:
      id: cal.1960-11-10.europe-and-the-alliance-france
      when: Nov. 10
      date: '1960-11-10'
      thread: europe-and-the-alliance-france
      c: 'Hyannis Port, before Kennedy leaves for Palm Beach. Of the messages of congratulation he cares most about two: de
        Gaulle''s cable, "Welcome, Dear Partner," and Khrushchev''s. He drafts the reply to de Gaulle with his wife. By Sorensen''s
        account.'
      n: '[[w.sorensen-kennedy]], 230–31. Check: the day; Sorensen: after the meeting of Nov. 10, "Other business delayed
        his departure." See [[cal.1960-11-09.soviet-union]]. Names: Kennedy, de Gaulle, Jacqueline Kennedy.'
      src:
        c: d3775003
        rows:
        - 'w.sorensen-kennedy 230–31: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:de-gaulle-charles'
      - 'name:kennedy-jacqueline'
- add:
    entry:
      id: cal.1960-12.transition-and-staff-4
      when: Dec.
      date: 1960-12
      thread: transition-and-staff
      c: 'Sorensen reviews with the President-elect his invitations to speak and the requests for magazine profiles. Kennedy:
        "Turn them all down. ... Every man that''s ever held a job like yours—Sherman Adams, Harry Hopkins, House, all the
        rest—has ended up in the ---. ... The best way to stay out of trouble is to stay out of sight." By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 261. Check: the day. Names: Sorensen, Kennedy.'
      src:
        c: 9bdce492
        rows:
        - 'w.sorensen-kennedy 261: all'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1960-12.laos
      when: Dec.
      date: 1960-12
      thread: laos
      c: 'Palm Beach. The President-elect to Sorensen: "Whatever''s going to happen in Laos, an American invasion, a Communist
        victory or whatever, I wish it would happen before we take over and get blamed for it." By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 640. Check: the month; Sorensen: at Palm Beach, as the administration prepared to take office.
        Names: Kennedy, Sorensen.'
      src:
        c: 9d07a80b
        rows:
        - 'w.sorensen-kennedy 640: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:sorensen-theodore-c'
- add:
    entry:
      id: cal.1961-01-15.transition-and-staff-cabinet
      when: Jan. 15
      date: '1961-01-15'
      thread: transition-and-staff-cabinet
      c: 'The Sunday before the inauguration. The Cabinet, several absent, at its first informal gathering, a brunch of lox
        and bagels at Goldberg''s home; Kennedy at work in Palm Beach. For several the first look at their colleagues. By
        Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 277. Names: Goldberg, Kennedy.'
      src:
        c: 5286a97e
        rows:
        - 'w.sorensen-kennedy 277: all'
      tags:
      - 'name:goldberg-arthur-j'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1961-01-28.program
      when: Jan. 28–29
      date: '1961-01-28'
      thread: program
      c: 'Kennedy, reviewing a near-final draft of the State of the Union, done in an all-night session, finds its warnings
        insufficient and inserts: "Each day the crises multiply. Each day their solution grows more difficult. Each day we
        draw nearer the hour of maximum danger." Sunday, after church, in the Mansion, he adds: "There will be further setbacks
        before the tide is turned." By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 292. The message: [[cal.1961-01-30.program]]. Names: Kennedy.'
      src:
        c: fd5c04b8
        rows:
        - 'w.sorensen-kennedy 292: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:sorensen-theodore-c'
- add:
    entry:
      id: cal.1961-04-20.cuba-bay-of-pigs-2
      when: Apr. 20
      date: '1961-04-20'
      thread: cuba-bay-of-pigs
      c: 'The South Lawn, Thursday morning. Kennedy with Sorensen, "a depressed and lonely man": a speech to the editors that
        afternoon and talks with every Republican leader planned. Privately: many of the leaders most anxious to see Castro
        removed were the first to assail the United States. By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 308. See [[cal.1961-04-20.cuba]]. Names: Kennedy, Sorensen, Castro.'
      src:
        c: dde42f42
        rows:
        - 'w.sorensen-kennedy 308: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:sorensen-theodore-c'
      - 'name:castro-fidel'
- add:
    entry:
      id: cal.1961-09-24.laos
      when: Sept. 24
      date: '1961-09-24'
      thread: laos
      also:
      - cuba-bay-of-pigs
      c: 'New York, his hotel room, the eve of the address to the UN. Kennedy to Sorensen, on foreign policy: "Thank God the
        Bay of Pigs happened when it did. Otherwise we''d be in Laos by now—and that would be a hundred times worse." By Sorensen''s
        account.'
      n: '[[w.sorensen-kennedy]], 644. The address: Address in New York City Before the General Assembly of the United Nations,
        [1961 Pub. Papers 618](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=676) (Sept.
        25, 1961). Names: Kennedy, Sorensen.'
      src:
        c: 3185a6d7
        rows:
        - 'w.sorensen-kennedy 644: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:sorensen-theodore-c'
- add:
    entry:
      id: cal.1961-11.right-and-the-military-2
      when: Nov.
      date: 1961-11
      thread: right-and-the-military
      c: 'The address at the University of Washington. Two columnists, one held "hard" and the other "soft," each asked for
        a draft without the other''s knowing; the drafts blended. By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 511, 512 n.1. Check: the day; before the address of Nov. 16. The address: [[cal.1961-11-16.right-and-the-military]].
        Names: Kennedy.'
      src:
        c: '49690745'
        rows:
        - 'w.sorensen-kennedy 511–12: all'
      tags:
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1962-05-23.medicare
      when: May 23
      date: '1962-05-23'
      thread: medicare
      c: 'News conference. The mail on his Medicare speech about evenly divided; but the mail no true indicator: "I got last
        week 28 letters on Laos ... [and] 440 letters on the cancellation of a tax exemption for a ''mercy'' foundation."'
      n: 'The President''s News Conference, [1962 Pub. Papers 431](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=491),
        432 (May 23, 1962). [[w.sorensen-kennedy]], 332–33 (the mail, from "a 1962 press conference"). See [[cal.1962-05-20.medicare]].
        Names: Kennedy.'
      src:
        c: 0c35249a
        rows:
        - 'w.sorensen-kennedy 332–33: all'
      tags:
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1962-10-18.missile-crisis-excomm-3
      when: Oct. 18
      date: '1962-10-18'
      thread: missile-crisis-excomm
      c: 'The Executive Committee. One of the advocates of an air strike, a Republican, passes Sorensen a note across the
        table: if the missiles are allowed to become operational, "the next House of Representatives is likely to have a Republican
        majority." By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 688 (quoting it). Check: the day; Sorensen puts it in the debate of Oct. 17–18. See [[cal.1962-10-18.missile-crisis-6]].
        Names: Sorensen.'
      src:
        c: 92c7e92e
        rows:
        - 'w.sorensen-kennedy 688: all'
      tags:
      - 'name:sorensen-theodore-c'
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-excomm-2
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis-excomm
      c: 'The back porch, the Saturday before the address. Kennedy speaks to Sorensen not of his own possible death but of
        all the innocent children of the world who had never had a chance or a voice. By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 705. See [[cal.1962-10-20.missile-crisis-excomm]]. Names: Kennedy, Sorensen.'
      src:
        c: 6d099b98
        rows:
        - 'w.sorensen-kennedy 705: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:sorensen-theodore-c'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-30
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: 'Before the address. Sorensen refuses all calls from newsmen; he answers one powerful Congressman ("Is it serious?"
        "Yes") and Edward Kennedy ("Should I give my campaign dinner speech on Cuba?" "No"). He gives Feldman and Lee White
        copies of the speech. By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 701. See [[cal.1962-10-22.missile-crisis-4]]. Names: Sorensen, Edward Kennedy, Feldman,
        Lee White.'
      src:
        c: 9740a04a
        rows:
        - 'w.sorensen-kennedy 701: all'
      tags:
      - 'name:sorensen-theodore-c'
      - 'name:kennedy-edward-m'
      - 'name:feldman-myer'
      - 'name:white-lee-c'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-excomm
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-excomm
      c: 'After the address. A congressional leader telephones Kennedy: a group of the leaders, watching it together after
        leaving his office, now understand and support his policy more fully. By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 704. See [[cal.1962-10-22.missile-crisis-4]]. Names: Kennedy.'
      src:
        c: db8df577
        rows:
        - 'w.sorensen-kennedy 704: all'
      tags:
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-excomm
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis-excomm
      c: 'A meeting shortly after the address. Kennedy''s doodles on two sheets of his yellow pad: "serious ... 16-32 [missiles]
        within a week ... Soviet submarines ... blockade ... Guantanamo ... increases risk ... McCone ... 1 million men ...
        holding the alliance."'
      n: '[[w.sorensen-kennedy]], 705 (quoting them). Check: the day; Sorensen: "during one of our meetings shortly after
        his speech." Names: Kennedy, McCone.'
      src:
        c: f0511b08
        rows:
        - 'w.sorensen-kennedy 705: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:mccone-john-a'
- add:
    entry:
      id: cal.1962-11.missile-crisis-settlement
      when: Nov.
      date: 1962-11
      thread: missile-crisis-settlement
      c: 'Kennedy to his negotiators at the UN, after one of many long sessions, half in jest: "we seem to be spending as
        much time negotiating with you as you are negotiating with the Soviets." By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 720. Check: the day. Names: Kennedy.'
      src:
        c: fe9d1f08
        rows:
        - 'w.sorensen-kennedy 720: all'
      tags:
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1962-12.economy-2
      when: Dec.
      date: 1962-12
      thread: economy
      c: 'The address to the Economic Club of New York being finished. Galbraith, stopping at the White House from India:
        "the most Republican speech since McKinley"; he would rather add $10 billion in spending than cut taxes $10 billion.
        Kennedy: not obtainable in the 88th Congress. Kerr sends suggestions; Mills reads it without commitment; Dillon and
        Heller add their views. By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 430. Check: the day; before the address of Dec. 14. The address: [[cal.1962-12-14.economy]].
        Names: Galbraith, Kennedy, Kerr, Mills, Dillon, Heller.'
      src:
        c: 6fc7539a
        rows:
        - 'w.sorensen-kennedy 430: all'
      tags:
      - 'name:galbraith-john-kenneth'
      - 'name:kennedy-john-f'
      - 'name:kerr-robert-s'
      - 'name:mills-wilbur-d'
      - 'name:dillon-c-douglas'
      - 'name:heller-walter-w'
- add:
    entry:
      id: cal.1963-06-26.europe-and-the-alliance-kennedy-in
      when: June 26
      date: '1963-06-26'
      thread: europe-and-the-alliance-kennedy-in-europe
      also:
      - berlin-and-vienna
      c: 'Leaving West Berlin for Ireland, over East Germany. Kennedy, glowing: Americans would see their efforts and risks
        appreciated; he would leave his successor a note "to be opened at a time of some discouragement": "Go to Germany."
        To Sorensen, in the cabin of Air Force One: "We''ll never have another day like this one as long as we live." By Sorensen''s
        account.'
      n: '[[w.sorensen-kennedy]], 601. See [[cal.1963-06-26.berlin-and-vienna]]. Names: Kennedy, Sorensen.'
      src:
        c: 512191d6
        rows:
        - 'w.sorensen-kennedy 601: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:sorensen-theodore-c'
- add:
    entry:
      id: cal.1963-09.economy
      when: 'Sept., fall'
      date: 1963-09
      thread: economy
      c: 'Heller suggests that Mrs. Kennedy, whose travels abroad drew criticism, take a "See America First" trip, to draw
        Americans to vacation at home. Kennedy, laughing: "Next year I''ll ask her to do that." By Sorensen''s account.'
      n: '[[w.sorensen-kennedy]], 409–10. Check: the month; Sorensen: "in the fall of 1963." Names: Heller, Jacqueline Kennedy,
        Kennedy.'
      src:
        c: '25964247'
        rows:
