# Novak does not describe the rally of July 4, 1963; 132-33 has it announced at the press conference of Apr. 8 (cited there): out of To check.
- edit:
    id: cal.1963-07-04.elections-1964
    base: 925e1190
    set:
      n: "[[w.perlstein-before-the-storm]], 194, 222 (the rally, the crowd, White, 222; Goldwater at Prescott each July 4, 194); [[w.young-two-suns-of-the]], 65 (the rally at the Armory); [[w.white-making-of-the-president-1965]], 93 (forty-three busloads from New York, thirteen from Connecticut; some 7,000); [[w.goldberg-barry-goldwater]], 172 (Fannin, Tower and Curtis the speakers; forty-two busloads from New York, thirteen from Connecticut; nine thousand, standing room only). [[w.gifford-center-cannot-hold]], 200 (the rally at the Armory). [[w.white-suite-3505]], 181–87 (the rally; Tower the last speaker, 186; O'Donnell master of ceremonies, 184; Goldwater in the parade at Prescott, 184). Check: Goldberg, 172, gives a crowd of nine thousand and Fannin and Curtis among the speakers. To check: O'Donnell's handwritten notes on the rally, F. Clifton White Papers, Cornell University, box 18/July 4, 1963 Rally (cited by [[w.perlstein-before-the-storm]], 222 n.1); U.S. News and World Report, July 15, 1963 (the rally) (cited by [[w.perlstein-before-the-storm]], 222 n.2a); Mary McGrory and David Broder, Washington Star, July 5, 1963 (cited by [[w.perlstein-before-the-storm]], 222 n.2b); Baltimore Sun, July 5, 1963 (cited by [[w.perlstein-before-the-storm]], 222 n.2c); Schedule of the rally, F. Clifton White Papers, Cornell University, box 18/July 4, 1963 Rally (cited by [[w.perlstein-before-the-storm]], 222 n.2d); *Washington Evening Star*, July 5, 1963 (cited by [[w.white-suite-3505]], 187 n.1, for the crowd). See [[cal.1963-04-08.elections-1964]]. Names: Goldwater, Tower, O'Donnell, White. Check: Young, 65, gives almost 9,000, forty-three buses from New York alone. Check: Gifford, 200, gives almost 9,000 from forty-four States, two busloads from New York. Check: White, 183, gives more than 9,000 inside, several thousand shut out; the *Star* 8,000, the *Sun* 6,000, 187."
