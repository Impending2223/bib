      date: '1963-12-02'
      thread: republican-party
      also: [elections-1964]
      c: 'Lodge Topic A in Washington. Morton: "Until yesterday, I would have thought Lodge would have some trouble
        getting a seat at the convention, much less be nominated for President. But now, I just don''t know."'
      n: '[[w.novak-agony-of-the-g]], 260–61. See [[cal.1963-12-01.elections-1964]]. Names: Morton, Lodge.'
