      date: '1962-12-07'
      thread: republican-party
      also: [elections-1964]
      c: 'Washington, the national committee''s postelection meeting. Its consensus, as Paul Duke reports it in the *Wall
        Street Journal* of Dec. 10: Rockefeller "so far ahead ... that he may have an unbreakable hammerlock on the
        prize." Tool, Colorado''s chairman: people "enthusiastically working for him now who bitterly opposed him
        before."'
      n: '[[w.novak-agony-of-the-g]], 99–100. See [[cal.1962-12-06.republican-party]]. Names: Rockefeller.'
