      date: '1963-12'
      thread: republican-party
      also: [elections-1964]
      c: 'Harlow, Eisenhower''s speechwriter, now Procter & Gamble''s man in Washington, at the asking of Republicans in
        Congress angry at the *Times*''s story, telephones Gettysburg. To them: Eisenhower neutral; he hopes many will
        seek the nomination, Lodge among them, and told Lodge only that if he meant to run he should hurry home.'
      n: '[[w.novak-agony-of-the-g]], 261. See [[cal.1963-12-01.elections-1964]]. Names: Harlow, Eisenhower, Lodge.
        Check: the day.'
      tags: ['name:harlow-bryce-n', 'name:eisenhower-dwight-d', 'name:lodge-henry-cabot']
      src:
        c: 7e43535a
        rows: ['w.novak-agony-of-the-g 261: all']
