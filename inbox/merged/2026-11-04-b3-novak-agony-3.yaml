      date: '1963-12-01'
      thread: elections-1964
      also: [press-and-broadcasting]
      c: 'Sunday. The *New York Times*, front page: "EISENHOWER URGES LODGE TO PURSUE GOP NOMINATION." Felix Belair, Jr.,
        from Washington: Eisenhower has asked Lodge to make himself available and to come home from Saigon soon; Lodge
        among the few who could meet Johnson on war and peace; Rockefeller not recovered, Nixon of limited appeal,
        Scranton not available.'
      n: '[[w.novak-agony-of-the-g]], 259–60 & n.8. See [[cal.1963-12-08.elections-1964]]. Names: Eisenhower, Lodge.
        Check: the day; the calendar has the *Times*''s story on Dec. 8.'
      tags: ['name:eisenhower-dwight-d', 'name:lodge-henry-cabot']
      src:
        c: d2e1cbb8
        rows: ['w.novak-agony-of-the-g 259–60 & n.8: all', 'via x.1963-12-01.belair-new-york-times-lodge: all']
