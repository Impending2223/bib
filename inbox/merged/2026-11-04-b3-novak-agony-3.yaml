- cite:
    id: cal.1963-06-25.republican-party
    item: '[[w.novak-agony-of-the-g]], 195–201 (June 27–28 on the floor, the Sheraton-Palace; three in four delegates for
      Goldwater; Gaston directing the disruption; Nadasdy; adjourned at 5:15 a.m., having adopted only the statement of
      principles and elected officers, by Hiller''s report; the resolutions committee''s civil rights plank never
      brought to the floor)'
    units: 'A, C-F'
- src:
