    entry:
      id: cal.1963-05-17.states-and-cities
      when: May 17
      date: '1963-05-17'
      thread: states-and-cities
      c: 'Harrisburg, Pa. The Senate passes Scranton''s tax program, 27 to 23, on party lines, after Scranton''s visit to
        its Finance Committee to disown an aide''s reported boast.'
      n: '[[w.novak-agony-of-the-g]], 169–70. See [[cal.1963-05-14.states-and-cities]]. Names: Scranton.'
      tags: ['name:scranton-william-w', 'state:pa', 'ok:result-form']
      src:
        c: 4a8404f7
        rows: ['w.novak-agony-of-the-g 169–70: all']
- add:
    entry:
      id: cal.1963-04-27.goldwater
      when: Apr. 27
      date: '1963-04-27'
      thread: goldwater
      also: [elections-1964]
      c: 'Washington, the eleventh National Republican Women''s Conference. On each chair a copy of a *U.S. News & World
        Report* article on how Goldwater could beat Kennedy with the Solid South, the only presidential literature there.
        Goldwater speaks, to war whoops.'
      n: '[[w.novak-agony-of-the-g]], 171 & n.9 (Miller''s notice). Names: Goldwater, Miller.'
      tags: ['name:goldwater-barry-m', 'name:miller-william-e']
