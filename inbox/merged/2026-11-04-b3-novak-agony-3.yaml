- add:
    entry:
      id: cal.1963-01.republican-party-2
      when: Jan.
      date: '1963-01'
      thread: republican-party
      also: [conservative-movement, elections-1964]
      c: 'The Capitol, the Senate dining room. Bruce Chapman, founder of *Advance*, at lunch with Hinman, asks
        Rockefeller money, $50,000 at least, against a Birchite take-over of the Young Republicans. Hinman thanks him
        and declines.'
      n: '[[w.novak-agony-of-the-g]], 199–200 & n.14 (Rockefeller, July 19, denies any request for funds). See
        [[cal.1963-06-25.republican-party]]. Names: Hinman. Check: the day.'
      tags: ['name:hinman-george-l']
      src:
        c: de3977ea
        rows: ['w.novak-agony-of-the-g 199–200 & n.14: all']
- add:
    entry:
      id: cal.1963-07-19.elections-1964
      when: July 19
      date: '1963-07-19'
      thread: elections-1964
      c: 'New York, a news conference, moved to a hotel from his office, where Negro demonstrators sit in. Rockefeller
        names Goldwater: "The great threat is whether the radical right wing, part of Senator Goldwater''s following,
        will be able to capture its leader." He denies receiving any request for funds against the right in the Young
        Republicans.'
      n: '[[w.novak-agony-of-the-g]], 215 & n.10 ("the next day" after Curtis''s speech of Thursday, July 18); [[w.novak-agony-of-the-g]],
        200 n.14 (July 19; the funds). See [[cal.1963-07-14.elections-1964]]; [[cal.1963-01.republican-party-2]]. Names:
        Rockefeller, Goldwater.'
      tags: ['name:rockefeller-nelson', 'name:goldwater-barry-m']
      src:
        c: 2143798d
        rows: ['w.novak-agony-of-the-g 215 & n.10: A-B', 'w.novak-agony-of-the-g 200 n.14: A, C']
# --- ch. XIII, pp. 202-218
- add:
    entry:
      id: cal.1963-07-08.elections-1964
      when: July 8
      date: '1963-07-08'
      thread: elections-1964
      c: 'New York, the week of July 8. Rockefeller decides on a statement against the radical right, over the cautions of
        Hinman, Fred Young, the State chairman, and Harry O''Donnell: he might wound Goldwater but would destroy himself.
        Draft after draft; by the week''s end Morrow takes a copy to Keating by the shuttle; Javits shown his in New York;
        Kuchel among the few outside the State.'
      n: '[[w.novak-agony-of-the-g]], 206–7 (Kuchel urging such a statement since 1962, 204–5). See
        [[cal.1963-07-14.elections-1964]]. Names: Rockefeller, Hinman, Keating, Javits, Kuchel. Check: the days.'
      tags: ['name:rockefeller-nelson', 'name:hinman-george-l', 'name:keating-kenneth-b', 'name:javits-jacob-k',
        'name:kuchel-thomas-h']
      src:
        c: 3e378d59
        rows: ['w.novak-agony-of-the-g 206–7: all']
- add:
    entry:
      id: cal.1963-07-13.elections-1964
      when: July 13
      date: '1963-07-13'
      thread: elections-1964
      also: [goldwater]
      c: 'Saturday. Rockefeller to every Republican member of Congress and every Republican governor, Goldwater among
        them, by telegram: a statement "of common interest" the next day. Copies by airmail, received Monday.'
      n: '[[w.novak-agony-of-the-g]], 211–12. See [[cal.1963-07-14.elections-1964]]. Names: Rockefeller, Goldwater.'
      tags: ['name:rockefeller-nelson', 'name:goldwater-barry-m']
      src:
        c: e2727aac
        rows: ['w.novak-agony-of-the-g 211–12: all']
- cite:
    id: cal.1963-07-14.elections-1964
    item: '[[w.novak-agony-of-the-g]], 207–10 (the text quoted: "the tactics of totalitarianism"; "it is now being
      seriously proposed"; a program of racism or sectionalism "would ... destroy it altogether"; a weekend release)'
    units: A-B
- check:
    id: cal.1963-07-14.elections-1964
    text: 'Check: Novak, 210, quotes "would in and of itself not only defeat the Republican Party in 1964 but would
      destroy it altogether."'
- cite:
    id: cal.1963-07-15.goldwater
    item: '[[w.novak-agony-of-the-g]], 211–12 (Monday morning in his office, no comment, "There''ll be no more
      breakfasts"; Tony Smith sends reporters to Curtis; to the Associated Press in late afternoon, "just a formal
      declaration of candidacy"; Kuchel to the AP, a "splendid service," Keating the same, Javits a day later, 216)'
    units: B
- add:
    entry:
      id: cal.1963-07-18.republican-party-congress
      when: July 18
      date: '1963-07-18'
      thread: republican-party-congress
      also: [elections-1964, goldwater]
      c: 'Senate, Thursday afternoon. Curtis answers Rockefeller''s statement without naming him: "an intemperate and,
        in my opinion, ill-judged, attack ... on the conservatives of the Republican Party"; such a man "has already
        forfeited any claim to loyalty from any part of the party organization." Written with Goldwater and Victor
        Johnston, Johnston in the gallery.'
      n: '[[w.novak-agony-of-the-g]], 212–15 & nn.8–9 (the Record''s text reprinted by the thousands for the Goldwater
        clubs). To check: the *Congressional Record*, Senate, July 18, 1963. See [[cal.1963-07-14.elections-1964]].
        Names: Curtis, Goldwater, Rockefeller.'
      tags: ['name:curtis-carl-t', 'name:goldwater-barry-m', 'name:rockefeller-nelson']
      src:
        c: 5ef7f130
        rows: ['w.novak-agony-of-the-g 212–15 & nn.8–9: all', 'via x.1963-07-18.curtis-senate-speech-rockefeller: A-B']
- add:
    entry:
      id: cal.1963-07-19.goldwater-2
      when: July 19
      date: '1963-07-19'
      thread: goldwater
      also: [elections-1964]
      c: 'Goldwater on Rockefeller''s challenge: worried about the "radical left" in the administration, not "any rightist
        society members who are not in government." Of Rockefeller: "I don''t know what he''s following—his own
        dictates, maybe. I''m not going to answer this sort of thing."'
      n: '[[w.novak-agony-of-the-g]], 215–16. See [[cal.1963-07-19.elections-1964]]. Names: Goldwater, Rockefeller.
        Check: the day.'
      tags: ['name:goldwater-barry-m', 'name:rockefeller-nelson']
      src:
        c: 7e34e228
        rows: ['w.novak-agony-of-the-g 215–16: all']
- cite:
    id: cal.1963-08-05.elections-1964
    item: '[[w.novak-agony-of-the-g]], 216 (an Albany press conference)'
    units: A
- src:
    id: cal.1963-07-14.elections-1964
    rows: ['via x.1963-07-14.rockefeller-statement-radical-right: A-B']
# --- chs. XIV-XV, pp. 219-248
- cite:
    id: cal.1963-09-15.opinion-5
    item: '[[w.novak-agony-of-the-g]], 219–20 & nn.1–2 (Sept. 15; Republicans 59 to 41, independents 56 to 44, Democrats
      58 to 42 for Rockefeller; the South, Goldwater 54, Kennedy 34)'
    units: B-D
- add:
    entry:
      id: cal.1963-09-14.elections-1964
      when: Sept. 14
      date: '1963-09-14'
      thread: elections-1964
      c: 'Rockefeller on *Meet the Press* (NBC), of the reaction to his remarriage: "I have a very deep understanding of
        the reactions of individuals in this situation. ... I think it''s a situation which in political life is
        difficult."'
      n: '[[w.novak-agony-of-the-g]], 220 (his private polls show the remarriage the cause of his decline). See
        [[cal.1963-05-04.elections-1964]]. Names: Rockefeller.'
      tags: ['name:rockefeller-nelson']
      src:
        c: 834641ad
        rows: ['w.novak-agony-of-the-g 220: all']
- cite:
    id: cal.1963-09-07.republican-party
    item: '[[w.novak-agony-of-the-g]], 221–24 & nn.3–4 (the Convair at Rockford Airport at noon, some seventy local
      dignitaries; Daly in an Uncle Sam suit; five thousand at the fairgrounds; Carpentier, Robertson and Percy away;
      Guyer: Rockefeller invited after Goldwater and others declined; the Goldwater buttons not removed; "We are lost in
      the woods")'
    units: A-F
- add:
    entry:
      id: cal.1963-08.republican-party
      when: Aug.
      date: '1963-08'
      thread: republican-party
      also: [elections-1964]
      c: 'Some two weeks before Rockefeller''s picnic in his district, Representative John Anderson asks Dirksen by
        telephone whether he is going. Dirksen: "Why, of course not, John. I''ll be busy." Anderson in Washington that
        day at a "Congressional seminar"; Dirksen in the capital, for the debate on the test ban treaty, he says.'
      n: '[[w.novak-agony-of-the-g]], 222–23. See [[cal.1963-09-07.republican-party]]. Names: Anderson, Dirksen,
        Rockefeller. Check: the day.'
      tags: ['name:anderson-john-b', 'name:dirksen-everett', 'name:rockefeller-nelson']
      src:
        c: e1a205d9
        rows: ['w.novak-agony-of-the-g 222–23: all']
- add:
    entry:
      id: cal.1963-09-07.republican-party-2
      when: Sept. 7
      date: '1963-09-07'
      thread: republican-party
      c: 'Joliet, Ill., a Republican picnic, no more than five hundred. Percy, Carpentier and Robertson, the candidates
        for governor, there, two hours from Rockefeller''s crowd in Ogle County.'
      n: '[[w.novak-agony-of-the-g]], 222. See [[cal.1963-09-07.republican-party]]. Names: Percy, Robertson.'
      tags: ['name:percy-charles-h', 'name:robertson-hayes', 'state:il']
      src:
        c: f6f16823
        rows: ['w.novak-agony-of-the-g 222: all']
- cite:
    id: cal.1963-09-11.goldwater
    item: '[[w.novak-agony-of-the-g]], 225, 232 (the twenty-fifth convention; Carpentier, Robertson and Percy shaking his
      hand; "in differing, we need not beat the hides off those we differ with")'
    units: A-B
- add:
    entry:
      id: cal.1963-09-11.goldwater-2
      when: Sept. 11
      date: '1963-09-11'
      thread: goldwater
      also: [press-and-broadcasting]
      c: 'Chicago, one stop of ten. Goldwater by commercial jet to the WBKB (ABC) studios for a taped discussion; to a
        reporter of the CBS station: no filmed interviews for CBS, "I just don''t trust your people in New York. I know
        what they do with tapes." No car arranged; a stranger drives him through the rain to the women''s dinner.'
      n: '[[w.novak-agony-of-the-g]], 224–25 & n.6 (his grievance, Friendly''s documentary on the right). See
        [[cal.1963-09-11.goldwater]]. Names: Goldwater.'
      tags: ['name:goldwater-barry-m', 'city:chicago']
      src:
        c: 8b7cfa5d
        rows: ['w.novak-agony-of-the-g 224–25 & n.6: all']
- add:
    entry:
      id: cal.1963-09-17.goldwater
      when: Sept. 17
      date: '1963-09-17'
      thread: goldwater
      also: [elections-1964]
      c: 'Los Angeles, Dodger Stadium. Some forty thousand for Goldwater; Cabell Phillips in the *Times*: "a welcome such
        as is usually reserved for a Presidential candidate."'
      n: '[[w.novak-agony-of-the-g]], 226. Names: Goldwater.'
      tags: ['name:goldwater-barry-m', 'city:los-angeles']
