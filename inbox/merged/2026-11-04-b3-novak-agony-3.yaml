- add:
    entry:
      id: cal.1964-04-05.goldwater-2
      when: Apr. 5
      date: '1964-04-05'
      thread: goldwater
      also: [elections-1964]
      c: 'Chicago, a suite in the O''Hare International Inn. Goldwater''s regional and State chairmen, closed doors: the
        reorganized command unveiled, White and Kleindienst codirectors of field operations, White over the convention
        States and the floor, Kleindienst over the Oregon and California primaries. White runs the briefings; the
        delegate hunt at the conventions the campaign''s chief work.'
      n: '[[w.novak-agony-of-the-g]], 337–38 & n.6 (the arrangement first made between Kleindienst and White over brandy,
        then at a staff meeting in the Duryea Building weeks later). Names: White, Kleindienst.'
      tags: ['name:white-f-clifton', 'name:kleindienst-richard-g', 'city:chicago']
      src:
        c: b0dd00e4
        rows: ['w.novak-agony-of-the-g 337–38 & n.6: all']
