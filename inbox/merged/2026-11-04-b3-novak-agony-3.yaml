      when: Mar.
      date: '1964-03'
      thread: goldwater
      c: 'After New Hampshire. Karl Hess, a writer Baroody of the American Enterprise Institute had recommended, part-time
        since late 1963, joins Goldwater''s staff full-time as speechwriter and travels with him: set speeches ("Why, I''m
        the biggest peacemonger you ever saw"). Tony Smith, ill, replaced as press secretary on the road by Edwin K.
        Nellor, once a writer of McCarthy''s speeches.'
      n: '[[w.novak-agony-of-the-g]], 334–36 & nn.4–5. Names: Hess, Goldwater. Check: the day.'
      tags: ['name:hess-karl', 'name:goldwater-barry-m']
