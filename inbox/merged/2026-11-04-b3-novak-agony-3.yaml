      date: '1963-05-14'
      thread: states-and-cities
      c: 'Harrisburg, Pa. The House passes Scranton''s tax program, the sales tax from four cents to five, with a single
        Republican defection, Horst; the Democrats against.'
      n: '[[w.novak-agony-of-the-g]], 168–69 (Scranton at his news conference, May 15: Horst''s district opposed to the
        5 percent tax). Names: Scranton. Check: the House''s count.'
      tags: ['name:scranton-william-w', 'state:pa']
      src:
        c: dd5b5504
        rows: ['w.novak-agony-of-the-g 168–69: all']
