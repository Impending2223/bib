patch: b3-novak-agony-3
by: 'Claude (batch 3, b3-1964, third run: Robert D. Novak, The Agony of the G.O.P. 1964, the cites held up and the book read against the calendar)'
ops:
# --- ch. I, pp. 1-6
- cite:
    id: cal.1964-07-17.republican-party
    item: '[[w.novak-agony-of-the-g]], 2 (the National Committee at the St. Francis to pick Goldwater''s choice, Burch;
      Burch to name Grenier, of Alabama, staff director)'
    units: A
- names:
    id: cal.1964-07-17.republican-party
    add: [Grenier]
    tags: ['name:grenier-john']
- cite:
    id: cal.1964-11-04.elections-1964
    item: '[[w.novak-agony-of-the-g]], 3 (Wednesday morning, the Peace Pipe Room of the Camelback Inn; the telegram to
      Johnson; "twenty-five million votes is a lot of votes"; the press "a rather sad, sorry mess")'
    units: A-B
- cite:
    id: cal.1964-11-03.elections-1964
    item: '[[w.novak-agony-of-the-g]], 5–6 (more than 61 percent for Johnson; forty-four of fifty States, 486 electoral
      votes to 52; Goldwater''s Alabama, Mississippi, Louisiana, South Carolina, Georgia and Arizona; forty House seats
      gained)'
    units: C-D
- add:
    entry:
      id: cal.1964-10-28.goldwater-2
      when: Oct. 28
      date: '1964-10-28'
      thread: goldwater
      also: [elections-1964]
      c: 'Goldwater''s supporters, a full-page advertisement in the *New York Times*: "Fighting Aces for Goldwater,"
        Rickenbacker''s name first, under the acceptance''s two sentences: "We were extremists."'
      n: '[[w.novak-agony-of-the-g]], 4. To check: the *New York Times*, Oct. 28, 1964. See [[cal.1964-07-15.elections-1964]].
        Names: Goldwater.'
      tags: ['name:goldwater-barry-m']
      src:
        c: dbea9fa8
        rows: ['w.novak-agony-of-the-g 4: all']
- add:
    entry:
      id: cal.1964-10-29.goldwater-2
      when: Oct. 29
      date: '1964-10-29'
      thread: goldwater
      also: [elections-1964]
      c: 'Pittsburgh, a rally the Thursday night before the election. Scranton, introducing Goldwater, says he has not
        always agreed with him; booed. He introduces him as "the Republican candidate for President of the United
        States."'
      n: '[[w.novak-agony-of-the-g]], 5. See [[cal.1964-10-29.goldwater]]. Names: Scranton, Goldwater.'
      tags: ['name:scranton-william-w', 'name:goldwater-barry-m', 'city:pittsburgh']
      src:
        c: 2ad43edb
        rows: ['w.novak-agony-of-the-g 5: all']
# --- ch. II, pp. 7-24
- cite:
    id: cal.1960-10-24.elections-1960-2
    item: '[[w.novak-agony-of-the-g]], 7 (the whistle-stop through Ohio, Michigan and Illinois, Oct. 26–28; Willard
      Edwards of the *Chicago Tribune*: the Hoover train of 1932)'
    units: A
- cite:
    id: cal.1960-11-03.elections-1960
    item: '[[w.novak-agony-of-the-g]], 12 & n.1 (the Statehouse rally; the Democrats'' news photograph of Nixon with
      Byrnes; Rogers on the plane)'
    units: A-B
- add:
    entry:
      id: cal.1960-10-22.elections-1960-2
      when: Oct. 22
      date: '1960-10-22'
      thread: elections-1960
      also: [republican-party]
      c: 'Rockefeller, flying from Dutchess County to New York City at the end of two weeks upstate, to his aides: Nixon
        losing the big industrial States chasing the South, "No matter how hard he tries, Nixon can''t win the South."
        He has tried to get Nixon to cancel Southern trips for the Northern cities and the Negro vote.'
      n: '[[w.novak-agony-of-the-g]], 9, 11–12 (Saturday night; two visits each upstate and to the city; Nixon''s
        swing of Nov. 1–2 too little, too late; the Columbia rally of Nov. 3 feared). Names: Rockefeller, Nixon.'
      tags: ['name:rockefeller-nelson', 'name:nixon-richard-m']
      src:
        c: b16d1ce7
        rows: ['w.novak-agony-of-the-g 9, 11–12: all']
- cite:
    id: cal.1960-10-15.elections-1960
    item: '[[w.novak-agony-of-the-g]], 13 (Nixon beside Goldwater for two speeches in Phoenix, Oct. 15)'
    units: 'A, C'
- add:
    entry:
      id: cal.1960-11-05.goldwater
      when: Nov. 5
      date: '1960-11-05'
      thread: goldwater
      also: [elections-1960]
      c: 'Phoenix, Saturday night. Goldwater, in private, on Nixon''s campaign: the move left lost the full conservative
        vote and the South; the Fifth Avenue civil rights plank, Lodge, and Lodge''s pledge of a Negro in the Cabinet.
        New York and the industrial States lost with Kennedy''s nomination and the Los Angeles platform.'
      n: '[[w.novak-agony-of-the-g]], 13–14 & n.2 (four days before the election, 14: a Nixon victory "more the product
        of an unseen and benevolent hand"). See [[cal.1960-10-15.elections-1960]]. Names: Goldwater, Nixon, Lodge.
        Check: the day; Novak, 13, gives Saturday night, Nov. 5, and, 14, "four days before the election."'
      tags: ['name:goldwater-barry-m', 'name:nixon-richard-m', 'name:lodge-henry-cabot']
      src:
        c: dd4a829d
        rows: ['w.novak-agony-of-the-g 13–14 & n.2: all']
- cite:
    id: cal.1960-07-22.elections-1960
    item: '[[w.novak-agony-of-the-g]], 22–23 (Nixon''s telephone call from Washington; dinner at the apartment; civil
      rights, medical care, national defense; the conservatives on "the sellout of Fifth Avenue")'
    units: A-B
- cite:
    id: cal.1960-07-26.elections-1960
    item: '[[w.novak-agony-of-the-g]], 23 (the platform accepted; ten Louisiana delegates for Goldwater, the nomination
      otherwise unanimous)'
    units: 'B, E'
- cite:
    id: cal.1960-07-28.elections-1960
    item: '[[w.novak-agony-of-the-g]], 23 (Lodge, Nixon''s choice)'
    units: A
- cite:
    id: cal.1960-09-10.conservative-movement
    item: '[[w.novak-agony-of-the-g]], 23 n.5 (Goldwater''s young supporters of Chicago reconvene at Sharon to form the
      YAF)'
    units: A-B
# --- ch. III, pp. 25-35
- cite:
    id: cal.1961-01-11.goldwater
    item: '[[w.novak-agony-of-the-g]], 25–32 (the "Goldwater Manifesto," published in the *Wall Street Journal*; Michael
      J. Bernstein, minority counsel of the Labor Committee, its originator and principal author; "The Forgotten
      American," 30–31)'
    units: B-C
- add:
    entry:
      id: cal.1961-01-15.goldwater
      when: Jan. 15
      date: '1961-01-15'
      thread: goldwater
      c: 'Goldwater on *Issues and Answers* (ABC), shortly after the *Wall Street Journal* prints his statement of
        principles. Asked by David Nichols whether he is changing his views: "I am not changing one bit." Man "works
        best when he has the least interference with his life from any central government."'
      n: '[[w.novak-agony-of-the-g]], 33 (the Federal Government to be explored "where principle will allow us to inject
        the Federal Government"; only a bill for a tax deduction for local school taxes followed, 33–34 & n.2). See
        [[cal.1961-01-11.goldwater]]. Names: Goldwater.'
      tags: ['name:goldwater-barry-m']
      src:
        c: d84e1089
        rows: ['w.novak-agony-of-the-g 33: all', 'via x.1961-01-15.issues-and-answers-goldwater: all']
# --- ch. IV, pp. 36-52
- cite:
    id: cal.1961-01.republican-party-congress
    item: '[[w.novak-agony-of-the-g]], 36–38 (the conference of Jan. 3 in the New Senate Office Building, Saltonstall
      presiding; Javits: Goldwater too rigidly conservative to distribute the campaign funds)'
    units: A
- check:
    id: cal.1961-01.republican-party-congress
    text: 'Check: Novak, 36–38, gives Jan. 3, Saltonstall adjourning the conference, and Javits dropping his opposition
      when it reconvened two days later, at Rockefeller''s telephoned request and on Goldwater''s pledge to stay out of
      States where he was not wanted.'
- add:
    entry:
      id: cal.1961-01-05.republican-party-congress
      when: Jan. 5
      date: '1961-01-05'
      thread: republican-party-congress
      also: [goldwater]
      c: 'The Senate Republican conference reconvenes. Goldwater gives the press his remarks to it: "In light of the
        1960 election results in New York, I think it is particularly inappropriate that a member of the Republican
        leadership of that state should seek to prescribe the pattern of political conduct of the party nationally."
        Javits drops his opposition on Goldwater''s pledge to stay out of States where he is not wanted or would hurt
        the party''s candidates; Goldwater re-elected chairman of the Senate campaign committee by the thirty-five
        Republican Senators, unanimously.'
      n: '[[w.novak-agony-of-the-g]], 37–38. See [[cal.1961-01.republican-party-congress]]. Names: Goldwater, Javits.
        Check: the day; Novak, 37, gives "two days later" than the conference of Jan. 3.'
      tags: ['name:goldwater-barry-m', 'name:javits-jacob-k']
      src:
        c: 15ad766b
        rows: ['w.novak-agony-of-the-g 37–38: all', 'via x.1961-01-05.goldwater-remarks-senate-republican-conference: B']
- add:
    entry:
      id: cal.1961-01.republican-party-congress-3
      when: Jan.
      date: '1961-01'
      thread: republican-party-congress
      also: [goldwater, elections-1964]
      c: 'Rockefeller, told of Javits''s move against Goldwater, telephones him in Washington: drop the opposition to
        Goldwater''s re-election as campaign chairman.'
      n: '[[w.novak-agony-of-the-g]], 38 & n.1 (Goldwater always believed Rockefeller tried to purge him). See
        [[cal.1961-01.republican-party-congress]]. Names: Rockefeller, Javits, Goldwater. Check: the day; Novak puts
        it between the conference of Jan. 3 and its reconvening.'
      tags: ['name:rockefeller-nelson', 'name:javits-jacob-k', 'name:goldwater-barry-m']
      src:
        c: 324c54d1
        rows: ['w.novak-agony-of-the-g 38 & n.1: all']
- add:
    entry:
      id: cal.1961-01-06.republican-party
      when: Jan. 6
      date: '1961-01-06'
      thread: republican-party
      also: [goldwater]
      c: 'Washington. The Republican National Committee in closed session, its first since the election. Goldwater,
        asked by Morton to keep from controversy, against Keating''s proposed national policy board: "We do not need a
        fancy advisory group such as the Democrats have." The Committee to be supreme in future campaigns, to heavy
        applause. Morton names Bliss, Ohio''s chairman, to head a committee on the big-city vote: "tell us what steps
        have to be taken everywhere to erode the monolithic Democratic big city vote." That night Nixon''s party for the Committee at the Columbia Country Club, Chevy Chase, Md.: three or
        four at a time stop to talk with him.'
      n: '[[w.novak-agony-of-the-g]], 38–39 & n.2 (the Keating proposal pigeonholed despite Morton''s support);
        [[w.novak-agony-of-the-g]], 49 (the date; the applause; the party); [[w.novak-agony-of-the-g]], 54 (Bliss''s
        committee, at "its first postelection meeting at Washington in January, 1961"). Names: Goldwater, Morton,
        Keating, Bliss, Nixon. Check: Novak, 38, puts the address
        "the next day" after the conference''s reconvening.'
      tags: ['name:goldwater-barry-m', 'name:morton-thruston-b', 'name:keating-kenneth-b', 'name:bliss-ray-c', 'name:nixon-richard-m']
      src:
        c: 570ad12d
        rows: ['w.novak-agony-of-the-g 38–39 & n.2: A-C', 'w.novak-agony-of-the-g 49: A-B, D, F', 'w.novak-agony-of-the-g 54: A-B, E']
- cite:
    id: cal.1960-06-08.elections-1960
    item: '[[w.novak-agony-of-the-g]], 42 (June 1960: the attack on the administration''s foreign and domestic policies;
      Nixon challenged on defense and civil rights)'
    units: A-C
- add:
    entry:
      id: cal.1960-06.republican-party
      when: June
      date: '1960-06'
      thread: republican-party
      also: [elections-1960]
      c: 'Washington, the Statler-Hilton. The Republican National Committee''s last meeting before the convention, after
        Rockefeller''s statement. Alcorn, Connecticut''s national committeeman, once national chairman, of Rockefeller:
        "But now he''ll never be the nominee. Never."'
      n: '[[w.novak-agony-of-the-g]], 42. See [[cal.1960-06-08.elections-1960]]. Names: Alcorn, Rockefeller. Check:
        the day.'
      tags: ['name:alcorn-h-meade', 'name:rockefeller-nelson']
      src:
        c: 8912b6df
        rows: ['w.novak-agony-of-the-g 42: all']
- cite:
    id: cal.1961-11-17.elections-1964
    item: '[[w.novak-agony-of-the-g]], 48 (the divorce; the party''s consensus: no great damage)'
    units: A
- add:
    entry:
      id: cal.1961-10.goldwater
      when: Oct., autumn
      date: '1961-10'
      thread: goldwater
      c: 'The congressional recess. Goldwater and his wife with thirteen others on a freighter from San Francisco to
        Liverpool by the Panama Canal; then two or three speeches, two weeks'' active duty as an Air Force brigadier
        general, and Phoenix for Christmas.'
      n: '[[w.novak-agony-of-the-g]], 46. Names: Goldwater. Check: the month; Novak gives "the months of the
        Congressional recess in autumn and early winter."'
      tags: ['name:goldwater-barry-m']
      src:
        c: fecbfd9d
        rows: ['w.novak-agony-of-the-g 46: all']
- add:
    entry:
      id: cal.1961-10.elections-1964
      when: Oct., fall
      date: '1961-10'
      thread: elections-1964
      also: [republican-party]
      c: 'Minneapolis. The Republicans'' fund-raising dinner, Rockefeller the speaker at Miller''s suggestion when
        Eisenhower, Nixon and the others asked could not come. Ticket sales beyond expectations.'
      n: '[[w.novak-agony-of-the-g]], 47–48. Names: Rockefeller, Miller. Check: the month; Novak gives "the fall of
        1961."'
      tags: ['name:rockefeller-nelson', 'name:miller-william-e', 'city:minneapolis']
      src:
        c: eea67dec
        rows: ['w.novak-agony-of-the-g 47–48: all']
- cite:
    id: cal.1961-09-27.elections-1962
    item: '[[w.novak-agony-of-the-g]], 51 (Nixon''s candidacy for governor; polls late in 1961 against Brown, "Nixon
      all the way")'
    units: C
- add:
    entry:
      id: cal.1961-10.republican-party
      when: Oct.
      date: '1961-10'
      thread: republican-party
      also: [elections-1962]
      c: 'Newark. Eisenhower, at a press conference: Nixon, a candidate for governor, no longer the party''s
        "titular leader."'
      n: '[[w.novak-agony-of-the-g]], 51–52. See [[cal.1961-09-27.elections-1962]]. Names: Eisenhower, Nixon. Check:
        the day.'
      tags: ['name:eisenhower-dwight-d', 'name:nixon-richard-m', 'city:newark']
      src:
        c: e5adfad3
        rows: ['w.novak-agony-of-the-g 51–52: all']
# --- ch. V, pp. 53-65
- add:
    entry:
      id: cal.1961-01.republican-party-2
      when: Jan.
      date: '1961-01'
      thread: republican-party
      also: [goldwater]
      c: 'Shadegg, Arizona''s Republican chairman and a writer of Goldwater''s speeches, tries to have Bliss replace Morton
        at once as national chairman.'
      n: '[[w.novak-agony-of-the-g]], 55 n.1. See [[cal.1961-01-06.republican-party]]. Names: Shadegg, Bliss, Morton.
        Check: the day.'
      tags: ['name:shadegg-stephen', 'name:bliss-ray-c', 'name:morton-thruston-b']
      src:
        c: c8e284de
        rows: ['w.novak-agony-of-the-g 55 n.1: all']
- add:
    entry:
      id: cal.1962-02-27.republican-party
      when: Feb. 27
      date: '1962-02-27'
      thread: republican-party
      also: [elections-1964]
      c: 'Morhouse, New York''s Republican chairman, to Rockefeller, a confidential memorandum, "Big City Politics,"
        copies to Hinman and Harry O''Donnell: the Bliss committee kept from issues. The national party to be dominated
        by the big-city States; a candidate the cities can agree with; someone "must break with the existing party
        structure."'
      n: '[[w.novak-agony-of-the-g]], 57–58 (his subcommittee''s report on polls, television and public relations cut
        by two-thirds; the Republicans in Congress blamed for opposing a Department of Urban Affairs). See
        [[cal.1962-01.republican-party]]. Names: Morhouse, Rockefeller, Hinman.'
      tags: ['name:morhouse-l-judson', 'name:rockefeller-nelson', 'name:hinman-george-l']
      src:
        c: 77d7c603
        rows: ['w.novak-agony-of-the-g 57–58: all', 'via x.1962-02-27.morhouse-to-rockefeller-big-city-politics: B-D']
- add:
    entry:
      id: cal.1962-03.republican-party
      when: Mar.
      date: '1962-03'
      thread: republican-party
      also: [elections-1964]
      c: 'Albany, N.Y., Morhouse''s hotel suite, a few weeks after his memorandum. To a reporter: the national
        committee''s seats by population, or the big-city States to boycott it for a council of their own; medical care
        for the aged, schools and automation the people''s concerns; "The Republican Party is the party that says ''no''
        before it hears the question." The *Wall Street Journal* prints the memorandum and his views; Rockefeller
        furious.'
      n: '[[w.novak-agony-of-the-g]], 58–60, 65 (Nixon''s opposition to medical care under Social Security the final
        factor in 1960, 59). See [[cal.1962-02-27.republican-party]]. Names: Morhouse, Rockefeller. Check: the day; the
        *Journal*''s issue.'
      tags: ['name:morhouse-l-judson', 'name:rockefeller-nelson', 'city:albany']
      src:
        c: ae5443af
        rows: ['w.novak-agony-of-the-g 58–60, 65: all', 'via x.1962-03.morhouse-wall-street-journal: B-C']
- src:
    id: cal.1961-01-11.goldwater
    rows: ['via x.1961-01.goldwater-statement-wall-street-journal: B-C']
# --- ch. VI, pp. 66-80
- cite:
    id: cal.1962-02.elections-1964
    item: '[[w.novak-agony-of-the-g]], 67–70 (the booing at the Mayflower, then laughter, the cheers for Goldwater the
      loudest; Rockefeller''s words on the Urban Affairs plan and Weaver, "What is this but political fakery?"; some
      three thousand at Des Moines''s biggest movie theater; his news conference on the farm program; Nagle and Erbe)'
    units: B-C
- cite:
    id: cal.1962-06-30.republican-party
    item: '[[w.novak-agony-of-the-g]], 74–75 (the last weekend of June 1962, Eisenhower''s farm; a National Republican
      Citizens Committee, its headquarters in Washington)'
    units: A-B
- add:
    entry:
      id: cal.1962-07-02.republican-party
      when: July 2
      date: '1962-07-02'
      thread: republican-party
      also: [goldwater]
      c: 'Goldwater to Miller, the national chairman, by letter, against the Citizens Committee of the Gettysburg
        conference: "We already have a National Committee. Where is there unity in two groups working in the same
        field?" The confusion and distrust "which cost us the Presidency in 1960."'
      n: '[[w.novak-agony-of-the-g]], 75. See [[cal.1962-06-30.republican-party]]. Names: Goldwater, Miller.'
      tags: ['name:goldwater-barry-m', 'name:miller-william-e']
      src:
        c: e2526951
        rows: ['w.novak-agony-of-the-g 75: all', 'via x.1962-07-02.goldwater-to-miller: all']
- add:
    entry:
      id: cal.1962-07.goldwater-3
      when: July
      date: '1962-07'
      thread: goldwater
      also: [republican-party, elections-1964]
      c: 'Goldwater by long-distance telephone with Rockefeller and with Hinman on the Citizens Committee: their suspicion
        of Walter Thayer of the *Herald Tribune*, Nixon''s friend, and of David Kendall of Michigan, once Eisenhower''s
        aide; a holding operation for Nixon, or a front for Romney.'
      n: '[[w.novak-agony-of-the-g]], 75 (Goldwater for Rockefeller over Nixon and Romney that summer). See
        [[cal.1962-07-02.republican-party]]. Names: Goldwater, Rockefeller, Hinman, Kendall, Nixon, Romney. Check: the
        day.'
      tags: ['name:goldwater-barry-m', 'name:rockefeller-nelson', 'name:hinman-george-l', 'name:kendall-david-w',
        'name:nixon-richard-m', 'name:romney-george-w']
      src:
        c: 4715700e
        rows: ['w.novak-agony-of-the-g 75: all']
- cite:
    id: cal.1962-08-14.republican-party-2
    item: '[[w.novak-agony-of-the-g]], 71–72 (a secret memorandum to the county chairmen and vice-chairmen, twenty-eight
      "items"; a county chairman gives it to Jaquith of the Conservative Party, who releases it; Rockefeller denies
      knowing of it)'
    units: A-B
- check:
    id: cal.1962-08-14.republican-party-2
    text: 'Check: Novak, 72, quotes "lose some other votes," and has Jaquith, the Conservative Party''s chairman, release
      the memorandum to the press in 1962 (made public then, not first by White).'
- src:
    id: cal.1962-08-14.republican-party-2
    rows: ['via x.1962-08-14.morhouse-to-county-chairmen: A-B']
- add:
    entry:
      id: cal.1962-09.goldwater-3
      when: Sept.
      date: '1962-09'
      thread: goldwater
      also: [elections-1964]
      c: 'Goldwater to a reporter: the banquet circuit no more, nine speeches outside Arizona in the campaign of 1962,
        some ten out of State in 1963, against 200 to 250 a year before. "I believe I deserve a letup." The convention
        "more conservative than it was the last time."'
      n: '[[w.novak-agony-of-the-g]], 76–77 (the Senate race of 1964 and Arizona his reasons; Ohio the only one of the Big
        Six he might carry; his delegates of the South and Southwest as leverage on the platform and the ticket); [[w.novak-agony-of-the-g]], 78
        n.3 (Goldwater satisfied that September that Arizona''s constitution lets one man run for two offices). Names:
        Goldwater. Check: the day; the paper.'
      tags: ['name:goldwater-barry-m']
      src:
        c: ca96b66a
        rows: ['w.novak-agony-of-the-g 76–77: all', 'w.novak-agony-of-the-g 78 n.3: A', 'via x.1962-09.goldwater-interview-speaking-cutback: all']
- cite:
    id: cal.1962-10.goldwater-3
    item: '[[w.novak-agony-of-the-g]], 79 (the calls to Tony Smith, Goldwater''s press secretary, from Hugh Morrow and
      Robert McManus; Smith: "fishy")'
    units: B-D
# --- ch. VII, pp. 81-98
- cite:
    id: cal.1962-09-17.governors-ny
    item: '[[w.novak-agony-of-the-g]], 81–82 (Morgenthau nominated in September; Harris''s survey for the party: a
      Democrat in Lehman''s mold; Wagner a major force for him)'
    units: B
- add:
    entry:
      id: cal.1962-11-05.governors-ny
      when: Nov. 5
      date: '1962-11-05'
      thread: governors
      also: [elections-1962]
      c: 'Election eve. Bachelder, Rockefeller''s pollster, has him a million votes ahead of Morgenthau; Morhouse, the
        State chairman, predicts a million-vote victory in a statement.'
      n: '[[w.novak-agony-of-the-g]], 84 (the aides'' own forecast, 350,000 to 700,000; their dread of a margin under
        1958''s 570,000, 83). See [[cal.1962-09-17.governors-ny]]. Names: Morhouse, Rockefeller,
        Morgenthau.'
      tags: ['name:morhouse-l-judson', 'name:rockefeller-nelson', 'name:morgenthau-robert-m', 'state:ny']
      src:
        c: 5f0b1af7
        rows: ['w.novak-agony-of-the-g 84: all']
- cite:
    id: cal.1962-11-06.governors-ny
    item: '[[w.novak-agony-of-the-g]], 84 & n.2 (Rockefeller by 529,000 of 5,750,000 cast, some 40,000 under 1958; Javits
      by a million)'
