        relations and Romney''s adviser, its public relations; under Hinman, Lindemer, once Michigan''s chairman,
        Midwestern coordinator, and Mort Frayne, once Washington''s, Pacific Coast coordinator. The campaign geared to
        beating Goldwater in the primaries.'
