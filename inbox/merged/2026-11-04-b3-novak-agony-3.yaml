    item: '[[w.novak-agony-of-the-g]], 176–79 & nn.1–2 (San Francisco chosen for the convention over Chicago; Hinman''s
      press conference in his suite that Saturday morning, "the race is wide open"; the omnibus resolution''s only word
      on civil rights; Allott''s address; Truax; Young to Stagg at the Colorado committee''s party)'
    units: A-D
- check:
    id: cal.1963-06-22.republican-party
    text: 'Check: Novak, 177, has Hinman''s "insanity in the air" to a reporter the night before.'
- cite:
    id: cal.1963-06.republican-party
    item: '[[w.novak-agony-of-the-g]], 177 (two Southern chairmen on "niggers" at a closed luncheon of the State
      chairmen; Yerger''s charge, made at a press conference)'
    units: A-C
- cite:
    id: cal.1963-06-24.republican-party
    item: '[[w.novak-agony-of-the-g]], 195 n.13 (the column, "The White Man''s Party?"; Javits''s protest on the Senate
