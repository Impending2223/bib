- add:
    entry:
      id: cal.1963-05-02.press-and-broadcasting
      when: May 2
      date: '1963-05-02'
      thread: press-and-broadcasting
      also: [elections-1964]
      c: 'The *New York Times*, front page, Tom Wicker from Washington: by "informed Republican sources," Romney
        "cooperating with the plans of some close associates of former President Eisenhower and Richard M. Nixon," Hall
        and Folger among them; Eisenhower "has privately expressed great interest in Gov. Romney''s candidacy."'
      n: '[[w.novak-agony-of-the-g]], 156–57 & n.1 (the story, peddled by party leaders in late April, that Eisenhower had
        chosen Romney). Names: Wicker, Romney, Eisenhower, Hall, Folger.'
      tags: ['name:wicker-tom', 'name:romney-george-w', 'name:eisenhower-dwight-d', 'name:hall-leonard-w',
        'name:folger-john-c']
      src:
        c: 4c0aab57
        rows: ['w.novak-agony-of-the-g 156–57 & n.1: all', 'via x.1963-05-02.wicker-new-york-times-romney: all']
- cite:
    id: cal.1963-05-02.republican-party
    item: '[[w.novak-agony-of-the-g]], 160 (the Marriotts'' party, some three hundred Republican businessmen, Hall and
      Folger helping plan it; the press conference: "I am not a candidate for President, and I am not going to become
      one")'
    units: A-C
- cite:
    id: cal.1963-05-02.goldwater
    item: '[[w.novak-agony-of-the-g]], 164–65 (Romney asks the appointment by telephone; reporters waiting on the
      fourth floor of the Old Senate Office Building, which Goldwater lays to Romney)'
    units: A-B
- check:
    id: cal.1963-05-02.goldwater
    text: 'Check: Novak, 165, has Romney lecture Goldwater on citizens'' participation in politics.'
- cite:
    id: cal.1963-05-03.elections-1964
    item: '[[w.novak-agony-of-the-g]], 162–63 ("George—Come Home"; Hayden, its editor, believed its author or
      inspirer; little heard of Romney outside Michigan after May 9)'
    units: 'A-B'
