      c: 'Washington, Rockefeller''s house on Foxhall Road. Unpublicized breakfasts of Goldwater and Rockefeller, through
        the winter and early spring, Hinman and Victor Johnston, staff director of the Senate campaign committee, the
        others. Party unity; the effort through the national and State committees, not the Citizens Committee, which
        both suspect a front for Romney.'
      n: '[[w.novak-agony-of-the-g]], 103–104 & n.3 (Hinman and Johnston also meeting alone). Names: Goldwater,
        Rockefeller, Hinman. Check: the days; Novak gives "a series ... during the winter and early spring of 1963."'
