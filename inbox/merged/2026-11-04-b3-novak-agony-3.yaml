- cite:
    id: cal.1963-04-03.opinion-2
    item: '[[w.novak-agony-of-the-g]], 174 & nn.11–12 (an April postcard poll, 1,045 of 2,662 replying; likeliest,
      Rockefeller 64.4 percent, Goldwater 26.4; preferred, Goldwater 46, Rockefeller 34.5; published in the *Washington
      Post* of May 5)'
    units: A-B
# --- ch. XII, pp. 176-201
- cite:
