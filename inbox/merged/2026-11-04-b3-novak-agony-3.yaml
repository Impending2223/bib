      date: '1964-04-09'
      thread: elections-1964
      c: 'Harrisburg, Pa., Thursday. Scranton, back from Hobe Sound and angry at Truax''s million write-in stickers for
        the State''s primary, calls the Washington correspondents meaning to rule himself out even of a draft; the
        *Philadelphia Inquirer* reports it Wednesday; his aides talk him down that night. He reaffirms his noncandidacy,
        and asks his friends to stop working for him. The *Washington Post*, Apr. 10: "SCRANTON ALL BUT QUITS RACE."'
      n: '[[w.novak-agony-of-the-g]], 340–42 & n.12 (Truax: "The forthrightness marking the Governor''s statement").
