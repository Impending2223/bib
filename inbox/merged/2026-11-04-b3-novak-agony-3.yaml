      thread: republican-party
      also: [elections-1964]
      c: 'Lansing, Mich. Romney to a news conference, the day after the constitution''s ratification: "My concern is
        Michigan. ... The talk of national office comes from others, not me."'
      n: '[[w.novak-agony-of-the-g]], 159 n.4. See [[cal.1963-04-01.state-constitutions-mi]]. Names: Romney.'
