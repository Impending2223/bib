      c: 'Washington, the eve of the national committee''s meeting. Yerger and a few other Southern chairmen in secret
        session: Miller to be replaced by Bliss as a full-time, paid national chairman. Bliss will have no part of it;
        Hinman puts the Rockefeller camp behind Miller.'
