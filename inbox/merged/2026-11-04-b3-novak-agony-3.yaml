    set:
      n: "[[w.white-suite-3505]], 37–42 (the Avenue Motel, South Michigan Avenue, Oct. 8, 2 p.m.; twenty-two of twenty-six invited, from sixteen States; who they were, 38–40); [[w.white-making-of-the-president-1965]], 92 (twenty-two, the Avenue Motel, South Michigan Avenue; an ad hoc committee to take the party for the conservative cause; White to report to Goldwater); [[w.goldberg-barry-goldwater]], 162 (Oct. 8, a South Michigan Avenue motel; twenty-two of twenty-six invited; two Congressmen, three State chairmen, several rich businessmen; the party's machinery from the precincts up; a South a quarter of the convention; 301 electoral votes without the Northeast; too early to tie the effort to Goldwater); [[w.bernstein-guns-or-butter]], 124–25 (22 conservatives from 16 states at the Avenue Motel; White authorized to inform Goldwater). Made public: [[w.white-making-of-the-president-1965]], at the latest. Check. [[w.perlstein-before-the-storm]], 177–80 (the meeting, 177–79; the strategy, at the next meeting, in December, 179–80); [[w.young-two-suns-of-the]], 57 (the meeting at Chicago; Goldwater their man). [[w.gifford-center-cannot-hold]], 166, 200 (October 1961, Chicago, twenty-two men; who they were). To check: [[w.rusher-rise-of-the-right]], 101 (cited by [[w.gifford-center-cannot-hold]], 166 n.92, 200 n.6); [[w.middendorf-glorious-disaster]]. Names: White, Goldwater, Rusher, Ashbrook. Check: Perlstein, 178, gives twenty-six invited and twenty-two present; Goldwater's name not spoken, 179. Check: Young, 57, gives Oct. 3, 1961, and twenty-two present, \"mainly business figures and a smattering of politicians.\" Check: White, 40, has the group put off naming a candidate, his advice, and send him to tell Goldwater of its plans."
