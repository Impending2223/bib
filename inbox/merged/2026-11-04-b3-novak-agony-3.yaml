      c: 'Yerger, Mississippi''s chairman and chairman of the Southern Republican chairmen, calls them to Dallas shortly
        after the election, the South the key to national victory. Miller, the national chairman, forbids a separate
        meeting: all regional groups of chairmen to meet in Washington with the national committee the first weekend of
        December.'
