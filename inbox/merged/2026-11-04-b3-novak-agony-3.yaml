      when: Apr. 4
      date: '1963-04-04'
      thread: republican-party
      also: [elections-1964]
      c: 'Chicago. Romney to the National Association of Broadcasters: against Minow, chairman of the FCC. "There appears
        to be absent from the thinking of those who are responsible for direction of governmental power in this country
        the principle of competition."'
      n: '[[w.novak-agony-of-the-g]], 159–60. Names: Romney, Minow.'
      tags: ['name:romney-george-w', 'name:minow-newton-n', 'city:chicago']
