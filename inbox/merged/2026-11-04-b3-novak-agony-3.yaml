      when: May
      date: '1963-05'
      thread: elections-1964
      also: [republican-party]
      c: 'Party leaders on the remarriage. Elliott, Michigan''s chairman: "I don''t think this marriage changes his
        political picture at all." Todd, New Jersey''s: "If this gal is all they say she is, she may help him." Tool,
        Colorado''s: people "will get used to the idea in a few months." Pierce, Walter, Mrs. Koeze, Broyhill the same.
        O''Donnell of the draft committee predicts his downfall.'
      n: '[[w.novak-agony-of-the-g]], 143. See [[cal.1963-05-04.elections-1964]]. Names: O''Donnell. Check: the days.'
      tags: ['name:odonnell-peter', 'name:rockefeller-nelson']
      src:
        c: d1dadae2
        rows: ['w.novak-agony-of-the-g 143: all']
- cite:
    id: cal.1963-05.elections-1964-2
    item: '[[w.novak-agony-of-the-g]], 145 n.3 (Bush''s public attack; his fight against Rockefeller''s platform
      proposals in 1960)'
    units: A
- cite:
    id: cal.1963-05-09.goldwater
    item: '[[w.novak-agony-of-the-g]], 145–46 (May 9, the Sheraton-Park, a thousand-dollar testimonial; Rockefeller, to
      have spoken, cables regrets "from Mrs. Rockefeller and me"; Morton, toastmaster, reads it; horselaughs)'
    units: 'A-B, D'
- add:
    entry:
      id: cal.1963-05-24.elections-1964-2
      when: May 24
      date: '1963-05-24'
      thread: elections-1964
      c: 'White Plains, N.Y. The Hudson River Presbytery admonishes the Reverend Marshall L. Smith of the Union Church of
        Pocantico Hills, who married the Rockefellers, "a disturber of the peace and unity of the church"; Smith
        confesses his "deep regret" for breaking the year''s wait the church requires.'
      n: '[[w.novak-agony-of-the-g]], 146–47. See [[cal.1963-05-04.elections-1964]]. Names: Rockefeller.'
      tags: ['name:rockefeller-nelson']
      src:
        c: 7d182208
        rows: ['w.novak-agony-of-the-g 146–47: all']
- add:
    entry:
      id: cal.1963-05-26.elections-1964
      when: May 26
      date: '1963-05-26'
      thread: elections-1964
      c: 'The *New York Times*, Warren Weaver''s dispatch from Washington: New York''s Republicans in Congress have had
        few more than 1,000 letters on the remarriage in three weeks, critical but for less than 1 percent, almost all
        from women. "If Congressional mail accurately mirrors public sentiment, Governor Rockefeller''s remarriage
        appears to have been a political disaster."'
      n: '[[w.novak-agony-of-the-g]], 147. See [[cal.1963-05-04.elections-1964]]. Names: Rockefeller.'
      tags: ['name:rockefeller-nelson']
      src:
        c: 0356146a
        rows: ['w.novak-agony-of-the-g 147: all', 'via x.1963-05-26.weaver-new-york-times-remarriage-mail: all']
# --- ch. XI, pp. 153-175
- add:
    entry:
