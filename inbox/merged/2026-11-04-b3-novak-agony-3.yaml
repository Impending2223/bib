      when: May 9
      date: '1963-05-09'
      thread: republican-party
      also: [elections-1964]
      c: 'Washington, Goldwater''s testimonial dinner, before it is served. Allott, Love and Dominick of Colorado at
        their table. Allott to a reporter: "we''ve just about decided I''m going to run." For President: "Isn''t
        everybody?"'
      n: '[[w.novak-agony-of-the-g]], 153 (favorite sons talked of that spring: Rhodes or Robert Taft Jr. in Ohio, Case,
        Saltonstall, Margaret Chase Smith, 153–54). See [[cal.1963-05-09.goldwater]]. Names: Allott, Love, Dominick.'
      tags: ['name:allott-gordon-l', 'name:love-john-a', 'name:dominick-peter-h']
      src:
        c: 2bd46138
        rows: ['w.novak-agony-of-the-g 153: all']
- add:
    entry:
      id: cal.1963-05-09.elections-1964-2
      when: May 9
      date: '1963-05-09'
      thread: elections-1964
      also: [goldwater]
      c: 'The Sheraton-Park, Goldwater''s dinner. Romney, arriving, brushes off photographers who would pose him with
        Goldwater; later consents. His speech short and partisan. Folger, Nixon''s fund raiser, neither takes the
        thousand-dollar tickets Goldwater''s staff counted on nor comes.'
      n: '[[w.novak-agony-of-the-g]], 160–61, 165–66 (Goldwater''s suspicion of an "Eastern" plot for Romney). See
        [[cal.1963-05-09.goldwater]]. Names: Romney, Goldwater, Folger.'
      tags: ['name:romney-george-w', 'name:goldwater-barry-m', 'name:folger-john-c']
      src:
        c: 0e235cf8
        rows: ['w.novak-agony-of-the-g 160–61, 165–66: all']
- cite:
