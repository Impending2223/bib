- cite:
    id: cal.1966-03-30.china-leadership
    item: '[[w.jianguo-yilai-mao-zedong]], XVIII, 237 (Mar. 30, 1966; the Wengao prints from a Central Committee document the extract of Mao''s talk with Kang Sheng, Zhao Yimin and others at Shanghai on academic criticism: articles of criticism need not be sent up for approval; "you are the King of Hell''s palace and the little devils do not come to the door; overthrow the King of Hell and free the little devils"; he has always held that when the Center is wrong the localities should attack it; the September work conference said so; if revisionism arises in the Center, the localities should rebel)'
