      c: 'Mao to Peng Zhen 彭真, on the Central Party School committee''s report on Yang Xianzhen''s 杨献珍 case: all read; the report''s last page (16) lists four attachments, two (Hou Weiyu''s 侯维煜 and Sun Dingguo''s 孙定国) to be struck, leaving two, and Yang''s own statement is missing and should be added. The report, of Mar. 1 with a covering report of June 9, would remove Yang as vice-president of the school; the Center issued it to the whole Party as Zhongfa 中发 [65] 592.'
