- add:
    entry:
      id: cal.1965-08-05.china-leadership-3
      when: Aug. 5
      date: '1965-08-05'
      thread: china-leadership
      c: 'Mao to Kang Sheng 康生: Zhang Shizhao''s 章士钊 *Liu wen zhiyao* 《柳文指要》, upper and lower parts, twenty-two volumes, a million words, may be read at leisure; it has fresh meanings. It praises Liu Zongyuan 柳宗元 and slights Han Yu 韩愈, reverses the verdict on the Two Wangs and the Eight Sima 八司马, rejects the Tongcheng 桐城 school and honors the Yanghu 阳湖, and attacks the eight-legged essay: all sound. But the author does not grasp historical materialism and reads Liu by the author''s own view; historians may one day criticize the book on that ground, which would be good. Mao has told Zhang to be ready and does not ask a man of eighty-five to change his worldview.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 117–118 (Aug. 5, 1965; Mao''s letter; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). Names: Mao Zedong, Kang Sheng, Zhang Shizhao.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:kang-sheng
      - vis:only:prc
      src:
        c: edf71fc5
        rows:
