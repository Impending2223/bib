    item: '[[w.jianguo-yilai-mao-zedong]], XVIII, 225–228 (Mar. 12, 1966; Mao''s letter to Liu Shaoqi of Mar. 12 on Liu''s letter of Mar. 11: the planning small group''s sending men to Hubei is right, and every Center bureau and province should send people for seven to ten days, draft five-, seven- and ten-year plans, to be discussed at a work conference around Aug.–Sept.; mainly local self-reliance; tie it to war readiness, famine readiness and the people; Soviet farm policy has drained the peasants; note 1: on the typed copy Mao wrote "not sent; not to be sent, to await discussion"; the Center restated its main content Apr. 10; *Renmin ribao* printed the letter Dec. 26, 1977)'
