      when: Feb. 13
      date: '1965-02-13'
      thread: china-leadership
      c: 'Mao approves the Central Committee''s draft notice on handling the relations of group leaders 班组长 and workers in industrial and transport enterprises 关于正确地处理工业、交通企业中班组长同工人群众关系问题的通知: "Agreed, issue." He adds a passage: in this movement boldly mobilize the masses, develop criticism and self-criticism, unite the great majority of cadres, workshop and factory level and above, and deal only with the very few who stubbornly take the capitalist road. The Center issues the notice Feb. 16.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 10–11 (Feb. 13, 1965; Mao''s note and his insertion; printed from the manuscript and his revised copy). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Central Committee, notice on correctly handling the relations between group leaders and the worker masses in industrial and transport enterprises, issued Feb. 16, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 10 n.1). Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
