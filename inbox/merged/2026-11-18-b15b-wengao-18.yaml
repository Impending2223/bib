      c: 'Mao to Deng Yingchao 邓颖超 ("Elder sister Deng"): since she "pressed" him to write poems he had no choice and, two nights without sleep, wrote two poems 词, revised several times and still unsettled; he sends them for her to alter freely if unsuitable. Deng Yingchao, in a later note, writes that she had asked him that summer, receiving women guests with him, whether he had new poems.'
