      c: 'Mao, on Xie Fuzhi''s 谢富治 draft for the Central Committee''s notice forwarding the 14th Public Security Conference''s two papers, returns it with changes. He adds to the Ministry''s report that prisoners reformed and of special use to production may have sentences cut, be released early or have the cap removed, and be paid as engineers; and to Xie''s speech, on war preparation, a line of Mao''s that great disorder under heaven is not necessarily bad: war has great benefits, the Party won twenty-five years of it.'
