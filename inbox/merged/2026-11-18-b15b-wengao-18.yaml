- add:
    entry:
      id: cal.1965-09-15.china-leadership-5
      when: Sept. 15
      date: '1965-09-15'
      time: 1965-09-14T19:00Z
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Mao, at 3 a.m., to Kang Sheng 康生, for Hu Qiaomu 胡乔木: the cuts and revisions are good and the poems may be fixed. He has altered a few more characters in places; other lines should be thought over again, and if not suitable the original stands. The line on the "south needle" must change. Some places are obscure, middle-school pupils cannot read them; the Tang, Five Dynasties, Northern Song and some Southern Song ci are mostly easy; new words should be made; words such as "heaven" and "party" not to be used often. He marks "changed well" and "good line" beside several passages.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 141–145 (Sept. 15, 1965; Mao''s notes of Sept. 15, 3 a.m.; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). See [[cal.1965-09-15.china-leadership]]. Names: Mao Zedong, Kang Sheng, Hu Qiaomu.'
