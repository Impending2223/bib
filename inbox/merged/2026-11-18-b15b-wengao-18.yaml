      date: '1966-02-23'
      thread: china-leadership
      c: 'Mao, on Zhou Enlai''s 周恩来 letter of Feb. 17 sending Yu Qiuli''s 余秋里 outline of his report after inspecting third-front construction in the southwest and northwest: read, back to Premier Zhou. Zhou writes that steel capacity in those regions for 1970 is being aimed at 4.3 to 5.5 million tons, the second line at 6.5 to 7 million, the first line at 11.4 million.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 219–220 (Feb. 23, 1966; Mao''s note; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). See [[cal.1966-02-17.china-leadership-2]]. To check: Zhou Enlai, letter to Mao Zedong of Feb. 17, 1966 sending Yu Qiuli''s outline (with papers on steel capacity and output in 1968 and later years) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 219 n.1); Yu Qiuli, outline of the report on his inspection of third-front construction in the southwest and northwest (left Peking late Nov. 1965), Feb. 6, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 220 n.2). Names: Mao Zedong, Zhou Enlai, Yu Qiuli.'
