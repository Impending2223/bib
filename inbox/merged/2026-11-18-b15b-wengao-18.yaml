      c: Mao, at Shanghai 上海, summons by notes those to attend the enlarged meeting of the Politburo Standing Committee to open Dec. 8. Qu Qiyu 曲琦玉 is to telephone Ye Jianying 叶剑英, Xiao Hua 萧华, Yang Chengwu 杨成武 (at Hangzhou 杭州) and Xie Fuzhi 谢富治 to come that afternoon. Deng Xiaoping 邓小平, Li Fuchun 李富春 and Bo Yibo 薄一波 to come that day or the next (in Sichuan 四川, relayed from Chengdu 成都). Song Renqiong 宋任穷, Chen Xilian 陈锡联, Li Xuefeng 李雪峰, Yang Yong 杨勇, Liao Hansheng 廖汉生 and Yang Dezhi 杨得志 on one aircraft the morning of the 8th; He Long 贺龙, Dong Biwu 董必武, Wang Shangrong 王尚荣, Li Tianyou 李天佑, Zhang Aiping 张爱萍, Lei Yingfu 雷英夫, Xu Xiangqian 徐向前, Liu Bocheng 刘伯承 (not if ill) and Zhu De 朱德 the same morning; Xu Shiyou 许世友, Han Xianchu 韩先楚, Chen Yi 陈毅, Tao Zhu 陶铸, Wang Renzhong 王任重, Li Jingquan 李井泉 and Liu Lantao 刘澜涛 to Shanghai on the 8th.
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 178–181 (Dec. 7, 1965; Mao''s five notes of Dec. 7; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). Names: Mao Zedong, Ye Jianying, Xie Fuzhi, Deng Xiaoping, Li Fuchun, Bo Yibo, Song Renqiong, Li Xuefeng, Yang Yong, Yang Dezhi, He Long, Dong Biwu, Zhang Aiping, Xu Xiangqian, Liu Bocheng, Chen Xilian, Xu Shiyou, Zhu De, Chen Yi, Tao Zhu, Li Jingquan. Check: the numbers of those in the planes, which Mao corrects by hand (seven for six; eight for nine); the names read from the page image only for Qu Qiyu and the first group.'
