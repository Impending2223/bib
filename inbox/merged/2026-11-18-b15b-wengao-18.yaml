- cite:
    id: cal.1966-03-17.china-leadership-2
    item: '[[w.jianguo-yilai-mao-zedong]], XVIII, 229–236 (Mar. 17, 1966; Mao''s note of Mar. 17, "read twice, written well enough; I changed it a little": it should go out in the Military Commission''s name to some Center leaders for comment, the Commission''s members first; the title changed to "Summary of the forum on army literary and artistic work that Comrade Lin Biao entrusted to Comrade Jiang Qing"; the claim that the four works are "enough for the proletariat for several hundred years" made "for a long time"; the black line to take decades, even centuries, to be fought; the slogan "literature of national defense" of the late 1930s a bourgeois one, Lu Xun''s "mass literature of the national revolutionary war" the proletarian; the Wengao prints his revisions by number, 1 to 18, in the notes'' order)'
    units: A, B, C, E, F
