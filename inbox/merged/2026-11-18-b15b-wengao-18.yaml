      c: 'Mao to Xie Fuzhi 谢富治, minister of public security, on his letter sending the record of his speech to the 14th National Public Security Conference 第十四次全国公安会议: he has read both papers, do accordingly; any good opinions from the conference may be taken in. The papers are Xie''s speech record of June 11, which Xie sent June 28 saying Wang Dongxing 汪东兴 twice conveyed Mao''s instructions to the conference, and a Central Committee Air Defense Committee office paper on mass digging of air-raid shelters in Nanning 南宁, Gejiu 个旧 and Zhanjiang 湛江.'
