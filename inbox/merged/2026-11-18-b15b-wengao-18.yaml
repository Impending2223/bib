      c: 'Mao telegraphs Władysław Gomułka 哥穆尔卡, first secretary of the Polish United Workers'' Party, on his 60th birthday: his long work tied to the Polish revolution and construction; the party''s friendship and unity with the Chinese party and people to grow on Marxism-Leninism and proletarian internationalism.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 7 (Feb. 4, 1965; printed from the typeset copy in the Central Archives). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). Names: Mao Zedong, Gomułka. Check: whether *Renmin ribao* printed it.'
