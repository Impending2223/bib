      when: Aug. 17
      date: '1965-08-17'
      thread: china-leadership
      c: 'Mao to Liu Shaoqi 刘少奇 and Zhou, to go back to Luo Ruiqing 罗瑞卿: the Military Commission to discuss (1) whether the Military Engineering Academy 军事工程学院''s report on its students'' share in the rural socialist education movement can go to the whole army for reference; (2) all officers from platoon leader up, except the old and gravely ill, to join the local movement, in phases within two years, four half-year periods, the whole army done. Even Guo Huaruo 郭化若, a sick man, went to Zhejiang 浙江 for a round and gained much; his report of ten lessons is sent for forwarding to the older comrades. Tell Lin Biao 林彪 by telephone.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 127–129 (Aug. 17, 1965; Mao''s note; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Luo Ruiqing, forwarding to Mao Zedong the report of the Military Engineering Academy''s political department of July 22, 1965, Aug. 13, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 127 n.1a); Political Department of the PLA Military Engineering Academy, to Luo Ruiqing, the General Political Department, the National Defense Science Commission and the Heilongjiang Party committee, report on the students'' share in the rural socialist education movement (1,072 students and cadres, Acheng county, Harbin area, late Nov. 1964 to end of June 1965), July 22, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 127 n.1b); Guo Huaruo, report to Mao Zedong on five months in the socialist education movement at the Liming brigade, Jingjiang commune, Xiaoshan county, Zhejiang, with ten lessons, July 31, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 128 n.4). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Luo Ruiqing, Lin Biao, Guo Huaruo.'
