      c: 'Mao to Zhou, on the report "On the power problem of third-front construction" 关于三线建设的动力问题 from Zhao Erlu 赵尔陆: read twice, very important; to go to the small planning commission 小计委, the ministries, the Central bureaus and provincial Party committees, to sum up past experience right and wrong.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 8–9 (Feb. 13, 1965; Mao''s note; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). See [[cal.1965-02-01.china-leadership]]. To check: Zhao Erlu, letter to Zhou Enlai sending the report "On the power problem of third-front construction" (small and scattered hydro and thermal stations; the first of four topic papers on third-front siting, plants, power, design and construction), Jan. 31, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 8 n.1). Names: Mao Zedong, Zhou Enlai, Zhao Erlu, Chen Boda.'
      tags:
