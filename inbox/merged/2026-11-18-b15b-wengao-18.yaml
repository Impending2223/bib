      c: 'Mao rereads his *Changgang xiang diaocha* 《长冈乡调查》 of Nov. 1933 and adds notes (signed 1965): the left Center ordered the handicraftsmen of villages and small towns to lead the peasants, which neither side understood, and the joke lasted until 1937, when the line changed; and on the Center''s leaders then, who understood little of Marxism: errors are unavoidable, error often leads to the right, and blind necessity is the ancestor of freedom.'
