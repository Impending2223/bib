      when: Sept. 5
      date: '1965-09-05'
      thread: china-leadership
      c: 'Mao to Kang Sheng 康生, for Hu Qiaomu 胡乔木: the twenty-seven poems 词 he has read many times and they are very good; he favors "this copy you revised" (the editors: the draft as Kang Sheng revised it) and has changed only a few characters. Print first in *Hongqi* 红旗, then reprint in *Renmin ribao* 人民日报, Kang to arrange with Chen Boda 陈伯达 and Wu Lengxi 吴冷西. In the margins he changes a line in the New Year 1965 poem ("If one dies, a fox is sad" to "If one dies, a fox is hurt"), and marks passages he likes.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 141–145 (Sept. 5, 1965; Mao''s notes of Sept. 5; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Hu Qiaomu, draft of twenty-seven poems (ci), 1965, revised by Kang Sheng and by Mao Zedong (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 142 n.1a); Hu Qiaomu, letter to Kang Sheng of Sept. 10, 1965 sending the poems (deleting four Dingfengbo and the last two Shengzhazi; five regulated verses added) for Mao (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 142 n.1b). Names: Mao Zedong, Kang Sheng, Chen Boda, Hu Qiaomu, Wu Lengxi. Check: the line Mao changed (the note gives it as 兔死狐伤 for 兔死狐悲); the other changes are in notes 4 and 7–13 of the Wengao.'
      tags:
