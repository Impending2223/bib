      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 20–21 (Feb. 28, 1965; Mao''s note; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Bo Yibo, letter to Mao Zedong sending Liu Bin''s report on the Anshan works, Feb. 26, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 20 n.1); Liu Bin, vice-minister of the Metallurgy Ministry stationed at Anshan, report to Bo Yibo on the state of the Anshan works (five demands for 1965: the socialist education movement in about three years; a new upsurge in quality and productivity; two construction tasks; study of Mao''s works; political work), Feb. 23, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 20 n.2). Names: Mao Zedong, Bo Yibo, Wang Heshou, Liu Bin.'
