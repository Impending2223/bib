- add:
    entry:
      id: cal.1966-02.china-leadership-5
      when: Feb.
      date: '1966-02'
      thread: china-leadership
      c: 'Mao, in a talk with Mao Yuanxin 毛远新, his nephew, then a student of the Military Engineering Academy at Harbin 哈尔滨: science goes from low to high, simple to complex, but lectures need not follow the order of development; study chiefly modern history; to teach atomic physics there is no need to begin with the earliest school; at this rate ten years will not finish the course; natural scientists should learn to use dialectics.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 224 (Feb. 1966; printed from *Mao zhuxi lun jiaoyu geming*, Renmin Chubanshe, Dec. 1967). Made public: 1967 (*Mao zhuxi lun jiaoyu geming*, Renmin Chubanshe, Dec. 1967, the Wengao''s source). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). Names: Mao Zedong, Mao Yuanxin. Check: the day; the Wengao gives only Feb. 1966. Check: whether the 1967 printing was an open one (no copyright page seen).'
