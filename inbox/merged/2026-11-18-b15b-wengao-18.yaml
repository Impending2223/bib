      when: Dec. 14
      date: '1965-12-14'
      thread: china-leadership
      c: 'Mao, in a talk with Li Zhizhong 李质忠, deputy director of the Central Committee General Office: confidential work and guard work are very important; the Party''s secrets are to be kept, not used by revisionism; revisionism inside is to be guarded against; when a fight comes, watch for ghosts and monsters who will come out to sabotage. This is to be told to the Central Committee''s Confidential Bureau and Office and to the heads of the army''s confidential bureau and of the Broadcasting Administration.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 182 (Dec. 14, 1965; part of a talk; printed from the original in the Central Archives). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Central Committee General Office, comp., "Chairman Mao''s instructions on confidential and secrecy work," which takes in the talk (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 182 n.1a); Zhongfa [1972] 33, the summary of the Center''s forum on guard work, quoting its first sentence (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 182 n.1b). Names: Mao Zedong, Li Zhizhong.'
      tags:
