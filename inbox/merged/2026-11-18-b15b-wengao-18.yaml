      date: '1965-02-04'
      thread: china-leadership
      c: 'Mao to Yang Yong 杨勇, commander of the Peking Military Region and head of the Peking subway leading group 北京地下铁道领导小组, on the subway plan Peng Zhen 彭真 forwarded: "You are the commission''s commander." He wants careful design and careful construction; errors and failures are certain, to be corrected as seen.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 5–6 (Feb. 4, 1965; Mao''s note; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Yang Yong, Wan Li and Wu Jingtian, report to Peng Zhen and Li Fuchun, for the Central Committee and the Military Commission, on building an underground railway in Peking (policy, route, protection class, cost, preparation; three phases, the first 20.8 km, begun in the second half of 1965 and finished in the first half of 1968), Jan. 15, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 5 n.1a); Peng Zhen, covering letter to Yang Yong and others, "inclined to agree" with the subway report, Jan. 23, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 5 n.1b). Names: Mao Zedong, Peng Zhen, Li Fuchun, Yang Yong, Wan Li, Yang Chengwu.'
      tags:
