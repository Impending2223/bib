      c: 'Mao, at 9 a.m., on the report on the time of the second nuclear test and the draft press communiqué that Zhou Enlai 周恩来 sent him May 11: back to the Premier; agreed. The report, from Zhang Aiping 张爱萍 and Liu Xiyao 刘西尧, says some twenty hours of good weather are due May 12–13, the front has been told to be ready, and the communiqué has been read by the Standing Committee''s members. The test is fired May 14 at 10 a.m.; Xinhua 新华社 prints the communiqué May 15.'
