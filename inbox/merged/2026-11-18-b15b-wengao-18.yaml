- add:
    entry:
      id: cal.1965-07-18.china-leadership-2
      when: July 18
      date: '1965-07-18'
      thread: china-leadership
      c: 'Mao to Lu Dingyi 陆定一, Kang Sheng 康生, Zhou Enlai 周恩来, Liu Shaoqi 刘少奇, Deng Xiaoping 邓小平 and Peng Zhen 彭真, on a letter to Jiang Qing 江青 from three teachers of the Central Academy of Fine Arts on the use of models: this should be changed; drawing nude models, men, women, old and young, is a basic skill of painting and sculpture, and a ban as feudal thought is improper; some bad things may come of it, no matter; small sacrifices for the art. In a note at the letter''s end: Qi Baishi 齐白石, Chen Banding 陈半丁 and the like are no better than late Qing painters in flowers and trees and cannot paint figures; of those he has seen only Xu Beihong 徐悲鸿 left nude studies, and Liu Haisu (the volume prints 刘海栗).'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 84–86 (July 18, 1965; Mao''s two notes; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Wen Lipeng, Wang Shiguo and Li Huaji, teachers of the Central Academy of Fine Arts, letter to Jiang Qing on the use of models in art schools, May 12, 1965 (the abolition of the model system understood in its revolutionary spirit; a small share of nude studies to be kept; a democratic discussion in the fourth phase of the academy''s four cleanups) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 85 n.1). Names: Mao Zedong, Lu Dingyi, Kang Sheng, Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Jiang Qing.'
