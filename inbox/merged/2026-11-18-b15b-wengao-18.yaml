      c: 'Mao, Liu Shaoqi 刘少奇, Zhu De 朱德 and Zhou Enlai 周恩来 telegraph Brezhnev, Mikoyan and Kosygin on the 15th anniversary of the Sino-Soviet treaty of friendship, alliance and mutual assistance 《中苏友好同盟互助条约》: the treaty serves both peoples and the socialist camp; American armed aggression against the DRV is aggression on the whole camp; China stands with the Soviet people whatever happens; support for Vietnam and Indochina, against the arming of Japan and West Germany, for Cuba and the Congo (Leopoldville).'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 12–14 (Feb. 13, 1965; printed from *Renmin ribao*, Feb. 14, 1965). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Brezhnev, Mikoyan, Kosygin.'
