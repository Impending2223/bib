    entry:
      id: cal.1966-04.vietnam-air-war-2
      when: Apr., first week
      date: 1966-04
      thread: vietnam-air-war
      c: The 360th Tactical Reconnaissance Squadron, radio direction finding RC-47s, set up at Tân Sơn Nhứt.
      n: '[[w.schlight-united-states-air-force]], 128.'
      src:
        c: 5425fc31
        rows:
        - 'w.schlight-united-states-air-force 128: all'
      tags:
      - place:tan-son-nhut
- add:
    entry:
      id: cal.1966-05.vietnam-air-war
      when: May
      date: 1966-05
      thread: vietnam-air-war
      c: 'McConnell and Harold K. Johnson divide airborne radio direction finding: thirty-nine areas, the four over the
        trails in Laos, one off North Vietnam''s coast and three in the mountains to the Air Force''s 47 RC-47s, the other
        thirty-one split with the Army''s 56 U-6s.'
      n: '[[w.schlight-united-states-air-force]], 128. Check: the month; the page has "the following month." See [[cal.1966-04-06.defense]].
        Names: McConnell, Harold K. Johnson.'
      src:
        c: 2f272ab5
        rows:
        - 'w.schlight-united-states-air-force 128: all'
      tags:
      - name:mcconnell-john-p
      - name:johnson-harold-k
- add:
    entry:
      id: cal.1966-05-27.vietnam-air-war
      when: May 27
      date: '1966-05-27'
      thread: vietnam-air-war
      c: The Air Force contracts with Walter Kidde Constructors to build its base at Tuy Hòa, a single-package "turnkey"
        contract outside MACV's construction system.
      n: '[[w.schlight-united-states-air-force]], 122.'
      src:
        c: 2ac84063
        rows:
        - 'w.schlight-united-states-air-force 122: all'
