ops:
- add:
    entry:
      id: cal.1965-03-13.vietnam-air-war
      when: Mar. 13
      date: '1965-03-13'
      thread: vietnam-air-war
      c: 'Taylor from Saigon: "through repeated delays we are failing to give the mounting crescendo to Rolling Thunder
        which is necessary to get the desired results."'
      n: '[[w.schlight-united-states-air-force]], 29. Names: Taylor.'
      src:
        c: 78beb02a
        rows:
        - 'w.schlight-united-states-air-force 29: all'
      tags:
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1965-03-17.vietnam-force-levels-2
      when: Mar. 17–19
      date: '1965-03-17'
      thread: vietnam-force-levels
      c: 'McConnell to the other Chiefs on Harold K. Johnson''s recommendations: Rolling Thunder hobbled and given too little
        time; an Army division near Pleiku would plunge the United States into the ground war. He proposes the wraps off
        Rolling Thunder, four fighter squadrons to the South, any division limited to coastal enclaves south of Đà Nẵng.
        Overruled.'
      n: '[[w.schlight-united-states-air-force]], 23. See [[cal.1965-03-15.vietnam-force-levels]]. Names: McConnell, Harold
        K. Johnson.'
      src:
        c: e18f125f
        rows:
        - 'w.schlight-united-states-air-force 23: all'
      tags:
      - name:mcconnell-john-p
      - name:johnson-harold-k
- add:
    entry:
      id: cal.1965-04-22.vietnam-saigon
      when: Apr. 22
      date: '1965-04-22'
      thread: vietnam-saigon
      also:
      - vietnam-force-levels
      c: 'Taylor and U. Alexis Johnson tell Quát of Honolulu: the thirty-one battalions Saigon plans not enough, twenty
        more needed; American troops to secure enclaves at Biên Hòa, Chu Lai and Qui Nhơn and be a reserve. Quát "calm,"
        almost relieved.'
      n: '[[w.schlight-united-states-air-force]], 35–36. Names: Taylor, U. Alexis Johnson, Phan Huy Quát.'
      src:
        c: 3c4518ef
        rows:
        - 'w.schlight-united-states-air-force 35–36: all'
      tags:
      - name:taylor-maxwell
      - name:johnson-u-alexis
      - name:phan-huy-quat
- add:
    entry:
      id: cal.1965-04-28.vietnam-air-war
      when: Apr. 28
      date: '1965-04-28'
      thread: vietnam-air-war
      c: 'New air priorities announced, the war in the South first: Westmoreland in effect holds a veto over Rolling Thunder,
        Steel Tiger, Barrel Roll, Yankee Team and Blue Tree. Over 1,000 American aircraft in South Vietnam, half of them
        helicopters.'
      n: '[[w.schlight-united-states-air-force]], 40–41. Names: Westmoreland.'
      src:
        c: 7a2fc5bd
        rows:
        - 'w.schlight-united-states-air-force 40–41: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-05-03.vietnam-force-levels
      when: May 3
      date: '1965-05-03'
      thread: vietnam-force-levels
      c: The 173d Airborne Brigade's advance party, seventy men, into Biên Hòa by Air Force C-130s. Sharp has approved the
        move on the understanding the brigade's stay is temporary.
      n: '[[w.schlight-united-states-air-force]], 36. See [[cal.1965-05-05.vietnam]]. Names: Sharp.'
      src:
        c: deb78e4c
        rows:
        - 'w.schlight-united-states-air-force 36: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1965-06-02.vietnam-air-war
      when: June 2
      date: '1965-06-02'
      thread: vietnam-air-war
      c: MACV unveils the O-1 visual reconnaissance program promised in April, within the existing decentralized structure;
        three more Bird Dog squadrons authorized in May.
      n: '[[w.schlight-united-states-air-force]], 47.'
      src:
        c: c31a3774
        rows:
        - 'w.schlight-united-states-air-force 47: all'
- add:
    entry:
      id: cal.1964-10.vietnam-2
      when: Oct., early
      date: 1964-10
      thread: vietnam
      c: Ranch Hand's four aircraft fly their first crop destruction missions, Taylor turning to American planes when the
        Vietnamese refuse to fly in War Zone D; 34 more by the year's end.
      n: '[[w.schlight-united-states-air-force]], 92. Names: Taylor.'
      src:
        c: 8cf28469
        rows:
        - 'w.schlight-united-states-air-force 92: all'
      tags:
      - name:taylor-maxwell
- add:
    entry:
      id: cal.1964-12.vietnam-air-war
      when: Dec., early
      date: 1964-12
      thread: vietnam-air-war
      c: Two C-47s at Biên Hòa fitted with guns, gunsights and flare dispensers; by mid-month they are repelling attacks
        on outposts.
      n: '[[w.schlight-united-states-air-force]], 90.'
      src:
        c: f21ddc3c
        rows:
        - 'w.schlight-united-states-air-force 90: all'
- add:
    entry:
      id: cal.1965-10.vietnam-air-war-2
      when: Oct., mid
      date: 1965-10
      thread: vietnam-air-war
      c: Cam Ranh Bay's temporary runway finished, after Army engineers' roads, quarries and pier, June to September.
      n: '[[w.schlight-united-states-air-force]], 86.'
      src:
        c: 517f2e80
        rows:
        - 'w.schlight-united-states-air-force 86: all'
      tags:
      - place:cam-ranh-bay
- add:
    entry:
      id: cal.1965-10.vietnam-air-war-3
      when: Oct.
      date: 1965-10
      thread: vietnam-air-war
      c: The first F-5s in Vietnam, at Biên Hòa.
      n: '[[w.schlight-united-states-air-force]], 88. Check: the day; the page''s photograph has "October 1965."'
      src:
        c: bb019200
        rows:
        - 'w.schlight-united-states-air-force 88: all'
- add:
    entry:
      id: cal.1965-12.laos
      when: Dec., first week
      date: 1965-12
      thread: laos
      also:
      - vietnam-air-war
      c: The AC-47 gunships extend their work to strikes and flare missions against troops moving down the trails of Laos.
      n: '[[w.schlight-united-states-air-force]], 91.'
      src:
        c: f287852f
        rows:
        - 'w.schlight-united-states-air-force 91: all'
- add:
    entry:
      id: cal.1965-12.laos-2
      when: Dec., early
      date: 1965-12
      thread: laos
      also:
      - vietnam-air-war
      c: The UC-123s fly their first defoliation mission in Laos.
      n: '[[w.schlight-united-states-air-force]], 92.'
      src:
        c: 20f77558
        rows:
        - 'w.schlight-united-states-air-force 92: all'
- add:
    entry:
      id: cal.1965-12.vietnam-air-war
      when: Dec.
      date: 1965-12
      thread: vietnam-air-war
      c: The psychological warfare aircraft fly 287 missions, ten times November's; by early January they broadcast to North
        Vietnamese troops in eastern Laos.
      n: '[[w.schlight-united-states-air-force]], 93.'
      src:
        c: 8a969676
        rows:
        - 'w.schlight-united-states-air-force 93: all'
- add:
    entry:
      id: cal.1966-02-02.vietnam-force-levels
      when: Feb. 2
      date: '1966-02-02'
      thread: vietnam-force-levels
      c: The Joint Chiefs give the evaluation of the war McConnell and Greene asked before more deployments; the Air Force
        and the Marines dispute its method. An acceptable analysis not until June.
      n: '[[w.schlight-united-states-air-force]], 115. Names: McConnell, Greene.'
      src:
        c: 0113232b
        rows:
        - 'w.schlight-united-states-air-force 115: all'
      tags:
      - name:mcconnell-john-p
      - name:greene-wallace-m-jr
- add:
    entry:
      id: cal.1966-03-14.vietnam-air-war
      when: Mar. 14
      date: '1966-03-14'
      thread: vietnam-air-war
      c: A squadron of F-4s, the last jet fighter squadron of Phase I, arrives at Phan Rang, its temporary runway in place
        by mid-March, with the new 366th Fighter Wing's headquarters.
      n: '[[w.schlight-united-states-air-force]], 120.'
      src:
        c: 0ddf7ea5
        rows:
        - 'w.schlight-united-states-air-force 120: all'
- add:
    entry:
      id: cal.1966-04-07.vietnam-air-war-2
      when: Apr. 7
      date: '1966-04-07'
      thread: vietnam-air-war
      c: 'The munitions shortage: 233 Air Force sorties canceled, 134 on Apr. 8, 515 Apr. 11–14; iron bombs, 20-mm ammunition
        and some rockets running out.'
      n: '[[w.schlight-united-states-air-force]], 117.'
      src:
        c: 123df281
        rows:
        - 'w.schlight-united-states-air-force 117: all'
- add:
    entry:
      id: cal.1966-04.vietnam-air-war
      when: Apr.
      date: 1966-04
      thread: vietnam-air-war
      c: Washington delegates to CINCPAC the approval of MACV's B-52 targets.
      n: '[[w.schlight-united-states-air-force]], 148.'
      src:
        c: 9a3e344b
        rows:
        - 'w.schlight-united-states-air-force 148: all'
- add:
    entry:
      id: cal.1966-05.defense
      when: May
      date: 1966-05
      thread: defense
      also:
      - vietnam-air-war
      c: The Tactical Air Command picks the Cessna 337, the O-2A, as the interim forward air controller's plane until the
        OV-10; by July 1967 replacing O-1s.
      n: '[[w.schlight-united-states-air-force]], 242.'
      src:
        c: 3c8bc755
        rows:
        - 'w.schlight-united-states-air-force 242: all'
- add:
    entry:
      id: cal.1966-07-01.vietnam-air-war-2
      when: July 1
      date: '1966-07-01'
      thread: vietnam-air-war
      c: Momyer takes command of the Seventh Air Force; Moore to Hawaii as second in command of the Pacific Air Forces.
      n: '[[w.schlight-united-states-air-force]], 139. Names: Momyer.'
      src:
        c: bfcbb8cb
        rows:
        - 'w.schlight-united-states-air-force 139: all'
      tags:
      - name:momyer-william-w
- add:
    entry:
      id: cal.1966-12-20.vietnam-air-war
      when: Dec. 20
      date: '1966-12-20'
      thread: vietnam-air-war
      c: Phu Cat. The runway's first concrete poured; the contractor's work cut back for costs, Air Force teams building
        the rest.
      n: '[[w.schlight-united-states-air-force]], 158.'
      src:
        c: ef437ef7
        rows:
        - 'w.schlight-united-states-air-force 158: all'
- add:
    entry:
      id: cal.1966-12-23.vietnam-air-war
      when: Dec. 23
      date: '1966-12-23'
      thread: vietnam-air-war
      c: The Caribous' move to Phu Cat begins, cargo and vehicles by air and road to the half-finished field; the two squadrons
        there eleven days after the runway's first concrete.
      n: '[[w.schlight-united-states-air-force]], 147, 158.'
      src:
        c: 5151ba2d
        rows:
        - 'w.schlight-united-states-air-force 147, 158: all'
- add:
    entry:
      id: cal.1967-01.vietnam-air-war-2
      when: Jan., early
      date: 1967-01
      thread: vietnam-air-war
      c: SAC's ADVON installed in the Seventh Air Force's headquarters; Westmoreland keeps the planning of B-52 strikes
        in MACV.
      n: '[[w.schlight-united-states-air-force]], 150. Names: Westmoreland.'
      src:
        c: b40d8d4e
        rows:
        - 'w.schlight-united-states-air-force 150: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-03.vietnam-air-war-2
      when: Mar.
      date: 1967-03
      thread: vietnam-air-war
      c: 'Arc Light reaches 800 B-52 sorties a month: 450 by August 1966, held there by the bomb shortage until November,
        600 in December.'
      n: '[[w.schlight-united-states-air-force]], 153.'
      src:
        c: 831a0d74
        rows:
        - 'w.schlight-united-states-air-force 153: all'
- add:
    entry:
      id: cal.1967-05-18.vietnam-operations
      when: May 18
      date: '1967-05-18'
      thread: vietnam-operations
      c: 'Hickory: Marine and ARVN units sweep the southern part of the DMZ, the first American ground venture into it,
        after B-52 and tactical strikes May 17; a diversionary amphibious landing. Eleven days; 780 enemy killed.'
      n: '[[w.schlight-united-states-air-force]], 262, 264. See [[cal.1967-05.vietnam-operations-2]].'
      src:
        c: aa8503a5
        rows:
        - 'w.schlight-united-states-air-force 262, 264: all'
- add:
    entry:
      id: cal.1967-07.defense
      when: July
      date: 1967-07
      thread: defense
      also:
      - vietnam-air-war
      c: McConnell instructs the Air Force to proceed with guided weapons; the first "smart" bombs in the war a year later.
      n: '[[w.schlight-united-states-air-force]], 234. Names: McConnell.'
      src:
        c: c6d43a77
        rows:
        - 'w.schlight-united-states-air-force 234: all'
      tags:
      - name:mcconnell-john-p
- add:
    entry:
      id: cal.1967-08-15.vietnam-air-war
      when: Aug. 15
      date: '1967-08-15'
      thread: vietnam-air-war
      c: The A-37 squadron, the 604th Air Commando, begins its tests in South Vietnam, 12 combat sorties a day; 60 a day
        by Sept. 5.
      n: '[[w.schlight-united-states-air-force]], 241.'
      src:
        c: 6bb0cab5
        rows:
        - 'w.schlight-united-states-air-force 241: all'
- add:
    entry:
      id: cal.1968-02.vietnam-air-war
      when: Feb.
      date: 1968-02
      thread: vietnam-air-war
      c: Gunship II, the AC-130, back in Southeast Asia after its test, flies its first official combat mission.
      n: '[[w.schlight-united-states-air-force]], 240.'
      src:
        c: 6946a9a3
        rows:
        - 'w.schlight-united-states-air-force 240: all'
- cite:
    id: cal.1968-01-31.vietnam-tet
    item: '[[w.schlight-united-states-air-force]], 305 (55 percent of the South Vietnamese air force on leave when the offensive
      struck)'
    units: A
- add:
    entry:
      id: cal.1966-03.vietnam-force-levels
      when: Mar., late
      date: 1966-03
      thread: vietnam-force-levels
      c: 'McNamara decides the year-end goal: 79 American, 23 allied and 162 South Vietnamese maneuver battalions; his analysts
        set the fighter squadrons by sorties, 18,500 for June rising to 23,300 in December.'
      n: '[[w.schlight-united-states-air-force]], 116. Names: McNamara.'
      src:
        c: d3f0f548
        rows:
        - 'w.schlight-united-states-air-force 116: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-03.vietnam-air-war-2
      when: Mar.
      date: 1966-03
      thread: vietnam-air-war
      c: 'The propeller aircraft moved off Tân Sơn Nhứt and Biên Hòa to the new 14th Air Commando Wing at Nha Trang: the
        two A-1 Farm Gate squadrons, the AC-47 squadron, the 20th Helicopter Squadron.'
      n: '[[w.schlight-united-states-air-force]], 129. Check: the month; the page has "by March."'
      src:
        c: 5654d083
        rows:
        - 'w.schlight-united-states-air-force 129: all'
- add:
    entry:
      id: cal.1966-04-06.defense
      when: Apr. 6
      date: '1966-04-06'
      thread: defense
      also:
      - vietnam-air-war
      c: 'McConnell and Harold K. Johnson sign their agreement, drafted with a handful of their staffs: the 104 Caribous
        in Vietnam to pass from the Army to the Air Force by Jan. 1, 1967.'
      n: '[[w.schlight-united-states-air-force]], 124–25. Names: McConnell, Harold K. Johnson.'
      src:
        c: e5235ae9
        rows:
        - 'w.schlight-united-states-air-force 124–25: all'
