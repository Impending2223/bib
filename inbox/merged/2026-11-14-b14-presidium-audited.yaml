patch: 2026-11-14-b14-presidium
by: 'Claude (Sonnet), batch 14, reader 4, Nov. 14, 2026: the Presidium''s stenograms passed over (notes/book-checks/prezidium-tsk-kpss-1954.md, "Batch 14"); audited by Opus, Nov. 14, 2026 (each op against I, 448–74, 719–32, 781–816, 1081–82, 1155–58 and III, 622–29, 1045, the text layer and the page images of I, 471–74; Dec. 16, 1960 put in the session''s order, the lamps Moscow''s, Matskevich''s close; June 7, 1963, the councils and additives as said; Dec. 23, 1963, the ballast the report''s, the plenum''s wording, the Somalia item''s protocol; name tags made whole)'
ops:
- edit:
    id: cal.1960-12-16.soviet-union-leadership
    base: 780752da
    set:
      c: 'The enlarged Presidium on agriculture, stenographed, the republics'' leaders and Lysenko there. Khrushchev on his note: needs rising with wages, the economy to meet them. Land to be found for irrigation; Gosplan''s 30–35 billion rubles too little, perhaps 70; steel for 1965 at 91 million tons, 86 if need be, not Gosplan''s 96; Gosplan charged with amending the Twenty-first Congress unasked, Novikov answering. Not to build communism on "moral factors" like the Chinese, "болтовня о коммунизме, а брюхо подтягивай" (talk of communism, and tighten your belly); Liu Shaoqi had told him the Chinese would give farming more heed. Irrigated land for rice, Lysenko agreeing: 3 million hectares by 1965, more by 1970, in Central Asia, Kazakhstan, Azerbaijan, the Volga delta, the Manych, the North Caucasus; pumps, not gravity. The Ministry of Agriculture to rest on the research institutes, Matskevich out of Gosplan; Lysenko, floated as deputy minister for science, declines the post. Theft at the grain depots. The Ukrainians first under fire, Poltava, Chernigov, Sumy; Georgia''s sheep; fraud in Ryazan. Fewer museums and stadiums; Lenin memorials only by the Central Committee''s leave; Kiev''s new sports palace; the RSFSR Supreme Soviet''s session on nature protection a mistake, Paustovsky''s article in *Izvestia* faulted; no music schools on collective farms; no flowers for Moscow, fewer street lamps. Matskevich: to recount and report. Khrushchev: the reports and theses for the plenum to be recast. Resolved: his proposals on farming and on reorganizing the Ministry of Agriculture approved; the republics to draft measures, Gosplan and Matskevich to sum them up.'
      n: 'Protocol 311, item I. [[w.prezidium-tsk-kpss-1954]], I, 448–49 (Malin''s notes), 450–74 (the stenogram: the note, 450; land, the 70 billion, the steel and Novikov, 451–53; the Chinese and Liu Shaoqi, 453; rice, 453–58; the Ministry, 458–62; the depots, 463–64; Lysenko, 464; the Ukrainians, 464–67; Georgia''s sheep, 468; Ryazan, 469; museums, memorials, the Kiev palace, Paustovsky, music schools, 471–73; Moscow''s flowers and lamps, Matskevich, the plenum, 473–74), 1081–82 nn.1–7 (the Ryazan pledges and Larionov), 1082 (the stenogram''s notes: n.2, the talk with Liu Shaoqi, Nov. 30, 1960; n.13, Paustovsky''s article, *Izvestia*, Oct. 25, 1960); III, 139 (P 311/I). Made public: 2003. Names: Lysenko, Khrushchev, Novikov, Liu Shaoqi, Matskevich, Paustovsky.'
      tags: [name:khrushchev-nikita-s, polity:ussr, polity:prc, name:matskevich-vladimir-v, name:liu-shaoqi]
- edit:
    id: cal.1963-06-07.soviet-union-leadership
    base: f3de8185
    set:
      c: 'The Presidium. Khrushchev, stenographed, on his talks with Castro in the south: Castro asked what divides Moscow from Peking; "nationalism," egoism, the wish to be first violin. "говорят, что мы струсили. Но если мы струсили, так зачем же мы тогда на Кубу поставили ракеты?" (they say we lost our nerve; but if so, why did we put missiles in Cuba?); Castro had thought them put there for the whole camp; a military treaty not to his advantage, a communiqué instead. A Cuban steel works doubtful, no coking coal, the cans wanted for preserves; Khrushchev wary of becoming Guevara''s enemy; the Program''s dropping of the dictatorship of the working class, which the Chinese attack, defended. A sugar-cane machine promised within two years. He will go to Cuba by Jan. 1. Then his visit to Yaroslavl: the tire works littered, rubber stored in the open, a quarter of the tires still on cotton cord; no plants for diesel-oil additives, Gosplan finding no money; advisory bodies of engineers at the works to be thought of. Approved, the talks "вполне хорошими" (quite good). Podgorny and Brezhnev to be Central Committee secretaries, Brezhnev leaving the Supreme Soviet''s chair. Lesechko faulted on the Comecon meeting, the Romanians. On a KGB note, Zhukov to be called in and warned: if he does not understand, expulsion and arrest.'
      n: 'Protocol 100. [[w.prezidium-tsk-kpss-1954]], I, 719–20 (doc. 292, Malin''s notes), 720–32 (doc. 293, the stenogram of items I and II, its opening and the rest of the session not stenographed: Castro and China, 720; the missiles, 720–21; the treaty, 722; the steel works and Guevara, 722; the Program, 722–23; the cane machine, 724; Jan. 1, 725–26; Yaroslavl, 726–31; the additives, 730; the advisory bodies, 731); III, 534–36 (P 100/I–II; the KGB''s note of May 27, Semichastny''s, not printed). See [[cal.1963-05-05.cuba]]. Made public: 2003. Names: Khrushchev, Castro, Guevara, Podgorny, Brezhnev, Lesechko, Zhukov.'
      tags: [name:khrushchev-nikita-s, name:castro-fidel, name:guevara-ernesto, name:podgorny-nikolai-v, name:brezhnev-leonid, polity:ussr, polity:cuba, polity:romania]
- edit:
    id: cal.1963-12-23.soviet-union-leadership
    base: f769fb07
    set:
      c: 'The Presidium, the same session as the schools. The December plenum''s decisions on chemistry: Khrushchev asks Gosplan, the chemists and industry for an inventory of the plants in fertilizers, herbicides, fibers and plastics against the world''s level, and for the plants to be bought abroad chosen, not taken as offered; his report''s fertilizer a third "simple," ballast; a chemical industry on Sakhalin''s oil and gas, for trade with Japan, and a plant in northern Kirghizia. Tasks to be assigned, letters by branch to the party organizations, the VSNKh not to be supplanted. The delegation to Cuba for the revolution''s fifth anniversary, under Podgorny: its trip to be announced by radio Dec. 23 and in the press Dec. 24, "Почему раньше не опубликовали?" (why was it not published before?); the greeting to repeat Cuba''s position on the base at Guantánamo and its four or five conditions; gifts, Castro''s apart.'
      n: 'Protocol 126, items I and XI. [[w.prezidium-tsk-kpss-1954]], I, 781–82 (doc. 304, Malin''s notes), 783–802 (doc. 305, the stenogram on chemistry: the inventory and the ballast, 783–84; Kirghizia and Sakhalin, 785; Cuba and Algeria not stenographed, 816); III, 622–29 (P 126/I and Malin''s own jottings for it, P 126/XI and the departments'' note, P 126/XII on the gifts). See [[cal.1963-12-23.soviet-union]], [[cal.1963-12-04.cuba]]. Made public: 2003. Names: Khrushchev, Podgorny, Castro.'
      tags: [name:khrushchev-nikita-s, name:podgorny-nikolai-v, name:castro-fidel, polity:ussr, polity:cuba, polity:us]
