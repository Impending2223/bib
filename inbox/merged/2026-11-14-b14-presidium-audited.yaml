      c: 'The Presidium on the sale of arms to Somalia, stenographed. Khrushchev: the talk with Prime Minister Shermarke misjudged; he wants more arms, to turn against the Emperor of Ethiopia and Kenya. "Зачем им 120 танков, к тому же бесплатно?" (why do they need 120 tanks, and free?). The matter to be held back and the position reviewed, someone perhaps sent to talk to him; Soviet arms not to set African states against one another; a flexible line, not to push Somalia away.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 802 (the stenogram, "Вопрос по Сомали"; the heading the protocol''s, I, 1157 n.19, which prints "П 176/VII" for the file of P 126; no decision printed, in I or in III''s P 126, 622–29); I, 1157 nn.20–23 (the editors: Shermarke in the USSR in July 1963; Kenya independent Dec. 12, 1963; the Somali–Ethiopian border fighting of Feb. 1964, Khrushchev''s message to Shermarke and the Emperor, Feb. 10, 1964). See [[cal.1963-10-01.africa]]. Made public: 2003. Names: Khrushchev, Shermarke.'
      tags:
      - name:khrushchev-nikita-s
      - name:abdirascid-ali-shermarke
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1963-12-23.soviet-union-leadership-4
      when: Dec. 23
