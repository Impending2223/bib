      c: 'The Presidium on calling the plenum on agriculture, stenographed. Brezhnev reads the draft decision. Khrushchev: the report to put first the managers'' skill in getting the most from the land, with science, not the plan''s fulfillment; the RSFSR Bureau and the republics'' central committees, in their co-reports, each to show its level of preparation; the growth of farm output added to the draft. He would have Volovchenko take a group of agrochemists and soil scientists to the GDR''s agricultural academy and farms, for fertilizer and mechanization: "немцы под боком" (the Germans are next door). Next, Cuba and Algeria, not stenographed.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 815–16 (the stenogram, Brezhnev reading the draft; the rest not stenographed); I, 1158 n.40 (the editors: the enlarged plenum on intensifying agriculture met Feb. 10–15, 1964); III, 625 (Malin''s jottings for the session, item V, the plenum''s preparation), 1045 n.5. See [[cal.1963-12-23.soviet-union-leadership]]. Made public: 2003. Names: Brezhnev, Khrushchev, Volovchenko.'
      tags:
      - name:khrushchev-nikita-s
