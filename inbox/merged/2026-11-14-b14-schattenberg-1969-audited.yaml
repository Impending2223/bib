patch: 2026-11-14-b14-schattenberg-1969
by: 'Claude (batch 14, reader 5, 1969: Schattenberg, *Brezhnev: The Making of a Statesman*, pp. 211, 214–15, 227–28, 247, 254, 282, 285–89, 299, 337–38), Nov. 14, 2026; audited by Claude (Opus), batch 14 audit, Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1969-01-22.soviet-union-leadership-2
      when: Jan. 22
      date: '1969-01-22'
      thread: soviet-union-leadership
      c: An attempt on Brezhnev. The assassin shoots at the wrong car of the convoy bringing the cosmonauts of Soyuz 4 and 5 to the reception in the Kremlin; Brezhnev unhurt, a chauffeur the only death. *Pravda* reports it in passing, the cosmonauts the target, Brezhnev not named.
      n: '[[w.schattenberg-brezhnev]], 337–38 (n.16–17). To check: *Pravda*, Jan. 24, 1969, 2, "Soobshchenie"; V. Medvedev, *Chelovek za spinoy* (1994), 35–36; Shelest, *Da ne sudimy budete*, 418 (cited by [[w.schattenberg-brezhnev]], 337 nn.16–17). Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1969-12-17.soviet-union-leadership
      when: Dec. 17
      date: '1969-12-17'
      thread: soviet-union-leadership
      c: 'The Politburo on an article for Stalin''s ninetieth birthday, Dec. 21. Opinions diverge: some want no mention of him, some celebrate him, some a balanced picture, some him as a mass murderer. Brezhnev, who had been for no article, decides after hearing the oblast secretaries and the others that one be published: no one denies his revolutionary merits, no one his grave errors.'
      n: '[[w.schattenberg-brezhnev]], 247 (n.31, 34). To check: L. Mlechin, *Brezhnev*, 303, 307; Shelest, *Da ne sudimy budete*, 444 (cited by [[w.schattenberg-brezhnev]], 247 nn.31, 34). Made public: 2021 at the latest. Names: Brezhnev, Stalin, Shelest. Check: the day: the work gives Dec. 17; its n.34 notes Shelest has Dec. 19; the Politburo''s earlier commission to the Central Committee for the article, undated.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1969-12-25.soviet-union-leadership
      when: Dec. 25
      date: '1969-12-25'
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance-federal-republic
      c: 'Lednëv, a "journalist" sent by the KGB, brings Bahr a copy of Brandt''s letter of Nov. 19 to Kosygin, opening a confidential channel: the Soviet side is open to a confidential exchange of opinions, whose occurrence and content will never be made public. Bahr takes him at first for Kosygin''s man; later he learns Lednëv means Brezhnev and the KGB.'
      n: '[[w.schattenberg-brezhnev]], 288–89 (n.220–24). To check: Bahr''s note, Dec. 24, 1969, *Akten zur Auswärtigen Politik der Bundesrepublik Deutschland 1969*, II, 1465; Brandt to Kosygin, Nov. 19, 1969, ibid., 1313; E. Bahr, *Zu meiner Zeit*, 293 (cited by [[w.schattenberg-brezhnev]], 288 nn.221–23). Made public: 2021 at the latest. Names: Bahr, Brandt, Kosygin, Brezhnev, Andropov. Check: the day: Christmas Day in the text, Bahr''s own record dated Dec. 24; the place, not given for this meeting (the later ones at Dahlem, West Berlin, 289).'
      tags:
      - name:brandt-willy
      - name:kosygin-aleksei
      - name:brezhnev-leonid
      - name:andropov-yuriy-vladimirovich
      - polity:ussr
      - polity:frg
      - vis:only:ussr+frg
- cite:
    id: cal.1969-12-15.soviet-union-leadership
    item: '[[w.schattenberg-brezhnev]], 227–28, 247 (Brezhnev''s speech, kept secret: the first general attack on Kosygin and Gosplan, the 1970 plan ill thought out, ministries named by the figures they miss; drink; prepared by his staff under Bovin, not discussed in the Politburo; 227 nn.229–38, 247 n.32)'
    units: B
