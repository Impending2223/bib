- check:
    id: cal.1969-06-25.soviet-union-leadership
    text: 'Check: [[w.schattenberg-brezhnev]], 214 (214 n.92: RGANI, f. 2, op. 3, d. 159, l. 143–44, a plenum''s file), has Brezhnev on agriculture in June 1969, the oblast and rayon officials invited: the poor harvest of 1967, the food promised to Czechoslovakia, the apathy of the guaranteed wage; whether at this plenum is not shown.'
