      when: Apr.
      date: 1961-04
      thread: africa
      c: 'The Joint Chiefs answer Nitze: Africa''s arming "mostly attributable to Sino-Soviet subversive activity"; oppose
        an atom-free zone; regional arms control "in the lowest possible key," if politically necessary; keep the three bomber
        bases in Morocco.'
      n: '[[w.poole-joint-chiefs-of-staff]], 251–52. Check: the month; Poole: "Three months later." See [[cal.1961-01-27.africa]].
        Names: Nitze.'
      src:
