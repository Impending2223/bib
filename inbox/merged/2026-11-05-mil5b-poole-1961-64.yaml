      c: NSAM 140. Kennedy approves and circulates State's brief paper on military collaboration with Latin America.
      n: '[[w.poole-joint-chiefs-of-staff]], 228. Check: the day; Poole: "Two months later," after January. See [[cal.1961-12-05.latin-america]].
        Names: Kennedy.'
