    entry:
      id: cal.1962-02.latin-america
      when: Feb.
      date: 1962-02
      thread: latin-america
      c: 'State distributes a draft message that military aid will fund the Latin military''s civic action, new units included.
        The Joint Chiefs: civic action from a country''s own resources and only as an adjunct of the military mission; no
        new units under military aid.'
      n: '[[w.poole-joint-chiefs-of-staff]], 228.'
      src:
        c: 3f410b72
        rows:
        - 'w.poole-joint-chiefs-of-staff 228: all'
    section: '196202'
- add:
    entry:
      id: cal.1962-02.latin-america-2
      when: Feb.
      date: 1962-02
      thread: latin-america
      c: 'Kennedy on the modest military aid for Latin America: "Why not more?" Parker, the Chairman''s assistant: Congress
        unlikely to add; encourage the Latins to use their forces in civic action.'
      n: '[[w.poole-joint-chiefs-of-staff]], 229. Names: Kennedy.'
      src:
        c: 3025a425
        rows:
        - 'w.poole-joint-chiefs-of-staff 229: all'
