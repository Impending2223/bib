    entry:
      id: cal.1962-03.europe-and-the-alliance-2
      when: Mar., mid-month
      date: 1962-03
      thread: europe-and-the-alliance
      c: 'State circulates a "Suggested NATO Nuclear Program": the United States willing to join a sea-based multilateral
        force of about 200 missiles, without urgency. The Joint Chiefs: a military requirement for medium-range missiles,
        land and sea; no multilateral control of Polaris; no mixed crews.'
      n: '[[w.poole-joint-chiefs-of-staff]], 198.'
      src:
        c: d60b45dd
        rows:
        - 'w.poole-joint-chiefs-of-staff 198: all'
    section: '196203'
- add:
    entry:
      id: cal.1962-04-18.europe-and-the-alliance-france
      when: Apr. 18
      date: '1962-04-18'
      thread: europe-and-the-alliance-france
      c: NSAM 148. Kennedy forbids the Executive Branch to speak with French officials of nuclear help, over the Joint Chiefs'
        and McNamara's plan of aid in steps; the Joint Committee on Atomic Energy against sharing with France.
      n: '[[w.poole-joint-chiefs-of-staff]], 197–98. See [[cal.1962-03-17.europe-and-the-alliance-france]]. Names: Kennedy,
        McNamara.'
      src:
        c: 991af855
        rows:
        - 'w.poole-joint-chiefs-of-staff 197–98: all'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
    section: '196204'
- add:
    entry:
      id: cal.1962-06-13.europe-and-the-alliance
      when: June 13
      date: '1962-06-13'
      thread: europe-and-the-alliance
      c: 'Kennedy, after talking with Rusk, McNamara, Taylor and Bundy, instructs Finletter: medium-range missiles not urgently
        needed for military reasons; if the allies want them, a seaborne multilateral force, three nationalities to a ship.'
      n: '[[w.poole-joint-chiefs-of-staff]], 199. Names: Kennedy, Rusk, McNamara, Taylor, Bundy, Finletter.'
      src:
        c: 65cea168
        rows:
        - 'w.poole-joint-chiefs-of-staff 199: all'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:bundy-mcgeorge
      - name:finletter-thomas-k
    section: '196206'
- add:
    entry:
      id: cal.1962-07.europe-and-the-alliance
      when: July
      date: 1962-07
      thread: europe-and-the-alliance
      c: Norstad's calculation for the forward defense, accepted by the Joint Chiefs and sent to McNamara; ten divisions repositioned
        over two and a half to five years, $2.787 billion.
      n: '[[w.poole-joint-chiefs-of-staff]], 191. Names: Norstad, McNamara.'
      src:
        c: 157226f4
        rows:
        - 'w.poole-joint-chiefs-of-staff 191: all'
      tags:
      - name:norstad-lauris
      - name:mcnamara-robert-s
    section: '196207'
- add:
    entry:
      id: cal.1962-09.europe-and-the-alliance
      when: Sept.
      date: 1962-09
      thread: europe-and-the-alliance
      c: Rusk warns McNamara of "the sentiment which my people have found among the military" for reopening land-based missiles
        in Europe.
      n: '[[w.poole-joint-chiefs-of-staff]], 199. Names: Rusk, McNamara.'
      src:
        c: 386f3a70
        rows:
        - 'w.poole-joint-chiefs-of-staff 199: all'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
    section: '196209'
- add:
    entry:
      id: cal.1962-10-11.europe-and-the-alliance
      when: Oct. 11
      date: '1962-10-11'
      thread: europe-and-the-alliance
      c: A Defense Policy Conference in Washington, at McNamara's suggestion, with Rusk, Finletter, Lemnitzer and Taylor;
        studies commissioned, among them how long the forces could resist; no direct attack on MC 14/2. Finletter to Rusk,
        of the directive of Apr. 21, 1961, "we have made very little progress."
      n: '[[w.poole-joint-chiefs-of-staff]], 192. Names: McNamara, Rusk, Finletter, Lemnitzer, Taylor.'
      src:
        c: 7dfbabe5
        rows:
        - 'w.poole-joint-chiefs-of-staff 192: all'
      tags:
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:finletter-thomas-k
      - name:lemnitzer-lyman-l
      - name:taylor-maxwell
    section: '196210'
- add:
    entry:
      id: cal.1962-10-17.europe-and-the-alliance
      when: Oct. 17
      date: '1962-10-17'
      thread: europe-and-the-alliance
      c: 'Norstad to the North Atlantic Council: 600 targets need direct coverage, 1,000 more "of concern"; his nuclear capability
        destroyable by fewer than 300 missiles; a land and sea mix of medium-range missiles. "You either have this or you
        have no defense."'
      n: '[[w.poole-joint-chiefs-of-staff]], 199–200. Names: Norstad.'
      src:
        c: 545fe0ce
        rows:
        - 'w.poole-joint-chiefs-of-staff 199–200: all'
      tags:
      - name:norstad-lauris
    section: '196210'
- add:
    entry:
      id: cal.1962-11.europe-and-the-alliance
      when: Nov., mid-month
      date: 1962-11
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs to McNamara: a mix of land- and sea-based medium-range missiles the best answer to the Soviet IRBMs,
        their hardening adding urgency. McNamara: no military need established. Taylor tells Ruffner the position of April
        and June stands.'
      n: '[[w.poole-joint-chiefs-of-staff]], 200. Names: McNamara, Taylor.'
      src:
        c: d068a7ac
        rows:
        - 'w.poole-joint-chiefs-of-staff 200: all'
      tags:
      - name:mcnamara-robert-s
      - name:taylor-maxwell
    section: '196211'
- add:
    entry:
      id: cal.1962-11-20.europe-and-the-alliance-2
      when: Nov. 20
      date: '1962-11-20'
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs to McNamara: Allied Command Europe "clearly" unable to meet a massive conventional attack; 34 active
        and 22 reserve divisions needed for the Rhine, 23 and 12 in hand; 6,515 Pact aircraft to 3,816. The Defense Policy
        Conference reconvenes the same day; Taylor: the nuclear forces become the shield, the conventional the sword.'
      n: '[[w.poole-joint-chiefs-of-staff]], 192–93. See [[cal.1962-10-11.europe-and-the-alliance]]. Names: McNamara, Taylor.'
      src:
        c: a0a11461
        rows:
        - 'w.poole-joint-chiefs-of-staff 192–93: all'
      tags:
      - name:mcnamara-robert-s
      - name:taylor-maxwell
    section: '196211'
- add:
    entry:
      id: cal.1962-12.europe-and-the-alliance
      when: Dec., early
      date: 1962-12
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs on McNamara''s draft for the Council, non-nuclear defense attainable and affordable. Taylor: "strong
        meat," tactical nuclear weapons not to be disparaged. LeMay: the allies "overly optimistic," the enemy "substantially
        downgraded"; rejecting MC 14/2 dangerous.'
      n: '[[w.poole-joint-chiefs-of-staff]], 193. Names: McNamara, Taylor, LeMay.'
      src:
        c: a7a4be79
        rows:
        - 'w.poole-joint-chiefs-of-staff 193: all'
      tags:
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:lemay-curtis-e
    section: '196212'
- add:
    entry:
      id: cal.1962-12-10.europe-and-the-alliance-2
      when: Dec. 10–11
      date: '1962-12-10'
      thread: europe-and-the-alliance
      c: 'The NATO Military Committee hears Taylor and Norstad on medium-range missiles. Taylor: no "foot-dragging or ill
        will," but "real doubt as to the best way to target this particular threat." The Committee finds it never "clearly"
        endorsed Norstad''s requirement; the Standing Group to recommend.'
      n: '[[w.poole-joint-chiefs-of-staff]], 200. Names: Taylor, Norstad.'
      src:
        c: e3870e9e
        rows:
        - 'w.poole-joint-chiefs-of-staff 200: all'
      tags:
      - name:taylor-maxwell
      - name:norstad-lauris
    section: '196212'
- add:
    entry:
      id: cal.1962-12-14.europe-and-the-alliance
      when: Dec. 14
      date: '1962-12-14'
      thread: europe-and-the-alliance
      c: 'McNamara to the NATO Defense Ministers: the nuclear forces neutralized each other in the missile crisis, conventional
        superiority in the Caribbean decisive; sixty divisions could conduct "extensive forward operations"; the allies''
        deficiencies $8.5 billion over five years. "We have a superior nuclear shield and we must forge an effective non-nuclear
        sword." No direct reply, by Rusk''s report.'
      n: '[[w.poole-joint-chiefs-of-staff]], 193–94. Names: McNamara, Rusk.'
      src:
        c: 82d04a0b
        rows:
        - 'w.poole-joint-chiefs-of-staff 193–94: all'
      tags:
      - name:mcnamara-robert-s
      - name:rusk-dean
    section: '196212'
- add:
    entry:
      id: cal.1962-12-16.europe-and-the-alliance
      when: Dec. 16
      date: '1962-12-16'
      thread: europe-and-the-alliance
      c: Kennedy confers with senior civilians on Skybolt, its cancellation announced the day before. He approves "for planning
        purposes" Polaris components for Britain, on condition the fleet goes to a NATO multilateral force and British conventional
        strength rises.
      n: '[[w.poole-joint-chiefs-of-staff]], 201. See [[cal.1962-12-11.europe-and-the-alliance]]. Names: Kennedy.'
      src:
        c: 9cc3563b
        rows:
        - 'w.poole-joint-chiefs-of-staff 201: all'
      tags:
      - name:kennedy-john-f
    section: '196212'
- add:
    entry:
      id: cal.1963-01-02.europe-and-the-alliance
      when: Jan. 2
      date: '1963-01-02'
      thread: europe-and-the-alliance
      c: Norstad leaves the Supreme Allied Command, Europe, his departure delayed by the missile crisis; Lemnitzer succeeds
        him. Told in July that his health made retirement necessary, he tells colleagues he was fired.
      n: '[[w.poole-joint-chiefs-of-staff]], 202. Check: the year; the page prints 1962. Names: Norstad, Lemnitzer.'
      src:
        c: 29e5e806
        rows:
        - 'w.poole-joint-chiefs-of-staff 202: all'
      tags:
      - name:norstad-lauris
      - name:lemnitzer-lyman-l
    section: '196301'
- cite:
    id: cal.1961-12-13.europe-and-the-alliance
    item: '[[w.poole-joint-chiefs-of-staff]], 191 (the meeting at Paris)'
    units: A
- check:
    id: cal.1961-12-13.europe-and-the-alliance
    text: 'Check: Poole, 191, has McNamara address the Council three days after the meeting opened, Dec. 11: Dec. 14.'
- cite:
    id: cal.1962-11-07.europe-and-the-alliance
    item: '[[w.poole-joint-chiefs-of-staff]], 201 (McNamara advises Kennedy to cancel Skybolt)'
    units: A
- cite:
    id: cal.1961-10-20.berlin-and-vienna
    item: '[[w.poole-joint-chiefs-of-staff]], 156'
    units: A, B
- check:
    id: cal.1962-05-04.europe-and-the-alliance
    text: 'Check: Poole, 198, dates Kennedys approval of States "Suggested NATO Nuclear Program" Apr. 16; NSAM 147 is of Apr.
      18.'
- add:
    entry:
      id: cal.1963-01-10.europe-and-the-alliance
      when: Jan. 10
      date: '1963-01-10'
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs to McNamara on carrying out Nassau: requirements beyond SACEUR''s capability best met by American-based
        forces; any multilateral force "in the simplest possible way," some twenty B-47s, as many Vulcans and Polaris submarines
        in the Mediterranean, under a commander reporting to SACEUR. Later, against the steering group''s larger first assignment
        and any tactical nuclear forces.'
      n: '[[w.poole-joint-chiefs-of-staff]], 203. See [[cal.1962-12-18.europe-and-the-alliance]]. Names: McNamara.'
      src:
        c: b91fae8e
        rows:
        - 'w.poole-joint-chiefs-of-staff 203: all'
      tags:
      - name:mcnamara-robert-s
    section: '196301'
- add:
    entry:
      id: cal.1963-04-30.europe-and-the-alliance
      when: Apr. 30
      date: '1963-04-30'
      thread: europe-and-the-alliance
      c: Adenauer accepts Kennedy's proposal of a multilateral force, the control arrangements and the exclusion of submarines
        open to later review. Ricketts leads a technical mission.
      n: '[[w.poole-joint-chiefs-of-staff]], 204. Names: Adenauer, Kennedy.'
      src:
        c: 9eddc8ce
        rows:
        - 'w.poole-joint-chiefs-of-staff 204: all'
      tags:
      - name:adenauer-konrad
      - name:kennedy-john-f
    section: '196304'
- add:
    entry:
      id: cal.1963-05-01.europe-and-the-alliance
      when: May 1
      date: '1963-05-01'
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs, Taylor away at CENTO, tentatively: neither the advisability nor inadvisability of the multilateral
        force "clearly substantiated." May 2, with McNamara and Gilpatric, a memorandum the civilians read as endorsement:
        no military need, but "feasible" and "a militarily effective and useful augmentation of NATO nuclear strength," given
        the allies'' full support.'
      n: '[[w.poole-joint-chiefs-of-staff]], 204–05. Names: Taylor, McNamara, Gilpatric.'
      src:
        c: 624b3f14
        rows:
        - 'w.poole-joint-chiefs-of-staff 204–05: all'
      tags:
      - name:taylor-maxwell
      - name:mcnamara-robert-s
      - name:gilpatric-roswell-l
    section: '196305'
- add:
    entry:
      id: cal.1963-05-24.europe-and-the-alliance
      when: May 24
      date: '1963-05-24'
      thread: europe-and-the-alliance
      c: Ottawa. The North Atlantic Council assigns SACEUR the British bomber force and three Polaris submarines, gives him
        a Nuclear Deputy, and arranges allied officers in operational planning at SAC's headquarters at Omaha, McNamara having
        overridden the Joint Chiefs.
      n: '[[w.poole-joint-chiefs-of-staff]], 205. Names: McNamara.'
      src:
        c: 0d29d289
        rows:
        - 'w.poole-joint-chiefs-of-staff 205: all'
      tags:
      - name:mcnamara-robert-s
    section: '196305'
- add:
    entry:
      id: cal.1963-06.europe-and-the-alliance
      when: June, mid-month
      date: 1963-06
      thread: europe-and-the-alliance
      c: 'Bundy to Kennedy, against pressing the multilateral force: the French more hostile, London and Bonn charged with
        subservience, Moscow''s "militaristic maneuver"; Congress only at the cost of the President''s capital. Keep the conviction
        "that this force will work," take away "any sense of a deadline."'
      n: '[[w.poole-joint-chiefs-of-staff]], 205. Names: Bundy, Kennedy.'
      src:
        c: c9bdbfb1
        rows:
        - 'w.poole-joint-chiefs-of-staff 205: all'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-john-f
    section: '196306'
- add:
    entry:
      id: cal.1963-07.europe-and-the-alliance
      when: July
      date: 1963-07
      thread: europe-and-the-alliance
      c: Kennedy asks the Defense Department whether one mixed-manned ship could be run. Anderson's study, approved by the
        Joint Chiefs, finds it feasible, best in a Tartar destroyer.
      n: '[[w.poole-joint-chiefs-of-staff]], 205. Names: Kennedy, Anderson.'
      src:
        c: 17373f6b
        rows:
        - 'w.poole-joint-chiefs-of-staff 205: all'
      tags:
      - name:kennedy-john-f
      - name:anderson-george-w-jr
    section: '196307'
- add:
    entry:
      id: cal.1963-08-30.europe-and-the-alliance
      when: Aug. 30
      date: '1963-08-30'
      thread: europe-and-the-alliance
      c: Kennedy authorizes diplomatic approaches for a mixed-manned ship. By the year's end Germany, Greece, Italy, Turkey
        and Britain agree to take part. The USS Biddle, later Claude V. Ricketts, sails mixed-manned from August 1964 for
        eighteen months.
      n: '[[w.poole-joint-chiefs-of-staff]], 205–06. See [[cal.1963-07.europe-and-the-alliance]]. Names: Kennedy.'
      src:
        c: faab2106
        rows:
        - 'w.poole-joint-chiefs-of-staff 205–06: all'
      tags:
      - name:kennedy-john-f
    section: '196308'
- add:
    entry:
      id: cal.1964-12-05.europe-and-the-alliance
      when: Dec. 5–6
      date: '1964-12-05'
      thread: europe-and-the-alliance
      c: 'Johnson reviews the multilateral force with his senior civilians, no Chief present, Wilson about to arrive. Johnson:
        "Aren''t you telling me to kick mother England out the door into the cold, while I bring the Kaiser into the sitting
        room?" Acheson: the old dame "swaying in the gutter, drinking her gin." Johnson: "one cannot push a thing if everyone''s
        against it."'
      n: '[[w.poole-joint-chiefs-of-staff]], 206. See [[cal.1964-12-07.europe-and-the-alliance]]. Names: Johnson, Acheson,
        Wilson.'
      src:
        c: 4c66b4ae
        rows:
        - 'w.poole-joint-chiefs-of-staff 206: all'
      tags:
      - name:johnson-lyndon-b
      - name:acheson-dean-g
      - name:wilson-harold
    section: '196412'
- add:
    entry:
      id: cal.1964-12-09.europe-and-the-alliance
      when: Dec. 9
      date: '1964-12-09'
      thread: europe-and-the-alliance
      c: 'Johnson to Wilson, the talks ended: he has shown "great restraint," but Washington has not retreated from its objective.
        Wilson: Her Majesty''s Government "reserved its position" on the surface fleet.'
      n: '[[w.poole-joint-chiefs-of-staff]], 206–07. See [[cal.1964-12-07.europe-and-the-alliance]]. Names: Johnson, Wilson.'
      src:
        c: fa4c5f20
        rows:
        - 'w.poole-joint-chiefs-of-staff 206–07: all'
      tags:
      - name:johnson-lyndon-b
      - name:wilson-harold
    section: '196412'
- add:
    entry:
      id: cal.1964-12-15.europe-and-the-alliance
      when: Dec. 15–17
      date: '1964-12-15'
      thread: europe-and-the-alliance
      c: The North Atlantic Council discusses the Atlantic Nuclear Force and the multilateral force. Wheeler to the Service
        Chiefs after; little support for the MLF, a widespread fear of West Germany getting nuclear weapons.
      n: '[[w.poole-joint-chiefs-of-staff]], 207. Names: Wheeler.'
      src:
        c: 2365017f
        rows:
        - 'w.poole-joint-chiefs-of-staff 207: all'
      tags:
      - name:wheeler-earle
    section: '196412'
- add:
    entry:
      id: cal.1963-04.europe-and-the-alliance
      when: Apr.
      date: 1963-04
      thread: europe-and-the-alliance
      c: 'Anglo-American talks on strategy. Taylor: the British want "a poor man''s forward strategy." Mountbatten recalls
        Kennedy''s remark that NATO could cut ten divisions but for Berlin. McNamara and Taylor put the enemy at 60 divisions
        in thirty days, the British at 91 in ten and 50 more by D+30. Studies agreed of tactical nuclear weapons, 30 days''
        supply, no MRBMs or reserve divisions.'
      n: '[[w.poole-joint-chiefs-of-staff]], 207–08. Names: Taylor, McNamara, Kennedy, Thorneycroft.'
      src:
        c: 0629b141
        rows:
        - 'w.poole-joint-chiefs-of-staff 207–08: all'
      tags:
      - name:taylor-maxwell
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      - name:thorneycroft-peter
    section: '196304'
- add:
    entry:
      id: cal.1963-04.europe-and-the-alliance-2
      when: Apr., late
      date: 1963-04
      thread: europe-and-the-alliance
      c: 'Kennedy asks the Defense Department to compare American and allied preparedness. OSD''s draft: Seventh Army alone
        fully equipped, 90 to 120 days of supply against the allies'' 15 to 30; urge the allies or cut Seventh Army to their
        level. Taylor: that would "abandon virtue because it is forced to live among sinners." The Chiefs'' revision: keep
        American forces as they are.'
      n: '[[w.poole-joint-chiefs-of-staff]], 208–09. Names: Kennedy, Taylor.'
      src:
        c: e7382a96
        rows:
        - 'w.poole-joint-chiefs-of-staff 208–09: all'
      tags:
      - name:kennedy-john-f
      - name:taylor-maxwell
    section: '196304'
- add:
    entry:
      id: cal.1963-06-03.europe-and-the-alliance
      when: June 3
      date: '1963-06-03'
      thread: europe-and-the-alliance
      c: 'McNamara to Kennedy: continued allied failure to build conventional strength must mean a realignment of American
        forces, but nothing this year; persuade the allies first. To Taylor: the advice "virtually the one you transmitted
        to me."'
      n: '[[w.poole-joint-chiefs-of-staff]], 209. See [[cal.1963-04.europe-and-the-alliance-2]]. Names: McNamara, Kennedy,
        Taylor.'
      src:
        c: e72d5d26
        rows:
        - 'w.poole-joint-chiefs-of-staff 209: all'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      - name:taylor-maxwell
    section: '196306'
- add:
    entry:
      id: cal.1963-07-16.europe-and-the-alliance
      when: July 16
      date: '1963-07-16'
      thread: europe-and-the-alliance
      c: 'Kennedy approves McNamara''s recommendations, with the Joint Chiefs'' caveats, to cut $300 to $400 million from
        overseas spending by December 1964: 23 B-47s and 32 C-130s home, four air bases consolidated, Army stocks and facilities
        reduced.'
      n: '[[w.poole-joint-chiefs-of-staff]], 209–10. See [[cal.1963-07-16.japan]]. Names: Kennedy, McNamara.'
      src:
        c: 6444dfa9
        rows:
        - 'w.poole-joint-chiefs-of-staff 209–10: all'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
    section: '196307'
- add:
    entry:
      id: cal.1963-09-03.europe-and-the-alliance
      when: Sept. 3
      date: '1963-09-03'
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs answer Gilpatric on NATO''s force goals for 1970: the allies'' failures "the practice rather than
        the exception"; lower standards would lower their aims more; pulling American troops out would "markedly degrade NATO''s
        military posture."'
      n: '[[w.poole-joint-chiefs-of-staff]], 209. Names: Gilpatric.'
      src:
        c: b7c9e0fe
        rows:
        - 'w.poole-joint-chiefs-of-staff 209: all'
      tags:
      - name:gilpatric-roswell-l
    section: '196309'
- add:
    entry:
      id: cal.1963-09.europe-and-the-alliance
      when: Sept.
      date: 1963-09
      thread: europe-and-the-alliance
      c: 'McNamara proposes much larger withdrawals from Europe: all 80 B-47s from Britain and Spain; twelve fighter squadrons
        from France, Germany and Britain, tactical aircraft from 790 to 354; 30,000 Army support troops. The Joint Chiefs
        strongly object: Seventh Army left with "no sustained combat capability"; a division withdrawn "less unfavorable."
        State would bring home only the B-47s.'
      n: '[[w.poole-joint-chiefs-of-staff]], 210. Names: McNamara.'
      src:
        c: 7686c176
        rows:
        - 'w.poole-joint-chiefs-of-staff 210: all'
      tags:
      - name:mcnamara-robert-s
    section: '196309'
- add:
    entry:
      id: cal.1963-07-31.europe-and-the-alliance
      when: July 31
      date: '1963-07-31'
      thread: europe-and-the-alliance
      c: 'Taylor and McNamara with their German counterparts on strategy. Taylor: the only difference may be how much conventional
        combat before an attack is called "serious."'
      n: '[[w.poole-joint-chiefs-of-staff]], 211. Names: Taylor, McNamara.'
      src:
        c: ecd36518
        rows:
        - 'w.poole-joint-chiefs-of-staff 211: all'
      tags:
      - name:taylor-maxwell
