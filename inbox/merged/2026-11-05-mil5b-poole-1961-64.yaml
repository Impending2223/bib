      when: Dec.
      date: 1961-12
      thread: latin-america
      c: 'A team from Defense, Caribbean Command, State, AID, the FBI and the CIA tours South America at Kennedy''s urging:
        still time for corrective action, Colombia and Bolivia most urgent, then Peru and Ecuador; internal security first,
        civic action second; the whole military program to be revised. The Joint Chiefs oppose a wholesale revision.'
      n: '[[w.poole-joint-chiefs-of-staff]], 228–29. Check: the month; Poole: "Late in 1961." Names: Kennedy.'
