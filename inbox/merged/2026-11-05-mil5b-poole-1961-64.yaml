    entry:
      id: cal.1961-05.middle-east-dimona
      when: May
      date: 1961-05
      thread: middle-east-dimona
      c: 'A study of the Joint Chiefs: an Israeli nuclear capability "would have a definite and serious impact on US policies
        toward the Middle East and possibly toward France"; convince Israel and France "by all feasible means" against it.'
      n: '[[w.poole-joint-chiefs-of-staff]], 241. Check: the month; Poole: "Soon afterward," after the tour of April.'
