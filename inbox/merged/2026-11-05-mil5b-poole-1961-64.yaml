      when: Jan.
      date: 1964-01
      thread: middle-east-dimona
      c: 'An American team inspects Dimona, almost a month after the reactor went critical: "no immediate weapons making capability."'
      n: '[[w.poole-joint-chiefs-of-staff]], 241. See [[cal.1963-08-19.middle-east-dimona]].'
