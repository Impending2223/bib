- add:
    entry:
      id: cal.1964-12-16.europe-and-the-alliance
      when: Dec. 16
      date: '1964-12-16'
      thread: europe-and-the-alliance
      c: 'McNamara to the NATO ministers: the likeliest causes of war unpremeditated collisions out of political confrontations;
        the "intermediate options" of OSD''s draft and the caveats of his October paper.'
      n: '[[w.poole-joint-chiefs-of-staff]], 214. See [[cal.1964-10-01.europe-and-the-alliance]]. Names: McNamara.'
