- add:
    entry:
      id: cal.1964-04.europe-and-the-alliance
      when: Apr.
      date: 1964-04
      thread: europe-and-the-alliance
      c: Johnson decides the Berlin "roundout" units come home; American forces in Germany still several thousand above the
        231,000 of early 1961. In August Rusk advises against discussing the Air Force's plan to dual-base ten squadrons.
      n: '[[w.poole-joint-chiefs-of-staff]], 211. See [[cal.1963-10-24.europe-and-the-alliance]]. Names: Johnson, Rusk.'
      src:
        c: 833d092f
        rows:
        - 'w.poole-joint-chiefs-of-staff 211: all'
