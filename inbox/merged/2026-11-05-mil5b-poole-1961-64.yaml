      when: May
      date: 1961-05
      thread: africa
      c: 'State''s draft guidance on arms for Africa south of the Sahara: meet legitimate requests "at least in part" on political
        grounds; "studiously refrain from any automatic matching of Soviet offers." ISA asks that the initiative be allowed
        and political behavior count.'
      n: '[[w.poole-joint-chiefs-of-staff]], 252.'
      src:
        c: 21e6ba37
        rows:
        - 'w.poole-joint-chiefs-of-staff 252: all'
