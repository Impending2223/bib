      when: May
      date: 1962-05
      thread: middle-east
      c: Peres, Israel's Deputy Defense Minister, in Washington; Soviet MiG-21s and Tu-16s for Egypt an imbalance; the Hawk
        again requested. State and ISA ask the Joint Chiefs to assess Israel's vulnerability to air attack.
      n: '[[w.poole-joint-chiefs-of-staff]], 238. See [[cal.1962-07-12.middle-east]].'
