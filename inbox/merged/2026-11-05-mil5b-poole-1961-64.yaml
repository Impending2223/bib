      when: Mar. 14
      date: '1962-03-14'
      thread: latin-america
      c: 'A message to the commanders in chief, Atlantic and Caribbean, on civic action and military information and education
        programs. CINCARIB: the conscripts illiterate, written materials useless.'
      n: '[[w.poole-joint-chiefs-of-staff]], 229. See [[cal.1962-02.latin-america-2]].'
      src:
        c: 0c8dda02
        rows:
