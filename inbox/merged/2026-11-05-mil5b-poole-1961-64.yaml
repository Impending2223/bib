      - name:gilpatric-roswell-l
    section: '196204'
- add:
    entry:
      id: cal.1962-05.latin-america
      when: May
      date: 1962-05
      thread: latin-america
      c: State's "Guidelines for Policy and Operations in Latin America" issued as administration policy; Defense gets all
        it asked but a strategic appraisal.
      n: '[[w.poole-joint-chiefs-of-staff]], 227. See [[cal.1961-10.latin-america]].'
      src:
        c: 8e3ab632
        rows:
        - 'w.poole-joint-chiefs-of-staff 227: all'
    section: '196205'
- add:
    entry:
      id: cal.1962-09.latin-america
      when: Sept.
      date: 1962-09
      thread: latin-america
      c: 'McNamara and Lemnitzer at the Canal Zone with O''Meara, CINCARIB, Krulak and Wood. O''Meara: Congress''s $57.5 million
        ceiling on Latin American military aid the chief problem; the Latin officers will not give up their hold. McNamara
        agrees to consider some $2 million of civic action projects in six countries; approved later, $3.417 million from
        Defense, $1.2 million from AID.'
      n: '[[w.poole-joint-chiefs-of-staff]], 229–30. Names: McNamara, Lemnitzer, Krulak.'
      src:
        c: 5766a32f
        rows:
        - 'w.poole-joint-chiefs-of-staff 229–30: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
      - name:krulak-victor-h
    section: '196209'
- add:
    entry:
      id: cal.1964-12.latin-america
      when: Dec.
      date: 1964-12
      thread: latin-america
      c: 'Bundy has the Defense Department draft a new strategy toward the Latin military. ISA: grant aid phased out for sales
        and "project aid"; hemispheric defense implicitly invalid. The Joint Chiefs: "it is communist inspiration, sponsorship,
        and direction of this upheaval that poses the greatest threat"; no sizeable shift from grants soon.'
      n: '[[w.poole-joint-chiefs-of-staff]], 230. Check: the month; Poole: "Late in 1964." Names: Bundy.'
      src:
        c: 5d7b6d42
        rows:
        - 'w.poole-joint-chiefs-of-staff 230: all'
      tags:
      - name:bundy-mcgeorge
    section: '196412'
- add:
    entry:
      id: cal.1965-06.latin-america
      when: June
      date: 1965-06
      thread: latin-america
      c: 'McNamara sends Bundy a revised study on the Latin military: grant aid ended by fiscal 1971 but for $15 to $20 million
        a year in training. State urges indefinite delay; McNamara proceeds "without a rigid time frame."'
      n: '[[w.poole-joint-chiefs-of-staff]], 230–31. See [[cal.1964-12.latin-america]]. Names: McNamara, Bundy.'
      src:
        c: 3834eaca
        rows:
        - 'w.poole-joint-chiefs-of-staff 230–31: all'
      tags:
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
