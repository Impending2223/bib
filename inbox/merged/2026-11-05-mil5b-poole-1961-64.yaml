    section: '196009'
- add:
    entry:
      id: cal.1961-01.middle-east
      when: Jan.
      date: 1961-01
      thread: middle-east
      c: 'The Joint Chiefs on Iran: any regime replacing the Shah "would be less Western-oriented"; support him "by all appropriate
        means," but plan for a pro-Western successor and for "the numerous and varied possibilities of political crisis."'
      n: '[[w.poole-joint-chiefs-of-staff]], 245.'
      src:
        c: cd53cfdb
        rows:
        - 'w.poole-joint-chiefs-of-staff 245: all'
    section: '196101'
- add:
    entry:
      id: cal.1961-05-15.middle-east
      when: May 15
      date: '1961-05-15'
      thread: middle-east
      c: 'The President''s task force on Iran reports: "the continuing trend toward revolution and chaos in Iran has reached
        the point where the US must take vigorous action."'
      n: '[[w.poole-joint-chiefs-of-staff]], 245. The decision: [[cal.1961-05-19.middle-east]].'
      src:
        c: a828bdc0
        rows:
        - 'w.poole-joint-chiefs-of-staff 245: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-10-07.middle-east
      when: Oct. 7
      date: '1961-10-07'
      thread: middle-east
      c: 'Gilpatric asks the Joint Chiefs whether the United States could fight a limited war confined to Iran, Kennedy concerned
        at Soviet pressure there amid Berlin. Their answer: two divisions and two battle groups at most in the northeast;
        no stopping a determined Soviet incursion without attacks on Soviet air bases, conventional or nuclear.'
      n: '[[w.poole-joint-chiefs-of-staff]], 246. Names: Gilpatric, Kennedy.'
      src:
        c: e668d54a
        rows:
        - 'w.poole-joint-chiefs-of-staff 246: all'
      tags:
      - name:gilpatric-roswell-l
      - name:kennedy-john-f
    section: '196110'
- add:
    entry:
      id: cal.1964-01.middle-east
      when: Jan.
      date: 1964-01
      thread: middle-east
      c: 'The Shah opens negotiations for more arms, M-60 tanks and Sheridans to replace 414 M-47s. The Joint Chiefs: "military
        justification" for modern armor; M-60s if production expands, no Sheridan, still untested.'
      n: '[[w.poole-joint-chiefs-of-staff]], 246–47. See [[cal.1964-07-04.middle-east]].'
      src:
        c: 906bdee3
        rows:
        - 'w.poole-joint-chiefs-of-staff 246–47: all'
    section: '196401'
- add:
    entry:
      id: cal.1961-03.middle-east
      when: Mar., mid-month
      date: 1961-03
      thread: middle-east
      c: The Director of the Joint Staff recommends the Joint Chiefs again urge that the United States formally join CENTO,
        with a command structure, a Supreme Commander and plans for tactical nuclear support; at least, a small permanent
        staff and regular commanders' meetings.
      n: '[[w.poole-joint-chiefs-of-staff]], 247.'
      src:
        c: 45cff6bd
        rows:
        - 'w.poole-joint-chiefs-of-staff 247: all'
    section: '196103'
- add:
    entry:
      id: cal.1961-03.middle-east-2
      when: Mar., late
      date: 1961-03
      thread: middle-east
      c: CENTO's Council of Ministers approves "Basic Assumptions for Global War"; its planners confined to general nuclear
        war. Limited war assumptions to follow, on Pakistan's proposal; never agreed.
      n: '[[w.poole-joint-chiefs-of-staff]], 247–48.'
      src:
        c: 858da323
        rows:
        - 'w.poole-joint-chiefs-of-staff 247–48: all'
    section: '196103'
