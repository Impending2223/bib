      - name:decker-george-h
      - name:anderson-george-w-jr
      - name:lemay-curtis-e
      - name:shoup-david-m
    section: '196109'
- add:
    entry:
      id: cal.1962-03-05.cuba
      when: Mar. 5
      date: '1962-03-05'
      thread: cuba
      c: 'Lansdale asks Craig of the Joint Staff for "a brief but precise description of pretexts which the JCS believes is
        desirable for direct military intervention." The Joint Staff''s list: attacks and sabotage at Guantánamo, an unmanned
        ship blown up, faked assassination attempts and bombings in Florida and Washington, a drone airliner "downed" over
        Cuba; no actual killing.'
      n: '[[w.poole-joint-chiefs-of-staff]], 160. See [[cal.1962-03-13.cuba]]. Names: Lansdale.'
      src:
        c: d7636962
        rows:
        - 'w.poole-joint-chiefs-of-staff 160: all'
      tags:
      - name:lansdale-edward-g
    section: '196203'
- add:
    entry:
      id: cal.1962-03-16.cuba
      when: Mar. 16
      date: '1962-03-16'
      thread: cuba
      c: 'Kennedy to the Special Group: no circumstances in the near future "that would justify and make desirable the use
        of American forces for overt military action"; to Lemnitzer, the four divisions for Cuba perhaps not to be spared
        from Berlin. Robert Kennedy to Lansdale''s staff days later: "The President is prepared to do whatever has to be done."'
      n: '[[w.poole-joint-chiefs-of-staff]], 160. Names: Kennedy, Lemnitzer, Robert Kennedy, Lansdale.'
      src:
        c: 5f0ca512
        rows:
        - 'w.poole-joint-chiefs-of-staff 160: all'
      tags:
      - name:kennedy-john-f
      - name:lemnitzer-lyman-l
      - name:kennedy-robert-f
      - name:lansdale-edward-g
    section: '196203'
- add:
    entry:
      id: cal.1962-04-05.cuba-2
      when: Apr. 5
      date: '1962-04-05'
      thread: cuba
      c: 'The Special Group: time to re-examine Mongoose''s "basic philosophy with particular reference to the possibility
        of finding a pretext for early ... intervention." Taylor asks the Service Chiefs: should the United States invade
        Cuba, and can it?'
      n: '[[w.poole-joint-chiefs-of-staff]], 161. Names: Taylor.'
      src:
        c: 8c9143e6
        rows:
        - 'w.poole-joint-chiefs-of-staff 161: all'
      tags:
      - name:taylor-maxwell
    section: '196204'
- add:
    entry:
      id: cal.1962-04-10.cuba-2
      when: Apr. 10
      date: '1962-04-10'
      thread: cuba
      c: 'The Joint Chiefs answer yes to both: the Cuban problem "must be solved in the near future," invasion the only way,
        "as soon as possible," before the Berlin reservists go home; no risk of general war, by the Board of National Estimates''
        new study.'
      n: '[[w.poole-joint-chiefs-of-staff]], 161. See [[cal.1962-04-05.cuba-2]].'
      src:
        c: 9a1b143b
        rows:
        - 'w.poole-joint-chiefs-of-staff 161: all'
    section: '196204'
- add:
    entry:
      id: cal.1962-04-11.cuba-2
      when: Apr. 11
      date: '1962-04-11'
      thread: cuba
      c: 'The Special Group. Rusk and McNamara: "at this time" no way to justify an invasion; "play for the breaks."'
      n: '[[w.poole-joint-chiefs-of-staff]], 161. See [[cal.1962-04-10.cuba-2]]. Names: Rusk, McNamara.'
      src:
        c: 2ec80315
        rows:
        - 'w.poole-joint-chiefs-of-staff 161: all'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
    section: '196204'
- add:
    entry:
      id: cal.1962-10-18.missile-crisis-8
      when: Oct. 18
      date: '1962-10-18'
      thread: missile-crisis
      c: '2 p.m., the Joint Chiefs. Taylor: the President would hold back until the Soviet response is sensed; the likely
        order a political approach, a warning, air attack on the sites, blockade, invasion if need be. LeMay: "Were we really
        going to do anything except talk?" A battalion of the 5th Marine Expeditionary Brigade to be airlifted from California
        to Guantánamo, Opa-locka, Fla., reopened, twenty interceptors to Florida. Air strike Oct. 21 at the earliest, Oct.
        23 the best; invasion Oct. 28.'
      n: '[[w.poole-joint-chiefs-of-staff]], 169. Names: Taylor, LeMay.'
      src:
        c: e6767c4b
        rows:
        - 'w.poole-joint-chiefs-of-staff 169: all'
      tags:
      - name:taylor-maxwell
      - name:lemay-curtis-e
    section: '196210'
