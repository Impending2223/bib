- add:
    entry:
      id: cal.1961-02-25.foreign-aid
      when: Feb. 25
      date: '1961-02-25'
      thread: foreign-aid
      c: 'William Bundy, Deputy Assistant Secretary of Defense, urges Rusk and McNamara to support the original $2.4 billion
        military assistance program for fiscal 1962, Eisenhower having cut it to $1.8 billion: limited war and counterinsurgency
        first; prosperous allies to carry more; Greece, Turkey, South Korea and Taiwan to "compact" forces. Lemnitzer, for
        the Chiefs, endorses the figure, not yet the rationale.'
      n: '[[w.poole-joint-chiefs-of-staff]], 217–18. Names: William Bundy, Rusk, McNamara, Eisenhower, Lemnitzer.'
      src:
        c: 0d55ccef
        rows:
        - 'w.poole-joint-chiefs-of-staff 217–18: all'
      tags:
      - name:bundy-william
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:eisenhower-dwight-d
      - name:lemnitzer-lyman-l
    section: '196102'
- add:
    entry:
      id: cal.1961-12.foreign-aid
      when: Dec.
      date: 1961-12
      thread: foreign-aid
      c: 'The steering group on military aid to the six "forward countries," Greece, Turkey, Iran, Pakistan, South Korea and
        Taiwan, Kitchen of State chairman: the military danger "a less serious long-term threat" than failed development;
        aid to shift slowly to economic programs; South Korea''s forces from 600,000 to 350,000. William Bundy and the Joint
        Chiefs'' representative dissent; Nitze: "arrant nonsense."'
      n: '[[w.poole-joint-chiefs-of-staff]], 219. Names: William Bundy, Nitze.'
      src:
        c: 6770a4f0
        rows:
        - 'w.poole-joint-chiefs-of-staff 219: all'
      tags:
      - name:bundy-william
      - name:nitze-paul
    section: '196112'
- add:
    entry:
      id: cal.1961-12.foreign-aid-2
      when: Dec.
      date: 1961-12
      thread: foreign-aid
      c: 'Palmer, Director of Military Assistance, circulates the Basic Planning Document for fiscal 1964–68: $1.7 billion
        a year in new authority, deliveries averaging $1.9 billion. McNamara orders the undelivered balance of $2.9 billion
        cut to $1.9 billion by mid-1963; it stands at $2.421 billion then.'
      n: '[[w.poole-joint-chiefs-of-staff]], 221. Names: McNamara.'
      src:
        c: c192be0a
        rows:
        - 'w.poole-joint-chiefs-of-staff 221: all'
      tags:
      - name:mcnamara-robert-s
    section: '196112'
- add:
    entry:
      id: cal.1962-01-18.foreign-aid
      when: Jan. 18
      date: '1962-01-18'
      thread: foreign-aid
      c: 'After the NSC, Kennedy calls for another review of military aid: "we are likely ... only to get enough to accomplish
        a portion" of the objectives; the Joint Chiefs to reconsider, "recognizing that decreases in military aid would be
        compensated by increases in economic aid." They reaffirm their position: the trade "tenuous."'
      n: '[[w.poole-joint-chiefs-of-staff]], 219–20. See [[cal.1961-12.foreign-aid]]. Names: Kennedy.'
      src:
        c: 700bbabc
        rows:
        - 'w.poole-joint-chiefs-of-staff 219–20: all'
      tags:
      - name:kennedy-john-f
    section: '196201'
- add:
    entry:
      id: cal.1962-08.foreign-aid
      when: Aug., late
      date: 1962-08
      thread: foreign-aid
      c: 'OSD proposes to offset Southeast Asia''s costs by cutting military aid to Greece, Turkey, South Korea and Taiwan,
        less to Pakistan and the Philippines. The Joint Chiefs: the commanders asked $381.3 million for those countries''
        forces, OSD allows $187.5 million; AID''s programs funded with military aid dollars, "a double cutting edge."'
      n: '[[w.poole-joint-chiefs-of-staff]], 220.'
      src:
        c: 07570df9
        rows:
        - 'w.poole-joint-chiefs-of-staff 220: all'
    section: '196208'
- add:
    entry:
      id: cal.1962-09.foreign-aid
      when: Sept., mid-month
      date: 1962-09
      thread: foreign-aid
      c: 'OSD proposes more cuts in military aid. The Joint Chiefs to McNamara: "a vital need" to restate the program''s objectives;
        cut the neutrals, Indonesia, Burma, Cambodia, and NATO''s richer members, not only the seven forward countries.'
      n: '[[w.poole-joint-chiefs-of-staff]], 220. Names: McNamara.'
      src:
        c: c483b049
        rows:
        - 'w.poole-joint-chiefs-of-staff 220: all'
      tags:
      - name:mcnamara-robert-s
    section: '196209'
- add:
    entry:
      id: cal.1962-10-20.foreign-aid
      when: Oct. 20
      date: '1962-10-20'
      thread: foreign-aid
      c: 'OSD circulates its final adjustments of military aid: Taiwan from $169.8 to $94.5 million, South Korea from $254.2
        to $201.3 million, South Vietnam up from $158.4 to $176.7 million.'
      n: '[[w.poole-joint-chiefs-of-staff]], 220.'
      src:
        c: 2feb82ae
        rows:
        - 'w.poole-joint-chiefs-of-staff 220: all'
    section: '196210'
- add:
    entry:
      id: cal.1962-10-23.foreign-aid
      when: Oct. 23
      date: '1962-10-23'
      thread: foreign-aid
      c: 'Congress completes the fiscal 1963 appropriation for military assistance: $1.325 billion, against the $1.5 billion
        asked.'
      n: '[[w.poole-joint-chiefs-of-staff]], 220. Check: the day of final passage.'
      src:
        c: 86c2f1a5
        rows:
        - 'w.poole-joint-chiefs-of-staff 220: all'
    section: '196210'
- add:
    entry:
      id: cal.1963-03.foreign-aid
      when: Mar.
      date: 1963-03
      thread: foreign-aid
      c: 'After Taylor and Wood talk, an ad hoc group of ISA and the Joint Staff studies a larger role for the Joint Chiefs
        in military aid: coordination of all planning with strategic or operational bearing; detail in each change proposal;
        regular meetings; Annex J of the JSOP made more definite. The Chiefs approve, ISA endorses, by September.'
      n: '[[w.poole-joint-chiefs-of-staff]], 222. Names: Taylor.'
      src:
        c: 8e9b842e
        rows:
        - 'w.poole-joint-chiefs-of-staff 222: all'
      tags:
      - name:taylor-maxwell
    section: '196303'
- add:
    entry:
      id: cal.1963-09.foreign-aid
      when: Sept.
      date: 1963-09
      thread: foreign-aid
      c: 'Wood prepares and McNamara approves a military aid program of $1.05 billion for fiscal 1964, against $1.405 billion
        asked of Congress. Congress gives $1.0 billion in December, AID transferring $50 million: Greece, Turkey, Taiwan and
        South Korea cut by $34 to $58 million each, South Vietnam up $60 million.'
      n: '[[w.poole-joint-chiefs-of-staff]], 221–22. Names: McNamara.'
      src:
        c: ae670f5c
        rows:
        - 'w.poole-joint-chiefs-of-staff 221–22: all'
      tags:
      - name:mcnamara-robert-s
    section: '196309'
- add:
    entry:
      id: cal.1963-11.foreign-aid
      when: Nov., mid-month
      date: 1963-11
      thread: foreign-aid
      c: State, Defense and AID estimate $1.2 billion for military aid in fiscal 1965. William Bundy urges McNamara to back
        $1.389 billion, with "cut insurance."
      n: '[[w.poole-joint-chiefs-of-staff]], 222–23. Names: William Bundy, McNamara.'
      src:
        c: 7031a28f
        rows:
        - 'w.poole-joint-chiefs-of-staff 222–23: all'
      tags:
      - name:bundy-william
      - name:mcnamara-robert-s
    section: '196311'
- add:
    entry:
      id: cal.1963-12.foreign-aid
      when: Dec., early
      date: 1963-12
      thread: foreign-aid
      c: 'Johnson consults Russell: $1.2 billion the most Congress would approve for military aid. Johnson requests $1 billion,
        $1.16 billion with recoupments; ISA''s new categories, "forward defense" for eleven countries $745 million.'
      n: '[[w.poole-joint-chiefs-of-staff]], 223. Names: Johnson, Russell.'
      src:
        c: abbb5670
        rows:
        - 'w.poole-joint-chiefs-of-staff 223: all'
      tags:
      - name:johnson-lyndon-b
      - name:russell-richard-b
    section: '196312'
- add:
    entry:
      id: cal.1964-02.foreign-aid
      when: Feb.
      date: 1964-02
      thread: foreign-aid
      c: Wood suggests military aid stay at $1 billion a year through fiscal 1970, as much as Congress will approve. In April
        the Joint Chiefs ask priority for the forward defense countries, Greece and Turkey's forces in doubt.
      n: '[[w.poole-joint-chiefs-of-staff]], 223–24.'
      src:
        c: e4fd55bd
        rows:
        - 'w.poole-joint-chiefs-of-staff 223–24: all'
    section: '196402'
- add:
    entry:
      id: cal.1964-04.foreign-aid
      when: Apr.
      date: 1964-04
      thread: foreign-aid
      c: 'McNamara to Congress on military aid: "Anything less than $1 billion a year ... will inevitably require a reassessment
        of our entire policy of depending on indigenous forces." Taylor follows. Congress appropriates $1.055 billion for
        fiscal 1965, $55 million more for South Vietnam.'
      n: '[[w.poole-joint-chiefs-of-staff]], 223. Check: the day and the committee. Names: McNamara, Taylor.'
      src:
        c: 04a84458
        rows:
        - 'w.poole-joint-chiefs-of-staff 223: all'
      tags:
      - name:mcnamara-robert-s
      - name:taylor-maxwell
    section: '196404'
- add:
    entry:
      id: cal.1964-10.foreign-aid
      when: Oct.
      date: 1964-10
      thread: foreign-aid
      c: 'William Bundy warns McNamara of a $123 million shortfall in military aid, Southeast Asia''s increases; the cuts
        to fall on the forward defense countries. The Joint Chiefs: "serious political repercussions"; cut neutral India;
        seek a supplemental for "open hostilities."'
      n: '[[w.poole-joint-chiefs-of-staff]], 223. Names: William Bundy, McNamara.'
      src:
        c: 5f19d922
        rows:
        - 'w.poole-joint-chiefs-of-staff 223: all'
      tags:
      - name:bundy-william
      - name:mcnamara-robert-s
    section: '196410'
- cite:
    id: cal.1961-03-22.foreign-aid
    item: '[[w.poole-joint-chiefs-of-staff]], 218 ($1.6 billion for military assistance, to "more heavily emphasize the internal
      security, civil works and economic growth")'
    units: A
- cite:
    id: cal.1963-03-24.foreign-aid
    item: '[[w.poole-joint-chiefs-of-staff]], 221 (the Clay committee: military aid down to $1 billion "in a few years")'
    units: A
- add:
    entry:
      id: cal.1961-01-26.latin-america
      when: Jan. 26
      date: '1961-01-26'
      thread: latin-america
      c: 'The Joint Chiefs to McNamara: "the time is now at hand for the United States to initiate political, economic and,
        as the ultimate, direct military measures to replace Trujillo"; Dominicans able to take over to be "actively sought
        out" and helped; if chaos follows, "whatever military support is required," up to "military occupation of the entire
        country."'
      n: '[[w.poole-joint-chiefs-of-staff]], 231. Names: McNamara, Trujillo.'
      src:
        c: 7fe288d3
        rows:
        - 'w.poole-joint-chiefs-of-staff 231: all'
      tags:
      - name:mcnamara-robert-s
      - name:trujillo-rafael
    section: '196101'
- add:
    entry:
      id: cal.1961-02.latin-america
      when: Feb.
      date: 1961-02
      thread: latin-america
      c: 'State proposes a new concept of hemispheric security: the United States "primary (though not exclusive) responsibility"
        for external defense, Latin forces for internal tasks; an Inter-American Police Force; partial disarmament for development.
        The Joint Chiefs: internal security yes, the rest unrealistic, the savings "relatively insignificant."'
      n: '[[w.poole-joint-chiefs-of-staff]], 225–26.'
      src:
        c: b23b47e8
        rows:
        - 'w.poole-joint-chiefs-of-staff 225–26: all'
    section: '196102'
- add:
    entry:
      id: cal.1961-05.latin-america
      when: May
      date: 1961-05
      thread: latin-america
      c: 'ISA, with Joint Staff and service officers, circulates a draft paper on hemispheric security: the greatest capability
        against the least likely threat, external attack; bilateral agreements to help against subversion; an Inter-American
        Security Force and Defense College; more military aid, internal security first. The Joint Chiefs ask for a strategic
        appraisal and against the bilateral agreements. Not sent to the NSC.'
      n: '[[w.poole-joint-chiefs-of-staff]], 226–27.'
      src:
        c: 1d6d58f0
        rows:
        - 'w.poole-joint-chiefs-of-staff 226–27: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-05.latin-america-2
      when: May
      date: 1961-05
      thread: latin-america
      c: 'Kennedy asks how effective Chile''s police are and what would bolster them. The Joint Chiefs: programs adequate;
        more in-country training and materiel.'
      n: '[[w.poole-joint-chiefs-of-staff]], 227. Names: Kennedy.'
      src:
        c: 556d03ac
        rows:
        - 'w.poole-joint-chiefs-of-staff 227: all'
      tags:
      - name:kennedy-john-f
    section: '196105'
- add:
    entry:
      id: cal.1961-05-31.latin-america-3
      when: May 31
      date: '1961-05-31'
      thread: latin-america
      c: The Defense Department orders seven warships and transports with 1,000 Marines to assemble off Ciudad Trujillo, for
        fear Ramfis Trujillo will take power.
      n: '[[w.poole-joint-chiefs-of-staff]], 231. See [[cal.1961-05-30.latin-america]].'
      src:
        c: f7c9bfdd
        rows:
        - 'w.poole-joint-chiefs-of-staff 231: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-06-04.latin-america
      when: June 4
      date: '1961-06-04'
      thread: latin-america
      c: Russell, Vice Chief of Naval Operations, recommends sending the cruiser Northampton into Ciudad Trujillo's harbor
        and the task force within plain view, and telling Balaguer of intervention with "overwhelming forces" at the first
        pro-Castro sign. Johnson, McNamara and U. Alexis Johnson decide against.
      n: '[[w.poole-joint-chiefs-of-staff]], 231. Check: the day of the decision. See [[cal.1961-06-01.latin-america]]. Names:
        Balaguer, Lyndon Johnson, McNamara, U. Alexis Johnson.'
      src:
        c: 5bbc45c8
        rows:
        - 'w.poole-joint-chiefs-of-staff 231: all'
      tags:
      - name:balaguer-joaquin-videla
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:johnson-u-alexis
    section: '196106'
- add:
    entry:
      id: cal.1961-10.latin-america
      when: Oct.
      date: 1961-10
      thread: latin-america
      c: 'State circulates a draft of "Guidelines for Policy and Operations in Latin America": internal security first; inter-American
        police forces; dual-purpose units for civic action. The Joint Chiefs ask a strategic appraisal and no inter-American
        security force.'
      n: '[[w.poole-joint-chiefs-of-staff]], 227.'
      src:
        c: 6b554fcf
        rows:
        - 'w.poole-joint-chiefs-of-staff 227: all'
    section: '196110'
- add:
    entry:
      id: cal.1961-11-30.latin-america
      when: Nov. 30
      date: '1961-11-30'
      thread: latin-america
      c: 'The Joint Chiefs'' answer to Kennedy''s question to Decker at Fort Bragg, what more the military could do in Latin
        America, to the President: Congress''s limits on military aid for internal security eased; the Latin military to an
        apolitical role; counterinsurgency, antisubversion and psychological warfare expanded; resentment from "certain power
        groups" expected.'
      n: '[[w.poole-joint-chiefs-of-staff]], 227–28. See [[cal.1961-10-12.defense]]. Names: Kennedy, Decker.'
      src:
        c: fad11551
        rows:
        - 'w.poole-joint-chiefs-of-staff 227–28: all'
      tags:
      - name:kennedy-john-f
      - name:decker-george-h
    section: '196111'
- add:
    entry:
      id: cal.1961-12-05.latin-america
      when: Dec. 5
      date: '1961-12-05'
      thread: latin-america
      c: NSAM 118. Kennedy orders State to draft policy guidance and Defense to develop programs for military collaboration
        with Latin America.
