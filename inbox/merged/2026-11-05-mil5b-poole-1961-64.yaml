- add:
    entry:
      id: cal.1961-03.europe-and-the-alliance
      when: Mar., mid-month
      date: 1961-03
      thread: europe-and-the-alliance
      c: 'Acheson''s review group, Nitze for Defense, circulates its draft report on NATO: first priority to contingencies
        short of nuclear or massive non-nuclear attack, conventional strength enough to impose a pause. The Joint Chiefs:
        a conventional attack "highly improbable"; they cannot envisage 60 divisions held without nuclear weapons "for a period
        of possibly weeks."'
      n: '[[w.poole-joint-chiefs-of-staff]], 188. Names: Acheson, Nitze.'
      src:
        c: 6550a46f
        rows:
        - 'w.poole-joint-chiefs-of-staff 188: all'
      tags:
      - name:acheson-dean-g
      - name:nitze-paul
    section: '196103'
- add:
    entry:
      id: cal.1961-03.europe-and-the-alliance-2
      when: Mar., late
      date: 1961-03
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs, on the Acheson group''s final report, now a policy directive: "generally in accord," but "priority,"
        not "first priority," for the more likely contingencies; Norstad against "exclusive priorities." Against trading one
        Polaris submarine for Turkey''s fifteen Jupiters, $322 million of $388 million spent.'
      n: '[[w.poole-joint-chiefs-of-staff]], 188–89, 195. Approved: [[cal.1961-04-20.europe-and-the-alliance]]. Names: Acheson,
        Norstad.'
      src:
        c: cd585c3d
        rows:
        - 'w.poole-joint-chiefs-of-staff 188–89, 195: all'
      tags:
      - name:acheson-dean-g
      - name:norstad-lauris
    section: '196103'
- add:
    entry:
      id: cal.1961-04-26.europe-and-the-alliance
      when: Apr. 26
      date: '1961-04-26'
      thread: europe-and-the-alliance
      c: 'Finletter presents the new policy to the North Atlantic Council: "the US reaffirms its intention to commit five
        Polaris submarines to NATO," more to follow.'
      n: '[[w.poole-joint-chiefs-of-staff]], 189, 195–96. See [[cal.1961-04-20.europe-and-the-alliance]]. Names: Finletter.'
      src:
        c: 8d9dcf5c
        rows:
        - 'w.poole-joint-chiefs-of-staff 189, 195–96: all'
      tags:
      - name:finletter-thomas-k
    section: '196104'
- add:
    entry:
      id: cal.1961-05.europe-and-the-alliance
      when: May, late
      date: 1961-05
      thread: europe-and-the-alliance
      c: 'German officials to American: no "pause" unless the fighting stops; the Soviets must be made to show their intentions
        fast; MC-70''s goals too small to raise the threshold soon.'
      n: '[[w.poole-joint-chiefs-of-staff]], 189.'
      src:
        c: 416980ef
        rows:
        - 'w.poole-joint-chiefs-of-staff 189: all'
    section: '196105'
- add:
    entry:
      id: cal.1961-06.europe-and-the-alliance
      when: June
      date: 1961-06
      thread: europe-and-the-alliance
      c: Stikker, NATO's Secretary General, warns that the Council can make no progress until the United States amplifies
        Finletter's statement. McNamara has Lemnitzer form a working group under Rowny to propose the changes in NATO's policy
        and forces.
      n: '[[w.poole-joint-chiefs-of-staff]], 189. See [[cal.1961-04-26.europe-and-the-alliance]]. Names: Finletter, McNamara,
        Lemnitzer.'
      src:
        c: 53a268e7
        rows:
        - 'w.poole-joint-chiefs-of-staff 189: all'
      tags:
      - name:finletter-thomas-k
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
    section: '196106'
- add:
    entry:
      id: cal.1961-06.europe-and-the-alliance-2
      when: June, mid-month
      date: 1961-06
      thread: europe-and-the-alliance
      c: The Joint Chiefs back Norstad's case for a NATO force of 45 Jupiters and 450 mobile land-based missiles; again in
        late August. McNamara would delay an initiative.
      n: '[[w.poole-joint-chiefs-of-staff]], 196. Names: Norstad, McNamara.'
      src:
        c: a5a681d2
        rows:
        - 'w.poole-joint-chiefs-of-staff 196: all'
      tags:
      - name:norstad-lauris
      - name:mcnamara-robert-s
    section: '196106'
- add:
    entry:
      id: cal.1961-07.europe-and-the-alliance
      when: July, mid-month
      date: 1961-07
      thread: europe-and-the-alliance
      c: 'Rowny''s group, its preliminary findings: enemy strength exaggerated, 90 of 147 Soviet divisions at 70 to 85 percent,
        a division slice 26,000 men against NATO''s 35,000; some 55 divisions employable in Central Europe; 30½ ready and
        21 reserve divisions could defend conventionally for thirty days. Lemnitzer: excellent; Decker, Burke and LeMay demur.'
      n: '[[w.poole-joint-chiefs-of-staff]], 189–90. See [[cal.1961-06.europe-and-the-alliance]]. Names: Lemnitzer, Decker,
        Burke, LeMay.'
      src:
        c: ac8a160e
        rows:
        - 'w.poole-joint-chiefs-of-staff 189–90: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:decker-george-h
      - name:burke-arleigh-a
      - name:lemay-curtis-e
    section: '196107'
- add:
    entry:
      id: cal.1961-08.europe-and-the-alliance-jupiters
      when: Aug.
      date: 1961-08
      thread: europe-and-the-alliance-jupiters
      c: The Jupiters begin to be installed, in Italy and Turkey; done by March 1962.
      n: '[[w.poole-joint-chiefs-of-staff]], 195. Check: the day and the place of the first.'
      src:
        c: 8e3fa593
        rows:
        - 'w.poole-joint-chiefs-of-staff 195: all'
    section: '196108'
- add:
    entry:
      id: cal.1961-12.europe-and-the-alliance
      when: Dec., early
      date: 1961-12
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs, shown McNamara''s speech for the NATO ministers a week ahead: drop "superior" conventional forces,
        which he does; reduce, not "reduce or eliminate," Soviet tactical air superiority, which he refuses.'
      n: '[[w.poole-joint-chiefs-of-staff]], 190. Names: McNamara.'
      src:
        c: fbfab2c5
        rows:
        - 'w.poole-joint-chiefs-of-staff 190: all'
      tags:
      - name:mcnamara-robert-s
    section: '196112'
- add:
    entry:
      id: cal.1961-12-11.europe-and-the-alliance
      when: Dec. 11
      date: '1961-12-11'
      thread: europe-and-the-alliance
      c: 'Paris, the NATO ministerial meeting opens. Norstad to the Military Committee: Allied Command Europe nearly ready
        for a true forward strategy; the war plans'' withdrawal behind Hamburg, Augsburg and Munich could move up to the border.
        The Council approves MC-96, the force requirements for 1966. Lemnitzer to Kennedy: "more successful than any of the
        seven I have previously attended."'
      n: '[[w.poole-joint-chiefs-of-staff]], 191. Names: Norstad, Lemnitzer, Kennedy.'
      src:
        c: 7d4b2173
        rows:
        - 'w.poole-joint-chiefs-of-staff 191: all'
      tags:
      - name:norstad-lauris
      - name:lemnitzer-lyman-l
      - name:kennedy-john-f
    section: '196112'
- add:
    entry:
      id: cal.1961-12.europe-and-the-alliance-2
      when: Dec., late
      date: 1961-12
      thread: europe-and-the-alliance
      c: 'McNamara, after the Council, calls for studies of medium-range missile requirements. The Joint Chiefs: SACEUR''s
        position reasonable; aircraft and missiles at home no substitute. ISA: a multilaterally owned force would not stave
        off national ones.'
      n: '[[w.poole-joint-chiefs-of-staff]], 196. Names: McNamara.'
      src:
        c: 869cc002
        rows:
        - 'w.poole-joint-chiefs-of-staff 196: all'
      tags:
      - name:mcnamara-robert-s
    section: '196112'
- add:
    entry:
      id: cal.1962-03.europe-and-the-alliance
      when: Mar.
      date: 1962-03
      thread: europe-and-the-alliance
      c: 'Taylor, Military Representative of the President, tours the European capitals. Norstad: to present "our reoriented
        thinking" as new would bring its rejection. Taylor then proposes NATO review the forces a forward strategy needs;
        McNamara concurs.'
      n: '[[w.poole-joint-chiefs-of-staff]], 191. Names: Taylor, Norstad, McNamara.'
      src:
        c: 925ef7ca
        rows:
        - 'w.poole-joint-chiefs-of-staff 191: all'
      tags:
      - name:taylor-maxwell
      - name:norstad-lauris
      - name:mcnamara-robert-s
    section: '196203'
- add:
    entry:
      id: cal.1962-03-17.europe-and-the-alliance-france
      when: Mar. 17
      date: '1962-03-17'
      thread: europe-and-the-alliance-france
      c: 'The Joint Chiefs to McNamara: full French participation in NATO "essential"; talks on how much American help would
        buy closer French cooperation. Lemnitzer to Nitze: "NATO without France is essentially no NATO."'
      n: '[[w.poole-joint-chiefs-of-staff]], 197. Names: McNamara, Lemnitzer, Nitze.'
      src:
        c: 096961d1
        rows:
        - 'w.poole-joint-chiefs-of-staff 197: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
      - name:nitze-paul
    section: '196203'
