      id: cal.1962-02.middle-east
      when: Feb.
      date: 1962-02
      thread: middle-east
      c: 'State proposes guidelines on Arab-Israeli arms: watch the balance, no "major categories of arms" for Israel, "occasional
        sales of weapons and equipment of an essentially defensive nature." The Joint Chiefs endorse; ISA proposes "light
        weapons."'
      n: '[[w.poole-joint-chiefs-of-staff]], 238.'
