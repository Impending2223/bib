      when: Nov. 24
      date: '1961-11-24'
      thread: africa
      c: The General Assembly asks members to consider Africa a nuclear-free zone. The United States abstains, the moratorium
        unverified and uninspected.
      n: '[[w.poole-joint-chiefs-of-staff]], 252.'
      src:
        c: 33d51414
        rows:
        - 'w.poole-joint-chiefs-of-staff 252: all'
    section: '196111'
