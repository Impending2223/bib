      when: Apr.
      date: 1962-04
      thread: latin-america
      c: 'Lemnitzer sends OSD a Civic Action Plan for Ecuador, about $1.5 million: roads and water, then schools and health,
        then colonization; 41 American and 250 Ecuadoran soldiers and 4,950 civilian volunteers in the first phase. Gilpatric
        approves it with "worldwide priority." Civilian Conservation Corps projects funded in Bolivia and El Salvador.'
      n: '[[w.poole-joint-chiefs-of-staff]], 229. Names: Lemnitzer, Gilpatric.'
      src:
        c: bf6cb981
        rows:
        - 'w.poole-joint-chiefs-of-staff 229: all'
