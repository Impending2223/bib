    entry:
      id: cal.1964-10-01.europe-and-the-alliance
      when: Oct. 1
      date: '1964-10-01'
      thread: europe-and-the-alliance
      c: McNamara asks the Joint Chiefs to appraise a paper on NATO strategy and tactical nuclear weapons.
      n: '[[w.poole-joint-chiefs-of-staff]], 213. Names: McNamara.'
      src:
        c: 9811e1ef
        rows:
