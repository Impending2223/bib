    entry:
      id: cal.1961-04.middle-east
      when: Apr., late
      date: 1961-04
      thread: middle-east
      c: 'CENTO''s Military Committee. Lemnitzer: a Supreme Commander undesirable for political reasons; Pakistan and Iran:
        no planning worth doing without one. The Council agrees days later to an American or British "Supreme Commander-CENTO
        Military Planning Staff"; none appointed.'
      n: '[[w.poole-joint-chiefs-of-staff]], 248. See [[cal.1961-04-27.europe-and-the-alliance-jupiters]]. Names: Lemnitzer.'
      src:
        c: 57d7bb45
        rows:
        - 'w.poole-joint-chiefs-of-staff 248: all'
      tags:
      - name:lemnitzer-lyman-l
    section: '196104'
- add:
    entry:
      id: cal.1961-06.middle-east
      when: June, early
      date: 1961-06
      thread: middle-east
      c: 'The Joint Chiefs to McNamara: CENTO''s regional members more concerned with limited war, from neighbors the Soviets
        back, than with global war; Iran "a vital part of the Free World collective security system."'
      n: '[[w.poole-joint-chiefs-of-staff]], 248. Names: McNamara.'
      src:
        c: b2963d3b
        rows:
        - 'w.poole-joint-chiefs-of-staff 248: all'
      tags:
      - name:mcnamara-robert-s
    section: '196106'
- add:
    entry:
      id: cal.1962-11.middle-east
      when: Nov.
      date: 1962-11
      thread: middle-east
      c: CENTO's Military Committee approves a capabilities plan, the United States having agreed to discuss intelligence
        on the Afghan threat; Iran and Pakistan attach their criticisms. Its meetings of November 1961 and April 1962 had
        accomplished nothing.
      n: '[[w.poole-joint-chiefs-of-staff]], 248.'
      src:
        c: 122d75fc
        rows:
        - 'w.poole-joint-chiefs-of-staff 248: all'
    section: '196211'
- add:
    entry:
      id: cal.1963-04.middle-east
      when: Apr.
      date: 1963-04
      thread: middle-east
      c: 'CENTO''s Military Committee approves the requirements plan, Pakistan dissenting: "completely disillusioned," American
        aid to India the cause. Taylor: strategic nuclear attack the main American contribution. After, Taylor: "CENTO is
        not a military necessity"; its justification political; "not worth paying blackmail to any member."'
      n: '[[w.poole-joint-chiefs-of-staff]], 249. Names: Taylor.'
      src:
        c: 4c5c45ce
        rows:
        - 'w.poole-joint-chiefs-of-staff 249: all'
      tags:
      - name:taylor-maxwell
    section: '196304'
- add:
    entry:
      id: cal.1963-06-12.middle-east
      when: June 12
      date: '1963-06-12'
      thread: middle-east
      c: 'The Joint Chiefs, on ISA''s suggestion of a more active American role in CENTO: restraint; explore an Indian Ocean
        base; no floating depot yet, no multilateral planning; more exercises and counterinsurgency aid; not a signatory without
        a commitment of forces.'
      n: '[[w.poole-joint-chiefs-of-staff]], 249–50.'
      src:
        c: c544dd2d
        rows:
        - 'w.poole-joint-chiefs-of-staff 249–50: all'
    section: '196306'
- add:
    entry:
      id: cal.1964-04.middle-east
      when: Apr.
      date: 1964-04
      thread: middle-east
      c: CENTO's Military Committee, "the most productive ever." Pakistan accepts the requirements plan, its forces not available
        while India threatens, and drops its condition for an air defense survey.
      n: '[[w.poole-joint-chiefs-of-staff]], 250.'
      src:
        c: 16fed9ad
        rows:
        - 'w.poole-joint-chiefs-of-staff 250: all'
