- add:
    entry:
      id: cal.1961-07-15.south-asia
      when: July 15
      date: '1961-07-15'
      thread: south-asia
      c: 'Ayub, flying to the LBJ Ranch, with Lemnitzer and William Bundy: military aid deliveries at about the old level;
        some M-47s in fiscal 1962, four C-130s early in 1963; no submarine, no more F-104s.'
      n: '[[w.poole-joint-chiefs-of-staff]], 266. See [[cal.1961-07-11.right-and-the-military]]. Names: Ayub Khan, Lemnitzer,
        William Bundy.'
      src:
        c: c701d596
        rows:
        - 'w.poole-joint-chiefs-of-staff 266: all'
      tags:
      - name:ayub-khan-mohammad
      - name:lemnitzer-lyman-l
      - name:bundy-william
    section: '196107'
- add:
    entry:
      id: cal.1962-09.south-asia
      when: Sept.
      date: 1962-09
      thread: south-asia
      c: 'Ayub in Washington again, to McNamara: India buying Soviet MiG-21s and help with their engines. McNamara: fiscal
        1963 deliveries at least double 1962''s; 130 tanks, mostly M-48s; F-86s and F-104s for attrition; a submarine in fiscal
        1964. Ayub "highly pleased."'
      n: '[[w.poole-joint-chiefs-of-staff]], 266. Check: the day. Names: Ayub Khan, McNamara.'
      src:
        c: '23937212'
        rows:
        - 'w.poole-joint-chiefs-of-staff 266: all'
      tags:
      - name:ayub-khan-mohammad
      - name:mcnamara-robert-s
    section: '196209'
- add:
    entry:
      id: cal.1963-08.south-asia
      when: Aug.
      date: 1963-08
      thread: south-asia
      c: 'The Joint Chiefs on military aid to India: about $50 million for fiscal 1964, for quality, not more forces; roads,
        airfields, communications, radar; aid to Pakistan in balance; India no priority over "those countries now firmly committed."
        McNamara approves all but the last. ISA: 24 more F-104s for Pakistan over three years; the Chiefs concur, warning
        of a cycle of Indian and Pakistani demands.'
      n: '[[w.poole-joint-chiefs-of-staff]], 273. Names: McNamara.'
      src:
        c: d3cd184b
        rows:
        - 'w.poole-joint-chiefs-of-staff 273: all'
      tags:
      - name:mcnamara-robert-s
    section: '196308'
- add:
    entry:
      id: cal.1963-12.south-asia
      when: Dec., early
      date: 1963-12
      thread: south-asia
      c: 'Rusk, McNamara and Bell to Johnson on Bowles''s proposal, a five-year commitment to India for limits on its forces
        and Soviet purchases: "would be well worthwhile," but cautiously; $50 to $60 million a year for India, about $40 million
        for Pakistan.'
      n: '[[w.poole-joint-chiefs-of-staff]], 274. Names: Rusk, McNamara, Bell, Johnson, Bowles.'
      src:
        c: b9cb4479
        rows:
        - 'w.poole-joint-chiefs-of-staff 274: all'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bell-david-e
      - name:johnson-lyndon-b
      - name:bowles-chester
    section: '196312'
- add:
    entry:
      id: cal.1963-12.south-asia-2
      when: Dec., late
      date: 1963-12
      thread: south-asia
      c: 'Taylor at New Delhi and Karachi, just before Christmas. The Indians'' goals 16 divisions and 45 squadrons; ready
        "to view themselves ... as part of a regional security community." Ayub: America arms India against its ally; Taylor:
        "a certain type of operational planning could be engaged in," not aimed at anyone; on Zhou Enlai''s visit, Ayub "heatedly"
        defends it.'
      n: '[[w.poole-joint-chiefs-of-staff]], 274–75. Names: Taylor, Ayub Khan, Zhou Enlai.'
      src:
        c: c02b680f
        rows:
        - 'w.poole-joint-chiefs-of-staff 274–75: all'
      tags:
      - name:taylor-maxwell
      - name:ayub-khan-mohammad
      - name:zhou-enlai
    section: '196312'
- add:
    entry:
      id: cal.1964-02.south-asia
      when: Feb., early
      date: 1964-02
      thread: south-asia
      c: 'Johnson approves exploratory approaches to India and Pakistan on multi-year military aid, after Taylor''s recommendation
        of a one-year interim program of about $50 million for India. The Joint Chiefs: no firm commitments; $50 million a
        year; no F-104s from the Air Force''s own.'
      n: '[[w.poole-joint-chiefs-of-staff]], 275. See [[cal.1963-12.south-asia-2]]. Names: Johnson, Taylor.'
      src:
        c: 12e769a8
        rows:
        - 'w.poole-joint-chiefs-of-staff 275: all'
      tags:
      - name:johnson-lyndon-b
      - name:taylor-maxwell
    section: '196402'
- add:
    entry:
      id: cal.1964-02.south-asia-2
      when: Feb.
      date: 1964-02
      thread: south-asia
      c: 'Musa, commanding Pakistan''s army, sends Taylor a list of "numerous vital and wide gaps." McNamara to the Pakistani
        ambassador: one of the most upsetting letters he has read; "When I make a commitment, I keep it."'
      n: '[[w.poole-joint-chiefs-of-staff]], 276. Names: Taylor, McNamara.'
      src:
        c: cecaf031
        rows:
        - 'w.poole-joint-chiefs-of-staff 276: all'
      tags:
      - name:taylor-maxwell
      - name:mcnamara-robert-s
    section: '196402'
- add:
    entry:
      id: cal.1964-03.south-asia
      when: Mar.
      date: 1964-03
      thread: south-asia
      c: 'India presents its five-year defense plan, 25 division-equivalents and 564,000 combat troops. The Joint Chiefs to
        McNamara: "to meet unstated objectives in response to unevaluated threats"; "clearly excessive." Against Bowles''s
        F-104Gs for India; McNamara decides to be "forthcoming" on aircraft.'
      n: '[[w.poole-joint-chiefs-of-staff]], 275–76. Names: McNamara, Bowles.'
      src:
        c: 9968f9d1
        rows:
        - 'w.poole-joint-chiefs-of-staff 275–76: all'
      tags:
      - name:mcnamara-robert-s
      - name:bowles-chester
    section: '196403'
- add:
    entry:
      id: cal.1964-04.south-asia
      when: Apr.
      date: 1964-04
      thread: south-asia
      c: 'Musa in Washington. Wood: the military aid ceiling not to rise; two F-104 squadrons in 1965–66 only if the differences
        with India are resolved. Musa to Taylor: such conditions strip the "charm and grace" from the relationship. Two days
        with Adams on a joint exercise.'
      n: '[[w.poole-joint-chiefs-of-staff]], 276. Names: Taylor.'
      src:
        c: 9228802b
        rows:
        - 'w.poole-joint-chiefs-of-staff 276: all'
      tags:
      - name:taylor-maxwell
    section: '196404'
- add:
    entry:
      id: cal.1964-05.south-asia
      when: May, mid-month
      date: 1964-05
      thread: south-asia
      c: American and Indian officials open talks on military aid. The Indians keep their force goals; 80 to 90 MiG-21s to
        be assembled in India under firm Soviet agreements.
      n: '[[w.poole-joint-chiefs-of-staff]], 276.'
      src:
        c: b877c117
        rows:
        - 'w.poole-joint-chiefs-of-staff 276: all'
    section: '196405'
- add:
    entry:
      id: cal.1964-06-03.south-asia
      when: June 3
      date: '1964-06-03'
      thread: south-asia
      c: 'A Memorandum of Agreement with India: $10 million in credits for fiscal 1964 and $50 million for 1965, mountain
        warfare equipment, communications and ammunition production. McNamara withholds a five-year promise.'
      n: '[[w.poole-joint-chiefs-of-staff]], 276. See [[cal.1964-05-27.india-and-china]]. Names: McNamara.'
      src:
        c: c0165ca6
        rows:
        - 'w.poole-joint-chiefs-of-staff 276: all'
      tags:
      - name:mcnamara-robert-s
    section: '196406'
- add:
    entry:
      id: cal.1964-07.south-asia
      when: July, early
      date: 1964-07
      thread: south-asia
      c: 'Adams asks the Joint Chiefs whether the joint exercise with Pakistan should go on. They: Pakistan aims at a commitment
        of American forces; let it make the next move.'
      n: '[[w.poole-joint-chiefs-of-staff]], 276.'
      src:
        c: f2718db9
        rows:
        - 'w.poole-joint-chiefs-of-staff 276: all'
    section: '196407'
- add:
    entry:
      id: cal.1964-08-01.south-asia
      when: Aug. 1
      date: '1964-08-01'
      thread: south-asia
      c: 'Wheeler, just Chairman, to Musa: too little time to arrange "an orderly and successful exercise" this year. Aug.
        5, Adams receives Musa''s letter dated July 31, asking American officers for detailed planning in Pakistan; on the
        Chiefs'' instruction, Adams defers all action.'
      n: '[[w.poole-joint-chiefs-of-staff]], 276–77. See [[cal.1964-07.south-asia]]. Names: Wheeler.'
      src:
        c: 7f25069d
        rows:
        - 'w.poole-joint-chiefs-of-staff 276–77: all'
      tags:
      - name:wheeler-earle
    section: '196408'
- add:
    entry:
      id: cal.1964-09.south-asia
      when: Sept.
      date: 1964-09
      thread: south-asia
      c: 'India accepts substantial Soviet military aid: MiGs, two surface-to-air missile complexes, 90 amphibious tanks.
        Ayub talks of leaving SEATO.'
      n: '[[w.poole-joint-chiefs-of-staff]], 277. Names: Ayub Khan.'
      src:
        c: e91771b7
        rows:
        - 'w.poole-joint-chiefs-of-staff 277: all'
      tags:
      - name:ayub-khan-mohammad
    section: '196409'
- add:
    entry:
      id: cal.1964-12.south-asia
      when: Dec.
      date: 1964-12
      thread: south-asia
      c: The White House learns that Pakistan has a secret commitment from China for a closer relationship than is acknowledged.
      n: '[[w.poole-joint-chiefs-of-staff]], 277. Check: the month; Poole: "Late in 1964."'
      src:
        c: 992dbffe
        rows:
        - 'w.poole-joint-chiefs-of-staff 277: all'
    section: '196412'
- add:
    entry:
      id: cal.1962-01.south-asia
      when: Jan.
      date: 1962-01
      thread: south-asia
      c: 'The Joint Chiefs, foreseeing a vacuum as the British talk of leaving east of Aden: long-term agreements for emergency
        use of islands in the Indian Ocean, Diego Garcia and Socotra first. State: Socotra a liability; talk with the British
        about detaching Diego Garcia.'
      n: '[[w.poole-joint-chiefs-of-staff]], 277.'
      src:
        c: c5dde330
        rows:
        - 'w.poole-joint-chiefs-of-staff 277: all'
    section: '196201'
- add:
    entry:
      id: cal.1963-04.south-asia
      when: Apr.
      date: 1963-04
      thread: south-asia
      c: The British approached on islands for American use in the Indian Ocean; three months later they agree to preliminary
        talks.
      n: '[[w.poole-joint-chiefs-of-staff]], 277. See [[cal.1962-01.south-asia]].'
      src:
        c: 5d0c0732
        rows:
        - 'w.poole-joint-chiefs-of-staff 277: all'
    section: '196304'
- add:
    entry:
      id: cal.1963-07.south-asia
      when: July
      date: 1963-07
      thread: south-asia
      c: Kennedy raises a small carrier task force in the Indian Ocean. Rusk for it; the Joint Chiefs against, "substantial
        evidence" of American interest already there, a carrier temporarily if politics require.
      n: '[[w.poole-joint-chiefs-of-staff]], 277. Names: Kennedy, Rusk.'
      src:
        c: 597e115a
        rows:
        - 'w.poole-joint-chiefs-of-staff 277: all'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
    section: '196307'
- add:
    entry:
      id: cal.1964-02.south-asia-3
      when: Feb.
      date: 1964-02
      thread: south-asia
      c: 'State changes the Indian Ocean task force''s itinerary: India and Pakistan "counter-productive," Indonesia and Malaysia
        sensitive; East Africa and the Malagasy Republic "highly desirable." The Joint Chiefs: the cruise robbed of value.
        Ayub to Taylor: "teaching the natives and the heathen how to behave."'
      n: '[[w.poole-joint-chiefs-of-staff]], 278. Names: Ayub Khan, Taylor.'
      src:
        c: eedb6cff
        rows:
        - 'w.poole-joint-chiefs-of-staff 278: all'
      tags:
      - name:ayub-khan-mohammad
      - name:taylor-maxwell
    section: '196402'
- add:
    entry:
      id: cal.1964-03-31.south-asia
      when: Mar. 31
      date: '1964-03-31'
      thread: south-asia
      c: 'The "Concord Squadron," the carrier Bon Homme Richard, three destroyers and an oiler, sails into the Indian Ocean,
        to May 13: Diego Suarez, Mombasa, Aden, a demonstration for the Shah in the Gulf of Oman. Rusk: "an outstanding success."
        Another cruise, July to October.'
      n: '[[w.poole-joint-chiefs-of-staff]], 278. See [[cal.1964-03-19.defense]]. Names: Rusk.'
      src:
        c: b51bc1c3
        rows:
        - 'w.poole-joint-chiefs-of-staff 278: all'
      tags:
      - name:rusk-dean
    section: '196403'
- cite:
    id: cal.1963-09-06.south-asia
    item: '[[w.poole-joint-chiefs-of-staff]], 274'
    units: A
- add:
    entry:
      id: cal.1960-12.defense-3
      when: Dec.
      date: 1960-12
      thread: defense
      c: 'JSCP-62, the Joint Strategic Capabilities Plan, approved: in general war, hold in Southeast Asia "as far forward
        as possible" and along the line Philippines–Taiwan–Okinawa–South Korea and Japan; South Korea defended only so far
        as it does not prejudice the rest; Southeast Asia "primarily by Allied and indigenous forces."'
      n: '[[w.poole-joint-chiefs-of-staff]], 279.'
      src:
        c: 01b595e4
        rows:
        - 'w.poole-joint-chiefs-of-staff 279: all'
    section: '196012'
- add:
    entry:
      id: cal.1960-12.china
      when: Dec.
      date: 1960-12
      thread: china
      c: 'Lemnitzer to the Service Chiefs: China may explode a nuclear device "in the not too distant future," its impact
        on Asia and Africa "profound." They agree to assess it.'
      n: '[[w.poole-joint-chiefs-of-staff]], 282. Names: Lemnitzer.'
      src:
        c: 5cc899b4
        rows:
        - 'w.poole-joint-chiefs-of-staff 282: all'
      tags:
      - name:lemnitzer-lyman-l
    section: '196012'
- add:
    entry:
      id: cal.1961-06-26.china
      when: June 26
      date: '1961-06-26'
      thread: china
      c: 'The Joint Chiefs to McNamara on a Chinese bomb: a test perhaps in 1962–64, a small stockpile within two years, a
        missile of 200 to 500 miles by 1968–70, no ICBM till well after 1970. Postpone it "by all feasible overt and covert
        actions"; blunt the first test''s impact; exploit the Sino-Soviet split; later, nuclear carriers for selected allies.'
      n: '[[w.poole-joint-chiefs-of-staff]], 282. See [[cal.1960-12.china]]. Names: McNamara.'
      src:
        c: fc06c018
        rows:
        - 'w.poole-joint-chiefs-of-staff 282: all'
      tags:
      - name:mcnamara-robert-s
    section: '196106'
- add:
    entry:
      id: cal.1961-02.defense-5
      when: Feb.
      date: 1961-02
      thread: defense
      c: 'Rusk suggests a more visible American presence around the Asian periphery, the threatened nations to shed some of
        the burden of external defense for the fight against insurgency. The Joint Chiefs: it would sap Asians'' will; American
        power in the western Pacific would have to rise "demonstrably."'
      n: '[[w.poole-joint-chiefs-of-staff]], 279. Names: Rusk.'
      src:
        c: c116edaf
        rows:
        - 'w.poole-joint-chiefs-of-staff 279: all'
      tags:
      - name:rusk-dean
    section: '196102'
- add:
    entry:
      id: cal.1961-05.china-3
      when: May
      date: 1961-05
      thread: china
      also:
      - laos
      c: 'Gilpatric''s questions to the Joint Chiefs on war with China, the Laotian crisis at hand. Their answers: American
        air power would prevail; without nuclear weapons only Saigon and the Mekong held, with them a line from Huế and Đà
        Nẵng to Kon Tum, Pleiku, Pakse and the Mekong; Quemoy and Matsu only with nuclear weapons; North Vietnam defeated
        with tactical nuclear weapons, China''s threat neutralized by unrestricted attack.'
      n: '[[w.poole-joint-chiefs-of-staff]], 279–80. Names: Gilpatric.'
      src:
        c: 5a8b7f4d
        rows:
        - 'w.poole-joint-chiefs-of-staff 279–80: all'
      tags:
      - name:gilpatric-roswell-l
    section: '196105'
- add:
    entry:
      id: cal.1962-09.defense-3
      when: Sept.
      date: 1962-09
      thread: defense
      also:
      - japan
      - china
      c: 'Taylor tours the Far East before becoming Chairman: "for the first time, we sense the need to deter China in a way
        similar to the deterrence of the USSR"; Chiang''s "most pressing problem" air defense; a three-division expeditionary
        force for him; Japan "a poor bet as a military ally." McNamara asks the Chiefs to study early nuclear use against
        China and Chinese air power; Kennedy asks whether the $350 million a year spent in Japan can be cut.'
      n: '[[w.poole-joint-chiefs-of-staff]], 280, 289. Names: Taylor, Chiang Kai-shek, McNamara, Kennedy.'
      src:
        c: 0de8d3f8
        rows:
        - 'w.poole-joint-chiefs-of-staff 280, 289: all'
      tags:
      - name:taylor-maxwell
      - name:chiang-kai-shek
      - name:mcnamara-robert-s
      - name:kennedy-john-f
    section: '196209'
- add:
    entry:
      id: cal.1963-04.china
      when: Apr.
      date: 1963-04
      thread: china
      c: 'The Joint Chiefs'' study of China''s air threat: without Soviet help China perhaps unable to wage sustained air
        war; primary reliance on nuclear deterrence; more American fighters; Polaris in the Pacific. McNamara: not primary
        reliance on nuclear deterrence, useless against insurgency; Polaris yes.'
      n: '[[w.poole-joint-chiefs-of-staff]], 280–81. See [[cal.1962-09.defense-3]]. Names: McNamara.'
      src:
        c: 6880d447
        rows:
        - 'w.poole-joint-chiefs-of-staff 280–81: all'
      tags:
      - name:mcnamara-robert-s
    section: '196304'
- add:
    entry:
      id: cal.1963-05.china
      when: May
      date: 1963-05
      thread: china
      c: 'The Joint Chiefs to McNamara: early nuclear response would not change force levels; the Nationalists on Taiwan "a
        continuing deterrent threat" and a strategic reserve. Rusk: Nationalists in Southeast Asia would almost surely bring
        Chinese intervention.'
      n: '[[w.poole-joint-chiefs-of-staff]], 281. Names: McNamara, Rusk.'
      src:
        c: eaacc821
        rows:
        - 'w.poole-joint-chiefs-of-staff 281: all'
      tags:
      - name:mcnamara-robert-s
      - name:rusk-dean
    section: '196305'
- add:
    entry:
      id: cal.1963-10-22.china
      when: Oct. 22
      date: '1963-10-22'
      thread: china
      c: 'The Joint Chiefs to McNamara: Nationalist force objectives tailored to Taiwan, the Penghus, Quemoy and Matsu; military
        aid withdrawn from six light infantry divisions, fewer destroyers and LSTs, more minesweepers; no cut in Chiang''s
        air force.'
      n: '[[w.poole-joint-chiefs-of-staff]], 281. See [[cal.1963-05.china]]. Names: McNamara, Chiang Kai-shek.'
      src:
        c: 06f31afa
        rows:
        - 'w.poole-joint-chiefs-of-staff 281: all'
      tags:
      - name:mcnamara-robert-s
      - name:chiang-kai-shek
    section: '196310'
- add:
    entry:
      id: cal.1962-11.china
      when: Nov.
      date: 1962-11
      thread: china
      c: Rusk authorizes a program to influence world opinion after a Chinese nuclear test. The Joint Chiefs' draft minimizes
        the change; in June 1963 the Intelligence Board clears a sanitized version for friendly nations.
      n: '[[w.poole-joint-chiefs-of-staff]], 282. Names: Rusk.'
      src:
        c: 6678c7d7
        rows:
        - 'w.poole-joint-chiefs-of-staff 282: all'
      tags:
      - name:rusk-dean
    section: '196211'
- add:
    entry:
      id: cal.1964-10.china
      when: Oct., late
      date: 1964-10
      thread: china
      c: 'The Joint Chiefs on China''s test: the posture planned for the Pacific through 1970 "generally adequate"; more military
        aid for South Korea, Taiwan, the Philippines and Thailand; a resolution authorizing retaliation in kind; Japan to
        allow nuclear weapons at American bases. China''s bomb "will not, for the indefinite future, alter the real relations
        of power."'
      n: '[[w.poole-joint-chiefs-of-staff]], 283. Check: the day. See [[cal.1964-10-16.testing]].'
      src:
        c: 467ab928
        rows:
        - 'w.poole-joint-chiefs-of-staff 283: all'
    section: '196410'
- add:
    entry:
      id: cal.1961-10.japan
      when: Oct.
      date: 1961-10
      thread: japan
      c: 'State''s draft guidelines on Japan, "our principal ally in the Far East": de-emphasize security, no pressure to
        arm, Ryukyus control only as needed. The Joint Chiefs, with ISA: control of the Ryukyus "indispensable"; Japan to
        arm more; nuclear storage at American bases. The final guidelines, March 1962, take the first two.'
      n: '[[w.poole-joint-chiefs-of-staff]], 289.'
      src:
        c: e717959c
        rows:
        - 'w.poole-joint-chiefs-of-staff 289: all'
    section: '196110'
- add:
    entry:
      id: cal.1962-12-07.japan
      when: Dec. 7
      date: '1962-12-07'
      thread: japan
      c: 'The Joint Chiefs to McNamara: the bases in Japan "contribute significantly to the overall strategic US posture in
        the Pacific" and should stay "in essentially their present form," despite no nuclear weapons, prior consultation and
        the dollar drain. Gilpatric agrees; Kennedy: unless Japan offsets the spending within a year or so, squadrons, logistic
        bases and home-ported ships to go.'
      n: '[[w.poole-joint-chiefs-of-staff]], 289–90. See [[cal.1962-09.defense-3]]. Names: McNamara, Gilpatric, Kennedy.'
      src:
        c: ce6dfc4e
        rows:
        - 'w.poole-joint-chiefs-of-staff 289–90: all'
      tags:
      - name:mcnamara-robert-s
      - name:gilpatric-roswell-l
      - name:kennedy-john-f
    section: '196212'
- add:
    entry:
      id: cal.1963-02.japan
      when: Feb.
      date: 1963-02
      thread: japan
      c: 'Gilpatric visits Japan: the dollar drain will not stop soon. He asks the Joint Chiefs for plans to reduce it short
        of a major redeployment. They oppose every cut; sell Japan equipment, $1.7 billion needed.'
      n: '[[w.poole-joint-chiefs-of-staff]], 290. Names: Gilpatric.'
      src:
        c: 6834c720
        rows:
        - 'w.poole-joint-chiefs-of-staff 290: all'
      tags:
      - name:gilpatric-roswell-l
    section: '196302'
- add:
    entry:
      id: cal.1963-06.japan
      when: June
      date: 1963-06
      thread: japan
      c: McNamara tells the Joint Chiefs he will propose moving the 1st Marine Air Wing from Japan to Okinawa. The Chiefs,
        Shoup excepted, oppose; McNamara drops it.
      n: '[[w.poole-joint-chiefs-of-staff]], 290–91. See [[cal.1963-07-16.japan]]. Names: McNamara, Shoup.'
      src:
        c: 5b94ba3b
        rows:
        - 'w.poole-joint-chiefs-of-staff 290–91: all'
      tags:
      - name:mcnamara-robert-s
      - name:shoup-david-m
    section: '196306'
- add:
    entry:
      id: cal.1964-06.japan
      when: June
      date: 1964-06
      thread: japan
      c: McNamara authorizes moving a 58-plane Marine Air Group from Japan to Okinawa, and the LST with nuclear weapons from
        Iwakuni to a dollar area, as the Navy recommended early in the year, Wheeler, McDonald and Greene for it, LeMay and
        Harold Johnson against. Postponed indefinitely as Vietnam grows.
      n: '[[w.poole-joint-chiefs-of-staff]], 291. Names: McNamara, Wheeler, McDonald, Greene, LeMay, Harold K. Johnson.'
      src:
        c: e04fa05a
        rows:
        - 'w.poole-joint-chiefs-of-staff 291: all'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:mcdonald-david-l
      - name:greene-wallace-m-jr
      - name:lemay-curtis-e
      - name:johnson-harold-k
    section: '196406'
- add:
    entry:
      id: cal.1961-08.japan
      when: Aug.
      date: 1961-08
      thread: japan
      c: 'Kennedy, after talking with Ikeda, orders an interdepartmental task force on economic and social improvement in
        the Ryukyus. Its proposal, Japan to share aid to Okinawa; the Joint Chiefs: "complete" American jurisdiction essential.
        McNamara to Kennedy for a negotiated agreement, without "excessive relaxing of political controls."'
      n: '[[w.poole-joint-chiefs-of-staff]], 291–92. The decision: [[cal.1962-03-05.japan-and-korea]]. Names: Kennedy, Ikeda,
        McNamara.'
      src:
        c: 26dcd4d3
        rows:
        - 'w.poole-joint-chiefs-of-staff 291–92: all'
      tags:
      - name:kennedy-john-f
      - name:ikeda-hayato
      - name:mcnamara-robert-s
    section: '196108'
- add:
    entry:
      id: cal.1963-02.japan-2
      when: Feb.
      date: 1963-02
      thread: japan
      c: 'Wheeler to the Joint Chiefs on "the eroding efforts" against American military interests in the Ryukyus. The Chiefs
        to McNamara and Kennedy: the chain "the most important military base complex in the Western Pacific," sixteen major
        installations.'
      n: '[[w.poole-joint-chiefs-of-staff]], 292. Names: Wheeler, McNamara, Kennedy.'
      src:
        c: 1d8e6d81
        rows:
        - 'w.poole-joint-chiefs-of-staff 292: all'
      tags:
      - name:wheeler-earle
      - name:mcnamara-robert-s
      - name:kennedy-john-f
    section: '196302'
- add:
    entry:
      id: cal.1963-05.japan
      when: May
      date: 1963-05
      thread: japan
      c: 'Reischauer foresees de facto integration of Japan and the Ryukyus; accommodation the prudent course, administration
        perhaps returned with the bases kept. The Joint Chiefs: concessions would "risk undermining the US military position";
        no return even as a fallback.'
      n: '[[w.poole-joint-chiefs-of-staff]], 292. Names: Reischauer.'
      src:
        c: 2eebfea7
        rows:
        - 'w.poole-joint-chiefs-of-staff 292: all'
      tags:
      - name:reischauer-edwin-o
    section: '196305'
- add:
    entry:
      id: cal.1961-10.indonesia
      when: Oct.
      date: 1961-10
      thread: indonesia
      c: 'LeMay, "deeply concerned" at the loss of influence in Indonesia. The Joint Chiefs to McNamara: Soviet military shipments
        $840 million against American aid of $61.6 million; a Communist Indonesia a "tremendous" asset to the bloc, a "chain
        reaction" possible; "a detailed and dynamic national plan." McNamara sends it to State.'
      n: '[[w.poole-joint-chiefs-of-staff]], 293. Names: LeMay, McNamara.'
      src:
        c: 06855d46
        rows:
        - 'w.poole-joint-chiefs-of-staff 293: all'
      tags:
      - name:lemay-curtis-e
      - name:mcnamara-robert-s
    section: '196110'
- add:
    entry:
      id: cal.1962-02.indonesia
      when: Feb.
      date: 1962-02
      thread: indonesia
      c: 'State''s guidelines on Indonesia: West Irian removed from "communist exploitation," the Dutch to depart "voluntarily";
        close ties between Kennedy and Sukarno; Nasution''s army the anti-Communist force. No Defense suggestion adopted.'
      n: '[[w.poole-joint-chiefs-of-staff]], 293–94. Names: Kennedy, Sukarno, Nasution.'
      src:
        c: 22e7a79e
        rows:
        - 'w.poole-joint-chiefs-of-staff 293–94: all'
      tags:
      - name:kennedy-john-f
      - name:sukarno
      - name:nasution-abdul-haris
    section: '196202'
- add:
    entry:
      id: cal.1962-08-15.indonesia
      when: Aug. 15
      date: '1962-08-15'
      thread: indonesia
      c: The West Irian settlement signed, Bunker mediating under Sukarno's threat of invasion; the territory to the UN at
        once, to Indonesia May 1, 1963.
      n: '[[w.poole-joint-chiefs-of-staff]], 294. Names: Bunker, Sukarno.'
      src:
        c: 4157c62f
        rows:
        - 'w.poole-joint-chiefs-of-staff 294: all'
      tags:
      - name:bunker-ellsworth
      - name:sukarno
    section: '196208'
- add:
    entry:
      id: cal.1963-01.indonesia
      when: Jan.
      date: 1963-01
      thread: indonesia
      c: Sukarno proclaims a policy of "confrontation" against the forming of Malaysia.
      n: '[[w.poole-joint-chiefs-of-staff]], 294. Names: Sukarno.'
      src:
        c: e52035db
        rows:
        - 'w.poole-joint-chiefs-of-staff 294: all'
      tags:
      - name:sukarno
    section: '196301'
- add:
    entry:
      id: cal.1963-02-09.indonesia
      when: Feb. 9
      date: '1963-02-09'
      thread: indonesia
      c: 'CINCPAC ordered, on Anderson''s urging, to plan for Indonesian expansion: against Malaysia, New Guinea, Portuguese
        Timor, the Strait of Malacca, the Philippines, or bases for the Sino-Soviet bloc.'
      n: '[[w.poole-joint-chiefs-of-staff]], 294. Names: Anderson.'
      src:
        c: ca4e5c67
        rows:
        - 'w.poole-joint-chiefs-of-staff 294: all'
      tags:
      - name:anderson-george-w-jr
    section: '196302'
- add:
    entry:
      id: cal.1963-09-16.indonesia
      when: Sept. 16
      date: '1963-09-16'
      thread: indonesia
      c: Malaysia established. Sukarno cuts commercial ties and vows to "crush Malaysia." The United States suspends shipments
        of aircraft, ships, weapons and ammunition to Indonesia.
      n: '[[w.poole-joint-chiefs-of-staff]], 294. Names: Sukarno.'
      src:
        c: 684b4e96
        rows:
        - 'w.poole-joint-chiefs-of-staff 294: all'
      tags:
      - name:sukarno
    section: '196309'
- add:
    entry:
      id: cal.1964-03.indonesia
      when: Mar.
      date: 1964-03
      thread: indonesia
      c: 'The United States broadens its list of military items barred to Indonesia. Nasution to Taylor: civic action and
        officer training to continue; Taylor: that depends on the confrontation.'
      n: '[[w.poole-joint-chiefs-of-staff]], 294–95. Names: Nasution, Taylor.'
      src:
        c: 8630c422
        rows:
        - 'w.poole-joint-chiefs-of-staff 294–95: all'
      tags:
      - name:nasution-abdul-haris
      - name:taylor-maxwell
    section: '196403'
- add:
    entry:
      id: cal.1964-04.indonesia
      when: Apr.
      date: 1964-04
      thread: indonesia
      c: OSD, at State's request, considers a small training mission in Malaysia. The Joint Chiefs ask that visits of senior
        officers or units also be weighed, and the Commonwealth consulted.
      n: '[[w.poole-joint-chiefs-of-staff]], 295.'
      src:
        c: 4f2dbd4f
        rows:
        - 'w.poole-joint-chiefs-of-staff 295: all'
    section: '196404'
- add:
    entry:
      id: cal.1964-08-17.indonesia
      when: Aug. 17
      date: '1964-08-17'
      thread: indonesia
      c: 'Sukarno, a three-hour speech: the United States Indonesia''s main enemy; "a year of living dangerously." Three groups
        of Indonesian guerrillas land near Singapore. State: Sukarno "opposes everything we are trying to do."'
      n: '[[w.poole-joint-chiefs-of-staff]], 295. Names: Sukarno.'
      src:
        c: e76f413b
        rows:
        - 'w.poole-joint-chiefs-of-staff 295: all'
      tags:
      - name:sukarno
    section: '196408'
- add:
    entry:
      id: cal.1964-08-26.indonesia
      when: Aug. 26
      date: '1964-08-26'
      thread: indonesia
      c: 'The Joint Chiefs to McNamara: "a closely monitored Indonesian MAP — limited to civic action and CONUS school training
        — should be continued for intelligence purposes and for possible future influence."'
      n: '[[w.poole-joint-chiefs-of-staff]], 295. Names: McNamara.'
      src:
        c: 7a7dcfad
        rows:
        - 'w.poole-joint-chiefs-of-staff 295: all'
      tags:
      - name:mcnamara-robert-s
    section: '196408'
