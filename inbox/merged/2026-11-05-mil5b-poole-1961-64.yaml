      when: Oct.
      date: 1960-10
      thread: africa
      c: 'The Joint Chiefs on Communist penetration of Guinea and Ghana: Guinea "well on the way to becoming a Bloc satellite,"
        its air and sea facilities "a serious threat" in unfriendly hands. State: drifting "in a pro-communist direction,"
        not "hopelessly unredeemable."'
