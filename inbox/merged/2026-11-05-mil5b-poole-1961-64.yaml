- add:
    entry:
      id: cal.1962-12.europe-and-the-alliance-2
      when: Dec., mid-month
      date: 1962-12
      thread: europe-and-the-alliance
      c: 'McNamara, just before Nassau: "our current position with respect to a multilateral force simply will not work. ...
        There is no way in which we can persuade the Europeans to buy and pay for both a multilateral force and a full compliance
        with NATO conventional force goals."'
      n: '[[w.poole-joint-chiefs-of-staff]], 202. Check: the day. Names: McNamara.'
      src:
        c: 848eaa2d
        rows:
        - 'w.poole-joint-chiefs-of-staff 202: all'
      tags:
      - name:mcnamara-robert-s
    section: '196212'
- add:
    entry:
      id: cal.1963-10-31.europe-and-the-alliance
      when: Oct. 31
      date: '1963-10-31'
      thread: europe-and-the-alliance
      c: News conference. "We intend to keep our combat forces in Germany as they are today—that is, more than 6 combat divisions";
        the Berlin units kept "as long as there is a need for them"; some cut in noncombat personnel. A reversal of the Cabinet's
        ruling of Oct. 24 on the roundout units.
      n: 'The President''s News Conference of October 31, 1963, [1963 Pub. Papers 826](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=884)
