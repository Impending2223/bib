      when: Jan. 27
      date: '1961-01-27'
      thread: africa
      c: Nitze, for State, asks the Joint Chiefs to assess an atom-free zone in Africa and regional arms control there, after
        Eisenhower's proposal of September to the UN and the African states' draft resolution.
      n: '[[w.poole-joint-chiefs-of-staff]], 251. Check: the day; Poole: "one week after President Kennedy took office." Names:
        Nitze.'
