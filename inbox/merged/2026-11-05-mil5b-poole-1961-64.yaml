      when: Aug. 3
      date: '1963-08-03'
      thread: europe-and-the-alliance
      c: 'Stuttgart. Taylor and McNamara with the American commanders: without tactical nuclear weapons the conventional forces
        cannot enforce a pause long enough for negotiation. Back in Washington, Taylor''s concept: "we must stop talking ''pause''
        and casting doubt [on] our willingness to use nuclear weapons."'
      n: '[[w.poole-joint-chiefs-of-staff]], 211. Names: Taylor, McNamara.'
      src:
        c: dffbb2c7
        rows:
        - 'w.poole-joint-chiefs-of-staff 211: all'
      tags:
      - name:taylor-maxwell
      - name:mcnamara-robert-s
    section: '196308'
- add:
    entry:
      id: cal.1963-11-21.europe-and-the-alliance
      when: Nov. 21
      date: '1963-11-21'
      thread: europe-and-the-alliance
      c: 'Bundy''s "interim correcting document," the day Kennedy leaves for Dallas: no debate of strategy with Erhard before
        the President''s review; "a mistake ... to assume that a paper of April 1961 is Holy Writ." Rusk had told McNamara
        an early-use strategy "would not accord with the US view."'
      n: '[[w.poole-joint-chiefs-of-staff]], 211–12. Names: Bundy, Kennedy, Erhard, Rusk, McNamara.'
      src:
        c: 8999ca6a
        rows:
        - 'w.poole-joint-chiefs-of-staff 211–12: all'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-john-f
      - name:erhard-ludwig
      - name:rusk-dean
      - name:mcnamara-robert-s
    section: '196311'
- add:
    entry:
      id: cal.1963-12.europe-and-the-alliance
      when: Dec.
      date: 1963-12
      thread: europe-and-the-alliance
      c: 'Paris, the NATO Council, MC 100/1 before it, "Appreciation of the Military Situation As It Affects NATO Up To 1970":
        credible conventional, tactical nuclear and strategic capabilities. The Americans offer no initiative. The Joint Chiefs''
        parallel "Military Strategy for NATO," endorsed by McNamara.'
      n: '[[w.poole-joint-chiefs-of-staff]], 212. Names: McNamara.'
      src:
        c: bf77d2bb
        rows:
        - 'w.poole-joint-chiefs-of-staff 212: all'
      tags:
      - name:mcnamara-robert-s
    section: '196312'
- add:
    entry:
      id: cal.1964-02.europe-and-the-alliance
      when: Feb.
      date: 1964-02
      thread: europe-and-the-alliance
      c: Rusk sends McNamara a counter-draft of State's views on NATO strategy. Burchinal, Director of the Joint Staff, to
        Taylor; State "entrenched in strategic doctrine which they developed in 1961."
      n: '[[w.poole-joint-chiefs-of-staff]], 213. Names: Rusk, McNamara, Taylor.'
      src:
        c: aa4383e3
        rows:
        - 'w.poole-joint-chiefs-of-staff 213: all'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:taylor-maxwell
    section: '196402'
- add:
    entry:
      id: cal.1964-04-28.europe-and-the-alliance
      when: Apr. 28
      date: '1964-04-28'
      thread: europe-and-the-alliance
      c: 'The Joint Chiefs to McNamara: State''s draft on NATO strategy addresses over-all policy, better taken with a new
        political directive; State and Defense to review the directive of 1961 first.'
      n: '[[w.poole-joint-chiefs-of-staff]], 213. See [[cal.1964-02.europe-and-the-alliance]]. Names: McNamara.'
