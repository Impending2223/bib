      date: 1962-03
      thread: africa
      c: State's directive on arms for Africa issued, ISA's points taken in. Military aid to Africa, fiscal 1961–64, $89.6
        million, Morocco and Ethiopia first.
      n: '[[w.poole-joint-chiefs-of-staff]], 252. See [[cal.1961-05.africa]].'
      src:
        c: 3ae5d726
        rows:
        - 'w.poole-joint-chiefs-of-staff 252: all'
    section: '196203'
- add:
    entry:
      id: cal.1961-11.africa
      when: Nov.
      date: 1961-11
      thread: africa
      c: 'State''s "New Africa" guidelines: Africa "probably the greatest open field of maneuver" in the cold war; "our greatest
        liability is our failure to live up to some of our ideals." The Joint Chiefs: "infused with an humility not in consonance
        with the dignity and stature" of the United States. The final guidelines unchanged.'
      n: '[[w.poole-joint-chiefs-of-staff]], 252–53.'
      src:
        c: c7542170
        rows:
        - 'w.poole-joint-chiefs-of-staff 252–53: all'
    section: '196111'
- add:
    entry:
      id: cal.1961-03.africa
      when: Mar., late
      date: 1961-03
      thread: africa
      c: 'The Joint Chiefs to McNamara, after the vote on Angola: "deeply concerned" for the Azores, the Lajes lease ending
        Dec. 31, 1962, "essential" to the war plans, and for Spain''s bases. Gilpatric to Rusk: do not alienate Spain and
        Portugal; the Azores "essential" in war.'
      n: '[[w.poole-joint-chiefs-of-staff]], 253. Check: the day. See [[cal.1961-03-15.africa]]. Names: McNamara, Gilpatric,
        Rusk.'
      src:
        c: e1a6f436
        rows:
        - 'w.poole-joint-chiefs-of-staff 253: all'
      tags:
      - name:mcnamara-robert-s
      - name:gilpatric-roswell-l
      - name:rusk-dean
    section: '196103'
- add:
    entry:
      id: cal.1961-07.africa
      when: July, mid-month
      date: 1961-07
      thread: africa
      c: 'Kennedy accepts the Portugal task force''s proposals: a special envoy to Salazar for rapid change in Angola, Mozambique
        and Portuguese Guinea, quietly. Defense''s statement in the report: Lajes "the single most valuable facility" a foreign
        power lets the United States use. Williams of State for pressing Lisbon.'
      n: '[[w.poole-joint-chiefs-of-staff]], 253–54. Names: Kennedy, Salazar.'
      src:
        c: d290c415
        rows:
        - 'w.poole-joint-chiefs-of-staff 253–54: all'
      tags:
      - name:kennedy-john-f
      - name:salazar-antonio-de-oliveira
    section: '196107'
- add:
    entry:
      id: cal.1961-08.africa
      when: Aug.
      date: 1961-08
      thread: africa
      c: 'Portugal found diverting American-supplied equipment to its colonies; its requests held in suspense. Lisbon bitter.
        The Joint Chiefs: the Azores lease "seriously endangered"; begin preparing renewal, with "somewhat more liberal" military
        aid if needed.'
      n: '[[w.poole-joint-chiefs-of-staff]], 254.'
      src:
        c: 129219d8
        rows:
        - 'w.poole-joint-chiefs-of-staff 254: all'
    section: '196108'
- add:
    entry:
      id: cal.1962-06.africa
      when: June
      date: 1962-06
      thread: africa
      c: The United States asks Portugal to extend the Azores lease five years. Negotiations begin in November and go nowhere;
        Portugal lets the access continue without renewal.
      n: '[[w.poole-joint-chiefs-of-staff]], 254.'
      src:
        c: a40cca95
        rows:
        - 'w.poole-joint-chiefs-of-staff 254: all'
    section: '196206'
- add:
    entry:
      id: cal.1963-08.africa
      when: Aug.
      date: 1963-08
      thread: africa
      c: 'McNamara answers Kennedy on offsetting the loss of Lajes: refueling in the air, transports by Newfoundland, pre-positioning
        and C-141s, ASW from Rota. The Director of the Joint Staff to Taylor: "overly optimistic."'
      n: '[[w.poole-joint-chiefs-of-staff]], 254. Check: the month; Poole: after the Security Council''s resolution of July
        31. See [[cal.1963-07-31.africa]]. Names: McNamara, Kennedy, Taylor.'
      src:
        c: 513076f3
        rows:
        - 'w.poole-joint-chiefs-of-staff 254: all'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      - name:taylor-maxwell
    section: '196308'
- add:
    entry:
      id: cal.1962-01.africa
      when: Jan., winter
      date: 1962-01
      thread: africa
      c: 'State''s draft guidelines on South Africa. The Joint Chiefs to McNamara: no pressure on its racial policies carried
        to "internal disintegration and anarchy." ISA agrees; State makes no change.'
      n: '[[w.poole-joint-chiefs-of-staff]], 254. Check: the month; Poole: "During the winter of 1961–62." Names: McNamara.'
      src:
        c: a2371548
        rows:
        - 'w.poole-joint-chiefs-of-staff 254: all'
      tags:
      - name:mcnamara-robert-s
    section: '196201'
- add:
    entry:
      id: cal.1964-08.africa
      when: Aug.
      date: 1964-08
      thread: africa
      c: 'Lockheed seeks leave to sell South Africa sixteen ASW aircraft. The Joint Chiefs "strongly" for it; McNamara to
        Johnson: South Africa''s ASW not "essential to our national defense," a political decision. The sale disapproved.'
      n: '[[w.poole-joint-chiefs-of-staff]], 255. Check: the month; Poole: "One year later," after August 1963. Names: McNamara,
        Johnson.'
      src:
        c: c8d9fe57
        rows:
        - 'w.poole-joint-chiefs-of-staff 255: all'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
    section: '196408'
- add:
    entry:
      id: cal.1964-03.africa
      when: Mar.
      date: 1964-03
      thread: africa
      c: 'State''s draft National Policy Paper on South Africa: an improved international position for a racial policy acceptable
        to all, graduated pressures if refused. The Joint Chiefs: the dialogue "patient and friendly"; "stability in South
        Africa is desirable under all circumstances."'
      n: '[[w.poole-joint-chiefs-of-staff]], 255.'
      src:
        c: 147275f6
        rows:
        - 'w.poole-joint-chiefs-of-staff 255: all'
    section: '196403'
- add:
    entry:
      id: cal.1964-05-22.africa
      when: May 22
      date: '1964-05-22'
      thread: africa
      c: 'The Joint Chiefs to McNamara on NSAM 295: "reminiscent of attempts made by the United States, with tragic consequences,
        to influence the domestic policies of the Chiang Kai-shek government in 1946 and the Batista government in 1958."
        ISA asks State to delay any decision on sanctions.'
      n: '[[w.poole-joint-chiefs-of-staff]], 255. See [[cal.1964-04-24.africa]]. Names: McNamara.'
      src:
        c: dc5e9ca6
        rows:
        - 'w.poole-joint-chiefs-of-staff 255: all'
      tags:
      - name:mcnamara-robert-s
    section: '196405'
- add:
    entry:
      id: cal.1965-01.africa
      when: Jan.
      date: 1965-01
      thread: africa
      c: A National Policy Paper on South Africa issued, centered on diplomatic efforts.
      n: '[[w.poole-joint-chiefs-of-staff]], 255. See [[cal.1964-03.africa]].'
      src:
        c: f6e1b11c
        rows:
        - 'w.poole-joint-chiefs-of-staff 255: all'
    section: '196501'
- add:
    entry:
      id: cal.1960-07.congo
      when: July
      date: 1960-07
      thread: congo
      c: American aircraft begin flying the UN's contingents into Léopoldville. By the end of August the Belgian units gone
        and the UN force near 20,000.
      n: '[[w.poole-joint-chiefs-of-staff]], 256. Check: the day; Poole: "promptly," after the Security Council''s resolution.
        See [[cal.1960-07-13.congo]].'
      src:
        c: '77438321'
        rows:
        - 'w.poole-joint-chiefs-of-staff 256: all'
    section: '196007'
- add:
    entry:
      id: cal.1961-01-30.congo
      when: Jan. 30
      date: '1961-01-30'
      thread: congo
      c: 'The Joint Chiefs to McNamara on the Congo, after the J-5''s assessment: "unless immediate and strong action is taken
        now there is the definite possibility that the entire Republic of the Congo will soon be under the control of a Communist-dominated
        regime." Press Hammarskjöld to restore order and replace Dayal; the Sudan to stop Soviet supplies to Gizenga; covert
        operations against Stanleyville. Burke''s and Decker''s harder measures dropped.'
      n: '[[w.poole-joint-chiefs-of-staff]], 256–57. Names: McNamara, Burke, Decker, Hammarskjöld, Gizenga.'
      src:
        c: 2484d2c1
        rows:
        - 'w.poole-joint-chiefs-of-staff 256–57: all'
      tags:
      - name:mcnamara-robert-s
      - name:burke-arleigh-a
      - name:decker-george-h
      - name:hammarskjold-dag
      - name:gizenga-antoine
    section: '196101'
- add:
    entry:
      id: cal.1961-02.congo
      when: Feb.
      date: 1961-02
      thread: congo
      c: 'The Joint Chiefs, on the task force''s "new" policies, a broad coalition would push Lumumba "to the forefront";
        Kasavubu''s strong central government best. To Nitze: UN forces regionally organized and mobile; American intervention
        possible, two Army divisions and a Marine division/wing team, CINCLANT''s plan to occupy Léopoldville and a line to
        the sea.'
      n: '[[w.poole-joint-chiefs-of-staff]], 257. Check: the days. See [[cal.1961-02-01.congo]]. Names: Lumumba, Kasavubu,
        Nitze.'
      src:
        c: 1558dbcb
        rows:
        - 'w.poole-joint-chiefs-of-staff 257: all'
      tags:
      - name:lumumba-patrice
      - name:kasavubu-joseph
      - name:nitze-paul
    section: '196102'
- add:
    entry:
      id: cal.1961-02-21.congo
      when: Feb. 21
      date: '1961-02-21'
      thread: congo
      c: 'The Security Council strengthens the UN''s mandate in the Congo, calls for the withdrawal of foreign military and
        political advisers and the parliament''s convening. The Joint Chiefs, the same day: the Gizenga regime "the one factor
        which is most seriously aggravating the situation"; support the Sudan against Nasser''s pressure for transit rights.'
      n: '[[w.poole-joint-chiefs-of-staff]], 258. Names: Gizenga, Nasser.'
      src:
        c: dffc1fbd
        rows:
        - 'w.poole-joint-chiefs-of-staff 258: all'
      tags:
      - name:gizenga-antoine
      - name:nasser-gamal-abdel
    section: '196102'
- add:
    entry:
      id: cal.1961-08-01.congo
      when: Aug. 1
      date: '1961-08-01'
      thread: congo
      c: The Congo's parliament approves a Government of National Unity, Adoula Prime Minister, Washington's choice; Gizenga
        Deputy Prime Minister, the Stanleyville regime dissolved. Dayal removed under American pressure.
      n: '[[w.poole-joint-chiefs-of-staff]], 258. Names: Adoula, Gizenga.'
      src:
        c: 6b5c112b
        rows:
        - 'w.poole-joint-chiefs-of-staff 258: all'
      tags:
      - name:adoula-cyrille
      - name:gizenga-antoine
    section: '196108'
