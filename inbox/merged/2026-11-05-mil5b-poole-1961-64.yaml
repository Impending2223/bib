    entry:
      id: cal.1962-01.latin-america
      when: Jan.
      date: 1962-01
      thread: latin-america
      c: The Joint Chiefs send McNamara a list of 46 projects for military collaboration with Latin America; action under
        way on 39 by the autumn.
      n: '[[w.poole-joint-chiefs-of-staff]], 228, 230. See [[cal.1961-12-05.latin-america]]. Names: McNamara.'
