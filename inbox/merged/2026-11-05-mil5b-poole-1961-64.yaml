- add:
    entry:
      id: cal.1961-08-17.berlin-and-vienna-2
      when: Aug. 17
      date: '1961-08-17'
      thread: berlin-and-vienna
      c: The White House. Lemnitzer presents the Joint Chiefs' proposal to send a battle group down the Helmstedt autobahn
        to West Berlin; many of the President's advisers call it needlessly provocative. Kennedy rules that a battle group
        will go.
      n: '[[w.poole-joint-chiefs-of-staff]], 149. Names: Lemnitzer, Kennedy.'
      src:
        c: a0c2b675
        rows:
        - 'w.poole-joint-chiefs-of-staff 149: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:kennedy-john-f
    section: '196108'
- add:
    entry:
      id: cal.1961-08-23.berlin-and-vienna
      when: Aug. 23
      date: '1961-08-23'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Moscow accuses the Western powers of "clearly abusing" the air corridors to Berlin, flying in "revanchists, extremists,
        saboteurs, spies"; the corridors granted "temporarily for provision of their military garrisons." Nitze to McNamara,
        Aug. 24: a "fundamental reappraisal" of the July decision for "restrained, gradual military strengthening."'
      n: '[[w.poole-joint-chiefs-of-staff]], 149. Names: Nitze, McNamara.'
      src:
        c: eea03d6f
        rows:
        - 'w.poole-joint-chiefs-of-staff 149: all'
      tags:
      - name:nitze-paul
      - name:mcnamara-robert-s
    section: '196108'
- add:
    entry:
      id: cal.1961-09-01.berlin-and-vienna-2
      when: Sept. 1
      date: '1961-09-01'
      thread: berlin-and-vienna
      c: 'Kennedy changes the instructions of Aug. 31 on the air corridors: Washington, not the field commanders, to decide
        on fighter escorts; unescorted transports to "make every effort to continue on course to destination despite harassment."
        Lemnitzer: the "clean cut" decisions vitiated.'
      n: '[[w.poole-joint-chiefs-of-staff]], 150. See [[cal.1961-08-31.berlin-and-vienna]]. Names: Kennedy, Lemnitzer.'
      src:
        c: 096f7a1d
        rows:
        - 'w.poole-joint-chiefs-of-staff 150: all'
      tags:
      - name:kennedy-john-f
      - name:lemnitzer-lyman-l
    section: '196109'
- add:
    entry:
      id: cal.1961-09-01.berlin-and-vienna-3
      when: Sept. 1
      date: '1961-09-01'
      thread: berlin-and-vienna
      c: 'Kennedy authorizes more aircraft to Europe after the Soviet announcement of testing. LeMay agrees with Norstad at
        Paris: twenty B-47s to Spain, freeing three F-100 squadrons for non-nuclear missions; four F-100 squadrons to France
        and Germany, as a training exercise.'
      n: '[[w.poole-joint-chiefs-of-staff]], 150–51. Names: Kennedy, LeMay, Norstad.'
      src:
        c: e412664f
        rows:
        - 'w.poole-joint-chiefs-of-staff 150–51: all'
      tags:
      - name:kennedy-john-f
      - name:lemay-curtis-e
      - name:norstad-lauris
    section: '196109'
- add:
    entry:
      id: cal.1961-09-02.berlin-and-vienna
      when: Sept. 2
      date: '1961-09-02'
      thread: berlin-and-vienna
      c: Early evening. The Joint Chiefs recommend to the White House that Norstad, not Washington, decide on fighter protection
        in the air corridors; Taylor agrees; the orders issued at once. Norstad asks leave to retaliate against anti-aircraft
        sites; Rusk will not act alone, without the allies.
      n: '[[w.poole-joint-chiefs-of-staff]], 150. See [[cal.1961-09-01.berlin-and-vienna-2]]. Names: Norstad, Taylor, Rusk.'
      src:
        c: f5b27be2
        rows:
        - 'w.poole-joint-chiefs-of-staff 150: all'
      tags:
      - name:norstad-lauris
      - name:taylor-maxwell
      - name:rusk-dean
    section: '196109'
- add:
    entry:
      id: cal.1961-09-06.berlin-and-vienna
      when: Sept. 6
      date: '1961-09-06'
      thread: berlin-and-vienna
      c: 'The Joint Chiefs take the Joint Staff''s paper for talks with McNamara: quicken the buildup "by every possible means";
        four regular divisions to Europe and four reserve divisions activated; 34 air squadrons sent and 34 called up.'
      n: '[[w.poole-joint-chiefs-of-staff]], 151. Names: McNamara.'
      src:
        c: ea8d5084
        rows:
        - 'w.poole-joint-chiefs-of-staff 151: all'
      tags:
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-09-11.berlin-and-vienna
      when: Sept. 11
      date: '1961-09-11'
      thread: berlin-and-vienna
      c: 'Lemnitzer to McNamara, his own answers to the President''s eight questions: six more divisions would show leadership
        but could not restore ground access; thirty divisions could defend "a significant" time; mobilize before regulars
        move, Laos and Berlin both near boiling; stocks for about sixty days; the Soviets could raise 26 divisions in Eastern
        Europe to 61, use no more than 55 offensively.'
      n: '[[w.poole-joint-chiefs-of-staff]], 152. See [[cal.1961-09-09.berlin-and-vienna]]. Names: Lemnitzer, McNamara.'
      src:
        c: 1faefa90
        rows:
        - 'w.poole-joint-chiefs-of-staff 152: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-09-16.berlin-and-vienna-2
      when: Sept. 16
      date: '1961-09-16'
      thread: berlin-and-vienna
      c: 'Norstad answers McNamara: "We must not confuse the wish with the fact"; no "independent, unilateral control over
        the battle"; the Pact able to employ upwards of 100 divisions in Central Europe; thirty days of conventional defense
        "unduly optimistic"; no more reinforcement until the 40,000 are absorbed.'
      n: '[[w.poole-joint-chiefs-of-staff]], 152–53. Names: Norstad, McNamara.'
      src:
        c: 8ce62a44
        rows:
        - 'w.poole-joint-chiefs-of-staff 152–53: all'
      tags:
      - name:norstad-lauris
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-09-18.berlin-and-vienna-2
      when: Sept. 18
      date: '1961-09-18'
      thread: berlin-and-vienna
      c: 'McNamara puts to the Joint Chiefs, mornings, four Guard divisions mobilized and one regular division to Europe.
        The Chiefs at the Pentagon: two divisions for Norstad "if and when he wants them," two Guard divisions called Oct.
        1; Wheeler telephones it to the White House. There, LeMay, Acting Chairman: Lemnitzer and Decker for as many as six
        divisions to Europe, the others against any move now. Kennedy approves calling two Guard divisions.'
      n: '[[w.poole-joint-chiefs-of-staff]], 153. Announced: [[cal.1961-09-19.berlin-and-vienna-2]]. Names: McNamara, Norstad,
        Wheeler, LeMay, Lemnitzer, Decker, Kennedy.'
      src:
        c: 793f8066
        rows:
        - 'w.poole-joint-chiefs-of-staff 153: all'
      tags:
      - name:mcnamara-robert-s
      - name:norstad-lauris
      - name:wheeler-earle
      - name:lemay-curtis-e
      - name:lemnitzer-lyman-l
      - name:decker-george-h
      - name:kennedy-john-f
    section: '196109'
- add:
    entry:
      id: cal.1961-09-22.berlin-and-vienna-2
      when: Sept. 22
      date: '1961-09-22'
      thread: berlin-and-vienna
      c: The Joint Chiefs to McNamara, split on Lemnitzer's answers to the President's questions; Decker concurs, Anderson,
        LeMay and Shoup disagree fundamentally.
      n: '[[w.poole-joint-chiefs-of-staff]], 153. See [[cal.1961-09-11.berlin-and-vienna]]. Names: McNamara, Lemnitzer, Decker,
        Anderson, LeMay, Shoup.'
      src:
        c: 0a5aeded
        rows:
        - 'w.poole-joint-chiefs-of-staff 153: all'
      tags:
      - name:mcnamara-robert-s
