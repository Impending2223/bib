      when: June
      date: 1962-06
      thread: middle-east
      c: 'State''s guidelines on arms for Israel published in ISA''s words: "Be prepared to consider occasional sale of light
        weapons and equipment particularly suitable for defensive purposes."'
      n: '[[w.poole-joint-chiefs-of-staff]], 238. See [[cal.1962-02.middle-east]].'
      src:
        c: 20a45bb8
        rows:
        - 'w.poole-joint-chiefs-of-staff 238: all'
    section: '196206'
