- add:
    entry:
      id: cal.1961-12.foreign-aid-3
      when: Dec., late
      date: 1961-12
      thread: foreign-aid
      c: 'McNamara tentatively sets the military aid request at $1.7 billion. The Joint Chiefs: even the $1.885 billion first
        sought for fiscal 1962 left shortfalls; deliveries at $2.4 billion a year would need $2.2 billion in new authority.'
      n: '[[w.poole-joint-chiefs-of-staff]], 220. Check: the month and the fiscal year; Poole: "Late in 1961," "the FY 1962
        MAP request." Names: McNamara.'
      src:
        c: 7a30d0a1
        rows:
        - 'w.poole-joint-chiefs-of-staff 220: all'
      tags:
      - name:mcnamara-robert-s
    section: '196112'
- add:
    entry:
      id: cal.1963-11.middle-east
      when: Nov., mid-month
      date: 1963-11
      thread: middle-east
      c: 'An Israeli delegation in Washington to buy weapons not strictly defensive: Egypt''s missiles and forces growing;
        1,000 modern tanks needed against an Arab 3,000 by 1965. ISA for selective sales of "so-called" offensive weapons;
        the Joint Chiefs: the "substantial military equilibrium" not upset; first an agreement restricting the flow of arms.'
      n: '[[w.poole-joint-chiefs-of-staff]], 240.'
      src:
        c: 9e1ce726
        rows:
        - 'w.poole-joint-chiefs-of-staff 240: all'
    section: '196311'
- add:
    entry:
      id: cal.1964-01.middle-east-2
      when: Jan., early
      date: 1964-01
      thread: middle-east
      c: 'Israel asks urgently to buy tanks, 200 M-48A3s and 100 M-60s for its Shermans, 100 M-60s more. The Joint Chiefs:
        Israel could defeat attacks on all four fronts; Arab tanks 1,932 to 734, less than it looks; replacing 300 Shermans
        "militarily sound," no more.'
      n: '[[w.poole-joint-chiefs-of-staff]], 240–41. See [[cal.1964-02.middle-east]].'
      src:
        c: a950fef8
        rows:
        - 'w.poole-joint-chiefs-of-staff 240–41: all'
    section: '196401'
- add:
    entry:
      id: cal.1965-01.middle-east
      when: Jan.
      date: 1965-01
      thread: middle-east
      c: Word reaches Cairo of West Germany's sale of 150 M-48s to Israel, arranged by Washington with 150 British Centurions;
        Bonn, pressed, cancels. The United States later sells Israel 210 M-48A3s.
      n: '[[w.poole-joint-chiefs-of-staff]], 241. Check: the month; Poole: "early in 1965."'
      src:
        c: cb1c4bb6
        rows:
        - 'w.poole-joint-chiefs-of-staff 241: all'
    section: '196501'
- add:
    entry:
      id: cal.1962-01.middle-east
      when: Jan.
      date: 1962-01
      thread: middle-east
      c: Britain nominates General Sir Charles Jones as CENTO's Commander, Military Planning Staff. Pakistan will accept only
        an American; Washington offers none.
      n: '[[w.poole-joint-chiefs-of-staff]], 248. Check: the month; Poole: "early in 1962."'
      src:
        c: 215efa98
        rows:
        - 'w.poole-joint-chiefs-of-staff 248: all'
    section: '196201'
- add:
    entry:
      id: cal.1964-12.japan
      when: Dec.
      date: 1964-12
      thread: japan
      c: State agrees the fundamental policies for the Ryukyus sound and the American administration effective; progress in
        the problem areas has lessened pressure for change.
      n: '[[w.poole-joint-chiefs-of-staff]], 292. Check: the day; Poole: "By December 1964."'
      src:
        c: e1b9ef22
        rows:
        - 'w.poole-joint-chiefs-of-staff 292: all'
