      - name:mcnamara-robert-s
    section: '196404'
- add:
    entry:
      id: cal.1964-06.europe-and-the-alliance
      when: June
      date: 1964-06
      thread: europe-and-the-alliance
      c: 'McNamara to Rusk: State and Defense agree on the major aspects of NATO strategy; reconciling the rest might prove
        counter-productive.'
      n: '[[w.poole-joint-chiefs-of-staff]], 213. Names: McNamara, Rusk.'
      src:
