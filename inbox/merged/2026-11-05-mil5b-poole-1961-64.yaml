      when: Apr.
      date: 1961-04
      thread: middle-east-dimona
      c: 'Two American scientists tour Dimona: "no present evidence that the Israelis have weapons production in mind."'
      n: '[[w.poole-joint-chiefs-of-staff]], 241. See [[cal.1960-12-08.middle-east]].'
