      id: cal.1963-07.middle-east
      when: July
      date: 1963-07
      thread: middle-east
      c: 'Iraq''s requests grown to supersonic fighters, transports, eight-inch howitzers and hundreds of trucks. The Joint
        Chiefs for favorable answers within policy: the Ba''th anti-Nasser and anti-Soviet, perhaps to align with the West;
        "a firm Iraqi military position, coupled with a willingness to accommodate legitimate Kurdish grievances."'
      n: '[[w.poole-joint-chiefs-of-staff]], 237–38. See [[cal.1963-04-18.middle-east]].'
      src:
        c: ffbc2384
        rows:
        - 'w.poole-joint-chiefs-of-staff 237–38: all'
    section: '196307'
- add:
