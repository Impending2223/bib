patch: 2026-11-06-b6-wofford-of-kennedys
by: 'Claude (batch 6: the private, social and draft rows re-ruled; Wofford, Of Kennedys and Kings, 1980), Nov. 10, 2026'
ops:
- add:
    entry:
      id: cal.1960-05.elections-1960-kennedy
      when: May
      date: 1960-05
      thread: elections-1960-kennedy
      c: 'Wofford''s first day on the campaign staff in Washington. Sorensen takes him to lunch: Goodwin, not Wofford, now
        the key speechwriter; Shriver, "the house Communist" to the family, no help to him; whatever helps assure Kennedy''s
        nomination and election is good, whatever hinders it bad. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 43–44. Check: the day; after his classes ended May 1 (43). Names: Wofford,
        Sorensen, Goodwin, Shriver, Kennedy.'
      src:
        c: ae5e3142
        rows:
        - 'w.wofford-of-kennedys-and-kings 43–44: all'
      tags:
      - 'name:wofford-harris'
      - 'name:sorensen-theodore-c'
      - 'name:goodwin-richard-n'
      - 'name:shriver-r-sargent'
      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1960-11-08.elections-1960-king
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-king
      c: 'Election day. Raymond Jones, the Harlem Democratic leader, telephones Wofford: the Constitutional Rights Conference
        and the King call "one-two knockout blows," a massive turnout of Negroes for Kennedy throughout New York; "It was
        like a symphony ... working up to a great last movement." By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 65. See [[cal.1960-10-25.king]]. Names: Wofford.'
      src:
        c: cbc20058
        rows:
        - 'w.wofford-of-kennedys-and-kings 65: all'
      tags:
      - 'name:wofford-harris'
- add:
    entry:
      id: cal.1960-11-10.elections-1960-nixon
      when: Nov. 10
      date: '1960-11-10'
      thread: elections-1960-nixon
      also:
      - elections-1960-king
      c: 'Two days after the election. Nixon''s chauffeur: his people were for Nixon until Robert Kennedy called the judge
        to get King out of jail. Nixon: "If there was any fault involved it was not with your people: it was mine, in failing
        to get my point of view across to them." By Nixon''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 26 (quoting Nixon). To check: [[w.nixon-six-crises]]. See [[cal.1960-10-25.king]].
        Names: Nixon, Robert Kennedy, Martin Luther King.'
      src:
        c: 5dcd589d
        rows:
        - 'w.wofford-of-kennedys-and-kings 26: all'
      tags:
      - 'name:nixon-richard-m'
      - 'name:kennedy-robert-f'
      - 'name:king-martin-luther-jr'
- add:
    entry:
      id: cal.1960-11.transition-and-staff-cabinet-3
      when: Nov.
      date: 1960-11
      thread: transition-and-staff-cabinet
      also:
      - georgia
      c: 'Atlanta and towns of Georgia, the Field Foundation''s trustees on tour, Southern economic development and race relations.
        Stevenson, on a long bus ride with Wofford, on the Kennedys and his foreign policy report; plainly hoping to be Secretary
        of State. Crowds greet Stevenson at each stop. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 79–80. Check: the day; Wofford: "During this period," after Sharon took the
        report to Palm Beach in mid-November. Names: Stevenson, Wofford.'
      src:
        c: 8ef4ba0f
        rows:
        - 'w.wofford-of-kennedys-and-kings 79–80: all'
      tags:
      - 'name:stevenson-adlai-e'
      - 'name:wofford-harris'
- add:
    entry:
      id: cal.1960-12.transition-and-staff-5
      when: Dec.
      date: 1960-12
      thread: transition-and-staff
      c: 'The talent search''s office, supper time. The President-elect telephones, asks who is leaking the Cabinet names,
        and has the secretary tell Yarmolinsky, Shriver, Wofford and anyone else that if they are doing it they had better
        stop. Most of the leaks, they later learn, came from Kennedy himself. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 74. Check: the month; Wofford: during the weeks of the talent search. Names:
        Kennedy, Yarmolinsky, Shriver, Wofford.'
      src:
        c: e2d011f9
        rows:
        - 'w.wofford-of-kennedys-and-kings 74: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:yarmolinsky-adam'
      - 'name:shriver-r-sargent'
      - 'name:wofford-harris'
- add:
    entry:
      id: cal.1961-01-19.transition-and-staff
      when: Jan. 19
      date: '1961-01-19'
      thread: transition-and-staff
      c: 'Late afternoon. Yarmolinsky and Wofford deliver the talent search''s files to the White House. The search for agency,
        ambassadorial and sub-Cabinet appointments to go on in the departments, under the White House; Macy, of the Civil
        Service Commission, to carry it on from the files. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 95. Names: Yarmolinsky, Wofford, Macy.'
      src:
        c: f713e981
        rows:
        - 'w.wofford-of-kennedys-and-kings 95: all'
      tags:
      - 'name:yarmolinsky-adam'
      - 'name:wofford-harris'
      - 'name:macy-john-w-jr'
- add:
    entry:
      id: cal.1968-08-30.elections-1968-chicago-streets-2
      when: Aug. 30
      date: '1968-08-30'
      thread: elections-1968-chicago-streets
      c: 'Chicago, about 3 a.m. Wofford, arrested at Eighteenth Street the evening before, before a night court: disorderly
        conduct, having "failed to obey a lawful order of dispersal"; bail $500. In the lockup with him Murray Kempton, a
        New York McCarthy delegate, and Tom Buckley of the *New York Times*, back from Vietnam. By Wofford''s account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 441–43. See [[cal.1968-08-29.elections-1968-chicago-5]]. Names: Wofford.'
      src:
        c: 9e39b840
        rows:
        - 'w.wofford-of-kennedys-and-kings 441–43: all'
      tags:
      - 'name:wofford-harris'
