      c: 'Des Moines. Hughes''s inaugural address to the Republican legislature: "It is sometimes said that the knack of skillful government is to hang back, to do as little as possible, and make no mistakes"; "I hope there is another way."'
      n: '[[w.peirce-great-plains-states-of]], 95. Check: the day; a text of the address. See [[cal.1962-11-06.governors-ia]]. Names: Hughes.'
      tags:
      - state:ia
