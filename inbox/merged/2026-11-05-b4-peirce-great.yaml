      date: 1967-06
      thread: civil-disorders
      c: Minneapolis, summer. Small riots again, the second summer running.
      n: '[[w.peirce-great-plains-states-of]], 131. Check: the days. See [[cal.1966-06.states-and-cities-minneapolis]].'
      tags:
