- add:
    entry:
      id: cal.1961-07.states-and-cities-ne
      when: July
      date: 1961-07
      thread: states-and-cities
      c: 'McCook, Neb., a dinner for the centenary of George Norris''s birth. Sorensen, the President''s special counsel, on Nebraska''s schools: budgets cut, federal aid opposed, teachers underpaid, the young leaving; the State left "a place to come from or a place to die." Nebraska Republicans demand that the Democrats apologize.'
      n: '[[w.peirce-great-plains-states-of]], 198–99. Check: the day; a text of the speech. Names: Sorensen.'
      tags:
      - state:ne
      - name:sorensen-theodore-c
    section: '196107'
- add:
    entry:
      id: cal.1964-06-07.republican-party-2
      when: June 7
      date: '1964-06-07'
      thread: republican-party
      also:
      - elections-1964
      c: 'Cleveland, the Governors'' Conference. Anderson of Kansas, the Conference''s chairman, has Rockefeller, Scranton, Romney and Rhodes to his hotel suite, and Eisenhower, by Peirce''s account: to unite the moderates against Goldwater, behind Scranton. Eisenhower, persuaded by George Humphrey, will not oppose Goldwater.'
      n: '[[w.peirce-great-plains-states-of]], 236. Check: the day, Peirce dating it only to the conference, June 7–10; Eisenhower''s presence. See [[cal.1964-06-07.republican-party]]; [[cal.1964-06-06.elections-1964]]. Names: Anderson, Rockefeller, Scranton, Romney, Rhodes, Eisenhower, George Humphrey, Goldwater.'
      tags:
      - city:cleveland
      - state:ks
      - name:anderson-john-jr
      - name:rockefeller-nelson
      - name:scranton-william-w
      - name:romney-george-w
      - name:rhodes-james-a
      - name:eisenhower-dwight-d
      - name:humphrey-george-m
      - name:goldwater-barry-m
    section: '196406'
- add:
    entry:
      id: cal.1966-11.elections-1966-2
      when: Nov.
      date: 1966-11
      thread: elections-1966
      also:
      - democratic-party
      c: 'Hughes of Iowa, re-elected, breaks with Johnson after the midterms: to reporters, the confidence Johnson has lost among the Democratic governors. He begins to part from the administration''s Vietnam policy.'
      n: '[[w.peirce-great-plains-states-of]], 96–97. Check: the day; Peirce has it "shortly after that election," Nov. 8 (perhaps at White Sulphur Springs, Dec. 16–17). See [[cal.1966-12-16.elections-1966]]. Names: Hughes, Johnson.'
      tags:
      - state:ia
      - name:hughes-harold-e
      - name:johnson-lyndon-b
    section: '196611'
- add:
    entry:
