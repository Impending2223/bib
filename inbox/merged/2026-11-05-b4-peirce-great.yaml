    section: '196706'
- add:
    entry:
      id: cal.1965-12.states-and-cities-dallas
      when: Dec.
      date: 1965-12
      thread: states-and-cities
      c: 'Dallas. Mayor Jonsson''s "Days of Decision" speech to the downtown Rotary Club: "Shall we deal adequately with the future or be run over by it?" He names a Goals Planning Committee of 27, and asks twelve local writers for twelve essays on the city''s problems.'
      n: '[[w.peirce-great-plains-states-of]], 347. Check: the day. See [[cal.1964-02-03.mayors-dallas]]. Names: Jonsson.'
      tags:
      - state:tx
      - city:dallas
      - name:jonsson-j-erik
    section: '196512'
- add:
    entry:
      id: cal.1966-06.states-and-cities-dallas
      when: June
      date: 1966-06
      thread: states-and-cities
      c: 'Salado, Tex. The Goals for Dallas conference, three days: Jonsson''s committee enlarged from 27 to 87, ten Negroes among them, students, a fifth women. Its consensus and the twelve essays printed, 20,000 copies.'
      n: '[[w.peirce-great-plains-states-of]], 347–48. Check: the days; Peirce has it six months after the speech. See [[cal.1965-12.states-and-cities-dallas]]. Names: Jonsson.'
      tags:
      - state:tx
      - city:dallas
      - name:jonsson-j-erik
    section: '196606'
- add:
    entry:
      id: cal.1966-10.states-and-cities-dallas
      when: Oct.–Dec.
      date: 1966-10
      thread: states-and-cities
      c: Dallas, late in the year. Thirty-three town meetings on the goals, some 6,380 attending; the 87 reconvene and revise some 60 percent of their recommendations.
      n: '[[w.peirce-great-plains-states-of]], 348. Check: the months. See [[cal.1965-12.states-and-cities-dallas]].'
      tags:
      - state:tx
      - city:dallas
    section: '196610'
- add:
    entry:
      id: cal.1966-06.states-and-cities-topeka
      when: June
      date: 1966-06
      thread: states-and-cities
      c: 'Topeka. A tornado across the city: 17 dead, 500 injured, 1,600 homeless, more than $100 million in damage.'
      n: '[[w.peirce-great-plains-states-of]], 242. Check: the day; the federal disaster declaration.'
      tags:
      - state:ks
      - city:topeka
    section: '196606'
