      when: June 4
      date: '1968-06-04'
      thread: robert-kennedy-campaign-california
      also:
      - elections-1968
      c: 'Los Angeles. Robert Kennedy, by telephone, congratulates Bill Dougherty of Sioux Falls, his South Dakota manager, on the Kennedy slate''s victory: half an hour before the shooting.'
      n: '[[w.peirce-great-plains-states-of]], 184. Check: the hour. See [[cal.1968-06-04.robert-kennedy-campaign]]. Names: Robert Kennedy.'
      tags:
      - state:sd
      - city:los-angeles
      - name:kennedy-robert-f
    section: '196806'
- add:
    entry:
      id: cal.1966-06.states-and-cities-minneapolis
      when: June–Aug.
      date: 1966-06
      thread: states-and-cities
      c: Minneapolis, summer. A night of vandalism on the near North Side, small riots. Mayor Naftalin, at a meeting there the next day, meets Ronald Edwards, a young Negro militant, later his appointee to the new human relations commission.
      n: '[[w.peirce-great-plains-states-of]], 131–32. Check: the night. Names: Naftalin.'
      tags:
      - state:mn
      - city:minneapolis
      - name:naftalin-arthur
