patch: threads-5
by: Claude (thread statements, stage 6, agent 5)
ops:
  - edit:
      id: cal.thread.amendments
      base: b5b7bb48
      set:
        c: "Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The Twenty-third Amendment through Congress, Hawaii first; the equal rights amendment recommitted; Arkansas refusing; the Twenty-third ratified; Kefauver's hearings; the Kennedy–Johnson agreement on inability; the District's electors put into law; the poll tax amendment through both Houses, Illinois first, Mississippi refusing; *Engel* and the prayer amendments; the Council of State Governments' three amendments."
        c2: "Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The telegram to the governors and the poll tax amendment ratified, the Twenty-fourth; the Court of the Union in Gallup; the women's commission, no equal rights amendment; Bayh's amendment on inability and the Vice Presidency, from the hearings through both Houses to the States; the Becker amendment's hearings; the apportionment amendments, Dirksen's refused in the Senate; the equal rights amendment reported; the four-year House term heard; the applications for a convention, 1963–65."
        c3: "Amendments to the Constitution of the United States, proposed in Congress or sought by the States' applications under Article V, and their course to ratification or defeat. The four-year House term asked and heard; the electoral college reform asked again and heard; the prayer amendment introduced; Dirksen's apportionment amendment refused again; the prayer amendment heard and refused; the Twenty-fifth Amendment ratified and certified; the District's representation asked, heard, reported; Ervin's convention bill heard; the applications for an apportionment convention, thirty-two of thirty-four; the vote at eighteen heard and asked; Gallup's questions."
  - edit:
      id: cal.thread.antisubversion
      base: 79d0e272
      set:
        c: "The committees, laws, oaths and prosecutions against subversion: the States' committees and acts, the Subversive Activities Control Board, the Bureau's lists. Mississippi's Sovereignty Commission and the Citizens' Council; the Burns committee's report; Robert Kennedy on prosecuting the Communist Party; King on the Bureau's emergency list; its investigation of King and the SCLC; Proposition 24 refused."
        c2: "The committees, laws, oaths and prosecutions against subversion: the States' committees and acts, the Subversive Activities Control Board, the Bureau's lists. Alabama's Commission to Preserve the Peace; North Carolina's Speaker Ban; Alabama's Sovereignty Commission; the raid on the SCEF at New Orleans; the Johns Committee's report and end; *Baggett v. Bullitt*; the Speaker Ban amended."
        c3: "The committees, laws, oaths and prosecutions against subversion: the States' committees and acts, the Subversive Activities Control Board, the Bureau's lists. *Keyishian*; Robert Kennedy against the Board; the Board kept, registration dropped; California's disclaimer oath struck; *Schneider v. Smith*; the Ichord subcommittee on the Chicago convention."
  - edit:
      id: cal.thread.china
      base: 664c2e36
      set:
        c: "Communist China: its bomb, its seat at the UN, its quarrel with Moscow, its part in Vietnam, the ambassadorial talks at Warsaw. The Soviet experts recalled; Peking kept out of the UN another year; the refugees at Hong Kong paroled; the attack on India, the cease-fire."
        c2: "Communist China: its bomb, its seat at the UN, its quarrel with Moscow, its part in Vietnam, the ambassadorial talks at Warsaw. Liu Shaoqi at Hanoi; the test ban refused; France recognizes Peking; Zhou Enlai's cable on the Gulf of Tonkin; China's first atomic test; Zhou Enlai in Moscow; Kosygin with Mao; the Warsaw talks on the war; Chen Yi's four points through London; the engineers and the antiaircraft divisions into North Vietnam; Lin Biao's \"people's war\"; Gallup on its admission."
        c3: "Communist China: its bomb, its seat at the UN, its quarrel with Moscow, its part in Vietnam, the ambassadorial talks at Warsaw. Gallup on its admission; the China hearings, Humphrey on containment without isolation; \"reconciliation\" at the Alumni Council; China's third test; the Cultural Revolution, the Sixteen Points, the Red Guards; the seat refused; Gallup on the threat to peace; Nixon with Ceaușescu and Chiang; the hydrogen bomb; the \"Chinese-oriented\" ABM; Nixon's \"Asia After Viet Nam\"; Rusk's \"billion Chinese\"; Chen Yi to Lê Đức Thọ; the Warsaw talks put off."
  - edit:
      id: cal.thread.democratic-party
      base: 95156ea9
      set:
        c: "The Democratic Party: its national committee and chairmen, its caucuses, conferences and leaders in Congress, its State parties, factions and allied groups, and the word of its members and figures on policy and politics. Wisconsin's delegates reallotted; the Advisory Council on the Paris summit; the liberals for Kennedy; Thurmond on the platform; Johnson's bid to keep the Senate conference's chair, the caucus's vote; Americans for Democratic Action with Kennedy; Corbin at the national committee; the meetings with the party's members on the midterms; the birthday gala; Humphrey's poll on a tax cut; Edward Kennedy endorsed at Springfield."
        c2: "The Democratic Party: its national committee and chairmen, its caucuses, conferences and leaders in Congress, its State parties, factions and allied groups, and the word of its members and figures on policy and politics. Bass and Jennings to Ways and Means; Truman on the tax cut and the test ban; the first strategy meetings for 1964; Robert Kennedy and the Vice Presidency; Mississippi's precinct meetings and conventions, the Freedom Democrats' challenge; Johnson's strategy session on it; Atlantic City, the Credentials Committee; O'Brien's reports on the races; the House caucus strips Watson and Williams of their seniority; the Steering Committee for Johnson's Vietnam program; the loyal Democrats of Mississippi with Humphrey."
        c3: "The Democratic Party: its national committee and chairmen, its caucuses, conferences and leaders in Congress, its State parties, factions and allied groups, and the word of its members and figures on policy and politics. Citizens for Kennedy/Fulbright; Farley against Robert Kennedy at Hartford; the House Democrats against the war's supplemental; Johnson to the national committee on a \"dishonorable settlement\"; Finletter's dinner for McCarthy; the New York State dinner; the Mississippi Young Democrats; the Freedom Democrats' challenge for Chicago; the Conference of Concerned Democrats; the regional conference at Salt Lake City; Governor Guy on the war; the Loyal Democrats of Mississippi; the House caucus, McCormack over Udall; Edward Kennedy whip over Long."
  - edit:
      id: cal.thread.elections-1962
      base: a7252a5b
      set:
        c: "The campaigns, primaries and midterms of 1962. Kennedy's Senate seat to Smith; Nixon for governor; the Conservative Party of New York; Romney declares; Wallace and Connally nominated; Nixon over Shell; Edward Kennedy against McCormack; Kennedy on the stump; Nov. 6, Brown over Nixon, Romney, Scranton and Rhodes; Nixon's last press conference."
        c2: "The campaigns, primaries and midterms of 1962. Minnesota's recount, Rolvaag declared elected."
  - edit:
      id: cal.thread.elections-1968
      base: 1543dec8
      set:
        c: "The 1968 election, from the race for the nominations to the count. Rockefeller will not run; Javits New York's favorite son for the Vice Presidency; Buchanan to Nixon's staff; Nixon: \"I do not expect to be a nominee again.\""
        c3: "The 1968 election, from the race for the nominations to the count. Robert Kennedy's draft; Nixon's holiday from politics and his planning at the Waldorf; Romney's \"brainwashing\" and his announcement; McCarthy against Johnson; Nixon and Wallace announce; Romney withdraws; New Hampshire; Robert Kennedy announces; the Mar. 31 address; Humphrey and Rockefeller announce; the primaries (CQ's returns); Oregon; Kennedy shot at Los Angeles; Chennault and Bùi Diễm; Miami Beach, Nixon and Agnew; Chicago, the streets and the Vietnam plank, Humphrey and Muskie; LeMay; Salt Lake City; the bombing halt; Nixon elected; the electoral votes counted."
  - edit:
      id: cal.thread.electoral-college
      base: d567ab39
      set:
        c: "The electoral college: its electors, pledged, unpledged and faithless, the count in Congress, and the proposals to change it. Alabama's unpledged electors nominated; electors for the District through Congress; Oklahoma's electors by convention; Mississippi's unpledged electors elected; Harris's call to the Southern electors; Byrd's fifteen votes; Hawaii's recount and its three certificates; the count; the Twenty-third Amendment ratified; Kefauver's hearings, Irwin before them; the District's electors put into law."
        c2: "The electoral college: its electors, pledged, unpledged and faithless, the count in Congress, and the proposals to change it. Alabama's unpledged electors again, no Johnson electors on its ballot; Mississippi's unpledged-elector law upheld; the District's first vote for President; the count with the Vice Presidency vacant; Johnson's amendment, each State's votes to those who carry it; Nebraska's and Oklahoma's applications."
        c3: "The electoral college: its electors, pledged, unpledged and faithless, the count in Congress, and the proposals to change it. The administration's plan asked again and heard; Gallup on a national vote; Delaware's suit against the unit rule, refused; Bayh's direct election; the Bar Association's commission for it; the hearings of 1967, nothing reported; Nixon elected; the electors of 1968, Bailey's vote for Wallace; the count and the objection."
  - edit:
      id: cal.thread.laos
      base: 2c8d7d73
      set:
        c: "The Laos crisis, from Kong Le's coup to the Geneva accords, and the war in Laos after. The Assembly election; Kong Le; Savannakhet; the battle of Vientiane; Eisenhower's warning at the transition; the March maps; the advisers in uniform; the April meetings on intervention; the cease-fire; the conference; Nam Tha; troops to Thailand; the coalition; the neutrality declaration; Laird's letters."
        c2: "The Laos crisis, from Kong Le's coup to the Geneva accords, and the war in Laos after. The Plain of Jars, April 1963; Harriman in Moscow; NSAM 249; the April coup; the Plain of Jars and the reconnaissance flights; the planes shot down, the strike on the guns; Barrel Roll; Steel Tiger; Tiger Hound."
        c3: "The Laos crisis, from Kong Le's coup to the Geneva accords, and the war in Laos after. Popeye, the cloud seeding over the trails; Commando Hunt; the Chinese road from Yunnan."
  - edit:
      id: cal.thread.legislatures
      base: 22d0ae93
      set:
        c: "The apportionment of seats and the drawing of districts, for Congress and the State legislatures: the census, the courts, the legislatures, the voters. The 1960 census and the House reapportioned; North Dakota's House reapportioned, Oklahoma's and California's plans refused at the polls; *Gomillion v. Lightfoot*; New York's congressional districts; *Baker v. Carr*; the courts in Maryland, Georgia, Oklahoma, Tennessee, Michigan, Alabama and Florida, and the special sessions; the November measures in seven States; Virginia's General Assembly held malapportioned; the Advisory Commission's report; the Council of State Governments' amendments."
        c2: "The apportionment of seats and the drawing of districts, for Congress and the State legislatures: the census, the courts, the legislatures, the voters. Florida's special session; *Gray v. Sanders*; Kerner's veto and Illinois's at-large House; the court's plan for Oklahoma; Texas's House districts voided; Iowa's Shaff plan refused; *Wesberry v. Sanders* and *Wright v. Rockefeller*; *Reynolds v. Sims* and its companions; Tuck's bill and the Dirksen–Mansfield rider; the courts redraw the legislatures from Vermont to Nebraska; the House districts struck in Kansas, Missouri and Arkansas; New York's plans; Connecticut's convention and constitution; Dirksen's amendment refused; *Sims v. Baggett*; California's reapportionment."
        c3: "The apportionment of seats and the drawing of districts, for Congress and the State legislatures: the census, the courts, the legislatures, the voters. *Swann*; North Carolina's reapportionment; New York's court-drawn districts; *Burns v. Richardson*; Dirksen's amendment again; Rolvaag's vetoes and Minnesota's third bill; *Connor v. Johnson*; Oklahoma's congressional districts refused; New Jersey's apportionment article; Florida's third plan struck; Pennsylvania's convention; *Avery v. Midland County*; thirty-two applications for an apportionment convention."
  - edit:
      id: cal.thread.middle-east
      base: e346208b
      set:
        c: "Iran and CENTO, the Arab East and Israel, the peninsula and the Gulf, the oil. Ben Gurion at the White House; the Tehran council; Herter's refusal of the Hawks; OPEC at Baghdad; Eisenhower and Nasser at the Waldorf; Dimona disclosed; Amini and the Iran task force; Kuwait independent, the British landing; Syria leaves the UAR; Law 80; Saud and the Shah at the White House; Barzani's Kurds; the Johnson Plan; the Hawks for Israel; Johnson at Tehran; the Yemen revolution and the Egyptian army; the Yemen republic recognized; Kennedy and Meir at Palm Beach."
        c2: "Iran and CENTO, the Arab East and Israel, the peninsula and the Gulf, the oil. The White Revolution; the Ba'th in Baghdad and Damascus; Bunker and the Yemen disengagement; the letters on Dimona; Khomeini's arrest; Arif ousts the Ba'th; the Cairo summit; the PLO; Eshkol at the White House; the status bill and Khomeini's exile; Faisal King; Mansur shot; the UAR's surplus sales; Harriman in Israel; the Jidda agreement on Yemen; the Saudi air defense sale."
        c3: "Iran and CENTO, the Arab East and Israel, the peninsula and the Gulf, the oil. Britain to leave Aden; Syria's coup; the Skyhawks; Faisal at the White House; the Shah's arms, Hoopes at Tehran; Iran and the consortium; Samu and Resolution 228; UNEF withdrawn, the Strait closed; the Six-Day War, the hot line, the *Liberty*; Glassboro; the Shah in Washington; Khartoum; the *Eilat*; Resolution 242; Eshkol at the Ranch; Karameh; the Phantoms sold; the raid on Beirut's airport."
  - edit:
      id: cal.thread.middle-east-six-day-war
      base: 46b2ab79
      set:
        c: "The Arab–Israeli war of June 1967, its approach and its aftermath. Egypt's troops into Sinai; UNEF withdrawn; the Strait of Tiran closed; Johnson on the gulf; Eban in Washington; Kosygin's warning; the maritime plan; Israel's strike; the hot line; the cease-fire resolutions; the oil embargo; the *Liberty*; the Golan; the five principles; Glassboro; East Jerusalem merged; the General Assembly's emergency session; Khartoum; the *Eilat*; Resolution 242."
  - edit:
      id: cal.thread.peace-corps
      base: edd1c7a6
      set:
        c: "The Peace Corps: the proposal, the order and the act, the volunteers, the authorizations and the directors. Ann Arbor; the Cow Palace; Gallup; the executive order, Shriver director; Ghana; the act; the Ibadan postcard."
        c2: "The Peace Corps: the proposal, the order and the act, the volunteers, the authorizations and the directors. Volunteers into the career service; the German Peace Corps; teachers for Tanganyika; the authorizations, 1963–65; Shriver to the war on poverty; the fourth anniversary; Humphrey's council and the returned volunteers; the act extended."
        c3: "The Peace Corps: the proposal, the order and the act, the volunteers, the authorizations and the directors. Vaughn for Shriver."
  - edit:
      id: cal.thread.south-carolina
      base: 717500f4
      set:
        c: "South Carolina: its parties and elections, Thurmond's and Watson's breaks with the Democrats, Clemson and the schools, the courts, Orangeburg. Thurmond on the Democratic platform; Shorey's letters to Nixon's camp; the Republican convention at Columbia; Byrnes for Nixon; Goldwater on tour; Nixon at the State House; Corinne Riley to her husband's seat; Russell nominated for governor; Johnston over Workman."
        c2: "South Carolina: its parties and elections, Thurmond's and Watson's breaks with the Democrats, Clemson and the schools, the courts, Orangeburg. Gantt at Clemson; *Edwards v. South Carolina*; the Sumter County and Orangeburg orders; Thurmond a Republican; Goldwater at Greenville-Spartanburg; Johnson at Columbia; Gettys for Hemphill's seat; Watson stripped of his seniority, resigns, re-elected a Republican; McNair governor, Russell to the Senate."
        c3: "South Carolina: its parties and elections, Thurmond's and Watson's breaks with the Democrats, Clemson and the schools, the courts, Orangeburg. *O'Shields v. McNair*; *South Carolina v. Katzenbach*; Hollings over Russell; McNair and Thurmond elected; the Orangeburg shootings."
  - edit:
      id: cal.thread.specials
      base: 4c08fe2a
      set:
        c: "The special elections that filled seats in Congress, 86th Congress to 90th. Gilbert in the Bronx; Taylor on write-ins; Burdick for Langer, by 1,118 votes; Johnson's Senate seat to Tower; twelve House seats in 1961–62, three to widows; González, the first Mexican American from Texas; Roberts to Rayburn's seat; Rosenthal by 264 votes."
        c2: "The special elections that filled seats in Congress, 86th Congress to 90th. Six House seats in 1963, Clausen for Clem Miller, Pickle for Thornberry; three in the spring of 1964, Burton's and Irene Baker's among them; the Oklahoma Senate primaries, Harris over Edmondson; three House seats with the November election; four in 1965, Watson re-elected a Republican."
        c3: "The special elections that filled seats in Congress, 86th Congress to 90th. Six House seats in 1966, Kupferman for Lindsay, Lera Thomas for her husband. Three in 1967: Tiernan for Fogarty; Powell re-elected to the seat denied him; McCloskey for Younger. Four in 1968: Podell; Griffin over Evers; Collins for Pool, a Republican gain; Gaydos."
  - edit:
      id: cal.thread.vietnam-order-of-battle
      base: 7cbd697e
      set:
        c: "The count of the enemy, MACV's order of battle against the CIA's estimate. The Saigon conference, Carver's stalled mission, the agreed figures; Bunker on the press briefing; MACV's new count; SNIE 14.3-67; the November briefings; Wheeler against airing the CIA's higher count; Helms and Wheeler."
  - edit:
      id: cal.thread.vietnam-paris
      base: 48517f96
      set:
        c: "The talks with Hanoi, from Hanoi's answer to the address of Mar. 31, 1968. The site; the Majestic, Harriman and Vance; Kosygin's letter; Vance and Hà Văn Lâu at Vitry; Harriman's and Clifford's case for a halt; the private meetings with Lê Đức Thọ; Saigon's place, \"our side–your side\"; the bombing halt; Thiệu's refusal; Saigon's delegation; the shape of the table; Lodge for Harriman; the first procedural meeting."
  - edit:
      id: cal.thread.voting-rights
      base: 3d2e0555
      set:
        c: "Voting rights in Congress and the field. Wilkins put off by Nixon; the referee plan, the filibuster, cloture refused, the Civil Rights Act of 1960; *Raines*; *Gomillion*; Robert Kennedy for registration over demonstrations; the Voter Education Project ratified and begun; McComb and Walthall County; the poll tax amendment through Congress; the literacy-test filibuster; Fannie Lou Hamer at Ruleville."
        c2: "Voting rights in Congress and the field. Greenwood; the referees asked; the Freedom Vote; Hattiesburg's Freedom Day; the Twenty-fourth Amendment ratified; Selma in the summer of 1964; King's Nobel, and his visit to Johnson; Selma, Marion, Bloody Sunday; \"The American Promise\"; *Louisiana v. United States*; the march to Montgomery; the bill through the Senate and the House; the Voting Rights Act; its first examiners; Mississippi's and Alabama's tests repealed."
        c3: "Voting rights in Congress and the field. The Texas poll tax void and replaced; *South Carolina v. Katzenbach*; *Harper*; the Alabama primary; *Katzenbach v. Morgan*; the poll tax repealed in Texas and Nevada, the vote at eighteen refused in Michigan; the Sunflower election; Hatcher at Gary; Mississippi's election; Reid in Virginia; the vote at eighteen heard and asked; the Loyal Democrats seated at Chicago."
