      c: 'Paris, 11 a.m. Eisenhower with Herter, Gates and others before the day''s meetings. Herter on the French disarmament
        proposal: "embarrassing to the West"; no notice of it to NATO, the American position reserved. Gates: challenge de
        Gaulle on it. Eisenhower: no disagreement in concept; the question is phasing.'
      n: '[FRUS 1958–60, IX, doc. 159](https://history.state.gov/historicaldocuments/frus1958-60v09/d159). [[w.fursenko-khrushchevs-cold-war]],
        280 (Herter: "embarrassing to the West"). Check: the work sets Herter''s words at the NATO meetings of late April
        and early May (280); its note cites this memorandum (280 n.56). See [[cal.1960-05-15.soviet-union-u2]]. Names: Eisenhower,
        Herter, Gates, de Gaulle.'
      tags:
