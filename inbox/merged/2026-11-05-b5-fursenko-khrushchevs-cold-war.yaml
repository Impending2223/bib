      when: Aug.
      date: 1961-08
      thread: berlin-and-vienna
      c: 'Kennan, back from Belgrade, to Schlesinger: "I do not propose to let the future of mankind be settled, or ended,
        by a group of men operating on the basis of limited perspectives and short-run calculations. I figure that the only
        thing I have left in life is to do everything I can to stop the war."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 387. Check: the day. To check: [[w.schlesinger-thousand-days-1965]], 397 (cited
        by [[w.fursenko-khrushchevs-cold-war]], 387 n.96). Names: Kennan, Schlesinger.'
