- edit:
    id: cal.1963-02-06.cuba
    base: 21e9b19f
    set:
      c: 'Castro to Alekseyev: complaints of indiscipline among the Soviet troops, and of drunkenness. On peaceful coexistence:
        "I am generally not against it," where the peaceful path to socialism is possible, as in Italy and France, "But in
        general in Latin America there aren''t the necessary conditions for such an approach." Escalante "was the leader of
        those who believed in the peaceful coexistence approach for Latin America."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 514; [[w.fursenko-khrushchevs-cold-war]], 427 (coexistence; Escalante). Check:
        the work sets the talk on coexistence and Escalante in early 1962 (427); its note dates it Feb. 6, 1963 (427 n.47).
        To check: memcon, Alekseyev and Castro, Feb. 6, 1963, MFA (cited by [[w.fursenko-khrushchevs-cold-war]], 514 n.82;
        APRF, 427 n.47). See [[cal.1962-12-03.soviet-union]]. Names: Castro.'
      src:
        c: 5e9b2297
        rows:
        - 'w.fursenko-khrushchevs-cold-war 514: A'
        - 'via x.2006.kcw-p514-1963-02-06: A'
        - 'w.fursenko-khrushchevs-cold-war 427: B-C'
        - 'via w.fursenko-khrushchevs-cold-war 427 n.47: B-C'
- add:
    entry:
      id: cal.1960-01-19.defense
      when: Jan. 19
      date: '1960-01-19'
      thread: defense
      c: 'Senate Armed Services, Russell in the chair, opens executive hearings on the defense posture: Gates, Secretary-designate,
        and Twining. Their case, by Fursenko and Naftali: the Soviets may have more ICBMs, but American bombers and submarines
        carry more nuclear firepower; a missile gap, no deterrence gap. Russell: "I can''t accept the statement that there
        is no missile gap. I think there is."'
      n: '[Daily Digest, 106 Cong. Rec. D16](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=14)
        (Jan. 19, 1960). [[w.fursenko-khrushchevs-cold-war]], 253 (the testimony; Russell). Check: the day: the work gives
        Russell''s words and the testimony only as on the 1961 defense budget (253); the Digest has Gates and Twining before
        Senate Armed Services Jan. 19, before House Armed Services Jan. 21–22 and before the Senate Appropriations subcommittee
        Feb. 1. To check: Wayne G. Jackson, "Allen Welsh Dulles as Director of Central Intelligence," vol. 5, CIA history
        (1973), 94 (cited by [[w.fursenko-khrushchevs-cold-war]], 253 nn.40–41). See [[cal.1960-01-26.defense]]. Names: Russell,
        Gates, Twining.'
      tags:
      - name:russell-richard-b
      - name:gates-thomas-s-jr
      - name:twining-nathan-f
      src:
        c: d21cbbeb
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=14: A'
        - 'w.fursenko-khrushchevs-cold-war 253: all'
        - 'via w.fursenko-khrushchevs-cold-war 253 n.40: B-C'
        - 'via w.fursenko-khrushchevs-cold-war 253 n.41: D'
