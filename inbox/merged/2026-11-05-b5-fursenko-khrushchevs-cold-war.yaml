- add:
    entry:
      id: cal.1961-01.berlin-and-vienna
      when: Jan.
      date: 1961-01
      thread: berlin-and-vienna
      also:
      - transition-and-staff
      c: 'Hillenbrand, State''s German specialist, for the Acheson group on Berlin: "We can live with the status quo in Berlin
        but can take no real initiative to change it for the better"; the Soviets and East Germans can change it for the worse
        whenever they will bear the consequences. "the ineluctable facts of the situation strictly limit the practical courses
        of actions open to the West."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 342. Check: the day. To check: Hillenbrand''s paper, Jan. 1961, as quoted in
        David G. Coleman, "The Greatest Issue of All: Berlin, National Security and the Cold War" (PhD diss., University of
        Queensland, 2000), 236–37 (cited by [[w.fursenko-khrushchevs-cold-war]], 342 nn.18–19). Names: Hillenbrand, Acheson.'
      tags:
      - name:hillenbrand-martin-j
      - name:acheson-dean-g
      src:
        c: e25d2d3c
        rows:
        - 'w.fursenko-khrushchevs-cold-war 342: all'
        - 'via w.fursenko-khrushchevs-cold-war 342 n.18: all'
