      when: Feb.
      date: 1968-02
      thread: robert-kennedy-campaign-decision
      c: 'Hickory Hill, one of the February gatherings on running. Robert Kennedy to his wife: "What should I do?" Ethel Kennedy: "Run. You''ll beat him. Run. Do it." David Burke of Edward Kennedy''s staff: no point in further debate. Kennedy: "She doesn''t make all the decisions in this family."'
      n: '[[w.thomas-robert-kennedy]], 359 (by Burke''s account). Check: the day. Names: Robert Kennedy, Johnson.'
