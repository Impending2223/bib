      when: Apr.
      date: 1960-04
      thread: elections-1960-kennedy
      c: 'Palm Beach, after the Wisconsin primary. Joseph Kennedy, told of Robert Kennedy''s hardball with Rivkin, gestures at Kennedy in the pool: "I don''t understand it. He''s not like me at all. ... But Bobby is like me."'
      n: '[[w.thomas-robert-kennedy]], 93 (by Spalding''s account). Check: the day; Thomas puts it after the primary of Apr. 5. See [[cal.1960-04-05.elections-1960]]. Names: Joseph Kennedy, Robert Kennedy, Kennedy.'
