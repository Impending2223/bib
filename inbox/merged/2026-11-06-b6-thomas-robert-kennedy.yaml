      when: June, after Vienna
      date: 1961-06
      thread: berlin-and-vienna
      also:
      - robert-kennedy
      c: 'Washington, back from Vienna. The President to his brother: the talks with Khrushchev like "dealing with Dad: all give and no take." On nuclear war: "We''ve had a good life, we''re adults. We bring these things on ourselves. ... The thought, though, of the women and children perishing in a nuclear exchange. I can''t adjust to that."'
      n: '[[w.thomas-robert-kennedy]], 136. To check: [[w.hersh-dark-side-of-camelot]], 254 (cited by Thomas, 417). Check: the day; Thomas puts it after the President''s return. See [[cal.1961-06-06.congress]]. Names: Kennedy, Robert Kennedy, Khrushchev.'
