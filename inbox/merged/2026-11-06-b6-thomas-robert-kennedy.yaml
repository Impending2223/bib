      c: 'Washington, Kennedy headquarters, after the convention. Robert Kennedy, the campaign manager, to the staff: "You can rest in November." He bursts in on White and some aides: "What are we all doing? Let''s get on the road. ... I want us all on the road tomorrow!"'
      n: '[[w.thomas-robert-kennedy]], 99 (by White''s account). To check: [[w.white-making-of-the-president]], 250 (cited by Thomas, 409). Check: the day. Names: Robert Kennedy, White.'
