      when: Apr. 12
      date: '1962-04-12'
      thread: robert-kennedy
      c: 'The Attorney General complains that the television set in his office has poor reception; can the FBI''s technicians fix it? Hoover, on Callahan''s memorandum passing on the request: "I don''t like getting into this. If the set breaks down, henceforth the FBI will be completely to blame."'
