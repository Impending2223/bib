      when: May 7
      date: '1968-05-07'
      thread: press-and-broadcasting
      also:
      - robert-kennedy-campaign-primaries
      c: 'Indiana''s primary day. Richard Harwood of the *Washington Post*, who has accused Kennedy of demagoguery, plays touch football against him and catches the winning touchdown; Kennedy claws at his face on the play; Harwood calls him "a lousy player and a dirty one, too." That afternoon Ethel Kennedy invites Harwood to drinks and the returns. At the suite that night Theodore White opens the door to Harwood and Hays Gorey of *Time*: "No press." They push past him.'
      n: '[[w.thomas-robert-kennedy]], 377 (by Harwood''s account). See [[cal.1968-05-07.elections-1968-2]]. Names: Robert Kennedy, White.'
      src:
        c: 95b23977
        rows:
