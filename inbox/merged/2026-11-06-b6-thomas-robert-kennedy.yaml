      c: 'New York, the fourth debate. Nixon''s limousine parked ahead of Kennedy''s in the alley outside the studio. Robert Kennedy asks John Warner, Nixon''s advance man, to let Kennedy''s car go first: Mrs. Kennedy, eight months pregnant, might need to leave quickly.'
      n: '[[w.thomas-robert-kennedy]], 106. See [[cal.1960-10-21.elections-1960]]. Names: Nixon, Kennedy, Robert Kennedy, Jacqueline Kennedy.'
