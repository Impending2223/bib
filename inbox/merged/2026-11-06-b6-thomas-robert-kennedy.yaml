      date: '1968-04-04'
      thread: robert-kennedy-campaign
      also:
      - king
      c: 'Indianapolis, the Marriott, the night after the speech on King''s death. Robert Kennedy to Walinsky: "After all, it''s not the greatest tragedy in the history of the Republic." In Walinsky''s and Greenfield''s room he speaks of "Harvey Lee Oswald," as the first radio reports from Dallas had it. To Joan Braden, by her account: "Joanie, that could have been me." Greenfield, about 3 a.m.: "You''re not so ruthless." Kennedy: "Don''t tell anyone."'
      n: '[[w.thomas-robert-kennedy]], 367–68. Thomas notes Warren Rogers doubted Braden''s story (471). See [[cal.1968-04-04.robert-kennedy]]. Names: Robert Kennedy, Walinsky, Greenfield.'
