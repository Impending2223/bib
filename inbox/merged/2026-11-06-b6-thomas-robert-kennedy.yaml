      when: Sept. 30
      date: '1962-09-30'
      thread: mississippi-ole-miss
      c: 'The Justice Department, the afternoon. After Barnett''s call, Robert Kennedy throws together the team for Oxford: lawyers drafted in the hall, Dean Markham, Harold Reis of the Office of Legal Counsel. To Katzenbach as he leaves: "Hey, Nick, don''t worry if you get shot. The president needs a moral issue." At the Lyceum one of Katzenbach''s men calls the Department collect from the pay telephone.'
