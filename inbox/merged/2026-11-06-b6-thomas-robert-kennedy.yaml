      also:
      - robert-kennedy
      c: 'The family quarters, after the meeting with Dobrynin. Robert Kennedy reports to the President, with Powers eating chicken; he holds out little hope the Russians will back down. The President: "God, Dave, the way you''re eating up all that chicken and drinking up all my wine, anybody would think it was your last meal." After the ExComm breaks up at midnight, the President and Powers watch *Roman Holiday*.'
