      when: Jan. 20
      date: '1961-01-20'
      thread: robert-kennedy
      c: 'Inauguration night, at dinner with friends. The President: "I don''t know why people are so mad at me for making Bobby Attorney General. I just wanted to give him some legal experience before he practiced." Afterward Robert Kennedy, fists clenched: "Jack, you shouldn''t have said that about me." The President: "you''ve got to make fun of yourself in politics." Robert Kennedy: "You were making fun of me."'
      n: '[[w.thomas-robert-kennedy]], 110–11 (by Bartlett''s account). Names: Kennedy, Robert Kennedy.'
