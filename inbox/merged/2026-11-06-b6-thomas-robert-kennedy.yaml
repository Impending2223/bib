      when: Apr.
      date: 1962-04
      thread: robert-kennedy
      also:
      - steel
      c: 'The steel crisis; the papers call the Attorney General "ruthless." Driving Roberto San Roman out to Hickory Hill one evening, Kennedy shows him one such attack and asks if he agrees. San Roman: "Yes. I thought it was a compliment that a great leader should be ruthless. But he hated it."'
