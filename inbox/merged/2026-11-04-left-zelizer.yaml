- edit:
    id: cal.1966-01-26.cities-and-housing
    base: 3372eaeb
    set:
      n: 'Special Message to the Congress Recommending a Program for Cities and Metropolitan Areas, [1966 Pub. Papers 82](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=158)
        (Jan. 26, 1966). [[w.mcpherson-political-education]], 296–98 (McPherson''s draft from Wood''s memorandum; Johnson''s
        changes); [[w.branch-at-canaans-edge]], 426–27 (the message with televised remarks, 11:53 a.m.; sixty cities; the
        Washington Post''s $5 million in fiscal 1967); [[w.bernstein-guns-or-butter]], 462–64 (the package of six bills, demonstration
        cities its centerpiece; the bill from Wood''s task force, Congress not consulted; Weaver''s testimony: 60 to 70 cities,
        $12 million for planning, about $2 billion over five years). Check: Branch gives $2.6 billion over six years. To check:
        [[w.haar-between-the-idea-and]]; [[w.pritchett-robert-clifton-weaver-and]]; [[w.gelfand-nation-of-cities]]; LBJ remarks
        from the Cabinet Room, 11:53 a.m., with a message to the Congress on American cities, Jan. 26, 1966, EX SP 2-3/1966/LG,
        LBJ (cited by [[w.branch-at-canaans-edge]], 426); Washington Post, Jan. 27, 1966, pp. 1, 20 (cited by [[w.branch-at-canaans-edge]],
        426); Califano to LBJ, 4:35 p.m., Jan. 27, 1966, EX SP 23/1966/LG (cited by [[w.branch-at-canaans-edge]], 427); Harry
        McPherson to LBJ, 5:10 p.m., Jan. 27, 1966, LG, Model Cities 66, Box 2, LBJ. Califano advised LBJ of eight specific
        steps already taken "after the Washington Post editorial today (which is extremely unfair)." (cited by [[w.branch-at-canaans-edge]],
        427). See [[cal.1966-01-13.cities-and-housing]]. Names: Wood.'
