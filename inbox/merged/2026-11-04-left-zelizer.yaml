- edit:
    id: cal.1968-01-17.program
    base: 0c1bdfb7
    set:
      n: 'Annual Message to the Congress on the State of the Union, [1968–69 Pub. Papers 25](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=103)
        (Jan. 17, 1968). [[w.johnson-vantage-point]], 380 (Vietnam in the address); [[w.dallek-flawed-giant]], 513–17 (the
        address; the Safe Streets Act; the surcharge); [[w.califano-triumph-and-tragedy-of]], 255–57 (under 4,000 words asked,
        4,070 delivered; the Cabinet one an hour in Califano''s office from 9 a.m. the day before; Rayburn''s "very warm welcome";
        no clapping for the tax or civil rights; "a really true ceasefire"); [[w.branch-at-canaans-edge]], 674 ("Why then
        this restlessness?"); [[w.kotz-judgment-days]], 380. [[w.longley-lbjs-1968]], 23–28 (the address; the manpower program,
        housing, Safe Streets and guns, the surcharge, Vietnam). To check: Johnson, *AWhite House Diary* (1970), 616–29 (cited
        by [[w.branch-at-canaans-edge]], 674); New York Times, Jan. 18, 1968, pp. 1, 16, 17 (cited by [[w.branch-at-canaans-edge]],
        674); New York Times, Jan. 19, 1968, p. 46 (cited by [[w.branch-at-canaans-edge]], 674); [[w.garrow-bearing-the-cross]],
        594 (cited by [[w.branch-at-canaans-edge]], 674); " "Red Ink'' to Flood Government''s Books?," U.S. News & World Report,
        May 29, 1967, p. 31 (cited by [[w.branch-at-canaans-edge]], 675); New York Times, Jan. 30, 1968, pp. 1, 16 (cited
        by [[w.branch-at-canaans-edge]], 675); Califano to LBJ, Dec. 4, 1967, Box 31, WES, LBJ (cited by [[w.branch-at-canaans-edge]],
        675); Califano to LBJ on budget message from Sargent Shriver, Jan. 9, 1968, Box 98, WE9, LBJ (cited by [[w.branch-at-canaans-edge]],
        675). See [[cal.1967-01-10.program]]. Names: Johnson.'
