      when: May 14
      date: '1968-05-14'
      thread: governors
      also: [elections-1968]
      c: 'West Virginia''s primaries for governor, Hulett Smith barred from a second term. Democratic: James Sprouse, a lawyer of Charleston, W. Va., 123,181, 37.6 percent; the attorney general 118,637, 36.2; a State senator 22.3. Republican: U.S. Representative Arch Moore 106,299, 57.0, over Underwood, governor 1957–61, 41.1.'
      n: 'Votes: [Wikipedia, "1968 West Virginia gubernatorial election"](https://en.wikipedia.org/wiki/1968_West_Virginia_gubernatorial_election), from Our Campaigns. Check: the Secretary of State''s *Official Returns of the Primary Election*, 1968. [[w.peirce-border-south-states]]. Names: Smith, Sprouse, Moore, Underwood.'
      tags: ['state:wv', 'name:smith-hulett-c', 'name:sprouse-james-m', 'name:moore-arch-a-jr', 'name:underwood-cecil-h']
- add:
    entry:
      id: cal.1968-11-05.governors-wv
      when: Nov. 5
      date: '1968-11-05'
      thread: governors
      also: [elections-1968]
      c: 'West Virginia. Moore (R) elected governor over Sprouse (D), 378,315 to 365,530, 50.9 percent: the State''s second Republican governor since 1932. John D. Rockefeller IV, a State delegate, elected secretary of state (D), 433,142 to 277,877.'
      n: '[W. Va. *Blue Book*, 1969, 575](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1969.pdf#page=583). [[w.peirce-border-south-states]]. See [[cal.1968-05-14.governors-wv]]. Names: Moore, Sprouse, Rockefeller.'
      tags: ['state:wv', 'name:moore-arch-a-jr', 'name:sprouse-james-m', 'name:rockefeller-john-d-iv']
- add:
    entry:
      id: cal.1968-07-30.governors-ar
      when: July 30
      date: '1968-07-30'
      thread: governors
      also: [elections-1968]
      c: 'Arkansas''s Democratic primary for governor, to face Rockefeller: Marion Crank, once Speaker of the House, 106,092, 25.6 percent; Virginia Johnson, wife of Jim Johnson, the nominee of 1966, 86,038, 20.7; Ted Boswell 85,629, 20.6; Bruce Bennett, once attorney general, 15.7; two others. Runoff between Crank and Johnson. The same day, Fulbright renominated for the Senate, 220,684, 52.9 percent, over Jim Johnson, 132,038.'
      n: 'Ark. [*Historical Report of the Secretary of State* (2008)](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf), [629](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=642) (governor), [593](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=606) (Senate). [[w.urwin-agenda-for-reform]]; [[w.johnson-arkansas-in-modern-america]]. See [[cal.1966-07-26.elections-1966]]. Names: Rockefeller, Crank, Virginia Johnson, James Johnson, Boswell, Bennett, Fulbright.'
      tags: ['state:ar', 'name:rockefeller-winthrop', 'name:crank-marion-h', 'name:johnson-virginia', 'name:johnson-james-d', 'name:boswell-ted', 'name:bennett-bruce', 'name:fulbright-j-william']
