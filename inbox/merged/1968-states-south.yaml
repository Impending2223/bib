- add:
    entry:
      id: cal.1968-02-06.governors-la
      when: Feb. 6
      date: '1968-02-06'
      thread: governors
      also: [elections-1968]
      c: 'Louisiana''s general election. McKeithen (D), renominated Nov. 4, 1967, re-elected governor unopposed: no Republican filed. The first governor the constitution lets succeed himself, by the amendment of 1966.'
      n: '[Wikipedia, "1967 Louisiana gubernatorial election"](https://en.wikipedia.org/wiki/1967_Louisiana_gubernatorial_election). Check: the Secretary of State''s *General Election Returns*, Feb. 6, 1968, and the vote. See [[cal.1967-11-04.governors-la]]. Names: McKeithen.'
      tags: ['governors:1968-02-06', 'state:la', 'name:mckeithen-john-j']
- add:
    entry:
      id: cal.1968-05-07.alabama-al
      when: May 7
      date: '1968-05-07'
      thread: alabama
      also: [governors]
      c: 'Montgomery. Lurleen Wallace dies of cancer, 41, sixteen months in office. Lieutenant Governor Albert Brewer, 39, governor: the first lieutenant governor to succeed under the constitution of 1901. State offices and the schools closed for her funeral, May 9. George Wallace campaigning for President since February.'
      n: '[Encyclopedia of Alabama, "Lurleen B. Wallace (1967–68)"](https://encyclopediaofalabama.org/article/lurleen-b-wallace-1967-68/); ["Albert P. Brewer (1968–71)"](https://encyclopediaofalabama.org/article/albert-p-brewer-1968-71/). Check: the *Alabama Official and Statistical Register*, 1971, and the hour Brewer took the oath. [[w.alabama-governors]]; [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. See [[cal.1967-01-16.alabama-al]]. Names: Lurleen Wallace, Brewer, George Wallace.'
      tags: ['state:al', 'name:wallace-lurleen-b', 'name:brewer-albert-p', 'name:wallace-george-c']
- add:
    entry:
      id: cal.1968-04-09.georgia-ga
      when: Apr. 9
      date: '1968-04-09'
      thread: georgia
      also: [king]
      c: Atlanta. King's funeral. Maddox, who had refused King lying in state at the Capitol and did not close the State's offices, has 160 State troopers ring the Capitol; he does not attend.
      n: '[Wikipedia, "Lester Maddox"](https://en.wikipedia.org/wiki/Lester_Maddox). Check: the troopers'' number, from the *Atlanta Constitution*, Apr. 9–10, 1968. [[w.short-everything-is-pickrick]]; [[w.tuck-beyond-atlanta]]. See [[cal.1968-04-08.king]]. Names: Maddox, King.'
      tags: ['state:ga', 'city:atlanta', 'name:maddox-lester', 'name:king-martin-luther-jr']
- add:
    entry:
      id: cal.1968-09-11.georgia-ga
      when: Sept. 11
      date: '1968-09-11'
      thread: georgia
      also: [elections-1968]
      c: 'Georgia''s Democratic primary. Talmadge renominated for the Senate, 627,915, 75.2 percent, over Maynard Jackson, a lawyer of the National Labor Relations Board in Atlanta, 207,171. The Republicans'' first primary for the Senate: E. Earl Patton.'
      n: 'Votes: [Wikipedia, "1968 United States Senate election in Georgia"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Georgia). Check: the Secretary of State''s tabulation of the primary. [[w.tuck-beyond-atlanta]]; [[w.bartley-from-thurmond-to-wallace]]. Names: Talmadge, Jackson.'
      tags: ['state:ga', 'city:atlanta', 'name:talmadge-herman-e', 'name:jackson-maynard']
- add:
    section: III.K
    entry: {id: kjc.who.murton-thomas-o, s: 'Murton, Thomas O.', r: 'Superintendent of the Arkansas prison farms at Tucker and Cummins, 1967–68'}
- add:
    section: III.F
    entry: {id: kjc.who.roos-lawrence-k, s: 'Roos, Lawrence K.', r: 'Supervisor of St. Louis County, Mo., 1963–75; Republican nominee for governor, 1968'}
- add:
    entry:
      id: cal.1968-02.states-and-cities-ar
      when: Feb.–Mar.
      date: 1968-02
      thread: states-and-cities
      also: [crime-and-hijacking]
      c: 'Arkansas. Thomas Murton, Rockefeller''s superintendent at the Cummins prison farm, digs up three skeletons on its grounds, early February, after an inmate''s word of prisoners killed and buried as "escapees." Rockefeller: no point in "washing dirty linen for weeks on end as each body is dug up." Murton fired, March. A report on the Tucker farm that Faubus had ordered and kept back, released by Rockefeller in 1967, had told of floggings and the "Tucker telephone."'
      n: '[Wikipedia, "Tom Murton"](https://en.wikipedia.org/wiki/Tom_Murton), from *Time*, Feb. 1968. Check: the dates of the digging and the dismissal, from the *Arkansas Gazette*. [[w.urwin-agenda-for-reform]]; [[w.johnson-arkansas-in-modern-america]]. Names: Murton, Rockefeller, Faubus.'
      tags: ['state:ar', 'name:murton-thomas-o', 'name:rockefeller-winthrop', 'name:faubus-orval-e']
- add:
    entry:
      id: cal.1968-11-05.governors-mo
      when: Nov. 5
      date: '1968-11-05'
      thread: governors
      also: [elections-1968]
      c: 'Missouri. Hearnes (D) re-elected governor over Lawrence Roos (R), supervisor of St. Louis County, 1,072,805 to 691,797, 60.8 percent: the first Missouri governor elected to a second term in succession, under the amendment of 1965.'
      n: 'Votes: [Wikipedia, "1968 Missouri gubernatorial election"](https://en.wikipedia.org/wiki/1968_Missouri_gubernatorial_election), from Our Campaigns. Check: Mo. *Official Manual*, 1969–70, the general election returns, and the amendment''s date. [[w.peirce-great-plains-states-of]]. See [[cal.1964-08-04.governors-mo]]. Names: Hearnes, Roos.'
      tags: ['state:mo', 'name:hearnes-warren-e', 'name:roos-lawrence-k']
- add:
    section: III.K
    entry: {id: kjc.who.hobson-julius-w, s: 'Hobson, Julius W.', r: 'Washington civil rights leader; plaintiff in Hobson v. Hansen (1967); member of the elected Board of Education, 1968–69'}
- add:
    entry:
      id: cal.1968-11-05.states-and-cities-dc
      when: Nov. 5
      date: '1968-11-05'
      thread: states-and-cities
      also: [school-aid, elections-1968]
      c: 'Washington. The District elects its Board of Education, the first officials its people have chosen since 1874 (Check): eleven members, without party, one from each of eight wards and three at large; some 89 candidates (Check). No ward race decided: runoffs Nov. 26. Julius Hobson, the plaintiff in *Hobson v. Hansen*, among those elected at large (Check).'
      n: 'The act: [82 Stat. 101](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg101.pdf). [DC 1968 Project, "5 November 1968 & Presidential Election"](https://www.dc1968project.com/blog/2018/12/22/5-november-1968-amp-presidential-election), from the *Hilltop*, Nov. 8, 1968. Check: the Board of Elections'' returns of Nov. 5 and Nov. 26, and Hobson''s round. [[w.jaffe-dream-city]]; [[w.gillette-between-justice-and-beauty]]; [[w.peirce-mid-atlantic-states-of]]. See [[cal.1968-04-22.states-and-cities]]. Names: Hobson.'
      tags: ['state:dc', 'city:washington', 'name:hobson-julius-w']
- add:
    entry:
      id: cal.1968-11-05.state-and-city-finance-va
      when: Nov. 5
      date: '1968-11-05'
      thread: state-and-city-finance
      also: [state-constitutions]
      c: 'Virginia''s voters approve $81 million in general obligation bonds, the State''s first in the century: for higher education, $67.23 million, 772,929 to 389,721, 66.5 percent; for mental hospitals, $13.77 million, 784,724 to 323,070, 70.8. Godwin''s proposal, under the act of the 1968 General Assembly.'
      n: '[Va. State Board of Elections, historical elections database](https://historical.elections.virginia.gov/), ballot questions, 1968. Check: the *Statement of the Vote*, Nov. 5, 1968, and the claim of the first bonds since the century''s beginning. [[w.peirce-border-south-states]]; [[w.howard-commentaries-on-the-constitution]]. Names: Godwin.'
      tags: ['state:va', 'name:godwin-mills-e-jr']
- add:
    entry:
      id: cal.1969-01.state-constitutions-va
      when: Jan.
      date: 1969-01
      thread: state-constitutions
      c: 'Virginia. The Commission on Constitutional Revision, appointed by Godwin in 1968, Albertis Harrison, governor 1962–66, its chairman, presents its report and a revised constitution to Godwin at Williamsburg, Va.: the ban on State debt eased; the schools a duty of the State, under standards of quality. To the General Assembly in special session, 1969.'
      n: '[University of Virginia Law Library, papers of A. E. Dick Howard, the Commission''s executive director](https://archives.law.virginia.edu/resources/register-papers-e-dick-howard-virginia-commission-constitutional-revision). Check: the report''s date, *The Constitution of Virginia: Report of the Commission on Constitutional Revision* (Jan. 1969), and its proposals. [[w.howard-commentaries-on-the-constitution]]. See [[cal.1968-11-05.state-and-city-finance-va]]. Names: Godwin, Harrison.'
      tags: ['state:va', 'name:godwin-mills-e-jr', 'name:harrison-albertis-s-jr']
- add:
    entry:
      id: cal.1968-08-27.state-constitutions-ok
      when: Aug. 27 and Sept. 17
      date: '1968-08-27'
      thread: state-constitutions
      also: [state-and-city-finance]
      c: 'Oklahoma, with the primary, Aug. 27, adopts six amendments: intangible personal property no longer taxed, 329,848 to 92,710; appropriations held to the Board of Equalization''s estimate of revenues; a Board of Legislative Compensation to fix the legislators'' pay, 201,107 to 177,672. Two refused, a new Pardon and Parole Board among them, 182,742 to 197,219. With the runoff, Sept. 17: the initiative''s new judicial article rejected, 115,771 to 172,711; six-member juries for misdemeanors, 170,854 to 97,736, and four others adopted.'
      n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-5 to C-12](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=6) (State Questions 441–462; the Board prints State Question 461''s vote as 460''s, Check). [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1967-07-11.state-constitutions-ok]].'
      tags: ['state:ok']
- add:
    entry:
      id: cal.1968-11-05.state-constitutions-ok
      when: Nov. 5
      date: '1968-11-05'
      thread: state-constitutions
      c: 'Oklahoma. A new oath of office for all public officers, in place of the constitution''s, rejected though it carries, 357,840 to 284,656: an amendment needs a majority of all votes cast at the election, 481,865.'
      n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-17](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=18) (State Question 445). See [[cal.1968-08-27.state-constitutions-ok]].'
      tags: ['state:ok']
- add:
    entry:
      id: cal.1968-12-10.state-and-city-finance-ok
      when: Dec. 10
      date: '1968-12-10'
      thread: state-and-city-finance
      also: [state-constitutions]
      c: 'Oklahoma, special election: $99,808,000 in bonds for buildings at the colleges, the mental hospitals and other institutions, the cigarette tax pledged, 133,313 to 39,251.'
      n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-18](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=18) (State Question 463). [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1968-08-27.state-constitutions-ok]]. Names: Bartlett.'
      tags: ['state:ok', 'name:bartlett-dewey-f']
- add:
    entry:
      id: cal.1968-11-05.state-constitutions-tx
      when: Nov. 5
      date: '1968-11-05'
      thread: state-constitutions
      also: [welfare, state-and-city-finance]
      c: 'Texas votes on fourteen amendments, adopts seven: the State property tax to be cut and abolished after 1978, 64.1 percent; the Employees Retirement System in the constitution, 60.4; the Permanent University Fund''s investments widened, 59.8; consolidation of offices in El Paso and Tarrant Counties, 50.3. Rejected: the ceiling on State spending for public assistance raised from $60 million to $75 million, 43.5 percent; legislators'' salaries to $8,400 a year, 49.0; industrial development bonds, 49.0.'
      n: 'Texas Legislative Council, [*Amendments to the Texas Constitution Since 1876*](https://tlc.texas.gov/docs/amendments/Constamend1876.pdf) (2026), art. 3, §§ 24, 51, 51-a, 52a, 64; art. 7, § 11a; art. 8, § 1-e; art. 16, § 62. Check: the Secretary of State''s canvass. [[w.may-texas-state-constitution]]. See [[cal.1967-11-11.state-constitutions-tx]].'
      tags: ['state:tx']
- add:
    entry:
      id: cal.1968-06-04.state-and-city-finance-tx
      when: June 4–July 3
      date: '1968-06-04'
      thread: state-and-city-finance
      c: 'Texas. The legislature in special session, Connally''s call: a $2.6 billion appropriation for fiscal 1969, and taxes for it, some $159 million: the State sales tax and the motor vehicle sales tax up a cent, the franchise tax up 50 cents a thousand, from Oct. 1. Connally''s broader sales tax, with rebates to the cities, refused.'
      n: '[*Bastrop Advertiser*, July 11, 1968, 2](https://texashistory.unt.edu/ark:/67531/metapth238161/m1/2); [60th Leg., 1st C.S., H.B. 2, Texas Senate Papers](https://texashistory.unt.edu/ark:/67531/metapth595271/); [*Texas Observer*, June 21, 1968](https://www.texasobserver.org/explore/ustxtxb_obs_1968_06_21_50_00005-00000_000pdf5535/). Check: the General and Special Laws, 60th Leg., 1st C.S., and the rates. [[w.reston-lone-star]]; [[w.cunningham-cowboy-conservatism]]. Names: Connally.'
      tags: ['state:tx', 'name:connally-john']
- add:
    section: III.F
    entry: {id: kjc.who.tanzler-hans-g-jr, s: 'Tanzler, Hans G., Jr.', r: 'Mayor of Jacksonville, 1967–79, the consolidated city from 1968'}
