      when: May 4
      date: '1968-05-04'
      thread: governors
      also: [elections-1968]
      c: 'Texas Democratic primary for governor, Connally not running: ten candidates. Don Yarborough, a Houston lawyer, 421,607, 24.1 percent; Lieutenant Governor Preston Smith 386,875, 22.1; Waggoner Carr, attorney general 1961–67, 14.7; Dolph Briscoe, a rancher of Uvalde, Tex., 12.9; Eugene Locke, deputy ambassador at Saigon 1967–68, 12.5; John Hill, secretary of state, 8.8. Runoff between Yarborough and Smith. Republican: Paul Eggers 62.5.'
      n: 'Votes: [Wikipedia, "1968 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Texas_gubernatorial_election), from the *Texas Almanac*; [*Texas Observer*, May 10, 1968](https://issues.texasobserver.org/pdf/ustxtxb_obs_1968_05_10_issue.pdf). Check: the State Democratic Executive Committee''s canvass. [[w.davidson-race-and-class-in]]; [[w.knaggs-two-party-texas]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1967-11-10.governors-tx]]. Names: Connally, Yarborough, Smith, Carr, Briscoe, Locke, Hill, Eggers.'
      tags: ['state:tx', 'name:connally-john', 'name:yarborough-don', 'name:smith-preston', 'name:carr-waggoner', 'name:briscoe-dolph-jr', 'name:locke-eugene-m', 'name:hill-john-l-jr', 'name:eggers-paul-w']
