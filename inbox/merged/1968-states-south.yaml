    entry: {id: kjc.who.kidd-mae-street, s: 'Kidd, Mae Street', r: 'Kentucky State Representative from Louisville, 1968–84; sponsor of the fair housing act of 1968'}
- add:
    entry:
      id: cal.1968-05-14.state-constitutions-md
      when: May 14
      date: '1968-05-14'
      thread: state-constitutions
      also: [elections-1968]
      c: Maryland's voters reject the convention's constitution, 367,101 to 284,033, 43.6 percent for. The constitution of 1867 stands.
      n: '[Md. *Manual*, 1973–74, 50](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000176/html/am176--50.html) (Archives of Maryland, vol. 176). Check: the State Administrative Board of Election Laws'' returns, by county. [[w.callcott-maryland-and-america-1940]]. See [[cal.1968-01-10.state-constitutions-md]].'
      tags: ['state:md']
- add:
    entry:
      id: cal.1968-11-05.open-housing-md
      when: Nov. 5
      date: '1968-11-05'
      thread: open-housing
      also: [state-constitutions]
      c: 'Maryland''s voters reject the open-housing act of 1967, ch. 385, signed by Agnew and petitioned to referendum: no discrimination in the sale of new houses or the rental of new apartments in buildings of twelve units or more.'
      n: '[Md. *Manual*, 1969–70, 483](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000174/html/am174--483.html) (Archives of Maryland, vol. 174), the vote by county. Check: the statewide totals (the Manual''s page prints the counties). [[w.callcott-maryland-and-america-1940]]; [[w.durr-behind-the-backlash]]. See [[cal.1967-04-21.open-housing-md]]; [[cal.1968-04-10.open-housing]]. Names: Agnew.'
      tags: ['state:md', 'name:agnew-spiro-t']
- add:
    entry:
      id: cal.1969-01-07.governors-md
      when: Jan. 7
      date: '1969-01-07'
      thread: governors
      also: [transition-and-staff]
      c: 'Annapolis, Md. Agnew resigns as governor. The General Assembly, in joint session, elects Marvin Mandel, Speaker of the House of Delegates since 1964, governor for the rest of the term: Maryland''s first Jewish governor.'
      n: '[Wikipedia, "Marvin Mandel"](https://en.wikipedia.org/wiki/Marvin_Mandel). Check: the vote of the joint session, from the *Journal of Proceedings*, and the hour of Agnew''s resignation. [[w.callcott-maryland-and-america-1940]]; [[w.witcover-white-knight]]. Names: Agnew, Mandel.'
      tags: ['state:md', 'name:agnew-spiro-t', 'name:mandel-marvin']
- add:
    entry:
      id: cal.1968-02-19.school-aid-fl
      when: Feb. 19–Mar.
      date: '1968-02-19'
      thread: school-aid
      also: [state-and-city-finance, jobs-and-wages]
      c: 'Florida. The teachers'' statewide walkout, called by the Florida Education Association: at its height 25,712, some 40 percent of the State''s teachers, by resignations; schools closed in about two-thirds of the counties. The special session Kirk called in January had raised taxes for the schools; the FEA calls the sums too small. Kirk and the legislature give no more. By the end of March most teachers back.'
      n: '[Wikipedia, "Florida statewide teachers'' strike of 1968"](https://en.wikipedia.org/wiki/Florida_statewide_teachers%27_strike_of_1968). Check: the taxes enacted in the special session (the sales tax to 4 percent) and whether Kirk signed them, from the *Laws of Florida*, 1968, Extraordinary Session. [[w.kallina-claude-kirk-and-the]]; [[w.colburn-floridas-gubernatorial-politics-in]]. See [[cal.1967-01.crime-and-hijacking-fl]]. Names: Kirk.'
      tags: ['state:fl', 'name:kirk-claude-r-jr']
- add:
    entry:
      id: cal.1968-06-24.state-constitutions-fl
      when: June 24–July 3
      date: '1968-06-24'
      thread: state-constitutions
      c: 'Florida. The legislature, in special session, proposes a revised constitution in three joint resolutions: the basic document (H.J.R. 1-2X), suffrage and elections (Art. VI), local government (Art. VIII); the judiciary, Art. V, left as it is. To the voters Nov. 5.'
      n: '[Wikipedia, "Constitution of Florida"](https://en.wikipedia.org/wiki/Constitution_of_Florida). Check: the *Journal of the House of Representatives*, Extraordinary Session, 1968, and the votes. [[w.dalemberte-florida-state-constitution]]; [[w.colburn-floridas-gubernatorial-politics-in]].'
      tags: ['state:fl']
- add:
    entry:
      id: cal.1968-11-05.state-constitutions-fl
      when: Nov. 5
      date: '1968-11-05'
      thread: state-constitutions
      also: [desegregation-schools]
      c: 'Florida adopts its new constitution, the first since 1885: the basic document, 645,233 to 518,940, 55.4 percent; suffrage and elections, 625,980 to 497,752; local government, 625,347 to 508,962. The constitution''s command of separate schools gone.'
      n: '[Fla. *Tabulation of Official Votes Cast in the General Election*, Nov. 5, 1968, 27–28](https://archive.org/details/Tabulationofofficialvotescastinthegeneralelection1968). [[w.dalemberte-florida-state-constitution]]. See [[cal.1968-06-24.state-constitutions-fl]].'
      tags: ['state:fl']
- add:
    entry:
      id: cal.1968-10-01.states-and-cities-jacksonville
      when: Oct. 1
      date: '1968-10-01'
      thread: states-and-cities
      also: [mayors]
      c: Jacksonville and Duval County one government, by the charter Duval's voters approved Aug. 8, 1967, 54,493 to 29,768. Hans Tanzler, mayor of the old city from 1967, the consolidated city's first mayor.
      n: '[Wikipedia, "Jacksonville Consolidation"](https://en.wikipedia.org/wiki/Jacksonville_Consolidation). Check: the Supervisor of Elections'' returns of Aug. 8, 1967; the charter, Laws of Fla. 1967, ch. 67-1320. [[w.bartley-keeping-the-faith]]. See [[cal.1965-10-01.states-and-cities-jacksonville]]. Names: Tanzler.'
      tags: ['state:fl', 'city:jacksonville', 'name:tanzler-hans-g-jr']
- add:
    entry:
      id: cal.1968-03-15.open-housing-ky
      when: Mar. 15
      date: '1968-03-15'
      thread: open-housing
      c: 'Kentucky''s General Assembly passes a statewide fair housing act, the first in the South: Senator Georgia Davis Powers and Representative Mae Street Kidd of Louisville its sponsors. It becomes law without Nunn''s signature.'
      n: '[HUD, "Kentucky" (July 14, 2006)](https://archives.hud.gov/content/focus/2006-07-14.cfm); [Wikipedia, "Louie Nunn"](https://en.wikipedia.org/wiki/Louie_Nunn). Check: the act, *Kentucky Acts*, 1968, and the date it took effect. [[w.kmeyer-civil-rights-in-the]]; [[w.harrison-new-history-of-kentucky]]. See [[cal.1967-12-13.open-housing-louisville]]. Names: Powers, Kidd, Nunn.'
      tags: ['state:ky', 'city:louisville', 'name:powers-georgia-davis', 'name:kidd-mae-street', 'name:nunn-louie-b']
- add:
    entry:
      id: cal.1968-03.state-and-city-finance-ky
      when: Mar.
      date: 1968-03
      thread: state-and-city-finance
      c: Kentucky. Nunn, who had campaigned against new taxes, has the General Assembly raise the sales tax from 3 to 5 percent and the motor vehicle license from $5 to $12.50, against a deficit of $24 million projected by the Breathitt administration. He vetoes a quarter of the session's bills.
      n: '[Wikipedia, "Louie Nunn"](https://en.wikipedia.org/wiki/Louie_Nunn). Check: the acts and their dates, *Kentucky Acts*, 1968. [[w.harrison-new-history-of-kentucky]]. See [[cal.1967-11-07.governors-ky]]. Names: Nunn, Breathitt.'
      tags: ['state:ky', 'name:nunn-louie-b', 'name:breathitt-edward-t']
- add:
    entry:
      id: cal.1968-11-05.legislatures-tn
      when: Nov. 5
      date: '1968-11-05'
      thread: legislatures
      also: [elections-1968]
      c: 'Tennessee''s House elected 49 Republicans, 49 Democrats and an independent. Jan. 1969, the Republicans'' William Jenkins of Rogersville, Tenn., elected Speaker over the Democrats'' candidate: the first Republican Speaker in the century.'
      n: 'Check: the century claim, the *Tennessee Blue Book*, 1969–70, and the House Journal of the 86th General Assembly, the day and vote of the Speaker''s election. [Wikipedia, "Bill Jenkins (politician)"](https://en.wikipedia.org/wiki/Bill_Jenkins_(politician)). [[w.peirce-border-south-states]]. Names: Jenkins.'
      tags: ['state:tn', 'name:jenkins-william-l']
