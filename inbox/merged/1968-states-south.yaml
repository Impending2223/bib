- add:
    entry:
      id: cal.1968-11-05.governors-ar
      when: Nov. 5
      date: '1968-11-05'
      thread: governors
      also: [elections-1968, state-constitutions]
      c: 'Arkansas. Rockefeller (R) re-elected over Crank (D), 322,782 to 292,813, 52.4 percent: the first Republican governor of Arkansas re-elected. The State''s electors to Wallace; Fulbright re-elected. The voters approve calling a constitutional convention (Check the vote).'
      n: 'Ark. [*Historical Report of the Secretary of State* (2008)](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf), [629](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=642). [UALR Center for Arkansas History and Culture, "Failed Constitutions"](https://ualrexhibits.org/convention/failed-constitutions/). Check: the vote on the convention. See [[cal.1968-07-30.governors-ar]]. Names: Rockefeller, Crank, Wallace, Fulbright.'
      tags: ['state:ar', 'name:rockefeller-winthrop', 'name:crank-marion-h', 'name:wallace-george-c', 'name:fulbright-j-william']
- add:
    entry:
      id: cal.1968-04-09.states-and-cities-wilmington-de
      when: Apr. 9
      date: '1968-04-09'
      thread: states-and-cities
      also: [civil-disorders]
      c: Wilmington, Del. Looting and fires after King's death, Apr. 9–10; the mayor declares an emergency and a curfew. Governor Terry sends in the National Guard, some 2,800. Within a week the mayor asks it withdrawn; Terry refuses. The Guard patrols the city's Negro neighborhoods through the year, into 1969.
      n: 'Check: the Guard''s numbers and the dates of the mayor''s requests, from the *Wilmington Evening Journal* and the Guard''s records. [Wikipedia, "Wilmington riot of 1968"](https://en.wikipedia.org/wiki/Wilmington_riot_of_1968). [[w.hoffecker-corporate-capital]]; [[w.peirce-mid-atlantic-states-of]]. See [[cal.1968-04-04.civil-disorders]]. Names: Terry.'
      tags: ['state:de', 'city:wilmington-de', 'name:terry-charles-l-jr']
- add:
    entry:
      id: cal.1968-11-05.governors-de
      when: Nov. 5
      date: '1968-11-05'
      thread: governors
      also: [elections-1968]
      c: Delaware. Russell Peterson (R), a Du Pont chemist, elected governor over Terry (D), 104,474 to 102,360, 50.5 percent; the Guard in Wilmington the campaign's issue. Terry keeps the Guard there to the end of his term; Peterson withdraws it on taking office, Jan. 21, 1969.
      n: 'Votes: [Wikipedia, "1968 Delaware gubernatorial election"](https://en.wikipedia.org/wiki/1968_Delaware_gubernatorial_election), from Our Campaigns. Check: [Del., *Official Results of General Election*, Nov. 5, 1968](https://elections.delaware.gov/elections/resultsarchive/elect68/pdfs/19681105_GeneralElectionResults.pdf) (a scan, not read). [[w.hoffecker-corporate-capital]]; [[w.peirce-mid-atlantic-states-of]]. See [[cal.1968-04-09.states-and-cities-wilmington-de]]. Names: Peterson, Terry.'
      tags: ['state:de', 'city:wilmington-de', 'name:peterson-russell-w', 'name:terry-charles-l-jr']
