- add:
    entry:
      id: cal.1967-09-07.elections-1968
      when: Sept. 7–8
      date: '1967-09-07'
      thread: elections-1968
      c: 'At the Ranch, Johnson reads aloud excerpts of the governors'' statements on Romney''s "brainwashing." Asked about the charge, Christian, at Johnson''s direction: the White House has "no reaction."'
      n: '[[w.califano-triumph-and-tragedy-of]], 223 (by Califano''s account). To check: President''s Daily Diary, Sept. 7–8, 1967, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 223 n.32). Check: the day of Christian''s reply. See [[cal.1967-09-04.elections-1968]]. Names: Johnson, Romney, Christian.'
      src:
        c: eb50f77d
        rows:
        - 'w.califano-triumph-and-tragedy-of 223: all'
        - 'via w.califano-triumph-and-tragedy-of 223 n.32: A'
      tags:
