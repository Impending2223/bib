    entry:
      id: cal.1965-07-14.press-and-broadcasting-2
      when: July 14–15
      date: '1965-07-14'
      thread: press-and-broadcasting
      c: 'Califano, at the Pentagon, to Valenti and Watson: 24 Sony pocket radios, 72 batteries and 25 cards of the network news stations in the major cities, for the White House staff. Johnson''s order, by Valenti''s call early in July: every staffer to carry a radio and hear the national news on the hour or half hour.'
      n: '[[w.califano-triumph-and-tragedy-of]], 168 (by Califano''s account). To check: Califano to Valenti, July 14, 1965, and Califano to Watson, July 15, 1965, Califano''s Personal Papers (cited by [[w.califano-triumph-and-tragedy-of]], 168 n.4). Check: the day of Valenti''s call ("In early July 1965"). Names: Califano, Valenti, Watson, Johnson.'
      src:
        c: 41a93e90
        rows:
        - 'w.califano-triumph-and-tragedy-of 168: all'
        - 'via w.califano-triumph-and-tragedy-of 168 n.4a: A'
