      - 'name:jones-james-r'
      - 'name:mcnamara-robert-s'
- add:
    entry:
      id: cal.1967-09-19.europe-and-the-alliance
      when: Sept. 19
      date: '1967-09-19'
      thread: europe-and-the-alliance
      c: 'State dinner for Saragat, President of Italy, on his birthday; Johnson''s toast, 10:05 p.m.: the talks of that day and the day before have "advanced the quest for peace." Excerpts of *Man of La Mancha* in the East Room.'
      n: 'Toasts of the President and President Saragat of Italy, [1967 Pub. Papers 846](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=238) (Sept. 19, 1967). [[w.califano-triumph-and-tragedy-of]], 336 (the dinner, Tuesday, Sept. 19; the East Room). To check: President''s Daily Diary, Sept. 19, 1967, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 336 n.18). Names: Saragat, Johnson.'
      src:
