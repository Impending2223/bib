- add:
    entry:
      id: cal.1967-10.defense-clifford
      when: Oct.
      date: 1967-10
      thread: defense-clifford
      c: 'Johnson to Jim Jones, one evening, on McNamara: "concerned about his health, his mental health"; fears "another Forrestal"; "find something else for him to do." By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 249 (by Jones''s interview with the author). Check: the day; Califano dates it "In the fall of 1967." See [[cal.1966-08-25.transition-and-staff]]. Names: Johnson, James R. Jones, McNamara.'
      src:
        c: 33fa67b3
        rows:
        - 'w.califano-triumph-and-tragedy-of 249: all'
        - 'via w.califano-triumph-and-tragedy-of 249 n.18: all'
      tags:
