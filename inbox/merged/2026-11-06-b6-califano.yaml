- add:
    entry:
      id: cal.1967-01-17.press-and-broadcasting
      when: Jan. 17
      date: '1967-01-17'
      thread: press-and-broadcasting
      also:
      - congress
      c: 'The White House dinner for Humphrey, McCormack and Warren; Johnson''s toast, 8:20 p.m., in the State Dining Room. The gossip columns carry Joan Crawford''s words to Cathy Douglas at Califano''s table; Johnson blames Califano for the leak, then Udall, by Califano''s account.'
      n: 'The President''s Toast at a Dinner Honoring the Vice President, the Speaker, and the Chief Justice, [1967 Pub. Papers 26](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=94) (Jan. 17, 1967) (the dinner, the hour). [[w.califano-triumph-and-tragedy-of]], 171 (the dinner, "In January 1967"; the columns; the blame). To check: President''s Daily Diary, Jan. 17, 1967, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 171 n.11). Check: the days of the columns. Names: Humphrey, McCormack, Warren, Califano, Udall, Johnson.'
