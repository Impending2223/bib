by: Claude (batch 5 reader, Smith, On His Own Terms)
ops:
- add:
    entry:
      id: cal.1960-01.states-and-cities-5
      when: Jan., early in the year
      date: 1960-01
      thread: states-and-cities
      also:
      - mayors
      c: 'New York. Wagner and Rockefeller, by Warren Moscow''s account: Democratic votes in the Legislature for the banking
        bill Rockefeller and the big banks want, stalled the year before; in return the Seymour Commission to fold. Enough
        Democrats switch; the bill enacted.'
      n: '[[w.smith-on-his-own-terms]], 335 (Moscow, then a mayoral assistant at city hall; and, 335–36, Rockefeller''s call
        to Moscow on the $75 million bond issue for State parks, Wagner withholding his endorsement until the city''s share
        is settled: "if you get in my way, I''ll ride you down"). Check: the month; the day of the bill''s passage. Names:
        Wagner, Rockefeller.'
      tags:
      - name:rockefeller-nelson
      - name:wagner-robert-f-jr
      - state:ny
      - city:nyc
      src:
        c: 8386f987
        rows:
        - 'w.smith-on-his-own-terms 335: all'
        - 'via x.undated.moscow-oral-history-columbia: all'
- add:
    entry:
      id: cal.1960-03-30.states-and-cities-2
      when: Mar. 30–31
      date: '1960-03-30'
      thread: states-and-cities
      c: 'New York, the session''s last night. A deal: a dozen new judgeships for Manhattan and Brooklyn, two Democrats to
        every Republican. Mahoney, the Senate''s Republican leader, balks over his own candidate; a thirteenth judgeship would
        need the governor''s message of necessity. Near 3 a.m. the majority''s counsel ask it of Rockefeller: "Fuck Walter
        Mahoney."'
      n: '[[w.smith-on-his-own-terms]], 333–34. To check: [[w.kramer-i-never-wanted-to]], 106 (Mahoney''s words) (cited by
        [[w.smith-on-his-own-terms]], 333). Check: the judgeships'' law and the message''s fate (the session laws). See [[cal.1960-03-30.states-and-cities]].
        Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
      - state:ny
      src:
        c: ef413cdc
        rows:
        - 'w.smith-on-his-own-terms 333–34: all'
- add:
    entry:
      id: cal.1960-03.elections-1960-rockefeller
      when: Mar.–Apr., twice, before May 1
      date: 1960-03
      thread: elections-1960-rockefeller
      c: 'Eisenhower twice telephones Rockefeller for an endorsement of Nixon. Each time Rockefeller puts him off: it would
        carry more weight nearer the convention.'
      n: '[[w.smith-on-his-own-terms]], 336. Check: the days. Names: Eisenhower, Rockefeller, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      src:
        c: 916d870b
        rows:
        - 'w.smith-on-his-own-terms 336: all'
- add:
