      when: Sept.
      date: 1960-09
      thread: republican-party
      c: Rockefeller lends Morhouse, New York's unsalaried Republican chairman, $100,000 to buy Long Island real estate where
        the New York Telephone Company keeps its trucks.
      n: '[[w.smith-on-his-own-terms]], 391–92 (and, 391, the loan of $49,000 from Laurance Rockefeller in Dec. 1959, which
        Rockefeller arranged, for Morhouse''s stock in two companies). To check: *Life*, Apr. 5, 1963; *New York Mirror*,
        Apr. 17, 1963; William Rodgers, *Rockefeller''s Follies* (1966), 46–55 (cited by [[w.smith-on-his-own-terms]], 391).
        Check: the day. Names: Rockefeller, Morhouse.'
      tags:
