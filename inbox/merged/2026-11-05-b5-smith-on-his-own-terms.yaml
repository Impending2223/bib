      when: Nov., a year before the election
      date: 1961-11
      thread: elections-1962
      c: Rockefeller asks Pfeiffer, once a Representative from Buffalo, to manage his campaign for re-election. Pfeiffer,
        earning $75,000, cannot afford it; Rockefeller offers more, from his own pocket, not the State's or the State committee's.
        Pfeiffer accepts.
