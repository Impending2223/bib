      when: Oct.
      date: 1960-10
      thread: elections-1960
      also:
      - state-legislatures
      c: 'Rockefeller in the campaign: more than two hundred speeches, eight States for the national party; much of October
        for the Republican legislators in danger upstate and in the city''s suburbs, the local polls giving Kennedy New York
        by a million. At a Wall Street rally: he is thinking of rebating a tenth of the State''s taxes.'
      n: '[[w.smith-on-his-own-terms]], 349. To check: *New Yorker*, Nov. 5, 1960 (cited by [[w.smith-on-his-own-terms]],
        349). Check: the day of the rally. Names: Rockefeller, Kennedy.'
