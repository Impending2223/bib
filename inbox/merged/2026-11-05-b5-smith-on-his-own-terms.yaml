      when: July 23
      date: '1960-07-23'
      thread: republican-party
      also:
      - elections-1960-rockefeller
      c: 'Chicago, Saturday. The delegates on the Fifth Avenue compact. Hutcheson, chairman of the Texas delegation: "a damned
        sellout"; he asks the Southerners to resist the civil rights plank. Five States refuse their allotted contributions
        to the party''s finance committee. Cooper, chairman of the platform''s subcommittee on foreign relations: the best
        thing that could have happened to the party; Dewey: a help in November.'
      n: '[[w.smith-on-his-own-terms]], 346 (and *Time* on Nixon''s "brilliant timing and tactics"). To check: *Time*, Aug.
        1, 1960; *New York Times*, July 25, 1960 (cited by [[w.smith-on-his-own-terms]], 346). See [[cal.1960-07-22.elections-1960]].
        Names: Cooper, Dewey.'
      tags:
      - name:cooper-john-sherman
      - name:dewey-thomas-e
      src:
        c: b3bd3750
        rows:
        - 'w.smith-on-his-own-terms 346: all'
        - 'via x.1960-08-01.time-aug-1-1960: C'
        - 'via x.1960-07-25.new-york-times-july-25-1960-dewey: F'
