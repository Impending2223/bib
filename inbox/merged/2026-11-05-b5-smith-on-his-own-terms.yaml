      when: June–Aug., the summer
      date: 1961-06
      thread: elections-1964
      c: 'Rockefeller hands Emmet Hughes a one-sentence statement of his separation from his wife, to go out that day. Hughes
        protests and drafts his resignation. On the fourth day, after breakfast at 810 Fifth Avenue and the drive to West
        Fifty-fifth Street: "Are you sure you are right?" The announcement put off.'
      n: '[[w.smith-on-his-own-terms]], 359 (Tod Rockefeller, to Hughes later: he had pressed her for six months). Check:
        the month. The announcement: [[cal.1961-11-17.elections-1964]]. Names: Rockefeller, Hughes.'
      tags:
      - name:rockefeller-nelson
      - name:hughes-emmet-john
      src:
