      n: 'FRUS 1964–68, XI, doc. [280](https://history.state.gov/historicaldocuments/frus1964-68v11/d280); XIV, doc. [294](https://history.state.gov/historicaldocuments/frus1964-68v14/d294); VII, doc. [9](https://history.state.gov/historicaldocuments/frus1964-68v07/d9). [[w.dobrynin-in-confidence]], 189–90 (Rostow at a private dinner, for Johnson; not the words quoted). Made public: FRUS 1964–68, XI (1997) and XIV (2001) (Check the years). The hour, 8:30 p.m., as Rostow''s memorandum of 11:15 a.m. sets it: FRUS 1964–68, XIV, doc. 294. To check: [[w.newhouse-cold-dawn]]; [[w.garthoff-detente-and-confrontation]]. See [[cal.1968-06-21.testing]]. Names: Rostow, Dobrynin, Johnson, Kosygin.'
