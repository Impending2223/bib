      n: '[[w.macv-command-history-1968]], 416–17; [[w.cosmas-joint-chiefs-of-staff]], 241 (the final day''s 263 armed reconnaissance and 48 tactical strike sorties; in October 11,936 attack sorties over the North, against 10,646 in September). Check: Cosmas gives 311 sorties Nov. 1 (241). 2100 hours Saigon time, 1300Z: the halt from 8 a.m. Washington time, The President''s Address to the Nation Upon Announcing His Decision To Halt the Bombing of North Vietnam, [1968–69 Pub. Papers 1099](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=409) (Oct. 31, 1968). To check: Combat Analysis Group, J-3, "Statistical Digest of Military Developments in Southeast Asia," CAG Statistical Series, v (cited by [[w.cosmas-joint-chiefs-of-staff]], 241 n.15); I, no. 7, 3 Feb 69 (cited by [[w.cosmas-joint-chiefs-of-staff]], 241 n.15); NMCC OPSUM 259-68, 2 Nov 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 241 n.15).'
