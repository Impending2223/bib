patch: '2026-11-05-b4-young-easy'
by: Claude (batch 4 reader, Young, An Easy Burden)
ops:
- add:
    entry:
      id: cal.1961-01.press-and-broadcasting
      when: Jan.
      date: '1961-01'
      thread: press-and-broadcasting
      also:
      - desegregation-public-places
      c: 'NBC, an hour: "The Nashville Sit-in Story." Lawson and C. T. Vivian; John Lewis, Bernard Lafayette, Bevel, Diane Nash, Angela Butler and Marion Barry among the students shown. Kelly Miller Smith opens it: Nashville''s "tragedy was its race relations."'
      n: '[[w.young-easy-burden]], 125–27. Check: the day; Young: "Early in 1961," watched at home in Queens. Names: Lawson, John Lewis, Nash.'
      src:
        c: d95a70d2
        rows:
        - 'w.young-easy-burden 125–27: all'
      tags:
      - 'name:lawson-james-m-jr'
      - 'name:lewis-john'
      - 'name:nash-diane'
- add:
    entry:
      id: cal.1961-02.civil-rights-organizations
      when: Feb.
      date: '1961-02'
      thread: civil-rights-organizations
      c: 'Highlander Folk School, Tennessee. A student conference, "New Alliances in the South": thirty-one representatives of the organizations of the sit-ins of 1960, on the lessons of the Nashville and Atlanta movements. Andrew Young, of the National Council of Churches'' youth department, conducts Bible study.'
      n: '[[w.young-easy-burden]], 129–30. Check: the day. Names: Andrew Young.'
      src:
        c: 3eb3c4fb
        rows:
        - 'w.young-easy-burden 129–30: all'
      tags:
      - 'name:young-andrew-j-jr'
- add:
    entry:
      id: cal.1961-04-25.civil-rights-organizations
      when: Apr. 25
      date: '1961-04-25'
      thread: civil-rights-organizations
      c: 'King to Myles Horton of Highlander, by letter, answering Horton''s of Mar. 24 on Andrew Young for Highlander''s staff: "I cannot for the world of me place Andrew Young!"'
      n: '[[w.young-easy-burden]], 130–31 (the letter, given Young by Horton, quoted). Names: Martin Luther King, Andrew Young.'
      src:
        c: 9b037a7c
        rows:
        - 'w.young-easy-burden 130–31: all'
        - 'via x.1961-04-25.king-to-horton: all'
      tags:
      - 'name:king-martin-luther-jr'
      - 'name:young-andrew-j-jr'
- add:
    entry:
      id: cal.1961-08.civil-rights-organizations-2
      when: Aug.
      date: '1961-08'
      thread: civil-rights-organizations
      c: 'Highlander closed by Tennessee''s courts, the United Church of Christ''s Board for Homeland Ministries, through Wesley Hotchkiss of its American Missionary Association Division, takes over the Field Foundation''s grant for Highlander''s citizenship program. Andrew Young its coordinator, on the Board''s staff; the program in SCLC''s Atlanta offices, its weeklong sessions at the Board''s Dorchester Center, Dorchester, Ga., near Savannah.'
      n: '[[w.young-easy-burden]], 133–35 (the arrangement "finally worked out in August 1961"). Check: the day, and the day of the Tennessee court''s order. Names: Andrew Young.'
      src:
        c: 569cf572
        rows:
        - 'w.young-easy-burden 133–35: all'
      tags:
      - 'name:young-andrew-j-jr'
- add:
    entry:
      id: cal.1961-08.civil-rights-organizations-3
      when: Aug.
      date: '1961-08'
      thread: civil-rights-organizations
      c: 'Andrew Young, Septima Clark and Dorothy Cotton, recruiting for the citizenship schools, by car from Dorchester: Macon; Thomasville, Ga.; New Orleans, A. L. Davis and other ministers; Natchez, Miss.; Canton, Miss., Annie Devine; Jackson, Medgar Evers; Mound Bayou, Miss.; Clarksdale, Miss., Aaron Henry and Vera Pigee; Greenwood, Miss.; Meridian, Miss.; Tuscaloosa; Marion, Ala.; Birmingham, Shuttlesworth''s Alabama Christian Movement; to SCLC''s meeting at Chattanooga.'
      n: '[[w.young-easy-burden]], 141–42 (two weeks before the convention; "the 1961 SCLC board meeting" at Chattanooga). Check: the month; Young puts the convention "in August." Names: Andrew Young, Annie Devine, Medgar Evers, Aaron Henry, Shuttlesworth.'
      src:
        c: cac3b6fd
        rows:
        - 'w.young-easy-burden 141–42: all'
      tags:
      - 'name:young-andrew-j-jr'
      - 'name:devine-annie'
      - 'name:evers-medgar'
      - 'name:henry-aaron'
      - 'name:shuttlesworth-fred'
- add:
    entry:
      id: cal.1961-05.civil-rights-organizations
      when: May
      date: '1961-05'
      thread: civil-rights-organizations
      c: 'New York. Levison has Andrew Young and his wife to his house; a letter from King follows, asking Young to SCLC in Atlanta; Young declines. Horton and Chuck Boyles then offer him Highlander''s leadership training program, on a grant from the Field Foundation, to teach adults to read and write for voter registration; he accepts.'
      n: '[[w.young-easy-burden]], 131–32. Check: the month; Young: "during the spring of 1961." See [[cal.1961-04-25.civil-rights-organizations]]. Names: Levison, Andrew Young, Martin Luther King.'
      src:
        c: c8ff015f
        rows:
        - 'w.young-easy-burden 131–32: all'
      tags:
      - 'name:levison-stanley-d'
      - 'name:young-andrew-j-jr'
      - 'name:king-martin-luther-jr'
- add:
    entry:
      id: cal.1963-04.alabama-birmingham
      when: Apr.
      date: '1963-04'
      thread: alabama-birmingham
      c: 'Birmingham. Through Peggy Horne of the Episcopal diocese, Andrew Young with Bishop George Murray at the diocese''s headquarters; then King, Shuttlesworth and Young with Murray, Sidney Smyer of the Board of Trade and other businessmen.'
      n: '[[w.young-easy-burden]], 203, 229 (Young''s meetings with Smyer and Murray continuing while King was in jail). Check: the days. Names: Andrew Young, Martin Luther King, Shuttlesworth.'
      src:
        c: 745f9e12
        rows:
        - 'w.young-easy-burden 203, 229: all'
      tags:
      - 'name:young-andrew-j-jr'
      - 'name:king-martin-luther-jr'
      - 'name:shuttlesworth-fred'
- add:
    entry:
      id: cal.1966-06.mississippi-meredith
      when: June
      date: '1966-06'
      thread: mississippi-meredith
      also:
      - open-housing
      c: 'SCLC brings Chicago''s Blackstone Rangers to the march from Memphis; back in Chicago they serve as marshals of SCLC''s marches.'
      n: '[[w.young-easy-burden]], 395. Check: the day. See [[cal.1966-06-07.mississippi-meredith]].'
      src:
        c: '8211d850'
        rows:
        - 'w.young-easy-burden 395: all'
      tags: []
- add:
    entry:
      id: cal.1963-06-12.mississippi-2
      when: June 12
      date: '1963-06-12'
      thread: mississippi
      c: 'Winona. Andrew Young, Bevel and Dorothy Cotton, sent by King about 1 a.m. after the news of Evers''s murder, drive from Birmingham, arriving late in the morning. With the sheriff, Wiley Branton on the telephone from Atlanta and an FBI agent come on a brutality complaint: bonds of $300 each for Hamer, Annelle Ponder, June Johnson, Rosemary Freeman, Elvester Morris and Lawrence Guyot. They come out beaten; to Greenwood.'
      n: '[[w.young-easy-burden]], 253–57; the agent, by Young''s account, "the brother-in-law of the sheriff" (257). See [[cal.1963-06-09.mississippi]]. Names: Andrew Young, Martin Luther King, Medgar Evers, Hamer, Ponder, Guyot.'
      src:
        c: 227aca4c
        rows:
        - 'w.young-easy-burden 253–57: all'
      tags:
      - 'name:young-andrew-j-jr'
      - 'name:king-martin-luther-jr'
      - 'name:evers-medgar'
      - 'name:hamer-fannie-lou'
      - 'name:ponder-annelle'
      - 'name:guyot-lawrence'
- add:
    entry:
      id: cal.1963-07.georgia
      when: July
      date: '1963-07'
      thread: georgia
      c: 'Savannah. Andrew Young, come from Birmingham, walks beside a march to the Holiday Inn; the police arrest the marchers at its drive, Young asking to go with them; a night in the city''s work camp. Next day, Burke Marshall having called, Young with the city manager, Arthur Mendosa: Hosea Williams, sixty-six days in jail under a peace bond of $55,000, and the others out; negotiations to follow.'
      n: '[[w.young-easy-burden]], 259–62. Check: the day; Young: "the summer of 1963" (281). Check: the city manager''s name; Young prints "Mendosa." Names: Andrew Young, Burke Marshall, Hosea Williams.'
      src:
        c: 625f29e4
        rows:
        - 'w.young-easy-burden 259–62: all'
      tags:
      - 'name:young-andrew-j-jr'
      - 'name:marshall-burke'
      - 'name:williams-hosea'
- add:
    entry:
      id: cal.1964-08.elections-1964-freedom-democrats
      when: Aug.
      date: '1964-08'
      thread: elections-1964-freedom-democrats
      c: 'Atlantic City, the basement of a Negro church near the convention hall, Bob Spike''s arrangement. Andrew Young, for King, with Forman, Cleve Sellers and John Lewis of SNCC: SCLC for dividing Mississippi''s votes between the Freedom Democrats and the regulars, SNCC for all or a walkout. Forman and Sellers: "You just selling us out!" Lewis: "we have shed too much blood in Mississippi to accept a compromise."'
      n: '[[w.young-easy-burden]], 306–8. Check: the day, during the convention. Names: Andrew Young, Martin Luther King, Forman, John Lewis.'
      src:
        c: ea9d69ae
        rows:
        - 'w.young-easy-burden 306–8: all'
      tags:
      - 'name:young-andrew-j-jr'
      - 'name:king-martin-luther-jr'
      - 'name:forman-james'
      - 'name:lewis-john'
- add:
    entry:
      id: cal.1964-12-18.king-2
      when: Dec. 18
      date: '1964-12-18'
      thread: king
      c: 'New York. King with Rockefeller: the Nobel money, $54,000, to go to the movement, shared with the NAACP and SNCC. Rockefeller: "You can''t afford to do that"; he pledges $54,000 of his own to civil rights organizations and lends King his plane to Washington.'
      n: '[[w.young-easy-burden]], 326. Check: the day; Young: in New York after the Armory rally, the plane taking them to Washington for the meetings with Humphrey and Johnson. See [[cal.1964-12-17.king-2]]. Names: Martin Luther King, Nelson Rockefeller.'
      src:
        c: '32683ea1'
        rows:
        - 'w.young-easy-burden 326: all'
      tags:
      - 'name:king-martin-luther-jr'
      - 'name:rockefeller-nelson'
- add:
    entry:
      id: cal.1964-12-18.voting-rights
      when: Dec. 18
      date: '1964-12-18'
      thread: voting-rights
      also:
      - king
      c: 'Washington, the Justice Department. King, Andrew Young and others with Katzenbach and Humphrey, about an hour, for a voting rights act in 1965. Humphrey: "I''m sure we can''t get a voting rights bill, not in 1965. ... It''s too soon." Called away, he returns with Johnson''s invitation to the White House.'
      n: '[[w.young-easy-burden]], 326. Check: the day; Young: the day of the meeting with Johnson. See [[cal.1964-12-14.voting-rights]]. Names: Martin Luther King, Andrew Young, Katzenbach, Humphrey.'
      src:
        c: 2f340db6
        rows:
        - 'w.young-easy-burden 326: all'
      tags:
      - 'name:king-martin-luther-jr'
      - 'name:young-andrew-j-jr'
      - 'name:katzenbach-nicholas'
      - 'name:humphrey-hubert-h'
- add:
    entry:
      id: cal.1967-01.king
      when: Jan.
      date: '1967-01'
      thread: king
      also:
      - war-opposition
      c: 'New York, the Americana Hotel, at night. Bernard Lee, tired of King''s talk of the war, calls the White House; Johnson comes to the telephone: King and Johnson, half an hour. Johnson: "Some of these generals want to bomb Vietnam right up to China and end it all"; he needs King''s support and the civil rights leaders'' to keep the generals in check.'
      n: '[[w.young-easy-burden]], 433–34 (Young in the room; the call placed as Lee told it). Check: the month; Young: "In early 1967." Names: Martin Luther King, Johnson.'
      src:
        c: 2cd55c4c
        rows:
        - 'w.young-easy-burden 433–34: all'
      tags:
      - 'name:king-martin-luther-jr'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1967-01-30.king
      when: Jan. 30
      date: '1967-01-30'
      thread: king
      also:
      - voting-rights
      c: 'Chicago. SCLC''s day of voter registration, deputy registrars at churches and other sites on the Cook County Registrar''s leave. Snow from the morning, knee-deep; Andrew Young and four volunteers snowed in.'
      n: '[[w.young-easy-burden]], 418–19. Names: Andrew Young.'
      src:
        c: 2c9eda62
        rows:
        - 'w.young-easy-burden 418–19: all'
      tags:
      - 'name:young-andrew-j-jr'
- add:
    entry:
      id: cal.1967-06.war-opposition
      when: June
      date: '1967-06'
      thread: war-opposition
      also:
      - press-and-broadcasting
      c: 'Cleveland, the National Negro Publishers Association''s annual meeting. At SCLC''s request, John and Robert Johnson of Johnson Publishing helping, King at a luncheon, without notes, on the war and the poverty program; the publishers, told at the White House he was misinformed, won over, by Young''s account.'
      n: '[[w.young-easy-burden]], 432–33. Check: the month; Young: "during the summer of 1967." Names: Martin Luther King.'
      src:
        c: b2dacd63
        rows:
        - 'w.young-easy-burden 432–33: all'
      tags:
      - 'name:king-martin-luther-jr'
- add:
    entry:
      id: cal.1967-09.king-poor-peoples
      when: Sept.
      date: '1967-09'
      thread: king-poor-peoples
      c: 'Atlanta, SCLC''s office. Marian Wright, of the Legal Defense Fund in Mississippi, with four men from the Delta out of work since the farm programs paid planters not to plant: a sit-in and fast at Wirtz''s office. After, King and Andrew Young: not a handful but a couple of thousand to Washington, to stay until something is done.'
      n: '[[w.young-easy-burden]], 437–38. Check: the day; and whether this is the plan Marian Wright put at the Airlie House retreat. See [[cal.1967-09-13.king-poor-peoples]]. Names: Marian Wright, Martin Luther King, Andrew Young.'
      src:
        c: cea2c47d
        rows:
        - 'w.young-easy-burden 437–38: all'
      tags:
      - 'name:wright-marian'
      - 'name:king-martin-luther-jr'
      - 'name:young-andrew-j-jr'
- add:
    entry:
      id: cal.1967-10.press-and-broadcasting-2
      when: Oct.
      date: '1967-10'
      thread: press-and-broadcasting
      also:
      - king-poor-peoples
      c: 'King and Andrew Young with the editors of *Time*, *Life* and *Fortune*: the riots near the point of no return, anarchy or a right-wing police state ahead; the poverty program too small, slowed by bureaucracy, too much of its money to consultants, studies and evaluations.'
      n: '[[w.young-easy-burden]], 438. Check: the month and the place; Young: "A few weeks later" than Marian Wright''s visit. Names: Martin Luther King, Andrew Young.'
      src:
        c: 2f85a96c
        rows:
        - 'w.young-easy-burden 438: all'
      tags:
      - 'name:king-martin-luther-jr'
      - 'name:young-andrew-j-jr'
- add:
    entry:
      id: cal.1967-10.king-poor-peoples
      when: Oct.
      date: '1967-10'
      thread: king-poor-peoples
      c: 'New York. A meeting set up by Kenneth Clark, young militants among those there, with King and Bernard Lee. Pressed on violence, told of Birmingham and Selma: "If you undertake a massive large-scale protest in Washington, we''ll support it."'
      n: '[[w.young-easy-burden]], 438 (Young not there). Check: the month; Young: "Shortly after" the meeting with the editors. Names: Martin Luther King.'
      src:
        c: '9011da97'
        rows:
        - 'w.young-easy-burden 438: all'
      tags:
      - 'name:king-martin-luther-jr'
- add:
    entry:
      id: cal.1967-11-08.mayors
      when: Nov. 8
      date: '1967-11-08'
      thread: mayors
      also:
      - king
      - elections-1967
      c: 'Cleveland. Stokes, mayor-elect, comes by in the morning to thank King for SCLC''s weeks of getting out the vote. Election night the campaign never called King to the headquarters; he watched the acceptance on television.'
      n: '[[w.young-easy-burden]], 436–37 (SCLC''s staff in Cleveland from the summer). See [[cal.1967-11-07.mayors-cleveland]]. Names: Stokes, Martin Luther King.'
      src:
        c: 9d220b31
        rows:
        - 'w.young-easy-burden 436–37: all'
      tags:
      - 'name:stokes-carl-b'
      - 'name:king-martin-luther-jr'
- add:
    entry:
      id: cal.1968-02.king-poor-peoples
      when: Feb.
      date: '1968-02'
      thread: king-poor-peoples
      also:
      - labor-disputes
      c: 'California. Andrew Young, recruiting for the Poor People''s Campaign, in Cesar Chavez''s office when word comes that the growers have gone back on an unwritten agreement on the lettuce crop. Chavez: "I should have been more careful. It''s going to take us a little longer."'
      n: '[[w.young-easy-burden]], 445–46. Check: the month and the place; Young: the calls to the other minorities "In February." Names: Andrew Young, Cesar Chavez.'
      src:
        c: '19272f4d'
        rows:
        - 'w.young-easy-burden 445–46: all'
      tags:
      - 'name:young-andrew-j-jr'
      - 'name:chavez-cesar'
- add:
    entry:
      id: cal.1968-04-05.king-3
      when: Apr. 5
      date: '1968-04-05'
      thread: king
      also:
      - king-poor-peoples
      c: 'Memphis, the Lorraine, Room 306, about 3 to 4 a.m. Abernathy, Hosea Williams, Bevel, James Orange, Ben Hooks, Billy Kyles, Lawson, Bernard Lee and Andrew Young. Bevel: "Ralph Abernathy is our leader now and we have to go to work behind him." Abernathy, named King''s successor by the board years before, chosen by the staff''s acclamation: "I won''t ask any more of you than I gave to Martin." The Poor People''s Campaign to go forward; two services for King, the family to decide. About 4:30, to R. C. Lewis''s funeral home for the coffin.'
      n: '[[w.young-easy-burden]], 468–69. See [[cal.1968-04-04.king]]. Names: Abernathy, Hosea Williams, Lawson, Andrew Young, Martin Luther King.'
      src:
        c: '338704f4'
        rows:
        - 'w.young-easy-burden 468–69: all'
      tags:
      - 'name:abernathy-ralph-david'
      - 'name:williams-hosea'
      - 'name:lawson-james-m-jr'
      - 'name:young-andrew-j-jr'
      - 'name:king-martin-luther-jr'
- add:
    entry:
      id: cal.1968-04-19.king-poor-peoples
      when: Apr. 19
      date: '1968-04-19'
      thread: king-poor-peoples
      c: 'Abernathy: the Poor People''s March to Washington will go ahead.'
      n: '[[w.young-easy-burden]], 480; by the time of the march, Young writes, more than three thousand pledged besides the core fifteen hundred (480). See [[cal.1968-04-05.king-3]]. Names: Abernathy.'
      src:
        c: 07e72e93
        rows:
        - 'w.young-easy-burden 480: all'
      tags:
      - 'name:abernathy-ralph-david'
- add:
    entry:
      id: cal.1968-06.king-poor-peoples
      when: June
      date: '1968-06'
      thread: king-poor-peoples
      c: 'Washington, Resurrection City, at night. The District''s police, in gas masks, fire tear gas into the camp while its people sleep, saying rocks were thrown at motorists. Andrew Young to the commander, who takes off his mask and stops it.'
      n: '[[w.young-easy-burden]], 489. Check: the day; Young: one night before the permit ran out, June 23. See [[cal.1968-06-19.king]]. Names: Andrew Young.'
      src:
        c: 190fba07
        rows:
        - 'w.young-easy-burden 489: all'
      tags:
      - 'name:young-andrew-j-jr'
