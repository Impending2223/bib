        by [[w.branch-pillar-of-fire]], 601); Baumgardner to Sullivan, Feb. 27, 1965, FBI file FMX-NR (cited by [[w.branch-pillar-of-fire]],
        601); Magida, *Prophet of Rage* (1996), 89–90 (cited by [[w.branch-pillar-of-fire]], 601); [[w.goldman-death-and-life-of]],
        301 (cited by [[w.branch-pillar-of-fire]], 601); Clegg, *An Original Man* (1997), 231 (cited by [[w.branch-pillar-of-fire]],
        601). Branch: Wallace Muhammad, for refusing to teach the Nation''s doctrine, left by his father without pay or post
        (601). Check: the note''s *Chicago''s American* is dated Feb. 25, the day before. See [[cal.1965-02-21.states-and-cities]].'
