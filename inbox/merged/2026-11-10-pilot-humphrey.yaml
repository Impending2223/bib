patch: 2026-11-10-pilot-humphrey
by: 'Claude (pilot: Humphrey, Education of a Public Man; the private, social, family and minor rows re-ruled by the reader card, Nov. 10, 2026; corrected from the blind audit, Nov. 11, the pages read again from the owner''s copy). The "already in" rows are left to b7-humphrey-education-of, whose cites the pilot had repeated; the son''s surgery (p. 285) is held for the owner in 2026-11-11-held-humphrey-285.'
ops:
- add:
    entry:
      id: cal.1963-08.march-on-washington-5
      when: Aug.
      date: 1963-08
      thread: march-on-washington
      c: 'Kennedy asks Humphrey to tell him whatever he learns of the March; others reporting to him too. Washington''s fears of disorder in the weeks before. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 271. Check: the day; the memoir: "During the weeks preceding the March." See [[cal.1963-08-27.march-on-washington]]. Names: Kennedy, Humphrey.'
      tags: [name:kennedy-john-f, name:humphrey-hubert-h]
- add:
    entry:
      id: cal.1964-08-29.elections-1964-johnson
      when: Aug. 29
      date: '1964-08-29'
      thread: elections-1964-johnson
      also: [press-and-broadcasting]
      c: 'The LBJ Ranch. Johnson has Humphrey put on a rancher''s outfit, too big for him, and Johnson''s own hat, and ride a big, spirited horse before reporters and cameramen; the horse rears. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 307–08. Check: the day; the memoir says only "after the 1964 convention," at the Ranch; the Ranch days known are Aug. 28–29. See [[cal.1964-08-29.elections-1964]]; [[cal.1964-08-28.press-and-broadcasting-2]]. Names: Johnson, Humphrey.'
      tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
- add:
    entry:
      id: cal.1966-02-10.vietnam-humphrey
      when: Feb. 10
      date: '1966-02-10'
      thread: vietnam-humphrey
      c: 'Honolulu to Saigon. Humphrey, on the flight with Kỳ and Thiệu: Thiệu the strongman, who will take power; Kỳ the front man. He so reports to Johnson. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 331. Check: the day of the report to Johnson. See [[cal.1966-02-10.vietnam]]. Names: Humphrey, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu, Johnson.'
      tags: [name:humphrey-hubert-h, name:nguyen-cao-ky, name:nguyen-van-thieu, name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1966-02-10.vietnam-humphrey-2
      when: Feb. 10–12
      date: '1966-02-10'
      thread: vietnam-humphrey
      c: 'Saigon. Westmoreland''s briefings for Humphrey: American soldiers and civilians, Vietnamese labor leaders. Habib, to one of Humphrey''s staff: he hopes Humphrey will talk to others than his briefers. Thomson meets some of Lansdale''s staff, Ellsberg among them, and reporters, Ward Just of the *Washington Post* among them, highly critical. Humphrey does not dispute Westmoreland''s and Lodge''s presentation. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 331–32. Check: the day. See [[cal.1966-02-10.vietnam]]; [[cal.1966-02-12.vietnam-humphrey]]. Names: Humphrey, Westmoreland, Habib, Thomson, Lansdale, Ellsberg, Lodge.'
      tags: [name:humphrey-hubert-h, name:westmoreland-william, name:habib-philip-c, name:thomson-james-c-jr, name:lansdale-edward-g, name:ellsberg-daniel, name:lodge-henry-cabot, place:saigon]
- add:
    entry:
      id: cal.1966-05.transition-and-staff-2
      when: May
      date: 1966-05
      thread: transition-and-staff
      c: 'Humphrey and his wife at the White House for dinner and movies, several evenings. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 342. Check: the days. See [[cal.1966-05-27.transition-and-staff]]. Names: Humphrey, Johnson.'
      tags: [name:humphrey-hubert-h, name:johnson-lyndon-b]
- edit:
    id: cal.1966-05-27.transition-and-staff
    base: 7d2233a5
    set:
      c: Humphrey's birthday. Johnson calls in the press and photographers and gives him a watch, an electric razor and three pictures of the two together. By Humphrey's account.
- add:
    entry:
      id: cal.1966-12-29.transition-and-staff
      when: Dec. 29
      date: '1966-12-29'
      thread: transition-and-staff
      c: 'Puerto Rico. Humphrey, asked by Istomin and Stern, at the evening honoring Pablo Casals on his ninetieth birthday: Stern, Istomin and Rose play a piece of Casals''s he had never played, for political reasons. Humphrey presents him a pipe; brief speeches; dinner after. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 418. Check: the day; the memoir gives only "his ninetieth birthday," and Casals was born Dec. 29, 1876 (Wikipedia, "Pablo Casals," read Nov. 11, 2026). Names: Humphrey.'
      tags: [name:humphrey-hubert-h]
- cite:
    id: cal.1967-04.europe-and-the-alliance-2
    item: '[[w.humphrey-education-of-a-public-1976]], 416 (a lunch with de Gaulle; the toast written by a State Department escort tossed away; an ad-libbed toast from Lafayette, whose picture was on the wall, to the glory of France; de Gaulle''s eyes fill with tears; no day, no Statue of Liberty)'
    units: A
- add:
    entry:
      id: cal.1968-03-31.elections-1968-humphrey
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-humphrey
      also: [latin-america]
      c: 'Mexico City, Ambassador Fulton Freeman''s residence. Humphrey hosts a dinner for President Díaz Ordaz. For Johnson''s address, the two and their wives in the library, the guests in other rooms, the press outside. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 358–59, 359 n. (by his note, the first time a Mexican President set foot in the American Embassy since the Revolution). See [[cal.1968-03-31.elections-1968-4]]; [[cal.1968-03-31.elections-1968-6]]. Names: Humphrey, Díaz Ordaz, Johnson.'
      tags: [name:humphrey-hubert-h, name:diaz-ordaz-gustavo, name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1968-04-01.testing-npt
      when: Apr. 1
      date: '1968-04-01'
      thread: testing-npt
      also: [latin-america]
      c: 'Mexico City. Humphrey, the United States'' representative, signs a nuclear nonproliferation treaty for the Western Hemisphere. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 358, 360 (the trip, from Mar. 31 to Andrews on "Monday evening," Apr. 1). Check: the day; the memoir does not date the signing. See [[cal.1968-02-14.testing-npt]]. Names: Humphrey.'
      tags: [name:humphrey-hubert-h]
- add:
    entry:
      id: cal.1969-01.transition-and-staff-2
      when: Jan.
      date: 1969-01
      thread: transition-and-staff
      c: 'Humphrey asks Johnson to consider nominating him a trustee of the Woodrow Wilson International Center for Scholars, established by Congress in 1968. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 494 n.1. Check: the day; the memoir: "Just before my term as Vice President ended." Names: Humphrey, Johnson.'
      tags: [name:humphrey-hubert-h, name:johnson-lyndon-b]
- add:
    entry:
      id: cal.1969-01.transition-and-staff-3
      when: Jan.
      date: 1969-01
      thread: transition-and-staff
      c: 'Johnson nominates Humphrey the first chairman of the Wilson Center''s board, "one of his final acts as President." By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 494 n.1. Check: the day. See [[cal.1969-01.transition-and-staff-2]]. Names: Johnson, Humphrey.'
      tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
- check:
    id: cal.1968-09.elections-1968-humphrey-2
    text: 'Check: the month; the memoir gives none (398–99, among the fall campaign''s States).'
