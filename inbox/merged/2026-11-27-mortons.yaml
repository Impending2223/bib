- edit:
    id: cal.1964-05-07.civil-rights-bill-5
    base: ab054551
    kind: reword
    set:
      c: 'The bipartisan floor leaders'' group, morning. Humphrey: the Mansfield-Dirksen jury trial amendment must get a bigger vote than Thruston Morton''s; "If we can produce sixty-four votes, we are okay. But if we only secure forty-nine votes, then we have had it." Rauh: the Leadership Conference still against dealing directly with Dirksen. Mitchell demands the text of Dirksen''s amendments; Katzenbach: there is none, it is being rewritten; Mitchell: the talks should be called off. Humphrey: "It is not pleasant for Tommy Kuchel and myself to have it appear that Dirksen is writing the ticket. I want the bill passed"; no title eliminated, none emasculated; "I''d rather have no bill than the shell of a bill"; the Conference should be out getting votes.'
