    base: f523ad74
    kind: reword
    set:
      c: 'Eve of the cloture vote.{1} Johnson to Humphrey by telephone: has he the sixty-seven votes?{2} "I don''t want to know what you think. What''s the vote going to be?"{3} Humphrey: "We have the votes."{7} Humphrey sure of sixty-six;{4} that evening he works on three Democrats of the Southwest.{5} They are Edmondson, Yarborough and Cannon.{8} Hayden''s vote promised earlier, for the Central Arizona project.{6} By Purdum, Edmondson, whom Johnson had lobbied, has agreed because of the Thruston Morton amendment; Johnson: "the Republicans are doing a little better than we are"; Dirksen counts on at least twenty-six of the thirty-three Republicans.{9}'
