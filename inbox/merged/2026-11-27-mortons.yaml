      n: '[[w.whalen-longest-debate]], 195; [[w.risen-bill-of-the-century]], 224–27 (Hickenlooper''s amendment to strike school desegregation aid, Cotton''s for employers of a hundred or more, 224–25; Tuesday, 40 to 56 and 34 to 63; Ervin''s motion to strike Title VII defeated, 225); [[w.purdum-idea-whose-time-has-2014]], 298–99 (Tuesday, June 9: Morton''s amendment passes 51–48 (jury trials in all criminal contempt except Title I, $1,000 or six months; the Justice lawyers find it harmless), Hickenlooper''s fails 40–56, Cotton''s 34–63; Mansfield warns of speeches past midnight); [[w.purdum-idea-whose-time-has-2014]], 297–98; [[w.purdum-idea-whose-time-has-2014]], 298–99. The Senate sat from 10 a.m. (its order of June 4) to 9:51 a.m. June 10: [Daily Digest, D257](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=255), [D263](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=261). To check: 110 Cong. Rec. 13050–219
