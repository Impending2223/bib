- edit:
    id: cal.1968-03-19.republican-party-congress
    base: 46130b53
    kind: reword
    set:
      c: 'Washington, the morning. Rockefeller with sixteen or seventeen Republican Senators, Thruston Morton and Hugh Scott his hosts. No enthusiasm;{1} Fong: let him spend his money on a campaign, it would publicize the party and help elect Nixon. On his jet back to New York that night, Rockefeller decides it is hopeless.{2}'
