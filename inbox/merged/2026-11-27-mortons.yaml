- edit:
    id: cal.1964-06-10.civil-rights-bill
    base: 26f7da1d
    kind: reword
    set:
      c: 'Cloture on the civil rights bill, [71–29](https://voteview.com/rollcall/RS0880302), the first on a civil rights bill since Rule XXII''s adoption in 1917: Republicans 27–6, Democrats 44–23.{1} Robert Byrd had spoken through the night, 14 hours 13 minutes.{2} Dirksen: "Stronger than all the armies is an idea whose time has come."{3} June 9, Thruston Morton''s jury trial amendment, every title but voting, adopted, [51–48](https://voteview.com/rollcall/RS0880298).{4} All one hundred Senators present, Metcalf presiding. Engle, ill with brain cancer, is wheeled in; at Kuchel''s request his finger lifted to his eye is recorded as yea. John J. Williams of Delaware casts the sixty-seventh vote; Hayden votes no after Mansfield tells him, "We''ve got the votes." Goldwater and Tower are among the six Republicans against. The filibuster: seventy-five days, 534 hours, 1 minute and 51 seconds.{5} Goldwater votes against on Kitchel''s advice, armed with Robert Bork''s seventy-five-page critique.{6}
        O''Brien: "like the home team winning the Super Bowl."{7}'
      n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt10/pdf/GPO-CRECB-1964-pt10-6-2.pdf) (1964). [Cloture and Final Passage of the Civil Rights Act of 1964](https://www.senate.gov/legislative/landmark-legislation/civil-rights-act-of-1964/cloture-and-final-passage-of-the-civil-rights-act-of-1964-essay.htm) (Senate Historical Office). [[w.dallek-flawed-giant]], 119 (Dirksen''s words); [[w.branch-pillar-of-fire]], 334–37; [[w.humphrey-education-of-a-public-1976]], 282–83 (the seventy-fifth day; Dirksen''s words; 71 to 29); [[w.solberg-hubert-humphrey]], 226 (cloture, 71–29; Engle; Hayden in the cloakroom); [[w.kabaservice-rule-and-ruin]], 98, 101 (Goldwater one of the six Republicans against; Dirksen''s words; 27 of the 33 Republicans for); [[w.sundquist-politics-and-policy]], 269–70 (the vote, 71–29; Dirksen''s words); [[w.mann-walls-of-jericho]], 423–27 (the vote; Byrd''s 14 hours 13 minutes; Dirksen''s words; Morton''s amendment, 51–48); [[w.califano-triumph-and-tragedy-of]],
        54 (Engle, dying of a brain tumor, wheeled in, to signal his vote by pointing to his eye); [[w.kotz-judgment-days]], 151–52 (Engle wheeled in; Williams the sixty-seventh; Hayden no; 71–29); [[w.goldberg-barry-goldwater]], 196 (Goldwater against cloture, on Kitchel''s advice, with Bork''s seventy-five-page critique; his amendments to strike public accommodations and fair employment); [[w.zelizer-fierce-urgency-of-now]], 125–27 (Byrd''s 14 hours 13 minutes, from 7:38 p.m.; Dirksen; 71–29, Republicans 27–6); [[w.bernstein-guns-or-butter]], 75–76 (71 to 29, 44 Democrats and 27 Republicans for; Byrd''s "mini-filibuster" of June 9); [[w.whalen-longest-debate]], 195, 197–200 (Engle''s gesture; Williams the sixty-seventh; Hayden no, the votes in); [[w.young-two-suns-of-the]], 95 (Goldwater against cloture, June 10); [[w.caro-passage-of-power]], 568 (cloture 71–29, June 10, after a filibuster of fifty-seven days, the longest in Senate history; Democrats 44 for, 23 against; Republicans 27
        for, 6 against, Goldwater among them; not Byrd''s speech); [[w.johnson-white-house-diary]], 165–66 (June 11: "Yesterday the Senate had cleared the way for a vote on the Civil Rights Bill, by invoking cloture, with about four votes to spare"; not the count, Byrd or Dirksen); [[w.albert-little-giant-1990]], 286 (the Senate votes cloture, 71 to 29, four above two-thirds, after a three-month southern filibuster; not the day or the party divisions); [[w.risen-bill-of-the-century]], 224–25, 227–29 (Morton''s amendment, jury trials for all criminal contempt but under Title I, adopted Tuesday 51 to 48, 224–25; cloture, 71 to 29, 44 Democrats and 27 Republicans for, 23 and 6 against, the first on a civil rights measure; Byrd''s fourteen hours thirteen minutes; Dirksen, up at 5 a.m. at Broad Run, his speech, cut off by Metcalf; Engle wheeled in, his finger to his eye, Kuchel''s request; all 100 senators present; 534 hours 1 minute 51 seconds of debate in seventy-five days; O''Brien: "like
        the home team winning the Super Bowl"); [[w.purdum-idea-whose-time-has-2014]], 297–303 (Morton''s amendment adopted the day before, 51–48, jury trials in criminal contempt but for Title I (297–98); Byrd''s speech, fourteen hours and thirteen minutes; Dirksen: "Stronger than all the armies is an idea whose time has come"; Engle''s vote; Williams''s the sixty-seventh; 71–29; not the party counts nor 1917 (the notes: 110 Cong. Rec. 13308–19)); [[w.risen-bill-of-the-century]], 227–29; [[w.goldberg-barry-goldwater]], 196; [[w.risen-bill-of-the-century]], 229. The Senate sat from 10 a.m. (its order of June 8) to 5:15 p.m.: [Daily Digest, D263](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=261), [D267](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=265). Check: Solberg dates it June 9 (226). Humphrey''s count that morning: [[cal.1964-06-10.civil-rights-bill-6]]. After [[cal.1964-06-10.civil-rights-bill-10|Russell''s
        last speech]]: Mansfield, Russell, Dirksen, then the roll, in Risen''s sequence (227). Check: Kotz, 151, has the clerk begin the roll "shortly after 10 a.m."; Risen, 227, has the speeches of Mansfield, Russell and Dirksen first. To check: [[w.finley-delaying-the-dream]]; [[w.macneil-dirksen]]. See [[cal.1964-02-10.civil-rights-bill]]. Names: Byrd, Dirksen, Thruston Morton, Metcalf, Engle, Kuchel, John J. Williams, Hayden, Mansfield, Goldwater, Tower, Kitchel, Bork, O''Brien. Check: the page.'
