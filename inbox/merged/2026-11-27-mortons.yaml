patch: 2026-11-27-mortons
by: the session
note: 'The owner, Nov. 27, 2026: the given names "Thruston" and "Rogers" at the first "Morton" in each line and Names: block.'
ops:
- edit:
    id: cal.thread.vietnam-congress-republicans
    base: 99fdbcbe
    kind: reword
    set:
      c: 'The Republican members on the war: the policy committees'' papers, Findley''s and Percy''s resolutions, Ford, Thruston Morton, Javits and Cooper.'
- edit:
    id: cal.1960-01-18.republican-party-congress-2
    base: d2ac26db
    kind: reword
    set:
      c: 'The Senate Republicans'' Committee on Committees, 10:40 to 11:05 a.m.: the slate for Langer''s seats approved unanimously on Hruska''s motion, Williams to Foreign Relations, Cotton to Judiciary, Thruston Morton to Finance. On Javits''s motion, unanimous, it asks the conference for a committee to study assignments.'
      n: '[[w.wolff-minutes-of-the-senate]], 854–56. Names: Langer, Hruska, Williams, Cotton, Thruston Morton, Javits.'
- edit:
    id: cal.1960-03-04.voting-rights
    base: 1869f8d1
    kind: reword
    set:
      c: 'Morse in the Senate with a cloture petition; Hill objects to its lying on a table for signatures. Morse leaves it at the desk; Thruston Morton tears it up: "Censure me if you will."'
      n: '[106 Cong. Rec. 4437–39](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt4/pdf/GPO-CRECB-1960-pt4-3-1.pdf#page=11) (1960) (Mar. 4, 1960). [[w.mann-walls-of-jericho]], 257. To check: [*New York Times*, Mar. 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/03/05/issue.html); *Atlanta Journal*, Mar. 4, 1960 (cited by [[w.mann-walls-of-jericho]], 257). See [[cal.1960-02-05.voting-rights]]. Names: Morse, Lister Hill, Thruston Morton.'
- edit:
    id: cal.1960-05-12.republican-party
    base: 7bf23cdf
    kind: reword
    set:
      c: 'Thruston Morton has offered Rockefeller the convention post of his choice, keynote speaker and temporary chairman or permanent chairman.{1} Hinman to Rockefeller: take the permanent chairmanship, refuse both places on the ticket again, and let Morhouse announce the New York delegation for Nixon; to refuse the vice presidency at the convention itself would do more harm.{2}'
      n: '[[w.gifford-center-cannot-hold]], 43–44; [[w.smith-on-his-own-terms]], 337 (Hinman to Rockefeller, May 12: refusing Morton''s offer "could badly aggravate the image of poor sportsmanship"; Nixon''s "stranglehold"). [[w.white-making-of-the-president]], 181 (the offer, chairman or keynoter, the week of May 1). To check: Hinman to Rockefeller, May 12, 1960, Rockefeller Papers, RG 4, Series J.2, Subseries 4, Box 92, Folder 635, Rockefeller Archive Center (cited by [[w.gifford-center-cannot-hold]], 44 n.59). Names: Thruston Morton, Rockefeller, Hinman, Morhouse, Nixon. Check: the day of Morton''s offer; Gifford gives mid-May; White, 181, the week of May 1.'
- edit:
    id: cal.1960-05-25.elections-1960-2
    base: 7c8b7423
    kind: reword
    set:
      c: 'Rockefeller to a meeting of Republican State leaders: "in all candor," he would accept a draft for the nomination. He may go to the convention after all, if the party accepts that he will not take second place.{1} Thruston Morton welcomes it.{2}'
      n: '[[w.gifford-center-cannot-hold]], 45–46; [[w.smith-on-his-own-terms]], 338–39 (Morhouse''s emergency meeting of the county chairmen at Albany, Nixon''s upstate tour in the offing; Rockefeller hints he would accept a draft and will go to the convention at the head of an uncommitted delegation). [[w.white-making-of-the-president]], 181 (at Albany, before the State Republican Executive Committee, two days after the statement; New York''s delegation held uncommitted). Check: Smith, 338–39, gives no day for the county chairmen''s meeting at Albany; whether it is this meeting. To check: Congressional Quarterly Weekly Report XVIII (May 27, 1960): 929 (cited by [[w.gifford-center-cannot-hold]], 45 n.62); Congressional Quarterly Weekly Report XVIII (June 3, 1960): 964 (cited by [[w.gifford-center-cannot-hold]], 46 n.63). See [[cal.1960-05-23.elections-1960]]. Names: Rockefeller, Thruston Morton. Check: the day; Gifford gives two days after the statement of May 23, as does White, 181.'
- edit:
    id: cal.1960-05.elections-1960-2
    base: c2303c31
    kind: reword
    set:
      c: 'Mid-May. Rockefeller turns down Thruston Morton''s offer and will not go to the convention, the one way to keep his name out of the running for Vice President: "Frankly, I could not justify leaving the governorship of the state of New York to become the Vice President." Morhouse: he "should not be ruled out of contention for the Presidency."{1}'
      n: '[[w.gifford-center-cannot-hold]], 44–45; [[w.smith-on-his-own-terms]], 337 (Rockefeller had suggested staying away from Chicago, the one way to avoid a stampede for second place). [[w.white-making-of-the-president]], 181 (he does not plan to go to the convention; Morhouse, in mid-May, on a draft). Check: Smith, 338–39, has Rockefeller decide, at Morhouse''s meeting of the county chairmen at Albany in mid-May, to go to the convention at the head of an uncommitted delegation. To check: Congressional Quarterly XVII (May 20, 1960): 890 (cited by [[w.gifford-center-cannot-hold]], 45 n.60). See [[cal.1960-05-12.republican-party]]. Names: Rockefeller, Thruston Morton, Morhouse. Check: the day; Gifford''s source is of May 20.'
- edit:
    id: cal.1960-07-03.elections-1960-rockefeller-4
    base: 2112b630
    kind: reword
    set:
      c: 'Thruston Morton, the Republican national chairman, on a recorded telecast, expects New York''s delegation to put Rockefeller''s name in nomination.{1} Rockefeller: "He must have worked out something that I don''t know about."{2}'
      n: 'Douglas Dales, "Rockefeller Says G.O.P. Bars a Test of Men and Issues," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 28. Names: Thruston Morton, Rockefeller.'
- edit:
    id: cal.1960-07-05.republican-party
    base: 0cfd907b
    kind: reword
    set:
      c: 'Thruston Morton, the Republican National Chairman, charges Johnson and Kennedy with an arrangement: Kennedy to head the ticket, Johnson second.'
      n: 'John D. Morris, "Johnson Enters Race Officially; Sees 500 Votes," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 18. Check: the day. Names: Thruston Morton, Johnson, Kennedy.'
- edit:
    id: cal.1960-07-23.republican-party-2
    base: 588f4ac3
    kind: reword
    set:
      c: 'Chicago, Saturday evening. Thruston Morton, the national chairman, under pressure from Newport, R.I., has every plank drafted so far mimeographed and released: the full platform committee to decide whether to change them to the Fifth Avenue terms. Overnight the subcommittees'' planks on farm policy, education and defense are out.'
      n: '[[w.white-making-of-the-president]], 200–01. The morning''s uproar, then the evening''s release: [[w.white-making-of-the-president]], 199–201. See [[cal.1960-07-23.republican-party]]. Names: Thruston Morton.'
- edit:
    id: cal.1960-07-27.elections-1960
    base: 7eb8b30f
    kind: reword
    set:
      c: 'Chicago, late at night after the nomination. Nixon and some twenty party leaders on second place: Thruston Morton, Judd and Lodge left, by Nixon''s account;{1} Judd asks to be passed over;{2} Morton recommends Lodge, as Eisenhower does.{3} Stratton asks for a man for the farm vote; Nixon: "If you ever let them [the Democrats] campaign only on domestic issues, they''ll beat us—our only hope is to keep it on foreign policy."{4} Lodge chosen.{5}'
      n: '[[w.kallina-kennedy-v-nixon]], 94–95; [[w.nixon-rn]], 215–16 (the meeting after the nomination; Morton, Judd and Lodge left; Morton and Eisenhower for Lodge; Lodge chosen); [[w.white-making-of-the-president]], 206–07 (thirty-six leaders summoned; Stratton on hogs; Nixon on foreign policy, quoted; Lodge chosen). [[w.nixon-six-crises]], 317–18 (the meeting after the nomination; Lodge, Morton and Judd left; Morton and Eisenhower for Lodge; Lodge chosen and telephoned about 2:30 a.m.). To check: The Reminiscences of Robert Finch, June 19, 1967, Columbia University Oral History Collection; Carleton Kent and Joseph Albright, "Why Leaders Picked Lodge," *Chicago Sun-Times*, July 29, 1960 (cited by [[w.kallina-kennedy-v-nixon]], 95 n.37). Names: Nixon, Thruston Morton, Judd, Lodge, Eisenhower, Stratton. Check: Nixon gives thirty-two party leaders (*RN*, 215; *Six Crises*, 318). Check: in *Six Crises*, 317, Judd asks to be passed over in a talk with Nixon after his keynote address, not
        at the meeting; and Bricker, for Ohio, for Lodge (318).'
- edit:
    id: cal.1960-07.elections-1960-7
    base: 46bc7d6c
    kind: reword
    set:
      c: 'Before the conventions, after Congress''s resolution on equal time. Thruston Morton and his Democratic counterpart on television; asked whether their parties'' nominees will meet in joint appearances, Morton: the Republican nominee will, under the right circumstances.'
      n: '[[w.nixon-six-crises]], 323. See [[cal.1960-08-24.press-and-broadcasting]]. Names: Thruston Morton. Check: the program and the day; the joint resolution was signed Aug. 24 (74 Stat. 554), Nixon puts its passage before the conventions.'
- edit:
    id: cal.1960-07.elections-1960-8
    base: b23298d5
    kind: reword
    set:
      c: Before the Democratic convention. Thruston Morton, at Nixon's suggestion, predicts in public a Kennedy–Johnson "deal"; both camps deny it.
      n: '[[w.nixon-six-crises]], 312 (by Nixon''s account). Names: Thruston Morton, Nixon, Kennedy, Johnson. Check: the day and where.'
- edit:
    id: cal.1960-08-09.republican-party
    base: 1a679957
    kind: reword
    set:
      c: 'Hermann, head of the National Committee''s Nationalities Division, to Nixon, Hall, Bassett, Finch and Thruston Morton: the division twice its size of 1956.{1} Six hundred nationality leaders met at the Conrad Hilton during the convention, told Nixon could not see them. Meetings with him, photographs, notice in the industrial towns, the foreign-language press: "A strong Nationalities vote for the Vice President could be the balance of power in the industrial States."{2}'
      n: '[[w.gifford-center-cannot-hold]], 174, 179–80. To check: A. B. Hermann to Nixon and others, Aug. 9, 1960, Series 320, Box 37, "ANNL," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 174 n.18, 180 n.31). Names: Nixon, Finch, Thruston Morton.'
- edit:
    id: cal.1960-09-01.republican-party
    base: '93248470'
    kind: reword
    set:
      c: 'Shorey, South Carolina''s Republican chairman, to Thruston Morton: Nixon to keep to the platform''s words on civil rights and to leave the sit-ins alone.'
      n: '[[w.gifford-center-cannot-hold]], 160–61. To check: Shorey to Morton, Sept. 1, 1960, Series 320, Box 693, "Shorey," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 160 n.65). Names: Thruston Morton, Nixon.'
- edit:
    id: cal.1960-10-23.elections-1960
    base: 8992c52e
    kind: reword
    set:
      c: 'Washington, Sunday, by Nixon''s account. An emergency strategy conference against the Kennedy campaign''s talk of a landslide: Hall, Finch and the National Committee under Thruston Morton to send the field "an affirmative optimism campaign." Robinson''s polls still even.'
      n: '[[w.nixon-six-crises]], 358–60. Names: Nixon, Kennedy, Hall, Finch, Thruston Morton.'
- edit:
    id: cal.1960-11-08.elections-1960-count-3
    base: a82855ce
    kind: reword
    set:
      c: 'Los Angeles, the night. John Dreiske of the *Chicago Sun-Times* telephones Nixon: he will not carry Illinois.{1} Nixon confers with Hall, Folger, Finch, Seaton and Klein on a statement conceding;{2} Klein for it, Seaton against; Thruston Morton and Dirksen still arguing against.{3}'
      n: '[[w.kallina-kennedy-v-nixon]], 180; [[w.nixon-six-crises]], 384–85 (the Ambassador, shortly after eleven Pacific: Hall and Folger, then Finch, Seaton and Klein, on making a statement; Seaton against an outright concession, on calls from Worthy and Rainville; Klein reporting the press for one; Dreiske''s call: it "just wasn''t in the cards" to take Illinois; not Morton or Dirksen). See [[cal.1960-11-09.elections-1960]]. Names: Nixon, Finch, Thruston Morton, Dirksen.'
- edit:
    id: cal.1960-11-09.elections-1960
    base: '34778790'
    kind: reword
    set:
      c: 'Los Angeles, the Ambassador Hotel, about 3:20 a.m. Eastern. Nixon on television: if the trend continues, Kennedy will win;{1} no concession.{2} He had heard Hall, Folger, Finch, Seaton and Klein;{3} Thruston Morton and Dirksen against any statement.{4}'
      n: '[[w.kallina-kennedy-v-nixon]], 179–80; [[w.nixon-rn]], 223 (the statement at the Ambassador; its words); [[w.white-making-of-the-president]], 24 (Nixon''s appearance "shortly after three"). [[w.nixon-six-crises]], 384–90 (Hall, Folger, Finch, Seaton and Klein heard; the statement at 12:20 Pacific time, about 3:20 Eastern; its words). To check: The Reminiscences of Robert Finch, June 19, 1967, Columbia University Oral History Collection; The Reminiscences of J. Clifford Folger, Jan. 25, 1968, Columbia University Oral History Collection (cited by [[w.kallina-kennedy-v-nixon]], 180 n.9). See [[cal.1960-11-08.elections-1960]]. Names: Nixon, Kennedy, Finch, Seaton, Klein, Thruston Morton, Dirksen. Check: in *Six Crises*, 385, Seaton is against an outright concession, on calls from James Worthy in Illinois and Dirksen''s assistant, Harold Rainville; Morton is not named.'
- edit:
    id: cal.1960-11-09.republican-party
    base: a77e2c99
    kind: reword
    set:
      c: 'Thruston Morton, the Republican national chairman, the day after the election: the party took the Negro vote too much for granted.'
      n: '[[w.branch-parting-the-waters]], 375. To check: The Crisis, Jan. 1961, 7 ("Why Nixon Lost the Negro Vote"; the note''s "Ibid., p. 7") (cited by [[w.branch-parting-the-waters]], 375 n.1). Names: Thruston Morton.'
- edit:
    id: cal.1960-11-09.elections-1960-12
    base: 9a0ecdf2
    kind: reword
    set:
      c: 'Los Angeles to Andrews, Md., in a chartered Pan American 707, after two hours'' delay.{1} On the plane the reporters'' note: "we have toured the land with a champ."{2} At Andrews, late, in the rain: Thruston Morton, John Eisenhower for the President, Herter with the Cabinet members in Washington, several hundred supporters.{3} Nixon, unprepared: "it is in defeat rather than victory that real friendship and loyal support is put to the test."{4}'
      n: '[[w.nixon-six-crises]], 399–401 (the note and the remarks as the papers reported them, quoted). After the concession: [[w.nixon-six-crises]], 397–401. To check: the reporters'' note, signed "Your Camp Followers" (cited by [[w.nixon-six-crises]], 400); the next morning''s papers (cited by [[w.nixon-six-crises]], 401). See [[cal.1960-11-09.elections-1960]]. Names: Nixon, Thruston Morton, John Eisenhower, Herter.'
- edit:
    id: cal.1960-11-10.elections-1960
    base: e6ef9682
    kind: reword
    set:
      c: 'Thruston Morton, the Republican chairman, meets on the charges of fraud coming in and wires the party''s leaders in eleven States to judge whether recounts are practical. Their answers mostly discouraging. Hall, Nixon''s campaign chairman: too late to do anything.'
      n: '[[w.kallina-kennedy-v-nixon]], 184. To check: [[w.kallina-courthouse-over-white-house]], 96–144. Names: Thruston Morton, Nixon.'
- edit:
    id: cal.1960-11-11.republican-party
    base: fe8b66ac
    kind: reword
    set:
      c: 'Hinman to Rockefeller: Thruston Morton to stay on as national chairman for a time, at Nixon''s and Eisenhower''s request, while the party takes stock. "It gives us time to make our constructive purposes in regard to the party clear."'
      n: '[[w.gifford-center-cannot-hold]], 54. To check: Hinman to Rockefeller, Nov. 11, 1960, Rockefeller Papers, RG 4, Series J.1, Subseries 4, Box 92, Folder 635, Rockefeller Archive Center (cited by [[w.gifford-center-cannot-hold]], 54 n.93). Names: Hinman, Rockefeller, Thruston Morton, Nixon, Eisenhower. Check: the day of Morton''s decision; Hinman reports it.'
- edit:
    id: cal.1960-12-28.elections-1960-2
    base: ad149523
    kind: reword
    set:
      c: 'Eisenhower meets Nixon, Thruston Morton, Persons and others. Eisenhower: "we have made civil rights a main part of our effort these past eight years but have lost Negro support instead of increasing it."'
      n: '[[w.kallina-kennedy-v-nixon]], 151–52. To check: Bryce Harlow, memorandum for the record of a meeting among Eisenhower, Nixon, Thruston Morton, General Persons and others, Dec. 28, 1960, Eisenhower Library; Claude Robinson to Nixon, Hall, Finch, Oct. 21, 1960, "Campaign Evaluation as of October 14, 1960," p. 12, Nixon Library (cited by [[w.kallina-kennedy-v-nixon]], 152 n.45). Names: Eisenhower, Nixon, Thruston Morton, Persons. Check: the day, from Kallina''s note (246 n.45); his text has the remark "after the election."'
- edit:
    id: cal.1960-12.elections-1960
    base: 73451a2a
    kind: reword
    set:
      c: 'Early December. Thruston Morton in Chicago: at a press conference he charges Democratic fraud and announces a National Recount and Fair Elections Committee.{1}'
      n: '[[w.kallina-kennedy-v-nixon]], 184; [[w.cohen-american-pharaoh]], 268. To check: [[w.kallina-courthouse-over-white-house]], 96–144. See [[cal.1960-11-10.elections-1960]]. Names: Thruston Morton. Check: the day.'
- edit:
    id: cal.1960-12.goldwater-2
    base: 7a5e783d
    kind: reword
    set:
      c: Washington, the Jefferson Hotel. Goldwater with Shadegg, his campaign manager, and five other Republicans, Roger Milliken of South Carolina's national committee among them, on reviving the party. Shadegg would start on the nomination of 1964; Goldwater cuts the talk short. For national chairman when Thruston Morton leaves, Goldwater for Bliss, the Ohio chairman.
      n: '[[w.white-suite-3505]], 25–26. Names: Goldwater, Shadegg, Thruston Morton, Bliss. Check: the date; White has it "several weeks after" the election.'
- edit:
    id: cal.1961-01-03.republican-party-congress
    base: 056e12bb
    kind: reword
    set:
      c: 'Senate Republican conference organizes the 87th Congress, thirty-three present: Saltonstall chairman, Young secretary, Bridges Policy Committee chairman, Dirksen floor leader, Kuchel whip, each by unanimous ballot; Boggs and Miller introduced. Thruston Morton: research on the Cabinet nominees, the Policy Committee the focal point. Dirksen: no course of blind opposition, but modify where necessary.'
      n: '[[w.wolff-minutes-of-the-senate]], 867–71 (the elections, 868–69; Morton, 870; Dirksen, 871). The hour: the conference "called to order at 10:12 a.m." ([[w.wolff-minutes-of-the-senate]], 867). See [[cal.1961-01.republican-party-congress]]. Names: Saltonstall, Young, Bridges, Dirksen, Kuchel, Boggs, Miller, Thruston Morton.'
- edit:
    id: cal.1961-01-06.republican-party
    base: 8d6aca6a
    kind: reword
    set:
      c: 'Washington. The Republican National Committee in closed session, its first since the election.{1} Goldwater, asked by Thruston Morton to keep from controversy, against Keating''s proposed national policy board: "We do not need a fancy advisory group such as the Democrats have."{2} The Committee to be supreme in future campaigns, to heavy applause.{3} Morton names Bliss, Ohio''s chairman, to head a committee on the big-city vote: "tell us what steps have to be taken everywhere to erode the monolithic Democratic big city vote."{4} That night Nixon''s party for the Committee at the Columbia Country Club, Chevy Chase, Md.: three or four at a time stop to talk with him.{5}'
      n: '[[w.novak-agony-of-the-g]], 38–39 & n.2 (the Keating proposal pigeonholed despite Morton''s support); [[w.novak-agony-of-the-g]], 49 (the date; the applause; the party); [[w.novak-agony-of-the-g]], 54 (Bliss''s committee, at "its first postelection meeting at Washington in January, 1961"). Names: Goldwater, Thruston Morton, Keating, Bliss, Nixon. Check: Novak, 38, puts the address "the next day" after the conference''s reconvening.'
- edit:
    id: cal.1961-01.goldwater-2
    base: 1d026c5d
    kind: reword
    set:
      c: 'Early 1961. Rockefeller and Goldwater, Thruston Morton the go-between, the national chairman: their first meeting goes well; thereafter breakfast once a month, more than two years.{1} Goldwater: "Rocky''s really not such a bad fellow. He''s more conservative than you would imagine."{2}'
      n: '[[w.goldberg-barry-goldwater]], 161; [[w.smith-on-his-own-terms]], 357 (breakfasts at Foxhall Road; "he''s really not such a bad fellow. He''s more conservative than you would imagine"). Check: the month. Names: Rockefeller, Goldwater, Thruston Morton.'
- edit:
    id: cal.1961-01.republican-party-2
    base: 06a99c8e
    kind: reword
    set:
      c: Shadegg, Arizona's Republican chairman and a writer of Goldwater's speeches, tries to have Bliss replace Thruston Morton at once as national chairman.
      n: '[[w.novak-agony-of-the-g]], 55 n.1. See [[cal.1961-01-06.republican-party]]. Names: Shadegg, Bliss, Thruston Morton. Check: the day.'
- edit:
    id: cal.1962-06-06.economy-2
    base: f3b9adbb
    kind: reword
    set:
      c: 'Thruston Morton in the Senate: with a tax cut promised for 1963, the administration should lay aside the tax bill before the Finance Committee.{1} Carlson agrees: "We need a reduction in Federal spending and at the same time a reduction in taxes."{2}'
      n: 'Morton, Carlson, [108 Cong. Rec. 9847](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt7/pdf/GPO-CRECB-1962-pt7-13-2.pdf#page=18) (1962) (June 6, 1962). [[w.sundquist-politics-and-policy]], 43 n.94 (Carlson). Names: Thruston Morton, Carlson.'
- edit:
    id: cal.1963-02-19.republican-party-congress-2
    base: c377839f
    kind: reword
    set:
      c: The Senate Republicans' Committee on Committees, Williams presiding for Carlson, 9:35 to 10:30 a.m. Allott objects that the assignments reached the press, and to the procedure. Cooper to Rules and Administration in Thruston Morton's place, Morton yielding; the assignments approved on Mundt's motion. On Javits's motion a subcommittee of three to study assignments and seniority.
      n: '[[w.wolff-minutes-of-the-senate]], 952–57 (the minutes and the worksheets). Names: Williams, Carlson, Allott, Cooper, Thruston Morton, Mundt, Javits. Check: the minutes head the meeting "Monday, February 19, 1963"; Feb. 19 was a Tuesday.'
- edit:
    id: cal.1963-11-22.succession-2
    base: 8c9d249c
    kind: reword
    set:
      c: 'The Executive Office Building, 7:40 p.m.{1} Johnson with the congressional leaders: McCormack, Boggs, Halleck, Albert, Mansfield, Dirksen, Humphrey, Smathers, Kuchel, Thruston Morton.{2} He asks their help.{3} Humphrey stays after to offer his, by Humphrey''s account.{4}'
      n: '[President''s Daily Diary, Nov. 22, 1963](https://catalog.archives.gov/id/192430), image 2 (LBJ Library; National Archives Catalog). [[w.humphrey-education-of-a-public-1976]], 260 (the meeting, about 7:30 p.m.; Humphrey after); [[w.mann-walls-of-jericho]], 380 (the leaders at the Executive Office Building; Humphrey stays after); [[w.kotz-judgment-days]], 5 (the Executive Office Building; his request for their support; not the hour or the names); [[w.bernstein-guns-or-butter]], 17–18 (the leaders asked for help; that evening Fulbright, Harriman, Ball and McNamara on foreign affairs, calls to Truman and Eisenhower, letters to Caroline and John Kennedy); [[w.valenti-very-human-president]], 5 (about 7:40 the leaders come to the vice-presidential suite in the Executive Office Building; Johnson "importuning them for their help and their counsel"; not the names); [[w.albert-little-giant-1990]], 281 (that night Albert, with a group of Johnson''s oldest House friends, with Johnson at the
        Executive Office Building and the White House, little said, an hour or so; not the hour, the others named or his request); [[w.purdum-idea-whose-time-has-2014]], 150–51 (the meeting with the leaders barely two hours after the landing; Humphrey stays, "needed me desperately"; not the list present). See [[cal.1963-11-22.succession]]. Names: Johnson, McCormack, Boggs, Halleck, Albert, Mansfield, Dirksen, Humphrey, Smathers, Kuchel, Thruston Morton. Check: Humphrey names Arends, and neither McCormack nor Morton (260).'
- edit:
    id: cal.1963-12-02.republican-party-2
    base: '62155375'
    kind: reword
    set:
      c: 'Lodge Topic A in Washington. Thruston Morton: "Until yesterday, I would have thought Lodge would have some trouble getting a seat at the convention, much less be nominated for President. But now, I just don''t know."'
      n: '[[w.novak-agony-of-the-g]], 260–61. See [[cal.1963-12-01.elections-1964]]. Names: Thruston Morton, Lodge.'
- edit:
    id: cal.1964-01-17.economy
    base: ee53d222
    kind: reword
    set:
      c: 'The Finance Committee strikes the House''s broadened capital gains and restores the old rates, 12 to 7: Anderson, Talmadge, Ribicoff, Dirksen, Thruston Morton and Carlson with the Treasury.'
      n: '[[w.bernstein-guns-or-butter]], 36–37. Names: Anderson, Talmadge, Ribicoff, Dirksen, Thruston Morton, Carlson.'
- tag:
    id: cal.1964-01-17.economy
    add:
    - name:morton-thruston-b
- edit:
    id: cal.1964-01-29.republican-party
    base: cab1f116
    kind: reword
    set:
