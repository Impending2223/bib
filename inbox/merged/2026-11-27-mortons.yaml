- edit:
    id: cal.1966-11-09.republican-party
    base: 264b54b7
    kind: reword
    set:
      c: '1:25 a.m. Bliss at his desk, watching the returns, to Thruston Morton: "I''d say we''re on our way, Thrus." Later, to reporters: the gains "exceeded my fondest expectations"; the party "a very live elephant now."'
      n: '[[w.hess-republican-establishment]], 54. See [[cal.1966-11-08.elections-1966]]. Names: Bliss, Thruston Morton.'
- edit:
    id: cal.1967-01-31.soviet-union-consular
    base: 3d9c307d
    kind: reword
    set:
      c: 'Thruston Morton in the Senate, for the consular convention, after consulting Eisenhower, who first proposed it, and ahead of Dirksen''s opposition: his mail 100 to one against it, "the result of a carefully planned and well financed ''big lie'' operation designed by the paranoids and fear mongers."{1}'
      n: '[[w.kabaservice-rule-and-ruin]], 203. The Senate sat from noon to 4:56 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=1), [D28](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=26). To check: Thruston B. Morton, speech to the Senate, Jan. 31, 1967, Thruston B. Morton Papers, University of Kentucky, 1 (cited by [[w.kabaservice-rule-and-ruin]], 203 n.37); Rowland Evans and Robert Novak, "The Consular Fight," *International Herald Tribune*, Feb. 3, 1967, at 4 (cited by [[w.kabaservice-rule-and-ruin]], 203 n.36). See [[cal.1967-03-16.soviet-union]]. Names: Thruston Morton, Eisenhower, Dirksen.'
- edit:
    id: cal.1967-02.elections-1968
    base: 9f299563
    kind: reword
    set:
      c: 'Thruston Morton, sure Romney is stumbling, urges Scranton to run; Scranton: the moderates must not divide among candidates as in 1964.'
      n: '[[w.kabaservice-rule-and-ruin]], 210–11. Check the day; Evans and Novak report it Feb. 5. To check: Rowland Evans and Robert Novak, "Relaying an SOS: Morton to Scranton to Romney," *New York World Journal Tribune*, Feb. 5, 1967 (cited by [[w.kabaservice-rule-and-ruin]], 211 n.80). Names: Thruston Morton, Romney, Scranton.'
- edit:
    id: cal.1967-03-16.soviet-union
    base: 1973c544
    kind: reword
    set:
      c: 'The Senate consents to the Consular Convention with the Soviet Union, signed at Moscow June 1, 1964, [19 U.S.T. 5018](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-19-4/lltreaties-19-4.pdf#page=940), [655 U.N.T.S. 214](https://treaties.un.org/doc/Publication/UNTS/Volume%20655/volume-655-I-9383-English.pdf), [66–28](https://voteview.com/rollcall/RS0900050).{1} Reported by Foreign Relations, 15–4, Feb. 28.{2} Refused: an amendment ending criminal immunity for Soviet consular staff, Mar. 9, [26–53](https://voteview.com/rollcall/RS0900044);{3} reservations holding it back until the Soviets met conditions on freedom of the press, Mar. 14, [22–65](https://voteview.com/rollcall/RS0900045), or until the President advised Congress that the war in Vietnam was over or that Soviet aid to North Vietnam was not delaying the withdrawal of American troops, Mar. 15, [25–67](https://voteview.com/rollcall/RS0900046).{4} Johnson ratifies Mar. 31. In force July 13, 1968 (Check).{5}
        Republicans, 23–13, for: Thruston Morton organizes them, Dirksen comes round.{6}'
      n: 'Statement by the President Following Senate Approval of the Consular Convention With the U.S.S.R., [1967 Pub. Papers 356](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=424) (Mar. 16, 1967). FRUS 1964–68, XIV, doc. [207](https://history.state.gov/historicaldocuments/frus1964-68v14/d207). [[w.hess-republican-establishment]], 87–88, 235 (the Republicans, 23–13; Morton''s work for it; Percy); [[w.rusk-as-i-saw-it-1990]], 354–55. [[w.kabaservice-rule-and-ruin]], 203 (Morton''s lead, Eisenhower consulted; the Republicans 23 to 13). The Senate sat from noon to 5:19 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=1), [D108](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=106). See [[cal.1966-10-07.europe-and-the-alliance]]. Names: Johnson, Thruston Morton, Dirksen.'
- edit:
    id: cal.1967-04-16.opinion
    base: 7a9325c0
    kind: reword
    set:
      c: 'Gallup, special survey, Republican county chairmen, their preference for 1968: Nixon 1,227, Romney 341, Reagan 233, Percy 119, Rockefeller 67, Rhodes 34, Thruston Morton 24, Hatfield 17, Brooke 11, Lindsay 10. Of the two: Nixon 1,562, Romney 523; South, 663 and 53. Nixon''s 1,227, if he is not a candidate: Reagan 429, Romney 249, Percy 160, Rhodes 84, Morton 83.'
      n: '[[w.gallup-poll]], III, 2059. Names: Nixon, Romney, Reagan, Percy, Rockefeller, Rhodes, Thruston Morton, Hatfield, Brooke, Lindsay.'
- edit:
    id: cal.1967-04-27.vietnam-congress
    base: 78f69668
    kind: reword
    set:
      c: 'Fulbright in the Senate: the committee''s invitation to Westmoreland declined, his schedule too full.{1} Symington: if he has time for talks in Washington and New York, he should answer the Armed Services Committee.{2} Thruston Morton: is he here "to put a sort of a sack ... over discussion"?{3}'
      n: '[113 Cong. Rec. 11051](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt8/pdf/GPO-CRECB-1967-pt8-9-1.pdf#page=75) (Apr. 27, 1967). [113 Cong. Rec. 11,042](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt8/pdf/GPO-CRECB-1967-pt8-9-1.pdf#page=66) (1967); [11049–51](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt8/pdf/GPO-CRECB-1967-pt8-9-1.pdf#page=73) (Senate, Apr. 27, 1967). [[w.gibbons-u-s-government-and]], IV, 618–19; [[w.woods-fulbright]], 447 (his request to appear refused). See [[cal.1967-03-24.vietnam-congress]]. Names: Fulbright, Westmoreland, Symington, Thruston Morton.'
- edit:
    id: cal.1967-04.vietnam-congress
    base: 33bc879e
    kind: reword
    set:
      n: '[[w.westmoreland-soldier-reports]], 226. Check: the day and the words. See [[cal.1967-04-24.vietnam]]. Names: Thruston Morton, Westmoreland.'
- edit:
    id: cal.1967-05-09.vietnam-congress
    base: cb835c13
    kind: reword
    set:
      c: 'Senators against invading the North. Thruston Morton: "I do not know of any member of this body who wants an invasion of North Vietnam"; Cooper with him. Symington: more troops, more casualties, a clash with China; "The results of such action on our part, therefore, are incalculable."'
      n: '[113 Cong. Rec. 12,113](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-7-2.pdf#page=28) (1967) (Senate, May 9, 1967). [[w.gibbons-u-s-government-and]], IV, 617. Gibbons puts it "toward the end of May"; his page is in the Senate''s day of May 9. See [[cal.1967-04-27.vietnam-program-5]]. Names: Thruston Morton, Cooper, Symington.'
- edit:
    id: cal.1967-05-11.vietnam-congress
    base: be09b987
    kind: reword
    set:
      c: 'Thruston Morton in the Senate, on pacification put under Westmoreland: American troops in pacification "could very well become another step in the Americanization of the entire conflict"; the war "an almost unbroken series of promising programs followed by disappointing results followed by increased U.S. involvement."'
      n: '[113 Cong. Rec. 12,494](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-9-2.pdf#page=94) (1967) (Senate, May 11, 1967). [[w.gibbons-u-s-government-and]], IV, 684. The Senate sat from noon to 8:50 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=1), [D226](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=224). See [[cal.1967-05-09.vietnam]]. Names: Thruston Morton, Westmoreland.'
- edit:
    id: cal.1967-05-15.vietnam-congress
    base: 87b57b91
    kind: reword
    set:
      c: 'Cooper in the Senate: more force may shut off talks and bring in China and the Soviet Union, "the dread possibility" of a third world war. Confine the bombing to the southern panhandle; if Hanoi shows interest, stop it.{1} Milton Young finds "much merit";{2} Thruston Morton, McCarthy, Mansfield, Church, Aiken, Fulbright, Pell, Carlson and Morse with him.{3}'
      n: '[113 Cong. Rec. 12581–84](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-1-1.pdf#page=63) (May 15, 1967) (Morton, Mansfield, Church, 12581; McCarthy, Aiken, 12582; Fulbright, Morse, 12584). [113 Cong. Rec. 12,578–610](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-1-1.pdf#page=60) (1967) (Senate, May 15, 1967). [[w.gibbons-u-s-government-and]], IV, 683–85. [[w.mann-grand-delusion]], 543–44. The Senate sat from noon to 4:51 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=1), [D230](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=228). Check: Pell and Carlson are not found with Cooper on the Record''s pages, 12579–84. To check: [*New York Times*, May 16, 1967](https://timesmachine.nytimes.com/timesmachine/1967/05/16/issue.html) (cited by [[w.gibbons-u-s-government-and]], IV, 683 n.34). Names: Cooper, Young,
        Thruston Morton, McCarthy, Mansfield, Church, Aiken, Fulbright, Pell, Carlson, Morse. Check: Mann, 543, has Aiken, Milton Young and Morton with Cooper.'
- edit:
    id: cal.1967-05-23.vietnam-congress
    base: dd8e5065
    kind: reword
    set:
      c: 'Thruston Morton in the Senate, after the Harris Survey: what "total military victory" would mean, pacification by Americans, half a million to two million men, the North invaded, China.{1} "An unhealthy and unproductive war fever is mounting"; "there is going to be hell to pay if we settle for anything less."{2}'
      n: '[113 Cong. Rec. 13,534–35](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-7-1.pdf#page=77) (1967) (Senate, May 23, 1967). [[w.gibbons-u-s-government-and]], IV, 686–87. After 2 p.m.: the hour of 2 o''clock announced and the unfinished business laid before the Senate, [13,533](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-7-1.pdf#page=76); the Senate adjourned at 5:21 p.m., [Daily Digest, D249](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=247). Order: after [[cal.1967-05-23.vietnam-congress-2|Pell''s speech]] (13,498–502), before the hour of 2 o''clock. See [[cal.1967-05-17.opinion-2]]. Names: Thruston Morton.'
- edit:
    id: cal.1967-07-20.electoral-college
    base: 76d1ceb4
    kind: reword
    set:
      c: 'Election hearings: Thruston Morton.'
      n: '*Election of the President* hearings, [613](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=623). See [[cal.1967-07-12.electoral-college]]. Names: Thruston Morton.'
- edit:
    id: cal.1967-09-26.vietnam
    base: 3cf9e59c
    kind: reword
    set:
      c: 'Senate.{1} Case, citing McNamara''s testimony that bombing the North''s ports would not stop its supplies: the administration''s statements on the war have brought a "crisis of confidence"; the President''s "perversion of the Tonkin Gulf resolution."{2} Mansfield and Dirksen answer him.{3} Thruston Morton, about the same days: the President misled by the generals and the military-industrial complex; stop the bombing (Johnson''s account to Dirksen, Oct. 4; Check Morton''s words and the date).{4}'
      n: '[113 Cong. Rec. 26,699 ff.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-4-1.pdf#page=6) (Senate, Sept. 26, 1967). FRUS 1964–68, V, docs. [336](https://history.state.gov/historicaldocuments/frus1964-68v05/d336), [344](https://history.state.gov/historicaldocuments/frus1964-68v05/d344). [[w.gibbons-u-s-government-and]], IV, 824–27 (Case; Mansfield and Dirksen; not Morton); [[w.johns-vietnams-second-front]], 150 (Case''s words; Dirksen''s answer); [[w.califano-triumph-and-tragedy-of]], 248 (Case; Dirksen and Mansfield). The Senate sat from noon to 6:06 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=1), [D489](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=487). Check: Johns, 150, places Case''s speech in the spring of 1967, before the Policy Committee''s paper of May 1. Names: Case, McNamara, Mansfield, Dirksen, Thruston Morton, Johnson.'
- edit:
    id: cal.1967-09-27.vietnam-congress
    base: ad3f3464
    kind: reword
    set:
      c: 'Thruston Morton to the Business Executives for Peace in Vietnam: "If the President has been mistaken, so have I"; "I was wrong!"{1} Stop the bombing and search and destroy; hold the coast and the cities;{2} an all-Asian conference.{3} Katzenbach has talking points against it drafted for Dirksen.{4}'
      n: 'Morton''s address, printed Sept. 28: [113 Cong. Rec. 27,131](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-6-1.pdf#page=31) (1967). [[w.gibbons-u-s-government-and]], IV, 827–28. To check: Katzenbach to Johnson, "Congressional Criticism and Action, September 27, 1967," State, Lot File 70 D 207 (cited by [[w.gibbons-u-s-government-and]], IV, 828 n.87). Names: Thruston Morton, Katzenbach, Dirksen.'
- edit:
    id: cal.1967-10-02.vietnam-congress
    base: c991cbd7
    kind: reword
    set:
      c: 'Cooper in the Senate: stop the bombing without condition, keep it stopped, the war confined to the South. Mansfield, Fulbright, Pell, Thruston Morton, Javits and Percy with him; Kuchel, Miller, Thurmond, Murphy, Dominick and McGee against.{1} Percy: the President''s seven failures;{2} McGee: "The Vietnam question ... is incidental."{3}'
      n: '[113 Cong. Rec. 27,441–71](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-8-1.pdf#page=45) (1967) (Senate, Oct. 2, 1967). [[w.gibbons-u-s-government-and]], IV, 829–30. Names: Cooper, Mansfield, Fulbright, Pell, Thruston Morton, Javits, Percy, Kuchel, Thurmond, McGee, Miller, Murphy.'
