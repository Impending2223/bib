      c: 'Republican governors and governors-elect at Denver.{1} Smylie, chairman of their association, opens: "We are a defeated party with a defeated leadership."{2} A statement on the party''s leadership, for "a policy of inclusion";{3} Rockefeller, Romney and Scranton say Burch should be replaced;{4} Smylie presses hardest for a declaration.{5} Thruston Morton and Bob Wilson, the campaign committees'' chairmen, counsel against removing Burch; Nixon, by telephone to governors there, the same.{6} Check.{7} Percy: repudiate those who "waved our party banner in 1964 only as a means to promote hate and bigotry."{8} Gavin of North Carolina: "never again" the Southern strategy.{9}'
