      c: 'Arlington, Va., the Twin Bridges Marriott, the national committee''s last meeting before the convention. Hatfield keynoter and temporary chairman, Thruston Morton permanent chairman; Rockefeller''s men get the chief doorkeeper and the sergeant-at-arms''s assistant.{2} Babcock of Montana, a Goldwater man, had run against Hatfield for keynoter and lost.{5} They are Art Richardson, of the New York Young Republicans, and Sandy Lankler.{4} Miller to White: he has told Goldwater he cannot write a keynote. Goldwater to White, next morning: "Oh, don''t worry about it." By White''s account.{3} Tower, wandering by mistake into a Scranton hospitality suite next to Goldwater''s: "Oh, this isn''t such a bad place to be."{6}'
      n: '[[w.white-suite-3505]], 344–46; [[w.novak-agony-of-the-g]], 403–7 & nn.12–13 (Miller, Sunday night, bows out as keynoter; Hatfield temporary chairman and keynoter, Babcock beaten; Art Richardson and Lankler given convention posts; Tower in the Scranton suite: "this isn''t such a bad place to be"); [[w.novak-agony-of-the-g]], 407; [[w.novak-agony-of-the-g]], 407 n.13; [[w.novak-agony-of-the-g]], 406. Names: Hatfield, Thruston Morton, Rockefeller, Miller, White, Goldwater, Babcock, Tower.'
- edit:
