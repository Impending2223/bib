    set:
      c: 'The Rockefeller for President Committee organized: J. Irwin Miller, of the Cummins Engine Company, chairman; Thruston Morton and Bertha Adkins cochairmen. On its organizing committee four other former Republican national chairmen, Alcorn, Hugh Scott, Leonard Hall and William Miller; Chafee, Brooke, Dellenback, Findley and Goodell among its members.'
      n: '[[w.cq-weekly-report]], June 21, 1968, 1534. Check: the day. See [[cal.1968-04-07.elections-1968]]. Names: J. Irwin Miller, Thruston Morton, Adkins, Alcorn, Scott, Hall, William Miller, Chafee, Brooke, Dellenback, Findley, Goodell.'
- edit:
    id: cal.1968-08-02.elections-1968-miami-4
    base: 4d315cb1
    kind: reword
    set:
      c: 'Rogers Morton, Nixon''s floor manager: a win on the first ballot, but "prepared...to win on any ballot." Poff his parliamentarian. On the floor besides: MacGregor, Devine, Glenn Davis, Brock, Rumsfeld, Nelsen; Fong; Nunn and Hickel; Callaway; Emil Lockwood of Michigan''s Senate; Stewart Lamprey, president of New Hampshire''s; Linwood Holton.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2103. Names: Rogers Morton, Nixon, Poff, MacGregor, Devine, Davis, Brock, Rumsfeld, Nelsen, Fong, Nunn, Hickel, Callaway, Holton.'
- edit:
    id: cal.1968-08-07.elections-1968
    base: d1e70f87
    kind: reword
    set:
      c: 'Miami Beach.{1} Thurmond and the Southern delegations hold for Nixon (Check).{2} Nixon nominated on the first ballot, early Aug. 8: 692 votes, 667 needed;{3} Rockefeller 277, Reagan 182, Rhodes 55, Romney 50.{10} As it starts, Rogers Morton''s hard count for Nixon reads 666, one short of a majority, and Reagan, in his trailer outside the hall, is pressing Mississippi''s delegates.{13} The balloting begins at 1:19 a.m., Thursday, Aug. 8.{12} After the roll, the delegations change: Nixon 1,238, Rockefeller 93, Reagan 2.{11} New York''s and Kentucky''s motions to make it unanimous not recognized. The rules suspended by voice vote, on California''s motion, for Reagan to speak;{5} he moves that the convention "declare itself as unanimously and united behind the candidate Richard Nixon."{6} The chair thanks him.{7} No vote put.{8} In the roll, Bergen County''s delegates break from New Jersey''s favorite son, Case, for Nixon: by Auspitz''s account, of the Ripon members in Rockefeller''s
        delegate count, the turn.{9}'
      n: '[*Official Report of the Proceedings of the Twenty-Ninth Republican National Convention*](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968) (1968), the fourth session, Aug. 7, the roll call [368–379](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/368/mode/1up), the changes and the final tabulation [379–389](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/379/mode/1up), the motions [381–389](https://archive.org/details/sim_republican-national-convention-proceedings_august-5-8-1968/page/381/mode/1up) (Rule 17, the chair to put "Shall the nomination of the candidate be made unanimous?", read, 381; New York, 382, and the table''s note, "not recognized under the rules of the Convention," 389; Kentucky, "not recognized for that purpose," 383; California''s motion, seconded by Maine and Virginia, put as "to suspend the rules ... for the Convention
        to cast a unanimous vote for Richard M. Nixon," the ayes having it, "under the motion, the Governor of California will be recognized," 386–87; Reagan''s motion and the chair''s thanks, 387; the table''s note, "Governor Reagan moved that the nomination of Richard M. Nixon be made unanimous," no outcome given, 389). [[w.nixon-rn]], 309–11 (Thurmond and Tower holding the South; the first ballot, 692, 25 more than needed; Reagan''s motion); [[w.cq-weekly-report]], Aug. 9, 1968, 2096, 2098, 2141 (the first ballot and the changes; no vote on Reagan''s motion, 2096). CQ agrees: Reagan''s motion "never put to a vote" (2096); New York''s and Kentucky''s motions ruled out of order (2141). [[w.chester-american-melodrama]], 458, 465–75 (the South held for Nixon, Thurmond and Dent at work on Alabama, Mississippi and Florida); [[w.kabaservice-rule-and-ruin]], 242–43 (the Southern delegations; Bergen County); [[w.white-making-of-the-president-1969]], 246–47 (1:19 a.m., Aug. 8: Nixon 692, Rockefeller
        277, Reagan 182; Morton''s hard count 666; Reagan with Mississippi''s delegates in his trailer); [[w.bernstein-guns-or-butter]], 507–08 (Thurmond won over; Nixon 692, Rockefeller 277, Reagan 182); [[w.smith-on-his-own-terms]], 537 (Thurmond, with Tower, in the restive delegations, Florida above all under its unit rule; Callaway: "Strom would take delegates on board one of those delightful boats docked off Miami ... He''d make his pitch one-on-one"); [[w.goldberg-barry-goldwater]], 252 (Nixon personally calls on Goldwater, Tower and Thurmond to calm the conservatives; Reagan held to scattered gains among the Southern delegations); [[w.white-making-of-the-president-1969]], 246; [[w.white-making-of-the-president-1969]], 247. Order: the ballot after the nominations of the fourth session and Rockefeller''s last press conference. To check: [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.nelson-resilient-america]]. See [[cal.1968-08-05.elections-1968]].
        Names: Thurmond, Nixon, Rockefeller, Reagan, Rhodes, Romney, Case, Rogers Morton.'
