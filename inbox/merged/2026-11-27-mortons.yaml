    set:
      c: 'Hickenlooper, claiming seventeen to twenty Republicans, makes his terms: votes on Thruston Morton''s jury trial amendment, Cotton''s limit on Title VII and his own on training school personnel.{1} Humphrey agrees, on promises that Mundt, Cotton and Hruska will vote for cloture.{2}'
      n: '[[w.mann-walls-of-jericho]], 423–24; [[w.kotz-judgment-days]], 150 (June 5, the demands; the vote to June 10); [[w.whalen-longest-debate]], 191–92 (the rump meeting of twenty conservatives that morning; agreed June 6); [[w.bernstein-guns-or-butter]], 73 (the vote moved to June 10; three amendments to a vote June 9; Hruska, Curtis, Mundt and Cotton for cloture); [[w.risen-bill-of-the-century]], 223–25 (Hickenlooper''s rebellion, as many as twenty senators; Dirksen ill at his farm; his amendments, the Morton jury trial, Cotton''s limit of Title VII to employers of a hundred, his own to strike school desegregation aid; Mansfield''s offer Saturday, June 6, and that evening Humphrey''s commitments from Mundt, Hruska and Cotton, the unanimous consent agreement "brought us the extra votes that we needed," by Humphrey''s memorandum); [[w.purdum-idea-whose-time-has-2014]], 296–97 (Friday, June 5: Dirksen back at his office finds a revolt, Hickenlooper leading, Cotton and Hruska wanting
        amendments of their own; Hickenlooper asks unanimous consent to vote Tuesday on Morton''s jury trial amendment, Cotton''s (Title VII only for firms of a hundred or more, not twenty-five) and his own to delete the school desegregation aid provisions; Douglas: a "Pandora''s box"; Russell defers to Saturday; overnight Humphrey gets Mundt, Hruska and Cotton to promise cloture; Saturday morning, no objection, four hours for each amendment). Check: Kotz has the commitments from Hickenlooper, Cotton, Hruska and Curtis (150). Check: Bernstein, 73, names Curtis with Hruska, Mundt and Cotton, and gives no day for the agreement. Check: Risen, 224, has Humphrey win the commitments of Mundt, Hruska and Cotton the evening of Saturday, June 6, after Mansfield''s offer that day. Check: Purdum, 296, has Hickenlooper''s own amendment strike all provisions for aid to the desegregation of public schools, not the training of school personnel. To check: Humphrey, memorandum to the file, 1964, HHH Vice
        Presidential Papers, Civil and Human Rights, Box 821, Minnesota Historical Society (cited by [[w.mann-walls-of-jericho]], 423). The votes: [[cal.1964-06-10.civil-rights-bill]]. See [[cal.1964-05-26.civil-rights-bill]]. Names: Hickenlooper, Thruston Morton, Cotton, Humphrey, Mundt, Hruska.'
- edit:
