      n: '[[w.cq-weekly-report]], Aug. 16, 1968, 2187 To check: CQ''s report at the time, Weekly Report p. 670 (cited by [[w.cq-weekly-report]], Aug. 16, 1968, 2187). Names: Thruston Morton, Nixon.'
