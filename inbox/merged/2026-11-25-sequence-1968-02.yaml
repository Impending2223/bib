- edit:
    id: cal.1968-02-08.europe-and-the-alliance-2
    base: 0ef1b41b
    set:
      n: '[[w.johnson-white-house-diary]], 630–32 (Lady Bird Johnson''s account; the toasts in her quotation and paraphrase, not the texts). Merrill''s songs, "On the Road to Mandalay" and the Gershwin, had been called by the press an insult to the British Empire; Wilson sent word they were his favorites (629). After [[cal.1968-02-08.europe-and-the-alliance|the talks]]: the conference set for 11:30 to one, then lunch on the second floor, "talking and working until past 3:30"; the dinner that night ([[w.johnson-white-house-diary]], 629–30). To check: the Public Papers, the toasts, Feb. 8, 1968. See [[cal.1968-02-08.europe-and-the-alliance]]. Names: Wilson, Lady Bird Johnson, Fulbright, Johnson.'
- check:
    id: cal.1968-02-17.china-leadership
    text: 'Check: the day: receiving the Vietnamese at 1:40 p.m. Feb. 17, Zhou says he told Wei Guoqing "yesterday" (昨天) to hold a meeting on Guangxi''s railways and report today ([[w.zhou-enlai-nianpu-1949-2020]], III, 216).'
