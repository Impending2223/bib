    text: 'Check: the day of the editorial: Yang (I, 474) dates the founding Feb. 5 and gives no day for the editorial.'
- check:
    id: cal.1968-02-07.china-leadership-2
    text: 'Check: "after the meeting with Mao": the Zhou nianpu (III, 213) has Zhou go with Mao to meet Hồ Chí Minh and, "the same day" (同日), make his proposal in talking with Hồ; the Wilson Center text (doc. 30) gives no hour. The talk may be part of the same meeting.'
