patch: johnson-plan
by: Claude (agent), from FRUS 1961–63, XVII and XVIII, and the UN documents
ops:
  - add:
      section: III.E
      after: kja.who.hoyt-michael-p-e
      entry:
        id: kja.who.johnson-joseph-e
        s: Johnson, Joseph E.
        r: President of the Carnegie Endowment for International Peace from 1950; Special Representative of the UN Palestine Conciliation Commission, Aug. 1961–Jan. 1963 (the Johnson Plan)
  - add:
      entry:
        id: cal.1961-08-21.middle-east-johnson-plan
        when: Aug. 21
        date: '1961-08-21'
        thread: middle-east-johnson-plan
        c: 'The UN Palestine Conciliation Commission (France, Turkey, the United States) names Joseph E. Johnson, president of the Carnegie Endowment for International Peace, its Special Representative: to explore with the Arab host governments and Israel practical means of progress on the Palestine Arab refugees, under paragraph 11 of Resolution 194 (III), repatriation or compensation. State''s candidate; he accepts, Aug. 17, at Rusk''s request. The UN announces it, Aug. 24.'
        n: '[A/4921](https://documents.un.org/doc/UNDOC/GEN/NL6/107/71/PDF/NL610771.PDF#page=2), para. 4 (the PCC''s nineteenth progress report, Oct. 15, 1961). FRUS 1961–63, XVII, doc. [96](https://history.state.gov/historicaldocuments/frus1961-63v17/d96) (editorial note). [[w.gazit-president-kennedys-policy-toward]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-decade-of-transition]]; [[w.bass-support-any-friend]]. See [[cal.1961-05-11.middle-east]]. Names: Johnson, Rusk.'
        tags: [name:johnson-joseph-e, name:rusk-dean]
  - add:
      entry:
        id: cal.1961-09-26.middle-east-johnson-plan
        when: Sept. 26
        date: '1961-09-26'
        thread: middle-east-johnson-plan
        c: 'New York. Joseph Johnson, back from Beirut, Amman, Cairo and Israel, Sept. 1–17, reports orally to the PCC; and to Rusk, at the mission to the UN.'
        n: 'FRUS 1961–63, XVII, doc. [112](https://history.state.gov/historicaldocuments/frus1961-63v17/d112), nn. 1–2. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Rusk.'
        tags: [name:johnson-joseph-e, name:rusk-dean]
  - add:
      entry:
        id: cal.1961-09-29.middle-east-johnson-plan
        when: Sept. 29
        date: '1961-09-29'
        thread: middle-east-johnson-plan
        c: 'Joseph Johnson to Cleveland and Talbot. The Arabs insist on repatriation first; Israel on a change in Arab attitudes. Ben Gurion the "roughest" talk. A hard core of refugees for at least fifteen years; UNRWA or its like needed. His "hunch": Israel might take up to 10,000 a year for two or three years if the Arabs moved too. The refugees to be given a meaningful choice.'
        n: 'FRUS 1961–63, XVII, doc. [112](https://history.state.gov/historicaldocuments/frus1961-63v17/d112). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Cleveland, Talbot, Ben Gurion.'
        tags: [name:johnson-joseph-e, name:cleveland-j-harlan, name:talbot-phillips, name:ben-gurion-david]
  - add:
      entry:
        id: cal.1961-11-22.middle-east-johnson-plan
        when: Nov. 22
        date: '1961-11-22'
        thread: middle-east-johnson-plan
        c: 'Joseph Johnson''s report, an addendum to the PCC''s nineteenth: no early settlement of the Palestine question; both sides willing, with reservation and skepticism, to consider a step-by-step process on the refugees; worth trying. The Arab delegations had objected to his historical section, Nov. 20–21; he cut it, and kept it cut against Israel''s protests. The PCC endorses his conclusions, not the history.'
        n: '[A/4921/Add.1](https://documents.un.org/doc/UNDOC/GEN/NL6/107/72/PDF/NL610772.PDF#page=17), paras. 49, 52–55. FRUS 1961–63, XVII, doc. [140](https://history.state.gov/historicaldocuments/frus1961-63v17/d140) (editorial note; the PCC''s transmittal, Nov. 24). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
        tags: [name:johnson-joseph-e]
  - add:
      entry:
        id: cal.1961-12-20.middle-east-johnson-plan
        when: Dec. 20
        date: '1961-12-20'
        thread: middle-east-johnson-plan
        c: 'General Assembly Resolution 1725 (XVI), the United States'' draft: the PCC to intensify its efforts under paragraph 11 of Resolution 194 (III); the Arab host governments and Israel urged to cooperate; the refugees'' property in Palestine to be identified and valued by Sept. 1, 1962. Amendments of Afghanistan, Indonesia and Pakistan, to enlarge the PCC to five and have it protect the refugees'' property, fail of two-thirds; the United States votes against them.'
        n: '[A/RES/1725 (XVI)](https://documents.un.org/doc/RESOLUTION/GEN/NR0/167/78/PDF/NR016778.PDF) (1086th plenary meeting). FRUS 1961–63, XVII, doc. [153](https://history.state.gov/historicaldocuments/frus1961-63v17/d153), n. 2. See [[cal.1961-08-21.middle-east-johnson-plan]].'
  - add:
      entry:
        id: cal.1962-01-18.middle-east-johnson-plan
        when: Jan. 18
        date: '1962-01-18'
        thread: middle-east-johnson-plan
        c: 'The PCC reappoints Joseph Johnson its Special Representative, to open talks with Israel and the host governments at the highest and the technical levels. U Thant cables them, Jan. 24.'
        n: 'FRUS 1961–63, XVII, doc. [166](https://history.state.gov/historicaldocuments/frus1961-63v17/d166), n. 3. The PCC''s report gives Mar. 2 ([A/5337](https://documents.un.org/doc/UNDOC/GEN/NL6/212/01/PDF/NL621201.PDF#page=4), para. 12). Check. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, U Thant.'
        tags: [name:johnson-joseph-e, name:u-thant]
  - add:
      entry:
        id: cal.1962-04-15.middle-east-johnson-plan
        when: Apr. 15–17
        date: '1962-04-15'
        thread: middle-east-johnson-plan
        c: 'Jerusalem. Joseph Johnson''s second round in the Middle East, Apr. 14–May 12. With Meir, Apr. 15 and 17: a poll of the refugees'' preferences; on what terms Israel would repatriate a share of perhaps 20,000 to begin. Meir: first a public assurance that the Arab governments will live in peace; as evidence, six months without propaganda against Israel.'
        n: 'FRUS 1961–63, XVII, doc. [253](https://history.state.gov/historicaldocuments/frus1961-63v17/d253). [A/5337](https://documents.un.org/doc/UNDOC/GEN/NL6/212/01/PDF/NL621201.PDF#page=4), para. 12. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Meir.'
        tags: [name:johnson-joseph-e, name:meir-golda]
  - add:
      entry:
        id: cal.1962-08-07.middle-east-johnson-plan
        when: Aug. 7
        date: '1962-08-07'
        thread: middle-east-johnson-plan
        c: 'The Johnson Plan, Joseph E. Johnson''s for the PCC, drafted with State from July 17; Rusk sends it to Kennedy. Each refugee to state in confidence a preference: repatriation to Israel as a law-abiding resident, or compensation and resettlement in the Arab countries or elsewhere. Governments to decide whom they admit. UN compensation only to those resettled; $250 a head to every refugee on taking either course. Expected: one repatriated for nine resettled. The first year up to $100 million: Israel $40 million, the United States $30 million, others $30 million; some $1.2 billion over five to ten years for 1,100,000 refugees.'
        n: 'FRUS 1961–63, XVIII, doc. [15](https://history.state.gov/historicaldocuments/frus1961-63v18/d15) (the plan and its explanation printed there). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Rusk, Kennedy.'
        tags: [name:johnson-joseph-e, name:rusk-dean, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1962-08-14.middle-east-johnson-plan
        when: Aug. 14
        date: '1962-08-14'
        thread: middle-east-johnson-plan
        c: 'White House, 4:45–5:35 p.m. Kennedy, Rusk, Feldman and Joseph Johnson on the Johnson Plan. Johnson: compensation for all, just over $1 billion; "free preference," not "free choice"; a trial run in fact. Kennedy: Israel cannot accept free choice of return; "We should start with the Israelis." The Hawk on the same agenda.'
        n: 'FRUS 1961–63, XVIII, doc. [19](https://history.state.gov/historicaldocuments/frus1961-63v18/d19) (notes of the conference). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Kennedy, Rusk, Feldman, Johnson.'
        tags: [name:kennedy-john-f, name:rusk-dean, name:feldman-myer, name:johnson-joseph-e]
  - edit:
      id: cal.1962-08-19.middle-east
      base: 8f00356c
      set:
        c: 'Feldman to Ben Gurion and Meir: the President has decided to make the Hawk available to Israel; Nasser to be told. Feldman asks Israel to let Joseph Johnson''s plan for the Palestine refugees go forward.'
  - edit:
      id: cal.1962-08-27.middle-east-johnson-plan
      base: c79e01f6
      set:
        c: 'Kennedy with Rusk, Barbour, Talbot, Bundy, Strong and Feldman on the Johnson Plan, 5–6:06 p.m. No record of it found. That night Rusk asks a PCC meeting for Aug. 31, to receive the plan; France and Turkey to be won over.'
        n: 'FRUS 1961–63, XVIII, doc. [32](https://history.state.gov/historicaldocuments/frus1961-63v18/d32) and n. 2. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Kennedy, Rusk, Barbour, Talbot, Bundy, Strong, Feldman.'
        tags: [name:kennedy-john-f, name:rusk-dean, name:barbour-walworth, name:talbot-phillips, name:bundy-mcgeorge, name:strong-robert-c, name:feldman-myer]
  - add:
      entry:
        id: cal.1962-08-31.middle-east-johnson-plan
        when: Aug. 31
        date: '1962-08-31'
        thread: middle-east-johnson-plan
        c: 'New York. Joseph Johnson presents his plan to the PCC. Final approval deferred, by arrangement; he is authorized to put it to the host governments and Israel, without publicity and without negotiating its details.'
        n: 'FRUS 1961–63, XVIII, doc. [34](https://history.state.gov/historicaldocuments/frus1961-63v18/d34). Made public: Milton Freudenheim, *Chicago Daily News* and *Washington Post*, Oct. 2, 1962 (FRUS 1961–63, XVIII, doc. [67](https://history.state.gov/historicaldocuments/frus1961-63v18/d67), n. 2). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
        tags: [name:johnson-joseph-e]
  - add:
      entry:
        id: cal.1962-09-10.middle-east-johnson-plan
        when: Sept. 10
        date: '1962-09-10'
        thread: middle-east-johnson-plan
        c: 'New York. Joseph Johnson gives the plan and its explanation to Israel''s delegates, Comay and Meron, in the morning; to Jordan''s, Syria''s, Lebanon''s and the UAR''s together in the afternoon. Reactions asked in fourteen days or so.'
        n: 'FRUS 1961–63, XVIII, doc. [36](https://history.state.gov/historicaldocuments/frus1961-63v18/d36). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Comay, Meron.'
        tags: [name:johnson-joseph-e, name:comay-michael-s, name:meron-gershon]
  - add:
      entry:
        id: cal.1962-09-13.middle-east-johnson-plan
        when: Sept. 13
        date: '1962-09-13'
        thread: middle-east-johnson-plan
        c: 'Kennedy to Hussein: Joseph Johnson''s plan "both fair and practical"; nearly half the refugees in Jordan, so Jordan''s attitude critical. Macomber to explain.'
        n: 'FRUS 1961–63, XVIII, doc. [39](https://history.state.gov/historicaldocuments/frus1961-63v18/d39). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Kennedy, Hussein ibn Talal, Macomber.'
        tags: [name:kennedy-john-f, name:hussein-ibn-talal, name:macomber-william-b-jr]
  - edit:
      id: cal.1962-09-16.middle-east
      base: 95ab8b3f
      set:
        c: 'Israel''s cabinet on Joseph Johnson''s plan: the worst of all the plans for the refugees, the most support to repatriation; free choice to the Arabs and the last word to Israel, contradictory. Eban to Barbour, Sept. 20.'
        n: 'FRUS 1961–63, XVIII, doc. [50](https://history.state.gov/historicaldocuments/frus1961-63v18/d50) (editorial note). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Eban, Barbour.'
        tags: [name:eban-abba-s, name:barbour-walworth]
  - add:
      entry:
        id: cal.1962-09-21.middle-east-johnson-plan
        when: Sept. 21
        date: '1962-09-21'
        thread: middle-east-johnson-plan
        c: 'New York. Meir to Joseph Johnson: the plan shocking, its whole basis unacceptable, not negotiable. In Washington, Harman to Talbot: Israel asks the United States to reject it and to stop the PCC circulating it. Feldman to Kennedy: disengage, the faster the better.'
        n: 'FRUS 1961–63, XVIII, doc. [50](https://history.state.gov/historicaldocuments/frus1961-63v18/d50) (editorial note). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Meir, Johnson, Harman, Talbot, Feldman, Kennedy.'
        tags: [name:meir-golda, name:johnson-joseph-e, name:harman-avraham, name:talbot-phillips, name:feldman-myer, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1962-09-26.middle-east-johnson-plan
        when: Sept. 26
        date: '1962-09-26'
        thread: middle-east-johnson-plan
        c: 'New York. Rusk and Meir on the plan. Meir: it slights Israel''s sovereignty; advisory bodies the refugees could appeal to; Israel will not recognize an administrator in Jerusalem. That morning Ball had told Rusk of Kennedy''s fallback: the plan on trial, 10,000–20,000 refugees, then a second look.'
        n: 'FRUS 1961–63, XVIII, doc. [57](https://history.state.gov/historicaldocuments/frus1961-63v18/d57) and n. 2. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Rusk, Meir, Ball, Kennedy.'
        tags: [name:rusk-dean, name:meir-golda, name:ball-george-w, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1962-10-02.middle-east-johnson-plan
        when: Oct. 2
        date: '1962-10-02'
        thread: middle-east-johnson-plan
        c: 'The plan in the press: Milton Freudenheim''s summary of its main elements, substantially accurate, in the *Chicago Daily News* and the *Washington Post*. The State Department''s spokesman comments.'
        n: 'FRUS 1961–63, XVIII, doc. [67](https://history.state.gov/historicaldocuments/frus1961-63v18/d67), n. 2 (circular telegram 574). See [[cal.1961-08-21.middle-east-johnson-plan]].'
  - edit:
      id: cal.1962-10-04.middle-east-johnson-plan
      base: 7f882368
      set:
        c: 'Syria''s Prime Minister, al-Azm, on Joseph Johnson''s plan: a "clear violation" of the General Assembly''s Resolution 194; a plan to settle the refugees outside their homeland.'
        n: 'FRUS 1961–63, XVIII, doc. [75](https://history.state.gov/historicaldocuments/frus1961-63v18/d75), n. 2 (Komer, Oct. 9; airgram A-115 from Damascus). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: al-Azm.'
        tags: [name:al-azm-khalid-pasha]
  - add:
      entry:
        id: cal.1962-12-05.middle-east-johnson-plan
        when: Dec. 5
        date: '1962-12-05'
        thread: middle-east-johnson-plan
        c: 'Rusk to Kennedy by telephone: Israel''s answer on the refugee proposals not adequate. Of three courses Kennedy chooses to go ahead on the American reading of the understanding with Israel. Talbot so tells Harman: Israel to consult before backing a direct-negotiations resolution; talks on a refugee settlement to resume without preconditions.'
        n: 'FRUS 1961–63, XVIII, doc. [110](https://history.state.gov/historicaldocuments/frus1961-63v18/d110) and n. 1. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Rusk, Kennedy, Talbot, Harman.'
        tags: [name:rusk-dean, name:kennedy-john-f, name:talbot-phillips, name:harman-avraham]
  - add:
      entry:
        id: cal.1962-12-07.middle-east-johnson-plan
        when: Dec. 7
        date: '1962-12-07'
        thread: middle-east-johnson-plan
        c: 'The PCC''s twentieth progress report: Joseph Johnson''s second round in a paragraph; his plan not named. The Commission "intends to carry forward its initiative." Dec. 6, State had told the mission to the UN to join France and Turkey in asking Johnson to defer his own report.'
        n: '[A/5337](https://documents.un.org/doc/UNDOC/GEN/NL6/212/01/PDF/NL621201.PDF#page=4), paras. 12–14; printed in [[w.current-documents-1962]], 757–760. FRUS 1961–63, XVIII, doc. [111](https://history.state.gov/historicaldocuments/frus1961-63v18/d111). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
        tags: [name:johnson-joseph-e]
  - add:
      entry:
        id: cal.1962-12-20.middle-east-johnson-plan
        when: Dec. 20
        date: '1962-12-20'
        thread: middle-east-johnson-plan
        c: 'General Assembly Resolution 1856 (XVII): thanks to the PCC for its efforts under paragraph 11 of Resolution 194 (III), and a request to continue them with the states concerned. UNRWA''s mandate extended to June 30, 1965.'
        n: '[A/RES/1856 (XVII)](https://documents.un.org/doc/RESOLUTION/GEN/NR0/193/64/PDF/NR019364.PDF) (1200th plenary meeting). See [[cal.1961-08-21.middle-east-johnson-plan]].'
  - add:
      entry:
        id: cal.1963-01-31.middle-east-johnson-plan
        when: Jan. 31
        date: '1963-01-31'
        thread: middle-east-johnson-plan
        c: 'Joseph Johnson resigns as the PCC''s Special Representative. His record and draft report left with the Commission, confidential; neither he nor it would release the report now.'
        n: 'FRUS 1961–63, XVIII, doc. [150](https://history.state.gov/historicaldocuments/frus1961-63v18/d150), n. 2 (telegram 2931 from the mission to the UN). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
        tags: [name:johnson-joseph-e]
  - add:
      entry:
        id: cal.1963-02-06.middle-east-johnson-plan
        when: Feb. 6
        date: '1963-02-06'
        thread: middle-east-johnson-plan
        c: 'Kennedy thanks Joseph Johnson, Feldman, Komer and Grant present. Johnson: the Johnson Plan dead, its principles valid. The refugees'' will expressed; some repatriation, fewer than one in ten to stay in Israel; acquiescence, not formal agreement; slow movement, both sides at once.'
        n: 'FRUS 1961–63, XVIII, doc. [150](https://history.state.gov/historicaldocuments/frus1961-63v18/d150). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Kennedy, Johnson, Feldman, Komer, Grant.'
        tags: [name:kennedy-john-f, name:johnson-joseph-e, name:feldman-myer, name:komer-robert-w, name:grant-james-p]
