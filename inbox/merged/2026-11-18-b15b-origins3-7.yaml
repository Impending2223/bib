      c: Wang Guangmei, at Peng Zhen's suggestion, reports on her Taoyuan experience to the Hebei provincial committee's work conference, before a very large meeting.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 404–5; [[w.macfarquhar-origins-of-the-cultural]], III, 400 (the report). Mao, by one informant''s account, voices disgust at the performance in a coarse peasant phrase (III, 405 n.36). Made public: 1967 (the report in full, [[w.shaoqi-yanlun-ji-a-collection]], 3, 471–570, a Red Guard print of Sept. 1967). To check: Wang Guangmei, report on the Taoyuan experience, July 5, 1964, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 472–3, 472–84 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 400 n.10a); [[w.shaoqi-yanlun-ji-a-collection]], 3, 471–570 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 400 n.10b); Informant T, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 405 n.36). See [[cal.1963-11.china-leadership-3]]. Names: Peng Zhen.'
