      c: Taoyuan. The brigade Party secretary Wu Chen is expelled from the Party; the militia chief, Guan Jingdong, replaces him.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 401–2. The team''s charges: embezzlement, capitalist dealings, thirty-one beatings, a false class background (a peddler, not a poor peasant); a landlord who had dodged classification behind him; the branch "a KMT-type organization" (III, 401–2 nn.16–17). Wang admits that Guan had embezzled money and grain and defends his choice by his gift for production (III, 402 n.19). Made public: 1986. To check: [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 481 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 402 n.18). See [[cal.1963-11.china-leadership-3]]. Check: whether [[w.zhonggong-dangshi-jiaoxue-cankao]] was printed for internal circulation (the book finds a document it prints not openly available in China, III, 400 n.10); if so, it is no Made public date.'
