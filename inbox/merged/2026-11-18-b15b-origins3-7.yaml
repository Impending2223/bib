- add:
    entry:
      id: cal.1963.china-leadership-10
      when: '1963'
      date: '1963'
      thread: china-leadership
      c: 'Shanghai. Zhang Chunqiao and Yao Wenyuan take up Ke Qingshi''s slogan: only contemporary themes make socialist art. Zhou Yang, Lin Mohan and Shao Quanlin oppose them.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 382. The central officials find Yao "oversimple" and "rude" (III, 382 n.7) and cite a directive of Zhou Enlai''s to write of the thirteen years and of the 108 years, whose source the book has not found (III, 382 n.8). To check: [[w.goldman-chinas-intellectuals]], 63 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 382 n.6a); [[w.yonglie-zhang-chunqiao-fuchen-shi]], 118–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 382 n.6b); [[w.yonglie-zhang-chunqiao-fuchen-shi]], 118–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 382 n.7). Names: Zhang Chunqiao, Yao Wenyuan, Ke Qingshi.'
      tags:
