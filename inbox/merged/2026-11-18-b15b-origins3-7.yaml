- add:
    entry:
      id: cal.1964-11-15.china-leadership-2
      when: Nov. 15
      date: '1964-11-15'
      thread: china-leadership
      c: 'Hubei. Wang Renzhong, first secretary, on the movement, citing "Comrade Shaoqi" often: the root lies higher up, even in the province; the masses against the "four unclean" cadres the chief contradiction; a "violent revolutionary storm"; brigade branches to collapse, power to go to the poor peasant associations.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 410–12. Last year''s work only scratched the surface; some workers turned exploiters, some Party members Kuomintang (III, 410). His example: the secretary of the Anquan brigade, Hong''an county, put in by the "enemy" in 1947 (III, 410–11). The peasants'' dual nature: activists, and selfish (III, 411). Made public: 1986. To check: Wang Renzhong, speech of Nov. 15, 1964, with the Central Committee''s notice, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 512–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 410 n.62a); Wang Renzhong, speech of Nov. 15, 1964, with the Central Committee''s notice, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 513–14, 516 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 410 n.63); Wang Renzhong, speech of Nov. 15, 1964, with the Central Committee''s notice, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 514–15 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 411 n.66); Wang Renzhong, speech of Nov. 15, 1964, with the Central Committee''s notice, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 517–18 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 411 n.68); Wang Renzhong, speech of Nov. 15, 1964, with the Central Committee''s notice, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 518–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 412 n.70). Names: Liu Shaoqi. Check: the day; the book places the speech three days after Liu''s approval of Nov. 12 (III, 412). Check: whether [[w.zhonggong-dangshi-jiaoxue-cankao]] was printed for internal circulation (the book finds a document it prints not openly available in China, III, 400 n.10); if so, it is no Made public date.'
