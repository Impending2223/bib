      c: 'Li Xuefeng writes to Liu Shaoqi in support, explaining his earlier stand by the counties'' resistance. Shanxi: 44 or 45 percent of its ninety-six counties with serious problems; of their secretaries, nineteen against or unsupportive, nineteen compromisers.'
