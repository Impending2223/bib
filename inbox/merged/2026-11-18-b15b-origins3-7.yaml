- add:
    entry:
      id: cal.1963-01-01.china-leadership-5
      when: Jan. 1
      date: '1963-01-01'
      thread: china-leadership
      c: Shanghai, a forum of cultural workers. Ke Qingshi, first secretary of East China and of Shanghai, calls for writing about the thirteen years, the People's Republic's own.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 382. Cong Jin: Mao had not condemned all old plays; Ke went on his own reading of Mao''s remarks (III, 382 n.5). To check: [[w.jin-1949-1989-niande-zhongguo]], 548 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 382 n.5a). Names: Ke Qingshi. Check: the day; Bo Yibo dates Ke''s speech February 1963 ([[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1229, cited by [[w.macfarquhar-origins-of-the-cultural]], III, 382 n.5b).'
      tags:
      - polity:prc
      - name:ke-qingshi
      src:
