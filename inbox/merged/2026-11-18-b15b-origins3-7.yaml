- add:
    entry:
      id: cal.1964-09-18.china-leadership-2
      when: Sept. 18
      date: '1964-09-18'
      thread: china-leadership
      c: 'The Central Committee issues the Revised Latter Ten Points, approved by Mao, Zhou Enlai, Deng Xiaoping and Peng Zhen: the movement to last five to six years, a work team to stay six months at least and to lead it; rightism toward the cadres held worse than leftism.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 406–7. Bo Yibo''s changes (III, 406–7): Mao''s six criteria; leaders at brigade level from start to finish, twice; the masses unleashed the test; the cadres'' problems first, the work teams to lead; extra work where land reform was incomplete; two stages, the four clean-ups and the struggle with the enemy, then organizational rebuilding. Made public: 1968. To check: [[w.huaxuan-zhongguo-gongchan-dang-huiyi]], 508 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 406 n.43); [[w.baum-ssu-ching]], 104 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 406 n.45); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1121 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 407 n.46); [[w.baum-prelude-to-revolution]], 93–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 407 n.47a); the Revised Latter Ten Points, Sept. 18, 1964, as translated in [[w.baum-ssu-ching]], 102–17 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 407 n.47b); [[w.zedong-jianguo-yilai-mao-zedong]], 11, 194–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 407 n.47c). See [[cal.1964-09-01.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:peng-zhen
