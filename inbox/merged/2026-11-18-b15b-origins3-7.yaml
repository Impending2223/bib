      when: Sept. 1
      date: '1964-09-01'
      thread: china-leadership
      c: The Central Committee circulates Wang Guangmei's Taoyuan report, with Liu Shaoqi's comment that it has general significance.
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 406. The report''s points, as the book gives them: first strike roots and link up, then the four clean-ups and the struggle with the enemy; rely on the basic-level cadres, but not wholly; the four cleans of politics, economics, ideology and organization, not only of work points, accounts, finances and granaries (III, 406). Made public: 1989. To check: [[w.xin-zhongguo-biannianshi-1949]], 234 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 406 n.42a); [[w.zedong-jianguo-yilai-mao-zedong]], 11, 144–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 406 n.42b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1123 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 406 n.42c). See [[cal.1964-07-05.china-leadership-4]]. Names: Liu Shaoqi.'
