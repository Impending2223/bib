    entry:
      id: cal.1962-12-21.china-leadership-2
      when: Dec. 21
      date: '1962-12-21'
      thread: china-leadership
      c: 'Mao to the East China regional leaders: the theater has too many plays of emperors and generals and too many troupes on the old repertory, Peking''s opera troupes among them; in some plays the west wind prevails.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 381. Made public: 1989. To check: [[w.jin-1949-1989-niande-zhongguo]], 548 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 381 n.4a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1226 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 381 n.4b). Names: Mao Zedong. Check: the place; the book names only the East China regional leadership (III, 381). The Mao chronology has Mao at Hangzhou on Dec. 24 ([[cal.1962-12-24.china-leadership]]).'
      tags:
      - polity:prc
      - name:mao-zedong
