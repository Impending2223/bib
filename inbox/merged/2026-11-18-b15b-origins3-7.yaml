      when: June 23
      date: '1964-06-23'
      thread: china-leadership
      c: 'Peking, a forum of performers Zhou Enlai arranged: Jiang Qing''s first public speech, on the revolution in Peking opera. She names Lin Biao and Kang Sheng with respect and praises Ke Qingshi''s work on Shanghai''s plays.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 388–89. Her figure: 30 million landlords, rich peasants, rightists and the like, whom the old plays serve; her right to speak, from her visits to the theaters; Ke''s way, by the book''s reading, set against an unnamed Peng Zhen''s (III, 388–89). Privately she charges Peng with "Peking chauvinism" (III, 388 n.50). To check: Jiang Qing, speech of June 23, 1964, in [[w.qing-jiang-qing-tongzhi-lun]], 26–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 388 n.48b); [[w.jin-1949-1989-niande-zhongguo]], 558–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 388 n.49a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1228–30 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 388 n.49b); Jiang Qing, speech of June 23, 1964, in [[w.qing-jiang-qing-tongzhi-lun]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 388 n.50a); Jiang Qing, speech of June 23, 1964, in [[w.qing-jiang-qing-tongzhi-lun]], 27 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 389 n.52b); Jiang Qing, speech of June 23, 1964, in [[w.qing-jiang-qing-tongzhi-lun]], 27 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 389 n.53b). Names: Jiang Qing, Zhou Enlai, Lin Biao, Kang Sheng, Ke Qingshi. Check: whether this forum is Zhou''s meeting of the same day with the festival''s troupes ([[cal.1964-06-23.china-leadership]]).'
