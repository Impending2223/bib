      follows:
      - cal.1963-08-28.march-on-washington
      n: '[[w.zelizer-fierce-urgency-of-now]], 51–52; [[w.branch-parting-the-waters]], 883–86; [[w.whalen-longest-debate]],
        26–27 (about 5 p.m.; ten leaders; an FEPC and a title for intervention by Justice; the count, State by State,
        158 to 160 Democrats, 60 Republicans to find; Randolph; Johnson: "This president can''t get those 60 votes").
        Check: Branch, 883–86: the Cabinet Room; the President to his aides of King, "He''s damn good," and to King,
        "I have a dream"; Randolph for a section on employment, Reuther for Title III; O''Brien''s count read State
        by State; Kennedy: the Republicans "trying to ... play to the South"; Reuther, "small groups of these fellows";
        King on Eisenhower, "Isn''t he a Democrat when he goes to church?"; Blake to lead a delegation to Gettysburg,
        "And keep Walter in the background"; over at 6:12 p.m., seventy-two minutes (the appointments log, 886 n.1).
        To check: the recording, [Kennedy, Blake, King, McKissick, Prinz, Randolph, Reuther, Wilkins and Young,
        5 p.m.](https://prde.upress.virginia.edu/conversations/4006294), JFK Meeting Tape 108.1 and 108.2 (PRDE
        only); [[w.rosenberg-kennedy-johnson-and-the]], 136–39; [[w.reeves-president-kennedy]], 585. After the March,
        by Branch''s account. See [[cal.1963-08-28.march-on-washington]]. Names: Kennedy, Martin Luther King, Randolph,
        Wilkins, Young, Reuther.'
