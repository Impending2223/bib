- add-words:
    id: cal.1962-07-22.china-leadership-6
    after: end
    words: 'Deng: the central departments the worst for dispersionism, the Chairman and the Standing Committee not kept informed. Each department to send a report of no more than 3,000 to 4,000 characters soon, then each month for half a year one of about 2,000, written by its head, not a secretary; a note on any sudden matter; abstracts of the Secretariat''s business to the Standing Committee. No debate on household contracting in the press, no criticism by name.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1717–1718'
