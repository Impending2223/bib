    tags:
    - name:deng-xiaoping
    - name:peng-zhen
- add-words:
    id: cal.1961-07-13.china-leadership-5
    after: end
    words: 'Peng Zhen 彭真: train teachers, better the textbooks; key schools turn on teaching quality, not numbers, and Tsinghua may take fewer entrants; labor as punishment is illegal; give time to read.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 140'
