    after: end
    words: Bo Yibo 薄一波 explains the draft regulations on the management of state industrial enterprises; Peng Zhen 彭真 attends, the Secretariat''s 267th meeting.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 144–145'
- check:
    id: cal.1961-07-28.china-leadership-2
    text: 'Check: Peng Zhen nianpu, IV, 145, says the draft was later called the "Seventy Articles on industry" (so too the Deng nianpu, III, 1654); the line has the Eighty Articles, from the diary, II, 54.'
