    words: 'More than 100,000 attend. Liu Shaoqi 刘少奇, Dong Biwu 董必武 and Peng Zhen 彭真 are with Zhou. Peng speaks: China and Indonesia have upheld the ten principles of Bandung and the five of coexistence.'
