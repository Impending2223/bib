    after: end
    words: 'More than 10,000 attend, in the Great Hall; Deng Xiaoping 邓小平 and Peng Zhen 彭真 are with Zhou. Peng speaks: the treaty is the crystal of the two peoples'' unity and fighting friendship, a new milestone.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 139'
- names:
    id: cal.1961-07-12.china-leadership-2
    add:
