    tags:
    - name:peng-zhen
- add-words:
    id: cal.1962-06-25.china-leadership-2
    after: end
    words: 'More than 10,000 attend. Peng Zhen 彭真 presides and opens it: if the peoples of the world unite against U.S. imperialism''s policies of aggression and war, the cause of world peace and human progress will win. Chen Yi and Pak Kum Chol 朴金喆, head of the Korean delegation, speak.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 203'
