patch: 2026-11-12-b11-sjournals-2
by: Claude (batch 11 reader, Schlesinger, Journals 1952–2000, Jan. 1965–Dec. 1966; audited by a batch 11 auditor, Nov. 12, 2026)
ops:
- add:
    entry:
      id: cal.1965-01-19.transition-and-staff-2
      when: Jan. 19
      date: '1965-01-19'
      thread: transition-and-staff
      c: Goodwin shows Schlesinger the inaugural address in draft. By Goodwin's account, day not given, Stevenson submitted "the only usable draft" and "conceived the device of the perspective on the earth created by the rocket traveling to Mars."
      n: '[[w.schlesinger-journals]], 237 (the entry of Jan. 20: "showed it to me yesterday"; Stevenson''s draft "according to Dick," the day of that account not given). Made public: [[w.schlesinger-journals]] (2007). Names: Goodwin, Schlesinger, Stevenson.'
      tags:
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1965-01-19.robert-kennedy
      when: Jan. 19
      date: '1965-01-19'
      thread: robert-kennedy
      c: 'Robert Kennedy to Schlesinger, in Schlesinger''s office after Galbraith''s luncheon at the Jockey Club: he "thanked heaven every day that the vice presidency had fallen through; it would have been a miserable and hopeless relationship, and nothing but trouble could have come from it." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 236–37 (the entry of Jan. 20: the luncheon "yesterday"; "After lunch, Bobby came over to my office"). Made public: [[w.schlesinger-journals]] (2007). Names: Robert Kennedy, Galbraith, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:galbraith-john-kenneth
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1965-05-22.latin-america
      when: May 22
      date: '1965-05-22'
      thread: latin-america
      c: 'The White House, Saturday morning, and lunch with Bundy and Goodwin. Schlesinger urges that Johnson see Betancourt, in town: if not the President, then "Mac or Bill or Dick." Bundy calls Johnson and suggests it; Johnson "was cold to the idea." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 237–38 (the entry headed May 25, a Tuesday: "Saturday morning"). Made public: [[w.schlesinger-journals]] (2007). Names: Schlesinger, Bundy, Goodwin, Betancourt, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:goodwin-richard-n
      - name:betancourt-romulo
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1966-02-27.vietnam-rfk-front
      when: Feb. 27
      date: '1966-02-27'
      thread: vietnam-rfk-front
      also:
      - robert-kennedy
      c: Hickory Hill, Sunday morning, before Robert Kennedy's *Face the Nation*. Fred Dutton and Schlesinger go out "to run through possible questions." By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 245 (the entry of Mar. 11). Made public: [[w.schlesinger-journals]] (2007). Names: Robert Kennedy, Dutton, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:dutton-frederick-g
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1966-03-12.war-opposition-2
      when: Mar. 12
      date: '1966-03-12'
      thread: war-opposition
      also:
      - press-and-broadcasting
      - vietnam
      - democratic-party
      c: 'The Cowles party after the Gridiron dinner. Johnson takes Schlesinger''s hand: "Well, Arthur, I noticed that you had a little trouble with your chair when there was that ovation with Dean." To Chalmers Roberts of the *Post*, standing by: "Don''t print anything about that. It is very important to maintain the unity of the Democratic party—from Rusk to Schlesinger." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 247 (the entry of Mar. 13: "Last night"; "Afterward, at the Cowles party"). Made public: [[w.schlesinger-journals]] (2007). See [[cal.1966-03-12.press-and-broadcasting]]. Names: Johnson, Schlesinger, Roberts, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - name:roberts-chalmers-m
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-06-14.vietnam-3
      when: June 14
      date: '1966-06-14'
      thread: vietnam
      c: 'Washington, dinner at Jane McBaine''s. Rostow, by Schlesinger''s journal, draws an analogy between Johnson and Lincoln, casting the opposition to the war as the Copperheads: "if LBJ only kept up the military momentum, he would be in the clear in another few months."'
      n: '[[w.schlesinger-journals]], 250–51 (the entry of July 28: "I last saw him at dinner at Jane McBaine''s in Washington on June 14"). Made public: [[w.schlesinger-journals]] (2007). Names: Rostow, Johnson, Schlesinger.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - city:washington
- add:
    entry:
      id: cal.1966-07-22.war-opposition-2
      when: July 22
      date: '1966-07-22'
      thread: war-opposition
      also:
      - elections-1968
      c: 'Dinner at George Stevens''s. Harriman to Schlesinger: "Fear always runs the State Department ... Now they are afraid of Congress, the Joint Chiefs of Staff and the White House"; his "deepest anxiety" about those around Johnson urging the war''s intensification. Leaving, told that Schlesinger will spend the weekend with Galbraith, McGovern and Harris: "What are you up to?" Schlesinger: "We are planning a coup d''etat." Harriman: "Count me in." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 249–50 (the entry of July 28: "dinner at George Stevens''s on July 22"). Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger, Johnson, Galbraith, McGovern.'
      tags:
      - name:harriman-w-averell
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - name:galbraith-john-kenneth
      - name:mcgovern-george
- add:
    entry:
      id: cal.1966-08-13.robert-kennedy
      when: Aug. 13–14
      date: '1966-08-13'
      thread: robert-kennedy
      also:
      - vietnam
      c: Hyannis Port, the weekend, with Schlesinger. Robert Kennedy, "electrified by the news that North Korea has issued a declaration of independence against both Russia and China," takes it to reinforce his conviction that communism will take "increasingly nationalistic forms," especially in the underdeveloped world, and that, "if we had only left North Vietnam alone, it would be defying China too." By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 252–53 (the entry of Aug. 14: "Just back from another Hyannis Port weekend"). Made public: [[w.schlesinger-journals]] (2007). Names: Robert Kennedy, Schlesinger. Check: the day.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - polity:dprk
      - polity:ussr
      - polity:prc
      - polity:drv
- add:
    entry:
      id: cal.1966-08.korea
      when: Aug.
      date: 1966-08
      thread: korea
      c: North Korea issues "a declaration of independence against both Russia and China," by Schlesinger's journal (the news at Hyannis Port, the weekend before Aug. 14).
      n: '[[w.schlesinger-journals]], 252 (the entry of Aug. 14). Check: the day.'
      tags:
      - polity:dprk
      - polity:ussr
      - polity:prc
- cite:
    id: cal.1965-01-20.transition-and-staff
    item: '[[w.schlesinger-journals]], 235, 237 (the entry of Jan. 20: "the first day of the Johnson era"; "I have just heard the inaugural address"; "The first half is much as it was when Dick Goodwin showed it to me yesterday. The last part is new and good"; "On the whole, a fine address"; credit "first to Dick and then to Adlai Stevenson"; not the oath, the covenant or the Great Society; Goodwin''s showing of the draft, Jan. 19)'
    units: A
- cite:
    id: cal.1965-07-14.transition-and-staff
    item: '[[w.schlesinger-journals]], 238 (the entry of July 16: Goodwin called Schlesinger from the White House "a minute or two after one o''clock on Wednesday, July 14," to say Stevenson had died in London; Marietta with him; walking along Grosvenor Street toward Hyde Park he "felt faint, clutched an iron railing nearby and then pitched over, obviously felled by a massive heart attack or stroke"; not the Goldberg appointment)'
    units: '?'
- cite:
    id: cal.1965-07-15.transition-and-staff
    item: '[[w.schlesinger-journals]], 238 (the entry of July 16: Air Force One "came in from London with the casket" at Andrews Field "the next afternoon" after July 14, so July 15; Schlesinger there with Ed and Mary Louise Day; Humphrey not named; not the service or the burial)'
    units: '?'
- cite:
    id: cal.1965-07-16.transition-and-staff
    item: '[[w.schlesinger-journals]], 239 (the entry of July 16, the day of the service not given: Carl McGowan "suggested" in "his remarks at the National Cathedral" that Stevenson "was not a perfect man"; not the attendance, Johnson or Fulbright)'
    units: '?'
- cite:
    id: cal.1965-04-07.vietnam
    item: '[[w.schlesinger-journals]], 248 (the entry of July 28, 1966, on the drafting, the day not given: Johnson "instructed Dick to make negotiation a central theme of the speech"; the White House "upheld negotiation against Rusk''s complaint that it would upset the government in Saigon"; McNamara told Goodwin "that the speech was fine and that he should not change a word of it"; not the words of the address)'
    units: '?'
- cite:
    id: cal.1966-01-06.vietnam
    item: '[[w.schlesinger-journals]], 243–44 (the entry of Jan. 21: Schlesinger "assembled Carl Kaysen, Dick Goodwin and Ken Galbraith for a dinner at 3132 O Street with Bob McNamara" on the evening of Jan. 6; McNamara "strongly in favor of the pause," the Joint Chiefs and Rusk, as one gathered, opposed; McNamara "defined his objective in South Vietnam as ''withdrawal with honor''"; "Our impression was that he feared the resumption of bombing might well put us on the slippery slide"; not who asked for the dinner, Johnson''s knowledge or the word Georgetown)'
    units: B, C
- cite:
    id: cal.1966-01-31.vietnam
    item: '[[w.schlesinger-journals]], 245 (the entry of Mar. 11: "toward the end of January, he decided to end the pause and resume bombing," for reasons, so far as Schlesinger could find out, "psychological and political rather than military"; not the day or the 37 days)'
    units: '?'
- cite:
    id: cal.1966-02-19.vietnam
    item: '[[w.schlesinger-journals]], 245 (the entry of Mar. 11: Kennedy''s "first statement," the day not given, "not as precise as his later ones"; "ten days of confused controversy"; not the words)'
    units: '?'
- cite:
    id: cal.1966-02-22.vietnam-2
    item: '[[w.schlesinger-journals]], 245–46 (the entry of Mar. 11, by Feb. 27, the day not given: Moyers "had said we would not exclude Viet Cong participation in an interim government"; not the briefing, the elections or Kennedy''s answer)'
    units: '?'
- cite:
    id: cal.1966-02-27.robert-kennedy
    item: '[[w.schlesinger-journals]], 245 (the entry of Mar. 11: Kennedy''s statements, "especially on Face the Nation, February 27"; the Viet Cong a seat "as an independent body," acceptance of an interim government with Viet Cong participation or a coalition from free elections; not the words quoted on assassins and murderers)'
    units: '?'
- cite:
    id: cal.1966-02-27.vietnam
    item: '[[w.schlesinger-journals]], 246 (the entry of Mar. 11: "An hour after Bobby, Hubert went on the air on Issues and Answers"; watched before lunch at Hickory Hill, Kennedy "so irritated and upset by Hubert''s performance that, after a few minutes, he went silently away"; not the words quoted)'
    units: '?'
- cite:
    id: cal.1966-03-12.press-and-broadcasting
    item: '[[w.schlesinger-journals]], 247 (the entry of Mar. 13: "Last night the Gridiron" dinner, so Mar. 12; Russell Long "a great success," John Lindsay "a flop"; the show''s "vicious attack on Fulbright" and "hymn of reverence to Rusk"; Rusk introduced, a standing ovation; Schlesinger, with Herblock and "perhaps 10 percent of the audience," seated; not the Nixon skit)'
    units: A
- cite:
    id: cal.1966-07-20.robert-kennedy
    item: '[[w.schlesinger-journals]], 249 (the entry of July 28: "We discussed this with RFK at dinner in New York on July 20"; Goodwin''s and Schlesinger''s thoughts of a committee against the widening of the war; Kennedy: a movement "would have to tie itself to an issue or to a man," the issue "too complicated and ambiguous"; Johnson "could always justify each specific step"; Goodwin''s point on a Kennedy movement; Galbraith is not named at the dinner)'
    units: B, C, D, E
- cite:
    id: cal.1966-07-23.democratic-party
    item: '[[w.schlesinger-journals]], 249–50 (the entry of July 28: "the weekend of July 24, which I spent at Ken Galbraith''s in Newfane, Vermont, with George McGovern and Seymour Harris"; Schlesinger thinks "for the first time" of Kennedy "going for the nomination in 1968"; McGovern "would be all for it" and thinks Johnson "might conceivably be bluffed out of trying for renomination"; Galbraith''s own words not given)'
    units: B, C
- cite:
    id: cal.1966-10-30.robert-kennedy
    item: '[[w.schlesinger-journals]], 253–54 (the entry of Oct. 30: the Dillons'' dinner; Kennedy, from campaigning, "last stop: Connecticut," arrives about 10:30, Goodwin a few moments before; "we talked until 2:30" at P.J. Clarke''s; the 80 percent for Johnson and 20 for him; "rueful about his own vogue"; the Warren Report; also Johnson on their day of campaigning, undated, and the Manchester book, not in the entry)'
    units: A, B, C, D, E
- cite:
    id: cal.1966-10.assassination
    item: '[[w.schlesinger-journals]], 253–54 (the entry of Oct. 30, the day: the night at the Dillons'' and P.J. Clarke''s, "until 2:30"; the Warren Report; Schlesinger''s words, not Kennedy''s: "poor job"; see the variant)'
    units: A
- check:
    id: cal.1966-10.assassination
    text: 'Check: the day, and a duplicate: [[w.schlesinger-journals]], 253–54, the entry of Oct. 30, 1966, puts this night at P.J. Clarke''s on Oct. 30, the night of [[cal.1966-10-30.robert-kennedy]]; to combine.'
- variant:
    id: cal.1966-10.assassination
    unit: B
    witness: w.schlesinger-journals
    reads: 'Schlesinger''s own words, not Kennedy''s: "It is evident that he believes that it was a poor job and will not endorse it, but that he is unwilling to criticize it and thereby reopen the whole tragic business"'
    at: '254'
