- add:
    entry:
      id: cal.1960-11-26.china-leadership-10
      when: Nov. 26
      date: '1960-11-26'
      thread: china-leadership
      also:
      - laos
      - vietnam-diplomacy
      c: 'The Foreign Ministry (Ji Pengfei, after Luo Guibo''s review) to Chen Yi for review and the Premier for approval, extremely urgent: China can concur with the DRV''s position on Sihanouk''s proposal to neutralize Cambodia and Laos. The question to Sihanouk on his hope that Western states guarantee the neutrality waits for an opportune moment. The DRV''s and China''s positions go by telegram to Chairman Liu and China''s representatives; approval asked.'
      n: '"[Cable from the Chinese Foreign Ministry, ''Report on the Matter of the Proposal by the Central Committee of the Vietnamese Workers'' Party to Neutralize Cambodia and Laos by the Ministry of Foreign Affairs of the People''s Republic of China''](https://digitalarchive.umd.edu/document/120869)" (Nov. 26, 1960), PRC FMA 106-00553-04, 12–14, obtained by Yiming Feng, trans. Marian Rosenberg, Wilson Center Digital Archive. See [[cal.1960-11-23.vietnam-diplomacy]]. Names: Ji Pengfei, Chen Yi, Zhou Enlai, Liu Shaoqi, Sihanouk. Check: the Archive''s "Prime Minister Chen" is Chen Yi. Check: the year the Archive posted it.'
