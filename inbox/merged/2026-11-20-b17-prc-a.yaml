    id: cal.1965-05-12.china-leadership-4
    base: 943b8900
    set:
      c: Zhou receives Nguyễn Minh Phương, acting head of the National Liberation Front of South Vietnam's permanent mission in China. Per the Chinese record, Zhou tells him the Soviet Union has asked China's view on the Cambodia conference, saying Sihanouk has changed his attitude; China holds that Sihanouk has not, supports his three points and the fourteen-state scope of the 1954 Geneva conference, and holds that the Saigon regime has no right to attend and the Front is South Vietnam's sole legal representative. Zhou says China will not retreat from its earlier statements; Phương says he will report, and that Sihanouk's position is clear.
      n: '"[Record of Conversation between Premier Zhou and Nguyễn Minh Phương](https://digitalarchive.umd.edu/document/165484)" (May 12, 1965), PRC FMA 106-01515-03, 23–28, trans. Stephen Mercado, Wilson Center Digital Archive. [[w.zhou-enlai-waijiao-huodong]], 455 (May 12, 1965; 3 p.m., Beijing). Made public: 1993. The book names him 阮明芳; no content. Names: Zhou Enlai.'
