      place: peking
- add:
    entry:
      id: cal.1962-11-24.vietnam-diplomacy
      when: Nov. 24
      date: '1962-11-24'
      thread: vietnam-diplomacy
      also:
      - south-asia
      c: 'The Chinese Embassy in Vietnam to the Foreign Ministry, very urgent: Hồ Chí Minh, meeting the chargé Wang on his letters to Liu Shaoqi and to India''s president and prime minister, says an American press chart of the Sino-Indian border still classes Vietnam as part of China. He says Nehru, of the capitalist class and an aristocrat, was fairly progressive before independence and is still a leftist among India''s rulers; the ruling class''s titans, he says, made Nehru drop Menon, and Nehru is more isolated since.'
      n: '"[Cable from the Chinese Embassy in Vietnam, ''Chairman Ho Discusses the Following Two Situations''](https://digitalarchive.umd.edu/document/121295)" (Nov. 24, 1962), PRC FMA 106-00729-04, 19–20, trans. Anna Beth Keim, Wilson Center Digital Archive. Names: Hồ Chí Minh, Liu Shaoqi, Nehru, Menon. Check: the year the Archive posted it.'
      src:
        c: aba484f7
        rows:
        - 'https://digitalarchive.umd.edu/document/121295: all'
      tags:
