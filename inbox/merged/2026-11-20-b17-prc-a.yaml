- edit:
    id: cal.1965-04-19.china-leadership-2
    base: cd192f28
    set:
      c: Zhou meets Kim Il Sung again at the presidential palace in Jakarta. Per the Chinese record, with Chen Yi and Qiao Guanhua present, Zhou tells Kim that the United Arab Republic and Algeria oppose a document in support of Vietnam, and that Phạm Văn Đồng has said there will be none, for the sake of the second Asian–African conference in June. Sukarno, who had agreed to take up the symposium at 7 a.m. that day, cannot fit it in; Phạm is to describe the Vietnam situation to some countries listening. Kim agrees.
      n: '"[Minutes of Conversation between Premier Zhou Enlai and Premier Kim Il Sung](https://digitalarchive.umd.edu/document/134787)" (Apr. 19, 1965), PRC FMA 106-00828-01, 9, trans. Caixia Lu, Wilson Center Digital Archive. The words: 时间：一九六五年四月十九日下午五时至五时半; 地点：雅加达总统府 (Merdeka Palace). Present: Chen Yi 陈毅, Qiao Guanhua 乔冠华; Kim Gwang-hyeop 金光侠, Pak Seong-cheol 朴成哲; interpreter and recorder Li Xiangwen 李相文. [[w.zhou-enlai-waijiao-huodong]], 447 (Apr. 19, 1965; 5 p.m., presidential palace, Jakarta). The book gives no content. Check: the book does not say whose clock; taken as local. Names: Zhou Enlai. Check: the year the Archive posted it.'
      src:
        c: 7bff3b7c
        rows:
        - 'w.zhou-enlai-waijiao-huodong 447: all'
        - 'https://digitalarchive.umd.edu/document/134787: A-E'
