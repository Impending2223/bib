- add:
    entry:
      id: cal.1964-01-14.china
      when: Jan. 14
      date: '1964-01-14'
      thread: china
      also:
      - vietnam-diplomacy
      c: 'The Foreign Cultural Liaison Committee to the embassy''s cultural office in Vietnam, secret, in answer to Counselor Du''s query on the year''s priorities: more cultural cooperation with the DRV, on a larger scale than before, because it stands at the front against imperialism and resists Soviet pressure. It also asks help in the DRV''s self-reliance in culture, work among the leading figures of culture, especially the left, Vietnamese plays and writings recommended for China, and reports on the struggle with revisionism.'
      n: '"[Cable from the Foreign Cultural Liaison Committee, ''Preliminary Consideration on Policy to Vietnam in the Year 1964''](https://digitalarchive.umd.edu/document/120603)" (Jan. 14, 1964), PRC FMA 106-01174-03, trans. Qingfei Yin, Wilson Center Digital Archive. The words: 对外文委 (the Committee); 告64年对越南开展工作的初步考虑 (the title). The Chinese text: sent with Cao Ying''s approval (批发 曹瑛); copies to the Premier, Deng Xiaoping, Peng Zhen, Li Fuchun, Chen Yi and others (抄：总理、小平、彭真、富春、陈总); printed Jan. 17. Check: the year the Archive posted it.'
      src:
        c: c09e5def
        rows:
        - 'https://digitalarchive.umd.edu/document/120603: all'
      tags:
      - polity:prc
      - polity:drv
      - vis:only:prc
- add:
    entry:
      id: cal.1964-01-30.vietnam-diplomacy
      when: Jan. 30
      date: '1964-01-30'
      thread: vietnam-diplomacy
      also:
      - china
      - vietnam-hanoi
      c: 'The Chinese Embassy in Vietnam to the Foreign Cultural Liaison Committee, expedited: at the embassy''s dinner for musicians visiting China, Ninh Văn Phan of the Vietnamese cultural liaison committee tells Counselor Du that its director, Phạm Ngọc Thạch, will go to the Soviet Union in February on the 1964 cultural plan and stop at Peking on the way back for the supplementary plan. The plan, five or six times last year''s, awaits Phạm Hùng, and the DRV, Ninh says, will mainly learn from China and keep only ceremonial contacts with Eastern Europe, whose culture he calls full of revisionism.'
      n: '"[Cable from the Chinese Embassy in Vietnam, ''Phạm Ngọc Thạch Will Visit the Soviet Union and China to Discuss Cultural Cooperation''](https://digitalarchive.umd.edu/document/120604)" (Jan. 30, 1964), PRC FMA 106-01174-04, trans. Qingfei Yin, Wilson Center Digital Archive. Check: the director''s name: the Chinese text has 范玉纯 (not 范玉石, Phạm Ngọc Thạch); the Archive''s English gives Thạch. Check: the Archive''s English calls Phạm Hùng "Prime Minister"; the Chinese text, 范雄副总理, has vice premier; 我杜参赞 (our Counselor Du), the English "Charge D''Affaires Du". Check: the year the Archive posted it.'
      src:
        c: 630964ef
        rows:
        - 'https://digitalarchive.umd.edu/document/120604: all'
