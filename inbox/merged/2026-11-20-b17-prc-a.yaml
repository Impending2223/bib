      c: Vice Foreign Minister Huang Zhen, with a letter from Zhou Enlai, talks with Sihanouk, per the Chinese minutes. Huang says China has ceased fire and withdrawn while India keeps up war talk, and asks friendly leaders to press India to negotiate, as at the six-nation conference at Colombo that Sihanouk says he will attend. On Sihanouk's draft declaration of Cambodia's neutral stand Huang says China will sign if the others do, would have Thailand, South Vietnam and the United States sign, and prefers the voting rules of the 1962 Geneva conference on Laos; Sihanouk, bound for Bandung, doubts they will sign and will answer Zhou in writing.
      n: '"[Minutes of Conversation between Chinese Vice Foreign Minister Huang Zhen and Cambodian King Norodom Sihanouk](https://digitalarchive.umd.edu/document/121900)" (Nov. 30, 1962), PRC FMA 106-01398-04, 57–61, obtained by Dai Chaowu, trans. 7Brands, Wilson Center Digital Archive. To check: Zhou Enlai to Sihanouk, the letter Huang carried (named by the minutes). Names: Huang Zhen, Zhou Enlai, Sihanouk. Check: the year the Archive posted it.'
