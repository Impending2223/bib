      place: peking
      c: Mao receives Cambodia's ambassador, Sisowath Sirik Matak, on his leaving, Ji Pengfei escorting. Per the Chinese record, Mao says the imperialists want to kill Sihanouk and the Queen and overthrow the government, urges vigilance, citing Qasim of Iraq, and a gradual end to American and other foreign aid, and says the South Vietnamese must fight on, one or two years, perhaps eight or nine, before the Americans go; the Party, he says, has decided on his successor. Sirik Matak says Cambodia ends all American aid from January 1964 and that Britain now backs its proposed conference on neutrality.
      n: '"[Record of Conversation from Chairman Mao Zedong''s Reception of the Cambodian Ambassador to China Sisowath Sirik Matak](https://digitalarchive.umd.edu/document/123872)" (Feb. 8, 1964), PRC FMA 106-01467-04, 7–17, trans. David Cowhig, Wilson Center Digital Archive. The words: "1:30 pm", Zhongnanhai (the record). Names: Mao Zedong, Sirik Matak, Sihanouk, Ji Pengfei. Check: the year the Archive posted it.'
