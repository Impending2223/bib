      - vietnam-diplomacy
      c: 'The Qinzheng Hall. Mao receives Prince Sihanouk, Cambodia''s head of state, his wife and Penn Nouth, Prime Minister, at dinner; Liu Shaoqi, Zhu De, Zhou Enlai, Peng Zhen, Chen Yi and others present. In his absence Laos has changed: Phoumi, backed by America, its guns and officers, has taken most of Vientiane; Laos now America''s question, not Britain''s or France''s. Per the Chinese record, Mao passes on Hồ Chí Minh''s greetings, his invitation to visit the DRV and his request for diplomatic relations; Sihanouk cannot go now, returning to Phnom Penh Dec. 26, and keeps no relations with a divided country, offering consulates instead, as in New Delhi.'
      n: '"[Memorandum of Chairman Mao''s Conversation with Sihanouk on 17 December 1960](https://digitalarchive.umd.edu/document/120870)" (Dec. 17, 1960), PRC FMA 106-00274-01, 1–7, obtained by Yiming Feng, trans. Jake Tompkins, Wilson Center Digital Archive. [[w.zedong-mao-zedong-nianpu]], IV, Dec. 17, 1960. [[w.zhou-enlai-nianpu-1949]], II, 380, Dec. 17, 1960 (Zhou present). [[w.zhou-enlai-waijiao-huodong]], 296 (Dec. 17, 1960; 下午5时, 中南海勤政殿, with Deng Yingchao); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 499 (Dec. 17, 1960; Liu, with Mao, Zhu De and Zhou Enlai, meets Sihanouk). The words: "Time: 17 December 1960, 5:00pm / Location: Zhongnanhai Government Reception Hall" (the record''s heading). Made public: 1993. Names: Mao Zedong, Sihanouk, Penn Nouth, Phoumi, Liu Shaoqi, Zhu De, Zhou Enlai, Peng Zhen, Chen Yi, Hồ Chí Minh.'
