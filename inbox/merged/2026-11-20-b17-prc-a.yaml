- edit:
    id: cal.1961-01-31.china-leadership-4
    base: 80d34a42
    set:
      c: 'Peking, the Great Hall of the People. Zhou Enlai, at the banquet for the Vietnamese economic and trade delegation, says China fully supports the Vietnamese government''s proposal of an international conference to secure Laos''s peace and neutrality. Per the Chinese record, Zhou with Nguyễn Duy Trinh at the banquet: Poland having declined, the DRV asks China to build a paper mill beside the Polish-aided Vạn Điểm sugar mill, and Zhou says China can consider it. The DRV asks for an aerial survey and mapping of North Vietnam; Zhou says China cannot do it in the first half of 1961, for Laos and for want of equipment, and the two sides will look again in the second half.'
      n: '"[Record of Conversation from Premier Zhou Enlai''s Reception of Vietnamese Deputy Prime Minister Nguyen Duy Trinh](https://digitalarchive.umd.edu/document/176278)" (Jan. 31, 1961), PRC FMA 106-00602-02, 18–19, trans. Stephen Mercado, Wilson Center Digital Archive. The words: "8:30 p. m., 31 January 1961", Anhui Hall, Great Hall of the People (the record). [[w.zhou-enlai-waijiao-huodong]], 303 (Jan. 31, 1961; 晚上). See [[cal.1961-01-31.china-leadership]]. Names: Zhou Enlai, Nguyễn Duy Trinh.'
