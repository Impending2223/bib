      c: 'Oklahoma primaries for governor. Democratic: Raymond Gary 31.5 percent, Preston Moore 20.4, David Hall, the Tulsa County district attorney, 18.5; runoff between Gary and Moore. Republican: State Senator Dewey Bartlett 48.9, Happy Camp 48.0; runoff, the party''s first for governor.'
      n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 55](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=55); [p. 59](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=59). [Wikipedia, "1966 Oklahoma gubernatorial election"](https://en.wikipedia.org/wiki/1966_Oklahoma_gubernatorial_election) for the first runoff. [[w.morgan-oklahoma-politics-and-policies]]; [[w.peirce-great-plains-states-of]]. See [[cal.1962-05-01.governors-ok]]. Names: Gary, Moore, Hall (K–J Cong. III.F).'
      tags:
