      when: May 5
      date: '1962-05-05'
      thread: governors
      also:
      - elections-1962
      c: 'Texas primaries for governor. Democratic: Connally 29.8 percent, Don Yarborough 22.0, Governor Daniel 17.2, Attorney General Will Wilson 11.9, Marshall Formby 9.6, Walker 9.6; Connally and Yarborough to a runoff. Republican: Jack Cox 86.0.'
      n: '[Wikipedia, "1962 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1962_Texas_gubernatorial_election), from the *Texas Almanac*; Check: the parties'' canvasses (Texas State Library and Archives). [[w.knaggs-two-party-texas]]; [[w.reston-lone-star]]; [[w.connally-in-historys-shadow]]; [[w.davidson-race-and-class-in]]; [[w.krochmal-blue-texas]]. Names: Connally, Don Yarborough, Daniel, Formby, Cox (K–J Cong. III.F); Walker (K–J Adm. III.F).'
      tags:
      - state:tx
      - name:connally-john
      - name:yarborough-don
      - name:daniel-price
      - name:wilson-will-r
      - name:formby-marshall
      - name:walker-edwin-a
      - name:cox-jack
