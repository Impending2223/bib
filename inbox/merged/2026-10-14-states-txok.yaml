      when: Nov. 8
      date: '1966-11-08'
      thread: governors
      also:
      - elections-1966
      c: 'Oklahoma. Dewey Bartlett (R) elected governor over Preston Moore (D), 377,078 to 296,328, 55.6 percent: a second Republican governor in succession.'
      n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 66](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=66). [[w.peirce-great-plains-states-of]]; [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1966-05-24.governors-ok]]; [[cal.1966-11-08.governors]]. Names: Moore (K–J Cong. III.F).'
      tags:
