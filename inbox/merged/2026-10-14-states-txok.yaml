    entry:
      id: cal.1962-11-06.governors-tx
      when: Nov. 6
      date: '1962-11-06'
      thread: governors
      also:
      - elections-1962
      c: Texas. Connally (D) elected governor over Jack Cox (R), 847,035 to 714,995. No Republican for governor had polled so large a share since 1869.
      n: 'Votes: the joint session''s canvass, [*House Journal*, 58th Leg., Reg. Sess. 49 (1963)](https://lrl.texas.gov/scanned/Housejournals/58/H_58_0.pdf). The comparison: [Wikipedia, "1962 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1962_Texas_gubernatorial_election). [[w.knaggs-two-party-texas]]; [[w.black-rise-of-southern-republicans]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1962-06-02.governors-tx]]; [[cal.1962-11-06.governors]]. Names: Connally, Cox (K–J Cong. III.F).'
      tags:
      - state:tx
      - name:connally-john
      - name:cox-jack
- add:
    entry:
      id: cal.1962-11-06.state-constitutions-tx
      when: Nov. 6
      date: '1962-11-06'
      thread: state-constitutions
      also:
      - welfare
      c: 'Texas votes on fourteen amendments; ten adopted. The ceiling on State funds for the needy aged, blind and children raised from $47 million to $52 million, 677,770 to 430,494; aid to the disabled limited to $2.5 million a year. Hospital districts; workmen''s compensation for employees of political subdivisions, 543,868 to 540,475; continuity of government after enemy attack; water storage; zoning in the Gulf counties; Dallas County school taxes kept through boundary changes. Refused: trials de novo on appeals from agencies; county retirement; State employees on advisory boards; a Titus County home for the aged.'
      n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 6, 1962](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1962-11-06). [[w.may-texas-state-constitution]]. See [[cal.1960-11-08.state-constitutions-tx]].'
      tags:
      - state:tx
- add:
    entry:
      id: cal.1963-04-02.states-and-cities-tx
      when: Apr. 2
      date: '1963-04-02'
      thread: states-and-cities
      also:
      - voting-rights
      c: Crystal City, Tex. Five Mexican American candidates, backed by PASO and the Teamsters at the Del Monte cannery, take all five city council seats, 795 to 864 votes each; the other slate 664 to 754. Of 1,681 poll taxes paid in the town, 1,139 by Mexican Americans. The council makes Juan Cornejo, the Teamsters' representative, mayor.
      n: 'Larry Goodwyn, "Los Cinco Candidatos," [*Texas Observer*, Apr. 18, 1963, pp. 3, 8](https://issues.texasobserver.org/pdf/ustxtxb_obs_1963_04_18_issue.pdf); Teresa Palomo Acosta, ["Crystal City Revolts,"](https://www.tshaonline.org/handbook/entries/crystal-city-revolts) *Handbook of Texas Online*. Check: the date and the city''s canvass. [[w.shockley-chicano-revolt-in-a]]; [[w.montejano-anglos-and-mexicans-in]]; [[w.behnken-fighting-their-own-battles]]; [[w.krochmal-blue-texas]]. Names: Cornejo (K–J Cong. III.F).'
      tags:
      - state:tx
      - name:cornejo-juan
- add:
    entry:
      id: cal.1963-10-19.legislatures-tx
      when: Oct. 19
      date: '1963-10-19'
      thread: legislatures
      c: A three-judge court voids Texas's congressional districts, from 128 percent above the ideal to 48 below, on the suit of George Bush and others; the 1964 elections to be at large unless the Legislature redistricts. The order deferred for the State to seek a stay.
      n: '*Bush v. Martin*, [224 F. Supp. 499](https://static.case.law/f-supp/224/html/0499-01.html) (S.D. Tex. 1963); *Bush v. Martin*, 251 F. Supp. 484 (S.D. Tex. 1966), recites it. [[w.dixon-democratic-representation]]; [[w.cortner-apportionment-cases]]. Names: Bush (Opp. III.D).'
      tags:
      - state:tx
      - name:bush-george-h-w
- add:
    entry:
      id: cal.1963-11-09.state-constitutions-tx
      when: Nov. 9
      date: '1963-11-09'
      thread: state-constitutions
      also:
      - voting-rights
      - welfare
      c: 'Texas votes on four amendments. The poll tax amendment, to repeal payment as a condition of voting and provide for registration of voters, refused, 243,120 to 316,775. Aid to the needy aged, disabled, blind and children, up to $60 million a year, adopted, 330,922 to 192,050. Refused: $150 million more for the Veterans'' Land Fund, 250,556 to 258,433; a Jefferson County retirement fund.'
      n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 9, 1963](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1963-11-09). [[w.may-texas-state-constitution]]; [[w.lawson-black-ballots]]; [[w.davidson-race-and-class-in]]. See [[cal.1962-11-06.state-constitutions-tx]]; [[cal.1962-08-27.voting-rights]].'
      tags:
      - state:tx
- add:
    entry:
      id: cal.1963-11.mayors-houston
      when: Nov.
      date: 1963-11
      thread: mayors
      also:
      - elections-1963
      c: Houston. Mayor Cutrer third in the election for mayor, after a rise in water rates; Louie Welch, a former councilman, and a candidate endorsed by the city's liberal coalition to a runoff. Welch wins it; mayor from January 1964. Check the dates and figures.
      n: '[*Texas Observer*, Nov. 29, 1963, p. 15](https://issues.texasobserver.org/pdf/ustxtxb_obs_1963_11_29_issue.pdf); Brooke Tucker, ["Cutrer, Lewis Wesley,"](https://www.tshaonline.org/handbook/entries/cutrer-lewis-wesley) *Handbook of Texas Online*; George Slaughter, ["Welch, Louie William,"](https://www.tshaonline.org/handbook/entries/welch-louie-william) *Handbook of Texas Online*; City of Houston, [List of Mayors, Council Members and City Controllers from 1958 to 2012](https://www.houstontx.gov/citysec/mayors.pdf). Check: the city secretary''s canvass. [[w.feagin-free-enterprise-city]]. Names: Cutrer, Welch (K–J Cong. III.F).'
      tags:
      - state:tx
      - city:houston
      - name:cutrer-lewis-w
      - name:welch-louie
- add:
    entry:
      id: cal.1964-02-03.mayors-dallas
      when: Feb. 3
      date: '1964-02-03'
      thread: mayors
      c: Dallas. Mayor Cabell resigns to run for Congress against Representative Alger (R). Erik Jonsson, chairman of Texas Instruments, mayor for the rest of the term. Cabell, elected in 1961 over the Citizens Charter Association's candidate and re-elected in 1963, had been mayor on Nov. 22.
      n: 'Michael V. Hazel, ["Cabell, Earle,"](https://www.tshaonline.org/handbook/entries/cabell-earle) *Handbook of Texas Online*; Ann F. Westerlin, ["Jonsson, John Erik,"](https://www.tshaonline.org/handbook/entries/jonsson-john-erik) *Handbook of Texas Online*; [Wikipedia, "Earle Cabell"](https://en.wikipedia.org/wiki/Earle_Cabell) for the date. Check: the council''s minutes. [[w.payne-big-d]]; [[w.fairbanks-for-the-city-as]]; [[w.bridges-morning-glories]]; [[w.phillips-white-metropolis]]; [[w.miller-nut-country]]; [[w.minutaglio-dallas-1963]]. See [[cal.1963-11-22.assassination]]. Names: Jonsson (K–J Cong. III.F).'
      tags:
      - state:tx
      - city:dallas
      - name:cabell-earle
      - name:alger-bruce-r
      - name:jonsson-j-erik
- add:
    entry:
      id: cal.1964-03-02.legislatures-tx
      when: Mar. 2
      date: '1964-03-02'
      thread: legislatures
      also:
      - court
      c: '*Martin v. Bush*, [376 U.S. 222](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376222/usrep376222.pdf): the judgment voiding Texas''s congressional districts affirmed on the authority of *Wesberry*, the State free to apply to the district court by Apr. 1 for further relief.'
      n: 'Opinion. See [[cal.1963-10-19.legislatures-tx]]; [[cal.1964-02-17.court]]. Names: Bush (Opp. III.D).'
      tags:
      - state:tx
      - name:bush-george-h-w
- add:
    entry:
      id: cal.1964-05-02.governors-tx
      when: May 2
      date: '1964-05-02'
      thread: governors
      also:
      - elections-1964
      c: 'Texas primaries. Democratic, for governor: Connally 69.1 percent, Don Yarborough 28.9. For Senator: Senator Yarborough 57.4, Gordon McLendon, a radio broadcaster, 42.6. Republican, for Senator: George Bush 44.1, Jack Cox 31.9; runoff.'
      n: '[Wikipedia, "1964 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1964_Texas_gubernatorial_election) and [Wikipedia, "1964 United States Senate election in Texas"](https://en.wikipedia.org/wiki/1964_United_States_Senate_election_in_Texas), from the *Texas Almanac* and Our Campaigns; Check: the parties'' canvasses. [[w.cox-ralph-w-yarborough-the]]; [[w.reston-lone-star]]; [[w.knaggs-two-party-texas]]; [[w.krochmal-blue-texas]]. See [[cal.1964-05-02.elections-1964]]. Names: Connally, Don Yarborough, Cox (K–J Cong. III.F); Ralph Yarborough (K–J Cong. III.B); Bush (Opp. III.D).'
      tags:
      - state:tx
      - name:connally-john
      - name:yarborough-don
      - name:yarborough-ralph
      - name:mclendon-gordon
      - name:bush-george-h-w
      - name:cox-jack
- add:
    entry:
      id: cal.1964-06-06.elections-1964-tx
      when: June 6
      date: '1964-06-06'
      thread: elections-1964
      c: 'Texas Republican runoff for Senator: George Bush 49,751, 62.1 percent; Jack Cox 30,333.'
      n: '[Wikipedia, "1964 United States Senate election in Texas"](https://en.wikipedia.org/wiki/1964_United_States_Senate_election_in_Texas). See [[cal.1964-05-02.governors-tx]]. Names: Bush (Opp. III.D); Cox (K–J Cong. III.F).'
      tags:
      - state:tx
      - name:bush-george-h-w
      - name:cox-jack
- add:
    entry:
      id: cal.1964-11-03.state-constitutions-tx
      when: Nov. 3
      date: '1964-11-03'
      thread: state-constitutions
      also:
      - welfare
      - health
      c: Texas adopts three amendments. Vendor payments for medical care of the needy aged not on old-age assistance, with federal funds, State funds not to exceed what the federal match covers, 1,049,995 to 426,866. The transfer of up to 1 percent a year from the permanent to the available school fund ended; terms for laws on conservation districts.
      n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 3, 1964](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1964-11-03). [[w.david-with-dignity]]; [[w.may-texas-state-constitution]]. See [[cal.1963-11-09.state-constitutions-tx]].'
      tags:
      - state:tx
- add:
    entry:
      id: cal.1965-01-11.legislatures-tx
      when: Jan. 11
      date: '1965-01-11'
      thread: legislatures
      c: A three-judge court holds the Texas Constitution's apportionment of both houses, and the statutes under it, void under the equal protection clause, on the suit of William Kilgarlin and others, filed July 15, 1963. The Legislature given until Aug. 2.
      n: '*Kilgarlin v. Martin*, [252 F. Supp. 404](https://static.case.law/f-supp/252/html/0404-01.html) (S.D. Tex. 1966), recites the summary judgment of Jan. 11, 1965 (Tex. Const. art. III, §§ 25, 26a). [[w.davidson-race-and-class-in]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]. Names: Kilgarlin (K–J Cong. III.K).'
      tags:
      - state:tx
      - name:kilgarlin-william-w
- add:
    entry:
      id: cal.1965-09-07.state-constitutions-tx
      when: Sept. 7
      date: '1965-09-07'
      thread: state-constitutions
      also:
      - legislatures
      c: Texas refuses an amendment to enlarge the Senate from 31 to 39, apportion it by population and drop the limit of one Senator a county, 85,951 to 136,461.
      n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Sept. 7, 1965](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1965-09-07). See [[cal.1965-01-11.legislatures-tx]].'
      tags:
      - state:tx
- add:
    entry:
      id: cal.1965-11-02.state-constitutions-tx
      when: Nov. 2
      date: '1965-11-02'
      thread: state-constitutions
      also:
      - welfare
      - health
      c: 'Texas votes on ten amendments. Adopted: assistance and medical care for the needy aged, disabled, blind and children, the State to join the federal programs and accept their funds, 347,218 to 148,097; student loans, the Texas Opportunity Plan; retirement of district and appellate judges and a Judicial Qualifications Commission; teacher retirement; building at State colleges. Refused: four-year terms for the governor and other State officers, 225,987 to 277,892, and for State representatives, 141,184 to 343,236; legislators'' pay; the Veterans'' Land Fund; a tax exemption for charity hospitals.'
      n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 2, 1965](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1965-11-02). [[w.david-with-dignity]]; [[w.may-texas-state-constitution]]. See [[cal.1964-11-03.state-constitutions-tx]]; [[cal.1965-07-30.medicare]].'
      tags:
      - state:tx
- add:
    entry:
      id: cal.1966-01-05.legislatures-tx
      when: Jan. 5
      date: '1966-01-05'
      thread: legislatures
      c: 'The three-judge court upholds Texas''s 1965 congressional districting act, H.B. 67, as a good-faith effort: districts up to 9.7 percent above and below the ideal of 416,508. Jurisdiction kept.'
      n: '*Bush v. Martin*, [251 F. Supp. 484](https://static.case.law/f-supp/251/html/0484-01.html) (S.D. Tex. 1966); Brown for the court. See [[cal.1964-03-02.legislatures-tx]]. Names: Brown (K–J Cong. III.K); Bush (Opp. III.D).'
      tags:
      - state:tx
      - name:brown-john-r
      - name:bush-george-h-w
- add:
    entry:
      id: cal.1966-02-02.legislatures-tx
      when: Feb. 2
      date: '1966-02-02'
      thread: legislatures
      c: The three-judge court upholds the Legislature's 1965 House apportionment, H.B. 195, a mix of single-member, multimember and flotorial districts, save its eleven flotorial districts, to be equalized by Aug. 1, 1967. Kilgarlin's plan of single-member districts refused, and the claim that the multimember districts cancel the votes of racial and political groups.
      n: '*Kilgarlin v. Martin*, [252 F. Supp. 404](https://static.case.law/f-supp/252/html/0404-01.html) (S.D. Tex. 1966). See [[cal.1965-01-11.legislatures-tx]]. Names: Kilgarlin (K–J Cong. III.K).'
      tags:
      - state:tx
      - name:kilgarlin-william-w
- add:
    entry:
      id: cal.1966-02-09.voting-rights-tx
      when: Feb. 9
      date: '1966-02-09'
      thread: voting-rights
      also:
      - court
      c: Austin. A three-judge court holds the Texas poll tax, $1.75, void as a condition of voting under the due process clause, on the Attorney General's suit under § 10 of the Voting Rights Act. No violation of equal protection or of the Fifteenth Amendment found. Thornberry for the court.
      n: '*United States v. Texas*, [252 F. Supp. 234](https://static.case.law/f-supp/252/html/0234-01.html) (W.D. Tex. 1966). [[w.lawson-black-ballots]]; [[w.davidson-race-and-class-in]]. See [[cal.1965-08-06.voting-rights]]; [[cal.1963-11-09.state-constitutions-tx]].'
      tags:
      - state:tx
      - name:thornberry-william-h
- add:
    entry:
      id: cal.1966-02-14.voting-rights-tx
      when: Feb. 14–23
      date: '1966-02-14'
      thread: voting-rights
      c: 'Texas Legislature in special session at Connally''s call, on one subject: registration of voters for the 1966 elections, should the poll tax be finally held void, and in its place thereafter. Check the act.'
      n: 'Tex. Legis. Ref. Library, [59th Legislature, first called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=59-1) (the proclamation of Feb. 10). See [[cal.1966-02-09.voting-rights-tx]]. Names: Connally (K–J Cong. III.F).'
      tags:
      - state:tx
      - name:connally-john
- add:
    entry:
      id: cal.1966-05-07.governors-tx
      when: May 7
      date: '1966-05-07'
      thread: governors
      also:
      - elections-1966
      c: Texas Democratic primary. Governor Connally renominated for a third term, 74.3 percent, over Stanley Woods, 23.2.
      n: '[Wikipedia, "1966 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1966_Texas_gubernatorial_election), from the *Texas Almanac*; Check: the party''s canvass. [[w.reston-lone-star]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1964-05-02.governors-tx]]. Names: Connally, Woods (K–J Cong. III.F).'
      tags:
      - state:tx
      - name:connally-john
      - name:woods-stanley-c
- add:
    entry:
      id: cal.1966-07-04.jobs-and-wages-tx
      when: July 4–Sept. 5
      date: '1966-07-04'
      thread: jobs-and-wages
      also:
      - states-and-cities
      c: Texas farm workers' march. Melon pickers on strike in Starr County since June 1, for $1.25 an hour, march from Rio Grande City, Tex., to Austin. Connally meets them at New Braunfels, Tex., in August. A Labor Day rally at the Capitol, Sept. 5.
