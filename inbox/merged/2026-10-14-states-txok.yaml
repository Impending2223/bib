      c: Oklahoma. By referendum petition, the voters reject the Legislature's congressional districting act, H.B. 669, 162,446 to 386,269.
      n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 70](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=70). [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1964-02-17.court]].'
