      when: May 24
      date: '1966-05-24'
      thread: state-constitutions
      also:
      - legislatures
      c: 'Oklahoma, with the runoffs, adopts two amendments: annual sessions of the Legislature, ninety legislative days each, 208,894 to 199,240; area vocational school districts with a five-mill levy, 214,698 to 206,458.'
      n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 65](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=65). See [[cal.1966-05-03.state-constitutions-ok]].'
