      id: cal.1960-05-07.governors-tx
      when: May 7
      date: '1960-05-07'
      thread: governors
      also:
      - elections-1960
      c: Texas Democratic primary. Governor Daniel renominated for a third term over Jack Cox, a former State representative, 59.5 percent to 40.5.
      n: '[Wikipedia, "1960 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1960_Texas_gubernatorial_election), from the *Texas Almanac*; Check: the State Democratic Executive Committee''s canvass (Texas State Library and Archives). [[w.knaggs-two-party-texas]]; [[w.davidson-race-and-class-in]]; [[w.cunningham-cowboy-conservatism]]. Names: Daniel, Cox (K–J Cong. III.F).'
      tags:
      - state:tx
      - name:daniel-price
      - name:cox-jack
- add:
    entry:
      id: cal.1960-08-03.desegregation-schools-houston
      when: Aug. 3
      date: '1960-08-03'
      thread: desegregation-schools
      c: 'Houston. Judge Ben C. Connally finds the school board''s plan "a subterfuge designed only to accomplish further evasion and delay" and orders his own: desegregation a grade a year, from the first grade in September 1960, complete in 1972. Aug. 12, the plan set out grade by grade.'
      n: '*Ross v. Dyer*, [312 F.2d 191](https://static.case.law/f2d/312/html/0191-01.html), 192 (5th Cir. 1962), recites the orders of Apr. 8, Aug. 3 and Aug. 12, 1960. [[w.kellar-make-haste-slowly]]; [[w.feagin-free-enterprise-city]]. Names: Ben C. Connally (K–J Cong. III.K).'
      tags:
      - state:tx
      - city:houston
      - name:connally-ben-c
- add:
    entry:
      id: cal.1960-11-08.state-constitutions-tx
      when: Nov. 8
      date: '1960-11-08'
      thread: state-constitutions
      c: Texas adopts four amendments. Legislators' pay up to $4,800 a year and $12 a day for the first 120 days of a session, regular sessions limited to 140 days, 763,531 to 604,087. The Legislature to regulate lenders and interest, 10 percent the ceiling where it sets none, 1,088,993 to 369,132. A hospital district; Veterans' Land Board bonds at up to 3.5 percent.
      n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 8, 1960](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1960-11-08). [[w.may-texas-state-constitution]].'
      tags:
      - state:tx
- add:
    entry:
      id: cal.1961-03-21.states-and-cities-el-paso
      when: Mar. 21
      date: '1961-03-21'
      thread: states-and-cities
      c: El Paso. Kennedy nominates Raymond Telles, mayor since 1957, ambassador to Costa Rica. Confirmed Apr. 6; at his post May 22.
      n: '[Office of the Historian, "Raymond L. Telles Jr."](https://history.state.gov/departmenthistory/people/telles-raymond-l) (POCOM). [[w.garcia-making-of-a-mexican]]; [[w.garcia-viva-kennedy]].'
      tags:
      - state:tx
      - city:el-paso
      - name:telles-raymond-jr
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-08-08.state-and-city-finance-tx
      when: Aug. 8
      date: '1961-08-08'
      thread: state-and-city-finance
      c: Texas Legislature, on the first called session's last day, passes a $354 million tax bill, nearly $320 million of it from a 2 percent sales tax, the State's first general sales tax. Senate 23–8. Governor Daniel lets it become law without his signature and calls a second session, Aug. 10, for teachers' pay.
      n: 'Tex. Legis. Ref. Library, [57th Legislature, first called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-1) (July 10–Aug. 8, 1961), and [second called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-2) (Aug. 10–14). "The Making of a Sales Tax," [*Texas Observer*, Aug. 12, 1961, p. 1](https://issues.texasobserver.org/pdf/ustxtxb_obs_1961_08_12_issue.pdf). Check: the act''s chapter in the session laws. [[w.cunningham-cowboy-conservatism]]; [[w.davidson-race-and-class-in]]. Names: Daniel (K–J Cong. III.F).'
      tags:
      - state:tx
      - name:daniel-price
- add:
    entry:
      id: cal.1961-09-06.desegregation-schools-dallas
      when: Sept. 6
      date: '1961-09-06'
      thread: desegregation-schools
      c: Dallas. Eighteen Black children enter first grade in formerly white schools, under the school board's stair-step plan, a grade a year, ordered by the Fifth Circuit. The NAACP protests the district's procedures for their entry.
      n: 'Southern Methodist University, Underwood Law Library, ["Desegregating Dallas Schools: Background"](https://web.archive.org/web/20080101052239/http://library.law.smu.edu/disd/background.shtm) (archived). Check: the order and the count. [[w.linden-desegregating-schools-in-dallas]]; [[w.phillips-white-metropolis]]; [[w.payne-big-d]]. See [[cal.1960-08-03.desegregation-schools-houston]].'
      tags:
      - state:tx
      - city:dallas
- add:
    entry:
