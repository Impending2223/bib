    entry:
      id: cal.1962-06-02.governors-tx
      when: June 2
      date: '1962-06-02'
      thread: governors
      also:
      - elections-1962
      c: 'Texas Democratic runoff for governor: Connally 565,174, 51.2 percent; Don Yarborough 538,924.'
      n: '[Wikipedia, "1962 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1962_Texas_gubernatorial_election). See [[cal.1962-05-05.governors-tx]]. Names: Connally, Don Yarborough (K–J Cong. III.F).'
