      when: Mar. 29
      date: '1968-03-29'
      thread: elections-1968-johnson
      c: New York City. Albert helps Representative John Murphy's campaign; the professionals tell him Johnson would finish third in New York. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 302 ("The next day"). Names: Albert, Murphy, Johnson.'
