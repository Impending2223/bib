      date: '1968-03-28'
      thread: elections-1968-johnson
      c: South Carolina Democratic convention. Albert, before a quiet crowd, speaks for the party. Afterward the state chairman tells him Johnson could not carry one of the State's six congressional districts in a Democratic primary; McCarthy or Robert Kennedy would take all six. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 302. Names: Albert, Johnson, McCarthy, Kennedy.'
