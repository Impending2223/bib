      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: Johnson telephones Albert, hours before his television address, to tell him personally that he is withdrawing from the race. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 302 (the call; the page, after it: Johnson leaves Albert "one last mighty responsibility," the chairmanship of the convention, no day given). See [[cal.1968-03-31.elections-1968-3]]. Names: Johnson, Albert.'
