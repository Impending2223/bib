    entry:
      id: cal.1968-08-26.elections-1968-chicago-27
      when: Aug. 26–29
      date: '1968-08-26'
      thread: elections-1968-chicago
      c: 'Chicago. Albert, on his election as permanent chairman of the convention: "Our actions here will be viewed around the world. We will be judged by our decorum. We can make this convention a showcase of democracy or a shambles of discord. We might even make it lively and spirited." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 303–04. Check: the day: the work gives none. See [[cal.1968-08-26.elections-1968]]. Names: Albert.'
      tags:
      - name:albert-carl
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-platform-3
      when: Aug. 26–28
      date: '1968-08-26'
      thread: elections-1968-chicago-platform
      c: Chicago. Albert has the convention's rules amended to give two full hours, not the thirty minutes customary for a minority plank, to debate the Vietnam plank. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 304–05. Check: the day: the work gives none, only "Our second day was given over completely to the platform and debate on it." See [[cal.1968-08-26.elections-1968]]. Names: Albert.'
      tags:
      - name:albert-carl
      - state:il
      - city:chicago
