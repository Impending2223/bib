patch: 2026-11-12-b11-albert
by: Claude (batch 11 reader, Albert, Little Giant)
ops:
- add:
    entry:
      id: cal.1960-12-31.rules
      when: Dec. 31
      date: '1960-12-31'
      thread: rules
      c: 'The Speaker''s office, a Saturday. Rayburn with McCormack, Bolling, Deschler, a few Texas congressmen and Albert weighs the Rules Committee: a restored twenty-one-day rule, three added members, or Colmer''s removal for campaigning in Mississippi against the party''s presidential ticket. Rayburn tells them Smith has refused the enlargement. He keeps his own mind to himself. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 238–39 (the day, "a Saturday, the last day of 1960"; those present; the three courses; Smith''s refusal, reported; Rayburn''s silence). See [[cal.1960-12-31.rules-2]]. Names: Rayburn, McCormack, Bolling, Colmer, Smith, Albert.'
      tags:
      - name:rayburn-sam
      - name:mccormack-john-w
      - name:bolling-richard
      - name:colmer-william-m
      - name:smith-howard-w
      - name:albert-carl
      - state:ms
- add:
    entry:
      id: cal.1960-12-31.rules-2
      when: Dec. 31
      date: '1960-12-31'
      thread: rules
      c: Morning. Rayburn offers Smith the enlargement of the Rules Committee by three members, one Republican and two Democrats. Smith will have none of it. By Albert's account, from Rayburn's report that afternoon.
      n: '[[w.albert-little-giant-1990]], 238 ("just that morning"). Names: Rayburn, Smith, Albert.'
      tags:
      - name:rayburn-sam
      - name:smith-howard-w
      - name:albert-carl
- add:
    entry:
      id: cal.1961-01-02.rules
      when: Jan. 2
      date: '1961-01-02'
      thread: rules
      c: 'Rayburn to a group of liberal Democrats: no restored twenty-one-day rule, and Smith has refused to enlarge the committee. He will recommend that the Democratic caucus remove Colmer and seat a loyal Democrat. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 240 ("On January 2, 1961"). See [[cal.1960-12-31.rules]]. Names: Rayburn, Smith, Colmer, Albert.'
      tags:
      - name:rayburn-sam
      - name:smith-howard-w
      - name:colmer-william-m
      - name:albert-carl
- add:
    entry:
      id: cal.1961-01.rules-3
      when: Jan.
      date: 1961-01
      thread: rules
      c: Smith, to head off the enlargement, offers to release five bills the President-elect has called critical. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 240. Check: the day: the work gives none; after the word of Colmer''s purge ([[cal.1961-01-02.rules]]), while Kennedy is President-elect. Names: Smith, Kennedy, Albert.'
      tags:
      - name:smith-howard-w
      - name:kennedy-john-f
      - name:albert-carl
- add:
    entry:
      id: cal.1961-01.rules-4
      when: Jan.
      date: 1961-01
      thread: rules
      c: 'Vinson''s offer to Rayburn, the one compromise he would accept: drop the purge of Colmer, and Vinson will get enough southern Democratic votes to add three members to the Rules Committee. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 240–41. Check: the day: the work gives none; after the word of Colmer''s purge ([[cal.1961-01-02.rules]]). Names: Vinson, Rayburn, Colmer, Albert.'
      tags:
      - name:vinson-carl
      - name:rayburn-sam
      - name:colmer-william-m
      - name:albert-carl
- add:
    entry:
      id: cal.1961-01.rules-5
      when: Jan.
      date: 1961-01
      thread: rules
      c: 'Kennedy, Rayburn present and uncomfortable, telephones Cooley, dean of North Carolina''s delegation: the administration has named three North Carolinians, Hodges, Murphy and Webb, to high posts; the State could give him more help on the Rules Committee. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 242 (the call; in the end one North Carolina vote, Bonner''s, pledged to Rayburn before it). Check: the day: the work gives none; Kennedy President, before the vote of Jan. 31. Names: Kennedy, Rayburn, Cooley, Hodges, Murphy, Webb, Albert.'
      tags:
      - name:kennedy-john-f
      - name:rayburn-sam
      - name:cooley-harold-d
      - name:hodges-luther-h
      - name:murphy-charles-s
      - name:webb-james-e
      - name:albert-carl
      - state:nc
- add:
    entry:
      id: cal.1961-06-12.congress
      when: June 12
      date: '1961-06-12'
      thread: congress
      c: House honors Rayburn on his sixteenth year and 273rd day as Speaker, more than twice as long as any other Speaker, Albert says. Rayburn speaks of his love of the House and his gratitude to his district. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 251. Names: Rayburn, Albert.'
      tags:
      - name:rayburn-sam
      - name:albert-carl
- add:
    entry:
      id: cal.1961-10-29.elections-1962-3
      when: Oct. 29
      date: '1961-10-29'
      thread: elections-1962
      c: Big Cedar, Okla., near Kerr's ranch. Kennedy opens a highway; in his speech he praises Albert's work for his program, which some of the press read as a plug for Albert as the next majority leader. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 248–49 ("That fall"; the caption, p. 249, has 1961). Check: the day: the work has only "that fall"; the same trip as Fort Smith and the night at Kerr''s ranch, Oct. 29 ([[cal.1961-10-29.elections-1962]]; [[cal.1961-10-29.elections-1962-2]]). To check: Remarks at Big Cedar, Oklahoma, on the Opening of the Ouachita National Forest Road (Oct. 29, 1961), [APP](https://www.presidency.ucsb.edu/documents/remarks-big-cedar-oklahoma-the-opening-the-ouachita-national-forest-road). Names: Kennedy, Albert, Kerr.'
      tags:
      - name:kennedy-john-f
      - name:albert-carl
      - name:kerr-robert-s
      - state:ok
- add:
    entry:
      id: cal.1961-10-29.medicare
      when: Oct. 29
      date: '1961-10-29'
      thread: medicare
      c: 'Kerr''s ranch, among his Angus. Kennedy and Kerr talk about Medicare, to no resolution: Kennedy wants it; Kerr does not. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 268. Check: the day: the work puts it at Kerr''s ranch on the Big Cedar visit ([[cal.1961-10-29.elections-1962-3]]). Names: Kennedy, Kerr, Albert.'
      tags:
      - name:kennedy-john-f
      - name:kerr-robert-s
      - name:albert-carl
      - state:ok
- add:
    entry:
      id: cal.1961-10-29.medicare-2
      when: Oct. 29–30
      date: '1961-10-29'
      thread: medicare
      c: 'Kerr''s ranch, as the President and his party leave. Kerr to Albert, of Kennedy and Medicare: "He thinks he can beat me on this, but I''m gonna beat him." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 268. Check: the day: the work has Kennedy spend the night at the ranch after Big Cedar and gives no day for his leaving. See [[cal.1961-10-29.medicare]]. Names: Kerr, Kennedy, Albert.'
      tags:
      - name:kerr-robert-s
      - name:kennedy-john-f
      - name:albert-carl
      - state:ok
- add:
    entry:
      id: cal.1961-11-19.congress
      when: Nov. 19
      date: '1961-11-19'
      thread: congress
      c: Bolling announces that he is running for majority leader. Albert, at McAlester, Okla., since Rayburn's funeral, hears it from his administrative assistant, Charles Ward, by telephone, and confirms it on national radio. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 254 ("On Sunday," after the funeral "on a Saturday"; Rayburn died Nov. 16, p. 251). See [[cal.1961-11-16.congress]]. Names: Bolling, Rayburn, Albert.'
      tags:
      - name:bolling-richard
      - name:rayburn-sam
      - name:albert-carl
      - state:ok
- add:
    entry:
      id: cal.1961-11.congress-5
      when: Nov., after the 19th
      date: 1961-11
      thread: congress
      c: 'McAlester, Okla. Albert announces for majority leader, by a call to the AP''s congressional correspondent and by telegram to 269 people, "a few friends and the entire Democratic membership of Congress": "I take this means of advising that I am making the race for majority leader of the House subject to the action of the Democratic caucus. I will greatly appreciate your support and help. I would like to talk to you about the matter at your convenience." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 254–55 (the telegram read off the page image, 255; the AP''s Bill Arbogast). Check: the day: the work gives none; after Bolling''s announcement on the Sunday ([[cal.1961-11-19.congress]]), once Albert had heard it on the radio and read it in the McAlester paper; he had meant to announce on the Wednesday. Names: Albert.'
      tags:
      - name:albert-carl
      - state:ok
- add:
    entry:
      id: cal.1961-11.congress
      when: Nov., after the 19th
      date: 1961-11
      thread: congress
      c: 'McAlester, Okla. Kerr, asked by telephone what help Albert needs, is told: phones. Within the hour three telephone workers install a bank of them in Albert''s offices in the Federal Building; he works them for four days. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 255. Check: the day: the work gives none; the day of the telegram, as Albert begins his calls ([[cal.1961-11.congress-5]]). Names: Kerr, Albert.'
      tags:
      - name:kerr-robert-s
      - name:albert-carl
      - state:ok
- add:
    entry:
      id: cal.1961-11.congress-2
      when: Nov., after the 19th
      date: 1961-11
      thread: congress
      c: 'Fogarty of Rhode Island to Albert, by telephone: Kirwan has called him, and the two will go all out for Albert. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 255 (the work spells him "Fogerty"). Check: the day: the work gives none; one of the first calls on the telegram ([[cal.1961-11.congress-5]]). Names: Fogarty, Albert.'
      tags:
      - name:fogarty-john-e
      - name:albert-carl
      - state:ri
- add:
    entry:
      id: cal.1961-11.congress-3
      when: Nov., after the 19th
      date: 1961-11
      thread: congress
      c: 'Powell to Albert, by telephone: "I''m for you a 100 percent," and he is issuing a statement to the press. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 255–56. Check: the day: the work gives none; the call after Fogarty''s ([[cal.1961-11.congress-2]]). Names: Powell, Albert.'
      tags:
      - name:powell-adam-clayton-jr
      - name:albert-carl
- add:
    entry:
      id: cal.1961-11.congress-4
      when: Nov., after the 19th
      date: 1961-11
      thread: congress
      c: 'Smith to Albert, by telephone: he backs him and will work with the southerners for him. Albert tells him Powell has just called and will put out a release for him: "I wouldn''t want you to be embarrassed." Smith: "Don''t worry, Carl, I figure a guy''s got to get a vote anywhere he can get it, and you still have mine." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 256. Check: the day: the work gives none; the call after Powell''s ([[cal.1961-11.congress-3]]). Names: Smith, Powell, Albert.'
      tags:
      - name:smith-howard-w
      - name:powell-adam-clayton-jr
      - name:albert-carl
- add:
    entry:
      id: cal.1962-01-03.congress
      when: Jan. 3
      date: '1962-01-03'
      thread: congress
      c: 'Bolling to the press: "I am withdrawing from the race for leadership of the House. Developments of the last few days have convinced me that I don''t have a chance to win." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 257 ("a week before the 1962 Congress convened"). Names: Bolling, Albert.'
      tags:
      - name:bolling-richard
      - name:albert-carl
- add:
    entry:
      id: cal.1962-01.congress
      when: Jan.
      date: 1962-01
      thread: congress
      c: House Democratic caucus names its leadership slate. McCormack and Albert draw no opponent; Bolling moves that Albert's selection be unanimous. Albert says he is the first majority leader of the century to win his party's first caucus election without opposition. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 257. Check: the day: the work gives none; after Bolling''s withdrawal ([[cal.1962-01-03.congress]]) and before the session opened Jan. 10. Names: McCormack, Albert, Bolling.'
      tags:
      - name:mccormack-john-w
      - name:albert-carl
      - name:bolling-richard
- add:
    entry:
      id: cal.1962-09-20.farm
      when: Sept. 20
      date: '1962-09-20'
      thread: farm
      c: 'House adopts the conference report on the farm bill, supply management for wheat alone, 202–197, after the margin against had reached twenty-one. Albert and Boggs work the members coming in; Albert sends members into the well to ask, "Mr. Speaker, how am I recorded?" Halleck''s point of order: members are asking how they are recorded "for obvious purposes of delay." McCormack overrules: "The Chair cannot look into the minds of members and determine their motives." Three switches decide it. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 272–73 ("It came on September 20"). See [[cal.1962-06-21.program]]. Names: Albert, Boggs, Halleck, McCormack.'
      tags:
      - name:albert-carl
      - name:boggs-hale
      - name:halleck-charles-a
      - name:mccormack-john-w
- add:
    entry:
      id: cal.1963-11-21.congress-2
      when: Nov. 21
      date: '1963-11-21'
      thread: congress
      c: 'The Oval Office, after the leaders'' meeting in the Cabinet Room. Kennedy keeps Albert for a legislative matter; his helicopter lands near the Rose Garden, he watches it, says good-bye and leaves for Andrews and Texas. Albert: "I was the last person to visit with him in the White House." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 280–81. See [[cal.1963-11-21.trade]]. Names: Kennedy, Albert.'
      tags:
      - name:kennedy-john-f
      - name:albert-carl
- add:
    entry:
      id: cal.1963-11-22.succession-30
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Sorensen telephones Albert at his office: the President is dead. Albert had heard of the shooting at lunch in the Congressional Hotel from Lydia Vacin, a House Agriculture Committee secretary. He says he railed against "the madness of the assassination" and said "over and over that he never should have gone." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 281. Names: Sorensen, Albert.'
      tags:
      - name:sorensen-theodore-c
      - name:albert-carl
- add:
    entry:
      id: cal.1963-12-23.foreign-aid-4
      when: Dec. 23
      date: '1963-12-23'
      thread: foreign-aid
      c: 'The Oval Office, the night. Johnson, McCormack and Albert telephone for one more vote to make a quorum of the Rules Committee to send the aid conference report to the floor; most members cannot be found. About 2 a.m. Albert reaches Colmer at a Mississippi hospital, where his wife is ill: "Bill, we need you, your party needs you, and President Johnson needs you. We all need you to give us a quorum." Colmer flies through a blizzard to Washington. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 283. See [[cal.1963-12-23.foreign-aid]]. Names: Johnson, McCormack, Albert, Colmer.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:albert-carl
      - name:colmer-william-m
      - state:ms
- add:
    entry:
      id: cal.1963-12-24.foreign-aid-2
      when: Dec. 24
      date: '1963-12-24'
      thread: foreign-aid
      c: 7 a.m. Colmer, in from Mississippi, votes not to discharge the aid bill, but his presence gives the Rules Committee its quorum, and the bill goes to the House. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 283. Check: the hour: Albert has Colmer''s vote at 7 a.m., the hour the House met ([[cal.1963-12-24.foreign-aid]]). See [[cal.1963-12-23.foreign-aid-4]]. Names: Colmer, Albert.'
      tags:
      - name:colmer-william-m
      - name:albert-carl
      - state:ms
- cite:
    id: cal.1961-01-25.press-and-broadcasting
    item: '[[w.albert-little-giant-1990]], 241 (at his first press conference Kennedy hopes Rayburn will prevail on the Rules Committee: "the responsibility rests with the members of the House. . . . I merely give my view as an interested citizen"; not the broadcast, the place or the rest)'
    units: '?'
- cite:
    id: cal.1961-01-31.rules
    item: '[[w.albert-little-giant-1990]], 240–43 (the House vote, 217 to 212, Rayburn announcing it, for a fifteen-member Rules Committee against twelve, p. 240; not Rayburn''s "last" fight or the veto; the page prints the day "December 31, 1961," a slip for Jan. 31)'
    units: A
- cite:
    id: cal.1961-03-24.program
    item: '[[w.albert-little-giant-1990]], 247–48 (Albert leads the debate for the leadership''s version of the bill; "we lost to Kitchin-Ayres, 186 to 185," not the roll call on the substitute, 216–203, or any roll call of the day; restored in conference; not the passage, the day or "first")'
    units: C
- cite:
    id: cal.1961-07-18.school-aid
    item: '[[w.albert-little-giant-1990]], 245–46 (Delaney, a Catholic Democrat, the eighth and deciding vote; the Rules Committee votes not to report the school bill, eight to seven; Albert, Ribicoff and Kennedy had pressed him; the page has "July" for the bill''s arrival, not the day)'
    units: B
- cite:
    id: cal.1961-11-16.congress
    item: '[[w.albert-little-giant-1990]], 251–52 (Rayburn dies at Bonham, early on Nov. 16, 1961; Truman, Eisenhower, Kennedy and Johnson at the funeral)'
    units: A, B
- cite:
    id: cal.1962-01-10.congress
    item: '[[w.albert-little-giant-1990]], 257–58 (the second session opens a week after Jan. 3; the House elects McCormack Speaker on party lines, 248 to 166; Albert''s selection as majority leader announced; Albert and McCormack name Boggs whip, Albert announcing it)'
    units: A, B, C, D
- cite:
    id: cal.1962-06-21.program
    item: '[[w.albert-little-giant-1990]], 272 (the House votes the farm bill down, 215 to 205, June 21; Albert, with four members ready to switch, spares them; not the "mandatory" controls: the page has supply management for milk and feed grains, wheat and corn)'
    units: '?'
- cite:
    id: cal.1962-06-28.trade
    item: '[[w.albert-little-giant-1990]], 267–68 (the trade expansion bill: Albert''s "key vote, 253 to 171," not the passage count of 298–125 or the day; the bill law by the end of 1962, p. 271)'
    units: '?'
- cite:
    id: cal.1962-07-17.medicare
    item: '[[w.albert-little-giant-1990]], 269 (Kerr keeps Medicare out of the Senate welfare bill, fifty-two to forty-eight; not the Anderson–Javits amendment, the tabling or the day)'
    units: '?'
- cite:
    id: cal.1962-09-26.missile-crisis
    item: '[[w.albert-little-giant-1990]], 264 (the Cuba resolution passed in September, authorizing action to prevent the export of Castro''s revolution; not the day or the count)'
    units: '?'
- cite:
    id: cal.1962-10-05.berlin-and-vienna
    item: '[[w.albert-little-giant-1990]], 264 (the Berlin resolution rushed through in October, "to prevent by whatever means may be necessary, including the force of arms" any Soviet interference with Western rights; not the count or the day)'
    units: '?'
- cite:
    id: cal.1962-10-22.missile-crisis-4
    item: '[[w.albert-little-giant-1990]], 264–65 (a Monday afternoon in October, five o''clock: the leaders of both houses and the committee chairmen told of the missiles and the quarantine; Russell, in Albert''s words, a quarantine too weak a response, invade; Kennedy: an invasion likely would trigger nuclear war; not the photographs, Fulbright, or "too slow and too risky")'
    units: '?'
- cite:
    id: cal.1963-06-11.civil-rights-bill
    item: '[[w.albert-little-giant-1990]], 276 (the address that evening, the day of Wallace''s stand: "a moral issue. It is as old as the Scriptures and is as clear as the American Constitution"; the legislation he would submit; not the hour or the extemporizing)'
    units: B, C
- cite:
    id: cal.1963-09-25.economy
    item: '[[w.albert-little-giant-1990]], 271 (the House passes the tax cut, Sept. 25, 271 to 155; not the party divisions or the rates)'
    units: '?'
- cite:
    id: cal.1963-11-20.civil-rights-bill
    item: '[[w.albert-little-giant-1990]], 279 (Celler submits the bill, Nov. 20, 1963, and prepares a discharge petition; the page does not say Rodino, H.R. 7152 or H. Rept. 914)'
    units: '?'
- cite:
    id: cal.1963-11-21.trade
    item: '[[w.albert-little-giant-1990]], 280 (the morning meeting of the House and Senate Democratic leaders in the Cabinet Room before Kennedy leaves for Texas; not a breakfast, Mundt''s bill or the Senate vote)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-17
    item: '[[w.albert-little-giant-1990]], 281 (Air Force One at Andrews that night; a military guard removes a coffin; Johnson gets out and joins Albert and Johnson''s oldest House friends; not Robert Kennedy or the forklift)'
    units: A
- cite:
    id: cal.1963-11-22.succession-2
    item: '[[w.albert-little-giant-1990]], 281 (that night Albert, with a group of Johnson''s oldest House friends, with Johnson at the Executive Office Building and the White House, little said, an hour or so; not the hour, the others named or his request)'
    units: '?'
- variant:
    id: cal.1963-11-22.succession-3
    unit: A
    witness: w.albert-little-giant-1990
    reads: 'Albert: at Andrews, Johnson "joined us, and we drove over to the Executive Office Building. Through a little side door, we went into the White House"'
    at: '281'
- cite:
    id: cal.1963-12-24.foreign-aid
    item: '[[w.albert-little-giant-1990]], 283 (the House passes the aid bill once Colmer gives the Rules Committee its quorum at 7 a.m.; not the House''s hour, Passman''s amendment, the count or the Senate)'
    units: '?'
- variant:
    id: cal.1963-12-30.congress
    unit: A
    witness: w.albert-little-giant-1990
    reads: 'Albert: the House passed the aid bill "and we voted adjournment on December 29"'
    at: '283'
- add:
    entry:
      id: cal.1964-01-30.civil-rights-bill-2
      when: Jan. 30
      date: '1964-01-30'
      thread: civil-rights-bill
      c: Smith assembles about sixty Southern Democrats to plan strategy, the afternoon of the Rules Committee's vote on the rule. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 286. See [[cal.1964-01-30.civil-rights-bill]]. Names: Smith.'
      tags:
      - name:smith-howard-w
- add:
    entry:
      id: cal.1964-07.democratic-party
      when: July
      date: 1964-07
      thread: democratic-party
      c: 'Albert, on a motor trip to Quebec with his wife and son during the House recess for the Republican convention, tells no one on his staff where he is. Johnson has the FBI, the RCMP and the White House switchboard find him: Albert is to direct the Democratic platform committee, and to start now. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 288. Check: the day: the work gives none; the recess was for the Republican convention in July. Names: Johnson, Albert.'
      tags:
      - name:johnson-lyndon-b
      - name:albert-carl
- add:
    entry:
      id: cal.1964-08-24.elections-1964-atlantic-city
      when: Aug. 24–27
      date: '1964-08-24'
      thread: elections-1964-atlantic-city
      c: 'Atlantic City. Albert on the Republican slogan "In your heart you know he''s right": "In your heart you know he''s right—too far right." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 290. Check: the day: the work gives none; the convention sat Aug. 24–27. Names: Albert.'
      tags:
      - name:albert-carl
      - city:atlantic-city
      - state:nj
- add:
    entry:
      id: cal.1967-07-20.cities-and-housing-2
      when: July 20
      date: '1967-07-20'
      thread: cities-and-housing
      c: 'Albert, that afternoon, to Barefoot Sanders, the President''s legislative assistant, after the rat bill: no new programs should be sent to the House; only the bare essentials could be got, and not always those. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 301. See [[cal.1967-07-20.cities-and-housing]]. Names: Sanders, Albert.'
      tags:
      - name:sanders-h-barefoot-jr
      - name:albert-carl
- add:
    entry:
      id: cal.1968-02.vietnam-congress-4
      when: Feb.
      date: 1968-02
      thread: vietnam-congress
      c: 'Johnson, at a leadership meeting: "nobody says anything about Ho Chi Minh. Ho has a great image. But they call me a murderer." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 302. Check: the day: the work gives only "February 1968"; perhaps the Democratic leaders'' breakfast of Feb. 6, [[cal.1968-02-06.vietnam-tet]]. Names: Johnson, Hồ Chí Minh.'
      tags:
