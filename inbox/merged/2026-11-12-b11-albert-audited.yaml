    item: '[[w.albert-little-giant-1990]], 294–95 (Albert, kept by Johnson after the leaders'' breakfast, in the room for the call: Johnson, "They have?", then "Now, I''ll tell you what I want. I not only want those patrol boats destroyed, I want everything at that harbor destroyed, I want the whole damn works destroyed. I want to give them a real dose," and slams down the receiver; McNamara, that evening, "explained the morning''s phone call": the second attack in two days; not the hour, Sharp, or Rusk and Bundy. By Albert''s account)'
    units: '?'
