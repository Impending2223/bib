patch: amendments-ec-1960-65
by: agent
ops:
  - add:
      entry:
        id: cal.1960-07-02.amendments
        when: July 2
        date: '1960-07-02'
        thread: amendments
        also: [women, congress]
        c: 'Senate takes up the equal rights amendment, S.J. Res. 69, on Johnson''s motion. Hayden''s rider adopted by voice: the article not to impair any rights, benefits or exemptions the law gives women. Then recommitted to Judiciary on Butler''s motion, Hayden agreeing. No roll call.'
        n: '[106 Cong. Rec. 15,678–79, 15,686](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt12/pdf/GPO-CRECB-1960-pt12-2-1.pdf) (1960). [[w.kyvig-explicit-and-authentic-acts]]; [[w.harrison-on-account-of-sex]]. Names: Johnson, Hayden, Butler.'
        tags: [name:johnson-lyndon-b, name:hayden-carl, name:butler-john-m]
  - add:
      entry:
        id: cal.1961-05-23.electoral-college
        when: May 23–25
        date: '1961-05-23'
        thread: electoral-college
        also: [amendments, congress]
        c: 'Senate Judiciary''s Subcommittee on Constitutional Amendments, Kefauver''s, opens hearings on seventeen joint resolutions on federal elections: the nomination and election of the President and Vice President, electoral college reform among them; the voting age, residence and the poll tax; repeal of the Twenty-second Amendment. The sponsors first, May 23–25. Thurmond, June 8, for the district plan, S.J. Res. 12; more hearings June 20–22.'
        n: 'Kefauver''s notice, [107 Cong. Rec. 7770](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt6/pdf/GPO-CRECB-1961-pt6-8-1.pdf) (1961); Thurmond''s testimony, [10,812](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-8-1.pdf). *Nomination and Election of President and Vice President and Qualifications for Voting: Hearings before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 87th Cong. (1961) (Check the title and a digitized copy). [[w.peirce-peoples-president]]; [[w.longley-politics-of-electoral-college]]. See [[cal.1961-01-06.elections-1960]]. Names: Kefauver, Thurmond.'
        tags: [name:kefauver-estes, name:thurmond-strom]
  - add:
      entry:
        id: cal.1961-07-13.electoral-college
        when: July 13
        date: '1961-07-13'
        thread: electoral-college
        also: [elections-1960, congress]
        c: 'Henry D. Irwin of Bartlesville, Okla., the Republican elector who voted for Byrd and Goldwater, before Kefauver''s subcommittee. After the election he had worked for a "coalition plan," the Nixon–Lodge electors to vote for Byrd and Goldwater, with, he thought, the tacit support of the Republican National Committee and most Republican electors. Neither Byrd nor Goldwater had helped him. "I just did my patriotic duty to my country."'
        n: 'Kefauver, [107 Cong. Rec. 13,366](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-6-1.pdf) (1961), with the *Louisville Courier-Journal*, July 17, and the *Washington Post*, July 19, 1961. See [[cal.1961-05-23.electoral-college]]; [[cal.1960-12-19.elections-1960]]. Names: Irwin, Kefauver, Byrd, Goldwater, Nixon, Lodge.'
        tags: [name:irwin-henry-d, name:kefauver-estes, name:byrd-harry-f, name:goldwater-barry-m, name:nixon-richard-m, name:lodge-henry-cabot]
  - add:
      entry:
        id: cal.1961-08-25.amendments
        when: Aug. 25
        date: '1961-08-25'
        thread: amendments
        also: [voting-rights, congress]
        c: 'Kefauver''s subcommittee gives a day to the poll tax amendments, S.J. Res. 58, Holland''s, and S.J. Res. 81. Katzenbach, Assistant Attorney General, for Justice: "The Justice Department supports the proposed amendment as a realistic technique which seeks the early demise of the poll tax." A statute would surely reach the elections of Senators and Representatives, less surely those of electors.'
        n: 'Kefauver''s notice, [107 Cong. Rec. 16,760](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt12/pdf/GPO-CRECB-1961-pt12-9-1.pdf) (1961). Katzenbach''s testimony, pp. 368 and 387–88 of the printed hearings, as Holland read it into [108 Cong. Rec. 4366–67](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt4/pdf/GPO-CRECB-1962-pt4-1-1.pdf) (1962) (Check that he testified this day). [[w.lawson-black-ballots]]; [[w.kyvig-explicit-and-authentic-acts]]. See [[cal.1961-05-23.electoral-college]]; [[cal.1960-02-02.states-and-cities]]. Names: Kefauver, Holland, Katzenbach.'
        tags: [name:kefauver-estes, name:holland-spessard-l, name:katzenbach-nicholas]
  - add:
      entry:
        id: cal.1961-10-04.electoral-college
        when: Oct. 4
        date: '1961-10-04'
        thread: electoral-college
        also: [amendments, states-and-cities]
        c: 'The Twenty-third Amendment put into law: the District of Columbia Election Act amended, signed, [75 Stat. 817](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg817.pdf). The District''s voters to choose its electors. A party whose nominee has won the Presidency since Jan. 1, 1950, names its electors through the organization its national committee recognizes. The candidates'' names on the ballot, not the electors''.'
        n: '[Letter to the President of the Senate and to the Speaker of the House Transmitting Bill Implementing the 23d Amendment to the Constitution](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-transmitting-bill-implementing-0) (May 16, 1961). H.R. 8444, 87th Cong. See [[cal.1961-03-29.states-and-cities]].'
        tags: [name:kennedy-john-f]
  - add:
      entry:
        id: cal.1962-08-02.amendments
        when: Aug. 2
        date: '1962-08-02'
        thread: amendments
        also: [court, congress]
        c: 'Senate Judiciary Committee, Eastland''s, hears witnesses on the amendments to permit prayer in the public schools, one of its two days of hearings after *Engel*. More than fifty such amendments introduced in Congress within three days of the decision, fifty-seven by the session''s end. None reported.'
        n: '*Prayers in Public Schools and Other Matters: Hearings before the Senate Committee on the Judiciary*, 87th Cong. (1962) (Check the other day and a digitized copy); the transcript of Aug. 2 cited by Robertson, [108 Cong. Rec. 17,593–94](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt13/pdf/GPO-CRECB-1962-pt13-6-1.pdf) (1962). [Congressional Research Service, *School Prayer: The Congressional Response, 1962–1998*](https://www.everycrsreport.com/reports/96-846.html) (1998). [[w.dierenfield-battle-over-school-prayer]]. See [[cal.1962-06-25.court]]. Names: Eastland.'
        tags: [name:eastland-james-o]
  - add:
      entry:
        id: cal.1964-04-22.amendments
        when: Apr. 22
        date: '1964-04-22'
        thread: amendments
        also: [court, congress]
        c: 'House Judiciary Committee, Celler''s, opens hearings on the school prayer amendments, before the full committee. Becker for an amendment "designed to guarantee permanently the right to pray and read Holy Scripture in the public schools of our Nation." His discharge petition for H.J. Res. 9 gets 167 of the 218 names it needs. The text agreed on, H.J. Res. 693: nothing in the Constitution to forbid prayers or Scripture in any public school or place, participation voluntary. Eighteen days of hearings, into June. No resolution reported.'
        n: 'Becker''s statement, inserted by Wydler, [110 Cong. Rec. 9414](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt7/pdf/GPO-CRECB-1964-pt7-7-3.pdf) (1964); Becker and Celler''s letter, the hearings to be before the full committee, [3656](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-9-1.pdf). *School Prayers: Hearings before the House Committee on the Judiciary*, 88th Cong., 3 vols. (1964) (Check a digitized copy). [Congressional Research Service, *School Prayer: The Congressional Response, 1962–1998*](https://www.everycrsreport.com/reports/96-846.html) (1998). [[w.dierenfield-battle-over-school-prayer]]. See [[cal.1962-08-02.amendments]]; [[cal.1963-06-17.court]]. Names: Celler, Becker.'
        tags: [name:celler-emanuel, name:becker-frank-j]
  - add:
      entry:
        id: cal.1964-07-22.amendments
        when: July 22
        date: '1964-07-22'
        thread: amendments
        also: [court, legislatures, congress]
        c: 'House Judiciary''s Subcommittee No. 5, Celler''s, opens hearings on amendments to let one house of a State legislature be apportioned on a basis other than population, after *Reynolds v. Sims*. Eight days, to Aug. 13; resumed Apr. 7, 1965.'
        n: 'Celler, [111 Cong. Rec. 3905](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-9-1.pdf) (1965). [[w.dixon-democratic-representation]]; [[w.bonfield-dirksen-amendment-and-the]]. See [[cal.1964-06-15.court]]. Names: Celler.'
        tags: [name:celler-emanuel]
  - add:
      entry:
        id: cal.1964-09-14.amendments
        when: Sept. 14
        date: '1964-09-14'
        thread: amendments
        also: [women, congress]
        c: 'Senate Judiciary reports the equal rights amendment, S.J. Res. 45, without amendment, Bayh filing the report. Passed over at the call of the calendar Sept. 24; no vote.'
        n: 'S. Rep. No. 88-1558, [110 Cong. Rec. 22,025](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-4-2.pdf) (1964); [22,852](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-13-2.pdf). See [[cal.1960-07-02.amendments]]. Names: Bayh.'
        tags: [name:bayh-birch]
  - add:
      entry:
        id: cal.1964-12.amendments
        when: Dec.
        date: '1964-12'
        thread: amendments
        also: [states-and-cities, legislatures]
        c: 'The year''s applications to Congress for a convention: Virginia''s alone, on the apportionment of State legislatures and on Article V. The Council of State Governments'' General Assembly endorses an amendment to let one house of a legislature be apportioned on factors other than population and circulates a model application.'
        n: 'Virginia''s apportionment resolution, [110 Cong. Rec. 5659](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt5/pdf/GPO-CRECB-1964-pt5-1-1.pdf) (1964); both, 111 Cong. Rec. 880–81 (1965), as the Article V Library lists them: [apportionment](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0), [Article V](http://article5library.org/analyze.php?topic=Revision+of+Article+V&res=1&gen=0&ylimit=0). The Council: [Congressional Research Service, *The Article V Convention for Proposing Constitutional Amendments: Historical Perspectives for Congress*](https://www.everycrsreport.com/reports/R42592.html) (2012) (Check the date and place). [[w.bonfield-dirksen-amendment-and-the]]. See [[cal.1963-12.states-and-cities-us]].'
  - add:
      entry:
        id: cal.1965-01-06.electoral-college
        when: Jan. 6
        date: '1965-01-06'
        thread: electoral-college
        also: [elections-1964, congress]
        c: 'Electoral votes counted in joint session, Hayden, President pro tempore, presiding, the Vice Presidency vacant. No objection made. Johnson 486, Goldwater 52; for Vice President, Humphrey 486, Miller 52. The electors had voted Dec. 14.'
        n: '[111 Cong. Rec. 136–37](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-3-1.pdf) (1965). [[w.peirce-peoples-president]]. See [[cal.1964-11-03.elections-1964]]; [[cal.1961-01-06.elections-1960]]. Names: Hayden, Johnson, Goldwater, Humphrey, Miller.'
        tags: [name:hayden-carl, name:johnson-lyndon-b, name:goldwater-barry-m, name:humphrey-hubert-h, name:miller-william-e]
  - add:
      entry:
        id: cal.1965-08-18.amendments
        when: Aug. 18
        date: '1965-08-18'
        thread: amendments
        also: [congress]
        c: 'House Judiciary Committee and its Subcommittee No. 5, Celler''s, open hearings on a four-year term for Representatives: nineteen joint resolutions, H.J. Res. 394 among them. To Mar. 1, 1966, the President''s text added.'
        n: '*Congressional Tenure of Office: Hearings before the House Committee on the Judiciary and Subcommittee No. 5*, 89th Cong. (1965–66) ([HathiTrust](https://babel.hathitrust.org/cgi/pt?id=uc1.$b655183), full view). [Congressional Research Service, *Proposals to Change the House Term of Office to Four Years*](https://www.everycrsreport.com/reports/RS21574.html) (2003). [[w.kyvig-explicit-and-authentic-acts]]. Names: Celler.'
        tags: [name:celler-emanuel]
  - add:
      entry:
        id: cal.1965-12.amendments
        when: Dec.
        date: '1965-12'
        thread: amendments
        also: [states-and-cities, legislatures, electoral-college]
        c: 'The year''s applications to Congress for a convention on the apportionment of State legislatures: twenty-three legislatures, fourteen for the first time, Alabama, Arizona, Florida, Georgia, Kentucky, Louisiana, Maryland, Minnesota, Mississippi, Nebraska, New Hampshire, North Carolina, Tennessee and Utah. Twenty-seven States since 1963; thirty-four needed. On the electoral college, Nebraska and Oklahoma; on tax sharing, Illinois and Ohio.'
        n: 'As the Article V Library lists them: [apportionment](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0), [presidential electors](http://article5library.org/analyze.php?topic=Presidential+electors&res=1&gen=0&ylimit=0), [revenue sharing](http://article5library.org/analyze.php?topic=Revenue+sharing&res=1&gen=0&ylimit=0) (Check each against the Record; Tennessee''s laid before Congress in 1966, 112 Cong. Rec. 199–200; Georgia''s in its session laws only). [[w.bonfield-dirksen-amendment-and-the]]. See [[cal.1964-12.amendments]]; [[cal.1965-08-04.court]]; [[cal.1965-08-02.state-and-city-finance-us]].'
