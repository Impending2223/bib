- add:
    entry:
      id: cal.1966-06.china-leadership-10
      when: June
      date: 1966-06
      thread: china-leadership
      also:
      - china
      c: 'The Capital Work Team oversees the reinforcement of the Peking Garrison: from one division and a regiment to three divisions and a regiment, soon four divisions of six regiments each. Two of the new divisions, the 70th and the 189th, from Hebei, with ties to Yang Chengwu. The garrison commander may call on three neighboring divisions; he answers to the Military Commission, not to the Peking Military Region.'
