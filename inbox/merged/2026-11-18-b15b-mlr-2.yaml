- add:
    entry:
      id: cal.1961.china-leadership-8
      when: '1961'
      date: '1961'
      thread: china-leadership
      also:
      - china
      c: Mao, finding that his flirtations with a female attendant have been taped, is livid. Several of Yang Shangkun's subordinates are blamed, demoted or sent away from the General Office. At Mao's insistence all existing tapes are destroyed, after a team of secretaries under Deng Xiaoping has transcribed part of them.
      n: '[[w.macfarquhar-maos-last-revolution]], 36–37. Made public: 2006. To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 25 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.18); [[w.zilong-ye-zilong-huiyilu]], 225 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.19); Hongying (Red Eagle) (Beijing), Sept. 14, 1967, 2 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.20); [[w.shangkun-yang-shangkun-riji-2]], I, 716 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.21a); [[w.zilong-ye-zilong-huiyilu]], 223–231 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.21b); Su Shaozhi, interview by Michael Schoenhals, April 1992 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.21c); [[w.canyue-cailiao]], X, 18 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.22); [[w.nianyi-da-dongluande-niandai-revised]], 84 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.23); [[w.nianyi-da-dongluande-niandai-revised]], 84 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.24a); [[w.tianfan-difu-kaierkang]], 23 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.24b). Names: Mao Zedong, Deng Xiaoping. Check: the day.'
      tags:
      - polity:prc
