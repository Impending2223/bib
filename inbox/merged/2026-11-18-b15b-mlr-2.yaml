      when: Jan.
      date: 1965-01
      thread: china-leadership
      also:
      - china
      c: Luo Ruiqing edits Lin Biao's instructions on PLA work for circulation, adding that even where necessary there must be no indiscriminate assaults on military training and production. By one biographer's count he alters them in seventy-eight places. The instructions are circulated.
      n: '[[w.macfarquhar-maos-last-revolution]], 21. Made public: 2006. To check: [[w.zhonggong-dangshi-jiaoxue-cankao]], XXIV, 554–557 (cited by [[w.macfarquhar-maos-last-revolution]], 21 n.28); [[w.yao-san-ci-da-nan]], 238–246 (cited by [[w.macfarquhar-maos-last-revolution]], 21 n.29); [[w.jiefangjun-jiangling-zhuan-14]], VII, 258 (cited by [[w.macfarquhar-maos-last-revolution]], 21 n.30). Names: Luo Ruiqing, Lin Biao. Check: the day.'
