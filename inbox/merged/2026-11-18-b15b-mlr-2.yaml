    entry:
      id: cal.1965-11.china-leadership-5
      when: Nov., after the 10th
      date: 1965-11
      thread: china-leadership
      also:
      - china
      at: after 1965-11-10
      c: Peng Zhen forbids the *People's Daily* and the other national, provincial and municipal papers to reprint Yao Wenyuan's article.
      n: '[[w.macfarquhar-maos-last-revolution]], 18. Made public: 2006. To check: [[w.pixian-chen-pixian-huiyilu]], 27–34 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.10); [[w.fangeming-xiuzhengzhuyi-fenzi-fan]], 18 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.11); [[w.qian-wenge-mantan]], item no. 1 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.12); [[w.pixian-chen-pixian-huiyilu]], 34 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.14); Peng Zhen, speech to a conference of cultural bureau chiefs, Sept. 23, 1965, in [[w.zhen-peng-zhen-wenxuan-1941]], 355–357 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.15). See [[cal.1965-11-10.china-leadership]]. Names: Peng Zhen, Yao Wenyuan. Check: the day; MacFarquhar (18 n.13) has Peng able to decide it because Deng Xiaoping, away in the southwest, had left him in charge of the Secretariat and the Propaganda Department.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:yao-wenyuan
      - vis:only:prc
      src:
        c: 57e42b94
        rows:
