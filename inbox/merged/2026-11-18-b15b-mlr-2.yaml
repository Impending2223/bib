        rows:
        - 'w.macfarquhar-maos-last-revolution 7, 12–13: all'
- add:
    entry:
      id: cal.1965.china-leadership
      when: 1965, mid-year
      date: '1965'
      thread: china-leadership
      also:
      - china
      c: 'Lin Biao begins a secret dossier on Luo Ruiqing: his "sinister designs" and his "arrogant and imperious" attitude to giving prominence to politics. A few senior officers, Li Zuopeng, the navy''s political commissar, among them, are ready to testify to Luo''s "erroneous opinions".'
