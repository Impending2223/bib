- add:
    entry:
      id: cal.1960.china-leadership-2
      when: '1960'
      date: '1960'
      thread: china-leadership
      also:
      - china
      c: Formal regulations are put in place, with Mao's approval, on when meetings may be tape-recorded and when not.
      n: '[[w.macfarquhar-maos-last-revolution]], 36. Made public: 2006. To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 25 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.18); [[w.zilong-ye-zilong-huiyilu]], 225 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.19); Hongying (Red Eagle) (Beijing), Sept. 14, 1967, 2 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.20). Names: Mao Zedong. Check: the day; MacFarquhar (36) also has Mao grumble in the winter of 1959–60 about the General Office''s "excessive" use of tape recorders.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 6a07f9f0
        rows:
        - 'w.macfarquhar-maos-last-revolution 36: all'
- add:
    entry:
      id: cal.1960.china-leadership-3
      when: '1960'
      date: '1960'
      thread: china-leadership
      also:
      - china
      c: 'Yan Weibing, the wife of Lu Dingyi and a deputy section chief in his Propaganda Department, begins writing anonymous letters to Ye Qun, newly director of Lin Biao''s office: Ye a woman of easy virtue, Lin a cuckold.'
      n: '[[w.macfarquhar-maos-last-revolution]], 35. Made public: 2006. To check: [[w.xingxing-sese-de-anjian]], 18–33 (cited by [[w.macfarquhar-maos-last-revolution]], 35 n.15); [[w.han-789-jizhongying]], 12–30 (cited by [[w.macfarquhar-maos-last-revolution]], 35 n.16); [[w.nianyi-da-dongluande-niandai]], 19 (cited by [[w.macfarquhar-maos-last-revolution]], 35 n.17). Names: Lu Dingyi, Ye Qun, Lin Biao. Check: the day.'
