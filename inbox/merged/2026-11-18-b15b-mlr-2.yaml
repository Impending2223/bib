      when: Sept.
      date: 1963-09
      thread: china-leadership
      also:
      - china
      - soviet-union
      c: 'The Chinese open a series of nine polemics against the CPSU, to July 1964: on Stalin, war and peace, peaceful coexistence, peaceful transitions to socialism, Khrushchev''s revisionism.'
      n: '[[w.macfarquhar-maos-last-revolution]], 7. To check: [[w.sino-soviet-dispute]], 78–112 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.16); [[w.sino-soviet-dispute]], 174–205 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.17a); [[w.macfarquhar-origins-of-the-cultural]], II, 264–292 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.17b); [[w.polemic-on-the-general]] (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.18). Names: Khrushchev. Check: the day.'
      tags:
      - polity:prc
      - name:khrushchev-nikita-s
      src:
        c: 2ded40d1
        rows:
        - 'w.macfarquhar-maos-last-revolution 7: all'
- add:
    entry:
      id: cal.1964-07-14.china-leadership-2
      when: July 14
      date: '1964-07-14'
      thread: china-leadership
      also:
      - china
      - soviet-union
      c: 'The ninth polemic, "On Khrushchev''s Phoney Communism and Historical Lessons for the World": the "revisionist Khrushchev clique" the political representatives of the Soviet bourgeoisie and its privileged stratum; fifteen principles against a capitalist restoration; the training of revolutionary successors "a matter of life or death for our Party and our country."'
      n: '[[w.macfarquhar-maos-last-revolution]], 7, 12–13. To check: [[w.sino-soviet-dispute]], 78–112 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.16); [[w.sino-soviet-dispute]], 174–205 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.17a); [[w.macfarquhar-origins-of-the-cultural]], II, 264–292 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.17b); [[w.polemic-on-the-general]] (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.18); [[w.djilas-new-class]] (cited by [[w.macfarquhar-maos-last-revolution]], 12 n.29); [[w.macfarquhar-origins-of-the-cultural]], III, 363–364 (cited by [[w.macfarquhar-maos-last-revolution]], 13 n.30); [[w.macfarquhar-origins-of-the-cultural]], III, 428 (cited by [[w.macfarquhar-maos-last-revolution]], 13 n.31). See [[cal.1964-07-05.china-leadership]]. Names: Khrushchev.'
