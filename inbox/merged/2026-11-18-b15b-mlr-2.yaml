- add:
    entry:
      id: cal.1965.china-leadership-2
      when: 1965, after Nov. 10
      date: '1965'
      thread: china-leadership
      also:
      - china
      at: after 1965-11-10
      c: Mao grants Yang Shangkun, at Yang's request, an interview of an hour and a half after his dismissal. He instructs him to investigate in Guangdong whether CC and State Council policies fit local conditions, and to tell Mao personally if not. After two or three years in the Pearl River area, Mao tells him, he will move him to the Yellow River area for two or three years.
      n: '[[w.macfarquhar-maos-last-revolution]], 20. Made public: 2006. To check: [[w.macfarquhar-origins-of-the-cultural]], III, 447–448 (cited by [[w.macfarquhar-maos-last-revolution]], 20 n.21); [[w.shangkun-yang-shangkun-riji-2]], II, 682–686 (cited by [[w.macfarquhar-maos-last-revolution]], 20 n.22); [[w.zhisui-private-life-of-chairman]], 433–434 (cited by [[w.macfarquhar-maos-last-revolution]], 20 n.23); [[w.dongxing-wang-dongxing-gongkai-mao]], 60–61 (cited by [[w.macfarquhar-maos-last-revolution]], 20 n.24); [[w.zhisui-private-life-of-chairman]], 94 (cited by [[w.macfarquhar-maos-last-revolution]], 20 n.25). See [[cal.1965-11-10.china-leadership-2]]. Names: Mao Zedong. Check: the day.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: cc7ca4eb
        rows:
        - 'w.macfarquhar-maos-last-revolution 20: all'
