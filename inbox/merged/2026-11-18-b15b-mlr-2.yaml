- add:
    entry:
      id: cal.1965-01.china-leadership-3
      when: Jan.
      date: 1965-01
      thread: china-leadership
      also:
      - china
      c: 'Lin Biao''s instructions on PLA work, circulated: if the army is a political mess, the best military and technical skills are of no use. Mao, shown them, writes: agree entirely. Liu Shaoqi: approve entirely.'
      n: '[[w.macfarquhar-maos-last-revolution]], 21. Made public: 2006. To check: [[w.zhonggong-dangshi-jiaoxue-cankao]], XXIV, 554–557 (cited by [[w.macfarquhar-maos-last-revolution]], 21 n.28); [[w.yao-san-ci-da-nan]], 238–246 (cited by [[w.macfarquhar-maos-last-revolution]], 21 n.29); [[w.jiefangjun-jiangling-zhuan-14]], VII, 258 (cited by [[w.macfarquhar-maos-last-revolution]], 21 n.30). Names: Lin Biao, Mao Zedong, Liu Shaoqi. Check: the day; MacFarquhar (21) has the instructions circulated in January 1965 and the two annotations made "when shown".'
      tags:
      - polity:prc
      - name:lin-biao
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
