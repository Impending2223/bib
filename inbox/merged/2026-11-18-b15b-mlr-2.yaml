by: 'Claude (batch 15, second wave: MacFarquhar and Schoenhals, *Mao''s Last Revolution*, run 2: the leftovers of pp. 1–65 and pp. 66 onward, with their notes), Nov. 18, 2026; audited Nov. 18, 2026 (duplicates folded, the PLP entry re-dated, the missed dated events of pp. 1-65 added, To check regenerated from the edges)'
