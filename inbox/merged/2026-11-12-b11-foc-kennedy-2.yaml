    entry:
      id: cal.1960-10-03.elections-1960-kennedy-5
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      c: Belleville, Ill., Augustine's Restaurant, a lunch stop. Kennedy, with Douglas and Price, presents Maurer, of his PT boat crew (first seen in 17 years), and Mr. and Mrs. Zinser, parents of another
        crewman; the choice, he says, is "between standing still and moving forward."
      n: '[Remarks of Senator John F. Kennedy, Augustine''s Restaurant, Belleville, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-augustines-restaurant-belleville-il) (Oct.
        3, 1960). [[w.communications-freedom-of-communications-part]], 456–457. Names: Kennedy, Douglas, Price.'
      tags:
      - name:kennedy-john-f
      - name:douglas-paul-h
      - name:price-charles-m
      - state:il
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-6
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      c: 'Belleville, Ill. (the report prints "Belleview"), in front of the Republican headquarters. Kennedy, with Kerner, Douglas and Price: the overriding issue is "how we can maintain our freedom"; the
        world judging, from Sputnik on, that the Soviet Union is moving ahead.'
      n: '[Remarks of Senator John F. Kennedy, Belleville, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-belleville-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]],
        457–459. Names: Kennedy, Kerner, Douglas, Price.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:price-charles-m
      - state:il
      - polity:ussr
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-7
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      also:
      - economy
      c: 'Carbondale, Ill., the Southern Illinois University stadium. Kennedy, with Gray, Douglas and Kerner: nearly 5 million out of work and nearly 3 million on part time; in 1959 "our economic growth
        was about one-third that of the Soviet Union and one-half that of Germany, Italy, and France."'
      n: '[Speech of Senator John F. Kennedy, Southern Illinois University Stadium, Carbondale, IL](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-southern-illinois-university-stadium-carbondale-il)
        (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 459–462. Names: Kennedy, Gray, Douglas, Kerner.'
      tags:
      - name:kennedy-john-f
      - name:gray-kenneth-j
      - name:douglas-paul-h
      - name:kerner-otto
      - state:il
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-8
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      also:
      - economy
      c: 'Marion, Ill., the Marion County court house. Kennedy, with Douglas, Gray and Kerner: the area redevelopment bill vetoed twice, "this bill will become law next year"; $9 billion of food stored;
        steel mills at half capacity, 100,000 steelworkers out of work.'
      n: '[Remarks of Senator John F. Kennedy, Marion County Court House, Marion, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-marion-county-court-house-marion-il) (Oct.
        3, 1960). [[w.communications-freedom-of-communications-part]], 462–464. Names: Kennedy, Douglas, Gray, Kerner.'
      tags:
      - name:kennedy-john-f
      - name:douglas-paul-h
      - name:gray-kenneth-j
      - name:kerner-otto
      - state:il
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-9
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      c: 'Marion, Ill., the Veterans'' Hospital. Kennedy, with Gray, Powell, Douglas and Kerner, recalls his years on the Senate Veterans'' Committee: hospitals like this one "must continue to grow."'
      n: '[Remarks of Senator John F. Kennedy, Veteran''s Hospital, Marion, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-veterans-hospital-marion-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]],
        464. Names: Kennedy, Gray, Douglas, Kerner.'
      tags:
      - name:kennedy-john-f
      - name:gray-kenneth-j
      - name:douglas-paul-h
      - name:kerner-otto
      - state:il
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-10
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      c: 'Marion, Ill., the airport. Kennedy, with Gray, Powell, Douglas and Kerner: Nixon "last Thursday night in Boston" called him "another Truman"; he called Nixon another Dewey. It is "about the 14th
        speech I have made today," and Springfield is next, on statewide television at 9 o''clock.'
      n: '[Remarks of Senator John F. Kennedy, Airport, Marion, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-airport-marion-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]],
        464–465. Names: Kennedy, Gray, Douglas, Kerner, Nixon, Truman, Dewey.'
      tags:
      - name:kennedy-john-f
      - name:gray-kenneth-j
      - name:douglas-paul-h
      - name:kerner-otto
      - name:nixon-richard-m
      - name:truman-harry-s
      - name:dewey-thomas-e
      - state:il
- add:
    entry:
      id: cal.1960-10-03.farm-2
      when: Oct. 3
      date: '1960-10-03'
      thread: farm
      also:
      - elections-1960-kennedy
      c: 'Harrisburg, Ill. Kennedy, with Kerner, Douglas, Gray and Powell: "another Truman" and "another Dewey" again; $9 billion of surplus food stored while over 4 million look to the Government for surplus
        food; the administration''s policy of a steady drop of support prices.'
      n: '[Remarks of Senator John F. Kennedy, Harrisburg, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-harrisburg-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]],
        465–467. Names: Kennedy, Kerner, Douglas, Gray, Truman, Dewey.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:gray-kenneth-j
      - name:truman-harry-s
      - name:dewey-thomas-e
      - state:il
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-11
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      also:
      - jobs-and-wages
      - medicare
      c: 'Venice, Ill. Kennedy, with Kerner, Douglas and Price, on Nixon''s "parties don''t make much difference": the Republicans voted almost unanimously against the 25-cent minimum wage in 1935 and against
        $1.25 in 1960, and 95 to 1 in the House against the Social Security bill in 1935.'
      n: '[Remarks of Senator John F. Kennedy, Venice, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-venice-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]],
        467–469. Names: Kennedy, Kerner, Douglas, Price, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:nixon-richard-m
      - name:price-charles-m
      - state:il
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-12
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      also:
      - elections-1960-religion
      - cuba
      - labor
      c: 'Springfield, Ill., the Armory, with Kerner, Douglas and Mack. Kennedy: "I trust it will be 1948 all over again"; Nixon, who called him "just another Truman," is "another Dewey." In the questions:
        his religion would not interfere with his duty under the Constitution, and a President who allowed improper interference "would be subject to impeachment"; Hoffa should be removed from the Teamsters
        "by either Government action or by the work of its members"; Castro will likely stay "for some time." It is, he says, "the 15th speech we made today."'
      n: '[Speech of Senator John F. Kennedy, Armory, Springfield, IL](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-armory-springfield-il) (Oct. 3, 1960); [Question and Answer
        Period Following Speech of Senator John F. Kennedy, Armory, Springfield, IL](https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-speech-senator-john-f-kennedy-armory-springfield-il)
        (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 469–76 (the speech, 469–73; the questions, 473–76). Names: Kennedy, Kerner, Douglas, Mack, Nixon, Truman, Castro, Dewey, Hoffa.'
