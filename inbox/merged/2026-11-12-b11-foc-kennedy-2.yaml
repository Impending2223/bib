      when: Oct. 14
      date: '1960-10-14'
      thread: elections-1960-kennedy
      c: Owosso, Mich., with McNamara and Williams. Kennedy on James Oliver Curwood, who came from there; 180,000 out of work in Michigan; "25,000 new jobs every week for the next 10 years."
      n: '[Remarks of Senator John F. Kennedy, Owosso, MI](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-owosso-mi) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
