      - africa
      c: Paducah, Ky., the airport, with Combs, Stubblefield, Chelf, Wyatt and Keen Johnson. Kennedy on Barkley, and on Nixon's statement at Louisville that Lyndon Johnson and he were not in the tradition
        of Jefferson and Jackson. Ghana has "moved into the Communist orbit," Herter said a week before; Laos "is now moving sharply in the direction of the Communists."
      n: '[Remarks of Senator John F. Kennedy, Paducah, KY, Airport](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-paducah-ky-airport) (Oct. 8, 1960). [[w.communications-freedom-of-communications-part]],
