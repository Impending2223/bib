      when: Oct. 15
      date: '1960-10-15'
      thread: elections-1960-kennedy
      c: 'Sharon, Pa., breakfast at the Sharon Inn, with Lawrence, Clark and Edmondson. Kennedy: the party arrived at 2:30 that morning; Nixon, who calls himself a "practical progressive," wrote in May
        1960 that he had been "an economic conservative."'
      n: '[Remarks of Senator John F. Kennedy, Breakfast, Sharon Inn, Sharon, PA](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-breakfast-sharon-inn-sharon-pa) (Oct. 15, 1960).
        [[w.communications-freedom-of-communications-part]], 594. Names: Kennedy, Lawrence, Clark, Edmondson, Nixon.'
