      when: Oct. 16
      date: '1960-10-16'
      thread: elections-1960-kennedy
      also:
      - school-aid
      c: 'Statement on Federal aid for vocational education: Kennedy favors the full authorized appropriations, with grants-in-aid through State boards; the administration proposed discontinuing the grants
        in the 1959 and 1960 budgets, and the Democratic Congress did not approve it.'
      n: '[Statement by Senator John F. Kennedy on Federal Aid for Vocational Education](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-federal-aid-for-vocational-education)
        (Oct. 16, 1960). [[w.communications-freedom-of-communications-part]], 621. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
