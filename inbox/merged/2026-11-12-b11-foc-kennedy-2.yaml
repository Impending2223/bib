      c: Marshall, Mich., a whistle-stop at the station, with McNamara, Swainson and Clark. Kennedy quotes Demosthenes, "Our trouble is from those who would please us rather than those who would serve us."
      n: '[Remarks of Senator John F. Kennedy, Marshall, MI](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-marshall-mi) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
