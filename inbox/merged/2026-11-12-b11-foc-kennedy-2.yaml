      c: 'Columbia, S.C., the State House, with Hollings and Johnston. Kennedy, "the first Democratic candidate in the history of South Carolina to come to this State": Calhoun and Webster, and the Senate
        committee he chaired that put Calhoun first among five outstanding Senators; "Actually I was not playing golf in Georgia; I was at Warm Springs."'
      n: '[Speech of Senator John F. Kennedy, State House, Columbia, SC](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-state-house-columbia-sc) (Oct. 10, 1960). [[w.communications-freedom-of-communications-part]],
        547–551. Names: Kennedy, Hollings, Johnston.'
