      when: Oct. 15
      date: '1960-10-15'
      thread: elections-1960-kennedy
      also:
      - civil-rights-the-executive
      c: 'Beaver Falls, Pa., with Lawrence, Joseph Clark and Frank Clark. Kennedy: Lodge pledged a Negro in the Cabinet in the North and the next day, in the South, said he had "no right to make any pledges";
        Nixon sent Goldwater South and Scott North on civil rights; Scott should come home from the Republican "truth squad."'
      n: '[Remarks of Senator John F. Kennedy, Beaver Falls, PA](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-beaver-falls-pa) (Oct. 15, 1960). [[w.communications-freedom-of-communications-part]],
        599–601. Names: Kennedy, Lawrence, Clark, Frank Clark, Lodge, Nixon, Goldwater, Scott.'
      tags:
      - name:kennedy-john-f
      - name:lawrence-david-l
      - name:clark-joseph-s
      - name:lodge-henry-cabot
      - name:nixon-richard-m
      - name:goldwater-barry-m
      - name:scott-hugh-d-jr
      - name:clark-frank-m
      - state:pa
