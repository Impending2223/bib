      when: Oct. 10
      date: '1960-10-10'
      thread: elections-1960-kennedy
      also:
      - economy
      c: 'Pittsburgh, the Syria Mosque, with Lawrence, Barr and Clark. Kennedy quotes Nixon, "I am a conservative at home and a risktaker abroad." On Nixon''s statement that there is not going to be a recession:
        one-third of the steelworkers on part time or out of work; surplus food packages worth $6.25 for a family of four every 30 days.'
      n: '[Speech of Senator John F. Kennedy, Syria Mosque, Pittsburgh, PA](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-syria-mosque-pittsburgh-pa) (Oct. 10, 1960). [[w.communications-freedom-of-communications-part]],
        554–557. Names: Kennedy, Nixon, Lawrence, Barr, Clark.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - name:lawrence-david-l
      - name:barr-joseph-m
      - name:clark-joseph-s
      - state:pa
      - city:pittsburgh
- add:
    entry:
      id: cal.1960-10-12.economy
      when: Oct. 12
      date: '1960-10-12'
      thread: economy
      also:
      - elections-1960-kennedy
      - trade
      c: 'New York, the Associated Business Publications conference, Biltmore Hotel. Kennedy''s speech on economic policy: the Republican record inadequate in five areas, among them growth averaging 2.4
        percent a year since 1953 and unemployment under 5 percent in only 3 of 34 months to August; "big government is not an issue." In the questions: imports from low-wage areas, the Quill strike on
        the Pennsylvania Railroad (he has never supported compulsory arbitration), and a tax on advertising, which he would oppose.'
      n: '[Speech by Senator John F. Kennedy, to the Associated Business Publications Conference, Biltmore Hotel, New York, NY](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-the-associated-business-publications-conference-biltmore)
        (Oct. 12, 1960); [Question and Answer Period Following Speech of Senator John F. Kennedy, Association of Business Publications, Biltmore Hotel, New York, NY](https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-speech-senator-john-f-kennedy-association-business)
        (Oct. 12, 1960). [[w.communications-freedom-of-communications-part]], 557–67 (the speech, 557–62; the questions, 562–67). Names: Kennedy, Quill.'
      tags:
      - name:kennedy-john-f
      - name:quill-michael-j
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1960-10-12.elections-1960-kennedy
      when: Oct. 12
      date: '1960-10-12'
      thread: elections-1960-kennedy
      also:
      - africa
      - congo
      c: 'New York, the National Council of Women, Waldorf-Astoria. Kennedy''s speech on Africa, Columbus''s voyage and the "African revolution": 19 free nations against 3 south of the Sahara in 1953. In
        the Congo "one of the most powerful factions—that of Premier Lumumba—is pro-Russian and anti-American."'
      n: '[Speech by Senator John F. Kennedy, National Council of Women, Inc., Waldorf-Astoria Hotel, New York, NY](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-national-council-women-inc-waldorf-astoria-hotel-new-york-ny)
        (Oct. 12, 1960). [[w.communications-freedom-of-communications-part]], 567–571. Names: Kennedy, Lumumba.'
      tags:
      - name:kennedy-john-f
      - name:lumumba-patrice
      - state:ny
      - city:nyc
