      c: Louisville, Ky., the airport. Kennedy, at the fourth Kentucky visit of the campaign, asks a large majority in the city and county, and promises to bring out the truth about Nixon's record in the
        Congress.
      n: '[Remarks of Senator John F. Kennedy, Airport, Louisville, KY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-airport-louisville-ky) (Oct. 9, 1960). [[w.communications-freedom-of-communications-part]],
