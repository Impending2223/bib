      when: Oct. 20
      date: '1960-10-20'
      thread: elections-1960-kennedy
      c: Brooklyn, Foster and Nostrand. Kennedy introduces O'Toole, Carey, Judge Ughetta and Assemblyman Turpin and asks help in a Democratic county.
      n: '[Remarks of Senator John F. Kennedy, Foster and Nostrand, Brooklyn, NY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-foster-and-nostrand-brooklyn-ny) (Oct. 20, 1960).
