      c: 'La Grange, Ga., the airport. Kennedy: Georgia did not vote for McKinley, Harding, Coolidge, Hoover, Landon or Dewey, "and I don''t think in 1960 it is going to vote for Mr. Nixon."'
      n: '[Remarks of Senator John F. Kennedy, La Grange, GA, Airport](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-la-grange-ga-airport) (Oct. 10, 1960). [[w.communications-freedom-of-communications-part]],
