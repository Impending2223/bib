patch: 2026-11-12-b11-foc-kennedy-2
by: Claude (batch 11 reader, Freedom of Communications pt. 1, Oct. 1-20, 1960); audited by Claude (batch 11 auditor), Nov. 12, 2026
ops:
- add:
    entry:
      id: cal.1960-10-01.elections-1960-kennedy
      when: Oct. 1
      date: '1960-10-01'
      thread: elections-1960-kennedy
      c: 'Chicago, City Hall. Kennedy to a crowd with Mayor Daley, before the Polish-American Congress: Poland "will someday be free"; "The Soviet Union today is the greatest colonial master in the world."
        Kosciuszko left his American estate to Jefferson to free the slaves.'
      n: '[Remarks of Senator John F. Kennedy, City Hall, Chicago, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-city-hall-chicago-il) (Oct. 1, 1960). [[w.communications-freedom-of-communications-part]],
        416–417. Names: Kennedy, Daley.'
      tags:
      - name:kennedy-john-f
      - name:daley-richard-j
      - state:il
      - city:chicago
      - polity:ussr
- add:
    entry:
      id: cal.1960-10-01.elections-1960-kennedy-2
      when: Oct. 1
      date: '1960-10-01'
      thread: elections-1960-kennedy
      also:
      - jobs-and-wages
      - cities-and-housing
      c: 'Chicago, the Lake Meadow Shopping Center. Kennedy, with Mayor Daley and Dawson: the $1.25 minimum wage sought; laundrywomen in five large cities at 65 cents an hour; 15 million families in inadequate
        housing; Social Security under $78 a month. A Negro baby has "one-half as much chance of finishing high school" as a white baby born next door.'
      n: '[Remarks of Senator John F. Kennedy, Lake Meadow Shopping Center, Chicago, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-lake-meadow-shopping-center-chicago-il)
        (Oct. 1, 1960). [[w.communications-freedom-of-communications-part]], 417–419. Names: Kennedy, Daley, Dawson.'
      tags:
      - name:kennedy-john-f
      - name:daley-richard-j
      - name:dawson-william-l
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1960-10-01.elections-1960-kennedy-3
      when: Oct. 1
      date: '1960-10-01'
      thread: elections-1960-kennedy
      also:
      - soviet-union
      c: 'Chicago, the Polish-American Congress. Kennedy, with Daley, Machrowicz and Pucinski, in a speech on Poland and "colonialism": the Soviet Union holds the Baltic Republics, Poland and Czechoslovakia.
        The excerpts printed set out seven points, among them his Battle Act amendment (lost by one vote in the 85th Congress, passed by the Senate in the 86th, dead in the House), no recognition of Soviet
        domination, and the frozen zlotys to rebuild the Warsaw Castle.'
      n: '[Speech of Senator John F. Kennedy, Polish-American Congress, Chicago, IL](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-polish-american-congress-chicago-il) (Oct. 1,
        1960); [Excerpts from Remarks of Senator John F. Kennedy at the Polish-American Congress, Chicago, IL](https://www.presidency.ucsb.edu/documents/excerpts-from-remarks-senator-john-f-kennedy-the-polish-american-congress-chicago-il)
        (Oct. 1, 1960). [[w.communications-freedom-of-communications-part]], 419–26 (the speech, 419–24; the prepared excerpts, 424–26). Names: Kennedy, Daley, Machrowicz, Pucinski.'
      tags:
      - name:kennedy-john-f
      - name:daley-richard-j
      - name:machrowicz-thaddeus-m
      - name:pucinski-roman-c
      - state:il
      - city:chicago
      - polity:ussr
- add:
    entry:
      id: cal.1960-10-01.elections-1960-kennedy-4
      when: Oct. 1
      date: '1960-10-01'
      thread: elections-1960-kennedy
      also:
      - cuba
      - civil-rights-the-executive
      - school-aid
      c: 'Minneapolis, the bean feed, with Freeman, Humphrey and McCarthy. Kennedy speaks of the first debate, "I had debated with Hubert Humphrey," and of a "rendezvous with destiny." In the questions:
        on Castro, Nixon in Havana in 1955 praised Batista''s "stability"; the American Ambassador was once the second most powerful man in Cuba, "Today the Soviet Ambassador is." He says the President
        could end discrimination in housing by executive order and the next Congress should pass Federal aid to education.'
      n: '[Remarks of Senator John F. Kennedy, Bean Feed, Minneapolis, MN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-bean-feed-minneapolis-mn) (Oct. 1, 1960); [Question and
        Answer Period Following Remarks of Senator John F. Kennedy, Bean Feed, Minneapolis, MN](https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-remarks-senator-john-f-kennedy-bean-feed-minneapolis)
        (Oct. 1, 1960). [[w.communications-freedom-of-communications-part]], 426–33 (the remarks, 426–30; the questions, 430–33). Names: Kennedy, Freeman, Humphrey, McCarthy, Nixon, Castro, Batista.'
      tags:
      - name:kennedy-john-f
      - name:freeman-orville-l
      - name:humphrey-hubert-h
      - name:mccarthy-eugene-j
      - name:nixon-richard-m
      - name:castro-fidel
      - name:batista-y-zaldivar-fulgencio
      - state:mn
      - city:minneapolis
- add:
    entry:
      id: cal.1960-10-02.elections-1960-kennedy
      when: Oct. 2
      date: '1960-10-02'
      thread: elections-1960-kennedy
      c: St. Paul, Minn., the airport. Kennedy, with Karth, Freeman and Humphrey, asks Minnesota's help for the six weeks to the election.
      n: '[Remarks of Senator John F. Kennedy, Airport, St. Paul, MN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-airport-st-paul-mn) (Oct. 2, 1960). [[w.communications-freedom-of-communications-part]],
        433. Names: Kennedy, Karth, Freeman, Humphrey.'
      tags:
      - name:kennedy-john-f
      - name:karth-joseph-e
      - name:freeman-orville-l
      - name:humphrey-hubert-h
      - state:mn
- add:
    entry:
      id: cal.1960-10-02.elections-1960-kennedy-2
      when: Oct. 2
      date: '1960-10-02'
      thread: elections-1960-kennedy
      c: 'St. Paul, the St. Paul Hotel. Kennedy, with Karth, Humphrey, Freeman and McCarthy: the issues of 1960 outweigh those of 1932, when the question was whether freedom would remain in the United States,
        now "whether it will remain around the world"; Khrushchev "spends a month at the United Nations." "I downgrade the leadership, but I do not downgrade America."'
      n: '[Remarks of Senator John F. Kennedy, St. Paul Hotel, St. Paul, MN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-st-paul-hotel-st-paul-mn) (Oct. 2, 1960). [[w.communications-freedom-of-communications-part]],
        433–436. Names: Kennedy, Karth, Humphrey, Freeman, McCarthy, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:karth-joseph-e
      - name:humphrey-hubert-h
      - name:freeman-orville-l
      - name:mccarthy-eugene-j
      - name:khrushchev-nikita-s
      - state:mn
- add:
    entry:
      id: cal.1960-10-02.farm
      when: Oct. 2
      date: '1960-10-02'
      thread: farm
      also:
      - elections-1960-kennedy
      c: St. Paul, the GTA convention, with Humphrey, Freeman and Thatcher. Kennedy calls farm income "the No. 1 domestic problem." He cites the August bill to raise the support price for B milk, which
        he, Proxmire and Humphrey cosponsored, and answers Nixon's debate charge that his farm program would raise prices to the consumer.
      n: '[Remarks of Senator John F. Kennedy, Farmers Union Gta Convention, St. Paul, MN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-farmers-union-gta-convention-st-paul-mn)
        (Oct. 2, 1960). [[w.communications-freedom-of-communications-part]], 436–439. Names: Kennedy, Humphrey, Freeman, Proxmire, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:humphrey-hubert-h
      - name:freeman-orville-l
      - name:proxmire-william
      - name:nixon-richard-m
      - state:mn
- add:
    entry:
      id: cal.1960-10-02.elections-1960-kennedy-3
      when: Oct. 2
      date: '1960-10-02'
      thread: elections-1960-kennedy
      c: 'Duluth, Minn., the University of Minnesota. Kennedy, with Freeman, Blatnik and Humphrey, answers Nixon''s statement that parties "don''t make much difference": the two parties have taken different
        positions issue after issue.'
      n: '[Remarks of Senator John F. Kennedy, University of Minnesota, Duluth, MN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-university-minnesota-duluth-mn) (Oct. 2, 1960).
        [[w.communications-freedom-of-communications-part]], 439–442. Names: Kennedy, Freeman, Blatnik, Humphrey, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:freeman-orville-l
      - name:blatnik-john-a
      - name:humphrey-hubert-h
      - name:nixon-richard-m
      - state:mn
- add:
    entry:
      id: cal.1960-10-02.elections-1960-kennedy-4
      when: Oct. 2
      date: '1960-10-02'
      thread: elections-1960-kennedy
      c: 'Hibbing, Minn. Kennedy, with Blatnik, Freeman and Humphrey, answers Nixon''s speech that he and Lyndon Johnson were not in the tradition of Jefferson and Jackson: the Federalists nearly impeached
        Jefferson; the Whigs censured Jackson; the Republicans fought Roosevelt four times.'
      n: '[Remarks of Senator John F. Kennedy, Hibbing, MN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-hibbing-mn) (Oct. 2, 1960). [[w.communications-freedom-of-communications-part]],
        442–445. Names: Kennedy, Blatnik, Freeman, Humphrey, Nixon, Johnson.'
      tags:
      - name:kennedy-john-f
      - name:blatnik-john-a
      - name:freeman-orville-l
      - name:humphrey-hubert-h
      - name:nixon-richard-m
      - name:johnson-lyndon-b
      - state:mn
- add:
    entry:
      id: cal.1960-10-02.elections-1960-kennedy-5
      when: Oct. 2
      date: '1960-10-02'
      thread: elections-1960-kennedy
      c: 'St. Louis, the Chase Hotel. Kennedy, with Truman, Symington, Governor Blair and Mayor Tucker: Nixon dismissed him as "another Truman"; "I think it will be 1948 all over again." He quotes Churchill''s
        Fulton speech of 1946 on the Iron Curtain.'
      n: '[Speech of Senator John F. Kennedy, Chase Hotel, St. Louis, MO](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-chase-hotel-st-louis-mo) (Oct. 2, 1960). [[w.communications-freedom-of-communications-part]],
        445–450. Names: Kennedy, Truman, Symington, Tucker, Nixon, Churchill.'
      tags:
      - name:kennedy-john-f
      - name:truman-harry-s
      - name:symington-william-s
      - name:tucker-raymond-r
      - name:nixon-richard-m
      - name:churchill-winston-s
      - state:mo
      - city:st-louis
- add:
    entry:
      id: cal.1960-10-02.elections-1960-kennedy-6
      when: Oct. 2
      date: '1960-10-02'
      thread: elections-1960-kennedy
      also:
      - soviet-union
      c: 'Message for Pulaski Day: Poland needs America''s help; the next President should "announce to the world a specific course of action to aid the restoration of freedom in Poland and the captive
        nations"; permanent instructions to the U.S. delegates at the United Nations to press for free elections.'
      n: '[Pulaski Day Message from Senator John F. Kennedy](https://www.presidency.ucsb.edu/documents/pulaski-day-message-from-senator-john-f-kennedy) (Oct. 2, 1960). [[w.communications-freedom-of-communications-part]],
        450–451. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      c: 'Alton, Ill., the town square. Kennedy, with Kerner, Douglas and Price, on the last Lincoln-Douglas debate held there: "A house divided against itself" and the world "half slave and half free."
        Nixon, he says, stands where McKinley, Harding, Coolidge, Hoover, Dewey and Landon stood.'
      n: '[Remarks of Senator John F. Kennedy, Alton, IL, Town Square](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-alton-il-town-square) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]],
        451–452. Names: Kennedy, Kerner, Douglas, Price, Nixon, Dewey.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:nixon-richard-m
      - name:dewey-thomas-e
      - name:price-charles-m
      - state:il
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-2
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      c: 'Granite City, Ill., an auto rally. Kennedy, with Price, Douglas and Symington: the lowest rate of economic growth last year of any major industrialized society; steel mills at 50 percent of capacity;
        unemployment higher than in any month since 1945 except in the recessions of 1949, 1954 and 1958.'
      n: '[Remarks of Senator John F. Kennedy, Granite City, IL, Auto Rally](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-granite-city-il-auto-rally) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]],
        452–453. Names: Kennedy, Douglas, Price, Symington.'
      tags:
      - name:kennedy-john-f
      - name:douglas-paul-h
      - name:symington-william-s
      - name:price-charles-m
      - state:il
- add:
    entry:
      id: cal.1960-10-03.elections-1960-kennedy-3
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      c: 'East St. Louis, Ill., an auto rally at 15th and Broadway. Kennedy, with Douglas, Kerner and Price: the President sets the goals in housing, the minimum wage, Social Security and equal rights.'
      n: '[Remarks of Senator John F. Kennedy, Auto Rally, 15th and Broadway, East St. Louis, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-auto-rally-15th-and-broadway-east-st-louis-il)
        (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 453–454. Names: Kennedy, Douglas, Price, Kerner.'
      tags:
      - name:kennedy-john-f
      - name:douglas-paul-h
      - name:kerner-otto
      - name:price-charles-m
      - state:il
      - city:east-st-louis
