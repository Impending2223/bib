      c: 'North Miami Beach, Fla., the 163d Street Shopping Center, with Fascell, Smathers and Rogers. Kennedy: Nixon says the country''s prestige was never higher; in eight years "not a single Soviet soldier
        has crossed the frontiers of Russia," and yet Cuba, Laos and, in part, Iraq have gone their way.'
      n: '[Remarks of Senator John F. Kennedy, 163d Street Shopping Center, North Miami Beach, FL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-163d-street-shopping-center-north-miami-beach-fl)
