      c: 'Muncie, Ind., with Welsh and Hartke. Kennedy: Nixon "said the other night in Boston that I was another Truman"; the issue is a party that calls the $1.25 minimum wage and medical care for the
        aged tied to Social Security "too extreme."'
      n: '[Remarks of Senator John F. Kennedy, Muncie, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-muncie) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]],
