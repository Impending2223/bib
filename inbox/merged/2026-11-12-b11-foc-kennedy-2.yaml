      when: Oct. 20
      date: '1960-10-20'
      thread: elections-1960-kennedy
      c: Brooklyn, Utica Avenue and Eastern Parkway. Kennedy asks Brooklyn to vote Democratic and "get started again."
      n: '[Remarks of Senator John F. Kennedy, Utica Avenue and Eastern Parkway, Brooklyn, NY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-utica-avenue-and-eastern-parkway-brooklyn-ny)
