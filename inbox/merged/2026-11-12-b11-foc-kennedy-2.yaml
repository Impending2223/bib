      date: '1960-10-15'
      thread: elections-1960-kennedy
      c: Kittanning, Pa., with Patten, Reeser, Poundstone, Clark and Lawrence. Kennedy asks how many Republicans are present, and says the country has put its confidence now in one party, now in the other;
        whoever wins on Nov. 8 faces difficult times.
      n: '[Remarks of Senator John F. Kennedy, Kitanning, PA](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-kitanning-pa) (Oct. 15, 1960). [[w.communications-freedom-of-communications-part]],
        604–607. Names: Kennedy, Clark, Lawrence.'
