      c: 'Indianapolis, the Coliseum, with Welsh, Hartke, Schricker, Madden and Barr. Kennedy on Nixon''s "party labels don''t matter": "leap-year progressivism"; Nixon in Boston called him "another Truman,"
        and he answered "another Dewey." The Republicans would not have nominated Wilson, Roosevelt or Truman.'
      n: '[Speech of Senator John F. Kennedy, Auditorium (Coliseum), Indianapolis, IN](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-auditorium-coliseum-indianapolis) (Oct. 4,
