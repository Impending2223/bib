      date: '1960-10-20'
      thread: elections-1960-kennedy
      c: New York, the Astor Hotel, the dinner for Pat Clancy of Queens, with Wagner. Kennedy and Wagner are "graduates of the Al Smith school of dinners of last night"; whoever carries Queens may be the
        next President.
      n: '[Remarks of Senator John F. Kennedy, Pat Clancy Dinner, Astor Hotel, New York, NY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-pat-clancy-dinner-astor-hotel-new-york-ny)
