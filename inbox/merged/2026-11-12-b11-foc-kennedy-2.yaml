      when: Oct. 17
      date: '1960-10-17'
      thread: elections-1960-kennedy
      c: 'Columbus, Ohio, the Capitol steps, with DiSalle. Kennedy: he was on "Meet the Press" the night before and has come to Ohio seven times in three months; the choice "for forward motion" can be "a
        rising sun."'
      n: '[Remarks of Senator John F. Kennedy, Capitol Steps, Columbus, Ohio](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-capitol-steps-columbus-ohio) (Oct. 17, 1960). [[w.communications-freedom-of-communications-part]],
