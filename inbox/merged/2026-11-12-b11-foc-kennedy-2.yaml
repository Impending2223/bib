      id: cal.1960-10-09.testing
      when: Oct. 9
      date: '1960-10-09'
      thread: testing
      also:
      - elections-1960-kennedy
      c: 'Letter to Thomas E. Murray, former member of the Atomic Energy Commission, answering his open letter of Sept. 6: Kennedy does not "agree that underground nuclear weapons tests should be resumed
        at this time." If elected he will not be the first to test in the atmosphere, will direct "vigorous negotiation" at Geneva, set a time limit, and have the AEC prepare for underground tests; if the
        Russians still refuse, resumption "should then be considered."'
      n: '[A Letter by Senator John F. Kennedy to Thomas E. Murray](https://www.presidency.ucsb.edu/documents/letter-senator-john-f-kennedy-thomas-e-murray) (Oct. 9, 1960). [[w.communications-freedom-of-communications-part]],
