      date: '1960-10-18'
      thread: elections-1960-kennedy
      c: Jacksonville, Fla., Hemming Park, with Smathers, Bennett and Mayor Burns, in the evening. Kennedy recalls his sea duty at the Hutchins Naval Base; Nixon, who "journeys to Phoenix" to call on Goldwater,
        wrote Kelland, "I am an economic conservative."
      n: '[Speech of Senator John F. Kennedy, Hemming Park, Jacksonville, FL](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-hemming-park-jacksonville-fl) (Oct. 18, 1960). [[w.communications-freedom-of-communications-part]],
        970–73 (printed out of order). Names: Kennedy, Smathers, Bennett, Burns, Nixon, Goldwater.'
