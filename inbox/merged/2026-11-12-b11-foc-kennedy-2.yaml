      when: Oct. 17
      date: '1960-10-17'
      thread: elections-1960-kennedy
      c: Dayton, Ohio, the courthouse steps, with Patterson and DiSalle. Kennedy recalls that Roosevelt and Governor Cox called on Wilson in 1920 and that Cox told Wilson "we are with you 100 percent";
        Nixon holds that the power of the United States "is at its highest."
      n: '[Remarks of Senator John F. Kennedy, Courthouse Steps, Dayton, Ohio](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-courthouse-steps-dayton-ohio) (Oct. 17, 1960). [[w.communications-freedom-of-communications-part]],
        623–626. Names: Kennedy, DiSalle, Nixon.'
