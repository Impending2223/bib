      date: '1960-10-17'
      thread: elections-1960-kennedy
      also:
      - medicare
      c: 'Fairborn, Ohio, the Fulton Lane parking lot, with DiSalle and Sullivan. Kennedy: 15 million Americans over 65 live on Social Security checks averaging under $78 a month; the administration refused
        medical care for the aged tied to Social Security.'
      n: '[Remarks of Senator John F. Kennedy, Fulton Lane Parking Lot, Fairborn, Ohio](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-fulton-lane-parking-lot-fairborn-ohio) (Oct.
        17, 1960). [[w.communications-freedom-of-communications-part]], 631–633. Names: Kennedy, DiSalle.'
