      when: Oct. 14
      date: '1960-10-14'
      thread: elections-1960-kennedy
      c: 'Grand Rapids, Mich., with Swainson, Williams and McNamara. Kennedy: bipartisanship means "putting the interest of our country first"; the country must find 25,000 new jobs a week.'
      n: '[Remarks of Senator John F. Kennedy, Grand Rapids, MI](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-grand-rapids-mi) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
