      when: Oct. 20
      date: '1960-10-20'
      thread: elections-1960-kennedy
      c: 'Statement answering Nixon''s "white paper," which he calls a "mimeograph machine" in place of a television debate: 13 numbered rejoinders, among them growth of 2.3 percent a year from 1953 to
        1959 against 4.6 percent for Western Europe, the school votes of the House Republicans, 1956 to 1960, and Quemoy and Matsu, where Nixon "has now retreated from his original position." Ten questions
        for a "truth squad" to ask Nixon.'
      n: '[Statement by Senator John F. Kennedy on Vice President Nixon''s "White Paper"](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-vice-president-nixons-white-paper) (Oct.
        20, 1960). [[w.communications-freedom-of-communications-part]], 674–679. Names: Kennedy, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
