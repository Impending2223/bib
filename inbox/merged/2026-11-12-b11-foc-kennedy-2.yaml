      id: cal.1960-10-10.cities-and-housing
      when: Oct. 10
      date: '1960-10-10'
      thread: cities-and-housing
      also:
      - elections-1960-kennedy
      c: 'Pittsburgh, the Urban Affairs Conference. Kennedy proposes a "10-year Federal-local action program" on urban renewal, housing, mass transportation, pollution and recreation, and a Cabinet department
        for urban development: "The cities and suburbs of America deserve a seat at the Cabinet table." He calls Nixon''s urban program, set out in a position paper two weeks before, "an empty shell." He
        praises Pittsburgh under Lawrence and Barr and New Haven under Lee.'
      n: '[Speech by Senator John F. Kennedy Delivered Before the Urban Affairs Conference, Pittsburgh, PA](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-delivered-before-the-urban-affairs-conference-pittsburgh-pa)
        (Oct. 10, 1960). [[w.communications-freedom-of-communications-part]], 551–554. Names: Kennedy, Nixon, Lawrence, Barr, Lee.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - name:lawrence-david-l
      - name:barr-joseph-m
      - name:lee-richard-c
      - state:pa
      - city:pittsburgh
