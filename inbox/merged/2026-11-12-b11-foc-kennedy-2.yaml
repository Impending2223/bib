      when: Oct. 16
      date: '1960-10-16'
      thread: elections-1960-kennedy
      c: 'Silver Spring, Md., outside the Montgomery-Blair High School, to the crowd that could not enter, with Foley and Lankford. Kennedy: "I run against the ''Old Nixon'' and the ''New Nixon''"; Nixon
        wrote in May that he was "an economic conservative" and in California that week called himself a "practical progressive," and wanted American troops in Indochina in 1954.'
      n: '[Remarks of the Honorable John F. Kennedy to the Crowd Assembled Outside Montgomery-Blair High School, Silver Spring, MD](https://www.presidency.ucsb.edu/documents/remarks-the-honorable-john-f-kennedy-the-crowd-assembled-outside-montgomery-blair-high)
        (Oct. 16, 1960). [[w.communications-freedom-of-communications-part]], 619–621. Names: Kennedy, Lankford, Nixon.'
