      date: '1960-10-09'
      thread: elections-1960-kennedy
      c: 'Girard, Ohio, with the Mayor and DiSalle. Kennedy: as long as 15 million homes are substandard, "so long is there need for the Democratic Party." He mentions the World Series score.'
