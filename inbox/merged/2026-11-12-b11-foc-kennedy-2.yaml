      when: Oct. 12
      date: '1960-10-12'
      thread: elections-1960-kennedy
      c: 'Columbus Day statement: Columbus "the discoverer," and the millions of Americans of Italian ancestry, from whom have come Members of Congress and Governors.'
      n: '[Columbus Day Statement by Senator John F. Kennedy](https://www.presidency.ucsb.edu/documents/columbus-day-statement-senator-john-f-kennedy) (Oct. 12, 1960). [[w.communications-freedom-of-communications-part]],
        583–584. Names: Kennedy.'
