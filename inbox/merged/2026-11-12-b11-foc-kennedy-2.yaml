      when: Oct. 15
      date: '1960-10-15'
      thread: elections-1960-kennedy
      also:
      - jobs-and-wages
      c: 'Butler, Pa., with Frank Clark, Joseph Clark and Lawrence. Kennedy: the minimum wage must be brought up to date from the 25 cents of 1935; whoever thinks "the balance of power is moving with us"
        should vote for Nixon.'
      n: '[Remarks of Senator John F. Kennedy, Butler, PA](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-butler-pa) (Oct. 15, 1960). [[w.communications-freedom-of-communications-part]],
        601–604. Names: Kennedy, Clark, Frank Clark, Lawrence, Nixon.'
