      when: Oct. 12
      date: '1960-10-12'
      thread: elections-1960-kennedy
      c: 'Mineola, N.Y., Roosevelt Raceway, with English, Nickerson and Drewry. Kennedy: Nixon "never begins his speeches ''Fellow Republicans''"; the next President "cannot be elected unless he wins New
        York''s 45 votes."'
      n: '[Remarks of Senator John F. Kennedy, Roosevelt Raceway, Mineola, NY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-roosevelt-raceway-mineola-ny) (Oct. 12, 1960). [[w.communications-freedom-of-communications-part]],
        578–580. Names: Kennedy, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - state:ny
