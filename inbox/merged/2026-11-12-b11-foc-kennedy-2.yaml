      - elections-1960-debates
      c: 'Brooklyn, Sears, Roebuck, with Carey, State Senator Bloom and Ughetta. Kennedy: "I wish he would accept the fifth debate"; Nixon "runs on a slogan of standing up to Khrushchev" but will not let
        the people hear him a fifth time.'
      n: '[Remarks of Senator John F. Kennedy, Sears, Roebuck, Brooklyn, NY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-sears-roebuck-brooklyn-ny) (Oct. 20, 1960). [[w.communications-freedom-of-communications-part]],
