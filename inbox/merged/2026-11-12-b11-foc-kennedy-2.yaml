      c: 'Telegram to Lodge: the morning''s newspaper says Kennedy misquoted him in the Friday debate. Kennedy quotes the "Meet the Press" transcript, where Lodge said "if ever there was a case where we
        didn''t have the law on our side it was the U-2 case," and asks him to set the record straight.'
      n: '[Telegram from Senator John F. Kennedy to Mr. Henry Cabot Lodge](https://www.presidency.ucsb.edu/documents/telegram-from-senator-john-f-kennedy-mr-henry-cabot-lodge) (Oct. 9, 1960). [[w.communications-freedom-of-communications-part]],
        540–541. Names: Kennedy, Lodge.'
      tags:
