      date: '1960-10-20'
      thread: elections-1960-kennedy
      c: 'Brooklyn, N.Y., Martin''s store, Fulton and Duffield. Kennedy: a contest "between the comfortable and the concerned"; Nixon runs on "we have never had it so good."'
      n: '[Remarks of Senator John F. Kennedy, Martin''s Store, Fulton and Duffield, Brooklyn, NY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-martins-store-fulton-and-duffield-brooklyn-ny)
