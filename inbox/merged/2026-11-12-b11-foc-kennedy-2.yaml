      when: Oct. 20
      date: '1960-10-20'
      thread: elections-1960-kennedy
      also:
      - civil-rights-the-executive
      c: Brooklyn, Fulton and Nostrand, with Judge Ughetta. Kennedy repeats the debate figures on the Negro and white baby; of some 200 Federal district judges not one is a Negro; 26 of 6,000 in the Foreign
        Service are Negroes; four African countries have no American diplomat.
      n: '[Remarks of Senator John F. Kennedy, Fulton and Nostrand, Brooklyn, NY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-fulton-and-nostrand-brooklyn-ny) (Oct. 20, 1960).
        [[w.communications-freedom-of-communications-part]], 669–670. Names: Kennedy.'
