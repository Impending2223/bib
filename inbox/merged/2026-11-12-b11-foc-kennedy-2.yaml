      when: Oct. 19
      date: '1960-10-19'
      thread: elections-1960-kennedy
      also:
      - voting-rights
      c: New York, the auditorium of the union hall, with union leaders. Kennedy thanks them for the registration drive; 90 percent of the Republicans against 25 cents in 1935, 75 to 80 percent of the House
        Republicans against the $1.25 bill; the $1.25 would not take effect until 1962 for those already covered.
