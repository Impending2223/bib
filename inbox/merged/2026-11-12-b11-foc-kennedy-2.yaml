      date: '1960-10-16'
      thread: elections-1960-kennedy
      also:
      - china
      c: 'Wilmington, Del., New Castle County Airport, with Frear, McDowell and Carvel. Kennedy: he was in New Jersey, "not playing golf"; if Nixon now agrees with the President on Quemoy and Matsu, "I
        agree with him"; Nixon sent Goldwater through the South and Scott through the North on civil rights.'
      n: '[Remarks of Senator John F. Kennedy, New Castle County Airport, Wilmington, DE](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-new-castle-county-airport-wilmington-de)
