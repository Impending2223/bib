      when: Oct. 14
      date: '1960-10-14'
      thread: elections-1960-kennedy
      c: 'Ann Arbor, Mich., the railroad station. Kennedy: the first candidate to come to Ann Arbor was Wilson in 1912, the next Roosevelt in 1932; "you cannot run as a risktaker abroad, as Mr. Nixon has
        said, and a conservative at home."'
      n: '[Remarks of Senator John F. Kennedy, Railroad Station, Ann Arbor, MI](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-railroad-station-ann-arbor-mi) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
        584–585. The report prints no remarks of the early hours at the Michigan Union; see [[cal.1960-10-14.peace-corps]]. Names: Kennedy, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - state:mi
