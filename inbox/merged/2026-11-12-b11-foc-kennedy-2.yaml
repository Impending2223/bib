      when: Oct. 15
      date: '1960-10-15'
      thread: elections-1960-kennedy
      also:
      - cuba
      - china
      c: 'Sharon, Pa. Kennedy: Nixon "proposes to spend the next 3 weeks talking about Quemoy and Matsu"; Kennedy asks him to discuss Cuba, "90 miles off the coast of the United States." The administration
        vetoed the area redevelopment bill twice, two housing bills, a college dormitory loan bill and the public works bill with the Sharpville Dam.'
      n: '[Remarks of Senator John F. Kennedy, Sharon, PA](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-sharon-pa) (Oct. 15, 1960). [[w.communications-freedom-of-communications-part]],
        594–596. Names: Kennedy, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      - state:pa
- add:
    entry:
      id: cal.1960-10-15.elections-1960-kennedy-3
      when: Oct. 15
      date: '1960-10-15'
      thread: elections-1960-kennedy
      also:
      - china
      c: 'New Castle, Pa., with Lawrence, Clark and Frank Clark. Kennedy: Nixon, who called himself a "practical progressive," wrote last May, "I have consistently and outspokenly classified myself as an
        economic conservative." He does not want young men in a military action over islands Admiral Yarnell called not worth "the bones of a single American soldier."'
      n: '[Remarks of Senator John F. Kennedy, New Castle, PA](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-new-castle-pa) (Oct. 15, 1960). [[w.communications-freedom-of-communications-part]],
        596–599. Names: Kennedy, Lawrence, Clark, Frank Clark, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:lawrence-david-l
      - name:clark-joseph-s
      - name:nixon-richard-m
      - name:clark-frank-m
      - state:pa
- add:
    entry:
