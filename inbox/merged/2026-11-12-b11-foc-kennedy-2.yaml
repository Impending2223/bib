      when: Oct. 18
      date: '1960-10-18'
      thread: elections-1960-kennedy
      also:
      - welfare
      c: 'Letter from Kennedy to Mrs. Randolph Guggenheimer, president of the National Committee for the Day Care of Children, read at the opening of the National Conference on Day Care: Federal provision
        for day care centers for the children of working mothers.'
      n: '[Letter by Senator John F. Kennedy To Mrs. Randolph Guggenheimer](https://www.presidency.ucsb.edu/documents/letter-senator-john-f-kennedy-mrs-randolph-guggenheimer) (Oct. 18, 1960). [[w.communications-freedom-of-communications-part]],
        663–664. Names: Kennedy.'
