      when: Oct. 16
      date: '1960-10-16'
      thread: elections-1960-kennedy
      c: 'Silver Spring, Md., the Montgomery-Blair High School gymnasium, with Kefauver, Lankford, Foley and Sasscer. Kennedy: Wilson''s "New Freedom," Roosevelt''s "New Deal," Truman''s "Fair Deal" and
        his own program a succession; he has waited two months to see what proposals Nixon would put forward.'
      n: '[Speech by the Honorable John F. Kennedy, at Boys'' Gymnasium, Montgomery-Blair High School, Silver Spring, MD](https://www.presidency.ucsb.edu/documents/speech-the-honorable-john-f-kennedy-boys-gymnasium-montgomery-blair-high-school-silver)
