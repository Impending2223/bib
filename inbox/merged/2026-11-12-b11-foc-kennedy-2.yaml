      c: 'Cincinnati, Government Square, with DiSalle. Kennedy: the President "speaks for Massachusetts and California"; the city has supported the Republican candidate since 1936; a $1.25 minimum wage
        and Federal aid to education are not "extreme."'
      n: '[Remarks of Senator John F. Kennedy, Government Square, Cincinnati, Ohio](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-government-square-cincinnati-ohio) (Oct. 6, 1960).
