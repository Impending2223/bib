      date: '1960-10-17'
      thread: elections-1960-kennedy
      c: 'Dayton, Ohio, a luncheon of the Democrats and the Rotary Club at the Biltmore Hotel, with DiSalle, Patterson and Horstman. Kennedy on Laos, Iraq and Jordan: "hazard is going to be our companion,
        and those who can find reassurance in present events in my opinion should not hold power in the 1960''s."'
      n: '[Speech of Senator John F. Kennedy, Luncheon, Biltmore Hotel, Dayton, Ohio](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-luncheon-biltmore-hotel-dayton-ohio) (Oct. 17,
        1960). [[w.communications-freedom-of-communications-part]], 626–631. Names: Kennedy, DiSalle.'
