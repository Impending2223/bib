      c: 'Washington, Howard University, with Bolling, at a forum where "the Republican member has not shown up." Kennedy: the President must set "the moral tone" on equal rights; Title III would let the
        Attorney General bring suits; of some 200 district judges only one is a Negro.'
      n: '[Remarks of Senator John F. Kennedy, Howard University, Washington, DC](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-howard-university-washington-dc) (Oct. 7, 1960).
