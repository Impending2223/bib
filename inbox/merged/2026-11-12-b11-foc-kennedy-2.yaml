      date: '1960-10-14'
      thread: elections-1960-kennedy
      also:
      - school-aid
      c: 'Kalamazoo, Mich., with McNamara, Williams, Clark and Swainson. Kennedy: the Tennessee Valley as a model abroad; the United States must have "an educational system second to none."'
      n: '[Remarks of Senator John F. Kennedy, Kalamazoo, MI](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-kalamazoo-mi) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
