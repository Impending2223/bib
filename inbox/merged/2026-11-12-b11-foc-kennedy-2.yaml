      c: 'Evansville, Ind., with Welsh, Hartke and Denton. Kennedy: the choice on Nov. 8 resembles 1932 and 1912; "I am not impressed by those who say they can stand up to Khrushchev when Mr. Castro has
        successfully defied them from 90 miles away."'
      n: '[Remarks of Senator John F. Kennedy, Evansville, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-evansville) (Oct. 4, 1960). [[w.communications-freedom-of-communications-part]],
