    entry:
      id: cal.1960-10-03.elections-1960-kennedy-4
      when: Oct. 3
      date: '1960-10-03'
      thread: elections-1960-kennedy
      c: 'East St. Louis, the main intersection, from the roof of a car. Kennedy, with Kerner, Price and Douglas: the $1.25 minimum wage, housing vetoes, medical care for the aged, equal opportunity; Nixon''s
        slogan, "You never had it so good."'
      n: '[Remarks of Senator John F. Kennedy, Main Intersection, East St. Louis, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-main-intersection-east-st-louis-il) (Oct. 3,
        1960). [[w.communications-freedom-of-communications-part]], 455–456. Names: Kennedy, Kerner, Douglas, Price, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:kerner-otto
      - name:douglas-paul-h
      - name:nixon-richard-m
      - name:price-charles-m
      - state:il
      - city:east-st-louis
