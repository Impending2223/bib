      when: Oct. 17
      date: '1960-10-17'
      thread: elections-1960-kennedy
      c: 'Middletown, Ohio, the Jefferson-Jackson Day brunch of the Butler County Democrats, with DiSalle. Kennedy: DiSalle''s January support was "the first major support we had received after becoming
        a candidate"; Nixon''s "You never had it so good" misreads the times or, if he does not believe it, repeats Baldwin''s error of 1935.'
      n: '[Remarks of Senator John F. Kennedy, Jefferson-Jackson Day Brunch, Middletown, Ohio](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-jefferson-jackson-day-brunch-middletown-ohio)
        (Oct. 17, 1960). [[w.communications-freedom-of-communications-part]], 621–623. See [[cal.1960-10-17.elections-1960-kennedy]]. Names: Kennedy, DiSalle, Nixon.'
