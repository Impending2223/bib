      c: 'Salem, Ohio, the stadium, with Hays (the report: "Hayes"), DiSalle and Coleman. Kennedy, late: Nixon "has run on the slogan, ''We have never had it so good''," and he on "We must do better"; one-third
        of the steelworkers in the United States unemployed or on part time.'
      n: '[Remarks of Senator John F. Kennedy, Salem, Ohio, Stadium](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-salem-ohio-stadium) (Oct. 9, 1960). [[w.communications-freedom-of-communications-part]],
