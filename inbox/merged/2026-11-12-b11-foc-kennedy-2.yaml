      when: Oct. 16
      date: '1960-10-16'
      thread: elections-1960-kennedy
      also:
      - china
      c: Levittown, N.J., the shopping center, with Thompson and Thorn Lord. Kennedy is "delighted" to debate Quemoy and Matsu with Nixon but wants him also to debate Cuba, Africa, Latin America and economic
        growth, which he puts at one-third the Soviet Union's.
      n: '[Remarks of Senator John F. Kennedy, Levittown, NJ, Shopping Center](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-levittown-nj-shopping-center) (Oct. 16, 1960). [[w.communications-freedom-of-communications-part]],
        609–611. Names: Kennedy, Thompson, Nixon.'
