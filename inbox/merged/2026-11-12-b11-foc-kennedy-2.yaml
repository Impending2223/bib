      c: 'Telegram to Mosk, California Attorney General, in answer to his question: if elected, Kennedy will convene a White House Conference on Narcotics "as soon as it is reasonably practicable." He cites
        the House resolution of April and the Attorneys General''s resolution of July.'
      n: '[Text of a Telegram Sent to Hon. Stanley Mosk, Attorney General for the State of California, by Senator John F. Kennedy](https://www.presidency.ucsb.edu/documents/text-telegram-sent-hon-stanley-mosk-attorney-general-for-the-state-california-senator-john)
