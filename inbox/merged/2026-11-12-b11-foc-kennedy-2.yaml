      when: Oct. 17
      date: '1960-10-17'
      thread: elections-1960-kennedy
      c: London, Ohio, with DiSalle and Sullivan. Kennedy asks how many Republicans are present ("Two" with an open mind); the choice on Nov. 8 is the citizen's.
      n: '[Remarks of Senator John F. Kennedy, London, Ohio](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-london-ohio) (Oct. 17, 1960). [[w.communications-freedom-of-communications-part]],
