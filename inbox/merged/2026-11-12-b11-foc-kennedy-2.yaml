      date: '1960-10-18'
      thread: elections-1960-kennedy
      c: Miami, the Band Shell, Biscayne Bay, with Mayor High, Collins, Smathers and Fascell. Kennedy thanks the Waltham Post of the American Legion, in town for the convention, which played for him; the
        contest is "between those who are concerned and those who are comfortable."
      n: '[Remarks of Senator John F. Kennedy, Band Shell, Biscayne Bay, Miami, FL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-band-shell-biscayne-bay-miami-fl) (Oct. 18, 1960).
