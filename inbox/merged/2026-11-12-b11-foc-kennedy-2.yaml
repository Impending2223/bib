      c: 'Louisville, Ky., Jefferson Square. Kennedy, with Burke and Keen Johnson: Nixon "stood in this very same spot and claimed Thomas Jefferson as a Republican." He salutes Louisville, which in 1956,
        "carrying out the Supreme Court decision," set an example.'
      n: '[Remarks of Senator John F. Kennedy, Jefferson Square, Louisville, KY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-jefferson-square-louisville-ky) (Oct. 5, 1960).
