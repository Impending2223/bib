      when: Oct. 18
      date: '1960-10-18'
      thread: economy
      also:
      - elections-1960-kennedy
      c: 'New York Times political advertisement, "Senator Kennedy, Why Should the American Businessman Support the Democratic Party?", a report of Gov. Luther H. Hodges''s questions to Kennedy. Kennedy:
        two recessions in seven years; steel mills at less than 55 percent of capacity; a balanced budget "except during times of emergency" or high unemployment; the Democratic Party "is no more the party
        of labor than it is the party of business."'
      n: '["Senator Kennedy, Why Should the American Businessman Support the Democratic Party?" - New York Times Political Advertisement](https://www.presidency.ucsb.edu/documents/senator-kennedy-why-should-the-american-businessman-support-the-democratic-party-new-york)
        (Oct. 18, 1960). [[w.communications-freedom-of-communications-part]], 659–663. Names: Kennedy, Hodges.'
