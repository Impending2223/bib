      date: '1960-10-14'
      thread: elections-1960-kennedy
      also:
      - medicare
      c: 'Lansing, Mich., the Capitol steps, with McNamara, Williams, O''Rourke and Swainson. Kennedy: 17 million Americans over 65 live on a Social Security check averaging under $78 a month, and McNamara,
        chairman of the Senate Committee on Aging, has kept the problem before the Senate; medical care for the aged under Social Security.'
      n: '[Remarks of Senator John F. Kennedy, Capitol Steps, Lansing, MI](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-capitol-steps-lansing-mi) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
        968–70 (printed out of order). Names: Kennedy, McNamara, Williams, Swainson.'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-patrick-v
      - name:williams-g-mennen
      - name:swainson-john-b
      - state:mi
