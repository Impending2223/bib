      when: Oct. 14
      date: '1960-10-14'
      thread: elections-1960-kennedy
      c: 'Jackson, Mich., with Swainson, McNamara, Williams and Payne. Kennedy: Jackson is "one of the two birthplaces of the Republican Party"; Nixon''s "party labels don''t mean very much, what counts
        is the man."'
      n: '[Remarks of Senator John F. Kennedy, Jackson, MI](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-jackson-mi) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
