      c: 'Indianapolis, WTTV, a telecast with Welsh and a panel of Knap (Indianapolis Times), Carroll (South Bend Tribune) and Cadow (UPI). Kennedy: "we are behind in Indiana." Eisenhower showed "good judgment"
        in refusing a meeting with Khrushchev; he never recommended an apology for the U-2 flight, only an expression of "regrets." On Castro: why was he "permitted to seize control?" He defends the $1.25
        minimum wage and says he would have taken the Republicans'' $1.15.'
      n: '[Remarks of Senator John F. Kennedy, Telecast, Wttv, Indianapolis, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-telecast-wttv-indianapolis) (Oct. 4, 1960). [[w.communications-freedom-of-communications-part]],
        478–487. Names: Kennedy, Welsh, Eisenhower, Khrushchev, Castro.'
