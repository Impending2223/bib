      when: Oct. 3
      date: '1960-10-03'
      thread: farm
      also:
      - elections-1960-kennedy
      c: 'East St. Louis, the National Stockyards. Kennedy, with Douglas, Kerner and Price: International Harvester and John Deere plants closed that day; farm income down "almost 20 to 25 percent" in a
        few years.'
      n: '[Remarks of Senator John F. Kennedy, National Stockyards, East St. Louis, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-national-stockyards-east-st-louis-il) (Oct.
        3, 1960). [[w.communications-freedom-of-communications-part]], 454–455. Names: Kennedy, Douglas, Price, Kerner.'
      tags:
      - name:kennedy-john-f
      - name:douglas-paul-h
      - name:kerner-otto
      - name:price-charles-m
      - state:il
      - city:east-st-louis
