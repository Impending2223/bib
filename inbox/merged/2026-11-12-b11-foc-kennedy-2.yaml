      when: Oct. 14
      date: '1960-10-14'
      thread: elections-1960-kennedy
      c: Saginaw, Mich., the Fair Grounds, with Williams, McNamara, Reid and Swainson. Kennedy tells of his visit to the house where Roosevelt died and to Hyde Park, and asks whose record is "frozen in
        the ice of its own indifference"; he quotes Nixon from a document.
      n: '[Speech of Senator John F. Kennedy, Saginaw, MI, Fair Grounds](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-saginaw-mi-fair-grounds) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
