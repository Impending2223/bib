      when: Oct. 14
      date: '1960-10-14'
      thread: elections-1960-kennedy
      c: 'East Lansing, Mich., Michigan State University (the report: "at Lansing"). Kennedy spoke briefly.'
      n: '[[w.communications-freedom-of-communications-part]], 590 (the note; no text printed). Names: Kennedy.'
