      c: 'Louisville, the Fair Grounds. Kennedy''s speech, printed in excerpts, on the interdependence of the economy; steel at 50 percent of capacity. In the questions: eastern Kentucky unemployment, with
        the area redevelopment bill and defense manpower policy No. 4 to steer defense contracts to surplus-labor areas; his religion would not interfere, "the answer is ''No.''"; support prices tied to
        90 percent of the three-year average market price, which he opposes; Federal aid to education to run through the States.'
      n: '[Excerpts from the Speech of Senator John F. Kennedy, Fair Grounds, Louisville, KY](https://www.presidency.ucsb.edu/documents/excerpts-from-the-speech-senator-john-f-kennedy-fair-grounds-louisville-ky)
        (Oct. 5, 1960); [Question and Answer Period Following Speech of Senator John F. Kennedy, Fair Grounds, Louisville, KY](https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-speech-senator-john-f-kennedy-fair-grounds-louisville)
        (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]], 503–08 (the speech, 503–06; the questions, 506–08). Names: Kennedy.'
