      when: Oct. 14
      date: '1960-10-14'
      thread: elections-1960-kennedy
      c: 'Battle Creek, Mich., with Swainson, McNamara and Clark. Kennedy: the choice is between Nixon and himself and two philosophies; he closes with Lincoln''s letter of 1860.'
      n: '[Remarks of Senator John F. Kennedy, Battle Creek, MI](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-battle-creek-mi) (Oct. 14, 1960). [[w.communications-freedom-of-communications-part]],
