      - latin-america
      c: 'Johnstown, Pa. Excerpts of Kennedy''s remarks: Nixon talks of standing firm in Berlin and the Far East "but he never mentions standing firm in Cuba—and if you can''t stand up to Castro, how can
        you be expected to stand up to Khrushchev?"'
      n: '[Excerpts of Remarks by Senator John F. Kennedy, Johnstown, PA](https://www.presidency.ucsb.edu/documents/excerpts-remarks-senator-john-f-kennedy-johnstown-pa) (Oct. 15, 1960). [[w.communications-freedom-of-communications-part]],
        607–609. Names: Kennedy, Nixon, Castro, Khrushchev.'
