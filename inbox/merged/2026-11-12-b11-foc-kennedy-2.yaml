      c: 'Terre Haute, Ind., the courthouse, with Hartke, Welsh and Wampler. Kennedy: corn at 93 or 94 cents, $1.50 eight years before; under Nixon''s plan, tying the support price to the market price,
        it would fall lower.'
      n: '[Remarks of Senator John F. Kennedy, Courthouse, Terre Haute, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-courthouse-terre-haute) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]],
