      thread: elections-1960-kennedy
      c: 'Youngstown, Ohio, the Public Square. Kennedy: "the best of times and the worst of times"; "we and the Communists are locked in deadly embrace"; "come November 8, there should be no undecided voters."'
      n: '[Remarks of Senator John F. Kennedy, Youngstown, Ohio, Public Square](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-youngstown-ohio-public-square) (Oct. 9, 1960). [[w.communications-freedom-of-communications-part]],
