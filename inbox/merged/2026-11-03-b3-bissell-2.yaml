      n: '[[w.bissell-reflections-of-a-cold]], 232–33 n.5 (from Bissell''s memorandum for the record, Mar. 25). Check: the day: Bissell gives "three days later" than Taylor''s letter. To check: Bissell, memorandum for the record, Mar. 25, 1963, Papers of Richard M. Bissell Jr. (cited by [[w.bissell-reflections-of-a-cold]], 233 n.5). See [[cal.1963-03-12.defense]]. Names: Bissell, McNamara, Taylor.'
