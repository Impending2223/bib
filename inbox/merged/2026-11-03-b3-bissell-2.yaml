      date: '1963-03-12'
      thread: defense
      c: 'Taylor, Chairman of the Joint Chiefs, to Bissell: the Chiefs understand his wish to reorganize IDA, but his aims are not in the interest of national security; he has McNamara''s support. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 232 n.4. To check: Maxwell D. Taylor to Bissell, Mar. 12, 1963, Papers of Richard M. Bissell Jr. (cited by [[w.bissell-reflections-of-a-cold]], 232 n.4). See [[cal.1962-09.defense]]. Names: Taylor, Bissell, McNamara.'
