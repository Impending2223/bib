      date: '1963-03-25'
      thread: defense
      c: 'Bissell with Taylor: the Chiefs value stability over reform, a stable cadre of civilians working with WSEG. No objection to the changes Bissell plans for WSED in IDA''s new building; his draft reply "read perfectly well." By Bissell''s memorandum for the record.'
      n: '[[w.bissell-reflections-of-a-cold]], 233 n.5. Check: the day: the talk before the memorandum for the record of Mar. 25. To check: Bissell, memorandum for the record, Mar. 25, 1963, Papers of Richard M. Bissell Jr. (cited by [[w.bissell-reflections-of-a-cold]], 233 n.5). See [[cal.1963-03-12.defense]]. Names: Bissell, Taylor.'
