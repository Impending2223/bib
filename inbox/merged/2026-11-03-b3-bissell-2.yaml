      when: Mar. 1
      date: '1962-03-01'
      thread: defense
      c: Bissell, out of the CIA, joins the Institute for Defense Analyses as executive vice president. Killian of MIT a moving spirit in IDA's founding; Bissell had been on MIT's faculty.
      n: '[[w.bissell-reflections-of-a-cold]], 225. Names: Bissell, Killian.'
