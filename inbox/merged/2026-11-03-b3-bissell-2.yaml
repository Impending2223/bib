# Bissell, Reflections of a Cold Warrior (1996), the rest of the span read Nov. 3-4, 2026: ch. 8 (205-24, no dated
# events), ch. 9 (225-37), ch. 10 to 1964 (238-39), the notes to ch. 9 (261); and the Passed over of Oct. 29 ruled again.
