- add:
    entry:
      id: cal.1961-07.cuba-2
      when: July, summer
      date: 1961-07
      thread: cuba
      c: 'The Intelligence Board''s ad hoc committee, "The Military Build-up in Cuba": the Cuban army and militia gaining in combat effectiveness, to be defeated only by a "modern substantial combined arms force"; no hope of deposing Castro by exile landings or guerrillas. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 199–200 n.53. Check: the month: Bissell gives "the summer of 1961." To check: "The Military Build-up in Cuba: A Report Prepared by an Ad Hoc Committee of the United States Intelligence Board," National Security Archive, *Cuban Missile Crisis, 1962* (microfiche) (cited by [[w.bissell-reflections-of-a-cold]], 200 n.53). Names: Castro.'
      tags:
