- edit:
    id: cal.1964-06-21.mississippi
    base: 39b904da
    set:
      c: Chaney, Goodman and Schwerner, of CORE's Meridian project, missing in Neshoba County after a visit to the burned Mount Zion church at Longdale. Deputy Sheriff Price had held them in the Philadelphia jail; released after 10 p.m. June 21, their burned station wagon found near the Bogue Chitto June 23; Johnson sees Goodman's and Schwerner's parents and sends Dulles to Mississippi. Check the last.
      time_range:
      - 1964-06-21T20:00Z
      - 1964-06-21T21:00Z
      time_zone: America/Chicago
      range_basis: record
      n: 'The President''s News Conference, [1963–64 Pub. Papers 802](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=886) (June 23, 1964). *United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966). [[w.dittmer-local-people]], 246–51 (247: Price, the jail, the release at about 10:30; 250: the President on the telephone to Eastland and Governor Johnson, Dulles to Jackson; not the station wagon''s day); [[w.branch-pillar-of-fire]], 361–64; [[w.taking-charge]], 425; [[w.taking-charge]], 431–39. The Court''s opinion has Price detain the three June 21 and release them "in the dark of that night" (383 U.S. at 790); Dittmer, 247, the same, the release "about 10:30 that night"; the June 23 the line set beside the release is kept with the station wagon. The time is the arrest, "shortly after 3:00 P.M." (Dittmer, 247), Mississippi''s clock in 1964, daylight or standard, in doubt: the range covers both. To check: [[w.taking-charge-2001]]; [[w.mars-witness-in-philadelphia]]; [[w.cagin-we-are-not-afraid]]; [[w.gage-g-man]]; President''s Daily Diary, June 23, 1964 ([National Archives Catalog](https://catalog.archives.gov/id/192440)) (cited by [[w.dittmer-local-people]], 250 n.16). See [[cal.1964-06-14.mississippi]]. Names: Chaney, Goodman, Schwerner, Price, Johnson, Dulles. Check: the station wagon''s day, June 23 (no source read gives it).'
    kind: correct
- edit:
    id: cal.1964-07-02.civil-rights-bill-16
    base: ceb048e7
    set:
      time: 1964-07-02T17:44Z
      time_zone: America/New_York
      n: 'The time: [Johnson and Reedy, 1:44 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-reedy-and-office-conversation-july-2), Conversation WH6407-02-4129 (Miller Center; PRDE''s catalogue: Reedy, Moyers joining). [[w.purdum-idea-whose-time-has-2014]], 320. To check: TPR, Johnson, vol. 8, 384 (cited by [[w.purdum-idea-whose-time-has-2014]], 320 n.). Names: Johnson, Reedy, Moyers. Check: the hour (after the call to Albert, by the recordings'' page). The catalogue puts the Reedy call before the calls with Albert (2:05 and 2:29 p.m.). Check: that the recording is the call Purdum quotes (by its catalogue: Reedy, Moyers joining; not heard).'
- edit:
    id: cal.1964-10-01.students
    base: 641e9ab1
    set:
      time: 1964-10-01T19:30Z
      time_zone: America/Los_Angeles
      n: 'Free Speech Movement, [*Chronicle of the Free Speech Controversy*](https://www.fsm-a.org/stacks/FSM_chronofcontrov.html) (leaflet). [[w.branch-pillar-of-fire]], 503, 505–06; [[w.bernstein-guns-or-butter]], 403–05 (Savio''s three demands; the pack-in; Oct. 2, the agreement at 7:20); [[w.perlstein-before-the-storm]], 448–49 (the United Front of nineteen groups, right to left, YAF and the Young Republicans among them; Weinberg''s arrest; Savio on the car''s roof). The time: the police car surrounded from "12:30 PM Thursday" (the leaflet). The time is the first day''s. To check: [[w.rorabaugh-berkeley-at-war]]; [[w.cohen-freedoms-orator]]; [[w.gitlin-sixties]]; [[w.berkeley-in-the-sixties]]; Heirich, The Beginning, pp. 98–119 (cited by [[w.branch-pillar-of-fire]], 503); Viorst, Fire in the Streets, pp. 290–91 (cited by [[w.branch-pillar-of-fire]], 503); Heirich, The Beginning, pp. 129–44 (cited by [[w.branch-pillar-of-fire]], 505); Viorst, Fire in the Streets, pp. 29108 (cited by [[w.branch-pillar-of-fire]], 505). See [[cal.1962-06-11.students]]. Names: Savio, Weinberg, Kerr.'
- edit:
    id: cal.1965-03-05.civil-rights-organizations
