      n: '[[w.yang-shangkun-riji]], II, 335–336 (Dec. 17, 1963). The words: 3时半请孙大夫看病、针灸 (II, 335). The time is 3:30 p.m.: the diary sets it after the morning''s talk with Kang Yimin and before the afternoon''s 4:30 farewell to Luo Ronghuan (II, 335). The time is the first day''s. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Sun Zhenhuan, Yang Shangkun.'
