- edit:
    id: cal.1964-08-04.vietnam
    base: 6eab9898
    set:
      time: 1964-08-05T03:36Z
      time_zone: America/New_York
      n: 'Radio and Television Report to the American People Following Renewed Aggression in the Gulf of Tonkin, [1963–64 Pub. Papers 927](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=167) (Aug. 4, 1964). FRUS 1964–68, I, docs. [272](https://history.state.gov/historicaldocuments/frus1964-68v01/d272), [276](https://history.state.gov/historicaldocuments/frus1964-68v01/d276), [278](https://history.state.gov/historicaldocuments/frus1964-68v01/d278), [280](https://history.state.gov/historicaldocuments/frus1964-68v01/d280), [286](https://history.state.gov/historicaldocuments/frus1964-68v01/d286). [President''s Daily Diary, Aug. 4, 1964](https://catalog.archives.gov/id/192446), images 3, 5, 8, 11 (LBJ Library; National Archives Catalog). [[w.gibbons-u-s-government-and]], II, 289–97 (the day hour by hour: the reports, Herrick''s doubts at 1:27 p.m., the NSC, the leaders, the strikes, the address at 11:37 p.m.); [[w.vietnam-victory-in-vietnam]], 132 (no engagement on Aug. 4; the incident called fabricated); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 521–22 (the reported attack; the Maddox''s doubts; the NSC; the strikes; the address after 11:30 p.m.); [[w.cosmas-joint-chiefs-of-staff-2012]], 106–108 (all but Herrick); [[w.marolda-united-states-navy-and]], 426–34, 440, 443–44, 446 (the night action; the lunch at 1 p.m., Herrick''s doubts; the strikes ordered, Johnson to the congressmen; the address, 11:36 p.m.); [[w.asselin-hanois-road-to-the]], 196–97 (the second attack reported; Hanoi''s denial: no engagement Aug. 4); [[w.johnson-vantage-point]], 114–17; [[w.moyar-triumph-forsaken]], 311–13 (311–12: the night''s contacts, the evidence then and since; 312–13: the leaders'' meeting, Saltonstall against "limited"); [[w.mcnamara-in-retrospect]], ch. 5 at nn.5–10 (the Maddox''s warning at 7:40 a.m., Washington; the plan, four patrol boat bases and two oil depots; 11:40 a.m., McNamara with Rusk, Bundy and the Chiefs, then the NSC and lunch with the President; Herrick''s message; the NSC at 6:15 p.m., the strike authorized; the leaders at 6:45 p.m.; the Ticonderoga''s order at 7:22 p.m.). [[w.macv-command-history-1964]], 109 (the second attack, as MACV recorded it); [[w.branch-pillar-of-fire]], 434–36; [[w.bernstein-guns-or-butter]], 336–37 (Herrick''s first message 7:40 p.m. Saigon time; his first count, 22 torpedoes; Stockdale over the scene, "Not a one"; the Chiefs and McNamara confirm by 4:49 p.m.); [[w.bernstein-guns-or-butter]], 534 (Stockdale, leading planes over the gulf, saw no North Vietnamese boats); [[w.dallek-flawed-giant]], 150–53 (the attack reported; the NSC and the leaders in the evening; the address that night); [[w.logevall-choosing-war]], 198–99 (the reported attack that evening; Herrick''s cable, "freak weather effects" and "overeager sonarmen"; retaliation ordered; not "complete evaluation"); [[w.johnson-white-house-diary]], 187–89 (word that two destroyers were attacked by North Vietnamese PT boats, one on Sunday unanswered; Johnson ordered air action against the gunboats and their bases; after 11 p.m. on the air: "limited and fitting," "We still seek no wider war," Stevenson to the Security Council, a resolution asked of Congress; not the hour, the ships'' names or the NSC); [[w.goodwin-remembering-america]], 357–58 (Goodwin, called by Moyers to the fish room after 11 p.m.; the statement: the second attack "this very day," the strikes, "limited and fitting," "We still seek no wider war"; Bundy and his aides, "tension and elation"; not the hour of the broadcast, the ships, Herrick or the NSC); [[w.lich-su-khang-chien-chong-my]], III, 365–66 (Aug. 4: a great storm, the 12 torpedo boats at anchor in their base; Herrick''s cable of that day, the torpedo contacts "doubtful", quoted after Amter, *Vietnam Verdict*, in the Hanoi translation of 1985, 88; Sharp to McNamara, after the Pentagon Papers). Check: Branch has the strikes authorized at 7:22 p.m. and the address at 11:34 p.m. (436). Check: Bernstein, 534, dates the alleged attack Aug. 3. Check: Logevall, 199, puts Johnson''s address at 11:37 p.m. The time is Johnson''s address. To check: Joint Staff, JCS, Tonkin Gulf Composite Diary (cited by [[w.marolda-united-states-navy-and]], 440 n.7); Msg, CTG72.1 041754Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 440 n.9); Msg, JCS 042119Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 443 n.21); Joint Staff, JCS, Tonkin Gulf Composite Diary (cited by [[w.marolda-united-states-navy-and]], 446 n.26b); McNamara''s telephone conversation with Sharp, Aug. 4, 1964, NSF, LBJ Library (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 522 n.104); Herrick''s message of 1:27 p.m., Aug. 4, 1964, NSF, Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], II, 290 n.34); telephone conversation, Aug. 4, 1964, LBJL, NSF, VNCF, box 228 (cited by [[w.moyar-triumph-forsaken]], 312 n.14); [[w.mcnamara-in-retrospect]], 133, 134, 135 (cited by [[w.branch-pillar-of-fire]], 434, 435, 436); Chronology of Second Attack, n.d., NSF: Country: Vietnam, LBJ Library (cited by [[w.dallek-flawed-giant]], 150 n.75); Chronology of events, Aug. 4–5, 1964, NSF: Country: Vietnam, LBJ Library (cited by [[w.dallek-flawed-giant]], 152 n.80); Notes of the NSC meeting, Aug. 4, 1964, NSF, NSC Meetings File, LBJ Library (cited by [[w.dallek-flawed-giant]], 152 n.81). See [[cal.1964-08-02.vietnam]]. Names: Herrick, Johnson. Check: Moyar, 312: "most of the information now available supports the view that an attack did not occur." Check: MACV''s history, 109, has it "firmly established" that at least five boats engaged the destroyers; thirteen contacts fired on.'
