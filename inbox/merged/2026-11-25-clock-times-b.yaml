      n: '[[w.young-easy-burden]], 253–57; the agent, by Young''s account, "the brother-in-law of the sheriff" (257). After the news of the murder: [[w.young-easy-burden]], 253. The time: King''s call to Young and Bevel at Gaston''s, Birmingham, "about one o''clock in the morning" ([[w.young-easy-burden]], 254); Birmingham''s clock in 1963, daylight or standard, in doubt: the range covers both. See [[cal.1963-06-09.mississippi]]. Names: Andrew Young, Martin Luther King, Medgar Evers, Hamer, Ponder, Guyot.'
