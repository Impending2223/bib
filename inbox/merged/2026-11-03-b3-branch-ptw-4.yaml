      when: Apr. 15
      date: '1963-04-15'
      thread: alabama-birmingham
      c: 'Boutwell sworn in as Birmingham''s mayor, with the new council. The *New York Times*: "like a picnic," the city
        looking to Boutwell for "a diminution, if not an end, to racial tensions." Boutwell: "mutual respect and understanding."'
      n: '[[w.branch-parting-the-waters]], 737. To check: New York Times, Apr. 16, 1963, 1 (cited by [[w.branch-parting-the-waters]],
        737 n.1). Check: the council''s swearing-in, and Connor''s commission still sitting. See [[cal.1963-04-02.alabama-birmingham]].
        Names: Boutwell.'
      tags:
      - name:boutwell-albert
      - state:al
      - city:birmingham
      src:
        c: 36937c63
        rows:
