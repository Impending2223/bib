      c: 'Sixth Avenue Baptist, the night''s mass meeting. Floyd Patterson; Jackie Robinson: "I don''t think white Americans
        understand what Birmingham means to all of us throughout the country." King: "I am convinced that the agreements that
        have been made will be met"; "this is not a racial conflict basically ... The tension in Birmingham is between justice
        and injustice"; Prince Green, of Coosa Street, shot from a passing car that evening; "I will never teach any of you
        to hate white people."'
      n: '[[w.branch-parting-the-waters]], 801-2. To check: selections from the mass meeting of May 13, 1963, Donald H. Smith
        tapes, State Historical Society of Wisconsin (cited by [[w.branch-parting-the-waters]], 801 n.2). See [[cal.1963-05-10.alabama]].
