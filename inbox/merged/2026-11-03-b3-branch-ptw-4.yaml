      when: Apr. 25
      date: '1963-04-25'
      thread: alabama-birmingham
      c: 'The trial''s day at city hall: the city shuts off the white and the Negro fountains and locks the toilets. The night''s
        mass meeting, Sixteenth Street, packed. Shuttlesworth: "glad Bobby came down. ... I wish he would come to Birmingham,
        but he can hear the noise we are making one hundred miles away"; "Segregation is a silly thing! ... Here we are, arguing
        over something that''s free!"'
      n: '[[w.branch-parting-the-waters]], 751. To check: Birmingham police notes on mass meeting, Apr. 25, 1963, Bull Connor
        Papers (cited by [[w.branch-parting-the-waters]], 751 n.3); Watters, *Down to Now*, 233-37 (cited by [[w.branch-parting-the-waters]],
        751 n.4). See [[cal.1963-04-25.alabama]]. Names: Shuttlesworth, Robert Kennedy.'
