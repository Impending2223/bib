      when: July 25
      date: '1963-07-25'
      thread: king
      also:
      - antisubversion
      c: 'King''s public statement: the Constitution''s story "yacked with half truths and vicious innuendos"; a press conference
        in Atlanta. Privately, telephone conferences with the Justice Department and his New York advisers on what more he
        must do. Robert Kennedy: no contact with O''Dell or Levison, direct or indirect, the condition of his public defense,
        "the treaty" in Jones''s word.'
      n: '[[w.branch-parting-the-waters]], 858. To check: King, statement, July 25, 1963, King Papers, KS4 (cited by [[w.branch-parting-the-waters]],
        858 n.1); Atlanta Constitution, July 26, 1, Atlanta Journal, July 26, 4, New York Times, July 27, 1963, 8 (cited by
        [[w.branch-parting-the-waters]], 858 n.2); FBI intercept, July 28, 1963, FLNY-9-242a (cited by [[w.branch-parting-the-waters]],
        858 n.5). Check: the press conference''s day. See [[cal.1963-07-25.press-and-broadcasting]]. Names: Martin Luther
        King, Robert Kennedy, O''Dell, Levison.'
      tags:
