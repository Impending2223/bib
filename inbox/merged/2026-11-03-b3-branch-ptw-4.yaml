      when: June, late
      date: '1963-06'
      thread: march-on-washington
      c: 'Wilkins to Rustin by telephone: "I''m not in favor of your organizing the March on Washington." The reasons: a conscientious
        objector called a draft dodger in Congress, a socialist, once of the Young Communist League, the arrest in California
        on a sex charge; "it''s gonna come out." Rustin: "If you stand up and have some courage, it will do no damage." Wilkins:
        "Randolph may be prepared to do that. But I''m not."'
      n: '[[w.branch-parting-the-waters]], 846-47. To check: interviews: Bayard Rustin, Nov. 28, 1983 (cited by [[w.branch-parting-the-waters]],
        846 n.1). Check: the day ("a few days" before July 2). See [[cal.1963-06-18.march-on-washington]]. Names: Wilkins,
        Rustin, Randolph.'
