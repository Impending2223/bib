      - civil-rights-the-executive
      c: 'Clarence Jones, for King, in Burke Marshall''s office: King will stop talking directly with Levison, to spare the
        Administration, but keeps the right to his counsel through intermediaries such as Jones; which channels are safe?
        Marshall: all parties "had no choice." Marshall to Robert Kennedy: Jones expects him to help King get around the FBI,
        and knows the President warned King of surveillance.'
