      when: May 9
      date: '1963-05-09'
      thread: king
      also:
      - alabama-birmingham
      - civil-rights-the-executive
      c: 'King''s press conference, the truce extended a day; for the first time in Birmingham he contradicts the Administration:
        "The President said that there were no federal statutes involved in most aspects of this struggle, but I feel that
        there have been blatant violations of basic constitutional principles. ... some persons who have been arrested were
        arrested for going down to register to vote, and the federal government has done nothing about that."'
      n: '[[w.branch-parting-the-waters]], 787. To check: King, statement, May 9, 1963, King Papers, KS4 (cited by [[w.branch-parting-the-waters]],
        787 n.3). See [[cal.1963-05-08.middle-east]]. Names: Martin Luther King, Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:kennedy-john-f
      - state:al
      - city:birmingham
      src:
        c: 9c622982
        rows:
