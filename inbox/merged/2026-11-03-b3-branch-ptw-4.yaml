- check:
    id: cal.1963-06-23.king-detroit
    text: 'Check: Branch, 842-43: the rally once postponed; Detroit''s NAACP boycotting it, the Evers fund feud; the police
      commissioner at the plane, "you''ll see no dogs and fire hoses here"; King, Franklin, Reuther and Mayor Cavanagh (Branch:
      "Cavenaugh") carried down Woodward Avenue; at Cobo Hall forty-eight minutes, "the largest and greatest demonstration
      for freedom ever held in the United States," a call for a "march to Washington more than a hundred thousand strong."'
