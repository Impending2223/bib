    text: 'Check: Branch, 818-20: Ponder and five graduates of her literacy school, back from Septima Clark''s school, at
      the Winona Trailways station, Sunday morning; arrested when Ponder takes down the cruisers'' license numbers; June Johnson,
      sixteen, beaten with a blackjack; Ponder beaten until her head is swollen, a tooth chipped; Hamer beaten by two Negro
      prisoners on the officers'' orders, taunted about Martin Luther King.'
