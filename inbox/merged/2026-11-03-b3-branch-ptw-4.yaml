      c: 'Clarence Jones to Levison, overheard: Hoover "the other person," King or Levison "our friend"; "if they didn''t
        have the assurances, then they wouldn''t have made that statement." Within days Levison tells Jones and Belafonte,
        "I''m not going to let Martin make that decision," and breaks off direct contact with King, keeping only the business
        of King''s Birmingham book.'
      n: '[[w.branch-parting-the-waters]], 858-59. To check: FBI intercept, July 28, 1963, FLNY-9-242a (cited by [[w.branch-parting-the-waters]],
        858 nn.5, 7); [[w.schlesinger-robert-kennedy-and-his]], 385; interviews: Harry Belafonte, Mar. 6-7, 1985, Clarence
        Jones, Oct. 25, 1983 (cited by [[w.branch-parting-the-waters]], 858 n.8). Check: the day of Levison''s withdrawal.
        See [[cal.1963-07-03.king]]. Names: Levison, Hoover, Martin Luther King.'
