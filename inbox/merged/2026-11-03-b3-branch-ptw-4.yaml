- add:
    entry:
      id: cal.1963-05-06.alabama-birmingham-4
      when: May 6
      date: '1963-05-06'
      thread: alabama-birmingham
      also:
      - civil-rights-the-executive
      c: Evening. Shuttlesworth at a second negotiating session with the whites, Smyer and Vann leading, Burke Marshall in
        the background; modest progress. Through the night at the Gaston Motel King's strategists, the business district a
        ghost town, white shoppers gone too, resolve to flood it with Negroes rather than march to jail.
      n: '[[w.branch-parting-the-waters]], 772, 774. To check: interviews: Wyatt Tee Walker, Dec. 21, 1984 (cited by [[w.branch-parting-the-waters]],
        774 n.1). See [[cal.1963-05-05.civil-rights-the-executive]]. Names: Shuttlesworth, Burke Marshall, Martin Luther King.'
      tags:
