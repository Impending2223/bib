      c: 'Albert to the President by telephone, the morning after Evers''s murder, recorded, on the Democrats who sank a $450
        million section of the public works bill: "I couldn''t do a damn thing with them." Kennedy: "Civil rights did it";
        "it''s like they shoot this guy in Mississippi ... this has become everything." Albert: civil rights "overwhelming
        the whole program."'
      n: '[[w.branch-parting-the-waters]], 827-28. To check: [Kennedy and Albert, June 12](https://prde.upress.virginia.edu/conversations/4001530),
        JFK Dictabelt 22A.2 (PRDE only) (cited by [[w.branch-parting-the-waters]], 827 n.2). Check: the bill (Branch''s "public
        works bill"; the House that day rejected the area redevelopment amendments). See [[cal.1963-06-12.program]]. Names:
        Albert, Kennedy.'
      tags:
