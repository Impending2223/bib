    text: 'Check: Branch, 764: the delegation "a morning audience of ADA liberals at the White House" ([[w.schlesinger-thousand-days-1965]],
      875, cited by Branch, 764 n.4); the New York Times of May 4, page 1, three photographs two columns wide, the Gadsden
      photograph on top, the freedom walkers dragged to jail at Fort Payne, Ala., at the bottom (764 n.3).'
