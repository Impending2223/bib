        754 n.2); interviews: James Bevel, May 16-17, 1985 (cited by [[w.branch-parting-the-waters]], 755 n.1). Check: the
        day. See [[cal.1963-04-30.alabama-birmingham-2]]. Names: Martin Luther King, Shuttlesworth.'
