- check:
    id: cal.1963-05-07.alabama-birmingham
    text: 'Check: Branch, 775-80: decoy lines from the Sixteenth Street Baptist Church at noon, six hundred pickets downtown,
      then Walker''s "general charge," Bevel''s "freedom dash"; more than three thousand in the business district, no arrests,
      the jails full; Walker''s false fire alarms and dog whistles; by three a riot of rocks and hoses at the park; a monitor
      gun pins Shuttlesworth to the church wall, hospitalized; Connor: "I wish they had carried him away in a hearse"; King
      that night, Wallace''s troopers moving in "that very hour."'
