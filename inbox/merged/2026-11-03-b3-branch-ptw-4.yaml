- check:
    id: cal.1963-05-20.civil-rights-bill
    text: 'Check: Branch, 807-9, from Audiotape 88.4 (cited by Branch, 807 n.6): Robert Kennedy, "There must be a dozen places
      where we''re having major problems today"; Daley''s warning of "a lot of trouble," "you can''t have a moderate Negro
      any more"; O''Brien, Powell''s "I''m gonna lead it"; "Roy Wilkins hates Martin Luther King"; Sorensen, O''Brien and
      O''Donnell for Title III against an accommodations law; Robert Kennedy, Title III "just awful"; the President on theaters,
      "We''ve got to have it"; King late in the series of meetings, "it''s like Marx coming to the White House." Branch names
      the tape 88.4, as Reeves; PRDE has the day''s meeting as Tape 88.2.'
