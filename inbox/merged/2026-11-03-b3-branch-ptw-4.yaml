    item: '[[w.branch-parting-the-waters]], 793-800'
- check:
    id: cal.1963-05-11.alabama
    text: 'Check: Branch, 793-800: the first bomb at A. D. King''s parsonage about 10:45 p.m., the second blowing out the
      front; the Gaston Motel just before midnight, four hurt; the riots near both; Lingo''s 250 troopers and irregulars charge
      at the motel, Chief Moore protesting; by dawn six businesses, several houses and an apartment building burned, nearly
      seventy to the hospital; at the White House Sunday, Robert Kennedy: "sticking bayonets in people"; Marshall to King
      from the Oval Office: "if there are no other incidents he thinks he can control his people"; three thousand troops moved
      in Operation Oak Tree; the statement at 8:48 p.m., "The Birmingham agreement was and is a fair and just accord."'
