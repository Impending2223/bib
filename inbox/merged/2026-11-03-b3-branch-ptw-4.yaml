      - robert-kennedy
      c: 'Night. Gaston, at the urging of Negro negotiators and Robert Kennedy, brings $5,000 cash from his bank to the jail;
        King and Abernathy put out of their cells. King to reporters: no settlement by 11 a.m. Thursday, the largest demonstration
        yet.'
      n: '[[w.branch-parting-the-waters]], 786. To check: New York Times, May 9, 1963, 1, 17 (cited by [[w.branch-parting-the-waters]],
        786 n.1). See [[cal.1963-05-08.alabama-birmingham-3]]. Names: Robert Kennedy, Martin Luther King, Abernathy.'
