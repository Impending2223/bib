      when: Aug. 11
      date: '1963-08-11'
      thread: march-on-washington
      also:
      - king
      c: 'King, overheard on the Jones tap, a friend: "your boy Burke Marshall is scared to death, and so is the Attorney
        General." King: the march''s enemies will attack Rustin''s Communist ties and his "morals charge"; "They are going
        to make a hell of a mess of it"; "And grab one little brother." Malone, SAC New York, teletypes it to Hoover; Aug.
        12, Hoover puts it in a confidential memorandum to Robert Kennedy.'
      n: '[[w.branch-parting-the-waters]], 861. To check: SAC New York to Director, Aug. 11, 1963, FK-189 (cited by [[w.branch-parting-the-waters]],
        861 nn.4-5); Hoover to Robert Kennedy, Aug. 12, 1963, FK-178 (cited by [[w.branch-parting-the-waters]], 861 n.6).
        Check: the day of the conversation. See [[cal.1963-08-05.king]]. Names: Martin Luther King, Burke Marshall, Rustin,
        Hoover, Robert Kennedy.'
