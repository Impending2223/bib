    text: 'Check: Branch, 747, quotes the letter to Hannah from the President''s press statement of Apr. 19 (Lee White Papers,
      box 23): "With regard to the incidents referred to in the Commission''s report, I am advised that every case, but one,
      has been successfully resolved"; Bernhard: the commission "hooted out of Washington" (oral history, 29).'
