      when: May 9
      date: '1963-05-09'
      thread: civil-rights-the-executive
      also:
      - alabama-birmingham
      - robert-kennedy
      c: 'The talks stall on the jailed. The whites: the five hundred youngest already released pending trial, the rest''s
        bonds to be cut after the settlement, but no public promise. King: let the Senior Citizens raise $250,000 for bonds,
        or the federal government, as Robert Kennedy raised more than $60 million for the Bay of Pigs prisoners. To Kennedy''s
        warnings, through Burke Marshall, of martial law, King hints that Governor Rockefeller might help with the bond money.'
      n: '[[w.branch-parting-the-waters]], 786-87. To check: Vincent Harding, "A Beginning in Birmingham," *The Reporter*,
        June 6, 1963, 17 (cited by [[w.branch-parting-the-waters]], 787 n.1); New York Times, May 9, 1963, 1, 17 (cited by
        [[w.branch-parting-the-waters]], 786 n.2). Robert Kennedy, May 21, recorded: he told King his stand "doesn''t really
        make a lot of sense" ([[w.branch-parting-the-waters]], 787; the tape, cited by [[w.branch-parting-the-waters]], 787
        n.2). See [[cal.1963-05-08.alabama-birmingham-5]]. Names: Martin Luther King, Robert Kennedy, Burke Marshall, Rockefeller.'
      tags:
      - name:king-martin-luther-jr
      - name:kennedy-robert-f
      - name:marshall-burke
      - name:rockefeller-nelson
      - state:al
