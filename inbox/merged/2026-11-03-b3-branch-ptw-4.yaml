    text: 'Check: Branch, 781-82, puts the firebombs at about 4 a.m. the morning after May 7, outside Mileston, Miss.; Turnbow
      drives off the armed men; Moses photographs the damage, an FBI agent sent by Doar digs out slugs; Sheriff Andrew P.
      Smith arrests Turnbow, Moses and three SNCC workers for arson; a jury convicts; Moses fined $50 for impeding the investigation
      by taking pictures.'
