      when: Apr. 24
      date: '1963-04-24'
      thread: alabama-birmingham
      c: 'St. James Baptist Church, after the President''s news conference. Bevel''s and Young''s workshop students stay into
        the night: a mass meeting so packed a fire marshal comes in. Shuttlesworth: all Negroes at the next day''s trial to
        use the "whites only" fountains at city hall. Tributes to William Moore. King, more than half an hour, coaxes a score
        of volunteers for jail, many of them students; the jail "no place for children."'
      n: '[[w.branch-parting-the-waters]], 750-51. To check: Birmingham police notes on mass meeting, Apr. 24, 1963, Bull
        Connor Papers (cited by [[w.branch-parting-the-waters]], 751 n.1). See [[cal.1963-04-22.alabama-birmingham]]. Names:
        Young, Shuttlesworth, William Moore, Martin Luther King.'
