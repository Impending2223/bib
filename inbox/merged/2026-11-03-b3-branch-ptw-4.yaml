      c: 'Sidney Smyer, by telephone, to Burke Marshall at the White House: the Senior Citizens will lie low a few days, for
        their families'' safety, but stand by the agreement. Then to Birmingham''s reporters: prominent people are promoting
        turbulence "to shove the city into martial law"; under it "the community is under the heel of the military." Hanes:
        "the nigger King ought to be investigated"; of Robert Kennedy, "I hope that every drop of blood that''s spilled he
        tastes in his throat."'
      n: '[[w.branch-parting-the-waters]], 799. To check: Edwin Guthman, notebook headed "Mother''s Day," 1963, Guthman Papers
        (cited by [[w.branch-parting-the-waters]], 799 n.3); New York Times, May 13, 1963, 24 (cited by [[w.branch-parting-the-waters]],
        799 nn.1-2); Birmingham News, May 13, 1963, 3 (cited by [[w.branch-parting-the-waters]], 799 n.4). See [[cal.1963-05-11.alabama]].
        Names: Burke Marshall, Martin Luther King, Robert Kennedy.'
      tags:
