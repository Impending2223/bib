      when: July 16
      date: '1963-07-16'
      thread: antisubversion
      also:
      - king
      - civil-rights-bill
      c: 'Morning. Robert Kennedy and Burke Marshall, by an emergency call, give Courtney Evans less than an hour to identify
        those with King in the Highlander photograph Barnett and Wallace showed the Senate. Evans''s report: Highlander no
        Communist training school; King there once, to speak; of those pictured only Abner Berry of the *Daily Worker* a Communist.'
      n: '[[w.branch-parting-the-waters]], 853-54. To check: Evans to Belmont, July 16, 1963, FK-166 (cited by [[w.branch-parting-the-waters]],
        853 n.3); Jones to DeLoach, July 16, 1963, FK-164, from Bland to Sullivan, July 13, 1963, FK-160 (cited by [[w.branch-parting-the-waters]],
        854 n.1). See [[cal.1963-07-15.civil-rights-bill]]. Names: Robert Kennedy, Burke Marshall, Evans, Martin Luther King,
        Barnett, Wallace.'
