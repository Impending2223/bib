- cite:
    id: cal.1963-06-22.civil-rights-bill
    item: '[[w.branch-parting-the-waters]], 835-41'
- check:
    id: cal.1963-06-22.civil-rights-bill
    text: 'Check: Branch, 835-41: King with the President at 10:10 a.m., the group at 10:30 (the appointments log, 837 n.2);
      Burke Marshall first, Levison "a paid agent of the Soviet Communist apparatus"; then Robert Kennedy; in the Rose Garden
      the President: "I assume you know you''re under very close surveillance," O''Dell "the number five Communist in the
      United States," Levison his "handler," Profumo and Macmillan; in the Cabinet Room his poll, 60 to 47 percent, "I may
      lose the next election because of this. I don''t care"; Wilkins and the Leadership Conference to lobby; to Whitney Young,
      "We want success in the Congress, not a big show on the Capitol"; Randolph: "There will be a march"; Johnson for corridor
      politics; King: "Some people thought Birmingham was ill-timed." "Including the Attorney General." The New York Times:
      "Negroes Inform Kennedy of Plan for New Protests." Wilkins of the march: "That little baby does not belong to me."'
