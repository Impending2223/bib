      when: May 10
      date: '1963-05-10'
      thread: king
      also:
      - alabama-birmingham
      c: 'Levison, overheard by the FBI: with Robert Kennedy, the prisoners a "secondary issue"; "I''m damn sure that for
        the kind of victory this represents, people will be delighted to serve a term"; the Kennedys'' "new policy," private
        maneuver behind public neutrality, "It''s right, and it''s wrong," "impermissible for Washington not to be involved."
        To Clarence Jones: "the Administration made a mistake by not intervening."'
      n: '[[w.branch-parting-the-waters]], 787-88. To check: FBI intercepts of Levison''s telephone, 9:50 a.m., FLNY-9-163,
        and 2:17 p.m., FLNY-7-417a, May 10, 1963 (cited by [[w.branch-parting-the-waters]], 788 nn.1-2). Check: Branch tells
        these with Thursday''s talks; the intercepts are of Friday, May 10. See [[cal.1963-05-09.civil-rights-the-executive]].
        Names: Levison, Robert Kennedy.'
      tags:
      - name:levison-stanley-d
      - name:kennedy-robert-f
      src:
