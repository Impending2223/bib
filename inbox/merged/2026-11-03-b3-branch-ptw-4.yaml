- add:
    entry:
      id: cal.1963-05-08.alabama-birmingham-4
      when: May 8
      date: '1963-05-08'
      thread: alabama-birmingham
      c: 'The night''s mass meeting, Sixth Avenue Baptist, Bevel alone speaking. Nineteen rabbis, sent from a rabbinical conference,
        march to the rostrum. A New Jersey rabbi: "We came to applaud your courage and dignity in your struggle for everyone."
        Rabbi Alex Shapiro: "Our people are your people." Officer Allison to Connor: "they really gave us the treatment."'
      n: '[[w.branch-parting-the-waters]], 785. To check: Birmingham police notes on mass meeting, May 8, 1963, Bull Connor
        Papers (cited by [[w.branch-parting-the-waters]], 785 nn.2-3). See [[cal.1963-05-08.alabama-birmingham]]. Names: Connor.'
      tags:
      - name:connor-eugene
