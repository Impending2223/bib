    text: 'Check: Branch, 737-44: begun in the margins of the Birmingham News of Apr. 13; Clarence Jones carries the pages
      out Tuesday, Apr. 16; Walker dictates and types the twenty pages; the typed letter addressed to seven of the eight signers,
      Bishop Paul Hardin left off (744, 738 n.1); no mention of it in the press for a month; offered for *Friends*, June.'
