      when: June 15
      date: '1963-06-15'
      thread: mississippi
      c: 'Jackson. After the Evers funeral''s silent march, five thousand, some hundred young people defy the court order
        and march downtown singing; police with shotguns, pumper trucks and dogs club several and arrest nearly thirty; 103
        degrees. Doar walks into the bricks and bottles, hands raised: "My name is John Doar! ... I''m in the Justice Department
        in Washington. And anybody around here knows that I stand for what''s right!" The crowd disperses. Pairs had been
        arrested for carrying flags on Flag Day, June 14.'
      n: '[[w.branch-parting-the-waters]], 826-27. To check: Evers memorial march, June 15, 1963, Pacifica Radio Archive,
        tape 4817 (cited by [[w.branch-parting-the-waters]], 826 n.3); New York Times, June 16, 1963, 1 (cited by [[w.branch-parting-the-waters]],
        826 n.4); interviews: John Doar, May 12, 1986 (cited by [[w.branch-parting-the-waters]], 826 n.2). See [[cal.1963-06-12.mississippi]].
        Names: Doar, Evers.'
