- check:
    id: cal.1963-04-08.mississippi
    text: 'Check: Branch, 745, cites Marshall''s memorandum of Apr. 8 (Lee White Papers, box 23) for its rebuttal of the Civil
      Rights Commission''s draft report: one dog bit one preacher at Greenwood, "The use of police dogs is not a prohibited
      activity"; of the beatings, one worker "pistol-whipped by the registrar of Walthall County," in which Justice "brought
      a successful case." One memorandum or two?'
- add:
    entry:
      id: cal.1963-04-10.civil-rights-the-executive
      when: Apr. 10
      date: '1963-04-10'
      thread: civil-rights-the-executive
      also:
      - mississippi
      c: 'Lee White to the President on the Civil Rights Commission''s draft report on Mississippi, each "Charge" with an
        "Answer" from Burke Marshall: "Implicit is the suggestion that the President and the Administration have not done
        all that could be done for the Mississippi situation. This, of course, is manifestly wrong." Its "harmful effects":
        it could "kill the bill to extend the life of the Commission" and "destroy the Commission''s reputation for reasonableness."'
      n: '[[w.branch-parting-the-waters]], 745-46. To check: White to Kennedy, Apr. 10, 1963, Lee White Papers, box 23, JFK
        Library (cited by [[w.branch-parting-the-waters]], 745 n.3). See [[cal.1963-04-08.mississippi]]. Names: White, Burke
        Marshall, Kennedy.'
      tags:
      - name:white-lee-c
      - name:marshall-burke
      - name:kennedy-john-f
      src:
        c: a2c8a1a3
        rows:
        - 'w.branch-parting-the-waters 745-46: all'
        - 'via w.branch-parting-the-waters 745 n.3: all'
- add:
    entry:
      id: cal.1963-04.civil-rights-the-executive-3
      when: Apr., before the 16th
      date: '1963-04'
      thread: civil-rights-the-executive
      also:
      - mississippi
      c: 'The President with Bernhard, the Civil Rights Commission''s staff director, on the draft report: why the commissioners
        do not see it would "poison an atmosphere that is already pretty bad"; the Federal Aviation Agency denies the new
        Jackson airport will have segregated rest rooms and lunch counters. He does not ask that the report be withdrawn.'
      n: '[[w.branch-parting-the-waters]], 746. To check: Berl Bernhard and Najeeb Halaby, oral histories, JFK Library (cited
        by [[w.branch-parting-the-waters]], 746 n.1). Check: the day. See [[cal.1963-04-10.civil-rights-the-executive]]. Names:
        Kennedy, Bernhard.'
      tags:
      - name:kennedy-john-f
      - name:bernhard-berl-i
      src:
        c: 3246b806
        rows:
        - 'w.branch-parting-the-waters 746: all'
        - 'via w.branch-parting-the-waters 746 n.1: all'
- add:
    entry:
      id: cal.1963-04.civil-rights-the-executive-2
      when: Apr., before the 16th
      date: '1963-04'
      thread: civil-rights-the-executive
      also:
      - mississippi
      c: Hannah and Bernhard at the White House on the report. The commission has the architect's drawings of the Jackson
        airport, a partitioned lunch room and two sets of rest rooms; the Administration concedes segregation there but none
        in the federally aided runways and control tower. The President orders no changes; asks to handle the press announcements.
      n: '[[w.branch-parting-the-waters]], 746. To check: Nathaniel H. Goodrich to White, Apr. 10, 1963; Kennedy, press statement,
        Apr. 19, 1963, Lee White Papers, box 23, JFK Library; Najeeb Halaby and Lee White, oral histories, JFK Library (cited
        by [[w.branch-parting-the-waters]], 746 n.2). Check: the day. See [[cal.1963-04-10.civil-rights-the-executive]]. Names:
        Hannah, Bernhard, Kennedy.'
      tags:
      - name:hannah-john-a
      - name:bernhard-berl-i
      - name:kennedy-john-f
      src:
        c: b928e066
        rows:
        - 'w.branch-parting-the-waters 746: all'
        - 'via w.branch-parting-the-waters 746 n.2b: all'
        - 'via w.branch-parting-the-waters 746 n.2c: B'
- add:
    entry:
      id: cal.1963-04-16.civil-rights-the-executive
      when: Apr. 16
      date: '1963-04-16'
      thread: civil-rights-the-executive
      also:
      - mississippi
      - press-and-broadcasting
      c: 'The Civil Rights Commission''s interim report on Mississippi released: the commissioners "concluded unanimously
        that only further steps by the Federal Government can arrest the subversion of the Constitution in Mississippi," the
        President to "explore his legal authority" to withhold federal funds. The President, privately to White House reporters,
        draws attention to the funds; his aides tell reporters the cutoff impractical, unconstitutional and cruel to Mississippi''s
        Negroes. The *New York Times*, Apr. 17: "President Urged to Cut Off Funds for Mississippi."'
      n: '[[w.branch-parting-the-waters]], 746-47. To check: New York Times, Apr. 17, 1963, 1 (cited by [[w.branch-parting-the-waters]],
        747 n.1); New York Times, Apr. 18, 34, Apr. 19, 1963, 42 (cited by [[w.branch-parting-the-waters]], 747 n.2). See
        [[cal.1963-04-10.civil-rights-the-executive]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 515bc3d9
        rows:
        - 'w.branch-parting-the-waters 746-47: all'
        - 'via w.branch-parting-the-waters 747 n.1: C'
        - 'via w.branch-parting-the-waters 747 n.2: B'
