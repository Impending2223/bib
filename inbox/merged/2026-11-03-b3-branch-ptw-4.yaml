      when: May 8
      date: '1963-05-08'
      thread: robert-kennedy
      also:
      - alabama-birmingham
      c: 'Robert Kennedy to Belafonte in New York, by Belafonte''s account: could he raise $5,000 in cash that day for King''s
        bond? Belafonte gathers it from friends, the banks closed; by evening the money is on its way, but Walker has not
        confirmed that King wants out. King means to stay jailed until the movement''s two thousand prisoners are freed with
        him; Kennedy, irked, tells Belafonte to stand by.'
      n: '[[w.branch-parting-the-waters]], 784-85. To check: interviews: Harry Belafonte, Mar. 6-7, 1985 (cited by [[w.branch-parting-the-waters]],
        784 n.2, 785 n.1); Kunstler, *Deep in My Heart*, 192, "somewhat differently" (cited by [[w.branch-parting-the-waters]],
        784 n.2); Levison and Kunstler, FBI intercept, May 19, 1963, FLNY-9-172a (cited by [[w.branch-parting-the-waters]],
        785 n.1). See [[cal.1963-05-08.alabama-birmingham-3]]. Names: Robert Kennedy, Martin Luther King.'
      tags:
      - name:kennedy-robert-f
      - name:king-martin-luther-jr
      src:
