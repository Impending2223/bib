- add:
    entry:
      id: cal.1963-05-04.alabama-birmingham-2
      when: May 4
      date: '1963-05-04'
      thread: alabama-birmingham
      c: 'Saturday. Walker''s surprise at city hall, five blocks from the church: a banner, "Love God and Thy Neighbor"; Connor
        jails all twenty-five, then a woman and a girl who kneel to pray, and orders all "strolling Negroes" near city hall
        arrested or dispersed. He seals off two churches; some 150 arrested. Rocks from the crowd in Kelly Ingram Park; the
        monitor guns. Bevel, with a police lieutenant''s bullhorn, clears the corner: "If you''re not going to demonstrate
        in a nonviolent way, then leave!" He suspends the marches for Sunday.'
      n: '[[w.branch-parting-the-waters]], 764-65. To check: New York Times, May 5, 1963, 1; Birmingham News, May 4, 1963,
        2 (cited by [[w.branch-parting-the-waters]], 764 n.6). Check: Bevel''s quarrel with Walker that day, King''s truce
        between them, and King''s flight to Atlanta to preach at Ebenezer Sunday (765). See [[cal.1963-05-02.alabama]]. Names:
        Connor.'
      tags:
      - name:connor-eugene
      - state:al
      - city:birmingham
      src:
        c: 0a51f237
        rows:
        - 'w.branch-parting-the-waters 764-65: all'
        - 'via w.branch-parting-the-waters 764 n.6a: all'
        - 'via w.branch-parting-the-waters 764 n.6b: all'
- add:
    entry:
      id: cal.1963-05-05.alabama-birmingham
      when: May 5
      date: '1963-05-05'
      thread: alabama-birmingham
      c: 'Sunday, the truce day, King in Atlanta. New Pilgrim Church, the afternoon mass meeting, two thousand; police arrest
        Guy and Candie Carawan on the steps. Bevel: "We''re tired of this mess! ... Let''s not march. Let''s just walk." Billups
        leads the congregation five blocks toward the city jail; at the barricade, Connor in the hoses, they kneel. Billups:
        "Turn on your water! Turn loose your dogs! We will stand here ''til we die!" The firemen do not turn on the hoses.
        Walker to two captains: a prayer in the Negro park across the street; granted.'
      n: '[[w.branch-parting-the-waters]], 765-68. To check: Birmingham police notes on mass meeting, May 5, 1963, Bull Connor
        Papers (cited by [[w.branch-parting-the-waters]], 766 nn.1-2); New York Times, May 6, 1963, 1; [[w.king-why-we-cant-wait]],
        101; Birmingham World, May 8, 1963, 1; [[w.morris-origins-of-the-civil]], 267-69; [[w.forman-making-of-black-revolutionaries]],
        312; Wyatt Walker, speech, May 25, 1963, Pacifica Radio Archive, tape 0388 (cited by [[w.branch-parting-the-waters]],
        767 n.2). Check: Connor''s words, "Dammit! Turn on the hoses," some heard (767). See [[cal.1963-05-04.alabama-birmingham-2]].
        Names: Connor.'
      tags:
      - name:connor-eugene
      - state:al
      - city:birmingham
      src:
        c: fd4c5e12
        rows:
        - 'w.branch-parting-the-waters 765-68: all'
        - 'via w.branch-parting-the-waters 766 n.1: B'
        - 'via w.branch-parting-the-waters 766 n.2: C'
