      when: May 7
      date: '1963-05-07'
      thread: alabama-birmingham
      also:
      - king
      - civil-rights-the-executive
      c: 'The night''s mass meeting, three churches. Bevel: "We intend to have the fire department pumping water tomorrow.
        Wear your swimsuit if you want to." King: "We are not going to stop this movement until we have moved segregation
        from this city"; Wallace''s troopers coming in; "The hour has come for the Federal Government to take a forthright
        stand on segregation ... I am not criticizing the President, but we are going to have to help him"; "We need to call
        on the President to sign a paper saying that segregation is unconstitutional."'
      n: '[[w.branch-parting-the-waters]], 779-80. To check: Birmingham police notes of mass meeting, May 7, 1963, Bull Connor
        Papers (cited by [[w.branch-parting-the-waters]], 779 n.5). See [[cal.1963-05-07.alabama-birmingham]]. Names: Martin
        Luther King, Wallace, Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:wallace-george-c
