        308; New York Times, May 2, 1963, 18; Watters, *Down to Now*, 243ff. (cited by [[w.branch-parting-the-waters]], 754
        n.1). See [[cal.1963-04-23.alabama]]. Names: William Moore, Zellner, Forman, Nash.'
