        - 'via w.branch-parting-the-waters 761 n.2: B-C'
- add:
    entry:
      id: cal.1963-05-03.alabama-birmingham-3
      when: May 3
      date: '1963-05-03'
      thread: alabama-birmingham
      c: 'Mayor Boutwell: "irresponsible and unthinking agitators" have made "tools" of children; "The respectable people
        of Birmingham, white or colored, did not create this danger. ... We are innocent victims." Judge Talbot Ellis of the
        juvenile court: those who "misled these kids" "ought to be put under the jail."'
      n: '[[w.branch-parting-the-waters]], 761-62. Check: the day; Branch gives no source. See [[cal.1963-05-03.alabama-birmingham]].
        Names: Boutwell.'
      tags:
      - name:boutwell-albert
      - state:al
      - city:birmingham
      src:
        c: 1a4817f4
        rows:
        - 'w.branch-parting-the-waters 761-62: all'
- add:
    entry:
      id: cal.1963-05-03.civil-rights-the-executive
      when: May 3
      date: '1963-05-03'
      thread: civil-rights-the-executive
      also:
      - alabama-birmingham
      - robert-kennedy
      c: 'Robert Kennedy''s statement on Birmingham: "Continued refusal to grant equal rights and opportunities to Negroes
        makes increasing turmoil inevitable. However, the timing of the present demonstrations is open to question. School
        children participating in street demonstrations is a dangerous business. An injured, maimed or dead child is a price
        that none of us can afford to pay." A local matter, for "good faith negotiations, and not in the streets."'
      n: '[[w.branch-parting-the-waters]], 762. Check: Branch gives no source; the statement''s text. See [[cal.1963-05-03.alabama-birmingham]].
        Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      src:
        c: cdb10b4d
        rows:
        - 'w.branch-parting-the-waters 762: all'
- add:
    entry:
