      also:
      - king
      c: 'Morning. Shuttlesworth, out of the hospital in its tags, against King''s one-day moratorium: "While the water is
        hot, scald him on both sides"; at the Drews'' house, before Burke Marshall, he threatens to lead the children back
        into the streets; "You''re Mister Big, but you''re going to be Mister S-H-I-T!" King: "We''ve got to have unity, Burke."
        After a talk alone with King, Shuttlesworth announces the truce: "We do believe that honest efforts to negotiate in
        good faith are under way." 178 reporters in town, by Walker''s count.'
      n: '[[w.branch-parting-the-waters]], 782-83. To check: Raines, *My Soul Is Rested*, 170-72; [[w.garrow-bearing-the-cross]],
        256-57; Fred Shuttlesworth, oral history, King Library; interviews: Edward Gardner, Jan. 21, 1986, Burke Marshall,
        June 27, 1984 (cited by [[w.branch-parting-the-waters]], 782 nn.1-3); Wyatt Walker, speech, May 25, 1963, Pacifica
        Radio Archive, tape 0388 (cited by [[w.branch-parting-the-waters]], 783 n.1); Birmingham News, May 8, 1963, 1 (cited
        by [[w.branch-parting-the-waters]], 783 n.2). See [[cal.1963-05-07.civil-rights-the-executive]]. Names: Shuttlesworth,
        Martin Luther King, Burke Marshall.'
      tags:
