- add:
    entry:
      id: cal.1963-04-13.alabama-birmingham-2
      when: Apr. 13
      date: '1963-04-13'
      thread: alabama-birmingham
      c: 'The *Birmingham News*, page 2, under photographs of King and Abernathy marching: "White Clergymen Urge Local Negroes
        to Withdraw from Demonstrations." Eight white clergymen, Bishop C. C. J. Carpenter first, who carried it to the papers:
        the demonstrations "unwise and untimely"; the police commended for "the calm manner in which these demonstrations
        have been handled"; "We do not believe that these days of new hope are days when extreme measures are justified in
        Birmingham." Thirteen short paragraphs.'
      n: '[[w.branch-parting-the-waters]], 737-38, 741. See [[cal.1963-04-16.alabama-birmingham]]. Names: Martin Luther King,
        Abernathy.'
      tags:
      - name:king-martin-luther-jr
