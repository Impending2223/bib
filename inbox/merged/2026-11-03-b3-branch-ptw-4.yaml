      when: May 7
      date: '1963-05-07'
      thread: civil-rights-the-executive
      also:
      - alabama-birmingham
      c: 'Through the afternoon Burke Marshall gives Robert Kennedy the names of executives for members of the Cabinet or
        the President to lobby; the President makes several calls: no way out but settlement. At the White House he meets
        Sorensen, Katzenbach, Lee White, Doar, Bernhard and Louis Martin on Birmingham. His press office: he is "closely monitoring
        events" and "continues to hope the situation can be resolved by the people of Birmingham themselves." Hatcher, on
        Hanson''s telegram: "We are not sitting idly by. We just can''t say anything."'
      n: '[[w.branch-parting-the-waters]], 778. To check: Burke Marshall, oral history, 99-101; Robert Kennedy, oral history,
        760-62, JFK Library (cited by [[w.branch-parting-the-waters]], 778 n.1); Birmingham News, May 8, 1963, 1 (cited by
        [[w.branch-parting-the-waters]], 778 n.2). Check: whom the President called. See [[cal.1963-05-07.civil-rights-the-executive]].
        Names: Burke Marshall, Robert Kennedy, Kennedy, Sorensen, Katzenbach, White, Doar, Bernhard, Hatcher.'
      tags:
      - name:marshall-burke
      - name:kennedy-robert-f
      - name:kennedy-john-f
