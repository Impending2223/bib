      c: 'King with Walker, Shuttlesworth, Bevel and others, in private: the minimum age of the jail volunteers drifts down.
        Bevel''s formula: any child old enough to join a church may march to jail, over the parents'' objections; "Against
        your Mama, you have a right to make this witness." To Porter and others who object to the high school children, King:
        something dramatic, the press losing interest.'
