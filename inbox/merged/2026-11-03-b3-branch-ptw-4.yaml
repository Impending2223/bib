      c: 'Clarence B. Hanson, publisher of the *Birmingham News*, back from the Chamber of Commerce, telegraphs the President
        and splashes it across the final edition, the first front-page mention of King in five weeks: "Mr. President, if these
        were white marches ... we believe your Administration would have taken vigorous action to discourage them"; "If there
        is to be order, and respect for law ... you, sir, must be the one to bring it." Inside: "Negro Mobs Break Through
        Police: Swarm Over Downtown Area."'
      n: '[[w.branch-parting-the-waters]], 777-78. To check: Birmingham News, May 8, 1963, 1 (cited by [[w.branch-parting-the-waters]],
        777 n.2). Check: the edition''s date (Branch: "that afternoon''s final edition"; the note gives May 8). See [[cal.1963-05-07.civil-rights-the-executive]].
        Names: Kennedy, Martin Luther King.'
      tags:
      - name:kennedy-john-f
