- add:
    entry:
      id: cal.1963-05-03.alabama-birmingham-2
      when: May 3
      date: '1963-05-03'
      thread: alabama-birmingham
      c: 'A. G. Gaston, Birmingham''s leading Negro businessman, by telephone with David Vann, the two complaining of King''s
        demonstrations, breaks off at his window over Kelly Ingram Park: "But lawyer Vann! They''ve turned the fire hoses
        on a little black girl. And they''re rolling that girl right down the middle of the street."'
      n: '[[w.branch-parting-the-waters]], 759. To check: Gaston and Vann, interviews for "Eyes on the Prize," no. 4; interviews:
        David Vann, Aug. 1, 1986 (cited by [[w.branch-parting-the-waters]], 759 n.1). See [[cal.1963-05-03.alabama-birmingham]].'
      tags:
