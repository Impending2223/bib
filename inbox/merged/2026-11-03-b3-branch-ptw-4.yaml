      c: 'St. John''s Church, the night''s mass meeting, some two thousand. Abernathy: "Tonight is victory night ... there
        isn''t but one Martin Luther King!" King reads his statement and the timetable; "Do not underestimate the power of
        this movement!"; "Mr. Kennedy ... is battling for the minds and the hearts of men in Asia and Africa ... and they
        aren''t gonna respect the United States of America if she deprives men and women of the basic rights of life because
        of the color of their skin." Belafonte: three thousand New Yorkers ready to picket the White House.'
      n: '[[w.branch-parting-the-waters]], 790-91. To check: Birmingham police notes on mass meeting, May 10, 1963, Bull Connor
        Papers; Donald H. Smith, tape 4, Smith Papers, State Historical Society of Wisconsin (cited by [[w.branch-parting-the-waters]],
        790 n.2). See [[cal.1963-05-10.alabama]]. Names: Abernathy, Martin Luther King, Kennedy.'
