      c: 'Saturday night, Moose Club Park outside Birmingham. More than a thousand robed Klansmen burn a cross: "Fight the
        niggers!" Imperial Wizard Robert Shelton: "Martin Luther King has not gained one thing in Birmingham, because the
        white people are not going to tolerate the meddlesome, conniving, manipulating moves of these professional businessmen!"
        Two reporters of Radio Riverside, WRVR, record it.'
      n: '[[w.branch-parting-the-waters]], 792-93. To check: WRVR-FM, "Testament of Nonviolence," parts 2 and 6, Donald H.
        Smith Papers, State Historical Society of Wisconsin (cited by [[w.branch-parting-the-waters]], 792 n.4). See [[cal.1963-05-10.alabama]].
        Names: Martin Luther King.'
