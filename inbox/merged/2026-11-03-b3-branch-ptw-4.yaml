      also:
      - king
      c: 'Wilkins, to Kheel of the Gandhi Society, to Mordecai Johnson and to King, by letter: Myrlie Evers has agreed in
        writing that funds in her husband''s name be controlled by the NAACP, not "King''s organization." June 14, Kheel and
