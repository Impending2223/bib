patch: b3-branch-ptw-4
by: Claude (batch 3 reading agent, branch1; Branch, Parting the Waters, pp. 729-922, Nov. 3-4, 2026)
ops:
- check:
    id: cal.1963-04-12.alabama
    text: 'Check: Branch, 730-31: King and Abernathy step off from the Sixteenth Street Baptist Church nearly three hours
      late with about forty jailgoers; "more than a thousand shouting, singing Negroes" along the route (New York Times, Apr.
      13); fifty-two jailed behind them; King held in solitary, no calls to his lawyers.'
- add:
    entry:
      id: cal.1963-04-12.georgia-albany
      when: Apr. 12
      date: '1963-04-12'
      thread: georgia-albany
      c: Columbus, Ga. A jury, out less than ninety minutes, clears Sheriff L. Warren Johnson of civil liability for beating
        and shooting Charlie Ware, a prisoner in his car, in 1961; C. B. King's suit for Ware. On the jury Carl Smith, owner
        of one of the three white grocery stores in Albany's Harlem that the Albany Movement pickets for refusing to hire
        Negroes.
      n: '[[w.branch-parting-the-waters]], 731-32 (*Ware v. Johnson*). To check: C. B. King''s case files; FBI reports on
        the Albany picket lines, File 157-6-2, serials 1013, 1040, File 157-4-2, serial 165; interviews: C. B. King, July
        10, 1985, B. C. Gardner, July 11, 1985 (cited by [[w.branch-parting-the-waters]], 731 n.3). Check: the court and the
        five-day trial''s dates. See [[cal.1963-08-09.georgia-albany]].'
      tags:
      - state:ga
      - city:albany-ga
      src:
        c: b2384bbd
        rows:
        - 'w.branch-parting-the-waters 731-32: all'
        - 'via w.branch-parting-the-waters 731 n.3a: all'
        - 'via w.branch-parting-the-waters 731 n.3b: all'
- add:
    entry:
      id: cal.1963-04-20.georgia-albany
      when: Apr. 20
      date: '1963-04-20'
      thread: georgia-albany
      c: Albany, Ga. Albany Movement students picket Carl Smith's grocery, eight days after the Ware verdict, against a store
        that denies jobs to Negroes. Pritchett's police break up the line within the hour, several arrested.
      n: '[[w.branch-parting-the-waters]], 731-32. To check: FBI reports on the Albany picket lines, File 157-6-2, serials
        1013, 1040 (cited by [[w.branch-parting-the-waters]], 731 n.3). See [[cal.1963-04-12.georgia-albany]].'
      tags:
      - state:ga
      - city:albany-ga
      src:
        c: fafaaa80
        rows:
        - 'w.branch-parting-the-waters 731-32: all'
        - 'via w.branch-parting-the-waters 731 n.3d: all'
- add:
    entry:
      id: cal.1963-04.georgia-albany
      when: Apr., after the 20th
      date: '1963-04'
      thread: georgia-albany
      c: B. C. Gardner, for Carl Smith, sues the Albany Movement's leaders for driving Smith out of business by an illegal
        boycott. He tells the local bar association, the FBI, the trial judge and Burke Marshall that the Negroes punished
        Smith for his vote on the Ware jury.
      n: '[[w.branch-parting-the-waters]], 731-32. To check: interviews: B. C. Gardner, July 11, 1985 (cited by [[w.branch-parting-the-waters]],
        731 n.3). Check: the day, the suit''s court. See [[cal.1963-04-12.georgia-albany]]. Names: Burke Marshall.'
      tags:
      - name:marshall-burke
      - state:ga
      - city:albany-ga
      src:
        c: ab8ab6a9
        rows:
        - 'w.branch-parting-the-waters 731-32: all'
        - 'via w.branch-parting-the-waters 731 n.3b: all'
- add:
    entry:
