- check:
    id: cal.1963-05-10.alabama
    text: 'Check: Branch, 790-91: announced Friday afternoon at the Gaston Motel; Shuttlesworth: "The City of Birmingham has
      reached an accord with its conscience," then faints and is taken to Holy Family Hospital; King''s timetable that night:
      the sitting rooms by Monday, a biracial committee in fifteen days, rest rooms and fountains in thirty, lunch counters
      and Negro clerks in sixty; Boutwell not bound by it; Hanes: a "capitulation by certain weak-kneed white people."'
