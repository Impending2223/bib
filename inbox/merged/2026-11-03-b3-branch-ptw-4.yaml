      when: May 8
      date: '1963-05-08'
      thread: alabama-birmingham
      also:
      - king
      c: 'King and Abernathy, at a hearing on their parade convictions of Good Friday: a local judge sets their appeal bonds
        at the new maximum, $2,500 each; unwilling and unable to pay, they are taken to jail. A. D. King to the press: the
        truce is void; huge demonstrations by day''s end. Robert Kennedy, by telephone, turns Shuttlesworth from leading Bevel''s
        reserves downtown.'
      n: '[[w.branch-parting-the-waters]], 784. To check: Vincent Harding, "A Beginning in Birmingham," *The Reporter*, June
        6, 1963, 17 (cited by [[w.branch-parting-the-waters]], 784 n.1). Check: the judge; the hour. See [[cal.1963-04-12.alabama]].
        Names: Martin Luther King, Abernathy, Robert Kennedy, Shuttlesworth.'
