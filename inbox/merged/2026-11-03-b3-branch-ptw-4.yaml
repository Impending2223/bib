      c: 'The White House, 8 p.m., the President and Robert Kennedy at dinner. Burke Marshall by telephone, an aide''s notes:
        "The meeting worked. The meeting of all the businessmen worked. Now if [it] holds w/ Negroes, we''re over the hump.
        They''ve had a hell of a day, & we''ve got to make it stick." The Senior Citizens, a handful dissenting, empower a
        committee to negotiate.'
      n: '[[w.branch-parting-the-waters]], 780. To check: handwritten note headed "8 pm, May 7," Edwin Guthman Papers; Burke
        Marshall, oral history, 102, JFK Library (cited by [[w.branch-parting-the-waters]], 780 n.2). See [[cal.1963-05-07.civil-rights-the-executive]].
        Names: Kennedy, Robert Kennedy, Burke Marshall.'
