    text: 'Check: Branch, 756-58: D-Day; shortly after 1 p.m. fifty teenagers out of the Sixteenth Street Baptist Church two
      abreast, line after line; Sheriff Bailey''s deputies and school buses called in; over by four; King that night: 958
      signed up for jail, some 600 in custody; Branch''s note gives the New York Times, "May 3, 1962," 1.'
