      when: Apr. 15
      date: '1963-04-15'
      thread: alabama-birmingham
      also:
      - king
      - robert-kennedy
      c: 'Clarence Jones at King''s cell, Monday afternoon: Belafonte has raised $50,000 for bail bonds, and more if needed.
        King in solitary since Friday, no mattress, no calls. Belafonte and Walker run a telephone and telegram campaign on
        the Administration; Robert Kennedy to Belafonte, by Belafonte''s and Jones''s account: "Tell Reverend King we''re
        doing all we can, but I''m not sure we can get into prison reform at this moment."'
      n: '[[w.branch-parting-the-waters]], 735. To check: [[w.king-why-we-cant-wait]], 75 (cited by [[w.branch-parting-the-waters]],
        735 nn.2-3); Walker to Kennedy, telegrams, Apr. 13 and 14, 1963, Name File, box 1478, JFK Library (cited by [[w.branch-parting-the-waters]],
        735 n.4); interviews: Harry Belafonte, Mar. 6-7, 1985, Clarence Jones, Nov. 25, 1983 (cited by [[w.branch-parting-the-waters]],
        735 n.5). Check: the day of Belafonte''s call. See [[cal.1963-04-12.alabama]]. Names: Martin Luther King, Robert Kennedy.'
      tags:
      - name:king-martin-luther-jr
      - name:kennedy-robert-f
