      c: 'After the President''s news conference: Wallace knows of no negotiations to compromise segregation, nor that Hanes
        and Connor could approve of any; Hanes challenges Boutwell to admit he is in them. Wallace''s troopers drill in Kelly
        Ingram Park; Connor''s men padlock the Sixteenth Street Baptist Church.'
      n: '[[w.branch-parting-the-waters]], 784. Check: Branch gives no source. See [[cal.1963-05-07.alabama-birmingham]].
        Names: Wallace, Connor, Boutwell.'
