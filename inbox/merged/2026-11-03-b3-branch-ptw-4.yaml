      c: 'Connor to the Radio Riverside reporters on King: "He''s the only one that''s caused any violence. You can quote
        me as saying that if you put ''son of a bitch'' in front of it. ... The biggest racketeer that ever hit America. Shakedown
        artist ... He''s down there in the pool room now, preaching nonviolence." King tours the Negro taverns and pool halls.'
