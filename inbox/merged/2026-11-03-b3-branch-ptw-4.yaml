      c: 'William Moore, a white Baltimore postman, at the White House gate with a letter for the President: ten days'' leave
        to walk from Chattanooga to Mississippi wearing two signboards, END SEGREGATION IN AMERICA and EQUAL RIGHTS FOR ALL
        MEN. The guards refuse it. His postscript: "Keep up your fight against the Cuban war hawks. And read over your Senate
        speeches on Vietnam!" He pickets on the sidewalk, then mails it.'
      n: '[[w.branch-parting-the-waters]], 748. To check: William Moore to Kennedy, Mar. 2, 1963, Lee White Papers, box 21,
        JFK Library (cited by [[w.branch-parting-the-waters]], 748 n.1). Check: the letter''s date (Branch''s note gives Mar.
        2). See [[cal.1963-04-23.alabama]]. Names: William Moore, Kennedy.'
