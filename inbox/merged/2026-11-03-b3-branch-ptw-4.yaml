      also:
      - king
      c: 'Wilkins, in a public speech, as the Evers funeral train runs to Washington: "The other organizations furnish the
        noise and get the publicity, while the NAACP furnishes the manpower and pays the bills. ... They are here today and
        gone tomorrow"; "Don''t go giving them your money when it should be given to us."'
