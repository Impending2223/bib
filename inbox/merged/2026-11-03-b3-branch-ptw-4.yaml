- check:
    id: cal.1963-06-11.civil-rights-bill
    text: 'Check: Branch, 823-24: the President''s idea that Tuesday; O''Donnell and O''Brien against it, Sorensen fearing
      the haste; toward six he orders fifteen minutes of network time at eight; Sorensen''s draft from the President''s ideas
      and scraps of Louis Martin''s ("That was Louie Martin''s speech," Lee White); no finished text; "Come on now, Burke.
      You must have some ideas." Robert Kennedy alone encouraged it, by Marshall''s memory; by Robert Kennedy''s, his brother
      "just decided that day."'
