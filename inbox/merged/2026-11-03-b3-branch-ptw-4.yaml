      when: May 3
      date: '1963-05-03'
      thread: civil-rights-the-executive
      also:
      - alabama-birmingham
      - king
      c: 'Burke Marshall to King by telephone, in the morning and again after the hoses: the demonstrations to be suspended,
        the Negroes'' rock-throwing having added to the violence. King refuses. Gaston has told Marshall of the girl hosed
        down the street.'
      n: '[[w.branch-parting-the-waters]], 762. Check: Branch gives no source for the calls. See [[cal.1963-05-03.alabama-birmingham]].
        Names: Burke Marshall, Martin Luther King.'
      tags:
      - name:marshall-burke
      - name:king-martin-luther-jr
      src:
        c: 9218a798
        rows:
        - 'w.branch-parting-the-waters 762: all'
- add:
    entry:
      id: cal.1963-05-03.alabama-birmingham-4
      when: May 3
      date: '1963-05-03'
      thread: alabama-birmingham
      also:
      - king
      c: 'The night''s mass meeting, Sixteenth Street, packed; an hour to pass the plates. Young: "We have a nonviolent movement,
        but it''s not nonviolent enough"; "We must not boo the police when they bring up the dogs." King: "not only did they
        stand up in the water, they went UNDER the water!"; Birmingham on NBC''s Huntley-Brinkley; "Now yesterday was D-Day,
        and tomorrow will be Double-D Day!"; the four demands; of the jailed children, "Don''t worry about them."'
      n: '[[w.branch-parting-the-waters]], 762-64. To check: Birmingham police notes on mass meeting, May 3, 1963, Bull Connor
        Papers; tape recording of King''s speech, May 3, 1963, Birmingham Public Library (cited by [[w.branch-parting-the-waters]],
        763 nn.1-2). See [[cal.1963-05-03.alabama-birmingham]]. Names: Young, Martin Luther King.'
      tags:
      - name:young-andrew-j-jr
      - name:king-martin-luther-jr
      - state:al
      - city:birmingham
      src:
        c: 2be00171
        rows:
        - 'w.branch-parting-the-waters 762-64: all'
        - 'via w.branch-parting-the-waters 763 n.1: all'
        - 'via w.branch-parting-the-waters 763 n.2: C-F'
- add:
    entry:
      id: cal.1963-05-03.alabama-birmingham-5
      when: May 3
      date: '1963-05-03'
      thread: alabama-birmingham
      c: 'Past midnight, King and his advisers plan Saturday''s march: at least another five hundred to jail, around Connor''s
        blockades. That night whites hang an effigy of King in the courtyard of a Catholic church.'
      n: '[[w.branch-parting-the-waters]], 764. To check: FBI intercept of Levison''s telephone, May 4, 1963, FLNY-9-157a
        (cited by [[w.branch-parting-the-waters]], 764 n.1); L. H. Baily, memorandum, May 4, 1963, Bull Connor Papers (cited
        by [[w.branch-parting-the-waters]], 764 n.2). See [[cal.1963-05-03.alabama-birmingham-4]]. Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      - state:al
      - city:birmingham
