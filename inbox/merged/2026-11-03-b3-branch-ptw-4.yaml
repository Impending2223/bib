      when: May 1
      date: '1963-05-01'
      thread: alabama
      also:
      - civil-rights-organizations
      c: Two marches take up William Moore's walk. Ten chosen by CORE and SNCC, Zellner, Bill Hansen, Jesse Harris and Sam
        Shirah among them, Forman observing, from Chattanooga toward Jackson; Diane Nash Bevel, Paul Brooks and six others
        from where Moore fell toward Birmingham. Alabama troopers arrest all eighteen, and Forman. Sitton and Foster Hailey
        of the *New York Times* follow them.
