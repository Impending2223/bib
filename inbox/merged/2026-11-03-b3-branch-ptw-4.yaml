      c: 'Some three thousand pickets outside the Justice Department. Robert Kennedy speaks to them: demonstrations unnecessary,
        the Administration on their side. Shouted questions on Greenwood and Winona, placards on Justice''s own hiring. Kennedy:
        "Individuals will be hired according to their ability, not their color." Jeers.'
