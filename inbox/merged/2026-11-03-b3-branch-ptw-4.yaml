        - 'via w.branch-parting-the-waters 732 n.1: A-B'
- add:
    entry:
      id: cal.1963-04-12.civil-rights-organizations
      when: Apr. 12
      date: '1963-04-12'
      thread: civil-rights-organizations
      also:
      - voting-rights
      - mississippi
      c: 'Atlanta, Gammon Theological Seminary. SNCC''s fourth general conference, some 350 students. Sherrod: to keep the
        Albany Movement going, "we are willing to pick cotton, scrub floors, wash cars and windows, babysit, etcetera, for
        food and lodging." Moses, the featured speech: "what you need is not five hundred but five thousand going down"; universal
        suffrage, the start of SNCC''s "One man/one vote" campaign; the danger of "fighting for some things" that help only
        "the black bourgeoisie." Forman: SNCC to be "challenging the political structure of the country."'
      n: '[[w.branch-parting-the-waters]], 732-34. To check: [[w.carson-in-struggle]], 81-82; [[w.forman-making-of-black-revolutionaries]],
        305-7 (cited by [[w.branch-parting-the-waters]], 733 nn.1-2). Check: the conference''s days. Names: Moses, Forman.'
      tags:
      - name:moses-robert-p
      - name:forman-james
      - state:ga
      - city:atlanta
      src:
        c: 4d4bab77
        rows:
        - 'w.branch-parting-the-waters 732-34: all'
- add:
    entry:
      id: cal.1963-04-12.alabama-birmingham
      when: Apr. 12
      date: '1963-04-12'
      thread: alabama-birmingham
      c: 'The night''s mass meeting, Sixteenth Street Baptist Church, some three hundred, two police detectives with their
        recorders. Bevel, summoned from Greenwood by King, preaches: "The police can come to our meeting ... but if you want
        to be free, there is nothing they can do about it"; walk to the courthouse, walk to jail; "The Negro has been sitting
        here dead for three hundred years. It is time he got up and walked."'
      n: '[[w.branch-parting-the-waters]], 734-35. To check: Birmingham police notes on mass meeting, Apr. 12, 1963, Bull
        Connor Papers, Birmingham Public Library (cited by [[w.branch-parting-the-waters]], 734 n.1). See [[cal.1963-04-12.alabama]].'
      tags:
      - state:al
      - city:birmingham
      src:
        c: 76546f69
        rows:
        - 'w.branch-parting-the-waters 734-35: all'
        - 'via w.branch-parting-the-waters 734 n.1a: all'
        - 'via w.branch-parting-the-waters 734 n.1b: all'
