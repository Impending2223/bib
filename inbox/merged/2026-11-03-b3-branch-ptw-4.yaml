    item: '[[w.branch-parting-the-waters]], 758-61'
- check:
    id: cal.1963-05-03.alabama-birmingham
    text: 'Check: Branch, 758-61: Captain G. V. Evans, on Connor''s orders, has sixty marchers hosed at Fifth Avenue and Seventeenth
      Street; the monitor guns; bystanders'' rocks hit two firemen and Life''s photographer Charles Moore; eight K-9 units,
      three teenagers bitten badly enough for the hospital; the AP photograph of Walter Gadsden, fifteen, at the Jockey Boy
      restaurant; some 250 arrested; a truce at three o''clock.'
