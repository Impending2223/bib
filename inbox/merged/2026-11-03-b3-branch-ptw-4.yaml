    text: 'Check: Branch, 781: the night''s talks at the Drews'' credited to Andrew Young: the dressing rooms desegregated
      at once, the lunch counters at sixty days or with the schools, whichever first; by 4 a.m. "at least a blueprint for
      a settlement."'
