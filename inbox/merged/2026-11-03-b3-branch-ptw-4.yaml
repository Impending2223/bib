      when: Apr. 30
      date: '1963-04-30'
      thread: georgia-albany
      also:
      - civil-rights-the-executive
      c: 'Burke Marshall to Robert Kennedy, the "Monday Report": complaints from Albany, Ga., of "an organized Negro boycott
        against a grocery store owned by a white man who had sat on a jury"; a grand jury likely, Anderson of the Albany Movement
        among those to be indicted. More than thirty FBI agents interview scores of Albany''s Negroes.'
      n: '[[w.branch-parting-the-waters]], 732. To check: Marshall to Robert Kennedy, "Monday Report," Apr. 30, 1963, Burke
        Marshall Papers, box 16, JFK Library (cited by [[w.branch-parting-the-waters]], 732 n.1). Check: the day the agents
        were detailed. See [[cal.1963-04-12.georgia-albany]]. Names: Burke Marshall, Robert Kennedy, Anderson.'
      tags:
      - name:marshall-burke
      - name:kennedy-robert-f
      - name:anderson-william-g
      - state:ga
      - city:albany-ga
      src:
