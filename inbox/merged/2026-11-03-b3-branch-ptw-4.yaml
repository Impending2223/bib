- add:
    entry:
      id: cal.1963-04-20.alabama-birmingham
      when: Apr. 20
      date: '1963-04-20'
      thread: alabama-birmingham
      also:
      - king
      c: 'King and Abernathy out on bond after nearly nine days. King, bearded, an impromptu press conference: out to confer
        with his lawyers before the contempt trial Monday; in jail he read two smuggled books, McGill''s *The South and the
