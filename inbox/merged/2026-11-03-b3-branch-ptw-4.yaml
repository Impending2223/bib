    units: A-B
- check:
    id: cal.1963-06-12.mississippi
    text: 'Check: Branch, 824-25: home past midnight from a strategy session, all but nine of the seven hundred jailed out;
      shot in the back from a honeysuckle stand by a .30-06 deer rifle, the bullet through the window to the refrigerator;
      his last words, "Sit me up! ... Turn me loose!"; dead an hour later. Evers had asked to invite King; the NAACP ignored
      it.'
