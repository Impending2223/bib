    text: 'Check: Branch, 788-89: King asks Belafonte for some $90,000 in cash; Reuther to Rauh, "we need to get a hundred
      and sixty thousand dollars to Birmingham by morning"; Robert Kennedy, at the White House, gets half from Meany out of
      two AFL-CIO departmental accounts, $40,000 from McDonald of the Steelworkers, Reuther''s share from the Auto Workers,
      and talks the delivery over with Goldberg; Michael Quill''s deliveryman brings Belafonte $50,000 in a satchel while
      Kennedy is on the line.'
