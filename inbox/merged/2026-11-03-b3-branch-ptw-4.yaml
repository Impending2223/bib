- check:
    id: cal.1963-05-07.civil-rights-the-executive
    text: 'Check: Branch, 775-80: seventy of the "big mules" at the Chamber of Commerce before noon; an old ex-governor, the
      industrial committee''s chairman, for martial law under Wallace; Burke Marshall against it, the "root of the demonstrations"
      a denial of constitutional rights; recessed for lunch amid the demonstrators, reassembled in the afternoon; "only a
      handful of dissenting votes"; the white committee led by the board chairman of Royal Crown Cola negotiates with Shores,
      Gaston and President L. H. Pitts of Miles College, then at midnight with King at the Drews'' house, Smyer leading a
      prayer; Boutwell''s assistant, Billy Hamilton, drops out.'
