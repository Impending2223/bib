      date: '1963-06-24'
      thread: king
      also:
      - antisubversion
      c: 'New York, King''s hotel room, Monday night: O''Dell, Walker, Young, Kilgore, Clarence Jones and Fauntroy, Levison
        away in Ecuador. King on the Washington warnings: of the President''s "agents of a foreign power," "I checked him
        on that." Young: Marshall suggested that Levison and O''Dell sue the FBI. O''Dell: "Hoover can kiss my ass! I am not
        the issue!" King: "when Burke Marshall, the Attorney General, and the President of the United States all come down
        on you in one day, you have to consider that."'
      n: '[[w.branch-parting-the-waters]], 844-45. To check: interviews: Jack O''Dell, July 1, 1986; Clarence Jones, Oct.
        25, 1983, and Aug. 18, 1986; Harry Belafonte, Mar. 6-7, 1985 (cited by [[w.branch-parting-the-waters]], 844 n.1).
        See [[cal.1963-06-22.civil-rights-bill]]. Names: O''Dell, Young, Levison, Kennedy, Burke Marshall, Robert Kennedy,
        Martin Luther King, Hoover.'
