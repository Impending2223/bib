- add:
    entry:
      id: cal.1963-05-05.civil-rights-the-executive
      when: May 5
      date: '1963-05-05'
      thread: civil-rights-the-executive
      also:
      - alabama-birmingham
      c: 'Sunday night, downtown. Burke Marshall''s scouting groups: Smyer, Vann and several white merchants with Negroes
        led by Shores and Gaston. The Negroes hold to King''s four points as the price of ending the demonstrations; the whites
        reject all four. Marshall: keep talking; King "did not know what he wanted."'
      n: '[[w.branch-parting-the-waters]], 768. To check: Corley, "The Quest for Racial Harmony," 263-65; [[w.garrow-bearing-the-cross]],
        251-52; interviews: Burke Marshall, June 27, 1984 (cited by [[w.branch-parting-the-waters]], 768 n.3). Marshall to
        the President, May 12, recorded: the whites'' "whole desire"; "They want Birmingham to look like Atlanta" ([[w.branch-parting-the-waters]],
        768; the tape, cited by [[w.branch-parting-the-waters]], 768 n.2). See [[cal.1963-05-04.alabama-birmingham]]. Names:
        Burke Marshall, Shores, Martin Luther King, Kennedy.'
      tags:
      - name:marshall-burke
      - name:shores-arthur-d
      - name:king-martin-luther-jr
      - name:kennedy-john-f
      - state:al
      - city:birmingham
      src:
        c: e6725759
        rows:
        - 'w.branch-parting-the-waters 768: all'
        - 'via w.branch-parting-the-waters 768 n.3a: A-C'
        - 'via w.branch-parting-the-waters 768 n.3c: D'
- add:
    entry:
      id: cal.1963-05-21.civil-rights-the-executive
      when: May 21
      date: '1963-05-21'
      thread: civil-rights-the-executive
      also:
      - alabama-birmingham
      - robert-kennedy
      c: 'The White House, recorded. Robert Kennedy on Birmingham: "the Negro leadership didn''t know what they were demonstrating
        about. They didn''t know whether they were demonstrating to get rid of Bull Connor or whether they were demonstrating
        about the stores ... none of the white community knew what they were demonstrating about"; King''s stand on the prisoners
        "doesn''t really make a lot of sense." The government''s own segregated work force: the businessmen asked, "Why should
        we hire Negroes? You don''t hire Negroes." Macy''s figures: of 405 Treasury employees in Nashville, four Negroes,
        all clerks; of 249 at Agriculture, two; of 114 at Labor and Commerce, none. Better to act early than "just wait until
        they flare up."'
      n: '[[w.branch-parting-the-waters]], 769, 787, 807. To check: [Kennedy, Robert Kennedy, Macy, Marshall, White and Sorensen,
        May 21](https://prde.upress.virginia.edu/conversations/4006755), JFK Meeting Tape 88.6 (PRDE only) (Branch''s "Cabinet
        meeting, May 21, 1963, Audiotape 88.6," cited by [[w.branch-parting-the-waters]], 769 n.1, 787 n.2, 807 nn.4-5). Check:
        the meeting (Branch: "the full cabinet"; PRDE lists six speakers). See [[cal.1963-05-21.alabama-schools]]. Names:
        Robert Kennedy, Connor, Martin Luther King, Macy.'
      tags:
      - name:kennedy-robert-f
      - name:connor-eugene
      - name:king-martin-luther-jr
      - name:macy-john-w-jr
      src:
        c: e6e20b15
        rows:
        - 'w.branch-parting-the-waters 769, 787, 807: all'
        - 'via w.branch-parting-the-waters 769 n.1: A'
        - 'via w.branch-parting-the-waters 787 n.2: A'
        - 'via w.branch-parting-the-waters 807 n.4: B'
        - 'via w.branch-parting-the-waters 807 n.5: C-D'
- add:
    entry:
      id: cal.1963-05-06.alabama-birmingham
      when: May 6
      date: '1963-05-06'
      thread: alabama-birmingham
      also:
      - civil-rights-the-executive
      - king
      c: 'John Drew''s house, Monday morning. Burke Marshall, two and a half hours, to King: the afternoon''s demonstrations
        will hinder the negotiations; the merchants fear prosecution under the segregation ordinances until the courts choose
        between Boutwell and Connor. King: the merchants can prevail on any city government; he will not stop on the promise
        of later talks. To reporters at noon, the meeting instructive, fruitless.'
      n: '[[w.branch-parting-the-waters]], 769-70. To check: King, interview by Donald H. Smith, Dec. 1963, Smith Papers,
        State Historical Society of Wisconsin (cited by [[w.branch-parting-the-waters]], 769 n.4). See [[cal.1963-05-05.civil-rights-the-executive]].
        Names: Burke Marshall, Martin Luther King, Boutwell, Connor.'
      tags:
      - name:marshall-burke
      - name:king-martin-luther-jr
      - name:boutwell-albert
      - name:connor-eugene
      - state:al
      - city:birmingham
      src:
        c: 1bf92a2c
        rows:
        - 'w.branch-parting-the-waters 769-70: all'
        - 'via w.branch-parting-the-waters 769 n.4: C'
- add:
    entry:
      id: cal.1963-05-06.alabama-birmingham-2
      when: May 6
      date: '1963-05-06'
      thread: alabama-birmingham
      c: 'Kelly Ingram Park sealed off, school buses waiting. Dick Gregory leads the first nineteen children out of the Sixteenth
        Street Baptist Church; ten a minute for nearly two hours, singing, to the wagons and buses, adults more than half.
        Five officers throw a Negro woman to the pavement before the photographers. King''s aides call a halt at 2:40 p.m.:
        nearly eight hundred to jail from the church, more than two hundred from pickets downtown. The *Chicago Defender*:
        BIGGEST MARCH STUNS BIRMINGHAM!'
      n: '[[w.branch-parting-the-waters]], 770-72. To check: Birmingham News, May 6, 1963, 2; Len Holt, "Eyewitness: The Police
        Terror at Birmingham," Manchester Guardian, May 16, 1963 (cited by [[w.branch-parting-the-waters]], 770 n.1). Check:
        the Defender''s date; the New York Times, May 7: "Birmingham Jails 1,000 More Negroes" (772). See [[cal.1963-05-02.alabama]].
        Names: Gregory.'
      tags:
      - name:gregory-dick
      - state:al
      - city:birmingham
      src:
        c: 48a990be
        rows:
        - 'w.branch-parting-the-waters 770-72: all'
        - 'via w.branch-parting-the-waters 770 n.1b: all'
        - 'via w.branch-parting-the-waters 770 n.1c: all'
- add:
    entry:
      id: cal.1963-05-04.king
      when: May 4
      date: '1963-05-04'
      thread: king
      also:
      - press-and-broadcasting
      c: 'New York, overheard by the FBI. Levison with O''Dell, Saturday afternoon: a fund-raising advertisement in the papers,
        the first since 1960. O''Dell: the mass mailings show a shift in public opinion, returns many times the expected,
        a woman in Queens $3,000, money from Canada.'
      n: '[[w.branch-parting-the-waters]], 771. To check: FBI intercept of Levison''s telephone, May 4, 1963, FLNY-9-157a
        (cited by [[w.branch-parting-the-waters]], 771 n.1). Names: Levison, O''Dell.'
      tags:
      - name:levison-stanley-d
      - name:odell-jack-h
      - state:ny
      - city:nyc
      src:
        c: f37a41dd
        rows:
        - 'w.branch-parting-the-waters 771: all'
        - 'via w.branch-parting-the-waters 771 n.1: all'
- add:
    entry:
      id: cal.1963-05-06.press-and-broadcasting
      when: May 6
      date: '1963-05-06'
      thread: press-and-broadcasting
      also:
      - king
      c: 'The *New York Times* refuses SCLC''s fund-raising advertisement, by the agency''s word to Levison at 1:45 p.m.:
        "the bastards at the Times wouldn''t print the ad." Clarence Jones, from the Times''s lawyers, 3:49 p.m.: "they want
        to take out references to brutality and all strong references to segregation and discrimination in Birmingham." By
        5:10 p.m. Levison settles on an ad calling Birmingham "one of the largest segregated cities in the Western Hemisphere."'
      n: '[[w.branch-parting-the-waters]], 771-72. To check: FBI intercepts of Levison''s telephone, 1:45, 3:49 and 5:10 p.m.,
        May 6, 1963, FLNY-7-413a (cited by [[w.branch-parting-the-waters]], 771 nn.2-3, 772 n.1). See [[cal.1963-05-04.king]].
        Names: Levison.'
      tags:
      - name:levison-stanley-d
      src:
        c: eb8b54b6
        rows:
        - 'w.branch-parting-the-waters 771-72: all'
        - 'via w.branch-parting-the-waters 771 n.2: A'
        - 'via w.branch-parting-the-waters 771 n.3: B'
        - 'via w.branch-parting-the-waters 772 n.1: C'
- add:
    entry:
      id: cal.1963-05-06.alabama-birmingham-3
      when: May 6
      date: '1963-05-06'
      thread: alabama-birmingham
      also:
      - king
      c: 'The night''s mass meeting overflows St. James Baptist into three more churches, five to ten thousand; a record $40,000
        offering. Forman makes King see the children penned at the fairgrounds in the rain; King asks the police to shelter
        them and calls Burke Marshall on the "political prisoners." Abernathy: "on the threshold of freedom"; "if Bobby doesn''t
        do anything about it, I''m gonna call Jack." King: "you are certainly making history ... Never in the history of this
        nation have so many people been arrested for the cause of freedom"; some twenty-five hundred in jail.'
      n: '[[w.branch-parting-the-waters]], 772-74. To check: Birmingham police notes on mass meeting, May 6, 1963, Bull Connor
        Papers; Guy and Candie Carawan, "Birmingham, Alabama, 1963: Mass Meeting," Folkways Records 5487 (cited by [[w.branch-parting-the-waters]],
        772 n.2, 773 n.1); interviews: Edward Gardner, Jan. 21, 1986 (cited by [[w.branch-parting-the-waters]], 772 n.3);
        [[w.forman-making-of-black-revolutionaries]], 312-13 (cited by [[w.branch-parting-the-waters]], 772 n.4). See [[cal.1963-05-06.alabama-birmingham-2]].
        Names: Forman, Martin Luther King, Burke Marshall, Abernathy.'
      tags:
      - name:forman-james
      - name:king-martin-luther-jr
      - name:marshall-burke
      - name:abernathy-ralph-david
      - state:al
      - city:birmingham
