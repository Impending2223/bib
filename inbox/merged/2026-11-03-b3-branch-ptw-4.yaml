      when: June 10
      date: '1963-06-10'
      thread: march-on-washington
      also:
      - king
      - civil-rights-bill
      c: '12:01 a.m., a conference call, overheard by the FBI: King, Abernathy, Levison, Jones, Walker and Young on a march
        on Washington. King: "something dramatic must be done" for the President''s bill, "I don''t think it will pass otherwise.
        It will get him off the hook"; "I''ve had mixed emotions about the President." Agreed: to aim at the Southern filibuster
        in the Senate, Jones dissenting; to win Randolph privately and announce, Wilkins not consulted first. Young: Annell
        Ponder may have been arrested.'
      n: '[[w.branch-parting-the-waters]], 820. To check: conference call, FBI intercept, 12:01 a.m., June 10, 1963, FLNY-9-194;
        intercepts of June 4 and 6, 1963, FLNY-7-442a, FLNY-9-190 (cited by [[w.branch-parting-the-waters]], 820 n.1). See
        [[cal.1963-06-01.march-on-washington]]. Names: Martin Luther King, Abernathy, Levison, Young, Kennedy, Randolph, Wilkins.'
      tags:
