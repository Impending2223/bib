- check:
    id: cal.1963-04-15.alabama-birmingham
    text: 'Check: Branch, 735-36: Kennedy returns Coretta King''s calls to the White House switchboard, after two calls from
      Robert Kennedy; the jailers then let King call her, the police wiretap on the line; the Birmingham police deny the FBI
      saw King; the Washington Star''s lead editorial, "Just a Bit Phony."'
