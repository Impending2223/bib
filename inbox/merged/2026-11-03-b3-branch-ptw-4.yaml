    text: 'Check: Branch, 831-32: Thompson, "I think the world of you"; Kennedy, "full permission to denounce me in public
      as long as you don''t in private"; Thompson: "the power" is not R. L. T. Smith but G. R. Haughton; Branch puts Haughton''s
      presentation "the next night"; his note gives the mass meeting of June 18 (Tape 4817), the calls "possibly June 17."
      Haughton: "I''m not getting one penny"; Arthur Jones for the NAACP: "if we want freedom for Medgar''s sake, we still
      don''t want a Birmingham."'
