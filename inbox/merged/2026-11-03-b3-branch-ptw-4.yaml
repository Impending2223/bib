      n: '[[w.branch-parting-the-waters]], 803. To check: Cleveland Plain Dealer, May 14, 10, May 15, 1963, 1; Cleveland Call
        and Post, May 18, 1963, 1, 2, 16; Jet, May 30, 1963, 17, 24-25; King and Levison, FBI intercept, May 19, 1963, FLNY-9-172
        (cited by [[w.branch-parting-the-waters]], 803 n.1). Check: the day (Branch: "By then King was in Cleveland. It was
        May 15"). Names: Martin Luther King.'
