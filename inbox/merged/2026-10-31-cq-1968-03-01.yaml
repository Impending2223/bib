- add:
    entry:
      id: cal.1968-02-19.opinion
      when: Feb. 19
      date: '1968-02-19'
      thread: opinion
      also:
      - elections-1968-polls
      c: 'Harris, released Feb. 19. Republicans'' choice, Nixon or Rockefeller: Nixon 61 percent, Rockefeller 31, undecided 8; Nixon or Romney: Nixon 68, Romney 21, undecided 11. All voters: Johnson 48, Nixon 43, undecided 9; Johnson 46, Rockefeller 41, undecided 13.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 425. To check: the Harris Survey as the papers printed it, Feb. 19, 1968. Names: Nixon, Rockefeller, Romney, Johnson.'
      tags:
      - name:nixon-richard-m
      - name:rockefeller-nelson
      - name:romney-george-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-02-26.opinion
      when: Feb. 26
      date: '1968-02-26'
      thread: opinion
      also:
      - elections-1968-polls
      c: 'Harris, released Feb. 26. With Wallace as a third candidate: Johnson 47 percent, Nixon 38, Wallace 10, undecided 5.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 425. To check: the Harris Survey as the papers printed it, Feb. 26, 1968. Names: Johnson, Nixon, Wallace. Check: CQ prints a second three-way race released the same day, Johnson 44, the Republican 36, Wallace 12, undecided 8, under the row Nixon; which Republican.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - name:wallace-george-c
- add:
    entry:
      id: cal.1968-02-21.opinion-2
      when: Feb. 21
      date: '1968-02-21'
      thread: opinion
      also:
      - elections-1968
      c: 'South Dakota. The South Dakota Poll, in the *Sioux Falls Argus-Leader* and other papers: McGovern (D) 71 percent, Boe (R) 24; McGovern 70, Gubbrud (R) 27; in December, 60 to 36 and 66 to 29. For the Republican nomination for governor, Farrar 59, Bartron 19; in December, 70 to 8.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 425–26. Names: McGovern, Boe, Gubbrud.'
      tags:
      - name:mcgovern-george
      - name:boe-nils-a
      - name:gubbrud-archie
      - state:sd
- add:
    entry:
      id: cal.1968-02-25.opinion-2
      when: Feb. 25
      date: '1968-02-25'
      thread: opinion
      also:
      - elections-1968-polls
      - georgia
      c: 'Georgia. A poll for a client not named, in the *Atlanta Journal* and *Constitution*: Johnson 41 percent, Nixon 41, undecided 9; with Wallace, Johnson 37, Nixon 29, Wallace 28, undecided 9.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 426 (the figures for Reagan, Rockefeller and Romney there too). Names: Johnson, Nixon, Wallace.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - name:wallace-george-c
      - state:ga
- add:
    entry:
      id: cal.1968-02-26.legislatures-ny
      when: Feb. 26
      date: '1968-02-26'
      thread: legislatures
      also:
      - elections-1968
      c: New York. Rockefeller signs the bill redistricting the State's 41 congressional districts, the legislature's final action less than 90 minutes before; the three-judge court's deadline, Mar. 1. Twenty-nine districts altered, 26 of them in New York City and on Long Island. Edna Kelly's Brooklyn district eliminated; Bingham's in the Bronx extended into Manhattan.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 421. To check: the act, the session laws of 1968. Names: Rockefeller, Kelly, Bingham.'
      tags:
      - name:rockefeller-nelson
      - name:kelly-edna-f
      - name:bingham-jonathan-b
      - state:ny
- add:
    entry:
      id: cal.1968-02.elections-1968-sd
      when: Feb.
      date: 1968-02
      thread: elections-1968
      c: 'South Dakota. The legislature amends the presidential primary law: unpledged slates on the ballot; a pledged slate bound until its candidate falls below 35 percent of the convention''s vote, three ballots pass, or he releases it. Farrar, the attorney general: the act not in force until May, after the Apr. 20 filing deadline; the 1967 law to govern the June 4 primary.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 421. To check: the act, the session laws of 1968. Check: the day of the act and of Farrar''s ruling.'
      tags:
      - state:sd
- add:
    entry:
      id: cal.1968-02-17.elections-1968
      when: Feb. 17
      date: '1968-02-17'
      thread: elections-1968
      c: New Hampshire. Beckett, of the University of New Hampshire, an assistant budget director under Eisenhower, announces a write-in for Rockefeller in the Mar. 12 primary, against Rockefeller's wishes.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 415. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-02-10.elections-1968
      when: Feb. 10
      date: '1968-02-10'
      thread: elections-1968
      c: New Hampshire. Reagan's backers call off a write-in for him in the Mar. 12 primary.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 415. Names: Reagan.'
      tags:
      - name:reagan-ronald
- add:
    entry:
      id: cal.1968-02-27.elections-1968
      when: Feb. 27
      date: '1968-02-27'
      thread: elections-1968
      c: 'Washington, a news conference. The candidates'' managers on their budgets for New Hampshire: Nixon $200,000 to $250,000; Romney $275,000; the Rockefeller write-in, $14,000 hoped for; McCarthy over $60,000 or $70,000, perhaps $100,000; Johnson about $50,000.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 416 (Romney''s, a later figure, by Hall). Names: Nixon, Romney, Rockefeller, McCarthy, Johnson.'
      tags:
      - name:nixon-richard-m
      - name:romney-george-w
      - name:rockefeller-nelson
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-02-24.elections-1968
      when: Feb. 24
      date: '1968-02-24'
      thread: elections-1968
      c: 'Detroit, after a fund-raising luncheon for Romney. Rockefeller: he would accept the Republican nomination if drafted at the convention.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 418. Names: Rockefeller, Romney.'
      tags:
      - name:rockefeller-nelson
      - name:romney-george-w
- add:
    entry:
      id: cal.1968-02-28.elections-1968-2
      when: Feb. 28
      date: '1968-02-28'
      thread: elections-1968
      also:
      - republican-party
      c: 'Washington. Rockefeller, arriving after Romney''s statement: "not a candidate"; Romney''s withdrawal "a great loss for the party. He was my candidate." Chafee, chairman of the Republican Governors Association, to call a caucus of the governors at the Governors'' Conference.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 418. See [[cal.1968-02-28.elections-1968]]. Names: Rockefeller, Romney, Chafee.'
      tags:
      - name:rockefeller-nelson
      - name:romney-george-w
      - name:chafee-john-h
- add:
    entry:
      id: cal.1968-02-29.elections-1968
      when: Feb. 29
      date: '1968-02-29'
      thread: elections-1968
      c: 'Rockefeller on a draft: "I haven''t discouraged anyone. I haven''t taken a position." No plans "at the present time" to enter the primaries.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 418. See [[cal.1968-02-24.elections-1968]]. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-02-21.elections-1968
      when: Feb. 21
      date: '1968-02-21'
      thread: elections-1968
      c: 'Amherst, N.H. Romney: the administration''s reading of the Tet offensive "incredible"; Nixon "buys the line" that it was a last effort of the Viet Cong.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 419. Names: Romney, Nixon.'
      tags:
      - name:romney-george-w
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-02-22.elections-1968
      when: Feb. 22
      date: '1968-02-22'
      thread: elections-1968
      c: New Hampshire, at Mount St. Mary College. Romney proposes a standing U.N. peace-keeping force of 10,000 under the Security Council; American technicians, not combat troops, for it.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 419. Names: Romney.'
      tags:
      - name:romney-george-w
- add:
    entry:
      id: cal.1968-02-21.elections-1968-2
      when: Feb. 21
      date: '1968-02-21'
      thread: elections-1968
      also:
      - defense
      c: 'Rhinelander, Wis. Nixon: McNamara has long accepted "nuclear parity"; American land-based launchers fixed, the Soviet land-based missiles from 340 to 720 in a year. In a taped interview: the country "cannot tolerate" a long war.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 420 (Portsmouth, N.H., Feb. 23, the same). Names: Nixon, McNamara.'
      tags:
      - name:nixon-richard-m
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1968-02-23.elections-1968
      when: Feb. 23
      date: '1968-02-23'
      thread: elections-1968
      also:
      - vietnam-congress
      c: 'Berlin, N.H. McCarthy: the administration "deceived" the public on the Gulf of Tonkin; its account "less than accurate." His headquarters'' statement: the destroyers "part of a South Vietnamese military action."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 385, 420. See [[cal.1968-02-20.vietnam]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-02-21.elections-1968-3
      when: Feb. 21
      date: '1968-02-21'
      thread: elections-1968
      c: 'McCarthy: the men who died in Vietnam did not die because he and others spoke against the war; "They died carrying out military operations under the orders of the President."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 420. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-02-20.elections-1968
      when: Feb. 20
      date: '1968-02-20'
      thread: elections-1968
      c: 'Pennsylvania. McCarthy lets his name stand on the Democratic ballot of Apr. 23, the only Democrat entered. Barr: Johnson''s supporters plan no write-in.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 421. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:pa
- add:
    entry:
      id: cal.1968-02-22.republican-party
      when: Feb. 22
      date: '1968-02-22'
      thread: republican-party
      also:
      - elections-1968-miami
      c: 'The convention''s arrangements committee lets Bliss appoint the officers, members and staff of the platform committee. Bliss: "one person is going to have to be boss"; Dirksen expected as its sole chairman; the governors had asked for Shafer as cochairman.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 422 (Chafee with Dirksen and Bliss, Feb. 19, no agreement). Names: Bliss, Dirksen, Shafer.'
      tags:
      - name:bliss-ray-c
      - name:dirksen-everett
      - name:shafer-raymond-p
- add:
    entry:
      id: cal.1968-02-24.republican-party
      when: Feb. 24
      date: '1968-02-24'
      thread: republican-party
      c: 'The Republican State chairmen ask the nominee to keep Bliss as national chairman through the campaign. Bliss: a drive for Negro, Jewish and other minority voters in the ten largest States, 255 electoral votes; the nationalities division restored; Katzen his assistant for Jewish voters.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 422–23. Names: Bliss.'
      tags:
      - name:bliss-ray-c
- add:
    entry:
      id: cal.1968-02-19.republican-party
      when: Feb. 19
      date: '1968-02-19'
      thread: republican-party
      c: 'Chafee: the Republican Governors Association to hold hearings on the platform in Washington, Little Rock, Albuquerque, Seattle and a Midwestern city; Chafee, Rockefeller, Shafer, Love and Babcock to conduct them.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 423. Names: Chafee, Rockefeller, Shafer, Love, Babcock.'
      tags:
      - name:chafee-john-h
      - name:rockefeller-nelson
      - name:shafer-raymond-p
      - name:love-john-a
      - name:babcock-tim-m
- add:
    entry:
      id: cal.1968-02-24.democratic-party
      when: Feb. 24
      date: '1968-02-24'
      thread: democratic-party
      also:
      - georgia
      c: 'Atlanta, a regional Democratic conference. Maddox: Georgia and much of the South will not stay in the party without "an equitable and just voice"; "our views" in the platform. Bailey, the national chairman: "one-issue Democrats" to be brought back after the convention.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 423. Names: Maddox.'
      tags:
      - name:maddox-lester
- add:
    entry:
      id: cal.1968-02-22.elections-1968-ky
      when: Feb. 22
      date: '1968-02-22'
      thread: elections-1968
      c: 'Kentucky. Morton (R) will not seek a third term in the Senate: "track sore."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 424. Names: Morton.'
      tags:
      - name:morton-thruston-b
      - state:ky
- add:
    entry:
      id: cal.1968-02-25.elections-1968-va
      when: Feb. 25
      date: '1968-02-25'
      thread: elections-1968
      c: Virginia. Porter Hardy (D), of the 2nd District, Norfolk and Portsmouth, in the House since 1947, will not seek re-election.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 424. Names: Hardy.'
      tags:
      - name:hardy-porter-jr
      - state:va
- add:
    entry:
      id: cal.1968-02-27.elections-1968-il
      when: Feb. 27
      date: '1968-02-27'
      thread: elections-1968
      also:
      - democratic-party
      c: 'Illinois. The Democratic slatemakers, Daley deciding: Shapiro, the lieutenant governor, for governor; William G. Clark, the attorney general, against Dirksen. Adlai Stevenson III and Shriver passed over. Mikva over Barratt O''Hara in the 2nd District.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 423–24. Names: Daley, Shapiro, Dirksen, Adlai E. Stevenson III, Shriver, O''Hara.'
      tags:
      - name:daley-richard-j
      - name:shapiro-samuel-h
      - name:dirksen-everett
      - name:stevenson-adlai-e-iii
      - name:shriver-r-sargent
      - name:ohara-barratt
      - state:il
- add:
    entry:
      id: cal.1968-02-27.elections-1968-ny
      when: Feb. 27
      date: '1968-02-27'
      thread: elections-1968
      c: New York. Javits will seek a third term.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 424 (Abram to Brandeis, Feb. 22, out of the race for the Democratic nomination). Names: Javits.'
      tags:
      - name:javits-jacob-k
      - state:ny
- add:
    entry:
      id: cal.1968-02-23.elections-1968-wi
      when: Feb. 23
      date: '1968-02-23'
      thread: elections-1968
      c: Wisconsin. Percy files an affidavit that he is not a candidate, taking his name off the Republican primary ballot of Apr. 2; Nixon, Romney, Reagan and Stassen left on it.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 426 (Rockefeller''s name taken off Feb. 16). Names: Percy, Nixon, Romney, Reagan, Stassen.'
      tags:
      - name:percy-charles-h
      - name:nixon-richard-m
      - name:romney-george-w
      - name:reagan-ronald
      - name:stassen-harold-e
      - state:wi
- add:
    entry:
      id: cal.1968-02-21.elections-1968-oh
      when: Feb. 21
      date: '1968-02-21'
      thread: elections-1968
      also:
      - labor
      c: Ohio. The State AFL-CIO's Committee on Political Education endorses Gilligan over Lausche for the Democratic Senate nomination, May 7. Lausche had refused to appear before its screening committee.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 426. Names: Gilligan, Lausche.'
      tags:
      - name:gilligan-john-j
      - name:lausche-frank-j
      - state:oh
- add:
    entry:
      id: cal.1968-02-24.elections-1968-ca
      when: Feb. 24
      date: '1968-02-24'
      thread: elections-1968
      c: California. Reagan names the 86 delegates of his favorite-son slate for the June 4 primary, William French Smith at its head; Knowland and Salvatori on it.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 423. Names: Reagan, Knowland.'
      tags:
      - name:reagan-ronald
      - name:knowland-william-f
      - state:ca
- add:
    entry:
      id: cal.1968-02-24.elections-1968-state-conventions
      when: Feb. 24
      date: '1968-02-24'
      thread: elections-1968-state-conventions
      c: Oklahoma. The Republican State convention names Bartlett its favorite son and chooses ten delegates. Of the State's 22, 17 believed for Nixon, 5 for Reagan.
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 426 (twelve chosen at the district conventions, Feb. 10). Names: Bartlett, Nixon, Reagan.'
      tags:
      - name:bartlett-dewey-f
      - name:nixon-richard-m
      - name:reagan-ronald
      - state:ok
- add:
    entry:
      id: cal.1968-02-27.congress
      when: Feb. 27
      date: '1968-02-27'
      thread: congress
      c: 'The House, H.R. 11308, the National Foundation on the Arts and the Humanities extended a year: passed, 272–123. Ashbrook''s amendment cuts the authorization from the committee''s $135 million for two years to $11.2 million for 1969, 118–65 by tellers; the Gibbons amendment so amended, 261–130. Steiger''s amendment, no grants to individuals, 111–92 by tellers.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 380–81. Names: Ashbrook, Gibbons, Steiger.'
      tags:
      - name:ashbrook-john-m
      - name:gibbons-sam-m
      - name:steiger-william-a
- add:
    entry:
      id: cal.1968-02-20.economy-gold
      when: Feb. 20
      date: '1968-02-20'
      thread: economy-gold
      c: 'Senate Banking and Currency reports S. 2857, the gold cover on Federal Reserve notes ended (S. Rept. 1007). Bennett, Brooke and Percy concur "reluctantly"; Tower and Hickenlooper: cut it to 12.5 percent instead.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 383. Names: Bennett, Brooke, Percy, Tower, Hickenlooper.'
      tags:
      - name:bennett-wallace-f
      - name:brooke-edward-w
      - name:percy-charles-h
      - name:tower-john-g
      - name:hickenlooper-bourke-b
- add:
    entry:
      id: cal.1968-02-14.economy-surcharge
      when: Feb. 14
      date: '1968-02-14'
      thread: economy-surcharge
      c: 'Joint Economic Committee, the Economic Report. Martin: the danger not that the economy is too weak for a tax increase but that inflation will come without one; "overextended and overcommitted." Patman: "Outside of the Viet Cong, I do not know of any institution that has done more damage to the American economy."'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 386. Names: Martin, Patman.'
      tags:
      - name:martin-william-mcchesney-jr
      - name:patman-wright
- add:
    entry:
      id: cal.1968-02-15.economy-surcharge
      when: Feb. 15
      date: '1968-02-15'
      thread: economy-surcharge
      c: 'Joint Economic Committee. Fowler: $33 million added to the deficit each day without the tax increase; "demand pull" and "cost push" now working on each other.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 386. Names: Fowler.'
      tags:
      - name:fowler-henry-h
- add:
    entry:
      id: cal.1968-02-20.economy-surcharge
      when: Feb. 20
      date: '1968-02-20'
      thread: economy-surcharge
      c: 'Joint Economic Committee. Wirtz: with a surtax unemployment will be lower, or no higher; against Ackley''s letter to Proxmire, Feb. 2, of 150,000 jobs lost.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 387. Names: Wirtz, Ackley, Proxmire.'
      tags:
      - name:wirtz-w-willard
      - name:ackley-gardner
      - name:proxmire-william
- add:
    entry:
      id: cal.1968-02-21.economy-surcharge
      when: Feb. 21
      date: '1968-02-21'
      thread: economy-surcharge
      c: 'Joint Economic Committee. Schultze, out of the Budget Bureau: restraint by spending cuts alone "infeasible and unrealistic"; the standoff with Congress "a dangerous game of ''chicken.''" Saulnier: eight points, the surtax and a ceiling on spending among them.'
      n: '[[w.cq-weekly-report]], Mar. 1, 1968, 387. Names: Schultze, Saulnier.'
      tags:
      - name:schultze-charles-l
      - name:saulnier-raymond-j
- add:
    entry:
      id: cal.1968-02-26.crime-and-hijacking
      when: Feb. 26
      date: '1968-02-26'
      thread: crime-and-hijacking
