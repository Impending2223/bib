    id: cal.1965-05-13.latin-america-dominican-republic
    item: '[[w.poole-joint-chiefs-of-staff-2012]], 143 (Palmer, with Bennett, proposes widening the corridor to seize the
      radio station; the Chiefs refuse, a Special Forces plan allowed)'
    units: all
- cite:
