    item: '[[w.poole-joint-chiefs-of-staff-2012]], 145 (the act creating the Inter-American Peace Force signed May 23 by
      Mora and the contingents'' commanders)'
    units: all
- add:
    entry:
      id: cal.1965-06-08.latin-america-dominican-republic
      when: June 8
      date: '1965-06-08'
      thread: latin-america-dominican-republic
      c: The Joint Chiefs recommend Palmer be allowed to discuss further withdrawals with Alvim, and a smaller Phase III
        about June 13. Phase I done May 30; Phase II, 4,100 Marines, June 6, leaving 12,832 Americans.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 147. See [[cal.1965-05-27.latin-america-dominican-republic]]. Names: Palmer.'
      src:
        c: d1ee9cd1
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 147: all'
      tags:
      - name:palmer-bruce-jr
- add:
    entry:
      id: cal.1965-06-10.latin-america-dominican-republic
      when: June 10
      date: '1965-06-10'
      thread: latin-america-dominican-republic
      c: Palmer with Alvim on removing two airborne battalions; Alvim "somewhat reluctant," would send them to Puerto Rico
        and take the force ratios to the OAS.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 147. See [[cal.1965-06-08.latin-america-dominican-republic]]. Names: Palmer.'
      src:
        c: e9e5609b
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 147: all'
      tags:
      - name:palmer-bruce-jr
- add:
    entry:
      id: cal.1965-09-02.latin-america-dominican-republic
      when: Sept. 2
      date: '1965-09-02'
      thread: latin-america-dominican-republic
      c: The Joint Chiefs, by memoranda of Sept. 2 and 4, ask to keep 7,137 Americans, a tank company in and an airborne
        battalion out; approved later in the month. At Harold K. Johnson's urging they warn a premature withdrawal of the
        force could have "serious effects."
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 148. See [[cal.1965-06-08.latin-america-dominican-republic]]. Names: Harold
        K. Johnson.'
      src:
        c: 2f39203e
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 148: all'
      tags:
      - name:johnson-harold-k
- add:
    entry:
      id: cal.1965-09-29.latin-america-dominican-republic-2
      when: Sept. 29
      date: '1965-09-29'
      thread: latin-america-dominican-republic
      c: State and the Secretary of Defense's office disapprove an artillery battalion in the residual force; Moorer and
        Palmer give the Chiefs a rationale for it.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 148. See [[cal.1965-06-08.latin-america-dominican-republic]]. Names: Moorer,
        Palmer.'
      src:
        c: c0526d0b
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 148: all'
      tags:
      - name:moorer-thomas
      - name:palmer-bruce-jr
- add:
    entry:
      id: cal.1966-01-06.latin-america-dominican-republic
      when: Jan. 6
      date: '1966-01-06'
      thread: latin-america-dominican-republic
      c: Alvim refuses García-Godoy's and the OAS committee's request that the Inter-American force evict right-wing soldiers
        from Radio Santo Domingo; when Bunker threatens to use American troops alone, he lets American paratroopers take
        the station.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 149. See [[cal.1965-09-03.latin-america]]. Names: García-Godoy, Bunker.'
      src:
        c: 10ca1f9d
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 149: all'
      tags:
      - name:garcia-godoy-hector
      - name:bunker-ellsworth
- add:
    entry:
      id: cal.1966-01-17.latin-america-dominican-republic
      when: Jan. 17
      date: '1966-01-17'
      thread: latin-america-dominican-republic
      c: Brigadier General Alvaro Braga of Brazil takes command of the Inter-American Peace Force; Alvim and Palmer recalled.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 149. Names: Palmer.'
      src:
        c: db9799e9
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 149: all'
      tags:
      - name:palmer-bruce-jr
- add:
    entry:
      id: cal.1966-05-09.latin-america-dominican-republic
      when: May 9
      date: '1966-05-09'
      thread: latin-america-dominican-republic
      c: The Joint Chiefs recommend an OAS resolution "at the earliest possible date" to begin withdrawing the Inter-American
        force "at the earliest practicable date following the election of 1 June."
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 149.'
      src:
        c: a2e3b4ed
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 149: all'
- add:
    entry:
      id: cal.1966-12-05.middle-east-samu
      when: Dec. 5
      date: '1966-12-05'
      thread: middle-east-samu
      c: 'The Joint Chiefs to McNamara after Es Samu: another such incident, and "the United States should suspend the sale
        and deliveries of military equipment to Israel"; $12.8 million in equipment for Jordan.'
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 167. Names: McNamara.'
      src:
        c: 39d65e19
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 167: all'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-12-12.middle-east-samu
      when: Dec. 12
      date: '1966-12-12'
      thread: middle-east-samu
      c: An interagency meeting adds tanks to Jordan's supplemental package and speeds deliveries; Johnson holds back his
        letter to Hussein, so that "nothing is jelled" for Congress.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 168. See [[cal.1966-12-05.middle-east-samu]]. Names: Johnson, Hussein.'
      src:
        c: 8e12d8d5
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 168: all'
      tags:
      - name:johnson-lyndon-b
      - name:hussein-ibn-talal
- add:
    entry:
      id: cal.1966-12-13.middle-east-samu
      when: Dec. 13
      date: '1966-12-13'
      thread: middle-east-samu
      c: McNamara gives Khammash the $4.75 million package; Khammash "very obviously, very completely disappointed."
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 168. See [[cal.1966-12-05.middle-east-samu]]. Names: McNamara, Khammash.'
      src:
        c: 2f3bf942
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 168: all'
      tags:
      - name:mcnamara-robert-s
      - name:khammash-amer
- add:
    entry:
      id: cal.1965-01-14.congo
      when: Jan. 14
      date: '1965-01-14'
      thread: congo
      c: Godley asks that Tshombe's American-supported aircraft be allowed to attack clearly military targets, except where
        hostages may be held; Defense backs him.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 203. Names: Godley, Tshombe.'
      src:
        c: 2eab74bc
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 203: all'
      tags:
      - name:godley-g-mcmurtrie-ii
      - name:tshombe-moise
- add:
    entry:
      id: cal.1965-02-19.congo
      when: Feb. 19
      date: '1965-02-19'
      thread: congo
      c: State lifts the restrictions on Tshombe's aircraft, with "great care" not to strafe villages within ten miles of
        the Ugandan border.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 203. Names: Tshombe.'
      src:
        c: edd7b61b
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 203: all'
      tags:
      - name:tshombe-moise
- add:
    entry:
      id: cal.1965-09-07.india-and-china-kashmir
      when: Sept. 7
      date: '1965-09-07'
      thread: india-and-china-kashmir
      c: With full-scale war between India and Pakistan, the United States suspends military assistance shipments to both.
        McNaughton asks the Chiefs to weigh the two countries and a Chinese intervention against India.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 211. Names: McNaughton.'
      src:
        c: ee70f899
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 211: all'
      tags:
      - name:mcnaughton-john-t
- add:
    entry:
      id: cal.1967-11-27.korea
      when: Nov. 27
      date: '1967-11-27'
      thread: korea
      c: CINCPAC endorses and forwards Bonesteel's Counter-Infiltration Plan for Korea; Seoul ties a light division for
        Vietnam to Washington's commitment to it (mid-December).
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 236. Names: Bonesteel.'
      src:
        c: d0141cb7
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 236: all'
      tags:
      - name:bonesteel-charles-h-iii
- add:
    entry:
      id: cal.1967-12-17.japan-and-korea-pueblo
      when: Dec. 17
      date: '1967-12-17'
      thread: japan-and-korea-pueblo
      c: The Pacific Fleet's commander concurs in the *Pueblo*'s mission off North Korea; Sharp, six days later.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 236–37. Names: Sharp.'
      src:
        c: c10205de
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 236–37: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1967-12-29.japan-and-korea-pueblo
      when: Dec. 29
      date: '1967-12-29'
      thread: japan-and-korea-pueblo
      c: 'The National Security Agency to the JRC: no sign of North Korean harassment beyond twelve miles, but a possible
        attack; "ship protective measures" should be considered. Moorer''s copy never reaches him.'
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 237. See [[cal.1967-12-17.japan-and-korea-pueblo]]. Names: Moorer.'
      src:
        c: 9d67d7c0
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 237: all'
      tags:
      - name:moorer-thomas
- add:
    entry:
      id: cal.1968-01-24.japan-and-korea-pueblo-3
      when: Jan. 24
      date: '1968-01-24'
      thread: japan-and-korea-pueblo
      c: 'The J-3 to the Chiefs: in Korea neither side would have a clear advantage in a conventional fight; no overt Chinese
        or Soviet reaction likely; the 82d Airborne within seven days.'
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 239. See [[cal.1968-01-23.japan-and-korea]].'
      src:
        c: 80766b4a
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 239: all'
- add:
    entry:
      id: cal.1968-01-29.japan-and-korea-pueblo-2
      when: Jan. 29
      date: '1968-01-29'
      thread: japan-and-korea-pueblo
      c: McConnell, with 427 tactical aircraft in South Korea against 530 in the North, urges 150 more to the western Pacific;
        Sharp demurs, for an air mobility exercise or a reconnaissance party instead.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 240. See [[cal.1968-01-23.japan-and-korea]]. Names: McConnell, Sharp.'
      src:
        c: 3ace502a
        rows:
        - 'w.poole-joint-chiefs-of-staff-2012 240: all'
      tags:
      - name:mcconnell-john-p
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1968-03-21.japan-and-korea-pueblo
      when: Mar. 21
      date: '1968-03-21'
      thread: japan-and-korea-pueblo
      c: 'The J-3 on reprisals by submarine: destroying North Korea''s navy and merchant fleet would need attacks on ports,
        a "high risk of reopening full-scale hostilities."'
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 244. See [[cal.1968-01-23.japan-and-korea]].'
      src:
        c: 2c6d9a99
        rows:
