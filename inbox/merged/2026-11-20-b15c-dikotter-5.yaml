      c: 'Qingdao 青岛. Lan Ling, an official of the inspectorate, compiling and adjusting the prices paid for food and goods since 1949, finds coal up 18.5 percent, soap 21.4, shoes up to 53, rope 55, household goods up to 157, ordinary tools up to 225; the price the state pays for grain down, from 4.5 percent for wheat to 10.5 for maize.'
