patch: campbell-giancana
by: Claude (from the Church Committee's interim report)
ops:
  - add:
      entry:
        id: kjc.who.maheu-robert-a
        s: 'Maheu, Robert A.'
        r: 'Former FBI agent, private investigator from 1954; the CIA''s go-between to Rosselli and Giancana in the plot against Castro, 1960–61'
      section: III.K
  - add:
      entry:
        id: kjc.who.rosselli-john
        s: 'Rosselli, John'
        r: 'Underworld figure with gambling interests in Las Vegas; in the CIA''s plots against Castro, 1960–63'
      section: III.K
  - add:
      entry:
        id: cal.1961-05-22.robert-kennedy
        when: May 22
        date: '1961-05-22'
        thread: robert-kennedy
        also: [cuba, crime-and-hijacking]
        c: 'Hoover to Robert Kennedy on the wiretap found in a Las Vegas hotel room Oct. 31, 1960, placed for Maheu. Maheu to the FBI, Apr. 18: the tap was part of a project "on behalf of the CIA relative to anti-Castro activities." Edwards, the CIA''s Director of Security, May 3: the Agency had used Giancana, through Maheu, against Castro; of the methods he knew nothing, it being "dirty business." Kennedy, in the margin: "Courtney I hope this will be followed up vigorously."'
        n: '[S. Rep. No. 94-465, 125–28 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=136); the tap, [77](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=88) (K–J Adm. II.H.3). The Bureau''s files already held Hoover''s memorandum of Oct. 18, 1960: Giancana had told friends Castro would be "done away with" in November (126). Thomas, *The Very Best Men*; Powers, *The Man Who Kept the Secrets* (K–J Adm. II.E). Thomas, *Robert Kennedy: His Life* (K–J Adm. II.G.1). Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Robert Kennedy (K–J Adm. III.A); Hoover, Giancana (K–J Adm. III.I); Maheu (K–J Cong. III.K).'
        tags: [name:kennedy-robert-f, name:hoover-j-edgar, name:giancana-sam, name:edwards-sheffield, name:maheu-robert-a]
  - add:
      entry:
        id: cal.1962-02-07.crime-and-hijacking
        when: Feb. 7
        date: '1962-02-07'
        thread: crime-and-hijacking
        also: [cuba]
        c: 'The Las Vegas wiretap case. At the Criminal Division''s request (Miller, Jan. 31), the FBI sees Edwards again. The CIA objects to any prosecution needing its people or its information; evidence of its operation "would be embarrassing to the Government."'
        n: '[S. Rep. No. 94-465, 129–30 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=140) (K–J Adm. II.H.3), quoting Hoover to Edwards, Mar. 23, 1962. See [[cal.1961-05-22.robert-kennedy]]. Made public: the Church Committee''s interim report, Nov. 20, 1975.'
        tags: [name:edwards-sheffield]
  - add:
      entry:
        id: cal.1962-02-27.transition-and-staff
        when: Feb. 27
        date: '1962-02-27'
        thread: transition-and-staff
        also: [crime-and-hijacking, robert-kennedy]
        c: 'Hoover to Robert Kennedy and O''Donnell, the same memorandum: the FBI''s investigation of Rosselli shows him in touch with Judith Campbell, a friend of the President; she keeps up an association with Giancana, "a prominent Chicago underworld figure"; the toll calls from her residence include calls to the White House. Evelyn Lincoln, given a copy, believed she would have shown it to the President.'
        n: '[S. Rep. No. 94-465, 129 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=140) (K–J Adm. II.H.3): the friend unnamed; the White House telephone logs, 70 contacts with her, from the end of 1960 to mid-1962. Gage, *G-Man* (K–J Adm. II.E). See [[cal.1961-05-22.robert-kennedy]]. Made public: the Church Committee''s interim report, Nov. 20, 1975, without her name; her name in the press, Dec. 1975. Check the date. Names: Hoover, Campbell, Giancana (K–J Adm. III.I); Robert Kennedy (K–J Adm. III.A); O''Donnell, Lincoln (K–J Adm. III.B); Rosselli (K–J Cong. III.K).'
        tags: [name:hoover-j-edgar, name:kennedy-robert-f, name:odonnell-kenneth-p, name:lincoln-evelyn, name:campbell-judith, name:giancana-sam, name:rosselli-john]
  - edit:
      id: cal.1962-03-22.transition-and-staff
      base: 507ff3a3
      set:
        also: [crime-and-hijacking]
        c: 'Hoover lunches alone with Kennedy, prepared by a memorandum on Campbell, Rosselli and Giancana. No record of what passed. A few hours later, by the White House logs, the last telephone contact between the White House and Campbell. Mar. 23, Hoover asks Edwards whether the CIA objects to prosecution in the wiretap case. It does.'
        n: '[S. Rep. No. 94-465, 129–30 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=140) (K–J Adm. II.H.3). Gage, *G-Man* (K–J Adm. II.E). See [[cal.1962-02-27.transition-and-staff]]; [[cal.1962-02-07.crime-and-hijacking]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Hoover, Campbell, Giancana (K–J Adm. III.I); Rosselli (K–J Cong. III.K).'
        tags: [name:hoover-j-edgar, name:kennedy-john-f, name:campbell-judith, name:giancana-sam, name:rosselli-john, name:edwards-sheffield]
