patch: national
by: agent
ops:
  # ---------------------------------------------------------------- the federal amendments in the States
  - add:
      entry:
        id: cal.1960-06-23.states-and-cities-us
        when: June 23
        date: '1960-06-23'
        thread: states-and-cities
        c: Hawaii's legislature ratifies the Twenty-third Amendment, the first State, a week after Congress proposed it. Massachusetts second, Aug. 22.
        n: 'House Manual (116th Cong.), [116](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg116.htm); [CONAN (2017), Amend. XXIII n.15](https://www.govinfo.gov/content/pkg/GPO-CONAN-2017/pdf/GPO-CONAN-2017-7.pdf#page=18). See [[cal.1960-06-14.states-and-cities]].'
        tags: [state:hi, state:ma]
  - add:
      entry:
        id: cal.1961-01-24.states-and-cities-us
        when: Jan. 24
        date: '1961-01-24'
        thread: states-and-cities
        c: Arkansas rejects the Twenty-third Amendment, the one State to vote it down. Five States have ratified. Nine Southern States never act on it.
        n: 'House Manual (116th Cong.), [116](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg116.htm). Morton Mintz, *Washington Post*, Jan. 25, 1961, p. B1 (Check). See [[cal.1960-06-23.states-and-cities-us]].'
        tags: [state:ar]
  - add:
      entry:
        id: cal.1962-11-14.voting-rights-us
        when: Nov. 14
        date: '1962-11-14'
        thread: voting-rights
        c: Illinois ratifies the poll tax amendment, the first State. New Jersey second, Dec. 3.
        n: 'House Manual (116th Cong.), [118](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg118.htm); [CONAN (2017), Amend. XXIV n.16](https://www.govinfo.gov/content/pkg/GPO-CONAN-2017/pdf/GPO-CONAN-2017-7.pdf#page=19). U.S. Const. amend. XXIV (K–J Cong. II.J.2). [[w.lawson-black-ballots]]. See [[cal.1962-08-27.voting-rights]].'
        tags: [state:il, state:nj]
  - add:
      entry:
        id: cal.1962-12-20.mississippi-us
        when: Dec. 20
        date: '1962-12-20'
        thread: mississippi
        also: [voting-rights]
        c: The legislature rejects the poll tax amendment, the one State to vote it down. Its poll tax stands for State elections.
        n: 'House Manual (116th Cong.), [118](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg118.htm). Check the legislature''s journals. [[w.lawson-black-ballots]]. See [[cal.1962-11-14.voting-rights-us]].'
        tags: [state:ms]
  - add:
      entry:
        id: cal.1966-07-05.succession-us
        when: July 5
        date: '1966-07-05'
        thread: succession
        c: Louisiana ratifies the Twenty-fifth Amendment, the thirty-first State; Virginia and Mississippi in March. No other State acts in 1966; seven more needed. Tennessee next, Jan. 12, 1967; Nevada the thirty-eighth, Feb. 10.
        n: 'House Manual (116th Cong.), [119](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg119.htm); [CONAN (2017), Amend. XXV n.17](https://www.govinfo.gov/content/pkg/GPO-CONAN-2017/pdf/GPO-CONAN-2017-7.pdf#page=20). [[w.feerick-twenty-fifth-amendment]]. See [[cal.1965-07-06.succession]].'
        tags: [state:la, state:va, state:ms]
  # ---------------------------------------------------------------- Article V
  - add:
      entry:
        id: cal.1962-12.states-and-cities-us
        when: Dec.
        date: '1962-12'
        thread: states-and-cities
        also: [court, legislatures]
        c: 'The Council of State Governments'' General Assembly of the States, at Chicago, recommends three amendments to the Constitution, to be sought by applications of the legislatures: an amendment proposed by two-thirds of the legislatures in identical texts to go to the States without action by Congress; the apportionment of State legislatures taken from the federal courts; a Court of the Union, the fifty State chief justices, to review the Supreme Court''s judgments. Check the place and days.'
        n: '"Amending the Constitution to Strengthen the States in the Federal System," 36 *State Government* 10 (1963) (Check). [[w.black-proposed-amendment-of-article]]; [[w.kurland-court-of-the-union]]; [[w.bonfield-dirksen-amendment-and-the]]. See [[cal.1962-03-26.court]].'
  - add:
      entry:
        id: cal.1963-12.states-and-cities-us
        when: Dec.
        date: '1963-12'
        thread: states-and-cities
        also: [court, legislatures]
        c: 'The year''s applications to Congress for the Council of State Governments'' amendments. Apportionment: twelve legislatures, Arkansas, Idaho, Kansas, Missouri, Montana, Nevada, Oklahoma, South Carolina, South Dakota, Texas, Washington and Wyoming. Article V: eleven. The Court of the Union: five, Alabama, Arkansas, Florida, South Carolina and Wyoming. Thirty-four needed for a convention.'
        n: 'The applications in 109 Cong. Rec. (1963), as the Article V Library lists them: [apportionment](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0), [Article V](http://article5library.org/analyze.php?topic=Revision+of+Article+V&res=1&gen=0&ylimit=0), [Court of the Union](http://article5library.org/analyze.php?topic=Establish+Court+of+the+Union&res=1&gen=0&ylimit=0) (Check each against the Record). [[w.black-proposed-amendment-of-article]]; [[w.kurland-court-of-the-union]]. See [[cal.1962-12.states-and-cities-us]]; [[cal.1963-07-26.opinion]].'
  - add:
      entry:
        id: cal.1966-12.court-us
        when: Dec.
        date: '1966-12'
        thread: court
        also: [states-and-cities, legislatures]
        c: 'Dirksen''s drive for a convention on apportionment, at the year''s end: applications from 28 legislatures since 1963, by the Article V Library''s count; 34 needed. New in 1965: Alabama, Arizona, Florida, Georgia, Kentucky, Louisiana, Maryland, Minnesota, Mississippi, Nebraska, New Hampshire, North Carolina, Tennessee and Utah; Virginia in 1964, New Mexico in 1966. Nine States of 1963 apply again in 1965.'
        n: 'The applications in 110–112 Cong. Rec. (1964–66), as the [Article V Library](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0) lists them (Check each against the Record). [[w.bonfield-dirksen-amendment-and-the]]; [[w.macneil-dirksen]]; [[w.dixon-democratic-representation]]. See [[cal.1966-04-20.court]]; [[cal.1963-12.states-and-cities-us]]. Names: Dirksen (K–J Cong. III.A).'
        tags: [name:dirksen-everett]
  # ---------------------------------------------------------------- apportionment and the legislatures
  - add:
      entry:
        id: cal.1962-12-13.legislatures-us
        when: Dec. 13
        date: '1962-12-13'
        thread: legislatures
        also: [court]
        c: 'Advisory Commission on Intergovernmental Relations, *Apportionment of State Legislatures*, adopted: both houses of a State legislature to be apportioned strictly by population; where population is the only factor, districts within 10 percent of the average; the courts to leave the drawing of districts to the legislature or a board. Governors Smylie and Hollings and four others dissent: population "unless the people directly determine otherwise."'
        n: '[ACIR, *Apportionment of State Legislatures* (A-15, Dec. 1962)](https://library.unt.edu/gpo/ACIR/Reports/policy/a-15.pdf#page=81). [[w.baker-reapportionment-revolution]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]]. Names: Smylie (K–J Cong. III.F).'
        tags: [name:smylie-robert-e, name:hollings-ernest-f]
  - add:
      entry:
        id: cal.1966-01.legislatures-us
        when: Jan.
        date: '1966-01'
        thread: legislatures
        also: [court]
        c: 'Reapportionment at the end of 1965, as the *State Legislatures Progress Reporter* counts it: suits against the apportionment of the legislature in 49 States, Maine alone spared; fifteen legislatures reapportioned on population in both houses, their members seated; 24 more States acting before their next elections; eight legislatures under court order to reapportion.'
        n: '"Most States Have Acted on ''One Man, One Vote,''" *State Legislatures Progress Reporter*, No. 4, p. 2 (Jan. 1966) (Check), cited in [*Popular Government* (Feb. 1966) 3](https://sog.unc.edu/sites/default/files/archived-files/populargovernmen325.pdf#page=3). [[w.baker-reapportionment-revolution]]; [[w.hanson-political-thicket]]; [[w.dixon-democratic-representation]]; [[w.cox-elbridge-gerrys-salamander]]. See [[cal.1964-06-15.court]]; [[cal.1965-08-04.court]].'
  - add:
      entry:
        id: cal.1960-11-08.legislatures-us
        when: Nov. 8
        date: '1960-11-08'
        thread: legislatures
        also: [elections-1960]
        c: 'The State legislatures. Republicans gain some 270 lower-house seats and 14 senate seats. They take the lower houses of Connecticut, Idaho, Illinois, Indiana, Michigan (tied before), Montana, Ohio, Wisconsin and Wyoming, and the senates of Idaho, Ohio and South Dakota; Democrats the senates of Indiana and Utah; Pennsylvania''s senate tied. At the 1961 sessions Democrats control 27 legislatures, Republicans 14, eight divided or tied (30, 7 and 12 before); Nebraska''s nonpartisan.'
        n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1960 and 1961 (Check against the Council of State Governments'' *Book of the States*, 1960–61 and 1962–63). See [[cal.1960-11-08.elections-1960]].'
  - add:
      entry:
        id: cal.1962-11-06.legislatures-us
        when: Nov. 6
        date: '1962-11-06'
        thread: legislatures
        also: [elections-1962]
        c: 'The State legislatures. Republicans gain some 130 lower-house seats and 48 senate seats. They take both houses of Colorado, Pennsylvania (its senate tied before) and Utah, the Minnesota House and the Indiana Senate; Democrats the Hawaii Senate; Alaska''s House tied. At the 1963 sessions Democrats control 25 legislatures, Republicans 19, five divided or tied. Reapportioned since *Baker v. Carr*, Florida''s legislature grows from 133 seats to 169, Maryland''s House from 123 to 142.'
        n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1962 and 1963 (Check against the *Book of the States*, 1962–63 and 1964–65). [[w.baker-reapportionment-revolution]]. See [[cal.1962-11-06.elections-1962]]; [[cal.1962-12-13.legislatures-us]].'
  - add:
      entry:
        id: cal.1964-11-03.legislatures-us
        when: Nov. 3
        date: '1964-11-03'
        thread: legislatures
        also: [elections-1964]
        c: 'The State legislatures. Democrats gain some 470 lower-house seats and 116 senate seats. They take both houses of Indiana, Iowa, Maine, Michigan, New York and Utah, and the lower houses of Alaska (tied before), Colorado, Illinois, Montana, North Dakota, Pennsylvania, Wisconsin and Wyoming; Republicans the Oregon House; the Nevada and Ohio senates tied. At the 1965 sessions Democrats control 32 legislatures, Republicans 7, ten divided or tied (25, 20 and 4 before). Seated on new apportionments, among others: the Iowa Senate, 50 seats to 59; the Michigan Senate, 34 to 38; the Oklahoma House, 120 to 99.'
        n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1964 and 1965 (Check against the *Book of the States*, 1964–65 and 1966–67). [[w.baker-reapportionment-revolution]]; [[w.cox-elbridge-gerrys-salamander]]. See [[cal.1964-11-03.elections-1964]]; [[cal.1964-06-15.court]].'
  - add:
      entry:
        id: cal.1966-11-08.legislatures-us
        when: Nov. 8
        date: '1966-11-08'
        thread: legislatures
        also: [elections-1966]
        c: 'The State legislatures. Republicans gain some 420 lower-house seats and 160 senate seats; Democrats lose some 625 and 124, the bodies smaller by reapportionment. Republicans take both houses of Alaska, Arizona, Maine, Michigan and Utah, the lower houses of Colorado, Delaware, Illinois, Indiana, Iowa, Montana, North Dakota, Pennsylvania, Washington, Wisconsin and Wyoming, and the Ohio Senate (tied before); the California and Delaware senates tied; Democrats take the Connecticut House and the Nevada Senate. At the 1967 sessions Democrats control 23 legislatures, Republicans 18, eight divided or tied (32, 6 and 11 before). Remade by reapportionment: the Connecticut House, 294 seats to 177; the Ohio House, 137 to 99; the Arizona House, 80 to 60; the Maryland Senate, 29 to 43.'
        n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1966 and 1967 (Check against the *Book of the States*, 1966–67 and 1968–69). [[w.cox-elbridge-gerrys-salamander]]. See [[cal.1966-11-08.elections-1966]]; [[cal.1966-01.legislatures-us]].'
  # ---------------------------------------------------------------- the Governors' Conference
  - add:
      entry:
        id: cal.1960-06-27.states-and-cities-us
        when: June 27–29
        date: '1960-06-27'
        thread: states-and-cities
        also: [medicare]
        c: 'Governors'' Conference at Glacier National Park, Mont. Eisenhower''s recorded message, June 27. June 29: a resolution for health insurance for the aged "financed principally through" Social Security, adopted 30–13; Rockefeller and Brown for, Hollings against.'
        n: '[Remarks Recorded for the Governors Conference at Glacier National Park, Montana](https://www.presidency.ucsb.edu/documents/remarks-recorded-for-the-governors-conference-glacier-national-park-montana) (June 27, 1960). [*Proceedings of the Governors'' Conference, 1960*, 156–157](https://www.nga.org/wp-content/uploads/2026/03/1960_Annual_Meeting-compressed.pdf#page=171). [[w.david-with-dignity]]. See [[cal.1960-06-23.medicare]]. Names: Eisenhower (Opp. III.E); Rockefeller (Opp. III.H); Brown (K–J Cong. III.F).'
        tags: [name:eisenhower-dwight-d, name:rockefeller-nelson, name:brown-edmund-g, name:hollings-ernest-f]
  - add:
      entry:
        id: cal.1961-06-25.states-and-cities-us
        when: June 25–28
        date: '1961-06-25'
        thread: states-and-cities
        also: [school-aid]
        c: 'Governors'' Conference at Honolulu. Johnson, June 27: "Testing Our Will." June 28: for federal grants to the States for classrooms, loans for college buildings, and adult education, 35–12, two-thirds needed; an amendment against aid for teachers'' salaries lost, 23–24. Support of the President in foreign affairs, by a unanimous standing vote.'
        n: '[*Proceedings of the Governors'' Conference, 1961*, 89, 111–120, 156](https://www.nga.org/wp-content/uploads/2026/03/1961_Annual_Meeting-compressed-1.pdf#page=128). See [[cal.1961-02-20.school-aid]]. Names: Johnson (K–J Adm. III.D).'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1962-07-03.states-and-cities-us
        when: July 3
        date: '1962-07-03'
        thread: states-and-cities
        c: 'Governors'' Conference at Hershey, Pa. The Resolutions Committee''s civil rights resolution, reaffirming that of 1961; amendments by Rockefeller, Hatfield and Swainson of Michigan for a pledge of action. Hollings and others hold the floor into the evening. On Lawrence''s proposal, each governor to sign the text he supports, the resolution and amendments set aside, 32–8. July 4, Kennedy to the governors at Independence Hall.'
        n: '[*Proceedings of the Governors'' Conference, 1962*, 68–94](https://www.nga.org/wp-content/uploads/2026/03/1962_Annual_Meeting-compressed.pdf#page=83). [[w.black-southern-governors-and-civil]]. See [[cal.1961-06-25.states-and-cities-us]]. Names: Rockefeller (Opp. III.H); Hatfield (Opp. III.B); Lawrence (K–J Cong. III.F); Kennedy (Viet. III.A).'
        tags: [name:rockefeller-nelson, name:hatfield-mark-o, name:hollings-ernest-f, name:lawrence-david-l, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1963-07-21.states-and-cities-us
        when: July 21–24
        date: '1963-07-21'
        thread: states-and-cities
        also: [civil-rights-bill]
        c: 'Governors'' Conference at Miami Beach. July 22: Hatfield''s appeal against a five-minute limit on the civil rights discussion and a bar on motions, lost 14–34, Rockefeller seconding. The Executive Committee''s rule of unanimity for resolutions replaced, on Sawyer''s motion, by none: the Resolutions Committee abolished, 33–16; Hatfield''s two-thirds rule with closure falls with it. July 23, civil rights discussed without a vote.'
        n: '[*Proceedings of the Governors'' Conference, 1963*, 11–28](https://www.nga.org/wp-content/uploads/2026/03/1963_Annual_Meeting-compressed.pdf#page=30). See [[cal.1962-07-03.states-and-cities-us]]. Names: Hatfield (Opp. III.B); Rockefeller (Opp. III.H); Sawyer (K–J Cong. III.F).'
        tags: [name:hatfield-mark-o, name:rockefeller-nelson, name:sawyer-grant]
  - add:
      entry:
        id: cal.1964-06-07.states-and-cities-us
        when: June 7–10
        date: '1964-06-07'
        thread: states-and-cities
        also: [civil-rights-bill, elections-1964]
        c: 'Governors'' Conference at Cleveland. Eisenhower speaks, June 8. June 9: civil rights in three workshops, on education, employment and public accommodations, reported to the full conference without a vote. Scranton, Rockefeller and Romney there; the Senate''s cloture vote on the civil rights bill June 10, the last day.'
        n: '[*Proceedings of the Governors'' Conference, 1964*, 6, 49–69](https://www.nga.org/wp-content/uploads/2021/03/1964NGAAnnualMeeting.pdf#page=22). [[w.white-making-of-the-president-1965]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1963-07-21.states-and-cities-us]]. Names: Eisenhower (Opp. III.E); Scranton, Rockefeller, Romney (Opp. III.H).'
        tags: [name:eisenhower-dwight-d, name:scranton-william-w, name:rockefeller-nelson, name:romney-george-w]
  - add:
      entry:
        id: cal.1965-07-27.state-and-city-finance-us
        when: July 27
        date: '1965-07-27'
        thread: state-and-city-finance
        also: [states-and-cities, poverty]
        c: 'National Governors'' Conference at Minneapolis, July 25–29. July 27, on Sanders''s motion: for study of returning a share of federal tax revenues to the States "without federal controls," and a presidential task force with State and local members; grants-in-aid, $3.1 billion a decade before, now more than $13 billion. Against any cut in a governor''s veto under the Economic Opportunity Act, which the House has voted to let the director override.'
        n: '[*Proceedings of the National Governors'' Conference, 1965*, 268–271](https://www.nga.org/wp-content/uploads/2021/03/1965NGAAnnualMeeting.pdf#page=147). [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1964-10-28.state-and-city-finance-us]]; [[cal.1964-07-23.poverty]]. Names: Sanders (K–J Cong. III.K).'
        tags: [name:sanders-carl-e]
  - add:
      entry:
        id: cal.1965-07-28.vietnam-us
        when: July 28
        date: '1965-07-28'
        thread: vietnam
        also: [states-and-cities]
        c: 'The governors at Minneapolis watch Johnson''s news conference on television. Sanders moves their support of "the position of the President." Romney''s motion to wait for the briefing at the White House the next day, seconded by Hatfield, lost by voice; Sanders''s carried by voice, Hatfield''s reservations on the record.'
        n: '[*Proceedings of the National Governors'' Conference, 1965*, 91–96](https://www.nga.org/wp-content/uploads/2021/03/1965NGAAnnualMeeting.pdf#page=58). See [[cal.1965-07-28.vietnam]]. Names: Johnson (K–J Adm. III.D); Sanders (K–J Cong. III.K); Romney (Opp. III.H); Hatfield (Opp. III.B).'
        tags: [name:johnson-lyndon-b, name:sanders-carl-e, name:romney-george-w, name:hatfield-mark-o]
  - add:
      entry:
        id: cal.1966-03-12.vietnam-us
        when: Mar. 12
        date: '1966-03-12'
        thread: vietnam
        also: [states-and-cities]
        c: 'The governors at the White House, briefed on Vietnam by Rusk, McNamara, Taylor, Wheeler and Humphrey. A resolution of Rhodes''s, adopted unanimously by those present, read by Reed of Maine, the conference''s chairman: they "wholeheartedly support and endorse the policies and programs in Vietnam." Hatfield absent.'
        n: '[The President''s News Conference Held at the Close of the Governors'' Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-held-the-close-the-governors-conference) (Mar. 12, 1966). See [[cal.1965-07-28.vietnam-us]]. Names: Rusk (K–J Adm. III.E); McNamara, Taylor, Wheeler (K–J Adm. III.F); Humphrey (K–J Adm. III.D); Rhodes (Opp. III.H); Hatfield (Opp. III.B).'
        tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:wheeler-earle, name:humphrey-hubert-h, name:rhodes-james-a, name:reed-john-h, name:hatfield-mark-o]
  - add:
      entry:
        id: cal.1966-07-07.vietnam-us
        when: July 7
        date: '1966-07-07'
        thread: vietnam
        also: [states-and-cities]
        c: 'National Governors'' Conference at Los Angeles, July 4–7; Humphrey speaks July 6. July 7: Sawyer''s resolution, agreed by Democratic and Republican governors, affirms the conference''s "resolute support of our global commitments"; Hughes of New Jersey adds "including our support of the military defense of South Vietnam against aggression." Hatfield''s amendment, support of the servicemen alone, seconded by Romney, lost by voice. Adopted, 49–1; the one, Hatfield (Check).'
        n: '[*Proceedings of the National Governors'' Conference, 1966*, 135–146](https://www.nga.org/wp-content/uploads/2021/03/1966NGAAnnualMeeting.pdf#page=150). See [[cal.1966-03-12.vietnam-us]]. Names: Humphrey (K–J Adm. III.D); Sawyer, Hughes (K–J Cong. III.F); Hatfield (Opp. III.B); Romney (Opp. III.H).'
        tags: [name:humphrey-hubert-h, name:sawyer-grant, name:hughes-richard-j, name:hatfield-mark-o, name:romney-george-w]
  - add:
      entry:
        id: cal.1966-12-16.state-and-city-finance-us
        when: Dec. 16–17
        date: '1966-12-16'
        thread: state-and-city-finance
        also: [states-and-cities]
        c: 'National Governors'' Conference, special interim meeting at White Sulphur Springs, W. Va., the first between annual meetings. It "specifically endorses the principle of tax sharing and the principle of block grants," consolidating the categorical grants; its committee on State and local revenue to draft a federal tax-sharing plan on the individual income tax.'
        n: '[*Official Papers, Special Interim Meeting, National Governors'' Conference* (1966), 20–21](https://www.nga.org/wp-content/uploads/2021/03/1966NGAWinterMeeting.pdf#page=24). [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1965-07-27.state-and-city-finance-us]]; [[cal.1966-12-16.elections-1966]].'
  # ---------------------------------------------------------------- the Republican governors
  - add:
      entry:
        id: cal.1964-12-04.elections-1964-us
        when: Dec. 4–5
        date: '1964-12-04'
        thread: elections-1964
        also: [states-and-cities]
        c: 'Republican governors and governors-elect at Denver. A statement on the party''s leadership; Rockefeller, Romney and Scranton say Burch should be replaced; Smylie presses hardest for a declaration. Check.'
        n: '*Michigan Daily*, Dec. 9, 1964 (AP) (Check against the press). [[w.sparacino-democratic-and-republican-governors]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-11-03.elections-1964-2]]. Names: Rockefeller, Romney, Scranton (Opp. III.H); Burch (Opp. III.E); Smylie (K–J Cong. III.F).'
        tags: [name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w, name:burch-dean, name:smylie-robert-e]
  - add:
      entry:
        id: cal.1966-12-09.elections-1968-us
        when: Dec. 9–10
        date: '1966-12-09'
        thread: elections-1968
        also: [elections-1966, states-and-cities]
        c: 'Republican governors and governors-elect at the Broadmoor, Colorado Springs. Love chairman of their association, Chafee vice chairman, to succeed him in Dec. 1967; Reagan and Kirk to its executive committee. Bliss''s "unity," and a resolution of support for him; Reagan, asked by Love, recites the "Eleventh Commandment." Romney keeps the meeting off 1968. Check the days.'
        n: '*Ripon Forum*, [Jan. 1967, 3–6](https://riponsociety.org/wp-content/uploads/2023/12/1967-01_Vol-III_No-1.pdf) (Check against the press). [[w.sparacino-democratic-and-republican-governors]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-12-04.elections-1964-us]]; [[cal.1966-11-08.elections-1966]]. Names: Chafee, Reagan, Kirk, Romney (Opp. III.H); Bliss (Opp. III.E).'
        tags: [name:love-john-a, name:chafee-john-h, name:reagan-ronald, name:kirk-claude-r-jr, name:bliss-ray-c, name:romney-george-w]
  # ---------------------------------------------------------------- the mayors
  - add:
      entry:
        id: cal.1963-06-09.civil-rights-the-executive-us
        when: June 9
        date: '1963-06-09'
        thread: civil-rights-the-executive
        also: [states-and-cities]
        c: 'Kennedy to the U.S. Conference of Mayors at Honolulu: race relations "a national problem." Five steps for every city: a biracial human relations committee; ordinances and practices in accord with the Court''s rulings; Negroes hired at every level of city government; equal opportunity ordinances on jobs, housing and public accommodations; a summer drive against school dropouts.'
        n: '[Address in Honolulu Before the United States Conference of Mayors](https://www.presidency.ucsb.edu/documents/address-honolulu-before-the-united-states-conference-mayors) (June 9, 1963). See [[cal.1963-06-04.civil-rights-the-executive]]. Names: Kennedy (Viet. III.A).'
        tags: [name:kennedy-john-f]
  # ---------------------------------------------------------------- the States and the Great Society
  - add:
      entry:
        id: cal.1964-10-28.state-and-city-finance-us
        when: Oct. 28
        date: '1964-10-28'
        thread: state-and-city-finance
        also: [economy, elections-1964]
        c: 'Presidential Statement No. 6, "Strengthening State-Local Government": the National Government, "as a constructive partner in a creative federalism," to make available to States and localities "some part of our great and growing Federal tax revenues—over and above existing aids." "Intensive study is now being given."'
        n: '[Presidential Statement No. 6 on Economic Issues: Strengthening State-Local Government](https://www.presidency.ucsb.edu/documents/presidential-statement-no-6-economic-issues-strengthening-state-local-government) (Oct. 28, 1964). [[w.heller-new-dimensions-of-political]]; [[w.dommel-politics-of-revenue-sharing]]; [[w.conlan-new-federalism]]. See [[cal.1964-05-22.program]]. Names: Johnson (K–J Adm. III.D).'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1965-08-02.state-and-city-finance-us
        when: Aug. 2
        date: '1965-08-02'
        thread: state-and-city-finance
        c: 'Johnson to *Newsweek*, its issue of Aug. 2, on revenue sharing: "What do they call it—the Heller plan?" "George Meany told me he''d never go for it." His task force of 1964 had recommended the plan; the proposal set aside after the recommendation reached the press, Dec. 1964 (Check). In July a Ripon Society–Republican Governors'' Association study for it. Illinois and Ohio apply to Congress this year for a convention on tax sharing.'
        n: '*Newsweek*, Aug. 2, 1965 (Check), quoted in *Ripon Forum*, [Sept. 1965, 1](https://riponsociety.org/wp-content/uploads/2023/12/1965-09_Vol-1_No-6.pdf). Applications: 111 Cong. Rec. 14,144, 25,237 (1965), as the [Article V Library](http://article5library.org/analyze.php?topic=Revenue+sharing&res=1&gen=0&ylimit=0) lists them. [[w.heller-new-dimensions-of-political]]; [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1965-07-27.state-and-city-finance-us]]. Names: Johnson (K–J Adm. III.D); Heller (K–J Adm. III.H); Meany (K–J Cong. III.I).'
        tags: [name:johnson-lyndon-b, name:heller-walter-w, name:meany-george, state:il, state:oh]
  - add:
      entry:
        id: cal.1966-03-31.health-us
        when: Mar. 31
        date: '1966-03-31'
        thread: health
        also: [welfare]
        c: 'Medicaid''s first States. North Dakota, Oklahoma, Illinois, Minnesota, Hawaii, Pennsylvania and Puerto Rico, their programs under Title XIX from Jan. 1, conclude their agreements at the White House; the federal share 50 to 80 percent of the cost. Winston, the Commissioner of Welfare: 24 more States at work on plans.'
        n: '[Remarks at a Meeting Marking the Inauguration of the State-Federal (Title 19) Medical Assistance Program](https://www.presidency.ucsb.edu/documents/remarks-meeting-marking-the-inauguration-the-state-federal-title-19-medical-assistance) (Mar. 31, 1966). [[w.stevens-welfare-medicine-in-america]]; [[w.david-with-dignity]]; [[w.weikel-decade-of-medicaid]]. See [[cal.1965-07-30.medicare]]. Names: Johnson (K–J Adm. III.D).'
        tags: [name:johnson-lyndon-b, name:winston-ellen, state:nd, state:ok, state:il, state:mn, state:hi, state:pa]
  - add:
      entry:
        id: cal.1966-12.health-us
        when: Dec.
        date: '1966-12'
        thread: health
        also: [welfare]
        c: 'Medicaid at the year''s end: 29 States have begun programs. A State without one by 1970 to lose federal matching for medical payments under the old public assistance and Kerr–Mills programs.'
        n: '[[w.weikel-decade-of-medicaid]], 305; [[w.stevens-welfare-medicine-in-america]]. See [[cal.1966-03-31.health-us]].'
  - add:
      entry:
        id: cal.1966-11-11.states-and-cities-us
        when: Nov. 11
        date: '1966-11-11'
        thread: states-and-cities
        also: [state-and-city-finance]
        c: 'Memorandum to the heads of ten departments and agencies giving aid: "The basis of creative federalism is cooperation." The chief executives of States, counties and cities to be consulted on programs that touch them; the Budget Director to arrange it with the Advisory Commission on Intergovernmental Relations. Federal grants to States and localities: $7.0 billion in fiscal 1960, $12.9 billion in 1966, $15.2 billion in 1967.'
        n: '[Memorandum on the Need for "Creative Federalism" Through Cooperation With State and Local Officials](https://www.presidency.ucsb.edu/documents/memorandum-the-need-for-creative-federalism-through-cooperation-with-state-and-local) (Nov. 11, 1966), released at San Antonio. Office of Management and Budget, Historical Tables, [Table 12.1](https://www.govinfo.gov/content/pkg/BUDGET-2025-TAB/xls/BUDGET-2025-TAB-13-1.xlsx) (outlays as revised today). [[w.conlan-new-federalism]]; [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1964-10-28.state-and-city-finance-us]]. Names: Johnson (K–J Adm. III.D).'
        tags: [name:johnson-lyndon-b]
