      thread: medicare
      c: 'Finance opens hearings on H.R. 11865, seven working days to Aug. 14: the Gore amendment, King-Anderson; Javits''s.
        Celebrezze: "hospital care for the aged is much more important . . . than a small increase in benefits." Byrd: both
        bills would put the tax at 10.4 percent.'
