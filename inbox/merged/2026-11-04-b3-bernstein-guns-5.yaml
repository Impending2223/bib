      n: '[[w.bernstein-guns-or-butter]], 202. To check: Cater to Johnson, Apr. 2, 1965, with O''Neill to Cater, Mar. 31,
        LBJ Library (cited by [[w.bernstein-guns-or-butter]], 202 n.5). Names: Gordon, Macy, Gardner.'
