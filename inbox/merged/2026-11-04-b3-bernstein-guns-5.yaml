      id: cal.1964-11-15.medicare
      when: Nov. 15
      date: '1964-11-15'
      thread: medicare
      c: 'The draft of the 1965 bill, Cohen''s: "We are considering a 7% increase" in benefits, retroactive to Jan. 1, 1965;
        the earnings base from $4,800 to $5,600; the combined tax from 8.8 percent in 1966 to 10.4 in 1971; hospital insurance
        as the Senate passed it.'
      n: '[[w.bernstein-guns-or-butter]], 170. To check: Celebrezze to Johnson, Nov. 15, 1964, EX LE/IS File, LBJ Library
        (cited by [[w.bernstein-guns-or-butter]], 170 n.4). Check: whose memorandum (Bernstein''s text says Cohen''s draft).
        See [[cal.1964-11-11.medicare]]. Names: Cohen.'
