- add:
    entry:
      id: cal.1965-02-26.school-aid
      when: Feb. 26
      date: '1965-02-26'
      thread: school-aid
      c: 'Education and Labor finishes its amendments to Title I, Friday afternoon: $63 million more for the cities and suburbs;
        Pucinski''s, counting as poor the AFDC children of families over $2,000. O''Hara of Macomb County for more.'
      n: '[[w.bernstein-guns-or-butter]], 195. To check: O''Hara to Cater, Feb. 26, 1965, Cater Papers, LBJ Library (cited
        by [[w.bernstein-guns-or-butter]], 195 n.3). Names: Pucinski, O''Hara.'
