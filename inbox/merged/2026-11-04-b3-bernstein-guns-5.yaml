        rows:
        - 'w.bernstein-guns-or-butter 207–8: all'
        - 'via x.1965-05-18.cater-to-johnson-cater-papers: B-C'
- add:
    entry:
      id: cal.1965-05-21.school-aid
      when: May 21
      date: '1965-05-21'
      thread: school-aid
      c: Education and Labor reverses its subcommittee and restores the student loans, 13 to 12, after the White House steps
        in, by Bernstein's account.
      n: '[[w.bernstein-guns-or-butter]], 208. See [[cal.1965-05-18.school-aid]].'
      src:
        c: fba5c0e2
        rows:
        - 'w.bernstein-guns-or-butter 208: all'
- add:
    entry:
      id: cal.1965-06-08.school-aid
      when: June 8
      date: '1965-06-08'
      thread: school-aid
      c: 'Green brought around, through Brademas, to a new loan program: $25,000 to a State to start its own; no federal loans
        where one exists; $1,000 a year for undergraduates, $2,000 for graduates; 6 percent at most; the interest subsidized
        under $10,000 of family income.'
      n: '[[w.bernstein-guns-or-butter]], 208. Check: the day ("By June 8"). See [[cal.1965-05-21.school-aid]]. Names: Green,
        Brademas.'
      tags:
      - name:green-edith
      - name:brademas-john
      src:
        c: 6bc5a43a
        rows:
        - 'w.bernstein-guns-or-butter 208: all'
- add:
    entry:
      id: cal.1965-06-14.school-aid
      when: June 14
      date: '1965-06-14'
      thread: school-aid
      also:
      - transition-and-staff
      c: 'The White House Task Force on Education, Ink''s, on the Office of Education: a "grand design," Bailey and Mosher;
        nearly all of it reorganized. Keppel and Loomis begin in late June: of 36 divisions two untouched; of 25 supergrades
        eight kept.'
      n: '[[w.bernstein-guns-or-butter]], 203. To check: Recommendations of the White House Task Force on Education, June
        14, 1965, LBJ Library; Stephen K. Bailey and Edith K. Mosher, *ESEA, The Office of Education Administers a Law* (1968),
        ch. 3 (cited by [[w.bernstein-guns-or-butter]], 203 n.5). Names: Ink, Keppel, Loomis.'
      tags:
      - name:ink-dwight-a
      - name:keppel-francis
      - name:loomis-henry
      src:
        c: 60f0f765
        rows:
        - 'w.bernstein-guns-or-butter 203: all'
        - 'via x.1965-06-14.recommendations-white-house-task-force-on-education: A'
- add:
    entry:
      id: cal.1965-06-23.republican-party-congress
      when: June 23
      date: '1965-06-23'
      thread: republican-party-congress
      also:
      - school-aid
      c: The House Republican Conference unanimously endorses tax credits for college expenses; within a few days 64 Republicans
        sign on.
      n: '[[w.bernstein-guns-or-butter]], 208. See [[cal.1965-06-08.school-aid]].'
      src:
        c: abd1f9b0
        rows:
        - 'w.bernstein-guns-or-butter 208: all'
- add:
    entry:
      id: cal.1965-06-24.school-aid
      when: June 24
      date: '1965-06-24'
      thread: school-aid
      c: 'Education and Labor reports the higher education bill, 21 to 2, with Waggoner''s amendment: no federal control of
        fraternities, sororities, private clubs, religious bodies, under this "or any other Act." Cohen: the House version
        "superior to the original Administration proposal."'
      n: '[[w.bernstein-guns-or-butter]], 208. To check: Cohen to Cater, July 1, 1965, Cater Papers, LBJ Library (cited by
        [[w.bernstein-guns-or-butter]], 208 n.7). See [[cal.1965-06-08.school-aid]]. Names: Cohen.'
      tags:
      - name:cohen-wilbur-j
      src:
        c: bbe33ebe
        rows:
        - 'w.bernstein-guns-or-butter 208: all'
        - 'via x.1965-07-01.cohen-to-cater-cater-papers: B'
- add:
    entry:
      id: cal.1965-07-11.school-aid
      when: July 11
      date: '1965-07-11'
      thread: school-aid
      c: 'The American Bankers Association, United Student Aid Funds and the Government agree: state and private loan funds
        protected; where a State has none, the bankers to "support and promote" federal insurance. Robert Anderson enlisted,
        at Johnson''s instruction to Cater.'
      n: '[[w.bernstein-guns-or-butter]], 209. To check: Cater to Johnson, July 11, Aug. 25, 1965, with the American Bankers
        Association''s statement, Cater Papers, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 209 n.7). Check: the
        date (Bernstein tells it after the August events). Names: Anderson, Johnson.'
      tags:
      - name:anderson-robert-b
      - name:johnson-lyndon-b
      src:
        c: 073bf798
        rows:
        - 'w.bernstein-guns-or-butter 209: all'
        - 'via x.1965-07-11.cater-to-johnson-bankers: A'
- add:
    entry:
      id: cal.1965-07-17.school-aid
      when: July 17
      date: '1965-07-17'
      thread: school-aid
      c: 'Johnson proposes the teaching professions bill: a national teacher corps for poverty areas, fellowships for teachers,
        aid to colleges'' teaching programs. Morse puts it into S. 600; the House into its bill.'
      n: '[[w.bernstein-guns-or-butter]], 209. Check: the message in the Public Papers. See [[cal.1965-01-26.school-aid]].
        Names: Johnson, Morse.'
      tags:
      - name:johnson-lyndon-b
      - name:morse-wayne
      src:
        c: ba601d1d
        rows:
        - 'w.bernstein-guns-or-butter 209: all'
- add:
    entry:
      id: cal.1965-08.school-aid
      when: Aug., early
      date: 1965-08
      thread: school-aid
      also:
      - congress-powell
      c: 'Powell gone; McCormack, Albert and O''Brien cannot find him. Back, he demands action; McCormack and Albert will
        not put the higher education bill on the calendar. O''Brien: "They are totally disturbed with Powell."'
      n: '[[w.bernstein-guns-or-butter]], 208. To check: O''Brien to Johnson, Aug. 6, 1965, LE FA2 File, LBJ Library (cited
        by [[w.bernstein-guns-or-butter]], 208 n.7). Check: the days. See [[cal.1965-06-24.school-aid]]. Names: Powell, McCormack,
        Albert, O''Brien.'
      tags:
