      thread: medicare
      c: 'Ribicoff to Johnson: the House bill "may well foreclose all hope of a medicare bill for a long time." Offer the
        worker "a choice at age 65" between more cash and hospital insurance; a hard one "for Wilbur Mills to reject after
        Senate passage." Mansfield, Humphrey and Anderson for it, by Manatos.'
      n: '[[w.bernstein-guns-or-butter]], 166. To check: Ribicoff to Johnson, July 20, 1964, EX LE/IS File; Manatos to O''Brien,
        July 1964, Manatos Papers, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 166 n.3). Check: the day of Manatos''s
        report. See [[cal.1964-07-13.medicare]]. Names: Ribicoff, Johnson, Mills, Mansfield, Humphrey, Anderson, Manatos.'
