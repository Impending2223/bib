        Care for the Aged Amendments*, Hearings, Senate Committee on Finance, 88th Cong., 2d sess. (Aug. 6–14, 1964), 65,
        73–74 (cited by [[w.bernstein-guns-or-butter]], 167 n.3). See [[cal.1964-07-29.medicare]]. Names: Gore, Javits, Celebrezze,
        Byrd.'
