      date: 1965-01
      thread: program
      also:
      - medicare
      c: 'The Fish Room. Johnson to the departments'' legislative men, Cohen among them: "every day while I''m in office,
        I''m going to lose votes"; "We''ve got to get this legislation fast. You''ve got to get it during my honeymoon."'
      n: '[[w.bernstein-guns-or-butter]], 170. To check: Wilbur J. Cohen, Oral History Interview, LBJ Library (cited by [[w.bernstein-guns-or-butter]],
        170 n.4). Check: the day. See [[cal.1965-01-07.medicare]]. Names: Johnson, Cohen.'
