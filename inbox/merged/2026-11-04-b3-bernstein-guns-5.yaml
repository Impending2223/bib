      thread: program
      c: 'The White House pool. Johnson, swimming, to Moyers and Goodwin, by Goodwin''s account: "two basic problems—get elected
        and pass legislation the country needs"; the Kennedy program "a springboard"; "You start to put together a Johnson
        program."'
      n: '[[w.bernstein-guns-or-butter]], 131. To check: [[w.goodwin-remembering-america]], 267–81 (cited by [[w.bernstein-guns-or-butter]],
