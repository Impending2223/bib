      id: cal.1965-03-03.medicare
      when: Mar. 3
      date: '1965-03-03'
      thread: medicare
      c: 'Ways and Means. Cohen presents the bill woven together overnight: Myers''s financing of the doctors'' insurance,
        a $50 deductible and $6 a month, $3 from the person and $3 from the Treasury. Mills: "O.K. ... it sounds fine."'
      n: '[[w.bernstein-guns-or-butter]], 172. See [[cal.1965-03-02.medicare]]. Names: Cohen, Mills.'
      tags:
      - name:cohen-wilbur-j
      - name:mills-wilbur-d
