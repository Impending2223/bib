      - school-aid
      c: 'McNamara, Celebrezze and Keppel before the House poverty subcommittee. McNamara: one in three young men examined
        fails the minimum physical and mental standards; inactive installations for the Job Corps camps; to Edith Green, of
        programs for young women, "the simple answer is yes." Keppel to Green, of beginning at sixteen: "You are quite right
        that educationally the effort . . . must start at a younger age."'
      n: 'Daily Digest, [110 Cong. Rec. D129](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=127)
        (Mar. 18, 1964) (the hearing, the witnesses). [[w.bernstein-guns-or-butter]], 107–9. To check: *Economic Opportunity
        Act of 1964*, Hearings Before the Committee on Education and Labor, H.R., 88th Cong., 2d sess. (1964), pt. 1 (cited
        by [[w.bernstein-guns-or-butter]], 107 n.8). Check: the days of Green''s questions (Bernstein does not date them).
        See [[cal.1964-03-17.poverty]]. Names: McNamara, Celebrezze, Keppel, Green.'
      tags:
      - name:mcnamara-robert-s
      - name:celebrezze-anthony-j
