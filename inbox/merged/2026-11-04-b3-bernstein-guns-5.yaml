      date: '1964-07-13'
      thread: medicare
      c: 'Cohen to Celebrezze, a substitute for the House bill: a flat $7 a month more for every retired and disabled worker,
        taken in cash or $5 of it for 45 days of hospital insurance without a deductible; 0.2 percent more in contributions
        on each side.'
      n: '[[w.bernstein-guns-or-butter]], 165–66. To check: Cohen to Celebrezze, July 13, 1964, EX LE/IS File, LBJ Library
