    entry:
      id: cal.1965-02-26.school-aid-2
      when: Feb. 26
      date: '1965-02-26'
      thread: school-aid
      c: 'Valenti to Johnson, on his meeting with Archbishop Vagnozzi, the Apostolic Delegate: he "strongly" favors the bill
        as it is, the "great majority" of the bishops with him, Spellman too; McIntyre alone against, he expects.'
      n: '[[w.bernstein-guns-or-butter]], 190–91. To check: Valenti to Johnson, Feb. 26, 1965, LE FA2 File, LBJ Library (cited
        by [[w.bernstein-guns-or-butter]], 190 n.2). Check: the day of the meeting (Bernstein: "In February 1965"). Names:
        Valenti, Johnson, Vagnozzi.'
