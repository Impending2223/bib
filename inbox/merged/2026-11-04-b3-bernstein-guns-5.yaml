    entry:
      id: cal.1965-05-18.school-aid
      when: May 18
      date: '1965-05-18'
      thread: school-aid
      c: 'Green''s Special Subcommittee reports the higher education bill: more for several programs, the subsidized loans
        out, scholarships kept with half the support from elsewhere. Green tells Cater. Cater to Johnson: it "could increase
        the possibility of a Ribicoff Tax Credit Amendment."'
      n: '[[w.bernstein-guns-or-butter]], 207–8. To check: Cater to Johnson, May 18, 1965, Cater Papers, LBJ Library (cited
        by [[w.bernstein-guns-or-butter]], 208 n.7). See [[cal.1965-01-12.school-aid-4]]. Names: Green.'
      tags:
      - name:green-edith
      src:
