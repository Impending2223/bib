- add:
    entry:
      id: cal.1965-01-26.school-aid
      when: Jan. 26
      date: '1965-01-26'
      thread: school-aid
      c: 'Morse''s subcommittee opens hearings on the education bill, to Feb. 11: 103 witnesses, 42 statements; Killian, Folsom
        and Flemming for it. Robert Kennedy to Keppel and Celebrezze: a broader definition of the deprived; school boards
        that will not deal with it. Edward Kennedy and Nelson''s teacher corps put off for the higher education bill.'
      n: '[[w.bernstein-guns-or-butter]], 198–99. To check: *Higher Education Act of 1965*, Hearings, Senate Subcommittee
        on Education, 89th Cong., 1st sess. (1965), pt. I (cited by [[w.bernstein-guns-or-butter]], 199 n.3). Check: the days
        of Robert Kennedy''s questions. See [[cal.1965-01-22.school-aid]]. Names: Morse, Killian, Folsom, Flemming, Robert
        Kennedy, Keppel, Celebrezze, Edward Kennedy, Nelson.'
