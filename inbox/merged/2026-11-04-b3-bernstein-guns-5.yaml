      c: 'Robert Kennedy before the House poverty subcommittee. To Goodell, on community action and the churches: no objection
        to a grant to a church that "expended the funds . . . in a nondiscriminatory way." For women in the Job Corps. The
        subcommittee later takes Yarmolinsky''s amendment: church-related programs without sectarian instruction or worship.'
      n: 'Daily Digest, [110 Cong. Rec. D155](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=153)
