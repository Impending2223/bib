- add:
    entry:
      id: cal.1965-03-03.medicare-2
      when: Mar. 3
      date: '1965-03-03'
      thread: medicare
      c: 'The Oval Office, the afternoon. Cohen with his written report: the Mills strategy "unassailable politically," but
        $400 to $500 million from the Treasury for the doctors'' bills. Johnson, by Cohen''s account: "I''m going to run and
        get my brother"; the $500 million given.'
      n: '[[w.bernstein-guns-or-butter]], 172. To check: Cohen to Johnson, Mar. 2, 1965, EX LE/IS File, LBJ Library (cited
