      id: cal.1965-04-13.school-aid
      when: Apr. 13
      date: '1965-04-13'
      thread: school-aid
      c: 'The East Room, a second ceremony for the education act. Johnson: Kennedy and Taft not alive to see the "dream come
        true"; "With all the differences I have with Wayne Morse on Viet-Nam, we don''t differ on education."'
      n: '[[w.bernstein-guns-or-butter]], 201. To check: Public Papers, Johnson, 1965, I, 412–19 (cited by [[w.bernstein-guns-or-butter]],
        201 n.4). See [[cal.1965-04-11.school-aid]]. Names: Johnson, Kennedy, Morse.'
