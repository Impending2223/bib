        c: d75dd56b
        rows:
        - 'w.bernstein-guns-or-butter 190–91: all'
        - 'via x.1965-02-26.valenti-to-johnson-le-fa2: all'
- add:
    entry:
      id: cal.1965-03-01.school-aid-3
      when: Mar. 1
      date: '1965-03-01'
      thread: school-aid
      c: 'Monday morning. Edith Green, back from Florida, before Education and Labor: "for a delay of several weeks," by O''Brien.
        She works with the Republicans on a substitute; tells Protestant leaders the bill would "put Catholic priests in the
        public schools."'
      n: '[[w.bernstein-guns-or-butter]], 195–96. Check: the days of her meetings. See [[cal.1965-02-26.school-aid]]. Names:
        Green, O''Brien.'
