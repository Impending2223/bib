      when: Feb. 25
      date: '1965-02-25'
      thread: school-aid
      also:
      - congress-powell
      c: 'Education and Labor''s regular day: a majority and a quorum present with a resolution to sit until the bill is voted
        out. Powell takes it up. O''Brien: "Powell had to rush to get in front of the troops."'
      n: '[[w.bernstein-guns-or-butter]], 194–95. To check: O''Brien to Johnson, Mar. 8, 1965, LE FA2 File, LBJ Library (cited
