      c: 'Wirtz before the House poverty subcommittee: the bill "the unanimous conclusion of the cabinet officers, Mr. Shriver,
        and the other members of the administration." "Our object is not to make poverty more endurable, but to get rid of
        it." Male youth unemployment 21 percent in June 1963; the program "must include action that affects women as well
        as men."'
      n: 'Daily Digest, [110 Cong. Rec. D133](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=131)
