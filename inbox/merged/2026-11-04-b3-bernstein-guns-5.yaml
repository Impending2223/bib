        to Johnson: "You should become the first Democratic candidate for President in history to win all six New England
        states"; the four Democratic Senators up to win; a House seat more likely in Connecticut, Maine and New Hampshire.'
      n: '[[w.bernstein-guns-or-butter]], 150. To check: O''Brien to Johnson, Oct. 9, 1964, PL 2 File, LBJ Library (cited
        by [[w.bernstein-guns-or-butter]], 150 n.8). See [[cal.1964-10-04.democratic-party]]. Names: O''Brien, McCormack,
        Johnson.'
      tags:
