        Urban Poverty*, II, 138–58, 169–81, Kennedy Library (cited by [[w.bernstein-guns-or-butter]], 94 n.5). Check: the
        day. See [[cal.1963-05-01.poverty]]. Names: Sorensen, Capron, Wirtz, Cohen, Gordon.'
