- add:
    entry:
      id: cal.1965-03-22.school-aid
      when: Mar. 22
      date: '1965-03-22'
      thread: school-aid
      c: 'McCormack has the Democratic leadership plan the floor fight on H.R. 2362. O''Brien: "the cornerstone to the entire
        Administration legislative program for the Eighty-ninth Congress"; "it could easily fall apart."'
      n: '[[w.bernstein-guns-or-butter]], 196. To check: [[w.eidenberg-act-of-congress]], ch. 5 (cited by [[w.bernstein-guns-or-butter]],
        196 n.3). Check: the day of O''Brien''s memorandum. See [[cal.1965-03-02.school-aid]]. Names: McCormack, O''Brien.'
