      id: cal.1965-09-01.school-aid
      when: Sept. 1
      date: '1965-09-01'
      thread: school-aid
      c: Labor and Public Welfare reports the higher education bill, H.R. 9567, amended, unanimously. Dominick calls it "excellent."
      n: '[[w.bernstein-guns-or-butter]], 209–10. See [[cal.1965-08-26.school-aid]]. Names: Dominick.'
      tags:
      - name:dominick-peter-h
      src:
        c: 2e6fdc3d
        rows:
        - 'w.bernstein-guns-or-butter 209–10: all'
