- add:
    entry:
      id: cal.1964-08-22.elections-1964-4
      when: Aug. 22
      date: '1964-08-22'
      thread: elections-1964
      c: 'Johnson tells O''Donnell to set the wheels in motion for a last-minute switch to Mansfield for Vice President. O''Donnell:
        Mansfield will not take it. Jenkins has Rowe, Mansfield''s old campaign manager, ask him. Mansfield: "No possible
        chance. I would not have the slightest interest in it."'
      n: '[[w.bernstein-guns-or-butter]], 140. To check: James H. Rowe, Jr., Oral History Interview, LBJ Library; [[w.white-making-of-the-president-1965]]
        (cited by [[w.bernstein-guns-or-butter]], 140 n.7). Check: the day of Rowe''s question. See [[cal.1964-07-30.elections-1964-2]].
        Names: Johnson, O''Donnell, Mansfield, Jenkins, Rowe.'
