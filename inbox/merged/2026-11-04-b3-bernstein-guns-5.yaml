        House Hearings, pt. 1 (cited by [[w.bernstein-guns-or-butter]], 108 n.8). Check: the day of the amendment. See [[cal.1964-03-17.poverty]].
        Names: Robert Kennedy, Goodell, Yarmolinsky.'
