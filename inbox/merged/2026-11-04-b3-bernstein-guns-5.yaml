      when: Mar. 30
      date: '1965-03-30'
      thread: school-aid
      c: Morse's subcommittee reports H.R. 2362 as the House passed it, 10 to 0; Yarborough and Dominick's amendment for the
        poorer States not pressed.
      n: '[[w.bernstein-guns-or-butter]], 199–200. To check: Cater to Johnson, Mar. 31, 1965, Cater Papers, LBJ Library (cited
