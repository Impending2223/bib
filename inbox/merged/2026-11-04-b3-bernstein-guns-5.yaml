      when: Aug. 26
      date: '1964-08-26'
      thread: elections-1964
      c: McCarthy, by telegram released to the press, withdraws his name, so the President's "choice would be a free one,"
        and urges Humphrey; his assistant reads it to Jenkins that morning. Jenkins asks him to nominate Humphrey; he proposes
        Dodd, then agrees.
