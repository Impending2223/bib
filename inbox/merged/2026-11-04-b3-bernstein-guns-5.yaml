- add:
    entry:
      id: cal.1965-03.school-aid-2
      when: Mar.
      date: 1965-03
      thread: school-aid
      also:
      - transition-and-staff
      c: 'Keppel names Loomis deputy commissioner of education. Loomis''s farewell to the Voice of America: Rowan''s "inept
        leadership," "political interference," in McGrory''s column in the *Star*. Johnson to Keppel: rescind it. Keppel refuses.'
      n: '[[w.bernstein-guns-or-butter]], 202. Check: the days. See [[cal.1965-04-02.transition-and-staff]]. Names: Keppel,
        Loomis, Rowan, McGrory, Johnson.'
