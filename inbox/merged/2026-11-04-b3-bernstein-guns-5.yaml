      date: '1964-07-30'
      thread: elections-1964
      also:
      - democratic-party
      c: 'Before the statement on the Vice Presidency, Johnson has Rowe make two points to Humphrey, that evening: as Vice
        President, total loyalty; "If you''ve got any strength, show it." Jenkins tells McCarthy he is still in the running.'
      n: '[[w.bernstein-guns-or-butter]], 139–40. To check: James H. Rowe, Jr., Oral History Interview, LBJ Library; [[w.white-making-of-the-president-1965]]
        (cited by [[w.bernstein-guns-or-butter]], 140 n.7). See [[cal.1964-07-30.elections-1964]]. Names: Johnson, Rowe, Humphrey,
        Jenkins, McCarthy.'
