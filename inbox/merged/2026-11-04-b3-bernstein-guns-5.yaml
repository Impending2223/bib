      when: Sept. 10
      date: '1965-09-10'
      thread: school-aid
      also:
      - civil-rights-the-executive
      c: 'Cohen, now Under Secretary, to O''Brien: Willcox finds a "great danger" that the Waggoner-Dirksen amendment, by
        "or any other Act," will be held to exempt all schools and colleges from Title VI; "If it passes in its present form,
        we intend to recommend that it be vetoed."'
      n: '[[w.bernstein-guns-or-butter]], 210. To check: Manatos to O''Brien, Sept. 20, 1965, with the Cohen and Willcox memoranda,
        Manatos Papers, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 210 n.8). See [[cal.1965-06-24.school-aid]].
        Names: Cohen, O''Brien, Dirksen.'
