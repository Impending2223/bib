    entry:
      id: cal.1970-11-10.soviet-union-leadership
      when: Nov. 10
      date: '1970-11-10'
      thread: soviet-union-leadership
      c: 'Moscow. Pelshe, Postovalov and Melnikov of the Party Control Committee call in Khrushchev, on the Politburo''s instruction, over his memoirs: *Time* announced Nov. 6 that *Life* would print them from Nov. 23 and a book, *Khrushchev Remembers*, go on sale Dec. 21. Pelshe: the way they were made, with many hands, broke party rules, and secrets have gone abroad; who passed the materials? Khrushchev: "I protest"; he gave them to no one, the report is a provocation; what he dictated is his right as a citizen and party member. He calls himself isolated, under house arrest in all but name; asks to be arrested or shot; stands by the Twenty-second Congress.'
      n: '[[w.khrushchev-1964-stenogrammy]], 438–44 (the appendix, the stenographic record, with Pelshe, Postovalov, Melnikov and Khrushchev present). Made public: 2007. To check: Dobrynin''s report from Washington, Nov. 6, 1970, cited as the Committee''s source; the record''s archive file, not given in the book. Names: Pelshe, Khrushchev. Check: Khrushchev says the radio that day reported de Gaulle''s death (Nov. 9); an earlier talk at Kirilenko''s with Demichev present is recalled but undated.'
