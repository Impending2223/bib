patch: 2026-11-12-b9-group-1
by: 'Claude (batch 9 reader: Berman, Lyndon Johnson''s War, and Nixon, RN; the ''already in'' rows; audited by Claude, batch 9 auditor)'
ops:
- add:
    entry:
      id: cal.1968-02.opinion
      when: Feb., early
      date: '1968-02'
      thread: opinion
      c: 'Gallup, early February: Johnson''s handling of his job, approve 41 percent, seven points down from the January survey.'
      n: '[[w.berman-lyndon-johnsons-war]], 166. To check: [[w.gallup-poll]], III. Names: Johnson. Check: the release, its day and field dates; Berman gives no note.'
      tags: [name:johnson-lyndon-b]
- cite:
    id: cal.1964-05-12.elections-1964
    item: '[[w.nixon-rn]], 259 (the Nebraska primary, May 12, and Nixon''s write-in vote there, 42,800; not the winners; not West Virginia)'
    units: '?'
- cite:
    id: cal.1968-01-25.japan-and-korea
    item: '[[w.berman-lyndon-johnsons-war]], 144 (after the seizure, not dated: 15,000 Air Force and Navy reservists mobilized, and 370 inactive aircraft; not the order or its terms)'
    units: '?'
- add:
    entry:
      id: cal.1968-01.japan-and-korea-pueblo-2
      when: Jan., from the 23rd
      date: '1968-01'
      thread: japan-and-korea-pueblo
      c: 'Rusk, publicly, on the seizure of the *Pueblo*: "I would not object to designating this an act of war in terms of the category of actions to be so construed. My strong advice to North Korea is to cool it."'
      n: '[[w.berman-lyndon-johnsons-war]], 144. See [[cal.1968-01-23.japan-and-korea]]. Names: Rusk. Check: the day and the occasion.'
      tags: [name:rusk-dean]
- add:
    entry:
      id: cal.1968-01.japan-and-korea-pueblo-3
      when: Jan., from the 23rd
      date: '1968-01'
      thread: japan-and-korea-pueblo
      c: 'North Korea releases a confession signed by Commander Bucher of the *Pueblo*: admissions of CIA contacts and of proposed aggression against Korea.'
      n: '[[w.berman-lyndon-johnsons-war]], 144. See [[cal.1968-01-23.japan-and-korea]]. Names: Bucher. Check: the day.'
      tags: [name:bucher-lloyd-m]
- add:
    entry:
      id: cal.1968-01.japan-and-korea-pueblo-4
      when: Jan., from the 23rd
      date: '1968-01'
      thread: japan-and-korea-pueblo
      also: [republican-party-congress]
      c: 'Bates (R-Mass.), senior Republican on House Armed Services, on the seizure of the *Pueblo*: "a dastardly act of piracy."'
      n: '[[w.berman-lyndon-johnsons-war]], 145. See [[cal.1968-01-23.japan-and-korea]]. Names: Bates. Check: the day and the occasion.'
      tags: [name:bates-william-h]
- add:
    entry:
      id: cal.1968-01.japan-and-korea-pueblo-5
      when: Jan., from the 23rd
      date: '1968-01'
      thread: japan-and-korea-pueblo
      c: 'Church (D-Idaho) on the seizure of the *Pueblo*: "an act of war," the honor of the United States at stake.'
      n: '[[w.berman-lyndon-johnsons-war]], 145. See [[cal.1968-01-23.japan-and-korea]]. Names: Church. Check: the day and the occasion.'
      tags: [name:church-frank]
