    id: cal.1967-09-13.vietnam-pennsylvania
    item: '[[w.dallek-flawed-giant]], 481 (the message of Sept. 13: the proposal "contained neither conditions nor threats
      and should not be rejected on these grounds"; not Kissinger, "remains open" or Bộ)'
    units: '?'
- cite:
    id: cal.1967-10-03.vietnam
    item: '[[w.dallek-flawed-giant]], 482 (Oct. 3 meeting: the Paris talks ("Pennsylvania"), the Shah''s initiative, Gromyko''s
      view; Johnson asks what effect his not running again would have on the war, Rusk urges him not to stand down; Johnson
      on four more years and "work my guts out"; congressional opinion convinced "we will lose the election if we do not do
      something about Vietnam quick"; not the hours, the attendees, the Pentagon march or the Friendly Five)'
    units: '?'
- cite:
    id: cal.1967-10-04.vietnam
    item: '[[w.dallek-flawed-giant]], 482–83 (Oct. 4, bombing and negotiations discussed, Rusk: "keep this dialogue going,"
      the North Vietnamese "still weaseling on us"; Johnson: "Let''s hit them every day and go every place except Hanoi";
      "I''m not as encouraged by all of this as you all are"; not the hours, "pour the steel on" or the other units)'
    units: '?'
- cite:
    id: cal.1967-10-16.vietnam
    item: '[[w.dallek-flawed-giant]], 483 (Oct. 16, Rusk: "we haven''t seen any serious response from Hanoi"; McNamara sees
      no damage in a pause, a "domestic plus"; Johnson doubts a long one; not the other units)'
    units: '?'
- cite:
    id: cal.1967-10-17.vietnam-2
    item: '[[w.dallek-flawed-giant]], 483 (Oct. 17, Johnson discusses leaking the initiative to the press: "We have to have
      something to carry us in this country. Every hawk and every dove and every general seems to be against us"; asks Rostow
      for a paper for continued bombing; not the hours, the attendees or the plan for the hearings)'
    units: '?'
- cite:
    id: cal.1967-10-18.vietnam-pennsylvania
    item: '[[w.dallek-flawed-giant]], 484 (the evening of Oct. 18: Johnson''s three options, an early pause, close the channel,
      or wait; Rusk for direct talks; Katzenbach and McNamara for a pause; Clifford and Taylor against; Johnson''s ten-man
      committee under Clifford and Rostow; not Kissinger''s presence or the rejection)'
    units: '?'
- cite:
    id: cal.1967-10-23.vietnam-pennsylvania
    item: '[[w.dallek-flawed-giant]], 484 (Oct. 23, Johnson concedes the Paris effort has failed: "I am unable to find any
      evidence—apart from hope or wishful thinking—which indicates that Hanoi is ready at this time to talk seriously"; not
      the other units)'
    units: '?'
- cite:
    id: cal.1967-10-23.vietnam
    item: '[[w.dallek-flawed-giant]], 485 (Oct. 23 with McNamara, Rusk and Wheeler: "We''ve almost lost the war in the last
      two months in the court of public opinion"; "What about the reserves?", McNamara and Wheeler seeing no need; "hit all
      the military targets short of provoking Russia and China")'
    units: E, F, G
- cite:
    id: cal.1967-10-25.vietnam-support
    item: '[[w.dallek-flawed-giant]], 492 (the White House–inspired National Citizens Committee for Peace with Freedom in
      Vietnam, among those enlisted for the case; not Douglas''s announcement, the members, Roche or the press release)'
    units: '?'
- cite:
    id: cal.1967-11-02.vietnam
    item: '[[w.dallek-flawed-giant]], 492 (Nov. 2, Johnson with Acheson and other "wise men" presses the case for "far more
      vigorous action to stabilize public support for our policy in Vietnam"; not the five questions)'
    units: '?'
- cite:
    id: cal.1967-10-31.vietnam-2
    item: '[[w.dallek-flawed-giant]], 494 (McNamara at lunch Oct. 31 (Dallek: "with the ''Wise Men''"): "Perhaps everything
      I and Dean Rusk have tried to do since 1961 has been a failure"; continuation of the present course "dangerous, costly
      in lives, and unsatisfactory to the American people"; not Clifford''s account)'
    units: '?'
- check:
    id: cal.1967-10-31.vietnam-2
    text: 'Check: [[w.dallek-flawed-giant]], 494, has McNamara''s lunch of Oct. 31 "with the ''Wise Men''"; they met Nov.
      1–2.'
- cite:
    id: cal.1967-10-31.vietnam
    item: '[[w.dallek-flawed-giant]], 496 (Humphrey in Saigon "from October 30 to November 1"; not Thiệu''s inauguration or
      the delegation)'
    units: '?'
- variant:
    id: cal.1967-10-31.vietnam
    unit: C
    witness: w.dallek-flawed-giant
    reads: Humphrey visited Saigon from October 30 to November 1
    at: '496'
- cite:
    id: cal.1967-11-01.vietnam-elections
    item: '[[w.dallek-flawed-giant]], 496 (Humphrey''s cable to Johnson, during or after the visit: "We are winning—steady
      progress is everywhere evident.... More than ever, I am convinced that what we are doing here is right"; the page gives
      neither the cable''s place nor its day)'
    units: '?'
- cite:
    id: cal.1967-11-08.vietnam
    item: '[[w.dallek-flawed-giant]], 497 (Nov. 8, Humphrey reports on his trip to the National Security Council, in an upbeat
      account of progress in the war and Saigon''s advance toward political democracy; Johnson pushes across a note ordering
      him "to make it short, make it sweet, and then shut up and sit down"; not the attendees, the hour or the units B to
      G)'
    units: '?'
- cite:
    id: cal.1968-01-29.vietnam-khe-sanh
    item: '[[w.dallek-flawed-giant]], 502–03 (Jan. 29 meeting with the Joint Chiefs: Johnson presses for confirmation that
      Westmoreland can "take care of the expected enemy offensive against Khe Sahn"; the Chiefs confident Westmoreland "could
      cope with any contingency"; not the written statement or its words)'
    units: '?'
- cite:
    id: cal.1968-01-30.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 503 (Johnson tells the congressional Democrats the Chiefs assured him of adequate forces
      at Khe Sanh: "I went around the table . . . I have it in writing that they are prepared"; not the hours, Byrd, Long
      or the enemy dead)'
    units: C
- cite:
    id: cal.1968-01-30.vietnam-tet-2
    item: '[[w.dallek-flawed-giant]], 504 (Rostow brings the news of the attacks on Saigon; Johnson: "This could be very bad.
      What can we do to shake them from this?"; not the lunch or Rostow''s words)'
    units: C
- cite:
    id: cal.1968-01-31.vietnam-tet-2
    item: '[[w.dallek-flawed-giant]], 505 (Jan. 31 with congressional leaders: "agents of the enemy" at work in this country;
      "The greatest source of Communist propaganda statements is our own statements"; asks the legislators to measure their
      statements; not the hours, the attendees, Korea or Helms)'
    units: '?'
- cite:
    id: cal.1968-02-02.vietnam-tet
    item: '[[w.dallek-flawed-giant]], 504 (the press conference of Feb. 2: the offensive no surprise and as a military campaign
      "a complete failure"; the Communists would try for "a psychological victory"; not the others)'
    units: A, B, C
- check:
    id: cal.1967-08-08.vietnam
    text: 'Check: [[w.dallek-flawed-giant]], 477, has Rusk at the meeting, questioning the escalation with McNamara.'
- cite:
    id: cal.1967-06-03.middle-east
    item: '[[w.dallek-flawed-giant]], 427 (after the pact of May 30, Eshkol presses Johnson anew for a commitment to force
      open the gulf; Johnson will not go beyond what he told Eban and counsels patience; no day; not the maritime plan)'
    units: '?'
- cite:
    id: cal.1967-07-24.republican-party
    item: '[[w.dallek-flawed-giant]], 414 (the evening of July 24, Johnson reads the Democratic leaders a UPI report of the
      Republican leaders: "The nation is in a crisis and this administration has failed even to make a proposal to protect
      our people on the streets and in their homes from riots and violence")'
    units: '?'
- cite:
    id: cal.1967-07-25.civil-disorders-detroit-2
    item: '[[w.dallek-flawed-giant]], 415 (Stanton of CBS: Johnson''s performance "too contrived and too political"; Johnson:
      "I had the best damn constitutional lawyer in the country write that statement"; no day; not Califano or King)'
    units: E
- cite:
    id: cal.1966-12-19.vietnam
    item: '[[w.dallek-flawed-giant]], 445 (Dec. 19, Goldberg asks U Thant to initiate "discussions which could lead to a cease-fire")'
    units: A
- cite:
    id: cal.1967-01-03.vietnam-diplomacy
    item: '[[w.dallek-flawed-giant]], 445 ("In January," no day: Salisbury reports Hanoi''s Foreign Minister interested in
      talks but unsure how to arrange them; Rostow: "conceivable, if not probable, that they are trying to get out of the
      war but don''t know how"; not the hour or C)'
    units: B
- cite:
    id: cal.1967-01-10.vietnam-sunflower
    item: '[[w.dallek-flawed-giant]], 445 (State tells Hanoi it wants "a mutually agreeable, completely secure arrangement
      for exchanging communications"; no day; not Moscow, Guthrie or "the highest priority")'
    units: '?'
- cite:
    id: cal.1967-01-17.vietnam-sunflower
    item: '[[w.dallek-flawed-giant]], 445 (Hanoi asks what the United States means by "completely secure arrangements" and
      a "settlement"; no day; not Moscow or Guthrie)'
    units: '?'
- cite:
    id: cal.1967-01-17.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 445 (Johnson urges Mansfield and Dirksen to keep the Senate doves from undermining the
      prospects for talks: "We now have a feeler back that seems reliable"; South Vietnamese morale better; no day; not B
      to F)'
    units: '?'
- cite:
    id: cal.1967-01-27.vietnam
    item: '[[w.dallek-flawed-giant]], 446 (at the end of January, no day, Hanoi rejects talks unless the United States first
      stops the bombing and "all other acts of war"; not Moscow, Lê Trang or Guthrie)'
    units: '?'
- cite:
    id: cal.1967-02-02.vietnam
    item: '[[w.dallek-flawed-giant]], 446 (at the beginning of February, no day, Johnson tells reporters he sees nothing from
      North Vietnam to be taken seriously, but is "anxious for them [the Vietnamese] to make any proposal," to be given "very
      prompt and serious consideration"; not the words of B or C)'
    units: '?'
- add:
    entry:
      id: cal.1967-02-01.vietnam
      when: Feb. 1
      date: '1967-02-01'
      thread: vietnam
      c: The Cabinet. Johnson asks McNamara to explain "why we would not stop bombing on a nonreciprocal basis."
      n: '[[w.dallek-flawed-giant]], 446. To check: Kintner to Roberts, Cabinet Meeting Notes, Feb. 1, 1967, Diary Backup
        (cited by [[w.dallek-flawed-giant]], 446 n.10). Names: Johnson, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- cite:
    id: cal.1967-02-06.robert-kennedy
    item: '[[w.dallek-flawed-giant]], 447–48 (Feb. 6, the Oval Office: Kennedy, the leak "from your State Department"; Johnson:
      "It''s not my State Department, goddamnit. It''s your State Department"; "I''ll destroy you and every one of your dove
      friends in six months"; Kennedy to tell reporters he brought home no peace feeler; Newsweek''s "significant peace signal";
      not the day of the Paris talk)'
    units: C, D
- cite:
    id: cal.1967-02.robert-kennedy
    item: '[[w.dallek-flawed-giant]], 448 (Johnson, sure Kennedy would leak the confrontation, beats him to it; Time reports
      Kennedy called Johnson a "sonofabitch"; no day)'
    units: B
- cite:
    id: cal.1967-03.robert-kennedy
    item: '[[w.dallek-flawed-giant]], 448 (the Gridiron dinner in March: "We had a long serious talk about the possibilities
      of a cease-fire, the dangers of escalation and the prospects for negotiation. And he promised me the next time we are
      going to talk about Vietnam"; no day; not C)'
    units: A
- cite:
    id: cal.1967-06-05.middle-east
    item: '[[w.dallek-flawed-giant]], 427–28 (June 5, the Israelis begin a six-day war, defeating Egyptian, Jordanian and
      Syrian forces; Johnson at a newspaper photograph of himself: "There''s a picture of a sad man"; that afternoon a State
      Department spokesman: the United States "neutral in thought, word and deed"; not the air strikes, the hot line or McCloskey
      by name)'
    units: B
- cite:
    id: cal.1967-06-07.middle-east
    item: '[[w.dallek-flawed-giant]], 431 (after Israel has seized all Jordanian territory west of the Jordan, Tel Aviv agrees
      to a cease-fire with Amman, June 7; not the Old City by name, Resolution 234 or the Special Committee)'
    units: C
- add:
    entry:
      id: cal.1967-06-21.middle-east-six-day-war-aftermath
      when: June 21
      date: '1967-06-21'
      thread: middle-east-six-day-war-aftermath
      c: 'Johnson, in private: the Middle East "an explosive" area, where the United States has limited influence.'
      n: '[[w.dallek-flawed-giant]], 431. To check: LBJ meeting with Bob Thompson, June 21, 1967, WHCF: Aides: Christian (cited
        by [[w.dallek-flawed-giant]], 431 n.121). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-07-15.vietnam-air-war
      when: July 15
      date: '1967-07-15'
      thread: vietnam-air-war
      c: 'Johnson to Rostow: "How could our bombing of the North Vietnamese transport system be intensified without excessive
        public clamor here and abroad?"'
      n: '[[w.dallek-flawed-giant]], 476. To check: Rostow to LBJ, July 15, 1967, NSF: Memos to the Pres. (cited by [[w.dallek-flawed-giant]],
        476 n.90). Names: Johnson, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-07-17.vietnam-air-war
      when: July 17
      date: '1967-07-17'
      thread: vietnam-air-war
      c: 'Rostow to Johnson: "As you know, our military feel that they have achieved real momentum in their attack on the
        northern part of North Vietnam."'
      n: '[[w.dallek-flawed-giant]], 476. To check: Rostow to LBJ, July 17, 1967, NSF: Memos to the Pres. (cited by [[w.dallek-flawed-giant]],
        476 n.89). See [[cal.1967-07-15.vietnam-air-war]]. Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
- cite:
    id: cal.1967-08-05.vietnam
    item: '[[w.dallek-flawed-giant]], 477 ("During the first week of August," no day: Clifford and Taylor urge Johnson to
      expand the target list and move the "margins" closer to China; without more bombing, no further along a year from now;
      not the allies, the troops or South Vietnam''s draft)'
    units: '?'
- cite:
    id: cal.1967-08-25.defense
    item: '[[w.dallek-flawed-giant]], 478 (after McNamara''s testimony the Joint Chiefs, enraged, consider a mass resignation;
      not Perry''s account, Harold Johnson or Aug. 26)'
    units: '?'
- cite:
    id: cal.1967-08-29.vietnam-air-war
    item: '[[w.dallek-flawed-giant]], 478 ("four days later," after Aug. 25, a CIA report: the bombing''s "increased effectiveness";
      "despite increasing hardships . . . caused by the air war, Hanoi continues to meet its own needs and to support its
      aggression in South Vietnam. Essential military and economic traffic continues to move"; not Helms by name, the title
      or the sorties)'
    units: '?'
- cite:
    id: cal.1967-09-12.vietnam
    item: '[[w.dallek-flawed-giant]], 478 (a secret memorandum Helms gives only to the President, Sept. 12: the United States
      could withdraw from Vietnam without lasting injury to its national security; not the envelope, the analyst or B)'
    units: '?'
- cite:
    id: cal.1967-08-17.vietnam
    item: '[[w.dallek-flawed-giant]], 480 (Kissinger presents the statement to the Frenchmen for Hanoi; they urge a reduction
      in the bombing during their next visit; no day; not McNamara or C and D)'
    units: '?'
- cite:
    id: cal.1967-09-05.press-and-broadcasting-2
    item: '[[w.dallek-flawed-giant]], 480 (Sept. 5, Johnson to American correspondents: "the new South Vietnamese government
      would seek peace . . . and that we would encourage them. We would stop bombing tomorrow if that could lead to productive
      talks"; North Vietnam "would offer no assurances that they won''t use a pause to their military advantage")'
    units: A, B
- cite:
    id: cal.1967-09-20.press-and-broadcasting
    item: '[[w.dallek-flawed-giant]], 481 (Sept. 20, Australian broadcasters: the restraint of the American forces; "I can
      prove that Ho is a son-of-a-bitch if you let me put it on the screen—but they [the TV networks] want me to be the son-of-a-bitch";
      NBC and the New York Times "committed to an editorial policy of making us surrender")'
    units: A, B
- cite:
    id: cal.1967-09-26.vietnam-pennsylvania
    item: '[[w.dallek-flawed-giant]], 481 (Sept. 26: the North Vietnamese "are playing us for suckers. They have no more intention
      of talking than we have of surrendering"; Katzenbach to write a memo on "wrapping it [the peace initiative] up, because
      we have been met twice with a firm no"; not the hour or those present)'
    units: B, C
- cite:
    id: cal.1967-09-29.vietnam
    item: '[[w.dallek-flawed-giant]], 481–82 (Sept. 29, San Antonio: "to send a trusted representative of America to any spot
      on this earth"; the bombing to stop "when this will lead promptly to productive discussions," Hanoi assumed not to take
      advantage; not the conference, B, C or D)'
    units: A
- add:
    entry:
      id: cal.1967-10-18.vietnam-2
      when: Oct. 18
      date: '1967-10-18'
      thread: vietnam
      c: 'CIA reports to Johnson: a bombing halt would guarantee nothing; the North Vietnamese would probably then demand
        that the negotiations include expressions of American willingness to withdraw troops from the South.'
      n: '[[w.dallek-flawed-giant]], 483 ("on the 18th"). Check: the day; Dallek''s note gives two CIA reports of Oct. 18
        sent with Rostow''s memorandum of Oct. 19. To check: Rostow to LBJ, Oct. 19, 1967, with two CIA reports of Oct. 18,
        1967, attached; Rostow to LBJ, Oct. 20, 1967, NSF: Memos to the Pres. (cited by [[w.dallek-flawed-giant]], 483 n.115).
        Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - source:cia
- cite:
    id: cal.1967-10-27.vietnam-air-war
    item: '[[w.dallek-flawed-giant]], 492 (Oct. 27: the air war "has just about become the war in the eyes of the press and
      the minds of the public"; the President to describe progress in the South; not B or C)'
    units: A
- cite:
    id: cal.1967-11-02.vietnam-support
    item: '[[w.dallek-flawed-giant]], 491 (Nov. 2, Johnson briefs House members: full agreement with the military on the "basic
      decisions"; the unstruck targets would cut supply by only 1 percent; the Communists "suffering terribly," 1,500 men
      a day to our 15)'
    units: A, B, C
- cite:
    id: cal.1967-11-01.vietnam
    item: '[[w.dallek-flawed-giant]], 494–95 (the memo McNamara gives Johnson Nov. 1, withheld from other officials: troop
      increases and doubled casualties on the present course; "a policy of stabilization," ground forces capped at 525,000;
      a unilateral and indefinite halt to the bombing of the North; more of the ground war to the South Vietnamese, to cut
      American casualties; not "draft," fifteen months, or Rusk, Rostow and Wheeler by name)'
    units: D
- cite:
    id: cal.1967-11-04.vietnam
    item: '[[w.dallek-flawed-giant]], 497 (the Tuesday lunch of Nov. 4: "how we are going to do a better job of winning the
      war in the South. We''ve been on dead center for the last year"; not the hour, those present or C to F)'
    units: B
- cite:
    id: cal.1967-11-08.vietnam-2
    item: '[[w.dallek-flawed-giant]], 497 (Wheeler to Westmoreland, Nov. 8: "Highest authority is now thinking in terms of
      assigning top priority to those programs which would have a maximum impact on progress in South Vietnam during the next
      six months"; the trip to Washington; not the lunch or the programs named in B)'
    units: '?'
- cite:
    id: cal.1968-01-10.vietnam
    item: '[[w.dallek-flawed-giant]], 502 (Jan. 10, Rostow: "for some time been asking questions about Khe Sahn"; "Westmoreland
      has it very much on his mind"; to "look further into our contingency planning")'
    units: A, B, C
- cite:
    id: cal.1968-01-17.program
    item: '[[w.dallek-flawed-giant]], 502 (Jan. 17, the State of the Union: the enemy''s hope that "America''s will to persevere
      can be broken. Well—he is wrong. America will persevere"; readiness to halt the bombing and talk; not the domestic program
      or the hour)'
    units: N
- cite:
    id: cal.1968-01-22.vietnam-tet
    item: '[[w.dallek-flawed-giant]], 502 (on the 22nd Westmoreland anticipates "a country-wide show of strength just prior
      to Tet, with Khe Sahn being the main event"; not Huế, Quảng Trị or Wheeler)'
    units: '?'
- cite:
    id: cal.1968-01-31.vietnam-tet
    item: '[[w.dallek-flawed-giant]], 503 (the attacks of Jan. 30–31: thirty-six provincial capitals, five of the six largest
      cities, almost a third of the district centers; in Saigon the embassy compound, Tân Sơn Nhứt, the palace, the Joint
      General Staff; most of Huế and the Citadel taken, held twenty-six days; not the hours, the radio station, D or E)'
    units: B, C
- add:
    entry:
      id: cal.1968-01-31.opinion-2
      when: Jan. 31
      date: '1968-01-31'
      thread: opinion
      also:
      - vietnam-tet
      c: 'Panzer to Johnson: "evidence that the people''s commitment to the Vietnam war is ''real and abiding.''" Despite
        the war, the domestic program need not be reduced, 64 to 24 percent; between guns and butter, the war first, 52 to
        30.'
      n: '[[w.dallek-flawed-giant]], 505. To check: Panzer to LBJ, Jan. 31, 1968, WHCF: EX/PR16 (cited by [[w.dallek-flawed-giant]],
        505 n.36). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b

- add:
    entry:
      id: cal.1968-03-14.vietnam-205000-3
      when: Mar. 14
      date: '1968-03-14'
      thread: vietnam-205000
      c: 'Johnson to Clifford: he believes in consultation but fears bringing too many people into the discussion
        lest Hanoi learn of his "new policy"; the head of the group studying Acheson''s idea not to reveal that
        he is "doing a Vietnam review job."'
      n: '[[w.dallek-flawed-giant]], 511. To check: Memo, Mar. 14, 1968, Clifford Papers (cited by [[w.dallek-flawed-giant]],
        511 n.51). Names: Johnson, Clifford, Acheson.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:acheson-dean-g
- add:
    entry:
      id: cal.1968-07-18.vietnam-2
      when: July 18–20
      date: '1968-07-18'
      thread: vietnam
      c: 'Honolulu. Clifford, privately to Johnson, Rusk and Rostow, by Clifford''s account: "we could not win the
        war"; "''absolutely certain'' that the South Vietnamese did not want the war to end—not while they were
        protected by over 500,000 American troops and a ''golden flow of money''"; Johnson to tell them "we were
        going to make an all-out effort to settle the war in the next six months." Rusk disagrees.'
      n: '[[w.dallek-flawed-giant]], 566. Check: the day; Dallek has the conference July 18–20. To check: [[w.clifford-counsel-to-the-president-2]],
        551–53; Notes for U.S. Briefing on Honolulu meetings, July 19, 1968, NSF: Rostow Files (cited by [[w.dallek-flawed-giant]],
        566 n.47). See [[cal.1968-07-18.vietnam]], [[cal.1968-07-19.vietnam]]. Names: Clifford, Johnson, Rusk, Rostow.'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1968-08-14.health
      when: Aug. 14
      date: '1968-08-14'
      thread: health
      c: 'Johnson to the annual convention of the National Medical Association, a group of black physicians: "every
        boy and girl born into this land has a chance to start life with good health. ... Medicare is a triumph
        of rightness"; "Now we must seek new ways to improve and to expand medical care."'
      n: '[[w.dallek-flawed-giant]], 552. To check: 1968–69 Pub. Papers, II, 882–89 (cited by [[w.dallek-flawed-giant]],
        552 n.8). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-09-09.cities-and-housing
      when: Sept. 9
      date: '1968-09-09'
      thread: cities-and-housing
      c: 'Johnson announces the National Housing Partnership, the industrialist Edgar F. Kaiser to head it: government
        and the private sector to build 600,000 low- and middle-income housing units.'
      n: '[[w.dallek-flawed-giant]], 553. To check: 1968–69 Pub. Papers, II (cited by [[w.dallek-flawed-giant]],
        553 n.10). See [[cal.1968-08-01.cities-and-housing]]. Names: Johnson, Kaiser.'
      tags:
