      - name:fortas-abe
- add:
    entry:
      id: cal.1968-11-05.vietnam-paris
      when: Nov. 5
      date: '1968-11-05'
      thread: vietnam-paris
      c: 'Thiệu and Kỳ ask Johnson for reassurances about the talks. Johnson, through Bunker: he is "in no mood
        for reassurances to them"; his "confidence in them is deeply shaken—very deeply shaken. If a viable relation
        is to be reestablished, it is their task—and they should set about it promptly—very promptly."'
      n: '[[w.dallek-flawed-giant]], 588. To check: Rostow to LBJ, Nov. 5, 1968, on Thieu and Ky, NSF: Country:
        Vietnam (cited by [[w.dallek-flawed-giant]], 588 n.109). See [[cal.1968-11-02.vietnam]]. Names: Thiệu, Kỳ,
        Johnson, Bunker.'
      tags:
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
      - name:johnson-lyndon-b
      - name:bunker-ellsworth
- add:
    entry:
      id: cal.1968-11-19.vietnam-paris
      when: Nov. 19
      date: '1968-11-19'
      thread: vietnam-paris
      c: Johnson calls Thiệu "intransigent"; Thiệu told "he was dealing with a more friendly President now than
        he would be in the future."
      n: '[[w.dallek-flawed-giant]], 597. Check: whether the second words were said to Thiệu or of him, at the meeting
        with Rusk and others that Dallek''s note cites. To check: LBJ meeting with Rusk et al., Nov. 19, 1968, NSF:
        Meeting Notes (cited by [[w.dallek-flawed-giant]], 597 n.133). See [[cal.1968-11-18.vietnam-paris]]. Names:
        Johnson, Thiệu.'
      tags:
      - name:johnson-lyndon-b
      - name:nguyen-van-thieu
- add:
    entry:
      id: cal.1968-11-20.vietnam-paris
      when: Nov. 20
      date: '1968-11-20'
      thread: vietnam-paris
      c: 'Clifford: "we are getting a run-around in Saigon. ... We cannot agree to what they are insisting on. We
        have a perfect right to go on with the talks."'
      n: '[[w.dallek-flawed-giant]], 597. To check: LBJ meeting with foreign policy advisers, Nov. 20, 1968, Tom
        Johnson Papers (cited by [[w.dallek-flawed-giant]], 597 n.133). Check: whether at the lunch of [[cal.1968-11-20.vietnam-operations-2]].
        See [[cal.1968-11-19.vietnam-paris]]. Names: Clifford.'
      tags:
      - name:clifford-clark
- add:
    entry:
      id: cal.1968-12-08.vietnam-paris
      when: Dec. 8
      date: '1968-12-08'
      thread: vietnam-paris
      c: Thiệu, having delayed it, sends Saigon's delegation to the Paris talks.
      n: '[[w.dallek-flawed-giant]], 597 (then its arguments over procedure, the substantive talks put off until
        Nixon took office). Check: the day, whether of its leaving or its arrival. See [[cal.1968-12-03.vietnam]].
        Names: Thiệu.'
      tags:
      - name:nguyen-van-thieu
- add:
    entry:
      id: cal.1968-12-09.soviet-union
      when: Dec. 9
      date: '1968-12-09'
      thread: soviet-union
      also:
      - testing-missile-talks
      c: 'Johnson to the embassy in Moscow, by back channel: "the whole government" in favor of missile talks; a
        failure to meet could mean a loss of "time, momentum, and unity" toward an arms control agreement.'
      n: '[[w.dallek-flawed-giant]], 596. To check: Message to Amb. Thompson, Dec. 9, 1968, NSF: Rostow Files (cited
        by [[w.dallek-flawed-giant]], 596 n.128). See [[cal.1968-11-26.testing-missile-talks]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-12-11.soviet-union
      when: Dec. 11
      date: '1968-12-11'
      thread: soviet-union
      also:
      - testing-missile-talks
      c: 'Thompson reports Dobrynin: if Johnson decided not to go ahead with the meeting, "that would be understood
        in Moscow and there would be no hard feelings." Johnson on the message: "I''m ready—are they?"'
      n: '[[w.dallek-flawed-giant]], 596. To check: Rostow to LBJ, Dec. 11, 1968, memos at 9:55 a.m. and 1:35 p.m.,
        NSF: Rostow Files (cited by [[w.dallek-flawed-giant]], 596 n.128). See [[cal.1968-12-09.soviet-union]].
        Names: Thompson, Dobrynin, Johnson.'
      tags:
      - name:thompson-llewellyn-e
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-12-11.soviet-union-2
      when: Dec. 11
      date: '1968-12-11'
      thread: soviet-union
      also:
      - testing-missile-talks
      c: 'Rostow to Johnson, later in the day: "every normal argument is for leaving it to Nixon. And that may be
        the correct course. But it may also be a decision we shall regret more than any other in the years ahead";
        a last assessment "before abandoning the concept finally." Johnson on the memo: "I agree."'
      n: '[[w.dallek-flawed-giant]], 596. To check: Rostow to LBJ, Dec. 11, 1968, memos at 9:55 a.m. and 1:35 p.m.,
        NSF: Rostow Files (cited by [[w.dallek-flawed-giant]], 596 n.128). See [[cal.1968-12-11.soviet-union]].
        Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
- cite:
    id: cal.1968-02-28.vietnam-205000
    item: '[[w.dallek-flawed-giant]], 508 (the review meeting of Feb. 28 on Wheeler''s report: Wheeler, the margin
      of victory "very thin in a number of battles," 1968 "a critical year in the war"; McNamara, his last full
      day in office, challenges him; Johnson asks Clifford to begin his term as Defense Secretary by considering
      the problems, "Give me the lesser of evils"; not a group to be headed, its members or Rostow)'
    units: A
- cite:
    id: cal.1968-03-04.vietnam
    item: '[[w.dallek-flawed-giant]], 509–10 (Clifford''s recommendation five days later: 22,000 more men for Vietnam,
      the rest of the request contingent on a week-by-week examination; his words at the White House meeting of
      Mar. 4; Rusk''s proposal to stop most of the bombing in the rainy season, Johnson: "Dean, I want you to really
      get on your horse on that one—right away"; not the number of reservists)'
    units: D, G
- variant:
    id: cal.1968-03-04.vietnam
    unit: F
    witness: w.dallek-flawed-giant
    reads: '"We seem to have gotten caught in a sinkhole. We put in more, they match it."'
    at: '509'
- variant:
    id: cal.1968-03-04.vietnam
    unit: H
    witness: w.dallek-flawed-giant
    reads: '"Dean, I want you to really get on your horse on that one—right away."'
    at: '510'
- cite:
    id: cal.1968-03-05.vietnam-205000-2
    item: '[[w.dallek-flawed-giant]], 510–11 (at a meeting the day after Mar. 4, Rusk urges a statement for the
      speech: the bombing limited "to those areas which are integrally related to the battlefield"; not Johnson''s
      question or the resumption)'
    units: '?'
- variant:
    id: cal.1968-03-05.vietnam-205000-2
    unit: C
    witness: w.dallek-flawed-giant
    reads: '"that U.S. bombing attacks on North Vietnam [would] be limited to those areas which are integrally related
      to the battlefield. No reasonable person could expect us to fail to provide maximum support to our men in
      combat. Whether this step I have taken can be a step toward peace is for Hanoi to determine."'
    at: 510–11
- cite:
    id: cal.1968-03-16.vietnam-2
    item: '[[w.dallek-flawed-giant]], 510 (the hard line to the National Alliance of Businessmen, Mar. 16, and the
      Farmers Union, Mar. 18: "We must meet our commitments in the world and in Vietnam. We shall and we are going
      to win"; Dallek does not assign the words to either speech)'
    units: '?'
- cite:
    id: cal.1968-03-18.vietnam
    item: '[[w.dallek-flawed-giant]], 510 (the speech to the National Farmer''s Union, Mar. 18, with the Alliance
      speech the hard line: "we are going to win"; Americans "to unite ... to stand up and be counted"; not the
      words of A or B)'
    units: '?'
- cite:
    id: cal.1968-03-20.vietnam-205000
    item: '[[w.dallek-flawed-giant]], 511–12 (Mar. 20: Johnson tells McPherson to "get ''peace'' out of the speech
      except [to say] that we''re ready to talk ... Let''s just make it troops and war"; to his closest White House
      advisers: "I want war like I want polio. What you want and what your image is are two different things," the
      speech to "meet emergency needs in strength" and make "a reasonable offer on peace"; not the hour, those present
      or the units B–E)'
    units: '?'
- cite:
    id: cal.1968-03-20.vietnam-205000-4
    item: '[[w.dallek-flawed-giant]], 511 (undated, in the second half of March: Rostow, Rusk and Clifford with
      Bùi Diễm, Americans "sick and tired of this war," Saigon faces "the loss of American support" unless it broadens
      the government, cleans up corruption and fights more effectively; not the day or the hour)'
    units: '?'
- cite:
    id: cal.1968-03-22.vietnam-205000
    item: '[[w.dallek-flawed-giant]], 512 (Mar. 22, Johnson tells most of the same group that, when the weather
      turns bad, "we should take advantage of possibilities for changes in bombing"; Clifford: the people "do not
      see victory ahead"; not those present or the units)'
    units: '?'
- cite:
    id: cal.1968-03-25.vietnam
    item: '[[w.dallek-flawed-giant]], 512 (Mar. 26, Johnson with the Chiefs, by Clifford a "painfully sad speech":
      "We need more money in an election year, more taxes in an election year, more troops in an election year and
      more [budget] cuts in an election year. ... We have no support for the war"; not the causes Johnson names
      in H)'
    units: '?'
- cite:
    id: cal.1968-01-23.japan-and-korea
    item: '[[w.dallek-flawed-giant]], 514 (the seizure of the Pueblo, an intelligence ship, by the North Koreans,
      three and a half miles beyond territorial waters in the Sea of Japan, one fatality; the White House sees it
      tied to Tet; not the commander, the port or the 83)'
    units: '?'
- cite:
    id: cal.1968-01-23.japan-and-korea-pueblo-2
    item: '[[w.dallek-flawed-giant]], 514 (at two o''clock in the morning on Jan. 23 Johnson receives the news that
      the North Koreans have seized the Pueblo; not Rostow, the minute or the distress signal)'
    units: '?'
- cite:
    id: cal.1968-04-04.king
    item: '[[w.dallek-flawed-giant]], 533 (King assassinated Apr. 4 by a sniper, James Earl Ray, who escaped and
      was not apprehended until June; Johnson on hearing the news: "Everything we''ve gained in the last few days
      we''re going to lose tonight"; not the balcony, the hour, the hospital or the FBI''s identification)'
    units: '?'
- cite:
    id: cal.1968-04-05.king
    item: '[[w.dallek-flawed-giant]], 534 (Apr. 5 Johnson proclaims a day of mourning for King, announces his wish
      to go before Congress, writes McCormack and Ford urging "all good men" to ask "What more can I do to achieve
      brotherhood and equality among all Americans?"; his answer is passage of the Fair Housing law; not the quoted
      words of C, the day of mourning or the proclamation''s number)'
    units: '?'
- cite:
    id: cal.1968-04-10.open-housing
    item: '[[w.dallek-flawed-giant]], 534 (the House passes the bill Apr. 10; not the votes or the units C–E)'
    units: '?'
- cite:
    id: cal.1968-04-11.open-housing
    item: '[[w.dallek-flawed-giant]], 534 (Johnson signs the fair housing bill the following day, with an appeal
      for an end to violence and for legal processes like open housing; not the Act''s title or its contents)'
    units: '?'
- cite:
    id: cal.1968-04-03.vietnam
    item: '[[w.dallek-flawed-giant]], 537 (Apr. 3, Hanoi announces an interest in "contact with U.S. representatives
      to decide ... the unconditional cessation of bombing and all other war acts against the DRV so that talks
      can begin")'
    units: '?'
- variant:
    id: cal.1968-04-03.vietnam
    unit: A
    witness: w.dallek-flawed-giant
    reads: an interest in "contact with U.S. representatives to decide ... the unconditional cessation of bombing
      and all other war acts against the DRV so that talks can begin"
    at: '537'
- cite:
    id: cal.1968-05-03.vietnam
    item: '[[w.dallek-flawed-giant]], 538 (May 3, Hanoi offers to meet in Paris the following week and Johnson announces
      American agreement; he was reluctant about Paris and de Gaulle; not the hour, "May 10" or the consultation)'
    units: '?'
- cite:
    id: cal.1968-05-13.vietnam
    item: '[[w.dallek-flawed-giant]], 540 (the talks begin May 13; Johnson on the opening statement of the chief
      North Vietnamese delegate, "an editorial in Hanoi''s Communist party newspaper," "Their solution was for us
      to stop the bombing and pull all our forces out"; not the hotel, the hour or the delegates)'
    units: '?'
- cite:
    id: cal.1968-05-21.vietnam-paris
    item: '[[w.dallek-flawed-giant]], 537, 541 (Rusk presses on May 8, 15 and 21 for resumption of air attacks between
      the 19th and 20th parallels; Johnson will "put it [expanded bombing] off again against my better judgment,"
      words Dallek does not assign to one meeting; Clifford, May 21: no military solution, "Our hopes must go with
      Paris"; not the others at the lunch or the words of C and D)'
    units: B
- variant:
    id: cal.1968-05-21.vietnam-paris
    unit: E
    witness: w.dallek-flawed-giant
    reads: '"[But] I will put it [expanded bombing] off again against my better judgment" (of the meetings of May
      8, 15 and 21)'
    at: '537'
- cite:
    id: cal.1968-05-28.vietnam-paris
    item: '[[w.dallek-flawed-giant]], 541 (May 28, Johnson to his foreign policy advisers: "Why do you think we
      are getting the best of them in propaganda?"; "I am not quite as optimistic as Clark and Cy [Vance] about
      our position in world opinion"; not the units)'
    units: '?'
- cite:
    id: cal.1968-04-30.elections-1968-2
    item: '[[w.dallek-flawed-giant]], 545 (Apr. 30, after the White House evening, Rockefeller declares himself
      a candidate for the presidency)'
    units: A
- cite:
    id: cal.1968-04-23.elections-1968-3
    item: '[[w.dallek-flawed-giant]], 545 ("toward the end of April" the Rockefellers at dinner at the White House;
      Johnson urges him to declare for the Republican nomination and will never campaign against him; Apr. 30, Rockefeller
      declares; not the day, the secrecy or Johnson''s neutrality)'
    units: D
- cite:
    id: cal.1968-04-24.elections-1968
    item: '[[w.dallek-flawed-giant]], 546 (Johnson orders Califano to stop the Cabinet members who planned to attend
      Humphrey''s luncheon of Apr. 27: they are to "stay out of the race or get out of the government"; not the
      wire or the day of the order)'
    units: '?'
- cite:
    id: cal.1968-04-27.elections-1968
    item: '[[w.dallek-flawed-giant]], 546 (Humphrey announces his candidacy at a luncheon Apr. 27; several Cabinet
      members eager to attend; Johnson: "I can''t have the government torn apart by Cabinet officers and presidential
      appointees fighting among themselves"; not the hotel, the co-chairmen or the words of B)'
    units: '?'
- cite:
    id: cal.1968-04-29.elections-1968
    item: '[[w.dallek-flawed-giant]], 546–47 (Reuther and Johnson, each dancing around the nomination; Johnson:
      "Do whatever you are going to do and put it on the line. I don''t have the slightest doubt where your best
      interest lies"; not the hour, Califano''s presence or the date)'
    units: D
- cite:
    id: cal.1968-06-04.elections-1968
    item: '[[w.dallek-flawed-giant]], 547 (Robert Kennedy wins the California primary, which Dallek dates June 5,
      the day the returns came in; not the other primaries)'
    units: '?'
- cite:
    id: cal.1968-06-08.robert-kennedy
    item: '[[w.dallek-flawed-giant]], 548 (Johnson takes a low profile at the funeral mass in St. Patrick''s Cathedral
      on June 8 and at the funeral at Arlington, where Kennedy lies 100 feet from his brother''s grave; not the
      hour of the burial)'
    units: A, E
- cite:
    id: cal.1968-08-01.cities-and-housing
    item: '[[w.dallek-flawed-giant]], 552 (Aug. 1, Johnson hails the HUD Act of 1968 as "the Magna Carta to liberate
      our cities"; not the signing, the place or the act''s contents)'
    units: F
- cite:
    id: cal.1968-08-16.health
    item: '[[w.dallek-flawed-giant]], 552 (Aug. 17, Johnson announces the National Eye Institute and the enactment
      of a Health Manpower Act, the day the Papers give the statements; not the Stat. cites or the House vote)'
    units: '?'
- cite:
    id: cal.1968-08-18.consumers
    item: '[[w.dallek-flawed-giant]], 552 (Johnson signs the Wholesome Poultry Products Act "two days later" than
      Aug. 17, with the rhyme "Mary had a little lamb ... and now it''s labeled chicken"; Dallek''s day is Aug.
      19, the Papers'' date of the statement)'
    units: '?'
- variant:
    id: cal.1968-08-18.consumers
    unit: A
    witness: w.dallek-flawed-giant
    reads: Aug. 19 ("Two days later [than August 17], he signed the Wholesale Poultry Products Act")
    at: '552'
- cite:
    id: cal.1968-09-06.court
    item: '[[w.dallek-flawed-giant]], 552–53 (the news conference of Sept. 6: Congress "paid on a year-round basis,
      and even while the campaign is on, we have business to do," thirty or forty bills needing action; not the
      Fortas words or Mansfield and Dirksen)'
    units: '?'
- cite:
    id: cal.1968-09-11.jobs-and-wages
    item: '[[w.dallek-flawed-giant]], 553 (Sept. 11, Johnson asks Congress to pass a coal mine health and safety
      act before adjournment; not the miners'' figures)'
    units: '?'
- check:
    id: cal.1968-09-26.program
    text: 'Check: Dallek, 553, reads "the top ten—of the last 30 years," not fifty (the page image).'
- cite:
    id: cal.1968-08-19.testing
    item: '[[w.dallek-flawed-giant]], 555 (Aug. 19, Moscow cables its agreement to a Johnson visit to the Soviet
      Union in early October; Johnson planned to announce it Aug. 21; not Dobrynin''s note, Leningrad or the joint
      text)'
    units: '?'
- cite:
    id: cal.1968-08-20.soviet-union
    item: '[[w.dallek-flawed-giant]], 555 (the evening of Aug. 20 Dobrynin tells Johnson that Soviet forces have
      invaded Czechoslovakia to repress "a conspiracy of the external and internal forces of aggression against
      the existing social order"; not the hour, the others or Dubček)'
    units: '?'
- cite:
    id: cal.1968-08-20.soviet-union-czechoslovakia
    item: '[[w.dallek-flawed-giant]], 555 (Johnson instructs Rusk to tell Dobrynin of his decision not to announce
      anything about a visit or talks; not the hour, the place or the words)'
    units: '?'
- cite:
    id: cal.1968-10-01.court
    item: '[[w.dallek-flawed-giant]], 564 (the cloture vote fails 45 to 43, "well short of the required two-thirds";
      Fortas asks Johnson to withdraw his nomination; not "of those voting," the debate, Griffin or the day of Fortas''s
      request)'
    units: '?'
- cite:
    id: cal.1968-10-02.court-fortas
    item: '[[w.dallek-flawed-giant]], 564 (Johnson withdraws the nomination; Dallek dates it Oct. 1; not the words
      of the statement)'
    units: '?'
- variant:
    id: cal.1968-10-02.court-fortas
    unit: A
    witness: w.dallek-flawed-giant
    reads: Fortas asked the President to withdraw his nomination, which he did on October 1
    at: '564'
- cite:
    id: cal.1968-07-19.vietnam
    item: '[[w.dallek-flawed-giant]], 566–67 (Honolulu, July 18–20: Johnson confers with Clifford, Rusk, Bunker,
      Rostow, Thiệu and Kỳ; after seeing Thiệu and Kỳ alone he tells Clifford he raised all three of Clifford''s
      points with Thiệu; Thiệu: U.S. forces could begin withdrawing by mid-1969, no commitment to replace them,
      no halt until Hanoi''s troops leave the South; in the communiqué no "coalition government" or any other form
      imposed on the South)'
    units: F
- cite:
    id: cal.1968-08-29.elections-1968-chicago-8
    item: '[[w.dallek-flawed-giant]], 572 (Johnson insists that a movie about Robert Kennedy be shown on Aug. 29,
      the day after the nominations; not the introduction or the demonstration)'
    units: '?'
- cite:
    id: cal.1968-09-12.elections-1968
    item: '[[w.dallek-flawed-giant]], 576 (Sept. 12, after Humphrey''s word on troops home in 1969, Johnson to his
      foreign policy advisers, Clifford trying to calm him: "Look, I want the Vice President to win. ... I want
      the Democratic party to win"; "Humphrey wants space. In his heart he is with us, but he thinks it is politically
      wise to keep space")'
    units: B, C
- cite:
    id: cal.1968-10-02.testing-missile-talks
    item: '[[w.dallek-flawed-giant]], 581 (Oct. 2, Rusk discusses Vietnam with Gromyko, stressing the three conditions
      for a bombing halt; Rusk to Johnson: "Under no circumstances must Harriman know of these exchanges"; not the
      strategic arms answer)'
    units: '?'
- cite:
    id: cal.1968-10-09.vietnam
    item: '[[w.dallek-flawed-giant]], 582 (Oct. 9, that afternoon, the North Vietnamese delegates say they are ready
      to discuss the presence of the GVN at the talks in a private conversation later that week; not the tea break
      or the words of B)'
    units: '?'
- cite:
    id: cal.1968-10-11.vietnam-paris
    item: '[[w.dallek-flawed-giant]], 582 (Oct. 11, the North Vietnamese want to know whether the United States
      would stop bombing in return for including Saigon at the peace table; not Sceaux, Thọ or Vance''s words)'
    units: '?'
- cite:
    id: cal.1968-10-14.vietnam
    item: '[[w.dallek-flawed-giant]], 582–83 (Oct. 11–14, cables and White House discussions: Johnson asks Bunker,
      Abrams, Rusk, Clifford, Helms, Wheeler, Taylor, the Chiefs and Thiệu to review Hanoi''s proposal; at one meeting,
      "We resume bombing" if Hanoi violates the understandings; "Let''s try it"; not the day of each, Wheeler''s
      agreement or the instructions)'
    units: '?'
- cite:
    id: cal.1968-10-27.vietnam-paris
    item: '[[w.dallek-flawed-giant]], 584 (Oct. 27, both sides agree that the President will announce a halt on
      Oct. 31 and the talks start Nov. 2; not Vance''s or Rusk''s words)'
    units: '?'
- cite:
    id: cal.1968-10-27.elections-1968-chennault
    item: '[[w.dallek-flawed-giant]], 587 (Oct. 27, Chennault conveys "via Bui Diem apparently authoritative Republican
      messages urging Mr. Thieu to abort or cripple the [Paris] deal by refusing to participate"; Johnson learns
      of them on the 29th from intercepted South Vietnamese Embassy cables; not the word "again")'
    units: '?'
- cite:
    id: cal.1968-10-29.elections-1968-chennault
    item: '[[w.dallek-flawed-giant]], 585–86 (Oct. 29, Rostow tells Johnson of Eugene Rostow''s talk with Alexander
      Sachs; Walt Rostow sees "no hard evidence that Mr. Nixon himself is involved"; the Rostows think the information
      "explosive")'
    units: A
- cite:
    id: cal.1968-10-29.vietnam
    item: '[[w.dallek-flawed-giant]], 586 (the early morning meeting of Oct. 29 with military and diplomatic advisers:
      Johnson confirms his intention to stop the bombing; at 6:04 a.m. Rusk: Thiệu sees three days as too short
      to get a delegation to Paris; Johnson: "We can''t walk out, quit, split"; not the hour of the meeting, Abrams
      or the day held)'
    units: '?'
- cite:
    id: cal.1968-10-30.vietnam-paris
    item: '[[w.dallek-flawed-giant]], 587 (the White House meeting of Oct. 30: Clifford on Thiệu''s reply, "calculated,
      planned program to delay, to get through November 5 ... This message is ''horseshit''"; Johnson has Rusk tell
      Bunker "we are ready to go tonight," the halt the following day and the first plenary meeting Nov. 6; not
      Lâu or the hour)'
    units: '?'
- cite:
    id: cal.1968-10-31.vietnam
    item: '[[w.dallek-flawed-giant]], 587–88 (Bunker''s final run at Thiệu, Oct. 30–31, nine hours in three meetings
      on the 31st: Thiệu refuses to go to Paris before the election; Johnson''s final meeting with his advisers,
      the address at 8 that evening, the bombing to stop at 8 the next morning; the conference call to Humphrey,
      Nixon and Wallace at 6:05 p.m.)'
    units: E
- cite:
    id: cal.1968-11-02.vietnam
    item: '[[w.dallek-flawed-giant]], 588 (Nov. 1, after announcing a major speech to his Parliament, Thiệu refuses
      to see Bunker; Nov. 2, his public address: no one to be sent to Paris to begin negotiations with the NLF on
      Nov. 6; not the joint session or Bunker''s report)'
    units: '?'
- cite:
    id: cal.1968-11-03.elections-1968
    item: '[[w.dallek-flawed-giant]], 589 (Nov. 3, Johnson joins Humphrey at a rally in the Houston Astrodome; he
      also broadcasts a taped television talk from the White House; not the broadcast of C)'
    units: A, B
- cite:
    id: cal.1968-11-22.transition-and-staff-2
    item: '[[w.dallek-flawed-giant]], 596 ("at the end of November," the Nixon transition team asks for a copy of
      the task force report on government reorganization; Johnson: "Hell no. And tell him [Frank Lincoln, Nixon''s
      transition representative] I''m not going to publish my wife''s love letters either"; not the day, Murphy
      or Califano)'
    units: '?'
- cite:
    id: cal.1968-11-26.vietnam
    item: '[[w.dallek-flawed-giant]], 597 (Nov. 26, after Nixon''s "strong word" to Saigon, as Johnson privately
      called it, Saigon publicly agrees to go to Paris; not the statement or Johnson''s words)'
    units: A
- cite:
    id: cal.1969-01-07.vietnam-paris
    item: '[[w.dallek-flawed-giant]], 597 (Jan. 7, Johnson warns Thiệu of "the dangerous implications that I see
      developing from the situation in Paris. ... A continued stalemate on present lines can only have most serious
      effects on basic American public support for our whole effort to assist your country to preserve its independence";
      by Dallek''s note a cable to Saigon and Paris; not the lunch or Clifford''s part)'
    units: '?'
- cite:
    id: cal.1969-01-19.transition-and-staff
    item: '[[w.dallek-flawed-giant]], 598–99 (the last evening, the staff party in the mansion; Johnson to Califano
      of Fulbright: "We never should have let the fight become so personal"; not the church, the calls or the hour)'
    units: F
- cite:
    id: cal.1969-01-20.transition-and-staff-2
    item: '[[w.dallek-flawed-giant]], 599 (the Cliffords'' lunch for the Johnsons, at their Georgetown home, after
      the transfer of power; Johnson gives medals of freedom that day to Clifford, Rusk, Rostow, Arthur Krim and
      William S. White; the drive and helicopter ride to Andrews for the trip home)'
    units: '?'
- variant:
    id: cal.1969-01-20.transition-and-staff-2
    unit: A
    witness: w.dallek-flawed-giant
    reads: the Cliffords' lunch for the Johnsons "at their Georgetown home"
    at: '599'
- variant:
    id: cal.1969-01-20.transition-and-staff-2
    unit: B
    witness: w.dallek-flawed-giant
    reads: medals of freedom to "Clark Clifford, Dean Rusk, Walt Rostow, Arthur Krim, and the journalist William
      S. White"
    at: '599'
- cite:
    id: cal.1969-01-20.conservation
    item: '[[w.dallek-flawed-giant]], 599 (in his last official act before Nixon''s inaugural Johnson signs five
      proclamations adding lands to the national park system, the last establishing a "Franklin Delano Roosevelt
      Memorial Park"; not Marble Canyon or the others by name)'
    units: '?'
- check:
    id: cal.1969-01-20.conservation
    text: 'Check: Dallek, 599, gives five proclamations, the last establishing a "Franklin Delano Roosevelt Memorial
      Park"; the entry has four, none of them that.'
