patch: 2026-11-12-b9-dallek-b
by: 'Claude (batch 9 reader, Dallek, Flawed Giant, pp. 413–599: the ''already in'' rows; audited in two halves, pp. 413–505 and 506–599)'
ops:
- add:
    entry:
      id: cal.1967-06.middle-east-six-day-war
      when: June, early
      date: 1967-06
      thread: middle-east-six-day-war
      c: 'Johnson to Roche, in a take-off on Eban, "a little miniature Winston Churchill": "They''re going to hit. There''s
        nothing we can do about it." By Roche''s account.'
      n: '[[w.dallek-flawed-giant]], 427 ("at the beginning of June"). Check: the day. To check: NSC Histories, "Mid-East
        Crisis: Summary" and "The President in the Middle East Crisis, May 12–June 19, 1967," NSF; Rostow to LBJ, May 31,
        1967, Diary Backup; John P. Roche oral history (cited by [[w.dallek-flawed-giant]], 427 n.111). Names: Johnson, Roche,
        Eban.'
      tags:
      - name:johnson-lyndon-b
      - name:roche-john-p
      - name:eban-abba-s
- add:
    entry:
      id: cal.1967-09-15.vietnam-pennsylvania
      when: Sept. 15
      date: '1967-09-15'
      thread: vietnam-pennsylvania
      also:
      - labor
      c: 'Luncheon with the AFL-CIO Executive Council. Johnson: "We are offering to negotiate with Ho Chi Minh. Our position
        is clear. We will stop the bombing if he will launch productive and meaningful discussions. We are not asking, as
        most people think, that stopping the infiltration is a condition of a bombing pause."'
      n: '[[w.dallek-flawed-giant]], 481 (the luncheon "with U.S. labor leaders," two days after Sept. 13). To check: LBJ
        meeting with AFL-CIO Executive Council, Sept. 15, 1967, NSF: Meeting Notes File (cited by [[w.dallek-flawed-giant]],
        481 n.105). Names: Johnson, Ho.'
      tags:
      - name:johnson-lyndon-b
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1967-09-26.vietnam-support
      when: Sept. 26
      date: '1967-09-26'
      thread: vietnam-support
      c: 'Johnson to college and university educators: "The problem is not one of communication. The problem is that Ho wants
        South Vietnam. He isn''t going to give it up. He doesn''t want to talk about it."'
      n: '[[w.dallek-flawed-giant]], 481 (the same day as the meeting with McNamara and others). To check: LBJ meeting with
        educators, Sept. 26, 1967, Tom Johnson Papers (cited by [[w.dallek-flawed-giant]], 481 n.107). Names: Johnson, Ho.'
      tags:
      - name:johnson-lyndon-b
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1967-10-02.vietnam-3
      when: Oct. 2
      date: '1967-10-02'
      thread: vietnam
      c: 'Johnson to Clifford, Acheson and other "wise men," by Dallek: a bombing halt would show "frustration & failure"
        and encourage North Vietnam.'
      n: '[[w.dallek-flawed-giant]], 482. Check: who was present; Dallek''s note gives a meeting with Col. Robin Olds and
        Clifford''s notes of Oct. 2. To check: LBJ meeting with Col. Robin Olds, Oct. 2, 1967, Tom Johnson Papers; Clifford
        Notes on meeting with LBJ, Oct. 2, 1967, Clifford Papers (cited by [[w.dallek-flawed-giant]], 482 n.109). Names: Johnson,
        Clifford, Acheson.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:acheson-dean-g
- add:
    entry:
      id: cal.1967-10-25.vietnam-support-2
      when: Oct. 25
      date: '1967-10-25'
      thread: vietnam-support
      c: 'Rostow to McNamara, Rusk and Helms: "the President has an urgent need for reliable, usable data on Vietnam and ways
        of measuring the evolution of the conflict." A special interagency task force to be set up at once, reporting on that
        basis from Jan. 1, 1968.'
      n: '[[w.dallek-flawed-giant]], 492. To check: Rostow to McNamara et al., Oct. 25, 1967, NSF: Country: Vietnam (cited
        by [[w.dallek-flawed-giant]], 492 n.144). Names: Rostow, McNamara, Rusk, Helms.'
      tags:
      - name:rostow-walt-w
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:helms-richard
- add:
    entry:
      id: cal.1967-10-28.vietnam-diplomacy
      when: Oct. 28
      date: '1967-10-28'
      thread: vietnam-diplomacy
      c: 'Rostow to Johnson: an NLF contact describes three possible negotiations, on the political settlement within South
        Vietnam, on U.S.–Hanoi relations, and between North and South. Rostow: "the first piece of paper we have received
        from the other side which goes directly to the heart of the matter which is political settlement in South Vietnam."'
      n: '[[w.dallek-flawed-giant]], 484. To check: Rostow to LBJ, Oct. 28, 1967, NSF: Memos to the Pres. (cited by [[w.dallek-flawed-giant]],
        484 n.118). Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-11-01.vietnam-support
      when: Nov. 1
      date: '1967-11-01'
      thread: vietnam-support
      c: 'Johnson to Rostow: "I can''t clean up all the mess the New York Times leaves behind while these old pros and intellectuals
        [at Radio Free Europe] sit silent."'
      n: '[[w.dallek-flawed-giant]], 492. To check: LBJ to Rostow, Nov. 1, 1967, Handwriting File (cited by [[w.dallek-flawed-giant]],
        492 n.142). Names: Johnson, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1968-01-31.vietnam-tet-8
      when: Jan. 31
      date: '1968-01-31'
      thread: vietnam-tet
      c: 'Johnson to Westmoreland and Bunker: daily press briefings to "convey to the American public your confidence in our
        capability to blunt these enemy moves, and to reassure the public here that you have the situation under control."'
      n: '[[w.dallek-flawed-giant]], 505. To check: Schandler, *The Unmaking of a President*, 83–84 (cited by [[w.dallek-flawed-giant]],
        505 n.35). Names: Johnson, Westmoreland, Bunker.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:bunker-ellsworth
