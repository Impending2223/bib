      date: '1968-10-01'
      thread: court
      c: 'Johnson, privately to a journalist: if he had another four-year term, "the Fortas appointment would have
        been different."'
      n: '[[w.dallek-flawed-giant]], 564. Check: the day, from Dallek''s note (564 n.41), which dates the meeting
        with David Wise. To check: LBJ meeting with David Wise, Oct. 1, 1968, WHCF: Aides: Christian (cited by [[w.dallek-flawed-giant]],
        564 n.41). See [[cal.1968-10-01.court]]. Names: Johnson, Fortas.'
      tags:
