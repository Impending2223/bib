        - 'via w.fursenko-khrushchevs-cold-war 332 n.32: all'
- add:
    entry:
      id: cal.1960-11-23.laos
      when: Nov. 23
      date: '1960-11-23'
      thread: laos
      also:
      - soviet-union
      c: 'Vientiane. Souvanna Phouma with Abramov: the Thai blockade, food rotting at Bangkok; asks an airlift of food, and
        arms for three infantry and two airborne battalions, "1/2 or even 1/5" of the list given the American mission; "All
        of this is needed as soon as it can be brought here." A government of national unity planned, Souphanouvong agreeing.
        The Soviets agree to food and fuel. Before the meeting he tells the press he will ask economic and "perhaps" military
        aid.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 331–32. To check: Abramov and Souvanna Phouma, Nov. 23, 1960, AVPRF (cited
        by [[w.fursenko-khrushchevs-cold-war]], 331 n.29); "Soviet Aid to Arrive in Laos in Few Days," *New York Times*, Nov.
        24, 1960 (cited 332 n.31). See [[cal.1960-10-27.laos]]. Names: Souvanna Phouma, Abramov, Souphanouvong.'
      tags:
      - name:souvanna-phouma
      - name:abramov-aleksandr-n
      - name:souphanouvong
      - place:vientiane
      src:
        c: f1913f48
        rows:
        - 'w.fursenko-khrushchevs-cold-war 331–32: all'
        - 'via w.fursenko-khrushchevs-cold-war 331 n.29: A-B'
