      c: The Group of Soviet Forces in Germany brings its alert from the highest to normal and stops its daily reports to
        Khrushchev on the American forces and Berlin.
      n: '[[w.fursenko-khrushchevs-cold-war]], 421. To check: Malinovsky and Zakharov to the Central Committee, Jan. 10, 1962,
        RGANI (cited by [[w.fursenko-khrushchevs-cold-war]], 421 n.25). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - name:malinovsky-rodion-yakovlevich
      src:
        c: 8f98cad9
        rows:
