      date: '1960-08-05'
      thread: congo
      also:
      - soviet-union
      c: 'Khrushchev to Lumumba, not to Kasavubu: "the Soviet Union is prepared to give and is already giving the Republic
        of Congo comprehensive support and assistance"; the imperialists'' "plots and terrorist acts of every kind" call for
