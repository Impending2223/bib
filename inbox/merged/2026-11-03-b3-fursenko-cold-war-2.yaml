- add:
    entry:
      id: cal.1962-01.laos
      when: Jan.
      date: 1962-01
      thread: laos
      also:
      - soviet-union
      - china
      c: 'Moscow. Souphanouvong, the Pathet Lao''s leader, with Khrushchev, invited to head off the attack on Nam Tha: the
        Foreign Ministry''s paper fears it would let the Pathet Lao, the Vietnamese and the Chinese justify "a military resolution
        of the Laotian question"; Mao to learn that "the USA and the USSR did not intend to go to war in Laos in the name
        of China."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 424–25. To check: the Foreign Ministry''s note before Souphanouvong''s visit,
        Jan. 26, 1962, AVPRF (cited by [[w.fursenko-khrushchevs-cold-war]], 425 nn.35, 37). Check: the day. Names: Souphanouvong,
        Khrushchev.'
      tags:
      - name:souphanouvong
      - name:khrushchev-nikita-s
      src:
        c: 7f35f05f
        rows:
        - 'w.fursenko-khrushchevs-cold-war 424–25: all'
        - 'via w.fursenko-khrushchevs-cold-war 425 n.37: A'
- add:
