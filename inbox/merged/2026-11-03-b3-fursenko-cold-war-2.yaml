- add:
    entry:
      id: cal.1960-05-16.soviet-union-u2
      when: May 16
      date: '1960-05-16'
      thread: soviet-union-u2
      c: 'Khrushchev to the Kremlin on the first session: "The situation, as it has developed here, demonstrates once more
        the wisdom of the line we have taken"; the NATO allies, saving American face, want the Soviets to stay.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 286. To check: Khrushchev to the Central Committee, May 16, 1960, APRF (cited
        by [[w.fursenko-khrushchevs-cold-war]], 286 n.76). See [[cal.1960-05-15.soviet-union]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: fb6b5f1e
        rows:
        - 'w.fursenko-khrushchevs-cold-war 286: all'
        - 'via w.fursenko-khrushchevs-cold-war 286 n.76: all'
- add:
    entry:
      id: cal.1960-05-16.soviet-union-u2-2
      when: May 16
      date: '1960-05-16'
      thread: soviet-union-u2
      c: 'After dinner, Macmillan calls on Khrushchev at the Soviet Embassy: stay another two or three days; all spy, "microphones
        hidden in every embassy . . . even in ink wells"; "I ask you as a friend." Khrushchev: Dulles behind the flight, Eisenhower
        protecting him; "The Soviet Union is not Cuba, not Guatemala"; "go work on President Eisenhower"; "I don''t believe
        Eisenhower now."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 286–87 (the Soviet record). To check: Khrushchev and Macmillan, 2100 hours,
        May 16, 1960, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 286 n.77, 287 n.78). See [[cal.1960-05-15.soviet-union]].
        Names: Macmillan, Khrushchev, Dulles, Eisenhower.'
      tags:
      - name:macmillan-harold
      - name:khrushchev-nikita-s
      - name:dulles-allen-w
      - name:eisenhower-dwight-d
      src:
        c: 9a300714
        rows:
        - 'w.fursenko-khrushchevs-cold-war 286–87: all'
        - 'via w.fursenko-khrushchevs-cold-war 286 n.77: all'
- add:
    entry:
      id: cal.1960-05-17.soviet-union-u2
      when: May 17
      date: '1960-05-17'
      thread: soviet-union-u2
      also:
      - press-and-broadcasting
      c: 'Morning. Khrushchev, on the sidewalk before the Soviet Embassy, an impromptu press conference: he expects to leave
        France very soon. Then with Malinovsky to Pleurs-sur-Marne, where Malinovsky was billeted in the First World War:
        wine, cheese and the old soldier''s stories. Meanwhile the three Western leaders invite him to meet at 3 p.m.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 287. To check: Talbott ed., *Khrushchev Remembers: The Last Testament* (1974),
        458–59 (cited by [[w.fursenko-khrushchevs-cold-war]], 287 nn.79–80). See [[cal.1960-05-15.soviet-union]]. Names: Khrushchev,
        Malinovsky.'
      tags:
      - name:khrushchev-nikita-s
      - name:malinovsky-rodion-yakovlevich
      src:
        c: d6875434
        rows:
        - 'w.fursenko-khrushchevs-cold-war 287: all'
- add:
    entry:
      id: cal.1960-05-17.soviet-union-u2-2
      when: May 17
      date: '1960-05-17'
      thread: soviet-union-u2
      also:
      - berlin-and-vienna
      c: 'Khrushchev to the Kremlin, 2:15 p.m.: "The change in the situation that would have permitted us to stay has not
        occurred. Therefore we have decided to leave Paris." The East Germans to invite him to speak in East Berlin on the
        way home. To the French, by a junior diplomat: a meeting acceptable only to discuss the day before''s matter, and
        not before 5 p.m., "because Khrushchev had had no lunch."'
      n: '[FRUS 1958–60, IX, doc. 178](https://history.state.gov/historicaldocuments/frus1958-60v09/d178) (the Western leaders
        at 3 p.m., the Soviets absent). [[w.fursenko-khrushchevs-cold-war]], 288. To check: Khrushchev to the Central Committee,
        May 17, 1960, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 288 n.81). See [[cal.1960-05-15.soviet-union]].
        Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: aadf2614
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v09/d178: C'
        - 'w.fursenko-khrushchevs-cold-war 288: all'
        - 'via w.fursenko-khrushchevs-cold-war 288 n.81: A-B'
        - 'via w.fursenko-khrushchevs-cold-war 288 n.82: C'
- add:
    entry:
      id: cal.1960-05-19.soviet-union-u2
      when: May 19
      date: '1960-05-19'
      thread: soviet-union-u2
      also:
      - latin-america
      c: 'Eisenhower to President Lleras Camargo of Colombia: Khrushchev "must have concluded before coming to Paris that
        progress at a Summit Meeting would be either undesirable or impossible," and "embarked on a calculated campaign .
        . . to insure the failure of the conference."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 289. To check: Eisenhower to Lleras Camargo, May 19, 1960, no. 1541, *The Papers
        of Dwight David Eisenhower*, XX (cited by [[w.fursenko-khrushchevs-cold-war]], 289 n.86). Check: the day: "the day
        after the summit collapsed" (289); the letter dated May 19. See [[cal.1960-05-15.soviet-union]]. Names: Eisenhower,
        Lleras Camargo, Khrushchev.'
      tags:
      - name:eisenhower-dwight-d
      - name:lleras-camargo-alberto
      - name:khrushchev-nikita-s
      src:
        c: 792c5b66
        rows:
        - 'w.fursenko-khrushchevs-cold-war 289: all'
        - 'via w.fursenko-khrushchevs-cold-war 289 n.86: all'
- add:
    entry:
      id: cal.1960-06-07.testing
      when: June 7
      date: '1960-06-07'
      thread: testing
      also:
      - soviet-union
      c: 'Geneva. The Soviet Union''s "Basic Provisions of a Treaty on General and Complete Disarmament": the destruction
        of all strategic missiles and bombers the first step; "all disarmament measures be carried out under strict international
        control from beginning to end," foreign inspectors on Soviet soil once the weapons are destroyed.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 291. To check: "Basic Provisions of a Treaty on General and Complete Disarmament,"
        June 7, 1960, *Documents on International Affairs*, 1960 (1961) (cited by [[w.fursenko-khrushchevs-cold-war]], 291
        n.89). See [[cal.1960-02-01.soviet-union]].'
      src:
        c: 1c04dc26
        rows:
        - 'w.fursenko-khrushchevs-cold-war 291: all'
        - 'via w.fursenko-khrushchevs-cold-war 291 n.89: all'
- add:
    entry:
      id: cal.1960-06-10.soviet-union-u2
      when: June 10
      date: '1960-06-10'
      thread: soviet-union-u2
      c: 'The KGB lectures Powers: his flight wrecked the summit. Powers: "Whoever organized my flight, in my opinion, did
        not want to disrupt the summit"; he will not condemn the flights.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 288–89. See [[cal.1960-05-01.soviet-union]]. Names: Powers.'
      tags:
      - name:powers-francis-gary
      src:
        c: 71b66ff2
        rows:
        - 'w.fursenko-khrushchevs-cold-war 288–89: all'
        - 'via w.fursenko-khrushchevs-cold-war 289 n.84: all'
- add:
    entry:
      id: cal.1960-07-01.soviet-union
      when: July 1
      date: '1960-07-01'
      thread: soviet-union
      also:
      - defense
      c: 'An RB-47 out of a base in Britain, on a reconnaissance mission over the Barents Sea, shot down by the Soviet Air
        Force. Four of the crew killed, two taken. American intelligence: never nearer than thirty miles to Soviet airspace.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 290. To check: editorial note, FRUS 1958–60, X, pt. 1, 540–42 (cited by [[w.fursenko-khrushchevs-cold-war]],
        290 n.87). Report: [[cal.1960-07-11.soviet-union]].'
      src:
        c: 36c28ae2
        rows:
        - 'w.fursenko-khrushchevs-cold-war 290: all'
        - 'via w.fursenko-khrushchevs-cold-war 290 n.87: all'
- cite:
    id: cal.1960-08-17.soviet-union
    item: '[[w.fursenko-khrushchevs-cold-war]], 290 (three years in prison, seven at hard labor)'
    units: all
- add:
    entry:
      id: cal.1960-02-05.soviet-union
      when: Feb. 5
      date: '1960-02-05'
      thread: soviet-union
      also:
      - africa
      c: 'The Presidium approves a Friendship University in Moscow for students from Asia, Africa and the Middle East: Marxism-Leninism,
        agriculture, engineering. To open in October; 500 students expected, from ninety countries.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 292. To check: the Presidium''s resolution, Feb. 5, 1960, RGANI, in A. B. Davidson
        and S. V. Mazov eds., *Rossiya i Afrika: Dokumenty i materialy*, II, 313 (cited by [[w.fursenko-khrushchevs-cold-war]],
        292 n.1). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: ebcd24ce
        rows:
        - 'w.fursenko-khrushchevs-cold-war 292: all'
        - 'via w.fursenko-khrushchevs-cold-war 292 n.1: A'
- add:
    entry:
      id: cal.1960-02-18.middle-east
      when: Feb. 18
      date: '1960-02-18'
      thread: middle-east
      also:
      - soviet-union
      c: 'Baghdad, a housewarming for General Avkati of the Iraqi Air Force. The Communists closest to Qasim to the Soviet
        Ambassador, Zaitsev: Qasim''s autocracy strengthens the reactionaries. Mahdavi, his cousin, of the revolutionary tribunal,
        warned him; Qasim: "Does this mean you are tired of your job at the tribunal?"'
      n: '[[w.fursenko-khrushchevs-cold-war]], 293. To check: meeting, Zaitsev and Mahdavi, Feb. 18, 1960, AVPRF (cited by
        [[w.fursenko-khrushchevs-cold-war]], 293 nn.7–9).'
      src:
        c: 5f8e0dba
        rows:
        - 'w.fursenko-khrushchevs-cold-war 293: all'
        - 'via w.fursenko-khrushchevs-cold-war 293 n.9: all'
- add:
    entry:
      id: cal.1960-04-07.middle-east
      when: Apr. 7
      date: '1960-04-07'
      thread: middle-east
      also:
      - soviet-union
      c: 'The Presidium''s aide-mémoire for Mikoyan''s talks with Qasim in Baghdad: to report his "attitude toward the Communist
        Party"; to tell him Moscow is "unhappy" with his treatment of the Iraqi Communists; to bring KGB information on Western
        plots against him.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 294. To check: Protocol 274, Apr. 7, 1960, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        294 n.10). Names: Mikoyan.'
      tags:
      - name:mikoyan-anastas
      src:
        c: 983678df
        rows:
        - 'w.fursenko-khrushchevs-cold-war 294: all'
        - 'via w.fursenko-khrushchevs-cold-war 294 n.10: all'
- add:
    entry:
      id: cal.1960-04-14.middle-east
      when: Apr. 14
      date: '1960-04-14'
      thread: middle-east
      also:
      - soviet-union
      c: 'Baghdad. Mikoyan with Qasim, the visit long put off. On the Iraqi Communists, many in jail facing death: "This is
        an internal matter."'
