      when: Nov. 15
      date: '1960-11-15'
      thread: laos
      c: 'State''s spokesman advises Souvanna Phouma not to retake Luang Prabang: "such an open use of force would further
        exacerbate the situation . . . and might facilitate additional communist gains." Privately, no more American military
        aid to expect.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 330–31. To check: "U.S. Urges Laos Drop Attack Plan," *New York Times*, Nov.
        16, 1960 (cited by [[w.fursenko-khrushchevs-cold-war]], 331 n.26). See [[cal.1960-11-14.laos]]. Names: Souvanna Phouma.'
