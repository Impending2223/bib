- add:
    entry:
      id: cal.1962-07-01.berlin-and-vienna
      when: July 1
      date: '1962-07-01'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - missile-crisis
      c: 'The Presidium, Mikoyan absent, before Raúl Castro''s visit. Khrushchev renews the push on West Berlin: on a peace
        treaty the Western garrisons halved, under the UN flag; in two years replaced by non-Western UN troops; in six, all
        out; "An international organ is unacceptable"; even by "aggravating things." Against McNamara''s Ann Arbor speech:
        "Not targeting cities—how aggressive! . . . To get the population used to the idea that nuclear war will take place."
        The UN to take up Germany in a crisis once the missiles are in Cuba in November. The Soviet–Cuban defense agreement
        approved; Anadyr shipped by Nov. 1.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 440–43. To check: Protocol 39, July 1, 1962, [[w.prezidium-tsk-kpss-1954]],
        I (cited by [[w.fursenko-khrushchevs-cold-war]], 441 nn.6–9, 442 n.12). See [[cal.1962-06-10.missile-crisis]]. Names:
        Mikoyan, Khrushchev, McNamara, Raúl Castro.'
      tags:
      - name:mikoyan-anastas
      - name:khrushchev-nikita-s
      - name:mcnamara-robert-s
      - name:castro-raul
      src:
        c: f23606d8
        rows:
        - 'w.fursenko-khrushchevs-cold-war 440–43: all'
        - 'via w.fursenko-khrushchevs-cold-war 441 n.6: A-B'
        - 'via w.fursenko-khrushchevs-cold-war 442 n.12: C'
- add:
    entry:
      id: cal.1962-07-05.berlin-and-vienna
      when: July 5
      date: '1962-07-05'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Khrushchev to Kennedy, between his talks with Raúl Castro: further delay on a German settlement "would involve such
        a threat to peace which must be averted already now when it is not too late." The Western garrison in Berlin to be
        cut by half at once, replaced by Warsaw Pact, neutral and small NATO countries'' troops; the eleven thousand under
        the UN flag, all out in four years. Ulbricht, July 11, told only of serious negotiations ahead, and to tighten the
        border now if he wishes.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 445. To check: Khrushchev to Kennedy, July 5, 1962, FRUS 1961–63, XV, 207–12
        (cited by [[w.fursenko-khrushchevs-cold-war]], 445 n.21); Khrushchev to Ulbricht, July 11, 1962, APRF (cited 445 n.22).
        See [[cal.1962-07-01.berlin-and-vienna]]. Names: Khrushchev, Kennedy, Ulbricht.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:ulbricht-walter
      src:
        c: 492aef6a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 445: all'
        - 'via w.fursenko-khrushchevs-cold-war 445 n.21: A-B'
- add:
