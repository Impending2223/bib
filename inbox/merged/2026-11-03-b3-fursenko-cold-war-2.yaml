      - defense
      c: 'Two GRU reports to the Kremlin: days after Vienna the Pentagon seriously considered a nuclear first strike on the
        Soviet Union, held back by the Soviet tests of September; the source said to be in the American national security
        bureaucracy.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 424. To check: the GRU''s summary, GRU (cited by [[w.fursenko-khrushchevs-cold-war]],
        424 n.32). Check: Fursenko and Naftali compare Kennedy''s interview with Stewart Alsop in the *Saturday Evening Post*
        (424 n.32).'
