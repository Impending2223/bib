      when: May 4
      date: '1960-05-04'
      thread: soviet-union
      c: 'The Presidium approves Khrushchev''s changes in the leadership: Brezhnev to replace Voroshilov as chairman of the
        Presidium of the Supreme Soviet; Belyaev and Kirichenko out of the Presidium; Kosygin, Podgorny and Polyansky full
        members.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 273. To check: Protocol, May 4, 1960, [[w.prezidium-tsk-kpss-1954]], I (cited
        by [[w.fursenko-khrushchevs-cold-war]], 273 n.34). Names: Khrushchev, Brezhnev, Voroshilov, Kosygin, Podgorny.'
      tags:
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      - name:voroshilov-klimenti-efremovich
      - name:kosygin-aleksei
      - name:podgorny-nikolai-v
