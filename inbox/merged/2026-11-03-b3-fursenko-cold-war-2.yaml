      also:
      - soviet-union
      - china
      - vietnam
      c: 'A meeting of the four chief Communist parties of the region: the Soviet representative agrees to turn a blind eye
        to the military preparations in northern Laos, and to keep up the secret support to the Pathet Lao beside what reaches
        them through the agreement with Souvanna Phouma.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 425. To check: Abramov with Liu Chuna, Mar. 29 and 31, 1962, AVPRF (cited by
        [[w.fursenko-khrushchevs-cold-war]], 425 n.39). Check: the place. See [[cal.1962-02-03.laos]]. Names: Souvanna Phouma.'
      tags:
      - name:souvanna-phouma
      src:
        c: f051ee1c
        rows:
        - 'w.fursenko-khrushchevs-cold-war 425: all'
        - 'via w.fursenko-khrushchevs-cold-war 425 n.39: all'
- add:
    entry:
