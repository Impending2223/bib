- add:
    entry:
      id: cal.1960-05-14.soviet-union-u2
      when: May 14
      date: '1960-05-14'
      thread: soviet-union-u2
      c: 'Vnukovo. Khrushchev with Malinovsky, Gromyko and the Presidium''s members seeing them off; on the Il-18 he throws
        away his script: an apology from the United States the price of his part in the summit, else the delegation leaves
        without its proposals. The new speech written at the embassy in Paris, cabled to Moscow for approval. The demands:
        retraction, punishment of those "directly guilty," a pledge to end the flights; else no invitation to Eisenhower.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 282–83. To check: Khrushchev to the Central Committee, May 14, 1960, APRF (cited
        by [[w.fursenko-khrushchevs-cold-war]], 282 n.62); Troyanovsky, *Cherez gody i rasstoyaniya* (1997), 226 (cited 282
        n.63); Talbott ed., *Khrushchev Remembers: The Last Testament* (1974), 450–52 (cited 282 n.61, 283 nn.65–66). Check:
        Troyanovsky puts the decision in the lounge at Vnukovo, Khrushchev on the plane (282 n.61). See [[cal.1960-05-12.soviet-union-u2]].
        Names: Khrushchev, Malinovsky, Gromyko, Eisenhower.'
      tags:
      - name:khrushchev-nikita-s
      - name:malinovsky-rodion-yakovlevich
      - name:gromyko-andrei
      - name:eisenhower-dwight-d
      src:
        c: 8ed31192
        rows:
        - 'w.fursenko-khrushchevs-cold-war 282–83: all'
        - 'via w.fursenko-khrushchevs-cold-war 282 n.62: C'
        - 'via w.fursenko-khrushchevs-cold-war 282 n.61: B'
