- add:
    entry:
      id: cal.1962-08-01.berlin-and-vienna
      when: Aug. 1
      date: '1962-08-01'
      thread: berlin-and-vienna
      also:
      - intelligence
      c: 'A Special National Intelligence Estimate, "Soviet Intentions with Respect to Berlin": "the Soviets are probably
        convinced that no important change in the Western position can be obtained without greatly increased pressures"; harassment
        in the air corridors expected, nothing more, as they "almost certainly recognize that the balance of military power
        has undergone no change."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 449. To check: SNIE, "Soviet Intentions with Respect to Berlin," Aug. 1, 1962,
        NSF, box 100, LBJ Library (cited by [[w.fursenko-khrushchevs-cold-war]], 449 n.36).'
      src:
        c: 867c0c0e
        rows:
        - 'w.fursenko-khrushchevs-cold-war 449: all'
- add:
    entry:
      id: cal.1962-08-08.berlin-and-vienna
      when: Aug. 8
      date: '1962-08-08'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'The Oval Office, taped. Kennedy with Thompson, back from Moscow: "It''s like dealing with a bunch of bootleggers
        and gangsters." Khrushchev likely to take Berlin to the UN; the neutrals to be worked on. Kennedy: "Do you think that
        the Cuba thing and the fact that we hadn''t gone into Laos might have given him the impression that we were going
        to give way in Berlin?" Thompson: "He''s always felt he had us over a barrel in Berlin."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 449–50. To check: [Meeting with Llewellyn Thompson on Khrushchev](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-llewellyn-thompson-khrushchev),
        tape 8 (Miller Center); Naftali ed., *Presidential Recordings: John F. Kennedy*, I, 266–67 (cited by [[w.fursenko-khrushchevs-cold-war]],
        449 n.39, 450 nn.40–41). Names: Kennedy, Thompson, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:thompson-llewellyn-e
      - name:khrushchev-nikita-s
      src:
        c: a07b8211
        rows:
        - 'w.fursenko-khrushchevs-cold-war 449–50: all'
