        submarines: "We have here very many caves and all are unoccupied." Formal relations with Moscow premature.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 301–2. To check: Alekseyev to the Central Committee, Mar. 8, 1960, SVR (cited
        by [[w.fursenko-khrushchevs-cold-war]], 301 n.42). See [[cal.1960-03-04.cuba]]. Names: Castro, Khrushchev.'
