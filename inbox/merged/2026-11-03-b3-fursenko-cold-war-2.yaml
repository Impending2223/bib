      c: Devlin, the CIA's chief of station at Leopoldville, cables for "soonest high powered foreign make rifle with telescopic
        scope and silencer. Hunting good here when light's right." The poison sent him he throws into the Congo River.
      n: '[[w.fursenko-khrushchevs-cold-war]], 319. To check: [[w.kalb-congo-cables]], 133 (cited by [[w.fursenko-khrushchevs-cold-war]],
