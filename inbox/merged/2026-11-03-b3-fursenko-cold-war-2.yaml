      n: '[[w.fursenko-khrushchevs-cold-war]], 311. To check: the draft letter, Aug. 9, 1960, A. B. Davidson and S. V. Mazov
        eds., *Rossiya i Afrika: Dokumenty i materialy*, II, doc. 120; the Foreign Ministry''s note on the airplanes, ibid.,
