      when: Nov. 30
      date: '1960-11-30'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'The Kremlin. Khrushchev to Ulbricht: Berlin to be settled early in 1961 at a summit with Kennedy, one on one; the
        interim agreement prepared for Eisenhower, a time limit, then a free city; if Kennedy will not, an ultimatum again.
        Ulbricht: "you only talk about a peace treaty, but don''t do anything about it." Khrushchev: "[I]f there is not an
        interim agreement, then we will sign a peace treaty with the GDR"; the rockets on alert, but "our adversaries still
        haven''t gone crazy."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 340–41. To check: Ulbricht and Khrushchev, Nov. 30, 1960, East German and Russian
        records (cited by [[w.fursenko-khrushchevs-cold-war]], 341 nn.11–13). Names: Khrushchev, Ulbricht, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      - name:kennedy-john-f
      src:
