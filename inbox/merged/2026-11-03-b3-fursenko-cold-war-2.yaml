      when: Oct. 15
      date: '1960-10-15'
      thread: soviet-union
      also:
      - soviet-union-un
      - congo
      c: 'The Presidium, Khrushchev back from New York Oct. 13. "[W]e will not agree to any disarmament if the structure of
        the UN does not get changed." "The Congo [policy] is to our advantage. It discredits the imperialists and discredits
        the UN." Of Nkrumah in New York: "there is no other path for Africa except socialism," but no vote against Hammarskjöld.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 317, 319–20. To check: Protocol 306, Oct. 15, 1960, [[w.prezidium-tsk-kpss-1954]],
        I (cited by [[w.fursenko-khrushchevs-cold-war]], 317 n.114, 319 n.122, 320 n.128). See [[cal.1960-09-23.soviet-union]].
        Names: Khrushchev, Nkrumah, Hammarskjöld.'
      tags:
