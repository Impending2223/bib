      when: Jan. 2
      date: '1962-01-02'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Moscow. Thompson and Gromyko open a new round of talks on Berlin: the old stumbling blocks restated. Thompson''s
        instructions, after three months'' review and allied politics, little more than an international authority over the
        access routes.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 412, 416–17. To check: [FRUS 1961–63, XIV, doc. 251](https://history.state.gov/historicaldocuments/frus1961-63v14/d251)
        (Thompson''s report, Jan. 2). Names: Thompson, Gromyko.'
      tags:
      - name:thompson-llewellyn-e
      - name:gromyko-andrei
      src:
        c: ee21d7cf
        rows:
        - 'w.fursenko-khrushchevs-cold-war 412, 416–17: all'
- add:
    entry:
      id: cal.1962-01-08.soviet-union
      when: Jan. 8
      date: '1962-01-08'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'A rump Presidium, Mikoyan absent; Khrushchev to the leadership and the diplomats on the Berlin talks: "The enemy
        is strong . . . not weaker than we are"; Kennedy "lacks authority, moral or political"; "Eisenhower or Kennedy—[they
        are] the same shit." No deadline, but the pressure kept: "We should increase the pressure . . . be just like a meniscus.
        . . . If we don''t have a meniscus, we let the enemy live peacefully." A "final fight on the issue of West Berlin"
        inevitable; the GDR''s economy to be turned away from West Germany.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 5–6, 412–16. To check: Protocol 11 and the stenogram, Jan. 8, 1962, [[w.prezidium-tsk-kpss-1954]],
        I (cited by [[w.fursenko-khrushchevs-cold-war]], 412 n.10). Made public: the stenogram, some forty years later ([[w.fursenko-khrushchevs-cold-war]],
        5). See [[cal.1962-01-02.berlin-and-vienna]]. Names: Khrushchev, Kennedy, Eisenhower, Mikoyan.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
      - name:mikoyan-anastas
      src:
        c: a48ade56
        rows:
        - 'w.fursenko-khrushchevs-cold-war 5–6, 412–16: all'
        - 'via w.fursenko-khrushchevs-cold-war 412 n.10: all'
