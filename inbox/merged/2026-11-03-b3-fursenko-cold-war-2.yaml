        - 'via w.fursenko-khrushchevs-cold-war 421 n.25: all'
- add:
    entry:
      id: cal.1962-01-11.berlin-and-vienna
      when: Jan. 11
      date: '1962-01-11'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Thompson and Gromyko again. Gromyko rejects the international access authority, "violating GDR sovereignty and in
        effect creating a state within a state"; Western troops in a free city would mean Soviet troops too; new demands:
        no nuclear weapons for either Germany, East Germany''s borders guaranteed, a NATO–Warsaw Pact nonaggression treaty.
        Thompson: "a step backward."'
      n: '[FRUS 1961–63, XIV, doc. 264](https://history.state.gov/historicaldocuments/frus1961-63v14/d264) (Thompson''s report,
        Jan. 12). [[w.fursenko-khrushchevs-cold-war]], 418. See [[cal.1962-01-02.berlin-and-vienna]]. Names: Thompson, Gromyko.'
      tags:
      - name:thompson-llewellyn-e
      - name:gromyko-andrei
      src:
        c: b7fc06e0
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d264: all'
        - 'w.fursenko-khrushchevs-cold-war 418: all'
        - 'via w.fursenko-khrushchevs-cold-war 418 n.14: all'
