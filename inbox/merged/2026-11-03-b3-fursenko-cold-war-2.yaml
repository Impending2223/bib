- add:
    entry:
      id: cal.1961-10-30.berlin-and-vienna
      when: Oct. 30
      date: '1961-10-30'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Moscow. Ulbricht''s paper to Khrushchev: wrong to drop the peace treaty; the wall has not cured the GDR''s economy,
        worse now; "The nonconclusion of a peace treaty in this year . . . threatens the economic plan of the GDR of 1962."
        Sovereignty by a series of faits accomplis; a warning to Washington on its patrols along the autobahn. Oct. 27 he
        had told East Berlin to keep demanding papers.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 404–5. To check: Ulbricht to Khrushchev, Oct. 30, 1961, Harrison, "Ulbricht
        and the Concrete ''Rose''," appendix K (cited by [[w.fursenko-khrushchevs-cold-war]], 405 n.75); [[w.harrison-driving-the-soviets-up]],
        214 (cited 405 nn.73–74). See [[cal.1961-10-17.berlin-and-vienna]]. Names: Ulbricht, Khrushchev.'
      tags:
      - name:ulbricht-walter
      - name:khrushchev-nikita-s
      src:
        c: e9209e6a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 404–5: all'
        - 'via w.fursenko-khrushchevs-cold-war 405 n.75: A-B'
- add:
    entry:
      id: cal.1961-11-02.berlin-and-vienna
      when: Nov. 2
      date: '1961-11-02'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Khrushchev and Ulbricht, a bitter meeting. Khrushchev: the wall the victory, the West "already worn out" by Aug.
        13; a blockade feared. $450 million in gold sold in London for the GDR to buy from West Germany: "this is an irrational
        policy." "[A] Peace Treaty would provide no political advantage. . . . It is [however] advantageous for the GDR."
        Ulbricht: "OK, then all is clear." Tighter civil controls only: "I am for order."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 405–7 (the Soviet record; no East German one found). To check: Khrushchev and
        Ulbricht, Nov. 2, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 405 n.76). See [[cal.1961-10-30.berlin-and-vienna]].
        Names: Khrushchev, Ulbricht.'
      tags:
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      src:
        c: 55f677f1
        rows:
        - 'w.fursenko-khrushchevs-cold-war 405–7: all'
        - 'via w.fursenko-khrushchevs-cold-war 405 n.76: all'
- add:
    entry:
      id: cal.1961-11-09.soviet-union
      when: Nov. 9
      date: '1961-11-09'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'Khrushchev to Kennedy, privately: "I am writing not to argue with you"; the West would have the Soviet Union "assume
        the responsibilities of traffic policemen"; no free air corridors to a free West Berlin, the planes to land in East
        Germany; "I have no ground to retreat further, there is a precipice behind."'
      n: '[FRUS 1961–63, VI, doc. 23](https://history.state.gov/historicaldocuments/frus1961-63v06/d23). [[w.fursenko-khrushchevs-cold-war]],
        407–8. See [[cal.1961-09-29.soviet-union]]. Names: Khrushchev, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
        c: c71424a1
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v06/d23: all'
        - 'w.fursenko-khrushchevs-cold-war 407–8: all'
        - 'via w.fursenko-khrushchevs-cold-war 407 n.78: all'
- add:
    entry:
      id: cal.1961-11-09.berlin-and-vienna
      when: Nov. 9
      date: '1961-11-09'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Khrushchev to Kroll, the West German Ambassador, of the tanks at Checkpoint Charlie: "I knew Kennedy was looking
        for a way to back down. I decided therefore that if I removed my tanks first, then he would follow suit; [and] he
        did."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 404 and n.72. To check: Khrushchev and Kroll, Nov. 9, 1961, APRF (cited by
        [[w.fursenko-khrushchevs-cold-war]], 404 n.72). See [[cal.1961-10-27.berlin-and-vienna]]. Names: Khrushchev, Kroll,
        Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:kroll-hans-s
      - name:kennedy-john-f
      src:
        c: 02586c5a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 404 and n.72: all'
        - 'via w.fursenko-khrushchevs-cold-war 404 n.72: all'
