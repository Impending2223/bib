        - 'w.fursenko-khrushchevs-cold-war 446: all'
        - 'via w.fursenko-khrushchevs-cold-war 446 n.24: all'
- add:
    entry:
      id: cal.1962-07-19.berlin-and-vienna
      when: July 19
      date: '1962-07-19'
      thread: berlin-and-vienna
      also:
      - defense
      c: '10 a.m. Kennedy with his Berlin team on contingency plans: NATO''s too slow to start; NSAM 109, Poodle Blanket,
        sixty days of diplomacy and mobilization before an attack; a closing of the routes might force an early choice of
        nuclear weapons.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 446. To check: "Meeting with the President on Berlin Planning, 1000 hours,
        19 July 1962," in Naftali ed., *Presidential Recordings: John F. Kennedy*, I (cited by [[w.fursenko-khrushchevs-cold-war]],
        446 n.25). See [[cal.1962-07-17.berlin-and-vienna]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: ab3d13f5
        rows:
        - 'w.fursenko-khrushchevs-cold-war 446: all'
- add:
    entry:
      id: cal.1962-07-25.berlin-and-vienna
      when: July 25
      date: '1962-07-25'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - testing
      c: 'Khrushchev with Thompson, about to leave his post, five hours, from his office to the dacha. No hope of a test ban:
        "he did not think the Pentagon wanted it." Berlin a matter of Soviet prestige, to be settled very soon; should matters
        come to a head before or after the elections of Nov. 6? He wants to "help him." Thompson: determined, "deeply troubled."'
      n: 'FRUS 1961–63, XV, docs. [87](https://history.state.gov/historicaldocuments/frus1961-63v15/d87), [88](https://history.state.gov/historicaldocuments/frus1961-63v15/d88)
        (Thompson''s reports, July 25–26). [[w.fursenko-khrushchevs-cold-war]], 447. See [[cal.1962-07-17.berlin-and-vienna]].
        Names: Khrushchev, Thompson, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:thompson-llewellyn-e
      - name:kennedy-john-f
      src:
        c: a81385e6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v15/d87: all'
        - 'w.fursenko-khrushchevs-cold-war 447: all'
        - 'via w.fursenko-khrushchevs-cold-war 447 n.28: C-D'
- add:
    entry:
      id: cal.1962-07-25.soviet-union
      when: July 25–28
      date: '1962-07-25'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'The Foreign Ministry''s Third European Department asks the ambassadors in Israel, Egypt and the Congo for the UN
        forces'' deployment, procedures and legal basis, within two weeks; July 28, those in Tunisia, Syria, Lebanon, Morocco
        and Iraq, how foreign bases were closed, Dhahran and the French in North Africa among them: background for a proposal
        at the UN in November to replace NATO''s forces in West Berlin. Not told why.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 450–51. To check: Lavrov to Bodrov, July 25, 1962; the department to Tunis,
        Damascus, Beirut, Rabat and Baghdad, July 28, 1962, AVPRF (cited by [[w.fursenko-khrushchevs-cold-war]], 450 nn.42–43).
        See [[cal.1962-07-01.berlin-and-vienna]].'
      src:
        c: 95cce9bf
        rows:
        - 'w.fursenko-khrushchevs-cold-war 450–51: all'
        - 'via w.fursenko-khrushchevs-cold-war 450 n.42: A'
