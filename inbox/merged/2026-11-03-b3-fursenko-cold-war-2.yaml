      when: Mar. 20–21
      date: '1962-03-20'
      thread: laos
      also:
      - soviet-union
      - china
      - vietnam
      c: 'Souphanouvong to Abramov: a policy of "active defense," attacks on enemy strongholds in the "liberated areas," conducted
        "reasonably, so as not to cause a widening of the military conflict." Mar. 21, Abramov flies to Hanoi to tell Hồ Chí
        Minh that the Soviets leave the practical steps to the North Vietnamese, the Chinese and the Pathet Lao. China sends
        2,149 PLA soldiers, 1,772 workers, 203 vehicles, 639 horses and mules from Kunming toward Nam Tha.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 426. To check: Abramov with Liu Chuna, Mar. 29 and 31, 1962, AVPRF (cited by
        [[w.fursenko-khrushchevs-cold-war]], 426 n.40); Thee, *Notes of a Witness* (cited 426 n.41); Lifeng Deng, *Jianguohou
        junshi xingdong quanlu* (cited 426 n.42). Names: Souphanouvong, Abramov, Hồ Chí Minh.'
      tags:
      - name:souphanouvong
      - name:abramov-aleksandr-n
      - name:ho-chi-minh
      - place:hanoi
      src:
        c: dbac0154
        rows:
        - 'w.fursenko-khrushchevs-cold-war 426: all'
        - 'via w.fursenko-khrushchevs-cold-war 426 n.40: A'
