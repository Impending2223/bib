        to meet the Neo Lao Hak Xat; he declines, not yet received by the King or Souvanna.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 329–30. To check: Abramov''s diary, Oct. 13 and 17, 1960, AVPRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        330 n.23, 323 n.1). Names: Abramov, Kong Le, Souvanna Phouma.'
