      when: Feb. 3
      date: '1962-02-03'
      thread: laos
      also:
      - soviet-union
      c: 'Souphanouvong to Abramov: Nam Tha could be taken in "the course of a few hours," "a matter of political prestige,"
        but the Pathet Lao will not, "in order not to give any cause for a provocation."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 425. To check: Abramov and Souphanouvong, Feb. 3, 1962, AVPRF (cited by [[w.fursenko-khrushchevs-cold-war]],
