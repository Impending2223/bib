      when: July 6
      date: '1962-07-06'
      thread: missile-crisis
      also:
      - soviet-union
      - cuba
      c: 'The Presidium, after Khrushchev''s first meeting with Raúl Castro, July 3: at the Cubans'' and General Dementyev''s
        urging, the "defensive" weapons, the SAMs, to go first, all in July; the strategic missiles after, their shipments
        delayed for want of ships. All still to be done by Nov. 1.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 444–45. To check: Protocol 40, July 6, 1962, [[w.prezidium-tsk-kpss-1954]],
        I (cited by [[w.fursenko-khrushchevs-cold-war]], 444 n.18). See [[cal.1962-07.missile-crisis]]. Names: Khrushchev,
        Raúl Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-raul
      src:
        c: d4fbaf1d
        rows:
        - 'w.fursenko-khrushchevs-cold-war 444–45: all'
        - 'via w.fursenko-khrushchevs-cold-war 444 n.18: A'
