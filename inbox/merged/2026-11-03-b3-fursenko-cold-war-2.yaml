- add:
    entry:
      id: cal.1962-07-17.berlin-and-vienna
      when: July 17
      date: '1962-07-17'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Kennedy hands Dobrynin his reply to Khrushchev''s letter of July 5: the troops in West Berlin a "vital interest
        of the United States"; "none of the Soviet proposals for alternative arrangements could be accepted"; to accept would
        be "a major victory for the Soviet Union and a major defeat for the West."'
      n: '[FRUS 1961–63, XV, doc. 77](https://history.state.gov/historicaldocuments/frus1961-63v15/d77) (the conversation);
        [doc. 78](https://history.state.gov/historicaldocuments/frus1961-63v15/d78) (the letter). [[w.fursenko-khrushchevs-cold-war]],
        446. See [[cal.1962-07-05.berlin-and-vienna]]. Names: Kennedy, Dobrynin, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      src:
        c: 91c3e2ce
        rows:
