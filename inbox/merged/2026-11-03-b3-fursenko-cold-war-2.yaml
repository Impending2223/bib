- add:
    entry:
      id: cal.1960-05-05.soviet-union-u2
      when: May 5
      date: '1960-05-05'
      thread: soviet-union-u2
      c: 'Moscow, a reception at the Ethiopian Embassy after Khrushchev''s speech. The Swedish Ambassador asks Deputy Foreign
        Minister Malik the pilot''s fate: "I don''t know exactly. He is being questioned." Thompson, within earshot, cables
        at 7 p.m. the "possibility" that the pilot is alive.'
      n: '[FRUS 1958–60, X, pt. 1, doc. 147](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147) (editorial
        note). [[w.fursenko-khrushchevs-cold-war]], 273–74. See [[cal.1960-05-01.soviet-union]]. Names: Malik, Thompson.'
