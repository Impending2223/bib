    entry:
      id: cal.1961-08-24.berlin-and-vienna
      when: Aug. 24
      date: '1961-08-24'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Pervukhin and Konev to Ulbricht: a security zone on West Berlin''s side, and leave to the police to use force there,
        "could lead to a clash." Aug. 25, Ulbricht rescinds it: "no intention of interfering in the internal affairs of West
        Berlin." The single checkpoint stays.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 385–86. See [[cal.1961-08-22.berlin-and-vienna]]. Names: Pervukhin, Konev,
        Ulbricht.'
      tags:
      - name:pervukhin-mikhail-georgievich
      - name:konev-ivan-stepanovich
      - name:ulbricht-walter
      src:
        c: 280ba92a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 385–86: all'
- cite:
    id: cal.1961-08-30.berlin-and-vienna
    item: '[[w.fursenko-khrushchevs-cold-war]], 385 (the end of the moratorium announced; the tests at Semipalatinsk two days
      later)'
    units: B
- add:
    entry:
      id: cal.1961-08-29.berlin-and-vienna
      when: Aug. 29
      date: '1961-08-29'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - europe-and-the-alliance
      c: 'Adenauer''s secret message to Khrushchev, delivered by Ambassador Kroll to Kuznetsov: the situation to be met soberly;
        the greatest dangers "when tanks stand opposite tanks, at a distance of just some meters, as is the case now in Berlin,"
        and a wrong assessment; negotiations the only exit, soon, no need to wait for the elections of Sept. 17; the last
        Germans held in the Soviet Union to be released.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 389–90 (the Soviet Foreign Ministry''s rendering). To check: Kuznetsov with
        Kroll, Aug. 29, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 389 n.10). Made public: [[w.fursenko-khrushchevs-cold-war]],
        389–90 (2006). Names: Adenauer, Khrushchev, Kroll, Kuznetsov.'
      tags:
      - name:adenauer-konrad
      - name:khrushchev-nikita-s
      - name:kroll-hans-s
      - name:kuznetsov-vasily-v
      src:
        c: 2626ba1a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 389–90: all'
        - 'via w.fursenko-khrushchevs-cold-war 389 n.10: all'
- add:
    entry:
      id: cal.1961-09-05.press-and-broadcasting
      when: Sept. 5
      date: '1961-09-05'
      thread: press-and-broadcasting
      also:
      - berlin-and-vienna
      - soviet-union
      c: 'Moscow. Khrushchev with Sulzberger of the *New York Times*, five hours, invited by Yuri Zhukov''s cable of Aug.
        26. Material for front-page articles, and a note for Kennedy alone: "some sort of informal contact . . . to find a
        means of settling the crisis without damaging the prestige of the United States"; agreement "in principle with the
        peace treaty and a free city." Sulzberger mails it Sept. 10.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 388, 390. To check: Sulzberger, *The Last of the Giants* (1970), 786, 801–2
        (cited by [[w.fursenko-khrushchevs-cold-war]], 388 n.1, 390 n.12). See [[cal.1961-08-29.berlin-and-vienna]]. Names:
        Khrushchev, Sulzberger, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:sulzberger-c-l
      - name:kennedy-john-f
      src:
        c: 78ce5ff0
        rows:
        - 'w.fursenko-khrushchevs-cold-war 388, 390: all'
        - 'via w.fursenko-khrushchevs-cold-war 390 n.12: B'
- add:
    entry:
      id: cal.1961-09-03.berlin-and-vienna
      when: Sept. 3
      date: '1961-09-03'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: State instructs Thompson to propose talks between Rusk and Gromyko at the UN. Thompson, outside Moscow, takes some
        days to reach Khrushchev; by mid-September Khrushchev approves talks from Sept. 21.
      n: '[[w.fursenko-khrushchevs-cold-war]], 391–92. To check: Rusk to Thompson, Sept. 3, 1961; Thompson to Rusk, Sept.
        7, 1961, FRUS 1961–63, XIV, 388–89, 394–95 (cited by [[w.fursenko-khrushchevs-cold-war]], 391 nn.16–17). See [[cal.1961-09-21.berlin-and-vienna]].
        Names: Thompson, Rusk, Gromyko, Khrushchev.'
      tags:
      - name:thompson-llewellyn-e
      - name:rusk-dean
      - name:gromyko-andrei
      - name:khrushchev-nikita-s
      src:
        c: 1c18c9fa
        rows:
        - 'w.fursenko-khrushchevs-cold-war 391–92: all'
        - 'via w.fursenko-khrushchevs-cold-war 391 n.16: A'
- add:
    entry:
      id: cal.1961-09-12.berlin-and-vienna
      when: Sept. 12
      date: '1961-09-12'
      thread: berlin-and-vienna
      c: 'Kennedy to Rusk: a small group to prepare the position for negotiations on Berlin, Acheson and Johnson out, the
        Pentagon not told: "I am talking about a real reconstruction of our negotiating proposals, and not about a modest
        add-on." Reunification by free elections "not negotiable proposals." A free city of West Berlin to be considered,
        NATO to protect it.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 391–92. To check: Kennedy to Rusk, Sept. 12, 1961, FRUS 1961–63, XIV, 402–3
        (cited by [[w.fursenko-khrushchevs-cold-war]], 391 nn.18, 20). See [[cal.1961-09-04.berlin-and-vienna]]. Names: Kennedy,
        Rusk, Acheson, Johnson.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:acheson-dean-g
      - name:johnson-lyndon-b
      src:
        c: 02000e49
        rows:
        - 'w.fursenko-khrushchevs-cold-war 391–92: all'
        - 'via w.fursenko-khrushchevs-cold-war 391 n.18: all'
- add:
    entry:
      id: cal.1961-09-14.berlin-and-vienna
      when: Sept. 14–15
      date: '1961-09-14'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - defense
      c: Just after 5 p.m., two West German F-84 Thunderjets cross into East German airspace near Zlend, southwest of Magdeburg;
        eight Soviet fighters scrambled fail to intercept them in twenty-one minutes before they land at Tegel, in the French
        sector. Sept. 15, another F-84, four minutes over East Germany.
      n: '[[w.fursenko-khrushchevs-cold-war]], 392. To check: the Ministry of Defense''s daily reports, Sept. 15 and 16, 1961,
        Fond 89, Hoover Institution (cited by [[w.fursenko-khrushchevs-cold-war]], 392 n.21). See [[cal.1961-08-29.berlin-and-vienna]].'
      src:
        c: 0a2784cc
        rows:
        - 'w.fursenko-khrushchevs-cold-war 392: all'
        - 'via w.fursenko-khrushchevs-cold-war 392 n.21: all'
- add:
    entry:
      id: cal.1961-09-16.berlin-and-vienna
      when: Sept. 16
      date: '1961-09-16'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - europe-and-the-alliance-france
      c: 'Moscow. Khrushchev with Paul Reynaud, three hours; praises Lippmann''s "Nuclear Diplomacy" of Sept. 14: "He is certain
        that today war means suicide." Reynaud: "A new war would bring the suicide of the white race, giving China the chance
        to dominate the world." Khrushchev: class over race. The UN might move to West Berlin.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 392–93. To check: Dejean to Paris, Sept. 16, 1961, *Documents Diplomatiques
        Français*, 1961, II (cited by [[w.fursenko-khrushchevs-cold-war]], 392 n.23, 393 n.24). Names: Khrushchev, Reynaud,
        Lippmann.'
      tags:
      - name:khrushchev-nikita-s
      - name:reynaud-paul
      - name:lippmann-walter
      src:
        c: 0b260181
        rows:
        - 'w.fursenko-khrushchevs-cold-war 392–93: all'
        - 'via w.fursenko-khrushchevs-cold-war 393 n.24: C-D'
- add:
    entry:
      id: cal.1961-09.berlin-and-vienna-2
      when: Sept.
      date: 1961-09
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Moscow, a few days after Reynaud. Khrushchev with Spaak, Belgium''s Foreign Minister, who in July had told the Poles
        a free West Berlin with guarantees of access might be agreed: Spaak for a free city, but with NATO''s routes kept.
        Khrushchev: no deadline for negotiations; the UN might move to West Berlin. Spaak to the NATO Council: he "preferred
        delayed negotiations to a hasty war."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 393–94. To check: Spaak, *Combats inachevés* (1969), II, 334–42 (cited by [[w.fursenko-khrushchevs-cold-war]],
        393 n.26). Check: the day. See [[cal.1961-09-16.berlin-and-vienna]]. Names: Khrushchev, Spaak.'
      tags:
      - name:khrushchev-nikita-s
      - name:spaak-paul-henri
      src:
        c: cffbc3c5
        rows:
        - 'w.fursenko-khrushchevs-cold-war 393–94: all'
        - 'via w.fursenko-khrushchevs-cold-war 393 n.26: A-B'
- cite:
    id: cal.1961-09-21.berlin-and-vienna
    item: '[[w.fursenko-khrushchevs-cold-war]], 394 (after a long lunch; nothing new; Gromyko: the Americans accept the measures
      of Aug. 13)'
    units: all
- add:
    entry:
      id: cal.1961-08-31.laos
      when: Aug. 31
      date: '1961-08-31'
      thread: laos
      also:
      - soviet-union
      c: The Kremlin adopts measures to restrain the Chinese and North Vietnamese in Laos and to bring the Pathet Lao and
        Souvanna Phouma's neutralists together. Moscow meets two thirds of the cost of the Pathet Lao's hidden army.
      n: '[[w.fursenko-khrushchevs-cold-war]], 395. To check: Tovmasyan to Moscow, Nov. 14, 1961, AVPRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        395 n.34). Names: Souvanna Phouma.'
      tags:
      - name:souvanna-phouma
      src:
        c: 2033ec4a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 395: all'
        - 'via w.fursenko-khrushchevs-cold-war 395 n.34: A'
- add:
    entry:
      id: cal.1961-09-22.laos
      when: Sept. 22–25
      date: '1961-09-22'
      thread: laos
      also:
      - soviet-union
      - vietnam
      - china
      c: 'Hanoi, a meeting the North Vietnamese call. The Soviets put the Chinese, the North Vietnamese and the Pathet Lao
        on notice: the secret policy to stop; plan a coalition with Souvanna Phouma, lower the forces they mean to keep, rework
        their requests. The Pathet Lao declare 8,100 men in Laos; their secret army 13,324 more. Once Moscow promises some
        aid, the Chinese side with the Soviets.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 395. To check: Tovmasyan to Moscow, Nov. 14, 1961, AVPRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        395 n.38); "Assistance requested by royal government and Pathet Lao" (cited 395 n.36). See [[cal.1961-08-31.laos]].
        Names: Souvanna Phouma.'
      tags:
      - name:souvanna-phouma
      - place:hanoi
      src:
        c: 626a062e
        rows:
        - 'w.fursenko-khrushchevs-cold-war 395: all'
        - 'via w.fursenko-khrushchevs-cold-war 395 n.38: A-B, D'
        - 'via w.fursenko-khrushchevs-cold-war 395 n.36: C'
- add:
    entry:
      id: cal.1961-09-04.cuba
      when: Sept. 4
      date: '1961-09-04'
      thread: cuba
      also:
      - soviet-union
      c: 'Castro to Khrushchev, the covert attacks increased: more military aid; Sergio del Valle, the army''s chief of staff,
        to Moscow to negotiate it. The list: eight divisions of surface-to-air missiles, 360 SA-2s, 412 tanks, 100 transports,
        282 Zenith cannon.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 396 and n.40. To check: Castro to Khrushchev, Sept. 4, 1961, APRF (cited by
        [[w.fursenko-khrushchevs-cold-war]], 396 n.39). Names: Castro, Khrushchev.'
      tags:
      - name:castro-fidel
      - name:khrushchev-nikita-s
      src:
        c: 151a7a52
        rows:
        - 'w.fursenko-khrushchevs-cold-war 396 and n.40: all'
        - 'via w.fursenko-khrushchevs-cold-war 396 n.39: A'
- add:
    entry:
      id: cal.1961-09-20.cuba
      when: Sept. 20
      date: '1961-09-20'
      thread: cuba
      also:
      - soviet-union
      c: Moscow. Soviet and Cuban negotiators agree on $148 million in military aid, 40 percent a gift, the rest a ten-year
        loan and barter. The Council of Ministers approves it a week later; the Presidium freezes it, to give the talks with
        Washington a chance.
      n: '[[w.fursenko-khrushchevs-cold-war]], 396. See [[cal.1961-09-04.cuba]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: b511dcec
        rows:
        - 'w.fursenko-khrushchevs-cold-war 396: all'
- add:
    entry:
      id: cal.1961-09.soviet-union
      when: Sept.
      date: 1961-09
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'The last week of the month. Khrushchev to Ulbricht: with the border to Berlin under control, "such steps which could
        exacerbate the situation, especially in Berlin, should be avoided."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 396. Check: the day. See [[cal.1961-08-24.berlin-and-vienna]]. Names: Khrushchev,
        Ulbricht.'
      tags:
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      src:
        c: a867e34c
        rows:
        - 'w.fursenko-khrushchevs-cold-war 396: all'
- add:
    entry:
      id: cal.1961-09-22.press-and-broadcasting
      when: Sept. 22
      date: '1961-09-22'
      thread: press-and-broadcasting
      also:
      - berlin-and-vienna
      c: 'The White House, Kennedy''s study, Marine One waiting. Elie Abel proposes a book on the first term; Kennedy: "Why
        would anyone write a book about an administration that has nothing to show for itself but a string of disasters?"
        On Berlin and the Bay of Pigs; "turn off that thing; I''m not leaving yet." By Abel''s account.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 396–97. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 58e0b0dd
        rows:
        - 'w.fursenko-khrushchevs-cold-war 396–97: all'
- cite:
    id: cal.1961-09.berlin-and-vienna
    item: '[[w.fursenko-khrushchevs-cold-war]], 397 (Sept. 24, Kharlamov to Salinger: "The storm in Berlin is over"; Kennedy:
      "He''s not going to recognize the Ulbricht regime")'
    units: A-B
- cite:
    id: cal.1961-09-25.testing
    item: '[[w.fursenko-khrushchevs-cold-war]], 397 ("We are committed to no rigid formula"; one division to Europe, not six)'
    units: A
- cite:
    id: cal.1961-09-29.soviet-union
    item: '[[w.fursenko-khrushchevs-cold-war]], 398 (a private letter; Kennan or Thompson as a channel; a quick summit in
      Moscow)'
    units: all
- src:
    id: cal.1961-09-29.soviet-union
    rows:
    - 'via w.fursenko-khrushchevs-cold-war 398 n.49: all'
- cite:
