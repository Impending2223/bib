    text: 'Check: Fursenko and Naftali (2006), from the stenogram, have Khrushchev set a new course at this meeting, not approve
      the paper as written: a peace treaty, the air routes cut off, Western planes to be brought down; "more than a 95% probability
      that there will be no war" (355–59, citing the stenogram and Protocol 331, May 26, 1961, nn.72–73).'
