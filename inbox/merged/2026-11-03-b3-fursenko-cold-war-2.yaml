    item: '[[w.fursenko-khrushchevs-cold-war]], 419–21 (after lunch, the Oval Room: Cuba likened to Hungary; "If I run for
      reelection and the Cuban issue remains as it is today . . . we will have to undertake something"; Adzhubei: "a sad and
      alarming statement")'
    units: A-B, D
