      when: Feb. 7–9
      date: '1962-02-07'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - defense
      c: The Soviets announce that for three hours Feb. 8, between 3,000 and 8,000 feet, the southern air corridor to Berlin
        is closed to all but Soviet traffic; never before. On Clay's advice Kennedy orders two unarmed military aircraft through
        it at 5,000–6,000 feet. Feb. 8, Soviet transports fly it; Feb. 9, the northern corridor reserved too.
      n: '[FRUS 1961–63, XIV, doc. 281](https://history.state.gov/historicaldocuments/frus1961-63v14/d281) (Kohler, Feb. 7).
        [[w.fursenko-khrushchevs-cold-war]], 421–22. To check: CIA, Current Intelligence Weekly Review, Feb. 16, 1962, FRUS
        1961–63, V, 369–70 (cited by [[w.fursenko-khrushchevs-cold-war]], 421 n.27). Names: Clay, Kennedy.'
      tags:
      - name:clay-lucius-d
      - name:kennedy-john-f
      src:
