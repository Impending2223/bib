      c: 'The General Assembly, in emergency session, 70–0, on Ghana''s motion: Hammarskjöld to take "vigorous action" under
        the Council''s resolutions; no state to send arms or men into the Congo outside the UN. The Soviet bloc, France and
        South Africa abstain. Zorin had charged him with colluding with the Americans.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 317. To check: [[w.kalb-congo-cables]], 103–4 (cited by [[w.fursenko-khrushchevs-cold-war]],
        317 nn.113, 116). See [[cal.1960-09-05.congo]]. Names: Hammarskjöld, Zorin.'
      tags:
