    item: '[[w.fursenko-khrushchevs-cold-war]], 398 (Kennedy''s reply; nothing comes of the exchange)'
    units: A
- add:
    entry:
      id: cal.1961-10-08.intelligence
      when: Oct. 8
      date: '1961-10-08'
      thread: intelligence
      also:
      - berlin-and-vienna
      - soviet-union
      c: 'Bolshakov of the GRU, from a source close to Rostow of State''s Policy Planning Staff, perhaps Rostow himself: Kennedy
        weighs a three-point plan for Berlin, an international city with free access guaranteed, Germany''s present borders
        confirmed, a demilitarized and perhaps nuclear-free zone in Central Europe. The delay blamed on the French.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 399. To check: Bolshakov, meeting with a source, Oct. 8, 1961, GRU (cited by
        [[w.fursenko-khrushchevs-cold-war]], 399 n.52). Names: Bolshakov, Rostow.'
      tags:
      - name:bolshakov-georgi
      - name:rostow-walt-w
      src:
        c: 42ff7fa1
        rows:
        - 'w.fursenko-khrushchevs-cold-war 399: all'
        - 'via w.fursenko-khrushchevs-cold-war 399 n.52: all'
- cite:
    id: cal.1961-10-17.berlin-and-vienna
    item: '[[w.fursenko-khrushchevs-cold-war]], 399–400 ("the Western powers were showing some understanding of the situation")'
    units: all
- add:
    entry:
      id: cal.1961-10.china
      when: Oct.
      date: 1961-10
      thread: china
      also:
      - soviet-union
      c: 'Moscow, the Twenty-Second Congress. Zhou Enlai, a few days after his report, leaves before the end, the first such
        walkout by the Chinese; on the day he goes, alone at the mausoleum, a wreath on Stalin''s sarcophagus: "To Josif Vissarionovich
        Stalin—the great Marxist-Leninist." The Laotian, Vietnamese and Chinese parties will not join Khrushchev against the
        Albanians.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 400. To check: [[w.slusser-berlin-crisis-of-1961]], 342 (cited by [[w.fursenko-khrushchevs-cold-war]],
        400 n.56). Check: the day. See [[cal.1961-10-17.berlin-and-vienna]]. Names: Zhou Enlai, Khrushchev.'
      tags:
      - name:zhou-enlai
      - name:khrushchev-nikita-s
      src:
        c: 2273b325
        rows:
        - 'w.fursenko-khrushchevs-cold-war 400: all'
- cite:
    id: cal.1961-10-22.berlin-and-vienna
    item: '[[w.fursenko-khrushchevs-cold-war]], 401 (7:15 p.m., the Lightners and their car; a Soviet officer at 10 p.m.:
      "a mistake and will be corrected")'
    units: A
- add:
    entry:
      id: cal.1961-10-23.berlin-and-vienna
      when: Oct. 23–24
      date: '1961-10-23'
      thread: berlin-and-vienna
      c: 'The East German news agency: civilians crossing the sector border must show identity cards, against four-power practice.
        Clay to Rusk: the GDR means to end Allied rights in East Berlin before any negotiation; no talks until the Russians
        "guarantee full maintenance of the present status quo."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 402. To check: Clay to Rusk, Oct. 24, 1961, FRUS 1961–63, XIV, 532–34 (cited
        by [[w.fursenko-khrushchevs-cold-war]], 402 n.61). Check: Fursenko and Naftali quote Clay''s cable as of Oct. 23 (402);
        the note dates it Oct. 24. See [[cal.1961-10-22.berlin-and-vienna]]. Names: Clay, Rusk.'
      tags:
      - name:clay-lucius-d
      - name:rusk-dean
      src:
        c: b64468d2
        rows:
        - 'w.fursenko-khrushchevs-cold-war 402: all'
        - 'via w.fursenko-khrushchevs-cold-war 402 n.61: B'
- add:
    entry:
      id: cal.1961-10-25.berlin-and-vienna
      when: Oct. 25–26
      date: '1961-10-25'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'The first armed probe: military police escort a car with American plates into East Berlin, M48 tanks behind at Checkpoint
        Charlie. Clay asks leave for a "raid in force into the Eastern sector which would tear down parts of the wall"; Rusk,
        Oct. 26: entry into East Berlin "not a vital interest which would warrant determined recourse to force." Gromyko and
        Malinovsky to Khrushchev, Oct. 25: ask Ulbricht to halt the police''s actions.'
      n: '[FRUS 1961–63, XIV, doc. 193](https://history.state.gov/historicaldocuments/frus1961-63v14/d193) (Rusk to Clay,
        Oct. 26). [[w.fursenko-khrushchevs-cold-war]], 402–3. See [[cal.1961-10-23.berlin-and-vienna]]. Names: Clay, Rusk,
        Gromyko, Malinovsky, Khrushchev, Ulbricht.'
      tags:
      - name:clay-lucius-d
      - name:rusk-dean
      - name:gromyko-andrei
      - name:malinovsky-rodion-yakovlevich
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      src:
        c: 15abe437
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d193: B'
        - 'w.fursenko-khrushchevs-cold-war 402–3: all'
        - 'via w.fursenko-khrushchevs-cold-war 403 n.65: B'
- add:
    entry:
      id: cal.1961-10-26.robert-kennedy
      when: Oct. 26
      date: '1961-10-26'
      thread: robert-kennedy
      also:
      - berlin-and-vienna
      - soviet-union
      c: '5:30 p.m. Robert Kennedy, for the President, with Bolshakov, by Bolshakov''s report: the Western position being
        worked out with the allies, four to six weeks more; "the Soviet and Western sides should avoid any actions in Germany
        or Berlin that could lead to sad incidents"; "If Khrushchev would give similar instructions to his forces, [President]
        Kennedy would do the same."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 403. To check: Bolshakov''s report, Oct. 26, 1961, GRU (cited by [[w.fursenko-khrushchevs-cold-war]],
        403 n.67); Robert Kennedy''s date diary, JFK Library (cited 403 n.66). See [[cal.1961-10-25.berlin-and-vienna]]. Names:
        Robert Kennedy, Bolshakov.'
      tags:
      - name:kennedy-robert-f
      - name:bolshakov-georgi
      - name:kennedy-john-f
      src:
        c: d042f72a
        rows:
        - 'w.fursenko-khrushchevs-cold-war 403: all'
        - 'via w.fursenko-khrushchevs-cold-war 403 n.67: all'
- cite:
    id: cal.1961-10-27.berlin-and-vienna
    item: '[[w.fursenko-khrushchevs-cold-war]], 403–4 (ten Soviet tanks, then thirty; their markings removed; Khrushchev withdraws
      his first, before 11:30 a.m. Moscow time Oct. 28: "I knew Kennedy was looking for a way to back down")'
    units: A, C
- add:
    entry:
      id: cal.1961-10-27.robert-kennedy
      when: Oct. 27
      date: '1961-10-27'
      thread: robert-kennedy
      also:
      - berlin-and-vienna
      - soviet-union
      c: '11:30 p.m., the tanks at Checkpoint Charlie. Robert Kennedy to Bolshakov: "The situation in Berlin has become more
        difficult"; Gromyko refused the ambassador''s declaration that day; a period of "relative moderation and calm over
        the course of the next 4–6 weeks." Bolshakov cables it to Moscow; next morning Khrushchev pulls back his tanks.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 404. Check: no trace of the cable in the Kremlin''s archives; Robert Kennedy''s
        date diary has no record of the meeting (404, 404 n.70). See [[cal.1961-10-27.berlin-and-vienna]]. Names: Robert Kennedy,
        Bolshakov, Gromyko.'
      tags:
      - name:kennedy-robert-f
      - name:bolshakov-georgi
      - name:gromyko-andrei
      src:
        c: 178dcc93
        rows:
