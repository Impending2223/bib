      when: Feb. 14–15
      date: '1962-02-14'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - defense
      c: The southern air corridor reserved again for limited hours. Ten Soviet fighters buzz the six American aircraft flying
        it at the times Moscow "reserved"; the first incidents.
      n: '[[w.fursenko-khrushchevs-cold-war]], 422. To check: Zakharov and Malinovsky to the Central Committee, Feb. 17, 1962,
        RGANI; CIA, Current Intelligence Weekly Review, Feb. 16, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]], 422 n.29).
        See [[cal.1962-02-07.berlin-and-vienna]].'
      src:
        c: f6b0a629
        rows:
        - 'w.fursenko-khrushchevs-cold-war 422: all'
        - 'via w.fursenko-khrushchevs-cold-war 422 n.29: all'
- add:
    entry:
      id: cal.1962-02-26.berlin-and-vienna
      when: Feb. 26
      date: '1962-02-26'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'The Kremlin. Khrushchev to Ulbricht, called in: "We must put pressure to get a peace treaty. But we must not put
        the question in these terms: life or death"; a blockade would ruin the GDR. Ulbricht: "how much longer will it be?"
        Khrushchev: "Adenauer has you by the short hairs"; "all we can expect from West Berlin we received on August 13";
        long-range missiles "next year we will have enough"; "Our tactic must be to press, then to wait."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 422–23. To check: Khrushchev and Ulbricht, Feb. 26, 1962, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        422 n.30). See [[cal.1962-01-08.soviet-union]]. Names: Khrushchev, Ulbricht, Adenauer.'
      tags:
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      src:
        c: 819e9939
        rows:
        - 'w.fursenko-khrushchevs-cold-war 422–23: all'
        - 'via w.fursenko-khrushchevs-cold-war 422 n.30: all'
