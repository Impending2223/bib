patch: oil
by: Claude (oil agent)
ops:
- add:
    entry:
      id: cal.1960-10-28.oil
      when: Oct. 28
      date: '1960-10-28'
      thread: oil
      also:
      - elections-1960
      c: 'Nixon at Centralia, Ill.: Kennedy challenged to say where he stands on the oil import program, its cut in residual fuel oil from abroad included, and on the 27½ percent depletion allowance, in New England as in the oil States. Nixon for both.'
      n: '[Statement by the Vice President on Oil Import Control Plan](https://www.presidency.ucsb.edu/documents/statement-the-vice-president-the-united-states-oil-import-control-plan-centralia-il). The program: Proclamation 3279 (Mar. 10, 1959), [24 Fed. Reg. 1781](https://www.govinfo.gov/app/details/FR-1959-03-12). [[w.shaffer-oil-import-program-of]]; [[w.bohi-limiting-oil-imports]]; [[w.vietor-energy-policy-in-america]]; [[w.yergin-prize]]. Names: Nixon, Kennedy.'
      tags:
      - name:nixon-richard-m
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-12-24.oil
      when: Dec. 24
      date: '1960-12-24'
      thread: oil
      c: 'Eisenhower, Proclamation 3386: from Jan. 1, the import ceiling for Districts I–IV, 9 percent of the Bureau of Mines'' estimate of demand, raised or cut by 9 percent of the last period''s underestimate or overestimate. Districts I–IV: all but California, Oregon, Washington, Nevada, Arizona, Alaska, Hawaii and Puerto Rico.'
      n: '[Proclamation 3386](https://www.presidency.ucsb.edu/documents/proclamation-3386-modifying-proclamation-3279-march-10-1959-adjusting-imports-petroleum), [25 Fed. Reg. 13945](https://www.govinfo.gov/app/details/FR-1960-12-30); [statement](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-issuing-proclamation-relating-petroleum-imports). See [[cal.1960-10-28.oil]]. Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1961-01-17.oil
      when: Jan. 17
      date: '1961-01-17'
      thread: oil
      c: 'Eisenhower, Proclamation 3389: from Apr. 1, East Coast (District I) residual fuel oil allocations open to sellers with deep-water terminals, by their terminal inputs; residual imports held to the 1957 level.'
      n: '[Proclamation 3389](https://www.presidency.ucsb.edu/documents/proclamation-3389-modifying-proclamation-no-3279-march-10-1959-adjusting-imports-petroleum), [26 Fed. Reg. 507](https://www.govinfo.gov/app/details/FR-1961-01-20); [statement](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-proclamation-modifying-petroleum-import-control) (Jan. 18). See [[cal.1960-10-28.oil]]. Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1961-09.oil
      when: Sept.
      date: 1961-09
      thread: oil
      c: 'Libya. First crude oil exports: Esso''s 108-mile, 30-inch line from the Zelten field to its terminal at Marsa el-Brega in operation. Oil first found June 1959. Brega inaugurated Oct. 25.'
      n: Bureau of Mines, *Minerals Yearbook 1963*, IV, 975, 981 ([archive.org](https://archive.org/details/pub_usgov-minerals-yearbook_1963_4)). [[w.yergin-prize]].
- add:
    entry:
      id: cal.1961-12-02.oil
      when: Dec. 2
      date: '1961-12-02'
      thread: oil
      c: Kennedy announces a study of petroleum requirements and supplies against security objectives, the import program included, under the Office of Emergency Planning, by mid-1962. Interior's proposals to amend Proclamation 3279 under consideration; allocations meanwhile as before.
      n: 'FRUS 1961–63, IX, doc. [344](https://history.state.gov/historicaldocuments/frus1961-63v09/d344) (White House press release). See [[cal.1960-10-28.oil]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-09-04.oil
      when: Sept. 4
      date: '1962-09-04'
      thread: oil
      c: 'McDermott, Office of Emergency Planning, sends Kennedy the Petroleum Study Committee''s report, signed for State, Treasury, Defense, Justice, Interior, Commerce and Labor. Interior''s dissent: the costs reckoned, not the benefits; no new coordination needed.'
      n: 'FRUS 1961–63, IX, doc. [357](https://history.state.gov/historicaldocuments/frus1961-63v09/d357). See [[cal.1961-12-02.oil]]. Names: McDermott, Kennedy.'
      tags:
      - name:mcdermott-edward-a
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-11-19.oil
      when: Nov. 19
      date: '1962-11-19'
      thread: oil
      c: 'Kennedy to Udall: changes to Proclamation 3279 by Nov. 23. Imports into Districts I–IV, overland imports included, held to their 1961 ratio to domestic production of liquid hydrocarbons; historical allocations phased out; a sliding scale for refiners, with provision for small business. Talks with the Interstate Oil Compact Commission and with Canada.'
      n: 'FRUS 1961–63, IX, doc. [362](https://history.state.gov/historicaldocuments/frus1961-63v09/d362). See [[cal.1962-09-04.oil]]. Names: Kennedy, Udall.'
      tags:
      - name:kennedy-john-f
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1962-11-30.oil
      when: Nov. 30
      date: '1962-11-30'
      thread: oil
      c: 'Kennedy, Proclamation 3509: from Jan. 1, 1963, the ceiling for Districts I–IV, 12.2 percent of the crude oil and natural gas liquids produced there in a past six months, less overland imports. Allocations to refiners on a graduated scale. Under section 232 of the Trade Expansion Act.'
      n: '[Proclamation 3509](https://www.presidency.ucsb.edu/documents/proclamation-3509-modifying-adjusting-imports-petroleum-and-petroleum-products), [27 Fed. Reg. 11985](https://www.govinfo.gov/app/details/FR-1962-12-05). See [[cal.1962-11-19.oil]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-04-19.oil
      when: Apr. 19
      date: '1963-04-19'
      thread: oil
      c: 'Kennedy, Proclamation 3531: the import program''s Appeals Board, one member each from Interior, Defense and Commerce.'
      n: '[Proclamation 3531](https://www.presidency.ucsb.edu/documents/proclamation-3531-modifying-proclamation-no-3279-relating-the-adjustment-imports-petroleum), [28 Fed. Reg. 4077](https://www.govinfo.gov/app/details/FR-1963-04-25). See [[cal.1962-11-30.oil]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-06-10.oil
      when: June 10
      date: '1963-06-10'
      thread: oil
      c: 'Kennedy, Proclamation 3541: from July 1, the 12.2 percent taken of the production the Secretary of the Interior estimates for the allocation period itself.'
      n: '[Proclamation 3541](https://www.presidency.ucsb.edu/documents/proclamation-3541-modifying-adjusting-imports-petroleum-and-petroleum-products), [28 Fed. Reg. 5931](https://www.govinfo.gov/app/details/FR-1963-06-13). See [[cal.1962-11-30.oil]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1965-12-10.oil
      when: Dec. 10
      date: '1965-12-10'
      thread: oil
      c: 'Johnson, Proclamation 3693, from Jan. 1: foreign oil into foreign-trade zones only under license; petrochemical plants admitted to allocations; Puerto Rico allocations for plants adding employment, its shipments to the mainland above 1965''s counted under the ceiling.'
      n: '[Proclamation 3693](https://www.presidency.ucsb.edu/documents/proclamation-3693-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [30 Fed. Reg. 15459](https://www.govinfo.gov/app/details/FR-1965-12-16). See [[cal.1963-06-10.oil]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-04-10.oil
      when: Apr. 10
      date: '1967-04-10'
      thread: oil
      c: 'Johnson, Proclamation 3779: the Secretary of the Interior may set a ceiling and allocations for asphalt apart, or admit it without license. No White House release.'
      n: '[Proclamation 3779](https://www.presidency.ucsb.edu/documents/proclamation-3779-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [32 Fed. Reg. 5919](https://www.govinfo.gov/app/details/FR-1967-04-13). See [[cal.1965-12-10.oil]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-06-06.oil
      when: June 6
      date: '1967-06-06'
      thread: oil
      also:
      - middle-east-six-day-war
      c: 'Arab oil embargo. Iraq stops oil to the United States and Britain for "military assistance to the enemy," on Cairo''s charge that their aircraft joined Israel''s attack. Kuwait moves to stop shipments to both. The Arab oil ministers at Baghdad, June 4–5: Arab oil denied to any country taking part in aggression on an Arab state, the Gulf of Aqaba named.'
      n: 'FRUS 1964–68, XXXIV, docs. [232](https://history.state.gov/historicaldocuments/frus1964-68v34/d232) (Baghdad, June 6: the resolutions), [233](https://history.state.gov/historicaldocuments/frus1964-68v34/d233) (editorial note). [[w.yergin-prize]]; [[w.vietor-energy-policy-in-america]]; [[w.garavini-rise-and-fall-of]].'
- add:
    entry:
      id: cal.1967-06-08.oil
      when: June 8
      date: '1967-06-08'
      thread: oil
      c: 'Rusk to Udall: Algeria, Kuwait and Bahrain bar oil exports to the United States and Britain; Iraq has ordered the Iraq Petroleum Company to stop; Tapline and the Suez Canal closed; Libya has ordered the companies to cease. Emergency procedures asked. Jersey Standard to Assistant Secretary Moore the same day: the Foreign Petroleum Supply Committee the companies'' only cover under the antitrust laws.'
      n: 'FRUS 1964–68, XXXIV, docs. [235](https://history.state.gov/historicaldocuments/frus1964-68v34/d235) (Rusk), [234](https://history.state.gov/historicaldocuments/frus1964-68v34/d234) (Finlay). See [[cal.1967-06-06.oil]]. Names: Rusk, Udall, Moore.'
      tags:
      - name:rusk-dean
      - name:udall-stewart-l
      - name:moore-j-cordell
- add:
    entry:
      id: cal.1967-06-10.oil
      when: June 10
      date: '1967-06-10'
      thread: oil
      c: 'Interior, Assistant Secretary J. Cordell Moore: "a petroleum emergency exists which threatens the broad security interests of the United States." State, Defense and the Office of Emergency Planning concur.'
      n: 'FRUS 1964–68, XXXIV, doc. [235](https://history.state.gov/historicaldocuments/frus1964-68v34/d235), n. 3 (circular telegram 210177, June 11). See [[cal.1967-06-06.oil]]. Names: Moore.'
      tags:
      - name:moore-j-cordell
- add:
    entry:
      id: cal.1967-06-27.oil
      when: June 27
      date: '1967-06-27'
      thread: oil
      c: 'OECD Council: its Special Committee for Oil to convene an international industry advisory body and report any shortfall of supply against consumption. France and West Germany abstain.'
      n: 'FRUS 1964–68, XXXIV, docs. [251](https://history.state.gov/historicaldocuments/frus1964-68v34/d251) (the resolution), [241](https://history.state.gov/historicaldocuments/frus1964-68v34/d241) (the Oil Committee, June 12), [249](https://history.state.gov/historicaldocuments/frus1964-68v34/d249) (State to Bonn, June 24: the Foreign Petroleum Supply Committee''s plan of action awaiting Interior, the Office of Emergency Planning and the Attorney General). See [[cal.1967-06-06.oil]].'
- add:
    entry:
      id: cal.1967-07-17.oil
      when: July 17
      date: '1967-07-17'
      thread: oil
      c: 'Johnson, Proclamation 3794: residual fuel oil ceilings left to the Secretary of the Interior; low-sulfur residual open to new importers with terminal agreements; added crude allocations to refiners making low-sulfur residual, for the air pollution rules. No White House release.'
      n: '[Proclamation 3794](https://www.presidency.ucsb.edu/documents/proclamation-3794-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [32 Fed. Reg. 10547](https://www.govinfo.gov/app/details/FR-1967-07-19). See [[cal.1967-04-10.oil]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-07-24.oil
      when: July 24
      date: '1967-07-24'
      thread: oil
      c: Iraq resumes oil shipments to all countries but the United States, Britain and West Germany.
      n: FRUS 1964–68, XXXIV, doc. [263](https://history.state.gov/historicaldocuments/frus1964-68v34/d263) (editorial note). See [[cal.1967-06-06.oil]].
- add:
    entry:
      id: cal.1967-09-02.oil
      when: Sept. 2
      date: '1967-09-02'
      thread: oil
      c: 'Faisal, back from Khartoum: Saudi Arabia to resume oil shipments to all countries "without exception." Libya''s embargo unofficially lifted the same day.'
      n: 'FRUS 1964–68, XXXIV, doc. [263](https://history.state.gov/historicaldocuments/frus1964-68v34/d263) (editorial note; Jidda telegram 874). See [[cal.1967-06-06.oil]]; [[cal.1967-09-01.middle-east]]. Names: Faisal.'
      tags:
      - name:faisal-ibn-abd-al-aziz-al-saud
- add:
    entry:
      id: cal.1967-11-09.oil
      when: Nov. 9
      date: '1967-11-09'
      thread: oil
      c: 'Johnson, Proclamation 3820: the Secretary of the Interior may allocate up to 15,000 barrels a day of finished products into Districts I–IV to promote employment in the Virgin Islands, where petrochemical plants are proposed. No White House release.'
      n: '[Proclamation 3820](https://www.presidency.ucsb.edu/documents/proclamation-3820-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [32 Fed. Reg. 15701](https://www.govinfo.gov/app/details/FR-1967-11-15). See [[cal.1967-07-17.oil]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-01-29.oil
      when: Jan. 29
      date: '1968-01-29'
      thread: oil
      c: 'Johnson, Proclamation 3823: 1967''s import licenses left unused in the Middle East crisis good in 1968 (crude, through 1969); allocations for refiners exporting products and petrochemicals; District V under Puerto Rico''s rule on shipments; oil from tar sands counted as crude. No White House release.'
      n: '[Proclamation 3823](https://www.presidency.ucsb.edu/documents/proclamation-3823-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [33 Fed. Reg. 1171](https://www.govinfo.gov/app/details/FR-1968-01-30). See [[cal.1967-11-09.oil]]; [[cal.1967-06-06.oil]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
