- add:
    entry:
      id: cal.1961-09-17.china-leadership
      when: Sept. 17
      date: '1961-09-17'
      thread: china-leadership
      also:
      - farm
      c: 'Zhou Enlai leaves Lushan; on the way inspects the Lushan branch of the Jiangxi Communist Labor University, telling teachers and students to study and labor well, and the Yujing brigade of the Wuli commune in Xingzi county, visiting the household of the member Zhou Shizhong: he asks about their living and tells him to speak truth, "don''t be afraid, if you don''t say I know, it is a hard time"; to the members: with hard work and self-reliance things will improve, work for the grain, raise pigs and chickens, rely on the collective. That day to Nanchang.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 432 (Sept. 17, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-18.china-leadership
      when: Sept. 18
      date: '1961-09-18'
      thread: china-leadership
      also:
      - farm
      c: 'At Nanchang Zhou Enlai, with Governor Shao Shiping, inspects city works and tells the provincial committee to lift the economy, farming above all, to save, and care for the masses'' living. To the Communist Labor University: serve the villages and the poor and lower-middle peasants. At the Aug. 1 Uprising museum: stress Mao Zedong Thought and Jinggangshan, and the part of Zhu De, He Long, Ye Ting and Liu Bocheng. At dinner he asks Jiangxi for 300 million jin more grain for export, harder than it sounds but possible, as its rations are higher and it has reserves.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 432 (Sept. 18, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
