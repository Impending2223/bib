- add:
    entry:
      id: cal.1960-03-15.china-leadership-4
      when: Mar. 15
      date: '1960-03-15'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai''s third talk with Koirala. Four kinds of area: where the lines agree on the maps (south to Nepal, north to China; a joint commission to survey); where the lines leave an unclaimed gap or an overlap without dispute (the commission); where the maps differ and are disputed (the commission); Mount Everest, China''s by evidence but of national feeling to both, for the two premiers to settle directly. Aid: China will give a sum, with no privileges, designs and equipment at the cheapest, few technicians, trainees welcome; no cash, goods for Nepal to sell for funds.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 294 (Mar. 15, 1960). Made public: 1997. Names: Zhou Enlai, Koirala.'
      tags:
      - polity:prc
      - polity:nepal
      - name:zhou-enlai
      - name:koirala-bisweswar-prasad
      - vis:only:prc+nepal
