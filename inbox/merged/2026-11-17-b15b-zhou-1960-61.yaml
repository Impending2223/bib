      - china
      c: At the banquet seeing off the Japanese table tennis team Zhou Enlai says the match is for peace, friendship and knowledge more than a title; the peoples of China and Japan want peace and see how much peaceful coexistence among states of different systems matters; he hopes players and peoples live in peace, visit, learn and exchange experience, toward normalizing relations.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 406 (Apr. 20, 1961). Names: Zhou Enlai.'
