      c: 'Zhou Enlai takes Edgar Snow to the Miyun reservoir. On the way he reviews relations with the United States over the eleven years, before the Warsaw talks'' 100th meeting on Sept. 6: since the Korean war''s start in June 1950 America took a policy of aggression, China wants talks on the disputes; a principle agreement first, with two points: all disputes, Taiwan''s included, settled by peaceful consultation without force or its threat; the United States to withdraw its forces from Taiwan and the Strait, when and how for the next step.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 345 (Aug. 30, 1960). Made public: 1997. Names: Zhou Enlai.'
