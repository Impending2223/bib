      when: Aug. 13
      date: '1961-08-13'
      thread: china-leadership
      also:
      - china
      c: 'Late at night Zhou Enlai receives Cheng Siyuan, on Li Zongren''s return and related matters: America''s difficulties at home and abroad; Cheng to tell Li that China does not expect him back at once; if he wishes to send someone first to look, that is agreed; he hopes Li stays detached, holds to national integrity and need not hurry for near gain, being careful of his later years, when the people will forgive him. He asks of Kuomintang military and political men in Hong Kong and Hong Kong''s economy; Japanese militarism''s revival a hidden danger, Japan''s course worth notice.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 427 (Aug. 13, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:roc
      - name:zhou-enlai
      - vis:only:prc
