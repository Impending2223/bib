      date: '1960-04-28'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai returns to Katmandu; broadcasts on Nepal radio that Sino-Nepalese friendship has entered a new stage.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 314 (Apr. 28, 1960). Names: Zhou Enlai.'
