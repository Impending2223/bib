      date: '1961-05-04'
      thread: china-leadership
      also:
      - laos
      - china
      c: 'Zhou Enlai approves the Chinese government''s statement on a cease-fire in Laos and the convening of the widened Geneva conference: China supports the conference to protect Laos''s peace, neutrality and independence and to let Laos solve its own problems; it understands Sihanouk''s feelings at his Vientiane press conference of May 1 and hopes he continues to work for peaceful settlement.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 409 (May 4, 1961). Names: Zhou Enlai, Sihanouk.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:norodom-sihanouk
