      c: 'Zhou Enlai drafts the Center''s circular forwarding the Central Foreign Affairs Group''s report by Liao Chengzhi on the fight against the United States, and adds under "Slogans": firm support for the Japanese people''s democratic struggle against Kishi''s bloody rule; firm opposition to American wrecking of the Geneva Agreements and armed intrusion into Vietnam; firm support for the South Vietnamese people''s patriotic and democratic struggle against America and Ngô Đình Diệm; firm support for the Vietnamese people''s just struggle for peaceful unification.'
