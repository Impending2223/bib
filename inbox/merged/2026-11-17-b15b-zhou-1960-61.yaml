      date: '1960-10-27'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai at the Politburo meeting Liu Shaoqi chairs, which hears Deng Xiaoping's report on the Chinese delegation at the 26-party drafting committee, approves the delegation's work, and decides that Liu Shaoqi lead the delegation to the Moscow conference of Communist and workers' parties in November.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 362 (Oct. 27, 1960). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
