      c: 'Zhou Enlai receives the Congo''s Ambassador (Diaka Beinadun in the chronology): the suspension of diplomatic relations and withdrawal of the missions rests on two things, Gizenga''s declaration, as Deputy Premier, that the legitimate government has ended, on whose dealings with China the relations rested, and the Leopoldville government''s recognition of the Chiang Kai-shek group and relations with it; the withdrawal was conscious, active and friendly, so though the relations are gone the friendship is not.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 434 (Sept. 21, 1961). Made public: 1997. Names: Zhou Enlai.'
