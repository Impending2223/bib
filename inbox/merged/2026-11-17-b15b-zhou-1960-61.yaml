      when: Apr. 25
      date: '1960-04-25'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: The Sino-Indian prime ministers' joint communiqué is issued. After seven days of talks no agreement on the boundary; officials of both sides to meet and examine, check and study the factual materials and report to both governments; both to avoid friction in the border areas meanwhile.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 313 (Apr. 25, 1960). Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - name:zhou-enlai
