      c: Zhou Enlai at Mao's, with Liu Shaoqi, Zhu De, Chen Yun, Lin Biao, Li Fuchun, Chen Boda and Wu Lengxi, on the international situation.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 358 (Oct. 14, 1960). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Chen Yun, Lin Biao, Li Fuchun, Chen Boda.'
