      c: 'Zhou Enlai approves two requests of the group directing returned students: to bring students home once a year, not every two years, for political study; and to turn the Peking Foreign Languages Institute''s preparatory department for study in the Soviet Union into a students'' department handling both those preparing to go and those back.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 362 (Oct. 25, 1960). Made public: 1997. Names: Zhou Enlai.'
