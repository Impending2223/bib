      thread: laos
      also:
      - china-leadership
      c: 'Souphanouvong, in a statement: Zhou Enlai has a sincere understanding of Laos''s problems.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 421 (July 5, 1961). See [[cal.1961-07-03.china-leadership-2]]. Names: Souphanouvong, Zhou Enlai.'
