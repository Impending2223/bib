      c: 'Zhou Enlai, settling the directive''s text, adds after "persuasion" in the sentence on keeping 360 jin of unhusked grain per person a year south of the Huai to the Pearl River: "and to do well the supply of goods in areas with much commodity grain"; and, at the end, that the urban ration standard is also to be lowered, methods to follow.'
