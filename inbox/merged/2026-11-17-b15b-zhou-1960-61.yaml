      c: 'At the Central-South and North China groups Zhou Enlai on investigation, facts and democratic centralism: since entering the cities, and in recent years, too little investigation, too little truth, so the "five winds" were not at once corrected. Mao''s essay on investigation is a view of the world and a method; good and bad to be judged from what exists, not from subjective fancy; dare to hear other views and talk with those who hold them; compare, synthesize, analyze; the fault now is too much command and too little mass line.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 398 (Mar. 19, 1961). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
