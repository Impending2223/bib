      when: Oct. 3
      date: '1960-10-03'
      thread: china-leadership
      also:
      - africa-algeria-morocco
      - china
      c: 'Zhou Enlai''s second talk with Ferhat Abbas. Diplomatic struggle is part of political struggle and serves armed struggle, the foundation; oppressed peoples must never lay down arms. Appeal to the United Nations is right but beware its meddling. Three points for victory: a firm united leadership (the National Liberation Front keeps differences but acts as one); the broadest united front; stronger armed forces. Overcoming difficulty: rely on the people, foreign aid secondary; grow food on the spot, dispersed; arms mainly from the enemy; long war, and no bringing in of Americans.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 354 (Oct. 3, 1960). Made public: 1997. Names: Zhou Enlai, Ferhat Abbas.'
      tags:
      - polity:prc
      - polity:algeria
