      - name:abbas-ferhat
      - vis:only:prc+algeria
- add:
    entry:
      id: cal.1960-10-05.china-leadership-2
      when: Oct. 5
      date: '1960-10-05'
      thread: china-leadership
      also:
      - korea
      - foreign-aid
      c: 'Zhou Enlai receives Yi Chu-yŏn, Vice-Premier of the DPRK Cabinet. The year''s worst disaster is in Albania; China''s principle is to help stricken brother countries first, and revolutionary ones (Cuba, Guinea, Algeria); rice also for rubber; so China will owe the Soviet Union and Eastern Europe this year, and the Soviet experts'' withdrawal makes new difficulty. Aid: 100,000 spindles of spinning equipment agreed; build first the factories with sure raw materials and quick projects, not all in big cities. The credit of 420 million rubles to be used over 1961–64; repayment when able, or put off ten or twenty years.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 355 (Oct. 5, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:dprk
      - name:zhou-enlai
      - vis:only:prc+dprk
