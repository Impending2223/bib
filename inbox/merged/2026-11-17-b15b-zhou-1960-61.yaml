      date: '1960-04-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at Pokhara, talks with Koirala. On Everest China has never made a territorial claim. Koirala: the north slope to China, the south slope to Nepal, the line on the summit; he can settle on that but needs time to educate his people. Zhou accepts it and agrees to wait.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 314 (Apr. 27, 1960). Made public: 1997. Names: Zhou Enlai, Koirala.'
