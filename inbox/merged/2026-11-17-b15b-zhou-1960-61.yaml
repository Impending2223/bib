      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai revises the Center''s instruction forwarding the State Economic Commission''s Northeast group report on Jinzhou''s use of state-allotted boilers, correcting the disguised "communist wind" of the small public taking from the large: the Center has ordered again and again that no department or place use state-allotted materials; Jinzhou''s leaders, heedless of the allotment plan and contracts, kept at home most of 68 boilers allotted to 48 units across the country. He adds: this too is a typical form of the small public taking from the large, a disguised "communist wind"; the boilers taken without leave to be given up.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 378 (Dec. 11, 1960). Made public: 1997. Names: Zhou Enlai.'
