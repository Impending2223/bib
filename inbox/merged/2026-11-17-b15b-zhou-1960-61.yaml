      - laos
      c: 'Zhou Enlai to Sihanouk, by letter: some states have obstructed the widened Geneva conference and their plot must not succeed; he hopes Sihanouk reconsiders not attending. On May 8 Sihanouk thanks him and explains his attitude and why he will not attend now; on the 12th he cables that he will lead the Cambodian delegation.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 409 (May 6, 1961). Made public: 1997. Names: Zhou Enlai, Sihanouk.'
