- add:
    entry:
      id: cal.1960-02-23.china-leadership
      when: Feb. 23
      date: '1960-02-23'
      thread: china-leadership
      c: 'Zhou Enlai at the textbook reading group: five guidelines run through the transition from capitalism to communism: the general line, walking on two legs, the five great revolutions, the four modernizations, abolition of the three differences. Two basic contradictions (productive forces and relations, superstructure and base) to be solved by continuing revolution in ownership, human relations and distribution. The revolutionary transition is best in two stages, the present the first; "continuous revolution" and "stages of revolutionary development" both.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 288 (Feb. 23, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-02-25.china-leadership
      when: Feb. 25
      date: '1960-02-25'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai at the reading group, second statement: socialist revolution is not complete once the system is set up, and political and ideological revolution must go on. The textbook blurs dictatorship into education and mixes the contradictions with the enemy and among the people; it ignores class analysis, and its claim that the middle peasant is the central figure in the village is against the class line. Mao Zedong Thought as the era''s thought; *On Contradiction* and *On Practice* its philosophical base; the people''s communes of world significance.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 288–89 (Feb. 25, 1960). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
