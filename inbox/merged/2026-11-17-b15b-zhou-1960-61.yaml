      c: 'Zhou Enlai, on the joint report of the Planning Commission, the First Machine Ministry and the Foreign Trade Ministry on replacing tropical electric machinery for foreign aid with ordinary home machines, writes to Li Fuchun: the ministries to send a team to the works to test the equipment and accept it before shipping, so no accident abroad does harm.'
