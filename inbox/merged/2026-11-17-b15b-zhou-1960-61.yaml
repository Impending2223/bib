      - china
      c: 'Zhou Enlai that evening receives the Burmese delegation to the sixth session of the Sino-Burmese boundary joint commission: 1961 a year of Sino-Burmese friendship growing, the two countries visiting as kin, and later generations too becoming related.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 408 (May 2, 1961). Names: Zhou Enlai.'
