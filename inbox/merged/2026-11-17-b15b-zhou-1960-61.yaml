      c: 'Zhou Enlai''s talks with the Algerian Provisional Government''s delegation. On raising funds: China''s experience is to rely on the people''s two hands; in twenty-two years of civil and anti-Japanese war, a hundred people in controlled areas could keep two out of production; the armed forces to farm part of their food. Mao''s advice a few days before, self-reliance first and foreign help second, is the main lesson: the fish cannot leave the water. A joint communiqué of the People''s Republic and the Provisional Government is issued the same day.'
