      - china
      c: 'At the DPRK Embassy chargé''s banquet Zhou Enlai speaks on "No force can stop the Korean people''s peaceful unification of the fatherland": the treaty puts into law the fighting friendship of the two peoples joined in blood, and will play a very important part in the full growth of their friendship, the common security of the two countries and the defense of Asian and world peace.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 424 (July 12, 1961). Names: Zhou Enlai.'
      tags:
