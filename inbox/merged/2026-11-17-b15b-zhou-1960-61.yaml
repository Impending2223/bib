      c: 'Zhou Enlai presides at the State Council''s 101st plenary meeting and reports that the visits to Burma, Cambodia, Vietnam and Nepal and to India were successes: India said China would not negotiate and had territorial claims; China went, made none, and took away that capital; Nehru''s part is now seen by the Indian people; China''s policy toward Asia, principled, patient, friendly, to win him and criticize him.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 322 (May 26, 1960). Made public: 1997. Names: Zhou Enlai.'
