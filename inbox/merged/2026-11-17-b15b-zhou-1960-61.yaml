      date: '1961-01-02'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, Jan. 2–9, leads a friendly delegation of over 400 to Burma (government, military, culture and arts, boundary commission, Yunnan, Buddhist, film, press and sports delegations), the largest foreign friendship delegation since 1949. On Jan. 2 at Rangoon he calls on President Win Maung: the boundary settled so smoothly is the first with a neighbor and will be a model.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 383 (Jan. 2, 1961). Names: Zhou Enlai, U Nu, Ne Win.'
