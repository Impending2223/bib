      c: Zhou Enlai's first talk with Ferhat Abbas. The people's strength is endless; before it American imperialism and de Gaulle alike must fail. Leaders to be united, as the National Liberation Front is, the stronger for it; the people must keep arms, for imperialism and reaction oppress by arms and the people must meet armed force with arms.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 353 (Oct. 1, 1960). Made public: 1997. Names: Zhou Enlai, Ferhat Abbas.'
