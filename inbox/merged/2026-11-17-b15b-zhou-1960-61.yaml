      when: Apr. 19
      date: '1960-04-19'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai reaches Delhi; Nehru receives him at the airport. His statement: both countries need peace and friends; all questions can be settled under the five principles by friendly consultation; he comes in sincerity to solve problems.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 306 (Apr. 19, 1960). Names: Zhou Enlai, Nehru.'
