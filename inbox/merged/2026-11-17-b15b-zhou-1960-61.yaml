      c: 'Zhou Enlai, in a talk with Kofi Badu, of Ghana''s *Times*, and other writers on world affairs, rebuts slanders on China: China stands for peaceful coexistence, builds in earnest and does not need war, and its system does not permit pushing revolution by war; revolution cannot be exported, each people choosing its own system; China opposes imperialist aggression and will strike back if attacked.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 366 (Nov. 3, 1960). Made public: 1997. Names: Zhou Enlai. Check: the correspondent''s name, from the chronology''s transliteration.'
