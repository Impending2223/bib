      when: Apr. 20
      date: '1961-04-20'
      thread: china-leadership
      also:
      - soviet-union
      - foreign-aid
      c: 'Zhou Enlai with Deng Xiaoping talks with Vice-Chairman Kellezi of Albania''s Council of Ministers on Sino-Albanian relations, economic aid and the Soviet–Albanian difference. Four lessons from the Chinese Party''s long struggle: let the other side provoke, then strike back; hold fast to the banner of unity; fight tit for tat; leave room, not saying everything at once so that one cannot turn back.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 406 (Apr. 20, 1961). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
