      when: Apr. 18
      date: '1960-04-18'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: 'Zhou Enlai receives U Ba Swe, chairman of Burma''s Anti-Fascist People''s Freedom League, who knows of the Burma Socialist Party''s telegram congratulating the Indian Socialist Party on its "Asian–Tibet conference". Zhou: the five principles and non-interference must be kept; differences of political thought are natural; the Indian Socialist Party has a foul name among the Indian people; U Ba Swe and U Kyaw Nyein were friends of China and China wants that friendship kept.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 306 (Apr. 18, 1960). Made public: 1997. Names: Zhou Enlai, Ba Swe.'
