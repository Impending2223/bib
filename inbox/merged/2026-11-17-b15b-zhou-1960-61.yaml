      c: 'Zhou Enlai drafts the Center''s comment forwarding the Shanghai Party committee''s foreign affairs group''s report of Mar. 24 on two accidents in which brother countries'' exhibits were badly damaged in transit across China: very serious political accidents; the units concerned careless of foreign matters, without control, inspection or duty system; every unit with foreign relations to draw the lesson, neither humble nor proud.'
