      date: '1960-05-24'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives Zhang Zhizhong and other democratic figures to let Chiang Kai-shek know the Communist policy on Taiwan, and asks Zhang to write to Chiang, the letter to reach Chiang and his son in hand. Taiwan better in the Chiangs' hands than America's; it must be united with China. If it returns, military and political power and appointments left to Chiang, Chen Cheng and Chiang Ching-kuo used as he wishes; any shortfall paid by the Center; social reform deferred until conditions ripen and Chiang consents; neither side to send agents or sap the other's unity.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 321 (May 24, 1960). Made public: 1997. Names: Zhou Enlai, Chiang Kai-shek.'
