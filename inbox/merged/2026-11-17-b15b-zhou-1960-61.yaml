- add:
    entry:
      id: cal.1960-08-14.china-leadership
      when: Aug. 14
      date: '1960-08-14'
      thread: china-leadership
      also:
      - soviet-union
      - china
      c: 'At the Fourth National Foreign Affairs Conference Zhou Enlai: quarrel in the socialist camp a new problem the enemy uses; look ahead ten years. Strategy: unite the camp, win the national movements, break the war-makers. On the Sino-Soviet dispute think of the worst and work for the best: five possibilities (propaganda blockade, split, subversion, threats, imperialism using it to start war). The other party basically anti-imperialist and socialist, its errors of principle but partial.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 340 (Aug. 14, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - vis:only:prc
