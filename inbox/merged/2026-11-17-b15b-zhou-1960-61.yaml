      c: Zhou Enlai receives the Mali government's economic delegation, praises the conference of non-aligned heads and thanks Mali's President for supporting China there. The declaration asks China's rightful seat at the United Nations, but the United States would have New Zealand propose that restoring it be an "important question," in substance a debate on whether the new China exists, which the United Nations has no right to hold; it interferes in internal affairs; China's case is not that of Germany, Korea and Vietnam and cannot be made "two Chinas." He explains why China cannot raise its free-exchange aid to Mali.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 433 (Sept. 20, 1961). Made public: 1997. Names: Zhou Enlai.'
