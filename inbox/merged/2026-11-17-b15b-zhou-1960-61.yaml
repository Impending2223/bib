      c: 'Zhou Enlai telegraphs the Center and Mao: since the Sino-Indian communiqué did not mention stopping patrols and Indian troops have begun moving in the west, the Tibet and southern Sinkiang military regions should seize the time and weather to take commanding ground within a few kilometers of China''s frontier line and set up posts first, patrols still stopped; if Indian troops enter, China will urge them out and avoid armed clash. Mao approves May 6, "do so"; Deng gives Luo Ruiqing the orders in person.'
