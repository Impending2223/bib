      date: '1961-07-07'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai on the draft Center and State Council notice on placing the 1961 middle and primary school graduates: he proposes large changes; the comparison with 1957 (2.6 million more not going on) is not apt since the village–town proportion then was different; add that this year''s town graduates not going on, being young with few openings, are a point of work.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 422 (July 7, 1961). Made public: 1997. Names: Zhou Enlai.'
