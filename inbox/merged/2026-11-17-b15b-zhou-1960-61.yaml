      c: 'At the Vietnamese national day reception given by Ambassador Trần Tử Bình, Zhou Enlai: China has always cared for peace in Indochina and wants that region, next to China, to be a zone of peace; it keeps the Geneva Agreements strictly, backs Vietnam''s peaceful unification and the Cambodian government''s peaceful neutrality, and wants friendly relations with a peaceful and neutral Laos; it hopes to see zones of peace grow and the five principles show themselves in international relations.'
