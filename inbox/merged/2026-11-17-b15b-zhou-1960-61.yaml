      c: 'Zhou Enlai leads the Chinese Party delegation (He Wei, Fang Yi, Wang Guangwei, Zhang Yan, Luo Qingchang) in a first talk with the Lao Động party''s (Hồ Chí Minh, Lê Duẩn, Phạm Văn Đồng, Trường Chinh, Hoàng Văn Hoan). Lê Duẩn describes the preparation of the party''s conference. Zhou on his tour: the countries between the two camps are of three kinds (bad to good, peace and neutrality, good to bad); Nehru uses the boundary to strike progressive forces and control the Congress party; China will support real people''s struggles, chiefly relying on each people''s own strength.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 317 (May 11, 1960). Made public: 1997. Names: Zhou Enlai, Hồ Chí Minh, Lê Duẩn, Phạm Văn Đồng, Trường Chinh.'
