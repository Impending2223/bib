      c: 'Zhou Enlai with Chen Yi receives Cambodia''s Ambassador, Lan Neth, and three Cambodian princes (Yuvaneath, Naradipo, Kmanurak). The Ambassador says Sihanouk means to send many Cambodians to study in China, the three princes a beginning. Zhou: an honor, another sign of friendship; ask for what they need; after their Chinese is good enough they go to specialized colleges.'
