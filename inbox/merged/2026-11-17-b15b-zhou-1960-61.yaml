      when: Apr. 19
      date: '1961-04-19'
      thread: china-leadership
      also:
      - farm
      c: 'Zhou Enlai to Mao, by letter: in his talks at Wuhan, Nanning, Yunnan and Chengdu on village rectification and the Sixty Articles, "three guarantees and one reward" and "30–70" came up; the Canton conference did not settle distribution by output; distribution by labor grade or work points is not liked by the masses. He sends Sichuan''s meeting bulletin and two reports from Nanchong.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 405 (Apr. 19, 1961). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
