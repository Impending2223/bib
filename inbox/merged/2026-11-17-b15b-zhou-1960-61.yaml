      c: 'Zhou Enlai receives Indonesia''s Ambassador, Sukarni. China''s entry to the United Nations is joined to the Taiwan question, two sides of one problem; America''s seating the Taiwan authorities there for China is laughable; as long as Taiwan''s delegate stays China cannot enter. To Sukarni''s "1961 will be the year of the People''s Republic": China is a new state, still backward; building it needs a long time.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 398 (Mar. 13, 1961). Made public: 1997. Names: Zhou Enlai.'
