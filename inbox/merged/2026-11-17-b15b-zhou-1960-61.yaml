      - china
      c: 'Zhou Enlai drafts for the Center a comment forwarding the reports of grave conditions in parts of Shandong, Henan, Gansu and Guizhou: in Zunyi and Bijie, waste, graft, lawlessness and disregard for people''s lives among cadres beyond imagining; some sabotage feudal forces'' revenge, the sharpest class struggle in the village. The four provincial committees to check and correct, and convey the twelve-article urgent directive to the masses without reserve.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 377 (Dec. 6, 1960). Made public: 1997. Names: Zhou Enlai.'
