      when: Feb. 18
      date: '1961-02-18'
      thread: china-leadership
      also:
      - congo
      c: Peking. Zhou Enlai at the rally of 100,000 protesting the killing of Lumumba by imperialism and its agents.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 391 (Feb. 18, 1961). See [[cal.1961-02-14.china-leadership-2]]. Names: Zhou Enlai, Lumumba.'
