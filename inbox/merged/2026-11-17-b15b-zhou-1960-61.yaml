      date: '1960-08-13'
      thread: china-leadership
      also:
      - china
      c: 'At a meeting of the United Front Work Department Zhou Enlai on the situation: raise spirits, rely on oneself, keep to principle and unity, widen the anti-imperialist front. America holds to strength and the brink of war, its aim peaceful evolution inside the socialist camp. At home: the three red banners and walking on two legs; a shorter front in construction, culture and education; the mass line; remolding of intellectuals and bourgeoisie.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 339 (Aug. 13, 1960). Made public: 1997. Names: Zhou Enlai.'
