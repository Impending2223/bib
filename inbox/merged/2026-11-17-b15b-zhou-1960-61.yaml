      c: 'Zhou Enlai drafts "The plan for the talks of the two premiers of China and India on the boundary question." Estimate: some agreement is possible, full settlement not likely, no result at all not likely. Policy: time and the situation favor China; seek continued relaxation without fear of delay; aim at agreement on some principles or points to ease the situation and prepare later talks toward a reasonable settlement. He sends the draft that day to Mao, Liu, Zhu, Lin and Deng.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 302 (Apr. 5, 1960). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Lin Biao, Deng Xiaoping.'
