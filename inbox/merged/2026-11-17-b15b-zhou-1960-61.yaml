      c: 'Zhou Enlai at Mao''s meeting, then with Chen Yi receives R. K. Nehru, Secretary-General of India''s Foreign Ministry: no basic conflict of interest between China and India, their problems to be settled; China tries to improve relations and cooperate where it can; India should not allow the Dalai group to act against the motherland.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 424 (July 16, 1961). Made public: 1997. Names: Zhou Enlai, Chen Yi, R. K. Nehru.'
