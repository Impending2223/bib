    entry:
      id: cal.1961-03-02.china-leadership
      when: Mar. 2
      date: '1961-03-02'
      thread: china-leadership
      also:
      - farm
      c: 'On the notes of Mao''s talk on the people''s commune system and some policies (his remarks of Feb. 6–12 to Jiang Hua, Huo Shilian, Lin Pingjia, Tian Jiaying, Hu Qiaomu and others: communes too large cause equalitarianism and blind command; production and accounting units not to be large; a regulation on communes; production teams'' power to be raised; policy fixed), Zhou Enlai proposes printing them for those at the "Three North" conference.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 395 (Mar. 2, 1961). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-03.china-leadership-8
      when: Mar., early
      date: 1961-03
      thread: china-leadership
      also:
      - china
      at: before 1961-03-11
      c: 'Zhou Enlai, learning that the Hong Kong paper *Zhen bao* reports an American "one and a half Chinas" plan (acknowledging China''s suzerainty over Taiwan, neither side to use force there, Taiwan to sit at the United Nations like the Byelorussian and Ukrainian republics), instructs the Center''s group on Taiwan: American basic policy will not change but it will play new tricks to confuse some; seeing that imperialism''s nature does not change is not enough, watch new conditions and trends, tactics with care, an investigating wind so enemy, friend and self are all clear.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 395 (Mar. 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:us
      - polity:roc
      - name:zhou-enlai
      - vis:only:prc
