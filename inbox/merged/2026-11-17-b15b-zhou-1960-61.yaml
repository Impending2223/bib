      when: Feb. 8
      date: '1961-02-08'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai on the United Front Department''s report on the first pardoned war criminals, Puyi, Du Yuming and others: the seven in Peking (Puyi, Du Yuming, Wang Yaowu, Song Xilian, Zhou Zhenqiang, Zheng Tingji, Yang Botao) first to be special members of the Cultural and Historical Materials Committee of the Political Consultative Conference and to study at the Institute of Socialism, pay raised to 100 yuan a month; Puyi may if he prefers stay half-work half-study at the botanical garden, with the same title; four others in Shanghai, Shenyang, Kunming and Nanjing to be given the same title.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 390 (Feb. 8, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
