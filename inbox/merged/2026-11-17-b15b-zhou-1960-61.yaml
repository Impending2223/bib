      date: '1960-04-18'
      thread: china-leadership
      also:
      - china
      - laos
      c: Zhou Enlai's third talk with U Nu. He asks Burma to destroy the Chiang Kai-shek remnants building the airfield on the Burmese border, and, as American planes drop arms, radios and agents into Tibet from Bangkok over Burma or China, to intercept them over Burmese air. He thanks U Nu for his goodwill toward the Delhi talks. A Sino-Burmese joint communiqué is issued Apr. 19.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 305 (Apr. 18, 1960). Made public: 1997. Names: Zhou Enlai, U Nu.'
