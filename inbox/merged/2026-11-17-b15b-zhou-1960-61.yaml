      thread: china-leadership
      also:
      - farm
      c: 'Zhou Enlai settles the Center''s "Several provisions on grain work for 1961–62": stocks below last year''s, city and mine supplies at risk; the Party to be mobilized, buy in time, press the cut of town numbers; the policy somewhat loosened, substitute foods, more work more pay ("loose policy now helps output more"); China''s grain to rest on self-reliance, imports needed for a time but never a long-term plan.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 430 (Aug. 30, 1961). Made public: 1997. Names: Zhou Enlai.'
