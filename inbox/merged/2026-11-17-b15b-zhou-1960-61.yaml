    entry:
      id: cal.1961-01-16.china-leadership
      when: Jan. 16
      date: '1961-01-16'
      thread: china-leadership
      also:
      - farm
      - trade
      c: 'At the Secretariat on grain: stocks hollowed out, so strain everywhere; the way is still to press output and make the production teams'' contracts good, or faith is lost; on imports, talks now under way, possibly a contract with the United States. Next day he calls the officials concerned on the import of grain.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 385 (Jan. 16, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-16.china-leadership-2
      when: Jan. 16
      date: '1961-01-16'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai has his office write to the Party committee of Huai''an county in Jiangsu, who sent local products despite the Center''s repeated order against gifts: criticism and teaching; the Center''s notice against banquets, gifts and new guesthouses sent to them; the perishable food paid for, the knitwear returned.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 385 (Jan. 16, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-17.china-leadership
      when: Jan. 17
      date: '1961-01-17'
      thread: china-leadership
      also:
      - soviet-union
      - foreign-aid
      c: 'Zhou Enlai receives the Albanian government''s economic delegation under Spiro Koleka, First Vice-Chairman of the Council of Ministers. Three principles for trade and economic cooperation: internationalism, realism, and having a way. A 1961 trade agreement can be made, with credit and barter; the interest-free credit''s repayment to be 1971, extendable, and if hard then, not repaid. A sum for long-term trade and cooperation can be fixed. Military aid: talk with the Soviet Union and prepare on China''s side, two hands.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 385 (Jan. 17, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1961-01-19.china-leadership-2
      when: Jan. 19
      date: '1961-01-19'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai presides at the Central Work Conference, on measures for the first quarter''s plan: in difficulty to share breath and fate, blame neither heaven nor others; to find the facts, take several typical cases; know the facts before resolve; be modest and careful, and where facts are unknown do not blame localities or ministries alone, for "we too are to blame." In the afternoon he presides again, on foreign trade.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 386 (Jan. 19, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-21.china-leadership
      when: Jan. 21
      date: '1961-01-21'
      thread: china-leadership
      also:
      - europe-and-the-alliance-federal-republic
      c: 'Zhou Enlai tells East German guests: the socialist states trail the capitalist ones in material life but surpass them in spiritual life; unless socialism grows strong the enemy will threaten it when he can. On deliveries of soy, rice, pork and fats: with China''s great disasters, only arrears, nothing before after the autumn harvest.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 386 (Jan. 21, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:gdr
      - name:zhou-enlai
      - vis:only:prc+gdr
- add:
    entry:
      id: cal.1961-01-23.china-leadership-3
      when: Jan. 23
      date: '1961-01-23'
      thread: china-leadership
      also:
      - economy
      c: 'The Center and the State Council decide to cut the purchasing power of social groups: from about 8 billion yuan the year before to 4 to 5 billion in 1961. By the first half''s end, 2.2 billion.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 386 (Jan. 23, 1961). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
- add:
    entry:
      id: cal.1961-01-24.china-leadership-2
      when: Jan. 24
      date: '1961-01-24'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Panchen Lama on Tibet. Slogan: increase output and welcome the founding of the autonomous region; in the democratic reform, conservative and slower is allowed if no treason and no pressure on the masses. Speed the preparatory work; more Han cadres in the preparatory committee''s offices, to be settled by the Panchen with the Party''s Tibet working committee; the Kanting (the Panchen''s office) to end with proper formalities; train true believers and scholars in the religion; talk freely with the working committee. The Panchen: reform has done great things, faults and gains nine to one. On the 27th he leaves for Tibet.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 386 (Jan. 24, 1961). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-27.china-leadership
      when: Jan. 27
      date: '1961-01-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai attends the signing of the Sino-Burmese trade agreement and gives the Burmese trade delegation a banquet: the two countries'' friendship grows from the five principles, Bandung''s ten, mutual understanding and consultation.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 387 (Jan. 27, 1961). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:burma
      - name:zhou-enlai
- add:
    entry:
      id: cal.1961-01-27.china-leadership-2
      when: Jan. 27
      date: '1961-01-27'
      thread: china-leadership
      also:
      - economy
      - oil
      c: At the Secretariat on industry, chiefly oil, timber and coal and the supply of farm and side products. The oil ministry within a month to plan for 15 million tons of oil a year in the Songliao plain by 1964 and to use south Sichuan's gas.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 387 (Jan. 27, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-28.china-leadership
      when: Jan. 28
      date: '1961-01-28'
      thread: china-leadership
      also:
      - china
      - foreign-aid
      c: Zhou Enlai presides at the State Council's 108th meeting, which takes up submitting to the National People's Congress Standing Committee the treaty of friendship and nonaggression with Cambodia and the plenipotentiary for a Sino-Albanian commerce and navigation treaty, and merges the State Capital Construction Commission into the Planning Commission. On Albania he says that China, though gravely struck by disaster, has promised grain and other goods worth about 100 million rubles; in foreign aid, mutual help among socialist states, support for the independent nationalist states to widen the zone of peace.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 387 (Jan. 28, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:cambodia
      - polity:albania
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-28.china-leadership-2
      when: Jan. 28
      date: '1961-01-28'
      thread: china-leadership
      also:
      - economy
      c: Zhou Enlai with Bo Yibo, Gu Mu and Wang Heshou on sending work teams to the Northeast.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 387 (Jan. 28, 1961). Made public: 1997. Names: Zhou Enlai, Bo Yibo.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:bo-yibo
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-30.china-leadership-2
      when: Jan. 30
      date: '1961-01-30'
      thread: china-leadership
      also:
      - foreign-aid
      c: Zhou Enlai tells Koleka China will lend 500 million yuan. In the third five-year plan do not overbuild industry while farming has not passed the barrier; make farm products industrial raw materials, which pay back quickly; choose, with priorities; heavy industry only after resources, labor and equipment, and China's capacity to aid.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 387 (Jan. 30, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1961-01-30.china-leadership-3
      when: Jan. 30
      date: '1961-01-30'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives Puyi and Pujie and asks of their health, study, life, work and family; he weighs the Qing government's merits and faults in two parts; he welcomes Pujie's Japanese wife Hiro to come back, and suggests he write her that the government agrees, that she may go back if she cannot get used to it, that there is no imperial house, that all live alike and none above another.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 388 (Jan. 30, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-31.china-leadership
      when: Jan. 31
      date: '1961-01-31'
      thread: china-leadership
      also:
      - laos
      - vietnam-hanoi
      - china
      c: 'Zhou Enlai receives the DRV government''s economic delegation under Vice-Premier Nguyễn Duy Trinh and speaks on Laos: the civil war raised by the Phoumi–Boun Oum clique with American, Thai and South Vietnamese support threatens Southeast Asia, Vietnam and China. On industry: keep its scale down, for more industry needs more labor and market supply and hurts farming; China, which in eleven years never imported grain, must this year, from two years'' disaster and also from too much industry. Farming as base means asking how much grain, labor, raw material and market the village can give the city.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 388 (Jan. 31, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc+drv
