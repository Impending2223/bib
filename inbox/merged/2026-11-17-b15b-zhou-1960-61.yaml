      - trade
      c: Zhou Enlai receives members of a Soviet delegation, Kumykin, Deputy Minister of Foreign Trade, and Arkhipov, First Vice-Chairman of the State Committee for Foreign Economic Relations, and speaks on Sino-Soviet economic and trade relations.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 394 (Mar. 1, 1961). Made public: 1997. Names: Zhou Enlai.'
