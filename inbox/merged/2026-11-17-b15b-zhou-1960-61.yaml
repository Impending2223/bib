      when: Aug. 7–11
      date: '1961-08-07'
      thread: china-leadership
      also:
      - farm
      - economy
      c: 'At the Secretariat, Aug. 7–11: on the 7th, on the international situation, grain and the market; on the 9th, on military industry and plan: raise variety and quality to the 1960s'' mechanization; learn the deep lessons about industry and the cities; the adjusted plan must be solid, with no more chasing figures and blind command; admit that the present state cannot go on, that policy deviated and work erred; tell the truth. The meeting also takes up commerce, prices, the market and currency.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 426 (Aug. 7, 1961). Made public: 1997. Names: Zhou Enlai.'
