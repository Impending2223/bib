      date: '1961-07-09'
      thread: china-leadership
      also:
      - korea
      - china
      c: Zhou Enlai presides at the State Council's 111th meeting, which takes up the treaty of friendship, cooperation and mutual assistance with the DPRK and the order on summer conscription (wholly conscript service does not raise fighting strength; some officers and men to serve beyond term; "let good men be soldiers"). It agrees the Panchen's Kanting council's request to wind up, its seals and files going to the Tibet autonomous region's preparatory committee, and hears Chen Yi on the Geneva conference. The same day the Standing Committee names Zhou plenipotentiary to sign the treaty.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 423 (July 9, 1961). Names: Zhou Enlai, Kim Il Sung.'
