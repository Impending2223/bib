      c: 'Zhou Enlai receives the Chinese planning experts'' delegation going to Vietnam: offer China''s experience without overstatement; small traders and handicraftsmen to be organized, as in Korea; every country needs its own system, with a steel base (a first figure of 500,000 tons in the five-year plan); help Vietnam as China was helped; relations with the Soviet Union kept good, argument with the Soviet comrades avoided.'
