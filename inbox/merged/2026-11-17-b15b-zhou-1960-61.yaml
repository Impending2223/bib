      c: 'Zhou Enlai''s second talk with Montgomery: the peoples of China and the United States wish each other friendship, with no basic conflict of interest; the hostility began with the United States, its policy of aggression and war and its seizure of Taiwan. For better relations the United States to acknowledge Taiwan part of China and withdraw its forces from Taiwan and the Strait; China will then sit down with it and seeks Taiwan''s peaceful liberation, by force only if Taiwan itself fights.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 322–23 (May 26, 1960). Made public: 1997. Names: Zhou Enlai, Montgomery.'
