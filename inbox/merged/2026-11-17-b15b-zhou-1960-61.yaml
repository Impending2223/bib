      c: 'Zhou Enlai receives Indonesia''s Ambassador, Sukarni: the first task is the national economy; industry for its growth; an economy not freed of colonial control is not independence; China''s line is agriculture the base, industry the lead. On Indonesia''s citizens of Chinese descent, Indonesia should persuade them; the overseas Chinese China will persuade to help Indonesia''s industry.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 447 (Dec. 25, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
