patch: 2026-11-17-b15b-zhou-1960-61
by: 'Claude (batch 15b, reader 1: *Zhou Enlai nianpu, 1949–1976*, II, 1960–61, from the owner''s Drive copy of the 1997 edition''s middle volume), Nov. 17, 2026'
ops:
- cite:
    id: cal.1960-01-07.china-leadership
    item: '[[w.zhou-enlai-nianpu-1949]], II, 277, Jan. 7–17, 1960 (Zhou attends; the plan for 1960, the three- and eight-year projections, steel and grain targets)'
    units: A
- add:
    entry:
      id: cal.1960-01-09.china-leadership-2
      when: Jan. 9
      date: '1960-01-09'
      thread: china-leadership
      c: 'Zhou Enlai drafts the Center''s comment approving the Peking municipal Party committee''s report on the first stage of the Peking subway: the plan and the construction committee''s membership approved in principle; the investment, equipment and materials the report names to go into the 1960 plan.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 277 (Jan. 9, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-10.china-leadership
      when: Jan. 10
      date: '1960-01-10'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai, on the Foreign Ministry''s report of the Soviet approach to China on disarmament: after Khrushchev proposes disarmament to the parliaments of all countries before the Supreme Soviet on Jan. 14, the National People''s Congress Standing Committee to resolve that China supports disarmament but, having had no part in the talks, takes no obligation. To stop Moscow committing China at the disarmament and summit conferences.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 278 (Jan. 10, 1960). Made public: 1997. Names: Zhou Enlai, Khrushchev.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:khrushchev-nikita-s
      - vis:only:prc
