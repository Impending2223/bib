      c: 'Zhou Enlai receives the Chilean education delegation, headed by Juan Gómez Millas, rector of the University of Chile and president of the Latin American union, and the painter Julio Escámez: American imperialism seeks to make Taiwan a separate political unit and meets resistance from the People''s Republic and from Chiang Kai-shek; China opposes the "two Chinas." Latin America should have a new Monroe doctrine against interference, with a common market and trade with many countries, not one.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 302 (Apr. 6, 1960). Names: Zhou Enlai.'
