      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives the Polish Ambassador: much in the Soviet document handed the parties at Bucharest does not fit the facts; the Moscow Declaration the common standard; China hopes the November meeting at Moscow agrees on that basis; his wish to go to Gomułka. India: China stops patrols twenty kilometers from the border. Japan: the new government''s basic policy will not change; stress contacts with the people.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 336 (Aug. 1, 1960). Made public: 1997. Names: Zhou Enlai.'
