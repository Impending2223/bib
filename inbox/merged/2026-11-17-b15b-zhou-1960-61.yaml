      c: Zhou Enlai to Koirala, accepting his request for 50,000 rupees in compensation. Chinese troops are now surrounding Tibetan rebels south of the Maquan river, east of the Keyang river, east of Babazha and west of the line ten kilometers inside the border; the work should end by the end of July, when the troops will withdraw twenty kilometers from the border.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 331 (July 12, 1960). Made public: 1997. Names: Zhou Enlai, Koirala.'
