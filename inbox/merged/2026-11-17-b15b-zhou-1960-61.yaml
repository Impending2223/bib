      thread: china-leadership
      also:
      - farm
      c: Zhou Enlai at Deng Xiaoping's meeting with Chen Yun, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo and Yang Shangkun, on grain for the second quarter and the 1961–62 grain year.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 412 (May 28, 1961). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping, Chen Yun, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo.'
