      thread: china-leadership
      also:
      - soviet-union
      - china
      c: Zhou Enlai receives the American writer Anna Louise Strong. Unity of the two parties, two states and all brother parties is the main thing; the differences, not great, are of principle, but in action neither party has left the Marxist–Leninist course; wrong theory must be limited and pulled back. The anti-American movement warns imperialism and limits its provocations; China opposes American aggression, cold war and policies of strength but does not refuse to sit down with the American government; the aim is to show America that China cannot be provoked or slighted, so as to stop war or delay it.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 342 (Aug. 25, 1960). Made public: 1997. Names: Zhou Enlai.'
