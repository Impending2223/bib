      c: At the State Planning Commission's report on the policy of "rectifying, consolidating and raising" the 1961 economy, Zhou Enlai adds "filling out"; on Sept. 5 changes "rectifying" to "adjusting." The Center's approval of the Commission's 1961 control figures, issued Sept. 30, puts agriculture first, so that production and construction be adjusted, consolidated, filled out and raised as they grow.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 345 (Aug. 30, 1960). Made public: 1997. Names: Zhou Enlai.'
