      date: '1961-12-11'
      thread: china-leadership
      also:
      - economy
      c: 'At the Secretariat on the 1962 plan Zhou Enlai: drop the dream of foreign aid, be self-reliant; the four backbone targets (steel, coal, timber, oil) not to be cut again; others adjusted in balance; the part serves the whole, the present the long run, the Party the Center. Seven points: seize coal and timber first, then non-ferrous metals and fertilizer; quotas; cuts in staff (12 million this year, 8 million next, 3 million workers); production with repair; queueing of capital construction; thrift; variety and quality. He goes on at the Secretariat on the 12th.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 443 (Dec. 11, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
