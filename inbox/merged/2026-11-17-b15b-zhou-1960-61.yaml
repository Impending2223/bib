      when: Oct. 5
      date: '1960-10-05'
      thread: china-leadership
      also:
      - africa-algeria-morocco
      - soviet-union
      - china
      c: 'Zhou Enlai''s third talk with Ferhat Abbas. Abbas asks China to explain to the Soviet Union and other socialist states, slow to respond to the liberation of colonies, and asks Chinese technicians and chemists. Zhou: as France weakens and Algeria grows stronger, watch for splitting plots in the name of the United Nations. Technicians: volunteers and technicians kept apart; sent to Tunisia and Morocco to help train technicians and cadres; by stages after study.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 355 (Oct. 5, 1960). Made public: 1997. Names: Zhou Enlai, Ferhat Abbas.'
      tags:
      - polity:prc
      - polity:algeria
