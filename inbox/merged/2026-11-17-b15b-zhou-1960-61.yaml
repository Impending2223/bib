      when: Feb. 5
      date: '1961-02-05'
      thread: china-leadership
      also:
      - soviet-union
      - defense
      c: 'Zhou Enlai, answering Khrushchev''s letter of Jan. 12 on the Soviet government''s now being able to give technical aid to production of MiG-21 fighters in China: the Chinese government decides to send a delegation to Moscow in mid-February to settle the details and sign the agreements; making this new fighter in China will help strengthen national defense.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 389 (Feb. 5, 1961). Made public: 1997. Names: Zhou Enlai, Khrushchev.'
      tags:
      - polity:prc
      - polity:ussr
