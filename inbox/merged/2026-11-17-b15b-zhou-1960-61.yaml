      date: '1961-06-23'
      thread: china-leadership
      also:
      - china
      c: At the Standing Committee, which takes up the 40th anniversary celebrations of the Communist Party.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 418 (June 23, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
