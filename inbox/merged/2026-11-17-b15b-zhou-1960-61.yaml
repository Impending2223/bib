      c: 'Zhou Enlai hears the Chinese delegates leaving for the Sino-Burmese boundary joint commission at Rangoon: the first session to be viewed politically, to show by settlement of the boundary that the five principles live; equal consultation, no great-power chauvinism; for villages cut by the line, a fair adjustment, each village kept whole, to China or to Burma, balanced, to suit the people and for friendship.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 326 (June 13, 1960). Made public: 1997. Names: Zhou Enlai.'
