      also:
      - cuba-bay-of-pigs
      c: 'Zhou Enlai cables Fidel Castro, the brigade landed at the Bay of Pigs: China firmly supports the Cuban people''s defense of their country against American armed aggression.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 390 (Apr. 18, 1961). See [[cal.1961-02-06.china-leadership]]. Names: Zhou Enlai, Castro.'
