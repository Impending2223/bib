      c: 'Zhou Enlai passes to the political departments of the military regions, services, arms, academies, General Staff and Rear Services a letter to the Center, Mao and Zhou from an engineer training company at Guangzhou proposing lower grain rations and pay, a Party-wide donation campaign and repayment of the national debt: the spirit good, thrift to be encouraged; but the present difficulty is a shortage of goods, to be met by more output, thrift and rooting out graft; grain saved by the State''s standard; surplus pay to the bank; donations not to be promoted.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 373 (Nov. 1960). Made public: 1997. Names: Zhou Enlai.'
