      c: 'Zhou Enlai receives the Japan–China Friendship Association delegation under Kuroda Hisao, adviser to the Japan Socialist Party, member of the House of Representatives and the Association''s vice-president: he agrees that China''s revolution''s success has encouraged oppressed peoples, but for imperialists and colonialists not to overlook new China it must be stronger, so their attitude may change; he praises the late chairman Asanuma Inejirō''s judgment that American imperialism is the common enemy of the Chinese and Japanese peoples.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 437 (Oct. 4, 1961). Made public: 1997. Names: Zhou Enlai.'
