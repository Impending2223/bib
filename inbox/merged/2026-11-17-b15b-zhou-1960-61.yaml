      when: June 17
      date: '1961-06-17'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai at the quarters of the delegates to the literary and art symposium and the feature film writing conference talks with the writers and artists to learn how the conference goes and gather views on improving leadership.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 417 (June 17, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
