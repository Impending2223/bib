    entry:
      id: cal.1960-10-17.china-leadership-2
      when: Oct. 17
      date: '1960-10-17'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai to the meeting of Party members of rank 17 and above in the Central and State organs and Peking, and army majors and above, on cutting offices and sending cadres down: the situation at home and abroad good, but difficulties arise from natural disaster, lack of experience, outside causes, unsteady policy, cadres'' bad ways and impure ranks. Hard work and thrift; a shorter capital construction front; offices merged, cadres down to the base; the communes put in order, labor pushed into farming.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 358 (Oct. 17, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
