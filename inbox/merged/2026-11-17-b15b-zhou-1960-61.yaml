      c: 'Zhou Enlai goes to Lushan and settles "Central Work Conference document no. 8," the explanation of the 1961–62 grain allotment and purchase-sales plan: the grain work is very heavy and the Party must be mobilized, with thought work first and organization too; the key is to make the State''s grain difficulty clear to the cadres at the base and to people in town and country, and to rouse and rely on the masses.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 429 (Aug. 23, 1961). Made public: 1997. Names: Zhou Enlai.'
