      date: '1960-09-28'
      thread: china-leadership
      also:
      - economy
      c: 'At the Secretariat on the 1961 plan Zhou Enlai: main means of production allotted centrally; a group (An Ziwen, Xi Zhongxun, Liu Ren, Ma Wenrui) to work out how many officials go down to the countryside and how many workers are cut, a plan in October; after National Day each vice-premier to a province; halls and houses to stop. The meeting approves in principle the Planning Commission''s 1961 control figures.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 352 (Sept. 28, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
