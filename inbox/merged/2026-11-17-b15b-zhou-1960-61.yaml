      date: '1960-04-26'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai reaches Katmandu, calls on Prime Minister Koirala and Prince Himalaya, and attends the citizens' welcome meeting.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 314 (Apr. 26, 1960). Names: Zhou Enlai, Koirala.'
