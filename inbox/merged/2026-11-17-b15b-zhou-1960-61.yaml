    entry:
      id: cal.1960-04-16.china-leadership-3
      when: Apr. 16
      date: '1960-04-16'
      thread: china-leadership
      also:
      - china
      - laos
      c: 'Zhou Enlai tells Ne Win two things. Kuomintang troops under Liu Yuanlin have built a large airfield on the Burmese side of the Laos border (equipment from Taiwan and Bangkok), their headquarters at Jiangla; the Americans and Chiang will make new incidents, and China sees the Kuomintang army in Burma as a shared scourge: if it enters China it will be destroyed. Second, since February high-altitude American and Chiang flights go through Burma into Tibet and back to Bangkok; each side may force down or shoot down over its own land. Ne Win agrees.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 303 (Apr. 16, 1960). Made public: 1997. Names: Zhou Enlai, Ne Win.'
