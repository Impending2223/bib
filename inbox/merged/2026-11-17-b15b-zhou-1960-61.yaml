      when: Feb. 14
      date: '1961-02-14'
      thread: china-leadership
      also:
      - economy
      c: Zhou Enlai at the Secretariat on the supply plan for coal in February and March; on the 6th he had called the vice-premiers and departments on it.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 391 (Feb. 14, 1961). Made public: 1997. Names: Zhou Enlai.'
