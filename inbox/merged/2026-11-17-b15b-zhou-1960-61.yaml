      c: 'At the Central Work Conference Zhou Enlai on grain and foreign trade: still tight; purchases and sales 7 billion jin short, to be met by imports; how much grain, labor and raw material the village can give the city decides how big industry may be. Three measures: back farming from all sides; thrift in dress and food; cut the urban population by over 10 million, from the 1961 wheat harvest to the end of 1962.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 399 (Mar. 20, 1961). Made public: 1997. Names: Zhou Enlai.'
