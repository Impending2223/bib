      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-23.china-leadership-3
      when: Oct. 23
      date: '1960-10-23'
      thread: china-leadership
      also:
      - japan
      - trade
      c: Zhou Enlai's second talk with Takasaki Tatsunosuke. Asian states should build independent economies, the Bandung spirit, and exchange visits and technique. On the revival of Japanese militarism, most Chinese fear the new security treaty, chiefly because it is run and ordered by American imperialism; China would welcome a peaceful, wholly independent and democratic Japan with arms of self-defense. Government trade agreements only after normalization on the three political principles, but private contracts case by case meanwhile. Japanese war criminals may be freed early in due time.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 360 (Oct. 23, 1960). Made public: 1997. Names: Zhou Enlai, Takasaki Tatsunosuke.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - name:takasaki-tatsunosuke
      - vis:only:prc+japan
