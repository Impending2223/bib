      - soviet-union
      c: 'Zhou Enlai receives the socialist countries'' envoys in Peking and describes China''s state. To overcome the famine: rely first on the Chinese people; cut rations, low standards, vegetables and melons for grain, substitute foods; thrift and more output to keep industry; keep to the masses and the hard, plain style of the war years. Last year''s trade debts with the brother countries to be repaid later and this year''s imports and exports cut, so they bear China''s farm difficulty, which makes China uneasy.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 396 (Mar. 8, 1961). Made public: 1997. Names: Zhou Enlai.'
