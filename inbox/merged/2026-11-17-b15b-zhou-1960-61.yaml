      date: '1960-04-28'
      thread: china-leadership
      also:
      - china
      - south-asia
      c: 'Zhou Enlai''s evening press conference. China has never made a claim to Mount Everest and accepts the summit line between China and Nepal. Nehru''s speech in Parliament on Apr. 26 was not friendly: he does not say it to Zhou''s face, and when China has gone attacks its government as aggressor, a painful attitude.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 314 (Apr. 28, 1960). Names: Zhou Enlai, Nehru.'
