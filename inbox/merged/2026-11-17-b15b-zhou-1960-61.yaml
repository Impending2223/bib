      id: cal.1961-04-27.china-leadership
      when: Apr. 27
      date: '1961-04-27'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Fei Qiumin on united front work toward Taiwan and Hong Kong: intelligence a reference only, not the sole basis of policy; intelligence of two kinds, the people''s and the secret agent''s, China relying chiefly on the first, on the people, sympathizers and progressives. In Hong Kong learn the white ant''s spirit, do more, say less, no bragging; come out of the mud unsoiled; unite all kinds of upper circles and train talent of all kinds. He asks the cadres to read *Zhan guo ce* and *Dong Zhou lieguo zhi*.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 407 (Apr. 27, 1961). Made public: 1997. Names: Zhou Enlai. Check: the name Fei Qiumin, from the chronology''s Chinese (费丘民).'
