      c: Zhou Enlai goes with Sékou Touré to Shanghai; on the plane tells him China is considering the farm machines and tools Guinea wants, has not solved the paddy tractor, and will send experts to Guinea to study on the spot. That afternoon he takes him through Minhang new industrial district, the turbine works and the new workers' housing, and the children's palace. He sees him off to Wuhan on the 15th and returns to Peking.
