      c: 'Zhou Enlai sends Liu Shaoqi, for issue, with a copy to Mao, the Center''s draft directive forwarding the Planning Commission''s and Labor Ministry''s reports on arranging labor and pay. Note: every place now takes this seriously; by what Li Xiannian saw in Hunan and he himself in Shanghai and Hefei, all are sending home all who can go; after issue the number who can be got back to production this year, the state workers who can be cut and those to go down long are to be reckoned and the plan pressed to that.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 351 (Sept. 27, 1960). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi, Mao Zedong.'
