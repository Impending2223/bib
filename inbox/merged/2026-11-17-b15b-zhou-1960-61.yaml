      c: 'Zhou Enlai receives Cambodia''s Ambassador, Lan Neth: the Laotian question so complex and so large for Asian and world peace should be made to succeed; all to find common ground and keep their differences so each side can accept; China opposes a break but does not fear one.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 423 (July 10, 1961). Made public: 1997. Names: Zhou Enlai, Sihanouk.'
