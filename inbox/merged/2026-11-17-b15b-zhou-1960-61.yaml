    entry:
      id: cal.1961-02-21.china-leadership-2
      when: Feb. 21
      date: '1961-02-21'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with Chen Yi receives the second group of pardoned war criminals and urges them to write memoirs: no embroidery, true to fact, a true report will settle history; there is no new society without old thoughts, begin again and change old habits.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 392 (Feb. 21, 1961). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-22.china-leadership-2
      when: Feb. 22
      date: '1961-02-22'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai revises the Center''s urgent notice on the first quarter''s capital construction plan: industrial targets for January and February under expectation, chiefly from two years of disaster, in part faults in economic work and a front of construction still too long. Except the 855 large and medium projects and schools, dormitories and urgent houses supplied, all other building to stop at once; among the 855 only coal, timber, mining, transport and a few oil and chemical projects to be finished. He adds that stopped units must hold political training and keep works and equipment from waste.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 392 (Feb. 22, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-22.china-leadership-3
      when: Feb. 22
      date: '1961-02-22'
      thread: china-leadership
      also:
      - farm
      - trade
      c: 'At the enlarged Standing Committee that evening Zhou Enlai reports the Planning Commission''s Party group on the 1961 capital construction plan and speaks on grain: the question is the estimate of disaster, which has been too low since last year, so recovery is not quick; this year''s grain imports to rise from 4 million tons to 5 million. Chen Yun speaks on moving workers back to the villages and on the market.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 393 (Feb. 22, 1961). Made public: 1997. Names: Zhou Enlai, Chen Yun.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yun
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-23.china-leadership
      when: Feb. 23–25
      date: '1961-02-23'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai at Shenyang, Feb. 23–25, to settle the serious fall of industrial output since January and turn around the Northeast''s and the nation''s: hears the Northeast Bureau on coal and other output, and Song Renqiong, Ouyang Qin and others. On the 25th he reports to the Northeast Bureau''s and Liaoning''s bureau-level cadres and takes the midnight train; on the 26th, on the train, he calls Lü Dong, Lü Zhengcao and Zhang Linzhi on the Northeast''s industry.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 393 (Feb. 23, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-26.china-leadership-2
      when: Feb. 26
      date: '1961-02-26'
      thread: china-leadership
      also:
      - china
      c: 'At the symposium the United Front Work Department holds for democratic party heads and non-Party mayors, Zhou Enlai on the situation: good at home and abroad but with part difficulties; results affirmed to build confidence, no despair or slackening; two years of adjustment; the farm difficulty not foreseen so great, it hits light-industry materials and some heavy industry; this year, thrift, more output, to pass the famine. Tell the nation and friends in the united front the true facts: with facts known, resolve is great and methods right.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 393 (Feb. 26, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-28.china-leadership
      when: Feb. 28
      date: '1961-02-28'
      thread: china-leadership
      also:
      - japan
      - trade
      c: Zhou Enlai receives the Japanese economic friendship delegation under Yamamoto Kumaichi and the friendly firms' trade delegation. Yamamoto's apology belongs to the past, both look ahead; Japan's people seek a peaceful, independent, neutral and democratic road, which China supports; a few want to restore the old militarist road, which China notes; China will never expand when strong; relations rest on the peoples' friendship, and without diplomatic relations China all the more widens exchange of peoples.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 394 (Feb. 28, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - vis:only:prc+japan
