      date: '1960-05-25'
      thread: china-leadership
      also:
      - europe-and-the-alliance-britain
      - china
      c: 'Zhou Enlai''s first talk with Montgomery. China is at least a hundred years behind the West and cannot wait; equality needs equal output and living standards. The West does not plan the same restraint as the socialist camp: reconnaissance planes, bases everywhere; war not inevitable but possible, both to be allowed for. China needs long peace to build. Taiwan: America first to acknowledge it part of China and withdraw its forces; then talks with Chiang on return and with America on withdrawal. If America begins a world war from the West against the Soviet Union, China will not stand aside.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 321 (May 25, 1960). Made public: 1997. Names: Zhou Enlai, Montgomery.'
      tags:
      - polity:prc
      - polity:uk
      - name:zhou-enlai
      - name:montgomery-of-alamein-bernard-l
      - vis:only:prc+uk
