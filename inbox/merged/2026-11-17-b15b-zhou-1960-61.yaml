      when: Apr. 21
      date: '1961-04-21'
      thread: china-leadership
      also:
      - china
      c: 'To the Chinese table tennis players, Zhou Enlai on dialectics in sport: win and lose, able to win and to lose; strive and conceal, strive for the title but hold something back; group and individual, victory is the group''s but each must study alone; labor and rest; democracy and centralism, speak out but obey; the player and the crowd, and how to teach spectators is unsolved.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 406 (Apr. 21, 1961). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
