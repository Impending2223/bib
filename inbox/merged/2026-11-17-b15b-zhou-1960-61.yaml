      c: Zhou Enlai, Dec. 6–8, with the vice-premiers on the 1962 plan and hearing the Planning Commission Party group on its arrangement. Domestic situation good, results great, the adjustment urgent and the difficulties many, so next year it must be done well, with no relaxing; adjust all unbalanced relations, integrated balance; main tasks of next year's adjustment named.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 443 (Dec. 6, 1961). Made public: 1997. Names: Zhou Enlai.'
