      when: Feb. 12
      date: '1961-02-12'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai and Deng Yingchao receive Puyi, Pujie and their brother and sister, ask of each one's health, life, study, work and family, and tell them to work on Hiro in life and thought and to see by contradiction that thought has advance and backwardness and needs constant remolding. Told that some of the family would be wary of her, he says wariness is needed but not too much; use her for Sino-Japanese friendship.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 391 (Feb. 12, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
