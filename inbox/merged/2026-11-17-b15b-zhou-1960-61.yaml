      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai to Li Fuchun, by letter: to meet the 20.4-million-ton steel target, quality, variety and the allotments of coking coal, pig iron and rolled steel inside the plan must be assured, and steel''s parts must advance together, with no eating of next year''s grain and no gaps; key mining areas protected, and room left for the next two years and the Third Five-Year Plan; the shortening of the front already said at the meeting, culture, education and trade for later.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 333 (July 21, 1960). Made public: 1997. Names: Zhou Enlai, Li Fuchun.'
