- add:
    entry:
      id: cal.1961-05-31.china-leadership-3
      when: May 31
      date: '1961-05-31'
      thread: china-leadership
      also:
      - farm
      c: 'At the Central Work Conference Zhou Enlai reports on grain and on cutting the city population: grain still tight, stocks at the minimum, 1961–62 tight too; the basic way to send city people back to the villages, "from where they came, back there"; cut the workforce without harming construction. The question is speed: slow the building, shorten the front, raise productivity, grow the village economy.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 412 (May 31, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06.china-leadership-6
      when: June, early
      date: 1961-06
      thread: china-leadership
      also:
      - farm
      at: before 1961-06-11
      c: 'On the regional leaders'' views on his report of May 31, Zhou Enlai drafts the "Nine measures on grain": cutting the town population led by each Party committee, with full political mobilization; towns only to cut; city numbers verified; no rise in the 1961–62 ration standard; the grain figures for July 1961 to June 1962 fixed after August; promotions and pay changes put off to the second half of the year; central departments to plan cuts in their own enterprises; city conscription; industry and commerce to plan help for farming. On the 6th he explains each at the conference.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 413 (June 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
