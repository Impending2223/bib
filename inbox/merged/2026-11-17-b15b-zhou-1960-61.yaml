      c: 'At the Secretariat''s meeting on the Center''s draft directive on lowering the grain rations of country and town, Zhou Enlai asks: distinguish disaster, part disaster and none, and not say nine hundred million mu hit; "six provinces'' output down is fixed" is too dead, say efforts to hold the fall down; do not say too soon that the purchase quota seems unattainable.'
