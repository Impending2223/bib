      when: July 4
      date: '1961-07-04'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Zhang Xueming and Zhu Luotiao, recalling his first contact with Zhang Xueliang in April 1936: Hanqing a frank man ready to criticize himself, who gave 30,000 fabi to the army; on secret contacts between the Communists and the Kuomintang at Taiwan, China''s greatest credit with Taiwan is keeping the secret and doing what it has promised, while Taiwan''s news often leaks to the Americans.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 421 (July 4, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:roc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-04.china-leadership-2
      when: July 4
      date: '1961-07-04'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Zhou Enlai receives the DRV''s water resources and electric power ministry''s delegation: controlling water is not easy; two thousand years of Chinese experience to be studied; survey, design and study time be long, from large to small; turn water harm to benefit with an active line but no haste; survey first, then design, then construction preparation, and not too much at once; resources reckoned jointly, not each department only its own; fighting nature means defeat before victory, "a hundred battles, a hundred victories" is illogical.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 421 (July 4, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc+drv
