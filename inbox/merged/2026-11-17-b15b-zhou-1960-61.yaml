      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the rally of 100,000 in Peking celebrating the signing of the Sino-Burmese boundary treaty: the treaty a milestone in Sino-Burmese friendship, a shining example of how Asian peoples can live together and a good model for settling boundaries and other disputes among Asian states.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 354 (Oct. 2, 1960). Names: Zhou Enlai.'
