      also:
      - economy
      c: 'The Center''s Organization Department issues a notice on drawing cadres from central organs down to the base: 10,000 from the central level (about 7,800 to the villages, Tibet and Sinkiang included), nearly all on production teams and small teams, most outside the staff table and a few within, to return to their offices after two years.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 374 (Dec. 3, 1960). Made public: 1997. Names: Zhou Enlai.'
