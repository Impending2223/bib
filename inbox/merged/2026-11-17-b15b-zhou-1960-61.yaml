- add:
    entry:
      id: cal.1960-01-24.china-leadership-3
      when: Jan. 24
      date: '1960-01-24'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, meeting Ne Win on the way to the state guesthouse: China and Burma, with their long border and many exchanges, should be an example of peaceful coexistence; the boundary talks are near settlement; a principled agreement may come now, the survey and drafting to be left to a joint commission. Ne Win agrees.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281 (Jan. 24, 1960). Made public: 1997. Names: Zhou Enlai, Ne Win.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:ne-win
      - polity:burma
      - vis:only:prc+burma
- add:
    entry:
      id: cal.1960-01-25.china-leadership
      when: Jan. 25–26
      date: '1960-01-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai talks with Ne Win on the boundary. Proposals: the northern undefined sector by the watershed, except Pianma, Gulang, Gangfang and the Dulong valley, then surveyed and marked; the three areas returned to China, their size for a joint commission; the Namwan leased area left to Burma in exchange for the Panghung and Panlao tribes'' lands west of the 1941 line to China; a boundary treaty and a friendship treaty to be drafted by the commission. On Jan. 26, a second talk: the exchange of notes rewritten as an agreement, a friendship treaty drafted.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281–82 (Jan. 25–26, 1960). Made public: 1997. Names: Zhou Enlai, Ne Win.'
      tags:
      - polity:prc
      - polity:burma
      - name:zhou-enlai
      - name:ne-win
      - vis:only:prc+burma
- add:
    entry:
      id: cal.1960-01-25.china-leadership-2
      when: Jan. 25
      date: '1960-01-25'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives the Panchen Lama on his constructive views for the work in Tibet: mutual trust, no listening to troublemakers, a long common work to build a democratic and socialist Tibet; to draw up an agreement for it. The Panchen Lama approves.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 282 (Jan. 25, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-26.china-leadership
      when: Jan. 26
      date: '1960-01-26'
      thread: china-leadership
      c: 'Zhou Enlai receives and gives a dinner for Puyi and his relatives (Zaitao, Zairen and others): Puyi to study and work at a research institute, a three-year plan after a medical check; his book (*My Early Life*) declares war on the old society, the base not yet firm. Soon after, Zhou Enlai and Guo Moruo arrange for him to work at the Academy of Sciences'' botanical garden.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 283 (Jan. 26, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-26.china-leadership-2
      when: Jan. 26
      date: '1960-01-26'
      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: 'Zhou Enlai with Chen Yi sees Chervonenko: surprise at the Soviet "strict neutrality" in the Sino-Indian border dispute; among socialist states one brother attacked by a bourgeois-led country and another neutral is new, and in substance defends India. The Soviet Union should not state the two parties'' differences publicly; China must analyze the Soviet Central Committee''s reply in full; yielding to Nehru will not keep him from turning right.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 283 (Jan. 26, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Chervonenko.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:chen-yi
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1960-01-26.china-leadership-3
      when: Jan. 26
      date: '1960-01-26'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai with Chen Yi sees the Hungarian Ambassador before his departure. Told of China''s fast growth: the responsibility of China within the camp is large, what is done is little, a strong China is still far off.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 284 (Jan. 26, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:hungary
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc+hungary
- add:
    entry:
      id: cal.1960-01-27.china-leadership
      when: Jan. 27
      date: '1960-01-27'
      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: 'Zhou Enlai again, at the Soviet Ambassador''s request, with Chen Yi: the Ambassador says "neutrality" was his own verbal error. Zhou: dropping the word does not change yesterday''s substance; Sino-Soviet differences exist on the Sino-Indian boundary; he proposes the Ambassador report the talks to the Soviet Central Committee.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 284 (Jan. 27, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Chervonenko.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:chen-yi
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1960-01-27.china-leadership-2
      when: Jan. 27
      date: '1960-01-27'
      thread: china-leadership
      c: Zhou Enlai attends the Secretariat's meeting, chiefly on redrawing the plan.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 284 (Jan. 27, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-27.china-leadership-3
      when: Jan. 27
      date: '1960-01-27'
      thread: china-leadership
      also:
      - middle-east
      c: 'Zhou Enlai receives Taraji, the new UAR Ambassador, and his wife: past differences must not touch the two states'' relations; shared colonial legacy of poverty and backwardness; economic independence after political, by long struggle and Asian–African mutual support, the Bandung spirit. The Israeli–Arab conflict and Arab quarrels are made and used by imperialism; China wishes Arab unity.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 284 (Jan. 27, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:uar
      - name:zhou-enlai
      - vis:only:prc+uar
- add:
    entry:
      id: cal.1960-01-28.china-leadership
      when: Jan. 28
      date: '1960-01-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai presides at the State Council''s 95th plenary meeting. It adopts the draft boundary agreement and the draft friendship and nonaggression treaty with Burma, and names Zhou plenipotentiary to sign, for the National People''s Congress Standing Committee to decide. Zhou: the treaty puts the five principles in its articles, a pledge against military alliances aimed at the other, settlement by peaceful consultation; the boundary agreement fixes the undefined sector, returns Gulang, Pianma and Gangfang, takes the Namwan area for the two tribes'' lands, and revises the Kuomintang''s exchange of notes before it is recognized.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 285 (Jan. 28, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-28.china-leadership-2
      when: Jan. 28
      date: '1960-01-28'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, at Ne Win''s farewell banquet: the treaty and the agreement prove that independent Asian and African states can unite in friendship, a model for the rest.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 285 (Jan. 28, 1960). Names: Zhou Enlai, Ne Win.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:ne-win
- add:
    entry:
      id: cal.1960-01-29.china-leadership
      when: Jan. 29
      date: '1960-01-29'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, after the dress rehearsal of *Princess Wencheng*, with the Propaganda Department, the Culture Ministry, the writers'' federation, the nationalities commission, playwrights and historians. Eleven points: national unity and friendship the theme; a historical play may avoid what harms today but may not alter history; Tibet shown at its height, not backward. A five-man group (Zhou Yang, Wang Feng, Yang Hansheng, Wu Han, Tian Han) to revise the script.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 285 (Jan. 29, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-29.china-leadership-2
      when: Jan. 29
      date: '1960-01-29'
      thread: china-leadership
      c: 'Zhou Enlai, hearing the report on Peking''s city plan: the Forbidden City to stay, some of the feudal to be left for later ages; the national theater to go near the Great Hall of the People, so that meeting, meals, receptions and a night at the play are together and fuel is saved; a hotel near the Hall for delegates to the Party Center''s and the National People''s Congress Standing Committee''s meetings.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 286 (Jan. 29, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-30.china-leadership
      when: Jan. 30
      date: '1960-01-30'
      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: 'Zhou Enlai with Chen Yi again to the Soviet Ambassador: the Soviet Central Committee''s leaning to India in the Sino-Indian boundary dispute is wrong; the Sino-Soviet difference is one finger of ten and should not hurt the two parties'' unity. The afternoon before, Zhou at a meeting at Liu Shaoqi''s.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 286 (Jan. 30, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Chervonenko, Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:chen-yi
      - name:chervonenko-stepan-v
      - name:liu-shaoqi
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1960-01-31.china-leadership
      when: Jan. 31
      date: '1960-01-31'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, on the Overseas Chinese Affairs Commission''s report on receiving and settling the returned overseas Chinese from Indonesia: settlement chiefly on state overseas-Chinese farms, the rest home to communes and factories, school and old-age care; the first 60 percent, the others 40.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 286 (Jan. 31, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
