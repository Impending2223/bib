    entry:
      id: cal.1961-06-24.china-leadership
      when: June 24
      date: '1961-06-24'
      thread: china-leadership
      also:
      - economy
      c: Zhou Enlai with the Center's five-man group, the Planning Commission and the Economic Commission on revising the draft Center notice on several questions of cutting workers and staff.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 418 (June 24, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-25.china-leadership-2
      when: June 25
      date: '1961-06-25'
      thread: china-leadership
      also:
      - laos
      - soviet-union
      - vietnam-hanoi
      - china
      c: 'Zhou Enlai had proposed to the Center that Chen Yi return for the Party''s fortieth anniversary, and on the way talk with Gromyko and Phạm Văn Đồng on the conference''s next stage; with the conference changed, he now cables Chen Yi: stay a week more at Geneva; if America shows signs of agreement or insists on a recess, no need to come; if the conference drags on weeks, come back after working on Sihanouk and the three princes.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 418 (June 25, 1961). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:ussr
      - polity:drv
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
