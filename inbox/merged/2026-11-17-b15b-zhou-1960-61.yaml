      when: Jan. 18
      date: '1960-01-18'
      thread: china-leadership
      c: Zhou Enlai back in Peking.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 279 (Jan. 18, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
