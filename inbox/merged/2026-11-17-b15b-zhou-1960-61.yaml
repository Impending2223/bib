      when: July 5
      date: '1961-07-05'
      thread: china-leadership
      also:
      - laos
      - china
      c: 'Zhou Enlai drafts the Center''s cable to Chen Yi answering his of June 25 from Geneva on three points on which concessions may be needed (supervision of arms into Laos; principles to be adopted; stations of supervision in Laos): agreed, to be raised in turn when talking with the Soviet comrades, but not put too firmly, and their differing views heard; the stations need the consent of the Laotian parties concerned and the coalition government, their number not now to be fixed.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 422 (July 5, 1961). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
