      also:
      - economy
      c: 'Zhou Enlai to the Center''s culture and education departments on the 1961 plan: one chessboard for the country; the 500 million peasants the chief object; the Center''s four bars (grain over the barrier in seven years, three-level ownership seven years, distribution by work twenty years, rural labor not moved away five years); no new fads from the ministries; shorten the front; cut the troupes and theaters of the Center''s offices.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 368 (Nov. 14, 1960). Made public: 1997. Names: Zhou Enlai.'
