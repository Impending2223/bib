      - farm
      c: Zhou Enlai presides at the Secretariat, on the first quarter's grain allotment and cotton buying; during the adjustment he requires the grain ministry to send him the grain purchase, sales, allotment and stock tables on time, and works the arithmetic of grain himself (the long "hada table").
      n: '[[w.zhou-enlai-nianpu-1949]], II, 389 (Feb. 4, 1961). Made public: 1997. Names: Zhou Enlai.'
