      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai answers Nehru''s letter of Feb. 5: China holds the border dispute can and must be settled in friendship and peace, and the wish of both for it must not be shaken by passing differences and some unfortunate incidents; China takes a positive and confident view of a meeting of the two premiers, and he will come to India in April.'
