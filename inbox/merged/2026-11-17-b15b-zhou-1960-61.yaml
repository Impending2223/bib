      when: Apr. 14
      date: '1961-04-14'
      thread: china-leadership
      also:
      - conservation
      - china
      c: 'To the botanist Cai Xitao, working in Xishuangbanna: it is a rich and lovely land, and if the forests are destroyed it will become a desert and Communists will be sinners of history whom later generations will blame; study this, solve proper clearing, protect resources, remake nature, be a hero of the people, not a sinner of history.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 404 (Apr. 14, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
