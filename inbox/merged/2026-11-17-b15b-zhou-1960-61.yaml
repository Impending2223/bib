      when: Feb. 28
      date: '1961-02-28'
      thread: china-leadership
      also:
      - soviet-union
      - farm
      - cuba
      c: Zhou Enlai with Chen Yun, Chen Yi, Ye Jizhuang, Yao Yilin and Chen Guodong on Khrushchev's letter to Mao of Feb. 27, which offers a loan of 1 million tons of grain and 500,000 tons of Cuban sugar.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 394 (Feb. 28, 1961). Made public: 1997. Names: Zhou Enlai, Chen Yun, Chen Yi, Mao Zedong, Khrushchev.'
