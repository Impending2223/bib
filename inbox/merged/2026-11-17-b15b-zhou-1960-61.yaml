    entry:
      id: cal.1961-06-25.china-leadership-3
      when: June 25
      date: '1961-06-25'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai receives Utsunomiya Tokuma and other Liberal-Democratic Diet members, hoping Prime Minister Ikeda goes toward Sino-Japanese friendship, China''s keynote: whoever goes against the two peoples'' common will will fail; China receives friends with common aims; communists and liberals differ in position and in many points, but seek common ground, keep differences, stress agreement and shrink differences; equal treatment; the fifty bad years were made by militarism and are to be wiped out by friendship; if the Japanese government means friendship it should value the friendship of two great nations.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 419 (June 25, 1961). Made public: 1997. Names: Zhou Enlai, Ikeda Hayato.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - name:ikeda-hayato
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1961-06-25.china-leadership-4
      when: June 25
      date: '1961-06-25'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives Chervonenko, answering his questions on China''s home work: after two years of disaster and lack of experience the plans for this year and next are to be adjusted together, the last two years of the five-year plan joined. New things inevitably bring rough spots; every thing develops with two sides, victory unattended breeds error, error learned from breeds victory. On twelve years of building: universal truth and general law may be learned from brother countries but particular experience only by one''s own practice.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 419 (June 25, 1961). Made public: 1997. Names: Zhou Enlai, Chervonenko.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
