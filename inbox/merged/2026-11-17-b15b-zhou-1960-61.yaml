      c: Zhou Enlai at the rally for the eleventh anniversary of the Sino-Soviet treaty of friendship, alliance and mutual assistance.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 391 (Feb. 13, 1961). Names: Zhou Enlai.'
