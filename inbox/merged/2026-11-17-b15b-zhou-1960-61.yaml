      c: 'Zhou Enlai''s third talk with the Lao Động delegation. Lê Duẩn asks for China''s experience of people''s communes. Zhou: cooperatives were too small; the peasants themselves proposed communes, wanting "large and public"; the fault was "equalization and transfer"; two years of trial have settled them; heavy industry first with agriculture alongside, the first five-year plan having given agriculture too little notice; Vietnam''s farm and light industry share may be larger than China''s, to accumulate funds and raise living standards.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 318 (May 13, 1960). Made public: 1997. Names: Zhou Enlai, Lê Duẩn.'
