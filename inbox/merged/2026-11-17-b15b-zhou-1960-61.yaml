      - china
      - south-asia
      c: 'Zhou Enlai and Chen Yi talk with U Nu and Ne Win. On India: the dispute will continue; Tibet''s democratic reform under way; China will keep patrols stopped on the boundary if India too wishes it. Of the Burmese boundary: U Nu proposed it, U Ba Swe worked at it, Ne Win opened the way by the agreement, U Nu now signs the treaty. China will always support Burma.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 353 (Sept. 29, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, U Nu, Ne Win.'
