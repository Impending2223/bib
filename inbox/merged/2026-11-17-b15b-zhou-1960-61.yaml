      when: Dec. 31
      date: '1961-12-31'
      thread: china-leadership
      also:
      - soviet-union
      - foreign-aid
      c: 'Zhou Enlai''s talk with Kellezi on aid to Albania: China bears international duty as it can, and would not be a Marxist–Leninist if it kept back what it could give; but with three years'' successive disaster and the Soviet withdrawal of experts, help cannot be as much, as fast, as large or as good as Albania wishes; Albania to prepare two ways, good and bad, and to teach its people to prepare for hard struggle and a long fight.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 447 (Dec. 31, 1961). Made public: 1997. Names: Zhou Enlai.'
