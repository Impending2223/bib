      also:
      - korea
      - china
      c: Zhou Enlai, July 10–15, receives the DPRK Party and government delegation under Kim Il Sung. On the 10th he meets and talks with it with Liu Shaoqi; on the 11th, returning Kim's call, says on building that heavy industry first in China's recovery was needed, for without that base farming cannot be helped; the same day for China he signs the treaty of friendship, cooperation and mutual assistance.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 423 (July 10, 1961). Made public: 1997. Names: Zhou Enlai, Kim Il Sung, Liu Shaoqi.'
