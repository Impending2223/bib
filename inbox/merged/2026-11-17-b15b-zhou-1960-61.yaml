      c: Zhou Enlai revises the State Economic Commission Party group's report on September's coal allotment and views on the fourth quarter's, and settles the Center's comment, adding that regions are to strive to exceed output and carry stocked coal beyond plan, part of the excess to smelting coal for steel varieties and non-ferrous metals; stress on better coal for industry, farming and the market; mine committees to strengthen management and the supervision of equipment and material supply. Market coal can and should be saved.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 431 (Sept. 14, 1961). Made public: 1997. Names: Zhou Enlai.'
