      date: '1960-04-25'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai''s seventh talk with Nehru, on India''s draft of a joint statement. Zhou: the draft is not very satisfactory, but Nehru having proposed and insisted on it, he will take it home and persuade his colleagues; officials of both sides to settle the wording, a further meeting if they argue seriously.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 313 (Apr. 25, 1960). Made public: 1997. Names: Zhou Enlai, Nehru.'
