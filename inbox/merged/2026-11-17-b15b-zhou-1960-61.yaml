      c: Zhou Enlai presides at the capital's meeting for the 50th anniversary of the 1911 Revolution and opens it, paying respect to Sun Yat-sen and the pioneers. The Revolution overthrew the Qing, ended over two thousand years of monarchy, freed minds and opened the way, but was incomplete, leaving anti-imperialist and anti-feudal tasks; the bourgeois republic could not work in China. Under the Communist Party the people won the democratic revolution entire; he calls for greater unity of all nationalities and peoples.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 438 (Oct. 9, 1961). Names: Zhou Enlai.'
