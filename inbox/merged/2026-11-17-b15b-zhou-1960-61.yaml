      thread: china-leadership
      also:
      - china
      c: Zhou Enlai goes to Peking Hospital to see Tan Kah Kee's body placed in the coffin (Tan died Aug. 12; Zhou chairs the funeral committee); on the 15th he takes the chief part at the capital's public memorial and himself sees the coffin to the hearse.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 427 (Aug. 14, 1961). Made public: 1997. Names: Zhou Enlai.'
