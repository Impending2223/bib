      also:
      - china
      c: 'Zhou Enlai to Koirala, on his letter of July 11 about Chinese troops seen on the border: another full inquiry shows no Chinese armed force operated within ten kilometers of the border after midnight July 2; civil officials sent in late June to the Nara pass, Ru, Rejiao bridge and Jimatang for the boundary commission''s work were probably taken for troops. Of the five Nepalese reported missing at Namula: in the recent action four times twelve Nepalese in all were briefly held in Chinese territory near the border, well treated, their goods returned and some food given.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 334 (July 23, 1960). Made public: 1997. Names: Zhou Enlai, Koirala.'
