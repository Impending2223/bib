      c: Zhou Enlai gives a television interview to Felix Greene, British reporter. China does not want war with the United States, whose people it wishes friendship with, but its government pursues aggression and the Chinese must guard and build their defense; while America holds Taiwan relations cannot basically improve. Taiwan an inseparable part of China, its liberation China's internal affair; America must withdraw all forces from Taiwan and the Strait. Sino-British relations lag because Britain follows America at the United Nations in backing Chiang; with that removed, relations, trade and culture would improve.
