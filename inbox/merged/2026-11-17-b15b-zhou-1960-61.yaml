    entry:
      id: cal.1960-01-12.china-leadership-2
      when: Jan. 12
      date: '1960-01-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai to Ne Win, by letter: if Ne Win can visit China soon, China will state its position on the boundary question and talk, on principle, about removing the differences between the two sides.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 278 (Jan. 12, 1960). Made public: 1997. Names: Zhou Enlai, Ne Win.'
      tags:
      - polity:prc
      - polity:burma
      - name:zhou-enlai
      - name:ne-win
      - vis:only:prc+burma
- add:
    entry:
      id: cal.1960-01-13.china-leadership-2
      when: Jan. 13
      date: '1960-01-13'
      thread: china-leadership
      c: 'Zhou Enlai, at his residence''s shop, sees a Shanghai-brand pen with a gold cap and has it checked: gold is scarce and wanted by industry, why is it going into pen caps? He will tell Li Xiannian to give no more gold next time.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 278 (Jan. 13, 1960). Made public: 1997. Names: Zhou Enlai, Li Xiannian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:li-xiannian
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-15.china-leadership
      when: Jan. 15
      date: '1960-01-15'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai on Nie Rongzhen''s report to him, Deng Xiaoping and the Secretariat: in Sino-Soviet scientific cooperation this year the Soviet side asks for markedly more, and for new technology where it used to ask for medicine, handicrafts and rapeseed. Zhou''s comment: nothing still in research or trial production and not yet fixed is to be undertaken; better a lower percentage than a forced promise.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 278 (Jan. 15, 1960). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping, Nie Rongzhen.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:nie-rongzhen
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-16.china-leadership
      when: Jan. 16
      date: '1960-01-16'
      thread: china-leadership
      also:
      - defense
      c: 'Zhou Enlai on He Long''s report to the Center and Mao on the 1960–62 defense industry plan: breakthrough in the advanced weapons in three years, basic completion in five, independence in eight. Zhou''s comment: agreed in principle; after the Military Commission''s enlarged meeting, He Long, Nie Rongzhen, Li Fuchun, Bo Yibo, Zhao Erlu and others to review and assign; the first step, 1.33 billion yuan for forty-one projects in 1960, already in the plan. He asks Mao''s ruling; Mao writes "read".'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 278 (Jan. 16, 1960). Made public: 1997. Names: Zhou Enlai, He Long, Mao Zedong, Nie Rongzhen, Li Fuchun, Bo Yibo, Zhao Erlu.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:he-long
      - name:mao-zedong
      - name:nie-rongzhen
      - name:li-fuchun
      - name:bo-yibo
      - name:zhao-erlu
      - vis:only:prc
