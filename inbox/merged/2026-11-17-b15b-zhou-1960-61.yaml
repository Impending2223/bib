      when: Oct. 29
      date: '1960-10-29'
      thread: china-leadership
      c: Zhou Enlai with Guo Moruo and Xia Yan attends the Peking concert for the 25th anniversary of Nie Er's death and the 15th of Xian Xinghai's.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 364 (Oct. 29, 1960). Names: Zhou Enlai.'
