      date: '1960-11-11'
      thread: china-leadership
      also:
      - china
      c: 'At the Central Nationalities Song and Dance Ensemble''s report performance after its tour abroad, Zhou Enlai tells the artists: performances abroad need new quality and themes; new items with new thought in artistic form; good items kept, not dropped for novelty; classical items still, modern at least half; the Eighth Route Army''s lively style; dance of the nationalities to keep its style; scientific rigor joined to revolutionary spirit; work, study and life arranged, labor with rest; cultural work to shorten its front.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 367 (Nov. 11, 1960). Made public: 1997. Names: Zhou Enlai.'
