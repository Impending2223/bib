      c: 'Zhou Enlai, on a letter from Huang Shilin of Peking that the national industrial exhibition, three years running, shows many machines and uses many staff: the important equipment to be returned to the ministries'' enterprises to install and run, staff cut sharply, only needed custodians kept.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 377 (Dec. 6, 1960). Made public: 1997. Names: Zhou Enlai.'
