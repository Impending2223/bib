      c: 'Zhou Enlai receives Sweden''s new Ambassador, opposing the new American plot on China''s seat at the United Nations: China would rather see the question beaten as an agenda matter by a minority vote than allowed as an "important question" with a committee to discuss it, which would insult the Chinese people; not entering the United Nations does not matter, China can wait.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 434 (Sept. 22, 1961). Made public: 1997. Names: Zhou Enlai.'
