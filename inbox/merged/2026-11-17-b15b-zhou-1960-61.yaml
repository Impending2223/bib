      - trade
      - cuba
      c: 'Zhou Enlai, for the Center, answers orally to Chervonenko Khrushchev''s letter of Feb. 27 to Mao offering grain and Cuban sugar on credit. In face of the grain shortage China first mobilizes its own strength, then buys more on deferred payment from the world market, so the Soviet offer would be held in reserve and asked for only if purchases fail. On 500,000 tons of Cuban sugar: if not urgent for the Soviet market, China would accept this aid.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 397 (Mar. 8, 1961). Made public: 1997. Names: Zhou Enlai, Chervonenko, Khrushchev, Mao Zedong.'
