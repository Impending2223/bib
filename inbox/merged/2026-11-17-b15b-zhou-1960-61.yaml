      when: Oct. 26
      date: '1960-10-26'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - china
      c: 'Zhou Enlai to Phạm Văn Đồng: to help the common rise of both countries'' socialist building, the Chinese government agrees to Vietnam''s request for a loan of 600 million renminbi for Vietnam''s first five-year plan, 1961–65.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 362 (Oct. 26, 1960). Made public: 1997. Names: Zhou Enlai, Phạm Văn Đồng.'
      tags:
      - polity:prc
