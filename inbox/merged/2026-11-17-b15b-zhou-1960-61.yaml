      date: '1960-12-02'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai at the Center''s report meeting, "The whole Party mobilizes to save grain and steel": the situation good in the main, the difficulties temporary and partial, from natural disaster, lack of experience and faults of policy and style. Steel: the 18.4 million tons the National People''s Congress passed to be passed by a margin, 18.5 to 18.6 million assured, for political effect and next year''s output.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 374 (Dec. 2, 1960). Made public: 1997. Names: Zhou Enlai.'
