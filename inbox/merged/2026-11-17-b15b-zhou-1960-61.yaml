      c: 'Zhou Enlai''s talk with Phạm Văn Đồng, who describes Vietnam since peace and its socialist transformation in the North, and asks China for a loan of 500 million yuan for the five-year plan. Zhou: Vietnam has a base and can grow faster; two problems, socialist transformation and remolding, on which China will share its experience; beyond the forty projects under way other projects (railways to broad gauge among them) may be talked over; 500 million is little.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 316 (May 11, 1960). Made public: 1997. Names: Zhou Enlai, Phạm Văn Đồng.'
