      thread: china-leadership
      also:
      - economy
      c: 'At the Secretariat, after Gu Mu''s report on industrial output, Zhou Enlai: the 18.4 million tons of steel must at least be made, with about 19 million held inside; leave room, narrow the gap; past ministries left no room and pushed the gap down to others, which will not do. He also speaks on the handling of Soviet-nationality cadres of dual citizenship in Sinkiang.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 359 (Oct. 21, 1960). Made public: 1997. Names: Zhou Enlai.'
