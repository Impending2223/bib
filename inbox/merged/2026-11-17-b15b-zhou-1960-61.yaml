      date: '1961-02-20'
      thread: china-leadership
      also:
      - economy
      c: Zhou Enlai at the enlarged Standing Committee Liu Shaoqi chairs, on farm and industrial output, reporting the plan for adjusting capital construction in the first quarter; before this he twice held capital construction conferences on the plan.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 392 (Feb. 20, 1961). Made public: 1997. Names: Zhou Enlai, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:liu-shaoqi
      - vis:only:prc
