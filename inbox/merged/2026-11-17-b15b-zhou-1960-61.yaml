      - polity:prc
      - polity:congo
      - name:zhou-enlai
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1961-02-15.china-leadership
      when: Feb. 15
      date: '1961-02-15'
      thread: china-leadership
      also:
      - soviet-union
      - europe-and-the-alliance-federal-republic
      c: 'Zhou Enlai receives the East German Ambassador: each socialist state has its difficulties and its strengths, but a common truth is first to rely on oneself and then on brother states; the two parties should keep up an ethic of hard struggle, hardship first, pleasure after, Communists in front in difficulty. China''s difficulty: last year''s grain, cotton and light-industry raw materials fell, affecting light and heavy industry; the next two years'' line is adjusting, consolidating, filling out, raising; long-term trade cannot grow in the next two years, after two or three years mutual aid may be strengthened.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 391 (Feb. 15, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:gdr
      - name:zhou-enlai
      - vis:only:prc+gdr
- add:
    entry:
