      c: At the Congress Zhou Enlai speaks and reads the greeting signed by Mao. The unity of the socialist camp and the world communist movement is a communists' internationalist duty; disputes between brother parties to be settled patiently on equality and consultation; one-sided charges against any brother party do not help, and exposing disputes before the enemy only pains friends and pleases foes. China hopes parties in dispute unite again on Marxism–Leninism and mutual respect of independence and equality.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 440 (Oct. 19, 1961). Names: Zhou Enlai, Mao Zedong.'
      tags:
