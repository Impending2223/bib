- add:
    entry:
      id: cal.1960-10-31.china-leadership
      when: Oct. 31
      date: '1960-10-31'
      thread: china-leadership
      also:
      - farm
      c: 'Zhou Enlai revises the Center''s draft instruction on carrying out the urgent directive letter: the key is the thinking of cadres, above all the heads of county and commune; the departments to examine their own work, and no more "communist wind," bragging wind and commanding wind from subjectivism and bureaucracy. For the order of conveying it he adds that among those called first, county and prefecture secretaries, some with differing views be sought on purpose; likewise at the meeting of production-team heads and up.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 364 (Oct. 31, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
