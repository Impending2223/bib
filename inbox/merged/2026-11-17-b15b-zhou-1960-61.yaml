      when: Apr. 17
      date: '1960-04-17'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai''s first talk with U Nu. On the boundary: the sides have come close, only the size of areas remains. Measures: several survey teams for the northern sector; the people of Pianma, Gulang and Gangfang to mix with those east of the watershed before demarcation; surveys of the 1941 line, with the Panghung and Panlao lands to China; exchange of land farmed across the line; marker posts on the settled middle and southern sectors. Trade also discussed.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 304 (Apr. 17, 1960). Made public: 1997. Names: Zhou Enlai, U Nu.'
      tags:
      - polity:prc
      - polity:burma
