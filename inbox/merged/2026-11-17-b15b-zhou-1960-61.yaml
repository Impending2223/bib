      id: cal.1960-10-23.china-leadership-5
      when: Oct. 23
      date: '1960-10-23'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai, seeing gifts sent upward, mass welcomes for visiting leaders and too many meetings, reports to the Secretariat and has Xi Zhongxun and Qi Yanming draft the Center''s notice: no gifts between units or to persons; no welcomes or send-offs for leaders; meetings cut; no new guesthouses or non-productive buildings for seven years. He adds to it and sends it to Li Fuchun to issue and to Mao, Liu, Chen Yi, Tan Zhenlin and Li Xiannian to read. Issued Nov. 3.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 360 (Oct. 23, 1960). Made public: 1997. Names: Zhou Enlai, Li Fuchun, Mao Zedong, Liu Shaoqi.'
      tags:
      - polity:prc
