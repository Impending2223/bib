      date: '1961-02-14'
      thread: china-leadership
      also:
      - congo
      - china
      c: 'Zhou Enlai cables Gizenga, Deputy Premier, mourning the murder of Premier Lumumba and praising him highly: the Chinese government and people stand with the Congolese people always.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 391 (Feb. 14, 1961). Made public: 1997. Names: Zhou Enlai, Gizenga, Lumumba.'
