    entry:
      id: cal.1961-02-13.china-leadership
      when: Feb. 13
      date: '1961-02-13'
      thread: china-leadership
      also:
      - soviet-union
      c: Zhou Enlai receives the Soviet–Chinese Friendship Association and four Soviet delegations (economic, science and technology, trade, trade union). Because of last year's grain shortfall, fuel too is a problem and industrial raw materials short; "agriculture is the base of the whole national economy" is quite right.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 391 (Feb. 13, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - vis:only:prc+ussr
