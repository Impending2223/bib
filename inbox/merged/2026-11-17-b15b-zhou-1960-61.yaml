      date: '1960-11-18'
      thread: china-leadership
      also:
      - cuba
      - latin-america
      - trade
      c: 'Zhou Enlai receives the economic delegation of the Cuban revolutionary government and describes China''s output and trade: its base very backward and its pace since three years quicker but far short of needs; some farm and mineral products and a few industrial goods must be exported for machinery. Last year''s disaster and this year''s grain 30 percent under plan, so trade with the Soviet Union and Eastern Europe cannot follow contract; but friends worse off will be helped. China wants peace for building.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 370 (Nov. 18, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
