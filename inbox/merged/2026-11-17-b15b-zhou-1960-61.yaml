      when: Apr. 20
      date: '1960-04-20'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai''s first talk with Nehru, in the morning; chiefly Nehru''s statement of India''s view: the boundary peaceful for long and definite, the trouble from events on China''s side.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 307 (Apr. 20, 1960). Made public: 1997. Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-20.china-leadership-4
      when: Apr. 20
      date: '1960-04-20'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai with Krishna Menon, India''s Defense Minister, in the afternoon. The Dalai Lama''s following in India asks Tibet''s independence from Indian soil, interference in China''s affairs. The boundary question arises from India''s wish that China recognize the Simla treaty of 1914, which no Chinese central government recognized; the western alignment long standing. Each side''s troops to withdraw some kilometers. Menon: China has entered India; Zhou denies it.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 307 (Apr. 20, 1960). Made public: 1997. Names: Zhou Enlai, Menon.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:menon-v-k-krishna
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-20.china-leadership-5
      when: Apr. 20
      date: '1960-04-20'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai's second talk with Nehru. Whether the boundary is delimited; China does not wish to recognize the McMahon line but takes a realistic view; the area south of it belonged to Tibet's local government, a traditional customary line existed once and was changed; China asks the status quo, not territory. In the west the claim is India's. Both could keep the status quo and separate their forces, toward a boundary that is lasting.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 308 (Apr. 20, 1960). Made public: 1997. Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-20.china-leadership-6
      when: Apr. 20
      date: '1960-04-20'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai at Nehru''s banquet: if both sides keep in mind the long interest of friendship, the history and the facts on the ground, and the five principles, the boundary can be settled fairly.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 308 (Apr. 20, 1960). Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:nehru-jawaharlal
