      when: Mar. 29
      date: '1960-03-29'
      thread: china-leadership
      c: 'Zhou Enlai sends a letter from "a member of the Political Consultative Conference who does not wish to give his name" to Zeng Xisheng, Party first secretary of Anhui: famine in Hexian''s Tongchengzha and Wuwei county, deaths from hunger, peasants fled, cadres'' bad conduct. Zhou: to send people to both counties to look; it may be true or exaggerated, but such cases exist in every province, above all in last year''s disaster areas; Mao has stressed this on the Shandong six-level cadres'' conference papers; Zeng to reply.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 299 (Mar. 29, 1960). Made public: 1997. To check: Mao''s comment of Mar. 22, 1960, on the Shandong six-level cadres'' conference papers (the chronology''s note, p. 299 n.). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
