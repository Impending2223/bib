      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai, Dec. 12–14, holds the State Council''s standing meeting with the vice-premiers and group heads to dissect what went wrong since the Leap. Half the mistakes from lack of experience; change lies in leadership and decision; after years of high targets, a try at low ones, to be owned as error if too low; lowering speed next year a planned "saddle," not a passive step; more than a third of the errors human. Eight-character line: adjustment to enlarge reproduction better, consolidation to advance again, filling out to complete sets; the task a tense one, active, orderly, planned.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 379 (Dec. 12, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
