      when: Oct. 25
      date: '1960-10-25'
      thread: china-leadership
      also:
      - farm
      c: 'Zhou Enlai, hearing that Mao asks about the shifting of labor to the farm front, sends him the bulletin of the Center''s five-man group with a letter: its three figures (21.35 million to farming, 1.81 million to the countryside, 510,000 cadres down) are far from the first target of five million moved from town to country; the 21.35 million may in some provinces be plan, not done; he will raise it at this provincial secretaries'' meeting.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 362 (Oct. 25, 1960). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc
