      date: '1961-09-15'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai sends Mao the State Economic Commission''s report and the Center''s comment, with a letter telling how the Secretariat adopted them: to reach the grain and cotton targets, support for farming must go from now to the areas of most commodity grain and cotton; back in Peking he will press the two jobs of key adjustment of coal output and key support for farming. Mao: "read, very good, send out as is."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 432 (Sept. 15, 1961). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
