- add:
    entry:
      id: cal.1961-06-06.china-leadership
      when: June 6
      date: '1961-06-06'
      thread: china-leadership
      also:
      - congo
      - china
      c: 'Zhou Enlai receives the Congo''s Ambassador (Diaka Beinadun in the chronology''s transliteration) on his government''s proposal to reconvene Parliament with the United Nations'' help: grounds for it, but the United Nations will not let Gizenga''s government rule, so only a slogan; the chief matter to widen that government''s influence and rouse the people against interference and partition, by long struggle on their own strength.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 414 (June 6, 1961). Made public: 1997. Names: Zhou Enlai, Gizenga.'
      tags:
      - polity:prc
      - polity:congo
      - name:zhou-enlai
      - name:gizenga-antoine
      - vis:only:prc+congo
- add:
    entry:
      id: cal.1961-06-07.china-leadership-2
      when: June 7
      date: '1961-06-07'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with Xu Bing, Fu Zuoyi and others on Taiwan: China will liberate Taiwan but can wait; so long as the authorities hold Taiwan and do not let it split from China, China will not change its present relation with them and can wait for a third Kuomintang–Communist cooperation; no room for "two Chinas," "one and a half Chinas," "Taiwan independence" or "trusteeship."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 414 (June 7, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:roc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-08.china-leadership-3
      when: June 8
      date: '1961-06-08'
      thread: china-leadership
      also:
      - china
      c: 'At a performance of *Thunderstorm* by the Peking People''s Art Theater, Zhou Enlai afterward talks with Xia Yan, Cao Yu and the director and players: such plays should teach youth to see the evil of the old society and hate its ideology, beware reaction''s return, and not lower the quality to meet a task; "more, faster, better, cheaper" to be taken whole, for aiming at "more and faster" forgets "better and cheaper," and in the Leap years targets set high sometimes harmed quality.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 415 (June 8, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-09.china-leadership
      when: June 9
      date: '1961-06-09'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives Albania''s Ambassador: building socialism is complex and hard and has no precedent; Soviet experience may be studied but conditions differ and each must feel its own way; the road one has walked is the surest; any work comes right only through practice; contradiction is the motive of things.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 415 (June 9, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:albania
      - polity:ussr
      - name:zhou-enlai
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1961-06-09.china-leadership-2
      when: June 9
      date: '1961-06-09'
      thread: china-leadership
      also:
      - europe-and-the-alliance-federal-republic
      - japan
      c: 'Zhou Enlai receives the East German Ambassador, Johann Hegen, on the foreign policy of the Kennedy administration and the revival of West German and Japanese militarism: China''s policy is to strengthen the unity and force of the socialist camp, hold position, use imperialist contradictions flexibly, and firmly support Asian and African national independence movements and every anti-imperialist and peace force.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 415 (June 9, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:gdr
      - name:zhou-enlai
      - vis:only:prc+gdr
- add:
    entry:
      id: cal.1961-06-10.china-leadership
      when: June 10
      date: '1961-06-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai receives Puyi, Pujie, Hiro and others of the family. The Communist Party''s attitude: "treat people as equals, share what one has; all within the four seas are brothers." On Japan: militarism harmed China from 1894 to 1945 but that is past; look ahead, restore relations, widen exchange. On nationalities: the Manchu''s proper place to be restored, assimilation to come by itself, not by force. He welcomes and encourages Hiro''s resolve to be Chinese and work for Sino-Japanese friendship.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 415 (June 10, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-10.china-leadership-2
      when: June 10
      date: '1961-06-10'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai takes Deng Yingchao to Peking Union Hospital for treatment and, until the 20th, spares time each day to visit her and consult the doctors. After her operation he invites, at his own cost, the Chinese and Western specialists, nurses, health and lab staff and medical heads to a meal to show respect and thanks, telling them health care should be reasonable and not privileged; at the photograph he seats an old Chinese physician in front: "you are our teacher."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 416 (June 10, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-12.china-leadership-2
      when: June 12
      date: '1961-06-12'
      thread: china-leadership
      also:
      - farm
      c: 'At the Central Work Conference Zhou Enlai explains again the revised "Nine measures on grain": the title to read "The Central Work Conference''s nine measures to reduce the town population and cut town grain sales"; he adds "increase village labor, develop the village economy" to the three lines, and "cut the town population by over 20 million in three years, at least 10 million this year," and "for the next three to five years low standard, vegetables and melons for grain." The conference adopts them; the Center issues them June 16.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 416 (June 12, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-12.china-leadership-3
      when: June 12–16
      date: '1961-06-12'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - china
      c: 'Zhou Enlai, June 12–16, receives Phạm Văn Đồng, Premier of the DRV. At the welcome banquet on the 12th: the American government''s and Ngô Đình Diệm clique''s "eight measures" to control and enslave South Vietnam are a plan for a war adventure there; the Chinese government and people cannot be indifferent to the worsening situation. After the talks the two premiers'' joint communiqué of the 15th holds America''s "position of strength" and neo-colonial policy to be the chief threat to peace and source of tension and repeats that disputes be settled by peaceful negotiation.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 416 (June 12, 1961). Made public: 1997. Names: Zhou Enlai, Phạm Văn Đồng.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:pham-van-dong
      - vis:only:prc+drv
- add:
    entry:
