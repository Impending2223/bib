      when: Feb. 2
      date: '1961-02-02'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai revises and approves the Railway Ministry''s Party group''s report on setting up political departments in the railway system and improving its management: the ministry''s new political department means its Party group should become a Party committee, to lead the department and the Party committees at each level; with Liu Shaoqi''s assent.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 389 (Feb. 2, 1961). Made public: 1997. Names: Zhou Enlai, Peng Zhen, Liu Shaoqi.'
