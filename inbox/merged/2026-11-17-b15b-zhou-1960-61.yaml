      c: 'Zhou Enlai''s marginal notes on the report of Wang Dong, China''s chargé in Albania, of July 21: Mehmet Shehu, Chairman of the Council of Ministers, asked a further 50,000 tons of wheat this year, gave the Albanian party''s view of the Sino-Soviet differences, and raised the Albanian–Polish matter. Zhou, beside the first: Li Xiannian told to ship it in the third and fourth quarters, as a long-term loan, with Western ships chartered.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 335 (July 26, 1960). Made public: 1997. Names: Zhou Enlai, Li Xiannian.'
