      id: cal.1960-10-18.china-leadership
      when: Oct. 18
      date: '1960-10-18'
      thread: china-leadership
      also:
      - china
      - japan
      - south-asia
      c: 'Zhou Enlai receives Edgar Snow. Sino-American relations need two preconditions: all disputes settled peacefully, not by force; America to acknowledge Taiwan as Chinese and withdraw all forces from it and the Strait. Disarmament: no agreement without China''s signature binds it. India: status quo and friendly settlement; China does not cross the McMahon line, which it does not recognize.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 358 (Oct. 18, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:us
      - name:zhou-enlai
      - vis:only:prc+us
