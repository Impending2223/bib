      when: Feb. 19
      date: '1961-02-19'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai at the symposium of the People's Political Consultative Conference's committee on literary and historical materials and some of the Central Institute of Literature and History, urging them to write more.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 392 (Feb. 19, 1961). Names: Zhou Enlai.'
