      c: Zhou Enlai with He Long, Xi Zhongxun and others talks with Ngapoi Ngawang Jigme. Rebels in the Chamdo area to be wiped out; Tibet's democratic reform going well; mutual-aid groups and joint groups kept for a time, no hurry to cooperatives or the inland way; stability, water works, manure; some monks back to lay life, others may marry; more people and output, farming first; Han–Tibetan unity the key, Han against great-Han chauvinism and Tibetans against local nationalism.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 346 (Aug. 31, 1960). Made public: 1997. Names: Zhou Enlai, He Long.'
