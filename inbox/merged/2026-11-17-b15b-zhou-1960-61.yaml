      c: 'Zhou Enlai and Koirala sign the boundary agreement, the economic aid agreement and a joint communiqué. Aid: 100 million Indian rupees over three years without political conditions; China proposes a treaty of peace and friendship, to be discussed and signed on Zhou''s visit to Nepal; embassies to be exchanged at Peking and Katmandu.'
