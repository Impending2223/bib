      - china
      c: Zhou Enlai, told that after the American President's envoy obstructed, King Savang Vatthana opposed any international conference on Laos, so that Sihanouk on May 1 at Vientiane withdrew his proposal for a fourteen-nation conference and cancelled the Geneva trip, returns to Peking and at once presides over study of the plan for the Chinese delegation to the Geneva conference.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 408 (May 2, 1961). Made public: 1997. Names: Zhou Enlai, Sihanouk.'
