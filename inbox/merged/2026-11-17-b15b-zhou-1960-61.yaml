      c: 'At the enlarged plenary meetings of the central committees of six democratic parties (the Kuomintang Revolutionary Committee, the Democratic League, the Democratic Construction Association, the Peasants'' and Workers'' Democratic Party, the Zhi Gong Party and the Jiusan Society), Zhou Enlai reports on Sino-Soviet relations since the 20th Congress: the differences on Stalin, on war and on peaceful transition are of Marxist–Leninist principle, yet partial as to the two parties, two states and the camp. The banner is Marxism–Leninism; the slogans, hold position, hold principle, hold unity.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 342 (Aug. 24, 1960). Made public: 1997. Names: Zhou Enlai.'
