      c: 'Zhou Enlai, July 17–23, with the departments on steel, market, culture and education and foreign trade. On Shanghai''s foreign trade: Shanghai has capacity; the State needs foreign exchange for grain imports, so Shanghai can export more; raw materials it cannot supply the Center can help; foreign trade work flexible, not too tight; train new trade staff.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 424 (July 17, 1961). Made public: 1997. Names: Zhou Enlai.'
