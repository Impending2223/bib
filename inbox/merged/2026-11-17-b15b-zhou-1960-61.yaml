      c: At the Mongolian Ambassador's reception for the 40th anniversary of the Mongolian People's Revolution Zhou Enlai says that the Chinese people have always prized the friendship and unity of the two parties and states and count strengthening the unity of the socialist camp and the international communist movement their highest internationalist duty.
