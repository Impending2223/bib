      c: Zhou Enlai with Shu Tong, Li Baohua and Tan Zhenlin on Shandong's water conservancy.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 279 (Jan. 17, 1960). Made public: 1997. Names: Zhou Enlai, Tan Zhenlin.'
