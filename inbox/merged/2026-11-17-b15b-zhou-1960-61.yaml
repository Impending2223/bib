      when: Feb. 11
      date: '1961-02-11'
      thread: china-leadership
      also:
      - laos
      c: 'Zhou Enlai, told that Sihanouk''s proposal of a widened Geneva conference has won more states'' support, writes to him: China holds that if non-interference in Laos and respect for its unity and territorial integrity are truly kept by the states concerned, that will help an international conference and a peaceful settlement of the Laotian question.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 390 (Feb. 11, 1961). Made public: 1997. Names: Zhou Enlai, Sihanouk.'
      tags:
      - polity:prc
      - polity:cambodia
      - name:zhou-enlai
      - name:norodom-sihanouk
      - vis:only:prc+cambodia
