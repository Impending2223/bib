      c: 'Zhou Enlai at Wuhan receives the delegation of the Algerian Provisional Government under Krim Belkacem, Vice Premier and Foreign Minister: unity of peoples, of working people and of the oppressed the main task against imperialism. Advice: the broadest national united front, since not every one of the million French in Algeria is hostile; political work among captured French soldiers, who are often forced to fight, to be sent back with rations to break the enemy; the army to arm itself from the enemy; talks as one means, armed strength never weakened. Self-reliance as the chief course, which China admires.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 319 (May 16, 1960). Made public: 1997. Names: Zhou Enlai.'
