      when: Apr. 17
      date: '1960-04-17'
      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: 'Zhou Enlai receives the Soviet Ambassador to Burma, Ledovsky, and gives China''s stand in the talks with India: China sincerely wants a settlement, but it takes both sides; so far India, Nehru included, shows no will to settle.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 304 (Apr. 17, 1960). Made public: 1997. Names: Zhou Enlai.'
