      c: 'Zhou Enlai, Feb. 26–Mar. 2, reads the textbook on. At the summing-up, Mar. 2: Soviet experience not to be copied; Stalin''s three successes each one-sided; Lenin to be learned from, not Stalin''s late years; Khrushchev against Stalin has taken the other road; two large faults in the textbook, on the Moscow Declaration''s nine laws and on the 21st Congress''s nine-point program.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 290 (Feb. 26, 1960). Made public: 1997. Names: Zhou Enlai.'
