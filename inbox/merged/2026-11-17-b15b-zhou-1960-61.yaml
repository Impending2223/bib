      when: Mar. 1
      date: '1961-03-01'
      thread: china-leadership
      also:
      - farm
      c: 'Zhou Enlai settles the Center''s comment forwarding the Liaoning light industry office''s report on making artificial meat extract: grain and light industry ministries to set up factories as in Liaoning; in the southern provinces, now spring, to press substitute foods, adding chlorella leaf-egg and others to the plans.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 395 (Mar. 1, 1961). Made public: 1997. Names: Zhou Enlai.'
