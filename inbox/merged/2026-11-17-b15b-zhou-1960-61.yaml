      when: Aug. 14–19
      date: '1961-08-14'
      thread: china-leadership
      also:
      - africa
      - china
      c: 'Zhou Enlai, Aug. 14–19, receives Kwame Nkrumah, President of Ghana. On the 14th with Liu Shaoqi: Sun Yat-sen found the thorough road only by working with the Communists; the Congolese people will win. On the 15th he returns the call and tells of the communes and the grain shortage. Aug. 16–18 with Nkrumah to Hangzhou and Shanghai; on the flight home he advises farming and light industry alongside heavy.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 427 (Aug. 14, 1961). Made public: 1997. Names: Zhou Enlai, Nkrumah, Liu Shaoqi.'
      tags:
      - polity:prc
      - polity:ghana
      - name:zhou-enlai
      - name:nkrumah-kwame
      - name:liu-shaoqi
      - vis:only:prc+ghana
