      when: Apr. 24
      date: '1960-04-24'
      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: 'Zhou Enlai with Chen Yi receives Benediktov, the Soviet Ambassador to India, and describes the talks: the five points offered, Nehru neither agreeing nor disagreeing, his refusal of a joint commission, China''s proposal of working groups of equal numbers of officials to examine documents, records and maps, on which views are being exchanged.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 312 (Apr. 24, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Benediktov.'
