      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai reports to delegates of seven conferences (the metallurgical mine heads'' meeting among them) on the international and domestic situation, summing up past years'' lessons and tasks: first repair and complete sets, then make; stress economic accounting and effect, fewer losses, more accumulation, obey command.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 421 (July 2, 1961). Made public: 1997. Names: Zhou Enlai.'
