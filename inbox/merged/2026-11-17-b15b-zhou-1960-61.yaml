      c: 'Zhou Enlai cables Khrushchev on learning the Soviet Union has launched the first manned spaceship, Vostok, which returned safely: an achievement opening a new epoch of man''s climb to other bodies and turning man''s lovely fancy of space flight into fact.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 404 (Apr. 11, 1961). Names: Zhou Enlai, Khrushchev.'
