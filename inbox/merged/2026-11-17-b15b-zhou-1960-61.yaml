      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the welcome banquet for U Nu and his wife and General Ne Win and his wife, in China for the signing of the boundary treaty: this year''s friendship has reached a new stage, the friendship and nonaggression treaty and the boundary agreement signed, and now the boundary treaty, a full and final settlement of the question left by history.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 352 (Sept. 28, 1960). Names: Zhou Enlai, U Nu, Ne Win.'
      tags:
      - polity:prc
      - polity:burma
