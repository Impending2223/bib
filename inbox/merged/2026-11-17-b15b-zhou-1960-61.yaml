      id: cal.1961-05-24.china-leadership
      when: May 24
      date: '1961-05-24'
      thread: china-leadership
      also:
      - cuba
      - latin-america
      c: 'Zhou Enlai receives a Cuban land-reform work team: farm problems are of organizing production, the small farm economy reflects the petty bourgeoisie; whether land reform, mutual-aid groups or co-ops, many steps and time are needed to organize small private farming; by the peasants'' needs, to local conditions, no compulsion, leading them; command and forced uniformity bring little result.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 412 (May 24, 1961). Made public: 1997. Names: Zhou Enlai.'
