- add:
    entry:
      id: cal.1961-08-12.china-leadership
      when: Aug. 12
      date: '1961-08-12'
      thread: china-leadership
      also:
      - defense
      c: 'At the National Defense Industry Commission on developing China''s atomic energy industry: science and advanced techniques go in order, no leap into heaven; climb on a base, in stages, like Mount Everest. Conventional arms are the base of the advanced; make the carrier before the warhead, range from near to far; hold the advanced weapons work in this mobilization with no slackening. China is large, revolution and building by itself, today and always; the whole economy self-reliant, a strategic matter, but reached by a process.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 426 (Aug. 12, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
