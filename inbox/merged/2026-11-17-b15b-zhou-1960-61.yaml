      c: 'Zhou Enlai leaves Peking for Burma, Chen Yi and his wife, Luo Ruiqing and his wife with him. Before boarding he agrees with Chen Yun and Ye Jizhuang on importing grain: 1.5 million tons. He reaches Wuhan that day.'
