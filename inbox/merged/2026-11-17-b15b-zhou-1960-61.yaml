      - china
      c: 'Zhou Enlai revises the Center''s notice on preparing for full talks on the Sino-Soviet boundary, for the Sinkiang and Inner Mongolia committees and the Heilongjiang and Jilin committees: old unsettled cases and new ones since Liberation, the latest at Artush in Sinkiang, on which the Soviet Embassy sent a note on Aug. 17; China is ready to negotiate fully when needed; six preparations. He adds a fourth: where an area is disputed, a field survey must first be reported to the Center, and none to be made along the Sino-Soviet boundary without its approval.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 346 (Aug. 31, 1960). Made public: 1997. Names: Zhou Enlai.'
