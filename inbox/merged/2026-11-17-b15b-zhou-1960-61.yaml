    entry:
      id: cal.1961-04-13.china-leadership
      when: Apr. 13–15
      date: '1961-04-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai with U Nu, Apr. 13–15, at Jinghong in Xishuangbanna for the Dai New Year. On the 14th he sees the tropical crops institute and a state rubber farm and asks closely about rubber, telling officials to build up China''s young rubber industry. On the 15th he joins in splashing water. To local peoples and cadres: learn from each other, unite, raise minority cadres, manure and water works; protect the forests and the ecological balance; Xishuangbanna counts in Southeast Asia, so build the socialist frontier well.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 404 (Apr. 13, 1961). Names: Zhou Enlai, U Nu.'
      tags:
      - polity:prc
      - polity:burma
      - name:zhou-enlai
      - name:u-nu
