      date: '1961-05-03'
      thread: china-leadership
      also:
      - farm
      c: 'Zhou Enlai at Handan and Wu''an, May 3–7: after more reports from Pang Jun, Xu Ming and Ma Lie, goes to the Boyan commune at Wu''an for inquiry; talks with commune, brigade and team cadres on the communes'' basics and members'' reaction to rural policy; visits dozens of poor and lower-middle peasant households on their production, living and health; inspects a team''s mess hall and members'' food, eats maize gruel with them; sees the commune store and farm machinery station for prices, sales and machines.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 409 (May 3, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
