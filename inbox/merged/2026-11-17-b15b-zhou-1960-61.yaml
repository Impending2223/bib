      when: Aug. 10
      date: '1960-08-10'
      thread: china-leadership
      also:
      - farm
      - china
      c: 'The Center issues the directive "Everyone in the Party to farm, to farm grain." Grain output targets set too high, harvests overestimated, consumption badly arranged and management weak left a tight supply in 1958 and 1959 between harvests; in 1960 after the wheat harvest, buying slow, stocks falling. Eight points: labor to farming and grain; farm water works cut from 70 million laborers to 10 million that winter and spring, continuing works only; autumn crops; cotton and oil crops; all trades to put farming first; grain to be well used; grain shipping first among transport; bureaucracy and feasting ended.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 338–39 (Aug. 10, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
