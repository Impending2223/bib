      - economy
      c: 'Zhou Enlai revises the Center''s notice on several questions of cutting workers and staff, adding after the rules on household registration, grain and ration standards for those cut and their dependents returning home: heavily stricken, grain-short areas and communes and teams with too many returned workers may be given some ration, but no later than the end of September.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 419 (June 27, 1961). Made public: 1997. Names: Zhou Enlai.'
