      c: 'Zhou Enlai with Chen Yi in a second talk with Home Minister Pant: long friendship, present differences solvable by contact with time; no basic conflict of interest between the two countries.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 313 (Apr. 24, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi.'
