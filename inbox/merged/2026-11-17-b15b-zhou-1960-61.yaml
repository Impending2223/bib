      when: Sept. 27
      date: '1960-09-27'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives Czechoslovakia''s new Ambassador, Saidivi: floods and drought hit 15 percent of China''s cultivated area, the worst since 1949; communes overcame much, but farm output falls below last year''s, grain a third below the plan. Withdrawal of Soviet experts has cost construction projects, designs, installation, research and trade, so the plans and foreign trade must be rearranged; trade with the brother countries cannot grow and will fall, China owing something this year; two or three years to recover.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 351 (Sept. 27, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:czechoslovakia
      - name:zhou-enlai
      - vis:only:prc+czechoslovakia
