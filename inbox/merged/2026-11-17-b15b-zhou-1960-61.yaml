      when: Aug. 1
      date: '1960-08-01'
      thread: china-leadership
      also:
      - china
      c: 'At the farewell banquet of Brigadier Aung Gyi, Burma''s chief delegate to the boundary joint commission and deputy chief of staff, Zhou Enlai: among states of a different social system Burma was first to show China friendship, first to recognize it, first to sign a treaty of friendship and nonaggression on the five principles, and will be first to sign a boundary treaty.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 337 (Aug. 1, 1960). Names: Zhou Enlai, Aung Gyi.'
      tags:
      - polity:prc
      - polity:burma
