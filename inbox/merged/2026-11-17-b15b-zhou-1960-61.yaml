      date: '1960-10-01'
      thread: china-leadership
      also:
      - africa
      c: 'At the Nigerian Broadcasting Corporation''s request Zhou Enlai writes a message for Nigeria''s independence, and instructs China''s mission in London to tell the Corporation: the government will decide to recognize Nigeria; if Nigeria guarantees it will not use a recorded greeting from the Taiwan authorities'' representative, the recording of Zhou''s can be sent.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 354 (Oct. 1, 1960). Made public: 1997. Names: Zhou Enlai.'
