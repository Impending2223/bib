      when: Aug. 1
      date: '1960-08-01'
      thread: china-leadership
      also:
      - china
      c: 'At the Swiss Ambassador''s national day reception, Zhou Enlai says China will live in peace with all states and keep world peace, and proposes that the states of Asia and the Pacific coast, the United States included, sign a nonaggression peace pact and make the whole region free of nuclear weapons: a long-term aim, to be worked for.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 337 (Aug. 1, 1960). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
