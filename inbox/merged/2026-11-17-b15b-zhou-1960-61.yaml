      c: 'Zhou Enlai receives the Cuban revolutionary government''s economic delegation under Guevara. On repaying the loan: the agreement has repayment from 1966 to 1975; if 1966 is hard it may be put off until Cuba can pay, and if then still hard, negotiated away.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 373 (Nov. 30, 1960). Made public: 1997. Names: Zhou Enlai, Guevara.'
