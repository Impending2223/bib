      when: Feb. 9
      date: '1961-02-09'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai receives and gives a luncheon for the Nepalese delegation under Major General P. B. Khatri, Nepal's chief delegate to the boundary joint commission; hopes for friendship on the five principles and a boundary treaty. The next day at the Nepalese reception, Khatri says Nepal's economic plans have succeeded with great help from China, and the two have handled the boundary in Bandung's spirit.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 390 (Feb. 9, 1961). Made public: 1997. Names: Zhou Enlai.'
