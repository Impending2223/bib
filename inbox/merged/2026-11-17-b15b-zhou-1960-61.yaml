      c: 'Zhou Enlai receives Suzuki Kazuo, managing director of the Japan–China Trade Promotion Association: the three principles of trade (government agreements, private contracts, case-by-case consideration), with the three political principles restated (Japan''s government not to be hostile to China, not to follow America in the "two Chinas" plot, not to obstruct normalization). China will wait to see Ikeda''s government.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 343 (Aug. 27, 1960). Made public: 1997. Names: Zhou Enlai, Ikeda Hayato.'
