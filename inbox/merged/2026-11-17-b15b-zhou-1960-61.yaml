      date: '1960-10-13'
      thread: china-leadership
      also:
      - latin-america
      c: 'Zhou Enlai receives the Mexican cultural friendship delegation under Emilio Portes Gil, former interim President: development of the economy to be advanced, and within twenty years independent economies for Asia, Africa and Latin America, political and economic independence, colonialism ended on all three continents, coexistence on equality and mutual benefit, each people choosing its own system.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 358 (Oct. 13, 1960). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:mexico
