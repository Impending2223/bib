      thread: china-leadership
      also:
      - china
      c: 'At the meeting of cadres of central organs going down, Zhou Enlai: great results these years, many problems, a bright future; to study Marxism–Leninism and Mao''s works. Five principles in studying Mao: continuing revolution joined to the stages of revolutionary development; strict science joined to high revolutionary spirit; politics in command joined to material interest; Party leadership joined to the mass line; study joined to practice.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 377 (Dec. 8, 1960). Made public: 1997. Names: Zhou Enlai.'
