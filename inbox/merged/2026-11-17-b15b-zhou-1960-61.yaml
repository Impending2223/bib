      when: July 30
      date: '1960-07-30'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai revises the Center''s directive on Tibet''s democratic reform and on uniting the Panchen group. He adds: the fight on the right must breed the "left"; in correcting "left" errors beware a right-opportunist comeback; the Party''s anti-right fight and class struggle outside the Party to be distinguished; the Panchen group to be treated with unity first, by reasoned struggle, protection past the test and discrimination. The Panchen''s part is important.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 335 (July 30, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
