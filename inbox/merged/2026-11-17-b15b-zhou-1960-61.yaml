- add:
    entry:
      id: cal.1960-04-25.china-leadership-3
      when: Apr. 25
      date: '1960-04-25'
      thread: china-leadership
      also:
      - south-asia
      - china
      c: 'Zhou Enlai''s press conference, 10:30 p.m. to 1 a.m., with a written statement of common or near points: a dispute exists; an actual line of control exists; geographical principles, watersheds, river valleys and passes, apply to every sector; both peoples'' feeling for the Himalayas and the Karakoram to be regarded; each to keep to the line of actual control, with no territorial claim as a precondition but individual adjustments allowed; patrols to stay stopped on every sector. He answers Indian and other foreign reporters.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 314 (Apr. 25, 1960). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
