      thread: china-leadership
      also:
      - china
      c: Zhou Enlai with Chen Yi, Zhang Hanfu, Zhang Yan and Pan Zili on the talks with Koirala, Prime Minister of Nepal, who came on Mar. 10. In the afternoon he attends the Secretariat, which discusses the 1960 plan and draft.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 293 (Mar. 11, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Koirala.'
      tags:
      - polity:prc
      - polity:nepal
      - name:zhou-enlai
      - name:chen-yi
      - name:koirala-bisweswar-prasad
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-12.china-leadership
      when: Mar. 12
      date: '1960-03-12'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai''s first talk with Koirala. Three principles for the boundary: the traditional customary line and actual jurisdiction, confirming the status quo; individual disputes adjusted by the maps (where the maps agree, the line is fixed; where they differ without dispute, a survey; where they differ and dispute, the joint commission if not settled now); a boundary agreement now and a treaty later, with the status quo and no attack until then. Tibetan rebels crossing the border to be dealt with by Nepal under its sovereignty and law: held, given refuge or returned.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 293 (Mar. 12, 1960). Made public: 1997. Names: Zhou Enlai, Koirala.'
      tags:
      - polity:prc
      - polity:nepal
      - name:zhou-enlai
      - name:koirala-bisweswar-prasad
      - vis:only:prc+nepal
- add:
    entry:
      id: cal.1960-03-13.china-leadership
      when: Mar. 13
      date: '1960-03-13'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai takes Koirala to the Miyun reservoir, and on the train back to Peking holds the second talk: the three principles of Mar. 12 are the better way; Koirala accepts them in the main. Zhou: the joint commission to survey and draw the line on that basis; a friendship treaty, a draft to be offered.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 293 (Mar. 13, 1960). Made public: 1997. Names: Zhou Enlai, Koirala.'
      tags:
      - polity:prc
      - polity:nepal
      - name:zhou-enlai
      - name:koirala-bisweswar-prasad
      - vis:only:prc+nepal
