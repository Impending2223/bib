      date: '1960-04-18'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai visits the Dagon state textile mill in Rangoon's northern suburb and receives 220 overseas Chinese representatives.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 305 (Apr. 18, 1960). Names: Zhou Enlai.'
