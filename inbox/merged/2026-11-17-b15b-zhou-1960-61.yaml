      date: '1960-12-06'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai revises the Center's comment forwarding the United Front Department's views on handling bourgeois elements and small traders in the cutting and sending down of staff to support the farm front. After "the departments concerned to confer with the united front department beforehand on any matter of bourgeois elements and intellectuals" he adds that such people in principle not go down to the villages but, where cuts are needed, may go on a wholly voluntary basis to city enterprises.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 376 (Dec. 6, 1960). Made public: 1997. Names: Zhou Enlai.'
