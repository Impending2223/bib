      c: 'Zhou Enlai meets the heads of the Party''s provincial and municipal united front departments on what to tell non-Party figures of the Sino-Soviet question: Khrushchev semi-revisionist and right-opportunist on some principles, the Soviet state not gone bad, still anti-imperialist and socialist, the two parties and states mainly united; right opportunism a partial revision of Marxism–Leninism, an inner-Party matter. His anti-China feeling is bourgeois and angers, but is not to breed anti-Soviet feeling. The effect neither small nor great, dark clouds to pass; frontier provocations possible, force not to be imagined; speak of the big matters only.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 344 (Aug. 28, 1960). Made public: 1997. Names: Zhou Enlai.'
