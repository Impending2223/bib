- add:
    entry:
      id: cal.1961-04-19.china-leadership-4
      when: Apr. 19
      date: '1961-04-19'
      thread: china-leadership
      also:
      - japan
      - china
      c: 'Zhou Enlai receives the Buraku Liberation League''s delegation under Matsuda Kiichi: the feudal traces of unequal man and man left by the old society can be ended only by ending classes; the oppressed (workers, peasants, poor intellectuals, Buraku people) are the wisest, bravest, purest; teach the Buraku not to feel low and to despise their "betters"; the League to struggle and unite with the working people, progressive intellectuals, small and middle businessmen and national capitalists. Socialism is to make equal relations between people, or it has no superiority.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 405 (Apr. 19, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - vis:only:prc+japan
