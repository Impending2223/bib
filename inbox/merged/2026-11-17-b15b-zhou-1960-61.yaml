      c: 'Zhou Enlai cables the conference of heads of non-aligned states: may it serve the cause of peoples of Asia, Africa and Latin America for national independence, against imperialist aggression and interference and old and new colonialism, for world peace.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 431 (Aug. 31, 1961). Names: Zhou Enlai.'
