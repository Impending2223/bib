      id: cal.1960-04-21.china-leadership
      when: Apr. 21
      date: '1960-04-21'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai calls on Vice President Radhakrishnan: China cannot recognize the Simla treaty; in the east it has no territorial claim, a misunderstanding to be cleared; the west is China''s.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 308 (Apr. 21, 1960). Made public: 1997. Names: Zhou Enlai, Radhakrishnan.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:radhakrishnan-sarvepalli
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-21.china-leadership-2
      when: Apr. 21
      date: '1960-04-21'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai calls on Home Minister Govind Ballabh Pant: Sino-Indian friendship matters more; temporary differences must not hurt it. Two points: the Simla treaty was never signed or ratified by a Chinese central government; a treaty between Tibet and Britain takes effect only on that government''s approval, which binds Britain too.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 308 (Apr. 21, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-21.china-leadership-3
      when: Apr. 21
      date: '1960-04-21'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai''s third talk with Nehru. Nehru: the east long under Indian administration; in the west a real dispute; the boundary cannot be called undelimited. Zhou: the east disputed, the west not; India''s maps have changed often. He proposes a joint commission to review documents and maps and survey, the status quo kept and the troops kept apart meanwhile. Nehru: the real questions history and the watershed.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 309 (Apr. 21, 1960). Made public: 1997. Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-21.china-leadership-4
      when: Apr. 21
      date: '1960-04-21'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai that evening receives R. K. Nehru, India''s Ambassador to the UAR and former Ambassador to China, on Tibet and the boundary: the Dalai group''s anti-China activity in India goes beyond asylum; friendship matters most, the problem not wholly soluble now but a way may be found.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 310 (Apr. 21, 1960). Made public: 1997. Names: Zhou Enlai, R. K. Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-r-k
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-22.china-leadership-2
      when: Apr. 22
      date: '1960-04-22'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai''s fourth talk with Nehru. The east: a dispute; China will not recognize the McMahon line, will not cross the line India has reached, will keep the status quo save two or three points India has passed, and will negotiate. Common ground: the boundary undetermined; an actual line of control; the watershed one condition, not the only; no territorial claims. Proposals repeated: a joint commission, the status quo, forces drawn back.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 310 (Apr. 22, 1960). Made public: 1997. Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-22.china-leadership-3
      when: Apr. 22
      date: '1960-04-22'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai calls on Finance Minister Morarji Desai: Kalimpong is the command center of the Tibetan rebellion; the western boundary issue arose only with the rebellion, and India''s territorial claim was a surprise; the boundary can be settled only by negotiation, war unthinkable.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 311 (Apr. 22, 1960). Made public: 1997. Names: Zhou Enlai, Desai.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:desai-morarji-ranchhodji
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-23.china-leadership
      when: Apr. 23
      date: '1960-04-23'
      thread: china-leadership
      also:
      - south-asia
      c: 'Zhou Enlai''s fifth talk with Nehru. After Nehru denies any territorial claim, Zhou: the boundary is largely undelimited; in the west China has exercised jurisdiction along the natural boundary, with the north under Sinkiang''s long history; if India insists on its map''s line and asks China''s officials and troops out, that is a territorial claim. Differences of fact need friendly negotiation: exchange of materials, a joint commission with a fixed time reporting to a higher level, the five points as common ground, separation of forces by distance rather than a mere stop to patrols.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 311 (Apr. 23, 1960). Made public: 1997. Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+india
- add:
    entry:
      id: cal.1960-04-24.china-leadership
      when: Apr. 24
      date: '1960-04-24'
      thread: china-leadership
      also:
      - south-asia
      c: Zhou Enlai's sixth talk with Nehru. China proposes a commission to fix the boundary; meanwhile each side keeps the line its administration now reaches (China recognizes India's in the east, India should recognize China's in the west); a stop to the argument; a joint statement. Nehru agrees to officials of both sides examining the materials and reporting where they agree and differ. Zhou proposes a joint communiqué showing progress, forces kept off the line with patrols stopped at least, and invites Nehru to Peking for the next meeting.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 312 (Apr. 24, 1960). Made public: 1997. Names: Zhou Enlai, Nehru.'
      tags:
      - polity:prc
      - polity:india
      - name:zhou-enlai
      - name:nehru-jawaharlal
      - vis:only:prc+india
