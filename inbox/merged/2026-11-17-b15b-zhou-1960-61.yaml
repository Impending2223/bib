      c: The Center issues its urgent directive on a mass campaign to gather and make food substitutes, which names maize root flour and chlorella among those the Academy of Sciences advises. It forms a leading group on "vegetables and melons for grain" under Zhou Enlai with Li Fuchun, Li Xiannian, Tan Zhenlin and Xi Zhongxun, and an office; local committees to form theirs.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 369 (Nov. 14, 1960). Made public: 1997. Names: Zhou Enlai, Li Fuchun, Li Xiannian, Tan Zhenlin.'
