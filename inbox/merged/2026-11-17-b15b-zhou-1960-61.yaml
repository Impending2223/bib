      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-27.china-leadership-4
      when: Oct. 27
      date: '1960-10-27'
      thread: china-leadership
      also:
      - farm
      c: 'Zhou Enlai approves the Center''s comment forwarding Shanxi''s report on rural labor: the matter is the chief obstacle to farm output and the continued leap; unless the farm front''s weak and few laborers are changed, "agriculture the base" and "grain the base of bases" are empty; every committee and department to study Shanxi''s experience and squeeze out every possible laborer.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 363 (Oct. 27, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-29.china-leadership-4
      when: Oct. 29
      date: '1960-10-29'
      thread: china-leadership
      also:
      - farm
      - economy
      c: 'At the enlarged Politburo Zhou Enlai on the home economy: great results, but difficulties of policy, style and class composition. "Each by ability" and "to each by work" to stand side by side. Steel this year not over 19 million tons. Agriculture first: nothing taken from the country for the towns for three to five years. The regional bureaus to command and carry out the Center''s line.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 363 (Oct. 29, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-29.china-leadership-2
      when: Oct. 29
      date: '1960-10-29'
      thread: china-leadership
      also:
      - economy
      c: 'At the North China Bureau''s report, Zhou Enlai remarks: staff of the bureau lean; do not push to it what the Center''s ministries and provinces manage; cotton acreage not to be cut; steel is the question for tractors, and paper figures do no good; plans with room, narrow gaps, solid, no empty checks; stabilizing labor for five years is right; labor is the key, with attention to rest, for women''s illness harms the next generation. Without a leap China cannot shed backwardness, but the laws of the leap are not mastered, and passing the farm barrier was thought too easy.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 364 (Oct. 29, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
