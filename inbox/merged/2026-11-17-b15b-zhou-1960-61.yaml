      c: Zhou Enlai answers Montgomery on China's final aim and nuclear policy. China builds socialism, the first stage of communism, a long task, with ownership in the main by the whole people and by collectives, and a third supplementary individual kind (small traders, handicraftsmen, a private doctor of Chinese medicine). Policy is whatever betters relations of production, develops productive forces and adds material wealth, to be corrected if it does not. China's building is aimed chiefly at itself; it opposes aggression, allows none against itself, and does not infringe others' sovereignty or territory to enlarge its interest.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 435 (Sept. 22, 1961). Made public: 1997. Names: Zhou Enlai, Montgomery.'
