      when: Jan. 9
      date: '1961-01-09'
      thread: china-leadership
      also:
      - economy
      c: 'At Kunming, on the way to see a performance at the military region, Zhou Enlai learns the region is building a national-defense education exhibition hall and tells its chiefs at once: with the State in economic difficulty, no building of halls and offices; as it is built, give it to the locality for use. The building later became the Yunnan provincial museum.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 384 (Jan. 9, 1961). Made public: 1997. Names: Zhou Enlai.'
