      thread: china-leadership
      also:
      - latin-america
      c: 'Zhou Enlai receives João Goulart, Vice President of Brazil, and answers the President''s proposal, conveyed by him, of trade missions exchanged to bring relations closer, ending in the wished relations: in Brazil''s present international setting it cannot yet expel Chiang''s representative and recognize China; from mutual understanding and friendship let neither make difficulties; China will wait.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 428 (Aug. 15, 1961). Made public: 1997. Names: Zhou Enlai, Goulart.'
      tags:
      - polity:prc
      - polity:brazil
