      - indonesia
      - china
      c: 'Zhou Enlai receives Indonesia''s new Ambassador, Sukarni Kartodiwirjo: the Taiwan question harder than West Irian because Taiwan is in American hands, and slower, but China is confident of regaining it; no wish for war with the United States but will strike back if struck; the course is negotiation, five years at Geneva and Warsaw, a hundred meetings, a record; ready for five years more, not fifty or five hundred.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 351 (Sept. 27, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:indonesia
