      - china
      c: 'Zhou Enlai receives Field Marshal Montgomery and wholly agrees with and supports his three principles for easing tension: one China only, Taiwan Chinese territory; for now two Germanys; all foreign troops back to their own territory. Of Montgomery''s impression that people live well and work hard: he saw the good side, there are faults. China''s disasters over three years were great, but steps were taken, by relying on the people, to overcome them; in holding the three red banners there have been faults and errors, which are overcome as China advances.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 434 (Sept. 21, 1961). Made public: 1997. Names: Zhou Enlai, Montgomery.'
