      - defense
      c: 'Zhou Enlai''s comments on Nie Rongzhen''s report of July 3 to the Center: the Soviet Union has tightened scientific cooperation and aid and closed defense science, so independence, self-reliance, reliance on home. Zhou: keep existing agreements without pressing; ask little for new items, not nothing; those with expired terms go with thanks, those under contract not sent back; on science ask, send students, learn from Soviet experts here, buy Western data by every means, and dig by one''s own research.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 330 (July 11, 1960). Made public: 1997. Names: Zhou Enlai, Nie Rongzhen.'
