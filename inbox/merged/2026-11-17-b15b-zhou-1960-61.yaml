      c: 'Zhou Enlai to Mehmet Shehu, in reply: China has studied his letter and will meet in full all the Albanian government''s requests (grain, edible oil, sugar and interest-free free foreign exchange).'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 359 (Oct. 20, 1960). Made public: 1997. Names: Zhou Enlai.'
