      c: Zhou Enlai calls on India's President Prasad, then lays a wreath at Gandhi's tomb.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 306 (Apr. 20, 1960). Names: Zhou Enlai, Prasad.'
