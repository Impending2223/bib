      c: Zhou Enlai at the farewell banquet for Montgomery restates China's stand on restoring its lawful rights in the United Nations and opposes the American plot of "two Chinas"; he wholly agrees with and supports Montgomery's three principles for easing tension as showing he proceeds from the world as it is and has grasped the key; China needs peace and friends; he asks the Field Marshal to tell Western friends what he saw and bring the Chinese people's friendship to the peace-loving in the West.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 435 (Sept. 22, 1961). Names: Zhou Enlai, Montgomery.'
