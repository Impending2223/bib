      - japan
      c: 'Zhou Enlai with Chen Yi at Takasaki''s farewell dinner. Takasaki asks Zhou to reconsider Yoshida''s visit, with lesser treatment; Zhou refuses again: a matter not of treatment but of not inviting those hostile to China; Kishi''s last word that Japanese troops would not step out of Japan can change nothing in the treaty and cannot be trusted.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 361 (Oct. 24, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Takasaki Tatsunosuke.'
