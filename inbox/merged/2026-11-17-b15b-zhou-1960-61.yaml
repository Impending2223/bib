      thread: china-leadership
      c: 'Zhou Enlai, on Mao''s proposal that leaders study the Soviet textbook *Political Economy*, calls some leading cadres and forms a reading group: Li Fuchun, Tao Zhu, Song Renqiong, Wu Zhipu, Xu Dixin, Hu Sheng, Xue Muqiao, Wang Heshou, Lü Zhengcao and Chen Zhengren among them.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 288 (Feb. 14, 1960). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Li Fuchun, Tao Zhu.'
