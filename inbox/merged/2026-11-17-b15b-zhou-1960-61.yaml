      c: 'Zhou Enlai''s report to the Central Work Conference on the situation and eight tasks for 1962. Great war can be put off, small wars not avoided; the situation improving, villages before towns; three years'' errors cost much, the results chief; 1962 the key year of adjustment. The eight tasks: drop the frame; cut staff; farm output; timber, coal, steel, ore and transport; clear materials; the market; carry out the policies and regulations; build a new order.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 446–47 (Dec. 28, 1961). See [[cal.1961-12-20.china-leadership]]. Made public: 1997. Names: Zhou Enlai.'
