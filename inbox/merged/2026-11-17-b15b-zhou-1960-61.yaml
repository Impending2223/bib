      thread: china-leadership
      also:
      - laos
      - china
      c: Zhou Enlai tells U Nu that if the United Nations meddles in Laos the result will be as bad as in the Congo; best is a Geneva conference with Laos's neighbors; a peaceful and neutral Laos would be good for Asia's peace; China finds Sihanouk's proposal of Jan. 1 for a fourteen-nation Geneva conference good.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 383 (Jan. 3, 1961). Made public: 1997. Names: Zhou Enlai, U Nu.'
