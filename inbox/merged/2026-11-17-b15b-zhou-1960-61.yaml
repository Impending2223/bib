      c: 'At the Center''s symposium of democratic and non-Party figures Zhou Enlai speaks. World: the chief aspect of the contradiction is the peoples; imperialism on the defensive toward the camp, adventure not ruled out; ban on nuclear arms and delay of world war more likely, local war unavoidable. At home: better than last year; faults chiefly in targets too high and building too large; adjustment is for the third five-year plan; intellectuals have a future and were neglected; the hard time to end in two or three years, by harvest and output; hard work and thrift a long line.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 436 (Sept. 28, 1961). Names: Zhou Enlai.'
