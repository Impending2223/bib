      - china
      c: 'Zhou Enlai''s talk with U Nu, comparing news of Laos: if America fights a local war there it will be more the wrong time, place and war than Korea; if it does not interfere Laos can be settled; peace in Laos has hope.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 404 (Apr. 12, 1961). Made public: 1997. Names: Zhou Enlai, U Nu.'
