- add:
    entry:
      id: cal.1960-01-18.china-leadership-2
      when: Jan. 18
      date: '1960-01-18'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai receives Heinrich Rau, Deputy Premier of the German Democratic Republic, and the government delegation on its invitation, and describes China''s industrial and farm output. Asked about India and Indonesia: the border quarrel was begun by India; concession would make Nehru more reactionary, put him in the right and help him; China criticizes him, then seeks unity. Another course is that he eases and keeps friendly with the socialist countries.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 279 (Jan. 18, 1960). Made public: 1997. Names: Zhou Enlai, Rau.'
      tags:
      - polity:prc
      - polity:gdr
      - name:zhou-enlai
      - name:rau-heinrich
      - vis:only:prc+gdr
- add:
    entry:
      id: cal.1960-01-18.china-leadership-3
      when: Jan. 18
      date: '1960-01-18'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai replies to Mehmet Shehu, Chairman of the Council of Ministers of Albania: China will meet his request and raise its wheat supply to Albania in 1960 by 30,000 tons.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 279 (Jan. 18, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:albania
      - name:zhou-enlai
      - vis:only:prc+albania
- add:
    entry:
      id: cal.1960-01-19.china-leadership
      when: Jan. 19
      date: '1960-01-19'
      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: 'Zhou Enlai receives Chervonenko, the Soviet Ambassador, and asks him to tell the Soviet Party and Khrushchev: India began the incident and China holds the right of it; if Soviet leaders on their visit to India say they will take a hand, India will use it and China must take a different stand, to the harm of Soviet interests and the two parties'' unity. The Soviet Union should answer Indonesia''s anti-Chinese talk. The Japan–U.S. security treaty revision means Japan''s militarism revived; the two sides should exchange views.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 280 (Jan. 19, 1960). Made public: 1997. Names: Zhou Enlai, Chervonenko, Khrushchev.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:chervonenko-stepan-v
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-19.china-leadership-2
      when: Jan. 19
      date: '1960-01-19'
      thread: china-leadership
      c: 'Zhou Enlai, receiving the national militia work conference and the national sports work conference: strengthen national defense and sport; a people in health makes a strong defense.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 280 (Jan. 19, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-20.china-leadership
      when: Jan. 20
      date: '1960-01-20'
      thread: china-leadership
      c: Zhou Enlai presides at the public memorial in Zhongshan Park for Wei Lihuang (died Jan. 17).
      n: '[[w.zhou-enlai-nianpu-1949]], II, 280 (Jan. 20, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-20.china-leadership-2
      when: Jan. 20
      date: '1960-01-20'
      thread: china-leadership
      c: 'Zhou Enlai presides at the State Council''s 94th plenary meeting and speaks on the 1959 plan''s fulfillment: two years of all-round Great Leap; capital construction more, consumption less; city–country income gaps to narrow, low wages to rise, wages over 300 yuan a month not to rise; collective welfare before individual pay; build big, medium and small, native and foreign, center and local, with agriculture as the base.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 280 (Jan. 20, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-21.china-leadership
      when: Jan. 21
      date: '1960-01-21'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Zhou Enlai on a paper on aid to Vietnam: the Foreign Trade Ministry to list the aid projects and sums and give them through the economic representative in Hanoi, so that the Vietnamese know where they stand and do not keep asking for more projects. Overspending on aid projects to be met by added credits when accounts are settled in 1962. Military aid is a gift, not to be mixed with credits.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281 (Jan. 21, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-22.china-leadership-2
      when: Jan. 22
      date: '1960-01-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Chervonenko, to Chen Yi, on his report to the Soviet Central Committee of his talk with Zhou Enlai of Jan. 19: the Soviet Party will keep strict neutrality in the Sino-Indian border dispute and opposes third-country interference; the Chinese comrades'' worry surprised them. He asks Chen Yi to pass it to Zhou and the Central Committee; Chen Yi will.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281 (Jan. 22, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Chervonenko.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:chen-yi
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
