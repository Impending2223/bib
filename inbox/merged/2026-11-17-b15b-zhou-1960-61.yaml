      c: 'Zhou Enlai, told by Yang Shangkun by telephone of the list of those for the Central Work Conference fixed by the Secretariat, makes two points: since the meeting chiefly concerns grain, Tan Zhenlin is needed but Chen Yi better stay in Peking to direct the Geneva delegation''s work; and, on Mao''s proposal that each province send two as each level, that each provincial committee send one more secretary besides the first, chosen by themselves. That day he cables both to Mao, who agrees.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 425 (Aug. 3, 1961). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Chen Yi, Tan Zhenlin.'
