      also:
      - china
      - trade
      c: 'Zhou Enlai receives and gives a banquet for the Burmese government''s economic delegation and advisers: the economic relation between China and Burma is a new kind, aimed on the five principles at mutual help and learning for each one''s national economy to grow independently, and not at harming either''s interest.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 444 (Dec. 13, 1961). Names: Zhou Enlai, U Nu.'
