      when: Apr. 28
      date: '1961-04-28'
      thread: china-leadership
      also:
      - china
      c: 'After seeing the Peking People''s Art Theater''s *Death of a Famous Actor* and *Pan Jinlian* Zhou Enlai talks with the theater''s heads and players: old plays carry their authors'' confused, feudal and capitalist notions, to be received critically and judged by today''s eyes; a person of bad origin may turn to revolution, one of good origin go downhill; Pan Jinlian is no anti-feudal type nor Wu Song a hero of feudal society; consider the young audience in restaging; keep Let a hundred flowers bloom and raise quality.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 407 (Apr. 28, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
