      date: '1960-11-28'
      thread: china-leadership
      also:
      - economy
      c: 'At the Secretariat, on this year''s coal and iron shipping, Zhou Enlai: strict science comes from constant correction through practice; talk so that people dare speak; the line is carried out by persons; production and living go together; labor not spared the past year or two; a few percent of cadres have Kuomintang ways; leave room in coal, steel and cement, do more and say less, local papers to say seven when it is ten; anti-revisionism a ten-year matter, so keep a hand back.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 372 (Nov. 28, 1960). Made public: 1997. Names: Zhou Enlai.'
