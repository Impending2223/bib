      c: 'Zhou Enlai to Mao, by letter: for the friendship between the two peoples and normal trade between the two states, China will next day (Dec. 3) give India a note declaring that the Sino-Indian agreement (on Tibet) lapses June 3, 1962 and proposing talks for a new trade and communications agreement on the five principles. Mao agrees the next day.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 442 (Dec. 2, 1961). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Nehru.'
