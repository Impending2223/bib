      c: 'Zhou Enlai receives Iraq''s Ambassador, Abd al-Haqq Fadil: tension with neighbors is bad but may help unity at home; a good leader joins the anti-imperialist and democratic forces against outside enemies; gaps at home let in plotters; the other danger is a leader who cannot unite his people and pushes them into opposition. He sends good wishes to Qassim.'
