      when: Jan. 24
      date: '1960-01-24'
      thread: china-leadership
      c: Zhou Enlai back in Peking.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 281 (Jan. 24, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
