      c: 'Zhou Enlai receives Ghana''s first Ambassador to China (Kobina Kesi in the chronology''s transliteration): the chief task for Asia, Africa and Latin America''s middle zone is to drive out colonialism and win national independence; after independence not all need choose socialism, a people choosing its own system; revolution and counter-revolution cannot be exported; Africa''s awakening is irresistible; China and Asians are on Africa''s side.'
