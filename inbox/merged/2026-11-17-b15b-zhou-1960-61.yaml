      c: 'Zhou Enlai hears Xiong Xianghui, deputy director of the Foreign Ministry''s office, on Field Marshal Montgomery''s visits around China; when he reports having answered Montgomery''s objection to women marshals, Zhou tells him: hold to seeking agreement and putting aside differences, do not leave others without a word; irony and sarcasm are never our diplomacy.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 433 (Sept. 20, 1961). Made public: 1997. Names: Zhou Enlai, Montgomery.'
