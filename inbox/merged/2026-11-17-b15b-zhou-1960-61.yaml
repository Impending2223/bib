      c: 'Zhou Enlai, Oct. 11–14, receives U Nu. On the 12th, returning the call: experience comes from foreigners and, chiefly, from one''s own building; underdeveloped states build to be self-reliant; light industry first, which returns money quickly; heavy industry neither left out nor overdone. On the 13th he signs the boundary protocol, which finally settles the boundary left by history, a peaceful and friendly one; that evening at U Nu''s farewell dinner: another model of peaceful coexistence of states of different systems. The joint communiqué is issued the 14th.'
