      when: Dec. 3
      date: '1960-12-03'
      thread: china-leadership
      also:
      - economy
      c: 'The Center issues its urgent directive on holding the steel output: the task of 18.6 million tons this year a matter watched at home and abroad, a political one; from Nov. 21 steel, iron and coal output has fallen day by day, and unless that is reversed the target is in danger, to the harm of the political fight and next year''s leap; every area and department to seize the time.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 374 (Dec. 3, 1960). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
