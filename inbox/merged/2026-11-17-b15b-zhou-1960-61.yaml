      when: Oct. 31
      date: '1960-10-31'
      thread: china-leadership
      also:
      - soviet-union
      - trade
      c: 'Zhou Enlai to Mao, by letter, after talking with Chen Yi: a Chinese negotiating delegation to be formed at once under Zhang Hanfu and Ye Jizhuang, the talks to be fought for in Peking. Mao agrees Nov. 5. (The delegation to the Soviet Union is for trade and renewed aid projects.)'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 365 (Oct. 31, 1960). Made public: 1997. Names: Zhou Enlai, Mao Zedong, Chen Yi, Zhang Hanfu.'
