- add:
    entry:
      id: cal.1960-10-10.china-leadership-2
      when: Oct. 10–21
      date: '1960-10-10'
      thread: china-leadership
      also:
      - economy
      - farm
      c: 'At the Secretariat, Oct. 10, 11, 14, 15 and 21, Zhou Enlai hears reports on industry, finance and trade; the meetings take up removing the "rightist" label, pardoning war criminals and adding key universities. On the 10th, after Gu Mu on industrial output: those who report difficulty and seek ways are not rightists; forbidding talk of difficulty, as with Shandong''s grain, brings worse. Qinghai''s 50,000 jin of fish sent to the Center is absurd; Li Fuchun to draft a notice that nothing, not a thread or a fish, is to go to the Center; one province to be made an example.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 356 (Oct. 10, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-11.china-leadership
      when: Oct. 11
      date: '1960-10-11'
      thread: china-leadership
      also:
      - japan
      - trade
      c: 'Zhou Enlai receives Takasaki Tatsunosuke, Japan''s chief delegate at Bandung. China will restore normal relations on the five principles and the ten Bandung principles; the three minimum conditions: no mutual hostility, China none toward Japan; China acknowledges Japan, which should not follow America in the "two Chinas" plot; no obstruction but promotion of normalization.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 357 (Oct. 11, 1960). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - vis:only:prc+japan
- add:
    entry:
      id: cal.1960-10-12.china-leadership
      when: Oct. 12
      date: '1960-10-12'
      thread: china-leadership
      also:
      - japan
      - trade
      c: 'Zhou Enlai''s talk with Takasaki Tatsunosuke, who proposes that Yoshida come to Peking and Liao Chengzhi visit Japan. Zhou: Japanese militarism harmed China for half a century and, if revived, China will oppose it; the Japan–U.S. security treaty draws Japan into America''s mire as vanguard and cannon fodder, so Yoshida''s visit cannot be considered; China invites only those who want to restore relations. Japan should take the road of independence, democracy, peace and neutrality; neutrality means against world war, no military blocs, not the old imperialist road.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 357 (Oct. 12, 1960). Made public: 1997. Names: Zhou Enlai, Yoshida Shigeru.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - name:yoshida-shigeru
      - vis:only:prc+japan
