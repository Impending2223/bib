      c: 'Zhou Enlai''s second talk with the Lao Động delegation, Chen Yi and Zhang Hanfu added: class struggle goes on abroad under peaceful coexistence; imperialism will not give up wrecking socialist states, and Dulles wrote that if war cannot end socialism it must be changed from within. The international united front: first the working people, then the bourgeoisie. Struggles in the intermediate zone to be firmly supported, under the slogans of nation, independence and peace, not socialism. Vietnam''s transformation has results; the cooperative percentage is high enough for water works and manure.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 317 (May 12, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Lê Duẩn, Phạm Văn Đồng, Trường Chinh.'
