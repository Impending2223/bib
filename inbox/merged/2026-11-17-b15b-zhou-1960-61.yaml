      c: 'Zhou Enlai receives the Indian mathematician D. D. Kosambi: on the boundary, China has stopped patrols of its own accord, the government has ordered no shooting if possible, and will persuade armed Indians who enter to leave; no incident in the last year; China will never invade India or take an inch; it wants a friendly settlement and will concede, but concession must be on both sides.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 367 (Nov. 10, 1960). Made public: 1997. Names: Zhou Enlai.'
