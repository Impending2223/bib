      date: '1961-04-20'
      thread: china-leadership
      also:
      - cuba-bay-of-pigs
      c: 'The Chinese government''s statement on Cuba: the Chinese people cannot be indifferent to American armed aggression against Cuba. Rallies and demonstrations in support of Cuba follow across the country.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 390 (Apr. 20, 1961). See [[cal.1961-04-18.china-leadership-2]].'
