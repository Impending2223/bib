      - laos
      - china
      c: 'Zhou Enlai with Chen Yi takes Sihanouk and his wife to Nanjing and Hangzhou. On the train to Nanjing: China supports the United Nations, which has some use, but America commands the voting machine, its majority shrinking but still a majority; the Congo is the case, with states now withdrawing from the UN force and Lumumba having brought the UN in and been unable to get it out. So China wants the Laos question settled in the form of the Geneva Conference, not because China is outside the UN but because America can still manipulate it.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 380 (Dec. 20, 1960). Made public: 1997. Names: Zhou Enlai, Chen Yi, Sihanouk.'
