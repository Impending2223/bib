      date: '1960-03-06'
      thread: china-leadership
      c: 'Zhou Enlai back in Peking. Finds that his staff had repaired his house in his absence; that night he goes to stay at Diaoyutai and asks for the old furniture and curtains back. Later to He Qian: a house may be repaired but not too well; he returns when the old furnishings are back.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 292 (Mar. 6, 1960). Made public: 1997. Names: Zhou Enlai.'
