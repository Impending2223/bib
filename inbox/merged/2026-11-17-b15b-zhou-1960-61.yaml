      c: Zhou Enlai's talks with King Mahendra of Nepal, who came on Sept. 29, on the boundary and other matters. On Mount Everest the feelings of the Nepalese and of the people of Tibet both count, so a more reasonable wording is to be found in the boundary treaty; he agrees with Nepal's view that "the boundary passes over the summit," "north of the peak to China, south to Nepal," and agrees that China help Nepal build a road from Katmandu straight to Tibet.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 437 (Sept. 30, 1961). Made public: 1997. Names: Zhou Enlai, Mahendra.'
