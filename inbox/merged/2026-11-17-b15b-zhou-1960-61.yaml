    entry:
      id: cal.1961-12-14.china-leadership
      when: Dec. 14
      date: '1961-12-14'
      thread: china-leadership
      also:
      - economy
      c: 'At the Secretariat on the industrial plan Zhou Enlai: the adjustment is urgent and cannot be done without self-reliance; with the difficulties known, one has high aims; the part serves the whole, the present the long run, the Party the Center; everything for the masses'' interest, but not against the Party''s leadership, nor policy against task.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 444 (Dec. 14, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-12-15.china-leadership
      when: Dec. 15
      date: '1961-12-15'
      thread: china-leadership
      also:
      - foreign-aid
      - china
      c: 'Zhou Enlai presides at the State Council''s 114th meeting, which adopts, among seven items, the proposal to pardon another group of war criminals of the Chiang Kai-shek group and of Manchukuo. On foreign aid: it must not be faked; what is poor must be said so, China''s experience passed on honestly; no bad goods. At the close, on the Leap''s lessons: some work pressed too hard, the construction front too long; the two years of adjustment the key; stop all works not urgent; concentrate and unify, heed the Center, the State Council and the Economic and Planning Commissions.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 444 (Dec. 15, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-12-16.china-leadership-2
      when: Dec. 16
      date: '1961-12-16'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai approves the Center''s telegram, drafted by its Foreign Affairs Group, to Party groups of ministries and local committees on the Soviet Embassy''s leaving Albania and related matters (the Soviet Foreign Ministry communiqué, three Soviet notices and two Albanian notes published in *Renmin ribao* Dec. 15): in contacts abroad not to raise it; if asked, as individuals and by audience, to state a stand for unity and against split, but to give capitalist-country visitors no particular view.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 445 (Dec. 16, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:albania
      - polity:ussr
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-12-16.china-leadership-3
      when: Dec. 16–21
      date: '1961-12-16'
      thread: china-leadership
      also:
      - economy
      c: 'Zhou Enlai at the Secretariat on Dec. 16, 18 and 21, hearing Bo Yibo on the national industrial secretaries'' conference: three years of Leap have made the frame of the economy large and unsound, a swollen pig with too little material, so first remove the frame (close, stop, merge, shift); second, clear the confused economic order and build a new one; third, the hundreds of thousands of enterprises'' tangled contradictions to be solved by concentration, unity and one heart, from the whole, or no new order can be built.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 445 (Dec. 16, 1961). Made public: 1997. Names: Zhou Enlai, Bo Yibo.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:bo-yibo
      - vis:only:prc
- add:
    entry:
      id: cal.1961-12-19.china-leadership-2
      when: Dec. 19
      date: '1961-12-19'
      thread: china-leadership
      also:
      - economy
      c: 'At the 48th enlarged meeting of the National People''s Congress Standing Committee Zhou Enlai gives a preparatory government work report: three years'' results and the problems in the three red banners; policy needs two kinds of experience, right and wrong; mastering the laws of socialist building takes practice and time, and twists and reversals till then are hard to avoid. A year of adjustment has results: farm output and peasants'' life better; industrial support for farming and the market under way; relations adjusted and policies made concrete. The results are first and not firm.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 445 (Dec. 19, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
