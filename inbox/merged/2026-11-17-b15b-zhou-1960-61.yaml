      c: Zhou Enlai gives a meal for the ministers who are not Party members and talks with them; at the words of one of them, Ping Jiesan, on cooperation between Party and non-Party in government offices he adds that the two must hold a right criticism and self-criticism; each ministry to make a climate where opinions are said even if wrong, with a monthly heart-to-heart meeting; the fourth volume of Mao's *Selected Works* to be studied first for method of work and leadership; where thought is not shared, action will not be one.
