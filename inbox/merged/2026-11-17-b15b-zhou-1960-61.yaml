      when: Apr. 21
      date: '1961-04-21'
      thread: china-leadership
      also:
      - africa
      - china
      c: 'Zhou Enlai receives visitors from Guinea, South Africa, Jordan, Senegal, Uganda and Northern Rhodesia (now Zambia): a country''s independence must be economic as well as political, and in that sense China too is not yet wholly independent, not yet industrialized, its farming backward and living standards low; to win full independence oppose imperialism and colonialism together, strengthen unity and exchange between Asian, African and Latin American peoples.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 406 (Apr. 21, 1961). Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:guinea
      - polity:south-africa
