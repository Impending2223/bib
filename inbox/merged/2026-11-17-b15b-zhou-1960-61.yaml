      - economy
      c: At the Secretariat on grain, cotton, coal, cutting staff and plan; the meeting adopts the State Economic Commission Party group's report and the Center's comment.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 431 (Sept. 14, 1961). Made public: 1997. Names: Zhou Enlai.'
