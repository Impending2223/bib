      when: June 22
      date: '1961-06-22'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai with some film makers and the officials concerned on their work and study and on the quality of films.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 417 (June 22, 1961). See [[cal.1961-06-17.china-leadership]]. Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-17.china-leadership-2
      when: June 17
      date: '1961-06-17'
      thread: china-leadership
      also:
      - economy
      c: 'At the Secretariat on adjusting industry''s order, shortening the front and cutting the town population: before, heavy industry led and squeezed the others; now agriculture and light industry should not lead and squeeze heavy industry too much; the three to be rightly proportioned.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 417 (June 17, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-18.china-leadership
      when: June 18
      date: '1961-06-18'
      thread: china-leadership
      also:
      - farm
      c: Zhou Enlai revises and issues the Center's instruction on Yellow River flood control, adding after "the Railway Ministry to strengthen flood work on the Zhengzhou and Jinan bridges at once" that the repair of the two railway lines at Huayuankou and Dongbatou be begun at once.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 417 (June 18, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-19.china-leadership-5
      when: June 19
      date: '1961-06-19'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai at the joint meeting of the Propaganda Department''s literary and art symposium and the Culture Ministry''s film conference criticizes "left" thinking in arts work: "free the mind, break superstition, dare think, speak and act"; a democratic atmosphere; first change the style of cadres, leading cadres, "beginning with us few"; let others differ; no "putting on hats" and clubs. He treats the dialectic of material and spiritual production, class struggle and united front, whom and how to serve, art''s laws, heritage and creation, leadership and the masses, and asks them to criticize his talk as a "live target."'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 417 (June 19, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-20.china-leadership-2
      when: June 20
      date: '1961-06-20'
      thread: china-leadership
      also:
      - korea
      - trade
      c: 'Zhou Enlai cables Kim Il Sung: Chinese industrial departments mean to send two technical study teams to Korean plants to learn Korea''s advanced practice in making vinylon and iron, in design, machinery and production.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 418 (June 20, 1961). Made public: 1997. Names: Zhou Enlai, Kim Il Sung.'
      tags:
      - polity:prc
      - polity:dprk
      - name:zhou-enlai
      - name:kim-il-sung
      - vis:only:prc+dprk
- add:
    entry:
      id: cal.1961-06-20.china-leadership-3
      when: June 20
      date: '1961-06-20'
      thread: china-leadership
      also:
      - japan
      c: 'Zhou Enlai, June 20 and 21, receives the Japanese Communist Party''s Diet members'' delegation, the Japanese writers'' delegation, the Japan–China Friendship Association''s women''s delegation, the Japanese business friendship delegation and friendly firms'' representatives: restoring militarism harms Japan''s, China''s and Asia''s peoples, and its future is dark, leading Japan''s people into disaster; if the two peoples visit and work for peace they can stop the danger of aggressive war; China receives Japan''s guests on the understanding that Japan''s people oppose American control, war and militarism and want lasting peace.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 418 (June 20, 1961). Made public: 1997. Names: Zhou Enlai.'
      tags:
      - polity:prc
      - polity:japan
      - name:zhou-enlai
      - vis:only:prc+japan
