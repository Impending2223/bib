- cite:
    id: cal.1965-03-13.voting-rights
    item: '[[w.kotz-judgment-days]], 304–07 (just before noon, with Seymore Trammell; two hours; "You can''t stop a fever
      by putting an icepack on your head"; "Don''t you shit me, George Wallace"; "George Wallace—He Hated"; Katzenbach, Valenti
      and Goodwin with Johnson; at 3:45 p.m. in the Rose Garden: "What happened in Selma was an American tragedy"; the bill
      to Congress Monday, Mar. 15; citizens to be registered by federal officials where State officials refuse)'
    units: A-E
- add:
