      when: Mar. 11
      date: '1965-03-11'
      thread: voting-rights-selma
      c: Selma, Brown Chapel. Baker gives the crowd in the rain the news of Reeb's death; his police bar the march to the
        courthouse. Three hours of song and speeches, a third night on Sylvan Street. The four men charged with the murder
        out on small bail after a few hours in jail.
      n: '[[w.kotz-judgment-days]], 301–02. See [[cal.1965-03-10.voting-rights-selma-2]]. Names: Baker, Reeb.'
