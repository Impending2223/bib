      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'Russell, convalescent in Puerto Rico, to Johnson after the address: the finest political speech he has ever heard.'
      n: '[[w.kotz-judgment-days]], 314. See [[cal.1965-03-15.voting-rights]]. Names: Russell, Johnson.'
