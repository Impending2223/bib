      thread: press-and-broadcasting
      also:
      - voting-rights
      c: 'Wicker in the *Times*, of the address: "No other American President had so completely identified himself with the
        cause of the Negro. No other President had made the issue of equality for Negroes so frankly a moral cause for himself
        and all Americans."'
      n: '[[w.kotz-judgment-days]], 313–14. To check: *New York Times*, Mar. 16, 1965. See [[cal.1965-03-15.voting-rights]].
        Names: Wicker.'
