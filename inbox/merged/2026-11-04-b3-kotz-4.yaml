- add:
    entry:
      id: cal.1965-03-10.civil-rights-the-executive-2
      when: Mar. 10
      date: '1965-03-10'
      thread: civil-rights-the-executive
      also:
      - voting-rights
      c: 'Humphrey to Johnson, a follow-up: the church leaders of Mar. 9 will escalate. A continuous prayer vigil at the White
        House from that night; a rally in Lafayette Park on Sunday; if on Monday Johnson has neither sent a voting bill nor
        met their representatives, the national church groups to call their members to Washington.'
      n: '[[w.kotz-judgment-days]], 300. To check: Vice President to the President, "Followup," Mar. 10, 1965, Marvin Watson,
        aides file, box 31, LBJ Library (cited by [[w.kotz-judgment-days]], 300 n.45). See [[cal.1965-03-09.civil-rights-the-executive-2]].
        Names: Humphrey, Johnson.'
      src:
        c: 44b215c4
        rows:
        - 'w.kotz-judgment-days 300: all'
