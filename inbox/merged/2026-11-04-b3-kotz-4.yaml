      when: Mar. 13
      date: '1965-03-13'
      thread: transition-and-staff
      c: 'Willis Hurst and James Cain examine Johnson in the morning, at Lady Bird Johnson''s urging. Her diary that night:
        "Essentially, everything is fine ... But there is this heavy load of tension and this fog of depression"; their prescription
        "exercise, diet, and a break"; "Lyndon feels chained right here."'
      n: '[[w.kotz-judgment-days]], 308. To check: [[w.reaching-for-glory]], 227–28 (cited by [[w.kotz-judgment-days]], 308
        n.65). Names: Johnson, Lady Bird Johnson.'
      src:
        c: a508b442
        rows:
        - 'w.kotz-judgment-days 308: all'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
