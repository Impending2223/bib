- add:
    entry:
      id: cal.1965-03-08.voting-rights-selma-8
      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - civil-rights-the-executive
      - king
      c: 'Katzenbach in a conference call with King and Jack Greenberg, that evening: to march against Judge Johnson''s order
        would alienate the judge and the President. Katzenbach: "Dr. King, you promised you would not march." King: "Mr. Attorney
        General, you have not been a black man in America for the past three hundred years." Greenberg has word that the judge
        would "put Martin Luther King under the jail."'
      n: '[[w.kotz-judgment-days]], 292. To check: [[w.greenberg-crusaders-in-the-courts]], 356 (cited by [[w.kotz-judgment-days]],
        292 n.28). See [[cal.1965-03-07.voting-rights]]. Names: Katzenbach, Martin Luther King, Greenberg, Frank Johnson,
        Johnson.'
      src:
        c: '49222681'
        rows:
        - 'w.kotz-judgment-days 292: all'
      tags:
      - name:katzenbach-nicholas
      - name:king-martin-luther-jr
      - name:greenberg-jack
      - name:johnson-frank-m-jr
      - name:johnson-lyndon-b
- cite:
    id: cal.1965-03-08.voting-rights-selma-4
    item: '[[w.kotz-judgment-days]], 292 (11:25 p.m.; King still undecided; Johnson, in bed, of the sit-in on television:
      "absolutely disgraceful"; "[King] better go on behaving himself or all of them are going to get put in jail")'
    units: B-C
- src:
    id: cal.1965-03-08.voting-rights-selma-4
    rows:
    - 'via x.1965-03-08.lbj-phone-call-with-bill-moyers: B-C'
- add:
    entry:
      id: cal.1965-03-08.voting-rights-selma-9
      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - king
      c: 'Montgomery, at night. King and his staff with Lewis and Forman of SNCC and Farmer of CORE; SNCC''s leaders for marching
        against Judge Johnson''s order, most of the SCLC''s ministers for waiting. King: he will accept the judge''s conditions
        and postpone the march.'
      n: '[[w.kotz-judgment-days]], 292–93. To check: [[w.young-easy-burden]], 359–60; [[w.garrow-protest-at-selma]], 84–85
        (cited by [[w.kotz-judgment-days]], 293 n.30). See [[cal.1965-03-07.voting-rights]]. Names: Martin Luther King, Lewis,
        Forman, Farmer, Frank Johnson.'
      src:
        c: 2d449cf6
        rows:
        - 'w.kotz-judgment-days 292–93: all'
      tags:
      - name:king-martin-luther-jr
      - name:lewis-john
      - name:forman-james
      - name:farmer-james
      - name:johnson-frank-m-jr
- add:
    entry:
      id: cal.1965-03-08.voting-rights-selma-10
      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - king
      c: 'Selma, Brown Chapel, near midnight. King to the mass meeting, Mar. 7''s marchers and hundreds come from across the
        country among them: the march will go ahead.'
      n: '[[w.kotz-judgment-days]], 293. To check: [[w.young-easy-burden]], 359–60; [[w.garrow-protest-at-selma]], 84–85 (cited
        by [[w.kotz-judgment-days]], 293 n.30). See [[cal.1965-03-08.voting-rights-selma-9]]. Names: Martin Luther King.'
      src:
        c: ee3b7078
        rows:
        - 'w.kotz-judgment-days 293: all'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-03-08.voting-rights-selma-11
      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - civil-rights-the-executive
      c: 'Doar to King, at the White House''s instruction, that night: the President and Judge Johnson would both endorse
        a march to Montgomery if he called off the next day''s; to march against the order would hurt the SCLC with the Administration.
        King will not relent.'
      n: '[[w.kotz-judgment-days]], 293. See [[cal.1965-03-08.voting-rights-selma-9]]. Names: Doar, Martin Luther King, Johnson,
        Frank Johnson.'
      tags:
      - name:doar-john
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - name:johnson-frank-m-jr
