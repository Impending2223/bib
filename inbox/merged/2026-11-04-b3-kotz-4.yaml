      when: Mar. 9
      date: '1965-03-09'
      thread: voting-rights-selma
      also:
      - civil-rights-the-executive
      c: 'King to Katzenbach by telephone, about 5 a.m., before going to bed: the march will go on.'
      n: '[[w.kotz-judgment-days]], 294. See [[cal.1965-03-07.voting-rights]]. Names: Martin Luther King, Katzenbach.'
      tags:
      - name:king-martin-luther-jr
      - name:katzenbach-nicholas
      time_approx: true
- add:
    entry:
      id: cal.1965-03-09.voting-rights-selma-3
      when: Mar. 9
      date: '1965-03-09'
      thread: voting-rights-selma
      also:
      - civil-rights-the-executive
      c: 'Selma, the morning. Collins lands at Craig Air Force Base minutes after 5 a.m. and with Doar works out a shortened
        march; at Sullivan Jackson''s house he puts it to King, Shuttlesworth there: cross the bridge, pray at the troopers''
        line, turn back. King: "if you will get Sheriff Clark and [Colonel] Lingo to agree to something like that, I will
        try." At the Lehman Pontiac dealership Lingo, five hundred troopers in Selma, agrees after a call to Wallace; Clark
        draws the route.'
      n: '[[w.kotz-judgment-days]], 294–95. To check: [[w.garrow-protest-at-selma]], 85–86; [[w.wagy-governor-leroy-collins-of]],
        410–11; *New York Times*, Mar. 10, 1965, p. 1 (cited by [[w.kotz-judgment-days]], 294 nn.33–35). See [[cal.1965-03-08.voting-rights-selma-12]].
        Names: Collins, Doar, Martin Luther King, Shuttlesworth, Clark, Lingo, Wallace.'
      src:
        c: 70af5480
        rows:
        - 'w.kotz-judgment-days 294–95: all'
        - 'via x.1965-03-10.nyt-p1-selma: E'
      tags:
      - name:collins-leroy
      - name:doar-john
      - name:king-martin-luther-jr
      - name:shuttlesworth-fred
      - name:clark-james-g-jr
      - name:lingo-albert-j
      - name:wallace-george-c
- add:
    entry:
      id: cal.1965-03-09.voting-rights-4
      when: Mar. 9
      date: '1965-03-09'
      thread: voting-rights
      also:
      - voting-rights-selma
      - civil-rights-the-executive
      c: 'Statement on Selma: "I am certain Americans everywhere join in deploring the brutality with which a number of Negro
        citizens of Alabama were treated." His recommendations on the vote by the weekend; the Justice Department to enter
        the suit to enjoin Alabama''s officers from barring the march, as "friend of the court." All in leadership to approach
        the situation "with calmness, reasonableness, and respect for law and order." Reedy reads it to the press.'
      n: 'Statement by the President on the Situation in Selma, Alabama, [1965 Pub. Papers 272](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=348)
        (Mar. 9, 1965). [[w.kotz-judgment-days]], 291–92 (read by Reedy; aimed at King and Wallace both, by Reedy''s account).
        Check: Kotz tells it among the events of Mar. 8. See [[cal.1965-03-07.voting-rights]]. Names: Johnson, Reedy.'
      src:
        c: 89da543c
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=348: A-D'
        - 'w.kotz-judgment-days 291–92: all'
      tags:
      - name:johnson-lyndon-b
      - name:reedy-george-e
