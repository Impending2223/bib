      when: Mar. 13
      date: '1965-03-13'
      thread: voting-rights-selma
      also:
      - alabama
      c: 'Wallace to the reporters, three hundred, after his meeting with Johnson: "The President was a gentleman, as he always
        is, and I hope I was a gentleman too. We had a frank and friendly discussion." Later: "Hell, if I''d stayed in there
        much longer, he''d have had me coming out for civil rights."'
      n: '[[w.kotz-judgment-days]], 306. To check: *New York Herald Tribune*, Mar. 14, 1965 (cited by [[w.kotz-judgment-days]],
        306 n.63). See [[cal.1965-03-13.voting-rights]]. Names: Wallace, Johnson.'
      src:
        c: 3b9cf818
        rows:
