      date: '1965-03-12'
      thread: voting-rights-selma
      also:
      - alabama
      c: 'Wallace by telegram to the White House, released to the press before it arrives: an appointment with the President
        "at the earliest possible moment" on the stalemate at Selma; "The situation existing in Selma poses some of the greatest
        internal problems ever faced by the nation."'
      n: '[[w.kotz-judgment-days]], 303. To check: UPI-202, Mar. 12, 1965; Daily Diary Backup, Mar. 12, 1965, LBJ Library
        (cited by [[w.kotz-judgment-days]], 303 n.51). See [[cal.1965-03-07.voting-rights]]. Names: Wallace, Johnson.'
