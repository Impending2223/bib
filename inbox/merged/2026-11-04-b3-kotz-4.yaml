    set:
      c: 'In the House, of Selma: Vanik would close Alabama''s defense and space installations while the State "chooses to
        declare war on the U.S. Constitution"; "The shame of Selma is the shame of America." Wayne Hays proposes cutting Alabama''s
        delegation in half. That day forty-three Representatives and seven Senators call in Congress for a voting bill at
        once.'
      n: '[111 Cong. Rec. 4403–04](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-3-1.pdf#page=2)
        (Mar. 9, 1965) (Vanik; Hays). [[w.mann-walls-of-jericho]], 454 (the words and proposals). [[w.kotz-judgment-days]],
        298–99 (the count). Check: the words against the Record. To check: [[w.fairclough-to-redeem-the-soul]], 247; [[w.garrow-protest-at-selma]],
        87–103 (cited by [[w.kotz-judgment-days]], 299 n.42). See [[cal.1965-03-07.voting-rights]]. Names: Vanik, Hays.'
      src:
        c: 5b3df68d
        rows:
