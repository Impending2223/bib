        Jr., Shelley Winters, Anthony Perkins, Nina Simone, Odetta, Tony Bennett, Dick Gregory, Nipsey Russell, Nichols and
        May.'
      n: '[[w.kotz-judgment-days]], 322–23. To check: Renata Adler, *The New Yorker*, Apr. 10, 1965 (cited by [[w.kotz-judgment-days]],
