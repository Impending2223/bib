      also:
      - alabama
      c: 'Johnson to Wallace, late afternoon, the telegram not yet in: "I am willing to see you on any matter of mutual interest
        and concern. I will be available in my office at any time that is convenient to you."'
      n: '[[w.kotz-judgment-days]], 303. To check: Johnson to George Wallace, telegram, Mar. 12, 1965, White House Central
        Files, HU 2/ST 1, LBJ Library (cited by [[w.kotz-judgment-days]], 303 n.51). See [[cal.1965-03-12.voting-rights-selma]].
