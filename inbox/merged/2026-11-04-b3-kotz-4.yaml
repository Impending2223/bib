- add:
    entry:
      id: cal.1965-03-11.voting-rights-3
      when: Mar. 11
      date: '1965-03-11'
      thread: voting-rights
      also:
      - voting-rights-selma
      c: 'Johnson with his advisers, again, on troops for Alabama, by Goodwin''s account: "If I just send in federal troops
        with their big black boots, it will look like Reconstruction all over again"; "I may have to send in troops, but not
        until I have to, not until everyone can see I had no other choice." Of Wallace: "it''s his ox that''s in the ditch.
        Let''s see how he gets him out."'
      n: '[[w.kotz-judgment-days]], 303–04. To check: [[w.goodwin-remembering-america]], 320–21 (cited by [[w.kotz-judgment-days]],
        304 n.52). Check: the day ("the previous day" before Mar. 12). See [[cal.1965-03-07.voting-rights]]. Names: Johnson,
        Goodwin, Wallace.'
      src:
        c: e7ecf141
        rows:
        - 'w.kotz-judgment-days 303–04: all'
      tags:
      - name:johnson-lyndon-b
      - name:goodwin-richard-n
      - name:wallace-george-c
- cite:
    id: cal.1965-03-12.voting-rights
    item: '[[w.kotz-judgment-days]], 302–03 (from 10 a.m., two hours with Fauntroy and the civil rights and church leaders,
      two more with the National Council of Churches'' bishops and officials; two battalions on alert within an hour of Selma
      through Mar. 9; the Government a party to the SCLC''s suit; Wallace to be made to use the Guard; the demonstrations
      keep Lynda and Luci from sleep; the bill by Monday or Tuesday)'
    units: A-B
- src:
    id: cal.1965-03-12.voting-rights
    rows:
