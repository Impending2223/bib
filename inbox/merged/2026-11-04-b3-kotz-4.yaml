      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - alabama
      c: 'Wallace, of the troopers on Mar. 7: "We saved [the marchers''] lives by stopping that march." Of the next day''s:
        "It has always been my policy to use the least force possible."'
      n: '[[w.kotz-judgment-days]], 291. To check: "Wallace Says Police Saved Negro Lives," *New York Times*, Mar. 9, 1965,
        pp. 1, 23 (cited by [[w.kotz-judgment-days]], 291 n.25). Check: the day (reported Mar. 9). See [[cal.1965-03-07.voting-rights]].
        Names: Wallace.'
      src:
        c: 38706c08
        rows:
        - 'w.kotz-judgment-days 291: all'
        - 'via x.1965-03-09.nyt-wallace-says-police-saved-negro-lives: all'
      tags:
      - name:wallace-george-c
- cite:
    id: cal.1965-03-08.voting-rights-selma-2
    item: '[[w.kotz-judgment-days]], 291 ("It looks like he wants a way out"; King too "wants a way out"; to join King''s
      suit would look like "advocating the goddamn march"; Hill: "You''ve got a hell of a dilemma")'
    units: A
- src:
    id: cal.1965-03-08.voting-rights-selma-2
    rows:
