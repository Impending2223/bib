    item: '[[w.kotz-judgment-days]], 300–301 (in at 11:20 a.m. by Youngblood''s word; Johnson against Lee White''s advice
      to eject and arrest them; "Let them eat and drink, but don''t let them go to the bathroom"; White, Moyers and Clifford
      Alexander sent to ask them to meet him; Youngblood''s five teams, a Negro and a white officer each, take the ten out
      five exits)'
    units: A-C
