      c: 'King to Johnson by telephone after the address, from Montgomery: "It is ironic, Mr. President, that after a century,
        a southern white President would help lead the way toward the salvation of the Negro." Johnson: "You''re the leader
        who is making it all possible. I''m just following along trying to do what''s right."'
      n: '[[w.kotz-judgment-days]], 314. To check: [[w.goodwin-remembering-america]], 310 (cited by [[w.kotz-judgment-days]],
