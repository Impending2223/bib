      date: '1965-03-07'
      thread: voting-rights-selma
      also:
      - civil-rights-the-executive
      c: 'The White House press office, of Selma, that evening: the President "keeping fully informed about the latest developments."
        The Justice Department: observers on the scene, "closely informed."'
      n: '[[w.kotz-judgment-days]], 287. To check: "Johnson Kept Informed," *New York Times*, Mar. 8, 1965, p. 20 (cited by
        [[w.kotz-judgment-days]], 287 n.17). See [[cal.1965-03-07.voting-rights]]. Names: Johnson.'
      src:
        c: 1e65f7d6
        rows:
        - 'w.kotz-judgment-days 287: all'
        - 'via x.1965-03-08.nyt-johnson-kept-informed: all'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-03-07.voting-rights-selma-2
      when: Mar. 7
      date: '1965-03-07'
      thread: voting-rights-selma
      also:
      - alabama
      c: 'Montgomery. Wallace, no official comment on the bridge; to reporters, leaving his office: "These folks in Selma
        have made this a seven-day-a-week job, but we can''t give in one inch. We''re going to enforce state laws."'
      n: '[[w.kotz-judgment-days]], 287. To check: "Dr. King Announces Plan for New Walk and Assails Attack," *New York Times*,
        Mar. 8, 1965, p. 20; [[w.young-easy-burden]], 357 (cited by [[w.kotz-judgment-days]], 287 n.19). See [[cal.1965-03-07.voting-rights]].
        Names: Wallace.'
      src:
        c: 5f496244
        rows:
        - 'w.kotz-judgment-days 287: all'
        - 'via x.1965-03-08.nyt-dr-king-announces-plan-for-new-walk: all'
      tags:
      - name:wallace-george-c
- add:
    entry:
      id: cal.1965-03-08.voting-rights-selma-5
      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - civil-rights-the-executive
      c: 'Johnson and Buford Ellington by telephone, 8:29 a.m.: "The biggest problem we have in the Alabama situation is communicating
        with George Wallace." Ellington: his relations with Wallace "very good, but you can''t trust him." Johnson''s line
        for Wallace: "they say if we can send them into Vietnam, we can send them in to protect Americans." Ellington to arrange
        a talk with Wallace, with Katzenbach, and tape it.'
      n: '[[w.kotz-judgment-days]], 288–89. To check: [Johnson and Ellington, 8:29 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-buford-ellington-march-8-1965),
        Conversations WH6503-03-7031 and 7032 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 289 n.21). See
        [[cal.1965-03-08.voting-rights-selma]]. Names: Johnson, Ellington, Wallace, Katzenbach.'
      src:
        c: a44a6167
        rows:
        - 'w.kotz-judgment-days 288–89: all'
        - 'via x.1965-03-08.johnson-and-ellington-telephone-8-29: all'
      tags:
      - name:johnson-lyndon-b
      - name:ellington-buford
      - name:wallace-george-c
      - name:katzenbach-nicholas
- check:
    id: cal.1965-03-08.voting-rights-selma
    text: 'Check: the Miller Center''s catalogue holds a second call with Katzenbach that morning, 8:38 a.m., Conversation
      WH6503-03-7033, the one Kotz''s note names (288 n.20).'
- add:
    entry:
      id: cal.1965-03-08.voting-rights-selma-6
      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - king
      - civil-rights-the-executive
      c: 'King to Louis Martin of the Democratic National Committee by telephone, in the morning: if the President names a
        top aide to mediate at Selma, "such an action would give [him] a reason for calling off the march" of Mar. 9; else
        federal marshals against more brutality. Martin passes it to Watson for Johnson.'
      n: '[[w.kotz-judgment-days]], 289–90. To check: Louis Martin to Marvin Watson, Mar. 8, 1965, Daily Diary Backup, LBJ
        Library (cited by [[w.kotz-judgment-days]], 290 n.22). See [[cal.1965-03-07.voting-rights]]. Names: Martin Luther
        King, Watson, Johnson.'
      src:
        c: 9cc190d6
        rows:
        - 'w.kotz-judgment-days 289–90: all'
        - 'via x.1965-03-08.louis-martin-to-marvin-watson-mar: all'
      tags:
      - name:king-martin-luther-jr
      - name:watson-w-marvin
      - name:johnson-lyndon-b
