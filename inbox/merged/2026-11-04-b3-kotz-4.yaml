    item: '[[w.kotz-judgment-days]], 307–08 (Johnson asks the leaders'' leave to address a joint session at nine Monday night,
      the first President to bring a message in person in nineteen years; Lady Bird Johnson''s diary: he missed his nap for
      the meeting the leaders asked)'
