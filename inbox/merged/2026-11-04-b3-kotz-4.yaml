      - confirmations
      c: 'Dirksen and Johnson by telephone, 9:30 a.m.: the Republican seats on the Federal Trade Commission and the Federal
        Power Commission, Dirksen to pick them; his man for the FPC, Carl Bagge, opposed. Dirksen to have his nominees, Johnson
