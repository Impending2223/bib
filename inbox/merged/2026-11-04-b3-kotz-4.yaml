- edit:
    id: cal.1965-03-28.king
    base: 2e80bf12
    set:
      c: 'King on *Meet the Press*, from San Francisco. Asked of Truman''s word for the Selma march, "silly": "the march was
        not silly at all." The march for the voting bill, and against the bombings and murders, "as much as to gain the right
        to vote." Demonstrations "the best way" to keep the issues before the public. An "economic withdrawal" from Alabama:
        unions, businesses and the Government to boycott its goods and its banks; Alabamians to withhold State taxes.'
      n: '[[w.branch-at-canaans-edge]], 183–84. [[w.kotz-judgment-days]], 326 (the boycott: an end to a "reign of terror").
        To check: transcript, *Meet the Press*, Mar. 28, 1965, SCLC Records, King Library and Archives (cited by [[w.branch-at-canaans-edge]],
        183); Laurence Stern, "King Urges National Boycott of Alabama, U.S. Funds Removal," *Washington Post*, Mar. 29, 1965,
        p. A1 (cited by [[w.kotz-judgment-days]], 327 n.13). See [[cal.1965-03-21.voting-rights]]. Names: Martin Luther King,
        Truman.'
      src:
        c: e0e80de3
        rows:
        - 'w.branch-at-canaans-edge 183–84: A-D'
        - 'via w.branch-at-canaans-edge 183 n.i-would-say: A-D'
        - 'w.kotz-judgment-days 326: A, E-F'
