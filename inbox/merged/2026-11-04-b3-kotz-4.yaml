      c: 'House Judiciary, Subcommittee No. 5, opens hearings on H.R. 6400, Katzenbach the first witness. Celler: "The murder,
        savage brutality, and violence" in Alabama "have so aroused the nation as to make action by the Congress necessary
        and speedy."'
