      when: Mar. 8–9, night
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - civil-rights-the-executive
      c: Johnson wakes LeRoy Collins, director of the Community Relations Service, and sends him to Selma in a presidential
        plane, to broker a compromise between King and Alabama's officers.
      n: '[[w.kotz-judgment-days]], 293. To check: *Where He Stood*, television documentary on Collins (WFSU-TV, 1990) (cited
        by [[w.kotz-judgment-days]], 293 n.31). Check: the hour. See [[cal.1965-03-07.voting-rights]]. Names: Johnson, Collins,
        Martin Luther King.'
      src:
        c: dd4aea6b
        rows:
        - 'w.kotz-judgment-days 293: all'
        - 'via x.1990.where-he-stood-wfsu: all'
      tags:
      - name:johnson-lyndon-b
      - name:collins-leroy
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1965-03-08.voting-rights-selma-13
      when: Mar. 8–9, night
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - king
      c: 'King and Andrew Young in a conference call with Greenberg, Clarence Jones, Rustin and Harry Wachtel in New York.
        King, depressed: Judge Johnson''s order says "the robber can continue to rob for three more days and we will give
        you a hearing on whether the robber was wrong"; nothing in it of moral principle.'
      n: '[[w.kotz-judgment-days]], 293–94. To check: [[w.greenberg-crusaders-in-the-courts]], 356–57; [[w.garrow-bearing-the-cross]],
        402 (cited by [[w.kotz-judgment-days]], 294 n.32). See [[cal.1965-03-07.voting-rights]]. Names: Martin Luther King,
        Andrew Young, Greenberg, Rustin, Frank Johnson.'
      src:
        c: bb0fb7d4
        rows:
        - 'w.kotz-judgment-days 293–94: all'
      tags:
      - name:king-martin-luther-jr
      - name:young-andrew-j-jr
      - name:greenberg-jack
      - name:rustin-bayard
      - name:johnson-frank-m-jr
- add:
    entry:
