      also:
      - voting-rights-selma
      c: 'Wilkins of the NAACP: should a second march meet such violence, the demonstrators might shoot back. Of the Marines
        landed in Vietnam: "Damn it, they can send somebody to Alabama, and defend the government right here."'
      n: '[[w.kotz-judgment-days]], 290–91. To check: *New York Times*, Mar. 9, 1965, pp. 23–24 (cited by [[w.kotz-judgment-days]],
        291 n.24). Check: the day (reported Mar. 9). See [[cal.1965-03-07.voting-rights]]. Names: Wilkins.'
      src:
        c: cbed9ef5
        rows:
        - 'w.kotz-judgment-days 290–91: all'
        - 'via x.1965-03-09.nyt-pp-23-24-selma-reaction: all'
      tags:
      - name:wilkins-roy
- add:
