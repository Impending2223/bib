- add:
    entry:
      id: cal.1965-03-09.civil-rights-the-executive
      when: Mar. 9
      date: '1965-03-09'
      thread: civil-rights-the-executive
      also:
      - voting-rights-selma
      c: 'Washington. Some 700 in a vigil on the White House sidewalk, its second day; some 600 in Lafayette Park: "LBJ, just
        you wait! See what happens in ''68!" A sit-in at the Justice Department, SNCC''s, larger than the day before''s; 120
        carried out at nightfall.'
      n: '[[w.kotz-judgment-days]], 298. To check: *New York Times*, Mar. 10, 1965, p. 1 (cited by [[w.kotz-judgment-days]],
        298 n.40). See [[cal.1965-03-07.voting-rights]]. Names: Johnson.'
      src:
        c: 700a9234
        rows:
        - 'w.kotz-judgment-days 298: all'
        - 'via x.1965-03-10.nyt-p1-selma: all'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-03-09.civil-rights-the-executive-2
      when: Mar. 9
      date: '1965-03-09'
      thread: civil-rights-the-executive
      also:
      - voting-rights-selma
      c: 'Humphrey, in the afternoon at the Executive Office Building, with the civil rights and church leaders Fauntroy of
        SCLC has brought together. His report to Johnson, Mar. 10: "deep concern and disappointment that the federal government
        had not taken more decisive action"; "Several persons expressed the view that the federal government was playing ''politics''
        with the situation."'
      n: '[[w.kotz-judgment-days]], 298. To check: Vice President to the President, Mar. 10, 1965, Marvin Watson, aides file,
        box 31, LBJ Library (cited by [[w.kotz-judgment-days]], 298 n.41). See [[cal.1965-03-07.voting-rights]]. Names: Humphrey,
        Johnson.'
      src:
        c: b8acc9a5
        rows:
        - 'w.kotz-judgment-days 298: all'
        - 'via x.1965-03-10.humphrey-to-johnson-mar-10-1965: all'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
