      c: At night, briefing members of Congress on the voting bill, Johnson learns that Reeb has died. With Lady Bird Johnson
        and Humphrey, in the family quarters, he telephones Reeb's wife and father.
      n: '[[w.kotz-judgment-days]], 301. To check: [[w.johnson-white-house-diary]], 251 (cited by [[w.kotz-judgment-days]],
