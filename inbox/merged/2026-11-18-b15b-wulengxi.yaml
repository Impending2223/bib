      at: before 1960-03-01
      c: Politburo meeting, Mao presiding, in the first days of March by Wu Lengxi's account. Zhou Enlai to visit Burma, India, Nepal and other states. Lenin's writings on imperialism, war and peace, proletarian revolution and the colonies to be gathered into pamphlets; articles to be drafted, and a mass meeting held, for Lenin's ninetieth anniversary.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 253. Made public: 1999. Names: Mao Zedong, Zhou Enlai. Check: the day and place; Mao was at Canton on Mar. 3 and 7 (see [[cal.1960-03-03.china-leadership]]).'
      tags:
